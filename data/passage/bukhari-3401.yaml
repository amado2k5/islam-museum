label: { ar: "البخاري 3401 — موسى والخضر", en: "Bukhari 3401 — Musa and al-Khidr", es: "Bujari 3401 - Musa y al-Khidr", fr: "Boukhari 3401 — Moussa et al-Khidr", ur: "بخاری 3401 - موسی و الخضر", tr: "Buhari 3401 - Musa ve Hızır", id: "Bukhari 3401 — Musa dan Al-Khidr" }
text: "قام موسى خطيباً في بني إسرائيل فسئل: أي الناس أعلم؟ فقال: أنا، فعتب الله عليه إذ لم يرد العلم إليه، فأوحى الله إليه إن لي عبداً بمجمع البحرين هو أعلم منك"
summary:
  ar: "في كتاب أحاديث الأنبياء باب حديث الخضر؛ رواية ابن عباس عن أبي بن كعب، وتوثيقه أن موسى صاحب الخضر هو موسى بن عمران نفسه رداً على نوف البكالي — مفتاح قصة العلم اللدني في الصحيح."
  tr: "Peygamberlerin hadisleri kitabında, Hızır hadisi bölümünde; İbn Abbas'ın Ubeyy ibn Ka'b'dan rivayet ettiği ve Hızır'ın arkadaşı Musa'nın, bizzat Musa ibn İmran olduğunu belgeleyen, Nevfül-Bakali'ye cevaben yazdığı hadis, Sahih'teki ilahi bilginin anahtarıdır."
  id: "Dalam kitab hadits para nabi, bab tentang hadits Al-Khidr; riwayat Ibnu Abbas dari Ubayy ibn Ka’b, dan dokumentasinya bahwa Musa, sahabat Al-Khidr, adalah Musa ibn Imran sendiri, sebagai tanggapan terhadap Nawf Al-Bakali — kunci kisah pengetahuan ilahi dalam Sahih."
