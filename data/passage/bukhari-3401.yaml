text: "قام موسى خطيباً في بني إسرائيل فسئل: أي الناس أعلم؟ فقال: أنا، فعتب الله عليه إذ لم يرد العلم إليه، فأوحى الله إليه إن لي عبداً بمجمع البحرين هو أعلم منك"
summary:
  ar: "في كتاب أحاديث الأنبياء باب حديث الخضر؛ رواية ابن عباس عن أبي بن كعب، وتوثيقه أن موسى صاحب الخضر هو موسى بن عمران نفسه رداً على نوف البكالي — مفتاح قصة العلم اللدني في الصحيح."
