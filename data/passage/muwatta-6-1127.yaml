label: { ar: "الموطأ 1127 — يحيى بن سعيد عن سعيد بن المسيب: رجل وقع بامرأته وهو محرم، فبعث إلى المدينة يسأل، فقال بعض الناس: يفرق بينهما إلى عام قابل؛ فقال سعيد: لينفذا لوجههما فليتما حجهما الذي أفسدا، ثم عليهما الحج والهدي من قابل ويفترقان حتى يقضيا حجهما", en: "Muwatta 1127" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول: ما ترون في رجل وقع بامرأته وهو محرم؟ فلم يقل له القوم شيئاً. فقال سعيد: إن رجلاً وقع بامرأته وهو محرم، فبعث إلى المدينة يسأل، فقال بعض الناس: يُفرق بينهما إلى عام قابل. فقال سعيد: لينفذا لوجههما، فليتما حجهما الذي أفسدا، فإذا فرغا رجعا. فإن أدركهما حج قابل فعليهما الحج والهدي، ويهلان من حيث أهلا بحجهما الذي أفسدا، ويتفرقان حتى يقضيا حجهما. قال مالك: يُهديان جميعاً بدنة بدنة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1231). {cite:muwatta-maruf-1997 p.514}"
