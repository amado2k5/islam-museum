label: { ar: "الموطأ 1127 — يحيى بن سعيد عن سعيد بن المسيب: رجل وقع بامرأته وهو محرم، فبعث إلى المدينة يسأل، فقال بعض الناس: يفرق بينهما إلى عام قابل؛ فقال سعيد: لينفذا لوجههما فليتما حجهما الذي أفسدا، ثم عليهما الحج والهدي من قابل ويفترقان حتى يقضيا حجهما", en: "Muwatta 1127", es: "Muwatta 1127", fr: "Muwatta 1127", ur: "موطا 1127", tr: "El-Muvatta 1127 — Yahya ibn Sa’id, Sa’id ibn al-Musayyab’dan rivayetle: Bir adam ihramlı haldeyken karısıyla cinsel ilişkiye girdi. Bunun üzerine Medine’ye soruşturma için adamlar gönderdi. Bazıları: “Bir sonraki yıla kadar ayrı kalmalıdırlar” dedi. Sa’id şöyle buyurdu: “Yollarına devam etsinler ve geçersiz sayılan Hac ibadetlerini tamamlasınlar. Sonra bir sonraki yıl Hac ibadetini yerine getirip kurban kessinler ve Hac ibadetlerini tamamlayana kadar ayrı kalsınlar.”", id: "Al-Muwatta 1127 — Yahya ibn Sa’id, berdasarkan riwayat Sa’id ibn al-Musayyab: Seorang pria bersetubuh dengan istrinya saat dalam keadaan ihram, lalu ia mengirim utusan ke Madinah untuk bertanya. Sebagian orang berkata: Mereka harus berpisah sampai tahun berikutnya. Sa’id berkata: Biarkan mereka melanjutkan perjalanan mereka dan menyelesaikan ibadah haji yang telah mereka batalkan. Kemudian mereka harus melaksanakan ibadah haji dan menyembelih hewan kurban pada tahun berikutnya, dan mereka harus berpisah sampai mereka menyelesaikan ibadah haji mereka." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول: ما ترون في رجل وقع بامرأته وهو محرم؟ فلم يقل له القوم شيئاً. فقال سعيد: إن رجلاً وقع بامرأته وهو محرم، فبعث إلى المدينة يسأل، فقال بعض الناس: يُفرق بينهما إلى عام قابل. فقال سعيد: لينفذا لوجههما، فليتما حجهما الذي أفسدا، فإذا فرغا رجعا. فإن أدركهما حج قابل فعليهما الحج والهدي، ويهلان من حيث أهلا بحجهما الذي أفسدا، ويتفرقان حتى يقضيا حجهما. قال مالك: يُهديان جميعاً بدنة بدنة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1231). {cite:muwatta-maruf-1997 p.514}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle şöyle aktarmıştır: Yahya ibn Sa'id, Sa'id ibn al-Musayyab'ın şöyle dediğini işitti: \"İhramlı haldeyken karısıyla cinsel ilişkiye giren bir adam hakkında ne düşünüyorsunuz?\" İnsanlar ona hiçbir şey söylemediler. Sa'id dedi ki: \"Bir adam ihramlı haldeyken karısıyla cinsel ilişkiye girdi, bu yüzden Medine'ye sorması için adam gönderdi. Bazıları: 'Bir sonraki yıla kadar ayrı kalsınlar' dedi. Sa'id dedi ki: 'Yollarına devam etsinler ve geçersiz sayılan Haclarını tamamlasınlar. Haclarını bitirdikten sonra geri dönsünler. Bir sonraki Hac mevsimi gelirse, Hac yapsınlar ve kurban kessinler. Geçersiz sayılan Hac için ihrama girdikleri yerden ihrama girsinler ve Haclarını tamamlayana kadar ayrı kalsınlar.' Malik dedi ki: 'İkisi de kurban kessinler.'\" Araştırmacı, Ebu Mus'ab'ın (1231) bunu Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.514}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, yang mendengar Sa'id ibn al-Musayyab berkata: \"Bagaimana pendapat kalian tentang seorang pria yang bersetubuh dengan istrinya saat dalam keadaan ihram?\" Orang-orang tidak menjawabnya. Sa'id berkata: \"Seorang pria bersetubuh dengan istrinya saat dalam keadaan ihram, lalu ia mengirim utusan ke Madinah untuk bertanya. Sebagian orang berkata: 'Mereka harus berpisah sampai tahun berikutnya.' Sa'id berkata: 'Biarkan mereka melanjutkan perjalanan mereka dan menyelesaikan haji yang mereka batalkan. Setelah selesai, mereka harus kembali. Jika musim haji berikutnya tiba, mereka harus melaksanakan haji dan mempersembahkan hewan kurban. Mereka harus memasuki ihram dari tempat yang sama seperti saat mereka memasuki ihram untuk haji yang mereka batalkan, dan mereka harus berpisah sampai mereka menyelesaikan haji mereka.' Malik berkata: 'Mereka berdua harus mempersembahkan hewan kurban.'\" Peneliti menyebutkan bahwa Abu Mus'ab (1231) meriwayatkan hadits ini atas otoritas Malik. {cite:muwatta-maruf-1997 p.514}"
