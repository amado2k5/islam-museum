text: "… حقاً أو مبطلًا، هذا كتابُ اللّٰه تبارك وتعالى يَنطق علينا وعليكم بالحق، إنا كُنا نستنسخُ ما كنتم تعملون، ورسلنا يكتبون ما تمكرون ، اتركوا صاحب كتابي هذا ، وانطلقوا الى عبدة الأصنام ، وإلى من يزعم أنَّ مع اللّٰه إلها …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 3246، يذكر كتاب الأعمال والكاتبون؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 3246, that speaks of the record of deeds and its scribes; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 3246 کا اقتباس جس میں نامۂ اعمال اور لکھنے والے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 3246, que habla del registro de hechos y sus escribas; de la copia extraída, citada en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Dala'il al-Nubuwwa d'al-Bayhaqi, p. 3246, qui parle du registre des actes et de ses scribes; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 3246. sayfasından, Amel ve Yazarlar Kitabı'ndan bahseden bir bölüm; alıntılanan versiyondan ve kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Bayhaqi “Bukti Kenabian”, hlm. 3246, yang menyebutkan Kitab Amal dan Para Penulis; dari versi yang diekstrak, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
