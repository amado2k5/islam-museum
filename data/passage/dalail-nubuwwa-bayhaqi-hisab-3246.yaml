text: "… حقاً أو مبطلًا، هذا كتابُ اللّٰه تبارك وتعالى يَنطق علينا وعليكم بالحق، إنا كُنا نستنسخُ ما كنتم تعملون، ورسلنا يكتبون ما تمكرون ، اتركوا صاحب كتابي هذا ، وانطلقوا الى عبدة الأصنام ، وإلى من يزعم أنَّ مع اللّٰه إلها …"
