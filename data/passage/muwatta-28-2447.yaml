summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن بن يعقوب عن أبيه عن أبي هريرة أن النبي نهى أن يُنبذ في الدباء والمزفت. {cite:muwatta-maruf-1997 p.411}"
  tr: "Malik, Alaa bin Abdülrahman bin Yakub'dan, o da babasından, o da Ebu Hurayra'dan rivayetle, Peygamber'in hurmanın kabaklarda ve katranlı kaplarda mayalanmasını yasakladığını nakletmiştir. {cite:muwatta-maruf-1997 s.411}"
  id: "Malik meriwayatkan dari Alaa bin Abd al-Rahman bin Yaqoub, dari ayahnya, dari Abu Hurairah, bahwa Nabi melarang fermentasi kurma dalam labu dan wadah yang dilapisi ter. {cite:muwatta-maruf-1997 p.411}"
