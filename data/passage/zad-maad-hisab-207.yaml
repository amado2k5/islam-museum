text: "… عنه، أنه كان يعتمر في السنة مراراً، وقد قال علة : العُمْرَةُ إلى العُمْرَة كَفَّارَةٌ لما بَيْنَهُمَا [البخاري: ١٧٧٣ ، ومسلم: ٣٢٨٩]. ويكفي في هذا، أن النبي يع، أعمرَ عائشة من التَّنعيم سوى عمرتِها التي كانت أهلَّت بها، وذلك في …"
