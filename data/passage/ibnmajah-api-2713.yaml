label: { ar: "سنن ابن ماجه 2713 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan Ibn Majah 2713 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن ابن ماجہ 2713 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Sunan Ibn Majah 2713 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia", fr: "Sunan Ibn Majah 2713 — Testament ou dernières volontés; ce qui a été laissé: biens et héritage" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَيَّاشٍ، حَدَّثَنَا شُرَحْبِيلُ بْنُ مُسْلِمٍ الْخَوْلاَنِيُّ، سَمِعْتُ أَبَا أُمَامَةَ الْبَاهِلِيَّ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ فِي خُطْبَتِهِ عَامَ حِجَّةِ الْوَدَاعِ \" إِنَّ اللَّهَ قَدْ أَعْطَى كُلَّ ذِي حَقٍّ حَقَّهُ فَلاَ وَصِيَّةَ لِوَارِثٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2713، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2713 (The Chapters on Wills), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2713، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2713 (Los capítulos sobre testamentos), menciona un testamento o consejo de despedida, y lo que se dejó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 2713 (Les chapitres sur les testaments), mentionne un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
