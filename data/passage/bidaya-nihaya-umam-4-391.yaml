text: "… حضير وسعد بن معاذ، شهد بدراً وما بعدها إلا تبوك فإنه استخلقه رسول اللّٰه على المدينة في قول، وقيل استخلفه في قرقرة الكدر، وكان فيمن قتل كعب بن الأشرف اليهودي، وقيل إنه الذي قتل مرحباً اليهودي يوم خيبر أيضاً. وقد …"
summary:
