label: { ar: "صحيح مسلم 5320 — الأب والأبوة", en: "Sahih Muslim 5320 — the father and fatherhood", ur: "صحیح مسلم 5320 — باپ اور والدیت", es: "Sahih Muslim 5320 — El padre y la paternidad", fr: "Sahih Muslim 5320 — Le père et la paternité" }
text: "… عَبْدُ بْنُ حُمَيْدٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ، عَنْ عَمْرِو بْنِ يَحْيَى، عَنْ أَبِيهِ، عَنْ أَنَسِ بْنِ مَالِكٍ،. بِهَذِهِ الْقِصَّةِ فِي طَعَامِ أَبِي طَلْحَةَ عَنِ النَّبِيِّ وَقَالَ فِيهِ فَقَامَ أَبُو طَلْحَةَ عَلَى الْبَابِ حَتَّى أَتَى رَسُولُ اللَّهِ فَقَالَ لَهُ يَا رَسُولَ اللَّهِ إِنَّمَا كَانَ شَىْءٌ يَسِيرٌ. قَالَ \" هَلُمَّهُ فَإِنَّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5320، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5320 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5320، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5320 (El Libro de las Bebidas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 5320 (Le Livre des Boissons), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
