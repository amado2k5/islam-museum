label: { ar: "صحيح البخاري 6150 — الأب والأبوة", en: "Sahih al-Bukhari 6150 — the father and fatherhood", ur: "صحیح بخاری 6150 — باپ اور والدیت", es: "Sahih al-Bukhari 6150 — El padre y la paternidad", fr: "Sahih al-Bukhari 6150 — Le père et la paternité" }
text: "حَدَّثَنَا مُحَمَّدٌ، حَدَّثَنَا عَبْدَةُ، أَخْبَرَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتِ اسْتَأْذَنَ حَسَّانُ بْنُ ثَابِتٍ رَسُولَ اللَّهِ فِي هِجَاءِ الْمُشْرِكِينَ فَقَالَ رَسُولُ اللَّهِ \" فَكَيْفَ بِنَسَبِي \". فَقَالَ حَسَّانُ لأَسُلَّنَّكَ مِنْهُمْ كَمَا تُسَلُّ الشَّعَرَةُ مِنَ الْعَجِينِ. وَعَنْ هِشَامِ بْنِ عُرْوَةَ عَنْ أَبِيهِ قَالَ ذَهَبْتُ أَسُبُّ حَسَّانَ عِنْدَ عَائِشَةَ فَقَالَتْ لاَ تَسُبُّهُ فَإِنَّهُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6150، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6150 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6150، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6150 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 6150 (Les bonnes manières et la bienséance), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
