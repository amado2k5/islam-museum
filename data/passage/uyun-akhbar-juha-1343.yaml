text: "… ربّا ولا يَكُنْ لَ المالْ ربَّا تَحْمَدِى غِنَّه غدا أرِينى جوادا مات هَزْلا لعلّنى أرى ما تريْنَ أو بخيلًا مخلدا وقلت ولم أغى الحوابَ تبّنى أكان الهزال حتفّ زيدٍ وأربد! أنفقها كانت له، وما كلّ من أُعطى مالًا أُعطى حمدا، …"
