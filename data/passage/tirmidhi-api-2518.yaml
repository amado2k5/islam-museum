text: "… بْنِ عَلِيٍّ مَا حَفِظْتَ مِنْ رَسُولِ اللَّهِ قَالَ حَفِظْتُ مِنْ رَسُولِ اللَّهِ \" دَعْ مَا يَرِيبُكَ إِلَى مَا لاَ يَرِيبُكَ فَإِنَّ الصِّدْقَ طُمَأْنِينَةٌ وَإِنَّ الْكَذِبَ رِيبَةٌ \". وَفِي الْحَدِيثِ قِصَّةٌ. قَالَ وَأَبُو الْحَوْرَاءِ السَّعْدِيُّ اسْمُهُ رَبِيعَةُ بْنُ شَيْبَانَ. قَالَ وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. حَدَّثَنَا بُنْدَارٌ، حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ بُرَيْدٍ، فَذَكَرَ نَحْوَهُ."
summary:
  ar: "خبر في جامع الترمذي، رقم 2518، في ترك ما يريب إلى ما لا يريب. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Jami' al-Tirmidhi, no. 2518, on leaving what gives doubt for what gives none. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "جامع ترمذی کی روایت نمبر 2518: شک والی چیز چھوڑ کر بے شک چیز اختیار کرنا۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
