summary:
  ar: "القسم 74 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأشربة»، ويضم فيها النصوص من 5575 إلى 5639 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 74 of Sahih al-Bukhari (Drinks) in the division of the open hadith dataset the museum took its reports from: reports 5575 to 5639 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 74، عنوان «کتاب الاشربۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5575 تا 5639۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 74 de Sahih al-Bukhari (Bebidas) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5575 al 5639 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
