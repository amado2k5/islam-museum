text: "- - ولو أوصى بنقله إلى غير هذه الأماكن الفاضلة لا تنفذ وصيته لما في ذلك من تأخير دفنه وتعرضه للتغير. ويحرم كذلك نقله من القبر إلا لغرض صحيح، كأن دفن من غير غسل، أو إلى غير القبلة، أو لحق …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 565، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 565, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 565 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 4, pág. 565, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 4, page 565, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Seyyid Sabiq'in *Fıkıh el-Sünne* adlı eserinin 4. cildinin 565. sayfasından bir alıntı, vasiyet veya son ahit, defin, mezar ve türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Vasiyetler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Fiqh al-Sunnah* karya Sayyid Sabiq, Jilid 4, halaman 565, menyebutkan wasiat atau perjanjian terakhir, pemakaman, kuburan, dan makam; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh Wills, Inheritance, Antiquities, and Shrines Browser."
