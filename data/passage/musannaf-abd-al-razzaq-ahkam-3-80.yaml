text: "… الثَّوْرِيِّ، عَنْ حَمَّادٍ، قَالَ : سَأَلْتُ إِبْرَاهِيمَ وَسَعِيدَ بْنَ جُبَيْرٍ عَنْ رَجُلٍ عَلَيْهِ أَيَّامٌ مِنْ رَمَضَانَ، أَيَتَطَوَّعُ فِي الْعَشْرِ؟ قَالَا : يَبْدَأُ بِالْفَرِيضَةِ. • عبد الرزاق، عَنِ الثَّوْرِيِّ، عَنِ الْأَسْوَدِبْنِ قَيْسٍ، أَنَّ عُمَرَ كَانَ يَسْتَحِبُّ أَنْ يُقْضَىٰ رَمَضَانُ فِي الْعَشْرِ. …"
summary:
