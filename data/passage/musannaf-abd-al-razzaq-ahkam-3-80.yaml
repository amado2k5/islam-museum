text: "… الثَّوْرِيِّ، عَنْ حَمَّادٍ، قَالَ : سَأَلْتُ إِبْرَاهِيمَ وَسَعِيدَ بْنَ جُبَيْرٍ عَنْ رَجُلٍ عَلَيْهِ أَيَّامٌ مِنْ رَمَضَانَ، أَيَتَطَوَّعُ فِي الْعَشْرِ؟ قَالَا : يَبْدَأُ بِالْفَرِيضَةِ. • عبد الرزاق، عَنِ الثَّوْرِيِّ، عَنِ الْأَسْوَدِبْنِ قَيْسٍ، أَنَّ عُمَرَ كَانَ يَسْتَحِبُّ أَنْ يُقْضَىٰ رَمَضَانُ فِي الْعَشْرِ. …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 3، ص 80، يرد فيه ذكر الفريضة والفرائض، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 3, p. 80, whose wording mentions the obligation (farida), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 3، ص 80 کا اقتباس جس میں فریضہ اور فرائض، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
