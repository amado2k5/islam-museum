  tr: "Musannaf Abd al-Razzaq'ın 3. cildinin 80. sayfasından, farz olan amelleri, müstehap olan amelleri ve diğer ilgili konuları ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan amelleri, görevleri, itaat amellerini, müstehap olan amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları incelemeye uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid 3, halaman 80, yang menyebutkan amalan wajib, amalan anjuran, dan hal-hal terkait lainnya. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
