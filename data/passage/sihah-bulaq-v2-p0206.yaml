text: |-
  ٢٨١
  قلت مزان وتصغير مزدان مزين مثل مخير تصغير مختارومزيين اذاءوضت كما تقول فى ابمع
  حىّ اين رحزايين ويقال أزينت الارض بعنبها وازينت مغله وأصله تزينت فسكنت التساء.
  وأدغمت فى الزاى واجتلبت الااف ليصح الابتداء وقول الشاعراين عبدل
  أيثت على يغن تزفك تسعة • كأنك ديك ماثل الزين أعود
  بدى عرفه
  (فصل لسين (س تن أبو عبيد الاستن أصول الشجر البالية الواحسدة أستنة قال
  النابغة تحيد عن أستن سود أسافله • مثل الاماء الفوادى تحمل الحزما
  جن لسجن الحبس والسحن بالفتح المصدر وقد سيجنه يسجنه أى حبسه وضرب سجين
  أى شديد قال ابن مقبل
  ورجلة بضربون الهام عن عرج * ضربانوامت به الابطال مصنا
  وسحين موضع فيه كتاب الفجار قال ابن عياس وضى اللّٰه عنه-ماودوا وينهم قال أبو عبيد:
  هو فعيل من السجن كالفسيق من الفسق ⁦(Üحن)⁩ السصنة بالتحريك الهيئة وقد يسكن
  يقال هؤلاء قوم حسن سحنتهم وكذلك السحناء ويقال انه لحسن السحناء وكان الفراء
  يقول السحناه والنأداء بالتحريك قال أبو عبيدولم أسمع أحدايقولهما باتتحريك غيره وقال
  ابن كيسان انماحة كالمكان حرف الحلق والمساحنسة جسن المعاشرة والمخالطة وتسحنت
  المال فرأيت مناء، حسنة وفرس مسحنة حسنة المنظروصنت الحجركسرته والمسحنة التى
  أكسر بها المحجارة ( نخن السخن بالضم الحار وحذن الماءوغيره بالفتح وسذن أيضا
  يااضم نحونة فيهما ويروى قول لبيد
  رفه تها طرد النعام وفوقه:ل:،حتى اذاسخنت وخف عظامها
  يا لفتح والضم وتسضين الماء واسخانه بهنى قال ابن الاعرابيّ ماء مسخن وسبخين مثل مترص
  وتريص ومبرم وبريم وأنشد لعمرو
  مشعشعة كأنَ الحصّ فيها • اذا ما الماءخالطها سخينا
  قال وأمّا قول من قال جد نا بأموالنافليس بشى وماءسذاخين على فعاعيل بالضم وليس
  فى كلام العرب غيره والمسخنة قدركاً نهانور ويوم سخن وساخن وسخنات أى حارّ وليلة
  سخنة وسخمائة وانى لاجسد فى نفسى سنخنة بالتحريك وهى فضل حرارة تجدها مع وجع
  وسحفة العين نقيض قرتها وقد سنخنت عينه بالمكسر فهو سخين العين وأسنخن اللّٰه عينه أى
  أبكاه والسخون من المرق ما يسخن قال الراجر
  يحجبه السخون والعصيد • والتمرحباماله مزيد
  وبروى حتى والسخينة طعام يتخذمن الدقيق دون العصيدة فى الرقة وفوق الحساء والمما
  إكلون السخينة والنفيتة فى شدة الدهروغلاه السمروعجف المال وكانت قريش تعنه
  حا والسخين مسحاة منعطفة بلمغة عبد القيس والتساخين الخفاف وفى الحديث أنه عليه
  السلام أمن هم أن يسهواعلى المناوذ والتساخين ولا واحدلها مثل التعائيب ر(سددن
  السادن خادم السكعبة وبيت الاصنام والمع السدنة وقدسدن يسدن بالضم -دناوسدانة
  وكانت السدانة واللواء لبى عبد الدارف الجاهلية فأقرها الذىّ صلى اللّٰه عليه وسلم امسم فى
  صحاح
