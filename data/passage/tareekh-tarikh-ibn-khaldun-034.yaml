text: "في خطابه فأوقع به ونفاه، وحبس كاتبه إسحاق بن يعقوب، سليمان بن وهب، وأودع كتاب عهدهما في الكعبة. وخرج أخوه حاجا، وسار من هنالك إلى العراق، ووصف عن الجمل، وشكا الموفق الحاجة إلى المال. وأستخلف عليه موسى بن بغا، واستكتب"
