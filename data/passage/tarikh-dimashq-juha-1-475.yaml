text: "… المهملة حابس بن سعيد الطائى اليمانى الصحابى حاتم بن شفى الهمذانى حاتم الطانى الجواد المشهود حاتم بن النعمان الباهلى المخصوف الجرجانى حاجب الفرقانى حاجب البرجمى البصرى حاجب المؤدب الاعور حارثة بن بدر الغدائى التميمى البصرى ونوادره حارثة القتبى سارثة بن …"
summary:
  ar: "مقطع من تاريخ مدينة دمشق، المجلد المصوَّر 1، ص 475، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Ta'rikh Madinat Dimashq, scan volume 1, p. 475, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "Ta'rikh Madinat Dimashq، اسکین جلد 1، ص 475 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ta'rikh Madinat Dimashq, volume numérisé 1, p. 475, avec une anecdote ou un trait d'esprit ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Ta'rikh Madinat Dimashq, volumen escaneado 1, p. 475, con una anécdota o agudeza; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Şam Tarihi, Resimli Cilt 1, sayfa 475'ten, esprili bir anekdot veya mizahi bir hikaye içeren bir alıntı; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Damaskus, Jilid Bergambar 1, halaman 475, berisi anekdot cerdas atau cerita lucu; diambil dari versi pindaian yang dapat dibaca mesin, dengan teks yang dipetik sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
