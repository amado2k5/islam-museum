text: "أمان من الله ورسوله، يا أيها الذين آمنوا أوفوا بالعقود. عهد من محمد النبي لعمرو بن حزم حين بعثه إلى اليمن، أمره بتقوى الله في أمره كله، وأن يفعل ويفعل ويأخذ من المغانم خمس الله جل ثناؤه وما كتب على"
