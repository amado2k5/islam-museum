label: { ar: "الموطأ 1286 — عطاء بن يسار: خير الناس منزلا رجل آخذ بعنان فرسه يجاهد في سبيل الله، ثم رجل معتزل في غنيمة يقيم الصلاة", en: "Muwatta 1286", es: "Muwatta 1286", fr: "Muwatta 1286", ur: "موطا 1286", tr: "El-Muvatta 1286 — Ata’ ibn Yasar: İnsanlar arasında mertebe bakımından en üstün olan, atının dizginlerini elinde tutan ve Allah yolunda mücadele eden kimsedir; sonra da ganimetleriyle birlikte tenha bir yerde oturup namaz kılan kimse gelir.", id: "Al-Muwatta 1286 — Ata’ ibn Yasar: Orang yang paling baik kedudukannya adalah seorang laki-laki yang memegang kendali kudanya dan berjuang di jalan Allah, kemudian seorang laki-laki yang menyendiri dengan harta rampasannya dan melaksanakan salat." }
text: "رَجُلٌ آخِذٌ بِعنانِ فرسهِ، يُجَاهدُ في سَبيلِ اللهِ"
summary:
  ar: "يروي مالك عن عبد الله بن عبد الرحمن بن معمر الأنصاري عن عطاء بن يسار أن رسول الله قال ألا أخبركم بخير الناس منزلا؟ رجل آخذ بعنان فرسه يجاهد في سبيل الله، ثم بخير الناس منزلا بعده، رجل معتزل في غنيمة، يقيم الصلاة، ويؤتي الزكاة، ويعبد الله لا يشرك به شيئا. ويذكر المحقق أن ابن عبد البر قال إنه مرسل من رواية مالك، وأنه يتصل من وجوه ثابتة عن النبي، ويروى موصولا من حديث ابن عباس. {cite:muwatta-maruf-1997 p.573}"
  id: "Malik meriwayatkan dari Abdullah ibn Abdur-Rahman ibn Muammar al-Ansari, dari Ata ibn Yasar, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: “Tidakkah aku akan memberitahukan kepadamu siapa orang yang paling baik kedudukannya? Seorang laki-laki yang memegang kendali kudanya, berjuang di jalan Allah. Kemudian, setelahnya, siapa orang yang paling baik kedudukannya? Seorang laki-laki yang menyendiri bersama ternaknya, yang mendirikan salat, membayar zakat, dan beribadah kepada Allah, tanpa menyekutukan-Nya dengan sesuatu pun.” Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) dari Malik, dan bahwa hadits ini terhubung melalui rantai periwayatan yang sahih dari Nabi shalla Allahu alaihi wa sallam, dan diriwayatkan dengan rantai periwayatan yang terhubung dari Ibnu Abbas. {cite:muwatta-maruf-1997 p.573}"
