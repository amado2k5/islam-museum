label: { ar: "الموطأ 1286 — عطاء بن يسار: خير الناس منزلا رجل آخذ بعنان فرسه يجاهد في سبيل الله، ثم رجل معتزل في غنيمة يقيم الصلاة", en: "Muwatta 1286" }
text: "رَجُلٌ آخِذٌ بِعنانِ فرسهِ، يُجَاهدُ في سَبيلِ اللهِ"
summary:
  ar: "يروي مالك عن عبد الله بن عبد الرحمن بن معمر الأنصاري عن عطاء بن يسار أن رسول الله قال ألا أخبركم بخير الناس منزلا؟ رجل آخذ بعنان فرسه يجاهد في سبيل الله، ثم بخير الناس منزلا بعده، رجل معتزل في غنيمة، يقيم الصلاة، ويؤتي الزكاة، ويعبد الله لا يشرك به شيئا. ويذكر المحقق أن ابن عبد البر قال إنه مرسل من رواية مالك، وأنه يتصل من وجوه ثابتة عن النبي، ويروى موصولا من حديث ابن عباس. {cite:muwatta-maruf-1997 p.573}"
