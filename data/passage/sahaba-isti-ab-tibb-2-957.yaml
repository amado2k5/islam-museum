text: "… رضوان اللّٰه عليهم أَجمعين، وكانت باب أسمها، وجرى هنالك الاختلاف في كنيتها، تغزو كثيراً مع رسول الله ي، تُمَرِّض المرضى، أَو هيَ أخت أسماء. وقال غيره : أم عامر بنت سعيد وتداوي الجرحى، وشهدت غسل ابنة رسول اللّٰه ابن السَّكنِ …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 957، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
