label: { ar: "صحيح البخاري 5742 — الرقية، السقم", en: "Sahih al-Bukhari 5742 — ruqya recited over the sick; sickness", ur: "صحیح بخاری 5742 — رقیہ، سقم" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ عَبْدِ الْعَزِيزِ، قَالَ دَخَلْتُ أَنَا وَثَابِتٌ، عَلَى أَنَسِ بْنِ مَالِكٍ فَقَالَ ثَابِتٌ يَا أَبَا حَمْزَةَ اشْتَكَيْتُ. فَقَالَ أَنَسٌ أَلاَ أَرْقِيكَ بِرُقْيَةِ رَسُولِ اللَّهِ قَالَ بَلَى. قَالَ \" اللَّهُمَّ رَبَّ النَّاسِ مُذْهِبَ الْبَاسِ اشْفِ أَنْتَ الشَّافِي لاَ شَافِيَ إِلاَّ أَنْتَ، شِفَاءً لاَ يُغَادِرُ سَقَمًا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5742، يذكر الرقية، والسقم، والشكوى من العلة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5742 (Medicine), that mentions ruqya recited over the sick, sickness, a complaint of an ailment, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5742، جس میں رقیہ، سقم، بیماری کی شکایت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
