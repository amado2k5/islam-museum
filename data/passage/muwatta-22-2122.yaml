label: { ar: "الموطأ 2122 — مالك: ومن الناس من يقول لا تكون اليمين مع الشاهد الواحد، ويحتج بقوله تعالى في الشهادة، فيقال له: أرأيت لو أن رجلا ادعى على رجل مالا، ألا يحلف المطلوب ما ذلك الحق عليه؟ فهذا مما لا اختلاف فيه عند أحد من الناس", en: "Muwatta 2122" }
summary:
  ar: "قال مالك: ومن الناس من يقول لا تكون اليمين مع الشاهد الواحد، ويحتج بقول الله تبارك وتعالى: واستشهدوا شهيدين من رجالكم فإن لم يكونا رجلين فرجل وامرأتان. فيقول: فإن لم يأت برجل وامرأتين فلا شيء له، ولا يحلف مع شاهده. قال مالك: فمن الحجة على من قال ذلك القول، أن يقال له: أرأيت لو أن رجلا ادعى على رجل مالا، أليس يحلف المطلوب ما ذلك الحق عليه؟ فإن حلف بطل ذلك عنه، وإن نكل عن اليمين حلف صاحب الحق إن حقه لحق، وثبت حقه على صاحبه؟ فهذا مما لا اختلاف فيه عند أحد من الناس، ولا ببلد من البلدان. {cite:muwatta-maruf-1997 p.267}"
