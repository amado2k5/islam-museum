label: { ar: "الموطأ 2122 — مالك: ومن الناس من يقول لا تكون اليمين مع الشاهد الواحد، ويحتج بقوله تعالى في الشهادة، فيقال له: أرأيت لو أن رجلا ادعى على رجل مالا، ألا يحلف المطلوب ما ذلك الحق عليه؟ فهذا مما لا اختلاف فيه عند أحد من الناس", en: "Muwatta 2122", es: "Muwatta 2122", fr: "Muwatta 2122", ur: "موطا 2122", tr: "El-Muvatta 2122 — Malik: Bazı kişiler tek şahitle yemin etmenin gerekmediğini söyler ve şahitlik konusunda Allah'ın sözlerini örnek gösterirler. Onlara şöyle denir: Bir adam diğerinden para talep ederse ne olur? Sanık ona borçlu olduğunu yemin etmez mi? Bu konuda insanlar arasında ihtilaf yoktur.", id: "Al-Muwatta 2122 — Malik: Sebagian orang mengatakan bahwa sumpah tidak diperlukan dengan satu saksi, dan mereka mengutip firman Allah tentang kesaksian. Dikatakan kepada mereka: Bagaimana jika seseorang menuntut uang dari orang lain? Bukankah terdakwa akan bersumpah bahwa ia berutang uang kepadanya? Ini adalah sesuatu yang tidak ada perbedaan pendapat di antara manusia." }
summary:
  ar: "قال مالك: ومن الناس من يقول لا تكون اليمين مع الشاهد الواحد، ويحتج بقول الله تبارك وتعالى: واستشهدوا شهيدين من رجالكم فإن لم يكونا رجلين فرجل وامرأتان. فيقول: فإن لم يأت برجل وامرأتين فلا شيء له، ولا يحلف مع شاهده. قال مالك: فمن الحجة على من قال ذلك القول، أن يقال له: أرأيت لو أن رجلا ادعى على رجل مالا، أليس يحلف المطلوب ما ذلك الحق عليه؟ فإن حلف بطل ذلك عنه، وإن نكل عن اليمين حلف صاحب الحق إن حقه لحق، وثبت حقه على صاحبه؟ فهذا مما لا اختلاف فيه عند أحد من الناس، ولا ببلد من البلدان. {cite:muwatta-maruf-1997 p.267}"
  tr: "Malik şöyle dedi: Bazı insanlar, Allah'ın şu sözlerini örnek göstererek, tek bir şahitle yemin etmenin gerekli olmadığını söylüyorlar: \"Erkeklerinizden iki şahit çağırın. İki erkek yoksa, bir erkek ve iki kadın şahit getirin.\" Bir erkek ve iki kadın yoksa, şahidin hak iddiasında bulunmasının mümkün olmadığını ve şahitle yemin etmesine gerek olmadığını savunuyorlar. Malik şöyle devam etti: Bu görüşü savunanlara karşı argüman şudur: Bir adam başka bir adamdan para talep ederse, sanık ona borçlu olduğunu yeminle beyan etmez mi? Yemin ederse, talep reddedilir. Yemin etmeyi reddederse, hak iddia eden kişi hakkının geçerli olduğunu ve diğer tarafa karşı hakkının tesis edildiğini beyan etmiş olur. Bu, herhangi bir ülkede insanlar arasında ihtilaf konusu olmayan bir husustur."
  id: "Malik berkata: Sebagian orang mengatakan bahwa sumpah tidak diperlukan dengan satu saksi, dengan mengutip firman Allah, semoga Dia diberkati dan dimuliakan: “Dan panggillah dua orang saksi dari kalangan laki-lakimu. Dan jika tidak ada dua orang laki-laki [yang tersedia], maka seorang laki-laki dan dua perempuan.” Mereka berpendapat bahwa jika seorang laki-laki dan dua perempuan tidak hadir, maka ia tidak memiliki hak dan tidak perlu bersumpah dengan saksinya. Malik berkata: Argumen yang menentang pandangan ini adalah: Jika seseorang menuntut uang dari orang lain, bukankah terdakwa bersumpah atas klaim bahwa ia berutang kepadanya? Jika ia bersumpah, klaim tersebut ditolak. Jika ia menolak untuk bersumpah, penggugat bersumpah bahwa haknya sah, dan haknya ditegakkan terhadap pihak lain. Ini adalah sesuatu yang tidak menimbulkan perselisihan di antara orang-orang, di negara mana pun."
