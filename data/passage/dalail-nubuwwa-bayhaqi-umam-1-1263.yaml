text: "… هل رأيتم الفارس الذي وقف عليَّ آنفاً فقالوا لا. فإنك مجنون. فقال قد وقف عليَّ فارس آنفاً فقال : قتل أبو جهل، وعتبة، وشيبة، وزمعة، وأبو البختري، وأمية بن خلف، فعدَّ أشرافاً من كفار قريش، فقال له أصحابه : إنما …"
