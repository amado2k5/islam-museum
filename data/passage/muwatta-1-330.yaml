label: { ar: "الموطأ 330 — ابن عباس يوتر بعد أن انصرف الناس من الصبح", en: "Muwatta 330" }
summary:
  ar: "أول أثر في باب الوتر بعد الفجر. يرويه يحيى عن مالك عن عبد الكريم بن أبي المخارق البصري عن سعيد بن جبير: رقد عبد الله بن عباس ثم استيقظ وقال لخادمه، وكان قد ذهب بصره، أن ينظر ما صنع الناس، فرجع الخادم وأخبره أن الناس قد انصرفوا من الصبح، فقام ابن عباس فأوتر ثم صلى الصبح. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.184} {cite:muwatta-maruf-1997 p.185}"
