label: { ar: "صحيح البخاري 4133 — الأب والأبوة", en: "Sahih al-Bukhari 4133 — the father and fatherhood", ur: "صحیح بخاری 4133 — باپ اور والدیت" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ بْنِ عُمَرَ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ صَلَّى بِإِحْدَى الطَّائِفَتَيْنِ، وَالطَّائِفَةُ الأُخْرَى مُوَاجِهَةُ الْعَدُوِّ، ثُمَّ انْصَرَفُوا، فَقَامُوا فِي مَقَامِ أَصْحَابِهِمْ، فَجَاءَ أُولَئِكَ فَصَلَّى بِهِمْ رَكْعَةً، ثُمَّ سَلَّمَ عَلَيْهِمْ، ثُمَّ قَامَ هَؤُلاَءِ فَقَضَوْا رَكْعَتَهُمْ، وَقَامَ هَؤُلاَءِ فَقَضَوْا رَكْعَتَهُمْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4133، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4133 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4133، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
