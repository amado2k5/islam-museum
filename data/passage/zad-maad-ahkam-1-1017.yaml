text: "… يمتنع وطء الثيب؟ ذو محرم، ففي وجوبه روايتان عن مالك. عجزت، فرجعت إلى سيدها، فابنُ القاسم يُثبِتُ الاستبراءَ، وأشهبُ ينفيه. ومن ذلك استبراءُ البِكر، قال أبو الحسن اللخمي: هو مستحب على وجه الاحتياط غيرُ واجب، وقال غيرُه من أصحاب مالك …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 1017، يرد فيه ذكر الواجب، والوجوب، والمستحب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1017, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 1017 کا اقتباس جس میں واجب، وجوب، مستحب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Zad al-Ma'ad de Ibn al-Qayyim, volume numérisé 1, p. 1017, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen digitalizado 1, p. 1017, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mustahabb), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 1. cildinin 1017. sayfasından, farz, sünnet ve farz olmayan amelleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, sünnet ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 1, halaman 1017, yang membahas amalan wajib, anjuran, dan sunnah; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus mengurutkan amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
