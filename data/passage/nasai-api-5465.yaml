label: { ar: "سنن النسائي 5465 — الأب والأبوة", en: "Sunan al-Nasa'i 5465 — the father and fatherhood", ur: "سنن نسائی 5465 — باپ اور والدیت", es: "Sunan al-Nasa'i 5465 — El padre y la paternidad", fr: "Sunan al-Nasa'i 5465 — Le père et la paternité" }
text: "… حَدَّثَنَا عُثْمَانُ، - يَعْنِي الشَّحَّامَ - قَالَ حَدَّثَنَا مُسْلِمٌ، - يَعْنِي ابْنَ أَبِي بَكْرَةَ - أَنَّهُ كَانَ سَمِعَ وَالِدَهُ، يَقُولُ فِي دُبُرِ الصَّلاَةِ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ وَعَذَابِ الْقَبْرِ \". فَجَعَلْتُ أَدْعُو بِهِنَّ فَقَالَ يَا بُنَىَّ أَنَّى عُلِّمْتَ هَؤُلاَءِ الْكَلِمَاتِ قُلْتُ يَا أَبَتِ سَمِعْتُكَ تَدْعُو بِهِنَّ فِي دُبُرِ الصَّلاَةِ فَأَخَذْتُهُنَّ عَنْكَ. …"
summary:
  ar: "حديث في سنن النسائي، رقم 5465، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5465 (The Book of Seeking Refuge with Allah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5465، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5465 (El Libro de la Búsqueda de Refugio en Alá), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5465 (Le Livre de la recherche du refuge auprès d'Allah), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
