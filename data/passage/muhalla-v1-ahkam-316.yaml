text: "… وَكَذَلِكَ ما فِيهِ مِنَ الأَحْكَامِ اللّازِمَةِ، فَتَتْبُّعُها فَرْضٌ، وَطَلَبُ تَأْوِيلِها وَفهْمِهَا وَاجبٌ، وَكُلُّ ما ذَكَرْنَا فَهُوَ مُحكَمٌ، وَلَيْسَ فِي شَيءٍ مِنْهُ مُتَشَابِهٌ، حَاشى الذِي قَدَّمْنَا قَبْلُ فَقَطّ، وَلَيْسَ اخْتِلافُ النَّاسِ فِيهِ وجَهْلُ مَنْ جَهِلَ وجهَ الحَقِّ بِمُوجِبِ أَنْ يَكونَ ذَلِكَ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 316، يرد فيه ذكر الفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 316, whose wording mentions the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 316 کا اقتباس جس میں فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 316, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 316, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
