label: { ar: "الموطأ 515 — مالك فيمن فاتته صلاة الاستسقاء وأدرك الخطبة", en: "Muwatta 515", es: "Muwatta 515", fr: "Muwatta 515", ur: "موطا 515", tr: "El-Muvatta 515 — Malik, yağmur duasını kaçıran ama hutbeyi dinleyen kişi hakkında", id: "Al-Muwatta 515 — Malik tentang orang yang ketinggalan salat memohon hujan tetapi sempat mendengarkan khutbah." }
summary:
  ar: "قول مالك في باب ما جاء في الاستسقاء: في رجل فاتته صلاة الاستسقاء وأدرك الخطبة فأراد أن يصليها في المسجد أو في بيته إذا رجع: هو من ذلك في سعة، إن شاء فعل أو ترك. {cite:muwatta-maruf-1997 p.266}"
  tr: "Malik, yağmur duası hakkında rivayet edilenler bölümünde şöyle demiştir: Yağmur duasını kaçıran, fakat hutbeyi dinleyip camide veya eve döndüğünde kılmak isteyen kimse hakkında: Bu konuda serbestliği vardır; dilerse kılar, dilemezse kılmaz. {cite:muwatta-maruf-1997 s.266}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan mengenai salat memohon hujan: Mengenai seorang laki-laki yang ketinggalan salat memohon hujan tetapi sempat mendengar khutbah dan ingin melaksanakannya di masjid atau di rumah setelah kembali: dia memiliki kelonggaran dalam hal ini; jika dia mau, dia boleh melakukannya atau tidak. {cite:muwatta-maruf-1997 p.266}"
