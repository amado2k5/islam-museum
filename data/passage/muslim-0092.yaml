label: { ar: "مسلم 92 — من مات لا يشرك بالله شيئاً دخل الجنة", en: "Muslim 92 — Whoever dies associating nothing with God enters Paradise" }
text: "قال عبد الله بن مسعود: سمعت رسول الله يقول: من مات يشرك بالله شيئاً دخل النار، قلت أنا: ومن مات لا يشرك بالله شيئاً دخل الجنة"
summary:
  ar: "رواية ابن مسعود في باب دلائل عظم حرمة الشرك وقتل النفس بغير حق من كتاب الإيمان في صحيح مسلم؛ التصريح بالمقصودين: الشرك إلى النار والتوحيد إلى الجنة."
