label: { ar: "مسلم 92 — من مات لا يشرك بالله شيئاً دخل الجنة", en: "Muslim 92 — Whoever dies associating nothing with God enters Paradise", es: "Musulmán 92 — Quien muere sin asociar nada con Dios entra en el Paraíso", fr: "Muslim 92 — Quiconque meurt sans rien associer à Dieu entrera au Paradis", ur: "مسلم 92 - جو شخص اس حالت میں مر جائے کہ اللہ کے ساتھ کسی کو شریک نہ کیا جائے وہ جنت میں داخل ہو گا۔", tr: "Müslim 92 - Allah'a hiçbir şeyi ortak koşmadan ölen kimse cennete girecektir.", id: "Muslim 92 — Barangsiapa meninggal dunia tanpa menyekutukan sesuatu pun dengan Allah, maka ia akan masuk surga." }
text: "قال عبد الله بن مسعود: سمعت رسول الله يقول: من مات يشرك بالله شيئاً دخل النار، قلت أنا: ومن مات لا يشرك بالله شيئاً دخل الجنة"
summary:
  ar: "رواية ابن مسعود في باب دلائل عظم حرمة الشرك وقتل النفس بغير حق من كتاب الإيمان في صحيح مسلم؛ التصريح بالمقصودين: الشرك إلى النار والتوحيد إلى الجنة."
  tr: "İbn Mesud'un Sahih Müslim'deki İman Kitabı'nda, şirk ve can öldürmenin büyük ölçüde yasaklanmasının delilleri bölümündeki rivayetinde; iki farklı anlamın kastedildiği belirtilmiştir: şirk cehenneme, tevhid ise cennete götürür."
  id: "Riwayat Ibnu Masoud dalam bab tentang bukti-bukti larangan besar kemusyrikan dan pembunuhan jiwa secara tidak adil dari Kitab Iman dalam Sahih Muslim; pernyataan tentang dua makna yang dimaksudkan: kemusyrikan mengarah ke Neraka dan tauhid mengarah ke Surga."
