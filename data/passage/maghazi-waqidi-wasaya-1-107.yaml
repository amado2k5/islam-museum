text: "… يا رسول، الله، انزعْ ثنيّتيه ! يُدلَع لسانُه فلا يقوم عليك خطيباً أَبدًا ! فقال رسول اللّٰه : لا أُمثَّل به فيُمثِّلَ اللّه بى وإن كنت نبيَّا، ولعلَّه يقوم مقاماً لا تكرهه. فقام سُهَيل بن عمرو حين جاءَه وفاة النبيّ …"
