text: "… ح وَحَدَّثَنَا هَارُونُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سَعِيدُ بْنُ سُلَيْمَانَ، حَدَّثَنَا عَبَّادٌ، عَنْ سُفْيَانَ بْنِ حُسَيْنٍ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدٍ، وَأَبِي، سَلَمَةَ - قَالَ هَارُونُ - عَنْ أَبِي هُرَيْرَةَ، أَنَّ امْرَأَةً، مِنَ الْيَهُودِ أَهْدَتْ إِلَى النَّبِيِّ شَاةً مَسْمُومَةً - قَالَ - فَمَا عَرَضَ لَهَا النَّبِيُّ. قَالَ أَبُو دَاوُدَ هَذِهِ أُخْتُ مَرْحَبٍ الْيَهُودِيَّةُ الَّتِي سَمَّتِ النَّبِيَّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4509، يذكر السم والترياق. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4509 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions poison and antidote. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4509، جس میں زہر اور تریاق کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
