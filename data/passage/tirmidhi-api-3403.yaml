label: { ar: "جامع الترمذي 3403 — الأب والأبوة", en: "Jami' al-Tirmidhi 3403 — the father and fatherhood", ur: "جامع ترمذی 3403 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3403 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3403 — le père et la paternité", tr: "Cami' el-Tirmizi 3403 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3403 — Ayah dan Peran Ayah" }
text: "… حَدَّثَنَا مُوسَى بْنُ حِزَامٍ، أَخْبَرَنَا يَحْيَى بْنُ آدَمَ، عَنْ إِسْرَائِيلَ، عَنْ أَبِي إِسْحَاقَ، عَنْ فَرْوَةَ بْنِ نَوْفَلٍ، عَنْ أَبِيهِ، أَنَّهُ أَتَى النَّبِيَّ فَذَكَرَ نَحْوَهُ بِمَعْنَاهُ وَهَذَا أَصَحُّ. قَالَ أَبُو عِيسَى وَرَوَى زُهَيْرٌ هَذَا الْحَدِيثَ عَنْ أَبِي إِسْحَاقَ عَنْ فَرْوَةَ بْنِ نَوْفَلٍ عَنْ أَبِيهِ عَنِ النَّبِيِّ نَحْوَهُ وَهَذَا أَشْبَهُ وَأَصَحُّ مِنْ حَدِيثِ شُعْبَةَ. وَقَدِ اضْطَرَبَ أَصْحَابُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3403، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3403 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3403، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3403 (Capítulos sobre la súplica), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3403 (Chapitres sur l'invocation), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de 3403 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bunu Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3403, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hal ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
