text: "… أصلبوه فإنَّه أروحُ له من ظلمة القبر مات عمُّه، فأعطوهُ ديناراً ليشتري به تابوتاً فمضى إلى السوق واشترى بدانقين جذعاً وأخذ الباقي لنفسه، وجاء بالجذع إليهم فقالوا: ما نصنع بهذا؟ فقال: أصلبوه عليه، فإنَّه أروحُ له من ظلمةِ القبرِ، وسؤالٍ …"
summary:
  ar: "مات عم جحا، فأعطته العائلة ديناراً ليشتري تابوتاً، فاشترى جذعاً بقرشين وأبقى الباقي، وقال لهم أن يصلبوا الجثة عليه فهو أروح لها من ظلمة القبر وسؤال منكر ونكير. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  en: "Juha's uncle dies; the family gives Juha a dinar to buy a coffin; he buys a log for two coins and keeps the rest; he tells them to crucify the body on it, as it is better than the darkness of the grave and the questioning of Munkar and Nakir. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  ur: "جحا کا چچا مر گیا، گھر والوں نے جحا کو تابوت خریدنے کے لیے ایک دینار دیا، اس نے دو سکوں میں ایک لٹھا خرید لیا اور باقی رکھ لیا، اور ان سے کہا کہ لاش کو اس پر صلیب دے دو، کیونکہ یہ قبر کے اندھیرے اور منکر نکیر کے سوال سے زیادہ راحت کی بات ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  fr: "L'oncle de Juha meurt ; la famille donne à Juha un dinar pour acheter un cercueil ; il achète un tronc pour deux pièces et garde le reste ; il leur dit de crucifier le corps dessus, car c'est mieux que les ténèbres de la tombe et l'interrogatoire de Munkar et Nakir. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  es: "Muere el tío de Juha; la familia le da un dinar para comprar un ataúd; él compra un tronco por dos monedas y se queda con el resto; les dice que crucifiquen el cuerpo en él, pues es mejor que la oscuridad de la tumba y el interrogatorio de Munkar y Nakir. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
