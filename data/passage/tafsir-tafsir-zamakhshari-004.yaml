text: "ذا وفوا بالعهود وفوا أول شيء بالعهد الأعظم وهو ما أخذ عليهم في كتابهم من الإيمان برسول مصدق لما معهم، ولو اتقوا الله في ترك الخيانة لاتقره في ترك الكذب على الله وتحريف كلمه. ويجوز أن يرجع الضمير إلى الله"
