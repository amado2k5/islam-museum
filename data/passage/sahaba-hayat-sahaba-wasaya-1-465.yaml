  tr: "Kandhlawi'nin Peygamberin Sahabelerinin Biyografileri adlı eserinin resimli 1. cildinin 465. sayfasında, son bir vasiyetname veya ahitten bahsedilmektedir; makine tarafından okunabilir taranmış baskıdan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi para Sahabat Nabi karya Kandhlawi, jilid 1 bergambar, halaman 465, menyebutkan wasiat atau perjanjian terakhir; dari edisi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
