text: "… ابن جرير عن معرور او ابن معرور التميعى قال: سمعت عمر بن الخطاب وصعد المنبر قعد دون مقعد رسول اللّٰه بمقعدين، ققال: اوصيكم بتقوى اللّٰه واسمموا وأطيعوا لمن ولاه اللّه أمركم؛ كذا فى الكنزج ص. وأخرج اليهقى عن ابى هريرة …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 465، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 465, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 465 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
