text: "… ابن جرير عن معرور او ابن معرور التميعى قال: سمعت عمر بن الخطاب وصعد المنبر قعد دون مقعد رسول اللّٰه بمقعدين، ققال: اوصيكم بتقوى اللّٰه واسمموا وأطيعوا لمن ولاه اللّه أمركم؛ كذا فى الكنزج ص. وأخرج اليهقى عن ابى هريرة …"
