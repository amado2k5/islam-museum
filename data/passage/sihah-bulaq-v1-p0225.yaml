text: |-
  الهجران بكسرالهاء اه
  ٤١٦
  (ياب الراء
  ⁦(هجر)⁩
  فى رأسه هبرية وهو الذى يكون فى الشعر مشل النخالة وهو فعلية والهنيره ثال الخفصرولد
  الضبع قال أبوز يد من أسماء الضباع أم الهنبر فى لغة بنى فزارة قال الشاعر
  يا قاتل اللّٰه صيبانا تجى بهم * أم الهنيبر من زنداها وارى
  وقال أبو عبيد الهنبر الجش ومنه قيل للاتان أم الهنبر تر لهتر بالسكسر السط من
  الكلام يقال هنرهاتروهونو كيدله قال أوس بن جربراجع هترامن قاضرهازا والهتر
  أيضا العجب والداهية يقال للرجل اذا كان داهيا انه لهتر أهتار وأهتر الرجل فهو مهتر
  أى صار خرفا من الكبروفلان مستهتر بالشراب أمولع به لا ييالى ماقيل فيه وتها ترالرجلان
  اذا أدعى كل واحدمنهما على صاحبه باطلا (هجر الهجرضدالوصل وقد هجره هجر
  وهجرانا والاسم الهجرة والهجرتان هجرة الى الجبشة رهجرة الى المدينسة والمهاجرة من أرض
  الى أرض ترك الاولى لاشانية والتهاجر التقاطع والهجر أيضا الهسذيان وقد هجر المريض يهجر
  هجرافهوهاجر والكلام مهجود قال أبو عبيد يروى ن ابراهيم ما يئبت هذا القول فى قوله
  تعالى ان تومى اتخذواهذا القرآن مهجورا قال قالوافيه غير الحق الم ترالى المريض اذا
  هجر قال غسير الحق قال وعن مجاهد نحوه والهجر بالضم الاسم من الاهجار وهو الافحاش
  فى المنطق والخنا قال الشماخ
  كما جدة الاعراق قال ابن ضرة • عليها كلاماجارفيه وأهجرا
  وكذلك اذا أكثر الكلام في الا ينبغى ورماه بهاجرات ومهجرات أى بفضائح والهجر والهاجرة
  نصف النهار عند اشتداد الحرّ قال ذوالرمة
  وبيداء مقفاريكادار تكاضها • بال الضحي والهجر بالطرف يمصخ
  تقول منه هجر النهار قال امر والقيس
  فدعها وسل الهمّ عنك بحسرة • ذمول اذاصام النهار وهجرا
  ويقال أتينا أهلنا مهجرين كمايقال موصلين أى فى وقت الهاجرة والاصيل والتهجير
  والتهجر السير فى الهاجرة وتهجرفلان أى تشبه بالمهاجرين وفى الحديث هاجرواولا تهجروا
  الفرّاءيقال ناقة مهجرة أى فائقة فى الشهم والسير وبعير مهجر ويقال هو الذى يتناعته
  الناس ويهجرون بذكره أى ينعتونه قال الشاعر
  عركرك مهجر الضوبان أوّمه * روض القذاف ربيعا أى تأو يم
  وهذا أهجر من هذا أى أكرم يقال فى كل شئ وينشد وماءيمان دونه طلق هجر
  يقال طلق لاطلق مثله والهجيريبيس الحض الذى كسرته الماشبة وهجر أى ترك قال ذوارمة
  ولم بيق بالخلصاء مماعنت له * من الرطب الايبسها وهجيرها
  والهيير الهاجرة والهجير الحوض الكبير وأنشد القنانى يذرى الفرى" بالهيير الواسع
  وهجراسم بلدمذكرمصروف وفى المثل كمبضع تمرالى هجر والنسبة اليههاجرى على غير قياس
  ومنه قيل للبناءها جرى والهجير مثال الفسيق الدأب والعادة وكذلك الهجيرى والاهجيرى
  يقال ما زال داك هجيراه واهجيراه وإجريا، أى عادته ودأبه الاصبمعى الهجار حبل يشد
  فى رسغ رحل البعير ثم يشدّ الى حقوه ان كان عريانا فان كان مر-ولاشد فى الحقب تقول
