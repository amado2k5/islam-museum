label: { ar: "الموطأ 2274 — مالك: جر جد العبد الولاء لولد ابنه الحر", en: "Muwatta 2274", es: "Muwatta 2274", fr: "Muwatta 2274", ur: "موطا 2274", tr: "Al-Muwatta 2274 — Malik: Bir kölenin dedesi, özgür oğlunun çocuğuna biat ediyor.", id: "Al-Muwatta 2274 — Malik: Kakek seorang budak memberikan baiat kepada cucunya yang merdeka." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في ولد العبد من حرة وأبيهم عبد: أن جد أبي العبد وهو حر يجر ولاء ولد ابنه الأحرار ما دام أبوهم عبدا؛ فإن عتق أبوهم رجع الولاء إلى مواليه، وإن مات وهو عبد كان الميراث والولاء للجد. {cite:muwatta-maruf-1997 p.338}"
  tr: "Malik şöyle dedi: Köle bir kadından doğan ve babası köle olan bir çocuğun durumuyla ilgili aramızdaki yerleşik uygulama şudur: Kölenin babasının dedesi, özgür olduğu için, babaları köle kaldığı sürece özgür torunlarının bağlılığını korur. Babaları azat edilirse, bağlılık eski efendilerine geçer. Eğer babaları köle iken ölürse, miras ve bağlılık dedeye aittir. {cite:muwatta-maruf-1997 s.338}"
  id: "Malik berkata: Praktik yang berlaku di antara kita mengenai anak-anak seorang budak yang lahir dari seorang wanita merdeka dan yang ayahnya adalah seorang budak adalah bahwa kakek dari ayah budak tersebut, karena merdeka, mempertahankan kesetiaan cucu-cucunya yang merdeka selama ayah mereka tetap menjadi budak. Jika ayah mereka dibebaskan, kesetiaan tersebut kembali kepada mantan majikannya. Jika ia meninggal dunia saat masih menjadi budak, warisan dan kesetiaan tersebut menjadi milik kakeknya. {cite:muwatta-maruf-1997 p.338}"
