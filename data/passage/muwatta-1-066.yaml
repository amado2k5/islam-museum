label: { ar: "الموطأ 66 — خروج الخطايا مع الوضوء: حديث الصنابحي", en: "Muwatta 66", es: "Muwatta 66", fr: "Muwatta 66", ur: "موطا 66", tr: "Al-Muwatta 66 — Abdestle günahların giderilmesi: As-Sunabihi Hadisi", id: "Al-Muwatta 66 — Penghapusan dosa dengan wudhu: Hadits As-Sunabihi" }
text: "إذا توضأ العبد المؤمن فتمضمض خرجت الخطايا من فيه، وإذا استنثر خرجت الخطايا من أنفه"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله الصنابحي، في باب جامع الوضوء: إذا توضأ المؤمن خرجت خطاياه مع كل عضو يغسله: من فيه بالمضمضة، ومن أنفه بالاستنثار، ومن وجهه حتى من تحت أشفار عينيه، ومن يديه حتى من تحت أظفارهما، ومن رأسه حتى من أذنيه، ومن رجليه حتى من تحت أظفارهما، ثم يكون مشيه إلى المسجد وصلاته نافلة له. ويخرّجه المحقق عند النسائي (1/74) والحاكم (1/129) والبيهقي وأحمد (4/349)، وينقل خلافاً في الراوي: فالبخاري، فيما سأله عنه الترمذي، يرى أن مالكاً وهم في قوله «عبد الله الصنابحي» وأنه أبو عبد الله عبد الرحمن بن عسيلة الذي لم يسمع من النبي فالحديث مرسل، ويرجح ابن عبد البر قول ابن معين إن أحاديثه مرسلة لا صحبة له؛ ويرى المحقق أن ترجيح ابن عبد البر فيه نظر، وأن قول ابن معين الأول «يشبه أن تكون له صحبة» أصح، وينقل عن يعقوب بن شيبة وابن المديني أنهما رجلان أحدهما أدرك النبي والآخر لم يدركه، وعن أبي حاتم أنهم ثلاثة، ويستدل بتصريح عبد الله الصنابحي بالسماع في حديث آخر عند أحمد على صحة صحبته، وبأن ابن حجر ذكره في القسم الأول من الإصابة. {cite:muwatta-maruf-1997 p.67} {cite:muwatta-maruf-1997 p.68} {cite:muwatta-maruf-1997 p.69}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan, o da Abdullah el-Sunabihi'den rivayetle, tam abdest bölümünde şöyle nakletmiştir: “Bir mümin abdest aldığında, yıkadığı vücudunun her uzuvuyla birlikte günahları da gider: ağzını çalkalayarak ağzından, burnundan su çekerek burnundan, yüzünden kirpiklerinin altından bile, ellerinden tırnaklarının altından bile, başından kulaklarından bile ve ayaklarından tırnaklarının altından bile. Sonra mescide yürümesi ve namaz kılması onun için nafile olur.” Araştırmacı bunu el-Nasa'i (1/74), el-Hakim (1/129), el-Beyhaki ve Ahmed'in (4/349) derlemelerine dahil etmiştir. Ayrıca, rivayetçi konusunda bir görüş ayrılığından da bahseder: Buhari, Tirmizi'nin bir sorusuna cevaben, Malik'in \"Abdullah el-Sunabihi\" demekte yanıldığını ve Peygamber'den bir şey duymayan kişinin Ebu Abdullah Abdülrahman ibn Asilah olduğunu, dolayısıyla hadisin mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu savunur. İbn Abdülberr ise İbn Ma'in'in hadislerinin mursal olduğu ve Sahabe olmadığı görüşünü destekler. Araştırmacı, İbn Abdülberr'in bu tercihinin tartışmalı olduğunu ve İbn Ma'in'in daha önceki \"Sahabe olması muhtemel görünüyor\" ifadesinin daha doğru olduğunu düşünmektedir. Ya'kub ibn Şeybe ve İbn el-Medini'nin, Peygamber ile görüşen ve görüşmeyen iki kişi olduğunu, Ebu Hatim'in ise üç kişi olduğunu söylediğini aktarır. Abdullah el-Sunabihi'nin, Ahmed tarafından rivayet edilen başka bir hadiste bu hadisi duyduğuna dair açık ifadesini ve İbn Hacer'in onu el-İsabe'nin ilk bölümünde zikretmesini, onun Sahabe olduğuna dair delil olarak gösterir. {cite:muwatta-maruf-1997 s.67} {cite:muwatta-maruf-1997 s.68} {cite:muwatta-maruf-1997 s.69}"
  id: "Diriwayatkan oleh Malik dari Zayd ibn Aslam, dari Ata ibn Yasar, dari Abdullah al-Sunabihi, dalam surah tentang wudhu lengkap: “Ketika seorang mukmin berwudhu, dosa-dosanya akan hilang bersama setiap bagian tubuhnya yang dibasuh: dari mulutnya dengan berkumur, dari hidungnya dengan mengeluarkan air, dari wajahnya bahkan dari bawah bulu matanya, dari tangannya bahkan dari bawah kukunya, dari kepalanya bahkan dari telinganya, dan dari kakinya bahkan dari bawah kukunya. Kemudian, perjalanannya ke masjid dan salatnya menjadi amalan sunnah baginya.” Peneliti memasukkannya dalam kumpulan hadits al-Nasa’i (1/74), al-Hakim (1/129), al-Bayhaqi, dan Ahmad (4/349). Ia juga menyebutkan perbedaan pendapat mengenai perawi: al-Bukhari, menanggapi pertanyaan dari al-Tirmidhi, meyakini bahwa Malik keliru dengan mengatakan “Abdullah al-Sunabihi,” dan bahwa Abu Abdullah Abd al-Rahman ibn Asilah-lah yang tidak mendengar dari Nabi, sehingga hadits tersebut mursal (hadits dengan mata rantai periwayatan yang hilang). Ibn Abd al-Barr lebih menyukai pendapat Ibn Ma’in bahwa hadits-haditsnya mursal dan bahwa ia bukanlah seorang Sahabat. Peneliti tersebut meyakini bahwa preferensi Ibn Abd al-Barr patut dipertanyakan, dan bahwa pernyataan Ibn Ma'in sebelumnya, \"Sepertinya ia adalah seorang Sahabat,\" lebih akurat. Ia mengutip Ya'qub ibn Shaybah dan Ibn al-Madini yang mengatakan bahwa ada dua orang, satu yang bertemu dengan Nabi dan yang lainnya tidak, dan Abu Hatim yang mengatakan bahwa ada tiga orang. Ia mengutip pernyataan eksplisit Abdullah al-Sunabihi yang mendengar hadits tersebut dalam hadits lain yang diriwayatkan oleh Ahmad sebagai bukti bahwa ia adalah seorang Sahabat, dan fakta bahwa Ibnu Hajar menyebutkannya di bagian pertama kitab al-Isabah. {cite:muwatta-maruf-1997 p.67} {cite:muwatta-maruf-1997 p.68} {cite:muwatta-maruf-1997 p.69}"
