ref: "1.66"
label: { ar: "الموطأ 66 — خروج الخطايا مع الوضوء: حديث الصنابحي", en: "Muwatta 66" }
text: "إذا توضأ العبد المؤمن فتمضمض خرجت الخطايا من فيه، وإذا استنثر خرجت الخطايا من أنفه"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله الصنابحي، في باب جامع الوضوء: إذا توضأ المؤمن خرجت خطاياه مع كل عضو يغسله: من فيه بالمضمضة، ومن أنفه بالاستنثار، ومن وجهه حتى من تحت أشفار عينيه، ومن يديه حتى من تحت أظفارهما، ومن رأسه حتى من أذنيه، ومن رجليه حتى من تحت أظفارهما، ثم يكون مشيه إلى المسجد وصلاته نافلة له. ويخرّجه المحقق عند النسائي (1/74) والحاكم (1/129) والبيهقي وأحمد (4/349)، وينقل خلافاً في الراوي: فالبخاري، فيما سأله عنه الترمذي، يرى أن مالكاً وهم في قوله «عبد الله الصنابحي» وأنه أبو عبد الله عبد الرحمن بن عسيلة الذي لم يسمع من النبي فالحديث مرسل، ويرجح ابن عبد البر قول ابن معين إن أحاديثه مرسلة لا صحبة له؛ ويرى المحقق أن ترجيح ابن عبد البر فيه نظر، وأن قول ابن معين الأول «يشبه أن تكون له صحبة» أصح، وينقل عن يعقوب بن شيبة وابن المديني أنهما رجلان أحدهما أدرك النبي والآخر لم يدركه، وعن أبي حاتم أنهم ثلاثة، ويستدل بتصريح عبد الله الصنابحي بالسماع في حديث آخر عند أحمد على صحة صحبته، وبأن ابن حجر ذكره في القسم الأول من الإصابة. {cite:muwatta-maruf-1997 p.67} {cite:muwatta-maruf-1997 p.68} {cite:muwatta-maruf-1997 p.69}"
