text: "أظهره كان الخيار عليه، فلا تكن مملوكا بعد أن كنت مالكا . وفي كتاب التاج: أن بعض ملوك العجم استشار وزيريه، فقال أحدهما : إنه لا ينبغي للملك أن يستشير منا أحدا إلا خاليا به، فإنه أموت للسر، وأحزم للرأي،"
