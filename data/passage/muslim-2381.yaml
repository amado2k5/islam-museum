label: { ar: "مسلم 2381 — ما ظنك باثنين الله ثالثهما", en: "Muslim 2381 — What think you of two, the third of whom is God", es: "Musulmán 2381 — ¿Qué opinas de dos, siendo el tercero Dios?", fr: "Muslim 2381 — Que pensez-vous de deux personnes, dont le troisième est Dieu ?", ur: "مسلم 2381 — آپ دو کے بارے میں کیا سمجھتے ہیں، جن میں سے تیسرا خدا ہے؟", tr: "Müslim 2381 — Tanrı üçüncü kişi olduğunda iki insan hakkında ne düşünürsünüz?", id: "Muslim 2381 — Apa pendapatmu tentang dua orang jika Tuhan adalah pihak ketiga?" }
text: "قال أبو بكر: نظرت إلى أقدام المشركين على رؤوسنا ونحن في الغار، فقلت: يا رسول الله، لو أن أحدهم نظر إلى قدميه أبصرنا تحت قدميه؛ فقال: «يا أبا بكر، ما ظنك باثنين الله ثالثهما؟»"
summary:
  ar: "رواية أنس عن أبي بكر نفسه في صحيح مسلم؛ شهادة الصاحب الوحيد على لحظة الغار في رحلة الهجرة — من أوثق نصوص صحبة أبي بكر في يوم الهجرة."
  tr: "Sahih Müslim'de Enes'in Ebu Bekir hakkında yaptığı rivayet; hicret yolculuğu sırasında mağara anında tek sahabe olan kişinin şahitliği - Ebu Bekir'in hicret günündeki sahabeliğine dair en güvenilir metinlerden biri."
  id: "Riwayat Anas tentang Abu Bakr sendiri dalam Sahih Muslim; kesaksian satu-satunya sahabat pada saat gua itu berada di dalam gua selama perjalanan hijrah — salah satu teks paling terpercaya tentang persahabatan Abu Bakr pada hari hijrah."
