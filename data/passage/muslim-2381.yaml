label: { ar: "مسلم 2381 — ما ظنك باثنين الله ثالثهما", en: "Muslim 2381 — What think you of two, the third of whom is God" }
text: "قال أبو بكر: نظرت إلى أقدام المشركين على رؤوسنا ونحن في الغار، فقلت: يا رسول الله، لو أن أحدهم نظر إلى قدميه أبصرنا تحت قدميه؛ فقال: «يا أبا بكر، ما ظنك باثنين الله ثالثهما؟»"
summary:
  ar: "رواية أنس عن أبي بكر نفسه في صحيح مسلم؛ شهادة الصاحب الوحيد على لحظة الغار في رحلة الهجرة — من أوثق نصوص صحبة أبي بكر في يوم الهجرة."
