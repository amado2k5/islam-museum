label: { ar: "الموطأ 1752 — مالك: بلغه عن سالم بن عبد الله وسليمان بن يسار أن المتوفى عنها زوجها إذا خشيت على بصرها من رمد تكتحل وتتداوى ولو كان فيه طيب", en: "Muwatta 1752", es: "Muwatta 1752", fr: "Muwatta 1752", ur: "موطا 1752", tr: "El-Muvatta 1752 — Malik: Salim bin Abdullah ve Süleyman bin Yaşar'dan rivayet edildiğine göre, kocası ölmüş bir kadın konjonktivit nedeniyle görme yetisini kaybetmekten endişe ediyorsa, sürme çekebilir ve parfümlü ilaç bile kullanabilir.", id: "Al-Muwatta 1752 — Malik: Diriwayatkan kepadanya dari Salim bin Abdullah dan Sulayman bin Yasar bahwa jika seorang wanita yang suaminya telah meninggal khawatir akan penglihatannya karena konjungtivitis, dia boleh memakai celak dan minum obat, meskipun obat tersebut mengandung parfum." }
summary:
  ar: "يروي مالك أنه بلغه عن سالم بن عبد الله وسليمان بن يسار أنهما كانا يقولان في المرأة يتوفى عنها زوجها: إنها إذا خشيت على بصرها من رمد أصابها أو شكر، فإنها تكتحل وتتداوى بدواء أو كحل، وإن كان فيه طيب. {cite:muwatta-maruf-1997 p.115}"
  tr: "Malik, Salim bin Abdullah ve Süleyman bin Yaşar'dan, kocası ölen bir kadın hakkında şöyle bir şey söylediklerini duyduğunu aktarıyor: \"Eğer konjonktivit veya sarılık nedeniyle görme yetisinden endişe ediyorsa, sürme sürmeli ve parfümlü olsa bile ilaç veya sürme ile kendini tedavi etmelidir.\" {cite:muwatta-maruf-1997 s.115}"
  id: "Malik meriwayatkan bahwa ia mendengar dari Salim bin Abdullah dan Sulayman bin Yasar bahwa mereka biasa berkata mengenai seorang wanita yang suaminya meninggal: Jika ia khawatir akan penglihatannya karena konjungtivitis atau penyakit kuning, ia hendaknya memakai celak dan mengobati dirinya dengan obat atau celak, meskipun mengandung parfum. {cite:muwatta-maruf-1997 p.115}"
