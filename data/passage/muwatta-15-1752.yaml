summary:
  ar: "يروي مالك أنه بلغه عن سالم بن عبد الله وسليمان بن يسار أنهما كانا يقولان في المرأة يتوفى عنها زوجها: إنها إذا خشيت على بصرها من رمد أصابها أو شكر، فإنها تكتحل وتتداوى بدواء أو كحل، وإن كان فيه طيب. {cite:muwatta-maruf-1997 p.115}"
