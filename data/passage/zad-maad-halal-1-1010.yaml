text: "… وعشراً على الزوج، فدخلت الأمةُ وأمُّ الولد فيمن يحل لهن الإحداد، لا فيمن يَحْرُمُ عليهن، ولا فيمن يجب. لا إحداد على غير المتوفى عنها زوجها فإن قيل: فهل يجب على المعتدة مِن طلاق أو وطءِ شبهة، أوزنى، أو استبراءٍ إحدادٌ؟ …"
