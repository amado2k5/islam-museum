text: "… ولم يزل في الإمارة إلى أن قتل عليّ. وكان قد شهد معه صفين. ولما تم الأمر لمعاوية قصده فبالغ معاوية في إكرامه. وهو - في أكثر الأقوال - أول من نقط المصحف. وله شعر جيد، في ديوان صغير، أشهره أَبيات …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 281، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 281, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 1، ص 281 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 1, pág. 281, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 1, page 281, mentionne la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation automatique, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 1. cildinin 281. sayfasından bir alıntı, Kur'an'ın derlenmesi ve el yazmalarının yanı sıra Kur'an'ın diyakritik işaretleri ve biçimlendirmesini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir versiyondan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Subul al-Huda wa al-Rashad\" karya Al-Salihi, Volume 1, halaman 281, membahas penyusunan Al-Quran dan manuskripnya, serta tanda diakritik dan format Al-Quran. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
