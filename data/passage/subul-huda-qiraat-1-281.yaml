text: "… ولم يزل في الإمارة إلى أن قتل عليّ. وكان قد شهد معه صفين. ولما تم الأمر لمعاوية قصده فبالغ معاوية في إكرامه. وهو - في أكثر الأقوال - أول من نقط المصحف. وله شعر جيد، في ديوان صغير، أشهره أَبيات …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 281، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 281, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 1، ص 281 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
