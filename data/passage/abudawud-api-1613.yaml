label: { ar: "سنن أبي داود 1613 — ما فُرض على الناس، الفرض", en: "Sunan Abi Dawud 1613 — what was made obligatory on people; the obligatory (fard)", ur: "سنن ابی داؤد 1613 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Sunan Abi Dawud 1613 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Sunan Abi Dawud 1613 — lo que se impuso a la gente; lo obligatorio (fard)" }
text: "… ح وَحَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبَانُ، عَنْ عُبَيْدِ اللَّهِ، عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ، عَنِ النَّبِيِّ أَنَّهُ فَرَضَ صَدَقَةَ الْفِطْرِ صَاعًا مِنْ شَعِيرٍ أَوْ تَمْرٍ عَلَى الصَّغِيرِ وَالْكَبِيرِ وَالْحُرِّ وَالْمَمْلُوكِ زَادَ مُوسَى وَالذَّكَرِ وَالأُنْثَى. قَالَ أَبُو دَاوُدَ قَالَ فِيهِ أَيُّوبُ وَعَبْدُ اللَّهِ - يَعْنِي الْعُمَرِيَّ - فِي حَدِيثِهِمَا عَنْ نَافِعٍ ذَكَرٍ أَوْ أُنْثَى. أَيْضًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 1613، يرد فيه ذكر ما فُرض على الناس، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 1613 (Zakat (Kitab Al-Zakat)), whose wording mentions what was made obligatory on people, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 1613، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 1613, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 1613, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
