text: "… بئر معونة، وقوله فيه عن إسحق هو ابن عبد اللّٰه بن أبى طلحة. قوله بعث النب أقواماً من بنى سليم إلى ننى عامر قال الدمياطى : هو وهم، فإن بنى سليم مبعوث إليهم، والمبعوث هم القراء وهم من الأنصار. قلت …"
