label: { ar: "سنن أبي داود 4519 — الأب والأبوة", en: "Sunan Abi Dawud 4519 — the father and fatherhood", ur: "سنن ابی داؤد 4519 — باپ اور والدیت", es: "Sunan Abi Dawud 4519 — El padre y la paternidad", fr: "Sunan Abi Dawud 4519 — le père et la paternité" }
text: "… بْنُ الْحَسَنِ بْنِ تَسْنِيمٍ الْعَتَكِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ بَكْرٍ، أَخْبَرَنَا سَوَّارٌ أَبُو حَمْزَةَ، حَدَّثَنَا عَمْرُو بْنُ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ جَاءَ رَجُلٌ مُسْتَصْرِخٌ إِلَى النَّبِيِّ فَقَالَ جَارِيَةٌ لَهُ يَا رَسُولَ اللَّهِ. فَقَالَ \" وَيْحَكَ مَا لَكَ \". قَالَ شَرًّا أَبْصَرَ لِسَيِّدِهِ جَارِيَةً لَهُ فَغَارَ فَجَبَّ مَذَاكِيرَهُ. فَقَالَ رَسُولُ اللَّهِ \" عَلَىَّ بِالرَّجُلِ \". …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4519، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4519 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4519، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4519 (Tipos de sangre y sabiduría (Kitab Al-Diyat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4519 (Types de sang – Kitab Al-Diyat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
