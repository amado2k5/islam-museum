text: "… جسأ معها ولا صلابة وأن لأوجاعها سكوناً، فأما أوجاع السرطان فلا برء لها معه، ويكون في الرحم نفخ، ويستدل عليه أن ترى ممتدة جداً وينتقل الوجع من مكان إلى مكان. علاجه: ألزم المحاجم بالنار العانة واستعمل المراهم المبردة للريح كالسذاب …"
summary:
