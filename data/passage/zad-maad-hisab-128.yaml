text: "… ينافي أن يُسمى من لم يولد له رقوباً . ومثله قوله وَيه: ما تَعُدُّونَ المُفْلِسَ فيكم؟ قالوا : من لا دِرْهَمَ له ولا مَتَاع. قال : المُفْلِسُ منِ يَأْتي يَومَ القِيامَةِ بِحَسَناتٍ أمْثَالِ الجِبالِ، ويأتي وقد لَطَمَ هذا ، وضَرَبَ …"
summary:
