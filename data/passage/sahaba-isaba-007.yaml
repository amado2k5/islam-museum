text: "رأسه، وقال: (بارك الله في جحدم»، حنينا وهي دامية الحوافي وكتب له كتابا ، فذكر الحديث بطوله، وقال: هو حديث قلت: ولا دلالة في هذا على صحبته، وإنما افتخر غريب . بقومه بني سليم، وكانوا يوم جنين كثيرا، وقصة العباس"
