summary:
  ar: "سُئل مالك عن طعام فيه زعفران هل يأكله المحرم، فقال: أما ما مسته النار من ذلك فلا بأس أن يأكله المحرم، وأما ما لم تمسه النار فلا يأكله المحرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1056). {cite:muwatta-maruf-1997 p.444}"
