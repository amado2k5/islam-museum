label: { ar: "الموطأ 308 — عائشة: كنت أنام بين يديه ورجلاي في قبلته", en: "Muwatta 308" }
text: "كنت أنام بين يدي رسول الله ورجلاي في قبلته، فإذا سجد غمزني فقبضت رجلي، فإذا قام بسطتهما"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي سلمة بن عبد الرحمن عن عائشة، في باب ما جاء في صلاة الليل: كانت تنام بين يدي النبي ورجلاها في قبلته، فإذا سجد غمزها فقبضت رجليها، فإذا قام بسطتهما، وقالت إن البيوت يومئذ ليس فيها مصابيح. ويخرّجه المحقق عند البخاري (382، 513، 1209) ومسلم (2/60) والنسائي (1/102) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (22/117). {cite:muwatta-maruf-1997 p.173} {cite:muwatta-maruf-1997 p.174}"
