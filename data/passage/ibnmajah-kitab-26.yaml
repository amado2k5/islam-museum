summary:
  ar: "القسم 26 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأضاحي»، ويضم فيها النصوص من 3120 إلى 3161 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 26 of Sunan Ibn Majah (Chapters on Sacrifices) in the division of the open hadith dataset the museum took its reports from: reports 3120 to 3161 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 26، عنوان «کتاب الاضاحی»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3120 تا 3161۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 26 de Sunan Ibn Majah (Capítulos sobre los sacrificios) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3120 al 3161, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 26 du Sunan Ibn Majah (chapitres sur les sacrifices) correspond aux hadiths 3120 à 3161, selon la numérotation du recueil ouvert utilisé par le musée. Le musée conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
