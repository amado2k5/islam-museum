  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 3, p. 236, that mentions honey as a remedy, the drug, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 3، ص 236 کا اقتباس جس میں شہد سے علاج، دوا، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
