text: "… رسول الّه فرسا وكتب اليه عامر انه قد ظهر في ديلة فابعث الىّ دواء من عندك ! قال: فرد التبى الفرس لأنه لم يكن اسلم و أهدى اليه عكة من عسل وقال: تداوى بها. و عنده ايضنا عن كعب بن …"
summary:
