  tr: "Kandhlawi'nin Sahabelerin Hayatı adlı eserinin resimli 3. cildinin 236. sayfasında bal, ilaç ve şifa ile tedaviden bahsedilmektedir; bu pasaj, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Riwayat Hidup Para Sahabat karya Kandhlawi, jilid bergambar 3, hlm. 236, menyebutkan pengobatan dengan madu, obat-obatan, dan penyembuhan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
