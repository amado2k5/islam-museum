text: "… تعالى وليس الدعاء بهذا من أخلاق المؤمنين الذين وصفهم اللّٰه تعالى بالرحمة بينهم والتعاون على البر والتقوى وجعلهم كالبنيان يشد بعضه بعضا وكالجسد الواحد وأن المؤمن يحب لأخيه ما يحب لنفسه فمن دعا على أخيه المسلم باللعنة وهى الإبعاد من …"
