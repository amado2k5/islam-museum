text: "… بَدا له، ولَمْ يُؤْذِ أحداً ، ثُمَّ أَنْصَتَ إذا خَرَج إمامُه حتَّى يُصَلِّيَ، كانت كَفَّارَةً لما بينهما [حسن: أحمد: ٠[٢٣٥٧١ وفي سنن أبي داود»، عن عبد اللّه بن سلام. أنه سمع رسول اللّه وَلِفِ يقول على المِنبَر في يَوْم الجُمُعة: …"
