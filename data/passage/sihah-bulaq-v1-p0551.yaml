text: |-
  (1) محركاا*
  قطرة وما أصابتنا العام قابة بمعنى واحد وقال أبوزيدمارأيشا العام قابة أى قطرة وقال
  الاصمعى ما سمعنا العام قابة أى صوت رعديذهب به الى القبيب قال ابن السكيت ولم يروهذا
  الحرف أحد غيره قال والناس على خلافه والقب الخشبة التى فى وسط البكرة وفوقها أسنان
  من خشب ويقال أيضاعليك بالقب الاك برأى بالرأس الاكبر والقب أيضا ما يدخسل
  فى جيب القميص من الرقاع فاله أبو مبيد والقب بالكسر العظم الناتىْ من الظهر بين
  الاليتين تقول ألزق قبك بالارض ويقال للشيخ أيضاهوقب القوم وقبة الشاة أيضاذات
  الاطباق وهى الحفت وربما خفقت والقبة بالضم من البناء والجمع قبب وقباب وبيت. قبب
  جعل فوقه قبة والهوادج تقبب والقباقب مضمومة القاف العام الذى بعد العام المقبل
  تقول لا آتيك العام ولاقابل ولا قباقب وأنشد أبو عبيدة العام والمقبل والقباقب
  أبو عمرو قبه يقبه اذا قطعه الاصمعى اقتب فلان يدفلان اذاقطعها وهوافتعل وحمار
  قبان دويبة وهوفعلان من قب لان العرب لا تصرفه وهومه رفة عدهم ولو كان فعالا
  لصرفته تقول رأيت قطيعامن حرقبان وقال الشاءر
  يا عجمب القدرأيت عجبا • حمارقبان يسوق أرنيا
  تب القتب بالتحريك رحل صغير على قدر السنام والقتب بالكسر جيع أداة السانية
  من أعلاقها وحبالها والقنب أيضاواحدة الاقتاب وهى الامعاء مؤنثة على قول الكسائى
  وقال الاصمعى واحسدها قتبة بالهاء وتصغير هاقتيبة وبهاسمى الرجل قتيبة والنسبة البعقتى
  كما تقول جهف وقال أبو عبيدة القتب ما تحوّى من البطن يعنى استداروهى الحوايا وأما
  الامعاء فهى الاقصاب وأقتبت البعير إقنابا اذاشددت عليه القتب والققوبة من الابل التى
  تقتبها بالقتب وانماجات بالها لانها الشى عما يقتب كاحلوبة والركوبة ⁦(قب)⁩ القعاب
  سعال انلخيل والابل ورعماجعل للناس تقول منه قحب يقدب بالضم والقحبة كلة مولدة
  ⁦( حطب)⁩ تقحطبه أى صرعه وقح طبه بالسيف أى علاه وقحلبة اسم رجل رب
  قرب الشئ بالضم يقرب قربا أى دنا وقوله تعالى ان رحة اللّٰه قريب من المحنين ولم يقل
  قريبة لانه أراد بالرجة الاحسان ولان مالايكون تأنيشه حقيقيا جازتذ كيره وقال
  الفرّاءاذا كان القريب فى معنى المسافة يذكر ويونث واذا كان فى معنى النسب يونث
  إلا اختلاف بينهم تقول هذه المرأة قريبتى أى ذات قرابتى وقر بته بالمكسر أقربهة ربانا أى
  دنوت منه وقربت أقرب قرابة مشل كتبت كاية اذاسرت الى الماء وبينك وبينه ليل
  والاسم القرب ١ قال الاصمعى قلت لاء رابى ما القرب فقال سير الليل لورد الغد وقلت له
  ما الطلق فتال سير الليل لورد الغب يقال قرب به باص وذلك أنّ القوم يسيمون الابل وهم
  فى ذلك يسيرون نحو الماء فاذابقيت بينهم وبين الماءعشية عجلوا نحوه فتلك الليلد ليلة القرب
  وقد أقرب القوم اذا كانت ابلهم قوارب فهم قاريون ولا يقال مقربون قال أبو عسد وهذ
  لحرف شاذ والقارب سفينة صغيرة تمكون مع أصحاب السفن البحرية تستخف لحوائجه.
  قال الخليل القارب طالب الماءليلا ولا يقال ذلا لطالب المانهاراوقربت السيف
  أيضااذا جعلته فى القراب والقربان بالضم ما تقر بت به الى اللّٰه عزوجل تقول منه قربت للّٰه
  قريانا
