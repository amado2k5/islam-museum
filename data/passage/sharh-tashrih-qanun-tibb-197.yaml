  tr: "İbn el-Nafis'in hukuk anatomisi hakkındaki açıklamasından bir alıntı, sayfa 197; vücut organlarından, fetüsün gelişim aşamalarından ve damarlardan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikası gereği metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari penjelasan Ibn al-Nafis tentang anatomi hukum, hlm. 197, yang menyebutkan organ-organ tubuh, tahapan perkembangan janin, dan pembuluh darah; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
