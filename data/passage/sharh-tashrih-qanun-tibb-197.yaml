  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 197, that mentions the organs of the body, the stages of the embryo, the vessels; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "شرح تشریح القانون، ابن النفیس، ص 197 کا اقتباس جس میں اعضائے بدن، جنین کے مراحل، رگیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
