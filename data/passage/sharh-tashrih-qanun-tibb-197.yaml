text: "… أو لا وهو الغشاء المشيمي واغتذاء الجنين هو من ذلك الغشاء ما دام جنينا لأن هذا الغشاء يحتوي على عروق كثيرة بعضها يتصل بالأوردة النافذة إلى الرحم فتكون في هذه العروق الدم ومن ذلك يغتذي الجنين بأن ينفذ في عروق …"
summary:
