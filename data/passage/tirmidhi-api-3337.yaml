label: { ar: "جامع الترمذي 3337 — كتاب الأعمال والملائكة الكاتبون، الحساب", en: "Jami' al-Tirmidhi 3337 — the record of deeds and the recording angels; the reckoning", ur: "جامع ترمذی 3337 — نامۂ اعمال اور لکھنے والے فرشتے، حساب" }
text: "… عَنْ عُثْمَانَ بْنِ الأَسْوَدِ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ، قَالَتْ سَمِعْتُ النَّبِيَّ يَقُولُ \" مَنْ نُوقِشَ الْحِسَابَ هَلَكَ \". قُلْتُ يَا رَسُولَ اللَّهِ إِنَّ اللَّهَ يَقُولَُ : (فأمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ ) إِلَى قَوْلِهِ : ( خبِيرًا ) قَالَ \" ذَلِكَ الْعَرْضُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. حَدَّثَنَا سُوَيْدُ بْنُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3337، يذكر كتاب الأعمال والملائكة الكاتبون، والحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3337 (Chapters on Tafsir), that speaks of the record of deeds and the recording angels, the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3337، جس میں نامۂ اعمال اور لکھنے والے فرشتے، حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
