text: "… يَمَسُّ مِنْ ١٢٥ مَا كُتِبَ لَهُ، ثَمَّ يُنْصِتُ إذَا تَكَلّمَ الإمَامُ، إلّا غُفِرَ لَهُ مَا بِيْنَهُ وبَيْنَ الجُمُعةِ الأُخْرَى [البخاري: ٨٨٣]. وفي مسند أحمد من حديث أبي الدرداء قال : قال رسولُ اللَّه وَاعِ: مَنِ اغْتَسَلَ يَوْمَ الجُمُعة، ثُمَّ لَبِسَ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 125، يذكر مغفرة الذنب؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 125, that speaks of forgiveness of sins; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 125 کا اقتباس جس میں گناہوں کی مغفرت کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
