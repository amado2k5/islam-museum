text: "… وال يقي أنه قال: وأقرؤهم أبيُّ بن كعب. - ومن فضائله أن النبي والِقه قرأ عليه القرآن، وإنما قرأ عليه النبي وَالييم ليزداد علمًا بالقراءة من النبي وَالِلهه ويزداد تثبيتًا فيها. - وكان مملفه سيد القراء، وأحد كتاب الوحي لرسول …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 66، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
