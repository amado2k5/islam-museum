text: "… كتاب سوق العروس، يقال: فيه ألف وخمسمائة طريق. تُوُفّي بمكّة. وله كتاب الدُّرر في التّفسير، وكتاب الرّشاد في شرح القراءآت الشّاذة، وكتاب عيون المسائل، وكتاب طبقات القرّاء، وكتاب مخارج الحروف، وكتاب الورد، وكتاب هجاء المصاحف، وكتاب في اللّغة. وقد روى …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 35، ص 229، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 35, p. 229, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 35، ص 229 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 35, pág. 229, que menciona las lecturas del Corán, los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 35, page 229, mentionnant les lectures du Coran, les lecteurs, la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
