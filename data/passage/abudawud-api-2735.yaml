label: { ar: "سنن أبي داود 2735 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 2735 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 2735 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 2735 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 2735 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا أُمَيَّةُ بْنُ خَالِدٍ، حَدَّثَنَا الْمَسْعُودِيُّ، عَنْ رَجُلٍ، مِنْ آلِ أَبِي عَمْرَةَ عَنْ أَبِي عَمْرَةَ، بِمَعْنَاهُ إِلاَّ أَنَّهُ قَالَ ثَلاَثَةَ نَفَرٍ. زَادَ فَكَانَ لِلْفَارِسِ ثَلاَثَةُ أَسْهُمٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2735، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2735 (Jihad (Kitab Al-Jihad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 2735، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 2735 (Yihad (Kitab Al-Jihad)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 2735 (Jihad (Kitab Al-Jihad)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
