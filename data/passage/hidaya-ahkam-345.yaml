text: "… بدأ : جاز. وقال زفرُ: لا يجوزُ إلا أن يُقدِّمَ الوضوءَ؛ لأنه ماءٌ واجبُ الاستعمالِ، فأشبه الماءَ المطلَقَ. ولنا: أن المطهِّرَ أحدُهما، فيُفيدُ الجَمْعَ، دونَ الترتيب. قال: وسُور الفَرَسِ: طاهرٌ، عندهما؛ لأنَّ لحمَه مأكولٌ، وكذا عنده، في الصحيح؛ لأن الكراهة …"
