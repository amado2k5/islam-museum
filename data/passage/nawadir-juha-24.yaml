text: "… كلّ من يلد يموت استعار من أحد جيرانه دستاً ثم أعاده إليه، بعد أيام، وفي وسطه قدر طنجرة فاستغرب جاره وجود القدر، وسط الدست، فسأله: وما هذا؟ فأجابه جحا بأن الدست قد ولد، فانسرّ الجار، وأخذ الدست والقدر، ثم عاد …"
summary:
  ar: "استعار جحا من جاره طستًا كبيرًا وفيه قدر صغيرة، وزعم أن الطست ولدت، ثم قال لاحقًا حين احتفظ به إنه مات. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  en: "Juha borrows a neighbour's dast, a large tray or basin, with a pot in it, claims the dast gave birth, and later, when he kept it, says it died. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  ur: "جحا نے اپنے پڑوسی سے ایک بڑا طشت مانگا جس میں ایک ہانڈی تھی، دعویٰ کیا کہ طشت نے بچہ جنا ہے، اور بعد میں جب اسے اپنے پاس رکھ لیا تو کہا کہ وہ مر گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  fr: "Juha emprunte à un voisin un dast, grand plateau ou bassine, contenant une marmite, prétend que le dast a mis bas, puis, quand il le garde, dit qu'il est mort. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  es: "Juha toma prestado de un vecino un dast, una gran bandeja o palangana, con una olla dentro, afirma que el dast dio a luz y, más tarde, cuando se lo queda, dice que murió. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  tr: "Juha, komşusundan içinde küçük bir kap bulunan büyük bir leğen ödünç aldı ve leğenin çocuk doğurduğunu iddia etti. Daha sonra leğeni sakladığında ise öldüğünü söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 17}"
  id: "Juha meminjam sebuah baskom besar dari tetangganya, yang berisi sebuah pot kecil, dan mengklaim bahwa baskom itu melahirkan. Kemudian, ketika ia menyimpannya, ia mengatakan bahwa baskom itu telah mati. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
