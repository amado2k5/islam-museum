text: "… إبراهيمَ بن عُمر السُّوسيِّ الشّافعيّ. أوَّلُه: الحمدُ لله الذي فَرَض الفَرَائض... إلخ. رُتُب على فاتحةٍ وأحدٍ وستّين بابًا وخاتَمة. ذكر فيه مذاهبَ الصَّحابة فمَن بعدَهم من أئمة المذاهب الباقية، وفَرَغ في صفر سنة سبع وأربعين وثمان مئة. تقدمت ترجمته في. …"
