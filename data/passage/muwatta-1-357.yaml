label: { ar: "الموطأ 357 — عمر بن عبد العزيز ينهى إماماً بالعقيق لا يُعرف أبوه", en: "Muwatta 357", es: "Muwatta 357", fr: "Muwatta 357", ur: "موطا 357", tr: "Al-Muwatta 357 - Ömer ibn Abdülaziz, el-Akik'te babası bilinmeyen bir imamı azarlıyor", id: "Al-Muwatta 357 — Umar ibn Abd al-Aziz menegur seorang imam di al-Aqiq yang ayahnya tidak diketahui" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب العمل في صلاة الجماعة: كان رجل يؤم الناس بالعقيق فأرسل إليه عمر بن عبد العزيز فنهاه؛ ويعلل مالك النهي بأنه كان لا يُعرف أبوه. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.195} {cite:muwatta-maruf-1997 p.196}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği, cemaat namazı bölümündeki bir rivayete göre: Akik'te bir adam cemaate namaz kıldırıyordu. Bunun üzerine Ömer ibn Abdülaziz onu çağırdı ve namaz kılmasını yasakladı. Malik, bu yasağın gerekçesini adamın babasının bilinmemesiyle açıklıyor. Editör, bu rivayetin Malik'ten Ebu Musab tarafından nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.195} {cite:muwatta-maruf-1997 s.196}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id, dalam surah tentang salat berjamaah: Seorang pria memimpin salat berjamaah di al-'Aqiq, lalu Umar ibn 'Abd al-'Aziz memanggilnya dan melarangnya melakukan hal itu. Malik menjelaskan larangan tersebut dengan mengatakan bahwa ayah pria itu tidak diketahui. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.195} {cite:muwatta-maruf-1997 p.196}"
