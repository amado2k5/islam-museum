summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب العمل في صلاة الجماعة: كان رجل يؤم الناس بالعقيق فأرسل إليه عمر بن عبد العزيز فنهاه؛ ويعلل مالك النهي بأنه كان لا يُعرف أبوه. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.195} {cite:muwatta-maruf-1997 p.196}"
