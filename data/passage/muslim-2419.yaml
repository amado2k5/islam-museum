label: { ar: "مسلم 2419 — أمين هذه الأمة أبو عبيدة", en: "Muslim 2419 — Abu Ubayda, the trustworthy of this community", es: "Musulmán 2419 — Abu Ubayda, el digno de confianza de esta comunidad", fr: "Muslim 2419 — Abou Ubayda, le digne de confiance de cette communauté", ur: "مسلم 2419 - ابو عبیدہ، اس برادری کے ثقہ", tr: "Müslim 2419 — Bu ümmetin emanetçisi Ebu Ubeyde", id: "Muslim 2419 — Wali amanah bangsa ini, Abu Ubaidah" }
text: "قال رسول الله: «إن لكل أمة أميناً، وإن أميننا أيتها الأمة أبو عبيدة بن الجراح»"
summary:
  ar: "رواية أنس في باب فضائل أبي عبيدة بن الجراح من صحيح مسلم؛ شهادة النبوة بأمانة أبي عبيدة أمين الأمة — نص الأمانة الأشهر في فضائله."
  tr: "Sahih Müslim'de Ebu Ubeyde ibn el-Cerrah'ın faziletleri bölümünde Enes'in rivayeti; Peygamberimizin Ebu Ubeyde'nin, ümmetin güvenilir kişisi olduğuna dair şahitliği - faziletlerinin güvenilirliğine dair en meşhur metin."
  id: "Riwayat Anas dalam bab tentang keutamaan Abu Ubaidah bin al-Jarrah dalam Sahih Muslim; kesaksian Nabi tentang keteguhan hati Abu Ubaidah, orang yang terpercaya di antara umat — teks paling terkenal tentang keteguhan hati dalam keutamaannya."
