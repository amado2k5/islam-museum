label: { ar: "صحيح البخاري 5107 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 5107 — what was made lawful; what is not lawful", ur: "صحیح بخاری 5107 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 5107 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih al-Bukhari 5107 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih el-Buhari 5107 — Neler caizdir, neler caiz değildir", id: "Sahih al-Bukhari 5107 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… \" وَتُحِبِّينَ \". قُلْتُ نَعَمْ، لَسْتُ بِمُخْلِيَةٍ، وَأَحَبُّ مَنْ شَارَكَنِي فِي خَيْرٍ أُخْتِي. فَقَالَ النَّبِيُّ \" إِنَّ ذَلِكَ لاَ يَحِلُّ لِي \". قُلْتُ يَا رَسُولَ اللَّهِ فَوَاللَّهِ إِنَّا لَنَتَحَدَّثُ أَنَّكَ تُرِيدُ أَنْ تَنْكِحَ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. قَالَ \" بِنْتَ أُمِّ سَلَمَةَ \". فَقُلْتُ نَعَمْ. قَالَ \" فَوَاللَّهِ لَوْ لَمْ تَكُنْ فِي حَجْرِي مَا حَلَّتْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5107، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5107 (Wedlock, Marriage (Nikaah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5107، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5107 (Matrimonio (Nikaah)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5107 (Mariage, Nikah), mentionne ce qui était licite et ce qui ne l'était pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sahih el-Buhari'de 5107 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5107, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
