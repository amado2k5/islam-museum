label: { ar: "الموطأ 409 — بلاغ: القاسم وعروة وأبو بكر بن عبد الرحمن يتنفلون في السفر", en: "Muwatta 409", es: "Muwatta 409", fr: "Muwatta 409", ur: "موطا 409", tr: "Al-Muwatta 409 — Rapor: Al-Qasim, Urwah ve Abu Bakr ibn Abd al-Rahman yolculuk sırasında nafile namaz kılıyorlar", id: "Al-Muwatta 409 — Laporan: Al-Qasim, Urwah, dan Abu Bakar ibn Abd al-Rahman melakukan shalat sunnah saat bepergian" }
summary:
  ar: "بلاغ في باب صلاة النافلة في السفر: يروي مالك أنه بلغه أن القاسم بن محمد وعروة بن الزبير وأبا بكر بن عبد الرحمن كانوا يتنفلون في السفر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.214}"
  tr: "Yolculuk sırasında yapılan gönüllü namazlarla ilgili bir rivayet: Malik, el-Kâsım ibn Muhammed, Urve ibn el-Zübeyr ve Ebu Bekir ibn Abdülrahman'ın yolculuk sırasında gönüllü namazlar kıldıklarını işittiğini rivayet eder. Editör, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.214}"
  id: "Sebuah riwayat mengenai salat sunnah saat bepergian: Malik meriwayatkan bahwa ia mendengar bahwa al-Qasim ibn Muhammad, Urwah ibn al-Zubayr, dan Abu Bakr ibn Abd al-Rahman biasa melaksanakan salat sunnah saat bepergian. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.214}"
