text: "… هي مجامع التوحيد العلمي الاعتقادي الذي يُباين صاحبُه جميعَ فرق الضلال والشرك، ولذلك كانت تَعْدِل ثلثَ القرآن، فإن القرآن مدارُه على الخبر والإنشاء، والإنشاء ثلاثة: أمر، ونهي، وإباحة. والخبر نوعان: خبر عن الخالق تعالى وأسمائه وصفاته وأحكامه، وخبر عن خلقه …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 101، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 101, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 101 کا اقتباس جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
