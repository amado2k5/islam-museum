text: "… هي مجامع التوحيد العلمي الاعتقادي الذي يُباين صاحبُه جميعَ فرق الضلال والشرك، ولذلك كانت تَعْدِل ثلثَ القرآن، فإن القرآن مدارُه على الخبر والإنشاء، والإنشاء ثلاثة: أمر، ونهي، وإباحة. والخبر نوعان: خبر عن الخالق تعالى وأسمائه وصفاته وأحكامه، وخبر عن خلقه …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 101، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 101, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 101 کا اقتباس جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, pág. 101, que habla de una acción que equivale a otra mayor; del texto extraído, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, p. 101, qui parle d'un acte qui en vaut un plus grand; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin 101. sayfasında, daha büyük bir eyleme denk bir eylemden bahsedilmektedir; alıntılanan metin, kaynakların politikasına göre yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah bagian dari Zad al-Ma’ad karya Ibn al-Qayyim, hlm. 101, menyebutkan suatu perbuatan yang setara dengan perbuatan yang lebih besar; dari versi yang dikutip, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
