text: "… إلى بنت حكيم الانصارية ايضاً إلى مولاة عائشة الاساء عدد الصفحات بدد الاسماء ليلى مة تبد الرحمن بن ابي ليلى ايض إلى بنت قانف النقية ليلى السدوسية امراة بشير بن الخصاصية إلى الغفارية كانت تداوى الجرحى. • رباب اليم مارية …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 10، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 1, p. 10, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 1، ص 10 کا اقتباس جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 1, pág. 10, que menciona el tratamiento de heridas, mujeres que atendían a los heridos y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 1, page 10, qui mentionne le traitement des blessures, les femmes soignant les blessés, la recherche de soins; extrait de la numérisation automatique, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 1. cildinin 10. sayfasından, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedaviden bahseden bir bölüm; makineyle okunabilir resimli versiyondan alınmıştır ve kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 1, hlm. 10, yang menyebutkan pengobatan luka, wanita yang merawat orang terluka, dan pengobatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
