text: |-
  • ⁦(فصل الراء)⁩ •
  الذى يدفئك والجمع الادفاء تقول ماعليه دف لانه اسم ولا تقل ما عليه دفاءة لانه مصدر
  وتقول اقعد فى دفءهذا الحائط أى كنه ورجل دفئ على فعل اذ اليس ما يدفته وكذلك
  رجل دفا ن وامر أة دفاى وقد أدفأه الثوب وتدفأهو بالثوب واستدفأبه وادّفأبه وهو
  افتعل أى لبس مايدفه ودفؤت ليلتنا بالضم ويوم دفىء على فعيسل وليسلة دفيئة وكذلك
  الثوب والبيت والمدفمة الابل الكثيرة لان بعضها يد فئ بعضا با نفاسها وقد يشدد والمدفأة
  إلابل الكثيرة الاوبار والشحوم عن الاصمعى وأنشد لنشماخ
  وكيف يضيع صاحب مدفات * على أثباجهنّ من الصقبع
  والدفئى مثال العجمىّ المطر الذى يكون بعد الربيع قبسل الصيف حين تذهب السكمأة فلايبقى
  فى الارض منهاشئ قال الاصحى دفى ودثئىّ بالناء قال أبوزيد كل ميرة يمتارونها قبل
  الصيف فهى دقئية مثال عجمية قال وكذلك النتاج قال وأول الدفئىّ وقوع الجبهة وآخره
  الصرفة ⁦(دكا)⁩ أبوزيددا كأت القوم مدا كأة اذازاحتهم ويقال دا كأت عليه
  الديون وتدأكأ القوم أى تزاحوا ( نأ . لدنءالخسيس من الرجال الدون وقد
  دنأ الرجل يدنأ صارد نيئا لا خير فيه وانه لدائئ خبين وما كان داننا ولقددنأودنو أ يضادنو.ة
  أدناءة أى سفل فى فعله ومجن والدنينة النقيصة والدنأ الحدب والادنأ الاحدب ⁦(دوأ )⁩.
  إلداء المرض والجمع أدواء وقدداء الرجل يداء داء هرض فهوداء وقددئت يارجل وأدأت
  أيضا فأنت مدىء وأدأته أنا أى أصبثه بداء يتعدى ولا يتعدى أبو زيد تقول للرجل اذا
  اتهمته قد أدأت إذاءة وأدوأت إدوا وقولهم به دا ظي معناه انه ليس به داء كمالإداء بالظى
  صل الذال رأ ذرأ اللّٰه اطاق يذرأهم ذرء اخلقهم ومنه الذرية وهى نسل
  الثقلين الاأنّ العرب تركت همزها والجمع الذرارى وفى الحديث ذرء النار أى أنهم خلقوالها
  ومن قال ذروالنار بغيرهمز أرادانهم يذرون فى النار والذرأ بالتحريك الشيب فى مقسدم
  الرأس رجل أذرأ وامى أة ذرآء وذرئ شعره وذرألغتان قال الراجز
  رأين شيخاذرثت مجاليه * يقلى الغوانى والغوانى تقليه
  والاسم الذرأة بالضم وقال
  وقدعلتى ذرأقبادى بدى • ورئية تنهض فى تشدد
  وفرس أذرأ وجدى أذرأ أى أرقش الاذنين وسايره أسود وعناق ذرآء وهو من شيات المعز
  دون الضأن وملح ذرآً نى وذرآنى يتحريك الراء وتسكينها اللملح الشديد البياض وهومأخوذ
  من الذرأة ولا تقل أنذرانى وحكى بعضهم ذرأت الارض أى بذرتها وزرع ذرىء على فعيل
  وأنتد
  شققت القلب ثم ذرأت فيه هوافليم فالتام الفطور
  والصحيح ثم ذريت غير مهمو زويروى ثم ذورت فيه ⁦(ذيأ )⁩ ذيأت اللحم فتذيا اذا أنضحته
  جتى يسقط من عظمه وتذيأت القرحة فسدت وتقطعت
  ضل الرا) ( أرأ أرا السراب لمع ورأرأت المرأة بعينها برقت أبو زيدر أرأت
  عيناه اذا كان يديرهما وهو رجل رأرأ العينعلى فعال ⁦(ربأ)⁩ المربأة المرقبة وكذلك
