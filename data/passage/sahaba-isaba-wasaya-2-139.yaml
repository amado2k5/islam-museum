text: "… إلى الكعبة، وكان قد أوصى لرسول وحوح أن البراء بن مالك جاء إلى النبي للا خِر وقال: اللّٰه وقَالفِ، فقبل وصيته، ثم ردها على ولده، وصلى عليه مرني بما شئت، قال: اذْهَبْ فَاقْتُلْ أَبَاكَ، فلما أدبر، يعني على قبره وكبر …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 139، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
