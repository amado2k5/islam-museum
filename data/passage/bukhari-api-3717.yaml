label: { ar: "صحيح البخاري 3717 — وصية أو عهد أخير", en: "Sahih al-Bukhari 3717 — a testament or parting counsel", ur: "صحیح بخاری 3717 — وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 3717 — un testamento o consejo de despedida", fr: "Sahih al-Bukhari 3717 — un testament ou un conseil d'adieu", tr: "Sahih el-Buhari 3717 — Son bir vasiyet veya antlaşma", id: "Sahih al-Bukhari 3717 — Sebuah wasiat atau perjanjian terakhir" }
text: "… قَالَ أَخْبَرَنِي مَرْوَانُ بْنُ الْحَكَمِ، قَالَ أَصَابَ عُثْمَانَ بْنَ عَفَّانَ رُعَافٌ شَدِيدٌ سَنَةَ الرُّعَافِ، حَتَّى حَبَسَهُ عَنِ الْحَجِّ وَأَوْصَى، فَدَخَلَ عَلَيْهِ رَجُلٌ مِنْ قُرَيْشٍ قَالَ اسْتَخْلِفْ. قَالَ وَقَالُوهُ قَالَ نَعَمْ. قَالَ وَمَنْ فَسَكَتَ، فَدَخَلَ عَلَيْهِ رَجُلٌ آخَرُ ـ أَحْسِبُهُ الْحَارِثَ ـ فَقَالَ اسْتَخْلِفْ. فَقَالَ عُثْمَانُ وَقَالُوا فَقَالَ نَعَمْ. قَالَ وَمَنْ هُوَ فَسَكَتَ قَالَ فَلَعَلَّهُمْ قَالُوا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3717، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3717 (Companions of the Prophet), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3717، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3717 (Compañeros del Profeta), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 3717 (Compagnons du Prophète), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 3717 numaralı hadis, son vasiyetten bahsetmektedir. Bu hadis, vasiyetler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3717, menyebutkan wasiat terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
