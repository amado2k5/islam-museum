label: { ar: "الموطأ 906 — سأل رجل النبي عما يلبس المحرم من الثياب: لا تلبسوا القمص ولا العمائم ولا السراويلات ولا البرانس ولا الخفاف، إلا أحداً لا يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين", en: "Muwatta 906", es: "Muwatta 906", fr: "Muwatta 906", ur: "موطا 906", tr: "El-Muvatta 906 — Bir adam Peygamberimize ihramlı bir hacının giymesi gereken kıyafetler hakkında sordu: “Gömlek, sarık, pantolon, pelerin veya ayakkabı giymeyin; ancak sandalet bulamayan kişi ayakkabı giyebilir ve bilek hizasından kesebilir.”", id: "Al-Muwatta 906 — Seorang pria bertanya kepada Nabi tentang pakaian yang harus dikenakan oleh seorang jamaah haji yang sedang ihram: “Janganlah kalian mengenakan kemeja, sorban, celana panjang, jubah, atau sepatu, kecuali jika seseorang tidak dapat menemukan sandal, dalam hal ini ia boleh mengenakan sepatu dan memotongnya di bawah mata kaki.”" }
text: "لا تلبسوا القمص، ولا العمائم، ولا السراويلات، ولا البرانس، ولا الخفاف، إلا أحد لا يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين"
summary:
  ar: "أول حديث في باب ما ينهى عنه من لبس الثياب في الإحرام. يرويه مالك عن نافع عن عبد الله بن عمر، أن رجلاً سأل النبي عما يلبس المحرم من الثياب، فقال: لا تلبسوا القمص ولا العمائم ولا السراويلات ولا البرانس ولا الخفاف، إلا أحداً لا يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين، ولا تلبسوا من الثياب شيئاً مسه الزعفران ولا الورس. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن ماجة وابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (5803)، وغيرهم كثير. {cite:muwatta-maruf-1997 p.436} {cite:muwatta-maruf-1997 p.437}"
  tr: "İhramda giyimle ilgili yasaklar bölümündeki ilk hadis, Malik'in Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, bir adam Peygamberimize ihramlı bir hacının ne giyebileceğini sormuş ve Peygamberimiz şöyle buyurmuştur: \"Gömlek, sarık, pantolon, kapüşonlu pelerin veya deri çorap giymeyin. Ancak sandalet bulamayanlar deri çorap giyebilir, fakat çorapları bilek hizasından kesmelidir. Safran veya aspir ile temas etmiş hiçbir giysi giymeyin.\" Editör, bu hadisin Malik'ten Ebu Musab tarafından, onun isnadından da İbn Majah, İbn Hibban, el-Baghawi, İsmail ibn Abi Uways tarafından Buhari'de (5803) ve daha birçok kişi tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.436} {cite:muwatta-maruf-1997 s.437}"
  id: "Hadits pertama dalam bab ini membahas tentang pakaian yang dilarang saat ihram. Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, bahwa seorang pria bertanya kepada Nabi tentang pakaian apa yang boleh dikenakan oleh seorang jamaah haji saat ihram, dan beliau bersabda: “Jangan mengenakan kemeja, sorban, celana panjang, jubah berkerudung, atau kaus kaki kulit, kecuali jika seseorang tidak dapat menemukan sandal, dalam hal ini ia boleh mengenakan kaus kaki kulit, tetapi harus dipotong di bawah mata kaki. Dan jangan mengenakan pakaian apa pun yang telah terkena safron atau bunga safflower.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan dari sanadnya oleh Ibn Majah, Ibn Hibban, al-Baghawi, Ismail ibn Abi Uways dalam al-Bukhari (5803), dan banyak lainnya. {cite:muwatta-maruf-1997 p.436} {cite:muwatta-maruf-1997 p.437}"
