label: { ar: "الموطأ 906 — سأل رجل النبي عما يلبس المحرم من الثياب: لا تلبسوا القمص ولا العمائم ولا السراويلات ولا البرانس ولا الخفاف، إلا أحداً لا يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين", en: "Muwatta 906" }
text: "لا تلبسوا القمص، ولا العمائم، ولا السراويلات، ولا البرانس، ولا الخفاف، إلا أحد لا يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين"
summary:
  ar: "أول حديث في باب ما ينهى عنه من لبس الثياب في الإحرام. يرويه مالك عن نافع عن عبد الله بن عمر، أن رجلاً سأل النبي عما يلبس المحرم من الثياب، فقال: لا تلبسوا القمص ولا العمائم ولا السراويلات ولا البرانس ولا الخفاف، إلا أحداً لا يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين، ولا تلبسوا من الثياب شيئاً مسه الزعفران ولا الورس. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن ماجة وابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (5803)، وغيرهم كثير. {cite:muwatta-maruf-1997 p.436} {cite:muwatta-maruf-1997 p.437}"
