text: "… عمرو بن كلثوم ومعه مِزْود وَرَكْوة وعصا، ورأيته لا يفارقها مُشاة كما أو رُكانا وهو يقول : إن اللّه جعل جمّاع أمر موسى وأعاجيبه وبراهينه ومآربه فى عصاه، ويُكثر من هذا وأنا أضحك متهاونا بما يقول، فتخلّف المُكّارى فكان حمار …"
