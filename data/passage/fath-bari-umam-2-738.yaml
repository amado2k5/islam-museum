text: "… السكين. ما قيل في قتال الروم.. قتال اليهود.. قتال الترك. قتال الذين ينتعلون الشعر.. من صف أصحابه عند الهزيمة، ونزل عن دابته واستنص الدعاء على المشركين بالهزيمة والزلزلة.. هل يرشد المسلم أهل الكتاب، أو يعلمهم الكتاب؟.. الدعاء للمشركين بالهدى ليتالفهم.. …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 738، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 738, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 738 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
