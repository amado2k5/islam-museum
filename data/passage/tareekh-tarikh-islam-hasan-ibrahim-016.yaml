text: "ذا المال، وبعث إلى ابن طولون بكتاب ينطوي على الجفاء والشر، فرد عليه بكتاب شديد اللهجة . وعلى الرغم من أن الخليفة العباسي كان يميل إلى ابن طولون، أرغم على عزله من ولاية الثغور الشامية، ولكنه لم يلبث أن ردها"
