text: |-
  ٣٩٦
  ⁦(مخر)⁩
  واللّٰه لولا شيخنا عباد • لكمرونا اليوم أول كادوا
  كثر أبوعم روالكمترة مشية فيها تقارب مثل الكردحة ويقسال قطرة وكترة بعف والكمتر
  والكاتر القصير مثل الكندر والسكتادر ميدلات ⁦(كمثر)⁩ الكمثرى من الفواكه الواحدة
  كسثراة.⁦( كور)⁩ كار العمامة على رأسه يكورها كوراً أى لانها وكل دور كور وقولهم
  نعو ذباللّه من المور بعد الكور أى من النقصان بعد الزيادة والكورأ يضا الهاعة الكثيرة
  من الابل يقال على فلان كورمن الابل وجعله أبوذؤيب فى البقرأيضا فقال
  ولا مشب من الثيران آفرده * عن كوره كثرة الاغراء والعارد
  والكوريا اضم الرحل باداته والجع أكواروكيران والكورأيضا كورالحداد المبنى من الطيز
  والسكور أيضاموضع الزنابير وكوارة النحل عسلها فى الشمع والكورة المدينة والصقع والجع
  كور والسكارة ما يحمل على الظهرمن النياب وند وبر المشاع بجعه وشده ويقال طعفه
  فكوره أى آلقاءمجتمعا وأنشد آيوعبدة
  ضربناه أم الرآس والنقع ساطع ، فخرصر يعالليدين مكورا
  وكورته فتكوّر أى سقط قال أبو كبير الهذلى
  متكوّرين على المعادى بإنهم • ضرب كتعطاط المراد الاتجل
  وتكوير العماسة كورها وتكوير الليل على النهار تغشيته اياه ويقال زيادة هذا من ذاك
  وقوله تعالى اذا الشمس كوّرت قال ابن عباس رضى اللّٰه عن مغوّرت وقال قنادة ذهب
  ضوءها وقال أبو عبيدة كوّرت مثسل تكوير العمامة تلف فتمعى والتكوّر التقطر والتشهر
  واكتار الفرس رفع ذنبه فى حضره ور بما قالوا كار الرجل اذا أسرع فى مشيته حكاه ابن دريد
  ورجل مكورّى أى اميم قال أبو بكر بن السراج هو العظيم روثة الانف ما خوذ من كوّره اذا
  جعه قال وهو مفعلى بتشديد اللام لان فعللى لم يجى قال وقد تحذف الالف فيقال مكور
  ⁦( كهر)⁩ كهر النهار يكهركهراارفع قال الشاءر(عدى بن زي
  فاذا العانة فى كهر الضحى * دونها أحقب ذولم زيم
  والكهر أيضا الانتها روفى قراءة عبد اللّٰه بن مسعود رضى اللّٰه عفه فأما اليقيم فلا تكهر قال
  ا سائى كهره وقهره بمعنى قال والكنهور العظيم من السحاب ⁦( بر)⁩ أبوهر والكبر كير
  الحدادوهوزق أوجلد غليظ ذوحاقات وأما المبى من الطين فه والكوروكيراسم جبل
  ف ل الميم ( أ لثرة بالهمز الذحل والعداوة وجحعها مثر أبوزيد مأرت بين
  القوم مأراوماءرن بينهم مماءرة أى عاديت بينه-م وأفسدت قال والاسم المترة واله-ع متر
  وقال الاموى ماءرته مماءرة فاخرته حكاه عنه أيو عبيد قال وقال أبوز يديقال هم فى امر مهر
  يفتح الميم أى شديد⁦( متر)⁩ المترالمة وقد مترت الحبل أى مددته وربماكنى به عن البضاع
  ومتربسلحه اذارمى به مثل متح والمترافسة فى البتروهوالقطع ⁦(مجر)⁩ الجر بالتسكيز الجيش
  السكثير والجرأيضا أن يباع الشى بما فى بطن هذه الناقة وفى الجديث انه نهى عن الجوية ال
  منه أمجرت فى البيح امجارا و يقال أيضاماله مجراى عقل والجر بالتحريك الاسم من قولك
  أمجرت الشاة فهى ممجر وهو أن يعظم ما فى بطنها من الحمل وتكون مهزولة لاتقدر على النهوض
  ويقاله
