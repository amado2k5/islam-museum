label: { ar: "الموطأ 151 — ابنة زيد بن ثابت تعيب طلب الطهر بالمصابيح من جوف الليل", en: "Muwatta 151", es: "Muwatta 151", fr: "Muwatta 151", ur: "موطا 151", tr: "El-Muvatta 151 — Zeyd ibn Sabit'in kızı, gecenin yarısında lambalar kullanarak temizlik arama uygulamasını eleştiriyor.", id: "Al-Muwatta 151 — Putri Zayd ibn Thabit mengkritik praktik mencari kesucian dengan menggunakan lampu di tengah malam." }
summary:
  ar: "أثر يرويه مالك عن عبد الله بن أبي بكر عن عمته عن ابنة زيد بن ثابت، في باب طهر الحائض: بلغها أن نساءً كن يدعون بالمصابيح من جوف الليل ينظرن إلى الطهر، فكانت تعيب ذلك عليهن وتقول إن النساء لم يكنّ يصنعن هذا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ومعن بن عيسى ويحيى بن بكير، وينقل عن البيهقي أنه روي على وجه آخر. {cite:muwatta-maruf-1997 p.104}"
  tr: "Malik'in Abdullah ibn Abi Bekr'den, onun teyzesinden, onun da Zeyd ibn Sabit'in kızından rivayet ettiği, adet gören kadının temizlenmesi bölümündeki bir rivayette şöyle denmektedir: Bazı kadınların gece yarısı temizliklerini kontrol etmek için lambalar yaktıklarını duymuş ve bunu kınayarak, kadınların böyle yapmadığını söylemiştir. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd, Muhammed ibn el-Hasan, Ma'n ibn İsa ve Yahya ibn Bukayr tarafından nakledildiğini ve el-Beyhaki'nin de başka bir şekilde rivayet edildiğini aktarmaktadır. {cite:muwatta-maruf-1997 s.104}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Abdullah ibn Abi Bakr, atas otoritas bibinya, atas otoritas putri Zayd ibn Thabit, dalam bab tentang penyucian wanita yang sedang haid: Ia mendengar bahwa beberapa wanita memanggil lampu di tengah malam untuk memeriksa kesucian, dan ia mengkritik mereka karena hal itu, dengan mengatakan bahwa wanita tidak biasa melakukan hal itu. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, Muhammad ibn al-Hasan, Ma'n ibn Isa, dan Yahya ibn Bukayr, dan ia mengutip al-Bayhaqi yang mengatakan bahwa riwayat ini dinarasikan dalam bentuk lain. {cite:muwatta-maruf-1997 p.104}"
