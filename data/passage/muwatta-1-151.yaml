label: { ar: "الموطأ 151 — ابنة زيد بن ثابت تعيب طلب الطهر بالمصابيح من جوف الليل", en: "Muwatta 151" }
summary:
  ar: "أثر يرويه مالك عن عبد الله بن أبي بكر عن عمته عن ابنة زيد بن ثابت، في باب طهر الحائض: بلغها أن نساءً كن يدعون بالمصابيح من جوف الليل ينظرن إلى الطهر، فكانت تعيب ذلك عليهن وتقول إن النساء لم يكنّ يصنعن هذا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ومعن بن عيسى ويحيى بن بكير، وينقل عن البيهقي أنه روي على وجه آخر. {cite:muwatta-maruf-1997 p.104}"
