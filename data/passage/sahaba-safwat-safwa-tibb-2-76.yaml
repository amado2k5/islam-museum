text: "… وطعامك الجوع وحديثك المناجاة فاما ان تموت بدائك او تصل الى دوائك - ب - اخبرنا عبدالرحمن بن قال انا احمد بن على الحافظ قال أخبرنا احمد ابن على التوزى قال نا بن الحسين السلمى قال سمعت ابن يوسف الأبهرى …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 2، ص 76، يذكر أعضاء البدن، والدواء، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 2, p. 76, that mentions the organs of the body, the drug, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 2، ص 76 کا اقتباس جس میں اعضائے بدن، دوا، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen escaneado 2, pág. 76, que menciona los órganos del cuerpo, el medicamento, la enfermedad y su remedio; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Sifat al-Safwa d'Ibn al-Jawzi, volume 2, p. 76, qui mentionne les organes du corps, le médicament, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin resimli 2. cildinin 76. sayfasından, vücut organları, tıp ve hastalıklardan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari kitab “Sifat al-Safwa” karya Ibn al-Jawzi, jilid 2 bergambar, halaman 76, yang menyebutkan organ-organ tubuh, pengobatan, dan penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
