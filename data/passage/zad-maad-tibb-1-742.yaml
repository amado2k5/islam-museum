text: "… من أكل البصلَ أربعينَ يوماً وكَلِفَ، فلا يلومَنَّ إلَّا نفسه. ومن افتصَدَ، فأكل مالِحاً فأصابه بَهَقٌّ أو جَرَبٌ، فلا يلو مَنَّ إلَّا نفسَه. ومَن جمع في معدته البيض والسمكَ، فأصابه فالج أو لَقْوَةٌ، فلا يلومَن إلَّا نفسَه. يلو منَّ إلَّا …"
summary:
