text: "عن راشد بن سعد، عن حمرة (٢) بن عبد كلال قال : سار عمر بن الخطاب إلى الشام بعد مسيره الأول كان إليها، حتى إذا شارفها ، بلغه ومن معه أن الطاعون فاش فيها ، فقال له أصحابه: ارجع ولا"
