label: { ar: "الموطأ 31 — سالم بن عبد الله ينزع الثوب عن فم المصلي", en: "Muwatta 31", es: "Muwatta 31", fr: "Muwatta 31", ur: "موطا 31", tr: "El-Muvatta 31 — Salim bin Abdullah, ibadet edenin ağzından bezi çıkarır.", id: "Al-Muwatta 31 — Salim bin Abdullah menyingkirkan kain dari mulut orang yang sedang beribadah" }
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن المجبر، في باب النهي عن دخول المسجد بريح الثوم وتغطية الفم: كان سالم بن عبد الله بن عمر إذا رأى رجلاً يغطي فمه وهو يصلي جذب الثوب عن فيه جذباً شديداً حتى ينزعه. ويعرّف المحقق بعبد الرحمن بن المجبر بأنه عبد الرحمن بن عبد الرحمن بن عمر بن الخطاب، سُمي المجبر لأنه سقط فتكسر فجُبر، وينقل عن ابن ماكولا أنه لا يُعرف في الرواة ثلاثة في النسق بهذا الاسم سواه. {cite:muwatta-maruf-1997 p.49}"
  tr: "Malik'in Abdülrahman ibn mücebbir'den rivayet ettiği, sarımsak kokusuyla camiye girmenin ve ağzı örtmenin yasaklanması bölümündeki bir rivayete göre: Salim ibn Abdullah ibn Ömer, namaz kılarken ağzını örten birini gördüğünde, örtüyü zorla ağzından çekip çıkarırdı. Araştırmacı, Abdülrahman ibn mücebbir'i Abdülrahman ibn Abdülrahman ibn Ömer ibn el-Hattab olarak tanımlamaktadır. Ona mücebbir denmesinin sebebi, düşüp kemiğini kırması ve daha sonra kemiğinin yerine oturtulmasıdır. İbn Makula'dan rivayet edildiğine göre, bu isimle rivayet zincirinde başka üç ravi daha bilinmemektedir. {cite:muwatta-maruf-1997 s.49}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Abd al-Rahman ibn al-Mujabbir, dalam bab tentang larangan memasuki masjid dengan bau bawang putih dan menutup mulut: Ketika Salim ibn Abdullah ibn Umar melihat seorang pria menutup mulutnya saat shalat, ia akan menarik kain itu dari mulutnya dengan paksa hingga terlepas. Peneliti mengidentifikasi Abd al-Rahman ibn al-Mujabbir sebagai Abd al-Rahman ibn Abd al-Rahman ibn Umar ibn al-Khattab. Ia disebut al-Mujabbir karena ia jatuh dan patah tulang, yang kemudian diobati. Diriwayatkan dari Ibn Makula bahwa tidak ada tiga perawi lain dengan nama ini yang dikenal dalam rantai periwayatan. {cite:muwatta-maruf-1997 p.49}"
