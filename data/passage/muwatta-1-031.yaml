label: { ar: "الموطأ 31 — سالم بن عبد الله ينزع الثوب عن فم المصلي", en: "Muwatta 31" }
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن المجبر، في باب النهي عن دخول المسجد بريح الثوم وتغطية الفم: كان سالم بن عبد الله بن عمر إذا رأى رجلاً يغطي فمه وهو يصلي جذب الثوب عن فيه جذباً شديداً حتى ينزعه. ويعرّف المحقق بعبد الرحمن بن المجبر بأنه عبد الرحمن بن عبد الرحمن بن عمر بن الخطاب، سُمي المجبر لأنه سقط فتكسر فجُبر، وينقل عن ابن ماكولا أنه لا يُعرف في الرواة ثلاثة في النسق بهذا الاسم سواه. {cite:muwatta-maruf-1997 p.49}"
