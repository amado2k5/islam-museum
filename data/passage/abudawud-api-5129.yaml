label: { ar: "سنن أبي داود 5129 — عمل يعدل عملا أعظم منه", en: "Sunan Abi Dawud 5129 — a deed that equals a greater one", ur: "سنن ابی داؤد 5129 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sunan Abi Dawud 5129 — una acción que equivale a una mayor", fr: "Sunan Abi Dawud 5129 — une action qui en vaut une plus grande", tr: "Sunan Abi Davud 5129 — Daha büyük bir eyleme denk olan bir eylem", id: "Sunan Abi Dawud 5129 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… الأَعْمَشِ، عَنْ أَبِي عَمْرٍو الشَّيْبَانِيِّ، عَنْ أَبِي مَسْعُودٍ الأَنْصَارِيِّ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أُبْدِعَ بِي فَاحْمِلْنِي. قَالَ \" لاَ أَجِدُ مَا أَحْمِلُكَ عَلَيْهِ وَلَكِنِ ائْتِ فُلاَنًا فَلَعَلَّهُ أَنْ يَحْمِلَكَ \". فَأَتَاهُ فَحَمَلَهُ فَأَتَى رَسُولَ اللَّهِ فَأَخْبَرَهُ فَقَالَ رَسُولُ اللَّهِ \" مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5129، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 5129 (General Behavior (Kitab Al-Adab)), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 5129، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5129 (Conducta General (Kitab Al-Adab)), habla de una acción que equivale a otra mayor. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 5129 (Guide des mœurs), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pondération des actes."
  tr: "Sunan Ebu Davud'da yer alan 5129 numaralı hadiste, daha büyük bir ameli sayan bir amelden bahsedilir. Bu amel, iyi ve kötü ameller listeleriyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 5129, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
