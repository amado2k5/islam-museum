text: "… ويعلم أنهم بعد الزوال، وتأخير البيان عن وقت الحاجة ممتنع، واللَّه أعلم. سمن: روى محمد بن جرير الطبري بإسناده، مِن حديث صُهيب يرفعُه: عَلَيْكُم بأَلْبَانِ البقر، فَإِنَّهَا شِفَاءٌ، وَسَمْنُهَا دَوَاءٌ، ولَحُومُها داءً رواه عن أحمد بن الحسن الترمذي، حدثنا محمد …"
