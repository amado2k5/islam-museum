text: "ٱدْعُوهُمْ لِـَٔابَآئِهِمْ هُوَ أَقْسَطُ عِندَ ٱللَّهِ ۚ فَإِن لَّمْ تَعْلَمُوٓا۟ ءَابَآءَهُمْ فَإِخْوَٰنُكُمْ فِى ٱلدِّينِ وَمَوَٰلِيكُمْ ۚ وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَآ أَخْطَأْتُم بِهِۦ وَلَـٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ ۚ وَكَانَ ٱللَّهُ غَفُورًا رَّحِيمًا"
text_search: "ادعوهم لآبائهم هو أقسط عند الله ۚ فإن لم تعلموا آباءهم فإخوانكم في الدين ومواليكم ۚ وليس عليكم جناح فيما أخطأتم به ولكن ما تعمدت قلوبكم ۚ وكان الله غفورا رحيما"
translations:
  en: { text: "Proclaim their real parentage. That will be more equitable in the sight of Allah. And if ye know not their fathers, then (they are) your brethren in the faith, and your clients. And there is no sin for you in the mistakes that ye make unintentionally, but what your hearts purpose (that will be a sin for you). Allah is ever Forgiving, Merciful.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "مومنو! لےپالکوں کو اُن کے (اصلی) باپوں کے نام سے پکارا کرو۔ کہ خدا کے نزدیک یہی بات درست ہے۔ اگر تم کو اُن کے باپوں کے نام معلوم نہ ہوں تو دین میں وہ تمہارے بھائی اور دوست ہیں اور جو بات تم سے غلطی سے ہوگئی ہو اس میں تم پر کچھ گناہ نہیں۔ لیکن جو قصد دلی سے کرو (اس پر مواخذہ ہے) اور خدا بخشنے والا مہربان ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
