text: "… بن جابر ثنا عقيل بن معقل. قال سممت همى وهب بن منبه يقول : لكل شئ علامة يعرف بها وتشهد له أو عليه، وان للدين ثلاث علامات يعرف بان، وهى الايمان والعلم والعمل. وللإيمان ثلاث علامات : الايمان بالله وملائكته …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 47، يذكر الإيمان بالله وملائكته وكتبه ورسله، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 47, that mentions belief in God, His angels, His books and His messengers, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 4، ص 47 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 4, pág. 47, que menciona la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Hilyat al-Awliya' d'Abu Nu'aym (tome 4, page 47) mentionnant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, un des articles de foi. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 4. resimli cildinin 47. sayfasında, Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inancın, imanın temel direklerinden biri olduğu belirtilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temel direkleri, imanın temel direkleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 4, halaman 47, menyebutkan kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya, serta salah satu rukun iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
