label: { ar: "جامع الترمذي 3619 — الأب والأبوة", en: "Jami' al-Tirmidhi 3619 — the father and fatherhood", ur: "جامع ترمذی 3619 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3619 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3619 — le père et la paternité" }
text: "… حَدَّثَنَا أَبِي قَالَ، سَمِعْتُ مُحَمَّدَ بْنَ إِسْحَاقَ، يُحَدِّثُ عَنِ الْمُطَّلِبِ بْنِ عَبْدِ اللَّهِ بْنِ قَيْسِ بْنِ مَخْرَمَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ وُلِدْتُ أَنَا وَرَسُولُ اللَّهِ، عَامَ الْفِيلِ. وَسَأَلَ عُثْمَانُ بْنُ عَفَّانَ قُبَاثَ بْنَ أَشْيَمَ أَخَا بَنِي يَعْمُرَ بْنِ لَيْثٍ أَأَنْتَ أَكْبَرُ أَمْ رَسُولُ اللَّهِ فَقَالَ رَسُولُ اللَّهِ أَكْبَرُ مِنِّي وَأَنَا أَقْدَمُ مِنْهُ فِي الْمِيلاَدِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3619، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3619 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3619، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3619 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3619 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
