label: { ar: "الموطأ 355 — إذا صلى أحدكم بالناس فليخفف", en: "Muwatta 355" }
text: "إذا صلى أحدكم بالناس فليخفف، فإن فيهم الضعيف والسقيم والكبير، وإذا صلى أحدكم لنفسه فليطول ما شاء"
summary:
  ar: "أول حديث في باب العمل في صلاة الجماعة. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: أمر النبي من صلى بالناس أن يخفف لأن فيهم الضعيف والسقيم والكبير، ومن صلى لنفسه فليطول ما شاء. ويخرّجه المحقق عند البخاري (703) وأبي داود (794) والنسائي (2/94) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن أكثر الرواة عن مالك لا يقولون فيه «والكبير» وقاله يحيى وقتيبة، وأن زيادة «وذا الحاجة» محفوظة من حديث أبي هريرة وأبي مسعود وعثمان بن أبي العاص (التمهيد 19/4). {cite:muwatta-maruf-1997 p.195}"
