label: { ar: "الموطأ 728 — مالك: النخيل تخرص على أهلها إذا طاب ثمرها، فإن أصابتها جائحة بعد الخرص فلا صدقة إلا فيما بقي إن بلغ خمسة أوسق", en: "Muwatta 728" }
summary:
  ar: "قول لمالك: الأمر المجتمع عليه عندنا أن النخيل تُخرص على أهلها وثمرها في رؤوسها إذا طاب وحل بيعه، ويؤخذ منه صدقته تمراً عند الجداد؛ فإن أصابت الثمرة جائحة بعد أن تُخرص وقبل أن تُجذ فأحاطت بالثمر كله فليس عليهم صدقة، فإن بقي من الثمر ما يبلغ خمسة أوسق فصاعداً بصاع النبي أُخذ منهم زكاته وليس عليهم فيما أصابت الجائحة زكاة. ويقول مالك: وكذلك العمل في الكرم أيضاً. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.365}"
