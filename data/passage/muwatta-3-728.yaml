label: { ar: "الموطأ 728 — مالك: النخيل تخرص على أهلها إذا طاب ثمرها، فإن أصابتها جائحة بعد الخرص فلا صدقة إلا فيما بقي إن بلغ خمسة أوسق", en: "Muwatta 728", es: "Muwatta 728", fr: "Muwatta 728", ur: "موطا 728", tr: "El-Muvatta 728 — Malik: Hurma ağaçları, meyveleri olgunlaştığında sahipleri için değerlendirilir. Değerlendirmeden sonra bir musibet meydana gelirse, geriye kalan kısım beş vaska ulaşırsa zekât verilir, ancak kalan kısım üzerinden zekât verilir.", id: "Al-Muwatta 728 — Malik: Pohon kurma diestimasi untuk pemiliknya ketika buahnya sudah matang. Jika mereka ditimpa musibah setelah estimasi, maka tidak ada zakat yang wajib dibayarkan kecuali atas sisa yang mencapai lima wasq." }
summary:
  ar: "قول لمالك: الأمر المجتمع عليه عندنا أن النخيل تُخرص على أهلها وثمرها في رؤوسها إذا طاب وحل بيعه، ويؤخذ منه صدقته تمراً عند الجداد؛ فإن أصابت الثمرة جائحة بعد أن تُخرص وقبل أن تُجذ فأحاطت بالثمر كله فليس عليهم صدقة، فإن بقي من الثمر ما يبلغ خمسة أوسق فصاعداً بصاع النبي أُخذ منهم زكاته وليس عليهم فيما أصابت الجائحة زكاة. ويقول مالك: وكذلك العمل في الكرم أيضاً. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.365}"
  tr: "Malik şöyle dedi: Bizde yerleşik uygulama şudur: Hurma ağaçları, meyveler olgunlaştığında ve satışa hazır olduğunda, henüz ağaçta iken sahipleri için değerlendirilir. Zekat (zorunlu sadaka), hasat zamanında hurma şeklinde alınır. Değerlendirme yapıldıktan sonra, ancak hasattan önce bir musibet meydana gelirse ve musibet tüm meyveleri yok ederse, zekât verilmez. Geriye kalan meyve miktarı, Peygamberimizin sa'sı ile ölçüldüğünde beş vask veya daha fazla ise, zekât onlardan alınır, ancak musibet sonucu yok olan kısım için zekât ödemekle yükümlü değillerdir. Malik ayrıca şöyle dedi: Aynı durum bağlar için de geçerlidir. Editör, el yazmalarındaki farklılıkları doğrular ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.365}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kami adalah bahwa pohon kurma diestimasi untuk pemiliknya selagi buahnya masih di pohon, setelah matang dan siap dijual. Zakat (sedekah wajib) diambil darinya dalam bentuk kurma pada saat panen. Jika musibah menimpa buah setelah estimasi dilakukan tetapi sebelum dipanen, dan musibah tersebut menghancurkan semua buah, maka tidak ada zakat yang wajib dibayar. Jika buah yang tersisa berjumlah lima wasq (satuan ukuran kering) atau lebih, diukur dengan sa' Nabi (satuan ukuran kering), maka zakat diambil dari mereka, tetapi mereka tidak wajib membayar zakat atas apa yang hancur akibat musibah. Malik juga berkata: Hal yang sama berlaku untuk kebun anggur. Editor mengkonfirmasi perbedaan dalam manuskrip dan menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.365}"
