text: "… اعظم الناس ذلا فقير داهن غنيا وتواضع له - امند أبو عبد الله المغربى الحديث عن عمر وبن أبى غيلان وتوفى على جبل الطود فى سنة تمع وتسعين وقيل تسع وسبعين وما تتين وأوصى ان يدفن الى جانب استاذه على …"
summary:
