text: "… وحده، لا شيء قبله ولا شيء بعده، لا شيء قبله ولا شيء بعده وحينا احتضر كان يقرأ الكلمة الطيبة والأدعية المأنورة عن النبي مَّ، وكانت تعاو البسمة على وجهه بعدما توفي. وقد كان وصوله إلى المستشفى بعد الوفاة، فحاول الأطباء …"
