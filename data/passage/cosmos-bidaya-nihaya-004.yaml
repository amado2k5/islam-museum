text: "وكان قبلهم في الأرض الحن والبن فسلط الله الجن عليهم فقتلوهم وأجلوهم عنها وأبادوهم منها وسكنوها بعدهم"
summary:
  ar: "ينقل ابن كثير قول كثير من علماء التفسير إن الجن خُلقوا قبل آدم، وإن الحن والبن كانا يسكنان الأرض قبلهم فأزالهم الجن وسكنوها."
  en: "Ibn Kathir relays the view of many exegetes that the jinn were created before Adam, and that the Hin and Bin lived on the earth before them until the jinn drove them out and settled it."
  es: "Ibn Kathir transmite la opinión de muchos exegetas según la cual los genios fueron creados antes que Adán, y que el Hin y el Bin vivieron en la tierra antes que ellos hasta que los genios los expulsaron y se asentaron en ella."
  fr: "Ibn Kathir rapporte l'opinion de nombreux exégètes selon laquelle les djinns ont été créés avant Adam, et que les Hin et les Bin vivaient sur terre avant eux jusqu'à ce que les djinns les chassent et s'y installent."
  ur: "ابن کثیر نے بہت سے مفسرین کا یہ قول نقل کیا ہے کہ جنات کو آدم سے پہلے پیدا کیا گیا تھا اور ان سے پہلے ہین اور بن زمین پر رہتے تھے یہاں تک کہ جنوں نے انہیں نکال باہر کیا اور آباد کر دیا۔"
  tr: "İbn Kathir, tefsir âlimlerinin birçoğunun cinlerin Âdem'den önce yaratıldığını ve han ile banın onlardan önce yeryüzünde yaşadığını, ancak cinlerin onları uzaklaştırıp yeryüzüne yerleştiğini söylediğini aktarır."
  id: "Ibn Kathir mengutip banyak ulama penafsir yang mengatakan bahwa jin diciptakan sebelum Adam, dan bahwa kaum Han dan Ban pernah mendiami bumi sebelum mereka, tetapi jin mengusir mereka dan mendiami bumi."
