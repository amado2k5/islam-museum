label: { ar: "جامع الترمذي 1578 — الأب والأبوة", en: "Jami' al-Tirmidhi 1578 — the father and fatherhood", ur: "جامع ترمذی 1578 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1578 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1578 — le père et la paternité" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا أَبُو عَاصِمٍ، حَدَّثَنَا بَكَّارُ بْنُ عَبْدِ الْعَزِيزِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، عَنْ أَبِي بَكْرَةَ، أَنَّ النَّبِيَّ أَتَاهُ أَمْرٌ فَسُرَّ بِهِ فَخَرَّ لِلَّهِ سَاجِدًا. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ مِنْ حَدِيثِ بَكَّارِ بْنِ عَبْدِ الْعَزِيزِ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1578، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1578 (The Book on Military Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1578، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1578 (El Libro de las Expediciones Militares), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1578 (Livre des expéditions militaires), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
