text: "… هارون ثنا سفيان بن حسين. قالا : عن ابن شهاب عن أنس بن مالك. قال قال رسول اللّٰه : لا تقاطعوا ولا تدابروا ولا تحاسدوا، وكونوا عباد اللّٰه اخوانا، ولا يحل لمسلم أن يهجر أخاه فوق ثلاث. لفظ مالك صحيح …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 374، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
