label: { ar: "الموطأ 1375 — مالك: التوكيد حلف الإنسان في الشيء الواحد يرددها يمينا بعد يمين، فكفارته كفارة واحدة", en: "Muwatta 1375" }
summary:
  ar: "يقول مالك أما التوكيد فهو حلف الإنسان في الشيء الواحد، يردد فيه الأيمان يمينا بعد يمين، كقوله والله لا أنقصه من كذا وكذا، يحلف بذلك مرارا ثلاثا أو أكثر من ذلك، فكفارة ذلك كفارة واحدة، مثل كفارة اليمين. {cite:muwatta-maruf-1997 p.614}"
