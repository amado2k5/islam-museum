label: { ar: "الموطأ 1375 — مالك: التوكيد حلف الإنسان في الشيء الواحد يرددها يمينا بعد يمين، فكفارته كفارة واحدة", en: "Muwatta 1375", es: "Muwatta 1375", fr: "Muwatta 1375", ur: "موطا 1375", tr: "Al-Muwatta 1375 — Malik: Vurgu, bir kişinin aynı şey hakkında yemin etmesi, bunu bir yemini diğerinin ardından tekrarlaması ve kefaretinin tek bir kefaret olması durumunda söz konusudur.", id: "Al-Muwatta 1375 — Malik: Penekanan terjadi ketika seseorang bersumpah tentang hal yang sama, mengulanginya satu sumpah demi satu sumpah, dan penebusannya adalah satu penebusan." }
summary:
  ar: "يقول مالك أما التوكيد فهو حلف الإنسان في الشيء الواحد، يردد فيه الأيمان يمينا بعد يمين، كقوله والله لا أنقصه من كذا وكذا، يحلف بذلك مرارا ثلاثا أو أكثر من ذلك، فكفارة ذلك كفارة واحدة، مثل كفارة اليمين. {cite:muwatta-maruf-1997 p.614}"
  tr: "Malik şöyle diyor: Vurguya gelince, bu, bir kişinin aynı şey hakkında yemin etmesi, yemin üstüne yemin etmesi, örneğin \"Allah'a yemin ederim ki, onu şundan şundan eksiltmeyeceğim\" demesi ve bunu üç veya daha fazla kez yemin etmesidir. Bunun kefareti, yemin kefareti gibi tek bir kefarettir. {cite:muwatta-maruf-1997 s.614}"
  id: "Malik berkata: Adapun penekanan, itu terjadi ketika seseorang bersumpah tentang hal yang sama, mengulangi sumpah demi sumpah, seperti mengatakan, \"Demi Allah, aku tidak akan menguranginya dari sekian dan sekian,\" bersumpah untuk itu tiga kali atau lebih. Penebusan untuk itu adalah satu penebusan, seperti penebusan untuk sebuah sumpah. {cite:muwatta-maruf-1997 p.614}"
