label:
  ar: "أبو داود 5265 — نبي قرصته نملة: فهلا نملة واحدة"
  en: "Abu Dawud 5265 — A prophet stung by an ant: why not just the one ant"
  ur: "ابو داود 5265 — ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں"
  es: "Abu Dawud 5265 — Un profeta picado por una hormiga: ¿por qué no solo una hormiga?"
  fr: "Abou Dawoud 5265 — Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ?"
text: "نزل نبي من الأنبياء تحت شجرة فلدغته نملة فأمر بجهازه فأخرج من تحتها ثم أمر بها فأحرقت فأوحى الله إليه فهلا نملة واحدة ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 5265: نبي قرصته نملة: فهلا نملة واحدة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 5265: A prophet stung by an ant: why not just the one ant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 5265: ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Abi Dawud, n.° 5265: Un profeta picado por una hormiga: ¿por qué no solo una hormiga? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan Abi Dawud n° 5265: Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et du Muwatta."
