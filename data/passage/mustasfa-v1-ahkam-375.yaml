text: "عقل له، مثل الصبي والمجنون - لا يصح في حقه التكليف. الرابع: أن يكون بحيث يصح إرادة إيقاعه طاعة، وهو أكثر العبادات. ويستثنى من هذا شيئان: أحدهما: الواجب الأول، وهو النظر المعروف للوجوب، فإنه لا يمكن قصد إيقاعه طاعة، وهو …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 375، يرد فيه ذكر الواجب، والوجوب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 375, whose wording mentions the obligatory (wajib), obligation (wujub), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 375 کا اقتباس جس میں واجب، وجوب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
