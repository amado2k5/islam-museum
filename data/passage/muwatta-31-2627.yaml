label: { ar: "الموطأ 2627 — عائشة: ما خُير النبي بين أمرين إلا أخذ أيسرهما ما لم يكن إثما", en: "Muwatta 2627", es: "Muwatta 2627", fr: "Muwatta 2627", ur: "موطا 2627", tr: "El-Muvatta 2627 — Aişe: Peygamberimize iki şey arasında seçim yapma şansı verildiğinde, günah olmayan daha kolay olanı seçmiştir.", id: "Al-Muwatta 2627 — Aisyah: Nabi tidak pernah diberi pilihan antara dua hal kecuali beliau memilih yang lebih mudah di antara keduanya, selama itu tidak berdosa." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أنها قالت: ما خُيّر رسول الله في أمرين قط إلا أخذ أيسرهما ما لم يكن إثما، فإن كان إثما كان أبعد الناس منه. وما انتقم رسول الله لنفسه، إلا أن تُنتهك حرمة الله فينتقم لله بها. {cite:muwatta-maruf-1997 p.486}"
  tr: "Malik, İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Aişe'den rivayetle şöyle buyurduğunu aktarır: \"Allah'ın Resulü'ne iki şey arasında seçim yapma şansı verildiğinde, günah olmayan daha kolay olanı seçmiştir. Eğer günah ise, ondan en uzak olan kişi olmuştur. Ve Allah'ın Resulü asla kendi intikamını almamıştır, ancak Allah'ın kutsallığı ihlal edildiğinde, o zaman Allah için intikam alırdı.\" {cite:muwatta-maruf-1997 s.486}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Aisyah, bahwa ia berkata: \"Rasulullah SAW tidak pernah dihadapkan pada pilihan antara dua hal kecuali beliau memilih yang lebih mudah di antara keduanya, selama itu bukan dosa. Jika itu dosa, beliau adalah orang yang paling jauh darinya. Dan Rasulullah SAW tidak pernah membalas dendam untuk dirinya sendiri, kecuali jika kesucian Allah dilanggar, dalam hal itu beliau akan membalas dendam untuk Allah.\" {cite:muwatta-maruf-1997 p.486}"
