label: { ar: "صحيح البخاري 3107 — أثر من الآثار المحفوظة", en: "Sahih al-Bukhari 3107 — a relic kept after its owner", ur: "صحیح بخاری 3107 — محفوظ آثار و تبرکات", es: "Sahih al-Bukhari 3107 — una reliquia conservada después de su dueño.", fr: "Sahih al-Bukhari 3107 — une relique conservée après son propriétaire" }
text: "حَدَّثَنِي عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ الأَسَدِيُّ، حَدَّثَنَا عِيسَى بْنُ طَهْمَانَ، قَالَ أَخْرَجَ إِلَيْنَا أَنَسٌ نَعْلَيْنِ جَرْدَاوَيْنِ لَهُمَا قِبَالاَنِ، فَحَدَّثَنِي ثَابِتٌ الْبُنَانِيُّ بَعْدُ عَنْ أَنَسٍ أَنَّهُمَا نَعْلاَ النَّبِيِّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3107، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3107 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3107، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3107 (Una quinta parte del botín para la causa de Alá (Khumus)), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 3107 (Le cinquième du butin pour la cause d'Allah (Khumus)), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
