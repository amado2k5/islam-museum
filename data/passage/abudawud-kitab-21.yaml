summary:
  ar: "القسم 21 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجنائز»، ويضم فيها النصوص من 3089 إلى 3241 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 21 of Sunan Abi Dawud (Funerals (Kitab Al-Jana'iz)) in the division of the open hadith dataset the museum took its reports from: reports 3089 to 3241 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 21، عنوان «کتاب الجنائز»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3089 تا 3241۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 21 de Sunan Abi Dawud (Funerales (Kitab Al-Jana'iz)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3089 al 3241, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan Abi Dawud (Les Funérailles), livre 21, qui correspond aux hadiths 3089 à 3241 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 21. bölümü \"Cenaze Kitabı\" başlığını taşımakta olup, 3089'dan 3241'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 21 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pemakaman\" dan berisi teks 3089 hingga 3241, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
