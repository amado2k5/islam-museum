label: { ar: "البخاري 190 — خاتم النبوة بين الكتفين", en: "Bukhari 190 — the seal of prophethood" }
text: "ذهبت بي خالتي إلى النبي فقالت: يا رسول الله إن ابن أختي وجع، فمسح رأسي ودعا لي بالبركة، ثم توضأ فشربت من وضوئه، ثم قمت خلف ظهره فنظرت إلى خاتم النبوة بين كتفيه مثل زر الحجلة"
summary:
  ar: "في كتاب الوضوء باب فضل الوضوء؛ خبر السائب بن يزيد يجمع مشهدين: تعوّض الصحابة على وضوء النبي، ورؤيته الغلامية لخاتم النبوة — شامة بين كتفيه كزر الحجلة. أصرح نص في الصحيح لوصف العلامة الجسدية للنبوة."
