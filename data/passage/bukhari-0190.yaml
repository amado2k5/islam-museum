label: { ar: "البخاري 190 — خاتم النبوة بين الكتفين", en: "Bukhari 190 — the seal of prophethood", es: "Bujari 190 — el sello de la profecía", fr: "Bukhari 190 — le sceau de la prophétie", ur: "بخاری 190 - مہر نبوت", tr: "Buhari 190 — Peygamberliğin Mührü omuzlar arasındadır.", id: "Al-Bukhari 190 — Penutup Kenabian di antara kedua bahu" }
text: "ذهبت بي خالتي إلى النبي فقالت: يا رسول الله إن ابن أختي وجع، فمسح رأسي ودعا لي بالبركة، ثم توضأ فشربت من وضوئه، ثم قمت خلف ظهره فنظرت إلى خاتم النبوة بين كتفيه مثل زر الحجلة"
summary:
  ar: "في كتاب الوضوء باب فضل الوضوء؛ خبر السائب بن يزيد يجمع مشهدين: تعوّض الصحابة على وضوء النبي، ورؤيته الغلامية لخاتم النبوة — شامة بين كتفيه كزر الحجلة. أصرح نص في الصحيح لوصف العلامة الجسدية للنبوة."
  tr: "Sahih el-Buhari'nin Abdest Kitabı'ndaki abdestin faziletleri bölümünde, Sa'ib ibn Yazid'in rivayeti iki sahneyi birleştirir: Sahabelerin Peygamber'in abdestinden duydukları memnuniyet ve genç bir çocukken Peygamberliğin Mührü'nü gördüğü rüya—omuzlarının arasında bir düğme gibi bir ben. Bu, Sahih el-Buhari'de peygamberliğin fiziksel işaretini anlatan en açık metindir."
  id: "Dalam bab tentang keutamaan wudhu dalam Kitab Wudhu, riwayat Sa'ib ibn Yazid menggabungkan dua adegan: kepuasan para Sahabat terhadap wudhu Nabi, dan penglihatan anak mudanya tentang Penutup Kenabian—sebuah tahi lalat di antara bahunya seperti kancing perpisahan. Ini adalah teks paling jelas dalam Sahih al-Bukhari yang menggambarkan tanda fisik kenabian."
