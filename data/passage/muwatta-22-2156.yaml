label: { ar: "الموطأ 2156 — يحيى عن مالك: الأمر عندنا في المنبوذ أنه حر، وأن ولاءه للمسلمين، يرثونه ويعقلون عنه", en: "Muwatta 2156", es: "Muwatta 2156", fr: "Muwatta 2156", ur: "موطا 2156", tr: "El-Muvatta 2156 — Yahya, Malik'ten rivayetle: Reddedilen çocuk hakkındaki hükmümüz şudur ki, o özgürdür ve bağlılığı Müslümanlara aittir; Müslümanlar ondan miras alırlar ve onun adına kan parası öderler.", id: "Al-Muwatta 2156 — Yahya berdasarkan riwayat Malik: Hukum di pihak kami mengenai anak yang ditolak adalah bahwa ia bebas, dan kesetiaannya adalah kepada kaum Muslimin, yang mewarisi hartanya dan membayar ganti rugi atas namanya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في المنبوذ أنه حر، وأن ولاءه للمسلمين، هم يرثونه ويعقلون عنه. {cite:muwatta-maruf-1997 p.282} {cite:muwatta-maruf-1997 p.283}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Reddedilen kişi hakkındaki görüşümüz şudur: O özgürdür ve bağlılığı Müslümanlaradır; ondan miras alırlar ve kan parasından sorumludurlar. {cite:muwatta-maruf-1997 s.282} {cite:muwatta-maruf-1997 s.283}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Posisi kami mengenai orang yang ditolak adalah bahwa dia bebas, dan kesetiaannya kepada kaum Muslimin; mereka mewarisi hartanya dan bertanggung jawab atas uang darahnya. {cite:muwatta-maruf-1997 p.282} {cite:muwatta-maruf-1997 p.283}"
