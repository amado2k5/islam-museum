text: "… ويقطع الإسهال، ويمنع القيء، ويلطف الفضول. ويُطفىء حرارة الكبد ويُقوي الأعضاء، نافع من الخفقان الصفراوي، والآلام العارضة للقلب، وفم المعدة، ويُقوي المعدة، ويدفع الفضول عنها، ويُطفىء المِرَّة الصفراء والدم. وإذا استُخرج ماؤه بشحمه، وطُبِخَ بيسير من العسل حتى يصير كالمرهم …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 708، يذكر أسماء الأمراض، وأعضاء البدن، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 708, that mentions named diseases, the organs of the body, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 708 کا اقتباس جس میں بیماریوں کے نام، اعضائے بدن، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
