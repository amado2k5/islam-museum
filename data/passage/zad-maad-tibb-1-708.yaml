text: "… ويقطع الإسهال، ويمنع القيء، ويلطف الفضول. ويُطفىء حرارة الكبد ويُقوي الأعضاء، نافع من الخفقان الصفراوي، والآلام العارضة للقلب، وفم المعدة، ويُقوي المعدة، ويدفع الفضول عنها، ويُطفىء المِرَّة الصفراء والدم. وإذا استُخرج ماؤه بشحمه، وطُبِخَ بيسير من العسل حتى يصير كالمرهم …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 708، يذكر أسماء الأمراض، وأعضاء البدن، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 708, that mentions named diseases, the organs of the body, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 708 کا اقتباس جس میں بیماریوں کے نام، اعضائے بدن، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 708, que menciona enfermedades específicas, los órganos del cuerpo, medicamentos y farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 708, qui mentionne des maladies nommées, les organes du corps, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 708. sayfasından, hastalıkların, vücut parçalarının, ilaçların ve eczanelerin isimlerini içeren bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, halaman 708, yang menyebutkan nama-nama penyakit, bagian tubuh, obat-obatan, dan farmasi; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
