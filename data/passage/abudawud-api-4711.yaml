label: { ar: "سنن أبي داود 4711 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 4711 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 4711 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 4711 — Menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 4711 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ سُئِلَ عَنْ أَوْلاَدِ الْمُشْرِكِينَ فَقَالَ \" اللَّهُ أَعْلَمُ بِمَا كَانُوا عَامِلِينَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4711، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4711 (Model Behavior of the Prophet (Kitab Al-Sunnah)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 4711، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 4711 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 4711 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
