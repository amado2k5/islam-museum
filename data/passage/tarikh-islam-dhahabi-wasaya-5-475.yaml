text: "… متّكئاً، وأحمد في المسند، وابن سعد في الطبقات حديث أسماء أخرجه البخاري من طريق الأعمش، عن ابراهيم، عن الأسود، عن عائشة، في الجهاد والسير باب ما قيل في درع النبيّ والقميص في الحرب، وفي المغازي باب وفاة النبيّ، والترمذي في …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 475، يذكر ساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 5, p. 475, that mentions a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 5، ص 475 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 5, pág. 475, que menciona un lecho de muerte y las últimas horas, una reliquia conservada tras su dueño; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 5, page 475, mentionnant un lit de mort et les dernières heures de son propriétaire, ainsi qu'une relique conservée après sa mort; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "El-Dhahabi'nin *İslam Tarihi* adlı eserinin 5. cildinin 475. sayfasından alınan bu alıntı, ölüm anını ve vefatın etkilerini ele almaktadır ve korunmuş kutsal emanetlerden biridir; makineyle okunabilir fotoğrafik kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 5, halaman 475, menyebutkan saat kematian dan akibat dari meninggalnya seseorang, dan merupakan salah satu peninggalan yang terpelihara; diambil dari salinan foto yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, peninggalan, dan makam suci."
