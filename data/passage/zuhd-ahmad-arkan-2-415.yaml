text: "… حدَّثنا محمَّد بن الحسين، قال: حدَّثنا عبد الأعلى بن القاسم، قال: حدَّثني سَوَّار بن عبد اللّٰه العنبري، عن كُلَيب بن وائل، عن ابنِ عمرَ مرفوعًا. وقال: سَوَّار؛ قال سفيان - يعني: الثوري-: ليس بشيءٍ. وقد رُوي في الإيمان بالقدر أحاديث …"
