label: { ar: "الموطأ 1858 — يحيى عن مالك عن يزيد بن عبد الله بن قسيط: رأى سعيد بن المسيب يراطل الذهب بالذهب، يفرغ ذهبه في كفة الميزان، ويفرغ صاحبه ذهبه في الكفة الأخرى، فإذا اعتدل لسان الميزان أخذ وأعطى", en: "Muwatta 1858", es: "Muwatta 1858", fr: "Muwatta 1858", ur: "موطا 1858", tr: "El-Muvatta 1858 — Yahya, Malik'ten, o da Yazid ibn Abdullah ibn Kusayt'tan rivayetle: Said ibn el-Musayyab, altının altına karşı tartıldığını, kendi altının terazinin bir kefesine, arkadaşının altının da diğer kefesine konulduğunu gördü. Terazi dengelendiğinde, aldı ve verdi.", id: "Al-Muwatta 1858 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Yazid ibn Abdullah ibn Qusayt: Saeed ibn al-Musayyab melihat emas ditimbang dengan emas lain, emasnya dituangkan ke salah satu wadah timbangan, dan temannya menuangkan emasnya ke wadah yang lain. Ketika timbangan seimbang, dia mengambil dan memberikannya." }
summary:
  ar: "يروي يحيى عن مالك عن يزيد بن عبد الله بن قسيط أنه رأى سعيد بن المسيب يراطل الذهب بالذهب، فيفرغ ذهبه في كفة الميزان، ويفرغ صاحبه الذي يراطله ذهبه في كفة الميزان الأخرى، فإذا اعتدل لسان الميزان أخذ وأعطى. {cite:muwatta-maruf-1997 p.164}"
  tr: "Yahya, Malik'ten, o da Yazid ibn Abdullah ibn Qusayt'tan rivayet ettiğine göre, Sa'id ibn al-Musayyab'ın altın karşılığında altın tarttığını görmüştür. Kendisi altınını terazinin bir kefesine, yanında tarttığı arkadaşı da altınını diğer kefesine koyardı. Terazi dengelendiğinde, alıp verirdi. {cite:muwatta-maruf-1997 s.164}"
  id: "Yahya meriwayatkan dari Malik, dari Yazid ibn Abdullah ibn Qusayt, bahwa ia melihat Sa'id ibn al-Musayyab menimbang emas dengan emas. Ia akan menuangkan emasnya ke salah satu wadah timbangan, dan temannya, yang bersamanya menimbang, akan menuangkan emasnya ke wadah yang lain. Ketika timbangan seimbang, ia akan mengambil dan memberikannya. {cite:muwatta-maruf-1997 p.164}"
