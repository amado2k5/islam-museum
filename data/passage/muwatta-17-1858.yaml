label: { ar: "الموطأ 1858 — يحيى عن مالك عن يزيد بن عبد الله بن قسيط: رأى سعيد بن المسيب يراطل الذهب بالذهب، يفرغ ذهبه في كفة الميزان، ويفرغ صاحبه ذهبه في الكفة الأخرى، فإذا اعتدل لسان الميزان أخذ وأعطى", en: "Muwatta 1858" }
summary:
