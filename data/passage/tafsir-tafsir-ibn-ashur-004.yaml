text: "من قبل وأضلوا كثيرا وضلوا عن سواء السبيل الخطاب لعموم أهل الكتاب من اليهود والنصارى، وتتقدم تنمسير نظيره في آخر سورة النساء . والغلو مصدر غلا في الأمر : إذا جاوز حده المعروف . فالغلو الزيادة في عمل على المتعارف"
