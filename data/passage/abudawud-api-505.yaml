label: { ar: "سنن أبي داود 505 — الأب والأبوة", en: "Sunan Abi Dawud 505 — the father and fatherhood", ur: "سنن ابی داؤد 505 — باپ اور والدیت", es: "Sunan Abi Dawud 505 — El padre y la paternidad" }
text: "… أَبُو دَاوُدَ وَفِي حَدِيثِ مَالِكِ بْنِ دِينَارٍ قَالَ سَأَلْتُ ابْنَ أَبِي مَحْذُورَةَ قُلْتُ حَدِّثْنِي عَنْ أَذَانِ أَبِيكَ عَنْ رَسُولِ اللَّهِ فَذَكَرَ فَقَالَ \" اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ \". قَطُّ وَكَذَلِكَ حَدِيثُ جَعْفَرِ بْنِ سُلَيْمَانَ عَنِ ابْنِ أَبِي مَحْذُورَةَ عَنْ عَمِّهِ عَنْ جَدِّهِ إِلاَّ أَنَّهُ قَالَ \" ثُمَّ تَرَجَّعْ فَتَرَفَّعْ صَوْتَكَ اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 505، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 505 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 505، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 505 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
