text: "وإذا طلقتم النساء فبلغن أجلهن فأمسكوهن بمعروف [231] الآية أخرج ابن جرير من طريق العوفي عن ابن عباس قال كان الرجل يطلق امرأته ثم يراجعها قبل انقضاء عدتها ثم يطلقها يفعل ذلك يضارها ويعضلها فأنزل الله هذه الآية وأخرج عن السدي قال نزلت في رجل"
