label: { ar: "الموطأ 2118 — مالك: فسنة الطلاق والعتاق عندنا في الشاهد الواحد واحدة، إنما يكون اليمين على زوج المرأة وعلى سيد العبد، والعتاقة حد من الحدود، لا تجوز فيها شهادة النساء", en: "Muwatta 2118" }
summary:
  ar: "قال مالك: فسنة الطلاق والعتاق عندنا في الشاهد الواحد واحدة، إنما يكون اليمين على زوج المرأة، وعلى سيد العبد. وإنما العتاقة حد من الحدود، لا تجوز فيها شهادة النساء؛ لأنه إذا عتق العبد ثبتت حرمته، ووقعت له الحدود، ووقعت عليه، وإن زنى وقد أحصن رجم، وإن قتل العبد قتل به، وثبت له الميراث بينه وبين من يوارثه. {cite:muwatta-maruf-1997 p.265}"
