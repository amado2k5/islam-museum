label: { ar: "الموطأ 2118 — مالك: فسنة الطلاق والعتاق عندنا في الشاهد الواحد واحدة، إنما يكون اليمين على زوج المرأة وعلى سيد العبد، والعتاقة حد من الحدود، لا تجوز فيها شهادة النساء", en: "Muwatta 2118", es: "Muwatta 2118", fr: "Muwatta 2118", ur: "موطا 2118", tr: "El-Muvatta 2118 — Malik: Boşanma ve köle azat etme konusunda sünnet, tek şahitle bizim için aynıdır. Yemin sadece kadının kocası ve kölenin efendisinden istenir. Köle azat etme ise farz bir cezadır ve bu konuda kadınların şahitliği caiz değildir.", id: "Al-Muwatta 2118 — Malik: Sunnah mengenai perceraian dan pembebasan budak sama bagi kita dengan satu saksi. Sumpah hanya diwajibkan dari suami wanita dan tuan budak. Pembebasan budak adalah hukuman yang telah ditetapkan, dan kesaksian wanita tidak diperbolehkan dalam hal ini." }
summary:
  ar: "قال مالك: فسنة الطلاق والعتاق عندنا في الشاهد الواحد واحدة، إنما يكون اليمين على زوج المرأة، وعلى سيد العبد. وإنما العتاقة حد من الحدود، لا تجوز فيها شهادة النساء؛ لأنه إذا عتق العبد ثبتت حرمته، ووقعت له الحدود، ووقعت عليه، وإن زنى وقد أحصن رجم، وإن قتل العبد قتل به، وثبت له الميراث بينه وبين من يوارثه. {cite:muwatta-maruf-1997 p.265}"
  tr: "Malik şöyle dedi: Bizim düşünce ekolümüzde boşanma ve köle azatına ilişkin hükümler tek şahitle aynıdır. Yemin sadece kadının kocası ve kölenin efendisinden istenir. Köle azatı, önceden belirlenmiş bir cezadır ve bu gibi durumlarda kadınların tanıklığı kabul edilemez. Çünkü bir köle azat edildiğinde, kutsallığı tesis edilir ve önceden belirlenmiş cezalar hem ona hem de ona karşı uygulanır. Evlendikten sonra zina ederse taşlanır. Köle öldürürse, misilleme olarak idam edilir. Ayrıca mirasçılarından da miras alır. {cite:muwatta-maruf-1997 s.265}"
  id: "Malik berkata: Hukum mengenai perceraian dan pembebasan budak dalam mazhab kami sama dengan hanya satu saksi. Sumpah hanya diperlukan dari suami perempuan dan tuan budak. Pembebasan budak adalah hukuman yang telah ditetapkan, dan kesaksian perempuan tidak dapat diterima dalam kasus seperti itu. Ini karena ketika seorang budak dibebaskan, kesuciannya ditegakkan, dan hukuman yang telah ditetapkan berlaku baginya dan terhadapnya. Jika ia berzina setelah menikah, ia dirajam. Jika budak membunuh, ia dieksekusi sebagai pembalasan. Ia juga mewarisi dari ahli warisnya. {cite:muwatta-maruf-1997 p.265}"
