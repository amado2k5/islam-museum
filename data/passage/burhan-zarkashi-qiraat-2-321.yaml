text: "… الرحمن الرحيم يعنى لا يجعل له سنّات، قال : وكان ابن سيرين يكره ذلك كراهة شديدة. ويستحب تجريد المصحف عما سواه، وكرهوا الأعشار والأخماس معه، وأسماء السور وعدد الآيات، وكانوا يقولون: جردوا المصحف. وقال الحليمى : يجوز ؛ لأن النقط …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 321، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 321, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 321 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen 2, pág. 321, que menciona la colección del Corán y los códices, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du livre d'al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an (tome 2, p. 321), mentionnant la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
