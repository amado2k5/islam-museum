text: |-
  قوله الاعشى) قال ابن برى
  الصواب أنه للسدلا كمازع
  الموهرى والر كاء بالفتح موضع
  ومعنى دعدع ملا يصف ماءين
  التقيامن السيل ثلا آسرّة الركاء
  كما ملا ساقى الاعاجم قدج الغرب
  خراوأمابيت الاعشى الذى وفع
  فه الغرب بعنى الفضة فهو*
  اذا انكب زهريين السقاة تراموابه
  غربا أونضارا اه متضى عن
  لسان العرب
  .
  بضم الغيز زيادة من الناسخ وفيه
  تفارلات ضم الأول فى أربعة ألفاظ
  فقط كالى وسكارى وعجالى
  وغبارى على ماصرّح به فى
  الشافية فالتميل بسكارى مبنى
  على الفتح وان كان فيسه وجهان
  اه وانقولى اكن المجد قال
  غضابى بالفتح ويضم أوّله قال
  جرتضى وهوالا كثر مثل سكرى
  وسكارى وذكر الشعر الذى هنا
  ٢ أ ى وضم الأولين كمزقسة
  أوقه-ما كجربة وعلى الأوّل
  اقتصر الوانى وجمع ينهما
  القاموس على مافى مرتضى
  خلا فالنيخه حيث جعل الثانية
  كهمزة
  ٣ ا ترضه الجمد بأن الصواب
  غضما قال مرتضى كأنها شبهت
  فى كثرتها بمتيت الغضى اه
  رأت الخطام لم يهنثهاشئ وغوارب الماء أعالى موجه شبهت بغوارب الابل والغرب بالتحريك
  الفضة ويقال جام من فضة قال الإعشى
  فدعد عاسرّة الركاءكما • دعدع ساقى الاعاجم الغريا
  والغرب أيضا الهر والغرب فى الشاة كالسعف فى الناقة وهوداء ينعط منه خرطومها ويسقط
  منه شعر عينيها وقد غربت الشاة بالكسر والغرب أيضا الماء الذى يقطر من الدلاء بين
  البئر والحوض وتتغير ريحه سريعا قال ذوالرمة
  وأدرك المتيق من عيلته * ومن عمائلها واستنشئ الغرب
  والغرب أيضاضرب من الشجر وهو اسفيد اربا لفارسية وأصابه سهم غرب يضاف ولا يضاف
  يسكر ويحرّك اذا كان لا يدرى من رماه صب لغصب أخذالشئ ظلماتة ول غصبه
  منه وغصبه عليه بعنى والاغتصاب مثل والذئ غصب ومغصوب (غضب غضب عليه
  غضبا ومغضبة وأغضبته أنا فتغضب ورجل غضبان وامرأة غضى ولغة فى بنى أسد غضيانة
  وملا نة وأشباههما ونوم غضبى وغضابى ١ ثل سكرى وسكارى وقال الشاعر
  فان كنت لم أذكرك والقوم بعضهم * غضاب على بعض خالى وذائم
  الاصعى رجل غضبة بتشديد البا٢) ٠) أى يغضب سريعا وغضى أيضا اسم مائة من الابل
  ٣ هى معرفة لا تنوّن ولا تدخلها الالف واللام وأنشدابن الاعراني
  ومستخلف من بعد غضي صريمة ) فأحريد للطول فقروأويا
  قال أراد المون فوقف الاموى غضبت افلان ادا كان حيا وغذبت به اذا كان ميسًا
  والاس رمثله قال دريدين الصمة ي ثى اخاه عبد اللّٰه فاضطر وقال بمعبد اه حتضى
  فان تعقب ألايام والدهر تعلوا * بن قارب أناغضاب بعبد
  وغاضبه راغمه وقوله نعالى وذا النون اذذهب مغاضبا أى مراغمالقومه وامرأة غضوب
  أى عبوس ابن السكيت الغفب الاحر الشديد الحرة ويقال أحرغضب ( لب غلبه
  غلباوغلبة وغلبا أبضا قال اللّٰه تعالى وهم من بعد غلبه-م سيغلبون وهومن مصادر
  المفتوح المين مثل الطلب قال الفرّاء هذا يحتقمل أن يكون غلية فحذفت الها عمد
  الاضافة كاقال الشاءر
  انّ الخليط أجدّوا البين فانجردوا • وأخلفوكعد الامر الذى وعدوا
  أرادعدة الامر فخذف الهاء عند الاضافة وغاليه مغالبة وغلايا وغلاب مشل قطام اسم
  امرأة وتغلب على بلد كذا استولى عليه قهرا وغلبته أنا عله تغليبا والغلاب السكثير العلبة
  والمغلب المغلوب مرارا والمغلب أيضامن الشعراء المحسكوم له بالغلبة على قرنه كأنّه غلب
  عليه وهو من الاضداد وتغلب أبو قييلة وهوتغلب بن وائل بن قاسط بن هنب بن أفصى
  ابن دعىّ بن جديلة بن أسدين ربيعة بن نزارين معدين عدنان وقولهسم تغلب بنت وائل
  انمايد هبون بالتأنيث الى القبيلة كما قالو اتميم بنت مرّقال الوليد بن عقبة وكان ولى
  صدقات بى تغلب • اذا ماشددت الرأس من بمشوذ • فغيك عنى تغلب ابنة واقل *
  وقال الفرزدق
  لولافوارس نغلب ابنة وائل * ورد العدوّعليك كل مكان
  وكات
