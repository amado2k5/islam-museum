label: { ar: "الموطأ 1926 — مالك: من أسلف في سلعة إلى أجل، فلا يبيع المشتري ما ابتاعه من البائع بأكثر من الثمن الذي سلفه فيه قبل أن يقبض ما سلفه، فيكون ذلك ربا، فيرد إليه ما سلفه ويزيده من عنده", en: "Muwatta 1926", es: "Muwatta 1926", fr: "Muwatta 1926", ur: "موطا 1926", tr: "El-Muvatta 1926 — Malik: Bir kimse bir malı kredili olarak alırsa, alıcı, borç verdiği parayı geri almadan önce, aldığı malı borç verdiği fiyattan daha yüksek bir fiyata satmamalıdır. Bu faiz olur, bu yüzden borç verdiği parayı geri ödemeli ve kendi parasından da ekleme yapmalıdır.", id: "Al-Muwatta 1926 — Malik: Jika seseorang meminjamkan uang untuk suatu barang secara kredit, pembeli tidak boleh menjual barang yang dibelinya dari penjual dengan harga lebih tinggi dari harga yang dipinjamkannya sebelum menerima kembali uang yang dipinjamkan. Ini akan menjadi riba, jadi dia harus mengembalikan uang yang dipinjamkan dan menambahkannya dari dana miliknya sendiri." }
summary:
  ar: "قال مالك: من سلف في سلعة إلى أجل، فلا يبيع المشتري تلك السلعة من صاحبها بأكثر مما سلفه فيها، قبل أن يقبض ما سلفه فيه، فصار أن رد إليه ما سلفه، وزاده من عنده. {cite:muwatta-maruf-1997 p.188} {cite:muwatta-maruf-1997 p.189}"
  tr: "Malik şöyle demiştir: Eğer birisi bir malı kredili olarak satın alırsa, alıcı o malı sahibine, borç verdiği miktardan daha yüksek bir fiyata geri satmamalıdır. Bunun yerine, borç verdiği miktarı geri ödemeli ve kendi fonlarından da ekleme yapmalıdır. {cite:muwatta-maruf-1997 s.188} {cite:muwatta-maruf-1997 s.189}"
  id: "Malik berkata: Jika seseorang meminjamkan uang untuk suatu barang secara kredit, pembeli tidak boleh menjual kembali barang tersebut kepada pemiliknya dengan harga lebih tinggi dari jumlah yang dipinjamkan sebelum menerima kembali uang yang dipinjamkan. Sebaliknya, ia harus mengembalikan uang yang dipinjamkan dan menambahkannya dengan dana miliknya sendiri. {cite:muwatta-maruf-1997 p.188} {cite:muwatta-maruf-1997 p.189}"
