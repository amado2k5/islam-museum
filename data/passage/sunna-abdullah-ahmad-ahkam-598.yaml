text: "… ما عندنا شيءٌ إلَّا كتاب اللّٰه عَوَنَ، وهذه الصَّحيفةُ عن النبي في المدينةُ حرمٌ ما بين عَيرِ إلى ثَورٍ، من قال الآجري رَخَمّالهُ في الشريعة : صَرفًا ولا عَدلًا : لا فريضةً، ولا تطوعًا. قلت: وفيه دليل على صحة قول …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 598، يرد فيه ذكر الفريضة والفرائض، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 598, whose wording mentions the obligation (farida), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 598 کا اقتباس جس میں فریضہ اور فرائض، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 598, dont le texte mentionne l'obligation (farida), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 598, cuyo texto menciona la obligación (farida), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, farz, görev ve gönüllülük esaslarını ele alan 598. sayfadan bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 598, yang menyebutkan amalan wajib, kewajiban, dan amalan sunnah; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
