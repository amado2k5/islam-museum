text: "… أنُفٌ، فقال : إذا لقيتَ أولئك، فأخبرهم أنّي بريءٌ منهم، وأنّهم بُرآءُ منّي، والذي يحلفُ به عبدُ اللّٰه بنُ عمرَ، لو أنّ لأحدهم مثلَ أُحُدٍ ذهباً، فأنفقه، ما قَبِلَ اللهُ منه حتى يُؤمِنَ بالقدرِ، ثم قال : حدَّثني أبي عمرُ …"
