text: "… ذلك يا أبا فلان، فقال أبو سعيد: أما هذا فقد قضى ما عليه ثم قال قال رسول اللّٰه تالي من رأى منكم منكرًا فلينكره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان. أخرجه مسلم في الصحيح …"
