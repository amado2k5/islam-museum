text: "- قالوا : ولا احتضر عبد المطلب، جمع بنيه فأوصاهم برسول اللّٰه. وكان الزبير بن عبد المطلب وأبو طالب أخوى عبد اللّٰه لأمه وأبيه. وكان الزبير أسنّهما. فاقترع الزبير وأبو طالب أيهما يكفل رسول اللّٰه، فأصابت القرعة أبا طالب، فأخذه …"
summary:
