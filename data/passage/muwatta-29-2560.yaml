label: { ar: "الموطأ 2560 — مالك: تأويل آية البقرة في الحر بالحر والعبد بالعبد والأنثى بالأنثى", en: "Muwatta 2560" }
summary:
  ar: "قال يحيى: قال مالك: أحسن ما سمعت في تأويل آية البقرة في الحر بالحر والعبد بالعبد والأنثى بالأنثى: أن القصاص يكون بين الإناث كما يكون بين الذكور، والحرة تُقتل بالحرة كما يُقتل الحر بالحر، والأمة تُقتل بالأمة كما يُقتل العبد بالعبد، والقصاص يكون بين الرجال والنساء أيضا، وذلك أن الله استدل في آية المائدة بأن النفس بالنفس، فنفس المرأة الحرة بنفس الرجل الحر، وجرحها بجرحه. {cite:muwatta-maruf-1997 p.445} {cite:muwatta-maruf-1997 p.446}"
