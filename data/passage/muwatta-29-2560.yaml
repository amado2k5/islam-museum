label: { ar: "الموطأ 2560 — مالك: تأويل آية البقرة في الحر بالحر والعبد بالعبد والأنثى بالأنثى", en: "Muwatta 2560", es: "Muwatta 2560", fr: "Muwatta 2560", ur: "موطا 2560", tr: "El-Muvatta 2560 — Malik: Bakara Suresi'ndeki şu ayetin tefsiri: Hükmet hünmetle, köle köleyle, kadın kadınla.", id: "Al-Muwatta 2560 — Malik: Tafsir ayat dalam Surah Al-Baqarah: Orang merdeka untuk orang merdeka, budak untuk budak, dan perempuan untuk perempuan" }
summary:
  ar: "قال يحيى: قال مالك: أحسن ما سمعت في تأويل آية البقرة في الحر بالحر والعبد بالعبد والأنثى بالأنثى: أن القصاص يكون بين الإناث كما يكون بين الذكور، والحرة تُقتل بالحرة كما يُقتل الحر بالحر، والأمة تُقتل بالأمة كما يُقتل العبد بالعبد، والقصاص يكون بين الرجال والنساء أيضا، وذلك أن الله استدل في آية المائدة بأن النفس بالنفس، فنفس المرأة الحرة بنفس الرجل الحر، وجرحها بجرحه. {cite:muwatta-maruf-1997 p.445} {cite:muwatta-maruf-1997 p.446}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Bakara Suresi'ndeki hür erkek hür erkeğe, köle köleye, kadın kadına karşılık ver ayetinin en güzel tefsiri şudur: Misilleme, erkekler arasında olduğu gibi kadınlar arasında da geçerlidir. Hükümdar bir kadın hür bir kadın için öldürüldüğü gibi hür bir erkek de hür bir erkek için öldürülür; kadın bir köle kadın bir köle için öldürüldüğü gibi erkek bir köle de erkek bir köle için öldürülür. Misilleme, erkekler ve kadınlar arasında da geçerlidir, çünkü Allah Maide Suresi'ndeki ayette cana can ilkesini kullanmıştır; dolayısıyla hür bir kadının canı hür bir erkeğin canına eşittir ve ona yapılan zarar, ona yapılan zarara eşittir. {cite:muwatta-maruf-1997 s.445} {cite:muwatta-maruf-1997 s.446}"
  id: "Yahya berkata: Malik berkata: Penafsiran terbaik yang pernah saya dengar tentang ayat dalam Surah Al-Baqarah mengenai laki-laki merdeka untuk laki-laki merdeka, budak untuk budak, dan perempuan untuk perempuan, adalah bahwa pembalasan berlaku antara perempuan sebagaimana berlaku antara laki-laki. Seorang perempuan merdeka dibunuh untuk perempuan merdeka sebagaimana seorang laki-laki merdeka dibunuh untuk laki-laki merdeka, dan seorang budak perempuan dibunuh untuk budak perempuan sebagaimana seorang budak laki-laki dibunuh untuk budak laki-laki. Pembalasan juga berlaku antara laki-laki dan perempuan, karena Allah menggunakan prinsip nyawa ganti nyawa dalam ayat di Surah Al-Ma'idah, sehingga nyawa seorang perempuan merdeka setara dengan nyawa seorang laki-laki merdeka, dan luka yang dideritanya setara dengan luka yang dideritanya. {cite:muwatta-maruf-1997 p.445} {cite:muwatta-maruf-1997 p.446}"
