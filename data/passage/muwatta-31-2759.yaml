label: { ar: "الموطأ 2759 — عبد الله بن عمر: اليهود يقولون السام عليكم فقل عليك", en: "Muwatta 2759", es: "Muwatta 2759", fr: "Muwatta 2759", ur: "موطا 2759", tr: "El-Muvatta 2759 — Abdullah bin Umar: Yahudiler “As-Samu alaykum” (Ölüm sizin üzerinize olsun) derler, öyleyse “Alaykum” (Sizin üzerinize olsun) deyin.", id: "Al-Muwatta 2759 — Abdullah bin Umar: Orang-orang Yahudi mengucapkan “As-Samu alaykum” (Kematian menimpa kalian), maka ucapkanlah “Alaykum” (Menimpa kalian)." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار عن عبد الله بن عمر أن رسول الله قال: إن اليهود إذا سلم عليكم أحدهم، فإنما يقول: السام عليكم، فقل: عليك. {cite:muwatta-maruf-1997 p.549} {cite:muwatta-maruf-1997 p.550}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Yahudilerden biri size selam verdiğinde, 'Es-Samu aleykum' (Ölüm senin üzerine olsun) derse, siz de 'Aleykum' (Ölüm senin üzerine olsun) deyin.\" {cite:muwatta-maruf-1997 s.549} {cite:muwatta-maruf-1997 s.550}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: “Apabila seorang Yahudi memberi salam kepadamu, lalu ia berkata: ‘As-Samu alaykum’ (Semoga kematian menimpa kamu), maka ucapkanlah: ‘Alaykum’ (Semoga kematian menimpa kamu).” {cite:muwatta-maruf-1997 p.549} {cite:muwatta-maruf-1997 p.550}"
