text: "… بن الزبير وطاوس وعكرمة وغيرهم. وروى عنه مالك والثوري وابن عيينة وجماعة وأسند الحافظ عنه عن عطاء بن يسار عن أبي سعيد الخدري أن رسول اللّٰه قال : غسل الجمعة واجب على كل محتلم. أخرجه البخاري ومسلم وأبو داود والنسآئي …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 439، يرد فيه ذكر ما وجب على كل مسلم، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 3, p. 439, whose wording mentions a duty laid on every Muslim, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 3، ص 439 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de Damascus de Ibn 'Asakir, volume numérisé 3, p. 439, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de Damascus de Ibn 'Asakir, volumen digitalizado 3, p. 439, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Asakir'in Şam Tarihi, 3. cilt, 439. sayfasından bir alıntı, her Müslümanın yükümlülüklerinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Zorunlu ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar hakkında bilgi içermektedir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 3, halaman 439, menyebutkan kewajiban setiap Muslim. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini mencakup informasi tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
