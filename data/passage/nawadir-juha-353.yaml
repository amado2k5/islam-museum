text: "… لو كنت في البيت لصرتُ هريسةً بينما كان راكباً حماره يقصدُ بيته، حصلت زلزلةٌ شديدةً، فأسرعَ. ونزلَ عن الحمار، وسجد قائلاً : الحمدُ للَّه. فسأله رفاقه: لماذا سجدت؟ فقال: إن بيتي أو بكلمة أخرى كوخي الحقير، لا بُدَّ أن يكون …"
summary:
  ar: "أثناء زلزال وجحا راكب عائداً إلى بيته نزل وسجد، فلما سُئل عن السبب قال إن بيته سقط ولو كان فيه لصار هريسة تحته. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  en: "During an earthquake while riding home, Juha dismounts and prostrates; asked why, he says his house has collapsed and he would have become harissa under it. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  ur: "زلزلے کے دوران جحا گھر لوٹتے ہوئے سواری سے اترا اور سجدے میں گر گیا، وجہ پوچھی گئی تو اس نے کہا کہ اس کا گھر گر گیا ہے اور اگر وہ اس میں ہوتا تو اس کے نیچے ہریسہ بن جاتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  fr: "Pendant un tremblement de terre, alors qu'il rentre chez lui à cheval, Juha descend de sa monture et se prosterne ; interrogé sur la raison, il dit que sa maison s'est effondrée et qu'il serait devenu de la harissa en dessous. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  es: "Durante un terremoto, cuando vuelve a casa montado, Juha desmonta y se postra; al preguntarle por qué, dice que su casa se ha derrumbado y que habría quedado hecho harisa debajo. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
