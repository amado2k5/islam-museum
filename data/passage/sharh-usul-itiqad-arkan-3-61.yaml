text: "في شرح اصُولِ اعْتِقَادِ أهلِ السُّسنَّةِ والأحاديث التي جاءت فيه، والإيمان بأنَّ ذلك كائنٌ، وأنَّ عيسى ابنَ مريم ينزلُ فيقتله ب بابٍ لُدٌّ. والإيمانُ: قولٌ وعملٌ، يزيدُ وينقصُ، كما جاء في الخبر: أَكْمَلُ المؤْمِنِينَ إِيمانًا أَحْسَنُهُمْ خُلُقًا ومَنْ تركَ الصلاة …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 61، يذكر حلاوة الإيمان وكماله، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 61, that mentions the sweetness and completeness of faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 61 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 3, pág. 61, que menciona la dulzura y la plenitud de la fe, así como su aumento y disminución; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 3, p. 61), évoquant la douceur et la plénitude de la foi, ainsi que ses fluctuations. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 3. cildinin 61. sayfasından, imanın tatlılığı ve mükemmelliği ile artışı ve azalışı konusunu ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 3, halaman 61, yang membahas tentang kemanisan dan kesempurnaan iman, serta peningkatan dan penurunan iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
