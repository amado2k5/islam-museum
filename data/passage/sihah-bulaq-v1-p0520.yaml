text: |-
  .١٢٠
  اصمت اذا لقيته بمكان قة رلا أنيس به وهو غير مجرى وت) الموسسيرف وأيما قول
  رويشدين كثير الطائى
  يأيها الراكب المزجى مطيته • سائل بنى أسدماهذه الصوت
  فانم أشهلانه أرادية الضوضاء وابدلبة والاستغاثة والصائت الصائح وقد صات الشئ
  يصوت صوتا وكذلك موت تصويتاورجل صيت أى شديد الصوت وكذلك رجل صات
  وحارصات قال النظار الفقعسى
  كأننى فرق أقب سهوق * جأب اذا عشرصات الارنان
  وهذا كقواهم رجل مال كثير المال ورجسل نال كثير النوال وكبش صاف ويوم طان وبتر
  ماهة ورجل هاع لاع ورجل خاى وأصل هذه الاوصاف كاه افعل بكسر العين والصيت ١
  الذكرالهيل الذى يتنشر فى الناس دون القميح يقال ذهب صيته فى الماس وأصله من الواو
  وانما انق لبت باء لا نكسارما قبلها كما قالواريح من الروح كانه-م ينوه على فعل بكسر
  النماء للفرق بين الصوت المسموع وبين الذكر المعلوم وربماقالوا انتشرصوته فى الناس
  عنى صيته وقولهم دعى فانصات أى أجاب وأقبل وهو انفعل من الصوت والمنصات القويم
  النامة وقد ائصات الرجل اذا اسوت قامته بعد الانحناه كأنه اقتبل شبابه قال
  الشاعر
  ونصر بن دهمان الهنيدة عاشها • وتسعين عاما ثم قوّم فانصاتا
  وعاد سواد الرأس بعد بياضه • وعاودمشرخ الشباب الذى فاتا
  ⁦( صل الطاء طت)⁩ الطمت الطس بلغة طي أبدل من احدى السينين
  ناء للاستثفال فإذا جعت أوصغرت رددت السين لانك فصلت بينه-ما بألف أوياء فقلت
  طساس وطيس
  صل المين نت نه يعته عنا اذارد عليه القول مرّة بعدمرّة ويقال عنه
  بالمستلد اذا ألح عليه ومازات أعات فلاناعتانا وأصانه صتاتا وحكى أبوحاتم عمعت بالجدى
  اذادعاه وقال عت عت وتعتت فى كلامه اذا لم يستمرفيه عرت عرت الرمح يعرت عرتااذا
  اضطرب وكذلك البرق اذ المع واضطرب يقال برق عرّات ورمح عرّات للشديد الاضطراب
  لف الصوف مستديرا ليجعل فى اليدفيغزل يقال عميتة من وبرأ وصوف كما بقال سيخة
  من قطن وساملة من شعر والعميت بالتشديد الرقيب الظريف وقال ولا تعمار الفطن العمية
  ويقال الجاهل الضعيف وقال
  • كالخرس العماميت
  ( عنت عنت العنت الائم وقد عنت الرجل وقال تعالى عزيز عليه ما عنتم وقوله ذلك لن
  خشى العنت منكم يمن الفجور والزناو العنت أيضا الوقوع فى أمرشاق وقد عنت
  وأعسه غيره ويقال للعظم المجبوراذا أصابه شي فهاضه قد أعبته فهوعنت ومعنت ٣
  وجانى فلان متعنتا اذا جاء بطلب زاتك
  صاج
  ٢ ال ابن سيد مرجل عفتان
  أى بكسرتين وشذ التاء وعفتان
  بالكسرجاف قوى جاد وجممع
  الاخيرة عفتان على حدّدلاص
  وهجان لا حتجنب لانه-م قد
  قالواعفتانان فتفهمه كذافى
  اللسان وحدّدلاص هو استعمال
  اللفظ مفردا وجمعا حقيقة فيهما.
  ويثى كهذين ونحوهمامثل فلك
  وامام وأماحتجنب فهوفى
  الحالين مفرد لانه ملحق بالمصدر
  وهواذا وصف به يلتزم افراده
  وتذكيرهاه باختصارمن مر عن
  شيخه ثم قال وهو تحقيق ح-ن اه
  ٣ ا اوّل بوزن ك.ف والشائع
  إبنتح المون ككرم اه
