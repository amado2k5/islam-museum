label: { ar: "الموطأ 2355 — مالك: العتاقة في الوصية يردها الموصي متى شاء، أما التدبير فلا", en: "Muwatta 2355", es: "Muwatta 2355", fr: "Muwatta 2355", ur: "موطا 2355", tr: "Al-Muwatta 2355 — Malik: Vasiyet eden, vasiyetnamede yer alan köle azad etme kararını dilediği zaman geri alabilir, ancak şartlı köle azad etme kararı geri alınamaz.", id: "Al-Muwatta 2355 — Malik: Pewaris dapat mencabut pembebasan yang diwariskan dalam wasiat kapan pun ia mau, tetapi pembebasan bersyarat tidak dapat dicabut." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن كل عتاقة أعتقها رجل في وصية أوصى بها، في صحة أو مرض، أنه يردها متى شاء ويغيرها متى شاء، ما لم تكن تدبيرا؛ فإذا دبر فلا سبيل له إلى رد ما دبر. {cite:muwatta-maruf-1997 p.371}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur ki, bir kişi vasiyetnamesinde, ister sağlıklı ister hasta olsun, yaptığı herhangi bir azat etme işlemini, şartlı azat etme durumu hariç, dilediği zaman geri alabilir veya değiştirebilir; eğer şartlı azat etme işlemi ise, yaptığı şeyi geri alma imkanı yoktur. {cite:muwatta-maruf-1997 s.371}"
  id: "Malik berkata: Praktik yang berlaku di antara kita adalah bahwa setiap pembebasan yang dilakukan oleh seseorang dalam wasiat, baik dalam keadaan sehat maupun sakit, dapat dicabut atau diubah kapan pun ia inginkan, kecuali jika itu adalah pembebasan bersyarat; jika itu adalah pembebasan bersyarat, maka ia tidak memiliki cara untuk mencabut apa yang telah ia buat. {cite:muwatta-maruf-1997 p.371}"
