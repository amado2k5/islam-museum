summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن كل عتاقة أعتقها رجل في وصية أوصى بها، في صحة أو مرض، أنه يردها متى شاء ويغيرها متى شاء، ما لم تكن تدبيرا؛ فإذا دبر فلا سبيل له إلى رد ما دبر. {cite:muwatta-maruf-1997 p.371}"
