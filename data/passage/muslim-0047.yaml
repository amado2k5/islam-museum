label: { ar: "مسلم 47 — من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت", en: "Muslim 47 — Whoever believes in God and the Last Day, let him speak good or stay silent" }
text: "قال رسول الله: «من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه»"
summary:
  ar: "رواية أبي هريرة في كتاب الإيمان من صحيح مسلم؛ قول الخير أو الصمت وإكرام الجار والضيف شعب من الإيمان — من أشهر نصوص آداب اللسان والجوار."
