label: { ar: "الموطأ 1847 — مالك عن جده مالك بن أبي عامر: قال عثمان بن عفان إن رسول الله قال لا تبيعوا الدينار بالدينارين، ولا الدرهم بالدرهمين", en: "Muwatta 1847" }
summary:
  ar: "قال مالك: بلغه عن جده مالك بن أبي عامر أن عثمان بن عفان قال: قال لي رسول الله: لا تبيعوا الدينار بالدينارين، ولا الدرهم بالدرهمين. ويذكر المحقق أن ابن عبد البر قال إن هذا الحديث في الموطأ مرسل عند جماعة رواته، وإن بكير بن الأشج رواه مسندا عن سليمان بن يسار عن مالك بن أبي عامر عن عثمان. {cite:muwatta-maruf-1997 p.158}"
