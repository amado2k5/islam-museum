text: "قرآن نزل بلغة العرب، بل بلغة قريش، وقد علمت العادة المعروفة في خطاب الله ورسوله، فليس لأحد أن يخرج عنها. وبالجملة فنحن ليس مقصودنا هنا نصر قول من يقول: القرآن قديم، فإن هذا القول أول من عرف أنه قاله في"
