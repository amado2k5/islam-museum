text: |-
  ١٩٦
  (باب الحاء
  أقامت به حذ الربيع وبارها • أخوسلوة مسى به الليل أعلح
  يعنى الندى يقول أقامت بذلك الموضع أيام الربيع فادام القدى فهوفى سلوة من العيس
  واناقال مسى بدلانه يسقط بالليل والملاحىّ بالنم عنب أبيض فى حبه طول وهو من الملهة
  ومن تعاجيب خلق اللّٰه غاطية * يعصر منها ملاحى وغربيب
  وقد جاء فى الشعر يتشديد اللام قال أبوقيس بن الاسلت
  وقد لاح فى الصبح الثريا كمارى • كعنود ملاحية حين نوّرا
  والملحاء وسط الظهرمابين الكاهل والعجز والملحاء أيضاكتيبة كانت لآل المنذر
  وقال الشاعر
  تدوررحى الملحاء فى الامرذى البزل والملاح صاحب السفينة
  والملاحة أيضامنت الملح والملاح بالضم والتشديد من نيات الحض والملاح أيضا أعلم من
  الليح ومليح مصغرحى من خزاعة والنسبة اليهم ملحى مشال هذلى والاملاح موضع وقال
  عقامن آل ايلى السهشب فالاملاح فالغمر
  ⁦( منخ)⁩ المنح العطاءمنحه ينحه ويمحه والاسم المنحة بالكسروهى العطية والمنيحة منحة اللبن
  كالناقة أوالشاة تعطيها غيرك يحتلبها ثم يردها عليك قال أبو عبيد وللعرب أربعة أسماء
  تضعهام واضع العارية المنيحة والعرية والافقار والاخبال واستمنجه طلب منمّه أى
  استرفده والمنيح سهم من سهام الميسرعمالانصيب له الاأن يمنح صاحبه شيئا والمنوح والممائح
  من النوق مثل الجمالح وهى التى تدرّ فى الشتاء بعدماتذهب ألبان الابل وأضنحت الماقة
  دنا نتاجها فهى منج (ميح المائح الذى ينزل البترفيملا الدلو وذلك اذا قلّ ما ؤها والهع
  ماحة وفى الحديث نزلناستة ماحة وقدماح ييح وقال
  يأيها المائج دلوى دونكا ل، انى رأيت الناس يحمدونكا
  وماح فى مشيته تبحتروهو منى كشى البطة وقال العجاج مياحة تميح مشيارهوجا
  أبو عمروبقال ماح فاه بالم-واكيميح اذا استال ومحت الرجل أعطيته واستمحنه سألته العطاء
  ومحته عند السلطان شفعت له واستممته سألته أن يشفع لى عنده والامتياح مثل الميح وتمايح
  السكران والغصن تمايل
  صل النون) ( ن ح بح السكاب يتبح وينبح بالكسر نبحا ونبيحاونياحا بالضم ونباحا
  بالكسروريا فالوايح الظبى قال أبودواد وقصرى سنج الانساءنباح من الشعب
  وأبحت الكلب واستنبحته بمعنى والنبوح ضحة الحى وأصوات كلابهم قال أبوذويب
  بأطيب من مقبلها اذاما * دنا العبوق وا كتتم النبوح
  ثم وضع موضع الكثرة والعز وأنشد أبونصر للاخطل
  ان العرارة والنبوح لدارم * والعزعندتكامل الاحساب
  (نتح النتح الرشح تتحت المزادة تنتح تتحاو نتوحا وكذلك خروج العرق ومنائح العرف
  مخارجه قال الراجز . تنتح ذفراه بمثل الدرياق والنتوح صموغ الاشجار ولإيقال
  نتوع والانتياح مثل النتح قال ذوالرسة بصف بعيرايهدر فى الشقشقة
  رقشاء تنتاح اللغام المزبدا * دوم فيهارزه وأرعدا
