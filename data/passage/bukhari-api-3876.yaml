text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا بُرَيْدُ بْنُ عَبْدِ اللَّهِ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى ـ رضى الله عنه ـ بَلَغَنَا مَخْرَجُ النَّبِيِّ صلى الله عليه وسلم وَنَحْنُ بِالْيَمَنِ فَرَكِبْنَا سَفِينَةً فَأَلْقَتْنَا سَفِينَتُنَا إِلَى النَّجَاشِيِّ بِالْحَبَشَةِ، فَوَافَقْنَا جَعْفَرَ بْنَ أَبِي طَالِبٍ، فَأَقَمْنَا مَعَهُ حَتَّى قَدِمْنَا، فَوَافَقْنَا النَّبِيَّ صلى الله عليه وسلم حِينَ افْتَتَحَ خَيْبَرَ، فَقَالَ النَّبِيُّ صلى الله عليه …"
summary:
  ar: "في صحيح البخاري؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sahih al-Bukhari; mention of the chancery or the barid post."
  ur: "صحیح بخاری میں؛ دیوآن یا بریڈ کا ذکر."
