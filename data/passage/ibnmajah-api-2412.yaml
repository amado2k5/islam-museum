label: { ar: "سنن ابن ماجه 2412 — بر الوالدين أو عقوقهما", en: "Sunan Ibn Majah 2412 — dutifulness to the parents or disobedience to them", ur: "سنن ابن ماجہ 2412 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Ibn Majah 2412 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan Ibn Majah 2412 — le devoir envers les parents ou la désobéissance envers eux" }
text: "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ، حَدَّثَنَا خَالِدُ بْنُ الْحَارِثِ، حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنْ مَعْدَانَ بْنِ أَبِي طَلْحَةَ، عَنْ ثَوْبَانَ، - مَوْلَى رَسُولِ اللَّهِ - عَنْ رَسُولِ اللَّهِ أَنَّهُ قَالَ \" مَنْ فَارَقَ الرُّوحُ الْجَسَدَ وَهُوَ بَرِيءٌ مِنْ ثَلاَثٍ دَخَلَ الْجَنَّةَ مِنَ الْكِبْرِ وَالْغُلُولِ وَالدَّيْنِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2412، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2412 (The Chapters on Charity), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2412، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2412 (Los capítulos sobre la caridad), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2412 (Les chapitres sur la charité), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
