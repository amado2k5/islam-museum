text: "حَدَّثَنَا عَلِيُّ بْنُ نَصْرٍ، حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، حَدَّثَنَا الأَسْوَدُ بْنُ شَيْبَانَ، حَدَّثَنَا خَالِدُ بْنُ سُمَيْرٍ، قَالَ قَدِمَ عَلَيْنَا عَبْدُ اللَّهِ بْنُ رَبَاحٍ الأَنْصَارِيُّ مِنَ الْمَدِينَةِ وَكَانَتِ الأَنْصَارُ تُفَقِّهُهُ - فَحَدَّثَنَا قَالَ حَدَّثَنِي أَبُو قَتَادَةَ الأَنْصَارِيُّ فَارِسُ رَسُولِ اللَّهِ قَالَ بَعَثَ رَسُولُ اللَّهِ جَيْشَ الأُمَرَاءِ بِهَذِهِ الْقِصَّةِ. قَالَ فَلَمْ تُوقِظْنَا إِلاَّ الشَّمْسُ طَالِعَةً فَقُمْنَا وَهِلِينَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 438، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 438 (Prayer (Kitab Al-Salat)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 438، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 438 (Oración (Kitab Al-Salat)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
