text: "وأتقنها ما يبتنى على تعقل النفس لذاتها، وابن القيم زيف حججه في كتابه، وهو كتاب مفيد جدا، يهب للروح روحا، ويورث للصدر شرحا . واستدل الإمام م(٣) على ذلك في تفسيره بالآية المذكورة فقال: إن الروح لو كان جسما منتقلا"
