text: "… عُمان والبحرين، فوجه أخاه الحكم على البحرين. رسول اللّٰه وَ له إلى كبار الصحابة في مشركي قريش وقال المدائني : كانت الوقعة بصُهَاب على وسائر الكفار والمنافقين، فكان يفشي ذلك عنه ستَّى المسلمين، وأميرهم الحكم بن أَبي العاص، وافتتح ظهر …"
summary:
