label: { ar: "جامع الترمذي 3313 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 3313 — what was left behind: estate and inheritance", ur: "جامع ترمذی 3313 — ترکہ اور میراث", es: "Jami' al-Tirmidhi 3313 — Lo que quedó: patrimonio y herencia", fr: "Jami' al-Tirmidhi 3313 — ce qui a été laissé derrière: biens et héritage", tr: "Cami' el-Tirmizi 3313 — Miras ve vasiyet olarak geride bıraktıkları", id: "Jami' al-Tirmidhi 3313 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… فَسَمِعْتُ عَبْدَ اللَّهِ بْنَ أُبَىٍّ فَأَخْبَرْتُ عَمِّي فَانْطَلَقَ فَأَخْبَرَ رَسُولَ اللَّهِ فَأَرْسَلَ إِلَيْهِ رَسُولُ اللَّهِ فَحَلَفَ وَجَحَدَ. قَالَ فَصَدَّقَهُ رَسُولُ اللَّهِ وَكَذَّبَنِي قَالَ فَجَاءَ عَمِّي إِلَىَّ فَقَالَ مَا أَرَدْتَ إِلاَّ أَنْ مَقَتَكَ رَسُولُ اللَّهِ وَكَذَّبَكَ وَالْمُسْلِمُونَ. قَالَ فَوَقَعَ عَلَىَّ مِنَ الْهَمِّ مَا لَمْ يَقَعْ عَلَى أَحَدٍ. قَالَ فَبَيْنَمَا أَنَا أَسِيرُ مَعَ رَسُولِ اللَّهِ فِي سَفَرٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3313، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3313 (Chapters on Tafsir), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3313، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3313 (Capítulos sobre Tafsir), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3313 (Chapitres sur le Tafsir), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'de yer alan 3313 numaralı hadiste, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, eski eserler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3313, menyebutkan apa yang ditinggalkannya berupa harta warisan. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, barang antik, dan makam suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
