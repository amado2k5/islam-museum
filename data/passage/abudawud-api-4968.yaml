label: { ar: "سنن أبي داود 4968 — ما حُرّم", en: "Sunan Abi Dawud 4968 — what was made unlawful", ur: "سنن ابی داؤد 4968 — جو حرام کیا گیا", es: "Sunan Abi Dawud 4968: lo que se declaró ilegal", fr: "Sunan Abi Dawud 4968 — ce qui a été rendu illégal", tr: "Sunan Abi Davud 4968 — Yasak Olan Şeyler", id: "Sunan Abi Dawud 4968 — Apa yang dilarang" }
text: "… النُّفَيْلِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ عِمْرَانَ الْحَجَبِيُّ، عَنْ جَدَّتِهِ، صَفِيَّةَ بِنْتِ شَيْبَةَ عَنْ عَائِشَةَ،ا قَالَتْ جَاءَتِ امْرَأَةٌ إِلَى رَسُولِ اللَّهِ فَقَالَتْ يَا رَسُولَ اللَّهِ إِنِّي قَدْ وَلَدْتُ غُلاَمًا فَسَمَّيْتُهُ مُحَمَّدًا وَكَنَّيْتُهُ أَبَا الْقَاسِمِ فَذُكِرَ لِي أَنَّكَ تَكْرَهُ ذَلِكَ فَقَالَ \" مَا الَّذِي أَحَلَّ اسْمِي وَحَرَّمَ كُنْيَتِي \". أَوْ \" مَا الَّذِي حَرَّمَ كُنْيَتِي وَأَحَلَّ اسْمِي \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4968، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4968 (General Behavior (Kitab Al-Adab)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4968، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4968 (Conducta General (Kitab Al-Adab)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4968 (Guide des mœurs), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 4968 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" kitabının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4968, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
