text: "عمران بن حصين أنه قال لرجل : إنك امرؤ (٣) أحمق، أتجد الظهر في كتاب الله أربعا، لا يجهر فيها بالقراءة ؟! ثم عدد عليه الصلاة والزكاة، ونحو هذا، ثم قال: أتجد هذا في كتاب الله مفسرا ؟! إن كتاب"
