label: { ar: "صحيح مسلم 2858 — الأب والأبوة", en: "Sahih Muslim 2858 — the father and fatherhood", ur: "صحیح مسلم 2858 — باپ اور والدیت", es: "Sahih Muslim 2858 — El padre y la paternidad", fr: "Sahih Muslim 2858 — Le père et la paternité" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عَبْدَةَ الضَّبِّيُّ، حَدَّثَنَا فُضَيْلُ بْنُ سُلَيْمَانَ النُّمَيْرِيُّ، حَدَّثَنَا أَبُو حَازِمٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، عَنْ أَبِيهِ، - - أَنَّهُمْ خَرَجُوا مَعَ رَسُولِ اللَّهِ وَهُمْ مُحْرِمُونَ وَأَبُو قَتَادَةَ مُحِلٌّ. وَسَاقَ الْحَدِيثَ وَفِيهِ فَقَالَ \" هَلْ مَعَكُمْ مِنْهُ شَىْءٌ \". قَالُوا مَعَنَا رِجْلُهُ. قَالَ فَأَخَذَهَا رَسُولُ اللَّهِ فَأَكَلَهَا."
summary:
  ar: "حديث في صحيح مسلم، رقم 2858، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2858 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2858، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2858 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2858 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
