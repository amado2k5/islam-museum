label: { ar: "الموطأ 2763 — الطفيل بن أبي بن كعب: ابن عمر يسلم على كل من لقي في السوق", en: "Muwatta 2763", es: "Muwatta 2763", fr: "Muwatta 2763", ur: "موطا 2763", tr: "El-Muvatta 2763 — El-Tufayl ibn Abi ibn Ka’b: İbn Ömer çarşıda karşılaştığı herkese selam veriyor.", id: "Al-Muwatta 2763 — Al-Tufayl ibn Abi ibn Ka’b: Ibn Umar menyapa setiap orang yang ditemuinya di pasar" }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أن الطفيل بن أبي بن كعب أخبره أنه كان يأتي عبد الله بن عمر فيغدو معه إلى السوق. قال: فإذا غدونا إلى السوق لم يمر عبد الله بن عمر على سقاط ولا صاحب بيعة ولا مسكين ولا أحد إلا سلم عليه. فلما أنكر عليه الطفيل أن يغدو إلى السوق لغير بيع أو سؤال، قال له ابن عمر: إنما نغدو من أجل السلام، نسلم على من لقينا. {cite:muwatta-maruf-1997 p.551} {cite:muwatta-maruf-1997 p.552}"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan rivayetle, Tufayl ibn Abi ibn Ka'b'ın kendisine Abdullah ibn Umar'ın yanına gidip onunla birlikte çarşıya gittiğini anlattığını aktarır. Tufayl şöyle demiştir: \"Çarşıya gittiğimizde Abdullah ibn Umar her satıcıyı, esnafı, fakiri ve karşılaştığı herkesi selamlardı.\" Tufayl, İbn Umar'ın sadece alım satım amacıyla çarşıya gitmesine itiraz edince, İbn Umar şöyle cevap vermiştir: \"Biz sadece başkalarını selamlamak için gideriz; karşılaştığımız herkesi selamlarız.\" {cite:muwatta-maruf-1997 s.551} {cite:muwatta-maruf-1997 s.552}"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha bahwa Tufayl ibn Abi ibn Ka'b bercerita kepadanya bahwa ia biasa pergi menemui Abdullah ibn Umar dan menemaninya ke pasar. Ia berkata: \"Ketika kami pergi ke pasar, Abdullah ibn Umar akan menyapa setiap penjual, pemilik toko, orang miskin, dan setiap orang lain yang ditemuinya.\" Ketika Tufayl keberatan karena ia pergi ke pasar hanya untuk membeli atau menjual, Ibnu Umar menjawab: \"Kami pergi hanya untuk menyapa orang lain; kami menyapa siapa pun yang kami temui.\" {cite:muwatta-maruf-1997 p.551} {cite:muwatta-maruf-1997 p.552}"
