label: { ar: "الموطأ 2763 — الطفيل بن أبي بن كعب: ابن عمر يسلم على كل من لقي في السوق", en: "Muwatta 2763" }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أن الطفيل بن أبي بن كعب أخبره أنه كان يأتي عبد الله بن عمر فيغدو معه إلى السوق. قال: فإذا غدونا إلى السوق لم يمر عبد الله بن عمر على سقاط ولا صاحب بيعة ولا مسكين ولا أحد إلا سلم عليه. فلما أنكر عليه الطفيل أن يغدو إلى السوق لغير بيع أو سؤال، قال له ابن عمر: إنما نغدو من أجل السلام، نسلم على من لقينا. {cite:muwatta-maruf-1997 p.551} {cite:muwatta-maruf-1997 p.552}"
