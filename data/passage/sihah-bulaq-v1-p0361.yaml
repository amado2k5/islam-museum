text: |-
  ٢٨٠
  ⁦(باب الرا٠)⁩
  (أصر
  كذلك آخر لانه يؤنث ويجمع إفير من ويغير الالف واللام وبغير الاضافة تقول هررت برحسل
  آخروير جال أخروآخرين وبامرأة أخرى وينسوة أخر فااجامعدولا وهو صفة منع الصرف
  وهو مع ذلك جمع فان سميت به رجلا صرفته فى الذسكرة عند الاخفتر ولم تصرفه عند سيبويه
  وقول الاعشى
  وعلقتى أخيرى ما تلاثمنى
  الادرة نفخة فى انخصية يقال رجل آدربين الادرة رر الارّالجماع تقول منه أرتها
  يؤرتها أراورجل مثر كثير ابهاع [[⁦(زر)⁩ الازر القوقوقوله تعالى اشدد به أزرى
  أى ظهرى وموضع الازار من الحقوين وآزرت فلانا أى عاوسه والعامة تقول وازرته
  والازار معروف يذكرويؤنت والازارة مثله كم قالو اللوساد وسادة وقال الاعشى
  كتميل النشوان يرفل فى البقيروفى الازاره وجمع القلة آندة والكثيرا زرمثل
  حاروأحرة وجر وقول الشاعر
  الاأبلغ أباحفص رسولا • قدى ل من أخنقة ازارى
  قال أبوع رالجرى يريد بالازارههنا المرأة والمزر الازاروهو كقولهم ملهف ولحاف ومقرم
  وقرام ويقال أزرته تأزيرا فتأزر وأتزر إزرة حسنة وهو مثل الحلسة والركبة وتأزد النيت
  النف واشتذ قال الشاعر
  تأزرفيه النيت حق تخايلت • رباه وحتى ماترى الشامتوما
  وآزراسم أعجمى أ سر سرقتبه يأسره أسراشذه بالاساروهو القدومنه معى الاسير
  وكانوا يندونه بالقدفسمى كل أخيذ أسيراوان لم يشديه يقال أسرت الرحسل أسرا وإسلوا
  فهوأسبرومأسور والجمع أسرى وأسارى وتقول استأسر أى كن أسبر الى وهذا الشلك
  بأصره أى بقده تعنى بجميعه كما يقال برقته وأسره اللّه أى خلقه وقوله تعالى وشددنا
  أسرهم أى خلقه-م والاسر بالضم احاس البول مثل الحصر فى الغائط تقول منه آسم
  الرجل يؤسر أسرافه ومأسود وتقول هذاء ود أسر للذى يوضع على بطن المأسور الذى
  احتبس يوله ولا تقل هذا عوديسر وأسرة الرجل رهطه لانه يتقوّى بهم ⁦( شر)⁩ الاشر البطر
  وقد أشر بالكسر يأشر أشرا فهو أشر وأشران وقوم أشارى.ثل سكران وسكارى
  المعسل بضم الجيم وفتح العين
  قال الشاعر
  وخلت وعولا أشارى بها • وقد أرهف الطعن أبطالهنا
  ومنه ناقة متشير وجواد متشير يستوى فيه المذكر والمؤنت وتأشير الاسنان تحزيزها وتحديد
  ١ أ ى بضمتين اوضيم وفقح اه
  أطرافها والجعل مؤشر العضدين ويقسال بأسنانه أشر وأشر ( ١ مثال شطب المف
  وشطبه وأشور أيضاقال جيل سبتك بصقول ترف أشوره وفى المئل أعييتف بأشر
  فكيف بدردر وأشرت الخشبة بالمئشار مهموز وقال الشاعر
  لقد عيل الايتام طعنة نأشره • أناشر لازالت يمينك آشره
  دالموضع ماصروه أصروالجع ما صر والعامة تقول معاصر الاموى أصرت الشئ أصرا
  سكسرفه الاصمعى الا صرة ماعطفك على رجل من رحم أوقرابة أوصهر أ ومعووف
  وابهع الاواصر يقال ما تأصر فى على فلان آصرة أى ما تعطفو عليه قرابة ولامنة والاصر
  المهد
