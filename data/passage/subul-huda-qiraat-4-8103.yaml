text: "… : مَاتَ النَّبِىِّ ولم يَجْمَع القرآنَ غيرُ أربعةٍ : أَبُو الدَّرْدَاءِ، وَمُعَاذُ بنُ جَبَلٍ، وزيدُ بنُ ثابتٍ، وأَبُوزَيْدٍ خذوا القرآن من أربعة قال العلماء : سببه أن هؤلاء أكثر ضبطا لألفاظه، واتقن لادائه وإن كان غيرهم افقه فى معانيه منهم. …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 8103، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 8103, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 8103 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
