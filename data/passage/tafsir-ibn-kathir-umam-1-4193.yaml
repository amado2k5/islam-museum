text: "… وقد كانت حِمْيَر - وهم: سبأ - كلما مَلَكَ فيهم رجلٌ سموه تُبَّعًا، كما يقال: كِسْرىٰ لمن مَلَك الفُرْس، وقَيْصَر لمن مَلَك الروم، وفِرْعَون لمن ملك مصر كافرًا، والنَّجَاشِي لمن مَلَك الحبشة، وغير ذلك من أعلام الأجناس. ولكن اتفق أن …"
summary:
