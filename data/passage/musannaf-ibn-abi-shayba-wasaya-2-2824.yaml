  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin Resimli Cilt 2, sayfa 2824'ten bir alıntı; vasiyetname, defin, mezar ve türbeden bahsediyor; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
