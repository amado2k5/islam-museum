label: { ar: "سنن أبي داود 1317 — الأب والأبوة", en: "Sunan Abi Dawud 1317 — the father and fatherhood", ur: "سنن ابی داؤد 1317 — باپ اور والدیت", es: "Sunan Abi Dawud 1317 — El padre y la paternidad" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ مُوسَى، حَدَّثَنَا أَبُو الأَحْوَصِ، ح وَحَدَّثَنَا هَنَّادٌ، عَنْ أَبِي الأَحْوَصِ، - وَهَذَا حَدِيثُ إِبْرَاهِيمَ - عَنْ أَشْعَثَ، عَنْ أَبِيهِ، عَنْ مَسْرُوقٍ، قَالَ سَأَلْتُ عَائِشَةَ -ا - عَنْ صَلاَةِ رَسُولِ اللَّهِ فَقُلْتُ لَهَا أَىُّ حِينٍ كَانَ يُصَلِّي قَالَتْ كَانَ إِذَا سَمِعَ الصُّرَاخَ قَامَ فَصَلَّى."
summary:
  ar: "حديث في سنن أبي داود، رقم 1317، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1317 (Prayer (Kitab Al-Salat): Voluntary Prayers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1317، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1317 (Oración (Kitab Al-Salat): Oraciones voluntarias), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
