label: { ar: "الموطأ 558 — أبو هريرة: سمع النبي رجلاً يقرأ سورة الإخلاص فقال: وجبت… الجنة", en: "Muwatta 558", es: "Muwatta 558", fr: "Muwatta 558", ur: "موطا 558", tr: "El-Muvatta 558 — Ebu Hureyre: Peygamber bir adamın İhlas Suresini okuduğunu duydu ve şöyle dedi: Cennet garantidir…", id: "Al-Muwatta 558 — Abu Hurairah: Nabi mendengar seseorang membacakan Surat Al-Ikhlas dan berkata: Surga dijamin…" }
text: "وجبت"
summary:
  ar: "يرويه مالك عن عبيد الله بن عبد الرحمن عن عبيد بن حنين مولى آل زيد بن الخطاب، أنه سمع أبا هريرة يقول: أقبلت مع النبي فسمع رجلاً يقرأ سورة الإخلاص [[passage/quran-112-1|الإخلاص]]، فقال: وجبت. فسألته: ماذا يا رسول الله؟ فقال: الجنة. ويقول أبو هريرة إنه أراد أن يذهب إلى الرجل ليبشره، ثم خاف أن يفوته الغداء مع النبي فآثر الغداء، ثم ذهب إلى الرجل فوجده قد ذهب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق بن سليمان عند الترمذي (2897)، وسويد، والقعنبي عند الحاكم (1/566)، وابن القاسم عند النسائي، وينقل عن ابن عبد البر ⁦(التمهيد 19/215)⁩ أن يحيى قال «عبيد الله بن عبد الرحمن» وتابعه أكثر الرواة، وقال القعنبي ومطرف «عبد الله»، والصواب ما قاله يحيى. {cite:muwatta-maruf-1997 p.286} {cite:muwatta-maruf-1997 p.287}"
  tr: "Malik, Ubeydullah ibn Abdurrahman'dan, o da Zeyd ibn el-Hattab ailesinin azatlı kölesi Ubeyd ibn Huneyn'den rivayet ettiğine göre, Ebu Hurayra'nın şöyle dediğini işittiğini söyledi: “Peygamberimizle birlikteydim. Bir adamın İhlas Suresi'ni [112:1] okuduğunu işitti ve ‘Bu kesindir’ dedi. Ona, ‘Ey Allah'ın Resulü, bu nedir?’ diye sordum. O da, ‘Cennet’ diye cevap verdi.” Ebu Hurayra, adama müjdeyi vermek için yanına gitmek istediğini, ancak Peygamberimizle öğle yemeğini kaçırmaktan korktuğu için öğle yemeği yemeyi tercih ettiğini söyledi. Sonra adamın yanına gitti ve onun çoktan ayrılmış olduğunu gördü. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab ve İshak ibn Süleyman tarafından Tirmizi'de (2897), Suveyd ve Kanabi tarafından Hakim'de (1/566) ve İbn Al-Kâsim tarafından Nesai'de nakledildiğini belirtiyor. İbn Abdül-Barr'ın (Temhid 19/215) Yahya'nın \"Ubeydullah ibn Abdurrahman\" dediğini ve çoğu ravi de onu takip ettiğini söylediğini aktarıyor. Kanabi ve Mutarrif \"Abdullah\" demişlerdir ve doğru rivayet Yahya'nın söylediğidir. {cite:muwatta-maruf-1997 s.286} {cite:muwatta-maruf-1997 s.287}"
  id: "Malik meriwayatkannya dari Ubaydullah ibn Abdur-Rahman, dari Ubayd ibn Hunayn, budak yang dibebaskan dari keluarga Zayd ibn al-Khattab, bahwa ia mendengar Abu Hurayrah berkata: “Aku bersama Nabi ketika beliau mendengar seorang laki-laki membaca Surah Al-Ikhlas [112:1], dan beliau berkata: ‘Itu dijamin.’ Aku bertanya kepadanya: ‘Apakah itu, wahai Rasulullah?’ Beliau menjawab: ‘Surga.’” Abu Hurayrah berkata bahwa ia ingin pergi kepada laki-laki itu untuk menyampaikan kabar gembira tersebut, tetapi kemudian ia khawatir akan ketinggalan makan siang bersama Nabi, jadi ia memilih untuk makan siang terlebih dahulu. Kemudian ia pergi kepada laki-laki itu dan mendapati bahwa laki-laki itu telah pergi. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab dan Ishaq ibn Sulayman dalam At-Tirmidhi (2897), oleh Suwayd dan Al-Qa’nabi dalam Al-Hakim (1/566), dan oleh Ibn Al-Qasim dalam An-Nasa’i. Ia mengutip Ibn Abd Al-Barr (At-Tamhid 19/215) yang mengatakan bahwa Yahya berkata “Ubaydullah ibn Abdur-Rahman,” dan sebagian besar perawi mengikutinya. Al-Qa’nabi dan Mutarrif berkata “Abdullah,” dan versi yang benar adalah apa yang dikatakan Yahya. {cite:muwatta-maruf-1997 p.286} {cite:muwatta-maruf-1997 p.287}"
