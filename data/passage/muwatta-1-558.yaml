label: { ar: "الموطأ 558 — أبو هريرة: سمع النبي رجلاً يقرأ سورة الإخلاص فقال: وجبت… الجنة", en: "Muwatta 558" }
text: "وجبت"
summary:
  ar: "يرويه مالك عن عبيد الله بن عبد الرحمن عن عبيد بن حنين مولى آل زيد بن الخطاب، أنه سمع أبا هريرة يقول: أقبلت مع النبي فسمع رجلاً يقرأ سورة الإخلاص [[passage/quran-112-1|الإخلاص]]، فقال: وجبت. فسألته: ماذا يا رسول الله؟ فقال: الجنة. ويقول أبو هريرة إنه أراد أن يذهب إلى الرجل ليبشره، ثم خاف أن يفوته الغداء مع النبي فآثر الغداء، ثم ذهب إلى الرجل فوجده قد ذهب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق بن سليمان عند الترمذي (2897)، وسويد، والقعنبي عند الحاكم (1/566)، وابن القاسم عند النسائي، وينقل عن ابن عبد البر (التمهيد 19/215) أن يحيى قال «عبيد الله بن عبد الرحمن» وتابعه أكثر الرواة، وقال القعنبي ومطرف «عبد الله»، والصواب ما قاله يحيى. {cite:muwatta-maruf-1997 p.286} {cite:muwatta-maruf-1997 p.287}"
