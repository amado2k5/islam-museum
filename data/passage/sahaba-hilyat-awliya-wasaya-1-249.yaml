text: "… أن كل ذلك قد جاء اللّٰه تعالى بالرزق، ولم يأخذ الطعام، وأما الثوبان فقال إن أم فلان عارية فأخذهما ورجع إلى منزله. فلم يلبث أن هلك، فبلغ عمر ذلك فشق عليه وترحم عليه، نفرج يكشى ومعه المشاؤن إلى بقيع الغرقد، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 249، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 249, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 249 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 1, pág. 249, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Hilyat al-Awliya' d'Abu Nu'aym (tome 1, p. 249) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 1. cildinin 249. sayfasında bir defin, bir mezar ve bir türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 1, halaman 249, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
