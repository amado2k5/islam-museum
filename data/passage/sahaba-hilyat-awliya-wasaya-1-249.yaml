text: "… أن كل ذلك قد جاء اللّٰه تعالى بالرزق، ولم يأخذ الطعام، وأما الثوبان فقال إن أم فلان عارية فأخذهما ورجع إلى منزله. فلم يلبث أن هلك، فبلغ عمر ذلك فشق عليه وترحم عليه، نفرج يكشى ومعه المشاؤن إلى بقيع الغرقد، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 249، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 249, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
