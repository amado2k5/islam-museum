text: |-
  ٤٩٤
  ⁦(باب الشين)⁩
  ⁦(فشش)⁩
  الفاحشة وكل شى جاوزحده فهوفاحس وقد فحش الامر بالضم غحشا وتفاحش ويسمى
  الزنافاحشة وقول طرف
  أرى الموت يعتام الكرام ويصطفى • عقلة مال الفاحش المتشدد
  يعنى الذى جاوز الحدّ فى البخل وأفحش عليه فى المنطق أى قال الفهس فهوغاش وتفهشر
  فى كلامه ⁦( رش)⁩ القراش واحد الفرش وقديكن به عن المرأة وفرشت الشئ أفرشه
  فراشابستطته وبقال فرشه أمرهاذا أوسعه اياه وفلان كريم المفارش اذا تزوج كرائم
  النساء والفرش المفروش من متاع البيت والفرش الزرع اذافرش والفرش الفضاء الواسع
  والفرش صغار الابل ومنه قوله تعالى ومن الانعام حولة وفرشا قال الفراء لم أسمع له يجما
  قال ويحتمل أن يكون مصدراسى به من قولهم فرشها اللّٰه تعالى فرشا أى بنها بذا والفرش
  فى رجل اليعير اتساع قليل وهو ممود واذا كثر وافرط الروح حق اصطك العرقوبان فهو
  العقل وهو مذموم قال الجعدى
  مطوية الزورطى البترد وسرة • مفروشة الرجل فرشا لم يكن *قلا
  ويقال الفرش فى الرجل *وأن لايكون فيها انتصاب ولا اقعاد وافترش الشئاى انيس
  يقال أكمة مفترشة الظهراذا كانت د كاء وافترشه أى وطنه وافترش ذراعيه بسطهما على
  الارض واقترش اسانه اذا تكام كيف شاء أى بسطه وقولهم ما أفرش عنه أى ما أقلع قال
  الشاعر
  نعلوهم بقضب منحلة • لم تعدان أفرش عنها الصقله
  أى أنها جدد وتفريسْ الدارتيليطها والمفرش الزرع اذا انبسط وقد فرش تفربشاو المفرّشة
  أيضا الشجة التى تصدع العظم ولا تهشم وفراشة القفل ما ينشب فيه يقال اقفل فافرش
  والفراشة كل عظم رقيق وفراش الرأس عظام رقاق قلى القسف والفراشسة التى تطير
  وتهافت فى السراج وفى المثل أطيش من فراشة والبهع فراش والفراش ما يبس بعد الماءمن
  الطبن على وجه الارض قال ذو الرمة يصف الحر
  وأبصرن أن القنع صارت نطافه • فراشاوان البقل ذا وويابس
  وفراش النبيذ الحبب الذى عليه عن أب عمرو وكذلك حبب العرق قال لبيد
  علا المسك والديباج فوف غحورهم * فراش الميح كابهان المحبب
  من رفع الفراش ونصب المسلك رفع الدياج على أن الواوللحال ومن نصب الفراس رفعهما
  وكل ذات حافر فهى فريش بعدنتاجها بسبعة أيام والجمع فوائش وتفرّش الطائررفرف
  بجناحيه وبسطهما قال أبودواديصف ريدئة
  فأتانايسعى تفرش أم البيشض سدًا وقدتعالى النهار
  ( ⁦(ئس)⁩ فسْ الوطب يقشه اى أخرج مافيه من الريح يقال للغضيان لافشئك فسْ
  الوطب أى لاخرجنّ غضبك من رأسك ور بما قالوافس الرحل اذا تجشأ والفشر سرعة
  الحلب وقد فششت الناقة وفاقة فشوش منتشرة الشخب والفش حل الينبوت وانفشت
  الرياح خرجت عن الزق ونحوه وانفس الرجل عن الاهر أى قتروكسل وانفسْ الجرح .كن
