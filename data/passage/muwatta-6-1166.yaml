label: { ar: "الموطأ 1166 — النبي بمنى: هذا المنحر وكل منى منحر، وفي العمرة هذا المنحر يعني المروة، وكل فجاج مكة طرقها منحر", en: "Muwatta 1166", es: "Muwatta 1166", fr: "Muwatta 1166", ur: "موطا 1166", tr: "El-Muvatta 1166 — Peygamber Mina'da: Burası kurban yeridir ve Mina'nın tamamı kurban yeridir. Umre zamanında da burası kurban yeridir, yani Merve ve Mekke'nin bütün yolları kurban yerleridir.", id: "Al-Muwatta 1166 — Nabi di Mina: Ini adalah tempat penyembelihan, dan seluruh Mina adalah tempat penyembelihan. Dan selama Umrah, ini adalah tempat penyembelihan, yaitu Al-Marwa, dan semua jalan di Mekah adalah tempat penyembelihan." }
summary:
  ar: "بلغ مالكا أن رسول الله قال بمنى هذا المنحر وكل منى منحر، وقال في العمرة هذا المنحر، يعني المروة، وكل فجاج مكة وطرقها منحر. ويذكر المحقق أن الحديث روي موصولا من حديث جابر بإسناد حسن. {cite:muwatta-maruf-1997 p.526}"
  tr: "Malik, Resulullah'ın Mina hakkında şöyle buyurduğunu rivayet etmiştir: \"Burası kurban yeridir ve Mina'nın tamamı kurban yeridir.\" Umre hakkında ise şöyle buyurmuştur: \"Burası kurban yeridir,\" yani Merve'yi kastederek, \"ve Mekke'nin tüm vadileri ve yolları kurban yerleridir.\" Araştırmacı, hadisin Cabir'den sağlam bir isnad zinciriyle nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.526}"
  id: "Malik meriwayatkan bahwa Rasulullah SAW bersabda, mengenai Mina, \"Ini adalah tempat penyembelihan, dan seluruh Mina adalah tempat penyembelihan.\" Dan mengenai Umrah, beliau bersabda, \"Ini adalah tempat penyembelihan,\" yang berarti Marwa, \"dan seluruh lembah dan jalan di Mekah adalah tempat penyembelihan.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dengan sanad yang berkesinambungan dari Jabir dengan sanad perawi yang sahih. {cite:muwatta-maruf-1997 p.526}"
