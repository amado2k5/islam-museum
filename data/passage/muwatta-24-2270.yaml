summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن الزبير بن العوام اشترى عبدا فأعتقه، وكان لذلك العبد بنون من امرأة حرة. فادعى الزبير ولاءهم، وادعى موالي أمهم ولاءهم، فاختصموا إلى عثمان بن عفان، فقضى للزبير بولائهم. {cite:muwatta-maruf-1997 p.337}"
