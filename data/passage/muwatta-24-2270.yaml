label: { ar: "الموطأ 2270 — ربيعة بن أبي عبد الرحمن: الزبير وموالي أم بنيه", en: "Muwatta 2270", es: "Muwatta 2270", fr: "Muwatta 2270", ur: "موطا 2270", tr: "El-Muvatta 2270 — Rabi’ah ibn Abi Abd al-Rahman: El-Zubayr ve annesinin çocuklarının azat edilmiş köleleri", id: "Al-Muwatta 2270 — Rabi’ah ibn Abi Abd al-Rahman: Al-Zubayr dan para budak yang dibebaskan dari anak-anak ibunya" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن الزبير بن العوام اشترى عبدا فأعتقه، وكان لذلك العبد بنون من امرأة حرة. فادعى الزبير ولاءهم، وادعى موالي أمهم ولاءهم، فاختصموا إلى عثمان بن عفان، فقضى للزبير بولائهم. {cite:muwatta-maruf-1997 p.337}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle, el-Zubayr ibn al-Awwam'ın bir köle satın alıp azat ettiğini söyler. Bu kölenin azatlı bir kadından oğulları vardı. El-Zubayr onların biat ettiğini iddia etti ve annelerinin azatlı köleleri de biat ettiklerini iddia ettiler. Anlaşmazlıklarını Osman ibn Affan'a götürdüler ve Osman, biat konusunda el-Zubayr'ın lehine hüküm verdi. {cite:muwatta-maruf-1997 s.337}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa al-Zubayr ibn al-Awwam membeli seorang budak dan membebaskannya. Budak ini memiliki anak laki-laki dari seorang wanita merdeka. Al-Zubayr menyatakan kesetiaan kepada mereka, dan budak-budak yang dibebaskan dari ibu mereka juga menyatakan kesetiaan kepada mereka. Mereka membawa perselisihan mereka kepada Uthman ibn Affan, yang memutuskan untuk memihak al-Zubayr mengenai kesetiaan mereka. {cite:muwatta-maruf-1997 p.337}"
