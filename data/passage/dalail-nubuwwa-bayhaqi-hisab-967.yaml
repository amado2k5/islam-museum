text: "… : يا جبريل ! من هؤلاء ؟ قال : هؤلاء المهاجرون في سبيل اللّه يضاعف لهم الحسنة بسبعمائة ضعف وما أنفقتم من شيء فهو يخلفه وهو خير الرازقين ، ثم أتى على قوم ترضخ رؤوسهم بالصخر كلما رضخت عادت كما …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 967، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 967, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 967 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
