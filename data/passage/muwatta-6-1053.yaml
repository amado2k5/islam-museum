label: { ar: "الموطأ 1053 — مالك فيمن أهل بالحج من مكة ثم طاف وسعى ثم مرض فلم يستطع حضور الموقف: إذا فاته الحج خرج إلى الحل فدخل بعمرة وطاف وسعى لأن طوافه الأول لم ينوه للعمرة، وعليه حج قابل والهدي", en: "Muwatta 1053", es: "Muwatta 1053", fr: "Muwatta 1053", ur: "موطا 1053", tr: "El-Muvatta 1053 — Malik, Mekke'den Hac için ihrama giren, sonra Tavaf ve Sa'i yapan, ardından hastalanıp Arafat'ta nöbet tutamayan kimse hakkında şöyle diyor: Eğer Hac'ı kaçırmışsa, Haram sınırının dışına çıkıp Mekke'ye girerek Umre yapmalı, sonra Tavaf ve Sa'i yapmalıdır; çünkü ilk Tavafı Umre için değildi. Ertesi yıl Hac yapmalı ve kurban kesmelidir.", id: "Al-Muwatta 1053 — Malik tentang seseorang yang memasuki keadaan ihram untuk haji dari Mekah, kemudian melakukan Tawaf dan Sa'i, lalu jatuh sakit dan tidak dapat menghadiri shalat berjamaah di Arafat: Jika ia melewatkan haji, ia harus keluar dari batas Haram dan memasuki Mekah untuk melakukan Umrah, kemudian melakukan Tawaf dan Sa'i, karena Tawaf pertamanya tidak ditujukan untuk Umrah. Ia harus melaksanakan haji tahun berikutnya dan mempersembahkan hewan kurban." }
summary:
  ar: "قال مالك فيمن أهل بالحج من مكة، ثم طاف بالبيت وسعى بين الصفا والمروة، ثم مرض فلم يستطع أن يحضر مع الناس الموقف: قال: إذا فاته الحج فإنه إن استطاع خرج إلى الحل، فدخل بعمرة، فطاف بالبيت وسعى بين الصفا والمروة، لأن الطواف الأول لم يكن نواه للعمرة، وعليه حج قابل والهدي. ويذكر المحقق أن ما بعد ذلك في الصفحة 488 لمن كان من غير أهل مكة. ويذكر أنه رواه عن مالك أبو مصعب (1171). {cite:muwatta-maruf-1997 p.487} {cite:muwatta-maruf-1997 p.488}"
  tr: "Malik, Mekke'den Hac için ihram haline giren, Kâbe'nin etrafında tavaf ve Safa ile Merve arasında sa'i yapan, sonra hastalanıp Arafat'ta insanlarla birlikte duramayan biri hakkında şöyle demiştir: \"Eğer Hac'ı kaçırırsa, eğer gücü yetiyorsa, Haram sınırının dışına çıkıp Mekke'ye girerek Umre yapmalıdır. Kâbe'nin etrafında tavaf ve Safa ile Merve arasında sa'i yapmalıdır, çünkü ilk tavaf Umre için değildir. Ertesi yıl Hac yapmalı ve kurban kesmelidir.\" Editör, 488. sayfada devam edenlerin Mekke'de ikamet etmeyenler için olduğunu belirtmektedir. Ayrıca bunun Malik'ten Ebu Mus'ab (1171) tarafından rivayet edildiğini de belirtmektedir. {cite:muwatta-maruf-1997 s.487} {cite:muwatta-maruf-1997 s.488}"
  id: "Malik berkata mengenai seseorang yang memasuki keadaan ihram untuk haji dari Mekah, kemudian melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa, lalu jatuh sakit dan tidak dapat menghadiri Arafat bersama orang-orang: Beliau berkata: Jika ia melewatkan haji, maka jika ia mampu, ia harus pergi ke luar batas Haram dan memasuki Mekah untuk melaksanakan umrah, melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa, karena Tawaf pertama tidak dimaksudkan untuk umrah. Ia harus melaksanakan haji tahun berikutnya dan mempersembahkan hewan kurban. Editor menyebutkan bahwa apa yang terdapat di halaman 488 adalah untuk mereka yang bukan penduduk Mekah. Ia juga menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1171). {cite:muwatta-maruf-1997 p.487} {cite:muwatta-maruf-1997 p.488}"
