label: { ar: "الموطأ 1053 — مالك فيمن أهل بالحج من مكة ثم طاف وسعى ثم مرض فلم يستطع حضور الموقف: إذا فاته الحج خرج إلى الحل فدخل بعمرة وطاف وسعى لأن طوافه الأول لم ينوه للعمرة، وعليه حج قابل والهدي", en: "Muwatta 1053" }
summary:
  ar: "قال مالك فيمن أهل بالحج من مكة، ثم طاف بالبيت وسعى بين الصفا والمروة، ثم مرض فلم يستطع أن يحضر مع الناس الموقف: قال: إذا فاته الحج فإنه إن استطاع خرج إلى الحل، فدخل بعمرة، فطاف بالبيت وسعى بين الصفا والمروة، لأن الطواف الأول لم يكن نواه للعمرة، وعليه حج قابل والهدي. ويذكر المحقق أن ما بعد ذلك في الصفحة 488 لمن كان من غير أهل مكة. ويذكر أنه رواه عن مالك أبو مصعب (1171). {cite:muwatta-maruf-1997 p.487} {cite:muwatta-maruf-1997 p.488}"
