label: { ar: "موطأ مالك 1267 — الكحل، الشكوى من العلة", en: "Muwatta Malik 1267 — kohl for the eye; a complaint of an ailment", ur: "موطأ مالک 1267 — سرمہ، بیماری کی شکایت", es: "Muwatta Malik 1267 — kohl para el ojo; una queja sobre una dolencia", fr: "Muwatta Malik 1267 — khôl pour l'œil; une plainte relative à un trouble", tr: "Muwatta Malik 1267 — Kohl, hastalık şikayeti", id: "Muwatta Malik 1267 — Kohl, keluhan penyakit" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ أُمَّ سَلَمَةَ، زَوْجَ النَّبِيِّ قَالَتْ لاِمْرَأَةٍ حَادٍّ عَلَى زَوْجِهَا اشْتَكَتْ عَيْنَيْهَا فَبَلَغَ ذَلِكَ مِنْهَا اكْتَحِلِي بِكُحْلِ الْجِلاَءِ بِاللَّيْلِ وَامْسَحِيهِ بِالنَّهَارِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1267، يذكر الكحل، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1267 (Divorce), that mentions kohl for the eye, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1267، جس میں سرمہ، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1267 (Divorcio), menciona el kohl para los ojos, una queja sobre una dolencia. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik, n° 1267 (Divorce), mentionne l'utilisation du khôl pour soigner un trouble oculaire. Le Répertoire des ouvrages médicaux le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta'sında yer alan 1267 numaralı hadiste, sürme ve hastalık şikayetlerinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1267, menyebutkan tentang kohl dan keluhan penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
