text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ أُمَّ سَلَمَةَ، زَوْجَ النَّبِيِّ قَالَتْ لاِمْرَأَةٍ حَادٍّ عَلَى زَوْجِهَا اشْتَكَتْ عَيْنَيْهَا فَبَلَغَ ذَلِكَ مِنْهَا اكْتَحِلِي بِكُحْلِ الْجِلاَءِ بِاللَّيْلِ وَامْسَحِيهِ بِالنَّهَارِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1267، يذكر الكحل، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1267 (Divorce), that mentions kohl for the eye, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1267، جس میں سرمہ، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
