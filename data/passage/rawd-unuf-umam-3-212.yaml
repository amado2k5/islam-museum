text: "… تَر إلى الَّذِينَ فاقَقُوا يعى عبد اللّٰه بن أَبَى وأصحابه، وَمَن كان على مثل أمرم يُقُولُونَ لإِخْوَايهِمُ الّذِينَ كَفَرُوا إ مِنْ أَهْلِ الكِتابِ : يعى بنى النِّضير، إلى قوله : كمَتَلِ الَّذِينَ مِنْ قَبْلِهِمْ قَزِيبًا ذَاقُوا وَبِالَ أَمْرِيِمْ، ولَهُمْ عَذَابُ …"
