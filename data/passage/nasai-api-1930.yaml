label: { ar: "سنن النسائي 1930 — تعزية ومواساة وصبر عند المصيبة", en: "Sunan al-Nasa'i 1930 — condolence, consolation and patience at a loss", ur: "سنن النسائی 1930 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Sunan al-Nasa'i 1930 — des condoléances, une consolation et la patience devant la perte", es: "Sunan al-Nasa'i 1930 — condolencias, consuelo y paciencia ante la pérdida", tr: "Sunan an-Nasa'i 1930 — Felaket zamanlarında taziye, şefkat ve sabır", id: "Sunan an-Nasa'i 1930 — Ungkapan belasungkawa, simpati, dan kesabaran di masa musibah" }
text: "أَخْبَرَنَا قُتَيْبَةُ، عَنْ مَالِكٍ، عَنْ مُحَمَّدِ بْنِ عَمْرِو بْنِ حَلْحَلَةَ، عَنْ مَعْبَدِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِي قَتَادَةَ بْنِ رِبْعِيٍّ، أَنَّهُ كَانَ يُحَدِّثُ أَنَّ رَسُولَ اللَّهِ مُرَّ عَلَيْهِ بِجَنَازَةٍ فَقَالَ \" مُسْتَرِيحٌ وَمُسْتَرَاحٌ مِنْهُ \". فَقَالُوا مَا الْمُسْتَرِيحُ وَمَا الْمُسْتَرَاحُ مِنْهُ قَالَ \" الْعَبْدُ الْمُؤْمِنُ يَسْتَرِيحُ مِنْ نَصَبِ الدُّنْيَا وَأَذَاهَا وَالْعَبْدُ الْفَاجِرُ يَسْتَرِيحُ مِنْهُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1930، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1930 (The Book of Funerals), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن النسائی کی حدیث نمبر 1930، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan al-Nasa'i, n° 1930, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan al-Nasa'i, n.º 1930, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sunan-ı Nesai'de yer alan 1930 numaralı hadis, musibet karşısında taziye, teselli ve sabır sunmaktadır. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü ağıt ve mersiyelerden bazılarını bir araya getirmektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 1930, menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah. Koleksi ini menyusun beberapa elegi dan ratapan paling terkenal, bersama dengan teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
