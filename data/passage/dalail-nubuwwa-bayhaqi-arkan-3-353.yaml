text: "… ابنة سَيّد قومي، وان أبي كان يَحْمى الذمارَ، ويَفُك العاني، ويشبع الجائع، ويكسو العاري، ويقري الضيف، ويطعم الطعام، ويفشي السلام، ولا يَرُدِّ طالب حاجة قط، انا ابنة حاتم طيّء، فقال النبي : يا جارية ! هذه صفة المؤمنين حقاً لو …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 3، ص 353، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 3, p. 353, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 3، ص 353 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 3, pág. 353, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Dala'il al-Nubuwwa d'al-Bayhaqi (tome 3, p. 353), numérisé, mentionnant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Beyhakî'nin \"Delil el-Nübüvve\" (Peygamberliğin Delilleri) adlı eserinin 3. cildinin 353. sayfasından, müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın Temelleri, İmanın Temelleri, İmanın Dalları ve Müminin Özellikleri başlığı altında derlenmiştir."
  id: "Kutipan dari kitab \"Dala'il al-Nubuwwah\" (Bukti Kenabian) karya Al-Bayhaqi, Jilid 3, halaman 353, yang menyebutkan ciri-ciri seorang mukmin; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun berdasarkan Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Ciri-ciri Seorang Mukmin."
