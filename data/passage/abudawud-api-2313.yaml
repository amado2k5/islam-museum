label: { ar: "سنن أبي داود 2313 — ما حُرّم، الرخصة", en: "Sunan Abi Dawud 2313 — what was made unlawful; the concession", ur: "سنن ابی داؤد 2313 — جو حرام کیا گیا، رخصت" }
text: "… كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ } فَكَانَ النَّاسُ عَلَى عَهْدِ النَّبِيِّ إِذَا صَلَّوُا الْعَتَمَةَ حَرُمَ عَلَيْهِمُ الطَّعَامُ وَالشَّرَابُ وَالنِّسَاءُ وَصَامُوا إِلَى الْقَابِلَةِ فَاخْتَانَ رَجُلٌ نَفْسَهُ فَجَامَعَ امْرَأَتَهُ وَقَدْ صَلَّى الْعِشَاءَ وَلَمْ يُفْطِرْ فَأَرَادَ اللَّهُ عَزَّ وَجَلَّ أَنْ يَجْعَلَ ذَلِكَ يُسْرًا لِمَنْ بَقِيَ وَرُخْصَةً وَمَنْفَعَةً فَقَالَ سُبْحَانَهُ { عَلِمَ اللَّهُ أَنَّكُمْ كُنْتُمْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2313، يذكر ما حُرّم، والرخصة. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2313 (Fasting (Kitab Al-Siyam)), that mentions what was made unlawful, the concession. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2313، جس میں جو حرام کیا گیا، رخصت کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
