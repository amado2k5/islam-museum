summary:
  ar: "القسم 41 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العلم عن رسول الله»، ويضم فيها النصوص من 2645 إلى 2687 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 41 of Jami' al-Tirmidhi (Chapters on Knowledge) in the division of the open hadith dataset the museum took its reports from: reports 2645 to 2687 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 41، عنوان «کتاب العلم عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2645 تا 2687۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 41 de Jami' al-Tirmidhi (Capítulos sobre el conocimiento) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2645 al 2687, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 41 de Jami' al-Tirmidhi (Chapitres sur la connaissance), dans la section du recueil ouvert de hadiths: les hadiths 2645 à 2687 de cette numérotation. Le musée classe ses archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 41. bölümü \"Allah'ın Elçisinden Bilgi Kitabı\" başlığını taşımakta olup, 2645'ten 2687'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 41 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Ilmu dari Rasulullah\" dan berisi teks 2645 hingga 2687, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
