summary:
  ar: "يروي مالك عن هشام بن عروة عن فاطمة بنت المنذر أن أسماء بنت أبي بكر كانت إذا أُتيت بالمرأة وقد حُمت تدعو لها، أخذت الماء فصبته بينها وبين جيبها، وقالت: إن رسول الله كان يأمرنا أن نبردها بالماء. {cite:muwatta-maruf-1997 p.533}"
