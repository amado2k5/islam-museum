label: { ar: "الموطأ 2721 — فاطمة بنت المنذر: أسماء بنت أبي بكر تصب الماء بين المرأة المحمومة وجيبها", en: "Muwatta 2721", es: "Muwatta 2721", fr: "Muwatta 2721", ur: "موطا 2721", tr: "El-Muvatta 2721 — Fatıma bint el-Mundhir: Esma bint Ebu Bekir, ateşli bir kadın ile vajinası arasına su döküyor.", id: "Al-Muwatta 2721 — Fatima bint al-Mundhir: Asma bint Abi Bakr menuangkan air di antara seorang wanita yang demam dan vulvanya" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن فاطمة بنت المنذر أن أسماء بنت أبي بكر كانت إذا أُتيت بالمرأة وقد حُمت تدعو لها، أخذت الماء فصبته بينها وبين جيبها، وقالت: إن رسول الله كان يأمرنا أن نبردها بالماء. {cite:muwatta-maruf-1997 p.533}"
  tr: "Malik, Hişam ibn Urvah'tan, o da Fatıma bint el-Mundhir'den rivayet ettiğine göre, Esma bint Ebu Bekir, kendisine ateşli bir kadın getirildiğinde, onun için dua eder, su alır ve kendisiyle elbisesi arasına dökerdi. Şöyle derdi: \"Allah'ın Resulü bize onu suyla serinletmemizi emrederdi.\" {cite:muwatta-maruf-1997 s.533}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari Fatimah bint al-Mundhir, bahwa Asma bint Abi Bakr, ketika seorang wanita dibawa kepadanya dengan demam, akan berdoa untuknya, mengambil air, dan menuangkannya di antara dirinya dan pakaiannya, seraya berkata: “Rasulullah biasa memerintahkan kami untuk mendinginkannya dengan air.” {cite:muwatta-maruf-1997 p.533}"
