text: "… الجِبالَ، قال: قلَّتُ: يا رسولَ اللَّه! فبم نُجزَى من سيئاتنا وحسناتنا؟ قال : الحَسَنَةُ بَعَشْرِ أَمْثَالِها ، والسَّيّنَةُ بِمِثْلِها إلَّا أَنْ يَعْفُوَ، قال قلتُ: يا رسول اللَّه! ما الجنةُ وما النارُ؟ قال: «لَعَمْرُ إلْهِكَ إِنَّ النَّارَ لها سَبْعَة أَبْوَابٍ مَا …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 580، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 580, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 580 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
