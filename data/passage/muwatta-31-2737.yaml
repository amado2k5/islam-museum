ref: "2737"
label: { ar: "الموطأ 2737 — يحيى بن سعيد: خالد بن الوليد يُروّع في منامه فيأمره النبي بالتعوذ بكلمات الله التامة", en: "Muwatta 2737", ur: "موطأ 2737 — خالد بن الولید کا خوفناک خواب", es: "Muwatta 2737", fr: "Muwatta 2737", tr: "El-Muvatta 2737 — Yahya bin Said: Halid bin el-Velid uykusunda çok korkmuştu, bunun üzerine Peygamber ona Allah'ın kusursuz sözlerine sığınmasını emretti.", id: "Al-Muwatta 2737 — Yahya bin Saeed: Khalid bin Al-Walid ketakutan dalam tidurnya, maka Nabi memerintahkannya untuk berlindung pada firman Allah yang sempurna." }
summary:
  ar: "بلغني عن يحيى بن سعيد أن خالد بن الوليد قال لرسول الله: إني أُروّع في منامي. فقال له رسول الله: قل: أعوذ بكلمات الله التامة، من غضبه وعقابه وشر عباده، ومن همزات الشياطين وأن يحضرون. ويذكر المحقق أن الحديث مشهور مسندا وغير مسند، وأن أكثر الروايات تذكر متنه. {cite:muwatta-maruf-1997 p.539} {cite:muwatta-maruf-1997 p.540}"
  ur: "موطأ میں روایت، نمبر 2737: یحییٰ بن سعید بیان کرتے ہیں کہ خالد بن الولید کو نیند میں ڈرایا گیا تو نبی نے انہیں اللہ کی کامل کلمات سے پناہ سکھائی۔"
  tr: "Yahya ibn Sa'id'den bana rivayet edildiğine göre Halid ibn el-Velid, Allah'ın Resulü'ne şöyle demiş: \"Uykumda çok korkuyorum.\" Allah'ın Resulü ona şöyle buyurmuş: \"De ki: 'Allah'ın kusursuz sözlerine, gazabından ve azabından, kullarının şerrinden ve cinlerin vesveselerinden ve varlıklarından sığınırım.'\" Araştırmacı, hadisin hem isnadlı hem de isnadsız olarak iyi bilindiğini ve çoğu rivayetin metnini içerdiğini belirtiyor. {cite:muwatta-maruf-1997 s.539} {cite:muwatta-maruf-1997 s.540}"
  id: "Diriwayatkan kepadaku oleh Yahya ibn Sa'id bahwa Khalid ibn al-Walid berkata kepada Rasulullah: \"Aku merasa takut dalam tidurku.\" Rasulullah bersabda kepadanya: \"Katakanlah: 'Aku berlindung kepada firman Allah yang sempurna dari murka dan azab-Nya, dari kejahatan hamba-hamba-Nya, dan dari bisikan setan dan kehadiran mereka.'\" Peneliti menyebutkan bahwa hadits ini terkenal, baik dengan maupun tanpa sanad, dan sebagian besar riwayat menyebutkan teksnya. {cite:muwatta-maruf-1997 p.539} {cite:muwatta-maruf-1997 p.540}"
