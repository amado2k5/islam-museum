label: { ar: "الموطأ 2737 — يحيى بن سعيد: خالد بن الوليد يُروّع في منامه فيأمره النبي بالتعوذ بكلمات الله التامة", en: "Muwatta 2737" }
summary:
  ar: "بلغني عن يحيى بن سعيد أن خالد بن الوليد قال لرسول الله: إني أُروّع في منامي. فقال له رسول الله: قل: أعوذ بكلمات الله التامة، من غضبه وعقابه وشر عباده، ومن همزات الشياطين وأن يحضرون. ويذكر المحقق أن الحديث مشهور مسندا وغير مسند، وأن أكثر الروايات تذكر متنه. {cite:muwatta-maruf-1997 p.539} {cite:muwatta-maruf-1997 p.540}"
