text: "… شعر جحا قال له أصدقاؤه: علمنا أنَّك تنظم القريض فهل نظمت أخيراً شيئاً منه؟ فأجابهم: لقد سألتمُوني شيئاً في حينهِ، وسأَنشدكم بيتاً حديثاً، قلته في هذا الصباح، فقد كانت والدتي تضع الحليب على النار، لجعلهِ لبناً فأتَّفق أن فسد اللبن …"
summary:
  ar: "سأل الأصدقاء جحا هل نظم شعراً، فأنشد بيتاً نظمه حين فسد حليب أمه ورأت خطيبته الحليب الفاسد، ولم تفهمه. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  en: "Friends ask Juha whether he has written any verse, and he recites a verse he composed when his mother's milk spoiled and his fiancée saw the spoiled milk. She did not understand it. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  ur: "دوست جحا سے پوچھتے ہیں کہ کیا اس نے کبھی شعر کہا ہے تو وہ ایک شعر سناتا ہے جو اس نے اس وقت کہا تھا جب اس کی ماں کا دودھ خراب ہو گیا اور اس کی منگیتر نے خراب دودھ دیکھا۔ وہ اسے سمجھ نہ سکی۔ {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  fr: "Des amis demandent à Juha s'il a composé des vers, et il récite un vers qu'il a composé quand le lait de sa mère a tourné et que sa fiancée a vu le lait tourné. Elle ne l'a pas compris. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  es: "Unos amigos preguntan a Juha si ha escrito algún verso, y él recita uno que compuso cuando se estropeó la leche de su madre y su prometida vio la leche estropeada. Ella no lo entendió. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
