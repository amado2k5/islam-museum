label: { ar: "الموطأ 1915 — مالك: الأمر المجتمع عليه أن لحم الإبل والبقر والغنم وما أشبهها من الوحوش لا يشترى بعضه ببعض إلا مثلا بمثل وزنا بوزن يدا بيد، ولا بأس به وإن لم يوزن إذا تحرى أن يكون مثلا بمثل", en: "Muwatta 1915", es: "Muwatta 1915", fr: "Muwatta 1915", ur: "موطا 1915", tr: "El-Muvatta 1915 — Malik: İttihat, deve, sığır, koyun ve benzeri hayvanların etinin, eşit miktarda, ağırlık olarak, elden ele takas edilmesi dışında değiştirilmemesi gerektiğidir. Tartılmamış olsa bile, takasın eşit olması şartıyla caizdir.", id: "Al-Muwatta 1915 — Malik: Konsensusnya adalah bahwa daging unta, sapi, domba, dan hewan sejenisnya tidak boleh dipertukarkan kecuali dalam jumlah yang sama, berat demi berat, dari tangan ke tangan. Diperbolehkan meskipun tidak ditimbang, asalkan dipastikan jumlahnya sama dengan yang dipertukarkan." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في لحم الإبل والبقر والغنم وما أشبه ذلك من الوحوش، أنه لا يشترى بعضه ببعض، إلا مثلا بمثل، وزنا بوزن، يدا بيد. ولا بأس به، وإن لم يوزن، إذا تحرى أن يكون مثلا بمثل، يدا بيد. {cite:muwatta-maruf-1997 p.185}"
  tr: "Malik şöyle dedi: Bizde deve, sığır, koyun ve benzeri hayvanların etine ilişkin yerleşik uygulama şudur ki, bu et ancak eşit miktarda, ağırlık olarak, elden ele verilerek başkasıyla takas edilebilir. Tartılmasa bile, eşit miktarda ve elden ele verilmesi şartıyla bir sakıncası yoktur. {cite:muwatta-maruf-1997 s.185}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita mengenai daging unta, sapi, domba, dan hewan sejenisnya adalah bahwa daging tersebut tidak dapat dibeli untuk orang lain kecuali dalam takaran yang sama, berat demi berat, dari tangan ke tangan. Tidak ada salahnya meskipun tidak ditimbang, asalkan dilakukan dalam takaran yang sama, dari tangan ke tangan. {cite:muwatta-maruf-1997 p.185}"
