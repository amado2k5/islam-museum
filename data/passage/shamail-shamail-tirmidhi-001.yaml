text: "هام، فسألني بعض الإخوان، أصلح الله لي وله الحال والشان، أن أكتب عليه كتابة منتخبة من الشراح، متضمنة للكشف عن أسرار الكتاب مع الإيضاح، فأجبته لذلك، مع الاعتراف بالقصور عن الخوض في هذه المسالك، رجاء أن أستمد من أنوار المليح،"
