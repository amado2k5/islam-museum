text: "… العمل لا يوافق النظر كان في بلدةٍ آقَ شَهْرْ حاكِمٌ شره بالمآكل، فقال يوماً لوجوه البلدة: أُريدُ أن أجمع كتاباً بأنواع المآكلِ فليكتُبْ كلِّ منكم طبخة من الأطعمة، وشاع الخبر حتى بلغ الشيخ، ففي صباح اليوم التالي رأى الشيخِ أحد …"
summary:
  ar: "في آق شهر طلب والٍ شره من الأعيان كتابة وصفات، فأخبر أحدهم جحا بفكرته أكل الثوم بالعسل، فجربها الوالي، ثم استدعى جحا ليأكل الباقي، فقال جحا ودموعه في عينيه إن العمل لا يوافق النظر. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  en: "In Akshehir a glutton governor asks the notables to write recipes, and a notable tells Juha of his idea, eating garlic with honey, and the governor tries it. The governor summons Juha to eat the rest, and Juha, with tearful eyes, says the work does not match the idea. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  ur: "آق شہر میں ایک پیٹو والی معززین سے نسخے لکھنے کو کہتا ہے، اور ایک معزز جحا کو اپنا خیال بتاتا ہے کہ لہسن شہد کے ساتھ کھایا جائے، اور والی اسے آزماتا ہے۔ والی جحا کو باقی کھانے کے لیے بلاتا ہے تو جحا آنکھوں میں آنسو لیے کہتا ہے کہ عمل خیال سے میل نہیں کھاتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  fr: "À Akshehir, un gouverneur glouton demande aux notables d'écrire des recettes, et un notable confie à Juha son idée, manger de l'ail avec du miel, que le gouverneur essaie. Le gouverneur convoque Juha pour manger le reste, et Juha, les yeux en larmes, dit que l'exécution ne correspond pas à l'idée. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  es: "En Akshehir un gobernador glotón pide a los notables que escriban recetas, y un notable cuenta a Juha su idea, comer ajo con miel, que el gobernador prueba. El gobernador convoca a Juha para que coma el resto, y Juha, con los ojos llorosos, dice que la obra no coincide con la idea. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
