text: "… أم سلمة. قالت : لما نزلنا أرض الحبشة جاورنا بها خير جار النجاشى، آمنا على ديننا وعدنا اللّه لا نؤذى ولا نسمع شيئاً نسكرهه. فلما بعثت قريش عبد اللّٰه بن أبى ربيعة وعمرو بن العاص بهداياهم إلى النجاشى وإلى بطارقته، …"
summary:
