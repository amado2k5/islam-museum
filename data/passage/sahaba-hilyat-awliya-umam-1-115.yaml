  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 115, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
