label: { ar: "صحيح البخاري 285 — وصف المؤمن", en: "Sahih al-Bukhari 285 — a description of the believer", ur: "صحیح بخاری 285 — مومن کا وصف", es: "Sahih al-Bukhari 285 — una descripción del creyente", fr: "Sahih al-Bukhari 285 — une description du croyant", tr: "Sahih el-Buhari 285 — Müminin Tanımı", id: "Sahih al-Bukhari 285 — Gambaran tentang Orang Beriman" }
text: "… حَدَّثَنَا عَبْدُ الأَعْلَى، حَدَّثَنَا حُمَيْدٌ، عَنْ بَكْرٍ، عَنْ أَبِي رَافِعٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ لَقِيَنِي رَسُولُ اللَّهِ وَأَنَا جُنُبٌ، فَأَخَذَ بِيَدِي، فَمَشَيْتُ مَعَهُ حَتَّى قَعَدَ فَانْسَلَلْتُ، فَأَتَيْتُ الرَّحْلَ، فَاغْتَسَلْتُ ثُمَّ جِئْتُ وَهْوَ قَاعِدٌ فَقَالَ \" أَيْنَ كُنْتَ يَا أَبَا هِرٍّ \" فَقُلْتُ لَهُ. فَقَالَ \" سُبْحَانَ اللَّهِ يَا أَبَا هِرٍّ إِنَّ الْمُؤْمِنَ لاَ يَنْجُسُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 285، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 285 (Bathing (Ghusl)), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 285، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 285 (El baño ritual (Ghusl)), menciona una descripción del creyente. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 285 (Le bain rituel (Ghusl)), mentionne une description du croyant. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih el-Buhari'de 285 numaralı hadis, mümini tanımlar. Bu hadis, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri ile birlikte, bir araştırmacı tarafından derlenmiş olup, bu dört kategori içinde Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetler içermektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 285, menjelaskan tentang orang beriman. Hadits ini, bersama dengan rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri orang beriman, disusun oleh seorang peneliti dan mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka dalam empat kategori tersebut."
