text: "د الكنى من النساء - باب العين ج نعد ام عطية في اهل البصرة كانت من كبار نساء الصحابة رضوان اللّٰه عليهم اجمعين وكانت تغزو كثيرا مع رسول اللّٰه تمرض المرضى وتداوى الجرحى وشهدت غسل ابنة رسول اللّه وحكت ذلك …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 101، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
