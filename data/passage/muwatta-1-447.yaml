label: { ar: "الموطأ 447 — إذا دخل أحدكم المسجد فليركع ركعتين قبل أن يجلس", en: "Muwatta 447", es: "Muwatta 447", fr: "Muwatta 447", ur: "موطا 447", tr: "Al-Muwatta 447 — Sizden biri mescide girerse, oturmadan önce iki rekat namaz kılsın.", id: "Al-Muwatta 447 — Jika salah seorang dari kalian memasuki masjid, hendaklah ia mengerjakan salat dua rakaat sebelum duduk." }
text: "إذا دخل أحدكم المسجد فليركع ركعتين قبل أن يجلس"
summary:
  ar: "يرويه مالك عن عامر بن عبد الله بن الزبير عن عمرو بن سليم الزرقي عن أبي قتادة الأنصاري، في باب انتظار الصلاة والمشي إليها: أمر النبي من دخل المسجد أن يصلي ركعتين قبل أن يجلس. ويخرّجه المحقق عند البخاري (444) ومسلم (2/155) وأبي داود (467) والترمذي (316) وابن ماجه (1013) والنسائي (2/53) وابن خزيمة والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (20/99). {cite:muwatta-maruf-1997 p.230}"
  id: "Diriwayatkan oleh Malik dari 'Amir ibn 'Abdullah ibn al-Zubayr, dari 'Amr ibn Salim al-Zuraqi, dari Abu Qatada al-Ansari, dalam surah tentang menunggu shalat dan berjalan menuju shalat: Nabi (shalawat dan salam kepadanya) memerintahkan siapa pun yang memasuki masjid untuk shalat dua rakaat sebelum duduk. Editor memasukkannya dalam kumpulan hadits al-Bukhari (444), Muslim (2/155), Abu Dawud (467), al-Tirmidhi (316), Ibn Majah (1013), al-Nasa'i (2/53), Ibn Khuzaymah, al-Darimi, dan Ahmad, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (20/99). {cite:muwatta-maruf-1997 p.230}"
