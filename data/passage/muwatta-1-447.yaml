text: "إذا دخل أحدكم المسجد فليركع ركعتين قبل أن يجلس"
summary:
  ar: "يرويه مالك عن عامر بن عبد الله بن الزبير عن عمرو بن سليم الزرقي عن أبي قتادة الأنصاري، في باب انتظار الصلاة والمشي إليها: أمر النبي من دخل المسجد أن يصلي ركعتين قبل أن يجلس. ويخرّجه المحقق عند البخاري (444) ومسلم (2/155) وأبي داود (467) والترمذي (316) وابن ماجه (1013) والنسائي (2/53) وابن خزيمة والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (20/99). {cite:muwatta-maruf-1997 p.230}"
