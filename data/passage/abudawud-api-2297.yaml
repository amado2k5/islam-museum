label: { ar: "سنن أبي داود 2297 — الأب والأبوة", en: "Sunan Abi Dawud 2297 — the father and fatherhood", ur: "سنن ابی داؤد 2297 — باپ اور والدیت" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنِ ابْنِ جُرَيْجٍ، قَالَ أَخْبَرَنِي أَبُو الزُّبَيْرِ، عَنْ جَابِرٍ، قَالَ طُلِّقَتْ خَالَتِي ثَلاَثًا فَخَرَجَتْ تَجُدُّ نَخْلاً لَهَا فَلَقِيَهَا رَجُلٌ فَنَهَاهَا فَأَتَتِ النَّبِيَّ فَذَكَرَتْ ذَلِكَ لَهُ فَقَالَ لَهَا \" اخْرُجِي فَجُدِّي نَخْلَكِ لَعَلَّكِ أَنْ تَصَدَّقِي مِنْهُ أَوْ تَفْعَلِي خَيْرًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2297، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2297 (Divorce (Kitab Al-Talaq)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2297، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
