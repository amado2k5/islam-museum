summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب النهي عن البصاق في القبلة: رأى النبي في جدار القبلة بصاقاً أو مخاطاً أو نخامة فحكه. ويخرّجه المحقق عند البخاري (406) ومسلم (2/76) والنسائي وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/136). {cite:muwatta-maruf-1997 p.270} {cite:muwatta-maruf-1997 p.271}"
