label: { ar: "الموطأ 523 — عائشة: رأى في جدار القبلة بصاقاً أو مخاطاً أو نخامة فحكه", en: "Muwatta 523", es: "Muwatta 523", fr: "Muwatta 523", ur: "موطا 523", tr: "Al-Muwatta 523 — Aişe: Kıble duvarında tükürük, mukus veya balgam gördü, onu kazıyarak temizledi.", id: "Al-Muwatta 523 — Aisyah: Dia melihat air liur, lendir, atau dahak di dinding kiblat, lalu dia mengikisnya." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب النهي عن البصاق في القبلة: رأى النبي في جدار القبلة بصاقاً أو مخاطاً أو نخامة فحكه. ويخرّجه المحقق عند البخاري (406) ومسلم (2/76) والنسائي وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/136). {cite:muwatta-maruf-1997 p.270} {cite:muwatta-maruf-1997 p.271}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Aişe'den naklettiği rivayetle, kıbleye tükürmenin yasaklanması bölümünde şöyle anlatmaktadır: Peygamberimiz kıble duvarında tükürük, mukus veya balgam gördü ve onu kazıdı. Editör, bunu Malik'in sahabelerinin rivayet zincirleriyle Buhari (406), Müslim (2/76), Nesai, Ahmed ve Beyhaki'nin derlemelerine dahil etmiş ve Temhid'e (22/136) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.270} {cite:muwatta-maruf-1997 s.271}"
  id: "Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, dalam surah tentang larangan meludah ke arah kiblat: Nabi melihat ludah, lendir, atau dahak di dinding kiblat dan mengikisnya. Editor memasukkannya dalam kumpulan al-Bukhari (406), Muslim (2/76), al-Nasa'i, Ahmad, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/136). {cite:muwatta-maruf-1997 p.270} {cite:muwatta-maruf-1997 p.271}"
