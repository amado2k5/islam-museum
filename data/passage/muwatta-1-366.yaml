summary:
  ar: "بلاغ في باب ما جاء في صلاة القاعد في النافلة: يروي مالك أنه بلغه أن عروة بن الزبير وسعيد بن المسيب كانا يصليان النافلة وهما محتبيان، أي جالسين ضامّين الساقين إلى البطن. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.200}"
