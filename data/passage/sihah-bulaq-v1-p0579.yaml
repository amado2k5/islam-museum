text: |-
  يعنى يسعيد الهم والسباية من الاصابع التى تلى الابهام (سحب %œ السحاية الغيم والجمع
  سحاب وسحب ومعائب وسعبت ذيلي أسحب جررته فانجزوتسصب عليه أى أدل والسحب
  شدة الاكل والشرب ورجل أسحوب أى أكول شروب ويحبان اسم رجل من وائل كان
  لسنابل غايضرب به المثل فى البيان ،⁦(سخب)⁩ السخاب قلادة تتخذمن سك وغيره ليس فيها
  من الجوه-رشئ والم-ع سخب ⁦(سرب)⁩ السارب الذاهبعلى وجه-ه فى الار
  أنى سريت وحكنت غير سروب * وتقرب الاحلام غيرة ريب
  وسرب انفعل يسرب سروبا اذاتوجه للرعى قال الاخنس التغلى
  وكل أناس قاربواقد قحلهم • ونحن خلعناقد. فهوسارب
  ومنسه قوله تعمالى ومن هو مستخف بالليل وسارب بالنهارأى ظاهر والسرب بالفتح الابل وما
  رعى من المال ومنه قولهم اذهب فلا أنده سر بك أى لا أردا بلن تذهب حيث شاءت أى
  لا حاجسة لى فيك وكانوا فى الجاهلية يقولون فى الطلاق أذهى قلا أندهسر بك قتطلق بم-ذ
  الكامة والسرب أيضا الطريق عن أبى زيد يقال خل له سربه قال ذوالرمة
  خلى لها سرب أولاها وهيجها • من خلفهالاحق الصقلين همهيم
  وفلان آمن فى سريه بالكسر أى فى تفسه وفلان واسع السرب أى رخى البال ويقال أيضا
  مربى سرب من قطاوظباء ووحسّ وأساء أى قطيع وتقول مربى سرية بالضم أى قطعة
  من قطا وخيل وحر وظباء قال ذوارمة يصف ماه
  سوى ما أصاب الذئب منه وسربة أطاقت به من أمهات الجوازل
  ويقال آيضافلان بعيد السرية أى بعيد المذهب قال الشنغرى
  غدونا من الوادى الذى بين مشعل • وبين الحشاهيهات أتسأت.ربى
  والسرب بالتحريك الماء السائل من المزادة ونحوها قال ذوالرمة
  مابال عينيك منها الماء ينسكب * كأنه من كلى غربة سرب
  قال أيو عبيد وبروى يكسر الراء يقال منمسربت المزادة بالكسر تسرب سربافهى
  مرية اذاسالت والسرب أيضاييت فى الارض تقول انسرب الوحشى فى سر بهوانسرب
  النعاب فى حره وتسرب أى دخل وتقول مرّب على الابل أى أرسلها قطعة قطعة و يقال
  سرّب عليه الخيل وهو أن يبعث عليه الخيل سربة بعدسربة وتسريب الحافر أخدّه فى الجفر
  يمنة أو يسرة وتقول أيضاسربت القسربة اذاصيت فيها المالتبتل عيون انحرز
  فتنسد والمسربة بضم الراء الشعر المستدق الذى يأخذمن الصدر الى السرة قال الذهلى
  الآن لماابيض مسربى * وعضضت من نابى على جدم
  والمصرية بالفتح واحدة المسارب وهى المراعى والمراب الذى تراه نصف النهار كانه ماء
  رحب فرس سرحوب أى طويلة على وجه الارض وتوصف به الاناث دون
  الذحكور عب) قال الاصعى فوه يجرى سعاييب وثعايب و و ن يجرى
  منه ماء صاف فيه تمدد قال ابن مقبل
  يعلون
