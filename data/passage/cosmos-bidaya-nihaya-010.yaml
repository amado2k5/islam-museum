text: "والصحيح أنه كان ملكاً من الملوك العادلين وقيل كان نبياً وقيل رسولاً وأغرب من قال ملكاً من الملائكة"
summary:
  ar: "يبين ابن كثير في خبر ذي القرنين أن الصحيح عنده أنه ملك عادل، ويذكر أقوالاً بأنه نبي أو رسول، ويستغرب القول بأنه ملك من الملائكة."
  en: "In his account of Dhu al-Qarnayn, Ibn Kathir holds that the sound view is that he was a just king, notes views that he was a prophet or messenger, and calls the view that he was an angel the strangest."
  es: "En su relato sobre Dhu al-Qarnayn, Ibn Kathir sostiene que la opinión más acertada es que fue un rey justo, menciona las opiniones que lo consideran un profeta o mensajero, y califica de más extraña la opinión de que fue un ángel."
  fr: "Dans son récit sur Dhu al-Qarnayn, Ibn Kathir soutient que l'opinion la plus juste est qu'il était un roi juste, mentionne les opinions selon lesquelles il était un prophète ou un messager, et qualifie d'étrange l'opinion selon laquelle il était un ange."
  ur: "ابن کثیر اپنے ذوالقرنین کے بیان میں کہتے ہیں کہ صوتی نقطہ نظر یہ ہے کہ وہ عادل بادشاہ تھا، اس قول کو نوٹ کرتا ہے کہ وہ نبی یا رسول تھا، اور اس قول کو کہ وہ فرشتہ تھا سب سے عجیب ہے۔"
  tr: "İbn Kathir, Zülkarneyn kıssasında, kendi görüşüne göre doğru olanın onun adil bir kral olduğu olduğunu açıklar ve onun bir peygamber veya elçi olduğuna dair ifadelerden bahseder; onun bir melek olduğuna dair ifadeyi ise garip bulur."
  id: "Ibn Kathir menjelaskan dalam kisah Dzul-Qarnayn bahwa pandangan yang benar, menurutnya, adalah bahwa ia adalah seorang raja yang adil, dan ia menyebutkan pernyataan bahwa ia adalah seorang nabi atau rasul, dan ia menganggap aneh pernyataan bahwa ia adalah seorang malaikat."
