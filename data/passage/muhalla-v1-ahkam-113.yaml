text: "… ففرضّ علىٰ كلِّ مسلمِ استعمالَ كلِّ ذلكَ، لأنه ليسَ بعضُ ذلكَ أولىٰ بالاستعمالِ من بعضٍ ولا حديثَ بأوجبَ منْ حديثِ آخرَ مثلَه، ولا آيةَ أولىٰ بالطاعةِ من آيةِ أُخرىٰ ومثلها، وكلٌّ من عندِ اللّٰه ال، وكلّ سواءٌ في بابٍ وجوبِ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 113، يرد فيه ذكر ما فُرض على الناس، والفرض، وما وجب على كل مسلم، والوجوب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 113, whose wording mentions what was made obligatory on people, the obligatory (fard), a duty laid on every Muslim, obligation (wujub), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 113 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، جو ہر مسلمان پر لازم ہے، وجوب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 113, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), un devoir imposé à chaque musulman, l'obligation (wujub), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 113, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), un deber impuesto a cada musulmán, la obligatoriedad (wujub), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
