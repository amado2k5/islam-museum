label: { ar: "صحيح البخاري 5992 — الأب والأبوة", en: "Sahih al-Bukhari 5992 — the father and fatherhood", ur: "صحیح بخاری 5992 — باپ اور والدیت", es: "Sahih al-Bukhari 5992 — El padre y la paternidad" }
text: "… أَنَّهُ، قَالَ يَا رَسُولَ اللَّهِ أَرَأَيْتَ أُمُورًا كُنْتُ أَتَحَنَّثُ بِهَا فِي الْجَاهِلِيَّةِ مِنْ صِلَةٍ وَعَتَاقَةٍ وَصَدَقَةٍ، هَلْ لِي فِيهَا مِنْ أَجْرٍ. قَالَ حَكِيمٌ قَالَ رَسُولُ اللَّهِ \" أَسْلَمْتَ عَلَى مَا سَلَفَ مِنْ خَيْرٍ \". وَيُقَالُ أَيْضًا عَنْ أَبِي الْيَمَانِ أَتَحَنَّثُ. وَقَالَ مَعْمَرٌ وَصَالِحٌ وَابْنُ الْمُسَافِرِ أَتَحَنَّثُ. وَقَالَ ابْنُ إِسْحَاقَ التَّحَنُّثُ التَّبَرُّرُ، وَتَابَعَهُمْ هِشَامٌ عَنْ أَبِيهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5992، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5992 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5992، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5992 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
