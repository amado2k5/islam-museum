text: "حَدَّثَنَا يَحْيَى بْنُ مَعِينٍ، حَدَّثَنَا أَبُو عُبَيْدَةَ الْحَدَّادُ، حَدَّثَنَا إِسْمَاعِيلُ أَبُو سُلَيْمَانَ الْكَحَّالُ، عَنْ عَبْدِ اللَّهِ بْنِ أَوْسٍ، عَنْ بُرَيْدَةَ، عَنِ النَّبِيِّ قَالَ \" بَشِّرِ الْمَشَّائِينَ فِي الظُّلَمِ إِلَى الْمَسَاجِدِ بِالنُّورِ التَّامِّ يَوْمَ الْقِيَامَةِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 561، يذكر البيمارستان وصناعة الطب. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 561 (Prayer (Kitab Al-Salat)), that mentions the hospital and the medical craft. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 561، جس میں بیمارستان کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
