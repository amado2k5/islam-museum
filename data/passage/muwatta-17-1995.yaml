label: { ar: "الموطأ 1995 — مالك عن أبي الزناد عن الأعرج عن أبي هريرة: لا تلقوا الركبان للبيع، ولا يبع بعضكم على بيع بعض، ولا تناجشوا، ولا يبع حاضر لباد، ولا تصروا الإبل والغنم، فمن ابتاعها بعد ذلك فهو بخير النظرين بعد أن يحلبها", en: "Muwatta 1995" }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: لا تلقوا الركبان للبيع، ولا يبع بعضكم على بيع بعض، ولا تناجشوا، ولا يبع حاضر لباد، ولا تصروا الإبل والغنم، فمن ابتاعها بعد ذلك فهو بخير النظرين، بعد أن يحلبها، إن رضيها أمسكها، وإن سخطها ردها وصاعا من تمر. {cite:muwatta-maruf-1997 p.216} {cite:muwatta-maruf-1997 p.217}"
