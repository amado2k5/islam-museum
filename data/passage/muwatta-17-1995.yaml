label: { ar: "الموطأ 1995 — مالك عن أبي الزناد عن الأعرج عن أبي هريرة: لا تلقوا الركبان للبيع، ولا يبع بعضكم على بيع بعض، ولا تناجشوا، ولا يبع حاضر لباد، ولا تصروا الإبل والغنم، فمن ابتاعها بعد ذلك فهو بخير النظرين بعد أن يحلبها", en: "Muwatta 1995", es: "Muwatta 1995", fr: "Muwatta 1995", ur: "موطا 1995", tr: "El-Muvatta 1995 — Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle: Kervanlara ticaret için engel olmayın, birbirinizle rekabet etmeyin, fiyat manipülasyonu yapmayın, şehirli bir kişi Bedevi adına satış yapmasın ve develeri ve koyunları sağmadan bırakmayın. Bunlardan sonra kim satın alırsa, sağım işleminden sonra iki seçeneği vardır.", id: "Al-Muwatta 1995 — Malik, berdasarkan riwayat Abu al-Zinad, berdasarkan riwayat al-A'raj, berdasarkan riwayat Abu Hurayrah: Jangan mencegat kafilah untuk berdagang, jangan saling menawar harga, jangan melakukan manipulasi harga, penduduk kota tidak boleh berjualan atas nama orang Badui, dan jangan membiarkan unta dan domba tidak diperah. Siapa pun yang membelinya setelah itu memiliki dua pilihan setelah memerah susunya." }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: لا تلقوا الركبان للبيع، ولا يبع بعضكم على بيع بعض، ولا تناجشوا، ولا يبع حاضر لباد، ولا تصروا الإبل والغنم، فمن ابتاعها بعد ذلك فهو بخير النظرين، بعد أن يحلبها، إن رضيها أمسكها، وإن سخطها ردها وصاعا من تمر. {cite:muwatta-maruf-1997 p.216} {cite:muwatta-maruf-1997 p.217}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Kervanların önünden mal almak için geçmeyin, hiçbiriniz başkasının satışının üzerine satmayın, fiyat manipülasyonu yapmayın, şehirli bir kimse bir bedevi adına satış yapmasın, develeri ve koyunları sağmadan bırakmayın. Kim onları sağdıktan sonra satın alırsa, iki seçeneği vardır: Eğer onlardan memnun kalırsa, onları kendine saklar; eğer memnun kalmazsa, bir ölçü hurma ile birlikte geri verir.\" {cite:muwatta-maruf-1997 s.216} {cite:muwatta-maruf-1997 s.217}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Janganlah kalian mencegat kafilah untuk membeli, jangan pula kalian menjual barang dengan harga lebih tinggi dari yang dijual orang lain, jangan pula kalian melakukan manipulasi harga, jangan pula penduduk kota menjual barang atas nama orang Badui, dan jangan pula kalian membiarkan unta dan domba tidak diperah susunya. Barangsiapa membelinya setelah diperah, maka ada dua pilihan: jika ia puas, ia menyimpannya, dan jika ia tidak puas, ia mengembalikannya beserta segenggam kurma.\" {cite:muwatta-maruf-1997 p.216} {cite:muwatta-maruf-1997 p.217}"
