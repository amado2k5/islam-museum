text: |-
  ٤٢.٢,
  ⁦(جد)⁩
  خالد بن زهير الهذلى » ياقوم مالى وأباذؤيب كنت اذا أتوتعمن غيب
  يشم عمفى ويبزتوبى * كاني أربتدبريب
  أى يجذبه اليه
  وابتززت الشيء أى استلبته واليز من التباب أمتعة البزاز والبزأيضا السلاح والبزة بالكسم
  الهيئة والبرة أيضا السلاح ⁦(بغز)⁩ البغز النشاط فى الابل خاصسة قال ابن مقبل
  واستحمل السيرمن عرمضا أبدا * تخال باغزها بالليل مجنونا
  والباغزية أيضاجنس من التياب ⁦(بلز)⁩ امرأة بلزعلى فعل بكسر الفاء والعين أى
  ضضمة قال ثعلب لم يأت من الصفات على فعل الاحرفات امرأة بلزواتان إيد ⁦(جهز)⁩
  بهزه أى دفعه بعنف وغحاه قال رؤية
  دعن فقديرع للاضز * مكر حجاجى رأسه وبهزى
  وبهز بن -كيم بن معاوية بن حيدة القشيرى صحب حده الذيّ صلى اللّٰه عليه وسلم
  ( بوز البازاغة فى البازى قال الشاعر
  كأنه باز دجن فوق مرقبة • جلى القطا وسط قاع سملق سلق
  والجمع أبو أزوبيزان وجمع البازى بزاة.
  صل التاء رز ترز اللحسم صلب وكل قوى صاب تارز واترزت المرأة هينها
  وأثرز العدولحم الفرس اذا أيبسه قال امر والقيس.
  . بعجلزة قد أرزالجرى +ها • كيت كأنم اهراوة منوال
  (تيز التياز الرجل التصير الملزز انلحلق قال القطامى
  اذا!لتيازد والعضلات قلنا • الياث اليك ضاق بها ذراعا
  وتاز السهم فى الرمية أى اهتزفيها
  صل الجيم ⁦( أز )⁩ جئزت بالماء جأزاغصت به والاسم الجأز بالتسكين
  قال رؤية وكرز يمنى بطين الكرز ، يسقى العدى غيظاطوبل الجأز
  بطاويل الغصص لانه ثايت فى حلوقهم يز الاصعى الابز الكسر البخيل وأنش!
  وكرزيشو بطين الكرز • أجرد أوجعد اليدين جبز
  والجبيز انلخبز اليابس وقال أبو عمرو يقال أخرج خبزه جبيزا أى يايسا رز). أبوزيد
  أرض برزلانيات بهاك أنه انقطع عنها أوانقطع عنها المعار وفيها أربع لغات برز
  وجرزمشل عسروعسر وجر زوجرزمثل نم رونهر وجمع الجر زجرزة مثل حروجرة وجمع
  الجرزأ جراز مثل سبب وأسباب تقول منه أجرزالقوم كما تقول أيبسوا وأرض مجروزة
  (أكل نباتها والجرز السنة الجدية قال الراجز قدجرفتهنَ السنون الابرازِ وقواهم
  انه لذوبرزأيضا بالتهريك أى غلظ والجرز ه ود من حديد وثلاثة جرزة مشل بحروحرة قال
  بعقوب ولا تقل أجرزة قال الرابر والصقع من خابطة وجرز ويرزميجرزهجرزاقطلعه
  وسيف جراز بالضم أى قطاع وناقة جراز أى أكول والجروز الذى اذا أ كل لم يتركْ على المائدة
  شيما وكذلك المرأة وناقة بروزأيضا وقواه-م ان ترضى شائقة الابجرزة أى امها من شدّة
