text: "… المُجَيّب والمُقَنْطَرات، عِلْمَ عَمَل رُبْع الدّارَةِ، عِلْمَ آلات السّاعة. وجعلَ من فُروع عِلْمَ العدد: عِلْمَ حساب التَّحْت والميل، عِلْمَ الجَبْر والمُقابلة، عِلْمَ حِسَاب الخَطَأين، عِلْمَ حِسَاب الدور والوصايا، عِلْمَ حساب الدِّرْهم والدِّينار، عِلْمَ حساب الفَرَائض، عِلْمَ حساب الهَوَاء، عِلْمَ حسابِ …"
