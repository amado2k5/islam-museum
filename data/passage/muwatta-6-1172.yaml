summary:
  ar: "يقول مالك إنه لا يجوز لأحد أن يحلق رأسه حتى ينحر هديه، ولا ينبغي لأحد أن ينحر قبل الفجر يوم النحر. وإنما يكون العمل كله يوم النحر، وهو الذبح ولبس الثياب وإلقاء التفث والحلاق، ولا يكون شيء من ذلك قبل يوم النحر. {cite:muwatta-maruf-1997 p.529}"
