label: { ar: "الموطأ 1172 — مالك: لا يجوز لأحد أن يحلق رأسه حتى ينحر هديه، ولا ينحر قبل الفجر يوم النحر، وإنما يكون العمل كله يوم النحر", en: "Muwatta 1172", es: "Muwatta 1172", fr: "Muwatta 1172", ur: "موطا 1172", tr: "El-Muvatta 1172 — Malik: Kurbanlık hayvanını kesmeden önce kimsenin başını tıraş etmesi caiz değildir ve kurban günü şafak sökmeden önce kurbanı kesmemelidir. Aksine, bütün işler kurban günü yapılmalıdır.", id: "Al-Muwatta 1172 — Malik: Tidak diperbolehkan bagi siapa pun untuk mencukur kepalanya sampai ia menyembelih hewan kurbannya, dan ia tidak boleh menyembelihnya sebelum fajar pada hari kurban. Sebaliknya, semua pekerjaan harus dilakukan pada hari kurban." }
summary:
  ar: "يقول مالك إنه لا يجوز لأحد أن يحلق رأسه حتى ينحر هديه، ولا ينبغي لأحد أن ينحر قبل الفجر يوم النحر. وإنما يكون العمل كله يوم النحر، وهو الذبح ولبس الثياب وإلقاء التفث والحلاق، ولا يكون شيء من ذلك قبل يوم النحر. {cite:muwatta-maruf-1997 p.529}"
  tr: "Malik, kurbanlık hayvan kesilmeden kimsenin başını tıraş etmesine izin verilmediğini ve Kurban Günü'nde şafak sökmeden önce kimsenin kurban kesmemesi gerektiğini söyler. Aksine, tüm ritüeller, kurban kesme, kurbanlık giysileri giydirme, kiri temizleme ve tıraş etme de dahil olmak üzere, Kurban Günü'nde yapılır. Bunların hiçbiri Kurban Günü'nden önce yapılmamalıdır. {cite:muwatta-maruf-1997 s.529}"
  id: "Malik mengatakan bahwa tidak seorang pun diperbolehkan mencukur kepalanya sampai mereka menyembelih hewan kurban mereka, dan tidak seorang pun boleh menyembelih sebelum fajar pada Hari Raya Kurban. Sebaliknya, semua ritual dilakukan pada Hari Raya Kurban, termasuk penyembelihan, mengenakan pakaian kurban, membersihkan kotoran, dan mencukur. Tidak satu pun dari hal-hal ini boleh dilakukan sebelum Hari Raya Kurban. {cite:muwatta-maruf-1997 p.529}"
