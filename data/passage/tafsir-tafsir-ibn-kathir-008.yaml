text: "دثنا أبو أسامة، عن مجالد، أنبأنا عامر، قال: انطلق عمر بن الخطاب إلى اليهود، فقال: أنشدكم بالذي أنزل التوراة على موسى: هل تجدون محمدا في كتبكم؟ قالوا: نعم. قال: فما يمنعكم أن تتبعوه؟ قالوا: إن الله لم يبعث نبيا رسولا"
