label: { ar: "جامع الترمذي 3031 — جمع القرآن والمصاحف", en: "Jami' al-Tirmidhi 3031 — the collection of the Qur'an and the codices", ur: "جامع ترمذی 3031 — جمعِ قرآن اور مصاحف", es: "Jami' al-Tirmidhi 3031 — la colección del Corán y los códices", fr: "Jami' al-Tirmidhi 3031 — le recueil du Coran et des codex", tr: "Cami' el-Tirmizi 3031 — Kur'an ve Kur'an Reçetelerinin Derlenmesi", id: "Jami' al-Tirmidhi 3031 — Kumpulan Al-Qur'an dan Salinan Al-Qur'an" }
text: "… رَسُولَ اللَّهِ مَا تَأْمُرُنِي إِنِّي ضَرِيرُ الْبَصَرِ فَأَنْزَلَ اللَّهُ تَعَالَى هَذِهِ الآيَةَ : ⁦( غَيْرُ أُولِي الضَّرَرِ )⁩ الآيَةَ. فَقَالَ النَّبِيُّ \" ائْتُونِي بِالْكَتِفِ وَالدَّوَاةِ أَوِ اللَّوْحِ وَالدَّوَاةِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَيُقَالُ عَمْرُو ابْنُ أُمِّ مَكْتُومٍ وَيُقَالُ عَبْدُ اللَّهِ ابْنُ أُمِّ مَكْتُومٍ وَهُوَ عَبْدُ اللَّهِ بْنُ زَائِدَةَ وَأُمُّ مَكْتُومٍ أُمُّهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3031، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 3031 (Chapters on Tafsir), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 3031، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3031 (Capítulos sobre Tafsir), menciona la colección del Corán y los códices. El catálogo del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3031 (Chapitres sur le Tafsir), mentionne la collection du Coran et des codex. Le catalogue du musée, consacré à la lecture et à l'écriture du Coran, répertorie ces documents avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de ce sujet."
  tr: "Cami' el-Tirmizi'de 3031 numaralı hadis, Kur'an'ın ve el yazmalarının derlenmesinden bahsetmektedir. Bu hadis, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3031, menyebutkan penyusunan Al-Quran dan manuskrip-manuskripnya. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
