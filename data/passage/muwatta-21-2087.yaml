label: { ar: "الموطأ 2087 — مالك: فيمن يورث الأرض نفرا من ولده، ثم يولد لأحد النفر، ثم يهلك الأب، فيبيع أحد ولد الميت حقه، فإن أخا البائع أحق بشفعته من عمومته شركاء أبيه، وهذا الأمر عندنا", en: "Muwatta 2087", es: "Muwatta 2087", fr: "Muwatta 2087", ur: "موطا 2087", tr: "El-Muvatta 2087 — Malik: Bir kimse, bir grup çocuğuna arazi miras bırakırsa, bu çocuklardan birinin çocuğu olur, sonra baba ölür ve ölenin çocuklarından biri payını satarsa, satanın erkek kardeşinin, babasıyla ortak olan amcalarından daha büyük bir öncelik hakkı vardır. Bizim görüşümüze göre hüküm budur.", id: "Al-Muwatta 2087 — Malik: Mengenai seseorang yang mewariskan tanah kepada sekelompok anaknya, kemudian salah satu anak tersebut mempunyai anak, lalu sang ayah meninggal dunia, dan salah satu anak almarhum menjual bagiannya, maka saudara laki-laki penjual tersebut mempunyai hak prioritas yang lebih besar daripada paman-paman dari pihak ayah yang merupakan mitra ayahnya. Inilah hukum menurut kami." }
summary:
  ar: "قال مالك في الرجل يورث الأرض نفرا من ولده، ثم يولد لأحد النفر، ثم يهلك الأب، فيبيع أحد ولد الميت حقه في تلك الأرض، فإن أخا البائع أحق بشفعته من عمومته، شركاء أبيه. قال مالك: وهذا الأمر عندنا. {cite:muwatta-maruf-1997 p.254}"
  tr: "Malik, bir adamın bir grup oğluna arazi miras bırakması, ardından oğullarından birinin çocuk sahibi olması, babanın ölmesi ve ölenin oğullarından birinin o arazideki payını satması durumunda, satıcının erkek kardeşinin, babasıyla ortak olan amcalarından daha güçlü bir öncelik hakkına sahip olduğunu söylemiştir. Malik şöyle demiştir: Bu, bizim düşünce ekolümüze göre hükümdür. {cite:muwatta-maruf-1997 s.254}"
  id: "Malik berkata mengenai seorang pria yang mewariskan tanah kepada sekelompok putranya, kemudian salah satu putranya memiliki anak, lalu sang ayah meninggal, dan salah satu putra almarhum menjual bagiannya dari tanah tersebut, maka saudara laki-laki penjual memiliki hak prioritas yang lebih kuat daripada paman-paman dari pihak ayah yang merupakan mitra ayahnya. Malik berkata: Ini adalah putusan menurut mazhab kami. {cite:muwatta-maruf-1997 p.254}"
