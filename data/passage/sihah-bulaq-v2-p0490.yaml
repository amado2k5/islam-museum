text: |-
  •⁦(مفو)⁩
  ٩٧
  يقول اذا ابتسات حوافره م-ن عرق أعالسه جرى وهو مترول لايضرب ولا يزجر ويصدقك
  فيما يعدك من البلوغ الى الغاية والصدقة ما تصدقت به على الفقراء والصداق والصداف
  مهر المرأة وكذلك الصدقة ومنه قوله تعالى وآنوا النسائصدقا تهن غلة والصدقة منله
  بالضم ونسكين الدال وقد أصدقت المرأة اذا-عيت لهاصداقا* قال يمقوب هى الصندوق
  بالصادوالجمع السناديق ⁦(لصعق)⁩ أبوزيد الصاعقة نارتسقط من السماه فى رعدشديد
  بقال صعقتهم السماء اذا ألقت عليهم الصاعقة والصاعقة أيضاصيحة العذاب ويقال صعق
  الرجل صعقة ويصعاها أى غشى عليه وأصعقه غيره قال ابن مقبل
  زى النعرات الزرق تحت لبانه • أحادومى أصعقتها صواهله
  وقوله تعالى فصعق من فى السهوات ومن فى الارض أى مات وحارصعق الصوت أى شديده
  والصعق اسم رجل قال الشاءر
  أبي الذى أختب رج-ل ابن السعق * اذ كانت الخيل كملياء العنق
  •صعفق يومعفوق خول بالمامة قال التجاج
  من آل صعفوق واتباع أخر • من طاعمين لا يالون الغمر
  وهو اسم أعجمى لا يتصرف للعجسة والمعرفة ولم يجى على فعلول شئ غسيره وأمّا الخرنوب فان
  الفصحاه يضمونه أويشددونه مع حذف النون وانمايفته العامة قال الاصمعى" الصعافقة
  قوم يحضرون السوق للتجارة ولانة-دمعهم وليست لهم رؤس أموال فاذا اشترى التجار
  شيأدخلوا معهم فيه الواحدمنهم صعفقىّ وقال غيره صعفوق وجعه صعافقة وصعافيق
  قال أبو النجم
  يوم قدرنا والعزيز من قدر • وآبت الحيل وقضين الوطر
  *من الصعافيق وأدركنا المثر*
  أرادبا اصعافيق أنهم ضعفا ليت لهم شجاعة ولاسلاح وقوّة=لى قتالنا صفق)
  الصفق الضرب الذى يسمع له صوت وكذلك التصفيق يقال صفقته الريح وصغقه
  والتصفيق باليد التصويتبها وصفقت له بالبيع والبيعة صفقا أى ضر بت يدى على يده
  ويقال ربحت صفقتك للشراه وصفقة رابحة وصفقة خاسرة وتصافق القوم عند البيعة
  والصفق الردّوالصرف وقد صفقته فانصفق وصفق عينه أى ردّها وغمضها وصفقت
  الباب رددته قال الشاعز
  متكماتصفق أبوابه * يهى عليه العبد بالكوب
  وكذلك أصفقت الباب وأصفقوا على كذا أى أطبقواعله قال الشاءر
  أشى أخاضارورة أصفق العدا • عله وقات فى الصديق أواصره
  وصفقت المود اذاحركت أوتاره فاصطفق قال ابن الطئرية
  ويوم كظل" الرمح قصرطوله • دم الزق عنا واصطفاق المزاهر
  ا والريح تصفق الاشجار قتصطفق أى تضطرب وأصفقت يده بكذا أى صادقته ووافقته
  قال النمرين قواب
  ٢٥
  محاح
  قوليترى النعسرات الزرق رواه
  فى مادة نعر الخضربدل الزرق
  وعبارته النعرة مثال الهمسزة
  ذباب ضخم أزرق العيز أخضرله
  ابرة فى طرف ذنيه يلسع بهادوات
  الحافر خاصة قال ابن مقبل
  وساف البيت اه كتبه المصمح
  قوله من طاعمين لا يدالون الغمر
  فى بعض النسخ طامعين لا ينالون
  اه مدتيهة
