text: "… ربه. فقال له ملك الموت: يا خليل اللّٰه على أَيِّ حال تحب أَن أَقبضك؟ قال: تقبضني وأَنا ساجد. فقبضه وهو ساجد. ودفن إبراهيم علاه بالشام. وعاش إِسماعيل بعد أَبيه ما عاش وتوفي بمكة فدفن بالحَجُون مما يلي بابَ الكعبة، وهناك …"
