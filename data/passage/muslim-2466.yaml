label: { ar: "مسلم 2466 — اهتز عرش الرحمن لموت سعد بن معاذ", en: "Muslim 2466 — The Throne shook at Sa'd ibn Mu'adh's death", es: "Muslim 2466 — El Trono se estremeció con la muerte de Sa'd ibn Mu'adh.", fr: "Muslim 2466 — Le Trône trembla à la mort de Sa'd ibn Mu'adh", ur: "مسلم 2466 - سعد بن معاذ کی وفات پر عرش لرزا۔", tr: "Müslim 2466 — Rahman olan Allah'ın tahtı, Sa'd ibn Mu'adh'ın vefatıyla sarsıldı.", id: "Muslim 2466 — Singgasana Yang Maha Penyayang berguncang karena kematian Sa'd bin Mu'adh" }
text: "قال رسول الله وجنازة سعد بن معاذ بين أيديهم: «اهتز لها عرش الرحمن»؛ وفي رواية جابر: «اهتز عرش الرحمن لموت سعد بن معاذ»"
summary:
  ar: "رواية جابر بن عبد الله في باب فضائل سعد بن معاذ من صحيح مسلم؛ اهتزاز العرش لجنازة سيد الأوس — من أعظم نصوص مناقبه، متفق عليه مع البخاري."
  tr: "Sahih Müslim'de Saad bin Muadh'ın faziletleri bölümünde Cabir bin Abdullah'ın rivayeti: Evs üstadının cenazesi için tahtın sarsılması - onun faziletlerine dair en büyük metinlerden biri olup, Buhari ile ittifak halindedir."
  id: "Riwayat Jabir bin Abdullah dalam bab tentang keutamaan Saad bin Muadz dalam Sahih Muslim: Guncangan Singgasana untuk pemakaman pemimpin Aws — salah satu teks terbesar tentang keutamaannya, disepakati dengan Al-Bukhari."
