label: { ar: "مسلم 2466 — اهتز عرش الرحمن لموت سعد بن معاذ", en: "Muslim 2466 — The Throne shook at Sa'd ibn Mu'adh's death" }
text: "قال رسول الله وجنازة سعد بن معاذ بين أيديهم: «اهتز لها عرش الرحمن»؛ وفي رواية جابر: «اهتز عرش الرحمن لموت سعد بن معاذ»"
summary:
  ar: "رواية جابر بن عبد الله في باب فضائل سعد بن معاذ من صحيح مسلم؛ اهتزاز العرش لجنازة سيد الأوس — من أعظم نصوص مناقبه، متفق عليه مع البخاري."
