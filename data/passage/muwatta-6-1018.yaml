label: { ar: "الموطأ 1018 — مالك في المحرم يُصاد من أجله صيد فيُصنع له، فيأكل منه وهو يعلم أنه من أجله صيد: فعليه جزاء ذلك الصيد كله", en: "Muwatta 1018", es: "Muwatta 1018", fr: "Muwatta 1018", ur: "موطا 1018", tr: "El-Muvatta 1018 — Malik, ihramlı bir hacının kendi iyiliği için avladığı avı hazırlayıp, kendisi için avlandığını bilerek yemesi durumunda, o avın bedelini ödemesi gerektiğini söylemiştir.", id: "Al-Muwatta 1018 — Malik berkata tentang seorang jamaah haji yang sedang ihram berburu hewan buruan untuk dirinya sendiri dan memasaknya untuk dirinya sendiri, lalu memakannya padahal ia tahu bahwa hewan itu diburu untuk dirinya sendiri: maka ia wajib membayar denda untuk seluruh hewan buruan itu." }
summary:
  ar: "قول لمالك في المحرم يُصاد من أجله صيد، فيُصنع له ذلك الصيد فيأكل منه وهو يعلم أنه من أجله صيد: فإن عليه جزاء ذلك الصيد كله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1149). {cite:muwatta-maruf-1997 p.476}"
  tr: "Malik, ihramlı bir hacının kendi adına avladığı avdan yediğini ve avın kendisi için avlandığını bildiğini söyleyerek, o avın tamamının cezasına çarptırılacağını belirtmiştir. Araştırmacı, bunu Ebu Mus'ab'ın (1149) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.476}"
  id: "Malik berkata mengenai seorang jamaah haji yang sedang ihram berburu hewan buruan untuk dirinya sendiri, lalu memakan daging buruan tersebut padahal ia tahu hewan itu diburu untuknya: maka ia wajib membayar denda atas seluruh daging buruan tersebut. Peneliti menyebutkan bahwa Abu Mus'ab (1149) meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.476}"
