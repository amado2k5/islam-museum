text: "… مناف، وعزّة مولاه الأسود بن المطلب، ومولاة لأمية بن خلف، فجعلن يتغنين في كل منهل. وخرجوا بالجيش يتقاذفون بالحراب بطرا ورياء للناس، كما قال تبارك وتعالى. ونجا أبو سفيان وأصحابه، فبعث إلى قريش من الجحفة يعلمهم سلامته بما معه، وأنه …"
