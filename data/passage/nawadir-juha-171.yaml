text: "… الحمدُ للَّه سرق له ذات يوم ألفُ غرش، وذهبَ إلى الجامع. وظلَّ يتضرَّعُ، ويدعو اللَّه أن يُعيد دراهمه إليه حتى أصبح الصباح. واتفق أن أحد تجار البلدة كان مسافراً في البحر فهبّت الأنواء والعواصف فنذر للشيخ ألف غرش إذا سلم …"
summary:
  ar: "سُرقت من جحا ألف قرش فصلّى الليل كله في المسجد؛ ونذر تاجر في البحر له ألف قرش بعد عاصفة، فجاء بها؛ فقال جحا إنه لو أقرض المال لما ردّه المقترض، وإن حكمة الله خافية على العقل البشري. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  en: "A thousand piastres are stolen from Juha; he prays all night at the mosque; a merchant at sea vows him a thousand piastres after a storm; the merchant brings it; Juha says that if he had lent the money, the borrower would not have returned it, and God's wisdom is hidden from human reason. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  ur: "جحا کے ہزار قرش چوری ہو گئے تو اس نے ساری رات مسجد میں نماز پڑھی؛ سمندر میں ایک تاجر نے طوفان کے بعد اس کے لیے ہزار قرش کی نذر مانی اور رقم لے آیا؛ جحا نے کہا کہ اگر میں یہ رقم قرض دیتا تو لینے والا واپس نہ کرتا، اور اللہ کی حکمت انسانی عقل سے پوشیدہ ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  fr: "Mille piastres sont volées à Juha; il prie toute la nuit à la mosquée; un marchand en mer lui voue mille piastres après une tempête et les apporte; Juha dit que s'il avait prêté cet argent, l'emprunteur ne l'aurait pas rendu, et que la sagesse de Dieu est cachée à la raison humaine. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  es: "A Juha le roban mil piastras; reza toda la noche en la mezquita; un mercader en el mar le promete mil piastras tras una tormenta y se las trae; Juha dice que, si hubiera prestado ese dinero, el prestatario no lo habría devuelto, y que la sabiduría de Dios está oculta a la razón humana. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  tr: "Cuha'nın bin kuruşu çalınmıştı, bu yüzden bütün gece camide dua etti. Denizde bir tüccar fırtınadan sonra ona bin kuruş vereceğine söz verdi ve tüccar döndüğünde Cuha, eğer parayı ödünç vermiş olsaydı, borçlunun geri ödemeyeceğini ve Tanrı'nın hikmetinin insan anlayışından gizli olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 77}"
  id: "Juha kehilangan seribu piaster karena dicuri, sehingga ia berdoa sepanjang malam di masjid. Seorang pedagang di laut berjanji akan memberinya seribu piaster setelah badai, dan ketika ia kembali, Juha berkata bahwa jika ia meminjamkan uang itu, peminjamnya tidak akan mengembalikannya, dan bahwa hikmah Tuhan tersembunyi dari pemahaman manusia. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
