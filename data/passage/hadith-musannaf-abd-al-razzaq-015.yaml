text: "يشرط ولده في كتابته باب كتابته وولده فمات منهم أحد أو أعتق باب كتابته ولا ولد له ، وميراث المكاتب . باب ميراث ولد المكاتب وله ولد أحرار باب موته وقد أعتق منه شقصا باب جريرة المكاتب وجناية أم الولد"
summary:
