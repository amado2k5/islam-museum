label: { ar: "الموطأ 2106 — مالك عن ربيعة بن أبي عبد الرحمن: قدم على عمر رجل من أهل العراق يشكو أن شهادات الزور ظهرت بأرضهم، فقال عمر: والله لا يؤسر رجل في الإسلام بغير العدول", en: "Muwatta 2106", es: "Muwatta 2106", fr: "Muwatta 2106", ur: "موطا 2106", tr: "El-Muvatta 2106 — Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle: Irak'tan bir adam Ömer'e gelerek, ülkelerinde yalan şahitliklerin yaygınlaştığından şikayet etti. Ömer şöyle dedi: Allah'a yemin ederim ki, İslam'da hiçbir kimse haklı şahitlerin tanıklığı olmadan hapse atılmaz.", id: "Al-Muwatta 2106 — Malik berdasarkan riwayat Rabi’ah ibn Abi Abd al-Rahman: Seorang pria dari Irak datang kepada Umar mengeluh bahwa kesaksian palsu telah merajalela di negeri mereka. Umar berkata: Demi Allah, tidak seorang pun dalam Islam akan dipenjara tanpa kesaksian saksi yang adil." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أنه قال: قدم على عمر بن الخطاب رجل من أهل العراق، فقال: لقد جئتك لأمر ماله رأس ولا ذنب. فقال عمر: ما هو؟ قال: شهادات الزور، ظهرت بأرضنا. فقال عمر: أوقد كان ذلك؟ قال: نعم. فقال عمر: والله لا يؤسر رجل في الإسلام بغير العدول. {cite:muwatta-maruf-1997 p.261} {cite:muwatta-maruf-1997 p.262}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle şöyle der: Irak'tan bir adam Ömer ibn al-Khattab'a gelip, \"Sana başlangıcı ve sonu olmayan bir mesele hakkında geldim\" dedi. Ömer, \"Nedir o?\" diye sordu. Adam, \"Ülkemizde yalan şahitlikler yaygınlaştı\" diye cevap verdi. Ömer, \"Bu gerçekten oldu mu?\" diye sordu. Adam, \"Evet\" dedi. Ömer, \"Allah'a yemin ederim ki, İslam'da hiçbir kimse haklı şahitlerin tanıklığı olmadan hapse atılmaz\" dedi. {cite:muwatta-maruf-1997 s.261} {cite:muwatta-maruf-1997 s.262}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa beliau berkata: Seorang pria dari Irak datang kepada Umar ibn al-Khattab dan berkata, \"Saya datang kepada Anda mengenai suatu perkara yang tidak ada awal dan tidak ada akhirnya.\" Umar bertanya, \"Apa itu?\" Ia menjawab, \"Kesaksian palsu telah merajalela di negeri kami.\" Umar bertanya, \"Apakah ini benar-benar terjadi?\" Ia menjawab, \"Ya.\" Umar berkata, \"Demi Allah, tidak seorang pun akan dipenjara dalam Islam tanpa kesaksian dari saksi-saksi yang adil.\" {cite:muwatta-maruf-1997 p.261} {cite:muwatta-maruf-1997 p.262}"
