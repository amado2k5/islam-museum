label: { ar: "الموطأ 2106 — مالك عن ربيعة بن أبي عبد الرحمن: قدم على عمر رجل من أهل العراق يشكو أن شهادات الزور ظهرت بأرضهم، فقال عمر: والله لا يؤسر رجل في الإسلام بغير العدول", en: "Muwatta 2106" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أنه قال: قدم على عمر بن الخطاب رجل من أهل العراق، فقال: لقد جئتك لأمر ماله رأس ولا ذنب. فقال عمر: ما هو؟ قال: شهادات الزور، ظهرت بأرضنا. فقال عمر: أوقد كان ذلك؟ قال: نعم. فقال عمر: والله لا يؤسر رجل في الإسلام بغير العدول. {cite:muwatta-maruf-1997 p.261} {cite:muwatta-maruf-1997 p.262}"
