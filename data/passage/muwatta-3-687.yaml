summary:
  ar: "يرويه مالك عن يزيد بن خصيفة، أنه سأل سليمان بن يسار عن رجل له مال وعليه دين مثله، أعليه زكاة؟ فقال: لا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (324) ويحيى بن بكير عند أبي عبيد في الأموال (1251) والبيهقي. {cite:muwatta-maruf-1997 p.344}"
