label: { ar: "الموطأ 687 — سليمان بن يسار: من له مال وعليه دين مثله لا زكاة عليه", en: "Muwatta 687", es: "Muwatta 687", fr: "Muwatta 687", ur: "موطا 687", tr: "El-Muvatta 687 — Süleyman ibn Yasar: Kimin malı olup da malına eşit bir borcu varsa, ondan zekât istenmez.", id: "Al-Muwatta 687 — Sulayman ibn Yasar: Barangsiapa mempunyai harta dan memiliki hutang yang sama besarnya dengan hartanya, maka tidak ada kewajiban zakat baginya." }
summary:
  ar: "يرويه مالك عن يزيد بن خصيفة، أنه سأل سليمان بن يسار عن رجل له مال وعليه دين مثله، أعليه زكاة؟ فقال: لا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (324) ويحيى بن بكير عند أبي عبيد في الأموال (1251) والبيهقي. {cite:muwatta-maruf-1997 p.344}"
  tr: "Malik, Yezid ibn Husayfah'tan rivayet ederek, Süleyman ibn Yasar'a, hem malı hem de borcu eşit değerde olan bir adam hakkında, zekât ödemekle yükümlü olup olmadığını sormuştur. Süleyman ibn Yasar, \"Hayır\" diye cevap vermiştir. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd, Muhammed ibn el-Hasan el-Şeybani (324) ve Yahya ibn Bukayr tarafından rivayet edildiğini, Ebu Ubeyd'in el-Amwal (1251) ve el-Beyhaki'de kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.344}"
  id: "Malik meriwayatkan hadits ini dari Yazid bin Khusayfah, yang bertanya kepada Sulayman bin Yasar tentang seorang pria yang memiliki harta dan hutang dengan nilai yang sama: apakah dia wajib membayar zakat? Dia menjawab: Tidak. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, Muhammad bin al-Hasan al-Shaybani (324), dan Yahya bin Bukayr, sebagaimana dicatat oleh Abu Ubayd dalam al-Amwal (1251) dan al-Bayhaqi. {cite:muwatta-maruf-1997 p.344}"
