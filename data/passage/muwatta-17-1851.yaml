label: { ar: "الموطأ 1851 — مالك: بلغه عن القاسم بن محمد أن عمر بن الخطاب قال الدينار بالدينار، والدرهم بالدرهم، والصاع بالصاع، ولا يباع كالئ بناجز", en: "Muwatta 1851", es: "Muwatta 1851", fr: "Muwatta 1851", ur: "موطا 1851", tr: "El-Muvatta 1851 — Malik: Ona, El-Kâsim bin Muhammed'den rivayet edildiğine göre Ömer bin El-Hattab şöyle demiştir: Bir dinar bir dinara, bir dirhem bir dirheme, bir sa' bir sa'ya karşılık gelir ve borcunu ödemiş olan bir borçlu, borcunu ödemiş olan bir borçluya satılamaz.", id: "Al-Muwatta 1851 — Malik: Diriwayatkan kepadanya dari Al-Qasim bin Muhammad bahwa Umar bin Al-Khattab berkata: Satu dinar untuk satu dinar, satu dirham untuk satu dirham, dan satu sa' untuk satu sa', dan debitur tidak dapat dijual untuk debitur yang telah membayar." }
summary:
  ar: "قال مالك: بلغه عن القاسم بن محمد أنه قال: قال عمر بن الخطاب: الدينار بالدينار، والدرهم بالدرهم، والصاع بالصاع، ولا يباع كالئ بناجز. {cite:muwatta-maruf-1997 p.160}"
  tr: "Malik şöyle dedi: El-Kasım ibn Muhammed'den rivayet edildiğine göre, Ömer ibn el-Hattab şöyle demiştir: Bir dinar bir dinara, bir dirhem bir dirheme, bir sa' bir sa'ya karşılık gelir ve vadesi gelmiş bir borç, hemen ödenmesi gereken bir borçla takas edilemez. {cite:muwatta-maruf-1997 s.160}"
  id: "Malik berkata: Diriwayatkan kepadanya dari al-Qasim ibn Muhammad bahwa dia berkata: Umar ibn al-Khattab berkata: Satu dinar untuk satu dinar, satu dirham untuk satu dirham, satu sa’ untuk satu sa’, dan utang tidak dapat dijual untuk utang yang jatuh tempo segera. {cite:muwatta-maruf-1997 p.160}"
