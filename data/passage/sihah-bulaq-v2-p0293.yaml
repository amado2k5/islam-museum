text: |-
  علفتهاعرضا وأقتل قومها
  ٢٩٤
  •⁦(فضل الزاى)⁩.
  وأزأمته على الامرأى أسكرهته مثل أذ أمته وزأم لى فلان زأمة أى طرح كملة لا أدرى
  أحقهى أم باطل ويقال ما يعصيه زأمة أى كلمة قال الفراء زأم الرجل اذامات وموت زآم
  ⁦( زجم)⁩ الزجمة بالفتح بمنزلة النبأة يقال ما تكام يزيمة أى بنبسة وسكت فازجم محرف أى
  مانيس ويقال ما يعصيه زجحة أى شيأ والزجوم القوس ليست بشديدة الارنات حم).
  الزحسة الرحام يقال زحته وازحته وازدحم القوم على كذاوتزاحواعليه ⁦( زرم)⁩
  زرم البول بالكسراذااتقطع وكذلك كل شيء ولى وأزرمه غيره وفى الحديث لا تزرموا ابنى أى
  لا تقطعوا عليه بوله وزرم السكاب اذا زرم ذوبطنه فى جاعرته والزرم المضيق عليه ويقال
  للبخيل زرم وزرّ ممغيره قال ساعدة بن جؤية.
  حب الضريك تلاد المال زر مه * فقرولم يتخذفى الناس ملتحبيا
  وزرمت به أمه اذا ولدته أبو عبيد المزرتم المتقبض وقدازر أم ازرعماما درم)
  الازدرام الابتلاع ⁦(زردم)⁩ الزردمة موضع الازدرام والابتلاع ويقال زرد مه اى
  عصر حلقه (زعم زعم زها وزعماوزعما أى قال وزعمت به أزعم زعماوزعامة أى
  كفلت والزعيم الكفيل وفى الحديث الزعيم غارم والزعامة السيادة وزعيم القوم
  سيدهم وقول لبيد• والزعامة للغلام * يريد السلاح لانهم كانوا اذا اقتسموا الميران دفه وا
  السلاح الى الابن دون الابنة والزعم بالتحريك الطمع وقد زعم بالكسرأى طمع يزعم زعما
  وأزعمته أنا قال عنترة زعمالعمر أبيك ليس بمزعم* أى ليس بطمع وقال ابن السكيت
  ويقال للامر الذى لا يوثق به مزعم أى يزعم هذا أنه كذا ويزعم هذا أنه كذا وفى قول
  فلان مزاعم والتزعم التسكذب وناقة زعوم وشاة زعوم اذا كان يشك فيها أبها طرق
  أم لافتغبط بالايدى وقال زجرت فيهاعيهلارسوما * مخلصة الانقاء أوزعوما
  والزهوم العيّ غم التزغم التفضب مع كلام قال أبو ذؤيب يصف رجلاياء
  الى محكة على ناقة بين نوق
  تجاءوجاءت يتهنّ وانه • ليمسح ذفراهاتزغم كالفعل
  قال الاصععى تزعه اصباحها وحدتها وانما يمسح ذفراها ليكنها وتزغم الفصيل حنّ
  حنينا خقيفا قال لبيد
  فأبلغ بى بكراذا مالقيتها • على خير ما يلقى به من تزعما
  ويروى بالراء ( زقم الزقوم اسم طعام له-م فيه تمروزبدوالزقم أكله قال ابن هباس
  رضى اللّٰه عنهه المانزل قوله تعالى ان شهرت الزقوم طعام الاثيم قال أبو جهل التمر بالزبد
  نتزة، فأنزل اللّٰه تعمالى انم اشجرة تخرج فى أصل الجيم طلعها كأنه رؤس الشياطين وأزقته
  الشى أى أبلعته اياه فازدقه أى ابتلعه والتزقم التلقم قال ابن دريديقان تزقم فلان اللبن
  اذا أفرط فى شريه وقال أيضا الزلوم باللام الحلقوم كم). الزكام معروف وقدزكم
  الرجل وأزكه اللّٰه فهو من كوم بنى على زكم وفلان زكمة أبو يه اذا كان آخر ولدهما ⁦(زلم )⁩
  بقال هو العبدزلة وزلمة وزلمة وزلمة أى قد قد العبدوقال الكسائى أى-قاقال اللعيانى"
