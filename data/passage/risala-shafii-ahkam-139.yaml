text: "… هُمْ يَهْتَدُونَ. - فكانت العلاماتُ جبالاً وليلاً ونهاراً، فيها أرْوَاح معروفةُ الأسماء، وإن كانتْ مُخْتَلِفةَ الَهَابَ. وشمسٌ وقرْ ونجومٌ، معروفةٌ المَطَالعِ والمَغَارِبِ والمواضِعِ من الفَلكِ. - ففَرَض عليهم الاجتهادَ بالتوجُّهِ شَطْرَ المسجِدِ الحرَام، مِمَّا دَلُّهُمْ عليه مما وَصَفْتُ، فكانوا ما …"
