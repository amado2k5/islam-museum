label: { ar: "جامع الترمذي 201 — ما كرهه الفقهاء، الرخصة", en: "Jami' al-Tirmidhi 201 — what the jurists disliked; the concession (rukhsa)", ur: "جامع ترمذی 201 — جسے فقہاء نے مکروہ کہا، رخصت", fr: "Jami' al-Tirmidhi 201 — ce que les juristes ont réprouvé ; la dispense (rukhsa)", es: "Yami' al-Tirmidhi 201 — lo que los juristas reprobaron; la dispensa (rukhsa)" }
text: "… مِنَ الْحَدِيثِ الأَوَّلِ. قَالَ أَبُو عِيسَى وَحَدِيثُ أَبِي هُرَيْرَةَ لَمْ يَرْفَعْهُ ابْنُ وَهْبٍ وَهُوَ أَصَحُّ مِنْ حَدِيثِ الْوَلِيدِ بْنِ مُسْلِمٍ. وَالزُّهْرِيُّ لَمْ يَسْمَعْ مِنْ أَبِي هُرَيْرَةَ. وَاخْتَلَفَ أَهْلُ الْعِلْمِ فِي الأَذَانِ عَلَى غَيْرِ وُضُوءٍ فَكَرِهَهُ بَعْضُ أَهْلِ الْعِلْمِ وَبِهِ يَقُولُ الشَّافِعِيُّ وَإِسْحَاقُ. وَرَخَّصَ فِي ذَلِكَ بَعْضُ أَهْلِ الْعِلْمِ وَبِهِ يَقُولُ سُفْيَانُ الثَّوْرِيُّ وَابْنُ الْمُبَارَكِ وَأَحْمَدُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 201، يرد فيه ذكر ما كرهه الفقهاء، والرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 201 (The Book on Salat (Prayer)), whose wording mentions what the jurists disliked, the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 201، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 201, dont le texte mentionne ce que les juristes ont réprouvé, la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 201, cuyo texto menciona lo que los juristas reprobaron, la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
