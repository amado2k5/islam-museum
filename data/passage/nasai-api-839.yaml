label: { ar: "سنن النسائي 839 — رفع الدرجات", en: "Sunan al-Nasa'i 839 — ranks raised", ur: "سنن نسائی 839 — درجات کی بلندی" }
text: "أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَمَّارٍ، قَالَ حَدَّثَنِي الْقَاسِمُ بْنُ مُحَمَّدٍ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ قَالَ \" صَلاَةُ الْجَمَاعَةِ تَزِيدُ عَلَى صَلاَةِ الْفَذِّ خَمْسًا وَعِشْرِينَ دَرَجَةً \"."
summary:
  ar: "حديث في سنن النسائي، رقم 839، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 839 (The Book of Leading the Prayer (Al-Imamah)), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 839، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
