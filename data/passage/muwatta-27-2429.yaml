label: { ar: "الموطأ 2429 — مالك: الزوج والزوجة يسرق كل منهما من متاع صاحبه", en: "Muwatta 2429" }
summary:
  ar: "قال مالك: وكذلك الرجل يسرق من متاع امرأته، أو المرأة تسرق من متاع زوجها، مما يجب فيه القطع: إن كان الذي سرق منه من متاع صاحبه في بيت سوى البيت الذي يغلقان عليهما، وكان في حرز سواه، فإن من سرق من متاع صاحبه ما يجب فيه القطع، فعليه القطع فيه. {cite:muwatta-maruf-1997 p.402}"
