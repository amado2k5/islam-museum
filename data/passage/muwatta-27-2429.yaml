label: { ar: "الموطأ 2429 — مالك: الزوج والزوجة يسرق كل منهما من متاع صاحبه", en: "Muwatta 2429", es: "Muwatta 2429", fr: "Muwatta 2429", ur: "موطا 2429", tr: "Al-Muwatta 2429 — Malik: Karı koca birbirlerinin mallarından çalabilirler.", id: "Al-Muwatta 2429 — Malik: Suami dan istri boleh saling mencuri harta milik masing-masing." }
summary:
  ar: "قال مالك: وكذلك الرجل يسرق من متاع امرأته، أو المرأة تسرق من متاع زوجها، مما يجب فيه القطع: إن كان الذي سرق منه من متاع صاحبه في بيت سوى البيت الذي يغلقان عليهما، وكان في حرز سواه، فإن من سرق من متاع صاحبه ما يجب فيه القطع، فعليه القطع فيه. {cite:muwatta-maruf-1997 p.402}"
  tr: "Malik şöyle demiştir: Aynı şekilde, bir erkek karısının eşyasından çalarsa veya bir kadın kocasının eşyasından çalarsa ve bu durumda uzuv kesilmesi gerekiyorsa, çalınan eşya, kendilerini kilitledikleri evden başka bir evde ve güvenli bir yerde bulunuyorsa, uzuv kesilmesi gereken bir fiil işleyen her kimse için uzuv kesilmesi gerekir. {cite:muwatta-maruf-1997 s.402}"
  id: "Malik berkata: Demikian juga, jika seorang pria mencuri dari harta milik istrinya, atau seorang wanita mencuri dari harta milik suaminya, yang menyebabkan perlunya amputasi, maka jika barang yang dicuri dari harta milik pasangannya berada di rumah selain rumah tempat mereka mengunci diri, dan berada di tempat yang aman selain rumah tersebut, maka siapa pun yang mencuri dari harta milik pasangannya yang menyebabkan perlunya amputasi, maka perlu dilakukan amputasi untuk itu. {cite:muwatta-maruf-1997 p.402}"
