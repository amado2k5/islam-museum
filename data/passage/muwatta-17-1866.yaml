label: { ar: "الموطأ 1866 — مالك عن نافع: ابتاع حكيم بن حزام طعاما أمر به عمر بن الخطاب للناس، فباعه قبل أن يستوفيه، فرده عمر عليه، وقال لا تبع طعاما ابتعته حتى تستوفيه", en: "Muwatta 1866", es: "Muwatta 1866", fr: "Muwatta 1866", ur: "موطا 1866", tr: "El-Muvatta 1866 — Malik, Nafi’den rivayetle: Hakim bin Hizam, Ömer bin El-Hattab’ın halka dağıtılmasını emrettiği yiyecekleri satın aldı, ancak teslim almadan önce sattı. Ömer yiyecekleri ona geri verdi ve “Teslim almadan önce satın aldığın yiyecekleri satma” dedi.", id: "Al-Muwatta 1866 — Malik berdasarkan riwayat Nafi’: Hakim bin Hizam membeli makanan yang diperintahkan Umar bin Al-Khattab untuk dibagikan kepada orang-orang, tetapi ia menjualnya sebelum menerimanya. Umar mengembalikannya kepadanya dan berkata, “Jangan menjual makanan yang telah kau beli sebelum kau menerimanya.”" }
summary:
  ar: "يروي مالك عن نافع أن حكيم بن حزام ابتاع طعاما أمر به عمر بن الخطاب للناس، فباع حكيم الطعام قبل أن يستوفيه، فبلغ ذلك عمر بن الخطاب، فرده عليه، وقال: لا تبع طعاما ابتعته حتى تستوفيه. {cite:muwatta-maruf-1997 p.168}"
  tr: "Malik, Nafi’den rivayetle, Hakim ibn Hizam’ın Ömer ibn el-Hattab’ın halka dağıtılmasını emrettiği yiyecekleri satın aldığını, ancak daha teslim almadan önce sattığını anlatır. Bu durum Ömer ibn el-Hattab’a ulaştığında, ona geri göndererek şöyle der: “Satın aldığın yiyecekleri teslim almadan satma.” {cite:muwatta-maruf-1997 s.168}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Hakim ibn Hizam membeli makanan yang diperintahkan Umar ibn al-Khattab untuk dibagikan kepada orang-orang. Hakim kemudian menjual makanan tersebut sebelum menerimanya. Ketika hal ini sampai kepada Umar ibn al-Khattab, beliau mengembalikannya kepadanya, seraya berkata: “Jangan menjual makanan yang telah kamu beli sebelum kamu menerimanya.” {cite:muwatta-maruf-1997 p.168}"
