label: { ar: "سنن ابن ماجه 3660 — استغفار الولد يرفع درجة الوالد", en: "Sunan Ibn Majah 3660 — A child's seeking forgiveness raises the parent's rank", ur: "سنن ابن ماجہ 3660 — اولاد کی استغفار والد کا درجہ بلند کرتی ہے" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ عَاصِمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ـ صلى الله عليه وسلم ـ قَالَ ‏\"‏ الْقِنْطَارُ اثْنَا عَشَرَ أَلْفَ أُوقِيَّةٍ كُلُّ أُوقِيَّةٍ خَيْرٌ مِمَّا بَيْنَ السَّمَاءِ وَالأَرْضِ ‏\"‏ ‏.‏ وَقَالَ رَسُولُ اللَّهِ ـ صلى الله عليه وسلم ـ ‏\"‏ إِنَّ الرَّجُلَ لَتُرْفَعُ دَرَجَتُهُ فِي الْجَنَّةِ فَيَقُولُ أَنَّى هَذَا فَيُقَالُ بِاسْتِغْفَارِ وَلَدِكَ لَكَ ‏\"‏ ‏.‏"
summary:
  ar: "قال: إن الرجل لترفع درجته في الجنة فيقول أنى هذا فيقال باستغفار ولدك لك."
  en: "«A man's rank is raised in Paradise and he asks, how is this? — it is said: by your child's seeking forgiveness for you.»"
  ur: "«بندے کا درجہ جنت میں بلند ہوتا ہے، وہ کہتا ہے یہ کیسے؟ — کہا جاتا ہے: تمہاری اولاد کی تمہارے لیے استغفار سے۔»"
