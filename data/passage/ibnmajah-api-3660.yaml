label: { ar: "سنن ابن ماجه 3660 — استغفار الولد يرفع درجة الوالد", en: "Sunan Ibn Majah 3660 — A child's seeking forgiveness raises the parent's rank", ur: "سنن ابن ماجہ 3660 — اولاد کی استغفار والد کا درجہ بلند کرتی ہے", es: "Sunan Ibn Majah 3660 — Que un hijo pida perdón eleva el rango de los padres.", fr: "Sunan Ibn Majah 3660 — Le fait qu'un enfant demande pardon élève le rang de son parent.", tr: "Sunan İbn Majah 3660 — Çocuğun af dilemesi, ebeveynin statüsünü yükseltir.", id: "Sunan Ibn Majah 3660 — Permohonan maaf seorang anak meningkatkan derajat orang tuanya" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ عَاصِمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ـ صلى الله عليه وسلم ـ قَالَ ‏\"‏ الْقِنْطَارُ اثْنَا عَشَرَ أَلْفَ أُوقِيَّةٍ كُلُّ أُوقِيَّةٍ خَيْرٌ مِمَّا بَيْنَ السَّمَاءِ وَالأَرْضِ ‏\"‏ ‏.‏ وَقَالَ رَسُولُ اللَّهِ ـ صلى الله عليه وسلم ـ ‏\"‏ إِنَّ الرَّجُلَ لَتُرْفَعُ دَرَجَتُهُ فِي الْجَنَّةِ فَيَقُولُ أَنَّى هَذَا فَيُقَالُ بِاسْتِغْفَارِ وَلَدِكَ لَكَ ‏\"‏ ‏.‏"
summary:
  ar: "قال: إن الرجل لترفع درجته في الجنة فيقول أنى هذا فيقال باستغفار ولدك لك."
  en: "«A man's rank is raised in Paradise and he asks, how is this? — it is said: by your child's seeking forgiveness for you.»"
  ur: "«بندے کا درجہ جنت میں بلند ہوتا ہے، وہ کہتا ہے یہ کیسے؟ — کہا جاتا ہے: تمہاری اولاد کی تمہارے لیے استغفار سے۔»"
  es: "«Un hombre asciende de rango en el Paraíso y pregunta: ¿Cómo es esto? —Se le responde: Porque tu hijo te pide perdón.»"
  fr: "«Le rang d'un homme est élevé au Paradis et il demande: comment cela se fait-il ? — il lui est répondu: par le fait que ton enfant implore ton pardon.»"
  tr: "Şöyle buyurdu: Bir insanın cennetteki derecesi yükseltilir ve o, \"Bunu nasıl elde ettim?\" diye sorar. Ona, \"Çocuğunun senin için yaptığı bağışlanma duası sayesinde\" denilir."
  id: "Dia berkata: Kedudukan seseorang di Surga akan dinaikkan, dan dia akan berkata, \"Bagaimana aku mendapatkan ini?\" Akan dikatakan, \"Melalui doa anakmu memohon ampunan untukmu.\""
