label: { ar: "موطأ مالك 715 — الأب والأبوة", en: "Muwatta Malik 715 — the father and fatherhood", ur: "موطأ مالک 715 — باپ اور والدیت", es: "Muwatta Malik 715 — el padre y la paternidad", fr: "Muwatta Malik 715 — le père et la paternité" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ أَسْمَاءَ بِنْتِ أَبِي بَكْرٍ، أَنَّهَا كَانَتْ تَلْبَسُ الثِّيَابَ الْمُعَصْفَرَاتِ الْمُشَبَّعَاتِ وَهِيَ مُحْرِمَةٌ لَيْسَ فِيهَا زَعْفَرَانٌ. قَالَ يَحْيَى سُئِلَ مَالِكٌ عَنْ ثَوْبٍ مَسَّهُ طِيبٌ ثُمَّ ذَهَبَ مِنْهُ رِيحُ الطِّيبِ هَلْ يُحْرِمُ فِيهِ فَقَالَ نَعَمْ مَا لَمْ يَكُنْ فِيهِ صِبَاغٌ زَعْفَرَانٌ أَوْ وَرْسٌ."
summary:
  ar: "حديث في موطأ مالك، رقم 715، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 715 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 715، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 715 (Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 715 (Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
