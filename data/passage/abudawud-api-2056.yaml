label: { ar: "سنن أبي داود 2056 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 2056 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 2056 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 2056 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 2056 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan Abi Davud 2056 — Neler caizdir, neler caiz değildir", id: "Sunan Abi Dawud 2056 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… قَالَ \" أَوَتُحِبِّينَ ذَاكَ \". قَالَتْ لَسْتُ بِمُخْلِيَةٍ بِكَ وَأَحَبُّ مَنْ شَرَكَنِي فِي خَيْرٍ أُخْتِي. قَالَ \" فَإِنَّهَا لاَ تَحِلُّ لِي \". قَالَتْ فَوَاللَّهِ لَقَدْ أُخْبِرْتُ أَنَّكَ تَخْطُبُ دُرَّةَ - أَوْ ذَرَّةَ شَكَّ زُهَيْرٌ - بِنْتَ أَبِي سَلَمَةَ. قَالَ \" بِنْتَ أُمِّ سَلَمَةَ \". قَالَتْ نَعَمْ. قَالَ \" أَمَا وَاللَّهِ لَوْ لَمْ تَكُنْ رَبِيبَتِي فِي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2056، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2056 (Marriage (Kitab Al-Nikah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2056، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2056 (El matrimonio (Kitab Al-Nikah)), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2056 (Mariage (Kitab Al-Nikah)), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sünen Ebu Davud'da 2056 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2056, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
