label: { ar: "الموطأ 1712 — عبد الله بن مسعود: فيمن قال كل امرأة أنكحها فهي طالق: إذا لم يسم قبيلة أو امرأة بعينها فلا شيء عليه، وهو أحسن ما سمعه مالك", en: "Muwatta 1712", es: "Muwatta 1712", fr: "Muwatta 1712", ur: "موطا 1712", tr: "El-Muvatta 1712 — Abdullah ibn Mesud: “Evlendiğim her kadın boşanır” diyen kişi hakkında: Eğer belirli bir kabile veya kadın ismi vermezse, onun için bir sonuç yoktur ve bu, Malik'in duyduğu en iyi görüştür.", id: "Al-Muwatta 1712 — Abdullah ibn Masoud: Mengenai orang yang mengatakan, “Setiap wanita yang kunikahi diceraikan”: Jika dia tidak menyebutkan suku atau wanita tertentu, maka tidak ada konsekuensi baginya, dan ini adalah pendapat terbaik yang didengar Malik." }
summary:
  ar: "يروي مالك أنه بلغه أن عبد الله بن مسعود كان يقول فيمن قال كل امرأة أنكحها فهي طالق، إنه إذا لم يسم قبيلة أو امرأة بعينها فلا شيء عليه. قال مالك وهذا أحسن ما سمعت. {cite:muwatta-maruf-1997 p.98}"
  tr: "Malik, Abdullah ibn Mas'ud'un, \"Evlendiğim her kadın boşanır\" diyen biri hakkında, eğer belirli bir kabile veya kadın ismi vermezse, bunun kendisi için bir sonuç doğurmayacağını söylediğini duyduğunu aktardı. Malik, \"Bu duyduğum en güzel şey\" dedi. {cite:muwatta-maruf-1997 s.98}"
  id: "Malik melaporkan bahwa ia mendengar Abdullah ibn Mas'ud pernah berkata mengenai seseorang yang berkata, \"Setiap wanita yang kunikahi akan diceraikan,\" bahwa jika ia tidak menyebutkan suku atau wanita tertentu, maka tidak akan ada konsekuensi baginya. Malik berkata, \"Ini adalah hal terbaik yang pernah kudengar.\" {cite:muwatta-maruf-1997 p.98}"
