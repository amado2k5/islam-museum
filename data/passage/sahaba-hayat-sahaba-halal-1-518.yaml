text: "… الإيمان حتى يحل بذروته، ولا يحل بذروته حتى يكون الفقر أحب إليه من العنى والتواضع أحب إليه من الشرف، وحتى يكون حامده وذامه عنده سواء ؛ قال : تفسرها أصحاب عبد اللّٰه قالوا: حتى يكون الفقر فى الحلال أحب إليه …"
summary:
