text: "… أَبُو بَكْرِ بْنُ نَافِعٍ الْعَبْدِيُّ، حَدَّثَنَا يَحْيَى بْنُ كَثِيرٍ، حَدَّثَنَا عَلِيٌّ، - يَعْنِي ابْنَ الْمُبَارَكِ - حَدَّثَنَا يَحْيَى، عَنْ زَيْدِ بْنِ سَلاَّمٍ، عَنْ جَدِّهِ أَبِي سَلاَّمٍ، قَالَ حَدَّثَنِي عَبْدُ اللَّهِ، بْنُ فَرُّوخَ أَنَّهُ سَمِعَ عَائِشَةَ، تَقُولُ قَالَ رَسُولُ اللَّهِ \" خُلِقَ كُلُّ إِنْسَانٍ \". بِنَحْوِ حَدِيثِ مُعَاوِيَةَ عَنْ زَيْدٍ. وَقَالَ \" فَإِنَّهُ يَمْشِي يَوْمَئِذٍ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2332، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2332 (The Book of Zakat), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2332، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
