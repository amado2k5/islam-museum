text: "… وفيها أغارت الكرج على بلاد المسلمين فوصلوا إلى أخلاط فقتلوا وسبوا وقاتلهم المقاتلة والعامة. وفيها سار صاحب إربل مظفر الدين كوكري وصحبته صاحب مراغة لقتال ملك أذر بيجان، وهو أبو بكر بن البهلول، وذلك لنكوله عن قتال الكرج وإقباله على …"
