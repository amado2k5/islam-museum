text: "… الخاص وهو شريعة محمد ولالخي. دين كل الأنبياء هو الإسلام بمعناه العام، ودين محمد عليقي هو الإسلام، وهو شريعة الإسلام، الإسلام الخاص. وهذا الإسلام الخاص هو الذي جاء تفسيره في قول النبي والي: بُنيَ الإسلام على خمس : شهادة أَن …"
