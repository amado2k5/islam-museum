text: "… قال : وأوصى أَن تغسله أَسماء بنت عُمَيس زوجته، حَدَّثنا الوليد بن كثير، عن ابن صياد، عن سعيدٍ فغسلته، وصَلِّى عليه عمر بن الخطاب، ونزل في قبره ابن المسيّب، قال : لما قبض رسول اللّٰه تَلِقه ارتجَّت عمر، وعثمان، وطلحة، …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 379، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 379, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 379 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 2, pág. 379, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du traité al-Isti'ab d'Ibn 'Abd al-Barr (tome 2, p. 379) mentionnant un testament ou des adieux, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 2. cildinin 379. sayfasından bir alıntı, vasiyetname veya son vasiyet, ölüm ve ölüm zamanı, defin, mezar ve istirahat yerinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve İstirahat Yerleri tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 2 bergambar, halaman 379, menyebutkan wasiat atau surat wasiat terakhir, waktu kematian dan sekarat, pemakaman, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peramban Wasiat, Warisan, Barang Antik, dan Tempat Peristirahatan."
