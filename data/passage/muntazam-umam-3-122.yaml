text: "… ولم يعرفوا شيئا من العلوم كأهل السواد والاكرادوجفاة الاعاجم وسفهاء الاحداث فلا يستبعدٍ ضلال هو لاء فقد كان خلق ينحتون الاصنام ويعبد ونها، ومن اتباعهم طائفة انقطعت دولة اسلافهم بدولة الاسلام أبناء الاكاسرة والدها قين واولاد المجوس فهؤلاء مو تورن …"
