text: "… بن محمّد، فى رجالٍ ممّن لم أُسَمّ حدّثنى ببعض الحديث، وبعض القوم كان أَوعى له من بعض، وقد جمعت الذى حدّثونى، قالوا : لمّا قُتل سُفيان بن خالد بن تُبَيح الهُذَلىّ مشت بنو لِحيان إلى عَضَل والقارة، فجعلوا لهم فَرائض …"
