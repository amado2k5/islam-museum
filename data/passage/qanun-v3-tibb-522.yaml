text: "… عن الكندي، معجون المسك، شجرينا، أنقرديا، جميع ما ينفع من وجعها. ورم الكبد : دواء قيوما الطبيب، أقراص أمير باريس، أقراص راوند، أقراص أرودنيون. صلابة الكبد : أقراص الراوند، جوارشن الأنجذان. صلابة الكبد والطحال: الترياق مثروديطوس، ترياق عزرة، دواء الكركم، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 522، يذكر الطب والطبيب، والوجع، وأعضاء البدن، والدواء، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 522, that mentions medicine and the physician, pain, the organs of the body, the drug, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 522 کا اقتباس جس میں طب اور طبیب، درد، اعضائے بدن، دوا، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
