text: |-
  ١٥١
  اللسان والاصيل الوقت بعد العصر الى المغرب وججعه أصل وآصال وأصائل كأنه بمع
  أصيلة قال الشاعر ١
  ١ ف نسيخة زيادة أبو ذؤيب اه
  لعمرى لانت البيت أكرم أهله • وأقعد فى أفيائه بالاصائل
  ويجمع أيضا على أصلان مثل بعيرويدران ثم صغروا الجمع فقالوا أصيلان ثم أبدلوا من النون
  لا ما فقالوا أصيلال ومنه قول النابغة
  وقفت فيها أصلا لا أسائلها • عيت جوايا وما بالربع من أ-د
  وحكى اللحيانى لقيته أصيلالا وأصيلانا وقد أصلنا أى دخلنا فى الاصيل وأتينا. وصليز
  ويقال أخذت الشى بأصيلته أى كله بأصله ورجل أصيل الرأى أى محكم الرأى وقد أمل
  أصالة مثل ضخم ضخامة ومجد أصيل ذو أصالة والاصلة بالتحريك جنس من الحيات وهى آخينه
  وفى الحديث فى ذكر الدجال كأن رأسه أصلة وابهع أصل ( صطبل لاصطبل للدواب
  وألفه أصلية لان الزيادة لا تلحق بنات الاربعمن أوائلها الا الاسماء الجاريةء-لى أفعالها
  وهى من الجمسة أبعد قال أبو عمر والاصطبل ليس من كلام العرب ⁦(أطل )⁩ الايطل
  الخاصرة وكذلك الاطل والاطل مثال ابل وابل وجمع الاطل آطال وجمع الابطل أياطل
  فل أفل أى غاب وكد أفلت الشمس تأفل وتأفل أفولاغابت والاقال والاقائل صغار
  الابل بنات المخاض ونحوها واحدها أفيل والانثى أفلة ومنه قول زهير
  مغانم شتى من اقال مزنم* والمأفول ابدال المأفون وهو الناقص العقل ⁦(أكل)⁩
  أكلت الطعام أكلاومأكلا والاكاسة المرة الواحدة حتى تشبع والاكلة بالضم اللقمة تقول
  أكات أكلة واحدة أى لقمة وهى القرصة أيضا وهذا الشى أكلة لكّ أى طعمة لن والاكل
  أيضا ما أكل ويسال أيضافلان ذوأكل اذا كان ذا-ظمن الدنيا ورزق واسع قال اللحيانىّ
  الاكلة والاكلة بالضم والكسر الغيبة يقال انه لذواكلة وأكلة اذا كان يغتاب الناس
  كانه من قوله تعالى أيحبَ أحدكم أن يأكل لحم أخمه ممتا والاكلة أيضابا لكسر الحكة
  قال انى لاجد فى جسدى اكاة من الاكال والاكلة أيضا الحال التى يؤكل عليها مثل
  الجلسة والركبة يقبال انه لحسن الاكلة والاكل ثم النخل والشجر وكل مايؤكل فهوأكل
  ومنه قوله تعالا كلهادائم ويقال للميت انقطع أكل، وثوب ذوأ كل أيضااذا كان كثير
  الغزل صفيقا وقرطاس ذوأ كل ويقال أيضارجل ذوأ كل اذا كان ذاعة. ل ورأى جكاه
  أبو نصر صاحب الاصمعى" وقولهم هم أكلة رأس أى هم قليل يشبعهم رأس واحد وهو جمع
  آكل ويقال أكتنى مالم آكل بالتشديد وآكلتنى أيضا أى اتعبته على وآكاتك فلانا
  إذا أمكنته منم ولما أنشد المعزق العبدى النعمان قوه
  فان كنت.أكولا فكن خيرآكل • والافأدركنى ولما أمزق
  قال له النعمان لا آكان ولا أوكان غيرى والا يكال بين الناس الس-هى بينه-م بالنمائم وآكّلته
  ايكالا أطعمته وآكانه مؤاكلة أى أكات معه فصار أفعلت وقاعلت على صورة واحدة
  قوله والاكال الخ فى القاموس
  ولا تقل واكلته بالواو ويقال أكلت النار الحطب وآ كلتها أنا أى أطعمتها اياه وآكل النخل
  وذوالا كال بالمدوالا كان
  والزرع وكل شى اذا أطعم والا كال سادة الاحياه الذين يأخذون المرباع وغيره والمأ. كل
  ووهم الجوهرى سادة الاحياء
  الآخذون للمرباع ا
