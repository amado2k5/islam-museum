text: "- - طوبى لمن وجد فى صحيفته استغفارا كثيرا، قال أبو نعيم حدثنا أبى وجماعة قالوا حدثنا محمد بن يحي به. أخبرنى محمد بن على المقرئ عن محمد بن عبد اللّه النيسابورى الحافظ. قال : جاءنا نعى أبى عمرو سعيد …"
summary:
  ar: "مقطع من تاريخ بغداد أو مدينة السلام، المجلد المصوَّر 1، ص 116، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Tarikh Baghdad aw Madinat al-Salam, scan volume 1, p. 116, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "تاریخ بغداد او مدینۃ السلام، اسکین جلد 1، ص 116 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh Bagdad aw Madinat al-Salam, volume numérisé 1, p. 116, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Tarikh Bagdad aw Madinat al-Salam, volumen escaneado 1, p. 116, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Bağdat Tarihi veya Barış Şehri, Resimli Cilt 1, sayfa 116'dan bir alıntı; bir ölüm ilanı ve duyurusu içermektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve ölüm ilanlarını tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Baghdad, atau Kota Perdamaian, Jilid Bergambar 1, halaman 116, berisi berita duka dan pengumuman kematian; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan berita duka paling terkenal."
