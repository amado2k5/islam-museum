text: "… بحقه، قال ابن عباس: عيادة المريض أول يوم سُنة وبعد ذلك تطوع. وروى البخاري عن آني موسى أن النبي قال : أطعموا الجائع وعودوا المريض : وفكوا العاني. وروى البخاري ومسلم حق المسلم على المسلم ست، قيل : ما هن …"
summary:
