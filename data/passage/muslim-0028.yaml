label: { ar: "مسلم 28 — شهادة التوحيد وأي أبواب الجنة الثمانية", en: "Muslim 28 — The testimony and whichever of Paradise's eight gates" }
text: "قال عبادة بن الصامت: قال رسول الله: من قال أشهد أن لا إله إلا الله وحده، وأن محمداً عبده ورسوله، وأن عيسى عبد الله وابن أمته وكلمته ألقاها إلى مريم وروح منه، وأن الجنة حق وأن النار حق، أدخله الله من أي أبواب الجنة الثمانية شاء"
summary:
  ar: "رواية عبادة بن الصامت في باب دعوة الشهادتين وشرائع الإسلام من كتاب الإيمان في صحيح مسلم؛ الشهادة الواسعة التي تدخل من أي أبواب الجنة الثمانية، وفيها التوصيف الإسلامي لعيسى بن مريم."
