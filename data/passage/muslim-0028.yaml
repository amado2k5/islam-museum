label: { ar: "مسلم 28 — شهادة التوحيد وأي أبواب الجنة الثمانية", en: "Muslim 28 — The testimony and whichever of Paradise's eight gates", es: "Musulmán 28 — El testimonio y cualquiera de las ocho puertas del Paraíso", fr: "Muslim 28 — Le témoignage et l'une des huit portes du Paradis", ur: "مسلم 28 - گواہی اور جنت کے آٹھ دروازوں میں سے جو بھی", tr: "Müslim 28 — İman Şahadeti ve Cennetin Sekiz Kapısından Hangisi", id: "Muslim 28 — Kesaksian Iman dan Manakah dari Delapan Pintu Surga" }
text: "قال عبادة بن الصامت: قال رسول الله: من قال أشهد أن لا إله إلا الله وحده، وأن محمداً عبده ورسوله، وأن عيسى عبد الله وابن أمته وكلمته ألقاها إلى مريم وروح منه، وأن الجنة حق وأن النار حق، أدخله الله من أي أبواب الجنة الثمانية شاء"
summary:
  ar: "رواية عبادة بن الصامت في باب دعوة الشهادتين وشرائع الإسلام من كتاب الإيمان في صحيح مسلم؛ الشهادة الواسعة التي تدخل من أي أبواب الجنة الثمانية، وفيها التوصيف الإسلامي لعيسى بن مريم."
  tr: "Sahih Müslim'in İman Kitabı'ndaki \"İki Şahadet ve İslam Kanunlarına Çağrı\" bölümünde Ubadah ibn al-Samit'in rivayeti; cennetin sekiz kapısından herhangi birinden girilebilen geniş şahitliktir ve Meryem oğlu İsa'nın İslami tanımını içerir."
  id: "Riwayat Ubadah ibn al-Samit dalam bab tentang seruan kepada dua kesaksian dan hukum-hukum Islam dari Kitab Iman dalam Sahih Muslim; kesaksian luas yang dapat masuk melalui salah satu dari delapan pintu Surga, dan berisi uraian Islami tentang Isa, putra Maryam."
