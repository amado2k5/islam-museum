label: { ar: "مسلم 783 — أحب الأعمال إلى الله أدومها وإن قل", en: "Muslim 783 — The most beloved work to God is the most lasting, though little", es: "Musulmán 783 — La obra más amada por Dios es la más duradera, aunque pequeña", fr: "Muslim 783 — L'œuvre la plus aimée de Dieu est la plus durable, même si elle est petite.", ur: "مسلم 783 — خدا کے نزدیک سب سے محبوب کام سب سے زیادہ دیرپا ہے، اگرچہ تھوڑا ہی ہو۔", tr: "Müslim 783 — Allah katında en sevilen ameller, küçük de olsa sürekli yapılanlardır." }
text: "سئل رسول الله: أي العمل أحب إلى الله؟ قال: «أدومه وإن قل»"
summary:
  ar: "رواية عائشة في كتاب صلاة المسافرين من صحيح مسلم؛ أحب الأعمال أدومها وإن قل — نص المواظبة على العمل القليل الدائم."
  tr: "Sahih Müslim'de yer alan Yolcular İçin Dua Kitabı'ndaki Aişe'nin rivayetine göre: \"En sevilen ameller, az da olsa sürekli yapılanlardır.\" Bu, küçük ama sürekli amellerde sebat etmenin önemine dair bir ayettir."
  id: "Riwayat Aisyah dalam Kitab Doa untuk Para Musafir dari Sahih Muslim: “Amal yang paling dicintai adalah amal yang dilakukan secara konsisten, meskipun jumlahnya sedikit” — sebuah teks tentang ketekunan dalam melakukan amal kecil namun berkelanjutan."
