text: "… إِلاَّ أَنْ تُعِينَهُ الْعَاقِلَةُ عَنْ طِيبِ نَفْسٍ مِنْهَا. قَالَ مَالِكٌ وَالأَمْرُ عِنْدَنَا أَنَّ الدِّيَةَ لاَ تَجِبُ عَلَى الْعَاقِلَةِ حَتَّى تَبْلُغَ الثُّلُثَ فَصَاعِدًا فَمَا بَلَغَ الثُّلُثَ فَهُوَ عَلَى الْعَاقِلَةِ وَمَا كَانَ دُونَ الثُّلُثِ فَهُوَ فِي مَالِ الْجَارِحِ خَاصَّةً. قَالَ مَالِكٌ الأَمْرُ الَّذِي لاَ اخْتِلاَفَ فِيهِ عِنْدَنَا فِيمَنْ قُبِلَتْ مِنْهُ الدِّيَةُ فِي قَتْلِ الْعَمْدِ أَوْ فِي شَىْءٍ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1584، يرد فيه ذكر ما يجب على المكلف. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1584 (Blood-Money), whose wording mentions what is binding on the person addressed. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1584، جس کے الفاظ میں جو مکلف پر واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1584, dont le texte mentionne ce qui s'impose à la personne responsable. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1584, cuyo texto menciona lo que obliga a la persona responsable. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında 1584 numaralı hadis olarak geçen bu hadis, sorumlu bir Müslüman için farz olan şeyleri anlatmaktadır. Farz görevleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları kapsayan bu hadisin derleyicisi, Kur'an'dan, Sünnet'ten, Peygamberin hayatından ve Sahabeler ile haleflerinden rivayetlerden ilgili metinleri de eklemiştir. Derleyici metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Hadits ini, yang terdapat dalam Muwatta karya Malik, nomor 1584, menyebutkan apa yang wajib bagi seorang Muslim yang bertanggung jawab. Penyusun hadits ini, yang mencakup kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, menyertakan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
