text: "… فكانه مات قبل الفتح، فيكون ابنه من أهل هذا القسم أو الذي بعده. الله! إنا نسمع منك شيئاً لا نستطيع أن نرويه؛ كما نسمعه، قال: إذا لم تحلوا حراماً ولم تحرموا حلالاً - محمد بن عبد اللّٰه بن سلام بن …"
summary:
