  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 1362 کا اقتباس جس میں حلال، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
