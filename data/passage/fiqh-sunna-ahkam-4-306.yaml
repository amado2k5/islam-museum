text: "… يقوم بتمريضه إذا كان لا يمكن الاستغناء عنه، فعن طارق بن شهاب عن النبي قال : الجمعة حق واجب على كل مسلم في جماعة إلا أربعة : عبد مملوك أو امرأة الذي فرض عليهم : أي فرض عليهم تعظيمه. اليهود …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 306، يرد فيه ذكر ما فُرض على الناس، والفرض، وما وجب على كل مسلم، والواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 306, whose wording mentions what was made obligatory on people, the obligatory (fard), a duty laid on every Muslim, the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 306 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، جو ہر مسلمان پر لازم ہے، واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 4, p. 306, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), un devoir imposé à chaque musulman, l'obligatoire (wajib), un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 4, p. 306, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), un deber impuesto a cada musulmán, lo obligatorio (wajib), un derecho debido por cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 4. cildinin 306. sayfasından bir alıntı, insanlar üzerine farz olan şeyleri, farz fiilleri, her Müslümandan istenenleri, farz fiilleri ve her Müslümanın hakkını ele almaktadır. Bu alıntı, makine tarafından okunabilir baskıdan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 4, halaman 306, membahas tentang apa yang wajib dilakukan oleh manusia, amalan wajib, apa yang dituntut dari setiap Muslim, amalan wajib, dan hak setiap Muslim. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
