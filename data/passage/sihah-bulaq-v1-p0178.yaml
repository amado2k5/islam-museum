text: |-
  (فصل العين
  ٤٦٣
  نضك عن ذى أشر عضارس والجهع عضارس بالفتح مشل جوالق وجوالق والعضرس
  أيضانيت قال اين مقبل
  والعيرينفخ فى المكان قد كتت * منه حافل والعضرس النجر ١
  بظل بالعضرس حرباؤها * كأنه قرم مسامى أشر
  ⁦( عطس)⁩ العطاس من العطسة وقد عطس بالفتح يعطس ويعطس وربمافالواعطس
  الصبح اذا اتفلق وظي عاطس وهو الذى يستقبلك من أمامك والمعطس مثال المجلس الانف
  وربعاجاء بفتح الطاء ⁦(عطمس)⁩ العيطموس من النساء التامة الخلق وكذلك من الابل
  والجمع العطاميس وقديا فى ضرورة الشعر عطامس قال الراجز
  يارب بيضاء من العطامس • تضحك عن ذى أشر عضارس
  وكان حقه أن يقول عطاميس لانك لما حذفت الياء من الواحدة بقيت عطموس مثال
  كردوس فلزم التعويض لانّ حرف الليز رابعه كمالزم فى التصبرولم تحذف الواولانك
  لوحذفته الاحتجت أيضا الى أن تحذف الياء فى الجمع والتصغيرواغا تحذف من الزيادتين
  ما اذا حذفتها استغنيت عن حذف الاخرى قس لعفس الحبس والايتذال أيضا
  والمعفوس المسجون والمعفوس المبتذل قال العجاج يصف بعيرا
  كأنه من طول جذع العفس * ورملان المس بعد الحمس * ينحت من اقطاره بفأس
  واعتفس القوم اصطرع واوالمعافسة المعالجة وفى الحديث وعافسنا النساء وعفاس وبروع
  اسم ناقتين المراعى النميرى وقال
  اذابر كت منها عجاساءجلة • أحنبة أشلى العفاس وبروعا
  فقس العفنس العسر الاخلاق وقد اعفنقس الرجل وخلق عننقس قال العجاج
  اذا أراد خلقاعفنقا * أقره الناس وان تفجا
  (عكس العكس أن تشتحبلا فى خطم البعير الى وسخ يديه ليذل واسم ذلك الحبل
  العكاس يقال دون ذلك الامر عكاس ومكاس والعكس ردّك أخر الشئ الى أوّله ومنه عكس
  البلية عند القبرلانهم كانوا يربطونها معكوسة الرأس الى ما لى كلكلها وبطنها ويقال الى
  مؤخّرها مما يلى ظهرها ويتر كونها على تلك الحال حتى تموت والعكيس ابن يصب على مرق
  كائنا ما كان تقول منه عكمت أحكس عكاوكذلك الاعتكاس والعكيس أيضامن اللبن
  الحليب تصب عليه الاهالة فيشرب قال الراجز
  جفول ذاقدرك للضيفان * جفئا على الرغفان فى الجفان • خير من العكيس بالالبان
  والعكيس القضيب من الجبلة بعكس تحت الارض الى موضع آخر كمس عكمس
  لليل اذا أظلم وليل عكامس أى شديد الظلة وابل عكامس أى كثيرة (علس العلس
  القراد الضخم وبه مهى الرجل وجل ورجل علسىّ أى شديد قال الراجز
  اذارآها العاسى ابلا والعلس أيضاضرب من الحنطة تكون حبتان فى قشرواحد
  وهوطعام أهل صنعاء قال أبو صاءد الكلابى يقال ماذاق علوسا ولالؤوسا أى شيئا وما
  عل: اعندهم علوسا أبوع رو العار بالسكون الشرب وماعل واضيفهم يفى تعليسا
  ١ يأتى ايضافى كتن اه
