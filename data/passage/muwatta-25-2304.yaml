label: { ar: "الموطأ 2304 — مالك: المكاتب بين رجلين فاقتضى أحدهما أكثر مما قاطع", en: "Muwatta 2304", es: "Muwatta 2304", fr: "Muwatta 2304", ur: "موطا 2304", tr: "Al-Muwatta 2304 — Malik: İki adam arasında yapılan bir köle azat etme sözleşmesi ve adamlardan birinin kararlaştırılandan daha fazlasını talep etmesi.", id: "Al-Muwatta 2304 — Malik: Perjanjian pembebasan antara dua orang, dan salah satu dari mereka menuntut lebih dari yang telah disepakati." }
summary:
  ar: "قال مالك في المكاتب بين رجلين يقاطعه أحدهما بإذن شريكه، ثم يقبض الذي تمسك بالرق مثل ما قاطع عليه صاحبه أو أكثر، ثم يعجز المكاتب: فالعبد بينهما؛ لأنه إنما اقتضى حقه. فإن اقتضى أقل مما أخذ المقاطِع، فإن أحب المقاطِع أن يرد على شريكه نصف ما تفضل به صار العبد بينهما نصفين، وإن أبى فجميع العبد للذي لم يقاطع. {cite:muwatta-maruf-1997 p.350}"
  tr: "Malik, iki adam arasında yapılan bir köle azat etme sözleşmesi hakkında şöyle demiştir: Adamlardan biri diğerinin izniyle bir sözleşme yapar ve köleyi elinde tutan kişi, ortağıyla kararlaştırılan miktarın aynısını veya daha fazlasını alır; ancak sözleşmeyi yapan kişi ödeme yapamaz hale gelirse, köle aralarında paylaştırılır çünkü o sadece kendisine düşeni almıştır. Eğer sözleşmeyi yapan kişi, sözleşmeyi yapan kişinin aldığından daha azını alırsa ve sözleşmeyi yapan kişi ortağına verdiğinin yarısını iade etmek isterse, köle aralarında eşit olarak paylaştırılır. Eğer bunu reddederse, kölenin tamamı sözleşmeyi yapmayan kişiye aittir. {cite:muwatta-maruf-1997 s.350}"
  id: "Malik berkata mengenai perjanjian pembebasan budak antara dua orang, di mana salah satu dari mereka menyetujui perjanjian tersebut dengan izin dari yang lain, dan kemudian orang yang mempertahankan budak tersebut menerima jumlah yang sama atau lebih dari yang disepakati dengan rekannya, dan kemudian orang yang terikat perjanjian tersebut tidak mampu membayar: budak tersebut dibagi di antara mereka karena ia hanya menerima haknya. Jika ia menerima kurang dari yang diterima oleh orang yang menyetujui perjanjian tersebut, dan jika orang yang menyetujui perjanjian tersebut ingin mengembalikan setengah dari apa yang diberikannya kepada rekannya, maka budak tersebut dibagi rata di antara mereka. Jika ia menolak, maka seluruh budak tersebut menjadi milik orang yang tidak menyetujui perjanjian tersebut. {cite:muwatta-maruf-1997 p.350}"
