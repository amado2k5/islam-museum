summary:
  ar: "قال مالك في المكاتب بين رجلين يقاطعه أحدهما بإذن شريكه، ثم يقبض الذي تمسك بالرق مثل ما قاطع عليه صاحبه أو أكثر، ثم يعجز المكاتب: فالعبد بينهما؛ لأنه إنما اقتضى حقه. فإن اقتضى أقل مما أخذ المقاطِع، فإن أحب المقاطِع أن يرد على شريكه نصف ما تفضل به صار العبد بينهما نصفين، وإن أبى فجميع العبد للذي لم يقاطع. {cite:muwatta-maruf-1997 p.350}"
