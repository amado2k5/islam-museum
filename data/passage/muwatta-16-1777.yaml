label: { ar: "الموطأ 1777 — يحيى بن سعيد: سأل رجل أبا موسى الأشعري عن امرأته التي مص من ثديها لبنا، فقال أبو موسى أراها قد حرمت عليك، ثم قال لابن مسعود: لا رضاعة إلا ما كان في الحولين، فقال أبو موسى: لا تسألوني ما كان هذا الحبر بين أظهركم", en: "Muwatta 1777", es: "Muwatta 1777", fr: "Muwatta 1777", ur: "موطا 1777", tr: "El-Muvatta 1777 — Yahya ibn Sa’id: Bir adam Ebu Musa el-Eş’ari’ye, memesinden süt emdiği karısı hakkında sordu. Ebu Musa, “Sanırım o sana haramdır” dedi. Sonra İbn Mes’ud’a, “İlk iki yıl dışında emzirme yasaktır” dedi. Ebu Musa, “Bu âlimin aranızda ne yaptığını bana sormayın” dedi.", id: "Al-Muwatta 1777 — Yahya ibn Sa’id: Seorang pria bertanya kepada Abu Musa al-Ash’ari tentang istrinya yang susunya telah ia hisap. Abu Musa berkata, “Saya rasa itu haram bagimu.” Kemudian dia berkata kepada Ibn Mas’ud, “Tidak ada pemberian ASI kecuali yang terjadi dalam dua tahun pertama.” Abu Musa berkata, “Jangan tanya saya apa yang dilakukan ulama ini di antara kalian.”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رجلا سأل أبا موسى الأشعري فقال: إني مصصت من امرأتي من ثديها لبنا، فذهب في بطني. فقال أبو موسى: لا أراها إلا قد حرمت عليك. فقال الرجل: فما تقول أنت؟ قال أبو موسى لعبد الله بن مسعود: انظر ماذا تفتي به الرجل. فقال ابن مسعود: لا رضاعة إلا ما كان في الحولين. فقال أبو موسى: لا تسألوني عن شيء ما كان هذا الحبر بين أظهركم. {cite:muwatta-maruf-1997 p.125} {cite:muwatta-maruf-1997 p.126}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ettiğine göre, bir adam Ebu Musa el-Eş'ari'ye, \"Eşimin memesinden süt emdim ve süt mideme gitti\" diye sordu. Ebu Musa, \"Bence artık sana haramdır\" diye cevap verdi. Adam, \"Ne diyorsun?\" diye sordu. Ebu Musa daha sonra Abdullah ibn Mes'ud'a, \"Bak, adama ne hüküm vereceksin\" dedi. İbn Mes'ud, \"İlk iki yıl içinde gerçekleşen emzirme dışında geçerli bir emzirme yoktur\" dedi. Ebu Musa daha sonra, \"Bu âlim aranızdayken bana hiçbir şey sormayın\" dedi."
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa seorang pria bertanya kepada Abu Musa al-Ash'ari, \"Aku menyusu dari payudara istriku, dan susu itu masuk ke perutku.\" Abu Musa menjawab, \"Aku yakin sekarang haram bagimu untuk menyusu.\" Pria itu bertanya, \"Apa pendapatmu?\" Abu Musa kemudian berkata kepada Abdullah ibn Mas'ud, \"Lihatlah hukum apa yang akan kau berikan kepada pria itu.\" Ibn Mas'ud berkata, \"Tidak ada ASI yang sah kecuali yang terjadi dalam dua tahun pertama.\" Abu Musa kemudian berkata, \"Jangan bertanya kepadaku tentang apa pun selama ulama ini ada di antara kalian.\""
