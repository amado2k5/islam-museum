label: { ar: "الموطأ 1777 — يحيى بن سعيد: سأل رجل أبا موسى الأشعري عن امرأته التي مص من ثديها لبنا، فقال أبو موسى أراها قد حرمت عليك، ثم قال لابن مسعود: لا رضاعة إلا ما كان في الحولين، فقال أبو موسى: لا تسألوني ما كان هذا الحبر بين أظهركم", en: "Muwatta 1777" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رجلا سأل أبا موسى الأشعري فقال: إني مصصت من امرأتي من ثديها لبنا، فذهب في بطني. فقال أبو موسى: لا أراها إلا قد حرمت عليك. فقال الرجل: فما تقول أنت؟ قال أبو موسى لعبد الله بن مسعود: انظر ماذا تفتي به الرجل. فقال ابن مسعود: لا رضاعة إلا ما كان في الحولين. فقال أبو موسى: لا تسألوني عن شيء ما كان هذا الحبر بين أظهركم. {cite:muwatta-maruf-1997 p.125} {cite:muwatta-maruf-1997 p.126}"
