text: "… من طريق محمد بن جعفر، عن شعبة، به. وانظر ما سيأتي برقم. والحفيظ: الذي حفظ ذنوبه حتى رجع عنها وتاب منها. ويمكن أن يقال: هو حفيظ لكلّ ما قرّبه إلى ربّه من الفرائض والطاعات."
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 2، ص 156، يرد فيه ذكر الفريضة والفرائض، والطاعات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
