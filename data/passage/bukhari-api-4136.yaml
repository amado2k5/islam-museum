text: "… جَابِرٍ، قَالَ كُنَّا مَعَ النَّبِيِّ بِذَاتِ الرِّقَاعِ، فَإِذَا أَتَيْنَا عَلَى شَجَرَةٍ ظَلِيلَةٍ تَرَكْنَاهَا لِلنَّبِيِّ، فَجَاءَ رَجُلٌ مِنَ الْمُشْرِكِينَ وَسَيْفُ النَّبِيِّ مُعَلَّقٌ بِالشَّجَرَةِ فَاخْتَرَطَهُ فَقَالَ تَخَافُنِي قَالَ \" لاَ \". قَالَ فَمَنْ يَمْنَعُكَ مِنِّي قَالَ \" اللَّهُ \". فَتَهَدَّدَهُ أَصْحَابُ النَّبِيِّ، وَأُقِيمَتِ الصَّلاَةُ فَصَلَّى بِطَائِفَةٍ رَكْعَتَيْنِ، ثُمَّ تَأَخَّرُوا، وَصَلَّى بِالطَّائِفَةِ الأُخْرَى رَكْعَتَيْنِ، وَكَانَ لِلنَّبِيِّ أَرْبَعٌ وَلِلْقَوْمِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4136، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4136 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4136، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
