text: "وبعث معه ثمانية رهط من المهاجرين، ليس فيهم من الأنصار أحد، وكتب له كتابا، وأمره ألا ينظر فيه حتى يسير يومين ثم ينظر فيه، فيمضي لما أمره به، ولا يستكره من أصحابه أحدا. وكان أصحاب عبد الله بن جحش خمس"
