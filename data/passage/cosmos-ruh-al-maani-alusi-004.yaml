text: "يأجوج ومأجوج ثنتان وعشرون قبيلةً، بنى ذو القرنين السدَّ على إحدى وعشرين، وكانت واحدةٌ منهم خارجةً للغزو، فبقت خارجة، وسميت الترك لذلك"
summary:
  ar: "عند تفسير «إن يأجوج ومأجوج مفسدون» يجمع الألوسي أقوال النسب: قبيلتان من ولد يافث بن نوح، أو الترك منهم، وفي رواية عبد الرزاق عن قتادة أنهم اثنتان وعشرون قبيلة سدّ ذو القرنين على إحدى وعشرين وبقيت واحدة خارجة للغزو فسُمّيت الترك، ثم يعرض قول كعب الأحبار في أنهم من ولد آدم من غير حواء."
  en: "Commenting on 'Gog and Magog are corrupters', al-Alusi collects views on their descent: two tribes of the sons of Japheth son of Noah, or the Turks among them; and, in Abd al-Razzaq's report from Qatada, twenty-two tribes, twenty-one walled in by Dhu al-Qarnayn and one left outside on a raid and so named the Turks. He then gives Ka'b al-Ahbar's view that they descend from Adam without Eve."
