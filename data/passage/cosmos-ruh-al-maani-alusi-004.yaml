text: "يأجوج ومأجوج ثنتان وعشرون قبيلةً، بنى ذو القرنين السدَّ على إحدى وعشرين، وكانت واحدةٌ منهم خارجةً للغزو، فبقت خارجة، وسميت الترك لذلك"
summary:
  ar: "عند تفسير «إن يأجوج ومأجوج مفسدون» يجمع الألوسي أقوال النسب: قبيلتان من ولد يافث بن نوح، أو الترك منهم، وفي رواية عبد الرزاق عن قتادة أنهم اثنتان وعشرون قبيلة سدّ ذو القرنين على إحدى وعشرين وبقيت واحدة خارجة للغزو فسُمّيت الترك، ثم يعرض قول كعب الأحبار في أنهم من ولد آدم من غير حواء."
  en: "Commenting on 'Gog and Magog are corrupters', al-Alusi collects views on their descent: two tribes of the sons of Japheth son of Noah, or the Turks among them; and, in Abd al-Razzaq's report from Qatada, twenty-two tribes, twenty-one walled in by Dhu al-Qarnayn and one left outside on a raid and so named the Turks. He then gives Ka'b al-Ahbar's view that they descend from Adam without Eve."
  es: "Al comentar sobre «Gog y Magog son corruptores», al-Alusi recopila opiniones sobre su descendencia: dos tribus de los hijos de Jafet, hijo de Noé, o los turcos entre ellos; y, en el informe de Abd al-Razzaq de Qatada, veintidós tribus, veintiuna encerradas por Dhu al-Qarnayn y una que quedó fuera durante una incursión y que fue llamada los turcos. Luego presenta la opinión de Ka'b al-Ahbar de que descienden de Adán sin Eva."
  fr: "Commentant l'affirmation selon laquelle « Gog et Magog sont des corrupteurs », al-Alusi rassemble différentes opinions sur leur descendance: deux tribus issues des fils de Japhet, fils de Noé, ou les Turcs parmi elles; et, selon le récit d'Abd al-Razzaq de Qatada, vingt-deux tribus, dont vingt et une furent encerclées par Dhu al-Qarnayn et une laissée à l'extérieur lors d'un raid, d'où le nom de Turcs. Il rapporte ensuite l'opinion de Ka'b al-Ahbar selon laquelle ils descendent d'Adam sans Ève."
  ur: "'یاجوج اور ماجوج فسادی ہیں' پر تبصرہ کرتے ہوئے، آلوسی ان کے نزول کے بارے میں خیالات جمع کرتا ہے: یافث بن نوح کے بیٹوں کے دو قبیلے، یا ان میں سے ترک؛ اور، قتادہ سے عبدالرزاق کی رپورٹ میں، بائیس قبیلے، اکیس کو ذوالقرنین نے گھیر لیا اور ایک چھاپہ مار کر باہر رہ گیا اور اسی لیے ترکوں کا نام دیا گیا۔ اس کے بعد وہ کعب الاحبار کا قول دیتا ہے کہ وہ حضرت آدم سے حوا کے بغیر نازل ہوئے ہیں۔"
