summary:
  ar: "القسم 4 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجمعة عن رسول الله»، ويضم فيها النصوص من 488 إلى 529 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 4 of Jami' al-Tirmidhi (The Book on the Day of Friday) in the division of the open hadith dataset the museum took its reports from: reports 488 to 529 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 4، عنوان «کتاب الجمعۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 488 تا 529۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 4 de Jami' al-Tirmidhi (El Libro del Viernes) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 488 al 529, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du recueil ouvert Jami' al-Tirmidhi (Livre du vendredi), dans son ouvrage de référence (les hadiths 488 à 529). Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
