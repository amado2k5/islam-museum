  قتلته وفلان يتوقم صكلامى أى يتحفظه ويعيه وواقم أطم من آطام المدينة وحرة واقم
  مضافة اليه وقال
  لو انّ الردى يزور عن ذى مهابة * لهاب خضبرايوم أغاق واقا
  ودورحل من الخزرج يقال له خضير الكائب ⁦(وكم)⁩ الموكوم مثل الموقوم
  وقد وكه الامر حزنه ووكت الارض اذا وطئت وأكل نباتها (ولم الوليمة طعام
  العرس وقد أولت وفى الحديث أو لم ولوبشاة نم ونيم الذباب سلحه وأنشد الاصمفىّ
  اقدونم الذياب عليه -تى • كأن ونيمه نقط المداد
  ⁦( وهم)⁩ وهدت فى الحساب أوهم وهما اذا غلطت فيه وسهوت ووهدت فى الشى بالفتح أهم:
  وهما أذاذهب وهمك اليه وأنت تريد غسيره وتوهمت أى ظنات وأوهمت غيرى ايهاما
  والتوهيم مثله واتهمت فلانا بكذا والاسم التهمة بالتحريك وأصل التساءفيه واو على ماذكرناه
  فى وكل وأوهمت الشئ أذاتركنه كله يقال أوهم من الحساب مائة أى أسقط وأوهم من
  صلاته ركعة أبوزيد يقال للرجل اذا اتهمته أتموت اتها مامشل أدوأت ادواء يقال قد
  أتهم الرجل على أفعل اذا صارت به الريبة والوهم الجمل الفهخم الذلول قال ذوالرمّة يصف
  كأنها جل وه-م ومابقيت • الاالخيزة والالواح والعصب
  والانثى وعمة قال الكميت
  يجتاب أردية السراب وتارة * قص الظلام بوهمة شملال
  والوهم أيضا الطر يق الواسع قال لبيد يصف بعبره وبعيرصاحبه
  ثم أصدرناهما فى وارد * صادروهم صواه قد مثل
  ويقال لاوهم من كذا أى لا بدمنه
  ن ل الماء ه ت م الهتم كسر التنايا من أصلها يقال ضريه فهستم فاءاذا
  ألقى مقدم أسفانه ورجل أهتم بين الهتم والاهتم لقب سنان بن سمى بنسنان بن حالد بن منر
  لانه هتمت سنه يوم الكلاب وتهتمت أسنانه أى تكسرت والهتامة ما تهتم من الشئ أى تكسر
  منه ثم ثم ل من ماله كماتة ول قثم حكاها ابن الاعرابي" والهيثم فرخ العقاب ومنه سمى
  الرجل هينما والهيتم الكتيب الأحر جم جمت على الشئ بغتة أهجم هجوما وهجهت
  غيرى يتعدّى ولا يتعدى وهجم الشتاء دخل وهجمت عينه أى غارت الاصمحىّ هجمت
  مافى ضرع الناقة اذا حلبت كل مافيه وهجمت البيت هجماهد مته وريح هجوم تقلع البيوت
  والثمام وانهجمت عينه دمعت والهجم القدح الضخم وقال
  فتملأ الهجم عفواوهى وادعة • حتى تكادشفاه الهجم تنشلم
  أبو عبيد الهجمة من الابل أوّلها الاربعون الى مازادت وهنيدة المائة فقط وهجمة الشتاء
  شدة برده وهجمة الصيف حزه أبوع روا لهعيعة من اللبن أن تحقنه فى السقاء الجديد
  ثم تشريه ولا تمخضه وقال أبو يوسف -معت أبامهدى السكلابي يقول هو مالم يرب أى لم يختر
  وقد الهاج لان يروب والهيجمانة الدرّة وهيجمانة اسم احرأة وهى ابنة العنبرين عمروين تيم
  ⁦( هدم)⁩ هدمت الشئ هدمافانه دم وتهتم وهدموا بيوتهم شدد للكثرة وتهدم عليه من
