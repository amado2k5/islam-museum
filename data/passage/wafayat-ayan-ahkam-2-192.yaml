text: "… أول الى آخره وكتاب المشارق من اوله الى آخره فى شهر رمضان ودرمت هناك إيضا كاب التوضيح من أوله الى آخره ودرست هناك أيضاشرح الوقاية لصدد الشريعة من اول كتاب البيع الى آخره ودرت هناك ايضا مزح الفرائض السيد الشريف …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 2، ص 192، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
