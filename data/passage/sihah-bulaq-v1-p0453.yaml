text: |-
  ١ ي تصتيز فيه وفى القطعة
  كمافى وانقولى اه
  ٦٨٨
  ⁦(باب الحاء)⁩
  ⁦(فوح)⁩
  ومالا ينعاق فه وأعجم. وفصح العجمى بالضم فصاحة جادت لغته حتى لا يلحن وتفصح فى كلامه
  وتفاصح تكاف الفصاحة وتقول أإضافصح اللبن اذا أخذت عنه الرغوة قال الشاعر
  وتحت الرغوة الابن الفصديح
  وأفصح العجمى اذا تكام بالعربية وأفضت الشباة اذا
  انقطع لبأها وخلص لبنها وقد أفصح اللبن اذا ذهب اللبأ عنه وأفصح الصبح اذ ا بداضوه وكل
  واضح مفصح وأفصح الرجل من كذا اذاخرج منه والفصح باقسار عيد للنصارى وذلك اذا
  أكلوا اللحم وأفطروا وأفصح النصارى اذأجاء ذصهم ⁦(فضح)⁩ فضحه فاقتضح اذا كشف
  مساويه والاسم الفضيحة والفضوح وفضح الصبح وأفضح اذا بدا وأفضح البسر اذا بدت فيه
  مرة قال الشاءر أبوذؤيب ياهل رأيت جول الحى غادية * كالنخل زينها يتع وافضاح
  أ والافضح الاسيض وليس بالشديد الساض قال ابن مقبل
  فأضحى له جلب بأكتاف شرمة أجش سماكىّ من الويل أفضع
  وقيل الفضح غبرة فى طحلة والافضح الاسد وكذلك البعير وذلل من فضح اللون
  (ن طح فطحه فطءا جعلد عريضاقال الشاعر
  مقطوحة السيتين توبع بريها • صفراءذات أسرة وسفاسق
  والتفطيح.:-له يقال رأس مفطح أى عريض ورجل أفطح بين الفطح, أى عريض الرأس
  ⁦( فقح)⁩ تفقحت الوردة أى تفتحت وعلى فلان حلة فقباحية وهى على لون الورد حيزهم
  أن يتفتح والفقاح نور الاذخر والفقية حلقة الدبر والجمع الفقاح وهم يتفامحون اذاجعلوا
  ظهورهم الى ظهورهم كماتقول يتة ابلون ويتظاهرون وفقح الجروتفقيحا اذافتح عينيه أوّل
  ما يفتح وفى الحديث فقحنا وصأصأتم ⁦(فلح)⁩ الفلاح الفوز والنجاة والبقاء والسحور
  يقول الرجل لامر أنه استفلحى بأمرك أى فوزى بأمرك وقول الشاءو
  وامكن ليس للدننا فلاح أى بقاء وفى الحديث حتى خفذا أن يفوتنا الفلاح يعنى السحور
  ويقال اغاسمى يذلكلات به بقاء الصوم وحىّ على الفلاح أى أقبل على النجاة والفلح
  لغة فى الفلاح قال الأعشى
  ولئن كنا كقوم هلكوا * مالقوم يالوم من فلح
  وفلحت الارض شققته اللحرث ومنه سمى الاكارفلاحاوا لفلاحة بالكسر الحراثة وقولهم ان.
  الحديد بالحديد يفلح أى يشقو يقطع وفى رجل فلان فلوح أى شقوق وبالجيم أيضا والافلح
  المشقوق الشفة السفلى يقال رجل أفلح بين الفلح واسم ذلك الشق الفلهة ( ١ ثل القطعة
  وكان عترة العبسى يلقب الفلماء لفلحة كانت به وانماذهبوايه الى تأنيت الشفة ⁦( فتح)⁩
  فح الفرس من الماءأى شرب دون الرى وقال
  والاخذ بالغبوق والصبوح ، مبردلقأب فنوح
  ⁦(فوح)⁩ فاحت رح المسك تفوح وتفيح فوحا وفيحا وذوحاوذ وحانا وفيه انا يقال فاح
  الطيباذا تضوع ولا يقال فاحت ريح خبيئة وفاحت القدر تفيح غلت وأخحتما أنا وكذلك
  فاحت الشجة نفحت بالدم وأفاح دمه هراقه وقال
  نحرقتلنا الملك الجاحا • ولم ندع لسارج مراحا * الادياراود مامفاحا
