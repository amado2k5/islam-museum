label: { ar: "الموطأ 59 — عامر بن ربيعة يأكل ما مسته النار ولا يتوضأ", en: "Muwatta 59", es: "Muwatta 59", fr: "Muwatta 59", ur: "موطا 59", tr: "Al-Muwatta 59 — Amir ibn Rabi’ah, ateş üzerinde pişirilmiş yemeği yiyor ve abdest almıyor.", id: "Al-Muwatta 59 — Amir bin Rabi’ah memakan makanan yang dimasak di atas api dan tidak berwudhu." }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب ترك الوضوء مما مست النار: سأل يحيى عبد الله بن عامر بن ربيعة عن الرجل يتوضأ للصلاة ثم يأكل طعاماً مسته النار، أيتوضأ؟ فأجاب بأنه رأى أباه عامر بن ربيعة يفعل ذلك ولا يتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.62}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği, ateş üzerinde pişirilmiş yemek yedikten sonra abdest almamakla ilgili bölümde şöyle bir rivayet yer almaktadır: Yahya, Abdullah ibn 'Amir ibn Rabi'ah'a namaz için abdest alan ve sonra ateş üzerinde pişirilmiş yemek yiyen bir adam hakkında sordu; tekrar abdest alması gerekir mi? Abdullah ibn 'Amir ibn Rabi'ah, babası 'Amir ibn Rabi'ah'ın bunu yaptığını ve abdest almadığını gördüğünü söyledi. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Muhammed ibn al-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Bayhaqi tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.62}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Yahya ibn Sa'id, dalam bab tentang tidak berwudhu setelah makan makanan yang dimasak di atas api: Yahya bertanya kepada Abdullah ibn 'Amir ibn Rabi'ah tentang seorang laki-laki yang berwudhu untuk salat dan kemudian makan makanan yang dimasak di atas api; haruskah ia berwudhu lagi? Ia menjawab bahwa ia melihat ayahnya, 'Amir ibn Rabi'ah, melakukan hal itu dan tidak berwudhu. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.62}"
