label: { ar: "الموطأ 59 — عامر بن ربيعة يأكل ما مسته النار ولا يتوضأ", en: "Muwatta 59" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب ترك الوضوء مما مست النار: سأل يحيى عبد الله بن عامر بن ربيعة عن الرجل يتوضأ للصلاة ثم يأكل طعاماً مسته النار، أيتوضأ؟ فأجاب بأنه رأى أباه عامر بن ربيعة يفعل ذلك ولا يتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.62}"
