text: "الذي جاء به موسى إلى قومه نورا للناس وهداية لهم؟ ثم توجه الخطاب إلى اليهود زجرا لهم بقوله: تجعلون هذا الكتاب في قراطيس متفرقة، تظهرون بعضها، وتكتمون كثيرا منها، ومما كتموه الإخبار عن صفة محمد صلى الله عليه وسلم ونبوته،"
