label: { ar: "صحيح البخاري 5657 — المرض والمريض، عيادة المريض", en: "Sahih al-Bukhari 5657 — illness and the sick; visiting the sick", ur: "صحیح بخاری 5657 — بیماری اور بیمار، بیمار کی عیادت" }
text: "حَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ ـ أَنَّ غُلاَمًا، لِيَهُودَ كَانَ يَخْدُمُ النَّبِيَّ فَمَرِضَ. فَأَتَاهُ النَّبِيُّ يَعُودُهُ فَقَالَ \" أَسْلِمْ \". فَأَسْلَمَ. وَقَالَ سَعِيدُ بْنُ الْمُسَيَّبِ عَنْ أَبِيهِ، لَمَّا حُضِرَ أَبُو طَالِبٍ جَاءَهُ النَّبِيُّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5657، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5657 (Patients), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5657، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
