text: "… بالأم. المبسوط، البناية شرح الهداية، للعيني. قال ابن أبي زيد: ولا تحرم عليه بناتها حتى يدخل بالأم. الرسالة ص، حاشية العدوي على كفاية الطالب الرباني. قال الشافعي: فإن دخل بالأم لم تحل له الابنة ولا ولدها وإن تسفل كل من …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 161، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 1, p. 161, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 1، ص 161 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 1, pág. 161, que menciona lo que se ha declarado lícito, lo que no lo es y lo que se ha declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de Bidayat al-Mujtahid d'Ibn Rushd (tome 1, p. 161) mentionnant ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Halal and Haram Browser."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 1. cildinin 161. sayfasından, helal, haram ve haram olan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 1, halaman 161, yang menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dan dilarang; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
