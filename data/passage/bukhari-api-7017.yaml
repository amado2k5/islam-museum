label: { ar: "صحيح البخاري 7017 — ما كان يُكره، ما كُره", en: "Sahih al-Bukhari 7017 — what used to be disliked; what was disliked", ur: "صحیح بخاری 7017 — جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا", fr: "Sahih al-Bukhari 7017 — ce qui était réprouvé ; ce qui fut réprouvé", es: "Sahih al-Bujari 7017 — lo que se reprobaba; lo que se reprobó", tr: "Sahih el-Buhari 7017 — Hoş karşılanmayan şey, hoş karşılanmayan şey", id: "Sahih al-Bukhari 7017 — Apa yang tidak disukai, apa yang tidak disukai" }
text: "… وَبُشْرَى مِنَ اللَّهِ، فَمَنْ رَأَى شَيْئًا يَكْرَهُهُ فَلاَ يَقُصُّهُ عَلَى أَحَدٍ، وَلْيَقُمْ فَلْيُصَلِّ. قَالَ وَكَانَ يُكْرَهُ الْغُلُّ فِي النَّوْمِ، وَكَانَ يُعْجِبُهُمُ الْقَيْدُ، وَيُقَالُ الْقَيْدُ ثَبَاتٌ فِي الدِّينِ. وَرَوَى قَتَادَةُ وَيُونُسُ وَهِشَامٌ وَأَبُو هِلاَلٍ عَنِ ابْنِ سِيرِينَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ وَأَدْرَجَهُ بَعْضُهُمْ كُلَّهُ فِي الْحَدِيثِ، وَحَدِيثُ عَوْفٍ أَبْيَنُ. وَقَالَ يُونُسُ لاَ أَحْسِبُهُ إِلاَّ عَنِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7017، يرد فيه ذكر ما كان يُكره، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 7017 (Interpretation of Dreams), whose wording mentions what used to be disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 7017، جس کے الفاظ میں جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 7017, dont le texte mentionne ce qui était réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 7017, cuyo texto menciona lo que se reprobaba, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 7017 numaralı hadis, mekruh ve mekruh olan şeyleri sıralar. Farz, görev, itaat, tavsiye edilen, mekruh olan, haram olan ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle bir araya getirir. Derleyen kişi metinde yer alanları açıklar, ancak buna dayanarak dini bir hüküm vermez."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7017, menyebutkan apa yang dibenci dan apa yang tidak dibenci. Penyusun kitab tentang amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang dibenci, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
