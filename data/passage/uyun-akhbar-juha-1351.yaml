text: "كتاب الحوامج وقال اللحليل بن أحمد : أبلِغْ سُلمانَ أَنَّى عنه فى سَعَةٍ وفى غِنّى غيرَ أنى لستُ ذَا مالِ شُحًّا بنفسى، إلى لا أرّى أحدًا يموت هَزْلا ولا ييقَى على حايِ فالرزقُ عن قَدَ رِلا الضَّعفُ يَمنعُه ولا يَزِيدُكَ …"
