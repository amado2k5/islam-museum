text: "… حَتَّى يُسَبِّحَ رَكعتَي الضُّحى لاَ يقُول إِلَّا خَيْراً، غَفَرَ اللَّهُ لَهُ خَطَايَاهُ وإِنْ كَانَتْا مِثْلَ زَبَدِ البَحْرِ [ضعيف: أحمد: ١٥٦٢٣] . وفي الترمذي، و سنن ابن ماجه عن أبي هريرة رضي اللَّه عنه، قال: قال رسول اللّٰه وَف : مَنْ …"
summary:
