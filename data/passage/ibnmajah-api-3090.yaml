label: { ar: "سنن ابن ماجه 3090 — الكراهة", en: "Sunan Ibn Majah 3090 — dislike (karaha)", ur: "سنن ابن ماجہ 3090 — کراہت", fr: "Sunan Ibn Majah 3090 — la réprobation (karaha)", es: "Sunan Ibn Mayah 3090 — la reprobación (karaha)", tr: "Sünen İbni Mace 3090 — Beğenmedim", id: "Sunan Ibnu Majah 3090 — Tidak Suka" }
text: "… رُمْحٍ، أَنْبَأَنَا اللَّيْثُ بْنُ سَعْدٍ، جَمِيعًا عَنِ ابْنِ شِهَابٍ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ أَنْبَأَنَا صَعْبُ بْنُ جَثَّامَةَ، قَالَ مَرَّ بِي رَسُولُ اللَّهِ ـ وَأَنَا بِالأَبْوَاءِ أَوْ بِوَدَّانَ فَأَهْدَيْتُ لَهُ حِمَارَ وَحْشٍ فَرَدَّهُ عَلَىَّ فَلَمَّا رَأَى فِي وَجْهِيَ الْكَرَاهِيَةَ. قَالَ \" إِنَّهُ لَيْسَ بِنَا رَدٌّ عَلَيْكَ وَلَكِنَّا حُرُمٌ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3090، يرد فيه ذكر الكراهة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 3090 (Chapters on Hajj Rituals), whose wording mentions dislike (karaha). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3090، جس کے الفاظ میں کراہت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 3090, dont le texte mentionne la réprobation (karaha). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 3090, cuyo texto menciona la reprobación (karaha). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Majah'ın Sünen'inde yer alan 3090 numaralı hadiste, mekruh sayılan bir şeyden bahsedilir. Bu hadis, farz, ibadet, sünnet, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3090, menyebutkan sesuatu yang dianggap tidak disukai. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
