text: "… في مرآة الزمان مُعلَّقًا عن محمَّد بنِ الحسن الجوهري: قلتُ لذي النُّونِ: حَدِّثني بحديثٍ لَعَلِّي أَنتفعُ به في الرَّقائق، يكونُ عَونًا لي على هذا المذهبِ، فقال: للحديثِ رِجال، ولي شغلٌ بنفسي عنِ الحديثِ، وإِن كان الحديثُ مِن أَركانِ الدِّينِ، ولوَلا …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 35، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 2, p. 35, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 2، ص 35 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
