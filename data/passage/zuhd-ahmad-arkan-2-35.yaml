  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal (tome 2, p. 35) mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 35. sayfasından, İslam'ın temel direklerinden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. İslam'ın temel direkleri, imanın temelleri, imanın dalları ve müminin özelliklerine dair bilgiler içermektedir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 2, halaman 35, yang menyebutkan rukun Islam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini mencakup informasi tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
