text: "… مع مخالفيه فاعتذر عن ذلك بأن مشاركته في مثل هذه الحروب ليست داخلة في دعائم الإسلام وأن إسلامه يتحقق بدون ذلك. ثانياً: إن الإيمان باللّه وملائكته وكتبه ورسله وبالبعث والجنة والنار، كل ذلك لا بد منه مع الإيمان بالله ورسوله …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 103، يذكر أركان الإسلام، والإيمان بالله وملائكته وكتبه ورسله، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 103, that mentions the pillars of Islam, belief in God, His angels, His books and His messengers, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 103 کا اقتباس جس میں ارکانِ اسلام، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe, de Ibn Batta, volumen 1, pág. 103, que menciona los pilares del Islam: la creencia en Dios, sus ángeles, sus libros y sus mensajeros, uno de los artículos de fe. El extracto, tomado mediante lectura automática, se cita con un máximo de cuarenta palabras, según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye en su lista."
  fr: "Extrait du livre d'Ibn Batta, « al-Ibana al-Kubra » (Le Livre de la Foi), volume 1, page 103, mentionnant les piliers de l'islam: la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers (un des articles de foi). Extrait d'une numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
