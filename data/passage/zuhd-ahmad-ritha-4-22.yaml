text: "… العمي بصلى لغداة في نادي قومه اسه حة تطلع الشمس ثم ياسر بيته فيتم ويلقى له وسادتين تم يعلق بابه ثم يقول وحبا بمله يكاب رفي اما والله لا تهل نكم اليوم من نعى جبر عبدالله ابي عبن الرزاق انا …"
summary:
  ar: "مقطع من كتاب الزهد لأحمد بن حنبل، المجلد المصوَّر 4، ص 22، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Kitab al-Zuhd of Ahmad ibn Hanbal, scan volume 4, p. 22, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "کتاب الزہد ⁦(احمد بن حنبل)⁩، اسکین جلد 4، ص 22 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd d'Ahmad ibn Hanbal, volume numérisé 4, p. 22, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Kitab al-Zuhd de Ahmad ibn Hanbal, volumen escaneado 4, p. 22, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Ahmed ibn Hanbal'ın *Kitab al-Zuhd* (İzlahiyat Kitabı) adlı eserinin 4. cildinin 22. sayfasından, bir ağıt ve ölüm ilanı içeren bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgülerden derlenmiştir."
  id: "Cuplikan dari *Kitab al-Zuhd* (Kitab Askestisme) karya Ahmad ibn Hanbal, Jilid 4, halaman 22, yang berisi eulogi dan pengumuman kematian; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
