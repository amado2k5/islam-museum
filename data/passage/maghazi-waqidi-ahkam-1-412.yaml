text: "… أَربعين من قومها. فحدّثنى ابن أَبى سَبْرَة عن عُمارة بن غَزِيّة، قال : كان السَّبى منهم مَن مَنَّ عليه رسولُ اللّٰه بغير فداء، ومنهم من افتُدِي، وذلك بعد ما صار السَّبى فى أَيدى الرجال، فافتُدِيَت المرأَة والدُّرّيّة بست فرائض. وكانوا …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 412، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 412, whose wording mentions the obligation (farida); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 412 کا اقتباس جس میں فریضہ اور فرائض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Maghazi de al-Waqidi, volume numérisé 1, p. 412, dont le texte mentionne l'obligation (farida) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
