text: |-
  • ⁦(باب الميم)⁩.
  ٢٦٣
  محق ويعقوب وابراهيم لانّ العرب ما أعريتها الافى حال تعريفها ولم تنطق.بها الامعارف
  ولم تنقلها من تنكير الى تع-ريف ⁦(برشم)⁩ برشم الرجل اذا وجم وأظه والحزن والبرشمة
  أيضا والبرشام حسدة النظر عم برعوم الزهر قبل أن يتفتح وكذلك البرعم وبرعمت
  الشهرة اذا أخرجت براعيمها طم لبرطام الرجل الضخم الشفة والبرطعة الانتفاخ
  من الغضب وتبرطم الرجسل أى تغضب من كلام رهم البرهمة ادامة النظر وسكون
  الطرف وقال • وتظراهون الهوسابرهما * وابراهيم اسم أعجمى وقيه لغات ابراهام
  وابراهم وابراهم بحذف الياء وقال
  عذت بماعاذ به ابراهم * مستقبل القبلة وهو قائم • انى لك اللهم عان راغم
  وتصغير ابراهيم أبيره وذلك لات الالف من الاصل لات بعدها أربعة أحرف أصول والهمزة
  لا تلحق بنبات الاريعة زائدة فى أوّلها وذلك يوحب حذف آخره كما يحذف من سفرحل فيقال
  سفسيرح وكذلك القول فى اسمعيل واسرافيل وهذا قول المبرد وبعضهم يتوهم أن الهمزة أ
  زائدة اذا كان الاسم أعجميا ذلم يعلم اشتقاقه فيصغره على بريميم وسميعيل وسريفيل وهذا قول
  حيبويه وهو حسن والاوّل قياس ومنهسم من يقول بريه بطرح الهمزة والميم والبراهمة قوم
  لا يجوّزون على اللّٰه بعثة الرسل ⁦(بزم)⁩ بزم عليه ييزم ويبزم أى عض بمقدم أسنانه ويقال
  أيضايزمت الناقة اذاحلبتها بالسباية والابهام واليزمة فى الاكل مثل الوجبة وكذلت
  الوزمة والابزيم الذى فى رأس المنطقة والجمع الابازيم والبزيم خيط القلادة قال انشاءر
  هم ماهم فى كل يوم كريهة * اذا الكاءب الحسنا«طاح بزعمها
  وقال آخر
  تركنالث لاتوفى بجارأجرته • كأنك ذات الودع أودى بزيمها
  وقول الشاعر
  وجاوًا ناترين فسلم يؤبوا • بابلمة تشة على بريم
  فيروى بالباء والراه ويقال هو باقة بقل ويقال فضلة الزادويق ال ه والطلع يشق ليلقّح ثم يشد
  بخوصة ( سم التبسم دون الضحك بقال بسم بالفتح يبسم بسما فهو باسم وابتسم
  وتيسم والمبسم التغر مثال الجلس من جلس يجلس ورجل. بسام وبسام كنير التبسم
  ⁦(بسطم)⁩ بسطام ليس من أسعاء العرب وانماسمى قيس بن مسعودابنه بطاماباسم
  كل من ملوك فارس كماسموا قابوس ودخثنوس فعربوه بكسرالياء شم البنم
  التخمة يقال بشمت من الطعام بالكسر وبشم الفصيل من كثرة شرب اللبن وقد أبشمه
  الطعام قال الراجز• ولم يجنئ عن طعام يشمه • ويشمت منه ينما أى سثمت والبشام شجر
  طيب الرجح يستاك به وقال
  أقذ كريوم تصقل عارضيها • بفرع بشامة سق البشام
  صم) ح-كى التوزى عن أبى هبيدة البحم مابين مارف انخنصر الى طرف البنصر
  والعتب مابين البنصر والوسطى والرتب ما بين الوسطى والسبابة والفترمابين السسبابة
  والابهام والشبر مابين الابهام والخنصر والموت مابين كل اصيعين طولا طم
