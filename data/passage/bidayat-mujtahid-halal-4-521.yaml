text: "… سلم أن هذه الأسماء لغوية، ورأى أن للاسم المشترك عموماً؛ لزمه أن يقول بتحريمها، ولذلك توقف مالك في ذلك وقال: أنتم تسمونه خنزيراً. فهذه حال الحيوان المحرم الأكل في الشرع والحيوان المباح الأكل. وأما النبات الذي هو غذاء فكله حلال …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 521، يذكر الحلال، والتحريم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
