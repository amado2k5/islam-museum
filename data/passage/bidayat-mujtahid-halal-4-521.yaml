  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 521 کا اقتباس جس میں حلال، تحریم، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
