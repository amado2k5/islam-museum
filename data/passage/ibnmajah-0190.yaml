label:
  ar: "ابن ماجه 190 — كلم الله أبا جابر كفاحا: تمن علي أعطك"
  en: "Ibn Majah 190 — God spoke to Jabir's father face to face: wish, and I shall give"
  ur: "ابن ماجہ 190 — اللہ نے جابر کے والد سے روبرو کلام کیا: تمنا کرو، میں دوں گا"
text: "يا جابر ألا أخبرك ما قال الله لأبيك . وقال يحيى في حديثه فقال يا جابر مالي أراك منكسرا . قال قلت يا رسول الله استشهد أبي وترك عيالا ودينا . قال أفلا أبشرك بما لقي الله به أباك . …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 190: كلم الله أبا جابر كفاحا: تمن علي أعطك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 190: God spoke to Jabir's father face to face: wish, and I shall give. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 190: اللہ نے جابر کے والد سے روبرو کلام کیا: تمنا کرو، میں دوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
