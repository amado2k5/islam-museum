label: { ar: "الموطأ 951 — محمد بن أبي بكر الثقفي سأل أنس بن مالك وهما غاديان من منى إلى عرفة: كيف كنتم تصنعون في هذا اليوم مع رسول الله؟ قال: كان المهل منا يهل فلا ينكر عليه، ويكبر المكبر فلا ينكر عليه", en: "Muwatta 951", es: "Muwatta 951", fr: "Muwatta 951", ur: "موطا 951", tr: "El-Muvatta 951 — Muhammed ibn Abi Bekr el-Sakkafi, Mina'dan Arafat'a giderken Enes ibn Malik'e sordu: \"Bugün Allah'ın Resulü ile ne yaptınız?\" O şöyle dedi: \"Bizden kim telbiye okursa okur, kimse itiraz etmezdi; kim tekbir getirirse o da itiraz etmezdi.\"", id: "Al-Muwatta 951 — Muhammad ibn Abi Bakr al-Thaqafi bertanya kepada Anas ibn Malik, ketika mereka sedang dalam perjalanan dari Mina ke Arafat: “Apa yang kamu lakukan pada hari ini bersama Rasulullah?” Dia menjawab: “Siapa pun di antara kami yang membaca Talbiyah akan melakukannya dan beliau tidak keberatan, dan siapa pun yang membaca Takbir juga tidak keberatan.”" }
text: "كان المهل منا يهل فلا ينكر عليه، ويكبر المكبر فلا ينكر عليه"
summary:
  ar: "أول حديث في باب قطع التلبية. يرويه مالك عن محمد بن أبي بكر الثقفي أنه سأل أنس بن مالك وهما غاديان من منى إلى عرفة: كيف كنتم تصنعون في هذا اليوم مع رسول الله؟ فقال: كان المهل منا يهل فلا ينكر عليه، ويكبر المكبر فلا ينكر عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي والمزي، وسويد، والقعنبي، والتنيسي عند البخاري (1659)، وابن القاسم، ومنصور، ويحيى بن يحيى النيسابوري عند مسلم (4/72). {cite:muwatta-maruf-1997 p.454}"
  tr: "Telbiyenin kesilmesiyle ilgili bölümdeki ilk hadis. Bu hadis, Malik tarafından Muhammed ibn Ebu Bekr el-Sakkafi'den rivayet edilmiştir. Muhammed ibn Ebu Bekr el-Sakkafi, Mina'dan Arafat'a giderken Enes ibn Malik'e şöyle sormuştur: \"Bugün Allah'ın Resulü ile ne yaptınız?\" O da şöyle cevap vermiştir: \"Bizden kim telbiye okursa okur, o da itiraz etmez; kim tekbir getirirse o da itiraz etmez.\" Editör, bu hadisin Malik'ten Ebu Mus'ab tarafından, onun aracılığıyla da İbn Hibban, el-Baghawi, el-Mizzi, Suwaid, el-Ka'nabi ve el-Tunisi tarafından Buhari'de (1659) ve İbn el-Kâsim, Mansur ve Yahya ibn Yahya el-Naysaburi tarafından Müslim'de (4/72) rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.454}"
  id: "Hadits pertama dalam bab tentang penghentian Talbiyah. Diriwayatkan oleh Malik dari Muhammad ibn Abi Bakr al-Thaqafi, yang berkata bahwa ia bertanya kepada Anas ibn Malik, ketika mereka sedang dalam perjalanan dari Mina ke Arafat: “Apa yang kamu lakukan pada hari ini bersama Rasulullah?” Beliau menjawab: “Siapa pun di antara kami yang membaca Talbiyah akan melakukannya dan beliau tidak keberatan, dan siapa pun yang membaca Takbir juga tidak keberatan.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan melalui beliau oleh Ibn Hibban, al-Baghawi, al-Mizzi, Suwaid, al-Qa’nabi, dan al-Tunisi dalam al-Bukhari (1659), dan oleh Ibn al-Qasim, Mansur, dan Yahya ibn Yahya al-Naysaburi dalam Muslim (4/72). {cite:muwatta-maruf-1997 p.454}"
