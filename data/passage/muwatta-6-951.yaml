label: { ar: "الموطأ 951 — محمد بن أبي بكر الثقفي سأل أنس بن مالك وهما غاديان من منى إلى عرفة: كيف كنتم تصنعون في هذا اليوم مع رسول الله؟ قال: كان المهل منا يهل فلا ينكر عليه، ويكبر المكبر فلا ينكر عليه", en: "Muwatta 951" }
text: "كان المهل منا يهل فلا ينكر عليه، ويكبر المكبر فلا ينكر عليه"
summary:
  ar: "أول حديث في باب قطع التلبية. يرويه مالك عن محمد بن أبي بكر الثقفي أنه سأل أنس بن مالك وهما غاديان من منى إلى عرفة: كيف كنتم تصنعون في هذا اليوم مع رسول الله؟ فقال: كان المهل منا يهل فلا ينكر عليه، ويكبر المكبر فلا ينكر عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي والمزي، وسويد، والقعنبي، والتنيسي عند البخاري (1659)، وابن القاسم، ومنصور، ويحيى بن يحيى النيسابوري عند مسلم (4/72). {cite:muwatta-maruf-1997 p.454}"
