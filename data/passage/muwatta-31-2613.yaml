label: { ar: "الموطأ 2613 — ابن شهاب عن عبد الله بن عامر: رجوع عمر من سرغ بعد حديث ابن عوف", en: "Muwatta 2613" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبد الله بن عامر بن ربيعة أن عمر بن الخطاب خرج إلى الشام، فلما جاء سرغ بلغه أن الوباء قد وقع بالشام، فأخبره عبد الرحمن بن عوف أن رسول الله قال: إذا سمعتم به بأرض فلا تقدموا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارا منه. فرجع عمر من سرغ. {cite:muwatta-maruf-1997 p.476}"
