label: { ar: "الموطأ 2613 — ابن شهاب عن عبد الله بن عامر: رجوع عمر من سرغ بعد حديث ابن عوف", en: "Muwatta 2613", es: "Muwatta 2613", fr: "Muwatta 2613", ur: "موطا 2613", tr: "El-Muvatta 2613 — İbn Şihab, Abdullah bin Amir'den rivayetle: İbn Awf hadisinden sonra Ömer'in Sargh'tan dönüşü", id: "Al-Muwatta 2613 — Ibn Shihab berdasarkan riwayat Abdullah bin Amir: Kepulangan Umar dari Sargh setelah hadits Ibn Awf" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبد الله بن عامر بن ربيعة أن عمر بن الخطاب خرج إلى الشام، فلما جاء سرغ بلغه أن الوباء قد وقع بالشام، فأخبره عبد الرحمن بن عوف أن رسول الله قال: إذا سمعتم به بأرض فلا تقدموا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارا منه. فرجع عمر من سرغ. {cite:muwatta-maruf-1997 p.476}"
  tr: "Malik, İbn Şihab'dan, o da Abdullah ibn Amir ibn Rabi'ah'tan rivayet ettiğine göre, Ömer ibn el-Hattab Suriye'ye gitti. Sargh'a vardığında, Suriye'de bir salgın çıktığını duydu. Abdül-Rahman ibn Avf ona, Allah Resulü'nün şöyle buyurduğunu bildirdi: \"Bir yerde böyle bir şey duyarsan oraya gitme; bulunduğun yerde böyle bir şey çıkarsa da oradan kaçmayı bırakma.\" Bunun üzerine Ömer Sargh'tan geri döndü. {cite:muwatta-maruf-1997 s.476}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Abdullah ibn Amir ibn Rabi'ah, bahwa Umar ibn al-Khattab pergi ke Suriah. Ketika sampai di Sargh, ia mendengar bahwa wabah penyakit telah melanda Suriah. Abd al-Rahman ibn Awf memberitahunya bahwa Rasulullah SAW telah bersabda: \"Jika kamu mendengar tentang wabah di suatu negeri, janganlah kamu pergi ke negeri itu, dan jika wabah itu melanda negeri tempat kamu berada, janganlah kamu meninggalkan negeri itu untuk melarikan diri.\" Maka Umar kembali dari Sargh. {cite:muwatta-maruf-1997 p.476}"
