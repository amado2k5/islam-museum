text: |-
  ٤٠٠
  ⁦(ياب الرا٠)⁩
  ⁦(مكر)⁩
  مصورا ابن السكيت يقال نعجة ماصرة ولجبة وجدودوء زوز أى قلبلة اللبن وفلان مصر
  الامصار كمأ يقال مدن المدائن ⁦(مضر)⁩، مضر اللبن عضرمض ورا أى صار ماضراوهو الذى
  يحذى اللسان قبسل أن يروب قال أبو عبيد قال أبو البيدا. اسم ٠ضر مشتق منه وه ومضربن
  نزاربنمعدّين عدنان واغاقيل له مضر الحمراء وقبل لاخيه ربيعة الفرس لانهمالمااقتسها
  البران أعطى مضر الذهب وهو يؤنت وأعطلى ربيعة الخيل ويقال كان شعارهم فى الموب
  العمائم والرايات الحمر ولاهل اليمن الصفر معت بعض أهل العلم يفسريه قول أبى تمام
  بصف الريع
  محرة مصفرة فكأنها • عصب تمن فى الوغى وتضر
  وقولهم ذهب دمه خضر امضرا أى حدرا ومضرائساع له وحكى الكسائى بضرايالبا.
  وفى الحديث مضر ضرها اللّٰه فى النار نرى أصله من مضر اللين وهوقرصه اللسان وحذيه
  ه ون الكثرة وامبغة و التبه بالمية ولمرة طبيخ اللن ام
  ( مطر المطر واحد الامطار ومطرت السماء تطر مطرا وأمطرها اللّٰه وقد مطرنا وفاس
  بقولون مطرت السماء وأمطرت بعنى ومطر الرجل فى الارض مطورا أى ذهب وتطارمشله
  ويقال ذهب البعير فلا أدرى من مطربه ومرّ الفرس يمطر مطرا ومطورا أى أسرع والتمطر
  مثله قال لبيديرثى قيس بن جزء فى قتلى هوازن
  أنته المنايافوق جردا شطبة • تدف دفيف الطائر المتقطر
  وراكبه متمطر أيضا والاستخطار الاستسقاء ومنه قول الفرزدق
  واستطروا من قريس كل متخدع * أى سلوه أن يعطى كالمطرمثلا والمعطر
  ما يليس فى المطريتوقى به ⁦(معر)⁩ المعرسقوط الشعر وقد معر الرجل بالكسرفهو
  معر والامعر القليل الشعر والمكان القليل النبات وأرض معرة فليلة النبات: عن يع-قوب
  وتمحرشعره تساقط وتمعرلونه عند الغضب تغيروأمعر الرجل افتقر ⁦(.غر)⁩ المغرة الطين
  الاحر وقد يحرّتك والامغر الاحر اشعر والجلد على لون المغرة والامغر من الخيل نحومن
  الاشقروه والذى شقرنه تعلوها. غرة أى كدرة وأمغرت الشاة اذا حلبت فخرج مع ابنها
  دم من داءبيهافان كأن ذلك من عادتها فهى ممغارابن السكيت يقال مغرفى البلاداذ ادهب
  فأسرع ورأيته يمغربه بعيره وقال أبو صاعد مغرت فى الآرض مغرة من مطروهو مطرة صالحة
  ⁦(مقر)⁩ مقر الشى بالكسر يقر مقرا أى صارمرّ افهوشئمر والمرأيضا الصبرعن
  الاصعى وربعماسكن قال الراجز أمرّ من صبرومقر وحفض وامقر الشئ أى
  صارمرا قال لبيد
  ممقرمى على أعدائه • وعلى الادنين حلو كالعسل .
  واللبن الحامض مقر أيضاءن ابن الاعوابى والمقرساكن دق العنق وقد مر عنقهعة رهاعن
  اين السكيت وسمك عة وديمة رفى ماء وملح ولا تقل صنور مكر) المكر الاحتيال
  والخديعة وقدمكربه يمكرفه وما كرومكار والمكرأيضاالمغرة وقد مكره فامتكر أى خض
  فاختضب قال الشاءر القطامى
  ضرب تهك الابطال فه • وتتكر المعى منه امتكارا
  والمكور ضرب من الشهجر قال العجاج حط فى عاقى وفى مكور الواجدم
  قال
