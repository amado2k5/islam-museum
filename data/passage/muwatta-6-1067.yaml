summary:
  ar: "قول يرويه يحيى عن مالك: سمع بعض أهل العلم يستحب إذا رفع الذي يطوف بالبيت يده عن الركن اليماني أن يضعها على فيه. ويذكر المحقق أن ابن وضاح حذف لفظة «اليماني» من رواية يحيى، وأن ابن عبد البر رأى رواية «اليماني» أصوب، وأن الحديث موصول في الصحيحين عن زيد بن أسلم عن أبيه. {cite:muwatta-maruf-1997 p.493}"
