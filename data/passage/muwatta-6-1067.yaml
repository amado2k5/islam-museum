label: { ar: "الموطأ 1067 — مالك: سمع بعض أهل العلم يستحب إذا رفع الذي يطوف يده عن الركن اليماني أن يضعها على فيه", en: "Muwatta 1067", es: "Muwatta 1067", fr: "Muwatta 1067", ur: "موطا 1067", tr: "El-Muvatta 1067 — Malik: Bazı âlimlerden, tavaf yapan kişinin Yemen köşesinden elini kaldırdığında ağzına koymasının tavsiye edildiğini duymuşlardır.", id: "Al-Muwatta 1067 — Malik: Sebagian ulama mendengar bahwa dianjurkan agar ketika orang yang melakukan Tawaf mengangkat tangannya dari Sudut Yaman, ia meletakkannya di mulutnya." }
summary:
  ar: "قول يرويه يحيى عن مالك: سمع بعض أهل العلم يستحب إذا رفع الذي يطوف بالبيت يده عن الركن اليماني أن يضعها على فيه. ويذكر المحقق أن ابن وضاح حذف لفظة «اليماني» من رواية يحيى، وأن ابن عبد البر رأى رواية «اليماني» أصوب، وأن الحديث موصول في الصحيحين عن زيد بن أسلم عن أبيه. {cite:muwatta-maruf-1997 p.493}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Bazı âlimler, Kâbe'yi tavaf eden birinin Yemen köşesinden elini kaldırdığında ağzına koymasının tavsiye edildiğini söylemişlerdir. Araştırmacı, İbn Waddah'ın Yahya'nın rivayetinden \"Yemenli\" kelimesini çıkardığını, İbn Abd al-Barr'ın ise \"Yemenli\" versiyonunu daha doğru bulduğunu ve hadisin iki Sahih'te de Zeyd ibn Aslam'ın babasından rivayetiyle birbirine bağlı olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.493}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Sebagian ulama mengatakan bahwa dianjurkan ketika seseorang yang melakukan tawaf di Ka'bah mengangkat tangannya dari Sudut Yaman, hendaknya ia meletakkannya di mulutnya. Peneliti menyebutkan bahwa Ibnu Waddah menghilangkan kata \"Yaman\" dari riwayat Yahya, dan bahwa Ibnu Abd al-Barr menganggap versi \"Yaman\" lebih akurat, dan bahwa hadits tersebut dihubungkan dalam dua kitab Sahih dari Zaid bin Aslam dari ayahnya. {cite:muwatta-maruf-1997 p.493}"
