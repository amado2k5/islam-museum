label: { ar: "الموطأ، كتاب كراء الأرض", en: "Muwatta, Book of Renting Land (kira al-ard)", es: "Muwatta, Libro sobre el alquiler de tierras (kira al-ard)", fr: "Muwatta, Livre de location de terres (kira al-ard)", ur: "موطا، کرائے کی زمین کی کتاب ⁦(قرہ العرد)⁩", tr: "Al-Muwatta, Arazi Kiralama Kitabı", id: "Al-Muwatta, Kitab Sewa Tanah" }
summary:
  ar: "كتاب كراء الأرض، الكتاب العشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 6 نصوص (2073–2078) في باب واحد، من الصفحة 249 إلى الصفحة 250 من ملف PDF المجلد الثاني. يبدأ بنهي النبي عن كراء المزارع ورواية رافع بن خديج، ويذكر كراء الأرض بالذهب والورق عند سعيد بن المسيب وسالم وابن شهاب وعبد الرحمن بن عوف، ويختم بكراء الأرض بجزء من غلتها. {cite:muwatta-maruf-1997 p.249} {cite:muwatta-maruf-1997 p.250}"
  en: "The Book of Renting Land (kira al-ard), twentieth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 6 reports (2073–2078) in one bab, PDF pp. 249–250 of volume 2. It opens with the report of Rafi' ibn Khadij on renting farms, gives the rulings of Sa'id ibn al-Musayyab and Salim on renting for gold and silver, and closes with the question of renting land for a share of its yield."
  es: "El Libro del Arrendamiento de Tierras (kira al-ard), vigésimo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 6 informes (2073–2078) en un bab, PDF pp. 249–250 del volumen 2. Comienza con el informe de Rafi' ibn Khadij sobre el arrendamiento de granjas, da los dictámenes de Sa'id ibn al-Musayyab y Salim sobre el arrendamiento a cambio de oro y plata, y cierra con la cuestión del arrendamiento de tierras a cambio de una parte de su producción."
  fr: "Le Livre de la location des terres (kira al-ard), vingtième livre de la Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 6 rapports (2073–2078) dans un seul bab, PDF pp. 249–250 du volume 2. Il s'ouvre sur le rapport de Rafi' ibn Khadij sur la location des fermes, donne les décisions de Sa'id ibn al-Musayyab et Salim sur la location contre de l'or et de l'argent, et se termine par la question de la location des terres contre une part de leur récolte."
  ur: "کرایہ پر لینے والی زمین کی کتاب ⁦(قرہ العرد)⁩، یحییٰ بن یحییٰ کی تجدید میں موطا کی بیسویں کتاب ⁦(موضوع 1997)⁩، جلد 2: 6 رپورٹس (2073-2078) ایک باب میں، پی ڈی ایف پی پی 249-250 کے ساتھ رینٹ 2 کی کھلی رپورٹ کے ساتھ۔ کھیت، سونے اور چاندی کے کرایہ پر دینے کے بارے میں سعید بن المسیب اور سلیم کے احکام بیان کرتا ہے، اور اس کی پیداوار کے ایک حصے کے لیے زمین کرائے پر دینے کے سوال کے ساتھ ختم ہوتا ہے۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği, El-Muvatta'nın yirminci kitabı olan Toprak Kirası Kitabı, Beşar Awad Maruf'un (1997) baskısında, İkinci Cilt: 6 metin (2073–2078) tek bir bölümde, İkinci Cilt PDF dosyasının 249. sayfasından 250. sayfasına kadar yer almaktadır. Peygamberin çiftlik kiralama yasağı ve Rafi' ibn Khadij'in rivayetiyle başlar ve Sa'id ibn al-Musayyib, Salim, İbn Şihab ve Abd al-Rahman ibn Awf'a göre altın ve gümüş karşılığında toprak kiralamaktan bahseder ve ürünün bir kısmı karşılığında toprak kiralamayla sona erer. {cite:muwatta-maruf-1997 s.249} {cite:muwatta-maruf-1997 s.250}"
  id: "Kitab Sewa Tanah, kitab kedua puluh Al-Muwatta' dalam riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 6 teks (2073–2078) dalam satu bab, dari halaman 249 hingga halaman 250 dari file PDF Jilid Dua. Kitab ini dimulai dengan larangan Nabi Muhammad SAW untuk menyewa ladang dan riwayat Rafi' ibn Khadij, dan menyebutkan penyewaan tanah dengan emas dan perak menurut Sa'id ibn al-Musayyib, Salim, Ibn Shihab, dan Abd al-Rahman ibn Awf, dan diakhiri dengan penyewaan tanah dengan sebagian hasil panennya. {cite:muwatta-maruf-1997 p.249} {cite:muwatta-maruf-1997 p.250}"
