summary:
  ar: "كتاب كراء الأرض، الكتاب العشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 6 نصوص (2073–2078) في باب واحد، من الصفحة 249 إلى الصفحة 250 من ملف PDF المجلد الثاني. يبدأ بنهي النبي عن كراء المزارع ورواية رافع بن خديج، ويذكر كراء الأرض بالذهب والورق عند سعيد بن المسيب وسالم وابن شهاب وعبد الرحمن بن عوف، ويختم بكراء الأرض بجزء من غلتها. {cite:muwatta-maruf-1997 p.249} {cite:muwatta-maruf-1997 p.250}"
  en: "The Book of Renting Land (kira al-ard), twentieth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 6 reports (2073–2078) in one bab, PDF pp. 249–250 of volume 2. It opens with the report of Rafi' ibn Khadij on renting farms, gives the rulings of Sa'id ibn al-Musayyab and Salim on renting for gold and silver, and closes with the question of renting land for a share of its yield."
