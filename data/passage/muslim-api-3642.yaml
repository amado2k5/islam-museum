label: { ar: "صحيح مسلم 3642 — الأب والأبوة", en: "Sahih Muslim 3642 — the father and fatherhood", ur: "صحیح مسلم 3642 — باپ اور والدیت", es: "Sahih Muslim 3642 — El padre y la paternidad", fr: "Sahih Muslim 3642 — Le père et la paternité", tr: "Sahih Muslim 3642 — Baba ve Babalık", id: "Sahih Muslim 3642 — Ayah dan Peran Ayah" }
text: "… بِكَذَا وَكَذَا وَاللَّهُ يَغْفِرُ لَكَ \". قَالَ قُلْتُ هُوَ لَكَ يَا نَبِيَّ اللَّهِ. قَالَ وَقَالَ لِي \" أَتَزَوَّجْتَ بَعْدَ أَبِيكَ \". قُلْتُ نَعَمْ. قَالَ \" ثَيِّبًا أَمْ بِكْرًا \". قَالَ قُلْتُ ثَيِّبًا. قَالَ \" فَهَلاَّ تَزَوَّجْتَ بِكْرًا تُضَاحِكُكَ وَتُضَاحِكُهَا وَتُلاَعِبُكَ وَتُلاَعِبُهَا \". قَالَ أَبُو نَضْرَةَ فَكَانَتْ كَلِمَةً يَقُولُهَا الْمُسْلِمُونَ. افْعَلْ كَذَا وَكَذَا وَاللَّهُ يَغْفِرُ لَكَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3642، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3642 (The Book of Suckling), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 3642، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 3642 (El Libro de la Lactancia), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 3642 (Le Livre de l'allaitement), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 3642 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3642, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
