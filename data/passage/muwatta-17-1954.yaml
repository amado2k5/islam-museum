label: { ar: "الموطأ 1954 — مالك: إذا باع رجل سلعة قامت عليه بمائة دينار، للعشرة أحد عشر، ثم جاءه بعد ذلك فقال إنها قامت عليه بتسعين دينارا، وقد فاتت السلعة، خير البائع بين قيمة سلعته يوم قبضت، وبين الربع على التسعين", en: "Muwatta 1954", es: "Muwatta 1954", fr: "Muwatta 1954", ur: "موطا 1954", tr: "El-Muvatta 1954 — Malik: Bir adam kendisine yüz dinara mal olan bir malı satar, daha sonra geri dönüp malın kendisine doksan dinara mal olduğunu söyler ve mal artık mevcut değilse, satıcının malı aldığı günkü değeri ile doksan dinarın dörtte biri arasında seçim yapma hakkı vardır.", id: "Al-Muwatta 1954 — Malik: Jika seseorang menjual suatu barang yang harganya seratus dinar, kemudian penjual kembali dan mengatakan bahwa harganya sembilan puluh dinar, dan barang tersebut sudah tidak tersedia lagi, maka penjual memiliki pilihan antara nilai barang tersebut pada hari ia menerimanya, dan seperempat dari sembilan puluh dinar tersebut." }
summary:
  ar: "قال مالك: وإذا باع رجل سلعة قامت عليه بمائة دينار، للعشرة أحد عشر. ثم جاءه بعد ذلك فقال: إنها قامت عليه بتسعين دينارا، وقد فاتت السلعة، خير البائع. فإن أحب فله قيمة سلعته يوم قبضت منه، إلا أن تكون القيمة أكثر من الثمن الذي وجب له به البيع أول يوم، فلا يكون له أكثر من ذلك، وذلك مائة دينار وعشرة دنانير. وإن أحب ضرب له الربع على التسعين، إلا أن يكون الذي بلغت سلعته من الثمن أقل من القيمة، فيخير في الذي بلغت سلعته، وفي رأس ماله وربحه، وذلك تسعة وتسعون دينارا. {cite:muwatta-maruf-1997 p.199}"
  tr: "Malik şöyle dedi: Bir adam yüz dinar değerinde bir malı satarsa, satıcı her on dinar için on bir dinar alır. Daha sonra satıcı ona gelip malın doksan dinar değerinde olduğunu ve artık mevcut olmadığını söyler. Satıcının iki seçeneği vardır. İsterse, malı aldığı günkü değerini almaya hak kazanır; ancak değer, ilk gün kararlaştırılan satış fiyatından yüksekse, yüz on dinardan fazlasını almaya hak kazanamaz. İsterse, doksan dinarın dörtte birini almaya hak kazanır; ancak malın ilk günkü değeri değerinden düşükse, malın ilk günkü değerini veya sermayesini ve karını (doksan dokuz dinar) alma seçeneğine sahiptir. {cite:muwatta-maruf-1997 s.199}"
  id: "Malik berkata: Jika seseorang menjual barang yang nilainya seratus dinar, maka penjual menerima sebelas dinar untuk setiap sepuluh dinar. Kemudian, penjual datang kepadanya dan mengatakan bahwa barang tersebut bernilai sembilan puluh dinar, dan barang tersebut tidak lagi tersedia. Penjual memiliki dua pilihan. Jika ia mau, ia berhak atas nilai barangnya pada hari ia menerimanya, kecuali jika nilainya lebih besar dari harga yang disepakati pada hari pertama penjualan, dalam hal ini ia tidak berhak atas lebih dari itu, yaitu seratus sepuluh dinar. Jika ia mau, ia diberikan seperempat dari sembilan puluh dinar, kecuali jika harga barang tersebut kurang dari nilainya, dalam hal ini ia memiliki pilihan antara nilai barang tersebut atau modal dan keuntungannya, yaitu sembilan puluh sembilan dinar. {cite:muwatta-maruf-1997 p.199}"
