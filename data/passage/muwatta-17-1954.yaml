label: { ar: "الموطأ 1954 — مالك: إذا باع رجل سلعة قامت عليه بمائة دينار، للعشرة أحد عشر، ثم جاءه بعد ذلك فقال إنها قامت عليه بتسعين دينارا، وقد فاتت السلعة، خير البائع بين قيمة سلعته يوم قبضت، وبين الربع على التسعين", en: "Muwatta 1954" }
summary:
  ar: "قال مالك: وإذا باع رجل سلعة قامت عليه بمائة دينار، للعشرة أحد عشر. ثم جاءه بعد ذلك فقال: إنها قامت عليه بتسعين دينارا، وقد فاتت السلعة، خير البائع. فإن أحب فله قيمة سلعته يوم قبضت منه، إلا أن تكون القيمة أكثر من الثمن الذي وجب له به البيع أول يوم، فلا يكون له أكثر من ذلك، وذلك مائة دينار وعشرة دنانير. وإن أحب ضرب له الربع على التسعين، إلا أن يكون الذي بلغت سلعته من الثمن أقل من القيمة، فيخير في الذي بلغت سلعته، وفي رأس ماله وربحه، وذلك تسعة وتسعون دينارا. {cite:muwatta-maruf-1997 p.199}"
