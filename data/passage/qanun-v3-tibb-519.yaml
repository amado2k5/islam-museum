text: "… المعاجين والجوارشنات وغيرها من الأدوية المركبة التي تصلح للأمراض في عضو عضو برد الرأس : ينفع من الشيلثا والأنقرديا والكمّوني سعوط له. ثقل الرأس : تنفعه نقوع الأيارج. فيما ينقي الرأس : الحب البرمكي. الصداع البارد العتيق: سوطيرا، شيلثا فيما …"
