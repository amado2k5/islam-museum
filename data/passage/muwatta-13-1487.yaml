label: { ar: "الموطأ 1487 — عروة بن الزبير: في ولد الملاعنة وولد الزنا، إذا مات ورثته أمه حقها في كتاب الله، وإخوته لأمه حقوقهم، وما بقي فللمسلمين", en: "Muwatta 1487", es: "Muwatta 1487", fr: "Muwatta 1487", ur: "موطا 1487", tr: "El-Muvatta 1487 — Urve ibn el-Zübeyr: Zina ile suçlanan kadının çocuğu ve fuhuştan doğan çocuk hakkında, eğer ölürse, annesi Allah'ın Kitabına göre kendi payını miras alır, anne tarafından kardeşleri haklarını miras alır ve geriye kalan kısım Müslümanlara kalır.", id: "Al-Muwatta 1487 — Urwah ibn al-Zubayr: Mengenai anak dari seorang wanita yang dituduh berzina dan anak hasil hubungan di luar nikah, jika ia meninggal, ibunya mewarisi bagiannya sesuai dengan Kitab Allah, saudara-saudara kandung dari pihak ibunya mewarisi hak mereka, dan sisanya menjadi milik kaum Muslimin." }
summary:
  ar: "يروي مالك أنه بلغه أن عروة بن الزبير كان يقول في ولد الملاعنة وولد الزنا، إنه إذا مات ورثته أمه حقها في كتاب الله، وإخوته لأمه حقوقهم، ويرث البقية موالي أمه إن كانت مولاة، وإن كانت عربية ورثت حقها، وورث إخوته لأمه حقوقهم، وكان ما بقي للمسلمين. {cite:muwatta-maruf-1997 p.26}"
  tr: "Malik, Urva ibn el-Zübeyr'in zina veya zina ile suçlanan bir kadının çocuğu hakkında şöyle dediğini duyduğunu aktarır: Eğer çocuk ölürse, annesi Allah'ın Kitabına göre kendi payını alır, anne tarafından kardeşleri de kendi paylarını alır. Geri kalan kısım, eğer anne köle ise azat edilmiş kölelerine, eğer Arap ise kendi payını alır, anne tarafından kardeşleri de kendi paylarını alır ve geriye kalan kısım Müslümanlara kalır. {cite:muwatta-maruf-1997 s.26}"
  id: "Malik menceritakan bahwa ia mendengar Urwah ibn al-Zubayr pernah berkata mengenai anak dari seorang wanita yang dituduh berzina atau melakukan perzinahan, bahwa jika anak itu meninggal, ibunya akan mewarisi bagiannya sesuai dengan Kitab Allah, dan saudara-saudara kandung dari pihak ibunya akan mewarisi bagian mereka. Sisanya akan diberikan kepada budak-budak yang telah dibebaskan ibunya jika ibunya adalah budak yang telah dibebaskan, dan jika ibunya seorang Arab, ia akan mewarisi bagiannya, dan saudara-saudara kandung dari pihak ibunya akan mewarisi bagian mereka, dan sisanya akan diberikan kepada kaum Muslimin. {cite:muwatta-maruf-1997 p.26}"
