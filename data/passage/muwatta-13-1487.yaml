summary:
  ar: "يروي مالك أنه بلغه أن عروة بن الزبير كان يقول في ولد الملاعنة وولد الزنا، إنه إذا مات ورثته أمه حقها في كتاب الله، وإخوته لأمه حقوقهم، ويرث البقية موالي أمه إن كانت مولاة، وإن كانت عربية ورثت حقها، وورث إخوته لأمه حقوقهم، وكان ما بقي للمسلمين. {cite:muwatta-maruf-1997 p.26}"
