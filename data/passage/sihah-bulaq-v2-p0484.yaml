text: |-
  * ⁦(باب القاف)⁩ ف
  ١٠٣
  الطاء الاولى كما تقول فى تصفير اضطراب ضتيريب تقلب الطاءتاء لتحرك الضاد⁦(طوق)⁩
  الطوق واحد الاطواق وقد ط وقته قتطوق أى ألبسته الطوق فلبسه والمطوّقة الحمامة التى
  فى عنقها طوق والطوق الطاقة وقد أطقت الشئاطاقة وهو فى طوقى أى فى وسعى وطوّقتك
  الشى أى كلنسكه وطوّقنى اللّٰه أداء حقك أى قوانى وطوّقت له نفسه لغة فى طوّءت أى
  رخصت وسهات حكاها الاخفش والطاق ماعطف من الابنية والجع الطاقات والطيقان
  فارسى معزب والطاق ضرب من الثباب قال الراجز
  يكفيك من طاق كثير الاعمان * جمازة شمر منها الكمات
  ويقال طاق ذعل وطاقة ريحان والطائق ناشز يتشز من الجبل وينسدر وكذلك فى البئر
  وفيمايين كل خشيتين من السفينة
  صل المين بق العبق بالتحريك مصدر قولك عبق به الطيب بالكسر
  أى لزق به عبقا وعباقية مثال ثمائية والعباقية أيضا الداهية وقد اعبنق الرجل أى صار
  داهمة وعقاب عبنقاة وعقبناة أى ذات مخالب حداده ثل جذب وجبذ ويقال أيضابه شير
  عباقيسة وهو أثرجراسة تبق فى حز وجهه والعدقة وضر السمن فى النحى يقال مافالنحو
  عبقة أى شئ من سمن ⁦(عتق)⁩ العتق الكرم يقال ما أبين العتق فى وجسه فلان يعنى
  الكرم والعنق الجهال والعتو الحرية وكذلك العتاق بالفتح والعتاقة تقول منه عتق العبد
  يعنق بالسكسر عتقا وعتاقاوعتاقة فهو عتيق وعائق وأعدته أنا وذلان مولى عتاقة ومول
  متفق ومولاة عنيقة وموال عتقاه ونساءعماثق وذلك اذا أعتقن وعمق فلان بعد استعلاج.
  بعتق صار عتيا أى رقت بشرته بعد الجفاء والغلظ قال الفراء العتق صلاح المال يقال
  أعتقت المال فعقق أى أصلمته فصلح حكاه عنه أبو عبيد فى المصنف وعتقت فرس فلان تعتق
  عتفا أى سبقت فنجت وأعتقها ماحبها أى أعجمله.ا وأنجاها وفلان.عماق الوسيقة اذا
  طرد طريدة أنجاها وسبق بها قال الهذلى
  امى الحقيقة نسال الوديقة معشتاق الوسيقة لانكس ولاوانى
  ولا تقل معناق بالذون وعتق الشئ بالضم عتاقة أى قدم وصار عتيقا وكذلك عتق يعتق مثل
  دخل يدخل فهو عائق ودنا نيرعتق وعتقته أنا تعتيقا والمعتقة الهر التى عتقت زمانا حتى
  عتقت والعانق الجمر العتيقة ويقال التى لم يفض ختامها أحد ومنه قول الشاعر
  أوعائق كدم الذبيح مدام « وجارية عائق أى شابة أوّل ما أدركت نفدّرت في بيت أهلها ولم تبن
  الى زوج من البينونة أى لم تبن من أهلها الى زوج والعاتقة من القوس مثل العانسكة وهى
  التى قدمت واحرت والعائق من فرخ الطائر فوق الناهض يقال أخذت فرخ قطاة عائقا
  وذلك اذا طار فاستقل قال أبو عبيد نرى أنه من السبق كأنه يعتق أى يسبق وأماقول لبيد
  أغلى السباء بكل أد كن عائق • أوجونة قدحت وفضّ ختامها
  فقال هو الزق الذى طابت رائحته لعتقه وقوله بكل يعنى من كل والسباء اشتراء الخمر
  وقوله قدحت أى غرف منها والعائق موضع الرداء من المنكب يذكرويؤنت يقال وجل
  أميل العائق أى موضع الرداء منه معوج وعتقت عليه يمين تعتق وعنقت أيضا بالضم أى
  قوله الراجز كذا فى جميع النسخ
  والظاهر أن يقول الشاعر فانّ
  البيت ليس برجز انماهو من
  مشطور السعر بع الموقوف اهي
