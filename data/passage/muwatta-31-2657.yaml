label: { ar: "الموطأ 2657 — أبو سعيد الخدري: إزرة المسلم إلى أنصاف الساقين وما أسفل من ذلك في النار", en: "Muwatta 2657" }
summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن عن أبيه أنه سأل أبا سعيد الخدري عن الإزار، فقال: سمعت رسول الله يقول: إزرة المسلم إلى أنصاف ساقيه، لا جناح عليه فيما بينه وبين الكعبين، وما أسفل من ذلك ففي النار، ولا ينظر الله يوم القيامة إلى من جر إزاره بطرا. {cite:muwatta-maruf-1997 p.501} {cite:muwatta-maruf-1997 p.502}"
