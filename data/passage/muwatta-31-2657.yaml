label: { ar: "الموطأ 2657 — أبو سعيد الخدري: إزرة المسلم إلى أنصاف الساقين وما أسفل من ذلك في النار", en: "Muwatta 2657", es: "Muwatta 2657", fr: "Muwatta 2657", ur: "موطا 2657", tr: "El-Muvatta 2657 — Ebu Said El-Hudri: Müslümanın alt giysisi dizlerinin ortasına kadar uzanmalıdır; bunun altındaki her şey cehennem ateşindedir.", id: "Al-Muwatta 2657 — Abu Saeed Al-Khudri: Pakaian bagian bawah seorang Muslim hendaknya mencapai pertengahan betis, dan apa pun yang lebih pendek dari itu akan masuk neraka." }
summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن عن أبيه أنه سأل أبا سعيد الخدري عن الإزار، فقال: سمعت رسول الله يقول: إزرة المسلم إلى أنصاف ساقيه، لا جناح عليه فيما بينه وبين الكعبين، وما أسفل من ذلك ففي النار، ولا ينظر الله يوم القيامة إلى من جر إزاره بطرا. {cite:muwatta-maruf-1997 p.501} {cite:muwatta-maruf-1997 p.502}"
  tr: "Malik, babasından rivayetle, Al-Ala' ibn Abd al-Rahman'dan naklederek, Ebu Sa'id al-Khudri'ye alt giysi (izar) hakkında sorduğunu ve onun şöyle dediğini aktarır: \"Allah Resulü'nün şöyle buyurduğunu işittim: 'Bir Müslümanın alt giysisi dizlerinin ortasına kadar uzanmalıdır. Bunun ile ayak bilekleri arasındaki kısım için bir günah yoktur, bunun altındaki kısım ise cehennemdedir. Allah, kibirden dolayı alt giysisini sürükleyen kimseye kıyamet gününde bakmayacaktır.'\""
  id: "Malik meriwayatkan dari Al-Ala’ ibn Abd al-Rahman, yang juga dari ayahnya, bahwa ia bertanya kepada Abu Sa’id al-Khudri tentang pakaian bagian bawah (izar), dan ia berkata: Aku mendengar Rasulullah SAW bersabda: Pakaian bagian bawah seorang Muslim hendaknya sampai ke tengah betisnya. Tidak ada dosa baginya atas apa yang ada di antara itu dan mata kaki, dan apa pun yang di bawahnya akan masuk ke dalam api neraka. Dan Allah tidak akan memandang pada Hari Kiamat orang yang menarik pakaian bagian bawahnya karena kesombongan. {cite:muwatta-maruf-1997 p.501} {cite:muwatta-maruf-1997 p.502}"
