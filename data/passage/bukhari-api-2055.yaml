label: { ar: "صحيح البخاري 2055 — ترك التمرة خشية أن تكون من الصدقة", en: "Sahih al-Bukhari 2055 — leaving a fallen date for fear it was charity", ur: "صحیح بخاری 2055 — صدقے کے اندیشے سے گری ہوئی کھجور چھوڑ دینا" }
text: "حَدَّثَنَا قَبِيصَةُ، حَدَّثَنَا سُفْيَانُ، عَنْ مَنْصُورٍ، عَنْ طَلْحَةَ، عَنْ أَنَسٍ ـ قَالَ مَرَّ النَّبِيُّ بِتَمْرَةٍ مَسْقُوطَةٍ فَقَالَ \" لَوْلاَ أَنْ تَكُونَ صَدَقَةً لأَكَلْتُهَا \". وَقَالَ هَمَّامٌ عَنْ أَبِي هُرَيْرَةَ ـ عَنِ النَّبِيِّ قَالَ \" أَجِدُ تَمْرَةً سَاقِطَةً عَلَى فِرَاشِي \"."
summary:
  ar: "خبر في صحيح البخاري، رقم 2055، في ترك التمرة خشية أن تكون من الصدقة. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Sahih al-Bukhari, no. 2055, on leaving a fallen date for fear it was charity. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "صحیح بخاری کی روایت نمبر 2055: صدقے کے اندیشے سے گری ہوئی کھجور چھوڑ دینا۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
