text: "أَرْسَلَ إِلَىَّ رَسُولُ اللَّهِ صلى الله عليه وسلم وَإِلَى صَاحِبَىَّ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم يَأْمُرُكُمْ أَنْ تَعْتَزِلُوا نِسَاءَكُمْ ‏.‏ فَقُلْتُ لِلرَّسُولِ أُطَلِّقُ امْرَأَتِي أَمْ مَاذَا أَفْعَلُ قَالَ لاَ بَلْ تَعْتَزِلُهَا فَلاَ تَقْرَبْهَا ‏.‏ فَقُلْتُ لاِمْرَأَتِي الْحَقِي بِأَهْلِكِ فَكُونِي فِيهِمْ فَلَحِقَتْ بِهِمْ ‏.‏"
summary:
  ar: "في السنن النسائي؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan al-Nasa'i; sending a letter or message to a party."
  ur: "سنن النسائی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
