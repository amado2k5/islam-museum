text: |-
  * ⁦(سين)⁩ .
  يقول يامعشر معد لا يغرّنكم عزكم وأن أصغررجل منكم يرعى ابله كيف شاء فاتّ الحرت بن
  حصن الغسانى قد عتب عليكم وعلى حصن بن حذيفة فلا تأمنواسطوته وقال المؤرج سنوا
  المال اذا أرسلوه فى الرحى والجمأ المسنون المتغير المنتن وسنة الوجهصورته وقال ذوالرتة
  تريك سنة وجه غير مقرفة • ملساءليس بهاخال ولاندب
  والمسنون المصوّر وقد سننته أسنه سنا اذاصوّرته والمسفون المعلمر وحكى أنّ يزيد بن معاوية
  قال لابيه ألا ترى عبد الرحن بن حسان يشبب باينتك فقال معاوية وما قال فقال قال
  هى زهراء منسل اولوة الغوّاص ميزت من جوهر مكنون
  فقال معادية صدق فقال يزيدانه يقول
  واذا مانسبتها لم تجدها • فى سناء من المكارم دون
  قال صدق قال فأين قوله
  ثم خاصرتها الى القبة الخضشراءشى فى مر مر مسئون
  فقال مع.اوية كذب ورجل مسنون الوجه اذا كان فى أنفه ووجهه طول واستن الغرس
  قص وفى المثل استنت الفصال حتى القرعى واستنّ الرجل بمعنى استاك والفصل يسان الفاقة
  مسانة وسنانا اذ الردها حتى توّخها ليسفدها وسفنت السكين أحددته والمن حجر
  يحدّدبه والسنان مثله قال امر والقير يصف الجنب • كصفح السنان الصلبىّ النحيض
  والسنان أيضاسنان الرمح وجعه أسنة والمنين مايسقط من الحجراذا حككته والسنون
  شي يستالك به والسنّ واحد الاسنان ويجوز أن تجمع الاسنان على أسنة مثل قنّ وأقنان
  وأقنة وفى الحديث اذاسافرتم فى اللحصب فأعطوا الركب أسنتها أى أمكنوها من المرهى
  وتصغير السسنّ سنينة لا نها تؤنت وقد يعبربالسن عن العمر وقولهم لا آتيك من الحسل أى
  أبدالان الحسل لا يسقط له سن أبدا وقول الشاءرفى وصف ابل أخذت فى الدية
  فجاءت كسن الغلبى لم أرمنلها * سناءقتيل أوحلعية جائع
  أى هى قيان لان الذى هو الذى يلقى ثيته والظي لاتنبت لهثنية قط فهوتى أبدا وسنة من
  نوم فصة منه والسفة أيضا السكة وهى الحديدة التى تئاربها الارض عن أبى عمرو وابن
  الاعرابى ومنّ القلم موضع البرى منه يقال أطل سنّ قلمن وسمنها وحرّف قطتك وأعنه
  وأسن الرجل كبر وأسن سديس الناقة أى نبت وذلك فى السنة الثامنة قال الاعشى
  مجقتها ربعات فى اللجين حتى السديس لهاقد أ-ن
  وأسنها اللّٰه أى أنبتها والسناسن رؤس الممالة وحروف فقار الظهر الواحدسنسن والسئينة
  واحدة السنائن وهى رمال مر تفعة تستطيل ع-لى وجه الارض وسننت التراب صبيعته على
  وجه الارض صباسهلا حتى صار كالمذاة وسنّ عليه الدرع يستهاسنا اذاصبها عليه وكذلك
  سفنت الماءعلى وجهى اذا أرسلته ارس الا من غير تفر يق فاذافرقته فى الصب قلته بالشين
  المجهمة وسننت الثاقة سرتهماسير اشديدا والم- ات من الايل خلاف الافتاء ين سين
  حرف من سروف المعجم وهى من حروف الزيادات وقد تخلص الفعل للاستقبال تقول سيفعل
  وزعم الخليل أنهاجواب ان أبو زيد من العرب من يجعل السين تاء وأنشد
  ياقبج
