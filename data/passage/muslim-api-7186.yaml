label: { ar: "صحيح مسلم 7186 — الأب والأبوة", en: "Sahih Muslim 7186 — the father and fatherhood", ur: "صحیح مسلم 7186 — باپ اور والدیت", es: "Sahih Muslim 7186 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، وَأَحْمَدُ بْنُ عُمَرَ الْوَكِيعِيُّ، قَالاَ حَدَّثَنَا ابْنُ فُضَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي حَازِمٍ، عَنْ أَبِي هُرَيْرَةَ، يَرْفَعُهُ قَالَ \" مَا بَيْنَ مَنْكِبَىِ الْكَافِرِ فِي النَّارِ مَسِيرَةُ ثَلاَثَةِ أَيَّامٍ لِلرَّاكِبِ الْمُسْرِعِ \". وَلَمْ يَذْكُرِ الْوَكِيعِيُّ \" فِي النَّارِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7186، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7186 (The Book of Paradise, its Description, its Bounties and its Inhabitants), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7186، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 7186 (El Libro del Paraíso, su Descripción, sus Bendiciones y sus Habitantes), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
