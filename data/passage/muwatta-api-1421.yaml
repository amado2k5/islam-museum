label: { ar: "موطأ مالك 1421 — النسب والانتساب", en: "Muwatta Malik 1421 — paternity and lineage", ur: "موطأ مالک 1421 — نسب اور انتساب" }
text: "… بْنُ زَمْعَةَ أَخِي وَابْنُ وَلِيدَةِ أَبِي وُلِدَ عَلَى فِرَاشِهِ. فَقَالَ رَسُولُ اللَّهِ \" هُوَ لَكَ يَا عَبْدُ بْنَ زَمْعَةَ \". ثُمَّ قَالَ رَسُولُ اللَّهِ \" الْوَلَدُ لِلْفِرَاشِ وَلِلْعَاهِرِ الْحَجَرُ \". ثُمَّ قَالَ لِسَوْدَةَ بِنْتِ زَمْعَةَ \" احْتَجِبِي مِنْهُ \". لِمَا رَأَى مِنْ شَبَهِهِ بِعُتْبَةَ بْنِ أَبِي وَقَّاصٍ قَالَتْ فَمَا رَآهَا حَتَّى لَقِيَ اللَّهَ عَزَّ وَجَلَّ."
summary:
  ar: "حديث في موطأ مالك، رقم 1421، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1421 (Judgements), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1421، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
