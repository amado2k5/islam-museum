label: { ar: "صحيح مسلم 3648 — وصف المؤمن", en: "Sahih Muslim 3648 — a description of the believer", ur: "صحیح مسلم 3648 — مومن کا وصف", es: "Sahih Muslim 3648 — una descripción del creyente", fr: "Sahih Muslim 3648 — une description du croyant", tr: "Sahih Muslim 3648 — Müminin Tanımı", id: "Sahih Muslim 3648 — Deskripsi tentang Orang Beriman" }
text: "وَحَدَّثَنِي إِبْرَاهِيمُ بْنُ مُوسَى الرَّازِيُّ، حَدَّثَنَا عِيسَى، - يَعْنِي ابْنَ يُونُسَ - حَدَّثَنَا عَبْدُ الْحَمِيدِ بْنُ جَعْفَرٍ، عَنْ عِمْرَانَ بْنِ أَبِي أَنَسٍ، عَنْ عُمَرَ بْنِ الْحَكَمِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يَفْرَكْ مُؤْمِنٌ مُؤْمِنَةً إِنْ كَرِهَ مِنْهَا خُلُقًا رَضِيَ مِنْهَا آخَرَ \". أَوْ قَالَ \" غَيْرَهُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 3648، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih Muslim, no. 3648 (The Book of Suckling), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح مسلم کی حدیث نمبر 3648، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 3648 (El Libro de la Lactancia), menciona una descripción del creyente. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih Muslim, n° 3648 (Le Livre de l'allaitement), mentionne une description du croyant. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih Müslim'de 3648 numaralı hadis, mümini tanımlar. Bu bölüm, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an'dan, Sünnet'ten, Peygamberin hayatından ve Sahabeler ile onların haleflerinden rivayetlerle birlikte bu dört kategori içinde derler."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3648, menjelaskan tentang orang beriman. Bagian ini mengumpulkan rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori ini."
