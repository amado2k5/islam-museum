text: "ن سيف هو الطفيل بن عمرو الدوسي. بإسلامهم وإسلام ملوك اليمن فكتب له كتابا . يقال: هو الطفيل بن الحارث، ويقال عبد الله بن قلت: وستأتي ترجمته في الميم . الطفيل: قاله المرزباني في معجمه يأتي . ٢٥٢٣ - ذو"
