text: "كتاب رسول الله ولف فقرأه فإذا فيه . بسم الله الرحمن الرحيم من محمد رسول الله إلى هرقل عظيم الروم، سلام على من اتبع الهدى. أما بعد فإني أدهوك بدعاية الإسلام أسلم تسلم، وأسلم يؤتك الله أجرك مرتين، فإن توليت"
