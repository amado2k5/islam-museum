text: "… كنت أقصد أنْ أُلفِّقَ بين الطول والعرض جاء إلى آقَ شَهْرُ، رجل فارسيِّ، وأخذ يصِفُ قصور الشاه التي في أصفهان، وأنَّ كلّا منها يحوي مائةً وخمسين غرفةً، ومساحتُها كذا ألف ذراعٍ مربَّعِ، ويُبالغُ بذلك. فقال له الشيخ: وعندنا في عاصمتِنا …"
summary:
  ar: "وصف فارسي في آق شهر قصور الشاه في أصفهان وفيها مئة وخمسون غرفة، فقال جحا إن الحمام الطبيعي في بورصة طوله خمسة آلاف ذراع، وجاء فارسي ثان من بورصة واعترض، فقال جحا إنه كان يحاول أن يلفق بين الطول والعرض، لكن هذا الرجل جاء في غير وقته. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  en: "A Persian in Akshehir describes the Shah's palaces in Isfahan with 150 rooms; Juha says that in Bursa the natural bath is 5000 cubits long; a second Persian arrives from Bursa and objects; Juha says he was trying to make the length fit the width, but this man came at the wrong time. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  ur: "آق شہر میں ایک ایرانی نے اصفہان میں شاہ کے محلات بیان کیے جن میں ڈیڑھ سو کمرے تھے، جحا نے کہا کہ بورصہ میں قدرتی حمام پانچ ہزار گز لمبا ہے، پھر بورصہ سے ایک اور ایرانی آیا اور اعتراض کیا، تو جحا نے کہا کہ وہ لمبائی اور چوڑائی کو ملانے کی کوشش کر رہا تھا، مگر یہ آدمی غلط وقت پر آ گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  fr: "Un Persan d'Akshehir décrit les palais du Shah à Ispahan, avec 150 pièces ; Juha dit qu'à Bursa le bain naturel mesure 5000 coudées ; un second Persan arrive de Bursa et proteste ; Juha dit qu'il essayait de faire accorder la longueur et la largeur, mais que cet homme est arrivé au mauvais moment. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  es: "Un persa en Akshehir describe los palacios del sah en Isfahán, con 150 habitaciones; Juha dice que en Bursa el baño natural mide 5000 codos; llega de Bursa un segundo persa y objeta; Juha dice que intentaba ajustar el largo con el ancho, pero este hombre llegó en mal momento. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
