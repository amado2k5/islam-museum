label: { ar: "الموطأ 2554 — مالك: الساحر الذي يعمل السحر بنفسه يُقتل", en: "Muwatta 2554", es: "Muwatta 2554", fr: "Muwatta 2554", ur: "موطا 2554", tr: "El-Muvatta 2554 — Malik: Büyü yapan büyücü öldürülecektir.", id: "Al-Muwatta 2554 — Malik: Penyihir yang melakukan sihir sendiri akan dibunuh" }
summary:
  ar: "قال مالك: الساحر الذي يعمل السحر ولم يعمل ذلك له غيره، هو مثل الذي ذكره الله في كتابه ممن اشترى السحر فلا خلاق له في الآخرة؛ فأرى أن يُقتل ذلك إذا عمل ذلك هو نفسه. {cite:muwatta-maruf-1997 p.444}"
  tr: "Malik şöyle dedi: Büyü yapan ve bunu başkasına yaptırmayan büyücü, Allah'ın Kitabında bahsettiği, büyü satın alan kimse gibidir ve ahirette hiçbir payı olmayacaktır. Bu nedenle, eğer kendisi büyü yaparsa öldürülmesi gerektiğine inanıyorum. {cite:muwatta-maruf-1997 s.444}"
  id: "Malik berkata: Penyihir yang melakukan sihir dan tidak ada orang lain yang melakukannya untuknya, seperti orang yang disebutkan Allah dalam Kitab-Nya yang membeli sihir, dan dia tidak akan mendapat bagian di akhirat. Oleh karena itu, saya percaya bahwa dia harus dibunuh jika dia sendiri yang melakukannya. {cite:muwatta-maruf-1997 p.444}"
