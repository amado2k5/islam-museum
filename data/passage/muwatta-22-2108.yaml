label: { ar: "الموطأ 2108 — يحيى عن مالك: بلغه عن سليمان بن يسار وغيره أنهم سئلوا عن رجل جلد الحد، أتجوز شهادته؟ فقالوا: نعم إذا ظهرت منه التوبة", en: "Muwatta 2108", es: "Muwatta 2108", fr: "Muwatta 2108", ur: "موطا 2108", tr: "El-Muvatta 2108 — Yahya, Malik'ten rivayetle: Süleyman ibn Yasar ve diğerlerinden kendisine şu rivayette bulunuldu: Kendilerine, öngörülen ceza için kırbaçlanan bir adam hakkında, şahitliğinin kabul edilebilir olup olmadığı soruldu. Onlar da: \"Evet, eğer ondan tövbe belirtisi görülürse, şahitliği kabul edilebilir,\" dediler.", id: "Al-Muwatta 2108 — Yahya dari Malik: Diriwayatkan kepadanya dari Sulaiman bin Yasar dan lainnya bahwa mereka ditanya tentang seorang laki-laki yang telah dicambuk sebagai hukuman yang ditetapkan, apakah kesaksiannya dapat diterima? Mereka menjawab: Ya, jika terlihat pertobatan darinya." }
summary:
  ar: "قال يحيى: قال مالك: إنه بلغه عن سليمان بن يسار وغيره أنهم سئلوا عن رجل جلد الحد، أتجوز شهادته؟ فقالوا: نعم، إذا ظهرت منه التوبة. {cite:muwatta-maruf-1997 p.262}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Süleyman ibn Yasar ve diğerlerinden rivayet edildiğine göre, ölüm cezası gerektiren bir suçtan dolayı kırbaçlanan bir adam hakkında, onun tanıklığının geçerli olup olmadığı sorulmuş. Onlar da: \"Evet, eğer ondan tövbe belirtisi görülürse\" demişler. {cite:muwatta-maruf-1997 s.262}"
  id: "Yahya berkata: Malik berkata: Telah sampai kepadanya dari Sulayman bin Yasar dan lainnya bahwa mereka ditanya tentang seorang pria yang telah dicambuk karena kejahatan yang diancam hukuman mati, apakah kesaksiannya dapat diterima? Mereka berkata: Ya, jika pertobatan tampak darinya. {cite:muwatta-maruf-1997 p.262}"
