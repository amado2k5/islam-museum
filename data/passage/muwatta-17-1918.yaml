label: { ar: "الموطأ 1918 — يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام وعن أبي مسعود الأنصاري: نهى رسول الله عن ثمن الكلب ومهر البغي وحلوان الكاهن", en: "Muwatta 1918", es: "Muwatta 1918", fr: "Muwatta 1918", ur: "موطا 1918", tr: "El-Muvatta 1918 — Yahya, Malik'ten, o da İbn Şihab'dan, o da Ebu Bekr ibn Abdülrahman ibn el-Haris ibn Hişam'dan ve Ebu Mes'ud el-Ensari'den rivayetle: Allah'ın Resulü, bir köpeğin fiyatını, bir fahişenin ücretini ve bir falcının ücretini haram kılmıştır.", id: "Al-Muwatta 1918 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Ibn Shihab berdasarkan riwayat Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham dan berdasarkan riwayat Abu Mas'ud al-Ansari: Rasulullah SAW melarang harga anjing, upah pelacur, dan upah peramal." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام، وعن أبي مسعود الأنصاري، أن رسول الله نهى عن ثمن الكلب، ومهر البغي، وحلوان الكاهن. ومهر البغي ما تعطاه المرأة على الزنا، وحلوان الكاهن رشوته، وما يعطى على أن يتكهن. ويذكر المحقق أن ابن عبد البر رأى أن قوله «وعن أبي مسعود» في نسخة يحيى وهم، وأن الحديث محفوظ عن أبي بكر عن أبي مسعود. {cite:muwatta-maruf-1997 p.185} {cite:muwatta-maruf-1997 p.186}"
  tr: "Yahya, Malik'ten, İbn Şihab'dan, Ebu Bekir ibn Abdülrahman ibn Haris ibn Hişam'dan ve Ebu Mes'ud el-Ensari'den rivayetle, Allah Resulü'nün köpek fiyatını, fahişenin kazancını ve falcının ücretini haram kıldığını nakde çevirmiştir. Fahişenin kazancı, kadına zina karşılığında verilen paradır ve falcının ücreti ise falcılık yapması için verilen rüşvettir. Araştırmacı, İbn Abdülbarr'ın Yahya'nın rivayetindeki \"ve Ebu Mes'ud'dan rivayetle\" ifadesini bir hata olarak değerlendirdiğini ve hadisin Ebu Bekir'den, Ebu Mes'ud'dan sahih olarak nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.185} {cite:muwatta-maruf-1997 s.186}"
  id: "Yahya meriwayatkan berdasarkan riwayat Malik, riwayat Ibn Shihab, riwayat Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham, dan riwayat Abu Mas'ud al-Ansari, bahwa Rasulullah SAW melarang harga anjing, penghasilan pelacur, dan upah peramal. Penghasilan pelacur adalah uang yang diberikan kepada wanita karena berzina, dan upah peramal adalah suap yang diberikan kepadanya untuk melakukan ramalan. Peneliti menyebutkan bahwa Ibn Abd al-Barr menganggap frasa \"dan berdasarkan riwayat Abu Mas'ud\" dalam versi Yahya sebagai kesalahan, dan bahwa hadits tersebut diriwayatkan secara sahih berdasarkan riwayat Abu Bakr, berdasarkan riwayat Abu Mas'ud. {cite:muwatta-maruf-1997 p.185} {cite:muwatta-maruf-1997 p.186}"
