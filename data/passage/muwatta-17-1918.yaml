label: { ar: "الموطأ 1918 — يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام وعن أبي مسعود الأنصاري: نهى رسول الله عن ثمن الكلب ومهر البغي وحلوان الكاهن", en: "Muwatta 1918" }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام، وعن أبي مسعود الأنصاري، أن رسول الله نهى عن ثمن الكلب، ومهر البغي، وحلوان الكاهن. ومهر البغي ما تعطاه المرأة على الزنا، وحلوان الكاهن رشوته، وما يعطى على أن يتكهن. ويذكر المحقق أن ابن عبد البر رأى أن قوله «وعن أبي مسعود» في نسخة يحيى وهم، وأن الحديث محفوظ عن أبي بكر عن أبي مسعود. {cite:muwatta-maruf-1997 p.185} {cite:muwatta-maruf-1997 p.186}"
