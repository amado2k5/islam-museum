label: { ar: "سنن النسائي 4539 — الرخصة", en: "Sunan al-Nasa'i 4539 — the concession (rukhsa)", ur: "سنن نسائی 4539 — رخصت", fr: "Sunan al-Nasa'i 4539 — la dispense (rukhsa)", es: "Sunan al-Nasa'i 4539 — la dispensa (rukhsa)", tr: "Sünen-i Nesa'i 4539 — Ruhsat", id: "Sunan an-Nasa'i 4539 — Lisensi" }
text: "حَدَّثَنَا عِيسَى بْنُ حَمَّادٍ، قَالَ حَدَّثَنَا اللَّيْثُ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ حَدَّثَنِي زَيْدُ بْنُ ثَابِتٍ، أَنَّ رَسُولَ اللَّهِ رَخَّصَ فِي بَيْعِ الْعَرِيَّةِ بِخِرْصِهَا تَمْرًا."
summary:
  ar: "حديث في سنن النسائي، رقم 4539، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 4539 (The Book of Financial Transactions), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 4539، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 4539, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 4539, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de 4539 numaralı hadis, bir muafiyetten bahsetmektedir. Farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahları derleyen bu eser, Kur'an, Sünnet, biyografi ve Sahabe ile Muhaliflerden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4539, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
