text: "للترمذي على محمد بن العجمي سماعه من أحمد بن الغزوي، وسمع من كتاب المصاحف لابن أبي داود من عبد الصمد. ويمع كثيرا من كتب القراءات بقراءته على عبد الصمد، وقرأ معالم التنريل على ابن العجمي بسماعه من المجد القزويني، وسمع …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 56، ص 314، يذكر قراءات القرآن، وجمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 56, p. 314, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 56، ص 314 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 56, pág. 314, que menciona las lecturas del Corán, la recopilación del Corán y los códices, los sistemas de escritura y el arte de escribir; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
