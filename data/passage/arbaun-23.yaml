label: { ar: "الأربعون 23 — الطهور شطر الإيمان", en: "Arba'un 23 — purity is half of faith" }
summary:
  ar: "حديث أبي مالك الأشعري قال: قال رسول الله: «الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن — أو تملأ — ما بين السماوات والأرض، والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك، كل الناس يغدو فبائع نفسه فمعتقها أو موبقها» وهو الحديث الثالث والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (223) من رواية يحيى بن أبي كثير عن زيد بن سلام عن أبي سلام عنه، واختلف في سماع يحيى بن أبي كثير من زيد بن سلام فأنكره يحيى بن معين وأثبته الإمام أحمد، وفي رواية مسلم التصريح بسماعه منه؛ وخرجه النسائي وابن ماجه من رواية معاوية بن سلام عن أخيه زيد بن سلام عن جده أبي سلام عن عبد الرحمن بن غنم عن أبي مالك فزاد في إسناده عبد الرحمن بن غنم، ورجح هذه الرواية بعض الحفاظ قائلاً إن معاوية بن سلام أعلم بحديث أخيه زيد من يحيى بن أبي كثير فيكون إسناد مسلم منقطعاً، وأجاب النووي في شرح مسلم بأن الظاهر أن أبا سلام سمعه من أبي مالك وسمعه أيضاً من عبد الرحمن بن غنم عن أبي مالك فرواه مرة عنه ومرة عنه؛ وفي لفظ حديث معاوية عند ابن ماجه «إسباغ الوضوء شطر الإيمان، والحمد لله ملء الميزان، والتسبيح والتكبير ملء السماء والأرض، والصلاة نور، والزكاة برهان» ولفظ الترمذي (3517) «الوضوء شطر الإيمان»، وفي أكثر نسخ صحيح مسلم «والصبر ضياء» وفي بعضها «والصيام ضياء» (جامع العلوم والحكم ص 489–490)."
  en: "The hadith of Abu Malik al-Ash'ari that the Messenger of God said 'purity is half of faith; praise belongs to God fills the scale; glory to God and praise belong to God fill, or fill, what is between the heavens and the earth; prayer is light; almsgiving is proof; patience is radiance; the Qur'an is an argument for you or against you; every person sets out each day selling his own soul, either freeing it or destroying it' — the twenty-third of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim (223) through Yahya ibn Abi Kathir from Zayd ibn Salam from Abu Salam from him, Yahya's hearing from Zayd being disputed — denied by Yahya ibn Ma'in, affirmed by the Imam Ahmad — with this route explicitly stating his hearing; al-Nasa'i and Ibn Majah transmit it through Mu'awiya ibn Salam from his brother Zayd ibn Salam from his grandfather Abu Salam from Abd al-Rahman ibn Ghunam from Abu Malik, adding Abd al-Rahman ibn Ghunam to the chain, and some memorisers preferred this route since Mu'awiya knows his brother's hadith better than Yahya ibn Abi Kathir — which would leave Muslim's chain disconnected — while al-Nawawi, in his commentary on Muslim, answered that Abu Salam apparently heard it both from Abu Malik directly and from Abd al-Rahman ibn Ghunam, narrating it once one way and once the other; Mu'awiya's wording in Ibn Majah runs 'perfecting the ablution is half of faith … the glorification and magnification fill the heaven and the earth … almsgiving [zakat] is proof', al-Tirmidhi (3517) has 'the ablution is half of faith', and most copies of Sahih Muslim read 'patience is radiance' while some read 'fasting is radiance' (Jami' al-Ulum wal-Hikam pp. 489–490)."
