label: { ar: "الأربعون 23 — الطهور شطر الإيمان", en: "Arba'un 23 — purity is half of faith", es: "Arba'un 23 — la pureza es la mitad de la fe", fr: "Arba'un 23 — la pureté est la moitié de la foi", ur: "اربعون 23 - پاکیزگی نصف ایمان ہے۔", tr: "Kırk 23 — Saflık imanın yarısıdır", id: "Empat Puluh 23 — Kemurnian adalah separuh dari iman" }
summary:
  ar: "حديث أبي مالك الأشعري قال: قال رسول الله: «الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن — أو تملأ — ما بين السماوات والأرض، والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك، كل الناس يغدو فبائع نفسه فمعتقها أو موبقها» وهو الحديث الثالث والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (223) من رواية يحيى بن أبي كثير عن زيد بن سلام عن أبي سلام عنه، واختلف في سماع يحيى بن أبي كثير من زيد بن سلام فأنكره يحيى بن معين وأثبته الإمام أحمد، وفي رواية مسلم التصريح بسماعه منه؛ وخرجه النسائي وابن ماجه من رواية معاوية بن سلام عن أخيه زيد بن سلام عن جده أبي سلام عن عبد الرحمن بن غنم عن أبي مالك فزاد في إسناده عبد الرحمن بن غنم، ورجح هذه الرواية بعض الحفاظ قائلاً إن معاوية بن سلام أعلم بحديث أخيه زيد من يحيى بن أبي كثير فيكون إسناد مسلم منقطعاً، وأجاب النووي في شرح مسلم بأن الظاهر أن أبا سلام سمعه من أبي مالك وسمعه أيضاً من عبد الرحمن بن غنم عن أبي مالك فرواه مرة عنه ومرة عنه؛ وفي لفظ حديث معاوية عند ابن ماجه «إسباغ الوضوء شطر الإيمان، والحمد لله ملء الميزان، والتسبيح والتكبير ملء السماء والأرض، والصلاة نور، والزكاة برهان» ولفظ الترمذي (3517) «الوضوء شطر الإيمان»، وفي أكثر نسخ صحيح مسلم «والصبر ضياء» وفي بعضها «والصيام ضياء» ⁦(جامع العلوم والحكم ص 489–490)⁩."
  en: "The hadith of Abu Malik al-Ash'ari that the Messenger of God said 'purity is half of faith; praise belongs to God fills the scale; glory to God and praise belong to God fill, or fill, what is between the heavens and the earth; prayer is light; almsgiving is proof; patience is radiance; the Qur'an is an argument for you or against you; every person sets out each day selling his own soul, either freeing it or destroying it' — the twenty-third of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim (223) through Yahya ibn Abi Kathir from Zayd ibn Salam from Abu Salam from him, Yahya's hearing from Zayd being disputed — denied by Yahya ibn Ma'in, affirmed by the Imam Ahmad — with this route explicitly stating his hearing; al-Nasa'i and Ibn Majah transmit it through Mu'awiya ibn Salam from his brother Zayd ibn Salam from his grandfather Abu Salam from Abd al-Rahman ibn Ghunam from Abu Malik, adding Abd al-Rahman ibn Ghunam to the chain, and some memorisers preferred this route since Mu'awiya knows his brother's hadith better than Yahya ibn Abi Kathir — which would leave Muslim's chain disconnected — while al-Nawawi, in his commentary on Muslim, answered that Abu Salam apparently heard it both from Abu Malik directly and from Abd al-Rahman ibn Ghunam, narrating it once one way and once the other; Mu'awiya's wording in Ibn Majah runs 'perfecting the ablution is half of faith … the glorification and magnification fill the heaven and the earth … almsgiving [zakat] is proof', al-Tirmidhi (3517) has 'the ablution is half of faith', and most copies of Sahih Muslim read 'patience is radiance' while some read 'fasting is radiance' (Jami' al-Ulum wal-Hikam pp. 489–490)."
  es: "El hadiz de Abu Malik al-Ash'ari que el Mensajero de Dios dijo: \"la pureza es la mitad de la fe; la alabanza pertenece a Dios llena la balanza; la gloria a Dios y la alabanza pertenecen a Dios llenan, o llenan, lo que hay entre los cielos y la tierra; la oración es luz; la limosna es prueba; la paciencia es resplandor; el Corán es un argumento a favor o en contra de ti; cada persona se dispone cada día a vender su propia alma, ya sea liberándola o destruyéndola\" — el vigésimo tercero de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Muslim (223) a través de Yahya ibn Abi Kathir de Zayd ibn Salam de Abu Salam de él, siendo disputado el haber escuchado a Yahya de Zayd — negado por Yahya ibn Ma'in, afirmado por el Imam Ahmad — con esta ruta declarando explícitamente su haber; al-Nasa'i e Ibn Majah lo transmiten a través de Mu'awiya ibn Salam de su hermano Zayd ibn Salam de su abuelo Abu Salam de Abd al-Rahman ibn Ghunam de Abu Malik, añadiendo a Abd al-Rahman ibn Ghunam a la cadena, y algunos memorizadores prefirieron esta ruta ya que Mu'awiya conoce el hadiz de su hermano mejor que Yahya ibn Abi Kathir —lo que dejaría la cadena de Muslim desconectada— mientras que al-Nawawi, en su comentario sobre Muslim, respondió que Abu Salam aparentemente lo escuchó tanto de Abu Malik directamente como de Abd al-Rahman ibn Ghunam, narrándolo una vez de una manera y una vez de la otra; La redacción de Mu'awiya en Ibn Majah dice: \"perfeccionar la ablución es la mitad de la fe... la glorificación y la magnificación llenan el cielo y la tierra... la limosna [zakat] es prueba\", al-Tirmidhi (3517) dice: \"la ablución es la mitad de la fe\", y la mayoría de las copias de Sahih Muslim dicen: \"la paciencia es resplandor\", mientras que algunas dicen: \"el ayuno es resplandor\" (Jami' al-Ulum wal-Hikam pp. 489–490)."
  fr: "Le hadith d'Abu Malik al-Ash'ari selon lequel le Messager de Dieu a dit: « La pureté est la moitié de la foi; la louange à Dieu remplit la balance; la gloire à Dieu et la louange à Dieu remplissent ce qui se trouve entre les cieux et la terre; la prière est lumière; l'aumône est preuve; la patience est rayonnement; le Coran est un argument pour ou contre vous; chaque personne, chaque jour, vend son âme, la libérant ou la détruisant » — le vingt-troisième des quarante hadiths d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Muslim (223) par Yahya ibn Abi Kathir de Zayd ibn Salam d'Abu Salam de lui, la transmission de Yahya de Zayd étant contestée — niée par Yahya ibn Ma'in, affirmée par l'Imam Ahmad — avec cette voie indiquant explicitement sa transmission; al-Nasa'i et Ibn Majah le transmettent par l'intermédiaire de Mu'awiya ibn Salam, qui le tient de son frère Zayd ibn Salam, qui le tient de son grand-père Abu Salam, qui le tient d'Abd al-Rahman ibn Ghunam, qui le tient d'Abu Malik, ajoutant ainsi Abd al-Rahman ibn Ghunam à la chaîne. Certains mémorisateurs ont préféré cette voie, car Mu'awiya connaît mieux le hadith de son frère que Yahya ibn Abi Kathir — ce qui laisserait la chaîne de Muslim déconnectée — tandis qu'al-Nawawi, dans son commentaire sur Muslim, répond qu'Abu Salam l'aurait apparemment entendu à la fois directement d'Abu Malik et d'Abd al-Rahman ibn Ghunam, le narrant une fois d'une manière et une fois de l'autre; La formulation de Mu'awiya dans Ibn Majah est la suivante: « parfaire les ablutions est la moitié de la foi… la glorification et la magnification remplissent le ciel et la terre… l'aumône [zakat] en est la preuve », al-Tirmidhi (3517) dit: « les ablutions sont la moitié de la foi », et la plupart des copies de Sahih Muslim disent: « la patience est rayonnement », tandis que certaines disent: « le jeûne est rayonnement » (Jami' al-Ulum wal-Hikam pp. 489–490)."
  ur: "ابومالک اشعری کی حدیث ہے کہ رسول اللہ نے فرمایا کہ پاکیزگی نصف ایمان ہے۔ حمد اللہ کے لیے ہے پیمانہ بھرتا ہے۔ خدا کی شان اور حمد خدا ہی کے لئے ہے جو آسمانوں اور زمین کے درمیان ہے بھر دے نماز روشنی ہے؛ صدقہ دینا دلیل ہے؛ صبر چمک ہے؛ قرآن آپ کے حق میں یا آپ کے خلاف حجت ہے؟ ہر شخص ہر روز اپنی جان بیچنے کے لیے نکلتا ہے، یا تو اسے آزاد کر دیتا ہے یا اسے تباہ کر دیتا ہے۔'' - النووی کی چالیس اور ابن رجب کی تفسیر کا تئیسویں؛ مسلم (223) کے ذریعے یحییٰ بن ابی کثیر کے ذریعے زید بن سلام سے ابو سلام سے، زید سے یحییٰ کی سماعت کا اختلاف ہے - جس کی تردید یحییٰ بن معین نے کی ہے، جس کی امام احمد نے تصدیق کی ہے۔ نسائی اور ابن ماجہ نے اسے معاویہ بن سلام کے ذریعے اپنے بھائی زید بن سلام سے ان کے دادا ابو سالم سے عبدالرحمٰن بن غنم سے ابو مالک سے نقل کیا ہے، عبدالرحمٰن بن غنم کو سلسلہ میں شامل کیا ہے، اور بعض حافظوں نے اس راستے کو ترجیح دی ہے کیونکہ معاویہ اپنے بھائی کاتذیر سے بہتر جانتے تھے۔ - جس سے مسلم کا سلسلہ منقطع ہو جائے گا - جبکہ النووی نے مسلم پر اپنی تفسیر میں جواب دیا کہ ابو سلام نے بظاہر اسے ابو مالک سے براہ راست اور عبدالرحمٰن بن غنم سے سنا ہے، ایک بار اسے روایت کیا ہے اور ایک بار دوسری طرف۔ ابن ماجہ میں معاویہ کا قول ہے کہ 'وضو کا کامل کرنا نصف ایمان ہے... تسبیح و تسبیح آسمان و زمین کو بھر دیتی ہے... صدقہ دینا دلیل ہے'، الترمذی (3517) میں 'وضو نصف ایمان' ہے، اور صحیح مسلم کے اکثر نسخوں میں ہے 'وضو کرنا نصف ایمان ہے جب کہ صبر کرنا رفع الیدین ہے'۔ العلم والحکم صفحہ 489-490)۔"
  tr: "Ebu Malik el-Eş'ari'nin rivayet ettiği hadiste, Allah Resulü şöyle buyurmuştur: “Temizlik imanın yarısıdır, hamd Allah'a, terazinin kefesini doldurur, şükür Allah'a, gökler ve yer arasındaki her şeyi doldurur. Namaz nurdur, zekât delildir, sabır aydınlanmadır ve Kur'an sizin için bir delildir, ya da aleyhinize. Her insan sabahleyin çıkar ve kendini satar, ya kendini kurtarır ya da kendini helak eder.” Bu hadis, Nevevi'nin Kırk Hadis'inde ve İbn Receb'in açıklamasında yirmi üçüncü hadistir. Müslim (223), Yahya ibn Ebu Kathir'den, o da Zeyd ibn Selam'dan, o da Ebu Selam'dan, o da kendi rivayetine dayanarak nakletmiştir. Yahya ibn Ebu Kathir'in Zeyd ibn Selam'dan işittiği konusunda ihtilaf vardır; Yahya ibn Ma'in bunu reddetmiş, İmam Ahmed ise doğrulamıştır. Müslim'in rivayetinde ise ondan işittiğine dair açık bir ifade bulunmaktadır. Bu hadis, Nesai ve İbn Mâce tarafından Muaviye ibn Selaman'dan, o da kardeşi Zeyd ibn Selaman'dan, o da dedesi Ebu Selaman'dan, o da Abdurrahman ibn Ganm'dan, o da Ebu Malik'ten rivayet edilmiştir. Abdurrahman ibn Ganm da bu rivayet zincirine eklenmiştir. Bazı hadis âlimleri bu rivayeti tercih ederek, Muaviye ibn Selaman'ın hadislerini Yahya ibn Ebu Kathir'den daha iyi bildiğini, dolayısıyla Müslim'in rivayet zincirinin bozulacağını söylemişlerdir. Nevevi, Müslim üzerine yaptığı tefsirde, Ebu Selaman'ın bu hadisi Ebu Malik'ten ve ayrıca Abdurrahman ibn Ganm'dan Ebu Malik'ten işittiği, dolayısıyla bir kez onun rivayetine, bir kez de onun rivayetine dayandırdığı şeklinde yanıt vermiştir. İbn Majah'taki Muaviye hadisinin nakledişinde şöyle denmektedir: \"Tam abdest almak imanın yarısıdır, Allah'a hamd teraziyi doldurur, yüceltme ve övme gökleri ve yeri doldurur, namaz nurdur ve zekât delildir.\" Tirmizi'nin (3517) nakledişinde ise: \"Abdest imanın yarısıdır.\" Sahih Müslim'in çoğu nüshasında \"Ve sabır nurdur\", bazılarında ise \"Ve oruç nurdur\" denmektedir (Cami' el-Ulum ve el-Hikam, s. 489-490)."
  id: "Hadits Abu Malik al-Ash'ari, yang berkata: Rasulullah SAW bersabda: “Kesucian adalah separuh dari iman, dan segala puji bagi Allah memenuhi timbangan, dan segala puji bagi Allah memenuhi—atau memenuhi—apa yang ada di antara langit dan bumi, dan salat adalah cahaya, dan sedekah adalah bukti, dan kesabaran adalah penerangan, dan Al-Qur'an adalah bukti yang mendukung atau menentangmu. Setiap orang keluar di pagi hari dan menjual dirinya, baik untuk membebaskan dirinya atau menghancurkan dirinya.” Hadits ini adalah hadits ke-23 dalam Empat Puluh Hadits al-Nawawi dan dalam penjelasan Ibn Rajab. Diriwayatkan oleh Muslim (223) dari Yahya ibn Abi Kathir dari Zayd ibn Salam dari Abu Salam darinya. Terdapat perbedaan pendapat mengenai Yahya ibn Abi Kathir yang mendengar dari Zayd ibn Salam, karena Yahya ibn Ma'in menyangkalnya dan Imam Ahmad membenarkannya. Dalam riwayat Muslim, terdapat pernyataan eksplisit bahwa ia mendengarnya darinya. Riwayat ini dinarasikan oleh Al-Nasa’i dan Ibn Majah atas otoritas Mu’awiyah ibn Salam, atas otoritas saudaranya Zayd ibn Salam, atas otoritas kakeknya Abu Salam, atas otoritas Abd al-Rahman ibn Ghanm, atas otoritas Abu Malik. Abd al-Rahman ibn Ghanm ditambahkan ke dalam sanadnya. Sebagian penghafal lebih menyukai riwayat ini, dengan mengatakan bahwa Mu’awiyah ibn Salam lebih mengetahui hadits saudaranya Zayd daripada Yahya ibn Abi Kathir, sehingga sanad riwayat Muslim akan terputus. Al-Nawawi menanggapi dalam komentarnya tentang Muslim bahwa tampaknya Abu Salam mendengarnya dari Abu Malik dan juga mendengarnya dari Abd al-Rahman ibn Ghanm atas otoritas Abu Malik, sehingga ia meriwayatkannya sekali atas otoritasnya dan sekali atas otoritasnya. Dalam hadits Mu’awiyah di Ibn Majah, tertulis: “Berwudhu dengan sempurna adalah setengah dari iman, dan puji syukur kepada Allah memenuhi timbangan, dan pujian serta pengagungan memenuhi langit dan bumi, dan salat adalah cahaya, dan zakat adalah bukti.” Dalam hadits Al-Tirmidhi (3517) tertulis: “Wudhu adalah setengah dari iman.” Dalam sebagian besar kitab Sahih Muslim, tertulis: “Dan kesabaran adalah cahaya,” dan dalam beberapa kitab, “Dan puasa adalah cahaya” (Jami’ al-‘Ulum wa al-Hikam, hlm. 489–490)."
