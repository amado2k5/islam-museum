label: { ar: "نوادر جحا الكبرى، ص 156 — «إذا كنتم كباراً فنحن صغار»", en: "Nawadir Juha al-Kubra, p. 156 — 'If You Are Great, We Are Small'", ur: "نوادر جحا الکبریٰ، ص 156 — «اگر آپ بڑے ہیں تو ہم چھوٹے ہیں»", fr: "Nawadir Juha al-Kubra, p. 156 — « Si vous êtes grands, nous sommes petits »", es: "Nawadir Juha al-Kubra, p. 156 — «Si ustedes son grandes, nosotros somos pequeños»", tr: "Juha'nın Büyük Fıkraları, s. 156 — “Eğer siz yaşlıysanız, biz genciz.”", id: "Anekdot Hebat Juha, hlm. 156 — “Jika kamu sudah tua, maka kami masih muda.”" }
text: "… إذا كنتم كباراً فنحن صغار دخل الشيخ ذات يوم مجلس تيمور لنك، وتقدَّم ببعض مطالب، باسمِ البلدة بكلِّ جرأةٍ، ورجا بعض تكاليف شديدةٍ لا تُطاق، فغضب تيمورلنك حتى تطاير الشرر من عينيهِ، وقال للشيخ : بأيةِ صفةٍ تطلب هذه المطالب …"
summary:
  ar: "طلب جحا من تيمور لنك خدمات مكلفة للبلدة، فسأله تيمور لنك من هو ليطلب أمثال هذه الأمور، فقال جحا إن كنتم كباراً فنحن صغار. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  en: "Juha asks Timur for costly favours for the town; Timur asks who he is to ask such things; Juha says: if you are great, we are small. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  ur: "جحا نے تیمور لنگ سے شہر کے لیے مہنگی مہربانیاں مانگیں، تیمور لنگ نے پوچھا کہ وہ کون ہوتا ہے ایسی باتیں مانگنے والا، تو جحا نے کہا کہ اگر آپ بڑے ہیں تو ہم چھوٹے ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  fr: "Juha demande à Timur des faveurs coûteuses pour la ville ; Timur lui demande qui il est pour solliciter de telles choses ; Juha répond : si vous êtes grands, nous sommes petits. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  es: "Juha pide a Timur favores costosos para la ciudad; Timur le pregunta quién es él para pedir tales cosas; Juha responde: si ustedes son grandes, nosotros somos pequeños. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  tr: "Juha, Timur Lenk'ten şehir için pahalı hizmetler istedi. Timur Lenk ise ona böyle şeyler istemeye hakkı olduğunu sordu. Juha, \"Eğer sen büyüksen, biz küçüğüz\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 156}"
  id: "Juha meminta Timur Lenk untuk menyediakan layanan mahal bagi kota, lalu Timur Lenk bertanya kepadanya siapa dia sehingga berani meminta hal-hal seperti itu. Juha menjawab, \"Jika Anda hebat, maka kami kecil.\" {cite:juha-nawadir-kubra-djuwaydi p. 156}"
