label: { ar: "سنن ابن ماجه 1188 — الأب والأبوة", en: "Sunan Ibn Majah 1188 — the father and fatherhood", ur: "سنن ابن ماجہ 1188 — باپ اور والدیت" }
text: "حَدَّثَنَا أَبُو مُصْعَبٍ، أَحْمَدُ بْنُ أَبِي بَكْرٍ الْمَدِينِيُّ وَسُوَيْدُ بْنُ سَعِيدٍ قَالاَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي سَعِيدٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ نَامَ عَنِ الْوِتْرِ أَوْ نَسِيَهُ، فَلْيُصَلِّ إِذَا أَصْبَحَ، أَوْ ذَكَرَهُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1188، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1188 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1188، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
