label: { ar: "جامع الترمذي 2677 — وزر من تبع", en: "Jami' al-Tirmidhi 2677 — bearing the burden of those who follow", ur: "جامع ترمذی 2677 — پیروی کرنے والوں کا بوجھ" }
text: "… مَنْ عَمِلَ بِهَا مِنْ غَيْرِ أَنْ يَنْقُصَ مِنْ أُجُورِهِمْ شَيْئًا وَمَنِ ابْتَدَعَ بِدْعَةَ ضَلاَلَةٍ لاَ يَرْضَاهَا اللَّهُ وَرَسُولُهُ كَانَ عَلَيْهِ مِثْلُ آثَامِ مَنْ عَمِلَ بِهَا لاَ يَنْقُصُ ذَلِكَ مِنْ أَوْزَارِ النَّاسِ شَيْئًا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَمُحَمَّدُ بْنُ عُيَيْنَةَ هُوَ مِصِّيصِيٌّ شَامِيٌّ وَكَثِيرُ بْنُ عَبْدِ اللَّهِ هُوَ ابْنُ عَمْرِو بْنِ عَوْفٍ الْمُزَنِيُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2677، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2677 (Chapters on Knowledge), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2677، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
