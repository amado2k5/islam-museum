label:
  ar: "النسائي 3997 — يا رب هذا قتلني: فيقول الله لم قتلته"
  en: "Nasa'i 3997 — My Lord, this man killed me: God asks why he killed him"
  ur: "نسائی 3997 — اے رب اس نے مجھے قتل کیا: اللہ پوچھتا ہے تم نے اسے کیوں قتل کیا"
text: "يجيء الرجل آخذا بيد الرجل فيقول يا رب هذا قتلني . فيقول الله له لم قتلته فيقول قتلته لتكون العزة لك . فيقول فإنها لي . ويجيء الرجل آخذا بيد الرجل فيقول إن هذا قتلني . فيقول الله له لم …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 3997: يا رب هذا قتلني: فيقول الله لم قتلته. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 3997: My Lord, this man killed me: God asks why he killed him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 3997: اے رب اس نے مجھے قتل کیا: اللہ پوچھتا ہے تم نے اسے کیوں قتل کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
