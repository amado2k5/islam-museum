text: "… غضب يسكت اذا غضب أحبب حبيبك هوناً ما لا يكن بغضك تلفا عده الاحاديث الآثار لا يلدغ المؤمن من جدر مرتين إذا أراد اللّٰه قبض عبد بأرض جمل له بها حاجة ا من كانت له حاجة فهو أحق أن يذهب …"
