text: |-
  أفصل الكاف)
  ⁦(ك رع)⁩ .-
  ٦١٩
  ان تغد فى دونى القناع فانى • طب بأخذ الفارس المستلتم
  والقناع أيضا الطبق من عسب النخل وكذلك القنع والمقنع بالفتح العدل من الشهود يقال
  فلان شاهد مقنع أى رضى يقنع بقوله ويرضى به يذال منه رجل قنعات بالضم وأمرأة قنعان
  يستوى فيه المذكر والمؤنث والتثفية والجمع أى مقنع رضى وقال
  فقلت له يؤبا مرئ أست مثله * وان كنت قنعانا لمن يطلب الدما
  والقنعان بالكسر من القنع وهو المستوى بين اكمتين سهلتين قال ذوالرمة يصف الهر
  وأبصرن ان القنع صارنطافه • فراشاوان لبقل ذا وويابس
  وقم مقنع أى معطوفة أسنانه الى داخل قال الشياخ يصف ابلا
  بياكرن العضاه بمقنعات • نواجذهى كالحد إالوقبع
  ورجل مقنع بالتشديد أى عليه بيضة وقنعت المرأة أى ألبستها لقفاع فتقنعت هى وقنعت
  رأسه بالسوط ضربا وقنع الديك اذاربرائله الرأسه قال الراجز
  ولايزال خرب مقنع • برائلاه والجناح يلع
  قال أبو يوسف اقنع راسه أد ارفعه ومنه قوله تعالى. هطعين مقنعى رؤسهم وكذلك قول رؤيه
  أشرف روقاه صليفامنها يعن عفق الذور واقنع بديه فى الصلاة اذارفعهمافى التنوت
  مستقبلا بيطونهما وجهه ليدعو وأقنع البعيراذ امدرأسه الى الموض ليرب وأقنعت
  الاناءاذا أملته لتصب مافيه واستقبلت به جرية الماء ليمتلئ قال الراجز يصف ناقنه
  تقنع للجدول منهاجدولا شبه فاها وحلقهإ بالحدول تستقبل به جدولا اذا شربت
  وأقنعت الابل والغستم اذا أملتها للمرتع وقد قنعت هى اذاماات له وة حت بالفتح إذا مالت
  لمأواها وأقبلت نحوأهلها عن ابن السكيت وأقنعنى كذا أى أرضانى وع قاع
  الفعل على الماقة يقوع قوعادقيإعا اذانزاوهوقلب قما واقتاع الفحسل اذاهاج والقاع
  المستوى من الارض والجمع أقوع وأقواع وقيعان صارت الوارياءا كسرة ماقبلها
  والقيعة منسل القاع وهو أيضا من الواو وبعضه-م يقول هوجمع ١ ال الادعمى. قاعة
  الدارساحيم إمثل القاحة قال وعلة الجرمى
  وعل تركت نساء الحى ضاحية * فى قاعة الداريستوقدن بالغبط
  صل الكاف تع قال ما بالداركنيع أى أحد حكاه يعقوب وسقعته أيضا
  من أعراب بنى تميم والسكتع ولد الثعاب والرجل اللميم أيضا والهع كتعان مثل ضرد وصردان
  وكتع جسع كتعاه فى توكيد المونث يقال اشتريت هذه الداربجعا- كنعام ورأيت أخواتك
  جع كنع ورأيت القوم أجعين أة تعين ولاية_ دم كتع على جمع فى التاكيد ولا يفردلانه
  اتساع له ويقال انه مإخوذ من قولهم أتى عليه حول كتيع أى تامّ وهذا الحرف "يمعتهمن
  ب.ض التحويين ذكره فى شرح كتاب الجرمى وكنع أى هرب ( كيع كثعت الابل وااغتم
  كثوعا أى استرخت بطونها وردت بثلوطها وكشع اللبن وكنع أى علاد سمه وخشورته رأسه
  مثل كتأوكنأ وكثعت القدر رمت بز بدها وه و الكثمة وشفة كائعة يائعة أى عتلئة
  غليظة ( رع الكرع باتحريك ماء السماء بكرع فيه قال ابن الرفاع بصف راعيا
