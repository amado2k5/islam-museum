text: "… صَلَّى مَعَ رَسُولِ اللَّهِ وَهُوَ غُلاَمٌ شَابٌّ فَلَمَّا صَلَّى إِذَا رَجُلاَنِ لَمْ يُصَلِّيَا فِي نَاحِيَةِ الْمَسْجِدِ فَدَعَا بِهِمَا فَجِيءَ بِهِمَا تُرْعَدُ فَرَائِصُهُمَا فَقَالَ \" مَا مَنَعَكُمَا أَنْ تُصَلِّيَا مَعَنَا \". قَالاَ قَدْ صَلَّيْنَا فِي رِحَالِنَا. فَقَالَ \" لاَ تَفْعَلُوا إِذَا صَلَّى أَحَدُكُمْ فِي رَحْلِهِ ثُمَّ أَدْرَكَ الإِمَامَ وَلَمْ يُصَلِّ فَلْيُصَلِّ مَعَهُ فَإِنَّهَا لَهُ نَافِلَةٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 575، يرد فيه ذكر النافلة والنوافل. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 575 (Prayer (Kitab Al-Salat)), whose wording mentions the supererogatory (nafila). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 575، جس کے الفاظ میں نفل اور نوافل کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 575, dont le texte mentionne le surérogatoire (nafila). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 575, cuyo texto menciona lo supererogatorio (nafila). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 575 numaralı hadiste, nafile ibadetlerden bahsedilmektedir. Bu hadis, farz ibadetler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh ibadetler, haram ibadetler ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 575, menyebutkan amalan-amalan ibadah sunnah. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan-amalan wajib, amalan-amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
