text: "… يضعف وينكر منه كل ما كان يعرف ويمشى رويدا كالأسير مقيدا تدانى خطاه فى الحديد ويرسف توف بشر فى ربيع الاول من هذه السنة وصلى عليه بن هارون بن العباس الماشمى صاحب الصلاة ودفن فى مقبرة راب التبن وكان الجمع …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 1، ص 32، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 1, p. 32, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 1، ص 32 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de al-Muntazam de Ibn al-Jawzi, volumen 1, pág. 32, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Muntazam d'Ibn al-Jawzi (tome 1, p. 32) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin resimli 1. cildinin 32. sayfasından bir alıntıda, mezar, türbe ve kutsal mekandan bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve kutsal mekanlar araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, jilid 1 bergambar, halaman 32, menyebutkan tentang pemakaman, kuburan, dan makam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
