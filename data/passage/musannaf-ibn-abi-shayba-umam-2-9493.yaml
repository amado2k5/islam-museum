text: "طرف الحديث أو الأثر لا تعصروا بطني لا تعط الذمي مالاً مضاربة لا تعط العطية فتزيد أن تأخذ أكثر منها لا تعط المشركين شيئاً لا تعط اليهودي والنصراني من الزكاة لا تعط لتزداد لا تعط لتعطي أكثر منه لا تعطهم …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 9493، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 9493, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 9493 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
