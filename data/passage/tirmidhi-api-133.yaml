text: "… عَنْ عَمِّهِ عَبْدِ اللَّهِ بْنِ سَعْدٍ، قَالَ سَأَلْتُ النَّبِيَّ عَنْ مُوَاكَلَةِ الْحَائِضِ فَقَالَ \" وَاكِلْهَا \". قَالَ وَفِي الْبَابِ عَنْ عَائِشَةَ وَأَنَسٍ. قَالَ أَبُو عِيسَى حَدِيثُ عَبْدِ اللَّهِ بْنِ سَعْدٍ حَدِيثٌ حَسَنٌ غَرِيبٌ. وَهُوَ قَوْلُ عَامَّةِ أَهْلِ الْعِلْمِ لَمْ يَرَوْا بِمُوَاكَلَةِ الْحَائِضِ بَأْسًا. وَاخْتَلَفُوا فِي فَضْلِ وَضُوئِهَا فَرَخَّصَ فِي ذَلِكَ بَعْضُهُمْ وَكَرِهَ بَعْضُهُمْ فَضْلَ طَهُورِهَا."
summary:
  ar: "حديث في جامع الترمذي، رقم 133، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 133 (The Book on Purification), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 133، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 133, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 133, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'nin 133 numaralı hadisinde bu uygulamadan bahsedilir. Farz ameller, görevler, itaat amelleri, müstehap ameller, mekruh ameller, haram ameller ve küçük günahlar hakkındaki kitapları derleyen yazar, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 133, menyebutkan keringanan tersebut. Penyusun kitab-kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
