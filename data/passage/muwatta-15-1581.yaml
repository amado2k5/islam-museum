label: { ar: "الموطأ 1581 — ابن عباس: رجل قال إنه طلق امرأته مائة تطليقة، فقال طلقت منك بثلاث وسبع وتسعون اتخذتها هزوا", en: "Muwatta 1581", es: "Muwatta 1581", fr: "Muwatta 1581", ur: "موطا 1581", tr: "İbn Abbas, Muvatta 1581'de şöyle dedi: \"Bir adam karısını yüz defa boşadığını söyledi ve 'Seni doksan yedi defa boşadım, sen ise bunları bir şaka gibi karşıladın' dedi.\"", id: "Al-Muwatta 1581 — Ibn Abbas: Seorang pria berkata bahwa ia menceraikan istrinya seratus kali, dan ia berkata, “Aku menceraikanmu dengan sembilan puluh tujuh kali talak, dan kau menganggapnya sebagai lelucon.”" }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن رجلا قال لعبد الله بن عباس إني طلقت امرأتي مائة تطليقة، فماذا ترى علي؟ فقال له ابن عباس طلقت منك بثلاث، وسبع وتسعون اتخذت بها آيات الله هزوا. {cite:muwatta-maruf-1997 p.59}"
  tr: "Yahya, Malik'ten rivayetle, bir adamın Abdullah ibn Abbas'a, \"Eşimi yüz kere boşadım, sence ne yapmalıyım?\" dediğini işittiğini anlatır. İbn Abbas şöyle cevap verdi: \"Beni üç kere boşadın, diğer doksan yedi keresinde de Allah'ın ayetlerini alaya aldın.\" {cite:muwatta-maruf-1997 s.59}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar seorang pria berkata kepada Abdullah ibn Abbas, “Aku telah menceraikan istriku seratus kali, jadi menurutmu apa yang harus kulakukan?” Ibn Abbas menjawab, “Kamu telah menceraikanku tiga kali, dan dengan sembilan puluh tujuh kali lainnya kamu telah memperolok-olok ayat-ayat Allah.” {cite:muwatta-maruf-1997 p.59}"
