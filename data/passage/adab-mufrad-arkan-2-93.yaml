text: "… عيباً أصلحه يأنى مرفوعا فى الحديث التالى - حدّشا إبراهيم بن حمزة قال : حدثنا انن أبى حازم، عن كثير ابن زبد، عن الوليد بز، رَباح، عن أبى هريرة، عن النبى أتيتةِ قال المؤمن مرآة أخيه. والمؤمن أخو المؤمن، يَكُفّ …"
summary:
