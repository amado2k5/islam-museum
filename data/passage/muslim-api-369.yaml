text: "… أَيُّكُمْ سَمِعَ النَّبِيَّ يَذْكُرُ الْفِتَنَ الَّتِي تَمُوجُ مَوْجَ الْبَحْرِ قَالَ حُذَيْفَةُ فَأَسْكَتَ الْقَوْمُ فَقُلْتُ أَنَا. قَالَ أَنْتَ لِلَّهِ أَبُوكَ. قَالَ حُذَيْفَةُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" تُعْرَضُ الْفِتَنُ عَلَى الْقُلُوبِ كَالْحَصِيرِ عُودًا عُودًا فَأَىُّ قَلْبٍ أُشْرِبَهَا نُكِتَ فِيهِ نُكْتَةٌ سَوْدَاءُ وَأَىُّ قَلْبٍ أَنْكَرَهَا نُكِتَ فِيهِ نُكْتَةٌ بَيْضَاءُ حَتَّى تَصِيرَ عَلَى قَلْبَيْنِ عَلَى أَبْيَضَ مِثْلِ الصَّفَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 369، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 369 (The Book of Faith), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 369، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
