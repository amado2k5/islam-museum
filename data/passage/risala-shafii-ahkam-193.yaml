text: "… أعلم - أن يقال الحكمةُ هاهنا إلا سنَّةُ رسولِ اللٰه. - وذلك أنها مقرونةٌ مع كتاب اللّٰه، وأن اللهَ اقترضَ طاعة رسوله، وحَتَّم على الناي اتّباعَ أمرِه. فلا يجوزُ أن يقالَ لقولٍ: فَرْض إلاَّ لكتابِ اللّٰه ثم سنَّةِ رسولِه. لِمَا …"
