label: { ar: "الموطأ 2649 — مالك: الملاحف المعصفرة لا يعلم فيها حراما وغيرها من اللباس أحب إليه", en: "Muwatta 2649", es: "Muwatta 2649", fr: "Muwatta 2649", ur: "موطا 2649", tr: "El-Muvatta 2649 — Malik: Safran rengine boyanmış giysilerde haram bir şey yoktur ve diğer giysi türleri O'nun daha çok hoşuna gider.", id: "Al-Muwatta 2649 — Malik: Tidak ada yang dilarang dalam pakaian yang dicelup dengan warna safron, dan jenis pakaian lain lebih disukainya." }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول في الملاحف المعصفرة في البيوت للرجال، وفي الأفنية، قال: لا أعلم من ذلك شيئا حراما، وغير ذلك من اللباس أحب إلي. {cite:muwatta-maruf-1997 p.499}"
  tr: "Yahya şöyle dedi: Malik'in, erkeklerin evlerinde ve avlularında giydikleri safran rengi battaniyeler hakkında şöyle dediğini duydum: \"Bunun haram olduğunu bilmiyorum ve ben başka tür giysileri tercih ederim.\" {cite:muwatta-maruf-1997 s.499}"
  id: "Yahya berkata: Aku mendengar Malik berkata mengenai selimut yang dicelup warna safron yang dikenakan oleh laki-laki di rumah mereka dan di halaman: Aku tidak mengetahui adanya hal yang dilarang dalam hal itu, dan aku lebih menyukai jenis pakaian lain. {cite:muwatta-maruf-1997 p.499}"
