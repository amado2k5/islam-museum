text: |-
  أباب الكاف)
  منكم
  ١٤٣
  العرب والعرب واليجم والعجم والرهب والرهب فلما جاز أن يجمع فعل على فعل منل أسد
  وأسدلم يمتنع أن يجمع فعل على فعل والفلذ واحد أفلال النجوم قال ويجوز أن يجمع على
  فهل مثل أسد وأسد وخشب وخشب والفلك موج البحر والفيلكون البردة ئك )
  الفنول اللجاج عن الكسائى" وأبو عبيدة مثله وقد فنك فى هذا الاحر يغنك فنوكا أى لج فيه
  وقتك بالممكان ف. وكاأقام به عن الاموىّ وففلك فى الفعام يفنك فنوكااذا استمر على أكاه
  ولم يعف منه شياً وفيه لغسة أخرى فنك فى الطعام بالكسر فنوكا والفقك بالتعريك الذى
  نخذمنه الفر وقال أبو عيسدة قبل لاعرابي انّ فلانابطن سراويل بفنك فقال التقى التريان
  يعى وبرالفنك وشعراسته والفنمك طرف اللسين عند العنذقة ويقسال هوالافنك ولم
  يعرفه الكسائى وفى الحديث اذا توضأت فلاتنس الففيكين يعنى جاتى العنفقة عن يمين
  وشمال وهما المغفلة
  وهو فارس معزب قال الراجز
  ياحبذا الكعل بلم مترود • وخشكان مع سويق مقنود
  (فصل اللام ابك اللبك اتخلط وقد لبكت الامرألبكه ابكا وأمرليك أى مختلط قال زهير
  ودّالقيان جمال الحفاحتملوا • الى الظهيرة أمر بينهم لبك
  وليكت السويق بالعسل خلطته قال الشاءو ١
  الى ردح من الشيزى ملاه • لباب البيليك بالشهاد
  أى من لباب البة والتبك الامرأى اختلط قال الكلابى أقول لبيكم ن غنم وقد لبكوا
  بين الشاء أى خلطوا بينه وهو مثل البكيكة واللبكة باتحريك القطعسة من التريد ويقال
  ماذقت عنده عبكة ولا لبكة⁦(لمك)⁩ اللعك مداخلة الشئ فى الذئ واتزاقه به يقال لوحك
  فقارظهره اذاد خل بعضها فى بعض وشىْ متلاحك أى متداخل قال أبو عبيد المتلا-كة
  النساقة الشديدة الخلق واللمكة دويية أظنها مقلوبة من الحلكة وقال ابن السكيت اللمكة
  دويسة شبيهة بالعظاية تبرق زرقاء وليس لهاذنب طويل مثل ذنب العظاية وقوائها خفية
  كان كه أى ضر بد مثل مكه والك أيضاشى أحر يصبغ بهجلود المعزوغيره واللك
  بالضم ثفلديركب به النصل فى النصاب والتك القوم ازدحوا ومنه قول الراجزيذ كر قلببا
  يطمواذا الورد عليه التكاء واللكيك المكتنز اللحم مثل الدخيس واللديم وهو المرمى باللحم
  والجمع الكاك وجل لكالك أى ضخم ⁦(ل ك)⁩ يقال ماذقت لما كاكما يقال ماذقت لمابا
  قال أبو يودف ماتلك عندنابلمساك مثل ما تلمج عندنا بلماج والتلك. ثل التلظ وتلك البعيراذا
  لوى لحببه وأنشد الفتراء فمارآنى قد حمت ارتحاله • تلك لويجدى عليه التلك
  لكت الشئ فى فى ألو كداذا علسكته وقد لال الفرس التجام وفلان يلوك أعراض
  النّاس أى يقع فيهم وقول الشعواء ألسكنى الى فلان يريدون به كن رسولى وتحمل رسالتى
  اليه وقد أكثروامن هذا اللفظ قال الشاعر
  ألسكف اليهاعمرك اللّه باقى • باية ماجاءت البناتهاديا
  ١ ف نسخة زيادة أمية بن آي
  الصلت اه
  قوله ملاءلباب البررواه فى مادّة
  ردح عليها لباب وق ماذة شهدكما
  هنا اه
  اللسكة والملسكة كلا همابوزن
  الهمزة اه
  قوله شئ أحرهونبات شرب
  درهم منه نافع للخفقان واليرقات
  والاستسقاء وأوجاع الكبد
  والمعدة والطحال والمنانة ويهزل
  السعان اه من القاموس
  قولد فلارآنى البيت فى وصف
  يعيركما قاله المؤلف فى مادة سم اه
  قوله وقول الشعراء ألكنى الخ
  عبارة القاموس والكنى
  فى ل أل وذكره هناوهم للجوهرى
  وكل ماذكرهمن القياس تخبيط
  اه وعبارته فى ل أدَّ والكنى
  الى فلان أبلغه عنى أصله ألتكنى
  حذفت الهمزة وألقيت بركيتها
  على ماقبله! اه
