text: "فهرس الأمم والشعوب والقبائل والطوائف الأوس،،،،،، ال فرعون. ال هاشم أ ب إرم،. بلحارث بن الخزرج. لمعدوية. أزد شَنُوءة،،،. الأساورة. بنو إسرائيل،. أسلم. بنو الأصفر. بنوامية. الأشعريون. بنو بياضة،،. أصحاب الفيل،،. بنو تيم،. أصحاب الكهف. بنو تميم،. أعراب جُهَيْنة. الأكاسرة. …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 671، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 5, p. 671, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 5، ص 671 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Tarikh al-Islam de al-Dhahabi, volumen 5, pág. 671, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 5, page 671, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 5. cildinin 671. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 5, halaman 671, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
