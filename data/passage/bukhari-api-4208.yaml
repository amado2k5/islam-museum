label: { ar: "صحيح البخاري 4208 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4208 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4208 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ سَعِيدٍ الْخُزَاعِيُّ، حَدَّثَنَا زِيَادُ بْنُ الرَّبِيعِ، عَنْ أَبِي عِمْرَانَ، قَالَ نَظَرَ أَنَسٌ إِلَى النَّاسِ يَوْمَ الْجُمُعَةِ، فَرَأَى طَيَالِسَةً فَقَالَ كَأَنَّهُمُ السَّاعَةَ يَهُودُ خَيْبَرَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4208، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4208 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4208، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
