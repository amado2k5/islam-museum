  ur: { text: "جب ہمارا حکم آگیا تو ہم نے صالح کو اور جو لوگ ان کے ساتھ ایمان لائے تھے ان کو اپنی مہربانی سے بچالیا۔ اور اس دن کی رسوائی سے (محفوظ رکھا) ۔ بےشک تمہارا پروردگار طاقتور اور زبردست ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
