text: "… تأكلها الديدان لا محالة، وكيف تتفتت عظامها، فما من شيء من لحمه وشحمه إلا وهو طعمة للدود، وما من شيء من عظامه إلا وسَيَبْلى، ويعلم أن عينيه اللتين ينظر بهما إلى ما أحل اللّٰه وما حرم سوف يأكلها الدود، وسوف …"
