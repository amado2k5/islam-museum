label: { ar: "صحيح مسلم 2798 — الأب والأبوة", en: "Sahih Muslim 2798 — the father and fatherhood", ur: "صحیح مسلم 2798 — باپ اور والدیت", es: "Sahih Muslim 2798 — El padre y la paternidad", fr: "Sahih Muslim 2798 — Le père et la paternité", tr: "Sahih Muslim 2798 — Baba ve Babalık", id: "Sahih Muslim 2798 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا شَيْبَانُ بْنُ فَرُّوخَ، حَدَّثَنَا هَمَّامٌ، حَدَّثَنَا عَطَاءُ بْنُ أَبِي رَبَاحٍ، عَنْ صَفْوَانَ، بْنِ يَعْلَى بْنِ أُمَيَّةَ عَنْ أَبِيهِ، - - قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ وَهُوَ بِالْجِعْرَانَةِ عَلَيْهِ جُبَّةٌ وَعَلَيْهَا خَلُوقٌ - أَوْ قَالَ أَثَرُ صُفْرَةٍ - فَقَالَ كَيْفَ تَأْمُرُنِي أَنْ أَصْنَعَ فِي عُمْرَتِي قَالَ وَأُنْزِلَ عَلَى النَّبِيِّ الْوَحْىُ فَسُتِرَ بِثَوْبٍ وَكَانَ يَعْلَى يَقُولُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2798، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2798 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2798، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2798 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2798 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 2798 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2798, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
