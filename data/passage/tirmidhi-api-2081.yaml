label: { ar: "جامع الترمذي 2081 — السنا والسنوت، الدواء", en: "Jami' al-Tirmidhi 2081 — senna and sannut; the drug", ur: "جامع ترمذی 2081 — سنا اور سنوت، دوا" }
text: "… بْنُ جَعْفَرٍ، حَدَّثَنِي عُتْبَةُ بْنُ عَبْدِ اللَّهِ، عَنْ أَسْمَاءَ بِنْتِ عُمَيْسٍ، أَنَّ رَسُولَ اللَّهِ سَأَلَهَا \" بِمَ تَسْتَمْشِينَ \". قَالَتْ بِالشُّبْرُمِ. قَالَ \" حَارٌّ جَارٌّ \". قَالَتْ ثُمَّ اسْتَمْشَيْتُ بِالسَّنَا. فَقَالَ النَّبِيُّ \" لَوْ أَنَّ شَيْئًا كَانَ فِيهِ شِفَاءٌ مِنَ الْمَوْتِ لَكَانَ فِي السَّنَا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. يَعْنِي دَوَاءَ الْمَشْىِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2081، يذكر السنا والسنوت، والدواء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2081 (Chapters on Medicine), that mentions senna and sannut, the drug, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2081، جس میں سنا اور سنوت، دوا، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
