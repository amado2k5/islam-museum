label: { ar: "جامع الترمذي 1903 — الأب والأبوة", en: "Jami' al-Tirmidhi 1903 — the father and fatherhood", ur: "جامع ترمذی 1903 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1903 — El padre y la paternidad" }
text: "… أَخْبَرَنَا حَيْوَةُ بْنُ شُرَيْحٍ، أَخْبَرَنِي الْوَلِيدُ بْنُ أَبِي الْوَلِيدِ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ أَبَرَّ الْبِرِّ أَنْ يَصِلَ الرَّجُلُ أَهْلَ وُدِّ أَبِيهِ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي أَسِيدٍ. قَالَ أَبُو عِيسَى هَذَا إِسْنَادٌ صَحِيحٌ وَقَدْ رُوِيَ هَذَا الْحَدِيثُ عَنِ ابْنِ عُمَرَ مِنْ غَيْرِ وَجْهٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1903، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1903 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1903، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1903 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los familiares), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
