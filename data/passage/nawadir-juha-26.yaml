text: "… إن فاتك البط فعليك بمرقه رأى يوماً سرباً من البط، قريباً من شاطىء بحيرة، فحاول أن يلتقط من هذه الطيور شيئاً، فلم يستطع، لأنها أسرعت بالفرار من أمامه. وكان معه قطعة خبز، فراح يغمسها بالماء، ويأكلها، فمرّ به أحدهم، وقال …"
summary:
  ar: "لم يستطع جحا اصطياد البط عند بحيرة، فغمس خبزًا في الماء وسماه مرق البط. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  en: "Failing to catch ducks by a lake, Juha dips bread in the water and calls it duck broth. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  ur: "جحا جھیل کے کنارے بطخیں نہ پکڑ سکا، تو اس نے روٹی پانی میں بھگوئی اور اسے بطخ کا شوربہ کہا۔ {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  fr: "Faute d'attraper des canards au bord d'un lac, Juha trempe du pain dans l'eau et l'appelle bouillon de canard. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  es: "Al no lograr atrapar patos junto a un lago, Juha moja pan en el agua y lo llama caldo de pato. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  tr: "Juha gölde hiç ördek yakalayamayınca, suya ekmek batırıp ördek suyu yaptı. {cite:juha-nawadir-kubra-djuwaydi s. 18}"
  id: "Juha tidak bisa menangkap bebek di danau, jadi dia mencelupkan roti ke dalam air dan menyebutnya kaldu bebek. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
