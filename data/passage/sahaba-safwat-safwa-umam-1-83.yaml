text: "… ثلاثة أيام عدد غزواته وسراياه وَل الم غزا رسول اللّٰه وَالي سبعاً وعشرين غزاة، وقاتل منها في تسع: بدرٍ، وأحد، والمُرَيْسِيع والخندق وقريظة، وخيبر، والفتح، وحنين، والطائف. وقيل: إنه قاتل في بني النضير، وفي غزاة وادي القرى مُنصَرفهُ من خيبر، …"
