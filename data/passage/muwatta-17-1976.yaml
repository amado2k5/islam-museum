label: { ar: "الموطأ 1976 — مالك: من اشترى سلعة بزا أو رقيقا فبت به، ثم سأله رجل أن يشركه ففعل، ونقدا الثمن صاحب السلعة جميعا، ثم أدرك السلعة شيء ينتزعها، فإن المشرك يأخذ من الذي أشركه الثمن، ويطلب الذي أشرك بيعه الذي باعه السلعة بالثمن كله، إلا أن يشترط المشرك عند البيع", en: "Muwatta 1976" }
summary:
  ar: "قال مالك: من اشترى سلعة بزا أو رقيقا، فبت به، ثم سأله رجل أن يشركه، ففعل، ونقدا الثمن صاحب السلعة جميعا. ثم أدرك السلعة شيء ينتزعها من أيديهما، فإن المشرك يأخذ من الذي أشركه الثمن، ويطلب الذي أشرك بيعه الذي باعه السلعة بالثمن كله. إلا أن يشترط المشرك على الذي أشركه بحضرة البيع، وعند مبايعة البائع الأول، وقبل أن يتفاوت ذلك: أن عهدتك على الذي ابتعت منه. وإن تفاوت ذلك، وفات البائع الأول، فشرط الآخر باطل، وعليه العهدة. {cite:muwatta-maruf-1997 p.208} {cite:muwatta-maruf-1997 p.209}"
