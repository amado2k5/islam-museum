label: { ar: "الموطأ 1976 — مالك: من اشترى سلعة بزا أو رقيقا فبت به، ثم سأله رجل أن يشركه ففعل، ونقدا الثمن صاحب السلعة جميعا، ثم أدرك السلعة شيء ينتزعها، فإن المشرك يأخذ من الذي أشركه الثمن، ويطلب الذي أشرك بيعه الذي باعه السلعة بالثمن كله، إلا أن يشترط المشرك عند البيع", en: "Muwatta 1976", es: "Muwatta 1976", fr: "Muwatta 1976", ur: "موطا 1976", tr: "El-Muvatta 1976 — Malik: Bir kimse, kumaş veya köle gibi bir mal satın alıp onunla geceyi geçirirse, sonra başka bir adam ondan ortak olmasını ister ve o da ortak olur; ikisi de malın sahibine bedeli öderlerse, sonra malda alınabilecek bir şey olursa, ortak olan kişi, ortak olan kişiden bedeli alır ve ortak olan kişi, malın sahibinden malı kendisine tam bedeliyle satmasını ister; ancak ortak, satış sırasında bunu şart koşmuşsa durum farklıdır.", id: "Al-Muwatta 1976 — Malik: Jika seseorang membeli suatu barang, seperti kain atau budak, dan bermalam dengannya, kemudian orang lain memintanya untuk menjadikannya mitra, dan ia melakukannya, dan mereka berdua membayar harga kepada pemilik barang tersebut, kemudian terjadi sesuatu pada barang tersebut yang dapat diambil darinya, maka mitra tersebut mengambil harga dari orang yang menjadikannya mitra, dan orang yang menjadikannya mitra menuntut agar orang yang menjual barang tersebut kepadanya menjualnya kembali kepadanya dengan harga penuh, kecuali jika mitra tersebut telah menetapkan hal ini pada saat penjualan." }
summary:
  ar: "قال مالك: من اشترى سلعة بزا أو رقيقا، فبت به، ثم سأله رجل أن يشركه، ففعل، ونقدا الثمن صاحب السلعة جميعا. ثم أدرك السلعة شيء ينتزعها من أيديهما، فإن المشرك يأخذ من الذي أشركه الثمن، ويطلب الذي أشرك بيعه الذي باعه السلعة بالثمن كله. إلا أن يشترط المشرك على الذي أشركه بحضرة البيع، وعند مبايعة البائع الأول، وقبل أن يتفاوت ذلك: أن عهدتك على الذي ابتعت منه. وإن تفاوت ذلك، وفات البائع الأول، فشرط الآخر باطل، وعليه العهدة. {cite:muwatta-maruf-1997 p.208} {cite:muwatta-maruf-1997 p.209}"
  tr: "Malik şöyle dedi: Bir kimse, ister kumaş ister köle olsun, bir mal satın alır ve onunla bir gece geçirirse, sonra başka bir adam ona bu işleme ortak olmasını teklif eder ve o da kabul eder, ikisi de asıl sahibine bedeli öderler ve sonra mala bir şey olur ve mal onlardan alınırsa, ortaklığı kuran ortak, bedeli ortaklık kuran kişiden alır ve malın kendisine tam bedeliyle satılmasını talep eder. Ancak, ortak, satış anında ve fiyatta herhangi bir değişiklik olmadan önce, sorumluluğun malın sahibi olan kişiye ait olduğunu ortaklık kuran kişiye şart koşarsa, bu durum geçerlidir. Eğer herhangi bir değişiklik olur ve asıl satıcı vefat etmişse, diğerinin şartı geçersiz olur ve sorumluluk ona geçer. {cite:muwatta-maruf-1997 s.208} {cite:muwatta-maruf-1997 s.209}"
  id: "Malik berkata: Jika seseorang membeli suatu barang, baik kain maupun budak, dan bermalam dengannya, kemudian orang lain memintanya untuk menjadi mitra dalam transaksi tersebut, dan ia setuju, dan mereka berdua membayar harga kepada pemilik aslinya, dan kemudian sesuatu terjadi pada barang tersebut dan mengambilnya dari mereka, maka mitra yang membuat kemitraan tersebut mengambil harga dari orang yang membuat kemitraan, dan mitra yang membuat kemitraan tersebut menuntut agar orang yang menjual barang tersebut kepadanya menjualnya kepadanya dengan harga penuh. Namun, jika mitra tersebut menetapkan kepada orang yang membuat kemitraan, pada saat penjualan dan sebelum terjadi perubahan harga, bahwa tanggung jawab terletak pada orang dari siapa ia membelinya. Jika terjadi perubahan dan penjual asli telah meninggal, maka ketentuan pihak lain tidak sah, dan tanggung jawab terletak padanya. {cite:muwatta-maruf-1997 p.208} {cite:muwatta-maruf-1997 p.209}"
