  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 2. cildinin 700. sayfasından bir alıntı; hacamat, tıp ve hekim, hastane ve tıp mesleğinden bahsediyor; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
