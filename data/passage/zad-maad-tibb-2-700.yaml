text: "… كان علمه به ونفوذه فيه أقوى، وبالله التوفيق. فصل خبث كسب الحجام الحكم السادس: خبثُ كسبِ الحجَّام، ويدخُلُ فيه الفاصد والشارِط، وكل من يكون كسبُه من إخراج الدم، ولا يدخل فيه الطبيبُ، ولا الكحَّال ولا البيطارُ لا في لفظه ولا …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 700، يذكر الحجامة، والطب والطبيب، والبيمارستان وصناعة الطب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 700, that mentions cupping, medicine and the physician, the hospital and the medical craft; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 2، ص 700 کا اقتباس جس میں حجامہ، طب اور طبیب، بیمارستان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
