label: { ar: "نوادر جحا الكبرى، ص 187 — «لا أعجب ممن أخذ الدراهم وإنما أعجب من الدابة»", en: "Nawadir Juha al-Kubra, p. 187 — 'I Do Not Marvel at the One Who Took the Coins but at the Beast'", ur: "نوادر جحا الکبریٰ، ص 187 — «مجھے سکے لینے والے پر حیرت نہیں بلکہ جانور پر ہے»", fr: "Nawadir Juha al-Kubra, p. 187 — « Je ne m'étonne pas de celui qui a pris les pièces mais de la bête »", es: "Nawadir Juha al-Kubra, p. 187 — «No me asombra quien tomó las monedas sino la bestia»", tr: "Juha'nın Büyük Fıkraları, s. 187 — “Parayı alan kişiye şaşırmadım, ama hayvana şaşırdım.”", id: "Anekdot Hebat Juha, hlm. 187 — “Saya tidak terkejut dengan orang yang mengambil uang itu, tetapi saya terkejut dengan hewannya.”" }
text: "… لا أعجبُ ممن أخذ الدراهم وإنما أعجب من الدابة سافر مع أبيه وجماعة، وكان يحملُ رُمحاً فلمَّا نزلوا ركَّز الرمح، ونادى المنادي احفظوا متاعكم من اللصوص، وكان مع جحا صرَّةٌ فيها دراهِم، فقام وعلَّقَ الصرَّة في رأس الرمح، وناموا. فجاء …"
summary:
  ar: "في رحلة علّق جحا كيس نقوده على رأس رمح، فأخذ لصوص النقود وتركوا مكانها روثاً، فقال جحا إنه يتعجب من أن دابة تسلقت الرمح بدل أن يصل إليه اللص. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  en: "On a journey Juha hangs his purse of coins on the top of a spear; thieves take the coins and leave dung in their place; Juha says he is amazed that a beast climbed the spear rather than the thief reaching it. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  ur: "سفر میں جحا نے اپنی سکوں کی تھیلی ایک نیزے کی نوک پر لٹکا دی، چور سکے لے گئے اور ان کی جگہ گوبر چھوڑ گئے، تو جحا نے کہا کہ اسے حیرت ہے کہ ایک جانور نیزے پر چڑھ گیا نہ کہ چور اس تک پہنچا۔ {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  fr: "En voyage, Juha accroche sa bourse de pièces au sommet d'une lance ; des voleurs prennent les pièces et laissent de la bouse à la place ; Juha dit qu'il s'étonne qu'une bête ait grimpé à la lance plutôt que le voleur ne l'ait atteinte. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  es: "En un viaje, Juha cuelga su bolsa de monedas en la punta de una lanza; unos ladrones se llevan las monedas y dejan estiércol en su lugar; Juha dice que le asombra que una bestia haya trepado por la lanza en lugar de que el ladrón la alcanzara. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  tr: "Bir yolculuk sırasında Juha, para kesesini bir mızrağın ucuna astı. Hırsızlar parayı alıp yerine hayvan pisliği bıraktılar. Juha, hırsızın değil de bir hayvanın mızrağa tırmanmasına hayret ettiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 187}"
  id: "Dalam perjalanan, Juha menggantungkan kantong uangnya di ujung tombak. Pencuri mengambil uang itu dan meninggalkan kotoran di tempatnya. Juha berkomentar bahwa ia takjub karena seekor hewan memanjat tombak itu, bukannya pencuri yang meraihnya. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
