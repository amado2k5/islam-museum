label: { ar: "الموطأ 450 — ابن عمر: إن اليدين تسجدان كما يسجد الوجه", en: "Muwatta 450", es: "450 palabras", fr: "450 mots", ur: "450 الفاظ", tr: "El-Muvatta 450 — İbn Ömer: Eller, yüz gibi secdeye kapanır.", id: "Al-Muwatta 450 — Ibn Umar: Tangan bersujud sebagaimana wajah bersujud" }
text: "من وضع جبهته بالأرض فليضع كفيه على الذي يضع عليه جبهته، ثم إذا رفع فليرفعهما، فإن اليدين تسجدان كما يسجد الوجه"
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول إن من وضع جبهته بالأرض فليضع كفيه على ما يضع عليه جبهته، ثم إذا رفع فليرفعهما، فإن اليدين تسجدان كما يسجد الوجه؛ وهو في باب وضع اليدين على ما يوضع عليه الوجه في السجود. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.231}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Abdullah ibn Umar'ın şöyle dediği belirtilir: \"Alnını yere koyan kimse, avuçlarını alnının üzerine koyduğu yere koysun, sonra kalkınca da avuçlarını kaldırsın; çünkü eller de yüz gibi secde eder.\" Bu, secde sırasında ellerin yüzün üzerine konulmasıyla ilgili bölümle ilgilidir. Editör, bunun Malik'ten Ebu Mus'ab, Suwaid ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Bayhaqi tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.231}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’ menyatakan bahwa Abdullah ibn Umar biasa berkata, “Barang siapa meletakkan dahinya di tanah, hendaklah ia meletakkan telapak tangannya di atas tempat dahinya diletakkan, dan kemudian ketika ia bangkit, hendaklah ia mengangkatnya, karena tangan bersujud seperti halnya wajah.” Hal ini berkaitan dengan bab tentang meletakkan tangan di atas tempat wajah diletakkan saat sujud. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.231}"
