label: { ar: "الموطأ 450 — ابن عمر: إن اليدين تسجدان كما يسجد الوجه", en: "Muwatta 450" }
text: "من وضع جبهته بالأرض فليضع كفيه على الذي يضع عليه جبهته، ثم إذا رفع فليرفعهما، فإن اليدين تسجدان كما يسجد الوجه"
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول إن من وضع جبهته بالأرض فليضع كفيه على ما يضع عليه جبهته، ثم إذا رفع فليرفعهما، فإن اليدين تسجدان كما يسجد الوجه؛ وهو في باب وضع اليدين على ما يوضع عليه الوجه في السجود. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.231}"
