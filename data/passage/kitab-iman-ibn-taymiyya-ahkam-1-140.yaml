text: "… التطوعات طاعة لله إن جعلتم كل طاعة فرضاً أو نفلاً إسلاماً. أي ان من أتى بخصلة واحدة يكون مسلما بها ويستحق اسم الاسلام. على مذهبكم في ان الايمان غير قابل للزيادة والنقص. أي المستحبات والمندوبات."
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 140، يرد فيه ذكر الفرض، والمستحب، والمندوب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 140, whose wording mentions the obligatory (fard), the recommended (mustahabb), the recommended (mandub), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 140 کا اقتباس جس میں فرض، مستحب، مندوب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Iman de Ibn Taymiyya, volume numérisé 1, p. 140, dont le texte mentionne l'obligatoire (fard), le recommandé (mustahabb), le recommandé (mandub), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Iman de Ibn Taymiyya, volumen digitalizado 1, p. 140, cuyo texto menciona lo obligatorio (fard), lo recomendado (mustahabb), lo recomendado (mandub), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Taymiyye'nin \"İman\" (İman) adlı eserinin 1. cildinin 140. sayfasından, farz, tavsiye edilen, müstehap ve itaat edilmesi gereken amelleri ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, tavsiye edilen, müstehap, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 140, yang membahas amalan wajib, anjuran, keinginan, dan ketaatan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus mengurutkan amalan wajib, anjuran, keinginan, yang tidak disukai, haram, dan dosa-dosa kecil."
