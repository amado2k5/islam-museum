text: "في الفضيلة. وحكى القاضي عن طاوس أن نحرها باركة ٦٤- باب استحباب بعث الهدي إلى الحرم لمن لا يريد الذهاب بنفسه، واستحباب تقليده وفتل القلائد، وأن باعثه لا يصير محرما، ولا يحرم عليه شيء بذلك. ١٣٢١)-٣٥٩) وحدثنا يحيى ابن يحيى"
