label: { ar: "صحيح مسلم 4880 — محو السيئات وحط الخطايا", en: "Sahih Muslim 4880 — bad deeds erased and sins shed", ur: "صحیح مسلم 4880 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sahih Muslim 4880 — malas acciones borradas y pecados perdonados", fr: "Sahih Muslim 4880 — Les mauvaises actions sont effacées et les péchés pardonnés", tr: "Sahih Muslim 4880 — Günahları silmek ve suçları ortadan kaldırmak", id: "Sahih Muslim 4880 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "… بِاللَّهِ أَفْضَلُ الأَعْمَالِ \". فَقَامَ رَجُلٌ فَقَالَ يَا رَسُولَ اللَّهِ أَرَأَيْتَ إِنْ قُتِلْتُ فِي سَبِيلِ اللَّهِ تُكَفَّرُ عَنِّي خَطَايَاىَ فَقَالَ لَهُ رَسُولُ اللَّهِ \" نَعَمْ إِنْ قُتِلْتَ فِي سَبِيلِ اللَّهِ وَأَنْتَ صَابِرٌ مُحْتَسِبٌ مُقْبِلٌ غَيْرُ مُدْبِرٍ \". ثُمَّ قَالَ رَسُولُ اللَّهِ \" كَيْفَ قُلْتَ \". قَالَ أَرَأَيْتَ إِنْ قُتِلْتُ فِي سَبِيلِ اللَّهِ أَتُكَفَّرُ عَنِّي خَطَايَاىَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4880، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4880 (The Book on Government), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4880، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 4880 (El Libro del Gobierno), habla de malas acciones borradas y pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 4880 (Le Livre du Gouvernement), évoque l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "Sahih Müslim'de 4880 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4880, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
