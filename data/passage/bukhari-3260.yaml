label:
  ar: "البخاري 3260 — أكل بعضي بعضا فأذن لها بنفسين"
  en: "Bukhari 3260 — the Fire complains to its Lord and is given two breaths"
  ur: "بخاری 3260 — أشتكت النار إلى ربها فأذن لها بنفسين"
text: "اشتكت النار إلى ربها فقالت رب أكل بعضي بعضا فأذن لها بنفسين نفس في الشتاء ونفس في الصيف فأشد ما تجدون في الحر وأشد ما تجدون من الزمهرير …"
summary:
  ar: "حديث قدسي في البخاري، رقم 3260: أكل بعضي بعضا فأذن لها بنفسين. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Bukhari, no. 3260: the Fire complains to its Lord and is given two breaths. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "بخاری میں حدیثِ قدسی، نمبر 3260: أشتكت النار إلى ربها فأذن لها بنفسين۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
