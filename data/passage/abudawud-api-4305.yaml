label: { ar: "سنن أبي داود 4305 — الأب والأبوة", en: "Sunan Abi Dawud 4305 — the father and fatherhood", ur: "سنن ابی داؤد 4305 — باپ اور والدیت", es: "Sunan Abi Dawud 4305 — El padre y la paternidad", fr: "Sunan Abi Dawud 4305 — le père et la paternité" }
text: "… جَعْفَرُ بْنُ مُسَافِرٍ التِّنِّيسِيُّ، حَدَّثَنَا خَلاَّدُ بْنُ يَحْيَى، حَدَّثَنَا بَشِيرُ بْنُ الْمُهَاجِرِ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ فِي حَدِيثِ \" يُقَاتِلُكُمْ قَوْمٌ صِغَارُ الأَعْيُنِ \". يَعْنِي التُّرْكَ قَالَ \" تَسُوقُونَهُمْ ثَلاَثَ مِرَارٍ حَتَّى تُلْحِقُوهُمْ بِجَزِيرَةِ الْعَرَبِ فَأَمَّا فِي السِّيَاقَةِ الأُولَى فَيَنْجُو مَنْ هَرَبَ مِنْهُمْ وَأَمَّا فِي الثَّانِيَةِ فَيَنْجُو بَعْضٌ وَيَهْلِكُ بَعْضٌ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4305، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4305 (Battles (Kitab Al-Malahim)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4305، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4305 (Batallas (Kitab Al-Malahim)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4305 (Batailles (Kitab Al-Malahim)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
