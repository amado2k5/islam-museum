label: { ar: "الموطأ 2133 — مالك: تفسير ذلك فيما نرى أن يرهن الرجل الرهن عند الرجل بالشيء، وفي الرهن فضل عما رهن به، فيقول الراهن للمرتهن: إن جئتك بحقك إلى أجل وإلا فالرهن لك بما فيه، فهذا لا يصلح ولا يحل، وإن جاء صاحبه بالذي رهن به بعد الأجل فهو له", en: "Muwatta 2133" }
summary:
  ar: "قال مالك: وتفسير ذلك، فيما نرى والله أعلم، أن يرهن الرجل الرهن عند الرجل بالشيء، وفي الرهن فضل عما رهن به، فيقول الراهن للمرتهن: إن جئتك بحقك إلى أجل يسميه له، وإلا فالرهن لك بما فيه. فهذا لا يصلح ولا يحل، وهذا الذي نهي عنه. وإن جاء صاحبه بالذي رهن به بعد الأجل فهو له. وأرى هذا الشرط منفسخا. {cite:muwatta-maruf-1997 p.271} {cite:muwatta-maruf-1997 p.272}"
