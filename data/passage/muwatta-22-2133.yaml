label: { ar: "الموطأ 2133 — مالك: تفسير ذلك فيما نرى أن يرهن الرجل الرهن عند الرجل بالشيء، وفي الرهن فضل عما رهن به، فيقول الراهن للمرتهن: إن جئتك بحقك إلى أجل وإلا فالرهن لك بما فيه، فهذا لا يصلح ولا يحل، وإن جاء صاحبه بالذي رهن به بعد الأجل فهو له", en: "Muwatta 2133", es: "Muwatta 2133", fr: "Muwatta 2133", ur: "موطا 2133", tr: "El-Muvatta 2133 — Malik: Bizim görüşümüze göre bunun yorumu şudur: Bir kişi bir başkasına bir şeyi rehin olarak verir ve rehin verilen şey, rehin verilenden daha fazlasını içerir. Rehin veren kişi, rehin alana şöyle der: “Eğer alacaklıyı belli bir tarihe kadar getirirsem, o senindir; aksi takdirde rehin verilen şey, içindeki her şeyle birlikte senindir.” Bu caiz değildir ve haramdır. Eğer mal sahibi, rehin verilen şeyi vadesinden sonra getirirse, o zaman o şey onundur.", id: "Al-Muwatta 2133 — Malik: Interpretasi kita terhadap hal ini adalah bahwa seseorang menjaminkan sesuatu kepada orang lain, dan jaminan tersebut berisi lebih dari apa yang dijaminkan. Kemudian pemberi jaminan berkata kepada penerima jaminan: “Jika aku membawakan uang jaminanmu pada tanggal tertentu, maka itu menjadi milikmu, jika tidak, jaminan tersebut menjadi milikmu beserta semua isinya.” Ini tidak diperbolehkan dan haram. Jika pemilik membawa apa yang dijaminkan setelah tanggal jatuh tempo, maka itu menjadi miliknya." }
summary:
  ar: "قال مالك: وتفسير ذلك، فيما نرى والله أعلم، أن يرهن الرجل الرهن عند الرجل بالشيء، وفي الرهن فضل عما رهن به، فيقول الراهن للمرتهن: إن جئتك بحقك إلى أجل يسميه له، وإلا فالرهن لك بما فيه. فهذا لا يصلح ولا يحل، وهذا الذي نهي عنه. وإن جاء صاحبه بالذي رهن به بعد الأجل فهو له. وأرى هذا الشرط منفسخا. {cite:muwatta-maruf-1997 p.271} {cite:muwatta-maruf-1997 p.272}"
  tr: "Malik şöyle dedi: Bizim görüşümüze göre ve Allah en iyisini bilir, bunun açıklaması şudur: Bir adam bir başkasına bir şeyi teminat olarak verir ve teminat, rehin verilenden daha fazlasını içerir. Rehin veren daha sonra rehin alana şöyle der: \"Belirtilen tarihe kadar alacaklını getirirsem, aksi takdirde teminat tüm içeriğiyle birlikte senindir.\" Bu caiz değildir ve yasa dışıdır, yasaklanan da budur. Rehin alan, rehin verileni belirtilen tarihten sonra getirirse, o zaman ona aittir. Bence bu şart geçersizdir. {cite:muwatta-maruf-1997 s.271} {cite:muwatta-maruf-1997 s.272}"
  id: "Malik berkata: Penjelasannya, menurut pandangan kami, dan Allah Maha Mengetahui, adalah bahwa seseorang menjaminkan sesuatu sebagai agunan kepada orang lain, dan agunan tersebut berisi lebih dari apa yang dijaminkan. Pemberi jaminan kemudian berkata kepada penerima jaminan: \"Jika saya membawakan hak Anda pada tanggal yang ditentukan, jika tidak, agunan tersebut menjadi milik Anda beserta seluruh isinya.\" Ini tidak diperbolehkan dan haram, dan inilah yang telah dilarang. Jika penerima jaminan membawa apa yang dijaminkan setelah tanggal yang ditentukan, maka itu menjadi miliknya. Saya percaya syarat ini batal. {cite:muwatta-maruf-1997 p.271} {cite:muwatta-maruf-1997 p.272}"
