text: "… روى يزيد بن خُصَيفة، عن مسلم بن سعيد أن أبا جُهَيْم أخبره: أن رجلين اختلفا في آية، فسألا عَبْدُ اللّٰه بنُ الحَارِث بنُ أسَد النبي علي عنها، فقال: إن القرآن أَنزل على سبعة أحرف، فلا تُمَارُوا في القرآن؛ فإن مِراءَ …"
summary:
