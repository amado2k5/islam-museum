text: "… عَائِشَةَ، وَأَبِي رَافِعِ، وَابْنِ عَبَّاسٍ. حَدِيثُ ابنِ عُمَرَ حَدِيثٌ حَسَنٌ غَرِيبٌ، إِنَّمَا نَعْرِفُهُ مِنْ حَدِيثِ عَبْدِ الرَّزَّاقِ، عَنْ عُبَيْدِ اللّه بنِ عُمَرَ. وَقَدِ اسْتَحَبَّ بَعْضُ أَهْلِ العِلْمِ نُزُولَ الأَبْطَحِ مِنْ غَيْرِ أَنْ يَرَوْا ذَلِكَ وَاجِباً إِلَّا مَنْ أَحَبَّ ذَلِكَ. نْءٍ، …"
