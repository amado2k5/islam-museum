label: { ar: "مسلم 2405 — راية خيبر لعلي", en: "Muslim 2405 — The Khaybar banner given to Ali", es: "Muslim 2405 — El estandarte de Khaybar entregado a Ali", fr: "Muslim 2405 — La bannière de Khaybar donnée à Ali", ur: "مسلم 2405 - خیبر کا جھنڈا جو علی کو دیا گیا تھا۔", tr: "Müslim 2405 — Hayber'in Ali için sancağı", id: "Muslim 2405 — Panji Khaybar untuk Ali" }
text: "قال رسول الله يوم خيبر: «لأعطين هذه الراية رجلاً يفتح الله على يديه، يحب الله ورسوله ويحبه الله ورسوله». فبات الناس يدوكون ليلتهم أيهم يعطاها، فأعطاها علياً وهو أرمد فبصق في عينيه فبرأ"
summary:
  ar: "رواية سهل بن سعد وسلمة بن الأكوع في فضائل علي من كتاب فضائل الصحابة؛ دعا الناس كلهم للراية صبيحة الفتح فاختار علياً وهو يشتكي عينيه، فبرأ وقال «لأن يهدي الله بك رجلاً واحداً خير لك من حمر النعم» ثم أمره بدعائهم إلى الإسلام على رسل قبل القتال."
  tr: "Sahabelerin Faziletleri kitabından Sahl bin Saad ve Salama bin Al-Akwa'nın Ali'nin faziletleri hakkındaki rivayeti şöyledir: Fetih sabahı bütün insanları sancağın altına çağırdı ve gözlerinden şikayet eden Ali'yi seçti. Ali iyileşince, \"Allah'ın senin aracılığınla bir kişiyi hidayete erdirmesi, senin için kızıl develerden daha hayırlıdır\" dedi. Sonra da savaştan önce onları yavaş yavaş İslam'a davet etmesini emretti."
  id: "Riwayat Sahl bin Saad dan Salama bin Al-Akwa’ tentang keutamaan Ali dari kitab Keutamaan Para Sahabat: Beliau menyeru seluruh rakyat untuk berkumpul di bawah panji pada pagi hari penaklukan, dan beliau memilih Ali ketika Ali sedang mengeluh tentang penglihatannya, lalu Ali sembuh dan berkata, “Bagi Allah, membimbing satu orang melalui dirimu lebih baik bagimu daripada unta merah.” Kemudian beliau memerintahkan Ali untuk menyeru mereka kepada Islam secara bertahap sebelum peperangan."
