label: { ar: "مسلم 2405 — راية خيبر لعلي", en: "Muslim 2405 — The Khaybar banner given to Ali" }
text: "قال رسول الله يوم خيبر: «لأعطين هذه الراية رجلاً يفتح الله على يديه، يحب الله ورسوله ويحبه الله ورسوله». فبات الناس يدوكون ليلتهم أيهم يعطاها، فأعطاها علياً وهو أرمد فبصق في عينيه فبرأ"
summary:
  ar: "رواية سهل بن سعد وسلمة بن الأكوع في فضائل علي من كتاب فضائل الصحابة؛ دعا الناس كلهم للراية صبيحة الفتح فاختار علياً وهو يشتكي عينيه، فبرأ وقال «لأن يهدي الله بك رجلاً واحداً خير لك من حمر النعم» ثم أمره بدعائهم إلى الإسلام على رسل قبل القتال."
