label: { ar: "الموطأ 1653 — مالك: الأمة المملوكة يلاعنها زوجها ثم يشتريها، إنه لا يطؤها وإن ملكها، لأن السنة مضت أن المتلاعنين لا يتراجعان أبدا", en: "Muwatta 1653", es: "Muwatta 1653", fr: "Muwatta 1653", ur: "موطا 1653", tr: "El-Muvatta 1653 — Malik: Eğer bir cariye kocası tarafından karşılıklı li'an (lanetleme) işlemine tabi tutulursa ve sonra kocası onu satın alırsa, ona sahip olsa bile onunla cinsel ilişkiye giremez; çünkü yerleşik uygulama şudur ki, li'an işlemine başvuranlar asla anlaşmalarından geri dönmezler." }
summary:
  ar: "يقول مالك في الأمة المملوكة يلاعنها زوجها، ثم يشتريها، إنه لا يطؤها وإن ملكها، وذلك أن السنة مضت أن المتلاعنين لا يتراجعان أبدا. {cite:muwatta-maruf-1997 p.80}"
  tr: "Malik, kocası tarafından lanet okunan ve daha sonra satın alınan bir köle kadın hakkında, kocasının ona sahip olsa bile onunla cinsel ilişkiye giremeyeceğini, çünkü yerleşik uygulamanın birbirlerine lanet okuyanların asla anlaşmalarından geri dönmemeleri olduğunu söyler. {cite:muwatta-maruf-1997 s.80}"
  id: "Malik mengatakan mengenai seorang budak perempuan yang suaminya mengutuknya, lalu membelinya, bahwa suaminya tidak dapat melakukan hubungan seksual dengannya meskipun ia memilikinya, karena praktik yang berlaku adalah bahwa mereka yang saling mengutuk tidak pernah menarik kembali perjanjian mereka. {cite:muwatta-maruf-1997 p.80}"
