text: "… مسلم يعينه والثاني البذاذة من الايمان والثالث ان النبى صلى على امه بمدان دفيت وهو ابن اخت ابى بردة بن نيار ولم يشهد بدراوكان فدا جمع على الخروج اليهامع النبى وكانت امه مريضة فامره رسول اللّٰه بالمقام على امه فرجع …"
summary:
