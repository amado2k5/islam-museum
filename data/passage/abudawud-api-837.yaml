label: { ar: "سنن أبي داود 837 — الأب والأبوة، اليتيم وفقد الأب", en: "Sunan Abi Dawud 837 — the father and fatherhood; the orphan and the father lost", ur: "سنن ابی داؤد 837 — باپ اور والدیت، یتیم اور باپ کی موت", es: "Sunan Abi Dawud 837 — El padre y la paternidad; el huérfano y el padre perdido", fr: "Sunan Abi Dawud 837 — Le père et la paternité; l’orphelin et le père perdu", tr: "Sunan Abi Davud 837 — Baba ve babalık, yetim ve babanın kaybı", id: "Sunan Abi Dawud 837 — Ayah dan peran ayah, anak yatim dan kehilangan ayah" }
text: "… شُعْبَةُ، عَنِ الْحَسَنِ بْنِ عِمْرَانَ، - قَالَ ابْنُ بَشَّارٍ الشَّامِيِّ وَقَالَ أَبُو دَاوُدَ أَبُو عَبْدِ اللَّهِ الْعَسْقَلاَنِيُّ - عَنِ ابْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِيهِ، أَنَّهُ صَلَّى مَعَ رَسُولِ اللَّهِ وَكَانَ لاَ يُتِمُّ التَّكْبِيرَ. قَالَ أَبُو دَاوُدَ مَعْنَاهُ إِذَا رَفَعَ رَأْسَهُ مِنَ الرُّكُوعِ وَأَرَادَ أَنْ يَسْجُدَ لَمْ يُكَبِّرْ وَإِذَا قَامَ مِنَ السُّجُودِ لَمْ يُكَبِّرْ."
summary:
  ar: "حديث في سنن أبي داود، رقم 837، يذكر الأب والأبوة، واليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 837 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood, the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 837، جس میں باپ اور والدیت، یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 837 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad, al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 837 (La Prière), évoque le père et la paternité, l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 837 numaralı hadis, baba ve babalık, yetim ve babanın kaybından bahsetmektedir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 837, menyebutkan tentang ayah dan peran ayah, anak yatim, dan kehilangan seorang ayah. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
