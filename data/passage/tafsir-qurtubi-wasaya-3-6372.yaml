text: "… لا أن تغمروا صوته بلغطكم، وتَبْهَرُوا منطقه بصخبكم. وفي قراءة ابن مسعود لا ترفعوا بأصواتكم. وقد كره بعض العلماء رفع الصوت عند قبره عليه السنلام. وكره بعض العلماء رفع الصوت في مجالس العلماء تشريفاً لهم؛ إذ هم ورثة الأنبياء. الرابعة …"
