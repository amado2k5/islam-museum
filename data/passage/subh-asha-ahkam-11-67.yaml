text: "… هكذا هُكذا وإلَّا فَلا لَا. وأما الغَزْو والجهادُ فى سبيل الّه تعالى، وما أوجبه فيهما قولُه : آثْيُوا خِفَانًا وثِقَالا، فأقَلُّ ما يُجْزئ فرضَ الكِفَاية منه مَرَّةٌ فى كل عام، وأما فرضُ العين فُوُجُو به علىٰ ذَوِى الاستِطاعة من المسلمين …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 11، ص 67، يرد فيه ذكر الفرض، وفرض العين، وفرض الكفاية؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 11, p. 67, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 11، ص 67 کا اقتباس جس میں فرض، فرضِ عین، فرضِ کفایہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subh al-A'sha de al-Qalqashandi, volume numérisé 11, p. 67, dont le texte mentionne l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen digitalizado 11, p. 67, cuyo texto menciona lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin 11. cildinin 67. sayfasından, farz olan fiiller, bireysel yükümlülükler ve toplu yükümlülüklerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Qalqashandi's Subh al-A'sha, Volume 11, halaman 67, yang menyebutkan amalan wajib, kewajiban individu, dan kewajiban kolektif; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
