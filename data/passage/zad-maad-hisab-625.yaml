text: "… الريحَ على سبحانه ما يُضاعِفُ به صدقَة المتصدِّق بحبة أنبتت صبعاً، وتُضاعف الصدقةُ إلى سبعمئة ضعف إلى أضعاف كثيرة، ويدخل الجنة من هذه الأمة بغير حساب سبعون ألفاً . فلا ريب أن لهذا العدد خاصية ليست لغيره، تجتمع هذه المراتبُ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 625، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 625, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 625 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
