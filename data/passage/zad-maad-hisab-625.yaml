  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin 625. sayfasında, iyi amellerin çoğaltılmasından bahseden bir pasaj; alıntılanan versiyondan alınmıştır ve kaynakların politikasına göre metin yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, hlm. 625, yang menyebutkan tentang penggandaan amal kebaikan; dari versi yang diekstrak, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
