summary:
  ar: "القسم 22 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأيمان والنذور»، ويضم فيها النصوص من 3242 إلى 3325 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 22 of Sunan Abi Dawud (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)) in the division of the open hadith dataset the museum took its reports from: reports 3242 to 3325 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 22، عنوان «کتاب الایمان والنذور»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3242 تا 3325۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 22 de Sunan Abi Dawud (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3242 al 3325, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Abi Dawud (Serments et Vœux), dans la base de données ouverte: les hadiths 3242 à 3325 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 22. bölümü \"Yeminler ve Sözler Kitabı\" başlığını taşımakta olup, 3242 ile 3325 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 22 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sumpah dan Janji\" dan berisi teks 3242 hingga 3325, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
