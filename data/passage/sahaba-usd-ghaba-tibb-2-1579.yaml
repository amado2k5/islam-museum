text: "… إن رسول اللّٰه علله نهى عنه، وقال: يفعل ذلك اليهود، ولكن صوموا، فإذا كان كانت تخرج مع رسول اللّٰه عليه في مغازيه، تداوي الجرحى وتقوم على المرضى. روى عنها ذلك الليل فأفطروا أحمد. أخرجه الثلاثة. موسى بن القاسم، وحديثها عن …"
summary:
