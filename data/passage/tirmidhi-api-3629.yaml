label: { ar: "جامع الترمذي 3629 — أثر من الآثار المحفوظة", en: "Jami' al-Tirmidhi 3629 — a relic kept after its owner", ur: "جامع ترمذی 3629 — محفوظ آثار و تبرکات", es: "Jami' al-Tirmidhi 3629 — una reliquia conservada después de su propietario.", fr: "Jami' al-Tirmidhi 3629 — une relique conservée après son propriétaire", tr: "Cami' el-Tirmizi 3629 — Korunmuş bir hadis", id: "Jami' al-Tirmidhi 3629 — Hadits yang lestari" }
text: "… مُحَمَّدُ بْنُ بَشَّارٍ، بُنْدَارٌ حَدَّثَنَا أَبُو عَاصِمٍ، حَدَّثَنَا عَزْرَةُ بْنُ ثَابِتٍ، حَدَّثَنَا عِلْبَاءُ بْنُ أَحْمَرَ، حَدَّثَنَا أَبُو زَيْدِ بْنُ أَخْطَبَ، قَالَ مَسَحَ رَسُولُ اللَّهِ يَدَهُ عَلَى وَجْهِي وَدَعَا لِي قَالَ عَزْرَةُ إِنَّهُ عَاشَ مِائَةً وَعِشْرِينَ سَنَةً وَلَيْسَ فِي رَأْسِهِ إِلاَّ شَعَرَاتٌ بِيضٌ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. وَأَبُو زَيْدٍ اسْمُهُ عَمْرُو بْنُ أَخْطَبَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3629، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3629 (Chapters on Virtues), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3629، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3629 (Capítulos sobre las virtudes), menciona una reliquia conservada tras la muerte de su propietario. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un récit du Jami' al-Tirmidhi, n° 3629 (Chapitres sur les vertus), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'de 3629 numaralı hadis, günümüze kadar korunmuş bir rivayeti zikretmektedir. Bu hadis, vasiyetnameler, miras, gelenekler ve türbeler üzerine çalışan araştırmacılar tarafından Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3629, menyebutkan sebuah tradisi yang terpelihara. Hadits ini dikumpulkan oleh para peneliti wasiat, warisan, tradisi, dan makam suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
