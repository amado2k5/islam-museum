text: "… اللغة: الحبس، والحجر، والحيازة، والمنع، وهو خلاف الإباحة، والمحظور هو الممنوع. وأما المعنى الاصطلاحي فلا يخرج عن المعنى اللغوي إلا أن يقال: المحظور هو الممنوع شرعا، وهو أعم من أن يكون حراما أو مكروها، وقصره بعضهم على المحرم فقط. قال …"
