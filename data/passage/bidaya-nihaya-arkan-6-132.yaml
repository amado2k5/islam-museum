text: "… والروم، والدخان، والبطشة، والقمر، وفى رواية عن ابن مسعود، قال : إن قريشا لما استعصت على رسول اللّٰه ولي وأبطاوا عن الإسلام، قال : اللهم أعنى عليهم بسبع كسبع يوسف قال : فأصابتهم سنة حتى حصت كل شيء، حتى أكلوا …"
summary:
