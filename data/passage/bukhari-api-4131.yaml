label: { ar: "صحيح البخاري 4131 — الأب والأبوة", en: "Sahih al-Bukhari 4131 — the father and fatherhood", ur: "صحیح بخاری 4131 — باپ اور والدیت", es: "Sahih al-Bukhari 4131 — El padre y la paternidad", fr: "Sahih al-Bukhari 4131 — le père et la paternité" }
text: "… فَيَرْكَعُ بِهِمْ رَكْعَةً، فَلَهُ ثِنْتَانِ، ثُمَّ يَرْكَعُونَ وَيَسْجُدُونَ سَجْدَتَيْنِ. حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ شُعْبَةَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ صَالِحِ بْنِ خَوَّاتٍ، عَنْ سَهْلِ بْنِ أَبِي حَثْمَةَ، عَنِ النَّبِيِّ. حَدَّثَنِي مُحَمَّدُ بْنُ عُبَيْدِ اللَّهِ، قَالَ حَدَّثَنِي ابْنُ أَبِي حَازِمٍ، عَنْ يَحْيَى، سَمِعَ الْقَاسِمَ، أَخْبَرَنِي صَالِحُ بْنُ خَوَّاتٍ، عَنْ سَهْلٍ، حَدَّثَهُ قَوْلَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4131، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4131 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4131، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4131 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4131 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
