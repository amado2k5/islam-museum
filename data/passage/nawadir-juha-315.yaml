text: "… غداً يخرج صوتها كان ذات ليلة راكباً مع تلميذه عائدَيْن إلى دارِه، فرأيا لصوصاً يلعبون بِقُفْل الباب، فخشِيَ إذا عارضهم أن يقع في هلكة، فلم ينبس ببنت شفةٍ، بل أنسحب جانباً، وكانوا قد تألَّبوا على الباب يعالجونه. فسأل حماد شيخه …"
summary:
  ar: "كان جحا عائداً إلى بيته على دابته مع تلميذه حماد، فرأى لصوصاً يحاولون فتح قفل باب، فسأل حماد ماذا يفعلون، فقال جحا إنهم يضربون العود، فسأل حماد لماذا لا يصدر صوتاً، فقال جحا «غداً يخرج صوتها». {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  en: "Riding home with his pupil Hammad, Juha sees thieves trying to pick a door lock; Hammad asks what they are doing; Juha says they are striking the lute; Hammad asks why it does not sound; Juha says 'tomorrow it will sound'. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  ur: "جحا اپنے شاگرد حماد کے ساتھ سواری پر گھر لوٹ رہا تھا کہ اس نے چوروں کو دروازے کا تالا کھولنے کی کوشش کرتے دیکھا، حماد نے پوچھا کہ وہ کیا کر رہے ہیں، جحا نے کہا کہ وہ عود بجا رہے ہیں، حماد نے پوچھا کہ اس سے آواز کیوں نہیں آتی، تو جحا نے کہا «کل اس کی آواز نکلے گی»۔ {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  fr: "En rentrant chez lui à cheval avec son élève Hammad, Juha voit des voleurs qui tentent de crocheter la serrure d'une porte ; Hammad demande ce qu'ils font ; Juha dit qu'ils jouent du luth ; Hammad demande pourquoi il ne sonne pas ; Juha répond : « Demain, il sonnera ». {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  es: "Cuando vuelve a casa montado con su alumno Hammad, Juha ve a unos ladrones intentando forzar la cerradura de una puerta; Hammad pregunta qué hacen; Juha dice que están tocando el laúd; Hammad pregunta por qué no suena; Juha responde: «Mañana sonará». {cite:juha-nawadir-kubra-djuwaydi p. 155}"
