label: { ar: "الموطأ 2095 — يحيى عن مالك عن محمد بن عمارة عن أبي بكر بن حزم: قال عثمان بن عفان: إذا وقعت الحدود في الأرض فلا شفعة فيها، ولا شفعة في بئر ولا في فحل النخل", en: "Muwatta 2095", es: "Muwatta 2095", fr: "Muwatta 2095", ur: "موطا 2095", tr: "El-Muvatta 2095 — Yahya, Malik'ten, o da Muhammed ibn Ammarah'tan, o da Ebu Bekr ibn Hazm'dan rivayetle: Osman ibn Affan dedi ki: Eğer arazi üzerinde sınırlar belirlenmişse, orada ön alım hakkı yoktur; ne bir kuyuda ne de erkek hurma ağacında ön alım hakkı vardır.", id: "Al-Muwatta 2095 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Muhammad ibn Ammarah, berdasarkan riwayat Abu Bakr ibn Hazm: Uthman ibn Affan berkata: Jika batas-batas tanah telah ditetapkan, maka tidak ada hak prioritas di dalamnya, demikian pula tidak ada hak prioritas di sumur atau di pohon kurma jantan." }
summary:
  ar: "يروي يحيى عن مالك عن محمد بن عمارة عن أبي بكر بن حزم أن عثمان بن عفان قال: إذا وقعت الحدود في الأرض فلا شفعة فيها. ولا شفعة في بئر، ولا في فحل النخل. {cite:muwatta-maruf-1997 p.256}"
  tr: "Yahya, Malik'ten, o da Muhammed ibn Ammarah'tan, o da Ebu Bekr ibn Hazm'dan rivayetle Osman ibn Affan'ın şöyle dediğini naklediyor: \"Bir arazinin sınırları belirlenmişse, orada ön alım hakkı yoktur. Bir kuyuda da, erkek hurma ağacında da ön alım hakkı yoktur.\" {cite:muwatta-maruf-1997 s.256}"
  id: "Yahya meriwayatkan dari Malik, dari Muhammad ibn Ammarah, dari Abu Bakr ibn Hazm, bahwa Uthman ibn Affan berkata: \"Jika batas-batas suatu tanah telah ditetapkan, maka tidak ada hak prioritas pembelian di dalamnya. Tidak ada hak prioritas pembelian di sumur, maupun di pohon kurma jantan.\" {cite:muwatta-maruf-1997 p.256}"
