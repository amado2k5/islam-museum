text: "… الخاص به عند الحاجة إليه، كالسؤال عن الفعل. وأن الحد لا يجب على جاهل بالتحريم، لأنه بي سأله عن حكم الزنى، فقال: أتيتُ منها حراماً ما يأتي الرجل مِن أهله حلالاً. وأن الحد لا يُقام على الحامل، وأنها إذا ولدت …"
