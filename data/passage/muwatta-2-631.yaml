text: "لا يموت لأحد من المسلمين ثلاثة من الولد، فتمسه النار، إلا تحلة القسم"
summary:
  ar: "أول حديث في باب الحسبة في المصيبة. يرويه مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة، أن النبي أخبر أنه لا يموت لأحد من المسلمين ثلاثة من الولد فتمسه النار إلا تحلة القسم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري في الأدب المفرد (143)، وسويد، والقعنبي، وابن وهب، وابن القاسم، ومعن عند الترمذي (1060)، ويحيى بن سعيد القطان عند أحمد، ويحيى بن يحيى النيسابوري عند مسلم (8/39). {cite:muwatta-maruf-1997 p.322}"
