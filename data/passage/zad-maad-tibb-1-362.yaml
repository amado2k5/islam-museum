text: "… وَسَهُمَ الصَّفِي نْتُمْ آمِنُونَ بِأْمَانِ اللَّهِ وَرَسُولِهِ أمو حاود:. وكان سيفُهُ ذُو الفَقَارِ مِن الصَّفِيِّ حسن: أحمد:، والترمذي:، وأين ماجه:. السهم لمن غاب لمصلحة المسلمين وكان يُسهِمُ لمن غاب عن الوقعةِ لمصلحةِ حضُرْها لِمكان تمريضه لامراتِهِ رُقيَّة ابنة وحاجة رَسُولِهِ …"
