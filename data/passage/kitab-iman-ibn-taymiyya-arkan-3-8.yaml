text: "… الشام، عن أبيه، عن النبي وَلِيفِ، قال له: أسلم تسلم قال: وما الإسلام؟ قال: أن تسلم قلبك لله، وأن يسلم المسلمون من لسانك ويدك قال: فأي الإسلام أفضل؟ قال: الإيمان قال: وما الإيمان؟ قال: أن تؤمن بالله، وملائكته، وكتبه، ورسله، …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 3، ص 8، يذكر تعريف الإسلام بأعماله، والسؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 3, p. 8, that mentions Islam defined by its acts, the question about faith and its answer, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 3، ص 8 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 3, pág. 8, que menciona el Islam definido por sus actos, la cuestión de la fe y su respuesta, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 3, page 8): l'islam y est défini par ses actes, la question de la foi et sa réponse, ainsi que la douceur et la plénitude de la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 3. cildinin 8. sayfasından bir alıntı, İslam'ın amelleri üzerinden tanımlanmasını, imanla ilgili soru ve cevabı, imanın tatlılığını ve mükemmelliğini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 3, halaman 8, membahas definisi Islam melalui tindakannya, pertanyaan dan jawaban mengenai iman, serta keindahan dan kesempurnaan iman. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
