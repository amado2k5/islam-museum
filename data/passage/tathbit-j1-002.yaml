label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٢", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 2", ur: "تثبیت دلائل نبوت — حصہ اول، باب 2" }
text: "عاب آلهتهم وآباءهم وعقولهم وضلل أديانهم، فعصمه الله منهم وهو رجل فريد بينهم، وهو في مثوبة الموت، وخندق الخوف، وذل اليتم، ووحشة الوحدة، لا يعتصم منهم بمخلوق، فصرفهم الله عنه وهذه حاله، فلو لم يكن من آياته ودلائل …"
summary:
  ar: "مقطع من الباب ٢ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 2 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 2 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
