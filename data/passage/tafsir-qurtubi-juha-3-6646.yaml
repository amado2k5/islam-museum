text: "… أبن كَيْسَان : تحزنون؛ والمعنى متقارب. وفيه لغتان: تفَكَّهون وتَفَكَّنُون: قال الفراء؛ والنون لغة عُكْل. وفي الصحاح : التفكّن التندّم على ما فات. وقيل: التفكّه التكلم فيما لا بعنيك، ومنه قيل للمزاح فُكَاهة بالضم؛ فأما الفَكاهة بالفتح فمصدر فِكه الرجلُ …"
