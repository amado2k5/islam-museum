label:
  ar: "سنن النسائي، كتاب الاستعاذة"
  en: "Sunan al-Nasa'i, Book 50: The Book of Seeking Refuge with Allah"
  ur: "سنن نسائی، کتاب الاستعاذۃ"
  es: "Sunan al-Nasa'i, Libro 50: El Libro de la Búsqueda de Refugio en Allah"
  fr: "Sunan al-Nasa'i, Livre 50: Le Livre de la Recherche de Refuge auprès d'Allah"
summary:
  ar: "القسم 50 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاستعاذة»، ويضم فيها النصوص من 5428 إلى 5539 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 50 of Sunan al-Nasa'i (The Book of Seeking Refuge with Allah) in the division of the open hadith dataset the museum took its reports from: reports 5428 to 5539 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 50، عنوان «کتاب الاستعاذۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5428 تا 5539۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 50 de Sunan al-Nasa'i (El Libro de la Búsqueda de Refugio en Allah) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5428 al 5539, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan al-Nasa'i (Livre de la recherche de refuge auprès d'Allah), dans la partie 5428 à 5539 de la base de données ouverte. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
