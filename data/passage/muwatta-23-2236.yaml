label: { ar: "الموطأ 2236 — مالك عن عمر بن عبد الرحمن بن دلاف المزني عن أبيه: كان رجل من جهينة يسبق الحاج، فيشتري الرواحل فيغلي بها، ثم يسرع السير، فأفلس، فرفع أمره إلى عمر بن الخطاب، فقال: إن الأسيفع رضي من دينه وأمانته بأن يقال سبق الحاج، وقد دان معرضا، فمن كان له عليه دين فليأتنا بالغداة", en: "Muwatta 2236", es: "Muwatta 2236", fr: "Muwatta 2236", ur: "موطا 2236", tr: "El-Muvatta 2236 — Malik, Ömer ibn Abdülrahman ibn Dalaf el-Muzani'den, o da babasından rivayetle: Cühayna'dan bir adam vardı, hacıların önünden gidip develer satın alıp fahiş fiyatlar istiyor, sonra da yolculuğunu hızlandırıyordu. İflas etti, bu yüzden durumu Ömer ibn el-Hattab'ın dikkatine sunuldu. Ömer şöyle dedi: \"El-Usayfa', dininden ve güvenilirliğinden memnundu, hacıların önünden gittiği ve borç alıp ödemeyi reddettiği söylendiğinde de memnun oldu. Ona borcu olan herkes yarın sabah bize gelsin.\"", id: "Al-Muwatta 2236 — Malik, berdasarkan riwayat Umar ibn Abd al-Rahman ibn Dalaf al-Muzani, berdasarkan riwayat ayahnya: Ada seorang pria dari Juhayna yang biasa mendahului para peziarah, membeli unta dan mematok harga yang sangat tinggi, kemudian mempercepat perjalanannya. Ia bangkrut, sehingga kasusnya disampaikan kepada Umar ibn al-Khattab, yang berkata: “Al-Usayfa’ merasa puas dengan agamanya dan kejujurannya setelah diberitahu bahwa ia mendahului para peziarah, dan ia meminjam uang sambil menolak untuk membayar. Maka siapa pun yang memiliki hutang kepadanya, hendaknya datang kepada kami besok pagi.”" }
summary:
  ar: "يروي مالك عن عمر بن عبد الرحمن بن دلاف المزني عن أبيه أن رجلا من جهينة كان يسبق الحاج، فيشتري الرواحل فيغلي بها، ثم يسرع السير فيسبق الحاج، فأفلس، فرفع أمره إلى عمر بن الخطاب، فقال: أما بعد أيها الناس، فإن الأسيفع، أسيفع جهينة، رضي من دينه وأمانته بأن يقال: سبق الحاج. ألا وإنه قد دان معرضا، فأصبح قد رين به، فمن كان له عليه دين فليأتنا بالغداة، نقسم ماله بينهم. وإياكم والدين، فإن أوله هم وآخره حرب. {cite:muwatta-maruf-1997 p.319} {cite:muwatta-maruf-1997 p.320}"
  tr: "Malik, Ömer ibn Abdülrahman ibn Dalaf el-Muzani'den, o da babasından rivayet ettiğine göre, Cuhayna'lı bir adamın hacıları geride bıraktığını, develeri yüksek fiyatlarla satın alıp yolculuğunu hızlandırarak hacıları geçtiğini anlatır. İflas etmiş ve durumu Ömer ibn el-Hattab'ın huzuruna getirilmiştir. Ömer şöyle buyurmuştur: “Ey insanlar, Cuhayna'lı bu adam, hacıları geride bıraktığı bilgisiyle yetindi. Karşılığını beklemeden borç aldı ve şimdi borçludur. Borcu olan herkes yarın sabah bize gelsin, malını aralarında paylaştıralım. Borçtan sakının, çünkü onun başlangıcı keder, sonu ise savaştır.”"
  id: "Malik meriwayatkan dari Umar ibn Abd al-Rahman ibn Dalaf al-Muzani, yang juga dari ayahnya, bahwa seorang pria dari Juhayna biasa mendahului para peziarah. Ia membeli unta dengan harga yang melambung tinggi, kemudian mempercepat perjalanannya dan menyusul para peziarah. Ia bangkrut, dan kasusnya dibawa ke hadapan Umar ibn al-Khattab, yang berkata: “Wahai manusia, orang ini, yang dari Juhayna, merasa puas karena mengetahui bahwa ia mendahului para peziarah. Ia meminjam uang tanpa mengharapkan imbalan apa pun, dan sekarang ia berhutang. Siapa pun yang memiliki hutang kepadanya, hendaklah datang kepada kami besok pagi, dan kami akan membagi hartanya di antara mereka. Waspadalah terhadap hutang, karena permulaannya adalah kekhawatiran dan akhirnya adalah peperangan.”"
