text: "… كان يُسِرّ حديثه من أهله.... ما قالوا في الطَّيَرَة... من رخص في الطَّيَرَة.. أبواب أدب طلب العلم : من كان يستحب أن يُسأل ويقول: سلوني.. من كره النظر في كتب أهل الكتاب... من رخص في كتاب العلم. من كان يكره …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 193، يرد فيه ذكر المستحب، وما كان يُكره، والرخصة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 193, whose wording mentions the recommended (mustahabb), what used to be disliked, the concession (rukhsa), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
