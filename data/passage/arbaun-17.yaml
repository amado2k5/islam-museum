text: "إن الله كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القتلة، وإذا ذبحتم فأحسنوا الذبحة، وليحد أحدكم شفرته، وليرح ذبيحته"
summary:
  ar: "حديث شداد بن أوس، وهو الحديث السابع عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه مسلم (1955) وحده من رواية أبي قلابة عن أبي الأشعث الصنعاني عن شداد بن أوس، وتركه البخاري لأنه لم يخرج في صحيحه لأبي الأشعث شيئاً وهو شامي ثقة، وروي نحوه بإسنادين ضعيفين عن سمرة بن جندب وعن أنس؛ وفي رواية مرسلة «إن الله كتب الإحسان على كل خلق»؛ ويبين ابن رجب قولين في المعنى: أنه كتب على كل مخلوق الإحسان فيكون المكتوب عليه كل شيء والمكتوب الإحسان، أو أنه كتب الإحسان إلى كل شيء أو في كل شيء فيكون المذكور المحسن إليه؛ وأن لفظ «الكتابة» يقتضي الوجوب عند أكثر الفقهاء والأصوليين، ويستعمل في القرآن فيما هو واجب شرعاً أو واقع قدراً ⁦(جامع العلوم والحكم ص 360–374)⁩."
  en: "Shaddad ibn Aws's hadith, the seventeenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim alone (1955) through Abu Qilaba from Abu al-Ash'ath al-San'ani from Shaddad ibn Aws, al-Bukhari omitting it as he narrates nothing from Abu al-Ash'ath in his Sahih though he is a reliable Syrian, with weak parallels from Samura ibn Jundab and Anas, and a mursal route 'upon every creature'; Ibn Rajab sets out two readings — that ihsan is written upon every created thing, so that 'everything' bears the prescription and ihsan is what is prescribed, or that ihsan is written toward or in everything, the one benefited being named rather than the one bound — and that the wording of 'writing' entails obligation for most jurists and usul scholars, the Quran using it both for what is legally obligatory and for what is decreed without fail (Jami' al-Ulum wal-Hikam pp. 360–374)."
  es: "Hadiz de Shaddad ibn Aws, el decimoséptimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Muslim solamente (1955) a través de Abu Qilaba de Abu al-Ash'ath al-San'ani de Shaddad ibn Aws, al-Bukhari lo omitió ya que no narra nada de Abu al-Ash'ath en su Sahih aunque es un sirio confiable, con débiles paralelos de Samura ibn Jundab y Anas, y una ruta mursal 'sobre cada criatura'; Ibn Rajab presenta dos lecturas: que ihsan está escrito en cada cosa creada, de modo que \"todo\" lleva la prescripción e ihsan es lo que está prescrito, o que ihsan está escrito hacia o en todo, nombrando al beneficiado en lugar del obligado; y que la formulación de \"escritura\" implica obligación para la mayoría de los juristas y eruditos de usul, el Corán la utiliza tanto para lo que es legalmente obligatorio como para lo que está decretado sin falta (Jami' al-Ulum wal-Hikam pp. 360-374)."
  fr: "Le hadith de Shaddad ibn Aws, le dix-septième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Muslim seul (1955) par Abu Qilaba d'après Abu al-Ash'ath al-San'ani d'après Shaddad ibn Aws, al-Bukhari l'omettant car il ne rapporte rien d'Abu al-Ash'ath dans son Sahih bien qu'il soit un Syrien fiable, avec de faibles parallèles de Samura ibn Jundab et Anas, et une voie mursal « sur chaque créature »; Ibn Rajab propose deux lectures: soit l’ihsan est inscrit sur toute chose créée, de sorte que « tout » porte la prescription et que l’ihsan est ce qui est prescrit, soit l’ihsan est inscrit sur ou dans toute chose, celui qui en bénéficie étant nommé plutôt que celui qui est lié; et que la formulation « inscrire » implique une obligation pour la plupart des juristes et des spécialistes de l’usul, le Coran l’utilisant à la fois pour ce qui est légalement obligatoire et pour ce qui est décrété sans faute (Jami' al-Ulum wal-Hikam pp. 360–374)."
  ur: "شداد بن اوس کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی سترویں؛ اکیلے مسلم نے (1955) ابو قلابہ کے ذریعے ابو الاشعث الثانانی سے شداد بن اوس سے نقل کیا ہے، بخاری نے اسے چھوڑ دیا ہے کیونکہ اس نے اپنی صحیح میں ابو الاشعث سے کچھ بھی نقل نہیں کیا ہے حالانکہ وہ ایک معتبر شامی ہے، سمرہ بن جندب اور انصاری کے راستے سے کمزور متوازی کے ساتھ۔ ابن رجب نے دو نصیحتیں بیان کی ہیں - یہ کہ احسان ہر تخلیق شدہ چیز پر لکھا جاتا ہے، تاکہ 'ہر چیز' نسخہ پر مشتمل ہو اور احسان وہی ہے جو مشروع ہے، یا احسان وہ ہے جو کسی چیز کی طرف یا ہر چیز میں لکھا جاتا ہے، جس کا نام ایک پابند کے بجائے نام رکھنے سے فائدہ ہوتا ہے - اور یہ کہ 'لکھنا' کا لفظ واجب ہے جو کہ اکثر علماء اور اہل علم کے نزدیک واجب ہے۔ اور اس کے لیے جس کا حکم دیا گیا ہے ⁦(جامع العلوم والحکم صفحہ 360-374)⁩۔"
  tr: "Şaddad bin Evs hadisi, El-Arba'in El-Neveviyye'de ve İbn Receb'in açıklamasında on yedinci hadis olup; Müslim (1955) tarafından tek başına Ebu Kabil'den, Ebu Eş'at El-Sanani'den, o da Şaddad bin Evs'ten rivayet edilmiştir. Buhari ise, Ebu Eş'at'tan Sahih'ine hiçbir şey dahil etmediği için bu hadisi nakletmemiştir; Ebu Eş'at güvenilir bir Suriyeli alimdir. Benzer bir hadis, Samurah bin Cundub ve Enes'ten iki zayıf isnad zinciriyle de rivayet edilmiştir. Ayrıca, mursal bir rivayette, \"Allah her yaratığa iyilik farz kılmıştır\" denilmiştir. İbn Receb, bunun anlamı hakkında iki görüş ortaya koymuştur: Birincisi, Allah her yaratığa iyilik farz kılmıştır, dolayısıyla farz kılınan her şey ve farz kılınan iyiliktir; ikincisi ise, Allah her şeye veya her şeyde iyilik farz kılmıştır, dolayısıyla bahsedilen, kendisine iyilik gösterilen kimsedir. \"Ve 'emretmek' kelimesi, çoğu hukukçu ve fıkıh âlimine göre yükümlülük anlamına gelir ve Kur'an'da şeriat gereği zorunlu olan veya ilahi takdirle gerçekleşen şeyler için kullanılır (Cami' el-Ulum ve el-Hikam, s. 360-374)."
  id: "Hadits Syadad bin Aws, yang merupakan hadits ketujuh belas dalam Al-Arba’in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Muslim (1955) sendiri dari riwayat Abu Qilabah atas otoritas Abu Al-Ash’ath Al-San’ani atas otoritas Syadad bin Aws, dan Al-Bukhari tidak memasukkannya karena ia tidak memasukkan apa pun dalam Shahihnya untuk Abu Al-Ash’ath, dan ia adalah seorang ahli Suriah yang terpercaya, dan sesuatu yang serupa diriwayatkan dengan dua sanad lemah atas otoritas Samurah bin Jundub dan atas otoritas Anas; dan dalam riwayat mursal, “Allah telah menetapkan kebaikan atas setiap ciptaan”; dan Ibn Rajab menjelaskan dua pendapat mengenai maknanya: bahwa Dia menetapkan kebaikan atas setiap makhluk, sehingga apa yang ditetapkan atasnya adalah segala sesuatu dan apa yang ditetapkan adalah kebaikan, atau bahwa Dia menetapkan kebaikan kepada segala sesuatu atau di dalam segala sesuatu, sehingga apa yang disebutkan adalah kepada siapa kebaikan ditunjukkan; dan bahwa kata “menetapkan” menyiratkan kewajiban menurut sebagian besar ahli hukum dan ulama fiqih, dan digunakan dalam Al-Qur'an untuk apa yang diwajibkan oleh syariat atau terjadi atas ketetapan ilahi (Jami’ Al-‘Ulum wa Al-Hikam, hlm. 360–374)."
