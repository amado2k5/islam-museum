label: { ar: "الموطأ 2384 — عثمان وعلي: المرأة التي ولدت لستة أشهر لا رجم عليها", en: "Muwatta 2384" }
summary:
  ar: "بلغ مالكا أن عثمان بن عفان أُتي بامرأة ولدت في ستة أشهر، فأمر برجمها. فقال له علي بن أبي طالب: ليس ذلك عليها، فإن الله يذكر في كتابه أن الحمل والفصال ثلاثون شهرا، ويذكر أن الوالدات يرضعن أولادهن حولين كاملين، فالحمل يكون ستة أشهر، فلا رجم عليها. فبعث عثمان في أثرها فوجدها قد رجمت. {cite:muwatta-maruf-1997 p.386} {cite:muwatta-maruf-1997 p.387}"
