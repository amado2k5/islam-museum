label: { ar: "الموطأ 2384 — عثمان وعلي: المرأة التي ولدت لستة أشهر لا رجم عليها", en: "Muwatta 2384", es: "Muwatta 2384", fr: "Muwatta 2384", ur: "موطا 2384", tr: "El-Muvatta 2384 — Osman ve Ali: Altı aydan sonra doğum yapan kadın taşlanmamalıdır.", id: "Al-Muwatta 2384 — Uthman dan Ali: Wanita yang melahirkan setelah enam bulan tidak boleh dirajam" }
summary:
  ar: "بلغ مالكا أن عثمان بن عفان أُتي بامرأة ولدت في ستة أشهر، فأمر برجمها. فقال له علي بن أبي طالب: ليس ذلك عليها، فإن الله يذكر في كتابه أن الحمل والفصال ثلاثون شهرا، ويذكر أن الوالدات يرضعن أولادهن حولين كاملين، فالحمل يكون ستة أشهر، فلا رجم عليها. فبعث عثمان في أثرها فوجدها قد رجمت. {cite:muwatta-maruf-1997 p.386} {cite:muwatta-maruf-1997 p.387}"
  tr: "Malik rivayet etti ki, Osman ibn Affan'a altı aylıkken doğum yapmış bir kadın getirildi ve Osman onu taşlayarak öldürmeyi emretti. Ali ibn Abi Talib ona, \"Bu onun için caiz değildir, çünkü Allah Kitabında gebeliğin ve emzirmenin otuz ay sürdüğünü ve annelerin çocuklarını iki yıl emzirdiğini belirtmektedir. Dolayısıyla gebelik altı aydır ve o taşlanmamalıdır\" dedi. Osman adamlarını kadının peşinden gönderdi ve kadının zaten taşlanmış olduğunu gördü."
  id: "Malik meriwayatkan bahwa Utsman bin Affan didatangi seorang wanita yang telah melahirkan setelah enam bulan, dan ia memerintahkan agar wanita itu dirajam. Ali bin Abi Talib berkata kepadanya, \"Itu tidak diperbolehkan baginya, karena Allah menyebutkan dalam Kitab-Nya bahwa kehamilan dan penyapihan berlangsung selama tiga puluh bulan, dan Dia menyebutkan bahwa ibu menyusui anak-anaknya selama dua tahun penuh. Oleh karena itu, kehamilan adalah enam bulan, dan dia tidak boleh dirajam.\" Utsman mengirim orang-orang untuk mencarinya dan mendapati bahwa wanita itu telah dirajam."
