label: { ar: "سنن أبي داود 323 — الأب والأبوة", en: "Sunan Abi Dawud 323 — the father and fatherhood", ur: "سنن ابی داؤد 323 — باپ اور والدیت", es: "Sunan Abi Dawud 323 — El padre y la paternidad", fr: "Sunan Abi Dawud 323 — le père et la paternité", tr: "Sunan Abi Davud 323 — Baba ve Babalık", id: "Sunan Abi Dawud 323 — Sang Ayah dan Peran Ayah" }
text: "… ثُمَّ ضَرَبَ بِيَدَيْهِ الأَرْضَ ثُمَّ ضَرَبَ إِحْدَاهُمَا عَلَى الأُخْرَى ثُمَّ مَسَحَ وَجْهَهُ وَالذِّرَاعَيْنِ إِلَى نِصْفِ السَّاعِدَيْنِ وَلَمْ يَبْلُغِ الْمِرْفَقَيْنِ ضَرْبَةً وَاحِدَةً. قَالَ أَبُو دَاوُدَ وَرَوَاهُ وَكِيعٌ عَنِ الأَعْمَشِ عَنْ سَلَمَةَ بْنِ كُهَيْلٍ عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى وَرَوَاهُ جَرِيرٌ عَنِ الأَعْمَشِ عَنْ سَلَمَةَ بْنِ كُهَيْلٍ عَنْ سَعِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى يَعْنِي عَنْ أَبِيهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 323، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 323 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 323، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 323 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 323 (Purification (Kitab Al-Taharah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 323 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 323, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
