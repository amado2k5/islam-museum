text: "… فيها واجبا بالكل. والثالث: كالتنزُّه في البساتين، وسماع تغريد الحمام، والغناء المباح، واللعب المباح بالحمام، أو غيرها؛ فمثلُ هذا مباحٌ بالجُزء، فإذا فعل يوماً ما، أو في حالة ما ؛ فلا حَرّج فيه، فإن فعل دائماً كان مكروهاً، ونُسب فاعلُه …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 1، ص 209، يرد فيه ذكر الواجب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 1, p. 209, whose wording mentions the obligatory (wajib), the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
