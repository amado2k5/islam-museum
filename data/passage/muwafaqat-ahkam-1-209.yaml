  fr: "Un extrait de al-Muwafaqat de al-Shatibi, volume numérisé 1, p. 209, dont le texte mentionne l'obligatoire (wajib), le réprouvé (makruh), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
