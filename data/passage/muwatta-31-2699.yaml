label: { ar: "الموطأ 2699 — القاسم بن محمد: ابن عباس يجيز شرب لبن إبل اليتيم بشروط الرعاية", en: "Muwatta 2699" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه سمع القاسم بن محمد يقول: جاء رجل إلى ابن عباس فقال: إن لي يتيما وله إبل، أفأشرب من لبن إبله؟ فقال ابن عباس: إن كنت تبغي ضالة إبله، وتهنأ جرباها، وتلط حوضها، وتسقيها يوم وردها، فاشرب غير مضر بنسل، ولا ناهك في الحلب. {cite:muwatta-maruf-1997 p.523} {cite:muwatta-maruf-1997 p.524}"
