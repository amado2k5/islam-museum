label: { ar: "الموطأ 1628 — زبراء مولاة بني عدي عن عروة بن الزبير: كانت تحت عبد وهي أمة فعتقت، فأرسلت إليها حفصة زوج النبي فقالت أمرك بيدك ما لم يمسك زوجك، فطلقت نفسها ثلاثا", en: "Muwatta 1628", es: "Muwatta 1628", fr: "Muwatta 1628", ur: "موطا 1628", tr: "El-Muvatta 1628 — Beni Adi kabilesinden azatlı kadın Zubra, Urva ibn el-Zubayr'ın rivayetine göre: Bir köleyle evliydi ve kendisi de köleydi, sonra azat edildi. Peygamberin eşi Hafsa ona haber göndererek, \"Kocan seni tutmadığı sürece işin senin elinde\" dedi. Bunun üzerine üç kez boşandı.", id: "Al-Muwatta 1628 — Zubra, seorang wanita merdeka dari Banu Adi, berdasarkan riwayat Urwa ibn al-Zubayr: Ia menikah dengan seorang budak dan ia sendiri adalah seorang budak, kemudian ia dibebaskan. Hafsa, istri Nabi, mengirim pesan kepadanya, mengatakan, “Urusanmu ada di tanganmu selama suamimu tidak menafkahimu.” Maka ia menceraikan dirinya sendiri tiga kali." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير أن مولاة لبني عدي يقال لها زبراء أخبرته أنها كانت تحت عبد، وهي أمة يومئذ، فعتقت، قالت فأرسلت إلي حفصة زوج النبي فدعتني، فقالت إني مخبرتك خبرا ولا أحب أن تصنعي شيئا، إن أمرك بيدك ما لم يمسك زوجك، فإن مسك فليس لك من الأمر شيء. قالت فقلت هو الطلاق ثم الطلاق ثم الطلاق، ففارقته ثلاثا. {cite:muwatta-maruf-1997 p.72}"
  tr: "Malik, İbn Şihab'dan, Urve ibn el-Zübeyr'den rivayetle, Beni Adi kabilesinden Zubra adında azatlı bir kadının kendisine şöyle anlattığını aktarır: \"Ben bir köleyle evlendim, o zamanlar köleydim ve azat edildim. Bana şöyle dedi: 'Peygamberin karısı Hafsa beni çağırdı ve bana dedi ki: 'Sana bir şey söylemek istiyorum, ama hiçbir şey yapmanı istemiyorum. Kocan sana dokunmadığı sürece mesele senin elinde. Eğer sana dokunursa, o zaman meselede söz hakkın kalmaz.' Ben de 'Boşanma, sonra boşanma, sonra boşanma' dedim ve onu üç kez boşadım.\" {cite:muwatta-maruf-1997 s.72}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah ibn al-Zubayr, bahwa seorang wanita merdeka dari Bani Adi bernama Zubra menceritakan kepadanya bahwa ia telah menikah dengan seorang budak, dan ia masih seorang budak pada saat itu, dan kemudian ia dibebaskan. Ia berkata, \"Hafsa, istri Nabi, memanggilku dan berkata, 'Aku ingin memberitahumu sesuatu, tetapi aku tidak ingin kau melakukan apa pun. Urusanmu ada di tanganmu selama suamimu tidak menyentuhmu. Jika ia menyentuhmu, maka kau tidak punya hak untuk ikut campur.' Ia berkata, 'Maka aku berkata, \"Cerai, lalu cerai, lalu cerai,\" dan aku menceraikannya tiga kali.'\" {cite:muwatta-maruf-1997 p.72}"
