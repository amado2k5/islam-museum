label: { ar: "الموطأ 1628 — زبراء مولاة بني عدي عن عروة بن الزبير: كانت تحت عبد وهي أمة فعتقت، فأرسلت إليها حفصة زوج النبي فقالت أمرك بيدك ما لم يمسك زوجك، فطلقت نفسها ثلاثا", en: "Muwatta 1628" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير أن مولاة لبني عدي يقال لها زبراء أخبرته أنها كانت تحت عبد، وهي أمة يومئذ، فعتقت، قالت فأرسلت إلي حفصة زوج النبي فدعتني، فقالت إني مخبرتك خبرا ولا أحب أن تصنعي شيئا، إن أمرك بيدك ما لم يمسك زوجك، فإن مسك فليس لك من الأمر شيء. قالت فقلت هو الطلاق ثم الطلاق ثم الطلاق، ففارقته ثلاثا. {cite:muwatta-maruf-1997 p.72}"
