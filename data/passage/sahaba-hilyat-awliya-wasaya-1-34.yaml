text: "… مرضه الذى توفى فيه، فسلمت عليه فقال : رأيت الدنيا قد أقبلت ولما تقبل، وهى جائية وممتخذون ستور الحرير، ونضائد الدياج، وتألون ضجائع الصوف الأزرى كأن أحدكم على حسك السعدان، ووالله لثن يقدم أحدكم فيضرب عنقه - فى غير حد …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 34، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 34, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
