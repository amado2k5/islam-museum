label:
  ar: "البخاري 7539 — لا ينبغي لعبد لي أن يقول أنا خير من يونس بن متى"
  en: "Bukhari 7539 — No servant of Mine should say he is better than Yunus son of Matta"
  ur: "بخاری 7539 — میرے کسی بندے کے لیے مناسب نہیں کہ کہے میں یونس بن متیٰ سے بہتر ہوں"
text: "لا ينبغي لعبد أن يقول إنه خير من يونس بن متى . ونسبه إلى أبيه."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7539: لا ينبغي لعبد لي أن يقول أنا خير من يونس بن متى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7539: No servant of Mine should say he is better than Yunus son of Matta. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7539: میرے کسی بندے کے لیے مناسب نہیں کہ کہے میں یونس بن متیٰ سے بہتر ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
