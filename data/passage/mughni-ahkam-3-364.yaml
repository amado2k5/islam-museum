  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Jilid 3, halaman 364, yang menyebutkan amalan wajib, anjuran, dan halal; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
