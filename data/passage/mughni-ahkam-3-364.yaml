text: "… وَالْجَمْعِ، وَالْفِطْرِ، وَالْمَسْحِ ثَلاثاً، وَالصَّلاةِ عَلَى الرَّاحِلَةِ تَطرُعا، يُبَاحُ فِي السَّفْرِ الْوَاجِبِ وَالْمَندُوبِ وَالْمُبَاحِ، كَسَفَرِ التَّجَارَةِ وَنَحْرِهِ، وَهَذَا قَوْلٌ أَكْتَرِ أَهْلِ الْعِلْمِ. وَرُوِيّ ذَلِكَ عَنْ عَلِي، وَايْنٍ عَبْاسٍ، وَابْنِ عُمَرَ. وَيِهِ قَالَ الأَوْزَاعِي، وَالَّافِعِيُ، وَإِسْحَاقُ، وَأَهْلُ الْمَدِينَةِ، وَأَصْحَابُ الرَّأي. وَعَنْ …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 364، يرد فيه ذكر الواجب، والمندوب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 364, whose wording mentions the obligatory (wajib), the recommended (mandub), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
