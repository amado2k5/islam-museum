  وكذلك أومض البرق ايماضا فأما اذا لمع واعترض فى نواحى الغيم فهو الخفوفان استطال
  فى وسط السماء وشق الغيم من غير أن يعترض عييناوشمالا فهو العقيقة ويقال أومضت المرأة
