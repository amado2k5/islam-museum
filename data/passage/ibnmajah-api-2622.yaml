label: { ar: "سنن ابن ماجه 2622 — ساعة الاحتضار والوفاة", en: "Sunan Ibn Majah 2622 — a deathbed and last hours", ur: "سنن ابن ماجہ 2622 — وقتِ وفات اور آخری لمحات" }
text: "… وَجَلَّ مَلَكًا فَاخْتَصَمُوا إِلَيْهِ ثُمَّ رَجَعُوا فَقَالَ انْظُرُوا أَىَّ الْقَرْيَتَيْنِ كَانَتْ أَقْرَبَ فَأَلْحِقُوهُ بِأَهْلِهَا. قَالَ قَتَادَةُ فَحَدَّثَنَا الْحَسَنُ، قَالَ لَمَّا حَضَرَهُ الْمَوْتُ احْتَفَزَ بِنَفْسِهِ فَقَرُبَ مِنَ الْقَرْيَةِ الصَّالِحَةِ وَبَاعَدَ مِنْهُ الْقَرْيَةَ الْخَبِيثَةَ فَأَلْحَقُوهُ بِأَهْلِ الْقَرْيَةِ الصَّالِحَةِ. قَالَ أَبُو الْحَسَنِ الْقَطَّانُ حَدَّثَنَا أَبُو الْعَبَّاسِ بْنُ عَبْدِ اللَّهِ بْنِ إِسْمَاعِيلَ الْبَغْدَادِيُّ، حَدَّثَنَا عَفَّانُ، حَدَّثَنَا هَمَّامٌ، فَذَكَرَ نَحْوَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2622، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2622 (The Chapters on Blood Money), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2622، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
