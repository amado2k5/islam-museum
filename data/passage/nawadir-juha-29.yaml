text: "… نفد رمانك فامش أشكلت بعض المسائل العلمية، على أحد الطلاب، فسأل عنها بعض العارفين، فقال له: إن الشخص الوحيد، الذي يُمكِنُه الجوابُ على أسئلتِك هذه، إنما هو الشيخ نصر الدين الموجود في مدينة آقَ شَهْرْ. نقصد الطالب هذه المدينة، ولما …"
summary:
  ar: "سعى طالب إلى أجوبة عند الشيخ نصر الدين في آق شهر، فلقي شيخًا يحرث الأرض أجابه عن كل سؤال مقابل رمانة من كيس الطالب، ولما فرغ الكيس قال له إن رمانه نفد فليمضِ، فاستنتج الطالب أنه إذا كان الفلاحون هنا بهذه القدرة فالعلماء أقدر. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  en: "A student seeks answers from 'Shaykh Nasr al-Din' of Akshehir; he meets an old man ploughing, who answers each question for a pomegranate from the student's bag; when the bag is empty the old man says 'your pomegranates are finished, walk on'; the student concludes that if farmers here are so able, the scholars must be more so. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  ur: "ایک طالب علم آق شہر کے شیخ نصر الدین سے جوابات لینے نکلا؛ راستے میں اسے ایک بوڑھا ہل چلاتا ملا جس نے طالب علم کے تھیلے سے ایک انار لے کر ہر سوال کا جواب دیا، اور جب تھیلا خالی ہو گیا تو کہا کہ تمہارے انار ختم ہو گئے، اب چلتے بنو؛ طالب علم نے نتیجہ نکالا کہ اگر یہاں کے کسان اتنے قابل ہیں تو علماء اور بھی زیادہ ہوں گے۔ {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  fr: "Un étudiant cherche des réponses auprès du «cheikh Nasr al-Din» d'Akshehir ; il rencontre un vieil homme qui laboure et qui répond à chaque question contre une grenade prise dans le sac de l'étudiant ; quand le sac est vide, le vieillard dit : «tes grenades sont épuisées, passe ton chemin» ; l'étudiant en conclut que si les paysans d'ici sont si capables, les savants doivent l'être davantage. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  es: "Un estudiante busca respuestas del «jeque Nasr al-Din» de Akshehir; encuentra a un anciano que ara, el cual responde a cada pregunta a cambio de una granada del saco del estudiante; cuando el saco queda vacío dice: «se acabaron tus granadas, sigue tu camino»; el estudiante concluye que si los campesinos de aquí son tan capaces, los sabios lo serán aún más. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
