text: |-
  ⁦(غريل)⁩ . /
  ٢٢١
  تعدى ولا يتعدى وعوال بالضم حى من العرب من بى عبد اللّه بن غطفان وقال ١
  وجع عوال ما أدق وألأما • والمعول الفأس العظيمة التى ينقربها الصخر وابهع المعاول
  وأماقول الشاعر فى وصف الهام
  فاذاد خت سمعت فيهارنة * اغط المماول فى بيوت هداذ
  فانّ معاول وهداداحيان من الازد وعول كلة مثل ويب يقال عولك وعول زيدوعول
  د وقدذ كرفى ويب هل ، العيهل من الذوق السريعة قال أبوحاتم ولايقال ج-ل
  عيهل وقال ٢ • زجرت فيهاعيهلارسوما* وكذلك العيهلة قال الشاعر
  ناشوا الرجال فشالت كل عيهلة * عبر السفارملوس الليل بالسكود
  وربعما فالواعيهل مشددافى ضرورة الشعر وقال
  ان تخلى ياجل أو تعتلى أو تصيحى فى الظاعن المولى» بيازل وجنا أو عيهل
  وامرأة عيم ل وعيهلة أيضالا تسستقرنزقا وريح عيهل شديدة والعاهل الملك الاعظم
  كانخليفة أبو عبيدة يقال للمرأة التى لازوج لها عاهل عيل ) عال الفرس يعيل عيلااذا
  ما تسكف أفى مشيته وتمابل فه وفرس عيال وذلك لكرمه وكذلك الرج-ل اذا تيختر فى مشيته
  وتمايل قال أوس فى صفة الفرس • كالمرزبانىّ عيال بأوصال * وروى عيار والتعييل
  والغداء وعيل الرجل فرسه اذاسيبه فى المفازة ويقال لالياس بن مضر بن تزارقيس
  ميلان وليس فى العرب عيلان غيره وهو فى الاصل اسم فرسه ويقال هو لقب مضرلانه
  يقال قيس بن عيلان قال زقرين الحرث
  ألا اغاقيس بن عيلان بقة * اذا وجدت ريح العصير تغنت
  والعيلان الذكر من الضباع والعيلة والمالة الفاقة يقسال عال يعيل عيلة وعبولا اذا افتقر
  قال تعالى وان خفتم عيلة وقال أحيحة
  وما يدرى الفقيرمى غناه * وما يدرى الغنى متى يعيل
  وهو عائل وقوم عيلة وترك أولاده يت.امى عيلى أى ذقراء وعيال الرجل من يعوله وواحد
  العمال عيل والجمع عبائل مثل جيد وجياد وجيائد وأعال الرجل آى كثرت عباله فهو معيل
  والمرأة معدلة قال الاخفش أى صارداءمال أبوز يدعات الضالة أعيل عملا وعدلانافأنا
  عائل اذالم تدرأىّ وجهة تبغيها وقال الاحر عالنى الشى يعيلنى عيلا ومعيلااذا أعجزك"
  أبوز يدأ عال الرجل وأعول اعو الاأى حرص
  ف ل الفسين رل عيش أغرل أى واسع وغسلام أغرل أى أقلف والغرلة
  القلفسة ورجل غرل مسترخى الخلق أبوعمر والغريل والغرين ماييق من الماءفى الحوض
  والغدير بيق فيه الدعاميص لا يقد ر على شربه وكذلك مايبقى فى أسفل القارورة من الثفل
  وقال الاصعى هو أن يآتى السمل فيلبت على وجه الارض ثم ينضب فرى طينا رقيقاقد جف
  على وجه الارض وقال أيوزيد فى كتاب المطره والطين يحمله السيل فيبق على وجه الارض
  رطبا كان أويابسا ⁦(غريل)⁩ الغربال معروف وغربلت الدقيق وغيره ويقال غر بله
  اذا قطعه أبو عبيد المغربل المقتول المنتفخ وأنشد
