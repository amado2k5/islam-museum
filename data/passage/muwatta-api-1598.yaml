label: { ar: "موطأ مالك 1598 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Muwatta Malik 1598 — mentions of non-Muslim nations, religions and peoples", ur: "موطأ مالک 1598 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Muwatta Malik 1598 — Menciones de naciones, religiones y pueblos no musulmanes", fr: "Muwatta Malik 1598 — mentions de nations, de religions et de peuples non musulmans", tr: "Muwatta Malik 1598 — Müslüman olmayan milletlerin, dinlerin ve halkların bahsi", id: "Muwatta Malik 1598 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "وَحَدَّثَنِي يَحْيَى بْنُ يَحْيَى، قَالَ حَدَّثَنِي مَالِكٌ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ الأَنْصَارِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ قَالَ \" اللَّهُمَّ بَارِكْ لَهُمْ فِي مِكْيَالِهِمْ وَبَارِكْ لَهُمْ فِي صَاعِهِمْ وَمُدِّهِمْ \". يَعْنِي أَهْلَ الْمَدِينَةِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1598، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1598 (Madina), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "موطأ مالک کی حدیث نمبر 1598، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Muwatta Malik, n.º 1598 (Medina), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Muwatta Malik, n° 1598 (Médine), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Malik'in Muwatta adlı eserinde 1598 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 1598, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
