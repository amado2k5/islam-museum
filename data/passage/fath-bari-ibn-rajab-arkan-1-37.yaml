text: "الحديث : - باب المسلم من سلم المسلمون من لسانه ويده وإنما احتاجَ إلى هذا؛ لأن البخاريَّ لا يرى أن الإسنادَ يتصلُ بدون ثبوتِ لُقي الرواةِ بعضهم لبعضٍ وخصوصًا إذا روى بعضُ أهلِ بلدٍ عن بعضِ أهلِ بلدٍ ناءِ عنه، …"
summary:
