text: "… بلية لابدله من الصبر عليها. ونعمة لا يدله من الشكر عليها. وكل ذلك من المراقبة. بل لا ينفك العبد فى كل حال من فرض الله تعالى عليه إمافمل حديث ثلاث من كن فيه استكمل ايمانه لا يخاف فى اللّٰه لومة …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 2، ص 440، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 440, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 2، ص 440 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 2, pág. 440, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
