summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان إذا طاف بالبيت يسعى الأشواط الثلاثة يقول: وأنت تحيي بعد ما أمتا، اللهم لا إله إلا أنتا، يخفض صوته بذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1284) وسويد (542). {cite:muwatta-maruf-1997 p.490}"
