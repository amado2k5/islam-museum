label: { ar: "الموطأ 1060 — هشام بن عروة عن أبيه: كان إذا طاف بالبيت يسعى الأشواط الثلاثة، يقول: وأنت تحيي بعد ما أمتا، اللهم لا إله إلا أنتا، يخفض صوته بذلك", en: "Muwatta 1060", es: "Muwatta 1060", fr: "Muwatta 1060", ur: "موطا 1060", tr: "El-Muvatta 1060 — Hişam ibn Urve, babasından rivayetle: Kâbe'nin etrafında üç tavaf yaparken şöyle derdi: \"Ölümden sonra dirilişi de Sen verirsin. Ey Allah'ım, Senden başka ilah yoktur.\" Bunu söylerken sesini alçaltırdı.", id: "Al-Muwatta 1060 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Ketika beliau melakukan tawaf mengelilingi Ka'bah sebanyak tiga kali, beliau mengucapkan: “Dan Engkau memberikan kehidupan setelah kematian. Ya Allah, tiada tuhan selain Engkau.” Beliau merendahkan suaranya saat mengucapkan ini." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان إذا طاف بالبيت يسعى الأشواط الثلاثة يقول: وأنت تحيي بعد ما أمتا، اللهم لا إله إلا أنتا، يخفض صوته بذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1284) وسويد (542). {cite:muwatta-maruf-1997 p.490}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Kâbe'yi üç tavaf ettikten sonra, sesini alçaltarak, \"Ey Allah, ölümden sonra dirilişi Sen verirsin, Senden başka ilah yoktur\" dediğini nakletmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1284) ve Suveyd (542) tarafından da rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.490}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, yang juga meriwayatkannya dari ayahnya, bahwa ketika beliau melakukan tawaf mengelilingi Ka'bah sebanyak tiga kali, beliau mengucapkan: \"Ya Allah, Engkau memberi kehidupan setelah kematian, tiada Tuhan selain Engkau,\" dengan suara yang merendah. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1284) dan Suwaid (542). {cite:muwatta-maruf-1997 p.490}"
