text: "… عليه بابه فخرج إليه فقال له علي: يا أخي إن كنت صادقاً فيما قلت لي فغفر اللّٰه لي، وإن كنت كاذباً فغفر اللّٰه لك. السلام عليكم وولى. قال: فاتبعه فالتزمه من خلفه وبكى حتى رثى له ثم قال: لا جرم …"
summary:
