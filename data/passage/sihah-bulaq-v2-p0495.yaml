text: |-
  ٩٢
  • فصل السنين) •
  •⁦(ضوق)⁩•
  ( س رمق السرمق بالفتح ضرب من النبت (س عبق الستعبق نيت خييت الريح
  عن أبي حنيفة (لعلق%% السعسلق أم العالى قال الاعور
  مستسعلات كسعالى السعاق• عن أبى زياد ( فق مفقت الباب وأسفقته أى
  رددته فانسفق وثوب سفيق أى صفيق وقدسفق بالضم سفاقة ورجل سفيق الوجه أى وقح
  وسفاسق السيف طراتقه فارى معرب قال أبو عيد هى التى يقال لها الفرند ومنه كول
  امرئ القيس• أقت بعضب ذى سفاسق ميله • ⁦( سلق)⁩ السلق القاع الصفصف وجعه
  سلفان مثل خلق وخلقان وكذلك السهلق بزيادة الميم والهع السحالق وطحنته فسلقته اذا
  ألقيته على ظهره وربما قالواسلقيته سلفا يزيدون فيه الياءكما قالواجعبيتهجعبا، من جعبته
  أى صرعته ويقال سلقها وسلة اها اذا بسطها ثم جامعها واسلنق الرجل اذا نام على ظهره
  وهوافعنلى وسلفلغة فى صلق أى صاح وسلقه بالكلام سلقا أى آذاهوه وشدة القول
  باللسان قال تعالى سلة وكم بألسنة حداد قال أبو عبيدة بالغوافيكم بالكلام والمسلاق
  الخطيب البليغ وهو من شدة صوته وكلامه وكذلك السلاق قال الاعشى
  فيهم الحزم والسعاحة والنجشدة فيهم وانخاطب السلاق
  ويروى الملاق يقال خطيب مسقع مسلق وسلقت المزادة أى دهنتها قال الشاعر
  كانم مامزاد نامتعجل * فريان لما يسلقابدهان
  رسلقت البة-ل والبيض اذا أغليته بالناراغلاءة خفيفة والسلاق بنريخرج على أصل
  اللسان ويقال تقشر فى أصول الاسنان والساق أردبرة البعراذابرأت واسض موضعها
  والسلق أن تدخل احدى عروتى الجوالق فى الاخرى قال الراجز
  وحوقل ساعده قد اظق • بقول قطما ونعما ان سلق
  والسلق بالكسر الذتب والانثى سلقة وربعماقيل همرأة السليطة سلقة والسلق التبت الذى يؤكل
  والسليقة أثر النسع فى جفب البعير والسليقة الطبيعة يقان فلان يتكام بالسابقة أى بطبعه لا
  عن تعلم وهى منسوبة وتسلق الجدار أى تسوّره والسليق ماتحات من الشجر ومنه قول
  الراجز • تسمع منها فى السليق الاشهب• وسلوق قرية باليمن تنسب الهالدروع السلوقية
  والكلاب اللوقية ويقال سلوق مدينة السلان تنب اليها الكلاب اللوقية
  قال القطامي
  معهم ضوار من سلوق كأنها • حمن تحول تجرّر الارسانا
  ⁦( سمق)⁩ سمق سموفا أى علا وطال والسماق بالتشديد معروف وكذب سماق بااتضفيف
  أى خالص والسميقان خشبتان فى التيريحيطان بعنق الثور كالطوق نق) السنق
  البشم يقال شرب الفصيل حتى سنق بالكسروهو كالتضمة⁦( وق )⁩ الساق ساق القدم
  والجمع سوق مثل أ-دوأسدوسيقان وأسوق وامرأة سوقاء حسنة الساق ورجل أسوق بين
  السوق والاسوق أيضا الطويل الساقين قال رؤبة *قب من التعدامحقب فى سوق*
  ويقال ولدت فلانة ثلاثة بنسين ع-لى ساق واحد أى بعضهم على اثر بعض ليست بينهسم جارية
  وساق الشهجرة جذعها وساف-ترذكر القمارى قال الكميت
  تغريد
