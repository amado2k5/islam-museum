text: "… أن تضع المحاجم، وتشرط عليها، وربما وجب عند غلبة الخلط السوداوي والدم، أن يفصد الوداج الأيسر، ويكوى على خمسة مواضع من الطحال، أو ستة، ثم لا تدعها تبرأ. فإن لم يصبر على النار، استعملت الكاوي من الأدوية، مثل ضمّاد التين، …"
summary:
