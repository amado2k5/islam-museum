  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 577, that mentions cupping, cautery, the organs of the body, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 577 کا اقتباس جس میں حجامہ، داغنا، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 577, que menciona la ventosaterapia, la cauterización, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 577, qui mentionne la ventousothérapie, la cautérisation, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, s. 577'sinden bir bölüm; hacamat, yakma, vücut parçaları, cerrahi, sünnet, atel ve ilaçtan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 577, yang menyebutkan bekam, kauterisasi, bagian tubuh, pembedahan, sunat, bidai, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
