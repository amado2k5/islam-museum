text: |-
  ٤٧٧
  قنكرنة فنفرن وامترست به • هوجاءهادية وهاد جرشع
  والمرمريس الداهية وهو فمفعيل بتكرير لفاء والعين يقال داهية مرمر يس أى شديدة
  قال مح_دين السعرىّ هو من المراسة والمرمريس الاملس قال يعوب المارستان بفتح الراه
  دار المرضى وهومعترب مسس مسست الشى بالكسر أمسهمسافهذه اللغة
  الفصيحة و-كى أبو عبيدة مسست الشئ بالفتح أمسه بالضم وربما قالوامست الشي يحذفون
  منه السين الاولى ويحولون كسرتها الى الميم ومنه-م من لا يحول ويتركك الميم على حالها
  مفتوحسة وهومثل قوله تعالى فظليمْ تفكهون يكسر ويفتح وأصله ظلتم وهو من شواذ
  التخفيف وأنشد الاخفش
  مسنا السماء فنلناها وطالهم * حق رأوا أحدايهوى ونهلانا
  وأمسسته النئفسه والمسيس المس وكذلك المسيسى مثال انفصيصى والممسوس الذى
  به مس.ن جنون والمماسة كناية عن المباضعة وكذلات التماس وقوله تعالى من قبل أن يتماسا
  وقوله تعالى أن تقول لامساس أى لا أمس ولا أمس وأماقول العرب لامساس مثل قطام :
  فانمابنى على الكسر لانه معدول عن المصدروهوالمس ويقال بينه-مارحم ماسة أى قرابة
  قريبة وقدمست بك رحم فلان اذا كان بينكما رابة قريبة وحاجة ماسة أى مهمة وقدمست
  البه الحاجة والمسوس من الماء الذى بين العذب والملح قال الشاءر
  لوكنت ماء كنت لا • عذب المذاق ولاموسا
  والمسمسة اختلاط الامر والتباسه والاسم المسماس قال رؤبة
  ان كنت من أمرك فى مسماس • قاسط على أمك سطوالماس
  ( معسر المعس الدلك يقال معست المنيئة فى الدباغ اذادا.كمنهادامكاشديدا وقال يصف
  مطرا
  يمعس بالماء الحواءمعا وربما كى به عن البضاع ورجل معاس فى الحرب
  مقدام قس قست نفسم بالكسر وتمقست أى غنت قال أبوزيد صاداعرابي
  هامة.ن القبورفا كاها فقال ماه ذا فقيل سهانى ففنت نفسه فقال
  نقسى تحقس من ممانى الاقبر (مكس مكس فى البيع يمكس بالكسر مكساوما كس
  مما كسة ومكاسا والمكس أيضًا الجباية والماكس العشاروفى الحديث لايدخل صاحب
  مكس الجنة والمكس ما يأخذه العشار قال الشاءر
  أفى كل أسواق العراق إتاوة * وفى كل ماباع امر ؤمكس درهم
  ( -لس الملاسة ضدّ انخشونة وشئ أملس وقداملاس الشئ املباساومله غيره تلبسا
  فملس وآمّاس وهو انفعل فادغم يقال انغلس من الامراذا أفلت منه وملسته أنا وقولهم
  فى المثل هان على الاملس مالاقى الدبر فالاملس الصميح الظهرههنا والدبر الذى قد دبرظهره
  وقولهم أتيته ملس الظلام أى حين اختلط الفلام والاطليس بالكسر واحدالاماليس وهى
  المهامه ليس بهاشئ من النبات ويقال أيضارمان إمليسى كأنه منسوب اليه وناقة طلسى
  ثال سمسى وحقلى أى تلس وغضى لا يعلق بهاشئ من سرعتها ويقال أيضا فى السع ملو
  لاعهدة أى قد اغلس من الامر لاله ولا عليه يقال أببعك الملسى لاعهدة أى لا تقلس
