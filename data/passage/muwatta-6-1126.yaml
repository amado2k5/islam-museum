label: { ar: "الموطأ 1126 — مالك: بلغه أن عمر بن الخطاب وعلي بن أبي طالب وأبا هريرة سئلوا عن رجل أصاب أهله وهو محرم بالحج، فقالوا: ينفذان لوجههما حتى يقضيا حجهما، ثم عليهما حج قابل والهدي؛ وقال علي: إذا أهلا بالحج من عام قابل تفرقا حتى يقضيا حجهما", en: "Muwatta 1126" }
summary:
  ar: "يرويه مالك أنه بلغه أن عمر بن الخطاب وعلي بن أبي طالب وأبا هريرة سئلوا عن رجل أصاب أهله وهو محرم بالحج، فقالوا: ينفذان لوجههما حتى يقضيا حجهما، ثم عليهما حج قابل والهدي. وقال علي: وإذا أهلا بالحج من عام قابل تفرقا حتى يقضيا حجهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1230) وسويد (529) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.513} {cite:muwatta-maruf-1997 p.514}"
