label: { ar: "الموطأ 1126 — مالك: بلغه أن عمر بن الخطاب وعلي بن أبي طالب وأبا هريرة سئلوا عن رجل أصاب أهله وهو محرم بالحج، فقالوا: ينفذان لوجههما حتى يقضيا حجهما، ثم عليهما حج قابل والهدي؛ وقال علي: إذا أهلا بالحج من عام قابل تفرقا حتى يقضيا حجهما", en: "Muwatta 1126", es: "Muwatta 1126", fr: "Muwatta 1126", ur: "موطا 1126", tr: "El-Muvatta 1126 — Malik: Ömer ibn el-Hattab, Ali ibn Abi Talib ve Ebu Hurayra'ya, Hac için ihram halindeyken karısıyla cinsel ilişkiye giren bir adam hakkında soru sorulduğu rivayet edilmiştir. Onlar şöyle demişlerdir: Haclarını tamamlayıncaya kadar yollarına devam etsinler, sonra ertesi yıl tekrar Hac yapsınlar ve kurban kessinler. Ali şöyle demiştir: Ertesi yıl Hac için ihrama girerlerse, Haclarını tamamlayıncaya kadar ayrı kalsınlar.", id: "Al-Muwatta 1126 — Malik: Sampai kepadanya bahwa Umar bin al-Khattab, Ali bin Abi Talib, dan Abu Hurayrah ditanyai tentang seorang pria yang bersetubuh dengan istrinya saat dalam keadaan ihram untuk haji. Mereka berkata: Mereka harus melanjutkan perjalanan mereka sampai mereka menyelesaikan haji mereka, kemudian mereka harus melaksanakan haji lagi pada tahun berikutnya dan mempersembahkan hewan kurban. Ali berkata: Jika mereka memasuki ihram untuk haji pada tahun berikutnya, mereka harus berpisah sampai mereka menyelesaikan haji mereka." }
summary:
  ar: "يرويه مالك أنه بلغه أن عمر بن الخطاب وعلي بن أبي طالب وأبا هريرة سئلوا عن رجل أصاب أهله وهو محرم بالحج، فقالوا: ينفذان لوجههما حتى يقضيا حجهما، ثم عليهما حج قابل والهدي. وقال علي: وإذا أهلا بالحج من عام قابل تفرقا حتى يقضيا حجهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1230) وسويد (529) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.513} {cite:muwatta-maruf-1997 p.514}"
  tr: "Malik, Ömer ibn el-Hattab, Ali ibn Abi Talib ve Ebu Hurayra'ya, Hac için ihram halindeyken karısıyla cinsel ilişkiye giren bir adam hakkında soru sorulduğunu işittiğini rivayet etmiştir. Onlar şöyle demişlerdir: \"Hac ibadetlerini tamamlayana kadar yollarına devam etsinler, sonra ertesi yıl tekrar Hac yapsınlar ve kurban kessinler.\" Ali şöyle demiştir: \"Eğer ertesi yıl Hac için ihrama girerlerse, Hac ibadetlerini tamamlayana kadar ayrı kalsınlar.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1230), Suveyd (529) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.513} {cite:muwatta-maruf-1997 s.514}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa Umar ibn al-Khattab, Ali ibn Abi Talib, dan Abu Hurayrah ditanyai tentang seorang pria yang bersetubuh dengan istrinya saat dalam keadaan ihram untuk haji. Mereka berkata: Mereka harus melanjutkan perjalanan mereka sampai mereka menyelesaikan haji mereka, kemudian mereka harus melaksanakan haji lagi pada tahun berikutnya dan mempersembahkan hewan kurban. Ali berkata: Jika mereka memasuki ihram untuk haji pada tahun berikutnya, mereka harus berpisah sampai mereka menyelesaikan haji mereka. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1230), Suwayd (529), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.513} {cite:muwatta-maruf-1997 p.514}"
