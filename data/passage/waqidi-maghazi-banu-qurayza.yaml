label: { ar: "غزوة بني قريظة — مواقف عائشة وأم سلمة وعلي", en: "Campaign against Banu Qurayza — the roles of Aisha, Umm Salama and Ali", es: "Campaña contra Banu Qurayza: los papeles de Aisha, Umm Salama y Ali", fr: "Campagne contre les Banu Qurayza — les rôles d'Aisha, d'Umm Salama et d'Ali", ur: "بنو قریظہ کے خلاف مہم - عائشہ، ام سلمہ اور علی کے کردار" }
text: "كانت عائشة تقول: قتلت بنو قريظة يومهم حتى قتلوا بالليل على شعل السعف"
summary:
  ar: "بعد فشل الأحزاب وعودتهم، حاصر النبي بنو قريظة بعد نقضهم العهد، حتى نزلوا على حكم سعد بن معاذ فقتلوا رجالهم وسبيت نساؤهم. وفي هذا الباب روايات لنسائه: عائشة تروي خبر قرة بنت كعب التي قتلها زوجها، وأم سلمة تروي توبة أبي لبابة نازلة في بيتها. ويذكر الواقدي أن علي بن أبي طالب هو الذي حضر فيمن قتلهم بالسيف كما رواه عبد الله بن جعفر عن أبيه."
  en: "After the Confederates withdrew, the Prophet besieged Banu Qurayza for breaking their treaty until they accepted Sa'd ibn Mu'adh's arbitration and their men were executed. The chapter carries reports of the wives: Aisha on Qarra bint Ka'b and Umm Salama on Abu Lubaba's repentance descending in her house, and Ali's presence among those who killed them by the sword."
  es: "Tras la retirada de los confederados, el Profeta sitió a Banu Qurayza por haber roto su tratado hasta que aceptaron el arbitraje de Sa'd ibn Mu'adh y sus hombres fueron ejecutados. El capítulo incluye relatos de las esposas: Aisha sobre Qarra bint Ka'b y Umm Salama sobre el arrepentimiento de Abu Lubaba que llegó a su casa, y la presencia de Ali entre quienes las mataron a espada."
  fr: "Après le retrait des Confédérés, le Prophète assiégea les Banu Qurayza pour rupture de leur traité, jusqu'à ce qu'ils acceptent l'arbitrage de Sa'd ibn Mu'adh et que leurs hommes soient exécutés. Le chapitre relate les témoignages des épouses: Aïcha sur Qarra bint Ka'b et Umm Salama sur le repentir d'Abu Lubaba qui s'abattit sur sa maison, ainsi que la présence d'Ali parmi ceux qui les tuèrent par l'épée."
  ur: "اتحادیوں کے پیچھے ہٹنے کے بعد، نبی نے بنو قریظہ کا معاہدہ توڑنے پر محاصرہ کیا یہاں تک کہ انہوں نے سعد بن معاذ کی ثالثی کو قبول کر لیا اور ان کے آدمیوں کو قتل کر دیا گیا۔ اس باب میں ازواج مطہرات کی خبریں ہیں: عائشہ قرہ بنت کعب پر اور ام سلمہ کا ابو لبابہ کے اپنے گھر میں اترنے پر توبہ، اور علی کی موجودگی ان لوگوں میں جنہوں نے انہیں تلوار سے قتل کیا۔"
