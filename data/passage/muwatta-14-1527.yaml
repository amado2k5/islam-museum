summary:
  ar: "يقول مالك في الرجل يزني بالمرأة فيقام عليه الحد فيها، إنه ينكح ابنتها، وينكحها ابنه إن شاء، وذلك أنه أصابها حراما، وإنما الذي حرم الله ما أصيب بالحلال أو على وجه الشبهة بالنكاح، واستشهد بآية النساء في نكاح ما نكح الآباء. {cite:muwatta-maruf-1997 p.40}"
