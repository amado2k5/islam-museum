label: { ar: "سنن ابن ماجه 4030 — الأب والأبوة", en: "Sunan Ibn Majah 4030 — the father and fatherhood", ur: "سنن ابن ماجہ 4030 — باپ اور والدیت", es: "Sunan Ibn Majah 4030 — El padre y la paternidad", fr: "Sunan Ibn Majah 4030 — le père et la paternité" }
text: "… كَانَ مِنْ أَشْرَافِ بَنِي إِسْرَائِيلَ وَكَانَ مَمَرُّهُ بِرَاهِبٍ فِي صَوْمَعَتِهِ فَيَطْلُعُ عَلَيْهِ الرَّاهِبُ فَيُعَلِّمُهُ الإِسْلاَمَ فَلَمَّا بَلَغَ الْخَضِرُ زَوَّجَهُ أَبُوهُ امْرَأَةً فَعَلَّمَهَا الْخَضِرُ وَأَخَذَ عَلَيْهَا أَنْ لاَ تُعْلِمَهُ أَحَدًا وَكَانَ لاَ يَقْرَبُ النِّسَاءَ فَطَلَّقَهَا ثُمَّ زَوَّجَهُ أَبُوهُ أُخْرَى فَعَلَّمَهَا وَأَخَذَ عَلَيْهَا أَنْ لاَ تُعْلِمَهُ أَحَدًا فَكَتَمَتْ إِحَدَاهُمَا وَأَفْشَتْ عَلَيْهِ الأُخْرَى فَانْطَلَقَ هَارِبًا حَتَّى أَتَى جَزِيرَةً …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4030، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4030 (Tribulations), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4030، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 4030 (Las Tribulaciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 4030 (Tribulations), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
