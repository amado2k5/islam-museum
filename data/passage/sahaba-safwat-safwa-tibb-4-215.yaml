text: "… مثل المؤمن في الدنيا كمثل المريض معه طبيبه الذي يعلم داءه ودواءه فإذا اشتهى ما يضره منعه وقال: لا تقربه فإنك إن أتيته أهلكك. فلا يزال يمنعه حتى يبرأ من وجعه. وكذلك المؤمن يشتهي أشياء كثيرة مما قد فضل به …"
summary:
