label: { ar: "الموطأ 2396 — رزيق بن حكيم: الرجل الذي قال لابنه يا زان وعفو الابن", en: "Muwatta 2396" }
summary:
  ar: "يروي مالك عن رزيق بن حكيم الأيلي أن رجلا يقال له مصباح استعان ابنا له، فكأنه استبطأه فقال له: يا زان. فاستعدى رزيق عليه، فلما أراد أن يجلده قال ابنه: والله لئن جلدته لأبوءن على نفسي بالزنا. فأشكل أمره، فكتب رزيق إلى عمر بن عبد العزيز، وهو الوالي يومئذ، فكتب إليه أن يجيز عفوه. وكتب إليه أيضا: إن عفا فأجز عفوه في نفسه، وإن افتري على أبويه وقد هلكا أو أحدهما فخذ له بحكم الحد، إلا أن يريد سترا. {cite:muwatta-maruf-1997 p.391} {cite:muwatta-maruf-1997 p.392}"
