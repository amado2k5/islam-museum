label: { ar: "الموطأ 2396 — رزيق بن حكيم: الرجل الذي قال لابنه يا زان وعفو الابن", en: "Muwatta 2396", es: "Muwatta 2396", fr: "Muwatta 2396", ur: "موطا 2396", tr: "Al-Muwatta 2396 — Raziq bin Hakim: Adam oğluna, “Ey zina eden!” dedi ve oğlu onu affetti.", id: "Al-Muwatta 2396 — Raziq bin Hakim: Seorang pria yang berkata kepada anaknya, “Wahai pezina,” dan anaknya memaafkannya." }
summary:
  ar: "يروي مالك عن رزيق بن حكيم الأيلي أن رجلا يقال له مصباح استعان ابنا له، فكأنه استبطأه فقال له: يا زان. فاستعدى رزيق عليه، فلما أراد أن يجلده قال ابنه: والله لئن جلدته لأبوءن على نفسي بالزنا. فأشكل أمره، فكتب رزيق إلى عمر بن عبد العزيز، وهو الوالي يومئذ، فكتب إليه أن يجيز عفوه. وكتب إليه أيضا: إن عفا فأجز عفوه في نفسه، وإن افتري على أبويه وقد هلكا أو أحدهما فخذ له بحكم الحد، إلا أن يريد سترا. {cite:muwatta-maruf-1997 p.391} {cite:muwatta-maruf-1997 p.392}"
  tr: "Malik, Raziq ibn Hakim al-Ayli'den rivayetle, Misbah adında bir adamın oğlundan yardım istediğini, oğlunun ise cevap vermekte gecikmiş gibi davranarak onu zina yapmakla suçladığını anlatır. Raziq ona şikayette bulunmuş ve onu cezalandırmak üzereyken oğlu, \"Allah'a yemin ederim ki, eğer onu cezalandırırsan, ben de kendimi zina ile suçlayacağım\" demiştir. Mesele kafa karıştırıcı olduğu için Raziq, o sırada vali olan Ömer ibn Abd al-Aziz'e yazmış ve Ömer de ona oğlunun affını kabul etmesini emreden bir mektup yazmıştır. Ayrıca ona şöyle yazmıştır: \"Eğer affederse, kendi davasında affını kabul et. Ancak eğer her ikisi de vefat etmiş olan anne ve babasını veya birini haksız yere suçlarsa, meseleyi gizlemek istemediği sürece, öngörülen cezayı uygula.\" {cite:muwatta-maruf-1997 s.391} {cite:muwatta-maruf-1997 s.392}"
  id: "Malik meriwayatkan dari Raziq ibn Hakim al-Ayli bahwa seorang pria bernama Misbah meminta pertolongan kepada putranya, yang, seolah-olah lambat menanggapi, menuduhnya sebagai pezina. Raziq mengadu kepadanya, dan ketika ia bermaksud menghukumnya, putranya berkata, \"Demi Allah, jika engkau menghukumnya, aku akan menuduh diriku sendiri berzina.\" Masalah itu membingungkan, sehingga Raziq menulis surat kepada Umar ibn Abd al-Aziz, yang saat itu menjabat sebagai gubernur, dan Umar membalas suratnya dengan memerintahkannya untuk menerima pengampunan putranya. Ia juga menulis kepadanya: \"Jika ia memaafkan, maka terimalah pengampunannya dalam kasusnya sendiri. Tetapi jika ia secara salah menuduh orang tuanya, yang keduanya telah meninggal, atau salah satu dari mereka, maka laksanakan hukuman yang telah ditentukan, kecuali jika ia ingin menyembunyikan masalah tersebut.\" {cite:muwatta-maruf-1997 p.391} {cite:muwatta-maruf-1997 p.392}"
