label: { ar: "صحيح مسلم 3888 — الرخصة", en: "Sahih Muslim 3888 — the concession (rukhsa)", ur: "صحیح مسلم 3888 — رخصت", fr: "Sahih Muslim 3888 — la dispense (rukhsa)", es: "Sahih Muslim 3888 — la dispensa (rukhsa)" }
text: "وَحَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، ح وَحَدَّثَنَا ابْنُ رُمْحٍ، أَخْبَرَنَا اللَّيْثُ، عَنْ يَحْيَى، بْنِ سَعِيدٍ عَنْ بُشَيْرِ بْنِ يَسَارٍ، عَنْ أَصْحَابِ، رَسُولِ اللَّهِ أَنَّهُمْ قَالُوا رَخَّصَ رَسُولُ اللَّهِ فِي بَيْعِ الْعَرِيَّةِ بِخَرْصِهَا تَمْرًا."
summary:
  ar: "حديث في صحيح مسلم، رقم 3888، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 3888 (The Book of Transactions), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 3888، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 3888, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 3888, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
