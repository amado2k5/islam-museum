text: "هديهم إلى صراط مستقير) لما ذكر تعالى ما أخذه الله على أهل الكتاب من اليهود والنصارى وأنهم نقضوا ذلك إلا قليلا منهم، أمرهم جميعا أن بؤمنوا بمحمد واليي، واحتج عليهم بآية قاطعة دالة على صحة نبوته، وهي: أنه بين لهم"
