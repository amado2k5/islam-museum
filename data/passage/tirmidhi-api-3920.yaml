text: "… بْنِ أَنَسٍ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرٍ، أَنَّ أَعْرَابِيًّا، بَايَعَ رَسُولَ اللَّهِ عَلَى الإِسْلاَمِ فَأَصَابَهُ وَعَكٌ بِالْمَدِينَةِ فَجَاءَ الأَعْرَابِيُّ إِلَى رَسُولِ اللَّهِ فَقَالَ أَقِلْنِي بَيْعَتِي. فَأَبَى رَسُولُ اللَّهِ فَخَرَجَ الأَعْرَابِيُّ ثُمَّ جَاءَهُ فَقَالَ أَقِلْنِي بَيْعَتِي. فَأَبَى فَخَرَجَ الأَعْرَابِيُّ فَقَالَ رَسُولُ اللَّهِ \" إِنَّمَا الْمَدِينَةُ كَالْكِيرِ تَنْفِي خَبَثَهَا وَتُنَصِّعُ طَيِّبَهَا \". وَفِي الْبَابِ عَنْ أَبِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3920، يذكر الحمى والوعك. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3920 (Chapters on Virtues), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3920، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
