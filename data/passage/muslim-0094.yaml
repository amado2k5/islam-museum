text: "قال أبو ذر عن النبي: أتاني جبريل فبشرني أنه من مات من أمتك لا يشرك بالله شيئاً دخل الجنة، قلت: وإن زنى وإن سرق؟ قال: وإن زنى وإن سرق"
summary:
