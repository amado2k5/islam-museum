label: { ar: "سنن النسائي 5397 — الحلال، الحرام", en: "Sunan al-Nasa'i 5397 — the lawful; the unlawful", ur: "سنن نسائی 5397 — حلال، حرام", es: "Sunan al-Nasa'i 5397 — lo lícito; lo ilícito", fr: "Sunan al-Nasa'i 5397 — le licite; l'illicite" }
text: "… قَضَى بِهِ نَبِيُّهُ فَلْيَقْضِ بِمَا قَضَى بِهِ الصَّالِحُونَ فَإِنْ جَاءَ أَمْرٌ لَيْسَ فِي كِتَابِ اللَّهِ وَلاَ قَضَى بِهِ نَبِيُّهُ وَلاَ قَضَى بِهِ الصَّالِحُونَ فَلْيَجْتَهِدْ رَأْيَهُ وَلاَ يَقُولُ إِنِّي أَخَافُ وَإِنِّي أَخَافُ فَإِنَّ الْحَلاَلَ بَيِّنٌ وَالْحَرَامَ بَيِّنٌ وَبَيْنَ ذَلِكَ أُمُورٌ مُشْتَبِهَاتٌ فَدَعْ مَا يَرِيبُكَ إِلَى مَا لاَ يَرِيبُكَ. قَالَ أَبُو عَبْدِ الرَّحْمَنِ هَذَا الْحَدِيثُ جَيِّدٌ جَيِّدٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 5397، يذكر الحلال، والحرام، والشبهات. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5397 (The Book of the Etiquette of Judges), that mentions the lawful, the unlawful, the doubtful matters. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5397، جس میں حلال، حرام، مشتبہ امور کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5397 (El Libro de la Etiqueta de los Jueces), que menciona lo lícito, lo ilícito y lo dudoso. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Sunan al-Nasa'i, n° 5397 (Le Livre de l'Étiquette des Juges), mentionne ce qui est licite, illicite et douteux. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
