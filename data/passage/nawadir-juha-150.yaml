text: "… إذا متّ فقال: غداً إذا قامت القيامة وصارت الدنيا مختلطةً أكون واقفاً من دون مشقة. تألَّمت امرأتُهُ فأشارت إليه أن يأتِيَ بالطبيب.. فذهب لإِحضاره، وفيما هو خارج الباب، أطَّلت مِنَ النافذة، وقالت له: الحمدُ للهِ لقد زالَ الألمُ فلا ولكنَّ …"
summary:
  ar: "سُئل جحا عن عمره فقال أربعون، وبعد عشر سنين قال أربعون، وبعد عشرين سنة قال أربعون، وقال إن الحر لا يرجع عن كلمته؛ وطلب أن يُدفن واقفًا، وقال إن جوابه عن عمره هو نفسه. {cite:juha-nawadir-kubra-djuwaydi p. 71}"
  en: "Asked his age, Juha says forty; after ten years, forty again; after twenty years, forty again, saying a free man does not go back on his word; he asks to be buried standing, and says the same answer for his age. {cite:juha-nawadir-kubra-djuwaydi p. 71}"
  ur: "جحا سے عمر پوچھی گئی تو اس نے کہا چالیس؛ دس سال بعد پھر چالیس؛ بیس سال بعد پھر چالیس، اور کہا کہ آزاد آدمی اپنی بات سے نہیں پھرتا؛ اس نے کہا کہ مجھے کھڑا دفن کرنا، اور عمر کے بارے میں بھی یہی جواب دہرایا۔ {cite:juha-nawadir-kubra-djuwaydi p. 71}"
  fr: "Interrogé sur son âge, Juha dit quarante ans; dix ans plus tard, quarante; vingt ans plus tard, encore quarante, disant qu'un homme libre ne revient pas sur sa parole; il demande à être enterré debout, et donne la même réponse pour son âge. {cite:juha-nawadir-kubra-djuwaydi p. 71}"
  es: "Preguntado por su edad, Juha dice cuarenta; diez años después, cuarenta; veinte años después, cuarenta otra vez, diciendo que un hombre libre no se retracta de su palabra; pide ser enterrado de pie y da la misma respuesta sobre su edad. {cite:juha-nawadir-kubra-djuwaydi p. 71}"
