label: { ar: "سنن أبي داود 3562 — الأب والأبوة", en: "Sunan Abi Dawud 3562 — the father and fatherhood", ur: "سنن ابی داؤد 3562 — باپ اور والدیت", es: "Sunan Abi Dawud 3562 — El padre y la paternidad", fr: "Sunan Abi Dawud 3562 — Le père et la paternité" }
text: "… بْنُ شَبِيبٍ، قَالاَ حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، حَدَّثَنَا شَرِيكٌ، عَنْ عَبْدِ الْعَزِيزِ بْنِ رُفَيْعٍ، عَنْ أُمَيَّةَ بْنِ صَفْوَانَ بْنِ أُمَيَّةَ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ اسْتَعَارَ مِنْهُ أَدْرَاعًا يَوْمَ حُنَيْنٍ فَقَالَ أَغَصْبٌ يَا مُحَمَّدُ فَقَالَ \" لاَ بَلْ عَارِيَةٌ مَضْمُونَةٌ \". قَالَ أَبُو دَاوُدَ وَهَذِهِ رِوَايَةُ يَزِيدَ بِبَغْدَادَ وَفِي رِوَايَتِهِ بِوَاسِطَ تَغَيُّرٌ عَلَى غَيْرِ هَذَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 3562، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3562 (Wages (Kitab Al-Ijarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3562، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3562 (Salarios (Kitab Al-Ijarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3562 (Salaires (Kitab Al-Ijarah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
