text: "… بديه، وأَخبرته خبرى، فدفع إلىّ عصاً فقال : تخصّرْ بهذه فى الجنَّة. فإن المتخصّرين فى الجنّة قليل. فكانت عند عبد اللّه بن أُنَيس حتى إِذا حضره الموتُ أَوصى أَهلَه أَن يُدرجوها فى كَفَنه. وكان قتْله فى المحرّم على رأس أربعة …"
