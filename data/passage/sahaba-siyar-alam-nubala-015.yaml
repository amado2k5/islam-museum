text: "صديق يسترعي منه نفقة، فأنفذ إليه بالمئة دينار، فلم ينشب أن ورد عليه رقعة من بعض إخوانه يذكر أنه أيضا في هذا العيد في إضاقة، فوجه إليه بالصرة بعينها. قال: فبقي الأول لا شيء عنده، فاتفق أنه كتب إلى الثالث"
