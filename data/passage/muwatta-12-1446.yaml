label: { ar: "الموطأ 1446 — مالك: بلغه أنه عق عن الحسن والحسين ابني علي بن أبي طالب", en: "Muwatta 1446", es: "Muwatta 1446", fr: "Muwatta 1446", ur: "موطا 1446", tr: "El-Muvatta 1446 — Malik: Kendisine, Ali ibn Abi Talib'in oğulları Hasan ve Hüseyin için akika kestiği bildirildi.", id: "Al-Muwatta 1446 — Malik: Dia diberitahu bahwa dia telah melaksanakan akikah untuk Al-Hasan dan Al-Husayn, putra-putra Ali bin Abi Talib." }
summary:
  ar: "بلغ مالكا أنه عق عن حسن وحسين ابني علي بن أبي طالب. ويذكر المحقق أن أبا داود أخرج بإسناد صحيح عن عكرمة عن ابن عباس أن رسول الله عق عن الحسن والحسين كبشا كبشا. {cite:muwatta-maruf-1997 p.647}"
  tr: "Malik, Ali ibn Abi Talib'in oğulları Hasan ve Hüseyin için akika kestiğini bildirmiştir. Araştırmacı, Ebu Davud'un, İkrime'den, o da İbn Abbas'tan sahih bir isnadla, Allah Resulü'nün Hasan ve Hüseyin için birer koç kurban ederek akika kestiğini zikrettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.647}"
  id: "Malik meriwayatkan bahwa beliau melaksanakan aqiqah untuk Hasan dan Husayn, putra-putra Ali bin Abi Talib. Peneliti menyebutkan bahwa Abu Dawud meriwayatkan dengan sanad yang sahih dari Ikrimah, dari Ibnu Abbas, bahwa Rasulullah SAW melaksanakan aqiqah untuk Hasan dan Husayn, dengan menyembelih masing-masing seekor domba jantan. {cite:muwatta-maruf-1997 p.647}"
