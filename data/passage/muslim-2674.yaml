text: "قال رسول الله: من دعا إلى هدى كان له من الأجر مثل أجور من تبعه لا ينقص ذلك من أجورهم شيئاً، ومن دعا إلى ضلالة كان عليه من الإثم مثل آثام من تبعه لا ينقص ذلك من آثامهم شيئاً"
summary:
  ar: "رواية أبي هريرة في باب من دعا إلى هدى أو ضلالة من كتاب العلم في صحيح مسلم؛ قاعدة الجر المستمر للدعوة إلى الهدى والضر المستمر للدعوة إلى الضلال."
