label: { ar: "الموطأ 813 — مالك: من كان في سفر فعلم أنه داخل على أهله من أول يومه وطلع له الفجر قبل أن يدخل دخل وهو صائم؛ ومن أراد الخروج في رمضان فطلع عليه الفجر بأرضه يصوم ذلك اليوم", en: "Muwatta 813", es: "Muwatta 813", fr: "Muwatta 813", ur: "موطا 813", tr: "Al-Muwatta 813 — Malik: Kim yolculukta olup da günün başlangıcında evine döneceğini biliyorsa ve henüz şafak sökmeden evine girerse, oruçlu olarak girmelidir; kim de Ramazan ayında yola çıkmayı niyet ediyorsa ve kendi ülkesinde şafak sökerse, o gün oruç tutmalıdır.", id: "Al-Muwatta 813 — Malik: Barangsiapa hendak bepergian dan mengetahui bahwa ia akan memasuki rumahnya pada awal hari, dan fajar menyingsing sebelum ia memasuki rumahnya, maka hendaklah ia memasuki rumahnya dalam keadaan berpuasa; dan barangsiapa hendak meninggalkan negerinya pada bulan Ramadan dan fajar menyingsing di negerinya, maka hendaklah ia berpuasa pada hari itu." }
summary:
  ar: "قول يرويه يحيى عن مالك: من كان في سفر فعلم أنه داخل على أهله من أول يومه، وطلع له الفجر قبل أن يدخل، دخل وهو صائم. وإذا أراد أن يخرج في رمضان فطلع له الفجر وهو بأرضه قبل أن يخرج فإنه يصوم ذلك اليوم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (800). {cite:muwatta-maruf-1997 p.398}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Bir kimse yolculuktaysa ve günün erken saatlerinde evine döneceğini biliyorsa ve şafak sökmeden önce eve dönerse, evine oruçlu olarak girmelidir. Benzer şekilde, Ramazan ayında ayrılmayı planlıyorsa ve henüz memleketindeyken şafak sökerse, o gün oruç tutmalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (800) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.398}"
  id: "Sebuah hadis yang diriwayatkan oleh Yahya dari Malik: Jika seseorang sedang bepergian dan mengetahui bahwa ia akan pulang pada pagi hari, dan fajar menyingsing sebelum ia tiba, maka ia harus masuk rumah dalam keadaan berpuasa. Demikian pula, jika ia bermaksud pergi selama bulan Ramadan dan fajar menyingsing ketika ia masih berada di negerinya sebelum berangkat, maka ia harus berpuasa pada hari itu. Peneliti menyebutkan bahwa hadis ini diriwayatkan dari Malik oleh Abu Mus'ab (800). {cite:muwatta-maruf-1997 p.398}"
