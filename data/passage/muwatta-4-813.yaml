label: { ar: "الموطأ 813 — مالك: من كان في سفر فعلم أنه داخل على أهله من أول يومه وطلع له الفجر قبل أن يدخل دخل وهو صائم؛ ومن أراد الخروج في رمضان فطلع عليه الفجر بأرضه يصوم ذلك اليوم", en: "Muwatta 813" }
summary:
  ar: "قول يرويه يحيى عن مالك: من كان في سفر فعلم أنه داخل على أهله من أول يومه، وطلع له الفجر قبل أن يدخل، دخل وهو صائم. وإذا أراد أن يخرج في رمضان فطلع له الفجر وهو بأرضه قبل أن يخرج فإنه يصوم ذلك اليوم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (800). {cite:muwatta-maruf-1997 p.398}"
