text: |-
  * ⁦(باب اللام)⁩.
  • ⁦(جفل)⁩*
  ٦٥(
  من كل مشترف وان بعد المدى * ضرم الرفاق مناقل الاجرال
  وقد يكون جمع جرل مشل جبل وأجبال والجريال صبغ أحر عن الاصعىّ وبويال الذهب
  جرتة قال الاعشى
  اذاجزدت يوماحسبت خيصة * عليها وجريال النضير الدلامصا
  والجريال الجمر وهودون السلاف فى الجودة ويقال جريال الهرلونها وينشد للاعشى
  وسبيئة مما تعتق بابل * كدم الذبيخ سلبته اجريالها
  يقول شريتها حراء وبلتها بيضاء ( رد حل الجرد حسل من الابل الضخم ⁦( زل )⁩
  لجزل ماعظم من الحطب ويبس وأنشدأحدين يحي
  فويم القدرك ويم الها • اذا اختير فى المحل جزل الحطب
  والجزيل العظيم وعطاء جزل وجزيل وابهع جزال وأجزلت له من العطاء أى أكثرت وفلان
  جزل الرأى وامرأة جزلة بيئة الجزالة اذا صسكانت ذات رأى واللفظ الجزل خلاف الركيك
  والجزل القطع بقال جزات الشئ جزلتين أى قطعته قطعتين والجزلة أيضا بالسكسر القطاعة
  العظيمة من التمر وهذازمن الجزال أى زمن صرام النخل ومنه قول الراجز
  حتى اذا ماحان من جزالها* والخزل بالتهريك أن تصيب الغارب دبرة فيخرج منه عظم
  فيتطامن موضعه يقال بع يرأجزل قال أبو النجم• يغادر الصحسد كظهر الاجزل * والجوزل
  فرخ المام وربماسمى الشاب جوزلا والجوزل السم قال أبو عبيدة لم يسمع ذلك الافى قول
  ابن مقبل يصف ناقة *سقتهن كاسامن ذعاف وجوزلا • ⁦(جعل)⁩ جعلت كذاأ بعله جعلا
  ومجعلا وجع-له اللّٰه ننيا أى مسيره وجعلوا الملائكة انا نا أى سمرهم والجعل النخل القصار
  الواحدة جعلة ومنه قول الراجز (٣ * أويستوى جنينها وجعاها و الجعل بالضم
  ما جعل للانسان من شي على الشي يفعله وكذلك الجعالة بالكسر والجعيلة مثله والجعل
  دويبة وقد جعل الماء بالكسر جعلا أى كثرفيه الجعلان والجعال انلحرقة التى تنزل بها القدر
  عن التاروالجمع جعل مشل كتاب وكتب وأجعلت القدر أى أنزلتها بالجعال وأجعات لفلان
  من الجعل فى العطية وأجعات الكلبة واستجعلت فهى مجعل اذا أرادت السفاد وكذلك
  سائر السسباع واجتعل وجعل بمعنى قال الشاعر أبوزبيد
  فاط أمى الضعاف واجتعل الليشل كميل العادية المودود
  ⁦( جفل)⁩ الجفل السحاب الذى قدهراق ماء، ثم انجفل والجفال بالضم الصوف الكثير
  قالت الضائسة أولدرخالا وأجزجفالا وأحلب كنبائقالا ولم ترمثلى مالا قولها جفالا
  أى أجز برّة واحدة وذلك أن صوفها لا يسقط الى الارض شئ منه حتى بجز كله قال
  ذو الرحّة بصف شعر المرأة
  وأسود كالاساود مسبكرا • على المتنين مندلاجفالا
  ولا يوصف بالحفال الاوفيه كثرة والحفال أيضامانفاء السيل وحفالة القدرما أخذته من
  رأسها بالمغرفة وأخذت جفلة من صوف أى جزة وهواسم مفعول مثل قوله تعالى الامن
  اغترف غرفة بيده قال أبوزيديقال دعوتهم الجفلى والاحفلى والاصمعى لم يعرف الاجفلى
  ٤٢
  نى
  قوله والجريال يعنى بالكسر كمافين
  القاموس
  قوله وجعله اللّٰه نبيا الخ فى بعض
  الفسخ وقوله تعالى وجعلنى نبيا
  أى صيرنى اه
  ٣ ف نسخة قال الراجز وأوّل
  البيت
  أقسمت لا يذهب عتى بعله!
