label: { ar: "سنن النسائي 3194 — الأب والأبوة", en: "Sunan al-Nasa'i 3194 — the father and fatherhood", ur: "سنن نسائی 3194 — باپ اور والدیت", es: "Sunan al-Nasa'i 3194 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3194 — le père et la paternité", tr: "Sunan an-Nasa'i 3194 — Baba ve Babalık", id: "Sunan an-Nasa'i 3194 — Sang Ayah dan Peran Ayah" }
text: "… سُلَيْمَانَ، قَالَ حَدَّثَنَا جَعْفَرُ بْنُ عَوْنٍ، عَنْ أَبِي عُمَيْسٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ جَبْرٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ عَادَ جَبْرًا فَلَمَّا دَخَلَ سَمِعَ النِّسَاءَ يَبْكِينَ وَيَقُلْنَ كُنَّا نَحْسُبُ وَفَاتَكَ قَتْلاً فِي سَبِيلِ اللَّهِ. فَقَالَ \" وَمَا تَعُدُّونَ الشَّهَادَةَ إِلاَّ مَنْ قُتِلَ فِي سَبِيلِ اللَّهِ إِنَّ شُهَدَاءَكُمْ إِذًا لَقَلِيلٌ الْقَتْلُ فِي سَبِيلِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3194، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3194 (The Book of Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3194، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3194 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3194 (Le Livre du Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 3194 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3194, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
