text: "لم تجب، فما كان مشتركاً فهو واجب على الكفاية، وما كان مختصاً فإنما يجب على زيد دون عمرو، لا يشترك الناس في وجوب عمل بعينه على كل أحد قادر سوى الخمس، فإن زوجة زيد وأقاربه ليست زوجة عمرو وأقاربه، فليس …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 272، يرد فيه ذكر فرض الكفاية، والواجب، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 272, whose wording mentions the communal obligation (fard kifaya), the obligatory (wajib), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 272 کا اقتباس جس میں فرضِ کفایہ، واجب، وجوب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Iman de Ibn Taymiyya, volume numérisé 1, p. 272, dont le texte mentionne l'obligation collective (fard kifaya), l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Iman de Ibn Taymiyya, volumen digitalizado 1, p. 272, cuyo texto menciona la obligación colectiva (fard kifaya), lo obligatorio (wajib), la obligatoriedad (wujub), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Taymiyye'nin \"İman\" (İman) adlı eserinin 1. cildinin 272. sayfasından, toplu yükümlülük, görev ve sorumlu bir bireyden beklenenler kavramlarını ele alan bir alıntı. Bu alıntı, kaynak yönergelerine uygun olarak, makine tarafından okunabilir, taranmış bir versiyondan alınmıştır ve yaklaşık kırk kelime içermektedir; herhangi bir düzenleme yapılmamıştır. Bu alıntı, farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 272, yang membahas konsep kewajiban kolektif, tugas, dan apa yang dituntut dari individu yang bertanggung jawab. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin dan berisi sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, tugas, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
