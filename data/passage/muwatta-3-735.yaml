label: { ar: "الموطأ 735 — مالك: عشر الزيتون لا ينظر فيه إلى النفقة، ويسأل أهله ويصدقون، فمن رفع خمسة أوسق أخذ من زيته العشر", en: "Muwatta 735" }
summary:
  ar: "يقول يحيى: سئل مالك متى يُخرج من الزيتون العشر، أقبل النفقة أم بعدها؟ فقال: لا يُنظر إلى النفقة ولكن يُسأل عنه أهله كما يُسأل أهل الطعام عن الطعام ويُصدَّقون بما قالوا، فمن رُفع من زيتونه خمسة أوسق فصاعداً أُخذ من زيته العشر بعد أن يُعصر، ومن لم يُرفع من زيتونه خمسة أوسق لم تجب عليه في زيته الزكاة. ويذكر المحقق أن زيادة «أو نصفه» في نسخة م لا أصل لها، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.367}"
