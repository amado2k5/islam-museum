label: { ar: "الموطأ 735 — مالك: عشر الزيتون لا ينظر فيه إلى النفقة، ويسأل أهله ويصدقون، فمن رفع خمسة أوسق أخذ من زيته العشر", en: "Muwatta 735", es: "Muwatta 735", fr: "Muwatta 735", ur: "موطا 735", tr: "El-Muvatta 735 — Malik: Zeytinlerden alınan zekât, gider olarak değerlendirilmez; sahipleri sorgulanır ve onlara inanılır. Beş vask (kuru ölçü birimi) yetiştiren kimse, zeytinyağının zekâtını alır.", id: "Al-Muwatta 735 — Malik: Persepuluhan atas buah zaitun tidak dianggap sebagai pengeluaran; pemiliknya ditanyai dan mereka dipercaya. Siapa pun yang mengumpulkan lima wasq (satuan ukuran kering) mengambil persepuluhan dari minyaknya." }
summary:
  ar: "يقول يحيى: سئل مالك متى يُخرج من الزيتون العشر، أقبل النفقة أم بعدها؟ فقال: لا يُنظر إلى النفقة ولكن يُسأل عنه أهله كما يُسأل أهل الطعام عن الطعام ويُصدَّقون بما قالوا، فمن رُفع من زيتونه خمسة أوسق فصاعداً أُخذ من زيته العشر بعد أن يُعصر، ومن لم يُرفع من زيتونه خمسة أوسق لم تجب عليه في زيته الزكاة. ويذكر المحقق أن زيادة «أو نصفه» في نسخة م لا أصل لها، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.367}"
  tr: "Yahya şöyle dedi: Malik'e zeytinlerin zekâtının ne zaman ödenmesi gerektiği soruldu, masraflardan önce mi yoksa sonra mı? Cevap verdi: Masraflar dikkate alınmaz, ancak sahiplerine bu konuda soru sorulur, tıpkı yiyecek sahiplerine yiyecek hakkında soru sorulduğu gibi ve onların sözüne güvenilir. Beş vask veya daha fazla zeytin hasat eden kimsenin zekâtı, sıkıldıktan sonra yağından alınır. Beş vask zeytin hasat etmeyen kimsenin ise zeytinyağından zekât ödeme yükümlülüğü yoktur. Editör, M el yazmasındaki \"veya yarısı\" ifadesinin hiçbir dayanağı olmadığını ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.367}"
  id: "Yahya berkata: Malik ditanya kapan zakat harus dibayarkan atas buah zaitun, sebelum atau setelah pengeluaran? Beliau menjawab: Pengeluaran tidak dipertimbangkan, tetapi pemiliknya ditanyai tentang hal itu, sebagaimana pemilik makanan ditanyai tentang makanan tersebut, dan perkataan mereka diterima. Siapa pun yang memanen lima wasq atau lebih buah zaitun, zakat diambil dari minyaknya setelah diperas. Siapa pun yang tidak memanen lima wasq buah zaitun tidak wajib membayar zakat atas minyaknya. Editor mencatat bahwa penambahan \"atau setengahnya\" dalam manuskrip M tidak memiliki dasar, dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.367}"
