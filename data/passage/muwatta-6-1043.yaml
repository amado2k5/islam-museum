label: { ar: "الموطأ 1043 — مالك: هذا الأمر عندنا فيمن أحصر بعدو كما أحصر النبي وأصحابه، فأما من أحصر بغير عدو فإنه لا يحل دون البيت", en: "Muwatta 1043", es: "Muwatta 1043", fr: "Muwatta 1043", ur: "موطا 1043", tr: "El-Muvatta 1043 — Malik: Bu hüküm, Peygamber ve sahabelerinde olduğu gibi, düşman tarafından kuşatılanlar için geçerlidir. Düşman dışında bir şey tarafından kuşatılanlara gelince, onların Kâbe'den ayrılmalarına izin verilmez.", id: "Al-Muwatta 1043 — Malik: Hukum ini berlaku bagi mereka yang dikepung oleh musuh, seperti halnya Nabi dan para sahabatnya. Adapun bagi mereka yang dikepung oleh sesuatu selain musuh, mereka tidak diperbolehkan meninggalkan Ka'bah." }
summary:
  ar: "قول لمالك: هذا الأمر عندنا فيمن أحصر بعدو كما أُحصر النبي وأصحابه. فأما من أُحصر بغير عدو فإنه لا يحل دون البيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1174). {cite:muwatta-maruf-1997 p.485}"
  tr: "Malik şöyle demiştir: Bu hüküm, Peygamber ve sahabelerinde olduğu gibi, düşman tarafından kuşatılanlar için geçerlidir. Ancak düşman dışında bir şey tarafından kuşatılanların Kâbe'den ayrılmalarına izin verilmez. Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (1174) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.485}"
  id: "Malik berkata: Hukum ini berlaku bagi mereka yang dikepung musuh, seperti halnya Nabi dan para sahabatnya. Namun, mereka yang dikepung oleh sesuatu selain musuh tidak diperbolehkan meninggalkan Ka'bah. Peneliti menyebutkan bahwa Abu Mus'ab (1174) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.485}"
