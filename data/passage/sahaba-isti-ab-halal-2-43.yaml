text: "… وأصدقهم حياءً عثمانُ، وأَقْضَاهم عليُّ بنُ النَّبيِّ عبد اللّٰه بن الأرقم أَبِي طالِبٍ، وأَقْرَؤُهم أُبَيٌّ بنُ كعب، وَأَفْرَضُهم زيدُ الزُّهريّ، وكان الكاتبُ لعهوده ليله إذا عهد، وصُلحه ابنُ ثابت، وأَعلمهم بالحلال والحرام معاذ بنُ جَبَل، إِذا صالح، عليَّ بن أَبي …"
