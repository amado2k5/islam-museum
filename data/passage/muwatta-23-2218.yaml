label: { ar: "الموطأ 2218 — يحيى عن مالك: الأمر المجتمع عليه عندنا أن الضعيف في عقله، والسفيه، والمصاب الذي يفيق أحيانا، تجوز وصاياهم إذا كان معهم من عقولهم ما يعرفون به ما يوصون به، فمن لم يكن معه من عقله ما يعرف به ما يوصي به، فلا وصية له", en: "Muwatta 2218" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر المجتمع عليه عندنا أن الضعيف في عقله، والسفيه، والمصاب الذي يفيق أحيانا، تجوز وصاياهم، إذا كان معهم من عقولهم ما يعرفون ما يوصون به. فأما من ليس معه من عقله ما يعرف به ما يوصي به، وكان مغلوبا على عقله، فلا وصية له. {cite:muwatta-maruf-1997 p.311}"
