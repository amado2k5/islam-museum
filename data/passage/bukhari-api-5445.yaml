label: { ar: "صحيح البخاري 5445 — تمر العجوة، السم", en: "Sahih al-Bukhari 5445 — 'ajwa dates; poison", ur: "صحیح بخاری 5445 — عجوہ کھجور، زہر", es: "Sahih al-Bukhari 5445 - fechas 'ajwa; veneno", fr: "Sahih al-Bukhari 5445 — dates 'ajwa; poison", tr: "Sahih el-Buhari 5445 - Ajwa hurması, zehir", id: "Sahih al-Bukhari 5445 — Kurma ajwa, racun" }
text: "حَدَّثَنَا جُمْعَةُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا مَرْوَانُ، أَخْبَرَنَا هَاشِمُ بْنُ هَاشِمٍ، أَخْبَرَنَا عَامِرُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ تَصَبَّحَ كُلَّ يَوْمٍ سَبْعَ تَمَرَاتٍ عَجْوَةً لَمْ يَضُرُّهُ فِي ذَلِكَ الْيَوْمِ سُمٌّ وَلاَ سِحْرٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5445، يذكر تمر العجوة، والسم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5445 (Food, Meals), that mentions 'ajwa dates, poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5445، جس میں عجوہ کھجور، زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 5445 (Comida, Comidas), menciona los dátiles 'ajwa como veneno. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5445 (Alimentation, Repas), mentionne les dattes 'ajwa, considérées comme du poison. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5445 numaralı hadiste, ecva hurması ve zehirden bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5445, menyebutkan kurma Ajwa dan racun. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
