text: "… أبيه، عن جده قال: قلت: يا رسول اللّٰه، إني أسمع منك الحديث لا أستطيع أن أؤديه كما أسمع منك، يزيد حرفاً أو ينقص حرفاً؟ فقال : إذا لم تُجِلوا حَرَاماً ولا تحرّموا حلالاً، وأصبتم المعنى، فلا بأس. فذُكِر ذلك للحَسَن …"
