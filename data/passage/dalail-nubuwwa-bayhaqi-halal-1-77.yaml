text: "… بوجود اللّٰه - سبحانه - وأنه الخالق للسماوات والأرض وما بينهما. ولكنهم ما كانوا يريدون أن يعترفوا بمقتضى الوحدانية هذه وهو أن يكون الحكم لله وحده في حياتهم وشؤونهم ؛ وأن يتلقوا منه وحده الحلال والحرام، وأن يكون إليه وحده …"
