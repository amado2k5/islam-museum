text: "… ولا تكن قدريا. قال وسمعت سفيان يقول لقد تركت المرجثة هذا الدين أرق من السابرى. حدثنا إبراهيم ثنا محمد ثنا حماد بن الحسن بن عنبسة الوراق ثنا أبو بكر الحنفى. قال سمعت سفيان الثورى يقول : الصلاة والزكاة من الايمان، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 7، ص 33، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
