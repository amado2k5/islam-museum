summary:
  ar: "قال مالك: ولا بأس بأن يشتري رب المال ممن قارضه بعض ما يشتري من السلع، إذا كان ذلك صحيحا على غير شرط. {cite:muwatta-maruf-1997 p.222}"
  tr: "Malik şöyle dedi: Sermaye sahibinin, kendisine borç veren kişiden malların bir kısmını satın almasında, eğer bu geçerli ve koşullu değilse, hiçbir sakınca yoktur. {cite:muwatta-maruf-1997 s.222}"
  id: "Malik berkata: Tidak ada yang salah dengan pemilik modal membeli sebagian barang dari orang yang meminjamkan uang kepadanya, jika hal ini sah dan tidak bersyarat. {cite:muwatta-maruf-1997 p.222}"
