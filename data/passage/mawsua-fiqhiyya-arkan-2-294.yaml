text: "… فانسل، فذهب فاغتسل، فتفقده النبي وَلِيِ فلما جاء قال: أين كنت يا أبا هريرة؟ قال : يارسول اللّٰه لقيتني وأنا جنب، فكرهت أن أجالسك حتى أغتسل. فقال: سبحان اللّٰه! إن المؤمن لا ينجس. وفي صحيح مسلم عن أنس أن أخت …"
