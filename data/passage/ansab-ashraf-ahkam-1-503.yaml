text: "… جراح الرسول عقب معركة أحد.. نسيبة المازنية أبو سفيان يواعد المسلميز شهداء أحد شهداء أحد من الأوس شهداء أحد من الخزرج قتلى المشركين في أحد دفن الشهداء في أحد مقتل الذي مثّل بجثة حمزة نزول الفرائض بالمواريث غزوة حمراء الأسد …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 1، ص 503، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 1, p. 503, whose wording mentions the obligation (farida); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 1، ص 503 کا اقتباس جس میں فریضہ اور فرائض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
