label: { ar: "صحيح مسلم 3079 — ما لا حرج فيه", en: "Sahih Muslim 3079 — what carries no blame", ur: "صحیح مسلم 3079 — جس میں کوئی حرج نہیں", fr: "Sahih Muslim 3079 — ce qui n'entraîne aucun blâme", es: "Sahih Muslim 3079 — lo que no acarrea reproche", tr: "Sahih Muslim 3079 — Neler caizdir?", id: "Sahih Muslim 3079 — Apa yang diperbolehkan" }
text: "… حَجَّ امْرِئٍ وَلاَ عُمْرَتَهُ لَمْ يَطُفْ بَيْنَ الصَّفَا وَالْمَرْوَةِ وَلَوْ كَانَ كَمَا تَقُولُ لَكَانَ فَلاَ جُنَاحَ عَلَيْهِ أَنْ لاَ يَطَّوَّفَ بِهِمَا. وَهَلْ تَدْرِي فِيمَا كَانَ ذَاكَ إِنَّمَا كَانَ ذَاكَ أَنَّ الأَنْصَارَ كَانُوا يُهِلُّونَ فِي الْجَاهِلِيَّةِ لِصَنَمَيْنِ عَلَى شَطِّ الْبَحْرِ يُقَالُ لَهُمَا إِسَافٌ وَنَائِلَةٌ. ثُمَّ يَجِيئُونَ فَيَطُوفُونَ بَيْنَ الصَّفَا وَالْمَرْوَةِ ثُمَّ يَحْلِقُونَ. فَلَمَّا جَاءَ الإِسْلاَمُ كَرِهُوا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3079، يرد فيه ذكر ما لا حرج فيه. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 3079 (The Book of Pilgrimage), whose wording mentions what carries no blame. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 3079، جس کے الفاظ میں جس میں کوئی حرج نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 3079, dont le texte mentionne ce qui n'entraîne aucun blâme. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 3079, cuyo texto menciona lo que no acarrea reproche. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 3079 numaralı hadis, caiz olan hususlardan bahsetmektedir. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3079, menyebutkan hal-hal yang diperbolehkan. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
