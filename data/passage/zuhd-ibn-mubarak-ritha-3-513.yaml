  tr: "*Al-Zuhd wal-Raqaiq* adlı resimli kitabın 3. cildinin 513. sayfasından, felaket karşısında teselli, rahatlık ve sabır sunan bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü mersiye ve ağıtların bir derlemesinden derlenmiştir."
