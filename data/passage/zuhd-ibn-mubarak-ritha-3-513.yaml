text: "… الهدى. مالك بن مغول. أثر عن بعض العلماء سفيان بن عيينة. صاحب له : مبهم. بعض العلماء : مبهم. وقوله أعطى لكم الدنيا قرضا معناه أنه سوف يستردها منكم مرة أخرى فإنا لله وإنا إليه راجعون. وقوله : وسألكموه قرضا …"
summary:
  ar: "مقطع من كتاب الزهد والرقائق، المجلد المصوَّر 3، ص 513، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
