  ar: "سنن النسائي، كتاب العمرى"
  en: "Sunan al-Nasa'i, Book 34: The Book of 'Umra"
  ur: "سنن نسائی، کتاب العمریٰ"
  es: "Sunan al-Nasa'i, Libro 34: El Libro de la Umra"
