summary:
  ar: "القسم 34 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العمرى»، ويضم فيها النصوص من 3720 إلى 3760 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 34 of Sunan al-Nasa'i (The Book of 'Umra) in the division of the open hadith dataset the museum took its reports from: reports 3720 to 3760 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 34، عنوان «کتاب العمریٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3720 تا 3760۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 34 de Sunan al-Nasa'i (El Libro de la Umrah) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3720 al 3760, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de la 'Umra), dans la partie ouverte du recueil de hadiths dont il a tiré ses informations: les hadiths 3720 à 3760 de cette numérotation. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
