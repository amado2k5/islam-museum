label: { ar: "سنن النسائي 458 — تعريف الإسلام بأعماله", en: "Sunan al-Nasa'i 458 — Islam defined by its acts", ur: "سنن نسائی 458 — اسلام کی تعریف اس کے اعمال سے" }
text: "… ثَائِرَ الرَّأْسِ نَسْمَعُ دَوِيَّ صَوْتِهِ وَلاَ نَفْهَمُ مَا يَقُولُ حَتَّى دَنَا فَإِذَا هُوَ يَسْأَلُ عَنِ الإِسْلاَمِ فَقَالَ لَهُ رَسُولُ اللَّهِ \" خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ وَاللَّيْلَةِ \". قَالَ هَلْ عَلَىَّ غَيْرُهُنَّ قَالَ \" لاَ إِلاَّ أَنْ تَطَّوَّعَ \". قَالَ \" وَصِيَامُ شَهْرِ رَمَضَانَ \". قَالَ هَلْ عَلَىَّ غَيْرُهُ قَالَ \" لاَ إِلاَّ أَنْ تَطَّوَّعَ \". …"
summary:
  ar: "حديث في سنن النسائي، رقم 458، يذكر تعريف الإسلام بأعماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 458 (The Book of Salah), that mentions Islam defined by its acts. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 458، جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
