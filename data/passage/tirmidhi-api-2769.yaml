text: "… أَوْ مِمَّا مَلَكَتْ يَمِينُكَ \". فَقَالَ الرَّجُلُ يَكُونُ مَعَ الرَّجُلِ قَالَ \" إِنِ اسْتَطَعْتَ أَنْ لاَ يَرَاهَا أَحَدٌ فَافْعَلْ \". قُلْتُ وَالرَّجُلُ يَكُونُ خَالِيًا. قَالَ \" فَاللَّهُ أَحَقُّ أَنْ يُسْتَحْيَا مِنْهُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَجَدُّ بَهْزٍ اسْمُهُ مُعَاوِيَةُ بْنُ حَيْدَةَ الْقُشَيْرِيُّ وَقَدْ رَوَى الْجُرَيْرِيُّ عَنْ حَكِيمِ بْنِ مُعَاوِيَةَ وَهُوَ وَالِدُ بَهْزٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2769، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2769 (Chapters on Manners), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2769، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
