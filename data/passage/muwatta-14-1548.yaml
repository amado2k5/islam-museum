label: { ar: "الموطأ 1548 — يحيى بن سعيد: أبو نهشل بن الأسود قال للقاسم بن محمد رأيت جاريتي منكشفا عنها فجلست منها مجلس الرجل من امرأته، فنهاه القاسم", en: "Muwatta 1548" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا نهشل بن الأسود قال للقاسم بن محمد إني رأيت جارية لي منكشفا عنها، وهي في القمر، فجلست منها مجلس الرجل من امرأته، فقالت إني حائض، فنهضت فلم أقربها بعد، أفأهبها لابني يطؤها؟ فنهاه القاسم عن ذلك. {cite:muwatta-maruf-1997 p.47}"
