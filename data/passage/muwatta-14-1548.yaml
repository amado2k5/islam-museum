label: { ar: "الموطأ 1548 — يحيى بن سعيد: أبو نهشل بن الأسود قال للقاسم بن محمد رأيت جاريتي منكشفا عنها فجلست منها مجلس الرجل من امرأته، فنهاه القاسم", en: "Muwatta 1548", es: "Muwatta 1548", fr: "Muwatta 1548", ur: "موطا 1548", tr: "El-Muvatta 1548 — Yahya ibn Said: Ebu Nahşal ibn el-Esved, el-Kâsım ibn Muhammed'e şöyle dedi: Cariyemin üzerinin açık olduğunu gördüm, bu yüzden bir erkeğin karısıyla oturduğu gibi onunla oturdum. El-Kâsım ona bunu yapmasını yasakladı.", id: "Al-Muwatta 1548 — Yahya ibn Saeed: Abu Nahshal ibn al-Aswad berkata kepada al-Qasim ibn Muhammad: Aku melihat budak perempuanku dengan pakaiannya terbuka, lalu aku duduk bersamanya seperti seorang pria duduk dengan istrinya. Al-Qasim melarangnya melakukan hal itu." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا نهشل بن الأسود قال للقاسم بن محمد إني رأيت جارية لي منكشفا عنها، وهي في القمر، فجلست منها مجلس الرجل من امرأته، فقالت إني حائض، فنهضت فلم أقربها بعد، أفأهبها لابني يطؤها؟ فنهاه القاسم عن ذلك. {cite:muwatta-maruf-1997 p.47}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ebu Nahşal ibn el-Esved'in el-Kâsım ibn Muhammed'e şöyle dediğini aktarır: \"Cariyemi ay ışığında örtüsüz gördüm ve bir erkeğin karısıyla oturduğu gibi onunla oturdum. 'Adet görüyorum' dedi, ben de kalkıp bir daha yanına yaklaşmadım. Onu oğluma cinsel ilişki için vermeli miyim?\" El-Kâsım bunu yasakladı. {cite:muwatta-maruf-1997 s.47}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Abu Nahshal ibn al-Aswad berkata kepada al-Qasim ibn Muhammad: \"Aku melihat budak perempuanku telanjang di bawah sinar bulan, dan aku duduk bersamanya seperti seorang pria duduk dengan istrinya. Dia berkata, 'Aku sedang haid,' lalu aku bangun dan tidak mendekatinya lagi. Haruskah aku memberikannya kepada anakku untuk disetubuhi?\" Al-Qasim melarangnya melakukan hal itu. {cite:muwatta-maruf-1997 p.47}"
