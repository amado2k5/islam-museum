text: "… الاممش عن أبى. صالح عن عبد اللّٰه بن ضمرة عن كعب. قال : من أقام الصلاة. وآتى الزكاة وسمع وأطاع فقد توسط الايمان ومن أحب لله وأبمض لله وأعطى لله ومنع لله فقد. استكمل الايمان. حدثنا عبد اللّٰه بن محمد …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 6، ص 31، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
