label: { ar: "الموطأ 1426 — مالك: الأمر المجتمع عليه أن المسلم إذا أرسل كلب المجوسي الضاري فصاد، فالصيد حلال، وإن لم يذكه المسلم", en: "Muwatta 1426" }
summary:
  ar: "يقول مالك الأمر المجتمع عليه عندنا أن المسلم إذا أرسل كلب المجوسي الضاري فصاد أو قتل، إنه إذا كان معلما، فأكل ذلك الصيد حلال لا بأس به، وإن لم يذكه المسلم، ومثل ذلك كمثل المسلم يذبح بشفرة المجوسي أو يرمي بقوسه أو نبله، فيقتل بها، فصيده وذبيحته حلال. وإذا أرسل المجوسي كلب المسلم الضاري على صيد فأخذه، فلا يؤكل إلا أن يذكى. {cite:muwatta-maruf-1997 p.638}"
