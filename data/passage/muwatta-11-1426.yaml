label: { ar: "الموطأ 1426 — مالك: الأمر المجتمع عليه أن المسلم إذا أرسل كلب المجوسي الضاري فصاد، فالصيد حلال، وإن لم يذكه المسلم", en: "Muwatta 1426", es: "Muwatta 1426", fr: "Muwatta 1426", ur: "موطا 1426", tr: "El-Muvatta 1426 — Malik: İttihat şudur ki, bir Müslüman Mecusilerin av köpeğini gönderir ve köpek avlanırsa, Müslüman onu İslami usullere göre kesmese bile avlanan hayvan helaldir.", id: "Al-Muwatta 1426 — Malik: Konsensusnya adalah jika seorang Muslim mengirimkan anjing pemburu milik seorang Majusi dan anjing itu berburu, maka mangsanya halal, meskipun Muslim tersebut tidak menyembelihnya sesuai dengan tata cara Islam." }
summary:
  ar: "يقول مالك الأمر المجتمع عليه عندنا أن المسلم إذا أرسل كلب المجوسي الضاري فصاد أو قتل، إنه إذا كان معلما، فأكل ذلك الصيد حلال لا بأس به، وإن لم يذكه المسلم، ومثل ذلك كمثل المسلم يذبح بشفرة المجوسي أو يرمي بقوسه أو نبله، فيقتل بها، فصيده وذبيحته حلال. وإذا أرسل المجوسي كلب المسلم الضاري على صيد فأخذه، فلا يؤكل إلا أن يذكى. {cite:muwatta-maruf-1997 p.638}"
  tr: "Bizim aramızdaki görüş birliğine göre Malik el-Amr, bir Müslümanın Mecusi'nin av köpeğini gönderip avı öldürmesi durumunda, eğer köpek eğitilmişse, avın yenmesinin caiz olduğunu ve Müslümanın onu İslami usullere göre kesmese bile bunda bir sakınca olmadığını söyler. Bu, bir Müslümanın Mecusi'nin bıçağıyla kesmesi veya ok ve yayla atış yapıp öldürmesine benzer; avı ve kesilen hayvanı yemek caizdir. Ancak, bir Mecusi bir Müslümanın av köpeğini avın peşinden gönderir ve köpek avı yakalarsa, İslami usullere göre kesilmedikçe onu yemek caiz değildir. {cite:muwatta-maruf-1997 s.638}"
  id: "Malik al-Amr, menurut konsensus di antara kami, mengatakan bahwa jika seorang Muslim mengirimkan anjing pemburu milik seorang Majusi dan anjing itu berburu atau membunuh, maka jika anjing itu terlatih, memakan mangsa tersebut diperbolehkan dan tidak ada bahayanya, meskipun Muslim tersebut tidak menyembelihnya menurut tata cara Islam. Ini mirip dengan seorang Muslim yang menyembelih dengan pisau Majusi atau menembak dengan busur atau panahnya, dan membunuh dengan itu; mangsa dan hewan yang disembelihnya diperbolehkan. Namun, jika seorang Majusi mengirimkan anjing pemburu milik seorang Muslim untuk mengejar mangsa dan anjing itu menangkapnya, maka tidak diperbolehkan untuk memakannya kecuali jika disembelih menurut tata cara Islam. {cite:muwatta-maruf-1997 p.638}"
