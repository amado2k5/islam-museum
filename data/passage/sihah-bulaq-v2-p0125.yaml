text: |-
  ٢17
  *حصا).
  واحتساه بعنى وتحساه فى مهلة وكان يقال لابى جدعان حاسى الذهب لانه كان له اناه من
  ذهب يحسومنه والحسى بالكسر ما تتشفه الارض من الرمل فاذاصار الى صلابة أمسكنه
  فتحف رعنه الرمل فتستخرجه وهو الاحتاء وجمع الجى الاحساء وهى السكرار والجساء
  موضع وقال
  اذا بلغتى وحلت رحلى * مسيرة أربع بعد الحساء
  وحسيت الخبر بالكسر مثل حسست قال أبوزبيدبصف أسدا
  سوى أنّ العتاق من المطابا • حدين به فهنّ اليهشوس
  وأحسيت الخبر شله حشا حشوت الوسادة وغيرهاحشوا والحائض تحتشى
  بالكرسف لتحبس الدم والحشاما أضطمت عليه الضلوع والجمع أحناء وقول الشاعر
  بأى الحشا أمسى الخليط المبائن » يعنى الناحية وحشوة البطن وحشونه بالسكسر والضم
  .أمعاؤه وفلان من حشوة بنى ذلان بالكسر أى من رذالهم والحاشية واحدة حواشى
  الثوب وهى جوانيه وعيش رقيق الحواشى أى رغد والحشو والماشة صغار الابل لاكبار
  فيها وكذلك من الناس قال ابن السكيت الحاشيتان ابن المخاض وابن الليون يقال
  اأرسل بنوفلان رائدافانتهى الى أرض قد شبعت حاشيتاها والحشية واحدة الحشايا
  والمحشى العظامة تعظ-م بها المرأة الرسحاه عجيزتها وقال، ماغنيات عن الماشى* قال
  الاصمعى المماشى أكسية خشنة واحدتها محشاة وقول النابغة
  اجمع محاشك بايزيدفاتى • أعددت يربوعالكم وتميما
  هو من الحشو والحشى الربوودحشى بالسكسز فهورجل حسْ وحشيان أيضا قال الشماخ
  تلاعبق اذا ماشئت خود • على الانماط ذات حذى قطيع
  ويروى حود على أن يجعسل من نعت بهكنة فى قوله
  ولو أنى أشاء كننت نقسى • الى بيضامبهكنة شموع
  أى ذات نفس منقطع من سمنها وقطيع نعت لحشى قال ابن السكيت يقال أرنب محشسية
  الكلاب أى تعد والكلاب خافها حتى تنبهر الكلاب قال الاصمعى الحشى على فعيل
  اليابس وأنشد للحجاج» والهدب الناعم والحشىّ* يروى بالحاء وانلهاء يميعا ويقال حاشاك
  وحاشى لك والمعنى واحد ويقال حاشى لله أى معاذ الله وقرئ حاش اللّه بلا ألف اتباعا للكتاب
  والافالاصل حاشى بالالف وحاشى كملة يستنى بها وقد تكون حرفابارا وقد تكون فعلافان
  جعلتها ف علانصبت به مافقلت ضريتهم حاشى زيداوان جعلتها حرفاخفضت بها وقال سيبويه
  حاشالا تسكون الاحرف جرلانها لوكانت فعلا لحاز أن تكون صلة لماكما يجوز ذلك فى خلافلما
  امتنع أن يقال جاءنى القوم ماحاشى ز يدادل أنها اليسست بفعل وقال المبرّ دحادى قد تكون
  فعلا واستدل بقول النابغة
  ولا أرى فاعلا فى الناس يشبهه * وما أحانى من الاقواممن أحذ
  فتصرفه يدل على أنه فعل ولانه يقال حاشى لزيد فحرف الجزلا يج وز أن يدخسل عسلى حرف
  الجرْ ولانّ الحذف يدخلها كقواهم حاس زيد والحذف انما يقع فى الاسماء والافعال دون
  الحروف ( صا الحصاة واحدة الحصى وتجمع على حصبات مشسل بقرة وبقرات
  وحصاة
  ٢-,٠ ما
