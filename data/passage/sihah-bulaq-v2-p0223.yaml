text: |-
  ٢٦٤
  •قصل الخاء).
  جن).
  ألاليت شعرى هل أبيتزت ليلة • بمسكة حولى اذخروجلسل
  وهل أردن يومامياه مجنة • وهل ييدون لى شامة وطفيل
  وقال ابنع باس رضى اللّٰه عنم ماكانت محنة وذوالجاز وعكاظ أسواقا فى الجاهلية والجنة أيضا
  الموضع الذى يستترفيه والاجتنان الاستنار والاستجنان الاستطراب وقولهم أجنذ كذا
  أى من أجل أنمك فحذفوا اللام والإلف اختصاراونقلوا كسرة اللام الى اسييم قال الشاءر.
  أجتك عندى أحسن الناس كاهم • وأنك ذات انخال والحبرات
  والجناجن عظام الصدر الواحد حنجن وجنجنة وقد يفتح والمنجذون الدولاب الى يستقى
  عليها ويقال المنجنين أيضادهى أنتى وأنشد الاسمعى لعمارة بن طارق
  ومنجنون كالاتان الفارق * ⁦(جون)⁩ الجون الابيض وأنشدأبو عبيدة
  غيريابنت الحليس لونى* مرّ الليالى واختلاف الجون* وسفركان قليل الأون
  قال يريد النهار والجون الاسودوهو من الاضداد والجمع جون بالضم مثل قولك رجل صم
  وقوم صم والجون من الخيل ومن الابل الادهم الشديد السواد والجونة عين الشمس واغا
  محيت جونة عند مغيبهالانهاتسوت حين تغيب قال يسادر الجونة أن تغيبا • والجونه
  الخاسة المطلبة بالقار قال الاعشى
  فقمنا ولما بصح ديكنا * الى جونة عند حدادها
  والجونة بالضم مصدر الجون من الخيل مشل الغبسة والوردة والجونة أيضاجونة العطار
  وربعاهمزا وابهع جون بفتح الواو ويقال لا أفعله حتى بيض جونة القارهذا اذا أردت
  سواده وجونة القاراذا أردت الحابية ويقال الشمس جونة بينة الجونة والجونى "ضرب من
  القطاسود البطون والاجنهة وهوأكير من الكدرى تعدل جونيّة بكدريتين والجون اسم
  فرس فى شعرلبيد
  تكاثر قرزل والجون فيها • وتحعل والنعامة والخبال
  ⁦(جهن)⁩ جهينة قبيلة قال الشاعر
  تنادوا يالبهنسة اذرأونا • فقلنا أحسى ملاجهينا
  وف المثل» وعند جهينة الخبر اليقين • ابن الاعرابىً وعند جفينة والاصمعى" مثله
  صل الحاء بن الاحين الذى به السق وقد حين الرحسل بالكسر يحين
  وبه حبن وامرأة -بناء والجبن والحبنسة بالكسر كالدقل وأتم حبين دوية وهى معرفة منل
  ابن عرس واسامة وابن آوى وسام أبرص وابن قنرة الا أنه نعريف جنس وربا أدخل عليها
  الالف واللام ثم لا تكون بحذف الالف واللام -نهانكرة وهو شاذ قال الشاءر
  يقول المجنلون عروس تيم • شوى أمّ الحبين ورأس فبل
  ويقال لهاحبينة أيضا وأما ابن مخاض وابن ابون فنكرتان يتع رقان بالالف واللام تعريف
  جنس (-تى الحتز والحتى المئل والقرن يقال هما حتنان وحتنان أى سيان وذلك اذا
  تساويا فى الرمى وقحا تنواتساء واوكل اثنين لايتخالفان فهم امحتقنان ووقعت التبسل حتنى
  أى متساوية وحتى الحرّاشتدويوم حاتن استوى أوله وآخره فى الحرّ والمحتتن المستوى الذى
  إلا يخالف بعضه بعضا وقداحتتن وحوتنان بلد حجن الحجن بالتحريك الاعوجاج
