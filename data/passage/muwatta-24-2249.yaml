label: { ar: "الموطأ 2249 — مالك: بلغه أن عمر بن الخطاب أتته وليدة قد ضربها سيدها بنار أو أصابها بها، فأعتقها", en: "Muwatta 2249", es: "Muwatta 2249", fr: "Muwatta 2249", ur: "موطا 2249", tr: "Al-Muwatta 2249 — Malik: Ona, Ömer ibn al-Khattab'a efendisinin ateşle yakıp yaraladığı bir cariyenin getirildiği ve onun da cariyeyi azat ettiği bildirildi.", id: "Al-Muwatta 2249 — Malik: Sampai kepadanya bahwa Umar ibn al-Khattab dibawa seorang budak perempuan yang telah dibakar atau dilukai oleh tuannya, lalu ia membebaskannya." }
summary:
  ar: "قال مالك: وبلغه أن عمر بن الخطاب أتته وليدة قد ضربها سيدها بنار، أو أصابها بها، فأعتقها. {cite:muwatta-maruf-1997 p.328}"
  tr: "Malik şöyle dedi: Ömer ibn el-Hattab'a, efendisi tarafından ateşle yakılmış veya yaralanmış bir cariyenin getirildiği haberi ulaştı; bunun üzerine Ömer onu azat etti. {cite:muwatta-maruf-1997 s.328}"
  id: "Malik berkata: Ia mendengar kabar bahwa seorang budak perempuan dibawa kepada Umar ibn al-Khattab yang telah terbakar atau terluka akibat api yang disebabkan oleh tuannya, lalu beliau membebaskannya. {cite:muwatta-maruf-1997 p.328}"
