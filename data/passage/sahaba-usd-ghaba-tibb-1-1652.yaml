text: "امْرَأَةٌ من بني غِفَارٍ جئت رسُول اللّٰه علي في نسوة من بني غفار، فقلنا: يا رسول اللّٰه، إنا قد أردنا أن نخرج معك في وجهك هذا إلى خيبر فنداويَ الجرحى ونعينَ المسلمين. لقال رسول اللّٰه عال : على بركة الله... …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1652، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1652, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1652 کا اقتباس جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen escaneado 1, pág. 1652, que menciona el tratamiento de heridas, mujeres que atienden a los heridos, búsqueda de tratamiento; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'Usd al-Ghaba d'Ibn al-Athir, volume 1 scanné, p. 1652, qui mentionne le traitement des blessures, les femmes soignant les blessés, la recherche de soins; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Athir'in \"Asad al-Ghaba\" adlı eserinin resimli 1. cildinin 1652. sayfasında yer alan, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedaviden bahseden bir pasaj; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari kitab “Asad al-Ghaba” karya Ibn al-Athir, jilid 1 bergambar, hlm. 1652, yang menyebutkan pengobatan luka, perempuan yang merawat orang terluka, dan pengobatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
