text: "امْرَأَةٌ من بني غِفَارٍ جئت رسُول اللّٰه علي في نسوة من بني غفار، فقلنا: يا رسول اللّٰه، إنا قد أردنا أن نخرج معك في وجهك هذا إلى خيبر فنداويَ الجرحى ونعينَ المسلمين. لقال رسول اللّٰه عال : على بركة الله... …"
summary:
