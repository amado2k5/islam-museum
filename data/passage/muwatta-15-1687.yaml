label: { ar: "الموطأ 1687 — القاسم بن محمد وسالم بن عبد الله وأبو بكر وسليمان وابن شهاب: إذا دخلت المطلقة في الدم من الحيضة الثالثة فقد بانت، ولا ميراث بينهما، ولا رجعة له عليها", en: "Muwatta 1687" }
summary:
