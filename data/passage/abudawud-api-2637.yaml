label: { ar: "سنن أبي داود 2637 — الأب والأبوة", en: "Sunan Abi Dawud 2637 — the father and fatherhood", ur: "سنن ابی داؤد 2637 — باپ اور والدیت", es: "Sunan Abi Dawud 2637 — El padre y la paternidad" }
text: "… مُحَمَّدُ بْنُ عُبَيْدٍ، حَدَّثَنَا ابْنُ ثَوْرٍ، عَنْ مَعْمَرٍ، عَنِ الزُّهْرِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ كَانَ إِذَا أَرَادَ غَزْوَةً وَرَّى غَيْرَهَا وَكَانَ يَقُولُ \" الْحَرْبُ خُدْعَةٌ \". قَالَ أَبُو دَاوُدَ لَمْ يَجِئْ بِهِ إِلاَّ مَعْمَرٌ يُرِيدُ قَوْلَهُ \" الْحَرْبُ خُدْعَةٌ \". بِهَذَا الإِسْنَادِ إِنَّمَا يُرْوَى مِنْ حَدِيثِ عَمْرِو بْنِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2637، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2637 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2637، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2637 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
