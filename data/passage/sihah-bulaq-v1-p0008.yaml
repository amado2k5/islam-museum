text: |-
  ٦٣٣
  أوكع يريدون اللفيم وأمة وكعاء أى حقاء واستوكمت معدنه أى اشتذت طبيعته والميكعة
  شكة الحرانة والمع ميكع وهى بالذارسية بزن ووكعت الهسة رب بابرتها أى ضريت ووكهته
  لحية وأنشدأبوعبيد احروة بن مرة الهذلى ورمى نيال مثل وكع الاسارد
  ووكعت الشااذا نهزت ضرعه اعند الحلب وبات الفصيل يكع أمه الديلة ومن كلامهم قالت
  العنزا-اب ودع فان لك ما تدع وقالت النهجرة احاب وكع فليس لك ماتدع أى انه-ز
  الضرع واحاب كل مافيه ووكيع اسم رجل ⁦(لÜاع)⁩ الولوع الاسم من ولعت به أولح ولعا
  دولوعا المصدر والاسم جيعا بالفتح وأواعته بالشى وأولع بهفه ومواح بديفتح اللام أى مة رى به
  والواع بالتسكين الكذب يقمال واح والع كماتقول عجب عاجب وقد ولع بالفتح واعا ووأعانا.
  أى كذب قال الشاعر وهنمن الاخ_لاف والولعان أى هن من أهل الاخلاف
  والوالع الكذاب وابهع واحة مثال فاسق وفسقة قال أبو يوسف بقاك مرفلان ف
  أدرى ما واءه أى ما أدرى ما-به وما أدرى ما والعته ؛هناه والمواع ك الماع الا أن
  التوابع استطالة الباق قال رؤية
  فيها خطوط من سوادوبلق • كانه فى الإلمديوليع ابهق
  قال أبو عبيدة قات رؤية اذا أردت الخطوط فقل كانها وان أردت السواد والبلق فة-ل
  كأنمماقال فكلح فى وجهى ثم قال أردت كان ذاك وتلك بوليع البهق. كاقال تعالى عوان
  بين ذلك قال الاصعى اذاكان فى الدابة ضروب من الالوان من غير بلق فذلك التوايع
  ويقال برذون مولع وينووليعة سمن كندة والواسح ااطاح مادام فى قيقائه ١
  صل الهاء بع لهبع القصيل الذى نتج فى آخر النتاج يقال ماله هبع ولا
  ربع والانتى هبعة وابمع هبعات وقال الاصمعى سألت جيرين-بيب لم حى الهبع هبعا قال
  لانَ الرباع تنتج فى ربعية النتاج أى فى أولد وينتج الهبع فى الصيفية فاذاماشى الرباع أبطرته
  ذرعه لانها أقوى منه فهبع أى استعان بعنه لى مشيته قال الشاع ريصف بعيرا
  غوج يبذ الذاملات الهبعا قال ولا يجمع هبع على هباع كما يجمع ربع على رباع وقد
  هبع الفصيل يهبع هبما اذا مد عنة، ويقال الحركاهاته-ع فى مشيتها أى تدعنها وقول
  الراجز يستهبح المواهق الهاذى أى يبطره ذرعه فيحمله على أن يهبع ( بلع
  الهلع مثال الدرهم الاكول قال جرير
  وضع الحز ير فقيل أين مجاشع • فشهاجدفله جراف هبلع
  ( بقع الهينقعة تعود الرحل على عرقوبيه قاع اعلى أطراف أصابعسه والهبنقع
  المزهوّ الاحق الذى يحب محادثة النساء واهبنة-ع الرجل اذا جاس الهبنقعة وهى
  جلسة الهبنقع قال الفرزدق
  ومهورنسوتهم اذا ما انكموا • غذوى كل هبنقمع تنبال
  مع) لهجوع النوم والتهجاع الذومة الخفيفة قال أبوقيس بن الاسلت
  قد حصت البيضة رأسى قا • أطم نوما غير تهجاع
  وهميع من الليل مثل حزيع وهمع القوم تهجيما أى نوموا ويقبال أتيت فلانا بعد هيعة
  ١٥٩
  صاح
  ( ١ عله وعاء الطلع المسخمى
  بالكافور والكفرّى أيضا وان لم
  يذكره هوولا القاموس فى ماذنه
  قاله رهر
