text: "مون ما حل بنا، والله لتسبيحة أو تسبيحتان أو ركعة أو ركعتان في صحيفة أحدنا أحب إليه من الدنيا وما فيها. فبادروا عباد الله بالتوبة، واعرفوا قدر ما أنتم فيه اليوم وما ستقدمون عليه غدا. لقد قال النبي ي يم"
