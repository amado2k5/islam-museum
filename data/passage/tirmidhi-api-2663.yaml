label: { ar: "جامع الترمذي 2663 — الأب والأبوة", en: "Jami' al-Tirmidhi 2663 — the father and fatherhood", ur: "جامع ترمذی 2663 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2663 — El padre y la paternidad" }
text: "… هَذَا حَدِيثٌ حَسَنٌ. وَرَوَى بَعْضُهُمْ عَنْ سُفْيَانَ عَنِ ابْنِ الْمُنْكَدِرِ عَنِ النَّبِيِّ مُرْسَلاً وَسَالِمٍ أَبِي النَّضْرِ عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي رَافِعٍ عَنْ أَبِيهِ عَنِ النَّبِيِّ. وَكَانَ ابْنُ عُيَيْنَةَ إِذَا رَوَى هَذَا الْحَدِيثَ عَلَى الاِنْفِرَادِ بَيَّنَ حَدِيثَ مُحَمَّدِ بْنِ الْمُنْكَدِرِ مِنْ حَدِيثِ سَالِمٍ أَبِي النَّضْرِ وَإِذَا جَمَعَهُمَا رَوَى هَكَذَا. وَأَبُو رَافِعٍ مَوْلَى النَّبِيِّ اسْمُهُ أَسْلَمُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2663، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2663 (Chapters on Knowledge), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2663، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2663 (Capítulos sobre el conocimiento), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
