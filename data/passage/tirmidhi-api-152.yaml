text: "… قَالُوا حَدَّثَنَا إِسْحَاقُ بْنُ يُوسُفَ الأَزْرَقُ، عَنْ سُفْيَانَ الثَّوْرِيِّ، عَنْ عَلْقَمَةَ بْنِ مَرْثَدٍ، عَنْ سُلَيْمَانَ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ أَتَى النَّبِيَّ رَجُلٌ فَسَأَلَهُ عَنْ مَوَاقِيتِ الصَّلاَةِ فَقَالَ \" أَقِمْ مَعَنَا إِنْ شَاءَ اللَّهُ \". فَأَمَرَ بِلاَلاً فَأَقَامَ حِينَ طَلَعَ الْفَجْرُ ثُمَّ أَمَرَهُ فَأَقَامَ حِينَ زَالَتِ الشَّمْسُ فَصَلَّى الظُّهْرَ ثُمَّ أَمَرَهُ فَأَقَامَ فَصَلَّى الْعَصْرَ وَالشَّمْسُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 152، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 152 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 152، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 152 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
