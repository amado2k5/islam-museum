text: "… الكلب الإنسي والذئب، وشذت طائفة فقالت: لا يقتل إلا الغراب الأبقع. وقال الشافعي: كل محرّم الأكل فهو معنيّ في الخمس. وعمدة الشافعي أنه إنما حرم على المحرم ما أحل للحلال، وأن المباحة الأكل لا يجوز قتلها بإجماع لنهي رسول اللّٰه …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 409، يذكر الحلال، وما أُحل، وما حُرّم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 409, that mentions the lawful, what was made lawful, what was made unlawful, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 409 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حرام کیا گیا، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
