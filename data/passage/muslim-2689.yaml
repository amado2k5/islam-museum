label:
  ar: "مسلم 2689 — ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم"
  en: "Muslim 2689 — Angels seek the gatherings of remembrance"
  ur: "مسلم 2689 — فرشتے ذکر کی مجلسیں تلاش کرتے ہیں"
text: "إن لله تبارك وتعالى ملائكة سيارة فضلا يتبعون مجالس الذكر فإذا وجدوا مجلسا فيه ذكر قعدوا معهم وحف بعضهم بعضا بأجنحتهم حتى يملئوا ما بينهم وبين السماء الدنيا فإذا تفرقوا عرجوا وصعدوا إلى السماء - قال - فيسألهم الله عز …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2689: ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2689: Angels seek the gatherings of remembrance. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2689: فرشتے ذکر کی مجلسیں تلاش کرتے ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
