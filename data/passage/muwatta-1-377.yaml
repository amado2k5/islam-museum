label: { ar: "الموطأ 377 — مالك: من صلى في القميص الواحد جعل على عاتقيه ثوباً أو عمامة", en: "Muwatta 377", es: "Muwatta 377", fr: "Muwatta 377", ur: "موطا 377", tr: "Al-Muwatta 377 — Malik: Tek gömlekle namaz kılan kimse omuzlarına bir giysi veya sarık örtmelidir.", id: "Al-Muwatta 377 — Malik: Barang siapa yang shalat hanya mengenakan sehelai baju, hendaklah ia mengenakan kain atau sorban di atas bahunya." }
summary:
  ar: "قول لمالك في باب الرخصة في الصلاة في الثوب الواحد: أحب إليه أن يجعل من يصلي في القميص الواحد على عاتقيه ثوباً أو عمامة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.204}"
  tr: "Malik, tek giysiyle namaz kılma izni konusunda şöyle demiştir: Tek gömlekle namaz kılanın omuzlarına bir giysi veya sarık örtmesini tercih ederdi. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.204}"
  id: "Malik berkata, mengenai keringanan shalat dengan satu pakaian: Beliau lebih menyukai orang yang shalat dengan satu baju hendaknya meletakkan kain atau sorban di pundaknya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.204}"
