text: "… رحط من قريش فوالله ماعامت مكة امرأة ولا رجلاً إلا وقد حماني بضاعة، وكان وجه متجرنا من الشام غزة من أرض فلسطين، فرجنا حتى قدمناها حين ظهر قيصر صاحب الروم على من كان في بلاده من الفرس وأخرجهم منها ورد …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 396، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
