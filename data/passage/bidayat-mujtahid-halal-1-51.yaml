text: "… سَيِّدِنَا مُحَمَّدٍ وَآلِهِ وَصَحْبِهِ، وَسَلَّمَ تَسْلِيمًا كَثِيرًا ب و في معصية اللّٰه مل، حلَّ له ما حرم عليه مما نصف إن شاء اللّٰه تعالى. ومن خرج عاصيًا لم يحل له شيء مما حرم اللّٰه لك عليه بحالٍ، لأنَّ اللّٰه تبارك …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 51، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
