label: { ar: "صحيح البخاري 1641 — ما لا يحل", en: "Sahih al-Bukhari 1641 — what is not lawful", ur: "صحیح بخاری 1641 — جو حلال نہیں", es: "Sahih al-Bukhari 1641 — lo que no es lícito", fr: "Sahih al-Bukhari 1641 — ce qui n'est pas licite", tr: "Sahih el-Buhari 1641 — İzin verilmeyen şeyler", id: "Sahih al-Bukhari 1641 — Apa yang tidak diperbolehkan" }
text: "… وَهَذَا ابْنُ عُمَرَ عِنْدَهُمْ فَلاَ يَسْأَلُونَهُ، وَلاَ أَحَدٌ مِمَّنْ مَضَى، مَا كَانُوا يَبْدَءُونَ بِشَىْءٍ حَتَّى يَضَعُوا أَقْدَامَهُمْ مِنَ الطَّوَافِ بِالْبَيْتِ، ثُمَّ لاَ يَحِلُّونَ، وَقَدْ رَأَيْتُ أُمِّي وَخَالَتِي، حِينَ تَقْدَمَانِ لاَ تَبْتَدِئَانِ بِشَىْءٍ أَوَّلَ مِنَ الْبَيْتِ، تَطُوفَانِ بِهِ، ثُمَّ لاَ تَحِلاَّنِ. وَقَدْ أَخْبَرَتْنِي أُمِّي، أَنَّهَا أَهَلَّتْ هِيَ وَأُخْتُهَا وَالزُّبَيْرُ وَفُلاَنٌ وَفُلاَنٌ بِعُمْرَةٍ، فَلَمَّا مَسَحُوا الرُّكْنَ حَلُّوا."
summary:
  ar: "حديث في صحيح البخاري، رقم 1641، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1641, that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1641، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1641, menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1641, mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 1641 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1641, menyebutkan apa yang dilarang. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
