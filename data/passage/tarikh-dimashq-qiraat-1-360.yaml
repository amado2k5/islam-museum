text: "… وسلمان الفارسى وتميم الدارى وفى رواية ابى بن كعب وزيد بن ثابث وعثمان وتقيم واخرج ابن سعد ان رسول اللّٰه قبض ولم يجمع القرآن من اصحابه الا اربمة نفر كلهم من الانصار. والخامس يختلف فيه فالنفر الذين جمعوه من الانصار …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 360، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
