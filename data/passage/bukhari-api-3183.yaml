label: { ar: "صحيح البخاري 3183 — الأب والأبوة", en: "Sahih al-Bukhari 3183 — the father and fatherhood", ur: "صحیح بخاری 3183 — باپ اور والدیت", es: "Sahih al-Bukhari 3183 — El padre y la paternidad" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا حَاتِمٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ أَسْمَاءَ ابْنَةِ أَبِي بَكْرٍما ـ قَالَتْ قَدِمَتْ عَلَىَّ أُمِّي وَهْىَ مُشْرِكَةٌ فِي عَهْدِ قُرَيْشٍ، إِذْ عَاهَدُوا رَسُولَ اللَّهِ وَمُدَّتِهِمْ، مَعَ أَبِيهَا، فَاسْتَفْتَتْ رَسُولَ اللَّهِ فَقَالَتْ يَا رَسُولَ اللَّهِ، إِنَّ أُمِّي قَدِمَتْ عَلَىَّ، وَهْىَ رَاغِبَةٌ، أَفَأَصِلُهَا قَالَ \" نَعَمْ، صِلِيهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3183، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3183 (Jizyah and Mawaada'ah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3183، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3183 (Jizyah y Mawaada'ah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
