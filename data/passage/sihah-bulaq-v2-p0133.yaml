text: |-
  ٤٥٤
  *⁦(فصل الثاء)⁩*
  والثفيان بالضم الذى يكون دون السيد فى المرتبة والجمع ثذية قال الاعشى
  طويل البدين رهمله غيرثنية • أشم كريم جاره لايرهق
  وفلان ثنية أهل بيته أى أرذلهم والننى والثى بضم الشاءوكسرها مشل الثنيان
  قال أوس بن مغرا؟
  ترى ثنانا اذا ماجا بدؤهم * وبدؤهم ان أتانا كان تنيانا
  ورواه اليزيدى تذياننا ان أتاهم والثنية واحدة الثنايا من السنّ والثنية طريق العقبة ومنه
  قولهم فلان طلاع الثنايا اذا كان سامي المعالى الامود كما يقال طلاع أنجد والذنىّ الذى يلق
  تفيته ويكون ذلا فى الظلف والحافر فى السنة الثالثة وفى الخف فى السنة السادسة
  والجمع ثفيان وثناء والانى ثقية والجمع ثنيات واثنان من عدد المذكروائنتان للمؤنت وفى
  المؤنث لغة أخرى فتان بحذف الااف ولوجاز أن يفرداكان واحده اثنا واثنة مثل ابن وابنة
  وألفه ألف وصل وقد قطعها الشاعر على التوهم فقال
  ألالا أرى إثنين أحسن شيمة * على حدثأن الدهرمو ومن جل
  وقال قيس بن انحطيم
  اذاجاوز الاثنين سرّفانه • بنت وتكثير الوشاة قين
  ويوم الاثنين لا يثى ولا يجمع لانه مثنى فان أحيدت أن تجمعه كأنه صفة للواحدقات أثانين
  وقولهم هذا ثانى اثنين أى هو أحد الاثنين وكذلك ثالث ثلاثة مضاف الى العشرة ولا ينون
  فان اختلقا فأنت بالمماران شئت أضفت وان شئت تونت وقلت هذا ثانى واحدوثان
  أواحدا المعنى هذائنى واحدا وكذلك ثالث اثنين وثالث اثنين على مافسرناه فى باب الثاء
  والعدد منصوب ما بين أحدعشر الى تسعة عشر فى الرفع والنصب والخفض الاائى عشر
  فائك تعربه عسلى هجاءين وتقول للمؤنث ائذنان وان شذت ثذتان لان الالف انما اجتلبت
  ل_ كون القاء فلما تحركت سقطت ولوسمى رجل باثنين أوبائني عشراقلت فى النسبة اليه ثنوى
  فى قول من قال فى ابنبنوى واثىّ فى قول من قال ابى" وأماقول الراجز
  كأن خصيبه من التدلدل • ظرف عجوز فيه تنتا حفظل
  فأراد أن يقول فيه حتظلتان فلم يمكنه فأخرج الاثنين فخرج سائر الاعداد للضرورة
  وأضافه الى مايعده وأ رادثدتان من حتظل كما يقال ثلاثة درأهم وأربعة دراهم وكان حقه فى
  الاصل أن يقال اثنا دراهم واثنتانسوة الاأنه-م اقتصروا بقواه-م درهمان وامر أتان عن
  واضافتهما الى ما بعدهما وانثنى أى انعطف وكدلك اثنون على افه وعل وأثنى عليه خير
  والاسم الثناء وأننى أى ألقى تنيته وتننى فى مشيته تأود والمثانى من القرآن ما كان اقل من
  الماتتين وتسمى فاتحة الكتاب مثانى لانها تثنى فى كل ركعة ويسمى جميع القرآن مثانى أيضا
  لا قتران آية الرحسة باية العذاب ⁦(نوى)⁩ نوى بالمكان أقام به يثوى ثواء ونويا مثل مضى
  عمضى مضاءومضيا يقال ثويت البصرة وثوين بالبصرة وأنويت بالمكان لغة فى ئويت قال
  الاعشى
  أثوى وقصرليله يزودا • فضت وأخلف من قتيلة موعدا
  وأثويت غيرى يتعدّى ولا يتعدّى وثوّيت غيرى تثوية والثوىّ على فعيل الضيف وأيو مثوى
  الرجل
