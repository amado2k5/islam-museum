  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 1, p. 232, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 1، ص 232 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
