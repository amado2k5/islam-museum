text: "… اليدمن قليل من إلمال فى حال التعجب، ثم قد يندم بعد زوال التعجب ولا ينفع الندم. وذلك قد يكون التمسخر والمحاكاة والشعبذة والأفعال المضحكة، وقد يكون بالإشعار الغريبة والكلام المنثور المسجع مع حسن الصوت. والشعر الموزون أشدّ تأثيرا فى النفس …"
summary:
