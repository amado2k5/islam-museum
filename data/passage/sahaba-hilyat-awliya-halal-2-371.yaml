  fr: "Extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 2, page 371, mentionnant le licite et l'illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Halal and Haram Browser."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 2. cildinin 371. sayfasından, helal ve haram olanı belirten bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
