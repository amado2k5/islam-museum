text: "… اللّٰه بن أحمد قال حدثف أبو كامل فضيل بن الحسبين الجحدرى قال ثنا جعفر بن سليمان، قال سمعت مالك بن دينار يقول : لئن أتصدق بتمرة حلال أحب إلى من أن أتصدق بمائة أاف حرام حدثنا أبو بكر بن مالك …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 371، يذكر الحلال، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 371, that mentions the lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 371 کا اقتباس جس میں حلال، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
