text: "… طاعتهم، وتتألَّف على محبتهم، فهذا كله واجبٌ علينا علمه، والعمل به، ومن كمال ديننا طلبه. - وأما ما يجب علينا تركه، وفرض علينا الإمساك عنه، وحرامٌ علينا الفحص والتنقير عنه: هو النظر فيما شَجَرَ بينهم، والخُلف الذي كان جرى منهم؛ …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 3، ص 598، يرد فيه ذكر ما فُرض على الناس، والفرض، والواجب، وما يجب على المكلف، والحرام، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 3, p. 598, whose wording mentions what was made obligatory on people, the obligatory (fard), the obligatory (wajib), what is binding on the person addressed, the forbidden (haram), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 3، ص 598 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، واجب، جو مکلف پر واجب ہے، حرام، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volume numérisé 3, p. 598, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligatoire (wajib), ce qui s'impose à la personne responsable, l'interdit (haram), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volumen digitalizado 3, p. 598, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo obligatorio (wajib), lo que obliga a la persona responsable, lo prohibido (haram), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 3, s. 598) adlı eserinden, insanların üzerine farz olan şeyleri, \"zorunluluk\", \"görev\", \"sorumlu kişiden istenen\", \"yasak\" ve \"itaat\" terimlerini ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir, taranmış bir versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, yasak olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Iman, Jilid 3 Bergambar, hlm. 598, yang membahas tentang apa yang wajib dilakukan oleh manusia, istilah-istilah \"kewajiban,\" \"tugas,\" \"apa yang dituntut dari orang yang bertanggung jawab,\" \"haram,\" dan \"ketaatan.\" Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
