label: { ar: "جامع الترمذي 2790 — الأب والأبوة", en: "Jami' al-Tirmidhi 2790 — the father and fatherhood", ur: "جامع ترمذی 2790 — باپ اور والدیت" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا ابْنُ أَبِي فُدَيْكٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُسْلِمٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثٌ لاَ تُرَدُّ الْوَسَائِدُ وَالدُّهْنُ وَاللَّبَنُ \". الدُّهْنُ يَعْنِي بِهِ الطِّيبَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ وَعَبْدُ اللَّهِ هُوَ ابْنُ مُسْلِمِ بْنِ جُنْدَبٍ وَهُوَ مَدَنِيٌّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2790، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2790 (Chapters on Manners), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2790، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
