label: { ar: "جامع الترمذي 2359 — الأب والأبوة", en: "Jami' al-Tirmidhi 2359 — the father and fatherhood", ur: "جامع ترمذی 2359 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2359 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 2359 — le père et la paternité", tr: "Cami' el-Tirmizi 2359 — Baba ve Babalık", id: "Jami' al-Tirmidhi 2359 — Ayah dan Peran Ayah" }
text: "… حَرِيزُ بْنُ عُثْمَانَ، عَنْ سُلَيْمِ بْنِ عَامِرٍ، قَالَ سَمِعْتُ أَبَا أُمَامَةَ، يَقُولُ مَا كَانَ يَفْضُلُ عَنْ أَهْلِ، بَيْتِ النَّبِيِّ خُبْزُ الشَّعِيرِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ. وَيَحْيَى بْنُ أَبِي بُكَيْرٍ هَذَا كُوفِيٌّ وَأَبُو بُكَيْرٍ وَالِدُ يَحْيَى رَوَى لَهُ سُفْيَانُ الثَّوْرِيُّ وَيَحْيَى بْنُ عَبْدِ اللَّهِ بْنِ بُكَيْرٍ مِصْرِيٌّ صَاحِبُ اللَّيْثِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2359، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2359 (Chapters On Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2359، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2359 (Capítulos sobre el Zuhd), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2359 (Chapitres sur le Zuhd), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de 2359 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2359, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
