text: "سبعَ أَرَضين، في كلِّ أرضٍ نبيٌّ كنبيّكم، وآدمُ كآدم، ونوحٌ كنوح، وإبراهيمُ كإبراهيم، وعيسى كعيسى. قال البيهقيُّ : إسنادُ هذا عن ابن عباس صحيحٌ، وهو شاذٍّ بمرَّة، لا أعلمُ لأبي الضُّحى عليه متابعاً"
summary:
  ar: "عند تفسير خلق الأرضين السبع يورد القرطبي عن ابن عباس أن في كل أرض نبياً كنبيكم، وينقل قول البيهقي إن إسناده إلى ابن عباس صحيح لكنه شاذ بمرة لا متابع لأبي الضحى عليه، ويضيف أن الآثار بكون الأرضين سبعاً كثيرة."
  en: "Commenting on the creation of the seven earths, al-Qurtubi gives Ibn Abbas's report that each earth has a prophet like ours, and quotes al-Bayhaqi that the chain to Ibn Abbas is sound but entirely anomalous, with no corroboration for Abu al-Duha. He adds that the reports that the earths are seven are many."
  es: "Al comentar sobre la creación de las siete tierras, al-Qurtubi cita el relato de Ibn Abbas según el cual cada tierra tiene un profeta como el nuestro, y cita a al-Bayhaqi, quien afirma que la cadena de transmisión hasta Ibn Abbas es sólida pero completamente anómala, sin corroboración alguna para Abu al-Duha. Añade que existen numerosos relatos que afirman que las tierras son siete."
  fr: "À propos de la création des sept terres, al-Qurtubi rapporte le hadith d'Ibn Abbas selon lequel chaque terre possède un prophète semblable au nôtre, et cite al-Bayhaqi affirmant que la chaîne de transmission jusqu'à Ibn Abbas est authentique mais totalement erronée, sans aucune corroboration pour Abu al-Duha. Il ajoute que les récits faisant état de sept terres sont nombreux."
  ur: "سات زمینوں کی تخلیق پر تبصرہ کرتے ہوئے، القرطبی نے ابن عباس کی رپورٹ دی ہے کہ ہر زمین میں ہمارے جیسا نبی ہوتا ہے، اور بیہقی کا حوالہ دیتے ہیں کہ ابن عباس کا سلسلہ صحیح لیکن مکمل طور پر غیر متضاد ہے، جس میں ابو الضحیٰ کی کوئی تصدیق نہیں ہے۔ انہوں نے مزید کہا کہ رپورٹس کہ زمینیں سات ہیں بہت سی ہیں۔"
  tr: "Yedi yeryüzünün yaratılışını yorumlarken, El-Kurtubi, İbn Abbas'ın her yeryüzünde senin peygamberin gibi bir peygamber olduğunu söylediğini aktarır ve El-Beyhakî'nin de İbn Abbas'a kadar olan rivayet zincirinin doğru olduğunu, ancak çok garip olduğunu ve Ebu el-Duha'dan sonra bu konuda kimsenin gelmediğini söylediğini aktarır; ayrıca yeryüzünün yedi olduğuna dair birçok rivayet bulunduğunu ekler."
  id: "Ketika menafsirkan penciptaan tujuh bumi, Al-Qurtubi mengutip Ibnu Abbas yang mengatakan bahwa di setiap bumi terdapat seorang nabi seperti nabimu, dan ia mengutip Al-Bayhaqi yang mengatakan bahwa sanadnya kepada Ibnu Abbas benar, tetapi sangat aneh, dan tidak ada yang mengikuti Abu Al-Duha dalam hal itu, dan ia menambahkan bahwa ada banyak riwayat tentang bumi yang berjumlah tujuh."
