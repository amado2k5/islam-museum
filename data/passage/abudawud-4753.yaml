label:
  ar: "أبو داود 4753 — سؤال القبر: أن قد صدق عبدي فأفرشوه من الجنة"
  en: "Abu Dawud 4753 — The questioning in the grave: My servant has spoken truly"
  ur: "ابو داود 4753 — قبر کا سوال: میرے بندے نے سچ کہا، اسے جنت کا بچھونا دو"
text: "استعيذوا بالله من عذاب القبر . مرتين أو ثلاثا - زاد في حديث جرير ها هنا - وقال : وإنه ليسمع خفق نعالهم إذا ولوا مدبرين حين يقال له : يا هذا من ربك وما دينك ومن نبيك . قال …"
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 4753: سؤال القبر: أن قد صدق عبدي فأفرشوه من الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 4753: The questioning in the grave: My servant has spoken truly. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 4753: قبر کا سوال: میرے بندے نے سچ کہا، اسے جنت کا بچھونا دو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
