text: "… خمسين سنة كان أشد تمسكاً بأثر النبي ويلِخِ من محمد بن أسلم. قال أبو عبد اللّه: وكتب إلي أحمد بن نصر: أن اكتب إليّ بحال محمد بن أسلم؛ فإنه ركن من أركان الإسلام. قال أبو عبد الله: وقال لي محمد …"
