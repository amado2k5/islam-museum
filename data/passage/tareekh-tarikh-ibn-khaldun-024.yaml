text: "يد فتقضي الحاجات وقد دفعت مؤونة هو الآليق من الأقوال، ورأيت في كتاب (التكملة)) لابن الأبار المباشرة لها ويطلع بها على العلوم والمعارف وصحف الأولين وما عند التعريف بابن فروخ القيرواني الفاسي الأندلسي من أصحاب والمنافع. وخروجها في الإنسان من"
