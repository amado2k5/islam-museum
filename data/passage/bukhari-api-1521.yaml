label: { ar: "صحيح البخاري 1521 — مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 1521 — forgiveness of past sins", ur: "صحیح بخاری 1521 — پچھلے گناہوں کی مغفرت", es: "Sahih al-Bukhari 1521 — perdón de los pecados pasados", fr: "Sahih al-Bukhari 1521 — pardon des péchés passés", tr: "Sahih el-Buhari 1521 — Geçmiş günahların affı", id: "Sahih al-Bukhari 1521 — Pengampunan dosa masa lalu" }
text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا سَيَّارٌ أَبُو الْحَكَمِ، قَالَ سَمِعْتُ أَبَا حَازِمٍ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ ـ قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ \" مَنْ حَجَّ لِلَّهِ فَلَمْ يَرْفُثْ وَلَمْ يَفْسُقْ رَجَعَ كَيَوْمِ وَلَدَتْهُ أُمُّهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1521، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1521 (Hajj (Pilgrimage)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1521، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1521 (Hajj (Peregrinación)), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 1521 (Hajj (Pèlerinage)), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sahih el-Buhari'de 1521 numaralı hadis, geçmiş günahların affedilmesinden bahseder. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1521, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
