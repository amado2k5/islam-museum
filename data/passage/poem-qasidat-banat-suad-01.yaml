text: بانت سعاد فقلبي اليوم متبول
summary:
  ar: مطلع قصيدة كعب بن زهير، ذكره ابن هشام في الرواية عن ابن جدعان في إنشاد كعب بين يدي النبي بالمسجد {{cite:ibn-hisham-wustenfeld-1858 p.892}}.
  en: Opening hemistich of Ka'b ibn Zuhayr's ode, quoted by Ibn Hisham in the report of Ka'b reciting it before the Prophet in the mosque.
  es: "Hemistiquio inicial de la oda de Ka'b ibn Zuhayr, citado por Ibn Hisham en el relato de Ka'b recitándola ante el Profeta en la mezquita."
  fr: "Hémistique d'ouverture de l'ode de Ka'b ibn Zuhayr, citée par Ibn Hisham dans le récit de Ka'b la récitant devant le Prophète dans la mosquée."
  ur: "کعب بن زہیر کے اوڈ کا افتتاحی خط، جسے ابن ہشام نے کعب کے مسجد میں نبی کے سامنے تلاوت کرنے کی رپورٹ میں نقل کیا ہے۔"
  tr: "İbn Hişam'ın İbn Ced'an'dan rivayet ettiği, Ka'b ibn Zuhair'in şiirinin başlangıcı; Ka'b'ın mescitte Peygamber huzurunda yaptığı okumayla ilgili. {{cite:ibn-hisham-wustenfeld-1858 s.892}}"
  id: "Pembukaan puisi Ka’b ibn Zuhair, yang disebutkan oleh Ibn Hisham dalam riwayat dari Ibn Jad’an, mengenai bacaan Ka’b di hadapan Nabi di masjid {{cite:ibn-hisham-wustenfeld-1858 p.892}}."
translations:
  en:
    text: Su'ad has gone, and my heart today is sick with love.
