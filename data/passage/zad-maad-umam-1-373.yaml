  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 1. cildinin 373. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Müslüman olmayan milletler, dinler, mezhepler ve halklar için tarayıcı tarafından derlenmiştir."
