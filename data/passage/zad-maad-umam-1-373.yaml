text: "فغزوة بني قينقاع عقب بدر، وغزوة بني النضير لم يفترِقِ الحالُ بين عقد الهُدنة وعقد الذمة في عقب غزوة أحد، وغزوة بني قُريظة عقب الخندق البخاري:، ومسلم:. وأما يهود خيبر، فسيأتي ذكر قصتهم إن شاء اللَّه تعالى. فصل حكم من …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 373، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
