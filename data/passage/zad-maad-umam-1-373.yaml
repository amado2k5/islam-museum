text: "فغزوة بني قينقاع عقب بدر، وغزوة بني النضير لم يفترِقِ الحالُ بين عقد الهُدنة وعقد الذمة في عقب غزوة أحد، وغزوة بني قُريظة عقب الخندق البخاري:، ومسلم:. وأما يهود خيبر، فسيأتي ذكر قصتهم إن شاء اللَّه تعالى. فصل حكم من …"
summary:
