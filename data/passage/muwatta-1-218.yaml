label: { ar: "الموطأ 218 — أبو بكر يقرأ البقرة في ركعتي الصبح", en: "Muwatta 218" }
summary:
  ar: "أول أثر في باب القراءة في الصبح. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه أن أبا بكر الصديق صلى الصبح فقرأ فيها بسورة البقرة في الركعتين كلتيهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرجه عن هشام بالإسناد والمتن نفسه. {cite:muwatta-maruf-1997 p.133}"
