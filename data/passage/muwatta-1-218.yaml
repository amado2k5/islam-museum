label: { ar: "الموطأ 218 — أبو بكر يقرأ البقرة في ركعتي الصبح", en: "Muwatta 218", es: "Muwatta 218", fr: "Muwatta 218", ur: "موطا 218", tr: "Muvatta 218 — Ebubekir sabah namazının iki rekatında Bakara suresini okuyor", id: "Al-Muwatta 218 — Abu Bakar membaca Surat Al-Baqarah dalam dua rakaat shalat Subuh" }
summary:
  ar: "أول أثر في باب القراءة في الصبح. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه أن أبا بكر الصديق صلى الصبح فقرأ فيها بسورة البقرة في الركعتين كلتيهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرجه عن هشام بالإسناد والمتن نفسه. {cite:muwatta-maruf-1997 p.133}"
  tr: "Sabah namazında okunan sureyle ilgili ilk rivayet, Yahya'nın Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayet ettiğine göre, Ebu Bekir es-Siddik'in sabah namazını kıldığı ve her iki rekatta da Bakara Suresi'ni okuduğudur. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Şafiî ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Beyhaki'nin de bunu kaydettiğini ve Abdül-Razzak'ın da aynı rivayet zinciri ve metinle Hişam'dan naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.133}"
  id: "Riwayat pertama mengenai bacaan dalam salat subuh. Diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya, bahwa Abu Bakr al-Siddiq melaksanakan salat subuh dan membaca Surah al-Baqarah di kedua rakaat. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, al-Shafi'i, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi, dan bahwa Abd al-Razzaq meriwayatkannya dari Hisham dengan sanad dan teks yang sama. {cite:muwatta-maruf-1997 p.133}"
