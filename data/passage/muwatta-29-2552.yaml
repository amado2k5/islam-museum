label: { ar: "الموطأ 2552 — سعيد بن المسيب: عمر يقتل خمسة أو سبعة برجل قتلوه غيلة", en: "Muwatta 2552", es: "Muwatta 2552", fr: "Muwatta 2552", ur: "موطا 2552", tr: "El-Muvatta 2552 — Sa'id ibn el-Musayyab: Ömer, haince öldürdükleri bir adam için beş ya da yedi adamı öldürdü.", id: "Al-Muwatta 2552 — Sa’id ibn al-Musayyab: Umar membunuh lima atau tujuh orang sebagai ganti seorang pria yang telah mereka bunuh secara khianat." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سعيد بن المسيب أن عمر بن الخطاب قتل نفرا، خمسة أو سبعة، برجل واحد قتلوه قتل غيلة، وقال عمر: لو تمالأ عليه أهل صنعاء لقتلتهم جميعا. {cite:muwatta-maruf-1997 p.443} {cite:muwatta-maruf-1997 p.444}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet eder ki, Ömer ibn al-Khattab, öldürdükleri bir adamın ihaneti yüzünden beş veya yedi kişiyi idam ettirmiştir. Ömer şöyle demiştir: \"Eğer Sana'nın bütün halkı ona karşı komplo kurmuş olsaydı, hepsini idam ederdim.\" {cite:muwatta-maruf-1997 s.443} {cite:muwatta-maruf-1997 s.444}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa Umar ibn al-Khattab mengeksekusi lima atau tujuh orang karena pengkhianatan seorang pria yang telah mereka bunuh. Umar berkata: \"Seandainya seluruh penduduk Sana'a bersekongkol melawannya, aku akan mengeksekusi mereka semua.\" {cite:muwatta-maruf-1997 p.443} {cite:muwatta-maruf-1997 p.444}"
