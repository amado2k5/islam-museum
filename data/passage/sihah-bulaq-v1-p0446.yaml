text: |-
  ⁦(فصل الميم)⁩
  ١٩٥
  مصوحاذهب وانقطع وقال
  قد كاد من طول البلى أن يصحا ومصح الثوب اخلق
  ودرس ومصح ابن الفاقة أى ولى وذهب ومصح النيات أى ولى لون زهره ومصح الظل أى
  قصر ومصحت بالشئء ذهبت به ⁦( مضح)⁩ الاموى مضح فلان عرضه وأمضحه أى شانه
  وأنشد الفرزدق
  وأمضحت عرضى فى الحياة وشنتى • وأوقدت لى نارابكل مكان
  وأنشد أبوح روقى مضح
  لا تخدن عرضي فانى ماضح • عرضك ان شاتمنى وقادح
  ( ملح الملح معروف والملح أيضا الرضاع وأنشد الاصعمى لابى العاحسان وكانت له ابل فق
  قوما من ألبسانها نم انهم آغار واعليها فأخذوها فقبال
  وانى لأرجو لحها فى بعاونكم • ومابسطت من جلد أشعث أغبرا
  والملح بالفتح مصدرة ولك ملح: الفلان ملها أرضعناه وملهت القدرأ ملها ملها اذاطرحت فيها
  من الملح يقد روأ ملحت القدراذاا كثرت فيها الملح حتى فدت والتمليح مثله وملحت الماشية
  ملما أطعمتها سبجّة الملح وذلك اذا لم تقدر على الحض فأطعمتها ه ذامكانه وملح المايلح ملوحا
  وكذلك ملح بالضم ماوحة فه وماء ملح ولاية ال مالح الافى لغسة ردية وأملحت الابل وردت ماء
  ملها والمملحة ما يجعل فيه الملح ابن السكيت يقال ذبت ملح ومالح الحمض وملح الشىء بالضم علح
  ملوحة وملاحة أى حسن فهو ليم وملاح بالضم مخفف واستمط، عدء مليها رجع المليح
  ملاح وأملاح ءن أبى عمرومثل شر يف وأشرف وقليب مليح أى ماؤه ملح قال عنترة يصف
  كأن مؤشر العضدين حجلا * هدوجابين أقلبة ملاح
  وسعك ملبح ومملوح ولا يقال مالح وأماقول عذافر
  بصرية تزوّجت بصريا • يطعمها المالح والطريا
  فليس بحجة الاموى «لحت الجزور -عنت قليلا قال عروة بن الورد .
  أقنابها حينا وأ كثر زادنا • بقية لحم من جزور علح
  ويقال أيضاملح الشاعر اذا أتى بشئ مليح وية ولون ما أميلح زيداولم يصغروا من الفعل
  غيره وغيرة ولهم ما أحيسنه قال الشاءر
  ياما أميلح غزلا ناعطون لنا • من هؤليا بين الضال وألسفر
  والمعالمة المؤاكلة والرضاع أيضا والملح بالتحريك ورم فى عرقوب الفرس دون الجرذفان اشتد
  فهو الجرذ والملهة بالضم واحدة الملح من الاحاديث قال الاصمى ئلت بالملح والملهة أيضامن
  الالوان بياض يخالطه سواد يقال كبش أملح وتيس أملح اذا كان شعره خليسا قال
  أبوذ بيان بن الرعبل أيغض الشبوخ الى الاقلح الاملح الحسوالفسوّرقد املح الكبسْ املماحا
  صار أً ملح ويقال لبعض شهور الشتاءملان ابياض ثلجه والزرقة اذا اشتدت حتى تضرب
  الى البياض قيل هو أملح العين ومنه كتيبة ملحماء وقال حيان بن ربيعة الطائى
  وإنا نضرب الملجاءحتى * تولى والسيوف لهاشهود
  وقال الراعى يصف ابلا
