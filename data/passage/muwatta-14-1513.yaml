label: { ar: "الموطأ 1513 — مالك: إن كانت له امرأة غير التي تزوج، فإنه يقسم بينهما بعد أن تمضي أيام التي تزوج بالسواء، ولا يحسب على التي تزوج ما أقام عندها", en: "Muwatta 1513", es: "Muwatta 1513", fr: "Muwatta 1513", ur: "موطا 1513", tr: "El-Muvatta 1513 — Malik: Eğer evlendiği eşinden başka bir eşi varsa, evlendiği eşinin günleri geçtikten sonra zamanını ikisi arasında eşit olarak paylaştırmalıdır ve evlendiği eşiyle geçirdiği zaman aleyhine sayılmamalıdır.", id: "Al-Muwatta 1513 — Malik: Jika ia mempunyai istri selain istri yang dinikahinya, maka ia harus membagi waktunya secara merata antara kedua istri tersebut setelah masa hidup istri yang dinikahinya berlalu, dan waktu yang dihabiskannya bersama istri yang dinikahinya tidak boleh dihitung sebagai bagian dari perhitungan waktunya." }
summary:
  ar: "يقول مالك فإن كانت له امرأة غير التي تزوج، فإنه يقسم بينهما بعد أن تمضي أيام التي تزوج بالسواء، ولا يحسب على التي تزوج ما أقام عندها. {cite:muwatta-maruf-1997 p.35}"
  tr: "Malik şöyle der: Eğer evlendiği eşinden başka bir eşi varsa, evlendiği eşiyle geçirdiği günler bittikten sonra zamanını ikisi arasında eşit olarak paylaştırmalıdır ve evlendiği eşiyle geçirdiği zaman aleyhine sayılmamalıdır. {cite:muwatta-maruf-1997 s.35}"
  id: "Malik berkata: Jika ia mempunyai istri selain istri yang dinikahinya, maka ia harus membagi waktunya secara merata di antara mereka setelah masa tinggal bersama istri yang dinikahinya berlalu, dan waktu yang dihabiskannya bersama istri yang dinikahinya tidak boleh dihitung sebagai kekurangan baginya. {cite:muwatta-maruf-1997 p.35}"
