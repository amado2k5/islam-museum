label: { ar: "الموطأ 1225 — عمر بن الخطاب: من رمى الجمرة فقد حل له ما حرم على الحاج إلا النساء والطيب حتى يطوف بالبيت", en: "Muwatta 1225" }
summary:
  ar: "يروي مالك عن نافع وعبد الله بن دينار عن عبد الله بن عمر أن عمر بن الخطاب خطب الناس بعرفة وعلمهم أمر الحج، وقال فيما قال إذا جئتم منى فمن رمى الجمرة فقد حل له ما حرم على الحاج، إلا النساء والطيب، حتى يطوف بالبيت. {cite:muwatta-maruf-1997 p.547}"
