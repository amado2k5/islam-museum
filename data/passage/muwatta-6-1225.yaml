label: { ar: "الموطأ 1225 — عمر بن الخطاب: من رمى الجمرة فقد حل له ما حرم على الحاج إلا النساء والطيب حتى يطوف بالبيت", en: "Muwatta 1225", es: "Muwatta 1225", fr: "Muwatta 1225", ur: "موطا 1225", tr: "El-Muvatta 1225 — Ömer ibn el-Hattab: Cemarat'a taş atan kimseye, kadınlar ve güzel kokular hariç, hacı için haram olan her şey, Kâbe'yi tavaf edene kadar helal sayılır.", id: "Al-Muwatta 1225 — Umar ibn al-Khattab: Barangsiapa melempar kerikil ke Jamarat, maka diperbolehkan melakukan apa yang diharamkan bagi jamaah haji, kecuali wanita dan parfum, hingga ia melakukan tawaf di Ka'bah." }
summary:
  ar: "يروي مالك عن نافع وعبد الله بن دينار عن عبد الله بن عمر أن عمر بن الخطاب خطب الناس بعرفة وعلمهم أمر الحج، وقال فيما قال إذا جئتم منى فمن رمى الجمرة فقد حل له ما حرم على الحاج، إلا النساء والطيب، حتى يطوف بالبيت. {cite:muwatta-maruf-1997 p.547}"
  tr: "Malik, Nafi'den ve Abdullah ibn Dinar da Abdullah ibn Umar'dan rivayetle, Ömer ibn el-Hattab'ın Arafat'ta halka hitap ederek Hac hakkında bilgi verdiğini anlatır. Söylediklerinden biri de şuydu: \"Mina'ya vardığınızda, Cemarat'a taş atan kişiye, kadınlar ve güzel kokular hariç, hacı için haram olan her şey helaldir; ta ki Kâbe'nin etrafında tavaf edene kadar.\" {cite:muwatta-maruf-1997 s.547}"
  id: "Malik meriwayatkan dari Nafi' dan Abdullah ibn Dinar dari Abdullah ibn Umar bahwa Umar ibn al-Khattab berpidato di Arafat dan mengajarkan mereka tentang ibadah haji. Di antara apa yang beliau katakan adalah, \"Ketika kalian sampai di Mina, siapa pun yang melempar batu ke Jamarat maka diperbolehkan melakukan apa yang diharamkan bagi jamaah haji, kecuali wanita dan parfum, hingga ia melakukan Tawaf mengelilingi Ka'bah.\" {cite:muwatta-maruf-1997 p.547}"
