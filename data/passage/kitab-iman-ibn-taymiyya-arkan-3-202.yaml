text: "… الزاني حين يزني وهو مؤمن وقال: لا يؤمن أحدكم حتى يحب لأخيه من الخير ما يحب لنفسه وقال: لا يؤمن من لا يأمن جاره بوائقه وأقسم على ذلك مرات وقال: المؤمن من أمنه الناس على دمائهم وأموالهم. والمعتزلة ينفون عنه …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 3، ص 202، يذكر ما لا يتم الإيمان إلا به، وما يرتفع معه الإيمان حين الفعل، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 3, p. 202, that mentions what faith is not complete without, what faith is lifted by at the moment of the act, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 3، ص 202 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، وہ عمل جس کے وقت ایمان اٹھ جاتا ہے، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 3, pág. 202, que menciona lo que no está completo sin la fe, lo que fortalece la fe en el momento del acto y una descripción del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 3, p. 202): ce passage mentionne ce sans quoi la foi est incomplète, ce qui la fortifie au moment de l'acte, et une description du croyant. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
