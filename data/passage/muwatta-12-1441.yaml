label: { ar: "الموطأ 1441 — زيد بن أسلم عن رجل من بني ضمرة عن أبيه: سئل النبي عن العقيقة، فقال لا أحب العقوق، ومن ولد له ولد فأحب أن ينسك عنه فليفعل", en: "Muwatta 1441", es: "Muwatta 1441", fr: "Muwatta 1441", ur: "موطا 1441", tr: "El-Muvatta 1441 — Zeyd ibn Aslam, Beni Damra'dan bir adamın, babasından rivayet ettiğine göre: Peygamberimize akika (yeni doğan için kurban) hakkında soru soruldu ve şöyle buyurdu: \"Anne babaya itaatsizliği sevmem. Kimin çocuğu varsa ve onun için kurban kesmek istiyorsa, kessin.\"", id: "Al-Muwatta 1441 — Zayd ibn Aslam, berdasarkan riwayat seorang pria dari Banu Damrah, yang juga berdasarkan riwayat ayahnya: Nabi ditanya tentang aqiqah (kurban untuk bayi yang baru lahir), dan beliau bersabda, \"Aku tidak menyukai ketidaktaatan kepada orang tua. Siapa pun yang mempunyai anak dan ingin melakukan kurban untuknya, silakan lakukan.\"" }
text: "مَن وُلدَ لَهُ وَلدٌ فَأَحَبَّ أنْ يَنْسُكَ عَن وَلدهِ فَلْيَفْعلْ"
summary:
  ar: "يروي مالك عن زيد بن أسلم عن رجل من بني ضمرة عن أبيه أنه قال سئل رسول الله عن العقيقة، فقال لا أحب العقوق، وكأنه إنما كره الاسم، وقال من ولد له ولد فأحب أن ينسك عن ولده فليفعل. ويذكر المحقق أن ابن عبد البر لا يعلم معنى هذا الحديث عن النبي إلا من هذا الوجه، ومن حديث عمرو بن شعيب عن أبيه عن جده. {cite:muwatta-maruf-1997 p.645}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Beni Damra'dan bir adamdan, o da babasından rivayet ederek, şöyle buyurduğunu aktarır: Allah Resulü'ne akika (yeni doğan için kurban) sorulduğunda, \"İtaatsizliği sevmem\" demiştir; sanki sadece ismi sevmiyormuş gibi. \"Çocuğu olan ve çocuğu için kurban kesmek isteyen, kessin\" demiştir. Araştırmacı, İbn Abdül-Barr'ın bu hadisin anlamını Peygamberimizden ancak bu rivayet zinciri ve Amr ibn Şuayb'ın hadisi aracılığıyla, o da babasından, o da dedesinden rivayet ederek bildiğini belirtir. {cite:muwatta-maruf-1997 s.645}"
  id: "Malik meriwayatkan dari Zaid bin Aslam, dari seorang laki-laki dari Bani Damrah, dari ayahnya, bahwa ia berkata: Rasulullah ditanya tentang aqiqah (kurban untuk bayi yang baru lahir), dan beliau berkata, \"Aku tidak menyukai kedurhakaan,\" seolah-olah beliau hanya tidak menyukai namanya saja. Beliau bersabda, \"Siapa pun yang mempunyai anak dan ingin melakukan kurban untuk anaknya, maka lakukanlah.\" Peneliti menyebutkan bahwa Ibnu 'Abd al-Barr tidak mengetahui makna hadits ini dari Nabi kecuali melalui sanad ini, dan melalui hadits 'Amr bin Syu'ayb, dari ayahnya, dari kakeknya. {cite:muwatta-maruf-1997 p.645}"
