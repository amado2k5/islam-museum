label: { ar: "الموطأ 1441 — زيد بن أسلم عن رجل من بني ضمرة عن أبيه: سئل النبي عن العقيقة، فقال لا أحب العقوق، ومن ولد له ولد فأحب أن ينسك عنه فليفعل", en: "Muwatta 1441" }
text: "مَن وُلدَ لَهُ وَلدٌ فَأَحَبَّ أنْ يَنْسُكَ عَن وَلدهِ فَلْيَفْعلْ"
summary:
  ar: "يروي مالك عن زيد بن أسلم عن رجل من بني ضمرة عن أبيه أنه قال سئل رسول الله عن العقيقة، فقال لا أحب العقوق، وكأنه إنما كره الاسم، وقال من ولد له ولد فأحب أن ينسك عن ولده فليفعل. ويذكر المحقق أن ابن عبد البر لا يعلم معنى هذا الحديث عن النبي إلا من هذا الوجه، ومن حديث عمرو بن شعيب عن أبيه عن جده. {cite:muwatta-maruf-1997 p.645}"
