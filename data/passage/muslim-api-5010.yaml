text: "… أَوْفَى عَنْ لُحُومِ الْحُمُرِ الأَهْلِيَّةِ، فَقَالَ أَصَابَتْنَا مَجَاعَةٌ يَوْمَ خَيْبَرَ وَنَحْنُ مَعَ رَسُولِ اللَّهِ وَقَدْ أَصَبْنَا لِلْقَوْمِ حُمُرًا خَارِجَةً مِنَ الْمَدِينَةِ فَنَحَرْنَاهَا فَإِنَّ قُدُورَنَا لَتَغْلِي إِذْ نَادَى مُنَادِي رَسُولِ اللَّهِ أَنِ اكْفَئُوا الْقُدُورَ وَلاَ تَطْعَمُوا مِنْ لُحُومِ الْحُمُرِ شَيْئًا فَقُلْتُ حَرَّمَهَا تَحْرِيمَ مَاذَا قَالَ تَحَدَّثْنَا بَيْنَنَا فَقُلْنَا حَرَّمَهَا أَلْبَتَّةَ وَحَرَّمَهَا مِنْ أَجْلِ أَنَّهَا لَمْ تُخَمَّسْ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5010، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 5010 (The Book of Hunting, Slaughter, and what may be Eaten), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 5010، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
