label: { ar: "الموطأ 2803 — أبو هريرة: لا تسافر المرأة مسيرة يوم وليلة إلا مع ذي محرم", en: "Muwatta 2803", es: "Muwatta 2803", fr: "Muwatta 2803", ur: "موطا 2803", tr: "El-Muvatta 2803 — Ebu Hurayra: Bir kadın, evlenemeyeceği bir erkek akrabası olmadan bir gün bir gecelik mesafeyi katetmemelidir.", id: "Al-Muwatta 2803 — Abu Hurairah: Seorang wanita tidak boleh melakukan perjalanan sejauh satu hari satu malam kecuali dengan kerabat laki-laki yang tidak boleh dinikahinya." }
summary:
  ar: "يروي مالك عن سعيد بن أبي سعيد المقبري، عن أبي هريرة أن رسول الله قال: لا يحل لامرأة تؤمن بالله واليوم الآخر تسافر مسيرة يوم وليلة إلا مع ذي محرم منها. {cite:muwatta-maruf-1997 p.574}"
  tr: "Malik, Sa'id ibn Abi Sa'id al-Maqburi'den, o da Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Allah'a ve Ahiret Günü'ne iman eden bir kadının, evlenemediği erkek akrabası dışında bir gün bir gecelik yolculuk yapması caiz değildir.\" {cite:muwatta-maruf-1997 s.574}"
  id: "Malik meriwayatkan dari Sa'id ibn Abi Sa'id al-Maqburi, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Tidak diperbolehkan bagi seorang wanita yang beriman kepada Allah dan Hari Kiamat untuk melakukan perjalanan selama sehari semalam kecuali dengan seorang kerabat laki-laki yang tidak dapat dinikahinya.\" {cite:muwatta-maruf-1997 p.574}"
