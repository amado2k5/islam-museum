label: { ar: "صحيح البخاري 5123 — ما أُحل", en: "Sahih al-Bukhari 5123 — what was made lawful", ur: "صحیح بخاری 5123 — جو حلال کیا گیا", es: "Sahih al-Bukhari 5123 — lo que se hizo lícito" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا اللَّيْثُ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ عِرَاكِ بْنِ مَالِكٍ، أَنَّ زَيْنَبَ ابْنَةَ أَبِي سَلَمَةَ، أَخْبَرَتْهُ أَنَّ أُمَّ حَبِيبَةَ قَالَتْ لِرَسُولِ اللَّهِ إِنَّا قَدْ تَحَدَّثْنَا أَنَّكَ نَاكِحٌ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. فَقَالَ رَسُولُ اللَّهِ \" أَعَلَى أُمِّ سَلَمَةَ لَوْ لَمْ أَنْكِحْ أُمَّ سَلَمَةَ مَا حَلَّتْ لِي، إِنَّ أَبَاهَا أَخِي مِنَ الرَّضَاعَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5123، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5123 (Wedlock, Marriage (Nikaah)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5123، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5123 (Matrimonio (Nikaah)), menciona lo que se considera lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
