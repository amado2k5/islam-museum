label: { ar: "الموطأ 2749 — عطاء بن يسار: لن يبقى من النبوة إلا المبشرات وهي الرؤيا الصالحة", en: "Muwatta 2749", ur: "موطأ 2749 — عطا بن یسار: مبشرات یعنی نیک خواب", es: "Muwatta 2749", fr: "Muwatta 2749", tr: "El-Muvatta 2749 — Ata’ ibn Yasar: Peygamberlikten geriye sadece salih rüyalar olan müjdeler kalacaktır.", id: "Al-Muwatta 2749 — Ata’ ibn Yasar: Tidak akan ada yang tersisa dari kenabian kecuali kabar gembira, yaitu mimpi-mimpi yang benar." }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن رسول الله قال: لن يبقى بعدي من النبوة إلا المبشرات. قالوا: وما المبشرات يا رسول الله؟ قال: الرؤيا الصالحة يراها الرجل الصالح، أو ترى له، جزء من ستة وأربعين جزءا من النبوة. {cite:muwatta-maruf-1997 p.546}"
  ur: "موطأ میں حدیث، نمبر 2749: عطا بن یسار سے نبی نے کہا: «نبوت میں سے صرف مبشرات باقی رہیں گے»؛ پوچھنے پر کہا: «نیک خواب جو نیک آدمی دیکھے یا جسے اس کے لیے دکھایا جائے» — نبوت کا 46واں حصہ۔"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Benden sonra peygamberlikten geriye müjdelerden başka bir şey kalmayacaktır.\" Sahabeler sordular: \"Ey Allah Resulü, müjdeler nelerdir?\" Buyurdu ki: \"Salih bir insanın gördüğü veya kendisine görülen salih bir rüya, peygamberliğin kırk altı parçasından biridir.\" {cite:muwatta-maruf-1997 s.546}"
  id: "Malik meriwayatkan dari Zaid bin Aslam, dari Ata bin Yasar, bahwa Rasulullah SAW bersabda: “Tidak akan ada sisa kenabian setelahku kecuali kabar gembira.” Mereka bertanya: “Apakah kabar gembira itu, wahai Rasulullah?” Beliau menjawab: “Mimpi yang benar yang dilihat oleh orang yang benar, atau yang dilihat untuknya, adalah satu bagian dari empat puluh enam bagian kenabian.” {cite:muwatta-maruf-1997 p.546}"
