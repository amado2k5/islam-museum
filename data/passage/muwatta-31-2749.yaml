label: { ar: "الموطأ 2749 — عطاء بن يسار: لن يبقى من النبوة إلا المبشرات وهي الرؤيا الصالحة", en: "Muwatta 2749" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن رسول الله قال: لن يبقى بعدي من النبوة إلا المبشرات. قالوا: وما المبشرات يا رسول الله؟ قال: الرؤيا الصالحة يراها الرجل الصالح، أو ترى له، جزء من ستة وأربعين جزءا من النبوة. {cite:muwatta-maruf-1997 p.546}"
