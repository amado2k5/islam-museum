label: { ar: "سنن ابن ماجه 2396 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Ibn Majah 2396 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابن ماجہ 2396 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Ibn Majah 2396 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Ibn Majah 2396 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا نَصْرُ بْنُ عَلِيٍّ الْجَهْضَمِيُّ، حَدَّثَنَا مُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنِ ابْنِ عَوْنٍ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ أَصَابَ عُمَرُ بْنُ الْخَطَّابِ أَرْضًا بِخَيْبَرَ فَأَتَى النَّبِيَّ فَاسْتَأْمَرَهُ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أَصَبْتُ مَالاً بِخَيْبَرَ لَمْ أُصِبْ مَالاً قَطُّ هُوَ أَنْفَسُ عِنْدِي مِنْهُ فَمَا تَأْمُرُنِي بِهِ فَقَالَ \" إِنْ شِئْتَ حَبَسْتَ أَصْلَهَا وَتَصَدَّقْتَ بِهَا \". …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2396، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2396 (The Chapters on Charity), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2396، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2396 (Los capítulos sobre la caridad), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Ibn Majah, n° 2396 (Les chapitres sur la charité), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, les religions, les sectes et les peuples non musulmans."
