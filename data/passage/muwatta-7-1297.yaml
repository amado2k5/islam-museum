label: { ar: "الموطأ 1297 — سعيد بن المسيب: إذا أعطي الرجل الشيء في الغزو فبلغ به رأس مغزاته فهو له", en: "Muwatta 1297", es: "Muwatta 1297", fr: "Muwatta 1297", ur: "موطا 1297", tr: "El-Muvatta 1297 — Sa’id ibn al-Musayyab: Bir adama askeri seferler için bir şey verilirse ve bu şey seferin sonunda ona ulaşırsa, o şey ona aittir.", id: "Al-Muwatta 1297 — Sa’id ibn al-Musayyab: Jika seseorang diberi sesuatu untuk ekspedisi militer dan barang itu sampai ke akhir kampanyenya, maka barang itu menjadi miliknya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن سعيد بن المسيب كان يقول إذا أعطي الرجل الشيء في الغزو، فبلغ به رأس مغزاته، فهو له. {cite:muwatta-maruf-1997 p.579}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Sa'id ibn al-Musayyab'ın şöyle dediğini aktarır: Bir adama askeri seferler için bir şey verilirse ve bu şey seferin sonunda ona ulaşırsa, o şey ona aittir. {cite:muwatta-maruf-1997 s.579}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Sa'id ibn al-Musayyab biasa berkata: Jika seseorang diberi sesuatu untuk ekspedisi militer, dan barang itu sampai ke akhir kampanyenya, maka barang itu menjadi miliknya. {cite:muwatta-maruf-1997 p.579}"
