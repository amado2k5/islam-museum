label: { ar: "سنن ابن ماجه 129 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan Ibn Majah 129 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن ابن ماجہ 129 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ، عَنْ عَبْدِ اللَّهِ بْنِ شَدَّادٍ، عَنْ عَلِيٍّ، قَالَ مَا رَأَيْتُ رَسُولَ اللَّهِ ـ جَمَعَ أَبَوَيْهِ لأَحَدٍ غَيْرِ سَعْدِ بْنِ مَالِكٍ فَإِنَّهُ قَالَ لَهُ يَوْمَ أُحُدٍ \" ارْمِ سَعْدُ فِدَاكَ أَبِي وَأُمِّي \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 129، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 129 (The Book of the Sunnah), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 129، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
