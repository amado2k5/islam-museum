text: "… ذلك يجب أن يخرج ما فسد من الطعام عن آخره بقيء أو بإسهال، وأن بصلح تدبير المأكول والمشروب، ويردّ في جميع الأحوال إلى الواجب، وأن يدافع الطعام حتى يصدق جوعه، ويقوّي المعدة، أولا بشرب ماء الورد، فإن كان فساد الهضم …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 456، يرد فيه ذكر الواجب، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 456, whose wording mentions the obligatory (wajib), what must be done; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج2، ص 456 کا اقتباس جس میں واجب، جو واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
