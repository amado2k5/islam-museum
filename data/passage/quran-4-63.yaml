text: "أُو۟لَـٰٓئِكَ ٱلَّذِينَ يَعْلَمُ ٱللَّهُ مَا فِى قُلُوبِهِمْ فَأَعْرِضْ عَنْهُمْ وَعِظْهُمْ وَقُل لَّهُمْ فِىٓ أَنفُسِهِمْ قَوْلًۢا بَلِيغًا"
text_search: "أولئك الذين يعلم الله ما في قلوبهم فأعرض عنهم وعظهم وقل لهم في أنفسهم قولا بليغا"
translations:
  en: { text: "Those are they, the secrets of whose hearts Allah knoweth. So oppose them and admonish them, and address them in plain terms about their souls.", translator: "Marmaduke Pickthall", license: PD }
