label: { ar: "الموطأ 1324 — أبو هريرة عن النبي: لوددت أني أقاتل في سبيل الله فأقتل ثم أحيا فأقتل ثم أحيا فأقتل", en: "Muwatta 1324", es: "Muwatta 1324", fr: "Muwatta 1324", ur: "موطا 1324", tr: "El-Muvatta 1324 — Ebu Hurayra, Peygamber'den rivayetle: Keşke Allah yolunda savaşsam ve öldürülsem, sonra diriltilip tekrar öldürülsem, sonra tekrar diriltilip tekrar öldürülsem", id: "Al-Muwatta 1324 — Abu Hurairah berdasarkan riwayat Nabi: Aku berharap aku bisa berperang di jalan Allah dan terbunuh, kemudian dihidupkan kembali dan terbunuh lagi, kemudian dihidupkan kembali dan terbunuh lagi" }
text: "لَوَددْتُ أنِّي أُقَاتلُ في سَبِيلِ اللهِ، فَأُقْتلُ، ثُمَّ أُحْيَا فَأُقْتلُ"
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال والذي نفسي بيده، لوددت أني أقاتل في سبيل الله فأقتل، ثم أحيا فأقتل، ثم أحيا فأقتل، وكان أبو هريرة يقول ثلاثا أشهد بالله. {cite:muwatta-maruf-1997 p.592}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Canım elinde olan Allah'a yemin ederim ki, Allah yolunda savaşmayı ve öldürülmeyi, sonra diriltilmeyi ve tekrar öldürülmeyi, sonra tekrar diriltilmeyi ve tekrar öldürülmeyi dilerdim.\" Ebu Hurayra da üç defa \"Allah'a şahitlik ederim\" derdi. {cite:muwatta-maruf-1997 s.592}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda, \"Demi Dia yang jiwaku berada di tangan-Nya, aku berharap dapat berperang di jalan Allah dan gugur, kemudian hidup kembali dan gugur lagi, kemudian hidup kembali dan gugur lagi.\" Dan Abu Hurayrah mengucapkan tiga kali, \"Aku bersaksi demi Allah.\" {cite:muwatta-maruf-1997 p.592}"
