text: "لَوَددْتُ أنِّي أُقَاتلُ في سَبِيلِ اللهِ، فَأُقْتلُ، ثُمَّ أُحْيَا فَأُقْتلُ"
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال والذي نفسي بيده، لوددت أني أقاتل في سبيل الله فأقتل، ثم أحيا فأقتل، ثم أحيا فأقتل، وكان أبو هريرة يقول ثلاثا أشهد بالله. {cite:muwatta-maruf-1997 p.592}"
