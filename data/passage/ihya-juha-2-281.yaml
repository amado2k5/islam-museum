  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 2, p. 281, with jesting and playfulness; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 2، ص 281 کا اقتباس جس میں مزاح اور خوش طبعی ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
