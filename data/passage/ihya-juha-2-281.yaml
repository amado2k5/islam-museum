text: "… أنوى، وهذا هو الأخير، إذ يظهر محب اللعب فى سن المييز، وحب النساء والزينة فى سن البلوغ، وجب الرياسة بمد العشرين، وحب العلوم بقرب الأربمين، وهي الفاية العليه. وكما أن الصبى يضحك على من يترك اللعب ويشتفل بملاعبة النساء وطلب …"
