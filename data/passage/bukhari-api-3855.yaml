label: { ar: "صحيح البخاري 3855 — ما حُرّم", en: "Sahih al-Bukhari 3855 — what was made unlawful", ur: "صحیح بخاری 3855 — جو حرام کیا گیا" }
text: "… قَالَ أَمَرَنِي عَبْدُ الرَّحْمَنِ بْنُ أَبْزَى قَالَ سَلِ ابْنَ عَبَّاسٍ عَنْ هَاتَيْنِ الآيَتَيْنِ، مَا أَمْرُهُمَا {وَلاَ تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ } {وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا} فَسَأَلْتُ ابْنَ عَبَّاسٍ فَقَالَ لَمَّا أُنْزِلَتِ الَّتِي فِي الْفُرْقَانِ قَالَ مُشْرِكُو أَهْلِ مَكَّةَ فَقَدْ قَتَلْنَا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ، وَدَعَوْنَا مَعَ اللَّهِ إِلَهًا آخَرَ، وَقَدْ أَتَيْنَا الْفَوَاحِشَ. فَأَنْزَلَ اللَّهُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3855، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 3855 (Merits of the Helpers in Madinah (Ansaar)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 3855، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
