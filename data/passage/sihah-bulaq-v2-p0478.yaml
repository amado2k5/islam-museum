text: |-
  • ⁦(باب القاف)⁩•
  •عق),.
  ١٠٩
  وقائلة لاتركين عليقة • ومن اذة الدنيار كوب العلائق
  يقال علقت مع فلان عليقة وأرسلت معم عليقة قال الراجز
  أرسلها عليقة وقد علم • أن العليقات بلاقين الرقم
  لانهم يودعون ركابهم ويركبونها ويخففون من حل بعضها عليها والمعلاق والمملوق ماعلق به
  من لحم أوعنب ونحوه وكل شى علق به شئ فهومهلاقه والمعالق العسلاب الصغار واحدها
  معلق قال الفرزدق
  وافالتخضى بالأكف رماحنا • اذا أرعشت أيديكم بالمعالق
  والعلاقة بالكسرعلاقة القوس والسوط ونحوهما والعلاقة بالفتح علاقة الخصومة وعلاقة
  لية قال الناء أعلاقة أتم الوليدبودما • أقنان رأسك كالفام القل
  والعلاقة أيضا ما يتبلغ يه من عيس ومنه قواه-م ماجها من عسلاق أى شئ من مى تع
  قال الاعشى
  وفلاة كانها ظهرترس • ليس الاالرجيع فيها علاق
  يقول لاتجد الابل فيها علاقا الاماتردّه من جزتها وماتركك الحالب بالناقة عسلاها اذ الم يدع
  فى ضرعها شيأ ورجل علاقية مثال ثمانية اذا علق شيألم يقلع عنه ورجل ذو معلاق أى شديد
  خصومة قال الشاعر
  ان تحت الاحجار حزما وجودا • وخصما ألتذامعلاق
  والعليق مثال انقبيط نيت يتعلق بالشجر يقال له بالفارسية سرند وربعا قالوا العليق مثال
  القبيطى والعولق الغول والكلبة الحريصة وتولهم هذاحديث طويل العواق أى طويل
  الذقب وأعلق أظفاره فى الشى أى أنشبها والاعلاق ارسال العلق على الموضع ليمصّ الدم
  وفى الحديث اللدود أحب" الى من الاعلاق والاعلاق أيضا الدغر يقال أعلقت المرأة ولدها
  ص العذرة اذا رفعتها يدها وأعلقت القوس أى جعلت لها علاقة وقولهم للرجل أعلقت
  وأفلتت أى جنت بعلق فلق وهى الداهية لا تجرى مثال عمر ويقال العلق الجمع الكثير
  ويقال للصائدأعلقت فأدرك أى علق الصيد فى حبالتك وعاقت الشى تعليقا وعلق الرجل
  امر أة من علاقة الحب قال الاعشى
  علقتها عرضا وعلقت رجلا • غيرى وعلق أخرى غبرها الرجل
  واعتلقه أى أحبه والمعلقة من النساء التى نقد زوجها وقال تعالى فتذروها كالمعلقة
  وتعلقه وتعلق به بعن ويقال أيضا تعلقته بمعنى علقته ومنه قول عبيد اللّٰه بن زياد لابى الاسود
  الدولتلو تعلقت معاذة يريدلو علقت على نفسك معاذة لثلاتصيبك عين وقواهم ليس المتعلق
  كالمتأنق أى ليس من يتبلغ بالشى اليسيمه كن يتأنق ويأكل مايناء وعلقى نبت قال سيبويه
  يكون واحداوجعا وألفه للمتأنيث فلايتوّن قال العجاح يصف تورا* فحط فى ع لقى وفى مكود*
  وقال غيره ألفه للالحاق وينون الواحدة علقاة وبعير عالق يرعى العاقى والعالن أيضا الذى
  بعلق العضاء أى ينتف منها وانماسمى عالقالانه يتعلق بالعضاه لطوله ⁦(عمق)⁩ العمق
  والعمق قعر البئر والفيج والوادى وتعميق البئرواعماقها جعلها عميقة وقد عمق الركى" عماقة
  ٢٨
  قولة وعلق فبت فى القاموسة
  والعلقى كسكرى نبت يكون
  واحداو يمعا قضبانه دفاق عسر
  رضها يتخذمِنه المكانس
  ويشرب طبيمه الاستسقاءاه
