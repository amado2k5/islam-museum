label: { ar: "الموطأ 2341 — مالك: كتابة المكاتب عند الموت وصية في الثلث، والعتاقة تبدأ على الوصايا", en: "Muwatta 2341" }
summary:
  ar: "قال مالك في رجل كاتب عبده عند موته: إنه يُقوَّم عبدا، فإن كان في ثلثه سعة لثمن العبد جاز ذلك، وهي وصية أوصى بها في ثلثه. فإن أوصى لقوم بوصايا وليس في الثلث فضل عن قيمة المكاتب، بُدئ بالمكاتب لأن الكتابة عتاقة، والعتاقة تُبدأ على الوصايا، ثم تُجعل تلك الوصايا في كتابة المكاتب يتبعونه بها. ويُخيَّر ورثة الموصي: فإن أحبوا أن يعطوا أهل الوصايا وصاياهم كاملة وتكون كتابة المكاتب لهم فذلك لهم، وإن أبوا وأسلموا المكاتب وما عليه إلى أهل الوصايا فذلك لهم. {cite:muwatta-maruf-1997 p.365} {cite:muwatta-maruf-1997 p.366}"
