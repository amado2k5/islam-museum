label: { ar: "الموطأ 2341 — مالك: كتابة المكاتب عند الموت وصية في الثلث، والعتاقة تبدأ على الوصايا", en: "Muwatta 2341", es: "Muwatta 2341", fr: "Muwatta 2341", ur: "موطا 2341", tr: "El-Muvatta 2341 — Malik: Ölüm üzerine azat sözleşmesi yazmak, üçte bir oranında vasiyet anlamına gelir ve azat, vasiyetlerle başlar.", id: "Al-Muwatta 2341 — Malik: Membuat perjanjian pembebasan setelah kematian adalah wasiat sepertiga, dan pembebasan dimulai dengan wasiat." }
summary:
  ar: "قال مالك في رجل كاتب عبده عند موته: إنه يُقوَّم عبدا، فإن كان في ثلثه سعة لثمن العبد جاز ذلك، وهي وصية أوصى بها في ثلثه. فإن أوصى لقوم بوصايا وليس في الثلث فضل عن قيمة المكاتب، بُدئ بالمكاتب لأن الكتابة عتاقة، والعتاقة تُبدأ على الوصايا، ثم تُجعل تلك الوصايا في كتابة المكاتب يتبعونه بها. ويُخيَّر ورثة الموصي: فإن أحبوا أن يعطوا أهل الوصايا وصاياهم كاملة وتكون كتابة المكاتب لهم فذلك لهم، وإن أبوا وأسلموا المكاتب وما عليه إلى أهل الوصايا فذلك لهم. {cite:muwatta-maruf-1997 p.365} {cite:muwatta-maruf-1997 p.366}"
  tr: "Malik, ölümünden sonra kölesi için yazılı bir azat sözleşmesi yapan bir adam hakkında şunları söylemiştir: Kölenin değeri belirlenir. Eğer mal varlığının üçte birinde kölenin bedelini karşılayacak kadar arazi varsa, bu caizdir, çünkü bu, o üçte birlik kısım içinde yapılan bir vasiyettir. Eğer birkaç kişiye vasiyette bulunmuşsa ve üçte birlik kısımda sözleşme konusu kölenin değerinin ötesinde bir fazlalık yoksa, o zaman sözleşme konusu köleye öncelik verilir, çünkü azat sözleşmesi bir tür özgürleşmedir ve özgürleşme vasiyetlerden önceliklidir. Daha sonra, bu vasiyetler azat sözleşmesini yerine getirmek için kullanılır ve vasiyet edenin mirasçıları bir seçeneğe sahiptir: Eğer mirasçılarına tüm vasiyetlerini vermek isterlerse ve azat sözleşmesi onlarda kalırsa, bu onların seçimidir. Eğer reddederler ve köleyi ve mal varlığını mirasçılarına teslim ederlerse, bu da onların seçimidir. {cite:muwatta-maruf-1997 s.365} {cite:muwatta-maruf-1997 s.366}"
  id: "Malik berkata mengenai seorang pria yang, setelah kematiannya, membuat perjanjian tertulis pembebasan budaknya: Budak itu harus dinilai. Jika ada cukup tanah dalam sepertiga dari hartanya untuk menutupi harga budak tersebut, maka ini diperbolehkan, karena itu merupakan wasiat yang dibuat dalam sepertiga tersebut. Jika ia membuat wasiat kepada beberapa orang, dan tidak ada surplus dalam sepertiga tersebut di luar nilai budak yang tercantum dalam perjanjian, maka budak yang tercantum dalam perjanjian tersebut diprioritaskan, karena perjanjian pembebasan adalah bentuk emansipasi, dan emansipasi lebih diutamakan daripada wasiat. Kemudian, wasiat tersebut digunakan untuk memenuhi perjanjian pembebasan, dan ahli waris pewaris memiliki pilihan: jika mereka ingin memberikan seluruh wasiat mereka kepada para penerima manfaat, dan perjanjian pembebasan tetap ada pada mereka, maka itu adalah pilihan mereka. Jika mereka menolak dan menyerahkan budak dan asetnya kepada para penerima manfaat, maka itu adalah pilihan mereka. {kutip:muwatta-maruf-1997 hal.365} {kutip:muwatta-maruf-1997 hal.366}"
