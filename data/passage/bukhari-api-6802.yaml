label: { ar: "صحيح البخاري 6802 — ألبان الإبل وأبوالها", en: "Sahih al-Bukhari 6802 — camel milk and urine as treatment", ur: "صحیح بخاری 6802 — اونٹنی کا دودھ اور پیشاب" }
text: "… حَدَّثَنَا الأَوْزَاعِيُّ، حَدَّثَنِي يَحْيَى بْنُ أَبِي كَثِيرٍ، قَالَ حَدَّثَنِي أَبُو قِلاَبَةَ الْجَرْمِيُّ، عَنْ أَنَسٍ ـ قَالَ قَدِمَ عَلَى النَّبِيِّ نَفَرٌ مِنْ عُكْلٍ، فَأَسْلَمُوا فَاجْتَوَوُا الْمَدِينَةَ، فَأَمَرَهُمْ أَنْ يَأْتُوا إِبِلَ الصَّدَقَةِ، فَيَشْرَبُوا مِنْ أَبْوَالِهَا وَأَلْبَانِهَا، فَفَعَلُوا فَصَحُّوا، فَارْتَدُّوا وَقَتَلُوا رُعَاتَهَا وَاسْتَاقُوا، فَبَعَثَ فِي آثَارِهِمْ فَأُتِيَ بِهِمْ، فَقَطَعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ وَسَمَلَ أَعْيُنَهُمْ، ثُمَّ لَمْ يَحْسِمْهُمْ حَتَّى مَاتُوا."
summary:
  ar: "حديث في صحيح البخاري، رقم 6802، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6802 (Limits and Punishments set by Allah (Hudood)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6802، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
