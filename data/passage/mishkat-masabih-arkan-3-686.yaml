text: "… ولم يختافوا في ذلك وهو أحد الامة المجتهدين وأحد أقطاب الاسلام وأركان الدين. ولد في أيام سليمان بن عبد الملك سنة تسع وتسمين، سمع خلقا كثيراً. روى عنه معمر والأوزاعي وابن جريج ومالك وشعبة وابن عيينة وفضيل بن عياض وخلق …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 3، ص 686، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 3, p. 686, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 3، ص 686 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 3, pág. 686, que menciona los pilares del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 3, page 686, mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 3, sayfa 686'dan, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, imanın dallarını ve bir müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Mishkat al-Masabih, Jilid Bergambar 3, halaman 686, yang menyebutkan rukun Islam; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
