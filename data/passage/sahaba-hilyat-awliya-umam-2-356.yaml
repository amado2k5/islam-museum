text: "… وعياله من الطعام حتى يشبعهم فقد أطعم الطعام، ومن صام رمضان ومن كل شهر ثلاثة أيام فقد أدام الصيام، ومن صلى العشاء الآخرة والغداة فى جماعة فقد صلى والناس قيام، واليهود والنصارى والمجوس."
