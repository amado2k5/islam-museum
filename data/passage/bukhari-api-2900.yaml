label: { ar: "صحيح البخاري 2900 — الأب والأبوة", en: "Sahih al-Bukhari 2900 — the father and fatherhood", ur: "صحیح بخاری 2900 — باپ اور والدیت", es: "Sahih al-Bukhari 2900 — El padre y la paternidad", fr: "Sahih al-Bukhari 2900 — Le père et la paternité", tr: "Sahih el-Buhari 2900 — Baba ve Babalık", id: "Sahih al-Bukhari 2900 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ الْغَسِيلِ، عَنْ حَمْزَةَ بْنِ أَبِي أُسَيْدٍ، عَنْ أَبِيهِ، قَالَ قَالَ النَّبِيُّ يَوْمَ بَدْرٍ حِينَ صَفَفْنَا لِقُرَيْشٍ وَصَفُّوا لَنَا \" إِذَا أَكْثَبُوكُمْ فَعَلَيْكُمْ بِالنَّبْلِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2900، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2900 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2900، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2900 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2900 (Le combat pour la cause d'Allah (Jihad)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 2900 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2900, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
