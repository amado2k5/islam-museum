label:
  ar: "الترمذي 3328 — أنا أهل أن أتقى"
  en: "Tirmidhi 3328 — I am the One worthy of being feared"
  ur: "ترمذی 3328 — میں اس لائق ہوں کہ مجھ سے ڈرا جائے"
text: "حدثنا الحسن بن الصباح البزار، حدثنا زيد بن حباب، أخبرنا سهيل بن عبد الله القطعي، وهو أخو حزم بن أبي حزم القطعي عن ثابت، عن أنس بن مالك، عن رسول الله أنه قال في هذه الآية ( هو أهل التقوى …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3328: أنا أهل أن أتقى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3328: I am the One worthy of being feared. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3328: میں اس لائق ہوں کہ مجھ سے ڈرا جائے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
