text: "… في مسنده، والطبري في تفسيره، والطبراني في الكبير، والصيداوي في معجمه :، والأثر قويٌّ بطرقه.، ولمَّا شكَّ النَّاسُ في موته وَيه، قال عمُّه العباس : والله ما ماتَ رسولُ اللّٰه وَيفِ حتّى تركَ السبيلَ نهجاً واضحاً، وأحلَّ الحلالَ وحرَّم الحرامَ، …"
