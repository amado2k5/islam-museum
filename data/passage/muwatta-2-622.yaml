text: "ما صدقت بموت رسول الله حتى سمعت وقع الكرازين"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن أم سلمة زوج النبي كانت تقول: ما صدقت بموت النبي حتى سمعت وقع الكرازين، أي الفؤوس التي حُفر بها قبره. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 24/401) أنه لا يحفظه عن أم سلمة متصلاً، والمعروف حديث عائشة. {cite:muwatta-maruf-1997 p.317}"
