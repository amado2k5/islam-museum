label: { ar: "الموطأ 622 — بلاغ عن أم سلمة: ما صدقت بموت النبي حتى سمعت وقع الكرازين", en: "Muwatta 622", es: "Muwatta 622", fr: "Muwatta 622", ur: "موطا 622", tr: "El-Muvatta 622 — Ümmü Seleme'den rivayet: Davulcuların sesini duyana kadar Peygamberin öldüğüne inanmadım.", id: "Al-Muwatta 622 — Sebuah riwayat dari Umm Salama: Aku tidak percaya pada wafatnya Nabi sampai aku mendengar suara penabuh gendang." }
text: "ما صدقت بموت رسول الله حتى سمعت وقع الكرازين"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن أم سلمة زوج النبي كانت تقول: ما صدقت بموت النبي حتى سمعت وقع الكرازين، أي الفؤوس التي حُفر بها قبره. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر ⁦(التمهيد 24/401)⁩ أنه لا يحفظه عن أم سلمة متصلاً، والمعروف حديث عائشة. {cite:muwatta-maruf-1997 p.317}"
  tr: "Malik, Peygamberin eşi Ümmü Seleme'nin şöyle dediğini duyduğunu rivayet etmiştir: \"Peygamberin ölümüne, kazmaların sesini duyana kadar inanmadım.\" Burada kastedilen, kabrinin kazıldığı baltaların sesidir. Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtir ve İbn Abdül-Barr'ın (el-Tamhid 24/401) bunun doğrudan Ümmü Seleme'den rivayet edildiğini bilmediğini ve bilinen hadisin Aişe'nin hadisi olduğunu söylediğini aktarır. {cite:muwatta-maruf-1997 s.317}"
  id: "Malik meriwayatkan bahwa ia mendengar Umm Salamah, istri Nabi, berkata: \"Aku tidak percaya akan wafatnya Nabi sampai aku mendengar suara beliung,\" yang berarti beliung yang digunakan untuk menggali kuburnya. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini dari Malik, dan mengutip Ibnu Abd al-Barr (al-Tamhid 24/401) yang mengatakan bahwa ia tidak mengetahui bahwa hadits tersebut diriwayatkan langsung dari Umm Salamah, dan bahwa hadits yang terkenal adalah hadits Aisyah. {cite:muwatta-maruf-1997 p.317}"
