  ١٥٣
  الشئبز أمحه وزأيجم اذا أخذته كله ولم تدع منه شيتا عن ابن السكيت زفج) الرفج جيل
  من السودان وهم الزنوج قال أبو عمرو زنج وزفج وزنجيّ وزنجي ⁦(زنفلج)⁩ الانفيلجة بكسر
  الزاى والفاءوقتح اللام شبيه بالكنف ١ وهو معرب وأصله بالفارسية زين بيله.
  فانة_دمت اللام على الياء كسرتها وقصت ماقبلها وقلت الزتفليجة ( زوج ،زوج المرأة
  ملها وزوج الرحل امر أنه قال اللّٰه تعالى اسكن أنت وزوحك الحنة ويعال آيضاهى
  زوجته قال الفرزدق
  وان الذى يسعى ليفد زوجى • كاع الى أسد الشرى يستبيلها
  قال يونس تقول العرب زوّجته امرأة وتزو جت امرأة وليس من كلام الع-رب تزوجت
  بامرأة قال وقول اللّٰه تعالى وزوّحناهم بجورعين أى قرناهم بهنّ من قولدع زوجل احسروا
  الذين ظلوا وأزواجهم أى وقرناءهم وقال الفترا تزوجت بامرأقلغة فى أزدشنومة وامرأة
  مزواج كثيرة التزوّج والتزاوح والمزاوجة والازدواج بعنى والزوج خلاف المفرديقال
  زوح أوفرد كما يقال خسا أوزكا شفع أووتر قال أيووجرة السعدى
  مازان يأسين وهنا كل صادقة * بانت تساشر عرما غير أزواج
  لات بيض القطا لا يكون الاوترا قال اللّٰه تعالى وأنبتنافيها من كل زوج بهيج وكل واحد
  منهما أيضايسمى زوجا يقال همازوجان للاثنين وهما زوج كمايقال هماسيان وهماسواء
  وتقول اشتريت زوجى حام وأنت تعنى ذكراوأنى وعندى زوجانعال وقال تعالى من كل
  زوجين ائني والزوج النط يطرح على الهودج قال ليبيد
  من كل محفوف بظل عصبه * زوج عليه كاة وقرامها
  والزاج فارسى معرّب والزيج خيط البناء وهو المطمرفادى معرب وقال الاصمعى لست
  أدرى أعربى هو أم معرّب
  صل المين ) يج) السيجة باضم كساء أسود يقال تسيج الرجل اذ البسه قال
  العجاج كالحبشى التف أوتسيجا والسيج دوالخرز الاسود فارسى معرّب والديج والمسبيجة
  البقير وأصله بالفارسية شى وهوالقميص والسبابجة قوم من السنددانوا بالبصرة
  جلاوزة ورتاس السحن والها للعجمة والنسب قال يزيد بن مفرغ الجبرى
  وطماطيم من سبابيج خرز * يلبسونى مع الصباح القيودا
  ⁦(سحيح)⁩ حج يسج اذارق مايجمنه من الغائط ومحج الحائط أى طبنه والخشبة التى
  بطين بها مسجة والسحة والبجة صمان والسجاج بالفتح اللين المكثير الماء وهوأرق ما يكون
  والارض السجسج ليست بصلبة ولاسهلة قال الشاعر
  انى اهتديت وكنت غبررجيلة • والقوم قد قطه وامتان السسبج
  ويوم سجميج لاحرّمؤذ ولاقز وفى الحديث الجنة سيحسبج ( سهج مجحت جدده
  فانستبح أى قشرته فافتشر يقال أصايه شئ فسحيج وجهه وبه ستيج وسمجه فتسبح شدد
  لمكثرة وجار مصج أى معفض مكتح وبعير صاح يسمج الارضر بخفه دح
  رجل سداج أى كذاب وقد تستح أى تكذب وتخلق ( رج السرج معروف وقد
  ٢٦
  صحاح
  والظرف وأصلهوعاء أداة الراعى
  كما يأتى ولوقيل ان الزنبيل
  معرب عه لم يبعد قاله نصر
