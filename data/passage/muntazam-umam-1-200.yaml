text: "… الفداء بيلاد الروم قتم الفداء لحمس بقين من رجب. وكان الحاج تدخرجوا من بنداد فى ذى القعدة نخرج جعفر بن ورتاء وهو والى طريق مكة والكوفة تتقدم الحاج خونا من أبى طاهر الجنابى وكان معه اف : فارس من بى …"
