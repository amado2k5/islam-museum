text: "… ويستأهل صاحبه أن يخذل ويستهجن فعله، ويجازي بكل قبيح. فعليهم أن يقروه: شف أي سنة واستحباباً لا فرضاً؛ لأن قرى الضيف غير واجب قطعاً؛ لحديث الأعرابي: هل علَيَّ غيرهن؟ قال: لا إلا أن تطوع. عليكم بهذا القرآن: أي ألزموه واعملوا …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 189، يرد فيه ذكر الفرض، والواجب، والمستحب، والتطوع، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 189, whose wording mentions the obligatory (fard), the obligatory (wajib), the recommended (mustahabb), the voluntary act (tatawwu'), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 189 کا اقتباس جس میں فرض، واجب، مستحب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
