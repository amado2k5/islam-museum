text: "… سلمَةَ، قَالَ : أخبرنَا ثَابتٌ، عَنَ أَنس بن مالك : أنَّ رَسُولَ اللَّهِ، وَل، أتاهُ جبريلُ،، ذَاتَ يَوم وهُو يَلعبُ مَع الغِلمانِ، فَأخذهُ فصَرَعهُ فشَقَّ عن قَلْبه فَاستخْرجَ القلْبَ، ثم شَقَّ القلْب فاستخرجَ منهُ عَلَقَةً فَقَال : هَذَا حَظُّ الشيْطَانِ …"
