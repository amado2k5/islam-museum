text: "كتب له كتابا قبل أن يعلمه أين يسير، فقال : أخرج أنت وأصحابك ، حتى إذا سرت يومين ، فافتح كتابك وانظر فيه فما أمرتك به فامض له ، ولا تستكرهن أحدا من أصحابك على الذهاب معك ، فلما سار يومين فتح"
