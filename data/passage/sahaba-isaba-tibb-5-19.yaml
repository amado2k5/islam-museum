text: "… عمرو اسم ابن أخيه الذى لم يسم فى حديث أبى سعيد الذى أورده ابن شاهين وفيه ان ملاعب الاسنة بعث الى الذي يسأله الدواء من وجع طن ابن أخ له فيعث اليه عكة عسل فسقاه فبرئ وقد أختاف فى اسلام …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 5، ص 19، يذكر التداوي بالعسل، والوجع، والبرء من العلة، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 5, p. 19, that mentions honey as a remedy, pain, recovery from an ailment, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 5، ص 19 کا اقتباس جس میں شہد سے علاج، درد، بیماری سے شفایابی، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen escaneado 5, pág. 19, que menciona la miel como remedio, dolor, recuperación de una dolencia, el medicamento; del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isaba d'Ibn Hajar, volume 5, page 19, qui mentionne le miel comme remède contre la douleur, la guérison d'une maladie, comme médicament; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Hajar'ın El-İsabe adlı eserinin resimli 5. cildinin 19. sayfasında bal ile tedavi, ağrı, hastalıktan iyileşme ve ilaçtan bahsedilmektedir; bu bölüm, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Isabah karya Ibn Hajar, jilid bergambar 5, hlm. 19, menyebutkan pengobatan dengan madu, rasa sakit, pemulihan dari penyakit, dan obat-obatan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
