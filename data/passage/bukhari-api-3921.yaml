text: "حَدَّثَنَا أَصْبَغُ، حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنْ عَائِشَةَ، أَنَّ أَبَا بَكْرٍ ـ تَزَوَّجَ امْرَأَةً مِنْ كَلْبٍ يُقَالُ لَهَا أُمُّ بَكْرٍ، فَلَمَّا هَاجَرَ أَبُو بَكْرٍ طَلَّقَهَا، فَتَزَوَّجَهَا ابْنُ عَمِّهَا، هَذَا الشَّاعِرُ الَّذِي قَالَ هَذِهِ الْقَصِيدَةَ، رَثَى كُفَّارَ قُرَيْشٍ وَمَاذَا بِالْقَلِيبِ قَلِيبِ بَدْرٍ مِنَ الشِّيزَى تُزَيَّنُ بِالسَّنَامِ وَمَاذَا بِالْقَلِيبِ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3921، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3921 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3921، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
