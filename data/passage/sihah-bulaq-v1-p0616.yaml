text: |-
  ٢٥
  ينهم ألقى الشرّ والاغراء الصكسائى نزأت،لميه نز٠ا حلت يقال مانزأل على هذا أى
  ماحلك عليه ورجل منزوء بكذا أى مولع ويقال انك لا تدرى علام ينزأهرمك ولا تدرى
  بم يولع هرمك أى نفسك وعة لات عن ابن السكيت ١) .أ ، سأت البعيرنسأ اذا زجرته
  وسقته وكذلك نسأته تنسئة وأنشدابو عمروبن العلاء
  وما أم خشف بالعلاية شادن • تنسئ فى برد الظلال غزالها
  والمنسأة العصايهمزولايه مزوقال فى الهمز ⁦(التائل هوأبو طااب اه شرح قاموس)⁩
  أمن أجل حبل لا أبالئْضربته* يمئسأة قد جرّ حبلك أحبلا
  وقال آخر فى ترك الهمز
  اذاد يبن على المنساة من هرم * فقد ساعد عنك اللهو والغزل
  ونسات التذ أأخرته وكذلك أنسأنه فعات وأفعات بمعنى تقول استفأته الدين فأن أنى
  الاسمعى أنأه اللّٰه أجل وذأه فى أجله بمعنى والنسأة بالضم ال. أخير مثل الكلاة وكذلك
  الفيئة على فعسلة تقول ذسأته البيع دأنسأته وبعته بفسأة وبعته بكلاة أى بأخرة وبعته
  نسيئة أى بأخرة وقال الاخفش أنسأنه الدين اذا جعاته له مؤخرا كانك جعاته له يؤخره
  ونسأت عنه دينه اذا أخرته نساء قال وكذلك النساء فى العمر ممدود ومنه قولهم من سره
  النساء ولاأاء فليخفف الرداء بالد(٢ و ليبا كر الغدا، وليقل غشيان النساء ونسأت فى ظم.
  الابل نسأ اذا زدت فى ظمئها يوما أويومين أوأكثرم ن ذلك ونسأتها أيضاءن الحوض اذا
  أخرتها عنه ونسئت الرأة تنسأنسأ لى مالم يسم فاء-لهاذا كان عند أول حبلها وذلك حين
  يتأخر حيضها عن وقنه فرجى انها حبلى وهى احرأة نسء وقال الاصمعىّ بقال للمرأة
  أَول ما تحمل قدنست وتقول نسأن الماشية سأوهو بد ممنها حين ينت وبرها بعد
  تساقطه يقال جرى النسء فى الدواب قال أبوذؤيب يصف ظبية
  بدابلت شهرى ربيع كايهما • فقد مارفيها نؤها واقترارها
  فالفس بده السمن والاة -ترارنهايته ونسأت اللبن خلطته عماه واسمه النس قال عروة
  ابن الورد العبسى
  سقونى النس. ثتم تكنفوتى * عداة اللّٰه .ن كذب وزور
  وقوله تعالى انما النسنى ءزيادة فى الكفر هوفعيل بعنى مفعول من قولكذ- أت الشئ
  فهو منسوء اذا أخرته ثم يحوّل منسوء الى نسءكما يحوّل مقتول الى قتيل ورجل ناسئ وقوم
  نسأة مثل فاسق وفسقة وذللكانخم كانوا اذاصدروا عن من يقوم رجسل من كتانة فيقول
  أنا الذى لا يردّلى قضاء فيقولون أنسئناشهرا أى أخر عنا حرمة اخرم واجعلها فى صفر لانهم
  كانوا يكرهون أن تنوالى عليهم ثلاثة أشهر لايغيرون فيها لانّ معاشهسم كان من الغارة
  فصل لهم المحرّم وقواهم أنسأت سر بتى أى أبعدت مذهبى قال الشنفرى
  عدون من الوادى الذى بين مشعل • وبين الحساهيهات أنسأت سربى ٣
  واتسأت عنه تأخرت وتساعدت وكذلك الابل اذا تهاعدت فى المرعى قال الشاءر
  اذا اتتسؤافوت الرماح أنتهم * عوارتبل كالجراد نطيرها
  ١ لى هذا التفسير يقرأهرمك
  بكسرالراء وعلى تفسيره بمعى
  الكبر الذى اختاره المجديقر أ
  :فتحها وعسلى كل غاليا" من ينزأ
  مضمومة لانه مبى للمجهول هذا
  ملخص ما فى الحائسية والشرح
  ٢ ا مراديه الدين كما فى المناوى
  ومحشى القاموس وقال المجد
  يقال فلان خفف الرداء قليل
  العيال والدين ومترجم الصاح
  جعل المراديه السكسوة ١ه
  ٣ ال ابن برى الصواب عدونا
  أى كما أنشدء فى سرب كذلك اه
  تبرح القاموس
