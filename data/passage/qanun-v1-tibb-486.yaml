text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف الحاء، نافع لوجع الأضلاع من البلغم : أعضاء الصدر خصوصاً البرّي، ويحدث وجع الحلق والخوانيق، ويتلافى ضرره بالكزبرة والخسّ والهندبا. أعضاء الغذاء: نافع من وجع المعدة الباردة الريحيّة، ودهنه لدواء. …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 486، يذكر الوجع، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 486, that mentions pain, the hospital and the medical craft, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 486 کا اقتباس جس میں درد، بیمارستان، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
