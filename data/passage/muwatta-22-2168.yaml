label: { ar: "الموطأ 2168 — يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم: بلغه أن رسول الله قال في سيل مهزور ومذينب: يمسك حتى الكعبين ثم يرسل الأعلى على الأسفل", en: "Muwatta 2168", es: "Muwatta 2168", fr: "Muwatta 2168", ur: "موطا 2168", tr: "El-Muvatta 2168 — Yahya, Malik'ten, o da Abdullah ibn Abi Bekr ibn Muhammed ibn Amr ibn Hazm'dan rivayet ettiğine göre: Ona, Allah Resulü'nün Mahzur ve Mudhaynib seli hakkında şöyle buyurduğu rivayet edilmiştir: \"Suyu ayak bileklerine kadar geri çekin, sonra üstteki suyu alttakinin üzerine bırakın.\"", id: "Al-Muwatta 2168 — Yahya, dari Malik, dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm: Telah sampai kepadanya bahwa Rasulullah SAW bersabda mengenai banjir Mahzur dan Mudhaynib: “Tahan air hingga setinggi mata kaki, kemudian lepaskan air bagian atas ke bagian bawah.”" }
summary:
  ar: "قال يحيى: حدثنا مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم أنه بلغه أن رسول الله قال في سيل مهزور ومذينب: يمسك حتى الكعبين، ثم يرسل الأعلى على الأسفل. ويذكر المحقق أن الحديث موصول مرفوع من عدة طرق لكنها ضعيفة، وأن ابن عبد البر رآه حديثا مدنيا مشهورا معمولا به عند أهل المدينة. {cite:muwatta-maruf-1997 p.288}"
  tr: "Yahya şöyle dedi: Malik, Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan rivayetle bize, Resulullah'ın Mahzur ve Mudhaynib selleri hakkında şöyle buyurduğunu işittiğini aktardı: \"Suyu ayak bileklerine kadar geri çekin, sonra üstteki suyu alttakine bırakın.\" Araştırmacı, hadisin birkaç rivayet zinciriyle Peygamberimize kadar dayandırıldığını, ancak bu zincirlerin zayıf olduğunu ve İbn Abd al-Barr'ın bunu Medine halkı tarafından uygulanan, iyi bilinen bir Medine hadisi olarak kabul ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.288}"
  id: "Yahya berkata: Malik meriwayatkan kepada kami dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm bahwa ia mendengar bahwa Rasulullah SAW bersabda mengenai banjir Mahzur dan Mudhaynib: \"Tahan air hingga setinggi mata kaki, kemudian lepaskan air bagian atas ke bagian bawah.\" Peneliti menyebutkan bahwa hadits ini terhubung dan ditelusuri kembali kepada Nabi melalui beberapa rantai periwayatan, tetapi rantai tersebut lemah, dan bahwa Ibnu Abd al-Barr menganggapnya sebagai hadits Madinah yang terkenal dan diriwayatkan oleh penduduk Madinah. {cite:muwatta-maruf-1997 p.288}"
