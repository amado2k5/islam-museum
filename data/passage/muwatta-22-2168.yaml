label: { ar: "الموطأ 2168 — يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم: بلغه أن رسول الله قال في سيل مهزور ومذينب: يمسك حتى الكعبين ثم يرسل الأعلى على الأسفل", en: "Muwatta 2168" }
summary:
  ar: "قال يحيى: حدثنا مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم أنه بلغه أن رسول الله قال في سيل مهزور ومذينب: يمسك حتى الكعبين، ثم يرسل الأعلى على الأسفل. ويذكر المحقق أن الحديث موصول مرفوع من عدة طرق لكنها ضعيفة، وأن ابن عبد البر رآه حديثا مدنيا مشهورا معمولا به عند أهل المدينة. {cite:muwatta-maruf-1997 p.288}"
