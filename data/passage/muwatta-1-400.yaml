label: { ar: "الموطأ 400 — ابن عمر: أصلي صلاة المسافر ما لم أجمع مكثاً وإن حبسني ذلك اثنتي عشرة ليلة", en: "Muwatta 400", es: "400 palabras", fr: "400 mots", ur: "400 الفاظ", tr: "El-Muvatta 400 — İbn Ömer: Kalmayı niyet etmediğim sürece, on iki gece orada kalsam bile, yolcu namazı kılarım.", id: "Al-Muwatta 400 — Ibn Umar: Aku melaksanakan salat musafir selama aku tidak berniat untuk menetap, meskipun itu membuatku berada di sana selama dua belas malam." }
text: "أصلي صلاة المسافر ما لم أجمع مكثاً، وإن حبسني ذلك اثنتي عشرة ليلة"
summary:
  ar: "أول أثر في باب صلاة المسافر ما لم يجمع مكثاً. يرويه يحيى عن مالك عن ابن شهاب عن سالم بن عبد الله أن عبد الله بن عمر كان يقول إنه يصلي صلاة المسافر ما لم يعزم على المكث، وإن حبسه ذلك اثنتي عشرة ليلة. ويفسر المحقق «أجمع» بعزم وصمم، ويذكر أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.212}"
  tr: "Yolcu namazı ile ilgili ilk hadis, kalmaya niyet etmediği sürece, Yahya'nın Malik'ten, o da İbn Şihab'tan, o da Salim ibn Abdullah'tan rivayet ettiğine göre, Abdullah ibn Ömer'in, kalmaya niyet etmediği sürece, on iki gece bile kalsa, yolcu namazı kıldığını söylediğidir. Araştırmacı, \"niyet etmek\" ifadesini \"karar vermek ve belirlemek\" olarak yorumluyor ve bunun Malik'ten Ebu Musab, Suveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Beyhaki tarafından da kaydedildiğini belirtiyor. {cite:muwatta-maruf-1997 s.212}"
  id: "Hadits pertama mengenai salat musafir, kecuali jika ia berniat menetap, diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Salim ibn Abdullah, bahwa Abdullah ibn Umar biasa berkata bahwa ia mengerjakan salat musafir kecuali jika ia berniat menetap, meskipun menetap selama dua belas malam. Peneliti menafsirkan \"berniat\" sebagai \"bertekad dan bertekad,\" dan menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.212}"
