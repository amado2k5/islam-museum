text: |-
  * ⁦(ناب الالف اللسنة)⁩ *
  ٥٣٥
  وفيها دليل على أن مايومأ اليه بعيد ولا موضع لها من الاعراب وتدخل ها على ذاك فتقول
  هذاك زيدولا تدخلها على ذلك ولا على أولئك كمالم تدخلها على تلك ولا تدخل الكاف على
  ذى للمؤنت وانماتدخلها على تاتقول تيك وتلك ولا نقل ذيلافانه خطأ وتقول فى التننية
  رأيت ذينك الرجلين وجانى ذائك الرحلان وربما قالواذانك بالتشديدوانماشددواتأ كيدا
  وتكبر الماسم لانه بقى على حرف واحدكما أدخلوا اللام على ذلك واغايفعلون مثل
  هذا فى الامماء المبهمة لنقصانها وتقول للمونث تانلا وتانك أيضا بالتشديد وابهع أولئمك
  وحكم الكاف قدذ كرناه فى تا وتصغيرذاذياك وتصغيرذلك ذيالكْ وقال
  . أو تحلنى بريك العلى * اى أبوذيالت الصبى
  وتصغير تلان تياك وأماذ والذى بعنى صاحب فلايسكون الامضافافان وصفت به نكرة أضفته
  الى ضكرة وان وصفت به معرفة أضفته الى الالف واللام ولا يجوز أن تضيفه الى مض رولا
  الى زيدو ما أشبهه تقول مررت برج-ل ذى مال وبامرأة ذات مال وبرجلين ذوى مال بفتح
  الواوكا قال تعالى وأشهدواذوى عدل منكم وبرجال ذوى مال بالكسر وبنسوة ذوات مال
  وياذوات الهام فتكسر التا فى المع فى موضع النصب كماتكسرتاء المسلمات تقول رأيت
  ذوات مال لانّ أصاهاها لانك لووقفت عليها فى الواحدلقات ذاه بالهاء ولكنم الماوصات
  بما بعدها صارت تاء وأصل ذوذوى مثل عصايدل على ذلكة ولهم هاتان ذوانامال قال
  نعالى ذوا تا أفنان فى التثنية ونرى أت الالف منقلبة من واو ثم حذفت من ذوى عين الفعل
  لكراهتهم اجتماع الواوين لإنه كان يلزم فى التننية ذووان مثل عصوان قبق ذامنونا ثم ذهب
  التنوين للاضافة فى قولك ذومال والاضافة لازمة له كما تقول قوزيذ وفاز يدقاذا أفردت
  قات هذا فم ولوسميت رجلاذ ولقلت هذا ذوى قد أ قب-ل قتردّماذهب لانه لا يكون اسم على
  حوفسين أحدهما حرف ليزلات التنوين يذهبه فيبقى على حرف واحدولونسبت اليهقات
  ذووى مثال عصوى وكذلا إذائسبت الى ذات لات التاء تحدّف فى النسبة فكانك أضفت
  الى ذى فرددت الواو ولوبجعت ذومال قلت هولاء ذوون لات الاضافسة قدزالت قال
  الكمين
  ولا أعنى بذلْ أسفليكم • ولكنى أريديه الذوينا
  يعنى به الاذ واموهم ملول المن من قضاعة المسمون بدى يزن وذى جسدن وذى نواس وذى
  فائسْ وذى أصبح وذى الكلاع وهم التبابعة وأماذ والتى فى لفسة طي بمعنى الذى فقها
  أن توصف يهبا المعارف تقول أناذوعرفت وذوسمعت وهسذه المرأة ذوقاات كذا يستوى
  فيه التننية والجمع والتأنيث قال الشاعر
  ذاكخليلى وذويعا تبي • يرمى وران بامسهم وامسله
  يريد الذى يعابني والوا والمتى قبله زائدة قال سيبويه ان ذا وحسدها بعنزلة الذى كقواهم
  ماذارأيت فتقول متاع ح-ن قال لبيد
  ألا تسألان المرماذايحاول • أغب فيقفى أم ضلال وباطل
  قال وتجرى مع ما عنزلة اسم واحد كقولهم ماذار أيت فتقول خيرا بالنصب كانه قال مارأيت
  ولو كان ذاههنا بمنزلة الذى لكان الجواب خير بالرفع وأماقواهم ذات مرّة وذوصباح فهومن
  قوله وتصغيرتلك تياك كذا
  فى جيع النسخ التى بأيدينا
  والظاهران يقول تيالك باللام
  وفى القاموس وتصغبرناتيا
  وتالنويالن اه
