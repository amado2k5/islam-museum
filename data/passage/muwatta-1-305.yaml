label: { ar: "الموطأ 305 — أبو بكر بن حزم: كنا ننصرف في رمضان فنستعجل الخدم بالطعام مخافة الفجر", en: "Muwatta 305" }
summary:
  ar: "أثر يرويه مالك عن عبد الله بن أبي بكر أنه سمع أباه أبا بكر بن محمد بن عمرو بن حزم يقول، في باب ما جاء في قيام رمضان: كانوا ينصرفون من قيام رمضان فيستعجلون الخدم بالطعام مخافة الفجر، لطول قيامهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي، وعلّقه البغوي. {cite:muwatta-maruf-1997 p.172}"
