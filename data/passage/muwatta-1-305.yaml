label: { ar: "الموطأ 305 — أبو بكر بن حزم: كنا ننصرف في رمضان فنستعجل الخدم بالطعام مخافة الفجر", en: "Muwatta 305", es: "Muwatta 305", fr: "Muwatta 305", ur: "موطا 305", tr: "El-Muvatta 305 — Ebu Bekir ibn Hazm: Ramazan ayında dışarı çıkar ve şafak sökmesinden korkarak hizmetçilerden bize yemek getirmelerini isterdik.", id: "Al-Muwatta 305 — Abu Bakr ibn Hazm: Kami biasa pergi selama Ramadan dan mendesak para pelayan untuk membawakan kami makanan karena takut akan fajar." }
summary:
  ar: "أثر يرويه مالك عن عبد الله بن أبي بكر أنه سمع أباه أبا بكر بن محمد بن عمرو بن حزم يقول، في باب ما جاء في قيام رمضان: كانوا ينصرفون من قيام رمضان فيستعجلون الخدم بالطعام مخافة الفجر، لطول قيامهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي، وعلّقه البغوي. {cite:muwatta-maruf-1997 p.172}"
  tr: "Malik'in, babası Ebu Bekir ibn Muhammed ibn Amr ibn Hazm'ı işittiği Abdullah ibn Abi Bekir'den rivayet ettiği bir hadiste, Ramazan gecesi namazları hakkında rivayet edilenler bölümünde şöyle denmektedir: Ramazan ayında gece namazlarını bitirdikten sonra, uzun süre ayakta durmaktan korktukları için, şafak sökmeden önce yemeği hizmetçilere getirmek için acele ederlerdi. Araştırmacı, bu rivayetin Ebu Musab ve Yahya ibn Bukayr tarafından Malik'ten, el-Beyhaki'nin derlemesinde nakledildiğini ve el-Baghawi'nin de tefsirinde yer aldığını belirtmektedir. {cite:muwatta-maruf-1997 s.172}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Abdullah ibn Abi Bakr, yang mendengar ayahnya, Abu Bakr ibn Muhammad ibn Amr ibn Hazm, berkata, dalam bab tentang apa yang telah diriwayatkan tentang salat malam di bulan Ramadhan: Mereka akan menyelesaikan salat malam mereka di bulan Ramadhan dan bergegas membawa makanan kepada para pelayan karena takut fajar, karena lamanya mereka berdiri. Peneliti menyebutkan bahwa Abu Musab dan Yahya ibn Bukayr meriwayatkannya dari Malik dalam koleksi al-Bayhaqi, dan al-Baghawi memasukkannya dalam komentarnya. {cite:muwatta-maruf-1997 p.172}"
