text: "… أَن أَبى لما حضرته الوفاة أَوصانى بصنم له يقال له ضِمَار فجعلته فى بيت وجعلت آتيه كلَّ يوم، فلما ظهر النبى كنت فى لِقَاح لى نصفَ النهار إذ طلعت علىَّ نعامة بيضاء مثل القُطْن عليها راكب أَبيض عليه ثياب بيض …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 1167، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
