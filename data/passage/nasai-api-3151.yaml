text: "… ابْنَ سَعِيدٍ الأَنْصَارِيَّ - قَالَ حَدَّثَنِي ذَكْوَانُ أَبُو صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" لَوْلاَ أَنْ أَشُقَّ عَلَى أُمَّتِي لَمْ أَتَخَلَّفْ عَنْ سَرِيَّةٍ وَلَكِنْ لاَ يَجِدُونَ حَمُولَةً وَلاَ أَجِدُ مَا أَحْمِلُهُمْ عَلَيْهِ وَيَشُقُّ عَلَيْهِمْ أَنْ يَتَخَلَّفُوا عَنِّي وَلَوَدِدْتُ أَنِّي قُتِلْتُ فِي سَبِيلِ اللَّهِ ثُمَّ أُحْيِيتُ ثُمَّ قُتِلْتُ ثُمَّ أُحْيِيتُ ثُمَّ قُتِلْتُ \". ثَلاَثًا."
summary:
  ar: "حديث في سنن النسائي، رقم 3151، يرد فيه ذكر «لولا أن أشق على أمتي». يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 3151 (The Book of Jihad), whose wording mentions 'were it not that I would burden my community'. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 3151، جس کے الفاظ میں «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا» کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 3151, dont le texte mentionne « si je ne craignais d'accabler ma communauté ». Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 3151, cuyo texto menciona «si no temiera agobiar a mi comunidad». El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de 3151 numaralı hadiste, \"Ümmetimin başına zorluk çekmeseydim...\" denmektedir. Bu hadis, farz, ibadet, sünnet, haram ve küçük günahları derleyen kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Derleyen kişi metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3151, menyebutkan, \"Sekiranya bukan karena aku ingin menyulitkan umatku.\" Hadits ini disusun oleh penyusunnya mengenai amalan wajib, ibadah, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
