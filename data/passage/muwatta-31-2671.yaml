label: { ar: "الموطأ 2671 — ابن شهاب عن أبي بكر بن عبيد الله بن عمر: الشيطان يأكل بشماله ويشرب بشماله", en: "Muwatta 2671", es: "Muwatta 2671", fr: "Muwatta 2671", ur: "موطا 2671", tr: "El-Muvatta 2671 — İbn Şihab, Ebu Bekr ibn Ubeyd Allah ibn Ömer'den rivayetle: Şeytan sol eliyle yer, sol eliyle içer.", id: "Al-Muwatta 2671 — Ibn Shihab, berdasarkan riwayat Abu Bakr ibn Ubayd Allah ibn Umar: Setan makan dengan tangan kirinya dan minum dengan tangan kirinya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي بكر بن عبيد الله بن عبد الله بن عمر عن عبد الله بن عمر أن رسول الله قال: إذا أكل أحدكم فليأكل بيمينه، وليشرب بيمينه، فإن الشيطان يأكل بشماله ويشرب بشماله. ويذكر المحقق أن الصواب في اسم الراوي «أبو بكر بن عبيد الله»، وأن في سماعه من جده خلافا عند البخاري وأبي زرعة والدارقطني، وأن الترمذي صحح رواية مالك وابن عيينة. {cite:muwatta-maruf-1997 p.508} {cite:muwatta-maruf-1997 p.510}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Bekir ibn Ubeyd Allah ibn Abdullah ibn Ömer'den, o da Abdullah ibn Ömer'den rivayet ederek, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Sizden biri yemek yerken sağ eliyle yesin, sağ eliyle içsin; çünkü şeytan sol eliyle yer, sol eliyle içer.\" Araştırmacı, ravinin doğru isminin \"Ebu Bekir ibn Ubeyd Allah\" olduğunu ve Buhari, Ebu Zura ve Darakuni arasında, bunu dedesinden mi duyduğu konusunda ihtilaf bulunduğunu belirtmektedir. Tirmizi, Malik ve İbn Uyayne'nin rivayetini sahih kabul etmiştir. {cite:muwatta-maruf-1997 s.508} {cite:muwatta-maruf-1997 s.510}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Abu Bakr ibn Ubayd Allah ibn Abdullah ibn Umar, dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: “Apabila salah seorang dari kalian makan, hendaklah ia makan dengan tangan kanan dan minum dengan tangan kanan, karena setan makan dan minum dengan tangan kiri.” Peneliti menyebutkan bahwa nama perawi yang benar adalah “Abu Bakr ibn Ubayd Allah,” dan terdapat perbedaan pendapat di antara al-Bukhari, Abu Zur’ah, dan al-Daraqutni mengenai apakah ia mendengarnya dari kakeknya. Al-Tirmidhi mengesahkan riwayat Malik dan Ibn Uyaynah. {cite:muwatta-maruf-1997 p.508} {cite:muwatta-maruf-1997 p.510}"
