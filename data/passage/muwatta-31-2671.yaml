label: { ar: "الموطأ 2671 — ابن شهاب عن أبي بكر بن عبيد الله بن عمر: الشيطان يأكل بشماله ويشرب بشماله", en: "Muwatta 2671" }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي بكر بن عبيد الله بن عبد الله بن عمر عن عبد الله بن عمر أن رسول الله قال: إذا أكل أحدكم فليأكل بيمينه، وليشرب بيمينه، فإن الشيطان يأكل بشماله ويشرب بشماله. ويذكر المحقق أن الصواب في اسم الراوي «أبو بكر بن عبيد الله»، وأن في سماعه من جده خلافا عند البخاري وأبي زرعة والدارقطني، وأن الترمذي صحح رواية مالك وابن عيينة. {cite:muwatta-maruf-1997 p.508} {cite:muwatta-maruf-1997 p.510}"
