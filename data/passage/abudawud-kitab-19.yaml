summary:
  ar: "القسم 19 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفرائض»، ويضم فيها النصوص من 2885 إلى 2927 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 19 of Sunan Abi Dawud (Shares of Inheritance (Kitab Al-Fara'id)) in the division of the open hadith dataset the museum took its reports from: reports 2885 to 2927 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 19، عنوان «کتاب الفرائض»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2885 تا 2927۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 19 de Sunan Abi Dawud (Partes de la Herencia (Kitab Al-Fara'id)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2885 al 2927, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
