text: |-
  ⁦(١)⁩ هذا البيت سبأنف أول
  باب السين
  ٢٨٦
  ⁦(باب الرا.)⁩
  ⁦(بصر)⁩
  فأعنهم وابتر بما بشروابه • واذاهم نزلوا بضنك فانزل
  ويروى وايسر بعايسروابه وأتانى أمربشرت به أى سررت به وبشرتى فلان بوجه حسن أى
  لقيف وهوحسن البشر بالكسرأى طلق الوجه والبشرأيضااسم جبل بالجزيرة واسم ماء ابف
  تغلب ويشرى اسم رجل لا يتصرف فى معرفة ولا ف نكرة لللمأنيت ولزوم حرف التأنيث
  لوان لم يكن مفة لان هذه الالف يبنى الاسم اء افصارت كانها من نفس الكذسمة وليست
  كالهاء التى تدخل على الاسم بعد التذ كيروة وله تعالى يابشراى ه-ذاغلام كقولك عصاى
  وتقول فى التثنية بإبشريى والبشارة المطلقة، تمكون الاباظلطيروانما تسكون بالشراذا كانت
  قيدة به كقوله تعالى فيشرهم بهذاب أليم وتاشر القوم أى بشر بعضهم بعضا والتباشيمر
  البشرى وتباشير الصبح أوائله وكذلك أوائل كل شى ولا يكون منه فعل والبسير المبشم
  والمبشرات الرياح التى تبشر بالقيت والبشير الجيل وامرأة بشيرة ونافة بشيرة أى جسئة قال
  الراجز
  تعرف فى أوجهها اليشار • آسان كل آفق مشاجر
  والبشارة بالفتح الهال قال الشاعر ورأت بأن الشيب با تبه البثاشة والبشاره
  والتبشر طائر يقال هوالصفارية صر البصرحاسة الرؤية وأبصرت الذرأيته
  والبصير خلاف الضر يروباصرته اذا أشرفت تنظر اليه من بيعيد والبصر العلم وبصرت بالشئ
  علمته قال اللّٰه تعالى بصرت بعالم يبصروابه والبصير العالم وقد بصر بصارة والتبصر التأمل
  والتعرف وانتبصير التعريف والايضاح وقول الشاءر
  قرنت مجقويه ثلاثافلم يزغ عن القصدحى بصرت بدمام
  يعنى على ريس السهم بالبصيرة وهى الدم والمبصرة المضيئة ومنه قوله تعالى فلاجاء ه-م آياتنا
  مبصرة قال الاخفر إنها تبصرهم أى تجعلهم يصراء والبصرة بالنتح الجسة والبصرة عجارة
  رخوة الى البياض ماهى وبهاسميت البصرة وقال ذوالرمة
  تداعين باسم الشيب فى متنلم • جوانيه من بصرة وسلام
  فاذا أسقطت منه الهاهقلت بصر بالمكسر قال عباس بن مرداص
  ان كنت جلود بصرلا أربسه • أوقد عليه فأحيه فيمنصدع ١
  والبصرتان الكوفة والبصرة وتبصر القوم تبصيرا أى صاروا الى البصرة أبوعروالبصيرة
  ما بين شقق البيت وهى البصار والبصيرة الجة والاسصار فى الشوقوله تعاء بل الانسان
  على نفسه بصيرة قال الاخفس- عله هو البصيرة كما بقول الرجل للرجل أنت عجة على نفسك
  أبوز يدالصيرة من الدم ما كان على الارض والجدية مالزق بالحسد وقال الاصمعى البصيرة
  شمن الدم يستدل به على الرمية وأبوعمرومثله وقول الجعنى
  راحوابصائرهم على أكتافهم • وبصيرتى يعد وبه اعتدوأى
  يقول إنهم تركوادم أبيهم وجملوه خلفهم أى لم يثأروابه وأناطلبت:أرى وكان أبو عبيدة
  يقول البصيرة فى هذا البيت الترس أوالدرع وكان يرويه -لوابص ترهم البصر أن يضم أدي
  الى أديم فيخرزان كماتخاط حاشيتا الشوب فتوضع ا-داد ما فوق الاخرى وهو خلاف
  خياطة
