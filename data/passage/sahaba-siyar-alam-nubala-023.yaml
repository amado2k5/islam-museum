text: "٥٧/٩ ،١٥٣٠ الدفاع عن عبد الرزاق ورد اتهامه بالكذب . العقيلي في كتاب ((الضعفاء)) له، في ترجمة عبد الرزاق: حدثنا محمد بن أحمد بن حاد، سمعت محمد بن عثمان الثقفي، قال: لما قدم العباس بن عبد العظيم من عند عبد"
