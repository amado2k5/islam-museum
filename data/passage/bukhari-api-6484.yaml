label: { ar: "صحيح البخاري 6484 — وصف المسلم", en: "Sahih al-Bukhari 6484 — a description of the Muslim", ur: "صحیح بخاری 6484 — مسلمان کا وصف", es: "Sahih al-Bukhari 6484 — una descripción del musulmán", fr: "Sahih al-Bukhari 6484 — une description du musulman", tr: "Sahih el-Buhari 6484 — Müslümanın Tanımı", id: "Sahih al-Bukhari 6484 — Deskripsi tentang Muslim" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا زَكَرِيَّاءُ، عَنْ عَامِرٍ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ عَمْرٍو، يَقُولُ قَالَ النَّبِيُّ \" الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللَّهُ عَنْهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6484، يذكر وصف المسلم. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6484 (To make the Heart Tender (Ar-Riqaq)), that mentions a description of the Muslim. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6484، جس میں مسلمان کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6484 (Para ablandar el corazón (Ar-Riqaq)), menciona una descripción del musulmán. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 6484 (Pour attendrir le cœur (Ar-Riqaq)), mentionne une description du musulman. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih el-Buhari'de 6484 numaralı hadis, bir Müslümanın özelliklerini anlatmaktadır. Bu hadis, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin nitelikleri ile birlikte, bir okuyucu tarafından derlenmiş olup, bu dört kategori içinde Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetler içermektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6484, menjelaskan karakteristik seorang Muslim. Hadits ini, bersama dengan rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin, disusun oleh seorang pembaca dan mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka dalam empat kategori tersebut."
