text: "… وأكلَه وَمَمَرَّه على الأَرضِ بمعصيتِه، وحَرَّمْتَ على الآخَرِ نَكاحَه وبَيْعَه بمعصيتِه ؟ - قيلَ : هذا أُمِرَ بأمرٍ فى مُباحِ. حلالٍ له، فأحْلَلْتُ له ما حَلَّ له، وحَرَّمْتُ عليه ما حُرّم عليه، وما حُرّم عليه غيرُ ما أحِلَّ له، ومعصيتُه …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 469، يرد فيه ذكر المباح، وما حرّم الله ورسوله، وما حُرّم على الناس؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 469, whose wording mentions the permitted (mubah), what God and His Messenger forbade, what was forbidden to people; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 469 کا اقتباس جس میں مباح، جو اللہ اور اس کے رسول نے حرام کیا، جو لوگوں پر حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
