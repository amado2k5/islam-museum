text: |-
  • (عكاn
  وبات وليد الحىّ طيان ساغبا * وكاعبهم ذات العفاوة أسغب
  تقول منه عفوت له من المرق اذا غرفت له أوّلا وآ ترته به وقال بعضهم العفاوة بالكسر أقل
  المرق وأجوده والعفاوة بالضم آخره يردّها مستعير القدر مع القدر يقال منه عفوت القدر
  اذا تركت ذلك فى أسفلها وأنتدلعوف بن الاحوص الباهلى
  فلاتسألين واسألى عن خليقى * اذاردعافى القدرمن يستعيرها
  وقال الاصمعى العافى ما ترك فى القدر وأنشد هذا البيت وعفت الريح المنزل درسته وعفا
  المنزل يعفودرس يتعدى ولا يتعدّى وتعفت الداردرستو عفتها الريح شتد للمبالغة وقال
  أهاجك ربع دارس الرسم باللوى • لاسهاءعفى آيه الموروالقطر
  ويقال أيضاء فى على ما كان منه اذا أصلح بعد الفاد والعفى جمع عاف وهو الدارس
  وعفوت عن ذنيه اذاتركنه ولم تعاقبه والعفوّ على فعول الكثير العفو وعفا الماء اذ الم يطرقه
  شيء يكدّره وعفا الشعر والنبت وغيرهما كثرومنه قوله تعالى حتى عفوا أى كثروا وعفوته
  أنا وأعفيته أيضالغتان اذافعات ذلك به وفى الحديث أمر أن تحفى الشوارب وتعقى اللحى
  والعافى الطويل الشعروعفوته أى أتيته أطلب معروفه واعتفيته مثله والعفاة طلاب
  المعروف الواحدعاف وقد عفا يعفو وفلان تعفوه الاضياف وتعتغيه الاضياف وهو كثير
  العفاة وكثير العافية وكثير العفىّ ( قا ، العقاة والعقوة الساحة وماحول الداريقال
  اذهب فلا أرينك بعقوة وتقول ما يطور بعقونه أحد والعقى بالكسر ما يخرج من بطن السبى
  قبل أن يأكل يقال عقى الصى يعقى عقيا اذا أحدث أول ما يحدث وبعد ذلكْ مادام صغيرا
  يقال فى المثل أحرص من كاب عسلى عقى صبىّ وهو الردج من السخلة والمهر والعقيات من
  الذهب الخالص يقال هو ما ينبت نباتا فى معدنه وليس مما يحصل من الإارة وعقاه يعقوه أى
  عاقه على القلب وأنشدأ بو عبيد لميد
  ولو أنى رميتك من بعيد لعاقك عن دعاء الذئب عاقى
  والاعتقاء الاحتباس وهوقلب الاعتياق والاعتقاء أن يأخذ الحافر فى البثريمنة ويسرة اذا
  لم يمكنه أن ينبط الماء من قعرها وكذلك الاخذ فى شعب الكلام ومنه قول رؤبة
  ويعتقى بالعقم التعقيما، وأعق الشاذا اشتدت مرارته وأعقيت الشئاذا أزلته من فيك
  لمرارته كما تقول أشكيت الرجل اذا أزاته عما يشكوه وفى المثل لاتكن حلوا فتسترط ولامرًا
  فتعقى وعقى بهمه اذارمى به فى الهواءلغة فى عقه قال المتنخل الهذلىّ
  عقوابسهم فلم يشعربه أحد * ثم استفاؤا وقالواحبذا الوضح
  وقد ذ كرناه فى باب القاف وعقى الطائراذا ارتفع فى طيرانه ⁦(عكا)⁩ العكوة بالضم
  أصل ذنب الدابة حبت عركد من الشعر من مغرز الذنب والجمعء-كا ومنسه قول الشاءر
  حتى توليك عكا أذنابها* وعكوت ذنب الدابة عكوا اذا عقدته والعكىّ من ألبان الضأن
  ماحلب بعضه على بعض فاشتد وغلظ قال الراجز
  وشريتان من عكى الضأن • أليز مسافى حوايا البطن
  وعكت الناقة أى سمنت وغلظت ويقال مائة معكاء أى سمان غلاظ والعكواء الشاة التى
  ايص
