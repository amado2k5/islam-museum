text: "الله يهدي من يشاء وهو أعلم بالمهتدين، يا أخا تنوخ إني كتبت بكتاب إلى كسرى والله ممزقه وممزق ملكه، وكتبت إلى النجاشي بصحيفة فخرقها والله مخرقه ومخرق (٢) ملكه، وكتبت إلى صاحبك بصحيفة فأمسكها، فلن يزال الناس يجدون منه بأسا"
