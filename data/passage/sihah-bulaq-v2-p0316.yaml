text: |-
  • ⁦(باب الميم)⁩*
  ٢٧١٠
  وألقى ذلان على جشمه يضم الجيم وفتح الشين أى ثقله وجسم البعير صدره وجشم أيضاحى
  من الانصار وهو جشم بن الخزر.ج وكان يقال
  ان سرّك العسز فجغجح بجشم• وجشم فى ثقيف وهو جشم بن ثقيف وجسم حىّ من تغلب
  وهم الاراقم وجشم فى*وازن وهو حشم بن معاوية بن بكر بن هوازن جعم الجعم
  بالتحريك الطمع يقال جعم بالكسر جعما وجم أيضا اذا قرم الى اللحم وهوفى ذلكْ أكول قال
  العجاج • اذجعم الذهلان كل مجعم • أى جعموا الى اللحم وجعمت الابل أيضا اذ الم تجد
  حضا ولا عضاها فتقرم الى ذلك فتقضم العظام وخروء الكلاب قرما الى ذلاك وجعم الرجل اذا
  لم يشته الطعام والجععاء من النوق المسنة ولا يقال للذكرأجعم جعسم . لجعشم الرجل
  القصير الغليظ مع شدّة قال الفراءفتح الجيم والشين فيه أقصح ( جلم جات الشئ جلما أى
  طعته وجات الحزور أجلها جلا اذا أخذت ما على عظامها من اللحم وأخذت الشئ بجلنه
  ساكنة اللام اذا أخذته أجمع وهذه جلمة الجزور بالتحريك أى لحها أجمع وجلة الشاة
  مسلوختها بلاحوولاقوائم والجلم الذى يجزبه وهماجلان والجلام بالكسر الجداه
  قال الاعشى
  سواهم جذعانها كالخلام • أقرج منها القياد الذ-.ورا
  لخم يقال اجلخم القوم اجلخما ما اجتعوا وبقال استكبروا وقال
  نضر ب جعيهم إذا اجلذموا * ( لهم الجلهمة بالضم الذى فى حديث أبى سقيان
  ماحب دت تأذن لى حتى تأذن بجمارة الجلهمتين قال أيو عبيدد أراد باني الوادى
  والمعروف الجلهتان قال ولم أسمع بالجلهمة الافى هذا الحديث وماجاءت الاولها أصل
  وجلهمة بالضم اسم رجل م جمّ المال وغيره اذا كثر والجتمّ الكثير قال تعالى
  وتحبون المال حباجا وجتمّ ملك من الملول: الاولين والجتمّ ما اجتمع من ما البستر قال صخر
  الهذلى
  فضخضت صفنى فى بجه * خياض المدابرقد حاعطوفا
  وابلهة المكان الذى يجتمع فيه ماؤه والجمع الجهام والجوم البئتر الكثيرة الماء والجهوم بالضم
  المصدريقال جمّ الماه يجمّ جوما اذا كثر فى البئروا جتمع بعدما استق مافيها وقال
  يزيدها مخج الدلاجوماه والجوم بالفتح من الافراس الذى كلما ذهب من سه جرى باءه برى
  آخر قال الخرين نواب
  جوم الشدشائلة الذنابى * تخال بياض غزتهامراجا
  قوله شائلة الذنابي يعنى أنها ترفسع ذنبها فى العدو ويقال جاء فى جمة عظيمة وجة عظيمة أى
  فى جماعة يسألون الدية قال * وجة تسألنى أعطيت+والهة بالضم مجتم-ع شعر الرأس وهى
  أكثر من الوفرة ويقال للرجل الطويل الجهة جمانى بالنون على غيرقياس ولوسميت بهارجلا
  ثم نسبت اليمقلت جى وجهام المكوك وجحامه وجمامه وجمه بالتحريك وهو ماءلى رأسه
  فوق طفافه وجمت المكيال وأجمته فهوجان اذا بلغ السكيل حامه قال الغراء عندى بهام
  القدح ماء بالكسر أى ماؤه وجام المكوك دقية ابالضم وجام الفرس بالفتح لاغير قال ولا تقل
