text: "… بن اسحاق عن ابيه عن جده محمد بن عبد اللّه بن سامان بن أكيمة الليثى قان قلت يارسول اللّه انا نسمع منك شيأ لا نستطيع نرويه كما نسمعه قاناذا لم تحلوا حراما ولم تحوموا حلالا وأسبتم المعني فلا بأس وعمر …"
