label: { ar: "موطأ مالك 1310 — النسب والانتساب", en: "Muwatta Malik 1310 — paternity and lineage", ur: "موطأ مالک 1310 — نسب اور انتساب", es: "Muwatta Malik 1310 - paternidad y linaje", fr: "Muwatta Malik 1310 — paternité et lignée" }
text: "… التَّمْرُ بِالتَّمْرِ مِثْلاً بِمِثْلٍ \". فَقِيلَ لَهُ إِنَّ عَامِلَكَ عَلَى خَيْبَرَ يَأْخُذُ الصَّاعَ بِالصَّاعَيْنِ. فَقَالَ رَسُولُ اللَّهِ \" ادْعُوهُ لِي \". فَدُعِيَ لَهُ فَقَالَ لَهُ رَسُولُ اللَّهِ \" أَتَأْخُذُ الصَّاعَ بِالصَّاعَيْنِ \". فَقَالَ يَا رَسُولَ اللَّهِ لاَ يَبِيعُونَنِي الْجَنِيبَ بِالْجَمْعِ صَاعًا بِصَاعٍ. فَقَالَ لَهُ رَسُولُ اللَّهِ \" بِعِ الْجَمْعَ بِالدَّرَاهِمِ ثُمَّ ابْتَعْ بِالدَّرَاهِمِ جَنِيبًا \"."
summary:
  ar: "حديث في موطأ مالك، رقم 1310، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1310 (Business Transactions), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1310، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1310 (Transacciones comerciales), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Muwatta Malik, n° 1310 (Transactions commerciales), mentionne la paternité et la lignée. Le site « Paternité en Islam » répertorie ce sujet avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
