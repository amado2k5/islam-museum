text: "… بن الحسن الكرخى ثنا على بن أحمد الحوارزمى قال: حدثنى الربيع بن سليمان قال : سأل رجل من أهل بلخ السافى عن الايمان. فقال للرجل : فما تقول أنت فيه أقال أقول : إن الايمان قول قال ومن أين قلت …"
summary:
