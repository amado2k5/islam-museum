text: "… بْنِ قَارِظٍ، عَنِ السَّائِبِ بْنِ يَزِيدَ، عَنْ رَافِعِ بْنِ خَدِيجٍ، عَنِ النَّبِيِّ قَالَ \" أَفْطَرَ الْحَاجِمُ وَالْمَحْجُومُ \". قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ عَلِيٍّ وَسَعْدٍ وَشَدَّادِ بْنِ أَوْسٍ وَثَوْبَانَ وَأُسَامَةَ بْنِ زَيْدٍ وَعَائِشَةَ وَمَعْقِلِ بْنِ سِنَانٍ وَيُقَالُ ابْنُ يَسَارٍ وَأَبِي هُرَيْرَةَ وَابْنِ عَبَّاسٍ وَأَبِي مُوسَى وَبِلاَلٍ. قَالَ أَبُو عِيسَى وَحَدِيثُ رَافِعِ بْنِ خَدِيجٍ حَدِيثٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 774، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 774 (The Book on Fasting), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 774، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
