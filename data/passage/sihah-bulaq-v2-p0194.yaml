text: |-
  • (باب النون
  ، :عطان)• .
  ٣٩٣
  وهو أوّل الانف حيث يكون فيه الشمم يقال هم شم العرانين والعرانية بالضم ما يرتفع
  فى أعالى الماء من غوارب الموج قال عدى بن زيد العبادى يصف طوفان نوح عليه السلام
  كانت رياح وماءذوءرانية • وظلمة لم تدع فتقا ولاخللا
  .الاصمعىّ العران العود الذى يجعل فى وترة أنف البختى وقدء رنت البعير أعرنه بالضم عرنا
  وهران البكرة عودهاو يشقفيه انخطاف ورمح معرّن اذاسمر سفانه بالعران وهوالمسمار.
  والعران بعد الداريقال دارهم عارنة أى بعيدة والعرن جسأة فى رجل الدابة فوق الرسغ من
  اخروهو الشقاق وقد عرنت رجل الدابة بالكسروء ون البعير أيضايعون عرنا قال ابن
  السكيت هو قوح يأخذه فى عنقه فيهتك منه ور بمابرك الى أصل شجرة وا-تك بها قال
  ودواؤه أن يحرق عليه الشحم وعربنة بالضم اسم قبدلة ورهط من العرنيين ارتدوافقتله.
  رسول اللّٰه على اللّٰه عليه وسلم والعرين والعر بنسة مأوى الاسد الذى يألفه يقال ليث عرين(ا
  وليث عوينة وليث غابة وأصل العرين جماعة الشجر ويقال العرين اللحم وينشد
  •وشمة الاطراف رخص عوينها* وعرين أيضابطن من تميم وعرينة مصغرة بطن من مجيلة
  وقال جرير عوين من عرينة ليس منا * برتت الىء رينة من عرين
  والعرنة بالمكسر الصريع الذى لا يطاق وعرنان اسم جبل بالجذاب دون وادى القرى الى قيد
  وسقاء معرون دبغ بالعرنة وهوخشب الظمخ وهو شجر أبو عمرو العرنة عروق العرنتن
  ⁦( عربن)⁩ العربون والعربون والعريان الذى تسميه العامة الربون يقال منسه عربنته اذا
  أعطيته ذلك رتن) العرثن نيت يديخ به قال انخليل أصله عرتتن مثل قرنفل حذفت منه
  النون وترك على صودته ويقال عرتن مثل عرفج وأديم معرتن أى مدبوغ بالعرقى وعريتنات
  موضع وقدذ كرناصرفه فى عرفات ( رجن العرجون أصل العذق الذى يعوج وققطع
  منه الشماريخ فيقى على النخل بابساوعر جته ضربه بالعرجون ⁦(عرهن)⁩ جل عراهن أى
  عظيم مثل عراهم ن العسن نجوع العلف فى الدواب وقدعذت الابل بالكسر
  اذا نجع فيها المكلل وسمنت ودابة عسن أى شكور والعن بالضم الشهم القديم مثل الاسن
  وأعسان الشى آثاره ومكانه وتعسن فلان أباه أ نزع اليه ف الشبه وتعسذت الشى تطلبت
  أثره ومكانه(عشن، عشن واعتشن أى قال برأيه ويقال العشانة أصل السعفة وبها كنى
  أبوعشانة شزن العشوزن الصلب الشديد الغليظ والاننى عشورّنة وقال حمروين
  كانوم يصف قناه
  عشوزنة اذا غمزت أرنت • تشيجّ قفا المثنف والجبينا
  ⁦( عطن)⁩ عطنت الجلد أ عطفه عطنافهو معطون اذا أخسذت علق وهونيت أوفرثا ومطا
  فألقيت الجلدفيه وغممته ليتفسخ صوفه ويسترخى ثم تلقيه فى الدياغ وعطن الاهاب بالكسر
  بعطن عطما فهو عطن اذا أنتن وسقط صوفه فى العطن وقدانعطن الاهاب والعطن
  والمعطن واحد الاعطان والمعاطن وهى مبارك الابل عند الماء لتشرب عالابعد خل فاذا
  مستوفت ردّت الى المراعى والاظماه وعطنت الابل بالفتح تعطن وتعمان عطونا اذارويت
  ثم يركت فهى ابل عاطسة وعواطن وقد ضربت الابل بعطن أى بركت قال كعب بن زهير
  بأن لادخال وأن لا عطونا» وقد أعطنتها أنا قال ابن السكيت وكذلْ تول هذاعطن الغنم
