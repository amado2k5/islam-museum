label: { ar: "جامع الترمذي 2132 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 2132 — what was made lawful; what is not lawful", ur: "جامع ترمذی 2132 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 2132 — lo que se ha hecho lícito; lo que no es lícito" }
text: "… عَنْ حُسَيْنٍ الْمُعَلِّمِ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، حَدَّثَنِي طَاوُسٌ، عَنِ ابْنِ عُمَرَ، وَابْنِ، عَبَّاسٍ يَرْفَعَانِ الْحَدِيثَ قَالَ \" لاَ يَحِلُّ لِلرَّجُلِ أَنْ يُعْطِيَ عَطِيَّةً ثُمَّ يَرْجِعَ فِيهَا إِلاَّ الْوَالِدَ فِيمَا يُعْطِي وَلَدَهُ وَمَثَلُ الَّذِي يُعْطِي الْعَطِيَّةَ ثُمَّ يَرْجِعُ فِيهَا كَمَثَلِ الْكَلْبِ أَكَلَ حَتَّى إِذَا شَبِعَ قَاءَ ثُمَّ عَادَ فِي قَيْئِهِ \". قَالَ أَبُو عِيسَى هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2132، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2132 (Chapters On Wala' And Gifts), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2132، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2132 (Capítulos sobre Wala' y Donaciones), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
