  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 2, p. 268, that mentions cupping, pain, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
