text: "… يجذب الجلد الى داخل الكأس وبه كمية من الدم. تفيد في تخفيف الألام الروماتيزمية، واوجاع الصدر، حيث تنشط الدورة الدموية، وتفيد حالات عسر البول، الناتجة عن التهاب الكلية. أما الحجامة الرطبة فتختلف عن الحجامة الجافة بإحداث جروح سطحية بالمشرط طول …"
