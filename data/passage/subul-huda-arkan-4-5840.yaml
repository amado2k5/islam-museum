text: "… أبشر الناس؟ قال: لا. إنى أخاف أن يتكلوا. رواية مسلم : عن أبى هريرة قال: جاء ناس من أصحاب النبى فسألوه، إنا نجد فى أنفسنا ما يتعاظم أحدنا أن يتكلم به قال : وجدتموه؟ قالوا: نعم. قال: ذاك صريح الإيمان. …"
