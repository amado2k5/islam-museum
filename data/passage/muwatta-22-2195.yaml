label: { ar: "الموطأ 2195 — مالك عن داود بن الحصين عن أبي غطفان بن طريف المري: قال عمر بن الخطاب من وهب هبة لصلة رحم أو على وجه صدقة فإنه لا يرجع فيها، ومن وهب هبة يرى أنه إنما أراد بها الثواب فهو على هبته يرجع فيها إذا لم يرض منها", en: "Muwatta 2195", es: "Muwatta 2195", fr: "Muwatta 2195", ur: "موطا 2195", tr: "El-Muvatta 2195 — Malik, Davud ibn el-Hüseynin'den, o da Ebu Gatfan ibn Tarif el-Murri'den rivayetle: Ömer ibn el-Hattab şöyle dedi: Akrabalık bağlarını korumak veya sadaka olarak bir hediye veren kimse, onu geri alamaz. Ancak, yalnızca sevap kazanmak amacıyla bir hediye veren kimse, ondan memnun kalmazsa geri alabilir.", id: "Al-Muwatta 2195 — Malik, berdasarkan riwayat Dawud ibn al-Husayn, berdasarkan riwayat Abu Ghatfan ibn Tarif al-Murri: Umar ibn al-Khattab berkata: Barang siapa memberi hadiah untuk menjaga hubungan kekerabatan atau sebagai sedekah, ia tidak dapat mengambilnya kembali. Tetapi barang siapa memberi hadiah dengan keyakinan bahwa ia hanya bermaksud untuk mendapatkan pahala, ia dapat mengambilnya kembali jika ia tidak puas dengan hadiah tersebut." }
summary:
  ar: "يروي مالك عن داود بن الحصين عن أبي غطفان بن طريف المري أن عمر بن الخطاب قال: من وهب هبة لصلة رحم، أو على وجه صدقة، فإنه لا يرجع فيها. ومن وهب هبة يرى أنه إنما أراد بها الثواب، فهو على هبته يرجع فيها إذا لم يرض منها. {cite:muwatta-maruf-1997 p.300}"
  tr: "Malik, Davud ibn el-Hüseynin'den, o da Ebu Gatfan ibn Tarif el-Murri'den rivayet ettiğine göre, Ömer ibn el-Hattab şöyle buyurmuştur: \"Kim akrabalık bağlarını korumak veya sadaka olarak bir hediye verirse, onu geri alamaz. Ancak kim bir hediyeyi sadece sevap için verdiğine inanarak verirse, memnun kalmazsa geri alabilir.\" {cite:muwatta-maruf-1997 s.300}"
  id: "Malik meriwayatkan dari Dawud ibn al-Husayn, dari Abu Ghatfan ibn Tarif al-Murri, bahwa Umar ibn al-Khattab berkata: “Barang siapa memberi hadiah untuk menjaga hubungan kekerabatan, atau sebagai sedekah, maka ia tidak dapat mengambilnya kembali. Tetapi barang siapa memberi hadiah dengan maksud hanya untuk mendapatkan pahala, maka ia boleh mengambilnya kembali jika ia tidak puas dengan hadiah tersebut.” {cite:muwatta-maruf-1997 p.300}"
