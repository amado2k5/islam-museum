label: { ar: "الموطأ 2195 — مالك عن داود بن الحصين عن أبي غطفان بن طريف المري: قال عمر بن الخطاب من وهب هبة لصلة رحم أو على وجه صدقة فإنه لا يرجع فيها، ومن وهب هبة يرى أنه إنما أراد بها الثواب فهو على هبته يرجع فيها إذا لم يرض منها", en: "Muwatta 2195" }
summary:
  ar: "يروي مالك عن داود بن الحصين عن أبي غطفان بن طريف المري أن عمر بن الخطاب قال: من وهب هبة لصلة رحم، أو على وجه صدقة، فإنه لا يرجع فيها. ومن وهب هبة يرى أنه إنما أراد بها الثواب، فهو على هبته يرجع فيها إذا لم يرض منها. {cite:muwatta-maruf-1997 p.300}"
