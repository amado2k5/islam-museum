text: "… ذلك في الرأس أولى لأن جعل الثقيل في الأعالي أسوأ من جعله فيما دون ذلك غاية ما في الباب أن يقال له: لو لم تجعل عظام الرأس متصلة لكانت الوقاية تقل. فنقول: وفي الصدر كذلك أيضاً بل وجوب زيادة الوقاية …"
