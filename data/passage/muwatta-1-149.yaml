label: { ar: "الموطأ 149 — بلاغ عن سالم وسليمان بن يسار: لا يصيبها حتى تغتسل", en: "Muwatta 149" }
summary:
  ar: "بلاغ في باب ما يحل للرجل من امرأته وهي حائض: يروي مالك أنه بلغه أن سالم بن عبد الله وسليمان بن يسار سُئلا عن الحائض هل يصيبها زوجها إذا رأت الطهر قبل أن تغتسل، فقالا: لا، حتى تغتسل. ويذكر المحقق أنه رواه عن مالك أبو مصعب وزيد بن الحباب وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.103} {cite:muwatta-maruf-1997 p.104}"
