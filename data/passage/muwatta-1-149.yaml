label: { ar: "الموطأ 149 — بلاغ عن سالم وسليمان بن يسار: لا يصيبها حتى تغتسل", en: "Muwatta 149", es: "Muwatta 149", fr: "Muwatta 149", ur: "موطا 149", tr: "El-Muvatta 149 — Salim ve Süleyman ibn Yasar'dan rivayet edildiğine göre: Kadın gusül abdesti alana kadar ona dokunmamalıdır.", id: "Al-Muwatta 149 — Diriwayatkan dari Salim dan Sulayman ibn Yasar: Dia tidak boleh menyentuhnya sampai dia melakukan ghusl (mandi ritual)." }
summary:
  ar: "بلاغ في باب ما يحل للرجل من امرأته وهي حائض: يروي مالك أنه بلغه أن سالم بن عبد الله وسليمان بن يسار سُئلا عن الحائض هل يصيبها زوجها إذا رأت الطهر قبل أن تغتسل، فقالا: لا، حتى تغتسل. ويذكر المحقق أنه رواه عن مالك أبو مصعب وزيد بن الحباب وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.103} {cite:muwatta-maruf-1997 p.104}"
  tr: "Kadın adetliyken bir erkeğin karısıyla cinsel ilişkisinin caiz olup olmadığına dair bir rivayet: Malik, Salim ibn Abdullah ve Süleyman ibn Yasar'a, adetli bir kadının gusül abdesti almadan önce temizlik belirtileri görmesi halinde kocasıyla cinsel ilişkiye girip giremeyeceği sorulduğunu işittiğini rivayet eder. Onlar da \"Hayır, gusül abdesti alana kadar giremez\" diye cevap vermişlerdir. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Zeyd ibn el-Hubab, Abd el-Razzaq, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.103} {cite:muwatta-maruf-1997 s.104}"
  id: "Sebuah riwayat mengenai apa yang diperbolehkan bagi seorang pria dengan istrinya saat istrinya sedang haid: Malik meriwayatkan bahwa ia mendengar bahwa Salim ibn Abdullah dan Sulayman ibn Yasar ditanya apakah seorang wanita yang sedang haid boleh berhubungan intim dengan suaminya jika ia melihat tanda-tanda kesucian sebelum melakukan ghusl (mandi ritual). Mereka menjawab: Tidak, tidak sampai ia melakukan ghusl. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab, Zayd ibn al-Hubab, Abd al-Razzaq, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.103} {cite:muwatta-maruf-1997 p.104}"
