text: "… إِلَى كَذَا وَكَذَا \". قَالَ قَتَادَةُ فَقُلْتُ لِلَّذِي مَعِي مَا يَعْنِي قَالَ إِلَى أَسْفَلِ بَطْنِهِ \" فَاسْتُخْرِجَ قَلْبِي فَغُسِلَ بِمَاءِ زَمْزَمَ ثُمَّ أُعِيدَ مَكَانَهُ ثُمَّ حُشِيَ إِيمَانًا وَحِكْمَةً ثُمَّ أُتِيتُ بِدَابَّةٍ أَبْيَضَ يُقَالُ لَهُ الْبُرَاقُ فَوْقَ الْحِمَارِ وَدُونَ الْبَغْلِ يَقَعُ خَطْوُهُ عِنْدَ أَقْصَى طَرْفِهِ فَحُمِلْتُ عَلَيْهِ ثُمَّ انْطَلَقْنَا حَتَّى أَتَيْنَا السَّمَاءَ الدُّنْيَا فَاسْتَفْتَحَ جِبْرِيلُ فَقِيلَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 416، يذكر شق الصدر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 416 (The Book of Faith), that mentions the opening of the chest. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 416، جس میں شقِّ صدر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
