label: { ar: "الموطأ 2230 — يحيى عن مالك عن يحيى بن سعيد عن القاسم بن محمد: كانت عند عمر بن الخطاب امرأة من الأنصار فولدت له عاصم بن عمر، ثم فارقها، فوجد عمر ابنه عاصما يلعب، فأخذه فوضعه على الدابة، فنازعته جدته حتى أتيا أبا بكر الصديق، فقال: خل بينها وبينه", en: "Muwatta 2230", es: "Muwatta 2230", fr: "Muwatta 2230", ur: "موطا 2230", tr: "El-Muvatta 2230 — Yahya, Malik'ten, o da Yahya ibn Said'den, o da el-Kasım ibn Muhammed'den rivayet eder: Ömer ibn el-Hattab'ın Ensar'dan bir karısı vardı ve ondan Asim ibn Ömer adında bir oğlu oldu. Sonra ondan boşandı. Ömer, oğlu Asim'i oynarken buldu, onu alıp hayvanın üzerine koydu. Büyükannesi onunla tartıştı, ta ki Ebu Bekir el-Siddik'e gidene kadar. Ebu Bekir el-Siddik, \"Onu onunla bırakın\" dedi.", id: "Al-Muwatta 2230 — Yahya, dari Malik, dari Yahya ibn Saeed, dari al-Qasim ibn Muhammad: Umar ibn al-Khattab mempunyai istri dari kaum Ansar yang melahirkan Asim ibn Umar. Kemudian ia menceraikannya. Umar mendapati putranya Asim sedang bermain, lalu ia mengambilnya dan menempatkannya di atas binatang. Neneknya berselisih dengannya hingga mereka pergi kepada Abu Bakr al-Siddiq, yang berkata: Biarkan dia bersamanya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: سمعت القاسم بن محمد يقول: كانت عند عمر بن الخطاب امرأة من الأنصار، فولدت له عاصم بن عمر، ثم إنه فارقها. فجاء عمر قباء، فوجد ابنه عاصما يلعب بفناء المسجد، فأخذ بعضده، فوضعه بين يديه على الدابة، فأدركته جدة الغلام، فنازعته إياه، حتى أتيا أبا بكر الصديق. فقال عمر: ابني، وقالت المرأة: ابني. فقال أبو بكر: خل بين بينها وبينه. قال: فما راجعه عمر الكلام. قال مالك: وهذا الأمر الذي آخذ به في ذلك. {cite:muwatta-maruf-1997 p.317}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle şöyle der: \"Kâsım ibn Muhammed'in şöyle dediğini işittim: Ömer ibn Hattab'ın Ensar'dan bir karısı vardı ve ondan Asim ibn Ömer adında bir çocuğu oldu. Sonra ondan boşandı. Ömer Kuba'ya geldi ve oğlu Asim'i mescidin avlusunda oynarken buldu. Onu kolundan tutup bineğinin önüne oturttu. Çocuğun ninesi ona yetişti ve ikisi birlikte Ebu Bekir el-Siddik'in yanına gidene kadar onunla tartıştı. Ömer, 'Oğlum' dedi, kadın da 'Oğlum' dedi. Ebu Bekir, 'Onu ona bırakın' dedi. Ömer onunla tartışmadı. Malik dedi ki: Bu konuda benim takip ettiğim hüküm budur.\""
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, yang berkata: Aku mendengar al-Qasim ibn Muhammad berkata: Umar ibn al-Khattab mempunyai istri dari kaum Ansar, dan istrinya melahirkan Asim ibn Umar. Kemudian ia menceraikannya. Umar datang ke Quba dan mendapati putranya Asim sedang bermain di halaman masjid. Ia memegang lengan Asim dan menempatkannya di depannya di atas kendaraannya. Nenek anak itu menyusulnya dan berdebat dengannya sampai mereka berdua pergi ke Abu Bakr al-Siddiq. Umar berkata, \"Anakku,\" dan wanita itu berkata, \"Anakku.\" Abu Bakr berkata, \"Biarkan dia bersamanya.\" Umar tidak berdebat dengannya. Malik berkata: Inilah hukum yang aku ikuti dalam masalah ini."
