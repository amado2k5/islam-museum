label: { ar: "الموطأ 2230 — يحيى عن مالك عن يحيى بن سعيد عن القاسم بن محمد: كانت عند عمر بن الخطاب امرأة من الأنصار فولدت له عاصم بن عمر، ثم فارقها، فوجد عمر ابنه عاصما يلعب، فأخذه فوضعه على الدابة، فنازعته جدته حتى أتيا أبا بكر الصديق، فقال: خل بينها وبينه", en: "Muwatta 2230" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: سمعت القاسم بن محمد يقول: كانت عند عمر بن الخطاب امرأة من الأنصار، فولدت له عاصم بن عمر، ثم إنه فارقها. فجاء عمر قباء، فوجد ابنه عاصما يلعب بفناء المسجد، فأخذ بعضده، فوضعه بين يديه على الدابة، فأدركته جدة الغلام، فنازعته إياه، حتى أتيا أبا بكر الصديق. فقال عمر: ابني، وقالت المرأة: ابني. فقال أبو بكر: خل بين بينها وبينه. قال: فما راجعه عمر الكلام. قال مالك: وهذا الأمر الذي آخذ به في ذلك. {cite:muwatta-maruf-1997 p.317}"
