text: "… هاشم القروى أنا محمد بن عقبة السدوسى ومحمد بن ممرو الزهرى قالوا ثنا معاوية بن هشام عن ممرو بن غياث عن عاصم عن زر عن عبدالله. قال قال وسول اللّٰه: ان فاطمة أحصنت فرجها فحرم اللّٰه ذريتها على النار. هذا …"
