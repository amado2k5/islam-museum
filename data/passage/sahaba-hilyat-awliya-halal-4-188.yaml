  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 4. cildinin 188. sayfasından, haram olan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
