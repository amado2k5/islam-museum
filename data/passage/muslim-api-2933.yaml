label: { ar: "صحيح مسلم 2933 — الأب والأبوة", en: "Sahih Muslim 2933 — the father and fatherhood", ur: "صحیح مسلم 2933 — باپ اور والدیت", es: "Sahih Muslim 2933 — El padre y la paternidad" }
text: "حَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا بَهْزٌ، حَدَّثَنَا وُهَيْبٌ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ طَاوُسٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - أَنَّهَا أَهَلَّتْ بِعُمْرَةٍ فَقَدِمَتْ وَلَمْ تَطُفْ بِالْبَيْتِ حَتَّى حَاضَتْ فَنَسَكَتِ الْمَنَاسِكَ كُلَّهَا. وَقَدْ أَهَلَّتْ بِالْحَجِّ. فَقَالَ لَهَا النَّبِيُّ يَوْمَ النَّفْرِ \" يَسَعُكِ طَوَافُكِ لِحَجِّكِ وَعُمْرَتِكِ \". فَأَبَتْ فَبَعَثَ بِهَا مَعَ عَبْدِ الرَّحْمَنِ إِلَى التَّنْعِيمِ فَاعْتَمَرَتْ بَعْدَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2933، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2933 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2933، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2933 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
