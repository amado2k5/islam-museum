text: "… كثرةُ المني، واشتد شَبَقُه، وليحذر جماعَ العجوز والصغيرة التي لا يُوطا مثلُها، والتي لا شهوة لها، والمريضة، والقبيحة المنظر، والبغيضة، فوطء هؤلاء يُوهن القوى، ويُضعف الجماع بالخاصية، وغلط من قال من الأطباء : إن جماع الثيب أنفعُ من جماع البكر …"
