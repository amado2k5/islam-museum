label: { ar: "مسلم 2646 — الشقي من شقي في بطن أمه", en: "Muslim 2646 — The wretched one is wretched in the womb", es: "Musulmán 2646 — El desdichado es desdichado en el vientre", fr: "Muslim 2646 — Le malheureux est malheureux dans le sein maternel", ur: "مسلم 2646 - بدبخت رحم میں ہی بدبخت ہے۔", tr: "Müslim 2646 — Zavallı olan, anasının rahminde zavallı olandır.", id: "Muslim 2646 — Celakalah orang yang menderita sejak dalam kandungan ibunya" }
text: "قال عبد الله بن مسعود: الشقي من شقي في بطن أمه، والسعيد من وعظ بغيره"
summary:
  ar: "رواية ابن مسعود عند عامر بن واثلة أيّدها حذيفة بن أسيد بسماعه من النبي، في باب كيفية خلق الآدمي ومبتدأ الأمر فيه من كتاب القدر في صحيح مسلم؛ الشقاوة والسعادة تُكتبان في الرحم."
  tr: "İbn Mesud'un rivayetine göre, Amer bin Vatila tarafından aktarılan ve Peygamberimizden işiten Huzeyfe bin Asid tarafından da desteklenen bu hadis, Sahih Müslim'deki Kader Kitabı'nda yer alan, insanın yaratılışı ve içindeki maddenin başlangıcı bölümünde şöyle geçmektedir: \"Acı ve mutluluk rahimde yazılmıştır.\""
  id: "Riwayat Ibnu Masoud, sebagaimana diriwayatkan oleh Amer bin Wathila, didukung oleh Hudhayfa bin Asid, yang mendengarnya dari Nabi, dalam surah tentang bagaimana manusia diciptakan dan permulaan segala sesuatu di dalamnya, dari Kitab Takdir dalam Sahih Muslim; kesengsaraan dan kebahagiaan tertulis di dalam rahim."
