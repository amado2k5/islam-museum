label: { ar: "جامع الترمذي 301 — الأب والأبوة", en: "Jami' al-Tirmidhi 301 — the father and fatherhood", ur: "جامع ترمذی 301 — باپ اور والدیت", es: "Jami' al-Tirmidhi 301 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 301 — le père et la paternité" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ قَبِيصَةَ بْنِ هُلْبٍ، عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ يَؤُمُّنَا فَيَنْصَرِفُ عَلَى جَانِبَيْهِ جَمِيعًا عَلَى يَمِينِهِ وَعَلَى شِمَالِهِ. وَفِي الْبَابِ عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ وَأَنَسٍ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو وَأَبِي هُرَيْرَةَ. قَالَ أَبُو عِيسَى حَدِيثُ هُلْبٍ حَدِيثٌ حَسَنٌ. وَعَلَيْهِ الْعَمَلُ عِنْدَ أَهْلِ الْعِلْمِ أَنَّهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 301، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 301 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 301، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 301 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 301 (Le Livre de la Salat (Prière)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
