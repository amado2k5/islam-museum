text: "… قول عدى بن زيد العبادى من ولة د تتبعت ذاك كثير افلم أجدما يشفى الغلبل حتى ظفرت بكتاب قديم اسمه الأفيف ولم يكتب عليه اسم مؤاهه فنقلت منه ماصورته عن العداس عن أبيه قال النخرم ملك الروم فى الزمان ! …"
