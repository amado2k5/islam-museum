text: "حَدَّثَنَا سَهْلُ بْنُ أَبِي سَهْلٍ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ أَيُّوبَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: قَدِمَ النَّبِيُّ ـ الْمَدِينَةَ فَوَجَدَ الْيَهُودَ صُيَّامًا. فَقَالَ: \" مَا هَذَا؟ \". قَالُوا: هَذَا يَوْمٌ أَنْجَى اللَّهُ فِيهِ مُوسَى، وَأَغْرَقَ فِيهِ فِرْعَوْنَ، فَصَامَهُ مُوسَى شُكْرًا. فَقَالَ رَسُولُ اللَّهِ ـ \" نَحْنُ أَحَقُّ بِمُوسَى مِنْكُمْ \". فَصَامَهُ، …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1734، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1734 (Fasting), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1734، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
