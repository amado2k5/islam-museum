  والربب بالفتح الماء الصكثير ويقال العذب قال الراجز والبرّة السمراء والماء الربب
  وفلان مرب بالفتح أى مجمع يرب الناس أى يجمعهم ومكان مرب أى مجمع ومرب الابل حيث
  لزمته وأريت الابل بمكان كذا وكذا أى زمته وأقامت به فهي ابل مراب وأربت الناقة أى
  زمت الفحل وأحبته وأر بت الجنوب وأربت السحابة أى دامت والارباب الدنومن
  الشئء واربي" واحد الربيين وهم الالوف من الناس قال اللّٰه تسارك وتعالى وكأين من نبيّ
  قاتل معه ربيون كثير والربرب القطيع من بقرالوحس والرباب بكسر الراءخس قبائل
  تجمعو أفصار وايدا واحدة وهم ضبة وتوروعكل وتيم وعدىّ وانماسموا بذلك لانهم
  غموا أيديه-م فى رب وتحالفواعليه وقال الاصمعى سموابه لانه-م تربيوا أى تجمعوا
  والنسبة اليهم ربى بالضم لان الواحد منهم ربة لانك اذانسيت الشئ الى الجمع رددته الى
  الواحد كما تقول فى المساجد مسجدى الا أن تكون سميت به رح_لا فلاتردّه الى الواحد
  كما يقال فى أغمار اغمارى" وفى كلاب كلابى" والرباية أيضا بالكسرشيهة بالسكانة تجمع فيها
  مهام الميسرور بماسمواجاعة السهام رباية قال أبوذؤيب بصف الحماروآتنه
  فكأنهن ريابة وكانه * يسريفيض على القداح ويصدع
  والرباية أيضا العهد والميثاق قال الشاءر علقمة بن عبدة
  وكنت امر أ أفضت اليك ريابتى * وقبلك وبتنى فضعت ربوب
  ومنه قيل للعشوررياب والارية أهل الميناق قال أبوذؤيب
  كانت أربته-م ي) زوغزهمو • عقد الجواروكانوا معشر اغدرا ١
  والرياب بالفتح سحاب أبيض ويقال انه الصاب الذى تراه كأنه دون السحاب قد يكون
  أبيض وقد يكون أسود الواحدة ربابة وبه سميت المرأة الرباب رتب الرتبة المنزلة
  وكذلت المرتبة قال الاصحعى المرتية المرقية وهى أعلى الجبل وقال الخليل المراتب فى الجبل
  والصحارى وهى الاعلام التى ترتب فيها العيون والرقباء وتقول رتبت الشئ ترتيبا ورتب
  الشى يرتب رتوبا أى ثبت يقال رتب رتوب الكعب أى انتصب انتصابه وأمرراتب أى
  دائم ثابت وأمر ترتب على تفعل يضم التاء ومتح العين أى ثابت قال الشاءر
  وكان لنافضل على الناس ترتبا والرقب الشدّة قال ذو الرمة بصف الثور الوحشىّ
  تقيظ الرمل حتى هز خلفته ٢ تروح المبردما فى عيثه رتب
  يقال مافى هذا الامررتب ولاعتب أى شدّة والرقب ما بين السبابة والوسطى وقد بسكن
  والرتب أيضاما أشرف من الارض كالبرزخ يقال رتبة ورتب كقولك درجة ودرج
  جب رجبته بالكسر أى هيته وعظمته فهو مى جوب ومن مسمى رجب لانهم كانوا
  يعظمونه فى الجاهلية ولا يستحلون فيه القتال وانغماقيل رجب مضر لانه-م كانوا أشد تعظيما
  له والجمع أرجاب واذا ضموا اليه شعبان قالوارجبان والترجيب التعظيم وان ذلا نالمرجب
  ومنه ترجيب العتبرة وهوذبحها فى رجب بقال ه_ذه أيام رجيب وتعتار والترجيب
  أيضا أن تدعم الشجرة اذا كترجلها الثلا تنكسر أغصانها قال الحباب بن المنذرانا ءذيقها
  المرحب (٣ ربمابنى لهاجدارتعتمد عليه اضعفها والاسم الرجبة والجمع رجب مثل
  ١ : هزوزان قه-رحى من سليم
