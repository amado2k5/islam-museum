text: "… مع رجلين... أن رسول اللٰه وا في تزوج بخمس عشرة أمرأة... أن رسول اللّٰه وَلا يه تمنفل سيفه ذا الفقار يوم بدر... أن رسول اللّٰه وَالي توفي عن تسع نسوة... أن رسول اللّٰه وعَيِدْ توفي ودرعه مرهونة... أن رسول اللّٰه …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 5442، يذكر ما خلّفه من تركة وميراث، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 5442, that mentions what was left behind: estate and inheritance, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 5442 کا اقتباس جس میں ترکہ اور میراث، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
