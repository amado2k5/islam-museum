text: |-
  ٨٨
  •⁦(زرق)⁩•
  جل ريق أى على الريق وهوفعل ويقال أنته ريقا وآنته رائقاأى على ريق لم آطعم شم
  حكاه يعة وب والريق أيضامن كل شئ أفضله وأوه ومنهريق الشباب وريق المطروقد يخنغ
  فيقال ريق قال لبيد
  مدحنالهاريق الشباب فعارضت • جناب الصبافى كاتم السرأهما
  والماء الرائق أن يشرب على الريق غدوة ولا يقال الاللماء قال الكسائى هويريق ينفه
  ريوفا أى يجود بها عند الموت وراق السراب يريؤريقا اذا لع فوق الارض وتيق مثله
  قوله زبق كان المناسب تأخيره عن
  زبعبق ويكون الترتيب زتيق
  زبرق زبعبسق زبق زحلق زرق
  ويؤخر زندق عن زاق كمافعل
  صاحب القاموس اد معص
  قول لصغرة عمامته وقيل لجاله
  وقبل لانه لبس حسلة دراح الى
  ناديهسم فقالواز برق حصين
  وهو ابى كما فى القاءوس اه
  AEPA
  صل الزاى بق زيق شعره يزيقه زيقانتفه وانزيق أى دخل وهومقاوب
  انزقب والزنبق دهن الياعين والزتبق فارسى معرب وقدعر ب بالهمزومنهم من يقوله
  كسراليا. فيلحه بالزقبر والضقبل ودرهم من ابق والعامة تقول من بق (زبعبق
  الزبعبق السيء الخلق قال ،شغيرة ذى خلق زبعبق• ⁦( زبرق)⁩ زبرقت الثوب أى صغرته
  والزبرقان القمر وزبرقان بن بدر الغزارى قال أبو يوسف سمى الزبرقان لصفرة عمامته
  وكان اسمه خصينا قال القبل السعدى
  وأشهد من عوف حلولا كثيرة • يحجون سب الزبرقان المزعفرا
  حاق). الزحاليق لغة تميم فى الزحاليف الواحسدة زحلوقسة قال عام بن مالك ملاعب
  الاسنة
  لمارأيت ضرارا فى مللمة • كانما حاقتاها مافتانيق
  يممته الرمح شزرا ثم قلت له • هذى المرقة لالعب الزحاليق
  يعنى ضرارين عمر والضىّ والزحلقة كالدحرجة وقد تز حلمق قال رؤية
  لمارأيت الشمر قد تألقا • وقتنة زمى بن تصعقا • من خرّفى طهطاحها تزحلقا
  ( زندق الزنديق من الثنوية وهو معرّب وايهع الزنادقة والهاء عوض من اليا
  المحذوفة وأصله الزناديق وقد تزندق والاسم الزندقة ⁦(ذرق)⁩ رجل أزرق العين والمرأة
  زرقاء بينة الزرق والاسم الزرقة وقد زرقت عينه بالكسر قال الشاءر
  لقد زرقت عيناك يا ابن مكعبر • كمأكل ضبى من اللؤم أزرق
  وازرقت عينه ازرقاما وازراقت عينه ازريقاما والزرقم الشديد الزرق واارأة زرقم أيضا
  قوله تقوّب يحتمل أن يكون
  وتسمى الاسنة زر قاللونها والزرق أيضا أكثبة بالدهناء قال ذوالرقة
  قوب كقوله فتقطعوا أمرهم
  وقزين بالزرق الهائل بعدما * تقوب عن غربان أورا كها الخطر
  ببنهم أى قطعوا وتقسمت الشى أى
  وزرق الطائويزرق ويزرق أى ذرق ويقال أيضازرقت عينه غحوى اذاانقلبت وظهر
  قسمته وقال بعضهم أرادتة وت
  يباضها والمزراق رمح قصير وقد زرقه با لزراق أى رماهيه وزرقت الناقة الرحل أى أخرته الى
  وراءفانزرق قال الراجز
  غربانها عدن الخط رفقلبه قاله
  يزعم زيد أن رحلى منزرق • يكفيكه اللّٰه وحبل فى العنق
  المصنف في مادة خطراه معصه
  يعنى الليب قال اب السكوت نصل أزرق بين الزرق اذا كان شديد الصفاء ويقال للماء الصافى
  أزرق قال أبو عمر والزرنوقان منارتان تبنيان ه-لى رأس البترفتوضع عليهما النعامه وهى
  الخشبة المعترضة علميها ثم تعلق القامة وهى البكرة من النعامسة فان كان الزرنوقان من خشب
  فهماد عامتان وقال الكلابى" اذا كانا من خشب فهما النعامتان والمعترضة عليهما هى الهجلة
  والغرب
