  fr: "Extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab (tome 2, p. 317), contenant une description du musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abdül-Barr'ın el-İsti'ab adlı eserinin 2. cildinin 317. sayfasından, Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, Volume 2, halaman 317, yang menjelaskan tentang seorang Muslim; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
