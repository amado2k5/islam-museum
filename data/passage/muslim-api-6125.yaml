label: { ar: "صحيح مسلم 6125 — الأب والأبوة", en: "Sahih Muslim 6125 — the father and fatherhood", ur: "صحیح مسلم 6125 — باپ اور والدیت", es: "Sahih Muslim 6125 — El padre y la paternidad", fr: "Sahih Muslim 6125 — Le père et la paternité" }
text: "… فَلَمَّا أُكْثِرَ عَلَيْهِ غَضِبَ ثُمَّ قَالَ لِلنَّاسِ \" سَلُونِي عَمَّ شِئْتُمْ \". فَقَالَ رَجُلٌ مَنْ أَبِي قَالَ \" أَبُوكَ حُذَافَةُ \". فَقَامَ آخَرُ فَقَالَ مَنْ أَبِي يَا رَسُولَ اللَّهِ قَالَ \" أَبُوكَ سَالِمٌ مَوْلَى شَيْبَةَ \". فَلَمَّا رَأَى عُمَرُ مَا فِي وَجْهِ رَسُولِ اللَّهِ مِنَ الْغَضَبِ قَالَ يَا رَسُولَ اللَّهِ إِنَّا نَتُوبُ إِلَى اللَّهِ. وَفِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6125، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6125 (The Book of Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6125، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6125 (El Libro de las Virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6125 (Le Livre des Vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
