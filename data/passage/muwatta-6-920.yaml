text: "كنت أطيب رسول الله لإحرامه قبل أن يحرم، ولحله قبل أن يطوف بالبيت"
summary:
  ar: "أول حديث في باب ما جاء في الطيب في الحج. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة زوج النبي، أنها قالت: كنت أطيب رسول الله لإحرامه قبل أن يحرم، ولحله قبل أن يطوف بالبيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1053) وأن الترمذي (917) عنده تخريج كثير من طرقه. {cite:muwatta-maruf-1997 p.441}"
