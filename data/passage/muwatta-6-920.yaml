label: { ar: "الموطأ 920 — عائشة: كنت أطيب رسول الله لإحرامه قبل أن يحرم، ولحله قبل أن يطوف بالبيت", en: "Muwatta 920", es: "Muwatta 920", fr: "Muwatta 920", ur: "موطا 920", tr: "Al-Muwatta 920 — Aişe: Ben, Resulullah'ın ihrama girmeden önce ihrama girmesi için ve Kâbe'yi tavaf etmeden önce ihramdan çıkması için ona güzel kokular sürerdim.", id: "Al-Muwatta 920 — Aisyah: Aku biasa memakaikan parfum kepada Rasulullah SAW untuk ihramnya sebelum beliau memasuki ihram, dan untuk berbuka ihram sebelum beliau melakukan tawaf di Ka'bah." }
text: "كنت أطيب رسول الله لإحرامه قبل أن يحرم، ولحله قبل أن يطوف بالبيت"
summary:
  ar: "أول حديث في باب ما جاء في الطيب في الحج. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة زوج النبي، أنها قالت: كنت أطيب رسول الله لإحرامه قبل أن يحرم، ولحله قبل أن يطوف بالبيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1053) وأن الترمذي (917) عنده تخريج كثير من طرقه. {cite:muwatta-maruf-1997 p.441}"
  tr: "Hac sırasında parfüm kullanımıyla ilgili rivayetler bölümündeki ilk hadis, Malik'in Abdülrahman ibn el-Kâsım'dan, onun babasından, onun da Peygamberimizin eşi Aişe'den rivayet ettiğine göre şöyledir: \"Ben, Resulullah'ı ihrama girmeden önce ve Kâbe'yi tavaf etmeden önce ihrama uygun parfümler sürerdim.\" Editör, bu hadisin Malik'ten Ebu Musab (1053) tarafından rivayet edildiğini ve Tirmizi'nin (917) de birçok rivayet zincirine sahip olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.441}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai parfum selama ibadah haji. Diriwayatkan oleh Malik dari Abdullah bin Qasim, dari ayahnya, dari Aisyah, istri Nabi, bahwa ia berkata: “Aku biasa memakaikan parfum kepada Rasulullah sebelum beliau memasuki ihram, dan sebelum beliau melepaskan ihram sebelum melakukan tawaf di Ka'bah.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1053), dan bahwa al-Tirmidzi (917) memiliki banyak sanad untuk hadits ini. {cite:muwatta-maruf-1997 p.441}"
