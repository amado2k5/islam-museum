label:
  ar: "ابن ماجه 4202 — أنا أغنى الشركاء عن الشرك"
  en: "Ibn Majah 4202 — I am the partner least in need of partnership"
  ur: "ابن ماجہ 4202 — میں شرکت سے سب شریکوں سے زیادہ بے نیاز ہوں"
text: "قال الله عز وجل أنا أغنى الشركاء عن الشرك فمن عمل لي عملا أشرك فيه غيري فأنا منه بريء وهو للذي أشرك ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4202: أنا أغنى الشركاء عن الشرك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4202: I am the partner least in need of partnership. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4202: میں شرکت سے سب شریکوں سے زیادہ بے نیاز ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
