label:
  ar: "ابن ماجه 4202 — أنا أغنى الشركاء عن الشرك"
  en: "Ibn Majah 4202 — I am the partner least in need of partnership"
  ur: "ابن ماجہ 4202 — میں شرکت سے سب شریکوں سے زیادہ بے نیاز ہوں"
  es: "Ibn Majah 4202 — Soy el socio que menos necesita de socio."
  fr: "Ibn Majah 4202 — Je suis l'associé qui a le moins besoin d'un partenariat"
  tr: "İbn Majah 4202 — Ben, ortaklar arasında en çok kendi kendine yetenim, ortağa ihtiyacım yok."
  id: "Ibn Majah 4202 — Akulah mitra yang paling mandiri, tidak membutuhkan mitra."
text: "قال الله عز وجل أنا أغنى الشركاء عن الشرك فمن عمل لي عملا أشرك فيه غيري فأنا منه بريء وهو للذي أشرك ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4202: أنا أغنى الشركاء عن الشرك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4202: I am the partner least in need of partnership. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4202: میں شرکت سے سب شریکوں سے زیادہ بے نیاز ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 4202: Soy el socio que menos necesita socio. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 4202: « Je suis celui qui a le moins besoin d’association. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 4202: “Aku adalah sekutu yang paling mandiri, dan Aku tidak membutuhkan sekutu.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
