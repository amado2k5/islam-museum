label: { ar: "الموطأ 1922 — مالك: لا بأس بشراء الثوب من الكتان أو الشطوي أو القصبي بالأثواب من الإتريبي أو القسي أو الزيقة أو الهروي أو المروي بالملاحف اليمانية والشقائق، واحدا باثنين أو ثلاثة يدا بيد، وإن دخلته نسيئة فلا خير فيه", en: "Muwatta 1922" }
summary:
  ar: "قال مالك: ولا بأس بأن يشترى الثوب من الكتان، أو الشطوي، أو القصبي، بالأثواب من الإتريبي، أو القسي، أو الزيقة، أو الثوب الهروي، أو المروي، بالملاحف اليمانية والشقائق، وما أشبه ذلك، الواحد بالاثنين أو الثلاثة، يدا بيد، أو إلى أجل، وإن كان من صنف واحد. فإن دخل في ذلك نسيئة فلا خير فيه. {cite:muwatta-maruf-1997 p.187}"
