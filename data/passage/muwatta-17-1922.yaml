label: { ar: "الموطأ 1922 — مالك: لا بأس بشراء الثوب من الكتان أو الشطوي أو القصبي بالأثواب من الإتريبي أو القسي أو الزيقة أو الهروي أو المروي بالملاحف اليمانية والشقائق، واحدا باثنين أو ثلاثة يدا بيد، وإن دخلته نسيئة فلا خير فيه", en: "Muwatta 1922", es: "Muwatta 1922", fr: "Muwatta 1922", ur: "موطا 1922", tr: "El-Muvatta 1922 — Malik: Keten, ipek veya kamıştan yapılmış bir giysiyi, dokuma kumaştan veya ipekten yapılmış giysilerle, Yemen kumaşından veya ipekten yapılmış giysilerle, bir tanesini iki veya üç tanesine elden almakta bir sakınca yoktur. Ancak krediyle alınırsa, o zaman bir faydası olmaz.", id: "Al-Muwatta 1922 — Malik: Tidak ada salahnya membeli pakaian dari linen, sutra, atau alang-alang dengan pakaian dari kain tenun, atau sutra, atau sutra, atau sutra, atau sutra, atau sutra, atau sutra, kain Yaman, atau sutra, satu untuk dua atau tiga, secara tunai. Tetapi jika secara kredit, maka tidak ada manfaatnya." }
summary:
  ar: "قال مالك: ولا بأس بأن يشترى الثوب من الكتان، أو الشطوي، أو القصبي، بالأثواب من الإتريبي، أو القسي، أو الزيقة، أو الثوب الهروي، أو المروي، بالملاحف اليمانية والشقائق، وما أشبه ذلك، الواحد بالاثنين أو الثلاثة، يدا بيد، أو إلى أجل، وإن كان من صنف واحد. فإن دخل في ذلك نسيئة فلا خير فيه. {cite:muwatta-maruf-1997 p.187}"
  tr: "Malik şöyle dedi: Keten, ipek veya brokar kumaştan yapılmış bir giysiyi, ipek, brokar, Herat ipeği veya Merv ipeğiyle, Yemen pelerinleri ve şallarıyla ve benzerlerini, bire iki veya üç, elden ele veya kredili olarak satın almanın bir sakıncası yoktur, hatta aynı türden olsalar bile. Ancak kredili olarak yapılırsa, bunun bir faydası olmaz. {cite:muwatta-maruf-1997 s.187}"
  id: "Malik berkata: Tidak ada salahnya membeli pakaian dari linen, sutra, atau brokat, dengan pakaian dari sutra, brokat, atau sutra dari Herat, atau sutra dari Marw, dengan jubah dan selendang Yaman, dan sejenisnya, satu untuk dua atau tiga, secara tunai, atau secara kredit, meskipun jenisnya sama. Tetapi jika dilakukan secara kredit, maka tidak ada gunanya. {cite:muwatta-maruf-1997 p.187}"
