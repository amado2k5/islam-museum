label: { ar: "الموطأ 1346 — أبو هريرة عن النبي: من أنفق زوجين في سبيل الله نودي من أبواب الجنة، وفيها باب الجهاد وباب الريان", en: "Muwatta 1346" }
text: "مَن أنْفقَ زَوْجَيْنِ في سَبِيلِ اللهِ، نُودِيَ في الْجَنَّةِ"
summary:
  ar: "يروي مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف عن أبي هريرة أن رسول الله قال من أنفق زوجين في سبيل الله نودي في الجنة يا عبد الله هذا خير، فمن كان من أهل الصلاة دعي من باب الصلاة، ومن كان من أهل الجهاد دعي من باب الجهاد، ومن كان من أهل الصدقة دعي من باب الصدقة، ومن كان من أهل الصيام دعي من باب الريان. فقال أبو بكر ما على من يدعى من هذه الأبواب من ضرورة، فهل يدعى أحد من هذه الأبواب كلها؟ قال نعم، وأرجو أن تكون منهم. {cite:muwatta-maruf-1997 p.602}"
