text: "… ما دام الأمر كذلك فرُشَّ السكر بالوسط اشترك مع رفيق له في لبن حليب وفيما هما يقصدان تناوله أشار رفيقه إلى الجانب الذي يليه من اللبن وقال: أريد أن أرش على حُصَّتي سُكَّراً، فقال له الشيخ: إذا كنت تُريدُ ذلك …"
summary:
  ar: "اقتسم جحا لبناً مع رفيق يريد السكر في جانبه وحده، فصب جحا زيتاً في حصته، فاعترض الرفيق، فقال جحا إذن فرش السكر بالوسط. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  en: "Sharing milk with a companion who wants sugar only on his side, Juha pours oil on his own share. The companion objects, and Juha says then sprinkle the sugar in the middle. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  ur: "جحا ایک ساتھی کے ساتھ دودھ بانٹتا ہے جو چینی صرف اپنی طرف چاہتا ہے، تو جحا اپنے حصے پر تیل ڈال دیتا ہے۔ ساتھی اعتراض کرتا ہے تو جحا کہتا ہے کہ پھر چینی بیچ میں چھڑک دو۔ {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  fr: "Partageant du lait avec un compagnon qui veut du sucre de son seul côté, Juha verse de l'huile sur sa propre part. Le compagnon proteste, et Juha dit alors de saupoudrer le sucre au milieu. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  es: "Compartiendo leche con un compañero que quiere azúcar solo de su lado, Juha vierte aceite sobre su propia parte. El compañero protesta, y Juha dice que entonces esparza el azúcar en el medio. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
