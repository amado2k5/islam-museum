label: { ar: "الموطأ 302 — عمر يأمر أبياً وتميماً أن يقوما بإحدى عشرة ركعة", en: "Muwatta 302" }
text: "أمر عمر بن الخطاب أبي بن كعب وتميماً الداري أن يقوما للناس بإحدى عشرة ركعة"
summary:
  ar: "أثر يرويه مالك عن محمد بن يوسف عن السائب بن يزيد، في باب ما جاء في قيام رمضان: أمر عمر بن الخطاب أبي بن كعب وتميماً الداري أن يقوما للناس بإحدى عشرة ركعة، وكان القارئ يقرأ بالمئين حتى كانوا يعتمدون على العصي من طول القيام، وما كانوا ينصرفون إلا في أوائل الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.172}"
