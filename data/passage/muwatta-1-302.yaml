label: { ar: "الموطأ 302 — عمر يأمر أبياً وتميماً أن يقوما بإحدى عشرة ركعة", en: "Muwatta 302", es: "Muwatta 302", fr: "Muwatta 302", ur: "موطا 302", tr: "El-Muvatta 302 — Ömer, Ubeyy ve Tamim'e on bir rekat namaz kılmalarını emreder.", id: "Al-Muwatta 302 — Umar memerintahkan Ubayy dan Tamim untuk melaksanakan sebelas rakaat" }
text: "أمر عمر بن الخطاب أبي بن كعب وتميماً الداري أن يقوما للناس بإحدى عشرة ركعة"
summary:
  ar: "أثر يرويه مالك عن محمد بن يوسف عن السائب بن يزيد، في باب ما جاء في قيام رمضان: أمر عمر بن الخطاب أبي بن كعب وتميماً الداري أن يقوما للناس بإحدى عشرة ركعة، وكان القارئ يقرأ بالمئين حتى كانوا يعتمدون على العصي من طول القيام، وما كانوا ينصرفون إلا في أوائل الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.172}"
  tr: "Ramazan gecesi namazları hakkında rivayet edilenler bölümünde, Malik'in Muhammed ibn Yusuf'tan, o da Sa'ib ibn Yazid'den rivayet ettiği bir hadiste şöyle denmektedir: Ömer ibn el-Hattab, Ubeyy ibn Ka'b ve Tamim el-Dari'ye on bir rekat namaz kıldırmalarını emretmiştir. Okuyucu, Kur'an'dan uzun bölümler okur, öyle ki insanlar ayakta durmaktan dolayı bastonlara yaslanırlar ve sabahın erken saatlerine kadar namazı kıldırmazlardı. Editör, bu hadisin Malik'ten Ebu Mus'ab, Abd el-Razzaq ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Beyhaki'nin de bunu kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.172}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Muhammad ibn Yusuf atas otoritas al-Sa'ib ibn Yazid, dalam bab tentang apa yang telah diriwayatkan mengenai shalat malam Ramadhan: Umar ibn al-Khattab memerintahkan Ubayy ibn Ka'b dan Tamim al-Dari untuk memimpin orang-orang dalam sebelas rakaat. Pembaca Al-Quran akan membaca bagian-bagian Al-Quran yang panjang, sampai-sampai orang-orang bersandar pada tongkat karena lamanya berdiri, dan mereka tidak akan pergi sampai dini hari. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Abd al-Razzaq, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.172}"
