text: "كِتَابُ قِرَاءَة أبي عَمْرو، تَصْنيف أحمد بن زَيْد الحُلْوَانِيّ. كِتَابُ قِرَاءَة أبي عَمْرو بن العَلَاء عن أبي ذُهْل، رَوَىٰ عنه عِصْمَةُ بن أبي عِصْمَة. كِتَابُ وقيل أبانُ وقيل أبو الحَسّن '. ورَوَىٰ الأصْمَعِيُّ عن نَافِع أنَّه قال : أصْلي من …"
