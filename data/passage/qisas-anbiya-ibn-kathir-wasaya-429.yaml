text: "… قال : الطوفان الموت وهو غريب. وأما الجراد فمعروف، وقد روى أبو داود عن أبى عثمان، عن سلمان الفارسى، قال : سئل رسول اللٰه عله عن الجراد، فقال : أكثر جنود الله لا آكله ولا أحرمه. وترك النبى علاله أكله …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 429، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
