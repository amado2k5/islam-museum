text: "… التكلم بالشهادتين مع الإخلاص والعمل بمقتضاهما، فقد قال الا: الإيمان بضع وسبعون شعبة، أعلاها قول: لا إله إلا الله، وأدناها إماطة الأذى عن الطريق وقال أيضا ف ام: الحياء شعبة من الإيمان وقال أيضا : أكمل المؤمنين إيمانا صحيح: أخرجه …"
summary:
