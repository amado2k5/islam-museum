text: "… التكلم بالشهادتين مع الإخلاص والعمل بمقتضاهما، فقد قال الا: الإيمان بضع وسبعون شعبة، أعلاها قول: لا إله إلا الله، وأدناها إماطة الأذى عن الطريق وقال أيضا ف ام: الحياء شعبة من الإيمان وقال أيضا : أكمل المؤمنين إيمانا صحيح: أخرجه …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 2، ص 278، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 2, p. 278, that mentions the branches of faith, faith as seventy-odd branches, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 2، ص 278 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 2, pág. 278, que menciona las ramas de la fe, la fe como setenta y tantos brazos, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 2, p. 278), évoquant les piliers de la foi, la foi divisée en soixante-dix branches, et la douceur et la plénitude de la foi. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Tefsiri'nin 2. cildinin 278. sayfasından, imanın dallarını, yetmişten fazla imanın dalını ve imanın tatlılığını ve mükemmelliğini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-`Izz tentang Akidah al-Tahawi, Jilid 2, halaman 278, yang menyebutkan cabang-cabang iman, tujuh puluh lebih cabang iman, dan kemanisan serta kesempurnaan iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
