  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 2, pág. 278, que menciona las ramas de la fe, la fe como setenta y tantos brazos, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
