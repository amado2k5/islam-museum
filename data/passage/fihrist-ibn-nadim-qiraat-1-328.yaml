text: "… الخَطَّاب عنده، فقال أبو بَكْر، إنَّ عُمَرَ أتَاني فقال لي : إنَّ القَتْلَ قد اسْتَحَرَ بالقُرَاءِ يَوْمَ اليَمَامَة، وإنِّي أحْشَىٰ أن يَسْتَجِرَّ القَثْلُ في القُرَّاءِ في المَوَاطِنِ كُلِّها فيَذْهَبُ كَثِيرٌ من القُرْآن، فأرَىٰ أنْ يُجْمَعَ القُرآنُ بِحَالٍ. فقُلْتُ لعُمَر : …"
