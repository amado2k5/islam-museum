text: "… - فقالِ: يا مُحَمَّدُ، أَحْسِنْ في مَوَالِيّ، وَكَانُوا حُلَفَاءَ الخَزْرَجِ، قال: فأبطأً عليه رسولُ اللّٰه ل، فقال: يا مُحمدُ أَحسِنْ في مَوَالِيَّ، قال: فَأَعْرَضَ عنه، فَأَدْخَلَ يَدَه في جَيْبِ دِرْعِ رسول اللّٰه فَللم. قال ابن هشام: وكان يقال لها: ذاتُ …"
