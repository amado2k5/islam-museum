label: { ar: "جامع الترمذي 480 — الفريضة والفرائض", en: "Jami' al-Tirmidhi 480 — the obligation (farida)", ur: "جامع ترمذی 480 — فریضہ اور فرائض", fr: "Jami' al-Tirmidhi 480 — l'obligation (farida)", es: "Yami' al-Tirmidhi 480 — la obligación (farida)" }
text: "… يُعَلِّمُنَا السُّورَةَ مِنَ الْقُرْآنِ يَقُولُ \" إِذَا هَمَّ أَحَدُكُمْ بِالأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ ثُمَّ لْيَقُلِ اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ وَتَعْلَمُ وَلاَ أَعْلَمُ وَأَنْتَ عَلاَّمُ الْغُيُوبِ اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعِيشَتِي وَعَاقِبَةِ أَمْرِي أَوْ قَالَ فِي عَاجِلِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 480، يرد فيه ذكر الفريضة والفرائض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 480 (The Book on Al-Witr), whose wording mentions the obligation (farida). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 480، جس کے الفاظ میں فریضہ اور فرائض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 480, dont le texte mentionne l'obligation (farida). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 480, cuyo texto menciona la obligación (farida). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
