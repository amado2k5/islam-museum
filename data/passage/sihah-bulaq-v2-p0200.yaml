text: |-
  ٣٨٧
  واذاشة ن الى الطريق وأينه * لهقا كشاكلة الحصان الابلق
  قن) أبو عبيد قليل شقن اتباع له مثل وتح ووعروهي الشقونة وقد قلت عطيت
  وتقنت بالضم وشقنتها أنائقنار أشقنتها اذا قللتها ⁦(شنن)⁩ شن الماءءلى وجهه
  وعلى الشراب فرّة، عليه وقال مدركك بن حصن
  يا كرواناصك فأكبأنا * فشن بالسلح فلماشنا * بل الذنابي عدامبنا
  ومنه قولهم شنْ عليهم الغارة وأشن اذا فرقها عليهم من كل وجه قاات ليلى الاخيلية
  شننا عليهم كل جرد أحشطبة * لجوج تبارى كل أجرد شرجب
  والشنين قطران الماء وقال * يا من لدمع دائم الشنين* وماءشنان بالضم متقرّق قال
  الشاعر أبوذؤيب
  بمامشنان زعزعت متنه الصبا • وجادت عليه ديمة بعدوابل
  والماء الذى بقطرمن قربة أوشجرشنانة أيضا والشنّ القربة الحاق وهى الشنة أيضا وكانها
  صغيرة والجمع الشنان وفى المثل لا يقعقع لى بالشنان قال النابغة
  كانك من يمال بنى أقيش * يقعقع بين رخليه بشن
  والشنان بالفتح البغض لغة فى الشفان قال الاحوص
  وما العيس الاماتلذوتشتهى * وان لام فيه ذ والشنان وفندا
  وتشننت القربة وتشانت أخلقت والتشنن التشتج والييس فى جلد الانسان عند الهرم قال
  وانعاج عودى كالشظيف الاخشن * عنداقورار الجلد والنشنى
  أبو عم روتشان الجاد يدس وتشنج وليس جخلق وشنّ حى من عبد القيس وهو شن بن أفصى بن
  مد القيس بن أفصى بن دعمى بن جديلة بن أسدين ربيعة بن نزار منهم الاعور الشى وفى
  المثل وافق شن طبقه والشنون من الابل الذى ليس بهزول ولاسمين والشنون فى قول
  الطرماح الذئب الشنون * هو الجائع لانه لا يوصف بالسمن والهزال والشنشنة انحلق
  والطبيعة قال الراجز * شنشنة اعرفها من أخزم• واستشن الرجل عزل قاله انخليل
  ( شين الشين خلاف الزين يقال شانه بشينه والمشاين المعايب والمقامح وقول ابيد
  يشين صحاح البيد كل عشية * بعود السراء عندباب محجب
  يريد أنهم يتفاخرون ويخطون بقسيهم على الارض فكأ نهم شانوها بتلك انخطوط والشين
  حرف من حروف المعجم
  صل الساد بن لاضمحى يقال صبنت عنا الهسدية أوما كان من معروف
  نصين صبنا بمعنى كففت قال عمروين كائوم
  صبات الكأس عنا أتم عمرو * وكان الكأس مجراها المينا
  واذا .وى المقاهر الكعبين فى المكف ثم ضرب بهما قيسل قد صبن ويقال له أجل ولا
  تصين والصابون معروف (صحن صحنت بين القوم أصلحت وصحنته صمنان أى ضربنه
  وناقة صحون أى رموح عن أبى عمردوصحن الدار وسطها والعحن العسّ العظيم بقال صمنته
  اذا أعطيقه شيأفيه والصحن طيت وهم اصحنان بضرب أحدهماعلى الآخر قال الراجز
