label: { ar: "الموطأ 1246 — مالك: كل ما من النسور والعقبان والبزاة والرخم فهو صيد يودى إذا قتله المحرم", en: "Muwatta 1246", es: "Muwatta 1246", fr: "Muwatta 1246", ur: "موطا 1246", tr: "El-Muvatta 1246 — Malik: Bütün akbabalar, kartallar, şahinler ve diğer kuşlar av hayvanı sayılır ve ihramlı bir kişi tarafından öldürülmeleri halinde cezalandırılırlar.", id: "Al-Muwatta 1246 — Malik: Semua burung nasar, elang, rajawali, dan burung nasar dianggap sebagai buruan dan harus dihukum jika dibunuh oleh seseorang yang sedang dalam keadaan ihram." }
summary:
  ar: "يقول مالك إن كل شيء من النسور أو العقبان أو البزاة أو الرخم فإنه صيد يودى كما يودى الصيد، إذا قتله المحرم. {cite:muwatta-maruf-1997 p.555}"
  tr: "Malik, kartal, akbaba, şahin veya atmaca olsun, herhangi bir kuşun av hayvanı sayıldığını ve ihramlı biri tarafından öldürülmesi halinde diğer av hayvanlarıyla aynı cezaya tabi olduğunu söyler. {cite:muwatta-maruf-1997 s.555}"
  id: "Malik mengatakan bahwa setiap burung, baik elang, burung nasar, rajawali, atau alap-alap, dianggap sebagai buruan dan dikenakan hukuman yang sama seperti buruan lainnya jika dibunuh oleh seseorang yang sedang dalam keadaan ihram. {cite:muwatta-maruf-1997 p.555}"
