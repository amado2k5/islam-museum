label: { ar: "سنن ابن ماجه 3448 — الحبة السوداء، الداء", en: "Sunan Ibn Majah 3448 — the black seed; the disease and its remedy", ur: "سنن ابن ماجہ 3448 — کلونجی، بیماری", es: "Sunan Ibn Majah 3448 — La semilla negra; la enfermedad y su remedio", fr: "Sunan Ibn Majah 3448 — la graine noire; la maladie et son remède", tr: "Sunan İbn Majah 3448 — Çörek otu, hastalık", id: "Sunan Ibn Majah 3448 — Biji hitam, penyakitnya" }
text: "حَدَّثَنَا أَبُو سَلَمَةَ، يَحْيَى بْنُ خَلَفٍ حَدَّثَنَا أَبُو عَاصِمٍ، عَنْ عُثْمَانَ بْنِ عَبْدِ الْمَلِكِ، قَالَ سَمِعْتُ سَالِمَ بْنَ عَبْدِ اللَّهِ، يُحَدِّثُ عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ ـ قَالَ \" عَلَيْكُمْ بِهَذِهِ الْحَبَّةِ السَّوْدَاءِ فَإِنَّ فِيهَا شِفَاءً مِنْ كُلِّ دَاءٍ إِلاَّ السَّامَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3448، يذكر الحبة السوداء، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3448 (Chapters on Medicine), that mentions the black seed, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3448، جس میں کلونجی، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3448 (Capítulos sobre Medicina), menciona la semilla negra, la enfermedad y su remedio, la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3448 (Chapitres sur la médecine), mentionne la graine de nigelle, la maladie et son remède. Le Répertoire des ressources médicales la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3448 numaralı hadiste çörek otu, hastalık ve tedavi konularından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 3448, menyebutkan biji jintan hitam, penyakit, dan pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
