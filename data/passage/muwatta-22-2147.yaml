label: { ar: "الموطأ 2147 — يحيى عن مالك: الأمر عندنا في الرجل يغتصب المرأة، بكرا كانت أو ثيبا، إنها إن كانت حرة فعليه صداق مثلها، وإن كانت أمة فعليه ما نقص من ثمنها، والعقوبة على المغتصب، ولا عقوبة على المغتصبة. وإن كان المغتصب عبدا فذلك على سيده إلا أن يشاء أن يسلمه", en: "Muwatta 2147", es: "Muwatta 2147", fr: "Muwatta 2147", ur: "موطا 2147", tr: "El-Muvatta 2147 — Yahya, Malik'ten rivayetle: Bir kadına tecavüz eden erkek hakkında, ister bakire olsun ister daha önce evlenmiş olsun, hükmümüz şudur: Eğer kadın özgür ise, erkek ona kendi statüsündeki bir kadının mehirine denk bir mehir ödemek zorundadır. Eğer kadın köle ise, erkek onun değeri ile kendi değeri arasındaki farkı ödemek zorundadır. Ceza tecavüzcüye aittir, tecavüze uğrayan kadına ise ceza verilmez. Eğer tecavüzcü köle ise, efendisi onu teslim etmeyi tercih etmedikçe sorumluluk efendisine aittir.", id: "Al-Muwatta 2147 — Yahya, berdasarkan riwayat Malik: Hukum kami mengenai seorang laki-laki yang memperkosa seorang perempuan, baik perawan maupun yang sudah menikah, adalah jika perempuan itu merdeka, maka ia harus membayar mahar yang setara dengan mahar perempuan sestatusnya. Jika perempuan itu seorang budak, maka ia harus membayar selisih antara nilai perempuan itu dan nilai perempuan yang diperkosa. Hukuman jatuh kepada pemerkosa, dan tidak ada hukuman bagi perempuan yang diperkosa. Jika pemerkosa adalah seorang budak, maka tanggung jawab jatuh kepada tuannya kecuali jika tuannya memilih untuk menyerahkannya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في الرجل يغتصب المرأة، بكرا كانت أو ثيبا: إنها إن كانت حرة فعليه صداق مثلها. وإن كانت أمة فعليه ما نقص من ثمنها، والعقوبة في ذلك على المغتصب، ولا عقوبة على المغتصبة في ذلك كله. وإن كان المغتصب عبدا، فذلك على سيده، إلا أن يشاء أن يسلمه. {cite:muwatta-maruf-1997 p.278}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Bir kadına tecavüz eden erkek hakkında, ister bakire olsun ister daha önce evlenmiş olsun, hükmümüz şudur: Eğer kadın özgür ise, ona kendi statüsündeki bir kadının mehirine denk bir mehir ödemelidir. Eğer kadın köle ise, onun değeri ile değerinin arasındaki farkı ödemelidir. Bu durumda ceza tecavüzcüye aittir ve tecavüze uğrayan kadın için hiçbir ceza yoktur. Eğer tecavüzcü köle ise, efendisi onu teslim etmeyi seçmediği sürece sorumluluk efendisine aittir. {cite:muwatta-maruf-1997 s.278}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Hukum kami mengenai seorang pria yang memperkosa seorang wanita, baik perawan maupun yang sudah menikah, adalah jika wanita itu merdeka, maka ia harus membayar mahar yang setara dengan mahar wanita dengan statusnya. Jika wanita itu seorang budak, maka ia harus membayar selisih antara nilai wanita tersebut dan nilai wanita yang diperkosa. Hukuman dalam kasus ini jatuh kepada pemerkosa, dan tidak ada hukuman bagi wanita yang diperkosa dalam hal ini. Jika pemerkosa adalah seorang budak, maka tanggung jawab jatuh kepada tuannya, kecuali jika tuannya memilih untuk menyerahkannya. {cite:muwatta-maruf-1997 p.278}"
