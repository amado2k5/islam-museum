text: "… النبى فقال: يا رسول اللّٰه اعلنى شيئا اقوله اذا أويت الى غراشى افقال: اقرأ قل يا ايها الكُفرون! فانها براءة من الشرك. وأخرج الحاكم عن عبد اللّٰه بن مسعود قال: يؤتى الرجل فى قبره فتوتى رجلاه فتقول : ليس لكم …"
summary:
