label: { ar: "سنن أبي داود 4705 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan Abi Dawud 4705 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن ابی داؤد 4705 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Abi Dawud 4705 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sunan Abi Dawud 4705 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan Abi Davud 4705 — Baba ve babalık, anne babaya saygı göstermek veya göstermemek", id: "Sunan Abi Dawud 4705 — Ayah dan peran ayah, menghormati atau tidak menaati orang tua" }
text: "حَدَّثَنَا الْقَعْنَبِيُّ، حَدَّثَنَا الْمُعْتَمِرُ، عَنْ أَبِيهِ، عَنْ رَقَبَةَ بْنِ مَصْقَلَةَ، عَنْ أَبِي إِسْحَاقَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عَنْ أُبَىِّ بْنِ كَعْبٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" الْغُلاَمُ الَّذِي قَتَلَهُ الْخَضِرُ طُبِعَ كَافِرًا وَلَوْ عَاشَ لأَرْهَقَ أَبَوَيْهِ طُغْيَانًا وَكُفْرًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4705، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4705 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4705، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4705 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona al padre y la paternidad, así como el cumplimiento o la desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4705 (Conduite exemplaire du Prophète (Kitab Al-Sunnah)), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4705 numaralı hadis, baba ve babalık kavramından, anne babaya saygı göstermekten veya göstermemekten bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4705, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
