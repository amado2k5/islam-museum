label: { ar: "صحيح البخاري 1849 — دفن وقبر ومرقد", en: "Sahih al-Bukhari 1849 — a burial, grave or resting place", ur: "صحیح بخاری 1849 — تدفین، قبر اور مرقد", es: "Sahih al-Bukhari 1849 — un lugar de entierro, tumba o descanso.", fr: "Sahih al-Bukhari 1849 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ بَيْنَا رَجُلٌ وَاقِفٌ مَعَ النَّبِيِّ بِعَرَفَةَ إِذْ وَقَعَ عَنْ رَاحِلَتِهِ، فَوَقَصَتْهُ ـ أَوْ قَالَ فَأَقْعَصَتْهُ ـ فَقَالَ النَّبِيُّ \" اغْسِلُوهُ بِمَاءٍ وَسِدْرٍ، وَكَفِّنُوهُ فِي ثَوْبَيْنِ ـ أَوْ قَالَ ثَوْبَيْهِ ـ وَلاَ تُحَنِّطُوهُ، وَلاَ تُخَمِّرُوا رَأْسَهُ، فَإِنَّ اللَّهَ يَبْعَثُهُ يَوْمَ الْقِيَامَةِ يُلَبِّي \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1849، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1849 (Penalty of Hunting while on Pilgrimage), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 1849، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1849 (Castigo de la caza durante la peregrinación), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 1849 (Peine de chasse en pèlerinage), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
