text: "… بن أبي بكر، عن عبد الرحمن بن الحارث بن هشام عن أبيه - أن النبيّ وَالي تزوَّج أم سلمة في شوال.. الحديث. قال الزُّبَيْرُ: كان شريفاً مذكوراً مدحه كعب بن الأشرف اليهودي، وشهد الحارث بن هشام بَدْراً مع المشركين، وكان …"
