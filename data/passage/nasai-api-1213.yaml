label: { ar: "سنن النسائي 1213 — الأب والأبوة", en: "Sunan al-Nasa'i 1213 — the father and fatherhood", ur: "سنن نسائی 1213 — باپ اور والدیت", es: "Sunan al-Nasa'i 1213 — El padre y la paternidad" }
text: "… بْنِ دِينَارٍ، قَالَ حَدَّثَنَا أَبُو أُسَامَةَ، قَالَ حَدَّثَنِي شُرَحْبِيلُ، - يَعْنِي ابْنَ مُدْرِكٍ - قَالَ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ نُجَىٍّ، عَنْ أَبِيهِ، قَالَ قَالَ لِي عَلِيٌّ كَانَتْ لِي مَنْزِلَةٌ مِنْ رَسُولِ اللَّهِ لَمْ تَكُنْ لأَحَدٍ مِنَ الْخَلاَئِقِ فَكُنْتُ آتِيهِ كُلَّ سَحَرٍ فَأَقُولُ السَّلاَمُ عَلَيْكَ يَا نَبِيَّ اللَّهِ فَإِنْ تَنَحْنَحَ انْصَرَفْتُ إِلَى أَهْلِي وَإِلاَّ دَخَلْتُ عَلَيْهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1213، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1213 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1213، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1213 (El Libro del Olvido (En la Oración)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
