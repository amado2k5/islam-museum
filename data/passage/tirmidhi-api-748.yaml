text: "… سَلْمَانَ، عَنْ عُبَيْدِ اللَّهِ بْنِ مُسْلِمٍ الْقُرَشِيِّ، عَنْ أَبِيهِ، قَالَ سَأَلْتُ أَوْ سُئِلَ رَسُولُ اللَّهِ عَنْ صِيَامِ الدَّهْرِ فَقَالَ \" إِنَّ لأَهْلِكَ عَلَيْكَ حَقًّا صُمْ رَمَضَانَ وَالَّذِي يَلِيهِ وَكُلَّ أَرْبِعَاءٍ وَخَمِيسٍ فَإِذًا أَنْتَ قَدْ صُمْتَ الدَّهْرَ وَأَفْطَرْتَ \". وَفِي الْبَابِ عَنْ عَائِشَةَ. قَالَ أَبُو عِيسَى حَدِيثُ مُسْلِمٍ الْقُرَشِيِّ حَدِيثٌ غَرِيبٌ. وَرَوَى بَعْضُهُمْ عَنْ هَارُونَ بْنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 748، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 748 (The Book on Fasting), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 748، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
