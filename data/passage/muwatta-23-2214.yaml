label: { ar: "الموطأ 2214 — مالك عن نافع عن عبد الله بن عمر: قال رسول الله ما حق امرئ مسلم له شيء يوصى فيه يبيت ليلتين إلا ووصيته عنده مكتوبة", en: "Muwatta 2214" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: ما حق امرئ مسلم، له شيء يوصى فيه، يبيت ليلتين، إلا ووصيته عنده مكتوبة. ويذكر المحقق أن هذا الحديث لا خلاف عن مالك في لفظه ولا في إسناده. {cite:muwatta-maruf-1997 p.309}"
