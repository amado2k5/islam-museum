text: "قال رسول الله: «الدنيا سجن المؤمن وجنة الكافر»"
summary:
  ar: "أول حديث في كتاب الزهد والرقائق من صحيح مسلم؛ رواية أبي هريرة، ويليه حديث جابر أن النبي مر بالسوق والناس كنفتاه. الصورة المكثفة لموقع الدنيا من قلب المؤمن في الحديث النبوي."
  tr: "Sahih Müslim'deki Zühvet ve Manevi Arınma Kitabı'ndaki ilk hadis, Ebu Hurayra tarafından rivayet edilmiştir; bunu, Peygamberin iki yanında insanlar varken çarşıdan geçtiğini anlatan Cabir hadisi takip eder. Bu, Peygamber geleneğinde tasvir edildiği gibi, dünyevi hayatın müminin kalbindeki yerinin özlü bir örneğidir."
  id: "Hadits pertama dalam Kitab Asketis dan Penyempurnaan Spiritual dalam Sahih Muslim diriwayatkan oleh Abu Hurairah, diikuti oleh hadits Jabir bahwa Nabi melewati pasar dengan orang-orang di kedua sisinya. Ini adalah ilustrasi singkat tentang tempat kehidupan duniawi di hati seorang mukmin, sebagaimana digambarkan dalam tradisi kenabian."
