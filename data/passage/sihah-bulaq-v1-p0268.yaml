text: |-
  ⁦(عيد )⁩
  ٢٧٢
  فى معنى تعاوروافبن عليه كمافسرناه في تحاوروا وتعاورت الرياح رسم الدار وعاره يعوره
  ويعيرم أى أخذه وذهب به يقالوما أدرى أى الجراد عار أى أى الناس ذهب به ⁦( هر)⁩
  بوعمر والعهر الزناوكذلك العهر مثل نهرونهر ولا أحسكى التهريك عن أبى عمرويال عهر
  فهوعاهر وفي الحديث الولد للفراش وللعاهرالحجر والاسم العهر بالكسر وأنتدلاين دارة
  التغلمر
  فقام لايحفل ثم كهرا * ولا يسالى لويلا قى عهوا
  والمرأة عاهرة ومعاهرة وعيهرة وتعبهر الرجل اذا كان فاجرا ⁦(عبر)⁩ العبر الحماد الوحشى
  والاهلى أيضا والانى عيرة وابمع أعيارومعيوراهوعيورة مثل نجل وفحولة وعير المين جفنه
  منه قولهسم فعلت ذاقبل عير وماجرى أى قبل لحظ العين قال أبو عبيدة ولا يقال أفعل
  قال الحرث ين حلزة زعمواأت كل من ضرب العر موال لناوانى الولاء
  قال أبو ع ووبن العلامذهب من كان يعرف معنى هذا البيت ويقال ما أدرى أمن ضرب
  العبرهو أى أيّالناس هوحكام يعقوب وعبر القوم سيدهم وقولهسم عير بعبر وزيادة عشرة
  كان الخليفة من بني أمية اذامات وقام آخر زاد فى أرزاقهم عشرة دراهم والعير الوتذ وعير
  جبل بالمدينة وفى الجديت انه -ؤم ما بين عير الى تور وعير النصل الناتئ منه في وسطه وكذلك
  عير السكتف وعير القدم الشاخص فى ظهرها وعسير الاذن الوتد الذي فى باطنها وعير الورقة
  اخط الذى فى وسطها وعير السراة طائر كهيئة الهامة ويقال للموضع الذى لاخير فيه
  هو كموف عير لانه لاشئ فى جوفه ينتفع به ويقال أصل قولهم أخلي من جوف جار وقد
  فسر نام ويقال العيرههنا الطبل وقديدة عارة أى سائرة ويقال ما قالت العرب بينا أعير
  من كذا أى أسيروفلان عييروحده أى معجب برأيه وهو ذم وان شئت كسرت أوّله-ثل شميخ
  وسيخ ولا تقل عويرولاشويخ وعار في الارض بعير أى ذهب والعائرة الناقة تخرج من
  الابل الى الاخرى ليضربها الفعل والجمل عار يترك الشول الى أخري وعار الفرس أي اتفلت
  وذهب ههنا وههنا من مرحه وأعاره صاحبه فهومعارومنه قول الطرجاح
  وجدنا فى كتاب بن تيم • أحق الحيل بالركض المعار
  قال أبو عبيدة والناس يرونه المعار من العارية وهوخطأ وفرس عيبار بأوصال أى يعير
  لهنا وههنا من تشاطه ومعى الاسد عيار المجيته وذهابه فى طلب صده قال الشاعر
  لمارأيت أما عمرو رزمت • منى كمارزم العمار فى الغرف
  جمع غُريف وهى الغابة وح-كم الفتراء رجل عياراذا كان كثير التطواف والجركة ذكيا
  ويقال عار الرجل فى القوم يضربهم مثل عاث وتعار بكسر التاءاسم جبل قال بشر
  وشابة عن شمائلها تعار وهيماجيلان في بلادقيس وعيره كذا من التعيير والعامة تقولِ
  عيره بكذا ١ ل النسابغة
  وعيرتي ينوذبيان رهبته * وهل على بأن أخشاك من عار
  والعار السبة والعيب يقال عاره اذاعابه والمعاير المعايب قالت ليلى الاخيلية
  لعورك مابالموت عار على امرئ * اذالم تصبه فى الحياة المعاير
  وتغاير القوم تعايبوا وعايرت المكابيل والموازين عباراوعاورت بعنى يقال عابر وابين
  ٩٤
  جداح
  قوله والناس يرونه أى يظنونة
  اسكذاعبارة الصماح خافى
  القاموس والناس يروونه بواوين
  من الرواية نبع فيه نسجفة محرفة
  كافى الوشاح
  أحدكم اخاه برضاعة كلبة الخ
  فالدنصر
