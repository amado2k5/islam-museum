label: { ar: "جامع الترمذي 3754 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 3754 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 3754 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 3754 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Jami' al-Tirmidhi 3754 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux" }
text: "حَدَّثَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، وَعَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ سَعْدِ بْنِ أَبِي وَقَّاصٍ، قَالَ جَمَعَ لِي رَسُولُ اللَّهِ أَبَوَيْهِ يَوْمَ أُحُدٍ. هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ رُوِيَ هَذَا الْحَدِيثُ عَنْ عَبْدِ اللَّهِ بْنِ شَدَّادِ بْنِ الْهَادِ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، عَنِ النَّبِيِّ"
summary:
  ar: "حديث في جامع الترمذي، رقم 3754، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3754 (Chapters on Virtues), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3754، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3754 (Capítulos sobre las virtudes), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3754 (Chapitres sur les vertus), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
