text: "… العمى عن جناياتها. فقلت: هل من دواء أتعالج به من هذا العمى الذي قد حجب عني ما يراد بي؟ قال: ما أراك تقدر على العلاج فاستعمل من الدواء أيسره. قلت: صف لي دواء لطيفاً. قال: فما داؤك؟ قلت: حب الدنيا. …"
