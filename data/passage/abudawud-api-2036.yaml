text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، أَنَّ زَيْدَ بْنَ الْحُبَابِ، حَدَّثَهُمْ حَدَّثَنَا سُلَيْمَانُ بْنُ كِنَانَةَ، مَوْلَى عُثْمَانَ بْنِ عَفَّانَ أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ أَبِي سُفْيَانَ، عَنْ عَدِيِّ بْنِ زَيْدٍ، قَالَ حَمَى رَسُولُ اللَّهِ كُلَّ نَاحِيَةٍ مِنَ الْمَدِينَةِ بَرِيدًا بَرِيدًا لاَ يُخْبَطُ شَجَرُهُ وَلاَ يُعْضَدُ إِلاَّ مَا يُسَاقُ بِهِ الْجَمَلُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2036، يذكر الحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 2036 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 2036، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
