text: "… إلى النار لا ينجو منها، ولا يكون لمقامه فيها منتهى. اه وقال البخاري رَمّاله في صحيحه : كتاب الإيمان، باب قول النبي غ بُنِيَ الْإِسْلَامُ عَلَى خَمْسِ وهو قَوْلٌ وَفِعْلٌ وَيَزِيدُ وَيَنْقُصُ اه. قال الحافظ ابن حجر: وفي رواية الكشميهني …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 65، يذكر ما بُني عليه الإسلام، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 65, that mentions what Islam is built on, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 65 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 3, pág. 65, que menciona los fundamentos del Islam, el aumento y la disminución de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 3, p. 65), qui évoque les fondements de l'islam, la croissance et le déclin de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 3. cildinin 65. sayfasından, İslam'ın temellerini ve imanın artışını ve azalışını ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 3, halaman 65, yang membahas landasan Islam dan peningkatan serta penurunan iman; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
