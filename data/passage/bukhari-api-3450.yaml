label: { ar: "صحيح البخاري 3450 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Sahih al-Bukhari 3450 — a testament or parting counsel; a deathbed and last hours", ur: "صحیح بخاری 3450 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات" }
text: "… عَنِ الْمُعْسِرِ. فَأَدْخَلَهُ اللَّهُ الْجَنَّةَ \". فَقَالَ وَسَمِعْتُهُ يَقُولُ \" إِنَّ رَجُلاً حَضَرَهُ الْمَوْتُ، فَلَمَّا يَئِسَ مِنَ الْحَيَاةِ أَوْصَى أَهْلَهُ إِذَا أَنَا مُتُّ فَاجْمَعُوا لِي حَطَبًا كَثِيرًا وَأَوْقِدُوا فِيهِ نَارًا حَتَّى إِذَا أَكَلَتْ لَحْمِي، وَخَلَصَتْ إِلَى عَظْمِي، فَامْتَحَشْتُ، فَخُذُوهَا فَاطْحَنُوهَا، ثُمَّ انْظُرُوا يَوْمًا رَاحًا فَاذْرُوهُ فِي الْيَمِّ. فَفَعَلُوا، فَجَمَعَهُ فَقَالَ لَهُ لِمَ فَعَلْتَ ذَلِكَ قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3450، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3450, that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3450، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
