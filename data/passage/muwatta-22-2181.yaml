label: { ar: "الموطأ 2181 — يحيى عن مالك: في الجمل يصول على الرجل فيخافه على نفسه فيقتله أو يعقره: إن كانت له بينة على أنه أراده وصال عليه فلا غرم عليه، وإن لم تقم له بينة إلا مقالته فهو ضامن للجمل", en: "Muwatta 2181" }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول في الجمل يصول على الرجل فيخافه على نفسه، فيقتله أو يعقره: فإنه إن كانت له بينة على أنه أراده وصال عليه، فلا غرم عليه. وإن لم تقم له بينة إلا مقالته، فهو ضامن للجمل. {cite:muwatta-maruf-1997 p.295}"
