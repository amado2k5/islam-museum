label: { ar: "الموطأ 2181 — يحيى عن مالك: في الجمل يصول على الرجل فيخافه على نفسه فيقتله أو يعقره: إن كانت له بينة على أنه أراده وصال عليه فلا غرم عليه، وإن لم تقم له بينة إلا مقالته فهو ضامن للجمل", en: "Muwatta 2181", es: "Muwatta 2181", fr: "Muwatta 2181", ur: "موطا 2181", tr: "El-Muvatta 2181 — Yahya, Malik'ten rivayetle: Bir devenin bir adama saldırması ve adamın canından korkarak onu öldürmesi veya yaralaması durumunda: Eğer adamın devenin kendisine saldırmak istediğine dair delili varsa, sorumlu değildir. Ancak kendi ifadesinden başka delili yoksa, deveden sorumludur.", id: "Al-Muwatta 2181 — Yahya berdasarkan riwayat Malik: Mengenai seekor unta yang menyerang seorang manusia, dan manusia itu takut akan nyawanya sehingga ia membunuh atau melukai unta tersebut: jika ia mempunyai bukti bahwa unta itu bermaksud menyerangnya, maka ia tidak bertanggung jawab. Tetapi jika ia tidak mempunyai bukti selain pernyataannya sendiri, maka ia bertanggung jawab atas unta tersebut." }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول في الجمل يصول على الرجل فيخافه على نفسه، فيقتله أو يعقره: فإنه إن كانت له بينة على أنه أراده وصال عليه، فلا غرم عليه. وإن لم تقم له بينة إلا مقالته، فهو ضامن للجمل. {cite:muwatta-maruf-1997 p.295}"
  tr: "Yahya şöyle dedi: Malik'in, bir devenin bir adama saldırması ve adamın canından korkmasına neden olması, adamın deveyi öldürmesi veya yaralaması durumunda şöyle dediğini duydum: Eğer adamın devenin kendisine saldırdığına dair delili varsa, sorumlu değildir. Ancak kendi ifadesinden başka delili yoksa, deveden sorumludur. {cite:muwatta-maruf-1997 s.295}"
  id: "Yahya berkata: Aku mendengar Malik berkata mengenai seekor unta yang menyerang seorang pria, menyebabkan pria itu takut akan nyawanya, dan pria itu membunuh atau melukai unta tersebut: Jika pria itu memiliki bukti bahwa unta itu menyerangnya, dia tidak bertanggung jawab. Tetapi jika dia tidak memiliki bukti selain pernyataannya sendiri, dia bertanggung jawab atas unta tersebut. {cite:muwatta-maruf-1997 p.295}"
