label: { ar: "الموطأ 1690 — سعيد بن المسيب وابن شهاب وسليمان بن يسار: عدة المختلعة ثلاثة قروء", en: "Muwatta 1690", es: "Muwatta 1690", fr: "Muwatta 1690", ur: "موطا 1690", tr: "El-Muvatta 1690 — Sa'id ibn al-Musayyab, İbn Şihab ve Süleyman ibn Yasar: Hulü' boşanma almış bir kadının bekleme süresi üç adet adet döngüsüdür.", id: "Al-Muwatta 1690 — Sa`id ibn al-Musayyab, Ibn Shihab, dan Sulayman ibn Yasar: Masa iddah bagi wanita yang telah memperoleh khul` cerai adalah tiga siklus menstruasi." }
summary:
  ar: "يروي مالك أنه بلغه عن سعيد بن المسيب وابن شهاب وسليمان بن يسار أنهم كانوا يقولون عدة المختلعة ثلاثة قروء. {cite:muwatta-maruf-1997 p.91}"
  tr: "Malik, Sa'id ibn al-Musayyab, İbn Şihab ve Sulayman ibn Yasar'dan, hulu' boşanma almış bir kadının bekleme süresinin üç adet adet döngüsü olduğunu duyduklarını rivayet eder. {cite:muwatta-maruf-1997 s.91}"
  id: "Malik meriwayatkan bahwa ia mendengar dari Sa'id ibn al-Musayyab, Ibn Shihab, dan Sulayman ibn Yasar bahwa mereka biasa mengatakan bahwa masa iddah bagi wanita yang telah memperoleh khul' cerai adalah tiga siklus menstruasi. {cite:muwatta-maruf-1997 p.91}"
