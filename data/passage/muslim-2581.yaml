label: { ar: "مسلم 2581 — أتدرون ما المفلس", en: "Muslim 2581 — Do you know who the bankrupt one is?" }
text: "قال رسول الله: «أتدرون ما المفلس؟» قالوا: المفلس فينا من لا درهم له ولا متاع؛ فقال: «إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة، ويأتي قد شتم هذا وقذف هذا وأكل مال هذا وسفك دم هذا وضرب هذا، فيعطى هذا من حسناته وهذا من حسناته، فإن فنيت حسناته قبل أن يقضى ما عليه أخذ من خطاياهم فطرحت عليه ثم طرح في النار»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ المفلس الحقيقي من يأتي بالأعمال وقد أتلف حقوق الناس — من أشهر نصوص الحساب يوم القيامة."
