label: { ar: "مسلم 2581 — أتدرون ما المفلس", en: "Muslim 2581 — Do you know who the bankrupt one is?", es: "Musulmán 2581 — ¿Sabes quién es el que está en bancarrota?", fr: "Muslim 2581 — Sais-tu qui est le failli ?", ur: "مسلم 2581 - کیا آپ جانتے ہیں کہ دیوالیہ کون ہے؟", tr: "Müslim 2581 — İflas eden kişinin kim olduğunu biliyor musunuz?", id: "Muslim 2581 — Tahukah kamu siapa yang bangkrut?" }
text: "قال رسول الله: «أتدرون ما المفلس؟» قالوا: المفلس فينا من لا درهم له ولا متاع؛ فقال: «إن المفلس من أمتي يأتي يوم القيامة بصلاة وصيام وزكاة، ويأتي قد شتم هذا وقذف هذا وأكل مال هذا وسفك دم هذا وضرب هذا، فيعطى هذا من حسناته وهذا من حسناته، فإن فنيت حسناته قبل أن يقضى ما عليه أخذ من خطاياهم فطرحت عليه ثم طرح في النار»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ المفلس الحقيقي من يأتي بالأعمال وقد أتلف حقوق الناس — من أشهر نصوص الحساب يوم القيامة."
  tr: "Sahih Müslim'de yer alan Salihlik Kitabı'ndaki Ebu Hurayra rivayetine göre: \"Gerçek iflas etmiş kişi, insanların haklarını yok eden amellerle gelen kimsedir.\" - Bu, Kıyamet Günü'ndeki hesaplaşmayla ilgili en meşhur ayetlerden biridir."
  id: "Riwayat Abu Hurairah dalam Kitab Kebajikan dari Sahih Muslim: Orang yang benar-benar bangkrut adalah orang yang datang dengan amal perbuatan yang telah menghancurkan hak-hak manusia — salah satu teks perhitungan yang paling terkenal pada Hari Kiamat."
