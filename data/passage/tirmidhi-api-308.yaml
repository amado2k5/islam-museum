text: "النَّبِيِّ صلى الله عليه وسلم أَنَّهُ قَرَأَ فِي الْمَغْرِبِ بِالطُّورِ ‏.‏ وَرُوِيَ عَنْ عُمَرَ أَنَّهُ كَتَبَ إِلَى أَبِي مُوسَى أَنِ اقْرَأْ فِي الْمَغْرِبِ بِقِصَارِ الْمُفَصَّلِ ‏.‏ وَرُوِيَ عَنْ أَبِي بَكْرٍ الصِّدِّيقِ أَنَّهُ قَرَأَ فِي الْمَغْرِبِ بِقِصَارِ الْمُفَصَّلِ ‏.‏ قَالَ وَعَلَى هَذَا الْعَمَلُ عِنْدَ أَهْلِ الْعِلْمِ وَبِهِ يَقُولُ ابْنُ الْمُبَارَكِ وَأَحْمَدُ وَإِسْحَاقُ ‏.‏ وَقَالَ الشَّافِعِيُّ وَذُكِر …"
summary:
  ar: "في جامع الترمذي؛ إرسال كتاب أو رسالة إلى طرف."
