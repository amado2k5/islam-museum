label: { ar: "الموطأ 2186 — يحيى عن مالك: إذا ابتاع الرجل ثوبا به عيب من حرق أو غيره قد علمه البائع، فشهد عليه بذلك أو أقر به، فأحدث فيه المبتاع حدثا من تقطيع ينقص من ثمن الثوب، ثم علم المبتاع بالعيب، فهو رد على البائع، وليس على الذي ابتاعه غرم في تقطيعه", en: "Muwatta 2186", es: "Muwatta 2186", fr: "Muwatta 2186", ur: "موطا 2186", tr: "El-Muvatta 2186 — Yahya, Malik'ten rivayetle: Bir kimse, satıcının bildiği ve şahitlik ettiği veya kabul ettiği yanık veya başka bir hasar gibi bir kusuru olan bir giysi satın alırsa ve daha sonra alıcı giysinin fiyatını düşürecek şekilde bir kesik yaparsa ve alıcı daha sonra kusuru keşfederse, giysi satıcıya iade edilir ve alıcı, kesimden kaynaklanan herhangi bir zarardan sorumlu değildir.", id: "Al-Muwatta 2186 — Yahya berdasarkan riwayat Malik: Jika seseorang membeli pakaian yang cacat, seperti bekas terbakar atau kerusakan lainnya, yang diketahui dan diakui oleh penjual, kemudian pembeli memotong pakaian tersebut sehingga harganya turun, dan kemudian pembeli menemukan cacat tersebut, maka pakaian tersebut dikembalikan kepada penjual, dan pembeli tidak bertanggung jawab atas kerugian yang timbul akibat pemotongan tersebut." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: إذا ابتاع الرجل ثوبا وبه عيب من حرق أو غيره قد علمه البائع، فشهد عليه بذلك، أو أقر به، فأحدث فيه الذي ابتاعه حدثا من تقطيع ينقص من ثمن الثوب، ثم علم المبتاع بالعيب، فهو رد على البائع، وليس على الذي ابتاعه غرم في تقطيعه إياه. {cite:muwatta-maruf-1997 p.297}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Eğer bir adam, satıcının bildiği ve şahitlik ettiği veya kabul ettiği, yanık veya başka bir kusuru olan bir giysi satın alırsa ve daha sonra alıcı giysinin değerini düşürecek bir kesik atarsa ve alıcı daha sonra bu kusuru keşfederse, giysi satıcıya iade edilir ve alıcı, kesimden kaynaklanan herhangi bir kayıptan sorumlu değildir. {cite:muwatta-maruf-1997 s.297}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Jika seseorang membeli pakaian yang cacat, seperti bekas terbakar atau cacat lainnya, yang diketahui dan diakui oleh penjual, dan kemudian pembeli membuat potongan yang mengurangi nilai pakaian tersebut, dan pembeli kemudian menemukan cacat tersebut, maka pakaian tersebut dikembalikan kepada penjual, dan pembeli tidak bertanggung jawab atas kerugian apa pun karena memotongnya. {cite:muwatta-maruf-1997 p.297}"
