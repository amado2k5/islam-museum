label: { ar: "الموطأ 2186 — يحيى عن مالك: إذا ابتاع الرجل ثوبا به عيب من حرق أو غيره قد علمه البائع، فشهد عليه بذلك أو أقر به، فأحدث فيه المبتاع حدثا من تقطيع ينقص من ثمن الثوب، ثم علم المبتاع بالعيب، فهو رد على البائع، وليس على الذي ابتاعه غرم في تقطيعه", en: "Muwatta 2186" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: إذا ابتاع الرجل ثوبا وبه عيب من حرق أو غيره قد علمه البائع، فشهد عليه بذلك، أو أقر به، فأحدث فيه الذي ابتاعه حدثا من تقطيع ينقص من ثمن الثوب، ثم علم المبتاع بالعيب، فهو رد على البائع، وليس على الذي ابتاعه غرم في تقطيعه إياه. {cite:muwatta-maruf-1997 p.297}"
