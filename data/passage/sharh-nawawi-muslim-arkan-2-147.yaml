text: "… ابن بطال وقال الشيخ الامام أبو عمر و بن الصلاح قوله الاسلام أن تشهد أن لا اله الا اللّه وأن محمداً رسول اللّه وتقيم الصلاة وتؤتى الزكاة وتصوم زمضان وتحج البيت ان استطعت اليه سبيلا"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 2، ص 147، يذكر تعريف الإسلام بأعماله، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 2, p. 147, that mentions Islam defined by its acts, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 2، ص 147 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 2, pág. 147, que menciona el Islam definido por sus actos, el testimonio, la oración y el zakat; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 2, p. 147) mentionnant que l'islam est défini par ses actes, le témoignage, la prière et la zakat. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 2. cildinin 147. sayfasından bir alıntı, İslam'ı ameller, iman ikrarı, namaz ve zekât üzerinden tanımlar. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 2, halaman 147, mendefinisikan Islam melalui amalan-amalannya, yaitu pengakuan iman, salat, dan zakat. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
