label: { ar: "الموطأ 2855 — العلاء بن عبد الرحمن: ما نقصت صدقة من مال ولا زاد الله عبدا بعفو إلا عزا", en: "Muwatta 2855" }
summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن أنه سمعه يقول: ما نقصت صدقة من مال، وما زاد الله عبدا بعفو إلا عزا، وما تواضع عبد إلا رفعه الله. ويقول مالك: لا أدري أيرفع هذا الحديث عن النبي أم لا. ويذكر المحقق أنه مرفوع من حديث العلاء عن أبيه عن أبي هريرة عند مسلم وغيره. {cite:muwatta-maruf-1997 p.599} {cite:muwatta-maruf-1997 p.600}"
