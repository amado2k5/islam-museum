label: { ar: "الموطأ 2855 — العلاء بن عبد الرحمن: ما نقصت صدقة من مال ولا زاد الله عبدا بعفو إلا عزا", en: "Muwatta 2855", es: "Muwatta 2855", fr: "Muwatta 2855", ur: "موطا 2855", tr: "El-Muvatta 2855 — El-Ala' ibn Abd el-Rahman: Sadaka malı azaltmaz ve Allah, bağışlama yoluyla kulunun şerefini artırmaz.", id: "Al-Muwatta 2855 — Al-Ala’ ibn Abd al-Rahman: Sedekah tidak mengurangi kekayaan, dan Allah tidak menambah kehormatan seorang hamba melalui pengampunan." }
summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن أنه سمعه يقول: ما نقصت صدقة من مال، وما زاد الله عبدا بعفو إلا عزا، وما تواضع عبد إلا رفعه الله. ويقول مالك: لا أدري أيرفع هذا الحديث عن النبي أم لا. ويذكر المحقق أنه مرفوع من حديث العلاء عن أبيه عن أبي هريرة عند مسلم وغيره. {cite:muwatta-maruf-1997 p.599} {cite:muwatta-maruf-1997 p.600}"
  tr: "Malik, Al-Ala' ibn Abd al-Rahman'dan rivayetle, onun şöyle dediğini işittiğini aktarır: \"Sadaka malı azaltmaz, Allah ise sadece bağışlama yoluyla kulunun şerefini artırır ve hiçbir kul kendini alçaltmazsa Allah onu derecesini yükseltir.\" Malik şöyle der: \"Bu hadisin Peygamber'e dayandırılıp dayandırılmadığını bilmiyorum.\" Araştırmacı, bu hadisin, Müslim ve diğer kaynaklarda bulunduğu üzere, Al-Ala' aracılığıyla, babasından, o da Ebu Hurayra'dan rivayetle Peygamber'e dayandırıldığını belirtir. {cite:muwatta-maruf-1997 s.599} {cite:muwatta-maruf-1997 s.600}"
  id: "Malik meriwayatkan dari Al-Ala’ ibn Abd al-Rahman bahwa ia mendengar beliau berkata: “Sedekah tidak mengurangi kekayaan, dan Allah hanya menambah kehormatan seorang hamba melalui pengampunan, dan tidak ada seorang hamba pun yang merendahkan diri kecuali Allah akan meninggikan derajatnya.” Malik berkata: “Saya tidak tahu apakah hadits ini berasal dari Nabi atau tidak.” Peneliti menyebutkan bahwa hadits ini berasal dari Nabi melalui Al-Ala’ dari ayahnya dari Abu Hurayrah, sebagaimana terdapat dalam Muslim dan koleksi lainnya. {cite:muwatta-maruf-1997 p.599} {cite:muwatta-maruf-1997 p.600}"
