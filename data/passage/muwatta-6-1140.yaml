label: { ar: "الموطأ 1140 — جعفر بن محمد عن أبيه: كان علي بن أبي طالب يقول: ما استيسر من الهدي شاة", en: "Muwatta 1140", es: "Muwatta 1140", fr: "Muwatta 1140", ur: "موطا 1140", tr: "El-Muvatta 1140 — Cafer ibn Muhammed, babasından rivayetle: Ali ibn Abi Talib şöyle derdi: Kurban olarak kolayca bulunabilen her şey koyundur.", id: "Al-Muwatta 1140 — Ja`far ibn Muhammad, berdasarkan riwayat ayahnya: Ali ibn Abi Talib biasa berkata: Apa pun yang mudah didapatkan sebagai kurban adalah seekor domba." }
summary:
  ar: "يروي مالك عن جعفر بن محمد عن أبيه أن علي بن أبي طالب كان يقول إن ما استيسر من الهدي شاة. {cite:muwatta-maruf-1997 p.518}"
  tr: "Malik, Cafer ibn Muhammed'den, o da babasından rivayet ettiğine göre, Ali ibn Abi Talib'in, kurban olarak kolayca bulunabilen her şeyin koyun olduğunu söylediğini nakletmiştir. {cite:muwatta-maruf-1997 s.518}"
  id: "Malik meriwayatkan dari Ja'far ibn Muhammad, yang juga meriwayatkan dari ayahnya, bahwa Ali ibn Abi Talib biasa mengatakan bahwa apa pun yang mudah didapatkan sebagai kurban adalah seekor domba. {cite:muwatta-maruf-1997 p.518}"
