text: "… عدوّ اللّٰه و عدوّكم من اليهود وقريش وكفار العرب. وَآخَرِينَ مِنْ دُونِهِمْ يعني فارس والروم؛ قاله السُّدِّي. وقيل: الجنّ. وهو اختيار الطبري. وقيل : المراد بذلك كلُّ من لا تُعرف عداوته. قال السُّهيليّ: قيل هم قُريظة. وقيل : هم من …"
