label: { ar: "سنن أبي داود 180 — القراء", en: "Sunan Abi Dawud 180 — the readers", ur: "سنن ابی داؤد 180 — قراء", es: "Sunan Abi Dawud 180 - los lectores", fr: "Sunan Abi Dawud 180 — les lecteurs", tr: "Sünen Ebu Davud 180 — Okuyanlar", id: "Sunan Abi Dawud 180 — Pembaca" }
text: "… الإِسْنَادِ فِي الْمُسْتَحَاضَةِ أَنَّهَا تَتَوَضَّأُ لِكُلِّ صَلاَةٍ - قَالَ يَحْيَى احْكِ عَنِّي أَنَّهُمَا شِبْهُ لاَ شَىْءَ. قَالَ أَبُو دَاوُدَ وَرُوِيَ عَنِ الثَّوْرِيِّ قَالَ مَا حَدَّثَنَا حَبِيبٌ إِلاَّ عَنْ عُرْوَةَ الْمُزَنِيِّ يَعْنِي لَمْ يُحَدِّثْهُمْ عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ بِشَىْءٍ. قَالَ أَبُو دَاوُدَ وَقَدْ رَوَى حَمْزَةُ الزَّيَّاتُ عَنْ حَبِيبٍ عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ عَنْ عَائِشَةَ حَدِيثًا صَحِيحًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 180، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Abi Dawud, no. 180 (Purification (Kitab Al-Taharah)), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 180، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 180 (Purificación (Kitab Al-Taharah)), menciona a los lectores. El catálogo del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Abi Dawud, n° 180 (Purification (Kitab Al-Taharah)), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à l'écriture du Coran le répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "Sünen Ebu Davud'da yer alan 180 numaralı hadiste, Kur'an okuyucularından bahsedilir. Bu derleme, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 180, menyebutkan para pembaca Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
