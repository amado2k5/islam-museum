text: "… على قلوب لم تجد من اللّٰه شيئاً من هذا. أخبرنا ابن ناصر بالإسناد عن أبي محمد الحريري قال: من استولت عليه النفس صار أسيراً في حكم الشهوات، محصوراً في سجن الهوى، فحرم اللّٰه على قلبه الفوائد، فلا يستلذ بكلامه، ولا …"
