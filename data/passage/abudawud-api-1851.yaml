label: { ar: "سنن أبي داود 1851 — الحلال", en: "Sunan Abi Dawud 1851 — the lawful", ur: "سنن ابی داؤد 1851 — حلال" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا يَعْقُوبُ، - يَعْنِي الإِسْكَنْدَرَانِيَّ الْقَارِيَّ - عَنْ عَمْرٍو، عَنِ الْمُطَّلِبِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" صَيْدُ الْبَرِّ لَكُمْ حَلاَلٌ مَا لَمْ تَصِيدُوهُ أَوْ يُصَدْ لَكُمْ \". قَالَ أَبُو دَاوُدَ إِذَا تَنَازَعَ الْخَبَرَانِ عَنِ النَّبِيِّ يُنْظَرُ بِمَا أَخَذَ بِهِ أَصْحَابُهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1851، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1851 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1851، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
