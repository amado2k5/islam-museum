text: "… شعب الايمان.. الفصل الثالث - عن زيد بن أرقمَ، أنّ رسولَ الله عنا قال : مَنْ وعدَ رجلاً قلم بأتِ أحدهما إلى وقتِ الصَّلاةِ، وذهب الذي جاءَ ليُصلي، فلا إثمَ عليهِ. رواه رزين. إسناده ضعيف. إِسناده ضعيف. التنبيه، أو امم …"
