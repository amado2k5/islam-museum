text: "… بالإسلام، فقلت : ما آية الإِسلام ؟ فقال : تشهد أَن لا إله إلا اللّه وأَنَّ محمدًا رسوله، وتقيم الصلاة، وتؤتي الزكاة، وتفارق الشرك، وأنَّ كل مسلم عن مسلم محرم، أَخوان نصيران، لا يقبل اللّٰه من مشرك أَشرك بعد إسلامه …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 5657، يذكر الشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
