label: { ar: "الموطأ 2377 — ابن شهاب: الاعتراف الرجم وأخذ الرجل بإقراره", en: "Muwatta 2377", es: "Muwatta 2377", fr: "Muwatta 2377", ur: "موطا 2377", tr: "El-Muvatta 2377 — İbn Şihab: İtiraf, taşlanarak cezalandırılır ve insan itirafından sorumlu tutulur.", id: "Al-Muwatta 2377 — Ibn Shihab: Pengakuan dosa dihukum dengan rajam, dan seseorang dimintai pertanggungjawaban atas pengakuannya." }
summary:
  ar: "حدث مالك عن ابن شهاب أنه أخبره أن رجلا اعترف على نفسه بالزنا على عهد النبي، وشهد على نفسه أربع مرات، فأمر به فرجم. قال ابن شهاب: فمن أجل ذلك يُؤخذ الرجل باعترافه على نفسه. {cite:muwatta-maruf-1997 p.382}"
  tr: "Malik, İbn Şihab'dan rivayet ettiğine göre, Peygamberimiz zamanında bir adamın zina suçunu itiraf ettiğini ve dört defa kendi aleyhine şahitlik ettiğini, bunun üzerine Peygamberimizin onu taşlayarak öldürmesini emrettiğini öğrenmiştir. İbn Şihab şöyle demiştir: Bu nedenle, insan kendi itirafından sorumlu tutulur. {cite:muwatta-maruf-1997 s.382}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia diberitahu bahwa seorang pria mengaku berzina pada zaman Nabi, bersaksi melawan dirinya sendiri empat kali, sehingga Nabi memerintahkan agar dia dirajam. Ibnu Shihab berkata: Karena alasan inilah, seseorang bertanggung jawab atas pengakuannya sendiri. {cite:muwatta-maruf-1997 p.382}"
