text: "وروي في بعض الأخبار أن اللّٰه تعالى خلق مائة ألف قنديل وعلقها بالعرش والسماوات والأرض وما فيهن حتى الجنة والنار في قنديل واحد ولا يعلم ما في باقي القناديل إلا اللّٰه تعالى."
summary:
  ar: "يذكر الألوسي خبراً مروياً بلا تحقيق في الصفحة بأن الله خلق مائة ألف قنديل علّقها بالعرش، وفي واحد منها السماوات والأرض وما فيهن حتى الجنة والنار، ولا يعلم ما في بقية القناديل إلا الله؛ ثم ينقل عن كعب الأحبار أن عدد العالمين لا يحصيه إلا الله."
  en: "Al-Alusi mentions a report, given on this page without a chain, that God made a hundred thousand lamps hung from the Throne, with the heavens, the earth and all in them, Paradise and Hell included, in a single lamp, and that only God knows what is in the others. He follows it with Ka'b al-Ahbar's saying that only God can count the worlds."
  es: "Al-Alusi menciona un relato, que aparece en esta página sin cadena de transmisión, según el cual Dios hizo cien mil lámparas colgadas del Trono, que contenían los cielos, la tierra y todo lo que contenían, incluyendo el Paraíso y el Infierno, en una sola lámpara, y que solo Dios sabe lo que hay en las demás. A continuación, cita la afirmación de Ka'b al-Ahbar de que solo Dios puede contar los mundos."
  fr: "Al-Alusi mentionne un hadith, rapporté sur cette page sans source, selon lequel Dieu aurait suspendu au Trône cent mille lampes, chacune contenant le ciel, la terre et tout ce qu'ils renferment, le Paradis et l'Enfer compris, et que seul Dieu connaît le contenu des autres. Il cite ensuite Ka'b al-Ahbar, qui affirme que seul Dieu peut dénombrer les mondes."
  ur: "العلوسی نے اس صفحہ پر بغیر کسی زنجیر کے دی گئی ایک رپورٹ کا ذکر کیا ہے کہ اللہ تعالیٰ نے عرش سے لٹکائے ہوئے ایک لاکھ چراغ بنائے، جن میں آسمان، زمین اور ان سب کے ساتھ جنت اور جہنم شامل ہیں، ایک ہی چراغ میں، اور یہ کہ باقیوں میں کیا ہے، صرف اللہ ہی جانتا ہے۔ وہ کعب الاحبار کے اس قول کی پیروی کرتا ہے کہ صرف خدا ہی تمام جہانوں کو گن سکتا ہے۔"
  tr: "Al-Alusi, aynı sayfada, doğruluğu teyit edilmemiş bir rivayete göre, Allah'ın yüz bin lamba yarattığını ve bunları Arş'a astığını, bunlardan birinde göklerin ve yerin ve içlerindekilerin, hatta Cennet ve Cehennem'in bulunduğunu, diğer lambaların içindekileri ise Allah'tan başka kimsenin bilmediğini aktarır; daha sonra Ka'b al-Ahbar'dan naklederek, âlemlerin sayısının yalnızca Allah tarafından hesaplandığını söyler."
  id: "Al-Alusi menyebutkan sebuah riwayat yang dinarasikan tanpa verifikasi di halaman tersebut bahwa Allah menciptakan seratus ribu lampu dan menggantungkannya di Arasy, dan di salah satu lampu tersebut terdapat langit dan bumi beserta isinya, bahkan Surga dan Neraka, dan tidak ada yang mengetahui isi lampu-lampu lainnya kecuali Allah; kemudian ia mengutip Ka’b al-Ahbar yang menyatakan bahwa jumlah alam semesta tidak dapat dihitung kecuali oleh Allah."
