label: { ar: "الموطأ 2430 — مالك: الصبي والأعجمي إذا سُرقا من حرزهما", en: "Muwatta 2430" }
summary:
  ar: "قال مالك في الصبي الصغير والأعجمي الذي لا يفصح: إنهما إذا سُرقا من حرزهما أو غلقهما فعلى من سرقهما القطع. فإن خرجا من حرزهما وغلقهما فليس على من سرقهما قطع، وإنما هما بمنزلة حريسة الجبل والثمر المعلق. {cite:muwatta-maruf-1997 p.402} {cite:muwatta-maruf-1997 p.403}"
