label: { ar: "الموطأ 2430 — مالك: الصبي والأعجمي إذا سُرقا من حرزهما", en: "Muwatta 2430", es: "Muwatta 2430", fr: "Muwatta 2430", ur: "موطا 2430", tr: "Al-Muwatta 2430 — Malik: Eğer bir erkek çocuğu veya Arap olmayan bir kişi koruma altındaki yerinden çalınırsa", id: "Al-Muwatta 2430 — Malik: Jika seorang anak laki-laki atau orang non-Arab diculik dari tempat perlindungannya" }
summary:
  ar: "قال مالك في الصبي الصغير والأعجمي الذي لا يفصح: إنهما إذا سُرقا من حرزهما أو غلقهما فعلى من سرقهما القطع. فإن خرجا من حرزهما وغلقهما فليس على من سرقهما قطع، وإنما هما بمنزلة حريسة الجبل والثمر المعلق. {cite:muwatta-maruf-1997 p.402} {cite:muwatta-maruf-1997 p.403}"
  tr: "Malik, genç bir erkek çocuğu ve açıkça konuşamayan Arap olmayan bir kişi hakkında şöyle demiştir: \"Eğer güvenli veya kilitli yerlerinden çalınırlarsa, hırsızın eli kesilir. Fakat güvenli veya kilitli yerlerinden alınırlarsa, hırsızın eli kesilmez; aksine, dağ bekçisi veya asılı meyve gibidirler.\" {cite:muwatta-maruf-1997 s.402} {cite:muwatta-maruf-1997 s.403}"
  id: "Malik berkata mengenai seorang anak laki-laki dan seorang non-Arab yang tidak dapat berbicara dengan jelas: Jika mereka dicuri dari tempat yang aman atau terkunci, pencuri tersebut dapat dihukum dengan dipotong tangannya. Tetapi jika mereka diambil dari tempat yang aman atau terkunci, maka pencuri tersebut tidak dapat dihukum dengan dipotong tangannya; melainkan, mereka seperti penjaga gunung atau buah yang tergantung. {cite:muwatta-maruf-1997 p.402} {cite:muwatta-maruf-1997 p.403}"
