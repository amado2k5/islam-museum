text: "… كان عند موته أمر أَهلَه أن يوجِّهوه قِبَل الكعبة. وروى أبْنُ شَاهِينَ بإسناد ليّن، من طريق عبد اللّٰه بن أبي قتادة، حدثتني أمي، عن أبي - أن البراء بن معرور مات قبل الهجرة، فوجّه قبره إلى الكعبة. وكان قد أوصى …"
