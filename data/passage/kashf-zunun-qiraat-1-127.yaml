text: "… مآخذَها من الكِتاب والسُّنّة بما تَلَقّوه من صاحبٍ الشَّرْع وأصحابه، والقومُ يومئذٍ عَرَبٌ لم يَعْرفوا أمر التَّعْليم والتَّدْوين، ولا دَعَتْهم إليه حاجةٌ إلى آخر عَصْر التَّابعين كما سبق. وكانوا يُسَمَّون المختصّينَ بحَمْل ذلك ونَقْله: القُرّاءَ. فهُم قُرّاءٌ لكتابِ اللّٰه والسُّنّة …"
