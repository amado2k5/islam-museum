text: |-
  MIE
  •⁦(فصل الفاء)⁩*
  عمرين الخطاب رضى اللّٰه عنه والمفرق والمفرق وسط الرأس وهو الذى يقرق فيه الشعر
  وكذلك مفرق الطريق ومف رقه للموضع الذى يتشعب منه طريق آخروة واهم للمفرق مفارق
  كأنهم جعلوا كل موضع منهمة رقافجمعوهء-لى ذلك وفرقه الطريق أى اتجه له طريقان
  وفرقت الناقة أيضاتفرق فروقا اذا أخذها الخاض فندت فى الارض وكذلك الاتان
  وأنشد الاصمعى" * ومنجنون كالاتان الفارق• والجمع فوارق وفرّق وربماشبهوا السحابة
  التى تنفرد من السحاببهذه الناقة فيقال قارق قال عبد بنى الحسحاس يصف محابا
  له فرق منه يتجن حوة • يفقئن بالميث الدماث السوابيا
  وقال ذوالرمة
  أومزنة فارق يجلوغواربها • تبوّج البرق والظلما علجوم
  فجعل له سوابى كسوابى الابل اتساعافى الكلام والفرق بالتحريك الخوف وقد فرق بالكسر
  تقول فرقت منك ولا تقل فرقتك وامر أة فروقة ورجل فروقة أيضا ولاجع له وفى المثل رب
  عجلة تهب رينا ورب فروقة يدعى ليثا والفرق أيضا قباعدما بين الننيتين ومابين المنسمين عن
  مقوب والفرق أيضا فى الخيل اشراف احدى الوركين على الاخرى وهو يكره والفرس أفرق
  ويقال ديك أفرق بين الفرق للذى عرفه مفروق ورجل أفرق للذى ناصيته كانهامة روقة
  بين الفرق وكذلك اللحية وجع الفرق أفراق قال الراجز
  ينقض عثنونا كثير الافراق • تفتح ذفراه بمثل الدرياق
  قال والفرق أيضامن قوله-م هذه أرض فرقة وفى نبتها فرق اذا كان متفرقا ولم يحكز
  متصلاويقال هو أبين من فرق الصبح لغة فى فلق الصبح والفرق بالمكسر القطيع من
  الغيم العظيم قال الراعى
  ولكنما أجدى وأستع جدّه • بفرق يخشيه بهجهج ناعقه
  هجوبم سذا البيت رجسلا من بنى غمير يلقب بالحلال وكان عيره بابله فهجاه الراعى وعيره بانه
  صاحب غنم ومدح ابله يقول أمتعه جدّه أى حظه بالغنم وليس له«واها ألا ترى الى
  قوله قبل هذا البيت
  وعبرنى الابل الحلال ولم يكن • ليجعل الابن الخبينة خالفه
  والفرق الفلق من الشى اذا اتفلق ومنه قوله تعالى فانفلق ذكان كل فرق كالطود العظيم
  وذات فرقين التى فى شعر عبيد بن الابرص هضبة بين البصرة والسكوفة والفرقة طائفة من
  إالناس والفريق أكثر منهم وفى الحديث أقاريق العرب وهوجع أفراق وآفراق جع
  فرقة قال الاصعىّ أفرق المربض من مرضه والمهوم من جاه أى أقبل قال أعرابى لآخر
  ما أمارافراق المورود فقال الرحضاء يقول ماءلامة برالمحرم فقال العرق وناقة مفرق أى
  فارقها ولدهابموت والذريقة تمر يطيخ بحلبة لانفساء قال أبوكبير
  ولقدوردت الماءلون جامه * لون الفريقة صفيت للمدنف
  إوالفريسة من الغنم أن تتفرق منها قطعة شاة أوشانان أوثلاث شياه فتذهب تحت الليل عن
  جماعة الغنم قال الشاعر
  ودفري
