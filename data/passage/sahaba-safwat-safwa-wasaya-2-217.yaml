text: "… انى اعو ذبك ممن جاء ليشغانى هما اتلذّ ذبه من مناجاتك ثم فتح الباب فدخلا فاذا رجل ترى به الآخرة واذا قبر محفور ووصيته قد كتبها فى الحائط وكساؤه قد أعدّه لكفنه فقلت اى موقف لهذا الحلق ؟ فقال بين …"
summary:
