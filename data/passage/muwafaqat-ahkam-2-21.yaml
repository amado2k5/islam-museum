text: "… وكونه صحيح إلى الثلاثة الأول. وأما كونه فرضاً، أو مندوباً، أو مباحاً، أو مكروهاً، أوغير صحيح راجعٌ بابٍ أو حراماً، فلا مدخل له في مسائل الأصول من حيث هي أصولٌ. فَمن أدخلها فيها فمِن خلط بعض العلوم ببعض. المقدمة الثالثة …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 2، ص 21، يرد فيه ذكر الفرض، والمندوب، والمكروه، والمباح، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 2, p. 21, whose wording mentions the obligatory (fard), the recommended (mandub), the disliked (makruh), the permitted (mubah), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
