text: "صَخْر بن حَرْب مُبَيْح، مولى أُم سَلَمة عمرة، وطفنا بالبيت وسعينا بين الصفا والمروة، وقد رواه السّدِّي، عن صبيح، عن زيد ابن أرقم. وأحللنا مما يحل منه الحَرَام، وأصبنا ما يصيب أخرجه أبو موسى. الحَلاَلُ من النساء والطيب، حتى إذا …"
