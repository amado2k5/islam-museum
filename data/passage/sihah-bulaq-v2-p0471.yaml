text: |-
  • أفصل الفاح ؟
  •⁦(فوق)⁩*
  لا تجرى يقال منه للرجل أعلقت وأفلت أى جئت بعلق فلق ومرّ يفتاق فى ء_دوه أى يأنى
  بالعجب من شدته والفليقة الداهية والعرب تقول باللفليقة والفليق فى جران البعير الموضع
  المطمتن عند مجرى الحلقوم وأنشد الاصمعى* فليقه أجرد كارمح الضلع* والفليق بالضم
  والتشديد ضرب من الخوخ يتفلق عن نواه والمفلق منه المجفف والفيلق الجيس والجمع
  الفيالق ⁦( نق)⁩ تفنق الرجل أى تنعم وفنقه غيره تفنيق ا وفانه بمعنى أى ذعمه يقال
  عيش مفائق قال الشاعر يصف الجوارى بالنعمة
  زانهنَّ الشفوف ينضذن بالمسك وعيس مفائق وحرير
  وناقة فنق أى فتية سعينة قال الراجزه تنشطته كل *رجاب فنق* وامر أة فنق أى منعمة
  والفنيق الفعل المكرم وقال أبو زيد هواسم من أسمائه والجهمع فنق ذكره فى كتاب الابل وقال
  ابن دريد والجمع أفساق ⁦(فهق)⁩ قال الفرّاءقلان يتفيهق فى كلامه وذلك اذا توسع فيه
  وتنطع قال وأصله الفهق وهو الامتلا كانه ملا به فه قال أبو عمروالمفهق الواسع وأنشد
  والعيس فوق لاحب معبد * غبر الخصى منفهق عمرّد
  وفهق الاناء بالكسريقهق فهقاوفهقااذا امتلاحتى يتصبب قال الاعشى
  تروح عنى آل المحلق جفنة * كجابية الشيخ العراقتفهق
  وأفهقت السقاءملاته والفاهقة الطعنة التى تفهق بالدم أى تتصبب والفهقة عظم عند
  مركب العفق وهو أول الفقار وفهقت الرجل اذا أصبت فهقته وق فوق نقيض
  تحت وقوله تعالى ان اللّٰه لا يستحي أن يضرب مثلامًا بعوضة فاذوقها قال أبو عبيدة فادونها
  كما تقول اذا قيل لك فلان صغير تقول وفوق ذلك أى أصغر من ذلك وقال الفرّاء فاذ وقها أى
  أعظم منها يعنى الذباب والعنكبوت وفاق الرجل أصحابه يفوقهم أى علاهم بالشرف وفاق
  الرجل فواقا اذاشخصت الريح من صدره وفلان يفوق بنفسه فووقا اذا كانت نفسه على
  الخروج مثل يريق بنفسه والفوق موضع الوزمن السهم والجمع أفواق وذوق تقول فقت
  السهم فانفاق أى كسرت فوقه فانكسروفوقته أى جعلت له فوقا والافوق السهم المكسور
  الفوق قال الاصمعى" يقال رجع فلان بأفوق ناصل أى بسهم منكسر لانصل فيه أى رجع
  بحظ ليس تمام وأفقت السهم أى وضعت فوقه فى الوتزلارمى به وأوفتته أيضا
  ولا يقال أفوقته وهومن النوادر والفواق الذى يأخذ الانسان عند النزع وكذلك الريح
  التى تشخص من صدره والفواق والفواق ما بين الحلبتين من الوقت لانها تحلب ثم تترل
  سويعة يرضعها الفصيل لتدرّ ثم تحلب يقال ما أقام عنده الافواقا وفى الحديث العيادة قدر
  فواقناقة وقوله تعالى مالها من فواق:قرأ بالفتح والضم أى مالها من نظرة وراحة وافاقة
  والفيقة بالكسراسم المين الذى يجتمع بين الحليتين صارت الواويا لكسرة ما قبلها
  قال الاعشى بصف بقرة
  حتى اذافيقة فى ضرعها اجتممت * جاءت لترضع شق النفس لورضعا
  والجمع فيق ثم أفواق مثل شبروأشبار ثم أفاويق قازابن همام السلولىّ
  وذموالذا الدنيا وهم يرضعونها * أفاويق حتى مايدرّ لها ثعل
  والافاريق
