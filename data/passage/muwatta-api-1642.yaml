label: { ar: "موطأ مالك 1642 — ما عُدّ من الإيمان", en: "Muwatta Malik 1642 — what is counted as part of faith", ur: "موطأ مالک 1642 — جو ایمان میں سے گنا گیا", es: "Muwatta Malik 1642 — lo que se considera parte de la fe", fr: "Muwatta Malik 1642 — ce qui est considéré comme faisant partie de la foi", tr: "Muwatta Malik 1642 — İnancın bir parçası olarak kabul edilenler nelerdir?", id: "Muwatta Malik 1642 — Apa yang dianggap sebagai bagian dari iman" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ مَرَّ عَلَى رَجُلٍ وَهُوَ يَعِظُ أَخَاهُ فِي الْحَيَاءِ فَقَالَ رَسُولُ اللَّهِ \" دَعْهُ فَإِنَّ الْحَيَاءَ مِنَ الإِيمَانِ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 1642، يذكر ما عُدّ من الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Muwatta Malik, no. 1642 (Good Character), that mentions what is counted as part of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "موطأ مالک کی حدیث نمبر 1642، جس میں جو ایمان میں سے گنا گیا کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1642 (Buen Carácter), menciona lo que se considera parte de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los informes de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un rapport du Muwatta Malik, n° 1642 (Bonnes qualités), mentionne ce qui est considéré comme faisant partie de la foi. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'islam, les branches de la foi et les qualités du croyant."
  tr: "Malik'in Muwatta'sında yer alan 1642 numaralı hadis, imanın ne anlama geldiğini açıklamaktadır. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 1642, menyebutkan apa yang membentuk iman. Hadits ini disusun oleh seorang peneliti yang mengkaji rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
