label: { ar: "الموطأ 2838 — القاسم بن محمد: أدركت الناس وما يعجبون بالقول، إنما يُنظر إلى العمل", en: "Muwatta 2838", es: "Muwatta 2838", fr: "Muwatta 2838", ur: "موطا 2838", tr: "El-Muvatta 2838 — El-Kâsım ibn Muhammed: Ben, sözlerden değil, amellerden etkilenen insanlar tanıdım.", id: "Al-Muwatta 2838 — Al-Qasim ibn Muhammad: Aku mengenal orang-orang yang tidak terkesan oleh kata-kata, melainkan oleh perbuatan." }
summary:
  ar: "بلغ مالكا أن القاسم بن محمد كان يقول: أدركت الناس وما يعجبون بالقول. قال مالك: يريد بذلك العمل، إنما ينظر إلى عمله ولا ينظر إلى قوله. {cite:muwatta-maruf-1997 p.591}"
  tr: "Malik'e, el-Kâsım ibn Muhammed'in şöyle dediği aktarıldı: \"Sözlerden etkilenmeyen insanlar tanıdım.\" Malik şöyle dedi: \"Bununla kastettiği şey, insanın sadece amellerine baktığı, sözlerine bakmadığıdır.\" {cite:muwatta-maruf-1997 s.591}"
  id: "Malik diberitahu bahwa al-Qasim ibn Muhammad biasa berkata: \"Aku mengenal orang-orang yang tidak terkesan oleh kata-kata.\" Malik berkata: \"Yang dimaksud dengan tindakan itu adalah; seseorang hanya melihat perbuatannya dan bukan kata-katanya.\" {cite:muwatta-maruf-1997 p.591}"
