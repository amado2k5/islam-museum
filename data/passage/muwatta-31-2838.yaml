summary:
  ar: "بلغ مالكا أن القاسم بن محمد كان يقول: أدركت الناس وما يعجبون بالقول. قال مالك: يريد بذلك العمل، إنما ينظر إلى عمله ولا ينظر إلى قوله. {cite:muwatta-maruf-1997 p.591}"
