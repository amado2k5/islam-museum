text: "… أسفاً على أيام الصبا من الما ا الب حوا فلم ماحدا، قال : أما الحقيق لم أكن في زان المعب أفضل مِمَّا أنا الآن! الآن صِرتُ طيراً تماماً صاد يوماً لقلقاً من البرية وأحضره إلى داره، فلما رأى رِجليه طويلتين …"
summary:
  ar: "يتحسر جحا على شبابه، والنص مشوه جزئياً في النص الممسوح ضوئياً، والواضح أنه يقول إنه لم يكن أفضل في شبابه مما هو الآن. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  en: "Juha laments his youth; the text is partly garbled in the scanned text, and what is clear is that he says he was not better in his youth than now. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  ur: "جحا اپنی جوانی پر افسوس کرتا ہے، اسکین شدہ متن کچھ حد تک بگڑا ہوا ہے، اور جو واضح ہے وہ یہ کہ وہ کہتا ہے کہ وہ جوانی میں آج سے بہتر نہ تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  fr: "Juha déplore sa jeunesse ; le texte numérisé est en partie altéré, et ce qui est clair est qu'il dit n'avoir pas été meilleur dans sa jeunesse qu'aujourd'hui. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  es: "Juha lamenta su juventud; el texto escaneado está en parte alterado, y lo que queda claro es que dice que en su juventud no era mejor que ahora. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
