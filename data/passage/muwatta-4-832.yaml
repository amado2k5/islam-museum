label: { ar: "الموطأ 832 — مالك: المريض إذا اشتد عليه الصيام فله أن يفطر، وكذلك المريض إذا اشتد عليه القيام في الصلاة يصلي جالساً؛ ودين الله يسر", en: "Muwatta 832", es: "Muwatta 832", fr: "Muwatta 832", ur: "موطا 832", tr: "El-Muvatta 832 — Malik: Eğer hasta bir kişi için oruç tutmak çok zorlaşırsa, orucunu bozabilir. Aynı şekilde, eğer hasta bir kişi için namazda ayakta durmak çok zorlaşırsa, oturarak namaz kılabilir. Ve Allah'ın dini kolaydır.", id: "Al-Muwatta 832 — Malik: Jika berpuasa menjadi terlalu sulit bagi orang sakit, ia boleh berbuka puasa. Demikian pula, jika berdiri saat shalat menjadi terlalu sulit bagi orang sakit, ia boleh shalat sambil duduk. Dan agama Allah itu mudah." }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول: الأمر الذي سمعت من أهل العلم أن المريض إذا أصابه المرض الذي يشق عليه الصيام معه ويُنصِبه ويبلغ ذلك منه، فإن له أن يفطر. وكذلك المريض إذا اشتد عليه القيام في الصلاة فيصلي جالساً، ودين الله يسر. ويستدل مالك بأن الله أرخص للمسافر في الفطر وهو أقوى على الصيام من المريض، بقوله تعالى: فمن كان منكم مريضاً أو على سفر فعدة من أيام أخر [[passage/quran-2-184|البقرة 184]]. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.406}"
  tr: "Yahya şöyle dedi: Malik'ten şöyle bir rivayet işittim: Alimlerden işittiğim şudur ki, eğer bir hasta oruç tutmayı zorlaştıran ve yorucu kılan bir hastalığa yakalanırsa ve bu ona büyük sıkıntı verirse, orucunu bozmasına izin verilir. Benzer şekilde, eğer bir hasta namazda ayakta durmakta zorlanıyorsa, oturarak namaz kılabilir, çünkü Allah'ın dini kolaydır. Malik, Allah'ın hasta kişiden daha güçlü olan yolcuya orucunu bozmasına izin verdiğine dair delil olarak şu ayeti gösterir: \"Sizden kim hasta veya yolculukta ise (Ramazan ayında) - o zaman aynı sayıda günü sonradan kaza etmelidir\" [Bakara 2:184]. Editör, Ebu Musab'ın bunu Malik'ten rivayet ettiğini belirtiyor."
  id: "Yahya berkata: Aku mendengar Malik berkata: Apa yang kudengar dari para ulama adalah jika orang sakit menderita penyakit yang membuat puasa menjadi sulit dan melelahkan, dan ini menyebabkannya kesulitan besar, maka ia diperbolehkan untuk berbuka puasa. Demikian pula, jika orang sakit merasa terlalu sulit untuk berdiri saat shalat, ia boleh shalat sambil duduk, karena agama Allah itu mudah. Malik mengutip sebagai bukti bahwa Allah telah memberikan izin kepada musafir, yang lebih kuat daripada orang sakit, untuk berbuka puasa, berdasarkan ayat: \"Maka barangsiapa di antara kamu sakit atau dalam perjalanan [pada bulan Ramadhan], maka harus mengganti puasa yang sama jumlahnya di kemudian hari\" [Al-Baqarah 2:184]. Editor menyebutkan bahwa Abu Mus'ab meriwayatkan ini dari Malik."
