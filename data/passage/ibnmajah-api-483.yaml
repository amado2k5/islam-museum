label: { ar: "سنن ابن ماجه 483 — الأب والأبوة", en: "Sunan Ibn Majah 483 — the father and fatherhood", ur: "سنن ابن ماجہ 483 — باپ اور والدیت" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا وَكِيعٌ، حَدَّثَنَا مُحَمَّدُ بْنُ جَابِرٍ، قَالَ سَمِعْتُ قَيْسَ بْنَ طَلْقٍ الْحَنَفِيَّ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ سُئِلَ عَنْ مَسِّ الذَّكَرِ فَقَالَ \" لَيْسَ فِيهِ وُضُوءٌ إِنَّمَا هُوَ مِنْكَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 483، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 483 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 483، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
