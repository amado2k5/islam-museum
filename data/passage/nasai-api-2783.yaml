text: "أَخْبَرَنَا أَحْمَدُ بْنُ حَرْبٍ، قَالَ حَدَّثَنَا قَاسِمٌ، - وَهُوَ ابْنُ يَزِيدَ - قَالَ حَدَّثَنَا أَفْلَحُ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ عَائِشَةَ، قَالَتْ فَتَلْتُ قَلاَئِدَ بُدْنِ رَسُولِ اللَّهِ بِيَدَىَّ ثُمَّ قَلَّدَهَا وَأَشْعَرَهَا وَوَجَّهَهَا إِلَى الْبَيْتِ وَبَعَثَ بِهَا وَأَقَامَ فَمَا حَرُمَ عَلَيْهِ شَىْءٌ كَانَ لَهُ حَلاَلاً."
summary:
  ar: "حديث في سنن النسائي، رقم 2783، يذكر الحلال، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2783 (The Book of Hajj), that mentions the lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2783، جس میں حلال، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
