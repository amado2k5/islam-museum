label: { ar: "صحيح مسلم 250 — الأب والأبوة", en: "Sahih Muslim 250 — the father and fatherhood", ur: "صحیح مسلم 250 — باپ اور والدیت", es: "Sahih Muslim 250 — El padre y la paternidad" }
text: "… ح وَحَدَّثَنَا خَلَفُ بْنُ هِشَامٍ، - وَاللَّفْظُ لَهُ - حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ أَبِي مُرَاوِحٍ اللَّيْثِيِّ، عَنْ أَبِي ذَرٍّ، قَالَ قُلْتُ يَا رَسُولَ اللَّهِ أَىُّ الأَعْمَالِ أَفْضَلُ قَالَ \" الإِيمَانُ بِاللَّهِ وَالْجِهَادُ فِي سَبِيلِهِ \". قَالَ قُلْتُ أَىُّ الرِّقَابِ أَفْضَلُ قَالَ \" أَنْفَسُهَا عِنْدَ أَهْلِهَا وَأَكْثَرُهَا ثَمَنًا \". …"
summary:
  ar: "حديث في صحيح مسلم، رقم 250، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 250 (The Book of Faith), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 250، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 250 (El Libro de la Fe), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
