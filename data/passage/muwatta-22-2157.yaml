label: { ar: "الموطأ 2157 — يحيى عن مالك عن ابن شهاب عن عروة عن عائشة: عهد عتبة بن أبي وقاص إلى أخيه سعد أن ابن وليدة زمعة مني فاقبضه، فلما كان عام الفتح أخذه سعد، وقال ابن أخي، فقام عبد بن زمعة فقال أخي، ولد على فراشه، فقضى النبي: هو لك يا عبد بن زمعة، الولد للفراش وللعاهر الحجر، واحتجبي منه يا سودة", en: "Muwatta 2157", es: "Muwatta 2157", fr: "Muwatta 2157", ur: "موطا 2157", tr: "El-Muvatta 2157 — Yahya, Malik'ten, İbn Şihab'dan, Urve'den, Aişe'den rivayetle: Utbe ibn Abi Vakkas, Zemâ'nın cariyesinin oğlunu kardeşi Saad'a emanet ederek, \"Zemâ'nın cariyesinin çocuğu benimdir, onu al\" dedi. Fetih yılı gelince Saad onu aldı ve \"O benim yeğenimdir\" dedi. Bunun üzerine Abd ibn Zemâ ayağa kalkıp, \"O benim kardeşimdir, yatağımda doğmuştur\" dedi. Bunun üzerine Peygamber şöyle hükmetti: \"Ey Abd ibn Zemâ, o senindir. Çocuk yatağa aittir, zina eden ise taşı hak eder. Ey Sawdah, ondan uzak dur.\"", id: "Al-Muwatta 2157 — Yahya, dari Malik, dari Ibn Shihab, dari Urwah, dari Aisyah: Utbah ibn Abi Waqqas mempercayakan anak budak perempuan Zam’ah kepada saudaranya, Saad, dengan berkata, “Anak budak perempuan Zam’ah adalah milikku, maka ambillah dia.” Ketika tahun penaklukan tiba, Saad mengambilnya dan berkata, “Dia adalah keponakanku.” Kemudian Abd ibn Zam’ah berdiri dan berkata, “Dia adalah saudaraku, lahir di tempat tidurku.” Maka Nabi memutuskan: “Dia adalah milikmu, wahai Abd ibn Zam’ah. Anak itu milik tempat tidur, dan pezina mendapat batu. Dan tutuplah dirimu darinya, wahai Saad.”" }
summary:
  ar: "قال يحيى: قال مالك عن ابن شهاب عن عروة بن الزبير عن عائشة زوج النبي أنها قالت: كان عتبة بن أبي وقاص عهد إلى أخيه سعد بن أبي وقاص أن ابن وليدة زمعة مني، فاقبضه إليك. قالت: فلما كان عام الفتح أخذه سعد، وقال: ابن أخي، قد كان عهد إلي فيه. فقام إليه عبد بن زمعة فقال: أخي، وابن وليدة أبي، ولد على فراشه. فتساوقا إلى رسول الله، فقال سعد: يا رسول الله، ابن أخي، قد كان عهد إلي فيه. وقال عبد بن زمعة: أخي، وابن وليدة أبي، ولد على فراشه. فقال رسول الله: هو لك يا عبد بن زمعة. ثم قال رسول الله: الولد للفراش، وللعاهر الحجر. ثم قال لسودة بنت زمعة: احتجبي منه، لما رأى من شبهه بعتبة بن أبي وقاص. قالت: فما رآها حتى لقي الله عز وجل. {cite:muwatta-maruf-1997 p.283}"
  tr: "Yahya şöyle dedi: Malik, İbn Şihab'dan, Urve ibn el-Zübeyr'den, Peygamberimizin eşi Aişe'den rivayet etti ki, Aişe şöyle buyurdu: Utbe ibn Ebi Vakkas, kardeşi Saad ibn Ebi Vakkas'a Zemâ'nın cariyesinin oğlunu emanet ederek, \"Onu himayene al\" dedi. Aişe şöyle dedi: Fetih yılı gelince, Saad onu aldı ve \"O benim yeğenimdir; babam onu bana emanet etmişti\" dedi. Bunun üzerine Abd ibn Zemâ ayağa kalktı ve \"O benim kardeşimdir ve babamın cariyesinin oğludur, babamın yatağında doğmuştur\" dedi. Böylece ikisi de Allah'ın Resulü'ne gittiler ve Saad, \"Ey Allah'ın Resulü, o benim yeğenimdir; babam onu bana emanet etmişti\" dedi. Abd ibn Zemâ da, \"O benim kardeşimdir ve babamın cariyesinin oğludur, babamın yatağında doğmuştur\" dedi. Allah'ın Resulü, \"O senindir, ey Abd ibn Zemâ.\" dedi. Sonra Allah'ın Resulü şöyle buyurdu: \"Çocuk yatağa aittir, zina eden ise taşa.\" Sonra Sawdah bint Zam'ah'a, \"Ondan yüzümü ört,\" dedi, çünkü Utbah ibn Abi Waqqas'a benziyordu. Sawdah bint Zam'ah şöyle dedi: Yüce ve şanlı Allah'la karşılaşıncaya kadar onu bir daha hiç görmedi."
  id: "Yahya berkata: Malik meriwayatkan dari Ibn Shihab, dari Urwah ibn al-Zubayr, dari Aisyah, istri Nabi, bahwa dia berkata: Utbah ibn Abi Waqqas mempercayakan kepada saudaranya Saad ibn Abi Waqqas putra budak perempuan Zam'ah, seraya berkata, \"Jagalah dia.\" Dia berkata: Ketika tahun penaklukan tiba, Saad mengambilnya dan berkata, \"Dia adalah keponakanku; dia telah mempercayakannya kepadaku.\" Kemudian Abd ibn Zam'ah berdiri dan berkata, \"Dia adalah saudaraku, dan putra budak perempuan ayahku, yang lahir di tempat tidurnya.\" Maka mereka berdua pergi kepada Rasulullah, dan Saad berkata, \"Wahai Rasulullah, dia adalah keponakanku; dia telah mempercayakannya kepadaku.\" Dan Abd ibn Zam'ah berkata, \"Dia adalah saudaraku, dan putra budak perempuan ayahku, yang lahir di tempat tidurnya.\" Rasulullah bersabda, \"Dia milikmu, wahai Abd ibn Zam'ah.\" Kemudian Rasulullah SAW bersabda, \"Anak itu milik ranjang, dan pezina mendapat batu.\" Kemudian beliau bersabda kepada Sawdah binti Zam'ah, \"Tutupi dirimu darinya,\" karena kemiripannya dengan Utbah binti Abi Waqqas. Sawdah berkata: Beliau tidak pernah melihatnya lagi sampai beliau bertemu dengan Allah Yang Maha Tinggi dan Maha Mulia."
