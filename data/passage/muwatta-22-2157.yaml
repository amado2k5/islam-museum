label: { ar: "الموطأ 2157 — يحيى عن مالك عن ابن شهاب عن عروة عن عائشة: عهد عتبة بن أبي وقاص إلى أخيه سعد أن ابن وليدة زمعة مني فاقبضه، فلما كان عام الفتح أخذه سعد، وقال ابن أخي، فقام عبد بن زمعة فقال أخي، ولد على فراشه، فقضى النبي: هو لك يا عبد بن زمعة، الولد للفراش وللعاهر الحجر، واحتجبي منه يا سودة", en: "Muwatta 2157" }
summary:
  ar: "قال يحيى: قال مالك عن ابن شهاب عن عروة بن الزبير عن عائشة زوج النبي أنها قالت: كان عتبة بن أبي وقاص عهد إلى أخيه سعد بن أبي وقاص أن ابن وليدة زمعة مني، فاقبضه إليك. قالت: فلما كان عام الفتح أخذه سعد، وقال: ابن أخي، قد كان عهد إلي فيه. فقام إليه عبد بن زمعة فقال: أخي، وابن وليدة أبي، ولد على فراشه. فتساوقا إلى رسول الله، فقال سعد: يا رسول الله، ابن أخي، قد كان عهد إلي فيه. وقال عبد بن زمعة: أخي، وابن وليدة أبي، ولد على فراشه. فقال رسول الله: هو لك يا عبد بن زمعة. ثم قال رسول الله: الولد للفراش، وللعاهر الحجر. ثم قال لسودة بنت زمعة: احتجبي منه، لما رأى من شبهه بعتبة بن أبي وقاص. قالت: فما رآها حتى لقي الله عز وجل. {cite:muwatta-maruf-1997 p.283}"
