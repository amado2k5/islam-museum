text: "… لا يعذر الجاهل على الجهل ولا يحل للجاهل أن يسكت على جهله ولا للعالم أن إسكت على علمه ويقرب من تقرب اللاطين ببناء المساجد والمدارس بالمال الحرام تقرب العلماء السوء بتعليم العلم للسفراء والأشرار المشغولين بالفسق والفجور القاصرين هممهم على …"
summary:
