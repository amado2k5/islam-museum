text: "… ومحمود بن ربيعة، وجُلْهُمة بن ربيعة، وهم لغير أمه فاطمة، فيمن تبعهم من قُضَاعة في حاج العرب، وهم مُجْمِعُون لِنُصْرَةِ قُصَيّ. قصي يلي أمر مكة : وخُزَاعةُ تزعم أن حُلَيْل بن حَبَشِيَّة أوصى بذلِك قُصَيّاً، وأمرَه بهِ حين انتشر له …"
