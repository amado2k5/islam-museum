label: { ar: "دلائل النبوة للبيهيقي — رؤيا الأنبياء في الإسراء", en: "Bayhaqi's Dala'il — the prophets seen in the Night Journey", ur: "بیہقی کی دلائل — معراج میں انبیاء کی زیارت" }
text: "رأيت ليلة أُسري بي موسى بن عمران رجلاً طوالاً جعداً كأنه من رجال شنوءة، ورأيت عيسى بن مريم مربوع الخلق إلى الحمرة والبياض سبط الرأس، ورأيت مالكاً خازن جهنم والدجال"
summary:
  ar: "في أبواب الإسراء يروي البيهيقي عن ابن عباس أن النبي أخبر أنه رأى ليلة أُسري به موسى بن عمران رجلاً طوالاً جعداً كأنه من رجال شنوءة، ورأى عيسى بن مريم مربوع الخلق إلى الحمرة والبياض سبط الرأس، ورأى مالكاً خازن جهنم، والدجال في آيات أراه الله إياها، وقال: فلا تكن في مرية من لقائه. ويعقب أن مسلماً أخرجه في كتاب الإيمان عن عبد بن حميد عن يونس بن محمد عن شعيبان، وأن البخاري ومسلماً أخرجاه من حديث شعبة عن قتادة مختصراً. ويقدمه المؤلف ضمن معجزات الإسراء والمعراج التي شاهدها رسول الله."
  en: "In his chapters on the Night Journey al-Bayhaqi reports from Ibn Abbas that the Prophet said he saw, on the night he was taken, Moses as a tall dark man as though of the people of Shanua, Jesus of medium build ruddy-white with lank hair, Malik the keeper of Hellfire, and the Dajjal in signs God showed him — 'do not doubt that you will meet him'. Muslim transmits it in Kitab al-Iman through Abd ibn Humayd and Yunus ibn Muhammad; al-Bukhari and Muslim also carry the shorter Shubah-Qatadah version. The author presents it among the marvels witnessed on the Isra and Mi'raj."
  ur: "بیہقی معراج کے ابواب میں ابن عباس سے روایت کرتا ہے کہ نبی نے بتایا کہ اس رات جب انہیں لے جایا گیا تو اس نے موسیٰ بن عمران کو لمبا سیاہ آدمی دیکھا جو شنوءہ کے لوگوں جیسا تھا، عیسیٰ بن مریم کو گندمی رنگ کا، سیدھے بالوں والا دیکھا، جہنم کا خازن مالک دیکھا، اور دجال کو بھی ان نشانیوں میں دیکھا جو اللہ نے دکھائیں، اور اس نے کہا: اس کی ملاقات میں شک نہ کرنا۔ مسلم نے اسے کتاب ایمان میں روایت کیا ہے، اور بیہقی اسے معراج کی معجزات میں شمار کرتا ہے۔"
