  fr: "Extrait du livre d'Ibn al-Athir, al-Kamil fi al-Tarikh (tome 1, p. 103), mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le répertoire des Testaments Browser."
  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 1. cildinin 103. sayfasından, bir vasiyetname veya son miras belgesi ile geride bıraktığı mal varlığı ve mirası anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Kamil fi al-Tarikh* karya Ibn al-Athir, Jilid 1, halaman 103, yang menyebutkan wasiat atau surat wasiat terakhir, serta harta dan warisan yang ditinggalkannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
