text: "… ه على نصف الأرض، فقبل منهم ذلك، وكان نصف فدك خالصاً لرسول اللّه، وَل يفيهِ لأنه لم يوجف المسلمون عليه بخيل ولا ركاب، يصرف ما يأتيه منها على أبناء السبيل، ولم يزل أهلها بها حتى استخلف عمر بن الخطّاب، وأجلى …"
summary:
