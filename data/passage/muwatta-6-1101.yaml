label: { ar: "الموطأ 1101 — سليمان بن يسار: أن رسول الله نهى عن صيام أيام منى", en: "Muwatta 1101" }
text: "نهى عن صيام أيام منى"
summary:
  ar: "أول حديث في باب صيام أيام منى. يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن سليمان بن يسار، أن رسول الله نهى عن صيام أيام منى. ويذكر المحقق أن المرسل في الموطأ هو المحفوظ عن مالك، وأن سفيان الثوري وصله عن سالم أبي النضر وعبد الله بن أبي بكر عن سليمان بن يسار عن عبد الله بن حذافة السهمي، وأن ابن معين قال إنه مرسل، وأن ابن عبد البر رأى أن الحديث يتصل من وجوه أخرى. {cite:muwatta-maruf-1997 p.504}"
