label: { ar: "الموطأ 2454 — زيد بن أسلم عن عبد الرحمن بن وعلة: راوية الخمر التي أهديت للنبي", en: "Muwatta 2454" }
summary:
  ar: "حدث يحيى عن مالك عن زيد بن أسلم عن عبد الرحمن بن وعلة المصري أنه سأل عبد الله بن عباس عما يُعصر من العنب؟ فقال ابن عباس: أهدى رجل للنبي راوية خمر، فقال له النبي: أما علمت أن الله حرمها؟ قال: لا، فسار رجل إلى جنبه، فقال النبي: بم سارَرْتَه؟ قال: أمرته أن يبيعها. فقال النبي: إن الذي حرم شربها حرم بيعها. ففتح الرجل المزادتين حتى ذهب ما فيهما. {cite:muwatta-maruf-1997 p.414}"
