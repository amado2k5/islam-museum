label: { ar: "الموطأ 2454 — زيد بن أسلم عن عبد الرحمن بن وعلة: راوية الخمر التي أهديت للنبي", en: "Muwatta 2454", es: "Muwatta 2454", fr: "Muwatta 2454", ur: "موطا 2454", tr: "El-Muvatta 2454 — Zayd ibn Aslam, Abd al-Rahman ibn Wa’la’dan rivayetle: Peygambere hediye edilen şarabın rivayetçisi", id: "Al-Muwatta 2454 — Zayd ibn Aslam berdasarkan riwayat Abd al-Rahman ibn Wa’la: Perawi anggur yang dihadiahkan kepada Nabi." }
summary:
  ar: "حدث يحيى عن مالك عن زيد بن أسلم عن عبد الرحمن بن وعلة المصري أنه سأل عبد الله بن عباس عما يُعصر من العنب؟ فقال ابن عباس: أهدى رجل للنبي راوية خمر، فقال له النبي: أما علمت أن الله حرمها؟ قال: لا، فسار رجل إلى جنبه، فقال النبي: بم سارَرْتَه؟ قال: أمرته أن يبيعها. فقال النبي: إن الذي حرم شربها حرم بيعها. ففتح الرجل المزادتين حتى ذهب ما فيهما. {cite:muwatta-maruf-1997 p.414}"
  tr: "Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Abdülrahman ibn Ve'la el-Miser'den rivayet ettiğine göre, Abdullah ibn Abbas'a üzümden ne elde edildiğini sordu. İbn Abbas şöyle dedi: Bir adam Peygamberimize bir tulum şarap getirdi. Peygamberimiz ona, \"Bunu Allah'ın haram kıldığını bilmiyor muydun?\" dedi. Adam, \"Hayır\" dedi. Sonra yanına bir adam daha geldi. Peygamberimiz, \"Ona ne fısıldadın?\" diye sordu. Adam, \"Satmasını söyledim\" dedi. Peygamberimiz, \"İçmeyi haram kılan, satmayı da haram kılmıştır\" dedi. Bunun üzerine adam, tulumların içindekiler bitene kadar iki tulumu da açtı. {cite:muwatta-maruf-1997 s.414}"
  id: "Yahya meriwayatkan dari Malik, dari Zayd ibn Aslam, dari Abd al-Rahman ibn Wa'la al-Misri, bahwa ia bertanya kepada Abdullah ibn Abbas tentang apa yang diekstrak dari anggur. Ibnu Abbas berkata: Seorang pria memberikan sekantong anggur kepada Nabi, dan Nabi berkata kepadanya: Tidakkah kamu tahu bahwa Allah telah melarangnya? Dia berkata: Tidak. Kemudian seorang pria berjalan di sampingnya, dan Nabi berkata: Apa yang kamu bisikkan kepadanya? Dia berkata: Aku menyuruhnya untuk menjualnya. Nabi berkata: Barangsiapa yang melarang meminumnya, maka ia juga melarang menjualnya. Maka pria itu membuka kedua kantong anggur itu hingga isinya habis. {cite:muwatta-maruf-1997 p.414}"
