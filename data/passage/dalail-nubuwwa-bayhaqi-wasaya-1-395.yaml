text: "… داسة قال : حدثنا أبو داود، قال : حدثنا ابن نفيل، قال حدثنا عبد الرحمن بن أبي الزِّناد، عن هشام بن عُرْوة، عن أبيه، عن عائشة قالت : كان شعرُ النبي، وَغ، فَوْقَ الوفْرة ودُون الجمَّة وأخبرنا أبو الحسين القطان، …"
