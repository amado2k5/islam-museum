text: "… ويقال في يوم آخر من أيامهم ومما يذكر عن قيس أنه قال لولده حين حضرته الوفاة : يابني إذا مت فسودوا كباركم، ولا تسودوا صغاركم فيستسفه الناس كباركم، وعليكم باصلاح المال فإنه مَنْبَهَةٌ للكريم وغنىَّ عن الليئم، وإذا متُّ فادفنوني …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 4، ص 269، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
