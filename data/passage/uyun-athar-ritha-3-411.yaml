text: "… : وكان الأسودُ بن المطلب قد أصيب له ثلاثةٌ من ولده : زمعة بن الأسود، وعقيل بن الأسود، والحارث بن زمعة، وكان يُحِبُّ أن يبكي على بنيه، قال : فبينما هو كذلك، إذ سمعَ صوت نائحةٍ من الليل، فقال لغلام …"
summary:
  ar: "مقطع من عيون الأثر في فنون المغازي والشمائل والسير، المجلد المصوَّر 3، ص 411، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
