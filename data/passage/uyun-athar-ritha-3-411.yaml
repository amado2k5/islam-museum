  tr: "\"Askeri Seferlerin Sanatlarında, Özelliklerinde ve Biyografilerinde Geleneğin Özü\" adlı eserin 3. resimli cildinin 411. sayfasından, ölen kişi için ağıt yakma veya yas tutma ve bunun sınırlamaları hakkındaki bir bölümden alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve yas tutma eserlerini araştıran bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari \"Inti Tradisi dalam Seni Ekspedisi Militer, Karakteristik, dan Biografi,\" Volume Bergambar 3, hlm. 411, berisi bagian tentang ratapan atau duka cita atas orang yang meninggal dan keterbatasannya; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang peneliti elegi dan ratapan paling terkenal."
