text: "… لأبي بكر : لَقَدْ سَيَعَ اللَّهُ قَوْلَ ٱلَّذِينَ قَالُوًا إِنَّ اللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَآءُ سَنَّكْتُبُ مَا قَالُواْ وَقَتْلَهُمُ الْأَنْبِيَآءَ بِغَيْرِ حَقِّ وَنَقُولُ ذُوقُوا عَذَابَ الْحَرِيقِ ١ [آل عمران: ١٨١]؛ ونزل في أبي بكر الصديق ه وما بلغه في ذلك من …"
