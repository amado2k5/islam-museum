text: "… قرأ مجاهد وغيره من قُرَّاء أهل مكة. سَكَنَ مكة، وتوفي بها قبل أن يقتل عبدالله بن الزبير بيسير، وقيل: إنه مولى مجاهد. وقيل: إن مولى مجاهد قيس بن السائب. قرأ ابن كثير القرآن على مجاهد، وقرأ مجاهد على عبداللّه بن …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 675، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 675, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 675 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 675, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
