  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation du volume 4, p. 169) mentionnant le licite, ce qui a été rendu licite, l'illicite, ce qui a été rendu illicite et l'interdiction. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Halal and Haram Browser."
