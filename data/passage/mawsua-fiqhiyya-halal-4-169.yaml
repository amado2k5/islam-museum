text: "… ليس بعقد تحليلا وتحريما فيصير حلالا تارة وحراما تارة أخرى باختلاف النية، والقصد، كما يصير صحيحا تارة، وفاسدا تارة باختلافها، وهذا كالرجل يشترى الجارية ينوى أن تكون لموكله فتحرم على المشترى، وينوى أنها له فتحل له. ثم بعد أن يوضح …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 4، ص 169، يذكر الحلال، وما أُحل، والحرام، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 4, p. 169, that mentions the lawful, what was made lawful, the unlawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 4، ص 169 کا اقتباس جس میں حلال، جو حلال کیا گیا، حرام، جو حرام کیا گیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
