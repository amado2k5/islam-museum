label: { ar: "صحيح البخاري 3810 — جمع القرآن والمصاحف", en: "Sahih al-Bukhari 3810 — the collection of the Qur'an and the codices", ur: "صحیح بخاری 3810 — جمعِ قرآن اور مصاحف", es: "Sahih al-Bukhari 3810 — la colección del Corán y los códices", fr: "Sahih al-Bukhari 3810 — le recueil du Coran et des codex" }
text: "حَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا يَحْيَى، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ ـ قَالَ جَمَعَ الْقُرْآنَ عَلَى عَهْدِ النَّبِيِّ أَرْبَعَةٌ، كُلُّهُمْ مِنَ الأَنْصَارِ أُبَىٌّ، وَمُعَاذُ بْنُ جَبَلٍ، وَأَبُو زَيْدٍ، وَزَيْدُ بْنُ ثَابِتٍ. قُلْتُ لأَنَسِ مَنْ أَبُو زَيْدٍ قَالَ أَحَدُ عُمُومَتِي."
summary:
  ar: "حديث في صحيح البخاري، رقم 3810، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 3810 (Merits of the Helpers in Madinah (Ansaar)), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 3810، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 3810 (Méritos de los Ayudantes en Medina (Ansar)), menciona la colección del Corán y los códices. El catálogo del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
  fr: "Un récit du Sahih al-Bukhari, n° 3810 (Mérites des Compagnons de Médine (Ansar)), mentionne la collection du Coran et des codex. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ces documents avec les textes coraniques, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
