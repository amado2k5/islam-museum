text: |-
  *⁦(باب النون)⁩*
  ٢٦٣
  قال وكان ابن الكاي بهذا النوع من العلم أكبر من الاصمعى ن الهانة حية
  تعمل من الفضة كالدرة وجمهاجان قال إسيد يصف بقرة
  وتضى"فى وجه الفظلام منيرة • كمانة البحرى سل تقظامها
  نن جنّ عليه الليل يجن بالضم جنونا ويقال أيضاجنه الليل وأجنه الليل بهى والجنّ
  خلاق الانس والواحد جف يقال -عيت بذلك لانهاتقى ولاترى وجسن الرجل جنونا
  وأجنه اللّٰه فهو مجنون ولا تقل مجن وقولهم فى الجنون م أجته شاذلا يقاس عليه لانه
  لا يقال فى المضروب ما أضريه ولا فى المسلول ما أسله وأماقول موى بن جابر الحنقى
  فانفرت جنف ولافل مبردى • ولا أصبحت طسيرى من الخوف وقها
  فانه آراد بالجن القلب وبالمبرد اللسان وغخلة مجذونة أى طويلة وقال
  بارب أرسل خارف المساكين • مجاجة مسبلة العثانين * تحدرما فى العصق الجانين
  وجنّ النيت جنونا أى طال والنف وخرج زهره وجنّ الذباب أى كثرصوته وقول الشاعر
  ابن أحر
  تفقأفوقه القلع السوارى * وجسن اللخازبازيه جنونا
  يحتمل هذين الوجهسين ويقال كان ذلك فى جن شبابه أى فى أقل شبابه وتقول افعل ذلكْ
  الامى يين ذلك وبحعد ثانه قال المتخفل
  أردى بجن العهد سلى ولا • ينصبك عهد الملق الحوّل
  يريد الغيت الذى ذكره قبل هذا البيت يقول-ق هذا الفيث سلمى بحد ثان نزوله من السحاب
  قبل تغيره ثم تهسى نفسه أن ينصبه حب من هو ملق وجنذت الميت وأجننته أى واريته
  وأجننت الشى فى صدرى أكنفته وأجنت المرأة ولدا والجنين الولد مادام فى البعان
  والمع الأجنة والجنين المقبور والجنسة بالضم ما استترت به من سلاح والجنة السترة والهع
  الجنن يقال استبن بجنة اى استتربسترة والجنّ النرص وانجمع الجمان بالمفتح والهنة البستان
  ومنه الجنات والعرب تسمى النخيل جنة وقال زهير
  كأن عينى فى غربى مقتلة • من النواضع تسقى جنة محقا
  والجنان بالفتح القلب ويقال أيضاما على جثان الامازى أى توب يوارين وجنان الليل
  أيضا ادلهمامه قال الشاعر خفاف بن ندية
  ولولاجنان الليل أدرك ركبنا • بذى الرمت والارطى عياض بن نائب
  قال ابن السكيت وبروى جنون الليل أى ماستر من ظلمته وجنان النساس دهما ؤهم والجنة
  الجن ومنه قولمتعالى من الجنة والناس أجعين والجنة الجنون ومنه قوله تعالى أم به جنة
  والاسم والمصدر على صورة واحدة والحنى بالفتح القبر والجستى بالضم الجنون محذوف منه
  الواو قال يصف الناقة
  مثل النعامة كانت وهى سائمة • أدناه -تى زهاها المين واجغنن
  والجات أبو الجن والجمع جنان مثل حائط وحيطان والجات أبضاحبة يضاء وتجنى عل،
  وتجانن وتجان أركه من نفسه أنه مجنون وأرض مجنة ذات جنْ والجنة أيضا الجنون والمجنة
  أيضا اسم موضع على أميال من مكة وكان بلال وضى اللّٰه عنه تمنل بقول الشاعر
