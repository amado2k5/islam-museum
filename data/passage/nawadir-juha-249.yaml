text: "… أعطني إياها لآكلها كان يأكل دجاجةً محمَّرةً فجاء رجلٌ، وقال له: أنا جائعٌ أَعطني قطعةً أُسكِّن بها جوعي. هرج ومرج: كناية عن الفوضى وفقدان النظام في أمور الدولة. ماء نمير : عذب."
summary:
  ar: "أثناء أكل جحا دجاجة مشوية رفض أن يعطي قطعة لرجل جائع لأن الدجاجة لزوجته وهي التي أمرته بأكلها. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  en: "While eating a roast hen, Juha refuses to give a piece to a hungry man, because the hen belongs to his wife, who told him to eat it. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  ur: "بھنی ہوئی مرغی کھاتے ہوئے جحا ایک بھوکے آدمی کو ایک ٹکڑا دینے سے انکار کر دیتا ہے، کیونکہ مرغی اس کی بیوی کی ہے اور اسی نے اسے کھانے کو کہا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  fr: "Alors qu'il mange une poule rôtie, Juha refuse d'en donner un morceau à un homme affamé, parce que la poule appartient à sa femme, qui lui a dit de la manger. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  es: "Mientras come una gallina asada, Juha se niega a dar un trozo a un hombre hambriento, porque la gallina es de su esposa, que le dijo que se la comiera. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
