text: "… كراهة تنزيه وفيه استحباب التحية فى أى وقت دخل وهو مذهبنا وبه قال جماعة وكرهها أبو حنيفة والأوزاعى والليث فى وقت النهى، وأجاب أصحابنا أن النهى إنما هو عما لا سبب له، لأن النبى صلى بعد العصر ركعتين قضاء سنة …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 781، يرد فيه ذكر المستحب، والكراهة، وما كرهه الفقهاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 781, whose wording mentions the recommended (mustahabb), dislike (karaha), what the jurists disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 781 کا اقتباس جس میں مستحب، کراہت، جسے فقہاء نے مکروہ کہا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ibn al-Mubarak, volume numérisé 3, p. 781, dont le texte mentionne le recommandé (mustahabb), la réprobation (karaha), ce que les juristes ont réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Zuhd de Ibn al-Mubarak, volumen digitalizado 3, p. 781, cuyo texto menciona lo recomendado (mustahabb), la reprobación (karaha), lo que los juristas reprobaron; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zühd) adlı eserinin 3. cildinin 781. sayfasından bir alıntı, tavsiye edilen amelleri, mekruh edilen amelleri ve fıkıhçıların sakıncalı bulduğu amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu alıntı, farz ameller, görevler, itaat amelleri, tavsiye edilen amelleri, mekruh edilen amelleri, haram amelleri ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Mubarak, \"Al-Zuhd\" (Asketisme), Jilid 3, halaman 781, menyebutkan amalan yang dianjurkan, amalan yang tidak disukai, dan apa yang dianggap tidak baik oleh para ahli hukum. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
