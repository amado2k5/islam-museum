text: "… في القرآن. فهو مما عفا اللّٰه فيقول عفوٌ. وقيل له ما تقول في أموال أهل الذمة؟ عنه. وكان يُسأل عن الشيء لم يحرم فقال: العفو؛ يعني لا تؤخذ منهم زكاة. وقال عبيد بن عمير: أحلّ اللّٰه حلالاً وحرّم حراماً، فما …"
