label: { ar: "سنن أبي داود 2959 — الأب والأبوة", en: "Sunan Abi Dawud 2959 — the father and fatherhood", ur: "سنن ابی داؤد 2959 — باپ اور والدیت", es: "Sunan Abi Dawud 2959 — El padre y la paternidad" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا سُلَيْمُ بْنُ مُطَيْرٍ، - مِنْ أَهْلِ وَادِي الْقُرَى - عَنْ أَبِيهِ، أَنَّهُ حَدَّثَهُ قَالَ سَمِعْتُ رَجُلاً، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ فِي حَجَّةِ الْوَدَاعِ فَأَمَرَ النَّاسَ وَنَهَاهُمْ ثُمَّ قَالَ \" اللَّهُمَّ هَلْ بَلَّغْتُ \". قَالُوا اللَّهُمَّ نَعَمْ. ثُمَّ قَالَ \" إِذَا تَجَاحَفَتْ قُرَيْشٌ عَلَى الْمُلْكِ فِيمَا بَيْنَهَا وَعَادَ الْعَطَاءُ أَوْ كَانَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2959، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2959 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2959، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2959 (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
