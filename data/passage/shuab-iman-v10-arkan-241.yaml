text: "… بعده أي حديث أبي أسيد الساعدي المتقدم. ما بين الحاصرتين سقط من الأصل. هاهنا ينتهي الجزء الرابع والأربعون من نسخة ل وجاء في آخره ما يلي: تم الجزء الرابع والأربعون يتلوه في الذي يليه الخامس والخمسون من شعب الإيمان وهو …"
