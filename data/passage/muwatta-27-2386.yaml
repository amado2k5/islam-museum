summary:
  ar: "يروي مالك عن زيد بن أسلم أن رجلا اعترف على نفسه بالزنا على عهد النبي، فدعا له بسوط؛ فأُتي بسوط مكسور، فقال: فوق هذا، فأُتي بسوط جديد لم تُقطع ثمرته، فقال: دون هذا، فأُتي بسوط قد رُكب به ولان، فأمر به فجُلد. ثم قال: قد آن لكم أن تنتهوا عن حدود الله، فمن أصاب من هذه القاذورات شيئا فليستتر بستر الله، فإنه من يبد لنا صفحته نُقم عليه الحد. ويذكر المحقق قول ابن عبد البر أن جماعة الرواة للموطأ رووه مرسلا. {cite:muwatta-maruf-1997 p.387} {cite:muwatta-maruf-1997 p.388}"
