label: { ar: "الموطأ 2386 — زيد بن أسلم: الرجل المعترف بالزنا يجلد بسوط جديد لان", en: "Muwatta 2386", es: "Muwatta 2386", fr: "Muwatta 2386", ur: "موطا 2386", tr: "El-Muvatta 2386 — Zeyd ibn Aslam: Zina suçunu itiraf eden adam yeni bir kırbaçla dövülür çünkü", id: "Al-Muwatta 2386 — Zayd ibn Aslam: Orang yang mengaku berzina dicambuk dengan cambuk baru karena" }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رجلا اعترف على نفسه بالزنا على عهد النبي، فدعا له بسوط؛ فأُتي بسوط مكسور، فقال: فوق هذا، فأُتي بسوط جديد لم تُقطع ثمرته، فقال: دون هذا، فأُتي بسوط قد رُكب به ولان، فأمر به فجُلد. ثم قال: قد آن لكم أن تنتهوا عن حدود الله، فمن أصاب من هذه القاذورات شيئا فليستتر بستر الله، فإنه من يبد لنا صفحته نُقم عليه الحد. ويذكر المحقق قول ابن عبد البر أن جماعة الرواة للموطأ رووه مرسلا. {cite:muwatta-maruf-1997 p.387} {cite:muwatta-maruf-1997 p.388}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Peygamberimiz zamanında bir adamın zina yaptığını itiraf ettiğini anlatır. Peygamberimiz bir kırbaç istedi ve ona kırık bir kırbaç getirildi. Adam, \"Bundan daha iyisi olsun\" dedi. Sonra, henüz ucu kesilmemiş yeni bir kırbaç getirildi. Adam, \"Bundan daha azı olsun\" dedi. Sonunda, kullanılmış ve yumuşamış bir kırbaç getirildi ve Peygamberimiz adamın onunla kırbaçlanmasını emretti. Sonra şöyle buyurdu: \"Allah'ın koyduğu sınırları aşmaktan sakınmanızın zamanı geldi. Bu utanç verici fiillerden herhangi birini işleyen, Allah'ın koruması altına girsin. Kim bize kendini ifşa ederse, biz de ona emredilen cezayı uygulayacağız.\" Araştırmacı, İbn Abdül-Barr'ın, Muvatta'nın bir grup rivayetçisinin bunu mursal hadis olarak naklettiği yönündeki ifadesinden bahsetmektedir. {cite:muwatta-maruf-1997 s.387} {cite:muwatta-maruf-1997 s.388}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa seorang pria mengaku berzina pada zaman Nabi. Nabi meminta cambuk, dan sebuah cambuk yang patah dibawa kepadanya. Beliau berkata, \"Yang lebih baik dari ini.\" Kemudian sebuah cambuk baru, masih dengan tali yang belum dipotong, dibawa. Dia berkata, \"Yang kurang baik dari ini.\" Akhirnya, sebuah cambuk yang telah digunakan dan dilunakkan dibawa, dan Nabi memerintahkan agar pria itu dicambuk dengan cambuk tersebut. Kemudian beliau berkata, \"Sudah saatnya kalian menahan diri dari melanggar batas-batas yang telah ditetapkan Allah. Siapa pun yang melakukan perbuatan-perbuatan memalukan ini hendaknya berlindung di bawah perlindungan Allah. Siapa pun yang menampakkan diri kepada kami, kami akan melaksanakan hukuman yang telah ditentukan.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa sekelompok perawi Muwatta meriwayatkannya sebagai hadits mursal. {cite:muwatta-maruf-1997 p.387} {cite:muwatta-maruf-1997 p.388}"
