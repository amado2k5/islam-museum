label: { ar: "الموطأ 2225 — مالك: السنة الثابتة عندنا أنه لا تجوز وصية لوارث إلا أن يجيز ذلك ورثة الميت، فإن أجاز بعضهم وأبى بعض، جاز حق من أجاز منهم، ومن أبى أخذ حقه", en: "Muwatta 2225", es: "Muwatta 2225", fr: "Muwatta 2225", ur: "موطا 2225", tr: "El-Muvatta 2225 — Malik: Bizde yerleşik sünnet şudur ki, ölenin mirasçıları onaylamadıkça bir mirasçıya vasiyet bırakmak caiz değildir. Eğer mirasçılardan bazıları onaylar, bazıları reddederse, onaylayanların hakkı geçerlidir ve reddedenler de haklarını kullanırlar.", id: "Al-Muwatta 2225 — Malik: Sunnah yang telah ditetapkan di antara kami adalah bahwa wasiat kepada ahli waris tidak diperbolehkan kecuali jika ahli waris almarhum menyetujuinya. Jika sebagian dari mereka menyetujui dan sebagian menolak, maka hak dari mereka yang menyetujui adalah sah, dan mereka yang menolak mengambil hak mereka." }
summary:
  ar: "قال: وسمعت مالكا يقول: السنة الثابتة عندنا التي لا اختلاف فيها أنه لا تجوز وصية لوارث، إلا أن يجيز ذلك ورثة الميت. وأنه إن أجاز له بعضهم، وأبى بعض، جاز له حق من أجاز منهم، ومن أبى أخذ حقه من ذلك. {cite:muwatta-maruf-1997 p.315}"
  tr: "O şöyle dedi: Malik'in şöyle dediğini işittim: Bizde ihtilaf bulunmayan yerleşik sünnet şudur ki, ölenin mirasçıları onaylamadıkça bir mirasçıya vasiyet bırakmak caiz değildir. Eğer mirasçılardan bazıları onaylar, bazıları reddederse, vasiyet onaylayanlar için geçerlidir, reddedenler ise kendi paylarını alırlar. {cite:muwatta-maruf-1997 s.315}"
  id: "Dia berkata: Saya mendengar Malik berkata: Sunnah yang telah ditetapkan di antara kami, yang tidak ada perbedaan pendapat tentangnya, adalah bahwa wasiat kepada ahli waris tidak diperbolehkan kecuali jika ahli waris almarhum menyetujuinya. Dan jika sebagian dari mereka menyetujuinya dan sebagian menolak, maka wasiat tersebut sah bagi mereka yang menyetujuinya, dan mereka yang menolak mengambil bagiannya. {kutipan:muwatta-maruf-1997 hlm. 315}"
