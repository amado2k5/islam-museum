label: { ar: "الموطأ 2225 — مالك: السنة الثابتة عندنا أنه لا تجوز وصية لوارث إلا أن يجيز ذلك ورثة الميت، فإن أجاز بعضهم وأبى بعض، جاز حق من أجاز منهم، ومن أبى أخذ حقه", en: "Muwatta 2225" }
summary:
  ar: "قال: وسمعت مالكا يقول: السنة الثابتة عندنا التي لا اختلاف فيها أنه لا تجوز وصية لوارث، إلا أن يجيز ذلك ورثة الميت. وأنه إن أجاز له بعضهم، وأبى بعض، جاز له حق من أجاز منهم، ومن أبى أخذ حقه من ذلك. {cite:muwatta-maruf-1997 p.315}"
