summary:
  ar: "القسم 45 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب البر والصلة والآداب»، ويضم فيها النصوص من 6500 إلى 6722 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 45 of Sahih Muslim (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship) in the division of the open hadith dataset the museum took its reports from: reports 6500 to 6722 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 45، عنوان «کتاب البر والصلۃ والآداب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6500 تا 6722۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 45 de Sahih Muslim (El Libro de la Virtud, que ordena las buenas costumbres y fortalece los lazos de parentesco) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6500 al 6722, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre de la vertu, des bonnes mœurs et des liens de parenté), dans la section 6500 à 6722 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih Müslim'in 45. bölümü \"Doğruluk, Akrabalık ve Ahlak Kitabı\" başlığını taşımakta olup, 6500 ile 6722 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 45 dari Sahih Muslim, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Kebajikan, Kekerabatan, dan Adab\" dan berisi teks 6500 hingga 6722, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
