text: "ولد نوح ثلاثة سام ويافث وحام وولد كل واحد من هذه الثلاثة ثلاثة فولد سام العرب وفارس والروم وولد يافث الترك والصقالبة ويأجوج ومأجوج وولد حام القبط والسودان والبربر"
summary:
  ar: "ينقل ابن كثير عن سعيد بن المسيب نسب أمم الأرض إلى أبناء نوح، ويجعل يأجوج ومأجوج من ولد يافث، ويذكر روايات أخرى رُفعت إلى النبي وأخرى جُعلت من كلام سعيد."
  en: "Ibn Kathir quotes Said ibn al-Musayyab tracing the peoples of the world to Noah's sons, placing Gog and Magog among the descendants of Japheth, and notes a version raised to the Prophet and others given as Said's own words."
  es: "Ibn Kathir cita a Said ibn al-Musayyab, quien remonta los orígenes de los pueblos del mundo a los hijos de Noé, situando a Gog y Magog entre los descendientes de Jafet, y menciona una versión atribuida al Profeta y otras presentadas como palabras del propio Said."
  fr: "Ibn Kathir cite Saïd ibn al-Musayyab qui fait remonter les peuples du monde aux fils de Noé, plaçant Gog et Magog parmi les descendants de Japhet, et note une version rapportée au Prophète et d'autres données comme étant les propres paroles de Saïd."
  ur: "ابن کثیر نے سعید بن المسیب کا حوالہ دیا ہے کہ وہ دنیا کے لوگوں کو نوح کے بیٹوں تک کا پتہ لگاتا ہے، یاجوج اور ماجوج کو یافث کی اولاد میں رکھتا ہے، اور نبی اور دوسروں کے لیے اٹھائے گئے ایک نسخے کو نوٹ کرتا ہے جو سید کے اپنے الفاظ کے طور پر دیا گیا ہے۔"
