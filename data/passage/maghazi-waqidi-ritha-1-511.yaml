text: "… إلى الأَوس فنَعَى لهم بنى قُرَيظة. وقال مُعَتِّب بن قُشَير : وَاسُوةَ صَباحَاه ! وقال حاطب بن أُمَيّة الظَّفَريّ : ذهب قومى آخرَ الدهر. وأَقبل سعد إلى رسول اللّٰه، والناس حول رسول اللّٰه جُلوس، فلمّا طلع سعد قال رسول اللّٰه …"
summary:
  ar: "مقطع من كتاب المغازي — محمد بن عمر الواقدي، المجلد المصوَّر 1، ص 511، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Kitab al-Maghazi — Muhammad ibn Umar al-Waqidi, scan volume 1, p. 511, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "کتاب المغازی - محمد ابن عمر الواقدی، اسکین جلد 1، ص 511 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Maghazi - Muhammad ibn Umar al-Waqidi, volume numérisé 1, p. 511, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Kitab al-Maghazi - Muhammad ibn Umar al-Waqidi, volumen escaneado 1, p. 511, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Muhammed ibn Ömer el-Vakidi'nin *El-Magazi* adlı eserinin resimli 1. cildinin 511. sayfasından, bir ağıt ve ölüm ilanı içeren bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari buku *Al-Maghazi* karya Muhammad ibn Umar al-Waqidi, jilid 1 bergambar, halaman 511, berisi eulogi dan pengumuman kematian; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
