label: { ar: "سنن ابن ماجه 218 — الفريضة والفرائض", en: "Sunan Ibn Majah 218 — the obligation (farida)", ur: "سنن ابن ماجہ 218 — فریضہ اور فرائض", fr: "Sunan Ibn Majah 218 — l'obligation (farida)", es: "Sunan Ibn Mayah 218 — la obligación (farida)", tr: "Sunan İbn Majah 218 — Yükümlülük ve Yükümlülükler", id: "Sunan Ibn Majah 218 — Kewajiban dan Kewajiban-kewajiban" }
text: "… عَلَى مَكَّةَ - فَقَالَ عُمَرُ مَنِ اسْتَخْلَفْتَ عَلَى أَهْلِ الْوَادِي قَالَ اسْتَخْلَفْتُ عَلَيْهِمُ ابْنَ أَبْزَى. قَالَ وَمَنِ ابْنُ أَبْزَى قَالَ رَجُلٌ مِنْ مَوَالِينَا. قَالَ عُمَرُ فَاسْتَخْلَفْتَ عَلَيْهِمْ مَوْلًى قَالَ إِنَّهُ قَارِئٌ لِكِتَابِ اللَّهِ تَعَالَى عَالِمٌ بِالْفَرَائِضِ قَاضٍ. قَالَ عُمَرُ أَمَا إِنَّ نَبِيَّكُمْ ـ قَالَ \" إِنَّ اللَّهَ يَرْفَعُ بِهَذَا الْكِتَابِ أَقْوَامًا وَيَضَعُ بِهِ آخَرِينَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 218، يرد فيه ذكر الفريضة والفرائض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 218 (The Book of the Sunnah), whose wording mentions the obligation (farida). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 218، جس کے الفاظ میں فریضہ اور فرائض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 218, dont le texte mentionne l'obligation (farida). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 218, cuyo texto menciona la obligación (farida). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Majah Süneni'nde yer alan 218 numaralı hadiste, farz olan amellerden ve bunların çoğullarından bahsedilmektedir. Bu hadis, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 218, menyebutkan amalan-amalan wajib dan bentuk jamaknya. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan-amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
