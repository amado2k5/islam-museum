text: "… االله تعالى وإيجابه - فالمعنى بقولنا أنهما مصيبان أنهما فعلا ما ك ان الواجب عليهما في ذلك ويجوز أن يوجب البارئ تعالى حكما على شخص ويوجب على غيره خلافه فإن قيل بم تنكرون على من يزعم أن الواجب طلب الحق …"
summary:
  ar: "مقطع من البرهان للجويني، ص 818، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Juwayni's al-Burhan, p. 818, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
