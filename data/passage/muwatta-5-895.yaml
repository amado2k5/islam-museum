label: { ar: "الموطأ 895 — بلاغ: رجال من أصحاب رسول الله أُروا ليلة القدر في المنام في السبع الأواخر، فقال رسول الله: إني أرى رؤياكم قد تواطأت في السبع الأواخر", en: "Muwatta 895" }
text: "إني أرى رؤياكم قد تواطأت في السبع الأواخر، فمن كان متحريها فليتحرها في السبع الأواخر"
summary:
  ar: "بلاغ يرويه زياد عن مالك أنه بلغه أن رجالاً من أصحاب رسول الله رُوا ليلة القدر في المنام في السبع الأواخر، فقال رسول الله: إني أرى رؤياكم قد تواطأت في السبع الأواخر، فمن كان متحريها فليتحرها في السبع الأواخر. ويذكر المحقق أن يحيى رواه بلاغاً، والمحفوظ عند القعنبي والشافعي وابن وهب وابن القاسم وابن بكير وأكثر الرواة أنه عن مالك عن نافع عن ابن عمر، وأن الذي في الموطأ من حديث ابن عمر محفوظ من طريق عبد الله بن دينار كما مر، وأن ابن عبد البر عدّ هذا الحديث من الأحاديث التي انفرد بها مالك، وأن ابن الصلاح قال إنه غريب المتن جداً ضعيف الإسناد جداً. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
