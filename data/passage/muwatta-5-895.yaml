label: { ar: "الموطأ 895 — بلاغ: رجال من أصحاب رسول الله أُروا ليلة القدر في المنام في السبع الأواخر، فقال رسول الله: إني أرى رؤياكم قد تواطأت في السبع الأواخر", en: "Muwatta 895", ur: "موطأ 895 — صحابہ کا لیلة القدر کا متفق خواب", es: "Muwatta 895", fr: "Muwatta 895", tr: "El-Muvatta 895 — Rivayet: Allah Resulü'nün bazı sahabelerine son yedi gecede Kadir Gecesi rüyalarında gösterildi. Bunun üzerine Allah Resulü şöyle buyurdu: \"Son yedi geceyle ilgili rüyalarınızın örtüştüğünü görüyorum.\"", id: "Al-Muwatta 895 — Diriwayatkan: Sebagian sahabat Rasulullah SAW diperlihatkan Malam Lailatul Qadar dalam mimpi selama tujuh malam terakhir, lalu Rasulullah SAW bersabda: \"Aku melihat bahwa mimpi kalian bertepatan mengenai tujuh malam terakhir.\"" }
text: "إني أرى رؤياكم قد تواطأت في السبع الأواخر، فمن كان متحريها فليتحرها في السبع الأواخر"
summary:
  ar: "بلاغ يرويه زياد عن مالك أنه بلغه أن رجالاً من أصحاب رسول الله رُوا ليلة القدر في المنام في السبع الأواخر، فقال رسول الله: إني أرى رؤياكم قد تواطأت في السبع الأواخر، فمن كان متحريها فليتحرها في السبع الأواخر. ويذكر المحقق أن يحيى رواه بلاغاً، والمحفوظ عند القعنبي والشافعي وابن وهب وابن القاسم وابن بكير وأكثر الرواة أنه عن مالك عن نافع عن ابن عمر، وأن الذي في الموطأ من حديث ابن عمر محفوظ من طريق عبد الله بن دينار كما مر، وأن ابن عبد البر عدّ هذا الحديث من الأحاديث التي انفرد بها مالك، وأن ابن الصلاح قال إنه غريب المتن جداً ضعيف الإسناد جداً. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
  ur: "موطأ میں بلاغ، نمبر 895: نبی کے بعض صحابے نے خواب دیکھا کہ لیلة القدر آخری سات راتوں میں ہے، تو نبی نے کہا: «میں تمہارا خواب دیکھتا ہوں کہ تم سب متفق ہو کہ وہ آخری سات میں ہے»۔"
  id: "Sebuah riwayat yang dinarasikan oleh Ziyad dari Malik menyatakan bahwa ia mendengar bahwa beberapa Sahabat Rasulullah shalla Allahu alaihi wa sallam melihat Laylat al-Qadr (Malam Lailatul Qadr) dalam mimpi mereka selama tujuh malam terakhir bulan Ramadhan. Rasulullah shalla Allahu alaihi wa sallam bersabda: “Aku melihat bahwa mimpi kalian bertepatan mengenai tujuh malam terakhir. Maka barangsiapa yang mencarinya hendaknya mencarinya pada tujuh malam terakhir.” Peneliti menyebutkan bahwa Yahya meriwayatkannya sebagai sebuah riwayat, sedangkan versi yang dipelihara oleh al-Qa’nabi, al-Shafi’i, Ibn Wahb, Ibn al-Qasim, Ibn Bukayr, dan sebagian besar perawi adalah dari Malik, dari Nafi’, dari Ibn ‘Umar. Versi dalam al-Muwatta’ dari Ibn ‘Umar dipelihara melalui rantai periwayatan ‘Abdullah ibn Dinar, sebagaimana telah disebutkan sebelumnya. Ibn ‘Abd al-Barr menganggap hadits ini sebagai salah satu hadits yang hanya dimiliki oleh Malik, dan Ibn al-Salah mengatakan bahwa teksnya sangat aneh dan sanadnya sangat lemah. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
