label: { ar: "الموطأ 1832 — مالك: ومن ذلك أن يضمن الرجل للرجل ثوبه بكذا وكذا ظهارة قلنسوة، أو قميصا، أو يقطع جلود البقر والإبل نعالا، أو يعصر حب البان، وكل ذلك يرجع إلى المزابنة", en: "Muwatta 1832" }
summary:
  ar: "قال مالك: ومن ذلك أيضا أن يقول الرجل للرجل، له الثوب: أضمن لك من ثوبك هذا كذا وكذا ظهارة قلنسوة، وقدر كل ظهارة كذا وكذا، فما نقص من ذلك فعلي غرمه حتى أوفيكه، وما زاد فلي. أو أن يقول الرجل للرجل: أضمن لك من ثيابك هذه كذا وكذا قميصا، ذرع كل قميص كذا وكذا، فما نقص من ذلك علي غرمه، وما زاد فلي. ومما يشبه ذلك أن يقول الرجل للرجل عنده حب البان: اعصر حبك هذا، فما نقص من كذا وكذا رطلا فعلي أن أعطيكه، وما زاد فهو لي. فهذا كله وما أشبهه من المزابنة التي لا تصلح ولا تجوز، ويرجع إليها ما كان مثلها في الخبط والنوى والكرسف والكتان والقضب والعصفر. {cite:muwatta-maruf-1997 p.151} {cite:muwatta-maruf-1997 p.152}"
