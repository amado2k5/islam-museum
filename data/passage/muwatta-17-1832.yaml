label: { ar: "الموطأ 1832 — مالك: ومن ذلك أن يضمن الرجل للرجل ثوبه بكذا وكذا ظهارة قلنسوة، أو قميصا، أو يقطع جلود البقر والإبل نعالا، أو يعصر حب البان، وكل ذلك يرجع إلى المزابنة", en: "Muwatta 1832", es: "Muwatta 1832", fr: "Muwatta 1832", ur: "موطا 1832", tr: "El-Muvatta 1832 — Malik: Bunlar arasında, bir adamın başka bir adama şu veya bu fiyata giysisini, örneğin bir şapkanın dış katmanını veya bir gömleği garanti etmesi, inek ve deve derilerinden sandalet yapması veya Moringa ağacının tohumlarını sıkması yer alır. Bütün bunlar Muzabana (ağaçtaki olgunlaşmamış hurmaların olgun hurma karşılığında satılmasını içeren bir tür satış) kategorisine girer.", id: "Al-Muwatta 1832 — Malik: Di antara hal-hal tersebut adalah ketika seorang pria menjamin pakaian pria lain dengan harga tertentu, seperti lapisan luar topi, atau kemeja, atau memotong kulit sapi dan unta menjadi sandal, atau memeras biji pohon Moringa. Semua ini termasuk dalam kategori Muzabana (jenis penjualan yang melibatkan penjualan kurma mentah di pohon untuk ditukar dengan kurma matang)." }
summary:
  ar: "قال مالك: ومن ذلك أيضا أن يقول الرجل للرجل، له الثوب: أضمن لك من ثوبك هذا كذا وكذا ظهارة قلنسوة، وقدر كل ظهارة كذا وكذا، فما نقص من ذلك فعلي غرمه حتى أوفيكه، وما زاد فلي. أو أن يقول الرجل للرجل: أضمن لك من ثيابك هذه كذا وكذا قميصا، ذرع كل قميص كذا وكذا، فما نقص من ذلك علي غرمه، وما زاد فلي. ومما يشبه ذلك أن يقول الرجل للرجل عنده حب البان: اعصر حبك هذا، فما نقص من كذا وكذا رطلا فعلي أن أعطيكه، وما زاد فهو لي. فهذا كله وما أشبهه من المزابنة التي لا تصلح ولا تجوز، ويرجع إليها ما كان مثلها في الخبط والنوى والكرسف والكتان والقضب والعصفر. {cite:muwatta-maruf-1997 p.151} {cite:muwatta-maruf-1997 p.152}"
  tr: "Malik şöyle dedi: Bunun bir başka örneği de, bir adamın bir giysiye sahip olan başka birine şöyle demesidir: “Bu giysinizden şu kadar sayıda başlık kılıfı garanti ediyorum, her kılıfın ağırlığı şu kadar. Bundan az olanı size verene kadar ben ödeyeceğim, fazlası ise benim olacak.” Veya bir adamın başka birine şöyle demesi: “Bu giysilerinizden şu kadar sayıda gömlek garanti ediyorum, her gömleğin ağırlığı şu kadar. Bundan az olanı size verene kadar ben ödeyeceğim, fazlası ise benim olacak.” Benzer şekilde, bir adamın bir miktar çam fıstığına sahip olan başka birine şöyle demesi: “Bu fıstıklarınızı sıkın, şu kadar miktardan az olanı size vereceğim, fazlası ise benim olacak.” Bütün bunlar ve benzer örnekler, izin verilmeyen veya caiz olmayan olgunlaşmamış hurma kategorisine girer. Bu, saman, hurma çekirdeği, pamuk, keten, kamış ve aspir ile ilgili benzer işlemler için de geçerlidir. {cite:muwatta-maruf-1997 s.151} {cite:muwatta-maruf-1997 s.152}"
  id: "Malik berkata: Contoh lain dari hal ini adalah ketika seorang pria berkata kepada orang lain, yang memiliki pakaian: “Saya menjamin Anda sejumlah penutup kepala dari pakaian Anda ini, dan berat setiap penutup kepala adalah sekian. Apa pun yang kurang dari itu, akan saya bayar sampai saya memberikannya kepada Anda, dan apa pun yang lebih adalah milik saya.” Atau ketika seorang pria berkata kepada orang lain: “Saya menjamin Anda sejumlah kemeja dari pakaian Anda ini, berat setiap kemeja adalah sekian. Apa pun yang kurang dari itu, akan saya bayar, dan apa pun yang lebih adalah milik saya.” Demikian pula, ketika seorang pria berkata kepada orang lain yang memiliki sejumlah kacang pinus: “Peras kacang-kacang ini, dan apa pun yang kurang dari jumlah sekian dalam pon, akan saya berikan kepada Anda, dan apa pun yang lebih adalah milik saya.” Semua ini, dan contoh serupa, termasuk dalam kategori kurma mentah, yang tidak diperbolehkan atau diizinkan. Ini juga berlaku untuk transaksi serupa yang melibatkan sekam, biji kurma, kapas, linen, alang-alang, dan bunga safflower. {kutip:muwatta-maruf-1997 hal.151} {kutip:muwatta-maruf-1997 hal.152}"
