text: "… قريباً من حمص، ثم سار إلى بلاد طرابلس، فأقام اثنى عشر يوماً يقتل ويأسر ويغنم، حتى جنح الفرنج إلى المهادنة، ثم عاد إلى دمشق. وفيها ملك صاحب اذربيجان الأمير نصير الذين أبو بكر بن البهلول مدينة مراغة لخلوها عن ملك …"
