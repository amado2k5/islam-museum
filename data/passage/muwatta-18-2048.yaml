label: { ar: "الموطأ 2048 — مالك: فيمن تفاصل مع المقارض فبقي بيد العامل من المتاع الذي يعمل فيه خلق القربة أو خلق الثوب، فكل شيء تافه لا خطب له فهو للعامل، وما كان له ثمن، كالدابة أو الجمل أو الشاذكونة، فيرد ما بقي عنده منه إلا أن يتحلل صاحبه", en: "Muwatta 2048" }
summary:
  ar: "قال مالك في المتقارضين إذا تفاصلا، فبقي بيد العامل من المتاع الذي يعمل فيه خلق القربة أو خلق الثوب أو ما أشبه ذلك. قال مالك: كل شيء من ذلك كان تافها لا خطب له، فهو للعامل، ولم أسمع أحدا أفتى برد ذلك. وإنما يرد من ذلك الشيء الذي له ثمن، وإن كان شيئا له اسم، مثل الدابة أو الجمل أو الشاذكونة أو أشباه ذلك مما له ثمن. فإني أرى أن يرد ما بقي عنده من هذا، إلا أن يتحلل صاحبه من ذلك. {cite:muwatta-maruf-1997 p.237}"
