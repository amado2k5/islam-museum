label: { ar: "الموطأ 2048 — مالك: فيمن تفاصل مع المقارض فبقي بيد العامل من المتاع الذي يعمل فيه خلق القربة أو خلق الثوب، فكل شيء تافه لا خطب له فهو للعامل، وما كان له ثمن، كالدابة أو الجمل أو الشاذكونة، فيرد ما بقي عنده منه إلا أن يتحلل صاحبه", en: "Muwatta 2048", es: "Números de 2048", fr: "2048 numéros", ur: "2048 نمبر", tr: "Al-Muwatta 2048 — Malik: Bir işçiyle anlaşmazlığı çözen ve işçinin üzerinde çalıştığı mallardan, örneğin yıpranmış bir su tulumu veya yıpranmış bir giysi gibi, bir kısmını elinde tutması durumunda, önemsiz ve değersiz olan her şey işçiye aittir. Hayvan, deve veya eyer gibi değerli olan şeylere gelince, sahibi onu serbest bırakmadığı sürece, geriye kalanını iade etmelidir.", id: "Al-Muwatta 2048 — Malik: Mengenai seseorang yang menyelesaikan perselisihan dengan seorang pekerja dan pekerja tersebut menyimpan sebagian barang yang sedang dikerjakannya, seperti kantung air yang sudah usang atau pakaian yang sudah usang, maka apa pun yang tidak berarti dan tidak penting menjadi milik pekerja tersebut. Adapun barang berharga, seperti hewan, unta, atau pelana, ia harus mengembalikan sisanya kecuali jika pemiliknya membebaskannya." }
summary:
  ar: "قال مالك في المتقارضين إذا تفاصلا، فبقي بيد العامل من المتاع الذي يعمل فيه خلق القربة أو خلق الثوب أو ما أشبه ذلك. قال مالك: كل شيء من ذلك كان تافها لا خطب له، فهو للعامل، ولم أسمع أحدا أفتى برد ذلك. وإنما يرد من ذلك الشيء الذي له ثمن، وإن كان شيئا له اسم، مثل الدابة أو الجمل أو الشاذكونة أو أشباه ذلك مما له ثمن. فإني أرى أن يرد ما بقي عنده من هذا، إلا أن يتحلل صاحبه من ذلك. {cite:muwatta-maruf-1997 p.237}"
  tr: "Malik, bir borç sözleşmesinin taraflarından ikisinin ayrılması ve işçinin, yıpranmış bir su tulumu, yıpranmış bir giysi veya benzeri bir şey gibi, üzerinde çalıştığı mallardan bazılarını elinde tutması durumunda şunları söyledi: Malik şöyle dedi: Önemsiz ve hiçbir değeri olmayan her şey işçiye aittir ve bunların iadesini gerektiren bir fetva verildiğini duymadım. Sadece değerli eşyalar iade edilmelidir, bunlar isimli şeyler bile olsa, örneğin bir yük hayvanı, bir deve, bir eyer veya fiyatı olan benzer eşyalar. Bence, sahibi onu bu yükümlülükten kurtarmadığı sürece, işçide kalan her şey iade edilmelidir. {cite:muwatta-maruf-1997 s.237}"
  id: "Malik berkata mengenai dua pihak dalam perjanjian pinjaman yang berpisah, dan pekerja menyimpan sebagian barang yang dikerjakannya, seperti kantung air usang, pakaian usang, atau barang serupa: Malik berkata: Apa pun yang tidak penting dan tidak berarti adalah milik pekerja, dan saya belum pernah mendengar ada yang mengeluarkan fatwa yang mewajibkan pengembaliannya. Hanya barang-barang berharga yang harus dikembalikan, meskipun itu adalah barang-barang yang memiliki nama, seperti hewan beban, unta, pelana, atau barang-barang serupa yang memiliki harga. Saya percaya bahwa apa pun yang tersisa padanya harus dikembalikan, kecuali pemiliknya membebaskannya dari kewajiban tersebut. {cite:muwatta-maruf-1997 p.237}"
