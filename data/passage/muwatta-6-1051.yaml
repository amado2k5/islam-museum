summary:
  ar: "يقول يحيى: سئل مالك عمن أهل من أهل مكة بالحج، ثم أصابه كسر، أو بطن منخرق، أو امرأة تطلق؛ فقال: من أصابه هذا منهم فهو محصر، يكون عليه مثل ما على أهل الآفاق إذا أحصروا. ويذكر المحقق أن البطن المنخرق هو الذي أصابه إسهال شديد. ويذكر أنه رواه عن مالك أبو مصعب (1169). {cite:muwatta-maruf-1997 p.487}"
