label: { ar: "الموطأ 1051 — يحيى: سئل مالك عمن أهل من أهل مكة بالحج ثم أصابه كسر أو بطن منخرق أو امرأة تطلق: فهو محصر، عليه مثل ما على أهل الآفاق إذا أحصروا", en: "Muwatta 1051", es: "Muwatta 1051", fr: "Muwatta 1051", ur: "موطا 1051", tr: "El-Muvatta 1051 — Yahya: Malik'e, Hac için ihram haline giren, sonra kırık, karın yırtılması veya karısının doğum sancısı çeken Mekkeli bir kimse hakkında soru soruldu: Bu kişi ihram halinde sayılır ve Hac'ı tamamlamasına engel olunan diğer bölgelerden gelenlerle aynı şartlara tabidir.", id: "Al-Muwatta 1051 — Yahya: Malik ditanya tentang seseorang dari Mekah yang memasuki keadaan ihram untuk haji, kemudian mengalami patah tulang, pecah perut, atau istrinya melahirkan: ia dianggap dalam keadaan ihram, dan ia tunduk pada syarat yang sama seperti mereka dari daerah lain yang terhalang untuk menyelesaikan haji." }
summary:
  ar: "يقول يحيى: سئل مالك عمن أهل من أهل مكة بالحج، ثم أصابه كسر، أو بطن منخرق، أو امرأة تطلق؛ فقال: من أصابه هذا منهم فهو محصر، يكون عليه مثل ما على أهل الآفاق إذا أحصروا. ويذكر المحقق أن البطن المنخرق هو الذي أصابه إسهال شديد. ويذكر أنه رواه عن مالك أبو مصعب (1169). {cite:muwatta-maruf-1997 p.487}"
  tr: "Yahya şöyle dedi: Malik'e, Hac için ihrama giren, sonra kırık, karın yırtılması veya karısının doğum sancısı çeken Mekkeli bir kimse hakkında soru soruldu. O şöyle cevap verdi: Onlardan kim böyle bir durum yaşarsa, ihram halinde sayılır (Hac ibadetini tamamlamasına engel olunur) ve yükümlülükleri, Hac ibadetini tamamlamasına engel olunan diğer bölgelerden insanlarınkiyle aynıdır. Araştırmacı, karın yırtılmasının şiddetli ishale neden olan bir durum olduğunu belirtiyor. Ayrıca bunun Malik'ten Ebu Mus'ab (1169) tarafından rivayet edildiğini de belirtiyor. {cite:muwatta-maruf-1997 s.487}"
  id: "Yahya berkata: Malik ditanya tentang seseorang dari Mekah yang memasuki keadaan ihram untuk haji, kemudian mengalami patah tulang, perut pecah, atau istrinya melahirkan. Beliau menjawab: Siapa pun di antara mereka yang mengalami hal ini dianggap dalam keadaan ihram (terhalang untuk menyelesaikan haji), dan kewajibannya sama dengan orang-orang dari daerah lain yang terhalang untuk menyelesaikan haji. Peneliti menyebutkan bahwa perut pecah adalah perut yang menyebabkan diare parah. Beliau juga menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1169). {cite:muwatta-maruf-1997 p.487}"
