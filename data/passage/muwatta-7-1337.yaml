label: { ar: "الموطأ 1337 — أبو هريرة عن النبي: لولا أن أشق على أمتي لأحببت أن لا أتخلف عن سرية تخرج في سبيل الله", en: "Muwatta 1337", es: "Muwatta 1337", fr: "Muwatta 1337", ur: "موطا 1337", tr: "El-Muvatta 1337 — Ebu Hurayra, Peygamber'den rivayetle: Eğer ümmetime zorluk çıkarmak istemeseydim, Allah yolunda çıkan hiçbir sefere katılmamayı çok isterdim.", id: "Al-Muwatta 1337 — Abu Hurairah berdasarkan riwayat Nabi: Seandainya aku tidak ingin menyulitkan umatku, aku pasti ingin tidak ketinggalan ekspedisi apa pun yang berangkat demi jalan Allah." }
text: "لَوْلاَ أنْ أشُقَّ على أُمَّني، لأحْبَبْتُ أنْ لا أَتَّخلَّفَ عَن سَريَّةٍ تَخْرُجُ في سَبِيلِ اللهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي صالح السمان عن أبي هريرة أن رسول الله قال لولا أن أشق على أمتي، لأحببت أن لا أتخلف عن سرية تخرج في سبيل الله، ولكني لا أجد ما أحملهم عليه، ولا يجدون ما يتحملون عليه، فيخرجون، ويشق عليهم أن يتخلفوا بعدي، فوددت أني أقاتل في سبيل الله فأقتل، ثم أحيا فأقتل، ثم أحيا فأقتل. {cite:muwatta-maruf-1997 p.598}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Ebu Salih el-Samman'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu naklediyor: \"Ümmetim için zorluk çekmek istemeseydim, Allah yolunda çıkan hiçbir sefere katılmamayı çok isterdim. Fakat ben onlara binek bulamıyorum, onlar da kendilerine binek bulamıyorlar, bu yüzden yola çıkıyorlar ve benden sonra kalmaları zor oluyor. Bu yüzden keşke Allah yolunda savaşsam, öldürülsem, sonra dirilsem, tekrar öldürülsem, sonra tekrar dirilsem ve tekrar öldürülsem diye düşünüyorum.\" {cite:muwatta-maruf-1997 s.598}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abu Salih al-Samman, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Seandainya aku tidak ingin menyulitkan umatku, aku ingin sekali tidak tertinggal dalam ekspedisi yang berangkat membela agama Allah. Tetapi aku tidak dapat menemukan kendaraan untuk mereka, dan mereka pun tidak dapat menemukan kendaraan untuk mereka, sehingga mereka berangkat, dan sulit bagi mereka untuk tertinggal setelahku. Maka aku berharap dapat berperang membela agama Allah dan gugur, kemudian hidup kembali dan gugur lagi, kemudian hidup kembali dan gugur lagi.\" {cite:muwatta-maruf-1997 p.598}"
