label: { ar: "الموطأ 1337 — أبو هريرة عن النبي: لولا أن أشق على أمتي لأحببت أن لا أتخلف عن سرية تخرج في سبيل الله", en: "Muwatta 1337" }
text: "لَوْلاَ أنْ أشُقَّ على أُمَّني، لأحْبَبْتُ أنْ لا أَتَّخلَّفَ عَن سَريَّةٍ تَخْرُجُ في سَبِيلِ اللهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي صالح السمان عن أبي هريرة أن رسول الله قال لولا أن أشق على أمتي، لأحببت أن لا أتخلف عن سرية تخرج في سبيل الله، ولكني لا أجد ما أحملهم عليه، ولا يجدون ما يتحملون عليه، فيخرجون، ويشق عليهم أن يتخلفوا بعدي، فوددت أني أقاتل في سبيل الله فأقتل، ثم أحيا فأقتل، ثم أحيا فأقتل. {cite:muwatta-maruf-1997 p.598}"
