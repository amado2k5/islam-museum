label: { ar: "سنن النسائي 4212 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 4212 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن نسائی 4212 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 4212 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sunan al-Nasa'i 4212 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan an-Nasa'i 4212 — Baba ve babalık, anne babaya saygı göstermek veya göstermemek", id: "Sunan an-Nasa'i 4212 — Ayah dan peran ayah, menghormati atau tidak menaati orang tua" }
text: "أَخْبَرَنَا أَحْمَدُ بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ حَدَّثَنَا دَاوُدُ بْنُ قَيْسٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ سُئِلَ رَسُولُ اللَّهِ عَنِ الْعَقِيقَةِ فَقَالَ \" لاَ يُحِبُّ اللَّهُ عَزَّ وَجَلَّ الْعُقُوقَ \". وَكَأَنَّهُ كَرِهَ الاِسْمَ قَالَ لِرَسُولِ اللَّهِ إِنَّمَا نَسْأَلُكَ أَحَدُنَا يُولَدُ لَهُ. قَالَ \" مَنْ أَحَبَّ أَنْ يَنْسُكَ عَنْ وَلَدِهِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4212، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4212 (The Book of al-'Aqiqah), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4212، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4212 (El Libro de al-'Aqiqah), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4212 (Le Livre d'al-'Aqiqah), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sunan-ı Nesai'de yer alan 4212 numaralı hadis, baba ve babalık kavramını, anne babaya saygı göstermeyi veya göstermemeyi ele almaktadır. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4212, menyebutkan tentang ayah dan peran ayah, serta menghormati atau tidak taat kepada orang tua. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
