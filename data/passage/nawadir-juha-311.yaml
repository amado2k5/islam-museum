text: "… إذا كانت القراءة والكتابةُ بالقاووق فأقرأْ أنت سطرين وردَ على أحد العامة من أهل أذربيجانَ كتاب بالفارسيةِ، فصادف الشيخَ في طريقِهِ وقال: اقرأ لي هذا المكتوب وأفهمني معناه. فأخذ الشيخ الكتاب بيده، ولما رآه فارسي العبارة قال له: ليقرأهُ لك …"
summary:
  ar: "أعطى رجل من أذربيجان جحا رسالة بالفارسية، فقال جحا إنها بالفارسية وإن باله مشغول، فقال الرجل إن جحا يلبس قلنسوة وعمامة وهو لا يعرف القراءة، فألقى جحا قلنسوته وجبته وقال للرجل أن يلبسهما ويقرأ سطرين بنفسه. {cite:juha-nawadir-kubra-djuwaydi p. 153}"
  en: "A man of Azerbaijan gives Juha a letter in Persian; Juha says it is in Persian and his mind is troubled; the man says Juha wears a cap and turban yet cannot read; Juha throws his cap and robe down and tells the man to wear them and read two lines himself. {cite:juha-nawadir-kubra-djuwaydi p. 153}"
  ur: "آذربائیجان کے ایک آدمی نے جحا کو فارسی میں ایک خط دیا، جحا نے کہا کہ یہ فارسی میں ہے اور اس کا ذہن پریشان ہے، آدمی نے کہا کہ جحا ٹوپی اور پگڑی پہنتا ہے مگر پڑھنا نہیں جانتا، تو جحا نے اپنی ٹوپی اور جبہ اتار پھینکا اور آدمی سے کہا کہ انہیں پہن لے اور دو سطریں خود پڑھ لے۔ {cite:juha-nawadir-kubra-djuwaydi p. 153}"
  fr: "Un homme d'Azerbaïdjan remet à Juha une lettre en persan ; Juha dit qu'elle est en persan et qu'il a l'esprit troublé ; l'homme répond que Juha porte bonnet et turban mais ne sait pas lire ; Juha jette bonnet et robe à terre et dit à l'homme de les revêtir et de lire lui-même deux lignes. {cite:juha-nawadir-kubra-djuwaydi p. 153}"
  es: "Un hombre de Azerbaiyán entrega a Juha una carta en persa; Juha dice que está en persa y que tiene la mente alterada; el hombre responde que Juha lleva gorro y turbante pero no sabe leer; Juha tira al suelo el gorro y la túnica y le dice al hombre que se los ponga y lea él mismo dos líneas. {cite:juha-nawadir-kubra-djuwaydi p. 153}"
  tr: "Azerbaycanlı bir adam Juha'ya Farsça yazılmış bir mektup verdi. Juha mektubun Farsça olduğunu ve meşgul olduğunu söyledi. Adam, Juha'nın başında kep ve sarık olduğunu ve okuyamadığını söyledi. Bunun üzerine Juha kepini ve cübbesini çıkardı ve adama bunları giyip iki satırı kendisinin okumasını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 153}"
  id: "Seorang pria dari Azerbaijan memberikan surat yang ditulis dalam bahasa Persia kepada Juha. Juha mengatakan bahwa surat itu dalam bahasa Persia dan dia sedang sibuk. Pria itu mengatakan bahwa Juha mengenakan topi dan sorban dan tidak bisa membaca. Jadi Juha melepas topi dan jubahnya dan menyuruh pria itu untuk memakainya dan membaca dua baris sendiri. {cite:juha-nawadir-kubra-djuwaydi p. 153}"
