label: { ar: "صحيح مسلم 5350 — الأب والأبوة", en: "Sahih Muslim 5350 — the father and fatherhood", ur: "صحیح مسلم 5350 — باپ اور والدیت", es: "Sahih Muslim 5350 — El padre y la paternidad" }
text: "حَدَّثَنِي عَبْدُ اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ الدَّارِمِيُّ، أَخْبَرَنَا يَحْيَى بْنُ حَسَّانَ، أَخْبَرَنَا سُلَيْمَانُ، بْنُ بِلاَلٍ عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ النَّبِيَّ قَالَ \" نِعْمَ الأُدُمُ - أَوِ الإِدَامُ - الْخَلُّ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5350، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5350 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5350، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5350 (El Libro de las Bebidas), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
