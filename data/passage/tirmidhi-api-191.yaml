text: "… بْنِ أَبِي مَحْذُورَةَ، قَالَ أَخْبَرَنِي أَبِي وَجَدِّي، جَمِيعًا عَنْ أَبِي مَحْذُورَةَ، أَنَّ رَسُولَ اللَّهِ أَقْعَدَهُ وَأَلْقَى عَلَيْهِ الأَذَانَ حَرْفًا حَرْفًا. قَالَ إِبْرَاهِيمُ مِثْلَ أَذَانِنَا. قَالَ بِشْرٌ فَقُلْتُ لَهُ أَعِدْ عَلَىَّ. فَوَصَفَ الأَذَانَ بِالتَّرْجِيعِ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي مَحْذُورَةَ فِي الأَذَانِ حَدِيثٌ صَحِيحٌ. وَقَدْ رُوِيَ عَنْهُ مِنْ غَيْرِ وَجْهٍ. وَعَلَيْهِ الْعَمَلُ بِمَكَّةَ وَهُوَ قَوْلُ الشَّافِعِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 191، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 191 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 191، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
