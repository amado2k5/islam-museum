text: |-
  القيل والظلمء الظلة وربعما وصف بها يقال ليلد ظلماه أى مظلمة وظلم الليل بالتكسر وأظلم
  ؛عنى عن القراء وأظسلم القوم دخلوا فى الظلام قال تعالى فاذاهم مظلون ويقال لقيته أدتى
  ظلم بالتحريك أى أول كل شى قال الاموى أدنى ظلم الريب وقال الخليل لقسته أول ذى ظل
  أى أول شى يسد بصرلك فى الرؤية لا يشتق منه فعل ويقال لثلاث من ليالى الشهر اللاتى
  بلين الدرع ظلم لاظلامها على غير قياس لان قياسه ظلم بالتسكين لانّ واحدتها ظلاء والمظلوم
  اللين يشرب قبل أن يبلغ الروب وكذلت الظليم والظليمة وقد ظلم وطبه ظلما اذاسق منه قبل أن
  يروب ويجرج زبده وقال
  وقائلة ظلت لكم سقائى • وهل يمنى على العكد الظليم
  وظات البعيراذا غرته من غيرداه قال ابن مقبل
  عاد الاذلة فى داروكان بها * هرت الشقاشق ظلامون للجزر
  وظلم الوادى اذا بلغ الماهمنه موضعالم يكن يلغه قبل ذلك والارض المظلومة التى لم تحفرقط
  ثم حغرت وذلك التراب ظليم وقال يرئى رجلا
  فأصبح فى غبرا: بعد اشاحة *على العيس مردود علبها ظليمها.
  والظليم الذكر من النعام والظلم بالفتح ماء الاسنان وبريهارهو كالس وادداخل عظم السنّ
  من شدة البياض كغرند السيف وقال
  الى شنباء مشرية الثنايا • بماء الظلم طيبة الرضاب
  والبمع ظلوم وأنتدأبوعبيدة
  اذا يعكت لم تبتهروتيسمت • تتايالها كالبرق غز ظلومها
  وأظلم موضع
  ( فصل العين {عبم العدام العي الثقيل قال أوص بن هجريذكرأزمة فى سنة
  شديدة البرد
  وشبه الهيدب العبام من الاقوام -قبامجللا فرعا
  ١⁦( ع )⁩ العقة وقت صلاة العشاء قال انظليل العتقة هو النلث الأول من الليل بعد غيبوية
  الشفق وقد عتم الليل يعتم وعتمته ظلامه والعتمة أيضابقية اللبن تضيق بها النعم تلك الساعة يقال
  حلبنا عتمة والعنوم الناقة التى لا تدر الاعتمة والعتم الابطاء يقال جاء ناضيف عاتم وقرى عاتم
  أى بطى*٢من وقد عتم قراه أى أبطأ وعتم تعتيما مثله ويقال ماعتم أن فمل كذا بالتشديد أيض.
  أى مالبث وما أبطأ وضربه فاعتم وجل عليه فاعم أى فااحتبس فى ضربه والعامة تقول
  ضريه فاعتب وعتم عن الامر أيضا بالتشديد أى كفّ وقبل ما قرا أربع فقال عتمة ربع
  أى قدرما يحتبس فى عشائه وأعتم الرجل قرى الضيف اذا أبطأ به وأعتمنا من العمة كما تقول
  أصبحنا من الصبح وعتمنا تعتيم اسر نا فى ذلك الوقت وغرست الودى "فساعتم منهاشئ أى ما أيطأ.
  والعتم شجرالا ينون البرعثم عثم العظم المسكسوراذا انجبر على غيراستواه وعنمته
  أنا يتعدى ولا يتعدى أبوعمر والعمثمة من النوق الشديدة والذكر عمثم والعثمتم الاسد قال
  ويقال ذلك من ثقل وطئه وقال • خبعتن مشيته عثمثم * وعنت المرأة المزادة واعتثمتها اذا
  خرزته اخر زاغير محكم وفى المثل الا أكن صفعافاتى أعتتم أى ان لم أكن حاذ فافانى أعمل على
  3در
