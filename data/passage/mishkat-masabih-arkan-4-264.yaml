text: "… المغرب قبل أن يتكلم ركعتين -وفي رواية: أربع ركعات- رفعت صلاته في عليين. مرسلاً. - وعن حذيفة، نحوه، وزاد: فكان يقول: عجلوا الركعتين بعد المغرب، فإنهما ترفعان مع المكتوبة. رواهما رزين، وروى البيهقي الزيادة عنه نحوها في: شعب الإيمان ®. …"
