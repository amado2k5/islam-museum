text: "… أنها لم يطرقها فخل. فى اللان، أن البيت لزيد بن تركى الزبيدى، ونقل أيضاً قول الجوهرى. قضأ - - بيضاءً تصطاد الغَوِىَّ وتَسْتَبى بالحُسْنِ قَلْب المُسلِمِ القُرَاءِ وقد يكون القُرَّاء جمعاً لقارئ. والقِرْأَةُ بالكسر مثال القِرْعَةِ : الوباء. قال الأصعى …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 2، ص 87، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 2, p. 87, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الصحاح، جوہری، اسکین جلد 2، ص 87 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Sihah de al-Jawhari, volumen 2, pág. 87, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de l'ouvrage d'al-Jawhari, al-Sihah (tome 2, p. 87), mentionne les lectures du Coran et les lecteurs; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "Cevhari'nin Resimli Sahah adlı eserinin 2. cildinin 87. sayfasından, Kur'an okunuşlarını ve okuyucularını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Sahah karya Al-Jawhari, Jilid 2 Bergambar, hlm. 87, yang menyebutkan bacaan Al-Quran dan para qarinya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
