label: { ar: "صحيح البخاري 2119 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Sahih al-Bukhari 2119 — ranks raised; bad deeds erased and sins shed", ur: "صحیح بخاری 2119 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… الْوُضُوءَ، ثُمَّ أَتَى الْمَسْجِدَ، لاَ يُرِيدُ إِلاَّ الصَّلاَةَ، لاَ يَنْهَزُهُ إِلاَّ الصَّلاَةُ، لَمْ يَخْطُ خَطْوَةً إِلاَّ رُفِعَ بِهَا دَرَجَةً، أَوْ حُطَّتْ عَنْهُ بِهَا خَطِيئَةٌ، وَالْمَلاَئِكَةُ تُصَلِّي عَلَى أَحَدِكُمْ مَا دَامَ فِي مُصَلاَّهُ الَّذِي يُصَلِّي فِيهِ اللَّهُمَّ صَلِّ عَلَيْهِ، اللَّهُمَّ ارْحَمْهُ، مَا لَمْ يُحْدِثْ فِيهِ، مَا لَمْ يُؤْذِ فِيهِ \". وَقَالَ \" أَحَدُكُمْ فِي صَلاَةٍ مَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2119، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 2119 (Sales and Trade), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 2119، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
