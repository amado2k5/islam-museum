label: { ar: "نوادر جحا الكبرى، ص 50 — «لا تتكبر فالماء هو هذا»", en: "Nawadir Juha al-Kubra, p. 50 — 'Do Not Be Proud, for the Water Is This'", ur: "نوادر جحا الکبریٰ، ص 50 — «غرور نہ کر، پانی یہ ہے»", fr: "Nawadir Juha al-Kubra, p. 50 — « Ne sois pas orgueilleuse, l'eau, c'est ceci »", es: "Nawadir Juha al-Kubra, p. 50 — «No te enorgullezcas, el agua es esto»", tr: "Juha'nın Büyük Fıkraları, s. 50 — “Kibirli olmayın, çünkü bu sudur.”", id: "Anekdot Hebat Juha, hlm. 50 — “Jangan sombong, karena ini air.”" }
text: "… لا تتكبر فالماء هو هذا غطسَ في البحر لأخذِ جرعةٍ منه لِتسكين عطشِهِ فالتَهبَتْ مَعِدتُهُ مِنَ الملوحة واختلطتْ واختبطَتْ، فتقدَّم قليلاً، فوجدَ ماءًا عَذباً فأخذ يشرب منه حتى ارتوى، ثم أخذ وعاءًا وملأه ماءًا وأخذَهُ إلى البحر وصَبَّهُ فيه قائلاً …"
summary:
  ar: "شرب جحا من ماء البحر فمرض من الملح، ثم وجد ماءً عذبًا فملأ جرة وسكبها في البحر وقال له ألا يتكبر لأن الماء هو هذا. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  en: "Juha drinks sea water, gets sick from the salt, finds fresh water, fills a jug and pours it into the sea, telling it not to be proud, since the water is this. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  ur: "جحا نے سمندر کا پانی پیا اور نمک سے بیمار ہو گیا، پھر میٹھا پانی ملا تو ایک گھڑا بھر کر سمندر میں انڈیل دیا اور اس سے کہا کہ غرور نہ کر، پانی تو یہ ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  fr: "Juha boit de l'eau de mer et tombe malade à cause du sel ; il trouve de l'eau douce, remplit une cruche et la verse dans la mer en lui disant de ne pas être fière, car l'eau, c'est ceci. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  es: "Juha bebe agua de mar y se enferma por la sal; encuentra agua dulce, llena un cántaro y lo vierte en el mar, diciéndole que no se enorgullezca, pues el agua es esto. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  tr: "Juha deniz suyu içti ve tuzdan hastalandı. Sonra tatlı su buldu, bir testi doldurdu ve denize dökerek, \"Kibirli olma, bu sadece sudur.\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 50}"
  id: "Juha meminum air laut dan jatuh sakit karena garamnya. Kemudian ia menemukan air tawar, mengisi sebuah kendi, dan menuangkannya ke laut, sambil berkata, \"Jangan sombong, karena ini hanyalah air.\" {cite:juha-nawadir-kubra-djuwaydi p. 50}"
