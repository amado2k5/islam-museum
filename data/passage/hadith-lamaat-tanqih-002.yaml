text: "صحابه، وقد ذكرنا منه ومن باقي أحوال مرضه وموته ودفنه ونحوها في رسالة لنا مسماة ب (ما ثبت في السنة) من أحكام السنة وما ذكرنا يكفي ههنا ، وبالله التوفيق . الفصل الأول البراء) قوله: (أول من قدم علينا) أي:"
