text: "… درهم. سكبينج ينفع من القولنج والرياج في الأمعاء والظهر والورك وإسهال البلغم اللزج، الشربة ما بين درهم إلى مثقال، وينقع في مطبوخ أو في ماء العسل أو ماء الحلبة، ومع الأدوية نصف درهم. أنزروت يدمل الخراجات، الشربة من نصف درهم …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 964، يذكر التداوي بالعسل، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 964, that mentions honey as a remedy, named diseases, the hospital and the medical craft, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 964 کا اقتباس جس میں شہد سے علاج، بیماریوں کے نام، بیمارستان، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
