label: { ar: "الموطأ 1222 — مالك: تفسير الحديث في الرخصة أنهم يرمون يوم النحر، ثم يرمون لما مضى ولليوم، لأن أحدا لا يقضي شيئا حتى يجب عليه", en: "Muwatta 1222" }
summary:
  ar: "يقول مالك إن تفسير الحديث الذي أرخص فيه رسول الله، فيما يرى، أنهم يرمون يوم النحر، فإذا مضى اليوم الذي يلي يوم النحر رموا من الغد، وهو يوم النفر الأول، فيرمون لما مضى ثم يرمون ليومهم، لأنه لا يقضي أحد شيئا حتى يجب عليه. فإن بدا لهم النفر فقد فرغوا، وإن أقاموا إلى الغد رموا مع الناس يوم النفر الآخر ونفروا. {cite:muwatta-maruf-1997 p.546}"
