label: { ar: "الموطأ 1222 — مالك: تفسير الحديث في الرخصة أنهم يرمون يوم النحر، ثم يرمون لما مضى ولليوم، لأن أحدا لا يقضي شيئا حتى يجب عليه", en: "Muwatta 1222", es: "Muwatta 1222", fr: "Muwatta 1222", ur: "موطا 1222", tr: "El-Muvatta 1222 — Malik: Muvaffakiyetle ilgili hadisin tefsiri şudur: Kurban Günü taş atarlar, sonra geçmiş ve bugün için taş atarlar; çünkü kimse farz olan bir şeyi telafi etmez.", id: "Al-Muwatta 1222 — Malik: Penafsiran hadits mengenai keringanan hukuman adalah bahwa mereka melempar batu pada Hari Raya Kurban, kemudian mereka melempar batu untuk apa yang telah berlalu dan untuk hari ini, karena tidak ada yang mengganti sesuatu kecuali jika hal itu wajib baginya." }
summary:
  ar: "يقول مالك إن تفسير الحديث الذي أرخص فيه رسول الله، فيما يرى، أنهم يرمون يوم النحر، فإذا مضى اليوم الذي يلي يوم النحر رموا من الغد، وهو يوم النفر الأول، فيرمون لما مضى ثم يرمون ليومهم، لأنه لا يقضي أحد شيئا حتى يجب عليه. فإن بدا لهم النفر فقد فرغوا، وإن أقاموا إلى الغد رموا مع الناس يوم النفر الآخر ونفروا. {cite:muwatta-maruf-1997 p.546}"
  tr: "Malik, Allah Resulü'nün izin verdiği hadisin yorumunun, kendi görüşüne göre, Kurban Bayramı günü taş atacakları yönünde olduğunu söylüyor. Eğer Kurban Bayramı'nı takip eden gün geçerse, ertesi gün, yani ayrılışın ilk gününde taş atarlar. Geçmiş için taş atarlar ve sonra da içinde bulundukları gün için taş atarlar, çünkü kimse bir yükümlülüğü vadesi gelmeden yerine getiremez. Eğer ayrılmaya karar verirlerse, işleri bitmiş olur. Eğer ertesi güne kadar kalırlarsa, ayrılışın ikinci gününde insanlarla birlikte taş atarlar ve sonra ayrılırlar. {cite:muwatta-maruf-1997 s.546}"
  id: "Malik mengatakan bahwa penafsiran hadits di mana Rasulullah memberikan izin, menurut pandangannya, adalah bahwa mereka akan melempar kerikil pada Hari Raya Kurban. Kemudian, jika hari setelah Hari Raya Kurban telah berlalu, mereka akan melempar kerikil pada hari berikutnya, yaitu hari pertama keberangkatan. Mereka akan melempar untuk apa yang telah berlalu dan kemudian melempar untuk hari mereka saat ini, karena tidak seorang pun dapat memenuhi kewajiban sampai tiba waktunya. Jika mereka memutuskan untuk berangkat, maka mereka telah selesai. Jika mereka tinggal sampai hari berikutnya, mereka melempar kerikil bersama orang-orang pada hari kedua keberangkatan dan kemudian berangkat. {cite:muwatta-maruf-1997 p.546}"
