label: { ar: "سنن النسائي 1345 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan al-Nasa'i 1345 — mentions of non-Muslim nations, religions and peoples", ur: "سنن نسائی 1345 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan al-Nasa'i 1345 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan al-Nasa'i 1345 — mentions de nations, de religions et de peuples non musulmans", tr: "Sunan al-Nasa'i 1345 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sunan al-Nasa'i 1345 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "أَخْبَرَنَا أَحْمَدُ بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنَا يَعْلَى، قَالَ حَدَّثَنَا قُدَامَةُ، عَنْ جَسْرَةَ، قَالَتْ حَدَّثَتْنِي عَائِشَةُ، -ا - قَالَتْ دَخَلَتْ عَلَىَّ امْرَأَةٌ مِنَ الْيَهُودِ فَقَالَتْ إِنَّ عَذَابَ الْقَبْرِ مِنَ الْبَوْلِ. فَقُلْتُ كَذَبْتِ. فَقَالَتْ بَلَى إِنَّا لَنَقْرِضُ مِنْهُ الْجِلْدَ وَالثَّوْبَ. فَخَرَجَ رَسُولُ اللَّهِ إِلَى الصَّلاَةِ وَقَدِ ارْتَفَعَتْ أَصْوَاتُنَا فَقَالَ \" مَا هَذَا \". فَأَخْبَرْتُهُ بِمَا قَالَتْ فَقَالَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1345، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1345 (The Book of Forgetfulness (In Prayer)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 1345، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan al-Nasa'i, n.º 1345 (El Libro del Olvido (En la Oración)), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan al-Nasa'i, n° 1345 (Le Livre de l'oubli (dans la prière)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sunan-ı Nesai'de yer alan 1345 numaralı hadiste, gayrimüslim milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 1345, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
