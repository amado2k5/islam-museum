text: "أَخْبَرَنَا أَحْمَدُ بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنَا يَعْلَى، قَالَ حَدَّثَنَا قُدَامَةُ، عَنْ جَسْرَةَ، قَالَتْ حَدَّثَتْنِي عَائِشَةُ، -ا - قَالَتْ دَخَلَتْ عَلَىَّ امْرَأَةٌ مِنَ الْيَهُودِ فَقَالَتْ إِنَّ عَذَابَ الْقَبْرِ مِنَ الْبَوْلِ. فَقُلْتُ كَذَبْتِ. فَقَالَتْ بَلَى إِنَّا لَنَقْرِضُ مِنْهُ الْجِلْدَ وَالثَّوْبَ. فَخَرَجَ رَسُولُ اللَّهِ إِلَى الصَّلاَةِ وَقَدِ ارْتَفَعَتْ أَصْوَاتُنَا فَقَالَ \" مَا هَذَا \". فَأَخْبَرْتُهُ بِمَا قَالَتْ فَقَالَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1345، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1345 (The Book of Forgetfulness (In Prayer)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 1345، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan al-Nasa'i, n.º 1345 (El Libro del Olvido (En la Oración)), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
