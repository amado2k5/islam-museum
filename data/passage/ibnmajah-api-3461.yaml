label: { ar: "سنن ابن ماجه 3461 — السنا والسنوت، الشفاء", en: "Sunan Ibn Majah 3461 — senna and sannut; healing", ur: "سنن ابن ماجہ 3461 — سنا اور سنوت، شفا", es: "Sunan Ibn Majah 3461 - sen y sannut; cicatrización", fr: "Sunan Ibn Majah 3461 — séné et sannut; guérison", tr: "Sunan İbn Majah 3461 — Sinameki ve rezene, şifa", id: "Sunan Ibnu Majah 3461 — Senna dan adas, penyembuhan" }
text: "… الْحَمِيدِ بْنِ جَعْفَرٍ، عَنْ زُرْعَةَ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ مَوْلًى، لِمَعْمَرٍ التَّيْمِيِّ عَنْ مَعْمَرٍ التَّيْمِيِّ، عَنْ أَسْمَاءَ بِنْتِ عُمَيْسٍ، قَالَتْ قَالَ لِي رَسُولُ اللَّهِ ـ \" بِمَاذَا كُنْتِ تَسْتَمْشِينَ \". قُلْتُ بِالشُّبْرُمِ قَالَ \" حَارٌّ جَارٌّ \". ثُمَّ اسْتَمْشَيْتُ بِالسَّنَى. فَقَالَ \" لَوْ كَانَ شَىْءٌ يَشْفِي مِنَ الْمَوْتِ كَانَ السَّنَى وَالسَّنَى شِفَاءٌ مِنَ الْمَوْتِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3461، يذكر السنا والسنوت، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3461 (Chapters on Medicine), that mentions senna and sannut, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3461، جس میں سنا اور سنوت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3461 (Capítulos sobre Medicina), menciona la senna y el sannut, y su relación con la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3461 (Chapitres sur la médecine), mentionne le séné et le sannut, ainsi que leurs propriétés curatives. Le Répertoire des ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 3461 numaralı hadiste sinameki ve rezene ile şifadan bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3461, menyebutkan senna dan adas, serta pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
