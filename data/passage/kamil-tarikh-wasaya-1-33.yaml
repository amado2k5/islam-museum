text: "ما كانَ إلا كَمَفْحصِ الدُّئِلِ جاؤوا بِجَمْعٍ لوْ قيسَ مِبركُهُ أبطال أهل البطحاء والأسَلِ عارٍ من النصرِ والثراءِ ومن وفي ذي الحجّة منها مات عِثمان بن مَظْعون، فدُفن بالبقيع، وجعل رسول الله، ويخ، على رأس القبر حجراً علامةً لقبره. وقيل: …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 33، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
