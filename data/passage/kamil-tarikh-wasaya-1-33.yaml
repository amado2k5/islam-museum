  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 33 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
