text: "… بن قرقب ومنهم من لم يذكر مينا كما حزم به أبو عمر الكندى فى أمراء مصر فقال المقوقس بن قرقوب أمير القبط بمصر من قبل ملك الروم ذكره ابن مندة فى الصحابة فقال مقوقس صاحب الاسكندرية روى عنه عبيد اللّه …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 5، ص 548، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 5, p. 548, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
