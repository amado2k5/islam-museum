text: "… صِيحَ بنا أَتَيْنَا وَبِالصّياحِ عُوّلواً عَلَيْن فقال رسول اللٰه، صلعم : يرحمك اللّٰه !فقال عمربن الخطَّاب : وَجَبَتْ والله يارصول اللّٰه. فقال رجل من القوم : لولا مَتعْتَنَا به يأرسول الله. فاستُشهِدَ عامر يوم خيبر ذهب يضرب رجلًا من المشركين …"
