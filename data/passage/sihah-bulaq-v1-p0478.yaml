  وسلفتهم والهاج اللبن الهيجاجا اذاخثر حتى يختلط بعضه ببعض ولم تتم خثورته وكذلك كل
  مختلط يقال رأيت أمر بى فسلان.لها جاوالهاجت عينه أيضا اختلط جما النعاس أبوزيد
  اهوج الرجسل أمره لهوجسة وهو أن لا يبرمه وشواء ملهوج اذالم ينضج وقد له وحت اللحم
  وتل وجته اذا الم تنعم طبخه
