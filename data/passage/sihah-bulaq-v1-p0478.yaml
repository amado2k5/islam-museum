  حتى عج الماء من حلقها والجاحة والمجاج الريق الذى تحه من فيك يقال المطر مجاج المزن
  والعسل مجاج النصل ومجاجة الشى أيضاعصارته ومجمجت الكتاب اذا ثيجته ولم تبين الحروف
  ومجمج الرحل فى خسبره اذالم يبينه وأمج الفرس اذا بدأ بالجرى قبل أن يضطرم وأمج الرجسل
  اذا ذهب الى البلاد والمج بالفتح -ب كالعدس معرّب وهو بالفارسبة ماش ( محج
