text: "… ولم أعرفها، وقال السيوطي في الخصائص أخرجه الطبراني وابن منده. وسيأتي ذكر هذا الحديث مرة ثانية برقم. في الأصل محمد بن عمر والصواب ما أثبتناه. الضبْع: ما بين الإبط إلى نصف العضد. لعل الصواب وصاة أي توصية بأذيته. رفا فلاناً …"
