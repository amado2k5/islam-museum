label: { ar: "صحيح مسلم 3978 — استحلال الشيء", en: "Sahih Muslim 3978 — treating a thing as lawful", ur: "صحیح مسلم 3978 — کسی چیز کو حلال ٹھہرانا", es: "Sahih Muslim 3978 — tratar algo como lícito", fr: "Sahih Muslim 3978 — considérer une chose comme licite", tr: "Sahih Muslim 3978 — Bir şeyi helal kılmak", id: "Sahih Muslim 3978 — Memperbolehkan sesuatu" }
text: "حَدَّثَنِي أَبُو الطَّاهِرِ، أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي مَالِكٌ، عَنْ حُمَيْدٍ الطَّوِيلِ، عَنْ أَنَسِ، بْنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ نَهَى عَنْ بَيْعِ الثَّمَرَةِ حَتَّى تُزْهِيَ قَالُوا وَمَا تُزْهِيَ قَالَ تَحْمَرُّ. فَقَالَ إِذَا مَنَعَ اللَّهُ الثَّمَرَةَ فَبِمَ تَسْتَحِلُّ مَالَ أَخِيكَ"
summary:
  ar: "حديث في صحيح مسلم، رقم 3978، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3978 (The Book of Musaqah), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3978، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.° 3978 (El Libro de Musaqah), menciona la consideración de algo como lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3978 (Le Livre de la Musaqah), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 3978 numaralı hadis, bir şeyin helal olup olmadığını belirtir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerini içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3978, menyebutkan tentang kebolehan sesuatu. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
