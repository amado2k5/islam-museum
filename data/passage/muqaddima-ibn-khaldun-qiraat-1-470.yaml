text: "… من المناظرة على البدع، وهي كلام صرف وليست براجعة إلى عمل، وإما لأن سبب وضعه والخوض فيه هو تنازعهم في إثبات الكلام النفسي. وكثر أتباع الشيخ أبي الحسن الأشعري، واقتفى طريقته من بعده تلميذه، كابن مجاهد وغيره. وأخذ عنهم القاضي …"
