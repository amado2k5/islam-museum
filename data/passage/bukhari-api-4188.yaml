label: { ar: "صحيح البخاري 4188 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4188 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4188 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4188 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا يَعْلَى، حَدَّثَنَا إِسْمَاعِيلُ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ أَبِي أَوْفَىما ـ قَالَ كُنَّا مَعَ النَّبِيِّ حِينَ اعْتَمَرَ فَطَافَ فَطُفْنَا مَعَهُ، وَصَلَّى وَصَلَّيْنَا مَعَهُ، وَسَعَى بَيْنَ الصَّفَا وَالْمَرْوَةِ، فَكُنَّا نَسْتُرُهُ مِنْ أَهْلِ مَكَّةَ، لاَ يُصِيبُهُ أَحَدٌ بِشَىْءٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4188، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4188 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4188، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4188 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
