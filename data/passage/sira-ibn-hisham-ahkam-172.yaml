text: "… للحِلْف، ويقال : ابن الدُّغينة. قال ابن إسحاق: حدثني الزُّهْري، عن عُروة، عن عائشةا، قالت: فقال ابن الدَّغُنَّة: أين يا أبا بكر؟ قال: أخْرَجَني قومي، وآذَوْني، وضَيَّقُوا عليَّ، قال: وَلِمَ؟ فوالله إِنَّك لَتَزينُ الْعَشِيرة، وتُعِينُ على النَّوائِب، وتَفْعَلُ الْمَعْرُوف، وتَكْسِبُ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 172، يرد فيه ذكر فرض العين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hisham's Sira, p. 172, whose wording mentions the individual obligation (fard 'ayn); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سیرت ابن ہشام، ص 172 کا اقتباس جس میں فرضِ عین کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sira de Ibn Hisham, p. 172, dont le texte mentionne l'obligation individuelle (fard 'ayn) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sira de Ibn Hisham, p. 172, cuyo texto menciona la obligación individual (fard 'ayn); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hişam'ın Peygamber biyografisinden bir alıntı, 172. sayfada, bireysel yükümlülüklerden bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi Nabi karya Ibnu Hisham, halaman 172, menyebutkan kewajiban individu; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks tersebut disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
