text: |-
  *(باب الواو والياح*
  ٤٨٣
  فأنت فيهما بالخياران شئت قلبتها واوامثل التى للتآنيت فقات كساوان وعلباوان ورداوان
  وان شئت تركتها همزة مثل الاصلية وهو أجودفات كساآن وعلبا آن وردآن والجمع
  كسية وأردية وتردى وارتدى بمعنى أى ليس الرداه والردية كلإكبة من الركوب والجلسة
  من الجلوس تقول هوحسن الردية وردّيته أنا زدية وراديت عن القوم مراداة اذا راميت
  بالحجارة ويقال أيضاراديت فلانا اذاراودته وهومقلوب منه قال طفيل الغنوى
  يرادى على فأس اللجام كانما * برادى به حر قاة جذع مشذب
  ويقال أيضاراداه ؟عنى داراه حكاه أبو عبيد وردى بالكسر يردى ردى أى هلك وأرداه
  غيره ورجل ردللها لك وامرأة ردية على فعلة والمردى خشبة تدفع بها السفينة تكون فى يد
  الملاح وابمع المرادى ⁦( ذى)⁩ الرذية النساقة المهزولة من السسير والمع الرذايا وقال
  أبوزي هى المتروكة التى حسرها السفر لا تقدر أن تلحق بالركاب قال والذ كررذى" وقد أرذيت
  ناقتى اذاهزلتها وخلفتها والمردى المنبوذ وقد أرذيته ⁦( رزى)⁩ أرزيت ظهرى الى فلان أى
  التجأت اليه قال رؤبة * أنا ابن أنضاد اليها أرزى * سا) ر.ا الشى يرسونيت وجبال
  راسيات ورست أقدامهم فى الحرب أى ثبتت ورست السفينة ترسورسواورسوًا أى وقفت
  على اللنجر وقوله تعالى بسم اللّٰه مجراها ومرساها بالضم من أجريت وأرسبت ومجراها
  ومرساها بالفتح من رست وجرت ورسوت بين القوم رسوا أى أصلحت والرسوة شئ من خرز
  نظم كالد ستينج ورسوت عمه حديشا أى حدّئت به عنه ويقال أيضارسوت اذاذ كرت منه
  طرفأ والمرساة التى ترسى بها السفينة تضميها الفرص كمكر وألقت السهابة مراسيها اذا
  دامث والرواسى من الجبال الثوابت الرواسخ قال الاخفسْ واحدتهاراسية وربما قالوا
  قدرسا الفحل بالشول وذلك اذاقعاء لبها ويقال غرة نرسيانة بكسر النون اضرب م-ن التمر
  جيد شا الرشاه المبل والجمع أرشية والرشوة معروفة والرشوة بالضم مثله والجمع
  رشاورشًا وقد رشناه يرشوه رشوا وارتشى أخذارشوة واسترشى فى -كمه طلب الرشوة عليه
  واسترشى الفصيل اذا طلب الرضاع وقد أرشيته ارشاء وأرشيت الدلوجعات لهارشاء
  أوترشيت الرجل اذا لاينته وراشيته اذا ظاهرته وأرشى الحنظل اذا امتدّت أغصانه شبه
  بالارسبة والرشاءكواكب كثيرة صغار على صورة السمكة بقال لهابطن الحوت وفى
  سرتها كوكب نيرينزه القمر ضا لرضوان الرضا وكذلك الرضوان بالضم والمرضاة
  مثل ورضيت الشئ وارتضيته فهو مرضى وقد قالوامر ضوّ فجاوابه على الاصل والقياس
  ورضيت عنه رضا مقصوروهو مصدر محض والاسم الرضاء مدود عن الاخفس وسمع
  الكسانى رضوان وحوان فى تثنية الرضا والحى قال والوجه جيان ورضان ومن العرب
  من يقولهما باليسا على الاصل والواوأ كثر وعيشة راضية أى حرضية كولهم هم ناصب
  لائه يقمال رضيت معيشته على ما لم يسمّ فاعله ولا يقال رضيت ويقال رضيت به صاحبا
  وربما قالوارضيت عليه بمعنى رضيت به وعنه وأنشد الاخفسf
  اذا رضيت على بنوقشير • لعمرالله أعجبنى رضاها
  وأرضيته عنى ورضيته بالتشديد أيضافرضى وترضيته أرضيته بعدجهد واسترضيته
