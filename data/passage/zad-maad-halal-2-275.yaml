text: "… عن مسروق، عن عائشة، ورواه علي بن مُسهر، وغيره، عن الشعبي، عن النبي اليه مرسلاً وهو أصح، انتهى كلام أبي عيسى. وقولُها: جعل الحرامَ حلالاً، أي: جعل الشيء الذي حرَّمه وهو العسلُ، أو الجاريةُ، حلالاً بعد تحريمه إياه. وقال الليثُ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 275، يذكر الحلال، والحرام، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
