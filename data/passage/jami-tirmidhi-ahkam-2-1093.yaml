text: "… أحمد:. قال ابن كثير في تفسيره : : ومعنى قوله: بمنزلة واحدة : أي: في أنهم من هذه الأمة، وأنهم من أهل الجنة، وإن كان والمقتصد: هو المؤدي للواجبات، التارك للمحرمات، وقد يترك بعض المستحبات، ويفعل بعض المكروهات. والسابق بالخيرات: …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 1093، يرد فيه ذكر الواجب، والمستحب، والمكروه، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 1093, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the disliked (makruh), the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
