label: { ar: "صحيح مسلم 4589 — ما خلّفه من تركة وميراث", en: "Sahih Muslim 4589 — what was left behind: estate and inheritance", ur: "صحیح مسلم 4589 — ترکہ اور میراث", es: "Sahih Muslim 4589 — Lo que quedó: patrimonio y herencia", fr: "Sahih Muslim 4589 — Ce qui a été laissé derrière: biens et héritage" }
text: "… تَقْتُلْ تَقْتُلْ ذَا دَمٍ وَإِنْ تُنْعِمْ تُنْعِمْ عَلَى شَاكِرٍ وَإِنْ كُنْتَ تُرِيدُ الْمَالَ فَسَلْ تُعْطَ مِنْهُ مَا شِئْتَ. فَتَرَكَهُ رَسُولُ اللَّهِ حَتَّى كَانَ بَعْدَ الْغَدِ فَقَالَ \" مَا عِنْدَكَ يَا ثُمَامَةُ \". قَالَ مَا قُلْتُ لَكَ إِنْ تُنْعِمْ تُنْعِمْ عَلَى شَاكِرٍ وَإِنْ تَقْتُلْ تَقْتُلْ ذَا دَمٍ وَإِنْ كُنْتَ تُرِيدُ الْمَالَ فَسَلْ تُعْطَ مِنْهُ مَا شِئْتَ. …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4589، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4589 (The Book of Jihad and Expeditions), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 4589، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4589 (El Libro de la Yihad y las Expediciones), menciona lo que quedó tras de sí: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 4589 (Livre du Jihad et des Expéditions), mentionne les biens et l'héritage laissés après la mort. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
