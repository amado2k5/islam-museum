text: "… الآخر فليقل خيراً أو ليسكت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه أحمد و. أخرجه أبو نُعَيم. الهجيم - أبو تَميمَة، عن رجُلٍ من الهُجَيم. أخبرنا إسماعيل بن علي وغير واحد …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1449، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1449, that mentions an act tied to belief in God and the Last Day; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1449 کا اقتباس جس میں اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 1449, que menciona un acto relacionado con la creencia en Dios y el Último Día; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 1449), mentionnant un acte lié à la croyance en Dieu et au Jour dernier; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin resimli 1. cildinin 1449. sayfasında, Allah'a ve Ahiret Günü'ne olan imanla ilgili bir eylemden bahsedilmektedir; makine tarafından okunabilir taranmış baskıdan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve bir müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 1 bergambar, halaman 1449, menyebutkan sebuah perbuatan yang berkaitan dengan iman kepada Tuhan dan Hari Kiamat; dari edisi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
