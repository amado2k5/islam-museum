label: { ar: "الموطأ 336 — حفصة: كان يصلي ركعتين خفيفتين إذا سكت المؤذن", en: "Muwatta 336", es: "Muwatta 336", fr: "Muwatta 336", ur: "موطا 336", tr: "El-Muvatta 336 — Hafsa: Müezzin sustuğunda iki rekat hafif namaz kılardı.", id: "Al-Muwatta 336 — Hafsa: Dia biasa shalat dua rakaat ringan ketika muazin diam." }
text: "كان إذا سكت المؤذن عن الأذان لصلاة الصبح صلى ركعتين خفيفتين قبل أن تقام الصلاة"
summary:
  ar: "أول حديث في باب ما جاء في ركعتي الفجر. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر أن حفصة زوج النبي أخبرته أن النبي كان إذا سكت المؤذن عن أذان الصبح صلى ركعتين خفيفتين قبل أن تقام الصلاة. ويخرّجه المحقق عند البخاري (618) ومسلم (5/159) والنسائي (3/255) والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (15/309). {cite:muwatta-maruf-1997 p.186}"
  tr: "Fecir namazının iki rekatıyla ilgili bölümdeki ilk hadis. Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Peygamberimizin eşi Hafsa, müezzin fecir namazı için ezanı bitirdikten sonra, namaz kılınmadan önce Peygamberimizin iki rekat hafif namaz kıldığını bildirmiştir. Araştırmacı, bu hadisi Buhari (618), Müslim (5/159), Nesai (3/255), Darimi ve Ahmed'in hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiş ve Temhid'e (15/309) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.186}"
  id: "Hadits pertama dalam surah ini membahas dua rakaat shalat Subuh. Diriwayatkan oleh Yahya dari Malik, dari Nafi', dari Abdullah ibn Umar, bahwa Hafsa, istri Nabi, memberitahukan kepadanya bahwa ketika muazin selesai mengumandangkan azan Subuh, Nabi biasa mengerjakan dua rakaat ringan sebelum shalat Subuh dimulai. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (618), Muslim (5/159), al-Nasa'i (3/255), al-Darimi, dan Ahmad melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (15/309). {cite:muwatta-maruf-1997 p.186}"
