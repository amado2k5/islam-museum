text: "كان إذا سكت المؤذن عن الأذان لصلاة الصبح صلى ركعتين خفيفتين قبل أن تقام الصلاة"
summary:
  ar: "أول حديث في باب ما جاء في ركعتي الفجر. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر أن حفصة زوج النبي أخبرته أن النبي كان إذا سكت المؤذن عن أذان الصبح صلى ركعتين خفيفتين قبل أن تقام الصلاة. ويخرّجه المحقق عند البخاري (618) ومسلم (5/159) والنسائي (3/255) والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (15/309). {cite:muwatta-maruf-1997 p.186}"
