label: { ar: "جامع الترمذي 2899 — عمل يعدل عملا أعظم منه", en: "Jami' al-Tirmidhi 2899 — a deed that equals a greater one", ur: "جامع ترمذی 2899 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Jami' al-Tirmidhi 2899 — una acción que equivale a una mayor", fr: "Jami' al-Tirmidhi 2899 — un acte qui en vaut un plus grand", tr: "Cami' el-Tirmizi 2899 — Daha büyük bir amele denk bir amel", id: "Jami' al-Tirmidhi 2899 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "حَدَّثَنَا الْعَبَّاسُ بْنُ مُحَمَّدٍ الدُّورِيُّ، قَالَ حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ، قَالَ حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، قَالَ حَدَّثَنَا سُهَيْلُ بْنُ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ⁦(قُلْ هُوَ اللَّهُ أَحَدٌ )⁩ تَعْدِلُ ثُلُثَ الْقُرْآنِ \". هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2899، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2899 (Chapters on The Virtues of the Qur'an), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2899، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2899 (Capítulos sobre las virtudes del Corán), habla de una acción que equivale a otra mayor. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2899 (Chapitres sur les vertus du Coran), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui dénombrent, inscrivent, effacent ou évaluent un acte."
  tr: "Cami' el-Tirmizi'de 2899 numaralı hadis, daha büyük bir ameli sayan bir ameli zikrediyor. Bu amel, iyi ve kötü ameller listeleriyle birlikte, amelin değerini sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2899, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
