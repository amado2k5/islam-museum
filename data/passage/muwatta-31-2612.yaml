label: { ar: "الموطأ 2612 — أسامة بن زيد: الطاعون رجز أُرسل على طائفة من بني إسرائيل", en: "Muwatta 2612" }
summary:
  ar: "يروي مالك عن محمد بن المنكدر وعن سالم أبي النضر مولى عمر بن عبيد الله عن عامر بن سعد بن أبي وقاص عن أبيه أنه سمعه يسأل أسامة بن زيد: ما سمعت من رسول الله في الطاعون؟ فقال أسامة: قال رسول الله: الطاعون رجز أُرسل على طائفة من بني إسرائيل، أو على من كان قبلكم، فإذا سمعتم به بأرض فلا تدخلوا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارا منه. قال مالك: قال أبو النضر: لا يخرجكم إلا فرارا منه. ويذكر المحقق ما قاله القاضي عياض وابن عبد البر في ضبط «فرارا» رفعا ونصبا. {cite:muwatta-maruf-1997 p.475} {cite:muwatta-maruf-1997 p.476}"
