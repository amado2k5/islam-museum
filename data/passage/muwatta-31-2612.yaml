label: { ar: "الموطأ 2612 — أسامة بن زيد: الطاعون رجز أُرسل على طائفة من بني إسرائيل", en: "Muwatta 2612", es: "Muwatta 2612", fr: "Muwatta 2612", ur: "موطا 2612", tr: "El-Muvatta 2612 — Usame bin Zeyd: Veba, İsrailoğullarından bir gruba gönderilen bir cezaydı.", id: "Al-Muwatta 2612 — Usama bin Zaid: Wabah itu adalah hukuman yang diturunkan kepada sekelompok Bani Israel" }
summary:
  ar: "يروي مالك عن محمد بن المنكدر وعن سالم أبي النضر مولى عمر بن عبيد الله عن عامر بن سعد بن أبي وقاص عن أبيه أنه سمعه يسأل أسامة بن زيد: ما سمعت من رسول الله في الطاعون؟ فقال أسامة: قال رسول الله: الطاعون رجز أُرسل على طائفة من بني إسرائيل، أو على من كان قبلكم، فإذا سمعتم به بأرض فلا تدخلوا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارا منه. قال مالك: قال أبو النضر: لا يخرجكم إلا فرارا منه. ويذكر المحقق ما قاله القاضي عياض وابن عبد البر في ضبط «فرارا» رفعا ونصبا. {cite:muwatta-maruf-1997 p.475} {cite:muwatta-maruf-1997 p.476}"
  tr: "Malik, Muhammed ibn el-Munkadir'den ve Ömer ibn Ubeyd Allah'ın azatlı kölesi Salim Ebu el-Nadr'dan, o da Emir ibn Sa'd ibn Abi Vakkas'tan, o da babasından rivayet ederek, Usame ibn Zeyd'e şöyle sorduğunu işittiğini aktarır: \"Allah'ın Resulü'nden veba hakkında ne işittiniz?\" Usame şöyle cevap verdi: \"Allah'ın Resulü şöyle buyurdu: 'Veba, İsrailoğullarından bir gruba veya sizden önce gelenlere gönderilen bir cezadır. Bir yerde duyarsanız oraya girmeyin. Ve bulunduğunuz yerde olursa, ondan kaçmak için oradan ayrılmayın.'\" Malik dedi ki: \"Ebu el-Nadr dedi ki: 'Ondan kaçmak dışında ayrılmamalısınız.'\" Araştırmacı, Kadı İyad ve İbn Abd el-Barr'ın \"kaçmak\" (fararan) fiilinin yalın ve belirtme hallerindeki gramer durumu hakkındaki görüşlerinden de bahseder. {cite:muwatta-maruf-1997 s.475} {cite:muwatta-maruf-1997 s.476}"
  id: "Malik meriwayatkan dari Muhammad ibn al-Munkadir dan dari Salim Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Amir ibn Sa'd ibn Abi Waqqas, dari ayahnya, bahwa ia mendengar dia bertanya kepada Usama ibn Zayd: \"Apa yang kamu dengar dari Rasulullah tentang wabah?\" Usama menjawab: \"Rasulullah bersabda: 'Wabah adalah hukuman yang diturunkan kepada sekelompok Bani Israel, atau kepada orang-orang sebelum kalian. Jika kalian mendengar tentangnya di suatu negeri, jangan memasukinya. Dan jika terjadi di negeri tempat kalian berada, jangan meninggalkannya untuk melarikan diri.'\" Malik berkata: \"Abu al-Nadr berkata: 'Kalian tidak boleh meninggalkannya kecuali untuk melarikan diri.'\" Peneliti menyebutkan apa yang dikatakan Qadi Iyad dan Ibn Abd al-Barr mengenai kasus gramatikal \"melarikan diri\" (fararan) dalam kasus nominatif dan akusatif. {kutip:muwatta-maruf-1997 hal.475} {kutip:muwatta-maruf-1997 hal.476}"
