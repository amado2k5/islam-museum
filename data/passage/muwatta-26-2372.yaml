label: { ar: "الموطأ 2372 — مالك: المدبر إذا جرح وله مال وأبى السيد أن يفتديه", en: "Muwatta 2372", es: "Muwatta 2372", fr: "Muwatta 2372", ur: "موطا 2372", tr: "El-Muvatta 2372 — Malik: Efendisinin ölümünden sonra özgürlüğüne kavuşacağı vaat edilen bir köle yaralanır ve malı varsa, efendisi fidyesini ödemeyi reddederse..." }
summary:
  ar: "قال مالك في المدبر إذا جرح وله مال، فأبى سيده أن يفتديه: فإن المجروح يأخذ مال المدبر في دية جرحه؛ فإن كان فيه وفاء استوفى دية جرحه ورد المدبر إلى سيده، وإن لم يكن فيه وفاء اقتضاه من دية جرحه واستعمل المدبر بما بقي من دية جرحه. {cite:muwatta-maruf-1997 p.377}"
  tr: "Malik, yaralı ve parası olan bir köle hakkında şöyle demiştir: Efendisi onu fidye ile kurtarmayı reddederse, yaralı adam kölenin parasını yaralanmasının karşılığı olarak alır. Eğer yeterliyse, tam tazminatı alır ve köleyi efendisine geri verir. Yeterli değilse, kalanını yaralanmasının karşılığı olarak aldığı tazminattan keser ve köleyi tazminatın geri kalanıyla kullanır. {cite:muwatta-maruf-1997 s.377}"
  id: "Malik berkata mengenai seorang budak yang terluka dan memiliki uang, dan tuannya menolak untuk menebusnya: orang yang terluka mengambil uang budak itu sebagai kompensasi atas lukanya. Jika cukup, ia menerima kompensasi penuh dan mengembalikan budak itu kepada tuannya. Jika tidak cukup, ia mengambilnya dari kompensasi atas lukanya dan menggunakan budak itu dengan sisa kompensasi tersebut. {cite:muwatta-maruf-1997 p.377}"
