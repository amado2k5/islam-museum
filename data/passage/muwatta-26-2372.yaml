summary:
  ar: "قال مالك في المدبر إذا جرح وله مال، فأبى سيده أن يفتديه: فإن المجروح يأخذ مال المدبر في دية جرحه؛ فإن كان فيه وفاء استوفى دية جرحه ورد المدبر إلى سيده، وإن لم يكن فيه وفاء اقتضاه من دية جرحه واستعمل المدبر بما بقي من دية جرحه. {cite:muwatta-maruf-1997 p.377}"
