label:
  ar: "البخاري 7483 — يا آدم أخرج بعث النار"
  en: "Bukhari 7483 — Adam, bring out the party of the Fire"
  ur: "بخاری 7483 — اے آدم، آگ والوں کا حصہ نکالو"
text: "يقول الله يا آدم. فيقول لبيك وسعديك. فينادى بصوت إن الله يأمرك أن تخرج من ذريتك بعثا إلى النار ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7483: يا آدم أخرج بعث النار. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7483: Adam, bring out the party of the Fire. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7483: اے آدم، آگ والوں کا حصہ نکالو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
