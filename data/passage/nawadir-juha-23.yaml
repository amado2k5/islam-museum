text: "… ألم ننتقل إلى هذا الدار دخل لص دار جحا، وأخذ يحمل ما يقعٍ تحت يده، وكان جحا نائماً في غرفته، فأحس بحركة السارق، ولم يكن منه إلا أن جمع، ما في غرفة نومه من الأثاث، ولحق بالسارق عند خروجه إلى …"
summary:
  ar: "سرق لص بيت جحا، فحمل جحا أثاثه خلفه إلى بيت اللص وسأله لماذا هو هناك، فهم قد انتقلوا من البيت. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  en: "A thief robs Juha's house; Juha carries his furniture after him to the thief's house and asks why he is there, since they have moved house. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  ur: "ایک چور نے جحا کے گھر میں چوری کی، تو جحا اپنا باقی سامان اٹھا کر اس کے پیچھے چور کے گھر پہنچا اور پوچھا کہ تم یہاں کیوں ہو، ہم تو گھر بدل چکے ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  fr: "Un voleur dévalise la maison de Juha ; Juha le suit en portant ses meubles jusque chez le voleur et lui demande ce qu'il fait là, puisqu'ils ont déménagé. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  es: "Un ladrón roba la casa de Juha; Juha lleva sus muebles tras él hasta la casa del ladrón y le pregunta por qué está allí, ya que se han mudado. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  tr: "Bir hırsız Juha'nın evini soydu, bu yüzden Juha mobilyalarını arkasından taşıyarak hırsızın evine gitti ve taşındıkları halde neden orada olduğunu sordu. {cite:juha-nawadir-kubra-djuwaydi s. 17}"
  id: "Seorang pencuri merampok rumah Juha, jadi Juha membawa perabotannya ke rumah pencuri itu dan bertanya mengapa dia ada di sana, karena mereka sudah pindah. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
