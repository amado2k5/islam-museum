text: "… لو كانت دوارةً لحضرَتْ إلى بيتِنا قالوا له يوماً : إن امرأتك تدور كثيراً! فأجابهم: لو كان ذلك صحيحاً، لكانت حضرَتْ إلى بيتِنا! الفضوليين: محبّي البحث عن المعرفة."
summary:
  ar: "قيل لجحا إن زوجته كثيرة الخروج، فقال إنه لو كان ذلك صحيحًا لجاءت إلى بيتهم. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  en: "Told that his wife goes out a lot, Juha says that if that were true she would have come to their house. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  ur: "جحا سے کہا گیا کہ اس کی بیوی بہت باہر جاتی ہے، تو اس نے کہا کہ اگر یہ سچ ہوتا تو وہ ہمارے گھر بھی آتی۔ {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  fr: "On dit à Juha que sa femme sort beaucoup; il répond que si c'était vrai, elle serait venue chez eux. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  es: "Le dicen a Juha que su mujer sale mucho; él responde que, si fuera cierto, habría venido a su casa. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  tr: "Juha'ya karısının sık sık dışarı çıktığı söylendi ve o da eğer bu doğruysa eve geleceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 64}"
  id: "Juha diberitahu bahwa istrinya sering keluar rumah, dan dia menjawab bahwa jika itu benar, istrinya pasti akan pulang. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
