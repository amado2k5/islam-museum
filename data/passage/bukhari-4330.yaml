text: "يا معشر الأنصار، ألم أجدكم ضلالاً فهداكم الله بي، وكنتم متفرقين فألفكم الله بي، وعالة فأغناكم الله بي… ألا ترضون أن يذهب الناس بالشاة والبعير وتذهبون بالنبي إلى رحالكم… الأنصار شعار والناس دثار، إنكم ستلقون بعدي أثرة فاصبروا حتى تلقوني على الحوض"
summary:
  ar: "في كتاب المغازي؛ رواية عبد الله بن زيد بن عاصم أن النبي خطب الأنصار بعد قسمة غنائم حنين بالجعرانة إذ لم يعطهم منها شيئاً فتكلم بعضهم، فذكّرهم بما كانوا عليه وأخبرهم بأثرة سيلقونها بعده. من أعظم خطب الصحيح في منزلة الأنصار."
  tr: "Maghazi kitabında Abdullah ibn Zayd ibn Asim'den rivayet edildiğine göre, Peygamberimiz, Ji'ranah'ta Huneyn'in ganimetlerinin dağıtılmasından sonra Ensar'a hitap etmiş, çünkü onlara hiçbir şey vermemişti. Ensar'dan bazıları söz alınca, onlara geçmişlerini hatırlatmış ve kendisinden sonra karşılaşacakları kayırmacılıktan bahsetmiştir. Bu, Ensar'ın statüsüyle ilgili en önemli sahih vaazlardan biridir."
  id: "Dalam kitab Maghazi, diriwayatkan oleh Abdullah ibn Zayd ibn Asim bahwa Nabi berpidato kepada kaum Ansar setelah pembagian rampasan perang Hunayn di al-Ji'ranah, karena beliau tidak memberi mereka apa pun. Sebagian dari mereka angkat bicara, lalu beliau mengingatkan mereka tentang masa lalu mereka dan memberitahukan tentang perlakuan istimewa yang akan mereka terima setelah beliau wafat. Ini adalah salah satu khutbah sahih terpenting mengenai kedudukan kaum Ansar."
