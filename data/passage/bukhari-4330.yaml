label: { ar: "البخاري 4330 — الأنصار شعار والناس دثار", en: "Bukhari 4330 — The Ansar are the inner garment, the people the outer" }
text: "يا معشر الأنصار، ألم أجدكم ضلالاً فهداكم الله بي، وكنتم متفرقين فألفكم الله بي، وعالة فأغناكم الله بي… ألا ترضون أن يذهب الناس بالشاة والبعير وتذهبون بالنبي إلى رحالكم… الأنصار شعار والناس دثار، إنكم ستلقون بعدي أثرة فاصبروا حتى تلقوني على الحوض"
summary:
  ar: "في كتاب المغازي؛ رواية عبد الله بن زيد بن عاصم أن النبي خطب الأنصار بعد قسمة غنائم حنين بالجعرانة إذ لم يعطهم منها شيئاً فتكلم بعضهم، فذكّرهم بما كانوا عليه وأخبرهم بأثرة سيلقونها بعده. من أعظم خطب الصحيح في منزلة الأنصار."
