text: |-
  ١ ن يكررأشهد أن لا اله الا
  اللّه أشهد أنّ محم_دارسول الله
  ٢ ا ى منصبغ بالعرق الاسود
  كما يردع الثوب بالزعة رات
  ٥٩٢
  (باب المين
  ويقال ذات النفع والرجع الفدير قال المتنخل الهذلى يصف السيف
  أبيض كالرجمع رسوب اذا • ماناخ فى محتفل يحتلى
  والجمع الرجعان ورجعان الكتاب أبضاجوابه يقال رجع الىّ الجواب رجع رجعا
  ورجعا نا ورجع الدابة يديمافى السير خطوها ورجع الواشمة خطها ومنه قول لبسيد
  أورجع واشمة أسف نؤورها * كففا تعرّض فوقهن وشامها
  والرجيع من الدواب مارجعته من سفوالى سفروهو الصكال والانى رجيعة والجمع
  الرجائع والرجيع الروث والبعروذ والبطن وقد أرجع الرجل وهذارجيع السسبع ورجعه
  أيضا وكل شي بردد فهو رجيع لان معناه مرجوع أى مردودورباسموا الجرّة رجيعا قال
  الاعشى وفلاة كأنها ظهر ترس * ليس فيها الاالرجيع علاف
  يقول لا تجد الابل فيها علما الاما ترده من جرتها وأرجع الرجل اذا أهوى بيده الى.
  خلفه ليثناول شيئا قال أبوذؤيب
  فبد اله أقراب هذا رابنا * عجلافعيث فى الكانة يرجع
  وحكى ابن السكيت هذامتاع مر جع أى له مرجوع ويقال أرجع اللّٰه بيعة فلان كما يقسال
  أربح اللّٰه بيعته الكسائى أرجعت الابل اذا هزات ثم معنت والمراجعة المعاودة يقال
  رابعه الكلام وراجع امر أنه وتراجع الشى الى خلف واسترجعت منه الشىء اذا أخذت
  منه مادفعته اليه واسترجعت عند المصيبة اذاقلت انالله وانا اليه راجعون فانامسترجع
  وكذلك الترجيع قال جرير
  ورجعت من عرفان داركانها * بقية وشم فى منون الاشاجع
  والترجيع فى الاذان ١ ترجيع الصوت ترديده فى الحلق كقسراءة أصحاب الالحمان
  وترجيع الداية يديها فى السير وترجيع الواشمة وشمها ورجع السكف ومرجعها أسفلها
  ⁦( ردع)⁩ ردعته عن الشئ أرد عهرد عافار تدع أى كففته ذكف وبه ردع من زعفران
  أودم أى لطخ وأثر وردعته بالشئ فارتدع أى لملخته به قتلطخ وصنه قول ابن مقبل
  يخدى بهابازل قتل مرافقه * يجرى بديبا جتيه الرشح من تدع ٢
  ويقال للقسيل ركب رد عه اذاخرلوجهه على دمه وارداع بالضم النكس ويقال وجع الجسد
  أجمع قال الشاعر ⁦(مجنون بن عامر)⁩
  صفرا من برالجوا. كانما • زلالحيا بهارداع سقيم
  وقال آخر (ق س بن ذريح
  فواحزنا وعاودنى رداعى * وكان فراق لبنى كالخداع
  والمردوع المنكوس وقد ردع والرداع بالكسراسم ماءقال عنترة
  بركت على جنب الرداع كأنما * بركت على قصب أجش مهضم
  والمرتدع من الهام الذى اذا أصاب اله-دف انفضخ عوده عن أبى عبيد والرديع
  السهم الذى سقط نصله ⁦(رسع)⁩ الرسع فساد ف الأجفان وقد رسع الرجل فهو أرسع
  وفيه لغة أخرى رسع الرجسل ترسبعافهو مرسع ومرسعة وقد رسمت عينه أيضا ترسيعا
  قال امر ؤالقيس
