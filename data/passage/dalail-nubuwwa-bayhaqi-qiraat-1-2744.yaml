text: "… : إن جبريل أتاني، فقال : اقرؤا القرآن على سبعة أحرف، كلَّ شافٍ كافٍ. هوابي بن كعب بن قيس بن عبيد بن زيد بن معاوية بن عمرو بن مالك بن النجار سيد القراء، أبو منذر الأنصاري البخاري المدني المقرىء البدري. …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2744، يذكر الأحرف السبعة، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 2744, that mentions the seven ahruf, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2744 کا اقتباس جس میں سبعہ احرف، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 2744, que menciona a los siete ahruf, los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Dala'il al-Nubuwwa d'al-Bayhaqi (tome 1, p. 2744) mentionne les sept ahruf, les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Beyhakî'nin \"Dala'il al-Nubuwwah\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 2744. sayfasından, yedi farklı okuma şeklini ve farklı okunuşlarını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi \"Dala'il al-Nubuwwah\" (Bukti Kenabian), Jilid 1, halaman 2744, yang menyebutkan tujuh cara membaca dan berbagai bacaan; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
