label: { ar: "الموطأ 748 — مالك: ما أخرجت زكاته من الثمار ثم أمسكه صاحبه سنين ثم باعه فلا زكاة في ثمنه حتى يحول الحول، إلا أن يكون للتجارة", en: "Muwatta 748", es: "Muwatta 748", fr: "Muwatta 748", ur: "موطا 748", tr: "El-Muvatta 748 — Malik: Meyvelerden zekât ödenirse ve sahibi onları yıllarca saklayıp sonra satarsa, ticaret amacıyla satılmadığı sürece, bir yıl geçmeden fiyatından zekât alınmaz.", id: "Al-Muwatta 748 — Malik: Jika zakat dibayarkan atas buah-buahan, dan kemudian pemiliknya menyimpan buah-buahan tersebut selama bertahun-tahun lalu menjualnya, maka tidak ada zakat yang wajib dibayarkan atas harga jualnya sampai setahun berlalu, kecuali jika untuk perdagangan." }
summary:
  ar: "قول لمالك: السنة عندنا أن كل ما أُخرجت زكاته من الحنطة والتمر والزبيب والحبوب كلها، ثم أمسكه صاحبه بعد أداء صدقته سنين ثم باعه، أنه ليس عليه في ثمنه زكاة حتى يحول على ثمنه الحول من يوم باعه، إذا كان أصل تلك الأصناف من فائدة أو غيرها ولم يكن للتجارة، كالطعام والعروض يفيدها الرجل ثم يمسكها سنين ثم يبيعها بذهب أو ورق؛ فإن كان أصل تلك العروض للتجارة فعلى صاحبها فيها الزكاة حين يبيعها إذا كان قد حبسها سنة من يوم زكى المال الذي ابتاعها به. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.371} {cite:muwatta-maruf-1997 p.372}"
  tr: "Malik şöyle demiştir: Bizim yerleşik uygulamamız şudur ki, zekâtı ödenmiş olan buğday, hurma, kuru üzüm ve tüm tahılların sahibi, zekâtı ödedikten sonra bunları yıllarca saklayıp satarsa, sattığı günden itibaren bir yıl geçmeden zekât ödemekle yükümlü değildir. Bu, söz konusu malların kaynağının kâr veya başka bir şey olması ve ticarete konu olmaması durumunda geçerlidir; örneğin, bir kişinin kâr elde etmek için yıllarca sakladığı ve daha sonra altın veya gümüş karşılığında sattığı yiyecek ve mallar gibi. Ancak, söz konusu malların kaynağı ticarete konu ise, sahibi, zekâtı ödediği parayla satın aldığı malları sattığında, zekâtını ödediği günden itibaren bir yıl boyunca saklamışsa zekât ödemekle yükümlüdür. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.371} {cite:muwatta-maruf-1997 s.372}"
  id: "Malik berkata: Praktik yang telah mapan di antara kita adalah bahwa gandum, kurma, kismis, dan semua biji-bijian yang telah dizakati, dan kemudian pemiliknya menyimpannya selama bertahun-tahun setelah membayar zakat dan kemudian menjualnya, ia tidak wajib membayar zakat atas hasil penjualan tersebut sampai setahun berlalu sejak hari ia menjualnya. Ini berlaku jika asal barang-barang tersebut berasal dari keuntungan atau hal lain dan bukan untuk perdagangan, seperti makanan dan barang-barang yang menghasilkan keuntungan bagi seseorang, kemudian disimpan selama bertahun-tahun dan kemudian dijual dengan emas atau perak. Namun, jika asal barang-barang tersebut adalah untuk perdagangan, maka pemiliknya wajib membayar zakat atas barang-barang tersebut ketika ia menjualnya jika ia telah menyimpannya selama setahun sejak hari ia membayar zakat atas uang yang digunakan untuk membelinya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.371} {cite:muwatta-maruf-1997 p.372}"
