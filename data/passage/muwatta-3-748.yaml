label: { ar: "الموطأ 748 — مالك: ما أخرجت زكاته من الثمار ثم أمسكه صاحبه سنين ثم باعه فلا زكاة في ثمنه حتى يحول الحول، إلا أن يكون للتجارة", en: "Muwatta 748" }
summary:
  ar: "قول لمالك: السنة عندنا أن كل ما أُخرجت زكاته من الحنطة والتمر والزبيب والحبوب كلها، ثم أمسكه صاحبه بعد أداء صدقته سنين ثم باعه، أنه ليس عليه في ثمنه زكاة حتى يحول على ثمنه الحول من يوم باعه، إذا كان أصل تلك الأصناف من فائدة أو غيرها ولم يكن للتجارة، كالطعام والعروض يفيدها الرجل ثم يمسكها سنين ثم يبيعها بذهب أو ورق؛ فإن كان أصل تلك العروض للتجارة فعلى صاحبها فيها الزكاة حين يبيعها إذا كان قد حبسها سنة من يوم زكى المال الذي ابتاعها به. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.371} {cite:muwatta-maruf-1997 p.372}"
