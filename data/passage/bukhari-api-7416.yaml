label: { ar: "صحيح البخاري 7416 — ما حُرّم", en: "Sahih al-Bukhari 7416 — what was made unlawful", ur: "صحیح بخاری 7416 — جو حرام کیا گیا", es: "Sahih al-Bukhari 7416 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 7416 — ce qui a été déclaré illicite", tr: "Sahih el-Buhari 7416 — Haram Olan Şeyler", id: "Sahih al-Bukhari 7416 — Apa yang dilarang" }
text: "… رَسُولَ اللَّهِ فَقَالَ \" تَعْجَبُونَ مِنْ غَيْرَةِ سَعْدٍ، وَاللَّهِ لأَنَا أَغْيَرُ مِنْهُ، وَاللَّهُ أَغْيَرُ مِنِّي، وَمِنْ أَجْلِ غَيْرَةِ اللَّهِ حَرَّمَ الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ، وَلاَ أَحَدَ أَحَبُّ إِلَيْهِ الْعُذْرُ مِنَ اللَّهِ، وَمِنْ أَجْلِ ذَلِكَ بَعَثَ الْمُبَشِّرِينَ وَالْمُنْذِرِينَ وَلاَ أَحَدَ أَحَبُّ إِلَيْهِ الْمِدْحَةُ مِنَ اللَّهِ وَمِنْ أَجْلِ ذَلِكَ وَعَدَ اللَّهُ الْجَنَّةَ \". وَقَالَ عُبَيْدُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7416، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 7416 (Oneness, Uniqueness of Allah (Tawheed)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 7416، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7416 (Unicidad de Alá (Tawhid)), menciona lo que se ha prohibido. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 7416 (L'Unicité d'Allah (Tawhid)), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 7416 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7416, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
