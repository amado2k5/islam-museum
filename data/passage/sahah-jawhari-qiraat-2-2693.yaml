text: "… ومضر، ثم عاد إلى خراسان وتطرّق الدامغان، فأنزله أبو على الحسن ابن على - وهو من أعيان الكتّاب - عنده وأكرمه، وأخذ منه وسمع عنه، ثم مضى إلى نيسابور وأقام بها على التدريس والتأليف وتعليم الخط وكتابة المصاحف والدفاتر حتى …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 2، ص 2693، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 2, p. 2693, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الصحاح، جوہری، اسکین جلد 2، ص 2693 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
