text: "… ومضر، ثم عاد إلى خراسان وتطرّق الدامغان، فأنزله أبو على الحسن ابن على - وهو من أعيان الكتّاب - عنده وأكرمه، وأخذ منه وسمع عنه، ثم مضى إلى نيسابور وأقام بها على التدريس والتأليف وتعليم الخط وكتابة المصاحف والدفاتر حتى …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 2، ص 2693، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 2, p. 2693, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الصحاح، جوہری، اسکین جلد 2، ص 2693 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Sihah de al-Jawhari, volumen 2, pág. 2693, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Jawhari, al-Sihah (tome 2, p. 2693), mentionnant la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Cevheri'nin Sahih adlı eserinin 2. cildinin 2693. sayfasından alınan bu alıntı, Kur'an'ın derlenmesini ve el yazmalarını, ayrıca yazı ve lehçeyi ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, kaligrafi ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Sahih karya Al-Jawhari, Volume 2, halaman 2693, membahas penyusunan Al-Qur'an dan manuskripnya, serta aksara dan tulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
