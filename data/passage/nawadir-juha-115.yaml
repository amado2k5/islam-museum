text: "… ذلك ذنب أذني الطويلة كان حمزة المدَّعي أنَّهُ عارف كاملٌ وسالِكٌ واصِلٌ، مِنَ الدراويشِ، فسألَ جحا قائلاً : أيُّها الشيخُ أما لك صنعةٌ في هذا الكونِ سوى الهذر والمُزاح؟ فإِنْ كانَ لديك معرفة أَبرزْها، وإنْ كان لديك شيءٌ مِنَ الكمال …"
summary:
  ar: "تباهى درويش اسمه حمزة بأنه يطير كل ليلة إلى السماء الأولى، فسأله جحا هل أحسّ بشيء كالمروحة يمسّ وجهه، فقال نعم، فقال جحا إنه ذنب أذنه الطويلة. {cite:juha-nawadir-kubra-djuwaydi p. 55}"
  en: "A dervish named Hamza boasts of flying every night to the first heaven; Juha asks whether he felt something like a fan brush his face; he says yes, and Juha says that was the tail of his long ear. {cite:juha-nawadir-kubra-djuwaydi p. 55}"
  ur: "حمزہ نامی ایک درویش نے فخر کیا کہ وہ ہر رات پہلے آسمان تک اڑتا ہے؛ جحا نے پوچھا کہ کیا اسے چہرے پر پنکھے جیسی کوئی چیز لگتی محسوس ہوئی؛ اس نے کہا ہاں، تو جحا بولا کہ وہ اس کے لمبے کان کی دم تھی۔ {cite:juha-nawadir-kubra-djuwaydi p. 55}"
  fr: "Un derviche nommé Hamza se vante de voler chaque nuit jusqu'au premier ciel; Juha lui demande s'il a senti quelque chose comme un éventail lui effleurer le visage; il répond que oui, et Juha dit que c'était le bout de sa longue oreille. {cite:juha-nawadir-kubra-djuwaydi p. 55}"
  es: "Un derviche llamado Hamza presume de volar cada noche hasta el primer cielo; Juha le pregunta si sintió algo como un abanico rozándole el rostro; él dice que sí, y Juha dice que era la punta de su larga oreja. {cite:juha-nawadir-kubra-djuwaydi p. 55}"
