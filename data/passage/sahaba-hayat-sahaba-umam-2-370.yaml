text: "… امية وجعلت تشير عليه ان يهاجر الى غيره، فواجر بأهله و ماله مكتتما من قريش حتى قدم المدينة على رسول اللّٰه. فوِئب ابو سفيان بن حرب فباع داره بمكة، فرّ بها بعد ذلك ابو جهل بن هشام و عتّبة إى …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 370، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
