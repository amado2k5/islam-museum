text: "… بالمرأة الزانية أو المرأة العفيفة بالرجل الزانى، فذهب جمهور الفقهاء إلى أن زنا الرجل لا يحرمه على المرأة العفيفة وأن زنا المرأة لا يحرمها على الرجل العفيف، وذهب الحنابلة إلى أنه إذا زنت المرأة لم يحل لمن يعلم ذلك نكاحها …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 1، ص 167، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
