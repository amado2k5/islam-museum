ref: "1700"
label: { ar: "صحيح البخاري 1700 — ما حُرّم", en: "Sahih al-Bukhari 1700 — what was made unlawful", ur: "صحیح بخاری 1700 — جو حرام کیا گیا", es: "Sahih al-Bukhari 1700 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 1700 — ce qui a été déclaré illicite" }
text: "… زِيَادَ بْنَ أَبِي سُفْيَانَ كَتَبَ إِلَى عَائِشَةَا ـ إِنَّ عَبْدَ اللَّهِ بْنَ عَبَّاسٍما ـ قَالَ مَنْ أَهْدَى هَدْيًا حَرُمَ عَلَيْهِ مَا يَحْرُمُ عَلَى الْحَاجِّ حَتَّى يُنْحَرَ هَدْيُهُ. قَالَتْ عَمْرَةُ فَقَالَتْ عَائِشَةُا ـ لَيْسَ كَمَا قَالَ ابْنُ عَبَّاسٍ، أَنَا فَتَلْتُ قَلاَئِدَ هَدْىِ رَسُولِ اللَّهِ بِيَدَىَّ، ثُمَّ قَلَّدَهَا رَسُولُ اللَّهِ بِيَدَيْهِ، ثُمَّ بَعَثَ بِهَا مَعَ أَبِي فَلَمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1700، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1700 (Hajj (Pilgrimage)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1700، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1700 (Hajj (Peregrinación)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1700 (Hajj (Pèlerinage)), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
