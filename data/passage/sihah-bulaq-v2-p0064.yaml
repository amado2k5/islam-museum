text: |-
  •⁦(باب الواو والياء)⁩
  ٥٢٣
  الانياء يو متذورجل عمىّ القلب أى جاهل وامرأة عمية عن الصواب وعمية القلب على فعلة
  وقوم عمون وفيهسم عميتهم أى جهلهم والنسبة الى أعمى أعموى والى عم عموى كما قلناه فى
  شجوى والاعميان السبل والجل الهائج الصول وعمى الموج بالفتح يعمى عميا اذارمى القذى
  والزبدوعيت معنى البيت تعمية ومنه المعمى من الشعر وقرى فعميت عليكم بالتشديد
  أبوذيد تركناهم عمى اذا أشرفواعلى الموت والعماء ممدود السحاب قال أبوز يدهوشبه
  الدحار يركب رؤس الجبال وعماية جبل من جبال هذيل والمعامى من الارضين الاغفال
  التى ليس به، أثر عمارة ولا معلم وهى الاعماء أيضا قال رؤية
  وبلدعامة أعماؤه • كان لون أرضم سماؤه
  يريدورب بلد ويقال أتيته مكة عىّ أى وقت الهاجرة وهو تصغير أهى مرنها ويقال
  هواسم رجل من العمالقة أغار على قوم ظهرافاسة أصلهم قنسب الوقت اليه واعتميت الشئ
  اخترته وهو قاب الاعتيام وقواهم ما أعماه اغايرادبه ما أعمى قلبه لانّ ذلك يغسب اليه الكثير
  الضلال ولا يقال فى عمى العيون ما أعماه لان مالا يتزدلا يتعجب...( ما عنا يعنو
  خضع وذلّ وأعناه غيره ومنه قوله تعالى وعنت الوجوه للمحىّ القيوم ويقال أيضاعنا فيهم
  فلان أسيرا أى أقام فيهم على اساره واحتبس وعناه غيره تعنه حبسه وأسره والعانى الاسير
  وقوم عماة ونسوة)ءوان وعنت به أمورنزات وعنوت الشى أخرجته وأظهرته قال ابن
  السكيت عنت الارض بالتبات تعنوعنوا وتعق أيضامن الكسائى اذاظهرنيتها يقال
  لم تعن يلادنابشى ولم تعن اذالم تثبت شيأ قال ذوالرمة
  ولم يبق بالخاصاء ماءنت به • من الرطب الايبسها وهجيرها
  وما أعنت الأرض شأ أى ما أنبتت وقال عدىّ بن زيد
  ويأكان ما أعنى الولى فسلم يلت • كأن بحافاة النها. المزارعا
  قوله فلم يلت أى لم ينقص منه شيأ وعنيت بالقول كذا أى أردت وقصدت ومعنى الكلام
  ومعناته واحدتق ول عرفت ذلك فى معنى كلامه وفى معناة كلامه وفى معنى كالمه أى فحوا.
  والعنية على فعيلة بول البعير يعقد فى الشمس يطلى به الاجرب عن أبى عمرو وفى المثل العنية
  -فى الجرب ويقال عنيت البعيرتعنية اذاطليته بها وعنى الانسان بالكسرعفاء أى تهب
  ونصب وعنيته أنا تعنية وتعنته أيضافتعنى وعنيت بهاجتك أعنى بهاعضاية وأنابه ما معف
  على مفعول واذا أمرت ممدقات لتعن مجماجتى وفى الحديث من حسن اسلام المرهتركه
  مالا يعنيه أى مالايهمه والدم العانى هو السائل والاعفاء الجوانب والنواحى واحدها
  عنو بالكسر وقال ابن الاعرابة واحدها عنامصورا قال ابن مقبل
  لا تحرزالمرأعنا البلادولا * قبنى له فى السموات السسلاليم
  ويروى أحجاء وجاءنا أعناء من الناس واحدهم عنو بالس سروهم قوم من قبائل شتى
  وعنونت المكتاب وعلونته والاسم العنوان والعلوان والمعنى فى قول الوليد بن عقبة
  قطعت الدهر كالسدم المذنى • تهدرفدمشق فازيم
  هوالفحل اللتيم اذا هاج حبس فى العنة لانه يرغب عن فحلته ويقال أصله معتن من العنة
  فأبدل من احدى النونات ياء والمعنى فى قول الفرزدق
