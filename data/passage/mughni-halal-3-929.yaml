text: "… نَعَمْ، لا ب هُوَ عَلَى طَرِيقِ الاخْتِيَارِ؛ لأنَّهُ كُلَّمَا كَثُرَ الْحَلالُ بَعُدَ تَنَاوُلِ الْحَرّامِ، وَالْوَاجِبُ فِي الْمَوْضِعَيْنِ إخْرَاجُ قَدْرِ الْحَرَامِ، وَالْبَاقِي مُبَاحٌ لَهُ؟ وَهَذَا لَأَنْ تَحْرِيمَهُ لَمْ يَكُنْ لِتَحْرِيمٍ عَيْنِهِ، وَإِنْمَا حَرُمْ لِتَعَلِّقِ حَنْ غَيْرِوِ بِهِ، فَإِذَا أَخْرَجَ عِوَّضَهُ زَالَ …"
