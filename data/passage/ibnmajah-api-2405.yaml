label: { ar: "سنن ابن ماجه 2405 — بر الوالدين أو عقوقهما", en: "Sunan Ibn Majah 2405 — dutifulness to the parents or disobedience to them", ur: "سنن ابن ماجہ 2405 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Ibn Majah 2405 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan Ibn Majah 2405 — le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan İbn Majah 2405 — Anne babaya iyilik mi, yoksa onlara itaatsizlik mi?", id: "Sunan Ibn Majah 2405 — Berbuat baik kepada orang tua atau durhaka kepada mereka" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، وَالْحَسَنُ بْنُ عَرَفَةَ، قَالاَ حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَيَّاشٍ، حَدَّثَنِي شُرَحْبِيلُ بْنُ مُسْلِمٍ الْخَوْلاَنِيُّ، قَالَ سَمِعْتُ أَبَا أُمَامَةَ الْبَاهِلِيَّ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" الزَّعِيمُ غَارِمٌ وَالدَّيْنُ مَقْضِيٌّ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2405، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2405 (The Chapters on Charity), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2405، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2405 (Los capítulos sobre la caridad), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2405 (Les chapitres sur la charité), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "İbn Majah'ın Sünen'inde yer alan 2405 numaralı hadiste, anne babaya saygı göstermek veya göstermemek konusu ele alınmaktadır. Bu hadis, \"İslam'da Anne Babalık\" tarayıcısı tarafından Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2405, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Hadits ini dikumpulkan oleh peramban \"Kekeluargaan dalam Islam\" bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
