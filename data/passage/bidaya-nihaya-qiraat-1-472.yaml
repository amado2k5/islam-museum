text: "… القعدة ودفن بمقابر الباب الصغير وله خمس وستون سنة. الشيخ تقي الدين الموصلي أبو بكر بن أيي الكرم شيخ القراءة عند محراب الصحابة، وشيخ ميعاد ابن عامر مدة طويلة وقد انتفع الناس به نحواً من خمسين سنة في التلقين والقراءات، …"
summary:
