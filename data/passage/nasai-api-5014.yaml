label: { ar: "سنن النسائي 5014 — ما لا يتم الإيمان إلا به", en: "Sunan al-Nasa'i 5014 — what faith is not complete without", ur: "سنن نسائی 5014 — جس کے بغیر ایمان مکمل نہیں", es: "Sunan al-Nasa'i 5014 — lo que la fe no está completa sin", fr: "Sunan al-Nasa'i 5014 — ce sans quoi la foi n'est pas complète", tr: "Sunan an-Nasa'i 5014 — İmanın onsuz tamamlanamayacağı şey", id: "Sunan an-Nasa'i 5014 — Sesuatu yang tanpanya iman tidak sempurna" }
text: "أَخْبَرَنَا الْحُسَيْنُ بْنُ حُرَيْثٍ قَالَ أَنْبَأَنَا إِسْمَعِيلُ عَنْ عَبْدِ الْعَزِيزِ ح وَأَنْبَأَنَا عِمْرَانُ بْنُ مُوسَى قَالَ حَدَّثَنَا عَبْدُ الْوَارِثِ قَالَ حَدَّثَنَا عَبْدُ الْعَزِيزِ عَنْ أَنَسٍ قَالَ قَالَ رَسُولُ اللَّهِ لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ مَالِهِ وَأَهْلِهِ وَالنَّاسِ أَجْمَعِينَ"
summary:
  ar: "حديث في سنن النسائي، رقم 5014، يذكر ما لا يتم الإيمان إلا به. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5014 (The Book Of Faith and its Signs), that mentions what faith is not complete without. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5014، جس میں جس کے بغیر ایمان مکمل نہیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5014 (El Libro de la Fe y sus Signos), menciona aquello sin lo cual la fe no está completa. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5014 (Le Livre de la Foi et ses Signes), mentionne ce qui est indispensable à une foi complète. Le moteur de recherche « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sunan-ı Nesai'de yer alan 5014 numaralı hadiste, imanın onsuz eksik kalacağından bahsedilir. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde ele alan bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5014, menyebutkan bahwa tanpanya iman menjadi tidak sempurna. Hadits ini disusun oleh seorang peneliti yang membahas rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
