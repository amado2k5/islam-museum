text: "… مُحَمَّدُ بْنُ جَعْفَرٍ، عَنْ شُعْبَةَ، عَنْ قَتَادَةَ، عَنْ مُطَرِّفٍ، قَالَ بَعَثَ إِلَىَّ عِمْرَانُ بْنُ حُصَيْنٍ فِي مَرَضِهِ الَّذِي تُوُفِّيَ فِيهِ فَقَالَ إِنِّي كُنْتُ مُحَدِّثَكَ بِأَحَادِيثَ لَعَلَّ اللَّهَ أَنْ يَنْفَعَكَ بِهَا بَعْدِي فَإِنْ عِشْتُ فَاكْتُمْ عَنِّي وَإِنْ مُتُّ فَحَدِّثْ بِهَا إِنْ شِئْتَ إِنَّهُ قَدْ سُلِّمَ عَلَىَّ وَاعْلَمْ أَنَّ نَبِيَّ اللَّهِ قَدْ جَمَعَ بَيْنَ حَجٍّ وَعُمْرَةٍ ثُمَّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2976، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2976 (The Book of Pilgrimage), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2976، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 2976 (El Libro de la Peregrinación), menciona la enfermedad del Profeta, así como a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 2976 (Livre du pèlerinage), mentionne la maladie du Prophète, la maladie et les malades. Le dictionnaire médical le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 2976 numaralı hadis, Peygamberimizin hastalığını, hastalığın kendisini ve hastayı anlatmaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2976, menyebutkan penyakit Nabi, penyakit itu sendiri, dan pasiennya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
