text: "… مُحَمَّدُ بْنُ جَعْفَرٍ، عَنْ شُعْبَةَ، عَنْ قَتَادَةَ، عَنْ مُطَرِّفٍ، قَالَ بَعَثَ إِلَىَّ عِمْرَانُ بْنُ حُصَيْنٍ فِي مَرَضِهِ الَّذِي تُوُفِّيَ فِيهِ فَقَالَ إِنِّي كُنْتُ مُحَدِّثَكَ بِأَحَادِيثَ لَعَلَّ اللَّهَ أَنْ يَنْفَعَكَ بِهَا بَعْدِي فَإِنْ عِشْتُ فَاكْتُمْ عَنِّي وَإِنْ مُتُّ فَحَدِّثْ بِهَا إِنْ شِئْتَ إِنَّهُ قَدْ سُلِّمَ عَلَىَّ وَاعْلَمْ أَنَّ نَبِيَّ اللَّهِ قَدْ جَمَعَ بَيْنَ حَجٍّ وَعُمْرَةٍ ثُمَّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2976، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2976 (The Book of Pilgrimage), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2976، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
