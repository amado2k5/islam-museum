text: "… نفي الريب عنهن في المستقبل، ولأن اللّٰه إنما كذب المنافقين لم يكذب غيرهم، وهؤلاء لم يكذبهم ولكن قال لم تؤمنوا كما قال لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه وقوله: لا يزني الزاني حين يزني وهو مؤمن، ولا …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 212، يذكر ما لا يتم الإيمان إلا به، وما يرتفع معه الإيمان حين الفعل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
