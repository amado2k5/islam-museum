text: "… نفي الريب عنهن في المستقبل، ولأن اللّٰه إنما كذب المنافقين لم يكذب غيرهم، وهؤلاء لم يكذبهم ولكن قال لم تؤمنوا كما قال لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه وقوله: لا يزني الزاني حين يزني وهو مؤمن، ولا …"
summary:
