label: { ar: "جامع الترمذي 2949 — كتاب القراءات، قراءات القرآن", en: "Jami' al-Tirmidhi 2949 — the Book of the Readings; the readings of the Qur'an", ur: "جامع ترمذی 2949 — کتاب القراءات، قرآن کی قراءتیں", es: "Jami' al-Tirmidhi 2949 — El Libro de las Lecturas; las lecturas del Corán", fr: "Jami' al-Tirmidhi 2949 — le Livre des lectures; les lectures du Coran" }
text: "… بْنُ شُمَيْلٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ يَزِيدَ بْنِ عَبْدِ اللَّهِ بْنِ الشِّخِّيرِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، أَنَّ النَّبِيَّ قَالَ \" لَمْ يَفْقَهْ مَنْ قَرَأَ الْقُرْآنَ فِي أَقَلَّ مِنْ ثَلاَثٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ حَدَّثَنَا شُعْبَةُ، بِهَذَا الإِسْنَادِ نَحْوَهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2949، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 2949 (Chapters on Recitation), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 2949، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2949 (Capítulos sobre la recitación), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2949 (Chapitres sur la récitation), mentionne les lectures du Coran. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
