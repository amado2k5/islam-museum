text: "… وللأبناء، وساوَيْنَا بين الكلِّ في أصل الميراث علىٰ خلاف ما كان عليه الأمر في الجاهليَّة، وعلىٰ خلاف ما كان عليه الأمر في ابتداء الإسلام من كون المال للولد وللأبوين الوصية، كما تقدم عن ابن عبَّاس، إنما نسخ اللّه ذلك إلىٰ …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 1226، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 1226, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 1226 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
