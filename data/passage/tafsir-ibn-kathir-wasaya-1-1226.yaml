  fr: "Extrait du Tafsir d'Ibn Kathir (tome 1, p. 1226) mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire Testaments Browser."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 1226. sayfasından, vasiyetname veya kesin miras belgesinden ve geride bıraktığı mal varlığı ve mirastan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Tafsir Ibn Kathir, Jilid 1, halaman 1226, yang menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkannya berupa harta warisan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Shrines Browser."
