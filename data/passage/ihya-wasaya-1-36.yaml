  fr: "Extrait du livre Ihya' 'Ulum al-Din d'al-Ghazali (tome 1, page 36) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le navigateur Testaments Browser."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 1. cildinin 36. sayfasından bir alıntıda, mezar, türbe ve kutsal mekandan bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, vasiyetnameler, miraslar, tarihi eserler ve kutsal mekanlar araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 1, halaman 36, menyebutkan tentang pemakaman, kuburan, dan makam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
