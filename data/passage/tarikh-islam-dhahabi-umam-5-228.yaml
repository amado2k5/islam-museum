text: "… قد مضى ذلك وغَلَبَتْهم فارس، ثم غلبتهم الروم بعد ذلك، ولقي نبيّ اللّٰه مشركي العرب، والتقت الروم وفارس، فنصر اللّه الّبيّ وَلِ لى المشركين، ونُصِر الرُّومُ على مُشْرِكي العجم، ففرح المؤمنون بنصر اللّٰه إيّاهم، ونصْر أهل الكتاب. قال عطيّة : …"
