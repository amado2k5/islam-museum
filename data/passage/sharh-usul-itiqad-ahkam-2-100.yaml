text: "… أحسن الله عاقبتك، ودفع عنك كلّ مَكروهٍ ومحذورٍ. الذي كُنا نسمعُ، وأدركنا عليه مَنْ أدركنا مِن أهلِ العلمِ؛ أنهم كانوا يكرهون الكلام، والخوض مع أهلِ الزَّيغِ وإنما الأمر في التسَليم، والانتهاء إلى مَا في كتابِ اللّٰه جلّ وعزَّ، أو سُنة …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 2، ص 100، يرد فيه ذكر المكروه، وما كان يُكره، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 2, p. 100, whose wording mentions the disliked (makruh), what used to be disliked, what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 2، ص 100 کا اقتباس جس میں مکروہ، جو ناپسند کیا جاتا تھا، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volume numérisé 2, p. 100, dont le texte mentionne le réprouvé (makruh), ce qui était réprouvé, ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen digitalizado 2, p. 100, cuyo texto menciona lo reprobado (makruh), lo que se reprobaba, lo que los juristas reprobaron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 2. cildinin 100. sayfasından bir alıntı, mekruh sayılan, mekruh sayılmış olan, fıkıhçıların mekruh saydığı ve mekruh sayılan şeylerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu alıntı, farz olan ameller, itaat amelleri, tavsiye edilen ameller, mekruh sayılan ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar keyakinan Sunni, jilid 2, halaman 100, menyebutkan apa yang tidak disukai, apa yang dulu tidak disukai, apa yang tidak disukai oleh para ahli hukum, dan apa yang tidak disukai saat ini. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
