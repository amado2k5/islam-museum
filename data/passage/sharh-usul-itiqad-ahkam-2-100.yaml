text: "… أحسن الله عاقبتك، ودفع عنك كلّ مَكروهٍ ومحذورٍ. الذي كُنا نسمعُ، وأدركنا عليه مَنْ أدركنا مِن أهلِ العلمِ؛ أنهم كانوا يكرهون الكلام، والخوض مع أهلِ الزَّيغِ وإنما الأمر في التسَليم، والانتهاء إلى مَا في كتابِ اللّٰه جلّ وعزَّ، أو سُنة …"
summary:
