text: "دا، ووقف آالراآع يسمع آلامه . وإذا آلم أحدهم السلطان، فرد عليه جوابه، آشف ثيابه عن ظهره، ورمى بالتراب على رأسه وظهره، آما يفعل المغتسل بالماء، وآنت أعجب منهم، آيف لا تعمى أعينهم . وإذا تكلم السلطان في مجلسه بكلام،"
