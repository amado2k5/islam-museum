  en: "Sunan al-Nasa'i, Book 15: The Book of Shortening the Prayer When Traveling"
  ur: "سنن نسائی، کتاب تقصیر الصلاۃ فی السفر"
  es: "Sunan al-Nasa'i, Libro 15: El libro sobre cómo acortar la oración al viajar"
summary:
  ar: "القسم 15 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب تقصير الصلاة في السفر»، ويضم فيها النصوص من 1433 إلى 1458 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 15 of Sunan al-Nasa'i (The Book of Shortening the Prayer When Traveling) in the division of the open hadith dataset the museum took its reports from: reports 1433 to 1458 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 15، عنوان «کتاب تقصیر الصلاۃ فی السفر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1433 تا 1458۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 15 de Sunan al-Nasa'i (El libro de la reducción de la oración al viajar) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1433 al 1458 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
