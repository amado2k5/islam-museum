text: "… أبكي على المرحومة أمِّك جلس مع زوجته لتناول الطعام فأخذت قبله ملعقةً من الشورباء وكانت حارّة جداً فدمَعَتْ عيناها، فسألها عن سببِ بكائِها، فقالت: تذكِّرْتُ المرحومةَ أمي فإنها كانت تُحِبُّ هذا النوعَ مِنَ الشورباءِ. ولكنْ جحا ما كاد يبتلعُ ما …"
summary:
  ar: "بكت زوجة جحا من الحساء الحار على المائدة وقالت إنها تذكّر أمها الراحلة التي كانت تحبه، فبكى جحا أيضًا وقال إنه يبكي على أمها التي تركت ابنتها له. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  en: "At a meal Juha's wife cries from the hot soup, saying she remembers her late mother who loved it; then Juha weeps too, saying he mourns her mother who left his wife to him. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  ur: "کھانے پر جحا کی بیوی گرم شوربے سے رو پڑی اور کہا کہ اسے اپنی مرحومہ ماں یاد آ گئی جسے یہ پسند تھا؛ پھر جحا بھی رونے لگا اور کہا کہ میں اس کی ماں پر رو رہا ہوں جو اپنی بیٹی مجھ پر چھوڑ گئی۔ {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  fr: "Au repas, la femme de Juha pleure à cause de la soupe brûlante, disant qu'elle se souvient de sa mère défunte qui l'aimait ; Juha pleure alors aussi, disant qu'il pleure sa belle-mère, qui lui a laissé sa fille. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  es: "En una comida, la mujer de Juha llora por la sopa caliente, diciendo que recuerda a su difunta madre, a quien le gustaba; entonces Juha también llora, diciendo que llora a la madre de ella, que le dejó a su hija. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
