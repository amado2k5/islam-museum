label: { ar: "نوادر جحا الكبرى، ص 167 — «إذا كان إمامه تيمور لنك فنبيه جنكيز»", en: "Nawadir Juha al-Kubra, p. 167 — 'If His Imam Is Timur the Lame, His Prophet Is Genghis'", ur: "نوادر جحا الکبریٰ، ص 167 — «اگر اس کا امام تیمور لنگ ہے تو اس کا نبی چنگیز ہوگا»", fr: "Nawadir Juha al-Kubra, p. 167 — « Si son imam est Timur le Boiteux, son prophète est Gengis »", es: "Nawadir Juha al-Kubra, p. 167 — «Si su imán es Timur el Cojo, su profeta es Gengis»", tr: "Cuha'nın Büyük Fıkraları, s. 167 — “Eğer imamı Timur Lenk ise, peygamberi de Cengiz Han'dır.”", id: "Anekdot Hebat Juha, hlm. 167 — “Jika imamnya adalah Timur Lenk, maka nabinya adalah Genghis Khan.”" }
text: "… إذا كان إمامه تيمور لنك فنبيّه جنكيز سأل يوماً أحد جماعة تيمورلنك : ما مذهبك؟ فأجابه الرجل بعد أن وضع يده على صدره متذللاً الأمير تيمور كور كان. فقال بعض الحاضرين: اسأله يا سيّدي مَن نبيّه؟ فقال جحا: لماذا أسأله، …"
summary:
  ar: "سُئل أحد أتباع تيمور لنك عن عقيدته، فقال «الأمير تيمور لنك سلطاني» وانحنى، فقال جحا إن كان إمامه تيمور لنك فنبيه جنكيز سفاك الدماء. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  en: "Asked what his creed is, a follower of Timur says 'Amir Timur is my sultan' and bows; Juha says if his imam is Timur the Lame, then his prophet must be Genghis, the bloody one. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  ur: "تیمور لنگ کے ایک پیروکار سے اس کے عقیدے کے بارے میں پوچھا گیا تو اس نے کہا «امیر تیمور لنگ میرا سلطان ہے» اور جھک گیا، جحا نے کہا کہ اگر اس کا امام تیمور لنگ ہے تو اس کا نبی خونریز چنگیز ہوگا۔ {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  fr: "Interrogé sur son credo, un partisan de Timur dit : « L'émir Timur est mon sultan » et s'incline ; Juha dit que si son imam est Timur le Boiteux, son prophète doit être Gengis, le sanguinaire. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  es: "Al preguntarle cuál es su credo, un seguidor de Timur dice: «El emir Timur es mi sultán» y se inclina; Juha dice que si su imán es Timur el Cojo, su profeta ha de ser Gengis, el sanguinario. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  tr: "Timur'un takipçilerinden birine inançları sorulduğunda, \"Prens Timur benim Sultanımdır\" diye cevap verip eğildi. Bunun üzerine Cuha, \"Eğer imamı Timur ise, peygamberi de kana susamış Cengiz Han'dır\" diye belirtti. {cite:juha-nawadir-kubra-djuwaydi s. 167}"
  id: "Salah seorang pengikut Timur ditanya tentang keyakinannya, dan dia menjawab, \"Pangeran Timur adalah Sultan saya,\" dan membungkuk. Juha kemudian berkomentar, \"Jika Imamnya adalah Timur, maka Nabinya adalah Genghis Khan, si haus darah.\" {cite:juha-nawadir-kubra-djuwaydi p. 167}"
