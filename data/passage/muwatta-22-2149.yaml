label: { ar: "الموطأ 2149 — مالك: من استهلك شيئا من الطعام بغير إذن صاحبه، فإنما يرد على صاحبه مثل طعامه بمكيلته من صنفه، والطعام بمنزلة الذهب والفضة، ولا يرد من الذهب إلا الذهب، والحيوان ليس بمنزلة الذهب في ذلك، فرق بين ذلك السنة والعمل المعمول به", en: "Muwatta 2149", es: "Muwatta 2149", fr: "Muwatta 2149", ur: "موطا 2149", tr: "El-Muvatta 2149 — Malik: Sahibinin izni olmadan yiyecek tüketen kimse, aynı türden yiyeceğin aynı ölçüyle eşdeğerini sahibine iade etmelidir. Yiyecek altın ve gümüş gibidir; sadece altın iade edilebilir. Hayvanlar bu konuda altın gibi değildir. Bu, sünnet ve yerleşik uygulama ile farklıdır.", id: "Al-Muwatta 2149 — Malik: Barangsiapa memakan makanan tanpa izin pemiliknya, wajib mengembalikan kepada pemiliknya sejumlah makanan yang sama jenisnya, dengan takaran yang sama. Makanan itu seperti emas dan perak; hanya emas yang dapat dikembalikan. Hewan tidak seperti emas dalam hal ini. Terdapat perbedaan antara hal ini dengan Sunnah dan kebiasaan yang telah ditetapkan." }
summary:
  ar: "قال: وسمعت مالكا يقول: من استهلك شيئا من الطعام بغير إذن صاحبه، فإنما يرد على صاحبه مثل طعامه بمكيلته من صنفه. وإنما الطعام بمنزلة الذهب والفضة، إنما يرد من الذهب الذهب، ومن الفضة الفضة، وليس الحيوان بمنزلة الذهب في ذلك. فرق بين ذلك السنة والعمل المعمول به. {cite:muwatta-maruf-1997 p.278} {cite:muwatta-maruf-1997 p.279}"
  tr: "Şöyle dedi: Malik'in şöyle dediğini duydum: Sahibinin izni olmadan yiyecek tüketen kimse, sahibine aynı türden yiyeceğin eşdeğer bir miktarını iade etmelidir. Yiyecek altın ve gümüş gibidir; altın altına, gümüş gümüşe karşılık verilir. Hayvanlar bu konuda altın gibi değildir. Bu, yerleşik uygulamadan farklıdır. {cite:muwatta-maruf-1997 s.278} {cite:muwatta-maruf-1997 s.279}"
  id: "Dia berkata: Saya mendengar Malik berkata: Siapa pun yang mengonsumsi makanan tanpa izin pemiliknya harus mengembalikan kepada pemiliknya sejumlah makanan yang sama jumlahnya. Makanan itu seperti emas dan perak; emas dikembalikan dengan emas, dan perak dengan perak. Hewan tidak seperti emas dalam hal ini. Ada perbedaan antara ini dan praktik yang sudah mapan. {cite:muwatta-maruf-1997 p.278} {cite:muwatta-maruf-1997 p.279}"
