label: { ar: "الموطأ 2149 — مالك: من استهلك شيئا من الطعام بغير إذن صاحبه، فإنما يرد على صاحبه مثل طعامه بمكيلته من صنفه، والطعام بمنزلة الذهب والفضة، ولا يرد من الذهب إلا الذهب، والحيوان ليس بمنزلة الذهب في ذلك، فرق بين ذلك السنة والعمل المعمول به", en: "Muwatta 2149" }
summary:
  ar: "قال: وسمعت مالكا يقول: من استهلك شيئا من الطعام بغير إذن صاحبه، فإنما يرد على صاحبه مثل طعامه بمكيلته من صنفه. وإنما الطعام بمنزلة الذهب والفضة، إنما يرد من الذهب الذهب، ومن الفضة الفضة، وليس الحيوان بمنزلة الذهب في ذلك. فرق بين ذلك السنة والعمل المعمول به. {cite:muwatta-maruf-1997 p.278} {cite:muwatta-maruf-1997 p.279}"
