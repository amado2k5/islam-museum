text: "… خلاف بين ذلك، فمن أكل فيها، أو شرب ناسيًا، فلا قضاء عليه. ومن أكل أو شرب عامداً أفسد الصوم عليه، لا يختلف إلا فى وجوب الكفارة على من جامع فى رمضان، وسقوطها عمن جامع فى صوم غيره تطوعًا أو واجبًا. …"
summary:
  ar: "مقطع من الأم للشافعي، ص 162، يرد فيه ذكر الواجب، والوجوب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Umm, p. 162, whose wording mentions the obligatory (wajib), obligation (wujub), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الام، شافعی، ص 162 کا اقتباس جس میں واجب، وجوب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Umm de al-Shafi'i, p. 162, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Umm de al-Shafi'i, p. 162, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin El-Umm adlı eserinin 162. sayfasından, farz, zorunlu ve gönüllü amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz, zorunlu, müstehap, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Umm karya Al-Shafi'i, halaman 162, yang menyebutkan amalan wajib, yang harus dilakukan, dan yang dianjurkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks tersebut disusun oleh peramban untuk amalan wajib, yang harus dilakukan, yang dianjurkan, yang tidak disukai, yang dilarang, dan dosa-dosa kecil."
