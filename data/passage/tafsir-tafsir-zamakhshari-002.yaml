text: "م قل هاتوا رمنكم إن كنتم صدقين ٣. الضمير في (وقالوا) لأهل الكتاب من اليهود والنصاري، والمعنى: وقالت اليهود: لن يدخل الجنة إلا من كان هودا، وقالت النصارى: لن يدخل الجنة إلا من كان نصارى، فلف بين القولين ثقة بأن"
