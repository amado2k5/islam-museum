label: { ar: "موطأ مالك 814 — الأب والأبوة", en: "Muwatta Malik 814 — the father and fatherhood", ur: "موطأ مالک 814 — باپ اور والدیت" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ قَالَ قَالَ رَسُولُ اللَّهِ لِعَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ \" كَيْفَ صَنَعْتَ يَا أَبَا مُحَمَّدٍ فِي اسْتِلاَمِ الرُّكْنِ \". فَقَالَ عَبْدُ الرَّحْمَنِ اسْتَلَمْتُ وَتَرَكْتُ. فَقَالَ لَهُ رَسُولُ اللَّهِ \" أَصَبْتَ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 814، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 814 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 814، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
