text: "… : غَلَبَ. وأما سَبْحَة فمن سَبَح إذا علا عُلُوًّا فى اتساع مومنه : سُبْحَان اللّه، وسبحَاتُ اللهِ: عَظمتُه وعُلوُه، لأن الناظر المفكر فى الله سبحانه يَسْبَح فى بَحْرٍ لا ساحِل له، وقد ذكرنا فى معنى هذه لكلمةٍ حقائِقَ ودقائقَ أسرارٍ …"
