text: "صفة الصفوة ذِكرُ المصطَفَين من أهل البصرة - مالك بن دينار يكنى أبا يحيى؛ مولى لامرأة بني سامة بن لؤي، كان يكتب المصاحف. قال جعفر : سمعت مالك بن دينار يقول: ما تنعم المتنعمون بمثل ذكر اللّٰه تعالى. قال: وسمعته …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 645، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 645, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 645 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 1, pág. 645, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 1, p. 645) évoquant la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
