label: { ar: "الموطأ 1779 — محمد بن عبد الرحمن بن نوفل عن عروة بن الزبير عن عائشة عن جدامة بنت وهب: هم النبي أن ينهى عن الغيلة، ثم ذكر أن الروم وفارس يفعلونها فلا تضر أولادهم", en: "Muwatta 1779" }
text: "لَقَدْ هَمَمْتُ أنْ أنْهَى عَن الْغِيلَةِ"
summary:
  ar: "يروي مالك عن محمد بن عبد الرحمن بن نوفل أنه قال: أخبرني عروة بن الزبير عن عائشة أم المؤمنين، عن جدامة بنت وهب الأسدية، أنها أخبرتها أنها سمعت رسول الله يقول: لقد هممت أن أنهى عن الغيلة، حتى ذكرت أن الروم وفارس يصنعون ذلك، فلا يضر أولادهم. قال مالك: والغيلة أن يمس الرجل امرأته وهي ترضع. {cite:muwatta-maruf-1997 p.127}"
