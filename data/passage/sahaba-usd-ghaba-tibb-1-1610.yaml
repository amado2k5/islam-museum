text: "… جدته أُم أبيه: أنها غَزت مع النبي علله يوم خيبر سادسة ست نسوة، فبلغ النبي، فبعث إلينا فقال: بإذن من خَرجتُن؟ ورأينا فيه الغضب، فقلنا: خرجنا ومعنا دواء نداوي به الجرحى، ونناول السهام، ونسقي السَّويق، ونغزل الشعر، ونعين في سبيل …"
