text: "… فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه، ومن كان يؤمن بالله واليوم الآخر فليقل خيرا أو يسكت. كذا فى الكنز ج ص. وأخرج الطبرانى فى الأوسط عن عبد اللّه بن عمرما قال : خرج رسول اللّه فى …"
