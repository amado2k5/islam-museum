text: "… الي فنا اللّه تعالى عنه. قال قال رسول اللّٰه : ارخم أمتى بأمتى أبو بكر، وأشدها فى دين اللّٰه عمر، وأصدقها حياء عثمان، وأفرضهم زيد بن ثابت، وأقرأهم أبى، وأعلمهم بالحلال والحرام معاذ بن جبل، ولكل أمة أمين وأمين هذه …"
summary:
