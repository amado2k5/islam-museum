  fr: "Extrait du livre d'Ibn al-Athir, al-Kamil fi al-Tarikh (tome 1, p. 138), évoquant un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 1. cildinin 138. sayfasından, ölüm anı ve ölüme dair bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
