text: "… الأطباء أن يناولوه مسهلاً لأجل سنه فأشير بلبن الحليب، فتناوله فلانت الطبيعة قليلاً وأدى ذلك إلى نشاط.. وصار مسروراً بذلك، ولكنه لم يشف من مرضه تماماً... ثم عاد إلى الكتمان وتزايد الألم بالمعدة وكان يقول هذا بقايا الغبن من سنة …"
summary:
