  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 1, p. 112, that mentions medicine and the physician, illness and the sick, the organs of the body, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 1، ص 112 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، اعضائے بدن، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
