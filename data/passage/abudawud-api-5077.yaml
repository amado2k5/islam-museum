label: { ar: "سنن أبي داود 5077 — عدد الحسنات، كتابة الحسنات", en: "Sunan Abi Dawud 5077 — a stated number of good deeds; the writing of good deeds", ur: "سنن ابی داؤد 5077 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ كَانَ لَهُ عِدْلُ رَقَبَةٍ مِنْ وَلَدِ إِسْمَاعِيلَ وَكُتِبَ لَهُ عَشْرُ حَسَنَاتٍ وَحُطَّ عَنْهُ عَشْرُ سَيِّئَاتٍ وَرُفِعَ لَهُ عَشْرُ دَرَجَاتٍ وَكَانَ فِي حِرْزٍ مِنَ الشَّيْطَانِ حَتَّى يُمْسِيَ وَإِنْ قَالَهَا إِذَا أَمْسَى كَانَ لَهُ مِثْلُ ذَلِكَ حَتَّى يُصْبِحَ \". قَالَ فِي حَدِيثِ حَمَّادٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5077، يذكر عدد الحسنات، وكتابة الحسنات، ورفع الدرجات، وعمل يعدل عملا أعظم منه، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 5077 (General Behavior (Kitab Al-Adab)), that speaks of a stated number of good deeds, the writing of good deeds, ranks raised, a deed that equals a greater one, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 5077، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، درجات کی بلندی، ایک عمل جو بڑے عمل کے برابر ہے، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
