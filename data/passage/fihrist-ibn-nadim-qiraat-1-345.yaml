text: "… : كِتَابُ قِرَاءَة حَمْزَة. كِتَابُ الفَرَائِضِ. خَالِدُ بن يَزِيد. عَائِذْ بن أبي عَائِذْ. الكِسَائِيّ. الحَسَنُ بن عَطِيَّة. عُبَيْدُ اللّٰه بن عليُّ بن حَمْزَة بن عبد اللّه بن بَهْمَن بن فَيْرُوز، أصْلُه أعْجَمِيّ، من القُرَّاءِ. السَّبْعَة من أهلِ الكُوفَة ومَنْشَؤُهُ بها. …"
