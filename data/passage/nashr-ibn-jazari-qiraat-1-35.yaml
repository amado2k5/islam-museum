text: "وجه كون القرآآت على سبعة احرف.. قال لا بن مسعود ان الكتب كانت تنزل من السماء من باب واحد وان القرآن انزل من سبعة ابواب على سبعة احرف : حلال، وحرام، ومحكم. ومتشابه، وضرب امثال، وامر وزاجر، فاحل حلاله وحرم …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 35، يذكر الأحرف السبعة، وقراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 35, that mentions the seven ahruf, the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 35 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Nashr fi al-Qira'at al-'Ashr de Ibn al-Jazari, volumen 1, pág. 35, que menciona los siete ahruf, las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du traité al-Nashr fi al-Qira'at al-'Ashr d'Ibn al-Jazari (tome 1, p. 35), mentionnant les sept lectures (ahruf) du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Cezeri'nin \"On Okunuş\" adlı eserinin 1. cildinin 35. sayfasından, Kur'an'ın yedi harfini ve okunuşlarını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jazari, \"Sepuluh Bacaan,\" Jilid 1, halaman 35, yang menyebutkan tujuh huruf dan bacaan Al-Quran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
