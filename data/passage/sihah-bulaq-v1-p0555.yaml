text: |-
  ٨٦
  عهدى بسلى وهى لم تزوج • على عهبى عيشها الخرفج
  ⁦( عيب)⁩. العيب والعيبة والعاب بعنى واحد تغول عاب المتاع اى صار ذاعيب وعيته
  أنا يتهدى ولا يتعدى فهو معيب ومعيوب أيضاعلى الاصل وتقول مافيه معابة ومعاب أى
  عبب ويقال موضع عيب قال الشاعر
  أنا الرجل الذى قد عبقموه * ومافيه لعياب معاب
  لان المفعل من ذوات الثلاثة مثل كال يكيل ان أريدبه الاسم مكسور والمس-درمفتوح ولو
  فتحتهما أوكسر تهما فى الاسم والمصدرجيع الجازلات العرب تقول المسار والمسير والمعاش
  والمعيس والمعاب والمعيب والمعايب العيوب وعيبه نسبه الى العيب وعيبه أيضا اذاجعله
  ذاعيب وتعيبه مثله والعيبة ما يجعل فيه التياب وفى الحديت الانصار كرشى وعيبتى والمع
  عيب مثل بدرة وبدروعياب وعيباتV
  صل الفين ⁦( يب)⁩ الغب أن تزدالابل الماه يوما وتدعه يوما تول غبت الايل
  تغب غبا وابل بن فسلان غاية وغواب وكذلك الغب فى الجمى قال الكسائى أغيت القوم
  وغيدت عنهم ايضا اذا جئت يوماوتر كت يوما قال فان أردت أنك دفعت عنهم قلت غيبت
  عنهم بالتشديد والمغيبة الشاة تحلب يوما وتترك يوما وغيب فلان فى الحاجة اذالم يسالغ فيها
  والغب فى الزيارة قال الحسن فى كل أسبوع يقال زوغباتزدد حبا وغب كل شئ أيضاعاقبت
  وقد غبت الاموراى صارت الى أواخرها رغب اللعم أى أنتن وغب فلان عندنا أى بات
  ومنسه سحى اللهم البانت الغاب ومنهة وله-م رويد الشعريغب وأغبنا فلان أتانا غباوفى
  الحديث أغبوافى عمادة المريض وأربهواية ول عديوما ودع يوما أودع يومين وعداليوم
  النسالث وتقول أغبت الابل من غب الورد وأغبت الحى وغبت بمعى وفلان لا يغبنا عطاؤه
  أى لا يأتدنايومادون يوم بل يأتينا كل يوم ومنه قول الراجز وحرات شربهن غب
  أى كل ساعة والغب الغامض من الارض والجمع اغباب وغبوب وغبة بالضم فرخ عقاب
  كان لبق يشكر وله حديث والغبيبة من ألبان الغنم يحلب غسدوة ثم يحلب علميه من الليل
  ثم يمخض من الغد والغبب للبة روالديك ما تدلى تت حنكه ما وكذلك الغبغب والفبغب أيضا
  المضرعنى وهو جبيل قال الشاعر
  والراقصات الى من فالغبغب ⁦(غرب )⁩ الغرية الاغستراب تقول منه تغرب واغترب
  بعى فهو غريب وغرب أيضايضم الغين والراء وقال
  وما كان غض الطرف منامصية • ولكنذا فى مذج غربان
  والمع الغرباء والغرباء أيضا الاباعد واغترب فلان اذا تزوج الى غيرأقاريه وفى الحديث
  اغتربو الاتضووا والمغترب الذى ياخذ فى ناحية المغرب وقال قيس بن الملوح
  وأصصت من إلى الغداة كناظر • مع الصبح فى أعقاب نجم مغرب
  ويقال أيضاهل جاءكم مغرية خبريعف اخير الذى طرأعليهم من بلدسوى بلدهم وشأ ومغرب
  ومغرب أيضابفتح الراءأى بسد والتغريب النفى عن البلد وغرب بالتشديداسم جبل دون
  الشأم فى بلادبنى كاب وعنده عين ما تسمى غزية وأغرب الرجل جابشى غريب وأغربت
  السقاه
