text: "… يَوْمَ الاثْنَيْنِ. أحمد:، والبخاري: مطولاً. - حَدَّثَنَا مُحَمَّدُ بنُ أَبِي عُمَرَ قَالَ : حَدَّثَنَا سُفْيَانُ بنُ عُيَيْنَةَ، عَنْ جَعْفَرِ بْنِ مُحَمَّدٍ، عَنْ أَبِيهِ قَالَ : قُبِضَ رَسُولُ اللهِ يَوْمَ الاثْنَيْنِ، فَمَكَتَ ذَلِكَ اليَوْمَ وَلَيْلَةَ الثُّلاثَاءِ، وَدُفِنَ مِنَ اللَّيْلِ. وَقَالَ سُفْيَانُ: …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 1359، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
