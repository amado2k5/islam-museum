text: "… بن جبير قال: سألته عن القراءة خلف الإمام؟ قال: ليس وراء الإمام قراءة. - حدثنا وكيع عن هشام الدَّستوائي عن قتادة عن ابن المُسَيِّب قال: أنصت للإمام. - حدثنا الثقفي عن أيوب عن محمد قال: لا أعلم القراءة خلف الإمام …"
