text: "بابُ فضل الذِّكر: فضل الديمومة وإن قلّ العمل فضل الديمومة وإن قلّ العمل - حدَّثنا الحسينُ، أخبرنا عبدُ الله، أخبرنا سفيانُ، عن منصورٍ، عن إبراهيمَ قال: كانوا يَستحِبُّون الزِّيادةَ ويَكرَهون النُّقصانَ، وإلّا فشيءٌ دِيمةً، وكان إذا فاتَهُم من اللّيلِ قَضَوْه …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 2، ص 294، يرد فيه ذكر المستحب، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 2, p. 294, whose wording mentions the recommended (mustahabb), what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 2، ص 294 کا اقتباس جس میں مستحب، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ibn al-Mubarak, volume numérisé 2, p. 294, dont le texte mentionne le recommandé (mustahabb), ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
