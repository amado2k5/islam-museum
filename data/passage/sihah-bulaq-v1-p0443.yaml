text: |-
  ١٩٨
  السلك يخساط به والنصاحات أيضا الجلود وأنشد الاسمعى للاعشى
  فترى القوم نشاوى كاهم * مثل مامدّت نصاحات الريح
  وشيبة بن نصاح أيضارجل من القراء ⁦( ضع)⁩ النضح الرش نضحت البيت أنضده بالكسر
  والنضح أيضا الشرب دون الرى تقول نضح عطئه ينضحه والنضيح الحوض والجمع نضح
  وكذلك النضح بالتحريك والجسع أنضاح قال ابن الاعرابى انماسمى بذلك لانه ينضح عطس
  الابل أى يبله والنضيح العرق قال الراجز تنضح ذفراء بماءصب والناضح البعير
  ستقى عله والانى ناضحة وسانية والنضاح الذى ينضح على البعيرأى يسوق السانية ويدقى
  نخلا وهذه نخل تنضح أى نسق ومال فلان بسق بالنضح وهوم صدر ونضحوهم بالنبل أى
  رموهم يقمال أنضح عنا الخيل أى ارمهم وانتضح عليهم الماء أى ترشش ونضح الرجل ءن
  نفسه اذا دفع عنها محجة وهو ينضح عن فلان أى يذب عنه ويدفع ورأيته يتنضح مما قرف به
  أى ينتفى ويتفصل منه والنضوح ضرب من الطيب الاصمعى نضح الشجراذا تفطر ليخرح
  ورقه ابن السكيت تغدت القربة وانحابسة تنضح بالفتح نفسا وتنضاحار شدت ⁦(نطح)⁩
  نطهه الكبش ينطمه وينطه نطها وانتطدت الكباش وتناطعت وكبش نطاح والنطيعة
  المنطوحة التى مانت منه وانماجاءت بالها لغلبة الاسم عليها وكذلك الفريسة والاكيلة
  والرمية لانه ليس هو على نطحتها فهى منطوحة وانماهو الشى فى نفسه مما ينطح والشئ
  مما يفرس ومما يؤكل والنطيح والناطح هو الذى يأتيك من أمامك من الطير والوحسّ وهو
  خلاف القعيدوة ولهم ماله ناطح ولاخابط فالناطح الكبش والقيس والعنز والخابط البعير
  والنطيح الفرس الذى فى جبهته دائرتان ويكره فان كانت واحدة فهى دائرة اللطاة وليست
  نسكره ديقسال للشرطين النطح والناطح وهماقرنا الحمل وأصابه ناطح أى أمر شديد ونواطح
  الدهر شدائده يح) نضح الطيب ينفح أى فاح وله نفحة طيبة ونفيحت الناقة ضربت
  برجلها وننيده بالسيف تناوله من بعيد و نفعه بشى أى أعطاه يقال لايزال لف لان نفهات
  من المعروف قال الشاعر
  لمااتيتك أرجو فضل نائلكم • نفحتنى نفحة طابت لما العرب
  أى طابت لها النفس ونفعت الريح هيت قال الاصمعى ما كان من الرياح نفح فه و بردوما كان
  لفح فهوحر وقول الناعر يمانيسة نفوح يعنى الجنوب تنفحه يبردها ونفح العرق
  يتفح نفدا اذانزامنه الدم وتفعة من العذاب قطعة منه والتفوح من النوق التى يخرج لبنها
  من غيرحلب والنفائح القسىّ واحدتها نفيحة وهى شطيبة من نبع وقوس نفوح بعيدة الدفع
  للسهسم ونا فحت عن فلان خاصمت عنه ونافحوهم مثل كافحوهم والانفحة بكسر الهمرة وفتح
  الفاء مخففة كرش المهل اوالجدى مالم يأكل فاذا أكل فهوكرش عن أبى زيد وكذلك
  المنفيحة بكسر الميم قال الراجز
  كم قد أ كات كبدا وإنفعه * ثم ادّخرت ألية مشرحه
  والجمع أنافح وأنشدابن الاعرابى
  اذا أولوالم يولوا بالانافح (نقح، تنقيح
  لجذع تشذيبه وتنقيح الذهر تهذيبه بقال خير الشهر الحولىّ المنقح وتنقيح العظم استخراج
