text: "… ما يوجب الردة فلا يصلىٰ خلفه كالقبوريين من الرافضة وغيرهم. صلاة الجنازة فرض كفاية، وهي مستحبة لغير من تحصل بهم الكفاية ينبغي للإمام والعالم والرجل الصالح المشهور ترك الصلاة على الفجار وجوب السمع والطاعة بالمعروف لولاة الأمر وتحريم الخروج عليهم …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 466، يرد فيه ذكر الفرض، وفرض الكفاية، والوجوب، والمستحب، والتحريم، والسمع والطاعة، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 466, whose wording mentions the obligatory (fard), the communal obligation (fard kifaya), obligation (wujub), the recommended (mustahabb), forbidding (tahrim), hearing and obeying, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 466 کا اقتباس جس میں فرض، فرضِ کفایہ، وجوب، مستحب، تحریم، سننا اور ماننا، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on the Tahawi creed de Ibn Abi al-'Izz, volume numérisé 1, p. 466, dont le texte mentionne l'obligatoire (fard), l'obligation collective (fard kifaya), l'obligation (wujub), le recommandé (mustahabb), l'interdiction (tahrim), écouter et obéir, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on the Tahawi creed de Ibn Abi al-'Izz, volumen digitalizado 1, p. 466, cuyo texto menciona lo obligatorio (fard), la obligación colectiva (fard kifaya), la obligatoriedad (wujub), lo recomendado (mustahabb), la prohibición (tahrim), oír y obedecer, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
