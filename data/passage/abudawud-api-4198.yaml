label: { ar: "سنن أبي داود 4198 — الجراحة والختان والجبائر", en: "Sunan Abi Dawud 4198 — surgery, circumcision and splints", ur: "سنن ابی داؤد 4198 — جراحت، ختنہ اور پٹیاں", es: "Sunan Abi Dawud 4198 — cirugía, circuncisión y férulas", fr: "Sunan Abi Dawud 4198 — chirurgie, circoncision et attelles" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدٍ، عَنْ أَبِي هُرَيْرَةَ، يَبْلُغُ بِهِ النَّبِيَّ \" الْفِطْرَةُ خَمْسٌ أَوْ خَمْسٌ مِنَ الْفِطْرَةِ الْخِتَانُ وَالاِسْتِحْدَادُ وَنَتْفُ الإِبْطِ وَتَقْلِيمُ الأَظْفَارِ وَقَصُّ الشَّارِبِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4198، يذكر الجراحة والختان والجبائر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4198 (Combing the Hair (Kitab Al-Tarajjul)), that mentions surgery, circumcision and splints. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4198، جس میں جراحت، ختنہ اور پٹیاں کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4198 (El peinado (Kitab Al-Tarajjul)), menciona la cirugía, la circuncisión y las férulas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 4198 (Le peignage des cheveux (Kitab Al-Tarajjul)), mentionne la chirurgie, la circoncision et les attelles. Le Répertoire des ouvrages médicaux le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
