label: { ar: "الموطأ 1663 — ربيعة بن أبي عبد الرحمن: بلغه أن امرأة عبد الرحمن بن عوف سألته الطلاق، فقال إذا حضت ثم طهرت فآذنيني، فلما طهرت أعلمته فطلقها البتة وهو مريض، فورثها عثمان بعد انقضاء عدتها", en: "Muwatta 1663" }
summary:
  ar: "يروي مالك أنه سمع ربيعة بن أبي عبد الرحمن يقول بلغني أن امرأة عبد الرحمن بن عوف سألته أن يطلقها، فقال إذا حضت ثم طهرت فآذنيني، فلم تحض حتى مرض عبد الرحمن بن عوف، فلما طهرت آذنته، فطلقها البتة، أو تطليقة لم يبق له عليها من الطلاق غيرها، وعبد الرحمن يومئذ مريض، فورثها عثمان بن عفان منه بعد انقضاء عدتها. {cite:muwatta-maruf-1997 p.84}"
