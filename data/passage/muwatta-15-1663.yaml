label: { ar: "الموطأ 1663 — ربيعة بن أبي عبد الرحمن: بلغه أن امرأة عبد الرحمن بن عوف سألته الطلاق، فقال إذا حضت ثم طهرت فآذنيني، فلما طهرت أعلمته فطلقها البتة وهو مريض، فورثها عثمان بعد انقضاء عدتها", en: "Muwatta 1663", es: "Muwatta 1663", fr: "Muwatta 1663", ur: "موطا 1663", tr: "El-Muvatta 1663 — Rabi’ah ibn Abi Abd al-Rahman: Abd al-Rahman ibn Awf’ın karısının kendisinden boşanma istediği kendisine ulaştı. Bunun üzerine, “Adet görüp temizlendiğinde bana haber ver” dedi. Kadın temizlendiğinde ona haber verdi ve o da hasta iken onu geri dönülmez bir şekilde boşadı. Osman, bekleme süresi sona erdikten sonra ondan miras aldı.", id: "Al-Muwatta 1663 — Rabi’ah ibn Abi Abd al-Rahman: Sampai kepadanya bahwa istri Abd al-Rahman ibn Awf meminta cerai, lalu beliau berkata, “Ketika dia haid dan kemudian suci, beritahukan kepadaku.” Ketika dia suci, dia memberitahukannya, lalu beliau menceraikannya secara mutlak saat beliau sakit. Utsman mewarisi hartanya setelah masa iddahnya berakhir." }
summary:
  ar: "يروي مالك أنه سمع ربيعة بن أبي عبد الرحمن يقول بلغني أن امرأة عبد الرحمن بن عوف سألته أن يطلقها، فقال إذا حضت ثم طهرت فآذنيني، فلم تحض حتى مرض عبد الرحمن بن عوف، فلما طهرت آذنته، فطلقها البتة، أو تطليقة لم يبق له عليها من الطلاق غيرها، وعبد الرحمن يومئذ مريض، فورثها عثمان بن عفان منه بعد انقضاء عدتها. {cite:muwatta-maruf-1997 p.84}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'ın şöyle dediğini rivayet eder: \"Abd al-Rahman ibn Awf'ın karısının ondan boşanmasını istediğini duydum. O da, 'Adet görüp temizlendiğinde bana haber ver' dedi. Fakat Abd al-Rahman ibn Awf hastalanana kadar kadın adet görmedi. Temizlendiğinde ona haber verdi ve o da onu geri dönülmez bir şekilde, yani tek bir boşanma ile boşadı; böylece ona karşı başka bir boşanma hakkı kalmadı. Abd al-Rahman o sırada hastaydı ve bekleme süresi bittikten sonra Osman ibn Affan ondan miras aldı.\" {cite:muwatta-maruf-1997 s.84}"
  id: "Malik meriwayatkan bahwa ia mendengar Rabi'ah ibn Abi Abd al-Rahman berkata, \"Aku mendengar bahwa istri Abd al-Rahman ibn Awf memintanya untuk menceraikannya. Dia berkata, 'Ketika dia haid dan kemudian suci, beritahukan kepadaku.' Tetapi dia tidak haid sampai Abd al-Rahman ibn Awf jatuh sakit. Ketika dia suci, dia memberitahunya, dan dia menceraikannya secara mutlak, atau dengan satu kali talak, sehingga dia tidak memiliki talak lain terhadapnya. Abd al-Rahman sakit pada waktu itu, dan Uthman ibn Affan mewarisi hartanya setelah masa iddah istrinya berakhir.\" {cite:muwatta-maruf-1997 p.84}"
