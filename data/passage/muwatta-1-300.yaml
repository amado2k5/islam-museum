text: "من قام رمضان إيماناً واحتساباً غفر له ما تقدم من ذنبه"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن عن أبي هريرة، في باب الترغيب في الصلاة في رمضان: كان النبي يرغّب في قيام رمضان من غير أن يأمر به أمر إيجاب فيقول إن من قام رمضان إيماناً واحتساباً غُفر له ما تقدم من ذنبه؛ وقال ابن شهاب: فتوفي النبي والأمر على ذلك، ثم كان الأمر على ذلك في خلافة أبي بكر وصدراً من خلافة عمر. وينقل المحقق عن النووي أن معنى «من غير عزيمة» أنه لم يأمرهم أمر إيجاب بل أمر ندب، ويبين أن الرواة اختلفوا على مالك في إسناده: فرواه يحيى وابن أبي أويس وعبد الرزاق وعثمان بن عمر وغيرهم متصلاً بذكر أبي هريرة، ورواه القعنبي وأبو مصعب وابن وهب وأكثر رواة الموطأ مرسلاً عن أبي سلمة، كما قال ابن عبد البر (التمهيد 7/96)، وأن أصحاب الزهري رووه موصولاً وأن الطرق الموصولة تقوي رواية يحيى. {cite:muwatta-maruf-1997 p.170} {cite:muwatta-maruf-1997 p.171}"
