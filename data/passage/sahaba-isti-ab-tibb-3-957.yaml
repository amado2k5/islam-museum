text: "… بن يقولان : أم عطِيَّة الأَنصاريّة نُسيبة بنت كعب. قال أَبو عمر : في هذا نظر، لأنٌّ نسيبة بنت كعب أم عمارة. تُعَدُّ أم عطِيَّة في أَهل البصرة، كانت من كِبارٍ نساء الصحابة رضوان اللّٰه عليهم أَجمعين، وكانت وتداوي الجرحى، …"
summary:
