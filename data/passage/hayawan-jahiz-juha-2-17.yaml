text: "… للسخيف، والخَفِيفُ للخفيف، والجَزلُ للجَزل، والإفصاحُ في مَوضع الإفصاح، والكنايةُ في موضع الكناية، والاسترسال في موضع الاسترسال. وإِذا كان مَوْضِعُ الحديثِ على أنَّهُ مُضْحِكٌ ومُلْهٍ، وداخِلٌ في باب المزَاح والطِّيب، فاستعْمَلتَ فيه الإعراب، انقَلَبَ عن جِهَتِه. وإِنْ كان في لفظه …"
summary:
  ar: "مقطع من كتاب الحيوان، المجلد المصوَّر 2، ص 17، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Kitab al-Hayawan, scan volume 2, p. 17, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "کتاب الحیوان، اسکین جلد 2، ص 17 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Hayawan, volume numérisé 2, p. 17, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Kitab al-Hayawan, volumen escaneado 2, p. 17, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hayvanlar Kitabı, Resimli Cilt 2, sayfa 17'den bir alıntı; zeki ve aptal insanlar hakkında bir hikaye içeriyor; makineyle okunabilir resimli baskıdan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Kitab Hewan, Jilid 2 Bergambar, halaman 17, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari edisi bergambar yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
