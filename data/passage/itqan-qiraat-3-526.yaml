text: "… : مَنْ ظنَّ أنَّ قراءةَ هؤلاء القراء كنافعٍ وعاصم هي الأحرف السبعة التي في الحديث فقد غَلِطَ غَلَطاً عظيماً. قال: ويَلْزَمُ مِنْ هذا أنَّ ما خرج عن قراءةِ هؤلاء السبعةِ ممَّا ثَبَتَ عن الأئمةِ غيرِهم، ووافق خطَّ المصحفِ، ألاَ يكونَ …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 526، يذكر الأحرف السبعة، والقراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 526, that mentions the seven ahruf, the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 526 کا اقتباس جس میں سبعہ احرف، قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 526, que menciona los siete ahruf, los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre « al-Itqan fi 'Ulum al-Qur'an » d'al-Suyuti (tome 3, p. 526), numérisé, mentionnant les sept ahruf, les lecteurs, la compilation du Coran et des codex, ainsi que l'orthographe du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans la limite de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
