text: "… هَذِهِ أُمُّ سُلَيْمٍ مَعَهَا خَنْجَرٌ فَقَالَ لَهَا رَسُولُ اللَّهِ مَا هَذَا الْخَنْجَرُ . قَالَتِ اتَّخَذْتُهُ إِنْ دَنَا مِنِّي أَحَدٌ مِنَ الْمُشْرِكِينَ بَقَرْتُ بِهِ بَطْنَهُ. فَجَعَلَ رَسُولُ اللَّهِ يَضْحَكُ قَالَتْ يَا رَسُولَ اللَّهِ اقْتُلْ مَنْ بَعْدَنَا مِنَ الطُّلَقَاءِ انْهَزَمُوا بِكَ. فَقَالَ رَسُولُ اللَّهِ يَا أُمَّ سُلَيْمٍ إِنَّ اللَّهَ قَدْ كَفَى وَأَحْسَنَ . وَحَدَّثَنِيهِ مُحَمَّدُ بْنُ حَاتِمٍ، …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4680، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih Muslim, no. 4680, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح مسلم کی حدیث نمبر 4680، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih Muslim, n° 4680, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih Muslim, n.º 4680, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih Müslim'de 4680 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslam Halk Bilimi Tarayıcısı tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4680, berisi tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan Peramal Cerita Rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
