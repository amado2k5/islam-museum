text: "موسى، عن الحكم ابن عمير، وكان بدريا . قلت: والصحيح أنه لما ورد عليه كتاب زياد بالعتاب دعا على نفسه فمات. قال أبو عمر الحكم بن عمير روى عن النبي ول وذكر أبو عمر عن قصة ولاية زيان أنها لم"
