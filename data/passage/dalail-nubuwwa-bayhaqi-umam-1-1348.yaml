text: "… موسى بن عقبة، قال : وكان كعب بن الأشرف اليهودي وهو أحد بني النضير وقيمهم، قد آذى رسول اللّه وَل في ب الهجاء، وركب إلى قريش، فقدم عليهم فاستغواهم على رسول اللّٰه وليف، فقال له أبو سفيان : أناشدك اللّٰه …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1348، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
