label: { ar: "الأربعون 47 — ما ملأ آدمي وعاء شراً من بطن", en: "Arba'un 47 — no worse vessel than the belly", es: "Arba'un 47 — no hay peor recipiente que el vientre", fr: "Arba'un 47 — pas de pire vaisseau que le ventre", ur: "اربعون 47 - پیٹ سے بدتر کوئی برتن نہیں۔" }
text: "ما ملأ آدمي وعاء شراً من بطن بحسب ابن آدم أكلات يقمن صلبه فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنفسه"
summary:
  ar: "حديث المقدام بن معديكرب قال: سمعت رسول الله يقول: «ما ملأ آدمي وعاء شراً من بطن، بحسب ابن آدم أكلات يقمن صلبه، فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنفسه» — خامس الأحاديث التي زادها ابن رجب؛ أخرجه أحمد 4/132 والترمذي (2380) من حديث يحيى بن جابر الطائي عن المقدام وقال الترمذي حديث حسن، وخرجه النسائي في الكبرى من هذا الوجه ومن رواية صالح بن يحيى بن المقدام عن جده، وخرجه ابن ماجه (3349) من وجه آخر وله طرق أخرى منها طريق حبيب بن عبيد عند الطبراني؛ وروي مع ذكر سببه في معجم أبي القاسم البغوي من حديث عبد الرحمن بن المرقع أن رسول الله فتح خيبر وهي مخضرة من الفواكه فواقع الناس الفاكهة فأمغئتهم الحمى فشكوا إليه فقال «إنما الحمى رائد الموت وسجن الله في الأرض وهي قطعة من النار فإذا أخذتكم فبردوا الماء في الشنان فصبوها عليكم بين الصلاتين» يعني المغرب والعشاء ففعلوا فذهبت عنهم فقال «لم يخلق الله وعاء إذا ملئ شراً من بطن فإن كان لا بد فاجعلوا ثلثاً للطعام وثلثاً للشراب وثلثاً للريح» — أخرجه الطبراني والبيهقي في دلائل النبوة والقضاعي في مسند الشهاب من طريق المحبر بن هارون عن أبي يزيد المقرئ عن عبد الرحمن بن المرقع وفي إسناده مقال ولبعض فقراته شواهد ⁦(جامع العلوم والحكم ص 891–900)⁩."
  en: "The hadith of al-Miqdam ibn Ma'dikarib that he heard the Messenger of God say 'no human has filled a vessel worse than the belly; enough for the son of Adam are morsels that keep his back upright, and if he must, then a third for his food, a third for his drink and a third for his breath' — the fifth of Ibn Rajab's added hadiths, transmitted by Ahmad (4/132) and al-Tirmidhi (2380) through Yahya ibn Jabir al-Ta'i from al-Miqdam, al-Tirmidhi grading it hasan, al-Nasa'i in the Kubra through this route and through Salih ibn Yahya ibn al-Miqdam from his grandfather, Ibn Majah (3349) through another route, with further paths including Habib ibn Ubayd's in al-Tabarani; it was also narrated with its occasion in Abu al-Qasim al-Baghawi's Mu'jam through Abd al-Rahman ibn al-Muraqqa': the Messenger of God conquered Khaybar while its fruit was green, the people gorged on the fruit and fever seized them, and when they complained he said 'fever is death's harbinger and God's prison on earth, and a piece of the Fire — when it takes you, cool water in the water-skins and pour it over you between the two prayers', meaning sunset and evening, which they did and it left them; then he said 'God created no vessel that when filled is worse than a belly — if it must be, make a third for food, a third for drink and a third for air' — transmitted by al-Tabarani, al-Bayhaqi in Dala'il al-nubuwwa and al-Qada'i in Musnad al-Shihab through al-Mukhabbar ibn Harun from Abu Yazid al-Muqri' from Abd al-Rahman ibn al-Muraqqa', the isnad containing criticism though some clauses have corroborants (Jami' al-Ulum wal-Hikam pp. 891–900)."
  es: "El hadiz de al-Miqdam ibn Ma'dikarib que oyó al Mensajero de Dios decir 'ningún ser humano ha llenado un recipiente peor que el vientre; para el hijo de Adán bastan los bocados que mantienen su espalda erguida, y si debe, entonces un tercio para su comida, un tercio para su bebida y un tercio para su aliento' — el quinto de los hadices añadidos de Ibn Rajab, transmitido por Ahmad (4/132) y al-Tirmidhi (2380) a través de Yahya ibn Jabir al-Ta'i de al-Miqdam, al-Tirmidhi lo clasificó hasan, al-Nasa'i en el Kubra a través de esta ruta y a través de Salih ibn Yahya ibn al-Miqdam de su abuelo, Ibn Majah (3349) a través de otra ruta, con otras rutas que incluyen la de Habib ibn Ubayd en al-Tabarani; También se narró con su ocasión en el Mu'jam de Abu al-Qasim al-Baghawi a través de Abd al-Rahman ibn al-Muraqqa': el Mensajero de Dios conquistó Khaybar mientras su fruto estaba verde, la gente se atiborró del fruto y la fiebre los atacó, y cuando se quejaron dijo: 'La fiebre es presagio de muerte y prisión de Dios en la tierra, y un pedazo del Fuego; cuando os alcance, agua fría en los odres y derramadla sobre vosotros entre las dos oraciones', es decir, la puesta del sol y la tarde, lo cual hicieron y la fiebre los abandonó; Luego dijo: «Dios no creó ningún recipiente que, cuando está lleno, sea peor que un vientre; si tiene que serlo, haz un tercio para la comida, un tercio para la bebida y un tercio para el aire». Transmitido por al-Tabarani, al-Bayhaqi en Dala'il al-nubuwwa y al-Qada'i en Musnad al-Shihab a través de al-Mukhabbar ibn Harun de Abu Yazid al-Muqri' de Abd al-Rahman ibn al-Muraqqa', el isnad contiene críticas aunque algunas cláusulas tienen corroborantes (Jami' al-Ulum wal-Hikam pp. 891–900)."
  fr: "Le hadith d'al-Miqdam ibn Ma'dikarib selon lequel il a entendu le Messager de Dieu dire: « Aucun humain n'a rempli un récipient pire que son ventre; il suffit au fils d'Adam de quelques bouchées qui le maintiennent droit, et s'il le faut, alors un tiers pour sa nourriture, un tiers pour sa boisson et un tiers pour son souffle » — le cinquième des hadiths ajoutés par Ibn Rajab, transmis par Ahmad (4/132) et al-Tirmidhi (2380) par Yahya ibn Jabir al-Ta'i d'al-Miqdam, al-Tirmidhi le qualifiant de hasan, al-Nasa'i dans le Kubra par cette voie et par Salih ibn Yahya ibn al-Miqdam de son grand-père, Ibn Majah (3349) par une autre voie, avec d'autres voies, y compris celle de Habib ibn Ubayd dans al-Tabarani; Il a également été rapporté avec son contexte dans le Mu'jam d'Abu al-Qasim al-Baghawi par l'intermédiaire d'Abd al-Rahman ibn al-Muraqqa': le Messager de Dieu conquit Khaybar alors que ses fruits étaient verts, les gens se gavaient de fruits et la fièvre les saisit, et lorsqu'ils se plaignirent, il dit: « La fièvre est le messager de la mort et la prison de Dieu sur terre, et un morceau du Feu — lorsqu'elle vous atteint, mettez de l'eau fraîche dans les outres et versez-la sur vous entre les deux prières », c'est-à-dire le coucher du soleil et le soir, ce qu'ils firent et elle les quitta; Il dit ensuite: « Dieu n'a créé aucun vase qui, une fois rempli, soit pire qu'un ventre; s'il doit en être un, faites-en un tiers pour la nourriture, un tiers pour la boisson et un tiers pour l'air » — transmis par al-Tabarani, al-Bayhaqi dans Dala'il al-nubuwwa et al-Qada'i dans Musnad al-Shihab par l'intermédiaire d'al-Mukhabbar ibn Harun d'Abu Yazid al-Muqri' d'Abd al-Rahman ibn al-Muraqqa', l'isnad contenant des critiques bien que certaines clauses aient des corroborants (Jami' al-Ulum wal-Hikam pp. 891–900)."
  ur: "مقدام بن معدیکرب کی حدیث ہے کہ انہوں نے رسول اللہ کو یہ فرماتے ہوئے سنا کہ کسی انسان نے پیٹ سے بدتر برتن نہیں بھرا۔ ابنِ آدم کے لیے وہ لقمے کافی ہیں جو اس کی پیٹھ کو سیدھا رکھتے ہیں، اور اگر ضروری ہو تو ایک تہائی اس کے کھانے کے لیے، ایک تہائی اس کے پینے کے لیے اور ایک تہائی اس کے سانس کے لیے۔‘‘ ابن رجب کی شامل کردہ احادیث میں سے پانچویں، احمد (4/132) اور الترمذی (2380) نے یحییٰ بن جابر الترمذی سے روایت کی ہے۔ حسن، النسائی نے کبریٰ میں اس راستے سے اور صالح بن یحییٰ بن المقدم سے اپنے دادا، ابن ماجہ (3349) کے ذریعے دوسرے راستے سے، مزید راستے بشمول حبیب ابن عبید کی الطبرانی میں؛ ابو القاسم بغوی کے معجم میں عبدالرحمٰن بن مرقع سے روایت ہے کہ رسول اللہ نے خیبر کو فتح کیا جب کہ اس کا پھل سبز تھا، لوگوں نے پھلوں کو گھیر لیا اور بخار نے انہیں اپنی لپیٹ میں لے لیا اور جب انہوں نے شکایت کی تو آپ نے فرمایا کہ بخار موت کا ٹکڑا ہے، جب کہ یہ زمین پر قید اور آگ کا ٹکڑا ہے۔ تم پانی کی کھالوں میں ٹھنڈا پانی ڈالو اور اسے اپنے اوپر دو نمازوں کے درمیان بہا دو، یعنی غروب آفتاب اور شام، جو انہوں نے کیا اور وہ ان سے نکل گیا۔ پھر فرمایا کہ خدا نے کوئی ایسا برتن نہیں بنایا جو پیٹ بھرنے سے بدتر ہو - اگر ضروری ہو تو ایک تہائی کھانے کے لیے، ایک تہائی پینے کے لیے اور ایک تہائی ہوا کے لیے بنا دو۔ اسے الطبرانی، البیہقی نے دلائل النبوۃ میں اور القضاعی نے مسند الشہاب میں ابو المذنب المذنبی کے ذریعے نقل کیا ہے۔ عبدالرحمٰن بن المرقع، ایک اسناد جس میں تنقید ہوتی ہے حالانکہ بعض شقوں کی توثیق ہوتی ہے ⁦(جامع العلوم والحکم صفحہ 891-900)⁩۔"
