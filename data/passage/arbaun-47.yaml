label: { ar: "الأربعون 47 — ما ملأ آدمي وعاء شراً من بطن", en: "Arba'un 47 — no worse vessel than the belly" }
text: "ما ملأ آدمي وعاء شراً من بطن بحسب ابن آدم أكلات يقمن صلبه فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنفسه"
summary:
  ar: "حديث المقدام بن معديكرب قال: سمعت رسول الله يقول: «ما ملأ آدمي وعاء شراً من بطن، بحسب ابن آدم أكلات يقمن صلبه، فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنفسه» — خامس الأحاديث التي زادها ابن رجب؛ أخرجه أحمد 4/132 والترمذي (2380) من حديث يحيى بن جابر الطائي عن المقدام وقال الترمذي حديث حسن، وخرجه النسائي في الكبرى من هذا الوجه ومن رواية صالح بن يحيى بن المقدام عن جده، وخرجه ابن ماجه (3349) من وجه آخر وله طرق أخرى منها طريق حبيب بن عبيد عند الطبراني؛ وروي مع ذكر سببه في معجم أبي القاسم البغوي من حديث عبد الرحمن بن المرقع أن رسول الله فتح خيبر وهي مخضرة من الفواكه فواقع الناس الفاكهة فأمغئتهم الحمى فشكوا إليه فقال «إنما الحمى رائد الموت وسجن الله في الأرض وهي قطعة من النار فإذا أخذتكم فبردوا الماء في الشنان فصبوها عليكم بين الصلاتين» يعني المغرب والعشاء ففعلوا فذهبت عنهم فقال «لم يخلق الله وعاء إذا ملئ شراً من بطن فإن كان لا بد فاجعلوا ثلثاً للطعام وثلثاً للشراب وثلثاً للريح» — أخرجه الطبراني والبيهقي في دلائل النبوة والقضاعي في مسند الشهاب من طريق المحبر بن هارون عن أبي يزيد المقرئ عن عبد الرحمن بن المرقع وفي إسناده مقال ولبعض فقراته شواهد (جامع العلوم والحكم ص 891–900)."
  en: "The hadith of al-Miqdam ibn Ma'dikarib that he heard the Messenger of God say 'no human has filled a vessel worse than the belly; enough for the son of Adam are morsels that keep his back upright, and if he must, then a third for his food, a third for his drink and a third for his breath' — the fifth of Ibn Rajab's added hadiths, transmitted by Ahmad (4/132) and al-Tirmidhi (2380) through Yahya ibn Jabir al-Ta'i from al-Miqdam, al-Tirmidhi grading it hasan, al-Nasa'i in the Kubra through this route and through Salih ibn Yahya ibn al-Miqdam from his grandfather, Ibn Majah (3349) through another route, with further paths including Habib ibn Ubayd's in al-Tabarani; it was also narrated with its occasion in Abu al-Qasim al-Baghawi's Mu'jam through Abd al-Rahman ibn al-Muraqqa': the Messenger of God conquered Khaybar while its fruit was green, the people gorged on the fruit and fever seized them, and when they complained he said 'fever is death's harbinger and God's prison on earth, and a piece of the Fire — when it takes you, cool water in the water-skins and pour it over you between the two prayers', meaning sunset and evening, which they did and it left them; then he said 'God created no vessel that when filled is worse than a belly — if it must be, make a third for food, a third for drink and a third for air' — transmitted by al-Tabarani, al-Bayhaqi in Dala'il al-nubuwwa and al-Qada'i in Musnad al-Shihab through al-Mukhabbar ibn Harun from Abu Yazid al-Muqri' from Abd al-Rahman ibn al-Muraqqa', the isnad containing criticism though some clauses have corroborants (Jami' al-Ulum wal-Hikam pp. 891–900)."
