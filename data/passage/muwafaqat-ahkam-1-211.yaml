text: "فصل إذا كان الفعل مندوباً بالجُزء كان واجباً بالكلّ ؛ كالأذان في المساجد الجوامع أو غيرها، وصلاة الجماعة، وصلاة العيدين، وصدقة التطوُّع، والنكاح، والوتر، والفجر، والعُمرة، وسائر النوافل الرواتب؛ فإنها مندوب إليها بالجُزء، ولو فُرض تركها جُملة لجُرِّح التارك لها، …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 1، ص 211، يرد فيه ذكر الفرض، والواجب، والمندوب، والنافلة والنوافل، والتطوع، والسنن المؤكدة والرواتب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 1, p. 211, whose wording mentions the obligatory (fard), the obligatory (wajib), the recommended (mandub), the supererogatory (nafila), the voluntary act (tatawwu'), the emphasised and regular sunnas; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 1، ص 211 کا اقتباس جس میں فرض، واجب، مندوب، نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩، سننِ مؤکدہ اور رواتب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muwafaqat de al-Shatibi, volume numérisé 1, p. 211, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), le recommandé (mandub), le surérogatoire (nafila), l'acte volontaire (tatawwu'), les sunnas appuyées et régulières ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muwafaqat de al-Shatibi, volumen digitalizado 1, p. 211, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), lo recomendado (mandub), lo supererogatorio (nafila), el acto voluntario (tatawwu'), las sunnas enfatizadas y regulares; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şatibi'nin El-Muvafakat adlı eserinin 1. cildinin 211. sayfasından, farz ameller, müstehap ameller, nafile ameller, gönüllü ameller, tasdik sünnetler ve düzenli namazlar hakkında bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehap ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 1, halaman 211, membahas amalan wajib, amalan anjuran, amalan sunnah, sunnah yang dikonfirmasi, dan salat wajib; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
