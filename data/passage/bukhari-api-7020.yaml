text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا مُوسَى، عَنْ سَالِمٍ، عَنْ أَبِيهِ، عَنْ رُؤْيَا النَّبِيِّ، فِي أَبِي بَكْرٍ وَعُمَرَ قَالَ \" رَأَيْتُ النَّاسَ اجْتَمَعُوا فَقَامَ أَبُو بَكْرٍ فَنَزَعَ ذَنُوبًا أَوْ ذَنُوبَيْنِ، وَفِي نَزْعِهِ ضَعْفٌ وَاللَّهُ يَغْفِرُ لَهُ، ثُمَّ قَامَ ابْنُ الْخَطَّابِ، فَاسْتَحَالَتْ غَرْبًا فَمَا رَأَيْتُ مِنَ النَّاسِ يَفْرِي فَرْيَهُ، حَتَّى ضَرَبَ النَّاسُ بِعَطَنٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7020، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7020 (Interpretation of Dreams), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7020، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
