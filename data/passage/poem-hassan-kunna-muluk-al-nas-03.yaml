label:
  ar: حسان، القصيدة اللامية ⁦(البيت 5)⁩
  en: Hassan's lam-rhymed poem, line 5
  es: "Poema de Hassan con rima lam, línea 5"
  fr: "Poème rimé de Hassan, vers 5"
