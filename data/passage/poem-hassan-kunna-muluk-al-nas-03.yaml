summary:
  ar: بيت من القصيدة اللامية لحسان في فخر الأنصار، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.394}}. ينسب ابن هشام إلى غير ابن إسحاق بيتاً من هذه القصيدة، وهو مذكور في موضعه من السيرة.
  en: 'Hassan praises the Ansar''s generosity: they do good as their predecessors did, and nothing bars their good deeds.'
