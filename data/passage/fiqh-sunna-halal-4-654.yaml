text: "… كل حصاة. ثم ينصرف بعد ذلك إلى النحرِ فينحر - إن كان عنده مدى ثم يحلق بعد لحره. ثم يرجع إلى مكة فيطوف طواف الإفاضة - وهو الذي يقال له طواف الزيارة. ومن بعده يحل له كل ما حُرَمَ عليه …"
summary:
