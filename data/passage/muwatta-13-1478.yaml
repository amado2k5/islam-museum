label: { ar: "الموطأ 1478 — يحيى بن سعيد عن إسماعيل بن أبي حكيم: نصراني أعتقه عمر بن عبد العزيز هلك، فأمره أن يجعل ماله في بيت المال", en: "Muwatta 1478", es: "Muwatta 1478", fr: "Muwatta 1478", ur: "موطا 1478", tr: "El-Muvatta 1478 — Yahya ibn Said, İsmail ibn Abi Hakim'den rivayetle: Ömer ibn Abdülaziz tarafından azat edilen bir Hristiyan öldü; bunun üzerine Ömer, parasının hazineye konulmasını emretti.", id: "Al-Muwatta 1478 — Yahya ibn Saeed berdasarkan riwayat Ismail ibn Abi Hakim: Seorang pria Kristen, yang dibebaskan oleh Umar ibn Abd al-Aziz, meninggal dunia, sehingga ia memerintahkan agar uangnya dimasukkan ke dalam perbendaharaan." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن إسماعيل بن أبي حكيم أن نصرانيا أعتقه عمر بن عبد العزيز هلك، فأمره عمر بن عبد العزيز أن يجعل ماله في بيت المال. {cite:muwatta-maruf-1997 p.23}"
  tr: "Malik, Yahya ibn Sa'id'den, o da İsmail ibn Abi Hakim'den rivayetle, Ömer ibn Abdülaziz'in azat ettiği bir Hristiyan adamın öldüğünü, bunun üzerine Ömer ibn Abdülaziz'in parasının devlet hazinesine konulmasını emrettiğini nakde çevirmiştir. {cite:muwatta-maruf-1997 s.23}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Isma'il ibn Abi Hakim, bahwa seorang pria Kristen yang telah dibebaskan oleh Umar ibn Abd al-Aziz meninggal dunia, sehingga Umar ibn Abd al-Aziz memerintahkan agar uangnya dimasukkan ke dalam kas negara. {cite:muwatta-maruf-1997 p.23}"
