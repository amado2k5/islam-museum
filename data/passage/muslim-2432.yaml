text: "أتى جبريل النبي فقال: يا رسول الله، هذه خديجة قد أتتك معها إناء فيه إدام أو طعام أو شراب، فإذا هي أتتك فاقرأ عليها السلام من ربها ومني وبشرها ببيت في الجنة من قصب لا صخب فيه ولا نصب"
summary:
  ar: "رواية أبي هريرة في باب فضائل خديجة من صحيح مسلم؛ جبريل يقرئ خديجة السلام من ربها ويبشرها ببيت في الجنة لا صخب فيه ولا نصب — أخص نصوص فضلها في الدواوين."
  tr: "Sahih Müslim'de Hatice'nin faziletleri bölümünde Ebu Hurayra'nın rivayetine göre: Cebrail, Hatice'ye Rabbinden selam iletir ve ona cennette gürültü ve yorgunluğun olmadığı bir ev müjdesi verir; bu, hadis derlemelerindeki Hatice'nin faziletlerine dair en somut metinlerdir."
  id: "Riwayat Abu Hurairah dalam bab tentang keutamaan Khadijah dalam Sahih Muslim: Jibril menyampaikan salam dari Tuhannya kepada Khadijah dan memberinya kabar gembira tentang sebuah rumah di Surga yang tidak ada kebisingan atau kelelahan — teks yang paling spesifik tentang keutamaannya dalam kumpulan hadits."
