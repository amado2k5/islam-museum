label: { ar: "مسلم 2432 — بشارة خديجة ببيت من قصب", en: "Muslim 2432 — Khadija promised a house of qasab in Paradise" }
text: "أتى جبريل النبي فقال: يا رسول الله، هذه خديجة قد أتتك معها إناء فيه إدام أو طعام أو شراب، فإذا هي أتتك فاقرأ عليها السلام من ربها ومني وبشرها ببيت في الجنة من قصب لا صخب فيه ولا نصب"
summary:
  ar: "رواية أبي هريرة في باب فضائل خديجة من صحيح مسلم؛ جبريل يقرئ خديجة السلام من ربها ويبشرها ببيت في الجنة لا صخب فيه ولا نصب — أخص نصوص فضلها في الدواوين."
