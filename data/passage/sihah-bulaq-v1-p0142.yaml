text: |-
  ⁦(فصل الواو )⁩
  ٤٩٩
  الى ماءآخرقال ومنه المناوشة فى القتال وذلا اذا تدانى الفريقان ورجل نؤوش أى
  ذويطش والتناوش التناول والانقياش مثله قال الراجز باتت تنوش العنق انتياشا
  وقوله تعالى وأنى لهم التناوش من مكان بعيدية ول أنى لهم تنناول الايمان فى الآخرة
  وقد كفروابه فى الدنيما ولك أن تهمز الوا وكما بقال اقتت ووقتت وقرئ به-ماجميعا ويقال
  نشته خيرا أى أفلته
  صل الاد بش لاوباش من الناس الاخلاط مثل الاوشاب ويقال
  هوجع مقلوب من البوش ومنه الحديث قدوئت قريس اوياشالها تش وتش
  القليل من كل شى مثل الوتح وانه لمن وتشهم أى من رذالهم حش) الوحش
  الو-وش وهى حيوان البرّ الواحد وحشى" يقال ماروحش بالاضافة وحاروحشى
  وأرض موحوشة ذات وحوش عن الفرّاء والوحشىّ الجانب الايمن من كل شىْ هذا
  قول أبى زيد وأبى عمرو وقال عنترة
  وكأنما تنأى بجانب دفها ال وحشى من هزج العنى مؤوم
  وانما تنأى بالجانب الوحشى لان سوط الراكب فى يده اليمنى وقال الراعى
  خالت على شق وحشيها * وقدريع جانبها الايسر
  ويقال ليس من شي يفزع إلا مال على جانبه الايمن لان الدابةً لا تؤتى من جانيها الايمن وانما
  تؤتى فى الاحتلاب والركوب من جانيها الايسرفاغماخوفها منه والخائف اغما يفرّمن
  موضع المخافة الى موضع الامن وكان الاصعى يقول الوحشىّ الجانب الايسر من كل شئ
  ووحشىّ القوس ظهرها وانسيها ما أقبل عليك منها وكذلك وحشىّ اليدوالرجل وانسيهما
  والوحشة الخلوة والهم وقد أوحشت الرجلي فاسة وحش وأرض وحشة وبلدوحشْ
  بالتسكين أى قفر يقال لقيته بوحش اصمت أى ييلدقفروبوحشت الارض صارت وحشة
  وأوحشت الارض وجدتها وحشة وأنتد الاصممى لعباس بن مرداس
  لاسماءرسم أصبح اليوم دارسا • وأوحسْ منهاررحان فراكسا
  وأوحش المنزل أيضاصار كذلك وذهب عنه الناس وقال الشاعر
  لمية موحشاطلل • يلوح كانه خلل
  وأوحش الرجل باع وتوحش الرجل أى خلابطته من الجوع يقسال توحش للدواء أى أخل
  جوفلك له من الطعام وبات فلان وحشا أى جائعا وبتنا أوحاشا وقد أرحشنا مغذايلتان أى
  غدزادنا وقال حيديصف ذتبا
  وانبات وحشاليلة لم يضق بها • دراعا ولم يصبح بها وهوخاشع
  ووحش الرجل اذارمى بثوبه وسلاحه مخافة أن يلق وفى الحديث فوحتوابر ماحهم
  وقال الشاعر ١ فذروا السلاح ووحشوا بالابرق خش) يقال ذائمن
  وخش النساس أى من وذالهم وجانى أوخاش من الناس أى من سقاطهم وقد وخسْ المشىْ
  بالضم وخوشة ووخاشة أى صاررديا قال الكميت
  تلقى الندى ومخلد احليفين * ليا من الوكس ولا بوخشين وقول الراجز
  ٤ ى أم عمرو بنت وقدأن
  وصدره
  وان أنتمّ لم تطليوا بأخيكم
