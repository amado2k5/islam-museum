text: "… مورم يحرق الدم والأخلاط. الزينة: يقطع الثآليل ويذهب البرص ويقلع الوشم ويبرئ من داء الثعلب البلغمي. يهيج الأورام الحارة : الأورام والبثور. في الباطن آلات المفاصل : ينفع من برد العصب واسترخائه ومن الفالج أعضاء الرأس : ينفع من فساد …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 388، يذكر الجذام والبرص، وأسماء الأمراض، والبيمارستان وصناعة الطب، والبرء من العلة، وأعضاء البدن، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 388, that mentions leprosy and vitiligo, named diseases, the hospital and the medical craft, recovery from an ailment, the organs of the body, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 388 کا اقتباس جس میں جذام اور برص، بیماریوں کے نام، بیمارستان، بیماری سے شفایابی، اعضائے بدن، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
