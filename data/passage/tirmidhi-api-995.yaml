label: { ar: "جامع الترمذي 995 — دفن وقبر ومرقد", en: "Jami' al-Tirmidhi 995 — a burial, grave or resting place", ur: "جامع ترمذی 995 — تدفین، قبر اور مرقد", es: "Jami' al-Tirmidhi 995 — un lugar de entierro, tumba o descanso.", fr: "Jami' al-Tirmidhi 995 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… عَمَّارٍ، عَنْ هِشَامِ بْنِ حَسَّانَ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي قَتَادَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِذَا وَلِيَ أَحَدُكُمْ أَخَاهُ فَلْيُحَسِّنْ كَفَنَهُ \". وَفِيهِ عَنْ جَابِرٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. وَقَالَ ابْنُ الْمُبَارَكِ قَالَ سَلاَّمُ بْنُ أَبِي مُطِيعٍ فِي قَوْلِهِ \" وَلْيُحَسِّنْ أَحَدُكُمْ كَفَنَ أَخِيهِ \" قَالَ هُوَ الصِّفَاقُ لَيْسَ بِالْمُرْتَفِعِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 995، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 995 (The Book on Jana''iz (Funerals)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 995، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 995 (El Libro de los Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 995 (Livre des funérailles), mentionne une sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
