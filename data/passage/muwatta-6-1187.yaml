label: { ar: "الموطأ 1187 — سالم: عبد الملك كتب إلى الحجاج ألا يخالف ابن عمر في الحج، فجاءه ابن عمر يوم عرفة وقال الرواح إن كنت تريد السنة", en: "Muwatta 1187", es: "Muwatta 1187", fr: "Muwatta 1187", ur: "موطا 1187", tr: "El-Muvatta 1187 — Salim: Abdülmalik, Haccac'a İbn Ömer'e Hac konusunda karşı çıkmaması için yazdı. Bunun üzerine İbn Ömer Arafat günü ona geldi ve \"Sünneti istiyorsan git\" dedi.", id: "Al-Muwatta 1187 — Salim: Abdul-Malik menulis kepada Al-Hajjaj agar tidak membantah Ibnu Umar mengenai ibadah haji. Maka Ibnu Umar mendatanginya pada hari Arafah dan berkata, “Pergilah jika kamu menginginkan sunnah.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سالم بن عبد الله أن عبد الملك بن مروان كتب إلى الحجاج بن يوسف ألا يخالف عبد الله بن عمر في شيء من أمر الحج. فلما كان يوم عرفة جاءه ابن عمر حين زالت الشمس، وسالم معه، فصاح به عند سرادقه، فخرج إليه الحجاج، فقال ابن عمر الرواح إن كنت تريد السنة، فطلب الحجاج أن ينظره حتى يفيض عليه ماء. فلما خرج سار بين ابن عمر وأبيه، فقال له سالم إن كنت تريد أن تصيب السنة اليوم فاقصر الخطبة وعجل الصلاة، فصدقه ابن عمر. {cite:muwatta-maruf-1997 p.534}"
  tr: "Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan rivayet ettiğine göre, Abdülmalik ibn Mervan, Haccac ibn Yusuf'a Hac ile ilgili hiçbir konuda Abdullah ibn Ömer'e karşı çıkmaması için talimat veren bir mektup yazmıştır. Arafat günü, güneş en yüksek noktasına ulaştığında İbn Ömer, Salim ile birlikte onun yanına geldi. Çadırında Haccac'ı çağırdı ve Haccac dışarı çıktı. İbn Ömer, \"Sünnete uymak istiyorsan dışarı çık\" dedi. Haccac, yıkanana kadar beklemesini istedi. Dışarı çıktığında, İbn Ömer ile babasının arasında yürüdü. Salim ona, \"Bugün Sünnete uymak istiyorsan, hutbeyi kısalt ve namazı hızlandır\" dedi. İbn Ömer onunla aynı fikirdeydi. {cite:muwatta-maruf-1997 s.534}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Salim ibn Abdullah, bahwa Abd al-Malik ibn Marwan menulis surat kepada al-Hajjaj ibn Yusuf yang memerintahkannya untuk tidak membantah Abdullah ibn Umar dalam hal apa pun yang berkaitan dengan haji. Pada hari Arafah, Ibn Umar datang kepadanya ketika matahari telah melewati puncaknya, ditemani oleh Salim. Ia memanggil al-Hajjaj di tendanya, dan al-Hajjaj keluar menemuinya. Ibn Umar berkata, \"Keluarlah jika kamu ingin mengikuti Sunnah.\" Al-Hajjaj meminta untuk menunggu sampai ia selesai mandi. Ketika ia keluar, ia berjalan di antara Ibn Umar dan ayahnya. Salim berkata kepadanya, \"Jika kamu ingin mengikuti Sunnah hari ini, persingkat khutbah dan percepat shalat.\" Ibn Umar menyetujuinya. {cite:muwatta-maruf-1997 p.534}"
