label: { ar: "الموطأ 1187 — سالم: عبد الملك كتب إلى الحجاج ألا يخالف ابن عمر في الحج، فجاءه ابن عمر يوم عرفة وقال الرواح إن كنت تريد السنة", en: "Muwatta 1187" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سالم بن عبد الله أن عبد الملك بن مروان كتب إلى الحجاج بن يوسف ألا يخالف عبد الله بن عمر في شيء من أمر الحج. فلما كان يوم عرفة جاءه ابن عمر حين زالت الشمس، وسالم معه، فصاح به عند سرادقه، فخرج إليه الحجاج، فقال ابن عمر الرواح إن كنت تريد السنة، فطلب الحجاج أن ينظره حتى يفيض عليه ماء. فلما خرج سار بين ابن عمر وأبيه، فقال له سالم إن كنت تريد أن تصيب السنة اليوم فاقصر الخطبة وعجل الصلاة، فصدقه ابن عمر. {cite:muwatta-maruf-1997 p.534}"
