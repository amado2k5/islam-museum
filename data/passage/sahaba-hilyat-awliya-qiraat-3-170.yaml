text: "… والعشاء الأخرة، وكان كثيرا اذا أفطر يرسلنى الى مساكين يأكلون معه. حدثنا أبو حامد بن جبلة ثنا أبو العباس الثقفى ثنا عبيد اللّٰه بن سعد الزهرى ثنا صمى عن أبيه ابراهيم بن سعد. قال : دخل ناس من القراء على …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 170، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 170, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 3، ص 170 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 3, pág. 170, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Hilyat al-Awliya' d'Abu Nu'aym (tome 3, p. 170) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 3. resimli cildinin 170. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 3, halaman 170, yang menyebutkan para qari; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
