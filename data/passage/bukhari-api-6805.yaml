text: "… إِلاَّ قَالَ مِنْ عُكْلٍ ـ قَدِمُوا الْمَدِينَةَ، فَأَمَرَ لَهُمُ النَّبِيُّ بِلِقَاحٍ، وَأَمَرَهُمْ أَنْ يَخْرُجُوا فَيَشْرَبُوا مِنْ أَبْوَالِهَا وَأَلْبَانِهَا، فَشَرِبُوا حَتَّى إِذَا بَرِئُوا قَتَلُوا الرَّاعِيَ وَاسْتَاقُوا النَّعَمَ، فَبَلَغَ النَّبِيَّ غُدْوَةً فَبَعَثَ الطَّلَبَ فِي إِثْرِهِمْ، فَمَا ارْتَفَعَ النَّهَارُ حَتَّى جِيءَ بِهِمْ، فَأَمَرَ بِهِمْ فَقَطَعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ وَسَمَرَ أَعْيُنَهُمْ، فَأُلْقُوا بِالْحَرَّةِ يَسْتَسْقُونَ فَلاَ يُسْقَوْنَ. قَالَ أَبُو قِلاَبَةَ هَؤُلاَءِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6805، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6805 (Limits and Punishments set by Allah (Hudood)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6805، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
