label: { ar: "سنن أبي داود 3101 — عيادة المريض، أعضاء البدن", en: "Sunan Abi Dawud 3101 — visiting the sick; the organs of the body", ur: "سنن ابی داؤد 3101 — بیمار کی عیادت، اعضائے بدن", es: "Sunan Abi Dawud 3101 — Visitar a los enfermos; los órganos del cuerpo", fr: "Sunan Abi Dawud 3101 — la visite aux malades; les organes du corps", tr: "Sunan Abi Dawud 3101 — Hasta Ziyareti, Vücut Parçaları", id: "Sunan Abi Dawud 3101 — Menjenguk Orang Sakit, Bagian Tubuh" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نُمَيْرٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ لَمَّا أُصِيبَ سَعْدُ بْنُ مُعَاذٍ يَوْمَ الْخَنْدَقِ رَمَاهُ رَجُلٌ فِي الأَكْحَلِ فَضَرَبَ عَلَيْهِ رَسُولُ اللَّهِ خَيْمَةً فِي الْمَسْجِدِ فَيَعُودُهُ مِنْ قَرِيبٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3101، يذكر عيادة المريض، وأعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3101 (Funerals (Kitab Al-Jana'iz)), that mentions visiting the sick, the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3101، جس میں بیمار کی عیادت، اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3101 (Funerales (Kitab Al-Jana'iz)), menciona la visita a los enfermos y los órganos del cuerpo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3101 (Les Funérailles), mentionne la visite aux malades et l'examen des organes du corps. Le Répertoire des ressources médicales le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 3101 numaralı hadiste, hastaları ve vücut organlarını ziyaret etmekten bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3101, menyebutkan tentang mengunjungi orang sakit dan organ tubuh. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
