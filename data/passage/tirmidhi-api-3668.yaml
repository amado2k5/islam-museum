label: { ar: "جامع الترمذي 3668 — ضحك وتبسم", en: "Jami' al-Tirmidhi 3668 — laughter and smiling", ur: "جامع ترمذی 3668 — ہنسی اور تبسم", fr: "Jami' al-Tirmidhi 3668 — rire et sourire", es: "Jami' al-Tirmidhi 3668 — risa y sonrisa" }
text: "… اللَّهِ كَانَ يَخْرُجُ عَلَى أَصْحَابِهِ مِنَ الْمُهَاجِرِينَ وَالأَنْصَارِ وَهُمْ جُلُوسٌ فِيهِمْ أَبُو بَكْرٍ وَعُمَرُ فَلاَ يَرْفَعُ إِلَيْهِ أَحَدٌ مِنْهُمْ بَصَرَهُ إِلاَّ أَبُو بَكْرٍ وَعُمَرُ فَإِنَّهُمَا كَانَا يَنْظُرَانِ إِلَيْهِ وَيَنْظُرُ إِلَيْهِمَا وَيَتَبَسَّمَانِ إِلَيْهِ وَيَتَبَسَّمُ إِلَيْهِمَا. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ الْحَكَمِ بْنِ عَطِيَّةَ. وَقَدْ تَكَلَّمَ بَعْضُهُمْ فِي الْحَكَمِ بْنِ عَطِيَّةَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3668، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 3668, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 3668، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 3668, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 3668, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
