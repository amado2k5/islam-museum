text: "… أَنَّكَ حَاضِري شَهِدْتُكَ مَوْمجوداً بِكُلِّ مَكَانِ وفيه لغات: إحداها إبراهيم بالياءِ بعد الهاء وهي اللغة المشهورة. وقرأَه السبعة غير ابن عامر في جميع القرآن. الثانية إبراهام بالأَلف. وهي قراءة ابن عامر في مواضع من القرآن، الثالثة: إبراهوم بالواو. الرابعة أَبْرَهَم …"
