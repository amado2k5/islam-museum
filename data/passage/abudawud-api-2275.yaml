label: { ar: "سنن أبي داود 2275 — النسب والانتساب", en: "Sunan Abi Dawud 2275 — paternity and lineage", ur: "سنن ابی داؤد 2275 — نسب اور انتساب", es: "Sunan Abi Dawud 2275 - paternidad y linaje", fr: "Sunan Abi Dawud 2275 — paternité et lignée" }
text: "… ثُمَّ طَبَنَ لَهَا غُلاَمٌ لأَهْلِي رُومِيٌّ يُقَالُ لَهُ يُوحَنَّهْ فَرَاطَنَهَا بِلِسَانِهِ فَوَلَدَتْ غُلاَمًا كَأَنَّهُ وَزَغَةٌ مِنَ الْوَزَغَاتِ فَقُلْتُ لَهَا مَا هَذَا فَقَالَتْ هَذَا لِيُوحَنَّهْ. فَرَفَعْنَا إِلَى عُثْمَانَ أَحْسِبُهُ قَالَ مَهْدِيٌّ قَالَ فَسَأَلَهُمَا فَاعْتَرَفَا فَقَالَ لَهُمَا أَتَرْضَيَانِ أَنْ أَقْضِيَ بَيْنَكُمَا بِقَضَاءِ رَسُولِ اللَّهِ إِنَّ رَسُولَ اللَّهِ قَضَى أَنَّ الْوَلَدَ لِلْفِرَاشِ. وَأَحْسِبُهُ قَالَ فَجَلَدَهَا وَجَلَدَهُ وَكَانَا مَمْلُوكَيْنِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2275، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2275 (Divorce (Kitab Al-Talaq)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2275، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2275 (Divorcio (Kitab Al-Talaq)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2275 (Le Divorce (Kitab Al-Talaq)), mentionne la paternité et la filiation. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
