label: { ar: "الموطأ 4 — النساء ينصرفن من الصبح متلفعات بمروطهن", en: "Muwatta 4", es: "Muwatta 4", fr: "Muwatta 4", ur: "موطا 4", tr: "Al-Muwatta 4 — Kadınlar sabahleyin pelerinlerine sarınarak dışarı çıkarlar.", id: "Al-Muwatta 4 — Para wanita pergi di pagi hari dengan mengenakan jubah mereka" }
text: "إن كان رسول الله يصلي الصبح فينصرف النساء متلفعات بمروطهن ما يعرفن من الغلس"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد الأنصاري عن عمرة بنت عبد الرحمن عن عائشة، في باب وقوت الصلاة: كان النبي يصلي الصبح في أول وقتها حتى إن النساء كن ينصرفن ملتفعات بأكسيتهن فلا يُعرفن من شدة بقية ظلمة الليل. ويفسر المحقق المروط بأنها أكسية من صوف أو خز، والغلس بظلمة آخر الليل. ويخرّجه من طرق أصحاب مالك عند البخاري (867) وأبي داود (423) والترمذي (153) والنسائي ومسلم (2/119). {cite:muwatta-maruf-1997 p.35} {cite:muwatta-maruf-1997 p.36}"
  en: "A'isha: the dawn prayer used to be held in the last darkness of night, and the women would leave wrapped in their garments, unrecognized by anyone in the dark."
  es: "Aisha: La oración del amanecer solía celebrarse en la última oscuridad de la noche, y las mujeres salían envueltas en sus vestiduras, sin ser reconocidas por nadie en la oscuridad."
  fr: "Aïcha: la prière de l'aube avait lieu autrefois dans l'obscurité la plus profonde de la nuit, et les femmes partaient enveloppées dans leurs vêtements, sans être reconnues par personne dans l'obscurité."
  ur: "عائشہ: رات کی آخری تاریکی میں فجر کی نماز ادا کی جاتی تھی، اور عورتیں اپنے کپڑوں میں لپیٹ کر باہر نکل جاتی تھیں، اندھیرے میں کسی کی پہچان نہ ہوتی تھی۔"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id al-Ansari, dari 'Amrah bint 'Abd al-Rahman, dari 'Aisyah, dalam surah tentang waktu shalat: Nabi (shalawat dan salam kepadanya) biasa shalat Subuh pada waktu paling awal, sampai-sampai para wanita akan keluar dengan terbungkus jubah mereka dan tidak dikenali karena kegelapan malam yang pekat. Peneliti menjelaskan bahwa \"al-marut\" merujuk pada jubah wol atau sutra, dan \"al-ghalas\" merujuk pada kegelapan bagian akhir malam. Hadits ini juga ditemukan dalam kumpulan hadits para sahabat Malik di al-Bukhari (867), Abu Dawud (423), al-Tirmidhi (153), al-Nasa'i, dan Muslim (2/119). {kutip:muwatta-maruf-1997 hal.35} {kutip:muwatta-maruf-1997 hal.36}"
