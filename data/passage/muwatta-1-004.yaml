label: { ar: "الموطأ 4 — النساء ينصرفن من الصبح متلفعات بمروطهن", en: "Muwatta 4" }
text: "إن كان رسول الله يصلي الصبح فينصرف النساء متلفعات بمروطهن ما يعرفن من الغلس"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد الأنصاري عن عمرة بنت عبد الرحمن عن عائشة، في باب وقوت الصلاة: كان النبي يصلي الصبح في أول وقتها حتى إن النساء كن ينصرفن ملتفعات بأكسيتهن فلا يُعرفن من شدة بقية ظلمة الليل. ويفسر المحقق المروط بأنها أكسية من صوف أو خز، والغلس بظلمة آخر الليل. ويخرّجه من طرق أصحاب مالك عند البخاري (867) وأبي داود (423) والترمذي (153) والنسائي ومسلم (2/119). {cite:muwatta-maruf-1997 p.35} {cite:muwatta-maruf-1997 p.36}"
  en: "A'isha: the dawn prayer used to be held in the last darkness of night, and the women would leave wrapped in their garments, unrecognized by anyone in the dark."
