label:
  ar: "البخاري 3470 — قاتل المائة والقرية الصالحة"
  en: "Bukhari 3470 — The man who killed a hundred and the righteous town"
  ur: "بخاری 3470 — سو آدمیوں کا قاتل اور نیک بستی"
text: "كان في بني إسرائيل رجل قتل تسعة وتسعين إنسانا ثم خرج يسأل، فأتى راهبا فسأله، فقال له هل من توبة قال لا. فقتله، فجعل يسأل، فقال له رجل ائت قرية كذا وكذا. فأدركه الموت فناء بصدره نحوها، فاختصمت فيه ملائكة …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3470: قاتل المائة والقرية الصالحة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3470: The man who killed a hundred and the righteous town. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3470: سو آدمیوں کا قاتل اور نیک بستی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
