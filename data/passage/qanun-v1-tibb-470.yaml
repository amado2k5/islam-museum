text: "… والملح إذا ضمّد به حرق النار لم يتنقّط، وينقّي القروح الوسخة. وصمغ الزيتون البرّي ينفع من الجرب المتقرّح والقوابي، ويقع في مراهم الجراحات. آلات المفاصل : ماء الزيتون المملّح يحقن به لعرق النسا، والزيت المغسول يوافق أوجاع الغصب وعرق النسا، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 470، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 470, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 470 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
