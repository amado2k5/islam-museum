text: "… اثْنَيْن، ثُمَّ يُصَلِّي مَا كُتِبَ لَهُ، ثُمَّ يُنْصِتُ إذا تَكَلَّمَ الإمَامُ إلَّا غُفِرَ لَهُ مَا بَيْنَهُ وَبَيْنَ الجُمُعَةِ الأخْرَى . رواه البخاري [٨٨٣]. فندبه إلى الصلاة ما كُتِب له، ولم بمنعه عنها إلّا في وقت خروج الإمام، ولهذا قال غيرُ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 122، يذكر مغفرة الذنب؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 122, that speaks of forgiveness of sins; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 122 کا اقتباس جس میں گناہوں کی مغفرت کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
