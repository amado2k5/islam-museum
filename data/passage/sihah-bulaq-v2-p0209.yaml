text: |-
  قوله لولا ابن عنية الح فى بعض
  النسخ بدل هذا الشطر
  لولا أبو مالك الرجونائله
  ٣٧٨
  •⁦(فصل الراء)⁩•
  * ⁦(رون)⁩•
  لود ابزعبة +رو والرج له • ما كانت البصرة الرعنالى وطنا
  ويقال الجيش الارعن هو المضطرب لكثرته غن الرغن الاصفاء الى القول وقبوله
  والارعان مثله قال الذرا لاترغنى له فى ذلكْ أى لا تطمعهفيه ويقال رغن الى الصلح أى
  ركن ( رقن فرس رفنّ يتشديد النون طويل الذنب والاصل رقل باللام قال ال ابغة
  الذيانى
  وهم دلفوا بهجر فى خيس * رحيب السرب أرءن مرجن
  بكل مجرب كاللين يسمو ، الى أوصال ذيال رفسنّ
  أرادرفلّ فوّل القام نونا وأرفأن الرجل ارقتا نا على وزن اط-مأنّ أى نفوثم -كن يقال
  ماس يأم ف أنراونة مارت الكسرة ماة اب ل ين ال ود الرتات امنا امن
  ترقنت المرأة اذااختضيت بالخناء وأرقن الرجل لجمه والترقين مثله والمرقون مثل المرقوم
  أوالترقين فى كتاب الحسبانات ت-ويد الموضع لثلايتومم أنه بيض كو لا يقع فيه حساب
  ( ركن ركن اليهيركن بالضم و-كى أيوزيد ركر اليه بالكسريركن ركونافيهما أى مال
  اليه وسكن قال اللّٰه تعالى ولار كنوا الى الدين ظلوا وأماما-كى أبو عم روركن يركن بالفتح
  فيهماقانماهو على الجمع بين اللغتين وركر الشئ جانبه الاقوى وهو يأوى الى ركن شديد أى
  ءزومنعة وجبل ركين له أركان عالية والمركن من الضروع العظيم كانه ذو الاركان وناقة
  مركنة الضرع والمركن بكسر الميم الاجانة التى تغسل فيها النياب عن الاصمعى ورجل ركيز
  أى وقوربين الزكاتة وقدركن باضم وركاتة اسم رجل من أهل.كة وهوالذى طلف امر أنه
  البنة فلفه التي عليه الصلاة والسلام أنه لم يرد الثلاث من الرمان معروف الواحدة
  رمانة قال سينو يه سألته يعى الخليل عن الرمان اذاسمى به فقال لا أصرفه فى المعرفة وأحله
  على الاكثراد لم يكن له معى يعرف به أى لا يدرى من أىّ شى اشتاقه فنههله على الاكثر
  والاكترزيادة الالف والفون وقال الاخفش نونه أصلية مثل قرّاص وحاض وفعال أكثر
  من فعلان ورمان يفتح الرامجل لطي وارمينية بالكسر كورة بناحية الروم والنسبة اليها
  ارءنى بفتح اليم نن الرنة الدوت يقالرنت المرأرت دنينا وأرنت أيضاصاحت
  وفى كلام أبى زبيد الطانى تشجراؤه مغنة وأطياره مرنة قال الراجز
  عمد افعلت ذال بيدأنى • اخال ان «لكت لازتى
  وأرنت القوس صوتت قال العجاج • ترنّ ارنانا اذاما أنضبا • ورتنتها أناترنينا والمرنة
  لقوس والمرنان مثبلد والرن شي يصيح فى الماءأيام الصيف قالء ولم تصدح ه الرنن
  ( رون الارونات الصوته قال
  بهاحاضر من غيرجنّ يروعه • ولا أنس ذوأرونان وذوزجل
  ويوم أرونان وليلة أرونانة شديدة صعبة وأماقول النابغة الجعدى
  وظلّ اسوة النعمان منا *على سفوان يوم أرونانى
  فأرد فنا حليلته وجئنا • بماقد كان جمع من هجان
  تما كسر النون على أن أصل أرونانى على النعت فذفت ياء النسبة وأماقول الراجز
  يرفها
