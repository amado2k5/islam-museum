text: "… بِوَلِيٍّ \" وَهَكَذَا أَفْتَى بِهِ ابْنُ عَبَّاسٍ بَعْدَ النَّبِيِّ فَقَالَ لاَ نِكَاحَ إِلاَّ بِوَلِيٍّ. وَإِنَّمَا مَعْنَى قَوْلِ النَّبِيِّ \" الأَيِّمُ أَحَقُّ بِنَفْسِهَا مِنْ وَلِيِّهَا \". عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ أَنَّ الْوَلِيَّ لاَ يُزَوِّجُهَا إِلاَّ بِرِضَاهَا وَأَمْرِهَا فَإِنْ زَوَّجَهَا فَالنِّكَاحُ مَفْسُوخٌ عَلَى حَدِيثِ خَنْسَاءَ بِنْتِ خِذَامٍ حَيْثُ زَوَّجَهَا أَبُوهَا وَهِيَ ثَيِّبٌ فَكَرِهَتْ ذَلِكَ فَرَدَّ النَّبِيُّ نِكَاحَهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1108، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1108 (The Book on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1108، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
