text: "… اسم أخت مارية قَيْصَرًا، ويقال بل كان اسمها سيرين. وحدثنا عيد الملك بن مسلمة حدثنا لهيعة غن الأعرج قال : بعث المقوقسى. صاحب الإسكندريه بمارية واختها حَنّة، فأسكنها رسول اللّٰه فى صدقته فى بنى قُرَيْظَة. وحدثنا هانىء بن المتوكّل، حدثنا …"
