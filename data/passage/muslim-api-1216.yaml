text: "… بْنُ يَحْيَى، وَقُتَيْبَةُ بْنُ سَعِيدٍ، كِلاَهُمَا عَنْ عَبْدِ الْعَزِيزِ، قَالَ يَحْيَى أَخْبَرَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي حَازِمٍ، عَنْ أَبِيهِ، أَنَّ نَفَرًا، جَاءُوا إِلَى سَهْلِ بْنِ سَعْدٍ قَدْ تَمَارَوْا فِي الْمِنْبَرِ مِنْ أَىِّ عُودٍ هُوَ فَقَالَ أَمَا وَاللَّهِ إِنِّي لأَعْرِفُ مِنْ أَىِّ عُودٍ هُوَ وَمَنْ عَمِلَهُ وَرَأَيْتُ رَسُولَ اللَّهِ أَوَّلَ يَوْمٍ جَلَسَ عَلَيْهِ - قَالَ - …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1216، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1216 (The Book of Mosques and Places of Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1216، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
