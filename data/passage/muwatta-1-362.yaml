label: { ar: "الموطأ 362 — وباء المدينة والناس يصلون قعوداً: صلاة القاعد نصف صلاة القائم", en: "Muwatta 362", es: "Muwatta 362", fr: "Muwatta 362", ur: "موطا 362", tr: "El-Muvatta 362 — Medine'deki veba ve insanların oturarak namaz kılması: Oturarak yapılan namaz, ayakta yapılan namazın yarısıdır.", id: "Al-Muwatta 362 — Wabah penyakit di Madinah dan orang-orang yang shalat sambil duduk: Shalat orang yang duduk adalah setengah dari shalat orang yang berdiri" }
text: "صلاة القاعد مثل نصف صلاة القائم"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبد الله بن عمرو بن العاص، في باب فضل صلاة القائم على صلاة القاعد: لما قدموا المدينة نالهم وباء من وعكها شديد، فخرج النبي على الناس وهم يصلون نوافلهم قعوداً فأخبرهم أن صلاة القاعد مثل نصف صلاة القائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وينقل عن ابن عبد البر أن جماعة الرواة رووه عن مالك بهذا الإسناد مرسلاً لأن الزهري لم يلق عبد الله بن عمرو، وأنه ساق أسانيد من وصله بينهما وبيّن شدة الاختلاف على ابن شهاب فيه ⁦(التمهيد 12/45–47)⁩. {cite:muwatta-maruf-1997 p.198}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang juga meriwayatkannya dari Abdullah ibn Amr ibn al-As, dalam surah tentang keutamaan shalat berdiri dibandingkan shalat duduk: Ketika mereka tiba di Madinah, mereka dilanda wabah penyakit yang hebat. Nabi (shalawat dan salam kepadanya) keluar menemui orang-orang ketika mereka sedang melaksanakan shalat sunnah sambil duduk, dan beliau memberitahukan kepada mereka bahwa shalat orang yang duduk itu seperti setengah dari shalat orang yang berdiri. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, dan Muhammad ibn al-Hasan. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa sekelompok perawi meriwayatkannya dari Malik dengan sanad ini sebagai hadits mursal karena al-Zuhri tidak bertemu dengan Abdullah ibn Amr. Ia juga menyebutkan bahwa ia mengutip sanad-sana periwayatan dari mereka yang menghubungkan kedua perawi tersebut dan menjelaskan perbedaan pendapat yang besar mengenai riwayat Ibnu Shihab tentangnya (al-Tamhid 12/45–47). {cite:muwatta-maruf-1997 p.198}"
