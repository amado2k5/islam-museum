label: { ar: "الموطأ 362 — وباء المدينة والناس يصلون قعوداً: صلاة القاعد نصف صلاة القائم", en: "Muwatta 362" }
text: "صلاة القاعد مثل نصف صلاة القائم"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبد الله بن عمرو بن العاص، في باب فضل صلاة القائم على صلاة القاعد: لما قدموا المدينة نالهم وباء من وعكها شديد، فخرج النبي على الناس وهم يصلون نوافلهم قعوداً فأخبرهم أن صلاة القاعد مثل نصف صلاة القائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وينقل عن ابن عبد البر أن جماعة الرواة رووه عن مالك بهذا الإسناد مرسلاً لأن الزهري لم يلق عبد الله بن عمرو، وأنه ساق أسانيد من وصله بينهما وبيّن شدة الاختلاف على ابن شهاب فيه (التمهيد 12/45–47). {cite:muwatta-maruf-1997 p.198}"
