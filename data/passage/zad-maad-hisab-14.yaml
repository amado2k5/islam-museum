text: "… قال: قال رِسول اللّه ٤: «مَن أَتَى هَذَا الْبَيْتَ، فَلَمْ يَرْفُتْ، وَلَمْ يَفْسُقْ، رَجَعَ كَيوْمَ وَلَدَتْهُ أَمُّه» [البخاري: ١٥٢١ ، ومسلم: ٣٢٩١]، ولم يرض لقاصده مِنَ الثواب دون الجنَّة، ففي «السنن من حديث عبد اللَّه بن مسعود رضي اللَّه عنه …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 14، يذكر مغفرة الذنب؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 14, that speaks of forgiveness of sins; from the extracted copy, quoted within forty words per the sources policy."
