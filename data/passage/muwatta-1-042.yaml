label: { ar: "الموطأ 42 — زيد بن أسلم في تفسير آية الوضوء: القيام من النوم", en: "Muwatta 42" }
summary:
  ar: "يروي مالك عن زيد بن أسلم تفسيره لآية الوضوء في سورة المائدة، وهي التي تأمر بغسل الوجوه والأيدي ومسح الرؤوس والأرجل عند القيام إلى الصلاة: المراد القيام من المضاجع، أي من النوم؛ وهو في باب وضوء النائم إذا قام إلى الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطبري في تفسيره ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.55}"
