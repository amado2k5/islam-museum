label: { ar: "الموطأ 42 — زيد بن أسلم في تفسير آية الوضوء: القيام من النوم", en: "Muwatta 42", es: "Muwatta 42", fr: "Muwatta 42", ur: "موطا 42", tr: "El-Muvatta 42 — Zeyd ibn Aslam, abdest ayetini yorumlarken: Uykudan kalkmak", id: "Al-Muwatta 42 — Zayd ibn Aslam dalam menafsirkan ayat wudhu: Bangun dari tidur" }
summary:
  ar: "يروي مالك عن زيد بن أسلم تفسيره لآية الوضوء في سورة المائدة، وهي التي تأمر بغسل الوجوه والأيدي ومسح الرؤوس والأرجل عند القيام إلى الصلاة: المراد القيام من المضاجع، أي من النوم؛ وهو في باب وضوء النائم إذا قام إلى الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطبري في تفسيره ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.55}"
  tr: "Malik, Zeyd ibn Aslam'dan, Maide Suresi'ndeki abdest ayetinin tefsirini aktarır. Bu ayet, namaza kalkarken yüzün ve ellerin yıkanmasını, başın ve ayakların silinmesini emreder: Kastedilen anlam, yataktan, yani uykudan kalkmaktır; bu, uyuduktan sonra namaza kalkanın abdestiyle ilgili surede yer almaktadır. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd, İbn Vahb ve Muhammed ibn el-Hasan tarafından rivayet edildiğini ve Taberi'nin tefsirinde kaydedildiğini belirtir. {cite:muwatta-maruf-1997 s.55}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam tafsirnya tentang ayat tentang wudhu dalam Surah Al-Ma'idah, yang memerintahkan mencuci muka dan tangan serta mengusap kepala dan kaki ketika hendak shalat: Maksudnya adalah bangun dari tempat tidur; ini terdapat dalam surah tentang wudhu orang yang telah tidur dan kemudian bangun untuk shalat. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, Ibn Wahb, dan Muhammad ibn al-Hasan, sebagaimana dicatat oleh al-Tabari dalam komentarnya. {cite:muwatta-maruf-1997 p.55}"
