label: { ar: "الموطأ 548 — عمر يسجد في سورة الحج سجدتين: إن هذه السورة فضلت بسجدتين", en: "Muwatta 548", es: "Muwatta 548", fr: "Muwatta 548", ur: "موطا 548", tr: "Al-Muwatta 548 — Ömer, Hac Suresi'nde iki defa secde eder: Bu sure, iki secde ile öne çıkar.", id: "Al-Muwatta 548 — Umar bersujud dua kali dalam Surah Al-Hajj: Surah ini dibedakan oleh dua sujud." }
text: "إن هذه السورة فضلت بسجدتين"
summary:
  ar: "يرويه مالك عن نافع مولى ابن عمر، أن رجلاً من أهل مصر أخبره أن عمر بن الخطاب قرأ سورة الحج فسجد فيها سجدتين [[passage/quran-22-18|الحج 18]] [[passage/quran-22-77|الحج 77]]، ثم قال إن هذه السورة فُضلت بسجدتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي والشيباني ويحيى بن يحيى النيسابوري عند البيهقي، وأن الحديث روي مرفوعاً من حديث عقبة بن عامر عند أحمد وأبي داود (1402) والترمذي (578) من طريق ابن لهيعة، وضعفه الترمذي. {cite:muwatta-maruf-1997 p.283}"
  tr: "Malik, İbn Ömer'in azatlı kölesi Nafi'den rivayet ettiğine göre, Mısır'dan bir adam kendisine Ömer ibn el-Hattab'ın Hac Suresi'ni okuyup iki secde yaptığını [[Hac 18]] [[Hac 77]] ve sonra bu surenin iki secde ile ayırt edildiğini söylediğini aktarmıştır. Araştırmacı, hadisin Malik'ten rivayetle Ebu Mus'ab, Şafiî, Şeybani ve Yahya ibn Yahya el-Naysaburi tarafından Beyhaki'nin derlemesinde nakledildiğini ve hadisin, Ukbe ibn Amir hadisinden Peygamberimize kadar uzanan bir isnad zinciriyle Ahmed, Ebu Davud (1402) ve Tirmizi'nin (578) derlemelerinde İbn Lahi'ye aracılığıyla nakledildiğini ve Tirmizi'nin bunu zayıf bulduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.283}"
  id: "Malik meriwayatkannya dari Nafi', budak yang dibebaskan oleh Ibnu Umar, bahwa seorang pria dari Mesir memberitahunya bahwa Umar bin al-Khattab membaca Surah al-Hajj dan melakukan dua sujud [[passage/quran-22-18|al-Hajj 18]] [[passage/quran-22-77|al-Hajj 77]], kemudian berkata bahwa surah ini dibedakan oleh dua sujud. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, al-Shafi'i, al-Shaybani, dan Yahya ibn Yahya al-Naysaburi dalam kumpulan hadits al-Bayhaqi, dan bahwa hadits ini diriwayatkan dengan sanad yang dapat ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) dari hadits Uqbah ibn Amir dalam kumpulan hadits Ahmad, Abu Dawud (1402), dan al-Tirmidhi (578) melalui Ibn Lahi'ah, dan al-Tirmidhi menganggapnya lemah. {cite:muwatta-maruf-1997 p.283}"
