label: { ar: "الموطأ 548 — عمر يسجد في سورة الحج سجدتين: إن هذه السورة فضلت بسجدتين", en: "Muwatta 548" }
text: "إن هذه السورة فضلت بسجدتين"
summary:
  ar: "يرويه مالك عن نافع مولى ابن عمر، أن رجلاً من أهل مصر أخبره أن عمر بن الخطاب قرأ سورة الحج فسجد فيها سجدتين [[passage/quran-22-18|الحج 18]] [[passage/quran-22-77|الحج 77]]، ثم قال إن هذه السورة فُضلت بسجدتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي والشيباني ويحيى بن يحيى النيسابوري عند البيهقي، وأن الحديث روي مرفوعاً من حديث عقبة بن عامر عند أحمد وأبي داود (1402) والترمذي (578) من طريق ابن لهيعة، وضعفه الترمذي. {cite:muwatta-maruf-1997 p.283}"
