text: "- حرف الحاء المهملة فأجابه الحارث : اللّٰه يَعْلمُ مَا تَرَكْتُ قِتَالَهُمْ حَتَّى رَمَوْا فَرَسِي بِأشْقَرَ مُزْبِدِ فَعَلِمْتُ أنِّي إنْ أُقَاتِلْ وَاحِد أَقْتِلْ وَلَا يَبْكِي عَدُوِّي مَشْهَدِي تَفَرَرْتُ عَنْهُمْ وَالأحِبَّةُ فِيهمُ طَمَعاً لَهُمْ بِعِقَابٍ يَزْمِ مُفْسِرٍ الكامل ويقال: إن هذه …"
summary:
