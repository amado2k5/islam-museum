text: "أَخْبَرَنَا سُوَيْدٌ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ، قَالَ أَنْبَأَنَا الأَسْوَدُ بْنُ شَيْبَانَ السَّدُوسِيُّ، قَالَ سَمِعْتُ عَطَاءً، سَأَلَهُ رَجُلٌ فَقَالَ إِنَّا نَرْكَبُ أَسْفَارًا فَتُبْرَزُ لَنَا الأَشْرِبَةُ فِي الأَسْوَاقِ لاَ نَدْرِي أَوْعِيَتَهَا. فَقَالَ كُلُّ مُسْكِرٍ حَرَامٌ. فَذَهَبَ يُعِيدُ فَقَالَ كُلُّ مُسْكِرٍ حَرَامٌ. فَذَهَبَ يُعِيدُ فَقَالَ هُوَ مَا أَقُولُ لَكَ."
summary:
  ar: "حديث في سنن النسائي، رقم 5598، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5598 (The Book of Drinks), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5598، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
