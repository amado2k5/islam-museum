text: "… الثانى، احتمل أن تفوته الركعة صلاة الاستسقاء ركعتان يصلى ركعتين خلف المقام ركعتا الطواف سنة مؤكدة غير واجبة لا بأس أن يجمع بين الأسابيع، فإذا فرغ منها ركع لكل أسبوع ركعتين إذا فرغ من الركوع وأراد الخروج إلى الصفا، استحب …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 1، ص 815، يرد فيه ذكر الواجب، والمستحب، وما ليس بواجب، والسنن المؤكدة والرواتب، وما لا بأس به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 1, p. 815, whose wording mentions the obligatory (wajib), the recommended (mustahabb), what is said not to be obligatory, the emphasised and regular sunnas, what is said to be no harm; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 1، ص 815 کا اقتباس جس میں واجب، مستحب، جو واجب نہیں، سننِ مؤکدہ اور رواتب، جس میں کوئی مضائقہ نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 1, p. 815, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), ce qui est dit non obligatoire, les sunnas appuyées et régulières, ce qui est dit sans inconvénient ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mughni de Ibn Qudama, volumen digitalizado 1, p. 815, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo que se dice que no es obligatorio, las sunnas enfatizadas y regulares, lo que se dice que no tiene inconveniente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 1. cildinin 815. sayfasından, farz, sünnet ve nafile amellerin yanı sıra tasdik sünnetler, düzenli sünnetler ve caiz amellerden bahseden bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, sünnet ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mughni karya Ibnu Qudamah, Jilid 1, halaman 815, yang menyebutkan amalan wajib, amalan anjuran, dan amalan sunnah, serta sunnah yang telah dikonfirmasi, sunnah biasa, dan amalan yang diperbolehkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
