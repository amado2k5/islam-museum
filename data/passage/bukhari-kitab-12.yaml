summary:
  ar: "القسم 12 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة الخوف»، ويضم فيها النصوص من 942 إلى 947 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 12 of Sahih al-Bukhari (Fear Prayer) in the division of the open hadith dataset the museum took its reports from: reports 942 to 947 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 12، عنوان «کتاب صلاۃ الخوف»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 942 تا 947۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 12 de Sahih al-Bukhari (Oración del temor) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 942 a 947 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 12 du Sahih al-Bukhari (Prière de la crainte): les hadiths 942 à 947, selon la numérotation de ce recueil, y sont répertoriés. Le musée classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 12. bölümü \"Korku Duası Kitabı\" başlığını taşımakta olup, 942 ila 947 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 12 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Shalat Ketakutan\" dan berisi teks 942 hingga 947, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
