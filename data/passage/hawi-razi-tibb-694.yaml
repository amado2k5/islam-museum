text: "أمراض الرئة الفرق بين ذات الجنب وورم الكبد وورم الرئة والحجاب من كناش الإسكندر، قال: إذا فصدت وتنقى الجسم فإنه إذا وضعت المحجمة على الموضع الوجع بعقب ذلك رأيت العجب من سرعة البرء حتى أنك لا تحتاج إلى علاج غيره …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 694، يذكر الحجامة، والمرض والمريض، والوجع، وأسماء الأمراض، والعلاج، والبرء من العلة، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 694, that mentions cupping, illness and the sick, pain, named diseases, treatment, recovery from an ailment, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 694 کا اقتباس جس میں حجامہ، بیماری اور بیمار، درد، بیماریوں کے نام، علاج، بیماری سے شفایابی، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
