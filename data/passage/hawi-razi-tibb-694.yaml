text: "أمراض الرئة الفرق بين ذات الجنب وورم الكبد وورم الرئة والحجاب من كناش الإسكندر، قال: إذا فصدت وتنقى الجسم فإنه إذا وضعت المحجمة على الموضع الوجع بعقب ذلك رأيت العجب من سرعة البرء حتى أنك لا تحتاج إلى علاج غيره …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 694، يذكر الحجامة، والمرض والمريض، والوجع، وأسماء الأمراض، والعلاج، والبرء من العلة، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 694, that mentions cupping, illness and the sick, pain, named diseases, treatment, recovery from an ailment, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 694 کا اقتباس جس میں حجامہ، بیماری اور بیمار، درد، بیماریوں کے نام، علاج، بیماری سے شفایابی، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 694, que menciona la ventosaterapia, la enfermedad y los enfermos, el dolor, enfermedades específicas, el tratamiento, la recuperación de una dolencia y los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de al-Razi's al-Hawi fi al-Tibb, p. 694, qui mentionne la ventousothérapie, la maladie et les malades, la douleur, les maladies nommées, le traitement, la guérison d'une affection, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 694. sayfasından bir bölüm; hacamat, hastalık ve hasta, ağrı, hastalıkların isimleri, tedavi, hastalıktan iyileşme ve vücut organlarından bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 694, yang menyebutkan tentang bekam, penyakit dan pasien, rasa sakit, nama-nama penyakit, pengobatan, pemulihan dari penyakit, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
