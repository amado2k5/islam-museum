label: { ar: "صحيح البخاري 5147 — النسب والانتساب", en: "Sahih al-Bukhari 5147 — paternity and lineage", ur: "صحیح بخاری 5147 — نسب اور انتساب", es: "Sahih al-Bukhari 5147 — paternidad y linaje", fr: "Sahih al-Bukhari 5147 — paternité et lignée" }
text: "… بِشْرُ بْنُ الْمُفَضَّلِ، حَدَّثَنَا خَالِدُ بْنُ ذَكْوَانَ، قَالَ قَالَتِ الرُّبَيِّعُ بِنْتُ مُعَوِّذٍ ابْنِ عَفْرَاءَ. جَاءَ النَّبِيُّ فَدَخَلَ حِينَ بُنِيَ عَلَىَّ، فَجَلَسَ عَلَى فِرَاشِي كَمَجْلِسِكَ مِنِّي، فَجَعَلَتْ جُوَيْرِيَاتٌ لَنَا يَضْرِبْنَ بِالدُّفِّ وَيَنْدُبْنَ مَنْ قُتِلَ مِنْ آبَائِي يَوْمَ بَدْرٍ، إِذْ قَالَتْ إِحْدَاهُنَّ وَفِينَا نَبِيٌّ يَعْلَمُ مَا فِي غَدٍ. فَقَالَ \" دَعِي هَذِهِ، وَقُولِي بِالَّذِي كُنْتِ تَقُولِينَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5147، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5147 (Wedlock, Marriage (Nikaah)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5147، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5147 (Matrimonio (Nikaah)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Le Sahih al-Bukhari, n° 5147 (Mariage, Nikah), mentionne la paternité et la filiation. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
