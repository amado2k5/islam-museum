label: { ar: "الموطأ 754 — سعيد بن المسيب عن صدقة البراذين: وهل في الخيل من صدقة؟", en: "Muwatta 754", es: "Muwatta 754", fr: "Muwatta 754", ur: "موطا 754", tr: "Al-Muwatta 754 — Saeed bin Al-Musayyab'ın katır sadakası hakkındaki görüşü: Atlar için de sadaka verilmesi gerekir mi?", id: "Al-Muwatta 754 — Saeed bin Al-Musayyab tentang sedekah keledai: Apakah ada sedekah yang wajib diberikan kepada kuda?" }
text: "وهل في الخيل من صدقة؟"
summary:
  ar: "يرويه مالك عن عبد الله بن دينار، قال: سألت سعيد بن المسيب عن صدقة البراذين، فقال سعيد: وهل في الخيل من صدقة؟ ويذكر المحقق أن اسم سعيد سقط من نسخة م، وأنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (335) والشافعي في مسنده ومن طريقه البيهقي. {cite:muwatta-maruf-1997 p.373} {cite:muwatta-maruf-1997 p.374}"
  tr: "Malik, Abdullah ibn Dinar'dan rivayet ederek şöyle demiştir: \"Saeed ibn al-Musayyab'a katır zekâtı hakkında sordum ve Saeed şöyle dedi: At zekâtı var mı?\" Editör, Saeed'in adının M el yazmasında bulunmadığını ve bunun Malik'ten rivayetle Ebu Musab, Muhammed ibn al-Hasan al-Şeybani (335), Müsned'inde el-Şafiî ve onun aracılığıyla el-Beyhaki tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.373} {cite:muwatta-maruf-1997 s.374}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Dinar, yang berkata: Saya bertanya kepada Saeed ibn al-Musayyab tentang zakat atas keledai, dan Saeed berkata: Apakah ada zakat atas kuda? Editor menyebutkan bahwa nama Saeed tidak ada dalam manuskrip M, dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Muhammad ibn al-Hasan al-Shaybani (335), al-Shafi'i dalam Musnadnya, dan al-Bayhaqi melaluinya. {cite:muwatta-maruf-1997 p.373} {cite:muwatta-maruf-1997 p.374}"
