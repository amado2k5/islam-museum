text: "وهل في الخيل من صدقة؟"
summary:
  ar: "يرويه مالك عن عبد الله بن دينار، قال: سألت سعيد بن المسيب عن صدقة البراذين، فقال سعيد: وهل في الخيل من صدقة؟ ويذكر المحقق أن اسم سعيد سقط من نسخة م، وأنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (335) والشافعي في مسنده ومن طريقه البيهقي. {cite:muwatta-maruf-1997 p.373} {cite:muwatta-maruf-1997 p.374}"
