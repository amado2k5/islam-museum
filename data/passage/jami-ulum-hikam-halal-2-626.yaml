text: "جامع العلوم والحكم وقد ذكرنا فيما تقدم عن العلماء الورعين كأحمد ومالك توقِّي إطلاق لفظ الحرام على ما لم يتيقن تحريمُه ممَّا فيه نوعُ شبهةٍ أو اختلاف. وقال النَّخعي : كانوا يكرهون أشياء لا يُحرمونها، وقال ابنُ عون : قال …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 626، يذكر الحرام، وما حُرّم، والتحريم، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 626, that mentions the unlawful, what was made unlawful, prohibition, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 626 کا اقتباس جس میں حرام، جو حرام کیا گیا، تحریم، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
