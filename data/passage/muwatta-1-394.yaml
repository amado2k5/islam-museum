label: { ar: "الموطأ 394 — ابن عمر يركب إلى ذات النصب فيقصر، وبينها والمدينة أربعة برد", en: "Muwatta 394" }
summary:
  ar: "أثر يرويه مالك عن نافع عن سالم بن عبد الله أن عبد الله بن عمر ركب إلى ذات النصب فقصر الصلاة في مسيره ذلك؛ ويقول مالك إن بين ذات النصب والمدينة أربعة بُرد. وهو في باب ما يجب فيه قصر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي ويحيى بن بكير، وأن ابن أبي شيبة أخرجه من طريق أيوب عن نافع وفيه «وهي ستة عشر فرسخاً». {cite:muwatta-maruf-1997 p.210} {cite:muwatta-maruf-1997 p.211}"
