label: { ar: "الموطأ 394 — ابن عمر يركب إلى ذات النصب فيقصر، وبينها والمدينة أربعة برد", en: "Muwatta 394", es: "Muwatta 394", fr: "Muwatta 394", ur: "موطا 394", tr: "El-Muvatta 394 — İbn Ömer, Zhat el-Nasb'a gider ve namazlarını kısaltır; Zhat el-Nasb ile Medine arasında dört günlük yolculuk vardır.", id: "Al-Muwatta 394 — Ibnu Umar pergi ke Dhat al-Nasb dan mempersingkat salatnya, dan jarak antara tempat itu dan Madinah adalah empat hari perjalanan." }
summary:
  ar: "أثر يرويه مالك عن نافع عن سالم بن عبد الله أن عبد الله بن عمر ركب إلى ذات النصب فقصر الصلاة في مسيره ذلك؛ ويقول مالك إن بين ذات النصب والمدينة أربعة بُرد. وهو في باب ما يجب فيه قصر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي ويحيى بن بكير، وأن ابن أبي شيبة أخرجه من طريق أيوب عن نافع وفيه «وهي ستة عشر فرسخاً». {cite:muwatta-maruf-1997 p.210} {cite:muwatta-maruf-1997 p.211}"
  tr: "Malik'in, Nafi'den, o da Salim ibn Abdullah'tan rivayet ettiği bir hadiste, Abdullah ibn Umar'ın Zhatü'l-Nasb'a bindiği ve bu yolculuk sırasında namazlarını kısalttığı belirtilmektedir. Malik, Zhatü'l-Nasb ile Medine arasındaki mesafenin dört barid (birim mesafe) olduğunu söyler. Bu, namazı kısaltmanın farz olduğu durumlar bölümünde yer almaktadır. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd, Şafiî ve Yahya ibn Bukayr tarafından rivayet edildiğini ve İbn Abi Şeybe'nin de Ayyub'un zinciriyle Nafi'den naklettiğini, bu zincirde \"On altı fersahtır\" ifadesinin de yer aldığını belirtmektedir. {cite:muwatta-maruf-1997 s.210} {cite:muwatta-maruf-1997 s.211}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’ dari Salim ibn Abdullah menyatakan bahwa Abdullah ibn Umar pergi ke Dhat al-Nasb dan mempersingkat salatnya selama perjalanan tersebut. Malik mengatakan bahwa jarak antara Dhat al-Nasb dan Madinah adalah empat barid (satuan jarak). Ini terdapat dalam bab tentang situasi di mana mempersingkat salat adalah wajib. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, al-Shafi’i, dan Yahya ibn Bukayr, dan bahwa Ibn Abi Shaybah meriwayatkannya melalui sanad Ayyub atas otoritas Nafi’, yang mencakup frasa, “Jaraknya enam belas farsakh.” {cite:muwatta-maruf-1997 p.210} {cite:muwatta-maruf-1997 p.211}"
