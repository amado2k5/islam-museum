label: { ar: "صحيح البخاري 2645 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 2645 — what was made lawful; what is not lawful", ur: "صحیح بخاری 2645 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 2645 — Lo que se ha hecho lícito; lo que no es lícito" }
text: "حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا هَمَّامٌ، حَدَّثَنَا قَتَادَةُ، عَنْ جَابِرِ بْنِ زَيْدٍ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ قَالَ النَّبِيُّ فِي بِنْتِ حَمْزَةَ \" لاَ تَحِلُّ لِي، يَحْرُمُ مِنَ الرَّضَاعِ مَا يَحْرُمُ مِنَ النَّسَبِ، هِيَ بِنْتُ أَخِي مِنَ الرَّضَاعَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2645، يذكر ما أُحل، وما لا يحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 2645 (Witnesses), that mentions what was made lawful, what is not lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 2645، جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2645 (Testigos), menciona lo que es lícito, lo que no lo es y lo que es ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
