text: "… د ع : عَمْرُو بنُ الحارث بز المصطلق، أخر جويرية أم المؤمنين. يعد في الكوفيين، قاله ابن منده وأَبو نعيم هكذا، ورويا عنه أنه قال: قبض رسول اللّٰه علات ولم يخلف ديناراً... الحديث، ورويا أيضا عنه في قراءَة ابن مسعود. …"
