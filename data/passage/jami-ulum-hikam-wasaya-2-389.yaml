text: "الحديث الثامن عشر وقد امتئل معاذّ ما وصَّاه به النَّبيُّ وَلِي، وكان عمر قد بعثه على عَمَلٍ، فقدم وليس معه شيء، فعاتبته امرأتُه، فقال : كان معي ضاغط، يعني : من يُضيق عليَّ، ويمنعني من أخذ شيء، وإنَّما أراد معاذ …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 389، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
