label: { ar: "سنن ابن ماجه 4067 — الأب والأبوة", en: "Sunan Ibn Majah 4067 — the father and fatherhood", ur: "سنن ابن ماجہ 4067 — باپ اور والدیت", es: "Sunan Ibn Majah 4067 — El padre y la paternidad", fr: "Sunan Ibn Majah 4067 — Le père et la paternité" }
text: "… غَسَّانَ، مُحَمَّدُ بْنُ عَمْرٍو زُنَيْجٌ حَدَّثَنَا أَبُو تُمَيْلَةَ، حَدَّثَنَا خَالِدُ بْنُ عُبَيْدٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ ذَهَبَ بِي رَسُولُ اللَّهِ ـ إِلَى مَوْضِعٍ بِالْبَادِيَةِ قَرِيبٍ مِنْ مَكَّةَ فَإِذَا أَرْضٌ يَابِسَةٌ حَوْلَهَا رَمْلٌ فَقَالَ رَسُولُ اللَّهِ ـ \" تَخْرُجُ الدَّابَّةُ مِنْ هَذَا الْمَوْضِعِ \". فَإِذَا فِتْرٌ فِي شِبْرٍ. قَالَ ابْنُ بُرَيْدَةَ فَحَجَجْتُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4067، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4067 (Tribulations), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4067، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 4067 (Tribulaciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 4067 (Tribulations), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
