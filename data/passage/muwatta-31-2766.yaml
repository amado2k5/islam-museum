label: { ar: "الموطأ 2766 — صفوان بن سليم عن عطاء بن يسار: الرجل يستأذن على أمه", en: "Muwatta 2766", es: "Muwatta 2766", fr: "Muwatta 2766", ur: "موطا 2766", tr: "El-Muvatta 2766 — Safvan bin Salim, Ata bin Yaşar'dan rivayetle: Bir adam annesinin yanına girmek için izin istiyor.", id: "Al-Muwatta 2766 — Safwan bin Salim berdasarkan riwayat Ata bin Yasar: Seorang pria meminta izin untuk masuk ke rumah ibunya" }
summary:
  ar: "يروي مالك عن صفوان بن سليم عن عطاء بن يسار أن رجلا سأل رسول الله: أستأذن على أمي؟ فقال: نعم. قال الرجل: إني معها في البيت. فقال: استأذن عليها. فقال: إني خادمها. فقال: استأذن عليها، أتحب أن تراها عريانة؟ قال: لا. قال: فاستأذن عليها. ويذكر المحقق قول ابن عبد البر أنه مرسل صحيح مجتمع على صحته. {cite:muwatta-maruf-1997 p.552}"
  tr: "Malik, Safvan ibn Salim'den, o da Ata ibn Yasar'dan rivayet ettiğine göre, bir adam Allah'ın Resulü'ne sordu: \"Annemin yanına girmek için izin istemeli miyim?\" Resulullah \"Evet\" diye cevap verdi. Adam dedi ki: \"Ama ben onunla aynı evdeyim.\" Resulullah dedi ki: \"Yanına girmek için izin iste.\" Adam dedi ki: \"Ama ben onun hizmetçisiyim.\" Resulullah dedi ki: \"Yanına girmek için izin iste. Onu çıplak görmek ister misin?\" Adam dedi ki: \"Hayır.\" Resulullah dedi ki: \"Öyleyse yanına girmek için izin iste.\" Araştırmacı, İbn Abdül-Barr'ın bunun sahih, mursal bir hadis olduğunu ve oybirliğiyle sahih kabul edildiğini belirttiğini aktarıyor. {cite:muwatta-maruf-1997 s.552}"
  id: "Malik meriwayatkan dari Safwan ibn Salim, dari Ata ibn Yasar, bahwa seorang pria bertanya kepada Rasulullah: \"Haruskah saya meminta izin untuk masuk ke kamar ibu saya?\" Beliau menjawab: \"Ya.\" Pria itu berkata: \"Tetapi saya bersamanya di rumah.\" Beliau berkata: \"Mintalah izin untuk masuk ke kamarnya.\" Pria itu berkata: \"Tetapi saya adalah pelayannya.\" Beliau berkata: \"Mintalah izin untuk masuk ke kamarnya. Apakah kamu ingin melihatnya telanjang?\" Pria itu berkata: \"Tidak.\" Beliau berkata: \"Kalau begitu, mintalah izin untuk masuk ke kamarnya.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits ini sahih, mursal, dan secara bulat dianggap otentik. {cite:muwatta-maruf-1997 p.552}"
