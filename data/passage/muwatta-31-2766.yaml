summary:
  ar: "يروي مالك عن صفوان بن سليم عن عطاء بن يسار أن رجلا سأل رسول الله: أستأذن على أمي؟ فقال: نعم. قال الرجل: إني معها في البيت. فقال: استأذن عليها. فقال: إني خادمها. فقال: استأذن عليها، أتحب أن تراها عريانة؟ قال: لا. قال: فاستأذن عليها. ويذكر المحقق قول ابن عبد البر أنه مرسل صحيح مجتمع على صحته. {cite:muwatta-maruf-1997 p.552}"
