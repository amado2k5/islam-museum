label: { ar: "سنن النسائي 1843 — وصف المؤمن", en: "Sunan al-Nasa'i 1843 — a description of the believer", ur: "سنن نسائی 1843 — مومن کا وصف", es: "Sunan al-Nasa'i 1843 — una descripción del creyente" }
text: "… فَبَكَتْ أُمُّ أَيْمَنَ فَقَالَ لَهَا رَسُولُ اللَّهِ \" يَا أُمَّ أَيْمَنَ أَتَبْكِينَ وَرَسُولُ اللَّهِ عِنْدَكِ \". فَقَالَتْ مَا لِي لاَ أَبْكِي وَرَسُولُ اللَّهِ يَبْكِي فَقَالَ رَسُولُ اللَّهِ \" إِنِّي لَسْتُ أَبْكِي وَلَكِنَّهَا رَحْمَةٌ \". ثُمَّ قَالَ رَسُولُ اللَّهِ \" الْمُؤْمِنُ بِخَيْرٍ عَلَى كُلِّ حَالٍ تُنْزَعُ نَفْسُهُ مِنْ بَيْنِ جَنْبَيْهِ وَهُوَ يَحْمَدُ اللَّهَ عَزَّ وَجَلَّ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1843، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 1843 (The Book of Funerals), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 1843، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1843 (El Libro de los Funerales), menciona una descripción del creyente. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
