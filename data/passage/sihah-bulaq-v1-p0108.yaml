text: |-
  ٥٣٣
  واللصف والعنر والقناد الاصغر يقال هذا بلد به عض وأعضاض وبعير عاض برعى العض
  وبنوفلان معضون اذارعت ابلهم العض وقد أعضوا وأعضت الارض فهى معضة كثر
  العضعوض العوض وا-د الاعواض تقول منه عاضف فلان وأعاضى وعوضف
  وعاوضى اذا أعطاك العوض والاسم المعوضة واعتاض وتعوّض أى أخذ العوض ١
  واستعاض طلب العوض وأما قول الراجز هل لك والعارض منت عائض فهوفاعل
  بعنى مفعول مثل عبشة راصية بمعنى مرضية وعوض معناه الابديضم ويفتح بغير تنوين وهو
  لمستقبل من الزمان كما ان قط للماضى من الزمان لانك تقول عوض لا أفارقك تريد
  لا أفارقك أبدا كم تقول فى الماضى قط ما فارقتك ولا يجوز أن تقول عوض مافارقسك
  كمالا يجوز أن تقول قط ما أفارقك قال الاعشى بمدح رجلا
  رضيعى لبان ثدى أم تقاسما • باحم داج عوض لا نتفرّق
  يقول هو والندى رضعامن ثدى واحدو يقال لا آتبكء وض العائضين كانقول لا آتيك
  دهر الداهرين وقال ابن الكابي عوض في بيت الاعشى اسم صنم كان لبكرين واثل وأنشد
  حلفت عمائرات حول عوض * وانصاب ز كن لدى السعير ٢
  قال والسعيراسم صستم كان لعنزة خاصة ويقال افعل ذاك من ذى عوش كما يقال من ذى
  قبل ومن ذى أنف أى فيما يستقبل
  ⁦( فصل الفين غرض)⁩ الغرض الهدف الذى يرمى فيه وفهمت غرضك أى قصدلة
  والغرض أيضا الضر والملال وقد غرض بالمقام يغرض غرضا وأغرضه غيره ويقال أيضا
  غرضت اليه بمعى اشتقت اليه قال الاخفس تفسيرها غرضت من هؤلاء اليه لان العرب
  توصل بهذه الحروف كلها الفعل قال الشاعر
  فر يك لم يغرض فانى وناقتى • محجر الى أهل الحمى غرضان
