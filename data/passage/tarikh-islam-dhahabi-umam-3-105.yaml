text: "… فارسٌ فقال : قُتل أبو جَهْل، وعُتْبة، وشَيْبة، وزَمْعة، وأبو البَخْتَرِيّ، وأَمَيَّة بن خَلَف، فعدّ جماعة. فقالوا : إنّما لعب بك الشّيطان. فرُفع حديثُهُ إلى أبي جهل فقال : قد جثتمونا بكذِب بني المطّلب مع كذِب بني هاشم، ستَرَوْن غداً …"
