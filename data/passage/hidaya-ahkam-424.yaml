text: "باب الأَذَان وكذلك المرأةُ تُؤذِّن. ولا يُؤذَّنُ لصلاةِ قبلَ دخولِ وقتِها، ويُعادُ في الوقت. وقولُه: وإن لم يُعِدْ: أجزأه: يعني الصلاة ؛ لأنها جائزةٌ بدون الأذانِ والإقامة. قال: وكذلك المرأةُ تُؤذِّن، معناه: يُستحبُّ أن يُعادَ؛ ليقعَ علىٰ وجهِ السُّنَّة؛ لأنَّ …"
