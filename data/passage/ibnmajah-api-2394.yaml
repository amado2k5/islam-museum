label: { ar: "سنن ابن ماجه 2394 — الأب والأبوة", en: "Sunan Ibn Majah 2394 — the father and fatherhood", ur: "سنن ابن ماجہ 2394 — باپ اور والدیت", es: "Sunan Ibn Majah 2394 — El padre y la paternidad", fr: "Sunan Ibn Majah 2394 — le père et la paternité", tr: "Sunan İbn Majah 2394 — Baba ve Babalık", id: "Sunan Ibn Majah 2394 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا وَكِيعٌ، عَنْ سُفْيَانَ، عَنْ عَبْدِ اللَّهِ بْنِ عَطَاءٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ جَاءَتِ امْرَأَةٌ إِلَى النَّبِيِّ فَقَالَتْ يَا رَسُولَ اللَّهِ إِنِّي تَصَدَّقْتُ عَلَى أُمِّي بِجَارِيَةٍ وَإِنَّهَا مَاتَتْ. فَقَالَ \" آجَرَكِ اللَّهُ وَرَدَّ عَلَيْكِ الْمِيرَاثَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2394، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2394 (The Chapters on Charity), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2394، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2394 (Los capítulos sobre la caridad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2394 (Les chapitres sur la charité), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 2394 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2394, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
