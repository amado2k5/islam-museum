label: { ar: "الموطأ 1009 — سعيد بن المسيب عن أبي هريرة: أقبل من البحرين حتى كان بالربذة، فوجد ركباً من أهل العراق محرمين، فسألوه عن لحم صيد وجدوه عند أهل الربذة، فأمرهم بأكله، ثم شك فيما أمرهم به، فلما قدم المدينة ذكر ذلك لعمر، فقال عمر: لو أمرتهم بغير ذلك لفعلت بك", en: "Muwatta 1009" }
text: "لو أمرتهم بغير ذلك لفعلت بك"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يحدث عن أبي هريرة، أنه أقبل من البحرين حتى كان بالربذة، فوجد ركباً من أهل العراق محرمين، فسألوه عن لحم صيد وجدوه عند أهل الربذة، فأمرهم بأكله. ثم إنه شك فيما أمرهم به، فلما قدم المدينة ذكر ذلك لعمر بن الخطاب، فقال عمر: ماذا أمرتهم به؟ فقال: أمرتهم بأكله. فقال عمر: لو أمرتهم بغير ذلك لأوجعتك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1140) وسويد (573). {cite:muwatta-maruf-1997 p.473}"
