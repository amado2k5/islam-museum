label: { ar: "الموطأ 1009 — سعيد بن المسيب عن أبي هريرة: أقبل من البحرين حتى كان بالربذة، فوجد ركباً من أهل العراق محرمين، فسألوه عن لحم صيد وجدوه عند أهل الربذة، فأمرهم بأكله، ثم شك فيما أمرهم به، فلما قدم المدينة ذكر ذلك لعمر، فقال عمر: لو أمرتهم بغير ذلك لفعلت بك", en: "Muwatta 1009", es: "Muwatta 1009", fr: "Muwatta 1009", ur: "موطا 1009", tr: "El-Muvatta 1009 — Sa'id ibn el-Musayyab, Ebu Hurayra'dan rivayet eder: Bahreyn'den Rabbeda'ya kadar geldi ve orada ihramlı halde Irak'tan bir grup insan buldu. Rabbeda halkının yanında buldukları av etini sordular, o da onlara yemelerini emretti. Sonra onlara emrettiği şeyden şüphelendi. Medine'ye vardığında bunu Ömer'e anlattı ve Ömer şöyle dedi: Eğer onlara başka türlü emretmiş olsaydın, sana aynısını yapardım.", id: "Al-Muwatta 1009 — Sa’id ibn al-Musayyab meriwayatkan dari Abu Hurayrah: Ia datang dari Bahrain hingga sampai di al-Rabadhah, dan ia menemukan sekelompok orang dari Irak dalam keadaan ihram. Mereka bertanya kepadanya tentang daging buruan yang mereka temukan bersama penduduk al-Rabadhah, lalu ia memerintahkan mereka untuk memakannya. Kemudian ia ragu-ragu tentang apa yang telah diperintahkannya kepada mereka. Ketika ia tiba di Madinah, ia menceritakan hal ini kepada Umar, dan Umar berkata: Jika engkau memerintahkan mereka untuk berbuat sebaliknya, aku akan berbuat sebaliknya kepadamu." }
text: "لو أمرتهم بغير ذلك لفعلت بك"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يحدث عن أبي هريرة، أنه أقبل من البحرين حتى كان بالربذة، فوجد ركباً من أهل العراق محرمين، فسألوه عن لحم صيد وجدوه عند أهل الربذة، فأمرهم بأكله. ثم إنه شك فيما أمرهم به، فلما قدم المدينة ذكر ذلك لعمر بن الخطاب، فقال عمر: ماذا أمرتهم به؟ فقال: أمرتهم بأكله. فقال عمر: لو أمرتهم بغير ذلك لأوجعتك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1140) وسويد (573). {cite:muwatta-maruf-1997 p.473}"
  tr: "Malik, bunu Yahya ibn Sa'id'den rivayet etmiştir. Yahya ibn Sa'id, Sa'id ibn al-Musayyab'ın Ebu Hurayra'dan naklettiğine göre, Bahreyn'den Rabbeda'ya kadar gelmiş ve orada ihramlı bir grup Iraklı ile karşılaşmıştır. Bu kişiler, Rabbeda halkının yanında buldukları av etini sormuşlar ve o da onlara eti yemelerini emretmiştir. Ancak daha sonra, onlara ne yapmalarını emrettiği konusunda şüpheye düşmüştür. Medine'ye vardığında bunu Ömer ibn al-Khattab'a anlatmış, Ömer ona \"Onlara ne yapmalarını emrettin?\" diye sormuş ve o da \"Yemelerini emrettim\" diye cevap vermiştir. Ömer, \"Başka bir şey emretmiş olsaydın, seni çok ağır cezalandırırdım\" demiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1140) ve Suveyd (573) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.473}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, yang mendengar Sa'id ibn al-Musayyab meriwayatkan dari Abu Hurayrah bahwa ia datang dari Bahrain hingga sampai di al-Rabadhah, di mana ia menemukan sekelompok orang dari Irak dalam keadaan ihram. Mereka bertanya kepadanya tentang daging buruan yang mereka temukan bersama penduduk al-Rabadhah, dan ia memerintahkan mereka untuk memakannya. Kemudian ia ragu-ragu tentang apa yang telah ia perintahkan kepada mereka. Ketika ia tiba di Madinah, ia menceritakan hal ini kepada Umar ibn al-Khattab, yang bertanya, \"Apa yang kau perintahkan kepada mereka?\" Ia menjawab, \"Aku memerintahkan mereka untuk memakannya.\" Umar berkata, \"Jika kau memerintahkan mereka untuk melakukan sebaliknya, aku akan menghukummu dengan berat.\" Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab (1140) dan Suwayd (573). {cite:muwatta-maruf-1997 p.473}"
