text: "… حمّيات تتبع الحمرة وهذه الحمّيات تتعقبها نداوة تنثر عن البدن، ويكون النبض فيها عظيماً سريعاً متواتراً للامتلاء والحرارة، ويكون البول مائياً أبيض لميلان المواد إلى الأورام، والقروح. المعالجات: يجب أن يتقدّم فيها بالفصد والإسهال، ويداوى الورم بما يجب في بابه، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 21، يذكر الحمى والوعك، وأسماء الأمراض، والبيمارستان وصناعة الطب، والجراحة والختان والجبائر، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 21, that mentions fever, named diseases, the hospital and the medical craft, surgery, circumcision and splints, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 21 کا اقتباس جس میں بخار، بیماریوں کے نام، بیمارستان، جراحت، ختنہ اور پٹیاں، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 21, que menciona la fiebre, enfermedades específicas, el hospital y la práctica médica, la cirugía, la circuncisión y las férulas, y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 21, qui mentionne la fièvre, les maladies nommées, l'hôpital et l'art médical, la chirurgie, la circoncision et les attelles, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 21. sayfasından, ateş ve hastalık, hastalıkların isimleri, hastane ve tıp mesleği, cerrahi, sünnet, atel ve tedaviden bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 21, yang menyebutkan demam dan penyakit, nama-nama penyakit, rumah sakit dan profesi medis, pembedahan, sunat, bidai, dan pengobatan; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
