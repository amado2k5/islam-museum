text: "… حمّيات تتبع الحمرة وهذه الحمّيات تتعقبها نداوة تنثر عن البدن، ويكون النبض فيها عظيماً سريعاً متواتراً للامتلاء والحرارة، ويكون البول مائياً أبيض لميلان المواد إلى الأورام، والقروح. المعالجات: يجب أن يتقدّم فيها بالفصد والإسهال، ويداوى الورم بما يجب في بابه، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 21، يذكر الحمى والوعك، وأسماء الأمراض، والبيمارستان وصناعة الطب، والجراحة والختان والجبائر، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 21, that mentions fever, named diseases, the hospital and the medical craft, surgery, circumcision and splints, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 21 کا اقتباس جس میں بخار، بیماریوں کے نام، بیمارستان، جراحت، ختنہ اور پٹیاں، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
