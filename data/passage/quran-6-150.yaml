text: "قُلْ هَلُمَّ شُهَدَآءَكُمُ ٱلَّذِينَ يَشْهَدُونَ أَنَّ ٱللَّهَ حَرَّمَ هَـٰذَا ۖ فَإِن شَهِدُوا۟ فَلَا تَشْهَدْ مَعَهُمْ ۚ وَلَا تَتَّبِعْ أَهْوَآءَ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا وَٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ وَهُم بِرَبِّهِمْ يَعْدِلُونَ"
text_search: "قل هلم شهداءكم الذين يشهدون أن الله حرم هذا ۖ فإن شهدوا فلا تشهد معهم ۚ ولا تتبع أهواء الذين كذبوا بآياتنا والذين لا يؤمنون بالآخرة وهم بربهم يعدلون"
translations:
  en: { text: "Say: Come, bring your witnesses who can bear witness that Allah forbade (all) this. And if they bear witness, do not thou bear witness with them. Follow thou not the whims of those who deny Our revelations, those who believe not in the Hereafter and deem (others) equal with their Lord.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کہو کہ اپنے گواہوں کو لاؤ جو بتائیں کہ خدا نے یہ چیزیں حرام کی ہیں پھر اگر وہ (آ کر) گواہی دیں تو تم ان کے ساتھ گواہی نہ دینا اور نہ ان لوگوں کی خواہشوں کی پیروی کرنا جو ہماری آیتوں کو جھٹلاتے ہیں اور آخرت پر ایمان نہیں لاتے اور (بتوں کو) اپنے پروردگار کے برابر ٹھہراتے ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
