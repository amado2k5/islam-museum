text: "… :، ولا يستحيل أن يكون الشىء مَوَابًا فى حقَّ إنسانِ وخَطَأ فى حَقّ غيره، فيكون من اجْتَهَدَ فى مَسألة فأداء اجتهادُه إلى التحليل مضيباً فى استحلاله، وآخر احتهد فأدًا.، اجتهادُه ونظره إلى تجرعها، مُصيباً فى تحريمها، وإما المُحاَلُ أن يُحْكم …"
summary:
