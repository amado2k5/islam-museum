label: { ar: "جامع الترمذي 1061 — القراء", en: "Jami' al-Tirmidhi 1061 — the readers", ur: "جامع ترمذی 1061 — قراء", es: "Jami' al-Tirmidhi 1061 — los lectores", fr: "Jami' al-Tirmidhi 1061 — les lecteurs" }
text: "… رَسُولُ اللَّهِ \" مَنْ قَدَّمَ ثَلاَثَةً لَمْ يَبْلُغُوا الْحُلُمَ كَانُوا لَهُ حِصْنًا حَصِينًا مِنَ النَّارِ \". قَالَ أَبُو ذَرٍّ قَدَّمْتُ اثْنَيْنِ. قَالَ \" وَاثْنَيْنِ \". فَقَالَ أُبَىُّ بْنُ كَعْبٍ سَيِّدُ الْقُرَّاءِ قَدَّمْتُ وَاحِدًا قَالَ \" وَوَاحِدًا وَلَكِنْ إِنَّمَا ذَاكَ عِنْدَ الصَّدْمَةِ الأُولَى \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ. وَأَبُو عُبَيْدَةَ لَمْ يَسْمَعْ مِنْ أَبِيهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1061، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 1061 (The Book on Jana''iz (Funerals)), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 1061، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1061 (El Libro de los Funerales), menciona a los lectores. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1061 (Livre sur les funérailles), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran le répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
