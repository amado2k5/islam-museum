text: |-
  *⁦(باب القاف)⁩.
  الاضيق صارت الياء واوالسكوخاوضمة ماقبلها
  صل الطاء بق الطبق واحد الاطباق وتولهم وافق شنّ طبقة قال ابن
  السكيت هوشن بن أفصى بن عبد القيس وطبق حىّ من ايادوكانت شن لا يقام لهافواقعتها
  طبق فانتصفت منها فقيسل وافق شن طبقه وافقه فاعتده ومضى طبق من الليل وطبق من
  النهارأى .عظم منه قال ابن أمر
  وتواهقت أخفافها طبقا • والفل لم ينضل ولم يكر
  والطبق عظم رقبق يفصل بين الفقارين قال الشاعر
  ألاذهب الخداع فلاخداعا • وأبدى البف عن طبق نفاعا
  وبنت طبق سلحفاة ومنه قواهم الاداهية احدى بنات طبق وتزعم العرب أنها تيض نسها
  وتسعين بيضة كلها سلاحف وتبيض بيضة تنقف عن أسود ويقال أناناطبق من الناس
  وطبق من الجراد أى جماعة قال الاموى اذا ولدت الغتم بعضها بعد بعض قبل قد ولذتها
  الرجيلاء وولدتها لمبقا وطبقة وطبقات الناس فى عرابهم والسموات طباق أى بعضها
  فوق بعض وطباق الارض ماءلاها ومطرطبق أى عام قال الشاعر
  ديمة هطلا فيها وطف • طبق الارض تحزى وتدر
  والطابق الحال ومنه قوله تعائى لتركين طبقاء ن طبق أى خالاعن حال يوم القيامة والطباق
  شجر قال تأجط شرًا
  كانما حتحنوا حداق وادمه * أو أمّ خشف بذى شثّ وطباق
  ويقال بجل طباقاء للذى لا يضرب والطباقا من الرجال العي قال ججيل بن معمر
  طباقا لم يشهد خصو ما ولم يقد • ركابا الى أكوارها حين تعكف
  ويروى عياياه وهمابعنى وطبقت يده بالسكسرطبقا اذا كانت لا تنيسط ويذه طبقة والتطبيق
  فى الصلاة جعل اليدين بين الفخذين فى الركوع وطبق السسيف اذا أصاب المفصل فأبان
  العضو قال الشاعر يصف سيفا• يصم أحيانا وحية ايظبق• ومنه قواهم المرجل اذا أصاب
  الحجة انه يطبق المفصل وتطبيقالفرس تقريبه فى العدو وطبق الغيم نطبيقا اذا أصاب بمطره
  جميع الارض يقال بحابة مطبقة والمطابقة الموافة والتطابق الاتقاق وطابقت بين الشيثين
  اذا جعلتهما على حذو واحد وألزقتهما قال ابن السكيت وقد طابق فلان بعنى مرن والمطابقة.
  مشى المقيدومطابقة الفرس فى حريه وضع رجليسه، واضع يديه وأطبقوا لى الامر أى
  أصفقوا عليه وأطبقت الشئ أى غطيته وجعلته مطبقا فتطيق هو ومنهة ولهم لوتطبقت
  السماء على الارض مافعات كذا والحمى المطبقة هى الدائمة لا تفارق ليلاولانهارا والحروف
  المطبقة أربعة الصاد والضاد والطاء والظاء واطابق الآجر الكبير فارسى معرب
  رق) الطريق السبيل يذكرويؤنت تقول الطريق الاعظم والطر يق العفاص وايهع
  أطرقة وطرق قال الشاعر
  فلما جزمت به قربق • تيممت أطرقة أو خليفا
  قال أبوعر والطريقة أطول ما يكون من النخسل بلغة اليمامة حكاها عنه يعقوب والهع
  جرج وطقع اهرف أيف
  وعبارة القاموس
  (ا (لذ.خ المقل تضيف
  أنه بالها ونسها وطبقة امرأة
  عاقلة تزقح بها رجل عاقل ومنه
  وافق سْن طبقة أوحسم قوم كان
  اهسم وعاءأدم قتشنن فجعلواله
  طبقافوافة-← أوقبيلة من اياد
  كانت لا تطاق فأوقعت بهساشن
