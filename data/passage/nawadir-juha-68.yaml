text: "… على القاضي أحدثَ كلبٌ في شارعٍ بين بيتين، فاختلف صاحبا البيتين فيمن يجب عليه أن يرفع الروث، وتنازعا؛ وانتهى أمرهما إلى القاضي فدخلا عليه، وجحا عنده. فلما حدَّثاه بخبرهما، أراد القاضي أَنْ يُداعِبَ جحا، قال له : افصل أنت هذه …"
summary:
  ar: "لوّث روث الكلاب زقاقًا مشتركًا، فرفع الجيران الأمر إلى القاضي الذي طلب من جحا أن يحكم، فقال جحا إن الروث على الطريق العام فتنظيفه من شأن القاضي. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  en: "Dog's dung fouls a shared lane; the neighbours take it to the judge, who asks Juha to decide; Juha says the dung is on the public road, so it is the judge's job to clear it. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  ur: "کتوں کی گندگی نے مشترکہ گلی کو گندا کر دیا؛ پڑوسی معاملہ قاضی کے پاس لے گئے جس نے جحا سے فیصلہ کرنے کو کہا؛ جحا نے کہا کہ گندگی عام راستے پر ہے، اس لیے اسے صاف کرانا قاضی کا کام ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  fr: "Des crottes de chien souillent une ruelle commune ; les voisins portent l'affaire devant le juge, qui demande à Juha de trancher ; Juha dit que les crottes sont sur la voie publique et qu'il revient donc au juge de les faire enlever. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  es: "Excrementos de perro ensucian un callejón compartido; los vecinos llevan el asunto al juez, que le pide a Juha que decida; Juha dice que los excrementos están en la vía pública, así que corresponde al juez hacerlos retirar. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  tr: "Komşular ortak bir sokağı köpek dışkısıyla kirlettiği için durumu hakime götürdüler ve hakim Juha'dan karar vermesini istedi. Juha, dışkıların halka açık yolda olduğunu, dolayısıyla temizliğinin hakimin sorumluluğunda olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 37}"
  id: "Kotoran anjing mengotori lorong bersama, sehingga para tetangga membawa masalah ini ke hakim, yang meminta Juha untuk memutuskan. Juha menjawab bahwa kotoran tersebut berada di jalan umum, sehingga membersihkannya adalah tanggung jawab hakim. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
