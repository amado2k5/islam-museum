text: "ي شهر بن حوشب، عن عبد الرحمن بن غنم، وهو الذي بعثه عمر بن الخطاب إلى الشام يفقه الناس أن معاذ بن جبل حدثه عن النبي لللهم. أنه ركب يوما على حمار له، يقال له: يعفور، رسنه من ليف، ثم"
