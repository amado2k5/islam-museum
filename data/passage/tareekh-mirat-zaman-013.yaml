text: "اق وهشام وعامة العلماء، فإنهم قالوا : أول فتح أتى عمر ابن الخطاب من الشام فتح اليرموك على عشرين ليلة من وفاة أبي بكر قليته. وقال الهيثم: كان أبو بكر قد هيا لكل كورة أميرا، ومرض في جمادى الأولى وتوفي"
