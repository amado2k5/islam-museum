label: { ar: "الموطأ 2697 — حميد بن مالك بن خثيم: أبو هريرة يطعم الضيوف من أكل أمه ويوصي براعي الغنم", en: "Muwatta 2697" }
summary:
  ar: "يروي مالك عن محمد بن عمرو بن حلحلة عن حميد بن مالك بن خثيم أنه قال: كنت جالسا مع أبي هريرة بأرضه بالعقيق، فأتاه قوم من أهل المدينة على دواب فنزلوا عنده، فقال أبو هريرة: اذهب إلى أمي فقل: إن ابنك يقرئك السلام ويقول: أطعمينا شيئا. فوضعت ثلاثة أقراص في صحفة، وشيئا من زيت وملح، وحملتها إليهم، فكبّر أبو هريرة وقال: الحمد لله الذي أشبعنا من الخبز بعد أن لم يكن طعامنا إلا الأسودين الماء والتمر. فلما انصرفوا قال: يا ابن أخي، أحسن إلى غنمك، وامسح الرغام عنها، وأطب مراحها، وصلّ في ناحيتها، فإنها من دواب الجنة. والذي نفسي بيده ليوشكن أن يأتي على الناس زمان تكون الثلة من الغنم أحب إلى صاحبها من دار مروان. {cite:muwatta-maruf-1997 p.522} {cite:muwatta-maruf-1997 p.523}"
