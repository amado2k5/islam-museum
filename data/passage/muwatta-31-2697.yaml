label: { ar: "الموطأ 2697 — حميد بن مالك بن خثيم: أبو هريرة يطعم الضيوف من أكل أمه ويوصي براعي الغنم", en: "Muwatta 2697", es: "Muwatta 2697", fr: "Muwatta 2697", ur: "موطا 2697", tr: "El-Muvatta 2697 — Humaid bin Malik bin Khuthaym: Ebu Hurayra, misafirlerine annesinin yemeğinden ikram eder ve çobanı tavsiye eder.", id: "Al-Muwatta 2697 — Humaid bin Malik bin Khuthaym: Abu Hurairah memberi makan tamu dengan makanan ibunya dan menganjurkan penggembala." }
summary:
  ar: "يروي مالك عن محمد بن عمرو بن حلحلة عن حميد بن مالك بن خثيم أنه قال: كنت جالسا مع أبي هريرة بأرضه بالعقيق، فأتاه قوم من أهل المدينة على دواب فنزلوا عنده، فقال أبو هريرة: اذهب إلى أمي فقل: إن ابنك يقرئك السلام ويقول: أطعمينا شيئا. فوضعت ثلاثة أقراص في صحفة، وشيئا من زيت وملح، وحملتها إليهم، فكبّر أبو هريرة وقال: الحمد لله الذي أشبعنا من الخبز بعد أن لم يكن طعامنا إلا الأسودين الماء والتمر. فلما انصرفوا قال: يا ابن أخي، أحسن إلى غنمك، وامسح الرغام عنها، وأطب مراحها، وصلّ في ناحيتها، فإنها من دواب الجنة. والذي نفسي بيده ليوشكن أن يأتي على الناس زمان تكون الثلة من الغنم أحب إلى صاحبها من دار مروان. {cite:muwatta-maruf-1997 p.522} {cite:muwatta-maruf-1997 p.523}"
  tr: "Malik, Muhammed ibn Amr ibn Halhala'dan, o da Humaid ibn Malik ibn Khuthaym'dan rivayet ettiğine göre şöyle demiştir: \"Akik'te, Ebu Hurayra'nın arazisinde onunla oturuyordum. Medine'den bazı insanlar bineklerle gelip indiler. Ebu Hurayra, 'Anneme gidin ve ona deyin ki: Oğlunuz size selam gönderiyor ve bize yiyecek bir şeyler verin diyor.' Ben de bir kaseye üç somun ekmek, biraz yağ ve tuz koyup onlara götürdüm. Ebu Hurayra, 'Allah'a hamd olsun ki, yiyeceğimiz sadece iki siyah şey, su ve hurma iken, bize ekmekle doydu!' dedi. Onlar gittikten sonra, 'Ey yeğenim, koyunlarına iyi davran, üzerlerindeki kiri temizle, ağıllarını temiz tut ve yanlarında namaz kıl, çünkü onlar cennet hayvanlarındandır. Canım elinde olan Allah'a yemin ederim ki, yakında öyle bir zaman gelecek ki, bir koyun sürüsü sahibine Mervan'ın evinden daha değerli olacak.\" {cite:muwatta-maruf-1997 s.522} {cite:muwatta-maruf-1997 s.523}"
  id: "Malik meriwayatkan dari Muhammad ibn Amr ibn Halhala, dari Humaid ibn Malik ibn Khuthaym, yang berkata: Aku sedang duduk bersama Abu Hurayra di tanahnya di al-Aqiq ketika beberapa orang dari Madinah datang kepadanya dengan menunggang kuda dan kemudian turun. Abu Hurayra berkata: Pergilah kepada ibuku dan katakan padanya: Putramu mengirimkan salam kepadamu dan berkata: Beri kami makan. Maka aku memasukkan tiga potong roti ke dalam mangkuk, bersama dengan sedikit minyak dan garam, dan membawanya kepada mereka. Abu Hurayra berseru: Segala puji bagi Allah yang telah memberi kami makan roti setelah makanan kami hanyalah dua hal hitam: air dan kurma. Ketika mereka pergi, dia berkata: Wahai keponakanku, perlakukanlah domba-dombamu dengan baik, bersihkan kotorannya, jagalah kandangnya tetap bersih, dan shalatlah di dekatnya, karena mereka termasuk hewan-hewan di Surga. Demi Dia yang jiwaku berada di tangan-Nya, suatu masa akan segera datang bagi manusia ketika sekawanan domba akan lebih disayangi pemiliknya daripada rumah Marwan. {kutip:muwatta-maruf-1997 hal.522} {kutip:muwatta-maruf-1997 hal.523}"
