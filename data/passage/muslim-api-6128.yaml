label: { ar: "صحيح مسلم 6128 — الأب والأبوة", en: "Sahih Muslim 6128 — the father and fatherhood", ur: "صحیح مسلم 6128 — باپ اور والدیت", es: "Sahih Muslim 6128 — El padre y la paternidad" }
text: "… - قَالَ أَبُو بَكْرٍ حَدَّثَنَا أَسْوَدُ بْنُ عَامِرٍ، - حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، وَعَنْ ثَابِتٍ، عَنْ أَنَسٍ، أَنَّ النَّبِيَّ مَرَّ بِقَوْمٍ يُلَقِّحُونَ فَقَالَ \" لَوْ لَمْ تَفْعَلُوا لَصَلُحَ \". قَالَ فَخَرَجَ شِيصًا فَمَرَّ بِهِمْ فَقَالَ \" مَا لِنَخْلِكُمْ \". قَالُوا قُلْتَ كَذَا وَكَذَا قَالَ \" أَنْتُمْ أَعْلَمُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6128، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6128 (The Book of Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6128، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6128 (El Libro de las Virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
