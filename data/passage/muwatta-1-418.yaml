label: { ar: "الموطأ 418 — عائشة تصلي الضحى ثماني ركعات: لو نشر لي أبواي ما تركتهن", en: "Muwatta 418", es: "Muwatta 418", fr: "Muwatta 418", ur: "موطا 418", tr: "Al-Muwatta 418 — Aişe sekiz rekat Duha namazı kılardı: “Anne babam diriltilse bile onları terk etmezdim.”", id: "Al-Muwatta 418 — Aisyah biasa mengerjakan shalat Dhuha delapan rakaat: “Jika kedua orang tuaku dibangkitkan, aku tidak akan meninggalkan mereka.”" }
text: "لو نشر لي أبواي ما تركتهن"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن عائشة، في باب صلاة الضحى: كانت تصلي الضحى ثماني ركعات ثم تقول إنه لو أُحيي لها أبواها ما تركتهن. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.218}"
  tr: "Malik'in, Zeyd ibn Aslam'dan, o da Aişe'den rivayet ettiği, Duha namazı bölümündeki bir rivayete göre: Aişe sekiz rekat Duha namazı kılardı ve sonra, eğer anne babası diriltilirse onları terk etmeyeceğini söylerdi. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Abdül-Razzak tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.218}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Zayd ibn Aslam dari Aisyah, dalam surat tentang shalat Dhuha: Beliau biasa mengerjakan shalat Dhuha delapan rakaat dan kemudian berkata bahwa jika orang tuanya dihidupkan kembali, beliau tidak akan meninggalkan mereka. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, dan Abd al-Razzaq. {cite:muwatta-maruf-1997 p.218}"
