summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن عائشة، في باب صلاة الضحى: كانت تصلي الضحى ثماني ركعات ثم تقول إنه لو أُحيي لها أبواها ما تركتهن. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.218}"
