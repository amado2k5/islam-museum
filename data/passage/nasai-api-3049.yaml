label: { ar: "سنن النسائي 3049 — الأب والأبوة", en: "Sunan al-Nasa'i 3049 — the father and fatherhood", ur: "سنن نسائی 3049 — باپ اور والدیت", es: "Sunan al-Nasa'i 3049 — El padre y la paternidad" }
text: "… آدَمَ بْنِ سُلَيْمَانَ، قَالَ حَدَّثَنَا عَبْدُ الرَّحِيمِ بْنُ سُلَيْمَانَ، عَنْ عُبَيْدِ اللَّهِ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ أُمِّ الْمُؤْمِنِينَ، عَائِشَةَ قَالَتْ وَدِدْتُ أَنِّي اسْتَأْذَنْتُ رَسُولَ اللَّهِ كَمَا اسْتَأْذَنَتْهُ سَوْدَةُ فَصَلَّيْتُ الْفَجْرَ بِمِنًى قَبْلَ أَنْ يَأْتِيَ النَّاسُ وَكَانَتْ سَوْدَةُ امْرَأَةً ثَقِيلَةً ثَبِطَةً فَاسْتَأْذَنَتْ رَسُولَ اللَّهِ فَأَذِنَ لَهَا فَصَلَّتِ الْفَجْرَ بِمِنًى وَرَمَتْ قَبْلَ أَنْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3049، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3049 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3049، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3049 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
