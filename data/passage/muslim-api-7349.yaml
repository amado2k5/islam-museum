label: { ar: "صحيح مسلم 7349 — ما حُرّم", en: "Sahih Muslim 7349 — what was made unlawful", ur: "صحیح مسلم 7349 — جو حرام کیا گیا" }
text: "… يَهُودِيٌّ \". وَقَدْ أَسْلَمْتُ. قَالَ \" وَلاَ يُولَدُ لَهُ \". وَقَدْ وُلِدَ لِي. وَقَالَ \" إِنَّ اللَّهَ قَدْ حَرَّمَ عَلَيْهِ مَكَّةَ \". وَقَدْ حَجَجْتُ. قَالَ فَمَا زَالَ حَتَّى كَادَ أَنْ يَأْخُذَ فِيَّ قَوْلُهُ. قَالَ فَقَالَ لَهُ أَمَا وَاللَّهِ إِنِّي لأَعْلَمُ الآنَ حَيْثُ هُوَ وَأَعْرِفُ أَبَاهُ وَأُمَّهُ. قَالَ وَقِيلَ لَهُ أَيَسُرُّكَ أَنَّكَ ذَاكَ الرَّجُلُ قَالَ فَقَالَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 7349، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 7349 (The Book of Tribulations and Portents of the Last Hour), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 7349، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
