  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 1441, that mentions the organs of the body, the opening of the chest; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 1441 کا اقتباس جس میں اعضائے بدن، شقِّ صدر کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
