  tr: "El-Beyhaki'nin \"Peygamberliğin Delilleri\" adlı eserinin 1. cildinin 1441. sayfasından, vücut parçaları ve göğsün yarılmasıyla ilgili bir bölüm; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
