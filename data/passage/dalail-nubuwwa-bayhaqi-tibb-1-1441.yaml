text: "قَتَله وَشَقَّ بَطْنَهُ، فَذَهَبَ بِكَبِدِهِ إلى هند بنت عتبة في نَذْرٍ نَذَرتْهُ حين قَتَلَ أباها يوم بدر، وأقبل المسلمون على قتلاهم يدفنونهم -م. قال : وخرج نساءً من المهاجزات والأنصار فَحَمَلْنَ الماء والطعام على ظهورهن، وخرجت فيهن فاطمة بنت رسول …"
