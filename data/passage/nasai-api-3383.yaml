label: { ar: "سنن النسائي 3383 — الرخصة", en: "Sunan al-Nasa'i 3383 — the concession (rukhsa)", ur: "سنن نسائی 3383 — رخصت", fr: "Sunan al-Nasa'i 3383 — la dispense (rukhsa)", es: "Sunan al-Nasa'i 3383 — la dispensa (rukhsa)" }
text: "أَخْبَرَنَا عَلِيُّ بْنُ حُجْرٍ، قَالَ حَدَّثَنَا شَرِيكٌ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَامِرِ بْنِ سَعْدٍ، قَالَ دَخَلْتُ عَلَى قَرَظَةَ بْنِ كَعْبٍ وَأَبِي مَسْعُودٍ الأَنْصَارِيِّ فِي عُرْسٍ وَإِذَا جَوَارٍ يُغَنِّينَ فَقُلْتُ أَنْتُمَا صَاحِبَا رَسُولِ اللَّهِ وَمِنْ أَهْلِ بَدْرٍ يُفْعَلُ هَذَا عِنْدَكُمْ. فَقَالاَ اجْلِسْ إِنْ شِئْتَ فَاسْمَعْ مَعَنَا وَإِنْ شِئْتَ اذْهَبْ قَدْ رُخِّصَ لَنَا فِي اللَّهْوِ عِنْدَ الْعُرْسِ."
summary:
  ar: "حديث في سنن النسائي، رقم 3383، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 3383 (The Book of Marriage), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 3383، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 3383, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 3383, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
