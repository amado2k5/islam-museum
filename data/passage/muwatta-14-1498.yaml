label: { ar: "الموطأ 1498 — سهل بن سعد الساعدي: جاءت امرأة توهب نفسها للنبي، فزوجه إياها بما معه من القرآن إذ لم يجد صداقا", en: "Muwatta 1498" }
text: "قَدْ أنْكَحْتُكهَا بِمَا مَعكَ مِن الْقُرْآنِ"
summary:
  ar: "يروي مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي أن رسول الله جاءته امرأة فقالت إني قد وهبت نفسي لك، فقامت قياما طويلا، فقام رجل فقال زوجنيها إن لم يكن لك بها حاجة. فقال هل عندك من شيء تصدقها إياه؟ قال ما عندي إلا إزاري. قال إن أعطيتها إياه جلست لا إزار لك، فالتمس شيئا، فلم يجد، فقال هل معك من القرآن شيء؟ قال نعم سور سماها، فقال قد أنكحتكها بما معك من القرآن. {cite:muwatta-maruf-1997 p.30}"
