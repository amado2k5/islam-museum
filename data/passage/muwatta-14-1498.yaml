label: { ar: "الموطأ 1498 — سهل بن سعد الساعدي: جاءت امرأة توهب نفسها للنبي، فزوجه إياها بما معه من القرآن إذ لم يجد صداقا", en: "Muwatta 1498", es: "Muwatta 1498", fr: "Muwatta 1498", ur: "موطا 1498", tr: "El-Muvatta 1498 — Sahl ibn Saad el-Saadi: Bir kadın Peygamberimize kendini nikah teklif etti. Peygamberimiz mehir bulamadığı için, elindeki Kur'an ile onu kendisine nikahladı.", id: "Al-Muwatta 1498 — Sahl ibn Saad al-Saadi: Seorang wanita datang menawarkan diri kepada Nabi, lalu beliau menikahkan wanita itu dengan Al-Qur'an yang dimilikinya, karena beliau tidak dapat menemukan mas kawin." }
text: "قَدْ أنْكَحْتُكهَا بِمَا مَعكَ مِن الْقُرْآنِ"
summary:
  ar: "يروي مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي أن رسول الله جاءته امرأة فقالت إني قد وهبت نفسي لك، فقامت قياما طويلا، فقام رجل فقال زوجنيها إن لم يكن لك بها حاجة. فقال هل عندك من شيء تصدقها إياه؟ قال ما عندي إلا إزاري. قال إن أعطيتها إياه جلست لا إزار لك، فالتمس شيئا، فلم يجد، فقال هل معك من القرآن شيء؟ قال نعم سور سماها، فقال قد أنكحتكها بما معك من القرآن. {cite:muwatta-maruf-1997 p.30}"
  tr: "Malik, Ebu Hazim ibn Dinar'dan, o da Sahl ibn Sa'd el-Sa'idi'den rivayet ettiğine göre, bir kadın Allah'ın Resulü'ne gelip, \"Kendimi sana verdim\" dedi. Uzun süre ayakta durdu. Sonra bir adam ayağa kalkıp, \"Eğer ona ihtiyacın yoksa, onu benimle evlendir\" dedi. \"Ona mehir olarak verecek bir şeyin var mı?\" diye sordu. Kadın, \"Sadece bel örtüm var\" diye cevap verdi. Adam, \"Onu da verirsen, sen bel örtüsüz kalırsın\" dedi. Bunun üzerine adam bir şey aradı ama bulamadı. \"Kur'an'dan bir şey biliyor musun?\" diye sordu. Kadın, \"Evet, bazı sureleri biliyorum\" diye cevap verdi ve sureleri saydı. Adam, \"Kur'an'dan bildiklerine dayanarak onu seninle evlendirdim\" dedi. {cite:muwatta-maruf-1997 s.30}"
  id: "Malik meriwayatkan dari Abu Hazim ibn Dinar, dari Sahl ibn Sa'd al-Sa'idi, bahwa seorang wanita datang kepada Rasulullah dan berkata, \"Aku telah menyerahkan diriku kepadamu.\" Ia berdiri lama. Kemudian seorang pria berdiri dan berkata, \"Nikahkan dia denganku jika engkau tidak membutuhkannya.\" Beliau bertanya, \"Apakah engkau memiliki sesuatu untuk diberikan kepadanya sebagai mas kawin?\" Ia menjawab, \"Aku tidak memiliki apa pun selain kain penutup auratku.\" Beliau berkata, \"Jika engkau memberikannya kepadanya, engkau akan kehilangan kain penutup auratmu.\" Maka ia mencari sesuatu tetapi tidak menemukan apa pun. Beliau bertanya, \"Apakah engkau mengetahui ayat-ayat Al-Quran?\" Ia menjawab, \"Ya, beberapa surah,\" dan beliau menyebutkan surah-surah tersebut. Beliau berkata, \"Aku telah menikahkan dia denganmu berdasarkan apa yang engkau ketahui dari Al-Quran.\" {cite:muwatta-maruf-1997 p.30}"
