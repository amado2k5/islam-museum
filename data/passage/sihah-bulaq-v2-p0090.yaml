text: |-
  ٤٩٧
  أمابتهم الجدوية تقلب الواوتاء للفرق بينهما قال بكر المازئى هذ اشاذ لا يقاس عليه
  وا السواه العدل قال اللّٰه تعالى فاتبذاليهم على سواء وسواء الشى ؤسطه قال
  تعالى فى سواء الجيم وسواء الشئ غيره قال الاعشى• وماعدات عن أهلهالسوائكا * قال
  الاخفس دوى اذا كان يعى غير اوععى العسدل يكون فيه ثلاث لغات ان ضممت السين
  أو كسرتها قصرت فيه-ماجميعا وان فتحت مددت لاغيرنة ول مكان سوى وسوى وسواء أى
  عدل ووسط قيما بين الفريقين قال موسى بن جابر الحمتقى
  وجدنا أيانا كان حلّ ببلدة * سوى بين قيس قيس عيلان والفزر
  وتقول مررت برجل واك وسواك وسواتك أى غيرك وهما فى هذا الامرسواءوان شئت
  سوا ان وهم«وامللجميع وهم أسسواء وهم «واسيمثل غمانية على غيرقياس قال الاخفس
  ووزنه فعافلة ذهب عنها الحرف الثالث وأصله الباء قال قاماسواسة أى أشياه فان سواء فعال
  وسة يجوز أن تكون فعة أوفلة الا أن فعة أقيس لانّ أكثر ما يلغونموضع اللام وانقلبت
  الواوفى سبة يا لسكسرة ماقبله الانّ أصله سوية وأسويت الشئ أى تركته وأغفلته هكذا
  حكاه أبوء بيدوأنا أرى أن أصل هذا الحرف مهموز وايلة السواءليله ثلاث عشرة الفراء
  هذا الشئ لا يساوى كذا ولم يعرف يسوى كذا وهذالا يساويه أى لا يعادله وسويت الشئ
  فاستوى وهماء لى سوية من هذا الامر أى على -واء وقسمت الشي بينه-ما بإل- وية ورجل
  سوى اخلق أى مس-تو واستوى من اء وجاج واستوى على ظهردابته أى علا واستقر
  وساويت بيتهما أى سوّيت واستوى الى السماء أى قصدت واستوى أى استولى وظهر وقال
  قد استوى بشر على العراق • من غيرسية ودم مهراق
  واستوى الرجل اذ ا انتهى شبابه وقصدت سوى فلان أى قصدت قصده وقال قيس بن
  الخطيم ولاصرفن سوى حدّيفة مدحتى • لفتى العشىّ وفارص الاجزاب
  والسوية كساء محشو بمام ونحوه كالبرذعة قال عبد اللّٰه بن عنة
  فازجر حار لاتنزع سويته • اذاير دوقيد العير. كروب
  والمع سوايا وكذلك الذى يجعل عسلى ظهر الابل الا أنه كالملقة لاجل السنام ويسمى الموية
  واستوى الشى اعتدل والاسم السواه بقال سواء علىّ أقت أوفعدت الكسائى بقال كيف
  أصحتم فيقول مسوون صالون أى أولادناومواشيناسو بصالحة وفى الحدين اذا
  تساوواهلكواوة وله تعالى لونسوى بهم الارض أى تستوى بهم وقول خالدين الوليد
  فوزمن قرار الى سوى *هماما آن ⁦( ها)⁩. السهاكوكب خفى فبمات نعش السكبرى
  والناس يتذون به أبصارهم وفى المثل أربها الها وتزبني القمر الاصمعي السهوة
  كالصفة تكون بيزيدى البيوت قال أبو عبيدد سمعت غيروا حد من أهل اليمن يقولون السهوة
  عند تايات صغير منحدر فى الارض وسمكنه مر تفع من الأرض شبيه بالخزاتة الصغيرة يكون فيها
  المتاع والسهوة من النوق الليغة الدير وال-هوالسكون واللين والجمع سها مثل دلوودلاء
  قال الناعر
  تناوحت الرياح لفقد عمرو * وكانت قبل مهلكد سهاء
  أى ساكنة لينة والمساهاة فى العشرة ترك الاستقصاء والسهواءساعة من الليل وصدّرمنه
