label: { ar: "نوادر جحا الكبرى، ص 21 — «كلي يا فروتي»", en: "Nawadir Juha al-Kubra, p. 21 — 'Eat, My Fur, Eat'", ur: "نوادر جحا الکبریٰ، ص 21 — «کھا، میری پوستین، کھا»", fr: "Nawadir Juha al-Kubra, p. 21 — « Mange, ma fourrure, mange »", es: "Nawadir Juha al-Kubra, p. 21 — «Come, mi piel, come»", tr: "Juha'nın Muhteşem Fıkraları, s. 21 — “Ye, meyvem!”", id: "Anekdot Hebat Juha, hlm. 21 — “Makanlah, buahku!”" }
text: "… كلي يا فروتي دُعِي يوماً إلى وليمة، فذهب إلى الدعوة بثياب خَلَقَةٍ فلم يحسن أصحاب ثياب خلقة: ثيابٍ قديمة ممزّقة."
summary:
  ar: "ذهب جحا بثياب رثّة إلى وليمة فتجاهله الناس، فعاد في فروة فاخرة فأكرمه الضيوف، فقال لفروته كلي، فالتكريم لها. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  en: "Ill-dressed, Juha is ignored at a feast, so he returns in a fine fur; the guests honour him, and he tells his fur to eat, since the honour is for it. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  ur: "جحا بوسیدہ لباس میں دعوت میں گیا تو کسی نے توجہ نہ دی، پھر وہ ایک عمدہ پوستین پہن کر لوٹا تو مہمانوں نے اس کی عزت کی، اور اس نے اپنی پوستین سے کہا کہ کھا، کیونکہ عزت اسی کی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  fr: "Mal vêtu, Juha est ignoré à un festin ; il revient alors dans une belle fourrure, les invités l'honorent, et il dit à sa fourrure de manger, puisque l'honneur est pour elle. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  es: "Mal vestido, Juha es ignorado en un banquete, así que vuelve con una buena piel; los invitados lo honran y él le dice a su piel que coma, pues el honor es para ella. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  tr: "Juha, eski püskü kıyafetlerle bir ziyafete gitti, ancak insanlar onu görmezden geldi. Lüks bir kürk manto giyerek geri döndü ve konuklar ona saygı gösterdi. Kürk mantosuna, \"Ye, çünkü şeref ona aittir,\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 21}"
  id: "Juha pergi ke pesta dengan pakaian lusuh, tetapi orang-orang mengabaikannya. Ia kembali mengenakan mantel bulu mewah, dan para tamu menghormatinya. Ia berkata kepada mantel bulunya, \"Makanlah, karena kehormatan itu milik mantel ini.\" {cite:juha-nawadir-kubra-djuwaydi p. 21}"
