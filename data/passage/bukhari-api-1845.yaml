label: { ar: "صحيح البخاري 1845 — الأب والأبوة، تربية الأب ووصيته", en: "Sahih al-Bukhari 1845 — the father and fatherhood; the father raising and counselling", ur: "صحیح بخاری 1845 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 1845 — El padre y la paternidad; la crianza y el consejo paternos", fr: "Sahih al-Bukhari 1845 — Le père et la paternité; l’éducation et les conseils du père", tr: "Sahih el-Buhari 1845 — Baba ve Babalık, Babanın Yetiştirilmesi ve İradesi", id: "Sahih al-Bukhari 1845 — Ayah dan Peran Ayah, Didikan dan Wasiat Ayah" }
text: "حَدَّثَنَا مُسْلِمٌ، حَدَّثَنَا وُهَيْبٌ، حَدَّثَنَا ابْنُ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّ النَّبِيَّ وَقَّتَ لأَهْلِ الْمَدِينَةِ ذَا الْحُلَيْفَةِ، وَلأَهْلِ نَجْدٍ قَرْنَ الْمَنَازِلِ، وَلأَهْلِ الْيَمَنِ يَلَمْلَمَ، هُنَّ لَهُنَّ وَلِكُلِّ آتٍ أَتَى عَلَيْهِنَّ مِنْ غَيْرِهِمْ مِمَّنْ أَرَادَ الْحَجَّ وَالْعُمْرَةَ، فَمَنْ كَانَ دُونَ ذَلِكَ فَمِنْ حَيْثُ أَنْشَأَ، حَتَّى أَهْلُ مَكَّةَ مِنْ مَكَّةَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1845، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1845 (Penalty of Hunting while on Pilgrimage), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1845، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1845 (Castigo de la caza durante la peregrinación), menciona al padre y la paternidad, así como la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1845 (La peine pour avoir chassé en pèlerinage), évoque le père et la paternité, l'éducation des enfants et le rôle du père dans l'enseignement. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'nin 1845 numaralı hadisinde baba, babalık, babanın çocuk yetiştirmedeki rolü ve tavsiyeleri ele alınmaktadır. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1845, menyebutkan tentang ayah, peran ayah dalam membesarkan anak, dan nasihatnya. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
