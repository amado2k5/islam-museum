text: |-
  ٢٨
  *⁦(زت)⁩-
  اله التلم ومر ضوفة لم نون فى الطبخ طاهيا عجلت الى عمورها حين غرغرا
  لم توَن أى لم تحدس ولم تبطى عف الرعاف الدم يخرج من الانف وقسدرعف
  الرجل برعف ويرعف ورعض بالضم لغة فيه ضعيفة ويقال رماح رواعف امّالتقدّمها
  للطعن أولما يق طر منها من الدم ورعف الفرص يرعف ويرعف أى سيق وتقدم واسترعف
  شله واسترعف الحصى مفسم البعير أى أدماه والراعف الفرس الذى يتقدّم الخيا
  والراعف طرف الارنسة وأنف الجبل ويقال فعلت ذالعلى الرغم من مراعضه مثل
  من اغمه وأرعفه أى أعجل وأرعف قربته أى ملأ ها حتى ترعف ومنه قول الراجز
  يرعف أعلاها من امتلائها * وراعوفة البترصخرة تترل فى أسفل البستراذا احتفوت
  تكون هناك فاذا أرادواتنقية البئرجلس المنقى عليها ويقال هو حجريكون على رأس
  البتريقوم عليه المستقى وفى الحديث أنه صلى اللّٰه عليه وسلم حين سحر جعل سحره فى جف
  طلعة ودفن تحت راعوفة البئر وفيها اغتان راعوفة وأرعوفة بالضم حكاهما أبو عبيد
  ⁦( رغف)⁩ الرغيف من الخبزوالجمع أرغفة ورغف ورغفان قال الراجز
  انّ الشواء والنشسيل والرغف * والقينة الحمسناء والروض الأنف
  *للطاعنين الخيل والخيل قطف*
  قف): الرفّ شبه الطاق والجمع رفوف ورف من ضان أى جماعة والرف المص
  والترشف وقدرفقت أرف بالضم وفلان يرفنا أى يحوطنا وفى المثل من حفنا أورفنا
  فليقتصدوماله جاف ولاراف ورف لونه يرف بال-كسر رفاورفيفا أى برق وتلالأوثوب
  رفيف وشجرر فيف اذا أتندت قال الاعشى يذكرنغرامرأة
  ومهاترف غروبه * تشف المتيم ذا الجرارة
  والرفرف ثياب خضر تخذمنها المحابس الواحدة رفرفة والرفرف أيضاكسر الخبا
  وجوانب الدرع وما تدلى منها الواحدة رفرف ورفرف الطائراذاحّك جناحيه حول
  الشئ يريد أن يقع عليه والرفراف طائر وهوخاطف ظله عن أبن سلمة وربماسموا الظليم
  بذلك لانه يرفرف بجنا حيه ثم يعدو ⁦(رنف)⁩ الرنفبهرامج البرّ والرانفة أسفل الالية
  وطرفها الذى يلى الارض من الائسان اذا كان قائنا وأرنفت الماقة بأذنيها اذا أرختهما
  من الاعياء وفى الحديث كان صلى اللّٰه عليه وسلم اذا أنزل عليه الوحى وهوعلى القصواء
  تذرف عينا ها وترنف بأذنيها من ثقل الوحى هف أرهفت سيفى أى رققته فهو
  مرهف ⁦( يف)⁩ الريف أرض فيها زرع وخصب والجمع أرياف ورافت الماشية أى رحت
  الريف وأَريفنا أى صرنا الى الريف وأرافت الارض أى أخصبت وهى أرض ريفة
  بتشديد الياه
  صل الزاى ز ف زأنت الرجل ذأفا أعجملته وأزأف ذلانا يطنه أثل فلم
  ق-درآن يتحرّك (زحف زحف اليه زحفامشى ويقال زحف الديااذامضى قدما
  والزاحف السهم يقع دون الغرض ثم يزحف اليه والزحف الميس يزحفون الى العدو
  والصبي
