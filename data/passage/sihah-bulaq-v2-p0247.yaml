text: |-
  ٢٤٠
  - ⁦(فم)⁩ه
  نعم وفعل كذا و أنم أى زاد وأنعم اللّٰه بك عينا أى أقرّاقه عينك بمن تحبه وكذلك نعم القه يك
  •تانعمة مشل علم غلمة ونزه نزهة وتعمك عينامثله والنهم واحد الانعام وهي المال الراءه-
  وأكثرمايقع هذا الاسم على الابل قال الفراهوذ كرلا يونت يولون هذانهم واردويمع
  على نعمان من-ل حل وحلان والاتعام تد كروتونت عل اللّه تعالى فى موضع عمافى بطونه
  وفى. وضع آخر مما فى بطونها وجع الهع أناعيم ويراد به التكنيرفقط لان جمع ابمع اما أن يراديه
  النكثرأ والذروب المختلفة قال ذوالرمة • وانحسرت عنه الاناعيم• ونعم عدة وتصديق
  وجواب الاستفهام ور بعماناقض بلى اذا قال ليس لد عندل وديعة ة ولك نعم تصديوه
  وبلى تكذيب ونم بكسر العيز لغة فيه حكاها الكسافّ والنعامة من الطيريد كرويونت والنعام
  اسم جنس مغل حام وحامة وجواد وجرادة والنعامة الخشبة المصترضة على الزرنوقين
  ويقال للقوم اذا ارتحلوا عن منهلهم أوتفرة واقدشاات نعامتهم والنعامة ماتحت القدم
  وفال • وابن النعامة يوم ذلك حر كبى • قال الاسمعى هواسم فرس وقال الفراهوعرق
  فى الرجل قال معته منهم حكادف المصنف وقال أبو عيدة هواسم لشدة الحرب كقولهم أم
  الحرب وليس تم امرأة وانمادتت كة واه-م بدداء الظبى وجاوا على بكرة أبيهم وليس تم بكرة
  ولاداء والنعام والنعامة علم من أعلام المفاوذ قال أبوذؤيب يصف طرق المفازة
  بهنّ نعام بناه الرجال تلق التفاتض فيه السرعها
  وقال آخر » لاشِيْ فى ريدها الانعامتها • ونعام. وضع يقال قلان من أهل برلْ وزعام
  وهماموضعان من أطراف اليمن والنعائم منزل من منازل القمروهى عانية أفجم كانهاسري
  معوج أر بعة صادرة وأربعة واردة ونعامة لقب بيهس والنعامة امم فرس فى قول لبيد
  تكاثر قرفل والجون فيها • وضجل والنعامة والخبال
  وأبونهامة كنية قطرى بن الفجاءة ويكنى أباعمد أيضاونعمة العين بالضم قرتها ويقال نعم عيز
  ونعسام عين ونعامة عين ونعمة عين ونعمى عين كاه بحنى أى أفعل ذلك كرامة لك وانما مالعينك
  وما أشبهه والنعاى بالضم ريح الجنوب لانها آبلّ الرياح وأرطبها ويقال أيضاذهاماك؟-و
  نصاراك ونعمان بن التذرملك العرب نسب اليه الشقائقلانه حاه قال أبو عسدان
  العرب كانت تسمى ملول الحميرة النعمان لانه كان آخرهم ونعمان بالفتح وادف طويق الطائف
  يخرج الى عرفات وقال تضوّع مسكابطن نعمان أن مست • بدزينب فى نسوة عطرات
  ويقال له نعمان الاراك وقال
  أما والاقسات بذات عرق • ومن صلى بنعمان الاراك
  وقولهم عم صباحاكلة تحية كانه محذوف من نعم يشم بالمكسر كاتقول كل من أكل يأسكل
  فذف منه الالف والنون استخفاقا والتنعيمة شجرة والتنعيم موضع عكة وأييم موضع وتمم
  بالضم اسم امرأة غم النغم الكلام الخق تقول منه نغم ينخم وتخم نغما وسكت
  فلان قاتغم بحسرف وما تنغم مثله وفلان حسسن النغمة اذا كان حسن الصوت في القرامة
  قم) نقمت على الرجل أنقم بالكسر فأنا نا قم اذا عتيت عليه بقال مائة مت منه الا
  الاحان وقال الكسائى نقمت بالمكسر لفة ونقت الامر أيضا وتقمته اذا كرهنه
