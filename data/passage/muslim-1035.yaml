label: { ar: "مسلم 1035 — إن هذا المال خضرة حلوة", en: "Muslim 1035 — This wealth is fresh and sweet" }
text: "قال حكيم بن حزام: سألت النبي فأعطاني ثم سألته فأعطاني، فقال: يا حكيم إن هذا المال خضرة حلوة، فمن أخذه بطيب نفس بورك له فيه، ومن أخذه بإشراف نفس لم يبارك له فيه وكان كالذي يأكل ولا يشبع، واليد العليا خير من اليد السفلى"
summary:
  ar: "رواية حكيم بن حزام في باب تحريم المسألة للناس من كتاب الزكاة في صحيح مسلم؛ المال الذي يؤخذ بطيب نفس يبارك فيه، والمأخوذ بإشراف نفس كمن يأكل ولا يشبع — وسياقها أن النبي أعطاه ثلاثاً ثم نهاه عن السؤال."
