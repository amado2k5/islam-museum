text: "… يَحْيَى بْنِ سَعِيدٍ، أَنَّ مَرْوَانَ بْنَ الْحَكَمِ، كَتَبَ إِلَى مُعَاوِيَةَ بْنِ أَبِي سُفْيَانَ أَنَّهُ أُتِيَ بِمَجْنُونٍ قَتَلَ رَجُلاً ‏.‏ فَكَتَبَ إِلَيْهِ مُعَاوِيَةُ أَنِ اعْقِلْهُ وَلاَ تُقِدْ مِنْهُ فَإِنَّهُ لَيْسَ عَلَى مَجْنُونٍ قَوَدٌ ‏.‏ قَالَ مَالِكٌ فِي الْكَبِيرِ وَالصَّغِيرِ إِذَا قَتَلاَ رَجُلاً جَمِيعًا عَمْدًا أَنَّ عَلَى الْكَبِيرِ أَنْ يُقْتَلَ وَعَلَى الصَّغِيرِ نِصْفُ الدِّيَةِ ‏.‏ قَالَ مَالِكٌ وَكَذَلِكَ الْحُرُّ وَالْعَبْدُ يَقْتُلاَنِ الْعَبْد …"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
