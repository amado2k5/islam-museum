label: { ar: "سنن أبي داود 4609 — عمل يعدل عملا أعظم منه، وزر من تبع", en: "Sunan Abi Dawud 4609 — a deed that equals a greater one; bearing the burden of those who follow", ur: "سنن ابی داؤد 4609 — ایک عمل جو بڑے عمل کے برابر ہے، پیروی کرنے والوں کا بوجھ" }
text: "… أَخْبَرَنِي الْعَلاَءُ، - يَعْنِي ابْنَ عَبْدِ الرَّحْمَنِ - عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الأَجْرِ مِثْلُ أُجُورِ مَنْ تَبِعَهُ لاَ يَنْقُصُ ذَلِكَ مِنْ أُجُورِهِمْ شَيْئًا وَمَنْ دَعَا إِلَى ضَلاَلَةٍ كَانَ عَلَيْهِ مِنَ الإِثْمِ مِثْلُ آثَامِ مَنْ تَبِعَهُ لاَ يَنْقُصُ ذَلِكَ مِنْ آثَامِهِمْ شَيْئًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4609، يذكر عمل يعدل عملا أعظم منه، ووزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 4609 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that speaks of a deed that equals a greater one, bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 4609، جس میں ایک عمل جو بڑے عمل کے برابر ہے، پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
