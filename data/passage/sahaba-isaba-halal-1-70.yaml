text: "… الّذي جعله يتفوق على غيره من الصَّحابة في كثرة الرِّوَاية أنه استجاز لنفسه أن ينسب إلى رسول الله كلفر كل كلام حسن، قاله أو لم يقله، مما هو خارج عن دائرة الحَلال والحرام.. قالوا : أخرجه البخاري في الصحيح كتاب …"
