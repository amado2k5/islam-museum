text: "اصبب على رأسي"
summary:
  ar: "يرويه مالك عن حميد بن قيس عن عطاء بن أبي رباح، أن عمر بن الخطاب قال ليعلى بن منية وهو يصب عليه الماء وهو يغتسل: اصبب على رأسي. فقال يعلى: أتريد أن تجعلها بي؟ إن أمرتني صببت. فقال له عمر: اصبب، فلن يزيده الماء إلا شعثاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني، وأن البيهقي (5/63) والشافعي رويا عنه. {cite:muwatta-maruf-1997 p.435}"
