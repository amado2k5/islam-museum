label: { ar: "الموطأ 902 — عمر بن الخطاب قال ليعلى بن منية وهو يصب عليه الماء: اصبب على رأسي، فلن يزيده الماء إلا شعثاً", en: "Muwatta 902", es: "Muwatta 902", fr: "Muwatta 902", ur: "موطا 902", tr: "El-Muvatta 902 — Ömer ibn el-Hattab, Ya'la ibn Munyah'ın üzerine su dökerken ona şöyle dedi: \"Başımın üzerine su dök, çünkü su sadece saçımı daha da dağıtacak.\"", id: "Al-Muwatta 902 — Umar ibn al-Khattab berkata kepada Ya'la ibn Munyah sambil menuangkan air ke kepalanya: \"Tuangkan air ke kepalaku, karena air hanya akan membuatnya semakin berantakan.\"" }
text: "اصبب على رأسي"
summary:
  ar: "يرويه مالك عن حميد بن قيس عن عطاء بن أبي رباح، أن عمر بن الخطاب قال ليعلى بن منية وهو يصب عليه الماء وهو يغتسل: اصبب على رأسي. فقال يعلى: أتريد أن تجعلها بي؟ إن أمرتني صببت. فقال له عمر: اصبب، فلن يزيده الماء إلا شعثاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني، وأن البيهقي (5/63) والشافعي رويا عنه. {cite:muwatta-maruf-1997 p.435}"
  tr: "Malik, Humaid ibn Kays'tan, o da Ata ibn Ebu Rabe'den rivayet ettiğine göre, Ömer ibn el-Hattab, Yala ibn Munyah'ı yıkarken üzerine su dökerken ona şöyle dedi: \"Başımın üzerine su dök.\" Yala cevap verdi: \"Bunu bana mı yapmak istiyorsun? Emredersen dökerim.\" Ömer ona dedi ki: \"Dök, çünkü su sadece daha da dağıtır.\" Araştırmacı, bunu Malik'ten Ebu Musab, Suveyd ve Şeybani'nin, ondan da el-Beyhaki (5/63) ve Şafiî'nin rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.435}"
  id: "Malik meriwayatkannya dari Humaid ibn Qais, dari Ata ibn Abi Rabah, bahwa Umar ibn al-Khattab berkata kepada Yala ibn Munyah, ketika ia sedang menyiramkan air ke kepalanya saat mandi: “Siramkan air ke kepalaku.” Yala menjawab: “Apakah engkau ingin melakukannya padaku? Jika engkau memerintahkanku, aku akan menyiramkannya.” Umar berkata kepadanya: “Siramkan saja, karena air hanya akan membuatnya semakin berantakan.” Peneliti menyebutkan bahwa Abu Musab, Suwaid, dan al-Shaybani meriwayatkannya dari Malik, dan bahwa al-Bayhaqi (5/63) dan al-Shafi’i meriwayatkannya darinya. {cite:muwatta-maruf-1997 p.435}"
