label: { ar: "سنن أبي داود 5156 — وصية أو عهد أخير", en: "Sunan Abi Dawud 5156 — a testament or parting counsel", ur: "سنن ابی داؤد 5156 — وصیت یا آخری نصیحت", es: "Sunan Abi Dawud 5156 — un testamento o consejo de despedida" }
text: "حَدَّثَنَا زُهَيْرُ بْنُ حَرْبٍ، وَعُثْمَانُ بْنُ أَبِي شَيْبَةَ، قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ الْفُضَيْلِ، عَنْ مُغِيرَةَ، عَنْ أُمِّ مُوسَى، عَنْ عَلِيٍّ، قَالَ كَانَ آخِرُ كَلاَمِ رَسُولِ اللَّهِ \" الصَّلاَةَ الصَّلاَةَ اتَّقُوا اللَّهَ فِيمَا مَلَكَتْ أَيْمَانُكُمْ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5156، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5156 (General Behavior (Kitab Al-Adab)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 5156، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5156 (Conducta General (Kitab Al-Adab)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
