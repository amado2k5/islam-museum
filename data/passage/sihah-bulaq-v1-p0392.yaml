text: |-
  فصل الغاء)
  ٢٤٩
  أى اقيته وعهدى به قريب وقول الشاعر
  فليس كعهد الداريا أم مالك • ولكن أحاطت بالرقاب السلاسل
  أى ليس الامى كماعهدت ولكن جاء الاسلام فهدم ذلك وفى الحديث ان كرم العهدمن
  الايمان أى رعاية المودة والعهد المطر الذى يكون بعد المطروابمع العهاد والعهودوقد
  عهدت الارض فهى معهودة أى ععلورة والتعهد التحفظ بالشئ وتجديد العهدبه وتعهدت
  فلا نا وتعهدت ضعتى وهو أفصح من قولك تعاهدته لان التعاهداما يكون بين اثنين وفلان
  يتعهده صرع والمهدان العهد والمعاهد الذمى وعهيدكك الذى يعاهدك وتعاهده وقرية
  ءهمدة أى قديمة أتى عليها عهد طويل والمعهد الموضع الذى كنت تعهديه شيشاورج-ل عهد
  بالسكسر يتعاهد الامور والولايات قال السكميت يمدح قتيبة بن مسلم الباهلى ويذ كرفتوحه
  قام المهلب عنها فى إمارته • -تى مضت سنة لم يقضها العهد
  صل الفين ) دد لغدد التى فى اللحم الواحدة غددة وغدة وغدة البعيرط اعونه
  وقد أغد البعيرفه ومغد أى به غدة قال الاصمعى المغد الغضبان وقد أغ_دفلان غضب وأغد
  القوم أصابت ابلهم الغدة ورجل مغداد كثير الغضب رد) الغرد بالتحريك التطريب
  فى الصوت والغناء يقال غرد الطائرفهو غرد والتغر يدمثله قال الشاعر سويد بن كراع
  العكلى
  اذاعرضت داوية مداهمة • وغرّدحاديها فرين بمافلقا
  والتغرّد مثل التغريدود بجعهما امر والقيس فى قوله يصف جارا
  يغرد بالاسهار فى كل مرفع • تغترّد مريح الندامى المطرب
  والغرد با الكسر ضرب من الكمأة والجمع غردة مثل قرد وقردة قال الكساف واحد الغردة
  من الكماة غرد وقال الذرّا سمعت أنا غرد بالفتح مثل جبء وجبأة ويقال أيضاغردة وغرد
  •ثل تمرة وتمروغردة وغرد.ثل تبنة وتين والجمع منهما غراد مثل كلاب وذماب والمغرود منساه
  والجمع المغاريد والمفرندى الذى يعلو ويغلب قال الراجز
  قد جعل النعاس يغرندبنى * أطرده عنى ويسرندبى
  أبوذ يداغرندوا عليه اغرندا. أى علوه بالشتم والضرب والقهر.شل اغلنتوا رقد)
  الغرقد شجروبقيع الغرقد مقبرة بالمدينة (غمد الفعد غلاف السبف وغمدت السيف
  أغمده غمد اجعلته فى غمده وأغمدنه أيضافه ومغمدومغمود قال أبو عبيدة همالغتان
  فصيحتان وتغمده اللّٰه برحته غمرمبم اوتهمدت فلا فاسترت ماجكان منه وغطيته وغامد
  حى من المن وأنشدابن الكابى لغامد
  تغمدت شرا كان بين عشيرتى • فأسماتى القيل الحضورى عامدا
  واغتمد فلان الليل دخل فيه كانه صار كالفمد له كما يقال آذّرع الليل وينشد
  يس لولدانك ليل فاغتمد أى اركب الليل واطلب لهم القوت وعمدان قصر بالمن ⁦(غيد)⁩
  الغيد النعومة بقال امرأة غيداه وغادة أبضا أى ناعمة بينة الغيد والاغيد الوسنان المائل
  صل ال ا أد ) القؤاد القلب والجمع الافئدة وفأدته فهومة وْود أصبت فواده
  صاح
  قوله بالكسرأى كسر الهناه
  مع فتح الأوّل على خلاف
  الاصطلاح من أن ضبط الاتماء
  لا ولها وضط الافعان لوسطها
  ألازى أن الصكسر الآتى
  في الغرد للاول كالفستخ
  المذكور بعده قالم نصر
  تحمدات يوزت عنمان ا
