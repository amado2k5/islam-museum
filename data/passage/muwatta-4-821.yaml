label: { ar: "الموطأ 821 — مالك: لا تكره الحجامة للصائم إلا خشية أن يضعف؛ ومن احتجم في رمضان وسلم من الفطر فلا شيء عليه ولا قضاء", en: "Muwatta 821", es: "Muwatta 821", fr: "Muwatta 821", ur: "موطا 821", tr: "El-Muvatta 821 — Malik: Hacamat, oruç tutan kişi için mekruh değildir, ancak halsiz düşme korkusu vardır; Ramazan ayında hacamat yaptıran ve orucunu bozmayan kimse için bir sakınca yoktur ve kaza etmesi gerekmez.", id: "Al-Muwatta 821 — Malik: Bekam tidaklah dibenci bagi orang yang berpuasa kecuali karena khawatir ia akan menjadi lemah; dan barang siapa yang melakukan bekam di bulan Ramadhan dan tidak berbuka puasa, maka tidak ada kewajiban baginya dan ia tidak perlu mengganti puasanya." }
summary:
  ar: "قول لمالك: لا تكره الحجامة للصائم إلا خشية أن يضعف، ولولا ذلك لم تكره. ولو أن رجلاً احتجم في رمضان ثم سلم من أن يفطر، فلا شيء عليه ولا يُؤمر بالقضاء لذلك اليوم، لأن الحجامة إنما تُكره للصائم لموضع التغرير بالصيام، فمن احتجم وسلم من أن يفطر حتى يمسي فلا شيء عليه ولا قضاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب (841). {cite:muwatta-maruf-1997 p.401} {cite:muwatta-maruf-1997 p.402}"
  tr: "Malik şöyle demiştir: Hacamat, oruç tutan bir kişi için, onu zayıflatacağından korkulmadığı sürece, mekruh değildir; aksi takdirde mekruh olmazdı. Bir kimse Ramazan ayında hacamat yaptırır ve orucunu bozmazsa, ona bir suçlama yöneltilmez ve o günü kaza etmesi de gerekmez. Çünkü hacamat, oruç tutan bir kişi için sadece orucu bozma riski nedeniyle mekruhtur. Dolayısıyla, bir kimse hacamat yaptırır ve orucunu akşama kadar bozmazsa, ona bir suçlama yöneltilmez ve orucu kaza etmesi de gerekmez. Araştırmacı, bunun Malik'ten Ebu Mus'ab (841) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.401} {cite:muwatta-maruf-1997 s.402}"
  id: "Malik berkata: Bekam tidak dibenci bagi orang yang berpuasa kecuali jika ada kekhawatiran bahwa hal itu akan melemahkan mereka; jika tidak, maka tidak akan dibenci. Jika seseorang menjalani bekam selama Ramadan dan kemudian tidak berbuka puasa, tidak ada celaan baginya, dan ia tidak diwajibkan untuk mengganti puasa pada hari itu. Ini karena bekam hanya dibenci bagi orang yang berpuasa karena risikonya membatalkan puasa. Jadi, jika seseorang menjalani bekam dan tidak berbuka puasa hingga sore hari, tidak ada celaan baginya, dan tidak ada kewajiban untuk mengganti puasa. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (841). {cite:muwatta-maruf-1997 p.401} {cite:muwatta-maruf-1997 p.402}"
