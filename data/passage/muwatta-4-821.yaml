label: { ar: "الموطأ 821 — مالك: لا تكره الحجامة للصائم إلا خشية أن يضعف؛ ومن احتجم في رمضان وسلم من الفطر فلا شيء عليه ولا قضاء", en: "Muwatta 821" }
summary:
  ar: "قول لمالك: لا تكره الحجامة للصائم إلا خشية أن يضعف، ولولا ذلك لم تكره. ولو أن رجلاً احتجم في رمضان ثم سلم من أن يفطر، فلا شيء عليه ولا يُؤمر بالقضاء لذلك اليوم، لأن الحجامة إنما تُكره للصائم لموضع التغرير بالصيام، فمن احتجم وسلم من أن يفطر حتى يمسي فلا شيء عليه ولا قضاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب (841). {cite:muwatta-maruf-1997 p.401} {cite:muwatta-maruf-1997 p.402}"
