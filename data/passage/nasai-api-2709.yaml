label: { ar: "سنن النسائي 2709 — الأب والأبوة", en: "Sunan al-Nasa'i 2709 — the father and fatherhood", ur: "سنن نسائی 2709 — باپ اور والدیت", es: "Sunan al-Nasa'i 2709 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2709 — le père et la paternité" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ مَنْصُورٍ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرٍو، عَنْ عَطَاءٍ، عَنْ صَفْوَانَ بْنِ يَعْلَى، عَنْ أَبِيهِ، أَنَّ رَجُلاً، أَتَى النَّبِيَّ وَقَدْ أَهَلَّ بِعُمْرَةٍ وَعَلَيْهِ مُقَطَّعَاتٌ وَهُوَ مُتَضَمِّخٌ بِخَلُوقٍ فَقَالَ أَهْلَلْتُ بِعُمْرَةٍ فَمَا أَصْنَعُ فَقَالَ النَّبِيُّ \" مَا كُنْتَ صَانِعًا فِي حَجِّكَ \". قَالَ كُنْتُ أَتَّقِي هَذَا وَأَغْسِلُهُ. فَقَالَ \" مَا كُنْتَ صَانِعًا فِي حَجِّكَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2709، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2709 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2709، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2709 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2709 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
