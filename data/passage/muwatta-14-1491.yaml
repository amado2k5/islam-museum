label: { ar: "الموطأ 1491 — مالك: تفسير النهي أن يخطب الرجل المرأة فتركن إليه ويتفقان على صداق معلوم، فهي التي نهي عنها، ولا يعني أن لا يخطبها أحد إذا لم توافق", en: "Muwatta 1491" }
summary:
  ar: "يقول مالك تفسير قول رسول الله لا يخطب أحدكم على خطبة أخيه، فيما نرى والله أعلم، أن يخطب الرجل المرأة، فتركن إليه، ويتفقان على صداق واحد معلوم، وقد تراضيا، فهي تشترط عليه لنفسها، فتلك التي نهى أن يخطبها الرجل على خطبة أخيه. ولم يعن بذلك إذا خطب الرجل المرأة فلم يوافقها أمره، ولم تركن إليه، أن لا يخطبها أحد، فهذا باب فساد يدخل على الناس. {cite:muwatta-maruf-1997 p.28}"
