label: { ar: "الموطأ 1491 — مالك: تفسير النهي أن يخطب الرجل المرأة فتركن إليه ويتفقان على صداق معلوم، فهي التي نهي عنها، ولا يعني أن لا يخطبها أحد إذا لم توافق", en: "Muwatta 1491", es: "Muwatta 1491", fr: "Muwatta 1491", ur: "موطا 1491", tr: "El-Muvatta 1491 — Malik: Yasaklamanın yorumu şudur: Bir erkek bir kadına evlenme teklif etmeli, kadın da kabul etmeli ve aralarında bilinen bir mehir konusunda anlaşma sağlanmalıdır. Yasak olan budur ve bu, kadının kabul etmemesi durumunda kimsenin ona evlenme teklif etmemesi gerektiği anlamına gelmez.", id: "Al-Muwatta 1491 — Malik: Penafsiran larangan tersebut adalah bahwa seorang pria hendaknya melamar seorang wanita, dan wanita itu hendaknya menerimanya dan mereka hendaknya menyepakati mas kawin yang telah ditentukan. Inilah yang dilarang, dan bukan berarti tidak boleh ada yang melamar wanita tersebut jika ia tidak setuju." }
summary:
  ar: "يقول مالك تفسير قول رسول الله لا يخطب أحدكم على خطبة أخيه، فيما نرى والله أعلم، أن يخطب الرجل المرأة، فتركن إليه، ويتفقان على صداق واحد معلوم، وقد تراضيا، فهي تشترط عليه لنفسها، فتلك التي نهى أن يخطبها الرجل على خطبة أخيه. ولم يعن بذلك إذا خطب الرجل المرأة فلم يوافقها أمره، ولم تركن إليه، أن لا يخطبها أحد، فهذا باب فساد يدخل على الناس. {cite:muwatta-maruf-1997 p.28}"
  tr: "Malik, Peygamberimizin \"Hiçbiriniz, erkek kardeşi tarafından zaten evlenme teklifi almış bir kadına evlenme teklif etmesin\" sözünü şöyle açıklıyor: Bizim görüşümüze göre ve Allah en iyisini bilir, bu, bir erkeğin bir kadına evlenme teklif etmesi, kadının onu kabul etmesi, tek ve bilinen bir mehir üzerinde anlaşmaları ve her ikisinin de memnun olması durumunu ifade eder. Daha sonra kadın kendi şartlarını öne sürer. Peygamberimiz, erkek kardeşi tarafından zaten evlenme teklifi almış bir kadına evlenme teklif etmeyi yasaklamıştır. Peygamberimiz, bir erkek bir kadına evlenme teklif eder de kadın onu kabul etmezse, başkasının ona evlenme teklif etmemesi gerektiğini kastetmemiştir. Bu, insanlar arasında yozlaşmaya yol açar. {cite:muwatta-maruf-1997 s.28}"
  id: "Malik menjelaskan sabda Nabi, \"Janganlah seorang pun di antara kalian melamar seorang wanita yang sudah dilamar oleh saudaranya,\" sebagai berikut: Menurut pandangan kami, dan Allah Maha Mengetahui, ini merujuk pada seorang pria yang melamar seorang wanita, dan wanita itu menerimanya, dan mereka sepakat tentang satu mas kawin yang telah ditentukan, dan keduanya merasa puas. Kemudian wanita itu menetapkan syarat-syarat untuk dirinya sendiri. Inilah wanita yang dilarang Nabi untuk dilamar ketika ia sudah dilamar oleh saudaranya. Beliau tidak bermaksud bahwa jika seorang pria melamar seorang wanita tetapi wanita itu tidak menerimanya, maka tidak seorang pun boleh melamarnya. Ini akan menjadi pintu gerbang menuju kerusakan moral di antara manusia. {cite:muwatta-maruf-1997 p.28}"
