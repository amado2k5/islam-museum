text: "… الباب أن تفسيرها بالأونان من قول أبى سلمة، وعند أبن مردويه من طريق عمد بن كثير عن ممهر عز الزهري، فى هذا الحديث : والرجز بضم الراء، وهى قراءة حفص عن عاصم، قال أبو مبيدة: هما أمنى، ويروى من جاهد …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 679، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 3, p. 679, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 3، ص 679 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 3, pág. 679, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
