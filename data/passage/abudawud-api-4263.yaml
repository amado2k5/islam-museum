label: { ar: "سنن أبي داود 4263 — الأب والأبوة", en: "Sunan Abi Dawud 4263 — the father and fatherhood", ur: "سنن ابی داؤد 4263 — باپ اور والدیت", es: "Sunan Abi Dawud 4263 — El padre y la paternidad", fr: "Sunan Abi Dawud 4263 — le père et la paternité", tr: "Sunan Abi Dawud 4263 — Baba ve Babalık", id: "Sunan Abi Dawud 4263 — Sang Ayah dan Peran Ayah" }
text: "… - يَعْنِي ابْنَ مُحَمَّدٍ - حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، قَالَ حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ، أَنَّ عَبْدَ الرَّحْمَنِ بْنَ جُبَيْرٍ، حَدَّثَهُ عَنْ أَبِيهِ، عَنِ الْمِقْدَادِ بْنِ الأَسْوَدِ، قَالَ ايْمُ اللَّهِ لَقَدْ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ السَّعِيدَ لَمَنْ جُنِّبَ الْفِتَنَ إِنَّ السَّعِيدَ لَمَنْ جُنِّبَ الْفِتَنَ إِنَّ السَّعِيدَ لَمَنْ جُنِّبَ الْفِتَنَ وَلَمَنِ ابْتُلِيَ فَصَبَرَ فَوَاهًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4263، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4263 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4263، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4263 (Pruebas y batallas feroces (Kitab Al-Fitan Wa Al-Malahim)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4263 (Épreuves et Combats acharnés (Kitab Al-Fitan Wa Al-Malahim)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4263 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4263, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
