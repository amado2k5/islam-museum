text: |-
  ٧٣
  قال الفرّاه هو أن يجعل ابهامه على الخلف ثم يردّ أصابعهء-لى الابهام وانلجاف جيه
  والضب دويبة والجم-ع ضباب وأضب مثل كف وأكف وفى المشل أعق من ضب لانه
  ربما أكل حسوله والانى ضبة وقولهم لا أفعله حتى يحنّ الضب فى اثر الابل الصادرة ولا
  أفع_له حتى يرد الضب لان الضب لا يسْرب ماء ومن كلامهم الذى يضعونه على ألسنة البهائم
  قالت السمكة ورداياضبة فقال
  أصبح قلبى صردا لايشتهى أن ردا الاعراداعردا وصليانابردا وعنكنا ملتبدا
  وضبب البلد وأضب أيضا أى كئرت ضبابه وأرض ضيبة كثيرة الضباب وهو أحد
  ماجاء على أصله ووقعنا فى مضاب منكرة وهى قطع من الارض كثيرة الضباب الواحدة
  مضبة والمضبب الحارش الذى يصب الماء فى حجره -تى يخرج ليأخذه والضب الحقد تة ول
  أضب فلان على غل فى قلبه أى أضمره وقال الاصمعى أضب على ما فى نفسه اذاسكت
  مثل أضبا وقال أبوزيد أضب اذا تكلم ومنه يقال ضبت لثته دما اذاساات وأضببتها
  أنا فكأن أضب أخرج الكلام ويقال أضبواء لميه اذا أ كثروا عليه والضب ورم يصيب
  لبعير فى فرسنه تقول منه ضب البعير يضب بالفتح فه و يعبر أضب وناقة ضباء بينة الضبب
  والذب داه فى الشفة يسيل دما ومنه قولهم جاءفلان تضب اماته بالكسراذا اشتد
  حرصه عسلى الشئ قال بشربن أبى خازم
  وبنى تميم قدلقينا منهمو • خيلائضب لشاته اللمغسم
  ال أبو عبيدة هو قلب تبض أى نسيل ونقطر والضب واحدضباب النخسل وهوطلعه
  قال الشاءر أطافت بفعال كأن ضبابه • بعون الموالى يوم عيد تغدت
  والضب انفتاق من الابط وكثرة من اللحم تقول تضبب الصى" أى سمن وانفتقت آباطه وقصم
  عنقه ورج-ل ضباضب بالضم اذا كان قصير اسمينا والضبيبة سمن ورب يجعل للصبى فى عكة.
  طعمه يقال ضيبوا لصبيكم ورجل خب ضب أى بربز مراوغ وضبة بن أدعم تميم بن مرّ
  والضبة حديدة عريضة بضبب بها الباب والضبابة -صعابة تغشى الارض كالدخان والمع
  الضباب تقول منه أضب يومنا وضب اسم الجبل الذى مسجد الخيف فى أصله. ضرب .
  ضريه يضر به ضر باوضرب فى الارض ضربا ومضر بانالنتح اى سارفى ابتغاء الرزق يقال
  ان فى ألف درهم لضربا أى ضربا وضرب اللّٰه مثلا أى وصف وبين وقواه-م فضرب الدهر
  ضربانه كقولهم فقضى من القضاء وضرب الفحل الناقة ضرابا وضرب الجرح ضر بانا وضرب
  على يدفلان اذا حجر عليه والطير الضوارب التى تطلب الرزق وضرب البعير فى جهازه أى ذقر
  وضر بت فيه فلانة بعرق ذى أشب أى النباس أبوزيد أضرب الرجل فى بيته أى أقام فيه
  قال ابن السكيت ممعتها من جماعة من الاعراب وأضرب أى أطرق تقول رأيت حية مضربا
  اذا كانت ساكنة لا تهرك وأضرب عنه أى أعرض وأضرب الرجل الفحل الناقة فضر بها
  والتضريب بين القوم الاغراوضرّب النجاد المضربة اذاخاطها وضاربه أى جالده وتضاربا
  واضطربابعى والموج يضارب أى يضرب بعضه بعضا والأضطراب الحركة واضطرب
  أمره اختل وهذاحديث مضطرب السند وضاربه فى المال من المضارية وهى القراض
  ١٩.
  صاح
  فوله أى ضربا أى فى الارض
  وسف راللتجارة اه
