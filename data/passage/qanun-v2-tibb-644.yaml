text: "… وسائر الأدوية التي تعالج بها الأورام الباردة مما علمت في كل موضع. ومما ينفع فيه جداً ضمّاد القيصوم المتخذ بقفر اليهود. علاج القولنج السوداوي : يجب أن تستفرغ السوداء بمثل طبيخ الأفتيمون، وحبّ اللازورد ونحوه، ثم يتبع بحبّ الشبرم، والسكبينج. …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 644، يذكر السنا والسنوت، وأسماء الأمراض، والعلاج، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 644, that mentions senna and sannut, named diseases, treatment, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
