summary:
  ar: "القسم 22 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضائل الجهاد عن رسول الله»، ويضم فيها النصوص من 1619 إلى 1669 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 22 of Jami' al-Tirmidhi (The Book on Virtues of Jihad) in the division of the open hadith dataset the museum took its reports from: reports 1619 to 1669 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 22، عنوان «کتاب فضائل الجہاد عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1619 تا 1669۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 22 de Jami' al-Tirmidhi (El libro sobre las virtudes de la yihad) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1619 al 1669, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
