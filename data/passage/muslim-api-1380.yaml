label: { ar: "صحيح مسلم 1380 — الأب والأبوة", en: "Sahih Muslim 1380 — the father and fatherhood", ur: "صحیح مسلم 1380 — باپ اور والدیت", es: "Sahih Muslim 1380 — El padre y la paternidad", fr: "Sahih Muslim 1380 — le père et la paternité" }
text: "… رَسُولُ اللَّهِ ثُمَّ صَلَّى فَصَلَّى رَسُولُ اللَّهِ ثُمَّ صَلَّى فَصَلَّى رَسُولُ اللَّهِ ثُمَّ صَلَّى فَصَلَّى رَسُولُ اللَّهِ ثُمَّ صَلَّى فَصَلَّى رَسُولُ اللَّهِ ثُمَّ قَالَ \" بِهَذَا أُمِرْتُ \". فَقَالَ عُمَرُ لِعُرْوَةَ انْظُرْ مَا تُحَدِّثُ يَا عُرْوَةُ أَوَإِنَّ جِبْرِيلَ هُوَ أَقَامَ لِرَسُولِ اللَّهِ وَقْتَ الصَّلاَةِ فَقَالَ عُرْوَةُ كَذَلِكَ كَانَ بَشِيرُ بْنُ أَبِي مَسْعُودٍ يُحَدِّثُ عَنْ أَبِيهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 1380، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1380 (The Book of Mosques and Places of Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1380، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 1380 (El Libro de las Mezquitas y Lugares de Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 1380 (Livre des mosquées et des lieux de prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
