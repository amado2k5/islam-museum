text: "… إذا أحببت المال فللاستغناء عن البخلاء سأله أحد البخلاء قائلاً : هل تحبُّ المال أيضاً؟ فأجاب الشيخ : إذا أحببت المال فللاستغناء عن البخلاء الذين لا ضمائر لهم. لم أتعلم أيام البلدة بعد ذهب إلى إحدى المدن، وبينما هو في …"
summary:
  ar: "سأل بخيل جحا أيحب المال، فقال إنه لو أحبه فلكي يستغني عن البخلاء الذين لا ضمير لهم. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  en: "Asked by a miser whether he loves money, Juha says that if he loved money it would be to be rid of stingy people with no conscience. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  ur: "ایک کنجوس نے جحا سے پوچھا کہ کیا تمہیں مال پسند ہے، تو اس نے کہا کہ اگر پسند ہو تو اس لیے کہ بے ضمیر کنجوسوں سے بے نیاز ہو جاؤں۔ {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  fr: "Interrogé par un avare pour savoir s'il aime l'argent, Juha dit que s'il l'aimait, ce serait pour se débarrasser des avares sans conscience. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  es: "Preguntado por un avaro si ama el dinero, Juha dice que, si lo amara, sería para librarse de los tacaños sin conciencia. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
