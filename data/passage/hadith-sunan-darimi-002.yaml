text: "زبيد، حدثنا حصين، عن مرة الهمداني قال: جاء أبو قرة الكندي، بكتاب من الشام فحمله فدفعه إلى عبد الله بن مسعود - رضي الله عنه - فنظر فيه فدعا بطست، ثم دعا بماء فمرسه فيه وقال : إنما هلك من"
