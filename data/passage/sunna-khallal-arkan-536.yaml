text: "… يراد به الكلمة بتوابعها من الأعمال الظاهرة، وهذا هو الإسلام الذي بينه النبي حيث قال: الإسلام: أن تشهد أن لا إله إلا الله، وأن محمدًا رسول اللّه، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت. وقد يراد به الكلمة فقط …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 536، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 536, that mentions the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 536 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 536, que menciona la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 536, mentionnant la prière, la zakat, le jeûne et le pèlerinage, ainsi que le témoignage, la prière et la zakat; extrait d'une numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın El-Sünnet adlı kitabının 536. sayfasından bir alıntı, namaz, zekât, oruç ve Hac'ı birlikte ve iman şahadetini, namazı ve zekâtı birlikte zikrediyor; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal, Al-Sunnah, halaman 536, menyebutkan salat, zakat, puasa, dan haji secara bersamaan, serta kesaksian iman, salat, dan zakat; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
