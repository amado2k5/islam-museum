text: "… يراد به الكلمة بتوابعها من الأعمال الظاهرة، وهذا هو الإسلام الذي بينه النبي حيث قال: الإسلام: أن تشهد أن لا إله إلا الله، وأن محمدًا رسول اللّه، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت. وقد يراد به الكلمة فقط …"
summary:
