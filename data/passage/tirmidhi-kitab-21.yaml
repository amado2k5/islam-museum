summary:
  ar: "القسم 21 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب السير عن رسول الله»، ويضم فيها النصوص من 1548 إلى 1618 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 21 of Jami' al-Tirmidhi (The Book on Military Expeditions) in the division of the open hadith dataset the museum took its reports from: reports 1548 to 1618 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 21، عنوان «کتاب السیر عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1548 تا 1618۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 21 de Jami' al-Tirmidhi (El libro de las expediciones militares) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1548 al 1618, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 21 du Jami' al-Tirmidhi (Livre des expéditions militaires), qui comprend les hadiths 1548 à 1618 selon la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 21. bölümü \"Peygamberin Hayat Hikayeleri Kitabı\" başlığını taşımakta olup, 1548'den 1618'e kadar olan metinleri buna göre numaralandırılmış olarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 21 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Biografi Nabi,\" dan berisi teks-teks dari tahun 1548 hingga 1618, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
