text: |-
  ٢٠٧
  صل الميم حخ) المخ الذى فى العظم والمخة أخص منه وفى المثل شر ما يجيئك
  الى مخة عرقوب وجع المخ مخخة در بماسوا الدماغ مخا قال الشاعر
  ولا يسرق الكاب السروق نعالنا • ولانذفى المخ الذى فى الجهاجم
  وخالص كل شى مخه وقد أمخ العظم جرى فيه المخ وأمخت الابل سعنت وفى المثل بين المعغة
  والعجفاء وامتخخت العظم وتمخفته أخرجت مخه ( دخ تمدّخت الابل تقاءست
  فى سيرها وبالذال معجعة أيضا مرخ . المرخ شجر سربع الورى وفى المثل فى كل شجرنار
  واستمجد المرخ والعفار والعفار الزندو* والاعلى والمرخ الزندة وهى الامغل قال الشاءر
  اذا المرخ لم يورتحت العفار • وضن بقدر فلم تعقب
  ومرخت جسدى بالدهن مرخاومى خته ريخا وأمرخت العجين اذا أكثرت ماءه حتى
  رقوذوالممروخ وضع والمريخ سهم طويل له أربع قذذيغلى به قال الشماخ
  أرقت له فى القوم والصبح ساطع • كما-طع المرّيخ شمره الغالى أى أرسله
  والمريخ نجم من الخنس فى السماءانخامسمخ المسخ تحويل صورة لى ماهو أقبح
  منها يقال مسخه اللّٰه فردا والمسيخ من الرجال الذى لاملاحة له ومن اللحم الذى لاطعم له
  وقد مسخ كذاطعمه أى أذهبه وفى المثل هو أمسخ من لحم الحوار أى لاطعم له قال الشاءر
  مليخ مسيخ كلمم الحوار • فلا أنت حلوولا أنت مر
  ويكره فى الفرس المساخ جاته أى ضهوره والماحخىّ اقواس والماسخيات القسى نسبت
  لى ماسعة رجل من الازد كان قوّاسا قال الشاعر
  فرّبت مبراة قخال ضلوعها • من الماسخيات الفسى الموزا
  ⁦(مضمخ)⁩ الامصوخة خوصة النمام والنصى والجمع الامصوخ والاماصيخ ومصختها
  وامتصدتها اذا انتزعتها منه وأخذتها (ملخ الاصعى الملخ السير الشديد وملح القوم ملخة
  صالحة اذا أبعدوا فى الارض قالرؤية بصف الحمار معتزم التجليح ملاخ للق والملق
  مااستوى من الارض وف-لان علخ فى الباطل ملخا يترددفيه ويكثر منه وامتلخ فلان ضرسه
  أى نزعه وامتلخ العقاب عينه انتزءهاوذلان ممتلخ لمقل أى منتزع العقل وامتلذت السسيف
  انتضيته والمليخ من اللهم مثل المسيخ وقد ملح بااضم ملاخسة
  صل النون) ( ج لنيخ الجدرى وكل ما يتنقط ويمتلئ ماء قال كغب بن زهير
  تحطم عنها قيضها عن خراطم • وعن حدق كالنبخ لم يتفتق
  ويقال للرحل اذا كان متصيرا انه نابخة من النواعخ قال ساعدة
  يخشى عليهم من الاملال تابخة •| من النواجخ مثل الجادر الرزم
  ويروى بائجة من البوائج والنبخا الاكة ن خ لمنتخ القلع والنزع نتخ البارى اللحم بعمنسره
  ونتخ ضرسه والشوكة من رجله والمنتاخ المنقاش خخ أبوعم روالنخ السير العنيف
  قال الراجز
  لقد بعثنا حاديا مرجا • أعجم الاأن يتخ نخا • والنح لم يترلالهن مخا
