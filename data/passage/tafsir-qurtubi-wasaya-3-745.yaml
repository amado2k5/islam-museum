text: "… بشَطْرم؟ قال: لا، الثلث والثلث كثير إنك أن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكفّفون الناس الحديث. ومنع أهل الظاهر أيضاً الوصية بأكثر من الثلث وإن أجازها الورثة. وأجاز ذلك الكافة إذا أجازها الورثة، وهو الصحيح؛ لأن المريض …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 745، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 745, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 745 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
