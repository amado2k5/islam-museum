text: |-
  يذ فى للذبيه أن يتعدرف وجه
  هذالفة القاموس
  للصصاح فى ذكر
  عطاود قبل عطرّد وهل لذلكْ من
  تكتة تصريفية احقاله نصر
  قوله مكالد وعكاد أى بوزْن علابط
  وعلبط كمافى القاموس وبه تعلم
  غلط الوانى هنا فى ضبط عكلد
  قاله نصر
  ٢٤٦
  ⁦(عد)⁩
  الراءالطويل يقال يوم عطردون امعطرّد وعطارد نجم من الخنس وعطارد بطن من بي عيم
  رهط أب رجا العطان ى ⁦( طود)⁩ الععود السير السريع وهوملهق بانلمامى بتشديد
  الواوقال الراجز اليك أشكوعنقاءطوّدا ⁦(عقد)⁩ عقدت الحبل والبيع والعهد
  فاذم قدوع قد الرب وغيره أى غاظ فهوعقيد وأ عقدته أنا وعقدته تعقيدا قال الكسانى
  يقال للقطران والرب ونحوه أعقد ته حتى تعقد والمقدة بانم. وضع العقد وهو ماعقد
  عليه يقال جبرت بده على عقدة أى على عثم والعقدة الضبعة والعقدة المكان الكثير الشجر
  أو النخل وفى المل آلف من غراب عقدة لانه لا يطير ويقال للرجل إذاسكن غضبه قد تحللت
  عقده والعقد بالكسر القلادة ويقال رجل أعقد وعقد للذى فى لسانه عقدة وقد عقدلسانه
  يعقد عقداوالعقد أيضا بكسر القاف ما تعقد من الرمل أى تراكم الواحدة عقدة وكان أبو
  همرويقول العقد والعقدة بالفتح وتعقد الرمل وائطيط وغيرهما وخيوط معقدة شدد للكثرة
  وكلام معقد أى مغمض واعتقد ضعة ومالا أى انتناها واعتقد الدى أى اشتدوصاب
  واعتقد كذ ابقلبه وليس له معة ود أى عقدر أى والمعاقدة المعاهدة وتعاقدانقوم فيما ييتهم
  وتعاقدت الكلاب تعاظات والمعاقدم واضع العقدوة وله-م هو من معقد الازاريرادبه
  قرب التنزلة والعمد المعاقد وفلان عقيد الكرم وعقيد الوم والحقداءمن الشاء التى ذنيها
  كانه معة ود والاعقد السكلب لا نعقاد ذنبه جعلوه اسماله معروفا والعنقود واحد عنا قيد
  العنب والعنقادلغة فيه قال الراجز إذلتى سوداه كالعقاد والعاقد الداقة اتى قد
  أقرت باناقاح لانها تعقد يذنبها فيعلم أنها حلت والعاقد حريم البئروما حوله وناقة معة ودة
  القراموثقة الظهر ويحل عقد قال النابفة
  فكف مزارها الابعقد • ممرّليسَ بينقض انطؤون
  ⁦(عكد )⁩ العكدة أصل اللسان وعكد الضب سجنف، وعكد وفاقة عكدة ممينة واين
  عكالد وعكند أى خائر بزيادة اللام ⁦( علد)⁩ شى علد أى صلب وعصب العنق علد والعلندى
  بالفتح الغليظ من كل شىء والجمع العسلاند عن اليزيدى وربما قالواجل علندى بالضم قال أبو
  السهيدع اعلندى الجمل واكاندى اذاغاظ واشتد الاموى العلود بتشديد الدال الكبير
  قال أبو عبيدة كان مجاشع بن دارم علود العنق ⁦(عاهد)⁩ ع"هدت السبىّ أحسنت غذاء.
  (⁦(عمد)⁩. العمود عمود البيت وجمع القسلة أحمدة وسمع الكثرة عمد وعمد وقرى به-ماقوله
  تعالى فى عمد عمددة يقال خباءمعمد وسطع عمود الصبح والعماد الابنية الرفيعة تذكر وتونت
  قال الشاعرع روبن كلثوم ونحن اذا عماد الحى خرت • على الاحفاض غنع من يلينا
  والواحدة عمادة وفلان طويل العماد اذا كان منزله معلم الزائريه وعمدت للشئ أعمده عدا
  قصدت له أى تعمدت وهونقيض الخطا وفعات ذلك ع_داعلى عين وعمد عين أى حجة
  ويقين قال خفاف
  ان تك خيلى قد أصيب صهيمها • فعمد اعلى عين تيمت مالسكا
  وعمدت الشى فانعمد أى أقته بعماد يعتمدع لميه وأعمدته جعلت تحته عمدا وعمده المرض أى
  فدحه ورجل معمود وعميد أى هده العدق وقولهم أنا أعمدم ن كذا أى أعجب منه ومنه
  قول
