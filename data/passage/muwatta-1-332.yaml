text: "ما أبالي لو أقيمت صلاة الصبح وأنا أوتر"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه أن عبد الله بن مسعود قال إنه لا يبالي لو أقيمت صلاة الصبح وهو يوتر؛ وهو في باب الوتر بعد الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.185}"
