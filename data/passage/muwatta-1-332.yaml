label: { ar: "الموطأ 332 — ابن مسعود: ما أبالي لو أقيمت الصبح وأنا أوتر", en: "Muwatta 332", es: "Muwatta 332", fr: "Muwatta 332", ur: "موطا 332", tr: "El-Muvatta 332 — İbn Mes'ud: Vitr namazı kılarken sabah namazının okunmasında bir sakınca görmezdim.", id: "Al-Muwatta 332 — Ibnu Mas'ud: Aku tidak keberatan jika azan subuh dikumandangkan saat aku sedang shalat Witir." }
text: "ما أبالي لو أقيمت صلاة الصبح وأنا أوتر"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه أن عبد الله بن مسعود قال إنه لا يبالي لو أقيمت صلاة الصبح وهو يوتر؛ وهو في باب الوتر بعد الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.185}"
  tr: "Malik'in, Hişam ibn Urva'dan, onun babasından rivayet ettiği bir rivayete göre, Abdullah ibn Mes'ud, Vitr namazını kılarken sabah namazının okunmasında sakınca görmeyeceğini söylemiştir; bu rivayet, sabah namazından sonra kılınan Vitr namazı bölümünde yer almaktadır. Editör, bu rivayetin Malik'ten Ebu Mus'ab ve Muhammed ibn el-Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.185}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Hisham ibn Urwah, dari ayahnya, bahwa Abdullah ibn Mas'ud berkata bahwa ia tidak keberatan jika azan Subuh dikumandangkan saat ia sedang shalat Witir; ini terdapat dalam surah tentang Witir setelah Subuh. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.185}"
