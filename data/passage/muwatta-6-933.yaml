label: { ar: "الموطأ 933 — عروة عن أبيه: كان رسول الله يصلي في مسجد ذي الحليفة ركعتين، فإذا استوت به راحلته أهل", en: "Muwatta 933" }
text: "كان يصلي في مسجد ذي الحليفة ركعتين، فإذا استوت به راحلته أهل"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن رسول الله كان يصلي في مسجد ذي الحليفة ركعتين، فإذا استوت به راحلته أهل. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1066) وسويد (498)، وأن ابن عبد البر قال إنه لم يختلف فيه الرواة عن مالك في إرساله بهذا الإسناد، وأن معناه مسند من حديث ابن عمر وأنس من وجوه ثابتة، وأنه في الصحيحين. {cite:muwatta-maruf-1997 p.447}"
