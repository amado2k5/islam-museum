text: "… عليه حتى يضمن دينه - كتاب الجنائز الباب الرقم من كره القيام للجنازة.. في عيادة اليهود والنصارى.. في الميت يُصلّى عليه بعدما دُفن، من فعله؟.. ما ذكر عن النبي ا ي في صلاته على النَّجاشي في الزوج والأخ أيهما أحق …"
