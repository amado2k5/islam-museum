text: |-
  ١٠٧
  ومنه سميت الشاة التى تذيج عن المونوديوم أسبوعه عقيقة وقال أبو عبيد العقة فى الناس
  والحر ولم نسمعه فى غيرهما وعقيقة البرق ما انعق منه أى تضة ب فى السحاب وبد شبه السيف
  قال عمترة
  وسينى كالمقيقة فهوكمى * سلاحى لا أفل ولا فطارا
  وكل انشقاق فهوانعقاق وكل شق وخرق فى الرمل وغيره فهوعق ويقال انعقت السحابة
  اذا تبعجت بالماء والعقيق ضرب من الفصوص والعقيق واديظاهر المدنية وكل.سيل شقه
  ماء السيل فوسعه فهوعقيق والجمع أعقة وعق بالسهم اذارمى به نجو السماء ويتشد للهذلى
  عقوابسهم ثم قالواصالحوا • ياليتى فى القوم اذ مسحوا اللحى
  وذلك السهم يسمى عتيقة وهو سهم الاعتذار وكانوا يفعاونه فى الجاهلية فان رج-ع السهم
  ملطفا بالدم لم يرضوا الا بالقودوان رجمع نقيا مسهو الحاهم وصالحواءلى الدية وكان
  مسمح اللحى علامة للصلح قال ابن الاعرابى لم يرجع ذلك السهم الانقيا ويروى عة وابسهم :فتح
  القاف وهو من باب المعتلّ ويفشد
  عقوابسهم فلم يشع ريه أحد * ثم استفاؤاوقالواحبذا الوضح
  وعق عن ولده يحقعقا اذاذيح عنه يوم أسبوعه وكذلك اذ احلق عقيقته وعن والده يعق
  عقوقا ومعقة فهوعاق وعتق مثل عامر وعمر والجمع عققة مثل كفرة وفى الحديث ذق عقق
  أى ذق جزاء فعلك يا عاق قاله بعضهم لحم-زة رضى اللّٰه عنه وهو مقتول تقول مفسه أعق فلان
  اذاجاء بالعة وق وأعقت الفرس أى حلت فهى عة وق ولا يقال معق الافى اغة رديئة وهو
  من النوادر والمع عققمش-ل رسول ورسل ونوى العقوق نوى رخو تعلفه الابل العق
  وربماسمواتلات النواة عقيقة والعقاق الحوامل من كل حافر وهوجع عقق مشل قلص
  وقلاص وسلب وسلاب والعقاق بالفتح الحمل يقال أظهرت الاتان عقاقا وكذلك العقق
  قال عدى بن زيد
  وتركت العيريد فى نحره • ونح وصاسمجا فيهاعقق
  وقولهم طلب الايلق العقوق مث-ل لمالايكون وذلك. أنّ الابلق ذكر ولا يكون الذكر حاملا
  وأماقول الشاءر أنشده ابن السكيت
  ولو طلبونى بالعقوق أتيهم * بألف أودّيه الى القوم أفرعا
  فيقال الابلق ويقال موضع والعقعق طائر معروف وصوقه العقعقة وعقة بطن من المرين
  قاسط ومنه قول الاخطل
  وموقع أثر السفار بخلمه • من سودعقة أوبنى البوّال
  وماءعق مثل قع وأعقه اللّه أى أسره مثل أفعه وعقان النخيل والكروم ما يخرج من
  أصولها واذالم تقطع العقان فسدت الاصول وقد أعقت النخلة والكرمة ( لق
  العلق الدم الغليظ والقطعة منه علقة والعلقة دودة فى الماءتمص الدم والجمع علق وعلو
  القرية لغة فى عرق القرية يقال جشمت اليك علمق القربة وذو علق اسم جبل عن أبى عبيدة
  وأنشدلا بن أحر
