text: "ف وتسعة وخمسون ألف دينار وعلى دمشق أربعمائة ألف ونيف، وقرأت في كتاب ابن خرداذبه خراج فنسرين أربعمائة ألف دينار، وخراج حمص ثلاثمائة ألف وأربعون ألفا، وخراج الأردن ثلاثمائة ألف وخمسون ألفا، وخراج فلسطين خمسمائة ألف دينار . وأما المسافات"
