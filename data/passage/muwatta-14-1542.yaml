label: { ar: "الموطأ 1542 — ابن شهاب عن عبيد الله بن عبد الله بن عتبة: سئل عمر عن المرأة وابنتها من ملك اليمين، فقال ما أحب أن أخبرهما جميعا، ونهاه", en: "Muwatta 1542", es: "Muwatta 1542", fr: "Muwatta 1542", ur: "موطا 1542", tr: "El-Muvatta 1542 — İbn Şihab, Ubeydullah ibn Abdullah ibn Utbe'den rivayetle: Ömer'e köle olan bir kadın ve kızı hakkında soru soruldu ve o, \"İkisini de bilgilendirmek istemiyorum\" dedi ve ona bunu yasakladı.", id: "Al-Muwatta 1542 — Ibn Shihab berdasarkan riwayat Ubayd Allah ibn Abdullah ibn Utbah: Umar ditanya tentang seorang wanita dan putrinya yang menjadi budak, dan dia berkata, “Aku tidak ingin memberi tahu mereka berdua,” dan dia melarangnya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن أبيه أن عمر بن الخطاب سئل عن المرأة وابنتها من ملك اليمين، توطأ إحداهما بعد الأخرى؟ فقال عمر ما أحب أن أخبرهما جميعا، ونهاه عن ذلك. {cite:muwatta-maruf-1997 p.45}"
  tr: "Malik, İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe ibn Mes'ud'dan, o da babasından rivayet ettiğine göre, Ömer ibn el-Hattab'a köle olan bir kadın ve kızı hakkında soru sorulmuş; onlardan biriyle diğeriyle cinsel ilişkiye girmek caiz midir? Ömer, \"İkisini de bilgilendirmek istemem\" diye cevap vermiş ve bunu yapmasını yasaklamıştır. {cite:muwatta-maruf-1997 s.45}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud, dari ayahnya, bahwa Umar ibn al-Khattab ditanya tentang seorang wanita dan putrinya yang berstatus budak; apakah diperbolehkan berhubungan intim dengan salah satu dari mereka secara bergantian? Umar menjawab, \"Aku tidak ingin memberi tahu mereka berdua,\" dan dia melarangnya melakukan hal itu. {cite:muwatta-maruf-1997 p.45}"
