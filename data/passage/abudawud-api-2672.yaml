label: { ar: "سنن أبي داود 2672 — الأب والأبوة", en: "Sunan Abi Dawud 2672 — the father and fatherhood", ur: "سنن ابی داؤد 2672 — باپ اور والدیت" }
text: "… اللَّهِ، - يَعْنِي ابْنَ عَبْدِ اللَّهِ - عَنِ ابْنِ عَبَّاسٍ، عَنِ الصَّعْبِ بْنِ جَثَّامَةَ، أَنَّهُ سَأَلَ النَّبِيَّ عَنِ الدَّارِ مِنَ الْمُشْرِكِينَ يُبَيَّتُونَ فَيُصَابُ مِنْ ذَرَارِيِّهِمْ وَنِسَائِهِمْ. فَقَالَ النَّبِيُّ \" هُمْ مِنْهُمْ \". وَكَانَ عَمْرٌو - يَعْنِي ابْنَ دِينَارٍ - يَقُولُ هُمْ مِنْ آبَائِهِمْ. قَالَ الزُّهْرِيُّ ثُمَّ نَهَى رَسُولُ اللَّهِ بَعْدَ ذَلِكَ عَنْ قَتْلِ النِّسَاءِ وَالْوِلْدَانِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2672، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2672 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2672، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
