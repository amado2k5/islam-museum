label: { ar: "سنن النسائي 5223 — الأب والأبوة", en: "Sunan al-Nasa'i 5223 — the father and fatherhood", ur: "سنن نسائی 5223 — باپ اور والدیت", es: "Sunan al-Nasa'i 5223 — El padre y la paternidad" }
text: "أَخْبَرَنَا أَبُو كُرَيْبٍ، مُحَمَّدُ بْنُ الْعَلاَءِ قَالَ حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، قَالَ حَدَّثَنَا أَبُو إِسْحَاقَ، عَنْ أَبِي الأَحْوَصِ، عَنْ أَبِيهِ، قَالَ كُنْتُ جَالِسًا عِنْدَ رَسُولِ اللَّهِ فَرَآنِي رَثَّ الثِّيَابِ فَقَالَ \" أَلَكَ مَالٌ \". قُلْتُ نَعَمْ يَا رَسُولَ اللَّهِ مِنْ كُلِّ الْمَالِ. قَالَ \" فَإِذَا آتَاكَ اللَّهُ مَالاً فَلْيُرَ أَثَرُهُ عَلَيْكَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5223، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5223 (The Book of Adornment), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5223، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5223 (El Libro de los Adornos), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
