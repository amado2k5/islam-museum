label: { ar: "سنن أبي داود 3342 — الأب والأبوة", en: "Sunan Abi Dawud 3342 — the father and fatherhood", ur: "سنن ابی داؤد 3342 — باپ اور والدیت", es: "Sunan Abi Dawud 3342 — El padre y la paternidad" }
text: "… حَدَّثَنِي سَعِيدُ بْنُ أَبِي أَيُّوبَ، أَنَّهُ سَمِعَ أَبَا عَبْدِ اللَّهِ الْقُرَشِيَّ، يَقُولُ سَمِعْتُ أَبَا بُرْدَةَ بْنَ أَبِي مُوسَى الأَشْعَرِيَّ، يَقُولُ عَنْ أَبِيهِ، عَنْ رَسُولِ اللَّهِ أَنَّهُ قَالَ \" إِنَّ أَعْظَمَ الذُّنُوبِ عِنْدَ اللَّهِ أَنْ يَلْقَاهُ بِهَا عَبْدٌ - بَعْدَ الْكَبَائِرِ الَّتِي نَهَى اللَّهُ عَنْهَا - أَنْ يَمُوتَ رَجُلٌ وَعَلَيْهِ دَيْنٌ لاَ يَدَعُ لَهُ قَضَاءً \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3342، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3342 (Commercial Transactions (Kitab Al-Buyu)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3342، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3342 (Transacciones comerciales (Kitab Al-Buyu)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
