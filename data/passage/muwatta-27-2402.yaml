label: { ar: "الموطأ 2402 — مالك: الأمة يقع بها الرجل ولها فيها شرك لا حد عليه", en: "Muwatta 2402", es: "Muwatta 2402", fr: "Muwatta 2402", ur: "موطا 2402", tr: "Al-Muwatta 2402 — Malik: Bir erkek bir cariye ile cinsel ilişkiye girer ve cariye de bundan pay alır, fakat onun için belirlenmiş bir ceza yoktur." }
summary:
  ar: "قال مالك: أحسن ما سمع في الأمة يقع بها الرجل ولها فيها شرك: أنه لا يقام عليه الحد، ويلحق به الولد، وتُقوَّم عليه الجارية حين حملت، فيُعطى شركاؤه حصصهم من الثمن، وتكون الجارية له. {cite:muwatta-maruf-1997 p.393}"
  tr: "Malik şöyle dedi: Bir erkeğin ilişki kurduğu ve ondan pay aldığı bir cariye hakkında duyduğum en iyi hüküm şudur: Erkeğe öngörülen ceza verilmez, çocuk ona nam verilir, cariye hamilelik zamanındaki değerine göre değerlendirilir, partnerlerine fiyat payları verilir ve cariye ona ait olur. {cite:muwatta-maruf-1997 s.393}"
  id: "Malik berkata: Hukum terbaik yang pernah saya dengar mengenai seorang budak perempuan yang memiliki hubungan dengan seorang pria dan pria tersebut memiliki bagian atas dirinya adalah bahwa pria tersebut tidak dihukum dengan hukuman yang ditentukan, anak tersebut dianggap miliknya, budak perempuan tersebut dinilai pada saat kehamilannya, para mitranya diberikan bagian mereka dari harga tersebut, dan budak perempuan tersebut menjadi miliknya. {cite:muwatta-maruf-1997 p.393}"
