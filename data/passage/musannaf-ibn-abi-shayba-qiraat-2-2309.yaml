label: { ar: "مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 2309 — جمع القرآن والمصاحف، نقط المصحف وشكله", en: "the Musannaf of Ibn Abi Shayba, scan volume 2, p. 2309 — the collection of the Qur'an and the codices; the dotting and vowel marks of the mushaf", ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 2309 — جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب", es: "El Musannaf de Ibn Abi Shayba, escaneo del volumen 2, pág. 2309: la colección del Corán y los códices; los puntos y las marcas vocálicas del mushaf." }
text: "… تكون سألتَ كما سأل إبراهيم؟ فقال: كان يقال: جَرِّدوا القرآن. - حدثنا مالك وعَفّان قالا: ثنا حماد بن زيد عن شُعيب بن الحَبْحاب، أن أبا العالية كان يكره الجُمل التي تكتب في المصاحف؛ فاتحة وخاتمة، وقال: جَرِّدوا القرآن. سقط ما …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 2309، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 2309, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 2309 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 2309, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
