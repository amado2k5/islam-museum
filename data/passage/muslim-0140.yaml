label: { ar: "مسلم 140 — من قتل دون ماله فهو شهيد", en: "Muslim 140 — Whoever is killed defending his property is a martyr" }
text: "قال رسول الله لرجل سأله عمن يأتي يريد أخذ ماله: «فلا تعطه مالك»، فإن قاتله قاتله، فإن قُتل فهو شهيد، وإن قتل المعتدي «فهو في النار»"
summary:
  ar: "رواية أبي هريرة في كتاب الإيمان من صحيح مسلم — سؤال وجواب عن الرجل يمتنع من أخذ ماله — ويجيء معناه مقطعاً في رواية عبد الله بن عمرو بن العاص: «من قتل دون ماله فهو شهيد»."
