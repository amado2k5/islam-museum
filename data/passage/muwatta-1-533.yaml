label: { ar: "الموطأ 533 — عائشة: لو أدرك النبي ما أحدث النساء لمنعهن المساجد كما منعه نساء بني إسرائيل", en: "Muwatta 533", es: "Muwatta 533", fr: "Muwatta 533", ur: "موطا 533", tr: "Al-Muwatta 533 — Aişe: Eğer Peygamber kadınların yaptıklarını görseydi, İsrailoğulları kadınlarına yasakladığı gibi, onlara da mescitlere gitmeyi yasaklardı.", id: "Al-Muwatta 533 — Aisyah: Sekiranya Nabi melihat apa yang dilakukan kaum wanita, niscaya beliau akan melarang mereka pergi ke masjid, sebagaimana beliau melarang wanita-wanita Bani Israel." }
text: "لو أدرك رسول الله ما أحدث النساء، لمنعهن المساجد، كما منعه نساء بني إسرائيل"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن عن عائشة، أنها قالت: لو أدرك النبي ما أحدث النساء بعده لمنعهن المساجد كما مُنعه نساء بني إسرائيل. وسأل يحيى بن سعيد عمرة: أومُنع نساء بني إسرائيل المساجد؟ قالت: نعم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، والقعنبي عند أبي داود (695)، والتنيسي عند البخاري (869)، وينقل عن ابن عبد البر ⁦(التمهيد 23/394)⁩ أن سائر رواة الموطأ يقولون «لمنعهن المسجد» بالإفراد، ولم يقل «المساجد» غير يحيى بن يحيى. {cite:muwatta-maruf-1997 p.274} {cite:muwatta-maruf-1997 p.275}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Amre bint Abdülrahman'dan, o da Aişe'den rivayet ederek şöyle buyurmuştur: \"Peygamber, kendisinden sonra kadınların yaptıklarını görseydi, İsrailoğulları kadınlarına yasak olduğu gibi, onlara da mescitlere gitmeyi yasaklardı.\" Yahya ibn Sa'id, Amre'ye sordu: \"İsrailoğulları kadınlarına mescitlere gitmeleri yasak mıydı?\" Amre şöyle cevap verdi: \"Evet.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından, el-Ka'nebi tarafından Ebu Davud'da (695) ve el-Tunisi tarafından Buhari'de (869) rivayet edildiğini belirtmektedir. İbn Abdülbarr'ın (el-Tamhid 23/394) şöyle dediğini aktarıyor: el-Muvatta'nın tüm ravîleri \"onların mescide gitmelerini yasaklardı\" ifadesini tekil olarak söylerken, sadece Yahya ibn Yahya \"mescitlere\" demiştir. {cite:muwatta-maruf-1997 s.274} {cite:muwatta-maruf-1997 s.275}"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id, dari Amrah binti Abd al-Rahman, dari Aisyah, yang berkata: \"Jika Nabi melihat apa yang dilakukan wanita setelahnya, beliau pasti akan melarang mereka pergi ke masjid, sebagaimana wanita Bani Israel dilarang.\" Yahya bin Sa'id bertanya kepada Amrah: \"Apakah wanita Bani Israel dilarang pergi ke masjid?\" Ia menjawab: \"Ya.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwayd, dan oleh al-Qa'nabi dalam Abu Dawud (695), dan oleh al-Tunisi dalam al-Bukhari (869). Ia mengutip Ibnu 'Abd al-Barr (al-Tamhid 23/394) yang mengatakan bahwa semua perawi al-Muwatta' mengatakan \"dia akan melarang mereka pergi ke masjid\" dalam bentuk tunggal, dan hanya Yahya ibn Yahya yang mengatakan \"masjid-masjid.\" {cite:muwatta-maruf-1997 p.274} {cite:muwatta-maruf-1997 p.275}"
