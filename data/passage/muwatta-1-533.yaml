label: { ar: "الموطأ 533 — عائشة: لو أدرك النبي ما أحدث النساء لمنعهن المساجد كما منعه نساء بني إسرائيل", en: "Muwatta 533" }
text: "لو أدرك رسول الله ما أحدث النساء، لمنعهن المساجد، كما منعه نساء بني إسرائيل"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن عن عائشة، أنها قالت: لو أدرك النبي ما أحدث النساء بعده لمنعهن المساجد كما مُنعه نساء بني إسرائيل. وسأل يحيى بن سعيد عمرة: أومُنع نساء بني إسرائيل المساجد؟ قالت: نعم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، والقعنبي عند أبي داود (695)، والتنيسي عند البخاري (869)، وينقل عن ابن عبد البر (التمهيد 23/394) أن سائر رواة الموطأ يقولون «لمنعهن المسجد» بالإفراد، ولم يقل «المساجد» غير يحيى بن يحيى. {cite:muwatta-maruf-1997 p.274} {cite:muwatta-maruf-1997 p.275}"
