text: "البحر الرائق فَيُنَادِي مُنَادٍ فِي السَّمَاءِ أَنْ صَدَقَ عَبْدِي فَافْرِ شُوهُ مِنْ الْجَنَّةِ، وَأَلْبِسُوهُ مِنْ الجنَّةِ، وَافْتَحُو؛ لَهُ بَابًا إِلَى الْجَنَّةِ؛ فَيَأْتِيهِ مِنْ رَوْحِهَا وَطِيِبِهَا وَيُفْسَحُ لَهُ فِي قَبْرِهِ مَدَّ البصر قَالَ: وَيَأْتِيهِ رَجُلٌ حَسَنُ الْوَجْهِ حَسَنُ الثَّيَابِ طَيِّبُ الرِّيحِ، …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 324، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 324, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 324 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
