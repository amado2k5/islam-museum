text: "… فعمد لبدر. وخفض أبو سُفيان فلصق بساحل البحر، وأحرز ما معه، فأرسل إلى قريش، فأتاهم الخبرُ بالجُحْفَة. فقال أبو جهل : والله لا نرجع حتى نقدم بدراً فنقيم بها. فكره ذلك الأخنس بن شريق وأشار بالرجعة، فأبوا وعصوه. فرجع ببني …"
