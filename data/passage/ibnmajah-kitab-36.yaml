summary:
  ar: "القسم 36 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفتن»، ويضم فيها النصوص من 3927 إلى 4099 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 36 of Sunan Ibn Majah (Tribulations) in the division of the open hadith dataset the museum took its reports from: reports 3927 to 4099 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 36، عنوان «کتاب الفتن»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3927 تا 4099۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 36 de Sunan Ibn Majah (Tribulaciones) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3927 al 4099, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 36 du Sunan Ibn Majah (Tribulations), correspondant aux hadiths 3927 à 4099 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
