label: { ar: "نوادر جحا الكبرى، ص 67 — «أعطني الملعقة الكبيرة لأموت أنا أيضاً»", en: "Nawadir Juha al-Kubra, p. 67 — 'Give Me the Big Spoon So I Can Die Too'", ur: "نوادر جحا الکبریٰ، ص 67 — «مجھے بڑا چمچ دو تاکہ میں بھی مر جاؤں»", fr: "Nawadir Juha al-Kubra, p. 67 — « Donne-moi la grande cuillère, que je meure aussi »", es: "Nawadir Juha al-Kubra, p. 67 — «Dame la cuchara grande para morir yo también»", tr: "Juha'nın Büyük Fıkraları, s. 67 — “Bana da büyük kaşığı verin ki ben de öleyim.”", id: "Anekdot Hebat Juha, hlm. 67 — “Berikan aku sendok besar agar aku juga bisa mati.”" }
text: "… أَعطني الملعقة الكبيرة لأموت أنا أيضاً ضاف عندَ أحدِهِم في يوم شديد الحر، فجاؤوا بكأسٍ فيه منقوعُ المشمش وأخذ صاحب البيت ملعقة معدنية كبيرة، وناول الشيخ ملعقة ذهبية صغيرة، وبدأا لا ينبس بينت شفة : لا يتكلم. الجلبة : الضجّة."
summary:
  ar: "في بيت مضيف في يوم حار، أخذ المضيف ملعقة معدنية كبيرة بينما أُعطي جحا ملعقة صغيرة من الذهب لشراب المشمش؛ فقال جحا إنه لا يطيق ذلك، وطلب الملعقة الكبيرة ليموت هو أيضًا. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  en: "At a host's house on a hot day, the host takes a big metal spoon while Juha gets a small gold one for apricot drink; Juha says he cannot bear it and asks for the big spoon so he can die too. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  ur: "ایک گرم دن میزبان کے گھر میں میزبان نے بڑا دھاتی چمچ لیا جبکہ جحا کو خوبانی کے شربت کے لیے سونے کا چھوٹا چمچ ملا؛ جحا نے کہا کہ میں یہ برداشت نہیں کر سکتا، اور بڑا چمچ مانگا تاکہ میں بھی مر جاؤں۔ {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  fr: "Chez un hôte, par une journée chaude, l'hôte prend une grande cuillère en métal tandis que Juha reçoit une petite cuillère en or pour la boisson à l'abricot; Juha dit qu'il ne peut le supporter et demande la grande cuillère pour mourir lui aussi. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  es: "En casa de un anfitrión, en un día caluroso, el anfitrión toma una cuchara grande de metal mientras a Juha le dan una pequeña de oro para la bebida de albaricoque; Juha dice que no lo soporta y pide la cuchara grande para morir él también. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  tr: "Sıcak bir günde bir ev sahibinin evinde, ev sahibi büyük bir metal kaşık alırken, Juha'ya kayısı suyu için küçük bir altın kaşık verildi. Juha buna dayanamadığını söyledi ve kendisinin de ölmek için büyük kaşığı istedi. {cite:juha-nawadir-kubra-djuwaydi s. 67}"
  id: "Di rumah seorang tuan rumah pada hari yang panas, tuan rumah mengambil sendok logam besar sementara Juha diberi sendok emas kecil untuk minuman aprikotnya. Juha berkata dia tidak tahan dan meminta sendok besar agar dia juga bisa mati. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
