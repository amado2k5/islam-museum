label: { ar: "سنن ابن ماجه 1962 — الأب والأبوة", en: "Sunan Ibn Majah 1962 — the father and fatherhood", ur: "سنن ابن ماجہ 1962 — باپ اور والدیت" }
text: "… بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدَةُ بْنُ سُلَيْمَانَ، عَنْ عَبْدِ الْعَزِيزِ بْنِ عُمَرَ، عَنِ الرَّبِيعِ بْنِ سَبْرَةَ، عَنْ أَبِيهِ، قَالَ خَرَجْنَا مَعَ رَسُولِ اللَّهِ ـ فِي حَجَّةِ الْوَدَاعِ فَقَالُوا يَا رَسُولَ اللَّهِ إِنَّ الْعُزْبَةَ قَدِ اشْتَدَّتْ عَلَيْنَا. قَالَ \" فَاسْتَمْتِعُوا مِنْ هَذِهِ النِّسَاءِ \". فَأَتَيْنَاهُنَّ فَأَبَيْنَ أَنْ يَنْكِحْنَنَا إِلاَّ أَنْ نَجْعَلَ بَيْنَنَا وَبَيْنَهُنَّ أَجَلاً فَذَكَرُوا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1962، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1962 (The Chapters on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1962، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
