text: "… إلى أن بُعِث النبى ونزل القرءان والعربُ على ذلك، فكانوا يكُتُبون القرءان حين ينزل ويقرؤه عليهم النبى فى الخاف والعُسُب. فعن زيد بن تابت أنه قال عند جمعه القرءان فِعَلْتُ أنَتَعّ القُرْءانَ من العُسُب واللّخاف. وفى حديث الزهرى قُبِض رسول …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 3، ص 475، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 3, p. 475, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 3، ص 475 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Subh al-A'sha de al-Qalqashandi, volumen 3, pág. 475, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 3, p. 475) mentionne la collecte du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin resimli 3. cildinin 475. sayfasında, Kur'an'ın derlenmesi ve el yazmaları hakkında bilgi verilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Subh al-A'sha karya Al-Qalqashandi, jilid 3 bergambar, halaman 475, menyebutkan penyusunan Al-Qur'an dan manuskripnya; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
