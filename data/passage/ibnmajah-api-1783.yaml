label: { ar: "سنن ابن ماجه 1783 — ما فرضه الله ورسوله، ما فُرض على الناس", en: "Sunan Ibn Majah 1783 — what God and His Messenger made obligatory; what was made obligatory on people", ur: "سنن ابن ماجہ 1783 — جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا", fr: "Sunan Ibn Majah 1783 — ce que Dieu et Son Messager ont rendu obligatoire ; ce qui a été imposé aux gens", es: "Sunan Ibn Mayah 1783 — lo que Dios y Su Mensajero hicieron obligatorio; lo que se impuso a la gente" }
text: "… أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنِّي رَسُولُ اللَّهِ فَإِنْ هُمْ أَطَاعُوا لِذَلِكَ فَأَعْلِمْهُمْ أَنَّ اللَّهَ افْتَرَضَ عَلَيْهِمْ خَمْسَ صَلَوَاتٍ فِي كُلِّ يَوْمٍ وَلَيْلَةٍ فَإِنْ هُمْ أَطَاعُوا لِذَلِكَ فَأَعْلِمْهُمْ أَنَّ اللَّهَ افْتَرَضَ عَلَيْهِمْ صَدَقَةً فِي أَمْوَالِهِمْ تُؤْخَذُ مِنْ أَغْنِيَائِهِمْ فَتُرَدُّ فِي فُقَرَائِهِمْ فَإِنْ هُمْ أَطَاعُوا لِذَلِكَ فَإِيَّاكَ وَكَرَائِمَ أَمْوَالِهِمْ وَاتَّقِ دَعْوَةَ الْمَظْلُومِ فَإِنَّهَا لَيْسَ بَيْنَهَا وَبَيْنَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1783، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 1783 (The Chapters Regarding Zakat), whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1783، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 1783, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 1783, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
