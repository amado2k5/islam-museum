label: { ar: "الموطأ 56 — ربيعة بن الهدير يتعشى مع عمر ثم يصلي ولا يتوضأ", en: "Muwatta 56" }
summary:
  ar: "أثر يرويه مالك عن محمد بن المنكدر وصفوان بن سليم، كلاهما عن محمد بن إبراهيم التيمي عن ربيعة بن عبد الله بن الهدير، في باب ترك الوضوء مما مست النار: تعشى ربيعة مع عمر بن الخطاب ثم صلى عمر ولم يتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.62}"
