label: { ar: "الموطأ 56 — ربيعة بن الهدير يتعشى مع عمر ثم يصلي ولا يتوضأ", en: "Muwatta 56", es: "Muwatta 56", fr: "Muwatta 56", ur: "موطا 56", tr: "El-Muvatta 56 — Rabi’ah ibn al-Hudayr, Ömer ile akşam yemeği yedikten sonra abdest almadan namaz kıldı.", id: "Al-Muwatta 56 — Rabi’ah ibn al-Hudayr makan malam bersama Umar, kemudian shalat tanpa berwudhu." }
summary:
  ar: "أثر يرويه مالك عن محمد بن المنكدر وصفوان بن سليم، كلاهما عن محمد بن إبراهيم التيمي عن ربيعة بن عبد الله بن الهدير، في باب ترك الوضوء مما مست النار: تعشى ربيعة مع عمر بن الخطاب ثم صلى عمر ولم يتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.62}"
  tr: "Malik'in, Muhammed ibn el-Munkadir ve Safvan ibn Salim'den, her ikisinin de Muhammed ibn İbrahim el-Taymi'den, Rabi'ah ibn Abdullah ibn el-Hudayr'dan rivayet ettiği, ateş üzerinde pişirilmiş yemek yedikten sonra abdest almamak bölümünde yer alan bir rivayete göre: Rabi'ah, Ömer ibn el-Hattab ile yemek yedi, sonra Ömer abdest almadan namaz kıldı. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve İbn Vahb tarafından, el-Tahavi ve Muhammed ibn el-Hasan tarafından da kaydedildiği şeklinde nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.62}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Muhammad ibn al-Munkadir dan Safwan ibn Salim, keduanya atas otoritas Muhammad ibn Ibrahim al-Taymi, atas otoritas Rabi'ah ibn Abdullah ibn al-Hudayr, dalam bab tentang tidak berwudhu setelah makan makanan yang dimasak di atas api: Rabi'ah makan bersama Umar ibn al-Khattab, kemudian Umar shalat tanpa berwudhu. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, dan Ibn Wahb, sebagaimana dicatat oleh al-Tahawi dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.62}"
