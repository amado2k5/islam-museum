label: { ar: "الموطأ 433 — بلاغ عن أبي ذر: مسح الحصباء مسحة واحدة وتركها خير من حمر النعم", en: "Muwatta 433", es: "Muwatta 433", fr: "Muwatta 433", ur: "موطا 433", tr: "El-Muvatta 433 — Ebu Zer'den rivayet edilen bir hadis: Taşları bir kere silip bırakmak, kızıl develerden daha hayırlıdır.", id: "Al-Muwatta 433 — Sebuah riwayat dari Abu Dharr: Mengusap kerikil sekali lalu membiarkannya lebih baik daripada unta merah" }
text: "مسح الحصباء مسحة واحدة، وتركها خير من حمر النعم"
summary:
  ar: "بلاغ يرويه مالك عن يحيى بن سعيد، في باب مسح الحصباء في الصلاة: بلغه أن أبا ذر كان يقول إن مسح الحصباء في الصلاة مسحة واحدة، وتركها خير من حمر النعم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن حديث أبي ذر في مسح الحصباء مرفوع صحيح محفوظ وساقه من طريق الزهري عن أبي الأحوص عن أبي ذر ⁦(التمهيد 24/116)⁩؛ ويرى المحقق أن إسناده ضعيف لجهالة أبي الأحوص الليثي الذي تفرد الزهري بالرواية عنه وضعفه ابن معين، وأن الترمذي حسّنه لأحاديث الباب، وأن الألباني ضعفه، وأن الثابت حديث معيقيب في الصحيحين: إن كنت لا بد فاعلاً فمرة واحدة. {cite:muwatta-maruf-1997 p.223} {cite:muwatta-maruf-1997 p.224}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği bir hadiste, namazda çakıl taşlarına dokunma bölümünde şöyle denmektedir: Malik, Ebu Zer'in namazda çakıl taşlarına dokunmanın sadece bir kere yapıldığını ve dokunmamanın kırmızı develerden daha hayırlı olduğunu söylediğini işitmiştir. Editör, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve İbn Abdülberr'in, Ebu Zer'in çakıl taşlarına dokunma hakkındaki hadisinin sahih, iyi korunmuş ve Peygamberimize kadar uzanan bir hadis olduğunu söylediğini aktarmaktadır. İbn Abdülberr, bunu Ebu Zer'in Ebu Ahvas'tan, Ebu Zer'den rivayet ettiği isnad zinciriyle aktarmıştır (el-Temhid 24/116). Editör, Ebu Ahvas el-Laythi'nin bilinmeyen statüsü nedeniyle isnad zincirinin zayıf olduğuna inanmaktadır; Ebu Zer'in tek ravîsi olduğu Ebu Ahvas el-Laythi'yi İbn Ma'in zayıf bir ravî olarak değerlendirmiştir. Ayrıca Tirmizi'nin bu suredeki hadisler nedeniyle bunu kabul edilebilir bulduğunu, El-Albani'nin ise zayıf bulduğunu belirtiyor. İki Sahih'te de geçen sahih hadis ise Muaykib'in hadisidir: \"Eğer yapmanız gerekiyorsa, sadece bir kere yapın.\" {cite:muwatta-maruf-1997 s.223} {cite:muwatta-maruf-1997 s.224}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id, dalam bab tentang mengusap kerikil saat shalat: Ia mendengar bahwa Abu Dharr biasa mengatakan bahwa mengusap kerikil saat shalat hanya dilakukan sekali, dan membiarkannya lebih baik daripada unta merah. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik, dan mengutip Ibn 'Abd al-Barr yang mengatakan bahwa hadits Abu Dharr tentang mengusap kerikil adalah sahih, terawat dengan baik, dan dapat ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya), dan ia mengutipnya melalui sanad al-Zuhri atas otoritas Abu al-Ahwas atas otoritas Abu Dharr (al-Tamhid 24/116). Editor berpendapat bahwa sanadnya lemah karena status Abu al-Ahwas al-Laythi yang tidak diketahui, yang mana al-Zuhri adalah satu-satunya perawi, dan yang dianggap lemah oleh Ibn Ma'in. Ia juga mencatat bahwa al-Tirmidhi menganggapnya dapat diterima karena hadits-hadits dalam bab ini, sedangkan al-Albani menganggapnya lemah. Hadits yang telah terbukti adalah hadits Mu'ayqib dalam dua kitab Sahih: \"Jika kamu harus melakukannya, maka lakukanlah hanya sekali.\" {cite:muwatta-maruf-1997 p.223} {cite:muwatta-maruf-1997 p.224}"
