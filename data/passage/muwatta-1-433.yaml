label: { ar: "الموطأ 433 — بلاغ عن أبي ذر: مسح الحصباء مسحة واحدة وتركها خير من حمر النعم", en: "Muwatta 433" }
text: "مسح الحصباء مسحة واحدة، وتركها خير من حمر النعم"
summary:
  ar: "بلاغ يرويه مالك عن يحيى بن سعيد، في باب مسح الحصباء في الصلاة: بلغه أن أبا ذر كان يقول إن مسح الحصباء في الصلاة مسحة واحدة، وتركها خير من حمر النعم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن حديث أبي ذر في مسح الحصباء مرفوع صحيح محفوظ وساقه من طريق الزهري عن أبي الأحوص عن أبي ذر (التمهيد 24/116)؛ ويرى المحقق أن إسناده ضعيف لجهالة أبي الأحوص الليثي الذي تفرد الزهري بالرواية عنه وضعفه ابن معين، وأن الترمذي حسّنه لأحاديث الباب، وأن الألباني ضعفه، وأن الثابت حديث معيقيب في الصحيحين: إن كنت لا بد فاعلاً فمرة واحدة. {cite:muwatta-maruf-1997 p.223} {cite:muwatta-maruf-1997 p.224}"
