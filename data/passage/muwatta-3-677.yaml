text: "اتجروا في أموال اليتامى، لا تأكلها الزكاة"
summary:
  ar: "أول حديث في باب زكاة أموال اليتامى والتجارة لهم فيها. بلاغ يرويه مالك أنه بلغه أن عمر بن الخطاب قال: اتجروا في أموال اليتامى لا تأكلها الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأنه روي موصولاً موقوفاً من طريق معلول عند الدارقطني (2/110)، ويحيل على تلخيص الحبير. {cite:muwatta-maruf-1997 p.342}"
  tr: "Yetimlerin parası üzerine zekât ve onunla ticaret yapılması konusundaki bölümdeki ilk hadis. Malik'in rivayetine göre Ömer ibn el-Hattab şöyle buyurmuştur: \"Yetimlerin parasıyla ticaret yapın ki zekât onu tüketmesin.\" Editör, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini ve bunun, el-Daraqutni'de (2/110) hem bağlı bir isnad zinciriyle hem de eksik bir isnad zinciriyle kesintiye uğramış bir isnad zinciriyle rivayet edildiğini belirtiyor ve Talkhis el-Habir'e atıfta bulunuyor. {cite:muwatta-maruf-1997 s.342}"
  id: "Hadits pertama dalam bab tentang zakat atas harta anak yatim dan memperdagangkannya. Sebuah riwayat yang dinarasikan oleh Malik bahwa ia mendengar bahwa Umar ibn al-Khattab berkata: \"Perdagangkanlah harta anak yatim agar zakat tidak menghabiskannya.\" Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan bahwa hadits tersebut diriwayatkan dengan sanad yang berkesinambungan dan sanad yang terputus karena sanad yang cacat dalam al-Daraqutni (2/110), dan ia merujuk pada Talkhis al-Habir. {cite:muwatta-maruf-1997 p.342}"
