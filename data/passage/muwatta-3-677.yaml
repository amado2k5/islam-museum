text: "اتجروا في أموال اليتامى، لا تأكلها الزكاة"
summary:
  ar: "أول حديث في باب زكاة أموال اليتامى والتجارة لهم فيها. بلاغ يرويه مالك أنه بلغه أن عمر بن الخطاب قال: اتجروا في أموال اليتامى لا تأكلها الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأنه روي موصولاً موقوفاً من طريق معلول عند الدارقطني (2/110)، ويحيل على تلخيص الحبير. {cite:muwatta-maruf-1997 p.342}"
