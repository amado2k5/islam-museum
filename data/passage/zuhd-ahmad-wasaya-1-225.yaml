text: "… الإِقَامَةَ عَلَى الأَمْوَالِ وَإِصْلاحِهَا، وَتَرْكَنَا الْغَزْوَ. فَمَا زَالَ أَبُو أَيُّوبَ شَاخِصًا فِي سَبِيلِ اللّهُ، حَتَّى دُفِنَ بِأَرْض الرُّومِ. رواه الترمذي. التفسير وقال: صحيح، الصحيحة."
