label: { ar: "الموطأ 2666 — نافع عن ابن عمر: رؤيا النبي للمسيح ابن مريم والمسيح الدجال عند الكعبة", en: "Muwatta 2666" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: أراني الليلة عند الكعبة، فرأيت رجلا آدم كأحسن ما أنت راء من أدم الرجال، له لمة كأحسن ما أنت راء من اللمم، قد رجّلها فهي تقطر ماء، متكئا على رجلين أو على عواتق رجلين، يطوف بالكعبة، فسألت: من هذا؟ قيل: هذا المسيح بن مريم. ثم إذا أنا برجل جعد قطط، أعور العين اليمنى، كأنها عنبة طافية، فسألت: من هذا؟ فقيل: هذا المسيح الدجال. {cite:muwatta-maruf-1997 p.506}"
