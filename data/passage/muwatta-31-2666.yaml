label: { ar: "الموطأ 2666 — نافع عن ابن عمر: رؤيا النبي للمسيح ابن مريم والمسيح الدجال عند الكعبة", en: "Muwatta 2666", ur: "موطأ 2666 — نبی کا خواب: مسیح اور دجال کعبہ کے پاس", es: "Muwatta 2666", fr: "Muwatta 2666", tr: "El-Muvatta 2666 — İbn Ömer'den rivayet edildiğine göre Nafi': Peygamberin Kâbe'de Meryem oğlu Mesih ve Deccal'i görmesi", id: "Al-Muwatta 2666 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Penglihatan Nabi tentang Al-Masih, putra Maryam, dan Antikristus di Ka'bah" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: أراني الليلة عند الكعبة، فرأيت رجلا آدم كأحسن ما أنت راء من أدم الرجال، له لمة كأحسن ما أنت راء من اللمم، قد رجّلها فهي تقطر ماء، متكئا على رجلين أو على عواتق رجلين، يطوف بالكعبة، فسألت: من هذا؟ قيل: هذا المسيح بن مريم. ثم إذا أنا برجل جعد قطط، أعور العين اليمنى، كأنها عنبة طافية، فسألت: من هذا؟ فقيل: هذا المسيح الدجال. {cite:muwatta-maruf-1997 p.506}"
  ur: "موطأ میں حدیث، نمبر 2666: نبی نے خواب دیکھا کہ وہ کعبہ کے پاس ہیں، وہاں عیسیٰ کو طواف کرتے دیکھا اور ایک گنجا آنکھ والا آدمی جسے دجال کہا جاتا ہے۔"
  tr: "Malik, Abdullah ibn Umar'dan rivayetle Nafi'den naklederek, Allah Resulü'nün şöyle buyurduğunu aktarmıştır: “Dün gece Kâbe'de kendimi gördüm ve esmer tenli, görebileceğiniz en yakışıklı, saçları da görebileceğiniz en güzel, taranmış ve su damlayan bir adam gördüm. İki adamın omuzlarına yaslanmış, Kâbe'nin tavafını yapıyordu. 'Bu kimdir?' diye sordum. 'Bu, Meryem oğlu Mesih'tir' denildi. Sonra kıvırcık, kabarık saçlı, sağ gözü kör, yüzen bir üzüm tanesi gibi olan bir adam gördüm. 'Bu kimdir?' diye sordum. 'Bu, Deccal'dir' denildi.” {cite:muwatta-maruf-1997 s.506}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa Rasulullah SAW bersabda: “Semalam aku melihat diriku di Ka'bah, dan aku melihat seorang laki-laki berkulit gelap, laki-laki paling tampan yang pernah kalian lihat, dengan rambut paling indah yang pernah kalian lihat, disisir dan basah kuyup, bersandar pada dua orang atau di pundak dua orang, melakukan tawaf di Ka'bah. Aku bertanya: ‘Siapakah ini?’ Dijawab: ‘Ini adalah Al-Masih, putra Maryam.’ Kemudian aku melihat seorang laki-laki dengan rambut keriting dan kusut, buta di mata kanannya, yang seperti buah anggur yang mengambang. Aku bertanya: ‘Siapakah ini?’ Dijawab: ‘Ini adalah Antikristus.’” {cite:muwatta-maruf-1997 p.506}"
