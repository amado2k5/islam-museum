label: { ar: "سنن ابن ماجه 714 — وصية أو عهد أخير", en: "Sunan Ibn Majah 714 — a testament or parting counsel", ur: "سنن ابن ماجہ 714 — وصیت یا آخری نصیحت", es: "Sunan Ibn Majah 714 - un testamento o consejo de despedida", fr: "Sunan Ibn Majah 714 - un testament ou un conseil d'adieu", tr: "Sunan İbn Majah 714 - Son bir vasiyet veya antlaşma", id: "Sunan Ibnu Majah 714 — Wasiat atau perjanjian terakhir" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا حَفْصُ بْنُ غِيَاثٍ، عَنْ أَشْعَثَ، عَنِ الْحَسَنِ، عَنْ عُثْمَانَ بْنِ أَبِي الْعَاصِ، قَالَ كَانَ آخِرُ مَا عَهِدَ إِلَىَّ النَّبِيُّ ـ أَنْ لاَ أَتَّخِذَ مُؤَذِّنًا يَأْخُذُ عَلَى الأَذَانِ أَجْرًا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 714، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 714 (The Book of the Adhan and the Sunnah Regarding It), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 714، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 714 (El Libro del Adhan y la Sunnah al respecto), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 714 (Le Livre de l'Adhan et la Sunna y afférente), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "İbn Majah'ın Sünen'inde yer alan 714 numaralı hadiste, vasiyet veya son bir ahitten bahsedilmektedir. Bu hadis, vasiyetler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 714, menyebutkan tentang wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
