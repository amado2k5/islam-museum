label:
  ar: "البخاري 2227 — ثلاثة أنا خصمهم يوم القيامة"
  en: "Bukhari 2227 — Three whose adversary I shall be on the Day of Resurrection"
  ur: "بخاری 2227 — تین لوگ جن کا میں قیامت کے دن مدمقابل ہوں گا"
text: "قال الله ثلاثة أنا خصمهم يوم القيامة، رجل أعطى بي ثم غدر، ورجل باع حرا فأكل ثمنه، ورجل استأجر أجيرا فاستوفى منه، ولم يعط أجره ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 2227: ثلاثة أنا خصمهم يوم القيامة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 2227: Three whose adversary I shall be on the Day of Resurrection. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 2227: تین لوگ جن کا میں قیامت کے دن مدمقابل ہوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
