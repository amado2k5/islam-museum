text: "… يكره أن يموت بالأرض الق هاجر منها، ولم يكن له يومئذ إلا ابنة واحدة. فقال : يارسول اللّٰه أوصى بمالى كله ؟ قال : لا الثلث والثلث كثير، ولعل اللّٰه أن يرفعك فينتفع بك ناس ويضر بك آخرون حدثنا أبو …"
