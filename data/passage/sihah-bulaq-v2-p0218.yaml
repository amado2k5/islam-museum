text: |-
  •( -)•
  ٣٦٩
  نصروانيهم وشدوا أزره • بحنين يوم نوا كل الابطال
  وقولهم رجع يخفى حنين قال ابن السكيت عن أبى اليقظان كان حنين رجلا شديدا ادّى ألى
  أسدين هاشم بن عبد مناف فأتى عبد المطاب وعليه خفان أحران فقال ياعتم أنا ابن أسدبن
  هاشم فقال عبد المطلب لا وئياب هاشم ما أءرف شمائل هائم فيك فارجع فقالوارجع
  حنين يخفيه فصار مثلا وقال غسيره هو اسم اسكاف من أهل الحيرة ساومه أعرابىّ يجفين ولم
  بشترهما ففاظه ذلك وعلق أحد انظفين فى طريقه وتقسدّم فطرح الاخروكن له وجاه
  الاعرابى فرأى أحد الخفين فقال ما أشبه هذايخف حنين لو كان معهآخر لاشتريته فتقدم
  فرأى الخف الثانى مطر وحا فى الطريق فنزل وعقل بعيره ورجع الى الاوّل فذهب الاسكاف
  براحلله وياء الى الحي يخقى حنين والحنّ بالكسرى من الجنّ قال الراجز
  أيت أهوى فى شاطين ترن • مختلف نجراهم حن وجنّ
  ورجل مح:ون أى مجنون وبه حنة أى جنة ويقال الحنّ خلق بين الجنّ والانس و-ن بالضم
  اسم رجل ( ين لجين الوقت يقال حينتذ قال خويلد
  كالي الرماد عظيم القدر جفنته • حين الشتاءكوض المنهل اللقف
  وربما أدخلواعبه الناه قال أبو وجزة السعدىّ
  العاطفون تحين مامن غاطف • والمطعمون زمان أين المطعم
  والهين أيضا المدّة ومنه قوله تعالى هل أتى على الانسان حينمن الدهر وحان له أن يفعل كذا
  يحين حينا أى آن وسان حبنه أى قرب وقته قالت بثينة ولم يعرف أها غيره
  وان سلوى عن جيل لساعة • من الدهر ماحانت ولاحان حينها
  وعاملمته محاينة مثل مساوعة وأحينت بالمكان اذا أقت به حينا وحينت الناقة اذا جعت
  لهاف كل يوم ولسلة وقتاتحلبها فيه قال المخبل
  اذا أقنت أروى عيالك أفنها • وان حينت أربى على الوطب حينها
  وفلان يأكل الحينة والحينة أى المرة الواحدة فى اليوم والليلة وفلان يفعل كذا أحيانا:
  وفى الاحايين وتحين الوارش اذا انتظروقت الاكل ليدخل والمين بالفتح الهلاليقال حان.
  الرجل أى هن وأحانه اللّٰه والحانات المواضع التى يباع فيها الهر والحانية الهر منسوبة الى
  الحانة وهى سانوت الممار والحانوت معروف يذ كرو يؤنت وأصله حانوة مثل ترقوة فلماسكنت
  الواوانقلبت هاه التأنيت تاء والجع الحوانيت لات الرابع منه حرف لين واغماردّ الاسم الذى
  جادز أر بعسة أحوف الى الرباعى فى المع والتصغير إذالم يكن الرابع منه أحد حروف
  المدواللين
  وخطته ليقصر وخدنت الطعام اذاغيبته واستعددته للشدة والجبنة ما تحمله
  فى حضذك وفى الحديت ولا تتخذخينة وانه لذ وخبنات وذ وختبات وهو الذى
  يصلح مرّة ويفسد أخرى ختن انحتن بالهريك كل من كان من قبل المرأة مثل الاب
  والاخ وهم الاخمان هحكذاعند العرب وأماعند العامة نفحتن الزجل زوج
  ٩٢
  ساج
