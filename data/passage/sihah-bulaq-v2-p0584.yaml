text: |-
  { بفغ البغبغة ضرب من الهدير والبفيبغ البئر القريبة النزع قال الراجز
  يارب ماه لك بالاجبال بغيبغ ينزع بالعقال • طام عليه ورق الهدال
  والمبغبغ السريع العجل غ بطغت المكان بلوغاوصات اليه وكذلك اذاشارفت
  علميه ومنه قوله تعالى قاذا بلغن أجلهن أى قاربنه وبلغ الغلام أدرك والابلاغ الايصال
  وكذلك التبليغ والاسم منه البلاغ والبلاغ أيضا السكفاية ومنه قول الراجز
  • تزج من دنياك بالبلاغ• وبلغت الرسالة وبلغ الفارس اذا متيدمبعنان فرسه ليزيدفى
  جريه وشئ بالمغ أى حيد وقدبلغ فى الجودة مبلغا ويقال أمر اللّه بلغ بالفتح أى بالغ من
  قوله تعالى ان اللّه بالغ أمره قال الفراءيقاك اللهم سممع لابلغ وسبمع لابلغ معناه يسمع به
  ولا يتمّ وقال السكسائىً اذاسمع الرحسل الخبر لا يعجبه قال اللهم سمع لابلغ وسمع لابلغ وسمعا
  لا بلغا وولهم أ-ق بلغ بالكسرأى هومع حماقته يبلغ مايريده بقال بلغ ملغ والبلاغة
  الفصاحة وبلغ الرجل بالضم أى صار بليغا والبلاغات كلوشايات والبلغين الداهية
  وفى الحديث ان عائشة قالت لع لى رضى اللّٰه عنهما حين أخذت بلغت منا البلغين وبالغ فلان
  فى أمرى اذالم يقصرفيه والبلغة ما يتباغ به من العيس وتبلغ بكذا أى اكتفيه وتبلفت
  به العلة أى اشتدت. والبالغاء الاكارع فى لغة أهل المدينة قال أبو عبيد وأصلها بالفارسية
  يايها ( غ البوغاء التربة الرخوة التى كأنها ذريرة عن أبى عبيد وتبوّغ الدم بصاحبه
  وتديغ به أى هاج يه وحكى ابن السكيت عن الفراء تبوّغ الرجل بصاحبه فغلبه وتبوّغ
  الدم بصاحبه فقتله وفى الحديث ع لميكم بالجامة لا يتبيغ بأحدكم الدم فيقتله أى لا يتهيج
  ويشال أصدله يتبقى من البغى فقلب مثل جذب وجبذ
  صل التاء غ لتغتفة حكاية صوت يقال سمعت لهذا الحلى تفتغة اذا
  أصاب بعضه بعضا فسيعت صوته
  ل التاء ت لمنفتخ الذى اذا تكلم حترّك أسنانه فى فيه واضطرب اضطرا با
  شديد اخلم يسين كلامه قال رؤية
  ث غ ل رأسة ال ل ى تالتغ والى األايب ماسا لمن أملة فانشدخ
  غ) مغت رأسه ثمفا أى شدخته وحكى الفراء عن الكسائى تغة الجبل أعلاه قال
  الفراء والذى سمعت أناغفة بالنون أبو عمرو ثمفت الثوب صبغته صبغا مشبعا قال الشاعر
  تركت بن الغزيل غير نفر • كانّ لحاهم غفت بورس
  سل الدال بخ) ديغ فلان اهابه يديغه ويدبغه دبغا ودباغة ودباعا وفى
  الجديث دباغها طهورها والدباغ أيضامايديغبه يقال الجلد فى الدباغ وكذلك الدبغ
  والدبغة بالكسر والدبغة بالفتح المرة الواحدة وتقول دبنت الجدد فاندبغ غغ
  الدغدغة معروفة ⁦(دمغ)⁩ الدماغ واحد الادمغة وقد د مغه دمغاشجه حتى بلفت
  الشجسة الدماغ واسمها الدامضة لان الشجاج عشرة أوّلها القاشرة وهى الحارصسة ثم
  الباضعة ثم الدامية ثم المتلاحة ثم السمعاق ثم الموضحة ثم الهاشمة ثم المنقلة ثم الآقة
  قوله بلغ ملغ قال المجد ورجل بلغ
  ملغ بكسرهما خبيث اه
  قوله والمتلغ أى كعظم كافى
  القاموس اه
