label: { ar: "الموطأ 678 — القاسم بن محمد: كانت عائشة تليني أنا وأخاً لي يتيمين في حجرها فتخرج من أموالنا الزكاة", en: "Muwatta 678" }
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن أبيه، أنه قال: كانت عائشة تليني أنا وأخاً لي يتيمين في حجرها، فكانت تخرج من أموالنا الزكاة. ويذكر المحقق أن لفظة «أنا» ليست في نسخة م، وأنه رواه عن مالك أبو مصعب والشافعي ومن طريقه البيهقي، وأن أبا عبيد في الأموال (1307) وعبد الرزاق (6984) روياه من طريق يحيى بن سعيد وحميد وأيوب عن القاسم بنحوه. {cite:muwatta-maruf-1997 p.342}"
