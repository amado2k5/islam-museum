label: { ar: "الموطأ 678 — القاسم بن محمد: كانت عائشة تليني أنا وأخاً لي يتيمين في حجرها فتخرج من أموالنا الزكاة", en: "Muwatta 678", es: "Muwatta 678", fr: "Muwatta 678", ur: "موطا 678", tr: "El-Muvatta 678 — El-Kâsım ibn Muhammed: Aişe, yetim olan bana ve kardeşime bakardı ve paramızdan zekât verirdi.", id: "Al-Muwatta 678 — Al-Qasim ibn Muhammad: Aisyah biasa merawatku dan saudaraku, yang merupakan anak yatim, dan dia membayar zakat dari harta kami." }
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن أبيه، أنه قال: كانت عائشة تليني أنا وأخاً لي يتيمين في حجرها، فكانت تخرج من أموالنا الزكاة. ويذكر المحقق أن لفظة «أنا» ليست في نسخة م، وأنه رواه عن مالك أبو مصعب والشافعي ومن طريقه البيهقي، وأن أبا عبيد في الأموال (1307) وعبد الرزاق (6984) روياه من طريق يحيى بن سعيد وحميد وأيوب عن القاسم بنحوه. {cite:muwatta-maruf-1997 p.342}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, o da babasından rivayet ederek şöyle demiştir: \"Aişe, yetim olan bana ve kardeşime bakardı ve malımızdan zekât verirdi.\" Editör, \"ben\" kelimesinin M el yazmasında bulunmadığını ve bunun Malik'ten Ebu Musab ve Şafiî tarafından, onun isnadından da Beyhaki tarafından rivayet edildiğini belirtmektedir. Ebu Ubeyd, el-Amwal'da (1307) ve Abdül-Razzaq (6984) da benzer şekilde Yahya ibn Sa'id, Humayd ve Eyyub'dan, o da el-Kâsım'dan rivayet etmiştir. {cite:muwatta-maruf-1997 s.342}"
  id: "Malik meriwayatkan hadits ini dari Abd al-Rahman ibn al-Qasim, yang meriwayatkannya dari ayahnya, yang berkata: Aisyah merawatku dan saudaraku, keduanya yatim piatu, dan dia membayar zakat dari harta kami. Editor mencatat bahwa kata \"aku\" tidak ada dalam manuskrip M, dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan al-Shafi'i, dan dari sanadnya oleh al-Bayhaqi. Abu Ubayd dalam al-Amwal (1307) dan Abd al-Razzaq (6984) meriwayatkannya dari Yahya ibn Sa'id, Humayd, dan Ayyub, dari al-Qasim, dengan cara yang serupa. {cite:muwatta-maruf-1997 p.342}"
