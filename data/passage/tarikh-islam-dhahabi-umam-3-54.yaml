text: "… عدا واحدٌ منهم مصرعه ذلك. ثم بعثت قُرَيش فَحَزَرُوا المسلمين. وكان فيهم فارسان : المِقداد والزُّبير. وأراد عُتبة بن ربيعة، وحكيم بن حِزام قُرِيشاً على الرجوع فأبَوْا. وكان الذي صمّم على القتال أبو جهل. فارتحلوا من الغد قاصدين نحو الماء. …"
