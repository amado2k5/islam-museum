summary:
  ar: "القسم 38 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صفة الجنة عن رسول الله»، ويضم فيها النصوص من 2523 إلى 2735 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 38 of Jami' al-Tirmidhi (Chapters on the description of Paradise) in the division of the open hadith dataset the museum took its reports from: reports 2523 to 2735 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 38، عنوان «کتاب صفۃ الجنۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2523 تا 2735۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 38 de Jami' al-Tirmidhi (Capítulos sobre la descripción del Paraíso) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2523 al 2735 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
