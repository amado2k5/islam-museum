text: |-
  ٣٤٦
  ⁦(ياب الرام)⁩
  ما أشرف من أعلى صدره ومنه ال_درة التى تلبس والمصدور الدى يشتكى صدره وطريق
  صادرأى يصدرباً هله عن الماء والصدار بكسر الصادقيص صغير يلى الجسد وفى المشل
  كل ذات صدارخالة أى من حق الرجل أن يغار على كل امرأة كما يغار على حرمه والصدار
  سمة على صدر البعير والصدر بالتحريك الاسم من قولك صدرت عن الماءوعن البلادوفى
  المثل تركنه على مثل ليلة الصدريعنى حين صدر الناس من حجهم والصدر بالتسحكين
  المصدر قال الشاعر ا بن مقبل
  وايله قد جعات الصبح موعدها * صدر المطية حتى تعرف السدفا
  قال أبو عبيد قوله صدر المطية مصدر من قولك صدريصدر صدرا وأصدرته فصدرأى
  رجعته فرجع والموضع مصدر ومنه مصادر الافعال وصادره على كذا وصدر الفرس
  أى برز يصدره وسبق قال طفيل يصف الفرص
  كأنه يعد ماصدرن من عرق سيدقط رجعح الليسل مبلول
  ويروى صدّرن على مالم يسم فاعله أى ابتات صدور هن بالعرق والاول أجودوالعرق
  الصف من الخيل وصدّركتا به جعل له صدرا وصدّره فى المجلس قتصدر والمصدّر الشديد
  الصدر ويقال للاسد المصدر والتصدير الحزام وهوفى صدر البعير والحقب عند الثيل
  ⁦(صرر)⁩ الصرة الضععة والصيححة والصرة الجماعة والصرة الشدة من كرب وغيره وقول
  امرئ القيس . فألحقه بالهاديات ودونه * حواجرهافى صرة لم تزيل
  يحتمل هذه الوجره الثلاثة وصرة القيف شدة حرّه والصرار الاماصكن المرتفعة لا يعلوها
  الماء وصراراسم جبل وقال جرير
  ان الفررّدق لا يزابل اؤمه • حتى يزول عن الطريق صرار
  والصرة للدراهم وصررت الصرة شددتها ابن البكيت صر الفرس أذنيه ضمهما الى رأسه
  قال فاذالم يوقعوا قالوا أصر الفرس بالالف وحافر مصرور أى ضبق مقبوض وصررت الناقة
  شددت عليها الصراد وهو خيط يشتفوق الخلف والتودية لتلايرضعها ولدها والصر بالكمم
  برديضرب النبات والحرث ويقال رجل صرورة للذى لم يحيج وكذلك رجل صارورة
  وصرورى وحكى الفرّاء عن بعض العرب قال رأيت قوماصرارا بالفتح واحسدهم صوارة
  قال يعوب والصرورة فى شعر النابغة الذى لم يأت النساء كأنه أصر على تركهنّ وفى الحديث
  لاصرورة فى الاسلام وامر أصرورة لم تحج والصرارالملاح والجمع الصراريون قال العجاج
  جذب الصراريين بالكرور ويقال للملاح أيضا الصارى مثل القاضى نذكره فى المعتل
  والصارة الماجة يقال لى قبل فلان صارة وقولهم صارهعلى الشئ أى أكرهه والصارة
  العطش بقال قصع الحارصارته اذاشرب الماء فذهب عطشه قال أبو عمر ووجعه
  صرائر وأنشدلذى الرمة
  فانصاءت الحقب لم تقصع صرائرها * وقد نشحن فلارى ولاهيم
  وعيب ذلك على أبى عمرو وقيل انما الصرائر بجع صريرة وأما الصارة فجمعه اصوار
  وصرار الليل الحد حد وهو أكبر من الجندب وبعض العرب يسهيه الصدى وصر القلم
  والباب
