text: "… فعل النجاشي بأرض الحبشة حين بلغه مقتل قريش ببدر وقد كتبناه بإسناد آخر أعلى من قوله. أخبرنا أبو القاسم عبد الرحمن بن عبيد اللّه الحرفي ببغداد، قال : أخبرنا أحمد بن سليمان الفقيه قال : أخبرنا عبد اللّٰه بن أبي …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1291، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
