  tr: "Kandhlawi'nin Sahabelerin biyografilerinden, resimli 1. cilt, sayfa 438'deki bir alıntı, ölüm ve ölüm anından bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
