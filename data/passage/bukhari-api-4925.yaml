label: { ar: "صحيح البخاري 4925 — ما فُرض على الناس", en: "Sahih al-Bukhari 4925 — what was made obligatory on people", ur: "صحیح بخاری 4925 — جو لوگوں پر فرض کیا گیا", fr: "Sahih al-Bukhari 4925 — ce qui a été imposé aux gens", es: "Sahih al-Bujari 4925 — lo que se impuso a la gente", tr: "Sahih el-Buhari 4925 — İnsanlara dayatılan şeyler", id: "Sahih al-Bukhari 4925 — Apa yang dipaksakan kepada manusia" }
text: "… يُحَدِّثُ عَنْ فَتْرَةِ الْوَحْىِ فَقَالَ فِي حَدِيثِهِ \" فَبَيْنَا أَنَا أَمْشِي إِذْ سَمِعْتُ صَوْتًا مِنَ السَّمَاءِ فَرَفَعْتُ رَأْسِي فَإِذَا الْمَلَكُ الَّذِي جَاءَنِي بِحِرَاءٍ جَالِسٌ عَلَى كُرْسِيٍّ بَيْنَ السَّمَاءِ وَالأَرْضِ، فَجَئِثْتُ مِنْهُ رُعْبًا فَرَجَعْتُ فَقُلْتُ زَمِّلُونِي زَمِّلُونِي. فَدَثَّرُونِي فَأَنْزَلَ اللَّهُ تَعَالَى {يَا أَيُّهَا الْمُدَّثِّرُ} إِلَى {وَالرِّجْزَ فَاهْجُرْ} ـ قَبْلَ أَنْ تُفْرَضَ الصَّلاَةُ ـ وَهْىَ الأَوْثَانُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4925، يرد فيه ذكر ما فُرض على الناس. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 4925 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), whose wording mentions what was made obligatory on people. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 4925، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 4925, dont le texte mentionne ce qui a été imposé aux gens. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 4925, cuyo texto menciona lo que se impuso a la gente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 4925 numaralı hadis, insanların farz olan şeylerden bahsetmektedir. Bu hadis, diğer farz, tavsiye edilen, mekruh edilen, haram olan ve küçük günahlarla birlikte, araştırmacı tarafından derlenmiş olup Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetlerinden metinler içermektedir. Araştırmacı metnin içeriğini açıklamaktadır ancak buna dayanarak dini bir hüküm vermemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4925, menyebutkan apa yang wajib bagi manusia. Hadits ini, bersama dengan dosa-dosa wajib, anjuran, najis, dan dosa-dosa kecil lainnya, dikumpulkan oleh peneliti dan mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini. Peneliti menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
