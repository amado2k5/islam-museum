label: { ar: "الموطأ 2298 — مالك: مكاتب بين رجلين أنظره أحدهما واقتضى الآخر بعض حقه", en: "Muwatta 2298" }
summary:
  ar: "قال مالك في مكاتب بين رجلين، أنظره أحدهما بحقه وأبى الآخر ذلك فاقتضى بعض حقه، ثم مات المكاتب وترك مالا لا يفي بالكتابة: يتحاصان بقدر ما بقي لكل منهما. فإن فضل عن الكتابة شيء اقتسماه بالسواء. وإن عجز المكاتب وقد اقتضى أحدهما أكثر، فالعبد بينهما نصفين، ولا يرد من اقتضى على شريكه شيئا، لأنه إنما اقتضى حقه بإذن شريكه. {cite:muwatta-maruf-1997 p.347}"
