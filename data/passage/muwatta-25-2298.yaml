label: { ar: "الموطأ 2298 — مالك: مكاتب بين رجلين أنظره أحدهما واقتضى الآخر بعض حقه", en: "Muwatta 2298", es: "Muwatta 2298", fr: "Muwatta 2298", ur: "موطا 2298", tr: "Al-Muwatta 2298 — Malik: İki adam arasında yapılan bir azat etme sözleşmesi; bunlardan biri ona süre tanırken diğeri alacağının bir kısmını talep etti.", id: "Al-Muwatta 2298 — Malik: Sebuah perjanjian pembebasan antara dua orang, yang satu memberikan keringanan sementara yang lain menuntut sebagian dari haknya." }
summary:
  ar: "قال مالك في مكاتب بين رجلين، أنظره أحدهما بحقه وأبى الآخر ذلك فاقتضى بعض حقه، ثم مات المكاتب وترك مالا لا يفي بالكتابة: يتحاصان بقدر ما بقي لكل منهما. فإن فضل عن الكتابة شيء اقتسماه بالسواء. وإن عجز المكاتب وقد اقتضى أحدهما أكثر، فالعبد بينهما نصفين، ولا يرد من اقتضى على شريكه شيئا، لأنه إنما اقتضى حقه بإذن شريكه. {cite:muwatta-maruf-1997 p.347}"
  tr: "Malik, iki adam arasında yapılan bir köle azat sözleşmesi hakkında şöyle demiştir: Adamlardan biri köleye borcunu ödemesi için bir süre tanırken, diğeri bunu reddederek borcunun bir kısmını talep etmiştir. Köle öldükten sonra geride azat bedelini karşılamaya yetmeyen bir servet bıraktı: Her biri elinde kalan miktara göre geliri paylaşırlar. Azat tamamlandıktan sonra bir şey kalırsa, bunu eşit olarak bölüşürler. Eğer köle sözleşmeyi yerine getiremezse ve adamlardan biri zaten tam miktardan daha fazlasını talep etmişse, köle aralarında eşit olarak bölüşülür. Daha fazlasını talep eden, ortağına hiçbir şey iade etmek zorunda değildir, çünkü sadece ortağının izniyle borcunu talep etmiştir. {cite:muwatta-maruf-1997 s.347}"
  id: "Malik berkata mengenai seorang budak yang terikat perjanjian pembebasan antara dua orang, salah satunya memberi budak itu masa tenggang untuk membayar kewajibannya, sementara yang lain menolak dan menuntut sebagian dari kewajibannya. Kemudian budak itu meninggal, meninggalkan harta yang tidak cukup untuk menutupi pembebasan: mereka membagi hasilnya sesuai dengan apa yang masing-masing simpan. Jika ada yang tersisa setelah pembebasan selesai, mereka membaginya secara merata. Jika budak itu tidak dapat memenuhi perjanjian dan salah satu dari mereka telah menuntut lebih dari jumlah penuh, budak itu dibagi rata di antara mereka. Orang yang menuntut lebih tidak perlu mengembalikan apa pun kepada pasangannya, karena ia hanya menuntut kewajibannya dengan izin pasangannya. {cite:muwatta-maruf-1997 p.347}"
