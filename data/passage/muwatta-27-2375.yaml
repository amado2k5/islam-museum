label: { ar: "الموطأ 2375 — سعيد بن المسيب: الرجل الأسلمي الذي اعترف عند أبي بكر وعمر والنبي", en: "Muwatta 2375", es: "Muwatta 2375", fr: "Muwatta 2375", ur: "موطا 2375", tr: "Al-Muwatta 2375 — Sa'id ibn al-Musayyab: Ebu Bekir, Ömer ve Peygamber'in önünde itirafta bulunan Eslemî adam", id: "Al-Muwatta 2375 — Sa’id ibn al-Musayyab: Orang Aslami yang mengaku di hadapan Abu Bakar, Umar, dan Nabi" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن رجلا من أسلم جاء أبا بكر فأخبره أن رجلا زنى، فأمره بالتوبة والستر، فلم تقر نفسه حتى أتى عمر فقال له مثل ذلك، ثم أتى النبي فأعرض عنه ثلاث مرات، حتى إذا أكثر عليه بعث إلى أهله فسألهم: أيشتكي أم به جنة؟ فقالوا: إنه لصحيح. فقال: أبكر أم ثيب؟ فقالوا: ثيب، فأمر به فرجم. {cite:muwatta-maruf-1997 p.380} {cite:muwatta-maruf-1997 p.381}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet ettiğine göre, Aslam'dan bir adam Ebu Bekir'e gelip bir adamın zina ettiğini söyledi. Ebu Bekir ona tövbe etmesini ve günahını gizlemesini emretti, ancak adam Ömer'e gidip aynı şeyi söyleyene kadar tatmin olmadı. Sonra Peygamber'e gitti, ancak Peygamber üç kez ondan yüz çevirdi. Adam ısrar edince, Peygamber ailesini çağırdı ve onlara sordu: \"Hasta mı, yoksa cin mi var?\" Onlar: \"Sağlıklı\" dediler. Peygamber sordu: \"Bakire mi, yoksa daha önce evli mi?\" Onlar: \"Daha önce evli\" dediler. Bunun üzerine Peygamber onu taşlayarak öldürmeyi emretti. {cite:muwatta-maruf-1997 s.380} {cite:muwatta-maruf-1997 s.381}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa seorang pria dari Aslam datang kepada Abu Bakr dan memberitahunya bahwa seorang pria telah berzina. Abu Bakr memerintahkannya untuk bertaubat dan menyembunyikan dosanya, tetapi dia tidak puas sampai dia pergi kepada Umar dan menceritakan hal yang sama. Kemudian dia pergi kepada Nabi, yang tiga kali berpaling darinya. Ketika pria itu bersikeras, Nabi memanggil keluarganya dan bertanya kepada mereka: \"Apakah dia sakit, atau kerasukan?\" Mereka menjawab: \"Dia sehat.\" Beliau bertanya: \"Apakah dia masih perawan atau sudah pernah menikah?\" Mereka menjawab: \"Sudah pernah menikah.\" Maka beliau memerintahkan agar pria itu dirajam. {cite:muwatta-maruf-1997 p.380} {cite:muwatta-maruf-1997 p.381}"
