label: { ar: "الموطأ 2375 — سعيد بن المسيب: الرجل الأسلمي الذي اعترف عند أبي بكر وعمر والنبي", en: "Muwatta 2375" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن رجلا من أسلم جاء أبا بكر فأخبره أن رجلا زنى، فأمره بالتوبة والستر، فلم تقر نفسه حتى أتى عمر فقال له مثل ذلك، ثم أتى النبي فأعرض عنه ثلاث مرات، حتى إذا أكثر عليه بعث إلى أهله فسألهم: أيشتكي أم به جنة؟ فقالوا: إنه لصحيح. فقال: أبكر أم ثيب؟ فقالوا: ثيب، فأمر به فرجم. {cite:muwatta-maruf-1997 p.380} {cite:muwatta-maruf-1997 p.381}"
