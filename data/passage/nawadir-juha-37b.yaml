text: "نوادر جحا الكبرى السادس، فاجتمعَتْ عليها الزبائنُ وَأشتراها أحدُهم بزيادة عن السعر، الذي كان يأملُهُ جحا، فشكر شيخُنا صديقَه وحملَ دراهمه، وعاد إلى بيته مسروراً. ولم تمضٍ أيامٌ قليلة حتى جاءَهُ بعض الخاطبات يخطُبْنَ أبنتَهُ فطلبَتْ إليهِ أمرأتُهُ أنْ يتغيَّبَ …"
summary:
  ar: "طبّق جحا حيلة البقرة على ابنته، فقال للخاطبات إنها حامل في شهرها السادس، فانصرفن دون جواب. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  en: "Juha applies the cow trick to his daughter: he tells the matchmakers that she is pregnant in her sixth month, and they leave without an answer. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  ur: "جحا نے گائے والی چال اپنی بیٹی پر آزمائی اور رشتہ کرانے والی عورتوں سے کہا کہ وہ چھ ماہ کی حاملہ ہے، تو وہ کوئی جواب دیے بغیر چلی گئیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  fr: "Juha applique la ruse de la vache à sa fille : il dit aux entremetteuses qu'elle est enceinte de six mois, et elles s'en vont sans donner de réponse. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  es: "Juha aplica el truco de la vaca a su hija: les dice a las casamenteras que está embarazada de seis meses, y ellas se marchan sin dar respuesta. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  tr: "Juha, kızına inek numarası yaparak, çöpçatanlara kızının altı aylık hamile olduğunu söyledi; böylece çöpçatanlar cevap vermeden gittiler. {cite:juha-nawadir-kubra-djuwaydi s. 23}"
  id: "Juha menggunakan tipuan sapi pada putrinya, dengan mengatakan kepada para mak comblang bahwa putrinya hamil enam bulan, sehingga mereka pergi tanpa menjawab. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
