text: "… كنا عند رسول اللّٰه وَل يه فأتاه رجل جَيِّد الثياب، طيِّب الريح، حسن الوجه، فقال: يا رسول الله، ما الإسلام؟ قال رسول اللّٰه واليخ: تقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت وتغتسل من الجنابة، قال: صدقت، فما الإيمان؟ قال …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 6653، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 6653, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 6653 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 6653, que menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, así como la cuestión de la fe y su respuesta. Este extracto, extraído de la lectura automática y citado en un máximo de cuarenta palabras según la política de fuentes, se encuentra en la lista de Pillars and Branches of Faith Browser."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 6653, qui évoque l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage, cités ensemble, ainsi que la question de la foi et sa réponse. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 6653. sayfasından bir alıntı, İslam'ı namaz, zekât, oruç ve Hac gibi ibadetlerle tanımlamakta ve imanla ilgili soru-cevaplara değinmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 2, halaman 6653, mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta membahas pertanyaan dan jawaban mengenai iman. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
