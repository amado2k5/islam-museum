label: { ar: "سنن ابن ماجه 3117 — عدد الحسنات", en: "Sunan Ibn Majah 3117 — a stated number of good deeds", ur: "سنن ابن ماجہ 3117 — نیکیوں کی مقررہ تعداد", es: "Sunan Ibn Majah 3117 — un número determinado de buenas acciones", fr: "Sunan Ibn Majah 3117 — un nombre énoncé de bonnes actions", tr: "Sunan İbn Majah 3117 — İyi amellerin sayısı", id: "Sunan Ibn Majah 3117 — Jumlah amal kebaikan" }
text: "… عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ أَدْرَكَ رَمَضَانَ بِمَكَّةَ فَصَامَ وَقَامَ مِنْهُ مَا تَيَسَّرَ لَهُ كَتَبَ اللَّهُ لَهُ مِائَةَ أَلْفِ شَهْرِ رَمَضَانَ فِيمَا سِوَاهَا. وَكَتَبَ اللَّهُ لَهُ بِكُلِّ يَوْمٍ عِتْقَ رَقَبَةٍ وَكُلِّ لَيْلَةٍ عِتْقَ رَقَبَةٍ وَكُلِّ يَوْمٍ حُمْلاَنَ فَرَسٍ فِي سَبِيلِ اللَّهِ وَفِي كُلِّ يَوْمٍ حَسَنَةً وَفِي كُلِّ لَيْلَةٍ حَسَنَةً \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3117، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3117 (Chapters on Hajj Rituals), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3117، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3117 (Capítulos sobre los rituales del Hajj), menciona un número determinado de buenas acciones. El Libro de Hasanat y Sayyi'at lo incluye junto con los textos que registran, escriben, borran o ponderan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3117 (Chapitres sur les rites du Hajj), mentionne un nombre précis de bonnes actions. Le Livre des Hasanat et Sayyi'at le recense avec les textes qui permettent de compter, d'écrire, d'effacer ou de peser une action."
  tr: "İbn Majah'ın Süneni'nde yer alan 3117 numaralı hadis, iyi amellerin sayısını zikrediyor. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştiriyor."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3117, menyebutkan jumlah amal kebaikan. Hadits ini menggabungkan daftar amal baik dan buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
