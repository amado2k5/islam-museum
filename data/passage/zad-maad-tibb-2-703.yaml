text: "والثاني: أنَّه عملُ اليد في غير الصنائع الدنيئة كالحجامة ونحوِها. والثالث: أنه الزِّراعةُ، ولكل قولٍ مِن هذه وجه مِن الترجيح أثراً ونظراً، والراجح أن أحلَّها الكسبُ الذي جعل منه رِزق رسولِ اللّهِ وَلِعِ وهو كسبُ الغانمين وما أُبيح لهم على …"
