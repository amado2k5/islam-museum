text: |-
  كالا بنوس اسود طيب الرائحة
  كذا فى بعض نسخ الصحاح اه
  وانقولى
  فقرات الاول بفتح القاف وأوله
  مكسوروالشانى بكسيرتين اه
  وانقولى
  ٣٨٢
  ⁦(ياب الراء)⁩
  وفرفرت الشى حركته مثل هرهرته يقال فرفر الفرس اذاضرب بفاس لجامه أسنانه وحرّك
  رأسه وناس يروونه فى شعرامرئ القيس بالقاف والفرفرة الخفة والطيش والفرفورطائر
  فزر الفزر بالكسرالقطيع من الغنم وقال أبوزيد الفزرمن الضأن مابين
  العشرة الى الار بعين حكاه عنه أبو عبيد والفزر أيضا أبو قبيلة من تميم وهو سعدين زيدساة
  ابن تيم والفزراقبه واغماسمى بذلك لانه وا فى الموسم بعزى فأنهبها هناك وقال من أخذ
  منهاواحدة فهى له ولا يؤخذمنها فزروه والاثنان وأكثر وقال أبو عبيدة هو الجدى نفسه
  فضربوابه المثسل فقالوالا آتيك معزى الفزرأى حتى تجتمع تلك وهى لا تجتمع أبدا والفزر
  بالفتح الفسخ فى الثوب يقال د تفزر النوب اذا تقطع وبلى وفزرت الشئ صدّعته
  وطريق فازرأى واسع قال الراجز تدق معزاء الطريق الفازر * دق الدياس عرم الانادر
  ورجل أفزر بين الفزر وهو الاحدب الذى فى ظهره عجرة عظيمة وهو المنزور أيضاوفزارة
  أبوحى من غطفان وهوفزارة بن ذبيان بن بغيض بن ريث بن غطنان (فسر الفسم
  البيان وقد فسرت الذئ أفسره بالكسر فسرا والتفسير مثل واستفسرته كذا أى سألته أن
  يفسره لى والفسر نظر الطبيب الى الماء وكذلك التفسرة وأظفهمولدا طر)، أفطر الصائم
  والاسم الفطر وفطرته أنا تفطيراورجل مقطر وقوم مفاطيرمثل موسرومياسيرورجل فطر
  وقوم فطرأى مقطرون وهو مصدرفى الاصل والفطورما يفطر عليه وكذلك الفطورى
  كأنه منسوب اليسه وفطرت المرأة العجين حتى استبان فيه الفطر والفطر أيضاضرب من
  المكماة أبيض عظام الواح_دة قطرة والفطرة بالكسر الخلقة وقد فطره يفطره بالضم فطرا أى
  خلقه والفعار أيضا الشق يقال فطرته فانفطر ومنه فطرناب البعير طلع فهو بعبر قاطر وتفطر
  الشئء تشقق وسيف فطارأى فيه تشقق قال عنترة
  وسيفى كالعقيقة فهوكعى • سلاحى لا أفل ولافطارا
  والفطر الابتداء والاختراع قال ابن عباس رضى اللّٰه عنه كنت لا أدرى ما فاطر السعوات
  حتى أنانى اعراسان يختصمان فى بترفقال أحدهما أنا فطرتها أى انا ابتدأتها والفطار حلب
  الناقة بالسباية والابهام والفطير خلاف الجير وهوالعجين الذى لم يختمر وكل شئ أعجلنه عن
  ادرا كهفهو فطرية ال اباك والرأى الفطير وفطرت العجين أفطره فطرا اذا أعجلته عن ادراكه
  تقول عندى خبز خبر وحيس فطير أى طرى ⁦( ففر)⁩ ففرفاه أى فتحه وفغرفوه أى انفتح
  يتعدى ولا يتعدى وأفغر النجم وذلك فى الشماءلان الثريا اذا كبد السماء من نظر الي
  فغرفاه والغاغرة ضرب من الطيب وهوأصل النيلوفر الهندى وانفغر النور تفتح
  والمفغرة الارض الواسعة ⁦(فقر)⁩ الفقارة بالفتح واحدة فقار الفاهروذ والفقار أيضا
  اسم سيف الذيّ صلى اللّٰه عليه وسلم والفقرة بالكسر مثل الفقارة والجمع فقرات
  وفقرات وفقر وآجود بدت فى القصيدة يسمى فرتشيها بفقرة الظهر ورجل فقريتمكي
  فقاره والفاقرة الداهمة يقال فقرته الفاقرة أى كسرت فقار ظهره وفقرت أنف البع
  اذا حززته بح_ديدة ثم جعلت على موضع الحز الجرير وعليه وترملوى لتذلله بذلك وتروضه
