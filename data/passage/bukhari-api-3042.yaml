text: "حَدَّثَنَا عُبَيْدُ اللَّهِ، عَنْ إِسْرَائِيلَ، عَنْ أَبِي إِسْحَاقَ، قَالَ سَأَلَ رَجُلٌ الْبَرَاءَ ـ فَقَالَ يَا أَبَا عُمَارَةَ، أَوَلَّيْتُمْ يَوْمَ حُنَيْنٍ قَالَ الْبَرَاءُ وَأَنَا أَسْمَعُ أَمَّا رَسُولُ اللَّهِ لَمْ يُوَلِّ يَوْمَئِذٍ، كَانَ أَبُو سُفْيَانَ بْنُ الْحَارِثِ آخِذًا بِعِنَانِ بَغْلَتِهِ، فَلَمَّا غَشِيَهُ الْمُشْرِكُونَ نَزَلَ، فَجَعَلَ يَقُولُ أَنَا النَّبِيُّ لاَ كَذِبْ، أَنَا ابْنُ عَبْدِ الْمُطَّلِبْ قَالَ فَمَا رُئِيَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3042، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3042 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3042، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 3042 (La lucha por la causa de Alá (Yihad)), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre naciones, religiones, sectas y pueblos no musulmanes."
