label: { ar: "الموطأ 1635 — نافع عن مولاة لصفية بنت أبي عبيد: اختلعت من زوجها بكل شيء لها، فلم ينكر ذلك ابن عمر", en: "Muwatta 1635", es: "Muwatta 1635", fr: "Muwatta 1635", ur: "موطا 1635", tr: "El-Muvatta 1635 — Safiyya bint Abi Ubayd'ın azatlı bir kölesinden Nafi'nin rivayetine göre: Safiyya, kocasından tüm mal varlığıyla boşandı ve İbn Umar buna itiraz etmedi.", id: "Al-Muwatta 1635 — Diriwayatkan oleh Nafi’ dari seorang budak yang telah dimerdekakan milik Safiyya binti Abi Ubayd: Ia menceraikan suaminya dengan seluruh harta miliknya, dan Ibnu Umar tidak keberatan dengan hal itu." }
summary:
  ar: "يروي مالك عن نافع عن مولاة لصفية بنت أبي عبيد أنها اختلعت من زوجها بكل شيء لها، فلم ينكر ذلك عبد الله بن عمر. {cite:muwatta-maruf-1997 p.75}"
  tr: "Malik, Safiyya bint Abi Ubayd'ın azatlı bir kölesinden rivayetle Nafi'nin naklettiğine göre, Safiyya kocasından boşanmış ve tüm mallarından vazgeçmiş, Abdullah ibn Umar da buna itiraz etmemiştir. {cite:muwatta-maruf-1997 s.75}"
  id: "Malik meriwayatkan dari Nafi’ berdasarkan riwayat seorang budak yang telah dibebaskan oleh Safiyya binti Abi Ubayd bahwa ia menceraikan suaminya dan melepaskan semua harta miliknya, dan Abdullah ibn Umar tidak keberatan dengan hal ini. {cite:muwatta-maruf-1997 p.75}"
