  tr: "\"Al-Isabah fi Tamyiz al-Sahaba\" (Sahabeleri Ayırt Etme) adlı resimli cilt 2'nin 1521. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
