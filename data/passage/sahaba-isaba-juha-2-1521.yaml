text: "… فقال له أبو ذر: يا محمد أتيناك السلمي أن صاحب القصة النعيمان. لنسمع ما تقول قال: أَقوْلُ لاَ إلَهَ إِلَّ اللّٰه مُحَمَّدٌ رَسُولُ وكذا ذكره الزبير بن بكار في كتاب الفكاهة والمزاح الله فامن به أبو ذر وصاحبه. من طريق …"
summary:
  ar: "مقطع من الإصابة في تمييز الصحابة، المجلد المصوَّر 2، ص 1521، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Isaba fi Tamyiz al-Sahaba, scan volume 2, p. 1521, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "الاصابہ فی تمیز الصحابہ، اسکین جلد 2، ص 1521 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
