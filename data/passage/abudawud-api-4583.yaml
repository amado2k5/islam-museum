label: { ar: "سنن أبي داود 4583 — الأب والأبوة", en: "Sunan Abi Dawud 4583 — the father and fatherhood", ur: "سنن ابی داؤد 4583 — باپ اور والدیت", es: "Sunan Abi Dawud 4583 — El padre y la paternidad", fr: "Sunan Abi Dawud 4583 — Le père et la paternité" }
text: "حَدَّثَنَا يَزِيدُ بْنُ خَالِدِ بْنِ مَوْهَبٍ الرَّمْلِيُّ، حَدَّثَنَا عِيسَى بْنُ يُونُسَ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنِ النَّبِيِّ قَالَ \" دِيَةُ الْمُعَاهِدِ نِصْفُ دِيَةِ الْحُرِّ \". قَالَ أَبُو دَاوُدَ رَوَاهُ أُسَامَةُ بْنُ زَيْدٍ اللَّيْثِيُّ وَعَبْدُ الرَّحْمَنِ بْنُ الْحَارِثِ عَنْ عَمْرِو بْنِ شُعَيْبٍ مِثْلَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4583، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4583 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4583، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4583 (Tipos de sangre y sabiduría (Kitab Al-Diyat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4583 (Types de sang – Kitab Al-Diyat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
