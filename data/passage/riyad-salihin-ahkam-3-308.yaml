text: "… نيه، وإنْ لَمْ يُمكِنْ تحصيله إلاَّ بالكذبِ جازّ الكلِبُ. ثُمَّ إن كانَ تَحْصِيلُ ذَلكَ المقْصُودِ مُبَاحاً كَانَ الكَذِبُ مُبَاحا، وإنْ كانَ واجباً، كان الكَذِبُ واجِباً، فإذا اختَفّى مُسْلمٌ مِن ظالمٍ يريد قَتلَه، أوْ أخْذَ مالِه، وأخَفى مالَه، وسُثِل إنسانٌ عنه،"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 308، يرد فيه ذكر الواجب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
