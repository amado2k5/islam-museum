text: "… الدّيْنَوَري، وَأبي الحسَن علي بن كموسي الصِقِلِّي، وَأبي الحسَن يحَى بن علي بن الفرج الخشّاب المصري، وَأبي عَبد اللّه محمّد بن عَبد اللّه بن سَعيْد المالكي المحَاربي، المقرئين، وَصنّف كتابَ المقنع في القراءات السّبع، وَقراءة أبي عَمرو بن العَلاء، والتنبيه …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 343، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
