text: "سنة قال هاتها قال اذا شئت، فخلْها فلم يأخذ منه شيئا وخلّى سبيلهم الا تسعة فتْيا منهم احداث بعث بهم الى يزيد بن عبد الملك فقدم بهم عليه فصرب رقابهم فقال ثابت قُطْنة حين بلغد قتل يزيد بن المهلب يرثيه، …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك، المجلد المصوَّر 3، ص 142، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Tarikh al-Rusul wa'l-Muluk (The History of Prophets and Kings), scan volume 3, p. 142, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "تاریخ الرسول و الملوک ⁦(تاریخ انبیاء و بادشاہ)⁩، اسکین جلد 3، ص 142 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Rusul wa'l-Muluk (L'Histoire des Prophètes et des Rois), volume numérisé 3, p. 142, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Tarikh al-Rusul wa'l-Muluk (Historia de los profetas y los reyes), volumen escaneado 3, p. 142, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "*Peygamberler ve Krallar Tarihi*, Resimli Cilt 3, sayfa 142'den, ölen kişi için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir resimli baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgülerin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari *Sejarah Para Nabi dan Raja*, Jilid Bergambar 3, halaman 142, berisi elegi dan eulogi untuk orang yang telah meninggal; diambil dari edisi bergambar yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
