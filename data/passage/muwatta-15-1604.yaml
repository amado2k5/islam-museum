label: { ar: "الموطأ 1604 — مالك: الرجل يولي من امرأته فيوقف فيطلق عند انقضاء الأربعة الأشهر ثم يراجع، فإن لم يصبها حتى تنقضي عدتها فلا سبيل له إليها إلا لعذر", en: "Muwatta 1604", es: "Muwatta 1604", fr: "Muwatta 1604", ur: "موطا 1604", tr: "El-Muvatta 1604 — Malik: Bir adam karısından cinsel perhiz yemini eder, bu nedenle kendisine dört aylık bir bekleme süresi verilir ve ardından karısını boşayabilir. Eğer bekleme süresi dolana kadar onunla cinsel ilişkiye girmezse, geçerli bir sebep olmadıkça onunla cinsel ilişkiye girmesinin bir yolu yoktur.", id: "Al-Muwatta 1604 — Malik: Seorang pria bersumpah untuk tidak berhubungan badan dengan istrinya, sehingga ia diberi masa iddah empat bulan dan kemudian menceraikannya. Jika ia tidak berhubungan badan dengan istrinya sampai masa iddah istrinya berakhir, maka ia tidak berhak untuk berhubungan badan dengannya kecuali karena alasan yang sah." }
summary:
  ar: "يقول مالك في الرجل يولي من امرأته، فيوقف، فيطلق عند انقضاء الأربعة الأشهر، ثم يراجعها، إنه إن لم يصبها حتى تنقضي عدتها، فلا سبيل له إليها، ولا رجعة له عليها، إلا أن يكون له عذر من مرض أو سجن أو ما أشبه ذلك من العذر، فإن ارتجاعه إياها ثابت عليها، فإن مضت عدتها ثم تزوجها بعد ذلك، فإنه إن لم يصبها حتى تنقضي الأربعة الأشهر وقف أيضا، فإن لم يفئ دخل عليه الطلاق بالإيلاء الأول. {cite:muwatta-maruf-1997 p.66}"
  tr: "Malik, karısından cinsel perhiz yemini eden ve dört aylık bir bekleme süresi verilen, daha sonra karısından boşanan ve sonra onu geri alan bir adam hakkında şöyle der: Eğer bekleme süresi dolana kadar onunla cinsel ilişkiye girmezse, hastalık, hapis veya benzeri geçerli bir mazereti olmadıkça, onu geri alamaz ve onunla bir ilişkisi de olmaz. Bu durumda, onu geri alması geçerlidir. Eğer bekleme süresi dolduktan sonra tekrar evlenir ve dört ay geçene kadar onunla cinsel ilişkiye girmezse, kendisine dört aylık bir bekleme süresi daha verilir. Eğer evlilik ilişkisine devam etmezse, ilk cinsel perhiz yeminine dayalı boşanma kararı ona uygulanır. {cite:muwatta-maruf-1997 s.66}"
  id: "Malik mengatakan mengenai seorang pria yang bersumpah untuk tidak berhubungan badan dengan istrinya, dan diberi masa tunggu empat bulan, kemudian menceraikannya setelah itu, dan kemudian menikahinya kembali: jika dia tidak berhubungan badan dengan istrinya sampai masa tunggu istrinya berakhir, dia tidak memiliki jalan untuk menikahinya kembali, kecuali jika dia memiliki alasan yang sah seperti sakit, dipenjara, atau hal serupa. Dalam hal itu, menikahinya kembali adalah sah. Jika masa tunggu istrinya telah berakhir dan dia menikahinya lagi, dan dia tidak berhubungan badan dengannya sampai empat bulan berakhir, dia diberi masa tunggu empat bulan lagi. Jika dia tidak melanjutkan hubungan perkawinan, maka perceraian berdasarkan sumpah tidak berhubungan badan pertama berlaku untuknya. {cite:muwatta-maruf-1997 p.66}"
