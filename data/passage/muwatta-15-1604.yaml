label: { ar: "الموطأ 1604 — مالك: الرجل يولي من امرأته فيوقف فيطلق عند انقضاء الأربعة الأشهر ثم يراجع، فإن لم يصبها حتى تنقضي عدتها فلا سبيل له إليها إلا لعذر", en: "Muwatta 1604" }
summary:
  ar: "يقول مالك في الرجل يولي من امرأته، فيوقف، فيطلق عند انقضاء الأربعة الأشهر، ثم يراجعها، إنه إن لم يصبها حتى تنقضي عدتها، فلا سبيل له إليها، ولا رجعة له عليها، إلا أن يكون له عذر من مرض أو سجن أو ما أشبه ذلك من العذر، فإن ارتجاعه إياها ثابت عليها، فإن مضت عدتها ثم تزوجها بعد ذلك، فإنه إن لم يصبها حتى تنقضي الأربعة الأشهر وقف أيضا، فإن لم يفئ دخل عليه الطلاق بالإيلاء الأول. {cite:muwatta-maruf-1997 p.66}"
