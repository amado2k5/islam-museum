text: "… وَحَدَّثَنَا ابْنُ كَثِيرٍ، أَخْبَرَنَا شُعْبَةُ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ عَطَاءٍ الْكَيْخَارَانِيِّ، عَنْ أُمِّ الدَّرْدَاءِ، عَنْ أَبِي الدَّرْدَاءِ، عَنِ النَّبِيِّ قَالَ \" مَا مِنْ شَىْءٍ أَثْقَلُ فِي الْمِيزَانِ مِنْ حُسْنِ الْخُلُقِ \". قَالَ أَبُو الْوَلِيدِ قَالَ سَمِعْتُ عَطَاءً الْكَيْخَارَانِيَّ. قَالَ أَبُو دَاوُدَ وَهُوَ عَطَاءُ بْنُ يَعْقُوبَ وَهُوَ خَالُ إِبْرَاهِيمَ بْنِ نَافِعٍ يُقَالُ كَيْخَارَانِيٌّ وَكَوْخَارَانِيٌّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4799، يذكر الميزان. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 4799 (General Behavior (Kitab Al-Adab)), that speaks of the Scale. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 4799، جس میں میزان کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
