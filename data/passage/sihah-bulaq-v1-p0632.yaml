text: |-
  • ⁦(فصل الخام)⁩.
  لكثير اللحم النقيل والتخاجؤفى المشى التياطؤ وانتدابو عرو
  دعوا التخاجووا مشوامشية سهجعا • انّ الرجال ذو وعصب وتذكير
  (خذا الكسائى خذئت له وخسذات له خذوءافيمما أى خضعت وكذلك استخذأت له
  وأَخذأ. فلان أى ذلاه ⁦( خرأ)⁩ الخر بالضم العذرة والجمع خروء مشل جندوجنود
  وقال يهجو كان خروء الطير فوق رؤسهم • اذا اجتمعت قيس معاوتيم أى من ذلهم
  وقد خرى خراءة مثل كوه كراهسة قال الاعشى يعجل كف الخارى المطيب• ويقال للمخر
  مخروة ومخرأة ( أ خسأت الكاب خأطردته وخأ الكاب بنفسه يتعدى
  ولا يتعدى وانخأأيضا وقال كالكاب ان قات له اخ أفانخا أبوزيد خسأبصره خأ
  وخسوءا أى سدر ومنه قوله تعالى ينقلب اليك البصر خاسنًا وهو حسير وتخاسأ القوم
  بالحجارة زاموابها وكانت بينهم مخاسأة ⁦(خطاأ )⁩ اناطأ نقيض الصواب وقد يمد وقرى بهسما
  قوله تعالى ومن قمسل مؤمناخطأ تقول منه أخطأت وتخطأن بعى واحد ولا تقل أخطيت
  وبعضه-م يقوله وانظطء الذنب فى قوله تعالى انّ قتلهم كان خطأ كبيرا أى الماتقول منه
  خطى يخط أخطأ وخطأة على فعلة والاسم اخطيقة على فعيلة ولك أن تشدد الياءلان كل
  يأساكنة قبلها كسرة أوواوساكنة قباها ضمة وهما زائدتان للمدّلا للالحاق ولاهما
  من نفس الحكلمة فانك تقلب الهمزة بعد الواوواوا وبعد اليمامياء وتدغم فتقول فى
  مقروهمروّوفى خىء خبى بتشديد الواووالياء وقواهم ما أخطأء اغماهو تعجب من خطى
  لا من أخطأ أبو عبيدة خطئ وأخطألغتان بعدى واحد وأنشديالهف هنداذ خطئن
  كاهلا أى أخط أن قال وف المثل مع الخواطئ سهم صائب يضرب للذى يكثر انفطأ
  ويأتى الاحيان بالصواب وقال الاموى المخطى من أراد الصواب فصار الى غيره والخاطى
  من تعمد لمالا ينبفى وتقول خطأته تخطئة وتخطيما اذاقلت له أخطأت يقال ان أخطأت
  فحطتنى وتخطأت له فى المسئلة أى أخطأت وتخاطأه أى أخطأ مقال أوفى بن مطسر
  المازنى
  ألا أبلفا خلتى جابرا * بان خليلك لم يقتل
  تخط أت النبل أحشاءه • وأخريومى فلم يعجل
  وجمع اخطيئة خط ايا وكان الاصل خطائى على فعائل فلما اجتمعت الهمزتان قلبت الشانية يا
  لان قبلها كسرة ثم استثقلت واجمع تقيل وهو معتل مع ذلك فقلبت الياء الفاثم قلبت الهمزة
  الاولى يا منخفا ئها بين الالفين ( لا خلات الناقة خلا وخلاء بالكسر والمدأى حرنت
  وبركت من غير علة كما يقال فى الهل ألحّ وفى الفرس حرن ١ و فى حديت سراقة ٢
  ما خلات ولا حرنت ولكن حبسها حابس الفيل قال زهير
  يازرة الفقارة لم يختها * قطاف فى الركاب ولاخلاء
  ولا يقال للجمل خلأ
  صل الدال أدا) الديداء أشدعد والبعير وقددأدأدأدأة وديداء قال الشاعر
  واعرورت العاط العرض ز كضه • أمّ الفوارس بالديداء والربعه
  صحاح
  1 وفى المهارمسا قاله نصر
  فى حواشيه نسبة الحديث الى
  ممراقة مهو واغا هوحدينه
  صلى اللّٰه عليه وسلم قاله عام
  الجديدية رواه المسورين مجرمة
  ورواء ابن الحسكم اه محشى
  القاموس
