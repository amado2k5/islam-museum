text: "… كلما أفاق من غمرة فتح طرفه ثم قال : رب ما أختقنى خنقك، فوعزتك إنك تعلم أن قلى يحبك ولما حضرت سلمان الوفاة بكى، فقيل له ما يبكيك؟ قال ماأبكى جزعا على الدنيا، ولكن عهد إلينا رسول اللّٰه أن تكون …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 2، ص 580، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 580, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 2، ص 580 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
