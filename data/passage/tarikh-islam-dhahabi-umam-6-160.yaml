text: "وكان لكِسْرى وقَيْصر ومَن قبلهما من الملوك في دولتهم دهرٌ طويل، فأمّا الأكاسرة والفُرس وهم المَجُوس فملكوا العراقَ والعَجَمَ نحواً من خمسمائة سنة، فأوّل ملوكهم دارا، وطال عُمرُهُ فيقال إنّه بقي في المُلْك مائتي سنة، وعدّة ملوكهم خمسة وعشرون نفساً، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 160، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 160, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
