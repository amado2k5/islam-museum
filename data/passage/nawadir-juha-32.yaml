text: "… لا دجاج بلا ديك دعاه يوماً بعض شبان مدينة آقَ شَهْرٌ إلى الحمّام، واتَّفقوا على أن يأخذَ كل واحد منهم معه بيضة، حتى إذا خلعوا ثيابهم، ودخلوا عُراةً، وجحا معهم، قالوا لبعضهم: تعالَوْا نبيض كل واحد منّا بيضة ومن لا …"
summary:
  ar: "دبّر شبان في الحمام أن يجعلوا جحا يدفع الحساب بأن يقرقروا كالدجاج ليبيض، فصاح جحا كالديك وسأل هل رأى أحد دجاجًا بلا ديك. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  en: "Young men at the bathhouse plan to make Juha pay by clucking like hens to make him lay eggs; Juha crows like a cock and asks whether anyone has seen hens without a cock. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  ur: "حمام میں چند نوجوانوں نے منصوبہ بنایا کہ مرغیوں کی طرح کڑکڑا کر جحا سے انڈے دلوائیں اور یوں اس سے حساب بھروائیں؛ جحا نے مرغے کی طرح بانگ دی اور پوچھا کہ کیا کسی نے مرغے کے بغیر مرغیاں دیکھی ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  fr: "Des jeunes gens au bain public projettent de faire payer Juha en gloussant comme des poules pour qu'il ponde ; Juha chante comme un coq et demande si quelqu'un a déjà vu des poules sans coq. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  es: "Unos jóvenes en el baño público planean hacer pagar a Juha cacareando como gallinas para que ponga huevos; Juha canta como un gallo y pregunta si alguien ha visto gallinas sin gallo. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
