label: { ar: "سنن أبي داود 1318 — الأب والأبوة", en: "Sunan Abi Dawud 1318 — the father and fatherhood", ur: "سنن ابی داؤد 1318 — باپ اور والدیت", es: "Sunan Abi Dawud 1318 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو تَوْبَةَ، عَنْ إِبْرَاهِيمَ بْنِ سَعْدٍ، عَنْ أَبِيهِ، عَنْ أَبِي سَلَمَةَ، عَنْ عَائِشَةَ، قَالَتْ : مَا أَلْفَاهُ السَّحَرُ عِنْدِي إِلاَّ نَائِمًا، تَعْنِي النَّبِيَّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1318، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1318 (Prayer (Kitab Al-Salat): Voluntary Prayers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1318، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1318 (Oración (Kitab Al-Salat): Oraciones voluntarias), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
