text: |-
  3.٦١
  مصدها وماوجد نالهذا العام مصدة أى بردا قال ابن السكيت وقد تبدل الصادزايا فيقال
  حزدة عد عدف الارض ذهب ومعدت الشى وامتعدته اجتذبته بسرعة قال الراجز
  هل يروين ذودل"نزع معد • وساقيان سبط وجعد
  وبعير معد أى سريع قال الزفيان
  لمارأيت الظعن شالت تحدى • أبعتهن أرحبيا.عدا
  والمعد الفضر من البقسل والنمر يقال بسر تعد معد أى رخص وبعضهم يقول هو إتباع
  لا يفرد والمعدة للاتسان بمنزلة الكرش الكل مجتريقال معدة ومعدة عن ابن السكيت
  ⁦( مغد)⁩ المغدة فى غرّة الفرس كانها وارمة لان الشعر ينتف ليقبت أبيض وقال الشاعر
  تبارى قرحة مثل الوتيرة لم تكن مغد والمغد أيضا الناعم قال الراجز
  وكان قدشب تشبابامغدا قال أبو زيد. خد الرجل عيش ناعم يمخده مغدا أى غذاه عيش
  ناعم وابن الاعرابى منله وقال الفتراء مغد فى عيش ناعم يمغد مغدا ويقال أمغد الرجل اذا.
  أكثر من الشرب والامغادارضاع الفصيل وغيره تقول المرأة أمغدت هذا الصبى تففدنى
  أى رضعنى ومغدت السخلة أمها تمقدها مغدا أى رضعتها ويقال وجدت صرية فغدت
  جوفها أى مصصته لانه قد يكون فى حوف الصربة وهى صمغ الطلح شئ كأنه الغراء والدبس
  وتسمى الصرية مغداوكذلك صمع سدر البادية قال جزء بن الحارث انخنيسى
  وأنتم كغد السدر ينظر نحوه * ولا يجتف الابفاس ومحجن
  وخال آخر
  نحن بنوسواءة بن عامى • أهل اللنا والمقدوالمغافر
  ⁦( مقد)⁩ المقدىّ مخففة الدال شراب منسوب الى قرية بالشام يتخذمن العسل وقال
  الشاعر علمل القوم قليلا يا ابن بنت الفارسيه * انهم قد عاقروا اليوم شرابامقديه
  ⁦( مكد)⁩ مكد بالمكان مكودا أقام يه وناقة مكودومكداء اذا ئيت تغزرها ولم ينقص
  مثل نكداءور كية ماكدة اذائبت ماؤها على قرن واحد لا يتغير والقرن قرن القامة
  ( اد غصن أملود أى ناعم ورجل أماود واحرأة أملودة عن يعقوب وشاب أملد وجارية
  ملداء بينا الملد وغليد الاديم غرينه والامليد من الصمارى مثل الامليس ⁦(مهد)⁩ المهد
  مه د الصي والمهاد الفراش وقد مهدت الفراش مهد ابسعتمووطأنه وتهيد الامورتسويتها
  واصلاحها وتهيد العذر بسطه وة بوله وامتهاد السنام انبساطه وارتفاعه قال الراجز
  وامتهد الغارب فعل الدقل والتمهد التمكن ومهدد من أمهاء النساء وهو فعلل قال سيبويه
  الميم من نفس الكامة ولوكانت زائدة لادغم الحرف مثل مفر وحردّ فئيت أن الدال
  ملحقة والملق لايدغسم ⁦(مبد )⁩. ماد الشيمبدميد اتحزك ومادت الاغصان تمايلت وماد
  الرجل تيحتروميادة اسم امرأة والميدان واحد الميادين وقول ابن أحر
  وصادفت تعيما وميدانا من العيش أتضرا يعنى بدنا عما ومادهم عيدهم لغة فى مارهم
  من الميرة والممتاد مفتعل منه وأنشد الاخفش لرؤية
  تهدى رؤس المترفين الانداد * الى أمير المؤمنين الممتاد.
  ١ واءة بن عامى بن صعصحة
  بطن من هوازن على مانقلة
  مر عن القلقسندى فى نهماية
  الارب ووقع فى نسخ بنوسؤالة
  وأظلمتحر يقافة_دراجعت
  باب اللام من الكتابين فلم أجد
  فيه بى سوالة قاله نصر
