text: |-
  ⁦(فصل الحا)⁩
  ⁦(حرج)⁩
  h٤٥
  يقال -اواعلى القوم حله ثم ججوا وحجمج الرحل اذا أراد أنية ول ما فى نفسه ثم أمسك
  هو مثل المجمعة ⁦( دج)⁩ الحدج الحنظل اذا اشتدوصاب الواحدة حدجة وقد أحدجت
  شجرة الختظل والحدج بالكسر الحمل ومر كب من مراكب النساء أيضا وهومشل المحفة
  والجمع حذوج وأجداج وحدجت البعيرأحدجه بالكسير حديا أى شددت عليه الجدج
  وكذلك شدالاجال وتوسيقها قال الاعشى
  ألا قل لمشاء مابالها • أللين تحدج أخمالها
  ويروى أجمالها بالجيم والحداحة لغة فى الحدح والمع حدائج عن يعة وب وحدحه أيضنا
  ببصر يحدحه حد جارماه قال العجاج بصف الجماروالأتان اذا انبجزا من سواد حدبا
  والتحديج مثل التحديق وحد جه بمهم وحدجه بذنب غيره رماه به وحندج اسيم وجل
  ⁦( درح)⁩ المحدرج الاملس يقال حدر جه أى فتله وأحكمه قال الفرزدق
  أخاف زيادا أن يكون عطاؤه • أداهم سودا أو محدرجة "مرا
  يعو بالاداهم القيود وبالمحدرجة السياط ورجل حدرجان بالكسرأى قصير . مج).
  كان حرج وحوج أى ضق كثير الشجر لا تصل الله الراعية وقرئ يجعل صدره ضقاحرجا
  وحرجاوه و بعنزلة الوحد والوحدوالفرد والفرد والدنف والدنف فى معى واحد وقد جرج
  صدره يحرج حرجا والحرج الائم والحرج أيضا الناقة الضاهرة ويقال الطويلة على وجسه
  الارض عن آبى زيد والحرج خشب يندبعضه الى بعض يحمل فيه الموتى عن الاصمعى
  قال وهوقول امرئ القيس
  فاما ترين فى رحالة سامح * على حرج كالرتحفق أكفانى
  وربما وضع فوق نعسْ النساء قال عنترة يصف ظليما وقلصه
  يتبعن قله رأسه وكأنه * حرج على نعش لهنّ مخيم
  والحرحة الهاعة من الابل والحرجة مجتمع شجر والجمع حج وحرجات قال الشاءر
  أياحرجات الحى حين تحملوا • بذى سلم لاجادكنّ ربيع
  ويجمع أيضا على حراج قال رؤية عاين حيا كالحراج نعمه * يكون أقصى شده محرنجمه
  وأرجه أى آئمه والتحريج التضيق وتحرج أى تأثم وأحرجه اليه أى أمأه والجرج
  بالمكسر الودعة والجمع أحراج ومنه كاب محترّج أى مقلد والحرج يضالغة فى الحرج وهو
  الاثم حكاه يونس والحرج نصيب الكلب من الصيد وقال
  حتى أكابره على الإحراج
  وحرجت العيز بالمكسر أى حارت قال ذوالرمة.
  تزداد للعين ابهاجا اذاسفرت * وتحرج العين فيها حين تنتقب
  وحوج علىّ ظلمك حجا أى حرم والحرج والحريج والحرجوج الناقة الطويلة على وجه
  الارض وأصل الحرجوج حج وأصل الحريج حرج بالضم والجمع الحراجيج قال أبوزيد
  لحرجوج الضاهر ( شرج . لحنيرجة الغرغرة عند الموت وتردد النفس وحشيرجة
  الحمارصوته يردّده فى حلقه وقال
  واذاله علز وحشرجة • مما يجيش به من الصدر
  ٢٧
