text: "… العلاج بجب الاعتناءُ به، وقد صرح به أفاضلُ أهل الطب حتى قال طبيب العرب بل أطبُّهم الحارث بن كَلَدَة، وكان فيهم كأبقراط في قومه : الحِمية رأس الدواء، والمعدة بيت الداء، وعَوِّدُوا كُلَّ بَدَنٍ ما اعْتَادَ، وفي مني به الجوع، …"
