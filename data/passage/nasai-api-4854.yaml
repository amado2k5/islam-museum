text: "جَدِّهِ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَتَبَ إِلَى أَهْلِ الْيَمَنِ بِكِتَابٍ فِيهِ الْفَرَائِضُ وَالسُّنَنُ وَالدِّيَاتُ وَبَعَثَ بِهِ مَعَ عَمْرِو بْنِ حَزْمٍ فَقُرِئَ عَلَى أَهْلِ الْيَمَنِ هَذِهِ نُسْخَتُهُ فَذَكَرَ مِثْلَهُ إِلاَّ أَنَّهُ قَالَ ‏ \"‏ وَفِي الْعَيْنِ الْوَاحِدَةِ نِصْفُ الدِّيَةِ وَفِي الْيَدِ الْوَاحِدَةِ نِصْفُ الدِّيَةِ وَفِي الرِّجْلِ الْوَاحِدَةِ نِصْفُ الدِّيَةِ ‏\"‏ ‏.‏ قَالَ أَبُو …"
summary:
  ar: "في السنن النسائي؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan al-Nasa'i; sending a letter or message to a party."
  ur: "سنن النسائی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
