text: "لا يَنْبَغِي لأَحَدِ أَن يُجَاوِزَ المُعَرَّسَ إذا قَفَلَ، حَتى يُصَلِّي فيه"
summary:
  ar: "يقول مالك إنه لا ينبغي لأحد أن يجاوز المعرس إذا قفل حتى يصلي فيه، وإن مر به في غير وقت صلاة فليقم حتى تحل الصلاة ثم يصلي ما بدا له، لأنه بلغه أن رسول الله عرس به. {cite:muwatta-maruf-1997 p.541}"
