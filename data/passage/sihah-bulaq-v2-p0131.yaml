text: |-
  ٤٥٦
  جديتان واله-ع جدى وجديات بالتحريك وكذلك الجدية على فعيلة والجمع الجدايا ولا تقل
  جديدة والعامة تقولها والجدية أيضاطريقة الدم والجمع الجدايا وقال أبوزيد الجدية من الدم
  ما لزق بالجسد والبصيرة ما كان على الارض والجدى من ولد المعزوثلاثة أجد فاذا كثرت
  فهى الجداء ولا تقل الجدايا ولا الجدى بكسر الجيم والجدى برج فى السماء والإدى نجم
  الى جنب القطب تعرف به القبلة ومعارجدى مقصور أى عام يقال اللهتمّ استقنا غينا غدقا
  وجدى طبقا ويقال أيضاجدى الدهرأى يد الدهر أى أبدا والجدى بالقصر أيضا الجدوى
  وهما العطية وفلان قليل الجداء عنك بالمدّأى قليل الغفاء والنفع والجداية والجداية الغزالة
  قال الاصمعى" هو عنزلة العناق من الغنم "قال الرابز
  تريح بعد النفس المحفوز • اراحة الجداية النفوز
  وجدوته واجتديته واستجديته بمعنى اذاطلبت جدواه قال أبو النجم
  جتنا غحيك ونستجديكا • من نائل اللّٰه الذى يععلمكا
  والجادى السائل العافى وأجداه أى أعطاه الجدوى وأجدى أبضا أى أصاب الجدوى
  وما يجدى،مل هذا أى مايقى ⁦(جذا)⁩ الحذوة والجذرة والجذوة الجرة الملتهبة واجمع
  جذى وجذى وجذى قال مجاهد فى قوله تعالى أوجذوة من النار أى قطعة من الجر قال وهى
  بلغة جميع العرب وقال أبو عبيدة الجذوة مثل الجذمة وهى القطعة الغليظة من اللحشب كان
  فى طرفها نار أولم يكن قال ابن مقبل
  باتت حواطب ليلى يلتمسن لها * جزل الجذى غير خوارولاذعر
  والجاذى المقعى منتصب القدمين وهو على أطراف أصابعه قال النعمات بن عدىّ بن نضلة
  اذاشئت غنتى دهاقين قرية * وصناجة تجذوعلى حرف منسم
  والجمع جذاءمثل نائم ونيام قال الشاعر • وحولى أعداءجذا خصومها • وقال
  أبو عم-روجذا وجثالفتان بعى قال والجاذى القائم على أطراف الاصابع وأنشد
  لابى دواد
  جاذيات على السنابك قدانتلهنّ الاسراج والالجام
  وقال ابن الاعرابى الجاذى على قدميه والجائى على ركبتيه وأجذى وجذابعتى اذائبت
  قائما وفى الحديت منسل الارزة الجذية على الارض أى الشابتة وكل من ببت على شى نقد
  جذاعليه قال الراجز
  لم يبق منها سبل الرذاذ • عير أثافى مرجل جواذى
  والتجاذى فى اشالة الحجر مثل التجانى ورجل جاذ أى قصير الباع وامر أجاذية قال الشاعر
  ان اخلافة لم تكن مقصورة * أبداءلى جاذى اليدين مجخل
  أبو عمر والجذوذى الذى يلازم الرحل والمزل لا يفارقه وأنشد
  ألست بجذ وذ على الرحل دائب • خالك الامارزقت نصيب
  قال الكائى اذاحل الفصيل فى سنامه شماقيل أجذى فهو مجذ رى جرى الما.
  وغيره بريا وجر يانا وأجريته أنا يقال ما أشتبرية هذا الماه بالكسروقوله تعالى بسم اللّٰه
  مجراه%
