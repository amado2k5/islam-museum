label: { ar: "سنن النسائي 1676 — ما ليس بواجب، الصلاة المكتوبة", en: "Sunan al-Nasa'i 1676 — what is said not to be obligatory; the prescribed prayer", ur: "سنن نسائی 1676 — جو واجب نہیں، فرض نماز", fr: "Sunan al-Nasa'i 1676 — ce qui est dit non obligatoire ; la prière prescrite", es: "Sunan al-Nasa'i 1676 — lo que se dice que no es obligatorio; la oración prescrita" }
text: "أَخْبَرَنِي مُحَمَّدُ بْنُ إِسْمَاعِيلَ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي نُعَيْمٍ، عَنْ سُفْيَانَ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَاصِمِ بْنِ ضَمْرَةَ، عَنْ عَلِيٍّ، قَالَ الْوِتْرُ لَيْسَ بِحَتْمٍ كَهَيْئَةِ الْمَكْتُوبَةِ وَلَكِنَّهُ سُنَّةٌ سَنَّهَا رَسُولُ اللَّهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1676، يرد فيه ذكر ما ليس بواجب، والصلاة المكتوبة، والحتم. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 1676 (The Book of Qiyam Al-Lail (The Night Prayer) and Voluntary Prayers During the Day), whose wording mentions what is said not to be obligatory, the prescribed prayer, the binding (hatm). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 1676، جس کے الفاظ میں جو واجب نہیں، فرض نماز، حتمی حکم کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 1676, dont le texte mentionne ce qui est dit non obligatoire, la prière prescrite, le contraignant (hatm). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 1676, cuyo texto menciona lo que se dice que no es obligatorio, la oración prescrita, lo vinculante (hatm). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
