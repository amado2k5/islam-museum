text: "… رسول االله أي الإسلام أفضل قال الإيمان وإسناده صحيح حديث يخرج من النار من كان في قلبه م ثقال ذرة من الإيمان أخرجاه من حديث أبي سعيد الخدري في الشفاعة وفيه اذهبوا فمن وجدتم في قلبه مثقال ذرة من إيمان …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 620، يذكر حلاوة الإيمان وكماله، وتفاضل الإيمان في القلوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 620, that mentions the sweetness and completeness of faith, the degrees of faith in hearts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 620 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، دلوں میں ایمان کے درجے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 620, que menciona la dulzura y la plenitud de la fe, los grados de fe en los corazones; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 4, page 620), évoquant la douceur et la plénitude de la foi, ainsi que les différents degrés de foi dans les cœurs. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Gazali'nin İhya Ulum el-Din (Dinî İlimlerin Yeniden Canlandırılması) adlı eserinin 4. cildinin 620. sayfasından bir alıntı, imanın tatlılığı ve mükemmelliği ile kalplerdeki imanın farklı derecelerini ele almaktadır. Bu alıntı, kaynak yönergelerine uygun olarak, yaklaşık kırk kelimeyle sınırlı, makine tarafından okunabilir baskıdan alınmıştır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ihya Ulum al-Din (Kebangkitan Ilmu-ilmu Agama) karya Al-Ghazali, Jilid 4, halaman 620, membahas tentang kemanisan dan kesempurnaan iman, serta berbagai tingkatan iman dalam hati. Kutipan ini diambil dari edisi yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
