label: { ar: "الموطأ 2242 — مالك: ولو أعتق رجل ثلث عبده وهو مريض، فبت عتقه، عتق عليه كله في ثلثه، لأنه ليس بمنزلة من يعتق ثلث عبده بعد موته، فإن الذي يعتق ثلث عبده بعد موته، لو عاش رجع فيه", en: "Muwatta 2242", es: "Muwatta 2242", fr: "Muwatta 2242", ur: "موطا 2242", tr: "El-Muvatta 2242 — Malik: Bir kimse hasta iken kölesinin üçte birini azat ederse ve azat kesin ise, o zaman kölenin tamamı o üçte birlik kısım içinde azat edilmiş sayılır. Çünkü bu, ölümünden sonra kölesinin üçte birini azat eden kimse gibi değildir. Çünkü ölümünden sonra kölesinin üçte birini azat eden kimse, yaşasaydı onu geri alırdı.", id: "Al-Muwatta 2242 — Malik: Jika seseorang membebaskan sepertiga budaknya ketika ia sakit, dan pembebasan itu bersifat final, maka seluruh budak dalam sepertiga itu dibebaskan, karena tidak seperti orang yang membebaskan sepertiga budaknya setelah kematiannya. Sebab, orang yang membebaskan sepertiga budaknya setelah kematiannya, jika ia masih hidup, ia akan menuntutnya kembali." }
summary:
  ar: "قال مالك: ولو أعتق رجل ثلث عبده وهو مريض، فبت عتقه، عتق عليه كله في ثلثه. وذلك أنه ليس بمنزلة الرجل يعتق ثلث عبده بعد موته؛ لأن الذي يعتق ثلث عبده بعد موته، لو عاش رجع فيه، ولم ينفذ عتقه. وأن العبد الذي يبت سيده عتق ثلثه في مرضه، يعتق عليه كله إن عاش، وإن مات أعتق عليه في ثلثه، لأن أمر الميت جائز في ثلثه، كما أن أمر الصحيح جائز في ماله كله. {cite:muwatta-maruf-1997 p.324}"
  tr: "Malik şöyle dedi: Bir adam hasta iken kölesinin üçte birini azat ederse ve azat kesinleşirse, köle o üçte birlik kısım içinde tamamen azat edilmiş olur. Çünkü bu, bir adamın ölümünden sonra kölesinin üçte birini azat etmesine benzemez. Zira bir kimse ölümünden sonra kölesinin üçte birini azat ederse, hayattayken azat işlemini geri alabilir ve bu geçerli olmaz. Ancak, bir efendi hastalığı sırasında kölesinin üçte birinin azatını kesinleştirirse, köle hayattayken tamamen azat edilmiş olur ve ölürse o üçte birlik kısım içinde azat edilmiş olur. Çünkü ölmüş bir kişinin eylemleri, tıpkı sağlıklı bir kişinin eylemlerinin tüm malı için geçerli olması gibi, mal varlığının üçte biri için geçerlidir. {cite:muwatta-maruf-1997 s.324}"
  id: "Malik berkata: Jika seseorang membebaskan sepertiga budaknya saat ia sakit, dan pembebasan itu bersifat final, maka budak tersebut dibebaskan sepenuhnya dalam sepertiga bagian itu. Ini karena tidak seperti seseorang membebaskan sepertiga budaknya setelah kematiannya. Sebab, jika seseorang membebaskan sepertiga budaknya setelah kematiannya, ia dapat mencabut pembebasan itu jika ia masih hidup, dan pembebasan itu tidak akan sah. Namun, jika seorang majikan memfinalisasi pembebasan sepertiga budaknya selama ia sakit, budak tersebut dibebaskan sepenuhnya jika ia masih hidup, dan jika ia meninggal, ia dibebaskan dalam sepertiga bagian itu. Ini karena tindakan orang yang telah meninggal sah sehubungan dengan sepertiga hartanya, sama seperti tindakan orang yang sehat sah sehubungan dengan seluruh hartanya. {cite:muwatta-maruf-1997 p.324}"
