label: { ar: "الموطأ 2242 — مالك: ولو أعتق رجل ثلث عبده وهو مريض، فبت عتقه، عتق عليه كله في ثلثه، لأنه ليس بمنزلة من يعتق ثلث عبده بعد موته، فإن الذي يعتق ثلث عبده بعد موته، لو عاش رجع فيه", en: "Muwatta 2242" }
summary:
  ar: "قال مالك: ولو أعتق رجل ثلث عبده وهو مريض، فبت عتقه، عتق عليه كله في ثلثه. وذلك أنه ليس بمنزلة الرجل يعتق ثلث عبده بعد موته؛ لأن الذي يعتق ثلث عبده بعد موته، لو عاش رجع فيه، ولم ينفذ عتقه. وأن العبد الذي يبت سيده عتق ثلثه في مرضه، يعتق عليه كله إن عاش، وإن مات أعتق عليه في ثلثه، لأن أمر الميت جائز في ثلثه، كما أن أمر الصحيح جائز في ماله كله. {cite:muwatta-maruf-1997 p.324}"
