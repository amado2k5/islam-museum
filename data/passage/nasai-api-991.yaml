label: { ar: "سنن النسائي 991 — الأب والأبوة", en: "Sunan al-Nasa'i 991 — the father and fatherhood", ur: "سنن نسائی 991 — باپ اور والدیت" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عُثْمَانَ، قَالَ حَدَّثَنَا بَقِيَّةُ، وَأَبُو حَيْوَةَ عَنِ ابْنِ أَبِي حَمْزَةَ، قَالَ حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ قَرَأَ فِي صَلاَةِ الْمَغْرِبِ بِسُورَةِ الأَعْرَافِ فَرَّقَهَا فِي رَكْعَتَيْنِ."
summary:
  ar: "حديث في سنن النسائي، رقم 991، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 991 (The Book of the Commencement of the Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 991، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
