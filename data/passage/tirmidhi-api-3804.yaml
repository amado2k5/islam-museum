label: { ar: "جامع الترمذي 3804 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Jami' al-Tirmidhi 3804 — a testament or parting counsel; a deathbed and last hours", ur: "جامع ترمذی 3804 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات" }
text: "… الْخَوْلاَنِيِّ، عَنْ يَزِيدَ بْنِ عَمِيرَةَ، قَالَ لَمَّا حَضَرَ مُعَاذَ بْنَ جَبَلٍ الْمَوْتُ قِيلَ لَهُ يَا أَبَا عَبْدِ الرَّحْمَنِ أَوْصِنَا. قَالَ أَجْلِسُونِي. فَقَالَ إِنَّ الْعِلْمَ وَالإِيمَانَ مَكَانَهُمَا مَنِ ابْتَغَاهُمَا وَجَدَهُمَا يَقُولُ ذَلِكَ ثَلاَثَ مَرَّاتٍ وَالْتَمِسُوا الْعِلْمَ عِنْدَ أَرْبَعَةِ رَهْطٍ عِنْدَ عُوَيْمِرٍ أَبِي الدَّرْدَاءِ وَعِنْدَ سَلْمَانَ الْفَارِسِيِّ وَعِنْدَ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ وَعِنْدَ عَبْدِ اللَّهِ بْنِ سَلاَمٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3804، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3804 (Chapters on Virtues), that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3804، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
