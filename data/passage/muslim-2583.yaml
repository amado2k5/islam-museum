text: "قال أبو موسى: قال رسول الله: إن الله ليملي للظالم فإذا أخذه لم يفلته، ثم قرأ: «وكذلك أخذ ربك إذا أخذ القرى وهي ظالمة إن أخذه أليم شديد»"
summary:
  ar: "رواية أبي موسى الأشعري في باب في إملاء الله للظالم من كتاب البر من صحيح مسلم؛ الإملاء ثم الأخذ الذي لا إفلات منه، مقروناً بقوله تعالى «وكذلك أخذ ربك إذا أخذ القرى وهي ظالمة»."
