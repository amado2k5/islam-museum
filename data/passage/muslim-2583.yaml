label: { ar: "مسلم 2583 — إن الله ليملي للظالم", en: "Muslim 2583 — God gives the wrongdoer respite", es: "Muslim 2583 — Dios le da un respiro al malhechor", fr: "Muslim 2583 — Dieu accorde un répit au malfaiteur", ur: "مسلم 2583 — خدا ظالم کو مہلت دیتا ہے۔", tr: "Müslim 2583 — Allah zalime mühlet verir", id: "Muslim 2583 — Allah memberi kesempatan kepada penindas" }
text: "قال أبو موسى: قال رسول الله: إن الله ليملي للظالم فإذا أخذه لم يفلته، ثم قرأ: «وكذلك أخذ ربك إذا أخذ القرى وهي ظالمة إن أخذه أليم شديد»"
summary:
  ar: "رواية أبي موسى الأشعري في باب في إملاء الله للظالم من كتاب البر من صحيح مسلم؛ الإملاء ثم الأخذ الذي لا إفلات منه، مقروناً بقوله تعالى «وكذلك أخذ ربك إذا أخذ القرى وهي ظالمة»."
  tr: "Sahih Müslim'deki Salihlik Kitabı'nda, zalime Allah'ın verdiği müsadere bölümünde Ebu Musa el-Eş'ari'nin rivayeti; müsadere ve ardından kurtuluşun olmadığı kuşatma, Yüce Allah'ın şu sözüyle birleşiyor: \"İşte Rabbiniz, zulüm eden şehirleri böyle kuşatır.\""
  id: "Riwayat Abu Musa al-Ash’ari dalam bab tentang penangguhan hukuman Allah bagi orang zalim dari Kitab Kebenaran dalam Sahih Muslim; penangguhan hukuman dan kemudian penculikan yang tidak dapat dihindari, ditambah dengan firman Allah Yang Maha Kuasa, “Dan demikianlah penculikan Tuhanmu ketika Dia menindas kota-kota ketika mereka berbuat zalim.”"
