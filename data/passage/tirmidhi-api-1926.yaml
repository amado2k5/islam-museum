label: { ar: "جامع الترمذي 1926 — الأب والأبوة", en: "Jami' al-Tirmidhi 1926 — the father and fatherhood", ur: "جامع ترمذی 1926 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1926 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1926 — le père et la paternité" }
text: "… عَنِ الْقَعْقَاعِ بْنِ حَكِيمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" الدِّينُ النَّصِيحَةُ \". ثَلاَثَ مِرَارٍ. قَالُوا يَا رَسُولَ اللَّهِ لِمَنْ قَالَ \" لِلَّهِ وَلِكِتَابِهِ وَلأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَتَمِيمٍ الدَّارِيِّ وَجَرِيرٍ وَحَكِيمِ بْنِ أَبِي يَزِيدَ عَنْ أَبِيهِ وَثَوْبَانَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1926، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1926 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1926، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1926 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los familiares), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1926 (chapitres sur la piété et les bonnes relations familiales), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
