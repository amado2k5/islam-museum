label: { ar: "صحيح البخاري 1330 — مرض النبي، المرض والمريض", en: "Sahih al-Bukhari 1330 — the Prophet's illness; illness and the sick", ur: "صحیح بخاری 1330 — نبی کی بیماری، بیماری اور بیمار", es: "Sahih al-Bukhari 1330 — La enfermedad del Profeta; la enfermedad y los enfermos", fr: "Sahih al-Bukhari 1330 — La maladie du Prophète; la maladie et les malades", tr: "Sahih el-Buhari 1330 — Peygamberin Hastalığı, Hastalık ve Hasta", id: "Sahih al-Bukhari 1330 — Penyakit Nabi, Penyakit dan Pasien" }
text: "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، عَنْ شَيْبَانَ، عَنْ هِلاَلٍ ـ هُوَ الْوَزَّانُ ـ عَنْ عُرْوَةَ، عَنْ عَائِشَةَا ـ عَنِ النَّبِيِّ قَالَ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ \" لَعَنَ اللَّهُ الْيَهُودَ وَالنَّصَارَى، اتَّخَذُوا قُبُورَ أَنْبِيَائِهِمْ مَسْجِدًا \". قَالَتْ وَلَوْلاَ ذَلِكَ لأَبْرَزُوا قَبْرَهُ غَيْرَ أَنِّي أَخْشَى أَنْ يُتَّخَذَ مَسْجِدًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 1330، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 1330 (Funerals (Al-Janaa'iz)), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 1330، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1330 (Funerales (Al-Janaa'iz)), menciona la enfermedad del Profeta, así como a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 1330 (Funérailles), mentionne la maladie du Prophète, la maladie et les malades. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 1330 numaralı hadis, Peygamberimizin hastalığını, hastalığın kendisini ve hastayı anlatmaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1330, menyebutkan penyakit Nabi, penyakit itu sendiri, dan pasiennya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
