text: "مال، ولا صغير من الأمور ولا كبير. فأجابه إلى ذلك وأقربه، وكتب له كتابا أكد فيه على نفسه ورضي به أمير المؤمنين هارون، وقبله وعرف صدق نيته فيه . فشرطت لأمير المؤمنين وجعلت له على نفسي أن أسمع لمحمد وأطيع"
