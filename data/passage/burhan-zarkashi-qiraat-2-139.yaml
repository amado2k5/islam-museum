text: "… وعزاه السيوطي في الدر المنثور لأبي الشيخ وابن أبي حاتم عن قتادة أيضًا مرسلاً. قال السيوطي : ذكره ابن حبيب، ومحمد بن بركات السعيدي في كتابه الناسخ والمنسوخ، وجزم به السخاوي في جمال القراء. الإتقان، و جمال القراء."
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 139، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 139, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 139 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Zarkashi, Al-Burhan fi 'Ulum al-Qur'an, volumen 2, pág. 139, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du livre du Coran d'al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an (tome 2, page 139), mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
