label: { ar: "صحيح البخاري 4344 — الحرام", en: "Sahih al-Bukhari 4344 — the unlawful", ur: "صحیح بخاری 4344 — حرام", es: "Sahih al-Bukhari 4344 — lo ilícito" }
text: "… يَا نَبِيَّ اللَّهِ، إِنَّ أَرْضَنَا بِهَا شَرَابٌ مِنَ الشَّعِيرِ الْمِزْرُ، وَشَرَابٌ مِنَ الْعَسَلِ الْبِتْعُ. فَقَالَ \" كُلُّ مُسْكِرٍ حَرَامٌ \". فَانْطَلَقَا فَقَالَ مُعَاذٌ لأَبِي مُوسَى كَيْفَ تَقْرَأُ الْقُرْآنَ قَالَ قَائِمًا وَقَاعِدًا وَعَلَى رَاحِلَتِهِ وَأَتَفَوَّقُهُ تَفَوُّقًا. قَالَ أَمَّا أَنَا فَأَنَامُ وَأَقُومُ، فَأَحْتَسِبُ نَوْمَتِي كَمَا أَحْتَسِبُ قَوْمَتِي، وَضَرَبَ فُسْطَاطًا، فَجَعَلاَ يَتَزَاوَرَانِ، فَزَارَ مُعَاذٌ أَبَا مُوسَى، فَإِذَا رَجُلٌ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4344، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4344, that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4344، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4344, menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
