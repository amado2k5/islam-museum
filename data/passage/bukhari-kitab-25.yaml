summary:
  ar: "القسم 25 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحج»، ويضم فيها النصوص من 1513 إلى 1772 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 25 of Sahih al-Bukhari (Hajj (Pilgrimage)) in the division of the open hadith dataset the museum took its reports from: reports 1513 to 1772 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 25، عنوان «کتاب الحج»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1513 تا 1772۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 25 de Sahih al-Bukhari (Hajj (Peregrinación)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1513 al 1772, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 25 du Sahih al-Bukhari (Hajj, le pèlerinage), qui comprend les hadiths 1513 à 1772 selon la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 25. bölümü \"Hac Kitabı\" başlığını taşımakta olup 1513 ile 1772 yılları arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 25 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Haji\" dan berisi teks-teks bernomor 1513 hingga 1772. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
