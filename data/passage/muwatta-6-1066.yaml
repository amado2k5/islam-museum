label: { ar: "الموطأ 1066 — عمر بن الخطاب للركن الأسود وهو يطوف: إنما أنت حجر، ولولا أني رأيت رسول الله قبلك ما قبلتك، ثم قبله", en: "Muwatta 1066", es: "Muwatta 1066", fr: "Muwatta 1066", ur: "موطا 1066", tr: "El-Muvatta 1066 — Ömer ibn el-Hattab, tavaf ederken Kara Taş'a şöyle dedi: \"Sen sadece bir taşsın ve Allah'ın Resulü'nün seni öptüğünü görmeseydim, seni öpmezdim.\" Sonra Resulullah taşı öptü.", id: "Al-Muwatta 1066 — Umar ibn al-Khattab kepada Batu Hitam saat melakukan tawaf: Engkau hanyalah sebuah batu, dan seandainya aku tidak melihat Rasulullah menciummu, niscaya aku tidak akan menciummu, lalu beliau menciumnya." }
text: "إنما أنت حجر، ولولا أني رأيت رسول الله قبلك ما قبلتك، ثم قبله"
summary:
  ar: "أول حديث في باب تقبيل الركن الأسود في الاستلام. يرويه مالك عن هشام بن عروة عن أبيه، أن عمر بن الخطاب قال، وهو يطوف بالبيت، للركن الأسود: إنما أنت حجر، ولولا أني رأيت رسول الله قبلك ما قبلتك، ثم قبله. ويذكر المحقق أن الحديث مرسل في الموطأ، وأن ابن وهب رواه عن يونس وعمرو بن الحارث عن ابن شهاب عن سالم عن أبيه، وعن زيد بن أسلم عن أبيه عن عمر، وأن الرواية المرسلة أصح لمتابعة معمر وابن عيينة وابن جريج، وأن الموصول عن سويد بن غفلة عن عمر. {cite:muwatta-maruf-1997 p.492}"
  tr: "Kabe'ye dokunma ritüeli sırasında Kara Taş'ı öpme bölümündeki ilk hadis. Malik'in Hişam ibn Urve'den, onun babasından rivayet ettiğine göre, Ömer ibn el-Hattab, Kabe'yi tavaf ederken Kara Taş'a şöyle demiş: \"Sen sadece bir taşsın ve Allah'ın Resulü'nün seni öptüğünü görmeseydim, seni öpmezdim.\" Sonra da onu öpmüştür. Araştırmacı, hadisin el-Muvatta'da mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu ve İbn Vahb'ın bunu Yunus ve Amr ibn el-Harith'ten, onların da İbn Şihab'tan, onların da Salim'den, onların da babasından, onların da Zeyd ibn Aslam'dan, onların da babasından, onların da Ömer'den rivayet ettiğini belirtmektedir. Muwatta Maruf, mursal rivayetin Ma'mar, İbn Uyaynah ve İbn Jurayj'ın tasdikleri nedeniyle daha sahih olduğunu, bağlantılı rivayetin ise Suwayd ibn Ghaflah'ın, Ömer'in rivayetine dayandığını belirtmektedir. {cite:muwatta-maruf-1997 s.492}"
  id: "Hadits pertama dalam bab ini adalah tentang mencium Batu Hitam saat melakukan ritual menyentuh Ka'bah. Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, bahwa Umar ibn al-Khattab berkata, ketika melakukan tawaf di Ka'bah, kepada Batu Hitam: “Engkau hanyalah sebuah batu, dan seandainya aku tidak melihat Rasulullah menciummu, niscaya aku tidak akan menciummu,” lalu beliau menciumnya. Peneliti menyebutkan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) dalam kitab al-Muwatta, dan bahwa Ibnu Wahb meriwayatkannya dari Yunus dan Amr ibn al-Harith, dari Ibnu Shihab, dari Salim, dari ayahnya, dan dari Zayd ibn Aslam, dari ayahnya, dari Umar. Ia menyatakan bahwa riwayat mursal lebih otentik karena didukung oleh Ma'mar, Ibn Uyaynah, dan Ibn Jurayj, dan bahwa riwayat terkaitnya berasal dari Suwayd ibn Ghaflah, yang juga berasal dari Umar. {cite:muwatta-maruf-1997 p.492}"
