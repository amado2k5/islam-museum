label: { ar: "الموطأ 1066 — عمر بن الخطاب للركن الأسود وهو يطوف: إنما أنت حجر، ولولا أني رأيت رسول الله قبلك ما قبلتك، ثم قبله", en: "Muwatta 1066" }
text: "إنما أنت حجر، ولولا أني رأيت رسول الله قبلك ما قبلتك، ثم قبله"
summary:
  ar: "أول حديث في باب تقبيل الركن الأسود في الاستلام. يرويه مالك عن هشام بن عروة عن أبيه، أن عمر بن الخطاب قال، وهو يطوف بالبيت، للركن الأسود: إنما أنت حجر، ولولا أني رأيت رسول الله قبلك ما قبلتك، ثم قبله. ويذكر المحقق أن الحديث مرسل في الموطأ، وأن ابن وهب رواه عن يونس وعمرو بن الحارث عن ابن شهاب عن سالم عن أبيه، وعن زيد بن أسلم عن أبيه عن عمر، وأن الرواية المرسلة أصح لمتابعة معمر وابن عيينة وابن جريج، وأن الموصول عن سويد بن غفلة عن عمر. {cite:muwatta-maruf-1997 p.492}"
