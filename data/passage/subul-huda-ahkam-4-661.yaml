  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 4. cildinin 661. sayfasından bir alıntı, farz, tavsiye edilen, mekruh edilen, caiz olan, haram olan ve tavsiye edilen amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Salihi, \"Subul al-Huda wa al-Rashad,\" Jilid 4, halaman 661, membahas tentang amalan wajib, anjuran, makruh, halal, dan anjuran. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
