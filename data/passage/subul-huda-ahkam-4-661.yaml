text: "… : البدعة منتمسمة إلى واجبة وإلى محرمة ومندوبة ومكروهة ومباحة. قال : والطريق فى ذلك أن نَعْرض البدْعة على قواعد الشَّرْع، فإذا دخلت فى قواعد الإِيجاب فهى وأجبة، أو في قواعد التحريم فهى محرَّمة، أَو الندب فمندوبة، أَو المكروه فمكروهة …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 661، يرد فيه ذكر الواجب، والوجوب، والمندوب، والمكروه، والمباح، والتحريم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 661, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), the disliked (makruh), the permitted (mubah), forbidding (tahrim), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 661 کا اقتباس جس میں واجب، وجوب، مندوب، مکروہ، مباح، تحریم، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subul al-Huda wa-l-Rashad de al-Salihi, volume numérisé 4, p. 661, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mandub), le réprouvé (makruh), le permis (mubah), l'interdiction (tahrim), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
