  ar: "أول أثر في باب الرخصة في صلاة المرأة في الدرع والخمار، وهو بلاغ: يروي يحيى عن مالك أنه بلغه أن عائشة زوج النبي كانت تصلي في الدرع والخمار. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.204}"
