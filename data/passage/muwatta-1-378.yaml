label: { ar: "الموطأ 378 — بلاغ: عائشة تصلي في الدرع والخمار", en: "Muwatta 378", es: "Muwatta 378", fr: "Muwatta 378", ur: "موطا 378", tr: "Al-Muwatta 378 — Haber: Ayşe tunik ve başörtüsüyle namaz kılıyor", id: "Al-Muwatta 378 — Laporan: Aisyah shalat dengan mengenakan tunik dan jilbab" }
summary:
  ar: "أول أثر في باب الرخصة في صلاة المرأة في الدرع والخمار، وهو بلاغ: يروي يحيى عن مالك أنه بلغه أن عائشة زوج النبي كانت تصلي في الدرع والخمار. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.204}"
  tr: "Kadınların tunik ve başörtüsüyle namaz kılmalarının caiz olduğuna dair ilk delil, Yahya'nın Malik'ten rivayet ettiğine göre, Peygamberimizin eşi Ayşe'nin tunik ve başörtüsüyle namaz kıldığını duyduğudur. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.204}"
  id: "Bukti pertama mengenai kebolehan seorang wanita shalat dengan mengenakan tunik dan jilbab adalah sebuah riwayat: Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Aisyah, istri Nabi, biasa shalat dengan mengenakan tunik dan jilbab. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.204}"
