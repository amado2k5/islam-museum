text: "… اللّٰه بن حمر الجعفى ثنا أيو معاوية ثنا الأعمش عن شقيق. قال : خطبنا ابن عباس وهو على الموسم فافتتح سورة البقرة فيمل يقرأ ويفسر، فجملت أقول مارأيت ولا سرمت كلام رجل مثله، لو معته فارس والروم لأسلمت. حدثنا أحمد …"
summary:
