  ar: "قول لمالك: تجب زكاة الفطر على أهل البادية كما تجب على أهل القرى، وذلك أن النبي فرض زكاة الفطر من رمضان على الناس على كل حر أو عبد ذكر أو أنثى من المسلمين. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.381}"
