label: { ar: "الموطأ 1621 — هشام بن عروة: سمع رجلا يسأل عروة بن الزبير عن رجل قال لامرأته كل امرأة أنكحها عليك ما عشت فهي علي كظهر أمي، فقال يجزيه عتق رقبة", en: "Muwatta 1621", es: "Muwatta 1621", fr: "Muwatta 1621", ur: "موطا 1621", tr: "El-Muvatta 1621 — Hişam ibn Urve: Bir adamın Urve ibn el-Zübeyr'e, karısına, \"Sen yanımdayken evlendiğim her kadın bana annemin sırtı gibidir\" diyen bir adam hakkında sorduğunu işitti. Urve ibn el-Zübeyr, \"Onun için bir köleyi azat etmek yeterlidir\" dedi.", id: "Al-Muwatta 1621 — Hisham ibn Urwah: Dia mendengar seorang pria bertanya kepada Urwah ibn al-Zubayr tentang seorang pria yang berkata kepada istrinya, “Setiap wanita yang kunikahi selama engkau bersamaku bagaikan punggung ibuku bagiku.” Beliau menjawab, “Membebaskan seorang budak sudah cukup baginya.”" }
summary:
  ar: "يروي مالك عن هشام بن عروة أنه سمع رجلا يسأل عروة بن الزبير عن رجل قال لامرأته كل امرأة أنكحها عليك ما عشت، فهي علي كظهر أمي، فقال عروة بن الزبير يجزيه من ذلك عتق رقبة. {cite:muwatta-maruf-1997 p.70}"
  tr: "Malik, Hişam ibn Urve'den rivayetle, bir adamın Urve ibn el-Zübeyr'e, karısına \"Sen yanımdayken evlendiğim her kadın bana annemin sırtı gibidir\" diyen bir adam hakkında sorduğunu işittiğini anlatır. Urve ibn el-Zübeyr, \"Onun yerine bir köle azat etmesi yeterlidir\" demiştir. {cite:muwatta-maruf-1997 s.70}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah bahwa ia mendengar seorang pria bertanya kepada Urwah ibn al-Zubayr tentang seorang pria yang berkata kepada istrinya, \"Setiap wanita yang kunikahi selama engkau bersamaku bagaikan punggung ibuku bagiku.\" Urwah ibn al-Zubayr berkata, \"Membebaskan seorang budak sudah cukup baginya sebagai pengganti itu.\" {cite:muwatta-maruf-1997 p.70}"
