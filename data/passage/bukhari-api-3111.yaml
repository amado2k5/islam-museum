label: { ar: "صحيح البخاري 3111 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 3111 — what was left behind: estate and inheritance", ur: "صحیح بخاری 3111 — ترکہ اور میراث", es: "Sahih al-Bukhari 3111 — Lo que quedó: patrimonio y herencia" }
text: "… سَعِيدٍ، حَدَّثَنَا سُفْيَانُ، عَنْ مُحَمَّدِ بْنِ سُوقَةَ، عَنْ مُنْذِرٍ، عَنِ ابْنِ الْحَنَفِيَّةِ، قَالَ لَوْ كَانَ عَلِيٌّ ـ ذَاكِرًا عُثْمَانَ ـ ذَكَرَهُ يَوْمَ جَاءَهُ نَاسٌ فَشَكَوْا سُعَاةَ عُثْمَانَ، فَقَالَ لِي عَلِيٌّ اذْهَبْ إِلَى عُثْمَانَ فَأَخْبِرْهُ أَنَّهَا صَدَقَةُ رَسُولِ اللَّهِ، فَمُرْ سُعَاتَكَ يَعْمَلُونَ فِيهَا. فَأَتَيْتُهُ بِهَا فَقَالَ أَغْنِهَا عَنَّا. فَأَتَيْتُ بِهَا عَلِيًّا فَأَخْبَرْتُهُ فَقَالَ ضَعْهَا حَيْثُ أَخَذْتَهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 3111، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3111 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3111، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3111 (Una quinta parte del botín para la causa de Alá (Khumus)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
