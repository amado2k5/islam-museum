text: "١٣ الكتاب إلى المشركين ٩٨٤٥ - أخبرنا عبد الرزاق قال : أخبرنا الثوري عن عثمان ابن عبد الله بن موهب عن أبي بردة ، قال : كتب رجل من المشركين إلى النبي عليله ، وكتب في أسفل الكتاب يسلم عليه"
