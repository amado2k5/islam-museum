text: "… سألها نفسها وهي على قتب لم تمنعه وروى الحاكم المرفوع منه من حديث معاذ ولفظه قال لوأمرت احدا ان يسجد لاحد لامرت المرأة أن تسجد لزوجها من عظم حقه عليها ولا تجدامرأة حلاوة الايمان حتى تؤدى حق زوجها ولو سألهانفسها …"
