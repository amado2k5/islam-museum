label: { ar: "الموطأ 219 — عمر يقرأ يوسف والحج في الصبح قراءة بطيئة", en: "Muwatta 219", es: "Muwatta 219", fr: "Muwatta 219", ur: "موطا 219", tr: "Al-Muwatta 219 — Ömer sabahleyin yavaş bir şekilde Yusuf Suresi ve Hac Suresi'ni okur.", id: "Al-Muwatta 219 — Umar membaca Surah Yusuf dan Surah Al-Hajj di pagi hari, dengan bacaan yang lambat." }
text: "صلينا وراء عمر بن الخطاب الصبح فقرأ فيها بسورة يوسف وسورة الحج قراءة بطيئة"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه أنه سمع عبد الله بن عامر بن ربيعة يقول، في باب القراءة في الصبح: صلوا وراء عمر بن الخطاب الصبح فقرأ فيها بسورة يوسف وسورة الحج قراءة بطيئة، فقال له عروة إنه إذن كان يقوم حين يطلع الفجر، فقال: أجل. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي والشافعي ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرج عن معمر عن هشام قول ابن عامر إنه ما حفظ سورتي يوسف والحج إلا عن عمر من كثرة ما كان يقرؤهما في الفجر. {cite:muwatta-maruf-1997 p.133}"
  tr: "Malik'in, Hişam ibn Urve'den, onun da babasından rivayet ettiği bir hadiste, Abdullah ibn Amir ibn Rabi'ah'ın sabah namazındaki okuma bölümünde şöyle dediğini işittiği belirtilir: \"Sabah namazında Ömer ibn el-Hattab'ın arkasında namaz kılın ve o, Yusuf Suresi ile Hac Suresi'ni yavaş yavaş okurdu.\" Urve ona, \"Öyleyse şafak söktüğünde ayağa kalkar mıydı?\" diye sordu. O da \"Evet\" diye cevap verdi. Araştırmacı, bunu Ebu Musab ve İbn Vahb'ın, el-Tahavi ve el-Şafii'ye göre Malik'ten, el-Beyhakî'ye göre ise Yahya ibn Bukayr'dan rivayet ettiğini belirtiyor. Abd el-Razzaq da, Hişam'dan, Ma'mar'dan rivayet ettiği üzere, İbn Amir'in, Ömer'den sadece Yusuf Suresi ile Hac Suresi'ni ezberlediğini, çünkü Ömer'in bu sureleri sabah namazında çok sık okuduğunu söylediğini aktarmıştır. {cite:muwatta-maruf-1997 s.133}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Hisham ibn Urwah, dari ayahnya, menyatakan bahwa ia mendengar Abdullah ibn Amir ibn Rabi'ah berkata, dalam surah tentang bacaan dalam salat Subuh: \"Salatlah di belakang Umar ibn al-Khattab dalam salat Subuh, dan dia membaca Surah Yusuf dan Surah al-Hajj dengan perlahan.\" Urwah kemudian bertanya kepadanya, \"Jadi dia biasa berdiri ketika fajar menyingsing?\" Dia menjawab, \"Ya.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Ibn Wahb meriwayatkannya dari Malik, menurut al-Tahawi dan al-Shafi'i, dan Yahya ibn Bukayr menurut al-Bayhaqi. Abd al-Razzaq juga meriwayatkan, dari Ma'mar, dari Hisham, bahwa Ibn Amir berkata bahwa ia hanya menghafal Surah Yusuf dan Surah al-Hajj dari Umar karena seberapa sering dia membacanya dalam salat Subuh. {mengutip:muwatta-maruf-1997 hal.133}"
