label: { ar: "الموطأ 219 — عمر يقرأ يوسف والحج في الصبح قراءة بطيئة", en: "Muwatta 219" }
text: "صلينا وراء عمر بن الخطاب الصبح فقرأ فيها بسورة يوسف وسورة الحج قراءة بطيئة"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه أنه سمع عبد الله بن عامر بن ربيعة يقول، في باب القراءة في الصبح: صلوا وراء عمر بن الخطاب الصبح فقرأ فيها بسورة يوسف وسورة الحج قراءة بطيئة، فقال له عروة إنه إذن كان يقوم حين يطلع الفجر، فقال: أجل. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي والشافعي ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرج عن معمر عن هشام قول ابن عامر إنه ما حفظ سورتي يوسف والحج إلا عن عمر من كثرة ما كان يقرؤهما في الفجر. {cite:muwatta-maruf-1997 p.133}"
