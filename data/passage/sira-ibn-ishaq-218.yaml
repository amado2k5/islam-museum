text: "ا قالوا لهم ؛ فقالوا: سلام عليكم لانجاهلكم ، لنا اعمالنا ولكم اعمالكم ، لا نالوا انفسنا خيرا، ويقال ان النفر النصاري من اهل نجران ، فالله اعلم اي ذلك كان ، ويقال - والله اعلم - ان فيهم نزلت هولاء الايات"
