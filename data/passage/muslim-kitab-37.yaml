summary:
  ar: "القسم 37 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب اللباس والزينة»، ويضم فيها النصوص من 5385 إلى 5585 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 37 of Sahih Muslim (The Book of Clothes and Adornment) in the division of the open hadith dataset the museum took its reports from: reports 5385 to 5585 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 37، عنوان «کتاب اللباس والزینۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5385 تا 5585۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 37 del Sahih Muslim (El Libro de la Vestimenta y el Adorno) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5385 al 5585 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses données du Sahih Muslim (Livre des vêtements et des parures), dans le recueil de hadiths ouvert Sahih Muslim: les hadiths 5385 à 5585 de cette base de données sont classés sous ce livre. Les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 37. bölümü \"Giyim ve Süs Kitabı\" başlığını taşımakta olup, 5385 ile 5585 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 37 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pakaian dan Perhiasan\" dan berisi teks 5385 hingga 5585, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
