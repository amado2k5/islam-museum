text: "وما كان ينبغي لبشارٍ أنْ يناظِرَ حماداً من جهة الشعرِ وما يتعلَّقُ بالشِّعر، لأنَّ حمَّاداً في الحَضِيَض، وَبِشَّاراُ مع العَيُّوق. وليس في الأرض مولّد قَرَوِيٌّ يُعَدُّ شعرُه في وقال أبو الشمقمق في جميل بن محفوظ: من المتقارب وأمّا أبو نُواسٍ …"
