text: "… جعفر، أخبرنا العلاء بن عبدالرحمن... فذكره. حدثنا عبدالملك بن محمد بن إبراهيم، أخبرنا أبو الحسن علي بن عبدالله الجبلي بمكة، حدثنا جعفر بن محمد، حدثنا أبو العباس بن مسروق قال سمعت السري السقطي يقول: ثلاثة من كنّ فيه استكمل الإيمان: …"
summary:
