text: "… حق المسلم على المسلم ست قدماه بارسوا أن قال اذا لقيته فسلم عليه واذا دعاك فاجبه وإذا استنصحك فانصح له واذا عطس محمد ابن ثمته وإذا مرض تعودة وازامات فاتبعه با من سمع العطسة يقول الحدين حد نا طلق بن …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 1، ص 186، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 1, p. 186, that mentions what a believer owes a believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 1، ص 186 کا اقتباس جس میں مومن کا مومن پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Adab al-Mufrad de Al-Bujari, volumen 1, pág. 186, que menciona lo que un creyente le debe a otro creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du traité al-Adab al-Mufrad d'al-Bukhari (tome 1, p. 186) évoquant les devoirs d'un croyant envers un autre; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur « Piliers et Branches de la Foi »."
  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 1. cildinin 186. sayfasından, bir müminin diğer bir mümin üzerindeki haklarından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 1, halaman 186, yang menyebutkan hak-hak seorang mukmin atas mukmin lainnya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
