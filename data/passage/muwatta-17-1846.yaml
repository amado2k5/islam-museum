label: { ar: "الموطأ 1846 — مالك عن حميد بن قيس عن مجاهد: صائغ سأل ابن عمر عن بيع الذهب بأكثر من وزنه ليستفضل أجر صنعته، فنهاه، وقال الدينار بالدينار لا فضل بينهما", en: "Muwatta 1846", es: "Muwatta 1846", fr: "Muwatta 1846", ur: "موطا 1846", tr: "El-Muvatta 1846 — Malik, Humaid bin Kays'tan, o da Mücahid'den rivayetle: Bir kuyumcu, işçilik maliyetlerini artırmak için altını ağırlığından fazla fiyata satmanın mümkün olup olmadığını İbn Ömer'e sordu. İbn Ömer de ona bunu yasakladı ve şöyle dedi: \"Bir dinar karşılığında bir dinar, aralarında hiçbir fark yoktur.\"", id: "Al-Muwatta 1846 — Malik, berdasarkan riwayat Humaid bin Qais, berdasarkan riwayat Mujahid: Seorang tukang emas bertanya kepada Ibnu Umar tentang menjual emas dengan harga lebih tinggi dari beratnya untuk meningkatkan biaya tenaga kerjanya, lalu beliau melarangnya dan berkata: Satu dinar untuk satu dinar, tidak ada perbedaan di antara keduanya." }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي عن مجاهد أنه كان مع عبد الله بن عمر، فجاءه صائغ فقال: يا أبا عبد الرحمن، إني أصوغ الذهب، ثم أبيع الشيء من ذلك بأكثر من وزنه، فأستفضل من ذلك قدر عمل يدي. فنهاه عبد الله عن ذلك، فجعل الصائغ يرددها عليه، وعبد الله ينهاه، حتى انتهى إلى باب المسجد. ثم قال عبد الله بن عمر: الدينار بالدينار، والدرهم بالدرهم، لا فضل بينهما، هذا عهد نبينا إلينا، وعهدنا إليكم. {cite:muwatta-maruf-1997 p.158}"
  tr: "Malik, Humaid ibn Qays al-Makki'den, o da Mücahid'den rivayet ettiğine göre, Abdullah ibn Umar ile birlikteyken bir kuyumcu yanına gelip, “Ey Ebu Abdül-Rahman, ben altınla çalışıyorum, sonra bir kısmını ağırlığından fazla fiyata satıyorum, böylece emeğime denk bir kar elde ediyorum” dedi. Abdullah ona bunu yapmasını yasakladı, ancak kuyumcu isteğini tekrarlamaya devam etti ve Abdullah da onu yasaklamaya devam etti, ta ki mescidin kapısına varana kadar. Sonra Abdullah ibn Umar, “Bir dinar bir dinara, bir dirhem bir dirheme, aralarında hiçbir fark yoktur. Bu, Peygamberimizin bize verdiği ve bizim de size verdiğimiz bir ahittir” dedi. {cite:muwatta-maruf-1997 s.158}"
  id: "Malik meriwayatkan dari Humaid ibn Qays al-Makki, dari Mujahid, bahwa ia bersama Abdullah ibn Umar ketika seorang tukang emas datang kepadanya dan berkata, “Wahai Abu Abd al-Rahman, saya bekerja dengan emas, lalu saya menjual sebagiannya dengan harga lebih tinggi dari beratnya, sehingga saya memperoleh keuntungan yang setara dengan jerih payah saya.” Abdullah melarangnya melakukan hal itu, tetapi tukang emas itu terus mengulangi permintaannya, dan Abdullah terus melarangnya, hingga mereka sampai di pintu masjid. Kemudian Abdullah ibn Umar berkata, “Satu dinar untuk satu dinar, dan satu dirham untuk satu dirham, tidak ada perbedaan di antara keduanya. Inilah perjanjian Nabi kita kepada kita, dan perjanjian kita kepada kalian.” {cite:muwatta-maruf-1997 p.158}"
