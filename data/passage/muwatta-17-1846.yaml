label: { ar: "الموطأ 1846 — مالك عن حميد بن قيس عن مجاهد: صائغ سأل ابن عمر عن بيع الذهب بأكثر من وزنه ليستفضل أجر صنعته، فنهاه، وقال الدينار بالدينار لا فضل بينهما", en: "Muwatta 1846" }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي عن مجاهد أنه كان مع عبد الله بن عمر، فجاءه صائغ فقال: يا أبا عبد الرحمن، إني أصوغ الذهب، ثم أبيع الشيء من ذلك بأكثر من وزنه، فأستفضل من ذلك قدر عمل يدي. فنهاه عبد الله عن ذلك، فجعل الصائغ يرددها عليه، وعبد الله ينهاه، حتى انتهى إلى باب المسجد. ثم قال عبد الله بن عمر: الدينار بالدينار، والدرهم بالدرهم، لا فضل بينهما، هذا عهد نبينا إلينا، وعهدنا إليكم. {cite:muwatta-maruf-1997 p.158}"
