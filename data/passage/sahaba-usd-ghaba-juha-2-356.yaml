text: "خُوَيْلِدُ بن عَمْرو خَوْلِي بن أبي خَوْلي العِجْلي عِجْل بن لُجَيْم، ويقال: الجَعفي. قاله ابن إسحاق قال: ولا أعلم له رواية، وقد روى أخوه خنيس بن خالد، وروى عن أختهما أم معبد الخزاعية حديثها في وغيره، وهو الصواب. وهو حليف …"
