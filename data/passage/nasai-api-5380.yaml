label: { ar: "سنن النسائي 5380 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 5380 — the father raising and counselling", ur: "سنن نسائی 5380 — باپ کی تربیت اور نصیحت", es: "Sunan al-Nasa'i 5380 — El padre que cría y aconseja", fr: "Sunan al-Nasa'i 5380 — l'éducation et les conseils du père", tr: "Sunan an-Nasa'i 5380 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan an-Nasa'i 5380 — Didikan dan Wasiat Ayah" }
text: "… ظِلُّهُ إِمَامٌ عَادِلٌ وَشَابٌّ نَشَأَ فِي عِبَادَةِ اللَّهِ عَزَّ وَجَلَّ وَرَجُلٌ ذَكَرَ اللَّهَ فِي خَلاَءٍ فَفَاضَتْ عَيْنَاهُ وَرَجُلٌ كَانَ قَلْبُهُ مُعَلَّقًا فِي الْمَسْجِدِ وَرَجُلاَنِ تَحَابَّا فِي اللَّهِ عَزَّ وَجَلَّ وَرَجُلٌ دَعَتْهُ امْرَأَةٌ ذَاتُ مَنْصِبٍ وَجَمَالٍ إِلَى نَفْسِهَا فَقَالَ إِنِّي أَخَافُ اللَّهَ عَزَّ وَجَلَّ وَرَجُلٌ تَصَدَّقَ بِصَدَقَةٍ فَأَخْفَاهَا حَتَّى لاَ تَعْلَمَ شِمَالُهُ مَا صَنَعَتْ يَمِينُهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5380، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5380 (The Book of the Etiquette of Judges), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5380، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5380 (El Libro de la Etiqueta de los Jueces), menciona la crianza y el consejo paternos. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5380 (Le Livre de l'Éthique des Juges), mentionne le rôle du père dans l'éducation et les conseils. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 5380 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5380, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini disusun oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
