label: { ar: "الموطأ 1516 — المسور بن رفاعة القرظي عن الزبير بن عبد الرحمن: طلق رفاعة بن سموال امرأته ثلاثا فنكحت عبد الرحمن بن الزبير، فلم يمسها، فأراد رفاعة نكاحها، فنهاه النبي حتى تذوق العسيلة", en: "Muwatta 1516" }
text: "لا تَحلُّ لَكَ حَتَّى تَذُوقَ الْعُسَيْلةَ"
summary:
  ar: "يروي يحيى عن مالك عن المسور بن رفاعة القرظي عن الزبير بن عبد الرحمن بن الزبير أن رفاعة بن سموال طلق امرأته تميمة بنت وهب في عهد رسول الله ثلاثا، فنكحت عبد الرحمن بن الزبير، فاعترض عنها فلم يستطع أن يمسها، ففارقها، فأراد رفاعة أن ينكحها، وهو زوجها الأول، فذكر ذلك لرسول الله، فنهاه عن تزويجها، وقال لا تحل لك حتى تذوق العسيلة. ويذكر المحقق أن ابن عبد البر قال إنه مرسل في رواية يحيى، وأن أكثر رواة الموطأ تابعوه، إلا ابن وهب. {cite:muwatta-maruf-1997 p.36}"
