label: { ar: "الموطأ 1516 — المسور بن رفاعة القرظي عن الزبير بن عبد الرحمن: طلق رفاعة بن سموال امرأته ثلاثا فنكحت عبد الرحمن بن الزبير، فلم يمسها، فأراد رفاعة نكاحها، فنهاه النبي حتى تذوق العسيلة", en: "Muwatta 1516", es: "Muwatta 1516", fr: "Muwatta 1516", ur: "موطا 1516", tr: "El-Muvatta 1516 — El-Miswar ibn Rifa’ah el-Kurazi, el-Zubayr ibn Abd el-Rahman'dan rivayetle: Rifa’ah ibn Samwal karısını üç kez boşadı, bu yüzden karısı Abd el-Rahman ibn el-Zubayr ile evlendi, ancak evliliği tamamlamadı. Bunun üzerine Rifa’ah onunla evlenmek istedi, ancak Peygamber ona balın tadına bakana kadar evlenmesini yasakladı.", id: "Al-Muwatta 1516 — Al-Miswar ibn Rifa’ah al-Qurazi, berdasarkan riwayat al-Zubayr ibn Abd al-Rahman: Rifa’ah ibn Samwal menceraikan istrinya tiga kali, lalu ia menikah dengan Abd al-Rahman ibn al-Zubayr, tetapi ia tidak melakukan hubungan suami istri. Rifa’ah kemudian ingin menikahinya, tetapi Nabi melarangnya sampai ia mencicipi madu." }
text: "لا تَحلُّ لَكَ حَتَّى تَذُوقَ الْعُسَيْلةَ"
summary:
  ar: "يروي يحيى عن مالك عن المسور بن رفاعة القرظي عن الزبير بن عبد الرحمن بن الزبير أن رفاعة بن سموال طلق امرأته تميمة بنت وهب في عهد رسول الله ثلاثا، فنكحت عبد الرحمن بن الزبير، فاعترض عنها فلم يستطع أن يمسها، ففارقها، فأراد رفاعة أن ينكحها، وهو زوجها الأول، فذكر ذلك لرسول الله، فنهاه عن تزويجها، وقال لا تحل لك حتى تذوق العسيلة. ويذكر المحقق أن ابن عبد البر قال إنه مرسل في رواية يحيى، وأن أكثر رواة الموطأ تابعوه، إلا ابن وهب. {cite:muwatta-maruf-1997 p.36}"
  tr: "Yahya, Malik'ten, o da el-Miswar ibn Rifa'ah el-Kurazi'den, o da el-Zubayr ibn 'Abd al-Rahman ibn al-Zubayr'dan rivayet eder ki, Rifa'ah ibn Samwal, Allah Resulü zamanında karısı Tamimah bint Wahb'ı üç kez boşamıştır. Daha sonra Tamimah, 'Abd al-Rahman ibn al-Zubayr ile evlenmiş, ancak o evliliği tamamlayamayınca onu boşamıştır. Tamimah'ın ilk kocası Rifa'ah, onunla tekrar evlenmek istemiş ve bunu Allah Resulü'ne bildirmiştir. Allah Resulü de ona Tamimah ile evlenmesini yasaklamış ve \"Onunla cinsel birleşmenin tadını tatmadıkça, o sana helal değildir\" demiştir. Araştırmacı, İbn Abdülbarr'ın bu rivayetin Yahya'nın versiyonunda mursal (rivayet zincirinde eksik bir halka bulunan) olduğunu ve İbn Vahb hariç el-Muvatta'nın ravilerinin çoğunun onu takip ettiğini söylediğini belirtiyor. {cite:muwatta-maruf-1997 s.36}"
  id: "Yahya meriwayatkan dari Malik, dari al-Miswar ibn Rifa'ah al-Qurazi, dari al-Zubayr ibn 'Abd al-Rahman ibn al-Zubayr, bahwa Rifa'ah ibn Samwal menceraikan istrinya, Tamimah bint Wahb, tiga kali pada masa Rasulullah. Kemudian ia menikah dengan 'Abd al-Rahman ibn al-Zubayr, tetapi 'Abd al-Rahman ibn al-Zubayr tidak mampu melakukan hubungan suami istri dan kemudian menceraikannya. Rifa'ah, suami pertamanya, ingin menikahinya kembali. Ia menyampaikan hal ini kepada Rasulullah, yang kemudian melarangnya menikahi Tamimah, seraya berkata, \"Ia belum halal bagimu sampai engkau merasakan manisnya hubungan intim.\" Peneliti menyebutkan bahwa Ibnu 'Abd al-Barr mengatakan bahwa riwayat ini mursal (riwayat dengan mata rantai transmisi yang hilang) dalam versi Yahya, dan bahwa sebagian besar perawi al-Muwatta' mengikutinya, kecuali Ibnu Wahb. {cite:muwatta-maruf-1997 p.36}"
