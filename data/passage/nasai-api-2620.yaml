label: { ar: "سنن النسائي 2620 — ما كُتب على المؤمنين، «لو قلت نعم لوجبت»", en: "Sunan al-Nasa'i 2620 — what was prescribed for the believers; 'had I said yes, it would have become obligatory'", ur: "سنن نسائی 2620 — جو مومنوں پر لکھ دیا گیا، «اگر میں ہاں کہہ دیتا تو واجب ہو جاتا»", fr: "Sunan al-Nasa'i 2620 — ce qui a été prescrit aux croyants ; « si j'avais dit oui, cela serait devenu obligatoire »", es: "Sunan al-Nasa'i 2620 — lo que se prescribió a los creyentes; «si hubiera dicho que sí, se habría hecho obligatorio»" }
text: "… حَدَّثَنِي عَبْدُ الْجَلِيلِ بْنُ حُمَيْدٍ، عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي سِنَانٍ الدُّؤَلِيِّ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ قَامَ فَقَالَ \" إِنَّ اللَّهَ تَعَالَى كَتَبَ عَلَيْكُمُ الْحَجَّ \". فَقَالَ الأَقْرَعُ بْنُ حَابِسٍ التَّمِيمِيُّ كُلُّ عَامٍ يَا رَسُولَ اللَّهِ فَسَكَتَ فَقَالَ \" لَوْ قُلْتُ نَعَمْ لَوَجَبَتْ ثُمَّ إِذًا لاَ تَسْمَعُونَ وَلاَ تُطِيعُونَ وَلَكِنَّهُ حَجَّةٌ وَاحِدَةٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2620، يرد فيه ذكر ما كُتب على المؤمنين، و«لو قلت نعم لوجبت». يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 2620 (The Book of Hajj), whose wording mentions what was prescribed for the believers, 'had I said yes, it would have become obligatory'. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 2620، جس کے الفاظ میں جو مومنوں پر لکھ دیا گیا، «اگر میں ہاں کہہ دیتا تو واجب ہو جاتا» کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 2620, dont le texte mentionne ce qui a été prescrit aux croyants, « si j'avais dit oui, cela serait devenu obligatoire ». Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 2620, cuyo texto menciona lo que se prescribió a los creyentes, «si hubiera dicho que sí, se habría hecho obligatorio». El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
