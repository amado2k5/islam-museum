  tr: "Kandahlevi'nin \"Hayat al-Sahaba\" (Sahabelerin Hayatları) adlı eserinin Resimli 1. Cildinin 66. sayfasından bir alıntı, Müslüman olmayan milletleri, dinleri ve halkları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlandırılmıştır. \"Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar\" tarayıcısı tarafından derlenmiştir."
