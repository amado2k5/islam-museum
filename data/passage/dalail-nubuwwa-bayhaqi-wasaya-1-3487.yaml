text: "… ننغل سيفه ذا الفقار يوم بدر.......... توشك الأمم أن تداعي عليكم توفي حين اشتد الضحى توفي على صدر عائشة توفي على صدر عائشة في يومها توفي لاثنتي عشرة ليلة مضت توفي ودرعه مرهونة بثلاثين صاعاً توفي وهو ابن خمس وستين …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3487، يذكر ما خلّفه من تركة وميراث، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 3487, that mentions what was left behind: estate and inheritance, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 3487 کا اقتباس جس میں ترکہ اور میراث، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 3487, que menciona lo que quedó: patrimonio y herencia, una reliquia conservada tras su propietario; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Dala'il al-Nubuwwa d'al-Bayhaqi, volume 1, page 3487, mentionnant ce qui fut laissé: biens et héritage, relique conservée après le décès de son propriétaire. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Testaments Browser."
  tr: "El-Beyhakî'nin \"Dala'il al-Nubuwwah\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 3487. sayfasından bir alıntı, Peygamberin mal varlığını, mirasını ve korunmuş bazı kutsal emanetlerini anlatmaktadır; bu alıntı, makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi \"Dala'il al-Nubuwwah\" (Bukti Kenabian), Jilid 1, halaman 3487, menyebutkan harta dan warisannya, serta beberapa peninggalan yang terpelihara; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, peninggalan, dan makam suci."
