label: { ar: "موطأ مالك 334 — ما فُرض على الناس", en: "Muwatta Malik 334 — what was made obligatory on people", ur: "موطأ مالک 334 — جو لوگوں پر فرض کیا گیا", fr: "Muwatta de Malik 334 — ce qui a été imposé aux gens", es: "Muwatta de Malik 334 — lo que se impuso a la gente", tr: "Muwatta Malik 334 — İnsanlar üzerine farz olan şeyler", id: "Muwatta Malik 334 — Apa yang wajib dilakukan oleh manusia" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ صَالِحِ بْنِ كَيْسَانَ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنْ عَائِشَةَ، زَوْجِ النَّبِيِّ أَنَّهَا قَالَتْ فُرِضَتِ الصَّلاَةُ رَكْعَتَيْنِ رَكْعَتَيْنِ فِي الْحَضَرِ وَالسَّفَرِ فَأُقِرَّتْ صَلاَةُ السَّفَرِ وَزِيدَ فِي صَلاَةِ الْحَضَرِ."
summary:
  ar: "حديث في موطأ مالك، رقم 334، يرد فيه ذكر ما فُرض على الناس. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 334 (Shortening the Prayer), whose wording mentions what was made obligatory on people. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 334، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 334, dont le texte mentionne ce qui a été imposé aux gens. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 334, cuyo texto menciona lo que se impuso a la gente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 334 numaralı hadis, insanların farz olan şeylerden bahsetmektedir. Farz görevleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları derleyen bu kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle bir araya getirmiştir. Derleyici, metinde yer alanları açıklamış ancak buna dayanarak fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 334, menyebutkan apa yang wajib dilakukan oleh manusia. Penyusun kitab kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
