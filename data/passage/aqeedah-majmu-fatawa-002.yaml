text: "عالما بأن هذا يكون أو لا يكون، كما في قوله: (لتدخلن) ، فإن هذا جواب غير محذوف. والثاني: ما فيه معنى الطلب ، كقوله : والله لأفعلن كذا، أو لا أفعله إن شاء الله، فالصيغة صيغة خبر ضمنها الطلب، ولم"
