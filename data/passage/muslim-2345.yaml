label: { ar: "مسلم 2345 — إثبات خاتم النبوة بين كتفيه", en: "Muslim 2345 — The seal of prophethood between his shoulders", es: "Muslim 2345 — El sello de la profecía entre sus hombros", fr: "Muslim 2345 — Le sceau de la prophétie entre ses épaules", ur: "مسلم 2345 - اس کے کندھوں کے درمیان مہر نبوت", tr: "Müslim 2345 — Omuzları arasında peygamberliğin mührünün delili", id: "Muslim 2345 — Bukti Penutupan Kenabian di antara kedua bahunya" }
text: "قال السائب بن يزيد: ذهبت بي خالتي إلى رسول الله فقالت: يا رسول الله إن ابن أختي وجع، فمسح رأسي ودعا لي بالبركة، ثم توضأ فشربت من وضوئه، ثم قمت خلف ظهره فنظرت إلى الخاتم بين كتفيه مثل زر الحجلة"
summary:
  ar: "رواية السائب بن يزيد في باب إثبات خاتم النبوة وصفته ومحله من جسده من كتاب الفضائل في صحيح مسلم؛ مشاهدة الغلام للخاتم بين الكتفين مثل زر الحجلة — متوافقة مع رواية البخاري."
  tr: "Sahih Müslim'in Faziletler Kitabı'nda yer alan, Peygamberliğin Mührünün ispatı, tanımı ve vücudundaki yeri hakkındaki bölümde, çocuğun mührü omuzları arasında bir gelin odasının düğmesi gibi görmesiyle ilgili Sa'ib bin Yazid'in rivayeti, Buhari'nin rivayetiyle de uyumludur."
  id: "Riwayat Al-Sa'ib bin Yazid dalam bab tentang pembuktian Tanda Kenabian, deskripsinya dan letaknya di tubuhnya, dari Kitab Keutamaan dalam Sahih Muslim; anak laki-laki itu melihat tanda kenabian di antara kedua bahunya seperti kancing kamar pengantin — sesuai dengan riwayat Al-Bukhari."
