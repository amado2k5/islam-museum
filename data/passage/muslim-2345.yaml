label: { ar: "مسلم 2345 — إثبات خاتم النبوة بين كتفيه", en: "Muslim 2345 — The seal of prophethood between his shoulders" }
text: "قال السائب بن يزيد: ذهبت بي خالتي إلى رسول الله فقالت: يا رسول الله إن ابن أختي وجع، فمسح رأسي ودعا لي بالبركة، ثم توضأ فشربت من وضوئه، ثم قمت خلف ظهره فنظرت إلى الخاتم بين كتفيه مثل زر الحجلة"
summary:
  ar: "رواية السائب بن يزيد في باب إثبات خاتم النبوة وصفته ومحله من جسده من كتاب الفضائل في صحيح مسلم؛ مشاهدة الغلام للخاتم بين الكتفين مثل زر الحجلة — متوافقة مع رواية البخاري."
