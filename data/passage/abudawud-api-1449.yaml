label: { ar: "سنن أبي داود 1449 — ما حُرّم", en: "Sunan Abi Dawud 1449 — what was made unlawful", ur: "سنن ابی داؤد 1449 — جو حرام کیا گیا", es: "Sunan Abi Dawud 1449: lo que se declaró ilegal", fr: "Sunan Abi Dawud 1449 — ce qui a été rendu illégal", tr: "Sunan Abi Davud 1449 — Yasak Olan Şeyler", id: "Sunan Abi Dawud 1449 — Apa yang dilarang" }
text: "… سُئِلَ أَىُّ الأَعْمَالِ أَفْضَلُ قَالَ \" طُولُ الْقِيَامِ \". قِيلَ فَأَىُّ الصَّدَقَةِ أَفْضَلُ قَالَ \" جُهْدُ الْمُقِلِّ \". قِيلَ فَأَىُّ الْهِجْرَةِ أَفْضَلُ قَالَ \" مَنْ هَجَرَ مَا حَرَّمَ اللَّهُ عَلَيْهِ \". قِيلَ فَأَىُّ الْجِهَادِ أَفْضَلُ قَالَ \" مَنْ جَاهَدَ الْمُشْرِكِينَ بِمَالِهِ وَنَفْسِهِ \". قِيلَ فَأَىُّ الْقَتْلِ أَشْرَفُ قَالَ \" مَنْ أُهْرِيقَ دَمُهُ وَعُقِرَ جَوَادُهُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1449، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1449 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1449، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1449 (Oración (Kitab Al-Salat): Instrucciones detalladas sobre el Witr), menciona lo que se ha prohibido. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 1449 (La Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 1449 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" kitabının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1449, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
