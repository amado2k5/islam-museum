text: "حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، قَالَ حَدَّثَنِي ابْنُ وَهْبٍ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي سَالِمُ بْنُ عَبْدِ اللَّهِ، وَحَمْزَةُ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَما ـ قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ عَدْوَى، وَلاَ طِيَرَةَ، إِنَّمَا الشُّؤْمُ فِي ثَلاَثٍ فِي الْفَرَسِ، وَالْمَرْأَةِ، وَالدَّارِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5772، يذكر العدوى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5772 (Medicine), that mentions contagion. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5772، جس میں چھوت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
