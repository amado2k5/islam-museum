label: { ar: "صحيح البخاري 3633 — الأب والأبوة", en: "Sahih al-Bukhari 3633 — the father and fatherhood", ur: "صحیح بخاری 3633 — باپ اور والدیت", es: "Sahih al-Bukhari 3633 — El padre y la paternidad", fr: "Sahih al-Bukhari 3633 — Le père et la paternité" }
text: "حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ شَيْبَةَ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ الْمُغِيرَةِ، عَنْ أَبِيهِ، عَنْ مُوسَى بْنِ عُقْبَةَ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ عَبْدِ اللَّهِ ـ أَنَّ رَسُولَ اللَّهِ قَالَ \" رَأَيْتُ النَّاسَ مُجْتَمِعِينَ فِي صَعِيدٍ، فَقَامَ أَبُو بَكْرٍ فَنَزَعَ ذَنُوبًا أَوْ ذَنُوبَيْنِ، وَفِي بَعْضِ نَزْعِهِ ضَعْفٌ، وَاللَّهُ يَغْفِرُ لَهُ، ثُمَّ أَخَذَهَا عُمَرُ، فَاسْتَحَالَتْ بِيَدِهِ غَرْبًا، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3633، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3633 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3633، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3633 (Virtudes y méritos del Profeta y sus compañeros), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3633 (Vertus et mérites du Prophète et de ses Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
