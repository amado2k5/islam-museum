text: |-
  يَتوعوافة بطن من سعد بى زيد
  منّاة منهسم الزفيان أبو المرقال
  عطية برأسيد الراجز إه
  قاموص من باب الفاV
  القشعريرة بضم القاف وقتح
  الشين اه مختار
  قوله يعنى الاعناق
  قلت قال الهردى ان ابن عباس
  رضى اللّٰه عنهما فسره بأعضاق
  الابل وقال الزءشرى فسرت
  هذه الة-راءة بأعناق الأبل
  وبأعناق الخيل اه مختاد
  ٢٨٨
  ⁦(قصر)⁩
  فابعث عليهم سنة قاشوره * تحتلق المال ا-تلاق النوره
  وقشير أبوقبيلة وهو قشير بن كعب بن ربيعة بن عامر بن صعصعة بن معاوية بن بكربن هوازن
  وقوله-م أشأم من قاشره واسم فحل كان لبنى عوافسة بن سعد ين زيد بن هناة بن تمسيم وكانت
  لقومه ابل تذكر فاستطرقوه رجاء أن تؤنت ابلهم فماتت الامهات والنسل ⁦(قشبر)⁩ القشبار
  من العصوالخشئة قال الراجز
  لا يلتوى من الوبيل القشيار * وان تهرّاه به العبد الهار
  شعر اقتعرّ جلد الانسان اقشعرارافهو مقشعر والجمع قشاءر فتهذف الميم لانها
  زائدة يقال أخذته قشعريرة (قصر القصرواحد القصور وقصر الظلام اختلاطه وكذلك
  المقصرة والجمع المقاصر عن أبى عبيد وأنشدلا بن مقبل يصف ناقته
  فبعثتها تقص المقاصر بعدما * كربت حياة النار للمثنوّر
  وقدقصر العشى يقصر قصورا اذا أمسيت قال التجاج حتى اذا ماقصر العشى
  ويقال أتيته قصرا أى عشيا وقال
  كأنهم قصر امصابيح راهب • بموزن روى بالسلبط ذبالها
  وقوله-م قصرك أن تفعل ذاأ وقصار ال أن تفعل ذاك بالضم وقصارال أن تفعل ذاكّ بالفتح
  أى غايتك وآخر أمرك وما اقتصرت علميه قال الشاعر
  انما أنفسناعارية * والعوارى قصارى أن تردّ
  ورضى فلان بمصرمما كان يحاول بكسر الصاد أى يدون ما كان يطاب ويقال هو ابن عمه
  قصرة بالضم ومقصورة أيضا أى دنيا والقصرى والقصيرى الضلع التى تلى الشاكلة وهى
  الواهنة فى أسفل الاضلاع والقصيرى أيضا أفعى والقوصرة بالتشديد هذا الذى يكنز فيه التمر
  من البوارى قال الراجز أفلح من كانت له قوصرّه * يأكل منها كل يوم مره
  وقد يخفف والقصرة بالتحرين أصل العنق والجمع قصروبه قرأ ابن عباس رضى اللّٰه عنمما إنها
  ترمى بشرر كالقصر وفسره بتصر التخل يعى الاعفاق والقصارة بالضم مايقى فى السنبل من
  الحب بعدما يداس وكذلك القصرى بالكسروه ومنسوب والقصر أيضاداء يأخذ فى القصرة.
  يقال قصر البعير بالكسر يقصر قصرا قال ابن السكيت هو داء يصيبه فى عنقه فيلتوى
  فيكوى فى مفاصل عنقه فربمابرأ وقصر الرجل أيضااذا اشتكى ذلكْ وقصرت الشى بل أفتح
  أقصره قصراجبسته ومنه مقصورة الجامع وقصرناءن قصر العشى أى أمسينا وقصرت
  السترأ رخيته وقصرت عن الشىء قصوراعجزت عنه ولم أبلغه يقال قصر السهم عن الهدف
  وقصر الشئ بالضم يقصر قصر اخلاف طال وقصرت من الصلاة بالفتح أقصر قصر اوقصرت
  الشى على كذا اذا لم تجاوزيه الى غيره بقال قصرت اللقسة على فرمى اذا جعات درّهاله
  وامرأة قاصرة الطرف لا تمده الى غير بعلها وماء قاصر أى بارد وقصرت الثوب أقصره قصر
  دققته وضنه مهى القصار وقصرت الثوب تقصير امثله والتقصير من الصلاة ومن الشعر مثل
  القصر والتقصيرفى الاهر التوانى فيه والقصير خلاف الطويل والجع قصار والاقاصرجع
  أقصر مثل أصغر وأصاغر وأنشد الاخفش واصلال الرجال أقاصره وأماقولهم
  فى المثل
