label: { ar: "الموطأ 1483 — مالك: الأمر الذي لا اختلاف فيه أن المتوارثين إذا هلكا بغرق أو قتل أو موت، ولم يعلم أيهما مات قبل صاحبه، لم يرث أحدهما من صاحبه", en: "Muwatta 1483" }
summary:
  ar: "يقول مالك وذلك الأمر الذي لا اختلاف فيه ولا شك عند أحد من أهل العلم ببلدهم. وكذلك العمل في كل متوارثين هلكا بغرق أو قتل أو غير ذلك من الموت، إذا لم يعلم أيهما مات قبل صاحبه، فلا يرث أحدهما من صاحبه شيئا، ويكون ميراثهما لمن بقي من ورثتهما. {cite:muwatta-maruf-1997 p.25}"
