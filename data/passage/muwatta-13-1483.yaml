label: { ar: "الموطأ 1483 — مالك: الأمر الذي لا اختلاف فيه أن المتوارثين إذا هلكا بغرق أو قتل أو موت، ولم يعلم أيهما مات قبل صاحبه، لم يرث أحدهما من صاحبه", en: "Muwatta 1483", es: "Muwatta 1483", fr: "Muwatta 1483", ur: "موطا 1483", tr: "El-Muvatta 1483 — Malik: İki mirasçıdan hangisinin önce öldüğü bilinmediği halde boğulma, cinayet veya ölüm yoluyla ölürse, hiçbirinin diğerinden miras alamayacağı konusunda ihtilaf yoktur.", id: "Al-Muwatta 1483 — Malik: Tidak ada perbedaan pendapat bahwa jika dua ahli waris meninggal karena tenggelam, dibunuh, atau mati, dan tidak diketahui siapa di antara mereka yang meninggal lebih dulu, maka tidak ada yang berhak mewarisi dari yang lain." }
summary:
  ar: "يقول مالك وذلك الأمر الذي لا اختلاف فيه ولا شك عند أحد من أهل العلم ببلدهم. وكذلك العمل في كل متوارثين هلكا بغرق أو قتل أو غير ذلك من الموت، إذا لم يعلم أيهما مات قبل صاحبه، فلا يرث أحدهما من صاحبه شيئا، ويكون ميراثهما لمن بقي من ورثتهما. {cite:muwatta-maruf-1997 p.25}"
  tr: "Malik, bu konuda kendi ülkelerindeki âlimler arasında hiçbir ihtilaf veya şüphe bulunmadığını söylüyor. Benzer şekilde, boğulma, cinayet veya başka bir ölüm şekliyle ölen iki mirasçıdan hangisinin önce öldüğü bilinmiyorsa, aynı prosedür uygulanır. Böyle bir durumda, hiçbiri diğerinden hiçbir şey miras almaz ve mirasları kalan mirasçılarına geçer. {cite:muwatta-maruf-1997 s.25}"
  id: "Malik mengatakan bahwa ini adalah masalah yang tidak menimbulkan perselisihan atau keraguan di antara para ulama di negeri mereka. Demikian pula, prosedur ini berlaku untuk dua ahli waris yang meninggal karena tenggelam, pembunuhan, atau sebab kematian lainnya, jika tidak diketahui siapa di antara mereka yang meninggal terlebih dahulu. Dalam kasus seperti itu, tidak ada yang mewarisi apa pun dari yang lain, dan warisan mereka diberikan kepada ahli waris mereka yang tersisa. {cite:muwatta-maruf-1997 p.25}"
