label: { ar: "الموطأ 2744 — أبو إدريس الخولاني: معاذ بن جبل في مسجد دمشق يقول إنه يحبه لله", en: "Muwatta 2744" }
summary:
  ar: "يروي مالك عن أبي حازم بن دينار عن أبي إدريس الخولاني أنه قال: دخلت مسجد دمشق، فإذا فتى شاب براق الثنايا، والناس معه إذا اختلفوا في شيء أسندوا إليه وصدروا عن قوله، فسألت عنه، فقيل: هذا معاذ بن جبل. فلما كان الغد هجّرت فوجدته قد سبقني بالتهجير وهو يصلي. فانتظرته حتى قضى صلاته، ثم جئته فسلمت عليه، وقلت: والله إني لأحبك لله. فقال: لله؟ قلت: لله. فأخذ بحبوة ردائي فجبذني إليه، وقال: أبشر، فإني سمعت رسول الله يقول: قال الله تبارك وتعالى: وجبت محبتي للمتحابين فيّ، والمتجالسين فيّ، والمتزاورين فيّ، والمتباذلين فيّ. {cite:muwatta-maruf-1997 p.544}"
