label: { ar: "الموطأ 2744 — أبو إدريس الخولاني: معاذ بن جبل في مسجد دمشق يقول إنه يحبه لله", en: "Muwatta 2744", es: "Muwatta 2744", fr: "Muwatta 2744", ur: "موطا 2744", tr: "El-Muvatta 2744 — Ebu İdris el-Havlani: Şam mescidinde Mu'az ibn Cebel, onu Allah rızası için sevdiğini söylüyor.", id: "Al-Muwatta 2744 — Abu Idris al-Khawlani: Mu'adh ibn Jabal di masjid Damaskus mengatakan bahwa dia mencintainya karena Allah." }
text: "قال الله تبارك وتعالى وجبت محبتي للمتحابين في والمتجالسين في والمتزاورين في والمتباذلين في …"
summary:
  ar: "يروي مالك عن أبي حازم بن دينار عن أبي إدريس الخولاني أنه قال: دخلت مسجد دمشق، فإذا فتى شاب براق الثنايا، والناس معه إذا اختلفوا في شيء أسندوا إليه وصدروا عن قوله، فسألت عنه، فقيل: هذا معاذ بن جبل. فلما كان الغد هجّرت فوجدته قد سبقني بالتهجير وهو يصلي. فانتظرته حتى قضى صلاته، ثم جئته فسلمت عليه، وقلت: والله إني لأحبك لله. فقال: لله؟ قلت: لله. فأخذ بحبوة ردائي فجبذني إليه، وقال: أبشر، فإني سمعت رسول الله يقول: قال الله تبارك وتعالى: وجبت محبتي للمتحابين فيّ، والمتجالسين فيّ، والمتزاورين فيّ، والمتباذلين فيّ. {cite:muwatta-maruf-1997 p.544}"
  tr: "Malik, Ebu Hazim ibn Dinar'dan, o da Ebu İdris el-Hawlani'den rivayet ettiğine göre şöyle demiştir: Şam mescidine girdim ve orada dişleri ışıl ışıl parlayan genç bir adam vardı. İnsanlar bir konuda anlaşmazlığa düştüklerinde ona danışır ve onun görüşünü kabul ederlerdi. Onun hakkında sordum ve bana: \"Bu Mu'adh ibn Jabal'dır\" denildi. Ertesi gün mescide erken gittim ve onun benden önce gelmiş ve namaz kıldığını gördüm. Namazını bitirmesini bekledim, sonra yanına gittim, selam verdim ve dedim ki: \"Allah'a yemin ederim ki, seni Allah rızası için seviyorum.\" O dedi ki: \"Allah rızası için mi?\" Ben de dedim ki: \"Allah rızası için.\" Elbisemin eteğinden tuttu ve beni kendine doğru çekerek şöyle dedi: \"Sevin, çünkü Allah'ın Resulü'nün şöyle dediğini işittim: Allah, yüce ve mübarek olan, şöyle buyurdu: 'Benim sevgim, birbirlerini benim rızam için sevenlere, benim rızam için bir arada oturanlara, birbirlerini benim rızam için ziyaret edenlere ve birbirlerine benim rızam için verenlere aittir.'\""
  id: "Malik meriwayatkan dari Abu Hazim ibn Dinar, dari Abu Idris al-Khawlani, yang berkata: Aku memasuki masjid Damaskus, dan di sana ada seorang pemuda dengan gigi yang berkilauan. Setiap kali orang-orang berselisih pendapat tentang sesuatu, mereka akan merujuk kepadanya dan menerima pendapatnya. Aku bertanya tentangnya, dan dikatakan: Ini adalah Mu'adh ibn Jabal. Keesokan harinya, aku pergi pagi-pagi ke masjid dan mendapati bahwa dia telah tiba sebelumku dan sedang shalat. Aku menunggu sampai dia selesai shalat, lalu aku mendatanginya, memberi salam kepadanya, dan berkata: Demi Allah, aku mencintaimu karena Allah. Dia berkata: Karena Allah? Aku berkata: Karena Allah. Dia memegang ujung pakaianku dan menarikku ke arahnya, sambil berkata: Bergembiralah, karena aku telah mendengar Rasulullah SAW bersabda: Allah Yang Maha Berkah dan Maha Tinggi berfirman: Cinta-Ku hanya milik orang-orang yang saling mencintai karena-Ku, yang duduk bersama karena-Ku, yang saling mengunjungi karena-Ku, dan yang saling memberi karena-Ku."
