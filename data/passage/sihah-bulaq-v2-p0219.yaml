text: |-
  ٣٦٨
  من البطن والحقنة مايحة ن به المريض من الادوية وقسداحتقن الرجل والمحقان الذى يحة ن
  بوله فاذايال أ كثرمنه ⁦( حلن)⁩ الحلان الجدى يؤخذ من بطن أمّه وهوفعال لانه مبدل
  من حلام وهدا؟نى قار ابن أحر
  يهدى البهذراع الجدى تسكرمة • اماذ كاوامًا كان حلانا
  فان جعلته من الحلال فهو فعلان والميم ممدل.:ه وقال الاصمعى الحلام والخلان باليم
  والمون صغار الغنم ابن السكيت الذكى ءوالذبيح الذى صلح أن يدبح للفك والحلان
  الجدى الصغير الذى لايصلح للذسك ويقال فى الضبت حلان وفى البربوع جفرة قال أبو عبيدة
  فى الحلان تفسير آخر أن أهل الجاهلية كان أحدهم اذا ولدله جدى حز فى أذنه حزا وقال
  اللهم ان عاش فقنىّ وان مات فذكى فان عاش فهو الذى أرادوان مات قال قد ذ كيته
  بالحزفاستهازأ كا. بذلك ( لزن الجلزون دويبسة تكون فى الرمت بفتح الحاء واللام
  لقن حلقن البسرفه ومحلقن اذابلغ الارطاب ثلثيه ( ن حنة بالفتح اسم
  أمرأة والمهنانة قراد قال الاصمعى أوّة ققامة صغير جسدانم حنانة ثم قرادثم حلة ثم عل
  وطلح والحومانة واحدة الحوامين وهي أما كن غلاظ منقادة ومنه قول زهير
  بجومانة الدرَاج فالمتثلم• حنى الحنيز الشوق وتوقان النفستول منهحن اليه
  يحنّ حنينا فهوحان والحنار الرحة يقالمنه حنّ عليه يحن حنانا ومنه قوله تعالى وحنانا
  من لدنا وذكر: كرمة عن ابن عباس رضي اللّٰه عنهم فى هذه الآية أنه قال ما أدرى ما الحنان
  والحفان بالتشديدذ والرحة ويقال أيضاطر يق حضان أى واضح وأبرق الحفان موضع
  وقوس حنانة تتنّ عند الانباض وقال
  وفى منكى حنانة عودنبعة • تخير هالى سوق مكة بائع
  أى فى سوق مكة بائع وتحنى عليه ترحم والعرب تقول حنانك يارب وحنانيك بارب بمعنى
  وإحد أى رجمتك قال امر ؤالقيس
  وتمنه، إبنوشمجى بن جرم • معيزهم حنانك ذا الحنان
  وقال طرفة أبا منذرأ فنيت فاستبق بعضنا • حنانيك بعض الشرَ أهون من بعض
  وحنين الفاقة صو[يافى نزاعها الى ولدها وحفانة اسم راح فى قول طرفة
  نعانى حنانة طوبالة • تسف يبيسامن العشرق
  وحنة الزجل امر أته قال
  وليلة ذات دحى صريت • ولم يلتنى عن سراهاليت» ولم تصرتى حنة وبيت
  وحفة البعيررغاؤه وماله حانة ولا آنة أى ناقة ولاشاة والمستحن مثله قال الاعشى
  ترى الشيخ منها يحب الاياب • برجف كالشارف المستحن
  وحن على حن بالضم أى صدّويقال أيضاما تحنى شيأ من شرّك أى ما تصرفه عن والحنون
  ريح لها حنين كمنين الابل وقال تدعذههامذ عذعة حنون •غشيت بها منازل مقفرات
  وحنين. وضع يذك وويونت فان قصدت به البلدوالموضع ذكرته وصرفته كقوله تعالى
  ويوم حنين وان قصدت به البلدة والبقعة أنقته ولم نصرفه كما قال الشاعر
  فصيروا
