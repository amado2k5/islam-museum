text: "… قال: أَعْفِنى يا أمير المؤمنين. قال: لتّفعلنّ. قال: أنا الجوج حقود حسود، قال عبد اثملك : ما فى الشيطان شرُ مما ذكرت، قال بعض الحكماء: الحسدُ مِن تَعادِى الطبائع واختلافٍ التركيب وفساد مِزّاحِ البِيْةِ وضَهْفِ عَقْد العقل والحاسدُ طويلُ الحَسّرات."
