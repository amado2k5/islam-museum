label: { ar: "الموطأ 2362 — نافع عن ابن عمر: دبر جاريتين وكان يطؤهما", en: "Muwatta 2362", es: "Muwatta 2362", fr: "Muwatta 2362", ur: "موطا 2362", tr: "El-Muvatta 2362 — İbn Ömer'den rivayetle Nafi': Öldükten sonra iki cariye ile cinsel ilişkiye girdi.", id: "Al-Muwatta 2362 — Nafi’ berdasarkan riwayat Ibnu Umar: Dia bersetubuh dengan dua budak perempuan setelah kematian mereka." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر دبر جاريتين له، فكان يطؤهما وهما مدبرتان. {cite:muwatta-maruf-1997 p.373}"
  tr: "Malik, Nafi’den rivayetle, Abdullah ibn Umar’ın efendilerinin ölümünden sonra özgür bırakılacağına söz verdiği iki cariyesi olduğunu ve bu şart altındayken onlarla cinsel ilişkiye girdiğini anlatır. {cite:muwatta-maruf-1997 s.373}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar mempunyai dua budak perempuan yang telah dijanjikan kebebasan setelah kematian tuannya, dan ia melakukan hubungan seksual dengan mereka selagi mereka masih dalam kondisi tersebut. {cite:muwatta-maruf-1997 p.373}"
