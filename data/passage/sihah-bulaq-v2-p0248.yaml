text: |-
  ٣٣٢
  ومنه قولهم نشم الناس فى عتمان رضنى اله عنه والنشم بالتهريك شجر تتخذمفه القسئ
  والنشم أيضا مثل النمش على القلب يقال منه نشم بالسكسر فهوثورنشم أى فيه نقط بيضن
  ونقط سود قال الاصمفىّ منشم بكسر الشين ا-م امرأة كانت بمكة عطارة وكانت خزاعة
  وجرهم اذا أراد وا اللقتال تطيبوا من طيبها وكانوا اذا فعاواذلك كترت الفتلى فيمابينهم
  فكان يقال أشأم من عطر منشم فصار مثلا قال زهير • تفاتوا ودقوا بينهسم عط رمنشم
  ويقال هوحب البلسان ⁦(تعم)⁩ نظمت اللؤاؤ أكه جعته فى السلك والتنظيم مثله ومنه
  نظمت الشعر ونظسمته والنظام الخيط الذى يتظم به اللؤلو ونظم من لؤلو وهو فى الاصل
  مصدروجاه نائظم من جرادوهو الكثيرو يقال لثلاثة كواكب من الجوزا نظم والانتظام
  الاتساق وطعنه فانتظمه أى اختله والنظامان من الضبة كشيتان منظومتان من جانى
  كايتيه طويلتان وأنظمت الدجاجة اذاص ارفى بطنها بيض ⁦(نعم)⁩ النعمة اليدوالصنيعة
  والمنة وما أنعم به عليك وكذلل النعمى فأن قتحت النون مددت فقلت النعماء والنعيم مسمله
  وفلان واسع النعمة أى واسع المال وقوله-م ان فعلت والدفبها ونعمتمية يدون نعمت
  الحصلة والتياه ثابتة فى الوقف قال ذوالرمة
  "أو حرة عبطل ببها جغرة • دعائم الزور ثعمت بزومق البلد
  وتعم ويئس فعلان ماضيات لا يتصر فان تصر فيسار الافعال لانهما استعد لا إله الى بعق
  الماضى فنعم مدح وينن ذم وفيهسما أربع لغات نعم بفتح أوله وكسرمانيسه ثم تتول نعم فتتبع
  الكسرة السكسرة تم تطرح البكسرة الثانية فتقول نعم بكسر الذون وسكون العيز ولك
  أن تطرح المكسرة من الثانى وتترل الاول مفتوجافة قول نعم الرجل:فتح الذون وسكون العين
  وتقول نعم الرحل زيدونعم المرأة هند وان شئت قلت نعمت ارأة هند فار حل فاعل نم وزيد
  رتفع من وجهين أحدهما أن يكون مبتدأقسدم عليه خبره والثانى أن يكون خبر
  مبتدامحذوف وذلك انك!ماقلت تعم الرجل قيل لل من هو أوة ذرت أنه قيل ك ذلك فقلت
  هوزيدوحذفت هو على عادة العرب في حذف المبتدا والجبر اذاعرف المهذوف هوزيد
  واذا قلب تعم رجلا فقد أنمرت في نعم الرجل بالالف واللام مرفوعا وفسرته بة ولك رحلا
  لان فاعل نعم وبئس لا يححكون الإمعرفة بإلالفي واللام أو ما يضاف الى مافيه الالف واللام
  ويرادبه تعريف الجنس لا تعريق العهد أ ونكرة منصوبة ولا يليم ماعلم ولا غيره ولا يتصل
  بهما الضمير لا تقول نيم زيدولا الزيدون بعموا وان أدخلت على نعم ما قلت تعما يعظكم
  به تجمع بين السا كنين وان شئت حرّكت العين بالكسر وان شنت قتت النون مع كسر
  العين وثقول غلت غسلانعما تكنفو بمامع نعم عن صلته أى نعم ماغسلته والنعم بالضم
  ملاف البوس بقال يوم نعم ويوم بوس والجمع أنعم وأبوس ونعم المشى بالضم نعومة أى صار
  ناعمالبنا وكذلك نعم ينعم مثل حذر يحذ روفيه لغة ثالثة حركبة ينهمانعم يتعم مثل فضل يفضل
  لغة رابعة تعم ينعم بالكسر فيهما وهو شاذ " والتعمة بالفتح التنعيم يقال نعسمه اللّه وباعهق
  راحى أة منعمة ومناعمة بهى وريل منعام أفضال ويقال أتنت أرض قلان في
  أذا وافقته وتقول أنعم اللّٰه عليك مى المعمة وأنعم اللّٰه بالمعل من النعومة وأنعم له أى كال له
  قولد اذاعرف المحذوف هوزيد
  لا موقع لقوله هوزيد وقوله أو
  فككرة منصوية فى عطف ه على
  معرفثئ اه
