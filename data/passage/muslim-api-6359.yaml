label: { ar: "صحيح مسلم 6359 — ماء زمزم", en: "Sahih Muslim 6359 — Zamzam water", ur: "صحیح مسلم 6359 — آبِ زمزم" }
text: "… فَسَمِنْتُ حَتَّى تَكَسَّرَتْ عُكَنُ بَطْنِي وَمَا أَجِدُ عَلَى كَبِدِي سُخْفَةَ جُوعٍ قَالَ \" إِنَّهَا مُبَارَكَةٌ إِنَّهَا طَعَامُ طُعْمٍ \". فَقَالَ أَبُو بَكْرٍ يَا رَسُولَ اللَّهِ ائْذَنْ لِي فِي طَعَامِهِ اللَّيْلَةَ. فَانْطَلَقَ رَسُولُ اللَّهِ وَأَبُو بَكْرٍ وَانْطَلَقْتُ مَعَهُمَا فَفَتَحَ أَبُو بَكْرٍ بَابًا فَجَعَلَ يَقْبِضُ لَنَا مِنْ زَبِيبِ الطَّائِفِ وَكَانَ ذَلِكَ أَوَّلَ طَعَامٍ أَكَلْتُهُ بِهَا ثُمَّ غَبَرْتُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6359، يذكر ماء زمزم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 6359 (The Book of the Merits of the Companions), that mentions Zamzam water. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 6359، جس میں آبِ زمزم کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
