text: "… الحالين مات المعرى فى ربيع الاول من هذه السنة بمعرة النعمان عن ست وثمانين سنة الا أربعة وعشرين يوما. وقدروى اما انه قد انشد على قبره ثمانون مرثية وثاه بها اصعابه ومن قرأ عليه ومال. اليه فقال بعضهم. ان كنت …"
summary:
  ar: "مقطع من المنتظم في تاريخ الملوك والأمم، المجلد المصوَّر 4، ص 530، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Muntazam of Ibn al-Jawzi, scan volume 4, p. 530, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنتظم ابن الجوزی، اسکین جلد 4، ص 530 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam d'Ibn al-Jawzi, volume numérisé 4, p. 530, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen escaneado 4, p. 530, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Kralların ve Milletlerin Tarihindeki Düzenlilik), Resimli Cilt 4, s. 530'dan, vefat eden kişi için yazılmış bir ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgülerin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Yang Teratur dalam Sejarah Raja dan Bangsa-Bangsa), Jilid Bergambar 4, hlm. 530, berisi elegi dan pujian untuk almarhum; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
