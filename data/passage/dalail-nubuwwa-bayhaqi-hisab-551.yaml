text: "… مِنهُ غفَرْتُهُ لهُم ، وَمَا قَدَّمُوا لآخِرتهم مِن شيْءٍ طيّبةً به أَنفُسهم عَجِّلْتُهُ لهُمْ أضْعَافًا مُضَاعَفَةٌ ، وَلَهُمْ في المَدْخُور عِندِي أَضْعافاً مُضَاعَفَةً وأفضلَ مِنْ ذلك ، وَأعطَيْتُهُمْ ، عَلَى المَصَائِبِ في البَلَايَا إذا صَبَرُوا وَقَالُوا : إنَّا لِلّهِ وإنَّا …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 551، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 551, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 551 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
