text: "… - النهي عن الخمر. أهل الصُفَّة الأذان. المنافقون من الخزرج المنافقون من الأوس سجد الضرار. أسماء عظماء اليهود غزوات الرسول لَلالذة غزوة بدر القتال شهداء بدر. قتلى المشركين ببدر أسرى المشركين ببدر أبيات في قتلى بدر غزوة بني قينقاع غزوة …"
