label: { ar: "صحيح مسلم 3410 — ما أُحل، ما حُرّم", en: "Sahih Muslim 3410 — what was made lawful; what was made unlawful", ur: "صحیح مسلم 3410 — جو حلال کیا گیا، جو حرام کیا گیا", es: "Sahih Muslim 3410 — lo que se hizo lícito; lo que se hizo ilícito", fr: "Sahih Muslim 3410 — ce qui a été déclaré licite; ce qui a été déclaré illicite" }
text: "… عَنْ إِسْمَاعِيلَ، عَنْ قَيْسٍ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ، يَقُولُ كُنَّا نَغْزُو مَعَ رَسُولِ اللَّهِ لَيْسَ لَنَا نِسَاءٌ فَقُلْنَا أَلاَ نَسْتَخْصِي فَنَهَانَا عَنْ ذَلِكَ ثُمَّ رَخَّصَ لَنَا أَنْ نَنْكِحَ الْمَرْأَةَ بِالثَّوْبِ إِلَى أَجَلٍ ثُمَّ قَرَأَ عَبْدُ اللَّهِ { يَا أَيُّهَا الَّذِينَ آمَنُوا لاَ تُحَرِّمُوا طَيِّبَاتِ مَا أَحَلَّ اللَّهُ لَكُمْ وَلاَ تَعْتَدُوا إِنَّ اللَّهَ لاَ يُحِبُّ الْمُعْتَدِينَ}."
summary:
  ar: "حديث في صحيح مسلم، رقم 3410، يذكر ما أُحل، وما حُرّم، والطيبات، والرخصة. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3410 (The Book of Marriage), that mentions what was made lawful, what was made unlawful, the good things, the concession. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3410، جس میں جو حلال کیا گیا، جو حرام کیا گیا، پاکیزہ چیزیں، رخصت کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.° 3410 (El Libro del Matrimonio), menciona lo que es lícito, lo que es ilícito, las buenas acciones y las concesiones. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3410 (Le Livre du Mariage), mentionne ce qui est licite, ce qui est illicite, les bonnes choses et les concessions. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
