  مونتة وابهع الاباهيم والبهيمة واحدة البهائم وهذا فرس بهيم وهذه فرس بهيم أى مصمت
  وهو الذى لا يخلط لونه شي سوى لونه والجمع بهم مثل رغيف ورغف وبهمى نبت قال سيبويه
