label: { ar: "الموطأ 1120 — هشام بن عروة عن أبيه: صاحب هدي رسول الله قال: يا رسول الله، كيف أصنع بما عطب من الهدي؟ قال: كل بدنة عطبت من الهدي فانحرها، ثم ألق قلادتها في دمها، ثم خل بينها وبين الناس يأكلونها", en: "Muwatta 1120", es: "Muwatta 1120", fr: "Muwatta 1120", ur: "موطا 1120", tr: "El-Muvatta 1120 — Hişam ibn Urve, babasından rivayetle: Allah Resulü'nün kurbanlık hayvanlarının bakıcısı şöyle dedi: Ey Allah Resulü, yaralanan kurbanlık hayvanlarla ne yapmalıyım? Buyurdu ki: Yaralanan her kurbanlık hayvanı kes, sonra tasmasını kanına at, sonra da insanların yemesi için bırak.", id: "Al-Muwatta 1120 — Hisham ibn Urwah, dari ayahnya: Penjaga hewan kurban Rasulullah berkata: Wahai Rasulullah, apa yang harus saya lakukan dengan hewan kurban yang terluka? Beliau menjawab: Setiap hewan kurban yang terluka, sembelihlah, kemudian lemparkan kalungnya ke dalam darahnya, lalu tinggalkan untuk dimakan orang." }
summary:
  ar: "أول حديث في باب العمل في الهدي إذا عطب أو ضل. يرويه مالك عن هشام بن عروة عن أبيه، أن صاحب هدي رسول الله قال: يا رسول الله، كيف أصنع بما عطب من الهدي؟ فقال: كل بدنة عطبت من الهدي فانحرها، ثم ألق قلادتها في دمها، ثم خل بينها وبين الناس يأكلونها. ويذكر المحقق أن الحديث مرسل عند مالك، وأن جماعة من الحفاظ أسندوه عن هشام عن عروة عن ناجية الأسلمي صاحب بدن رسول الله، وأن الترمذي (910) قال: حديث ناجية حسن صحيح. {cite:muwatta-maruf-1997 p.512}"
  tr: "Kurbanlık hayvanların yaralanması veya kaybolması durumunda ne yapılacağına dair bölümün ilk hadisi. Malik, Hişam ibn Urve'den, o da babasından rivayet ettiğine göre, Peygamberin kurbanlık hayvanlarının bakıcısı şöyle demiş: \"Ey Allah'ın Resulü, yaralanan kurbanlık hayvanlarla ne yapmalıyım?\" Peygamber şöyle cevap verdi: \"Yaralanan her kurbanlık hayvanı kesin, sonra tasmasını kanına atın, sonra da insanlara yedirin.\" Araştırmacı, hadisin Malik'e göre mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve bir grup hadis âliminin bunu Hişam'dan, o da Urve'den, o da Peygamberin kurbanlık hayvanlarının bakıcısı Neciye el-Aslami'den rivayet eden bir isnad zinciriyle naklettiğini belirtiyor. Tirmizi (910) şöyle demiştir: \"Neciye'nin hadisi hasen sahihtir (iyi ve sahih).\" {cite:muwatta-maruf-1997 s.512}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang harus dilakukan terhadap hewan kurban jika terluka atau hilang. Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, bahwa penjaga hewan kurban Nabi berkata: \"Wahai Rasulullah, apa yang harus saya lakukan terhadap hewan kurban yang terluka?\" Beliau menjawab: \"Sembelihlah hewan kurban yang terluka, kemudian lemparkan kalungnya ke dalam darahnya, lalu biarkan orang-orang memakannya.\" Peneliti menyebutkan bahwa hadits ini mursal (hadits dengan rantai periwayatan yang hilang) menurut Malik, dan bahwa sekelompok ahli hadits meriwayatkannya dengan rantai periwayatan dari Hisham, dari Urwah, dari Najiyah al-Aslami, penjaga hewan kurban Nabi. At-Tirmidzi (910) berkata: \"Hadits Najiyah hasan sahih (baik dan sahih).\" {mengutip:muwatta-maruf-1997 hal.512}"
