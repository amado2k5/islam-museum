label: { ar: "الموطأ 1120 — هشام بن عروة عن أبيه: صاحب هدي رسول الله قال: يا رسول الله، كيف أصنع بما عطب من الهدي؟ قال: كل بدنة عطبت من الهدي فانحرها، ثم ألق قلادتها في دمها، ثم خل بينها وبين الناس يأكلونها", en: "Muwatta 1120" }
summary:
  ar: "أول حديث في باب العمل في الهدي إذا عطب أو ضل. يرويه مالك عن هشام بن عروة عن أبيه، أن صاحب هدي رسول الله قال: يا رسول الله، كيف أصنع بما عطب من الهدي؟ فقال: كل بدنة عطبت من الهدي فانحرها، ثم ألق قلادتها في دمها، ثم خل بينها وبين الناس يأكلونها. ويذكر المحقق أن الحديث مرسل عند مالك، وأن جماعة من الحفاظ أسندوه عن هشام عن عروة عن ناجية الأسلمي صاحب بدن رسول الله، وأن الترمذي (910) قال: حديث ناجية حسن صحيح. {cite:muwatta-maruf-1997 p.512}"
