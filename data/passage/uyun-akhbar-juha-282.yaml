text: "… عارٍ اذا لم يُكسّ بالنَّشَب ما أضيع المقلّ ان لم يَرْعَ ضيمَتَه وَفرّ، وأى رحَّا دارت بلا قُطُب؟ عِش يَجدَّ ولا يضرُك نَوْلٌ • انما عيشُ من تَرَى بالحدود عِش بجدّ وكن هَبّنَّقَةَ القيسىِّ نَوكا أو خالدّ بن يزيد"
