label: { ar: "سنن ابن ماجه 3338 — الأب والأبوة", en: "Sunan Ibn Majah 3338 — the father and fatherhood", ur: "سنن ابن ماجہ 3338 — باپ اور والدیت" }
text: "حَدَّثَنَا أَبُو عُمَيْرٍ، عِيسَى بْنُ مُحَمَّدِ بْنِ النَّحَّاسِ الرَّمْلِيُّ حَدَّثَنَا ضَمْرَةُ بْنُ رَبِيعَةَ، عَنِ ابْنِ عَطَاءٍ، عَنْ أَبِيهِ، قَالَ زَارَ أَبُو هُرَيْرَةَ قَوْمَهُ بِيُبْنَا فَأَتَوْهُ بِرُقَاقٍ مِنْ رُقَاقِ الأُوَلِ فَبَكَى وَقَالَ مَا رَأَى رَسُولُ اللَّهِ ـ هَذَا بِعَيْنِهِ قَطُّ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3338، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 3338 (Chapters on Food), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3338، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
