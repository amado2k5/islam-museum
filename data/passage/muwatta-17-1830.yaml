summary:
  ar: "قال ابن شهاب: سألت سعيد بن المسيب عن استكراء الأرض بالذهب والورق، فقال: لا بأس بذلك. {cite:muwatta-maruf-1997 p.150}"
  tr: "İbn Şihab şöyle dedi: Sa'id ibn el-Musayyab'a altın ve gümüş karşılığında arazi kiralamak hakkında sordum ve o şöyle dedi: Bunda bir sakınca yok. {cite:muwatta-maruf-1997 s.150}"
  id: "Ibn Shihab berkata: Saya bertanya kepada Sa'id ibn al-Musayyab tentang menyewakan tanah dengan emas dan perak, dan beliau menjawab: Tidak ada yang salah dengan itu. {cite:muwatta-maruf-1997 p.150}"
