text: "استعمله رسول الله وللفه على نجران وهو ابن سبع عشرة سنة(٦)، وكتب له كتابا مشهورا عند أهل العلم في الصدقات والديات. وكان يعلم أهل نجران السنن، ويأخذ منهم الصدقات، وتوفي رسول الله ولالفه و هو عامله على نجران(٧). (١) طبقات"
