label: { ar: "الموطأ 1223 — أبو بكر بن نافع عن أبيه: ابنة أخ لصفية نفست بالمزدلفة، فأمرها ابن عمر أن ترمي الجمرة ولم ير عليها شيئا", en: "Muwatta 1223" }
summary:
  ar: "يروي مالك عن أبي بكر بن نافع عن أبيه أن ابنة أخ لصفية بنت أبي عبيد نفست بالمزدلفة، فتخلفت هي وصفية حتى أتيا منى بعد أن غربت الشمس من يوم النحر، فأمرهما عبد الله بن عمر أن ترميا الجمرة حين أتتا، ولم ير عليهما شيئا. {cite:muwatta-maruf-1997 p.546}"
