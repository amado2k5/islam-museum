label: { ar: "سنن النسائي 2387 — عمل يعدل عملا أعظم منه", en: "Sunan al-Nasa'i 2387 — a deed that equals a greater one", ur: "سنن نسائی 2387 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… كَيْفَ بِمَنْ يَصُومُ يَوْمَيْنِ وَيُفْطِرُ يَوْمًا قَالَ \" أَوَيُطِيقُ ذَلِكَ أَحَدٌ \". قَالَ فَكَيْفَ بِمَنْ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمًا قَالَ \" ذَلِكَ صَوْمُ دَاوُدَ \". قَالَ فَكَيْفَ بِمَنْ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمَيْنِ قَالَ \" وَدِدْتُ أَنِّي أُطِيقُ ذَلِكَ \". قَالَ ثُمَّ قَالَ \" ثَلاَثٌ مِنْ كُلِّ شَهْرٍ وَرَمَضَانُ إِلَى رَمَضَانَ هَذَا صِيَامُ الدَّهْرِ كُلِّهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2387، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2387 (The Book of Fasting), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2387، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
