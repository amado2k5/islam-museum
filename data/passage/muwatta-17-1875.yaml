label: { ar: "الموطأ 1875 — يحيى عن مالك عن نافع عن ابن عمر: لا بأس أن يسلف الرجل في الطعام الموصوف بسعر معلوم إلى أجل مسمى، ما لم يكن في ثمر لم يبد صلاحه", en: "Muwatta 1875", es: "Muwatta 1875", fr: "Muwatta 1875", ur: "موطا 1875", tr: "El-Muvatta 1875 — Yahya, Malik'ten, o da Nafi'den, o da İbn Umar'dan rivayetle: Bir insanın, belli bir fiyata ve belirli bir süre için belirlenmiş bir yiyecek için borç vermesinde bir sakınca yoktur; yeter ki bu, henüz olgunlaşmamış meyve olmasın.", id: "Al-Muwatta 1875 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Nafi’ berdasarkan riwayat Ibn Umar: Tidak ada salahnya seseorang meminjam uang untuk membeli makanan dengan harga yang telah ditentukan untuk jangka waktu tertentu, asalkan bukan buah yang belum matang." }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أنه قال: لا بأس بأن يسلف الرجل الرجل في الطعام الموصوف بسعر معلوم إلى أجل مسمى، ما لم يكن في زرع لم يبد صلاحه، أو تمر لم يبد صلاحه. {cite:muwatta-maruf-1997 p.170}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayetle şöyle buyurduğunu aktarır: Bir kimsenin başka bir kimseye belirli bir süre için, önceden belirlenmiş bir fiyata mal edilmiş yiyecek ödünç vermesinde bir sakınca yoktur; yeter ki bu, henüz olgunlaşmamış ürünler veya henüz olgunlaşmamış hurmalar olmasın. {cite:muwatta-maruf-1997 s.170}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi', dari Abdullah ibn Umar, bahwa beliau berkata: Tidak ada salahnya seseorang meminjamkan makanan kepada orang lain dengan harga yang telah ditentukan untuk jangka waktu tertentu, asalkan bukan hasil panen yang belum matang, atau kurma yang belum matang. {cite:muwatta-maruf-1997 p.170}"
