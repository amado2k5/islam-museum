summary:
  ar: "القسم 1 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطهارة عن رسول الله»، ويضم فيها النصوص من 1 إلى 148 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 1 of Jami' al-Tirmidhi (The Book on Purification) in the division of the open hadith dataset the museum took its reports from: reports 1 to 148 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 1، عنوان «کتاب الطہارۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1 تا 148۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 1 de Jami' al-Tirmidhi (El Libro de la Purificación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1 al 148, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du recueil ouvert Jami' al-Tirmidhi (Livre de la Purification), dans son premier volume (les hadiths 1 à 148 selon la numérotation de ce recueil). Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
