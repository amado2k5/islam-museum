label: { ar: "الموطأ 227 — نافع بن جبير يقرأ خلف الإمام فيما لا يجهر فيه، ومالك يستحبه", en: "Muwatta 227", es: "Muwatta 227", fr: "Muwatta 227", ur: "موطا 227", tr: "El-Muvatta 227 — Nafi' ibn Jubeyr, imamın sesli okumadığı namazlarda imamın arkasında okur ve Malik bunu tavsiye edilen bir uygulama olarak değerlendirir.", id: "Al-Muwatta 227 — Nafi’ ibn Jubayr membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras, dan Malik menganggapnya dianjurkan." }
summary:
  ar: "أثر يرويه مالك عن يزيد بن رومان أن نافع بن جبير بن مطعم كان يقرأ خلف الإمام فيما لا يجهر فيه الإمام بالقراءة؛ ويقول مالك إن ذلك أحب ما سمع إليه في المسألة. وهو في باب القراءة خلف الإمام فيما لا يجهر فيه بالقراءة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.138}"
  tr: "Malik'in Yezid ibn Ruman'dan rivayet ettiği bir hadiste, Nafi' ibn Cübeyr ibn Mut'im'in imamın sesli okumadığı namazlarda imamın arkasından okuduğu belirtilmektedir. Malik, bu konuda duyduğu en tercih edilebilir görüşün bu olduğunu söylemiştir. Bu, imamın sesli okumadığı namazlarda imamın arkasından okuma bölümünde yer almaktadır. Editör, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.138}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yazid ibn Ruman menyatakan bahwa Nafi' ibn Jubayr ibn Mut'im biasa membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras. Malik mengatakan bahwa ini adalah pendapat yang paling baik yang pernah didengarnya mengenai masalah ini. Hal ini terdapat dalam bab tentang membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.138}"
