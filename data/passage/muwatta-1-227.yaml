summary:
  ar: "أثر يرويه مالك عن يزيد بن رومان أن نافع بن جبير بن مطعم كان يقرأ خلف الإمام فيما لا يجهر فيه الإمام بالقراءة؛ ويقول مالك إن ذلك أحب ما سمع إليه في المسألة. وهو في باب القراءة خلف الإمام فيما لا يجهر فيه بالقراءة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.138}"
