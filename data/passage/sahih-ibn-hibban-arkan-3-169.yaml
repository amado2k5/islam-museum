text: "… الرُّخَاميُّ قَالَ: حَدَّثَنَا أَبُو عَامِر العَقَدِيُّ قَالَ: حَدَّثَنَا سُلَيْمَانُ بنُ بِلَال، عَن عبدِ اللَّه بن دِينار، عَن أَبِي صَالِح عن أَبِي هُرَيْرَةَ قَالَ: قَالَ رَسُوْل اللَّه وَلِ: الإِيمانُ بِضْعٌ وَسَبْعُونَ بَاباً وَالْحَيَاءُ مِنَ الإِيمَانِ. راجع الحديث:. - ذكر البيان بأن …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 169، يذكر الإيمان بضع وسبعون شعبة، وما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 169, that mentions faith as seventy-odd branches, what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 169 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 169, que menciona la fe como setenta y tantos pilares, lo que se considera parte de la fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
  fr: "Un extrait du Sahih Ibn Hibban, volume 3, page 169, décrit la foi comme étant composée d'une soixantaine de branches, lesquelles en font partie. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban'ın 3. cildinin 169. sayfasından bir alıntı, yetmişten fazla inanç dalından ve inancın parçası olarak kabul edilen şeylerden bahsetmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, inancın temelleri, inanç dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Volume 3, halaman 169, menyebutkan sekitar tujuh puluh cabang iman dan apa yang dianggap sebagai bagian dari iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
