  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 616, that mentions medicine and the physician, named diseases, the hospital and the medical craft, the drug; from the machine-read scan, quoted within forty words per the sources policy."
