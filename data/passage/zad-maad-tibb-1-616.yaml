text: "الرابعة، وأجوده المائل إلى الحمرة، الخفيف الرقيق الأخلاط المحترقة، وينفعان من الجرب والحِكة، وهو قِشر عرق شجرة، وهو حارٌّ يابس في الدرجة الذي يُشبه الجلد الملفوف، وبالجملة فهو من الأدوية التي أوصى الأطباءُ بترك استعمالها لخطرها، وفرط دراهم. إسهالها. وقوله …"
