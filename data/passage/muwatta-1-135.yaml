label: { ar: "الموطأ 135 — مالك: يتيمم لكل صلاة", en: "Muwatta 135", es: "Muwatta 135", fr: "Muwatta 135", ur: "موطا 135", tr: "El-Muvatta 135 — Malik: Her namaz için teyemmüm yapar.", id: "Al-Muwatta 135 — Malik: Dia melakukan tayammum untuk setiap shalat." }
summary:
  ar: "فتوى لمالك في باب التيمم: سُئل عن رجل تيمم لصلاة حضرت ثم حضرت صلاة أخرى، أيتيمم لها أم يكفيه تيممه الأول؟ فقال: بل يتيمم لكل صلاة، لأن عليه أن يبتغي الماء لكل صلاة، فمن ابتغاه فلم يجده تيمم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.99} {cite:muwatta-maruf-1997 p.100}"
  tr: "Malik'in teyemmüm konusuyla ilgili bir fetvası: Kendisine, bir namaz için teyemmüm yapan bir adamdan bahsedilmiş. Sonra başka bir namaz vakti gelmiş. İkinci namaz için de teyemmüm yapmalı mı, yoksa ilk teyemmümü yeterli mi? Malik şöyle cevap vermiş: Aksine, her namaz için teyemmüm yapmalıdır, çünkü her namaz için su aramakla yükümlüdür. Su arar da bulamazsa teyemmüm yapmalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.99} {cite:muwatta-maruf-1997 s.100}"
  id: "Fatwa Malik tentang tayammum: Beliau ditanya tentang seorang pria yang melakukan tayammum untuk suatu salat, kemudian waktu salat berikutnya tiba. Haruskah ia melakukan tayammum untuk salat kedua, atau tayammum pertamanya sudah cukup? Beliau menjawab: Sebaiknya ia melakukan tayammum untuk setiap salat, karena ia wajib mencari air untuk setiap salat. Jika ia mencari air dan tidak menemukannya, maka ia harus melakukan tayammum. Peneliti menyebutkan bahwa fatwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.99} {cite:muwatta-maruf-1997 p.100}"
