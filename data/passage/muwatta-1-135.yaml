summary:
  ar: "فتوى لمالك في باب التيمم: سُئل عن رجل تيمم لصلاة حضرت ثم حضرت صلاة أخرى، أيتيمم لها أم يكفيه تيممه الأول؟ فقال: بل يتيمم لكل صلاة، لأن عليه أن يبتغي الماء لكل صلاة، فمن ابتغاه فلم يجده تيمم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.99} {cite:muwatta-maruf-1997 p.100}"
