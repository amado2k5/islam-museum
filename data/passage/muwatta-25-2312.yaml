summary:
  ar: "قال مالك: أحسن ما سمع في الرجل يشتري مكاتب رجل أنه لا يبيعه، إذا كان كاتبه بدنانير أو دراهم، إلا بعرض يعجله ولا يؤخره، لأنه إذا أخره صار دينا بدين، وقد نُهي عن بيع الدين بالدين. {cite:muwatta-maruf-1997 p.353} {cite:muwatta-maruf-1997 p.354}"
