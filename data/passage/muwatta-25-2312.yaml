label: { ar: "الموطأ 2312 — مالك: لا يبيع مشتري المكاتب مكاتبه بدين مؤجل", en: "Muwatta 2312", es: "Muwatta 2312", fr: "Muwatta 2312", ur: "موطا 2312", tr: "Al-Muwatta 2312 — Malik: Ofis alıcısı ofislerini krediyle satmaz.", id: "Al-Muwatta 2312 — Malik: Pembeli kantor tidak menjual kantornya secara kredit." }
summary:
  ar: "قال مالك: أحسن ما سمع في الرجل يشتري مكاتب رجل أنه لا يبيعه، إذا كان كاتبه بدنانير أو دراهم، إلا بعرض يعجله ولا يؤخره، لأنه إذا أخره صار دينا بدين، وقد نُهي عن بيع الدين بالدين. {cite:muwatta-maruf-1997 p.353} {cite:muwatta-maruf-1997 p.354}"
  tr: "Malik şöyle dedi: Bir adamın başka bir adamdan köle satın almasıyla ilgili duyduğum en iyi görüş, eğer köle dinar veya dirhem karşılığında satın alınmışsa, derhal ve geciktirilmeden ödenen bir bedel dışında satılmaması gerektiğidir; çünkü geciktirirse, borç karşılığında borç olur ve borç karşılığında borç satmak haramdır. {cite:muwatta-maruf-1997 s.353} {cite:muwatta-maruf-1997 s.354}"
  id: "Malik berkata: Pendapat terbaik yang pernah saya dengar mengenai seorang pria yang membeli budak dari pria lain adalah bahwa ia tidak boleh menjualnya, jika budak itu dibeli dengan dinar atau dirham, kecuali dengan harga yang dibayar segera dan tidak ditunda, karena jika ia menundanya, itu menjadi hutang untuk hutang, dan menjual hutang untuk hutang telah dilarang. {cite:muwatta-maruf-1997 p.353} {cite:muwatta-maruf-1997 p.354}"
