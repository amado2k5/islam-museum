text: |-
  ٤٥٩
  أنّ أصل المشل جناتهابناتها لانّ فاعلا لا يجمع على أفعال وأما الاشهاد والامحاب قاء.
  هما بجع شهد وحب إلا أن يكون هذا من النوادر لانه يجى" فى الامشال مالا يجىء فى غيرها
  وأجنى الشجر أى أدوك عره وأجنت الارض أى كنرجناها وهوالكلاً والمكمأة ونحوذلك
  ( ⁦(جوا)⁩ الجوّة بالضم القعة فى السقاء يقال جوّيت القاءتجوية اذارقعه والجوة
  القطعة من الارض فيها غلظ والجوّة مثل الحوّة وفى لون كالسمرة وصد إالحديد والجواء
  الواسع من الاودية والجواء أيضاموضع بالصمان قال الراحز
  يمع بالماء الجواء معسا * والجواء وانجيا لغسة فى جثاوة القدر عن الاحر والجؤمابين
  السماء والارض قال أبو عمردفى قول طرفة•خلالك الجوّفيضى واصقرى* هوما اتبع
  من الاودية والجواسم بلدوهو المامة يمامة زرقاء والجوى المرقة رشقة الوجد من عشق
  أوحزن تقول منه جوى الرجل بالمكسر فهوجو مثل دو ومنه قيل اللهاء المتغير المنتن جو قال
  عدى بن زيد
  ثم كان المزاج ماسعاب • لاجوآجن ولا معاروق
  والآجن المتغيرأ يضا الا أنه دون الجوى فى النتن ويقال أيضاجو يت نفسى اذالم يوافقك
  البلد واجتويت البلد اذا كرهت المقام به وان كنت فى نعمة ⁦( جها)⁩ جهى البيت بالكسر
  أى خرب فهوجاه وخباء مجه لاسترعليه واست جهوى أى مكشوفة ومن كلامهم الذى
  بضعونه على آلسن البهاثم قالوا يا عنز قد جاء القترقالت ياويلى ذئب ألوى واست جهوى حكاه
  أبو عبيدو كاب الغنم وبيت أجهى بين الجهى أى لاسقف له والسماءجهواه أى مص.
  وأجهت السماء أى انقشع عنم الغيم وأجهينا أى أجهت لنا السهاك لاهما بالالف
  (جيا الجياء وعاء القدروهى الجثاوة وقال تعلب الجية الماء المستنقع فى الموضع غير
  مهموزينقدولا يشقد وقول الاعرابى فى أبى عمر والشيبانى"
  وكان ماجاد لى لاجاد عن سعة • ثلاثة زاتفات ضرب جيات
  يعف من ضرب جىّ وهواسم مدينة أصبهان معرّب
  صل الحاء با احتبى الرجل اذا جمع ظهره وساقيه بعمامته وقد يحتبى
  بيديه والاسم الحبوة واحبوة يقال حسلّ حبوته وحبوته والهع حو مكسور الاوّل عن
  يعقوب ويقال انه لحمابى الشراسيف أى مشرف الجنبين والحبى" السهاب الذى يعترض
  عتراض الجبل قبل أن يطبق السماء قال امر والقيس * فى حبى مكال* والحياءثال
  العصامثله ويقال سحى به لدنوه من الارض وحبا الصت على اسبته حبوا اذازحف قال
  الشاعر
  لولا السفاروبعد خرق مهمه • لتركتها تحبوعلى العرقوب
  وحبوت للخمسين أى دنوت لها وكل دان فهوحاب وحبى الرمل أى أشرف وحبا السهم اذا
  زلج على الارض ثم أصاب الهدف وحباء يحبوه أى أءطاه والحباء العطاء قال الفرزدق
  واليه كان حباءجففة ينقل* وحاييته فى البيمع محاباة قال الاصمعى فلان يحبو ماحوه أى
  بحميه ويمنعه قال ابن أحر
  وراحت الشول ولم يحبها • فحل ولم بعتس فيها مدر
  وكذلك حي ماحوه تحبية ⁦(حتا )⁩ المحمتى على فعيل سويق المقل قال الهذلى
