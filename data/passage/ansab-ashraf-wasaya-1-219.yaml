text: "عامر بن فهيرة - وقال الواقدي: إن بلالا ترب أبي بكر، وتوفي بمدينة دمشق سنة عشرين. ودفن عند باب الصغير، في المقبرة هناك، وهو ابن بضع وستين سنة، وكان رجلا آدم شديد الأدمة، نحيفا طوالا، وكان أحنى، له شعر كثير، …"
summary:
