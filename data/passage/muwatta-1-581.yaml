label: { ar: "الموطأ 581 — بلاغ: ما من داع يدعو إلى هدى إلا كان له مثل أجر من اتبعه", en: "Muwatta 581" }
text: "ما من داع يدعو إلى هدى، إلا كان له مثل أجر من اتبعه، لا ينقص ذلك من أجورهم شيئاً"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن النبي قال: من دعا إلى هدى كان له مثل أجر من اتبعه لا ينقص ذلك من أجورهم شيئاً، ومن دعا إلى ضلالة كان عليه مثل أوزارهم لا ينقص ذلك من أوزارهم شيئاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 24/326) أنه يستند عن النبي من طرق شتى من حديث أبي هريرة وجرير وعمرو بن عوف وحذيفة، ويضيف أن حديث أبي هريرة صحيح عند أحمد ومسلم (8/62) وأبي داود (4609) والترمذي (2674) وابن ماجة (206)، وحديث جرير صحيح عند مسلم (3/86–87) والترمذي (2675) وابن ماجة (203). {cite:muwatta-maruf-1997 p.300}"
