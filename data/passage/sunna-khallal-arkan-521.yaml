text: "… إني لأرجو أن أكون أخشاكم لله. وهذا كثير، وأشباهه على اليقين. قال: ودخل عليه شيخ فسأله عن الإيمان؟ فقال: قول وعمل. فقال له : يزيد؟ فقال: يزيد وينقص. فقال له: أقول: مؤمن إن شاء اللّٰه؟ قال: نعم. فقال له: إنهم …"
