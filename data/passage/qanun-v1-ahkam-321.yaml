text: "… حار، والأسود في الأمرين بالضدّ، فإن البرد يبيّض الرطب ويسوِّد اليابس والحرّ يسوّد الرطب ويبيض اليابس وإن هذا حقّ واجب. ولكن ههنا سبب آخر لأجل ذلك قد تختلف هذه الاستدلالات، وخصوصاً في الرائحة واللون، وذلك أنا قد بيّنا أن الأجسام …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 321، يرد فيه ذكر الواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 321, whose wording mentions the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج1، ص 321 کا اقتباس جس میں واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
