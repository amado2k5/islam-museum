label: { ar: "الموطأ 527 — صلاة في مسجدي هذا خير من ألف صلاة فيما سواه إلا المسجد الحرام", en: "Muwatta 527", es: "Muwatta 527", fr: "Muwatta 527", ur: "موطا 527", tr: "El-Muvatta 527 — Benim camimde kılınan namaz, başka yerlerde kılınan bin namazdan daha hayırlıdır; ancak Mescid-i Haram (Mekke) hariç.", id: "Al-Muwatta 527 — Shalat di masjidku ini lebih baik daripada seribu shalat di tempat lain, kecuali di Masjidil Haram (di Mekah)." }
text: "صلاة في مسجدي هذا خير من ألف صلاة فيما سواه، إلا المسجد الحرام"
summary:
  ar: "أول حديث في باب ما جاء في مسجد النبي. يرويه مالك عن زيد بن رباح وعبيد الله بن أبي عبد الله، كلاهما عن أبي عبد الله الأغر، عن أبي هريرة، أن النبي قال إن الصلاة في مسجده خير من ألف صلاة فيما سواه من المساجد، إلا المسجد الحرام. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن ماجة (1404)، والتنيسي عند البخاري (1190)، وقتيبة ومعن عند الترمذي (325)، وأن نسخة م تسمي الأغر «سلمان الأغر». {cite:muwatta-maruf-1997 p.272}"
  tr: "Peygamber Mescidi hakkında rivayet edilenler bölümündeki ilk hadis. Malik, Zeyd ibn Rabe ve Ubeydullah ibn Ebu Abdülallah'tan, her ikisi de Ebu Abdül Ağar'dan, o da Ebu Hurayra'dan rivayet ettiğine göre, Peygamber şöyle buyurmuştur: \"Onun mescidinde kılınan namaz, Mekke'deki Mescid-i Şerif hariç, başka herhangi bir mescitte kılınan bin namazdan daha faziletlidir.\" Editör, bu hadisin Malik'ten Ebu Musab, onun isnadından İbn Majah (1404), el-Tunisi tarafından Buhari'de (1190), Kuteybe ve Ma'n tarafından Tirmizi'de (325) rivayet edildiğini ve M el yazmasının el-Ağar'ı \"Salman el-Ağar\" olarak adlandırdığını belirtmektedir. {cite:muwatta-maruf-1997 s.272}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang diriwayatkan mengenai Masjid Nabi. Diriwayatkan oleh Malik dari Zaid bin Rabah dan Ubayd Allah bin Abi Abd Allah, keduanya dari Abu Abd Allah al-Aghar, dari Abu Hurayrah, bahwa Nabi bersabda: “Shalat di masjidnya lebih baik daripada seribu shalat di masjid lain mana pun, kecuali Masjidil Haram (di Mekah).” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan dari sanadnya oleh Ibn Majah (1404), dan oleh al-Tunisi dalam al-Bukhari (1190), dan oleh Qutaybah dan Ma'n dalam al-Tirmidhi (325), dan bahwa manuskrip M menyebut al-Aghar sebagai “Salman al-Aghar.” {cite:muwatta-maruf-1997 p.272}"
