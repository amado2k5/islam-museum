label: { ar: "الموطأ 527 — صلاة في مسجدي هذا خير من ألف صلاة فيما سواه إلا المسجد الحرام", en: "Muwatta 527" }
text: "صلاة في مسجدي هذا خير من ألف صلاة فيما سواه، إلا المسجد الحرام"
summary:
  ar: "أول حديث في باب ما جاء في مسجد النبي. يرويه مالك عن زيد بن رباح وعبيد الله بن أبي عبد الله، كلاهما عن أبي عبد الله الأغر، عن أبي هريرة، أن النبي قال إن الصلاة في مسجده خير من ألف صلاة فيما سواه من المساجد، إلا المسجد الحرام. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن ماجة (1404)، والتنيسي عند البخاري (1190)، وقتيبة ومعن عند الترمذي (325)، وأن نسخة م تسمي الأغر «سلمان الأغر». {cite:muwatta-maruf-1997 p.272}"
