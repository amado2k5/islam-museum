text: "… فقال رسول اللّه الْإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِله إلا الله وَأَنَّ مُحَمَّدًا رسولَ اللّٰه ف وَتُقِيمَ الصَّلَاةَ وَتُؤْتِيَ الزَّكَاةَ وَتَصُومَ رَمَضَانَ وَتحجَّ الْبَيْتَ إن اسْتَطَعْتَ إليه سَبِيلًا قال صَدَقْتَ قال فَعَجِبْنَا له يَسْأَله وَيُصَدِّقُهُ قال فَأَخْبِرْنِي عن الْإِيمانِ قال …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 170، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 170, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 170 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 3, pág. 170, que menciona el Islam definido por sus actos, la oración, el zakat, el ayuno y la peregrinación mencionados conjuntamente, el testimonio, la oración y el zakat, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 3, p. 170), qui mentionne l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage (mentionnés ensemble), le témoignage, la prière et la zakat, la question de la foi et sa réponse. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan, 3. cilt, 170. sayfada yer alan bir alıntıda, İslam'ın tanımı ve namaz, zekât, oruç ve Hac gibi uygulamalarının yanı sıra iman ikrarı, namaz ve zekât ile iman hakkındaki soru-cevap da ele alınmaktadır. Bu, makine tarafından okunabilir taranmış versiyondan alınmış olup, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid bergambar 3, halaman 170, menyebutkan definisi Islam dan praktik-praktiknya, termasuk salat, zakat, puasa, dan haji secara keseluruhan, serta pernyataan iman, salat, dan zakat, dan tanya jawab mengenai iman. Ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
