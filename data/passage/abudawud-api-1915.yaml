label: { ar: "سنن أبي داود 1915 — الأب والأبوة", en: "Sunan Abi Dawud 1915 — the father and fatherhood", ur: "سنن ابی داؤد 1915 — باپ اور والدیت", es: "Sunan Abi Dawud 1915 — El padre y la paternidad", fr: "Sunan Abi Dawud 1915 — le père et la paternité", tr: "Sunan Abi Davud 1915 — Baba ve Babalık", id: "Sunan Abi Dawud 1915 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا هَنَّادٌ، عَنِ ابْنِ أَبِي زَائِدَةَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ رَجُلٍ، مِنْ بَنِي ضَمْرَةَ عَنْ أَبِيهِ، أَوْ عَمِّهِ قَالَ رَأَيْتُ رَسُولَ اللَّهِ وَهُوَ عَلَى الْمِنْبَرِ بِعَرَفَةَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1915، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1915 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1915، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1915 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud n° 1915 (Les Rites du Hajj [Kitab Al-Manasik Wa'l-Hajj]) mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1915 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1915, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
