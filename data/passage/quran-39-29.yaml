text: "ضَرَبَ ٱللَّهُ مَثَلًا رَّجُلًا فِيهِ شُرَكَآءُ مُتَشَـٰكِسُونَ وَرَجُلًا سَلَمًا لِّرَجُلٍ هَلْ يَسْتَوِيَانِ مَثَلًا ۚ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ"
text_search: "ضرب الله مثلا رجلا فيه شركاء متشاكسون ورجلا سلما لرجل هل يستويان مثلا ۚ الحمد لله ۚ بل أكثرهم لا يعلمون"
translations:
  en: { text: "Allah coineth a similitude: A man in relation to whom are several part-owners, quarrelling, and a man belonging wholly to one man. Are the two equal in similitude? Praise be to Allah! But most of them know not.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "خدا ایک مثال بیان کرتا ہے کہ ایک شخص ہے جس میں کئی (آدمی) شریک ہیں۔ (مختلف المزاج اور) بدخو اور ایک آدمی خاص ایک شخص کا (غلام) ہے۔ بھلا دونوں کی حالت برابر ہے۔ (نہیں) الحمدلله بلکہ یہ اکثر لوگ نہیں جانتے", translator: "Fateh Muhammad Jalandhari", license: PD }
