text: "… من الحسين بن عثمان اليبرودي وروى عنه أبو يعلى بن الفراء الفقيه الحنبلي وروى الحافظ من طريقه عن أحمد بن جعفر الفارسي الإصطخري قال : قال أبو عبد اللّٰه أحمد بن محمد بن حنبل : القدر خيره وشره، قليله وكثيره، …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 181، يذكر الإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
