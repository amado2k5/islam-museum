text: "إِنَّ ٱلَّذِينَ يُحَآدُّونَ ٱللَّهَ وَرَسُولَهُۥ كُبِتُوا۟ كَمَا كُبِتَ ٱلَّذِينَ مِن قَبْلِهِمْ ۚ وَقَدْ أَنزَلْنَآ ءَايَـٰتٍۭ بَيِّنَـٰتٍ ۚ وَلِلْكَـٰفِرِينَ عَذَابٌ مُّهِينٌ"
text_search: "إن الذين يحادون الله ورسوله كبتوا كما كبت الذين من قبلهم ۚ وقد أنزلنا آيات بينات ۚ وللكافرين عذاب مهين"
translations:
  en: { text: "Lo! those who oppose Allah and His messenger will be abased even as those before them were abased; and We have sent down clear tokens, and for disbelievers is a shameful doom", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "جو لوگ خدا اور اس کے رسول کی مخالفت کرتے ہیں وہ (اسی طرح) ذلیل کئے جائیں گے جس طرح ان سے پہلے لوگ ذلیل کئے گئے تھے اور ہم نے صاف اور صریح آیتیں نازل کردی ہیں۔ جو نہیں مانتے ان کو ذلت کا عذاب ہوگا", translator: "Fateh Muhammad Jalandhari", license: PD }
