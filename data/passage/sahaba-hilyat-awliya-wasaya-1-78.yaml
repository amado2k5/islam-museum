text: "… ما تبكون ؟ أما والله لو عاينوا ما عاين ميتهم، لأذهلتهم معايفتهم عن ميتهم. وإن له فيهم لعودة ثم عودة حق لا يبقى منهم أحداً. ثم قام فقال : أوصيكم عباد اللّٰه بتقوى اللّٰه الذى ضرب لكم الأمثال، ووقت لكم …"
summary:
