text: "… نُحْلَهُ فَأَعْلَنَ ذَلِكَ لَهُ وَأَشْهَدَ عَلَيْهَا فَهِيَ جَائِزَةٌ وَإِنْ وَلِيَهَا أَبُوهُ. قَالَ مَالِكٌ الأَمْرُ عِنْدَنَا أَنَّ مَنْ نَحَلَ ابْنًا لَهُ صَغِيرًا ذَهَبًا أَوْ وَرِقًا ثُمَّ هَلَكَ وَهُوَ يَلِيهِ إِنَّهُ لاَ شَىْءَ لِلاِبْنِ مِنْ ذَلِكَ إِلاَّ أَنْ يَكُونَ الأَبُ عَزَلَهَا بِعَيْنِهَا أَوْ دَفَعَهَا إِلَى رَجُلٍ وَضَعَهَا لاِبْنِهِ عِنْدَ ذَلِكَ الرَّجُلِ فَإِنْ فَعَلَ ذَلِكَ فَهُوَ جَائِزٌ لِلاِبْنِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1463، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1463 (Wills and Testaments), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "موطأ مالک کی حدیث نمبر 1463، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1463 (Testamentos), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
