summary:
  ar: "القسم 11 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النكاح عن رسول الله»، ويضم فيها النصوص من 1080 إلى 1145 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 11 of Jami' al-Tirmidhi (The Book on Marriage) in the division of the open hadith dataset the museum took its reports from: reports 1080 to 1145 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 11، عنوان «کتاب النکاح عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1080 تا 1145۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 11 de Jami' al-Tirmidhi (El Libro del Matrimonio) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1080 al 1145 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 11 de Jami' al-Tirmidhi (Le Livre du Mariage), dans la section du recueil ouvert de hadiths d'où proviennent les récits 1080 à 1145. Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
