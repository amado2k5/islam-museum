text: "… ثمّ سار إلى الجمل مع عليّ، ثمّ شهِدَ صِفِّين. تُوُفِّي بالكوفة، وصلّى عليه عليّ على الصحّيح. وهو أوّل من نِيحَ عليه بالكوفة. وقيل : تُوُفِّي بعد عليّ. القَعْقَاع بن عَمْرو التّميميّ قيل إنّه شهدَ وفاةَ رسولِ الله الله لو وله …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 662، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 662, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 662 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
