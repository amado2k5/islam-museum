label: { ar: "الموطأ 325 — ابن عمر يوتر بمكة ثم يشفع لما انكشف الغيم", en: "Muwatta 325", es: "Muwatta 325", fr: "Muwatta 325", ur: "موطا 325", tr: "El-Muvatta 325 — İbn Ömer, Mekke'de Vitr namazını kıldı, bulutlar dağılınca Şafa namazını kıldı.", id: "Al-Muwatta 325 — Ibnu Umar melaksanakan salat Witir di Mekah, kemudian melaksanakan salat Syafaat setelah awan menghilang." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الأمر بالوتر: كان مع عبد الله بن عمر بمكة والسماء مغيمة، فخشي ابن عمر الصبح فأوتر بواحدة، ثم انكشف الغيم فرأى أن عليه ليلاً فشفع بواحدة، ثم صلى بعد ذلك ركعتين ركعتين، فلما خشي الصبح أوتر بواحدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.183} {cite:muwatta-maruf-1997 p.184}"
  tr: "Malik'in Nafi'den rivayet ettiği, Vitr namazının emri bölümünde yer alan bir rivayet: Abdullah ibn Umar ile Mekke'deydi ve gökyüzü bulutluydu. İbn Umar şafağın yaklaşmasından korktuğu için bir rekat Vitr namazı kıldı. Sonra bulutlar dağıldı ve hâlâ gece olduğunu anladı, bu yüzden bir rekat daha kıldı. Ondan sonra, bir seferde iki rekat namaz kıldı. Şafağın yaklaşmasından korktuğu zaman bir rekat Vitr namazı kıldı. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suwaid ve Muhammed ibn al-Hasan tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.183} {cite:muwatta-maruf-1997 s.184}"
  id: "Sebuah riwayat dari Malik berdasarkan Nafi’, dalam bab tentang perintah shalat Witir: Beliau bersama Abdullah ibn Umar di Mekah, dan langit berawan. Ibn Umar khawatir akan datangnya fajar, maka beliau shalat satu rakaat Witir. Kemudian awan menghilang, dan beliau menyadari bahwa masih malam, maka beliau shalat satu rakaat lagi. Setelah itu, beliau shalat dua rakaat sekaligus. Ketika beliau khawatir akan datangnya fajar, beliau shalat satu rakaat Witir. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.183} {cite:muwatta-maruf-1997 p.184}"
