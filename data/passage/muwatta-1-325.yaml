label: { ar: "الموطأ 325 — ابن عمر يوتر بمكة ثم يشفع لما انكشف الغيم", en: "Muwatta 325" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الأمر بالوتر: كان مع عبد الله بن عمر بمكة والسماء مغيمة، فخشي ابن عمر الصبح فأوتر بواحدة، ثم انكشف الغيم فرأى أن عليه ليلاً فشفع بواحدة، ثم صلى بعد ذلك ركعتين ركعتين، فلما خشي الصبح أوتر بواحدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.183} {cite:muwatta-maruf-1997 p.184}"
