text: "… فحدثني عبد الملك بن عمير، عن عبد الرحمن بن سعيد بن يَربوع، عن عمر بن أبي سلمة، قال : كان الذي جرح أبيْ أبا سلمة : أبو أسامة الجُشَمّي، فمكَثَ شهراً يداويه فبرأ فيما نُرى، وبعثه رسول اللّٰه وتطيخِ في …"
