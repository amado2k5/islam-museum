label:
  ar: "مسلم 1151b — الصوم لي وأنا أجزي به"
  en: "Muslim 1151b — Fasting is Mine, and I reward it"
  ur: "مسلم 1151b — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "قال الله عز وجل كل عمل ابن آدم له إلا الصيام هو لي وأنا أجزي به فوالذي نفس محمد بيده لخلفة فم الصائم أطيب عند الله من ريح المسك ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1151b: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1151b: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1151b: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
