label: { ar: "الموطأ 1096 — مالك: من نسي من طوافه شيئاً أو شك فيه، فلم يذكر إلا وهو يسعى بين الصفا والمروة، فإنه يقطع سعيه، ثم يتم طوافه بالبيت على ما يستيقن، ويركع ركعتي الطواف، ثم يبتدئ سعيه بين الصفا والمروة", en: "Muwatta 1096", es: "Muwatta 1096", fr: "Muwatta 1096", ur: "موطا 1096", tr: "El-Muvatta 1096 — Malik: Eğer bir kimse tavaf sırasında bir şeyi unutursa veya emin değilse ve ancak Safa ile Merve arasında sa'i yaparken hatırlarsa, sa'i yapmayı bırakmalı, emin olduğu kadarıyla tavafını tamamlamalı ve iki rekat tavaf yaptıktan sonra Safa ile Merve arasında sa'i yapmaya başlamalıdır.", id: "Al-Muwatta 1096 — Malik: Jika seseorang lupa sesuatu saat melakukan tawaf atau ragu tentang hal itu, dan baru ingat saat melakukan Sa'i antara Safa dan Marwa, maka ia harus menghentikan Sa'i-nya, kemudian menyelesaikan tawafnya di sekitar Baitullah sesuai dengan apa yang ia yakini, dan melakukan dua rakaat Tawaf, kemudian memulai Sa'i antara Safa dan Marwa." }
summary:
  ar: "قول لمالك: من نسي من طوافه شيئاً أو شك فيه، فلم يذكر إلا وهو يسعى بين الصفا والمروة، فإنه يقطع سعيه، ثم يتم طوافه بالبيت على ما يستيقن، ويركع ركعتي الطواف، ثم يبتدئ سعيه بين الصفا والمروة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1320–1321). {cite:muwatta-maruf-1997 p.502}"
  tr: "Malik şöyle demiştir: Eğer bir kimse tavaf sırasında bir şeyi unutur veya emin olmazsa ve ancak Safa ile Merve arasında sa'i yaparken hatırlarsa, sa'i yapmayı bırakmalı, emin olduğu kadarıyla Kâbe tavafını tamamlamalı, iki rekat tavaf yapmalı ve sonra Safa ile Merve arasında tekrar sa'i yapmaya başlamalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1320-1321) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.502}"
  id: "Malik berkata: Jika seseorang lupa atau ragu tentang sesuatu saat melakukan tawaf, dan baru ingat saat melakukan Sa'i antara Safa dan Marwa, maka mereka harus menghentikan Sa'i mereka, menyelesaikan tawaf di Ka'bah sesuai dengan apa yang mereka yakini, melakukan dua rakaat Tawaf, dan kemudian memulai kembali Sa'i antara Safa dan Marwa. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1320–1321). {cite:muwatta-maruf-1997 p.502}"
