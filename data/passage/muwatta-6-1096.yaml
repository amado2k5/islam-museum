label: { ar: "الموطأ 1096 — مالك: من نسي من طوافه شيئاً أو شك فيه، فلم يذكر إلا وهو يسعى بين الصفا والمروة، فإنه يقطع سعيه، ثم يتم طوافه بالبيت على ما يستيقن، ويركع ركعتي الطواف، ثم يبتدئ سعيه بين الصفا والمروة", en: "Muwatta 1096" }
summary:
  ar: "قول لمالك: من نسي من طوافه شيئاً أو شك فيه، فلم يذكر إلا وهو يسعى بين الصفا والمروة، فإنه يقطع سعيه، ثم يتم طوافه بالبيت على ما يستيقن، ويركع ركعتي الطواف، ثم يبتدئ سعيه بين الصفا والمروة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1320–1321). {cite:muwatta-maruf-1997 p.502}"
