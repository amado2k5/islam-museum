label: { ar: "الموطأ 797 — عطاء بن يسار: رجل قبّل امرأته وهو صائم في رمضان فوجد من ذلك وجداً شديداً، فأرسل امرأته تسأل أم سلمة", en: "Muwatta 797" }
summary:
  ar: "أول حديث في باب ما جاء في الرخصة في القبلة للصائم. يرويه مالك عن زيد بن أسلم عن عطاء بن يسار، أن رجلاً قبّل امرأته وهو صائم في رمضان فوجد من ذلك وجداً شديداً، فأرسل امرأته تسأل أم سلمة زوج النبي، فأخبرتها أم سلمة أن النبي كان يقبّل وهو صائم، فرجعت فأخبرت زوجها فزاده ذلك شراً وقال: لسنا مثل رسول الله، الله يحل لرسوله ما شاء. فرجعت امرأته إلى أم سلمة فوجدت عندها النبي، فقال: ما لهذه المرأة؟ فأخبرته أم سلمة، فقال: ألا أخبرتيها أني أفعل ذلك؟ فقالت: قد أخبرتها، فذهبت إلى زوجها فأخبرته، فزاده ذلك شراً، فغضب النبي وقال: والله إني لأتقاكم لله، وأعلمكم بحدوده. ويذكر المحقق أن الحديث رواه عن مالك أبو مصعب (351) وسويد والشافعي في الرسالة ومحمد بن الحسن الشيباني (352)، وأنه روي عن عبد الرزاق (7412) عن ابن جريج عن زيد بن أسلم. {cite:muwatta-maruf-1997 p.392} {cite:muwatta-maruf-1997 p.394}"
