label: { ar: "الموطأ 797 — عطاء بن يسار: رجل قبّل امرأته وهو صائم في رمضان فوجد من ذلك وجداً شديداً، فأرسل امرأته تسأل أم سلمة", en: "Muwatta 797", es: "Muwatta 797", fr: "Muwatta 797", ur: "موطا 797", tr: "El-Muvatta 797 — Ata’ ibn Yasar: Bir adam Ramazan ayında oruçluyken karısını öptü ve bundan dolayı çok pişman oldu. Bunun üzerine karısını Ümmü Seleme'ye sorması için gönderdi.", id: "Al-Muwatta 797 — Ata’ ibn Yasar: Seorang pria mencium istrinya saat berpuasa di bulan Ramadan dan merasa sangat menyesal karenanya, lalu ia menyuruh istrinya bertanya kepada Umm Salamah." }
summary:
  ar: "أول حديث في باب ما جاء في الرخصة في القبلة للصائم. يرويه مالك عن زيد بن أسلم عن عطاء بن يسار، أن رجلاً قبّل امرأته وهو صائم في رمضان فوجد من ذلك وجداً شديداً، فأرسل امرأته تسأل أم سلمة زوج النبي، فأخبرتها أم سلمة أن النبي كان يقبّل وهو صائم، فرجعت فأخبرت زوجها فزاده ذلك شراً وقال: لسنا مثل رسول الله، الله يحل لرسوله ما شاء. فرجعت امرأته إلى أم سلمة فوجدت عندها النبي، فقال: ما لهذه المرأة؟ فأخبرته أم سلمة، فقال: ألا أخبرتيها أني أفعل ذلك؟ فقالت: قد أخبرتها، فذهبت إلى زوجها فأخبرته، فزاده ذلك شراً، فغضب النبي وقال: والله إني لأتقاكم لله، وأعلمكم بحدوده. ويذكر المحقق أن الحديث رواه عن مالك أبو مصعب (351) وسويد والشافعي في الرسالة ومحمد بن الحسن الشيباني (352)، وأنه روي عن عبد الرزاق (7412) عن ابن جريج عن زيد بن أسلم. {cite:muwatta-maruf-1997 p.392} {cite:muwatta-maruf-1997 p.394}"
  tr: "Oruçluyken öpüşmenin caizliği bölümündeki ilk hadis, Malik'in Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiğine göre, bir adam Ramazan ayında oruçluyken karısını öptü ve bundan dolayı çok pişman oldu. Bunun üzerine karısını Peygamberimizin eşi Ümmü Seleme'ye gönderdi. Ümmü Seleme, Peygamberimizin oruçluyken öpüştüğünü söyledi. Ümmü Seleme geri dönüp kocasına anlattı, bu da kocasının öfkesini daha da artırdı ve \"Biz Allah'ın Resulü gibi değiliz. Allah, Resulüne dilediğini helal kılar\" dedi. Bunun üzerine karısı Ümmü Seleme'nin yanına döndü ve Peygamberimizi onunla birlikte buldu. Ümmü Seleme, \"Bu kadının nesi var?\" diye sordu. Ümmü Seleme olanları anlattı ve Peygamberimiz, \"Neden ona bunu yaptığımı söylemedin?\" dedi. Ümmü Seleme, \"Söyledim\" diye cevap verdi. Bunun üzerine kocasına gidip anlattı, bu da kocasının öfkesini daha da artırdı. Peygamber öfkelenerek, \"Allah'a yemin ederim ki, aranızda Allah'tan en çok korkan ve O'nun sınırlarını en iyi bilen benim.\" dedi. Araştırmacı, hadisin Malik'ten Ebu Mus'ab (351), Suveyd, Şafiî'nin Risalesi'nde ve Muhammed ibn el-Hasan el-Şeybani (352) tarafından rivayet edildiğini ve Abdülrazzak'tan (7412) İbn Cüreyc'ten, Zeyd ibn Aslam'dan rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.392} {cite:muwatta-maruf-1997 s.394}"
  id: "Hadits pertama dalam bab ini adalah tentang kebolehan berciuman saat berpuasa. Diriwayatkan oleh Malik dari Zaid bin Aslam dari Ata bin Yasar, bahwa seorang pria mencium istrinya saat berpuasa di bulan Ramadhan dan merasa sangat menyesal. Maka ia menyuruh istrinya untuk bertanya kepada Umm Salamah, istri Nabi, tentang hal itu. Umm Salamah memberitahunya bahwa Nabi biasa berciuman saat berpuasa. Ia kembali dan menceritakan hal itu kepada suaminya, yang justru semakin menambah kemarahannya, dan ia berkata, \"Kita tidak seperti Rasulullah. Allah mengizinkan Rasul-Nya melakukan apa pun yang Dia kehendaki.\" Maka istrinya kembali kepada Umm Salamah dan mendapati Nabi bersamanya. Beliau bertanya, \"Ada apa dengan wanita ini?\" Umm Salamah menceritakan apa yang telah terjadi, dan beliau berkata, \"Mengapa kamu tidak memberitahunya bahwa aku melakukan itu?\" Ia menjawab, \"Aku sudah memberitahunya.\" Maka ia pergi kepada suaminya dan menceritakannya, yang justru semakin menambah kemarahannya. Nabi Muhammad SAW menjadi marah dan berkata, \"Demi Allah, aku adalah orang yang paling takut kepada Allah di antara kalian dan paling mengetahui batasan-batasan-Nya.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (351), Suwaid, al-Shafi'i dalam Risalahnya, dan Muhammad ibn al-Hasan al-Shaybani (352), dan bahwa hadits ini diriwayatkan dari 'Abd al-Razzaq (7412) atas otoritas Ibn Jurayj atas otoritas Zayd ibn Aslam. {cite:muwatta-maruf-1997 p.392} {cite:muwatta-maruf-1997 p.394}"
