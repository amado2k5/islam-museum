label: { ar: "مسلم 2820 — أفلا أكون عبداً شكوراً", en: "Muslim 2820 — Should I not be a thankful servant", es: "Musulmán 2820 — ¿No debería ser yo un siervo agradecido?", fr: "Muslim 2820 — Ne devrais-je pas être un serviteur reconnaissant ?", ur: "مسلم 2820 - کیا میں شکر گزار بندہ نہ بنوں؟", tr: "Müslim 2820 — Şükreden bir kul olmamalı mıyım?", id: "Muslim 2820 — Bukankah seharusnya aku menjadi hamba yang bersyukur?" }
text: "صلى النبي حتى انتفخت قدماه، فقيل له: أتكلف هذا وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ فقال: «أفلا أكون عبداً شكوراً؟»"
summary:
  ar: "رواية المغيرة بن شعبة في كتاب صلاة المسافرين/صحيح مسلم؛ قيام النبي الليل حتى تنتفخ قدماه وجوابه «أفلا أكون عبداً شكوراً» — أصل العبادة شكراً لا استجلاباً للمغفرة."
  tr: "Muğire bin Şube'nin Sahih Müslim'de rivayet ettiğine göre, Peygamberimiz geceleyin ayakları şişene kadar ayakta durmuş ve \"Şükreden bir kul olmamalı mıyım?\" diye cevap vermiştir. — İbadetin özü şükretmektir, bağışlanma dilemek değil."
  id: "Diriwayatkan oleh Al-Mughirah bin Shu’bah dalam Kitab Shalat untuk Para Musafir/Sahih Muslim; Nabi berdiri di malam hari hingga kakinya bengkak dan jawabannya: “Bukankah seharusnya aku menjadi hamba yang bersyukur?” — Asal mula ibadah adalah rasa syukur, bukan memohon ampunan."
