text: "صلى النبي حتى انتفخت قدماه، فقيل له: أتكلف هذا وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ فقال: «أفلا أكون عبداً شكوراً؟»"
summary:
  ar: "رواية المغيرة بن شعبة في كتاب صلاة المسافرين/صحيح مسلم؛ قيام النبي الليل حتى تنتفخ قدماه وجوابه «أفلا أكون عبداً شكوراً» — أصل العبادة شكراً لا استجلاباً للمغفرة."
