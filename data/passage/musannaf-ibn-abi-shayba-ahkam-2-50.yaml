text: "… مسجده.... من كره أن يصلي بعد الصلاة مثلها القرب من المسجد أفضل أم البعد؟. في الرجل يقضي صلاته، يتطوع في مكانه؟.. من رخص أن يتطوع في مكانه.... من كره للإمام أن يتطوع في مكانه.. من كان يستحب أن يتقدم ولا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 50، يرد فيه ذكر المستحب، والتطوع، والرخصة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 50, whose wording mentions the recommended (mustahabb), the voluntary act (tatawwu'), the concession (rukhsa), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 50 کا اقتباس جس میں مستحب، تطوع ⁦(نفلی عمل)⁩، رخصت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de Ibn Abi Shayba, volume numérisé 2, p. 50, dont le texte mentionne le recommandé (mustahabb), l'acte volontaire (tatawwu'), la dispense (rukhsa), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Musannaf de Ibn Abi Shayba, volumen digitalizado 2, p. 50, cuyo texto menciona lo recomendado (mustahabb), el acto voluntario (tatawwu'), la dispensa (rukhsa), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 50. sayfasından, tavsiye edilen, gönüllü ve caiz olan fiillerin yanı sıra mekruh edilen fiilleri de içeren bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu bölüm, farz, tavsiye edilen, mekruh edilen, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 2, halaman 50, yang menyebutkan amalan yang dianjurkan, sukarela, dan diperbolehkan, serta amalan yang tidak disukai; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam dosa-dosa wajib, dianjurkan, tidak disukai, terlarang, dan dosa-dosa kecil."
