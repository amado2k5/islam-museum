label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 181 — قراءات القرآن، جمع القرآن والمصاحف", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 181 — the readings of the Qur'an; the collection of the Qur'an and the codices", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 181 — قرآن کی قراءتیں، جمعِ قرآن اور مصاحف", es: "Al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, escaneo del volumen 1, pág. 181: las lecturas del Corán; la colección del Corán y los códices." }
text: "… العلماء فى القراءة بذلك والاكثر على المنع لانها لم تتواتر وان ثبقت بالنقل فهي منسوخة بالعرضة الاخيرة او باجماه الصحابة على المصحف العثماني ومثال ما نقله غير ثقة كثير مما في كتب الشواذ مما غلب أسفاده ضعيف وكالقراءة المنسوبة الى …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 181، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 181, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 181 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 1, pág. 181, que menciona las lecturas del Corán, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
