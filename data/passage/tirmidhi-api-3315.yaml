label: { ar: "جامع الترمذي 3315 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 3315 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 3315 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 3315 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 3315 — mentions de nations, de religions et de peuples non musulmans", tr: "Cami' el-Tirmizi 3315 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Jami' al-Tirmidhi 3315 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرِو بْنِ دِينَارٍ، سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ كُنَّا فِي غَزَاةٍ قَالَ سُفْيَانُ يَرَوْنَ أَنَّهَا غَزْوَةُ بَنِي الْمُصْطَلِقِ فَكَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ فَقَالَ الْمُهَاجِرِيُّ يَا لَلْمُهَاجِرِينَ وَقَالَ الأَنْصَارِيُّ يَا لَلأَنْصَارِ فَسَمِعَ ذَلِكَ النَّبِيُّ فَقَالَ \" مَا بَالُ دَعْوَى الْجَاهِلِيَّةِ \". قَالُوا رَجُلٌ مِنَ الْمُهَاجِرِينَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3315، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3315 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3315، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3315 (Capítulos sobre Tafsir), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport figurant dans Jami' al-Tirmidhi, n° 3315 (Chapitres sur le Tafsir), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Cami' el-Tirmizi'de yer alan 3315 numaralı hadiste, gayrimüslim milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3315, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
