label: { ar: "مسلم 2556 — لا يدخل الجنة قاطع رحم", en: "Muslim 2556 — No severer of kinship enters Paradise", es: "Muslim 2556 — Ningún que rompa el parentesco entrará en el Paraíso", fr: "Muslim 2556 — Nul ne rompt les liens de parenté n'entre au Paradis", ur: "مسلم 2556 - رشتہ داروں سے قطع تعلق کرنے والا جنت میں داخل نہیں ہوگا۔", tr: "Müslim 2556 — Akrabalık bağlarını koparan kimse cennete giremez.", id: "Muslim 2556 — Orang yang memutuskan tali sanak saudara tidak akan masuk surga" }
text: "قال رسول الله: «لا يدخل الجنة قاطع» قال سفيان: يعني قاطع رحم"
summary:
  ar: "رواية جبير بن مطعم في باب صلة الرحم من صحيح مسلم؛ خبر مجمل يفسّره الراوي عن الزهري بقاطع الرحم — من أشد النصوص في تحريم القطيعة."
  tr: "Sahih Müslim'de akrabalık bağlarının korunması bölümünde yer alan Cübeyr ibn Mut'im'in rivayeti; ravi tarafından akrabalık bağlarını koparan kişi olarak açıklanan el-Zühri'nin nazil olduğuna dair genel bir rivayettir ve akrabalık bağlarının koparılmasını yasaklayan en güçlü metinlerden biridir."
  id: "Riwayat Jubayr ibn Mut’im dalam bab tentang menjaga hubungan kekerabatan dalam Sahih Muslim; sebuah riwayat umum yang dijelaskan oleh perawi berdasarkan otoritas al-Zuhri sebagai orang yang memutuskan hubungan kekerabatan — salah satu teks terkuat dalam melarang pemutusan hubungan kekerabatan."
