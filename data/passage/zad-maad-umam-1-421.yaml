text: "… أن اليهودَ لما رَأُوا انتصارَ المشركين على المسلمين يَوْمَ أحد، وعلِمُوا بميعادٍ أبي سفيان لِغزو المسلمين، فخرج لذلك، ثم رجع لِلعام المُقْبِلِ، خرج أشرافُهم، كسلام بن أبي الحُقيق، وسلام بن مِشْكَم، وكِنَانَة بن الرَّبيع وغيرِهم إلى قريش بمكة يُحرِّضُونهم عَلَى …"
summary:
