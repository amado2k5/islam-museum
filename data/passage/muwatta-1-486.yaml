label: { ar: "الموطأ 486 — يعقد الشيطان على قافية رأس أحدكم إذا نام ثلاث عقد", en: "Muwatta 486" }
text: "فإن استيقظ فذكر الله انحلت عقدة، فإن توضأ انحلت عقدة، فإن صلى انحلت عقده، فأصبح نشيطاً طيب النفس"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب جامع الترغيب في الصلاة: يعقد الشيطان على قافية رأس أحدهم إذا نام ثلاث عقد، يضرب مكان كل عقدة: عليك ليل طويل فارقد؛ فإن استيقظ فذكر الله انحلت عقدة، فإن توضأ انحلت عقدة، فإن صلى انحلت عقده فأصبح نشيطاً طيب النفس، وإلا أصبح خبيث النفس كسلان. ويخرّجه المحقق عند البخاري (1142) وأبي داود (1306) وابن حبان وأبي عوانة والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (19/45). {cite:muwatta-maruf-1997 p.249} {cite:muwatta-maruf-1997 p.250}"
