label: { ar: "الموطأ 486 — يعقد الشيطان على قافية رأس أحدكم إذا نام ثلاث عقد", en: "Muwatta 486", es: "Muwatta 486", fr: "Muwatta 486", ur: "موطا 486", tr: "El-Muvatta 486 — Şeytan, uyurken sizden herhangi birinizin başının arkasına üç düğüm atar.", id: "Al-Muwatta 486 — Setan mengikat tiga simpul di belakang kepala siapa pun di antara kalian ketika dia tidur." }
text: "فإن استيقظ فذكر الله انحلت عقدة، فإن توضأ انحلت عقدة، فإن صلى انحلت عقده، فأصبح نشيطاً طيب النفس"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب جامع الترغيب في الصلاة: يعقد الشيطان على قافية رأس أحدهم إذا نام ثلاث عقد، يضرب مكان كل عقدة: عليك ليل طويل فارقد؛ فإن استيقظ فذكر الله انحلت عقدة، فإن توضأ انحلت عقدة، فإن صلى انحلت عقده فأصبح نشيطاً طيب النفس، وإلا أصبح خبيث النفس كسلان. ويخرّجه المحقق عند البخاري (1142) وأبي داود (1306) وابن حبان وأبي عوانة والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (19/45). {cite:muwatta-maruf-1997 p.249} {cite:muwatta-maruf-1997 p.250}"
  tr: "Malik, namaza teşvik bölümünde, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ederek şöyle anlatmıştır: Şeytan, uyuyan birinin başının arkasına üç düğüm atar, her düğüme vurarak, \"Önünde uzun bir gece var, o yüzden uyu\" der. Eğer uyanır ve Allah'ı hatırlarsa, bir düğüm çözülür. Abdest alırsa, bir düğüm daha çözülür. Namaz kılarsa, tüm düğümler çözülür ve kişi enerjik ve neşeli bir şekilde uyanır. Aksi takdirde, kötü bir ruh hali içinde ve tembel bir şekilde uyanır. Editör ayrıca, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla bu hadisi Buhari (1142), Ebu Davud (1306), İbn Hibban, Ebu Evane, el-Tahavi ve el-Beyhakî'nin derlemelerine de dahil etmiş ve el-Tamhid'e (19/45) atıfta bulunmuştur."
  id: "Malik meriwayatkan hadits ini dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surah tentang anjuran shalat: Setan mengikat tiga simpul di belakang kepala seseorang ketika ia tidur, memukul setiap simpul dan berkata, \"Kamu akan menghadapi malam yang panjang, jadi tidurlah.\" Jika ia bangun dan mengingat Allah, satu simpul terlepas. Jika ia berwudhu, simpul lain terlepas. Jika ia shalat, semua simpul terlepas, dan ia bangun dengan penuh semangat dan gembira. Jika tidak, ia bangun dengan suasana hati yang buruk dan malas. Editor juga memasukkannya dalam koleksi al-Bukhari (1142), Abu Dawud (1306), Ibn Hibban, Abu 'Awanah, al-Tahawi, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (19/45)."
