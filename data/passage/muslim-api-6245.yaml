label: { ar: "صحيح مسلم 6245 — الأب والأبوة", en: "Sahih Muslim 6245 — the father and fatherhood", ur: "صحیح مسلم 6245 — باپ اور والدیت", es: "Sahih Muslim 6245 — El padre y la paternidad" }
text: "… وَسُوَيْدُ بْنُ سَعِيدٍ، كِلاَهُمَا عَنِ ابْنِ مُسْهِرٍ، قَالَ إِسْمَاعِيلُ أَخْبَرَنَا عَلِيُّ بْنُ مُسْهِرٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، قَالَ كُنْتُ أَنَا وَعُمَرُ بْنُ أَبِي سَلَمَةَ، يَوْمَ الْخَنْدَقِ مَعَ النِّسْوَةِ فِي أُطُمِ حَسَّانٍ فَكَانَ يُطَأْطِئُ لِي مَرَّةً فَأَنْظُرُ وَأُطَأْطِئُ لَهُ مَرَّةً فَيَنْظُرُ فَكُنْتُ أَعْرِفُ أَبِي إِذَا مَرَّ عَلَى فَرَسِهِ فِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6245، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6245 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6245، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6245 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
