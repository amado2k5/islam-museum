label: { ar: "الموطأ 2618 — مالك: بلغه أن النبي ترك فيهم كتاب الله وسنة نبيه", en: "Muwatta 2618", es: "Muwatta 2618", fr: "Muwatta 2618", ur: "موطا 2618", tr: "El-Muvatta 2618 — Malik: Ona, Peygamberin aralarında Allah'ın Kitabını ve Peygamberinin Sünnetini bıraktığı bildirildi.", id: "Al-Muwatta 2618 — Malik: Dia diberitahu bahwa Nabi meninggalkan di antara mereka Kitab Allah dan Sunnah Nabi-Nya." }
summary:
  ar: "يروي مالك أنه بلغه أن النبي قال: تركت فيكم أمرين لن تضلوا ما مسكتم بهما: كتاب الله وسنة نبيه. ويذكر المحقق قول ابن عبد البر في شهرة الحديث، وأن طرقه الواردة فيه عن أبي هريرة وعمرو بن عوف ضعيفة جدا. {cite:muwatta-maruf-1997 p.480} {cite:muwatta-maruf-1997 p.481}"
  tr: "Malik, Peygamber'in şöyle buyurduğunu işittiğini rivayet eder: “Size iki şey bıraktım ki, bunlara sımsıkı sarılırsanız asla sapmazsınız: Allah'ın Kitabı ve Peygamberinin Sünneti.” Araştırmacı, İbn Abdül-Barr'ın bu hadisin yaygın kabul gördüğüne ve Ebu Hurayra ile Amr ibn Awf'tan gelen rivayet zincirlerinin çok zayıf olduğuna dair ifadesini aktarır. {cite:muwatta-maruf-1997 s.480} {cite:muwatta-maruf-1997 s.481}"
  id: "Malik meriwayatkan bahwa ia mendengar Nabi bersabda: “Aku telah meninggalkan di antara kalian dua hal yang jika kalian berpegang teguh padanya, kalian tidak akan pernah tersesat: Kitab Allah dan Sunnah Nabi-Nya.” Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr mengenai penerimaan luas hadits ini, dan bahwa sanadnya dari Abu Hurayrah dan Amr ibn Awf sangat lemah. {cite:muwatta-maruf-1997 p.480} {cite:muwatta-maruf-1997 p.481}"
