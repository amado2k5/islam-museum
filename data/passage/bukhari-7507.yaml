label:
  ar: "البخاري 7507 — أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب"
  en: "Bukhari 7507 — My servant sinned and knew he has a Lord who forgives sin"
  ur: "بخاری 7507 — میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے"
text: "إن عبدا أصاب ذنبا وربما قال أذنب ذنبا فقال رب أذنبت وربما قال أصبت فاغفر لي فقال ربه أعلم عبدي أن له ربا يغفر الذنب ويأخذ به غفرت لعبدي. ثم مكث ما شاء الله، ثم أصاب ذنبا أو أذنب ذنبا، …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7507: أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7507: My servant sinned and knew he has a Lord who forgives sin. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7507: میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
