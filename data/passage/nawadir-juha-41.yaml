label: { ar: "نوادر جحا الكبرى، ص 24 — «لو كنت حياً لأريتكم»", en: "Nawadir Juha al-Kubra, p. 24 — 'Had I Been Alive, I Would Have Shown You'", ur: "نوادر جحا الکبریٰ، ص 24 — «اگر میں زندہ ہوتا تو تمہیں دکھا دیتا»", fr: "Nawadir Juha al-Kubra, p. 24 — « Si j'étais vivant, je vous l'aurais montré »", es: "Nawadir Juha al-Kubra, p. 24 — «Si estuviera vivo, ya les habría enseñado»", tr: "Juha'nın Muhteşem Fıkraları, s. 24 — “Eğer hayatta olsaydım, size gösterirdim”", id: "Anekdot Hebat Juha, hlm. 24 — “Seandainya aku masih hidup, aku akan menunjukkannya padamu”" }
text: "… لو كنت حياً لأريتكم سأل أمرأتَهُ يوماً : ما الفرقُ بين الميتِ والحيّ؟ قالت: إذا ماتَ المرءُ بردَتْ يداهُ ورِجلاه.. فخرج يوماً إلى الجبلِ يحتطبُ في فصل الشتاءِ فشعرَ ببردٍ في يديهِ ورِجليهِ وخطرَ على باله، ما قالت له امرأته …"
summary:
  ar: "قالت زوجة جحا إن الموتى تبرد أيديهم وأقدامهم، فاستلقى تحت شجرة وترك الذئاب تهاجم حماره، وقال إنه لو كان حيًا لمنعها. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  en: "Told by his wife that the dead go cold in hands and feet, Juha lies down under a tree and lets wolves attack his donkey, saying that he would have stopped them had he been alive. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  ur: "بیوی نے جحا کو بتایا کہ مردوں کے ہاتھ پاؤں ٹھنڈے ہو جاتے ہیں، تو وہ ایک درخت کے نیچے لیٹ گیا اور بھیڑیوں کو اپنے گدھے پر حملہ کرنے دیا، اور کہا کہ اگر میں زندہ ہوتا تو انہیں روک لیتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  fr: "Sa femme lui ayant dit que les morts ont les mains et les pieds froids, Juha s'allonge sous un arbre et laisse les loups attaquer son âne, disant qu'il les aurait arrêtés s'il avait été vivant. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  es: "Su mujer le dice que los muertos se quedan fríos de manos y pies; Juha se tumba bajo un árbol y deja que los lobos ataquen a su burro, diciendo que los habría detenido de estar vivo. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  tr: "Juha'nın karısı, ölülerin ellerinin ve ayaklarının soğuk olduğunu söyleyince, Juha bir ağacın altına uzanıp kurtların eşeğine saldırmasına izin verdi ve hayatta olsaydı onları durduracağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 24}"
  id: "Istri Juha berkata bahwa orang mati memiliki tangan dan kaki yang dingin, jadi dia berbaring di bawah pohon dan membiarkan serigala menyerang keledainya, sambil berkata bahwa jika dia masih hidup, dia akan menghentikan mereka. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
