text: "… وبرسولِهِ وأسْلَمْتُ، ثم أخذتُ سيفي فغَدَوْتُ مع رسول اللّٰه وَلِ قِ ثم قاتَلْتُ حتى أصابني ما أصابني، ثم لم يَلْبَثْ أن مات في أيديهم، فذكروه لرسول اللّٰه لم فقال: إِنَّهُ لَمِنْ أَهْلِ الجَنَّةِ. مَقْتَلُ عَمْرِو بْنِ الجَمُوحِ: قال ابن إسحاق: …"
