text: "… يدى ومشابخ مرقند وقيل إنها للقدر الشترك بين لأمر خارج منها لازم لها كصوم يوم النحر فان الوجوب والندب والاباحة وهو الاذن برفع الحرج عن العمل وبه قال المرتضى من الشيعة،. وقال جمهور الشيعة إنها مشركة بين الثلاثة المذكورة والنهديد. …"
summary:
  ar: "مقطع من إرشاد الفحول للشوكاني، ص 96، يرد فيه ذكر الوجوب، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shawkani's Irshad al-Fuhul, p. 96, whose wording mentions obligation (wujub), the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ارشاد الفحول، شوکانی، ص 96 کا اقتباس جس میں وجوب، مباح، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Irshad al-Fuhul de al-Shawkani, p. 96, dont le texte mentionne l'obligation (wujub), le permis (mubah), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
