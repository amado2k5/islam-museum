text: "… بعض محارمه بشبهة،... فولدت له،... فالحكم فيها مثل المجوسى ما لا يشبه الطلاق، ولا يدل على الفراق... متى شبه أمرأته بمن تحرم عليه على التأبيد... فهو مظاهر إذا شبهها بظهر من تحرم عليه تحريما مؤقتا،... إن شبهها بظهر أبيه، أو …"
