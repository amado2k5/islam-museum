label: { ar: "الموطأ 1469 — ابن مرسى مولى قريش: كان عمر يطلب كتابا كتبه في شأن العمة، فمحاه بالماء ثم قال لو رضيها الله أقرها", en: "Muwatta 1469", es: "Muwatta 1469", fr: "Muwatta 1469", ur: "موطا 1469", tr: "El-Muvatta 1469 — Kureyş'ten azat edilmiş köle İbn Mursi: Ömer, teyzesi hakkında yazdığı bir belgeyi istiyordu. Bunun üzerine belgeyi suyla sildi ve şöyle dedi: \"Eğer Allah bunu onaylamış olsaydı, onaylardı.\"", id: "Al-Muwatta 1469 — Ibn Mursi, budak Quraisy yang telah dibebaskan: Umar meminta sebuah dokumen yang telah ia tulis mengenai bibinya, lalu ia menghapusnya dengan air dan kemudian berkata, “Jika Allah menyetujuinya, Dia pasti akan menyetujuinya.”" }
text: "لَوْ رَضِيكِ اللهُ أقَرَّكِ"
summary:
  ar: "يروي مالك عن محمد بن أبي بكر بن محمد بن عمرو بن حزم عن عبد الرحمن بن حنظلة الزرقي أنه أخبره عن مولى لقريش كان قديما يقال له ابن مرسى قال كنت جالسا عند عمر بن الخطاب، فلما صلى الظهر قال يا يرفأ، هلم ذلك الكتاب، لكتاب كتبه في شأن العمة، فنسأل عنها ونستخبر فيها. فأتاه به يرفأ، فدعا بتور أو قدح فيه ماء، فمحا ذلك الكتاب فيه، ثم قال لو رضيها الله أقرها، لو رضيها الله أقرها. {cite:muwatta-maruf-1997 p.18}"
  tr: "Malik, Muhammed ibn Abi Bekr ibn Muhammed ibn Amr ibn Hazm'dan, o da Abdülrahman ibn Hanzala el-Zuraki'den rivayet eder ki, ona Kureyş'ten azat edilmiş eski bir köle olan İbn Mursi'den şöyle bir rivayet aktarılır: Ömer ibn el-Hattab ile oturuyordum. Öğle namazını kıldıktan sonra, babamın kız kardeşi hakkında yazdığı bir kitaptan bahsederek, \"Ey Yarfa', o kitabı getir,\" dedi. \"Böylece onun hakkında bilgi edinip araştırabiliriz.\" Yarfa' kitabı getirdi ve o da bir leğen veya su dolu bir kap istedi. Kitabı suya sildi ve sonra, \"Eğer Allah bundan razı olsaydı, onu onaylardı; eğer Allah bundan razı olsaydı, onu onaylardı.\" dedi. {cite:muwatta-maruf-1997 s.18}"
  id: "Malik meriwayatkan dari Muhammad ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, dari Abd al-Rahman ibn Hanzala al-Zuraqi, yang menceritakan kepadanya tentang seorang mantan budak Quraisy yang telah dibebaskan bernama Ibn Mursi, yang berkata: Aku sedang duduk bersama Umar ibn al-Khattab, dan ketika beliau selesai shalat Zuhur, beliau berkata, “Wahai Yarfa’, bawalah buku itu,” merujuk pada sebuah buku yang telah ditulisnya tentang bibi dari pihak ayah, “agar kita dapat menyelidikinya dan mencari informasi tentangnya.” Maka Yarfa’ membawanya kepadanya, dan beliau meminta sebuah baskom atau cangkir berisi air, lalu beliau menulis buku itu di dalamnya, kemudian beliau berkata, “Jika Allah meridainya, Dia pasti akan menyetujuinya; jika Allah meridainya, Dia pasti akan menyetujuinya.” {cite:muwatta-maruf-1997 p.18}"
