label: { ar: "الموطأ 1469 — ابن مرسى مولى قريش: كان عمر يطلب كتابا كتبه في شأن العمة، فمحاه بالماء ثم قال لو رضيها الله أقرها", en: "Muwatta 1469" }
text: "لَوْ رَضِيكِ اللهُ أقَرَّكِ"
summary:
  ar: "يروي مالك عن محمد بن أبي بكر بن محمد بن عمرو بن حزم عن عبد الرحمن بن حنظلة الزرقي أنه أخبره عن مولى لقريش كان قديما يقال له ابن مرسى قال كنت جالسا عند عمر بن الخطاب، فلما صلى الظهر قال يا يرفأ، هلم ذلك الكتاب، لكتاب كتبه في شأن العمة، فنسأل عنها ونستخبر فيها. فأتاه به يرفأ، فدعا بتور أو قدح فيه ماء، فمحا ذلك الكتاب فيه، ثم قال لو رضيها الله أقرها، لو رضيها الله أقرها. {cite:muwatta-maruf-1997 p.18}"
