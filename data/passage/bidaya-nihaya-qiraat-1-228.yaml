text: "… المعجم، وذكر غير ذلك قصائد طوالاً كثيرة حسنة. البهاء زهير صاحب الديوان وهو زهير بن محمد بن علي بن يحى بن الحسين بن جعفر المهلبي العتكي المصري، ولد بمكة ونشأ بقوص، وأقام بالقاهرة، الشاعر المطبق الجواد في حسن الخط له …"
summary:
