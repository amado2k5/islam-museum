label: { ar: "الموطأ 2851 — ابن عمر: اليد العليا خير من اليد السفلى", en: "Muwatta 2851", es: "Muwatta 2851", fr: "Muwatta 2851", ur: "موطا 2851", tr: "El-Muvatta 2851 — İbn Ömer: Üst el, alt elden daha iyidir.", id: "Al-Muwatta 2851 — Ibn Umar: Tangan yang di atas lebih baik daripada tangan yang di bawah" }
summary:
  ar: "يروي مالك عن نافع، عن عبد الله بن عمر أن رسول الله قال وهو على المنبر، يذكر الصدقة والتعفف عن المسألة: اليد العليا خير من اليد السفلى، واليد العليا هي المنفقة، والسفلى هي السائلة. {cite:muwatta-maruf-1997 p.597}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü minberde sadaka ve dilencilikten sakınma konusunda şöyle buyurmuştur: \"Üstün el, aşağı elden daha hayırlıdır. Üstün el verendir, aşağı el ise isteyendir.\" {cite:muwatta-maruf-1997 s.597}"
  id: "Malik meriwayatkan dari Nafi’, dari Abdullah ibn Umar, bahwa Rasulullah SAW, ketika berkhutbah, bersabda, mengenai sedekah dan menjauhi mengemis: “Tangan di atas lebih baik daripada tangan di bawah. Tangan di atas adalah tangan yang memberi, dan tangan di bawah adalah tangan yang meminta.” {cite:muwatta-maruf-1997 p.597}"
