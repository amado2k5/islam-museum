text: "… ترك الجهاد : - الجهاد فرض كفاية إذا لم يكن هناك نفير عام، فإذا قام به البعض سقط الإثم عن الباقين، أما إذا كان النفير عاما، فالجهاد يصبح فرض عين على كل قادر من المسلمين، وهذا الحكم فى فرضية الجهاد …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 1، ص 33، يرد فيه ذكر الفرض، وفرض العين، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 1, p. 33, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 1، ص 33 کا اقتباس جس میں فرض، فرضِ عین، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 1, p. 33, dont le texte mentionne l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 1, p. 33, cuyo texto menciona lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 1, sayfa 33'ten bir alıntı, farz fiiller, bireysel yükümlülükler ve toplumsal yükümlülükler ile bir fiili bazıları yerine getirirse, geri kalanlar için artık gerekli olmadığı ilkesini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram kılınan fiiller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Yurisprudensi Islam Kuwait, Jilid 1 Bergambar, halaman 33, membahas tentang perbuatan wajib, kewajiban individu, dan kewajiban komunal, serta prinsip bahwa jika sebagian orang melakukan suatu perbuatan, maka perbuatan tersebut tidak lagi diwajibkan bagi yang lain. Kutipan ini berasal dari versi yang dapat dibaca mesin dan dipindai, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam perbuatan wajib, tugas, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
