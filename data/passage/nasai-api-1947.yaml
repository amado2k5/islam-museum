label: { ar: "سنن النسائي 1947 — الأب والأبوة", en: "Sunan al-Nasa'i 1947 — the father and fatherhood", ur: "سنن نسائی 1947 — باپ اور والدیت", es: "Sunan al-Nasa'i 1947 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1947 — le père et la paternité" }
text: "… أُمِّ الْمُؤْمِنِينَ، عَائِشَةَ قَالَتْ أُتِيَ رَسُولُ اللَّهِ بِصَبِيٍّ مِنْ صِبْيَانِ الأَنْصَارِ فَصَلَّى عَلَيْهِ. قَالَتْ عَائِشَةُ فَقُلْتُ طُوبَى لِهَذَا عُصْفُورٌ مِنْ عَصَافِيرِ الْجَنَّةِ لَمْ يَعْمَلْ سُوءًا وَلَمْ يُدْرِكْهُ. قَالَ \" أَوَغَيْرَ ذَلِكَ يَا عَائِشَةُ خَلَقَ اللَّهُ عَزَّ وَجَلَّ الْجَنَّةَ وَخَلَقَ لَهَا أَهْلاً وَخَلَقَهُمْ فِي أَصْلاَبِ آبَائِهِمْ وَخَلَقَ النَّارَ وَخَلَقَ لَهَا أَهْلاً وَخَلَقَهُمْ فِي أَصْلاَبِ آبَائِهِمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1947، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1947 (The Book of Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1947، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1947 (El Libro de los Funerales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1947 (Le Livre des funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
