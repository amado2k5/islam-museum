text: |-
  ١٨١
  كانوا يخلون الفصيل لتلار تضع فيهزل لذلك وانال خلك الكساءعلى نفسان بالخلال وقال
  سألتك اذخبا ؤك فوق تل • وأنت تخله بالخل خلا
  وخلّ الرجل افتة روذهب ماله وكذلك أخل به يقال ما أخلكْ الى هذا أى ما أحوجك
  وأخللت الابل أى رعيتها فى انخلة وأخلت انخلد اذا أساءت الهمل حكاه أيوعبيدوأنا أظنه
  من الخلال كما يقال أبلح النخل وأرطب وأخلّ الرجل بمركزه أى تركه واختل الى الشأى
  احتاج اليه ومنه قول ابن مسعودرضى اللّٰه عنه عليكم بالعلم فان أحدكم لا يدرى متى يحتل
  اليه أى متى يحتاج الناس الى ماعنده واختلّ جسعه أى هزل واختله ينهم أى انتظ.
  وتخلل باخلال بعد الاكل وتخلل الشئ أى نفذ وتخال المطراذ اخص ولم يكن عاما وتخللت
  القوم اذادخات بين خلظهم وخلالهم والخلخال واحدخلاخيل النساء والخلفل لغة فيه
  أو مقصور منه وقال * براقة الجيد صموت اخلخل * والتخليل اتخاذ الخل وتخليل اللعية
  والاصابع فى الوضوءفاذ افعل ذلك قال تخلات والحل عرق فى العنق قال
  ثم الى صلب شديد الخل* ⁦(خل)⁩ انلدل الهدب والخمل الطنفسة ومنه قول عروبن شاس
  ظباء السلى واكنات على اتلحل * أى بالسات على الطفافس قال أبو صاعد الجميلة الشجر
  لمجتمع الكثيف وقال: لاصمعىّ الجميلة رملة تنيت الشجر والهال العرج قال الكميت
  اذا نسيت عرج الضباع خالها * قال أبو عبيدهوظلع يكون فى قواتم الابل فيداوى يقطع
  العرق وأنشد للاعشى لم تعطف على حوارولم يقشطع عبيدعروقها من خمال
  والخامل الساقط الذى لانباهة له وقدخمل يخمل خولا وأخلته أنا ⁦(خول)⁩ الخائل
  قوله والجمال الخ فى القاموس
  وكغراب داء فى مفاصل الانان
  وقوائم الحيوات يظلع منه وقد
  خل كعنى اه
  الحافظ للشئ يقال فلان يخول على أهله أى يرعى عليهم وخوّله اللّٰه الشى أملكد اياه وقد
  خلت المال أخوله اذا أحسفت القيام عليه يقال هوخال مال وخائل مال وخولى مال
  أى حسن القيام عليه والتخوّل التعهد وفى الحسديث كان النبىّ صلى اللّٰه عليه وسلم
  بتخوّلنا بالموعظة مخافة الشامة وكان الاصعىّ بقول يتخوتنا بالنون أى يتعهدنا
  وربما قالواتخوّات الريح الارض اذا تعهسدتها وتخوّلت فى فلان خالا من الخير أى أخلت
  وتوسءت وخول الرجل حشمه الواحد خائل وقد يكون الخول واحدا وهو اسم يقع على العبد
  والامة قال الفراءهو جمع خائل وهو الراعى وقال غيره هو مأخوذ من التخويل وهو التمليُك
  والخال أخو الاتم والخالة أختها يقال خال بين الخولة وبيني وبين فلان خؤلة وتقول
  استخل خالا غير خالك واستخول خالا غسير خالا أى اتخذ والاستخوال أيضامثل الاستخبال
  وكان أبو عبيدة يروى قول زهير» هنالك ان يستفولوا المال يخولوا• والخال لواء الجيش
  والخال نوع من البرود قال الشماخ
  وبردان من خال وسبعون درهما • على ذالمقروظ من القدماعز
  وخولة اسم امر أتمن كلب شبب بها طرفة وخولان قبيلة من اليمن ويقال تطاير الشرو.
  أخول أخول أى متفرّقا وه والشرر الذى يتطاير من الحديد الحارّ اذاضرب قال ضابئ ٢
  ياقط عنه روقه ضارياتها • سقاط حديد القيز أخول أخولا
  ٢ ١ ف تسخة زيادة يصف النور
  وذهب القوم أخول أخول اذا تف-رة واشق وه-مااسمان جعلا واحداو بنيا على الفتح
  لى
