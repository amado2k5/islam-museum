text: "… سوء فإ وقال الثوري حرمت قيام الليل خمسة أشهر بذنب أذنبته قيل وما ذاك الذنب قال رأيت رجلا ً يبكي فقلت في نفسي هذا مراء وقال بعضهم دخلت على كرز بن وبرة وهو يبكي فقلت أتاك نعي بعض أهلك فقال …"
summary:
  ar: "مقطع من إحياء علوم الدين، المجلد المصوَّر 4، ص 1965، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 4, p. 1965, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 4، ص 1965 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
