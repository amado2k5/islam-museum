text: "… وزن فلنجارين وهو مثقالان مع كثيراً وافق من به نفت الدم وقرحة الأمعاء والإسهال المزمن واليرقان ووجع المثانة ويوافق النساء اللواتي يسيل من أرحامهن رطوبات سيلان مزمنا إذا شرب مع بعض الرطوبات في الأدوية النافعة من هذا المرض وقد يقطع …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 291، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأطوار خلق الجنين، وأعضاء البدن، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 291, that mentions illness and the sick, pain, named diseases, the stages of the embryo, the organs of the body, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 291 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، جنین کے مراحل، اعضائے بدن، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 291, que menciona la enfermedad y los enfermos, el dolor, las enfermedades con nombre, las etapas del embrión, los órganos del cuerpo, el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de al-Razi's al-Hawi fi al-Tibb, p. 291, qui mentionne la maladie et les malades, la douleur, les maladies nommées, les stades de l'embryon, les organes du corps, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 291. sayfasından bir bölüm; hastalık ve hasta, ağrı, hastalıkların isimleri, fetüs gelişiminin aşamaları, vücut organları ve ilaçtan bahsediliyor; makineyle okunabilir fotokopi versiyonundan alınmış olup, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 291, yang menyebutkan penyakit dan pasien, rasa sakit, nama-nama penyakit, tahapan perkembangan janin, organ-organ tubuh, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
