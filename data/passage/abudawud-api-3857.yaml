label: { ar: "سنن أبي داود 3857 — الحجامة، التداوي", en: "Sunan Abi Dawud 3857 — cupping; seeking treatment", ur: "سنن ابی داؤد 3857 — حجامہ، علاج کرانا", es: "Sunan Abi Dawud 3857 - ventosas; buscando tratamiento", fr: "Sunan Abi Dawud 3857 — ventouses; chercher un traitement", tr: "Sunan Abi Dawud 3857 — Hacamat, Şifa", id: "Sunan Abi Dawud 3857 — Bekam, Penyembuhan" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، عَنْ مُحَمَّدِ بْنِ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِنْ كَانَ فِي شَىْءٍ مِمَّا تَدَاوَيْتُمْ بِهِ خَيْرٌ فَالْحِجَامَةُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3857، يذكر الحجامة، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3857 (Medicine (Kitab Al-Tibb)), that mentions cupping, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3857، جس میں حجامہ، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3857 (Medicina (Kitab Al-Tibb)), menciona la ventosaterapia como tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3857 (Médecine (Kitab Al-Tibb)), mentionne la pratique des ventouses comme traitement. Le Répertoire des ouvrages de référence sur la médecine le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Abi Davud'da yer alan 3857 numaralı hadiste, hacamat ve diğer tedavi yöntemlerinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3857, menyebutkan bekam dan bentuk pengobatan lainnya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
