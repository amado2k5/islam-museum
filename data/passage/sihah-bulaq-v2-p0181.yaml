text: |-
  ٤٠٦
  لبن وهو نكرة ويعترّف بالالف واللام قال جرير
  وابن اللبون اذا مالز فى قرن • لم يستطع صولة البزل القناعيس
  ولبنته ألبنه وألينهسق يته اللبن فأنالا بن يشال نحن تلبن جيراننا أى نسقيهذم اللبن وابنه
  بالعصايلبذه بالسكسر لبذا اذاضر به به ايقال ابنه ثلاث لبنات ولبنه بصرة ضر به بم اورجل
  لابن أيضا أى ذولين كة ولك تامر أى ذور قال الحطيقة
  وغروتنى وزعمت أنك لابن بالصيف تامر
  وألبن القوم كثر عندهم اللبز وألبنت الناقة نزل لبتها فى ضرعها فهى ملبن وقال
  أعجمبها اذ ألبنت لبسانه• وفرس ملبون ولبين ربى باللبن مثل عايف من العلف وقوم ملبونون
  اذاظهر منهم سفه إصيهم من ألبان الابل مثل ما يسيب أصحاب النبيذ وتقول هذاعشب
  مابنة بالفتح أى يكثرءليه ليبي الشاة وجاءقلات يستابن أى يطلب لبنالعياله أواضيفانه
  واللبنة التى يبنى بها والمع ابن مثل كلمة وكلم قال
  أمايزال قائل أبن أبن * دلوك عن حد الضروس واللبن
  قال ابن السكيت من العرب من يقول لبنة ولبن مثل لبسدة ول دوابن الرجل تلبينا اذا اتخذه
  والملين قالب اللبن والملين المحلب ولبغة القميص برتانه والتلبن التلدّن وهوالة سكث والتلبث
  والملين بالتشديد الفلاتج وأظنه مولدا واللبدان بالكسر كارضاع بقال هو أخوه بلبان أقه
  قال أبن السكيت ولا يقال بلين أمّه ان اللين الذى يشرب من ناقة أوشاة أويقرة قال
  الكميت يمدح مخلد بن يزيد
  تلق الندى ومخلد احليفين • كانامعافى مهده رضيعين • تنازعافيه لبان الثديين
  واللبان بالفتح ماجرى عليه الليب من الصدر والقبان بالضم الكندر واللبانة الحاجة وابنان
  جبل واللبق شجرة لها لبن كالعسل وبعا يتيخريه قال • ورنداولبنى والنكباء المقتراه وابنى
  ولبين من أسماء النساءوقول الراجز * أقة رمنها يلبن وأفلس • هماموضعان ⁦(لجن)⁩ تلجن
  الشى تلزح وتلجن رأسه اذا غ له فلم يتق وسضه ولهذت انظطمى ونحوه تلمينا أذاضربته
  ايثخن واللجين الخبط عن ابن السكيت وهو ما-قط من الورق عند انلخبط قال الشماخ
  وما قد وردت لوصل أروى • عليه الطير كالورق اللجين
  ويقال تلج القوم اذا أخذوا الورق ودقوه وخلطوه بالنوى لتعلفه الابل وناقة لهون نقيلة
  فى السيروقد لخنت تلجن لحونا ولحانا واللجين الفضة جامصغرامثل التريا والكميت
  ن للحن الخطأ فى الاعراب بقال فلان لحان ولحانة أى كثير ائظطا والتلحين التضطئة
  واللعن واحد الالحان واللمون ومنه الحديث اقروا القرآن بدون العرب وقد ءن فى قراءته
  إذا طرب بها وغرد وهو ألخن الناس اذا كان أحسنهم قراءة أوغناء ولحن اليه يلن لحنا
  أى نواه وقصده ومال اليه ولحن فى كلامه أيضاأى أخطأ واللحن بالتهريك الفطنة وقدان
  وفى الحديث ولعل "احدكم ألحن مححته من الاخر أى أفطن لها ومنه قول عمر بى عبه
  العزيز عجبت إن لاحن الناس كيف لا يع-رف جوامع الكام أى قاطنهم أبوز يدلحنت له
  بالفتح ألمن لحما اذاقات له قولا يفهمه عنك ويخفى على غسيره ولحنه هو عنى بالكسر يلجنه
