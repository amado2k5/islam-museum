text: "… إلا في ظروف الأدم. فاشربوا في كل وعاء غيرالا تشربوا مسكراً. رواه أحمد، ومسلم، وأبو داود، والنسائي. وفي رواية نهيتكم عن الظروف، وإن ظرفاً لا يُحِلُّ شيئاً، ولا يُحَرَّمُه وكل مُسْكِرٍ حرام رواه الجماعة إلا البخاري، وأبا داود."
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 61، يذكر ما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 61, that mentions what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 61 کا اقتباس جس میں جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
