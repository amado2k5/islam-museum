text: "… شعب الإيمان وفيه ليث بن أبي سليم حديث أبي هريرة كان إذا غضب وهو قائم جلس وإذا غضب وهو جالس اضطجع فيذهب غضبه أخرجه ابن أبي الدنيا وفيه من لم يسم ولأحمد بإسناد جيد في أثناء حديث فيه وكان أبو …"
