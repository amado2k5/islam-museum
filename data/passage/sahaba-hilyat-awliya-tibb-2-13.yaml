text: "… رجل آخر فقال يارسول اللّٰه ادع اللّٰه أن يجملف منهم، فقال سبقك بها عكاشة. قال فتراجع أصحاب رسول اللّٰه الحديث فيما بينهم فى السبمين ألها فبلغ حديثهم الذبى فقال : هم الذين لا يكتوون ولا يسترقون ولا يتطيرون وعلى ربهم …"
