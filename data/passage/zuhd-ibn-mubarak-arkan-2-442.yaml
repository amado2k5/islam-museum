text: "… لا أَرى عليكم يا أهلَ المدينةِ حلاوةَ الإيمانِ؟! والَّذي نَفْسي به، لو أنَّ دُبَّ الغابةِ طَعِمَ الإيمانَ لَرُئِيَ عليه حلاوةُ الإيمانِ. وأخرجه الطبراني في مسند الشاميين من طريق الحسين المروزي، بهذا الإسناد. ووصله صالحُ بن رُزيق العطّار عند ابن ماجه، …"
