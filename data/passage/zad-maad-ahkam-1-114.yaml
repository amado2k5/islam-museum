text: "… جهل. فهذا إن الفتح. والذي نفته، هو ما كان يفعله الناسُ، صلونها لغير سبب، وهي لم تقل: إن ذلك مكروه، ولا مخالفً لسنته، ولكن لم يكن مِن هديه فعلُها لغير سبب. وقد أوصى بها وندب إليها، وحضّ عليها، وكان يَستغني …"
summary:
