label:
  ar: الموطأ 252 — إذا شك أحدكم أثلاثاً صلى أم أربعاً فليصل ركعة وليسجد سجدتين
  en: Muwatta 252
  es: "Muwatta 252"
  fr: "Muwatta 252"
  ur: "موطا 252"
  tr: "Al-Muwatta 252 — Eğer biriniz üç mü yoksa dört rekat mı namaz kıldığından emin değilse, bir rekat namaz kılsın ve iki secde yapsın."
  id: "Al-Muwatta 252 — Jika salah seorang dari kalian ragu apakah ia telah mengerjakan salat tiga rakaat atau empat rakaat, maka kerjakanlah salat satu rakaat dan sujud dua kali."
text: إذا شك أحدكم في صلاته فلم يدر كم صلى، أثلاثاً أم أربعاً؟ فليصل ركعة وليسجد سجدتين وهو جالس قبل التسليم
summary:
  ar: 'أول حديث في باب إتمام المصلي ما ذكر إذا شك في صلاته. يرويه يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً: أمر النبي من شك في صلاته فلم يدر أصلى ثلاثاً أم أربعاً أن يصلي ركعة ويسجد سجدتين وهو جالس قبل التسليم، فإن كانت الركعة خامسة شفعها بالسجدتين، وإن كانت رابعة فالسجدتان ترغيم للشيطان. ويخرّجه المحقق عند أبي داود (1026) والطحاوي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جميع رواة الموطأ رووه مرسلاً ولم يسنده عن مالك إلا الوليد بن مسلم، وأن ثقات وصلوه عن زيد بن أسلم عن عطاء عن أبي سعيد الخدري، منهم الماجشون وابن عجلان وسليمان بن بلال، فالحديث متصل مسند صحيح لا يضره تقصير من قصر به ⁦(التمهيد 5/18–19)⁩؛ ويذكر أن أحمد بن حنبل قال إنما قصر به مالك وقد أسنده عدة، وأن الدارقطني رجح المرفوع، ويخرّج حديث أبي سعيد المرفوع عند مسلم (2/84) وأبي داود (1024) وابن ماجه (1210) والنسائي وابن خزيمة وابن حبان. {cite:muwatta-maruf-1997 p.149} {cite:muwatta-maruf-1997 p.150}'
  tr: "Namazın tamamlanmasıyla ilgili bölümdeki ilk hadis, daha önce de belirtildiği gibi, namazından şüphe eden kimse için geçerlidir. Yahya, Malik, Zeyd ibn Aslam, Ata ibn Yasar'dan mursal bir şekilde rivayet etmiştir: Peygamberimiz, namazından şüphe eden ve üç mü yoksa dört rekat mı kıldığını bilmeyen kimseye, bir rekat kılıp selam vermeden önce oturarak iki secde yapmasını emretmiştir. Beşinci rekat ise iki secdeyle tamamlasın, dördüncü rekat ise iki secde şeytanı kovmak içindir. Araştırmacı, bu hadisi Malik'in sahabelerinin rivayet zincirleri aracılığıyla Ebu Davud (1026), Tahavi ve Beyhaki'ye dahil etmiş ve İbn Abdülberr'in, Muvatta'nın tüm ravilerinin bunu mursal biçimde rivayet ettiğini ve Malik'ten yalnızca Velid ibn Müslim'in rivayet ettiğini, güvenilir kişilerin ise Zeyd ibn Aslam'dan, Ata'dan, Ebu Sa'id el-Hudri'den rivayetle hadisi naklettiğini, bunların arasında el-Mecişun, İbn Eclan ve Süleyman ibn Bilal'in de bulunduğunu söylediğini aktarmıştır. Dolayısıyla hadis, sahih ve nakledilebilir olup, onu atlayanların eksikliklerinden etkilenmemiştir (el-Temhid 5/18-19). Ahmed ibn Hanbel'in bu konuda Malik'in eksik kaldığını söylediği rivayet edilmiş ve birçok âlim de bunu desteklemiştir. El-Daraqutni, tam bir rivayet zincirine sahip olan versiyonu daha güvenilir bulmuştur. Ebu Said'in hadisi, Peygamber'e tam bir rivayet zinciriyle birlikte Müslim (2/84), Ebu Davud (1024), İbn Mace (1210), el-Nesa'i, İbn Huzeyme ve İbn Hibban'da bulunmaktadır. {cite:muwatta-maruf-1997 s.149} {cite:muwatta-maruf-1997 s.150}"
  id: "Hadits pertama dalam surah tentang menyempurnakan salat seorang jamaah, sebagaimana disebutkan, jika ia ragu-ragu tentang salatnya. Diriwayatkan oleh Yahya dari Malik dari Zaid bin Aslam dari Ata bin Yasar dalam bentuk mursal: Nabi memerintahkan orang yang ragu-ragu tentang salatnya dan tidak tahu apakah ia telah salat tiga atau empat rakaat, untuk salat satu rakaat dan melakukan dua sujud sambil duduk di depan taslim. Jika itu rakaat kelima, maka ia harus melengkapinya dengan dua sujud, dan jika itu rakaat keempat, maka dua sujud itu untuk menghina setan. Peneliti memasukkannya dalam Abu Dawud (1026), al-Tahawi, dan al-Bayhaqi melalui sanad para sahabat Malik, dan ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa semua perawi al-Muwatta' meriwayatkannya dalam bentuk mursal dan tidak ada yang menghubungkannya dari Malik kecuali al-Walid ibn Muslim, dan bahwa orang-orang terpercaya menghubungkannya atas otoritas Zayd ibn Aslam atas otoritas Ata atas otoritas Abu Sa'id al-Khudri, termasuk al-Majishun, Ibnu Ajlan, dan Sulayman ibn Bilal. Jadi hadits tersebut terhubung, sahih, dan sanadnya tidak terpengaruh oleh kekurangan orang-orang yang menghilangkannya (al-Tamhid 5/18-19). Diriwayatkan bahwa Ahmad ibn Hanbal mengatakan bahwa Malik adalah orang yang kurang dalam hal ini, dan beberapa ulama mendukungnya. Al-Daraqutni menganggap versi dengan sanad yang lengkap lebih dapat diandalkan. Hadits Abu Sa'id, dengan sanad lengkap sampai Nabi, terdapat dalam Muslim (2/84), Abu Dawud (1024), Ibn Majah (1210), al-Nasa'i, Ibn Khuzaymah, dan Ibn Hibban. {cite:muwatta-maruf-1997 p.149} {cite:muwatta-maruf-1997 p.150}"
