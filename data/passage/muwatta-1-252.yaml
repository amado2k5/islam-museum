label: { ar: "الموطأ 252 — إذا شك أحدكم أثلاثاً صلى أم أربعاً فليصل ركعة وليسجد سجدتين", en: "Muwatta 252" }
text: "إذا شك أحدكم في صلاته فلم يدر كم صلى، أثلاثاً أم أربعاً؟ فليصل ركعة وليسجد سجدتين وهو جالس قبل التسليم"
summary:
  ar: "أول حديث في باب إتمام المصلي ما ذكر إذا شك في صلاته. يرويه يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً: أمر النبي من شك في صلاته فلم يدر أصلى ثلاثاً أم أربعاً أن يصلي ركعة ويسجد سجدتين وهو جالس قبل التسليم، فإن كانت الركعة خامسة شفعها بالسجدتين، وإن كانت رابعة فالسجدتان ترغيم للشيطان. ويخرّجه المحقق عند أبي داود (1026) والطحاوي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جميع رواة الموطأ رووه مرسلاً ولم يسنده عن مالك إلا الوليد بن مسلم، وأن ثقات وصلوه عن زيد بن أسلم عن عطاء عن أبي سعيد الخدري، منهم الماجشون وابن عجلان وسليمان بن بلال، فالحديث متصل مسند صحيح لا يضره تقصير من قصر به (التمهيد 5/18–19)؛ ويذكر أن أحمد بن حنبل قال إنما قصر به مالك وقد أسنده عدة، وأن الدارقطني رجح المرفوع، ويخرّج حديث أبي سعيد المرفوع عند مسلم (2/84) وأبي داود (1024) وابن ماجه (1210) والنسائي وابن خزيمة وابن حبان. {cite:muwatta-maruf-1997 p.149} {cite:muwatta-maruf-1997 p.150}"
