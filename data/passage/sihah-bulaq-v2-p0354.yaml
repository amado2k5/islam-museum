text: |-
  ٢٣٢
  قلا وقل بطمه أيضاأت ضخم وأماقول الشاعر
  -تى اذا قلت بطونكم • ورأيتم أبناءكم شبوا
  فانمايعى به كثرت قبائلكم والقملى بالتريك الرجل الحقي والقمل دويبة من جنس
  القردان الاأنم أصغر منها يركب البعير عند الهزال وأمّاقلة الزرع فدويبة أخرى تطير
  كالجراد فى خلفة الحلم وجمعها قل وأقل العرفج والرمث اذا بداورقه صغارا أقل ما يتقطر
  و يعين وطرء واللي التابل وكنت الية القنا ع لة من انتليل ماين التلاين ال
  زيد القندل العظيم الرأس مثل العندل قال أبو عر وفى القندل العظيم الرأس مثله والعندل
  الطويل قال أبوالنجم
  يهدى بشأكل نياف عندل • ركب فى صم الذفارى قندل
  والتنديل معروف وهو فعليل ⁦(قنقل)⁩ القنقل المكيال الضخم وقال التراجز
  كيل عداء بالجزاف القنقل • من صبرة مثل الكتيب الاهيل
  وكان لكسرى تاج يسمى القنقل ⁦(قول)⁩ قال يقول قولا وقولة ومقالا ومقالة ويقال
  كثر القيل والقال وفى الحديت نهى عن قيل وقال وهما اسمان وفى حرف عبد اللّه ذلكْ عيسى
  ابن حريم قال الحق الذى فيه يمترون وكذنك القالة يقال كثرت قالة الناس وأصل قلت قوات
  بالفتح ولا يجوز أن يكون بالضم لانه يتعدى ورجسل قؤل وقوم قول مشل صبور وصبروان
  منت سكنت الواد ورجل مقول ومقوال وقولة وقوّال وتقوالة عن الكائى أى لسن
  كثير الول والمقول اللسان والمقول القيل بلغة أهل اليمن والبمع المقاول قال لبيد
  لهاغلل من رازق وكرسف • بأيمان عجم يتصفون المقاولا
  والقيلملك من ملوك حيردون اللك الاعظم والمرأة قيلة وأصلد قيل بالتشديد كانه الذى له
  قول أى ينة_ذقوله والجمع أقوال وأقبال أيضا ومن جمعه على أقبال لم يجعل الواحدمنه
  مشدداوالقوّل جمع قائل مثل راكع وركع قال رؤبة• وقوّل الاده فلاده* الاصمعى" القال
  الخشبة التى تضرب بها القلة وأنشد .
  كات نزوفراخ الهام بينهم * نزوالقلات قلاها قال قالينا.
  ويقال قولتنى ما لم أقل وأقولتنى مالم أقل أى ادّعيته على وتقوّل عليه أى كذب عليه
  واقتال عليه فعكم وقال
  ومنزلة فى دارصدق وغبطة • وما اقتال من حكم على طبيب
  وقاولته فى أمره وتقاولنا أى تفاوضنا وقول لبيد
  وان اللّٰه نافلة تقاه • ولا يقتالها الا السعيد
  أى ولاية ولها والعرب تجرى تقول وحدها فى الاسستفهام مجرى تظنّ فى العمل قال الراجز
  متى تقول القلص الرواسما • يدنين أمّ قاسم وقاسها
  ننصب القلص كما تنتصب بالفلنّ وقال آخر ٣ علام تقول الرمح يثقل عائق • وقال آبر
  أما الرحيل قدون بعد غد • فتى تقول الدار تجمعنا
  صاح
  قود ف صم
  م الذفارى فى بعض
  النسخ خضم الذقارى !ه
  قولهم الاده فلاده مغناه ان لم
  يكن هذا الامر الان فلايكون
  بعد الآن قال الكساف ولا
  أدرى ما أصله وانى أظنها
  فارسية يقول ان لم تضريه الآن
  فلا تضريه أبدا قاله المؤاف اه
  ٣ نسخة زيادة عمروين
  معدى كرب وبقية البيت
  اذا أنا لم أطعن اذا الخيل كرت
