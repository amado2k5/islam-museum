text: "… لِعِيَالِهِ. ومن حديث أبي بكر المنايحي عن الحسين بن أحمد المالكي عن يحيى بن أكثم القاضي عن المأمون عن هشيم عن منصور عن الحسن عن أبي بكرة أن رسول اللّٰه ليز قال: الحَيَاءُ مِنَ الإِيمانِ. ومن حديث جعفر بن أبي …"
summary:
