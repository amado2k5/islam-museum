text: "تبوك، فأتى يوحنا بن رؤبة صاحب أيلة (1)، فصالحه على الجزية، وكتب له كتابا، فبلغت جزيتهم ثلاثمائة دينار، ثم زاد فيها الخلفاء من بني أمية. فلما كان عمر بن عبد العزيز لم يأخذ منهم غير ثلاثمائة، وصالح أهل أذرح على"
