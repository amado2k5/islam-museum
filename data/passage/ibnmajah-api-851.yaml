label: { ar: "سنن ابن ماجه 851 — مغفرة ما تقدم من الذنب", en: "Sunan Ibn Majah 851 — forgiveness of past sins", ur: "سنن ابن ماجہ 851 — پچھلے گناہوں کی مغفرت", es: "Sunan Ibn Majah 851 — Perdón de los pecados pasados", fr: "Sunan Ibn Majah 851 — le pardon des péchés passés", tr: "Sunan İbn Majah 851 — Geçmiş günahların affı", id: "Sunan Ibn Majah 851 — Pengampunan dosa masa lalu" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَهِشَامُ بْنُ عَمَّارٍ، قَالاَ حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ـ قَالَ \" إِذَا أَمَّنَ الْقَارِئُ فَأَمِّنُوا فَإِنَّ الْمَلاَئِكَةَ تُؤَمِّنُ فَمَنْ وَافَقَ تَأْمِينُهُ تَأْمِينَ الْمَلاَئِكَةِ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 851، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 851 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 851، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 851 (Establecimiento de la oración y la Sunnah al respecto), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 851 (Établissement de la prière et de la Sunna à ce sujet), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "İbn Majah'ın Sünen'inde yer alan 851 numaralı hadis, geçmiş günahların affedilmesinden bahsetmektedir. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 851, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
