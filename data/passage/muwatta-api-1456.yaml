label: { ar: "موطأ مالك 1456 — وصية أو عهد أخير", en: "Muwatta Malik 1456 — a testament or parting counsel", ur: "موطأ مالک 1456 — وصیت یا آخری نصیحت", es: "Muwatta Malik 1456 — un testamento o consejo de despedida" }
text: "… هُنَا غُلاَمًا يَفَاعًا لَمْ يَحْتَلِمْ مِنْ غَسَّانَ وَوَارِثُهُ بِالشَّامِ وَهُوَ ذُو مَالٍ وَلَيْسَ لَهُ هَا هُنَا إِلاَّ ابْنَةُ عَمٍّ لَهُ. قَالَ عُمَرُ بْنُ الْخَطَّابِ فَلْيُوصِ لَهَا. قَالَ فَأَوْصَى لَهَا بِمَالٍ يُقَالُ لَهُ بِئْرُ جُشَمٍ قَالَ عَمْرُو بْنُ سُلَيْمٍ فَبِيعَ ذَلِكَ الْمَالُ بِثَلاَثِينَ أَلْفَ دِرْهَمٍ وَابْنَةُ عَمِّهِ الَّتِي أَوْصَى لَهَا هِيَ أُمُّ عَمْرِو بْنِ سُلَيْمٍ الزُّرَقِيِّ."
summary:
  ar: "حديث في موطأ مالك، رقم 1456، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1456 (Wills and Testaments), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "موطأ مالک کی حدیث نمبر 1456، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1456 (Testamentos), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
