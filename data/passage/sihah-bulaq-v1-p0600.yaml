text: |-
  وتحابوا أى أحب كل واحد منهم صاحبه والحباب بالمكسر المحاية والموادّة والحباب بالضم
  الحب قال الشاعر⁦(أبوعطاء السندى)⁩
  فوالله ما أدرى وانى اصادق * أدا عرانى من حبابك أم سحر
  والحباب أيضا الحية واغاقيل الحباب اسم شيطان لان الحية بقال لهاشيطان ومنه سمى
  الرجل وحباب الماء بالفتح معظمه قال طرفة
  يشق حباب الماء جيزومهابها * كماقسم الترب المغايل باليد
  ويقال أيضاحباب الماءنفاخاته التى تعلوه وهى اليعاليسل وتقول أيضا حبابك أن تفعل
  كذا أى غايتك والاحباب البروك والاحباب فى الأبل كالحران فى الخيل قال الشاءر
  ضرب بعبر السواذ أحبا أبوزيد يقال بغبر محب وقد أحب احبابا وهو أن يصيبه
  مرض أوكسرفلا يبرح من مكانه حتى يبرأ أويوت وقال ثعلب بقال ايضا للبعير الجسير
  محب وأنشد ١ جبت نا عالين بالسبب *فهنّ بعدكاهنّ كالمحب
  وأحب الزرع وألب اذادخل فيه الاكل وتنشأفيه الحب واللب والحبب بالتحريك تنضد
  الاسنان وقال واذا تضحك تبدى حببا والحباحب اسم رجل بخيل كان لا يوقد
  الاناراضعيفة مخافة الضيفان فضربوابها المثل حتى قالوانار الحباحب لما تقدحه الخيل
  بجوافرها قال النابغة يذكر السيوف
  تقد السلوقىّ المضاءف نسجه * ويوقدن بالصفاح نار الحباحب
  وربما قالوانار أبى حباحب وهوذباب يطير بالليل كأنه نار قال التكميت
  يرى الراءون بالشفرات منها * كتارأبى حباحب والظبينا
  وربما جعلوا الجباحب اسمالتلك النارقال الكفى
  مابال سه-مى يوقد الحباحبا * قد كنت أرجو أن يكون صائبا
  وحبان بالفتح اسم رج-ل. وضوع من الحب والجباحب بالفتح الصغار الواحد حجاب
  قال الهذلى
  دلجى اذا ما الليل جنّ *على المقرّنة الجباحب
  يعنى بالمقرته الجبال التى يدنو بعضها من بعض وحى على فعلى اسم امرأه قال هدبة
  ابن خشرم فاوجدت وجدى بها أمّ واحد * ولا وجدحى بابن أمّ كلاب ٢
  ⁦( حجب)⁩ الجاب الستر وحجاب الجوف ما يحجب بين الفؤاد وسائره وججه أى منع
  عن الدخول والاخوة يحجبون الامّ عن الثلث والمججوب الضرير وحاجب العين جعه
  حواجب وحاجب الامبر جعه حجاب واستحجبه ولاه الحجبة وحواجب الشمس نواحيها
  وقوس حاجب هوحاجب بن زرارة التممى (٣ احتجب الملك عن الناس وملك محجب
  والجبة بالتجريك رأس الورك وهماحجبتان تشرفان على الخاصرتين ( دب ، الحدب
  ما ارتفع من الارض والجمح الحداب ومنه قوله تعالى وهم من كل حدب ينساون والحدبة
  التى فى الظهر وقد حدب ظهره فهو حدب واحدودب مثله وأحدبه اللّه فهورجل أحدب
  بين الحدب وناقة جدياء اذا بدت حراقفها يقال هنّ حدب حدابير ويقال أيضاحدب
  عليه وتحدب عليه أى تعطف عليه ⁦(حرب)⁩ الحرب تؤنث يقال وقعت بينه-م حرب
  ١١
  صاح
  ١) يصف أمر
  ،أة قاست عجيزتر
  بسبب أى حبل ثم ألقته الى نساء
  الحى لفعان كمافعلت فأدرنة
  على أعجازهنّ فوجدنه فائضا
  كثير ا فغلبتهنّ اه ذكره الشارح
  فى جب بالجيم قال وجبت فلانة
  النساء تجيه-ن جبا غلبتهنّ من
  حسنها أى كماسبق فى قوله تجب
  أهل الكعنة اه
  ٢ لت هى حبى ابنسة الاسود
  من بني يحسترين عتود كان حارث
  ابن عتاب الطائى الشاءر.هواها
  فخطبها ولم ترضه وتزوّجت غيره
  من بف ثعل فطفق يه جوبى ثعل
  أوهى امرأة غيرها اه مرتضى
  مشهورة وما ألطف قول الشاغر
  تاهت عاينا بنوس حاجبها
