text: |-
  ٦٣.١
  زباب العين)
  والوريعة اسم فرس زع) وزعته أزعه وزعا كففته فاتزع هو أى كف وأوزعته
  بالشئ أغريته بدفأوزع به فهو موزع به أى مغرى به ومنه قول النابغة
  فهاب ضمران منه حيث يوزعه أى يغريه والاسم والمصدرجيعا الوزوع بالفتح واستوزعت
  اللّٰه شكره فأوزعنى أى استلهمته فألهمنى والوازع الذى يتقدم الصف فيصلحه ويقدم ويؤخر
  وفى حديث أبى بكررضى اللّٰه عنه وقد شكى اليه بعض عماله أأنا أقيد من وذعة اللّٰه وهو جع
  وازع وقال الحسن لابدللناس من وازع أى من سلطان يكفهم بقال وزعت الجيسْ
  اذا سبست أوّله-م على آخرهم قال اللّٰه تعالى فه-م يوزعون وانماسموا الكلب واز عالانه
  يكف الذتب عن الغنم والتوزيع القسءة والتفريق ويقال توزعوه فيما بينهم أى تقدعوه
  والمتزع الشديد النفسر وأوزعت الناقة بيولها اذارمت به رميا وقطعته قال الادبمعى ولا
  يكون ذلات الا اذاضربها المفحل وقواهم بها أوزاع من الناس أى بماعات والاوزاع بعن
  من همدان ومنهم الاوزاعى ⁦( سع)⁩. وسعه الشئ بالكسر يسعه سعة يقال لا يسعنى شئ
  ويضيق عنك أى وان يضبق عنك أى بل متى وسعنى شئ وسعك واغماسقطت الواومنه
  فى المستقبل لماذكرناه فى باب الهمزفى وطئ يطأ والوسع والسعة الجدة والطاقة قال تعالى
  لينفق ذويعة من سعته أى على قدرغناه وسعته والها.ءوض من الواو وأوسع الرجل أى
  سسارذ اسعة وغنى ومنه قوله تعالى والسماء بنيناها بأيدوانالموسعون أى أغنيال، فادرون
  وبقال أوسع اللّٰه عليك أى أغنال والنوسبع خلاف التضيق تقول وسعت الشئ فانسع
  واستوسع أى صارواسعاد توسعوا فى الجلس أى تفحواوذرس وساع بالفتح أى واسع
  انخطووقدوسع بالضم وساعة ووسبع ودحرض ما آن بين سعدوبنى قشيروهما الدحرضان
  الذى فى شعر عمترة ويسع اسم من أسماء العجم وقد أدخل عليه الالف واللام وهم الايدخلان
  على نظائره نحو يعمرويز يدويشكر الافى ضرورة الشعر وأنشد الفراء
  وجدنا الوليدين اليزيدمباركا * شديدا بأعياء الخلافة كاهله
  وقرئ واليسع والليسع بلامين ⁦(وشع)⁩ الوشيعة لفيفة من غزل وتسمى القصبة لتى تجعل
  النساج فيهالهة الثوب للنسج وشيعة قال الشاعر (ذوالرمة
  به ملعب من معصفات تسحنه * كنسج اليمائى برده بالوشائع
  والتوشيع اف القطن بعد الندف وكل افيفة منه وشيعة قال الراجز
  ندف القياس القعان الموشعا والوشيعة لطريقة فى البردووشعه الشيب أى علاه وحكى
  أبو عبيد وشعت الجبل وشعا أى علوته وتوشعت الغنم فى الجبل اذا ارتقت فيه ترهاه واوشعت
  الاشجار أزهرت عن أب سعيد الضرير والوشوع الوجورمن ابن السكيت مثل النشوع
  والوشبع شريحة من السعف تلق على خشيات القف وربما أقيم كالخص وسة
  خصاصها بالثمام قال كثير
  ديارعفت من عزة الصيف بعدما • تجت عليهن الوشيع المنما
  أى تجتعزة يعنى تجعله جديدا مع الوصع طائرأصغرمن العصفور وفى الجديث
  انّ اسرافيل لية واضع لله عزوجل حتى يصير كانه الوصع ⁦(وضع)⁩ الموضع المكان والموضع
  ايضا
