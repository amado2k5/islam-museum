text: "المصيبة المصيبة في البيع قبل أن يقبض صيد صيد ذكر الصيد وقتله الصيد يدخل الحرم الرخصة للمحرم في أكل الصيد الصيد يغيب مقتله المحرم يضطر إلى لحم الميتة أو الصيد حلال أعان حراماً على صيد أين يقضى فداء الصيد الصيد …"
