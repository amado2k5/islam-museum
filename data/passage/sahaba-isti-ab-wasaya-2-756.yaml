text: "… إِذا كانت الفِتْنةُ فاتخذْ سيفاً من خَشَب. رسولِه، وهو بقيَّة أبناءِ الملوكِ فلمَّا دخل عليه رحّب به، وأدناه من نفسه، وقرب مجلسه، وبسط ولم يقاتل مع علي لهذا الحديث، فلمَّا حضره الموت، قال : كفَنوني في ثوبين، قالت ابنته له …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 756، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 756, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
