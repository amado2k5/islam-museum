text: "والله إني لأشبهكم بصلاة رسول الله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف، في باب افتتاح الصلاة: كان أبو هريرة يصلي بهم فيكبر كلما خفض ورفع، فإذا انصرف أقسم أنه أشبههم صلاة بصلاة رسول الله. ويخرّجه المحقق عند البخاري (785) ومسلم (2/7) والنسائي (2/235) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (7/79). {cite:muwatta-maruf-1997 p.126}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Seleme ibn Abdülrahman ibn Avf'tan rivayetle, namazın başlangıcı bölümünde şöyle nakletmiştir: Ebu Hurayra, ellerini her indirip kaldırdığında \"Allahu Ekber\" diyerek namaza imamlık ederdi. Namazı bitirdiğinde ise, namazının Allah Resulü'nün namazına en yakın namaz olduğuna yemin ederdi. Araştırmacı, bu rivayeti Buhari (785), Müslim (2/7), Nesai (2/235), İbn Hibban, Ahmed ve Şafiî'nin Malik'in sahabelerinin rivayet zincirleriyle derlediği kaynaklara dahil etmiş ve Temhid'e (7/79) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.126}"
  id: "Diriwayatkan oleh Malik dari Ibnu Shihab dari Abu Salamah ibn Abd al-Rahman ibn Awf, dalam surah tentang pembukaan salat: Abu Hurayrah memimpin mereka salat, mengucapkan \"Allahu Akbar\" setiap kali ia menurunkan dan mengangkat tangannya. Setelah selesai, ia bersumpah bahwa salatnya adalah yang paling mirip dengan salat Rasulullah. Peneliti memasukkannya dalam kumpulan hadis al-Bukhari (785), Muslim (2/7), al-Nasa'i (2/235), Ibnu Hibban, Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (7/79). {cite:muwatta-maruf-1997 p.126}"
