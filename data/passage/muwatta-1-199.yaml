text: "والله إني لأشبهكم بصلاة رسول الله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف، في باب افتتاح الصلاة: كان أبو هريرة يصلي بهم فيكبر كلما خفض ورفع، فإذا انصرف أقسم أنه أشبههم صلاة بصلاة رسول الله. ويخرّجه المحقق عند البخاري (785) ومسلم (2/7) والنسائي (2/235) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (7/79). {cite:muwatta-maruf-1997 p.126}"
