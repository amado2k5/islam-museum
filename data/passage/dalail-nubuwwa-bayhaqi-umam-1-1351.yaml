text: "… : حدثنا عمرو يعني ابن دينار، عن عكرمة، عن ابن عباس، قال : قدم حُيَيُّ بن أخطب، وكعب بن الأشرف مكة على قريش، فحالفوهم على قتال رسول اللّٰه ولي فقالوا لهم : أنتم أهل العلم القديم وأهل الكتاب فأخبرونا عنا …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1351، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
