text: "… : حدثنا عمرو يعني ابن دينار، عن عكرمة، عن ابن عباس، قال : قدم حُيَيُّ بن أخطب، وكعب بن الأشرف مكة على قريش، فحالفوهم على قتال رسول اللّٰه ولي فقالوا لهم : أنتم أهل العلم القديم وأهل الكتاب فأخبرونا عنا …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1351، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 1351, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 1351 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
