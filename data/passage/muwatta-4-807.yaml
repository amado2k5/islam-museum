label: { ar: "الموطأ 807 — أبو سعيد ومن عند أبي بكر بن عبد الرحمن: أفطر النبي الناس في سفره عام الفتح وقال: تقووا لعدوكم، وصام رسول الله", en: "Muwatta 807", es: "Muwatta 807", fr: "Muwatta 807", ur: "موطا 807", tr: "El-Muvatta 807 — Ebu Said ve Ebu Bekr bin Abdülrahman'dan rivayet edildiğine göre: Peygamber, fetih yılındaki yolculuğu sırasında insanlarla birlikte orucunu açtı ve şöyle dedi: \"Düşmanınıza karşı kendinizi güçlendirin.\" Ve Allah'ın Resulü oruç tuttu.", id: "Al-Muwatta 807 — Abu Saeed dan dari Abu Bakr bin Abd al-Rahman: Nabi berbuka puasa bersama orang-orang selama perjalanannya pada tahun penaklukan dan berkata: “Kuatkanlah diri kalian melawan musuh kalian,” dan Rasulullah SAW berpuasa" }
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي بكر بن عبد الرحمن عن بعض أصحاب النبي، أن رسول الله أمر الناس في سفره عام الفتح بالفطر، وقال: تقووا لعدوكم، وصام رسول الله. ويروي أبو بكر عن الذي حدثه أنه رأى النبي بالعرج يصب الماء على رأسه من العطش أو من الحر، ثم قيل للنبي إن طائفة من الناس قد صاموا حين صمت، فلما كان بعد ذلك دعا بالقدح فشرب فأفطر الناس. ويذكر المحقق أن ابن عبد البر ⁦(التمهيد 22/47)⁩ قال إن الحديث مسند صحيح، ولا فرق بين أن يسمي التابعي الصحابي أو لا يسميه. {cite:muwatta-maruf-1997 p.396}"
  tr: "Malik, Ebu Bekir ibn Abdülrahman'ın azatlı kölesi Sümey'den, o da Ebu Bekir ibn Abdülrahman'dan, o da Peygamber'in bazı sahabelerinden rivayet ederek, Allah Resulü'nün Fetih yılındaki yolculuğu sırasında insanlara oruçlarını açmalarını emrettiğini, \"Düşmanınıza karşı kendinizi güçlendirin\" dediğini ve kendisinin de oruç tuttuğunu nakletmiştir. Ebu Bekir, kendisine anlatan kişiden rivayet ederek, Peygamber'i Erj'de susuzluktan veya sıcaktan başının üzerine su dökerken gördüğünü söylemiştir. Daha sonra Peygamber'e, kendisi oruç tutarken bir grup insanın da oruç tuttuğu söylenmiştir. Bunun üzerine Peygamber bir kap istemiş ve içmiş, insanlar da oruçlarını açmışlardır. Araştırmacı, İbn Abdülberr'in (el-Temhid 22/47) hadisin sahih olduğunu ve sağlam bir isnad zincirine sahip olduğunu, Sahabenin adının geçmesi veya geçmemesi arasında bir fark olmadığını söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.396}"
  id: "Malik meriwayatkannya dari Sumayy, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, dari Abu Bakr ibn Abd al-Rahman, dari beberapa sahabat Nabi, bahwa Rasulullah memerintahkan orang-orang untuk berbuka puasa selama perjalanannya pada tahun Penaklukan, seraya berkata, \"Kuatkanlah diri kalian melawan musuh kalian,\" dan Rasulullah berpuasa. Abu Bakr meriwayatkan dari seseorang yang memberitahunya bahwa ia melihat Nabi di al-Arj menuangkan air ke atas kepalanya karena haus atau panas. Kemudian dikatakan kepada Nabi bahwa sekelompok orang telah berpuasa ketika beliau berpuasa. Setelah itu, beliau meminta cangkir dan minum, dan orang-orang berbuka puasa. Peneliti menyebutkan bahwa Ibnu Abd al-Barr (al-Tamhid 22/47) mengatakan bahwa hadits tersebut sahih dan memiliki sanad yang baik, dan tidak ada perbedaan antara Penerus menyebut nama Sahabat atau tidak. {mengutip:muwatta-maruf-1997 hal.396}"
