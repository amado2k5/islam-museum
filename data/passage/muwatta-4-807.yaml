label: { ar: "الموطأ 807 — أبو سعيد ومن عند أبي بكر بن عبد الرحمن: أفطر النبي الناس في سفره عام الفتح وقال: تقووا لعدوكم، وصام رسول الله", en: "Muwatta 807" }
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي بكر بن عبد الرحمن عن بعض أصحاب النبي، أن رسول الله أمر الناس في سفره عام الفتح بالفطر، وقال: تقووا لعدوكم، وصام رسول الله. ويروي أبو بكر عن الذي حدثه أنه رأى النبي بالعرج يصب الماء على رأسه من العطش أو من الحر، ثم قيل للنبي إن طائفة من الناس قد صاموا حين صمت، فلما كان بعد ذلك دعا بالقدح فشرب فأفطر الناس. ويذكر المحقق أن ابن عبد البر (التمهيد 22/47) قال إن الحديث مسند صحيح، ولا فرق بين أن يسمي التابعي الصحابي أو لا يسميه. {cite:muwatta-maruf-1997 p.396}"
