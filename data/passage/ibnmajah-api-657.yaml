label: { ar: "سنن ابن ماجه 657 — الجراحة والختان والجبائر", en: "Sunan Ibn Majah 657 — surgery, circumcision and splints", ur: "سنن ابن ماجہ 657 — جراحت، ختنہ اور پٹیاں", es: "Sunan Ibn Majah 657 — cirugía, circuncisión y férulas", fr: "Sunan Ibn Majah 657 — chirurgie, circoncision et attelles", tr: "Sunan İbn Majah 657 — Cerrahi, Sünnet ve Ateller", id: "Sunan Ibn Majah 657 — Pembedahan, Sunat dan Bidai" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ أَبَانَ الْبَلْخِيُّ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَنْبَأَنَا إِسْرَائِيلُ، عَنْ عَمْرِو بْنِ خَالِدٍ، عَنْ زَيْدِ بْنِ عَلِيٍّ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، قَالَ انْكَسَرَتْ إِحْدَى زَنْدَىَّ فَسَأَلْتُ النَّبِيَّ ـ فَأَمَرَنِي أَنْ أَمْسَحَ عَلَى الْجَبَائِرِ. قَالَ أَبُو الْحَسَنِ بْنُ سَلَمَةَ أَنْبَأَنَا الدَّبَرِيُّ، عَنْ عَبْدِ الرَّزَّاقِ، نَحْوَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 657، يذكر الجراحة والختان والجبائر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 657 (The Book of Purification and its Sunnah), that mentions surgery, circumcision and splints. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 657، جس میں جراحت، ختنہ اور پٹیاں کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 657 (El Libro de la Purificación y su Sunnah), menciona la cirugía, la circuncisión y las férulas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 657 (Le Livre de la Purification et sa Sunna), mentionne la chirurgie, la circoncision et les attelles. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 657 numaralı hadiste cerrahi, sünnet ve atelden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 657, menyebutkan tentang pembedahan, khitanan, dan bidai. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
