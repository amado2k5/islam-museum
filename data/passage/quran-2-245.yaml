text: "مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًا فَيُضَـٰعِفَهُۥ لَهُۥٓ أَضْعَافًا كَثِيرَةً ۚ وَٱللَّهُ يَقْبِضُ وَيَبْصُۜطُ وَإِلَيْهِ تُرْجَعُونَ"
text_search: "من ذا الذي يقرض الله قرضا حسنا فيضاعفه له أضعافا كثيرة ۚ والله يقبض ويبسط وإليه ترجعون"
translations:
  en: { text: "Who is it that will lend unto Allah a goodly loan, so that He may give it increase manifold? Allah straiteneth and enlargeth. Unto Him ye will return.", translator: "Marmaduke Pickthall", license: PD }
