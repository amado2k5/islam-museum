text: "… عَظِيمٌ. أذى النَّضر للرسول لَ لِلِ وكان النضر بن الحارث مِنْ شَيَاطِينِ قريش، وممّن كان يؤذي رَسُول اللّٰه وَلِيِ ويَنْصب له العَدَاوَةَ، وكان قد قَدِمَ الحيرةَ وتعلّم بها أحاديثَ ملوكِ الفُرْسِ وأحاديثَ رُسْتم واسفنديار، فكان إذا جَلَس رسولُ اللّٰه وَلَ …"
