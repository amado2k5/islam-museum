text: "وَقَالَ إِسْمَاعِيلُ بْنُ خَلِيلٍ أَخْبَرَنَا عَلِيُّ بْنُ مُسْهِرٍ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتِ اسْتَأْذَنَتْ هَالَةُ بِنْتُ خُوَيْلِدٍ أُخْتُ خَدِيجَةَ عَلَى رَسُولِ اللَّهِ، فَعَرَفَ اسْتِئْذَانَ خَدِيجَةَ فَارْتَاعَ لِذَلِكَ، فَقَالَ \" اللَّهُمَّ هَالَةَ \". قَالَتْ فَغِرْتُ فَقُلْتُ مَا تَذْكُرُ مِنْ عَجُوزٍ مِنْ عَجَائِزِ قُرَيْشٍ، حَمْرَاءِ الشِّدْقَيْنِ، هَلَكَتْ فِي الدَّهْرِ، قَدْ، أَبْدَلَكَ اللَّهُ خَيْرًا مِنْهَا"
summary:
  ar: "حديث في صحيح البخاري، رقم 3821، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3821 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3821، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
