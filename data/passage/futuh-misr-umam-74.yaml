text: "… فرعون وطغى، فقتله اللّٰه تعالى، صرعته دابّته، فدقّت عنقه، فمات. حدثنا أسد بنو موسى عن خالد بن عبد الله، حدثنا الكلامِيّ عن تبيع عن كعب قال : لا مات سليمان بن داود ملك بعده مَرْحب عمّ ليس في كتب التاريخ …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 74، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 74, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 74 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
