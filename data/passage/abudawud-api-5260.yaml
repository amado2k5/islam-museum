label: { ar: "سنن أبي داود 5260 — الأب والأبوة", en: "Sunan Abi Dawud 5260 — the father and fatherhood", ur: "سنن ابی داؤد 5260 — باپ اور والدیت", es: "Sunan Abi Dawud 5260 — El padre y la paternidad", fr: "Sunan Abi Dawud 5260 — Le père et la paternité", tr: "Sunan Abi Dawud 5260 — Baba ve Babalık", id: "Sunan Abi Dawud 5260 — Sang Ayah dan Peran Ayah" }
text: "… سُلَيْمَانَ، عَنْ عَلِيِّ بْنِ هَاشِمٍ، حَدَّثَنَا ابْنُ أَبِي لَيْلَى، عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ سُئِلَ عَنْ حَيَّاتِ الْبُيُوتِ فَقَالَ \" إِذَا رَأَيْتُمْ مِنْهُنَّ شَيْئًا فِي مَسَاكِنِكُمْ فَقُولُوا أَنْشُدُكُنَّ الْعَهْدَ الَّذِي أَخَذَ عَلَيْكُنَّ نُوحٌ أَنْشُدُكُنَّ الْعَهْدَ الَّذِي أَخَذَ عَلَيْكُنَّ سُلَيْمَانُ أَنْ لاَ تُؤْذُونَا فَإِنْ عُدْنَ فَاقْتُلُوهُنَّ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5260، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5260 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5260، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5260 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 5260 (Guide pratique), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 5260 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 5260, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
