text: "… بعد ؛ فإن الدنيا دار مخيفة، إنما أهبط آدم من الجنة إليها عقوبة، واعلم أن صرعتها ليست كالصرعة، من أكرمها يهن، ولها فى كل حين قتيل. فكن فيها يا أمير المؤمنين كالمداوى جرحه يصير على شدة الدواء خيفة طول البلاء …"
