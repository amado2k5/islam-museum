  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 148, that mentions the treatment of wounds, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 148 کا اقتباس جس میں زخموں کا علاج، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
