  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 2. cildinin 148. sayfasında yer alan, yaraların tedavisi ve ilaçlarla ilgili bir pasaj; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
