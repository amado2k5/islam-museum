summary:
  ar: "يرويه مالك عن نافع، أن عبد الله بن عمر كان لا يقرأ في الصلاة على الجنازة. ويذكر المحقق أنه رواه عن مالك سويد بن سعيد (397). {cite:muwatta-maruf-1997 p.313}"
  tr: "Malik, Nafi’den rivayet ettiğine göre, Abdullah ibn Umar cenaze namazında hiçbir şey okumamıştır. Araştırmacı, bunun Suwaid ibn Sa’id (397) tarafından Malik’ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.313}"
  id: "Malik meriwayatkannya dari Nafi’, bahwa Abdullah ibn Umar tidak membaca apa pun dalam salat jenazah. Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Suwaid ibn Sa’id (397). {cite:muwatta-maruf-1997 p.313}"
