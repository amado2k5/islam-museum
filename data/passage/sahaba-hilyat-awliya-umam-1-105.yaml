text: "- - وأميرهم عثمان بن مظعون. فمكث هو وأصحابه بأرض الحبشة حق أنزات مدورة والنجم، وكان عنمان بن مظعون وأصحابه ممن رجع فلا يستطيعوا أن.يدخلوا مكة حين بلغهم شمدة المشركين على المسلمين إلا يجوار، فأجار الوليد بن المغيرة عثمان بن …"
