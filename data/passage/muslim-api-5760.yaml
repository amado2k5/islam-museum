label: { ar: "صحيح مسلم 5760 — الحمى", en: "Sahih Muslim 5760 — fever", ur: "صحیح مسلم 5760 — بخار", es: "Sahih Muslim 5760 — fiebre", fr: "Sahih Muslim 5760 — fièvre", tr: "Sahih Muslim 5760 — Ateş", id: "Sahih Muslim 5760 — Demam" }
text: "… وَمُحَمَّدُ بْنُ الْمُثَنَّى، وَمُحَمَّدُ بْنُ حَاتِمٍ، وَأَبُو بَكْرِ بْنُ نَافِعٍ قَالُوا حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، عَنْ سُفْيَانَ، عَنْ أَبِيهِ، عَنْ عَبَايَةَ بْنِ رِفَاعَةَ، حَدَّثَنِي رَافِعُ بْنُ خَدِيجٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" الْحُمَّى مِنْ فَوْرِ جَهَنَّمَ فَابْرُدُوهَا عَنْكُمْ بِالْمَاءِ \". وَلَمْ يَذْكُرْ أَبُو بَكْرٍ \" عَنْكُمْ \". وَقَالَ قَالَ أَخْبَرَنِي رَافِعُ بْنُ خَدِيجٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5760، يذكر الحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5760 (The Book of Greetings), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5760، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5760 (El Libro de los Saludos), menciona la fiebre. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5760 (Livre des salutations), mentionne la fièvre. Le dictionnaire médical le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5760 numaralı hadis, ateşten bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5760, menyebutkan tentang demam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
