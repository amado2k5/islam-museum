text: "… : قولُه لِيِ : لا يكونُ المُؤمنُ مؤمناً حتّى لا يرضى لأخيه إلا ما يرضى لنفسه ورد هذا الحديث بهذا اللفظ عند السيوطي في شرحه لسنن النسائي، وورد الحديث بلفظ : لا يؤمن أحدكم حتى يُحب لأخيه، أو لجاره ما …"
