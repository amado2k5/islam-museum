text: |-
  *⁦(باب الواو والياء)⁩*
  ٤٦١
  فأسذانى وأحذيته من الغنيمة اذا أعطيته منها والاسم الهذيا على فعلى بالضم وهى القسمة
  من الغنيمسة وحذاء الشىء ازاؤه يقال جلس بحذائه وحاذاه أى صاربحذائه واحتذى مثاله
  أى اقتدى به والحذية على فعيلة مثل الحذيا من الغنيمة وكذلك الحذوة بالكسرويقال أيضا
  دارى حذوة داره وحذوة داره بالضم وحذة داره أى حذاء داره والحذية بالسكسر القطعة
  من اللحم قطعت طولا حرا . يقال انى لاجدلهذا الطعام ووة وحراوة أى حرارة وذلك
  من حرافة كل شي يؤكل والحراة الساحة والعقوة والناحية وكذلك الحرامقصور بقال
  اذهب فلا أرينك بجراى وحراتى ويقال لاتطر حرانا أى لا تقرب ما حولنا يقال نزلت بجراه
  وعراه والحراة أيضا الصوت والجلبة وصوت التهاب الناروحفيف الشجر والحرى أيضا
  موضع يض النعامة ويحدّث الرجل الرحل فيقول بالمرى أن يكون كذا وهذا الامر
  محراة لذلك أى مقمنة مثل مجماة وما أجراء مث-ل ما أحجاه وأحربه منل أج به ويقال هو
  حرى أن يفعل بالفتح أى خليق وجدير ولا ينى ولا يجمع وأنشد الكسائى
  وهنّ حرى أن لا يثبنك نقرة * وانت حرى بالنارحين تثيب
  واذا قلت هوحوبكسراراء وحرى ع-لي فعيل ثنيت وجمعت فقلت هماحر يان وهم حريون
  وأجرياء وهى حية وهنّ حريات وحرايا وأنتم أحوامجع حرومنه اشتق التحتزى فى الاشياء
  ونحوها وهو طلب ماهو أحرى بالاستعمال فى عالب الظنّ كما اشتق التقمن من القمن وفلان
  يتهرى الامر أى يتوخاه ويقصده وتحزى فلان بالمكان أى تسكث وقوله تعالى فأولئك تحروا
  رشدا أى توخوا وعمدوا عن أبى عبيدة وأنشدلامرئ القيس
  ديمة هطلاء فيها وطف +طبق الارض تحرّى وتدر
  وحوى الشئ ريا اذا نقص يقال يحرى كمايرى القمر وأحراه الزمان والحارية الانعى التى ل
  نقص حستمها من الكبر وذلك أخبت ما يسكون منها يقال برماه اللّه بأفعى حارية وحراء
  باليكسبر والمدجيل بمكة يذكرويؤنث وقال
  ألسناأكرم النقلين طرًا • وأعظمهم ببطن حواءنارا
  فلم يضرفه لأنه ذهب به الى البلدة التى هو بها زا حزا الشى يحزيه ويحزوه اذا قدر
  وخرص يقال حزيت النخل وحزا السراب الشخص يخزوه ويحزيه اذارفعه والحازى
  الذى ينتظر فى الاعضاء وفى خيلان الوجه يشكهن وحزوى بالضم اسم عجمة من عجم الدهناء
  وهى رملة لها جهور عظيم تعلوتلك الهاهير قال ذوالرمة
  نيت عيناك عن طلل بحزوى * عفته الريح وامتح القطارا
  والتسبة اليهاحزاوى قال ذو الرمّة
  جزاوية أوعوهج معقلية * ترود باعطاف الرمال الحرائر
  وكذلك الحساء بالفتح والمدتقول شريت جساء وحوًا ويقال أيضارجل حوللكثير الحسو
  وقال أيوذبيان بن الرعبل ان أبغض الشبيوخ الى" الحسوّالقسوّ الاقلح الاملح وقد حسوت
  حسوة واحدة وفى الاناء حسوة بالضم أى قدر ما يحسى مرّة واحدة وأحسيته المرق فحساه
  ٥١٦
