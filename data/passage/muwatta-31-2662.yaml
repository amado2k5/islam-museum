label: { ar: "الموطأ 2662 — أبو هريرة: نهي عن لبستين وبيعتين والاحتباء في ثوب واحد والاشتمال", en: "Muwatta 2662", es: "Muwatta 2662", fr: "Muwatta 2662", ur: "موطا 2662", tr: "El-Muvatta 2662 — Ebu Hurayra: İki farklı elbise giymeyi, iki farklı gömlek giymeyi, tek bir elbiseyle dizleri göğsüne çekerek oturmayı ve kendini bir örtüye sarmayı yasakladı." }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أنه قال: نهى رسول الله عن لبستين وعن بيعتين: عن الملامسة والمنابذة، وعن أن يحتبي الرجل في ثوب واحد ليس على فرجه منه شيء، وعن أن يشتمل الرجل بالثوب الواحد على أحد شقيه. {cite:muwatta-maruf-1997 p.503} {cite:muwatta-maruf-1997 p.504}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ederek şöyle buyurduğunu nakletmiştir: Allah Resulü iki çeşit giysiyi ve iki çeşit işlemi yasaklamıştır: dokunmak ve atmak; bir erkeğin dizlerini bükerek tek bir giysiyle oturması ve bu giysinin mahrem yerlerini örtmemesi; bir erkeğin de vücudunun sadece bir tarafını örtecek şekilde tek bir giysiyle sarınması. {cite:muwatta-maruf-1997 s.503} {cite:muwatta-maruf-1997 s.504}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa beliau berkata: Rasulullah SAW melarang dua jenis pakaian dan dua jenis transaksi: menyentuh dan melempar, dan seorang laki-laki yang duduk dengan lutut ditekuk mengenakan pakaian tunggal yang tidak menutupi kemaluannya, dan seorang laki-laki yang membungkus dirinya dengan pakaian tunggal yang hanya menutupi satu sisi tubuhnya. {cite:muwatta-maruf-1997 p.503} {cite:muwatta-maruf-1997 p.504}"
