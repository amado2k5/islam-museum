summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أنه قال: نهى رسول الله عن لبستين وعن بيعتين: عن الملامسة والمنابذة، وعن أن يحتبي الرجل في ثوب واحد ليس على فرجه منه شيء، وعن أن يشتمل الرجل بالثوب الواحد على أحد شقيه. {cite:muwatta-maruf-1997 p.503} {cite:muwatta-maruf-1997 p.504}"
