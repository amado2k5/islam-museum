text: "م على بينة، ويسأل الحاكم الحكم عليه، فيحكم عليه، ويسأله أن يكتب له كتابا يحمله إلى قاضي البلد الذي فيه الغائب، فيكتب له إليه، أو تقوم الينة على حاضر، فيهرب قبل الحكم عليه، فيسأل صاحب الحق الحاكم الحكم عليه، وأن"
