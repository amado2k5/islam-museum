summary:
  ar: "قال مالك: وإذا ضرب النفر الرجل حتى يموت تحت أيديهم قُتلوا به جميعا. فإن هو مات بعد ضربهم كانت القسامة. وإذا كانت القسامة لم تكن إلا على رجل واحد، ولم يُقتل غيره، ولم نعلم قسامة كانت قط إلا على رجل واحد. {cite:muwatta-maruf-1997 p.456} {cite:muwatta-maruf-1997 p.457}"
