label: { ar: "الموطأ 2584 — مالك: الجماعة الذين يضربون رجلا فيموت تحت أيديهم", en: "Muwatta 2584", es: "Muwatta 2584", fr: "Muwatta 2584", ur: "موطا 2584", tr: "Al-Muwatta 2584 — Malik: Bir adamı dövüp öldüren topluluk.", id: "Al-Muwatta 2584 — Malik: Sekelompok orang yang memukuli seseorang dan orang itu meninggal di tangan mereka" }
summary:
  ar: "قال مالك: وإذا ضرب النفر الرجل حتى يموت تحت أيديهم قُتلوا به جميعا. فإن هو مات بعد ضربهم كانت القسامة. وإذا كانت القسامة لم تكن إلا على رجل واحد، ولم يُقتل غيره، ولم نعلم قسامة كانت قط إلا على رجل واحد. {cite:muwatta-maruf-1997 p.456} {cite:muwatta-maruf-1997 p.457}"
  tr: "Malik şöyle dedi: Bir grup adam bir adamı ellerinde döverek öldürürse, karşılık olarak hepsi öldürülmelidir. Eğer adam dövüldükten sonra ölürse, o zaman kasama yemini gereklidir. Ve eğer kasama yemini gerekiyorsa, bu sadece bir kişi için geçerlidir ve başka kimse öldürülmez. Kasama yemininin birden fazla kişi için istendiği hiçbir örneğe rastlamadık. {cite:muwatta-maruf-1997 s.456} {cite:muwatta-maruf-1997 s.457}"
  id: "Malik berkata: Jika sekelompok orang memukuli seseorang hingga mati di tangan mereka, maka mereka semua harus dibunuh sebagai pembalasan. Jika orang itu meninggal setelah dipukuli, maka sumpah penyucian (qasama) diwajibkan. Dan jika sumpah penyucian diwajibkan, itu hanya terhadap satu orang, dan tidak ada orang lain yang dibunuh. Kami tidak mengetahui adanya kasus di mana sumpah penyucian pernah diwajibkan terhadap lebih dari satu orang. {cite:muwatta-maruf-1997 p.456} {cite:muwatta-maruf-1997 p.457}"
