text: "أسياف، وفي الأخرى ستّة أسياف وأدراع، منها درع كسرى ومغافره، ودرع هِرَقّل، ودرع خاقان ملك الترك، ودرع داهر ملك الهند، ودرع بهرام جوبين، ودرع سياوخش، ودرع النعمان، استلبها الفرس أيّام غزاهم خاقان وهِرَقل وداهر، وأما النعمان وجوبين فحين هربا من …"
summary:
