text: |-
  ١ ا ظر الصبان على الاشمونى
  فى وجه رسم لم ترابالالف لابالياه
  وال نصر
  ٤٥٨
  مشرسون أى ترعى ابلهم الشرس وأرض مشرسة كثيرة الشرس عن يعقوب ⁦(شكس)⁩
  رجل شكس بالتسكين أى صعب الخلق قال الراجز
  شكس هبوس عنبس عذور
  وقوم شكس مثال رحل صدق وقوم صدق وقد شكس بالكسر شكاسة وحكى الفرّاءرجل
  شكسوهوالقياس مس الشمس تجمع على شهوس كأنهسم جعلوا كل ناحيسة منها
  شمساكاقالواللمفرق مفارق قال الشاءر
  حى الحديد عليهم فكانه * ومضان برق أوشعاع شموس
  وتصغيرها شميسة وقد شمس يومنا يشمس ويشمس اذا كان ذاشمس وأشمس يومنا بالالف كذلك
  وشم الفرس أيضاشموسا وشماسا أى منع ظهره فهوفرس شموس وبه شملس ورجل
  شموس صعب انطلق ولا نقل شموص وشمس لى فلان اذا أبدى لك عداوته والشمس ضرب من
  القلائدوشىْ مشهس أى عمل فى الشمس وتشمس أى انتصب للشمس قال ذوالرمة
  كأنيدى حرباتها متشما * يدامذنب يستغفرالله تائب
  وقد سمت العرب عبدد شمس والنسبة اليه عشمى لانّ فى النسبة الى كل اسم مضاف ثلاثة
  مذاهب ان شئت نسبت الى الأوّل منه-ما كقولك عبدىً اذانسبت الى عبد القيس قال
  الشاعر
  وهم صلبوا العبدى فى جذع فخلة فلاعطست شيبان الابأجدعا
  وان شئت نسبت الى الثانى اذاخفت الليس فقلت شمسى كماقل مطلبى اذانسبت الى عبد
  المطلب وان شئت أخسذت من الأوّل حرفين ومن الشانى حرفين فرددت الاسم الى الرباعى ثم
  نسبت اليه فقلت عبدرى اذانسبت الى عبد الداروالى عبد شمس عبشى قال الشاءر
  وتضكمنى شيخة عشمية * كأن لم تراقبلى أسيرايماتيا ١
  وقد تعبشم الرجل كماتة ول تعبقس اذا تعلق بسبب من أسباب عبد القيس اما يحلف أوجوار
  أوولا« واما هبشمس بن زيدمناة بن تميم فان أباعمروبن العلاء يقول أصله عبّ شمس أى
  حب تشمس وهوضوها والعين مبدلة من الحاءكما قال فى عب قزوهو السبرد وقال ابن
  الاعرابى اسممعب«شمس بالهمز والعب» والعب« العدل أى هو عدلها وتظيرها يفتح
  ويكسر ⁦(شوس)⁩ الشوس بالتحريك النظر بمؤخر العين تسكبرا أوتغيظا والرجسل أشوص:
  من قوم شوس قال أبو عمرويقسال تشاوس اليه وهو أن ينظار اليه بمؤخر عينه ويميل وجهه
  فى شق العين التى ينظريجا
  ضيس أى شرص عسر شكس رس ضرس السنّ ودومذ كرمادام له هذا الاسم
  لانّ الاسنان كلها اناث الا الاضراس والانياب وربماجمع على ضروس وقال الشاءر
  بصف قرادا
  وماذ كرفان يكبرفانى * شديد الازم ليس له ضروس
  لانه اذا كان صغيرا كان رادا فاذا كبرسمى جلمسة والضرس أيضاأكمة خشنة والضرس
  أيضا المطرة القليلة والجمع ضروس قال الاصمعى يقال وقعت فى الارض ضروس من مطراذا
  وقعت فيها قطع متفرّفة والضرس بالفتح العضَ الشديد بالاضراس يقال ضبرست السهم
  اذا عهمته قال دريد ين الصمة
  واحمر
