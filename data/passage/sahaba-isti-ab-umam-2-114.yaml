  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 2. cildinin 114. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 2 bergambar, halaman 114, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
