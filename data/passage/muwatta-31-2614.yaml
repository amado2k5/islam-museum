summary:
  ar: "يروي مالك عن ابن شهاب عن سالم بن عبد الله أن عمر بن الخطاب إنما رجع بالناس عن حديث عبد الرحمن بن عوف. {cite:muwatta-maruf-1997 p.476}"
  tr: "Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan rivayet ettiğine göre, Ömer ibn el-Hattab, insanları sadece Abdülrahman ibn Avf'ın hadisinden geri çevirmiştir. {cite:muwatta-maruf-1997 s.476}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Salim ibn Abdullah, bahwa Umar ibn al-Khattab hanya berpaling dari hadits Abd al-Rahman ibn Awf. {cite:muwatta-maruf-1997 p.476}"
