label:
  ar: "الترمذي 3543 — إن رحمتي سبقت غضبي"
  en: "Tirmidhi 3543 — My mercy outstrips My anger"
  ur: "ترمذی 3543 — میری رحمت میرے غضب پر سبقت لے گئی"
text: "إن الله حين خلق الخلق كتب بيده على نفسه إن رحمتي تغلب غضبي . قال أبو عيسى هذا حديث حسن صحيح غريب ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3543: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3543: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3543: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
