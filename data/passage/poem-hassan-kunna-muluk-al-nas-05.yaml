text: وجارُهم موفٍ بعلياء بيتُه له ما ثوى فينا الكرامةُ والبذلُ
summary:
  ar: بيت من القصيدة اللامية لحسان في فخر الأنصار، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.394}}. ينسب ابن هشام إلى غير ابن إسحاق بيتاً من هذه القصيدة، وهو مذكور في موضعه من السيرة.
  en: Hassan says that the Ansar keep faith with their neighbours, and that the generosity and giving have stayed among them.
  es: "Hassan afirma que los Ansar son leales a sus vecinos, y que la generosidad y la generosidad se han mantenido entre ellos."
  fr: "Hassan affirme que les Ansar restent fidèles à leurs voisins et que la générosité et le sens du don sont restés parmi eux."
