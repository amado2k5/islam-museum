text: "… من تبعات حُرم عليه أن يتزوج بأكثر من واحدة. بل إذا خاف الجور بعجزه عن القيام بحق المرأة الواحدة حرم عليه أن يتزوج حتى تتحقق له القدرة على الزواج. وهذا التعدد ليس واجبًا ولا مندوبًا، وإنما هو أمر أباحه الإسلام، …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 193، يرد فيه ذكر الواجب، والمندوب، والمباح، وما حُرّم على الناس؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 193, whose wording mentions the obligatory (wajib), the recommended (mandub), the permitted (mubah), what was forbidden to people; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 193 کا اقتباس جس میں واجب، مندوب، مباح، جو لوگوں پر حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
