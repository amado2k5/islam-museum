label: { ar: "الموطأ 183 — مالك: المؤذن الذي صلى وحده لا يعيد مع من جاء بعده", en: "Muwatta 183", es: "Muwatta 183", fr: "Muwatta 183", ur: "موطا 183", tr: "El-Muvatta 183 — Malik: Tek başına namaz kılan müezzin, kendisinden sonra gelenlerle birlikte namazı tekrarlamaz.", id: "Al-Muwatta 183 — Malik: Muazin yang salat sendirian tidak mengulangi salatnya dengan orang-orang yang datang setelahnya." }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما جاء في النداء للصلاة: سُئل عن مؤذن أذّن لقوم ثم انتظر فلم يأته أحد فأقام وصلى وحده ثم جاء الناس بعد أن فرغ، أيعيد الصلاة معهم؟ فقال: لا يعيد الصلاة، ومن جاء بعد انصرافه فليصل لنفسه وحده. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.119}"
  tr: "Malik'in, Yahya'nın ezan bölümünde rivayet ettiği bir fetvası şöyledir: Bir müezzinin ezan okuyup bir grup insanı bekledikten sonra kimsenin gelmemesi üzerine, ikametini okuyup tek başına namaz kılması istenmiştir. Müezzin namazı bitirdikten sonra insanlar gelmiş ve onlarla birlikte namazı tekrar kılmalı mıdır? Müezzin şöyle demiştir: Namazı tekrar kılmamalıdır. Müezzin ayrıldıktan sonra gelen herkes tek başına namaz kılmalıdır. Araştırmacı, bu fetvanın Ebu Musab tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.119}"
  id: "Fatwa Malik, diriwayatkan oleh Yahya dalam surah tentang seruan azan: Beliau ditanya tentang seorang muazin yang mengumandangkan azan untuk sekelompok orang, kemudian menunggu, tetapi tidak ada yang datang. Maka beliau melakukan iqamah dan salat sendirian. Kemudian orang-orang datang setelah beliau selesai. Haruskah beliau mengulangi salat bersama mereka? Beliau berkata: Beliau tidak perlu mengulangi salat. Siapa pun yang datang setelah beliau pergi hendaknya salat sendirian. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.119}"
