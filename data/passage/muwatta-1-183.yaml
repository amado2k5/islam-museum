summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما جاء في النداء للصلاة: سُئل عن مؤذن أذّن لقوم ثم انتظر فلم يأته أحد فأقام وصلى وحده ثم جاء الناس بعد أن فرغ، أيعيد الصلاة معهم؟ فقال: لا يعيد الصلاة، ومن جاء بعد انصرافه فليصل لنفسه وحده. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.119}"
