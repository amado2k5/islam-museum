  ar: "صحيح مسلم، كتاب الزكاة"
  en: "Sahih Muslim, Book 12: The Book of Zakat"
  ur: "صحیح مسلم، کتاب الزکاۃ"
  es: "Sahih Muslim, Libro 12: El Libro del Zakat"
  fr: "Sahih Muslim, Livre 12: Le Livre de la Zakat"
summary:
  ar: "القسم 12 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزكاة»، ويضم فيها النصوص من 2263 إلى 2494 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 12 of Sahih Muslim (The Book of Zakat) in the division of the open hadith dataset the museum took its reports from: reports 2263 to 2494 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 12، عنوان «کتاب الزکاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2263 تا 2494۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 12 de Sahih Muslim (El Libro del Zakat) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2263 al 2494, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses données du Sahih Muslim (Livre de la Zakat), volume 12, dans la base de données de hadiths ouverte: les hadiths 2263 à 2494. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
