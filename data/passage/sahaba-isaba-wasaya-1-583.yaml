text: "… ثم فتح مكة، ثم وفدت عليه الوفود. وجزم أبْنُ عَبْدِ البَرِّ عنه بأنه أسلم قبل وفاة النبي وَلفي بأربعين يوماً وهو غلط؛ ففي الصّحيحين عنه أن النبي لي قال له: اسْتَنْصت النَّاسَ في حَجَّةِ الوَدَاعِ. وجزم الَواقِدِيُّ بأنه وفد على …"
