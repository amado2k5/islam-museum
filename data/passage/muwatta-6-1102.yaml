label: { ar: "الموطأ 1102 — ابن شهاب: أن رسول الله بعث عبد الله بن حذافة أيام منى يطوف، يقول: إنما هي أيام أكل وشرب وذكر الله", en: "Muwatta 1102", es: "Muwatta 1102", fr: "Muwatta 1102", ur: "موطا 1102", tr: "El-Muvatta 1102 — İbn Şihab: Allah'ın Resulü, Mina günlerinde Abdullah bin Hudefa'yı tavaf yapması için gönderdi ve şöyle buyurdu: \"Bunlar sadece yeme, içme ve Allah'ı anma günleridir.\"", id: "Al-Muwatta 1102 — Ibn Shihab: Rasulullah SAW mengutus Abdullah bin Hudhafa pada masa Mina untuk melaksanakan Tawaf, seraya berkata: \"Ini hanyalah hari-hari untuk makan, minum, dan mengingat Allah.\"" }
text: "إنما هي أيام أكل وشرب وذكر الله"
summary:
  ar: "يرويه مالك عن ابن شهاب أن رسول الله بعث عبد الله بن حذافة أيام منى يطوف، يقول: إنما هي أيام أكل وشرب وذكر الله. ويذكر المحقق أن الحديث عند يونس بن يزيد وابن أبي ذئب وعبد الله بن عمر العمري عن الزهري مرسلاً كما رواه مالك، وأنه الصحيح في حديث ابن شهاب، وأنه في سند روح بن عبادة عن صالح بن أبي الأخضر وهو خطأ. {cite:muwatta-maruf-1997 p.505}"
  tr: "Malik, İbn Şihab'dan rivayetle, Allah Resulü'nün Mina günlerinde Abdullah ibn Hudefe'yi tavaf yapması için gönderdiğini ve şöyle buyurduğunu aktarır: \"Bunlar yeme, içme ve Allah'ı anma günleridir.\" Araştırmacı, hadisin Yunus ibn Yazid, İbn Abi Dhi'b ve Abdullah ibn Umar al-Umari'nin rivayetlerinde, el-Zuhri'nin naziliyetiyle, Malik'in naklettiği gibi mursal bir hadis olarak bulunduğunu belirtir. Bunun İbn Şihab hadisindeki doğru versiyon olduğunu ve Ruh ibn Ubadah'ın Salih ibn Abi al-Akhdar'dan rivayet zincirinde yer aldığını, bunun ise bir hata olduğunu ifade eder. {cite:muwatta-maruf-1997 s.505}"
  id: "Malik meriwayatkan dari Ibn Shihab bahwa Rasulullah SAW mengutus Abdullah ibn Hudhafah pada hari-hari Mina untuk melaksanakan Tawaf, seraya berkata: \"Ini adalah hari-hari untuk makan, minum, dan mengingat Allah.\" Peneliti menyebutkan bahwa hadits ini terdapat dalam riwayat Yunus ibn Yazid, Ibn Abi Dhi'b, dan Abdullah ibn Umar al-Umari, berdasarkan riwayat al-Zuhri, sebagai hadits mursal, sebagaimana diriwayatkan oleh Malik. Ia menyatakan bahwa ini adalah versi yang benar dalam hadits Ibn Shihab, dan bahwa hadits ini muncul dalam sanad Ruh ibn Ubadah berdasarkan riwayat Salih ibn Abi al-Akhdar, yang merupakan kesalahan. {cite:muwatta-maruf-1997 p.505}"
