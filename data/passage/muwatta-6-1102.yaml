text: "إنما هي أيام أكل وشرب وذكر الله"
summary:
  ar: "يرويه مالك عن ابن شهاب أن رسول الله بعث عبد الله بن حذافة أيام منى يطوف، يقول: إنما هي أيام أكل وشرب وذكر الله. ويذكر المحقق أن الحديث عند يونس بن يزيد وابن أبي ذئب وعبد الله بن عمر العمري عن الزهري مرسلاً كما رواه مالك، وأنه الصحيح في حديث ابن شهاب، وأنه في سند روح بن عبادة عن صالح بن أبي الأخضر وهو خطأ. {cite:muwatta-maruf-1997 p.505}"
