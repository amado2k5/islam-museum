text: "… يا أمة محمدٍ هلُمُّوا إلى صلاة الجنازة عندما استولى تيمور لنك على بلاد الروم الأناضول، وأخذ المغوليون مدينة آقَ شَهْرُ هاجر سكان البلاد، فراراً من مظالمهم، والتجأوا إلى القرى والصحارى، واعتصموا بالجبال، خوفاً ووجلاً وكان الشيخ في جملتهم، فأركب امرأته …"
summary:
  ar: "في زمن المغول فرّ أهل آق شهر إلى التلال، وكان جحا مع زوجته وابنه على حمار، فالتقى قرويين عند بحيرة يتحدثون عن قسوة المغول، فظهر درويش وقال إن عدل الله سيصيب أمثال هؤلاء، فسأله جحا عن اسمه، فقال «أنا البلاء وراء النهر واسمي تيمور لنك»، فصُدم جحا وقال «يا أمة محمد هلموا إلى صلاة الجنازة»، إذ لا بد أن الرجل ميت. {cite:juha-nawadir-kubra-djuwaydi p. 160}"
  en: "Under the Mongols, Akshehir's people flee to the hills; Juha, with his wife and son on a donkey, meets villagers at a lake who discuss Mongol cruelty; a dervish appears and says God's justice will strike such people; Juha asks his name; the dervish says 'I am the calamity beyond the river, my name is Timur'; Juha, shocked, says 'O nation of Muhammad, come to the funeral prayer', since the man must be as good as dead. {cite:juha-nawadir-kubra-djuwaydi p. 160}"
  ur: "مغلوں کے زمانے میں آق شہر کے لوگ پہاڑیوں کی طرف بھاگ گئے، جحا اپنی بیوی اور بیٹے کے ساتھ گدھے پر جا رہا تھا کہ ایک جھیل پر دیہاتیوں سے ملا جو مغلوں کی سفاکی کی باتیں کر رہے تھے، ایک درویش نمودار ہوا اور بولا کہ اللہ کا انصاف ایسے لوگوں کو آ پکڑے گا، جحا نے اس کا نام پوچھا تو اس نے کہا «میں دریا کے پار کی آفت ہوں، میرا نام تیمور لنگ ہے»، جحا گھبرا گیا اور بولا «اے امت محمد، نماز جنازہ کے لیے آؤ»، کیونکہ یہ آدمی تو مردہ سمجھو۔ {cite:juha-nawadir-kubra-djuwaydi p. 160}"
  fr: "Sous les Mongols, les habitants d'Akshehir fuient vers les collines ; Juha, avec sa femme et son fils sur un âne, rencontre au bord d'un lac des villageois qui parlent de la cruauté des Mongols ; un derviche apparaît et dit que la justice de Dieu frappera de tels gens ; Juha lui demande son nom ; le derviche répond : « Je suis le fléau d'au-delà du fleuve, mon nom est Timur » ; Juha, choqué, dit : « Ô communauté de Muhammad, venez à la prière funéraire », car cet homme doit être déjà mort. {cite:juha-nawadir-kubra-djuwaydi p. 160}"
  es: "Bajo los mongoles, la gente de Akshehir huye a las colinas; Juha, con su esposa y su hijo sobre un burro, se encuentra junto a un lago con aldeanos que hablan de la crueldad mongola; aparece un derviche y dice que la justicia de Dios alcanzará a tales personas; Juha le pregunta su nombre; el derviche responde: «Soy la calamidad del otro lado del río, mi nombre es Timur»; Juha, conmocionado, dice: «Oh nación de Muhammad, vengan a la oración fúnebre», pues ese hombre ha de estar ya muerto. {cite:juha-nawadir-kubra-djuwaydi p. 160}"
