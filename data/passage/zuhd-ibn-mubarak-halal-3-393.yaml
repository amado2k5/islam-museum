text: "… يقبل إلا طيبا. قال النووى : هذا الحديث أحد الأحاديث التى هى قواعد الإسلام ومبانى الأحكام. وفيه أن المأكول والملبوس ونحو ذلك ينبغى أن يكون حلالا خالصا لا شبهة فيه وأن من أراد الدعاء كان أولى بالاعتناء بذلك من غيره. …"
