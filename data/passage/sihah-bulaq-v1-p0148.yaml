text: |-
  ⁦(غطاش)⁩
  ٤٩٣
  عرفت باعشاش وما كدت تعرف * وأنكرت من حدراء ماكنت تعرف
  وحكى ابن الاعرابى الاعتشاش أن يمتارالة وم مبرة ليست بالكثيرة وحسكى أيضا العشعس
  العش اذا تراكب بعضه على بعض عطش العطس خلاف الرىّ وقد عطش بالكسر
  فهو عطشان وقوم عطشى وعطاشى وعطاش وامر أعطشى ونسوة عطاش وأعطس الرجل
  اذاعطشت مواشبه والمعاطس مواقيت الظم وعطشان تطشان اساع له لا يفرد قال محمد
  اين السرى أصل عطشان عاشاء مثل صحراء والنون يدل من ألف التأنمت يدل على ذلك
  أنه يجمع على عطائى منسل صحارى ومكان عطش وعطش قليل الماء والعطاش داء يصيب
  الانسات يشرب الماءفلايروى كش عكاش بالتشديداسم ماء لبنى غيرويقال لبيت
  العسكبوت عكاشة عن أبى عمرو وعكس الشعر وتعكش أى التوى وتليدوعكاشة بن محصن
  الاسدى من الصحاية قال ثعلب وقد يخفف ⁦(عكرش %)⁩، العكرشة الاى من الارانب
  وعكراش اسم رجل مسْ) العمس في العين ضعف الرؤية مع سيلان دمعها فى أكثر
  أوقاتها والرجل أعمش وقد عمش والمرأة عمشاء بينا العمسْ ( عنش عنشت الذئ
  مطفته وعاثه فى القتال واعتنشه أى اعتنقه والعنتنش الطويل (عيش العيس الحياة
  وقد عاس الرجل معاشا ومعيشا وكل واحدمنهما يصلح أن يكون مصسدرا وأن يكون انها
  مثل معاب ومعيب وممال وعميل وأعاشه اللّٰه سعه انه عيشة راضية والمعيشة بمعها معايس
  بلاهم زاذا جعتها على الأصل وأصلها معيشة وتقديرهامعلة والباء أصلية متحر كة ذلا
  تتقلب فى الجهع همزة وكذلك مكايل ومبابع وض وهاوان بحعتهاء-لى الفرع ه-حزت
  وشبهت مفعلة بفعيلة كماهمزت المصائب لان الياءساكنة وفى الحويين من يرى الهمز
  لحنا والتعيش تكاف أسباب المعيشة وعائشة مهسموزولاتقل عيشة وبنوعايش قومٍ من
  العرب ولا يقال بنوعيش
  صل الفين يس الفبش بالتحريك البقية من الليل ويقسال ظلة آخر الليل
  والجسع أغباش قال ذوالرمة
  . أغباش ليل قمام كان طارقه • تطخطخ الفيم حتى ماله جوب
  شس غنه يغشه غنا بالكسروشئ مغشوش واستفشه خلاف استنعمه واقيته
  غناشا بالمكسرأى على عملة وأنشدت مجودة الكاربية
  وما أنسى مقالتها غشاشا • لماوالليل قدطرد النهارا
  وصاتك بالعهود وقدرابنا • غراب البين أوكب ثم طارا
  ⁦( غطش)⁩ أغطش اللّٰه سبمانه الليل أى أظلمه وأغطش الليل أيضابنفسه والغطس فى العين
  شبه العمش والرجل أغطش وقدغطش والمرأة غطشاء بينا الغطس والمتغاطس المتعامى
  عن الشئ وفلاة غطنى لا يهتدى لها قال الاعشى
  وبهماء بالليل غطنى الفلا فيونسى صوت فيادها
  ⁦( غطمس)⁩ الغطم الكليل البصر قال الاخفس هومن بنات الاربعة مثسل عديس
  وأو كان من بنسات انلهسة وكانت الاولى نونا لاظهرت لثلايلتيس بعشل عدبس
  ١٢٤
  عطس الأوّل بكسر الطام والثانى
  بضعها اه
