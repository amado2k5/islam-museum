summary:
  ar: "القسم 21 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العمل في الصلاة»، ويضم فيها النصوص من 1198 إلى 1223 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 21 of Sahih al-Bukhari (Actions while Praying) in the division of the open hadith dataset the museum took its reports from: reports 1198 to 1223 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 21، عنوان «کتاب العمل فی الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1198 تا 1223۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 21 de Sahih al-Bukhari (Acciones durante la oración) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1198 al 1223, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 21 du Sahih al-Bukhari (Les actes de la prière), soit les hadiths 1198 à 1223 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 21. bölümü \"Namazda Ameller Kitabı\" başlığını taşımakta olup, 1198'den 1223'e kadar olan metinleri sırasıyla numaralandırmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 21 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Amalan dalam Shalat\" dan berisi teks 1198 hingga 1223, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
