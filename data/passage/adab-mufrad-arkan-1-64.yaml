text: "… عن إلي الرحوص عن عبد ان قال الثم اخلاق المؤمن الفحش حدثن محدث عبد العزيز قال حدْنا مروان بن معاوية قال حدثنى محدث عبيد الكندي الكوفي عن ابيه ا اسمعت أبي طالب رضى أمن عن يقول لعن اللعانون قال حروان …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 1، ص 64، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 1, p. 64, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 1، ص 64 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Adab al-Mufrad de Al-Bujari, volumen 1, pág. 64, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du traité al-Adab al-Mufrad d'al-Bukhari (tome 1, p. 64) évoquant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 1. cildinin 64. sayfasından, müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 1, halaman 64, yang menyebutkan ciri-ciri seorang mukmin; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mengoleksi rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin."
