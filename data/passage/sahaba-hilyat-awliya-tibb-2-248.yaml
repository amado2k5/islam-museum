text: "… قوم ولدوا فى الإسلام فماتوا عليه حق رفع الحديث إلى النى صلى اللّٰه عليه ولم. فقال : هم الذين لا يسترقون ولا يتطيرون ولا يكتوون وعلى ربهم يتوكلون. رواه ابن أبى عدى عن سعيد بن أبى عروبة عن قتادة منهما …"
