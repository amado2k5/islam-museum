label: { ar: "صحيح مسلم 337 — مضاعفة الحسنة بعشر أمثالها، كتابة الحسنات", en: "Sahih Muslim 337 — the good deed multiplied tenfold and beyond; the writing of good deeds", ur: "صحیح مسلم 337 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا، نیکیوں کا لکھا جانا", es: "Sahih Muslim 337 — la buena acción multiplicada por diez y más; la escritura de las buenas acciones", fr: "Sahih Muslim 337 — la bonne action multipliée par dix et au-delà; la rédaction des bonnes actions", tr: "Sahih Muslim 337 — İyilikleri on kat artırmak, iyilikleri kaydetmek", id: "Sahih Muslim 337 — Melipatgandakan amal kebaikan sepuluh kali lipat, mencatat amal kebaikan" }
text: "وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو خَالِدٍ الأَحْمَرُ، عَنْ هِشَامٍ، عَنِ ابْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كُتِبَتْ لَهُ حَسَنَةً وَمَنْ هَمَّ بِحَسَنَةٍ فَعَمِلَهَا كُتِبَتْ لَهُ عَشْرًا إِلَى سَبْعِمِائَةِ ضِعْفٍ وَمَنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا لَمْ تُكْتَبْ وَإِنْ عَمِلَهَا كُتِبَتْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 337، يذكر مضاعفة الحسنة بعشر أمثالها، وكتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 337 (The Book of Faith), that speaks of the good deed multiplied tenfold and beyond, the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 337، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا، نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato del Sahih Muslim, n.º 337 (El Libro de la Fe), habla de la buena acción multiplicada por diez y más allá, y de la escritura de las buenas acciones. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 337 (Le Livre de la Foi), évoque la multiplication par dix, voire plus, des bonnes actions, ainsi que leur inscription. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou évaluent les bonnes actions."
  tr: "Sahih Müslim'de 337 numaralı hadis, iyi amellerin on katına çıkarılmasından ve iyi amellerin kaydedilmesinden bahseder. Bu hadis, iyi ve kötü amellerin bir listesini ve amelleri değerlendiren, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 337, menyebutkan tentang penggandaan amal kebaikan sepuluh kali lipat dan pencatatan amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk, beserta teks-teks yang mempertimbangkan, mencatat, menghapus, atau menimbang perbuatan."
