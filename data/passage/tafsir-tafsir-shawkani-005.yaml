text: "وأخرج ابن جرير، وابن أبي حاتم، عن مجاهد قال: هم مسلمة أهل الكتاب من اليهود والنصارى. وأخرج ابن أبي حاتم، عن الحسن قال: هم أهل الكتاب النين كانوا قبل محمد، والذين اتبعوا محمدا . وأخرج ابن المبارك، وابن جرير، وابن"
