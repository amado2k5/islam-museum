label: { ar: "الموطأ 2348 — مالك: ولد الأمة المدبرة يتبعها في التدبير بعد موت أمهم", en: "Muwatta 2348" }
summary:
  ar: "قال مالك: الأمر عندنا فيمن دبر جارية له فولدت أولادا بعد تدبيره إياها، ثم ماتت الجارية قبل الذي دبرها: إن ولدها بمنزلتها، ثبت لهم من الشرط مثل ما ثبت لها، ولا يضرهم هلاك أمهم. فإذا مات الذي دبرها عتقوا إن وسعهم الثلث. {cite:muwatta-maruf-1997 p.369}"
