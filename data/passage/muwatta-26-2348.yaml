label: { ar: "الموطأ 2348 — مالك: ولد الأمة المدبرة يتبعها في التدبير بعد موت أمهم", en: "Muwatta 2348", es: "Muwatta 2348", fr: "Muwatta 2348", ur: "موطا 2348", tr: "Al-Muwatta 2348 — Malik: Ölümünden sonra özgürlükleri vaat edilen bir köle kadının çocukları, annelerinin ölümünden sonra özgürlükleri bakımından annelerini takip ederler." }
summary:
  ar: "قال مالك: الأمر عندنا فيمن دبر جارية له فولدت أولادا بعد تدبيره إياها، ثم ماتت الجارية قبل الذي دبرها: إن ولدها بمنزلتها، ثبت لهم من الشرط مثل ما ثبت لها، ولا يضرهم هلاك أمهم. فإذا مات الذي دبرها عتقوا إن وسعهم الثلث. {cite:muwatta-maruf-1997 p.369}"
  tr: "Malik şöyle dedi: Bir adamın, ölümünden sonra cariyesine özgürlük tanıması ve cariyenin bu özgürlükten sonra çocuk sahibi olması, daha sonra cariyenin özgürlüğünü tanıyan kişiden önce ölmesi durumunda, çocukları anneleriyle aynı konumdadır ve annelerinin sahip olduğu aynı haklara sahiptirler; annelerinin ölümü onlara zarar vermez. Özgürlüğü tanıyan kişi ölürse, mirasın üçte biri onlara yeterse çocuklar da özgür bırakılır. {cite:muwatta-maruf-1997 s.369}"
  id: "Malik berkata: Putusan kami mengenai seorang pria yang membebaskan budak perempuannya setelah kematiannya, dan budak perempuan itu melahirkan anak setelah pembebasannya, dan kemudian budak perempuan itu meninggal sebelum orang yang membebaskannya: anak-anaknya berada dalam posisi yang sama dengannya, dan mereka berhak atas kondisi yang sama seperti yang berhak diterimanya, dan kematian ibu mereka tidak merugikan mereka. Jika orang yang membebaskannya meninggal, mereka dibebaskan jika sepertiga dari harta warisan mencukupi untuk mereka. {cite:muwatta-maruf-1997 p.369}"
