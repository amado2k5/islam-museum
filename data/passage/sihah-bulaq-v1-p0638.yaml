text: |-
  كان الرحل منه فوق صعل * من الظلمان جوجؤه هواه:
  اصتمصلم الاذنين أجنا * له بالمتنوم وآأ
  وآء ايضاحكاية أصوات قال الناعر
  ان تلق عمرافدلاقيت مدرعا * وايسمن همه ابل ولاشاء
  فى حفل لجب جم صواهله * باللبل يسمع فى حافاته آ.
  صل الباء بأ بأبأت الصبى اذا قلت له بأبى أنت وأمى قال الراجز
  وصاحب ذى غمرة داجبته * بأبأنه وان أبى فديته * حتى أتى الحىّ وما آذيته
  والبؤبؤ الاصل ويقال العالم مثل السرسوريقال فلان فى بؤبو الكرم أى فى أصل الكرم
  أ بدأت بالنى بدءا ابتدأت به وبدأت الشى فعلته ا بتداء وبدا اللّٰه الخلق وأبدأهم يمعن
  رتقول فعل ذلك عوداوبدء(وفى عوده وبدئه وفى عودته وبدأته ويقال رجع عوده على بدئه
  اذا رجع فى الطريق الذى جاءمنه وفلان ما يبدئ وما يعيد أى ما يتكام ببادئة ولا عائدة
  والبده السيد الاوّل فى السيادة والثنيات الذى يليه فى السودد ١ قال الشاعر
  تنياتنا ان أتاهم كان بدأهمو • ويدوهم ان أتانا كان ثنيانا
  والبده والبدأة النصيب من الجزور والجسع أبداء وبدوء مشل جفن وأجفان وجفون
  قال طرفة بن العبد وهم ايسارلقمان اذا. * أغلت الشتوة أبداء الجزر
  والبدىء الامر البسديع وقد أبدأ الرجل اذاجاء به قال عبيد فلابدىء ولاعجيب
  والبدء والبدىء البترالتى حفرت فى الاسلام وليست بعادية وفى الحديث حريم البئر البدىء
  خس وعشرون ذراعا والبدء والبدىء أيضا الاوّل ومنه قولهسم افعلد بادى بدء على فعل
  وبادى بدى على فعيل أى أوّل شى والياءمن بادى ساكنة فى موضع النصب هكذا يتكامون
  به وربماتر كواهمزه لكثرة الاستعمال على مانذ كره فى باب المعتل ويقال أيضا افعله بدأة
  ذى بدء وبدأة ذى بدأة أى أول أوّل وقوله-م لك البدء والبدأة والبداءة أيضا بالمدأى لك
  أن تبد أقبل غبرك فى الرمى اوغيره وقد بدئ الرجل يبدأبدهافهو مبدوء اذا أخذه الجدرىّ
  أوالحصبة قال الكميت
  فكا غمابدتت ظواهر جلده • مما يصافح من لهيب سهامها
  ⁦( بذأ)⁩ بذأت الرجل بذها اذارأيت به حالا كرهتها وبذأنه عين بذ٠ا اذا لم تقبله العين
  ولم تعجبك مرآته وبذأت الارض ذممت مرعاها وكذلك الموضع اذالم تحمده وأرض بذئة
  لامرعى بم اوامرأة بذية بلاهمزة يذكر فى باب المعتل رأ ، تقول برئت منك ومن
  الديون والعيوب براءة وبرئت من المرض برءا بالضم وأهل الجازية ولون برأت من المرض
  برءا بالفح وأصبح ذلان بارئا من مرضه وأبرأه اللّٰه من المرض وبرأ اللّٰه الخلق برءا وأيضاهو
  البارئ والبرية اللخلق وقدر كت العرب همزه قال الفرّاء وان أخذت البرية من البرى وهو
  التراب فاصاهاغير الهمز وأبرأته ممالى عليه وبرأنه تبرئة والبرأة بالضم قترة الصائد والجمع برأ
  مثل صبرة وصير قال الشاعر الاعشى
  فأوردهاعينا من السيفرية * بهابرأ مثل الفسيل المكم
  (١ ك وز يرمع السلطان
