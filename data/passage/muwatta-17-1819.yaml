summary:
  ar: "يروي يحيى عن مالك عن ربيعة بن أبي عبد الرحمن أن القاسم بن محمد كان يبيع ثمر حائطه، ويستثني منه. {cite:muwatta-maruf-1997 p.144}"
  tr: "Yahya, Malik'ten, o da Rabi'ah ibn Abi Abd al-Rahman'dan rivayet ettiğine göre, el-Kâsim ibn Muhammed bahçesinin meyvelerini satar ve bunun için bir istisna yapardı. {cite:muwatta-maruf-1997 s.144}"
  id: "Yahya meriwayatkan dari Malik, dari Rabi'ah ibn Abi Abd al-Rahman, bahwa al-Qasim ibn Muhammad biasa menjual buah dari kebunnya, dan membuat pengecualian untuk hal itu. {cite:muwatta-maruf-1997 p.144}"
