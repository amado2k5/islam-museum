text: "في الأوقات المُسْتَحَبَّة والسلام: لولا أنْ أَشُقَّ على أمتي لأخَّرتُ العشاءَ إلى ثُلُثِ الليل. ولأن فيه قَطْعَ السَّمَرِ المنهيِّ عنه بعدَه. وقيل: في الصيف: تُعجَّلُ؛ كي لا تُتقلَّلَ الجماعةُ. والتأخيرُ إلىٰ نصفِ الليلِ: مباحٌ؛ لأن دليلَ الكراهة، وهو تقليلُ الجماعة: …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 409، يرد فيه ذكر المستحب، و«لولا أن أشق على أمتي»، والكراهة، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Marghinani's al-Hidaya, p. 409, whose wording mentions the recommended (mustahabb), 'were it not that I would burden my community', dislike (karaha), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ہدایہ، مرغینانی، ص 409 کا اقتباس جس میں مستحب، «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا»، کراہت، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Hidaya de al-Marghinani, p. 409, dont le texte mentionne le recommandé (mustahabb), « si je ne craignais d'accabler ma communauté », la réprobation (karaha), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Hidaya de al-Marghinani, p. 409, cuyo texto menciona lo recomendado (mustahabb), «si no temiera agobiar a mi comunidad», la reprobación (karaha), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Marghinani'nin El-Hidaye adlı eserinin 409. sayfasında, tavsiye edilen ameller, \"topluma zorluk getirmemesi için\" yapılmayan ameller, mekruh edilen ameller ve caiz olan ameller sıralanmaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu alıntı, farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Hidayah karya Al-Marghinani, halaman 409, menyebutkan amalan yang dianjurkan, amalan yang dilakukan \"seandainya tidak menimbulkan kesulitan bagi umatku,\" amalan yang tidak disukai, dan amalan yang diperbolehkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
