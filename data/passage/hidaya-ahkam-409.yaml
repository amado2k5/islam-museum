text: "في الأوقات المُسْتَحَبَّة والسلام: لولا أنْ أَشُقَّ على أمتي لأخَّرتُ العشاءَ إلى ثُلُثِ الليل. ولأن فيه قَطْعَ السَّمَرِ المنهيِّ عنه بعدَه. وقيل: في الصيف: تُعجَّلُ؛ كي لا تُتقلَّلَ الجماعةُ. والتأخيرُ إلىٰ نصفِ الليلِ: مباحٌ؛ لأن دليلَ الكراهة، وهو تقليلُ الجماعة: …"
summary:
