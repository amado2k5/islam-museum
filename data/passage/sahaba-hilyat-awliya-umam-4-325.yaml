text: "… قال : أتى بى الحجاج موثقا، فلما انتهيت إلى باب القصر لقينى يزيد بن أبى مسلم. فقال : إنا اله يلشعبى لما بين دفتيك من العلم، وليس بيوم شفاعة بوء للأمير بالشرك والنفاق على تفسك، فبالحرى أن تنجو، ثم لقينى …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 325، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
