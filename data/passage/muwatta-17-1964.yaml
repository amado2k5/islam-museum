label: { ar: "الموطأ 1964 — مالك عن عثمان بن حفص بن خلدة عن ابن شهاب عن سالم عن ابن عمر: سئل عن رجل له دين على رجل إلى أجل، فيضع عنه صاحب الحق ويعجله الآخر، فكره ذلك ابن عمر ونهى عنه", en: "Muwatta 1964", es: "Muwatta 1964", fr: "Muwatta 1964", ur: "موطا 1964", tr: "El-Muvatta 1964 — Malik, Osman ibn Hafs ibn Halde'den, o da İbn Şihab'dan, o da Salim'den, o da İbn Ömer'den rivayetle şöyle anlatmıştır: Bir adamın, başka bir adamdan alacağı ve daha sonra ödenmesi gereken bir borcu olduğu soruldu. Alacaklı borcu affeder ve erken öderdi. İbn Ömer bunu beğenmedi ve yasakladı.", id: "Al-Muwatta 1964 — Malik, berdasarkan riwayat Uthman ibn Hafs ibn Khaldah, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Salim, berdasarkan riwayat Ibn Umar: Beliau ditanya tentang seorang pria yang memiliki hutang kepadanya oleh pria lain, yang harus dibayar di kemudian hari. Pemberi hutang akan memaafkan hutang tersebut dan pemberi hutang akan membayarnya lebih awal. Ibn Umar tidak menyukai hal ini dan melarangnya." }
summary:
  ar: "يروي مالك عن عثمان بن حفص بن خلدة عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر أنه سئل عن الرجل يكون له الدين على الرجل إلى أجل، فيضع عنه صاحب الحق ويعجله الآخر، فكره ذلك عبد الله بن عمر ونهى عنه. {cite:muwatta-maruf-1997 p.204}"
  tr: "Malik, Osman ibn Hafs ibn Halde'den, o da İbn Şihab'dan, o da Salim ibn Abdullah'tan, o da Abdullah ibn Ömer'den rivayet eder ki, kendisine bir adamın bir başka adamdan alacağı ve vadesi gelmiş bir borcu olduğu, alacaklının ise borcu erken ödediği bir durumdan bahsedilmiş. Abdullah ibn Ömer bunu hoş karşılamamış ve yasaklamıştır. {cite:muwatta-maruf-1997 s.204}"
  id: "Malik meriwayatkan dari Uthman bin Hafs bin Khaldah, dari Ibn Shihab, dari Salim bin Abdullah, dari Abdullah bin Umar, bahwa ia ditanya tentang seorang pria yang memiliki hutang kepadanya oleh pria lain dengan tanggal jatuh tempo, dan pemberi hutang menghapuskan hutang tersebut sementara pemberi hutang membayarnya lebih awal. Abdullah bin Umar tidak menyukai hal ini dan melarangnya. {cite:muwatta-maruf-1997 p.204}"
