label: { ar: "سنن النسائي 667 — الأب والأبوة", en: "Sunan al-Nasa'i 667 — the father and fatherhood", ur: "سنن نسائی 667 — باپ اور والدیت", es: "Sunan al-Nasa'i 667 — El padre y la paternidad" }
text: "أَخْبَرَنَا عَلِيُّ بْنُ حُجْرٍ، قَالَ أَنْبَأَنَا إِسْمَاعِيلُ، قَالَ حَدَّثَنَا يَحْيَى بْنُ عَلِيِّ بْنِ يَحْيَى بْنِ خَلاَّدِ بْنِ رِفَاعَةَ بْنِ رَافِعٍ الزَّرْقِيُّ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ رِفَاعَةَ بْنِ رَافِعٍ، أَنَّ رَسُولَ اللَّهِ بَيْنَا هُوَ جَالِسٌ فِي صَفِّ الصَّلاَةِ الْحَدِيثَ."
summary:
  ar: "حديث في سنن النسائي، رقم 667، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 667 (The Book of the Adhan (The Call to Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 667، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 667 (El Libro del Adhan (La Llamada a la Oración)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
