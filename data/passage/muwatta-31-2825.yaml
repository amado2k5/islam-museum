summary:
  ar: "يروي مالك عن زيد بن أسلم، عن أبيه، أن عمر بن الخطاب دخل على أبي بكر الصديق وهو يجبذ لسانه، فقال له عمر: مه، غفر الله لك. فقال أبو بكر: إن هذا أوردني الموارد. {cite:muwatta-maruf-1997 p.586}"
