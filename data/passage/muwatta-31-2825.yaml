label: { ar: "الموطأ 2825 — عمر بن الخطاب يدخل على أبي بكر وهو يجبذ لسانه: إن هذا أوردني الموارد", en: "Muwatta 2825", es: "Muwatta 2825", fr: "Muwatta 2825", ur: "موطا 2825", tr: "El-Muvatta 2825 — Ömer ibn el-Hattab, Ebu Bekir dilini çekerken yanına girer: \"Beni bu duruma düşüren şey budur.\"", id: "Al-Muwatta 2825 — Umar ibn al-Khattab menemui Abu Bakr ketika ia sedang menjulurkan lidahnya: “Hal inilah yang menyebabkan aku berada dalam keadaan sulit ini.”" }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن أبيه، أن عمر بن الخطاب دخل على أبي بكر الصديق وهو يجبذ لسانه، فقال له عمر: مه، غفر الله لك. فقال أبو بكر: إن هذا أوردني الموارد. {cite:muwatta-maruf-1997 p.586}"
  tr: "Malik, babasından rivayet ettiği üzere Zeyd ibn Aslam'dan naklederek, Ömer ibn el-Hattab'ın Ebu Bekir el-Siddik'in dilini çekiştirdiği sırada yanına girdiğini anlatır. Ömer ona, \"Bunu bırak, Allah seni affetsin\" dedi. Ebu Bekir ise, \"Beni bu duruma getiren şey budur\" diye cevap verdi. {cite:muwatta-maruf-1997 s.586}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, yang juga meriwayatkan dari ayahnya, bahwa Umar ibn al-Khattab menemui Abu Bakr al-Siddiq ketika ia sedang menarik-narik lidahnya. Umar berkata kepadanya, \"Hentikan, semoga Allah mengampunimu.\" Abu Bakr menjawab, \"Inilah yang telah membawaku ke dalam kesulitan ini.\" {cite:muwatta-maruf-1997 p.586}"
