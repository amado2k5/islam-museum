label: { ar: "مسلم 2564a — المسلم أخو المسلم لا يظلمه ولا يخذله ولا يحقره", en: "Muslim 2564a — A Muslim is a Muslim's brother" }
text: "قال رسول الله: «لا تحاسدوا ولا تناجشوا ولا تباغضوا ولا تدابروا ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخواناً. المسلم أخو المسلم لا يظلمه ولا يخذله ولا يحقره. التقوى هاهنا — ويشير إلى صدره ثلاث مرات — بحسب امرئ من الشر أن يحقر أخاه المسلم. كل المسلم على المسلم حرام دمه وماله وعرضه»"
summary:
  ar: "رواية أبي هريرة في باب تحريم ظلم المسلم وخذله واحتقاره ودمه وعرضه وماله من كتاب البر في صحيح مسلم؛ نص جامع لحرمة المسلم دماً ومالاً وعرضاً وأن التقوى في القلب."
