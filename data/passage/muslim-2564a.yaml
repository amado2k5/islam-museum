label: { ar: "مسلم 2564a — المسلم أخو المسلم لا يظلمه ولا يخذله ولا يحقره", en: "Muslim 2564a — A Muslim is a Muslim's brother", es: "Musulmán 2564a — Un musulmán es hermano de un musulmán", fr: "Muslim 2564a — Un musulman est le frère d'un musulman", ur: "مسلم 2564a - مسلمان مسلمان کا بھائی ہے۔", tr: "Müslim 2564a — Bir Müslüman, diğer bir Müslümanın kardeşidir; ona haksızlık etmez, onu terk etmez ve onu hor görmez.", id: "Muslim 2564a — Seorang Muslim adalah saudara bagi Muslim lainnya; dia tidak menzaliminya, tidak meninggalkannya, dan tidak menghinanya." }
text: "قال رسول الله: «لا تحاسدوا ولا تناجشوا ولا تباغضوا ولا تدابروا ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخواناً. المسلم أخو المسلم لا يظلمه ولا يخذله ولا يحقره. التقوى هاهنا — ويشير إلى صدره ثلاث مرات — بحسب امرئ من الشر أن يحقر أخاه المسلم. كل المسلم على المسلم حرام دمه وماله وعرضه»"
summary:
  ar: "رواية أبي هريرة في باب تحريم ظلم المسلم وخذله واحتقاره ودمه وعرضه وماله من كتاب البر في صحيح مسلم؛ نص جامع لحرمة المسلم دماً ومالاً وعرضاً وأن التقوى في القلب."
  tr: "Sahih Müslim'in Salihlik Kitabı'nda yer alan, Müslümanlara zulmetmenin, onları terk etmenin, hor görmenin, kanlarını dökmenin, şereflerini zedelemenin ve mallarını almanın yasaklanmasıyla ilgili bölümde Ebu Hurayra'nın rivayeti; Müslümanın kanının, malının ve şerefinin kutsallığına ve takvanın kalpte olduğuna dair kapsamlı bir metindir."
  id: "Riwayat Abu Hurairah dalam bab tentang larangan menindas, meninggalkan, menghina, menumpahkan darah, mencemarkan kehormatan, dan mengambil harta milik seorang Muslim, dari Kitab Kebajikan dalam Sahih Muslim; sebuah teks komprehensif tentang kesucian darah, harta, dan kehormatan seorang Muslim, dan bahwa ketakwaan ada di dalam hati."
