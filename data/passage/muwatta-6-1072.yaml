label: { ar: "الموطأ 1072 — مالك: من أصابه شيء بنقض وضوئه وهو يطوف بالبيت أو يسعى بين الصفا والمروة، فإن كان قد طاف بعض الطواف أو كله ولم يركع ركعتي الطواف، فإنه يتوضأ ويستأنف الطواف والركعتين", en: "Muwatta 1072" }
summary:
  ar: "قول لمالك: من أصابه شيء بنقض وضوئه وهو يطوف بالبيت أو يسعى بين الصفا والمروة، فإن كان قد طاف بعض الطواف أو كله ولم يركع ركعتي الطواف، فإنه يتوضأ ويستأنف الطواف والركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1295) وسويد (550). {cite:muwatta-maruf-1997 p.494} {cite:muwatta-maruf-1997 p.495}"
