label: { ar: "الموطأ 1072 — مالك: من أصابه شيء بنقض وضوئه وهو يطوف بالبيت أو يسعى بين الصفا والمروة، فإن كان قد طاف بعض الطواف أو كله ولم يركع ركعتي الطواف، فإنه يتوضأ ويستأنف الطواف والركعتين", en: "Muwatta 1072", es: "Muwatta 1072", fr: "Muwatta 1072", ur: "موطا 1072", tr: "El-Muvatta 1072 — Malik: Eğer bir kimse Kâbe'yi tavaf ederken veya Safa ile Merve arasında Sa'i yaparken abdestini bozan bir şey olursa ve tavafın bir kısmını veya tamamını tamamlamış ancak iki rekatlık tavafı kılmamışsa, abdest alıp tavafa ve iki rekata yeniden başlamalıdır.", id: "Al-Muwatta 1072 — Malik: Jika terjadi sesuatu pada seseorang yang membatalkan wudhunya ketika ia sedang melakukan tawaf di Ka'bah atau melakukan Sa'i antara Safa dan Marwa, dan ia telah menyelesaikan sebagian atau seluruh tawaf tetapi belum melaksanakan dua rakaat tawaf, maka ia harus berwudhu dan memulai tawaf serta dua rakaat tersebut dari awal." }
summary:
  ar: "قول لمالك: من أصابه شيء بنقض وضوئه وهو يطوف بالبيت أو يسعى بين الصفا والمروة، فإن كان قد طاف بعض الطواف أو كله ولم يركع ركعتي الطواف، فإنه يتوضأ ويستأنف الطواف والركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1295) وسويد (550). {cite:muwatta-maruf-1997 p.494} {cite:muwatta-maruf-1997 p.495}"
  tr: "Malik şöyle demiştir: Eğer bir kimse Kâbe'yi tavaf ederken veya Safa ile Merve arasında Sa'i yaparken abdestini bozan bir şey yaşarsa ve tavafın bir kısmını veya tamamını tamamlamış ancak iki rekatlık tavafı kılmamışsa, yeniden abdest almalı ve tavafa ve iki rekatı yeniden başlamalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1295) ve Suveyd (550) tarafından rivayet edildiğini belirtmektedir."
  id: "Malik berkata: Jika seseorang mengalami sesuatu yang membatalkan wudhunya ketika melakukan tawaf di Ka'bah atau melakukan Sa'i antara Safa dan Marwa, dan mereka telah menyelesaikan sebagian atau seluruh tawaf tetapi belum melaksanakan dua rakaat Tawaf, maka mereka harus berwudhu lagi dan memulai tawaf dan dua rakaat tersebut dari awal. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1295) dan Suwaid (550)."
