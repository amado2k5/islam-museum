label: { ar: "صحيح مسلم 6327 — الأب والأبوة", en: "Sahih Muslim 6327 — the father and fatherhood", ur: "صحیح مسلم 6327 — باپ اور والدیت", es: "Sahih Muslim 6327 — El padre y la paternidad", fr: "Sahih Muslim 6327 — Le père et la paternité" }
text: "حَدَّثَنِيهِ مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ يُوسُفَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، أَنَّهُ سَمِعَ الأَسْوَدَ، يَقُولُ سَمِعْتُ أَبَا مُوسَى، يَقُولُ لَقَدْ قَدِمْتُ أَنَا وَأَخِي، مِنَ الْيَمَنِ. فَذَكَرَ بِمِثْلِهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6327، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6327 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6327، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6327 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6327 (Livre des mérites des Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
