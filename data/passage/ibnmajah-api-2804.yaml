label: { ar: "سنن ابن ماجه 2804 — الطاعون والوباء", en: "Sunan Ibn Majah 2804 — plague and epidemic", ur: "سنن ابن ماجہ 2804 — طاعون اور وبا" }
text: "… قَالَ \" مَا تَقُولُونَ فِي الشَّهِيدِ فِيكُمْ \". قَالُوا الْقَتْلُ فِي سَبِيلِ اللَّهِ. قَالَ \" إِنَّ شُهَدَاءَ أُمَّتِي إِذًا لَقَلِيلٌ مَنْ قُتِلَ فِي سَبِيلِ اللَّهِ فَهُوَ شَهِيدٌ وَمَنْ مَاتَ فِي سَبِيلِ اللَّهِ فَهُوَ شَهِيدٌ وَالْمَبْطُونُ شَهِيدٌ وَالْمَطْعُونُ شَهِيدٌ \". قَالَ سُهَيْلٌ وَأَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ مِقْسَمٍ، عَنْ أَبِي صَالِحٍ، وَزَادَ، فِيهِ \" وَالْغَرِقُ شَهِيدٌ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2804، يذكر الطاعون والوباء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 2804 (The Chapters on Jihad), that mentions plague and epidemic. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2804، جس میں طاعون اور وبا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
