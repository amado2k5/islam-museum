text: "… عَنِ ابْنِ شِهَابٍ، عَنِ ابْنِ مُحَيِّصَةَ، أَخِي بَنِي حَارِثَةَ عَنْ أَبِيهِ، أَنَّهُ اسْتَأْذَنَ النَّبِيَّ فِي إِجَارَةِ الْحَجَّامِ فَنَهَاهُ عَنْهَا فَلَمْ يَزَلْ يَسْأَلُهُ وَيَسْتَأْذِنُهُ حَتَّى قَالَ \" اعْلِفْهُ نَاضِحَكَ وَأَطْعِمْهُ رَقِيقَكَ \". قَالَ وَفِي الْبَابِ عَنْ رَافِعِ بْنِ خَدِيجٍ وَأَبِي جُحَيْفَةَ وَجَابِرٍ وَالسَّائِبِ بْنِ يَزِيدَ. قَالَ أَبُو عِيسَى حَدِيثُ مُحَيِّصَةَ حَدِيثٌ حَسَنٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1277، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 1277 (The Book on Business), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 1277، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
