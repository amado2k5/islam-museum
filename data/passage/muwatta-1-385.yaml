label: { ar: "الموطأ 385 — ابن عباس: صلى الظهر والعصر جميعاً في غير خوف ولا سفر", en: "Muwatta 385" }
text: "صلى رسول الله الظهر والعصر جميعاً والمغرب والعشاء جميعاً في غير خوف ولا سفر"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي عن سعيد بن جبير عن عبد الله بن عباس، في باب الجمع بين الصلاتين في الحضر والسفر: صلى النبي الظهر والعصر جميعاً والمغرب والعشاء جميعاً في غير خوف ولا سفر؛ ويقول مالك إنه يرى أن ذلك كان في مطر. ويخرّجه المحقق عند مسلم (2/151) وأبي داود (1210) والنسائي (1/290) وابن حبان وابن خزيمة والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (12/209). {cite:muwatta-maruf-1997 p.207} {cite:muwatta-maruf-1997 p.208}"
