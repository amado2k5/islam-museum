label: { ar: "سنن أبي داود 2488 — الأب والأبوة", en: "Sunan Abi Dawud 2488 — the father and fatherhood", ur: "سنن ابی داؤد 2488 — باپ اور والدیت", es: "Sunan Abi Dawud 2488 — El padre y la paternidad" }
text: "… حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، عَنْ فَرَجِ بْنِ فَضَالَةَ، عَنْ عَبْدِ الْخَبِيرِ بْنِ ثَابِتِ بْنِ قَيْسِ بْنِ شَمَّاسٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ جَاءَتِ امْرَأَةٌ إِلَى النَّبِيِّ يُقَالُ لَهَا أُمُّ خَلاَّدٍ وَهِيَ مُنْتَقِبَةٌ تَسْأَلُ عَنِ ابْنِهَا وَهُوَ مَقْتُولٌ فَقَالَ لَهَا بَعْضُ أَصْحَابِ النَّبِيِّ جِئْتِ تَسْأَلِينَ عَنِ ابْنِكِ وَأَنْتِ مُنْتَقِبَةٌ فَقَالَتْ إِنْ أُرْزَإِ ابْنِي فَلَنْ أُرْزَأَ حَيَائِي. …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2488، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2488 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2488، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2488 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
