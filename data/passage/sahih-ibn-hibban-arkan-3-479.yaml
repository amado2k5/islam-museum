text: "… يَحْيَى قَالَ: حَدَّثَنَا ابن وهب قَالَ : حَدَّثَنَا حنظلة بن أَبِي سُفْيَان قال: سمعت عِكْرِمَة بن خَالِد المخزومي يحدث: أن رجلاً قَالَ لعَبْدِ اللَّهِ بن عمر: ألا تغزو؟ فقال: إِنِّي سَمِعْتُ رَسُولَ اللَّهِ وَلِلِه يَقُولُ: بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَة …"
summary:
