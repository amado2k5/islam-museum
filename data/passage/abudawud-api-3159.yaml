label: { ar: "سنن أبي داود 3159 — المرض والمريض، عيادة المريض", en: "Sunan Abi Dawud 3159 — illness and the sick; visiting the sick", ur: "سنن ابی داؤد 3159 — بیماری اور بیمار، بیمار کی عیادت", es: "Sunan Abi Dawud 3159 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sunan Abi Dawud 3159 — la maladie et les malades; la visite aux malades", tr: "Sunan Abi Dawud 3159 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sunan Abi Dawud 3159 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "… عَنْ سَعِيدِ بْنِ عُثْمَانَ الْبَلَوِيِّ، عَنْ عَزْرَةَ، - وَقَالَ عَبْدُ الرَّحِيمِ عُرْوَةُ بْنُ سَعِيدٍ الأَنْصَارِيُّ - عَنْ أَبِيهِ، عَنِ الْحُصَيْنِ بْنِ وَحْوَحٍ، أَنَّ طَلْحَةَ بْنَ الْبَرَاءِ، مَرِضَ فَأَتَاهُ النَّبِيُّ يَعُودُهُ فَقَالَ \" إِنِّي لاَ أَرَى طَلْحَةَ إِلاَّ قَدْ حَدَثَ فِيهِ الْمَوْتُ فَآذِنُونِي بِهِ وَعَجِّلُوا فَإِنَّهُ لاَ يَنْبَغِي لِجِيفَةِ مُسْلِمٍ أَنْ تُحْبَسَ بَيْنَ ظَهْرَانَىْ أَهْلِهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3159، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3159 (Funerals (Kitab Al-Jana'iz)), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3159، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3159 (Funerales (Kitab Al-Jana'iz)), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3159 (Funérailles (Kitab Al-Jana'iz)), évoque la maladie, les malades et les visites aux malades. Le Répertoire des textes médicaux le classe parmi les ouvrages traitant de médecine prophétique, de médecine, d'anatomie, de chirurgie, de médicaments et de traitements."
  tr: "Sunan Abi Davud'da yer alan 3159 numaralı hadiste hastalık, hasta ve hasta ziyareti konuları geçmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3159, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
