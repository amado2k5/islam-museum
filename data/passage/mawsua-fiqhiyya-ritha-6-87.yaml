text: "… والفتاوى الهندية: إذا أجرت المرأة نفسها بما يعاب به كان لأهلها أن يخرجوها من تلك الإجارة، وفي المثل السائر: تجوع الحرة ولا تأكل بثديبها، وعن محمد تعالى في امرأة نائحة أو صاحب طبل أو مزمار اكتسب مالا فهو معصية. ألا …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 87، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Mawsu'a al-Fiqhiyya al-Kuwaitiyya (Kuwaiti Fiqh Encyclopedia), scan volume 6, p. 87, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الموسوع الفقہیہ الکویتیہ ⁦(کویتی فقہ انسائیکلوپیڈیا)⁩، اسکین جلد 6، ص 87 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mawsu'a al-Fiqhiyya al-Kuwaitiyya (Encyclopédie du Fiqh koweïtien), volume numérisé 6, p. 87, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Mawsu'a al-Fiqhiyya al-Kuwaitiyya (Enciclopedia Fiqh de Kuwait), volumen escaneado 6, p. 87, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 6, sayfa 87'den, ölen kişi için ağlama veya ağıt yakma ve sınırları ile ilgili bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Ağıt ve ağıt üzerine en ünlü sözlerden derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 6 Bergambar, hlm. 87, mengenai meratap atau menangisi orang yang meninggal dan batasannya; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan ucapan-ucapan paling terkenal tentang elegi dan ratapan."
