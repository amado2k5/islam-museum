text: "… بلفظ العموم، والمرادُ منه الخاصُ، والثاني والثالث: لكل واحد منهما تخصيصان اثنان، كُلُّ واحد منهما من سُنَّةٍ ثَابِتة، والرابع: قُصِدَ به بعضُ المخاطبين في بعض الأحوال، والخامس: فَرْضٌ على الكفاية إذا قام به البعضُ، سقط عن الآخرين فرضُه."
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 75، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 75, whose wording mentions what was made obligatory on people, the obligatory (fard), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 75 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 3, p. 75, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 3, p. 75, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban'ın 3. cildinin 75. sayfasından bir alıntı, insanlar için farz olan şeyleri, farz fiilleri, toplumsal yükümlülükleri ve bazıları tarafından yerine getirildiğinde diğerlerini sorumluluktan kurtaran şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir baskıdan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Volume 3, halaman 75, membahas tentang apa yang wajib dilakukan oleh manusia, perbuatan wajib, kewajiban bersama, dan apa yang jika dilakukan oleh sebagian orang, membebaskan sisanya. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk perbuatan wajib, kewajiban, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
