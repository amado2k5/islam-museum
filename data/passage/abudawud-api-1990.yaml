ref: "1990"
label: { ar: "سنن أبي داود 1990 — عمل يعدل عملا أعظم منه", en: "Sunan Abi Dawud 1990 — a deed that equals a greater one", ur: "سنن ابی داؤد 1990 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… عِنْدِي مَا أُحِجُّكِ عَلَيْهِ. فَقَالَتْ أَحِجَّنِي عَلَى جَمَلِكَ فُلاَنٍ. فَقُلْتُ ذَاكَ حَبِيسٌ فِي سَبِيلِ اللَّهِ. فَقَالَ \" أَمَا إِنَّكَ لَوْ أَحْجَجْتَهَا عَلَيْهِ كَانَ فِي سَبِيلِ اللَّهِ \". قَالَ وَإِنَّهَا أَمَرَتْنِي أَنْ أَسْأَلَكَ مَا يَعْدِلُ حَجَّةً مَعَكَ. فَقَالَ رَسُولُ اللَّهِ \" أَقْرِئْهَا السَّلاَمَ وَرَحْمَةَ اللَّهِ وَبَرَكَاتِهِ وَأَخْبِرْهَا أَنَّهَا تَعْدِلُ حَجَّةً مَعِي \". يَعْنِي عُمْرَةً فِي رَمَضَانَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1990، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 1990 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 1990، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
