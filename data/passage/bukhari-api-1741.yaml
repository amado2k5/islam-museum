text: "… بَلَدٍ هَذَا \". قُلْنَا اللَّهُ وَرَسُولُهُ أَعْلَمُ. فَسَكَتَ حَتَّى ظَنَنَّا أَنَّهُ سَيُسَمِّيهِ بِغَيْرِ اسْمِهِ. قَالَ \" أَلَيْسَتْ بِالْبَلْدَةِ الْحَرَامِ \". قُلْنَا بَلَى. قَالَ \" فَإِنَّ دِمَاءَكُمْ وَأَمْوَالَكُمْ عَلَيْكُمْ حَرَامٌ، كَحُرْمَةِ يَوْمِكُمْ هَذَا، فِي شَهْرِكُمْ هَذَا، فِي بَلَدِكُمْ هَذَا، إِلَى يَوْمِ تَلْقَوْنَ رَبَّكُمْ. أَلاَ هَلْ بَلَّغْتُ \". قَالُوا نَعَمْ. قَالَ \" اللَّهُمَّ اشْهَدْ، فَلْيُبَلِّغِ الشَّاهِدُ الْغَائِبَ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1741، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1741 (Hajj (Pilgrimage)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1741، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
