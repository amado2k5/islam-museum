text: "… رءياً. وتؤي. ونحو: روياك والرويا عند بعضهم. وهذا هو الرسم الفوي وقد يقال له الصحيح وقد يقال المختار. قال ابو عبد اللّٰه بن شريح في كافيه الاختيار عند القراء الوقف لحمزة على المهموز بتسهيل لا يخالف المصحف وقال الحافظ أبو …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 462، يذكر القراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 462, that mentions the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 462 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Nashr fi al-Qira'at al-'Ashr de Ibn al-Jazari, volumen 1, pág. 462, que menciona a los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du livre d'Ibn al-Jazari, al-Nashr fi al-Qira'at al-'Ashr (tome 1, p. 462), mentionnant les lecteurs, la compilation du Coran et des codex, ainsi que l'orthographe du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Cezeri'nin \"On Okuma\" adlı eserinin 1. cildinin 462. sayfasından, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını ve Kur'an yazısını ele alan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okumaları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jazari, \"Sepuluh Bacaan,\" Jilid 1, halaman 462, yang menyebutkan para qari, penyusunan Al-Quran dan manuskripnya, serta aksara Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
