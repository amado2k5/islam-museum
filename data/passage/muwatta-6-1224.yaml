label: { ar: "الموطأ 1224 — مالك: من نسي رمي جمرة في بعض أيام منى حتى يمسي، فليرمها أي ساعة ذكرها، فإن كان بعد الصدر فعليه الهدي", en: "Muwatta 1224" }
summary:
  ar: "يقول يحيى إن مالكا سئل عمن نسي رمي جمرة من الجمار في بعض أيام منى حتى يمسي، فقال يرمي أي ساعة ذكر من ليل أو نهار، كما يصلي الصلاة إذا نسيها. فإن كان ذلك بعد ما صدر وهو بمكة أو بعد ما يخرج منها فعليه الهدي. {cite:muwatta-maruf-1997 p.546}"
