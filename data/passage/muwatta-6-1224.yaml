label: { ar: "الموطأ 1224 — مالك: من نسي رمي جمرة في بعض أيام منى حتى يمسي، فليرمها أي ساعة ذكرها، فإن كان بعد الصدر فعليه الهدي", en: "Muwatta 1224", es: "Muwatta 1224", fr: "Muwatta 1224", ur: "موطا 1224", tr: "El-Muvatta 1224 — Malik: Mina günlerinden birinde akşam vaktine kadar Cemarat'a taş atmayı unutan kimse, aklına geldiği herhangi bir zamanda atsın. Eğer Mina'dan ayrıldıktan sonra atarsa, kurban kesmelidir.", id: "Al-Muwatta 1224 — Malik: Barang siapa yang lupa melempar kerikil ke Jamarat pada salah satu hari Mina hingga sore hari, maka ia boleh melemparnya kapan saja ia ingat. Jika itu terjadi setelah keberangkatan dari Mina, maka ia wajib mempersembahkan kurban." }
summary:
  ar: "يقول يحيى إن مالكا سئل عمن نسي رمي جمرة من الجمار في بعض أيام منى حتى يمسي، فقال يرمي أي ساعة ذكر من ليل أو نهار، كما يصلي الصلاة إذا نسيها. فإن كان ذلك بعد ما صدر وهو بمكة أو بعد ما يخرج منها فعليه الهدي. {cite:muwatta-maruf-1997 p.546}"
  tr: "Yahya, Malik'e Mina günlerinde akşama kadar Cemarat'lardan birine taş atmayı unutan biri hakkında soru sorulduğunu anlatır. Malik, unuttuğunda namaz kılar gibi, hatırladığı herhangi bir zamanda, gece veya gündüz, taş atması gerektiğini söyler. Eğer bu durum Mekke'den ayrıldıktan sonra veya oradan ayrıldıktan sonra olursa, kurban kesmesi gerektiğini belirtir. {cite:muwatta-maruf-1997 s.546}"
  id: "Yahya mengatakan bahwa Malik ditanya tentang seseorang yang lupa melempar kerikil ke salah satu Jamarat selama masa Mina hingga sore hari. Dia menjawab bahwa orang itu harus melemparnya kapan pun dia ingat, siang atau malam, seperti halnya dia berdoa jika dia lupa. Jika ini terjadi setelah dia meninggalkan Mekah atau setelah dia pergi dari Mekah, maka dia harus mempersembahkan kurban. {cite:muwatta-maruf-1997 p.546}"
