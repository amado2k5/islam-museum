label:
  ar: "الترمذي 2390 — المتحابون في جلالي لهم منابر من نور"
  en: "Tirmidhi 2390 — Those who love one another for My majesty have pulpits of light"
  ur: "ترمذی 2390 — میری جلالت کی خاطر محبت کرنے والوں کے لیے نور کے منبر ہیں"
text: "قال الله عز وجل المتحابون في جلالي لهم منابر من نور يغبطهم النبيون والشهداء . وفي الباب عن أبي الدرداء وابن مسعود وعبادة بن الصامت وأبي هريرة وأبي مالك الأشعري . قال أبو عيسى هذا حديث حسن صحيح . وأبو …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2390: المتحابون في جلالي لهم منابر من نور. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2390: Those who love one another for My majesty have pulpits of light. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2390: میری جلالت کی خاطر محبت کرنے والوں کے لیے نور کے منبر ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
