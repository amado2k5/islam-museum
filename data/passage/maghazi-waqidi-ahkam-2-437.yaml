text: "… الأَرض مثل ظهر التُّرْس، ليس فيها لبعير شئٌ - وإِنما يُصلحنا عام خِصْب غَيداق ترعى فيه الظَّهر والخيل ونشرب اللبن، وأَنا أَكره أَن يخرج محمّدٌ وأصحابه ولا أَخرج فيجترثون علينا، ويكون الخُلف من قِبَلهم أَحبَّ إِلىّ. ونجعل لك عشرين فَريضة، …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 2، ص 437، يرد فيه ذكر الفريضة والفرائض، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 2, p. 437, whose wording mentions the obligation (farida), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغازی، واقدی، اسکین جلد 2، ص 437 کا اقتباس جس میں فریضہ اور فرائض، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Maghazi de al-Waqidi, volume numérisé 2, p. 437, dont le texte mentionne l'obligation (farida), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
