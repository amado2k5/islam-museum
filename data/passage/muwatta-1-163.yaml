label: { ar: "الموطأ 163 — مالك: الأمر في المستحاضة على حديث هشام عن أبيه", en: "Muwatta 163", es: "Muwatta 163", fr: "Muwatta 163", ur: "موطا 163", tr: "Al-Muwatta 163 — Malik: Kadının uzun süren kanaması hakkındaki hüküm, Hişam'ın babasından rivayet ettiği hadise dayanmaktadır.", id: "Al-Muwatta 163 — Malik: Hukum mengenai wanita yang mengalami pendarahan berkepanjangan didasarkan pada hadits Hisham dari ayahnya." }
summary:
  ar: "قول لمالك يرويه يحيى في باب المستحاضة: الأمر عند أهل المدينة في المستحاضة على حديث هشام بن عروة عن أبيه، أي غسل واحد ثم وضوء لكل صلاة، وهو أحب ما سمع إليه في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.109}"
  tr: "Yahya'nın, kadınların uzun süren adet kanaması yaşadığı bölümü anlattığına göre, Malik'e atfedilen bir ifade şöyledir: Medine halkının kadınların uzun süren adet kanaması konusunda uyguladığı yöntem, Hişam ibn Urve'nin babasından rivayet ettiği hadise dayanmaktadır; bu da her namazdan önce bir gusül abdesti almaktır. Bu konuda tercih ettiği görüş budur. Editör, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.109}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dalam bab tentang wanita yang mengalami pendarahan menstruasi berkepanjangan: Praktik di kalangan penduduk Madinah mengenai wanita yang mengalami pendarahan menstruasi berkepanjangan didasarkan pada hadits Hisham ibn Urwah, dari ayahnya, yaitu satu kali mandi wajib diikuti dengan wudhu untuk setiap shalat. Ini adalah pendapat yang dia sukai dalam masalah ini. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.109}"
