summary:
  ar: "قول لمالك يرويه يحيى في باب المستحاضة: الأمر عند أهل المدينة في المستحاضة على حديث هشام بن عروة عن أبيه، أي غسل واحد ثم وضوء لكل صلاة، وهو أحب ما سمع إليه في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.109}"
