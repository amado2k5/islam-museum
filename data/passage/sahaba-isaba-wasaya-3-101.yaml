text: "… عليه وسام ثلاث غزوات، وأنه أوصاهم حين مات أن يرشوا على قبره ماء، ويقوموا على الحكم بن حزن السكافى من بنى كامة بن حنظالة بن مالك بن زيد مناة من تيم، وهو قول البخاري. وبقال من فى كُملفة من عوف …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 3، ص 101، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 3, p. 101, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 3، ص 101 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
