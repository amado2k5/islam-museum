  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 3, p. 101), mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments Browser."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 3. cildinin 101. sayfasından bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve türbe kelimelerini içermektedir; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Volume 3, halaman 101, menyebutkan wasiat atau surat wasiat terakhir, pemakaman, kuburan, dan makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh Wills, Inheritance, Antiquities, and Tombs Browser."
