summary:
  ar: "القسم 69 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النفقات»، ويضم فيها النصوص من 5351 إلى 5372 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 69 of Sahih al-Bukhari (Supporting the Family) in the division of the open hadith dataset the museum took its reports from: reports 5351 to 5372 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 69، عنوان «کتاب النفقات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5351 تا 5372۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 69 de Sahih al-Bukhari (Apoyo a la Familia) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5351 al 5372, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 69 du Sahih al-Bukhari (Soutien à la famille), soit les hadiths 5351 à 5372 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 69. bölümü \"Harcamalar Kitabı\" başlığını taşımakta olup, 5351'den 5372'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu kitap altında toplamaktadır."
  id: "Bagian 69 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pengeluaran\" dan berisi teks 5351 hingga 5372, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah kitab ini."
