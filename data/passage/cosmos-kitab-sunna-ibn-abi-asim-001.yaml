text: "فإن تحتها الأرض الأخرى بينهما مسيرة خمسمائة سنة"
summary:
  ar: "في تخريج الألباني لكتاب السنة يورد الزيادة التي عند الترمذي وأحمد والبيهقي في حديث أبي هريرة أن تحت الأرض أرضاً أخرى بينهما مسيرة خمسمائة سنة حتى سبع أرضين؛ ويضعّف الألباني إسناد الحديث بعنعنة الحسن وضعف أبي جعفر الرازي، وينقل قول الترمذي إنه غريب وقول البيهقي بانقطاع ما بين الحسن وأبي هريرة."
  en: "In al-Albani's takhrij of Kitab al-Sunna, he quotes the extra wording found in al-Tirmidhi, Ahmad and al-Bayhaqi in Abu Hurayra's hadith, that beneath this earth lies another, five hundred years' journey away, down to seven earths. Al-Albani calls the chain weak (al-Hasan's 'an'ana and Abu Ja'far al-Razi's poor memory), and reports al-Tirmidhi's 'gharib' and al-Bayhaqi's note of a break between al-Hasan and Abu Hurayra."
  es: "En el takhrij de Kitab al-Sunna de al-Albani, cita la frase adicional que se encuentra en al-Tirmidhi, Ahmad y al-Bayhaqi en el hadiz de Abu Hurayra, que dice que debajo de esta tierra hay otra, a quinientos años de distancia, que lleva a siete tierras. Al-Albani considera que la cadena es débil (debido a la falta de memoria de al-Hasan y la mala memoria de Abu Ja'far al-Razi), e informa sobre la falta de memoria de al-Tirmidhi y la nota de al-Bayhaqi sobre una ruptura entre al-Hasan y Abu Hurayra."
  fr: "Dans son commentaire du Kitab al-Sunna, al-Albani cite un ajout rapporté par al-Tirmidhi, Ahmad et al-Bayhaqi dans un hadith d'Abu Hurayra: sous cette terre se trouve une autre, à cinq cents ans de voyage, jusqu'aux sept terres. Al-Albani juge la chaîne de transmission faible (en raison de l'erreur d'al-Hasan et de la mauvaise mémoire d'Abu Ja'far al-Razi) et rapporte l'erreur d'al-Tirmidhi et la mention d'une rupture entre al-Hasan et Abu Hurayra par al-Bayhaqi."
  ur: "البانی کی کتاب السنۃ کی تخریج میں، وہ ابوہریرہ کی حدیث میں الترمذی، احمد اور بیہقی میں پائے جانے والے اضافی الفاظ کا حوالہ دیتے ہیں کہ اس زمین کے نیچے پانچ سو سال کی مسافت ہے، سات زمینوں تک۔ البانی نے سلسلہ کو ضعیف قرار دیا ہے ⁦(الحسن کی 'عنانہ اور ابو جعفر الرازی کی کمزور حافظہ)⁩ اور الترمذی کی 'غریب' اور البیہقی نے الحسن اور ابو ہریرہ کے درمیان وقفے کی خبر دی ہے۔"
