  ar: "يروي مالك عن يزيد بن عبد الله بن قسيط عن محمد بن عبد الرحمن بن ثوبان عن أمه عن عائشة أن رسول الله أمر أن يستمتع بجلود الميتة إذا دبغت. ويذكر المحقق أن في رواية أبي مصعب والنسائي والتمهيد: عن محمد بن عبد الرحمن بن ثوبان عن أبيه عن عائشة. {cite:muwatta-maruf-1997 p.643}"
