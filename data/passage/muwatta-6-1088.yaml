label: { ar: "الموطأ 1088 — مالك: لا يطوف أحد بالبيت ولا بين الصفا والمروة إلا وهو طاهر", en: "Muwatta 1088", es: "Muwatta 1088", fr: "Muwatta 1088", ur: "موطا 1088", tr: "El-Muvatta 1088 — Malik: Hiç kimse, temiz bir halde olmadıkça Kâbe'nin tavafını yapmamalı veya Safa ile Merve arasında yürümemelidir.", id: "Al-Muwatta 1088 — Malik: Tidak seorang pun boleh melakukan tawaf mengelilingi Ka'bah atau berjalan di antara Safa dan Marwa kecuali jika ia dalam keadaan suci." }
text: "لا يطوف أحد بالبيت ولا بين الصفا والمروة إلا وهو طاهر"
summary:
  ar: "قول لمالك: لا يطوف أحد بالبيت ولا بين الصفا والمروة إلا وهو طاهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1308). {cite:muwatta-maruf-1997 p.499}"
  tr: "Malik şöyle demiştir: “Kimse, ritüel temizliğine sahip olmadıkça Kâbe'nin etrafında tavaf etmemeli veya Safa ile Merve arasında Sa'i yapmamalıdır.” Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab (1308) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.499}"
  id: "Malik berkata: “Tidak seorang pun boleh melakukan tawaf di sekitar Ka'bah atau melakukan Sa'i antara Safa dan Marwa kecuali dalam keadaan suci secara ritual.” Peneliti menyebutkan bahwa Abu Mus'ab (1308) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.499}"
