text: "إذا سمعتم النداء فقولوا مثل ما يقول المؤذن"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عطاء بن يزيد الليثي عن أبي سعيد الخدري، في باب ما جاء في النداء للصلاة: أمر النبي من سمع الأذان أن يقول مثل ما يقول المؤذن. ويخرّجه المحقق عند البخاري (611) ومسلم (2/4) وأبي داود (522) والترمذي (208) والنسائي (2/23) وابن ماجه (720) وابن حبان وابن خزيمة من طرق أصحاب مالك، وينقل عن ابن عبد البر أن المغيرة بن سقلاب انفرد بزيادة سعيد بن المسيب في إسناده، ويعلق المحقق بأن المغيرة منكر الحديث وهذا من منكراته، وأن رواية من جعله عن الزهري عن السائب بن يزيد خطأ، والصحيح رواية الزهري عن عطاء بن يزيد عن أبي سعيد. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
  tr: "Malik, ezanla ilgili rivayetler bölümünde, İbn Şihab'dan, Ata ibn Yazid el-Laythi'den, Ebu Sa'id el-Hudri'den naklettiği üzere şöyle buyurmuştur: Peygamberimiz ezanı işitene müezzinin söylediğini tekrar etmesini emretmiştir. Editör ayrıca, Malik'in sahabelerinin rivayet zincirleriyle, Buhari (611), Müslim (2/4), Ebu Davud (522), Tirmizi (208), Nesai (2/23), İbn Majah (720), İbn Hibban ve İbn Huzeyme'nin hadis derlemelerinde de bu hadisi içermektedir. İbn Abd el-Barr'ın, rivayet zincirine Sa'id ibn el-Musayyab'ı ekleyen tek kişinin el-Mughirah ibn Saqlab olduğunu söylediğini aktarmaktadır. Editör, el-Mughirah'ın reddedilmiş hadislerin ravîsi olduğunu ve bunun da reddedilmiş rivayetlerinden biri olduğunu belirtmektedir. Ayrıca, el-Sa'ib ibn Yazid'den rivayet edilen el-Zuhri'ye atfedilen rivayetin yanlış olduğunu; doğru rivayetin, Ebu Sa'id'den rivayet edilen Ata ibn Yazid'den rivayet edilen el-Zuhri'ye ait olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.113} {cite:muwatta-maruf-1997 s.114}"
  id: "Malik meriwayatkan hadits ini dari Ibn Shihab, dari Ata ibn Yazid al-Laythi, dari Abu Sa'id al-Khudri, dalam bab tentang apa yang diriwayatkan mengenai seruan azan: Nabi memerintahkan siapa pun yang mendengar seruan azan untuk mengulangi apa yang diucapkan muazin. Editor juga memasukkannya dalam kumpulan hadits al-Bukhari (611), Muslim (2/4), Abu Dawud (522), al-Tirmidhi (208), al-Nasa'i (2/23), Ibn Majah (720), Ibn Hibban, dan Ibn Khuzaymah, melalui sanad para sahabat Malik. Ia mengutip Ibn Abd al-Barr yang mengatakan bahwa al-Mughirah ibn Saqlab adalah satu-satunya yang menambahkan Sa'id ibn al-Musayyab ke dalam sanadnya. Editor berkomentar bahwa al-Mughirah adalah perawi hadits-hadits yang ditolak, dan ini adalah salah satu riwayatnya yang ditolak. Ia juga menyatakan bahwa riwayat yang dinisbahkan kepada al-Zuhri, berdasarkan riwayat al-Sa'ib ibn Yazid, adalah tidak benar; riwayat yang benar adalah riwayat al-Zuhri, berdasarkan riwayat Ata ibn Yazid, berdasarkan riwayat Abu Sa'id. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
