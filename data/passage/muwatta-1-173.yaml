text: "إذا سمعتم النداء فقولوا مثل ما يقول المؤذن"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عطاء بن يزيد الليثي عن أبي سعيد الخدري، في باب ما جاء في النداء للصلاة: أمر النبي من سمع الأذان أن يقول مثل ما يقول المؤذن. ويخرّجه المحقق عند البخاري (611) ومسلم (2/4) وأبي داود (522) والترمذي (208) والنسائي (2/23) وابن ماجه (720) وابن حبان وابن خزيمة من طرق أصحاب مالك، وينقل عن ابن عبد البر أن المغيرة بن سقلاب انفرد بزيادة سعيد بن المسيب في إسناده، ويعلق المحقق بأن المغيرة منكر الحديث وهذا من منكراته، وأن رواية من جعله عن الزهري عن السائب بن يزيد خطأ، والصحيح رواية الزهري عن عطاء بن يزيد عن أبي سعيد. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
