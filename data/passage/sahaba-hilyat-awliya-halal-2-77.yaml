text: "… ولا نزنى، ولا تقتل، ولا نأتى بهتان نفتريه بين أيدينا وأرجلا، ولا نعصيه فى معروف. قال ولا تنخشن أزواجكن، قالت فبايعناه ثم انصرفنا، فقلت لامرأة منهن ارجعى فسلى رسول اللّٰه ما حرم علينا من مال أزواجنا، فسألته فقال : تأخذ …"
