text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، عَنْ عُبَيْدِ اللَّهِ، سَمِعَ ابْنَ عَبَّاسٍما ـ قَالَ خِلاَلٌ مِنْ خِلاَلِ الْجَاهِلِيَّةِ الطَّعْنُ فِي الأَنْسَابِ وَالنِّيَاحَةُ، وَنَسِيَ الثَّالِثَةَ، قَالَ سُفْيَانُ وَيَقُولُونَ إِنَّهَا الاِسْتِسْقَاءُ بِالأَنْوَاءِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3850، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3850 (Merits of the Helpers in Madinah (Ansaar)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3850، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3850 (Méritos de los Ayudantes en Medina (Ansar)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
