text: "قال رسول الله: «بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدا رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان»"
summary:
  ar: "حديث ابن عمر المشهور في باب «بني الإسلام على خمس» من كتاب الإيمان؛ الوصية التأسيسية التي جعلت الشهادة والصلاة والزكاة والحج والصيام دعائم الدين الخمس. وفي رواية مسلم الأخرى تقديم «على أن يعبد الله ويكفر بما دونه»."
