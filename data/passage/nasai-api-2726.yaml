label: { ar: "سنن النسائي 2726 — التحريم", en: "Sunan al-Nasa'i 2726 — prohibition", ur: "سنن نسائی 2726 — تحریم", es: "Sunan al-Nasa'i 2726 - prohibición", fr: "Sunan al-Nasa'i 2726 - interdiction" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى الصَّنْعَانِيُّ، قَالَ حَدَّثَنَا خَالِدٌ، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ حَدَّثَنِي حُمَيْدُ بْنُ هِلاَلٍ، قَالَ سَمِعْتُ مُطَرِّفًا، يَقُولُ قَالَ لِي عِمْرَانُ بْنُ حُصَيْنٍ جَمَعَ رَسُولُ اللَّهِ بَيْنَ حَجٍّ وَعُمْرَةٍ ثُمَّ تُوُفِّيَ قَبْلَ أَنْ يَنْهَى عَنْهَا وَقَبْلَ أَنْ يَنْزِلَ الْقُرْآنُ بِتَحْرِيمِهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 2726، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2726 (The Book of Hajj), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2726، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2726 (El Libro del Hajj), menciona la prohibición. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2726 (Le Livre du Hajj), mentionne une interdiction. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
