text: "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ أَبِي مُرَاوِحٍ، عَنْ أَبِي ذَرٍّ ـ قَالَ سَأَلْتُ النَّبِيَّ أَىُّ الْعَمَلِ أَفْضَلُ، قَالَ \" إِيمَانٌ بِاللَّهِ، وَجِهَادٌ فِي سَبِيلِهِ \". قُلْتُ فَأَىُّ الرِّقَابِ أَفْضَلُ قَالَ \" أَغْلاَهَا ثَمَنًا، وَأَنْفَسُهَا عِنْدَ أَهْلِهَا \". قُلْتُ فَإِنْ لَمْ أَفْعَلْ. قَالَ \" تُعِينُ صَانِعًا أَوْ تَصْنَعُ لأَخْرَقَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2518، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2518 (Manumission of Slaves), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2518، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
