label: { ar: "سنن أبي داود 2663 — الأب والأبوة", en: "Sunan Abi Dawud 2663 — the father and fatherhood", ur: "سنن ابی داؤد 2663 — باپ اور والدیت", es: "Sunan Abi Dawud 2663 — El padre y la paternidad", fr: "Sunan Abi Dawud 2663 — le père et la paternité" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ سِنَانٍ، حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِيُّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ سُلَيْمَانَ بْنِ الْغَسِيلِ، عَنْ حَمْزَةَ بْنِ أَبِي أُسَيْدٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ حِينَ اصْطَفَفْنَا يَوْمَ بَدْرٍ \" إِذَا أَكْثَبُوكُمْ - يَعْنِي إِذَا غَشُوكُمْ - فَارْمُوهُمْ بِالنَّبْلِ وَاسْتَبْقُوا نَبْلَكُمْ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2663، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2663 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2663، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2663 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2663 (Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
