label:
  ar: "سنن ابن ماجه، كتاب الطهارة وسننها"
  en: "Sunan Ibn Majah, Book 1: The Book of Purification and its Sunnah"
  ur: "سنن ابن ماجہ، کتاب الطہارۃ وسننہا"
  es: "Sunan Ibn Majah, Libro 1: El Libro de la Purificación y su Sunnah"
summary:
  ar: "القسم 1 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطهارة وسننها»، ويضم فيها النصوص من 267 إلى 666 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 1 of Sunan Ibn Majah (The Book of Purification and its Sunnah) in the division of the open hadith dataset the museum took its reports from: reports 267 to 666 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 1، عنوان «کتاب الطہارۃ وسننہا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 267 تا 666۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El Libro 1 de Sunan Ibn Majah (El Libro de la Purificación y su Sunnah) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 267 al 666, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
