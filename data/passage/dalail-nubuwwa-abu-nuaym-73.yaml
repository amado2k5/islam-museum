text: "خلق كريم، أجعل السكينة لباسه والبر شعاره، والتقوى ضميره، والحكمة معقوله، والصدق والوفاء طبيعته، والعفو والمغفرة والمعروف خلقه، والعدل سيرته، والحق شريعته، والهدى إمامه،. والإسلام ملته، وأحمد اسمه، أهدي به بعد الضلالة، وأعلم به بعد الجهالة، وأرفع به الخمالة، وأسمي به بعد"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، في مراسلات ملوك اليمن، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Dalail al-Nubuwwa, in the correspondence with the kings of Yemen, from the extracted copy; quoted within forty words per the sources policy."
