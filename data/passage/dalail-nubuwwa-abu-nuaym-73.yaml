text: "خلق كريم، أجعل السكينة لباسه والبر شعاره، والتقوى ضميره، والحكمة معقوله، والصدق والوفاء طبيعته، والعفو والمغفرة والمعروف خلقه، والعدل سيرته، والحق شريعته، والهدى إمامه،. والإسلام ملته، وأحمد اسمه، أهدي به بعد الضلالة، وأعلم به بعد الجهالة، وأرفع به الخمالة، وأسمي به بعد"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، في مراسلات ملوك اليمن، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Dalail al-Nubuwwa, in the correspondence with the kings of Yemen, from the extracted copy; quoted within forty words per the sources policy."
  es: "Fragmento de la obra Dalail al-Nubuwwa de Abu Nu'aym, perteneciente a la correspondencia con los reyes de Yemen, extraído del texto original; citado en un máximo de cuarenta palabras, de acuerdo con la política de fuentes."
  fr: "Extrait du Dalail al-Nubuwwa d'Abu Nu'aym, dans la correspondance avec les rois du Yémen, tiré de la copie extraite; cité en quarante mots conformément à la politique des sources."
  ur: "ابو نعیم کی دلائل النبوۃ سے ایک اقتباس، یمن کے بادشاہوں کے ساتھ خط و کتابت میں، نکالی گئی کاپی سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
