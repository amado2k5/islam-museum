text: "… إلى قومي حتى أمر بالنجاشي، وكان للنبي ملع صديقاً، فمررت به، فبينا أنا عنده جالس إذْ مر ابن له صغير، فاستقرأه لوحاً معه، فقرأه الغلام، فضحكت، فقال النجاشي: مم ضحكت! فوالله لهكذا أُنْزِلتْ على لسان عيسى بن مريم: إن اللعنة …"
