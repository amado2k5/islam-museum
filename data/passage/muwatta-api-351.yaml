label: { ar: "موطأ مالك 351 — النافلة والنوافل، ما لا بأس به", en: "Muwatta Malik 351 — the supererogatory (nafila); what is said to be no harm", ur: "موطأ مالک 351 — نفل اور نوافل، جس میں کوئی مضائقہ نہیں", fr: "Muwatta de Malik 351 — le surérogatoire (nafila) ; ce qui est dit sans inconvénient", es: "Muwatta de Malik 351 — lo supererogatorio (nafila); lo que se dice que no tiene inconveniente", tr: "Muwatta Malik 351 — Nafile namazlar ve nafile ameller, caiz olanlar", id: "Muwatta Malik 351 — Shalat sunnah dan amalan sunnah, apa yang diperbolehkan" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ الْقَاسِمَ بْنَ مُحَمَّدٍ، وَعُرْوَةَ بْنَ الزُّبَيْرِ، وَأَبَا، بَكْرِ بْنَ عَبْدِ الرَّحْمَنِ كَانُوا يَتَنَفَّلُونَ فِي السَّفَرِ. قَالَ يَحْيَى وَسُئِلَ مَالِكٌ عَنِ النَّافِلَةِ فِي السَّفَرِ فَقَالَ لاَ بَأْسَ بِذَلِكَ بِاللَّيْلِ وَالنَّهَارِ وَقَدْ بَلَغَنِي أَنَّ بَعْضَ أَهْلِ الْعِلْمِ كَانَ يَفْعَلُ ذَلِكَ."
summary:
  ar: "حديث في موطأ مالك، رقم 351، يرد فيه ذكر النافلة والنوافل، وما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 351 (Shortening the Prayer), whose wording mentions the supererogatory (nafila), what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 351، جس کے الفاظ میں نفل اور نوافل، جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 351, dont le texte mentionne le surérogatoire (nafila), ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 351, cuyo texto menciona lo supererogatorio (nafila), lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 351 numaralı hadis, nafile amelleri ve caiz olan amelleri ele almaktadır. Farz amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh amelleri, haram amelleri ve küçük günahları derleyen bu eser, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 351, menyebutkan amalan sunnah dan amalan yang diperbolehkan. Penyusun kitab amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
