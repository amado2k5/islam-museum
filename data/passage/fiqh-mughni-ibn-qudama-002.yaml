text: "وسعاته، وكان في كتابه إلى قيصر: بسم الله الرحمن الرجيم. من محمد رسول الله، إلى قيصر عظيم الروم، أما بعد، فأسلم تسلم، وأسلم يؤتك الله أجرا عظيما، فإن توليت، فإن عليك إلم الأريسيين، «ويا أهل الكتاب تعالوا إلى كلمة سواء"
