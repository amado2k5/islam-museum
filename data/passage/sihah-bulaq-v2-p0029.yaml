text: |-
  •(LET•
  لما سمعت نغية كالشهد * رفعت من أطمار مستعد • وقلت لمعيس اغتدى وجدى
  الفراء النغية مثل النغمة والاصمعم:له وسعت منه نقيسة وهو الكلام الحسن قال أبو
  عمر والجرى النغية أول ما يبلفك من الخبر قبل أن تستثبته وهذا الجبل يناغى السماء أى
  يدائيها الطوله والمنائاة المغازلة والمرأة تناغى الصبىّ أى تكامه بمما يعجبه ويسر"هنفا نقاه
  طرده تول نفيته فانتنى وتنى هو أيضا يتعدى ولا يتعدى قال القطاعى
  فأصبح باراكم قتيلاونافيا • أى مستفيا وتقول هذا ينافى ذالا وهما يتنافيان والنفوة
  بالسكسر والذفية أيضا كل مانفيت والنفاية بالضم ما نفيته من الشئ زداد ته ونقى" المطر على
  فعيل ما تنفيه وترشه وكذلك ما تطاير من الرشاء على ظهر الماتح وقال
  كأن متنيه من النفى • مواقع الطير على الصن
  ونفت الريح ماتنق فى أصول الشيجر من التراب وغحوه والنفيان مثله ويشبه به ما يتطرف من
  معظم الجيش وقال
  وحرب يضج القوم من تفسانها • ضجيح الجمال الجلة الدبرات
  ويقال أتانى نفيحكم أى وعيدكم الذى توعدونى قا نقاوة الشى خياره
  وكذلك النقاية بالضم فيهما كا نه بنى على ضده وه والنفاية لان فعالة بأتى كثيرا فيما يسة ط
  من فضلة الشى يقال نقى الشى بالكسر بنق نقاوة بالفتح فهوننىّ أى تظيف والفقاءم_دود
  النظافة والتقامقصور الكتيب من الرمل وتثنيقه نقوان ونقيات أيضاوالنقاة مثسل القناة
  مايرى من الطعام اذانق حكاه الاموىّ وقال بعضهم نقاة كل شرديته ماخ_لا التمرفات
  نقائه خياره والتنقية التنظيف والانتقاء الاختيار والتنق التخير والنقو بالكسرفى قول
  الفراء كل عظ-م ذى مخ والهسع أنقاء والذق مخ العظم وشحم العين من السمن ونقوت العظم
  ونقيته اذا استخرجت نقيه وانتقيت العظسم مثله وأنقت الابل أى سمنت وصارفيهائق
  وكذلك غيرها قال الراجو فى صفة الخيل
  لا يشتكين عملاما أتقين • مادام مخ فى سلامى أوعين
  يقال هسذه ناقة منقية وعذه لا تنقى والفقاوى ضرب من الهض (نححكى نكيت
  فى العدونسكاية اذاقتات فيهم وجوحت قال أبو النجم * شكى العداونسكرم الاضيافا
  ( ا نما المال وغيره ينى نماء وربما قالوا يموغوا وأنماه اللّه قال الكسانى ولم أسمعه
  بالوا والامن أخوين من بنى سليم تم سألت عنسه بنى سليم فلم يعرفوم بالواو وحكى أبو عبيدها
  ينمووينى وفى الحديث لا تمثلوا بنامية اللّٰه يعنى الخلق لانه يمى ونموت اليه الحديث فأنا أنوه
  وأغميه وكذلك هو ينمو الى الحسب وينمى وغيت الشى على الشى رفعته عليه ومنه قول النابغة
  وانم القتود على عيرانة أجد• وتقول نميت الحديث الى فلان غيااذا أستدته ورفعته وكذلك
  نيت الرجل الى أييه نيانسبته اليه وانتمى هوانتسب قال الاصمعنميت الحديث مخففانيا
  اذا بلغته على وجه الاصلاح والخير وأصله الرفع ونيت الحديث تتمية اذا بلغته على وجه
  ا النميمة والافسادوغيت النارتنية اذا ألقمت عليه احطباوذ كيتهايه وغمى انخضاب والسعر
  (ارتقع وغلافهو يتمى وتقول رصت الص.دفأغمته اذاغاب عنك ثم مات وفى الحديث كل ما
