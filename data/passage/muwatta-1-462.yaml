text: "أسوأ السرقة الذي يسرق صلاته. قالوا: وكيف يسرق صلاته يا رسول الله؟ قال: لا يتم ركوعها ولا سجودها"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن النعمان بن مرة مرسلاً، في باب العمل في جامع الصلاة: سأل النبي أصحابه ما يرون في الشارب والسارق والزاني، وذلك قبل أن ينزل فيهم حكم، فقالوا الله ورسوله أعلم، فقال إنهن فواحش وفيهن عقوبة، وإن أسوأ السرقة الذي يسرق صلاته فلا يتم ركوعها ولا سجودها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن الرواة لم يختلفوا في إرساله وأنه حديث صحيح يُسند من حديث أبي هريرة وأبي سعيد (التمهيد 23/409)؛ ويناقش المحقق أسانيد الموصول من حديث أبي سعيد وأبي هريرة وأبي قتادة ويرى أن في إطلاق تصحيحها نظراً. {cite:muwatta-maruf-1997 p.237} {cite:muwatta-maruf-1997 p.238}"
