text: "أسوأ السرقة الذي يسرق صلاته. قالوا: وكيف يسرق صلاته يا رسول الله؟ قال: لا يتم ركوعها ولا سجودها"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن النعمان بن مرة مرسلاً، في باب العمل في جامع الصلاة: سأل النبي أصحابه ما يرون في الشارب والسارق والزاني، وذلك قبل أن ينزل فيهم حكم، فقالوا الله ورسوله أعلم، فقال إنهن فواحش وفيهن عقوبة، وإن أسوأ السرقة الذي يسرق صلاته فلا يتم ركوعها ولا سجودها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن الرواة لم يختلفوا في إرساله وأنه حديث صحيح يُسند من حديث أبي هريرة وأبي سعيد ⁦(التمهيد 23/409)⁩؛ ويناقش المحقق أسانيد الموصول من حديث أبي سعيد وأبي هريرة وأبي قتادة ويرى أن في إطلاق تصحيحها نظراً. {cite:muwatta-maruf-1997 p.237} {cite:muwatta-maruf-1997 p.238}"
  tr: "Malik, cemaat namazındaki ameller bölümünde, Yahya ibn Sa'id'den, Nu'man ibn Murrah'tan rivayetle, mursal bir hadis olarak şöyle nakletmiştir: Peygamberimiz, sahabelerine, içki içen, hırsızlık yapan ve zina eden kişi hakkında, henüz bir hüküm indirilmeden önce ne düşündüklerini sormuştur. Sahabeler, \"Allah ve Resulü en iyi bilir\" diye cevap vermişlerdir. Peygamberimiz şöyle buyurmuştur: \"Bunlar büyük günahlardır ve azapları vardır. En büyük hırsızlık ise namazından çalan, rükû ve secdeyi tamamlamayan kimsedir.\" Editör, Ebu Musab ve Suveyd'in bunu Malik'ten naklettiğini ve İbn Abdül-Barr'ın, ravîlerin mursal statüsü konusunda ihtilaf etmediklerini ve Ebu Hurayra ve Ebu Sa'id'den gelen, sahih bir rivayet zincirine sahip bir hadis olduğunu söylediğini aktarmaktadır (el-Temhid 23/409). Editör, Ebu Sa'id, Ebu Hurayra ve Ebu Katada'dan gelen bağlantılı rivayet zincirlerini tartışıyor ve bunların mutlak gerçekliği konusunda şüpheye yer olduğunu düşünüyor. {cite:muwatta-maruf-1997 s.237} {cite:muwatta-maruf-1997 s.238}"
  id: "Malik meriwayatkan hadits ini dari Yahya ibn Sa'id, yang juga dari Nu'man ibn Murrah, sebagai hadits mursal, dalam surah tentang amalan dalam salat berjamaah: Nabi bertanya kepada para sahabatnya tentang pendapat mereka mengenai orang yang minum minuman keras, pencuri, dan pezina, sebelum hukum diturunkan mengenai mereka. Mereka menjawab, \"Allah dan Rasul-Nya lebih mengetahui.\" Beliau bersabda, \"Ini adalah dosa-dosa besar, dan ada azabnya. Pencurian terburuk adalah orang yang mencuri dari salatnya, tidak menyelesaikan rukuk dan sujudnya.\" Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik, dan mengutip Ibn 'Abd al-Barr yang mengatakan bahwa para perawi tidak berselisih mengenai status mursalnya dan bahwa hadits ini sahih dengan sanad yang terhubung dari Abu Hurayrah dan Abu Sa'id (al-Tamhid 23/409). Penyunting membahas rangkaian periwayatan yang saling terkait dari Abu Sa'id, Abu Hurayrah, dan Abu Qatada dan meyakini bahwa masih ada ruang untuk meragukan keabsahan absolutnya. {cite:muwatta-maruf-1997 p.237} {cite:muwatta-maruf-1997 p.238}"
