text: "… ثبوت الفضل المطلق كحديث وأقرؤكم أبي وأفرضكم زيده ونجو ذلك، ومما يسأل عنه لحكمة في اختصاص عائشة بذلك، فقيل لمكان أبيها، وأنه لم يكن يفارق النبي لله في أغلب أحواله، فسرى سره لابنته مع ما كان لها من مزيد حبه …"
