text: "… ثم عَبِتَني بكتاب حيل اللصوص، وكتاب غِشّ الصناعات، وعبتَني بكتاب المُلَحِ والطُّرَف، وما حَرَّ من النوادر وبَرُد، وما عاد بارده حارًا لفَرْط برده حتى أمتَعَ بأكثر من إمتاع الحارّ، وعبتني بكتاب احتجاجات البخلاء، ومناقضَتِهم للسُّمَجاء، والقولِ في الفرق بين الصدق …"
