text: "… كان ذلك بشركة مع الأولى ولكان الثابت دقيقاً. هذا الكلام أيضا لا يصح لأنه بين أو لاً أن ثقبي الفقرة الأولى ليستا عن جانبيها ولو فرضنا أنهما على جانبيها لم مكن أن يكون ثقبا الثانية بشركة الأولى. قوله: وإذا تحرك …"
