label: { ar: "سنن أبي داود 652 — الأب والأبوة", en: "Sunan Abi Dawud 652 — the father and fatherhood", ur: "سنن ابی داؤد 652 — باپ اور والدیت", es: "Sunan Abi Dawud 652 — El padre y la paternidad", fr: "Sunan Abi Dawud 652 — Le père et la paternité" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا مَرْوَانُ بْنُ مُعَاوِيَةَ الْفَزَارِيُّ، عَنْ هِلاَلِ بْنِ مَيْمُونٍ الرَّمْلِيِّ، عَنْ يَعْلَى بْنِ شَدَّادِ بْنِ أَوْسٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" خَالِفُوا الْيَهُودَ فَإِنَّهُمْ لاَ يُصَلُّونَ فِي نِعَالِهِمْ وَلاَ خِفَافِهِمْ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 652، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 652 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 652، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 652 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 652 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
