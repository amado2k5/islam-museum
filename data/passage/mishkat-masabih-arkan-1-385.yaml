text: "… ثم أيّ لتراخي الرتبة لا لتراخي الزمان. تو اختلفت الأحاديث الواردة في أفضل الأعمال وأحبها إلى اللّه سبحانه، ففي هذا الحديث هكذا، وفي حديث أبي ذر أي العمل خير؟ قال: إيمان بالله، وجهاد في سبيل الله، وفي حديث أبي سعيد: …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 385، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 385, that mentions faith as the best of deeds, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 385 کا اقتباس جس میں ایمان بہترین عمل، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
