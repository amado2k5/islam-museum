text: "- - قال المؤلف : فحرسَ اللّه أيا أَيُوبَ بهذه الدعوةِ، حتى إن الرومَ لَتَحْرُس. قَبْرَ، ويَسْتَتُقُون به، ويَسْتَصِحُون، وذلك أنه غزا مع يَزِيدَ بن مُعَاوِيَةً سَنَّةَ خمْسين، لما بلقوا القُسْطَنْعِينَةَ مات أبو أَيُوبَ هدالك، وأوصى يزيد أن. يَدفنه فى …"
