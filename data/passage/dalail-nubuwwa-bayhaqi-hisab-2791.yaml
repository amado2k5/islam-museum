text: "… ينفعني اللّٰه به قال : أعلم أنك لا تسجد لله عز وجل سجدة إلا رفع لك بها درجة وحُطَّ عنك بها خطئةٌ . هكذا رواه جريرُ بن حازم ، عن محمد بن عبد اللّٰه بن أبي يعقوب ، عن رجاءٍ …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 2791، يذكر رفع الدرجات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 2791, that speaks of ranks raised; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 2791 کا اقتباس جس میں درجات کی بلندی کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 2791, que habla de rangos elevados; de la copia extraída, citada dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, p. 2791, qui parle de grades élevés; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 2791. sayfasından, mertebelerin yükseltilmesinden bahseden bir bölüm; alıntılanan versiyondan ve kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Bayhaqi “Bukti Kenabian”, hlm. 2791, yang menyebutkan kenaikan tingkatan; dari versi yang diekstrak, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
