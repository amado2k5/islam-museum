text: "… ينفعني اللّٰه به قال : أعلم أنك لا تسجد لله عز وجل سجدة إلا رفع لك بها درجة وحُطَّ عنك بها خطئةٌ . هكذا رواه جريرُ بن حازم ، عن محمد بن عبد اللّٰه بن أبي يعقوب ، عن رجاءٍ …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 2791، يذكر رفع الدرجات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 2791, that speaks of ranks raised; from the extracted copy, quoted within forty words per the sources policy."
