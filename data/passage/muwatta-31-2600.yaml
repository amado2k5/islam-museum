label: { ar: "الموطأ 2600 — ابن شهاب عن سعيد بن المسيب عن أبي هريرة: لو رأيت الظباء بالمدينة لم أذعرها", en: "Muwatta 2600", es: "2600 vatios", fr: "2600 watts", ur: "2600 واٹ", tr: "El-Muvatta 2600 — İbn Şihab, Said bin el-Musayyab'dan, o da Ebu Hurayra'dan rivayet ettiğine göre: Medine'de ceylanlar görsem, onları korkutmazdım.", id: "Al-Muwatta 2600 — Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab, berdasarkan riwayat Abu Hurairah: Jika aku melihat kijang di Madinah, aku tidak akan menakut-nakuti mereka." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة أنه كان يقول: لو رأيت الظباء بالمدينة ترتع ما ذعرتها، لأن النبي قال: ما بين لابتيها حرام. {cite:muwatta-maruf-1997 p.467} {cite:muwatta-maruf-1997 p.468}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan, o da Ebu Hurayra'dan rivayetle, şöyle derdi: \"Medine'de ceylanların otladığını görsem, onları korkutmazdım, çünkü Peygamber şöyle buyurmuştur: 'İki lav ovası arasında kalan yer kutsaldır.'\" {cite:muwatta-maruf-1997 s.467} {cite:muwatta-maruf-1997 s.468}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, dari Abu Hurayrah, bahwa ia biasa berkata: \"Jika aku melihat kijang merumput di Madinah, aku tidak akan menakut-nakuti mereka, karena Nabi bersabda: 'Apa yang terletak di antara dua ladang lava itu adalah suci.'\" {cite:muwatta-maruf-1997 p.467} {cite:muwatta-maruf-1997 p.468}"
