label: { ar: "الموطأ 2485 — مالك: جنين اليهودية والنصرانية إذا طُرح فيه عشر دية أمه", en: "Muwatta 2485", es: "Muwatta 2485", fr: "Muwatta 2485", ur: "موطا 2485", tr: "El-Muvatta 2485 — Malik: Eğer bir Yahudi veya Hristiyan kadının ceninine annesinin kan parasının onda biri verilirse, o cenin için kan parası ödenmesi gerekir.", id: "Al-Muwatta 2485 — Malik: Jika janin seorang wanita Yahudi atau Kristen diberi sepersepuluh dari uang darah ibunya, maka uang darah untuk janin tersebut wajib dibayarkan." }
summary:
  ar: "سُئل مالك عن جنين اليهودية والنصرانية يُطرح؟ فقال: أرى أن فيه عشر دية أمه. {cite:muwatta-maruf-1997 p.426}"
  tr: "Malik'e, Yahudi veya Hristiyan bir kadının fetüsünden alınan kürtaj hakkında soru soruldu. Cevabı şöyle oldu: \"Bence bu, annesinin kan parasının onda biri kadar değerlidir.\" {cite:muwatta-maruf-1997 s.426}"
  id: "Malik ditanya tentang janin seorang wanita Yahudi atau Kristen yang digugurkan. Dia menjawab: Saya percaya nilainya hanya sepersepuluh dari uang darah ibunya. {cite:muwatta-maruf-1997 p.426}"
