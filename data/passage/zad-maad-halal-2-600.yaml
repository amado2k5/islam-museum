text: "… شاء أن يُحرمها بعد المرة الثالثة، وإن شاء لم يُحرمها، ويمتنع أن يخير الرجل بينَ أن يجعل الشيء حلالاً، وأن يجعلَه حراماً، ولكن إنما يُخير بين مباحين له، وله أن يُباشر أسبابَ الحِل وأسباب التحريم، وليس له إنشاءُ نفس التحليل …"
