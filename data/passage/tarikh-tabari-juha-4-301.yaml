text: "… مبد الله بن دجاجة من بنى حنيفة طرخان الراوى. طرخان قائد من قواد بابكن طرخان الجمال طرخان بن محمد بن اسحاق بن كنداجيق..- طرخين طروش التركى طرفة بن العبد الشاعر طرفلة بن عبد الله بن دجاجة من بنى حنيقة طرفة …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك، المجلد المصوَّر 4، ص 301، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Rusul wa'l-Muluk, scan volume 4, p. 301, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الرسول و الملوک، اسکین جلد 4، ص 301 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Rusul wa'l-Muluk, volume numérisé 4, p. 301, avec une anecdote ou un trait d'esprit ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Tarikh al-Rusul wa'l-Muluk, volumen escaneado 4, p. 301, con una anécdota o agudeza; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Peygamberler ve Krallar Tarihi, Resimli Cilt 4, sayfa 301'den, esprili bir anekdot veya mizahi bir hikaye içeren bir alıntı; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir resimli versiyondan alınmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Para Nabi dan Raja, Jilid 4 Bergambar, halaman 301, berisi anekdot cerdas atau cerita lucu; diambil dari versi bergambar yang dapat dibaca mesin, dengan teks yang disarikan sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
