text: |-
  ٤٥٣
  أراد من بين من أثرى ومن أقترأى من بين مثرومقتر وأثرت الارض كثرثراها وأثرى
  لمطر بل الثرى وقولهم مابيني وبينك منرأى انه لم ينقطع وهو مثل كانه قال لم ييبس النرى
  بينى وبينك كماقال عليه السلام بلوا أرحامكم ولوبالسلام قال جرير
  فلاتوبسوابينى ويينكم الثرى * فان الذى بدني ويينكم مثرى
  وتويت الموضع تثرية أى رتشته وتزيت السويق أيضابللته وأبو ثروان كنية رجل من
  دواة الشوي وفن القفاءموات الخلا والعزواف الما والثافة اعدا وقا اف
  ناغ ولاراغ أى أحد ⁦(نفى )⁩ الاثفية للقدرتقديرها أذمولة والجمع الاثافى وان شئت
  لها ثلاثة أزواج والرجل مشف وثفيت القدر تثفية أى وضعتها على الاثافى وأثفيت لها أى
  جعلت لها أثافىّ قال الراجز » وصاليات ك كما يؤثفين * أرادينفين فأخرجه على
  الاصل ( ن ى الثغاية حبسل من شعرأ وصوف قال الراجزه الجر الاخشن والثفايه
  وأما الثناء ممدود فعقال البعير ونحوذلك من حبل مننىّ وكل واحد من ثنييه فهوثنا لوأفرد
  نقول عقلت البعير بثنا يين اذا عقات يديه جميعا بجبل أوبطر فى حبل واتالم يه مزلانه لفظ جاه
  مثنى لا يفردوا حده فيقال ثناء فتركت الياء على الاصل كما ذعلوا فى مذروين لانّ أصل الهمزة
  فى ثناء لو أفردياء لانه من ثنيت ولو أفرد واحده لقيسل ثنا آن كما تقول كسا آن وردا آن والثنى
  واحد أثناه الشى أى تضاعيفه تقول أنفذت كذا فى ثنى كتابى أى فى طيه قال أبو عبيد
  والثنى من الوادى والجبل منعطفه وثنى الجبل ماثنيت قال طرفة
  لعمرك ان الموت ما اخطأ الفتى * لسكالطول المرخى وتنياه باليد
  والثنى أيضامن النوق التى وضعت بطنين وثنيها ولدها وكذلك المرأة ولا يقال ثلث ولا فوق
  ذلك والثنى مقصورا الامريعاد مرتين وفى الحديث لائنى فى الصدقة أى لا تؤخذ فى
  السنة مرتين قال الشاعر
  أفى جنب بكر قطعتنى ملامة • لعمرى لقد كانت ملامتهائى
  والثقيا بالضم الاسم من الاستناء وكذلك التنوى بالفتح ويقال جاؤامثنى مثنى أى اثنين اثنين
  ومثنى وثناء غير صروفين لماقاناه فى ثلاث من باب الثاء وقال أبو عبيدة منى الايادى هى
  الانصباء التى كانت تفضل من الجزور فى الميسر فكان الرجل الجواد يشتريها فيعطيها الابرام
  وقال أبو عمر ومثنى الايادى أن يأخذ القسم مرّة بعدمرة قال النابغة
  انى أتمم أيسارى وأمنحهم * مثنى الايادى وأكسو الجفنة الادما
  وفى الحديث من أشراط الساعة أن توضع الاخياروترفع الاشرار وأن تقرأ المثناةء-لى
  ؤم الناس فلا تغير ,قال هى التى تسمى بالفارسية دوبيي وهو الغناء وكان أبوعبه
  ذهب فى تأويله الى غير هذا وثذت الشىء ثنيا عطفته وثناه أى كفه يقسال جاءثانيا من عناز
  وثذيته أيضاصرفته عن حاجته وكذلك اذاصرت له ثانيا وثنيته تثنيمة أى جعلته اثنيز
