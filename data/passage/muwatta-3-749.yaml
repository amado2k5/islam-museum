summary:
  ar: "أول نص في باب ما لا زكاة فيه من الفواكه والقضب والبقول. يقول مالك: السنة التي لا اختلاف فيها عندنا والذي سمع من أهل العلم أنه ليس في شيء من الفواكه كلها صدقة: الرمان والفرسك والتين وما أشبه ذلك وما لم يشبهه إذا كان من الفواكه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.372}"
