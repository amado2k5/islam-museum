label: { ar: "الموطأ 749 — مالك: ليس في شيء من الفواكه كلها صدقة: الرمان والفرسك والتين وما أشبه ذلك", en: "Muwatta 749", es: "Muwatta 749", fr: "Muwatta 749", ur: "موطا 749", tr: "Al-Muwatta 749 — Malik: Nar, şeftali, incir ve benzerleri de dahil olmak üzere hiçbir meyveden zekât istenmez.", id: "Al-Muwatta 749 — Malik: Tidak ada zakat yang wajib dibayarkan atas buah-buahan apa pun, termasuk delima, persik, ara, dan sejenisnya." }
summary:
  ar: "أول نص في باب ما لا زكاة فيه من الفواكه والقضب والبقول. يقول مالك: السنة التي لا اختلاف فيها عندنا والذي سمع من أهل العلم أنه ليس في شيء من الفواكه كلها صدقة: الرمان والفرسك والتين وما أشبه ذلك وما لم يشبهه إذا كان من الفواكه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.372}"
  tr: "Meyveler, otlar ve baklagiller hakkındaki bölümün ilk metni zekâta tabi olmayanlardır. Malik şöyle buyuruyor: Bizde yerleşik uygulama ve âlimlerden işitilen şudur ki, nar, şeftali, incir ve benzerleri de dahil olmak üzere hiçbir meyveden zekât alınmaz; hatta bunlara benzemeyen, meyve olanlardan bile zekât alınmaz. Editör, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.372}"
  id: "Teks pertama dalam bab tentang buah-buahan, rempah-rempah, dan kacang-kacangan yang tidak dikenakan zakat. Malik berkata: Kebiasaan yang telah mapan di antara kita, dan yang telah didengar dari para ulama, adalah bahwa tidak ada zakat yang wajib dikenakan pada buah apa pun: delima, persik, ara, dan sejenisnya, bahkan yang bukan sejenisnya, jika itu adalah buah-buahan. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.372}"
