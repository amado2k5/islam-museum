label: { ar: "الموطأ 564 — أبو الدرداء: ألا أخبركم بخير أعمالكم… ذكر الله؛ ومعاذ: ما عمل ابن آدم عملاً أنجى له من عذاب الله من ذكر الله", en: "Muwatta 564", es: "Muwatta 564", fr: "Muwatta 564", ur: "موطا 564", tr: "El-Muvatta 564 — Ebu el-Darda’: Size en hayırlı amelinizi söylemeyeyim mi… Allah’ı anmak? Ve Mu’az: Âdemoğlunun hiçbir amelinin, Allah’ı anmaktan daha fazla Allah’ın azabından kurtarıcı etkisi yoktur.", id: "Al-Muwatta 564 — Abu al-Darda’: Tidakkah aku akan memberitahumu tentang amal perbuatanmu yang terbaik… yaitu mengingat Allah? Dan Mu’adz: Tidak ada amal perbuatan anak Adam yang lebih mungkin menyelamatkannya dari azab Allah selain mengingat Allah." }
text: "ما عمل ابن آدم من عمل أنجى له من عذاب الله، من ذكر الله"
summary:
  ar: "يرويه مالك عن زياد بن أبي زياد، قال: قال أبو الدرداء: ألا أخبركم بخير أعمالكم وأرفعها في درجاتكم وأزكاها عند مليككم، وخير لكم من إعطاء الذهب والورق، وخير لكم من أن تلقوا عدوكم فتضربوا أعناقهم ويضربوا أعناقكم؟ قالوا: بلى. قال: ذكر الله. ويضيف زياد أن أبا عبد الرحمن معاذ بن جبل قال: ما عمل ابن آدم من عمل أنجى له من عذاب الله من ذكر الله. ويذكر المحقق أن الأثر الموقوف رواه عن مالك أبو مصعب وسويد، وأنه روي مرفوعاً من حديث أبي بحرية عن أبي الدرداء عند أحمد (5/195) والترمذي (3377) وابن ماجة (3790) والحاكم (1/496)، وأن قول معاذ أخرجه الطبراني وابن عبد البر في التمهيد (6/57) من حديث أبي الزبير عن طاووس عن معاذ مرفوعاً. {cite:muwatta-maruf-1997 p.289} {cite:muwatta-maruf-1997 p.290}"
  tr: "Malik, Ziyad ibn Abi Ziyad'dan rivayet ettiğine göre, Ebu el-Darda şöyle dedi: \"Size en hayırlı amelinizi, en yüksek mertebeli olanı, Rabbinizin katında en temiz olanı, altın ve gümüş vermekten daha hayırlı olanı, düşmanınızla karşılaşıp onların boynunu kırmaktan ve onların da sizin boynunuzu kırmasından daha hayırlı olanı söylemeyeyim mi?\" Dediler ki: \"Evet.\" O şöyle dedi: \"Allah'ı anmak.\" Ziyad, Ebu Abdül-Rahman Mu'azh ibn Cebel'in şöyle dediğini de ekler: \"Âdemoğlunun yaptığı hiçbir amel, Allah'ı anmaktan daha çok Allah'ın azabından kurtarmaz.\" Araştırmacı, Sahabe'ye atfedilen rivayetin, Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini ve Ahmed (5/195), Tirmizi (3377), İbn Mâce (3790) ve Hakim (1/496)'nın hadis derlemelerinde Ebu Bahriyye'den, o da Ebu el-Darda'dan rivayet edilerek Peygamberimize dayandırılan bir hadis olarak nakledildiğini belirtmektedir. Muaz'ın ifadesi ise Taberani ve İbn Abdül-Barr tarafından el-Temhid'de (6/57), Ebu el-Zübeyr'den, o da Tavus'tan, o da Muaz'dan rivayet edilerek, Peygamberimize dayandırılarak kaydedilmiştir. {cite:muwatta-maruf-1997 s.289} {cite:muwatta-maruf-1997 s.290}"
  id: "Malik meriwayatkan hadits ini dari Ziyad ibn Abi Ziyad, yang berkata: Abu al-Darda’ berkata: “Tidakkah aku akan memberitahukan kepadamu tentang amal perbuatanmu yang terbaik, yang paling tinggi derajatnya, yang paling suci di sisi Tuhanmu, yang lebih baik bagimu daripada memberi emas dan perak, dan lebih baik bagimu daripada menghadapi musuhmu dan memenggal leher mereka dan mereka memenggal lehermu?” Mereka menjawab: “Ya.” Beliau berkata: “Mengingat Allah.” Ziyad menambahkan bahwa Abu Abd al-Rahman Mu’adh ibn Jabal berkata: “Tidak ada amal perbuatan yang dilakukan oleh anak Adam yang lebih mungkin menyelamatkannya dari azab Allah daripada mengingat Allah.” Peneliti menyebutkan bahwa riwayat yang dinisbahkan kepada seorang Sahabat diriwayatkan dari Malik oleh Abu Mus’ab dan Suwaid, dan diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) dari Abu Bahriyyah dari Abu al-Darda’ dalam kumpulan Ahmad (5/195), al-Tirmidhi (3377), Ibn Majah (3790), dan al-Hakim (1/496). Pernyataan Mu’adh dicatat oleh al-Tabarani dan Ibn Abd al-Barr dalam al-Tamhid (6/57) dari Abu al-Zubayr dari Tawus dari Mu’adh, yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya). {cite:muwatta-maruf-1997 p.289} {cite:muwatta-maruf-1997 p.290}"
