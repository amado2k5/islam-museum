label: { ar: "الموطأ 564 — أبو الدرداء: ألا أخبركم بخير أعمالكم… ذكر الله؛ ومعاذ: ما عمل ابن آدم عملاً أنجى له من عذاب الله من ذكر الله", en: "Muwatta 564" }
text: "ما عمل ابن آدم من عمل أنجى له من عذاب الله، من ذكر الله"
summary:
  ar: "يرويه مالك عن زياد بن أبي زياد، قال: قال أبو الدرداء: ألا أخبركم بخير أعمالكم وأرفعها في درجاتكم وأزكاها عند مليككم، وخير لكم من إعطاء الذهب والورق، وخير لكم من أن تلقوا عدوكم فتضربوا أعناقهم ويضربوا أعناقكم؟ قالوا: بلى. قال: ذكر الله. ويضيف زياد أن أبا عبد الرحمن معاذ بن جبل قال: ما عمل ابن آدم من عمل أنجى له من عذاب الله من ذكر الله. ويذكر المحقق أن الأثر الموقوف رواه عن مالك أبو مصعب وسويد، وأنه روي مرفوعاً من حديث أبي بحرية عن أبي الدرداء عند أحمد (5/195) والترمذي (3377) وابن ماجة (3790) والحاكم (1/496)، وأن قول معاذ أخرجه الطبراني وابن عبد البر في التمهيد (6/57) من حديث أبي الزبير عن طاووس عن معاذ مرفوعاً. {cite:muwatta-maruf-1997 p.289} {cite:muwatta-maruf-1997 p.290}"
