text: "… الملائِكَةَ لَتَضَعُ أَجْنِحَتَهَا رِضًا لِطَالِبِ الْعِلْمِ، وَإِنَّ الْعَالِمِ لَيَسْتَغْفِرُ لَهُ مَنْ فِي السَّمّوَاتِ وَمَنْ فِي الأَرْضِ، وَالْحِيتَانُ فِي جَوْفِ الْمَاءِ، وَإِنَّ فَضْلَ الْعَالِمِ عَلَى الْعَابِدِ كَفَضْلِ الْقَمَرِ لَيْلَةَ الْبَدْرِ عَلَى سَائِرِ الْكَوَاكِبِ، وَإِنَّ الْعُلَمَاءَ وَرَثَةُ الأَنْبِيَاءِ، وَإِنَّ الأَنْبِيَاءَ لَمْ يُوَرِّثُوا …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 38، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 38, that mentions what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 38 کا اقتباس جس میں ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 1, pág. 38, que menciona lo que quedó: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal, volume 1, page 38, mentionnant le patrimoine et l'héritage. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur Testaments Browser."
  tr: "Ahmed ibn Hanbal'ın \"El-Zuhd\" (Zühd) adlı eserinin 1. cildinin 38. sayfasından, mal varlığı ve mirasından bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Kemaksiatan) karya Ahmad ibn Hanbal, Jilid 1, halaman 38, yang menyebutkan harta dan warisannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
