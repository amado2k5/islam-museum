  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 690, whose wording mentions the disliked (makruh), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
