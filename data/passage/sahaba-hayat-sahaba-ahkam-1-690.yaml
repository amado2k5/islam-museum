text: "… ويلفتون النظر عن الأسباب المادية والأمتعة الفانية تحمل المكروه والشدائد اخرج البزار عن عبد الرحمن بن عوف قال : نزل الإسلام بالكره والشدة فوجدنا خير الخير فى الكراهة نخرجنا مع رسول اللّٰه من مكة فجمل لنا فى ذلك العلاء والظفر، …"
summary:
