text: |-
  ١٣١
  أن تحمق وتتك وقد تكه النبيذمثل هكه وهرجه اذا بلغ منه وتكتكت الشى أى وطئته حتى
  شدخته ك تمك السنام يتهل غكا أى طال وارتفع فهو تامك
  صل الماء بك الحبال والمبيكة الطريقة فى الرمل ونحوه ويمع
  الحباك حبك وجمع الحبيكة حبائك وقره تعالى والسهاءذات الحيك قالواطرائق النجوم
  وقال الفراء الحيك تكسركل شى كالرمل اذاموت به الرمح الساكنة ولمساه القاتم اذامرت
  به الريح ودرع الحديد حبك أيضا والشعرة الجعدة تكسر ها حبسك وفى حدين الدجال
  ان شعر محبك حبك قال زهيربن أبى سلى
  مكلسل بأصول النجم تنسبه • ريح خريق لضاحى مانه حبك
  حبك النوب يحبكه بالحكسر -مكا أى أجاد نسبه قال ابن الاعراب كل شى
  أ-كمته وأحسنت عل فقد احتبكته وفى الحديث ان عاشة رض الّٰه منها كأن تحتيك
  تحت الدرع فى الصلاة أى تشذ الازاوونحكمه والاحتياك أيضا الاحتبا عن الاصجبىّ
  والحبوك الشديد الخلق من الفرس وغيره وقال أبودواد
  حرح الدين فأعددت ه • مشرف الحارك محبوك الكتد
  والحبكة مثل العبكة وهى الحية من السويق حتك حتك الرجل يحتك حتكا
  وحنكانا أى مشى وقارب الخطووأسرع ويقال لا أدرى على أى وجه حنكرا وربعا
  فالواعنكوا أى توجهوا والحوتك والدرتكى القصير الضاوى وقال
  وهل كنت الاحوتكيا ألاقه • بنوعم حتى بقى وتجبرا
  والحواتك رئال النعام حبرك قال أبوزيد الحبركى القراد قالت خفساه
  فلست بمرضع ندبى حبركى • أبوه من بن جشم بن بكر
  والاتى حبر كاة قال أبوع رالجرمى قد جعل بعضهم الالف فى حبركى للتأنيث :لم يصرفه وربما
  شبه به الرجل الفليظ الطويل الظهر القصير الرحلين فيقال حبركى وتصغيره حبيرك لان الالف
  المقصورة تحذف فى التصغيراذا كانت خامسة سواء كانت لمنأنيت أواغره تقول فى قرقرى
  قرقرولى جحيبى جميجب وفى-ولا ياحو إلى وامى تثيت الالف فيه اذاحكانت عمدودة
  رل) الحركة ضد السكون وحركمه قصرّكْ ويقال مابه والأأى ركة والمحراك
  تحراث الذى تحرك" به النار وغلام ول أى خفيفذ كى والخارك من الفرص فروع
  الكتفين وهو أيضا الكاه-ل وحركته أحركد وكاأصيت حاركه والحرككة الحرقفة
  والجمع الحراكل والمراكيك وهى رؤس الوركين ويقال اطراف الوركين عمايلى
  الارض اذا قعدت ( زل الاحتزاك الاحتزام بالثوب قال الفراء حزكته بالحبل
  أحزكه لغة فى حزقته أى شددته ( سك الحك حان العدان الواحدة
  حسكة والحك أيضاما يعمل من الحديد على مثاله وهو من آلات العسكر وقواهم فى
  صدره على حسيكة وحساكة أى ضغن وعداوة وقد جسك على بالكسرحكاوالحيكة
  القنقذ شك حشكت الدرّة غشف حشكا بالتكين وحشوكا امتلات
  وأماقول زهير • ناف العيون فلم يتظر الحشلا • فانما حتركه للضرورة أى لم تنتغاربه
  قوله الحلاحك العدان
  عارة القاموس الحك محرة
  تبات تعلق عرته بسوف الغنم ورقه
  كورق الرجلة اوأدق وعند ورقه
  شوك ملززصاب ذوئلات شعب
  وله عرشريه يفتت حصى الكابتين
  والمثانة وكذاشرب عصيرورقه
  جيد لباءة وعسر البول وخش
  الافاعى ورشه فى المنزن يقت.ل
  البراغيت ا•
