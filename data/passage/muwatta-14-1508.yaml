label: { ar: "الموطأ 1508 — ابن شهاب عن زيد بن ثابت: إذا دخل الرجل بامرأته فأرخيت عليهما الستور فقد وجب الصداق", en: "Muwatta 1508", es: "Muwatta 1508", fr: "Muwatta 1508", ur: "موطا 1508", tr: "El-Muvatta 1508 — İbn Şihab, Zeyd ibn Sabit'ten rivayetle: Bir erkek karısının yanına girer ve üzerlerine perdeler çekilmişse, mehir farz olur.", id: "Al-Muwatta 1508 — Ibn Shihab berdasarkan riwayat Zayd ibn Thabit: Jika seorang pria memasuki kamar istrinya dan tirai telah ditutup, maka mahar menjadi wajib." }
summary:
  ar: "يروي مالك عن ابن شهاب أن زيد بن ثابت قال إذا دخل الرجل بامرأته، فأرخيت عليهما الستور، فقد وجب الصداق. {cite:muwatta-maruf-1997 p.33}"
  tr: "Malik, İbn Şihab'dan rivayetle Zeyd ibn Sabit'in şöyle dediğini aktarır: Eğer bir erkek karısının yanına girer ve üzerlerine perdeler çekilmişse, mehir ödenmesi gerekir. {cite:muwatta-maruf-1997 s.33}"
  id: "Malik meriwayatkan dari Ibn Shihab bahwa Zayd ibn Thabit berkata: Jika seorang pria masuk menemui istrinya dan tirai telah ditutup, maka mahar wajib diberikan. {cite:muwatta-maruf-1997 p.33}"
