label: { ar: "جامع الترمذي 829 — الأب والأبوة", en: "Jami' al-Tirmidhi 829 — the father and fatherhood", ur: "جامع ترمذی 829 — باپ اور والدیت", es: "Jami' al-Tirmidhi 829 — El padre y la paternidad" }
text: "… الْمَلِكِ بْنِ أَبِي بَكْرِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ الْحَارِثِ بْنِ هِشَامٍ، عَنْ خَلاَّدِ بْنِ السَّائِبِ بْنِ خَلاَّدٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَتَانِي جِبْرِيلُ فَأَمَرَنِي أَنْ آمُرَ أَصْحَابِي أَنْ يَرْفَعُوا أَصْوَاتَهُمْ بِالإِهْلاَلِ وَالتَّلْبِيَةِ \". قَالَ وَفِي الْبَابِ عَنْ زَيْدِ بْنِ خَالِدٍ وَأَبِي هُرَيْرَةَ وَابْنِ عَبَّاسٍ. قَالَ أَبُو عِيسَى حَدِيثُ خَلاَّدٍ عَنْ أَبِيهِ حَدِيثٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 829، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 829 (The Book on Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 829، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 829 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
