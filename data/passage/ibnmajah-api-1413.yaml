label: { ar: "سنن ابن ماجه 1413 — رفع الدرجات", en: "Sunan Ibn Majah 1413 — ranks raised", ur: "سنن ابن ماجہ 1413 — درجات کی بلندی", es: "Sunan Ibn Majah 1413 - rangos elevados", fr: "Sunan Ibn Majah 1413 - rangs élevés", tr: "Sünen İbn Mace 1413 — Rütbeleri Yükseltmek", id: "Sunan Ibnu Majah 1413 — Menaikkan Pangkat" }
text: "… أَبُو عَبْدِ اللَّهِ الأَلْهَانِيُّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" صَلاَةُ الرَّجُلِ فِي بَيْتِهِ بِصَلاَةٍ وَصَلاَتُهُ فِي مَسْجِدِ الْقَبَائِلِ بِخَمْسٍ وَعِشْرِينَ صَلاَةً وَصَلاَتُهُ فِي الْمَسْجِدِ الَّذِي يُجَمَّعُ فِيهِ بِخَمْسِمِائَةِ صَلاَةٍ وَصَلاَةٌ فِي الْمَسْجِدِ الأَقْصَى بِخَمْسِينَ أَلْفِ صَلاَةٍ وَصَلاَةٌ فِي مَسْجِدِي بِخَمْسِينَ أَلْفِ صَلاَةٍ وَصَلاَةٌ فِي الْمَسْجِدِ الْحَرَامِ بِمِائَةِ أَلْفِ صَلاَةٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1413، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1413 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1413، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1413 (Establecimiento de la oración y la Sunnah al respecto), que habla de rangos elevados. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 1413 (Établissement de la prière et de la Sunna à ce sujet), évoque l'élévation des rangs. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou pèsent un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 1413 numaralı hadis, mertebelerin yükseltilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesini, eylemleri sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1413, menyebutkan tentang peningkatan derajat. Hadits ini menggabungkan daftar amal baik dan buruk dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
