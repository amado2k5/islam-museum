label: { ar: "سنن ابن ماجه 1413 — رفع الدرجات", en: "Sunan Ibn Majah 1413 — ranks raised", ur: "سنن ابن ماجہ 1413 — درجات کی بلندی" }
text: "… أَبُو عَبْدِ اللَّهِ الأَلْهَانِيُّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" صَلاَةُ الرَّجُلِ فِي بَيْتِهِ بِصَلاَةٍ وَصَلاَتُهُ فِي مَسْجِدِ الْقَبَائِلِ بِخَمْسٍ وَعِشْرِينَ صَلاَةً وَصَلاَتُهُ فِي الْمَسْجِدِ الَّذِي يُجَمَّعُ فِيهِ بِخَمْسِمِائَةِ صَلاَةٍ وَصَلاَةٌ فِي الْمَسْجِدِ الأَقْصَى بِخَمْسِينَ أَلْفِ صَلاَةٍ وَصَلاَةٌ فِي مَسْجِدِي بِخَمْسِينَ أَلْفِ صَلاَةٍ وَصَلاَةٌ فِي الْمَسْجِدِ الْحَرَامِ بِمِائَةِ أَلْفِ صَلاَةٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1413، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1413 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1413، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
