text: "… بن مَعْبَد بن عَبَّاس، عن بَعْضٍ أهله، أن عَبْدَ المطلب تُوُفِّيَ ورسولُ اللهِ وَلِعمِ ابنُ ثماني سنين. قال ابن إسحاق: حدثني محمد بن سَعيد بن الْمُسَيّب: أن عبد المطلب لمّا حَضَرَتْهُ الوَفَاةُ، وَعَرَفَ أَنَّهُ مَيْتٌ؛ جَمَعَ بَنَاتَهُ - وكُنَّ ستَّ …"
