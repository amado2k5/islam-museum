label: { ar: "جامع الترمذي 1299 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1299 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1299 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 1299 — lo que se ha hecho lícito; lo que no es lícito", fr: "Jami' al-Tirmidhi 1299 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Cami' el-Tirmizi 1299 — Neler caizdir, neler caiz değildir", id: "Jami' al-Tirmidhi 1299 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… هِبَةً لِغَيْرِ ذِي رَحِمٍ مَحْرَمٍ فَلَهُ أَنْ يَرْجِعَ فِيهَا مَا لَمْ يُثَبْ مِنْهَا. وَهُوَ قَوْلُ الثَّوْرِيِّ. وَقَالَ الشَّافِعِيُّ لاَ يَحِلُّ لأَحَدٍ أَنْ يُعْطِيَ عَطِيَّةً فَيَرْجِعَ فِيهَا إِلاَّ الْوَالِدَ فِيمَا يُعْطِي وَلَدَهُ. وَاحْتَجَّ الشَّافِعِيُّ بِحَدِيثِ عَبْدِ اللَّهِ بْنِ عُمَرَ عَنِ النَّبِيِّ قَالَ \" لاَ يَحِلُّ لأَحَدٍ أَنْ يُعْطِيَ عَطِيَّةً فَيَرْجِعَ فِيهَا إِلاَّ الْوَالِدَ فِيمَا يُعْطِي وَلَدَهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1299، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1299 (The Book on Business), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1299، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1299 (El Libro de los Negocios), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1299 (Le Livre des Affaires), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Cami' el-Tirmizi'nin 1299 numaralı hadisinde, helal ve haram olan şeyler açıklanmaktadır. Bu hadis, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1299, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
