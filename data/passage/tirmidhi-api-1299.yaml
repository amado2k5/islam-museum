label: { ar: "جامع الترمذي 1299 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1299 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1299 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… هِبَةً لِغَيْرِ ذِي رَحِمٍ مَحْرَمٍ فَلَهُ أَنْ يَرْجِعَ فِيهَا مَا لَمْ يُثَبْ مِنْهَا. وَهُوَ قَوْلُ الثَّوْرِيِّ. وَقَالَ الشَّافِعِيُّ لاَ يَحِلُّ لأَحَدٍ أَنْ يُعْطِيَ عَطِيَّةً فَيَرْجِعَ فِيهَا إِلاَّ الْوَالِدَ فِيمَا يُعْطِي وَلَدَهُ. وَاحْتَجَّ الشَّافِعِيُّ بِحَدِيثِ عَبْدِ اللَّهِ بْنِ عُمَرَ عَنِ النَّبِيِّ قَالَ \" لاَ يَحِلُّ لأَحَدٍ أَنْ يُعْطِيَ عَطِيَّةً فَيَرْجِعَ فِيهَا إِلاَّ الْوَالِدَ فِيمَا يُعْطِي وَلَدَهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1299، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1299 (The Book on Business), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1299، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
