label:
  ar: "أبو داود 821 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Abu Dawud 821 — I have divided the prayer between Myself and My servant in two halves"
  ur: "ابو داود 821 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج فهي خداج فهي خداج غير تمام . قال فقلت يا أبا هريرة إني أكون أحيانا وراء الإمام . قال فغمز ذراعي وقال اقرأ بها يا فارسي في نفسك فإني سمعت …"
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 821: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 821: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 821: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
