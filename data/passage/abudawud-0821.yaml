ref: "821"
label:
  ar: "أبو داود 821 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Abu Dawud 821 — I have divided the prayer between Myself and My servant in two halves"
  ur: "ابو داود 821 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
  es: "Abu Dawud 821 — He dividido la oración entre Mí y Mi siervo en dos mitades."
  fr: "Abou Dawoud 821 — J'ai divisé la prière entre Moi et Mon serviteur en deux parties."
  tr: "Ebu Davud 821 — Ben namazı kendimle kulum arasında ikiye böldüm."
  id: "Abu Dawud 821 — Aku telah membagi salat antara Diri-Ku dan hamba-Ku menjadi dua bagian."
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج فهي خداج فهي خداج غير تمام . قال فقلت يا أبا هريرة إني أكون أحيانا وراء الإمام . قال فغمز ذراعي وقال اقرأ بها يا فارسي في نفسك فإني سمعت …"
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 821: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 821: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 821: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Abi Dawud, n.° 821: He dividido la oración entre Mí y Mi siervo en dos mitades. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Abi Dawud, n° 821: « J’ai divisé la prière en deux parties entre Moi et Mon serviteur. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et du Muwatta."
  tr: "Sunan Ebu Davud'da 821 numaralı hadis-i kudsi şöyledir: \"Namazı kendim ve kulum arasında ikiye böldüm.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı şeriat hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Abi Dawud, no. 821: “Aku telah membagi shalat antara Diri-Ku dan hamba-Ku menjadi dua bagian.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
