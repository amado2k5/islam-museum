text: |-
  • ⁦(باب الواوواليا.)⁩•
  .⁦(سكا)⁩.
  ٥٤٩
  ومضوًا مثل الوقود والمعود وهذا أمر عمضوّ عليه وأمضيت الامى أنفذته والتمضى تفعل
  منه قال الراجز
  أصبح جيرانك بعد الخفض * يهدى السلام بعضهم لبعض * وقرّبو اللبين والتمضى
  والمضواء التقسدم وقال • فاذاحبسن مضى على مضوائه*(عطا المطامقصور الظهر
  والجمع الامطاء والمطية واحدة المطىّ والمطايا والمطىّ واحد وجع بذكرويونت والمطايافعالى
  وأصله فعائل الا أنه فعل به ما فعل يخطايا قال أبو العميثل المطية تذكر وتوّنت وأنشد أبو
  زيدزيعة بن مقروم الضبىّ جاهلى
  ومطعة.لث الظلام بعشته *يشكو الكلال الى دامى الاظلل
  والتمطى التخترومدّ اليدين فى المشى ويقال التمطى مأخوذ من المطبطسة وهو الماء الخائزف
  رؤبة
  به تمعت غول كل ميله * بناراجيج المهارى النفه
  والمعاواء من التطى على وزن الغلواء والمطو المدّيقال مطوت بالقوم مطوا اذامددت
  بهم فى البير قال الاصمعى المطية التى عط فى سيرها قال وهوه أخوذ من المطوأى المتقال أبو
  زيد يقال منه امتطيتها أى اتخذتها مطية وقال الاموىّ امتعيناها أى جعلناها
  مطايانا والمطو بالكسرعذق النخلة والجمع مطاءمثل جرووجراء ومطوالشئ
  ظيره وصاحبه وقال
  ناديت مطوى وقدمال النهاربهم * وعبرة العين يارد معها يجم
  وقال رجل من أسد السراة يصف برقا
  فطات لدى البيت العتيق أخيله • ومطواى مشتاقان له أرقان
  أى صاحياى ⁦( معى)⁩ الممى واحد الامعاء وفى الحديث المؤمن بأكل فى. فى واحد
  والكاذر فى سبعة أمعاء وهومثل لان المؤمن لا يأ كل الامن الحلال ويتوقى الحرام والشبهة
  والكافرلا يسالى ما أكل ومن أين أكل وكيفأ كل والمعى أيضا المذنب من مذائب الارض
  أبو عبيدادا أرطب النخل كل فذلك المعوقال وقياسه أن تكون الواحدة معوة ولم
  أسمعه قال وقال اليزيدى يقال منه أمعت النخلة وقال ابن دريد المعوة الرطبة اذاد خلها
  بعض اليبس قا مقوت السيف جلوته حكاه يونس عن أبى انخطاب وكذلك المرآة
  والطست حتى قالوامة اأسنانه قال ابن دريدامق هذا مة وك مالك أى صنه صيانتك مالك
  (مكا المكاء بالمدوالتشديد طار والبمع المكاكى والدكاء مخفف الصفير وقد مكايمكو مكوا
  ومكاءصفر قال تعالى وما كان صلاتهم عند البيت الامكاء وتصدية وقال عنترة يصف رجلا
  طعنه*تمكوفر بصته كشدق الاعلم * أبو عبيدمكت استه تمكومكاءاذا كانت مفتوحة
  والمكابالفتح مقصور بجر الثعاب والارنب ونحوه وكذلك المكو قال الطرمّاح
  كم به من مكووحشية • قيظ فى منقثل أوشيام
  وبجعه أمكاء وتمكى الفرس اذاحك عينه بركبته وقول الشاءر• كالمتمكى بدم الققيل• يريد
  كالمتوضئء والمتمسح ومكيت يده تمكامكا أى مجلت م-ن العسمل قال يعسقوب سمعتها من
  ١٣٨
  صاح
