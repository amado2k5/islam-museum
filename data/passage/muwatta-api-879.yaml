label: { ar: "موطأ مالك 879 — ما أُحل", en: "Muwatta Malik 879 — what was made lawful", ur: "موطأ مالک 879 — جو حلال کیا گیا" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ طَلْحَةَ بْنَ عُبَيْدِ اللَّهِ، كَانَ يُقَدِّمُ نِسَاءَهُ وَصِبْيَانَهُ مِنَ الْمُزْدَلِفَةِ إِلَى مِنًى. وَحَدَّثَنِي عَنْ مَالِكٍ أَنَّهُ سَمِعَ بَعْضَ أَهْلِ الْعِلْمِ يَكْرَهُ رَمْىَ الْجَمْرَةِ حَتَّى يَطْلُعَ الْفَجْرُ مِنْ يَوْمِ النَّحْرِ وَمَنْ رَمَى فَقَدْ حَلَّ لَهُ النَّحْرُ."
summary:
  ar: "حديث في موطأ مالك، رقم 879، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 879 (Hajj), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 879، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
