text: "… لحية أو شوارب فإنه لا يحرم إزالته بل يستحب. كما ذكره النووي وغيره. والتفلج ويقال له الوشر. قال النووي : وهذا الفعل حرام على الفاعل والمفعول بها. قال في نيل الأوطار : ظاهره أن التحريم المذكور إنما هو فيا إذا …"
