label: { ar: "سرية علي بن أبي طالب إلى اليمن", en: "Sariyya of Ali ibn Abi Talib to Yemen" }
text: "فعقد له رسول الله يومئذ لواء، أخذ عمامة فلفها مثنية مربعة فجعلها في رأس الرمح، ثم دفعها إليه، وقال: هكذا اللواء!"
summary:
  ar: "في رمضان سنة عشر بعث النبي علي بن أبي طالب إلى اليمن رسولاً قاضياً، فعقد له لواءً وأخذ عمامة فلفها مثنية مربعة فجعلها في رأس الرمح ثم دفعها إليه وقال: هكذا اللواء! وقال له: امض ولا تلتفت! فأقبل علي حتى نزل على سبأ وهم يعبدون الصليب، فدعاهم إلى الله وأسلموا. ويذكر الواقدي أن عروة بن محمد الزبيري حدثه أن عليا قال: بعثني رسول الله إلى اليمن..."
  en: "In Ramadan of year ten the Prophet sent Ali ibn Abi Talib to Yemen as judge and envoy; he bound a banner for him, wrapped a turban double into a square and fixed it on the spear-shaft, saying 'thus the banner!' and 'go and do not look back.' Ali reached Saba whose people worshipped the cross, called them to God and they submitted; al-Awra' ibn Muhammad al-Zubayri reports Ali's own account of the mission."
