label: { ar: "سرية علي بن أبي طالب إلى اليمن", en: "Sariyya of Ali ibn Abi Talib to Yemen", es: "Sariyya de Ali ibn Abi Talib a Yemen", fr: "Sariyya d'Ali ibn Abi Talib au Yémen", ur: "یمن کی طرف علی ابن ابی طالب کی ساریہ", tr: "Ali ibn Abi Talib'in Yemen seferi", id: "Ekspedisi Ali bin Abi Talib ke Yaman" }
text: "فعقد له رسول الله يومئذ لواء، أخذ عمامة فلفها مثنية مربعة فجعلها في رأس الرمح، ثم دفعها إليه، وقال: هكذا اللواء!"
summary:
  ar: "في رمضان سنة عشر بعث النبي علي بن أبي طالب إلى اليمن رسولاً قاضياً، فعقد له لواءً وأخذ عمامة فلفها مثنية مربعة فجعلها في رأس الرمح ثم دفعها إليه وقال: هكذا اللواء! وقال له: امض ولا تلتفت! فأقبل علي حتى نزل على سبأ وهم يعبدون الصليب، فدعاهم إلى الله وأسلموا. ويذكر الواقدي أن عروة بن محمد الزبيري حدثه أن عليا قال: بعثني رسول الله إلى اليمن..."
  en: "In Ramadan of year ten the Prophet sent Ali ibn Abi Talib to Yemen as judge and envoy; he bound a banner for him, wrapped a turban double into a square and fixed it on the spear-shaft, saying 'thus the banner!' and 'go and do not look back.' Ali reached Saba whose people worshipped the cross, called them to God and they submitted; al-Awra' ibn Muhammad al-Zubayri reports Ali's own account of the mission."
  es: "En Ramadán del año diez, el Profeta envió a Ali ibn Abi Talib a Yemen como juez y enviado; le preparó un estandarte, dobló un turbante formando un cuadrado y lo fijó al asta de la lanza, diciendo: «¡Así queda el estandarte!» y «¡Ve y no mires atrás!». Ali llegó a Saba, cuyo pueblo veneraba la cruz, los llamó a Dios y se sometieron; al-Awra' ibn Muhammad al-Zubayri relata la propia versión de Ali sobre la misión."
  fr: "Durant le Ramadan de l'an dix, le Prophète envoya Ali ibn Abi Talib au Yémen comme juge et envoyé. Il lui confectionna une bannière, enroula un turban en deux pour en faire un carré et le fixa au manche de la lance, en disant: « Voici la bannière ! » et « Va et ne te retourne pas. » Ali atteignit Saba, dont les habitants adoraient la croix. Il les appela à Dieu et ils se soumirent. Al-Awra' ibn Muhammad al-Zubayri rapporte le récit d'Ali lui-même concernant cette mission."
  ur: "دس سال کے رمضان میں نبی نے علی ابن ابی طالب کو قاضی اور ایلچی بنا کر یمن بھیجا۔ اس نے اس کے لیے ایک جھنڈا باندھا، ایک پگڑی کو ایک چوکور میں لپیٹ کر نیزے کے شافٹ پر لگا دیا اور کہا کہ 'اس طرح بینر!' اور 'جاؤ اور پیچھے مڑ کر مت دیکھو'۔ علی صبا پہنچے جن کے لوگ صلیب کی پرستش کرتے تھے، انہیں خدا کے پاس بلایا اور انہوں نے عرض کیا۔ الاورا ابن محمد الزبیری نے علی کے اپنے مشن کے بارے میں بیان کیا ہے۔"
  tr: "Onuncu yılın Ramazan ayında, Peygamberimiz Ali ibn Abi Talib'i Yemen'e elçi ve kadı olarak gönderdi. Ona bir sancak verdi, bir sarık aldı, kare şeklinde katladı, bir mızrağın ucuna koydu ve ona vererek, \"İşte sancak budur!\" dedi. Sonra ona, \"Git ve geriye bakma!\" dedi. Ali, haça tapan Saba halkına ulaşana kadar ilerledi. Onları Allah'a çağırdı ve onlar İslam'ı kabul ettiler. El-Vakidi, Urve ibn Muhammed el-Zubeyri'nin rivayetine göre Ali'nin, \"Allah'ın Resulü beni Yemen'e gönderdi...\" dediğini aktarır."
  id: "Pada bulan Ramadan tahun kesepuluh, Nabi mengutus Ali bin Abi Talib sebagai utusan dan hakim ke Yaman. Beliau memberinya sebuah panji, mengambil sebuah sorban, melipatnya menjadi persegi, meletakkannya di ujung tombak, dan memberikannya kepadanya sambil berkata, \"Inilah panjinya!\" Kemudian beliau berkata kepadanya, \"Pergilah dan jangan menoleh ke belakang!\" Ali melanjutkan perjalanan hingga sampai ke kaum Saba, yang menyembah salib. Dia menyeru mereka kepada Allah, dan mereka memeluk Islam. Al-Waqidi menyebutkan bahwa Urwah bin Muhammad al-Zubayri meriwayatkan bahwa Ali berkata, \"Rasulullah mengutusku ke Yaman...\""
