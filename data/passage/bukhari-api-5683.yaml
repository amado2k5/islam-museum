label: { ar: "صحيح البخاري 5683 — الحجامة، الكي", en: "Sahih al-Bukhari 5683 — cupping; cautery", ur: "صحیح بخاری 5683 — حجامہ، داغنا" }
text: "… نُعَيْمٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ الْغَسِيلِ، عَنْ عَاصِمِ بْنِ عُمَرَ بْنِ قَتَادَةَ، قَالَ سَمِعْتُ جَابِرَ بْنَ عَبْدِ اللَّهِما ـ قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ \" إِنْ كَانَ فِي شَىْءٍ مِنْ أَدْوِيَتِكُمْ ـ أَوْ يَكُونُ فِي شَىْءٍ مِنْ أَدْوِيَتِكُمْ ـ خَيْرٌ فَفِي شَرْطَةِ مِحْجَمٍ، أَوْ شَرْبَةِ عَسَلٍ، أَوْ لَذْعَةٍ بِنَارٍ تُوَافِقُ الدَّاءَ، وَمَا أُحِبُّ أَنْ أَكْتَوِيَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5683، يذكر الحجامة، والكي، والتداوي بالعسل، والداء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5683 (Medicine), that mentions cupping, cautery, honey as a remedy, the disease and its remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5683، جس میں حجامہ، داغنا، شہد سے علاج، بیماری کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
