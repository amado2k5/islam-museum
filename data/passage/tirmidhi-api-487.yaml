text: "… الْعَنْبَرِيُّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، عَنْ مَالِكِ بْنِ أَنَسٍ، عَنِ الْعَلاَءِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ يَعْقُوبَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ عُمَرُ بْنُ الْخَطَّابِ لاَ يَبِعْ فِي سُوقِنَا إِلاَّ مَنْ قَدْ تَفَقَّهَ فِي الدِّينِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. عَبَّاسٌ هُوَ ابْنُ عَبْدِ الْعَظِيمِ. قَالَ أَبُو عِيسَى وَالْعَلاَءُ بْنُ عَبْدِ الرَّحْمَنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 487، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 487 (The Book on Al-Witr), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 487، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
