text: "… شيء صحيح، والذّنانَة-بالنون- لا تكون إلاَّ بقية شيء ذنن - عبدٌ أو أَمَةٌ، يعني بمَذَمَّة الرضاعِ: ذِمام المُرْضِعَةِ، وكان النخَعيُّ يقول في تفسيره: كانوا يَسْتَحِبُّونَ عند فِصال الصبيّ أن يأمروا للظئر بشيءٍ سوى الأجر، فكأنَّه سأله : أي : شيء …"
