text: "… مَا أُذِنَ لَهُ فِيهِ وَتَيَسَّرَ \". فَذَكَرَ نَحْوَ حَدِيثِ حَمَّادٍ قَالَ \" ثُمَّ يُكَبِّرُ فَيَسْجُدُ فَيُمَكِّنُ وَجْهَهُ \". قَالَ هَمَّامٌ وَرُبَّمَا قَالَ \" جَبْهَتَهُ مِنَ الأَرْضِ حَتَّى تَطْمَئِنَّ مَفَاصِلُهُ وَتَسْتَرْخِيَ ثُمَّ يُكَبِّرُ فَيَسْتَوِي قَاعِدًا عَلَى مَقْعَدِهِ وَيُقِيمُ صُلْبَهُ \". فَوَصَفَ الصَّلاَةَ هَكَذَا أَرْبَعَ رَكَعَاتٍ حَتَّى فَرَغَ \" لاَ تَتِمُّ صَلاَةُ أَحَدِكُمْ حَتَّى يَفْعَلَ ذَلِكَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 858، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 858 (Prayer (Kitab Al-Salat)), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 858، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
