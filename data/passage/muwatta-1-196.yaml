label: { ar: "الموطأ 196 — رفع اليدين حذو المنكبين عند الافتتاح والرفع من الركوع", en: "Muwatta 196", es: "Muwatta 196", fr: "Muwatta 196", ur: "موطا 196", tr: "Al-Muwatta 196 — Secde başlarken ve rükûdan kalkarken elleri omuz hizasına kaldırmak", id: "Al-Muwatta 196 — Mengangkat tangan setinggi bahu saat memulai dan mengakhiri rukuk" }
text: "كان إذا افتتح الصلاة رفع يديه حذو منكبيه، وإذا رفع رأسه من الركوع رفعهما كذلك أيضاً، وقال: سمع الله لمن حمده ربنا ولك الحمد، وكان لا يفعل ذلك في السجود"
summary:
  ar: "أول حديث في باب افتتاح الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر: كان النبي إذا افتتح الصلاة رفع يديه حذو منكبيه، وإذا رفع رأسه من الركوع رفعهما كذلك وقال: سمع الله لمن حمده، ربنا ولك الحمد، ولم يكن يفعل ذلك في السجود. ويخرّجه المحقق عند البخاري (735) ومسلم (2/18) والنسائي (2/122) وابن حبان والدارمي والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن يحيى وجماعة من رواة الموطأ لم يذكروا فيه الرفع عند الانحطاط إلى الركوع، وأن ابن وهب وابن القاسم والقطان وابن مهدي وابن المبارك وجماعة رووه عن مالك بذكر الرفع عند الركوع أيضاً، وأن ذلك هو الصواب وهكذا رواه سائر أصحاب ابن شهاب، وأن جماعة من أهل العلم رأوا أن إسقاط الرفع عند الركوع وهم من مالك ربما وهم فيه لأن حفاظاً رووا عنه الوجهين ⁦(التمهيد 9/210–212)⁩. {cite:muwatta-maruf-1997 p.123} {cite:muwatta-maruf-1997 p.124} {cite:muwatta-maruf-1997 p.125}"
  tr: "Namazın açılışı bölümündeki ilk hadis. Yahya'nın, Malik'ten, o da İbn Şihab'tan, o da Salim bin Abdullah'tan, o da Abdullah bin Ömer'den rivayet ettiği hadis şöyledir: Peygamberimiz namaza başlarken ellerini omuz hizasına kadar kaldırır, rükûdan başını kaldırdığında da aynı şekilde kaldırır ve şöyle derdi: \"Allah, kendisine hamd edenleri işitir, Rabbimiz! Hamdın tamamı Sana aittir.\" Secdede bunu yapmazdı. Araştırmacı, bu hadisi Buhari (735), Müslim (2/18), Nesai (2/122), İbn Hibban, Darimi ve Şafiî'de Malik'in sahabelerinin rivayet zincirleriyle nakletmiştir. İbn Abdülberr'in, Yahya ve Muvatta'nın bazı rivayetçilerinin rükûda elleri kaldırmaktan bahsetmediklerini, İbn Vahb, İbn el-Kâsim, el-Kattan, İbn Mehdi, İbn el-Mübarek ve bir grup rivayetçinin ise Malik'ten rükûda elleri kaldırmaktan da bahsederek rivayet ettiklerini ve bunun doğru rivayet olduğunu söylediğini aktarır. İbn Şihab'ın tüm sahabeleri de böyle rivayet etmiş ve bazı âlimler, rükûda elleri kaldırmanın ihmal edilmesini Malik'in hatası olarak değerlendirmişlerdir; belki de bazı ezbercilerin her iki rivayeti de ondan aktarmış olmaları nedeniyle (el-Tamhid 9/210–212). {cite:muwatta-maruf-1997 s.123} {cite:muwatta-maruf-1997 s.124} {cite:muwatta-maruf-1997 s.125}"
  id: "Hadits pertama dalam surah tentang pembukaan salat. Diriwayatkan oleh Yahya dari Malik dari Ibnu Shihab dari Salim bin Abdullah dari Abdullah bin Omar: Ketika Nabi memulai salat, beliau mengangkat kedua tangannya setinggi bahu, dan ketika beliau mengangkat kepala dari rukuk, beliau juga mengangkat kedua tangannya dan berkata: Allah Maha Mendengar orang-orang yang memuji-Nya, Tuhan kami, dan kepada-Mu segala puji. Beliau tidak melakukan itu saat sujud. Peneliti menyertakannya dalam al-Bukhari (735), Muslim (2/18), al-Nasa'i (2/122), Ibnu Hibban, al-Darimi, dan al-Shafi'i melalui sanad para sahabat Malik. Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa Yahya dan sekelompok perawi al-Muwatta' tidak menyebutkan mengangkat tangan saat rukuk, dan bahwa Ibn Wahb, Ibn al-Qasim, al-Qattan, Ibn Mahdi, Ibn al-Mubarak, dan sekelompok lainnya meriwayatkannya dari Malik dengan menyebutkan mengangkat tangan saat rukuk juga, dan bahwa ini adalah versi yang benar. Demikianlah semua sahabat Ibn Shihab meriwayatkannya, dan bahwa sekelompok ulama menganggap penghilangan mengangkat tangan saat rukuk sebagai kesalahan dari pihak Malik, mungkin karena beberapa penghafal meriwayatkan kedua versi tersebut darinya (al-Tamhid 9/210–212). {cite:muwatta-maruf-1997 p.123} {cite:muwatta-maruf-1997 p.124} {cite:muwatta-maruf-1997 p.125}"
