label: { ar: "الموطأ 196 — رفع اليدين حذو المنكبين عند الافتتاح والرفع من الركوع", en: "Muwatta 196" }
text: "كان إذا افتتح الصلاة رفع يديه حذو منكبيه، وإذا رفع رأسه من الركوع رفعهما كذلك أيضاً، وقال: سمع الله لمن حمده ربنا ولك الحمد، وكان لا يفعل ذلك في السجود"
summary:
  ar: "أول حديث في باب افتتاح الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر: كان النبي إذا افتتح الصلاة رفع يديه حذو منكبيه، وإذا رفع رأسه من الركوع رفعهما كذلك وقال: سمع الله لمن حمده، ربنا ولك الحمد، ولم يكن يفعل ذلك في السجود. ويخرّجه المحقق عند البخاري (735) ومسلم (2/18) والنسائي (2/122) وابن حبان والدارمي والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن يحيى وجماعة من رواة الموطأ لم يذكروا فيه الرفع عند الانحطاط إلى الركوع، وأن ابن وهب وابن القاسم والقطان وابن مهدي وابن المبارك وجماعة رووه عن مالك بذكر الرفع عند الركوع أيضاً، وأن ذلك هو الصواب وهكذا رواه سائر أصحاب ابن شهاب، وأن جماعة من أهل العلم رأوا أن إسقاط الرفع عند الركوع وهم من مالك ربما وهم فيه لأن حفاظاً رووا عنه الوجهين (التمهيد 9/210–212). {cite:muwatta-maruf-1997 p.123} {cite:muwatta-maruf-1997 p.124} {cite:muwatta-maruf-1997 p.125}"
