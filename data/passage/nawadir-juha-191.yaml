label: { ar: "نوادر جحا الكبرى، ص 86 — «أحب من معها عقد الودع الأزرق»", en: "Nawadir Juha al-Kubra, p. 86 — 'I Love the One Who Has the Blue Bead Necklace'", ur: "نوادر جحا الکبریٰ، ص 86 — «مجھے وہ پسند ہے جس کے پاس نیلے منکوں کا ہار ہے»", fr: "Nawadir Juha al-Kubra, p. 86 — « J'aime celle qui porte le collier de perles bleues »", es: "Nawadir Juha al-Kubra, p. 86 — «Amo a la que lleva el collar de cuentas azules»" }
text: "… أحبٌّ من معها عقد الودع الأزرق كان للشيخ زوجان وقد أهدى كُلا منهما عقد ودعِ أزرق ونبّه على كلُّ منهما قائلاً : إيَّاكِ أن تُريه إلى ضِرّتك، لأنَّه علامة حبِّي لك. ففي ذات يوم هجمتا عليه، وقالتا له: مَن تُحِبُّ …"
summary:
  ar: "أعطى جحا كل زوجة عقد ودع أزرق وقال لكل منهما أن تكتم الأمر؛ فلما سألتاه من يحب أكثر، قال إنه يحب من تلبس العقد الأزرق، فظنت كل واحدة أنه يحبها أكثر. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  en: "Juha gives each wife a blue bead necklace and says each should keep it secret; when they ask whom he loves, he says whoever wears the blue necklace; each thinks he loves her most. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  ur: "جحا نے ہر بیوی کو نیلے منکوں کا ایک ہار دیا اور ہر ایک سے کہا کہ اسے راز رکھو؛ جب انہوں نے پوچھا کہ کس سے محبت ہے تو اس نے کہا کہ جو نیلا ہار پہنے؛ ہر ایک نے سمجھا کہ وہ اسی سے زیادہ محبت کرتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  fr: "Juha donne à chaque épouse un collier de perles bleues et dit à chacune de le garder secret; quand elles demandent qui il aime, il dit celle qui porte le collier bleu; chacune pense qu'il l'aime le plus. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  es: "Juha le da a cada esposa un collar de cuentas azules y le dice a cada una que lo guarde en secreto; cuando le preguntan a quién ama, dice que a la que lleve el collar azul; cada una piensa que la ama más a ella. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
