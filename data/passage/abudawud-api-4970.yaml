label: { ar: "سنن أبي داود 4970 — الأب والأبوة", en: "Sunan Abi Dawud 4970 — the father and fatherhood", ur: "سنن ابی داؤد 4970 — باپ اور والدیت", es: "Sunan Abi Dawud 4970 — El padre y la paternidad", fr: "Sunan Abi Dawud 4970 — le père et la paternité" }
text: "حَدَّثَنَا مُسَدَّدٌ، وَسُلَيْمَانُ بْنُ حَرْبٍ، - الْمَعْنَى - قَالاَ حَدَّثَنَا حَمَّادٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ،ا أَنَّهَا قَالَتْ يَا رَسُولَ اللَّهِ كُلُّ صَوَاحِبِي لَهُنَّ كُنًى. قَالَ \" فَاكْتَنِي بِابْنِكِ عَبْدِ اللَّهِ \". يَعْنِي ابْنَ أُخْتِهَا قَالَ مُسَدَّدٌ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ قَالَ فَكَانَتْ تُكَنَّى بِأُمِّ عَبْدِ اللَّهِ. قَالَ أَبُو دَاوُدَ وَهَكَذَا قَالَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4970، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4970 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4970، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4970 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4970 (Guide pratique), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
