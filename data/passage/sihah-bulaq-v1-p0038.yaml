  المقدارية سال أقام فلان شهرا أوشيعه وقواهم آتيك غدا أوشيعه أى بعده وينشد
  قال الخلبط غد اتصدّعنا • أوشبعه فلا نودعنا
  والشبع أيضاولد الاسد وشيعته عندرحيله والمشبع الشجاع وشيعة الرجل أنباءه
  وأنداره يقمال شايعه كما يقال والاء من الولى والمشابع أيضا اللا-ق وشيعته بالنارأى
  أرقته قال ابن السكيت شيعت الناراذا ألقيت علميها -طباتذ كيهابه وتشبع الرجل أى
  ادعى دعوى الشيعة وتشابع القوم من الشيعة وكل قوم أمرهم واحد يتبع بعضهم رأى
  بعض فهم شيع وقوله تعالى كمافعل بأشياءه-م من قبل اى بأمثالهسم من الشيع الماضية
  قال ذوالرمة أستهدث الركب عن أشياءهم خبرا • أم راجع القلب من اطرابه طرب
  يعنى ءن أعهابهسم وشاعه شباعا أى تبعه وشايع الراعى بايلدِمَسابعة وشياعا أى صاح بها
  ودعاها اذا استأخريعضها قال لبيد
  فيضون ارسالا ونخلف بعدهم • كماضمّ أخرى التاليات المشايع
  والشياع دق الحطب تشيع به النار كما بقال شباب للنسار وجلاء للعين والشياع صوت مزمار
  الراعى ومنه قول الشاءر
  حنين النيب تطرب للشياع
  صل الصاد ) ⁦( بع)⁩ الاصبح يذكرويونث وفيه لغات اصبغ واصبع بكسر الهمزة
  وضمها والباء مفتوحة فيهما وذلك ان تتبع الفعة الضمة فتقول أصبع وللثان تتبع
  الكسرة الكسرة فتول إصبع ولك أن تتبع الذحة الضمة فتقول أصبع وفيه لغة خامسة
  إصبع مثال إضرب قال أبوزيد صبعت بفلان وعلى فلان أصبع صبعا اذا اشرت نحوه
  بأصبعك مغتاباوصبعت فلانا على فسلان دللته عليه بالاشارة وقال أبو عبيد فى المصنف
  صبعت الانا اذا كان فيه شراب فوضعت علي إصبعك -تى سال عليه مافيه فى انا آخر
  ويقال للراعى على ماشيته إصبع أى أترحسن وأنتد الادءى للراعى
  ضعيف العصابادى العروق ترى له • عليها اذا ما أجدب الناس إصبعا
  (صنع الصنح التواء فىء: ق الفاليم وصلاية قال
  عارى الظنابيب منحص قوادمه برمدحتى تزى فى رأسه منعا
  والصنع من الطغام الصلب الراس قال الفارقاح بن حكيم
  صنع الحاجبين خرّطه البقل بديا قبل استكال الرياض
  ⁦( صدع)⁩ الصدع الشق يقال صدعته فانصدع هوأى انشق والصديع الصبح والصديع
  الصرمسة من الابل والفرقة من الغسم وصدعت الفلاة قطعيتا وصدءت الشي أظهرته
  وبينته ومنه قول أب ذؤيب
  يسريفيض على القداح ويصدع يقال صدعت بالحق اذا تكاءت به جهاراوة وله تعالى
  فاصدع بما تؤمر قال الفراء أراد فاصدع بالامر أى أظهردينك أبو زيد صدعت الى الشئ
  أصدع صدوعاملت اليه وماصدعلك عن هذا الامر أى ماضرفك والتصديع التفريق
  وتصدّع القوم تفرّقوا والصداع وجع الرأس وصدع الرجل تصديعا والصدعة بالكسر
