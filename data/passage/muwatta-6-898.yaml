label: { ar: "الموطأ 898 — أسماء بنت عميس ولدت محمد بن أبي بكر بالبيداء، فأمرها أبو بكر أن تغتسل ثم تهل", en: "Muwatta 898" }
text: "مرها فلتغتسل، ثم لتهل"
summary:
  ar: "أول حديث في كتاب الحج وفي باب الغسل للإهلال. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن أسماء بنت عميس، أنها ولدت محمد بن أبي بكر بالبيداء، فذكر أبو بكر ذلك للنبي، فقال: مرها فلتغتسل، ثم لتهل. ويذكر المحقق أن الحديث مرسل عند جماعة رواة الموطأ، وأن بعضهم قال «عن أسماء أنها ولدت»، وأن مسلماً أخرجه من طريق عائشة بذكر النفاس. {cite:muwatta-maruf-1997 p.433}"
