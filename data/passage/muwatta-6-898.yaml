label: { ar: "الموطأ 898 — أسماء بنت عميس ولدت محمد بن أبي بكر بالبيداء، فأمرها أبو بكر أن تغتسل ثم تهل", en: "Muwatta 898", es: "Muwatta 898", fr: "Muwatta 898", ur: "موطا 898", tr: "Al-Muwatta 898 — Asma bint Umays, Al-Bayda’da Muhammed ibn Abi Bakr’ı dünyaya getirdi. Bunun üzerine Ebu Bekir, ona gusül abdesti almasını ve ardından ihrama girmesini emretti.", id: "Al-Muwatta 898 — Asma binti Umays melahirkan Muhammad binti Abi Bakr di Al-Bayda’, lalu Abu Bakr memerintahkannya untuk melakukan ghusl (mandi ritual) dan kemudian memasuki ihram (keadaan penyucian ritual)." }
text: "مرها فلتغتسل، ثم لتهل"
summary:
  ar: "أول حديث في كتاب الحج وفي باب الغسل للإهلال. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن أسماء بنت عميس، أنها ولدت محمد بن أبي بكر بالبيداء، فذكر أبو بكر ذلك للنبي، فقال: مرها فلتغتسل، ثم لتهل. ويذكر المحقق أن الحديث مرسل عند جماعة رواة الموطأ، وأن بعضهم قال «عن أسماء أنها ولدت»، وأن مسلماً أخرجه من طريق عائشة بذكر النفاس. {cite:muwatta-maruf-1997 p.433}"
  tr: "Hac Kitabı'ndaki ilk hadis, ihrama girmeden önce yapılan rızık banyosu bölümünde, Malik'in Abdülrahman ibn el-Kâsım'dan, onun babasından, onun da Asma bint Umays'tan rivayet ettiğine göre, Asma bint Umays, el-Bayda'da Muhammed ibn Ebu Bekir'i doğurmuştur. Ebu Bekir bunu Peygamberimize bildirmiş, Peygamberimiz de: \"Ona rızık banyosunu yapmasını, sonra ihrama girmesini söyle\" demiştir. Editör, hadisin Muvatta'nın bazı ravîlerine göre mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve bazılarının \"Asma'dan rivayet edildiğine göre, doğum yaptı\" dediğini, Müslim'in ise doğum sonrası kanamayı da zikrederek Aişe'den rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.433}"
  id: "Hadits pertama dalam Kitab Haji, dalam bab tentang mandi ritual untuk memasuki ihram, diriwayatkan oleh Malik dari Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Asma binti Umays, bahwa ia melahirkan Muhammad ibn Abi Bakr di al-Bayda. Abu Bakr menceritakan hal ini kepada Nabi, yang kemudian berkata: \"Katakan padanya untuk bermandi ritual, lalu masuk ihram.\" Editor mencatat bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) menurut sekelompok perawi al-Muwatta, dan bahwa sebagian dari mereka mengatakan, \"Dari Asma, bahwa ia melahirkan,\" dan bahwa Muslim memasukkannya dari Aisyah, yang menyebutkan pendarahan pasca persalinan. {cite:muwatta-maruf-1997 p.433}"
