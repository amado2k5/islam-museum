label: { ar: "الموطأ 2238 — مالك عن ابن شهاب عن سعيد بن المسيب: قال عثمان بن عفان: من نحل ولدا له صغيرا لم يبلغ أن يحوز نحله، فأعلن ذلك له، وأشهد عليها، فهي جائزة، وإن ولاها أبوه", en: "Muwatta 2238", es: "Muwatta 2238", fr: "Muwatta 2238", ur: "موطا 2238", tr: "El-Muvatta 2238 — Malik, İbn Şihab'dan, o da Said bin el-Musayyab'dan rivayetle, Osman bin Affan şöyle demiştir: Bir kimse henüz reşit olmayan çocuğuna bir hediye verirse ve bunu ona bildirirse ve şahitleri varsa, babası onu vasisi olarak tayin etse bile bu caizdir.", id: "Al-Muwatta 2238 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab: Uthman bin Affan berkata: Jika seseorang memberikan hadiah kepada anaknya yang masih kecil dan belum mencapai usia dewasa, dan ia memberitahukannya kepada anaknya serta mempunyai saksi, maka hal itu diperbolehkan, meskipun ayahnya menunjuknya sebagai wali." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أن عثمان بن عفان قال: من نحل ولدا له صغيرا، لم يبلغ أن يحوز نحله، فأعلن ذلك له، وأشهد عليها، فهي جائزة، وإن وليها أبوه. {cite:muwatta-maruf-1997 p.321}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayetle Osman ibn Affan'ın şöyle dediğini nakleder: \"Kim henüz reşit olmayan çocuğuna bir hediye verir ve bunu ona bildirir ve şahitleri olursa, babası velisi olsa bile, bu hediye geçerlidir.\" {cite:muwatta-maruf-1997 s.321}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, bahwa Utsman ibn Affan berkata: \"Barang siapa memberi hadiah kepada anaknya yang masih kecil dan belum mencapai usia dewasa, dan memberitahukannya kepada anaknya serta memiliki saksi, maka hadiah itu sah, meskipun ayahnya adalah walinya.\" {cite:muwatta-maruf-1997 p.321}"
