text: "… والتطيب لقراءة القران نصل في الجهر بقراءة القرآن في صلاة الليل فصل في كراهية قطع القرآن لمكالمة الناس........ فصل في تحسين الصوت بالقراءة والقرآن......... فصل في ترتيل القراءة فصل في مقدار ما يستحب فيه القراءة فصل في تعليم القرآن...... فصل …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 562، يرد فيه ذكر المستحب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 562, whose wording mentions the recommended (mustahabb), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 562 کا اقتباس جس میں مستحب، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 562, dont le texte mentionne le recommandé (mustahabb), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 562, cuyo texto menciona lo recomendado (mustahabb), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 2. cildinin 562. sayfasından, müstehaplı ve mekruhlu amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz ameller, itaat amelleri, müstehaplı ameller, mekruhlu amelleri, haram amelleri ve küçük günahları bir tarayıcı aracılığıyla derlemiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 562, yang menyebutkan amalan yang dianjurkan dan yang tidak disukai; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
