text: |-
  ٥٧٩
  الزائدة والثالث الفرق بينسه وبين غيره مثل الفعل الماضى بنى عسلى الفتح لانه ضارع
  بعض المضارعة فه رق بالحركة بينه وبين مالم يضارع وهو فعل الامر المواجه به
  نحوافعل وأماقول الشاعر • ماهى الاشربة بالجوأب
  وقول بذت الحمارس * هل هى الاحظة أو تطليق * فان أحل الكوفة فالواهى
  كاية عن شى مجهول وأهل البصرة يتأوّلونها القصة وربعاحذفت من هو الوادف ضرورة
  الشعر كماقال
  فييناه يشرى رحله قال قائل * لمن يجل رخوالملاط غجيب
  وقال آخر
  انه لا يبرئ داء الهدبد • مثل القلايا من سنام وكبد
  وكذلك الياحمن هى وقال دار لسعدى اذه من هوا كا* وربماحذفوا الوا ومع الحركة
  وقال
  قطلت لدى البيت العنيق أخيله • ومطواى مشتاقان له أرقان
  قال الاخفس وهذا فى لغة أزد السراة كثير قال الفراء والعرب تقف على كل هاءمؤنث
  بالهاء الاطيئا فائم-م يقفون عليها بالتساءفية ولون هذه أمت وجاريت وطلان واذا أدخلت
  الهاء فى الندية أثبتهافى الوقف وحذفتها فى الوصل ورعاثبتت فى ضرورة الشعرفيضم كالحرف
  الاصلىّ ويجوذ كسره لالتقاءالساكنين هذا على قول أهل ال-كوفة وأنشدالفراء
  يا دب يارباه اياك أسل • عفراء يارباه من قبل الاجل
  وقال قيس فقلت أيارباه أول سالق • انفسى لي-لى ثم أنت حسيبها
  وهو كثير فى الشعروليس شئ منه بحبة عند أهل البصرة وهوخارج عن الاصل ودتزاد الهاء
  فى الوقف لييان الحركة نحولمه وسلطانيه وماليه وثم مه يعق ثم ماذا وقد أنت هذه
  الهاء فى ضرورة الشعر كاقال
  هم القائلون انخير والا مرونه • اذا ما خشوا من معظم الامر مقظعا
  فأجراها مجرى هاء الاضمار وقد تكون الهاءبدلا من الهمزة مثل هراق وأراق قال الشاهر
  وأتى صواحبها ن قان هذا الذى • منخ المودّغيرنا وجفانا
  يعن أذا الذى وهاء زجر للابل وهو مبنى على الكسراذا مددت وقديقصر تقول هاهيت
  بالابل اذا دعوتها كاقلناه فى حاحيت وهامقصور للتة ريب اذا قيل لك أين أنت فتقول ها أنا
  ذا و المرأة تقوله أماذه وان قيل لكّ أين فلان قات اذا كان قريساها هوذا وان كأن بعيدا
  قلت هاهوذاك وللمرأة اذا كانت قريبة ها هى ذه وان كانت بعيدة ها هى تلك والهاءتزاد
  فى كلام العرب على سبعة أضرب أحدها للفرق بين الفاعل والفاعلة مثل ضارب وضارية
  وكريم وكريمة والثانى للفرق بين المذكر والمؤنت فى الجنس نحوامرئ وامرأة والثالث للفرق
  بين الواحدوالجمع نحو بقرة وبقرورة وتمر والرابع لتانيت اللقظة وان لم تكن تحتها حقيقة
  تانيث نحوقرية وغرفة وانلخامس للمبالغة مثل علامة ونسابة وهذامدح وهلباجة وفقاقة
  وهذا ذم وما كان منه مدحايدهبون بتأنيئه الى تأفيت الغاية والنهاية والداهية وما كان ذمّا
  يذهبون به الى تأنيث الهيمة ومنه ما يستوى فيه المذكروالمؤنت نحورجل ملولة وامر أة ملولة
  والسادس ما كان واحدامن حفس يقع على الذكر والانى نحوبطة وحية والسابع تدخل
