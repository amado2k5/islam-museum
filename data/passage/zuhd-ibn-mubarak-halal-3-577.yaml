text: "… والأرض، وإنه ليزِلُّ عن لسانه أشد مما يزلُّ عن قدميه. وبهذا الإسناد عن النبى قال : كفى بالمرء إلما أن عطية عن أبى سعيد الخدرى وحسنه الألبانى فى غاية المرام فى تخريج أحاديث الحلال والحرام رقم. إسناده ضعيف وورد معناه …"
