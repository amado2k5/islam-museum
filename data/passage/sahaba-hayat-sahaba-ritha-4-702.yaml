text: "… بن عمرو بن نفيلما عند عبد اللّٰه بن ابى بكر الصديقما و كان يحبها حبا شديدا فجعل لها حديقة على ان لا تزوج بعده فرمى بسهم يوم الطائف فانتقض بعد وفاة رسول اللّٰه بأربعين ليلة فمات فرثته عاتكة فقالت : …"
summary:
  ar: "مقطع من حياة الصحابية، المجلد المصوَّر 4، ص 702، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Hayat al-Sahaba, scan volume 4, p. 702, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "حیات الصحابہ، اسکین جلد 4، ص 702 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hayat al-Sahaba, volume numérisé 4, p. 702, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Hayat al-Sahaba, volumen escaneado 4, p. 702, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Ölen kişi için yazılmış ağıt ve övgüleri içeren, resimli 4. cilt, 702. sayfadaki kadın arkadaşın biyografisinden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari biografi pendamping wanita, volume bergambar 4, halaman 702, berisi elegi dan pujian untuk almarhum; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
