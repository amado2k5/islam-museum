label: { ar: "موطأ مالك 1328 — الحرام، المكروه", en: "Muwatta Malik 1328 — the unlawful; the disliked", ur: "موطأ مالک 1328 — حرام، مکروہ", es: "Muwatta Malik 1328 — el ilícito; el detestado", fr: "Muwatta Malik 1328 — l'illicite; le détesté", tr: "Muwatta Malik 1328 — Yasak Olan, Sevilmeyen", id: "Muwatta Malik 1328 — Yang Terlarang, Yang Tidak Disukai" }
text: "… لَيْسَ مَعَهُ غَيْرُهُ لَمْ يَأْخُذْهُ بِعُشْرِ الثَّمَنِ الَّذِي أَخَذَهُ بِهِ لأَنْ يُجَوِّزَ لَهُ الْبَيْعَ فَذَلِكَ الذَّرِيعَةُ إِلَى إِحْلاَلِ الْحَرَامِ وَالأَمْرُ الْمَنْهِيُّ عَنْهُ. قَالَ مَالِكٌ فِي الرَّجُلِ يُرَاطِلُ الرَّجُلَ وَيُعْطِيهِ الذَّهَبَ الْعُتُقَ الْجِيَادَ وَيَجْعَلُ مَعَهَا تِبْرًا ذَهَبًا غَيْرَ جَيِّدَةٍ وَيَأْخُذُ مِنْ صَاحِبِهِ ذَهَبًا كُوفِيَّةً مُقَطَّعَةً وَتِلْكَ الْكُوفِيَّةُ مَكْرُوهَةٌ عِنْدَ النَّاسِ فَيَتَبَايَعَانِ ذَلِكَ مِثْلاً بِمِثْلٍ إِنَّ ذَلِكَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1328، يذكر الحرام، والمكروه. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1328 (Business Transactions), that mentions the unlawful, the disliked. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1328، جس میں حرام، مکروہ کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1328 (Transacciones comerciales), menciona lo ilícito y lo reprobable. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Muwatta Malik, n° 1328 (Transactions commerciales), mentionne ce qui est illicite et déconseillé. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Malik'in Muwatta'sında yer alan 1328 numaralı hadis, haram ve mekruh olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözleriyle birlikte Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1328, menyebutkan apa yang diharamkan dan apa yang tidak disukai. Hadits ini dikumpulkan oleh Halal and Haram Browser, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka, mengenai apa yang diperbolehkan dan apa yang diharamkan."
