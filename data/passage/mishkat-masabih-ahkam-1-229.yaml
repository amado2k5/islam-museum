text: "… قال: قال رسول اللّٰه جل: خَصلتان لا تجتمعان في منافق: حُسنُ سمت،.. طلبُ العلم فريضةٌ: المراد من العلم: ما لا مندوحة للعبد من تعلّمه، كمعرفة الصانع وتوحيده، ونبوة رسوله، وكيفية الصلاة، فإن تعلمه فرض عين، وعلى هذا كلام الشارحين. قيل: …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 229، يرد فيه ذكر الفريضة والفرائض، والفرض، وفرض العين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 229, whose wording mentions the obligation (farida), the obligatory (fard), the individual obligation (fard 'ayn); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 229 کا اقتباس جس میں فریضہ اور فرائض، فرض، فرضِ عین کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 1, p. 229, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligation individuelle (fard 'ayn) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Mishkat al-Masabih, volumen digitalizado 1, p. 229, cuyo texto menciona la obligación (farida), lo obligatorio (fard), la obligación individual (fard 'ayn); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 229'dan bir alıntı; farz fiiller, bireysel yükümlülükler ve \"farz\" (zorunlu görev) teriminden bahsediyor. Bu alıntı, makine tarafından okunabilir, taranmış bir versiyondan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, hlm. 229, yang menyebutkan amalan wajib, kewajiban individu, dan istilah \"fard\" (kewajiban wajib). Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
