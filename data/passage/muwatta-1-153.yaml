label: { ar: "الموطأ 153 — بلاغ عن عائشة: الحامل ترى الدم تدع الصلاة", en: "Muwatta 153", es: "Muwatta 153", fr: "Muwatta 153", ur: "موطا 153", tr: "El-Muvatta 153 — Aişe'den rivayet edildiğine göre: Kan gören hamile bir kadın namaz kılmayı bırakmalıdır.", id: "Al-Muwatta 153 — Diriwayatkan dari Aisyah: Wanita hamil yang melihat darah hendaknya berhenti shalat." }
summary:
  ar: "أول أثر في باب جامع الحيضة، وهو بلاغ: يروي يحيى عن مالك أنه بلغه أن عائشة قالت في المرأة الحامل ترى الدم إنها تدع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق والدارقطني رويا من طريق عطاء عن عائشة قولاً مخالفاً: الحامل لا تحيض، تغتسل وتصلي؛ فالمنقول عنها مختلف فيه. {cite:muwatta-maruf-1997 p.105}"
  tr: "Adet görme konusundaki bölümdeki ilk rivayet şöyledir: Yahya, Malik'ten rivayet ettiğine göre, Ayşe'nin, kanama gören hamile bir kadın için namazdan kaçınması gerektiğini söylediğini işitmiştir. Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini, Abdül-Razzak ve el-Daraqutni'nin ise Ata aracılığıyla Ayşe'den farklı bir ifadeyi naklettiğini belirtmektedir: Hamile bir kadın adet görmüyorsa, gusül abdesti almalı ve namaz kılmalıdır. Dolayısıyla, ondan rivayet edilenler tartışmalıdır. {cite:muwatta-maruf-1997 s.105}"
  id: "Laporan pertama dalam bab tentang menstruasi adalah sebuah pernyataan: Yahya meriwayatkan dari Malik bahwa ia mendengar Aisyah berkata mengenai seorang wanita hamil yang melihat darah, bahwa ia harus menahan diri dari salat. Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik, dan bahwa Abd al-Razzaq dan al-Daraqutni meriwayatkan, melalui Ata, dari Aisyah sebuah pernyataan yang berbeda: bahwa seorang wanita hamil yang tidak mengalami menstruasi, ia harus melakukan ghusl (pembersihan ritual) dan salat. Dengan demikian, apa yang diriwayatkan darinya masih diperdebatkan. {cite:muwatta-maruf-1997 p.105}"
