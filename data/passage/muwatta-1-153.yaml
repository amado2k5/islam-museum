label: { ar: "الموطأ 153 — بلاغ عن عائشة: الحامل ترى الدم تدع الصلاة", en: "Muwatta 153" }
summary:
  ar: "أول أثر في باب جامع الحيضة، وهو بلاغ: يروي يحيى عن مالك أنه بلغه أن عائشة قالت في المرأة الحامل ترى الدم إنها تدع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق والدارقطني رويا من طريق عطاء عن عائشة قولاً مخالفاً: الحامل لا تحيض، تغتسل وتصلي؛ فالمنقول عنها مختلف فيه. {cite:muwatta-maruf-1997 p.105}"
