label: { ar: "الموطأ 2102 — مالك: من اشترى أرضا فيها شفعة لناس حضور، فليرفعهم إلى السلطان، فإما أن يستحقوا وإما أن يسلم له، فإن تركهم فلم يرفع أمرهم إلى السلطان وقد علموا باشترائه، فتركوا ذلك حتى طال زمانه، فلا أرى ذلك لهم", en: "Muwatta 2102", es: "Muwatta 2102", fr: "Muwatta 2102", ur: "موطا 2102", tr: "El-Muvatta 2102 — Malik: Kim, içinde insanların öncelikli satın alma hakkı bulunan bir arazi satın alırsa, onları yöneticiye götürmelidir. Ya hakları onlara verilir ya da ona verilir. Eğer onları bırakır ve meseleyi yöneticiye götürmezse, satın alımından haberdar olsalar bile ve uzun bir süre geçtikten sonra, bunu onlar için caiz görmüyorum.", id: "Al-Muwatta 2102 — Malik: Barang siapa membeli tanah yang di dalamnya terdapat hak prioritas bagi orang-orang yang hadir, hendaklah ia membawa mereka kepada penguasa. Entah hak mereka akan diberikan, atau hak itu akan diberikan kepadanya. Jika ia membiarkan mereka dan tidak membawa masalah mereka kepada penguasa, meskipun mereka mengetahui pembeliannya, dan mereka telah menundanya hingga waktu yang lama berlalu, maka menurutku hal itu tidak diperbolehkan bagi mereka." }
summary:
  ar: "قال مالك: ومن اشترى أرضا فيها شفعة لناس حضور، فليرفعهم إلى السلطان، فإما أن يستحقوا، وإما أن يسلم له السلطان. فإن تركهم فلم يرفع أمرهم إلى السلطان، وقد علموا باشترائه، فتركوا ذلك حتى طال زمانه، ثم جاءوا يطلبون شفعتهم، فلا أرى ذلك لهم. {cite:muwatta-maruf-1997 p.258}"
  tr: "Malik şöyle dedi: \"Kim, içinde halkın öncelikli satın alma hakkı bulunan bir arazi satın alırsa, onları hükümdara götürsün. Ya hak sahibi olurlar ya da hükümdar ona izin verir. Eğer onları bırakır ve satın alma işleminden haberdar olsalar bile, durumlarını hükümdara götürmezse ve uzun bir süre sessiz kalıp sonra öncelikli satın alma haklarını talep etmeye gelirlerse, bunun onların lehine olduğunu düşünmüyorum.\" {cite:muwatta-maruf-1997 s.258}"
  id: "Malik berkata: Barang siapa membeli tanah yang di dalamnya terdapat hak prioritas bagi orang-orang yang hadir, hendaklah ia membawa mereka kepada penguasa. Entah mereka berhak atas tanah itu, atau penguasa akan mengabulkannya. Jika ia membiarkan mereka dan tidak membawa perkara mereka kepada penguasa, meskipun mereka mengetahui pembeliannya, dan mereka tetap diam sampai waktu yang lama berlalu, lalu mereka datang untuk menuntut hak prioritas mereka, saya tidak melihat hal itu menguntungkan mereka. {cite:muwatta-maruf-1997 p.258}"
