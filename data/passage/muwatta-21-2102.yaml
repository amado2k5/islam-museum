label: { ar: "الموطأ 2102 — مالك: من اشترى أرضا فيها شفعة لناس حضور، فليرفعهم إلى السلطان، فإما أن يستحقوا وإما أن يسلم له، فإن تركهم فلم يرفع أمرهم إلى السلطان وقد علموا باشترائه، فتركوا ذلك حتى طال زمانه، فلا أرى ذلك لهم", en: "Muwatta 2102" }
summary:
  ar: "قال مالك: ومن اشترى أرضا فيها شفعة لناس حضور، فليرفعهم إلى السلطان، فإما أن يستحقوا، وإما أن يسلم له السلطان. فإن تركهم فلم يرفع أمرهم إلى السلطان، وقد علموا باشترائه، فتركوا ذلك حتى طال زمانه، ثم جاءوا يطلبون شفعتهم، فلا أرى ذلك لهم. {cite:muwatta-maruf-1997 p.258}"
