label: { ar: "الموطأ 1275 — عمر بن الخطاب: أمر المجذومة التي تطوف بالبيت أن تجلس في بيتها، فلما مات الذي نهاها قالت ما كنت لأطيعه حيا وأعصيه ميتا", en: "Muwatta 1275" }
text: "ما كُنْتُ لأُطيعَهُ حَيًّا، وأعْصِيَهُ مَيّنَا"
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن ابن أبي مليكة أن عمر بن الخطاب مر بامرأة مجذومة وهي تطوف بالبيت، فقال لها يا أمة الله، لا تؤذي الناس، لو جلست في بيتك، فجلست. ثم مر بها رجل بعد ذلك فقال لها إن الذي كان نهاك قد مات فاخرجي، فقالت ما كنت لأطيعه حيا وأعصيه ميتا. {cite:muwatta-maruf-1997 p.567}"
