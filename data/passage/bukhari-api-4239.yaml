label: { ar: "صحيح البخاري 4239 — الأب والأبوة", en: "Sahih al-Bukhari 4239 — the father and fatherhood", ur: "صحیح بخاری 4239 — باپ اور والدیت", es: "Sahih al-Bukhari 4239 — El padre y la paternidad" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَمْرُو بْنُ يَحْيَى بْنِ سَعِيدٍ، قَالَ أَخْبَرَنِي جَدِّي، أَنَّ أَبَانَ بْنَ سَعِيدٍ، أَقْبَلَ إِلَى النَّبِيِّ فَسَلَّمَ عَلَيْهِ، فَقَالَ أَبُو هُرَيْرَةَ يَا رَسُولَ اللَّهِ هَذَا قَاتِلُ ابْنِ قَوْقَلٍ. وَقَالَ أَبَانُ لأَبِي هُرَيْرَةَ وَاعَجَبًا لَكَ وَبْرٌ تَدَأْدَأَ مِنْ قَدُومِ ضَأْنٍ. يَنْعَى عَلَىَّ امْرَأً أَكْرَمَهُ اللَّهُ بِيَدِي، وَمَنَعَهُ أَنْ يُهِينَنِي بِيَدِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4239، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4239 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4239، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4239 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
