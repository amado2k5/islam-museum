text: "… بدمشق وحفظ القرآن سنة أربع وستين وصلى به سنة خس وسمين وسمع الحديث من صاعة وافرد القسراات على بعض الشبوخ وجع السبعة فى سمة عمان رسمين وج فى هذه السنة بم ر-ل الى الديار المصرية فى سنة تسع ورجع القراآت …"
summary:
