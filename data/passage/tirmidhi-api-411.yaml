label: { ar: "جامع الترمذي 411 — الأب والأبوة", en: "Jami' al-Tirmidhi 411 — the father and fatherhood", ur: "جامع ترمذی 411 — باپ اور والدیت", es: "Jami' al-Tirmidhi 411 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 411 — le père et la paternité" }
text: "… حَدَّثَنَا عُمَرُ بْنُ الرَّمَّاحِ الْبَلْخِيُّ، عَنْ كَثِيرِ بْنِ زِيَادٍ، عَنْ عَمْرِو بْنِ عُثْمَانَ بْنِ يَعْلَى بْنِ مُرَّةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّهُمْ كَانُوا مَعَ النَّبِيِّ فِي مَسِيرٍ فَانْتَهَوْا إِلَى مَضِيقٍ وَحَضَرَتِ الصَّلاَةُ فَمُطِرُوا السَّمَاءُ مِنْ فَوْقِهِمْ وَالْبِلَّةُ مِنْ أَسْفَلَ مِنْهُمْ فَأَذَّنَ رَسُولُ اللَّهِ وَهُوَ عَلَى رَاحِلَتِهِ وَأَقَامَ - أَوْ أَقَامَ - فَتَقَدَّمَ عَلَى رَاحِلَتِهِ فَصَلَّى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 411، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 411 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 411، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 411 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 411 (Le Livre de la Salat (Prière)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
