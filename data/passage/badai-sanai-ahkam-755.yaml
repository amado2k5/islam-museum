text: "… فِي إِحْدَى صَلاتَي العِشَاءِ: إِمَّا الظَّهْرِ، وَإِمَّا العَصْرِ، حَتَّى ظَنَنَّا أَنَّهُ قَرَأَ ألم السَّجْدَةِ وَلَوْ كَانَ مَكْروهاً لما فعله النبي وَايقهِ. ولنا: أن هذا لا ينفك عن أمر مكروه؛ لأنه إذا تلا ولم يسجد فقد ترك الواجب، وإن سجد فقد …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 755، يرد فيه ذكر الواجب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 755, whose wording mentions the obligatory (wajib), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 755 کا اقتباس جس میں واجب، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
