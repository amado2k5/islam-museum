label: { ar: "الموطأ 2088 — مالك: الشفعة بين الشركاء على قدر حصصهم، يأخذ كل إنسان منهم بقدر نصيبه، إن كان قليلا فقليلا، وإن كان كثيرا فبقدره، إذا تشاحوا فيها", en: "Muwatta 2088", es: "Muwatta 2088", fr: "Muwatta 2088", ur: "موطا 2088", tr: "Al-Muwatta 2088 — Malik: Ortaklar arasındaki ön alım hakkı paylarına göredir. Her kişi kendi payına göre alır; payı az ise küçük pay, büyük ise payının büyüklüğüne göre alır, eğer bu konuda ihtilaf çıkarsa.", id: "Al-Muwatta 2088 — Malik: Hak prioritas antara para mitra adalah sesuai dengan bagian mereka. Setiap orang mengambil sesuai dengan bagiannya, jika kecil, maka bagian yang kecil, dan jika besar, maka sesuai dengan besarnya, jika mereka berselisih mengenainya." }
summary:
  ar: "قال مالك: الشفعة بين الشركاء على قدر حصصهم، يأخذ كل إنسان منهم بقدر نصيبه: إن كان قليلا فقليلا، وإن كان كثيرا فبقدره، وذلك إذا تشاحوا فيها. {cite:muwatta-maruf-1997 p.254}"
  tr: "Malik şöyle demiştir: Ortaklar arasındaki ön alım hakkı, paylarıyla orantılıdır; her kişi kendi payına göre alır: payı küçükse küçük bir pay, büyükse de payına orantılı bir pay alır. Bu, aralarında anlaşmazlık olması durumunda da geçerlidir. {cite:muwatta-maruf-1997 s.254}"
  id: "Malik berkata: Hak prioritas pembelian di antara para mitra sebanding dengan bagian mereka; setiap orang mengambil sesuai dengan bagiannya: jika kecil, maka bagian yang kecil, dan jika besar, maka bagian yang sebanding dengannya. Ini berlaku jika mereka berselisih mengenai hal itu. {cite:muwatta-maruf-1997 p.254}"
