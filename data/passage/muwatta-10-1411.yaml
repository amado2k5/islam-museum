  ar: "سئل مالك عن شاة تردت فكسرت، فأدركها صاحبها فذبحها، فسال الدم منها ولم تتحرك. فقال مالك إن كان ذبحها ونفسها يجري وهي تطرف فليأكلها. {cite:muwatta-maruf-1997 p.632}"
