label: { ar: "الموطأ 1154 — مالك: كل ما تصنعه الحائض في الحج يصنعه الرجل وهو غير طاهر دون شيء عليه", en: "Muwatta 1154", es: "Muwatta 1154", fr: "Muwatta 1154", ur: "موطا 1154", tr: "Al-Muwatta 1154 — Malik: Hac sırasında adet gören bir kadının yaptığı her şeyi, ritüel olarak temiz olmasa bile bir erkek yapabilir ve bunun için ona bir ceza verilmez.", id: "Al-Muwatta 1154 — Malik: Apa pun yang dilakukan seorang wanita yang sedang haid selama ibadah haji, seorang pria pun boleh melakukannya meskipun ia tidak suci secara ritual, dan tidak ada hukuman baginya." }
summary:
  ar: "سئل مالك هل يقف الرجل بعرفة أو بالمزدلفة أو يرمي الجمار أو يسعى بين الصفا والمروة وهو غير طاهر. فقال إن كل أمر تصنعه الحائض من أمر الحج يصنعه الرجل وهو غير طاهر، ولا يكون عليه شيء، والفضل أن يكون طاهرا في ذلك كله، ولا ينبغي له أن يتعمد ذلك. {cite:muwatta-maruf-1997 p.523}"
  tr: "Malik'e, bir erkeğin Arafat veya Muzdalifa'da durup duramayacağı, Cemarat'a taş atıp atamayacağı veya Safa ile Merve arasında Sa'i yapıp yapamayacağı soruldu. O da, adetli bir kadının yaptığı Hac ibadetlerinin herhangi birini bir erkeğin de adetli iken yapabileceğini ve bunun kendisine bir ceza getirmeyeceğini söyledi. Ancak, tüm bu ibadetlerde temiz olmak daha iyidir ve bunu kasten yapmamalıdır. {cite:muwatta-maruf-1997 s.523}"
  id: "Malik ditanya apakah seorang pria dapat berdiri di Arafat atau Muzdalifah, melempar kerikil ke Jamarat, atau melakukan Sa'i antara Safa dan Marwa dalam keadaan najis. Beliau menjawab bahwa setiap ibadah haji yang dilakukan oleh wanita yang sedang haid dapat dilakukan oleh seorang pria dalam keadaan najis, dan tidak ada hukuman baginya. Namun, lebih baik untuk suci dalam semua ibadah tersebut, dan ia tidak boleh melakukannya dengan sengaja. {cite:muwatta-maruf-1997 p.523}"
