label: { ar: "الموطأ 1154 — مالك: كل ما تصنعه الحائض في الحج يصنعه الرجل وهو غير طاهر دون شيء عليه", en: "Muwatta 1154" }
summary:
  ar: "سئل مالك هل يقف الرجل بعرفة أو بالمزدلفة أو يرمي الجمار أو يسعى بين الصفا والمروة وهو غير طاهر. فقال إن كل أمر تصنعه الحائض من أمر الحج يصنعه الرجل وهو غير طاهر، ولا يكون عليه شيء، والفضل أن يكون طاهرا في ذلك كله، ولا ينبغي له أن يتعمد ذلك. {cite:muwatta-maruf-1997 p.523}"
