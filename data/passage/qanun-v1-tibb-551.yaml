  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 551, qui mentionne la douleur, la lèpre et le vitiligo, les maladies nommées, les organes du corps, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. cildinin 551. sayfasından, ağrı, cüzzam, vitiligo, hastalıkların, vücut parçalarının ve rahatsızlıkların isimlerini içeren bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
