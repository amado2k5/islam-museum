  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 551, that mentions pain, leprosy and vitiligo, named diseases, the organs of the body, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
