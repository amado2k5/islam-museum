text: "… وحراقة لحم الحمل طلاء على الي. آلات المفاصل : لحم البقر يولّد الجذام، وداء الفيل، والدوالي، وكذلك اللحوم الغليظة والسمن، والألية - ضمّاداً - جيّدة للعصب الجاسي. ومرقة لحم الأرنب يقعد فيها صاحب النقرس، وصاحب أوجاع المفاصل، فيقارب فعلها فعل …"
summary:
