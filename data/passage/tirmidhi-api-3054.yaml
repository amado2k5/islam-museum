label: { ar: "جامع الترمذي 3054 — الحلال، ما أُحل", en: "Jami' al-Tirmidhi 3054 — the lawful; what was made lawful", ur: "جامع ترمذی 3054 — حلال، جو حلال کیا گیا", es: "Jami' al-Tirmidhi 3054 — lo lícito; lo que se hizo lícito" }
text: "… ابْنِ عَبَّاسٍ، أَنَّ رَجُلاً، أَتَى النَّبِيَّ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي إِذَا أَصَبْتُ اللَّحْمَ انْتَشَرْتُ لِلنِّسَاءِ وَأَخَذَتْنِي شَهْوَتِي فَحَرَّمْتُ عَلَىَّ اللَّحْمَ. فَأَنْزَلَ اللَّهُ : ⁦( يَا أَيُّهَا الَّذِينَ آمَنُوا لاَ تُحَرِّمُوا طَيِّبَاتِ مَا أَحَلَّ اللَّهُ لَكُمْ وَلاَ تَعْتَدُوا إِنَّ اللَّهَ لاَ يُحِبُّ الْمُعْتَدِينَ وَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلاَلاً طَيِّبًا )⁩ قَالَ هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3054، يذكر الحلال، وما أُحل، وما حُرّم، والطيبات. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3054 (Chapters on Tafsir), that mentions the lawful, what was made lawful, what was made unlawful, the good things. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3054، جس میں حلال، جو حلال کیا گیا، جو حرام کیا گیا، پاکیزہ چیزیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3054 (Capítulos sobre Tafsir), menciona lo lícito, lo que se hizo lícito, lo que se hizo ilícito y las buenas acciones. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
