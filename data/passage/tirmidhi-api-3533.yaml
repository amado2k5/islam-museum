text: "… مُوسَى، عَنِ الأَعْمَشِ، عَنْ أَنَسٍ، أَنَّ رَسُولَ اللَّهِ مَرَّ بِشَجَرَةٍ يَابِسَةِ الْوَرَقِ فَضَرَبَهَا بِعَصَاهُ فَتَنَاثَرَ الْوَرَقُ فَقَالَ \" إِنَّ الْحَمْدَ لِلَّهِ وَسُبْحَانَ اللَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ لَتُسَاقِطُ مِنْ ذُنُوبِ الْعَبْدِ كَمَا تَسَاقَطَ وَرَقُ هَذِهِ الشَّجَرَةِ \". قَالَ هَذَا حَدِيثٌ غَرِيبٌ. وَلاَ نَعْرِفُ لِلأَعْمَشِ سَمَاعًا مِنْ أَنَسٍ إِلاَّ أَنَّهُ قَدْ رَآهُ وَنَظَرَ إِلَيْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3533، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3533 (Chapters on Supplication), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3533، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
