label: { ar: "جامع الترمذي 3533 — محو السيئات وحط الخطايا", en: "Jami' al-Tirmidhi 3533 — bad deeds erased and sins shed", ur: "جامع ترمذی 3533 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Jami' al-Tirmidhi 3533 — malas acciones borradas y pecados perdonados", fr: "Jami' al-Tirmidhi 3533 — les mauvaises actions effacées et les péchés pardonnés", tr: "Cami' el-Tirmizi 3533 — Günahları silmek ve suçları ortadan kaldırmak", id: "Jami' al-Tirmidhi 3533 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "… مُوسَى، عَنِ الأَعْمَشِ، عَنْ أَنَسٍ، أَنَّ رَسُولَ اللَّهِ مَرَّ بِشَجَرَةٍ يَابِسَةِ الْوَرَقِ فَضَرَبَهَا بِعَصَاهُ فَتَنَاثَرَ الْوَرَقُ فَقَالَ \" إِنَّ الْحَمْدَ لِلَّهِ وَسُبْحَانَ اللَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ لَتُسَاقِطُ مِنْ ذُنُوبِ الْعَبْدِ كَمَا تَسَاقَطَ وَرَقُ هَذِهِ الشَّجَرَةِ \". قَالَ هَذَا حَدِيثٌ غَرِيبٌ. وَلاَ نَعْرِفُ لِلأَعْمَشِ سَمَاعًا مِنْ أَنَسٍ إِلاَّ أَنَّهُ قَدْ رَآهُ وَنَظَرَ إِلَيْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3533، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3533 (Chapters on Supplication), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3533، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.° 3533 (Capítulos sobre la súplica), que habla de malas acciones borradas y pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3533 (Chapitres sur les invocations), évoque l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent une action."
  tr: "Cami' el-Tirmizi'de yer alan 3533 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3533, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
