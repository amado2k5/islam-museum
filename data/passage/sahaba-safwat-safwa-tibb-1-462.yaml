text: "… مات الطبيب، فبكى وأنشأ يقول : إذا مات المعالِج من سقامي فيوشك للمعالَج أن يموتا وعن علي بن الحسن البزار قال: سمعت إبراهيم بن إسحاق الحربي يقول - وقد دخل عليه قوم يعودونه فقالوا: كيف تجدك يا أبا إسحاق؟ قال …"
