label: { ar: "الموطأ 745 — مالك: فرق عمر بين القطنية والحنطة فيما أخذ من النبط، ورأى القطنية صنفاً واحداً", en: "Muwatta 745" }
summary:
  ar: "قول لمالك: وقد فرق عمر بن الخطاب بين القطنية والحنطة فيما أُخذ من النبط، ورأى أن القطنية صنف واحد فأخذ منها العشر، وأخذ من الحنطة والزبيب نصف العشر. ويجيب مالك من يسأل كيف تُجمع القطنية في الزكاة مع أنه يُؤخذ منها اثنان بواحد يداً بيد بخلاف الحنطة: بأن الذهب والورق يُجمعان في الصدقة وقد يُؤخذ بالدينار أضعافه من الورق يداً بيد. ويذكر المحقق أن زيادة «كلها» في نسخة م لا أصل لها، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.370}"
