label: { ar: "الموطأ 745 — مالك: فرق عمر بين القطنية والحنطة فيما أخذ من النبط، ورأى القطنية صنفاً واحداً", en: "Muwatta 745", es: "Muwatta 745", fr: "Muwatta 745", ur: "موطا 745", tr: "El-Muvatta 745 — Malik: Ömer, Nabateanlardan aldığı ürünlerde pamuk ve buğdayı birbirinden ayırmış ve pamuğu bir tür olarak kabul etmiştir.", id: "Al-Muwatta 745 — Malik: Umar membedakan antara kapas dan gandum dalam apa yang diambilnya dari orang-orang Nabatea, dan menganggap kapas sebagai salah satu jenisnya." }
summary:
  ar: "قول لمالك: وقد فرق عمر بن الخطاب بين القطنية والحنطة فيما أُخذ من النبط، ورأى أن القطنية صنف واحد فأخذ منها العشر، وأخذ من الحنطة والزبيب نصف العشر. ويجيب مالك من يسأل كيف تُجمع القطنية في الزكاة مع أنه يُؤخذ منها اثنان بواحد يداً بيد بخلاف الحنطة: بأن الذهب والورق يُجمعان في الصدقة وقد يُؤخذ بالدينار أضعافه من الورق يداً بيد. ويذكر المحقق أن زيادة «كلها» في نسخة م لا أصل لها، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.370}"
  tr: "Malik şöyle dedi: Ömer ibn el-Hattab, Nabateanlardan alınan pamuk ve buğdayı birbirinden ayırmış, pamuğu tek bir kategori olarak kabul edip onda birini alırken, buğday ve kuru üzümün onda yarısını almıştır. Malik, iki pamuğun bir olarak kabul edildiği halde, elden ele pamuk zekât için nasıl birleştirildiğini soranlara, altın ve gümüşün sadaka için birleştirildiğini ve bir dinarın değerinin birçok kez gümüş olarak elden ele alınabileceğini söyleyerek cevap verir. Editör, M el yazmasında \"hepsi\" ifadesinin hiçbir dayanağı olmadığını ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.370}"
  id: "Malik berkata: Umar ibn al-Khattab membedakan antara kapas dan gandum dalam apa yang diambil dari kaum Nabatea, menganggap kapas sebagai satu kategori dan mengambil sepersepuluhnya, sementara mengambil setengah persepuluh gandum dan kismis. Malik menjawab mereka yang bertanya bagaimana kapas digabungkan untuk zakat ketika dua diambil untuk satu, secara langsung, tidak seperti gandum, dengan mengatakan bahwa emas dan perak digabungkan untuk sedekah, dan seringkali nilai satu dinar dapat diambil dalam perak, secara langsung. Editor mencatat bahwa penambahan \"semuanya\" dalam manuskrip M tidak memiliki dasar, dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.370}"
