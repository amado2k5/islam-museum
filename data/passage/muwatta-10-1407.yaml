label: { ar: "الموطأ 1407 — ثور بن زيد عن ابن عباس: سئل عن ذبائح نصارى العرب، فقال لا بأس بها، واستشهد بآية في سورة المائدة", en: "Muwatta 1407", es: "Muwatta 1407", fr: "Muwatta 1407", ur: "موطا 1407", tr: "El-Muvatta 1407 — Sevr ibn Zeyd, İbn Abbas'tan rivayetle: Arap Hristiyanların kurbanları hakkında kendisine sorulduğunda, bunda bir sakınca olmadığını söylemiş ve Maide Suresi'nden bir ayet zikretmiştir.", id: "Al-Muwatta 1407 — Thawr ibn Zayd berdasarkan riwayat Ibn Abbas: Ia ditanya tentang kurban yang dilakukan oleh orang-orang Kristen Arab, dan ia berkata bahwa tidak ada yang salah dengan kurban tersebut, dan ia mengutip sebuah ayat dalam Surat al-Ma'idah." }
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي عن عبد الله بن عباس أنه سئل عن ذبائح نصارى العرب، فقال لا بأس بها، وتلا آية من سورة المائدة في موالاة أهل الكتاب. {cite:muwatta-maruf-1997 p.631}"
  tr: "Malik, Abdullah ibn Abbas'tan rivayet ettiğine göre, Sevr ibn Zeyd el-Dili'den naklederek, Arap Hristiyanların kurbanları hakkında kendisine soru sorulduğunda, bunların yanlış olmadığını söylediğini ve Kitap Ehli'ne biat etme ile ilgili Maide Suresi'nden bir ayet okuduğunu aktarır. {cite:muwatta-maruf-1997 s.631}"
  id: "Malik meriwayatkan dari Thawr ibn Zayd al-Dili, yang juga meriwayatkan dari Abdullah ibn Abbas, bahwa ia ditanya tentang pengorbanan orang-orang Kristen Arab, dan ia berkata bahwa tidak ada yang salah dengan pengorbanan tersebut, lalu ia membacakan sebuah ayat dari Surat al-Ma'idah tentang berbaiat kepada Ahli Kitab. {cite:muwatta-maruf-1997 p.631}"
