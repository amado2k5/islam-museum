text: |-
  ٥٠٤
  * ⁦(فصل الصاد)⁩.
  •(صفا,n
  الطائر الذى يصر بالليل ويت-فزقفزانا ويطير والناس يرونه الجندب واغماه والسدى فأما
  الجندب فهو أصغر من الصدى والصدى الذى يجيبك بمثل صوتك فى الجبال وغيرها يقال
  صمّ صداه وأصم اللّٰه صداه أى أهلكه لانَّ الرجل اذامات لم يسمع الصدى منه شيأفيجيبه
  وقد أصدى الجبل والتصدية التصفيق وصاديت فلانادا جيته وساترته وداريته قال أبن
  أحريصف قدورا
  ودهم تصاديما الولائد جلة * اذاجهات أجوافهالم تحلم
  والمصاداة أيضا المعارضة وتصدّى له أى تعرّض وهو الذى يستشرفه ناظرا اليه ويقال أيضاانه
  لصدى ابل أى عالم بها وعصلحتها والصدى العطس وقد صدى بصدى صدى فهوصدوصاد
  وصديان وامر أة سديا والصوادى النخيل الطوال وقد تكون الصوادى التى لا تشرب
  الماء رى الفراء يقال هو الصرى والصرى للماء يطول استنقاعه وقال أبو عمرو
  اذا طال مكذه وتغير وقد صرى الماء بالكسر وهذه نطفة صراة وصرى الماء فى ظهره زمانا أى
  احتيسه قال الراجز
  رب غلام قد ضرى فى فقرته • ما الشباب عنفوان سنبته
  وصرى بوله صريا اذا قطعه وصرى اللّٰه عنه شره أى دفع وصريته أى منعته قال ذوالرمة
  وودعن مشتافا أصبن فؤاده * هواهن ان لم يصره اللّٰه قاتله
  وصريت الماءاذا استقيته ثم قطعته وقال
  صرت نظرة لوصادفت جوزدارع * غدا والعواصى من دم الجوف تنصر
  وصرّيت الشاة تصرية اذ الم تحلبها أيا ماحتى يجتمسع اللبن فى ضرعها والشاة مصرّاة وصريت
  ما يينه-م صر يا أى فصلت يقال اختصمنا الى الحاكم فصرى ما بيننا أى قطع ما ييننا وفصل
  وصرى ف_لان فى يدفلان اذابقى فى يدهرهنا محبوساو الصرانه-ر بالعراق وهى العظمى
  والصغرى والصراءم دود الحنفال اذا اصفرّ الواحدة صراية ويروى قول امرى القيض.
  مداك عروس أوصراية حنظل • والصارى الملاح والمع صرّا« مثل قاروقراه وكافر
  وكفاروأما الصرارى فقدذ كرناه فى باب الراء (صعا الصعوة طائر والجع
  صعو وصعاء ( صفا صغايصغور يصفى صغوًا أى مال وتكذلك صفى بالكسر
  يصفى صفى وصغيا وصغت النجوم اذا مالت للغروب أبو زيد يقال صغوممعك وصغوه معك
  وصغاه معك أى ميسله وقولهم أكرم وافلانا فى صاغيته وهم القوم الذين يميلون اليه ويأتونه
  ويطلبون ماعنده وأصفيت الى فلان اذاملات يسمعك نحوه وأصغيت الاناء أملته يقال
  فلان مصفى اناؤه اذانص حقه وأصغت الناقة اذا أمالت رأسها الى الرحل كأنها تسقمع
  شيأحين يشة عليها الرحل قال ذوارقة
  تصنى اذاشدها بالكوربانحة • حتى اذا مااستوى فى غرزهاتنب
  فا الصفاء مدود خلاف الكدرية ال صفا الشراب يصة وصفاء وصفيته أنا تصفبة
  وصفوة الشئ خالصه ومح_دصفوة اللّٰه من خلقه ومصطفاه أبو عبيدة يقال لهصفوة مالى
  وصقرة مالى وصفوة مالى فاذانزعوا الها قالواله صفومالى بالفتح لاغير وصفوت القدرأى
  أخذت
