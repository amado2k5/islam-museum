  وتأجلت البهام أى صارت آجالا قال لبيد
  والعين ساكنة على أطلائها • عوذا تأجل بالفضاءبهامها
  والاجل أيضاوجع فى العنق وقد أجل الرجل بالسكسر أى نام على عنقه فاشتكاها والتأجيل
  المداواة منه يقال بى اجل فأجلونى منه أى داوونى منه كما يقال طنيته اذا عالحته من الطنا
  ومرضته واستأحلته فأجلى الى مدة والاجل لغة فى الايل وهو الذكر من الاوعال ويقال
  هوالذى يسمى بالفارسية كوزن قال أبوع روبن العلا بعض الاعراب يجعل الياء المشسدّدة
  جيماوان كانت أيا غير طرف وأنشدابن الاعرابى
  كاتّ ف أذنابهن الشّوّل * من عبس الصيفٌ قرون الاجلَ
  قال يريد الايل والآج-ل والاجلة ضد العاجل والعاجلة وأجل عليهم شرايأ جل وبأجل
  أجلا أى جناه وهيجه قال خوّات بن جبير
  وأهل خباءمالح ذات بينه-م * قد احتربوا فى عاجل أنا آجله
  أى أناجانيه قال أبو عمر والمأجل بفتح الجيم مستنقع الماء وابمع الماجل وقد تأجل الماءفهو
  متأجل وماء اجيل أى مجتمع واجلى على فعلى اسم موضع وهومرعى لهم معسروف
  ومنه قول الشاعر
  حلت سليمي جانب الجريب • بأجلى محلة الغريب
  وقواهم أجل انماه وجواب مثل نعم قال الاخفس الا انه أحسن من نعم فى التصديق ونعم
  أحسن منه فى الاستفهام فاذا قال أنت سوف تذهب قلت أجل وكان أحسن من نعم واذا
  قال أتذهب قلت نعم وكان أحسن من أجل ⁦(أدل )⁩ قال الفراء الادل وجع فى العنق
  مثل الاجل والادل أيضا اللبن الخائر الشديد الحوضة يقال جاء نابادلة ما تطاق حضا أى
  من حوضتها ⁦( أزل)⁩ الازل الضيق وقد أزل الرجل يأزل أزلا أى صارف ضيق وجدب
  والازل أيضا الحبس يقال أزلوا مالهم يأزلونه اذا حبسوه عن المرعى من خوف والمازل
  المضمق مثل المأزق قال الفراء بقال تأزل ص-درى وتازق أى ضاق والازل بالسك.
  الكذب وأنتديعقوب
  يقولون ازل حب ليلى وودّها * وقد كذبوامافى مودتها ازل
  والازل بالتحريك القدم يقال أزلت ذكربعض أهل العلم أتّ أصل هذه الكامة قولهم للقديم
  لم يزل ثم نسب الى هذا فلم يستم الاباختصار فقالوايزلى ثم أبدلت الياءأافالانها أخف فقالوا
  أزلى" كمافلوا فى الرمح المنسوب الى ذي يزن أزنى ونصل أربى" سل أسل شجر ويقال
  كل شجر له شوك طويل فشوكه أسل وتسمى الرماح أسلاوالاسلة مستدق اللسان والذراع
  ورجل أسيل الخداذا كان لين الخدطو يله وكل مسترسل أسيل وق..د أسل بالضم أسالة
  وقولهم هوعلى آسال من أبيه مثن آسان أى على شبه من أبيه وعلامات وأخلاق قال ابن
  السكبت ولم اس-ع بواحد الآسال ومأسل بالفتح اسم رحلة (اصل⅜⅜œnuالاصل واحد
  الاصول يقال أصل مؤمل واستأصله أى قلعه من أصله قال أبويوسف قواهم جاوا
  أ أصيلتهم أى بأجعه-م قال السكسائى قواعم لا أص له ولا فصل الاصل الحسب والفصل
