  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 4. cildinin 612. sayfasından bir alıntı, mümini tanımlamaktadır; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 4, halaman 612, menjelaskan tentang orang beriman; ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
