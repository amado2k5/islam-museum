text: "… سيور النعل التي تشد إلى زمامها. وروى مسلم عن أبي هريرة : أن النبي قال : المؤمن القوي خير وأحب إلى اللّٰه من المؤمن الضعيف، وفي كل خير، احرص على ما ينفعك، واستعن بالله ولا تعجز، وإذا أصابك شيء، فلا …"
