text: "… والمقتصد يتناول فاعل الواجبات وتارك المحرمات، والسابق يدخل فيه من سبق فتقرب بالحسنات مع الواجبات. فالمقتصدون أصحاب اليمين، والسابقون السابقون أولئك هم المقربون، ثم إن كلا ً منهم يذكر هذا في نوع من أنواع،الطاعات كقول القائل السابق الذي يصلي في …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 4، ص 561، يرد فيه ذكر الطاعات، والواجب، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 4, p. 561, whose wording mentions the acts of obedience, the obligatory (wajib), the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
