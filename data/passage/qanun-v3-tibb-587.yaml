  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 587, that mentions leprosy and vitiligo, the hospital and the medical craft, treatment, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
