text: "… اتق اللّٰه، لا تأتي يوم القيامة ببعير تحمله له رُغَاءٌ، أو عُبَادَةُ بنُ الصَّامِت بقرة لها خُوار، أو شاة لها ثوأج! قال: فوالذي بعثك بالحق لا أعمل على اثنين. قال محمد بن كعب القُرَظيّ: جمع القرآن في زَمَنِ النَّبي عليلغ …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 630، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
