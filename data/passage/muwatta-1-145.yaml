label: { ar: "الموطأ 145 — مالك: التيمم بتراب السباخ والصلاة فيها", en: "Muwatta 145", es: "Muwatta 145", fr: "Muwatta 145", ur: "موطا 145", tr: "Al-Muwatta 145 — Malik: Tuzlu bataklık toprağıyla teyemmüm yapmak ve orada namaz kılmak", id: "Al-Muwatta 145 — Malik: Tayammum dengan tanah rawa asin dan berdoa di dalamnya" }
summary:
  ar: "فتوى لمالك في باب تيمم الجنب: سُئل عن جنب أراد أن يتيمم فلم يجد تراباً إلا تراب سبخة، هل يتيمم بالسباخ وهل تكره الصلاة فيها؟ فقال: لا بأس بالصلاة في السباخ والتيمم منها، واحتج بأن الله أمر في آية المائدة بالتيمم بالصعيد الطيب، فكل ما كان صعيداً يُتيمم به سباخاً كان أو غيره. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.102}"
  tr: "Malik'in, büyük bir ritüel kirlilik halinde olan bir kişi için teyemmüm konusuna ilişkin fetvası: Kendisine, büyük bir ritüel kirlilik halinde olan ve teyemmüm yapmak isteyen ancak sadece tuz düzlüğünden toprak bulabilen bir kişi soruldu. Tuz düzlüklerinde teyemmüm yapıp yapamayacağı ve orada namaz kılmanın mekruh olup olmadığı soruldu. Malik şöyle cevap verdi: Tuz düzlüklerinde namaz kılmakta veya orada teyemmüm yapmakta bir sakınca yoktur. Allah'ın Maide Suresi'nde teyemmümün temiz toprakla yapılmasını emrettiğini, dolayısıyla toprak olarak kabul edilen her şeyin, tuz düzlükleri olsun veya olmasın, teyemmüm için kullanılabileceğini savundu. Araştırmacı, bunun Ebu Mus'ab tarafından Malik'ten rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.102}"
  id: "Fatwa Malik tentang tayammum bagi orang yang dalam keadaan najis besar: Beliau ditanya tentang seseorang yang dalam keadaan najis besar yang ingin bertayammum tetapi hanya menemukan tanah dari dataran garam. Beliau ditanya apakah dapat bertayammum dengan dataran garam dan apakah salat di atasnya termasuk makruh. Beliau menjawab: Tidak ada salahnya salat di dataran garam atau bertayammum dengannya. Beliau berpendapat bahwa Allah memerintahkan dalam ayat Surah Al-Ma'idah untuk bertayammum dengan tanah yang bersih, sehingga apa pun yang dianggap sebagai tanah dapat digunakan untuk tayammum, baik itu dataran garam atau lainnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan ini dari Malik. {cite:muwatta-maruf-1997 p.102}"
