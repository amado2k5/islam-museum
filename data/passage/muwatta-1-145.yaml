label: { ar: "الموطأ 145 — مالك: التيمم بتراب السباخ والصلاة فيها", en: "Muwatta 145" }
summary:
  ar: "فتوى لمالك في باب تيمم الجنب: سُئل عن جنب أراد أن يتيمم فلم يجد تراباً إلا تراب سبخة، هل يتيمم بالسباخ وهل تكره الصلاة فيها؟ فقال: لا بأس بالصلاة في السباخ والتيمم منها، واحتج بأن الله أمر في آية المائدة بالتيمم بالصعيد الطيب، فكل ما كان صعيداً يُتيمم به سباخاً كان أو غيره. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.102}"
