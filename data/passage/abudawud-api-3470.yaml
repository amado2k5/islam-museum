label: { ar: "سنن أبي داود 3470 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 3470 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 3470 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 3470 — lo que fue lícito; lo que no es lícito" }
text: "… وَهْبٍ، قَالَ أَخْبَرَنِي ابْنُ جُرَيْجٍ، ح وَحَدَّثَنَا مُحَمَّدُ بْنُ مَعْمَرٍ، حَدَّثَنَا أَبُو عَاصِمٍ، عَنِ ابْنِ جُرَيْجٍ، - الْمَعْنَى - أَنَّ أَبَا الزُّبَيْرِ الْمَكِّيَّ، أَخْبَرَهُ عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِنْ بِعْتَ مِنْ أَخِيكَ تَمْرًا فَأَصَابَتْهَا جَائِحَةٌ فَلاَ يَحِلُّ لَكَ أَنْ تَأْخُذَ مِنْهُ شَيْئًا بِمَ تَأْخُذُ مَالَ أَخِيكَ بِغَيْرِ حَقٍّ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3470، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3470 (Wages (Kitab Al-Ijarah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3470، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3470 (Salarios (Kitab Al-Ijarah)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
