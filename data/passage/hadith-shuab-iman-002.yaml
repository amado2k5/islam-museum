text: "حب النبي */ فصل في بيانه وفصاحته بسم الله الرحمن الرحيم من محمد رسول الله إلى مسيلمة الكذاب سلام على من اتبع الهدى أما بعد فإن الأرض لله يورثها من يشاء من عباده والعاقبة للمتقين . ١٤٤١ - أخبرنا أبو"
