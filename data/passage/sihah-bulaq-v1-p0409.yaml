  منهرت الشدق لم تنبت قوادمه • فى حاجب العين من ت-بيده زيب
  والسيدطارلين الريس اذا قطر على ظهره قطرتان من ماءبوى قال الراجز
  أكل يوم عرشهامقيلى • -ق ترى المتزرذا الفضول • مثل جناح السبد الغسيل
  والعرب تشبه الفرس به اذاعرق قال طفيل
  تقريبها المرطى والجوز معتدل • كانه سبدبالماء مغسول
  والجمع سبدان والسبدبالكسر الداهبة بقال هوسبد أسباداذا كان داها فى اللصوصية
  قال الشاءرِ يصرّف سبدافى العنان عرّدا ويروى سيدا أبو عمر والسبندى والسبنتى
