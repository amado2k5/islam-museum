  لمارأيت الظعن شالت تحدى * أتبعتهنّ أرحبيا معدا
  أعيس جوّاب الضحى سبندى • يدرع الليل اذا ما اسودًا
  قال الاصمعى البندى والسبنى الخمر (جد يدخفع وقال (١
  يجمع نضل البلق فى حجراته • ترى الاكم فيها جد اللحوافر
  ومنه مجود الصلاة وهو وضع الجبهة على الارض والاسم السيجدة بالكسر وسورة السجد
  أبو عمروأ-يجد الرجل طأطأر أسه وانحى قال حيدبن توريصف نساء
  فضول أزمتها أسجدت • جود النصارى لاربابها
  يقول لماارتحلن ولوين نضول أزمة أجمالهنّ على معاصمهن أسجدت لهن وأنتداءرابى
