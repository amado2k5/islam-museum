  ولايم مزفيقال-سادفاذاهم زفه ومفعل واذالم يهمزفه وفعال (سبد مالدسبدولالبد
  أى قليل ولا كثير عن الاسمعى وقال السبد من الشعر واللبد من الصوف وتسهيد الرأس
  استفصال شعره والتسيد أبضاترك الادّهان وفى الحديث قدم ابن عباس رضى اللّٰه عنهما
  مكة مبدار أسه وسبد الشعر بعد الحاق وهو حين ينيت ويسودّيقال سعد الفرخ اذابدا
