text: "… المكي، فهذا كله مباح لا كراهة فيه. والمالكية يرون في وقت الطلوع والغروب حرمة النوافل، ولو لها سبب، والمنذورة وسجدة التلاوة، وصلاة الجنازة، إلا إذا خيف عليها التغير فتجوز، وأباحوا الفرائض العينية، أداء وقضاء في هذين الوقتين، كما أباحوا الصلاة …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 112، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل، والمباح، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 112, whose wording mentions the obligation (farida), the supererogatory (nafila), the permitted (mubah), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 112 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل، مباح، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 4, p. 112, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila), le permis (mubah), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 4, p. 112, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila), lo permitido (mubah), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in *Fıkıh el-Sünnet* adlı eserinin 4. cildinin 112. sayfasından bir alıntı, farz olan ameller, nafile ameller, helal olan ameller ve mekruh olan ameller konusunu ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Fiqh al-Sunnah* karya Sayyid Sabiq, Jilid 4, halaman 112, membahas tentang amalan wajib, amalan sunnah, amalan yang diperbolehkan, dan amalan yang tidak disukai. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
