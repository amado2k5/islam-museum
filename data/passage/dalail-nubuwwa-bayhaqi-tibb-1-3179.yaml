text: "… مع الإبانة والانفصال، ومعنى الحديث: أن الملك يفارقه على أن يعود، ولا يفارقه مفارقة قاطع لا يعود. يتفصد : من الفصد وهو قطع العرق لإسالة الدم، قاله الحافظ ابن حجر، واليوم فهو يطلق على أخد الدم من الوريد، بواسطة أبرة …"
