text: "عَبْدِ اللَّهِ بْنِ دِينَارٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، كَتَبَ إِلَى عَبْدِ الْمَلِكِ بْنِ مَرْوَانَ يُبَايِعُهُ، وَأُقِرُّ لَكَ بِالسَّمْعِ وَالطَّاعَةِ عَلَى سُنَّةِ اللَّهِ وَسُنَّةِ رَسُولِهِ، فِيمَا اسْتَطَعْتُ‏.‏"
summary:
  ar: "في صحيح البخاري؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sahih al-Bukhari; sending a letter or message to a party."
  ur: "صحیح بخاری میں؛ کسی فریق کو خط یا پیغام بھیجنا."
