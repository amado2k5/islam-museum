text: |-
  قود لاضرع فيها رواهى مدة
  جرب فينا وعبارته والجسرية
  بالفتح وتشديد الباء العانة من
  الحيرور بعا-عوا الاقويا من
  الناس اذا كانوا جماعة متساوين
  جرية قال الراجز وساق البيت
  وقال يقول غحن يهاعة مقساون
  وايس فيناصفيرولا مسن اه
  قوله بعكان المناسب نقديمه
  عنى بمكان كما فعله الحجد اه
  ١٢٠
  • ⁦(فصل التاء)⁩.
  ⁦( بشان)⁩ ناقة بشكى خفيفة المشى والروح وقد بشكت أى أ-رعت تبسك بشكاوبشكت
  النوب اذا خظته خياطة متباعدة وبشك أى كذب يقال هو يبشك الكذب أى يخلقه
  والبتاك الكذاب ( ان بك فلان ييبك بكة أى زحم ومنه قول الراجز
  اذا الشريب أخذته أكد • فله حتى يك بك
  يقول اذا فيجر الذى يوردا به مع ابلا لشدة الحرانتظارافخله -تى يزاحك وتيال القوم أى
  ازد-هوا وبك عنقه أى دقها وإكة اسم بطن مكة سحيت بذلك لازدحام الناس ويقمال سهيت
  لاما كانت تك أعناق الجبابرة والابك موضع قال الراجز
  بوبة كمرالابك • لاضرع فيهاولامذكى
  ويعليك بادوهما كلمتان جعلتا واحدة وقد ذكرنااء رابه فى حضرموت من بأب الراه
  والنسبة اليه بعلىّ وان شئت بكيّ على ماذكرناه فى عبد شمس ⁦(بعكن)⁩ بعكوكة النساس
  مجتمعهم عك الباحك من النوق المسترخية المسنة والبلعك لغة فى البلعق وهو
  ضرب من التمر ك) البنك الاصل وهو مع رب يقال هو لاء قوم من بنك الارض
  والتبقك كالتناية وتبنكوافى موضع كذا أى أقاموايه قال ان دريد البنك من هذا
  ليب عرب" دذ البنادك البنائقذكر ابوعبيد وأنتدلا بن الرقاع
  كأن زرور القبطرية علقت • بشادكها منه جبذع مقوم
  لا) باذ الحمار الاتان ييوكه ابوكانزاعليها وغزوة تبوللان النبى صلى اللّٰه عليه
  وسلم رأى قوما من أصحابه يبوكون -سى تبوك أى يدخلون فيه القدح ويحز كونه ليخرج
  الماء فقال مازلتم تيوكونها بو كأفسميت تلان الغزوة غزوة تبوك وهوتة -عل من البوك قال
  أبوزيد يقال لقيته أول بول أى أول شئ قان الكسائة باكت الناقسة تبول بوكاسينت
  وحكى ابن السكيت فاقة بائك اذا كانت قتية حسنة والمع البوائك ومن كلامهسم انه لمنصار
  بواتكها
  بمعق اترك وهو اسم افعل الامر وقال
  زاكها من ابل تراكها • أماتزى الموت لدى أوراكها
  وقال فه فاائرك أى ماترك شأوهو افتعل وتركة الميت ترائه المترول والترية من النساء
  التى تترك فلا يتزوجها أحد قال الكميت
  اذلا بض الى الترائك والضرائك كف جازر
  والتريكة بيضة النعام التى تتركها ومنه قول الاعشى • وتلق بم ايض النعمام ترائكا •
  والتريكة روضة يغذلها الناس فلايرعونها والتركة البيضة من الحدديد والجم-ع
  تزك ومنه قول لبيد • قردمانيا وتركا كالبصل • والترك جيل من الناس ⁦( ت ان )⁩
  التسكة واحدة التكان ويقال فلان أحق فال تال وهوا تساع له وبعضهسم يفرده ويقول
  أحق تاك وماكنت ناكلولة د تككت بالنتح تكوة قال الكساق يقال أيت الا
