label: { ar: "الموطأ 2826 — عبد الله بن دينار: ابن عمر يطلب من الرجلين التأخر لأن النبي نهى عن المناجاة دون ثالث", en: "Muwatta 2826", es: "Muwatta 2826", fr: "Muwatta 2826", ur: "موطا 2826", tr: "El-Muvatta 2826 — Abdullah bin Dinar: İbn Ömer, Peygamberin üçüncü bir kişi olmadan özel konuşmaları yasakladığı gerekçesiyle iki adamdan geri çekilmelerini istedi.", id: "Al-Muwatta 2826 — Abdullah bin Dinar: Ibnu Umar meminta kedua orang itu untuk mundur karena Nabi melarang percakapan pribadi tanpa kehadiran orang ketiga." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار قال: كنت أنا وعبد الله بن عمر عند دار خالد بن عقبة في السوق، فجاء رجل يريد أن يناجيه، وليس معه أحد غيري وغير الرجل. فدعا عبد الله بن عمر رجلا آخر حتى صاروا أربعة، ثم قال لي وللرجل الذي دعاه: استأخرا شيئا، فإني سمعت رسول الله يقول: لا يتناجى اثنان دون واحد. {cite:muwatta-maruf-1997 p.586} {cite:muwatta-maruf-1997 p.587}"
  tr: "Malik, Abdullah ibn Dinar'dan rivayetle şöyle dedi: Abdullah ibn Umar ve ben, Halid ibn Ukba'nın çarşıdaki evindeydik. Bir adam gelip onunla özel olarak konuşmak istedi. Yanında benden ve o adamdan başka kimse yoktu. Abdullah ibn Umar daha sonra başka bir adamı çağırdı ve böylece dört kişi oldular. Sonra bana ve çağırdığı adama şöyle dedi: \"Biraz geri çekilin, çünkü Allah Resulü'nün şöyle dediğini işittim: 'Üçüncü bir kişi olmadan iki kişi özel olarak konuşmamalıdır.'\""
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, yang berkata: Abdullah ibn Umar dan aku berada di rumah Khalid ibn Uqba di pasar ketika seorang pria datang ingin berbicara secara pribadi dengannya. Tidak ada orang lain bersamanya kecuali pria itu dan aku. Abdullah ibn Umar kemudian memanggil pria lain, sehingga menjadi empat orang. Kemudian dia berkata kepadaku dan pria yang dipanggilnya: \"Mundurlah sedikit, karena aku mendengar Rasulullah SAW bersabda: 'Dua orang tidak boleh berbicara secara pribadi tanpa kehadiran orang ketiga.'\""
