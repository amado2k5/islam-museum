label: { ar: "الموطأ 2826 — عبد الله بن دينار: ابن عمر يطلب من الرجلين التأخر لأن النبي نهى عن المناجاة دون ثالث", en: "Muwatta 2826" }
summary:
  ar: "يروي مالك عن عبد الله بن دينار قال: كنت أنا وعبد الله بن عمر عند دار خالد بن عقبة في السوق، فجاء رجل يريد أن يناجيه، وليس معه أحد غيري وغير الرجل. فدعا عبد الله بن عمر رجلا آخر حتى صاروا أربعة، ثم قال لي وللرجل الذي دعاه: استأخرا شيئا، فإني سمعت رسول الله يقول: لا يتناجى اثنان دون واحد. {cite:muwatta-maruf-1997 p.586} {cite:muwatta-maruf-1997 p.587}"
