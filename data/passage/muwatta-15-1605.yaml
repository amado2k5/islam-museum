label: { ar: "الموطأ 1605 — مالك: من آلى ثم طلق فانقضت عدة الطلاق ولم يوقف، فإن لم يصبها قبل انقضاء عدتها فلا سبيل إليها", en: "Muwatta 1605" }
summary:
  ar: "يقول مالك في الرجل يولي من امرأته فيوقف، ثم يطلقها، ثم يراجعها ولا يمسها، فتنقضي أربعة أشهر قبل أن تنقضي عدتها، إنه لا يوقف ولا يقع عليه طلاق، وإنه إن أصابها قبل أن تنقضي عدتها كان أحف بها، وإن مضت عدتها قبل أن يصيبها فلا سبيل له إليها. وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.66}"
