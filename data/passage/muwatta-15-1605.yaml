label: { ar: "الموطأ 1605 — مالك: من آلى ثم طلق فانقضت عدة الطلاق ولم يوقف، فإن لم يصبها قبل انقضاء عدتها فلا سبيل إليها", en: "Muwatta 1605", es: "Muwatta 1605", fr: "Muwatta 1605", ur: "موطا 1605", tr: "El-Muvatta 1605 — Malik: Bir kimse cinsel perhiz yemini edip karısını boşadığında ve boşanma için bekleme süresi dolmadan önce karısıyla cinsel ilişkiye girmezse, onun için boşanmanın bir yolu yoktur." }
summary:
  ar: "يقول مالك في الرجل يولي من امرأته فيوقف، ثم يطلقها، ثم يراجعها ولا يمسها، فتنقضي أربعة أشهر قبل أن تنقضي عدتها، إنه لا يوقف ولا يقع عليه طلاق، وإنه إن أصابها قبل أن تنقضي عدتها كان أحف بها، وإن مضت عدتها قبل أن يصيبها فلا سبيل له إليها. وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.66}"
  tr: "Malik, karısından cinsel perhiz yemini eden, sonra onu boşayan, sonra onu geri alan ama onunla cinsel ilişkiye girmeyen ve bekleme süresi dolmadan dört ay geçen bir adam hakkında şöyle diyor: Bu adam boşanmış sayılmaz ve boşanma geçerli olmaz. Eğer bekleme süresi dolmadan önce onunla cinsel ilişkiye girerse, bunu yapma yükümlülüğü daha da artar. Eğer bekleme süresi dolmadan önce cinsel ilişkiye girerse, ona karşı hiçbir hakkı kalmaz. Bu konuda duyduğum en iyi görüş budur. {cite:muwatta-maruf-1997 s.66}"
  id: "Malik mengatakan mengenai seorang pria yang bersumpah untuk tidak berhubungan badan dengan istrinya, kemudian menceraikannya, lalu menerimanya kembali tetapi tidak berhubungan badan dengannya, dan empat bulan berlalu sebelum masa iddah istrinya berakhir, maka ia tidak dianggap telah bercerai dan perceraian tidak berlaku. Jika ia berhubungan badan dengan istrinya sebelum masa iddah istrinya berakhir, ia lebih berkewajiban untuk melakukannya. Jika masa iddah istrinya berakhir sebelum ia berhubungan badan dengannya, ia tidak memiliki hak atas istrinya. Ini adalah pendapat terbaik yang pernah saya dengar mengenai masalah ini. {cite:muwatta-maruf-1997 p.66}"
