text: "… أبرأه. آلات المفاصل : يضمّد به مع السفرجل والخلّ على النقرس، ويمنع سيلان الفضول إلى المفاصل. أعضاء الصدر : ماؤه ينفع من أمراض الصدر، وإذا شرب ببزر الرازيانج أغزر اللبن، ويضمّد بدقيقه. وإكليل الملك وقشر الخشخاش لوجع الجنب. أعضاء الغذاء: …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 682، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 682, that mentions illness and the sick, pain, named diseases, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
