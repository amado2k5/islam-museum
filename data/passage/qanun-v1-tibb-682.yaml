text: "… أبرأه. آلات المفاصل : يضمّد به مع السفرجل والخلّ على النقرس، ويمنع سيلان الفضول إلى المفاصل. أعضاء الصدر : ماؤه ينفع من أمراض الصدر، وإذا شرب ببزر الرازيانج أغزر اللبن، ويضمّد بدقيقه. وإكليل الملك وقشر الخشخاش لوجع الجنب. أعضاء الغذاء: …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 682، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 682, that mentions illness and the sick, pain, named diseases, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 682 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 682, que menciona la enfermedad y los enfermos, el dolor, enfermedades específicas, los órganos del cuerpo, la cirugía, la circuncisión y las férulas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 682, qui mentionne la maladie et les malades, la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 682'den bir bölüm; hastalık, hasta, ağrı, hastalıkların isimleri, vücut parçaları, ameliyat, sünnet ve atellerden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 682, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, bagian tubuh, pembedahan, sunat, dan bidai; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
