label: { ar: "سنن النسائي 4579 — الأب والأبوة", en: "Sunan al-Nasa'i 4579 — the father and fatherhood", ur: "سنن نسائی 4579 — باپ اور والدیت", es: "Sunan al-Nasa'i 4579 — El padre y la paternidad" }
text: "… تَوْبَةَ، قَالَ حَدَّثَنَا مُعَاوِيَةُ بْنُ سَلاَّمٍ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ نَهَانَا رَسُولُ اللَّهِ أَنْ نَبِيعَ الْفِضَّةَ بِالْفِضَّةِ إِلاَّ عَيْنًا بِعَيْنٍ سَوَاءً بِسَوَاءٍ وَلاَ نَبِيعَ الذَّهَبَ بِالذَّهَبِ إِلاَّ عَيْنًا بِعَيْنٍ سَوَاءً بِسَوَاءٍ قَالَ رَسُولُ اللَّهِ \" تَبَايَعُوا الذَّهَبَ بِالْفِضَّةِ كَيْفَ شِئْتُمْ وَالْفِضَّةَ بِالذَّهَبِ كَيْفَ شِئْتُمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4579، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4579 (The Book of Financial Transactions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4579، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4579 (El Libro de las Transacciones Financieras), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
