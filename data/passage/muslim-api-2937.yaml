label: { ar: "صحيح مسلم 2937 — ما كُتب على المؤمنين", en: "Sahih Muslim 2937 — what was prescribed for the believers", ur: "صحیح مسلم 2937 — جو مومنوں پر لکھ دیا گیا", fr: "Sahih Muslim 2937 — ce qui a été prescrit aux croyants", es: "Sahih Muslim 2937 — lo que se prescribió a los creyentes" }
text: "… أَحْلِلْ وَلَمْ أَطُفْ بِالْبَيْتِ وَالنَّاسُ يَذْهَبُونَ إِلَى الْحَجِّ الآنَ. فَقَالَ \" إِنَّ هَذَا أَمْرٌ كَتَبَهُ اللَّهُ عَلَى بَنَاتِ آدَمَ فَاغْتَسِلِي ثُمَّ أَهِلِّي بِالْحَجِّ \". فَفَعَلَتْ وَوَقَفَتِ الْمَوَاقِفَ حَتَّى إِذَا طَهَرَتْ طَافَتْ بِالْكَعْبَةِ وَالصَّفَا وَالْمَرْوَةِ ثُمَّ قَالَ \" قَدْ حَلَلْتِ مِنْ حَجِّكِ وَعُمْرَتِكِ جَمِيعًا \". فَقَالَتْ يَا رَسُولَ اللَّهِ إِنِّي أَجِدُ فِي نَفْسِي أَنِّي لَمْ أَطُفْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2937، يرد فيه ذكر ما كُتب على المؤمنين. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 2937 (The Book of Pilgrimage), whose wording mentions what was prescribed for the believers. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 2937، جس کے الفاظ میں جو مومنوں پر لکھ دیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 2937, dont le texte mentionne ce qui a été prescrit aux croyants. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 2937, cuyo texto menciona lo que se prescribió a los creyentes. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
