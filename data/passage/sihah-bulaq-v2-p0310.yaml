text: |-
  .٠⁦(حلم)⁩.
  ٢٧٧
  تقول-نمحكمت الداية حكم وأحكمتها أيضار كانت العرب تتخذها من القدوالابولات
  قصدهم الشجاعة لا الزينة قال زهير
  القائد الخيل منكوباد وابرها • قد أحكوت حكمات القدوالابقا
  يريد قد أحكمت بحسكمات القد وبحكمات الابق فى ذف الباء ويروى محكومة حسكمات القسد
  والابقاعلى النغتين جميعا ويقال أيضاحكمت السفيه وأحكمته اذا أخذت على يده
  قال جرير أبنى حنيفة أحكمواسفهاءكم • انى أخاف عليكم أن أغضبا
  وحكمت الرجل تحكيه ااذا منعته مما أراد ويقال أيضاحكمته فى مالى اذا جعلت
  البه الحمسكم فيه فاحتكم علىّ فى ذلك واحتكموا الى الحاكم وتحاكوابعنى
  والمحاكمة المخاصية الى الحاكم ومحسكم اليامة رجل قتله خالد بن الوليديوم مسيلة
  والحوادج يسمون المحكمة لا نكارهم أمر الحكمين وقولهم لاحكم الاللّٰه والمحكم يفتح
  الكاف الذى فى شعر طرفة هو الشيخ المجوب المنسوب الى الحسكمة وأمّا الذى فى الحديث ان
  الجنة للمحكمين فهم قوم من أصحاب الاخدود حكموا وخير وابين القتل والكفر فاختاروا
  لثبات على الاسلام مع القتل حلم الحلم بالضم مايراه النائم تقول منه حلم بالفتح
  واحتلم وتقول حات بكذا وحلمته أيضاقال
  فلمتها وبنورفيدة دوها * لا يعدن خيالها الحلوم
  والحلم بالكسر الاناة تقول منه حلم الرجل بالضمّ وتحلم تكاف الحلم وقال
  تعلم عن الادنين واستبق ودهم * ولن تستطيع الحلم حتى تحلما
  وتحالم أرى من نفسه ذلك وليس به والحلم بالتحريك أن يفسد الاهاب فى العمل ويقع فيه
  دود فيتنقب تقول منه حلم الاديم بالسكسر وقال
  فانك والكتاب الى على • كدابغة وقد حلم الاديم
  والحلمة رأس الشدى وهما حمتان والحلمة أيضاضرب من النيت قال الاصمعى هى الحلمة
  والينمة وتحلم الصبىّ والضبة أى ممن واكتنز قال أوس
  لمونهم لحو العصافطردنهم * الح سنة جرذانها لم تحلم
  وبعبر حليم أى سمين وقال •من التىّ فى أصلاب كل حليم• والحلمة القراد العظيم وهومثل
  العلّ وجمعها حلم والحلة أيضادودة نقع فى جاد الشاة الاعلى وجلدها الاسة ل هذالفظ
  الاصمعفاذاد بغ لم يزل ذلك الموضع رقيقا يقال منه تعين الجلد وحلم الاديم وحليمات
  بضم الحامموضع وهنّ أكمات ببطن فلج ومحلم فى قول الاعشى
  ونحن غداة العيزيوم فطمة • منعنابى شيبان شرب محلم
  نهر يأخذ من عين هجر قال لبيديصفظعنا ويشبهها بتخيل كرعت فى هذا النهر
  عصب كوارع فى خليج محلم • حلت فنها موقر مكموم
  ومحلم أيضالسم رجل وحلت الرجل تحليما جعلته حليما قال المخبل
  وردّ واصدور الحيل حتى تنهنهت • الى ذى النهى واستبدهو اللمعلم
  بقول أطاعغوا الذى يأمرهم بالحلم والحلام الجدى يؤخذ من بطن أمّه قال الاضمعىّ الخلام
  في
  قوله والمحكم بفتح المكاف الخاف
  القاموس وكحدث فى شعر طرفة
  الشيخ المجرب وغلط الجوهرة
  فى فتح كافه والحكمون من أصحاب
  الاخدوديروى بالفتح والكسر
  اه
