text: "… صَعِيدًا طَيِّبًا كَمَا أَمَرَهُ اللَّهُ. وَسُئِلَ مَالِكٌ عَنْ رَجُلٍ جُنُبٍ أَرَادَ أَنْ يَتَيَمَّمَ فَلَمْ يَجِدْ تُرَابًا إِلاَّ تُرَابَ سَبَخَةٍ هَلْ يَتَيَمَّمُ بِالسِّبَاخِ وَهَلْ تُكْرَهُ الصَّلاَةُ فِي السِّبَاخِ قَالَ مَالِكٌ لاَ بَأْسَ بِالصَّلاَةِ فِي السِّبَاخِ وَالتَّيَمُّمِ مِنْهَا لأَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى قَالَ {فَتَيَمَّمُوا صَعِيدًا طَيِّبًا} فَكُلُّ مَا كَانَ صَعِيدًا فَهُوَ يُتَيَمَّمُ بِهِ سِبَاخًا كَانَ أَوْ غَيْرَهُ."
summary:
  ar: "حديث في موطأ مالك، رقم 123، يرد فيه ذكر ما لا بأس به، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 123 (Purity), whose wording mentions what is said to be no harm, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 123، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 123, dont le texte mentionne ce qui est dit sans inconvénient, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 123, cuyo texto menciona lo que se dice que no tiene inconveniente, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
