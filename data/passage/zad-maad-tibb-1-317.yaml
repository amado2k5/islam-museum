text: "… فسر السام بالسآمة، وهي الملالة وسآمة الدين، قالوا : وعلى هذا فالوجه حذف الواو ولا بدَّ، ولكن هذا خلافُ المعروف من هذه اللفظة في اللغة، ولهذا جاء في الحديث إِنّ الحَبَّةَ السَّوْدَاءَ شِفَاءً مِنْ كُلُّ دَاءٍ إِلَّا السَّامَ البخاري:، ومسلم: …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 317، يذكر الحبة السوداء، والداء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 317, that mentions the black seed, the disease and its remedy, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 317 کا اقتباس جس میں کلونجی، بیماری، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 317, que menciona la semilla negra, la enfermedad y su remedio, la curación; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
