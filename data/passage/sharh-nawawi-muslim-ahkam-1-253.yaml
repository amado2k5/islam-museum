text: "… الرافضة عن العلماء فقالوا: الواجب في الرجلين قطع بعض الذراع وجب غسل باقيه واللّه أعلم. اتفق كل من نقل وضوء رسول اللّه،، على أنه غسلهما. وأجمعوا على لا يقدر عليها غيره والمراد بالغفران الصغائر دون الكبائر. وفيه استحباب وجوب مسح …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 253، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف، والمستحب، وصغائر الذنوب، وما يُكفَّر باجتناب الكبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 253, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed, the recommended (mustahabb), the minor sins, what is expiated when the major sins are avoided; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 253 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے، مستحب، صغیرہ گناہ، جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on Sahih Muslim de al-Nawawi, volume numérisé 1, p. 253, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable, le recommandé (mustahabb), les péchés mineurs, ce qui est expié quand les grands péchés sont évités ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on Sahih Muslim de al-Nawawi, volumen digitalizado 1, p. 253, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo que obliga a la persona responsable, lo recomendado (mustahabb), los pecados menores, lo que se expía cuando se evitan los pecados mayores; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 253. sayfasından bir alıntı, farz olan amelleri, sorumlu bir kişiden beklenenleri, tavsiye edilen amelleri, küçük günahları ve büyük günahlardan kaçınmanın neleri telafi ettiğini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan amelleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları incelemeye uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 253, membahas tentang amalan wajib, apa yang dituntut dari orang yang bertanggung jawab, amalan yang dianjurkan, dosa-dosa kecil, dan apa yang dapat ditebus dengan menghindari dosa-dosa besar. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
