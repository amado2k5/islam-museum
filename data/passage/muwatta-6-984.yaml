summary:
  ar: "قول لمالك: من اعتمر في شوال أو ذي القعدة أو ذي الحجة، ثم رجع إلى أهله ثم حج من عامه ذلك، فليس عليه هدي، إنما الهدي على من اعتمر في أشهر الحج ثم أقام حتى الحج ثم حج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1116). {cite:muwatta-maruf-1997 p.464}"
