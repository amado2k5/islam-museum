label: { ar: "الموطأ 984 — مالك: من اعتمر في شوال أو ذي القعدة أو ذي الحجة ثم رجع إلى أهله ثم حج من عامه فليس عليه هدي؛ إنما الهدي على من اعتمر في أشهر الحج ثم أقام حتى الحج", en: "Muwatta 984", es: "Muwatta 984", fr: "Muwatta 984", ur: "موطا 984", tr: "El-Muvatta 984 — Malik: Şevval, Zilhicce veya Zilhicce aylarında Umre yapan, sonra ailesinin yanına dönen ve aynı yıl içinde Hac yapan kimsenin kurban kesmesi gerekmez; kurban ancak Hac aylarında Umre yapıp Hac'a kadar kalan kimseden istenir.", id: "Al-Muwatta 984 — Malik: Barang siapa yang melaksanakan Umrah pada bulan Syawal, Dzul Qi'dah, atau Dzul Hijjah, kemudian kembali kepada keluarganya dan kemudian melaksanakan Haji pada tahun yang sama, tidak diwajibkan untuk mempersembahkan hewan kurban; hewan kurban hanya diwajibkan bagi orang yang melaksanakan Umrah pada bulan-bulan Haji dan kemudian tinggal sampai waktu Haji tiba." }
summary:
  ar: "قول لمالك: من اعتمر في شوال أو ذي القعدة أو ذي الحجة، ثم رجع إلى أهله ثم حج من عامه ذلك، فليس عليه هدي، إنما الهدي على من اعتمر في أشهر الحج ثم أقام حتى الحج ثم حج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1116). {cite:muwatta-maruf-1997 p.464}"
  tr: "Malik şöyle demiştir: Şevval, Zilhicce veya Zilhicce aylarında Umre yapan, sonra ailesinin yanına dönen ve aynı yıl içinde Hac yapan kimsenin kurban kesmesi gerekmez. Kurban, ancak Hac aylarında Umre yapan, Hac'a kadar kalan ve sonra Hac yapan kimseden istenir. Araştırmacı, bunun Malik'ten Ebu Musab (1116) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.464}"
  id: "Malik berkata: Barang siapa yang melaksanakan Umrah pada bulan Syawal, Dzul Qi'dah, atau Dzul Hijjah, kemudian kembali kepada keluarganya dan kemudian melaksanakan Haji pada tahun yang sama, tidak diwajibkan untuk mempersembahkan hewan kurban. Hewan kurban hanya diwajibkan bagi orang yang melaksanakan Umrah pada bulan-bulan Haji, kemudian tinggal hingga Haji, dan kemudian melaksanakan Haji. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1116). {cite:muwatta-maruf-1997 p.464}"
