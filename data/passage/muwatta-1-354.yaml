summary:
  ar: "قول لمالك في باب إعادة الصلاة مع الإمام: لا يرى بأساً أن يصلي مع الإمام من كان قد صلى في بيته، إلا صلاة المغرب فإنه إذا أعادها صارت شفعاً. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.195}"
