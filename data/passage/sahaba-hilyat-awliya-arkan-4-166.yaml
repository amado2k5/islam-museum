text: "… قسم بينكم أرزاقكم، وإن اللّٰه يعطى الدنيا من يحب ومن لا يحب، ولا يعطى الدين إلا من أحب. فمن أعطاه اللّٰه الدين فقد أحبه، والذى نفسى بيده لا يسلم عبد حتى يسلم قلبه ولسانه، ولا يؤمن عبد حتى يأمن جاره …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 166، يذكر ما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 166, that mentions what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 4، ص 166 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 4, pág. 166, que menciona aquello sin lo cual la fe no está completa; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 4, page 166, mentionnant ce sans quoi la foi est incomplète; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 4. resimli cildinin 166. sayfasından bir alıntı, imanın tamamlanması için gerekli olan hususları belirtmektedir; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 4, halaman 166, menyebutkan apa yang penting untuk penyempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
