text: "… وارأف يخلفى من أن أوصيك ولكن فيما يتعلق بدولتك سالم الروم ما سالموك واقنع من الحمدانية بالدعوة والسكة ولا تبق على الفرج بن دغفل الخراج متى اسكنت فيه الفرصة. ثم توفى فأمر صاحب مصر أن يدفن فى قصره فى قبة …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 4، ص 160، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 4, p. 160, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 4، ص 160 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen 4, pág. 160, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Muntazam d'Ibn al-Jawzi (tome 4, p. 160) mentionnant un testament ou des dernières volontés, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin resimli 4. cildinin 160. sayfasında vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, jilid 4 bergambar, halaman 160, menyebutkan surat wasiat atau testamen terakhir, pemakaman, kuburan, dan makam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritance, Antiquities, and Tombs Browser."
