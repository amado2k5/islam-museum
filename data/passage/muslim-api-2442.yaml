label: { ar: "صحيح مسلم 2442 — الأب والأبوة", en: "Sahih Muslim 2442 — the father and fatherhood", ur: "صحیح مسلم 2442 — باپ اور والدیت", es: "Sahih Muslim 2442 — El padre y la paternidad", fr: "Sahih Muslim 2442 — Le père et la paternité", tr: "Sahih Muslim 2442 — Baba ve Babalık", id: "Sahih Muslim 2442 — Ayah dan Peran Ayah" }
text: "… اللَّهِ بْنُ مُعَاذٍ، وَحَامِدُ بْنُ عُمَرَ، وَمُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ ابْنُ مُعَاذٍ حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، قَالَ حَدَّثَنِي السُّمَيْطُ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ افْتَتَحْنَا مَكَّةَ ثُمَّ إِنَّا غَزَوْنَا حُنَيْنًا فَجَاءَ الْمُشْرِكُونَ بِأَحْسَنِ صُفُوفٍ رَأَيْتُ - قَالَ - فَصُفَّتِ الْخَيْلُ ثُمَّ صُفَّتِ الْمُقَاتِلَةُ ثُمَّ صُفَّتِ النِّسَاءُ مِنْ وَرَاءِ ذَلِكَ ثُمَّ صُفَّتِ الْغَنَمُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2442، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2442 (The Book of Zakat), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2442، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2442 (El Libro del Zakat), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2442 (Le Livre de la Zakat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 2442 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2442, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
