label: { ar: "الموطأ 1062 — ابن عمر: كان إذا أحرم من مكة لم يطف بالبيت ولا بين الصفا والمروة حتى يرجع من منى، ولم يرمل إذا طاف حول البيت", en: "Muwatta 1062" }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان إذا أحرم من مكة لم يطف بالبيت ولا بين الصفا والمروة حتى يرجع من منى، وكان لا يرمل إذا طاف حول البيت إذا أحرم من مكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1304) وسويد (553) والشيباني (520). {cite:muwatta-maruf-1997 p.490}"
