label: { ar: "الموطأ 1062 — ابن عمر: كان إذا أحرم من مكة لم يطف بالبيت ولا بين الصفا والمروة حتى يرجع من منى، ولم يرمل إذا طاف حول البيت", en: "Muwatta 1062", es: "Muwatta 1062", fr: "Muwatta 1062", ur: "موطا 1062", tr: "El-Muvatta 1062 — İbn Ömer: Mekke'den ihram haline girdiğinde, Mina'dan dönene kadar Kâbe'nin etrafında tavaf yapmaz, Safa ile Merve arasında sa'y yapmaz ve Kâbe'nin tavafında ramel yapmazdı.", id: "Al-Muwatta 1062 — Ibn Umar: Ketika beliau memasuki keadaan ihram dari Mekah, beliau tidak melakukan tawaf mengelilingi Ka'bah atau sa'i antara Safa dan Marwa sampai beliau kembali dari Mina, dan beliau tidak melakukan ramal ketika beliau melakukan tawaf mengelilingi Ka'bah." }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان إذا أحرم من مكة لم يطف بالبيت ولا بين الصفا والمروة حتى يرجع من منى، وكان لا يرمل إذا طاف حول البيت إذا أحرم من مكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1304) وسويد (553) والشيباني (520). {cite:muwatta-maruf-1997 p.490}"
  tr: "Malik, Nafi'den rivayet ettiğine göre, Abdullah ibn Umar, Mekke'den ihrama girdiğinde, Mina'dan dönene kadar Kâbe'nin etrafında tavaf yapmaz ve Safa ile Merve arasında sa'y yapmazdı. Ayrıca, Mekke'den ihrama girdikten sonra Kâbe'nin etrafında hızlı yürüyüş (ramal) yapmazdı. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1304), Suveyd (553) ve el-Şeybani (520) tarafından nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.490}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar, ketika memasuki ihram dari Mekah, tidak melakukan tawaf mengelilingi Ka'bah maupun sa’i antara Safa dan Marwa sampai ia kembali dari Mina. Ia juga tidak melakukan ramal (berjalan cepat) ketika melakukan tawaf mengelilingi Ka'bah setelah memasuki ihram dari Mekah. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus’ab (1304), Suwaid (553), dan al-Shaybani (520). {cite:muwatta-maruf-1997 p.490}"
