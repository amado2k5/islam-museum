label: { ar: "صحيح البخاري 4223 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4223 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4223 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4223 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنِي إِسْحَاقُ، حَدَّثَنَا عَبْدُ الصَّمَدِ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا عَدِيُّ بْنُ ثَابِتٍ، سَمِعْتُ الْبَرَاءَ، وَابْنَ أَبِي أَوْفَى، يُحَدِّثَانِ عَنِ النَّبِيِّ أَنَّهُ قَالَ يَوْمَ خَيْبَرَ وَقَدْ نَصَبُوا الْقُدُورَ أَكْفِئُوا الْقُدُورَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4223، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4223, with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4223، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4223, menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
