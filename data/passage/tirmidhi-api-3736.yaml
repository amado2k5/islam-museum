label: { ar: "جامع الترمذي 3736 — وصية أو عهد أخير", en: "Jami' al-Tirmidhi 3736 — a testament or parting counsel", ur: "جامع ترمذی 3736 — وصیت یا آخری نصیحت", es: "Jami' al-Tirmidhi 3736 — un testamento o consejo de despedida", fr: "Jami' al-Tirmidhi 3736 — un testament ou un conseil d'adieu" }
text: "… عِيسَى الرَّمْلِيُّ قَالَ حَدَّثَنَا يَحْيَى بْنُ عِيسَى الرَّمْلِيُّ، عَنِ الأَعْمَشِ، عَنْ عَدِيِّ بْنِ ثَابِتٍ، عَنْ زِرِّ بْنِ حُبَيْشٍ، عَنْ عَلِيٍّ، قَالَ لَقَدْ عَهِدَ إِلَىَّ النَّبِيُّ الأُمِّيُّ \" أَنَّهُ لاَ يُحِبُّكَ إِلاَّ مُؤْمِنٌ وَلاَ يَبْغَضُكَ إِلاَّ مُنَافِقٌ \". قَالَ عَدِيُّ بْنُ ثَابِتٍ أَنَا مِنَ الْقَرْنِ الَّذِينَ دَعَا لَهُمُ النَّبِيُّ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3736، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3736 (Chapters on Virtues), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3736، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3736 (Capítulos sobre las virtudes), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3736 (Chapitres sur les vertus), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
