text: "أَبْلُعُ السيف مَا كَفَاني السَّوْطُ، ولا أبْلُعُ السَّوْطَ مَا آباءٍ، ثم قال: من بني خنساءَ، ولم يذكر بني خنساء عُتْبَةُ بنُ أسِيد بن جَارِية البحر، واجتمع إليه كل من فَرّ من المشركين فضيقوا على قريش وقطعوا الطريق عليهم، فكتب الكفار …"
summary:
