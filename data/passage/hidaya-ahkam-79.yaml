text: "… نهيٌّ صريحٌ في السنة النبوية، لكنه لم يذكره، وقد بيَّنتُه في الحاشية، ولله الحمد. وهذه المسائل الأربع التي سلك فيها هذا المنهج هي : - مسألة الصلاة نافلةً بعد سنة الفجر قبل الفرض. - مسألة الزيادة في صلاة النافلة في …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 79، يرد فيه ذكر الفرض، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Marghinani's al-Hidaya, p. 79, whose wording mentions the obligatory (fard), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ہدایہ، مرغینانی، ص 79 کا اقتباس جس میں فرض، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Hidaya de al-Marghinani, p. 79, dont le texte mentionne l'obligatoire (fard), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Hidaya de al-Marghinani, p. 79, cuyo texto menciona lo obligatorio (fard), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Marghinani'nin El-Hidaye adlı eserinin 79. sayfasından bir alıntı, farz olan ameller, nafile ameller ve gönüllü ameller hakkında bilgi vermektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu alıntı, farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Hidayah karya Al-Marghinani, halaman 79, menyebutkan amalan wajib, amalan sunnah, dan amalan sukarela; dari versi pindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks tersebut disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
