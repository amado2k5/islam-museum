label: { ar: "جامع الترمذي 3953 — الأب والأبوة", en: "Jami' al-Tirmidhi 3953 — the father and fatherhood", ur: "جامع ترمذی 3953 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3953 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3953 — le père et la paternité", tr: "Cami' el-Tirmizi 3953 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3953 — Ayah dan Peran Ayah" }
text: "… \" اللَّهُمَّ بَارِكْ لَنَا فِي شَامِنَا وَبَارِكْ لَنَا فِي يَمَنِنَا \". قَالُوا وَفِي نَجْدِنَا. قَالَ \" هُنَالِكَ الزَّلاَزِلُ وَالْفِتَنُ وَبِهَا أَوْ قَالَ مِنْهَا يَخْرُجُ قَرْنُ الشَّيْطَانِ \". هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ مِنْ حَدِيثِ ابْنِ عَوْنٍ. وَقَدْ رُوِيَ هَذَا الْحَدِيثُ أَيْضًا عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ بْنِ عُمَرَ عَنْ أَبِيهِ عَنِ النَّبِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3953، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3953 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3953، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3953 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3953 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de yer alan 3953 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı bu hadisi Kur'an, Sünnet, biyografi ve konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3953, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang subjek tersebut."
