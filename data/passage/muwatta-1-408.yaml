label: { ar: "الموطأ 408 — ابن عمر لا يتنفل في السفر إلا من جوف الليل", en: "Muwatta 408", es: "Muwatta 408", fr: "Muwatta 408", ur: "موطا 408", tr: "El-Muvatta 408 — İbn Ömer, gece yarısı hariç, yolculuk halindeyken nafile namaz kılmaz.", id: "Al-Muwatta 408 — Ibnu Umar tidak melaksanakan salat sunnah saat bepergian kecuali di tengah malam." }
summary:
  ar: "أول أثر في باب صلاة النافلة في السفر بالنهار والليل والصلاة على الدابة. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر أنه لم يكن يصلي مع الفريضة في السفر شيئاً قبلها ولا بعدها إلا من جوف الليل، فإنه كان يصلي على الأرض وعلى راحلته حيث توجهت. ويبين المحقق أن لفظة «والليل» في عنوان الباب من رواية ابن وضاح عن يحيى وليست في رواية عبيد الله عن أبيه، ويذكر أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.214}"
  tr: "Yolculuk halindeyken, gece gündüz ve hayvan üzerinde kılınan nafile namazlar hakkındaki bölümün ilk rivayeti, Yahya'nın Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan naklettiği bir rivayettir. Abdullah ibn Umar, yolculuk halindeyken farz namazlardan önce veya sonra hiçbir namaz kılmadığını, sadece gece namazı kıldığını söylemiştir. Yerde veya bineğinde, hangi yöne bakarsa baksın namaz kılardı. Editör, bölüm başlığındaki \"ve gece\" ifadesinin İbn Waddah'ın Yahya'dan rivayetinden olduğunu, Ubaydullah'ın babasından rivayetinden olmadığını açıklığa kavuşturmaktadır. Ayrıca, bu rivayetin Malik'ten Ebu Mus'ab, Suwayd, Muhammed ibn al-Hasan ve Yahya ibn Bukayr tarafından nakledildiğini de belirtmektedir. {cite:muwatta-maruf-1997 s.214}"
  id: "Riwayat pertama dalam bab tentang salat sunnah saat bepergian, siang dan malam, dan salat di atas hewan, diriwayatkan oleh Yahya dari Malik, dari Nafi', dari Abdullah ibn Umar, yang mengatakan bahwa ia tidak melakukan salat apa pun sebelum atau sesudah salat wajib saat bepergian, kecuali pada malam hari. Ia salat di tanah atau di atas kendaraannya, ke mana pun kendaraan itu menghadap. Editor mengklarifikasi bahwa frasa \"dan malam\" dalam judul bab berasal dari riwayat Ibn Waddah dari Yahya, dan bukan dari riwayat Ubaydullah dari ayahnya. Ia juga menyebutkan bahwa riwayat tersebut diwariskan dari Malik oleh Abu Mus'ab, Suwayd, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.214}"
