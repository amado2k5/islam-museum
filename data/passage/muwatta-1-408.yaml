label: { ar: "الموطأ 408 — ابن عمر لا يتنفل في السفر إلا من جوف الليل", en: "Muwatta 408" }
summary:
  ar: "أول أثر في باب صلاة النافلة في السفر بالنهار والليل والصلاة على الدابة. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر أنه لم يكن يصلي مع الفريضة في السفر شيئاً قبلها ولا بعدها إلا من جوف الليل، فإنه كان يصلي على الأرض وعلى راحلته حيث توجهت. ويبين المحقق أن لفظة «والليل» في عنوان الباب من رواية ابن وضاح عن يحيى وليست في رواية عبيد الله عن أبيه، ويذكر أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.214}"
