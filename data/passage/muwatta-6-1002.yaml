label: { ar: "الموطأ 1002 — سليمان بن يسار: احتجم رسول الله وهو محرم، فوق رأسه، وهو يومئذ بلحي جمل، مكان بطريق مكة", en: "Muwatta 1002" }
summary:
  ar: "أول حديث في باب حجامة المحرم. يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار، أن رسول الله احتجم وهو محرم، فوق رأسه، وهو يومئذ بلحي جمل، مكان بطريق مكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1182) وسويد وغيرهم. {cite:muwatta-maruf-1997 p.469} {cite:muwatta-maruf-1997 p.470}"
