summary:
  ar: "القسم 3 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحيض»، ويضم فيها النصوص من 679 إلى 836 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 3 of Sahih Muslim (The Book of Menstruation) in the division of the open hadith dataset the museum took its reports from: reports 679 to 836 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 3، عنوان «کتاب الحیض»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 679 تا 836۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 3 de Sahih Muslim (El Libro de la Menstruación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 679 al 836 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses données du Sahih Muslim (Livre des menstruations), volume 3, dans la base de données ouverte des hadiths: les hadiths 679 à 836 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 3. bölümü \"Adet Kitabı\" başlığını taşımakta olup, 679'dan 836'ya kadar olan hadisleri sırasıyla numaralandırmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 3 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Haid\" dan berisi hadits 679 hingga 836, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
