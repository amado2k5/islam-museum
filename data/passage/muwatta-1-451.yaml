label: { ar: "الموطأ 451 — أبو بكر يؤم ثم يتأخر للنبي: من نابه شيء في صلاته فليسبح", en: "Muwatta 451" }
text: "ما لي رأيتكم أكثرتم من التصفيح؟ من نابه شيء في صلاته فليسبح، فإنه إذا سبح التفت إليه، وإنما التصفيح للنساء"
summary:
  ar: "أول حديث في باب الالتفات والتصفيق عند الحاجة في الصلاة. يرويه يحيى عن مالك عن أبي حازم سلمة بن دينار عن سهل بن سعد الساعدي: ذهب النبي إلى بني عمرو بن عوف ليصلح بينهم، وحانت الصلاة فسأل المؤذن أبا بكر أن يصلي بالناس فصلى، فجاء النبي والناس في الصلاة فتخلص حتى وقف في الصف، فصفّق الناس، وكان أبو بكر لا يلتفت في صلاته، فلما أكثروا التفت فرأى النبي فأشار إليه أن امكث مكانك، فرفع أبو بكر يديه فحمد الله ثم استأخر حتى استوى في الصف وتقدم النبي فصلى. فلما انصرف سأل أبا بكر ما منعه أن يثبت، فقال إنه ما كان لابن أبي قحافة أن يصلي بين يدي رسول الله، ثم أنكر النبي على الناس كثرة التصفيق وقال إن من نابه شيء في صلاته فليسبح، وإنما التصفيق للنساء. ويفسر المحقق التصفيح بالتصفيق، ويخرّج الحديث عند البخاري (684) ومسلم (2/25) وأبي داود (940) وابن خزيمة وابن حبان وأحمد والشافعي والطبراني من طرق أصحاب مالك، ويحيل على التمهيد (21/100). {cite:muwatta-maruf-1997 p.231} {cite:muwatta-maruf-1997 p.232}"
