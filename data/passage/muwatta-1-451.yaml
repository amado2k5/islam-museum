label: { ar: "الموطأ 451 — أبو بكر يؤم ثم يتأخر للنبي: من نابه شيء في صلاته فليسبح", en: "Muwatta 451", es: "Muwatta 451", fr: "Muwatta 451", ur: "موطا 451", tr: "El-Muvatta 451 — Ebu Bekir namazı kıldırdıktan sonra Peygamber için geri çekilir: Namaz sırasında bir şey yaşayan herkes \"Sübhanallah\" (Allah'a hamd olsun) demelidir." }
text: "ما لي رأيتكم أكثرتم من التصفيح؟ من نابه شيء في صلاته فليسبح، فإنه إذا سبح التفت إليه، وإنما التصفيح للنساء"
summary:
  ar: "أول حديث في باب الالتفات والتصفيق عند الحاجة في الصلاة. يرويه يحيى عن مالك عن أبي حازم سلمة بن دينار عن سهل بن سعد الساعدي: ذهب النبي إلى بني عمرو بن عوف ليصلح بينهم، وحانت الصلاة فسأل المؤذن أبا بكر أن يصلي بالناس فصلى، فجاء النبي والناس في الصلاة فتخلص حتى وقف في الصف، فصفّق الناس، وكان أبو بكر لا يلتفت في صلاته، فلما أكثروا التفت فرأى النبي فأشار إليه أن امكث مكانك، فرفع أبو بكر يديه فحمد الله ثم استأخر حتى استوى في الصف وتقدم النبي فصلى. فلما انصرف سأل أبا بكر ما منعه أن يثبت، فقال إنه ما كان لابن أبي قحافة أن يصلي بين يدي رسول الله، ثم أنكر النبي على الناس كثرة التصفيق وقال إن من نابه شيء في صلاته فليسبح، وإنما التصفيق للنساء. ويفسر المحقق التصفيح بالتصفيق، ويخرّج الحديث عند البخاري (684) ومسلم (2/25) وأبي داود (940) وابن خزيمة وابن حبان وأحمد والشافعي والطبراني من طرق أصحاب مالك، ويحيل على التمهيد (21/100). {cite:muwatta-maruf-1997 p.231} {cite:muwatta-maruf-1997 p.232}"
  tr: "Namazda gerektiğinde dönüp alkışlama ile ilgili ilk hadis. Yahya, Malik'ten, o da Ebu Hazim Salama ibn Dinar'dan, o da Sahl ibn Sa'd el-Sa'idi'den rivayet etmiştir: Peygamberimiz, Beni Amr ibn Awf kabilesini barıştırmak için oraya gitti. Namaz vakti gelince müezzin, Ebu Bekir'den cemaate namaz kıldırmasını istedi ve o da öyle yaptı. Peygamberimiz, cemaat namaz kılarken oraya geldi ve safa geçti. Cemaat alkışladı ve namazda genellikle başını çevirmeyen Ebu Bekir, sonunda döndü ve Peygamberimizi gördü. Peygamberimiz ona olduğu yerde kalmasını işaret etti. Ebu Bekir ellerini kaldırdı, Allah'a hamd etti ve sonra safa geçene kadar geriye çekildi ve Peygamberimiz namazı kıldırmak için öne çıktı. Peygamberimiz namazı bitirdiğinde, Ebu Bekir'e neden yerinde durmadığını sordu. Ebu Bekir, Ebu Kuhafa'nın oğlunun Allah Resulü'nün önünde namaz kıldırmasının uygun olmadığını söyledi. Bunun üzerine Peygamber, insanların aşırı alkışlamalarını hoş karşılamadı ve namaz sırasında birine bir şey olursa \"Sübhanallah\" (Allah'a hamd olsun) demeleri gerektiğini, alkışlamanın ise sadece kadınlara özgü olduğunu söyledi. Araştırmacı, \"tafeeh\" kelimesini alkış olarak yorumluyor ve hadisi Buhari (684), Müslim (2/25), Ebu Davud (940), İbn Huzeyme, İbn Hibban, Ahmed, Şafiî ve Taberani'den, Malik'in sahabelerinin rivayet zincirleri aracılığıyla aktarıyor ve Temhid'e (21/100) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.231} {cite:muwatta-maruf-1997 s.232}"
  id: "Hadits pertama tentang menoleh dan bertepuk tangan bila perlu selama salat. Diriwayatkan oleh Yahya dari Malik, dari Abu Hazim Salama ibn Dinar, dari Sahl ibn Sa'd al-Sa'idi: Nabi pergi ke suku Banu Amr ibn Awf untuk mendamaikan mereka. Ketika waktu salat tiba, muazin meminta Abu Bakr untuk memimpin salat, maka beliau melakukannya. Nabi tiba ketika orang-orang sedang salat dan berjalan menuju barisan. Orang-orang bertepuk tangan, dan Abu Bakr, yang biasanya tidak menoleh selama salat, akhirnya menoleh dan melihat Nabi. Nabi memberi isyarat agar dia tetap di tempatnya. Abu Bakr mengangkat tangannya, memuji Allah, lalu mundur hingga berada di barisan, dan Nabi maju untuk memimpin salat. Setelah Nabi selesai, beliau bertanya kepada Abu Bakr apa yang mencegahnya untuk tetap diam. Abu Bakr menjawab bahwa tidak pantas bagi putra Abu Quhafa untuk memimpin salat di depan Rasulullah. Kemudian Nabi tidak menyetujui tepuk tangan berlebihan yang dilakukan orang-orang dan mengatakan bahwa jika sesuatu terjadi pada seseorang selama shalatnya, mereka harus mengucapkan \"Subhan Allah\" (Maha Suci Allah), dan tepuk tangan hanya untuk wanita. Peneliti menafsirkan \"tafeeh\" sebagai tepuk tangan, dan mengutip hadits dari al-Bukhari (684), Muslim (2/25), Abu Dawud (940), Ibn Khuzaymah, Ibn Hibban, Ahmad, al-Shafi'i, dan al-Tabarani melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (21/100). {cite:muwatta-maruf-1997 p.231} {cite:muwatta-maruf-1997 p.232}"
