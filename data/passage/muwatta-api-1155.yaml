label: { ar: "موطأ مالك 1155 — الحرام", en: "Muwatta Malik 1155 — the unlawful", ur: "موطأ مالک 1155 — حرام", es: "Muwatta Malik 1155: lo ilegal" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ عَلِيَّ بْنَ أَبِي طَالِبٍ، كَانَ يَقُولُ فِي الرَّجُلِ يَقُولُ لاِمْرَأَتِهِ أَنْتِ عَلَىَّ حَرَامٌ إِنَّهَا ثَلاَثُ تَطْلِيقَاتٍ. قَالَ مَالِكُ وَذَلِكَ أَحْسَنُ مَا سَمِعْتُ فِي ذَلِكَ."
summary:
  ar: "حديث في موطأ مالك، رقم 1155، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1155 (Divorce), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1155، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1155 (Divorcio), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
