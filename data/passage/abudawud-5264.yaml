summary:
  ar: "في كتاب الأدب؛ عن أبي هريرة عن النبي في قتل الوزغة: في أول ضربة سبعين حسنة — تفسير رواية التدريج بعدد محدد."
  en: "In the Book of General Behaviour, from Abu Hurayra on killing the gecko: at the first stroke, seventy good deeds — naming the graded reward's number."
  ur: "کتاب ادب میں ابو ہریرہ سے وزغہ مارنے کے بارے میں: پہلی ضربت پر ستر نیکیاں — مخصوص عدد کے ساتھ۔"
  es: "En el Libro de Comportamiento General, de Abu Hurayra sobre matar al gecko: al primer golpe, setenta buenas acciones — nombrando el número de la recompensa gradual."
  fr: "Dans le Livre du Comportement Général, d'après Abu Hurayra sur la mise à mort du gecko: au premier coup, soixante-dix bonnes actions — en indiquant le nombre de récompenses graduées."
  tr: "Ebu Hurayra'dan, o da Peygamberimizden rivayet ettiği üzere, bir kertenkeleyi öldürmekle ilgili olarak edebi bir kitapta şöyle denmektedir: \"İlk vuruş için yetmiş sevap\" - bu, belirli bir sayı ile aşamalandırma rivayetinin açıklamasıdır."
  id: "Dalam kitab sastra, berdasarkan riwayat Abu Hurairah, berdasarkan riwayat Nabi, mengenai membunuh cicak: “Untuk serangan pertama, tujuh puluh amal kebaikan” — penjelasan riwayat gradualisme dengan angka tertentu."
