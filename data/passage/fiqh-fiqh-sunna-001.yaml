text: "١٧٣ أي أن الله كما أحل الطيبات ،. وطعام الذين أوتوا الكتاب من اليهود والنصارى ، أحل زواج العفيفات من المؤمنات ، والعفيفات من أهل الكتاب ، في حال كون الأزواج أعفاء غير مسافحين ولا متخذي أخدان . ٢ -"
