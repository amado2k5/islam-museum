text: "كان يحتجم وهو صائم، ثم ترك ذلك بعد، فكان إذا صام لم يحتجم حتى يفطر"
summary:
  ar: "أول حديث في باب حجامة الصائم. يرويه مالك عن نافع عن عبد الله بن عمر أنه كان يحتجم وهو صائم، ثم ترك ذلك بعد، فكان إذا صام لم يحتجم حتى يفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (355)، وأن الشافعي رواه دون قوله «ثم ترك ذلك». {cite:muwatta-maruf-1997 p.401}"
