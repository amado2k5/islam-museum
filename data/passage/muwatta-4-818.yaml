label: { ar: "الموطأ 818 — ابن عمر: كان يحتجم وهو صائم، ثم ترك ذلك بعد، فكان إذا صام لم يحتجم حتى يفطر", en: "Muwatta 818", es: "Muwatta 818", fr: "Muwatta 818", ur: "موطا 818", tr: "El-Muvatta 818 — İbn Ömer: Oruçluyken hacamat yaptırırdı, sonra bunu bıraktı; yani oruçluyken orucunu açana kadar hacamat yaptırmazdı.", id: "Al-Muwatta 818 — Ibn Umar: Beliau biasa melakukan bekam saat berpuasa, kemudian beliau berhenti melakukannya setelah berpuasa, sehingga ketika berpuasa beliau tidak melakukan bekam sampai beliau berbuka puasa." }
text: "كان يحتجم وهو صائم، ثم ترك ذلك بعد، فكان إذا صام لم يحتجم حتى يفطر"
summary:
  ar: "أول حديث في باب حجامة الصائم. يرويه مالك عن نافع عن عبد الله بن عمر أنه كان يحتجم وهو صائم، ثم ترك ذلك بعد، فكان إذا صام لم يحتجم حتى يفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (355)، وأن الشافعي رواه دون قوله «ثم ترك ذلك». {cite:muwatta-maruf-1997 p.401}"
  tr: "Oruçluyken hacamat yaptırma konusuyla ilgili ilk hadis. Malik'in Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Abdullah ibn Umar oruçluyken hacamat yaptırırdı, sonra bunu bıraktı. Yani oruçluyken, orucunu açana kadar hacamat yaptırmazdı. Editör, bunun Malik'ten Ebu Mus'ab, Suwaid ve Muhammed ibn al-Hasan al-Şeybani (355) tarafından rivayet edildiğini ve Şafiî'nin ise \"sonra bunu bıraktı\" ifadesi olmadan rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.401}"
  id: "Hadits pertama tentang bekam saat berpuasa. Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar bahwa beliau biasa melakukan bekam saat berpuasa, kemudian beliau berhenti melakukannya. Maka ketika berpuasa, beliau tidak melakukan bekam sampai berbuka puasa. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan al-Shaybani (355), dan bahwa al-Shafi’i meriwayatkannya tanpa frasa “kemudian beliau berhenti melakukannya.” {cite:muwatta-maruf-1997 p.401}"
