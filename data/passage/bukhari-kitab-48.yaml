summary:
  ar: "القسم 48 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرهن»، ويضم فيها النصوص من 2508 إلى 2515 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 48 of Sahih al-Bukhari (Mortgaging) in the division of the open hadith dataset the museum took its reports from: reports 2508 to 2515 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 48، عنوان «کتاب الرہن»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2508 تا 2515۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 48 de Sahih al-Bukhari (Hipotecas) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2508 a 2515 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 48 du Sahih al-Bukhari (Hypothèque), dans la section du recueil ouvert: les hadiths 2508 à 2515 de cette section. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 48. bölümü \"Yemin Kitabı\" başlığını taşımakta olup, 2508 ile 2515 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 48 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sumpah\" dan berisi teks 2508 hingga 2515, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
