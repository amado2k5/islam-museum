label: { ar: "نوادر جحا الكبرى، ص 51 — «أنظروا كيف يركض قبل أن نضع زفتا\")»", en: "Nawadir Juha al-Kubra, p. 51 — 'Look How He Runs Before We Put the Tar On'", ur: "نوادر جحا الکبریٰ، ص 51 — «دیکھو یہ کیسے دوڑتا ہے، ابھی ہم نے تارکول نہیں لگایا»", fr: "Nawadir Juha al-Kubra, p. 51 — « Regardez comme il court avant même que nous mettions le goudron »", es: "Nawadir Juha al-Kubra, p. 51 — «Miren cómo corre antes de que le pongamos la brea»", tr: "Juha'nın Muhteşem Fıkraları, s. 51 — “Daha zifti döşemeden nasıl da koşuyor bakın!”", id: "Anekdot Hebat Juha, hlm. 51 — “Lihat bagaimana dia berlari bahkan sebelum kita memasang aspal!”" }
text: "… أنظروا كيف يركض قبل أن نضع زفتاً جاء يوماً إلى مكان تصليح السفن وكانوا قد أشعلوا النار لعمل الزفت وتصليحِها فسألهم: ماذا تصنعون؟ فقالوا : نصنع السفينة ثم نَطليها بالزفت فتسير بسرعة. فحضر في الحال إلى داره وربط حماره بالسلاسل …"
summary:
  ar: "في حوض لبناء السفن قيل لجحا إن القارب يُطلى بالقار ليسرع، فربط حماره وأشعل النار في حوافره، فانفلت الحمار وصاح جحا أن انظروا كيف يركض قبل أن نضع القار. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  en: "At a shipyard Juha is told the boat is tarred to go fast; he ties his donkey and sets fire to its hooves; the donkey breaks loose, and Juha calls out to see it run before the tar is applied. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  ur: "ایک جہاز سازی کے کارخانے میں جحا کو بتایا گیا کہ کشتی پر تارکول اس لیے لگایا جاتا ہے کہ وہ تیز چلے؛ اس نے اپنے گدھے کو باندھ کر اس کے کھروں میں آگ لگا دی؛ گدھا چھوٹ کر بھاگا تو جحا نے پکار کر کہا کہ دیکھو، تارکول لگانے سے پہلے ہی کیسے دوڑ رہا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  fr: "Dans un chantier naval, on dit à Juha que le bateau est goudronné pour aller vite ; il attache son âne et met le feu à ses sabots ; l'âne se détache, et Juha crie de regarder comme il court avant que le goudron soit appliqué. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  es: "En un astillero, le dicen a Juha que el barco se embrea para que vaya rápido; ata a su burro y prende fuego a sus pezuñas; el burro se suelta, y Juha grita que miren cómo corre antes de aplicarle la brea. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  tr: "Bir tersanede Juha'ya, teknelerin daha hızlı olmaları için katranla kaplandıkları söylendi. Bunun üzerine eşeğini bağladı ve toynaklarını ateşe verdi. Eşek kurtuldu ve Juha, \"Katranı sürmeden önce bile ne kadar hızlı koştuğuna bakın!\" diye bağırdı. {cite:juha-nawadir-kubra-djuwaydi s. 51}"
  id: "Di galangan kapal, Juha diberitahu bahwa perahu-perahu dilapisi ter untuk membuatnya lebih cepat. Maka ia mengikat keledainya dan membakar kuku-kukunya. Keledai itu berhasil melepaskan diri, dan Juha berteriak, \"Lihat betapa cepatnya ia berlari bahkan sebelum kita mengoleskan ter!\" {cite:juha-nawadir-kubra-djuwaydi p. 51}"
