text: |-
  • (باب الاام اللغة
  ٥٧٢
  قهيالأوالاحر الذى ان توسعت • موارد، ضاقت علكسادره
  وتقول اياك وأن تفعل كذا ولا تقل إياك أن نقعل بلا واو وأبايازجر وقال
  اذا قال حاديهم ايا يا اتقينه * يمثل الذرى مطلنفتات العرائك
  واياة الشمسس بكسر الهمزة ضوؤها وقد تفح وقال
  سقتواياة الشمس الالثاته • أصف فلم تكدم عليه بائد
  فان أسقطت الماءمددت وقدت ويقال الاياة للشمس كالهالة للمروهى الدارة حواها
  ⁦(با)⁩ الباهرف من حروف الشفة بنيت على الكسر لاستحالة الابتداء بالموقوف وهى من
  عوامل الجر وتختص بالدخول على الاسماء وهى لالصاق الفعل بالمفعول به تقول حررت بزيد
  كانك ألصقت المروربه وكل فعل لا يتعدى فلك أن تعدّيه بالباء والالف والقشديد تقول طار
  به وأطاره وطيره وقد تزاد الباء فى الكلام كقواهم بحسبك قول السوء قال الشاءر
  يحسبك فى القوم أن يعلوا • بأنك فيهم عنى مضر .
  وقال نسالى وكفى جربك هاديا ونصيرا وقال الراجز
  نحن ينوجعدة أصحاب الفلج • نضرب بالسيف ونرج وبالفوج
  أى الفرج وربعما وضع موضع قولن من أجل كفول لبيد
  غلب تشذر بالذحول كأنهم • جن البدى رواسيا أقدامها
  أى من أجل الذحول وقد يوضع موضع على كقوله تعالى ومنهم من ان تأمنه بديناراى على
  ديشاركمانوضع على موضع الباه كقول الشاعر
  اذا رضيت على بنوقنير • لعمراللٰه أعجبنى رضاها
  أى رضيت بى ⁦(تا)⁩ تااسم يشاريه الى المؤنت مثل ذاللمذ كرقال النابغة
  هاان تاعذرة الاتكن تفعت • فانّ صاحبهاقد تاه فى البلد .
  وينه ممل ذه وتان للتننسة وأولاه اللجمع وتصغير تاتيا بالفتح والتتديدلانك قلبت الالفيا.
  وأدعمتها فى ياه التصغير وقك أن تدخل عليها ها للتنبيه فتقول ها تاهندوها تان وهؤْلاه وفى
  التصغديرها تيافان خاطبت جذت بالسكاف فقلت تيك وقلث وتال وتلك بنتح التساء وهى لغسة
  رديثة والبقنية تانث وثانك بالتشديد والمع أولئك وأولاك وأولالك قال كاف لمن تخاطبه
  فى النسذ كير والتأنيث والتننيسة والمع وما قبل ال-كاف لمن تشير اليه فى التذكير والتأنيث
  والتننية والجمع فان حفظت هذا الاصل لم تخطئ فى شئ-ن مسائله وتدخل هاعلى تيك وتاك
  تقول هاتيك هذ دوها تاك عند . قال عبيديه ف ناقته
  ها-يك تحدانى وأبيضر صارما • ومذريا فى مأون مخموس
  وقال أبو لنجسم
  جئنا نحيك ونستجديكا • فافعل بناهاتاك أوهاتيكا
  أى هذه أوتلك عطية أو تحية ولا تدخل ها على تلك لانهم جعلوا اللام ء وضامن ها التنبيه
  وتالث لغة فى الك وأنشداين السكيت• وحان لتالك الغمراغسار• والتاممن ووف
  الز يادات وهى تزاد فى المستبل اذاخاطبت تقول أنت تفعل وتدخل فى أمر المواجهة لنغابر
  ١٤٤٠
