label: { ar: "سنن ابن ماجه 460 — الأب والأبوة", en: "Sunan Ibn Majah 460 — the father and fatherhood", ur: "سنن ابن ماجہ 460 — باپ اور والدیت", es: "Sunan Ibn Majah 460 — El padre y la paternidad" }
text: "… حَجَّاجٌ، حَدَّثَنَا هَمَّامٌ، حَدَّثَنَا إِسْحَاقُ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، حَدَّثَنِي عَلِيُّ بْنُ يَحْيَى بْنِ خَلاَّدٍ، عَنْ أَبِيهِ، عَنْ عَمِّهِ، رِفَاعَةَ بْنِ رَافِعٍ أَنَّهُ كَانَ جَالِسًا عِنْدَ النَّبِيِّ ـ فَقَالَ \" إِنَّهَا لاَ تَتِمُّ صَلاَةٌ لأَحَدٍ حَتَّى يُسْبِغَ الْوُضُوءَ كَمَا أَمَرَهُ اللَّهُ تَعَالَى يَغْسِلُ وَجْهَهُ وَيَدَيْهِ إِلَى الْمِرْفَقَيْنِ وَيَمْسَحُ بِرَأْسِهِ وَرِجْلَيْهِ إِلَى الْكَعْبَيْنِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 460، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 460 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 460، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 460 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
