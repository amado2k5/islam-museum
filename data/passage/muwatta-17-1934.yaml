label: { ar: "الموطأ 1934 — مالك: كل شيء ينتفع به الناس من الأصناف كلها، وإن كان الحصباء أو القصة، فكل واحد منهما بمثليه إلى أجل فهو ربا، وواحد بمثله وزيادة شيء إلى أجل فهو ربا", en: "Muwatta 1934", es: "Muwatta 1934", fr: "Muwatta 1934", ur: "موطا 1934", tr: "El-Muvatta 1934 — Malik: İnsanların her türlü şeyden, çakıldan taşa kadar, her şeyden faydalanması durumunda, bunlardan herhangi birinin değerinin iki katına krediyle satılması faizdir; aynı şekilde, birinin değerinin üzerine bir miktar daha eklenerek krediyle satılması da faizdir.", id: "Al-Muwatta 1934 — Malik: Segala sesuatu yang bermanfaat bagi manusia, dari semua kategori, bahkan jika itu kerikil atau batu, jika salah satunya dijual dengan harga dua kali lipat nilainya secara kredit, maka itu adalah riba, dan jika yang satu dijual dengan harga setara ditambah sesuatu yang lebih secara kredit, maka itu adalah riba." }
summary:
  ar: "قال مالك: وكل شيء ينتفع به الناس من الأصناف كلها، وإن كانت الحصباء أو القصة، فكل واحد منهما بمثليه إلى أجل، فهو ربا. وواحد بمثله، وزيادة شيء من الأشياء إلى أجل، فهو ربا. {cite:muwatta-maruf-1997 p.191} {cite:muwatta-maruf-1997 p.192}"
  tr: "Malik şöyle dedi: İnsanların fayda sağladığı her şey, türü ne olursa olsun, çakıl taşı veya saman bile olsa, değerinin iki katına krediyle satılırsa, bu tefeciliktir. Benzer şekilde, bir şeyi eşdeğerine satmak veya ona krediyle herhangi bir şey eklemek de tefeciliktir. {cite:muwatta-maruf-1997 s.191} {cite:muwatta-maruf-1997 s.192}"
  id: "Malik berkata: Apa pun yang memberikan manfaat bagi orang lain, apa pun jenisnya, bahkan jika itu kerikil atau sekam, jika dijual dengan harga dua kali lipat nilainya secara kredit, maka itu adalah riba. Demikian pula, menjual suatu barang dengan harga setara, atau menambahkan sesuatu padanya secara kredit, adalah riba. {cite:muwatta-maruf-1997 p.191} {cite:muwatta-maruf-1997 p.192}"
