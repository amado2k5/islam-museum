text: "يعني المغازي ونحوها - فأما إذا جاءَك الحلال والحرام أردنا قوماً هكذا، وقبَضَ أبو الفضل - يعني العباس - أصابع يده الأربع من كل يد ولم يضم الإبهام. وأما النوع الثالث، من الأحاديث فهو حديث قد اختلف أهل العلم بالحديث …"
