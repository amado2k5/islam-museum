label: { ar: "الموطأ 1106 — أبو هريرة عن النبي: رأى رجلاً يسوق بدنة، فقال: اركبها، فقال: يا رسول الله، إنها بدنة؛ فقال: اركبها ويلك، في الثانية أو الثالثة", en: "Muwatta 1106" }
text: "اركبها ويلك"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله رأى رجلاً يسوق بدنة، فقال: اركبها. فقال: يا رسول الله، إنها بدنة. فقال: اركبها ويلك، في الثانية أو الثالثة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1203) وإسحاق الطباع وإسماعيل بن أبي أويس عند البخاري (2755) وغيرهم. {cite:muwatta-maruf-1997 p.508}"
