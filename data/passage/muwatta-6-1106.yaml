label: { ar: "الموطأ 1106 — أبو هريرة عن النبي: رأى رجلاً يسوق بدنة، فقال: اركبها، فقال: يا رسول الله، إنها بدنة؛ فقال: اركبها ويلك، في الثانية أو الثالثة", en: "Muwatta 1106", es: "Muwatta 1106", fr: "Muwatta 1106", ur: "موطا 1106", tr: "El-Muvatta 1106 — Ebu Hurayra, Peygamberimizden rivayetle: Bir adamın kurbanlık bir deveyi götürdüğünü gördü ve ona: \"Üzerine bin\" dedi. Adam: \"Ey Allah'ın Resulü, bu kurbanlık bir devedir\" dedi. Bunun üzerine Peygamberimiz: \"Üzerine binersen, ikinci ya da üçüncü seferde sana yazıklar olsun\" dedi.", id: "Al-Muwatta 1106 — Abu Hurairah meriwayatkan dari Nabi: Ia melihat seorang pria menuntun seekor unta kurban, lalu ia berkata: Naiki unta ini. Pria itu menjawab: Wahai Rasulullah, ini adalah unta kurban. Maka beliau bersabda: Naiki unta ini, celakalah kamu, pada kesempatan kedua atau ketiga." }
text: "اركبها ويلك"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله رأى رجلاً يسوق بدنة، فقال: اركبها. فقال: يا رسول الله، إنها بدنة. فقال: اركبها ويلك، في الثانية أو الثالثة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1203) وإسحاق الطباع وإسماعيل بن أبي أويس عند البخاري (2755) وغيرهم. {cite:muwatta-maruf-1997 p.508}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü kurbanlık bir deveyi götüren bir adam gördü ve \"Üzerine bin\" dedi. Adam, \"Ey Allah Resulü, bu kurbanlık bir devedir\" dedi. Allah Resulü ikinci veya üçüncü seferde, \"Üzerine bin, vay haline!\" dedi. Editör, bu hadisin Ebu Mus'ab (1203), İshak el-Tabba', İsmail ibn Abi Uveys ve diğerleri tarafından Malik'ten rivayet edildiğini ve Buhari'nin (2755) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.508}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW melihat seorang laki-laki menuntun unta kurban dan berkata, \"Naikilah.\" Laki-laki itu berkata, \"Wahai Rasulullah, itu adalah unta kurban.\" Rasulullah SAW bersabda, \"Naikilah, celakalah kamu!\" pada kesempatan kedua atau ketiga. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1203), Ishaq al-Tabba', Isma'il ibn Abi Uways, dan lainnya, sebagaimana dicatat oleh al-Bukhari (2755). {cite:muwatta-maruf-1997 p.508}"
