text: "… جسس التجسس التجسس الرجل يصيب الجارية من الغنائم هل يطأ أحد جاريته مشركة باب ابراز الجواري والنظر عند هل تجزىء المكتوبة من وراء السبع هل تؤخذ الجزية من عتقاء المسلمين هل يقاتل أهل الشرك حتى يؤمنوا من غير أهل الكتاب …"
summary:
