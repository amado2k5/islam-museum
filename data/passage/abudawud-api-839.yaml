label: { ar: "سنن أبي داود 839 — الأب والأبوة", en: "Sunan Abi Dawud 839 — the father and fatherhood", ur: "سنن ابی داؤد 839 — باپ اور والدیت", es: "Sunan Abi Dawud 839 — El padre y la paternidad" }
text: "… بْنُ مَعْمَرٍ، حَدَّثَنَا حَجَّاجُ بْنُ مِنْهَالٍ، حَدَّثَنَا هَمَّامٌ، حَدَّثَنَا مُحَمَّدُ بْنُ جُحَادَةَ، عَنْ عَبْدِ الْجَبَّارِ بْنِ وَائِلٍ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ فَذَكَرَ حَدِيثَ الصَّلاَةِ قَالَ فَلَمَّا سَجَدَ وَقَعَتَا رُكْبَتَاهُ إِلَى الأَرْضِ قَبْلَ أَنْ تَقَعَ كَفَّاهُ. قَالَ هَمَّامٌ وَحَدَّثَنَا شَقِيقٌ قَالَ حَدَّثَنِي عَاصِمُ بْنُ كُلَيْبٍ عَنْ أَبِيهِ عَنِ النَّبِيِّ بِمِثْلِ هَذَا وَفِي حَدِيثِ أَحَدِهِمَا - وَأَكْبَرُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 839، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 839 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 839، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 839 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
