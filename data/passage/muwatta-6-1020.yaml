summary:
  ar: "قول لمالك: أما ما قتل المحرم أو ذبح من الصيد فلا يحل أكله لحلال ولا لمحرم، لأنه ليس بذكي، كان خطأ أو عمداً، فأكله لا يحل، وقد سمع مالك ذلك من غير واحد. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1151). {cite:muwatta-maruf-1997 p.477}"
