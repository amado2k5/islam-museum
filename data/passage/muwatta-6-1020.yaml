label: { ar: "الموطأ 1020 — مالك: ما قتله المحرم أو ذبحه من الصيد فلا يحل أكله لحلال ولا لمحرم، لأنه ليس بذكي، كان خطأ أو عمداً", en: "Muwatta 1020", es: "Muwatta 1020", fr: "Muwatta 1020", ur: "موطا 1020", tr: "El-Muvatta 1020 — Malik: İhramlı bir hacının avladığı veya kestiği hayvanın eti, ister ihramlı olsun ister olmasın, hiç kimse için yenmesi caiz değildir; çünkü bu, ister kaza sonucu ister kasten olsun, ritüel olarak kesilmiş sayılmaz.", id: "Al-Muwatta 1020 — Malik: Apa yang dibunuh atau disembelih oleh seorang jamaah haji dalam keadaan ihram tidak boleh dimakan oleh siapa pun, baik dalam keadaan ihram maupun tidak, karena tidak dianggap sebagai penyembelihan secara ritual, baik karena kesalahan maupun disengaja." }
summary:
  ar: "قول لمالك: أما ما قتل المحرم أو ذبح من الصيد فلا يحل أكله لحلال ولا لمحرم، لأنه ليس بذكي، كان خطأ أو عمداً، فأكله لا يحل، وقد سمع مالك ذلك من غير واحد. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1151). {cite:muwatta-maruf-1997 p.477}"
  tr: "Malik şöyle demiştir: “İhramlı bir hacı tarafından öldürülen veya kesilen av hayvanına gelince, ister ihramlı olsun ister olmasın, hiç kimsenin onu yemesi caiz değildir; çünkü ister yanlışlıkla ister kasten olsun, İslami usullere göre kesilmemiştir. Bu nedenle, onu yemek caiz değildir.” Malik bunu birden fazla kişiden işitmiştir. Araştırmacı, Ebu Musab'ın (ö. 1151) bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.477}"
  id: "Malik berkata: “Adapun hewan buruan yang dibunuh atau disembelih oleh seorang jamaah haji dalam keadaan ihram, tidak diperbolehkan bagi siapa pun, baik dalam keadaan ihram maupun tidak, untuk memakannya, karena hewan itu tidak disembelih menurut tata cara Islam, baik karena kesalahan maupun disengaja. Oleh karena itu, memakannya tidak diperbolehkan.” Malik mendengar hal ini dari lebih dari satu orang. Peneliti menyebutkan bahwa Abu Mus’ab (wafat 1151) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.477}"
