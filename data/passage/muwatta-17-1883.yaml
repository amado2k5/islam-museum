label: { ar: "الموطأ 1883 — مالك: إذا اختلف ما يكال أو يوزن مما يؤكل أو يشرب، فلا بأس أن يؤخذ منه اثنان بواحد يدا بيد، كصاع من تمر بصاعين من حنطة، وإن دخل الأجل فلا يحل", en: "Muwatta 1883" }
summary:
  ar: "قال مالك: وإذا اختلف ما يكال أو يوزن، مما يؤكل أو يشرب، فبان اختلافه، فلا بأس أن يؤخذ منه اثنان بواحد، يدا بيد. ولا بأس أن يؤخذ صاع من تمر بصاعين من حنطة، وصاع من تمر بصاعين من زبيب، وصاع من حنطة بصاعين من سمن. فإذا كان الصنفان من هذا مختلفين، فلا بأس باثنين منه بواحد، أو أكثر من ذلك، يدا بيد. فإن دخل ذلك الأجل فلا يحل. {cite:muwatta-maruf-1997 p.174}"
