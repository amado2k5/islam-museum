label: { ar: "الموطأ 1883 — مالك: إذا اختلف ما يكال أو يوزن مما يؤكل أو يشرب، فلا بأس أن يؤخذ منه اثنان بواحد يدا بيد، كصاع من تمر بصاعين من حنطة، وإن دخل الأجل فلا يحل", en: "Muwatta 1883", es: "Muwatta 1883", fr: "Muwatta 1883", ur: "موطا 1883", tr: "El-Muvatta 1883 — Malik: Hacim veya ağırlık olarak ölçülen yiyecek veya içecek miktarları farklıysa, elden ele iki ile bir arasında değişim yapmak caizdir; örneğin bir sa' hurmayı iki sa' buğdayla değiştirmek gibi. Ancak vadesi geçmişse, bu caiz değildir.", id: "Al-Muwatta 1883 — Malik: Jika jumlah makanan atau minuman yang diukur berdasarkan volume atau berat berbeda, maka diperbolehkan menukar dua dengan satu, secara langsung, misalnya satu sa’ kurma dengan dua sa’ gandum. Namun, jika tanggal jatuh tempo telah lewat, maka tidak diperbolehkan." }
summary:
  ar: "قال مالك: وإذا اختلف ما يكال أو يوزن، مما يؤكل أو يشرب، فبان اختلافه، فلا بأس أن يؤخذ منه اثنان بواحد، يدا بيد. ولا بأس أن يؤخذ صاع من تمر بصاعين من حنطة، وصاع من تمر بصاعين من زبيب، وصاع من حنطة بصاعين من سمن. فإذا كان الصنفان من هذا مختلفين، فلا بأس باثنين منه بواحد، أو أكثر من ذلك، يدا بيد. فإن دخل ذلك الأجل فلا يحل. {cite:muwatta-maruf-1997 p.174}"
  tr: "Malik şöyle dedi: Hacim veya ağırlıkla ölçülen yiyecek veya içecekler farklıysa ve bu fark açıkça belliyse, elden ele iki tanesini bir tanesiyle almakta bir sakınca yoktur. Aynı şekilde, bir ölçü hurmayı iki ölçü buğdayla, bir ölçü hurmayı iki ölçü kuru üzümle veya bir ölçü buğdayı iki ölçü tereyağıyla almakta da bir sakınca yoktur. Bu iki tür farklıysa, elden ele iki tanesini bir tanesiyle veya daha fazlasını almakta bir sakınca yoktur. Ancak işlemin süresi dolmuşsa, bu caiz değildir. {cite:muwatta-maruf-1997 s.174}"
  id: "Malik berkata: Jika barang yang diukur berdasarkan volume atau berat, baik makanan maupun minuman, berbeda, dan perbedaannya terlihat jelas, maka tidak ada salahnya mengambil dua takaran untuk satu takaran, secara langsung. Dan tidak ada salahnya mengambil satu takaran kurma untuk dua takaran gandum, atau satu takaran kurma untuk dua takaran kismis, atau satu takaran gandum untuk dua takaran ghee. Jika kedua jenis barang tersebut berbeda, maka tidak ada salahnya mengambil dua takaran untuk satu takaran, atau lebih dari itu, secara langsung. Tetapi jika jangka waktu transaksi telah berakhir, maka hal itu tidak diperbolehkan. {kutipan:muwatta-maruf-1997 hlm.174}"
