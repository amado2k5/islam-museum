label: { ar: "سنن النسائي 3254 — الأب والأبوة", en: "Sunan al-Nasa'i 3254 — the father and fatherhood", ur: "سنن نسائی 3254 — باپ اور والدیت", es: "Sunan al-Nasa'i 3254 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3254 — le père et la paternité" }
text: "… إِبْرَاهِيمَ، قَالَ حَدَّثَنَا يَزِيدُ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ ثَابِتٍ الْبُنَانِيِّ، حَدَّثَنِي ابْنُ عُمَرَ بْنِ أَبِي سَلَمَةَ، عَنْ أَبِيهِ، عَنْ أُمِّ سَلَمَةَ، لَمَّا انْقَضَتْ عِدَّتُهَا بَعَثَ إِلَيْهَا أَبُو بَكْرٍ يَخْطُبُهَا عَلَيْهِ فَلَمْ تَزَوَّجْهُ فَبَعَثَ إِلَيْهَا رَسُولُ اللَّهِ عُمَرَ بْنَ الْخَطَّابِ يَخْطُبُهَا عَلَيْهِ فَقَالَتْ أَخْبِرْ رَسُولَ اللَّهِ أَنِّي امْرَأَةٌ غَيْرَى وَأَنِّي امْرَأَةٌ مُصْبِيَةٌ وَلَيْسَ أَحَدٌ مِنْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3254، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3254 (The Book of Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3254، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3254 (El Libro del Matrimonio), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3254 (Le Livre du Mariage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
