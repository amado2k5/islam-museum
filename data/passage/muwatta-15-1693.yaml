label: { ar: "الموطأ 1693 — القاسم بن محمد وسليمان بن يسار: طلق يحيى بن سعيد بن العاص ابنة عبد الرحمن بن الحكم البتة، فانتقلها عبد الرحمن، فأنكرت عائشة على مروان بن الحكم", en: "Muwatta 1693" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد وسليمان بن يسار أنهما سمعاه يذكران أن يحيى بن سعيد بن العاص طلق ابنة عبد الرحمن بن الحكم البتة، فانتقلها عبد الرحمن بن الحكم. فأرسلت عائشة أم المؤمنين إلى مروان بن الحكم، وهو يومئذ أمير المدينة، فقالت اتق الله وارد المرأة إلى بيتها. فقال مروان في حديث سليمان إن عبد الرحمن غلبني، وقال في حديث القاسم أو ما بلغك شأن فاطمة بنت قيس؟ فقالت عائشة لا يضرك أن لا تذكر حديث فاطمة، فقال مروان إن كان بك الشر فحسبك ما بين هذين من الشر. {cite:muwatta-maruf-1997 p.92}"
