label: { ar: "الموطأ 1693 — القاسم بن محمد وسليمان بن يسار: طلق يحيى بن سعيد بن العاص ابنة عبد الرحمن بن الحكم البتة، فانتقلها عبد الرحمن، فأنكرت عائشة على مروان بن الحكم", en: "Muwatta 1693", es: "Muwatta 1693", fr: "Muwatta 1693", ur: "موطا 1693", tr: "Al-Muwatta 1693 - Al-Qasim ibn Muhammed ve Süleyman ibn Yaşar: Yahya ibn Sa'id ibn al-'As, Abd al-Rahman ibn al-Hakam'ın kızını geri dönülemez bir şekilde boşadı, bu yüzden Abd al-Rahman onu aldı ve Aisha, Marwan ibn al-Hakam'a itiraz etti", id: "Al-Muwatta 1693 — Al-Qasim ibn Muhammad dan Sulayman ibn Yasar: Yahya ibn Sa'id ibn al-'As menceraikan putri Abd al-Rahman ibn al-Hakam tanpa dapat ditarik kembali, jadi Abd al-Rahman mengambilnya, dan Aisha keberatan dengan Marwan ibn al-Hakam" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد وسليمان بن يسار أنهما سمعاه يذكران أن يحيى بن سعيد بن العاص طلق ابنة عبد الرحمن بن الحكم البتة، فانتقلها عبد الرحمن بن الحكم. فأرسلت عائشة أم المؤمنين إلى مروان بن الحكم، وهو يومئذ أمير المدينة، فقالت اتق الله وارد المرأة إلى بيتها. فقال مروان في حديث سليمان إن عبد الرحمن غلبني، وقال في حديث القاسم أو ما بلغك شأن فاطمة بنت قيس؟ فقالت عائشة لا يضرك أن لا تذكر حديث فاطمة، فقال مروان إن كان بك الشر فحسبك ما بين هذين من الشر. {cite:muwatta-maruf-1997 p.92}"
  tr: "Malik, Yahya ibn Sa'id'den, o da el-Kâsim ibn Muhammed ve Süleyman ibn Yasar'dan rivayet eder ki, Yahya ibn Sa'id ibn el-As'ın, Abdurrahman ibn el-Hakam'ın kızını geri dönülmez bir şekilde boşadığını ve bunun üzerine Abdurrahman ibn el-Hakam'ın kızı aldığını işitmişlerdir. Müminlerin Annesi Aişe, o sırada Medine valisi olan Mervan ibn el-Hakam'a, \"Allah'tan kork ve kadını evine geri gönder\" diye haber göndermiştir. Süleyman'ın rivayetine göre Mervan, \"Abdurrahman bana üstün geldi\" demiştir. El-Kâsim'in rivayetine göre ise, \"Fatıma bint Kays'ın kıssasını duymadın mı?\" demiştir. Aişe, \"Fatıma'nın kıssasını anlatmasan da sana zarar gelmez\" demiştir. Marwan şöyle cevap verdi: \"Eğer gerçekten kötüysen, bu ikisi arasında olan şey bile senin için yeterince kötülüktür.\" {cite:muwatta-maruf-1997 s.92}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad dan Sulayman ibn Yasar, bahwa mereka mendengar dia menyebutkan bahwa Yahya ibn Sa'id ibn al-'As menceraikan putri 'Abd al-Rahman ibn al-Hakam secara tidak dapat dibatalkan, sehingga 'Abd al-Rahman ibn al-Hakam mengambilnya. 'Aisyah, Ummul Mukminin, mengirim pesan kepada Marwan ibn al-Hakam, yang saat itu adalah gubernur Madinah, mengatakan, \"Takutlah kepada Allah dan kembalikan wanita itu ke rumahnya.\" Marwan, menurut riwayat Sulayman, berkata, \"'Abd al-Rahman telah menang atasku.\" Dan menurut riwayat al-Qasim, dia berkata, \"Tidakkah kamu mendengar kisah Fatimah binti Qays?\" 'Aisyah berkata, \"Tidak akan membahayakanmu jika kamu tidak menyebutkan kisah Fatimah.\" Marwan menjawab, \"Jika kamu benar-benar jahat, maka apa yang ada di antara kedua hal ini sudah cukup jahat bagimu.\" {cite:muwatta-maruf-1997 p.92}"
