label: { ar: "الموطأ 1182 — ابن عمر يلقى رجلا من أهله يسمى المجبر قد أفاض ولم يحلق ولم يقصر، فيأمره أن يرجع فيحلق أو يقصر ثم يفيض", en: "Muwatta 1182", es: "Muwatta 1182", fr: "Muwatta 1182", ur: "موطا 1182", tr: "El-Muvatta 1182 — İbn Ömer, ailesinden El-Mücebbir adında bir adamla karşılaştı; bu adam saçını tıraş etmeden veya kısaltmadan tavaf yapmıştı. Bunun üzerine İbn Ömer, adama geri dönüp saçını tıraş etmesini veya kısaltmasını, sonra tavaf yapmasını emretti.", id: "Al-Muwatta 1182 — Ibnu Umar bertemu dengan seorang pria dari keluarganya bernama Al-Mujabbir yang telah melakukan Tawaf tanpa mencukur atau memendekkan rambutnya, maka ia memerintahkannya untuk kembali dan mencukur atau memendekkan rambutnya, kemudian melakukan Tawaf." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر لقي رجلا من أهله يقال له المجبر، قد أفاض ولم يحلق ولم يقصر، وقد جهل ذلك، فأمره ابن عمر أن يرجع فيحلق أو يقصر، ثم يرجع إلى البيت فيفيض. {cite:muwatta-maruf-1997 p.532}"
  tr: "Malik, Nafi’den rivayetle, Abdullah ibn Umar’ın ailesinden el-Mujabbir adında bir adamla karşılaştığını, bu adamın saçını tıraş etmeden veya kısaltmadan Tavafü’l-İfade’yi yaptığını ve doğru yöntemi bilmediğini anlatır. Bunun üzerine İbn Umar ona geri dönüp saçını tıraş etmesini veya kısaltmasını, sonra Kâbe’ye geri dönüp Tavafü’l-İfade’yi yapmasını emretti. {cite:muwatta-maruf-1997 s.532}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar bertemu dengan seorang pria dari keluarganya bernama al-Mujabbir, yang telah melakukan Tawaf al-Ifadah tanpa mencukur atau memendekkan rambutnya, dan dia tidak mengetahui tata cara yang benar. Maka Ibn Umar memerintahkannya untuk kembali dan mencukur atau memendekkan rambutnya, kemudian kembali ke Ka'bah dan melakukan Tawaf al-Ifadah. {cite:muwatta-maruf-1997 p.532}"
