summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر لقي رجلا من أهله يقال له المجبر، قد أفاض ولم يحلق ولم يقصر، وقد جهل ذلك، فأمره ابن عمر أن يرجع فيحلق أو يقصر، ثم يرجع إلى البيت فيفيض. {cite:muwatta-maruf-1997 p.532}"
