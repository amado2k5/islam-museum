label: { ar: "سنن أبي داود 1634 — ما لا يحل", en: "Sunan Abi Dawud 1634 — what is not lawful", ur: "سنن ابی داؤد 1634 — جو حلال نہیں", es: "Sunan Abi Dawud 1634 — lo que no es lícito" }
text: "… سَعْدٍ - قَالَ أَخْبَرَنِي أَبِي، عَنْ رَيْحَانَ بْنِ يَزِيدَ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، عَنِ النَّبِيِّ قَالَ \" لاَ تَحِلُّ الصَّدَقَةُ لِغَنِيٍّ وَلاَ لِذِي مِرَّةٍ سَوِيٍّ \". قَالَ أَبُو دَاوُدَ رَوَاهُ سُفْيَانُ عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ كَمَا قَالَ إِبْرَاهِيمُ وَرَوَاهُ شُعْبَةُ عَنْ سَعْدٍ قَالَ \" لِذِي مِرَّةٍ قَوِيٍّ \". وَالأَحَادِيثُ الأُخَرُ عَنِ النَّبِيِّ بَعْضُهَا \" …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1634، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1634 (Zakat (Kitab Al-Zakat)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1634، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1634 (Zakat (Kitab Al-Zakat)), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
