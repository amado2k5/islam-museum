label: { ar: "سنن النسائي 2281 — الأب والأبوة", en: "Sunan al-Nasa'i 2281 — the father and fatherhood", ur: "سنن نسائی 2281 — باپ اور والدیت", es: "Sunan al-Nasa'i 2281 — El padre y la paternidad" }
text: "… سَهْلُ بْنُ بَكَّارٍ، قَالَ حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ أَبِي بِشْرٍ، عَنْ هَانِئِ بْنِ عَبْدِ اللَّهِ بْنِ الشِّخِّيرِ، عَنْ أَبِيهِ، قَالَ كُنْتُ مُسَافِرًا فَأَتَيْتُ النَّبِيَّ وَهُوَ يَأْكُلُ وَأَنَا صَائِمٌ فَقَالَ \" هَلُمَّ \". قُلْتُ إِنِّي صَائِمٌ. قَالَ \" أَتَدْرِي مَا وَضَعَ اللَّهُ عَنِ الْمُسَافِرِ \". قُلْتُ وَمَا وَضَعَ اللَّهُ عَنِ الْمُسَافِرِ قَالَ \" الصَّوْمَ وَشَطْرَ الصَّلاَةِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2281، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2281 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2281، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2281 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
