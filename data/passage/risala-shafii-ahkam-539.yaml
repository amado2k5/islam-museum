text: "… ما وجب عليهم، من قبولِ الخبرِ عن رسول الله، وتَرْكِ كلٌ عملٍ خالفه. - ولو بلغ عمرَ هذا صار إليه، إن شاء اللّٰه، كما صار إلى غيره فيما بَلَفه عن رسول الله، بتقواه لِلهِ، وتأديتِه الواجبَ عليه، فى اتّباع أمرِ …"
summary:
