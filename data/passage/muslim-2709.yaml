text: "قال أبو هريرة: جاء رجل إلى النبي فقال: يا رسول الله ما لقيت من عقرب لدغتني البارحة! قال: أما لو قلت حين أمسيت أعوذ بكلمات الله التامات من شر ما خلق لم تضرك"
