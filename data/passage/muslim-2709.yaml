label: { ar: "مسلم 2709 — العقرب التي لدغت", en: "Muslim 2709 — The scorpion's sting and the missed refuge", es: "Musulmán 2709 — El aguijón del escorpión y el refugio perdido", fr: "Muslim 2709 — La piqûre du scorpion et le refuge manqué", ur: "مسلم 2709 - بچھو کا ڈنک اور گم شدہ پناہ گاہ", tr: "Müslim 2709 — Sokmuş akrep", id: "Muslim 2709 — Kalajengking yang menyengat" }
text: "قال أبو هريرة: جاء رجل إلى النبي فقال: يا رسول الله ما لقيت من عقرب لدغتني البارحة! قال: أما لو قلت حين أمسيت أعوذ بكلمات الله التامات من شر ما خلق لم تضرك"
summary:
  ar: "رواية أبي هريرة في باب التعوذ بكلمات الله التامات من كتاب الذكر والدعاء في صحيح مسلم؛ الرجل الذي لدغته عقرب وإخباره أن الاستعاذة المسائية كانت تمنعه."
  tr: "Sahih Müslim'in Dua ve Anma Kitabı'ndaki \"Allah'ın mükemmel sözlerine sığınma\" bölümünde Ebu Hurayra'nın rivayeti; akrep tarafından sokulan adamın, akşam duasıyla sığınmanın buna engel olduğunu söylemesi."
  id: "Riwayat Abu Hurairah dalam bab tentang mencari perlindungan pada firman Allah yang sempurna dari Kitab Zikir dan Doa dalam Sahih Muslim; tentang seorang pria yang disengat kalajengking dan pernyataannya bahwa doa malam untuk memohon perlindungan mencegahnya."
