  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 1, page 415, mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur de Testaments."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 1. cildinin 415. sayfasından, vasiyetname veya nihai miras olarak bıraktığı mal varlığı ve mirasla ilgili bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Ibn Abi Shaybah, Volume 1, halaman 415, yang menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkannya berupa harta warisan; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Shrines Browser."
