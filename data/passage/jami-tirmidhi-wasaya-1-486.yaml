text: "… حَدَّثَنَا هَنَّادٌ وعَلِيُّ بْنُ حُجْرٍ قَالَا : سَلِ الحَلَاعِ عْ ي أماعَةَ الَّلِ قَالّن سَمِعْتُ رَسُولَ اللهِ وَلِلخِ يَقُولُ في خُطْبَتِهِ عَامَ حَجَّةِ الوَدَاع: إِنَّ اللهَ تَبَارَكَ وَتَعَالَى قَدْ أَعْطَى لكُلِّ ذِي حَقٍّ حَقَّهُ فَلَا وَصِيَّةَ لِوَارِثٍ، الْوَلَدُ لِلْفِرَاشِ ولِلْعَاهِرِ …"
summary:
