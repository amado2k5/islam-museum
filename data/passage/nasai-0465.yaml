ref: "465"
label:
  ar: "النسائي 465 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Nasa'i 465 — The first thing a servant is reckoned for is his prayer"
  ur: "نسائی 465 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
  es: "Nasa'i 465 — Lo primero por lo que se cuenta de un siervo es su oración."
  fr: "Nasa'i 465 — La première chose dont un serviteur est tenu compte, c'est sa prière"
  tr: "An-Nasa’i 465 — Bir kulun hesaba çekileceği ilk şey duasıdır: Bakın, kulumun gönüllü duaları var mı?"
  id: "An-Nasa’i 465 — Hal pertama yang akan dimintai pertanggungjawaban dari seorang hamba adalah salatnya: Lihatlah, apakah hamba-Ku mempunyai salat sunnah?"
text: "إن أول ما يحاسب به العبد بصلاته فإن صلحت فقد أفلح وأنجح وإن فسدت فقد خاب وخسر . قال همام لا أدري هذا من كلام قتادة أو من الرواية فإن انتقص من فريضته شىء قال انظروا هل لعبدي من تطوع …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 465: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 465: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 465: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 465: Lo primero por lo que se cuenta a un siervo es su oración. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan an-Nasa'i, n° 465: La première chose dont un serviteur est tenu compte est sa prière. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sunan-ı Nesai'de 465 numaralı hadis-i kudsi şöyledir: Bir kulun hesaba çekileceği ilk şey namazıdır: \"Kulumun nafile namazları olup olmadığına bakın.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 465: Hal pertama yang akan dipertanggungjawabkan kepada seorang hamba adalah salatnya: Perhatikanlah apakah hamba-Ku mempunyai salat sunnah. Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta."
