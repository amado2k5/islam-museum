label:
  ar: "النسائي 465 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Nasa'i 465 — The first thing a servant is reckoned for is his prayer"
  ur: "نسائی 465 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
text: "إن أول ما يحاسب به العبد بصلاته فإن صلحت فقد أفلح وأنجح وإن فسدت فقد خاب وخسر . قال همام لا أدري هذا من كلام قتادة أو من الرواية فإن انتقص من فريضته شىء قال انظروا هل لعبدي من تطوع …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 465: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 465: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 465: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
