label: { ar: "سنن أبي داود 2059 — الأب والأبوة", en: "Sunan Abi Dawud 2059 — the father and fatherhood", ur: "سنن ابی داؤد 2059 — باپ اور والدیت" }
text: "حَدَّثَنَا عَبْدُ السَّلاَمِ بْنُ مُطَهِّرٍ، أَنَّ سُلَيْمَانَ بْنَ الْمُغِيرَةِ، حَدَّثَهُمْ عَنْ أَبِي مُوسَى، عَنْ أَبِيهِ، عَنِ ابْنٍ لِعَبْدِ اللَّهِ بْنِ مَسْعُودٍ، عَنِ ابْنِ مَسْعُودٍ، قَالَ لاَ رِضَاعَ إِلاَّ مَا شَدَّ الْعَظْمَ وَأَنْبَتَ اللَّحْمَ. فَقَالَ أَبُو مُوسَى لاَ تَسْأَلُونَا وَهَذَا الْحَبْرُ فِيكُمْ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2059، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2059 (Marriage (Kitab Al-Nikah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2059، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
