text: "… تم هبته، فلما كان فى اليوم الثالث من وزارته قال لى يا ابا اسحاق ألم ارك اذكرتنى بالنذر ؟ فقلت عولت على رأى الوزير ايده القّه وانه لا يحتاج الى اذ كارى لنذر عليه فى أمر خادم واجب الحق ! …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 1، ص 181، يرد فيه ذكر الواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 1, p. 181, whose wording mentions the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 1، ص 181 کا اقتباس جس میں واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
