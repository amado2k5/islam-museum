text: "… المصاحف ص، رجاله ثقات؛ غير أن عبد الملك بن عمير: ثقة لكنه تغير حفظه وربما دلس، ويشهد لصحته الرواية الآتية. إسناد صحيح: رواه ابن أبي داود في كتاب المصاحف ص."
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 140، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 140, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 140 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 1, pág. 140, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Tafsir d'Ibn Kathir (tome 1, p. 140) mentionne la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 140. sayfasından bir alıntı, Kur'an'ın derlenmesi ve el yazmalarının yanı sıra hat sanatı ve yazı konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir versiyondan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Tafsir Ibn Kathir, Jilid 1, halaman 140, membahas penyusunan Al-Qur'an dan manuskripnya, serta kaligrafi dan penulisan. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
