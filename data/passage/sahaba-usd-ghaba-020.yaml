text: "ي عن زرارة، عن قيس بن كعب أنه وفد على رسول الله علع فأسلم، وكتب له كتابا ودعا له فيه. ذكره أبو موسى فيما فات ابن منده هكذا، وقد نسبه ابن حبيب عن ابن الكلبي، ولم يسم الأرقم أوسا؛ إنما"
