text: "… أرجو أن تتنهَّدَ لأجلي مرة كان له جار في آقَ شَهْرْ من أبطال الفرسان، وكان عندما يحضُرُ إلى داره في المساء يتنهد تنهيداً عميقاً، في الدور الأسفل، ثم يتنهَّدُ الثانية في الدور الثاني، ثُمَّ يتنهَّد الثالثة في الغرفةِ التي يقيم …"
summary:
  ar: "تنهد فارس ثلاث مرات في بيته وأرى جحا حصانه وسلاحه من انتصار نيكوبوليس وحملات تركستان، وأراه زوجته وهي جارية لبايزيد أخذها من السلطان وبنت عم الأميرة ماريا، فطلب جحا منه أن يتنهد من أجله مرة. {cite:juha-nawadir-kubra-djuwaydi p. 159}"
  en: "A horseman sighs three times in his house and shows Juha his horse and weapons from the Nicopolis victory and the Turkestan campaigns; he shows his wife, a concubine of Bayezid whom he took from the sultan and who is a cousin of Princess Maria; Juha asks him to sigh for him once. {cite:juha-nawadir-kubra-djuwaydi p. 159}"
  ur: "ایک گھڑ سوار نے اپنے گھر میں تین بار آہ بھری اور جحا کو اپنا گھوڑا اور نیکوپولس کی فتح اور ترکستان کی مہمات کے ہتھیار دکھائے، پھر اپنی بیوی کو دکھایا جو بایزید کی کنیز تھی اور جسے اس نے سلطان سے لیا تھا اور جو شہزادی ماریا کی چچازاد تھی، تو جحا نے اس سے کہا کہ ایک بار اس کے لیے بھی آہ بھرے۔ {cite:juha-nawadir-kubra-djuwaydi p. 159}"
  fr: "Un cavalier soupire trois fois chez lui et montre à Juha son cheval et ses armes de la victoire de Nicopolis et des campagnes du Turkestan ; il lui montre sa femme, une concubine de Bayezid qu'il a prise au sultan et qui est cousine de la princesse Maria ; Juha lui demande de soupirer une fois pour lui. {cite:juha-nawadir-kubra-djuwaydi p. 159}"
  es: "Un jinete suspira tres veces en su casa y muestra a Juha su caballo y sus armas de la victoria de Nicópolis y de las campañas de Turquestán; le muestra a su esposa, una concubina de Bayaceto a quien tomó del sultán y que es prima de la princesa María; Juha le pide que suspire una vez por él. {cite:juha-nawadir-kubra-djuwaydi p. 159}"
