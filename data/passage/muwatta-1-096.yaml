label: { ar: "الموطأ 96 — عمر: إني لأجده ينحدر مني مثل الخريزة", en: "Muwatta 96" }
text: "إني لأجده ينحدر مني مثل الخريزة، فإذا وجد ذلك أحدكم فليغسل ذكره وليتوضأ وضوءه للصلاة"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن أبيه أسلم مولى عمر، في باب الوضوء من المذي: قال عمر بن الخطاب إنه يجد المذي ينحدر منه مثل الخرزة الصغيرة، وأمر من وجد ذلك أن يغسل ذكره ويتوضأ وضوءه للصلاة. ويفسر المحقق الخريزة بتصغير خرزة، ويذكر رواية عبد الرزاق عن الأعرج أن عمر قال على المنبر إنه ينحدر منه شيء مثل الجمان أو الخرز فما يباليه. {cite:muwatta-maruf-1997 p.83}"
