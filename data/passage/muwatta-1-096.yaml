label: { ar: "الموطأ 96 — عمر: إني لأجده ينحدر مني مثل الخريزة", en: "Muwatta 96", es: "Muwatta 96", fr: "Muwatta 96", ur: "موطا 96", tr: "Al-Muwatta 96 — Ömer: Bunun benden bir nehir gibi aktığını görüyorum.", id: "Al-Muwatta 96 — Umar: Aku mendapati itu mengalir dari diriku seperti sebuah sungai" }
text: "إني لأجده ينحدر مني مثل الخريزة، فإذا وجد ذلك أحدكم فليغسل ذكره وليتوضأ وضوءه للصلاة"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن أبيه أسلم مولى عمر، في باب الوضوء من المذي: قال عمر بن الخطاب إنه يجد المذي ينحدر منه مثل الخرزة الصغيرة، وأمر من وجد ذلك أن يغسل ذكره ويتوضأ وضوءه للصلاة. ويفسر المحقق الخريزة بتصغير خرزة، ويذكر رواية عبد الرزاق عن الأعرج أن عمر قال على المنبر إنه ينحدر منه شيء مثل الجمان أو الخرز فما يباليه. {cite:muwatta-maruf-1997 p.83}"
  tr: "Malik'in, Ömer'in azatlı kölesi Aslam'dan rivayet ettiği, boşalmadan önceki sıvıdan sonraki abdest bölümünde yer alan bir rivayete göre: Ömer ibn el-Hattab, kendisinden küçük bir boncuk gibi boşalmadan önceki sıvının damladığını gördüğünü ve bunu bulan herkesin penisini yıkamasını ve namaz kılar gibi abdest almasını emrettiğini söylemiştir. Araştırmacı, \"el-khurayza\"yı \"kharza\" (boncuk) kelimesinin küçültme hali olarak açıklıyor ve Abd el-Razzaq'ın el-A'raj'dan rivayet ettiği, Ömer'in minberde kendisinden inci veya boncuk gibi bir şeyin damladığını söylediğini, ancak bundan rahatsız olmadığını belirtiyor. {cite:muwatta-maruf-1997 s.83}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Zayd ibn Aslam, atas otoritas ayahnya Aslam, budak yang dibebaskan oleh Umar, dalam bab tentang wudhu setelah keluarnya cairan pra-ejakulasi: Umar ibn al-Khattab berkata bahwa ia mendapati cairan pra-ejakulasi menetes darinya seperti butiran kecil, dan ia memerintahkan siapa pun yang mendapati hal ini untuk mencuci penisnya dan berwudhu seperti untuk salat. Peneliti menjelaskan \"al-khurayza\" sebagai bentuk kecil dari \"kharza\" (butiran), dan menyebutkan riwayat Abd al-Razzaq atas otoritas al-A'raj bahwa Umar berkata di mimbar bahwa sesuatu seperti mutiara atau butiran menetes darinya, tetapi ia tidak mempermasalahkannya. {cite:muwatta-maruf-1997 p.83}"
