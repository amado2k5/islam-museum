label: { ar: "الموطأ 1831 — مالك: تفسير المزابنة أن يضمن الرجل لصاحب الجزاف الذي لا يعلم كيله ولا وزنه ولا عدده كيلا أو وزنا أو عددا معلوما، على أن يكون له ما زاد وعليه ما نقص، وهذا ليس بيعا بل مخاطرة وغرر وقمار", en: "Muwatta 1831" }
summary:
  ar: "قال مالك: نهى رسول الله عن المزابنة. وتفسير المزابنة أن كل شيء من الجزاف الذي لا يعلم كيله ولا وزنه ولا عدده، ابتيع بشيء مسمى من الكيل أو الوزن أو العدد. وذلك أن يقول الرجل للرجل يكون له الطعام المصبر الذي لا يعلم كيله، من الحنطة أو التمر، أو تكون للرجل السلعة من الحنطة أو النوى أو القضب، فيقول الرجل لرب السلعة: كل سلعتك هذه، أو مر من يكيلها، فما نقص من كذا وكذا صاعا لتسمية يسميها، فعلي غرمه حتى أوفيك تلك التسمية، وما زاد على تلك التسمية فهو لي. فليس ذلك بيعا، ولكنه المخاطرة والغرر والقمار. {cite:muwatta-maruf-1997 p.150} {cite:muwatta-maruf-1997 p.151}"
