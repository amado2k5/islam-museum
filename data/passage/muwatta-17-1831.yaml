label: { ar: "الموطأ 1831 — مالك: تفسير المزابنة أن يضمن الرجل لصاحب الجزاف الذي لا يعلم كيله ولا وزنه ولا عدده كيلا أو وزنا أو عددا معلوما، على أن يكون له ما زاد وعليه ما نقص، وهذا ليس بيعا بل مخاطرة وغرر وقمار", en: "Muwatta 1831", es: "Muwatta 1831", fr: "Muwatta 1831", ur: "موطا 1831", tr: "El-Muvatta 1831 — Malik: Muzabana'nın yorumu şudur: Bir kişi, ölçüsü, ağırlığı ve sayısı bilinmeyen, toplu halde bulunan bir malın sahibine, fazlasını alması ve eksik olanı üstlenmesi şartıyla, belirli bir ölçü, ağırlık veya sayı garanti eder. Bu bir satış değil, daha ziyade risk, belirsizlik ve kumar oyunudur.", id: "Al-Muwatta 1831 — Malik: Penafsiran Muzabana adalah bahwa seseorang menjamin kepada pemilik barang dalam jumlah besar, yang ukuran, berat, dan jumlahnya tidak diketahui, ukuran, berat, atau jumlah tertentu, dengan syarat ia mendapatkan kelebihan dan menanggung kekurangannya. Ini bukan jual beli, melainkan risiko, ketidakpastian, dan perjudian." }
summary:
  ar: "قال مالك: نهى رسول الله عن المزابنة. وتفسير المزابنة أن كل شيء من الجزاف الذي لا يعلم كيله ولا وزنه ولا عدده، ابتيع بشيء مسمى من الكيل أو الوزن أو العدد. وذلك أن يقول الرجل للرجل يكون له الطعام المصبر الذي لا يعلم كيله، من الحنطة أو التمر، أو تكون للرجل السلعة من الحنطة أو النوى أو القضب، فيقول الرجل لرب السلعة: كل سلعتك هذه، أو مر من يكيلها، فما نقص من كذا وكذا صاعا لتسمية يسميها، فعلي غرمه حتى أوفيك تلك التسمية، وما زاد على تلك التسمية فهو لي. فليس ذلك بيعا، ولكنه المخاطرة والغرر والقمار. {cite:muwatta-maruf-1997 p.150} {cite:muwatta-maruf-1997 p.151}"
  tr: "Malik şöyle dedi: Allah'ın Resulü *muzabana* uygulamasını yasaklamıştır. *Muzabana*nın açıklaması şudur: Ölçüsü, ağırlığı veya sayısı bilinmeyen, toplu olarak satılan herhangi bir şey, belirli bir ölçü, ağırlık veya sayı karşılığında satın alınır. Bu, bir adamın buğday veya hurma gibi bilinmeyen miktarda yiyecek depolaması veya buğday, hurma çekirdeği veya arpa bulundurması ve malların sahibine şöyle demesi durumunda ortaya çıkar: \"Mallarınızın tamamını yiyin veya birine ölçtürün. Belirli bir miktardan az olan *sa'* (kuru ölçü birimi) miktarını tamamladığım sürece ben ödeyeceğim. Bu miktarı aşan her şey benimdir.\" Bu bir satış değil, spekülasyon, aldatma ve kumar oyunudur. {cite:muwatta-maruf-1997 s.150} {cite:muwatta-maruf-1997 s.151}"
  id: "Malik berkata: Rasulullah SAW melarang praktik *muzabana*. Penjelasan *muzabana* adalah bahwa barang yang dijual dalam jumlah besar, yang ukuran, berat, atau jumlahnya tidak diketahui, dibeli dengan ukuran, berat, atau jumlah tertentu. Ini terjadi ketika seseorang menyimpan makanan dalam jumlah yang tidak diketahui, seperti gandum atau kurma, atau ketika seseorang memiliki gandum, biji kurma, atau jelai, dan berkata kepada pemilik barang: \"Makanlah seluruh jumlah barang Anda ini, atau mintalah seseorang untuk mengukurnya. Apa pun yang kurang dari sejumlah *sa'* (satuan ukuran kering) tertentu dengan jumlah tertentu, akan saya bayar sampai saya memenuhi jumlah yang ditentukan itu. Apa pun yang melebihi jumlah itu adalah milik saya.\" Ini bukanlah penjualan, melainkan spekulasi, penipuan, dan perjudian. {cite:muwatta-maruf-1997 p.150} {cite:muwatta-maruf-1997 p.151}"
