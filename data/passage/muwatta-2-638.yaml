text: "كسر عظم المسلم ميتاً، ككسره وهو حي"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عائشة زوج النبي كانت تقول: كسر عظم المسلم ميتاً ككسره وهو حي، تعني في الإثم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي عند البيهقي، وأن أحمد (6/100) أخرجه موقوفاً من طريق محمد بن عبد الله الأنصاري عن عمرة عن عائشة، وأنه رواه مرفوعاً يحيى بن سعيد الأنصاري وأخوه سعد بن سعيد عن عمرة عن عائشة عن النبي عند أحمد وأبي داود (3207) وابن ماجة (1616) وابن حبان (3167) والدارقطني والبيهقي. {cite:muwatta-maruf-1997 p.326}"
