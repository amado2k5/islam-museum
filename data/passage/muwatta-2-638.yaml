label: { ar: "الموطأ 638 — بلاغ عن عائشة: كسر عظم المسلم ميتاً ككسره وهو حي، تعني في الإثم", en: "Muwatta 638", es: "Muwatta 638", fr: "Muwatta 638", ur: "موطا 638", tr: "Al-Muwatta 638 — Aişe'den rivayet: Ölü bir Müslümanın kemiğini kırmak, günah bakımından, hayattayken kırmak gibidir.", id: "Al-Muwatta 638 — Sebuah riwayat dari Aisyah: Mematahkan tulang seorang Muslim yang telah meninggal sama seperti mematahkannya saat ia masih hidup, maksudnya dalam hal dosa." }
text: "كسر عظم المسلم ميتاً، ككسره وهو حي"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عائشة زوج النبي كانت تقول: كسر عظم المسلم ميتاً ككسره وهو حي، تعني في الإثم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي عند البيهقي، وأن أحمد (6/100) أخرجه موقوفاً من طريق محمد بن عبد الله الأنصاري عن عمرة عن عائشة، وأنه رواه مرفوعاً يحيى بن سعيد الأنصاري وأخوه سعد بن سعيد عن عمرة عن عائشة عن النبي عند أحمد وأبي داود (3207) وابن ماجة (1616) وابن حبان (3167) والدارقطني والبيهقي. {cite:muwatta-maruf-1997 p.326}"
  tr: "Malik, Peygamberin eşi Ayşe'nin şöyle dediğini işittiğini rivayet etmiştir: \"Ölü bir Müslümanın kemiğini kırmak, onu hayattayken kırmak gibidir,\" yani günah bakımından. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve Şafiî tarafından rivayet edildiğini, Beyhaki'nin de bunu kaydettiğini belirtmektedir. Ahmed (6/100), bunu Muhammed ibn Abdullah el-Ensari aracılığıyla, Amra'dan, o da Ayşe'den rivayetle bir Sahabe sözü (mevkuf) olarak kaydetmiştir. Bu hadis, Yahya ibn Sa'id el-Ensari ve kardeşi Sa'd ibn Sa'id tarafından, Amrah'tan, o da Ayşe'den, o da Peygamberimizden (marfu') rivayetle nakledilmiş bir hadis olarak da kaydedilmiştir; Ahmed, Ebu Davud (3207), İbn Majah (1616), İbn Hibban (3167), el-Daraqutni ve el-Bayhaqi tarafından da nakledilmiştir. {cite:muwatta-maruf-1997 s.326}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa Aisyah, istri Nabi, biasa berkata: \"Mematahkan tulang seorang Muslim yang telah meninggal sama seperti mematahkannya saat ia masih hidup,\" yang berarti dalam konteks dosa. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan al-Shafi'i, sebagaimana dicatat oleh al-Bayhaqi. Ahmad (6/100) memasukkannya sebagai pernyataan seorang Sahabat (mawquf) melalui Muhammad ibn Abdullah al-Ansari, berdasarkan riwayat Amrah, berdasarkan riwayat Aisyah. Hadits ini juga diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi (marfu') oleh Yahya ibn Sa'id al-Ansari dan saudaranya Sa'd ibn Sa'id, berdasarkan riwayat Amrah, berdasarkan riwayat Aisyah, berdasarkan riwayat Nabi (marfu'), sebagaimana dicatat oleh Ahmad, Abu Dawud (3207), Ibn Majah (1616), Ibn Hibban (3167), al-Daraqutni, dan al-Bayhaqi. {cite:muwatta-maruf-1997 p.326}"
