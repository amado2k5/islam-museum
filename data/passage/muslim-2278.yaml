label: { ar: "مسلم 2278 — أنا سيد ولد آدم يوم القيامة", en: "Muslim 2278 — I am the master of the children of Adam", es: "Musulmán 2278 — Yo soy el amo de los hijos de Adán", fr: "Muslim 2278 — Je suis le maître des enfants d'Adam", ur: "مسلم 2278 - میں بنی آدم کا مولا ہوں۔", tr: "Müslim 2278 — Kıyamet Gününde Âdem oğullarının efendisi benim.", id: "Muslim 2278 — Akulah pemimpin anak Adam pada Hari Kiamat" }
text: "قال رسول الله: «أنا سيد ولد آدم يوم القيامة، وأول من ينشق عنه القبر، وأول شافع وأول مشفع»"
summary:
  ar: "رواية أبي هريرة في باب «تفضيل نبينا على جميع الخلائق» من كتاب الفضائل بصحيح مسلم؛ يقرر فيها النبي سيادته يوم القيامة وأولية قبره في الانشقاق وأولية شفاعته — من أظهر نصوص الشفاعة الكبرى عند أهل السنة."
  tr: "Sahih Müslim'in Faziletler Kitabı'ndaki \"Peygamberimizin Bütün Yaratıklar Üzerindeki Üstünlüğü\" bölümünde Ebu Hurayra'nın rivayeti; burada Peygamberimiz kıyamet gününde egemenliğini, Kâbe'nin yarılmasında kabrinin önceliğini ve şefaatinin önceliğini teyit etmektedir; bu, Sünniler arasında Büyük Şefaat'in en önemli metinlerinden biridir."
  id: "Riwayat Abu Hurairah dalam surah “Keutamaan Nabi kita atas seluruh ciptaan” dari Kitab Keutamaan dalam Sahih Muslim; di dalamnya Nabi menegaskan kedaulatannya pada Hari Kiamat, keutamaan kuburnya dalam terbelahnya Ka'bah, dan keutamaan syafaatnya — salah satu teks terpenting tentang Syafaat Agung di kalangan Sunni."
