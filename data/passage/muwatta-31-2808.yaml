summary:
  ar: "يروي مالك عن عمه أبي سهيل بن مالك، عن أبيه، أنه سمع عثمان بن عفان يخطب ويقول: لا تكلفوا الأمة غير ذات الصنعة الكسب، فإنكم إن كلفتموها ذلك اضطرتها الحاجة إلى كسب المال بجسدها. ولا تكلفوا الصغير الكسب، فإنه إذا لم يجد سرق، واعفوا إذ أعفكم الله، وعليكم من المطاعم بما طاب منها. {cite:muwatta-maruf-1997 p.577}"
