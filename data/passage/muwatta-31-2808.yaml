label: { ar: "الموطأ 2808 — عثمان بن عفان يخطب: لا تكلفوا الأمة الكسب ولا الصغير", en: "Muwatta 2808", es: "Muwatta 2808", fr: "Muwatta 2808", ur: "موطا 2808", tr: "El-Muvatta 2808 — Osman ibn Affan şöyle bir hutbe veriyor: Milleti ve gençleri geçim sıkıntısıyla yüklemeyin.", id: "Al-Muwatta 2808 — Uthman bin Affan memberikan khutbah: Janganlah kalian membebani umat dengan mencari nafkah, dan jangan pula membebani kaum muda." }
summary:
  ar: "يروي مالك عن عمه أبي سهيل بن مالك، عن أبيه، أنه سمع عثمان بن عفان يخطب ويقول: لا تكلفوا الأمة غير ذات الصنعة الكسب، فإنكم إن كلفتموها ذلك اضطرتها الحاجة إلى كسب المال بجسدها. ولا تكلفوا الصغير الكسب، فإنه إذا لم يجد سرق، واعفوا إذ أعفكم الله، وعليكم من المطاعم بما طاب منها. {cite:muwatta-maruf-1997 p.577}"
  tr: "Malik, amcası Ebu Suhayl ibn Malik'ten, o da babasından rivayet ederek, Osman ibn Affan'ın bir vaaz verdiğini işittiğini ve şöyle dediğini aktarır: \"Mesleği olmayan bir cariyeyi geçimini sağlamakla yüklemeyin; çünkü bunu yaparsanız, ihtiyaçtan bedeniyle para kazanmak zorunda kalır. Bir çocuğu geçimini sağlamakla yüklemeyin; çünkü eğer bir şey bulamazsa, çalar. Allah size merhamet gösterdiğinde siz de merhametli olun ve sadece helal ve sağlıklı olanı yiyin.\" {cite:muwatta-maruf-1997 s.577}"
  id: "Malik meriwayatkan dari pamannya, Abu Suhayl ibn Malik, yang juga meriwayatkan dari ayahnya, bahwa ia mendengar Uthman ibn Affan memberikan khutbah, yang mengatakan: \"Jangan membebani seorang budak perempuan yang tidak memiliki pekerjaan dengan mencari nafkah, karena jika kalian melakukannya, ia akan terpaksa mencari nafkah dengan tubuhnya. Jangan membebani seorang anak dengan mencari nafkah, karena jika ia tidak menemukan apa pun, ia akan mencuri. Bersikaplah lunak ketika Allah telah memberikan kelonggaran kepada kalian, dan makanlah hanya apa yang halal dan sehat.\" {cite:muwatta-maruf-1997 p.577}"
