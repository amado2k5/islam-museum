label: { ar: "الموطأ 1894 — مالك: مما يشبه ذلك أن رسول الله نهى عن بيع المزابنة، وأرخص في بيع العرايا بخرصها من التمر، وإنما فرق بينهما لأن المزابنة بيع على وجه المكايسة والتجارة، وبيع العرايا على وجه المعروف", en: "Muwatta 1894", es: "Muwatta 1894", fr: "Muwatta 1894", ur: "موطا 1894", tr: "El-Muvatta 1894 — Malik: Buna benzer bir örnek olarak, Allah Resulü olgunlaşmamış hurmaların (muzabana) satışını yasaklamış, olgunlaşmamış hurmaların (araya) ise miktarlarını tahmin ederek satışına izin vermiştir. İkisini birbirinden ayırmıştır çünkü muzabana pazarlık ve ticaret esasına dayalı bir satış iken, olgunlaşmamış hurmaların (araya) satışı adet esasına dayanmaktadır.", id: "Al-Muwatta 1894 — Malik: Mirip dengan ini adalah bahwa Rasulullah SAW melarang penjualan kurma mentah (muzabana), dan memperbolehkan penjualan kurma mentah (araya) dengan memperkirakan jumlahnya. Beliau membedakan keduanya karena muzabana adalah penjualan berdasarkan tawar-menawar dan perdagangan, sedangkan penjualan kurma mentah (araya) berdasarkan kebiasaan." }
summary:
  ar: "قال مالك: وما يشبه ذلك، أن رسول الله نهى عن بيع المزابنة، وأرخص في بيع العرايا بخرصها من التمر. وإنما فرق بين ذلك، أن المزابنة بيع على وجه المكايسة والتجارة، وأن بيع العرايا على وجه المعروف، لا مكايسة فيه. {cite:muwatta-maruf-1997 p.178}"
  tr: "Malik şöyle dedi: Buna benzer bir durum da şudur ki, Allah'ın Resulü olgunlaşmamış hurmaların satışını (muzabana) yasaklamış, ancak miktarı tahmin edilerek olgunlaşmamış hurmaların satışına (araya) izin vermiştir. İkisi arasındaki fark şudur ki, muzabana pazarlık ve ticaret esasına dayalı bir satış iken, olgunlaşmamış hurmaların (araya) satışı gelenek esasına dayanır ve pazarlık içermez. {cite:muwatta-maruf-1997 s.178}"
  id: "Malik berkata: Dan sesuatu yang serupa dengan itu adalah bahwa Rasulullah SAW melarang penjualan kurma mentah (muzabana), dan memperbolehkan penjualan kurma mentah (araya) dengan memperkirakan jumlahnya. Perbedaan antara keduanya adalah bahwa muzabana adalah penjualan berdasarkan tawar-menawar dan perdagangan, sedangkan penjualan kurma mentah (araya) berdasarkan kebiasaan dan tidak melibatkan tawar-menawar. {cite:muwatta-maruf-1997 p.178}"
