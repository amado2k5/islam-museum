summary:
  ar: "قال مالك: وما يشبه ذلك، أن رسول الله نهى عن بيع المزابنة، وأرخص في بيع العرايا بخرصها من التمر. وإنما فرق بين ذلك، أن المزابنة بيع على وجه المكايسة والتجارة، وأن بيع العرايا على وجه المعروف، لا مكايسة فيه. {cite:muwatta-maruf-1997 p.178}"
