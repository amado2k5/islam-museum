text: |-
  *⁦(وى)⁩
  ٥٦٥
  وعن هبته والولاء الموالون يقال هم ولاء فلان والموالاة ضدّ المعاداة ويقسال والى بينهما
  ولا أى تابع وافعل هذه الاشيا على الولاء أى متتابعة وتوالى عليه شهران أى تتابع
  واستولى على الامدأى بلغ الغاية والولاية بالكسر السلطان والولاية والولاية النصرة
  يقال هم على ولاية أى مجتمعون فى النصرة وقال سيبويه الولاية بالفتح المصدر والولاية
  بالسكسر الاسم مثل الامارة والنقابة لانه اسم لماتوليته وقت به فاذا أرادوا المصدرفتحوا
  أبو عبدد الولية البرذعة ويقال هى التى تسكون تحت البرذعة والجمع الولايا وقواهم كالبلايا
  رؤمها فى الولاياتعنى الذاقة التى كانت تعكس على قبرصاحبها ئم تطرح الواسة على رأسها الى
  أن تموت وقواهم أولى لماته ددووعيد قال الشاعر
  فأولى ثم أولى تم أولى * وهل للدر يحلب من مرد
  قال الاصمعى معناه قاربه مايم لكه أى نزل به وأنشد
  فعادى بين هاديتين منها * وأولى أن يزيد على الثلاث
  أى مارب أن يزيد قال ثعلب ولم يغل أحد فى أولى أحسن مما قال الاصمعى وفلان أولى يكذا
  أى أحرى به وأجدريقال هو الاولى وهم الاوالى والاولون.ثال الاعلى والاعالى والاعلمون
  وتقول فى المرأة هى الوليا وه-ما الولييان وهنّ الولى وان شئت الوليدات مشل الكبرى
  والكبريات والكبر والكبريات نى لوتى الضعف والفتور والكلال والاعياه قال احرؤ
  القيس مسحّ اذا ما السابحات على الونى * أثرن الغبار بالكديد المركل
  يقال ونيت فى الامر أنى ونى وونيا أى ضعفث فأناوان قال يجدر اليمانى
  وظهر تنوفة للريح فيها • نسيم لايروع الترب واتى
  وناقة وانية وأونيتها أنا أتعبتها وأضعفتها وفلان لايي يفعل كذا أى لا يزال يفعل كذا
  وافعل ذاك بلاونية أى بلا نوان وامرأة وناة فيها فتور وقد تقلب الواوهمزة فيقسال أنا:
  وقال
  رمته أناة من ربيعة عامر • نؤم الضح فى مأتم أىّ مأتم
  وتوانى فى حاجته قصر وقول الاعشى..
  ولايدع الحدبل يشترى * يوشك الظنون ولا بالتون
  أراد التوانى فخذف الالف لاجتماع الساكنن لات القافسة موقوفة والممناءكلاءالسن
  ومرفؤها وهو مفعال من الونى ⁦(وهى)⁩ وهى السقاميهى وهيا اذا تخزق وانشق وفى
  السقاء وهى بالتسكين ووهية أيضاعلى التصغيروهو خرق قليل وفى المثل خل سبيل من وهى
  مقاؤه ومن ه ريق بالفلاة ماؤه بضرب ان لا يستقيم أمره ووهى الحائط اذا ضعف وهمّ
  بالسة وط ويقال ضربه فأوهي يده أى أصابهنا كسر أوما أشبه ذلك ووهت عزالى السماء
  بمائها وكذلك كل شى استرخر بالمه وأوهيت السقاء فوهى وهو أن ينهأللتخرّق بقال
  أوهيت وهيا فارة عه وقواهم غادروهية لا ترقع أى فتقالا يقدر على دتقه ⁦(وى)⁩، وى
  كلة تعجب ويقال ويك ووى لعبد اللّٰه وقد تد خل وى على كأن الحخففة والمشقدة تقول
  وى كأن ووى كأن قال الحليل هى مقصولة تقول وى ثم يبتدئ فتقول كأن قال الشاءر
  وى كأن من يكن له نشب يحشبب ومن يفتة ربعش عيش ضر
