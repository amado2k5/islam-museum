text: "… بعضهم : رأيت عليا قد اشترى لحما بدرهم لحمله فى ملحفته، فقلت له : أحمل عنك يا أمير المؤمنين فقال : لا، أبو ألعيال أحق أن يحمل. ومنها اللباس إذ يظهر به التكير والتواضع وقد قال الني البذاذة من الإيمان، …"
summary:
