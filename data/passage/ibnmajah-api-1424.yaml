label: { ar: "سنن ابن ماجه 1424 — كتابة الحسنات، رفع الدرجات", en: "Sunan Ibn Majah 1424 — the writing of good deeds; ranks raised", ur: "سنن ابن ماجہ 1424 — نیکیوں کا لکھا جانا، درجات کی بلندی" }
text: "… بْنُ عُثْمَانَ الدِّمَشْقِيُّ، حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، عَنْ خَالِدِ بْنِ يَزِيدَ الْمُرِّيِّ، عَنْ يُونُسَ بْنِ مَيْسَرَةَ بْنِ حَلْبَسٍ، عَنِ الصُّنَابِحِيِّ، عَنْ عُبَادَةَ بْنِ الصَّامِتِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ ـ يَقُولُ \" مَا مِنْ عَبْدٍ يَسْجُدُ لِلَّهِ سَجْدَةً إِلاَّ كَتَبَ اللَّهُ لَهُ بِهَا حَسَنَةً وَمَحَا عَنْهُ بِهَا سَيِّئَةً وَرَفَعَ لَهُ بِهَا دَرَجَةً فَاسْتَكْثِرُوا مِنَ السُّجُودِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1424، يذكر كتابة الحسنات، ورفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1424 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of the writing of good deeds, ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1424، جس میں نیکیوں کا لکھا جانا، درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
