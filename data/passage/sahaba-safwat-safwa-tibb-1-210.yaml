text: "… إصبعين من أصابعه عند الجمرة في الزحام فمرض، فأتاه الحجاج يعوده فغمض عينيه، فكلمه الحجاج فلم يكلمه. وعن نافع قال: كان زج رمح رجل من أصحاب الحجاج قد أصاب رجل ابن عمر فاندمل الجرح، فلما صدر انتقض عليه، فدخل الحجاج …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 210، يذكر المرض والمريض، وعيادة المريض، ومداواة الجراح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 210, that mentions illness and the sick, visiting the sick, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 210 کا اقتباس جس میں بیماری اور بیمار، بیمار کی عیادت، زخموں کا علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen escaneado 1, pág. 210, que menciona la enfermedad y los enfermos, la visita a los enfermos y el tratamiento de las heridas; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Sifat al-Safwa d'Ibn al-Jawzi, volume 1 scanné, p. 210, qui mentionne la maladie et les malades, la visite aux malades, le traitement des blessures; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin resimli 1. cildinin 210. sayfasından, hastalık ve hastaları, hasta ziyaretini ve yara tedavisini anlatan bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari kitab “Sifat al-Safwa” karya Ibn al-Jawzi, jilid 1 bergambar, halaman 210, yang membahas tentang penyakit dan orang sakit, mengunjungi orang sakit, dan mengobati luka; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
