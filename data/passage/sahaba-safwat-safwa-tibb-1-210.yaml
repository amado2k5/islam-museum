text: "… إصبعين من أصابعه عند الجمرة في الزحام فمرض، فأتاه الحجاج يعوده فغمض عينيه، فكلمه الحجاج فلم يكلمه. وعن نافع قال: كان زج رمح رجل من أصحاب الحجاج قد أصاب رجل ابن عمر فاندمل الجرح، فلما صدر انتقض عليه، فدخل الحجاج …"
