text: "… نَكَحَ امْرَأَةً فَدَخَلَ بِهَا أَوْ لَمْ يَدْخُلْ فَلَا تَحِلُّ لَهُ أُمُّهَا. وأما المسألة الرابعة: فاختلفوا في الزنا هل يوجب من التحريم في هؤلاء ما يوجب الوطء في نكاح صحيح أو بشبهة؟ أعني: الذي يدرأ فيه الحد، فقال الشافعي: الزنا بالمرأة …"
summary:
