label: { ar: "صحيح البخاري 4991 — الأحرف السبعة، قراءات القرآن", en: "Sahih al-Bukhari 4991 — the seven ahruf; the readings of the Qur'an", ur: "صحیح بخاری 4991 — سبعہ احرف، قرآن کی قراءتیں", es: "Sahih al-Bukhari 4991 — los siete ahruf; las lecturas del Corán", fr: "Sahih al-Bukhari 4991 — les sept ahruf; les lectures du Coran", tr: "Sahih el-Buhari 4991 — Yedi Harf, Kur'an'ın Okunuşları", id: "Sahih al-Bukhari 4991 — Tujuh Huruf, Bacaan Al-Qur'an" }
text: "حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، قَالَ حَدَّثَنِي اللَّيْثُ، قَالَ حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، قَالَ حَدَّثَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ، أَنَّ ابْنَ عَبَّاسٍما ـ حَدَّثَهُ أَنَّ رَسُولَ اللَّهِ قَالَ \" أَقْرَأَنِي جِبْرِيلُ عَلَى حَرْفٍ فَرَاجَعْتُهُ، فَلَمْ أَزَلْ أَسْتَزِيدُهُ وَيَزِيدُنِي حَتَّى انْتَهَى إِلَى سَبْعَةِ أَحْرُفٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4991، يذكر الأحرف السبعة، وقراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 4991 (Virtues of the Qur'an), that mentions the seven ahruf, the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 4991، جس میں سبعہ احرف، قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4991 (Virtudes del Corán), menciona los siete ahruf, las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sahih al-Bukhari, n° 4991 (Vertus du Coran), mentionne les sept lectures du Coran (ahruf). Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ces lectures avec les textes coraniques, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "Sahih el-Buhari'de 4991 numaralı hadis, Kur'an'ın yedi farklı okunuş şeklini ve çeşitli tilaveti zikrediyor. Bu hadis, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4991, menyebutkan tujuh cara membaca dan berbagai macam bacaan Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
