label: { ar: "الموطأ 130 — ابن عمر يعرق في الثوب وهو جنب ثم يصلي فيه", en: "Muwatta 130" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب جامع غسل الجنابة: كان عبد الله بن عمر يعرق في ثوبه وهو جنب ثم يصلي فيه، أي أن عرق الجنب طاهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند البيهقي وابن مهدي عند ابن أبي شيبة وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.97} {cite:muwatta-maruf-1997 p.98}"
