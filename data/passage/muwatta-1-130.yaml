label: { ar: "الموطأ 130 — ابن عمر يعرق في الثوب وهو جنب ثم يصلي فيه", en: "Muwatta 130", es: "130 Muwatta", fr: "130 Muwatta", ur: "130 موطا", tr: "El-Muvatta 130 — İbn Ömer, ritüel kirlilik halindeyken elbisesinin içinde terler, sonra da o elbiseyle namaz kılar.", id: "Al-Muwatta 130 — Ibnu Umar berkeringat di pakaiannya ketika dalam keadaan najis, lalu shalat dengan pakaian itu." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب جامع غسل الجنابة: كان عبد الله بن عمر يعرق في ثوبه وهو جنب ثم يصلي فيه، أي أن عرق الجنب طاهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند البيهقي وابن مهدي عند ابن أبي شيبة وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.97} {cite:muwatta-maruf-1997 p.98}"
  tr: "Malik'in Nafi'den rivayet ettiği, cinsel ilişkiden sonraki ritüel temizliğe ilişkin genel hükümler bölümünde yer alan bir rivayete göre: Abdullah ibn Umar, ritüel kirlilik halindeyken elbisesinde terler ve sonra o elbiseyle namaz kılardı; bu da ritüel kirlilik halindeki bir kişinin terinin temiz olduğu anlamına gelir. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, Suwaid ve İbn Wahb tarafından (el-Bayhaqi'ye göre), İbn Mehdi tarafından (İbn Abi Şeybe'ye göre) ve Abdülrazzak ile Muhammed ibn Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.97} {cite:muwatta-maruf-1997 s.98}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’, dalam bab tentang hukum umum mengenai penyucian ritual setelah hubungan seksual: Abdullah ibn Umar biasa berkeringat di pakaiannya ketika dalam keadaan najis dan kemudian shalat dengan pakaian tersebut, artinya keringat seseorang dalam keadaan najis adalah suci. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, dan Ibn Wahb menurut al-Bayhaqi, dan oleh Ibn Mahdi menurut Ibn Abi Shaybah, dan oleh Abd al-Razzaq dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.97} {cite:muwatta-maruf-1997 p.98}"
