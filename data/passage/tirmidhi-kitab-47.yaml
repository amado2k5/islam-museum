summary:
  ar: "القسم 47 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب تفسير القرآن عن رسول الله»، ويضم فيها النصوص من 2950 إلى 3723 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 47 of Jami' al-Tirmidhi (Chapters on Tafsir) in the division of the open hadith dataset the museum took its reports from: reports 2950 to 3723 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 47، عنوان «کتاب تفسیر القرآن عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2950 تا 3723۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 47 de Jami' al-Tirmidhi (Capítulos sobre Tafsir) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2950 al 3723, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 47 de Jami' al-Tirmidhi (Chapitres sur le Tafsir), qui comprend les hadiths 2950 à 3723 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
