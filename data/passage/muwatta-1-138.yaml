label: { ar: "الموطأ 138 — مالك: ليس واجد الماء بأطهر من المتيمم", en: "Muwatta 138" }
summary:
  ar: "قول لمالك يرويه يحيى في باب التيمم: من قام إلى الصلاة فلم يجد ماءً فعمل بما أمره الله به من التيمم فقد أطاع الله، وليس الذي وجد الماء بأطهر منه ولا أتم صلاة، لأنهما أُمرا جميعاً فكل عمل بما أمره الله به؛ وإنما الوضوء لمن وجد الماء والتيمم لمن لم يجده قبل أن يدخل في الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.100}"
