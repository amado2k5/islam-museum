label: { ar: "الموطأ 138 — مالك: ليس واجد الماء بأطهر من المتيمم", en: "Muwatta 138", es: "Muwatta 138", fr: "Muwatta 138", ur: "موطا 138", tr: "El-Muvatta 138 — Malik: Su bulan, teyemmüm yapandan daha temiz değildir.", id: "Al-Muwatta 138 — Malik: Orang yang menemukan air tidak lebih suci daripada orang yang melakukan tayammum" }
summary:
  ar: "قول لمالك يرويه يحيى في باب التيمم: من قام إلى الصلاة فلم يجد ماءً فعمل بما أمره الله به من التيمم فقد أطاع الله، وليس الذي وجد الماء بأطهر منه ولا أتم صلاة، لأنهما أُمرا جميعاً فكل عمل بما أمره الله به؛ وإنما الوضوء لمن وجد الماء والتيمم لمن لم يجده قبل أن يدخل في الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.100}"
  tr: "Yahya'nın teyemmüm bölümünde rivayet ettiği, Malik'e atfedilen bir hadis şöyledir: \"Namaz için ayağa kalkıp su bulamayan, fakat Allah'ın emrettiği gibi teyemmüm eden kimse, Allah'a itaat etmiş olur. Su bulan kimse daha temiz değildir ve namazı daha eksiksiz kılmıştır; çünkü her ikisi de emredilmiştir ve her biri Allah'ın emrine göre yapılmıştır. Abdest, ancak su bulanlar içindir, teyemmüm ise su bulamayanlar içindir ve namaza başlamadan önce yapılır.\" Editör, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.100}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dalam bab tentang tayammum: Barang siapa yang berdiri untuk shalat dan tidak menemukan air, namun melakukan tayammum sebagaimana diperintahkan Allah, maka ia telah taat kepada Allah. Orang yang menemukan air tidaklah lebih suci atau telah melakukan shalat yang lebih sempurna, karena keduanya diperintahkan, dan masing-masing bertindak sesuai dengan perintah Allah. Wudhu hanya untuk mereka yang menemukan air, dan tayammum untuk mereka yang tidak menemukannya, sebelum memulai shalat. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.100}"
