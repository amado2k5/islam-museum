text: "… خالة له قد كان بينهما بعض الشيء فاستغفر لها واستغفرت له ثم عاد إِلى المجلس، فقال رسول اللّٰه : إِن الرحمة لا تنزل على قاطع رحم وروى عن الحسن البصري أنه قال : ابن آدم إنك لو تجد حقيقة الإيمان …"
summary:
