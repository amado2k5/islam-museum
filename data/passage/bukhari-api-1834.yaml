label: { ar: "صحيح البخاري 1834 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 1834 — what was made lawful; what is not lawful", ur: "صحیح بخاری 1834 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 1834 — Lo que se ha hecho lícito; lo que no es lícito" }
text: "… لاَ هِجْرَةَ وَلَكِنْ جِهَادٌ وَنِيَّةٌ، وَإِذَا اسْتُنْفِرْتُمْ فَانْفِرُوا، فَإِنَّ هَذَا بَلَدٌ حَرَّمَ اللَّهُ يَوْمَ خَلَقَ السَّمَوَاتِ وَالأَرْضَ، وَهُوَ حَرَامٌ بِحُرْمَةِ اللَّهِ إِلَى يَوْمِ الْقِيَامَةِ، وَإِنَّهُ لَمْ يَحِلَّ الْقِتَالُ فِيهِ لأَحَدٍ قَبْلِي، وَلَمْ يَحِلَّ لِي إِلاَّ سَاعَةً مِنْ نَهَارٍ، فَهُوَ حَرَامٌ بِحُرْمَةِ اللَّهِ إِلَى يَوْمِ الْقِيَامَةِ، لاَ يُعْضَدُ شَوْكُهُ، وَلاَ يُنَفَّرُ صَيْدُهُ، وَلاَ يَلْتَقِطُ لُقَطَتَهُ إِلاَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1834، يذكر ما أُحل، وما لا يحل، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1834 (Penalty of Hunting while on Pilgrimage), that mentions what was made lawful, what is not lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1834، جس میں جو حلال کیا گیا، جو حلال نہیں، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1834 (Castigo de la caza durante la peregrinación), menciona lo que es lícito, lo que no lo es y lo que es ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
