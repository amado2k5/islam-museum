label: { ar: "نوادر جحا الكبرى، ص 185 — «هل رأيتم جنازة حبشية كفنها معي؟»", en: "Nawadir Juha al-Kubra, p. 185 — 'Have You Seen an Abyssinian Funeral Whose Shroud I Carry?'", ur: "نوادر جحا الکبریٰ، ص 185 — «کیا کسی نے حبشی جنازہ دیکھا ہے جس کا کفن میرے پاس ہے؟»", fr: "Nawadir Juha al-Kubra, p. 185 — « Avez-vous vu un cortège funèbre abyssin dont je porte le linceul ? »", es: "Nawadir Juha al-Kubra, p. 185 — «¿Han visto un funeral abisinio cuyo sudario llevo yo?»", tr: "Juha'nın Büyük Fıkraları, s. 185 — “Benim elimdeki kefeni taşıyan bir Habeşistan cenaze alayını gördünüz mü?”", id: "Anekdot Hebat Juha, hlm. 185 — “Pernahkah Anda melihat prosesi pemakaman Abyssinia yang kain kafannya saya miliki?”" }
text: "… هل رأيتم جنازة حبشية كفنها معي؟ مات لأبيه جاريةً حبشيةٌ، فبعثهُ أبوه إلى السوق لِيشتري لها كفناً. فأبطأ عليه حتى أنفذ غيره، وجاء بكفن وحُملت الجنازة، فجاء جحا، وهو يعدو في المقابر، ويقول: هل رأيتم جنازة حبشيةٍ كفنها معي؟ رأس …"
summary:
  ar: "ماتت جارية، فأرسل سيدها جحا ليشتري كفناً لكنه تأخر، فوصل كفن آخر وبدأت الجنازة، فركض جحا في المقبرة صائحاً هل رأى أحد جنازة حبشية كفنها معه. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  en: "A slave-girl dies; her master sends Juha to buy a shroud, but Juha is slow; another shroud arrives and the funeral starts; Juha runs through the cemetery shouting whether anyone has seen an Abyssinian funeral whose shroud he carries. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  ur: "ایک کنیز مر گئی، اس کے مالک نے جحا کو کفن خریدنے بھیجا مگر جحا نے دیر کر دی، ایک اور کفن آ گیا اور جنازہ شروع ہو گیا، تو جحا قبرستان میں دوڑتا اور پکارتا پھرا کہ کیا کسی نے حبشی جنازہ دیکھا ہے جس کا کفن اس کے پاس ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  fr: "Une esclave meurt ; son maître envoie Juha acheter un linceul, mais Juha tarde ; un autre linceul arrive et les funérailles commencent ; Juha court à travers le cimetière en criant pour demander si quelqu'un a vu un cortège funèbre abyssin dont il porte le linceul. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  es: "Muere una esclava; su amo envía a Juha a comprar un sudario, pero Juha se demora; llega otro sudario y comienza el funeral; Juha corre por el cementerio gritando si alguien ha visto un funeral abisinio cuyo sudario lleva él. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  tr: "Bir köle kız öldü, bu yüzden efendisi Juha'yı kefen almaya gönderdi, ancak Juha geç kaldı. Başka bir kefen geldi ve cenaze başladı. Juha mezarlıkta koşarak, \"Bir Habeşli kadının cenazesini gören oldu mu? Kefeni bende!\" diye bağırdı. {cite:juha-nawadir-kubra-djuwaydi s. 185}"
  id: "Seorang budak perempuan meninggal, jadi tuannya menyuruh Juha untuk membeli kain kafan, tetapi ia terlambat. Kain kafan lain tiba, dan pemakaman pun dimulai. Juha berlari melewati pemakaman sambil berteriak, \"Apakah ada yang melihat pemakaman seorang wanita Abyssinia? Aku membawa kain kafannya!\" {cite:juha-nawadir-kubra-djuwaydi p. 185}"
