text: "وقال آخرون في كل سماء بيت يعمره ملائكته بالعبادة فيه ويفدون إليه بالنوبة والبدل … وأنه رابع أربعة عشر بيتاً في كل سماء بيت وفي كل أرض بيت لو سقطت سقط بعضها على بعض"
summary:
  ar: "يذكر ابن كثير، بعد البيت المعمور، قولاً بأن في كل سماء بيتاً تعمره ملائكتها، وأثراً عن مجاهد بأن في كل سماء وأرض بيتاً، فيكون الحرم رابع أربعة عشر."
  en: "After the Frequented House, Ibn Kathir records a view that each heaven has a house kept by its own angels, and a report from Mujahid of a house in every heaven and every earth, with the Sanctuary fourth of fourteen."
  es: "Después de la Casa Frecuentada, Ibn Kathir registra la opinión de que cada cielo tiene una casa mantenida por sus propios ángeles, y un informe de Mujahid sobre una casa en cada cielo y en cada tierra, siendo el Santuario el cuarto de catorce."
  fr: "Après la Maison Fréquentée, Ibn Kathir rapporte l'opinion selon laquelle chaque ciel possède une maison gardée par ses propres anges, et un récit de Mujahid faisant état d'une maison dans chaque ciel et sur chaque terre, le Sanctuaire étant le quatrième sur quatorze."
  ur: "تعدد خانہ کے بعد ابن کثیر نے ایک نظریہ درج کیا ہے کہ ہر آسمان کا ایک گھر ہوتا ہے جو اس کے اپنے فرشتوں کے پاس ہوتا ہے اور ہر آسمان اور ہر زمین میں ایک مکان کی مجتہد کی طرف سے روایت ہے جس میں چودہویں چوتھے کو حرم ہے۔"
