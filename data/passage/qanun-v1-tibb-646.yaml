text: "… سدد الكبد وصلابة الطحال. أعضاء النفض : يدرّ الطمث، ويخرج الجنين، ويقتل الديدان، ويدرّ البول، ويسقى منه وزن درهمين للمغص، وأوجاع الرحم، وينفع من القولنج، والصغير قد يسهل طبيخه مع البلغم والخام الصفراء ويسقاه، وإذا أقرطه أسهل دماً خصوصاً الدقيق. …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 646، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، وأطوار خلق الجنين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 646, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, the stages of the embryo; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 646 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، جنین کے مراحل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
