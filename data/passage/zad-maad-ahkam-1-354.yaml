text: "… اللَّهِ الَّذِينَ يُقَتِلُونَكُم البَقَرَة:. ثم فرض عليهم قتالَ المشرِكينَ كافَّة، وكان محرَّماً، ثم مأذوناً به، ثم ماموراً به لمن بدأهم بالقتال، ثم مأموراً به لجميع المشركين إما فرضَ عينٍ على أحد القولين، أو فرضَ كِفاية على المشهور. التحقيق في مسالة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 354، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض العين، وفرض الكفاية؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 354, whose wording mentions what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 354 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ عین، فرضِ کفایہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Zad al-Ma'ad de Ibn al-Qayyim, volume numérisé 1, p. 354, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen digitalizado 1, p. 354, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 1. cildinin 354. sayfasından bir alıntı, bireysel farz (meslekî yükümlülükler), toplu farz (mesîrî yükümlülükler) ve toplu farz (mesîrî yükümlülükler) dahil olmak üzere insanlar üzerine farz olan şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 1, halaman 354, membahas tentang kewajiban bagi manusia, termasuk kewajiban individu (fard), kewajiban kolektif (fard 'ayn), dan kewajiban kolektif (fard kifayah). Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk perbuatan wajib, tugas, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
