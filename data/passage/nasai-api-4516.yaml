label: { ar: "سنن النسائي 4516 — الأب والأبوة", en: "Sunan al-Nasa'i 4516 — the father and fatherhood", ur: "سنن نسائی 4516 — باپ اور والدیت", es: "Sunan al-Nasa'i 4516 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4516 — Le père et la paternité", tr: "Sunan an-Nasa'i 4516 — Baba ve Babalık", id: "Sunan an-Nasa'i 4516 — Sang Ayah dan Peran Ayah" }
text: "أَخْبَرَنَا هَارُونُ بْنُ زَيْدِ بْنِ أَبِي الزَّرْقَاءِ، قَالَ حَدَّثَنَا أَبِي قَالَ، حَدَّثَنَا جَعْفَرُ بْنُ بُرْقَانَ، قَالَ بَلَغَنِي عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، قَالَ نَهَى رَسُولُ اللَّهِ عَنْ لُبْسَتَيْنِ وَنَهَانَا رَسُولُ اللَّهِ عَنْ بَيْعَتَيْنِ عَنِ الْمُنَابَذَةِ وَالْمُلاَمَسَةِ وَهِيَ بُيُوعٌ كَانُوا يَتَبَايَعُونَ بِهَا فِي الْجَاهِلِيَّةِ."
summary:
  ar: "حديث في سنن النسائي، رقم 4516، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4516 (The Book of Financial Transactions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4516، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4516 (El Libro de las Transacciones Financieras), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4516 (Le Livre des transactions financières), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 4516 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4516, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
