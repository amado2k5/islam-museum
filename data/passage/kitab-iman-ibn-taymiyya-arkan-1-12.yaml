text: "… الخلق، وستأتي الأحاديث الصحيحة بأنه جعل الأعمال الظاهرة من الإيمان كقوله الإيمان بضع وسبعون شعبة أعلاها قول لا إله إلا اللّٰه وأدناها إماطة الأذى عن الطريق وقوله لوقد عبد القيس، آمركم بالإيمان بالله وحده، أتدرون ما الإيمان، بالله وحده؟ شهادة …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 12، يذكر الإيمان بضع وسبعون شعبة، وما عُدّ من الإيمان، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 12, that mentions faith as seventy-odd branches, what is counted as part of faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 12 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، جو ایمان میں سے گنا گیا، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 12, que menciona la fe como setenta y tantos pilares, lo que se considera parte de la fe, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Un extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 12) mentionne la foi comme étant composée d'une soixantaine de branches, considérées comme faisant partie intégrante de la foi et constituant l'un des articles de foi. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
