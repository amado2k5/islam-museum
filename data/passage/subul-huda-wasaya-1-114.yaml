text: "… للغة قوم ما هي بلغة آهل هذا البلد فقلنا: نحن قوم من مضر قال: من أي المضاء قال: قلنا: من خندف فقال: أما أنه سيبعث منكم وشيكاً نبي فسارعوا إليه وخذوا حظكم منه ترشدوا فإنه خاتم النبيير نقلنا: ما اسمه …"
summary:
