label: { ar: "الموطأ 1027 — ابن دينار عن ابن عمر عن النبي: خمس من الدواب من قتلهن وهو محرم فلا جناح عليه: العقرب، والفأرة، والغراب، والحدأة، والكلب العقور", en: "Muwatta 1027", es: "Muwatta 1027", fr: "Muwatta 1027", ur: "موطا 1027", tr: "El-Muvatta 1027 — İbn Dinar, İbn Ömer'den, o da Peygamberimizden rivayetle: İhramlı iken beş hayvanı öldürmekte bir sakınca yoktur: akrep, fare, karga, çaylak ve kuduz köpek.", id: "Al-Muwatta 1027 — Ibn Dinar dari Ibn Umar dari Nabi: Tidak ada dosa membunuh lima hewan dalam keadaan ihram: kalajengking, tikus, gagak, elang, dan anjing gila" }
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أن رسول الله قال: خمس من الدواب من قتلهن وهو محرم فلا جناح عليه: العقرب، والفأرة، والغراب، والحدأة، والكلب العقور. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1184) والبخاري وأبو داود وغيرهم. {cite:muwatta-maruf-1997 p.479}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den naklederek, Allah Resulü'nün şöyle buyurduğunu rivayet etmiştir: \"İhramlı iken beş hayvanı öldürmekte bir sakınca yoktur: akrep, fare, karga, çaylak ve kuduz köpek.\" Araştırmacı, bu hadisin Malik'ten nakledilerek Ebu Musab (1184), Buhari, Ebu Davud ve diğerleri tarafından da aktarıldığını belirtmektedir. {cite:muwatta-maruf-1997 s.479}"
  id: "Malik meriwayatkannya dari Abdullah ibn Dinar, dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: “Tidak ada dosa membunuh lima hewan dalam keadaan ihram: kalajengking, tikus, gagak, elang, dan anjing gila.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1184), al-Bukhari, Abu Dawud, dan lainnya. {cite:muwatta-maruf-1997 p.479}"
