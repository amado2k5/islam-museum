label: { ar: "الموطأ 1027 — ابن دينار عن ابن عمر عن النبي: خمس من الدواب من قتلهن وهو محرم فلا جناح عليه: العقرب، والفأرة، والغراب، والحدأة، والكلب العقور", en: "Muwatta 1027" }
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أن رسول الله قال: خمس من الدواب من قتلهن وهو محرم فلا جناح عليه: العقرب، والفأرة، والغراب، والحدأة، والكلب العقور. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1184) والبخاري وأبو داود وغيرهم. {cite:muwatta-maruf-1997 p.479}"
