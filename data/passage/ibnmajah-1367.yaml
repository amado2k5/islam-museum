label:
  ar: "ابن ماجه 1367 — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Ibn Majah 1367 — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "ابن ماجہ 1367 — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
  es: "Ibn Majah 1367 — Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda?"
  fr: "Ibn Majah 1367 — Notre Seigneur descend dans le dernier tiers de la nuit: qui M’invoquera afin que Je réponde ?"
  tr: "İbn Majah 1367 — Rabbimiz gecenin son üçte birinde iner: “Kim bana dua edecek de ona icabet edeyim?”"
  id: "Ibn Majah 1367 — Tuhan kita turun pada sepertiga malam terakhir: “Siapa yang akan memohon kepada-Ku, sehingga Aku dapat mengabulkannya?”"
text: "إن الله يمهل حتى إذا ذهب من الليل نصفه أو ثلثاه قال لا يسألن عبادي غيري من يدعني أستجب له من يسألني أعطه من يستغفرني أغفر له حتى يطلع الفجر ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1367: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1367: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1367: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 1367: Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 1367: Notre Seigneur descend au cours du dernier tiers de la nuit: qui M’invoquera afin que Je réponde ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 1367: Tuhan kita turun pada sepertiga malam terakhir, berfirman: “Siapa yang akan memohon kepada-Ku, maka Aku akan mengabulkannya?” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
