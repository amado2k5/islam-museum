label:
  ar: "ابن ماجه 1367 — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Ibn Majah 1367 — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "ابن ماجہ 1367 — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
text: "إن الله يمهل حتى إذا ذهب من الليل نصفه أو ثلثاه قال لا يسألن عبادي غيري من يدعني أستجب له من يسألني أعطه من يستغفرني أغفر له حتى يطلع الفجر ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1367: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1367: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1367: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
