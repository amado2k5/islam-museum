summary:
  ar: "إذا حلف المدّعون استحقوا دم صاحبهم وقتلوا من حلفوا عليه؛ ولا يُقتل في القسامة إلا واحد، ويحلف خمسون من ولاة الدم خمسين يمينًا، فإن قلّ عددهم أو نكل بعضهم رُدّت الأيمان عليهم."
