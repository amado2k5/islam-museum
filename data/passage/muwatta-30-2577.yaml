label: { ar: "الموطأ 2577 — مالك: لا يُقتل في القسامة إلا واحد، وتُرد الأيمان على من بقي من الورثة", en: "Muwatta 2577" }
summary:
  ar: "قال مالك: فإن حلف المدعون استحقوا دم صاحبهم وقتلوا من حلفوا عليه. ولا يُقتل في القسامة إلا واحد، لا يُقتل فيها اثنان. يحلف من ولاة الدم خمسون رجلا خمسين يمينا؛ فإن قل عددهم أو نكل بعضهم رُدت الأيمان عليهم، إلا أن ينكل أحد من ولاة المقتول الذين يجوز لهم العفو عنه، فإن نكل أحد من أولئك فلا سبيل إلى الدم. قال يحيى: قال مالك: وإنما تُرد الأيمان على من بقي منهم إذا نكل أحد ممن لا يجوز له عفو، وإن كان واحدا من ولاة الدم الذين يجوز لهم العفو فلا تُرد الأيمان على من بقي. {cite:muwatta-maruf-1997 p.454} {cite:muwatta-maruf-1997 p.455}"
