label: { ar: "الموطأ 2577 — مالك: لا يُقتل في القسامة إلا واحد، وتُرد الأيمان على من بقي من الورثة", en: "Muwatta 2577", es: "Muwatta 2577", fr: "Muwatta 2577", ur: "موطا 2577", tr: "Al-Muwatta 2577 — Malik: Arınma yemininde yalnızca bir kişi öldürülür ve yeminler kalan mirasçılara iade edilir.", id: "Al-Muwatta 2577 — Malik: Hanya satu orang yang terbunuh dalam sumpah penyucian, dan sumpah tersebut dikembalikan kepada ahli waris yang tersisa." }
summary:
  ar: "قال مالك: فإن حلف المدعون استحقوا دم صاحبهم وقتلوا من حلفوا عليه. ولا يُقتل في القسامة إلا واحد، لا يُقتل فيها اثنان. يحلف من ولاة الدم خمسون رجلا خمسين يمينا؛ فإن قل عددهم أو نكل بعضهم رُدت الأيمان عليهم، إلا أن ينكل أحد من ولاة المقتول الذين يجوز لهم العفو عنه، فإن نكل أحد من أولئك فلا سبيل إلى الدم. قال يحيى: قال مالك: وإنما تُرد الأيمان على من بقي منهم إذا نكل أحد ممن لا يجوز له عفو، وإن كان واحدا من ولاة الدم الذين يجوز لهم العفو فلا تُرد الأيمان على من بقي. {cite:muwatta-maruf-1997 p.454} {cite:muwatta-maruf-1997 p.455}"
  tr: "Malik şöyle dedi: Hak iddia edenler yemin ederlerse, akrabalarının kanına hak kazanırlar ve yemin ettikleri kişiyi öldürebilirler. İntikam yemininde (kasama) sadece bir kişi öldürülür; iki kişi öldürülmez. Akrabalar arasından elli kişi elli yemin eder. Sayıları azsa veya bazıları reddederse, öldürülen kişinin affetme yetkisi olan akrabalarından biri reddetmedikçe yeminler onlara iade edilir. Eğer bunlardan biri reddederse, kan intikamına başvurulamaz. Yahya şöyle dedi: Malik şöyle dedi: Affetmeye yetkisi olmayanlardan biri reddederse, yeminler kalanlara iade edilir. Affetmeye yetkisi olan akrabalardan biri reddederse, yeminler kalanlara iade edilmez. {cite:muwatta-maruf-1997 s.454} {cite:muwatta-maruf-1997 s.455}"
  id: "Malik berkata: Jika para penuntut bersumpah, mereka berhak atas darah kerabat mereka dan boleh membunuh orang yang mereka sumpahi. Hanya satu orang yang dibunuh dalam sumpah pembalasan (qasama); dua orang tidak. Lima puluh orang dari antara kerabat darah bersumpah lima puluh kali. Jika jumlah mereka sedikit, atau jika sebagian dari mereka menolak, sumpah dikembalikan kepada mereka, kecuali jika salah satu kerabat darah orang yang terbunuh yang diizinkan untuk memaafkannya menolak. Jika salah satu dari mereka menolak, maka tidak ada jalan untuk melakukan pembalasan darah. Yahya berkata: Malik berkata: Sumpah dikembalikan kepada mereka yang tersisa jika salah satu dari mereka yang tidak diizinkan untuk memaafkan menolak. Jika salah satu kerabat darah yang diizinkan untuk memaafkan menolak, maka sumpah tidak dikembalikan kepada mereka yang tersisa. {cite:muwatta-maruf-1997 p.454} {cite:muwatta-maruf-1997 p.455}"
