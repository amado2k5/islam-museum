label: { ar: "سنن أبي داود 1067 — ما وجب على كل مسلم، الواجب", en: "Sunan Abi Dawud 1067 — a duty laid on every Muslim; the obligatory (wajib)", ur: "سنن ابی داؤد 1067 — جو ہر مسلمان پر لازم ہے، واجب", fr: "Sunan Abi Dawud 1067 — un devoir imposé à chaque musulman ; l'obligatoire (wajib)", es: "Sunan Abi Dawud 1067 — un deber impuesto a cada musulmán; lo obligatorio (wajib)" }
text: "… إِسْحَاقُ بْنُ مَنْصُورٍ، حَدَّثَنَا هُرَيْمٌ، عَنْ إِبْرَاهِيمَ بْنِ مُحَمَّدِ بْنِ الْمُنْتَشِرِ، عَنْ قَيْسِ بْنِ مُسْلِمٍ، عَنْ طَارِقِ بْنِ شِهَابٍ، عَنِ النَّبِيِّ قَالَ \" الْجُمُعَةُ حَقٌّ وَاجِبٌ عَلَى كُلِّ مُسْلِمٍ فِي جَمَاعَةٍ إِلاَّ أَرْبَعَةً عَبْدٌ مَمْلُوكٌ أَوِ امْرَأَةٌ أَوْ صَبِيٌّ أَوْ مَرِيضٌ \". قَالَ أَبُو دَاوُدَ طَارِقُ بْنُ شِهَابٍ قَدْ رَأَى النَّبِيَّ وَلَمْ يَسْمَعْ مِنْهُ شَيْئًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 1067، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وحق على كل مسلم. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 1067 (Prayer (Kitab Al-Salat)), whose wording mentions a duty laid on every Muslim, the obligatory (wajib), a right due from every Muslim. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 1067، جس کے الفاظ میں جو ہر مسلمان پر لازم ہے، واجب، ہر مسلمان پر حق کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 1067, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), un droit dû par chaque musulman. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 1067, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), un derecho debido por cada musulmán. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
