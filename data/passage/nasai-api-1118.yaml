label: { ar: "سنن النسائي 1118 — الأب والأبوة", en: "Sunan al-Nasa'i 1118 — the father and fatherhood", ur: "سنن نسائی 1118 — باپ اور والدیت", es: "Sunan al-Nasa'i 1118 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1118 — le père et la paternité" }
text: "… قَالَ أَبُو عَلِيٍّ حَدَّثَنَا وَقَالَ، عُثْمَانُ أَنْبَأَنَا دَاوُدُ بْنُ قَيْسٍ، عَنْ إِبْرَاهِيمَ بْنِ عَبْدِ اللَّهِ بْنِ حُنَيْنٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، - - قَالَ نَهَانِي حِبِّي عَنْ ثَلاَثٍ - لاَ أَقُولُ نَهَى النَّاسَ - نَهَانِي عَنْ تَخَتُّمِ الذَّهَبِ وَعَنْ لُبْسِ الْقَسِّيِّ وَعَنِ الْمُعَصْفَرِ الْمُفَدَّمَةِ وَلاَ أَقْرَأُ سَاجِدًا وَلاَ رَاكِعًا …"
summary:
  ar: "حديث في سنن النسائي، رقم 1118، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1118 (The Book of The At-Tatbiq (Clasping One's Hands Together)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1118، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1118 (El Libro del At-Tatbiq (Junto de las Manos)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1118 (Le Livre de l'At-Tatbiq, ou l'union des mains), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
