label: { ar: "سنن ابن ماجه 123 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan Ibn Majah 123 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن ابن ماجہ 123 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، عَنِ الزُّبَيْرِ، قَالَ لَقَدْ جَمَعَ لِي رَسُولُ اللَّهِ ـ أَبَوَيْهِ يَوْمَ أُحُدٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 123، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 123 (The Book of the Sunnah), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 123، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
