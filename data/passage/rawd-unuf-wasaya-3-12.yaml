text: "… وبرسوله وأسلمتُ، ثم أخذت سَيْفى، ففدوتُ مع رسول اللّه، ثم قاتلت حتى أصابى ما أصابى، ثم لم يلبث أن مات قى أيديهم. فذكروه لرسول اللّه، فقال : إنه لمن أهل الجنة. مقتل عمرو بن الجموح قال ابن إسحاق : وحدتى …"
