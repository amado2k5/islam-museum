text: "… بن النجار الانصارى.. ذكره ابن اسحاق فيمن شهد بدرا وفى الاشتقاق لا بن دريد أنه شهد بدرا واستشهد بأحد لكن ذكره بالتصغير فقال نميمان بن عمرو ولم ينسبه فظن بعضهم أنه النعيمان صاحب المزاح وليس كذلك كما سيأتى فى ترجمته …"
