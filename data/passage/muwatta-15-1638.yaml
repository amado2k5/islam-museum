label: { ar: "الموطأ 1638 — نافع عن ربيع بنت معوذ بن عفراء: اختلعت من زوجها في زمان عثمان، فلم ينكره عثمان، وعدتها عدة المطلقة عند ابن عمر", en: "Muwatta 1638", es: "Muwatta 1638", fr: "Muwatta 1638", ur: "موطا 1638", tr: "El-Muvatta 1638 — Nafi’nin Rabi’ bint Mu’awwadh ibn ‘Afra’dan rivayet ettiğine göre: Osman döneminde kocasından boşandı ve Osman buna itiraz etmedi; İbn Ömer’e göre bekleme süresi boşanmış bir kadının bekleme süresiydi.", id: "Al-Muwatta 1638 — Diriwayatkan oleh Nafi’ dari Rabi’ bint Mu’awwadh ibn ‘Afra’: Ia bercerai dari suaminya pada masa ‘Uthman, dan ‘Uthman tidak keberatan, dan masa iddahnya sama seperti wanita yang bercerai menurut Ibn ‘Umar." }
summary:
  ar: "يروي مالك عن نافع أن ربيع بنت معوذ بن عفراء جاءت هي وعمها إلى عبد الله بن عمر، فأخبرته أنها اختلعت من زوجها في زمان عثمان بن عفان، فبلغ ذلك عثمان فلم ينكره. وقال عبد الله بن عمر عدتها عدة المطلقة. {cite:muwatta-maruf-1997 p.75}"
  tr: "Malik, Nafi’den rivayetle, Rabi’ bint Mu’awwidh ibn Afra’nın amcasıyla birlikte Abdullah ibn Umar’a gelip, Osman ibn Affan döneminde kocasından hulu’ boşanma aldığını söylediğini aktarır. Bu bilgi Osman’a ulaşmış, ancak o itiraz etmemiştir. Abdullah ibn Umar, bekleme süresinin boşanmış bir kadının bekleme süresi olduğunu söylemiştir. {cite:muwatta-maruf-1997 s.75}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Rabi’ bint Mu’awwidh ibn Afra’ datang bersama pamannya kepada Abdullah ibn Umar dan memberitahunya bahwa ia telah memperoleh khul’ (perceraian secara sah) dari suaminya pada masa Utsman ibn Affan. Hal ini sampai kepada Utsman, tetapi ia tidak keberatan. Abdullah ibn Umar berkata bahwa masa iddahnya adalah masa iddah wanita yang bercerai. {cite:muwatta-maruf-1997 p.75}"
