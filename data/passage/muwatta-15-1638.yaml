label: { ar: "الموطأ 1638 — نافع عن ربيع بنت معوذ بن عفراء: اختلعت من زوجها في زمان عثمان، فلم ينكره عثمان، وعدتها عدة المطلقة عند ابن عمر", en: "Muwatta 1638" }
summary:
  ar: "يروي مالك عن نافع أن ربيع بنت معوذ بن عفراء جاءت هي وعمها إلى عبد الله بن عمر، فأخبرته أنها اختلعت من زوجها في زمان عثمان بن عفان، فبلغ ذلك عثمان فلم ينكره. وقال عبد الله بن عمر عدتها عدة المطلقة. {cite:muwatta-maruf-1997 p.75}"
