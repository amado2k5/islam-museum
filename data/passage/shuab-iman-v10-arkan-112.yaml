text: "… بن ربيعة النميري أن علي بن بجير حدثه عن الحارث بن شريح: أنه انطلق مع رسول اللّٰه وَل ليه حتى صلى معه في المسجد الذي بين مكة والمدينة، فقال رسول اللّٰه بَلِفِي: إن المسلم أخو المسلم، إذا لقيه رد عليه …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 112، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 112, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 112 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Shu'ab al-Iman de al-Bayhaqi, vol. 10, pág. 112, que menciona una descripción del musulmán; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 10, page 112, contenant une description du musulman; extrait de la numérisation automatique, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le navigateur « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 112. sayfasından, bir Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, iman dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari \"Cabang-Cabang Iman\" karya Al-Bayhaqi, Jilid 10, halaman 112, yang menggambarkan seorang Muslim; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
