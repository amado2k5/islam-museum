text: "… حَدَّثَنَا ابْنُ أَبِي فُدَيْكٍ، عَنْ مُوسَى بْنِ يَعْقُوبَ، عَنْ عُمَرَ بْنِ سَعِيدٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ حُمَيْدٍ، عَنْ أَبِيهِ، أَنَّ سَعِيدَ بْنَ زَيْدٍ، حَدَّثَهُ فِي، نَفَرٍ أَنَّ رَسُولَ اللَّهِ قَالَ \" عَشَرَةٌ فِي الْجَنَّةِ أَبُو بَكْرٍ فِي الْجَنَّةِ وَعُمَرُ فِي الْجَنَّةِ وَعُثْمَانُ وَعَلِيٌّ وَالزُّبَيْرُ وَطَلْحَةُ وَعَبْدُ الرَّحْمَنِ وَأَبُو عُبَيْدَةَ وَسَعْدُ بْنُ أَبِي وَقَّاصٍ \". قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3748، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3748 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3748، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3748 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
