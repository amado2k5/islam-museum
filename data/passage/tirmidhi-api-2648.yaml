label: { ar: "جامع الترمذي 2648 — الأب والأبوة", en: "Jami' al-Tirmidhi 2648 — the father and fatherhood", ur: "جامع ترمذی 2648 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2648 — El padre y la paternidad" }
text: "… عَنْ أَبِي دَاوُدَ، عَنْ عَبْدِ اللَّهِ بْنِ سَخْبَرَةَ، عَنْ سَخْبَرَةَ، عَنِ النَّبِيِّ قَالَ \" مَنْ طَلَبَ الْعِلْمَ كَانَ كَفَّارَةً لِمَا مَضَى \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ ضَعِيفُ الإِسْنَادِ. أَبُو دَاوُدَ يُضَعَّفُ وَلاَ نَعْرِفُ لِعَبْدِ اللَّهِ بْنِ سَخْبَرَةَ كَبِيِرَ شَيْءٍ وَلاَ لأَبِيهِ وَاسْمُ أَبِي دَاوُدَ نُفَيْعٌ الأَعْمَى تَكَلَّمَ فِيهِ قَتَادَةُ وَغَيْرُ وَاحِدٍ مِنْ أَهْلِ الْعِلْمِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2648، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2648 (Chapters on Knowledge), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2648، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2648 (Capítulos sobre el conocimiento), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
