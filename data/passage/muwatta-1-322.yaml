label: { ar: "الموطأ 322 — أبو بكر يوتر قبل النوم وعمر آخر الليل", en: "Muwatta 322" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب، في باب الأمر بالوتر: كان أبو بكر الصديق إذا أراد أن يأتي فراشه أوتر، وكان عمر بن الخطاب يوتر آخر الليل، وقال سعيد إنه إذا جاء فراشه أوتر. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.183}"
