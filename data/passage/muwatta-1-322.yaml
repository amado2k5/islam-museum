label: { ar: "الموطأ 322 — أبو بكر يوتر قبل النوم وعمر آخر الليل", en: "Muwatta 322", es: "Muwatta 322", fr: "Muwatta 322", ur: "موطا 322", tr: "El-Muvatta 322 — Ebu Bekir yatmadan önce Vitr namazını kılar, Ömer ise gecenin sonunda kılar.", id: "Al-Muwatta 322 — Abu Bakar mengerjakan shalat Witir sebelum tidur dan Umar mengerjakannya di akhir malam" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب، في باب الأمر بالوتر: كان أبو بكر الصديق إذا أراد أن يأتي فراشه أوتر، وكان عمر بن الخطاب يوتر آخر الليل، وقال سعيد إنه إذا جاء فراشه أوتر. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.183}"
  tr: "Malik'in Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet ettiği, Vitr namazının kılınması emri bölümündeki bir rivayete göre: Ebu Bekir al-Siddik yatmadan önce Vitr namazı kılardı, Ömer ibn al-Khattab ise gecenin sonunda Vitr namazı kılardı. Sa'id ise yatmadan önce Vitr namazı kıldığını söylemiştir. Editör, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.183}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id atas otoritas Sa'id ibn al-Musayyab, dalam bab tentang perintah untuk melaksanakan salat Witir: Abu Bakr al-Siddiq biasa melaksanakan salat Witir sebelum tidur, dan Umar ibn al-Khattab biasa melaksanakan salat Witir di akhir malam. Sa'id berkata bahwa ia biasa melaksanakan salat Witir sebelum tidur. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.183}"
