label: { ar: "الموطأ 1185 — سعيد بن المسيب عن عمر: من عقص رأسه أو ضفر أو لبد فقد وجب عليه الحلاق", en: "Muwatta 1185", es: "Muwatta 1185", fr: "Muwatta 1185", ur: "موطا 1185", tr: "El-Muvatta 1185 — Sa'id ibn el-Musayyab, Ömer'den rivayetle: Kim saçını örer, topuz yapar veya keçeleştirirse, tıraş olması farzdır.", id: "Al-Muwatta 1185 — Sa’id ibn al-Musayyab berdasarkan riwayat Umar: Barang siapa mengepang, menjalin, atau mengikat rambutnya, maka wajib baginya untuk bercukur." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن عمر بن الخطاب قال من عقص رأسه، أو ضفر، أو لبد، فقد وجب عليه الحلاق. {cite:muwatta-maruf-1997 p.533}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle Ömer ibn al-Khattab'ın şöyle dediğini naklediyor: \"Kim saçını örer, topuz yapar veya keçeleştirirse, tıraş olması gerekir.\" {cite:muwatta-maruf-1997 s.533}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa Umar ibn al-Khattab berkata: \"Barang siapa mengepang, menjalin, atau mengikat rambutnya, maka ia wajib bercukur.\" {cite:muwatta-maruf-1997 p.533}"
