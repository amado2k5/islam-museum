text: "… رسول اللّٰه لله فلما دخل رسول اللّٰه لَلِلِ الصلاة كبر، فكبر الناس ثم ركع فركعوا ثم رفع فرفعوا، فقال أبو سفيان : ما رأيت كاليوم طاعة قوم جمعهم من ههنا وههنا، ولا فارس ولا الروم وذات القرون بأطوع منهم له، …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 402، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 402, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 402 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
