label: { ar: "الموطأ 411 — ابن عمر يرى ابنه عبيد الله يتنفل في السفر فلا ينكر عليه", en: "Muwatta 411", es: "Muwatta 411", fr: "Muwatta 411", ur: "موطا 411", tr: "El-Muvatta 411 — İbn Ömer, oğlu Ubeydullah'ın yolculuk halindeyken gönüllü namazlar kıldığını gördü ve buna itiraz etmedi.", id: "Al-Muwatta 411 — Ibnu Umar melihat putranya Ubaydullah melaksanakan salat sunnah saat bepergian dan tidak keberatan dengan hal itu." }
summary:
  ar: "بلاغ في باب صلاة النافلة في السفر: يروي مالك أنه بلغه عن نافع أن عبد الله بن عمر كان يرى ابنه عبيد الله بن عبد الله يتنفل في السفر فلا ينكر عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.214} {cite:muwatta-maruf-1997 p.215}"
  tr: "Yolculuk sırasında yapılan gönüllü namazlarla ilgili bir rivayet: Malik, Nafi'den işittiğini ve Abdullah ibn Umar'ın oğlu Ubeydullah ibn Abdullah'ın yolculuk sırasında gönüllü namaz kıldığını gördüğünü ve buna itiraz etmediğini aktarır. Araştırmacı, bunu Malik'ten Ebu Mus'ab ve Suveyd'in rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.214} {cite:muwatta-maruf-1997 s.215}"
  id: "Sebuah riwayat mengenai salat sunnah saat bepergian: Malik meriwayatkan bahwa ia mendengar dari Nafi' bahwa Abdullah ibn Umar biasa melihat putranya, Ubaydullah ibn Abdullah, melaksanakan salat sunnah saat bepergian dan beliau tidak keberatan. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.214} {cite:muwatta-maruf-1997 p.215}"
