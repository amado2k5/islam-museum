text: |-
  ⁦(نحش)⁩
  ٤٩٧
  نش بأءراف الحياد أ كغنا • اذانحن قناعن شواءمضهد
  ومششت الناقة حلبتها وتركت فى الضرع بعض اللبن وفلان يمتس من مال فلان أى يصيد
  منه والمشاشة واحدة المشاس وهى رؤس العظام اللينة التى عسكن مضغها والمشاش
  أيضا أرض لينة قال الراجز راسى العروق فى المشاش البحباج وفلان طيب المشاش
  أى كريم النفس وقول أب ذو يب يصف فرسا
  يعدوبه نهش المشاش كأنه • صدع سليم رجعه لا يظلع
  يعنى انه خفيف النفس والعظام أوكني به عن القوائم وتششت العظم أكلت مشاشه أو
  ت ككنه والمشمش الذى يؤكل والمشمش أيضا بالفتح عن أبى عبيدة ومششت الدابة بالكسر
  مششاوهوشي يشخص فى وظيفها حتى يكون له حججم وليسله صلاية العظم السميح وهو أحد
  ما جاءعلى الاصل يش لميش خلط الدوف بالشعر قال الراجز
  عاذل قد أواعت بالترقيس • الى سرافاطر قى وميشى
  قال أبو نصر أى اخلطى ماشئت من القول واليسر خلط لبن الضأن بلبن الماعسز ومشت
  الخبرأى خلطت وقال الكساقى أخبرت ببعض الخير وكتمت بعضا والميش حاب نصف
  مافى الضرع فاذاجاوز النصف فليس بميش والماش حبّ وهو معرب أومولد
  ف ل النون ن ش التناؤش بالهمز التأخر والتباعد وقد تأشت الامر أنأشه
  نأَشْا أخرته فانتأش ويقال فعلد نقبشا أى أخيرا قال الشاعر
  تمنى نتبشا أن يكون أطاعنى • وقد حدثت بعد الاموراً مور
  ⁦( لبش )⁩ نبنت البقل والميت أنيش بالضم نبشاومنه النباش والانبوش أصل البقل
  المنبوش والهع الانابيش قال امرؤالقيس
  كأن السباع فيه غرقى عشية • باريائه القصوى أنا بيش عنصل
  ⁦( تتش)⁩ تتشت الذى بالمنتاش وهو المنقاش اى استخرجته به ويقسال ما تتشت من فلان
  شيتا أى ما أصبت جش نجشت الصيد أفجشه فجنا أى استترته والناجسْ الذى
  بحوش الصيد والتيس أن تزايد فى المبيع ليقع غيرك وليس من حاجتك وفى الحديث
  لا تناجشوا ونجشت الابل إذا جعتها بعد تفرق قال الراجز
  أجرش لهايا ابن أبى كباش • فالها الليلة من إنفاش • غبر السرى وسائق فياش
  والتهاشى بالفتح اسم ملن الحيشة ومرفلان ينيش نحنا أى بسرع شس ش الغدير
  ينش نشيشا أى أخذماؤه فى النضوب يقال سيخة نشاشة وهوما يظهر من ماء السباخ
  قينسْ فيها-ق يمود مها والنشيس صوت الماء وغيره اذا غلا والنش عشرون درهما وهو
  نصف أوقية لانحم يسهون الاربعين درهما أوقية ويسمون العشرين نشا ويسعون المسة
  نواة ونشنشت الجاد اذا أسرعت سلخه وقطعه عن اللحم قال الشاعر رة بن محكان
  بتشنسر الجلد عنها وهى باركة * كما يننفس كفافاتل سليا
  ويروى قائل ⁦(نطس)⁩ قولهم ما به نطيش أى حراعن يعقوب وعمشان نطشان اتباع له
  ( نعش نعشه اللّٰه ينعشه نعشارفعه ولا يقال أنعشه اللّه قال ذوارمة
  ١٢٥
  صحاح
  ومولى عصانى واستبتبرأيه
  كالم يطع فيما أشارقصير
  فلار أى ماغب أمرى وأمره .
  وناءت باعماز الامورصدور
  عى الخ كذا فى نسمنة
