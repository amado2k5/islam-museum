label: { ar: "الموطأ 2188 — يحيى عن مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف ومحمد بن النعمان بن بشير عن النعمان بن بشير: أن أباه بشيرا أتى به إلى رسول الله فقال: إني نحلت ابني هذا غلاما، فقال رسول الله: أكل ولدك نحلته مثل هذا؟ قال: لا، فقال: فارتجعه", en: "Muwatta 2188" }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف ومحمد بن النعمان بن بشير أنهما حدثاه عن النعمان بن بشير أنه قال: إن أباه بشيرا أتى به إلى رسول الله فقال: إني نحلت ابني هذا غلاما كان لي. فقال رسول الله: أكل ولدك نحلته مثل هذا؟ فقال: لا. فقال رسول الله: فارتجعه. {cite:muwatta-maruf-1997 p.298}"
