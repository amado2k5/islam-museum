label: { ar: "الموطأ 2188 — يحيى عن مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف ومحمد بن النعمان بن بشير عن النعمان بن بشير: أن أباه بشيرا أتى به إلى رسول الله فقال: إني نحلت ابني هذا غلاما، فقال رسول الله: أكل ولدك نحلته مثل هذا؟ قال: لا، فقال: فارتجعه", en: "Muwatta 2188", es: "Muwatta 2188", fr: "Muwatta 2188", ur: "موطا 2188", tr: "El-Muvatta 2188 — Yahya, Malik'ten, o da İbn Şihab'dan, o da Humaid ibn Abd el-Rahman ibn Awf'tan ve Muhammed ibn el-Nu'man ibn Beşir'den, o da el-Nu'man ibn Beşir'den rivayet eder ki: Babası Beşir onu Allah'ın Resulü'ne getirip şöyle dedi: \"Bu oğluma bir köle verdim.\" Allah'ın Resulü şöyle dedi: \"Bütün çocuklarına böyle bir hediye verdin mi?\" O da: \"Hayır\" dedi. Bunun üzerine Resulullah şöyle dedi: \"Öyleyse onu geri al.\"", id: "Al-Muwatta 2188 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Humaid ibn Abd al-Rahman ibn Awf dan Muhammad ibn al-Nu’man ibn Bashir, berdasarkan riwayat al-Nu’man ibn Bashir: bahwa ayahnya, Bashir, membawanya kepada Rasulullah dan berkata: Aku telah memberikan seorang budak kepada anakku ini. Rasulullah bersabda: Apakah kamu telah memberikan hadiah serupa kepada semua anakmu? Dia menjawab: Tidak. Maka Rasulullah bersabda: Kalau begitu, ambillah kembali." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف ومحمد بن النعمان بن بشير أنهما حدثاه عن النعمان بن بشير أنه قال: إن أباه بشيرا أتى به إلى رسول الله فقال: إني نحلت ابني هذا غلاما كان لي. فقال رسول الله: أكل ولدك نحلته مثل هذا؟ فقال: لا. فقال رسول الله: فارتجعه. {cite:muwatta-maruf-1997 p.298}"
  tr: "Yahya, Malik'ten, o da İbn Şihab'dan, o da Humaid ibn Abd al-Rahman ibn Awf'tan ve Muhammed ibn al-Nu'man ibn Bashir'den rivayetle, Nu'man ibn Bashir'in kendisine şöyle dediğini aktarır: Babası Bashir onu Allah'ın Resulü'ne getirmiş ve şöyle demiştir: \"Bu oğluma sahip olduğum bir köle verdim.\" Allah'ın Resulü şöyle demiştir: \"Bütün çocuklarına böyle bir hediye verdin mi?\" O da \"Hayır\" demiştir. Allah'ın Resulü şöyle demiştir: \"Öyleyse onu geri al.\" {cite:muwatta-maruf-1997 s.298}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, dari Humaid ibn Abd al-Rahman ibn Awf dan Muhammad ibn al-Nu'man ibn Bashir, bahwa mereka memberitahunya dari al-Nu'man ibn Bashir, yang berkata: Ayahnya, Bashir, membawanya kepada Rasulullah dan berkata: Aku telah memberikan kepada anakku ini seorang budak yang kumiliki. Rasulullah bertanya: Apakah kamu memberikan hadiah serupa kepada semua anakmu? Dia menjawab: Tidak. Rasulullah bersabda: Kalau begitu, ambillah kembali. {cite:muwatta-maruf-1997 p.298}"
