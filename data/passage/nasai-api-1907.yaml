text: "… يَعُودُ الْمَسَاكِينَ وَيَسْأَلُ عَنْهُمْ فَقَالَ رَسُولُ اللَّهِ \" إِذَا مَاتَتْ فَآذِنُونِي \". فَأُخْرِجَ بِجَنَازَتِهَا لَيْلاً وَكَرِهُوا أَنْ يُوقِظُوا رَسُولَ اللَّهِ فَلَمَّا أَصْبَحَ رَسُولُ اللَّهِ أُخْبِرَ بِالَّذِي كَانَ مِنْهَا فَقَالَ \" أَلَمْ آمُرْكُمْ أَنْ تُؤْذِنُونِي بِهَا \". قَالُوا يَا رَسُولَ اللَّهِ كَرِهْنَا أَنْ نُوقِظَكَ لَيْلاً. فَخَرَجَ رَسُولُ اللَّهِ حَتَّى صَفَّ بِالنَّاسِ عَلَى قَبْرِهَا وَكَبَّرَ أَرْبَعَ تَكْبِيرَاتٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 1907، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1907 (The Book of Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 1907، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
