text: "… إصلاحه، فإن التدبير المخصب بما يرطّب الدمّ، ويعدّله، ويصلحه، يكسر السوداء، وقد تبلغ صلابة الطحال إلى أن لا يكفي علاجها الاستعانة بما يشرب دون ما يضمّد به، وكل لبن غير لبن اللقاح رديء للطحال. والأدوية المفردة التي تستعمل لهذا السبب، …"
