label: { ar: "الموطأ 317 — ابن عباس يبيت عند ميمونة ويصلي مع النبي من الليل", en: "Muwatta 317", es: "Muwatta 317", fr: "Muwatta 317", ur: "موطا 317", tr: "El-Muvatta 317 — İbn Abbas, Meymuna'nın evinde geceyi geçirir ve gece boyunca Peygamberle birlikte dua eder.", id: "Al-Muwatta 317 — Ibnu Abbas bermalam di rumah Maymuna dan shalat bersama Nabi di malam hari" }
text: "فوضع رسول الله يده اليمنى على رأسي وأخذ بأذني اليمنى يفتلها"
summary:
  ar: "يرويه مالك عن مخرمة بن سليمان عن كريب مولى ابن عباس عن عبد الله بن عباس، في باب صلاة النبي في الوتر: بات ابن عباس ليلة عند خالته ميمونة زوج النبي، فاضطجع في عرض الوسادة واضطجع النبي وأهله في طولها، فنام النبي حتى انتصف الليل أو قبله بقليل أو بعده بقليل، ثم استيقظ فجلس يمسح النوم عن وجهه، ثم قرأ العشر الآيات الخواتم من سورة آل عمران، ثم قام إلى قربة معلقة فتوضأ فأحسن وضوءه ثم قام يصلي. فقام ابن عباس فصنع مثله ثم قام إلى جنبه، فوضع النبي يده اليمنى على رأسه وأخذ بأذنه اليمنى يفتلها، فصلى ركعتين ثم ركعتين، ست مرات، ثم أوتر، ثم اضطجع حتى أتاه المؤذن فصلى ركعتين خفيفتين ثم خرج فصلى الصبح. ويخرّجه المحقق عند البخاري ⁦(183، 992، 1198، 4570–4572)⁩ ومسلم (2/179) وأبي داود (1367) وابن ماجه (1363) والنسائي وابن خزيمة وابن حبان من طرق أصحاب مالك، ويحيل على التمهيد (13/206). {cite:muwatta-maruf-1997 p.178} {cite:muwatta-maruf-1997 p.179}"
  tr: "Malik, Peygamberimizin Vitr namazı bölümünde, Makhrama ibn Sulayman'dan, o da İbn Abbas'ın azatlı kölesi Kurayb'dan, o da Abdullah ibn Abbas'tan rivayetle şöyle anlatılır: İbn Abbas, Peygamberimizin eşi Meymuna'nın evinde bir gece geçirdi. Peygamberimiz ve ailesi yastığın boyuna yatarken, İbn Abbas yastığın enine uzandı. Peygamberimiz gece yarısına kadar, ya da biraz önce veya sonra uyudu. Sonra uyandı, oturdu ve yüzündeki uykuyu sildi. Ardından Al İmran Suresi'nin son on ayetini okudu. Sonra asılı bir su tulumuna gitti, abdest aldı ve namaz kılmak için ayağa kalktı. İbn Abbas da ayağa kalktı ve aynı şeyi yaptı, sonra onun yanına geçti. Peygamberimiz sağ elini başına koydu ve sağ kulağını tutarak çevirdi. İki rekat, sonra iki rekat daha olmak üzere altı kez namaz kıldı. Sonra Vitr namazını kıldı ve müezzin gelene kadar uzandı. İki kısa rekat namaz kıldıktan sonra dışarı çıkıp sabah namazını kıldı. Araştırmacı, bunu Buhari (183, 992, 1198, 4570–4572), Müslim (2/179), Ebu Davud (1367), İbn Mâce (1363), Nesai, İbn Huzeyme ve İbn Hibban'ın hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil ediyor ve Temhid'e (13/206) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.178} {cite:muwatta-maruf-1997 s.179}"
  id: "Diriwayatkan oleh Malik dari Makhrama ibn Sulayman, dari Kurayb, budak yang dibebaskan oleh Ibnu Abbas, dari Abdullah ibn Abbas, dalam surah tentang salat Witir Nabi: Ibnu Abbas bermalam di rumah bibinya, Maymuna, istri Nabi. Ia berbaring melintang di atas bantal, sedangkan Nabi dan keluarganya berbaring memanjang di atasnya. Nabi tidur hingga tengah malam, atau sedikit sebelum atau sesudahnya. Kemudian beliau bangun, duduk, dan mengusap wajahnya yang masih mengantuk. Kemudian beliau membaca sepuluh ayat terakhir Surah Al Imran. Kemudian beliau pergi ke kantung air yang tergantung, berwudhu dengan benar, dan berdiri untuk salat. Ibnu Abbas berdiri dan melakukan hal yang sama, kemudian berdiri di sampingnya. Nabi meletakkan tangan kanannya di atas kepalanya dan memegang telinga kanannya, memelintirnya. Beliau salat dua rakaat, kemudian dua rakaat lagi, enam kali. Kemudian beliau salat Witir, lalu berbaring hingga muazin datang. Ia melaksanakan salat dua rakaat pendek, kemudian keluar dan melaksanakan salat Subuh. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (183, 992, 1198, 4570–4572), Muslim (2/179), Abu Dawud (1367), Ibn Majah (1363), al-Nasa'i, Ibn Khuzaymah, dan Ibn Hibban, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (13/206). {cite:muwatta-maruf-1997 p.178} {cite:muwatta-maruf-1997 p.179}"
