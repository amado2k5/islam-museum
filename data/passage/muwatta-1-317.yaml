label: { ar: "الموطأ 317 — ابن عباس يبيت عند ميمونة ويصلي مع النبي من الليل", en: "Muwatta 317" }
text: "فوضع رسول الله يده اليمنى على رأسي وأخذ بأذني اليمنى يفتلها"
summary:
  ar: "يرويه مالك عن مخرمة بن سليمان عن كريب مولى ابن عباس عن عبد الله بن عباس، في باب صلاة النبي في الوتر: بات ابن عباس ليلة عند خالته ميمونة زوج النبي، فاضطجع في عرض الوسادة واضطجع النبي وأهله في طولها، فنام النبي حتى انتصف الليل أو قبله بقليل أو بعده بقليل، ثم استيقظ فجلس يمسح النوم عن وجهه، ثم قرأ العشر الآيات الخواتم من سورة آل عمران، ثم قام إلى قربة معلقة فتوضأ فأحسن وضوءه ثم قام يصلي. فقام ابن عباس فصنع مثله ثم قام إلى جنبه، فوضع النبي يده اليمنى على رأسه وأخذ بأذنه اليمنى يفتلها، فصلى ركعتين ثم ركعتين، ست مرات، ثم أوتر، ثم اضطجع حتى أتاه المؤذن فصلى ركعتين خفيفتين ثم خرج فصلى الصبح. ويخرّجه المحقق عند البخاري (183، 992، 1198، 4570–4572) ومسلم (2/179) وأبي داود (1367) وابن ماجه (1363) والنسائي وابن خزيمة وابن حبان من طرق أصحاب مالك، ويحيل على التمهيد (13/206). {cite:muwatta-maruf-1997 p.178} {cite:muwatta-maruf-1997 p.179}"
