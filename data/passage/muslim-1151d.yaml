label:
  ar: "مسلم 1151d — الصوم لي وأنا أجزي به"
  en: "Muslim 1151d — Fasting is Mine, and I reward it"
  ur: "مسلم 1151d — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "قال الله عز وجل كل عمل ابن آدم له إلا الصيام فإنه لي وأنا أجزي به والصيام جنة فإذا كان يوم صوم أحدكم فلا يرفث يومئذ ولا يسخب فإن سابه أحد أو قاتله فليقل إني امرؤ صائم . والذي نفس …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1151d: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1151d: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1151d: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
