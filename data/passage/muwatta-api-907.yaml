label: { ar: "موطأ مالك 907 — الأب والأبوة", en: "Muwatta Malik 907 — the father and fatherhood", ur: "موطأ مالک 907 — باپ اور والدیت", es: "Muwatta Malik 907 — el padre y la paternidad" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، أَنَّ عُمَرَ بْنَ الْخَطَّابِ، صَلَّى لِلنَّاسِ بِمَكَّةَ رَكْعَتَيْنِ فَلَمَّا انْصَرَفَ قَالَ يَا أَهْلَ مَكَّةَ أَتِمُّوا صَلاَتَكُمْ فَإِنَّا قَوْمٌ سَفْرٌ. ثُمَّ صَلَّى عُمَرُ رَكْعَتَيْنِ بِمِنًى وَلَمْ يَبْلُغْنَا أَنَّهُ قَالَ لَهُمْ شَيْئًا. سُئِلَ مَالِكٌ عَنْ أَهْلِ مَكَّةَ كَيْفَ صَلاَتُهُمْ بِعَرَفَةَ أَرَكْعَتَانِ أَمْ أَرْبَعٌ وَكَيْفَ بِأَمِيرِ الْحَاجِّ إِنْ كَانَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 907، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 907 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 907، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 907 (Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
