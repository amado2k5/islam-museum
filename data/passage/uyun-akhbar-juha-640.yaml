text: "… هذا الموقف بقتضى شجاعة وجأة، وفى عبد اللّه بن الأهتم منهما حظ موفور. أما نعيم بن عمرو بن الأهتم، وعبد اللّٰه هذا عمد، فكان كما يقول أبن قئيبة فى الشعر والشعراء ص : فيه تأنيث.... وفى النوادر لأبى علىّ القالى …"
