text: "… ويشهد له أيضاً ما رواه الطبراني في الأوسط من حديث ابن عباسما، وفيه أحمد بن محمد بن القاسم بن أبي بَزَّة، وهو الإمام المقرىء المعروف ب: البَزّي، إمام حجة في القراءات، ضعيف في الحديث. انظر غاية النهاية لابن الجزري :، …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 4، ص 780، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
