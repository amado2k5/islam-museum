label:
  ar: "البخاري 74 — موسى والعبد الصالح بمجمع البحرين"
  en: "Bukhari 74 — Musa and the righteous servant at the meeting of the two seas"
  ur: "بخاری 74 — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
text: "بينما موسى في ملإ من بني إسرائيل، جاءه رجل فقال هل تعلم أحدا أعلم منك قال موسى لا. فأوحى الله إلى موسى بلى، عبدنا خضر، فسأل موسى السبيل إليه، فجعل الله له الحوت آية، وقيل له إذا فقدت الحوت فارجع، …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 74: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 74: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 74: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
