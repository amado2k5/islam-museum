label: { ar: "الموطأ 36 — عائشة لعبد الرحمن: أسبغ الوضوء، ويل للأعقاب من النار", en: "Muwatta 36", es: "Muwatta 36", fr: "Muwatta 36", ur: "موطا 36", tr: "El-Muvatta 36 — Aişe'den Abdurrahman'a: Abdestini iyice al, ateşten topuklara yazıklar olsun!", id: "Al-Muwatta 36 — Aisyah kepada Abdullah: Wudhulah dengan sempurna, celakalah tumit dari api neraka." }
text: "ويل للأعقاب من النار"
summary:
  ar: "بلاغ في باب العمل في الوضوء: يروي مالك أنه بلغه أن عبد الرحمن بن أبي بكر دخل على أخته عائشة يوم مات سعد بن أبي وقاص فدعا بماء ليتوضأ، فأمرته أن يسبغ الوضوء، واحتجت بأنها سمعت النبي يتوعد الأعقاب التي لا يصيبها الماء بالنار. ويذكر المحقق أن أبا مصعب رواه عن مالك كذلك، وأنه حديث مدني معروف روي عن النبي من وجوه شتى موصولاً ذكرها ابن عبد البر ⁦(التمهيد 24/247)⁩، وينقل عن الزرقاني أن البلاغ يحتمل أن يكون وصل مالكاً من تلميذه ابن وهب أو من مخرمة بن بكير، إذ رواه مسلم من طريقهما عن سالم مولى شداد قال: دخلت على عائشة يوم توفي سعد. {cite:muwatta-maruf-1997 p.52} {cite:muwatta-maruf-1997 p.53}"
  id: "Sebuah riwayat mengenai cara berwudhu yang benar: Malik meriwayatkan bahwa ia mendengar Abd al-Rahman ibn Abi Bakr menemui saudara perempuannya, Aisyah, pada hari Sa'd ibn Abi Waqqas wafat dan meminta air untuk berwudhu. Aisyah menyuruhnya untuk berwudhu dengan sempurna, dengan alasan bahwa ia telah mendengar Nabi (shalawat dan salam kepadanya) memperingatkan tentang api neraka bagi tumit yang tidak mencapai air. Peneliti menyebutkan bahwa Abu Mus'ab juga meriwayatkannya dari Malik, dan bahwa itu adalah hadits Madinah yang terkenal yang diriwayatkan dari Nabi (shalawat dan salam kepadanya) melalui berbagai sanad, yang disebutkan oleh Ibnu Abd al-Barr (al-Tamhid 24/247). Ia mengutip al-Zarqani yang mengatakan bahwa riwayat tersebut mungkin sampai kepada Malik dari muridnya Ibn Wahb atau dari Makhrama ibn Bukayr, karena Muslim meriwayatkannya melalui mereka atas otoritas Salim, budak yang dibebaskan oleh Shaddad, yang berkata: \"Aku menemui Aisyah pada hari Sa'd wafat.\" {cite:muwatta-maruf-1997 p.52} {cite:muwatta-maruf-1997 p.53}"
