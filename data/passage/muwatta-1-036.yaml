text: "ويل للأعقاب من النار"
summary:
  ar: "بلاغ في باب العمل في الوضوء: يروي مالك أنه بلغه أن عبد الرحمن بن أبي بكر دخل على أخته عائشة يوم مات سعد بن أبي وقاص فدعا بماء ليتوضأ، فأمرته أن يسبغ الوضوء، واحتجت بأنها سمعت النبي يتوعد الأعقاب التي لا يصيبها الماء بالنار. ويذكر المحقق أن أبا مصعب رواه عن مالك كذلك، وأنه حديث مدني معروف روي عن النبي من وجوه شتى موصولاً ذكرها ابن عبد البر (التمهيد 24/247)، وينقل عن الزرقاني أن البلاغ يحتمل أن يكون وصل مالكاً من تلميذه ابن وهب أو من مخرمة بن بكير، إذ رواه مسلم من طريقهما عن سالم مولى شداد قال: دخلت على عائشة يوم توفي سعد. {cite:muwatta-maruf-1997 p.52} {cite:muwatta-maruf-1997 p.53}"
