label: { ar: "سنن أبي داود 3001 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 3001 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 3001 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 3001 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 3001 — mentions de nations, de religions et de peuples non musulmans", tr: "Sunan Abi Davud 3001 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sunan Abi Dawud 3001 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "حَدَّثَنَا مُصَرِّفُ بْنُ عَمْرٍو الأَيَامِيُّ، حَدَّثَنَا يُونُسُ، - يَعْنِي ابْنَ بُكَيْرٍ - قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، حَدَّثَنِي مُحَمَّدُ بْنُ أَبِي مُحَمَّدٍ، مَوْلَى زَيْدِ بْنِ ثَابِتٍ عَنْ سَعِيدِ بْنِ جُبَيْرٍ، وَعِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ لَمَّا أَصَابَ رَسُولُ اللَّهِ قُرَيْشًا يَوْمَ بَدْرٍ وَقَدِمَ الْمَدِينَةَ جَمَعَ الْيَهُودَ فِي سُوقِ بَنِي قَيْنُقَاعَ فَقَالَ \" يَا مَعْشَرَ يَهُودَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3001، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3001 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 3001، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3001 (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 3001 (Tribut, Butin et Domination (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sünen Ebu Davud'da yer alan 3001 numaralı hadiste, gayrimüslim milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3001, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
