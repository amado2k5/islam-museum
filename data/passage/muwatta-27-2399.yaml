label: { ar: "الموطأ 2399 — عمرة بنت عبد الرحمن: رجلان استبا في زمن عمر فجلد الحد ثمانين", en: "Muwatta 2399" }
summary:
  ar: "يروي مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن أن رجلين استبا في زمان عمر بن الخطاب، فقال أحدهما: والله ما أبي بزان ولا أمي بزانية. فاستشار عمر، فقال قائل: مدح أباه وأمه، وقال آخرون: كان لأبيه وأمه مدح غير هذا، فنرى أن تجلده الحد، فجلده عمر ثمانين. {cite:muwatta-maruf-1997 p.392}"
