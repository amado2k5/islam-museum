label: { ar: "الموطأ 2399 — عمرة بنت عبد الرحمن: رجلان استبا في زمن عمر فجلد الحد ثمانين", en: "Muwatta 2399", es: "Muwatta 2399", fr: "Muwatta 2399", ur: "موطا 2399", tr: "El-Muvatta 2399 — Umrah bint Abdülrahman: Ömer zamanında iki adam kavga etti, bu yüzden ona seksen kırbaç cezası verildi.", id: "Al-Muwatta 2399 — Umrah binti Abd al-Rahman: Dua orang bertengkar pada zaman Umar, sehingga ia dicambuk sebanyak delapan puluh kali." }
summary:
  ar: "يروي مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن أن رجلين استبا في زمان عمر بن الخطاب، فقال أحدهما: والله ما أبي بزان ولا أمي بزانية. فاستشار عمر، فقال قائل: مدح أباه وأمه، وقال آخرون: كان لأبيه وأمه مدح غير هذا، فنرى أن تجلده الحد، فجلده عمر ثمانين. {cite:muwatta-maruf-1997 p.392}"
  tr: "Malik, Ebu el-Rijal Muhammed ibn Abd el-Rahman'dan, annesi Amrah bint Abd el-Rahman'dan rivayetle, Ömer ibn el-Hattab zamanında iki adamın tartıştığını anlatır. Adamlardan biri, \"Allah'a yemin ederim ki, ne babam ne de annem zina etmiştir\" dedi. Ömer diğerleriyle istişare etti ve biri, \"Babasını ve annesini övdü\" dedi. Diğerleri ise, \"Babası ve annesi bundan başka övgülerde de bulundular, bu yüzden ona öngörülen cezanın verilmesi gerektiğini düşünüyoruz\" dediler. Bunun üzerine Ömer onu seksen kez kırbaçlattı. {cite:muwatta-maruf-1997 s.392}"
  id: "Malik meriwayatkan dari Abu al-Rijal Muhammad ibn Abd al-Rahman, dari ibunya, Amrah bint Abd al-Rahman, bahwa dua orang laki-laki berdebat pada masa Umar ibn al-Khattab. Salah seorang dari mereka berkata, \"Demi Allah, baik ayah maupun ibuku bukanlah seorang pezina.\" Umar bermusyawarah dengan orang lain, dan seseorang berkata, \"Dia memuji ayah dan ibunya.\" Yang lain berkata, \"Ayah dan ibunya memiliki pujian lain selain ini, jadi kami pikir dia harus diberi hukuman yang telah ditentukan.\" Maka Umar menyuruh orang itu dicambuk delapan puluh kali. {cite:muwatta-maruf-1997 p.392}"
