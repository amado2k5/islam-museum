text: "… يعلم محيط بجميع منافعها، سابق على خلقه إياها، فبحان مَن الأمور مكشوفة فى علمه من غير تفكر، ومن غير تأمل وتدبر، ومن غير استمانة بوزبر أو مشير، فهو العليم الجير، الحكيم القدير، فلقد استخرج بأقل القليل مما خلقه صدق الشهادة …"
summary:
