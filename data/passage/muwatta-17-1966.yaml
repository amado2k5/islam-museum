label: { ar: "الموطأ 1966 — مالك: الأمر المكروه الذي لا اختلاف فيه عندنا أن يكون للرجل على الرجل الدين إلى أجل، فيضع عنه الطالب ويعجله المطلوب، وهو عندنا بمنزلة الذي يؤخر دينه بعد محله، ويزيده الغريم في حقه، فهذا الربا بعينه لا شك فيه", en: "Muwatta 1966", es: "Muwatta 1966", fr: "Muwatta 1966", ur: "موطا 1966", tr: "El-Muvatta 1966 — Malik: Aramızda ihtilaf bulunmayan, kınanması gereken fiil, bir adamın başka bir adamdan daha sonraki bir tarihte alacağı olan bir borcu varken, alacaklının borcu affetmesi, borçlunun ise derhal ödeme talep etmesidir. Bizim görüşümüze göre bu, bir borcu vadesinden sonraya erteleyen ve alacaklının hakkını artıran birine benzer. Bu, hiç şüphesiz tefeciliktir.", id: "Al-Muwatta 1966 — Malik: Perbuatan tercela, yang tidak ada perbedaan pendapat di antara kita, adalah ketika seseorang mempunyai hutang kepada orang lain di kemudian hari, dan pemberi hutang menghapuskan hutang tersebut sementara debitur menuntut pembayaran segera. Menurut pandangan kami, ini seperti seseorang yang menunda pembayaran hutang melewati tanggal jatuh temponya, dan pemberi hutang menambah haknya. Ini adalah riba, tanpa diragukan lagi." }
summary:
  ar: "قال مالك: والأمر المكروه الذي لا اختلاف فيه عندنا، أن يكون للرجل على الرجل الدين إلى أجل، فيضع عنه الطالب ويعجله المطلوب. وذلك عندنا بمنزلة الذي يؤخر دينه بعد محله عن غريمه، ويزيده الغريم في حقه. قال: فهذا الربا بعينه، لا شك فيه. {cite:muwatta-maruf-1997 p.204} {cite:muwatta-maruf-1997 p.205}"
  tr: "Malik şöyle dedi: “Aramızda görüş ayrılığı bulunmayan, kınanması gereken fiil, bir adamın başka bir adamdan daha sonraki bir tarihte alacağı olan bir borcu varken, alacaklının borcu affetmesi, borçlunun ise derhal ödeme talep etmesidir. Bu, bizim görüşümüze göre, bir borcun ödemesini vadesinden sonraya erteleyen ve alacaklının da borç miktarını artırmasına benzer. Bu, hiç şüphesiz, en saf haliyle tefeciliktir.” {cite:muwatta-maruf-1997 s.204} {cite:muwatta-maruf-1997 s.205}"
  id: "Malik berkata: “Tindakan tercela, yang tidak ada perbedaan pendapat di antara kita, adalah ketika seseorang memiliki hutang yang harus dibayar oleh orang lain di kemudian hari, dan pemberi hutang menghapus hutang tersebut sementara debitur menuntut pembayaran segera. Menurut pandangan kami, ini seperti seseorang yang menunda pembayaran hutang melewati tanggal jatuh temponya, dan pemberi hutang kemudian meningkatkan jumlah hutang. Ini adalah riba dalam bentuknya yang paling murni, tanpa diragukan lagi.” {cite:muwatta-maruf-1997 p.204} {cite:muwatta-maruf-1997 p.205}"
