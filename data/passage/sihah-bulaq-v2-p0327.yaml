text: |-
  ٢٦٠
  والامة الحين قال تعالى واذ كر بعد أمّة وقال تعالى وثن أخر ناعنهم العذاب الى أمّة معدودة
  والامة بالكسر النعسمة والامة أيضالفة فى الامّة وهى الطريقة والدين عن أبى زيد قال
  الاعشى« وأصاب غزول إمة فأزالها• وقولهم وبله بريدون ويل لاته غحذف لكثرة
  فى السكلام وقول عدى بن زيد
  أيها العائب عندم زيد • أنت نفدى من أر التعيب
  يريد عندى أتم زيدفلاحذف الالفسة طت الياء من عندى لاجتماع الساكنين ويقال
  لا أمّ لن وهو ذم وربماوضع موضع المدح قال كعب بن سعديرنى أخاه
  هوت أمه ما يعث الصبح غاديا • وماذا يؤدى الليل حين يوْب
  والام بالفتح القصد يقال أمه وأعمه وتأعه اذا قصده وأمّه أيضا أى شجه آمة بالمذوهى التى
  تبلغ أمّ الدماغ حتى يبق بينها وبين الدماغ جلدرقيق ويقال رجل أميم ومأموم للذى
  يهدى من أتم رأسه والاميم يجر يندخ به الرأس وقال• بالمنجنيات وبالامائم• ويقال
  لبعير العمد المتأكل السنام مأموم وأممت القوم فى الصلاة امامة وأتم بداقتدى به وأمت
  المرأة صارت أما والامام خشبة البناءالق يسوى عليها البناه وقال
  وخلقته حق اذاتم واستوى • كمنة ساق أوكتن امام
  قال الاصعى يصف سهما ألاترى الى قوله بعده
  قرنت محقويه ثلا نافلم يزغ • عن القصدحتى بصرت بدمام
  والامام الصقع من الارض والطريق قال تعالى وانه مالبامام مبين والامام الذى يقتدى
  به وجمعه أيمة وأصلد آعمة على فاعلة مثل اناء وآنية واله وآلهة فأدغمت الميم فنقات حركتها
  الى ماقبلها فلماحركوها بالكسر جعلوهاياه وقرى فقاتاوا أيمة السكفر قال الاخفش
  جعلت الهمزق ياءلانه افى موضع كسر وما قبلها مفتوح فلم ي مزلاجتماع الهمزتين قال ومن
  كان من رأيه يجع الهمزتين همزه قال وتصغيرها أو يمة لما تحركت الهمزة بالفتصة قليها واوا
  وقال المازنىّ أيمة ولم يقلب وتقول كنت أمامه أى قسدامه وقوله تعالى وكل شأحصيناه
  فى امام مبيز قال الحس-ن فى كتاب مبين وأمامة اسم امرأة قال ابن السكيت الامم بين
  القريب والبعيد وهو من المقاربة والامم الشى اليسير يقال ماسألت الاأعما ولوظلمت ظلهما
  أعما وقول زهيره وجيرة ماهم لوأنهم أمم• يقول أىّ جيرة كانو الوأنهم بالقرب منى ويقال
  أخذت ذلك من أمم أى من قرب ودارى أحم داره أى مقا باتها أوعمروالمؤام بتشديد الميم
  المقارب أخذمن الامم وه والقرب و يقال هذا أمر موام مثل مضان ويقال لنشى اذا كان
  مقار باهو مؤام وتأمت أى اتخذت أما قال السكميت
  ومن عجب عجيل لعمروام • غذتك وغيرها تتأعمينا
  وقول الشاعر
  وما أمى وأمّ الوحش لما • تفرّع فى مفارقى المشيب
  يقول ما أنا وطلب الوحش بعدما كبرت يعنى الجوادى وذكرالام حشوفى البيت واما أم
  مخففة فهى حرف =طف فى الاستهام واهاموضعان أحدهما أن تقسع معادلة لااف
  الاستفهام؟عنى أى تقول أزيد فى الدارام عمرووالمعنى أيهمافيها والثانى أن تكون
  قطعه
