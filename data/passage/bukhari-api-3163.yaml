label: { ar: "صحيح البخاري 3163 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3163 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3163 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3163 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3163 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، عَنْ يَحْيَى بْنِ سَعِيدٍ، قَالَ سَمِعْتُ أَنَسًا ـ قَالَ دَعَا النَّبِيُّ الأَنْصَارَ لِيَكْتُبَ لَهُمْ بِالْبَحْرَيْنِ فَقَالُوا لاَ وَاللَّهِ حَتَّى تَكْتُبَ لإِخْوَانِنَا مِنْ قُرَيْشٍ بِمِثْلِهَا. فَقَالَ ذَاكَ لَهُمْ مَا شَاءَ اللَّهُ عَلَى ذَلِكَ يَقُولُونَ لَهُ قَالَ \" فَإِنَّكُمْ سَتَرَوْنَ بَعْدِي أُثْرَةً، فَاصْبِرُوا حَتَّى تَلْقَوْنِي عَلَى الْحَوْضِ\"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3163، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3163 (Jizyah and Mawaada'ah), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3163، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3163 (Jizyah y Mawaada'ah), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih al-Bukhari, n° 3163 (Jizya et Mawaada'ah), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
