label: { ar: "الموطأ 1367 — مالك: أحسن ما سمع في اللغو أنه حلف الإنسان على شيء يستيقن أنه كذلك، ثم يوجد على غير ذلك", en: "Muwatta 1367", es: "Muwatta 1367", fr: "Muwatta 1367", ur: "موطا 1367", tr: "El-Muvatta 1367 — Malik: Boş konuşma konusunda duyduğum en iyi şey, bir insanın doğru olduğundan emin olduğu bir şeye yemin etmesi, sonra da bunun aksinin çıkmasıdır.", id: "Al-Muwatta 1367 — Malik: Hal terbaik yang pernah kudengar tentang omong kosong adalah ketika seseorang bersumpah atas sesuatu yang dia yakini benar, lalu ternyata itu tidak benar." }
summary:
  ar: "يقول مالك أحسن ما سمعه في هذا أن اللغو حلف الإنسان على الشيء يستيقن أنه كذلك، ثم يوجد على غير ذلك، فهو اللغو. {cite:muwatta-maruf-1997 p.612}"
  tr: "Malik, bu konuda duyduğu en iyi şeyin, bir kişinin kesin olarak doğru olduğuna yemin etmesi ve sonra bunun aksinin ortaya çıkması durumunda boş lafın söz konusu olduğu olduğunu söylüyor. {cite:muwatta-maruf-1997 s.612}"
  id: "Malik mengatakan hal terbaik yang pernah ia dengar mengenai masalah ini adalah bahwa omong kosong adalah ketika seseorang bersumpah atas sesuatu yang ia yakini benar, dan kemudian ternyata sebaliknya; itulah omong kosong. {cite:muwatta-maruf-1997 p.612}"
