label: { ar: "الموطأ 125 — عمر يغسل ثوبه في عمرته ويأبى أن يسن للناس ما لا يجدون", en: "Muwatta 125", es: "125 copias", fr: "125 exemplaires", ur: "125 کاپیاں", tr: "Al-Muwatta 125 — Ömer, Umre sırasında elbisesini yıkar ve insanların yapamayacakları şeyleri onlara kanun olarak koymayı reddeder.", id: "Al-Muwatta 125 — Umar mencuci pakaiannya selama ibadah Umrah dan menolak untuk membuat undang-undang bagi orang-orang tentang apa yang tidak mampu mereka lakukan." }
text: "لئن كنت تجد ثياباً أفكل الناس يجد ثياباً؟ والله لو فعلتها لكانت سنة"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن يحيى بن عبد الرحمن بن حاطب، في باب إعادة الجنب الصلاة: اعتمر يحيى مع عمر بن الخطاب في ركب فيهم عمرو بن العاص، فنزل عمر آخر الليل للراحة قريباً من ماء فاحتلم وقد كاد يصبح، ولم يجد مع الركب ماءً، فركب حتى بلغ الماء وجعل يغسل ما رأى من أثر الاحتلام حتى أسفر. فقال له عمرو: قد أصبحت ومعنا ثياب، فدع ثوبك يُغسل. فأجابه عمر متعجباً: إن كنت تجد ثياباً أفكل الناس يجد؟ وأقسم أنه لو فعلها لصارت سنة يتبعها الناس، بل يغسل ما رأى وينضح ما لم ير. ويفسر المحقق التعريس بالنزول آخر الليل للاستراحة، ويذكر أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي، ويحيل على مصنف عبد الرزاق. {cite:muwatta-maruf-1997 p.95}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından, o da Yahya ibn Abdülrahman ibn Hatib'den, ritüel kirlilik halindeki bir kişinin namazı tekrarlaması bölümünde şöyle rivayet etmiştir: Yahya, Ömer ibn el-Hattab ile birlikte, Amr ibn el-As'ın da bulunduğu bir kervanla Umre yapıyordu. Ömer gece geç saatlerde bir su kaynağının yanında dinlenmek için durdu ve şafak sökerken ıslak bir rüya gördü. Kervanda su bulamayınca suya ulaşana kadar at sürdü ve gün ağarana kadar ıslak rüyanın izlerini yıkamaya başladı. Amr ona, \"Sabah oldu ve yanımızda elbiselerimiz var; elbiseni yıkayalım\" dedi. Ömer şaşkınlıkla, \"Senin elbisen varsa, herkesin elbisesi mi var?\" diye sordu. Eğer bunu yapsaydı, başkalarının da izleyeceği bir emsal olacağına yemin etti. Bunun yerine, gördüğünü yıkayıp görmediğine su serpeceğini söyledi. Araştırmacı, \"durmak\" ifadesini gece geç saatlerde dinlenmek için durmak olarak yorumluyor ve Ebu Mus'ab ile İbn Vahb'ın bunu el-Tahavi'nin eserinde Malik'ten rivayet ettiğini belirtiyor ve Abdülrazzak'ın Musannaf'ına atıfta bulunuyor. {cite:muwatta-maruf-1997 s.95}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, dari Yahya ibn Abd al-Rahman ibn Hatib, dalam surah tentang orang yang dalam keadaan najis mengulang salat: Yahya melakukan Umrah bersama Umar ibn al-Khattab dalam kafilah yang termasuk Amr ibn al-As. Umar berhenti untuk beristirahat larut malam di dekat sumber air dan mengalami mimpi basah saat fajar mendekat. Ia tidak menemukan air bersama kafilah, jadi ia berkuda sampai mencapai air dan mulai membersihkan jejak mimpi basah itu sampai terang. Amr berkata kepadanya, \"Sudah pagi, dan kita membawa pakaian; cucilah pakaianmu.\" Umar menjawab dengan heran, \"Jika kamu membawa pakaian, apakah semua orang juga membawanya?\" Ia bersumpah bahwa jika ia melakukannya, itu akan menjadi contoh yang diikuti orang lain. Sebaliknya, ia akan membersihkan apa yang dilihatnya dan memercikkan air pada apa yang tidak dilihatnya. Peneliti menafsirkan \"berhenti\" sebagai berhenti larut malam untuk beristirahat, dan menyebutkan bahwa Abu Mus'ab dan Ibn Wahb meriwayatkannya dari Malik dalam karya al-Tahawi, dan merujuk pada Musannaf karya Abd al-Razzaq. {cite:muwatta-maruf-1997 p.95}"
