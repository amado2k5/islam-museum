ref: "1.125"
label: { ar: "الموطأ 125 — عمر يغسل ثوبه في عمرته ويأبى أن يسن للناس ما لا يجدون", en: "Muwatta 125" }
text: "لئن كنت تجد ثياباً أفكل الناس يجد ثياباً؟ والله لو فعلتها لكانت سنة"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن يحيى بن عبد الرحمن بن حاطب، في باب إعادة الجنب الصلاة: اعتمر يحيى مع عمر بن الخطاب في ركب فيهم عمرو بن العاص، فنزل عمر آخر الليل للراحة قريباً من ماء فاحتلم وقد كاد يصبح، ولم يجد مع الركب ماءً، فركب حتى بلغ الماء وجعل يغسل ما رأى من أثر الاحتلام حتى أسفر. فقال له عمرو: قد أصبحت ومعنا ثياب، فدع ثوبك يُغسل. فأجابه عمر متعجباً: إن كنت تجد ثياباً أفكل الناس يجد؟ وأقسم أنه لو فعلها لصارت سنة يتبعها الناس، بل يغسل ما رأى وينضح ما لم ير. ويفسر المحقق التعريس بالنزول آخر الليل للاستراحة، ويذكر أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي، ويحيل على مصنف عبد الرزاق. {cite:muwatta-maruf-1997 p.95}"
