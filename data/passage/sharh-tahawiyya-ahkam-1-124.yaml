text: "… نهاه اللّٰه تعالى عنه، ويصبر على ما أوجب اللّٰه عليه فيه الصبر، ويدفع ما أوجب اللّٰه عليه دفعه من المكروهات. وهذه الأعمال من طلب أو دفع للمقدرات تجري فيها الأحكام التكليفية: الواجب والمحرم والمكروه والمستحب والمباح. فلا بد من التسليم …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 124، يرد فيه ذكر الواجب، وما يجب على المكلف، والمستحب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 124, whose wording mentions the obligatory (wajib), what is binding on the person addressed, the recommended (mustahabb), the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 124 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، مستحب، مکروہ، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on the Tahawi creed de Ibn Abi al-'Izz, volume numérisé 1, p. 124, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, le recommandé (mustahabb), le réprouvé (makruh), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on the Tahawi creed de Ibn Abi al-'Izz, volumen digitalizado 1, p. 124, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo recomendado (mustahabb), lo reprobado (makruh), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi üzerine tefsirinin 1. cildinin 124. sayfasından bir alıntı; farz, tavsiye edilen, mekruh ve caiz amellerin yanı sıra yasal olarak sorumlu bir kişiden beklenenleri ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-`Izz tentang Akidah al-Tahawi, Jilid 1, halaman 124, yang membahas amalan wajib, anjuran, makruh, dan halal, serta apa yang dituntut dari seseorang yang bertanggung jawab secara hukum. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
