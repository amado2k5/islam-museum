label:
  ar: "السيرة النبوية للسلاّبي — كعب بن مالك — اعتذاره «ما خلفك؟ ألم تكن قد ابتعت ظهرك»"
  en: "al-Sallabi's Sirah — Ka'b's excuses — 'what kept you back?'"
  es: "La Sirah de al-Sallabi — las excusas de Ka'b — \"¿Qué te detuvo?\""
  fr: "La Sirah d'al-Sallabi — les excuses de Ka'b — « Qu'est-ce qui vous a retenu ? »"
  ur: "السلبی کی سیرت - کعب کا عذر - 'آپ کو کس چیز نے روکا؟'"
text: "فتياممت: تيممت: قصدت . ⁦(٥)⁩ فسجرتها: أحرقتها. ⁦(٦)⁩ أوفى على سلع: صعده وارتفع عليه، وسلع جبل بالمدينة معروف. ⁦(٧)⁩ فاذن الناس: أي أعلمهم. ٨٤٢ المبحث الرابع: قصة الثلاثة الذين خُلِّفوا يومئذٍ، واستعرت ثوبين فلبستهما، وانطلقت إلى رسول اللّٰه…"
summary:
  ar: "مقطع من السيرة النبوية للسلاّبي، في غزوة تبوك، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Sallabi's al-Sira al-Nabawiyya, in غزوة تبوك, from the extracted copy; quoted within forty words per the sources policy."
  es: "Un extracto de al-Sira al-Nabawiyya de al-Sallabi, en غزوة تبوك, de la copia extraída; citado dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait d'al-Sira al-Nabawiyya d'al-Sallabi, dans غزوة تبوك, de la copie extraite; cité en quarante mots conformément à la politique des sources."
  ur: "الصلبی کی السیرۃ النبویہ سے ایک اقتباس، غزوة تبوك میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
