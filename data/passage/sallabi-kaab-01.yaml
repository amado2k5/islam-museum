  en: "al-Sallabi's Sirah — Ka'b's excuses — 'what kept you back?'"
text: "فتياممت: تيممت: قصدت . (٥) فسجرتها: أحرقتها. (٦) أوفى على سلع: صعده وارتفع عليه، وسلع جبل بالمدينة معروف. (٧) فاذن الناس: أي أعلمهم. ٨٤٢ المبحث الرابع: قصة الثلاثة الذين خُلِّفوا يومئذٍ، واستعرت ثوبين فلبستهما، وانطلقت إلى رسول اللّٰه…"
summary:
