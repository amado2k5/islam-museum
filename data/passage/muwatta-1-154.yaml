label: { ar: "الموطأ 154 — ابن شهاب: الحامل ترى الدم تكف عن الصلاة", en: "Muwatta 154", es: "Muwatta 154", fr: "Muwatta 154", ur: "موطا 154", tr: "El-Muvatta 154 — İbn Şihab: Kan gören hamile bir kadın namaz kılmaktan kaçınmalıdır.", id: "Al-Muwatta 154 — Ibn Shihab: Seorang wanita hamil yang melihat darah hendaknya menahan diri dari salat." }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب الزهري عن المرأة الحامل ترى الدم فقال: تكف عن الصلاة؛ ويروي يحيى عن مالك أن ذلك الأمر عند أهل المدينة. وهو في باب جامع الحيضة. ويذكر المحقق أن عبد الرزاق أخرجه عن معمر عن الزهري وقتادة. {cite:muwatta-maruf-1997 p.105}"
  tr: "Malik, İbn Şihab el-Zuhri'ye hamile bir kadının kanama görmesi durumunda ne yapılması gerektiğini sorduğunu ve onun da \"Namazdan uzak durmalıdır\" dediğini rivayet eder. Yahya, Malik'ten naklederek bunun Medine halkı arasında yaygın bir uygulama olduğunu belirtir. Bu, adet görme bölümünde yer almaktadır. Editör, Abd el-Razzaq'ın bunu Ma'mar'dan, el-Zuhri ve Katade'den rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.105}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Ibn Shihab al-Zuhri tentang seorang wanita hamil yang melihat darah, dan beliau berkata: Ia hendaknya menahan diri dari salat. Yahya meriwayatkan dari Malik bahwa ini adalah praktik yang umum di kalangan penduduk Madinah. Hal ini terdapat dalam surah tentang haid. Editor menyebutkan bahwa Abd al-Razzaq meriwayatkannya dari Ma'mar, berdasarkan riwayat al-Zuhri dan Qatadah. {cite:muwatta-maruf-1997 p.105}"
