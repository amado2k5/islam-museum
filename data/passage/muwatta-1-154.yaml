summary:
  ar: "يروي مالك أنه سأل ابن شهاب الزهري عن المرأة الحامل ترى الدم فقال: تكف عن الصلاة؛ ويروي يحيى عن مالك أن ذلك الأمر عند أهل المدينة. وهو في باب جامع الحيضة. ويذكر المحقق أن عبد الرزاق أخرجه عن معمر عن الزهري وقتادة. {cite:muwatta-maruf-1997 p.105}"
