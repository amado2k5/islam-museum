summary:
  ar: "القسم 79 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاستئذان»، ويضم فيها النصوص من 6227 إلى 6303 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 79 of Sahih al-Bukhari (Asking Permission) in the division of the open hadith dataset the museum took its reports from: reports 6227 to 6303 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 79، عنوان «کتاب الاستئذان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6227 تا 6303۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 79 de Sahih al-Bukhari (Pedir permiso) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6227 al 6303 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 79 du Sahih al-Bukhari (Demande de permission), dans la section du recueil ouvert de hadiths: les hadiths 6227 à 6303 de cette numérotation. Le musée classe ses archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 79. bölümü \"İzin İsteme Kitabı\" başlığını taşımakta olup, 6227 ile 6303 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 79 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Memohon Izin\" dan berisi teks 6227 hingga 6303, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
