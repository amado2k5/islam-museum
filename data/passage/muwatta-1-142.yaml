label: { ar: "الموطأ 142 — مالك في صفة التيمم: ضربة للوجه وضربة لليدين", en: "Muwatta 142", es: "Muwatta 142", fr: "Muwatta 142", ur: "موطا 142", tr: "El-Muvatta 142 — Malik'in teyemmümün tanımı üzerine: yüze bir vuruş, ellere bir vuruş.", id: "Al-Muwatta 142 — Malik tentang penjelasan tayammum: satu pukulan untuk wajah dan satu pukulan untuk tangan" }
summary:
  ar: "فتوى لمالك في باب العمل في التيمم: سُئل كيف التيمم وأين يبلغ به، فقال: يضرب ضربة للوجه وضربة لليدين ويمسحهما إلى المرفقين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.101}"
  tr: "Malik'in teyemmüm uygulamasıyla ilgili bir fetvası: Ona teyemmümün nasıl yapılacağı ve ne kadar uzatılması gerektiği sorulduğunda, şöyle buyurmuştur: Yüzüne bir kez, ellerine de bir kez vurur ve dirseklerine kadar siler. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.101}"
  id: "Fatwa Malik mengenai praktik tayammum: Beliau ditanya bagaimana cara melakukan tayammum dan seberapa jauh harus dilakukan, lalu beliau menjawab: Ia menepuk wajah sekali dan tangan sekali, lalu mengusapnya hingga siku. Peneliti menyebutkan bahwa fatwa ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.101}"
