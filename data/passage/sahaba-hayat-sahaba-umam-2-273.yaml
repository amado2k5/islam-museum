text: "… اللّٰه بن مسعود قال: بينا رسول اللّٰه فى المسجد وابو جهل بن هشام وشية وعتبة ابنا ريعة و عقبة بن ابى معيط وامية بن خلف ورجلان آخران كانوا سبعة وهم فى الحجر ورسول اللّٰه يصلى، فلما سجد اطال السجود. فقال …"
summary:
