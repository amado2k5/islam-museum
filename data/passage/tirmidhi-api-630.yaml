text: "قُلْتُ مَا عِنْدَنَا عَسَلٌ نَتَصَدَّقُ مِنْهُ وَلَكِنْ أَخْبَرَنَا الْمُغِيرَةُ بْنُ حَكِيمٍ أَنَّهُ قَالَ لَيْسَ فِي الْعَسَلِ صَدَقَةٌ ‏.‏ فَقَالَ عُمَرُ عَدْلٌ مَرْضِيٌّ ‏.‏ فَكَتَبَ إِلَى النَّاسِ أَنْ تُوضَعَ ‏.‏ يَعْنِي عَنْهُمْ ‏.‏"
summary:
  ar: "في جامع الترمذي؛ إرسال كتاب أو رسالة إلى طرف."
