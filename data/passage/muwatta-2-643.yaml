label: { ar: "الموطأ 643 — كعب بن مالك: إنما نسمة المؤمن طير يعلق في شجر الجنة حتى يرجعه الله إلى جسده يوم يبعثه", en: "Muwatta 643" }
text: "إنما نسمة المؤمن طير يعلق في شجر الجنة، حتى يرجعه الله إلى جسده يوم يبعثه"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبد الرحمن بن كعب بن مالك الأنصاري، أن أباه كعب بن مالك كان يحدث أن النبي قال إن نسمة المؤمن طير يعلق في شجر الجنة حتى يرجعه الله إلى جسده يوم يبعثه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومن طريقه ابن ماجة (4271)، والقعنبي، وابن وهب، وابن القاسم، وعثمان بن عمر عند الطبراني، والشافعي عند أحمد (6/386)، والمعافى بن عمران عند ابن عبد البر في التمهيد (11/56). {cite:muwatta-maruf-1997 p.328}"
