label: { ar: "الموطأ 643 — كعب بن مالك: إنما نسمة المؤمن طير يعلق في شجر الجنة حتى يرجعه الله إلى جسده يوم يبعثه", en: "Muwatta 643", es: "Muwatta 643", fr: "Muwatta 643", ur: "موطا 643", tr: "El-Muvatta 643 — Ka'b ibn Malik: Müminin ruhu, Allah kıyamet günü onu bedenine geri verene kadar cennet ağaçlarında asılı duran bir kuş gibidir.", id: "Al-Muwatta 643 — Ka’b ibn Malik: Jiwa orang beriman itu seperti burung yang bergelantungan di pepohonan Surga hingga Allah mengembalikannya ke tubuhnya pada Hari Kiamat." }
text: "إنما نسمة المؤمن طير يعلق في شجر الجنة، حتى يرجعه الله إلى جسده يوم يبعثه"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبد الرحمن بن كعب بن مالك الأنصاري، أن أباه كعب بن مالك كان يحدث أن النبي قال إن نسمة المؤمن طير يعلق في شجر الجنة حتى يرجعه الله إلى جسده يوم يبعثه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومن طريقه ابن ماجة (4271)، والقعنبي، وابن وهب، وابن القاسم، وعثمان بن عمر عند الطبراني، والشافعي عند أحمد (6/386)، والمعافى بن عمران عند ابن عبد البر في التمهيد (11/56). {cite:muwatta-maruf-1997 p.328}"
  tr: "Malik, İbn Şihab'dan, o da Abdülrahman ibn Ka'b ibn Malik el-Ensari'den rivayetle, babası Ka'b ibn Malik'in Peygamber'in şöyle buyurduğunu aktardığını nakletmiştir: \"Müminin ruhu, Allah onu kıyamet günü bedenine geri döndürinceye kadar cennet ağaçlarında tüneyen bir kuş gibidir.\" Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd tarafından, onun zinciriyle de İbn Majah (4271), el-Ka'nebi, İbn Vahb, İbn el-Kâsim, Osman ibn Ömer (el-Taberani'ye göre), el-Şafiî (Ahmed'e göre, 6/386) ve el-Mu'afa ibn İmran (İbn Abdül-Barr'a göre, el-Tamhid'de, 11/56) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.328}"
  id: "Malik meriwayatkan hadits ini dari Ibn Shihab, dari Abd al-Rahman ibn Ka'b ibn Malik al-Ansari, bahwa ayahnya, Ka'b ibn Malik, biasa meriwayatkan bahwa Nabi bersabda: \"Jiwa orang beriman adalah seekor burung yang bertengger di pepohonan Surga hingga Allah mengembalikannya ke tubuhnya pada Hari Kiamat.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwayd, dan melalui sanadnya oleh Ibn Majah (4271), al-Qa'nabi, Ibn Wahb, Ibn al-Qasim, Uthman ibn Umar (menurut al-Tabarani), al-Shafi'i (menurut Ahmad, 6/386), dan al-Mu'afa ibn Imran (menurut Ibn Abd al-Barr dalam al-Tamhid, 11/56). {cite:muwatta-maruf-1997 p.328}"
