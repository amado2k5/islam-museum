label: { ar: "موطأ مالك 1121 — ما أُحل، ما لا يحل", en: "Muwatta Malik 1121 — what was made lawful; what is not lawful", ur: "موطأ مالک 1121 — جو حلال کیا گیا، جو حلال نہیں" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ زَيْدِ بْنِ ثَابِتٍ، أَنَّهُ كَانَ يَقُولُ فِي الرَّجُلِ يُطَلِّقُ الأَمَةَ ثَلاَثًا ثُمَّ يَشْتَرِيهَا إِنَّهَا لاَ تَحِلُّ لَهُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ."
summary:
  ar: "حديث في موطأ مالك، رقم 1121، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1121 (Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1121، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
