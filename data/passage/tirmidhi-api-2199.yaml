label: { ar: "جامع الترمذي 2199 — الأب والأبوة", en: "Jami' al-Tirmidhi 2199 — the father and fatherhood", ur: "جامع ترمذی 2199 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2199 — El padre y la paternidad" }
text: "… الْخَلاَّلُ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا شُعْبَةُ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ عَلْقَمَةَ بْنِ وَائِلِ بْنِ حُجْرٍ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ وَرَجُلٌ سَأَلَهُ فَقَالَ أَرَأَيْتَ إِنْ كَانَ عَلَيْنَا أُمَرَاءُ يَمْنَعُونَا حَقَّنَا وَيَسْأَلُونَا حَقَّهُمْ فَقَالَ رَسُولُ اللَّهِ \" اسْمَعُوا وَأَطِيعُوا فَإِنَّمَا عَلَيْهِمْ مَا حُمِّلُوا وَعَلَيْكُمْ مَا حُمِّلْتُمْ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2199، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2199 (Chapters On Al-Fitan), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2199، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2199 (Capítulos sobre Al-Fitan), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
