text: "… الرحمن بن عوف: لستما من هذا في شيء إنمًا هذا إلى صهيب الذي أمره عمر أن يصلِّيَ بالناس. فتقدم صهيب وصلَّى عليه، ونزل في قبره مع ابنه عبد اللّٰه أهل الشورى سوى طلحة فإنَّه كان غائباً، فلمَّا فرغ من شأن …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 4، ص 145، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 4, p. 145, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 4، ص 145 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
