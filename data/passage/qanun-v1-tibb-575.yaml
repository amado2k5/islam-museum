text: "… وخصوصاً مع دقيق الشيلم والعسل، والنرجس يجلو الكلف والبهق، وخصوصاً أصله بالخلّ، وينفع أصله من داء الثعلب. الأورام والبثور : أصله يعجن مع العسل الكرسنة فيفجّر الدبيلات العسرة النضج، ويضمّد بأصله من أورام العصب. الجراح والقروح : يجفّف الجراحات ويلزقها …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 575، يذكر التداوي بالعسل، والجذام والبرص، والجراحة والختان والجبائر، ومداواة الجراح، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 575, that mentions honey as a remedy, leprosy and vitiligo, surgery, circumcision and splints, the treatment of wounds, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 575 کا اقتباس جس میں شہد سے علاج، جذام اور برص، جراحت، ختنہ اور پٹیاں، زخموں کا علاج، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
