text: "… وَالأنْصَابُ فَاقْتَلْهُمْ، فَقَدْ أَحَلُوا مَا حَرَّمَ اللّهُ، وَإِنْ زَعَمُرا أَنْهَا حَرَامٌ، وَرَوَى الْوَاقِدِيّ أَنْ عُمَرَ قَالَ لَهُ: أَخْطَأْت التَّأْويلَ يَا قُدَامَةً، إذَا أَسْكَرَ كَيْرُهُ، فَقَلِلُهُ حَرَامٌ رَوَاهُمَا أَبو دَاوُد، وَالأثْرَمُ، وَغَيْرُهُمَا اتْقَيْت اجْتَبْت مَا حَرَّمَ اللهُ عَلَيْكَ. وَرَوَى الْخَلالُ بِإِسْنَادِهِ …"
summary:
