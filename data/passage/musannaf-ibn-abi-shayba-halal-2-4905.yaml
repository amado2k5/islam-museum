text: "… وَلِيه يقول: الحلال بَيِّنّ والحرام بَيِّنٌ، وبينهما أمور مشتبهات، فمن اتقى الشبهات استبرأ لدينه وعرضه، ومن وقع في الشبهات وقع في الحرام كالراعي يرعى حول الحمى يوشك أن يرتع فيه، ألا وإن لكل ملك حمى وإن حمى اللّٰه محارمه، ألا …"
