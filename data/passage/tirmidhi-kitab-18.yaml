summary:
  ar: "القسم 18 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصيد والذبائح عن رسول الله»، ويضم فيها النصوص من 1464 إلى 1492 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 18 of Jami' al-Tirmidhi (The Book on Hunting) in the division of the open hadith dataset the museum took its reports from: reports 1464 to 1492 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 18، عنوان «کتاب الصید والذبائح عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1464 تا 1492۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 18 de Jami' al-Tirmidhi (El Libro de la Caza) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 1464 a 1492 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
