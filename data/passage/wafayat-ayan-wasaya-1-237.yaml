text: "… لم أقدر على حفظ في ذلك الوقت، ولم أسمع منه غير هذا الفصل. وكان مولده يوم الاربعاء الثاني والعشرين من شوال سنة إحدى وستين وخمسمائة، وتوفي يوم الاثنين سابع رجب من سنة ثمان وعشرين وستمائة بحلب، ودفن في سفح جبل …"
