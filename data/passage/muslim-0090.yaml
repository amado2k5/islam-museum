text: "قال رسول الله: «من الكبائر شتم الرجل والديه»، قالوا: يا رسول الله وهل يشتم الرجل والديه؟ قال: «نعم، يسب أبا الرجل فيسب أباه، ويسب أمه فيسب أمه»"
summary:
  ar: "رواية عبد الله بن عمرو بن العاص في باب بيان الكبائر من كتاب الإيمان في صحيح مسلم؛ يجعل التسبب في شتم الوالدين كشتمهما."
