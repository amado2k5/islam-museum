text: |-
  ٢ أى بفتح فسكون وقوله
  بالضم أى فالكون وقوله وقد
  يحرك زاد فى نسخة مشل عسمر
  وعسر فينظر هذامع عبارة
  المصنف السابقة يعنى فى
  القاموس ١ه مرتضى
  ٣ لضمير فى حرقناه يعود الى
  جل تتدم ذكره ام مرتضى
  1.0
  (نزب النيرب الشر والنميمة قال الشاعر
  ولست بذى نيرب فى الصديق • ومناع خير وسبابها
  ⁦(الضمير المشيرة)⁩
  ( نزب النزب هوت تيس القلباء عنزد الفاد يقسال نزب الظبى ينزب بالصكسرنزيبا
  ن سب) النسب واحد الانساب والنسبة والنسبة مثل ١ و نتسب الى أبيه أى اعتزى
  وتنسب أى اتّعى أنه نسيبك وفى المثل القريب من تقرب لا من تنسب ورجل نسابة أى عليم
  بالانساب الهاء للمبالغة فى المدح كأتهم يريدون به داهية أرغاية ونهاية وتقول عندى ثلاثة
  نسابات وعلامات تريد ثلاثة رجال ثم جئت بنسابات نعماله-م وفلان بناسب فلانا فهو نسيبه
  أى قريبه وتقول ليس بيته-مامناسبة أى مشاكاة ونسبت الرجل أنسبه بالضم نسبة ونسبا
  اذا ذكرت نسبه ونسب الشاءر بالمرأة ينسب بالكسر نسيبا اذاشبب بهاوالني-ب الذى تراه
  كالطريق من التمل نفسها وهو فيعل وقال عيداترى الناس اليهانيسبا ⁦(نسب)⁩
  النشب المال والعقار وتشب الثى فى الشى بالكسرنشوبا أى علق فيه وأنشبته أنافيه أى
  أعلقته فانتشب وأنشب الصائدأعلق ويقال نشبت الحرب بينه-م وقدناشبه الحرب أى نابذه
  والنشاب السهام الواحدة نشاية والناشب صاحب النشاب وقوم ناشبة ومنه سحى الرجل
  ناشبا ونشبة بالضم اسم رجل وهو نشبة بن غيظ بن مرة بن عوف بن سعدين ذبيان ⁦( نصب)⁩
  النصب مصد رنصبت الشى اذا أقته وصفيح منصب أى نصب بعضه على بعض ونصبت الخيل
  آذا نم اشدد للمكثرة والمبالغسة ونصبت لفلان نصبا اذا عاديته وناصبته الحرب مناصبة ونصب
  القوم ساروايومهم وهوسيراين والمنصب الاصل وكذلك النصاب والنصاب من المال القدر
  الذى تجب فيه الزكاادابلغه تحو مائى درهم وخس من الابل ونصاب اسم فرس ونصاب
  السكين مق.ضه وأنسبت الكين جعات له مقبضا ونصب الرجل بالكسر نصبائعب وأنصب
  غير، وهتمّ ناصب أى ذونسب مشل تامر ولا بن ويقال (هوفاعسل بمعنى مفعول فيه لانه
  نصب فيه ويتعب كة واهسم ليل نائم أى ينام فيه ويوم عاصف أى تعصف فيه الريح وتيس
  أنصب وعنز نصباء بينة النصب اذا انتصب قرناها وناقة نصباء هى تفعة الصدروتندبت الاتن
  حول الهاروغناء النصب ضرب من الالحمان وفى الحديث لوندبت لمائصب العرب أى
  لو غنيتناغناء العرب وهوغنا لهم يشبه الحداء الا أنه أرق منه والتصب فى الاعراب كالفتح
  فى البناء وهو من مواضعات النحويين تقول منه نصبت الحرف قانتصب وغبار. نتصب أى
  مر تفع والنصب⁦(٢)⁩ ما تصب فعبد من دون اللّٰه تعالى وكذلك النصب بالضم وقد يحرّك
  قال الاعنى وذا النصب المنصوب لا تنسكنه • لعاقبة واللّٰه ربك فاعبدا
  أراد فاعبهن فوقف بالالف كماتول رأيت زيدا والجمع الانصاب وقوله وذا النصب بعنى
  اياك وهذا النصب وهوللتقريب كما قال
  واقدستمت من الحياة وطولها • وسؤال هذا الناس كيف لبيد
  والنعب الشرّ والبلاء ومنه قوله تعالى مسى الشيطان بنصب وعذاب والنصيية حهارة
  تنسبحول الموض ويستما بينها من الخصاص بالمدرة المعجونة قال الشاعر
  ⁦(٣)⁩ ه قناه فى بادى النشيئة دائر * قديم بعهد الماه بقع نصائيه
  والنعيب
