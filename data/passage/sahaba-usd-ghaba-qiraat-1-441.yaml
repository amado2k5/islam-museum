text: "… أبا حذيفة، وتبناه أبو حذيفة، فلذلك عُدّ من المهاجرين، وهو معدود في بني عبيد من الأنصار، لعتق مولاته زوج أبي حذيفة له، وهو معدود في قريش لما ذكرناه، وفي العجم أيضاً لأنه منهم، ويعد في القُرَّاء لقول رسول اللّٰه مليع …"
