text: "… عندها نتساوى ذهب يوماً إلى إحدى البلاد، للوعظ، ونزل عند بعض الوجهاء، ففي الصباح دعاه ذلك الوجيه، فأقرأهُ شيئاً، وقرأ هو مثله، وكتب له شيئاً فكتب نظيره. ثم قال له الرجل : إنِّي قرأتُ ما قرأْتَهُ، وكتبْتُ ما كتبته، فلا …"
summary:
  ar: "جاء جحا ليعظ في بلدة، فامتحنه أحد الوجهاء وهو يقرأ ويكتب مثله، وقال إنه لا فرق بينهما؛ فقال جحا إن الفرق كبير لأنه مشى ثلاثة أيام، ولو مشى الوجيه عائدًا بلا شيء لتساويا. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  en: "Juha comes to preach in a town and is tested by a notable who reads and writes as he does; the notable says there is no difference between them; Juha says there is a great difference, since he walked three days, and if the notable walked back with nothing, then they would be equal. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  ur: "جحا ایک شہر میں وعظ کرنے آیا تو ایک معزز شخص نے، جو اسی کی طرح لکھنا پڑھنا جانتا تھا، اسے آزمایا اور کہا کہ ہم دونوں میں کوئی فرق نہیں؛ جحا نے کہا کہ بہت فرق ہے، کیونکہ میں تین دن پیدل چل کر آیا ہوں، اور اگر آپ خالی ہاتھ پیدل لوٹیں تو ہم برابر ہو جائیں گے۔ {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  fr: "Juha vient prêcher dans une ville et est mis à l'épreuve par un notable qui lit et écrit comme lui; le notable dit qu'il n'y a pas de différence entre eux; Juha répond qu'il y en a une grande, car il a marché trois jours, et que si le notable rentrait à pied sans rien, ils seraient alors égaux. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  es: "Juha llega a una ciudad para predicar y lo pone a prueba un notable que lee y escribe como él; el notable dice que no hay diferencia entre ambos; Juha responde que hay una gran diferencia, pues él caminó tres días, y que si el notable regresara a pie sin nada, entonces serían iguales. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
