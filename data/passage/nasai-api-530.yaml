label: { ar: "سنن النسائي 530 — المستحب، ما كان يُكره", en: "Sunan al-Nasa'i 530 — the recommended (mustahabb); what used to be disliked", ur: "سنن نسائی 530 — مستحب، جو ناپسند کیا جاتا تھا", fr: "Sunan al-Nasa'i 530 — le recommandé (mustahabb) ; ce qui était réprouvé", es: "Sunan al-Nasa'i 530 — lo recomendado (mustahabb); lo que se reprobaba", tr: "Sunan an-Nasa'i 530 — Tavsiye edilenler, beğenilmeyenler", id: "Sunan an-Nasa'i 530 — Yang dianjurkan, yang tidak disukai" }
text: "… تَدْعُونَهَا الأُولَى حِينَ تَدْحَضُ الشَّمْسُ وَكَانَ يُصَلِّي الْعَصْرَ ثُمَّ يَرْجِعُ أَحَدُنَا إِلَى رَحْلِهِ فِي أَقْصَى الْمَدِينَةِ وَالشَّمْسُ حَيَّةٌ قَالَ وَنَسِيتُ مَا قَالَ فِي الْمَغْرِبِ قَالَ وَكَانَ يَسْتَحِبُّ أَنْ تُؤَخَّرَ صَلاَةُ الْعِشَاءِ الَّتِي تَدْعُونَهَا الْعَتَمَةَ قَالَ وَكَانَ يَكْرَهُ النَّوْمَ قَبْلَهَا وَالْحَدِيثَ بَعْدَهَا وَكَانَ يَنْفَتِلُ مِنْ صَلاَةِ الْغَدَاةِ حِينَ يَعْرِفُ الرَّجُلُ جَلِيسَهُ وَكَانَ يَقْرَأُ بِالسِّتِّينَ إِلَى الْمِائَةِ."
summary:
  ar: "حديث في سنن النسائي، رقم 530، يرد فيه ذكر المستحب، وما كان يُكره، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 530 (The Book of the Times (of Prayer)), whose wording mentions the recommended (mustahabb), what used to be disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 530، جس کے الفاظ میں مستحب، جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 530, dont le texte mentionne le recommandé (mustahabb), ce qui était réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 530, cuyo texto menciona lo recomendado (mustahabb), lo que se reprobaba, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de yer alan 530 numaralı hadis, müstehap olan, mekruh olan ve haram olan şeylerden bahsetmektedir. Bu hadis, farz, ibadet, müstehap, mekruh ve haram olan şeyler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 530, menyebutkan apa yang dianjurkan, apa yang tidak disukai, dan apa yang dilarang. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
