label: { ar: "صحيح مسلم 6340 — جمع القرآن والمصاحف", en: "Sahih Muslim 6340 — the collection of the Qur'an and the codices", ur: "صحیح مسلم 6340 — جمعِ قرآن اور مصاحف", es: "Sahih Muslim 6340 — la colección del Corán y los códices", fr: "Sahih Muslim 6340 — le recueil du Coran et des codex" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا أَبُو دَاوُدَ، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، قَالَ سَمِعْتُ أَنَسًا، يَقُولُ جَمَعَ الْقُرْآنَ عَلَى عَهْدِ رَسُولِ اللَّهِ أَرْبَعَةٌ كُلُّهُمْ مِنَ الأَنْصَارِ مُعَاذُ بْنُ جَبَلٍ وَأُبَىُّ بْنُ كَعْبٍ وَزَيْدُ بْنُ ثَابِتٍ وَأَبُو زَيْدٍ. قَالَ قَتَادَةُ قُلْتُ لأَنَسٍ مَنْ أَبُو زَيْدٍ قَالَ أَحَدُ عُمُومَتِي."
summary:
  ar: "حديث في صحيح مسلم، رقم 6340، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih Muslim, no. 6340 (The Book of the Merits of the Companions), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح مسلم کی حدیث نمبر 6340، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 6340 (El Libro de los Méritos de los Compañeros), menciona la colección del Corán y los códices. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sahih Muslim, n° 6340 (Livre des mérites des Compagnons), mentionne la collection du Coran et des codex. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ces documents avec les textes coraniques, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
