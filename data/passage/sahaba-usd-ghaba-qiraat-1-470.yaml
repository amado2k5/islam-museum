  fr: "Un extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 470), mentionne la collecte du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
