text: "… بن غالب بن عائذة بن يثِيع بن مُلَيح بن الهون بن خُزَيمة، والهون أخو أسد بن خزيمة، وهذا أنصاري، فكيف يجتمعان! وإنما هو القارئ، مهموزاً، من القراءة. سَعْد العَرْجي وقد ذكر أنه أول من جمع القرآن من الأنصار، ولم يجمع …"
summary:
