text: "… بن غالب بن عائذة بن يثِيع بن مُلَيح بن الهون بن خُزَيمة، والهون أخو أسد بن خزيمة، وهذا أنصاري، فكيف يجتمعان! وإنما هو القارئ، مهموزاً، من القراءة. سَعْد العَرْجي وقد ذكر أنه أول من جمع القرآن من الأنصار، ولم يجمع …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 470، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 470, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 470 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
