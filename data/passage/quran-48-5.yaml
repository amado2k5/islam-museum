  ur: { text: "(یہ) اس لئے کہ وہ مومن مردوں اور مومن عورتوں کو بہشتوں میں جن کے نیچے نہریں بہہ رہی ہیں داخل کرے وہ اس میں ہمیشہ رہیں گے اور ان سے ان کے گناہوں کو دور کردے۔ اور یہ خدا کے نزدیک بڑی کامیابی ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
