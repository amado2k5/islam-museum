text: "باب: كتاب الجنائز عن أبي سعيد قال: قال رسول اللّٰه وَالفِ: عودوا المريض، واتبعوا الجنازة، تذكركم الآخرة. - حدثنا أبو الأحوص عن أبي إسحاق عن الحارث عن علي إذا مرض قال: قال رسول اللّٰه وال في للمسلم على المسلم: يعوده …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 2761، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 2761, that mentions what a believer owes a believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 2761 کا اقتباس جس میں مومن کا مومن پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
