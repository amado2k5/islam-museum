text: "خَلَقَكُم مِّن نَّفْسٍ وَٰحِدَةٍ ثُمَّ جَعَلَ مِنْهَا زَوْجَهَا وَأَنزَلَ لَكُم مِّنَ ٱلْأَنْعَـٰمِ ثَمَـٰنِيَةَ أَزْوَٰجٍ ۚ يَخْلُقُكُمْ فِى بُطُونِ أُمَّهَـٰتِكُمْ خَلْقًا مِّنۢ بَعْدِ خَلْقٍ فِى ظُلُمَـٰتٍ ثَلَـٰثٍ ۚ ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ لَهُ ٱلْمُلْكُ ۖ لَآ إِلَـٰهَ إِلَّا هُوَ ۖ فَأَنَّىٰ تُصْرَفُونَ"
text_search: "خلقكم من نفس واحدة ثم جعل منها زوجها وأنزل لكم من الأنعام ثمانية أزواج ۚ يخلقكم في بطون أمهاتكم خلقا من بعد خلق في ظلمات ثلاث ۚ ذلكم الله ربكم له الملك ۖ لا إله إلا هو ۖ فأنى تصرفون"
translations:
  en: { text: "He created you from one being, then from that (being) He made its mate; and He hath provided for you of cattle eight kinds. He created you in the wombs of your mothers, creation after creation, in a threefold gloom. Such is Allah, your Lord. His is the Sovereignty. There is no Allah save Him. How then are ye turned away?", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اسی نے تم کو ایک شخص سے پیدا کیا پھر اس سے اس کا جوڑا بنایا اور اسی نے تمہارے لئے چار پایوں میں سے آٹھ جوڑے بنائے۔ وہی تم کو تمہاری ماؤں کے پیٹ میں (پہلے) ایک طرح پھر دوسری طرح تین اندھیروں میں بناتا ہے۔ یہی خدا تمہارا پروردگار ہے اسی کی بادشاہی ہے۔ اس کے سوا کوئی معبود نہیں پھر تم کہاں پھرے جاتے ہو؟", translator: "Fateh Muhammad Jalandhari", license: PD }
