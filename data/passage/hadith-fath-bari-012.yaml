text: "د القيس، وقد سبقوا غيرهم من القرى إلى الإسلام كما سبق بيانه في كتاب الإيمان(٥)، ووقع في بعض نسخ أبي ذر ((أو الهجر)) بزيادة ألف ولام والأول أشهر، وزعم بعض الشراح أن المراد بهجر هنا قرية قريبة من المدينة، وهو"
