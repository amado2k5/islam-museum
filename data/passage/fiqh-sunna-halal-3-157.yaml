text: "… يعلم أن أحد طرفيه لم يبلغ السن المحددة في القانون. المحرمات من النساء ليست كل امرأة صالحة للعقد عليها بل يشترط في المرأة التي يراد العقد عليها أن تكون غير محرمة على من يريد التزوج بها، سواء أكان هذا التحريم …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 157، يذكر ما حُرّم، والتحريم، والمحرمات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 157, that mentions what was made unlawful, prohibition, the forbidden things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 157 کا اقتباس جس میں جو حرام کیا گیا، تحریم، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 3, pág. 157, que menciona lo que se considera ilícito, la prohibición y las cosas prohibidas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
