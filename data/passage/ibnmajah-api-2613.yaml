label: { ar: "سنن ابن ماجه 2613 — الحلال، ما أُحل", en: "Sunan Ibn Majah 2613 — the lawful; what was made lawful", ur: "سنن ابن ماجہ 2613 — حلال، جو حلال کیا گیا", es: "Sunan Ibn Majah 2613 — lo lícito; lo que fue hecho lícito", fr: "Sunan Ibn Majah 2613 — le licite; ce qui a été rendu licite", tr: "Sunan İbn Majah 2613 — Helal olan, izin verilen şey", id: "Sunan Ibn Majah 2613 — Yang halal, yang diperbolehkan" }
text: "… اللَّهِ \" لاَ آذَنُ لَكَ وَلاَ كَرَامَةَ وَلاَ نُعْمَةَ عَيْنٍ كَذَبْتَ أَىْ عَدُوَّ اللَّهِ لَقَدْ رَزَقَكَ اللَّهُ طَيِّبًا حَلاَلاً فَاخْتَرْتَ مَا حَرَّمَ اللَّهُ عَلَيْكَ مِنْ رِزْقِهِ مَكَانَ مَا أَحَلَّ اللَّهُ عَزَّ وَجَلَّ لَكَ مِنْ حَلاَلِهِ. وَلَوْ كُنْتُ تَقَدَّمْتُ إِلَيْكَ لَفَعَلْتُ بِكَ وَفَعَلْتُ قُمْ عَنِّي وَتُبْ إِلَى اللَّهِ أَمَا إِنَّكَ إِنْ فَعَلْتَ بَعْدَ التَّقْدِمَةِ إِلَيْكَ ضَرَبْتُكَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2613، يذكر الحلال، وما أُحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2613 (The Chapters on Legal Punishments), that mentions the lawful, what was made lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2613، جس میں حلال، جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2613 (Capítulos sobre castigos legales), menciona lo lícito, lo que se hizo lícito y lo que se hizo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 2613 (Chapitres sur les peines légales), mentionne ce qui est licite, ce qui a été rendu licite et ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "İbn Mâce Sünen'inde yer alan 2613 numaralı hadis, helal olan, caiz olan ve haram olan şeyleri sıralamaktadır. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 2613, menyebutkan apa yang diperbolehkan, apa yang diizinkan, dan apa yang diharamkan. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
