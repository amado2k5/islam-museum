text: "… اليابس، ويغذو غذاء حسناً، وينفعٍ مِن الوسواس والغم والأمراض السوداوية، وإذا شَرِبَ مع العسل قى القروح الباطنة من الاخلاط العفنة، وشربه مع السكر يحسِّنُ اللون جداً، والحليب يتدارك ضرر الجماع، ويُوافق الصدر والرئة، جيد لأصحاب السل، رديء للرأس والمعدة، والكبد …"
