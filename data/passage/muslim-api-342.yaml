label: { ar: "صحيح مسلم 342 — حلاوة الإيمان وكماله", en: "Sahih Muslim 342 — the sweetness and completeness of faith", ur: "صحیح مسلم 342 — ایمان کی مٹھاس اور اس کا کمال", es: "Sahih Muslim 342 — La dulzura y la plenitud de la fe" }
text: "حَدَّثَنَا يُوسُفُ بْنُ يَعْقُوبَ الصَّفَّارُ، حَدَّثَنِي عَلِيُّ بْنُ عَثَّامٍ، عَنْ سُعَيْرِ بْنِ الْخِمْسِ، عَنْ مُغِيرَةَ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنْ عَبْدِ اللَّهِ، قَالَ سُئِلَ النَّبِيُّ عَنِ الْوَسْوَسَةِ قَالَ \" تِلْكَ مَحْضُ الإِيمَانِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 342، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih Muslim, no. 342 (The Book of Faith), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح مسلم کی حدیث نمبر 342، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 342 (El Libro de la Fe), menciona la dulzura y la plenitud de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
