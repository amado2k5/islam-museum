text: "… قريشٍ. يقال له حَبَّان بن العَرقَةِ، رماه في الأكحل ؛ فَضَرَب عليه رسول اللّه حيمة في المسجد، ليَعُودَهُ من قريب. فلما رجع رسول اللّٰه ي من الخندق، ووضع السلاح واغتسل، فأتاه جبريل وهو ينفض رأسه من الغبار، قال : قد …"
