text: "… الأخذ بأقل الاسم أو بآخره، ولما كان الدخول في الصلاة بتكبيرة واحدة بإجماع فكذلك الخروج منها بتسليمة واحدة، إلا أنه تواردت السنن الثابتة من حديث ابن مسعود - وهو أكثرها تواتراً - ومن حديث وائل بن حُجْر الحضرميّ وحديثِ عمّار …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن والمبين لما تضمنه من السنة وآي الفرقان، المجلد المصوَّر 3، ص 364، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 364, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "الجامع لاحکام القرآن، اسکین جلد 3، ص 364 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Jami' li-Ahkam al-Coran, volume numérisé 3, p. 364, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Jami' li-Ahkam al-Qur'an, volumen escaneado 3, p. 364, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Al-Jami' li-Ahkam al-Qur'an wa-al-Mubayyin lima Tadamanahu min al-Sunnah wa-Ayat al-Furqan, Resimli Cilt 3, s. 364'ten, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Al-Jami' li-Ahkam al-Qur'an wa-al-Mubayyin lima Tadamanahu min al-Sunnah wa-Ayat al-Furqan, Jilid Bergambar 3, hlm. 364, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Juha dan Islamic Folklore Browser."
