summary:
  ar: "أثر يرويه مالك عن يحيى بن محمد بن طحلاء عن عثمان بن عبد الرحمن أن أباه عبد الرحمن بن عثمان التيمي حدثه أنه شهد عمر بن الخطاب يغسل بالماء ما تحت إزاره، أي يستنجي بالماء؛ وهو في باب العمل في الوضوء. ويذكر المحقق أن رواية يحيى ومحمد بن الحسن «أنه سمع» وأن رواية أبي مصعب «أنه رأى» وهي أصح وأبين. {cite:muwatta-maruf-1997 p.53}"
