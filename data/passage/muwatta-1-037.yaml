label: { ar: "الموطأ 37 — عمر يستنجي بالماء", en: "Muwatta 37", es: "Muwatta 37", fr: "Muwatta 37", ur: "موطا 37", tr: "Al-Muwatta 37 — Ömer suyla temizleniyor", id: "Al-Muwatta 37 — Umar membersihkan diri dengan air" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن محمد بن طحلاء عن عثمان بن عبد الرحمن أن أباه عبد الرحمن بن عثمان التيمي حدثه أنه شهد عمر بن الخطاب يغسل بالماء ما تحت إزاره، أي يستنجي بالماء؛ وهو في باب العمل في الوضوء. ويذكر المحقق أن رواية يحيى ومحمد بن الحسن «أنه سمع» وأن رواية أبي مصعب «أنه رأى» وهي أصح وأبين. {cite:muwatta-maruf-1997 p.53}"
  tr: "Malik'in Yahya ibn Muhammed ibn Tahla'dan, o da Osman ibn Abdülrahman'dan rivayet ettiği bir hadiste, babası Abdülrahman ibn Osman el-Taymi'nin kendisine Ömer ibn el-Hattab'ın alt giysisinin altındaki şeyi suyla yıkadığını, yani kendini suyla temizlediğini gördüğünü söylediği belirtilmiştir; bu, abdest alma eylemleri bölümünde yer almaktadır. Editör, Yahya ve Muhammed ibn el-Hasan'ın rivayetinde işittiğini, Ebu Musab'ın rivayetinde ise gördüğünü belirttiğini ve ikincisinin daha sahih ve daha açık olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.53}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Muhammad ibn Tahla, atas otoritas Uthman ibn Abd al-Rahman, bahwa ayahnya, Abd al-Rahman ibn Uthman al-Taymi, mengatakan kepadanya bahwa ia menyaksikan Umar ibn al-Khattab membasuh bagian bawah pakaiannya dengan air; ini terdapat dalam bab tentang tindakan wudhu. Editor menyebutkan bahwa riwayat Yahya dan Muhammad ibn al-Hasan menyatakan bahwa ia mendengar, sedangkan riwayat Abu Mus'ab menyatakan bahwa ia melihat, dan riwayat yang terakhir lebih otentik dan lebih jelas. {cite:muwatta-maruf-1997 p.53}"
