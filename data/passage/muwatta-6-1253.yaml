label: { ar: "الموطأ 1253 — مالك في فدية الأذى: لا يفتدي أحد حتى يفعل ما يوجب الفدية، وله أن يضع فديته بمكة أو بغيرها", en: "Muwatta 1253", es: "Muwatta 1253", fr: "Muwatta 1253", ur: "موطا 1253", tr: "El-Muvatta 1253 — Malik, zararın kefareti hakkında: Hiç kimse, kefaret gerektiren bir şey yapmadıkça kefaret ödememelidir ve kefaretini Mekke'de veya başka bir yerde yerine getirebilir.", id: "Al-Muwatta 1253 — Malik tentang penebusan dosa: Tidak seorang pun wajib membayar penebusan dosa kecuali jika ia melakukan perbuatan yang mengharuskan penebusan dosa, dan ia boleh melakukan penebusan dosanya di Mekah atau di tempat lain." }
summary:
  ar: "يقول مالك في فدية الأذى إن الأمر فيه أن أحدا لا يفتدي حتى يفعل ما يوجب عليه الفدية، وإن الكفارة إنما تكون بعد وجوبها على صاحبها، وأنه يضع فديته حيث شاء، من نسك أو صيام أو صدقة، بمكة أو بغيرها من البلاد. {cite:muwatta-maruf-1997 p.558}"
  tr: "Malik, zararın kefareti konusunda şöyle der: Mesele şudur ki, kimse kefaret gerektiren şeyi yapmadıkça kefaret edemez; kefaret ancak o şey kişi için farz olduktan sonra gerçekleşir; kişi kefaretini dilediği yere, ister kurban keserek, ister oruç tutarak, ister sadaka vererek, Mekke'de veya başka bir yerde yapabilir. {cite:muwatta-maruf-1997 s.558}"
  id: "Malik mengatakan mengenai penebusan atas suatu kesalahan bahwa permasalahannya adalah tidak seorang pun dapat menebus kesalahan sebelum ia melakukan apa yang mewajibkan penebusan tersebut, dan penebusan hanya terjadi setelah menjadi wajib bagi seseorang, dan ia dapat melakukan penebusannya di mana pun ia inginkan, baik melalui kurban, puasa, atau sedekah, di Mekah atau di tempat lain. {cite:muwatta-maruf-1997 p.558}"
