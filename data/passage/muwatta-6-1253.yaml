label: { ar: "الموطأ 1253 — مالك في فدية الأذى: لا يفتدي أحد حتى يفعل ما يوجب الفدية، وله أن يضع فديته بمكة أو بغيرها", en: "Muwatta 1253" }
summary:
  ar: "يقول مالك في فدية الأذى إن الأمر فيه أن أحدا لا يفتدي حتى يفعل ما يوجب عليه الفدية، وإن الكفارة إنما تكون بعد وجوبها على صاحبها، وأنه يضع فديته حيث شاء، من نسك أو صيام أو صدقة، بمكة أو بغيرها من البلاد. {cite:muwatta-maruf-1997 p.558}"
