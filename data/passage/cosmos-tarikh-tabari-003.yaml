text: "واسم التي بالمشرق بالسريانية مرقيسيا وبالعربية جابلق واسم التي بالمغرب بالسريانية برجيسيا وبالعربية جابرس ولكل مدينة منهما عشرة آلاف باب"
summary:
  ar: "في خبر طويل في تاريخ الطبري عن مسير الشمس يرد ذكر مدينتين إحداهما في المشرق والأخرى في المغرب، من بقايا عاد وثمود، وبعدهما أمم أخرى ثم يأجوج ومأجوج؛ ولم نفحص إسناده هنا ولا نحكم عليه."
  en: "In a long report in al-Tabari on the sun's course, two cities are named, one in the east and one in the west, said to hold the remnants of Ad and Thamud, with other peoples and then Gog and Magog beyond; its chain was not examined here and no grading is given."
  es: "En un extenso informe de al-Tabari sobre el curso del sol, se mencionan dos ciudades, una en el este y otra en el oeste, que se dice albergan los restos de Ad y Thamud, junto con otros pueblos y más allá, Gog y Magog; su cadena trófica no fue examinada aquí y no se le da ninguna clasificación."
  fr: "Dans un long rapport d'al-Tabari sur la course du soleil, deux villes sont nommées, l'une à l'est et l'autre à l'ouest, censées abriter les vestiges d'Ad et de Thamud, ainsi que d'autres peuples, puis Gog et Magog au-delà; sa chaîne n'a pas été examinée ici et aucune classification n'est donnée."
  ur: "الطبری کی ایک طویل رپورٹ میں سورج کے ڈھلنے پر دو شہروں کا نام دیا گیا ہے، ایک مشرق میں اور دوسرا مغرب میں، کہا گیا ہے کہ عاد اور ثمود کی باقیات کو دوسرے لوگوں کے ساتھ رکھا جائے اور پھر یاجوج و ماجوج سے آگے؛ یہاں اس کی زنجیر کی جانچ نہیں کی گئی اور نہ ہی کوئی درجہ بندی دی گئی ہے۔"
