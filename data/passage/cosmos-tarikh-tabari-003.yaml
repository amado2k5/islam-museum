text: "واسم التي بالمشرق بالسريانية مرقيسيا وبالعربية جابلق واسم التي بالمغرب بالسريانية برجيسيا وبالعربية جابرس ولكل مدينة منهما عشرة آلاف باب"
summary:
  ar: "في خبر طويل في تاريخ الطبري عن مسير الشمس يرد ذكر مدينتين إحداهما في المشرق والأخرى في المغرب، من بقايا عاد وثمود، وبعدهما أمم أخرى ثم يأجوج ومأجوج؛ ولم نفحص إسناده هنا ولا نحكم عليه."
  en: "In a long report in al-Tabari on the sun's course, two cities are named, one in the east and one in the west, said to hold the remnants of Ad and Thamud, with other peoples and then Gog and Magog beyond; its chain was not examined here and no grading is given."
