text: "… المكتوبات ولا خلاف في ذلك، ولكن اختلفوا في أنه أمر ندب أم إيجاب؟ على أربعة مذاهب. فالراجح في مذهبنا وهو نص الشافعي رحه اللّه تعالى وقول أكثر الحرج عن الباقين، وإن تركوه كلهم أثموا كلهم. وقالت طائفة من أصحابنا: هي …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 352، يرد فيه ذكر ما إذا قام به البعض سقط عن الباقين، والوجوب، والمندوب، والصلاة المكتوبة، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 352, whose wording mentions what is lifted from the rest when some carry it out, obligation (wujub), the recommended (mandub), the prescribed prayer, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
