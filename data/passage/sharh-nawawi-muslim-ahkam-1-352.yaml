  fr: "Un extrait de commentary on Sahih Muslim de al-Nawawi, volume numérisé 1, p. 352, dont le texte mentionne ce dont les autres sont déchargés quand certains l'accomplissent, l'obligation (wujub), le recommandé (mandub), la prière prescrite, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on Sahih Muslim de al-Nawawi, volumen digitalizado 1, p. 352, cuyo texto menciona lo que deja de obligar a los demás cuando algunos lo cumplen, la obligatoriedad (wujub), lo recomendado (mandub), la oración prescrita, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 352. sayfasından bir alıntı, bazılarının yapması halinde diğerlerini affettiren fiilleri, farz ve sünnet fiilleri ile farz ve sünnet namazlarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, itaat fiilleri, sünnet fiilleri, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 352, membahas amalan-amalan yang jika dilakukan oleh sebagian orang, dapat menghapuskan dosa bagi yang lain, serta amalan-amalan wajib dan anjuran, dan salat yang dianjurkan dan wajib. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan-amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
