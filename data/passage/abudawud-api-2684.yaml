label: { ar: "سنن أبي داود 2684 — الأب والأبوة", en: "Sunan Abi Dawud 2684 — the father and fatherhood", ur: "سنن ابی داؤد 2684 — باپ اور والدیت", es: "Sunan Abi Dawud 2684 — El padre y la paternidad", fr: "Sunan Abi Dawud 2684 — le père et la paternité", tr: "Sunan Abi Davud 2684 — Baba ve Babalık", id: "Sunan Abi Dawud 2684 — Sang Ayah dan Peran Ayah" }
text: "… حُبَابٍ، قَالَ أَخْبَرَنَا عَمْرُو بْنُ عُثْمَانَ بْنِ عَبْدِ الرَّحْمَنِ بْنِ سَعِيدِ بْنِ يَرْبُوعٍ الْمَخْزُومِيُّ، قَالَ حَدَّثَنِي جَدِّي، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ يَوْمَ فَتْحِ مَكَّةَ \" أَرْبَعَةٌ لاَ أُؤْمِنُهُمْ فِي حِلٍّ وَلاَ حَرَمٍ \". فَسَمَّاهُمْ. قَالَ وَقَيْنَتَيْنِ كَانَتَا لِمِقْيَسٍ فَقُتِلَتْ إِحْدَاهُمَا وَأُفْلِتَتِ الأُخْرَى فَأَسْلَمَتْ. قَالَ أَبُو دَاوُدَ لَمْ أَفْهَمْ إِسْنَادَهُ مِنِ ابْنِ الْعَلاَءِ كَمَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2684، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2684 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2684، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2684 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2684 (Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 2684 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2684, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
