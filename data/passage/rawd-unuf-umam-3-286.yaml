text: "… الّه، إنهم موالينا دون الحزرج، وقد.فملتَ فى موالى إخواننا بالأمس ماقد علمت وقد كان رمولُ اللّٰه قبل بنى قُريظةِ ود حاصّر بنى قَينُقاع، وكانوا حُلفاء الحزرج، فنزلوا على حكمه، فسأله إياهم عبدُ اللّه بن أُبَى بن صَلُولَ، فَوَ هبهم له. …"
