text: "… أكتب إلى أمير المؤمنين. فكتب إليه يعلمه بفتحها وشأنها، وأن المسلمين طلبوا قسمها. فكتب إليه عمر : لا تقسيمها وذَرْهم يكون خراجها فيئا للحسلمين، وقوة لهم على.جهاد عدوهم. فأقرها عمرو، وأحصى أهلها، وفرض عليهم الخراج، فكانت مصر كلها صُلْحًا بفريضة، …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 155، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 155, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 155 کا اقتباس جس میں فریضہ اور فرائض، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Futuh Misr de Ibn 'Abd al-Hakam, p. 155, dont le texte mentionne l'obligation (farida), ce qui a été imposé aux gens, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Futuh Misr de Ibn 'Abd al-Hakam, p. 155, cuyo texto menciona la obligación (farida), lo que se impuso a la gente, lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abdül-Hakam'ın *Futuh Misr* adlı eserinin 155. sayfasından bir alıntı, farz olan görevleri ve insanlar için farz kılınan şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Futuh Misr* karya Ibnu Abd al-Hakam, halaman 155, menyebutkan kewajiban-kewajiban dan apa yang dianjurkan bagi manusia. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
