label: { ar: "سنن أبي داود 3239 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 3239 — a burial, grave or resting place", ur: "سنن ابی داؤد 3239 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 3239 — un lugar de entierro, tumba o descanso.", fr: "Sunan Abi Dawud 3239 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sunan Abi Dawud 3239 - Defin, Mezar ve Türbe", id: "Sunan Abi Dawud 3239 — Pemakaman, Kuburan, dan Tempat Suci" }
text: "… الْمَعْنَى - قَالاَ حَدَّثَنَا حَمَّادٌ، عَنْ عَمْرٍو، وَأَيُّوبَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، نَحْوَهُ قَالَ \" وَكَفِّنُوهُ فِي ثَوْبَيْنِ \". قَالَ أَبُو دَاوُدَ قَالَ سُلَيْمَانُ قَالَ أَيُّوبُ \" ثَوْبَيْهِ \". وَقَالَ عَمْرٌو \" ثَوْبَيْنِ \". وَقَالَ ابْنُ عُبَيْدٍ قَالَ أَيُّوبُ \" فِي ثَوْبَيْنِ \". وَقَالَ عَمْرٌو \" فِي ثَوْبَيْهِ \". زَادَ سُلَيْمَانُ وَحْدَهُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3239، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3239 (Funerals (Kitab Al-Jana'iz)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3239، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3239 (Funerales (Kitab Al-Jana'iz)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 3239 (Les Funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sunan Ebu Davud'da yer alan 3239 numaralı hadiste, defin, mezar ve türbeden bahsedilmektedir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler üzerine araştırmalar yapan bir uzman tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3239, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
