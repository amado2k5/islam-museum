text: "… فعن قتادة أرادوا الوليد بن المغيرة من أهل مكة، وعروة بن مسعود الثقفي من أهل الطائف. وقيل: جذيمة بن ذراع بن عدي بن الدار بن هانىء مسعود. وعن مجاهد: عتبة بن ربيعة، وعمير بن عروة بن الرحمن. أورده أبو موسى. …"
