label: { ar: "الموطأ 571 — عائشة تجد النبي ساجداً يقول: أعوذ برضاك من سخطك… لا أحصي ثناء عليك", en: "Muwatta 571" }
text: "أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وبك منك، لا أحصي ثناء عليك، أنت كما أثنيت على نفسك"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي، أن عائشة قالت: كنت نائمة إلى جنب النبي ففقدته من الليل، فلمسته بيدي فوضعت يدي على قدميه وهو ساجد يقول: أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وبك منك، لا أحصي ثناء عليك، أنت كما أثنيت على نفسك. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وسويد، ومعن عند الترمذي (3493) وقال: حسن صحيح، وينقل عن ابن عبد البر (التمهيد 23/348) أنه مرسل منقطع في الموطأ عند جماعة الرواة، وأنه يستند من حديث الأعرج عن أبي هريرة عن عائشة (مسلم 2/51، أبو داود 879، ابن ماجة 3841، النسائي 1/102)، ومن حديث عروة عن عائشة (ابن خزيمة 654، ابن حبان 1933). {cite:muwatta-maruf-1997 p.294}"
