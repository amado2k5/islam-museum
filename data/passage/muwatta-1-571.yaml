label: { ar: "الموطأ 571 — عائشة تجد النبي ساجداً يقول: أعوذ برضاك من سخطك… لا أحصي ثناء عليك", en: "Muwatta 571", es: "Muwatta 571", fr: "Muwatta 571", ur: "موطا 571", tr: "Al-Muwatta 571 — Aişe, Peygamber'i secde halinde bulur ve şöyle der: \"Gazabından, rızana sığınırım... Övgülerini sayamam.\"", id: "Al-Muwatta 571 — Aisyah mendapati Nabi sedang bersujud, lalu berkata: Aku berlindung kepada keridhaan-Mu dari murka-Mu… Aku tak dapat menyebutkan semua pujian kepada-Mu." }
text: "أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وبك منك، لا أحصي ثناء عليك، أنت كما أثنيت على نفسك"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي، أن عائشة قالت: كنت نائمة إلى جنب النبي ففقدته من الليل، فلمسته بيدي فوضعت يدي على قدميه وهو ساجد يقول: أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وبك منك، لا أحصي ثناء عليك، أنت كما أثنيت على نفسك. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وسويد، ومعن عند الترمذي (3493) وقال: حسن صحيح، وينقل عن ابن عبد البر ⁦(التمهيد 23/348)⁩ أنه مرسل منقطع في الموطأ عند جماعة الرواة، وأنه يستند من حديث الأعرج عن أبي هريرة عن عائشة ⁦(مسلم 2/51، أبو داود 879، ابن ماجة 3841، النسائي 1/102)⁩، ومن حديث عروة عن عائشة ⁦(ابن خزيمة 654، ابن حبان 1933)⁩. {cite:muwatta-maruf-1997 p.294}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim ibn el-Harith el-Taymi'den rivayet ederek, Aişe'nin şöyle dediğini aktarmıştır: \"Peygamber'in yanında uyuyordum ve geceleyin onu özledim. Elim ile onu yokladım ve secde halindeyken ayaklarına dokunarak şöyle dedim: 'Rahman'ın gazabından senin rızana, azabından senin affına, senden de sana sığınırım. Övgülerini sayamam; sen kendini övdüğün gibisin.'\" Araştırmacı, Ebu Mus'ab'ın bunu Malik'ten, onun aracılığıyla da el-Baghawi, Suwayd ve Ma'n'ın Tirmizi'de (3493) rivayet ettiğini ve Tirmizi'nin \"İyi ve sahihtir\" dediğini belirtmektedir. İbn Abdül-Barr'ın (el-Tamhid 23/348) şöyle dediğini aktarıyor: \"El-Muvatta'da bir grup rivayetçiye göre mursal ve munkatîdir ve Ebu Hurayra'dan, o da Aişe'den rivayet edilen el-A'raj hadisine (Müslim 2/51, Ebu Davud 879, İbn Majah 3841, el-Nesai 1/102) ve Urve'den, o da Aişe'den rivayet edilen hadise (İbn Huzeyme 654, İbn Hibban 1933) dayanmaktadır.\" {cite:muwatta-maruf-1997 s.294}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, bahwa Aisyah berkata: \"Aku tidur di samping Nabi, dan aku merindukannya di malam hari. Aku merabanya dengan tanganku dan meletakkannya di kakinya ketika beliau sedang sujud, seraya berkata: 'Aku berlindung kepada keridhaan-Mu dari murka-Mu, kepada ampunan-Mu dari azab-Mu, dan kepada-Mu dari diri-Mu. Aku tidak dapat menyebutkan pujian-pujian-Mu; Engkau adalah sebagaimana Engkau memuji diri-Mu sendiri.'\" Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan melalui dia al-Baghawi, Suwayd, dan Ma'n meriwayatkannya dalam al-Tirmidhi (3493), yang berkata: \"Hadap ini baik dan sahih.\" Ia mengutip Ibnu Abd al-Barr (al-Tamhid 23/348) yang mengatakan bahwa hadits ini mursal dan munqati' dalam al-Muwatta' menurut sekelompok perawi, dan didasarkan pada hadits al-A'raj dari Abu Hurayrah dari Aisyah (Muslim 2/51, Abu Dawud 879, Ibnu Majah 3841, al-Nasa'i 1/102), dan pada hadits Urwah dari Aisyah (Ibn Khuzaymah 654, Ibnu Hibban 1933). {cite:muwatta-maruf-1997 p.294}"
