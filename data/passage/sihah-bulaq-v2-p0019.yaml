text: |-
  ٥.٦٨
  ⁦(هوا)⁩
  ألاليت شعرى هل أبيتنّ ليلة * وهني جاذبين اهزمتى من
  وفى الحديث من تعزى بعزاء الجاهلية فأعضوه بهن أبيه ولا تكنوا وقولهم من يطل هن أبيه
  ينقطق به أى يتقوى باخوته وهوكما قال
  ولوشاءربي كان أيرأبيكم * طويلاكاً رالحرث بن سدوس
  وهو المرث بن سدوس بن ذهل بن شيبان وكان له أحد وعشرون ولداذكرا وتقول للمرأة هنة
  وهنت أيضا بالتاء ساكنة الذون كما قالوابنت وأخت وتصغيرها هنية تردّها الى الاصل وتأتى
  بالهاء كماتقول أخية وبنية وقد تدل من الياء الثانيه-:ءفية ال هنيهة ومنهم من يجعلها بدلا
  من التاء التى فى هنت والمع همات ومن ردّقال هنوات وقال
  أرى اين تزارد جفانى وملتى • على هنوات شأنها متتابع
  وفى فلان هنات أى خصلات شرّ ولا يقال ذلك فى الخير وتول جاءنى هنول" ورأيت هناك
  ومررت بهنيك وقدذ كرناه فى أخ وتقول فى النسداءياهن أقبل وياهنان أقبلا ويا هتون
  أقبلوا ولك أن تدخل فيه الها لبيان الحركة فتقول ياهنه كما نقول لمه وماليه وسلطانيه ولك
  أن تشبع الحركة فتولد الالف فتقول ياهناه أقبل وهذه اللفظة تختص بالنداه كما يختص به
  قواهم يافل ويانومان ولك أن تقول ياهناه أقبدل بهاء مضحومة ويا هنائيه أقبلا وياهذ ونا.
  أقبلوا وحركة الهاءفيهن منكرة ولكن مكذارواه الاخفش وأنشدأبوزيد فى نوادره
  وقدرابى قولها ياهناه * ويحك ألحقت شرّابشتر
  تعنى كذامتهمين فحققت الامر وهذه الها عند أهل السكوفة للوقف ألاترى أنه
  شبهها بحرف الاعراب فضمها وقال أهل اليصرة هى بدل من الواو فى هنوك وهنوات
  فلذلك جاز أن تضمها وتقول فى الاضافة ياهنى أقبل وياهنى أقبلا وياهى أقبلوا وللمرأة
  يا هنت أقي-لى بتسكين النون كمانة ول أخت وبنت ويا هنتان أقبلا ويا هذات أقبلن ويا هنتا.
  أقبلى وياعنتانيه أقبلاوياهناتوه أقبلن الفراء يقال ذهبت وهنيت كتاية عن فعلت من قولات
  هن الهن الرحل متهافوق صعل * من الظلمات . ؤجوه هوا.
  إممدود مادين السماء والارض والجممع الاهوية وكل خال هواء
  وقوله تعالى وأفئدته-م هواء بقال انه لاعقول لهم والهوى مقصورهوى النفسر والجسع
  الاهواه واذا أضفقه إليك قات هواى وهذيل تقول هوى وقفىّ وعسىّ وقال أبو ذؤيب
  سبقواهوى وأعنة والهواهم • فتخزموا ول كل جنب مصرع
  وهذا الشئ أهوى الىّ من كذا أى أحب الىّ قال الشاءر
  ولليلة منها تعودلنا * فى غيرمارت ولااثم
  أهوى الى نفسى ولونزحت * مماملكت ومن بى سهم
  وهوى بالكسريهوى هرى أى أحب الاصمعىّ هوى بالفح بهوى هريا أى سقط الى أسفل
  قال وكذلك الهوى فى السيراذ امضى وهوى وانهوى بمعنى وقد جعهم اللشاعر فى قوله
  ومنزلة لولاى طحت كماهوى • بأجرامه من قلة النيق منموى
  وهوت الطعنة تهوى قتحت فاها ومنه قول ذى الرقة• هوى بين الكلى والكراكر» وأهوى
