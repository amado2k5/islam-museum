label: { ar: "الموطأ 1565 — ابن شهاب: بنت الوليد بن المغيرة أسلمت يوم الفتح وزوجها صفوان بن أمية هرب من الإسلام، فأرسل إليه النبي الأمان بردائه، فشهد حنينا وهو كافر وامرأته مسلمة حتى أسلم", en: "Muwatta 1565", es: "Muwatta 1565", fr: "Muwatta 1565", ur: "موطا 1565", tr: "El-Muvatta 1565 — İbn Şihab: El-Velid ibn El-Muğire'nin kızı fetih günü İslam'ı kabul etti ve kocası Safvan ibn Umeyye İslam'dan kaçtı. Peygamber ona cübbesiyle bir güvence gönderdi, böylece o, henüz kâfir iken ve karısı Müslüman iken Huneyn'i gördü, ta ki o da İslam'ı kabul edene kadar.", id: "Al-Muwatta 1565 — Ibn Shihab: Putri Al-Walid ibn Al-Mughirah memeluk Islam pada hari penaklukan, dan suaminya, Safwan ibn Umayyah, meninggalkan Islam. Nabi mengirimkan jaminan keselamatan kepadanya dalam jubahnya, sehingga ia menjadi saksi Hunayn ketika ia masih kafir dan istrinya seorang Muslim, hingga ia memeluk Islam." }
summary:
  ar: "يروي مالك عن ابن شهاب أنه بلغه أن نساء كن في عهد رسول الله أسلمن بأرضهن، وهن غير مهاجرات، وأزواجهن حين أسلمن كفار، منهن بنت الوليد بن المغيرة، وكانت تحت صفوان بن أمية، فأسلمت يوم الفتح، وهرب زوجها صفوان من الإسلام. فبعث إليه رسول الله ابن عمه وهب بن عمير بردائه أمانا لصفوان، ودعاه إلى الإسلام والقدوم عليه، فإن رضي أمرا قبله، وإلا سيره شهرين. فلما قدم صفوان على رسول الله ناداه على رؤوس الناس، فقال له رسول الله انزل أبا وهب، فقال لا والله حتى تبين لي، فقال بل لك تسيير أربعة أشهر. ثم خرج النبي إلى هوازن بحنين، فأرسل إلى صفوان يستعيره أداة وسلاحا عنده، فقال أطوعا أم كرها، فقال بل طوعا، فأعاره، ثم خرج معه وهو كافر فشهد حنينا والطائف، وامرأته مسلمة، ولم يفرق النبي بينهما حتى أسلم صفوان، فاستقرت عنده امرأته بذلك النكاح. ويذكر المحقق أن ابن عبد البر قال إن الحديث لا يتصل من وجه صحيح، وإن شهرته عند أهل السير أقوى من إسناده. {cite:muwatta-maruf-1997 p.52}"
  tr: "Malik, İbn Şihab'dan rivayetle, Resulullah zamanında, hicret etmeden kendi topraklarında İslam'ı kabul eden kadınlar olduğunu, kocalarının ise henüz kâfir olduklarını işittiğini söyler. Bunlardan biri de Safvan ibn Umeyye ile evli olan Velid ibn Muğire'nin kızıydı. Mekke'nin fethi günü İslam'ı kabul etti, ancak kocası Safvan İslam'dan kaçtı. Resulullah, Safvan'ın güvenliği için güvence olarak kuzeni Vahb ibn Umeyr'i cübbesiyle birlikte göndererek onu İslam'a davet etti ve yanına gelmesini istedi. Eğer bir şeyi kabul ederse kabul edeceğini, aksi takdirde iki ay süreyle uzaklaştırılacağını söyledi. Safvan, Resulullah'ın huzuruna vardığında, Resulullah onu herkesin önüne çağırdı. Resulullah ona, \"Aşağı in, Ebu Vahb!\" dedi. Safvan, \"Hayır, Allah'a yemin ederim ki, bana açıklayana kadar burada kalmayacağım.\" diye cevap verdi. Allah'ın Elçisi, \"Aksine, dört aylığına uzaklaştırılacaksın\" dedi. Bunun üzerine Peygamber, Huneyn'deki Hawazin'e gitti ve Safvan'a, sahip olduğu bazı teçhizat ve silahları ödünç almak için haber gönderdi. Safvan, \"İsteyerek mi, istemeyerek mi?\" diye sordu. Peygamber, \"İsteyerek\" diye cevap verdi ve bunları ona ödünç verdi. Safvan, Peygamber henüz kâfir iken onunla birlikte Huneyn ve Taif'e gitti ve katıldı; karısı ise Müslümandı. Peygamber, Safvan İslam'ı kabul edene kadar onları ayırmadı ve karısı da bu evlilik boyunca onunla kaldı. Araştırmacı, İbn Abdül-Barr'ın hadisin sağlam bir isnad zincirine sahip olmadığını ve tarihçiler arasında yaygın kabulünün isnad zincirinden daha güçlü olduğunu belirttiğini kaydediyor. {cite:muwatta-maruf-1997 s.52}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia mendengar tentang wanita-wanita yang, pada zaman Rasulullah, memeluk Islam di negeri mereka sendiri, tanpa berhijrah, sementara suami mereka masih kafir ketika mereka masuk Islam. Di antara mereka adalah putri al-Walid ibn al-Mughirah, yang menikah dengan Safwan ibn Umayyah. Ia memeluk Islam pada hari penaklukan Mekah, tetapi suaminya, Safwan, meninggalkan Islam. Rasulullah mengutus sepupunya, Wahb ibn Umayr, dengan jubahnya sebagai jaminan keselamatan bagi Safwan, mengundangnya untuk masuk Islam dan datang kepadanya. Jika ia menerima sesuatu, ia akan menerimanya; jika tidak, ia akan diusir selama dua bulan. Ketika Safwan tiba di hadapan Rasulullah, ia memanggilnya secara terbuka. Rasulullah berkata kepadanya, \"Turunlah, Abu Wahb.\" Safwan menjawab, \"Tidak, demi Allah, sampai engkau menjelaskannya kepadaku.\" Rasulullah SAW bersabda, \"Sebaliknya, kamu akan diutus selama empat bulan.\" Kemudian Nabi pergi ke Hawazin di Hunayn dan mengirim pesan kepada Safwan untuk meminjam beberapa peralatan dan senjata yang dimilikinya. Safwan bertanya, \"Dengan sukarela atau tidak sukarela?\" Nabi menjawab, \"Dengan sukarela,\" lalu beliau meminjamkannya kepada Safwan. Kemudian Safwan pergi bersama Nabi ketika beliau masih kafir dan ikut serta dalam Hunayn dan Ta'if, sementara istrinya adalah seorang Muslim. Nabi tidak memisahkan mereka sampai Safwan memeluk Islam, dan istrinya tetap bersamanya selama pernikahan itu. Peneliti mencatat bahwa Ibnu Abd al-Barr menyatakan bahwa hadits tersebut tidak memiliki sanad yang sahih, dan penerimaannya yang luas di kalangan sejarawan lebih kuat daripada sanadnya. {cite:muwatta-maruf-1997 p.52}"
