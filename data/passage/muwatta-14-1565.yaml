label: { ar: "الموطأ 1565 — ابن شهاب: بنت الوليد بن المغيرة أسلمت يوم الفتح وزوجها صفوان بن أمية هرب من الإسلام، فأرسل إليه النبي الأمان بردائه، فشهد حنينا وهو كافر وامرأته مسلمة حتى أسلم", en: "Muwatta 1565" }
summary:
  ar: "يروي مالك عن ابن شهاب أنه بلغه أن نساء كن في عهد رسول الله أسلمن بأرضهن، وهن غير مهاجرات، وأزواجهن حين أسلمن كفار، منهن بنت الوليد بن المغيرة، وكانت تحت صفوان بن أمية، فأسلمت يوم الفتح، وهرب زوجها صفوان من الإسلام. فبعث إليه رسول الله ابن عمه وهب بن عمير بردائه أمانا لصفوان، ودعاه إلى الإسلام والقدوم عليه، فإن رضي أمرا قبله، وإلا سيره شهرين. فلما قدم صفوان على رسول الله ناداه على رؤوس الناس، فقال له رسول الله انزل أبا وهب، فقال لا والله حتى تبين لي، فقال بل لك تسيير أربعة أشهر. ثم خرج النبي إلى هوازن بحنين، فأرسل إلى صفوان يستعيره أداة وسلاحا عنده، فقال أطوعا أم كرها، فقال بل طوعا، فأعاره، ثم خرج معه وهو كافر فشهد حنينا والطائف، وامرأته مسلمة، ولم يفرق النبي بينهما حتى أسلم صفوان، فاستقرت عنده امرأته بذلك النكاح. ويذكر المحقق أن ابن عبد البر قال إن الحديث لا يتصل من وجه صحيح، وإن شهرته عند أهل السير أقوى من إسناده. {cite:muwatta-maruf-1997 p.52}"
