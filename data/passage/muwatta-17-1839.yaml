label: { ar: "الموطأ 1839 — مالك: تفسير ما كره من ذلك أن يسلف الرجل الرجل ذهبا في راحلته يركبها في الحج إلى أجل، فإن حدث بها موت ترد الذهب، وتكون عليه على وجه السلف", en: "Muwatta 1839" }
summary:
  ar: "قال مالك: وتفسير ما كره من ذلك، أن يقول الرجل للرجل: أسلفك في راحلتك فلانة أركبها في الحج، وبينه وبين الحج أجل من الزمان، أو يقول مثل ذلك في العبد أو المسكن، فإنه إذا صنع ذلك كان إنما يسلفه ذهبا، على أنه إن وجد تلك الراحلة صحيحة لذلك الأجل الذي سمى له، فهي له بذلك الكراء، وإن حدث بها حدث من موت أو غيره رد عليه ذهبه، وكانت عليه على وجه السلف عنده. {cite:muwatta-maruf-1997 p.155}"
