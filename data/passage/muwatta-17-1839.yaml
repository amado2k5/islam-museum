label: { ar: "الموطأ 1839 — مالك: تفسير ما كره من ذلك أن يسلف الرجل الرجل ذهبا في راحلته يركبها في الحج إلى أجل، فإن حدث بها موت ترد الذهب، وتكون عليه على وجه السلف", en: "Muwatta 1839", es: "Muwatta 1839", fr: "Muwatta 1839", ur: "موطا 1839", tr: "El-Muvatta 1839 — Malik: Bunun hoşuna gitmeyen şeyin açıklaması şudur: Bir adam, Hac sırasında bineceği binek hayvanı için başka bir adama belirli bir süre için altın ödünç verir ve binek hayvanı ölürse, altın geri verilir ve ödünç olarak onda kalır.", id: "Al-Muwatta 1839 — Malik: Penjelasan tentang apa yang tidak disukainya dalam hal itu adalah bahwa seseorang meminjamkan emas kepada orang lain untuk tunggangannya selama ibadah haji untuk jangka waktu tertentu, dan jika tunggangannya mati, emas tersebut dikembalikan, dan tetap menjadi miliknya sebagai pinjaman." }
summary:
  ar: "قال مالك: وتفسير ما كره من ذلك، أن يقول الرجل للرجل: أسلفك في راحلتك فلانة أركبها في الحج، وبينه وبين الحج أجل من الزمان، أو يقول مثل ذلك في العبد أو المسكن، فإنه إذا صنع ذلك كان إنما يسلفه ذهبا، على أنه إن وجد تلك الراحلة صحيحة لذلك الأجل الذي سمى له، فهي له بذلك الكراء، وإن حدث بها حدث من موت أو غيره رد عليه ذهبه، وكانت عليه على وجه السلف عنده. {cite:muwatta-maruf-1997 p.155}"
  tr: "Malik şöyle dedi: Bunun hoşuna gitmeyen şeyin açıklaması şudur: Bir adam diğerine şöyle der: \"Filancaya Hac'a gitmesi için deveni ödünç vereceğim\" ve Hac ile arasında bir süre vardır; veya aynı şeyi bir köle veya bir ev için söyler. Eğer bunu yaparsa, sadece altın ödünç vermiş olur; şart şudur ki, eğer deve belirtilen süre içinde iyi durumda bulunursa, o zaman deve o kira bedeli karşılığında ona ait olur ve eğer deve ölürse veya başka bir şey olursa, altınını iade eder ve deve ödünç olarak onda kalır. {cite:muwatta-maruf-1997 s.155}"
  id: "Malik berkata: Penjelasan mengapa dia tidak menyukainya adalah bahwa seseorang berkata kepada orang lain: Aku akan meminjamkan unta si fulan kepadamu untuk ditunggangi saat haji, dan ada jangka waktu antara dia dan haji, atau dia mengatakan hal yang sama tentang seorang budak atau tempat tinggal. Jika dia melakukan itu, maka dia hanya meminjamkan emas, dengan syarat jika dia menemukan unta itu dalam kondisi baik pada waktu yang ditentukan, maka unta itu menjadi miliknya dengan biaya sewa tersebut, dan jika terjadi sesuatu padanya, seperti kematian atau hal lain, dia mengembalikan emasnya, dan emas itu tetap menjadi miliknya sebagai pinjaman. {cite:muwatta-maruf-1997 p.155}"
