text: "… لِلَّهِ أي معاذ اللّٰه. وروى الأصمعيّ عن نافع أنه قرأ كما قرأ أبو عمرو بن العلاء. وَقُلْنَ حَاشَا لِلَّهِ بإثبات الألف وهو الأصل، ومن حذفها جعل اللام في له عوضاً منها. وفيها أربع لغات؛ يقال: حَاشَاكَ وحَاشًا لَكَ وحاشَ لَكَ …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 3593، يذكر قراءات القرآن، والقراء، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 3593, that mentions the readings of the Qur'an, the readers, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 3593 کا اقتباس جس میں قرآن کی قراءتیں، قراء، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Qurtubi, al-Jami' li-Ahkam al-Qur'an, volumen 3, pág. 3593, que menciona las lecturas del Corán, los lectores y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Coran d'al-Qurtubi (al-Jami' li-Ahkam al-Qur'an, volume 3, p. 3593), numérisé, mentionnant les lectures du Coran, les lecteurs et l'orthographe du mushaf. Cet extrait est cité en quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Kur'an okunuşları, okuyucuları ve Kur'an yazısını ele alan, El-Kurtubi'nin El-Cami'li-Ahkam el-Kur'an adlı eserinin 3. cildinin 3593. sayfasından bir alıntı; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Qurtubi, Al-Jami' li-Ahkam al-Qur'an, Volume 3, halaman 3593, yang membahas bacaan Al-Qur'an, para qari, dan aksara Al-Qur'an; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
