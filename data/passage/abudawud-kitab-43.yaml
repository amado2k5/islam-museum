summary:
  ar: "القسم 43 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأدب»، ويضم فيها النصوص من 4773 إلى 5274 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 43 of Sunan Abi Dawud (General Behavior (Kitab Al-Adab)) in the division of the open hadith dataset the museum took its reports from: reports 4773 to 5274 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 43، عنوان «کتاب الادب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4773 تا 5274۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 43 de Sunan Abi Dawud (Conducta General (Kitab Al-Adab)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4773 al 5274, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan Abi Dawud (Guide des mœurs), livre 43, qui comprend les hadiths 4773 à 5274 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
