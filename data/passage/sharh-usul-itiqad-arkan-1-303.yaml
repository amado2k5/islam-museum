text: "… لم، فأسندَ رُكبته إلى رُكبتِه، ووضعَ كفَّيه على نخِذيه، ثم قال: يا محمد، أخبرني عن الإسلامِ؟ قال: الإسلامُ: أن تشهدَ أنَّ لا إلَه إلَّا الله، وأنَّ محمدً رسول الله، وتُقيمَ الصلاةَ، وتُوتي الزكاةَ، وتصومَ رمضان، وتحُجَّ البيتَ إن استطعت إليه …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 1، ص 303، يذكر تعريف الإسلام بأعماله، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 1, p. 303, that mentions Islam defined by its acts, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 1، ص 303 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 1, pág. 303, que menciona el Islam definido por sus actos, el testimonio, la oración y el zakat; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 1, p. 303) mentionnant l'islam défini par ses actes, le témoignage, la prière et la zakat; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan, 1. cilt, 303. sayfada yer alan eserinden bir alıntı, İslam'ı amelleri, iman ikrarı, namaz ve zekâtı üzerinden tanımlamaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu alıntı, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 1 bergambar, halaman 303, mendefinisikan Islam melalui amalan-amalannya, yaitu pengucapan iman, salat, dan zakat. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
