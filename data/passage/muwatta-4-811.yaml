label: { ar: "الموطأ 811 — هشام بن عروة: كان يسافر في رمضان فيصوم عروة ونفطر نحن فلا يأمرنا بالصيام", en: "Muwatta 811", es: "Muwatta 811", fr: "Muwatta 811", ur: "موطا 811", tr: "El-Muvatta 811 — Hişam ibn Urve: Ramazan ayında yolculuk yapardı, bu yüzden biz orucumuzu bozarken Urve oruç tutardı ve bize oruç tutmamızı emretmezdi.", id: "Al-Muwatta 811 — Hisham ibn Urwah: Dia biasa bepergian selama Ramadan, jadi Urwah berpuasa sementara kami berbuka puasa, dan dia tidak memerintahkan kami untuk berpuasa." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان يسافر في رمضان ونسافر معه، فيصوم عروة ونفطر نحن، فلا يأمرنا بالصيام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.398}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek şöyle anlatmıştır: Ramazan ayında yolculuk ederdi ve biz de onunla birlikte yolculuk ederdik. Urve oruç tutardı, biz de orucumuzu açardık, ancak o bize oruç tutmamızı emretmezdi. Araştırmacı, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.398}"
  id: "Malik meriwayatkannya dari Hisham bin Urwah, yang juga meriwayatkannya dari ayahnya, bahwa ia biasa bepergian selama bulan Ramadan, dan kami ikut bepergian bersamanya. Urwah berpuasa, dan kami berbuka puasa, tetapi ia tidak memerintahkan kami untuk berpuasa. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.398}"
