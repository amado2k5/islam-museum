summary:
  ar: "القسم 94 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التمنى»، ويضم فيها النصوص من 7226 إلى 7245 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 94 of Sahih al-Bukhari (Wishes) in the division of the open hadith dataset the museum took its reports from: reports 7226 to 7245 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 94، عنوان «کتاب التمنیٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7226 تا 7245۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 94 de Sahih al-Bukhari (Deseos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 7226 a 7245 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 94 du Sahih al-Bukhari (Souhaits), dans la section 7226 à 7245 de la base de données ouverte. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
