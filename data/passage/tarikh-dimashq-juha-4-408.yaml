text: "… أيمَن بن نابل، نا قدامة بن عَبد اللّه العامري، قال: رأيت النبي ل قه بمنى عَلى جَملٍ وتحته رَحل رث، فلم يكن ثمّ طَردٌ وَلا ضَربٌ وَلا إليك إليك. فقلت: يا أمير المؤمنين إنه بَهلول المجنون. قال: قد عَرفته وَبلغني …"
summary:
  ar: "مقطع من تاريخ مدينة دمشق، المجلد المصوَّر 4، ص 408، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Ta'rikh Madinat Dimashq, scan volume 4, p. 408, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "Ta'rikh Madinat Dimashq، اسکین جلد 4، ص 408 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ta'rikh Madinat Dimashq, volume numérisé 4, p. 408, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Ta'rikh Madinat Dimashq, volumen escaneado 4, p. 408, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Şam Tarihi, Resimli Cilt 4, sayfa 408'den, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Damaskus, Jilid Bergambar 4, halaman 408, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin, dengan teks yang disarikan sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
