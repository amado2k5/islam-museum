label: { ar: "الموطأ 1381 — مالك: أحسن ما سمع في كفارة اليمين بالكسوة أن يكسو الرجال ثوبا ثوبا، والنساء ثوبين، درعا وخمارا", en: "Muwatta 1381", es: "Muwatta 1381", fr: "Muwatta 1381", ur: "موطا 1381", tr: "El-Muvatta 1381 — Malik: Yemin bozarak giysi vermenin kefareti konusunda duyduğum en güzel şey, erkeklere birer giysi, kadınlara ise iki giysi verilmesidir: bir tunik ve bir başörtüsü.", id: "Al-Muwatta 1381 — Malik: Hal terbaik yang pernah saya dengar mengenai penebusan dosa karena melanggar sumpah dengan memberikan pakaian adalah bahwa laki-laki hendaknya diberi satu pakaian masing-masing, dan perempuan dua pakaian: sebuah tunik dan sebuah jilbab." }
summary:
  ar: "يقول مالك أحسن ما سمعه في الذي يكفر عن يمينه بالكسوة، أنه إن كسا الرجال كساهم ثوبا ثوبا، وإن كسا النساء كساهن ثوبين ثوبين، درعا وخمارا، وذلك أدنى ما يجزي كلا في صلاته. {cite:muwatta-maruf-1997 p.616}"
  tr: "Malik, yeminini giysi vererek telafi eden biri hakkında duyduğu en güzel şeyin, erkeklere birer giysi, kadınlara ise iki giysi, bir tunik ve bir başörtüsü vermesi gerektiği olduğunu söyledi. Bu, her birinin duasında yeterli olan asgari miktardır. {cite:muwatta-maruf-1997 s.616}"
  id: "Malik mengatakan bahwa hal terbaik yang pernah ia dengar mengenai seseorang yang menebus sumpahnya dengan memberikan pakaian adalah jika ia memberi pakaian kepada laki-laki, ia hendaknya memberi mereka satu pakaian masing-masing, dan jika ia memberi pakaian kepada perempuan, ia hendaknya memberi mereka dua pakaian masing-masing, yaitu tunik dan jilbab. Ini adalah jumlah minimum yang cukup bagi setiap orang dalam salatnya. {cite:muwatta-maruf-1997 p.616}"
