label: { ar: "الموطأ 1692 — يحيى بن سعيد عن رجل من الأنصار: سألت امرأته الطلاق، فقال إذا حضت فآذنيني، ثم إذا طهرت فآذنيني، فلما طهرت طلقها، وهذا أحسن ما سمعه مالك", en: "Muwatta 1692" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن رجل من الأنصار أن امرأته سألته الطلاق، فقال لها إذا حضت فآذنيني، فلما حاضت آذنته، فقال إذا طهرت فآذنيني، فلما طهرت آذنته فطلقها. قال مالك وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.92}"
