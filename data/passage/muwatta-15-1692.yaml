label: { ar: "الموطأ 1692 — يحيى بن سعيد عن رجل من الأنصار: سألت امرأته الطلاق، فقال إذا حضت فآذنيني، ثم إذا طهرت فآذنيني، فلما طهرت طلقها، وهذا أحسن ما سمعه مالك", en: "Muwatta 1692", es: "Muwatta 1692", fr: "Muwatta 1692", ur: "موطا 1692", tr: "El-Muvatta 1692 — Yahya ibn Sa’id, Ensar’dan bir adamdan rivayetle şöyle der: Karısı ondan boşanmak istedi ve adam, “Adet gördüğü zaman bana haber ver, temizlendiği zaman da bana haber ver” dedi. Kadın temizlendiğinde onu boşadı. Bu, Malik’in duyduğu en güzel şeydir.", id: "Al-Muwatta 1692 — Yahya ibn Sa’id meriwayatkan dari seorang pria dari kaum Ansar: Istrinya meminta cerai, dan dia berkata, “Ketika dia haid, beritahukan kepadaku, kemudian ketika dia suci, beritahukan kepadaku.” Maka ketika dia suci, dia menceraikannya. Inilah riwayat terbaik yang didengar Malik." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن رجل من الأنصار أن امرأته سألته الطلاق، فقال لها إذا حضت فآذنيني، فلما حاضت آذنته، فقال إذا طهرت فآذنيني، فلما طهرت آذنته فطلقها. قال مالك وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.92}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Ensar'dan bir adamdan rivayet ettiğine göre, karısı kendisinden boşanmak istemiş. Adam ona, \"Adet gördüğünde bana haber ver\" demiş. Kadın adet gördüğünde ona haber vermiş. Bunun üzerine adam, \"Temizlendiğinde bana haber ver\" demiş. Kadın temizlendiğinde ona haber vermiş ve adam onu boşamış. Malik, \"Bu konuda duyduğum en güzel rivayet budur\" demiştir. {cite:muwatta-maruf-1997 s.92}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari seorang pria dari kaum Ansar, bahwa istrinya meminta cerai. Ia berkata kepadanya, \"Ketika kamu haid, beritahukan kepadaku.\" Ketika istrinya haid, ia memberitahukannya. Kemudian ia berkata, \"Ketika kamu suci, beritahukan kepadaku.\" Ketika istrinya suci, ia memberitahukannya, dan ia menceraikannya. Malik berkata, \"Ini adalah riwayat terbaik yang pernah kudengar tentang masalah ini.\" {cite:muwatta-maruf-1997 p.92}"
