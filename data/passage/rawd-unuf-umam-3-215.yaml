text: "… غاوَر القَوْمَ لم يَضْعُفه. كَلَيْتُ بِتَرْج حَى غِيشله أخِى غابةِ هاسِر أَجُوَف. شعر كعب في إجلاء بنى النضير وقتل ابن الأشرف قال ابن إسحاق : وقال كعب بن مالك يذكر إجلاء بى النفير وقَتْل كعب بن الأشرف : لقد مغَزِيَتْ …"
