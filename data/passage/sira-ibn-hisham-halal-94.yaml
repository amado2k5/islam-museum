text: "… غيرها كما نُعَظَّمُها، نحن الْحُمْسُ : والْحُمْسُ أهل الحرم، ثُمَّ جعلُوا لِمَنْ ولدوا من العربِ من ساكنِ الحِلّ والحَرَمِ مثلَ الَّذِي لَهُمْ، بولادتهم إياهم، يحل لهم ما يحل لهم، ويحرم عليهم ما يحرم عليهم، وكانت كنانةُ وخُزَاعَةُ قَدْ دَخَلُوا مَعَهُم …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 94، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Hisham's Sira, p. 94, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "سیرت ابن ہشام، ص 94 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Sira de Ibn Hisham, pág. 94, que menciona lo que se ha declarado lícito, lo que no lo es y lo que se ha declarado ilícito; tomado del escaneo de lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de la Sira d'Ibn Hisham, p. 94, mentionnant ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Halal and Haram Browser."
  tr: "İbn Hişam'ın Peygamber biyografisinden, 94. sayfadan, helal, haram ve yasak olan şeylerden bahseden bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari biografi Nabi karya Ibnu Hisham, halaman 94, yang menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dan dilarang; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
