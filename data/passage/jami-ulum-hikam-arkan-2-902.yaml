text: "… شُعب الإيمان عن النواس بن سمعان، به، وإسناده ضعيف جدّاً من أجل عمر بن هارون بن يزيد بن جابر البلخي - وقد تابعه عليه الوليد بن مسلم، وهو وإن كان ثقة إلَّا أنه يدلس تدليس التسوية، وقد عنعنه فلا يفرح …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 902، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
