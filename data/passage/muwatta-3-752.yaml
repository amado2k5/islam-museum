label: { ar: "الموطأ 752 — أهل الشام يطلبون من أبي عبيدة أخذ الصدقة من خيلهم ورقيقهم؛ عمر: إن أحبوا فخذها منهم وارددها عليهم وارزق رقيقهم", en: "Muwatta 752", es: "Muwatta 752", fr: "Muwatta 752", ur: "موطا 752", tr: "El-Muvatta 752 — Suriye halkı Ebu Ubeyde'den atlarından ve kölelerinden zekât almasını istediler; Ömer dedi ki: İsterlerse onlardan al, sonra onlara geri ver ve kölelerinin geçimini sağla.", id: "Al-Muwatta 752 — Penduduk Suriah meminta Abu Ubaidah untuk mengambil zakat dari kuda dan budak mereka; Umar berkata: Jika mereka mau, ambillah dari mereka dan kembalikan kepada mereka serta berikanlah nafkah kepada budak-budak mereka." }
text: "إن أحبوا فخذها منهم، وارددها عليهم، وارزق رقيقهم"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سليمان بن يسار، أن أهل الشام قالوا لأبي عبيدة بن الجراح: خذ من خيلنا ورقيقنا صدقة. فأبى، ثم كتب إلى عمر بن الخطاب فأبى عمر، ثم كلموه أيضاً فكتب إلى عمر، فكتب إليه عمر: إن أحبوا فخذها منهم وارددها عليهم وارزق رقيقهم. ويقول مالك: معنى قوله «وارددها عليهم» يعني على فقرائهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (338) ويحيى بن بكير عند أبي عبيد في الأموال (1366). {cite:muwatta-maruf-1997 p.373}"
  tr: "Malik, İbn Şihab'dan, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Suriye halkı Ebu Ubeyde ibn el-Cerrah'a şöyle demiş: \"Atlarımızdan ve kölelerimizden zekât al.\" O reddetti. Sonra Ömer ibn el-Hattab'a yazdı, ama Ömer de reddetti. Sonra tekrar onunla konuştular, o da Ömer'e yazdı, Ömer de ona şöyle cevap verdi: \"İsterlerse onlardan al ve onlara geri ver, kölelerine de ver.\" Malik diyor ki: \"Onlara geri ver\" ifadesinin anlamı, zekâtı fakirlerine vermektir. Editör, bunun Malik'ten Ebu Mus'ab, Muhammed ibn el-Hasan el-Şeybani (338) ve Yahya ibn Bukayr tarafından rivayet edildiğini, Ebu Ubeyd'in el-Amwal'da (1366) kaydettiğini belirtiyor. {cite:muwatta-maruf-1997 s.373}"
  id: "Malik meriwayatkannya dari Ibnu Shihab, dari Sulaiman bin Yasar, bahwa penduduk Suriah berkata kepada Abu Ubaydah bin al-Jarrah: \"Ambillah zakat dari kuda dan budak kami.\" Dia menolak. Kemudian dia menulis surat kepada Umar bin al-Khattab, tetapi Umar menolak. Kemudian mereka berbicara kepadanya lagi, maka dia menulis surat kepada Umar, yang kemudian membalasnya: \"Jika mereka mau, ambillah dari mereka dan kembalikan kepada mereka dan berikanlah kepada budak-budak mereka.\" Malik berkata: Arti dari pernyataannya \"dan kembalikan kepada mereka\" adalah untuk memberikannya kepada orang miskin mereka. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Muhammad bin al-Hasan al-Shaybani (338), dan Yahya bin Bukayr, sebagaimana dicatat oleh Abu Ubayd dalam al-Amwal (1366). {cite:muwatta-maruf-1997 p.373}"
