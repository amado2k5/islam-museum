label: { ar: "الموطأ 752 — أهل الشام يطلبون من أبي عبيدة أخذ الصدقة من خيلهم ورقيقهم؛ عمر: إن أحبوا فخذها منهم وارددها عليهم وارزق رقيقهم", en: "Muwatta 752" }
text: "إن أحبوا فخذها منهم، وارددها عليهم، وارزق رقيقهم"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سليمان بن يسار، أن أهل الشام قالوا لأبي عبيدة بن الجراح: خذ من خيلنا ورقيقنا صدقة. فأبى، ثم كتب إلى عمر بن الخطاب فأبى عمر، ثم كلموه أيضاً فكتب إلى عمر، فكتب إليه عمر: إن أحبوا فخذها منهم وارددها عليهم وارزق رقيقهم. ويقول مالك: معنى قوله «وارددها عليهم» يعني على فقرائهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (338) ويحيى بن بكير عند أبي عبيد في الأموال (1366). {cite:muwatta-maruf-1997 p.373}"
