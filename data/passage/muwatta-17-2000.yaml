label: { ar: "الموطأ 2000 — مالك عن يحيى بن سعيد: سمع سعيد بن المسيب يقول: إذا جئت أرضا يوفون المكيال والميزان فأطل المقام بها، وإذا جئت أرضا ينقصون المكيال والميزان فأقلل المقام بها", en: "Muwatta 2000", es: "Muwatta 2000", fr: "Muwatta 2000", ur: "موطا 2000", tr: "El-Muvatta 2000 — Malik, Yahya ibn Sa’id’den rivayetle: Sa’id ibn al-Musayyab’ın şöyle dediğini işitti: “Eğer tam ölçü ve ağırlıkla ödeme yapılan bir diyara gelirseniz, orada uzun süre kalın. Eğer tam ölçü ve ağırlıktan daha az ödeme yapılan bir diyara gelirseniz, orada kısa süre kalın.”", id: "Al-Muwatta 2000 — Malik, berdasarkan riwayat Yahya ibn Sa’id: Ia mendengar Sa’id ibn al-Musayyab berkata: Jika kamu datang ke suatu negeri yang menggunakan takaran dan timbangan penuh, maka tinggallah di sana untuk waktu yang lama. Dan jika kamu datang ke suatu negeri yang menggunakan takaran dan timbangan kurang dari penuh, maka tinggallah di sana untuk waktu yang singkat." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول: إذا جئت أرضا يوفون المكيال والميزان، فأطل المقام بها. وإذا جئت أرضا ينقصون المكيال والميزان، فأقلل المقام بها. {cite:muwatta-maruf-1997 p.218} {cite:muwatta-maruf-1997 p.219}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Sa'id ibn al-Musayyab'ın şöyle dediğini işittiğini aktarır: \"Eğer ölçü ve tartıda tam doğruluk verilen bir diyara gelirseniz, orada uzun süre kalın. Eğer ölçü ve tartıda hile yapılan bir diyara gelirseniz, orada kalış sürenizi kısaltın.\" {cite:muwatta-maruf-1997 s.218} {cite:muwatta-maruf-1997 s.219}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia mendengar Sa'id ibn al-Musayyab berkata: \"Jika kamu datang ke suatu negeri yang menggunakan takaran dan timbangan yang tepat, maka tinggallah di sana untuk waktu yang lama. Dan jika kamu datang ke suatu negeri yang menggunakan kecurangan dalam takaran dan timbangan, maka persingkatlah masa tinggalmu di sana.\" {cite:muwatta-maruf-1997 p.218} {cite:muwatta-maruf-1997 p.219}"
