label: { ar: "سنن أبي داود 1187 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 1187 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 1187 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 1187 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 1187 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ سَعْدٍ، حَدَّثَنَا عَمِّي، حَدَّثَنَا أَبِي، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، حَدَّثَنِي هِشَامُ بْنُ عُرْوَةَ، وَعَبْدُ اللَّهِ بْنُ أَبِي سَلَمَةَ، وَسُلَيْمَانُ بْنُ يَسَارٍ، كُلُّهُمْ قَدْ حَدَّثَنِي عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، قَالَتْ كُسِفَتِ الشَّمْسُ عَلَى عَهْدِ رَسُولِ اللَّهِ فَخَرَجَ رَسُولُ اللَّهِ فَصَلَّى بِالنَّاسِ فَقَامَ فَحَزَرْتُ قِرَاءَتَهُ فَرَأَيْتُ أَنَّهُ قَرَأَ بِسُورَةِ الْبَقَرَةِ - وَسَاقَ الْحَدِيثَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1187، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1187 (The Book Of The Prayer For Rain (Kitab al-Istisqa')), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1187، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 1187 (El Libro de la Oración para la Lluvia (Kitab al-Istisqa')), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 1187 (Le Livre de la prière pour la pluie (Kitab al-Istisqa')), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
