text: "آداب الفَتْوَى : للشَّيخ محمد بن محمد المَقْدسيّ المتوفَّى سنة ثمان وثمان مئة. ولجلال الدِّين عبد الرَّحمن السُّيوطيّ مات سنة. آدابُ القراءة: لابن قُتيبة عبد اللّه بن مُسْلم النَّحَويّ المتوفَّى سنة سبع وستين ومئتين. عِلْم آداب كتابة المُصحف ذَكَرهُ من …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 281، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 281, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
