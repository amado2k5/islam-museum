label: { ar: "سنن ابن ماجه 598 — ما يُكفَّر باجتناب الكبائر", en: "Sunan Ibn Majah 598 — what is expiated when the major sins are avoided", ur: "سنن ابن ماجہ 598 — جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے", fr: "Sunan Ibn Majah 598 — ce qui est expié quand les grands péchés sont évités", es: "Sunan Ibn Mayah 598 — lo que se expía cuando se evitan los pecados mayores", tr: "Sunan İbn Majah 598 — Büyük günahlardan sakınmakla hangi günahlar kefaret edilir?", id: "Sunan Ibn Majah 598 — Apa yang dapat ditebus dengan menghindari dosa-dosa besar?" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا يَحْيَى بْنُ حَمْزَةَ، حَدَّثَنِي عُتْبَةُ بْنُ أَبِي حَكِيمٍ، حَدَّثَنِي طَلْحَةُ بْنُ نَافِعٍ، حَدَّثَنِي أَبُو أَيُّوبَ الأَنْصَارِيُّ، أَنَّ النَّبِيَّ ـ قَالَ \" الصَّلَوَاتُ الْخَمْسُ وَالْجُمُعَةُ إِلَى الْجُمُعَةِ وَأَدَاءُ الأَمَانَةِ كَفَّارَةٌ لِمَا بَيْنَهَا \". قُلْتُ وَمَا أَدَاءُ الأَمَانَةِ قَالَ \" غُسْلُ الْجَنَابَةِ فَإِنَّ تَحْتَ كُلِّ شَعَرَةٍ جَنَابَةً \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 598، يرد فيه ذكر ما يُكفَّر باجتناب الكبائر. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 598 (The Book of Purification and its Sunnah), whose wording mentions what is expiated when the major sins are avoided. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 598، جس کے الفاظ میں جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 598, dont le texte mentionne ce qui est expié quand les grands péchés sont évités. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 598, cuyo texto menciona lo que se expía cuando se evitan los pecados mayores. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Mâce Sünen'inde yer alan 598 numaralı hadiste, büyük günahlardan kaçınmanın neleri telafi edeceğinden bahsedilir. Bu hadis, farz, itaat, tavsiye edilen, mekruh, haram ve küçük günahları derleyen kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Derleyen kişi metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 598, menyebutkan apa yang dapat diampuni dengan menghindari dosa-dosa besar. Hadits ini disusun oleh penyusunnya mengenai amalan-amalan wajib, amalan-amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat-riwayat dari para Sahabat dan Penerus mereka mengenai topik-topik tersebut. Penyusun tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
