text: "… لهم، وهو عامر بن ربيعة بن كعب بن مالكِ وكان موت أَبي عبيدة ومعاذ ويَزِيد في طاعون عَمَواس، وكان طاعون عمواس بأرض الأردن ابن ربيعةَ بن عامرِ بن سعدٍ بن عبد اللّٰه بن الحارث ابن رُفيدة بن عَنْز بن وائل …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 512، يذكر الطاعون والوباء، ومداواة النساء للجرحى؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 512, that mentions plague and epidemic, women treating the wounded; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 512 کا اقتباس جس میں طاعون اور وبا، خواتین کا زخمیوں کا علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 2, pág. 512, que menciona la peste y la epidemia, y a las mujeres que atienden a los heridos; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 2, p. 512, qui mentionne la peste et l'épidémie, les femmes soignant les blessés; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 2. cildinin 512. sayfasından, veba ve salgın hastalıktan ve yaralıları tedavi eden kadınlardan bahseden bir bölüm; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Isti’ab karya Ibn Abd Al-Barr, jilid bergambar 2, hlm. 512, yang menyebutkan wabah dan epidemi, serta perempuan yang merawat yang terluka; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
