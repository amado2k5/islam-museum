label: { ar: "الموطأ 654 — بلاغ: كتاب عمر بن عبد العزيز إلى عامله على دمشق: إنما الصدقة في الحرث والعين والماشية", en: "Muwatta 654", es: "Muwatta 654", fr: "Muwatta 654", ur: "موطا 654", tr: "El-Muvatta 654 — Rapor: Ömer ibn Abdülaziz'in Şam valisine yazdığı mektup: Zekat yalnızca ürünler, nakit para ve hayvanlar için verilir.", id: "Al-Muwatta 654 — Laporan: Surat dari Umar ibn Abd al-Aziz kepada gubernurnya di Damaskus: Sedekah hanya wajib diberikan atas hasil panen, uang tunai, dan ternak." }
text: "إنما الصدقة في الحرث، والعين، والماشية"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عمر بن عبد العزيز كتب إلى عامله على دمشق في الصدقة: إنما الصدقة في الحرث والعين والماشية. ويقول مالك: ولا تكون الصدقة إلا في ثلاثة أشياء: في الحرث والعين والماشية. ويذكر المحقق أن البلاغ وقول مالك رواهما عنه أبو مصعب ⁦(636 و637)⁩. {cite:muwatta-maruf-1997 p.335}"
  tr: "Malik, Ömer ibn Abdülaziz'in Şam'daki valisine zekât hakkında şöyle yazdığını duyduğunu bildirmiştir: \"Zekât sadece ürünler, nakit ve hayvanlardan alınır.\" Malik şöyle dedi: \"Zekât sadece üç şeyden alınır: ürünler, nakit ve hayvanlar.\" Editör, bu rivayetin ve Malik'in bu ifadesinin Ebu Musab tarafından (636 ve 637) ondan nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.335}"
  id: "Malik melaporkan bahwa ia mendengar bahwa Umar ibn Abd al-Aziz menulis kepada gubernurnya di Damaskus mengenai zakat: “Zakat hanya wajib dibayarkan atas hasil panen, uang tunai, dan ternak.” Malik berkata: “Zakat hanya wajib dibayarkan atas tiga hal: hasil panen, uang tunai, dan ternak.” Editor mencatat bahwa laporan ini dan pernyataan Malik diriwayatkan darinya oleh Abu Mus’ab (636 dan 637). {cite:muwatta-maruf-1997 p.335}"
