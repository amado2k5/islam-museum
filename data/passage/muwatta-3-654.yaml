text: "إنما الصدقة في الحرث، والعين، والماشية"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عمر بن عبد العزيز كتب إلى عامله على دمشق في الصدقة: إنما الصدقة في الحرث والعين والماشية. ويقول مالك: ولا تكون الصدقة إلا في ثلاثة أشياء: في الحرث والعين والماشية. ويذكر المحقق أن البلاغ وقول مالك رواهما عنه أبو مصعب (636 و637). {cite:muwatta-maruf-1997 p.335}"
