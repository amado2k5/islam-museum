text: |-
  باذن اللّٰه فأشتدّت قواهم
  على ملمسكين وهى لهم وثاب
  إه م
  ٢ وله حربشدالميم أى تكام
  بالحيرية ا
  ٣ ال الازهرى وجب البيع
  وجوبا دجبة ودجبت الشميس
  وجوبا أى غابت اه مختار
  ١٠٨
  باب اليا.)
  أنا ووائيه أى ساوره وتقول توثب فلان فى ضيعة لى أى استولى عليها ظلما والوثاب
  كسر الوا والمقاعد قال أمية ١ هى لهم وثاب يعن أن السماء مقاعد للملائكة
  وثب فى لغة حيراقعد قال الاصمعى ودخل رجل من العرب على لل من ملول حير فقال
  له الالمكئب فوئب الرجل فتكسر فقال الملك ليس عندناعربيت من دخل ظفارحر ٢
  قوله عربيت يريد العربية فوقف على الهساءيالتاء وكذلك لغتهم وية ولون لاملك اذا قعدولم يغز
  موثيان وتقول وثبه توثيبا أى أقعده على وسادة وربما قالواوثبه وسادة اذاطرحهانه
  ليقسعد عليها جب) وجب الشىء أى يجب وجوبا وأوجبه اللّٰه واستوجبه
  أى استحقه ووجب السع يجب جبة (٣ أوجبت البيع فوجب والوجيبة أن توجب
  السع ثم تأخذه أولا فأوّلا فاذا فرغت قبل قد استوفيت وجيدتك ووجب القلب وجا
  اضطرب وأوجب الرجسل اذا عمل عملا يوجب له الجنة أو النار والوجب الحبان قال الشاعر
  طلوب الاعادى لاسؤوم ولاوجب
  تقول منه وجب الرجل بالضم وجوية والوجبة
  السقطة مع الهدة وفى المثل بجنبه فلتكن الوجبة قال اللّٰه تعالى فاذا وجبت جنوبها
  ومنه قولهم خرج القوم الى مواجبهم أى مصارعهم ووجب الميت اذاسقط ومات ويقال
  للقنبل واجب قال الشاعر
  أطاعت بنوعوف أميرا نهاهمو • عن السلم حتى كان أول واجب
  ووجبت الشمس أدغابت ووجبت به الارض توجيبا أى ضربتهايه ويقال أيضاوجبت
  الابل اذا أعيت والموجب الذى يا كل فى اليوم والليسلة مرة يقال فلان يأكل وجبة وقد
  وجب نفسه توجيبا اذاءودها ذلك وكذلك اذا حلب فى اليوم واللبلة مرة ⁦( ورب)⁩
  ورب العرق يورب وربا أى فسدفهوءرق ورب قال الهذلى
  ان تنتسب تنسب الى عرق ورب • أهل خزومات وشحاج صخب
  ( وزب المزاب المتعب فارسى معرب وقدعرب بالهمز ورعالم بم مزوالجمع ما زيب
  اذاهمزت وميازيب اذالم تهمز ⁦(وسب)⁩ وسبت الارض وأوسبت كثر عشبها ويقبال
  انباتها الوسب بالكسر شب الاوشاب من الناس الاوباش وهم الضروب
  المتفترّقون :⁦( وصب)⁩. الوصب المرض وقد وصب الرجل يوصب فهو وصب وأوصبه اللّه
  فهو موصب والموصب بالتشديد الكثبر الاوجاع ووصب الشى يصب وصوبا أى دام تقول
  وصب الرجل على الامراذا واظب عليه قال تعالى ولهم عذاب واصب وله الدين واصبا
  قال الفرّاء دائما ومفازة واصبة بعيدة لاغاية لها وأوصب القوم على الشئء اذا ثابر واعليه
  ( وطب الوطب سقاء اللبن خاصة قال ابن السكيت وهو جلد الجذع فافوقه قال
  ويقال لجدد الرضيع الذى يجعل فيه اللبن شكوة ولحلد الفطيم بدرة ويقسال لمثل الشكوة مما
  كون فيه السمن عكة ولمثل البدرة المسأد وجع الوطب فى القلة أوطب والكثير وطاب
  قال امر والقيس
  وأفلتهنّ علبا بريضا * ولو أدركته صفر الوطاب
  والوطب الرجل الحاقى والوطباء المرأة العظيمة الثدى كانهاذات وطب (وظب وظب
  على الشى وظوبادام أبوزيد المواظبة المثابرة على الشى وأرض موظوية اذا تدوولت بالرعى
