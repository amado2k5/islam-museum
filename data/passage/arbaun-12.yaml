text: "من حسن إسلام المرء تركه ما لا يعنيه"
summary:
  ar: "حديث أبي هريرة، وهو الحديث الثاني عشر في الأربعين النووية وفي شرح ابن رجب؛ خرجه الترمذي (2317) وابن ماجه (3976) وابن حبان والطبراني وغيرهم من رواية الأوزاعي عن قرة بن عبد الرحمن عن الزهري عن أبي سلمة عن أبي هريرة، وقال الترمذي غريب، وحسّنه النووي لأن رجال إسناده ثقات، وقد اختُلف في قرة بن عبد الرحمن بن حيويل: وثقه قوم ومنهم الأوزاعي، وضعفه أحمد ويحيى بن معين وأبو زرعة وأبو حاتم؛ وقال ابن عبد البر إن الحديث محفوظ عن الزهري بهذا الإسناد من رواية الثقات، وهو موافق لتحسين النووي، وأما أكثر الأئمة — ومنهم أحمد ويحيى بن معين والبخاري والدارقطني — فقالوا إنما يصح مرسلاً من رواية الزهري عن علي بن الحسين، وهي رواية مالك في الموطأ، وفي رواية إبراهيم بن سعد «من إيمان المرء تركه ما لا يعنيه»؛ ويقول ابن رجب إنه أصل عظيم من أصول الأدب، ونقل عن أبي عمرو بن الصلاح عن ابن أبي زيد أن جماع آداب الخير يتفرع من أربعة أحاديث هذا أحدها، وأن ترك ما لا يعنيه يكون بحكم الشرع لا بحكم الهوى، ويشمل ترك المحرمات والمشتبهات والمكروهات وفضول المباحات التي لا يحتاج إليها، ويتصل بمقام الإحسان والاستحياء من الله ⁦(جامع العلوم والحكم ص 268–281)⁩."
  en: "Abu Hurayra's hadith, the twelfth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Tirmidhi (2317), Ibn Majah (3976), Ibn Hibban, al-Tabarani and others through al-Awza'i from Qurra ibn Abd al-Rahman from al-Zuhri from Abu Salama from Abu Hurayra — al-Tirmidhi calling it gharib and al-Nawawi grading it hasan since its men are reliable; Qurra ibn Abd al-Rahman ibn Haywil was trusted by some including al-Awza'i but weakened by Ahmad, Yahya ibn Ma'in, Abu Zur'a and Abu Hatim; Ibn Abd al-Barr held the hadith preserved from al-Zuhri through reliable transmitters in this chain, supporting al-Nawawi's grading, while most imams — Ahmad, Ibn Ma'in, al-Bukhari and al-Daraqutni — held it sound only as a mursal report from al-Zuhri from Ali ibn al-Husayn, the version in Malik's Muwatta, Ibrahim ibn Sa'd's wording running 'part of a man's faith is leaving what does not concern him'; Ibn Rajab calls it a great foundation of the foundations of proper conduct and cites Abu Amr ibn al-Salah reporting from Ibn Abi Zayd that the conduct of goodness branches from four hadiths, this among them, explaining that leaving what does not concern one follows the ruling of the sharia not the prompting of desire, and covers the forbidden, the doubtful, the disliked and the superfluous among the permissible, connecting to the station of ihsan and modesty before God (Jami' al-Ulum wal-Hikam pp. 268–281)."
  es: "el hadiz de Abu Hurayra, el duodécimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Tirmidhi (2317), Ibn Majah (3976), Ibn Hibban, al-Tabarani y otros a través de al-Awza'i de Qurra ibn Abd al-Rahman de al-Zuhri de Abu Salama de Abu Hurayra; al-Tirmidhi lo llama gharib y al-Nawawi lo califica como hasan ya que sus hombres son confiables; Algunos, incluido al-Awza'i, confiaban en Qurra ibn Abd al-Rahman ibn Haywil, pero Ahmad, Yahya ibn Ma'in, Abu Zur'a y Abu Hatim lo debilitaron; Ibn Abd al-Barr sostuvo que el hadiz preservado de al-Zuhri a través de transmisores confiables en esta cadena, apoyando la clasificación de al-Nawawi, mientras que la mayoría de los imanes —Ahmad, Ibn Ma'in, al-Bukhari y al-Daraqutni— lo consideraron válido solo como un informe mursal de al-Zuhri de Ali ibn al-Husayn, la versión en el Muwatta de Malik, la formulación de Ibrahim ibn Sa'd dice: \"parte de la fe de un hombre es dejar lo que no le concierne\"; Ibn Rajab lo llama un gran fundamento de los fundamentos de la conducta apropiada y cita a Abu Amr ibn al-Salah informando de Ibn Abi Zayd que la conducta de bondad se ramifica de cuatro hadices, este entre ellos, explicando que dejar lo que no concierne a uno sigue la regla de la sharia no la incitación del deseo, y cubre lo prohibido, lo dudoso, lo desagradable y lo superfluo entre lo permisible, conectándose con el estado de ihsan y modestia ante Dios (Jami' al-Ulum wal-Hikam pp. 268–281)."
  fr: "le hadith d'Abou Hurayra, le douzième des quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Tirmidhi (2317), Ibn Majah (3976), Ibn Hibban, al-Tabarani et d'autres à travers al-Awza'i de Qurra ibn Abd al-Rahman d'al-Zuhri d'Abou Salama d'Abou Hurayra - al-Tirmidhi l'appelant gharib et al-Nawawi le qualifiant de hasan puisque ses hommes sont fiables; Qurra ibn Abd al-Rahman ibn Haywil avait la confiance de certains, dont al-Awza'i, mais affaibli par Ahmad, Yahya ibn Ma'in, Abu Zur'a et Abu Hatim; Ibn Abd al-Barr considérait que le hadith avait été préservé d'al-Zuhri par des transmetteurs fiables dans cette chaîne, soutenant ainsi la classification d'al-Nawawi, tandis que la plupart des imams — Ahmad, Ibn Ma'in, al-Bukhari et al-Daraqutni — le considéraient comme authentique uniquement en tant que rapport mursal d'al-Zuhri d'Ali ibn al-Husayn, la version du Muwatta de Malik, la formulation d'Ibrahim ibn Sa'd allant jusqu'à « une partie de la foi d'un homme consiste à laisser de côté ce qui ne le concerne pas »; Ibn Rajab le qualifie de grand fondement des fondements de la bonne conduite et cite Abu Amr ibn al-Salah rapportant d'Ibn Abi Zayd que la conduite vertueuse se fonde sur quatre hadiths, dont celui-ci, expliquant que le fait de laisser de côté ce qui ne nous concerne pas suit la règle de la charia et non l'impulsion du désir, et couvre l'interdit, le douteux, le détesté et le superflu parmi le permis, se reliant à la station d'ihsan et de modestie devant Dieu (Jami' al-Ulum wal-Hikam pp. 268–281)."
