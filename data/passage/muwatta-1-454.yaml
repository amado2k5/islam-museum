label: { ar: "الموطأ 454 — زيد بن ثابت يركع ثم يدب حتى يصل الصف", en: "Muwatta 454" }
summary:
  ar: "أول أثر في باب ما يفعل من جاء والإمام راكع. يرويه يحيى عن مالك عن ابن شهاب عن أبي أمامة بن سهل بن حنيف: دخل زيد بن ثابت المسجد فوجد الناس ركوعاً فركع ثم دبّ حتى وصل الصف. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن البيهقي أخرجه من غير طريق مالك، وأن عبد الرزاق أخرج عن سعد بن إبراهيم أن زيداً كان يركع ثم يتمشى راكعاً. {cite:muwatta-maruf-1997 p.233}"
