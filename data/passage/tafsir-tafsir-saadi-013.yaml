text: "ر) وذلك شامل لجميع أجزائه، وإنما السباع، لأن طائفة من أهل الكتاب من النصارى يزعمون أن الله أحله لهم. أي : فلا تغتروا بهم، بل هو محرم من جملة الخبائث . (وما أهل لغير الله به) أي : ذكر عليه"
