text: "… - تحقيق: أمامة ابنت محمد المهدي -، قال: حدَّثنا أَحمدُ بن إبراهيم العبديُّ، ثنا يعلى بنُ الحارثِ المحاريُّ، ثنا أَبي، عن سليمانَ بنِ حبيبِ، قال: لَا ماتَ عبدُ الملك بنُ عمرَ بنِ عبدِ العزيز دخلَ عليه هشامُ بنُ الغازِ فعزَّاه، …"
summary:
  ar: "مقطع من كتاب الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 592، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Kitab al-Zuhd of Ahmad ibn Hanbal, scan volume 2, p. 592, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "کتاب الزہد ⁦(احمد بن حنبل)⁩، اسکین جلد 2، ص 592 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd d'Ahmad ibn Hanbal, volume numérisé 2, p. 592, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Kitab al-Zuhd de Ahmad ibn Hanbal, volumen escaneado 2, p. 592, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Ahmed ibn Hanbal'ın *Kitab al-Zuhd* (İzlahiyat Kitabı) adlı eserinin 2. cildinin 592. sayfasından, musibet karşısında taziye, teselli ve sabır sunan bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü mersiye ve övgü şiirlerinin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari *Kitab al-Zuhd* (Kitab Pertapaan) karya Ahmad ibn Hanbal, Jilid 2, halaman 592, yang menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
