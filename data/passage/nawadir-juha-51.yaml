text: "… ذهب اللِّحاف وانتهى الخلاف سمعَ ذاتَ ليلةٍ ضوضاءَ أمامَ دارِهِ، فأرادَ أنْ يعرفَ سببَها، وكان الليل قدِ أنتصفَ، فقالَتْ لَهُ امرأتُه: نَمْ في فِراشِكَ فما يَعنيك مِمَّا يجري خارجاً في هذه الساعة؟ فلم يعبأ بقولِها بلِ التفَّ بِلِحافِهِ خشيةَ البردِ …"
summary:
  ar: "تجمّع الناس ليلًا، وسرق لص لحاف جحا، فقال جحا لزوجته إن اللحاف ذهب وإن الخلاف انتهى. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  en: "At night a crowd gathers; a thief takes Juha's quilt; Juha tells his wife that the quilt is gone and the dispute is over. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  ur: "رات کو ایک ہجوم جمع ہوا؛ ایک چور جحا کا لحاف لے گیا؛ جحا نے بیوی سے کہا کہ لحاف چلا گیا اور جھگڑا ختم ہو گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  fr: "La nuit, une foule se rassemble ; un voleur prend la couverture de Juha ; Juha dit à sa femme que la couverture est partie et que la querelle est finie. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  es: "De noche se reúne una multitud; un ladrón se lleva el edredón de Juha; Juha le dice a su mujer que el edredón se fue y que la disputa terminó. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  tr: "İnsanlar geceleyin toplandılar ve bir hırsız Juha'nın yorganını çaldı. Juha karısına yorganın gittiğini ve anlaşmazlığın bittiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 31}"
  id: "Orang-orang berkumpul di malam hari, dan seorang pencuri mencuri selimut Juha. Juha memberi tahu istrinya bahwa selimut itu hilang dan perselisihan telah berakhir. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
