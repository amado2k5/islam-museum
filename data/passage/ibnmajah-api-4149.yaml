label: { ar: "سنن ابن ماجه 4149 — الأب والأبوة", en: "Sunan Ibn Majah 4149 — the father and fatherhood", ur: "سنن ابن ماجہ 4149 — باپ اور والدیت" }
text: "حَدَّثَنَا نَصْرُ بْنُ عَلِيٍّ، أَخْبَرَنِي أَبِي، عَنْ شُعْبَةَ، عَنْ عَبْدِ الأَكْرَمِ، - رَجُلٌ مِنْ أَهْلِ الْكُوفَةِ - عَنْ أَبِيهِ، عَنْ سُلَيْمَانَ بْنِ صُرَدٍ، قَالَ أَتَانَا رَسُولُ اللَّهِ ـ فَمَكَثْنَا ثَلاَثَ لَيَالٍ لاَ نَقْدِرُ - أَوْ لاَ يَقْدِرُ - عَلَى طَعَامٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4149، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4149 (Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4149، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
