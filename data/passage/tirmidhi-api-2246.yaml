label: { ar: "جامع الترمذي 2246 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 2246 — what was made lawful; what is not lawful", ur: "جامع ترمذی 2246 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 2246 — Lo que se ha hecho lícito; lo que no es lícito" }
text: "… رَسُولُ اللَّهِ إِنَّهُ عَقِيمٌ لاَ يُولَدُ لَهُ وَقَدْ خَلَّفْتُ وَلَدِي بِالْمَدِينَةِ أَلَمْ يَقُلْ رَسُولُ اللَّهِ لاَ يَدْخُلُ أَوْ لاَ تَحِلُّ لَهُ مَكَّةُ وَالْمَدِينَةُ أَلَسْتُ مِنْ أَهْلِ الْمَدِينَةِ وَهُوَ ذَا أَنْطَلِقُ مَعَكَ إِلَى مَكَّةَ. فَوَاللَّهِ مَا زَالَ يَجِيءُ بِهَذَا حَتَّى قُلْتُ فَلَعَلَّهُ مَكْذُوبٌ عَلَيْهِ ثُمَّ قَالَ يَا أَبَا سَعِيدٍ وَاللَّهِ لأُخْبِرَنَّكَ خَبَرًا حَقًّا وَاللَّهِ إِنِّي لأَعْرِفُهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2246، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2246 (Chapters On Al-Fitan), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2246، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2246 (Capítulos sobre Al-Fitan), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
