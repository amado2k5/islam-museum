text: "… بآية الميراث، كما قاله أكثر المفسرين والمعتبرين من الفقهاء؛ فإنَّ وجوب الوصية للوالدين والأقربين الوارثين منسوخٌ بالإجماع. بل منهيٌّ عنه للحديث المتقدم: إِنَّ اللهَ قَدْ أَعْطَىٰ كُلَّ ذِي حَقِّ حَقَّهُ فَلَا وَصِيَّةَ لِوَارِثٍ فآيةُ الميراث حكمٌ مُسْتَقِلُّ، ووجوب من عند …"
summary:
