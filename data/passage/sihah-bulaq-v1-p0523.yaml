  سديسة وفالجمع أمداس قال ابن السكيت تقول عندى ستة رجال ونسوة أى عندى
  ثلثة من هود وثلاث من هؤلاء قال وان شئت قات عندى ستة رجال ونسوة فدسقت بالنسوة
  على الستة أى عندى ستة من هؤلاء وعندى نسوة وكذلك كل عدداحتمل أن يفرد منه جمعان
