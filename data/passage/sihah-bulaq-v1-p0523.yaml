  ⁦(سخت)⁩ السخت الشديد قال أبو الحسن اللحيانى يقال هذا حرّسخت قال وهو مه روف
  في كلام العرب وهم ربما استعماوا بعض كاام العجم كما قالو اللمسح بلاس السختيت
