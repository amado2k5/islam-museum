text: "لف الأحزاب من بينهم ) . قال مجاهد والسدي : الأحزاب هم أهل الكتاب من اليهود والنصارى . وقال الكلبي ومقاتل : هم فرق النصارى اختلفوا في أمر عيسى . قال قتادة : ومعنى (( من بينهم )) : أنهم"
