text: "… حالي. فلما مات، لحقت بالمَوْصِل، فأتيت صاحبَها فوجدته على مثل حاله من الاجتهاد والزُّهْد، فقلت له : إنّ فلاناً أوصى بي إليك. قال : فأقم أيْ بُنَيّ، فأقمت عنده على مثل أمر صاحبه حتى حَضَرَتْه الوفاةُ، فقلت : إنّ فلاناً …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 98، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
