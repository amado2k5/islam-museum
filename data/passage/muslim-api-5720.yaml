label: { ar: "صحيح مسلم 5720 — الرقية", en: "Sahih Muslim 5720 — ruqya recited over the sick", ur: "صحیح مسلم 5720 — رقیہ" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو كُرَيْبٍ وَإِسْحَاقُ بْنُ إِبْرَاهِيمَ - قَالَ إِسْحَاقُ أَخْبَرَنَا وَقَالَ أَبُو بَكْرٍ، وَأَبُو كُرَيْبٍ - وَاللَّفْظُ لَهُمَا - حَدَّثَنَا مُحَمَّدُ بْنُ بِشْرٍ، عَنْ مِسْعَرٍ، حَدَّثَنَا مَعْبَدُ بْنُ خَالِدٍ، عَنِ ابْنِ شَدَّادٍ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ يَأْمُرُهَا أَنْ تَسْتَرْقِيَ مِنَ الْعَيْنِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5720، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5720 (The Book of Greetings), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5720، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
