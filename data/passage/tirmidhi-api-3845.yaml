text: "حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، قَالَ أَخْبَرَنَا أَبُو أُسَامَةَ، عَنْ نَافِعِ بْنِ عُمَرَ الْجُمَحِيِّ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، قَالَ قَالَ طَلْحَةُ بْنُ عُبَيْدِ اللَّهِ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ عَمْرَو بْنَ الْعَاصِي مِنْ صَالِحِي قُرَيْشٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ إِنَّمَا نَعْرِفُهُ مِنْ حَدِيثِ نَافِعِ بْنِ عُمَرَ الْجُمَحِيِّ. وَنَافِعٌ ثِقَةٌ وَلَيْسَ إِسْنَادُهُ بِمُتَّصِلٍ وَابْنُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3845، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3845 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3845، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3845 (Capítulos sobre las virtudes), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3845 (Chapitres sur les vertus), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, les religions, les sectes et les peuples non musulmans."
