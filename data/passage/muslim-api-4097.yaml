label: { ar: "صحيح مسلم 4097 — الحلال، الحرام", en: "Sahih Muslim 4097 — the lawful; the unlawful", ur: "صحیح مسلم 4097 — حلال، حرام" }
text: "… بْنُ يَزِيدَ حَدَّثَنِي سَعِيدُ بْنُ أَبِي هِلاَلٍ، عَنْ عَوْنِ بْنِ عَبْدِ اللَّهِ، عَنْ عَامِرٍ الشَّعْبِيِّ، أَنَّهُ سَمِعَ نُعْمَانَ بْنَ بَشِيرِ بْنِ سَعْدٍ، صَاحِبَ رَسُولِ اللَّهِ وَهُوَ يَخْطُبُ النَّاسَ بِحِمْصَ وَهُوَ يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" الْحَلاَلُ بَيِّنٌ وَالْحَرَامُ بَيِّنٌ \". فَذَكَرَ بِمِثْلِ حَدِيثِ زَكَرِيَّاءَ عَنِ الشَّعْبِيِّ إِلَى قَوْلِهِ \" يُوشِكُ أَنْ يَقَعَ فِيهِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4097، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 4097 (The Book of Musaqah), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 4097، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
