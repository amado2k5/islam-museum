text: "لله عليه وسلم-ثم دعا بكتاب رسول الله بسم الله الرحمن الرحيم من محمد عبد الله ورسوله إلى هرقل عظيم الروم. سلام على من اتبع الهدى، أما بعد فإني أدعوك بدعاية الإسلام، أسلم تسلم يؤتك الله أجرك مرتين. فإن توليت فإن"
