text: "… كيف أعرف جانبي الأيمن؟ جاءه ضيف ونامَ عندَهُ، فلمَّا كانَ منتصفُ الليلِ أَفاقَ الضيفُ ونادى جحا قائلاً : ناولَني يا سيدي الشمعةَ الموضوعةَ على يمينِك.. فاستغربَ جحا طلبَهُ وقال له: أنت مجنون!. كيف أعرفُ جانبي الأيمنَ في هذا الظلامِ الدامس؟"
summary:
  ar: "طلب ضيف من جحا في منتصف الليل أن يناوله الشمعة التي على يمينه، فقال جحا إنه مجنون لأنه في هذا الظلام لا يعرف أي جانب هو الأيمن. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  en: "A guest asks Juha at midnight to hand him the candle on his right; Juha says the guest is mad, since in this darkness he cannot know which is his right side. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  ur: "ایک مہمان نے آدھی رات کو جحا سے کہا کہ اپنی دائیں طرف رکھی شمع اسے پکڑا دے؛ جحا نے کہا کہ تم پاگل ہو، اس اندھیرے میں مجھے کیسے پتا چلے کہ میرا دایاں پہلو کون سا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  fr: "Un invité demande à Juha, à minuit, de lui passer la bougie qui est à sa droite ; Juha dit que l'invité est fou, car dans cette obscurité il ne saurait pas quel est son côté droit. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  es: "Un invitado le pide a Juha a medianoche que le alcance la vela que está a su derecha; Juha dice que está loco, pues en esta oscuridad no sabría cuál es su lado derecho. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  tr: "Gece yarısı bir misafir Juha'dan sağındaki mumu kendisine vermesini istedi. Juha, misafirin deli olduğunu, çünkü karanlıkta hangi tarafın doğru olduğunu bilemeyeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 36}"
  id: "Seorang tamu meminta Juha pada tengah malam untuk memberikan lilin di sebelah kanannya. Juha menjawab bahwa tamu itu gila karena dalam kegelapan dia tidak akan tahu sisi mana yang benar. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
