summary:
  ar: "القسم 44 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الخصومات»، ويضم فيها النصوص من 2410 إلى 2425 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 44 of Sahih al-Bukhari (Khusoomaat) in the division of the open hadith dataset the museum took its reports from: reports 2410 to 2425 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 44، عنوان «کتاب الخصومات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2410 تا 2425۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 44 de Sahih al-Bukhari (Khusoomaat) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2410 al 2425 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 44 du Sahih al-Bukhari (Khusoomaat), dans la partie ouverte de la base de données: les hadiths 2410 à 2425 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 44. bölümü \"Tartışmalar Kitabı\" başlığını taşımakta olup, 2410 ile 2425 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 44 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Perselisihan\" dan berisi teks 2410 hingga 2425, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
