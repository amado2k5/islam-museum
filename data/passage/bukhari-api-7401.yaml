text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا وَرْقَاءُ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَما ـ قَالَ قَالَ النَّبِيُّ \" لاَ تَحْلِفُوا بِآبَائِكُمْ، وَمَنْ كَانَ حَالِفًا فَلْيَحْلِفْ بِاللَّهِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7401، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7401 (Oneness, Uniqueness of Allah (Tawheed)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7401، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7401 (Unicidad de Alá (Tawhid)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
