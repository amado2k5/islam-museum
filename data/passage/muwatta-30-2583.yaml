label: { ar: "الموطأ 2583 — مالك: لا يُقسم في قتل العمد إلا اثنان فصاعدا من المدعين", en: "Muwatta 2583", es: "Muwatta 2583", fr: "Muwatta 2583", ur: "موطا 2583", tr: "Al-Muwatta 2583 — Malik: Kasıtlı öldürme davalarında, yalnızca iki veya daha fazla davacının yemin etmesi yeterlidir.", id: "Al-Muwatta 2583 — Malik: Dalam kasus pembunuhan yang disengaja, hanya dua atau lebih penggugat yang diwajibkan untuk bersumpah." }
summary:
  ar: "قال مالك: لا يُقسم في قتل العمد من المدعين إلا اثنان فصاعدا، تُرد الأيمان عليهما حتى يحلفا خمسين يمينا ثم قد استحقا الدم. وذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.456}"
  tr: "Malik şöyle dedi: Kasıtlı cinayet davalarında, yalnızca iki veya daha fazla davacının yemin etmesi yeterlidir. Yeminler, elli yemin edene kadar tekrarlanır; bundan sonra kan parası almaya hak kazanırlar. Bu, bizim düşünce ekolümüzde yerleşik uygulamadır. {cite:muwatta-maruf-1997 s.456}"
  id: "Malik berkata: Dalam kasus pembunuhan berencana, hanya dua penggugat atau lebih yang diharuskan untuk bersumpah. Sumpah tersebut kemudian diulang sampai mereka mengucapkan lima puluh sumpah, setelah itu mereka berhak atas uang darah. Ini adalah praktik yang sudah mapan dalam aliran pemikiran kami. {cite:muwatta-maruf-1997 p.456}"
