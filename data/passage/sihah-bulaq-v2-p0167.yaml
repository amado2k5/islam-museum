text: |-
  ١٢٠
  *⁦(فصل الالف)⁩•
  -⁦(اله)⁩.
  نم يكسرونه الانها صارت حرفا واحد افيشبهونه ا بالبا فيقولون م اللّٰه وربما قالوا من اللّٰه بضم
  الميم والنون ومن اللّٰه بفتحهما ومن اللّٰه بكسرهما. وقال أيو عبيدوكانوا يحلفون بالمين
  فيقولون يمين اللّٰه لا أفعل وأنشدلامرئ القيس
  فقلت يمين اللّٰه أبرح قاعدا • ولوقطعواراسى لديك وأوصالى
  أرادلا أبرح فحذف لاوهو يريده ثم يجمع اليمين على أين كما قال زهير
  قتجمع أين منا ومنكم • يمقسمة توربها الدماه
  ثم حلة وابه فقالوا أ يمن اللّٰه لا فعلن كذا وأيمنك يارب اذا خاطبوا قال فهذاهو الاصل فى أيمن
  اللّٰه ثم كثر هذا فى كلامهم وخف على ألنتهم حتى حذ فوامنه النون كما حذوافى
  قواهم لم يكن فقالوا لم يك قال وفيهالغات كثيرة سوى هسذه والى هذاذهب ابن كيسان وابن
  درستويه فقالا ألف اين ألف قطع وهوجع بين واناخففت همزتها وطرجت فى الوصل
  لكثرة استعمالهم لها
  باب الهاء
  صل الالف يه) أبوزيدما أجهت للامر آيه أبها وهوالامر تنساه ثم تتقبه له
  ويقال أيضاما أبهت له بالكسرآبه أبها مثل نبهت نبها والابهة العظمة والسكبر يقال تأبه
  الرجل اذا تكبرور بما قالو اللاجح أبه(انه الثاته مبدل من التعتهاقهإلا قه القاه
  وهو الطاعة كانه مقلوب منه له أله بالفتح الاهة أى عبد عبادة ومنه قرأ ابن عباس
  رضى اللّٰه عنم-ما ويذرك والاهتك بكسر الهمزة قال وعبادتك وكان يقول انّ فرعون كان
  يعبد ومنه قولنا اللّٰه واصله الاه على فعال بمعق مفعول لانه مألوه أى معبود كقولنا امام
  فعال بعنى مفعول لانه مؤتم به فلما أدخلت عليه الالف واللام حذفت الهمزة تخقيف الكثرته
  فى الكلام ولو كانتاءوضامنها لما اجقعتا مع المعوّض منه فى قولهم الالاه وقطعت الهمزة
  فى الندا المزومها تفضيمالهذا الاسم وسمعت أباعلى النهوى" يقول ان الالف واللام عوض
  منها هال ويدل على ذلك استجازتهم لقطع الهمزة الموصولة الداخلة على لام التعريف فى القسم
  والنداء وذلك قولهم أفاللّه لمفعلن ويا أللّٰه اغفرلى ألا تررى أنم الوكانت غبرء وض لم تئت كم
  لم تثبت فى غيرهذا الاسم قال ولا يجوزأ يضا أن يكون للزوم الحرف لانّ ذلك يوحب أن تقطع
  هدزة الذى والتى ولا يجوزأيضا أن يكون لانهاهسمزة مفتوحة وان كانت موصولة كمالم يجز
  فى ايم اللّٰه وايمن اللّٰه التى هى همزة وصل فانها مفتوحة قال ولا يجوز أيضا أن يكون ذلك
  لكثرة الاستعمال لانّ ذلك يوجب أن تقطع الهمزة أيضا فى غير هذا بما يكثر استعمالهم له فعلنا
  انّ ذلكْ لمعنى اختصت به ليس فى غسيرها ولا شئ أولى بذلك المعنى من أن يكون المعوّض من
  لحرف الهذوف الذى هوالفاء وحوّز سيبويه أن يكون أصله لاها على مائذكره من بعد
  والاهاسم موضع بالجزيرة وقال
  كفى حزفا أن يرحل الركب غدوة • وأصبح فى عليا الاهة ثاويا
  وكان قد نهشته حية والاهة أيضااسم للشمس غير مصروف بلا ألف ولام ور بماصرفوه
  وأدخلوا فيه الالف واللام فقالوا الالاهة وأنشدنى أبو على
  تروحنا
