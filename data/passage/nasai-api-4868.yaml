label: { ar: "سنن النسائي 4868 — بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 4868 — dutifulness to the parents or disobedience to them", ur: "سنن نسائی 4868 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 4868 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan al-Nasa'i 4868 — le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan an-Nasa'i 4868 — Anne babaya iyilik mi, itaatsizlik mi?", id: "Sunan an-Nasa'i 4868 — Kebaikan atau ketidaktaatan kepada orang tua" }
text: "أَخْبَرَنَا عَبْدَةُ بْنُ عَبْدِ الرَّحِيمِ، قَالَ أَنْبَأَنَا ابْنُ شُمَيْلٍ، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ أَنْبَأَنَا فِرَاسٌ، قَالَ سَمِعْتُ الشَّعْبِيَّ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، عَنِ النَّبِيِّ قَالَ \" الْكَبَائِرُ الإِشْرَاكُ بِاللَّهِ وَعُقُوقُ الْوَالِدَيْنِ وَقَتْلُ النَّفْسِ وَالْيَمِينُ الْغَمُوسُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4868، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4868 (The Book of Oaths (qasamah), Retaliation and Blood Money), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4868، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.° 4868 (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Sangre), menciona la obediencia o desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye entre los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4868 (Le Livre des Serments (qasamah), de la vengeance et du prix du sang), évoque le devoir envers les parents ou la désobéissance à ces derniers. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 4868 numaralı hadis, anne babaya saygı göstermeyi veya göstermemeyi ele almaktadır. \"İslam'da Ebeveynlik\" tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4868, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Peramban \"Kekeluargaan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
