text: "… ويضمه إلى جنسه، بل فرق الكلام في أصول الإيمان. م القول في عقيدة فهذه الجملة المذكورة تتعلق بالقرآن، وقد تقدم أهل السنة في القرآن، وأن القرآن كلام اللّٰه حقيقة منزل غير مخلوق، منه بدأ وإليه يعود، وأنه كلام اللّٰه على …"
summary:
