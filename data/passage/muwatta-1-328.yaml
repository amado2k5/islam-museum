label: { ar: "الموطأ 328 — ابن عمر: صلاة المغرب وتر صلاة النهار", en: "Muwatta 328", es: "Muwatta 328", fr: "Muwatta 328", ur: "موطا 328", tr: "El-Muvatta 328 — İbn Ömer: Akşam namazı, günün vitir namazıdır.", id: "Al-Muwatta 328 — Ibn Umar: Shalat Maghrib adalah shalat Witir pada siang hari" }
text: "صلاة المغرب وتر صلاة النهار"
summary:
  ar: "أثر يرويه مالك عن عبد الله بن دينار أن عبد الله بن عمر كان يقول إن صلاة المغرب وتر صلاة النهار؛ وهو في باب الأمر بالوتر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.184}"
  tr: "Malik'in Abdullah ibn Dinar'dan rivayet ettiği bir hadiste, Abdullah ibn Umar'ın akşam namazının günün tek sayılı namazı olduğunu söylediği belirtilmektedir; bu, tek sayılı namazların kılınması emri bölümünde yer almaktadır. Editör, bu hadisin Malik'ten Ebu Musab, Suveyd ve Muhammed ibn el-Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.184}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Abdullah ibn Dinar menyatakan bahwa Abdullah ibn Umar biasa mengatakan bahwa salat Maghrib adalah salat ganjil dalam sehari; hal ini terdapat dalam surah tentang perintah untuk melaksanakan salat ganjil. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Musab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.184}"
