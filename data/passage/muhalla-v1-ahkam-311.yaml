text: "… لكن يَبْكِي مِنْ رِقَّةِ نَفْسِهِ وَأَفْضَلُ مِنَ النَّفَقَةِ في الجِهادِ وَغَيرِهِ نَفَقَةُ القُوتِ دُونَ تَبذِيرٍ وَلا تَقْتِيرِ عَلَى العِيالِ، وَأعْظَمُ الإثمِ تَضْيِيعُ العِيالِ. وَعَطِيَّةُ المرْءِ ذَوِي رَحِمِهِ أَفْضَلُ مِنَ العِتْقِ، وَصِلَةُ المشْرِكِ مِنْ ذَوِي الرَّحِمِ حَسَنٌ. وَيُسْتَحَبُّ أَنْ يَتَصَدَّقَ عَمَّنْ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 311، يرد فيه ذكر المستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 311, whose wording mentions the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 311 کا اقتباس جس میں مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
