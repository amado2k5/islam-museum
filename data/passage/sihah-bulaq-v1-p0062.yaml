  وهو رجل ترع أى سريع الى السر والغضب وسيل تراع أى بلا الوَادى والترّاع البوّاب
  وقال
  تخيرنى ترّاءه بين خلقة • أزوم اذاعضت وكيل مضبب
  والترعسة بالضم الباب وفى الحديث إن منبرى هذاعلى ترعة من توع الجنة ويقمال النرعة
  الروضة ويقال الدرحة والترعة أيضا أفواء الجداول حكاه بعضهم وسير أترع أى شديد
  ومنه قول الشاعر
  فاقترش الارض بسير أترعا والترباع بكسر التاءموضع
  ( سع لتسعة فى عدد المذكر والتسع فى عدد المؤنت والتَسع أبضاظم من أظماء الابل
  والة-ع بالضم جزء من تسعة وكذلك التسيع والتسع مثال الصردثلاث ليال من الشهر
  وهى بعد النقل لان آخرليلة منها هى التاسعة والتاسوعاء قبل يوم العاشورا. وأظنه مولدا
  وتسعت القوم أتسعهم اذا أخذت تسع أموالهم أوكنت لهم تاسعا وأتسع القوم إذا وردت
  ابلهم تسعا وأتسعوا أى صارواتسعة ( ت ع التعتعة فى الكلام الترددفيه من
  حصر أوعىّ وربما قالوه فى الداية اذا ارتطمت فى الرمل قال الشاعر
  يتعتع فى الخبار اذا علاه * ويعثر فى الطريق المستقيم
  ووقع القوم فى تعاتع اذا وقعوافى اراجيف وتخليط وتعتعت الرجل إذاءتلته وأقلقته
  ( تلع رجل أتلع بين التلع أى طويل العقق وجيد تليع أى طويل قال الاعشى
  يوم تبدى لناقتيلة عن • جيد تليع تزينه الاطواق
  والتليع من الرجال الطويل وتتلع أى مدعنقه للقيام ويقال قعدفا يتتلع أى فارفع رأسه
  للنهوض ولا يريد البراح وقال أبو ذؤيب
  فوردن والعبوق مقعد رابى الضرباء فوق النجم لا يتتلع
  ورجل تلع أى كثير التلفت حوله واناه تدع لغة فى ترع أولثغة قال أبو عبيدة التلعة
  ما لوتفع من الارض وما انهبط منها أيضاوهو عنده من الاضداد قال أبوعمر والتلاع مجارى
  أعلى الارض الى بطون الاودية واحدتها تلعة وتلع الهارار تضع وأتلعت الظبية من كناسها
  أى سمت بجيدها ومتالع بضم الميم جيل قال لبيد
  درس المنايمتالع فأيانا
  أراد المنازل فحذف وهو قبيح وع . التوع مصدرة ولات تعت السمن أواللبأأنوعه
  اذاكسرته بقطعة خبز ترفعهبها ت ع اع التى يتبع تيعا أى خرح وأناع الرجل
  أى قاءفهو متيع والتى"مشاع قال القطامى وذكر الجراحات
  وظلت تغيظ الايدى كاوما • تج عروفها علقامتاعا
  وتاع الشىَّ يتبع أى سال على وجه الارض والتتابع التهافت فى الشر واللجاج ولا يكون
  التتابع الافى الشرّ والبكران يتتابع أى يرمى بنفسه والريح تتتابع بالييس قال أبو ذؤيب
  وفرهة عنس قدرت لساقها • فرت كأنتتابع الريح بالقفل
  وتتصابع البعير فى مشيه اذا حرّك ألواحه والبيعة بالكسر أربعون من الغنم وفى الحديث
  فى التيعة شاة
  يمع ثعاأى قاء وفى الحديث ان امرأة أنت الني صلى اللّٰه عليه وسلم فقالت ان ابن هذا
