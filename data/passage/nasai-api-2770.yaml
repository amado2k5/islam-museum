label: { ar: "سنن النسائي 2770 — الأب والأبوة", en: "Sunan al-Nasa'i 2770 — the father and fatherhood", ur: "سنن نسائی 2770 — باپ اور والدیت", es: "Sunan al-Nasa'i 2770 — El padre y la paternidad" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَنْبَأَنَا عَبْدُ الرَّزَّاقِ، قَالَ أَنْبَأَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يُنْكِرُ الاِشْتِرَاطَ فِي الْحَجِّ وَيَقُولُ مَا حَسْبُكُمْ سُنَّةُ نَبِيِّكُمْ إِنَّهُ لَمْ يَشْتَرِطْ فَإِنْ حَبَسَ أَحَدَكُمْ حَابِسٌ فَلْيَأْتِ الْبَيْتَ فَلْيَطُفْ بِهِ وَبَيْنَ الصَّفَا وَالْمَرْوَةِ ثُمَّ لْيَحْلِقْ أَوْ يُقَصِّرْ ثُمَّ لْيُحْلِلْ وَعَلَيْهِ الْحَجُّ مِنْ قَابِلٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 2770، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2770 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2770، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2770 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
