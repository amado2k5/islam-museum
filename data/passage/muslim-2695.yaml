label: { ar: "مسلم 2695 — لأن أقول سبحان الله والحمد لله ولا إله إلا الله والله أكبر أحب إلي مما طلعت عليه الشمس", en: "Muslim 2695 — Saying the four praises is dearer to me than all the sun rose upon", es: "Muslim 2695 — Decir las cuatro alabanzas es más querido para mí que todo el sol que salió.", fr: "Muslim 2695 — Prononcer les quatre louanges m'est plus cher que tout le soleil levant.", ur: "مسلم 2695 - چار حمد کہنا مجھے تمام سورج طلوع ہونے سے زیادہ محبوب ہے۔", tr: "Müslim 2695 — Benim için “Allah'a hamd olsun, Allah'a şükürler olsun, Allah'tan başka ilah yoktur ve Allah en büyüktür” demek, güneşin aydınlattığı her şeyden daha değerlidir.", id: "Muslim 2695 — Bagiku, mengucapkan “Maha Suci Allah, segala puji bagi Allah, tiada tuhan selain Allah, dan Allah Maha Besar” lebih kucintai daripada segala sesuatu yang pernah diterangi matahari." }
text: "قال رسول الله: «لأن أقول سبحان الله والحمد لله ولا إله إلا الله والله أكبر أحب إلي مما طلعت عليه الشمس»"
summary:
  ar: "رواية أبي هريرة في كتاب الذكر والدعاء من صحيح مسلم؛ يجعل قول الكلمات الأربع أحب إلى النبي من الدنيا كلها."
  tr: "Sahih Müslim'deki Dua ve Zikir Kitabı'nda Ebu Hurayra'nın rivayetine göre, bu dört kelimeyi söylemek Peygamberimiz için bütün dünyadan daha sevimlidir."
  id: "Riwayat Abu Hurairah dalam Kitab Zikir dan Doa dari Sahih Muslim menjadikan pengucapan empat kata tersebut lebih dicintai oleh Nabi daripada seluruh dunia."
