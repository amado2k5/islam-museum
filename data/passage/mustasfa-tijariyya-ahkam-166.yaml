text: "… اغفرلي، وعن سؤال العبد من سيده، والولد من والده. ولا حاجة إلى هذا الاحتراز، بل يتصور من العبد والولد أمر السيد والوالد، وإن لم تجب عليهما الطاعة،فليس من ضرورة كل أمر أن يكون واجب الطاعة بل الطاعة لا تجب إلا …"
summary:
  ar: "مقطع من المستصفى للغزالي، طبعة التجارية، ص 166، يرد فيه ذكر الواجب، وما يجب على المكلف، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, the Tijariyya printing, p. 166, whose wording mentions the obligatory (wajib), what is binding on the person addressed, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، طبع تجاریہ، ص 166 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 166, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 166, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin El-Mustasfa adlı eserinin ticari baskısından, 166. sayfadan bir alıntı; farz olan amelleri, sorumlu kişinin görevlerini ve itaati ele almaktadır; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Edisi Komersial, hlm. 166, yang menyebutkan amalan wajib, kewajiban individu yang bertanggung jawab, dan ketaatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
