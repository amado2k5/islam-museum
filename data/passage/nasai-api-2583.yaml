label: { ar: "سنن النسائي 2583 — الأجران", en: "Sunan al-Nasa'i 2583 — the double reward", ur: "سنن نسائی 2583 — دوہرا اجر" }
text: "… لَهَا زَيْنَبُ تَسْأَلُ عَمَّا أَسْأَلُ عَنْهُ فَخَرَجَ إِلَيْنَا بِلاَلٌ فَقُلْنَا لَهُ انْطَلِقْ إِلَى رَسُولِ اللَّهِ فَسَلْهُ عَنْ ذَلِكَ وَلاَ تُخْبِرْهُ مَنْ نَحْنُ. فَانْطَلَقَ إِلَى رَسُولِ اللَّهِ فَقَالَ \" مَنْ هُمَا \". قَالَ زَيْنَبُ. قَالَ \" أَىُّ الزَّيَانِبِ \". قَالَ زَيْنَبُ امْرَأَةُ عَبْدِ اللَّهِ وَزَيْنَبُ الأَنْصَارِيَّةُ قَالَ \" نَعَمْ لَهُمَا أَجْرَانِ أَجْرُ الْقَرَابَةِ وَأَجْرُ الصَّدَقَةِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2583، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2583 (The Book of Zakah), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2583، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
