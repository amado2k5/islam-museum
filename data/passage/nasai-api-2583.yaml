label: { ar: "سنن النسائي 2583 — الأجران", en: "Sunan al-Nasa'i 2583 — the double reward", ur: "سنن نسائی 2583 — دوہرا اجر", es: "Sunan al-Nasa'i 2583 — la doble recompensa", fr: "Sunan al-Nasa'i 2583 — la double récompense", tr: "Sünen an-Nesa'i 2583 - Al-Ajran", id: "Sunan an-Nasa'i 2583 — Al-Ajran" }
text: "… لَهَا زَيْنَبُ تَسْأَلُ عَمَّا أَسْأَلُ عَنْهُ فَخَرَجَ إِلَيْنَا بِلاَلٌ فَقُلْنَا لَهُ انْطَلِقْ إِلَى رَسُولِ اللَّهِ فَسَلْهُ عَنْ ذَلِكَ وَلاَ تُخْبِرْهُ مَنْ نَحْنُ. فَانْطَلَقَ إِلَى رَسُولِ اللَّهِ فَقَالَ \" مَنْ هُمَا \". قَالَ زَيْنَبُ. قَالَ \" أَىُّ الزَّيَانِبِ \". قَالَ زَيْنَبُ امْرَأَةُ عَبْدِ اللَّهِ وَزَيْنَبُ الأَنْصَارِيَّةُ قَالَ \" نَعَمْ لَهُمَا أَجْرَانِ أَجْرُ الْقَرَابَةِ وَأَجْرُ الصَّدَقَةِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2583، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2583 (The Book of Zakah), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2583، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2583 (El Libro del Zakat), habla de la doble recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2583 (Le Livre de la Zakat), évoque la double récompense. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de yer alan 2583 numaralı hadis, iki tür mükafattan bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 2583, menyebutkan dua jenis pahala. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
