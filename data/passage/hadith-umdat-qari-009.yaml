text: "له: (رواه أبو هريرة عن النبي عيا) وقد مضى في كتاب العلم في: باب كتابة العلم، عن أبي نعيم عن شيبان عن يحيى عن أبي سلمة عن أبي هريرة: أن خزاعة قتلوا رجلا الحديث بطوله، وقد مضى الكلام فيه هناك"
