  الاصمعىّ وربما فالواجاه بالتذوين وأنشد
  اذا قلت جاملج حتى تزده • قوى أدم أطرافها فى السلاسل
  ويقال جاهه بالمكروه جوها أى جبهه (جهجه جهيهت بالسبع صحت به لينسكف
  ويقال تجهبه عنى أى انته
  صل الدال ره الدوه الدفع يقال درهت عن القوم دفعت عنهم مشل درأت
  وهو مبدل منه نحوهراق الماء وأراقه والمدره زعيم القوم والمتكلم هنهم قال لبيد
  ومدره الكتيبة للرداح» وابهع المداره ومنه قول الاصبغ
  ياابن الجاجة المداره • والصابرين على المكاره.
  ⁦( دله)⁩ ذهب دمه دلهما بالتسكين أى هدرا والتدليه ذه.اب العقل من الهوى يقال داهه
