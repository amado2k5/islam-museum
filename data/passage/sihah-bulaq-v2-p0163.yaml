  وكذلت أبكرجع بكر ثم صغرفقال أيكر جمه بالياء والنون وبقال ما أدرى أى
  الدهداهو أت أىّ الناس هووحكى الكسانة أى الدهدا هو بالمد وقولهم الاده فلاده
