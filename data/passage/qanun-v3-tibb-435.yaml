summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 435، يذكر المرض والمريض، والوجع، والحمى والوعك، والجذام والبرص، وأسماء الأمراض، وأعضاء البدن، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 435, that mentions illness and the sick, pain, fever, leprosy and vitiligo, named diseases, the organs of the body, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 435 کا اقتباس جس میں بیماری اور بیمار، درد، بخار، جذام اور برص، بیماریوں کے نام، اعضائے بدن، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 435, que menciona la enfermedad y los enfermos, el dolor, la fiebre, la lepra y el vitíligo, enfermedades específicas, los órganos del cuerpo, la enfermedad y su remedio; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 435, qui mentionne la maladie et les malades, la douleur, la fièvre, la lèpre et le vitiligo, les maladies nommées, les organes du corps, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Bölümünün 435. sayfasından bir bölüm; hastalık ve hasta, ağrı, ateş ve halsizlik, cüzzam ve vitiligo, hastalıkların, vücut parçalarının ve rahatsızlıkların isimlerinden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 3, hlm. 435, yang menyebutkan penyakit dan pasien, rasa sakit, demam dan rasa tidak enak badan, kusta dan vitiligo, nama-nama penyakit, bagian tubuh, dan keluhan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
