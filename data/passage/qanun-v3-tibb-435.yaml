text: "… ويفتح سدد الكبد، ويدرّ الطمث، ويزيل عسر النفس، وينفع من الربع وجميع الأمراض البلغمية الفجّة والسوداوية والحمّيات المتناوبة، وينفع من أوجاع المفاصل والنقرس وعرق النسا، وينفع من داء الحية وداء التعلب والقروح العتيقة في الرأس وغيره، ومن البرص والبهق والقوابي …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 435، يذكر المرض والمريض، والوجع، والحمى والوعك، والجذام والبرص، وأسماء الأمراض، وأعضاء البدن، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 435, that mentions illness and the sick, pain, fever, leprosy and vitiligo, named diseases, the organs of the body, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
