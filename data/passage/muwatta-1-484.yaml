label: { ar: "الموطأ 484 — عمر يبني البطيحاء بناحية المسجد لمن أراد أن يلغط أو ينشد شعراً", en: "Muwatta 484" }
text: "من كان يريد أن يلغط أو ينشد شعراً أو يرفع صوته فليخرج إلى هذه الرحبة"
summary:
  ar: "بلاغ في باب جامع الصلاة: يروي مالك أنه بلغه أن عمر بن الخطاب بنى رحبة في ناحية المسجد تُسمى البطيحاء، وقال: من كان يريد أن يلغط أو ينشد شعراً أو يرفع صوته فليخرج إلى هذه الرحبة. ويذكر المحقق أن أبا مصعب وسويداً أخرجاه عن مالك متصلاً: أخبرني أبو النضر عن سالم بن عبد الله أن عمر بن الخطاب. {cite:muwatta-maruf-1997 p.248}"
