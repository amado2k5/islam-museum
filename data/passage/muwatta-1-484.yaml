label: { ar: "الموطأ 484 — عمر يبني البطيحاء بناحية المسجد لمن أراد أن يلغط أو ينشد شعراً", en: "Muwatta 484", es: "Muwatta 484", fr: "Muwatta 484", ur: "موطا 484", tr: "Al-Muwatta 484 — Ömer, konuşmak veya şiir okumak isteyen herkes için caminin yakınında Al-Bat'ha alanını inşa ettirdi.", id: "Al-Muwatta 484 — Umar membangun kawasan Al-Bat’ha di dekat masjid untuk siapa pun yang ingin berbicara atau membaca puisi." }
text: "من كان يريد أن يلغط أو ينشد شعراً أو يرفع صوته فليخرج إلى هذه الرحبة"
summary:
  ar: "بلاغ في باب جامع الصلاة: يروي مالك أنه بلغه أن عمر بن الخطاب بنى رحبة في ناحية المسجد تُسمى البطيحاء، وقال: من كان يريد أن يلغط أو ينشد شعراً أو يرفع صوته فليخرج إلى هذه الرحبة. ويذكر المحقق أن أبا مصعب وسويداً أخرجاه عن مالك متصلاً: أخبرني أبو النضر عن سالم بن عبد الله أن عمر بن الخطاب. {cite:muwatta-maruf-1997 p.248}"
  tr: "Cemaat namazıyla ilgili bir rivayet: Malik, Ömer ibn el-Hattab'ın mescidin bir köşesine el-Batiha denilen bir avlu yaptırdığını ve şöyle dediğini işittiğini aktarır: \"Yüksek sesle konuşmak, şiir okumak veya sesini yükseltmek isteyen herkes bu avluya çıksın.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten sürekli bir rivayet zinciriyle naklettiğini belirtir: Ebu el-Nadr, Salim ibn Abdullah'tan rivayetle bana Ömer ibn el-Hattab'ın... {cite:muwatta-maruf-1997 s.248}"
  id: "Sebuah laporan mengenai salat berjamaah: Malik meriwayatkan bahwa ia mendengar bahwa Umar ibn al-Khattab membangun sebuah halaman di sudut masjid yang disebut al-Batiha, dan berkata: “Siapa pun yang ingin berbicara dengan lantang, membaca syair, atau meninggikan suara, hendaknya keluar ke halaman ini.” Peneliti menyebutkan bahwa Abu Mus’ab dan Suwaid meriwayatkannya dari Malik dengan sanad yang berkesinambungan: Abu al-Nadr memberitahukan kepadaku, dari Salim ibn Abdullah, bahwa Umar ibn al-Khattab… {cite:muwatta-maruf-1997 p.248}"
