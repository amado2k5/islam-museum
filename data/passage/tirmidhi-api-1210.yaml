label: { ar: "جامع الترمذي 1210 — الأب والأبوة", en: "Jami' al-Tirmidhi 1210 — the father and fatherhood", ur: "جامع ترمذی 1210 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1210 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1210 — le père et la paternité", tr: "Cami' el-Tirmizi 1210 — Baba ve Babalık", id: "Jami' al-Tirmidhi 1210 — Sang Ayah dan Peran Ayah" }
text: "… حَدَّثَنَا بِشْرُ بْنُ الْمُفَضَّلِ، عَنْ عَبْدِ اللَّهِ بْنِ عُثْمَانَ بْنِ خُثَيْمٍ، عَنْ إِسْمَاعِيلَ بْنِ عُبَيْدِ بْنِ رِفَاعَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّهُ خَرَجَ مَعَ النَّبِيِّ إِلَى الْمُصَلَّى فَرَأَى النَّاسَ يَتَبَايَعُونَ فَقَالَ \" يَا مَعْشَرَ التُّجَّارِ \". فَاسْتَجَابُوا لِرَسُولِ اللَّهِ وَرَفَعُوا أَعْنَاقَهُمْ وَأَبْصَارَهُمْ إِلَيْهِ فَقَالَ \" إِنَّ التُّجَّارَ يُبْعَثُونَ يَوْمَ الْقِيَامَةِ فُجَّارًا إِلاَّ مَنِ اتَّقَى اللَّهَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1210، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1210 (The Book on Business), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1210، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1210 (El Libro de los Negocios), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1210 (Le Livre des Affaires), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Cami' el-Tirmizi'nin 1210 numaralı hadisinde baba ve babalık kavramından bahsedilir. İslam'da babalık üzerine araştırma yapanlar, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birleştirirler."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1210, menyebutkan tentang ayah dan peran ayah. Peneliti tentang peran ayah dalam Islam menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
