label: { ar: "الموطأ 1157 — هشام بن عروة عن أبيه: من أدركه الفجر من ليلة المزدلفة ولم يقف بعرفة فقد فاته الحج", en: "Muwatta 1157", es: "Muwatta 1157", fr: "Muwatta 1157", ur: "موطا 1157", tr: "El-Muvatta 1157 — Hişam ibn Urve, babasının rivayetine göre: Muzdalifa gecesi şafak sökmeden Arafat'ta bulunmayan kimse Hac ibadetini kaçırmıştır.", id: "Al-Muwatta 1157 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Barang siapa yang tiba saat fajar pada malam Muzdalifah dan belum berdiri di Arafat, maka ia telah melewatkan ibadah haji." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن من أدركه الفجر من ليلة المزدلفة ولم يقف بعرفة فقد فاته الحج، ومن وقف بعرفة من تلك الليلة قبل طلوع الفجر فقد أدرك الحج. {cite:muwatta-maruf-1997 p.523}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ettiğine göre, Muzdalifa gecesi şafak sökmeden Arafat'ta bulunmayan kimse Hac ibadetini yerine getirmemiş sayılır; o gece şafak sökmeden Arafat'ta bulunan kimse ise Hac ibadetini yerine getirmiş sayılır. {cite:muwatta-maruf-1997 s.523}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, bahwa siapa pun yang tiba saat fajar pada malam Muzdalifah dan belum berdiri di Arafat, maka ia telah gagal melaksanakan haji. Dan siapa pun yang berdiri di Arafat pada malam itu sebelum fajar telah melaksanakan haji. {cite:muwatta-maruf-1997 p.523}"
