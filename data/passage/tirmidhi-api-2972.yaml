text: "حَدَّثَنَا عَبْدُ بْنُ حُمَيْدٍ، حَدَّثَنَا الضَّحَّاكُ بْنُ مَخْلَدٍ أَبُو عَاصِمٍ النَّبِيلُ، عَنْ حَيْوَةَ بْنِ شُرَيْحٍ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ أَسْلَمَ أَبِي عِمْرَانَ التُّجِيبِيِّ، قَالَ كُنَّا بِمَدِينَةِ الرُّومِ فَأَخْرَجُوا إِلَيْنَا صَفًّا عَظِيمًا مِنَ الرُّومِ فَخَرَجَ إِلَيْهِمْ مِنَ الْمُسْلِمِينَ مِثْلُهُمْ أَوْ أَكْثَرُ وَعَلَى أَهْلِ مِصْرَ عُقْبَةُ بْنُ عَامِرٍ وَعَلَى الْجَمَاعَةِ فَضَالَةُ بْنُ عُبَيْدٍ فَحَمَلَ رَجُلٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2972، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2972 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 2972، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2972 (Capítulos sobre Tafsir), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
