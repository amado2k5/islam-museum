text: |-
  قوله أجدت الخ رواء فى مادّة
  حرد وأذرت برجليها النسفى
  وراجعت الخ اد مصصعه
  ٢٤
  *⁦(باب الفاء)⁩*
  يحمل فى سحو من الخفاف • توادياسوين من خلاف
  فاتماير يد أنم ا من شجر مختلف وليس يعنى الشجرة التى يقال لها الخلاف لان ذلك لا يكاد
  يكون بالبادية. وقواهم هويخالف الى امرأة فلان أى يأتيها اذا غاب عنها ويروى قول أبى
  ذو يب• وخالفها فى بيت نوب عواسل * باظا أى جاء الى عسلها وهى ترعى وتقول خلف
  ناقته تخليفا أى صرّمنها خلفا وأحدا عن بعة وب وتقول أيضا خلفت فلانا وراتى فتخلف
  عنى أى تأخر ويقال فى خلق فلان خلفنة مثال درفسة أى الخلاف والنون زائدة
  ( خنف الخناف لين فى أرساغ البعير تقول منه خنف البعير يخنف خنافا اذاسارفقاب
  خفيده الى وحشبه وناقة خنوف قال الاعشى
  أجدّت برجليها النجاء وراجعت * يداها خنا فالينا غيرأحردا
  ويقال أيضاخف البعير يخنف خنافا اذالوى أنفه من الزمام ومنه قول الشاعر
  قدقلت والعيس النجائب تعتلى *بالقوم عاصفة خوانف فى البرى
  وقال أبو عبيد يكون الخناف فى العنق أن تميلد اذامد بزمامها والخائف الذى يشمخ بأنفه
  من الكبريق ال رأيته خاتفاعى بأنفسه والخنيف من الثياب أبيض غليظ يتخذ من كتان
  وفى الحديث تخرّقت عنا الخذف وأبو مختف بالكسر كنية لوط بن يحي رجل من نقلة السير
  ⁦( خوف )⁩ تاف الرجل يخاف خوفا وخيفة ومخافة ذهوخائف وقوم خوف على الاصل
  وخيف على اللفظ والامر منه خف بفتح انخاء وربما قالوارجل خاف أى شديد الخوف
  جاؤابه على فعل مثل فرق وفزع كما قالوارجل صأت أى شديد الصوت واللخيفة الخوف والهع
  خيف وأصل الواد قال الهذى
  ولا تقعدت على زخة • وتضمر فى القلب وجِداوخيفا
  وخاوفه فافه يخوفه غلبه بالخوف أى كان أشد خوفامنه والاخافة التخويف يقال وجع
  مخيف أى يذيف من رآه وطريق مخوف لانه لا يخيف وان ايخيف فيه قاطع الطريق
  وتخوّفت عليه الشئ أى خفت وتخوّفه أى تنقصه قال ذو الرقة
  تخوّف الرحل منها تامكافردا • كما تخوّف ظهر النبعة السفن
  ومنه قوله تعالى أويأخذهم على تخوف والخافة خريطة من أدم يشتارفيها العسل
  قال أبوذؤيب
  تأبط خافة فيها مساب • فأصبح يقترى مدابنيق
  ⁦(خيف)⁩ الخيف ما انحدر عن غلظ الجبل وارتفع عن مسيل الماء ومنه سنهى مسجد
  انظيف بنى وقد أخاف القوم اذا أنواخيف من قنزلوه والخيف أيضاجلد الضرع يقال
  فاقة خيفاه بينسة الخيف وجمل أخيف واسع الثيل وقد خيف بالكسر وكذلك فرس أخيف
  ين انليف اذا كانت احدى عينيه زرقاء والاخرى سوداء وكذلك هو من كل شى ومنه قيل
  !ناس أخياف أى مختافون واخوة أخداف اذا كانت أتهم واحدة والا باشتى وانلخفان
  الجراد اداعارت فيه خطوط مختلفة ساض وصفرة الواحدة خفانة ثم تشبه به الفرس
  فى خفتها وطمورها قال امر والقيس
  وأركب
