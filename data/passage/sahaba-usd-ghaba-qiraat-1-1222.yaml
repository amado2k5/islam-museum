text: "… فقال رسول اللّٰه لع : هكذا أُنزلت. ثم قال النبي م: اقرأ يا عمر. فقرأت القراءة التي أقرأني النبي ملاخ، فقال النبي: هكذا أُنزلِت. ثم قال النبي ع: إن هذا القرآن أُنزل على سبعة أحرف، فاقرؤُوا ما تيسر منه. أخرجه …"
