text: "… أوص. فقال: إذا مت فتصدقوا بقميصي هذا، فإني أحب أن أخرج من الدنيا عرياناً كما دخلت إليها عرياناً. أسند معروف عن بكر بن خنيس و عبد اللّٰه بن موسى و ابن السماك. وتوفي سنة مائتين وقبره ظاهر ببغداد يتبرك به. …"
