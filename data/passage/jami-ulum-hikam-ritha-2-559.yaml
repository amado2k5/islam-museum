  es: "Un extracto de Jami' al-Ulum wal-Hikam, volumen escaneado 2, p. 559, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Cami' el-Ulum ve el-Hikam'ın 2. cildinin 559. sayfasından, bir ağıt ve ölüm duyurusu içeren bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Jami' al-'Ulum wa al-Hikam, Volume 2, halaman 559, berisi eulogi dan pengumuman kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
