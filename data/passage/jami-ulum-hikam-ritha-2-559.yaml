text: "… مِنَ الرِّزق في طاعته، فمن عمل بهذا، كان قد أخذ بحزم الشُّكر وأصله وفرعه أخرجه : ابن أبي الدنيا في الشكر ورأى الحسن رجلا يتبختر في مشيته، فقال : لله في كُلّ عُضوٍ منه نعي اللهمَّ لا تجعلنا ممن يتقوَّى …"
summary:
  ar: "مقطع من جامع العلوم والحكم، المجلد المصوَّر 2، ص 559، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Jami' al-Ulum wal-Hikam, scan volume 2, p. 559, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "جامع العلوم والحکم، اسکین جلد 2، ص 559 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
