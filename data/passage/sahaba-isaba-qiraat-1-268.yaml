text: "… وروى قصته أيضاً أسلم بن سهل في تاريخ واسط، من طريق شبيب بن شيبة بن عبد اللّٰه بن الأهتم التميميّ، عن أبيه، قال: كان رجل له أبوان شيخان كبيران... فذكر القصة وفيها الشعر. وقال المَدَائِنِيُّ، عن أبي عمرو بن العلاء: …"
