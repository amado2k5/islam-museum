summary:
  ar: "يروي مالك عن يعقوب بن زيد بن طلحة عن أبيه زيد بن طلحة عن عبد الله بن أبي مليكة أن امرأة جاءت النبي فأخبرته أنها زنت وهي حامل، فأمرها أن تذهب حتى تضع، ثم حتى ترضع، ثم حتى تستودع ولدها، ثم أمر بها فرجمت. ويذكر المحقق أن ابن عبد البر عدّه مرسلا في رواية يحيى ومن معه. {cite:muwatta-maruf-1997 p.382} {cite:muwatta-maruf-1997 p.383}"
