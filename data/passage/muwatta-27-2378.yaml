label: { ar: "الموطأ 2378 — ابن أبي مليكة: المرأة الحامل التي زنت حتى تضع وترضع", en: "Muwatta 2378", es: "Muwatta 2378", fr: "Muwatta 2378", ur: "موطا 2378", tr: "El-Muvatta 2378 — İbn Abi Malikah: Doğum yapıp emzirene kadar zina eden hamile kadın", id: "Al-Muwatta 2378 — Ibn Abi Malikah: Wanita hamil yang berzina hingga melahirkan dan menyusui" }
summary:
  ar: "يروي مالك عن يعقوب بن زيد بن طلحة عن أبيه زيد بن طلحة عن عبد الله بن أبي مليكة أن امرأة جاءت النبي فأخبرته أنها زنت وهي حامل، فأمرها أن تذهب حتى تضع، ثم حتى ترضع، ثم حتى تستودع ولدها، ثم أمر بها فرجمت. ويذكر المحقق أن ابن عبد البر عدّه مرسلا في رواية يحيى ومن معه. {cite:muwatta-maruf-1997 p.382} {cite:muwatta-maruf-1997 p.383}"
  tr: "Malik, Yakub ibn Zeyd ibn Talha'dan, o da babası Zeyd ibn Talha'dan, o da Abdullah ibn Ebu Mulayka'dan rivayetle, bir kadının Peygamberimize gelip hamile iken zina ettiğini söylediğini aktarır. Peygamberimiz ona, doğum yapana kadar, sonra çocuğunu emzirene kadar, sonra çocuğunu Allah'a emanet edene kadar gitmesini, daha sonra da taşlanarak öldürülmesini emretti. Araştırmacı, İbn Abdül-Barr'ın Yahya ve onunla birlikte olanların rivayetinde bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak değerlendirdiğini belirtir. {cite:muwatta-maruf-1997 s.382} {cite:muwatta-maruf-1997 s.383}"
  id: "Malik meriwayatkan dari Yaqub ibn Zayd ibn Talhah, dari ayahnya Zayd ibn Talhah, dari Abdullah ibn Abi Mulaykah, bahwa seorang wanita datang kepada Nabi dan mengatakan bahwa ia telah berzina saat hamil. Beliau memerintahkannya untuk terus berjalan hingga melahirkan, kemudian hingga menyusui anaknya, kemudian hingga menyerahkan anaknya kepada Allah, lalu beliau memerintahkannya untuk dirajam. Peneliti menyebutkan bahwa Ibnu Abd al-Barr menganggapnya mursal (hadits dengan mata rantai periwayatan yang hilang) dalam riwayat Yahya dan orang-orang yang bersamanya. {cite:muwatta-maruf-1997 p.382} {cite:muwatta-maruf-1997 p.383}"
