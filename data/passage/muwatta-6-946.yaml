label: { ar: "الموطأ 946 — المقداد بن الأسود دخل على علي بن أبي طالب بالسقيا وهو ينجع بكرات له، فقال: عثمان ينهى عن أن يقرن بين الحج والعمرة؛ فخرج علي مغضباً يقول: لبيك بحجة وعمرة معاً", en: "Muwatta 946", es: "Muwatta 946", fr: "Muwatta 946", ur: "موطا 946", tr: "El-Muvatta 946 — El-Mikdad ibn el-Esved, Sukya'da develerini otlatmakta olan Ali ibn Abi Talib'in yanına girdi ve şöyle dedi: Osman, Hac ve Umre'yi birleştirmeyi yasakladı; bunun üzerine Ali öfkeyle dışarı çıktı ve şöyle dedi: İşte ben, Hac ve Umre'yi birlikte yapıyorum.", id: "Al-Muwatta 946 — Al-Miqdad bin Al-Aswad menemui Ali bin Abi Talib di Al-Suqya ketika beliau sedang menggembalakan untanya, dan berkata: Utsman melarang menggabungkan haji dan umrah; maka Ali keluar dengan marah sambil berkata: Aku di sini, melaksanakan haji dan umrah bersama-sama" }
summary:
  ar: "أول حديث في باب القران في الحج. يرويه مالك عن جعفر بن محمد عن أبيه، أن المقداد بن الأسود دخل على علي بن أبي طالب بالسقيا، وهو ينجع بكراته دقيقاً وخبطاً، فقال: هذا عثمان بن عفان ينهى عن أن يقرن بين الحج والعمرة. فخرج علي وعلى يديه أثر الدقيق والخبط حتى دخل على عثمان فقال: أنت تنهى عن أن يقرن بين الحج والعمرة؟ قال عثمان: ذلك رأيي، فخرج علي مغضباً وهو يقول: لبيك اللهم لبيك بحجة وعمرة معاً. ويذكر المحقق أن البيهقي أخرج من حديث مروان بن الحكم أن علياً أهل بهما جميعاً حين رأى عثمان ينهى عن المتعة. {cite:muwatta-maruf-1997 p.452}"
  tr: "Hac ve Umre'yi birleştirmeye dair ilk hadis, Malik'in Cafer ibn Muhammed'den, onun babasından rivayet ettiğine göre, Mikdad ibn el-Esved, Sukya'da Ali ibn Ebu Talib'in yanına girdi. Ali ibn Ebu Talib, develeriyle un ve saman öğütüyordu. Mikdad, \"Bu, Hac ve Umre'yi birleştirmeyi yasaklayan Osman ibn Affan'dır\" dedi. Bunun üzerine Ali, ellerinde un ve saman izleriyle dışarı çıktı, Osman'ın yanına gitti ve \"Sen Hac ve Umre'yi birleştirmeyi mi yasaklıyorsun?\" dedi. Osman, \"Bu benim görüşüm\" dedi. Bunun üzerine Ali öfkeyle dışarı çıktı ve \"İşte buradayım, ey Allah'ım, işte buradayım, Hac ve Umre'yi birlikte yapıyorum\" dedi. Araştırmacı, el-Beyhaki'nin Mervan ibn el-Hakam'dan rivayet ettiği bir hadiste, Ali'nin Osman'ın Hac ve Umre'yi birleştirmeyi yasakladığını görünce her ikisi için de ihram haline girdiğini belirttiğini aktarıyor. {cite:muwatta-maruf-1997 s.452}"
  id: "Hadits pertama tentang menggabungkan haji dan umrah diriwayatkan oleh Malik dari Ja'far bin Muhammad, dari ayahnya, bahwa Miqdad bin al-Aswad menemui Ali bin Abi Talib di al-Suqya, ketika ia sedang menggiling tepung dan sekam dengan untanya. Ia berkata, \"Ini Utsman bin Affan yang melarang penggabungan haji dan umrah.\" Maka Ali keluar, dengan bekas tepung dan sekam di tangannya, dan menemui Utsman dan berkata, \"Engkau melarang penggabungan haji dan umrah?\" Utsman berkata, \"Itu pendapatku.\" Maka Ali keluar dengan marah, seraya berkata, \"Ya Allah, aku di sini, melaksanakan haji dan umrah bersama-sama.\" Peneliti menyebutkan bahwa al-Bayhaqi memasukkan dalam sebuah hadits dari Marwan bin al-Hakam bahwa Ali memasuki keadaan ihram untuk keduanya ketika ia melihat Utsman melarang penggabungan haji dan umrah. {mengutip:muwatta-maruf-1997 hal.452}"
