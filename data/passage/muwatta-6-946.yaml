label: { ar: "الموطأ 946 — المقداد بن الأسود دخل على علي بن أبي طالب بالسقيا وهو ينجع بكرات له، فقال: عثمان ينهى عن أن يقرن بين الحج والعمرة؛ فخرج علي مغضباً يقول: لبيك بحجة وعمرة معاً", en: "Muwatta 946" }
summary:
  ar: "أول حديث في باب القران في الحج. يرويه مالك عن جعفر بن محمد عن أبيه، أن المقداد بن الأسود دخل على علي بن أبي طالب بالسقيا، وهو ينجع بكراته دقيقاً وخبطاً، فقال: هذا عثمان بن عفان ينهى عن أن يقرن بين الحج والعمرة. فخرج علي وعلى يديه أثر الدقيق والخبط حتى دخل على عثمان فقال: أنت تنهى عن أن يقرن بين الحج والعمرة؟ قال عثمان: ذلك رأيي، فخرج علي مغضباً وهو يقول: لبيك اللهم لبيك بحجة وعمرة معاً. ويذكر المحقق أن البيهقي أخرج من حديث مروان بن الحكم أن علياً أهل بهما جميعاً حين رأى عثمان ينهى عن المتعة. {cite:muwatta-maruf-1997 p.452}"
