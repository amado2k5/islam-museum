text: "… أَحِلُّ إلا ما أَحلَّ اللّٰه في كتابه، ولا أُحرِّم إلا ما حرّم اللّٰه في كتابه. - عبد الرزاق عن ابن عيينة عن عمرو بن دينار أَنه سمع عبيد بن عمير يقول : أَحلّ اللّٰه حلاله، وحرّم حرامه، فما أَحلّ فهو …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 2371، يذكر الحلال، وما أُحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
