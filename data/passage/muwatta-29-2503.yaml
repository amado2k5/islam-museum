label: { ar: "الموطأ 2503 — مالك: لا إجماع على ثلث عقل النافذة، والاجتهاد للإمام", en: "Muwatta 2503", es: "Muwatta 2503", fr: "Muwatta 2503", ur: "موطا 2503", tr: "El-Muvatta 2503 — Malik: Veliahtın mirasındaki üçte bir pay konusunda görüş birliği yoktur ve İmam bağımsız hüküm verme yetkisine sahiptir.", id: "Al-Muwatta 2503 — Malik: Tidak ada konsensus mengenai sepertiga bagian warisan jendela, dan Imam memiliki wewenang untuk menjalankan penilaian independen." }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: كان ابن شهاب لا يرى ذلك. وأنا لا أرى في نافذة في عضو من الأعضاء في الجسد أمرا مجتمعا عليه، ولكني أرى فيه الاجتهاد، يجتهد الإمام في ذلك. {cite:muwatta-maruf-1997 p.429}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: İbn Şihab bu görüşü savunmuyordu. Vücudun herhangi bir yerinde pencere bulunması konusunda bir görüş birliği görmüyorum, ancak bunu ilmi yorum meselesi olarak görüyorum; imam bu konuda kendi hükmünü vermelidir. {cite:muwatta-maruf-1997 s.429}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Ibn Shihab tidak berpendapat demikian. Dan saya tidak melihat adanya konsensus mengenai jendela di bagian tubuh mana pun, tetapi saya melihatnya sebagai masalah penafsiran ulama; imam hendaknya menggunakan pertimbangannya sendiri dalam hal ini. {cite:muwatta-maruf-1997 p.429}"
