label: { ar: "الموطأ 2058 — مالك: السنة في المساقاة عندنا أنها تكون في أصل كل نخل أو كرم أو زيتون أو تين أو رمان أو فرسك، أو ما أشبه ذلك من الأصول، جائز لا بأس به، على أن لرب المال نصف الثمر من ذلك، أو ثلثه، أو ربعه، أو أكثر من ذلك أو أقل", en: "Muwatta 2058", es: "Muwatta 2058", fr: "Muwatta 2058", ur: "موطا 2058", tr: "Al-Muwatta 2058 — Malik: Bizim ekolümüzde ortakçılıkla ilgili sünnet, toprak sahibinin meyvenin yarısını, üçte birini, dörtte birini veya daha fazlasını ya da daha azını alması şartıyla, bunun caiz olduğu ve bunda bir sakınca bulunmadığı yönündedir.", id: "Al-Muwatta 2058 — Malik: Sunnah mengenai bagi hasil di mazhab kami adalah bahwa hal itu diperbolehkan dan tidak ada salahnya, asalkan pemilik lahan mendapat setengah dari hasil panen, atau sepertiga, atau seperempat, atau lebih atau kurang dari itu." }
summary:
  ar: "قال مالك: السنة في المساقاة عندنا أنها تكون في أصل كل نخل، أو كرم، أو زيتون، أو تين، أو رمان، أو فرسك، أو ما أشبه ذلك من الأصول، جائز لا بأس به، على أن لرب المال نصف الثمر من ذلك، أو ثلثه، أو ربعه، أو أكثر من ذلك، أو أقل. {cite:muwatta-maruf-1997 p.243}"
  tr: "Malik şöyle dedi: Bizim mezhebimizdeki ortakçılıkla ilgili sünnet, toprak sahibinin meyvenin yarısını, üçte birini, dörtte birini, daha fazlasını veya daha azını almasının caiz ve kabul edilebilir olduğudur. {cite:muwatta-maruf-1997 s.243}"
  id: "Malik berkata: Sunnah mengenai bagi hasil dalam mazhab kami adalah bahwa diperbolehkan dan dapat diterima bagi pemilik tanah untuk menerima setengah, sepertiga, seperempat, lebih, atau kurang dari hasil panen. {cite:muwatta-maruf-1997 p.243}"
