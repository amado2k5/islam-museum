label: { ar: "صحيح البخاري 1300 — القراء", en: "Sahih al-Bukhari 1300 — the readers", ur: "صحیح بخاری 1300 — قراء", es: "Sahih al-Bukhari 1300 — los lectores", fr: "Sahih al-Bukhari 1300 — les lecteurs", tr: "Sahih el-Buhari 1300 — Okuyucular", id: "Sahih al-Bukhari 1300 — Pembaca" }
text: "حَدَّثَنَا عَمْرُو بْنُ عَلِيٍّ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، حَدَّثَنَا عَاصِمٌ الأَحْوَلُ، عَنْ أَنَسٍ ـ قَالَ قَنَتَ رَسُولُ اللَّهِ شَهْرًا حِينَ قُتِلَ الْقُرَّاءُ، فَمَا رَأَيْتُ رَسُولَ اللَّهِ حَزِنَ حُزْنًا قَطُّ أَشَدَّ مِنْهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1300، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 1300 (Funerals (Al-Janaa'iz)), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 1300، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1300 (Funerales (Al-Janaa'iz)), menciona a los lectores. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un récit du Sahih al-Bukhari, n° 1300 (Funérailles), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran le répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "Sahih el-Buhari'de 1300 numaralı hadis, Kur'an okuyucularından bahsetmektedir. Bu derleme, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler hakkında bilgilerin yanı sıra Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine kitaplardan metinler içermektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1300, menyebutkan para pembaca Al-Quran. Koleksi ini menyusun informasi tentang bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
