label: { ar: "الموطأ 1365 — مالك: معنى من نذر أن يعصي الله فلا يعصه أن ينذر المشي إلى الشام أو مصر أو الربذة مما ليس لله فيه طاعة، فليس عليه شيء", en: "Muwatta 1365", es: "Muwatta 1365", fr: "Muwatta 1365", ur: "موطا 1365", tr: "El-Muvatta 1365 — Malik: Allah'a isyan etmeye yemin eden ama isyan etmeyen kimsenin anlamı şudur: Eğer Suriye'ye, Mısır'a veya Rabbeda'ya, yani Allah'a itaatin olmadığı yerlere yürümeye yemin ederse, hiçbir şey yapmakla yükümlü değildir.", id: "Al-Muwatta 1365 — Malik: Arti dari orang yang bersumpah untuk durhaka kepada Allah tetapi tidak durhaka adalah bahwa jika dia bersumpah untuk berjalan ke Suriah, Mesir, atau Al-Rabadha, di tempat-tempat di mana tidak ada ketaatan kepada Allah, maka dia tidak berkewajiban untuk melakukan apa pun." }
summary:
  ar: "يقول يحيى سمعت مالكا يقول معنى قول رسول الله من نذر أن يعصي الله فلا يعصه، أن ينذر الرجل أن يمشي إلى الشام، أو إلى مصر، أو إلى الربذة، أو ما أشبه ذلك، مما ليس لله بطاعة، إن كلم فلانا أو ما أشبه ذلك. فليس عليه في شيء من ذلك شيء إن هو كلمه، أو حنث بما حلف عليه، لأنه ليس لله في هذه الأشياء طاعة، وإنما يوفى لله بما له فيه طاعة. {cite:muwatta-maruf-1997 p.611}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Peygamberimizin, \"Kim Allah'a isyan etmeye yemin ederse, isyan etmesin\" sözünün anlamı şudur: Eğer bir kimse Suriye'ye, Mısır'a veya Rabbeda'ya veya benzeri bir yere gitmeye yemin ederse -ki bu Allah'a itaat sayılmaz- falanca kişiyle konuşursa veya yeminini bozarsa, bu konularda Allah'a itaat olmaz. Aksine, kişi ancak Allah'a itaat edilmesi gereken konularda yeminini yerine getirmelidir. {cite:muwatta-maruf-1997 s.611}"
  id: "Yahya berkata: Saya mendengar Malik berkata bahwa makna sabda Nabi, \"Barang siapa yang bernazar untuk durhaka kepada Allah, janganlah ia durhaka kepada-Nya,\" adalah bahwa jika seseorang bernazar untuk pergi ke Suriah, atau ke Mesir, atau ke al-Rabadha, atau sesuatu yang serupa—sesuatu yang bukan merupakan perbuatan taat kepada Allah—jika ia berbicara kepada si fulan atau sesuatu yang serupa, maka ia tidak berkewajiban untuk melakukan apa pun dalam hal itu jika ia berbicara kepadanya atau melanggar sumpahnya, karena tidak ada ketaatan kepada Allah dalam hal-hal tersebut. Sebaliknya, seseorang hanya perlu memenuhi nazarnya kepada Allah dalam hal-hal yang memang harus ditaati. {cite:muwatta-maruf-1997 p.611}"
