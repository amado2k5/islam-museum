label: { ar: "الموطأ 1365 — مالك: معنى من نذر أن يعصي الله فلا يعصه أن ينذر المشي إلى الشام أو مصر أو الربذة مما ليس لله فيه طاعة، فليس عليه شيء", en: "Muwatta 1365" }
summary:
  ar: "يقول يحيى سمعت مالكا يقول معنى قول رسول الله من نذر أن يعصي الله فلا يعصه، أن ينذر الرجل أن يمشي إلى الشام، أو إلى مصر، أو إلى الربذة، أو ما أشبه ذلك، مما ليس لله بطاعة، إن كلم فلانا أو ما أشبه ذلك. فليس عليه في شيء من ذلك شيء إن هو كلمه، أو حنث بما حلف عليه، لأنه ليس لله في هذه الأشياء طاعة، وإنما يوفى لله بما له فيه طاعة. {cite:muwatta-maruf-1997 p.611}"
