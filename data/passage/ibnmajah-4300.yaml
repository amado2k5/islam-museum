label:
  ar: "ابن ماجه 4300 — حديث البطاقة: تسعة وتسعون سجلا"
  en: "Ibn Majah 4300 — The hadith of the card: ninety-nine scrolls"
  ur: "ابن ماجہ 4300 — بطاقہ والی حدیث: ننانوے رجسٹر"
text: "يصاح برجل من أمتي يوم القيامة على رءوس الخلائق فينشر له تسعة وتسعون سجلا كل سجل مد البصر ثم يقول الله عز وجل هل تنكر من هذا شيئا فيقول لا يا رب فيقول أظلمتك كتبتي الحافظون ثم يقول ألك عذر …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4300: حديث البطاقة: تسعة وتسعون سجلا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4300: The hadith of the card: ninety-nine scrolls. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4300: بطاقہ والی حدیث: ننانوے رجسٹر۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
