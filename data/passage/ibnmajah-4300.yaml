label:
  ar: "ابن ماجه 4300 — حديث البطاقة: تسعة وتسعون سجلا"
  en: "Ibn Majah 4300 — The hadith of the card: ninety-nine scrolls"
  ur: "ابن ماجہ 4300 — بطاقہ والی حدیث: ننانوے رجسٹر"
  es: "Ibn Majah 4300 — El hadiz de la tarjeta: noventa y nueve rollos"
  fr: "Ibn Majah 4300 — Le hadith de la carte: quatre-vingt-dix-neuf rouleaux"
  tr: "İbn Majah 4300 — Kart Hadisi: Doksan Dokuz Kayıt"
  id: "Ibn Majah 4300 — Hadits kartu: sembilan puluh sembilan catatan"
text: "يصاح برجل من أمتي يوم القيامة على رءوس الخلائق فينشر له تسعة وتسعون سجلا كل سجل مد البصر ثم يقول الله عز وجل هل تنكر من هذا شيئا فيقول لا يا رب فيقول أظلمتك كتبتي الحافظون ثم يقول ألك عذر …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4300: حديث البطاقة: تسعة وتسعون سجلا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4300: The hadith of the card: ninety-nine scrolls. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4300: بطاقہ والی حدیث: ننانوے رجسٹر۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, núm. 4300: El hadiz de la carta: noventa y nueve pergaminos. El Profeta lo relata de su Señor; Hadith Qudsi Browser reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi dans Sunan Ibn Majah, non. 4300: Le hadith de la carte: quatre-vingt-dix-neuf rouleaux. Le Prophète le raconte de la part de son Seigneur; le navigateur Hadith Qudsi rassemble ses narrations à travers les six livres et le Muwatta."
  tr: "İbn Majah'ın Süneni'nde yer alan 4300 numaralı hadis-i kudsi şöyledir: Doksan dokuz tomar hadis. Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi, altı şeriat hadis külliyatında ve Muvatta'da rivayetlerini derlemiştir."
  id: "Hadits qudsi dalam Sunan Ibn Majah, no. 4300: Hadits tentang kartu: sembilan puluh sembilan gulungan. Diriwayatkan oleh Nabi atas otoritas Tuhannya, dan hadits qudsi mengumpulkan riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
