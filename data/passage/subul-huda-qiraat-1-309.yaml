  fr: "Extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 1, page 309, mentionnant la collection du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 1. cildinin 309. sayfasında, Kur'an'ın derlenmesi ve el yazmaları hakkında bilgi verilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Subul al-Huda wa al-Rashad\" karya Al-Salihi, Volume 1, halaman 309, menyebutkan kompilasi Al-Qur'an dan manuskripnya; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
