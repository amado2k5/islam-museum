label: { ar: "الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 641 — تعريف الإسلام بأعماله، الصلاة والزكاة والصوم والحج مجتمعة", en: "Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 641 — Islam defined by its acts; the prayer, the zakat, the fast and the pilgrimage named together", ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 641 — اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Al-Ibana al-Kubra de Ibn Batta, el Libro de la Fe, escaneo del volumen 1, pág. 641 — El Islam definido por sus actos; la oración, el zakat, el ayuno y la peregrinación mencionados juntos.", fr: "L'ouvrage d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), scan tome 1, p. 641 — L'islam est défini par ses actes; la prière, la zakat, le jeûne et le pèlerinage sont cités ensemble.", tr: "İbn Batta'nın \"El-İbana el-Kübra\" adlı eseri, İman Kitabı, Resimli Cilt 1, s. 641 — İslam'ı ibadetleri üzerinden tanımlar: namaz, zekât, oruç ve Hac bir arada.", id: "Al-Ibana al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid Bergambar 1, hlm. 641 — Mendefinisikan Islam melalui amalan-amalannya: salat, zakat, puasa, dan haji secara gabungan." }
text: "… بين يدي رسول اللّٰه وَيفي وركبته تمس ركبته، فقال: يا محمد أخبرني عن الإسلام، فقال رسول اللّٰه وَلِيةِ: تشهد أن لا إله إلا اللّٰه وأن محمداً رسول اللّه وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت إن استطعت إليه سبيلا. …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 641، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 641, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 641 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra de Ibn Batta, el Libro de la Fe, volumen 1, pág. 641, que menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat. Este extracto, extraído de la lectura automática y citado en un máximo de cuarenta palabras según la política de fuentes, se encuentra en la lista de Pillars and Branches of Faith Browser."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 1, page 641, qui mentionne l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage (mentionnés ensemble), ainsi que le témoignage. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1, s. 641) adlı eserinden bir alıntı; bu alıntı, namaz, zekât, oruç ve Hac gibi ibadetlerin yanı sıra iman ikrarı, namaz ve zekâtın tanımını da içermektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 1 Bergambar, hlm. 641, yang mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
