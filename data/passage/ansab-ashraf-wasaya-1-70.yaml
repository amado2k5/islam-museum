text: "… بسلمان، نوفل ؛ والذي بغزّة، هاشم ؛ والذي مات بمكة ودُفن بقرب الحجون، عبد شمس. وقال مطرود أيضاً : كانت قريش بيضةً فتفلّقت فالمحّ خالصه لعبد مناف فحدثني الوليد بن صالح، عن الواقدي، عن يزيد بن عياض، عن يزيد بن …"
summary:
