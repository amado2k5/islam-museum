text: "… جملته قباء أصفر قصير ورأس كميه بأسود فتبركت به - قال : ثم نقل من مدفنه بالقلعة إلى هذه القبة في يوم عاشوراء، وكان الحميس من سنة اثتين وتسعين وخمسمائة، ورتب عنده القراء ومن يخدم المكان. تم إن ولده الملك …"
