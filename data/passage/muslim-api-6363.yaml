label: { ar: "صحيح مسلم 6363 — ضحك وتبسم", en: "Sahih Muslim 6363 — laughter and smiling", ur: "صحیح مسلم 6363 — ہنسی اور تبسم", fr: "Sahih Muslim 6363 — rire et sourire", es: "Sahih Muslim 6363 — risa y sonrisa" }
text: "حَدَّثَنَا يَحْيَى بْنُ يَحْيَى، أَخْبَرَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنْ بَيَانٍ، عَنْ قَيْسِ بْنِ أَبِي، حَازِمٍ عَنْ جَرِيرِ بْنِ عَبْدِ اللَّهِ، ح وَحَدَّثَنِي عَبْدُ الْحَمِيدِ بْنُ بَيَانٍ، حَدَّثَنَا خَالِدٌ، عَنْ بَيَانٍ، قَالَ سَمِعْتُ قَيْسَ بْنَ أَبِي، حَازِمٍ يَقُولُ قَالَ جَرِيرُ بْنُ عَبْدِ اللَّهِ مَا حَجَبَنِي رَسُولُ اللَّهِ مُنْذُ أَسْلَمْتُ وَلاَ رَآنِي إِلاَّ ضَحِكَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6363، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih Muslim, no. 6363, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح مسلم کی حدیث نمبر 6363، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih Muslim, n° 6363, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih Muslim, n.º 6363, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
