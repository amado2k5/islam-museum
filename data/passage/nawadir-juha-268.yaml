text: "… سأبتاعها وأتجنب مضادة الشركاء أراد بيع نصف دار له فقال له الدلال: لماذا تعجل.. فالآن ليس وقت ذلك. فقال له الشيخ: أنا ما أحببت المال المشترك طول عمري، ولي عشر سنوات"
summary:
  ar: "أراد جحا بيع نصف بيته فقال السمسار أن ينتظر، فقال جحا إنه قضى عشر سنين يقنع شريكه ببيع حصته ليشتريها كلها ويتجنب منازعات الشراكة. {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  en: "Juha wants to sell half his house, and the broker tells him to wait. Juha says he has spent ten years persuading his partner to sell his share so that Juha can buy it all and avoid partnership disputes. {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  ur: "جحا اپنے گھر کا آدھا حصہ بیچنا چاہتا ہے تو دلال اسے انتظار کرنے کو کہتا ہے۔ جحا کہتا ہے کہ اس نے دس سال اپنے شریک کو اپنا حصہ بیچنے پر آمادہ کرنے میں گزارے ہیں تاکہ وہ سارا خود خرید لے اور شراکت کے جھگڑوں سے بچ جائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  fr: "Juha veut vendre la moitié de sa maison, et le courtier lui dit d'attendre. Juha dit qu'il a passé dix ans à persuader son associé de vendre sa part pour pouvoir tout acheter et éviter les querelles d'association. {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  es: "Juha quiere vender la mitad de su casa, y el corredor le dice que espere. Juha dice que ha pasado diez años persuadiendo a su socio de que venda su parte para poder comprarla toda y evitar las disputas de la sociedad. {cite:juha-nawadir-kubra-djuwaydi p. 129}"
