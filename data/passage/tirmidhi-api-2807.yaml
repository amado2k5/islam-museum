text: "… عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ مَرَّ رَجُلٌ وَعَلَيْهِ ثَوْبَانِ أَحْمَرَانِ فَسَلَّمَ عَلَى النَّبِيِّ فَلَمْ يَرُدَّ النَّبِيُّ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ. وَمَعْنَى هَذَا الْحَدِيثِ عِنْدَ أَهْلِ الْعِلْمِ أَنَّهُمْ كَرِهُوا لُبْسَ الْمُعَصْفَرِ وَرَأَوْا أَنَّ مَا صُبِغَ بِالْحُمْرَةِ بِالْمَدَرِ أَوْ غَيْرِ ذَلِكَ فَلاَ بَأْسَ بِهِ إِذَا لَمْ يَكُنْ مُعَصْفَرًا."
summary:
  ar: "حديث في جامع الترمذي، رقم 2807، يرد فيه ذكر ما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 2807 (Chapters on Manners), whose wording mentions what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 2807، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 2807, dont le texte mentionne ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 2807, cuyo texto menciona lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'nin 2807 numaralı hadisinde, caiz olan şeylerden bahsedilir. Farz ameller, görevler, ibadetler, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar hakkındaki kitabı derleyen yazar, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte, metinde yer alanları anlatır ancak buna dayanarak bir fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2807, menyebutkan apa yang diperbolehkan. Penyusun kitab tentang amalan wajib, kewajiban, ibadah, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
