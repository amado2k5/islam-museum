label: { ar: "الموطأ 2624 — بلغ مالكا دعاء: حسبي الله وكفى، ليس وراء الله مرمى", en: "Muwatta 2624", es: "Muwatta 2624", fr: "Muwatta 2624", ur: "موطا 2624", tr: "El-Muvatta 2624 — Malik şu duayı iletti: “Allah bana yeter, Allah'tan başka sığınacak yer yoktur.”", id: "Al-Muwatta 2624 — Malik menyampaikan doa: “Allah cukup bagiku, dan tidak ada tempat berlindung selain Allah.”" }
summary:
  ar: "حدثني يحيى عن مالك أنه بلغه أنه كان يُقال: الحمد لله الذي خلق كل شيء كما ينبغي، الذي لا يعجل شيء أناه وقدَّره، حسبي الله وكفى، سمع الله لمن دعا، ليس وراء الله مرمى. {cite:muwatta-maruf-1997 p.483} {cite:muwatta-maruf-1997 p.484}"
  tr: "Yahya, Malik'ten rivayetle bana şöyle bir söz işittiğini söyledi: “Her şeyi olması gerektiği gibi yaratan, takdir ettiği ve takdir ettiği hiçbir şeyi aceleye getirmeyen Allah'a hamd olsun. Allah bana yeter, O her şeye yeter. Allah kendisine dua edenleri işitir. Allah'tan başka sığınacak yer yoktur.” {cite:muwatta-maruf-1997 s.483} {cite:muwatta-maruf-1997 s.484}"
  id: "Yahya memberitahuku, berdasarkan riwayat Malik, bahwa ia pernah mendengar pepatah: “Segala puji bagi Allah yang menciptakan segala sesuatu sebagaimana mestinya, yang tidak mempercepat segala sesuatu yang telah Dia tetapkan dan perintahkan. Allah cukup bagiku, dan Dia Maha Cukup. Allah mendengar orang-orang yang memohon kepada-Nya. Tidak ada tempat berlindung selain Allah.” {cite:muwatta-maruf-1997 p.483} {cite:muwatta-maruf-1997 p.484}"
