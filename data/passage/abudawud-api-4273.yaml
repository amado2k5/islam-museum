label: { ar: "سنن أبي داود 4273 — إبدال السيئة حسنة", en: "Sunan Abi Dawud 4273 — a bad deed exchanged for a good one", ur: "سنن ابی داؤد 4273 — برائی کا نیکی سے بدل جانا", es: "Sunan Abi Dawud 4273 — una mala acción intercambiada por una buena", fr: "Sunan Abi Dawud 4273 — une mauvaise action échangée contre une bonne", tr: "Sunan Abi Davud 4273 — Kötü bir ameli iyi bir aleme çevirmek", id: "Sunan Abi Dawud 4273 — Mengganti perbuatan buruk dengan perbuatan baik" }
text: "… اللَّهِ إِلَهًا آخَرَ وَأَتَيْنَا الْفَوَاحِشَ. فَأَنْزَلَ اللَّهُ { إِلاَّ مَنْ تَابَ وَآمَنَ وَعَمِلَ عَمَلاً صَالِحًا فَأُولَئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ } فَهَذِهِ لأُولَئِكَ قَالَ وَأَمَّا الَّتِي فِي النِّسَاءِ { وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ } الآيَةُ قَالَ الرَّجُلُ إِذَا عَرَفَ شَرَائِعَ الإِسْلاَمِ ثُمَّ قَتَلَ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ لاَ تَوْبَةَ لَهُ. فَذَكَرْتُ هَذَا لِمُجَاهِدٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4273، يذكر إبدال السيئة حسنة. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 4273 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that speaks of a bad deed exchanged for a good one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 4273، جس میں برائی کا نیکی سے بدل جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4273 (Pruebas y batallas feroces (Kitab Al-Fitan Wa Al-Malahim)), que habla de una mala acción intercambiada por una buena. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 4273 (Épreuves et Combats acharnés (Kitab Al-Fitan Wa Al-Malahim)), évoque le rachat d'une bonne action pour une mauvaise. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent une action."
  tr: "Sunan Ebu Davud'da yer alan 4273 numaralı hadis, kötü bir amelin iyi bir amel ile değiştirilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4273, menyebutkan penggantian amal buruk dengan amal baik. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
