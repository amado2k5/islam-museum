label: { ar: "سنن أبي داود 4273 — إبدال السيئة حسنة", en: "Sunan Abi Dawud 4273 — a bad deed exchanged for a good one", ur: "سنن ابی داؤد 4273 — برائی کا نیکی سے بدل جانا" }
text: "… اللَّهِ إِلَهًا آخَرَ وَأَتَيْنَا الْفَوَاحِشَ. فَأَنْزَلَ اللَّهُ { إِلاَّ مَنْ تَابَ وَآمَنَ وَعَمِلَ عَمَلاً صَالِحًا فَأُولَئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ } فَهَذِهِ لأُولَئِكَ قَالَ وَأَمَّا الَّتِي فِي النِّسَاءِ { وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ } الآيَةُ قَالَ الرَّجُلُ إِذَا عَرَفَ شَرَائِعَ الإِسْلاَمِ ثُمَّ قَتَلَ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ لاَ تَوْبَةَ لَهُ. فَذَكَرْتُ هَذَا لِمُجَاهِدٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4273، يذكر إبدال السيئة حسنة. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 4273 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that speaks of a bad deed exchanged for a good one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 4273، جس میں برائی کا نیکی سے بدل جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
