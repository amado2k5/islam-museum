label: { ar: "صحيح مسلم 5749 — الحجامة، اللدود والسعوط", en: "Sahih Muslim 5749 — cupping; medicine given by the mouth-side or the nose", ur: "صحیح مسلم 5749 — حجامہ، لدود اور سعوط" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ سَعِيدِ بْنِ صَخْرٍ الدَّارِمِيُّ، حَدَّثَنَا حَبَّانُ بْنُ هِلاَلٍ، حَدَّثَنَا وُهَيْبٌ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ احْتَجَمَ وَأَعْطَى الْحَجَّامَ أَجْرَهُ وَاسْتَعَطَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5749، يذكر الحجامة، واللدود والسعوط. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5749 (The Book of Greetings), that mentions cupping, medicine given by the mouth-side or the nose. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5749، جس میں حجامہ، لدود اور سعوط کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
