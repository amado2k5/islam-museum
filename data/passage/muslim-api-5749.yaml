label: { ar: "صحيح مسلم 5749 — الحجامة، اللدود والسعوط", en: "Sahih Muslim 5749 — cupping; medicine given by the mouth-side or the nose", ur: "صحیح مسلم 5749 — حجامہ، لدود اور سعوط", es: "Sahih Muslim 5749 — ventosas; medicina administrada por la boca o la nariz", fr: "Sahih Muslim 5749 — ventouses; médecine administrée par voie buccale ou nasale", tr: "Sahih Muslim 5749 — Hacamat, ilaç verme ve enfiye kullanımı", id: "Sahih Muslim 5749 — Bekam, pemberian obat, dan tembakau kunyah" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ سَعِيدِ بْنِ صَخْرٍ الدَّارِمِيُّ، حَدَّثَنَا حَبَّانُ بْنُ هِلاَلٍ، حَدَّثَنَا وُهَيْبٌ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ احْتَجَمَ وَأَعْطَى الْحَجَّامَ أَجْرَهُ وَاسْتَعَطَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5749، يذكر الحجامة، واللدود والسعوط. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5749 (The Book of Greetings), that mentions cupping, medicine given by the mouth-side or the nose. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5749، جس میں حجامہ، لدود اور سعوط کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5749 (El Libro de los Saludos), menciona la ventosaterapia, una práctica que consiste en administrar medicamentos por vía oral o nasal. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5749 (Livre des salutations), mentionne la ventousothérapie, un traitement médical administré par voie buccale ou nasale. Le dictionnaire en ligne Medicine Browser le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5749 numaralı hadiste hacamat, ağızdan ilaç tedavisi ve burundan inhalasyondan bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemlerine dair metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5749, menyebutkan bekam, pengobatan oral, dan inhalasi nasal. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
