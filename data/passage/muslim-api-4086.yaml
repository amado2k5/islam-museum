label: { ar: "صحيح مسلم 4086 — ما لا بأس به", en: "Sahih Muslim 4086 — what is said to be no harm", ur: "صحیح مسلم 4086 — جس میں کوئی مضائقہ نہیں", fr: "Sahih Muslim 4086 — ce qui est dit sans inconvénient", es: "Sahih Muslim 4086 — lo que se dice que no tiene inconveniente" }
text: "… أَبِي، نَضْرَةَ قَالَ سَأَلْتُ ابْنَ عَبَّاسٍ عَنِ الصَّرْفِ، فَقَالَ أَيَدًا بِيَدٍ قُلْتُ نَعَمْ. قَالَ فَلاَ بَأْسَ بِهِ. فَأَخْبَرْتُ أَبَا سَعِيدٍ فَقُلْتُ إِنِّي سَأَلْتُ ابْنَ عَبَّاسٍ عَنِ الصَّرْفِ فَقَالَ أَيَدًا بِيَدٍ قُلْتُ نَعَمْ. قَالَ فَلاَ بَأْسَ بِهِ. قَالَ أَوَقَالَ ذَلِكَ إِنَّا سَنَكْتُبُ إِلَيْهِ فَلاَ يُفْتِيكُمُوهُ قَالَ فَوَاللَّهِ لَقَدْ جَاءَ بَعْضُ فِتْيَانِ رَسُولِ اللَّهِ بِتَمْرٍ فَأَنْكَرَهُ فَقَالَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4086، يرد فيه ذكر ما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 4086 (The Book of Musaqah), whose wording mentions what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 4086، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 4086, dont le texte mentionne ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 4086, cuyo texto menciona lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
