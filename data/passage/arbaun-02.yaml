label: { ar: "الأربعون 2 — حديث جبريل", en: "Arba'un 2 — the hadith of Jibril", es: "Arba'un 2 — el hadiz de Jibril", fr: "Arba'un 2 — le hadith de Jibril", ur: "اربعون 2 - حدیث جبریل" }
summary:
  ar: "حديث عمر بن الخطاب المشهور بحديث جبريل، وهو الحديث الثاني في الأربعين النووية وفي شرح ابن رجب؛ يسأل فيه رجل شديد بياض الثياب شديد سواد الشعر النبي عن الإسلام فيجيبه بأركانه الخمسة، ثم عن الإيمان فيجيبه بالتصديق بالله وملائكته وكتبه ورسله واليوم الآخر والقدر خيره وشره، ثم عن الإحسان فيجيبه أن يعبد الله كأنه يراه فإن لم يكن يراه فإنه يراه، ثم عن الساعة وأماراتها، ويخبر عمر في آخره أن السائل كان جبريل جاء يعلمهم دينهم؛ رواه مسلم (8) وتفرد به عن البخاري في الصحيحين، وأخرجه أيضاً أحمد ⁦(1/27 و28 و51 و52)⁩ وأبو داود (4695–4697) وابن ماجه (63) والترمذي (2610) وغيرهم؛ شرحه ابن رجب شرحاً موسعاً في حقائق الإسلام والإيمان والإحسان والساعة ⁦(جامع العلوم والحكم ص 70–120)⁩."
  en: "Umar ibn al-Khattab's famous hadith of Jibril, the second hadith of al-Nawawi's Forty and of Ibn Rajab's commentary: a man in strikingly white clothes asks the Prophet about islam and is answered with its five pillars, then about iman — assent to God, His angels, books, messengers, the Last Day and the decree, its good and its ill — then about ihsan — worshipping God as though you see Him, for He sees you — then about the Hour and its signs; Umar is told at the end that the questioner was Jibril come to teach them their religion. Transmitted by Muslim (8), who alone of the two Sahih collections includes it; also by Ahmad (1/27, 28, 51, 52), Abu Dawud (4695–4697), Ibn Majah (63), al-Tirmidhi (2610) and others; Ibn Rajab comments at length on the realities of islam, iman, ihsan and the Hour (Jami' al-Ulum wal-Hikam pp. 70–120)."
  es: "El famoso hadiz de Umar ibn al-Khattab sobre Jibril, el segundo hadiz de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab: un hombre con ropas sorprendentemente blancas pregunta al Profeta sobre el islam y se le responde con sus cinco pilares, luego sobre iman —asentimiento a Dios, Sus ángeles, libros, mensajeros, el Último Día y el decreto, su bien y su mal— luego sobre ihsan —adorar a Dios como si lo vieras, porque Él te ve— luego sobre la Hora y sus señales; a Umar se le dice al final que el que preguntó era Jibril que vino a enseñarles su religión. Transmitido por Muslim (8), quien es el único de las dos colecciones Sahih que lo incluye; también por Ahmad (1/27, 28, 51, 52), Abu Dawud (4695–4697), Ibn Majah (63), al-Tirmidhi (2610) y otros; Ibn Rajab comenta extensamente sobre las realidades del islam, el iman, el ihsan y la Hora (Jami' al-Ulum wal-Hikam, págs. 70-120)."
  fr: "Le célèbre hadith de Jibril rapporté par Umar ibn al-Khattab, le deuxième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, relate l'histoire d'un homme vêtu d'habits d'une blancheur éclatante qui interroge le Prophète sur l'islam. Il lui répond en évoquant ses cinq piliers, puis la foi (iman) – l'assentiment à Dieu, à Ses anges, aux Livres, aux messagers, au Jour dernier et au décret, ses aspects positifs et négatifs –, puis l'adoration de Dieu comme si on Le voyait, car Il nous voit – et enfin l'Heure et ses signes. À la fin, il est révélé à Umar que celui qui a posé la question était Jibril, venu leur enseigner leur religion. Ce hadith est rapporté par Muslim (8), qui est le seul des deux recueils authentiques à le mentionner; il est également rapporté par Ahmad (1/27, 28, 51, 52), Abu Dawud (4695-4697), Ibn Majah (63), al-Tirmidhi (2610) et d'autres. Ibn Rajab commente longuement les réalités de l'islam, de l'iman, de l'ihsan et de l'Heure (Jami' al-Ulum wal-Hikam pp. 70–120)."
  ur: "عمر بن الخطاب کی مشہور حدیث جبرائیل، نووی کی چالیس کی دوسری حدیث اور ابن رجب کی تفسیر میں ہے: ایک سفید کپڑوں میں ایک آدمی نے رسول اللہ سے اسلام کے بارے میں سوال کیا اور اس کا جواب اس کے پانچ ستونوں کے ساتھ دیا گیا، پھر ایمان کے بارے میں - خدا، اس کے فرشتوں، کتابوں، رسولوں اور اس کے دن کی خیر، اس کے بعد اس کی خیر و برکت کے بارے میں۔ احسان - خدا کی عبادت کرنا گویا تم اسے دیکھ رہے ہو، کیونکہ وہ تمہیں دیکھ رہا ہے - پھر قیامت اور اس کی نشانیوں کے بارے میں۔ آخر میں عمر سے کہا جاتا ہے کہ سائل جبریل کو ان کا دین سکھانے آئے تھے۔ مسلم (8) کی طرف سے نقل کیا گیا ہے، جس میں دو صحیح مجموعوں میں سے اکیلے اس میں شامل ہیں۔ نیز احمد ⁦(1/27، 28، 51، 52)⁩، ابوداؤد (4695-4697)، ابن ماجہ (63)، الترمذی (2610) اور دیگر؛ ابن رجب نے اسلام، ایمان، احسان اور قیامت کی حقیقتوں پر تفصیلی تبصرہ کیا ہے ⁦(جامع العلوم والحکم صفحہ 70-120)⁩۔"
