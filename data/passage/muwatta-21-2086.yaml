label: { ar: "الموطأ 2086 — مالك: لا تقطع شفعة الغائب غيبته، وإن طالت غيبته، وليس لذلك عندنا حد تقطع إليه الشفعة", en: "Muwatta 2086", es: "Muwatta 2086", fr: "Muwatta 2086", ur: "موطا 2086", tr: "Al-Muwatta 2086 — Malik: Bir kimsenin gıyabında ön alım hakkı, gıyabında kesintiye uğramaz, gıyabının süresi uzasa bile kesintiye uğramaz ve ön alım hakkının kesintiye uğrayacağı bir sınırımız yoktur.", id: "Al-Muwatta 2086 — Malik: Hak prioritas pembelian dari seseorang yang tidak hadir tidak terputus oleh ketidakhadirannya, meskipun ketidakhadirannya berkepanjangan, dan kami tidak menetapkan batasan sejauh mana hak prioritas pembelian tersebut terputus." }
summary:
  ar: "قال مالك: لا تقطع شفعة الغائب غيبته، وإن طالت غيبته، وليس لذلك عندنا حد تقطع إليه الشفعة. {cite:muwatta-maruf-1997 p.254}"
  tr: "Malik şöyle dedi: Yok olan bir kişinin ön alım hakkı, yokluğu uzun sürse bile kesintiye uğramaz ve ön alım hakkının kesintiye uğradığı süreye ilişkin bir sınırımız yoktur. {cite:muwatta-maruf-1997 s.254}"
  id: "Malik berkata: Hak prioritas pembelian bagi seseorang yang tidak hadir tidak terputus oleh ketidakhadirannya, bahkan jika ketidakhadirannya berkepanjangan, dan kita tidak memiliki batasan waktu setelah hak prioritas pembelian terputus. {cite:muwatta-maruf-1997 p.254}"
