text: "… ال. رسم المصحف سنة متبعة: نص الإمام مالك نحمات على أنه لا توضع المصاحف إلا علىٰ وضع كتابة الإمام، ورخص في ذلك غيره. هجران القرآن وعدم الإيمان به. أنزل القرآن علىٰ سبعة أحرف. المراد بالأحرف السبعة. القرآن كلام الله: القرآن …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 5561، يذكر الأحرف السبعة، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 5561, that mentions the seven ahruf, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 5561 کا اقتباس جس میں سبعہ احرف، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
