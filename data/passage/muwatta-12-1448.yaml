label: { ar: "الموطأ 1448 — مالك: الأمر عندنا في العقيقة أن من عق فإنما يعق عن ولده بشاة شاة، وليست العقيقة واجبة، ولا تعمل كالنسك والضحايا", en: "Muwatta 1448" }
text: "لَا يُمَسُّ الصَّبيُّ بِشَيْءٍ مِن دَمِهَا"
summary:
  ar: "يقول مالك الأمر عندنا في العقيقة أن من عق فإنما يعق عن ولده بشاة شاة، الذكور والإناث، وليست العقيقة بواجبة، ولكن يستحب العمل بها، وهي من الأمر الذي لم يزل عليه الناس عنده. فمن عق عن ولده فإنما هي بمنزلة النسك والضحايا، لا يجوز فيها عوراء ولا عجفاء ولا مكسورة ولا مريضة، ولا يباع من لحمها شيء ولا جلدها، وتكسر عظامها، ويأكل أهلها من لحمها ويتصدقون منها، ولا يمس الصبي بشيء من دمها. {cite:muwatta-maruf-1997 p.647}"
