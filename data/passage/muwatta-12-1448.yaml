label: { ar: "الموطأ 1448 — مالك: الأمر عندنا في العقيقة أن من عق فإنما يعق عن ولده بشاة شاة، وليست العقيقة واجبة، ولا تعمل كالنسك والضحايا", en: "Muwatta 1448", es: "Muwatta 1448", fr: "Muwatta 1448", ur: "موطا 1448", tr: "El-Muvatta 1448 — Malik: Akika konusunda bizim görüşümüz şudur ki, kim akikayı çocuğu adına tek bir koyunla keser ve akika farz değildir, ritüel kurbanlar ve diğer kurbanlar gibi de yapılmaz.", id: "Al-Muwatta 1448 — Malik: Masalah kami mengenai akikah adalah bahwa siapa pun yang melaksanakannya melakukannya untuk anaknya dengan satu ekor domba, dan akikah itu tidak wajib, dan tidak pula dilakukan seperti kurban ritual dan kurban lainnya." }
text: "لَا يُمَسُّ الصَّبيُّ بِشَيْءٍ مِن دَمِهَا"
summary:
  ar: "يقول مالك الأمر عندنا في العقيقة أن من عق فإنما يعق عن ولده بشاة شاة، الذكور والإناث، وليست العقيقة بواجبة، ولكن يستحب العمل بها، وهي من الأمر الذي لم يزل عليه الناس عنده. فمن عق عن ولده فإنما هي بمنزلة النسك والضحايا، لا يجوز فيها عوراء ولا عجفاء ولا مكسورة ولا مريضة، ولا يباع من لحمها شيء ولا جلدها، وتكسر عظامها، ويأكل أهلها من لحمها ويتصدقون منها، ولا يمس الصبي بشيء من دمها. {cite:muwatta-maruf-1997 p.647}"
  tr: "Bizim görüşümüze göre Malik el-Amr, akika (yeni doğan için kurban) konusunda, akika yapanın çocuğu için, ister erkek ister kız olsun, bir koyun kurban etmesi gerektiğini söyler. Akika farz değildir, ancak tavsiye edilir ve insanların her zaman uyguladığı bir gelenektir. Çocuğu için akika yapan kişi, kurban sunuları gibi yapar; tek gözlü, zayıf, kırık veya hasta bir hayvan kurban etmek caiz değildir. Etinden veya derisinden hiçbir şey satılamaz, kemikleri kırılabilir ve ailesi etinden yiyebilir ve bir kısmını sadaka olarak verebilir. Çocuğa kanına hiçbir şekilde dokunulmamalıdır. {cite:muwatta-maruf-1997 s.647}"
  id: "Menurut pandangan kami, Malik al-Amr mengatakan tentang aqiqah (kurban untuk bayi yang baru lahir), bahwa siapa pun yang melaksanakannya hendaknya mengorbankan seekor domba untuk anaknya, baik laki-laki maupun perempuan. Aqiqah tidak wajib, tetapi dianjurkan, dan merupakan praktik yang selalu diikuti orang-orang. Siapa pun yang melaksanakan aqiqah untuk anaknya melakukannya dengan cara yang sama seperti kurban; tidak diperbolehkan mengorbankan hewan yang bermata satu, kurus, cacat, atau sakit. Daging atau kulitnya tidak boleh dijual, tulangnya boleh dipatahkan, dan keluarganya boleh memakan dagingnya dan memberikan sebagian untuk sedekah. Anak tersebut tidak boleh terkena darahnya. {cite:muwatta-maruf-1997 p.647}"
