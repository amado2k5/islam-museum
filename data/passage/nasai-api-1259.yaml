label: { ar: "سنن النسائي 1259 — الأب والأبوة", en: "Sunan al-Nasa'i 1259 — the father and fatherhood", ur: "سنن نسائی 1259 — باپ اور والدیت" }
text: "أَخْبَرَنَا سُوَيْدُ بْنُ نَصْرٍ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ، عَنْ أَبِي بَكْرٍ النَّهْشَلِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الأَسْوَدِ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ صَلَّى إِحْدَى صَلاَتَىِ الْعَشِيِّ خَمْسًا فَقِيلَ لَهُ أَزِيدَ فِي الصَّلاَةِ فَقَالَ \" وَمَا ذَاكَ \". قَالُوا صَلَّيْتَ خَمْسًا. قَالَ \" إِنَّمَا أَنَا بَشَرٌ أَنْسَى كَمَا تَنْسَوْنَ وَأَذْكُرُ كَمَا تَذْكُرُونَ \". …"
summary:
  ar: "حديث في سنن النسائي، رقم 1259، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1259 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1259، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
