text: "… يَسَارٍ الْقُرَشِيِّ، عَنْ أَبِي هَاشِمٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ أُتِيَ بِمُخَنَّثٍ قَدْ خَضَبَ يَدَيْهِ وَرِجْلَيْهِ بِالْحِنَّاءِ فَقَالَ النَّبِيُّ \" مَا بَالُ هَذَا \". فَقِيلَ يَا رَسُولَ اللَّهِ يَتَشَبَّهُ بِالنِّسَاءِ. فَأُمِرَ بِهِ فَنُفِيَ إِلَى النَّقِيعِ فَقَالُوا يَا رَسُولَ اللَّهِ أَلاَ نَقْتُلُهُ فَقَالَ \" إِنِّي نُهِيتُ عَنْ قَتْلِ الْمُصَلِّينَ \". قَالَ أَبُو أُسَامَةَ وَالنَّقِيعُ نَاحِيَةٌ عَنِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4928، يذكر الحناء دواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4928 (General Behavior (Kitab Al-Adab)), that mentions henna as a remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4928، جس میں مہندی بطور دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
