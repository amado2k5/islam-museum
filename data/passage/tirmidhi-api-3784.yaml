label: { ar: "جامع الترمذي 3784 — تربية الأب ووصيته", en: "Jami' al-Tirmidhi 3784 — the father raising and counselling", ur: "جامع ترمذی 3784 — باپ کی تربیت اور نصیحت", es: "Jami' al-Tirmidhi 3784 — El padre que cría y aconseja", fr: "Jami' al-Tirmidhi 3784 — l'éducation et les conseils du père", tr: "Cami' el-Tirmizi 3784 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Jami' al-Tirmidhi 3784 — Didikan dan Wasiat Ayah" }
text: "… صَالِحٍ، عَنْ سَلَمَةَ بْنِ وَهْرَامَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ كَانَ رَسُولُ اللَّهِ حَامِلَ الْحَسَنِ بْنِ عَلِيٍّ عَلَى عَاتِقِهِ فَقَالَ رَجُلٌ نِعْمَ الْمَرْكَبُ رَكِبْتَ يَا غُلاَمُ. فَقَالَ النَّبِيُّ \" وَنِعْمَ الرَّاكِبُ هُوَ \". هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ. وَزَمْعَةُ بْنُ صَالِحٍ قَدْ ضَعَّفَهُ بَعْضُ أَهْلِ الْحَدِيثِ مِنْ قِبَلِ حِفْظِهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3784، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3784 (Chapters on Virtues), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3784، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3784 (Capítulos sobre las virtudes), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3784 (Chapitres sur les vertus), mentionne l'éducation et les conseils du père. Le site The Fatherhood in Islam Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Cami' el-Tirmizi'nin 3784 numaralı hadisinde babanın yetiştirilmesi ve öğütlerinden bahsedilir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3784, menyebutkan tentang didikan dan nasihat seorang ayah. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
