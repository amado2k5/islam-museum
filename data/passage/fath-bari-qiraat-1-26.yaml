text: "… تعالى : لَفِى زُيُرِ الْأَوَّلِينَ أي كتب الأولين واحدها زبور، وقال الكسائي: زبور بمعنى مزبور، تقول زبرته فهو مزبور مثل كتبته فهو مكتوب، وقرئ بضم أوله وهو جمع زبر. قلت: الضم قراءة حمزة. من طريق مجاهد مثله، قوله : أَوِّبِي …"
