text: "… هو الحال السادس : أن يكون الخبر ظاهرا فى شىء فيحمله الراوى من السحابة على غير ظاهره المقدر من الفعل وفاعله إما بصرف الافظ عن حقيقيه أو بأن يصرفه عن الوجوب إلى الندب أو عن التحريم إلى الكراهة وحرف النداء …"
summary:
  ar: "مقطع من إرشاد الفحول للشوكاني، ص 61، يرد فيه ذكر الوجوب، والكراهة، والتحريم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shawkani's Irshad al-Fuhul, p. 61, whose wording mentions obligation (wujub), dislike (karaha), forbidding (tahrim), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ارشاد الفحول، شوکانی، ص 61 کا اقتباس جس میں وجوب، کراہت، تحریم، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
