  tr: "El-Şavani'nin *İrshad el-Fuhul* adlı eserinin 61. sayfasından, farz, kınanabilirlik, yasak ve tavsiye konularını ele alan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, kınanabilir fiiller, yasak olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Irshad al-Fuhul* karya Al-Shawkani, halaman 61, yang menyebutkan kewajiban, perbuatan tercela, larangan, dan anjuran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan anjuran, perbuatan tercela, perbuatan terlarang, dan dosa-dosa kecil."
