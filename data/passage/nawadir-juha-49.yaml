text: "… الرعب يأتي بالعجائب طبخ يوماً أُوزةً وحملها لِيهديَها إلى تيمور لنك، ولما كان في الطريق تغلَّبَتْ عليهِ شهوتُهُ فأكلَ منها فَخْذاً ولَمَّا رأى السلطان أنها ناقصة قال للشيخ : وأين رجلُها؟ فقال الشيخ: إن جميع أُوز المدينة برجلٍ واحدة وفي …"
summary:
  ar: "قدّم جحا لتيمور لنك إوزة ينقصها رجل، وقال إن كل إوز البلدة له رجل واحدة، فرأى تيمور إوزة واقفة على رجل واحدة في بحيرة وأمر الموسيقيين بإخافتها فقفزت، فقال جحا إن الرعب يأتي بالعجائب وإن تيمور نفسه سيمشي على أربع. {cite:juha-nawadir-kubra-djuwaydi p. 30}"
  en: "Juha gives Timur Lenk a goose missing a leg, saying every goose in town has one leg; Timur sees a goose standing on one leg in a lake and orders musicians to frighten it, and the goose hops; Juha says terror brings wonders, and that Timur would walk on four legs too. {cite:juha-nawadir-kubra-djuwaydi p. 30}"
  ur: "جحا نے تیمور لنگ کو ایک ایسی قاز پیش کی جس کی ایک ٹانگ نہ تھی اور کہا کہ شہر کی ہر قاز کی ایک ہی ٹانگ ہوتی ہے؛ تیمور نے جھیل میں ایک قاز کو ایک ٹانگ پر کھڑا دیکھا اور سازندوں کو حکم دیا کہ اسے ڈرائیں، تو قاز اچھل پڑی؛ جحا نے کہا کہ خوف عجائب دکھاتا ہے، اور تیمور بھی چار ٹانگوں پر چلنے لگے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 30}"
  fr: "Juha offre à Timur Lenk une oie à qui il manque une patte, disant que toutes les oies de la ville n'en ont qu'une ; Timur voit une oie perchée sur une patte dans un lac et ordonne à des musiciens de l'effrayer, et l'oie saute ; Juha dit que la terreur fait des merveilles et que Timur marcherait lui aussi à quatre pattes. {cite:juha-nawadir-kubra-djuwaydi p. 30}"
  es: "Juha regala a Timur Lenk un ganso al que le falta una pata, diciendo que todos los gansos de la ciudad tienen una sola; Timur ve un ganso sobre una pata en un lago y ordena a unos músicos que lo asusten, y el ganso salta; Juha dice que el terror obra maravillas y que Timur también caminaría a cuatro patas. {cite:juha-nawadir-kubra-djuwaydi p. 30}"
  tr: "Juha, Timur Lenk'e bir bacağı eksik bir kaz hediye etti ve kasabadaki tüm kazların tek bacaklı olduğunu söyledi. Timur, gölde tek bacak üzerinde duran bir kaz gördü ve müzisyenlere onu korkutmalarını emretti; bunun üzerine kaz ayağa kalktı. Juha daha sonra korkunun mucizeler yarattığını ve Timur'un kendisinin de dört ayak üzerinde yürüyeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 30}"
  id: "Juha menghadiahkan Timur Lenk seekor angsa yang kehilangan satu kaki, dengan mengatakan bahwa semua angsa di kota itu hanya memiliki satu kaki. Timur melihat seekor angsa berdiri dengan satu kaki di sebuah danau dan memerintahkan para musisi untuk menakutinya, lalu angsa itu melompat. Juha kemudian berkata bahwa rasa takut mendatangkan keajaiban, dan bahwa Timur sendiri akan berjalan dengan keempat kakinya. {cite:juha-nawadir-kubra-djuwaydi p. 30}"
