text: "عظيمة (١)، (من ماء) تأكيد، وإلا فقد أفاده لفظ الذنوب فهو من باب كتبت بيدي، وفي رواية (سجلا) بفتح السين المهملة، وسكون الجيم، وهو بمعنى الذنوب (٢)، (فأهريق عليه) أصله فأريق عليه ثم أبدلت الهاء من الهمزة فصار [فهريق](٣) عليه"
