label: { ar: "صحيح مسلم 6554 — المرض والمريض، عيادة المريض", en: "Sahih Muslim 6554 — illness and the sick; visiting the sick", ur: "صحیح مسلم 6554 — بیماری اور بیمار، بیمار کی عیادت", es: "Sahih Muslim 6554 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sahih Muslim 6554 — La maladie et les malades; la visite aux malades", tr: "Sahih Muslim 6554 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sahih Muslim 6554 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "… حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا عَاصِمٌ الأَحْوَلُ، عَنْ عَبْدِ اللَّهِ بْنِ زَيْدٍ، - وَهُوَ أَبُو قِلاَبَةَ - عَنْ أَبِي الأَشْعَثِ الصَّنْعَانِيِّ، عَنْ أَبِي أَسْمَاءَ الرَّحَبِيِّ، عَنْ ثَوْبَانَ، مَوْلَى رَسُولِ اللَّهِ عَنْ رَسُولِ اللَّهِ قَالَ \" مَنْ عَادَ مَرِيضًا لَمْ يَزَلْ فِي خُرْفَةِ الْجَنَّةِ \". قِيلَ يَا رَسُولَ اللَّهِ وَمَا خُرْفَةُ الْجَنَّةِ قَالَ \" جَنَاهَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6554، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 6554 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 6554، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 6554 (El Libro de la Virtud, que ordena las buenas costumbres y fortalece los lazos de parentesco), menciona la enfermedad y a los enfermos, así como la visita a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 6554 (Le Livre de la Vertu, qui traite des bonnes mœurs et des liens de parenté), évoque la maladie, les malades et les visites aux malades. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 6554 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6554, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh seorang peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
