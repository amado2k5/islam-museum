label: { ar: "الموطأ 1710 — مالك: ذلك أحسن ما سمعت من أهل العلم، أن قول الحكمين يجوز بين الرجل وامرأته في الفرقة والاجتماع", en: "Muwatta 1710", es: "Muwatta 1710", fr: "Muwatta 1710", ur: "موطا 1710", tr: "El-Muvatta 1710 — Malik: Alimlerden duyduğum en iyi şey şudur ki, bir erkek ve karısı arasında ayrılık ve barışmada iki hakemin sözü geçerlidir.", id: "Al-Muwatta 1710 — Malik: Itulah pendapat terbaik yang pernah saya dengar dari para ulama, bahwa perkataan kedua penengah itu diperbolehkan antara seorang pria dan istrinya dalam hal perpisahan dan rujuk." }
summary:
  ar: "يقول مالك وذلك أحسن ما سمعت من أهل العلم، أن الحكمين يجوز قولهما بين الرجل وامرأته، في الفرقة والاجتماع. {cite:muwatta-maruf-1997 p.98}"
  tr: "Malik, (ve bu, âlimlerden duyduğum en iyi görüş) bir erkek ve karısı arasında ayrılık ve barışma konusunda iki hakemin sözünün geçerli olduğunu söylüyor. {cite:muwatta-maruf-1997 s.98}"
  id: "Malik mengatakan, dan ini adalah pendapat terbaik yang pernah saya dengar dari para ulama, bahwa keputusan dua penengah diperbolehkan antara seorang suami dan istrinya, mengenai perpisahan dan rujuk. {cite:muwatta-maruf-1997 p.98}"
