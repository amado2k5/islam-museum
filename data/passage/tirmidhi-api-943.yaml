text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا اللَّيْثُ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّهَا قَالَتْ ذَكَرْتُ لِرَسُولِ اللَّهِ أَنَّ صَفِيَّةَ بِنْتَ حُيَىٍّ حَاضَتْ فِي أَيَّامِ مِنًى. فَقَالَ \" أَحَابِسَتُنَا هِيَ \". قَالُوا إِنَّهَا قَدْ أَفَاضَتْ. فَقَالَ رَسُولُ اللَّهِ \" فَلاَ إِذًا \". قَالَ وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَابْنِ عَبَّاسٍ. قَالَ أَبُو عِيسَى حَدِيثُ عَائِشَةَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 943، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 943 (The Book on Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 943، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
