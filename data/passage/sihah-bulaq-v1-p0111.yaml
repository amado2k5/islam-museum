text: |-
  ٠٣٠٦
  العارض الثاب والضرس الذى يليه وقال بعضهم العارض مابين التنية الى الضرس واحتج
  بقول ابن مقبل *زئت مية أن ضاحكتها * فرأت عارض عود قد رم
  قال والنرم لا يكون الافى الثنايا وعارضته فى المسيرأى سرت حياله وعارضته بمثل ماصنع
  أى أندت الله بثل ما أتى وعارضت كابى بكاه أى قابلته وعارضت أى أخذت فى عروض
  وناحية والعوارض من الابل اللواتى يا كان العضاء وعوارض بضم العين جبل بيلادطي
  عليه قبرحاتم قال الشاعر .
  فلاً بغينكم قناوه وارضا * ولا قبلن الخبل لاية ضرغد
  أى بقنا وبع وارض وهماجبلان والتعريض خلاف التصريح بقال عرّضت لفلان وبفلان
  قوله وفى المثل قلت هو حديث
  مخرج عن عمران بن حصين
  جرفوع احمر
  ١ و لمهعلة اصح كمافى العباب
  اهم د
  اذا قلت قولا وأنت تعنيه ومنه المعار يصّ فى الكلام وهى التورية بالشءن الشى وفى المثل
  إنّ فى المعاريض لمندوحة عن الكذب اى سعة ويقال عرّض الكانب اذا كتب منيجا ولم يبين
  وأنشد الاصمعى للشماخ
  كاخط عبرانية بيمينه • بتيما حبرثم ءرض اسطرا
  وعرّضت فلانالكذا فتعرّض هوله وهورجل عرّيض مثال فسيق أى يتعرض للناس بالشر
  ويقال لحم معرّض للذى لم يبالغ فى النضج قال الشاعر س ليك بن السلك
  سيكفيك صرب القوم لحم معرض * وماءقدور فى القصاع مشيب
  يروى بالصاد والضاد ⁦(١)⁩ وتعريض الشئ جعله * ريضا والعراضة بالضم ما يعرضه المائرأى
  يطعمه من الميرة يقال عرّضونا أى أطعمونا من عراضتكم قال الشاعر ا لجليح رفيق المهاخ
  تقدمها كل عسلاة عليان * حراءمن معرّضات الغربان
  يقول ان هذه الناقة تتقسدم الابل فلايلقها الحادى وعليها ترفتقع عليها الغربان فتأ كل
  القرفكأنها قدء رضمن ويقال اشترء راضة لاهلك أى هدية وشيئا تحمله اليهم وهو
  بالفارسية راه آورد والمعراض أيضا العريض كالكبار للكبير وقال الساجع
  أرسل العراضات اثرا بقول أرسل الابل العريضات الانارونسب أنراعلى التمييزوقوس
  حراضة أى عر يضة قال أبو كبير
  وعراضة السيتين توبع يريها • تأوى طوائفه العجس عبهر
  ٢ ا عراض والعلاط فى العنق
  والمعرض نعم وسمه العراض ٢ ال الراجز حقيا عجيت يهمل المعرض تقول منه
  الاول عرضا والثانى طولا اه
  عرّضت الابل وته رضت لفلات أى تصديت له يقال تعرضت أسألهم وتعرض يمعنى تعوّج
  نقله م رعن ابن الرمانى فى شرح
  يقال تعرّض الج-ل فى الجبل اذا أخذ فى مسيره عمينا وشما لالصعوبة الطريق قال ذو البجادين
  كاب س اه وهو خلاف مافى
  وكأن دليل رسول اللّٰه صلى اللّٰه عليه وسلم بركوبة يخاطب ناقته
  تعرضى مدارجاوسومى * تعرض الجوزاء للنجوم * هذا أبوالقامم فاستفي
  القاموس والعصاح
  قال الاصمعى الجوزاء تمر على جنب وتعارض النيجوم معتارضة ليست بمستقيمة فى السماء
  قوله أى أسير بضم الهمزة وشد
  قال لبيد أورجع واشمة أسف نؤورها * كففاتعرض فوة،ن وشامها وكذلك قوله
  فاقطع لبانة من تعرض وصله * فلخير واصل خسلة صرامها أى تعوج
  والعروض الناقة التى لم ترض وأماقول الشاعر
  الياءا
  وروحة دنيا بين حيين رحتها • أسير عسيرا أوعروضا أروضها أسير أى أسير
  ويقال
