summary:
  ar: "قال مالك: فكل شيء من الذهب والورق والطعام كله، الذي لا ينبغي أن يباع إلا مثلا بمثل، فلا ينبغي أن يجعل مع الصنف الجيد منه المرغوب فيه، الشيء الرديء المسخوط، ليجاز بذلك البيع، وليستحل بذلك ما نهي عنه. وإذا أراد صاحب الطعام الرديء أن يبيعه بغيره، فليبعه على حدته، ولا يجعل مع ذلك شيئا، فلا بأس به إذا كان كذلك. {cite:muwatta-maruf-1997 p.165} {cite:muwatta-maruf-1997 p.166}"
