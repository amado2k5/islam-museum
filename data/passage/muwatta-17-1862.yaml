label: { ar: "الموطأ 1862 — مالك: كل شيء من الذهب والورق والطعام لا ينبغي أن يباع إلا مثلا بمثل، فلا يجعل مع الصنف الجيد شيء رديء ليجاز به البيع", en: "Muwatta 1862", es: "Muwatta 1862", fr: "Muwatta 1862", ur: "موطا 1862", tr: "El-Muvatta 1862 — Malik: Altın, gümüş veya yiyecek olsun, her şey ancak eşit miktarlarda satılmalıdır. Kaliteli bir mal, satışın caiz olması için kalitesiz bir şeyle karıştırılmamalıdır.", id: "Al-Muwatta 1862 — Malik: Segala sesuatu, baik emas, perak, atau makanan, hendaknya hanya dijual dalam jumlah yang sama. Barang berkualitas baik tidak boleh dicampur dengan barang berkualitas rendah agar penjualannya halal." }
summary:
  ar: "قال مالك: فكل شيء من الذهب والورق والطعام كله، الذي لا ينبغي أن يباع إلا مثلا بمثل، فلا ينبغي أن يجعل مع الصنف الجيد منه المرغوب فيه، الشيء الرديء المسخوط، ليجاز بذلك البيع، وليستحل بذلك ما نهي عنه. وإذا أراد صاحب الطعام الرديء أن يبيعه بغيره، فليبعه على حدته، ولا يجعل مع ذلك شيئا، فلا بأس به إذا كان كذلك. {cite:muwatta-maruf-1997 p.165} {cite:muwatta-maruf-1997 p.166}"
  tr: "Malik şöyle dedi: Altın, gümüş ve tüm yiyecekler de dahil olmak üzere, yalnızca eşit miktarlarda satılması gereken her şey, satışı meşrulaştırmak ve haram olanı helal kılmak için arzu edilen, daha düşük kaliteli bir şeyle karıştırılmamalıdır. Düşük kaliteli yiyeceğin sahibi onu başka bir şeyle takas etmek istiyorsa, başka bir şey eklemeden ayrı olarak satmalıdır. Bu şekilde yapılmasında bir sakınca yoktur. {cite:muwatta-maruf-1997 s.165} {cite:muwatta-maruf-1997 s.166}"
  id: "Malik berkata: Segala sesuatu—emas, perak, dan semua makanan—yang seharusnya hanya dijual dalam jumlah yang sama, tidak boleh dicampur dengan barang yang lebih berharga namun berkualitas rendah untuk melegitimasi penjualan dan menjadikan hal yang haram menjadi halal. Jika pemilik makanan berkualitas rendah ingin menjualnya untuk barang lain, ia harus menjualnya secara terpisah, tanpa menambahkan apa pun. Tidak ada yang salah dengan hal ini jika dilakukan dengan cara tersebut. {cite:muwatta-maruf-1997 p.165} {cite:muwatta-maruf-1997 p.166}"
