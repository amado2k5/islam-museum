label: { ar: "سنن النسائي 4956 — الأب والأبوة", en: "Sunan al-Nasa'i 4956 — the father and fatherhood", ur: "سنن نسائی 4956 — باپ اور والدیت" }
text: "أَخْبَرَنَا خَلاَّدُ بْنُ أَسْلَمَ، عَنْ عَبْدِ اللَّهِ بْنِ إِدْرِيسَ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ كَانَ ثَمَنُ الْمِجَنِّ عَلَى عَهْدِ رَسُولِ اللَّهِ عَشْرَةَ دَرَاهِمَ."
summary:
  ar: "حديث في سنن النسائي، رقم 4956، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4956 (The Book of Cutting off the Hand of the Thief), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4956، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
