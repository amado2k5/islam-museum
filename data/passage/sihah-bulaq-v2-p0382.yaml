  سمى باسم المطر المتدرّق والدلّ بالكسر الحية التى لا تنفع منها الرقيسة يقال ان الصل صفا
  اذا كانت منسكرة مثل الافعى ويقال للرجل اذا كان داهيا منكرا انه اصل" أصلال أى حية
  من الحيات وأصله فى الحميات شبه الرجل بها قال النابغة الذبيائ
  مادارزتنايه من حمة ذكر • نضناضة بالرزاياصل أصلال
  والصل أيضانيت قال الراجز* الصلّ والصفصل واليعفدا * والصليان بقلة وهو فعليان
  الواحدة صلميانة وبقال المرجل اذا أسرع الحلف ولم يتتعنع جذها جذ العير الصليانة وذلك
  أن العبرر بما اقتلع الصليانة من أصلها اذا ارتعاها والصلصل بالضم الفاختة والسلصل أيضا
  ناصية الفرص والصلصل أيضابقية الماء فى الاداوة وفى أسفل الغدير قال العجاج
  صلاصل الزيت الى الشطور • شبه أعينها حيث غارت بالجرارفيها الزيت الى أنصافها:
  والصلصال الطين الخر خلط بالرمل فصار يتصلصل إذاجف فاذاطبخ بالنارفهوالفضار عن أبى
  عبيدة وصاصلة اللجام صوته اذا ضوعف وتصلصل الحلى أى صوّت وصلّ اللحم يصل بالكسر
  صلولا أى أنتن مطبوخا كان أدنينا . قال الحطيئة
  ذالاقى يذل ذاقدره * لا يفسد اللحم لديه الصاول
  وأصلّ مثله وصلات اللحام أيضاشدد الكثرة وصلّ المسمار وغيره بصلّ صليلا أى صوت قال
  سده كل حرباء اذا أكزه صل * وطين صلال ومصلال أى يصون كمايصوّت الفخار الجديد وقال
