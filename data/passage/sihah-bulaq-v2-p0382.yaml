  والصعل الدقة قال الكميت • رهط من الهند فى أديهم صعل • فصل
  الصفصل بالكسرنيت قال الراجز
  - رعيتها أكرم عود عودا • الصلّ والصفصلّ والبعضيدا
  (لقل الصقل بالضم الخاصرة والصقلة مثله وقلماطالت صقنة فرس الاقصر جنباه وذلك
  عيب ويقال فرس صقلوين الصقل اذا كان طويل الصقلين وصقل السيف وسة له أيضا
  صقلاوصة الا أى جلاه فهوصاقل والبمع صقلة وقال ١ لم نعد أن أفرش عنها الصقله
  ١ ف نسخة زيادة الراجز وأول
  والصائع صيقل والجمع الصياقلة والصقيل السيف والمصقلة ما يصقل به اليف وغحوه
  البين
  ومصقلة بالفتح اسم رجل ويقال الفرس فى صقاله أى فى صوانه وصنعته قعل
  نعلوهم بقضب منتحله
  الصقعل على وزن السجل التمر اليابس ينقع فى اللبن الحيب حكاه أبو عبيد صال الصله
  الارض المابسة والصلة اخلديقال خف جمد الصلة وقدصلات اللحف والصلة أيضاواحدة
