text: |-
  ٥
  وبهوءااذا انست به قال الاصمعى فى كتاب الابل ناقة بماء بالفتح ممدود اذا كأنت قد أنست
  بالحالب وهو من جات به أى أنست به وأما البهاء من الحشن فهو من.هى الرحل غيرم هموز
  قال ابن السكيت ماجمات له وما يأهت له أى ما فطنت له
  صل التاء تأ جل تأتاءعلى فعلال وفيه تأتأة يتردّد فى التاءاذا تكام
  فى تفأ اذاغضب واحتد نأ تنأت بالبلد تنوء اقطنته والتانئ من ذلاك وهم تنساء
  البلد والاسم التناءة
  صل الناء ( ث تاً أتأت الابل اذا أرويتها قال الراجز
  انَك ان تتأنى النهالا • بمثل أن تدارك السجالا
  الاصمعى تأثأت عن القوم دفعت عنهم ولقيت فلانا فتشأثأت منه أى هبته أبو عمرو أثأته
  المصباح مثل غراب حب
  بسه-م لإثاءة رميته والكسائى مثله دأ) التندؤة للارجل بنزلة الثدى للمرأة وقال
  الرشاداه ولم أجد تعمين الرواية
  م الصغير فى حديث
  الاصمعى هى مغرز الندى وقال ابن السكيت هى اللحم الذى حول الندى اذا ضممت أولها
  همزت فسكون فعللة واذا قتحته لم تهمزفيكون فعلوة مثل قرنوة وعرقوة ⁦(نطأ )⁩. نطئنطأ
  لشرا الامترين من الشفاء الصعر
  حق⁦(ثفاً )⁩ الثفاء على مثال القرّاء الخردل (١ ويقال هو الحرف وهو فعال الواحدة
  والنقاهل الفاء مشددة على قول
  •كالجهرة أد
  ثفاءة ت اً) الكسائى تمأت القوم أطعمتهم الدسم وثمأت رأسهشدخته وتمأت المبزتردته
  الصحاح والناموس
  ن ل بجم ) ( ج ج  وجو الطائر والسفينة صدر هما والجمع الطاجن قال
  مخففة على قول المصباح قاله نصر
  الاموى جأجأت بالابل اذادعوتها لتشرب فقلت جئجى والاسم الجى مثال الجمع
  وأصله جبّيّ قلبت الهمزة الاولى ياء وأنشد
  وما كان على الجى * ولا الهى امتداحيكا ٢
  ٢ ال ابن برى وصوايه أن
  ⁦(جبأ)⁩ الجب واحد الجبأة وهى الحرمن الكماة مثاله فقع وفقعة وغرد وغردة
  يذكر فى جيأاه مناوى أى كماياتى
  وثلاثه أجبؤوأجبأت الارض أى كثرت كما تها وهى أرض مجبأة قال الاحرالجبأة هى
  هناك فى صفحة ٧ يتقديم
  التى الى الحمرة والكمأة هى التى الى الغبرة والسواد والفقعة البيض وبنات أوبر الصغاد
  الهى على الجى
  وأحبأت الزرع بعته قبل أن يبدوصلاحه وجاء فى الحديث بلاهمز من أجبى فقد أربى
  وأصله الهمز والحبأة مثال الجيهة القرزوم وهى الخشبة التى يحذ وعليها الحذاء قال الجعدى
  فى مرفقيه تقارب وله * بركة زور كجبأة الحزم
  وجبات عينى عن الشىء بت عنه وقال أيوز يد جبأت عن الرجل جبثا وجبو اخنست عنه
  وأنشد فهل أنا إلا مثل سيقة العدى * ان استقدمت غحروان جبأت عقبر
  والجبأ بضم الجيم ٣ الجبان قال الشاعر الشيبانى وهو معروف بن عمرو
  فا أنا من ريب المنون بجبأ • ولا أنا من سبب الاله بايس
  وجبأ عليه الاسود أى خرج عليه حية من حجزه ومنه الجابئ وهو الجراد رأ لجرءة
  مثال الجرعة الشجاعة وقديتركك همزه فيقال الجرة مثال الكرة كما قالو اللمرأة مرة.
  والجرى المقدام تقول منه جرؤالرجل جراءة بالمدّ وهو جوىء المفدم أى جرىء عند
  الاقدام وتقول جرّأنكء-لى فلان حتى اجترأت عليه ⁦(جزأ)⁩ الجزواحد الاجزاء
