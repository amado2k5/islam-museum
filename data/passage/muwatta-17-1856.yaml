label: { ar: "الموطأ 1856 — يحيى عن مالك عن ابن شهاب عن مالك بن أوس بن الحدثان: التمس صرفا بمائة دينار فدعاه طلحة بن عبيد الله فتراوضا، وقال حتى يأتيني خازني من الغابة، فقال عمر: والله لا تفارقه حتى تأخذ منه، وذكر قول النبي الذهب بالورق ربا إلا هاء وهاء", en: "Muwatta 1856" }
text: "الذَّهَبُ بالوَرِقِ رِبّا إلاَّا هَاءَ وهَاءَ"
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن مالك بن أوس بن الحدثان النصري أنه التمس صرفا بمائة دينار. قال: فدعاني طلحة بن عبيد الله، فتراوضنا حتى اصطرف مني، وأخذ الذهب يقلبها في يده، ثم قال: حتى يأتيني خازني من الغابة، وعمر بن الخطاب يسمع. فقال عمر: والله لا تفارقه حتى تأخذ منه. ثم قال: قال رسول الله: الذهب بالورق ربا إلا هاء وهاء، والبر بالبر ربا إلا هاء وهاء، والتمر بالتمر ربا إلا هاء وهاء، والشعير بالشعير ربا إلا هاء وهاء. ويذكر المحقق أن مالكا ومعمرا والليث وابن عيينة رووا عن الزهري: الذهب بالورق، ولم يقولوا الذهب بالذهب. {cite:muwatta-maruf-1997 p.162} {cite:muwatta-maruf-1997 p.163}"
