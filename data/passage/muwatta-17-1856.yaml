label: { ar: "الموطأ 1856 — يحيى عن مالك عن ابن شهاب عن مالك بن أوس بن الحدثان: التمس صرفا بمائة دينار فدعاه طلحة بن عبيد الله فتراوضا، وقال حتى يأتيني خازني من الغابة، فقال عمر: والله لا تفارقه حتى تأخذ منه، وذكر قول النبي الذهب بالورق ربا إلا هاء وهاء", en: "Muwatta 1856", es: "Muwatta 1856", fr: "Muwatta 1856", ur: "موطا 1856", tr: "El-Muvatta 1856 — Yahya, Malik'ten, o da İbn Şihab'tan, o da Malik ibn Evs ibn el-Hadathan'dan rivayetle: Yüz dinar takas etmek istedi, bunun üzerine Talha ibn Ubeyd Allah onu çağırdı ve pazarlık ettiler. \"Hazinecim el-Ghaba'dan bana gelene kadar bekleyin\" dedi. Ömer, \"Allah'a yemin ederim ki, ondan almadan onu yalnız bırakmayacaksın\" dedi. Peygamberimizin şu sözünü hatırlattı: \"Altınla gümüş takası, elden ele olmadıkça faizdir.\"", id: "Al-Muwatta 1856 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Malik ibn Aws ibn al-Hadathan: Ia ingin menukar seratus dinar, lalu Talha ibn Ubayd Allah memanggilnya dan mereka bernegosiasi. Ia berkata, “Tunggu sampai bendaharaku datang kepadaku dari al-Ghaba.” Umar berkata, “Demi Allah, engkau tidak akan meninggalkannya sebelum engkau mengambilnya darinya.” Ia menyebutkan sabda Nabi, “Emas ditukar dengan perak adalah riba kecuali jika dilakukan secara langsung.”" }
text: "الذَّهَبُ بالوَرِقِ رِبّا إلاَّا هَاءَ وهَاءَ"
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن مالك بن أوس بن الحدثان النصري أنه التمس صرفا بمائة دينار. قال: فدعاني طلحة بن عبيد الله، فتراوضنا حتى اصطرف مني، وأخذ الذهب يقلبها في يده، ثم قال: حتى يأتيني خازني من الغابة، وعمر بن الخطاب يسمع. فقال عمر: والله لا تفارقه حتى تأخذ منه. ثم قال: قال رسول الله: الذهب بالورق ربا إلا هاء وهاء، والبر بالبر ربا إلا هاء وهاء، والتمر بالتمر ربا إلا هاء وهاء، والشعير بالشعير ربا إلا هاء وهاء. ويذكر المحقق أن مالكا ومعمرا والليث وابن عيينة رووا عن الزهري: الذهب بالورق، ولم يقولوا الذهب بالذهب. {cite:muwatta-maruf-1997 p.162} {cite:muwatta-maruf-1997 p.163}"
  tr: "Yahya, Malik'ten, o da İbn Şihab'tan, o da Malik ibn Evs ibn el-Hadatan el-Nasri'den rivayet eder ki, yüz dinar takas etmek istedi. Şöyle dedi: \"Talha ibn Ubeyd Allah beni çağırdı ve pazarlık ettik, sonunda benimle takas etmeyi kabul etti. Altını aldı ve elinde çevirdi, sonra 'Hazinecim ormandan yanıma gelene kadar bekleyin' dedi. Ömer ibn el-Hattab da dinliyordu. Ömer, 'Allah'a yemin ederim ki, onu ondan alana kadar yanından ayrılmayacaksın' dedi.\" Sonra şöyle dedi: \"Allah'ın Resulü şöyle buyurdu: 'Altın karşılığında gümüş faizdir, elden ele verilmedikçe; buğday karşılığında buğday faizdir, elden ele verilmedikçe; hurma karşılığında hurma faizdir, elden ele verilmedikçe; arpa karşılığında arpa faizdir, elden ele verilmedikçe.'\" Araştırmacı, Malik, Ma'mar, el-Layth ve İbn Uyayna'nın el-Zuhri'den rivayetle \"Altın karşılığında gümüş\" dediklerini, \"Altın karşılığında altın\" demediklerini belirtiyor."
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, dari Malik ibn Aws ibn al-Hadathan al-Nasri, bahwa ia ingin menukar seratus dinar. Ia berkata: Talha ibn Ubayd Allah memanggilku, dan kami bernegosiasi sampai ia setuju untuk menukarnya denganku. Ia mengambil emas itu dan membolak-balikkannya di tangannya, lalu berkata: \"Tunggu sampai bendaharaku datang kepadaku dari hutan,\" sementara Umar ibn al-Khattab mendengarkan. Umar berkata: \"Demi Allah, engkau tidak akan meninggalkannya sampai engkau mengambilnya darinya.\" Kemudian dia berkata: \"Rasulullah SAW bersabda: 'Emas ditukar dengan perak adalah riba kecuali jika dilakukan secara langsung, gandum ditukar dengan gandum adalah riba kecuali jika dilakukan secara langsung, kurma ditukar dengan kurma adalah riba kecuali jika dilakukan secara langsung, dan jelai ditukar dengan jelai adalah riba kecuali jika dilakukan secara langsung.'\" Peneliti tersebut menyebutkan bahwa Malik, Ma'mar, al-Layth, dan Ibn Uyayna meriwayatkan dari al-Zuhri: \"Emas ditukar dengan perak,\" dan mereka tidak mengatakan \"Emas ditukar dengan emas.\""
