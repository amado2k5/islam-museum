text: "… ويوكل بجانب خيمته الخدم ثم لا يثق حتى يمضى الى خيم الفراشين فينام فيها ولقبه الراضى بالله الاخشيد لانه فرغانى وكان من ملك فرغانة يسمى الاخشيد كما تدعو الروم ملكها قيصر، والفرس كسرى، والمن تبع، والمسلمون الخليفة،و ملك اشر وسنة …"
