label: { ar: "سنن أبي داود 1649 — الأب والأبوة", en: "Sunan Abi Dawud 1649 — the father and fatherhood", ur: "سنن ابی داؤد 1649 — باپ اور والدیت", es: "Sunan Abi Dawud 1649 — El padre y la paternidad" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا عَبِيدَةُ بْنُ حُمَيْدٍ التَّيْمِيُّ، حَدَّثَنِي أَبُو الزَّعْرَاءِ، عَنْ أَبِي الأَحْوَصِ، عَنْ أَبِيهِ، مَالِكِ بْنِ نَضْلَةَ قَالَ قَالَ رَسُولُ اللَّهِ \" الأَيْدِي ثَلاَثَةٌ فَيَدُ اللَّهِ الْعُلْيَا وَيَدُ الْمُعْطِي الَّتِي تَلِيهَا وَيَدُ السَّائِلِ السُّفْلَى فَأَعْطِ الْفَضْلَ وَلاَ تَعْجِزْ عَنْ نَفْسِكَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1649، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1649 (Zakat (Kitab Al-Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1649، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1649 (Zakat (Kitab Al-Zakat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
