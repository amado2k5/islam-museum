text: "… مرة بن شراحيل، عن عبد اللّٰه بن مسعود، قال : لما ثقل رسول اللّٰه ولي إجتمعنا في بيت أمِّنَا عائشة، قال : فنظر إلينا رسول اللّٰه لفي فدمعت عيناه، ثم قال لنا : قددنا الفراق. ونعى الينا نفسه، ثم قال …"
summary:
