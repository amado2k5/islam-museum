  id: "Cuplikan dari Tanda-Tanda Kenabian, Jilid Bergambar 1, halaman 3358, berisi pidato penghormatan dan pengumuman kematian; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan pidato penghormatan paling terkenal."
