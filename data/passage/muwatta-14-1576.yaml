label: { ar: "الموطأ 1576 — أبو الزبير المكي: خطب رجل إلى رجل أخته، فذكر أنها قد أحدثت، فبلغ عمر بن الخطاب فضربه أو كاد، ثم قال ما لك وللخبر", en: "Muwatta 1576", es: "Muwatta 1576", fr: "Muwatta 1576", ur: "موطا 1576", tr: "El-Muvatta 1576 — Ebu el-Zübeyr el-Mekki: Bir adam başka bir adamın kız kardeşine nikah teklif etti ve kızın zina yaptığı söylendi. Bu haber Ömer ibn el-Hattab'ın kulağına gitti. Ömer adama vurdu ya da neredeyse vurdu, sonra da \"Bu haber seni neden ilgilendiriyor?\" dedi.", id: "Al-Muwatta 1576 — Abu al-Zubayr al-Makki: Seorang pria melamar saudara perempuan pria lain, dan tersiar kabar bahwa wanita itu telah berzina. Kabar ini sampai kepada Umar ibn al-Khattab, yang kemudian memukulnya atau hampir memukulnya, lalu berkata, \"Apa urusanmu dengan berita ini?\"" }
summary:
  ar: "يروي مالك عن أبي الزبير المكي أن رجلا خطب إلى رجل أخته، فذكر أنها قد كانت أحدثت، فبلغ ذلك عمر بن الخطاب، فضربه أو كاد، ثم قال مالك وللخبر. {cite:muwatta-maruf-1997 p.57}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den rivayetle, bir adamın başka bir adamın kız kardeşine nikah teklif ettiğini ve kızın zina yaptığının söylendiğini aktarır. Bu haber Ömer ibn el-Hattab'a ulaşmış ve Ömer adama vurmuş ya da neredeyse vurmuştur. Bunun üzerine Malik, \"İşte haber!\" demiştir. {cite:muwatta-maruf-1997 s.57}"
  id: "Malik meriwayatkan dari Abu al-Zubayr al-Makki bahwa seorang pria melamar saudara perempuan pria lain, dan disebutkan bahwa wanita itu telah berzina. Hal ini sampai kepada Umar ibn al-Khattab, yang memukulnya atau hampir memukulnya. Kemudian Malik berkata, \"Dan untuk beritanya.\" {cite:muwatta-maruf-1997 p.57}"
