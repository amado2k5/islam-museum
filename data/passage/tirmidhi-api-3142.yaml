text: "… وَصِنْفًا عَلَى وُجُوهِهِمْ \". قِيلَ يَا رَسُولَ اللَّهِ وَكَيْفَ يَمْشُونَ عَلَى وُجُوهِهِمْ قَالَ \" إِنَّ الَّذِي أَمْشَاهُمْ عَلَى أَقْدَامِهِمْ قَادِرٌ عَلَى أَنْ يُمْشِيَهُمْ عَلَى وُجُوهِهِمْ أَمَا إِنَّهُمْ يَتَّقُونَ بِوُجُوهِهِمْ كُلَّ حَدَبٍ وَشَوْكٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَقَدْ رَوَى وُهَيْبٌ عَنِ ابْنِ طَاوُسٍ عَنْ أَبِيهِ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ شَيْئًا مِنْ هَذَا."
summary:
  ar: "حديث في جامع الترمذي، رقم 3142، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3142 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3142، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
