text: "في شَرْح اصُولِ اعْتَقَادِ أَهْلِ السُسِنَةِ اسْتَوَىٰ طه: قال: الاستواءُ معقولٌ، والكَيفُ مجهولٌ، والإيمانُ به واجبٌ. وعن نُعيم بنِ حمَّادٍ قال: حقٌّ على كلِّ مؤمن أنْ يؤمنِ بجميعٍ ما وصفَ الله به نَفْسَه، ويتركَ التفكُّرَ في الربِّ - تبارك وتَعالى …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 151، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 151, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 151 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volume numérisé 3, p. 151, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen digitalizado 3, p. 151, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), un derecho debido por cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
