text: |-
  *⁦(باب اليم)⁩*
  *⁦(جرم)⁩•
  ٢٩٩
  بكفت له أخرى فأصبح أجسذما* وابمع جذمى مثل حتى ونوكى والانجذام الانقطاع قال
  النابغة• وأمسى حبلها افجذما* والجذام داء وقد حذم الرجل بضم الجيم فه ومجذوم
  ولا يقال أجذم وجذام قبيلة من اليمن تنزل بجبال جسمى تزعم نساب مضر أنهم من معدّ
  قال الكميث يذكرانتة الهم الى اليمن ينسبهم
  نعامجذا ماغيرموت ولاقتل * ولكن فراقاللدعائم والاصل
  والجذامة من الزرع مابقى بعد الحصد وجديمة قبيلة من عبد القيس ينسب اليهم جذمى
  بالتحريك وكذلك الى جذيمة أسد قال سيبويه وحدثى من أثق به أنّ بعضهم يقول فى بن
  حذيمة جد مى بضم الجيم قال أبوزيداذا قال سيبوبه حدثى من أثقبه فانما يعنين ورجل
  مجذامة أى سريع القطع لذمودّة وأحذم البعير فى سيره أى أسرع والاجذام الاقلاع عن
  الشى قال الربيع بن زياد
  وحزق قيس علىّ البلاد-تى اذا اضطر مت أجدما.
  وحذيمة الابرش ملك الحيرة صاحب الزباء وهو جذيمة بن مالك بن فه-م بن دوص من الازد
  € ججوم) الجرم الذنب والجريمة مثله تقول منسه جوم وأجرم واجترم بمعني والجرم الحتر
  فارسى معترب والجروم من البلاد خلاف الصرود وجرم بطنان من العرب أحدهمافى
  قضاعة وهو جرم بن زيان والآخر فى طي وبنوجارم قوم من العرب وقال
  والجارمى عميسدها• والجرم القطع وقدجرم النخل واجترمه أى صرمه فهو جارم وقوم
  جزم وجرام وهذازمن الجرام والجرام وجرمت صوف الشاة أى جززئه وقدبرمت منه
  اذا أخذت منه مثل جلت والجرم بالكسر الجسد والجرم الاون والجرم الصوت حكاه ابن
  السكيت وغيره وقال أبوحاتم قدأواعت العاقة بقولهم فلان صافى الجرم أى الصوت
  أو الحلق وهو خطأ والجرمة القوم الذين يجترمون النخسل أى يصرمون قال امر والقيس
  علوت بانطاكية فوق عقمة • كرمة نخل أو كنة يترب
  وجرم يجرم أى كسب وفلان جريمة أهله أى كاسبهم وقال أبو خراش
  بريمة ناهض فى رأس نيق • ترى لعظام ما جمعت صليبا
  وقوله تعالى ولا يجرمنكم شنان قوم أى لا يحملنسكم ويقال لا يكسبنكم والجرامة بالضم
  ماسقط من التمراذاجرم والجريم التمر المصروم وحكى أبو عمر والجرام بالفتح واجريم النوى
  قال وهما ايضا التمر اليسابس ذكره ابن السكيت فى باب فعيل وفعالمثل شحاح وشحيح وكهام
  وكهيم وبجال وبجيل ومحاح الاديم وصحيح وأمًا الجرام بالكسرفه وجمع جريم مثل كريم وكرام
  ويقال جلة جريم أى عظام الاجرام والجلة الابل المسان وحول مجرّم وسنة مجرّمة أى تاقة
  وتجرمت السنون أى انقضت وتجزم الليل ذهب وقول لبيد* دمن تجزم بعد عهد أنيسها
  أى تكمل وتجترم علىّ فلان أى ادّعى ذنبا لم أفعله قال الشاعر
  تعد على الذنب ان ظفرت به * وان لا تجددنبا على تجرم
  وقولهم لاجرم قال الفراء هى كلمة كانت فى الاصل بنزلة لا بدولا محسالة فجرت على ذلك وكثرت
  حتى تحزات الى معنى القسم وصارت بنزلة حقافلذلك يجاب عنه باللام كما يجاب بم اعدن
  ٠٦٨
  صاح .
  قوله ولا يقال أجدم فى القاموس
  جذم كعى فهو مجذوم ومجدم
  وأجذم ووهم الجوهرى فى منعه
  فى نسحخة بعد البيت زيادة وجذية
  ابن ربيعة بن مازن بن قطيعة بن
  عدس
