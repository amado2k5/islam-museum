text: "… الأحياء. قال : إِنَّ الذّبابة إِذا أرادتْ أن تموت ذهبتْ إِلى بعض الخرِبات، قلت: فإنَّا قد دخلنا كلَّ خَرِبةٍ في الدُّنْيا، مَا رأينَا فيها قط ذبابًا ميّتاً. - نوادر للمَكِي وكان المكّيّ طيّبًا طيّب الحُجَجِ، ظَرِيفَ الحِيَل، عجيبَ العلل وكان …"
