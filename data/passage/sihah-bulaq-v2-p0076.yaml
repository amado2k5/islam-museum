text: |-
  •باب الواودالياء
  ٥١١
  سمى الجر الطلاء يريد بذلك تحسين اسمه الا أنها الطلام بعينها. قال عبيد بن الابرص للمنذر
  ابن ماء السماء حين أرادقتله
  وقالواهى الجرتكنى الطلاء * كما الذئب يكنى أباجعده
  ضربه مثلا أى تظهر لى الاكرام وأنت تريد قتلى كما أنّ الذئب وان كانت كنيته حسفة فان عمله
  ليس بحسن وكذلك الجروان سميت ط-لاء وحسن اسمهافات عملها قبيح والطلاء أيضا
  القطران وكل ماطليت به والطلاء الحبل الذى تشدبه رجل الطلا الى وتدوطليته بالدهن
  وغ_يره طليا وتطليت به واطلبت به على افتعات وطليت فلاناتطلية اذامرضته والط-لاء
  مثال المكاء الدم حسكاه أبو عييد والمطلاء على مفعال الارض السهلة اللينة تنبت العضاه
  ويقال المطالى المواضع التى تغذوفيها الوحش أطلاءها ⁦(طعا)⁩ طما الماهيطعوطموا
  ويطمى طميا فهو طام اذا ارتفع وملا النهر ومنه طمت المرأة بزوجها اذا ارتفعت به وطمى
  يطعى مثل طمّ يطم اذامر مسرعا ⁦(طق)⁩ الطى لزوق الطحال بالجنب من شدة العطش
  نقول منه طنى البعبر بالسكسريطى طى وبعيرطن وطنيته تطنية اذا عالجته من الطنى وقال
  أكويه اما أراد المكىّ معترضا • كى المطنى من النحز العانى الطملا
  ابن السكيت هذه حية لا تطنى أى لا يعيش صاحبها تقتل من ساعتها وأصله الهمزود ذكرناه
  فى باب الهمز ⁦(طوا)⁩ طويت الشئ طيافانطوى والطية منه مثل الجلسة والركبة
  ومنه قول ذى الرمة * كما تنشر بعد الطية الكتب* والطوى الجوع يقال طوى بالكسر
  يطوى طوى فهو طاووطيان وطوى بالفتح يطوى طيا اذا تعمد ذلك وفلان طوى كشحه اذا
  أعرض بوذّه وهذارجل طوى البطن على فعل أى ضامر البطن عن ابن السكيت قال
  العجبر السلولي
  نطوّت الحيسة آى حموّت والطمة النمة قال الخديل الطمة تكون منزلا وتكون منتأى تقوا
  منه مضى لطمته أى لنيته التى انتواها وبعدت عناطيته وهو المنزل الذى انتواه ومنى لطيقه
  وطية بعيدة أى شاسعة وطوى اسم موضع بالشأم تكسرطاؤه وتضم بصرف ولا يصرف فن
  صرفه جعله اسم وادومكان وجعله نسكرة ومن لم يصرفه جعله بلدة وبقعة وجعله معرفة وقال
  بعضهم طوى مثل طوى وهو الشئ المدنى وقال فى قوله تعالى بالوادى المقدس طوى طوى
  مرّتين أى قدس وقال الحسن ثنيت فيه البركة والتة_ديس مرتين وذوطوى بالضم موضع
  بمكة والطوية المضمير والطوىّ البئر المطوية والطاية السطح ومربد التمر وأطواه الناقة طرائق
  نهمها ( ها الطهوطبخ اللحم وفى الحديث فاطهوى اذن أى فاعلى ان لم أحكم
  ذلك يقال مسمطهاه بطهوه ويماهاه طهواوطهيا وطها الرجل ذهب فى الارض مثل ظما
  قال الشاءر طهاهذريان قل تغميض عينه • على دبة مثل الخذيف المرعيل
  وكذلك طهت الابل اذا ذهبت نادة ى الارض وقال الاعشى
  فلسن الباغى المهملات بقرفة * اذا ماطها بالليل منتشراتها
  ويبعد أن يقال انه من ماط يمبط والطاهى الطباخ والطهاء مد ودلغة فى الطخاء وهو السحداب
