text: |-
  ⁦(فصل الكاف)⁩ *
  • كوق)•
  ٥٧
  اذارامقته من معدعمارة * بدا والعيون المستكفة تلمج
  وكفكفت الرجل مثل كففته ومنه قول أبى زبيد
  ألم ترتى سكنت الى لا لكم * وكفكفت عنكم أكلبى وهى عقر
  وقول الشاعر
  نجوس عمارة ونكف أخرى * لناحتى بجاوزهادليل
  يقول نطأقبيلة وتتحللهاونسكف أخرى أى تأخذ فى كفتها وهى ناحيتها ثم ندعها ونحن
  نقدر عليها كلف السكاف شئ يعلو الوجه كالسمسم والسكلف لون بين الواد والحمرة
  وهى حرة كدرة تعاو الوجه والاسم الكلفة والرجل أكاف ويقال كيت أكاف للذى كافت
  حرته فلم تصف ويرى فى أطراف شرمسواد الى الاحتراق ماهو وقال الاصعىّ اذا كان
  البعير شديد الحرة يخاط حرته -وادايس يخالص فتلك السكلفة والبعيرأ كاف والناقة كافاه
  ويقال كانت بهذا الامرأى أولعت به وكافه تسكليفا أى أمره بمايشق عليه وتكلفت الشئ
  تحشحته والكلفة ما تتكافه من نائبسة أو حق والمتكلف العرّيض لمالا يعنيه ويقال سات
  الشى تكلفة اذالم تطقه الاتكلفا وهو تفعلة ( كنف كنفت الذأ كنفه أى حطته
  وصنته وأكنفته أى أعنته والمكانفة المعاونة والكنف بالتحريك الجانب وكنفا
  الطائرجناحاه وكنفة الابل ناحيتها قال أبو عبيدة يقال ناقة كنوف تبرد فى كنفة الابل
  مثل القذور الاانم الاتستبعد كماتتبعد القذور وحكى أبو زيدشاة كنفاء أى حدياء
  وتكنفوه وا كتنفوه أى أحاطوابه والتكنيف مشله بقال صلاء مكنف أى أحط به من
  جوانيه والسكنف بالكسروعاء تكون فيه اداة الراعى ويتصغيره جاء الحديث كنيف ملئ
  علما والسكنيف الساترويسمى الترس كنيفالانه يستر ومنه قيل للمذهب كنيف والكنيف
  حظيرة من شجر تجعل للابل يقال منه كنفت الابل أكنف وأكنف وا كتنف القوم
  اذا اتخذوا كنيفالا بلهم عن يعقوب وكنفت عن الشئ أى عدلت ومنه قول القطامى
  أصالوا وصلنا واتقونابماكر • ليعلم مافينا عن البيع كانف
  كوف . الكوفة الرملة الحراء وبها سميت السكوفة وكوفان أيضااسم للكوفة وكوفت
  تكو يفا اذاصرت الى الكوفة عن يعقوب وانه افى كوفان أى فى حرزومنعة ويقال
  تركهم فى كوفان أى فى أمرّ مستدير ويقال فى عناء رمشقة ودوران وتكوّف الرمل والقوم
  أى استداروا وتسكوّف الرجل أى تشبه بأهل الكوفة أو تنسب البهم والكاف حوف
  يذكرويونث وكذلك ساترحروف الهجاء قال الشاعر
  أشاقتك أطلال تعفت رسومها • كابينت كاف تاوح وميها
  والكاف حرف جروهى للتشبيه وقد تقع موقع اسم فيدخل عليها حرف الجرّكما قال
  صف فرسا
  ورحنا بكابن الماءيجنب وسطنا • تصوّب فيه العين طوراوترتق
  وقد تكون ضمير المخاطب المجرور والمنصوب كة ولك غلامك وضُربك تشخ للمذ كروتكسر
  للمؤنث للفرق وق_د تكون للخطاب ولام وضع له امن الاعراب كقولك ذاك وتلك وأ وامك!
  قوله وبتصغيره باء الحديث الخ
  فى القاموس وكنيف لق ب ابن
  مسعوداقبه عمرتشيهابوءاء
  الراعى أه كتبه مصحمة
