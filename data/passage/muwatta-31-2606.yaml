label: { ar: "الموطأ 2606 — عمر بن عبد العزيز: آخر ما تكلم به النبي لعنة اليهود والنصارى ولا يبقى دينان بأرض العرب", en: "Muwatta 2606", es: "Muwatta 2606", fr: "Muwatta 2606", ur: "موطا 2606", tr: "El-Muvatta 2606 — Ömer ibn Abdülaziz: Peygamberin son sözü Yahudilere ve Hristiyanlara lanet okumak ve Arap topraklarında iki dinin birden kalmayacağını söylemekti.", id: "Al-Muwatta 2606 — Umar ibn Abd al-Aziz: Ucapan terakhir Nabi adalah kutukan terhadap orang Yahudi dan Kristen, dan bahwa tidak akan ada dua agama yang tersisa di negeri Arab." }
summary:
  ar: "يروي مالك عن إسماعيل بن أبي حكيم أنه سمع عمر بن عبد العزيز يقول: كان من آخر ما تكلم به رسول الله أن قال: قاتل الله اليهود والنصارى اتخذوا قبور أنبيائهم مساجد، لا يبقين دينان بأرض العرب. {cite:muwatta-maruf-1997 p.470}"
  tr: "Malik, İsmail ibn Abi Hakim'den rivayetle Ömer ibn Abdülaziz'in şöyle dediğini işittiğini aktarır: Allah Resulü'nün son sözlerinden biri şuydu: \"Peygamberlerinin kabirlerini ibadet yeri edinen Yahudilere ve Hristiyanlara Allah lanet etsin. Arap topraklarında iki din birden kalmasın.\" {cite:muwatta-maruf-1997 s.470}"
  id: "Malik meriwayatkan dari Ismail bin Abi Hakim bahwa ia mendengar Umar bin Abd al-Aziz berkata: Di antara hal-hal terakhir yang disampaikan Rasulullah adalah: “Semoga Allah melaknat orang-orang Yahudi dan Kristen yang menjadikan kuburan para nabi mereka sebagai tempat ibadah. Tidak akan ada dua agama yang dapat bertahan di negeri Arab.” {cite:muwatta-maruf-1997 p.470}"
