label: { ar: "جامع الترمذي 215 — رفع الدرجات", en: "Jami' al-Tirmidhi 215 — ranks raised", ur: "جامع ترمذی 215 — درجات کی بلندی" }
text: "… نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ \" صَلاَةُ الْجَمَاعَةِ تَفْضُلُ عَلَى صَلاَةِ الرَّجُلِ وَحْدَهُ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً \". قَالَ وَفِي الْبَابِ عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ وَأُبَىِّ بْنِ كَعْبٍ وَمُعَاذِ بْنِ جَبَلٍ وَأَبِي سَعِيدٍ وَأَبِي هُرَيْرَةَ وَأَنَسِ بْنِ مَالِكٍ. قَالَ أَبُو عِيسَى حَدِيثُ ابْنِ عُمَرَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَهَكَذَا رَوَى نَافِعٌ عَنِ ابْنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 215، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 215 (The Book on Salat (Prayer)), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 215، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
