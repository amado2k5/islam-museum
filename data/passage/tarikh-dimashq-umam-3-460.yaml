text: "… إلا أوله أكثره ولم أر شرَّا قط إِلا أوله أقله، فبلغ ذلك عبد اللّٰه بن أبي بن سلول فلقيه فقال : لذت من حر بنا كل ملاث، مرة تطلب الحلف إِلى قريش، ومرة باتباع حمد، فغضب أبو قيس فقال : …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 460، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
