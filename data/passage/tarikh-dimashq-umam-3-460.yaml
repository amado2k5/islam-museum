text: "… إلا أوله أكثره ولم أر شرَّا قط إِلا أوله أقله، فبلغ ذلك عبد اللّٰه بن أبي بن سلول فلقيه فقال : لذت من حر بنا كل ملاث، مرة تطلب الحلف إِلى قريش، ومرة باتباع حمد، فغضب أبو قيس فقال : …"
