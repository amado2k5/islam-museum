text: "… الترتيب في أداء الصلوات المكتوبات في أوقاتها - شرط جواز أدائها؛ حتى لا يجوز أداء الظهر في وقت الفجر، ولا أداء العصر في وقت الظهر؛ لأن كل واحدة من هذه الصلوات لا تجب قبل دخول وقتها، وأداء الواجب قبل وجوبه …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 596، يرد فيه ذكر الواجب، والوجوب، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 596, whose wording mentions the obligatory (wajib), obligation (wujub), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 596 کا اقتباس جس میں واجب، وجوب، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 596, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 596, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), la oración prescrita; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 596. sayfasından, farz olan amelleri, görevleri ve farz namazları anlatan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 596, yang menyebutkan amalan wajib, kewajiban, dan shalat yang dianjurkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
