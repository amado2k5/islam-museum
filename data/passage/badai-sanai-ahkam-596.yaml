text: "… الترتيب في أداء الصلوات المكتوبات في أوقاتها - شرط جواز أدائها؛ حتى لا يجوز أداء الظهر في وقت الفجر، ولا أداء العصر في وقت الظهر؛ لأن كل واحدة من هذه الصلوات لا تجب قبل دخول وقتها، وأداء الواجب قبل وجوبه …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 596، يرد فيه ذكر الواجب، والوجوب، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 596, whose wording mentions the obligatory (wajib), obligation (wujub), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 596 کا اقتباس جس میں واجب، وجوب، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
