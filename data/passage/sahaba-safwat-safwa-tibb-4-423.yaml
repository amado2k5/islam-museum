text: "… من ران الذنوب قلبك لم يزل قلبي إليك تواقاً وإلى استماع الموعظة منك مشتاقاً، وبي جرح نغل قد أعيا الواعظين دواؤه وأعجز المتطببين شفاؤه وقد وصف لي: نفع مراهمك للجراح والألم فلا تأل يرحمك اللّٰه في إيقاع الترياق، وإن كان …"
