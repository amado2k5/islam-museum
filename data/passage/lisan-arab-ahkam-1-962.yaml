text: "… الحرام لان الكلب تحص وانزنا حرام وبَذْل لعوَس عليه وأخذُه حرام وأما كسبُ الحجام فيريد بالحبيث فيه الكراهيةَ لان الجامة مباحةُ وقد يكون الكلامُ فى الفصل الواحد بعضُه على الوجوب وبعضُه على النَّدْبِ و بعضُه على الحقيقة وبعضُه على المجاز …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 1، ص 962، يرد فيه ذكر الوجوب، والمندوب، والكراهة، والمباح، والحرام، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 1, p. 962, whose wording mentions obligation (wujub), the recommended (mandub), dislike (karaha), the permitted (mubah), the forbidden (haram), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 1، ص 962 کا اقتباس جس میں وجوب، مندوب، کراہت، مباح، حرام، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Lisan al-'Arab de Ibn Manzur, volume numérisé 1, p. 962, dont le texte mentionne l'obligation (wujub), le recommandé (mandub), la réprobation (karaha), le permis (mubah), l'interdit (haram), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen digitalizado 1, p. 962, cuyo texto menciona la obligatoriedad (wujub), lo recomendado (mandub), la reprobación (karaha), lo permitido (mubah), lo prohibido (haram), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Manzur'un Lisan al-Arab adlı eserinin 1. cildinin 962. sayfasından, farz, tavsiye edilen, mekruh edilen, caiz olan, haram olan ve müstehap olan amelleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Lisan al-Arab karya Ibn Manzur, Volume 1, halaman 962, yang membahas tentang amalan wajib, anjuran, makruh, halal, dan yang diinginkan; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
