label: { ar: "مسلم 2541 — لا تسبوا أحداً من أصحابي (خالد وعبد الرحمن)", en: "Muslim 2541 — Do not revile any of my Companions (Khalid and Abd al-Rahman)" }
text: "قال أبو سعيد: كان بين خالد بن الوليد وبين عبد الرحمن بن عوف شيء فسبه خالد، فقال رسول الله: لا تسبوا أحداً من أصحابي، فإن أحدكم لو أنفق مثل أحد ذهباً ما أدرك مد أحدهم ولا نصيفه"
summary:
  ar: "رواية أبي سعيد الخدري في باب تحريم سب الصحابة من كتاب فضائل الصحابة في صحيح مسلم؛ سياقها خصومة عرضت بين خالد بن الوليد وعبد الرحمن بن عوف."
