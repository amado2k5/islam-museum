label: { ar: "مسلم 2541 — لا تسبوا أحداً من أصحابي ⁦(خالد وعبد الرحمن)⁩", en: "Muslim 2541 — Do not revile any of my Companions (Khalid and Abd al-Rahman)", es: "Muslim 2541 — No insultéis a ninguno de mis Compañeros (Khalid y Abd al-Rahman)", fr: "Muslim 2541 — Ne blasphèmez pas contre mes Compagnons (Khalid et Abd al-Rahman).", ur: "مسلم 2541 - میرے صحابہ میں سے کسی کو برا نہ کہو ⁦(خالد اور عبدالرحمٰن)⁩", tr: "Müslim 2541 — Arkadaşlarımdan (Halid ve Abdurrahman) hiçbirine hakaret etmeyin.", id: "Muslim 2541 — Janganlah menghina salah seorang dari sahabat-sahabatku (Khalid dan Abdur-Rahman)" }
text: "قال أبو سعيد: كان بين خالد بن الوليد وبين عبد الرحمن بن عوف شيء فسبه خالد، فقال رسول الله: لا تسبوا أحداً من أصحابي، فإن أحدكم لو أنفق مثل أحد ذهباً ما أدرك مد أحدهم ولا نصيفه"
summary:
  ar: "رواية أبي سعيد الخدري في باب تحريم سب الصحابة من كتاب فضائل الصحابة في صحيح مسلم؛ سياقها خصومة عرضت بين خالد بن الوليد وعبد الرحمن بن عوف."
  tr: "Sahih Müslim'deki Sahabelerin Faziletleri kitabında, Sahabelere Hakaret Etmenin Yasaklanması bölümünde Ebu Said el-Hudri'nin rivayeti; bağlamı, Halid bin el-Velid ile Abdurrahman bin Avf arasında çıkan bir tartışmadır."
  id: "Riwayat Abu Saeed Al-Khudri dalam bab tentang larangan menghina para Sahabat dari kitab keutamaan para Sahabat dalam Sahih Muslim; konteksnya adalah perselisihan yang terjadi antara Khalid bin Al-Walid dan Abd Al-Rahman bin Awf."
