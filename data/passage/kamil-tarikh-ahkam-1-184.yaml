text: "… وجعه، ورجع أبو بكر إلى منزله بالسُّنْح. أنظر: صحيح البخاري، في المغازي، باب مرض النيّ في ووفاته، وفي الرقائق باب سكرات الموت، وفي الدعوات باب دعاء النبي ي اللهم الرفيق الأعلى، ومسلم في السلام باب استحباب رقية المريض، وفي فضائل …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 184، يرد فيه ذكر المستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 184, whose wording mentions the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 184 کا اقتباس جس میں مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Kamil fi al-Tarikh de Ibn al-Athir, volume numérisé 1, p. 184, dont le texte mentionne le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Kamil fi al-Tarikh de Ibn al-Athir, volumen digitalizado 1, p. 184, cuyo texto menciona lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 1. cildinin 184. sayfasından, tavsiye edilen amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Kamil fi al-Tarikh* karya Ibn al-Athir, Jilid 1, halaman 184, yang menyebutkan amalan-amalan yang dianjurkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan-amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
