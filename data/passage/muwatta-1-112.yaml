label: { ar: "الموطأ 112 — بلاغ عن عائشة في غسل المرأة: ثلاث حفنات على الرأس", en: "Muwatta 112" }
summary:
  ar: "بلاغ في باب العمل في غسل الجنابة: يروي مالك أنه بلغه أن عائشة سُئلت عن غسل المرأة من الجنابة فقالت: لتحفن على رأسها ثلاث حفنات من الماء ولتضغث رأسها بيديها. ويفسر المحقق الحفنة بملء اليدين من الماء والضغث بمعالجة شعر الرأس باليد، ويذكر أن حديث أم سلمة في صحيح مسلم والترمذي (105) يشهد له، وأن عبد الرزاق روى أن أبا هريرة سأل عائشة عن المرأة تنقض شعرها إذا اغتسلت فقالت: وإن كانت قد أنفقت عليه أوقية؟ إذا أفرغت على رأسها ثلاثاً فقد أجزأ ذلك. {cite:muwatta-maruf-1997 p.89} {cite:muwatta-maruf-1997 p.90}"
