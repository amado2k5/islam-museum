label: { ar: "الموطأ 112 — بلاغ عن عائشة في غسل المرأة: ثلاث حفنات على الرأس", en: "Muwatta 112", es: "Muwatta 112", fr: "Muwatta 112", ur: "موطا 112", tr: "Al-Muwatta 112 — Aişe'den bir kadının abdestiyle ilgili rivayet: Başın üzerine üç avuç su dökülmesi.", id: "Al-Muwatta 112 — Sebuah riwayat dari Aisyah mengenai wudhu wanita: tiga genggam air di atas kepala" }
summary:
  ar: "بلاغ في باب العمل في غسل الجنابة: يروي مالك أنه بلغه أن عائشة سُئلت عن غسل المرأة من الجنابة فقالت: لتحفن على رأسها ثلاث حفنات من الماء ولتضغث رأسها بيديها. ويفسر المحقق الحفنة بملء اليدين من الماء والضغث بمعالجة شعر الرأس باليد، ويذكر أن حديث أم سلمة في صحيح مسلم والترمذي (105) يشهد له، وأن عبد الرزاق روى أن أبا هريرة سأل عائشة عن المرأة تنقض شعرها إذا اغتسلت فقالت: وإن كانت قد أنفقت عليه أوقية؟ إذا أفرغت على رأسها ثلاثاً فقد أجزأ ذلك. {cite:muwatta-maruf-1997 p.89} {cite:muwatta-maruf-1997 p.90}"
  tr: "Cinsel ilişkiden sonra yapılan ritüel temizlik prosedürü hakkında bir rapor: Malik, Ayşe'ye bir kadının cinsel ilişkiden sonraki ritüel temizliği hakkında soru sorulduğunu ve Ayşe'nin şöyle dediğini rivayet eder: \"Başının üzerine üç avuç su döksün ve elleriyle saçlarını ovsun.\" Araştırmacı, bir avuç suyun her iki eli dolduran bir avuç su olduğunu ve ovmanın da ellerle saçı işlemek olduğunu açıklıyor. Sahih Müslim ve Tirmizi'de (105) yer alan Ümmü Seleme hadisinin bunu desteklediğini ve Abdülrazzak'ın, Ebu Hurayra'nın Ayşe'ye bir kadının ritüel temizlik yaparken saçlarını açması hakkında sorduğunu ve Ayşe'nin şöyle dediğini rivayet ettiğini belirtiyor: \"Üzerine bir ons su dökse bile mi? Başının üzerine üç avuç su dökerse, bu yeterlidir.\" {cite:muwatta-maruf-1997 s.89} {cite:muwatta-maruf-1997 s.90}"
  id: "Laporan tentang tata cara penyucian ritual setelah hubungan seksual: Malik meriwayatkan bahwa ia mendengar Aisyah ditanya tentang penyucian ritual seorang wanita setelah hubungan seksual, dan dia berkata: \"Biarlah dia menuangkan tiga genggam air ke atas kepalanya dan memijat rambutnya dengan tangannya.\" Peneliti menjelaskan bahwa satu genggam adalah segenggam air yang memenuhi kedua tangan, dan memijat adalah menggerakkan rambut dengan tangan. Ia menyebutkan bahwa hadits Umm Salama dalam Sahih Muslim dan al-Tirmidhi (105) mendukung hal ini, dan bahwa Abd al-Razzaq meriwayatkan bahwa Abu Hurayra bertanya kepada Aisyah tentang seorang wanita yang melepaskan ikatan rambutnya ketika melakukan penyucian ritual, dan dia berkata: \"Bahkan jika dia telah menggunakan satu ons air untuk itu? Jika dia menuangkan tiga genggam air ke atas kepalanya, itu sudah cukup.\" {cite:muwatta-maruf-1997 p.89} {cite:muwatta-maruf-1997 p.90}"
