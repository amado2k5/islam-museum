label: { ar: "سنن أبي داود 4911 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 4911 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 4911 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 4911 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 4911 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan Abi Davud 4911 — Neler helaldir, neler haramdır", id: "Sunan Abi Dawud 4911 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ عَطَاءِ بْنِ يَزِيدَ اللَّيْثِيِّ، عَنْ أَبِي أَيُّوبَ الأَنْصَارِيِّ، أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثَةِ أَيَّامٍ يَلْتَقِيَانِ فَيُعْرِضُ هَذَا وَيُعْرِضُ هَذَا وَخَيْرُهُمَا الَّذِي يَبْدَأُ بِالسَّلاَمِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4911، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4911 (General Behavior (Kitab Al-Adab)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4911، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4911 (Conducta General (Kitab Al-Adab)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4911 (Guide de la conduite générale), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Sünen Ebu Davud'da yer alan 4911 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4911, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
