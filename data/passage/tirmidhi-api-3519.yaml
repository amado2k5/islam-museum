label: { ar: "جامع الترمذي 3519 — حلاوة الإيمان وكماله", en: "Jami' al-Tirmidhi 3519 — the sweetness and completeness of faith", ur: "جامع ترمذی 3519 — ایمان کی مٹھاس اور اس کا کمال", es: "Jami' al-Tirmidhi 3519 — La dulzura y la plenitud de la fe" }
text: "… أَبُو الأَحْوَصِ، عَنْ أَبِي إِسْحَاقَ، عَنْ جُرَىٍّ النَّهْدِيِّ، عَنْ رَجُلٍ، مِنْ بَنِي سُلَيْمٍ قَالَ عَدَّهُنَّ رَسُولُ اللَّهِ فِي يَدِي أَوْ فِي يَدِهِ \" التَّسْبِيحُ نِصْفُ الْمِيزَانِ وَالْحَمْدُ يَمْلَؤُهُ وَالتَّكْبِيرُ يَمْلأُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ وَالصَّوْمُ نِصْفُ الصَّبْرِ وَالطُّهُورُ نِصْفُ الإِيمَانِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ وَقَدْ رَوَاهُ شُعْبَةُ وَسُفْيَانُ الثَّوْرِيُّ عَنْ أَبِي إِسْحَاقَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3519، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 3519 (Chapters on Supplication), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 3519، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 3519 (Capítulos sobre la súplica), menciona la dulzura y la plenitud de la fe. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
