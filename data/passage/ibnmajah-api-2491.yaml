label: { ar: "سنن ابن ماجه 2491 — الأب والأبوة", en: "Sunan Ibn Majah 2491 — the father and fatherhood", ur: "سنن ابن ماجہ 2491 — باپ اور والدیت" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، وَعَمْرُو بْنُ رَافِعٍ، قَالاَ حَدَّثَنَا مَرْوَانُ بْنُ مُعَاوِيَةَ، حَدَّثَنَا أَبُو مَالِكٍ النَّخَعِيُّ، عَنْ يُوسُفَ بْنِ مَيْمُونٍ، عَنْ أَبِي عُبَيْدَةَ بْنِ حُذَيْفَةَ، عَنْ أَبِيهِ، حُذَيْفَةَ بْنِ الْيَمَانِ قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ بَاعَ دَارًا وَلَمْ يَجْعَلْ ثَمَنَهَا فِي مِثْلِهَا لَمْ يُبَارَكْ لَهُ فِيهَا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2491، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2491 (The Chapters on Pawning), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2491، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
