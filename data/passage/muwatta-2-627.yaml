label: { ar: "الموطأ 627 — بلاغ: علي يتوسد القبور ويضطجع عليها؛ مالك: إنما نُهي عن القعود على القبور للمذاهب", en: "Muwatta 627", es: "Muwatta 627", fr: "Muwatta 627", ur: "موطا 627", tr: "El-Muvatta 627 — Rivayet: Ali, başını mezarlara yaslar ve üzerlerine uzanırdı; Malik: Mezarlar üzerine oturmak, mezheplere göre yasaktı.", id: "Al-Muwatta 627 — Riwayat: Ali biasa meletakkan kepalanya di atas kuburan dan berbaring di atasnya; Malik: Duduk di atas kuburan hanya dilarang menurut mazhab-mazhab tertentu." }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن علي بن أبي طالب كان يتوسد القبور ويضطجع عليها. ويقول مالك: وإنما نُهي عن القعود على القبور، فيما نرى، للمذاهب، أي لقضاء الحاجة عليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (322)، وأن الطحاوي أخرج بإسناده عن مولى لآل علي أن علياً كان يجلس على القبور وأنه كان يبسط له في المقبرة فيتوسد قبراً ثم يضطجع. {cite:muwatta-maruf-1997 p.319} {cite:muwatta-maruf-1997 p.320}"
  tr: "Malik, Ali ibn Abi Talib'in mezarları yastık olarak kullandığını ve üzerlerine uzandığını duyduğunu bildirmiştir. Malik şöyle demiştir: \"Bizim görüşümüze göre, mezarlar üzerine oturmanın yasaklanmasının sebebi, üzerlerine ihtiyaç giderme eylemidir.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan el-Şeybani (322) tarafından rivayet edildiğini ve el-Tahavi'nin, Ali'nin ailesinden azat edilmiş bir köleden rivayet ettiğine göre, Ali'nin mezarlar üzerine oturduğunu, mezarlıkta onun için bir hasır serildiğini ve bir mezarı yastık olarak kullanıp üzerine uzandığını belirtmektedir. {cite:muwatta-maruf-1997 s.319} {cite:muwatta-maruf-1997 s.320}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa Ali ibn Abi Talib biasa menggunakan kuburan sebagai bantal dan berbaring di atasnya. Malik berkata: \"Larangan duduk di atas kuburan, menurut pandangan kami, disebabkan oleh perbuatan buang air besar di atasnya.\" Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan al-Shaybani (322), dan bahwa al-Tahawi meriwayatkan dengan sanadnya dari seorang budak yang telah dibebaskan dari keluarga Ali bahwa Ali biasa duduk di atas kuburan dan tikar akan dihamparkan untuknya di pemakaman, dan dia akan menggunakan kuburan sebagai bantal lalu berbaring. {cite:muwatta-maruf-1997 p.319} {cite:muwatta-maruf-1997 p.320}"
