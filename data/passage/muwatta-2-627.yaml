label: { ar: "الموطأ 627 — بلاغ: علي يتوسد القبور ويضطجع عليها؛ مالك: إنما نُهي عن القعود على القبور للمذاهب", en: "Muwatta 627" }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن علي بن أبي طالب كان يتوسد القبور ويضطجع عليها. ويقول مالك: وإنما نُهي عن القعود على القبور، فيما نرى، للمذاهب، أي لقضاء الحاجة عليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (322)، وأن الطحاوي أخرج بإسناده عن مولى لآل علي أن علياً كان يجلس على القبور وأنه كان يبسط له في المقبرة فيتوسد قبراً ثم يضطجع. {cite:muwatta-maruf-1997 p.319} {cite:muwatta-maruf-1997 p.320}"
