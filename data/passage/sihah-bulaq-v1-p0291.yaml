text: |-
  ٢٥٠
  ⁦(با ب الرام)⁩
  ⁦(ضرد)⁩
  وصيرته أنا كذا أى جعلته وصاره يصيره لغة فى إصوره أى قطعه وكذلك اذا أماله قال
  وفرع يصير الجيد وسف كأنه • على الليت قنوان السكروم الدوالح
  أى ييله ويروى يزين الجيد وصيور الامر آخره ومايؤول اليه وهوفيعول وقولهم ماله
  صيور أى رأى وعقل وتصير فلان أباه اذانزع اليه فى الشبه وصير الامر بالكسر مصير
  وعاقبته يقال فلان على صيرأ مراذا كان على اشراف من قضائه قال زهير
  وقد كنت من ليلى سنين عمانيا * على صير أهر ما يمرّوما يحلو
  والصير أيضا الصحناة وفى الحديث انّ سالم بن عبد اللّٰه حربه رحل معه صير فذاق منه ثم سأل
  عنه كيف تيعه وتفسيره فى الحديث انه الصحفاة قال جرير يهجوقوما
  كانوا اذا جعلوا فى صيرهم بصلا • ثم اشتووا كنعدا من مالح جدفوا
  والصرآيضاشق الباب وفى الحديث من نظرمن صيرباب ففقئت عينه فهى هدر وتفسيره
  فى المديث ان الصير الشق وقال أبو عبيد لم يسمع هذا الحرف الافى هذا الحديث والصيرة
  حظيرة الغنم وجمعها صير مثل سيرة وسير قال الاخطل
  واذكر غدانة عدّانا مزغة • من الحبلق تبنى حوله الصير
  ف ل الضا بر) الضبرجوز البروهوجوز صلب وايس هوالرمان البرى لان
  ذلك يسجمى المظ والضبرايضا الجاعة بف زون قال ساعدة بن جوية الهذلى
  «فاهم يوما كذلك راعهم • ضبرلباسهم القتيزمؤاب
  ..
  وعامر بن ضبارة بالفتح ويقال أيضافلان ذوضبارة أى موثق الخلق وكذلك فرص
  مضبر اللحلق وناقة مضيرة الخلق ويقال أضير الفرس اذابمع قوائمه ووثب قال العجاج
  يمدح عر بن عبيد اللّٰه بن.عمر القرشى
  لقد سى ابن معمر حين اعتمر * مغزى بعيدامن بعيد وضبر • نقضى البازى اذا البازى كسر
  يقول ارتفع قدره حين غزام وضعا بعيدامن الشام وجع لذلك جيشا وفرس ضبرّ مثال طمرّ
  أى وثاب وضبر عليه الصخر يضيره اذ انضده قال الراجز يصف ناقة
  ترى شؤون رأسها العواردا • مضبورة الى شباحدائدا • ضبربر اطيل الى جلاهدا
  الكتب أضبرها ضبرا اذاجعلتها اضبارة عن ابن السكيت ضبطر الضيطر مثال
  ل زبرالشديد ( جر الفجر القلق من الفم وقد ضجرة، وضجر ورجل ضيجور وأضيرتى
  فلان فهو مضجر وقوم مضاجر ومضاجير قال أوس
  تناهون اذا اخضرت نعالسكم • وفى الحفيظة ابرام مضاجير
  وضجر البعير كثر رغاؤه قال الشاء,
  فان أهجه يضجر كما ضجر بازل • من الادم دبرت صفحتاه وغاربه
  وقد خفف فجرودبرت فى الافعال كما يخفف فذفى الاسماء ( رر الضرخلاف
  النفع وقدضره وضاره بمعنى والاسم الضرر قال ابن السكيت قواهم لا يضرك عليه بحل أى
  لا يز يدك ولا يضرك عليه رجل أى لا تجد رجلايز يدك على ما عند هذا الرجسل من السكفاية
  والضيرة
