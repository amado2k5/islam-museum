text: "… ما قد رأَيتم ببنى قَيْنُقَاع وبنى النَّضير، وأَجلاهم عن بلادهم بعد قَبْض الأَموالِ. وكان ابن أَبي الحُقَيق قد سار فينا فاجتمعنا معه لنصركم، وأَرى الأَمر قد تَطَاول كما ترون، وإِنكم واللهِ، ما أَنتم وقُرَيشٌ وغَطَفان من محمّدٍ بمنزلةٍ واحدة ؛ …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 481، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 481, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 481 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento del Maghazi de al-Waqidi, volumen 1, pág. 481, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Maghazi d'al-Waqidi, volume 1, page 481, mentionnant des nations, des religions et des peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "El-Vakidi'nin Resimli Maghazi adlı eserinin 1. cildinin 481. sayfasından, Müslüman olmayan milletleri, dinleri ve halkları anlatan bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar Tarayıcısı tarafından derlenmiştir."
