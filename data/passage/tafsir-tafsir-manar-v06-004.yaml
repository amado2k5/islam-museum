text: "ين الله تعالى لرسوله لل وللمؤمنين أنه أخذ الميثاق على أهل الكتاب من اليهود والنصارى من قبل، كما أخذه على هذه الأمة الآن، وأنهم نقضوا ميثاقه، وأضاعوا حظا عظيما مما أوحاه تعالى إليهم، ولم يقيموا ما حقظوا منه. وهذا البيان"
