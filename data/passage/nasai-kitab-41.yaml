summary:
  ar: "القسم 41 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفرع والعتيرة»، ويضم فيها النصوص من 4222 إلى 4262 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 41 of Sunan al-Nasa'i (The Book of al-Fara' and al-'Atirah) in the division of the open hadith dataset the museum took its reports from: reports 4222 to 4262 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 41، عنوان «کتاب الفرع والعتیرۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4222 تا 4262۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 41 de Sunan al-Nasa'i (El Libro de al-Fara' y al-'Atirah) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4222 al 4262, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre d'al-Fara' et d'al-'Atirah), dans la partie ouverte de ce recueil (rapports 4222 à 4262). Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 41. bölümü \"Dal ve Atira Kitabı\" başlığını taşımakta olup, sırasıyla 4222'den 4262'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 41 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Cabang dan 'Atirah,\" dan berisi teks 4222 hingga 4262, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
