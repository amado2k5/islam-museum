label: { ar: "صحيح البخاري 7358 — الحرام", en: "Sahih al-Bukhari 7358 — the unlawful", ur: "صحیح بخاری 7358 — حرام", es: "Sahih al-Bukhari 7358 — el ilícito", fr: "Sahih al-Bukhari 7358 — l'illicite", tr: "Sahih el-Buhari 7358 — Haram", id: "Sahih al-Bukhari 7358 — Haram" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ أُمَّ حُفَيْدٍ بِنْتَ الْحَارِثِ بْنِ حَزْنٍ، أَهْدَتْ إِلَى النَّبِيِّ سَمْنًا وَأَقِطًا وَأَضُبًّا، فَدَعَا بِهِنَّ النَّبِيُّ فَأُكِلْنَ عَلَى مَائِدَتِهِ، فَتَرَكَهُنَّ النَّبِيُّ كَالْمُتَقَذِّرِ لَهُ، وَلَوْ كُنَّ حَرَامًا مَا أُكِلْنَ عَلَى مَائِدَتِهِ، وَلاَ أَمَرَ بِأَكْلِهِنَّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7358، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 7358 (Holding Fast to the Qur'an and Sunnah), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 7358، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 7358 (Aferrarse al Corán y la Sunnah), menciona lo ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 7358 (S'attacher fermement au Coran et à la Sunna), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 7358 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısı, bunu Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki rivayetleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7358, menyebutkan apa yang dilarang. Peramban Halal dan Haram menggabungkan ini dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
