text: |-
  ٣٤٦
  افضب اذا اشتد غضبه والهدم بالكسر الثوب البالى والمع أهدام قال أوس بن جر
  وذات *دم عارنواشرها • تصمت بالما تولباجدعا
  والمهدوم من اللبن الرئئسة والهدم بالتصحريك ماته دم -ن جوائب البترفسقط فيها وقال
  الشاعر يصف امى أة فاجرة.
  غضى اذا زجرت عن -وأققدما • كأنهاهدم فى الجفر منقاض
  و يقال دما ؤهم بينهم هدم أى هدروهدم أيضا بالتسكين وذلكْ اذا لم يودوا والهدمة الدفعة
  من المال وناقة(هدمة شديدة الضبعة قال الفراهى التى تقع من شدة الضبعة وقد هدمت
  بالكسر وأنشد• فيها هديم ضبع «واس ويقال هذاشئ مهندم أى مصلح على مقدار
  وهو مع رب وأصله بالفارسية أندام مثسل مهندس وأصله أندازه (هذم، الهذم القطع
  والا كل فى سرعة قال أبو عبيد والهذام السيف القاطع وسيف مهذم مثل مخذم والهيذام
  الشجاع (()ذرم). الهذرمة السرعة فى القراءة يقال هذرم ورده أى هذه وكلك
  فى الكلام قال أبو اليجم يذمّ رجلا
  وكان فى الجلس جمّ الهذرمه • ليثاعلى الداهية المكتمه
  رم الهرم بالتسكين نبت وهو ضرب من الحض الواحدة هرمة ويقال بعيرهارم
  للذى يرعاه وابل هوارم ويقال هوأذل من هرمة وإبن هرمة شاعر والهرم بالتحريك كب
  السنّ وقدهرم الرجل بالكسروأه ومه اللّٰه سيهانه فهوهرم وقوم هرمى وترك العشاء مهرمة
  وهرم أيضااسم دجل وهرم بن سنان بن أبي حارثة المرى من بنى مرّة بن عوف بن سعد بن
  ذبيان وهو صاحب زهير الذى يقول فيه
  انّ البخيل ملوم حيث كان وك كنّ الجواد على علاته هرم
  وأماهرم بن قطبة بن سيارفنبى فزارة وهو الذى تنافر اليه عامر وعلقمة ويقال انك لا تدرى
  علام ينزأهر مك ولا تدرى بم يولع هرمك أى نفسك وعقلك والهرمان بالضم العقل يقال
  ما له هرمان وفلاث يتهارم برى من نفسه أنه هرم وليس به والهرمان بذا آن بعصر ( رثم
  الهرغة الاسدومنه سمى الرجل هرغة ( رشيم الهرشم :كسرالهاء وتشديداليم
  -الجر الرخو وقال أبوزيد الهرشمّ الجبل الاين المحفر وأنشد
  هرشمة فى جبل هرشمّ • سذل للجارولا بن العم
  والهرشمة من الغنم الغزيرة عن القراء زم الهزمة النقرة فى الصدروفى التفاحة
  اذا خمزيا يسدل ونحوذلك وهزم الضريع ما تكسر منه والنهزم التكسر بقال تهزم
  السقاءاذا ييس قت كسر وهزمت الجيش هزما وهزيمة فانم زموا والهزيمة الركية
  وقال الطر ماح بن حكيم الطائ
  أنا الطرماح وعمى حاتم * وسمى شكى واسانى عادم * والبحرحيث تنكد الهزائم
  قوله وسحي من السمة وشكىّ أموجع وتنكد أى يقلّ ماؤها واهتزام الفرس صوت يربه
  قال امر والقيس على الذبل جساش كانّ اهتزامه اذا باس فيه حيه غلى مرجل
  واحتزمت الشاة ذبحتها وهزيم الرعدصونه يقسال تهسؤم الرعد تهزما وغيث هزم متبعق
