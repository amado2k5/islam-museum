label: { ar: "الموطأ 1054 — عبد الله بن محمد بن أبي بكر الصديق أخبر عبد الله بن عمر، عن عائشة: أن النبي قال: ألم تري أن قومك حين بنوا الكعبة اقتصروا على قواعد إبراهيم؟ قالت: أفلا تردها على قواعد إبراهيم؟ قال: لولا حدثان قومك بالكفر لفعلت", en: "Muwatta 1054" }
summary:
  ar: "أول حديث في باب ما جاء في بناء الكعبة. يرويه مالك عن ابن شهاب عن سالم بن عبد الله، أن عبد الله بن محمد بن أبي بكر الصديق أخبر عبد الله بن عمر عن عائشة، أن النبي قال: ألم تري أن قومك حين بنوا الكعبة اقتصروا على قواعد إبراهيم؟ قالت: فقلت: يا رسول الله، أفلا تردها على قواعد إبراهيم؟ فقال: لولا حدثان قومك بالكفر لفعلت. قال عبد الله بن عمر: لئن كانت عائشة سمعت هذا من رسول الله، ما أرى رسول الله ترك استلام الركنين اللذين يليان الحجر، إلا أن البيت لم يتمم على قواعد إبراهيم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1278) وإسماعيل بن أبي أويس عند البخاري وغيرهم كثير. {cite:muwatta-maruf-1997 p.488}"
