label: { ar: "الموطأ 1054 — عبد الله بن محمد بن أبي بكر الصديق أخبر عبد الله بن عمر، عن عائشة: أن النبي قال: ألم تري أن قومك حين بنوا الكعبة اقتصروا على قواعد إبراهيم؟ قالت: أفلا تردها على قواعد إبراهيم؟ قال: لولا حدثان قومك بالكفر لفعلت", en: "Muwatta 1054", es: "Muwatta 1054", fr: "Muwatta 1054", ur: "موطا 1054", tr: "El-Muvatta 1054 — Abdullah ibn Muhammed ibn Abi Bekr el-Siddik, Abdullah ibn Ömer'in Aişe'den rivayet ettiğine göre Peygamber şöyle buyurmuştur: \"Kabe'yi yeniden inşa ederken, İbrahim'in temelleriyle sınırlı kaldıklarını görmedin mi?\" Aişe şöyle buyurdu: \"Neden İbrahim'in temelleri üzerine yeniden inşa etmiyorsunuz?\" Peygamber şöyle buyurdu: \"Eğer sizin ümmetinizin yakın zamanda küfre dönmemiş olması nedeniyle, bunu yapmazdım.\"", id: "Al-Muwatta 1054 — Abdullah ibn Muhammad ibn Abi Bakr al-Siddiq meriwayatkan bahwa Abdullah ibn Umar menceritakan dari Aisyah bahwa Nabi bersabda: “Tidakkah kalian melihat bahwa ketika kaum kalian membangun kembali Ka'bah, mereka hanya menggunakan fondasi Ibrahim?” Aisyah bertanya: “Mengapa kalian tidak membangunnya kembali di atas fondasi Ibrahim?” Nabi menjawab: “Seandainya bukan karena baru-baru ini kaum kalian memeluk Islam, aku pasti sudah melakukannya.”" }
summary:
  ar: "أول حديث في باب ما جاء في بناء الكعبة. يرويه مالك عن ابن شهاب عن سالم بن عبد الله، أن عبد الله بن محمد بن أبي بكر الصديق أخبر عبد الله بن عمر عن عائشة، أن النبي قال: ألم تري أن قومك حين بنوا الكعبة اقتصروا على قواعد إبراهيم؟ قالت: فقلت: يا رسول الله، أفلا تردها على قواعد إبراهيم؟ فقال: لولا حدثان قومك بالكفر لفعلت. قال عبد الله بن عمر: لئن كانت عائشة سمعت هذا من رسول الله، ما أرى رسول الله ترك استلام الركنين اللذين يليان الحجر، إلا أن البيت لم يتمم على قواعد إبراهيم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1278) وإسماعيل بن أبي أويس عند البخاري وغيرهم كثير. {cite:muwatta-maruf-1997 p.488}"
  tr: "Kâbe'nin yapımı bölümündeki ilk hadis. Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan rivayet ettiğine göre, Abdullah ibn Muhammed ibn Ebu Bekr el-Siddik, Aişe'den rivayetle Abdullah ibn Ömer'e şöyle bildirmiştir: Peygamber şöyle buyurdu: \"Senin ümmetin Kâbe'yi yeniden inşa ederken, onu İbrahim'in temelleriyle sınırladığını görmedin mi?\" Aişe şöyle dedi: \"Ben de dedim ki: 'Ey Allah'ın Resulü, neden onu İbrahim'in temelleri üzerine yeniden inşa etmiyorsunuz?' Peygamber şöyle buyurdu: 'Eğer ümmetinizin yakın zamanda küfre düşmesi olmasaydı, öyle yapardım.'\" Abdullah ibn Ömer dedi ki: \"Eğer Aişe bunu Allah'ın Resulü'nden işittiyse, Allah'ın Resulü'nün Kara Taş'a bitişik iki köşeye dokunmayı ihmal ettiğini düşünmüyorum; ancak bu, Kâbe'nin İbrahim'in temelleri üzerine tamamlanmadığı anlamına gelir.\" Editör, bu rivayetin Malik'ten nakledilerek Ebu Musab (1278) ve İsmail ibn Abi Uveys tarafından Buhari'nin ve diğer birçok kişinin derlemesinde aktarıldığını belirtiyor. {cite:muwatta-maruf-1997 s.488}"
  id: "Hadits pertama dalam bab tentang pembangunan Ka'bah. Diriwayatkan oleh Malik dari Ibnu Shihab dari Salim ibn Abdullah, bahwa Abdullah ibn Muhammad ibn Abi Bakr al-Siddiq memberitahu Abdullah ibn Umar dari Aisyah, bahwa Nabi bersabda: “Tidakkah kalian melihat bahwa ketika kaum kalian membangun kembali Ka'bah, mereka membatasinya pada fondasi Ibrahim?” Aisyah berkata: “Maka aku berkata: ‘Wahai Rasulullah, mengapa engkau tidak membangunnya kembali di atas fondasi Ibrahim?’ Beliau bersabda: ‘Seandainya bukan karena baru-baru ini kaum kalian masuk Islam, aku pasti akan melakukannya.’” Abdullah ibn Umar berkata: “Jika Aisyah mendengar ini dari Rasulullah, aku tidak berpikir bahwa Rasulullah lalai menyentuh dua sudut yang berdekatan dengan Batu Hitam, kecuali bahwa Rumah itu tidak selesai dibangun di atas fondasi Ibrahim.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1278) dan Ismail bin Abi Uways dalam kumpulan al-Bukhari dan banyak lainnya. {cite:muwatta-maruf-1997 p.488}"
