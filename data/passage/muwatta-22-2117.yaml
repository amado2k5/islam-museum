label: { ar: "الموطأ 2117 — مالك: وكذلك السنة عندنا في الطلاق، إذا جاءت المرأة بشاهد أن زوجها طلقها، أحلف زوجها ما طلقها، فإذا حلف لم يقع عليه الطلاق", en: "Muwatta 2117", es: "Muwatta 2117", fr: "Muwatta 2117", ur: "موطا 2117", tr: "El-Muvatta 2117 — Malik: Aynı şekilde, boşanma konusunda bizdeki sünnet şudur: Eğer bir kadın kocasının kendisini boşadığına dair bir şahit getirirse, kocasına boşanmadığına dair yemin ettirilir. Eğer yemin ederse, boşanma geçerli olmaz.", id: "Al-Muwatta 2117 — Malik: Dan demikian pula, Sunnah di pihak kami mengenai perceraian adalah jika seorang wanita membawa saksi bahwa suaminya telah menceraikannya, maka suaminya disuruh bersumpah bahwa ia tidak menceraikannya. Jika ia bersumpah, maka perceraian tersebut tidak sah." }
summary:
  ar: "قال مالك: وكذلك السنة عندنا أيضا في الطلاق، إذا جاءت المرأة بشاهد أن زوجها طلقها، أحلف زوجها ما طلقها، فإذا حلف لم يقع عليه الطلاق. {cite:muwatta-maruf-1997 p.264} {cite:muwatta-maruf-1997 p.265}"
  tr: "Malik şöyle dedi: Benzer şekilde, boşanma konusundaki geleneğimizde, bir kadın kocasının kendisini boşadığını kanıtlamak için bir şahit getirirse, kocası onu boşamadığına dair yemin ettirilir. Eğer yemin ederse, boşanma geçerli olmaz. {cite:muwatta-maruf-1997 s.264} {cite:muwatta-maruf-1997 s.265}"
  id: "Malik berkata: Demikian pula dalam tradisi kita mengenai perceraian, jika seorang wanita membawa saksi untuk membuktikan bahwa suaminya menceraikannya, suaminya disuruh bersumpah bahwa ia tidak menceraikannya. Jika ia bersumpah, perceraian tersebut tidak berlaku. {cite:muwatta-maruf-1997 p.264} {cite:muwatta-maruf-1997 p.265}"
