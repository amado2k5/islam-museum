text: "… وأم سلمة، وحسين بن على رخص فى الصلاة فى المقصورة التى تحمى أنس، والحسن، والحسين رخص فى لبس القفازين للمحرمة على وعائشة رخص فى النعى أبو هريرة وابن عمر الرخص المختصة بالسفر تباح فى السفر الواجب والمندوب والمباح على، وابن …"
summary:
