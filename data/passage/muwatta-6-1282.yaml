summary:
  ar: "يروي مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر أنه كان يقول في ذلك مثل قول عائشة. {cite:muwatta-maruf-1997 p.569}"
  tr: "Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan, o da Abdullah ibn Ömer'den rivayet ederek, kendisinin de Aişe ile aynı şeyi söylediğini nakletmiştir. {cite:muwatta-maruf-1997 s.569}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Salim ibn Abdullah, dari Abdullah ibn Umar, bahwa ia biasa mengatakan hal yang sama seperti Aisyah. {cite:muwatta-maruf-1997 p.569}"
