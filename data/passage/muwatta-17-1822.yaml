label: { ar: "الموطأ 1822 — مالك: الأمر المجتمع عليه أن الرجل إذا باع ثمر حائطه، فله أن يستثني منه ما بينه وبين ثلث الثمر، لا يجاوز ذلك، وما كان دون الثلث فلا بأس به", en: "Muwatta 1822", es: "Muwatta 1822", fr: "Muwatta 1822", ur: "موطا 1822", tr: "El-Muvatta 1822 — Malik: İttihat şudur ki, bir kimse bahçesinin meyvesini satarsa, meyvenin üçte birine kadar olan miktarı satıştan hariç tutabilir; üçte birinden az olan miktar ise caizdir.", id: "Al-Muwatta 1822 — Malik: Konsensusnya adalah jika seseorang menjual buah dari kebunnya, ia boleh mengecualikan sebagian dari hasil penjualan tersebut, yaitu antara sepertiga dan seluruhnya, tidak melebihi jumlah tersebut, dan bagian yang kurang dari sepertiga diperbolehkan." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن الرجل إذا باع ثمر حائطه، أن له أن يستثني من ثمر حائطه ما بينه وبين ثلث الثمر، لا يجاوز ذلك. وما كان دون الثلث فلا بأس بذلك. {cite:muwatta-maruf-1997 p.145}"
  tr: "Malik şöyle dedi: Aramızdaki görüş birliği şudur ki, bir kimse bahçesinin meyvesini satarsa, sattığı meyvenin üçte birine kadar olan kısmını hariç tutabilir ve bu miktarı aşamaz. Üçte birinden azı ise caizdir. {cite:muwatta-maruf-1997 s.145}"
  id: "Malik berkata: Konsensus di antara kami adalah bahwa jika seseorang menjual buah dari kebunnya, ia boleh mengambil sebagian dari buah kebunnya antara sepertiga dan sebesar jumlah tersebut, dan ia tidak boleh melebihi jumlah itu. Jumlah yang kurang dari sepertiga diperbolehkan. {cite:muwatta-maruf-1997 p.145}"
