text: "… ققال يابنى : لأن الرخصة ففى ذلك خير تمكون فى ميزانى أحب إلى من أن أكون فى ميزانك، فقال يا أبت لأن يكون ماتحب أحب إلىّ كثير وما دام العبد من أن يكون ما أحب. وعن ابن عباسما أنه نعى …"
