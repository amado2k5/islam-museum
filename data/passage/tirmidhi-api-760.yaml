label: { ar: "جامع الترمذي 760 — وصية أو عهد أخير", en: "Jami' al-Tirmidhi 760 — a testament or parting counsel", ur: "جامع ترمذی 760 — وصیت یا آخری نصیحت", es: "Jami' al-Tirmidhi 760 — un testamento o consejo de despedida", fr: "Jami' al-Tirmidhi 760 — un testament ou un conseil d'adieu" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ أَبِي الرَّبِيعِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ عَهِدَ إِلَىَّ النَّبِيُّ ثَلاَثَةً أَنْ لاَ أَنَامَ إِلاَّ عَلَى وِتْرٍ وَصَوْمَ ثَلاَثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ وَأَنْ أُصَلِّيَ الضُّحَى."
summary:
  ar: "حديث في جامع الترمذي، رقم 760، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 760 (The Book on Fasting), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 760، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 760 (El Libro del Ayuno), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 760 (Le Livre du jeûne), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
