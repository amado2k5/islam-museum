text: |-
  ٦٣٥
  الطعن شقشقة والضرب هينعة • ضرب المعوّل تحت الديمة العضدا
  والهمقع بتشديد الميم مثال الزتماق غر اتنضب وهو فى كتاب سيبويه ( كمع هكم هكوعا
  أى سكن والطمأن ية ال هكعت البقرتت ظل الشهرة من شدة الحروذهب فلان فايدرى
  أين سكع وأين هكع أى أين نوجه وأين أقام والهكعة مثال الهمزة الاسق ⁦( هلع)⁩ الهلع
  أفحس الجزع وقد هلع بالكسرفه وهلع وهلوع وقدجاء فى الحديث من شر ما أوتى العبدشح
  هالع وجبن خالع أى يجزع فيه العيدويحزن كما يقال يوم عاصف وليسل نائم ويحستمل أيضا
  أن يكون هالع لمكان خالع للازدواج واتفالع الذى كانه يخلع فؤّاده لشدته وحكى يعقوب
  رجل هلعة مثال ه.زة اذا كان يهاع ويجزع وبتصبع سريما ويقال ماله هلع ولاهلعة أى
  ماله حدى ولاعفاق ويقال ناقة «اواع وهلواعة أى سريعة حديدة.ذعان وقدملوعت
  أى أسرعت وذتب هلع بلع فالهلع من الحرص والبلح من الابتلاع والهالح النعام السريع
  ف مضيه والنعامة هااعة ( همع الهموع بالضم السيلان والهامع السائل وقدهمعت
  عينهته-مع همعاوهم وعاوهمعانا أى دمعت وكذلك الطل اذا سقط على الشجرثم سال قيل
  همع وقال بادر من ليل وطل همعا وسصاب همع أى ماطروتهمع الرجل تباكى والهملع
  السريع من الابل وربماعى الذئب هملعا واللام مشددة وأظنها زائدة مسع
  الهميع بالفتح الرجل القوى زعموا واسم رجل أيضا نع . الهنعة سمة فى منخفض
  العنق يقال بعيرم هنوع وقددنع والهنعة أيضاممكب الجوزاء الايسر وهى خسة أنجم
  معطفة ينزاها القسمر والمنع تطامن فى عنق البعيروه وأن تحدر قصرته ويرتفع رأسه
  ويشرف ماركه وقد هنع بالكسر يهنع هنما وظليم أهنع وفعامة هذهاء يكون فى عنقها
  النوامحتى ية صراذلك كمايف_علد الطائر الطوبل العنق وأكمة هنعا. أى قصرة وهى ضة
  سطعاء والهنع فى العفر من الظباءتاصة دون الادم لان فى أعناق العفرقصرا وع
  هاع يهوع هواعا وهبعوعة أى قاءيعال لاهوّعنهما أكل أى لاقيئنه والتهوَع النة.و
  وهاع القو. بعضهم الى بعض أى هموا بالونوب يع هاع ي ي ع هيوعا أى جبن ومنه
  قول الطرماح اذا جعلت خور الرجال ته.ع ١ فيهلغة أخرى هاع بهاع هيعا وهيعانا
  والهبعة سيلان الشى المصبوب على وجه الارض مثل المبعة وقدهاع:ي:ع هيعادرصاص
  هائع فى المذوب وانهاع السراب جرى ورجل هاع لاع وهائع لائع أى جبان جزوع وامرأة
  هاعة لاعة والهائعة الصوت الشديد والهيعة كل ما أفزعل من صوت أوفأسشة تشاع
  قال الشائر
  ان يي- واهيعة طاروا بها فرحا • من وماسيعوامن صالح دفنوا
  والميعة هى الجفة ميات أهل المشام
  صل الياء دع الايدع الزعران قال رؤية كمااتقى محرمج أيدعا
  وهذا يتصرف فان سهيت به رجلا لم تصرفه فى المعرفة للتعريف ووزن الفعل وصرفته فى النكرة
  مثل أفكل ويدعت الشئ أيدعه تيديما أى صبغته بالزعران وأيدع الحبج على نفسه
  أى أوجبه وكذلك اذا تطيب لاجراءه ومبدوع اسم فرس عبدالحرن بن ضرارين عم-رو
  ابن مالك الضى وقال
  أنا ابن حاة المجد من آل مالك
