text: "في تاريخه فهو مما يرد عليه. ثم رأيت الخطيب أورد عنه حكايات في كتاب التطفيل تدل على أنه ليس من أهل الحديث لا من قريب ولا من بعيد، شغوف بالطعام وأصنافه، والولائم وأوقاتها، يسافر لها من مكان إلى مكان. فالله"
