label: { ar: "الموطأ 615 — ابن عمر: صُلي على عمر بن الخطاب في المسجد", en: "Muwatta 615" }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه قال: صُلي على عمر بن الخطاب في المسجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد العزيز بن محمد عند الطحاوي والشافعي في المسند ومحمد بن الحسن الشيباني (314)، وأن الترمذي نقل عقب الحديث (1033) عن الشافعي: قال مالك: لا يُصلى على الميت في المسجد، ويحيل على المذاهب في ذلك في التمهيد (21/219). {cite:muwatta-maruf-1997 p.315}"
