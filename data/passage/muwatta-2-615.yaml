label: { ar: "الموطأ 615 — ابن عمر: صُلي على عمر بن الخطاب في المسجد", en: "Muwatta 615", es: "Muwatta 615", fr: "Muwatta 615", ur: "موطا 615", tr: "El-Muvatta 615 — İbn Ömer: Ömer ibn el-Hattab için cenaze namazı camide kılındı.", id: "Al-Muwatta 615 — Ibn Umar: Shalat jenazah dilaksanakan untuk Umar ibn al-Khattab di masjid." }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه قال: صُلي على عمر بن الخطاب في المسجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد العزيز بن محمد عند الطحاوي والشافعي في المسند ومحمد بن الحسن الشيباني (314)، وأن الترمذي نقل عقب الحديث (1033) عن الشافعي: قال مالك: لا يُصلى على الميت في المسجد، ويحيل على المذاهب في ذلك في التمهيد (21/219). {cite:muwatta-maruf-1997 p.315}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ederek şöyle buyurmuştur: \"Ömer ibn el-Hattab'ın cenaze namazı mescitte kılındı.\" Araştırmacı, bu hadisin Malik'ten rivayetle Ebu Musab ve Abdül Aziz ibn Muhammed tarafından Tahavi'nin Musned'inde, Şafiî'nin Musned'inde ve Muhammed ibn el-Hasan el-Şeybani'de (314) nakledildiğini belirtmektedir. Tirmizi, hadisten sonra (1033), Şafiî'nin şöyle dediğini aktarır: \"Malik dedi ki: Cenaze namazı mescitte kılınmamalıdır.\" Daha sonra bu konudaki farklı görüşlere el-Tamhid'de (21/219) değinir. {cite:muwatta-maruf-1997 s.315}"
  id: "Malik meriwayatkan hadits ini dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar, yang berkata: “Shalat jenazah Umar ibn al-Khattab dilaksanakan di masjid.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab dan Abdul Aziz ibn Muhammad dalam Musnad al-Tahawi, al-Shafi’i dalam Musnadnya, dan Muhammad ibn al-Hasan al-Shaybani (314). Al-Tirmidhi, setelah hadits tersebut (1033), mengutip al-Shafi’i yang mengatakan: “Malik berkata: Shalat jenazah sebaiknya tidak dilaksanakan di masjid.” Kemudian beliau merujuk pada berbagai mazhab mengenai masalah ini dalam al-Tamhid (21/219). {cite:muwatta-maruf-1997 p.315}"
