  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 1198, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
