text: "… يأثم بالرضى به أو بأن لا يكرهه بقلبه أو بالمتابعة عليه. وأما قوله: أفلا نقاتلهم؟ قال لا ما صلوا ففيه معنى ما سبق أنه لا يجوز الخروج على الخلفاء بمجرد الظلم أو الفسق ما لم يغيروا شيئاً من قواعد الإسلام. …"
summary:
