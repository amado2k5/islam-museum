label: { ar: "جامع الترمذي 813 — ما يجب على المكلف", en: "Jami' al-Tirmidhi 813 — what is binding on the person addressed", ur: "جامع ترمذی 813 — جو مکلف پر واجب ہے", fr: "Jami' al-Tirmidhi 813 — ce qui s'impose à la personne responsable", es: "Yami' al-Tirmidhi 813 — lo que obliga a la persona responsable", tr: "Cami' el-Tirmizi 813 — Sorumlu kişi için farz olanlar", id: "Jami' al-Tirmidhi 813 — Apa yang wajib dilakukan oleh orang yang bertanggung jawab" }
text: "… عَنِ ابْنِ عُمَرَ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ يَا رَسُولَ اللَّهِ مَا يُوجِبُ الْحَجَّ قَالَ \" الزَّادُ وَالرَّاحِلَةُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَالْعَمَلُ عَلَيْهِ عِنْدَ أَهْلِ الْعِلْمِ أَنَّ الرَّجُلَ إِذَا مَلَكَ زَادًا وَرَاحِلَةً وَجَبَ عَلَيْهِ الْحَجُّ. وَإِبْرَاهِيمُ بْنُ يَزِيدَ هُوَ الْخُوزِيُّ الْمَكِّيُّ وَقَدْ تَكَلَّمَ فِيهِ بَعْضُ أَهْلِ الْعِلْمِ مِنْ قِبَلِ حِفْظِهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 813، يرد فيه ذكر ما يجب على المكلف. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 813 (The Book on Hajj), whose wording mentions what is binding on the person addressed. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 813، جس کے الفاظ میں جو مکلف پر واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 813, dont le texte mentionne ce qui s'impose à la personne responsable. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 813, cuyo texto menciona lo que obliga a la persona responsable. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 813 numaralı hadis, sorumlu bir kişi için farz olan şeylerden bahseder. Farz görevleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle bir araya getirir. Derleyen kişi metinde yer alanları açıklar, ancak buna dayanarak fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 813, menyebutkan apa yang wajib bagi orang yang bertanggung jawab. Penyusun kitab tentang kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
