label: { ar: "الموطأ 536 — مالك في آية الواقعة: إنما هي بمنزلة الآيات التي في سورة عبس", en: "Muwatta 536", es: "Muwatta 536", fr: "Muwatta 536", ur: "موطا 536", tr: "El-Muvatta 536 — Malik, El-Vakıa ayeti hakkında: Bu ayet, Abasa Suresi'ndeki ayetlere benzer.", id: "Al-Muwatta 536 — Malik tentang ayat Al-Waqi’ah: Ayat ini seperti ayat-ayat dalam Surah ‘Abasa" }
summary:
  ar: "قول لمالك: أحسن ما سمع في الآية التاسعة والسبعين من سورة الواقعة، في أنه لا يمسه إلا المطهرون [[passage/quran-56-79|الواقعة 79]]، أنها بمنزلة الآيات التي في سورة عبس عن التذكرة التي في صحف مكرمة بأيدي سفرة كرام بررة [[passage/quran-80-11|عبس 11–16]]، أي أن المقصود الملائكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.275} {cite:muwatta-maruf-1997 p.276}"
  tr: "Malik şöyle demiştir: Vakıa Suresi'nin 79. ayetinin, \"Ona ancak temiz olanlar dokunabilir\" ayetiyle ilgili en iyi tefsiri, Abasa Suresi'ndeki, şerefli ve salih kâtiplerin elinde bulunan kutsal kitaplardaki hatırlatma ayetlerine benzemesidir; yani kastedilenin melekler olduğudur. Araştırmacı, bunu Ebu Musab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.275} {cite:muwatta-maruf-1997 s.276}"
  id: "Malik berkata: Penafsiran terbaik ayat 79 Surah Al-Waqi'ah, mengenai ayat yang menyatakan bahwa tidak seorang pun boleh menyentuhnya kecuali orang-orang yang suci [[passage/quran-56-79|Al-Waqi'ah 79]], adalah bahwa ayat tersebut seperti ayat-ayat dalam Surah 'Abasa mengenai Peringatan yang terdapat dalam kitab suci yang mulia di tangan para penulis yang mulia dan saleh [[passage/quran-80-11|'Abasa 11-16]], artinya maksud yang dimaksud adalah para malaikat. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.275} {cite:muwatta-maruf-1997 p.276}"
