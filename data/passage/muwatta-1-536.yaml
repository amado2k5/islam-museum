summary:
  ar: "قول لمالك: أحسن ما سمع في الآية التاسعة والسبعين من سورة الواقعة، في أنه لا يمسه إلا المطهرون [[passage/quran-56-79|الواقعة 79]]، أنها بمنزلة الآيات التي في سورة عبس عن التذكرة التي في صحف مكرمة بأيدي سفرة كرام بررة [[passage/quran-80-11|عبس 11–16]]، أي أن المقصود الملائكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.275} {cite:muwatta-maruf-1997 p.276}"
