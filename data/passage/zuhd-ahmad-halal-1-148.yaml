text: "… وَفِيهِ قُبِضَ، وَفِيهِ النَّفْخَةُ، وَفِيهِ الصَّعْقَةُ فَأَكْثِرُوا عَلَيَّ مِنْ الصَّلاةِ فِيهِ، فَإِنَّ صَلَاتَكُمْ مَعْرُوضَةٌ عَلَيَّ. قَالَ: قَالُوا يَا رَسُولَ اللّهَ وَكَيْفَ تُعْرَضُ صَلاتُنَا عَلَيْكَ وَقَدْ أَرِمُتَ؟ - يَقُولُونَ: بَلِيتٌ؟! - فَقَالَ: إِنَّ اللهَ وعَلِ حَرَّمَ عَلَى الأَرْضِ أَجْسَادَ الأَنْبِيَاءِ. تقدم …"
