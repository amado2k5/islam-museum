label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 191 — الأحرف السبعة، القراء", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 191 — the seven ahruf; the readers", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 191 — سبعہ احرف، قراء", es: "Al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, escaneo del volumen 1, pág. 191 — los siete ahruf; los lectores", fr: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 191 — les sept ahruf; les lecteurs", tr: "El-İtkan fi Ulumü'l-Kur'an, el-Suyuti, Resimli Cilt 1, s. 191 — Yedi Okuma, Okuyanlar", id: "Al-Itqan fi Ulum al-Qur'an karya al-Suyuti, Illustrated Volume 1, hal. 191 - Tujuh Bacaan, Pembaca" }
text: "… نقص العلم وقال مكي من فلن ان قراءة لهؤلاء القراء كنافع وعاهم هي الاحرف السبعة التي فى الحديث فقد غلط غلطا عظيما قال ويازم من هنما ان ماخرج عن قواءة لمؤلاء السبعة مماثبت من الائمة غيرهم و وافق خط المصحف …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 191، يذكر الأحرف السبعة، والقراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 191, that mentions the seven ahruf, the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 191 کا اقتباس جس میں سبعہ احرف، قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 1, pág. 191, que menciona los siete ahruf, los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 1, page 191, mentionnant les sept ahruf, les lecteurs, la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 1. cildinin 191. sayfasından, Kur'an'ın yedi okunuş şeklini, okuyucularını, derlenmesini ve el yazmalarını, ayrıca Kur'an'ın yazısını ele alan bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 1, halaman 191, yang membahas tujuh cara pembacaan, para qari, penyusunan Al-Qur'an dan manuskripnya, serta aksara Al-Qur'an; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam pembacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
