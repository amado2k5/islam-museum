label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 191 — الأحرف السبعة، القراء", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 191 — the seven ahruf; the readers", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 191 — سبعہ احرف، قراء" }
text: "… نقص العلم وقال مكي من فلن ان قراءة لهؤلاء القراء كنافع وعاهم هي الاحرف السبعة التي فى الحديث فقد غلط غلطا عظيما قال ويازم من هنما ان ماخرج عن قواءة لمؤلاء السبعة مماثبت من الائمة غيرهم و وافق خط المصحف …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 191، يذكر الأحرف السبعة، والقراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 191, that mentions the seven ahruf, the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 191 کا اقتباس جس میں سبعہ احرف، قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
