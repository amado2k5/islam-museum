label: { ar: "الموطأ 2809 — ابن عمر: العبد إذا نصح لسيده وأحسن عبادة الله فله أجره مرتين", en: "Muwatta 2809", es: "Muwatta 2809", fr: "Muwatta 2809", ur: "موطا 2809", tr: "İbn Umar: El-Muvatta 2809: Bir kul efendisine karşı samimi olup Allah'a hakkıyla ibadet ederse, sevabını iki katıyla kazanır.", id: "Al-Muwatta 2809 — Ibn Umar: Jika seorang hamba tulus kepada tuannya dan beribadah kepada Allah dengan baik, maka ia akan mendapat pahala dua kali lipat." }
summary:
  ar: "يروي مالك عن نافع، عن عبد الله بن عمر أن النبي قال: إن العبد إذا نصح لسيده وأحسن عبادة الله فله أجره مرتين. {cite:muwatta-maruf-1997 p.577}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Peygamberimizin şöyle buyurduğunu nakletmiştir: \"Bir kul efendisine karşı samimi olur ve Allah'a güzelce ibadet ederse, sevabını iki katıyla kazanır.\" {cite:muwatta-maruf-1997 s.577}"
  id: "Malik meriwayatkan dari Nafi’, dari Abdullah ibn Umar, bahwa Nabi bersabda: “Jika seorang hamba tulus kepada tuannya dan beribadah kepada Allah dengan sungguh-sungguh, maka ia akan mendapat pahala dua kali lipat.” {cite:muwatta-maruf-1997 p.577}"
