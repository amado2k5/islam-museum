text: "… ولا تتطيب، ولا نَخْتَصِب، ولا تلبَسُ المعصفر، ولا ثوباً مصبوغاً، ولا برداً، ولا تتزين بِحلي، ولا تلبَسُ شيئاً تُريد به الزينة، ولا تكتحِلُ بكُحل تُريد به الزينة، إلا أن تشتكي عينها. وصحَّ عنه من طريق عبد الرزاق، عن سفيان الثوري، …"
