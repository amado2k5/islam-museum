text: "… قبل أن يولد له، وكان ممن يعذب في الله، فعذب عذابًا شديدا. ولما أراد الهجرة منعته قريش، فافتدى نفسه منهم بماله أجمع، وجعله عمر ابن الخطاب عند موته يصلي بالناس إلى أن يستخلف بعض أهل الشورى، وتوفي بالمدينة في شوال …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 559، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 3, p. 559, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 3، ص 559 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
