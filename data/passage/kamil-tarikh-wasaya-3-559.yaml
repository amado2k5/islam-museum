  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 3. cildinin 559. sayfasından bir alıntı, vasiyetname veya son vasiyetten ve ölüm saatinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir baskıdan alınmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
