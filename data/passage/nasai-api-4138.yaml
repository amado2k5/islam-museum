label: { ar: "سنن النسائي 4138 — ما أُحل، ما لا يحل", en: "Sunan al-Nasa'i 4138 — what was made lawful; what is not lawful", ur: "سنن نسائی 4138 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… الْبَاهِلِيِّ، عَنْ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ أَخَذَ رَسُولُ اللَّهِ يَوْمَ حُنَيْنٍ وَبَرَةً مِنْ جَنْبِ بَعِيرٍ فَقَالَ \" يَا أَيُّهَا النَّاسُ إِنَّهُ لاَ يَحِلُّ لِي مِمَّا أَفَاءَ اللَّهُ عَلَيْكُمْ قَدْرَ هَذِهِ إِلاَّ الْخُمُسُ وَالْخُمُسُ مَرْدُودٌ عَلَيْكُمْ \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ اسْمُ أَبِي سَلاَّمٍ مَمْطُورٌ وَهُوَ حَبَشِيٌّ وَاسْمُ أَبِي أُمَامَةَ صُدَىُّ بْنُ عَجْلاَنَ وَاللَّهُ تَعَالَى أَعْلَمُ."
summary:
  ar: "حديث في سنن النسائي، رقم 4138، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4138 (The Book of Distribution of Al-Fay'), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4138، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
