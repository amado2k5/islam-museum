summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن رسول الله قال: نار بني آدم التي يوقدونها جزء من سبعين جزءا من نار جهنم. فقالوا: يا رسول الله، إن كانت لكافية! قال: إنها فضلت عليها بتسعة وستين جزءا. {cite:muwatta-maruf-1997 p.593}"
