label: { ar: "الموطأ 2842 — أبو هريرة: نار بني آدم جزء من سبعين جزءا من نار جهنم", en: "Muwatta 2842", es: "Muwatta 2842", fr: "Muwatta 2842", ur: "موطا 2842", tr: "El-Muvatta 2842 — Ebu Hurayra: Âdem oğullarının ateşi, cehennem ateşinin yetmiş kısmından biridir.", id: "Al-Muwatta 2842 — Abu Hurairah: Api neraka anak Adam adalah satu bagian dari tujuh puluh bagian api neraka." }
summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن رسول الله قال: نار بني آدم التي يوقدونها جزء من سبعين جزءا من نار جهنم. فقالوا: يا رسول الله، إن كانت لكافية! قال: إنها فضلت عليها بتسعة وستين جزءا. {cite:muwatta-maruf-1997 p.593}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Âdem oğullarının yaktığı ateş, cehennem ateşinin yetmiş katının bir katıdır.\" Sahabeler: \"Ey Allah Resulü, bu yeterli olurdu!\" dediler. O da: \"Bu ateş, cehennem ateşinin altmış dokuz katı kadar daha büyüktür.\" diye buyurdu. {cite:muwatta-maruf-1997 s.593}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah bahwa Rasulullah SAW bersabda: \"Api yang dinyalakan oleh anak Adam adalah satu bagian dari tujuh puluh bagian api neraka.\" Mereka berkata: \"Wahai Rasulullah, itu sudah cukup!\" Beliau bersabda: \"Telah dijadikan lebih besar darinya sebanyak enam puluh sembilan bagian.\" {cite:muwatta-maruf-1997 p.593}"
