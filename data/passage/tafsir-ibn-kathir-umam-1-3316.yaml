text: "… وليه حتى فتح اللّٰه عليه مكة وخيبر والبحرين، وسائر جزيرة العرب وأرض اليمن بكمالها. وأخذ الجزية من مَجُوس هَجَر، ومن بعض أطراف الشَّام، وهاداه هرقل ملك الروم وصاحب مصر والإسكندرية - وهو المقوقس- وملوك عمان والنجاشي ملك الحبشة الذي تَملَّك …"
