label: { ar: "صحيح البخاري 7556 — الشهادة والصلاة والزكاة، ركن من أركان الإيمان", en: "Sahih al-Bukhari 7556 — the testimony, the prayer and the zakat; one of the articles of faith", ur: "صحیح بخاری 7556 — شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن", es: "Sahih al-Bukhari 7556 — el testimonio, la oración y el zakat; uno de los artículos de fe" }
text: "… حُرُمٍ، فَمُرْنَا بِجُمَلٍ مِنَ الأَمْرِ، إِنْ عَمِلْنَا بِهِ دَخَلْنَا الْجَنَّةَ، وَنَدْعُو إِلَيْهَا مَنْ وَرَاءَنَا. قَالَ \" آمُرُكُمْ بِأَرْبَعٍ وَأَنْهَاكُمْ عَنْ أَرْبَعٍ، آمُرُكُمْ بِالإِيمَانِ بِاللَّهِ، وَهَلْ تَدْرُونَ مَا الإِيمَانُ بِاللَّهِ شَهَادَةُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ، وَإِقَامُ الصَّلاَةِ، وَإِيتَاءُ الزَّكَاةِ، وَتُعْطُوا مِنَ الْمَغْنَمِ الْخُمُسَ، وَأَنْهَاكُمْ عَنْ أَرْبَعٍ لاَ تَشْرَبُوا فِي الدُّبَّاءِ، وَالنَّقِيرِ، وَالظُّرُوفِ الْمُزَفَّتَةِ، وَالْحَنْتَمَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7556، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 7556 (Oneness, Uniqueness of Allah (Tawheed)), that mentions the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 7556، جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 7556 (Unicidad de Alá (Tawhid)), menciona el testimonio, la oración y el zakat, uno de los pilares de la fe. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
