label: { ar: "الموطأ 2206 — مالك عن نافع: أن رجلا وجد لقطة، فجاء إلى عبد الله بن عمر فسأله، فقال له عبد الله: عرفها. قال: قد فعلت. قال: زد. قال: قد فعلت. فقال عبد الله: لا آمرك أن تأكلها، ولو شئت لم تأخذها", en: "Muwatta 2206" }
summary:
  ar: "يروي مالك عن نافع أن رجلا وجد لقطة، فجاء إلى عبد الله بن عمر فقال: إني وجدت لقطة، فماذا ترى فيها؟ فقال له عبد الله: عرفها. قال: قد فعلت. قال: زد. قال: قد فعلت. فقال عبد الله: لا آمرك أن تأكلها، ولو شئت لم تأخذها. {cite:muwatta-maruf-1997 p.304}"
