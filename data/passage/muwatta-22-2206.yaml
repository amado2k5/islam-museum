label: { ar: "الموطأ 2206 — مالك عن نافع: أن رجلا وجد لقطة، فجاء إلى عبد الله بن عمر فسأله، فقال له عبد الله: عرفها. قال: قد فعلت. قال: زد. قال: قد فعلت. فقال عبد الله: لا آمرك أن تأكلها، ولو شئت لم تأخذها", en: "Muwatta 2206", es: "Muwatta 2206", fr: "Muwatta 2206", ur: "موطا 2206", tr: "El-Muvatta 2206 — Malik, Nafi’den rivayetle: Bir adam kayıp bir eşya buldu ve Abdullah ibn Umar’a gidip ona sordu. Abdullah ona, “Bunu duyur” dedi. Adam, “Öyle yaptım” dedi. Abdullah, “Daha da duyur” dedi. Adam, “Daha da duyurdum” dedi. Abdullah, “Sana onu yemeni emretmiyorum, istersen yememeyi de seçebilirdin” dedi.", id: "Al-Muwatta 2206 — Malik berdasarkan riwayat Nafi’: Seorang pria menemukan barang yang hilang dan pergi kepada Abdullah ibn Umar dan menanyakan tentang barang tersebut. Abdullah berkata kepadanya, “Sebarkanlah.” Pria itu menjawab, “Sudah saya lakukan.” Abdullah berkata, “Sebarkanlah lebih banyak lagi.” Pria itu menjawab, “Sudah saya lakukan.” Abdullah berkata, “Aku tidak memerintahkanmu untuk memakannya, dan jika kamu mau, kamu bisa saja memilih untuk tidak memakannya.”" }
summary:
  ar: "يروي مالك عن نافع أن رجلا وجد لقطة، فجاء إلى عبد الله بن عمر فقال: إني وجدت لقطة، فماذا ترى فيها؟ فقال له عبد الله: عرفها. قال: قد فعلت. قال: زد. قال: قد فعلت. فقال عبد الله: لا آمرك أن تأكلها، ولو شئت لم تأخذها. {cite:muwatta-maruf-1997 p.304}"
  tr: "Malik, Nafi'den rivayetle, bir adamın kayıp bir eşya bulduğunu ve Abdullah ibn Umar'a giderek, \"Kayıp bir eşya buldum, sence ne yapmalıyım?\" dediğini aktarır. Abdullah ona, \"İlan et\" dedi. Adam, \"İlan ettim\" dedi. Abdullah, \"Daha çok ilan et\" dedi. Adam, \"Daha da ilan ettim\" dedi. Abdullah, \"Sana onu yemeni söylemiyorum, istersen yemeyebilirsin\" dedi. {cite:muwatta-maruf-1997 s.304}"
  id: "Malik meriwayatkan dari Nafi’ bahwa seorang pria menemukan barang yang hilang dan pergi kepada Abdullah ibn Umar dan berkata, “Aku menemukan barang yang hilang, menurutmu apa yang harus kulakukan dengannya?” Abdullah berkata kepadanya, “Umumkanlah.” Pria itu berkata, “Sudah kulakukan.” Abdullah berkata, “Umumkanlah lebih lagi.” Pria itu berkata, “Sudah kulakukan.” Abdullah berkata, “Aku tidak menyuruhmu untuk memakannya, dan jika kamu mau, kamu boleh tidak memakannya.” {cite:muwatta-maruf-1997 p.304}"
