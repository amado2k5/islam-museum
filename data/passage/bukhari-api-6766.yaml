label: { ar: "صحيح البخاري 6766 — الأب والأبوة، النسب والانتساب", en: "Sahih al-Bukhari 6766 — the father and fatherhood; paternity and lineage", ur: "صحیح بخاری 6766 — باپ اور والدیت، نسب اور انتساب", es: "Sahih al-Bukhari 6766 — El padre y la paternidad; paternidad y linaje", fr: "Sahih al-Bukhari 6766 — le père et la paternité; la paternité et la lignée", tr: "Sahih el-Buhari 6766 — Baba ve babalık, soy ve akrabalık", id: "Sahih al-Bukhari 6766 — Ayah dan kebapaan, garis keturunan dan afiliasi" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا خَالِدٌ ـ هُوَ ابْنُ عَبْدِ اللَّهِ ـ حَدَّثَنَا خَالِدٌ، عَنْ أَبِي عُثْمَانَ، عَنْ سَعْدٍ ـ قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ \" مَنِ ادَّعَى إِلَى غَيْرِ أَبِيهِ، وَهْوَ يَعْلَمُ أَنَّهُ غَيْرُ أَبِيهِ، فَالْجَنَّةُ عَلَيْهِ حَرَامٌ \". فَذَكَرْتُهُ لأَبِي بَكْرَةَ فَقَالَ وَأَنَا سَمِعَتْهُ أُذُنَاىَ، وَوَعَاهُ، قَلْبِي مِنْ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6766، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6766, that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6766، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6766, menciona al padre y la paternidad, la linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Le Sahih al-Bukhari, n° 6766, mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sahih el-Buhari'de 6766 numaralı hadis, babalık, soy ve atalık kavramlarından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6766, menyebutkan tentang ayah, garis keturunan, dan leluhur. Peramban \"Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
