text: |-
  ٣٣٣
  ثم يجمع على أساطير وجمع السطر أسطروسطور مثل أفلس وفلوس والاساطير الاباطيسل
  الواحد أسطورة بالضم وإسطارة بالكسر وسطر يسط رسطراكتب واستطر مثله والمسيطر
  والمصيطر المسلط على الشئ ليشرف عليه ويتعهد أحواله ويكتب عله وأصله من السطرلان
  الكتاب مطر والذى يفعله مسطر ومسيطر يقال سيطرت علينا وقال اقه تعالى لست عليهم
  سيطر وسطره أى صرعه والمطار بكسر الميم ضرب من الشراب فيه حوضة وبالصاد
  أيضا ⁦(سعر)⁩ سعرت التاروالحرب هيجتهما وألهيتهما وقرى واذا ابلخسيم سعرت
  وسعرت أيضا بالتشديد للمبالغة وسعر ناهم بالنبل أى أحرقناهم وأمضضناهم ويقال
  ضرب هبروط عنة نزور مى سعر والمعر والمعار انلحشب الذى قسعر به النار ومنه قسل
  للرجل أنه لسه رحرب أى تحمى به الحرب والمعر أيضا الطويل ومعر بن كدام الهمدّْث
  جهله أحجاب الحديث مسعرابالفتح للتفاول ومساعر الابل آباطها وارفاعها واستعر الجرب
  فى البعبراذا ايتدأ يمسناعره قال الناعر ذوالرمة قريع هجان دس منه الماعر
  واستعرت النار وتسعرت أى توقدت واستعر اللصوص كانهم اشتعلوا والسعير النار
  والسعيرف قول الشاعر
  حافت بمائرات حول عوض • وأنصاب زكن لدى السعير
  قال ابن الكلبى هواءم صنم كان لعنزة والسعار بالضم حرالنار وشدة الجوع أيضا وقوله
  تع الى ان الجرمين فى ضلال وسعر قال الفزاء العناء والهذاب خاصة والسعر أيضا الجنون
  بقال ناقة مسسعورة أى مجنونة وقوله تعالى وكنى عجهنم سعيرا قال الاخفش هو مثل دهين
  وصريع لانك تقول سعرت فهى مسعورة وسعرت اليوم فى حاجتى سعرأى طفت ابن
  السكيت يقال سعرهم شرا أى أوسعهم قال ولا يقال أسعرهم وسمى الاسعر الجعلى بقوله
  فلايدعنى الاقوام من آل مالك • اذا أنا لم أسعرعليهم وأثقب
  والسعرارة الهباء فى الشمس والسعر واحد أسعار الطعام والتعير تقدير السعر
  واليستعور الذى فى شعر عروة موضع ويقال شجر وسعر الرجل فه ومسعوراذاضربتسه
  السموم والسعرقلون الى السواد عتر السعترنيت وبعضهم يكتبه بالصادف كتب
  الطب لثلايلتبس بالشعير ⁦(سر)⁩ السفرقطع المسافة وابهع الاسفار والسفرأيضا بياض
  النهار قال الساجع اذاطلعت الشعرى سفرا والسفرة الكتبة قال اللّٰه تعالى بأيدى
  سفرة قال الاخفسْ واحدهم سافر مثل كافروكفرة والسفر بالكر الكاب والمع أسفار
  قال اللّٰه تعالى كثل الهار يحمل أسفارا والسقرة بالضم طعام يتغذلامسافرومن-ه سحيت
  لسفرة والسفير ماسقط من ورق الشجر وتحات يقال اغماسمى سفيرالان الريح تسفره أى
  نكفسه والمسفرة المكنسة والرياح بسافر بعضها بعضالان الصبانسفر ما أسدته الدبور
  والجنوب تطمه والسفير الرسول والمصلح بين القوم والهع سفراء مشل فقيه وفتهاء وسفرت
  بين القوم أسفرسفارة أصلحت وسفرت الكتاب أسفره سفرا وسفرت المرأة كشفت
  •ن وجهها فهى سافر ومسافر الوجه ما يظهر منه قال الشاعرامر والقيس
  ثياب بنى عوف طهارنقية • وأوجههم بيض المسافر غزات
