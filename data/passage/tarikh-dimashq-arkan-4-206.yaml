text: "… السَبَّاك بالبَصرة، نا أبُو خليفة، نا أبو قعنب، عن عَبد العزيز بن محمّد عن العلاء بن عَبد الرَّحمْن، عن أبيه، عن أبي هُريرَة قال: قال رَسُول اللّٰه وَلِلِمِ يَا رَسُول الله؟ قالَ: إذا لقيه حَقّ المُسلم على المسلم ستّ قالوا …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 206، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
