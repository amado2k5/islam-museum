label: { ar: "صحيح البخاري 5089 — الأب والأبوة", en: "Sahih al-Bukhari 5089 — the father and fatherhood", ur: "صحیح بخاری 5089 — باپ اور والدیت" }
text: "حَدَّثَنَا عُبَيْدُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ دَخَلَ رَسُولُ اللَّهِ عَلَى ضُبَاعَةَ بِنْتِ الزُّبَيْرِ فَقَالَ لَهَا \" لَعَلَّكِ أَرَدْتِ الْحَجَّ \". قَالَتْ وَاللَّهِ لاَ أَجِدُنِي إِلاَّ وَجِعَةً. فَقَالَ لَهَا \" حُجِّي وَاشْتَرِطِي، قُولِي اللَّهُمَّ مَحِلِّي حَيْثُ حَبَسْتَنِي \". وَكَانَتْ تَحْتَ الْمِقْدَادِ بْنِ الأَسْوَدِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5089، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5089 (Wedlock, Marriage (Nikaah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5089، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
