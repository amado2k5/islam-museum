label: { ar: "الموطأ 1000 — بلغ مالكاً أن سعيد بن المسيب وسالم بن عبد الله وسليمان بن يسار سئلوا عن نكاح المحرم: لا ينكح المحرم ولا ينكح", en: "Muwatta 1000", es: "1000 palabras", fr: "1000 mots", ur: "1000 الفاظ", tr: "El-Muvatta 1000 — Malik'e, Said bin el-Musayyab, Salim bin Abdullah ve Süleyman bin Yaşar'a ihramlı bir kişinin evliliği hakkında soru sorulduğu rivayet edilmiştir: İhramlı bir kişi evlenmemeli, kimseyi de evlendirmeyecektir.", id: "Al-Muwatta 1000 — Diriwayatkan kepada Malik bahwa Saeed bin Al-Musayyab, Salim bin Abdullah, dan Sulaiman bin Yasar ditanya tentang pernikahan seseorang yang sedang ihram: Seseorang yang sedang ihram tidak boleh menikah, dan tidak pula boleh menikahkan seseorang." }
text: "لا ينكح المحرم ولا ينكح"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن سعيد بن المسيب وسالم بن عبد الله وسليمان بن يسار سئلوا عن نكاح المحرم، فقالوا: لا ينكح المحرم ولا ينكح. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1180). {cite:muwatta-maruf-1997 p.469}"
  tr: "Malik, Sa'id ibn al-Musayyab, Salim ibn 'Abd Allah ve Sulayman ibn Yasar'a ihramlı haldeyken evlilik hakkında soru sorulduğunu ve onların \"İhramlı olan kişi ne evlenmeli ne de evlendirmelidir\" dediklerini duyduğunu bildirmiştir. Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (ö. 1180) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.469}"
  id: "Malik meriwayatkan bahwa ia mendengar Sa'id ibn al-Musayyab, Salim ibn 'Abd Allah, dan Sulayman ibn Yasar ditanya tentang pernikahan saat dalam keadaan ihram, dan mereka berkata: \"Seseorang yang sedang ihram tidak boleh menikah dan tidak pula dinikahkan.\" Peneliti menyebutkan bahwa Abu Mus'ab (wafat 1180) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.469}"
