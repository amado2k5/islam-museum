label: { ar: "سنن النسائي 5730 — ما لا يحل", en: "Sunan al-Nasa'i 5730 — what is not lawful", ur: "سنن نسائی 5730 — جو حلال نہیں" }
text: "أَخْبَرَنَا سُوَيْدٌ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ، عَنِ ابْنِ جُرَيْجٍ، قِرَاءَةً أَخْبَرَنِي عَطَاءٌ، قَالَ سَمِعْتُ ابْنَ عَبَّاسٍ، يَقُولُ وَاللَّهِ مَا تُحِلُّ النَّارُ شَيْئًا وَلاَ تُحَرِّمُهُ. قَالَ ثُمَّ فَسَّرَ لِي قَوْلَهُ لاَ تُحِلُّ شَيْئًا لِقَوْلِهِمْ فِي الطِّلاَءِ وَلاَ تُحَرِّمُهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 5730، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5730 (The Book of Drinks), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5730، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
