text: "عن أيه، أن رسول اللّه واته مر برجل يعظ أخاه فى الحياء. فقال دعه، فان الحياء من الإيمان حدّثنا عبد اللّه قال : حدثنى عبد العزيز بن أبى سلمة، عن ابن شهاب، عن سالم، عن ابن عمر قال : مر …"
summary:
