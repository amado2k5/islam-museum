label: { ar: "الموطأ 1834 — مالك: كل شيء حاضر يشترى على وجهه، كاللبن إذا حلب والرطب يجتنى، فيأخذ المبتاع يوما بيوم فلا بأس، فإن فنى قبل الاستيفاء رد البائع ذهبه بحساب ما بقي، ويكره أن يفارقه قبل أن يأخذ", en: "Muwatta 1834", es: "Muwatta 1834", fr: "Muwatta 1834", ur: "موطا 1834", tr: "El-Muvatta 1834 — Malik: Sütün sağıldığı an veya hurmanın toplandığı an gibi, olduğu gibi satın alınan her şey, alıcı tarafından gün gün alınabilir ve bunda bir sakınca yoktur. Eğer alıcı almadan önce tüketilirse, satıcı kalan miktara göre altınını iade eder ve satıcının almadan önce ayrılması mekruhtur.", id: "Al-Muwatta 1834 — Malik: Apa pun yang dibeli apa adanya, seperti susu setelah diperah atau kurma setelah dipetik, pembeli boleh mengambilnya hari demi hari dan tidak ada salahnya. Jika dikonsumsi sebelum diambil, penjual mengembalikan emasnya sesuai dengan yang tersisa, dan tidak disukai jika ia pergi sebelum mengambilnya." }
summary:
  ar: "قال مالك: وأما كل شيء كان حاضرا يشترى على وجهه، مثل اللبن إذا حلب، والرطب يستجنى، فيأخذ المبتاع يوما بيوم: فلا بأس به. فإن فنى قبل أن يستوفي المشتري ما اشترى، رد عليه البائع من ذهبه بحساب ما بقي له، أو يأخذ منه المشتري سلعة بما بقي له، يتراضيان عليها، ولا يفارقه حتى يأخذها. فإن فارقه فإن ذلك مكروه؛ لأنه يدخله الدين بالدين، وقد نهي عن الكالئ بالكالئ. {cite:muwatta-maruf-1997 p.152} {cite:muwatta-maruf-1997 p.153}"
  tr: "Malik şöyle dedi: Sütün sağıldığı an gibi veya hurmaların toplandığı an gibi, hazır bulunan ve olduğu gibi satın alınan her şeyde, alıcının gün gün teslim aldığı bir sakınca yoktur. Eğer alıcı satın aldığı şeyi teslim almadan önce tüketirse, satıcı kalan miktara göre altınından ona geri vermelidir; ya da alıcı, karşılıklı anlaşma ile kalan miktar karşılığında satıcıdan mal alabilir ve bunları alana kadar satıcıyı terk etmemelidir. Eğer terk ederse, bu hoş karşılanmaz çünkü bu, borç karşılığı borç anlamına gelir ve ertelenmiş ödeme karşılığı ertelenmiş ödeme yasaktır. {cite:muwatta-maruf-1997 s.152} {cite:muwatta-maruf-1997 s.153}"
  id: "Malik berkata: Adapun barang apa pun yang mudah didapat dan dibeli apa adanya, seperti susu yang sedang diperah, atau kurma yang sedang dipanen, dan pembeli mengambilnya sedikit demi sedikit, tidak ada yang salah dengan itu. Jika dikonsumsi sebelum pembeli mengambil alih apa yang dibelinya, penjual harus mengembalikan sebagian emasnya kepada pembeli sesuai dengan jumlah yang tersisa, atau pembeli dapat mengambil barang darinya sebagai ganti barang yang tersisa, dengan kesepakatan bersama, dan penjual tidak boleh meninggalkannya sampai pembeli mengambilnya. Jika penjual meninggalkannya, itu tidak disukai karena melibatkan hutang untuk hutang, dan pembayaran tertunda untuk pembayaran tertunda telah dilarang. {cite:muwatta-maruf-1997 p.152} {cite:muwatta-maruf-1997 p.153}"
