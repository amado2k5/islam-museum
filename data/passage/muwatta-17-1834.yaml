label: { ar: "الموطأ 1834 — مالك: كل شيء حاضر يشترى على وجهه، كاللبن إذا حلب والرطب يجتنى، فيأخذ المبتاع يوما بيوم فلا بأس، فإن فنى قبل الاستيفاء رد البائع ذهبه بحساب ما بقي، ويكره أن يفارقه قبل أن يأخذ", en: "Muwatta 1834" }
summary:
  ar: "قال مالك: وأما كل شيء كان حاضرا يشترى على وجهه، مثل اللبن إذا حلب، والرطب يستجنى، فيأخذ المبتاع يوما بيوم: فلا بأس به. فإن فنى قبل أن يستوفي المشتري ما اشترى، رد عليه البائع من ذهبه بحساب ما بقي له، أو يأخذ منه المشتري سلعة بما بقي له، يتراضيان عليها، ولا يفارقه حتى يأخذها. فإن فارقه فإن ذلك مكروه؛ لأنه يدخله الدين بالدين، وقد نهي عن الكالئ بالكالئ. {cite:muwatta-maruf-1997 p.152} {cite:muwatta-maruf-1997 p.153}"
