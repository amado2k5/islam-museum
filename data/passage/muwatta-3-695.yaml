text: "هو المال الذي لا تؤدى منه الزكاة"
summary:
  ar: "أول حديث في باب ما جاء في الكنز. يرويه مالك عن عبد الله بن دينار، قال: سمعت عبد الله بن عمر وهو يُسأل عن الكنز ما هو، فقال: هو المال الذي لا تؤدى منه الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي في مسنده ومن طريقه البيهقي، وأن محمد بن الحسن الشيباني (341) رواه عن مالك عن نافع قال: سئل ابن عمر، بنحوه. {cite:muwatta-maruf-1997 p.348}"
