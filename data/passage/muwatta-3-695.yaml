label: { ar: "الموطأ 695 — ابن عمر سئل عن الكنز ما هو: هو المال الذي لا تؤدى منه الزكاة", en: "Muwatta 695", es: "Muwatta 695", fr: "Muwatta 695", ur: "موطا 695", tr: "El-Muvatta 695 — İbn Ömer'e biriktirilmiş servet soruldu: zekât verilmemiş paradır.", id: "Al-Muwatta 695 — Ibnu Umar ditanya tentang harta yang ditimbun: itu adalah uang yang tidak dizakati." }
text: "هو المال الذي لا تؤدى منه الزكاة"
summary:
  ar: "أول حديث في باب ما جاء في الكنز. يرويه مالك عن عبد الله بن دينار، قال: سمعت عبد الله بن عمر وهو يُسأل عن الكنز ما هو، فقال: هو المال الذي لا تؤدى منه الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي في مسنده ومن طريقه البيهقي، وأن محمد بن الحسن الشيباني (341) رواه عن مالك عن نافع قال: سئل ابن عمر، بنحوه. {cite:muwatta-maruf-1997 p.348}"
  tr: "Biriktirilmiş servet hakkında rivayet edilenler bölümündeki ilk hadis. Malik, Abdullah ibn Dinar'dan rivayet etmiştir. Abdullah ibn Dinar şöyle demiştir: Abdullah ibn Ömer'e biriktirilmiş servet hakkında soru sorulduğunu işittim ve o şöyle dedi: Bu, zekâtı ödenmemiş servettir. Araştırmacı, bunun Malik'ten Ebu Musab ve Şafiî tarafından Musned'inde ve onun isnadından Beyhaki tarafından nakledildiğini belirtmektedir. Ayrıca Muhammed ibn Hasan el-Şeybani'nin (341) bunu Malik'ten, o da Nafiî'den rivayet ettiği ve İbn Ömer'e benzer bir şey sorulduğu belirtilmiştir. {cite:muwatta-maruf-1997 s.348}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang diriwayatkan mengenai harta yang ditimbun. Diriwayatkan oleh Malik dari Abdullah ibn Dinar, yang berkata: Aku mendengar Abdullah ibn Umar ditanya tentang harta yang ditimbun, dan dia berkata: Itu adalah harta yang tidak dizakati. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab dan al-Shafi'i dalam Musnadnya, dan dari sanadnya oleh al-Bayhaqi. Disebutkan juga bahwa Muhammad ibn al-Hasan al-Shaybani (341) meriwayatkannya dari Malik dari Nafi', yang berkata: Ibn Umar ditanya hal yang serupa. {cite:muwatta-maruf-1997 p.348}"
