text: "… حِينَ يَهْوِي سَاجِدًا، ثُمِّ. رَبّنَا وَلَكَ الْحَمْدُ، وَإِذَا صَلَّى قَاعِدًا فَصَلَّوْا قُعُودًا،. رَبِّي بِكَ وَضَعْتُ جَنْبِي، وَبِكَ أرْفَعُهُ،. رَبِّي، قَالَ:. رَبِّي وَرَبُّكَ اللَّهُ، فَأخَذَهُ فَلَمْ يَزَلْ يُعَذَّبهُ حَتَّى دَلُ عَلَى رَبِّي، وَلَكِنْ لِيَقُلْ: رَبِّي، وَلْيَقُلْ:. رَثَى لَهُ رَسُولُ اللَّهِ مِنْ …"
summary:
  ar: "مقطع من المنهاج شرح صحيح مسلم بن الحجاج، المجلد المصوَّر 1، ص 1874، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, scan volume 1, p. 1874, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
