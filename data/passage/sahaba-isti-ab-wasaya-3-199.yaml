text: "… طعنةٌ أَو رَمْية، ثم ها أنا ذا الجبناء. وتُوُفِّيَ خالدُ بن الوليدِ بحِمْص. وقِيل : بل تُوُفِّيَ بالمدينة سنة إحدى وعشرين. وقِيل : بل تُوُفِّيَ بحمص ودفن في قرية على ميلٍ من حمص سنة بن الخَطَّاب، وأَوصَى إِلى عمرّ بن …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 199، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 199, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 199 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 3, pág. 199, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du traité al-Isti'ab d'Ibn 'Abd al-Barr (tome 3, p. 199) mentionnant un testament ou des adieux, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments Browser."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 3. cildinin 199. sayfasından bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsetmektedir; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid bergambar 3, halaman 199, menyebutkan surat wasiat atau testamen terakhir, pemakaman, kuburan, dan makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritance, Antiquities, and Tombs Browser."
