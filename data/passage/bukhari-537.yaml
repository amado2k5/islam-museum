label:
  ar: "البخاري 537 — أكل بعضي بعضا فأذن لها بنفسين"
  en: "Bukhari 537 — the Fire complains to its Lord and is given two breaths"
  ur: "بخاری 537 — أشتكت النار إلى ربها فأذن لها بنفسين"
text: "إذا اشتد الحر فأبردوا بالصلاة فإن شدة الحر من فيح جهنم واشتكت النار إلى ربها فقالت يا رب أكل بعضي بعضا فأذن لها بنفسين …"
summary:
  ar: "حديث قدسي في البخاري، رقم 537: أكل بعضي بعضا فأذن لها بنفسين. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Bukhari, no. 537: the Fire complains to its Lord and is given two breaths. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "بخاری میں حدیثِ قدسی، نمبر 537: أشتكت النار إلى ربها فأذن لها بنفسين۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
