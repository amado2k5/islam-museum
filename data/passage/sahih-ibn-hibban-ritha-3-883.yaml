text: "… ذكر الزجر عن نياحة النساء على موتاهن - أَخْبَرَنَا أَحْمَد بن عبد اللّٰه بحران قَالَ: حَدَّثَنَا النفيلي قَالَ: حدّثنا عبيد اللّٰه بن عَمْرُو، عَن يَحْيَى بن سَعِيْد، عَن عمرة، عَن عَائِشَة قالت: لما جاءَ نعي زَيْد بن حارثةَ وجعفر وعبد …"
summary:
  ar: "مقطع من صحيح ابن حبان ⁦(المسند الصحيح على التقاسيم والأنواع)⁩، المجلد المصوَّر 3، ص 883، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Sahih Ibn Hibban (al-Musnad al-Sahih 'ala al-Taqasim wa-al-Anwa'), scan volume 3, p. 883, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "صحیح ابن حبان ⁦(المسند الصحیح علی التقاسیم والانواع)⁩، اسکین جلد 3، ص 883 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban (al-Musnad al-Sahih 'ala al-Taqasim wa-al-Anwa'), volume numérisé 3, p. 883, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Sahih Ibn Hibban (al-Musnad al-Sahih 'ala al-Taqasim wa-al-Anwa'), volumen escaneado 3, p. 883, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Sahih İbn Hibban'ın (Al-Musnad Al-Sahih 'ala Al-Taqasim wa Al-Anwa') resimli 3. cildinin 883. sayfasından, bir ağıt ve ölüm ilanı içeren bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgülerin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Sahih Ibn Hibban (Al-Musnad Al-Sahih 'ala Al-Taqasim wa Al-Anwa'), jilid bergambar 3, halaman 883, berisi eulogi dan pengumuman kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari eulogi dan ratapan paling terkenal."
