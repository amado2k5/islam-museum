text: "… الأليم في الدنيا، كقوم نوح وما عذبهم اللّٰه به من الغرق العام لجميع أهل الأرض، وَعَادٌ وَفِرْعَوْنُ وَإِخْوَنُ لُوطٍ، وهم وأصحاب الرَّسِّ، وقد تقدمت قصتهم في سورة الفرقان، وَثَمُودُ أُمته الذين بعث إليهم من أهل سَدُوم ومعاملتها من الغور، وكيف …"
summary:
