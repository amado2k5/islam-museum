text: "… داود وغيرهما مرفوعاً: ألا إني أُوتيتُ الكتابَ ومثلَه معه، ألا يوشكُ رجلٌ شبعانُ على أَريكتِه يقول: عليكم بهذا القرآن، فما وجدتم فيه من حلال فأَحِلّوه، وما وجدتم فيه من حرام فحرِّموه. وإسناده صحيح. وحديث أبي رافع مولى النبي في عند …"
