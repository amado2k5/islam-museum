label: { ar: "سنن النسائي 2196 — مغفرة ما تقدم من الذنب", en: "Sunan al-Nasa'i 2196 — forgiveness of past sins", ur: "سنن نسائی 2196 — پچھلے گناہوں کی مغفرت", es: "Sunan al-Nasa'i 2196 — Perdón de los pecados pasados", fr: "Sunan al-Nasa'i 2196 — pardon des péchés passés", tr: "Sunan an-Nasa'i 2196 — Geçmiş günahların bağışlanması", id: "Sunan an-Nasa'i 2196 — Pengampunan dosa masa lalu" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ خَالِدٍ، قَالَ حَدَّثَنَا بِشْرُ بْنُ شُعَيْبٍ، عَنْ أَبِيهِ، عَنِ الزُّهْرِيِّ، قَالَ حَدَّثَنَا أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ لِرَمَضَانَ \" مَنْ قَامَهُ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2196، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2196 (The Book of Fasting), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2196، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2196 (El Libro del Ayuno), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2196 (Le Livre du jeûne), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de yer alan 2196 numaralı hadis, geçmiş günahların affedilmesinden bahsetmektedir. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 2196, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
