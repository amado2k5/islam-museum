text: "… أمر ندب لا أمر واجب، يدل على ذلك قول النبي وَالُ للأعرابي حيث ذكر خمس صلوات، فقال: هل علي غيرهن؟ قال: لا إلا أن تطوع. وقال النووي في شرحه على صحيح مسلم، باب استحباب تحية المسجد ركعتين : فيه استحباب …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 2، ص 271، يرد فيه ذكر الواجب، والمستحب، والمندوب، والتطوع، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 2, p. 271, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the recommended (mandub), the voluntary act (tatawwu'), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 2، ص 271 کا اقتباس جس میں واجب، مستحب، مندوب، تطوع ⁦(نفلی عمل)⁩، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Rajab, volume numérisé 2, p. 271, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), le recommandé (mandub), l'acte volontaire (tatawwu'), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen digitalizado 2, p. 271, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo recomendado (mandub), el acto voluntario (tatawwu'), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 2. cildinin 271. sayfasından, farz, tavsiye edilen, müstehap olan, gönüllü ve müstehap olan amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz, tavsiye edilen ve müstehap olan ameller, itaat amelleri, mekruh ve haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 2, halaman 271, yang menyebutkan amalan wajib, anjuran, amalan yang disukai, amalan sukarela, dan amalan yang diinginkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, anjuran, dan amalan yang disukai, amalan ketaatan, amalan yang tidak disukai dan dilarang, serta dosa-dosa kecil."
