label: { ar: "البخاري 3803 — اهتز العرش لموت سعد بن معاذ", en: "Bukhari 3803 — The Throne shook at Sa'd ibn Mu'adh's death", es: "Bukhari 3803 - El Trono se estremeció ante la muerte de Sa'd ibn Mu'adh", fr: "Boukhari 3803 — Le trône a tremblé à la mort de Sa'd ibn Mu'adh", ur: "بخاری 3803 - سعد بن معاذ کی وفات پر عرش ہل گیا", tr: "Buhari 3803 — Sa'd ibn Mu'adh'ın ölümüyle taht sarsıldı.", id: "Al-Bukhari 3803 — Singgasana berguncang saat Sa'd bin Mu'adh wafat" }
text: "سمعت النبي يقول: «اهتز عرش الرحمن لموت سعد بن معاذ». وعن الأعمش حدثنا أبو صالح عن جابر عن النبي مثله، فقال رجل لجابر: فإن البراء يقول اهتز السرير؟ فقال: إنه كان بين هذين الحيين ضغائن"
summary:
  ar: "في كتاب مناقب الأنصار؛ رواية جابر بسندين عن النبي في موت سيد الأوس بعد حكمه في بني قريظة، وفيه تصحيح جابر لرواية «اهتز السرير» وبيان سببها. من أشهر مناقب الصحابة إطلاقاً."
  tr: "*Manaqib al-Ansar* adlı kitapta, Peygamberimizden iki rivayet zinciriyle nakledilen, Beni Kurayza kabilesinin liderinin, onun hakkındaki hükmünden sonra ölümüyle ilgili olarak Cabir'den bir rivayet bulunmaktadır. Bu rivayet, Cabir'in \"oturma yatağının sallanması\" olayındaki hatayı düzeltmesini ve sebebini açıklamasını da içermektedir. Bu, Sahabelerin faziletlerine dair en meşhur rivayetler arasındadır."
  id: "Dalam kitab *Manaqib al-Ansar*, terdapat riwayat dari Jabir, dengan dua sanad dari Nabi, mengenai kematian kepala suku Aws setelah ia menjatuhkan hukuman kepada Bani Quraisy. Riwayat ini mencakup koreksi Jabir terhadap kisah \"tempat tidur yang berguncang\" dan penjelasan penyebabnya. Ini adalah salah satu kisah paling terkenal tentang keutamaan para Sahabat."
