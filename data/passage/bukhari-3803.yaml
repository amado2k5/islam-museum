label: { ar: "البخاري 3803 — اهتز العرش لموت سعد بن معاذ", en: "Bukhari 3803 — The Throne shook at Sa'd ibn Mu'adh's death" }
text: "سمعت النبي يقول: «اهتز عرش الرحمن لموت سعد بن معاذ». وعن الأعمش حدثنا أبو صالح عن جابر عن النبي مثله، فقال رجل لجابر: فإن البراء يقول اهتز السرير؟ فقال: إنه كان بين هذين الحيين ضغائن"
summary:
  ar: "في كتاب مناقب الأنصار؛ رواية جابر بسندين عن النبي في موت سيد الأوس بعد حكمه في بني قريظة، وفيه تصحيح جابر لرواية «اهتز السرير» وبيان سببها. من أشهر مناقب الصحابة إطلاقاً."
