label: { ar: "الموطأ 574 — دعاء النبي إذا قام إلى الصلاة من جوف الليل: اللهم لك الحمد أنت نور السماوات والأرض", en: "Muwatta 574", es: "Muwatta 574", fr: "Muwatta 574", ur: "موطا 574", tr: "El-Muvatta 574 — Peygamberimizin gece yarısı namaz için ayağa kalktığında yaptığı dua: Ey Allah'ım, hamd sana mahsustur, sen göklerin ve yerin nurusun.", id: "Al-Muwatta 574 — Doa Nabi ketika beliau berdiri untuk shalat di tengah malam: Ya Allah, segala puji bagi-Mu, Engkau adalah Cahaya langit dan bumi" }
text: "اللهم لك الحمد، أنت نور السماوات والأرض، ولك الحمد، أنت قيام السماوات والأرض، ولك الحمد، أنت رب السماوات والأرض ومن فيهن"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي عن طاووس اليماني عن عبد الله بن عباس، أن النبي كان إذا قام إلى الصلاة من جوف الليل افتتحها بدعاء طويل يحمد الله فيه بأنه نور السماوات والأرض وقيامهما وربهما ومن فيهن، ويقر بأنه الحق وقوله الحق ووعده الحق ولقاؤه حق والجنة حق والنار حق والساعة حق، ثم يعلن إسلامه له وإيمانه به وتوكله عليه وإنابته إليه، ويسأله أن يغفر له ما قدم وأخر وأسر وأعلن، ويختم بأنه إلهه لا إله إلا هو. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري في الأدب المفرد (697)، والقعنبي عند أبي داود (771)، وقتيبة عند مسلم (4/184) والنسائي في عمل اليوم والليلة، ومعن عند الترمذي (3418). {cite:muwatta-maruf-1997 p.296}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zubayr al-Makki, dari Tawus al-Yamani, dari Abdullah ibn Abbas, bahwa ketika Nabi (shalawat dan salam kepadanya) berdiri untuk shalat di tengah malam, beliau akan memulai dengan doa panjang yang memuji Allah sebagai Cahaya langit dan bumi, Pemelihara mereka, Tuhan mereka, dan segala sesuatu yang ada di dalamnya. Beliau menegaskan bahwa Allah adalah Kebenaran, firman-Nya adalah Kebenaran, janji-Nya adalah Kebenaran, bertemu dengan-Nya adalah Kebenaran, Surga adalah Kebenaran, Neraka adalah Kebenaran, dan Hari Kiamat adalah Kebenaran. Kemudian beliau menyatakan ketundukannya kepada-Nya, imannya kepada-Nya, ketergantungannya kepada-Nya, dan taubatnya kepada-Nya. Beliau memohon ampunan atas dosa-dosanya di masa lalu dan masa depan, baik yang tersembunyi maupun yang terang-terangan. Beliau mengakhiri dengan menegaskan bahwa Dialah Tuhan, tiada tuhan selain Dia. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Ibn Hibban dan al-Baghawi, dan oleh Ismail ibn Abi Uways dalam al-Adab al-Mufrad karya al-Bukhari (697), dan oleh al-Qa'nabi dalam Abu Dawud (771), dan oleh Qutaybah dalam Muslim (4/184), dan oleh al-Nasa'i dalam 'Amal al-Yawm wa al-Laylah, dan oleh Ma'n dalam al-Tirmidhi (3418)."
