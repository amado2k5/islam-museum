label: { ar: "الموطأ 574 — دعاء النبي إذا قام إلى الصلاة من جوف الليل: اللهم لك الحمد أنت نور السماوات والأرض", en: "Muwatta 574" }
text: "اللهم لك الحمد، أنت نور السماوات والأرض، ولك الحمد، أنت قيام السماوات والأرض، ولك الحمد، أنت رب السماوات والأرض ومن فيهن"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي عن طاووس اليماني عن عبد الله بن عباس، أن النبي كان إذا قام إلى الصلاة من جوف الليل افتتحها بدعاء طويل يحمد الله فيه بأنه نور السماوات والأرض وقيامهما وربهما ومن فيهن، ويقر بأنه الحق وقوله الحق ووعده الحق ولقاؤه حق والجنة حق والنار حق والساعة حق، ثم يعلن إسلامه له وإيمانه به وتوكله عليه وإنابته إليه، ويسأله أن يغفر له ما قدم وأخر وأسر وأعلن، ويختم بأنه إلهه لا إله إلا هو. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري في الأدب المفرد (697)، والقعنبي عند أبي داود (771)، وقتيبة عند مسلم (4/184) والنسائي في عمل اليوم والليلة، ومعن عند الترمذي (3418). {cite:muwatta-maruf-1997 p.296}"
