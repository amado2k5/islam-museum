label: { ar: "الموطأ 16 — ابن عمر: إذا فاتتك الركعة فقد فاتتك السجدة", en: "Muwatta 16", es: "Muwatta 16", fr: "Muwatta 16", ur: "موطا 16", tr: "El-Muvatta 16 — İbn Ömer: Bir rekatı kaçırırsanız, bir secdeyi kaçırmış olursunuz.", id: "Al-Muwatta 16 — Ibnu Umar: Jika kamu melewatkan satu rakaat, berarti kamu melewatkan sujud." }
text: "إذا فاتتك الركعة فقد فاتتك السجدة"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب من أدرك ركعة من الصلاة: كان عبد الله بن عمر يقول إن من فاتته الركعة فقد فاتته السجدة، أي أن المأموم لا يُحسب له ما أدركه من الركعة بعد رفع الإمام من الركوع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.42}"
  en: "Ibn Umar: if the rak'a escapes you, the prayer has escaped you (a mawquf opinion)."
  es: "Ibn Umar: si la rak'a se te escapa, la oración se te ha escapado (una opinión mawquf)."
  fr: "Ibn Umar: si la rak'a vous échappe, la prière vous échappe (avis mawquf)."
  ur: "ابن عمر: اگر رکعت تم سے بچ گئی تو نماز تم سے بچ گئی ⁦(موقوف رائے)⁩۔"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, namazın bir rekatı tutan kişi hakkındaki bölümde şöyle denmektedir: Abdullah ibn Umar, bir rekatı kaçıranın secdeyi kaçırmış olduğunu söylerdi; yani imam rükûdan kalktıktan sonra tuttuğu rekatın hiçbir kısmı geçerli sayılmazdı. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.42}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’, dalam bab tentang orang yang melewatkan satu rakaat shalat: Abdullah ibn Umar biasa berkata bahwa siapa pun yang melewatkan satu rakaat berarti ia melewatkan sujud, artinya makmum tidak mendapat pahala atas bagian rakaat yang ia lewatkan setelah imam bangkit dari ruku’. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.42}"
