text: "إذا فاتتك الركعة فقد فاتتك السجدة"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب من أدرك ركعة من الصلاة: كان عبد الله بن عمر يقول إن من فاتته الركعة فقد فاتته السجدة، أي أن المأموم لا يُحسب له ما أدركه من الركعة بعد رفع الإمام من الركوع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.42}"
  en: "Ibn Umar: if the rak'a escapes you, the prayer has escaped you (a mawquf opinion)."
