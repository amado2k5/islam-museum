text: "عقلا، وتصدقون بالله تصديقا جازما يؤيده العمل. ولو آمن أهل الكتاب من اليهود والنصارى بمحمد صلى الله عليه وسلم وما جاءهم به من عند الله كما آمنتم، لكان خيرا لهم في الدنيا والآخرة، منهم المؤمنون المصدقون برسالة محمد صلى الله"
