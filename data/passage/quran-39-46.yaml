text: "قُلِ ٱللَّهُمَّ فَاطِرَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ عَـٰلِمَ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ أَنتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِى مَا كَانُوا۟ فِيهِ يَخْتَلِفُونَ"
text_search: "قل اللهم فاطر السماوات والأرض عالم الغيب والشهادة أنت تحكم بين عبادك في ما كانوا فيه يختلفون"
translations:
  en: { text: "Say: O Allah! Creator of the heavens and the earth! Knower of the Invisible and the Visible! Thou wilt judge between Thy slaves concerning that wherein they used to differ.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کہو کہ اے خدا (اے) آسمانوں اور زمین کے پیدا کرنے والے (اور) پوشیدہ اور ظاہر کے جاننے والے تو ہی اپنے بندوں میں ان باتوں کا جن میں وہ اختلاف کرتے رہے ہیں فیصلہ کرے گا", translator: "Fateh Muhammad Jalandhari", license: PD }
