text: "… الله؟ قال: اللهم نعم، وإن القوم ليعرفون ما أعرف، وإن صفتك ونعتك لمبين في التوراة، ولكنهم حسدوك. قال: فما يمنعك أنت؟ قال: أكره خلاف قومي، وعسى أن يتبعوك ويسلموا فأسلم. وعن ابن عباس قال: كانت يهود قريظة والنضير وفدك وخيبر …"
