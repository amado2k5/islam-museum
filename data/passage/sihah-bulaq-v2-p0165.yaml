text: |-
  ٤٢٢
  *⁦(فصل الباء)⁩•
  * ⁦(بله)⁩.
  فلم ينون وقد وصل لانه قد نوى الوقف قال ابن السرى اذا قلت ايه يارج-ل فانما تأمره
  بأن يزيدك من الحديث المعهود بينكما كانك قلت هات الحديث وان قلت ايه بالتذوين فكأنك
  قلت هات حديثامالان التنوين تنكيروذ والرة أراد التنوين فتركه للضرورة فاذا اسكته
  وكففته قلت ايها عنا واذا أردت التبعيدقلت أيها يفتح الهمزة بعن هيهات وأنشد الفراء
  ومن دونى الاعيار والقنع كله • وكتمان أيم اما أشت وأبعدا
  والتأبيسه دعاء الابل تقول أيهت بابمال اذا صحت بها ودعوتها ومن العرب من يقول
  أيهات فى معنى هيهات وربعا قالوا أيهان بالنون كالتثنية
  الاءلالة أوبدا • هسابخ نهد الجزاره
  وتقول بدهه أمر يبدهه بدها نجنه وبدهه بأمراذا استقبله به وبادهم فاجأه والاسم البداهة
  والبديهة وهما يتبادهان بالشعرأى يتجاريان ورجل مبده قال رؤية
  وكيد مطال وخصم مبده* ⁦(بره)⁩ أتت عليه برهة من الدهروبرهة أى مدّة طويلة من
  الزمان وأبرهة من ملوكا ليمن وهوابرهة بن الحرث الرائس الذى يقال له ذو المنار وأبرهة
  اين الصباح أيضا من ملون اليمن وكان عالماجوادا وأبرهسة الاشرم الحبشى أيضامن ملول
  المن وهو أبويكسوم صباحب الفيل وقال
  منعت من أبرهة الحطيما • وكنت فيما ساءه زعيما
  والبرهرهة المرأة التى كأنهاتر عد رطوبة وهي فعلعلة كرترفيه العين واللام وقال امرؤ
  القبس
  برهرهة رودة رخصة • كفرعوبة البانة المنفطر
  الاصمعى برهرت على مثال رهبوت بتر يحضرموت بقال فيها أرواح الكفار وفى الحديث
  خيريتر فى الارض زحزم وشر يترف الارض برهوت ويقسال برهوت مثل سبروت ( إله.
  رجل أبله بين البله والبلاهة وهوالذى غلبت عليه سلامة الصدرود بله بالمكسروتبل والمرأة
  بلهاء وفى الحديث أكثر أهل الجنة البله يعنى الله فى أمر الدنيالقلة اهتمامهسم بهاوهم
  أكياس فى أمر الآخرة قال الزجرقان بن يدر خير أ ولادنا الابله العة ول يريد أنه لشدّة حيائه
  كالا يلدوهوعقول ويقال شباب أبله لما فيه من الغرارة يوصف به كما يوصف باللوّ والجنون
  لمضارعته هذه الاسباب وعيش أبلدقليل الغموم وقال * بعد غدانى الشباب الابله
  وتياله أرى من نفسه ذلكْ وليس به وهوفى بلهنية من العيش أى سعة صارت الالف ياه
  اكسرة ماقبلها والنون زائدة عن سيبويبه ويله كمة مبنية على الفتح مثل كيف ومعنا هادع
  قال كعب بن مالك بصف السبوف
  تذر البهاحم ضاحياهاماتها • بلد الاكف كانهالم تخلق
  قال الاخفس بلهه هنا يمنزلة المصدركما تقول ضرب زيد ويجوز نصسب الاكف عسلى معن دع
  الاكف وقال ابن هرمة
  تمنى القطوف اذا غنى الحداقبها * مشى النحيبة بله الجلة الجيا
  ويقال معناهاسوى وفى الحديث أعددت اعبادى الصالحسين مالاعين رأت ولا أذن سمت
  ولا خطر
