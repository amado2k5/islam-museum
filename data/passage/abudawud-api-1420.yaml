label: { ar: "سنن أبي داود 1420 — ما كُتب على المؤمنين، الواجب", en: "Sunan Abi Dawud 1420 — what was prescribed for the believers; the obligatory (wajib)", ur: "سنن ابی داؤد 1420 — جو مومنوں پر لکھ دیا گیا، واجب", fr: "Sunan Abi Dawud 1420 — ce qui a été prescrit aux croyants ; l'obligatoire (wajib)", es: "Sunan Abi Dawud 1420 — lo que se prescribió a los creyentes; lo obligatorio (wajib)", tr: "Sunan Abi Davud 1420 — Müminler için farz olan, yükümlülükler", id: "Sunan Abi Dawud 1420 — Apa yang diwajibkan bagi orang-orang beriman, kewajiban" }
text: "… مِنْ بَنِي كِنَانَةَ يُدْعَى الْمُخْدَجِيَّ سَمِعَ رَجُلاً، بِالشَّامِ يُدْعَى أَبَا مُحَمَّدٍ يَقُولُ إِنَّ الْوِتْرَ وَاجِبٌ. قَالَ الْمُخْدَجِيُّ فَرُحْتُ إِلَى عُبَادَةَ بْنِ الصَّامِتِ فَأَخْبَرْتُهُ فَقَالَ عُبَادَةُ كَذَبَ أَبُو مُحَمَّدٍ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" خَمْسُ صَلَوَاتٍ كَتَبَهُنَّ اللَّهُ عَلَى الْعِبَادِ فَمَنْ جَاءَ بِهِنَّ لَمْ يُضَيِّعْ مِنْهُنَّ شَيْئًا اسْتِخْفَافًا بِحَقِّهِنَّ كَانَ لَهُ عِنْدَ اللَّهِ عَهْدٌ أَنْ يُدْخِلَهُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1420، يرد فيه ذكر ما كُتب على المؤمنين، والواجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 1420 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), whose wording mentions what was prescribed for the believers, the obligatory (wajib). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 1420، جس کے الفاظ میں جو مومنوں پر لکھ دیا گیا، واجب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 1420, dont le texte mentionne ce qui a été prescrit aux croyants, l'obligatoire (wajib). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 1420, cuyo texto menciona lo que se prescribió a los creyentes, lo obligatorio (wajib). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 1420 numaralı hadis, müminler için farz olan ve farz olan şeyleri anlatmaktadır. Bu hadis, farz, itaat, tavsiye edilen, mekruh edilen, haram olan ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1420, menyebutkan apa yang dianjurkan bagi orang beriman dan apa yang wajib. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
