label: { ar: "الموطأ 1461 — ابن شهاب عن قبيصة بن ذؤيب: جاءت الجدة إلى أبي بكر، فقال لا شيء لك في كتاب الله، فسأل الناس حتى شهد المغيرة ومحمد بن مسلمة أن النبي أعطاها السدس", en: "Muwatta 1461" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عثمان بن إسحاق بن خرشة عن قبيصة بن ذؤيب أن الجدة جاءت إلى أبي بكر الصديق تسأله ميراثها، فقال لها أبو بكر ما لك في كتاب الله شيء، وما علمت لك في سنة رسول الله شيئا، فارجعي حتى أسأل الناس. فسأل الناس، فقال المغيرة بن شعبة حضرت رسول الله أعطاها السدس. فقال أبو بكر هل معك غيرك؟ فقام محمد بن مسلمة الأنصاري فقال مثل ما قال المغيرة، فأنفذه لها أبو بكر. ثم جاءت الجدة الأخرى إلى عمر بن الخطاب، فقال لها ما لك في كتاب الله شيء، وما أنا بزائد في الفرائض شيئا، ولكنه ذلك السدس، فإن اجتمعتما فيه فهو بينكما، وأيتكما خلت به فهو لها. ويذكر المحقق أن الترمذي وغيره صححوا الحديث، لكن رواية قبيصة عن أبي بكر منقطعة كما نص عليه المزي. {cite:muwatta-maruf-1997 p.14}"
