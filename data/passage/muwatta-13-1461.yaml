label: { ar: "الموطأ 1461 — ابن شهاب عن قبيصة بن ذؤيب: جاءت الجدة إلى أبي بكر، فقال لا شيء لك في كتاب الله، فسأل الناس حتى شهد المغيرة ومحمد بن مسلمة أن النبي أعطاها السدس", en: "Muwatta 1461", es: "Muwatta 1461", fr: "Muwatta 1461", ur: "موطا 1461", tr: "El-Muvatta 1461 — İbn Şihab, Kubeysa ibn Züeyb'den rivayetle: Büyükanne Ebu Bekir'e geldi ve Ebu Bekir, \"Allah'ın Kitabında senin hiçbir payın yok\" dedi. Bunun üzerine insanlara sordu ve sonunda El-Muğira ve Muhammed ibn Maslamah, Peygamber'in ona altıda bir pay verdiğine şahitlik ettiler.", id: "Al-Muwatta 1461 — Ibn Shihab meriwayatkan dari Qubaysah ibn Dhu’ayb: Nenek itu datang kepada Abu Bakr, dan dia berkata, “Kamu tidak mendapat bagian dalam Kitab Allah.” Maka dia bertanya kepada orang-orang sampai Al-Mughirah dan Muhammad ibn Maslamah bersaksi bahwa Nabi telah memberikan seperenam bagian kepadanya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عثمان بن إسحاق بن خرشة عن قبيصة بن ذؤيب أن الجدة جاءت إلى أبي بكر الصديق تسأله ميراثها، فقال لها أبو بكر ما لك في كتاب الله شيء، وما علمت لك في سنة رسول الله شيئا، فارجعي حتى أسأل الناس. فسأل الناس، فقال المغيرة بن شعبة حضرت رسول الله أعطاها السدس. فقال أبو بكر هل معك غيرك؟ فقام محمد بن مسلمة الأنصاري فقال مثل ما قال المغيرة، فأنفذه لها أبو بكر. ثم جاءت الجدة الأخرى إلى عمر بن الخطاب، فقال لها ما لك في كتاب الله شيء، وما أنا بزائد في الفرائض شيئا، ولكنه ذلك السدس، فإن اجتمعتما فيه فهو بينكما، وأيتكما خلت به فهو لها. ويذكر المحقق أن الترمذي وغيره صححوا الحديث، لكن رواية قبيصة عن أبي بكر منقطعة كما نص عليه المزي. {cite:muwatta-maruf-1997 p.14}"
  tr: "Malik, İbn Şihab'dan, Osman ibn İshak ibn Harşa'dan, Kubeysa ibn Zu'ayb'dan rivayetle, bir ninenin Ebu Bekir es-Siddik'e gelip miras payını istediğini anlatır. Ebu Bekir ona, \"Senin Allah'ın Kitabında bir payın yok, Allah Resulü'nün Sünnetinde de senin için bir pay olduğunu bilmiyorum. Geri dön, ben insanlara sorayım.\" dedi. Bunun üzerine insanlara sordu ve el-Muğire ibn Şube, \"Allah Resulü ona altıda birini verdiğinde oradaydım.\" dedi. Ebu Bekir, \"Yanında başka biri var mı?\" diye sordu. Muhammed ibn Maslamah el-Ensari ayağa kalktı ve el-Muğire'nin söylediğinin aynısını söyledi, böylece Ebu Bekir ona bu payı verdi. Sonra Ömer ibn el-Hattab'a başka bir nine geldi ve Ömer ona şöyle dedi: \"Allah'ın Kitabında senin hiçbir payın yok ve ben de belirlenmiş paylara hiçbir şey eklemeyeceğim. Ama o altıda bir senindir. Eğer ikiniz de bunda anlaşırsanız, o sizin aranızdadır ve hanginiz yalnız kalırsa, o onundur.\" Araştırmacı, Tirmizi ve diğerlerinin hadisi sahih olarak kabul ettiğini, ancak el-Mizzi'nin belirttiği gibi, Kubeysa'nın Ebu Bekir'den rivayetinin bağlantısız olduğunu belirtiyor."
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Utsman bin Ishaq bin Kharsha, dari Qubaysa bin Dhu'ayb, bahwa seorang nenek datang kepada Abu Bakar as-Siddiq meminta warisannya. Abu Bakar berkata kepadanya, \"Kamu tidak memiliki bagian dalam Kitab Allah, dan aku juga tidak mengetahui bagian apa pun untukmu dalam Sunnah Rasulullah. Pergilah sampai aku bertanya kepada orang-orang.\" Maka beliau bertanya kepada orang-orang, dan al-Mughirah bin Shu'bah berkata, \"Aku hadir ketika Rasulullah memberikan seperenam bagian kepadanya.\" Abu Bakar bertanya, \"Apakah ada orang lain bersamamu?\" Muhammad bin Maslamah al-Ansari berdiri dan mengatakan hal yang sama seperti al-Mughirah, maka Abu Bakar mengabulkan bagian tersebut untuknya. Kemudian seorang nenek lainnya datang kepada Umar ibn al-Khattab, dan beliau berkata kepadanya, \"Kamu tidak mendapat bagian dalam Kitab Allah, dan aku tidak akan menambahkan apa pun pada bagian yang telah ditentukan. Tetapi seperenam itu adalah milikmu. Jika kalian berdua menyetujuinya, itu menjadi hak kalian berdua, dan siapa pun di antara kalian yang memilikinya sendirian, itu menjadi miliknya.\" Peneliti menyebutkan bahwa at-Tirmidhi dan lainnya mengesahkan hadits tersebut, tetapi riwayat Qubaysa atas otoritas Abu Bakr terputus, sebagaimana dinyatakan oleh al-Mizzi."
