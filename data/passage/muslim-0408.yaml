label: { ar: "مسلم 408 — من صلى علي واحدة صلى الله عليه عشراً", en: "Muslim 408 — Whoever sends one prayer on me, God sends ten upon him", es: "Musulmán 408 — Quien me envía una oración, Dios le envía diez.", fr: "Muslim 408 — Quiconque prie sur moi une fois, Dieu prie sur lui dix fois.", ur: "مسلم 408 - جو مجھ پر ایک درود بھیجتا ہے اللہ اس پر دس بھیجتا ہے۔", tr: "Müslim 408 — Kim bana bir defa dua ederse, Allah ona on defa dua eder.", id: "Muslim 408 — Barang siapa yang berdoa kepadaku sekali, Allah akan berdoa kepadanya sepuluh kali." }
text: "قال رسول الله: «من صلى علي واحدة صلى الله عليه عشراً»"
summary:
  ar: "رواية أبي هريرة في باب الصلاة على النبي بعد التشهد من كتاب الصلاة في صحيح مسلم؛ عشر بالواحدة صلاة من الله على من صلى على النبي."
  tr: "Sahih Müslim'deki Namaz Kitabı'nın Teşehhüd'den sonra Peygamber için dua etme bölümünde Ebu Hurayra'nın rivayeti şöyledir: Peygamber için dua eden kimse için Allah'tan on dua vardır."
  id: "Riwayat Abu Hurairah dalam bab tentang berdoa untuk Nabi setelah Tasyahhud dari Kitab Shalat dalam Sahih Muslim: Sepuluh doa dari Allah untuk setiap orang yang berdoa untuk Nabi."
