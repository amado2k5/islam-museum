text: "… يلق المسلمون مثله قط، قال: ورسول اللّٰه لي جالس وأبو بكر معه جالس، وذلك زمان طلع النخل، قال: وكانوا يفرحون به إذا رأوه فرحا شديداً لأن عيشهم فيه، قال : فرفع أبو بكر رأسه فبصر بطلعة وكانت أول طلعة رثيت، …"
summary:
  ar: "مقطع من المصنف — ابن أبي شيبة، المجلد المصوَّر 1، ص 376، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Musannaf — Ibn Abi Shayba, scan volume 1, p. 376, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المصنف ابن ابی شیبہ، اسکین جلد 1، ص 376 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Musannaf — Ibn Abi Shayba, volume numérisé 1, p. 376, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Musannaf - Ibn Abi Shayba, volumen escaneado 1, p. 376, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "İbn Abi Şeybe'nin Musannaf'ının 1. cildinin 376. sayfasından, vefat eden kişi için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Musannaf Ibn Abi Shaybah, Volume 1, halaman 376, berisi elegi dan pujian untuk almarhum; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan pujian paling terkenal."
