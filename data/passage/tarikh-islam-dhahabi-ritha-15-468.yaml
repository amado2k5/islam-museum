text: "… فاذهبْ كما ذَهَبَتْ غوادي مُزْنَةٍ أثْنَى عليها السَّهْلُ والأمر عارُا وقيل: إنّما رثى مسلم بهذه يزيدَ بنَ أحمد السّلّميّ، فالله أعلم. وعن عمر بن المتوكّل، عن أمّه قالت: كان ذو الفقار مع محمد بن عبد اللّٰه بن حسن يوم قُتِل …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 15، ص 468، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, scan volume 15, p. 468, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "تاریخ الاسلام و وفیات المشاہیر والاعلام، اسکین جلد 15، ص 468 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, volume numérisé 15, p. 468, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, volumen escaneado 15, p. 468, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"İslam Tarihi ve Ünlü Şahsiyetlerin Ölümleri\" adlı resimli cilt 15'in 468. sayfasından, vefat eden kişi için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 15, halaman 468, berisi elegi dan eulogi untuk almarhum; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
