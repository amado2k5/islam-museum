label: { ar: "صحيح البخاري 1996 — الأب والأبوة", en: "Sahih al-Bukhari 1996 — the father and fatherhood", ur: "صحیح بخاری 1996 — باپ اور والدیت", es: "Sahih al-Bukhari 1996 — El padre y la paternidad", fr: "Sahih al-Bukhari 1996 — le père et la paternité" }
text: "وَقَالَ لِي مُحَمَّدُ بْنُ الْمُثَنَّى حَدَّثَنَا يَحْيَى، عَنْ هِشَامٍ، قَالَ أَخْبَرَنِي أَبِي كَانَتْ، عَائِشَةُا ـ تَصُومُ أَيَّامَ مِنًى، وَكَانَ أَبُوهَا يَصُومُهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 1996، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1996 (Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1996، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1996 (El ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1996 (Le jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
