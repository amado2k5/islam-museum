text: "… عن أَبيه، عن عُبَيد اللّٰه بن عبد اللّٰه بن عُتبة، عن ابن عَبّاس، ومحمّد بن عبد اللّٰه، عن الزُّهرىّ، عن سَعيد بن المُسَيِّب، قالا : تنفّل رسول اللّٰه سيفه ذا الفَقار يومئذٍ، وكان لمُنَبِّه بن الحَجّاج، وكان رسول اللّٰه مصلَّ …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 103، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 103, that mentions a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 103 کا اقتباس جس میں محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Maghazi de al-Waqidi, volumen 1, pág. 103, que menciona una reliquia conservada tras su propietario; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Maghazi d'al-Waqidi, volume 1, page 103, mentionnant une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "El-Vakidi'nin Maghazi adlı eserinin 1. cildinin 103. sayfasında, makineyle okunabilir taranmış kopyadan alınan bir alıntıda, korunmuş bir eserden bahsedilmektedir. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Maghazi karya al-Waqidi, Volume 1, halaman 103, menyebutkan sebuah artefak yang terpelihara; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
