text: "… عن أَبيه، عن عُبَيد اللّٰه بن عبد اللّٰه بن عُتبة، عن ابن عَبّاس، ومحمّد بن عبد اللّٰه، عن الزُّهرىّ، عن سَعيد بن المُسَيِّب، قالا : تنفّل رسول اللّٰه سيفه ذا الفَقار يومئذٍ، وكان لمُنَبِّه بن الحَجّاج، وكان رسول اللّٰه مصلَّ …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 103، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
