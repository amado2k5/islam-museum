label: { ar: "الموطأ 1741 — أبو النضر مولى عمر بن عبيد الله عن عامر بن سعد عن أبيه: كان يعزل", en: "Muwatta 1741", es: "Muwatta 1741", fr: "Muwatta 1741", ur: "موطا 1741", tr: "El-Muvatta 1741 — Ömer ibn Ubeyd Allah'ın azatlı kölesi Ebu el-Nadr, Emir ibn Saad'dan, o da babasından rivayetle: Cinsel ilişkiyi kesintiye uğratma uygulaması yapardı.", id: "Al-Muwatta 1741 — Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, berdasarkan riwayat Amir ibn Saad, berdasarkan riwayat ayahnya: Dia biasa melakukan coitus interruptus" }
summary:
  ar: "يروي مالك عن أبي النضر مولى عمر بن عبيد الله عن عامر بن سعد بن أبي وقاص عن أبيه أنه كان يعزل. {cite:muwatta-maruf-1997 p.110} {cite:muwatta-maruf-1997 p.111}"
  tr: "Malik, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, o da Emir ibn Sa'd ibn Abi Vakkas'tan, o da babasından rivayet ederek, cinsel ilişkiyi kesintiye uğratma uygulaması yaptığını nakletmiştir. {cite:muwatta-maruf-1997 s.110} {cite:muwatta-maruf-1997 s.111}"
  id: "Malik meriwayatkan dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Amir ibn Sa'd ibn Abi Waqqas, dari ayahnya, bahwa ia biasa melakukan coitus interruptus (hubungan seksual terputus). {cite:muwatta-maruf-1997 p.110} {cite:muwatta-maruf-1997 p.111}"
