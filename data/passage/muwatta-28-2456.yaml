label: { ar: "الموطأ 2456 — محمود بن لبيد: عمر في الشام والشراب المطبوخ الذي سماه طلاء", en: "Muwatta 2456" }
summary:
  ar: "يروي مالك عن داود بن الحصين عن واقد بن عمرو بن سعد بن معاذ عن محمود بن لبيد الأنصاري أن عمر بن الخطاب لما قدم الشام شكا إليه أهلها وباء الأرض وثقلها، وقالوا: لا يصلحنا إلا هذا الشراب. فقال عمر: اشربوا هذا العسل، فقالوا: لا يصلحنا العسل. فقال رجل من أهل الأرض: هل لك أن نجعل لك من هذا الشراب شيئا لا يسكر؟ فطبخوه حتى ذهب ثلثاه وبقي الثلث، فأدخل عمر إصبعه فيه ثم رفعها فتبعها يتمطط، فقال: هذا الطلاء، هذا مثل طلاء الإبل، فأمرهم أن يشربوه. فقال له عبادة بن الصامت: أحللتها والله. فقال عمر: كلا والله، اللهم إني لا أحل لهم شيئا حرمته عليهم، ولا أحرم عليهم شيئا أحللته لهم. {cite:muwatta-maruf-1997 p.415} {cite:muwatta-maruf-1997 p.416}"
