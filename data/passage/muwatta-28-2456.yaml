label: { ar: "الموطأ 2456 — محمود بن لبيد: عمر في الشام والشراب المطبوخ الذي سماه طلاء", en: "Muwatta 2456", es: "Muwatta 2456", fr: "Muwatta 2456", ur: "موطا 2456", tr: "El-Muvatta 2456 — Mahmud ibn Labid: Ömer Suriye'de ve Tila adını verdiği pişmiş içecek", id: "Al-Muwatta 2456 — Mahmud ibn Labid: Umar di Suriah dan minuman yang dimasak yang disebutnya Tila’" }
summary:
  ar: "يروي مالك عن داود بن الحصين عن واقد بن عمرو بن سعد بن معاذ عن محمود بن لبيد الأنصاري أن عمر بن الخطاب لما قدم الشام شكا إليه أهلها وباء الأرض وثقلها، وقالوا: لا يصلحنا إلا هذا الشراب. فقال عمر: اشربوا هذا العسل، فقالوا: لا يصلحنا العسل. فقال رجل من أهل الأرض: هل لك أن نجعل لك من هذا الشراب شيئا لا يسكر؟ فطبخوه حتى ذهب ثلثاه وبقي الثلث، فأدخل عمر إصبعه فيه ثم رفعها فتبعها يتمطط، فقال: هذا الطلاء، هذا مثل طلاء الإبل، فأمرهم أن يشربوه. فقال له عبادة بن الصامت: أحللتها والله. فقال عمر: كلا والله، اللهم إني لا أحل لهم شيئا حرمته عليهم، ولا أحرم عليهم شيئا أحللته لهم. {cite:muwatta-maruf-1997 p.415} {cite:muwatta-maruf-1997 p.416}"
  tr: "Malik, Davud ibn el-Hüseyn'den, o da Vakid ibn Amr ibn Sa'd ibn Mu'adh'tan, o da Mahmud ibn Labid el-Ensari'den rivayet eder ki, Ömer ibn el-Hattab Suriye'ye vardığında, halkı ona ülkenin hastalık ve ağırlığından yakınarak, \"Bizi bu içecekten başka hiçbir şey iyileştirmez\" dediler. Ömer, \"Bu balı için\" dedi. Onlar da, \"Bal bizi iyileştirmez\" diye cevap verdiler. Bunun üzerine, o bölgeden bir adam, \"Bu içecekten sarhoş etmeyen bir şey yapalım mı?\" dedi. Bunun üzerine içeceğin üçte ikisi buharlaşana ve üçte biri kalana kadar pişirdiler. Ömer parmağını içine batırdı, sonra çıkardı ve içecek parmağını takip ederek uzadı. Ömer, \"Bu kaplamadır; bu, develere sürülen kaplamaya benzer\" dedi. Sonra onlara içmelerini emretti. Ubede ibn el-Samit ona, \"Allah'a yemin ederim ki, bunu helal kıldınız!\" dedi. Ömer şöyle cevap verdi: \"Hayır, Allah'a yemin ederim ki hayır. Ey Allah'ım, senin haram kıldığın hiçbir şeyi onlara helal kılmıyorum, senin helal kıldığın hiçbir şeyi de haram kılmıyorum.\""
  id: "Malik meriwayatkan dari Dawud ibn al-Husayn, dari Waqid ibn Amr ibn Sa`d ibn Mu`adh, dari Mahmud ibn Labid al-Ansari, bahwa ketika Umar ibn al-Khattab tiba di Suriah, penduduknya mengeluh kepadanya tentang penyakit dan beratnya tanah, sambil berkata, “Tidak ada yang dapat menyembuhkan kami selain minuman ini.” Umar berkata, “Minumlah madu ini.” Mereka menjawab, “Madu tidak akan menyembuhkan kami.” Seorang pria dari negeri itu berkata, “Apakah Anda ingin kami membuat sesuatu dari minuman ini yang tidak memabukkan?” Maka mereka memasaknya hingga dua pertiga menguap dan tersisa sepertiga. Umar mencelupkan jarinya ke dalamnya, lalu menariknya kembali, dan cairan itu mengikuti jarinya, meregang. Dia berkata, “Inilah lapisannya; ini seperti lapisan yang dioleskan pada unta.” Maka dia memerintahkan mereka untuk meminumnya. Ubadah bin al-Samit berkata kepadanya, “Demi Allah, engkau telah memperbolehkannya!” Umar menjawab, “Tidak, demi Allah. Ya Allah, aku tidak memperbolehkan bagi mereka sesuatu yang telah Engkau haramkan bagi mereka, dan aku juga tidak mengharamkan bagi mereka sesuatu yang telah Engkau halalkan bagi mereka.”"
