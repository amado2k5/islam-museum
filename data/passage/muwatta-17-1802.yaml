label: { ar: "الموطأ 1802 — مالك عن نافع عن ابن عمر: لا يطأ الرجل وليدة إلا وليدة إن شاء باعها أو وهبها أو أمسكها أو صنع بها ما شاء", en: "Muwatta 1802", es: "Muwatta 1802", fr: "Muwatta 1802", ur: "موطا 1802", tr: "El-Muvatta 1802 — Malik, Nafi'den, o da İbn Ömer'den rivayetle: Bir erkek, cariye olmadıkça cariye ile cinsel ilişkiye giremez; dilerse onu satabilir, verebilir, yanında tutabilir veya onunla dilediği gibi davranabilir." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يقول: لا يطأ الرجل وليدة إلا وليدة إن شاء باعها، وإن شاء وهبها، وإن شاء أمسكها، وإن شاء صنع بها ما شاء. {cite:muwatta-maruf-1997 p.138}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayetle şöyle der: \"Bir erkek, cariye ile ancak onu satmak, vermek, yanında tutmak veya dilediği gibi davranmak istiyorsa ilişkiye girer.\" {cite:muwatta-maruf-1997 s.138}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa beliau biasa berkata: Seorang laki-laki tidak boleh bersetubuh dengan seorang budak perempuan kecuali jika ia ingin menjualnya, atau memberikannya, atau memeliharanya, atau melakukan apa pun yang ia inginkan terhadapnya. {cite:muwatta-maruf-1997 p.138}"
