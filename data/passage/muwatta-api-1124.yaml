text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ بْنِ مَسْعُودٍ، عَنْ أَبِيهِ، أَنَّ عُمَرَ بْنَ الْخَطَّابِ، سُئِلَ عَنِ الْمَرْأَةِ، وَابْنَتِهَا، مِنْ مِلْكِ الْيَمِينِ تُوطَأُ إِحْدَاهُمَا بَعْدَ الأُخْرَى فَقَالَ عُمَرُ مَا أُحِبُّ أَنْ أَخْبُرَهُمَا جَمِيعًا. وَنَهَى عَنْ ذَلِكَ."
summary:
  ar: "حديث في موطأ مالك، رقم 1124، يذكر كتاب الأعمال والملائكة الكاتبون. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 1124 (Marriage), that speaks of the record of deeds and the recording angels. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 1124، جس میں نامۂ اعمال اور لکھنے والے فرشتے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1124 (Matrimonio), que habla del registro de actos y de los ángeles registradores. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan un acto."
  fr: "Un rapport du Muwatta Malik, n° 1124 (Mariage), évoque le registre des actes et les anges qui le consignent. Le Livre des Hasanat et des Sayyi'at le mentionne parmi les textes relatifs au comptage, à l'écriture, à l'effacement ou à la pesée d'un acte."
  tr: "Malik'in Muvatta'sında yer alan 1124 numaralı hadiste, Amel Kitabı ve bunları kaydeden meleklerden bahsedilir. Bu kitap, iyi ve kötü amellerin listesini ve amelleri kaydeden, yazan, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1124, menyebutkan Kitab Amal dan para malaikat pencatat. Kitab ini mencakup daftar amal baik dan amal buruk beserta teks yang mencatat, menuliskan, menghapus, atau menimbang amal tersebut."
