text: "… في آخر الزمان قصد بعضهم أن يمزح مع الشيخ قبيل الغروب في أحد أيام رمضان، فكلَّفهُ أن يرى له الساعة، وكان الشيخ غائصاً في بحار الأفكار فاستاء من سؤالِهِ، وقصد مماحكتَهُ، فكان بينهما ما يأتي : قال الرجل : كم …"
summary:
  ar: "في رمضان سأل رجل جحا كم بقي على الغروب، فقال إن عنده ساعة، فقال الرجل إنه قصد وقت اليوم، فعرض عليه جحا طعاماً وقال إنه الصيف الحار، فقال الرجل إن جحا نكتة بالنسبة إليه، فقال جحا إن الجميع يعرفون أنه آخر الزمان. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  en: "During Ramadan a man asks Juha the time before sunset; Juha says he has one hour; the man says he meant the time of day; Juha offers food and says it is the hot summer; the man says Juha is a joke to him; Juha says everyone knows it is the end of time. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  ur: "رمضان میں ایک آدمی نے جحا سے پوچھا کہ غروب میں کتنا وقت باقی ہے، جحا نے کہا کہ ایک گھنٹہ ہے، آدمی نے کہا کہ اس کا مطلب دن کا وقت پوچھنا تھا، جحا نے اسے کھانا پیش کیا اور کہا کہ یہ سخت گرمی کا موسم ہے، آدمی نے کہا کہ جحا اس کے لیے ایک لطیفہ ہے، تو جحا نے کہا کہ سب جانتے ہیں کہ یہ آخر زمانہ ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  fr: "Pendant le ramadan, un homme demande à Juha combien de temps reste avant le coucher du soleil ; Juha dit qu'il lui reste une heure ; l'homme dit qu'il voulait savoir l'heure de la journée ; Juha lui offre de la nourriture et dit que c'est le plein été ; l'homme dit que Juha est une plaisanterie pour lui ; Juha dit que tout le monde sait que c'est la fin des temps. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  es: "Durante el Ramadán, un hombre pregunta a Juha cuánto falta para la puesta del sol; Juha dice que tiene una hora; el hombre dice que se refería a la hora del día; Juha le ofrece comida y dice que es el caluroso verano; el hombre dice que Juha es una broma para él; Juha dice que todos saben que es el fin de los tiempos. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  tr: "Ramazan ayında bir adam, Juha'ya gün batımına ne kadar zaman kaldığını sordu. Juha, saati olduğunu söyledi. Adam, günün saatini kastettiğini söyledi. Bunun üzerine Juha ona yemek ikram etti ve yazın çok sıcak olduğunu söyledi. Adam, Juha'nın kendisi için bir şaka olduğunu söyledi. Juha ise herkesin kıyamet zamanının geldiğini bildiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 170}"
  id: "Selama Ramadan, seorang pria bertanya kepada Juha berapa lama lagi waktu hingga matahari terbenam. Juha menjawab bahwa ia memiliki jam. Pria itu berkata bahwa yang ia maksud adalah waktu dalam sehari. Juha kemudian menawarkannya makanan dan berkata bahwa saat itu musim panas yang terik. Pria itu berkata bahwa Juha adalah lelucon baginya. Juha menjawab bahwa semua orang tahu bahwa itu adalah akhir zaman. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
