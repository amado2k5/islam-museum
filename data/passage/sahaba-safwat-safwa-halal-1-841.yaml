text: "… حذيفة يقول: إني لأستغفر اللّٰه من كلامكم إذا خرجتم من عندي خمسين مرة. قال ابن خبيق: وقال لي حذيفة: إنما هي أربعة: عيناك، ولسانك، وهواك، وقلبك، فانظر عينيك لا تنظر بهما إلى ما لا يحل لك، وانظر لسانك لا تقل …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 841، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 841, that mentions what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
