text: "… لأحدهم نعمة أحدث رياء وسمعة فعلق من بين أصفر وأخضر وأحمر. ثم قال للناس : تعالوا فانظروا ؛ فأما المؤمنون فيقولون لاحسن والله ولا جميل ! إن يكن من حلال فقد أسرفت، وإن يكن من حرام فشكلتك أمك. وأما المنافقون …"
summary:
