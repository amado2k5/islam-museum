text: "طعة الأديم التي في يدك، فناولناها، فقرأناها، فإذا فيها: (من محمد رسول الله علق إلى بني زهير بن أقيش(1)، إنكم إن شهدتم أن لا إله إلا الله، وأن محمدا رسول الله، وأديتم الخمس من المغنم، وسهم النبي وطه وأقستم )"
