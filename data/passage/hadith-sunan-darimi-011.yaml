text: "• من احتفر بئرا فليس لأحد أن يحفر حوله • من أحدث رأيا ليس في كتاب الله • من أحسن في الإسلام لم يؤاخذ بما كان عمل • من أحيا أرضا ميتة فله فيها أجر • من أدرك ماله بعينه"
