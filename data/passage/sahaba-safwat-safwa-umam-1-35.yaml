text: "… ببنان سيكفيكه إما يد مقفعلّة؛ ولما قضت منه أمينة ما قضت نبا بصري عنه وكَلَّ لساني وقد روى أبو صالح عن ابن عباس: أن هذه المرأة من بني أسد بن عبد العزىّ، وهي أخت ورقة بن نوفل، وكذلك قال ابن …"
