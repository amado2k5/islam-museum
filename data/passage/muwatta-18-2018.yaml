label: { ar: "الموطأ 2018 — يحيى عن مالك: لا ينبغي لصاحب المال أن يشترط لنفسه شيئا من الربح خالصا دون العامل، ولا للعامل شيئا خالصا دون صاحبه، ولا يكون مع القراض بيع أو كراء أو عمل أو سلف أو مرفق يشترطه أحدهما لنفسه", en: "Muwatta 2018", es: "Muwatta 2018", fr: "Muwatta 2018", ur: "موطا 2018", tr: "El-Muvatta 2018 — Yahya, Malik'ten rivayetle: Sermaye sahibi, kendisine özel bir kâr payı şart koşmamalıdır; işçi de kendisine özel bir pay şart koşmamalıdır. Ayrıca, kâr paylaşım sözleşmesi, taraflardan herhangi birinin kendisine şart koştuğu herhangi bir satış, kiralama, iş, kredi veya başka bir menfaati içermemelidir.", id: "Al-Muwatta 2018 — Yahya berdasarkan riwayat Malik: Pemilik modal tidak boleh menetapkan bagian keuntungan yang eksklusif untuk dirinya sendiri, demikian pula pekerja tidak boleh menetapkan bagian yang eksklusif untuk dirinya sendiri. Lebih lanjut, perjanjian pembagian keuntungan tidak boleh mencakup penjualan, sewa, pekerjaan, pinjaman, atau keuntungan lain yang ditetapkan oleh salah satu pihak untuk dirinya sendiri." }
summary:
  ar: "قال يحيى: قال مالك: لا ينبغي لصاحب المال أن يشترط لنفسه شيئا من الربح خالصا دون العامل، ولا ينبغي للعامل أن يشترط لنفسه شيئا من الربح خالصا دون صاحبه. ولا يكون مع القراض بيع، ولا كراء، ولا عمل، ولا سلف، ولا مرفق يشترطه أحدهما لنفسه دون صاحبه، إلا أن يعين أحدهما صاحبه على غير شرط، على وجه المعروف، إذا صح ذلك منهما. ولا ينبغي للمتقارضين أن يشترط أحدهما على صاحبه زيادة من ذهب ولا فضة ولا طعام، ولا شيء من الأشياء. فإن دخل القراض شيء من ذلك صار إجارة، ولا تصلح الإجارة إلا بشيء ثابت معلوم. فإذا وفر المال، وحصل عزل رأس المال، ثم اقتسما الربح على شرطهما. فإن لم يكن للمال ربح، أو دخلته وضيعة، لم يلحق العامل من ذلك شيء. وذلك على رب المال في ماله. والقراض جائز على ما تراضى عليه رب المال والعامل، من نصف الربح، أو ثلثه، أو ربعه، أو أقل من ذلك، أو أكثر. {cite:muwatta-maruf-1997 p.225}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Sermaye sahibi, kendisine özel bir kâr payı şart koşmamalıdır; işçi de kendisine özel bir kâr payı şart koşmamalıdır. Taraflardan hiçbiri, diğerinin rızası olmadan kendisi için satış, kira, emek, borç veya herhangi bir menfaat şart koşmamalıdır; ancak taraflardan biri diğerine koşulsuz ve geleneksel bir şekilde yardım ederse ve bu aralarında caiz ise bu durum istisnadır. Kâr paylaşım anlaşmasında ortaklardan hiçbiri ek bir miktar altın, gümüş, yiyecek veya başka bir şey şart koşmamalıdır. Bunlardan herhangi biri kâr paylaşım anlaşmasına dahil edilirse, bu bir kira sözleşmesi haline gelir ve kira sözleşmesi ancak sabit ve bilinen bir miktarı içeriyorsa geçerlidir. Sermaye yeterli hale geldiğinde ve anapara bir kenara ayrıldığında, anlaşmalarına göre kârı paylaşırlar. Sermaye kâr getirmezse veya zarar ederse, işçi hiçbir şey almaz. Bu zarar sermaye sahibine düşer. Sermaye sahibi ve işçi arasında varılan anlaşmaya göre, kâr paylaşımı anlaşması caizdir; bu, kârın yarısı, üçte biri, dörtte biri, daha azı veya daha fazlası olabilir. {cite:muwatta-maruf-1997 s.225}"
  id: "Yahya berkata: Malik berkata: Pemilik modal tidak boleh menetapkan bagian keuntungan yang eksklusif untuk dirinya sendiri, demikian pula pekerja tidak boleh menetapkan bagian yang eksklusif untuk dirinya sendiri. Tidak boleh ada penjualan, sewa, tenaga kerja, pinjaman, atau keuntungan apa pun yang ditetapkan oleh salah satu pihak untuk dirinya sendiri tanpa persetujuan pihak lain, kecuali jika salah satu pihak membantu pihak lain tanpa syarat, dengan cara yang lazim, asalkan hal ini diperbolehkan di antara mereka. Tidak satu pun dari para mitra dalam perjanjian bagi hasil boleh menetapkan jumlah tambahan berupa emas, perak, makanan, atau apa pun. Jika salah satu dari hal-hal ini termasuk dalam perjanjian bagi hasil, maka perjanjian tersebut menjadi sewa, dan sewa hanya sah jika melibatkan jumlah yang tetap dan diketahui. Setelah modal mencukupi dan pokok telah disisihkan, mereka membagi keuntungan sesuai dengan kesepakatan mereka. Jika modal tidak menghasilkan keuntungan, atau jika mengalami kerugian, pekerja tidak menerima apa pun. Kerugian ini menjadi tanggung jawab pemilik modal. Perjanjian pembagian keuntungan diperbolehkan sesuai dengan kesepakatan antara pemilik modal dan pekerja, baik itu setengah keuntungan, sepertiga, seperempat, kurang, atau lebih. {cite:muwatta-maruf-1997 p.225}"
