label: { ar: "الموطأ 2018 — يحيى عن مالك: لا ينبغي لصاحب المال أن يشترط لنفسه شيئا من الربح خالصا دون العامل، ولا للعامل شيئا خالصا دون صاحبه، ولا يكون مع القراض بيع أو كراء أو عمل أو سلف أو مرفق يشترطه أحدهما لنفسه", en: "Muwatta 2018" }
summary:
  ar: "قال يحيى: قال مالك: لا ينبغي لصاحب المال أن يشترط لنفسه شيئا من الربح خالصا دون العامل، ولا ينبغي للعامل أن يشترط لنفسه شيئا من الربح خالصا دون صاحبه. ولا يكون مع القراض بيع، ولا كراء، ولا عمل، ولا سلف، ولا مرفق يشترطه أحدهما لنفسه دون صاحبه، إلا أن يعين أحدهما صاحبه على غير شرط، على وجه المعروف، إذا صح ذلك منهما. ولا ينبغي للمتقارضين أن يشترط أحدهما على صاحبه زيادة من ذهب ولا فضة ولا طعام، ولا شيء من الأشياء. فإن دخل القراض شيء من ذلك صار إجارة، ولا تصلح الإجارة إلا بشيء ثابت معلوم. فإذا وفر المال، وحصل عزل رأس المال، ثم اقتسما الربح على شرطهما. فإن لم يكن للمال ربح، أو دخلته وضيعة، لم يلحق العامل من ذلك شيء. وذلك على رب المال في ماله. والقراض جائز على ما تراضى عليه رب المال والعامل، من نصف الربح، أو ثلثه، أو ربعه، أو أقل من ذلك، أو أكثر. {cite:muwatta-maruf-1997 p.225}"
