label: { ar: "الموطأ 1133 — سليمان بن يسار: أن أبا أيوب الأنصاري خرج حاجاً، حتى إذا كان بالنازية من طريق مكة أضل رواحله، فقدم على عمر يوم النحر فذكر ذلك له، فقال له عمر: اصنع كما يصنع المعتمر، ثم قد حللت، فإذا أدركك الحج قابلاً فاحجج وأهد ما استيسر من الهدي", en: "Muwatta 1133" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار، أن أبا أيوب الأنصاري خرج حاجاً، حتى إذا كان بالنازية من طريق مكة أضل رواحله، فقدم على عمر بن الخطاب يوم النحر، فذكر ذلك له، فقال له عمر: اصنع كما يصنع المعتمر، ثم قد حللت، فإذا أدركك الحج قابلاً فاحجج، وأهد ما استيسر من الهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1429 و1430 في ترتيب المحقق). {cite:muwatta-maruf-1997 p.515} {cite:muwatta-maruf-1997 p.516}"
