label: { ar: "الموطأ 1133 — سليمان بن يسار: أن أبا أيوب الأنصاري خرج حاجاً، حتى إذا كان بالنازية من طريق مكة أضل رواحله، فقدم على عمر يوم النحر فذكر ذلك له، فقال له عمر: اصنع كما يصنع المعتمر، ثم قد حللت، فإذا أدركك الحج قابلاً فاحجج وأهد ما استيسر من الهدي", en: "Muwatta 1133", es: "Muwatta 1133", fr: "Muwatta 1133", ur: "موطا 1133", tr: "El-Muvatta 1133 — Süleyman ibn Yasar: Ebu Eyyub el-Ensari hacca gitti ve Mekke yolunda Naziye'ye vardığında bineklerini kaybetti. Kurban günü Ömer'in yanına geldi ve ona durumu anlattı. Ömer ona şöyle dedi: Hacının yaptığı gibi yap, o zaman ihram halinden kurtulursun. Eğer gelecek yıl hacca gidebilirsen, hacca git ve gücün yettiğince kurban kes.", id: "Al-Muwatta 1133 — Sulayman ibn Yasar: Abu Ayyub al-Ansari pergi menunaikan ibadah haji, dan ketika sampai di al-Naziyah di jalan menuju Mekah, ia kehilangan tunggangannya. Ia datang kepada Umar pada Hari Raya Kurban dan menceritakan hal itu kepadanya. Umar berkata kepadanya: Lakukanlah seperti yang dilakukan oleh jamaah haji, maka engkau akan terbebas dari keadaan ihram. Jika engkau mampu menunaikan ibadah haji tahun depan, maka tuntunlah haji dan persembahkan hewan kurban apa pun yang mampu engkau beli." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار، أن أبا أيوب الأنصاري خرج حاجاً، حتى إذا كان بالنازية من طريق مكة أضل رواحله، فقدم على عمر بن الخطاب يوم النحر، فذكر ذلك له، فقال له عمر: اصنع كما يصنع المعتمر، ثم قد حللت، فإذا أدركك الحج قابلاً فاحجج، وأهد ما استيسر من الهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب ⁦(1429 و1430 في ترتيب المحقق)⁩. {cite:muwatta-maruf-1997 p.515} {cite:muwatta-maruf-1997 p.516}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Ebu Eyyub el-Ensari hacca gitti ve Mekke yolunda Naziye'ye vardığında bineklerini kaybetti. Kurban Bayramı günü Ömer ibn el-Hattab'a gidip durumu anlattı. Ömer ona şöyle dedi: \"Hacının yaptığı gibi yap, o zaman ihram halinden kurtulursun. Eğer gelecek yıl hacca gidebilirsen, git ve gücün yettiğince kurban kes.\" Editör, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtiyor (editörün düzenlemesinde 1429 ve 1430). {cite:muwatta-maruf-1997 s.515} {cite:muwatta-maruf-1997 s.516}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa Abu Ayyub al-Ansari pergi berziarah, dan ketika sampai di al-Naziyah di jalan menuju Mekah, ia kehilangan kendaraannya. Ia pergi menemui Umar ibn al-Khattab pada Hari Raya Kurban dan menceritakannya kepadanya. Umar berkata kepadanya: \"Lakukanlah seperti yang dilakukan oleh orang yang berziarah, maka kamu akan terbebas dari keadaan ihram. Jika kamu mampu melaksanakan haji tahun depan, maka laksanakanlah dan persembahkan hewan kurban apa pun yang mampu kamu beli.\" Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik (1429 dan 1430 dalam susunan editor). {cite:muwatta-maruf-1997 p.515} {cite:muwatta-maruf-1997 p.516}"
