text: "ما نبه الله تعالى عليه في كتابه بقوله تعالى: (أن تضل إحداهما فتذكر والفاسقين والكافرين، ولعن من غير منار الأرض، ومن تولى غير مواليه، إحداهما الأخرى) أي إنهن قليلات الضبط. قال: وقد اختلف الناس في ومن انتسب إلى غير أبيه،"
