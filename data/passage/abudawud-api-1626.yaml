label: { ar: "سنن أبي داود 1626 — الأب والأبوة", en: "Sunan Abi Dawud 1626 — the father and fatherhood", ur: "سنن ابی داؤد 1626 — باپ اور والدیت", es: "Sunan Abi Dawud 1626 — El padre y la paternidad" }
text: "… حَدَّثَنَا يَحْيَى بْنُ آدَمَ، حَدَّثَنَا سُفْيَانُ، عَنْ حَكِيمِ بْنِ جُبَيْرٍ، عَنْ مُحَمَّدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ سَأَلَ وَلَهُ مَا يُغْنِيهِ جَاءَتْ يَوْمَ الْقِيَامَةِ خُمُوشٌ - أَوْ خُدُوشٌ - أَوْ كُدُوحٌ - فِي وَجْهِهِ \". فَقِيلَ يَا رَسُولَ اللَّهِ وَمَا الْغِنَى قَالَ \" خَمْسُونَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1626، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1626 (Zakat (Kitab Al-Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1626، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1626 (Zakat (Kitab Al-Zakat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
