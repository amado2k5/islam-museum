text: "… المَلِك بعينه. وقيل إنه أسم كل ملك من ملوك العمالقة؛ مثل كسرى للفرس، وقَيْصر للروم، والنجاشي للحبشة. وإن أسم فرعون موسى: قابوس؛ في قول أهل الكتاب. وقال وهب: أسمه الوليد بن مصعب بن الريّان، ويكنى أبا مُرّة وهو من بني …"
