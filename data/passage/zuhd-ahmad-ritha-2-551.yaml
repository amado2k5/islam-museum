text: "… الزُهد - ومن طريقه أَبو نُعيم الأصبهاني في حلية الأولياء -، قال: حدَّثنا سُفيان بن عُيينة به. وإسناده ضعيف؛ سُفيان بن عُيينةَ لم يُدرك عمرَ بنَ عبدِ العزيز. وأخرجه أبو الحسن المدائني في التَّعازي -ومن طريقه البلاذري في أنساب الأشراف …"
