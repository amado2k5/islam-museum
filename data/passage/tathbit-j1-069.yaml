label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٢٢، المقطع ١ من ٢", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 22, section 1 of 2", ur: "تثبیت دلائل نبوت — حصہ اول، باب 22، حصہ 1" }
text: "إن بين أبي بكر وعمر وتلك الجماعة وبين بني هاشم مع إخوة الإسلام فضل مودة وصداقة، يمدح بعضهم بعضا ويزكّي بعضهم بعضا، ويتصاهارون، ويرى بعضهم بعضا أهلا للإمامة والولاية، وينصح بعضهم بعضا. ألا ترى أنهم بايعوا أبا بكر …"
summary:
  ar: "مقطع من الباب ٢٢ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 22 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 22 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
