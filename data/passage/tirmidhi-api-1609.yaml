label: { ar: "جامع الترمذي 1609 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 1609 — what was left behind: estate and inheritance", ur: "جامع ترمذی 1609 — ترکہ اور میراث", es: "Jami' al-Tirmidhi 1609 — lo que quedó: patrimonio y herencia", fr: "Jami' al-Tirmidhi 1609 — Ce qui a été laissé derrière: biens et héritage", tr: "Cami' el-Tirmizi 1609 — Miras ve vasiyet olarak geride bıraktıkları", id: "Jami' al-Tirmidhi 1609 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… بْنُ عَطَاءٍ، حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ فَاطِمَةَ، جَاءَتْ أَبَا بَكْرٍ وَعُمَرَما تَسْأَلُ مِيرَاثَهَا مِنْ رَسُولِ اللَّهِ فَقَالاَ سَمِعْنَا رَسُولَ اللَّهِ يَقُولُ \" إِنِّي لاَ أُورَثُ \". قَالَتْ وَاللَّهِ لاَ أُكَلِّمُكُمَا أَبَدًا. فَمَاتَتْ وَلاَ تُكَلِّمُهُمَا. قَالَ عَلِيُّ بْنُ عِيسَى مَعْنَى لاَ أُكَلِّمُكُمَا تَعْنِي فِي هَذَا الْمِيرَاثِ أَبَدًا أَنْتُمَا صَادِقَانِ. …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1609، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1609 (The Book on Military Expeditions), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1609، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1609 (El Libro de las Expediciones Militares), menciona lo que quedó: bienes y herencias. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1609 (Livre des expéditions militaires), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'nin 1609 numaralı hadisinde, geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, eski eserler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1609, menyebutkan apa yang ditinggalkannya berupa harta warisan. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, barang antik, dan makam suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
