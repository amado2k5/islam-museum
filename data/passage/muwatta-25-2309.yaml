summary:
  ar: "قال مالك: أحسن ما سمعه في المكاتب يجرح رجلا جرحا فيه عقل: إن قوي المكاتب على أداء عقل الجرح مع كتابته أداه وبقي على كتابته. فإن لم يقو فقد عجز، فيُخيَّر سيده: إن شاء أدى عقل الجرح وأمسك عبده ليصير مملوكا، وإن شاء أسلم العبد إلى المجروح، وليس على السيد أكثر من تسليم عبده. {cite:muwatta-maruf-1997 p.352} {cite:muwatta-maruf-1997 p.353}"
