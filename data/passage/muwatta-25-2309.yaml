label: { ar: "الموطأ 2309 — مالك: المكاتب يجرح رجلا جرحا فيه عقل", en: "Muwatta 2309", es: "Muwatta 2309", fr: "Muwatta 2309", ur: "موطا 2309", tr: "Al-Muwatta 2309 — Malik: Bir köle, kan parası ödenmesi gereken bir yara açarsa, bir köleyle menajerlik sözleşmesi yapmış olur." }
summary:
  ar: "قال مالك: أحسن ما سمعه في المكاتب يجرح رجلا جرحا فيه عقل: إن قوي المكاتب على أداء عقل الجرح مع كتابته أداه وبقي على كتابته. فإن لم يقو فقد عجز، فيُخيَّر سيده: إن شاء أدى عقل الجرح وأمسك عبده ليصير مملوكا، وإن شاء أسلم العبد إلى المجروح، وليس على السيد أكثر من تسليم عبده. {cite:muwatta-maruf-1997 p.352} {cite:muwatta-maruf-1997 p.353}"
  tr: "Malik şöyle dedi: Bir kölenin başka bir adama kan parası gerektiren bir yara açması durumunda duyduğum en iyi hüküm şöyledir: Eğer köle, sözleşmesi devam ederken kan parasını ödeyebiliyorsa, bunu yapmalı ve sözleşmesi devam etmelidir. Eğer ödeyemiyorsa, ehliyetsiz sayılır ve efendisinin seçeneği vardır: İsterse kan parasını ödeyip kölesini köle olarak tutabilir, isterse köleyi yaralanan tarafa teslim edebilir. Efendi, kölesini teslim etmekten başka bir şey yapmakla yükümlü değildir. {cite:muwatta-maruf-1997 s.352} {cite:muwatta-maruf-1997 s.353}"
  id: "Malik berkata: Putusan terbaik yang pernah saya dengar mengenai seorang budak yang melukai orang lain dengan luka yang membutuhkan uang darah adalah sebagai berikut: Jika budak tersebut mampu membayar uang darah atas luka tersebut selagi masih terikat kontrak, ia harus melakukannya dan tetap terikat kontrak. Jika ia tidak mampu, maka ia dianggap tidak mampu, dan tuannya memiliki pilihan: jika ia mau, ia dapat membayar uang darah dan mempertahankan budaknya untuk menjadi budak, atau jika ia mau, ia dapat menyerahkan budak tersebut kepada pihak yang terluka. Tuan tidak berkewajiban untuk melakukan lebih dari sekadar menyerahkan budaknya. {cite:muwatta-maruf-1997 p.352} {cite:muwatta-maruf-1997 p.353}"
