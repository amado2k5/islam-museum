text: |-
  ١ ل بيصة النصرانى وبقال
  للاعرج المغنى اه
  ٢٢٢
  ⁦(حد)⁩
  ومالى عن هذا الامر حدد أى بد وقول الكميت
  حددا أن يكون سيبك فينا * زرما أو يجينا تصيرا
  أى راما
  كماتول معاذ الله قد حد اللّٰه ذاك عنا وحددت الرجل أقت عليه الحذلانه يمنعه من المعاودة
  وأحدّت المرأة أى امتنعت من الزينة والخضاب بعدوفاة زوجها وكذلك حدّت تحد وتحد
  -داداوهى حادّ ولم يعرف الاصمعى الاأحدت فهى محد والمحادة المخالفة ومنع ما يجب
  عليك وكذلك التحاد والحديدمه روف لانه منيع والحديدة أخص منه والجمع الحدائد وقد
  جاء فى الشعر الحداشات وأنشد الاحر فى نعت الخيل فهن يملكن حدائداتها
  وحدّ كل شى شباته وحد الرجل بأسه وحد الشراب صلابته قال الاعشى
  وكأس كعين الديك باكرت حدها * بفتان صدق والنواقيس تضرب
  وقد حد اليف يحدحدة أى صارحادًا وحديد اوسبوف حداد وألسنة حداد والحداد
  أيضاثياب المأنم السودوحكى أبوهم روسيف حدّاد بالضم والتشديد مثل أمر كبار والحدّة
  ما يعترى الانسان من النزق والغضب تقول حددت على الرجل أحدحدة وحدا عن
  الكسائى وتحديد الشفرة واحدادها واستحدادها؟عنى والاستحداد أيضاحلق شعر العانة
  وأحددت النظر الى فلان واحتدفلان. ن الغضب فهو محتد وقوله-م ما أجدمنه محتدا
  ولا ملتدا أى بدا وحدان بالضم حى من العرب.ن بى سعدوحدان أيضامن الازدوينو
  احداد بطن من طي ( حدرد الحدرد اسم رجل ولم يجى على ذعلع بنكوير العين غير
  ولوصكان ذه للالكان من المضاعف لات العين واللام من جنس واحد وليس هومنه
  ( حرد -رديجرد بالكسر حرداقمدتقول حودت حردك أى قصدت قصدك قال الراجز
  أقبل سيل جاممن أمر الله * يخرد حرد الجنة المغله.
  وقوله تعالى وغسدوا على حرد قادرين آى على قصد وقيل على منع من قوله-م حاردت الابل
  حرادا أى قلت آلمام اوالحرود من النوق القدلة الدرّ وحاردت السنة قل مطرها وجرد
  يحرد حرودا أى تنحى عن قومه ونزل منفرداولم يخالطهم قال الشاعر
  اذانزل الحىّ جل الجيش * حيد الحل غوياغيورا
  وقال أبوزيدرجل زيد من قوم حرداء وقد حرد يحرد حرودا اذائر قومه وتحوّل عنهم قال
  وقالوا كل قليل فى كثيرحريد وأتشد لجرير
  نبن على سنن العدوبيوتنا • لانستمير ولا نحل -ريدا
  وكوكب حريد أى معتزل عن الكواكب قال ذوالرمة
  يعتسفان الليل ذا السدود * اما بكل كوكب حريد
  قال الاصمعى رجل حريدأى فريد وحيد قال والمنحرد المنفرد فى لغة هذيل وأنشدلابى
  ذويب من وحسْ حوضى يراعى الصيد منتقلا • كانه كوكب فى الجوّمنحرد
  ورواه أبوه-روبالجيم وفسره منفرد قال وهوسهيل والحرد بالتحريك الغضب قال أبونضر
  أحد بن حاتم صاحب الاصمعى مختف وأنشد ١
  إذا جياد الخيل جاءت تردى • مملوة من غضب وحرد
  وقال
