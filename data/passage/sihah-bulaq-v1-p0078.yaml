text: |-
  ٥٦٣
  بقال قطقطت السماء فهى مقطقطة ثم الرذاذ وهو فوق القطقط ثم الطس وهوفوق الرذاذ
  ثم البغس وه وفوق الطش ثم الغبية وهى فوق البغسة وكذلك الحلبة والشجذة والحنشة
  والحشكة مثل الغبية والقطة طانة بالضم اسم موضع عط ) القعط الشد والتضييق بقال
  قعط على غريمه والقعطة المرة الواحدة قال الاغلب العجلى ودافع المكروه بعدعطتى
  والاقتعاط شدالعمامة على الرأس من غيرادارة تحت الحنك وفى الحديث انه نهى علي
  السلام عن الاقتعاط وأمر بالتلمى والمقطعة العمامة عن أبى عبيد فط فط الطائر
  أنشاهيقف طها ويقفطها قفطا اذاسفدها وقال أبوزيد الققط انمابكون لذوات الظلف
  ( قط/ قط الطائرأشاء يقمطها أى سقدها والقماط حبل يشقبه قوائم الشاة عند الذبح
  وكذلك مايشديه الصى فى المهدوقد قطت الشاة والصىّ بالقماط أقط قطا وقط الاسيراذا
  جع بين يديه ورجليه عجبل والقمط بالمكسر ما يشديه الاخصاص ومنه معاقد القمط ومرنا
  حول قبط أى تام نط ) القنوط البأس وقد قنط يقنط قنوطامثل جلس يجلس جلوسا
  وكذلك قنط يقفط مقل قعد يقعد فهو قائط وفيه لغة ثالثة قنط يقنط قنطا مثدل تعب يتعب
  تعبا وقناطسة فهوقنط وقرئ فلا تكن من القنطين وأماقفط يقنظ بالفتح فيهما وقفط يقفط
  بالكسرفيه-مافاغماهو على الجم-ع بين اللغتيز قاله الاخفش ⁦(قوط)⁩ القوط القطيع
  من الغيم والم-ع الاقواط قال الراجز
  مَاراءى الاخيال هابطا • على البيوث قوطه العلابطا
  ن ل الكاف ( شط كشطت الجمل عن ظهر الفرس والقطاء عن الشى اذا أ
  شفته عنه والقشط لغفيه وفى قراءة عسدالله واذا السماء قشطت وكشطت البعم
  لشطانزعت جاده ولا يقال سلخت لان العرب لاتول فى البعير الاكشطته أوجلدته
  وانكشما روعه أى ذهب
  صل اللام ط لبطت به الارض مثل لبجت بد اذا ضر بت الارض ولبطيه
  يلبط لبطامئل ليج به اذ اسقط من قيام وكذلك اذاصرع وتلبط أى اضطجع وتمرغ واذا عدا
  البعير وضرب بقوائمه كلها قيل مريلتبط والاسم اللبطة بالتحريك وعد والاقزل لبطة
  أيضا ولبطة ابن الفرزدق حط لحط المكان لخطارشه ط لط بالافريلط
  اطالزمه واططت الشىء الصفته واططت حقه اذا حجدته وربما قالواتلطيت حقه لأنهم
  كرهوا اجتماع ثلاث طاآت فأبدلوا من الطاء الاخيرة ياء كما قالوا من اللعاع تلعيت وألطه علىّ
  آى أعانه أوجله عسلى أن يلطحقى يقال مالك تعينه عسلى لططه ولط السترأى أرخاه وكل شئ
  سترنه فقد اعطته قال الاعشى .
  ولقدساءها البياض فلطت • بحجاب من دوننا مصدوف ويروى مصروف
  واطت الناقة بذفيها اذا جعلته بين فيذيها وترس ماطرط أى منكب على وجهه
  قال ساعدة بن جوّبه
  صب اللهيف لها السبوب بطغية • تنبى العقاب كمايلط المجنب
  واللط قلادة بقال رأيت فى عنقها لطاحسنا وكرما حسنا وعقد احسنا كله بمعنى عن يعقوب
  قوله طط هذه المادة مكتوية
  بالجمرة فى القاموس دلالةء-لى
  انها من زيادته على السماح
  ولذلك هى ساقطة من جل النسخ
  قاله نصر
