label: { ar: "سنن أبي داود 1478 — الأحرف السبعة", en: "Sunan Abi Dawud 1478 — the seven ahruf", ur: "سنن ابی داؤد 1478 — سبعہ احرف", es: "Sunan Abi Dawud 1478 - los siete ahruf", fr: "Sunan Abi Dawud 1478 - les sept ahruf", tr: "Sunan Abi Davud 1478 — Yedi Mektup", id: "Sunan Abi Dawud 1478 — Tujuh Surat" }
text: "… عِنْدَ أَضَاةِ بَنِي غِفَارٍ فَأَتَاهُ جِبْرِيلُ فَقَالَ إِنَّ اللَّهَ عَزَّ وَجَلَّ يَأْمُرُكَ أَنْ تُقْرِئَ أُمَّتَكَ عَلَى حَرْفٍ. قَالَ \" أَسْأَلُ اللَّهَ مُعَافَاتَهُ وَمَغْفِرَتَهُ إِنَّ أُمَّتِي لاَ تُطِيقُ ذَلِكَ \". ثُمَّ أَتَاهُ ثَانِيَةً فَذَكَرَ نَحْوَ هَذَا حَتَّى بَلَغَ سَبْعَةَ أَحْرُفٍ قَالَ إِنَّ اللَّهَ يَأْمُرُكَ أَنْ تُقْرِئَ أُمَّتَكَ عَلَى سَبْعَةِ أَحْرُفٍ فَأَيُّمَا حَرْفٍ قَرَءُوا عَلَيْهِ فَقَدْ أَصَابُوا."
summary:
  ar: "حديث في سنن أبي داود، رقم 1478، يذكر الأحرف السبعة. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Abi Dawud, no. 1478 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions the seven ahruf. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 1478، جس میں سبعہ احرف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1478 (Oración (Kitab Al-Salat): Instrucciones detalladas sobre el Witr), menciona los siete ahruf. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Abi Dawud, n° 1478 (Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), mentionne les sept ahruf. Le catalogue du musée consacré à la lecture et à l’écriture du Coran le répertorie avec les textes du Coran, la Sunna, la sira et les ouvrages traitant de ce sujet."
  tr: "Sunan Abi Davud'da yer alan 1478 numaralı hadiste, Kur'an okumasının yedi farklı şeklinden bahsedilmektedir. Bu hadis, Kur'an okuma, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okuma ve yazma üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1478, menyebutkan tujuh cara membaca Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
