label: { ar: "جامع الترمذي 3038 — وصف المؤمن", en: "Jami' al-Tirmidhi 3038 — a description of the believer", ur: "جامع ترمذی 3038 — مومن کا وصف" }
text: "… مَخْرَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ لَمَّا نَزَلَتْْ : ⁦(مَنْ يَعْمَلْ سُوءًا يُجْزَ بِهِ )⁩ شَقَّ ذَلِكَ عَلَى الْمُسْلِمِينَ فَشَكَوْا ذَلِكَ إِلَى النَّبِيِّ فَقَالَ \" قَارِبُوا وَسَدِّدُوا وَفِي كُلِّ مَا يُصِيبُ الْمُؤْمِنَ كَفَّارَةٌ حَتَّى الشَّوْكَةِ يُشَاكُهَا أَوِ النَّكْبَةِ يُنْكَبُهَا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. ابْنُ مُحَيْصِنٍ هُوَ عُمَرُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ مُحَيْصِنٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3038، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 3038 (Chapters on Tafsir), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 3038، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
