label: { ar: "الموطأ 724 — مرسل سليمان بن يسار وبسر بن سعيد: فيما سقت السماء والعيون والبعل العشر، وفيما سقي بالنضح نصف العشر", en: "Muwatta 724" }
text: "فيما سقت السماء والعيون، والبعل: العشر، وفيما سقي بالنضح: نصف العشر"
summary:
  ar: "أول حديث في باب زكاة ما يُخرص من ثمار النخيل والأعناب. يرويه مالك عن الثقة عنده عن سليمان بن يسار وعن بسر بن سعيد مرسلاً، أن النبي قال: فيما سقت السماء والعيون والبعل العشر، وفيما سُقي بالنضح نصف العشر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي، وينقل عن ابن عبد البر (التمهيد 24/161) أنه يتصل من وجوه صحاح من حديث ابن عمر وجابر ومعاذ، ويضيف أن الترمذي (639) وابن ماجة (1816) روياه من طريق عاصم بن عبد العزيز عن الحارث بن أبي ذباب عن سليمان وبسر عن أبي هريرة، وأن الترمذي رأى أن المرسل أصح وأن حديث ابن عمر صح في الباب، وهو كما قال لأن عاصماً ضعيف عند المخالفة، وأن حديث ابن عمر عند البخاري (2/155) وأبي داود (1596) والترمذي (640) وقال: حسن صحيح. {cite:muwatta-maruf-1997 p.363}"
