label: { ar: "الموطأ 724 — مرسل سليمان بن يسار وبسر بن سعيد: فيما سقت السماء والعيون والبعل العشر، وفيما سقي بالنضح نصف العشر", en: "Muwatta 724", es: "Muwatta 724", fr: "Muwatta 724", ur: "موطا 724", tr: "El-Muvatta 724 — Süleyman ibn Yasar ve Busr ibn Sa’id’den rivayet edilen mursal bir hadis: Yağmurla, pınarlarla ve yağmurla sulanan arazilerde zekât verilir; yapay yollarla sulanan arazilerde ise zekâtın yarısı verilir.", id: "Al-Muwatta 724 — Hadits mursal dari Sulayman ibn Yasar dan Busr ibn Sa’id: Atas tanah yang diairi oleh hujan, mata air, dan tanah tadah hujan, wajib dikenakan zakat; dan atas tanah yang diairi dengan cara buatan, wajib dikenakan setengah zakat." }
text: "فيما سقت السماء والعيون، والبعل: العشر، وفيما سقي بالنضح: نصف العشر"
summary:
  ar: "أول حديث في باب زكاة ما يُخرص من ثمار النخيل والأعناب. يرويه مالك عن الثقة عنده عن سليمان بن يسار وعن بسر بن سعيد مرسلاً، أن النبي قال: فيما سقت السماء والعيون والبعل العشر، وفيما سُقي بالنضح نصف العشر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي، وينقل عن ابن عبد البر ⁦(التمهيد 24/161)⁩ أنه يتصل من وجوه صحاح من حديث ابن عمر وجابر ومعاذ، ويضيف أن الترمذي (639) وابن ماجة (1816) روياه من طريق عاصم بن عبد العزيز عن الحارث بن أبي ذباب عن سليمان وبسر عن أبي هريرة، وأن الترمذي رأى أن المرسل أصح وأن حديث ابن عمر صح في الباب، وهو كما قال لأن عاصماً ضعيف عند المخالفة، وأن حديث ابن عمر عند البخاري (2/155) وأبي داود (1596) والترمذي (640) وقال: حسن صحيح. {cite:muwatta-maruf-1997 p.363}"
  tr: "Zekat bölümündeki ilk hadis, tahmini hurma ve üzüm üzerinedir. Malik tarafından, Süleyman ibn Yasar ve Busr ibn Sa'id'den mursal biçimde rivayet edildiğine göre, Peygamberimiz şöyle buyurmuştur: \"Yağmurla sulanan, pınarlardan sulanan ve yağmurla beslenen arazilerde zekât onda birdir; yapay yollarla sulananlarda ise zekâtın yarısı onda birdir.\" Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab ve Yahya ibn Bukayr tarafından el-Beyhaki'nin derlemesinde nakledildiğini belirtmektedir. İbn Abdülberr'in (el-Temhid 24/161) bu hadisin İbn Ömer, Cabir ve Muaz'dan sağlam rivayet zincirleriyle nakledildiğini söylediğini aktarmaktadır. Tirmizi (639) ve İbn Mâce'nin (1816) bu hadisi Asım ibn Abdülaziz'den, o da Haris ibn Ebu Zübeyb'den, o da Süleyman ve Busr'dan, o da Ebu Hurayra'dan rivayet etmiştir diye ekliyor. Tirmizi, mürsel hadisi daha sahih kabul ederken, İbn Ömer'in hadisi bu bölümde sahihtir. Çünkü Asım'ın hadisi, çelişki olduğunda zayıf kabul edilir. İbn Ömer'in hadisi Buhari (2/155), Ebu Davud (1596) ve Tirmizi'de (640) bulunur ve Tirmizi hadisin hasen sahih (iyi ve sahih) olduğunu söylemiştir. {cite:muwatta-maruf-1997 s.363}"
  id: "Hadits pertama dalam bab tentang zakat adalah mengenai kurma dan anggur yang diperkirakan nilainya. Diriwayatkan oleh Malik dari sumber terpercaya, yaitu Sulayman bin Yasar dan Busr bin Sa'id, dalam bentuk mursal, bahwa Nabi bersabda: \"Untuk lahan yang diairi oleh hujan, mata air, dan tanah tadah hujan, zakatnya adalah sepersepuluh, dan untuk lahan yang diairi dengan cara buatan, zakatnya adalah setengah dari sepersepuluh.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Yahya bin Bukayr dalam kumpulan al-Bayhaqi. Ia mengutip Ibnu 'Abd al-Barr (al-Tamhid 24/161) yang mengatakan bahwa hadits ini terhubung melalui sanad yang sahih dari Ibnu 'Umar, Jabir, dan Mu'adh. Ia menambahkan bahwa al-Tirmidhi (639) dan Ibn Majah (1816) meriwayatkannya melalui sanad 'Asim ibn 'Abd al-'Aziz, berdasarkan riwayat al-Harith ibn Abi Dhubab, berdasarkan riwayat Sulayman dan Busr, berdasarkan riwayat Abu Hurayrah. Al-Tirmidhi menganggap hadits mursal lebih sahih, sedangkan hadits Ibn 'Umar sahih dalam bab ini. Ia benar karena 'Asim dianggap lemah ketika ada kontradiksi. Hadits Ibn 'Umar ditemukan dalam al-Bukhari (2/155), Abu Dawud (1596), dan al-Tirmidhi (640), yang mengatakan bahwa hadits tersebut hasan sahih (baik dan sahih). {cite:muwatta-maruf-1997 p.363}"
