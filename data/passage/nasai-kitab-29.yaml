  ar: "سنن النسائي، كتاب الإحباس"
  en: "Sunan al-Nasa'i, Book 29: The Book of Endowments"
  ur: "سنن نسائی، کتاب الاحباس"
  es: "Sunan al-Nasa'i, Libro 29: El Libro de las Ofrendas"
  fr: "Sunan al-Nasa'i, Livre 29: Le Livre des dotations"
summary:
  ar: "القسم 29 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإحباس»، ويضم فيها النصوص من 3594 إلى 3610 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 29 of Sunan al-Nasa'i (The Book of Endowments) in the division of the open hadith dataset the museum took its reports from: reports 3594 to 3610 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 29، عنوان «کتاب الاحباس»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3594 تا 3610۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 29 de Sunan al-Nasa'i (El Libro de las Ofrendas) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3594 al 3610, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan al-Nasa'i (Livre des dotations), dans le recueil ouvert de hadiths: les hadiths 3594 à 3610 de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
