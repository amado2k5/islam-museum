label:
  ar: "مسلم 2380c — موسى والعبد الصالح بمجمع البحرين"
  en: "Muslim 2380c — Musa and the righteous servant at the meeting of the two seas"
  ur: "مسلم 2380c — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
text: "إنه بينما موسى في قومه يذكرهم بأيام الله وأيام الله نعماؤه وبلاؤه إذ قال ما أعلم في الأرض رجلا خيرا أو أعلم مني . قال فأوحى الله إليه إني أعلم بالخير منه أو عند من هو إن في الأرض رجلا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2380c: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2380c: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2380c: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
