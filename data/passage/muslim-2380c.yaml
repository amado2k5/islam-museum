label:
  ar: "مسلم 2380c — موسى والعبد الصالح بمجمع البحرين"
  en: "Muslim 2380c — Musa and the righteous servant at the meeting of the two seas"
  ur: "مسلم 2380c — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
  es: "Muslim 2380c — Musa y el siervo justo en el encuentro de los dos mares"
  fr: "Muslim 2380c — Moïse et le serviteur vertueux au confluent des deux mers"
  tr: "Müslim 2380c — Musa ve salih kul, iki denizin birleştiği yerde"
  id: "Muslim 2380c — Musa dan hamba yang saleh di pertemuan dua laut"
text: "إنه بينما موسى في قومه يذكرهم بأيام الله وأيام الله نعماؤه وبلاؤه إذ قال ما أعلم في الأرض رجلا خيرا أو أعلم مني . قال فأوحى الله إليه إني أعلم بالخير منه أو عند من هو إن في الأرض رجلا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2380c: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2380c: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2380c: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2380c: Moisés y el siervo justo en el encuentro de los dos mares. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim, n° 2380c: Moïse et le pieux au confluent des deux mers. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Muslim'de 2380c numaralı hadis-i kudsi şöyledir: Musa ve salih kul, iki denizin birleştiği yerde. Peygamberimiz bunu Rabbinden rivayet eder ve hadis-i kudsi, bu rivayetleri altı şeriat hadis külliyatında ve Muvatta'da derler."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2380c: Musa dan hamba yang saleh di pertemuan dua laut. Nabi meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
