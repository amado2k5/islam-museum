text: "… مان البصرى بالبصرة ومكهول بالشام و يقال انه أدرك خسماثة من أصحاب رسول الّه وكان المولى الوالد رجم الله وحكر الشعبى قال أنفذنى عيد الملك بن مر وان الى ملك الروم فلما وصلت اليسيعل لا يسألنى عن شئ الاأحبته تعالى …"
