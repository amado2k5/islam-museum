label: { ar: "سنن ابن ماجه 114 — وصية أو عهد أخير", en: "Sunan Ibn Majah 114 — a testament or parting counsel", ur: "سنن ابن ماجہ 114 — وصیت یا آخری نصیحت", es: "Sunan Ibn Majah 114: un testamento o consejo de despedida", fr: "Sunan Ibn Majah 114 - un testament ou un conseil d'adieu" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا وَكِيعٌ، وَأَبُو مُعَاوِيَةَ وَعَبْدُ اللَّهِ بْنُ نُمَيْرٍ عَنِ الأَعْمَشِ، عَنْ عَدِيِّ بْنِ ثَابِتٍ، عَنْ زِرِّ بْنِ حُبَيْشٍ، عَنْ عَلِيٍّ، قَالَ عَهِدَ إِلَىَّ النَّبِيُّ الأُمِّيُّ ـ أَنَّهُ لاَ يُحِبُّنِي إِلاَّ مُؤْمِنٌ وَلاَ يُبْغِضُنِي إِلاَّ مُنَافِقٌ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 114، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 114 (The Book of the Sunnah), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 114، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 114 (El Libro de la Sunnah), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 114 (Le Livre de la Sunna), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
