label: { ar: "الموطأ 1427 — نافع: سأل عبد الرحمن بن أبي هريرة ابن عمر عما لفظ البحر فنهاه عن أكله، ثم قرأ آية الصيد في البحر فأذن بأكله", en: "Muwatta 1427" }
summary:
  ar: "يروي مالك عن نافع أن عبد الرحمن بن أبي هريرة سأل عبد الله بن عمر عما لفظ البحر، فنهاه عن أكله. قال نافع ثم انقلب عبد الله فدعا بالمصحف، فقرأ آية في سورة المائدة عن صيد البحر وطعامه، فأرسلني عبد الله بن عمر إلى عبد الرحمن بن أبي هريرة، إنه لا بأس بأكله. {cite:muwatta-maruf-1997 p.638}"
