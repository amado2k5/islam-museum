  ar: "القسم 57 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فرض الخمس»، ويضم فيها النصوص من 3091 إلى 3155 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 57 of Sahih al-Bukhari (One-fifth of Booty to the Cause of Allah (Khumus)) in the division of the open hadith dataset the museum took its reports from: reports 3091 to 3155 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 57، عنوان «کتاب فرض الخمس»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3091 تا 3155۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
