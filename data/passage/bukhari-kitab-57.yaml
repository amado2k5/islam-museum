summary:
  ar: "القسم 57 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فرض الخمس»، ويضم فيها النصوص من 3091 إلى 3155 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 57 of Sahih al-Bukhari (One-fifth of Booty to the Cause of Allah (Khumus)) in the division of the open hadith dataset the museum took its reports from: reports 3091 to 3155 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 57، عنوان «کتاب فرض الخمس»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3091 تا 3155۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 57 de Sahih al-Bukhari (Una quinta parte del botín para la causa de Alá (Khumus)) corresponde a la división del conjunto de datos de hadices abiertos del que el museo extrajo sus informes: informes del 3091 al 3155, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 57, intitulé « Le cinquième du butin pour la cause d'Allah (Khumus) »), dans la base de données ouverte: les hadiths 3091 à 3155 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 57. bölümü \"Humus Yükümlülüğü Kitabı\" başlığını taşımakta olup, 3091'den 3155'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 57 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Kewajiban Khums\" dan berisi teks 3091 hingga 3155, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
