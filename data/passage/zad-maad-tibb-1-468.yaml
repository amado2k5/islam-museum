text: "… بن عباس، وجماعةٍ مِن الصحابة، أن صيدَ البحر ما صِيد منه، وطعامَه ما مات فيه، وفي السنن: عن ابن عمر مرفوعاً وموقوفاً : أُحِلَّتْ لَنَا مَيْتَتَانٍ ودَمَانٍ، فَأَمَّا المَيْتَتَانِ: فَالسَّمَكُ والجَرادُ، وَأَمَّا الدَّمَانِ: فالكَبِدُ والطَّحَالُ الشافعي، وأحمد:، وابن ماجه:، حديث …"
