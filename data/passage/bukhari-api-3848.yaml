label: { ar: "صحيح البخاري 3848 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3848 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3848 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3848 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3848 — mentions de nations, religions et peuples non musulmans", tr: "Sahih el-Buhari 3848 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih al-Bukhari 3848 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ الْجُعْفِيُّ، حَدَّثَنَا سُفْيَانُ، أَخْبَرَنَا مُطَرِّفٌ، سَمِعْتُ أَبَا السَّفَرِ، يَقُولُ سَمِعْتُ ابْنَ عَبَّاسٍما ـ يَقُولُ يَا أَيُّهَا النَّاسُ، اسْمَعُوا مِنِّي مَا أَقُولُ لَكُمْ، وَأَسْمِعُونِي مَا تَقُولُونَ، وَلاَ تَذْهَبُوا فَتَقُولُوا قَالَ ابْنُ عَبَّاسٍ، قَالَ ابْنُ عَبَّاسٍ مَنْ طَافَ بِالْبَيْتِ فَلْيَطُفْ مِنْ وَرَاءِ الْحِجْرِ، وَلاَ تَقُولُوا الْحَطِيمُ، فَإِنَّ الرَّجُلَ فِي الْجَاهِلِيَّةِ كَانَ يَحْلِفُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3848، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3848 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3848، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 3848 (Méritos de los Ayudantes en Medina (Ansar)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 3848 (Mérites des Compagnons de Médine (Ansar)), mentionne des nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih el-Buhari'de 3848 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3848, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
