text: "… لله ورسوله عليع، ثم هي لكم. ميراث المرتد - أَخبرنا عبد الرزاق قال: أَخبرنا معمر عن الأَعمش عن أبي عمرو الشيباني قال: أُتِيَ عليٌّ بشيخ كان نصرانياً، ثم أَسلم، ثم ارتدَّ عن الإسلام، فقال له علَيٌّ : لعلك إنما ارتددتَ …"
