text: "التحيات لله، الزاكيات لله، الطيبات الصلوات لله، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله، وأشهد أن محمداً عبده ورسوله"
summary:
  ar: "أول أثر في باب التشهد في الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن عروة بن الزبير عن عبد الرحمن بن عبد القاري أنه سمع عمر بن الخطاب على المنبر يعلّم الناس صيغة التشهد التي تبدأ بالتحيات لله والزاكيات لله، وفيها السلام على النبي والسلام على عباد الله الصالحين والشهادتان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي والشافعي عند البيهقي ومحمد بن الحسن، ويرى أن هذا الأثر والأثرين بعده عن ابن عمر وعائشة حكمها الرفع لأن مثل هذا لا يقال بالرأي ولا يكون ذكر بعينه أولى من غيره إلا بتوقيف. {cite:muwatta-maruf-1997 p.144}"
  tr: "Namazda teşehhüd ile ilgili ilk rivayet, Yahya'nın Malik'ten, o da İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Abdurrahman ibn Abdurkari'den rivayet ettiğine göre, Ömer ibn el-Hattab'ın minberde insanlara teşehhüd formülünü öğrettiğini işittiğidir. Teşehhüd, \"Bütün selamlar ve temiz sözler Allah'a aittir\" ile başlar ve Peygambere salat, Allah'ın salih kullarına salat ve iki şahitlik içerir. Araştırmacı, bunun el-Tahavi'ye göre Ebu Musab, Suveyd ve İbn Vahb tarafından Malik'ten, el-Beyhakî ve Muhammed ibn el-Hasan'a göre ise Şafiî tarafından rivayet edildiğini belirtmektedir. O, İbn Ömer ve Ayşe'den rivayet edilen bu ve sonraki iki rivayetin Peygamber'e dayandırılmış olduğuna inanmaktadır; çünkü bu tür konular kişisel görüşe dayanarak söylenemez, ne de ilahi emir dışında bir dua diğerine tercih edilemez. {cite:muwatta-maruf-1997 s.144}"
  id: "Riwayat pertama mengenai Tasyahhud dalam salat. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Urwah ibn al-Zubayr, dari Abd al-Rahman ibn Abd al-Qari, bahwa ia mendengar Umar ibn al-Khattab di mimbar mengajarkan kepada orang-orang rumusan Tasyahhud, yang dimulai dengan \"Segala salam dan ucapan suci milik Allah,\" dan mencakup salam kepada Nabi, salam kepada hamba-hamba Allah yang saleh, dan dua syahadat. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwayd, dan Ibn Wahb menurut al-Tahawi, dan oleh al-Shafi'i menurut al-Bayhaqi dan Muhammad ibn al-Hasan. Ia meyakini bahwa riwayat ini dan dua riwayat setelahnya yang diriwayatkan oleh Ibnu Umar dan Aisyah mempunyai hukum yang berasal dari Nabi, karena hal-hal seperti itu tidak dapat dikatakan berdasarkan pendapat pribadi, dan tidak dapat pula satu doa tertentu diutamakan daripada doa lainnya kecuali atas petunjuk ilahi. {cite:muwatta-maruf-1997 p.144}"
