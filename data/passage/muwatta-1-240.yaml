label: { ar: "الموطأ 240 — عمر يعلّم الناس التشهد على المنبر", en: "Muwatta 240" }
text: "التحيات لله، الزاكيات لله، الطيبات الصلوات لله، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله، وأشهد أن محمداً عبده ورسوله"
summary:
  ar: "أول أثر في باب التشهد في الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن عروة بن الزبير عن عبد الرحمن بن عبد القاري أنه سمع عمر بن الخطاب على المنبر يعلّم الناس صيغة التشهد التي تبدأ بالتحيات لله والزاكيات لله، وفيها السلام على النبي والسلام على عباد الله الصالحين والشهادتان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي والشافعي عند البيهقي ومحمد بن الحسن، ويرى أن هذا الأثر والأثرين بعده عن ابن عمر وعائشة حكمها الرفع لأن مثل هذا لا يقال بالرأي ولا يكون ذكر بعينه أولى من غيره إلا بتوقيف. {cite:muwatta-maruf-1997 p.144}"
