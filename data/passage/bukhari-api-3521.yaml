label: { ar: "صحيح البخاري 3521 — البحيرة والسائبة وأول من سيّب السوائب", en: "Sahih al-Bukhari 3521 — the bahira, the sa'iba and the first to set animals loose for the idols", ur: "صحیح بخاری 3521 — بحیرہ، سائبہ اور سب سے پہلے جانور بتوں کے نام چھوڑنے والا", es: "Sahih al-Bukhari 3521 — el bahira, el sa'iba y el primero en soltar animales para los ídolos", fr: "Sahih al-Bukhari 3521 — les bahira, les sa'iba et les premiers à lâcher des animaux pour les idoles" }
text: "… أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، قَالَ سَمِعْتُ سَعِيدَ بْنَ الْمُسَيَّبِ، قَالَ الْبَحِيرَةُ الَّتِي يُمْنَعُ دَرُّهَا لِلطَّوَاغِيتِ وَلاَ يَحْلُبُهَا أَحَدٌ مِنَ النَّاسِ، وَالسَّائِبَةُ الَّتِي كَانُوا يُسَيِّبُونَهَا لآلِهَتِهِمْ فَلاَ يُحْمَلُ عَلَيْهَا شَىْءٌ. قَالَ وَقَالَ أَبُو هُرَيْرَةَ قَالَ النَّبِيُّ \" رَأَيْتُ عَمْرَو بْنَ عَامِرِ بْنِ لُحَىٍّ الْخُزَاعِيَّ يَجُرُّ قُصْبَهُ فِي النَّارِ، وَكَانَ أَوَّلَ مَنْ سَيَّبَ السَّوَائِبَ \"."
summary:
  ar: "خبر في صحيح البخاري، رقم 3521، في البحيرة والسائبة وأول من سيّب السوائب. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Sahih al-Bukhari, no. 3521, on the bahira, the sa'iba and the first to set animals loose for the idols. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "صحیح بخاری کی روایت نمبر 3521: بحیرہ، سائبہ اور سب سے پہلے جانور بتوں کے نام چھوڑنے والا۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3521, sobre el bahira, el sa'iba y el primero en liberar animales para los ídolos. No utiliza las palabras halal ni haram; el Navegador Halal y Haram lo incluye entre los relatos sobre el escrúpulo y la búsqueda de lo lícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 3521, relate l'histoire des bahira, des sa'iba et des premiers à avoir lâché des animaux pour les idoles. Il n'emploie pas les termes halal ou haram; le Halal and Haram Browser le classe parmi les hadiths évoquant le scrupule et la recherche du licite."
