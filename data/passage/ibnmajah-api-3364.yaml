label: { ar: "سنن ابن ماجه 3364 — الأب والأبوة", en: "Sunan Ibn Majah 3364 — the father and fatherhood", ur: "سنن ابن ماجہ 3364 — باپ اور والدیت", es: "Sunan Ibn Majah 3364 — El padre y la paternidad", fr: "Sunan Ibn Majah 3364 — Le père et la paternité" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي يَزِيدَ، عَنْ أَبِيهِ، عَنْ أُمِّ أَيُّوبَ، قَالَتْ صَنَعْتُ لِلنَّبِيِّ ـ طَعَامًا فِيهِ مِنْ بَعْضِ الْبُقُولِ فَلَمْ يَأْكُلْ وَقَالَ \" إِنِّي أَكْرَهُ أَنْ أُوذِيَ صَاحِبِي \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3364، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 3364 (Chapters on Food), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3364، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3364 (Capítulos sobre la alimentación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 3364 (Chapitres sur l'alimentation), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
