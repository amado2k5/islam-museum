text: "… ركعتين من التطوع الايوم الجمعة ولا يسبح ولا يقرأ حيث اراه ولم يكن احد أعلم بسره وعلا نيته منى- وسمعته يحلف كذا كذا مرة لو قدرت ان اتطوع حيث لإيرانى ملكاى لفعلت ولكنى لا استطيع ذلك خوفا من الرثاء وكان …"
summary:
  ar: "مقطع من صفة الصفوة، المجلد المصوَّر 2، ص 106، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
