label: { ar: "الموطأ 2136 — مالك: الأمر الذي لا اختلاف فيه عندنا أن من باع وليدة أو شيئا من الحيوان وفي بطنها جنين، فذلك الجنين للمشتري، اشترطه أو لم يشترطه. ومن أمر الناس أن يرهن الرجل ثمر النخل ولا يرهن النخل، وليس يرهن أحد من الناس جنينا في بطن أمه", en: "Muwatta 2136" }
summary:
  ar: "قال مالك: والأمر الذي لا اختلاف فيه عندنا أن من باع وليدة، أو شيئا من الحيوان، وفي بطنها جنين، أن ذلك الجنين للمشتري، اشترطه المشتري أو لم يشترطه. فليست النخل مثل الحيوان، وليس الثمر مثل الجنين في بطن أمه. قال مالك: ومما يبين ذلك أيضا أن من أمر الناس أن يرهن الرجل ثمر النخل، ولا يرهن النخل، وليس يرهن أحد من الناس جنينا في بطن أمه من الرقيق ولا من الدواب. {cite:muwatta-maruf-1997 p.272} {cite:muwatta-maruf-1997 p.273}"
