label: { ar: "الموطأ 2136 — مالك: الأمر الذي لا اختلاف فيه عندنا أن من باع وليدة أو شيئا من الحيوان وفي بطنها جنين، فذلك الجنين للمشتري، اشترطه أو لم يشترطه. ومن أمر الناس أن يرهن الرجل ثمر النخل ولا يرهن النخل، وليس يرهن أحد من الناس جنينا في بطن أمه", en: "Muwatta 2136", es: "Muwatta 2136", fr: "Muwatta 2136", ur: "موطا 2136", tr: "El-Muvatta 2136 — Malik: Bizim aramızda ihtilaf yoktur ki, bir kimse yeni doğmuş bir bebeği veya hamile bir hayvanı satarsa, bu şart koşulmuş olsun ya da olmasın, cenin alıcıya aittir. Ayrıca, bir adamın hurma ağacının meyvesini rehin verebileceği, ancak hurmanın kendisini rehin veremeyeceği de kesindir. Dahası, hiç kimse anne karnındaki cenini rehin veremez.", id: "Al-Muwatta 2136 — Malik: Tidak ada perbedaan pendapat di antara kami bahwa jika seseorang menjual bayi yang baru lahir atau hewan apa pun saat sedang hamil, janin tersebut menjadi milik pembeli, baik itu disepakati atau tidak. Telah ditetapkan pula bahwa seseorang boleh menjaminkan buah kurma sebagai jaminan, tetapi bukan pohon kurmanya sendiri. Lebih jauh lagi, tidak seorang pun boleh menjaminkan janin dalam kandungan ibunya sebagai jaminan." }
summary:
  ar: "قال مالك: والأمر الذي لا اختلاف فيه عندنا أن من باع وليدة، أو شيئا من الحيوان، وفي بطنها جنين، أن ذلك الجنين للمشتري، اشترطه المشتري أو لم يشترطه. فليست النخل مثل الحيوان، وليس الثمر مثل الجنين في بطن أمه. قال مالك: ومما يبين ذلك أيضا أن من أمر الناس أن يرهن الرجل ثمر النخل، ولا يرهن النخل، وليس يرهن أحد من الناس جنينا في بطن أمه من الرقيق ولا من الدواب. {cite:muwatta-maruf-1997 p.272} {cite:muwatta-maruf-1997 p.273}"
  tr: "Malik şöyle dedi: Bir kimse, rahminde cenin varken bir köle kız veya herhangi bir hayvan satarsa, alıcının şart koşup koşmamasına bakılmaksızın, o cenin alıcıya aittir. Aramızda hiçbir anlaşmazlık yoktur. Hurma ağaçları hayvanlar gibi değildir ve meyvesi de annesinin rahmindeki cenin gibi değildir. Malik ayrıca şunları söyledi: Bunun bir diğer kanıtı da, bir erkeğin hurma ağacının meyvesini rehin vermesinin adet olmasıdır, ancak hurmanın kendisini değil. Ve hiç kimse, ister köle olsun ister hayvan, annesinin rahmindeki bir cenini rehin vermez. {cite:muwatta-maruf-1997 s.272} {cite:muwatta-maruf-1997 s.273}"
  id: "Malik berkata: Tidak ada perbedaan pendapat di antara kita bahwa jika seseorang menjual seorang budak perempuan, atau hewan apa pun, sementara ia mengandung janin di dalam rahimnya, janin itu menjadi milik pembeli, baik pembeli menetapkannya atau tidak. Pohon kurma tidak seperti hewan, dan buahnya tidak seperti janin di dalam rahim ibunya. Malik juga berkata: Bukti lebih lanjut dari hal ini adalah bahwa sudah menjadi kebiasaan bagi seorang pria untuk menggadaikan buah pohon kurma, tetapi bukan pohon kurma itu sendiri. Dan tidak ada yang menggadaikan janin di dalam rahim ibunya, baik itu budak atau hewan. {cite:muwatta-maruf-1997 p.272} {cite:muwatta-maruf-1997 p.273}"
