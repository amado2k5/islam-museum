label: { ar: "سنن أبي داود 2396 — عمل يعدل عملا أعظم منه", en: "Sunan Abi Dawud 2396 — a deed that equals a greater one", ur: "سنن ابی داؤد 2396 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sunan Abi Dawud 2396 — una acción que equivale a una mayor", fr: "Sunan Abi Dawud 2396 — une action qui en vaut une plus grande", tr: "Sunan Abi Davud 2396 — Daha büyük bir eyleme denk olan bir eylem", id: "Sunan Abi Dawud 2396 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… مُحَمَّدُ بْنُ كَثِيرٍ، قَالَ أَخْبَرَنَا شُعْبَةُ، عَنْ حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ عُمَارَةَ بْنِ عُمَيْرٍ، عَنِ ابْنِ مُطَوِّسٍ، عَنْ أَبِيهِ، - قَالَ ابْنُ كَثِيرٍ عَنْ أَبِي الْمُطَوِّسِ، عَنْ أَبِيهِ، - عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ أَفْطَرَ يَوْمًا مِنْ رَمَضَانَ مِنْ غَيْرِ رُخْصَةٍ رَخَّصَهَا اللَّهُ لَهُ لَمْ يَقْضِ عَنْهُ صِيَامُ الدَّهْرِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2396، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 2396 (Fasting (Kitab Al-Siyam)), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 2396، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2396 (El ayuno (Kitab Al-Siyam)), habla de una acción que equivale a otra mayor. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 2396 (Le Jeûne (Kitab Al-Siyam)), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui dénombrent, inscrivent, effacent ou évaluent un acte."
  tr: "Sunan Ebu Davud'da yer alan 2396 numaralı hadiste, daha büyük bir ameli sayan bir amelden bahsedilir. Bu amel, iyi ve kötü ameller listeleriyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2396, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
