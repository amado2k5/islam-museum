label: { ar: "الموطأ 1580 — ابن شهاب عن رافع بن خديج: تزوج بنت محمد بن مسلمة فآثر عليها شابة، فطلقها واحدة ثم راجعها، ثم قال لها ما شئت، إنما بقيت واحدة، فاختارت أن تستقر على الأثرة", en: "Muwatta 1580" }
summary:
  ar: "يروي مالك عن ابن شهاب عن رافع بن خديج أنه تزوج بنت محمد بن مسلمة الأنصاري، فكانت عنده حتى كبرت، فتزوج عليها فتاة شابة، فآثر الشابة عليها، فناشدته الطلاق، فطلقها واحدة، ثم أمهلها حتى كادت تحل، فراجعها، ثم عاد فآثر الشابة عليها، فناشدته الطلاق، فطلقها واحدة، ثم راجعها، ثم عاد فآثر الشابة عليها، فناشدته الطلاق، فقال ما شئت، إنما بقيت واحدة، فإن شئت استقررت على ما ترين من الأثرة، وإن شئت فارقتك. قالت بل أستقر على الأثرة، فأمسكها على ذلك، ولم ير رافع عليه إثما حين قرت عنده على الأثرة. {cite:muwatta-maruf-1997 p.58}"
