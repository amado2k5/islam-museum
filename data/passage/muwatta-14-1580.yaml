label: { ar: "الموطأ 1580 — ابن شهاب عن رافع بن خديج: تزوج بنت محمد بن مسلمة فآثر عليها شابة، فطلقها واحدة ثم راجعها، ثم قال لها ما شئت، إنما بقيت واحدة، فاختارت أن تستقر على الأثرة", en: "Muwatta 1580", es: "Muwatta 1580", fr: "Muwatta 1580", ur: "موطا 1580", tr: "El-Muvatta 1580 — İbn Şihab, Rafi' ibn Hatic'ten rivayetle: Muhammed ibn Maslamah'ın kızıyla evlendi, fakat ondan daha genç bir kadını tercih etti. Bir keresinde onu boşadı, sonra tekrar aldı. Sonra ona, \"Dilediğin gibi yap, çünkü yalnızca bir kişi kaldı\" dedi. Bunun üzerine o da genç kadınla kalmayı seçti.", id: "Al-Muwatta 1580 — Ibn Shihab, berdasarkan riwayat Rafi’ ibn Khadij: Ia menikahi putri Muhammad ibn Maslamah, tetapi lebih menyukai wanita yang lebih muda darinya. Ia menceraikannya sekali, lalu menerimanya kembali. Kemudian ia berkata kepadanya, “Lakukanlah sesukamu, karena hanya satu yang tersisa.” Maka ia memilih untuk tetap bersama wanita yang lebih muda." }
summary:
  ar: "يروي مالك عن ابن شهاب عن رافع بن خديج أنه تزوج بنت محمد بن مسلمة الأنصاري، فكانت عنده حتى كبرت، فتزوج عليها فتاة شابة، فآثر الشابة عليها، فناشدته الطلاق، فطلقها واحدة، ثم أمهلها حتى كادت تحل، فراجعها، ثم عاد فآثر الشابة عليها، فناشدته الطلاق، فطلقها واحدة، ثم راجعها، ثم عاد فآثر الشابة عليها، فناشدته الطلاق، فقال ما شئت، إنما بقيت واحدة، فإن شئت استقررت على ما ترين من الأثرة، وإن شئت فارقتك. قالت بل أستقر على الأثرة، فأمسكها على ذلك، ولم ير رافع عليه إثما حين قرت عنده على الأثرة. {cite:muwatta-maruf-1997 p.58}"
  tr: "Malik, İbn Şihab'dan, o da Rafi' ibn Hatic'ten rivayet ettiğine göre, Muhammed ibn Maslamah el-Ensari'nin kızıyla evlendi. Kız yaşlanıncaya kadar onunla kaldı, sonra genç bir kadınla evlendi. Genç kadını ondan daha çok sevdi, bu yüzden kız ondan boşanmak istedi. Onu bir kez boşadı, sonra neredeyse yeniden evlenmeye hazır olana kadar ona zaman verdi, sonra onu geri aldı. Sonra tekrar genç kadını ondan daha çok sevdi, bu yüzden kız ondan boşanmak istedi. Onu bir kez boşadı, sonra geri aldı. Sonra tekrar genç kadını ondan daha çok sevdi, bu yüzden kız ondan boşanmak istedi. Ona, \"Dilediğin gibi yap. Sadece bir kişi kaldı. İstersen, sana olan sevgimi gördüğün gibi benimle kalabilirsin, istersen seni terk ederim.\" dedi. Kız, \"Sana olan sevgimle benimle kalacağım.\" dedi. Böylece onu bu durumda tuttu ve Rafi', onun kendisine olan sevgisine rağmen onunla kalmasını günah saymadı. {cite:muwatta-maruf-1997 s.58}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Rafi' ibn Khadij, bahwa ia menikahi putri Muhammad ibn Maslamah al-Ansari. Ia tetap bersamanya hingga tua, kemudian ia menikahi seorang wanita muda. Ia lebih menyukai wanita muda itu daripada putrinya, sehingga putrinya memohon cerai. Ia menceraikannya sekali, kemudian memberinya waktu hingga hampir bebas untuk menikah lagi, lalu ia menerimanya kembali. Kemudian ia kembali dan lebih menyukai wanita muda itu daripada putrinya, sehingga putrinya memohon cerai. Ia menceraikannya sekali, kemudian menerimanya kembali. Kemudian ia kembali dan lebih menyukai wanita muda itu daripada putrinya, sehingga putrinya memohon cerai. Ia berkata, \"Lakukanlah sesukamu. Hanya satu yang tersisa. Jika kau mau, kau dapat tetap bersamaku karena kau melihat aku lebih menyukaimu, atau jika kau mau, aku akan meninggalkanmu.\" Putrinya berkata, \"Aku akan tetap bersamaku karena aku lebih menyukaimu.\" Maka ia mempertahankannya dalam keadaan itu, dan Rafi' tidak menganggapnya sebagai dosa jika putrinya tetap bersamanya meskipun ia lebih menyukai putrinya. {mengutip:muwatta-maruf-1997 hal.58}"
