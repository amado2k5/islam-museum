text: "… العين كالضرس سألُوهُ يوماً عَنْ دواءٍ للعين المريضة فقال: أمس وجعني ضرسي فلم أجد وسيلةً إلا بقلعِهِ. مسافة تسعة أشهر بخمسة أيام وُلِدَ له مولودٌ في اليوم الخامس مِنْ زواجهِ، ففي اليوم التالي أحضرَ جزءَ ألف باء وأدواتِ الكتابةِ، ووضعَ …"
summary:
  ar: "سُئل جحا عن علاج لوجع العيون فقال إنه أصيب بوجع في ضرسه ولم يرتح إلا بعد قلعه. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  en: "Asked for a remedy for sore eyes, Juha says he had a toothache and only got relief by pulling the tooth. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  ur: "جحا سے آنکھوں کے درد کا علاج پوچھا گیا تو اس نے کہا کہ مجھے داڑھ میں درد ہوا تھا اور اسے نکلوانے کے بعد ہی آرام ملا۔ {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  fr: "Interrogé sur un remède contre les yeux douloureux, Juha dit qu'il a eu mal à une dent et n'a trouvé de soulagement qu'en l'arrachant. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  es: "Al preguntarle por un remedio para los ojos doloridos, Juha dice que tuvo dolor de muelas y solo se alivió al arrancarse el diente. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  tr: "Juha'ya göz ağrısına çare sorulduğunda, diş ağrısı çektiğini ve dişini çektirene kadar rahatlama bulamadığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 52}"
  id: "Juha ditanya tentang obat untuk sakit mata, dan dia menjawab bahwa dia pernah menderita sakit gigi dan tidak menemukan kesembuhan sampai giginya dicabut. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
