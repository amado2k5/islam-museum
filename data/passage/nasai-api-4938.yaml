label: { ar: "سنن النسائي 4938 — الأب والأبوة", en: "Sunan al-Nasa'i 4938 — the father and fatherhood", ur: "سنن نسائی 4938 — باپ اور والدیت", es: "Sunan al-Nasa'i 4938 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4938 — Le père et la paternité", tr: "Sunan an-Nasa'i 4938 — Baba ve Babalık", id: "Sunan an-Nasa'i 4938 — Sang Ayah dan Peran Ayah" }
text: "أَخْبَرَنَا أَبُو بَكْرِ بْنُ إِسْحَاقَ، قَالَ حَدَّثَنِي قُدَامَةُ بْنُ مُحَمَّدٍ، قَالَ أَخْبَرَنِي مَخْرَمَةُ بْنُ بُكَيْرٍ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ عُثْمَانَ بْنَ أَبِي الْوَلِيدِ، يَقُولُ سَمِعْتُ عُرْوَةَ بْنَ الزُّبَيْرِ، يَقُولُ كَانَتْ عَائِشَةُ تُحَدِّثُ عَنْ نَبِيِّ اللَّهِ أَنَّهُ قَالَ \" لاَ تُقْطَعُ الْيَدُ إِلاَّ فِي الْمِجَنِّ أَوْ ثَمَنِهِ \". وَزَعَمَ أَنَّ عُرْوَةَ قَالَ الْمِجَنُّ أَرْبَعَةُ دَرَاهِمَ.. قَالَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4938، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4938 (The Book of Cutting off the Hand of the Thief), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4938، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4938 (El Libro de la Perdición del Ladrón), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4938 (Le Livre de la Main Coupée du Voleur), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 4938 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4938, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
