text: "… وأجمع العلماء على أن الاعتكاف ليس بواجب وأنه سُنَّة، وأجمع الجمهور من الأئمة على أن الجمعة فرض على الأعيان، ومتى أجتمع واجبان أحدهما آكد من الآخر قُدّم الآكد؛ فكيف إذا أجتمع مندوب وواجب، ولم يقل أحد بترك الخروج إليها، فكان …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 815، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض العين، والواجب، والمندوب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 815, whose wording mentions what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn), the obligatory (wajib), the recommended (mandub), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
