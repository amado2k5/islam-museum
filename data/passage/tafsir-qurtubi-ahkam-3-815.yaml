text: "… وأجمع العلماء على أن الاعتكاف ليس بواجب وأنه سُنَّة، وأجمع الجمهور من الأئمة على أن الجمعة فرض على الأعيان، ومتى أجتمع واجبان أحدهما آكد من الآخر قُدّم الآكد؛ فكيف إذا أجتمع مندوب وواجب، ولم يقل أحد بترك الخروج إليها، فكان …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 815، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض العين، والواجب، والمندوب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 815, whose wording mentions what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn), the obligatory (wajib), the recommended (mandub), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 815 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ عین، واجب، مندوب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volume numérisé 3, p. 815, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligatoire (wajib), le recommandé (mandub), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volumen digitalizado 3, p. 815, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación individual (fard 'ayn), lo obligatorio (wajib), lo recomendado (mandub), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kurtubi'nin \"Kur'an'ın Cami'li Ahkâm'ı\" adlı eserinin 3. cildinin 815. sayfasından bir alıntı, farz olan fiiller, müstakbel yükümlülükler, görevler, tavsiye edilen fiiller ve farz olmayan fiiller de dahil olmak üzere insanlar için farz olan şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Qurtubi, Al-Jami' li-Ahkam al-Qur'an, Volume 3, halaman 815, membahas tentang apa yang wajib dilakukan oleh manusia, termasuk amalan wajib, kewajiban individu, tugas, amalan yang dianjurkan, dan amalan yang tidak wajib. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, tugas, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
