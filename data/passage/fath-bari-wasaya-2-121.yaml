text: "… فيهم، وحمص كانت قد فتحت قبل الغزوة التى كانت فيها أم حرام واللّه أعلم. قلت : وكانت غزوة يزيد المذكورة فى سنة النتين وخمسين من الهجرة، وفى تلك الغزاة مات أبو أيوب الأنصارى فأوصى أن يدفن عند باب القسطنطينية وأن …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 121، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 121, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 121 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 2, pág. 121, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fath al-Bari d'Ibn Hajar, tome 2, page 121, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Hacer'in Feth el-Bari adlı eserinin resimli 2. cildinin 121. sayfasında vasiyetname, defin, mezar ve türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Vasiyetnameler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Fath al-Bari karya Ibn Hajar, jilid bergambar 2, halaman 121, menyebutkan surat wasiat atau testamen terakhir, pemakaman, kuburan, dan makam; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh Wills, Inheritance, Antiquities, and Tombs Browser."
