label: { ar: "صحيح البخاري 6405 — محو السيئات وحط الخطايا، مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 6405 — bad deeds erased and sins shed; forgiveness of past sins", ur: "صحیح بخاری 6405 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا، پچھلے گناہوں کی مغفرت", es: "Sahih al-Bukhari 6405 — Las malas acciones son borradas y los pecados son perdonados; perdón de los pecados pasados.", fr: "Sahih al-Bukhari 6405 — Les mauvaises actions effacées et les péchés pardonnés; pardon des péchés passés", tr: "Sahih el-Buhari 6405 — Günahların silinmesi ve ihlallerin giderilmesi, geçmiş günahların bağışlanması", id: "Sahih al-Bukhari 6405 — Menghapus dosa dan menghilangkan pelanggaran, pengampunan dosa masa lalu" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ سُمَىٍّ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ أَنَّ رَسُولَ اللَّهِ قَالَ \" مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ. فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ، وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6405، يذكر محو السيئات وحط الخطايا، ومغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 6405 (Invocations), that speaks of bad deeds erased and sins shed, forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 6405، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا، پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6405 (Invocaciones), habla de malas acciones borradas y pecados perdonados, así como del perdón de pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 6405 (Invocations), évoque l'effacement des mauvaises actions et le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'une action."
  tr: "Sahih el-Buhari'de 6405 numaralı hadis, günahların silinmesinden ve geçmişteki yanlışların affedilmesinden bahseder. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6405, menyebutkan penghapusan dosa dan pengampunan atas pelanggaran masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
