label: { ar: "الموطأ 1040 — مالك: من حبس بعدو فحال بينه وبين البيت، فإنه يحل من كل شيء، وينحر هديه، ويحلق رأسه، وليس عليه قضاء", en: "Muwatta 1040", es: "Muwatta 1040", fr: "Muwatta 1040", ur: "موطا 1040", tr: "El-Muvatta 1040 — Malik: Düşman tarafından alıkonulup Kâbe'ye ulaşması engellenen kimse, tüm kısıtlamalardan kurtulur, kurbanını keser, başını tıraş eder ve kaçırdığı hacı telafi etmesi gerekmez.", id: "Al-Muwatta 1040 — Malik: Barangsiapa ditahan oleh musuh dan dihalangi untuk mencapai Ka'bah, maka ia dibebaskan dari segala halangan, ia harus menyembelih hewan kurbannya, dan mencukur kepalanya, dan ia tidak diwajibkan untuk mengganti ibadah haji yang terlewat." }
summary:
  ar: "قول يرويه يحيى عن مالك: من حبس بعدو فحال بينه وبين البيت، فإنه يحل من كل شيء، وينحر هديه، ويحلق رأسه حيث حُبس، وليس عليه قضاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1200). {cite:muwatta-maruf-1997 p.483} {cite:muwatta-maruf-1997 p.484}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Düşman tarafından alıkonulup Kâbe'ye ulaşması engellenen kimse, bütün kısıtlamalardan kurtulur; kurbanını keser, alıkonulduğu yerde başını tıraş eder ve kaçırdığı hacı telafi etmesi gerekmez. Araştırmacı, bu hadisin Ebu Musab (ö. 1200) tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.483} {cite:muwatta-maruf-1997 s.484}"
  id: "Sebuah hadits yang diriwayatkan oleh Yahya dari Malik: Barangsiapa ditahan oleh musuh dan dihalangi untuk mencapai Ka'bah, maka ia dibebaskan dari segala halangan, ia boleh menyembelih hewan kurbannya, dan mencukur kepalanya di tempat ia ditahan, dan ia tidak diwajibkan untuk mengganti ibadah haji yang terlewat. Peneliti menyebutkan bahwa Abu Mus'ab (wafat 1200) meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.483} {cite:muwatta-maruf-1997 p.484}"
