label: { ar: "سنن ابن ماجه 3501 — الدواء", en: "Sunan Ibn Majah 3501 — the drug", ur: "سنن ابن ماجہ 3501 — دوا", es: "Sunan Ibn Majah 3501 - la droga", fr: "Sunan Ibn Majah 3501 — le médicament", tr: "Sünen İbn Mace 3501 — Tıp", id: "Sunan Ibnu Majah 3501 — Kedokteran" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدِ بْنِ عُتْبَةَ بْنِ عَبْدِ الرَّحْمَنِ الْكِنْدِيُّ، حَدَّثَنَا عَلِيُّ بْنُ ثَابِتٍ، حَدَّثَنَا سَعَّادُ بْنُ سُلَيْمَانَ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْحَارِثِ، عَنْ عَلِيٍّ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" خَيْرُ الدَّوَاءِ الْقُرْآنُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3501، يذكر الدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3501 (Chapters on Medicine), that mentions the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3501، جس میں دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "En el Sunan Ibn Majah, n.º 3501 (Capítulos sobre Medicina), se menciona el fármaco. El buscador de información sobre medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3501 (Chapitres sur la médecine), mentionne ce médicament. Le Répertoire des médicaments le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3501 numaralı hadiste tıptan bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3501, menyebutkan tentang pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, pengobatan, anatomi, pembedahan, dan terapi."
