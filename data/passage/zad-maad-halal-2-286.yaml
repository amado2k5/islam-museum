text: "… إلى فعله حلالاً، لأنه لا يجوز تقديمُ الكفارة، فيستفيدُ بها الحل، وإقدامه عليه وهو حرامٌ ممتنع، هذا ما قيل في المسألة من الجانبين. وبعدُ، فلها غور، وفيها دِقة وغموض، فإن من حرَّم شيئاً، فهو بمنزلة من حَلَفَ بالله على تركه، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 286، يذكر الحلال، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 286, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 2، ص 286 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
