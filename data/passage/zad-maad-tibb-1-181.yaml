text: "… غيرَ اللَّه، عُذِبَ به، وسُجِنَ قلبُه في محبة ذلك الغير، فما في الأرض أشقى منه، ولا أكسف بالاً، ولا أنكد عيشاً، ولا أتعب قلباً، فهما محبتان، محبة هي جنة الدنيا، وسرور النفس، ولذةُ القلب، ونعيم الروح، وغِذاؤها، ودواؤها، بل حياتُها …"
