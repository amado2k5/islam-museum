label: { ar: "الموطأ 1928 — مالك: من سلف في سلعة إلى أجل، وكانت مما لا يؤكل ولا يشرب، فإن المشتري يبيعها ممن شاء بنقد أو عرض قبل أن يستوفيها، ولا ينبغي أن يبيعها من الذي ابتاعها منه إلا بعرض يقبضه ولا يؤخره", en: "Muwatta 1928", es: "Muwatta 1928", fr: "Muwatta 1928", ur: "موطا 1928", tr: "El-Muvatta 1928 — Malik: Bir kimse, yenmeyen veya içilmeyen bir malı kredili olarak alırsa, alıcı, malı teslim almadan önce dilediğine nakit veya mal karşılığında satabilir. Ancak, teslim aldığı ve geciktirmediği mallar hariç, satın aldığı kişiye geri satamaz.", id: "Al-Muwatta 1928 — Malik: Jika seseorang mengambil pinjaman untuk suatu barang secara kredit, dan barang tersebut bukan untuk dimakan atau diminum, maka pembeli boleh menjualnya kepada siapa pun yang ia inginkan dengan uang tunai atau barang lain sebelum mengambil alih kepemilikannya. Ia tidak boleh menjualnya kembali kepada orang yang menjualnya kepadanya kecuali untuk barang yang ia ambil alih kepemilikannya dan tidak ditunda." }
summary:
  ar: "قال مالك: ومن سلف في سلعة إلى أجل، وتلك السلعة مما لا يؤكل ولا يشرب، فإن المشتري يبيعها ممن شاء، بنقد أو عرض، قبل أن يستوفيها، من غير صاحبها الذي اشتراها منه، ولا ينبغي له أن يبيعها من الذي ابتاعها منه، إلا بعرض يقبضه ولا يؤخره. قال مالك: وإن كانت السلعة لم تحل، فلا بأس بأن يبيعها من صاحبها بعرض مخالف لها بين خلافه، يقبضه ولا يؤخره. {cite:muwatta-maruf-1997 p.189}"
  tr: "Malik şöyle demiştir: Bir kimse, ne yenilen ne de içilen bir mal için borç verirse, alıcı, malı teslim almadan önce, asıl satıcıdan başka birinden, nakit veya mal karşılığında dilediği kişiye satabilir. Ancak, derhal ve gecikmeksizin teslim aldığı mallar hariç, malı asıl satıcıya geri satmamalıdır. Malik ayrıca şöyle demiştir: Eğer mal henüz satılabilir durumda değilse, malın asıl sahibine, açıkça ondan farklı mallar karşılığında geri satılmasında bir sakınca yoktur; yeter ki alıcı derhal ve gecikmeksizin malları teslim alsın. {cite:muwatta-maruf-1997 s.189}"
  id: "Malik berkata: Jika seseorang berhutang dengan jaminan barang yang tidak dimakan atau diminum, pembeli boleh menjualnya kepada siapa pun yang diinginkannya, dengan uang tunai atau barang lain, sebelum mengambil alih kepemilikannya, dari orang lain selain penjual aslinya. Ia tidak boleh menjualnya kembali kepada penjual aslinya kecuali untuk barang yang segera ia ambil alihnya tanpa penundaan. Malik juga berkata: Jika barang tersebut belum boleh dijual, tidak ada salahnya menjualnya kembali kepada pemilik aslinya dengan barang yang jelas berbeda darinya, asalkan ia segera mengambil alih kepemilikannya tanpa penundaan. {cite:muwatta-maruf-1997 p.189}"
