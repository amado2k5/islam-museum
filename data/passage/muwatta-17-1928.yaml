label: { ar: "الموطأ 1928 — مالك: من سلف في سلعة إلى أجل، وكانت مما لا يؤكل ولا يشرب، فإن المشتري يبيعها ممن شاء بنقد أو عرض قبل أن يستوفيها، ولا ينبغي أن يبيعها من الذي ابتاعها منه إلا بعرض يقبضه ولا يؤخره", en: "Muwatta 1928" }
summary:
  ar: "قال مالك: ومن سلف في سلعة إلى أجل، وتلك السلعة مما لا يؤكل ولا يشرب، فإن المشتري يبيعها ممن شاء، بنقد أو عرض، قبل أن يستوفيها، من غير صاحبها الذي اشتراها منه، ولا ينبغي له أن يبيعها من الذي ابتاعها منه، إلا بعرض يقبضه ولا يؤخره. قال مالك: وإن كانت السلعة لم تحل، فلا بأس بأن يبيعها من صاحبها بعرض مخالف لها بين خلافه، يقبضه ولا يؤخره. {cite:muwatta-maruf-1997 p.189}"
