label: { ar: "سنن النسائي 1870 — الأب والأبوة", en: "Sunan al-Nasa'i 1870 — the father and fatherhood", ur: "سنن نسائی 1870 — باپ اور والدیت", es: "Sunan al-Nasa'i 1870 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1870 — le père et la paternité", tr: "Sunan an-Nasa'i 1870 — Baba ve Babalık", id: "Sunan an-Nasa'i 1870 — Sang Ayah dan Peran Ayah" }
text: "… عَلِيٍّ، قَالَ حَدَّثَنَا يَحْيَى، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ حَدَّثَنَا أَبُو إِيَاسٍ، - وَهُوَ مُعَاوِيَةُ بْنُ قُرَّةَ - عَنْ أَبِيهِ، أَنَّ رَجُلاً، أَتَى النَّبِيَّ وَمَعَهُ ابْنٌ لَهُ فَقَالَ لَهُ \" أَتُحِبُّهُ \". فَقَالَ أَحَبَّكَ اللَّهُ كَمَا أُحِبُّهُ. فَمَاتَ فَفَقَدَهُ فَسَأَلَ عَنْهُ فَقَالَ \" مَا يَسُرُّكَ أَنْ لاَ تَأْتِيَ بَابًا مِنْ أَبْوَابِ الْجَنَّةِ إِلاَّ وَجَدْتَهُ عِنْدَهُ يَسْعَى …"
summary:
  ar: "حديث في سنن النسائي، رقم 1870، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1870 (The Book of Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1870، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1870 (El Libro de los Funerales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1870 (Le Livre des funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 1870 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, bu hadisi İslam'da babalık bölümünde, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 1870, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits ini dalam bagian tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
