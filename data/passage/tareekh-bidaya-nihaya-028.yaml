text: "ايعتهم إلا القليل منهم، وبعث علي إلى معاوية كتبا كثيرة فلم يرد عليه جوابها، وتكرر ذلك مرارا إلى الشهر الثالث من مقتل عثمان في صفر، ثم بعث معاوية طومارا مع رجل فدخل به على علي فقال: ما وراءك؟ قال: جئتك"
