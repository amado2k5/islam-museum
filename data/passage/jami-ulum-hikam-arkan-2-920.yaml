text: "… شعب الإيمان ومن هذا الباب من قَوي توكُله على اللّٰه ووثوقه به، فدخل المفاوزَ بغير زاد، فإنَّه يجوزُ لمن هذه صفته دون من لم يبلغ هذه المنزلة، وله في ذلك أسوة بإبراهيم الخليل، حيث ترك هاجرَ وابنها إسماعيل بوادٍ غير …"
summary:
