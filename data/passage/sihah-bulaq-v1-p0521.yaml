text: |-
  ١ ا سكوت هوز الكلام مع
  القدرة علي بخلاف الصعت فلا
  تعتبر فيه ولذا قيل الصامت لمالا
  تعاق له تقله شضا ءن بعض
  المحدة ين ثم قال فاطلاق أ-+ هما
  على الا خرفى المصباح وغيره
  أى ك المحاح والاساس
  والقاموس -ن الاطلاقات
  اللغوية العامة أه م ر بالمعنى
  ( ٢ كسر الأوّل وشذ الثانى
  فى الكلمتين اه
  ( ٣ قلت هذا التفسير أخصر
  عما نسرهيه فى نعابق اه مختار
  باب التاء)
  لشمان مابين اليزيدين فى الذدى * يزيدسليم والاغرابن حاتم
  ليس بححة انماه وم ولد والجة قول الاعشى
  شتان مايومى على كورها * ويوم حدان أخى جابر
  وشتان مصروفة عن شتت فالنتحة التى فى الفون هى الفتحة التى كانت فى الساء لتدل على
  أنه مصروف عن الفعل الماضى وكذلك سرعان ووشكان صروف من وشلك وسرع نقول
  وشكان ذاخر وجاورعان ذاخر وجاويقال إنّ المجلس، ليجمع شتوتامن الناس أى ناسا
  ليسوامن قبيلة واحدة ⁦( خت)⁩ الشخت ال.قيق والجمع شخات وقد شخت الرجل بالضم
  فهوشخت وشيخت ( مت لشماتة الفرح ببلية العدو يقال شمت به بالكسريشمت
  تماقة وبات فلان بليلة الشوامت أى بليلة تشمت الشواعت وتشميت العاطس دعاء وكل داع
  لاحد بخير فهو مشمت ومسمت ويقال وجع القوم شماتامن متوجههم يالكسر أى خائبين
  وهوفى شه رساعدة والشواءت قواتم الدابة وهواسم اها قال أيو عرويقال لاترل
  اللّٰه له شامتة أى قائة
  صل الصاد ( نت لصت الصدم والصيت الجلبة يقال مازات أصات فلانا
  صفاتا أى أخاصمه وفى الحديث قامواصتيتير أى جاعتين والصمتيت الصنديذ وهو السيد
  اسكريم صفت رجل صفتيت وصفتات أى قوى حسيم لت الصات الجبين
  الواضح تول منه علت بالضم صلوتة وسيف إصليت أى صقيل ويجوز أن يكون فى معسني
  مصات وأصلت سيفه أى جرّده من غمدهفه ومصلت وضربه بالسسيف صلنا رصلتا ذانريه
  به وهو مصات والصلت بالضم السكين الحتتبير والجمع أصلات ورجل مصات بكسر المسيم
  اذا كان ماضيا فى الاموروكذلك أصلمنىّ ومنصات وصلت ومصلات قال عامر بن الطفيل
  وإنا المصاليت يوم الوغى * اذا ما المغاوير لم تقدم
  وجاء بلبن يصلت ومرق يصلت اذا كأن قليل الدسم كثير الماء وصلت ما فى القدح اذاصببته
  وصلت الفرس اذاركضته وانصلت فى سيره أى مضى وسيق والصلتانمن الهر الشديدومن
  الخيل النشبط الحديد الفواد والصات اسم رجل ⁦(صمت )⁩ صمت يصمت صمتار صموتا
  وسما تاسكت ١ أصمت مثله والتصحيت التسكيت والتصميت أيضا السكوت ورجل
  صحيت أى سكيت (٢ و الصمسة بالضم مثل السكتة أبو زيدرم بته بصماته وسكانه أى بما
  صحت به وسكت ويقال فلان عسلى صمات الامراذا أشرف على قضائه وبات من القوم على
  صمان اى بمرأى ومسمع فى القرب قال الشاعر
  وحاجة كنت على صماتها أى
  كنت على شرف من ادرا كها ويروى بتاتها د تقول ماله صامت ولا ناطق قاتصامت الذهب
  والفضة والناطق الابل والفسنم أى ليس له شئ ٣ الصامت من اللبن الخاتر والصيوت
  الدرع التى اذاصبت لم يسمع اهاصوت والصوت اسم فرس وقال والمثلم بن عمر والتنوخى
  حتى أرى فارس الصموت على • أكساءخيل كأنما الابل
  أبو عبيد المصمت الذى لاجوف له وقد أصمته أنا وباب مصحت قدأ به-م اغلاقه والمصمت. ن
  لخيل البهيم أى لون كان لا يخااط لونه لون آخر أبو زيداقيته بوحش اصحت ولقيته يلد
  اصمت
