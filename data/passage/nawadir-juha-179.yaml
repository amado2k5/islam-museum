text: "… حتى الموقدة تخشى المرأة أراد يوماً أن يُشْعِلَ النار في الموقدةِ، فنفخ كثيراً فلم تشتعِلْ فطلع في الحال إلى غرفة امرأتهِ، وأتى بقُفطانها ووضعه على رأسِهِ ونفخ: بف... بف... فاشتعلت النار. فقال الشيخ: يا للعجبِ! حتى الموقدة تخشى امرأتي! جئت …"
summary:
  ar: "لم يستطع جحا إشعال الموقد، فأخذ قفطان زوجته وراح يروّح به النار فاشتعلت، وقال إن حتى الموقد يخشى زوجته. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  en: "Juha cannot light the hearth, so he takes his wife's kaftan and fans the fire with it; it lights; he says even the hearth fears his wife. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  ur: "جحا چولہا نہ جلا سکا تو اس نے بیوی کا قفطان لے کر اس سے آگ کو ہوا دی اور آگ جل اٹھی؛ اس نے کہا کہ چولہا بھی میری بیوی سے ڈرتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  fr: "Juha n'arrive pas à allumer le foyer; il prend le caftan de sa femme et en évente le feu, qui s'allume; il dit que même le foyer craint sa femme. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  es: "Juha no logra encender el fogón, así que toma el caftán de su mujer y aviva el fuego con él; el fuego prende; Juha dice que hasta el fogón teme a su mujer. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
