label: { ar: "صحيح البخاري 7462 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 7462 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 7462 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 7462 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 7462 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، عَنْ عَبْدِ الْوَاحِدِ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنِ ابْنِ مَسْعُودٍ، قَالَ بَيْنَا أَنَا أَمْشِي، مَعَ النَّبِيِّ فِي بَعْضِ حَرْثِ الْمَدِينَةِ وَهْوَ يَتَوَكَّأُ عَلَى عَسِيبٍ مَعَهُ، فَمَرَرْنَا عَلَى نَفَرٍ مِنَ الْيَهُودِ فَقَالَ بَعْضُهُمْ لِبَعْضٍ سَلُوهُ عَنِ الرُّوحِ. فَقَالَ بَعْضُهُمْ لاَ تَسْأَلُوهُ أَنْ يَجِيءَ فِيهِ بِشَىْءٍ تَكْرَهُونَهُ. فَقَالَ بَعْضُهُمْ لَنَسْأَلَنَّهُ. فَقَامَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7462، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7462 (Oneness, Uniqueness of Allah (Tawheed)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 7462، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7462 (Unicidad de Dios (Tawhid)), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 7462 (L'Unicité d'Allah (Tawhid)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
