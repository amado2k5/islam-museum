label: { ar: "الموطأ 1744 — ضمرة بن سعيد المازني عن الحجاج بن عمرو بن غزية: سأل رجل من أهل اليمن زيد بن ثابت عن العزل عن جواريه، فقال زيد أفته يا حجاج، فقال هو حرثك", en: "Muwatta 1744", es: "Muwatta 1744", fr: "Muwatta 1744", ur: "موطا 1744", tr: "El-Muvatta 1744 — Damrah ibn Saeed al-Mazini, el-Hajjaj ibn Amr ibn Ghaziyah'dan rivayetle: Yemenli bir adam Zayd ibn Thabit'e cariyeleriyle cinsel ilişkiyi kesme konusunda sordu. Bunun üzerine Zayd, \"Ey Hajjaj, ona bir fetva ver\" dedi. Adam, \"Bu senin alanın\" dedi.", id: "Al-Muwatta 1744 — Damrah ibn Saeed al-Mazini, berdasarkan riwayat al-Hajjaj ibn Amr ibn Ghaziyah: Seorang pria dari Yaman bertanya kepada Zayd ibn Thabit tentang coitus interruptus dengan budak-budak perempuannya, lalu Zayd berkata, “Berikan fatwa kepadanya, wahai Hajjaj.” Beliau menjawab, “Itu adalah bidangmu.”" }
summary:
  ar: "يروي مالك عن ضمرة بن سعيد المازني عن الحجاج بن عمرو بن غزية أنه كان جالسا عند زيد بن ثابت، فجاءه رجل من أهل اليمن يسأل عن جواريه، ويقول إنه لا يحب أن يحملن منه، أفيعزل؟ فقال زيد: أفته يا حجاج. فقال الحجاج: هو حرثك، إن شئت سقيته، وإن شئت أعطشته. فقال زيد: صدق. {cite:muwatta-maruf-1997 p.111}"
  tr: "Malik, Damrah ibn Sa'id al-Mazini'den, o da al-Hajjaj ibn 'Amr ibn Ghaziyah'dan rivayet ettiğine göre, Zayd ibn Thabit ile otururken Yemenli bir adam yanına gelip cariyeleri hakkında sorular sormuş, cariyelerinin kendisinden hamile kalmasını istemediğini ve cinsel ilişkiyi kesintiye uğratıp uğratmayacağını sormuş. Zayd, \"Ey Hajjaj, ona bir fetva ver\" demiş. Al-Hajjaj, \"Burası senin tarlan; istersen sulayabilirsin, istersen sulamayı kesebilirsin\" demiş. Zayd, \"Doğru söylüyor\" demiş. {cite:muwatta-maruf-1997 s.111}"
  id: "Malik meriwayatkan dari Damrah ibn Sa'id al-Mazini, dari al-Hajjaj ibn 'Amr ibn Ghaziyah, bahwa ia sedang duduk bersama Zayd ibn Thabit ketika seorang pria dari Yaman datang kepadanya menanyakan tentang budak-budak perempuannya, mengatakan bahwa ia tidak ingin mereka hamil karena dirinya, dan apakah ia harus melakukan coitus interruptus (hubungan sedarah setelah ejakulasi). Zayd berkata: Berikan fatwa kepadanya, wahai Hajjaj. Al-Hajjaj berkata: Itu ladangmu; jika kau mau, kau boleh mengairinya, dan jika kau mau, kau boleh menahannya. Zayd berkata: Dia mengatakan yang benar. {cite:muwatta-maruf-1997 p.111}"
