label: { ar: "الموطأ 1744 — ضمرة بن سعيد المازني عن الحجاج بن عمرو بن غزية: سأل رجل من أهل اليمن زيد بن ثابت عن العزل عن جواريه، فقال زيد أفته يا حجاج، فقال هو حرثك", en: "Muwatta 1744" }
summary:
  ar: "يروي مالك عن ضمرة بن سعيد المازني عن الحجاج بن عمرو بن غزية أنه كان جالسا عند زيد بن ثابت، فجاءه رجل من أهل اليمن يسأل عن جواريه، ويقول إنه لا يحب أن يحملن منه، أفيعزل؟ فقال زيد: أفته يا حجاج. فقال الحجاج: هو حرثك، إن شئت سقيته، وإن شئت أعطشته. فقال زيد: صدق. {cite:muwatta-maruf-1997 p.111}"
