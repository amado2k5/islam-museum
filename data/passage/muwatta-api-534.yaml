label: { ar: "موطأ مالك 534 — دفن وقبر ومرقد", en: "Muwatta Malik 534 — a burial, grave or resting place", ur: "موطأ مالک 534 — تدفین، قبر اور مرقد", es: "Muwatta Malik 534 — un lugar de entierro, tumba o descanso.", fr: "Muwatta Malik 534 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… - فَقَالَ رَسُولُ اللَّهِ \" إِذَا مَاتَتْ فَآذِنُونِي بِهَا \". فَخُرِجَ بِجَنَازَتِهَا لَيْلاً فَكَرِهُوا أَنْ يُوقِظُوا رَسُولَ اللَّهِ فَلَمَّا أَصْبَحَ رَسُولُ اللَّهِ أُخْبِرَ بِالَّذِي كَانَ مِنْ شَأْنِهَا فَقَالَ \" أَلَمْ آمُرْكُمْ أَنْ تُؤْذِنُونِي بِهَا \". فَقَالُوا يَا رَسُولَ اللَّهِ كَرِهْنَا أَنْ نُخْرِجَكَ لَيْلاً وَنُوقِظَكَ. فَخَرَجَ رَسُولُ اللَّهِ حَتَّى صَفَّ بِالنَّاسِ عَلَى قَبْرِهَا وَكَبَّرَ أَرْبَعَ تَكْبِيرَاتٍ."
summary:
  ar: "حديث في موطأ مالك، رقم 534، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 534 (Burials), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "موطأ مالک کی حدیث نمبر 534، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "En el Muwatta Malik, n.º 534 (Sepulturas), se menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un rapport du Muwatta Malik, n° 534 (Sépultures), mentionne une sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
