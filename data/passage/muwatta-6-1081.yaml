label: { ar: "الموطأ 1081 — يحيى بن سعيد عن عمر: أن عمر بن الخطاب رد رجلاً من مر الظهران لم يكن ودع البيت حتى ودع", en: "Muwatta 1081", es: "Muwatta 1081", fr: "Muwatta 1081", ur: "موطا 1081", tr: "El-Muvatta 1081 — Yahya bin Said, Ömer'den rivayetle: Ömer bin Hattab, Kâbe'ye veda etmemiş olan bir adamı, veda ettikten sonra Mar el-Zahran'dan geri gönderdi.", id: "Al-Muwatta 1081 — Yahya bin Saeed berdasarkan riwayat Umar: bahwa Umar bin Al-Khattab memulangkan seorang pria dari Mar Al-Zahran yang belum mengucapkan selamat tinggal kepada Ka'bah hingga ia melakukannya." }
text: "رد رجلاً من مر الظهران لم يكن ودع البيت حتى ودع"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أن عمر بن الخطاب رد رجلاً من مر الظهران لم يكن ودع البيت حتى ودع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1444) والشافعي والبيهقي ويحيى بن بكير. {cite:muwatta-maruf-1997 p.497}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ettiğine göre, Ömer ibn el-Hattab, henüz Kâbe'ye veda etmemiş olan bir adamı Merr el-Zehran'dan geri göndermiştir. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1444), Şafiî, Beyhaki ve Yahya ibn Bukayr tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.497}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id bahwa Umar ibn al-Khattab mengirim kembali seorang pria dari Marr al-Zahran yang belum mengucapkan selamat tinggal kepada Ka'bah. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1444), al-Shafi'i, al-Bayhaqi, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.497}"
