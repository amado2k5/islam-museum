text: |-
  ٢٥٦
  ⁦(ياب الذال)⁩
  ( كرد
  كان لبنى تغلب عن الاسمعى ويقال للقدّ الذى يضم عرقوبى الرحل قي دقال الاحر قيد الفرس
  عة تكون فى عنق البعير على صورة القيد وآنتد
  كوم على أعناقها فد الفرس • مهواذا اللمل تدانى والندس
  والمي دموضع القيد من رجل الفرس والخلخال من المرأة وتقول بينهما فيدرمح بالك.
  وقاد رمح أى قد ررح والقيد الذى اذاقدته ساهلك وقال الشاءر
  وشاعرقوم قد حسمت خصاءه * وكان له قبل الخصاه كتيت
  أشمّ خبوط بالفراسن مصعب • فاصبح منق.-داتربون
  والقياد حيل تقاديه الداية .
  صل الكاف كاد عقبة كؤرد شاقة المصعد وتكاء دئى الشى وتكأ دنى أى شق
  علىّ تفاعل وتفعل بمعنى ⁦(كبد)⁩ الكبد والكبدواحدة الاكباد مثل كذب وكذب
  ويقال أيضا كبد للتخفيف كما قالو الأفخذ فخذوكيد السماء وسطها يقال كبد النجم السماء
  أى توسطها وتكيدت الشمس أى صارت فى كبد السماء وتكبند اللبن غلظ وختر
  وكبيدات السماء كانهم صغروا كبيدة ثم جعوا وكبد القوس مقبضها يقال ضع السهم على
  كبد القوس وهى مابين مقبضها ومجرى السهم منها وكبدت الرجل أصبت كبده
  فهو مكبود والاكبد الضخم الوسط ولا يكون الابطىء السيروامرأة كبداه ببنة الكبد
  بالتحريك وقوس كبداء اذا ملاً مقبضها الكف والكبد الشدّة قال نعالى لقد خلقنا
  الانسان فى كيدوكابدت الامراذاقاسيت شدنه والكباد وجمع السكبدوفى الحديث السكبا
  من العب الاصعى بقال للاعداء سود الا كباد كما بقال لهم صهب السبال وان لمك ونو
  كذلك قال الاعشى
  فاأجشمت من اتيان قوم * هم الاعداء والا كبادسود
  وقواهم فلان تضرب اليه أكباد الابل أى يرحل اليه فى طاب العلم وغيره ⁦( كند)⁩ الكند
  والكتدمابين الكاهل الى الظاهر والكتدغيم ( كدد السكدّ الشدّة فى العمل وطلب
  الكسب وكددت التي أنعبته والكد الاشارة بالأصبع كمابشير السائل قال الكميت
  غنيت فلم أردد كم عنديغية * وحجت فلم أكددكم بالاصابع
  والكدمايدق فيه الأشياء كالهاون والكديد الارض المكدودة بالحوافر قال
  امر ؤالقبس أنرن غبارا بالكديد المركل • ويتركدوداذا لم يثل ماؤها الابجهد
  والكدادة بالضم القشدة ومايبق فى أسفل القسدرمن المرقايضا والمكد كدة حكاية صوت
  شى يضرب على شصاب والكد كدة العدو البطىء وحكى الاصءعى قوم! كبداد أى سراع
  قال والمكداد بالضم اسم فل تنسب اليه الاريقال بنات كداد وأنشد
  وعيرلها من بئات الكداد * يدهميج بالوطب والمزود
  (كرد الكرد العنق فارسى معرّب وقال الشاعر الفرزدق
  وكااذا القيسى نب عنوده ضر بنا بين الاننيين على الكرد
  والكرد الطرد يقال فلان بكرد القوم كانه دفعه-م ويطردهم والمكاردة المطاردة
  والرد
