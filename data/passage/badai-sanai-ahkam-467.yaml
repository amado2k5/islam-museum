text: "… لما كانت العزيمة هي الأربع، وإنما أبيح القصر رخصة - فإذا اقتدى بالمقيم فقد اختار العزيمة، فتأكد عليه وجوب الأربع، فلا تجوز له الرخصة بعد ذلك ويستوي في المقدار المفروض على المسافر من الصلاة سفر الطاعة، من الحج والجهاد وطلب …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 467، يرد فيه ذكر الفرض، والوجوب، والمباح، والرخصة، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 467, whose wording mentions the obligatory (fard), obligation (wujub), the permitted (mubah), the concession (rukhsa), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 467 کا اقتباس جس میں فرض، وجوب، مباح، رخصت، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
