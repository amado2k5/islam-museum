label: { ar: "سنن ابن ماجه 2059 — الأب والأبوة", en: "Sunan Ibn Majah 2059 — the father and fatherhood", ur: "سنن ابن ماجہ 2059 — باپ اور والدیت", es: "Sunan Ibn Majah 2059 — El padre y la paternidad" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ أَبِي الرِّجَالِ، عَنْ أَبِيهِ، عَنْ عَمْرَةَ، عَنْ عَائِشَةَ، قَالَتْ أَقْسَمَ رَسُولُ اللَّهِ ـ أَنْ لاَ يَدْخُلَ عَلَى نِسَائِهِ شَهْرًا فَمَكَثَ تِسْعَةً وَعِشْرِينَ يَوْمًا حَتَّى إِذَا كَانَ مَسَاءَ ثَلاَثِينَ دَخَلَ عَلَىَّ فَقُلْتُ إِنَّكَ أَقْسَمْتَ أَنْ لاَ تَدْخُلَ عَلَيْنَا شَهْرًا. فَقَالَ \" شَهْرٌ هَكَذَا \". يُرْسِلُ أَصَابِعَهُ فِيهَا ثَلاَثَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2059، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2059 (The Chapters on Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2059، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2059 (Los capítulos sobre el divorcio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
