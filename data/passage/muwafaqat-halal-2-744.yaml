text: "… دخل بها فلها المهرُ بما استَحَلَّ منها وهكذا سائر ما جاء في النكاح الفاسد من السنّة. والسابع: أن اللّٰه أحلَّ صيد البحر فيما أحل من الطيبات، وحرّم الميتة فيما حرم من الخبائث، فدارت ميتة البحر بين الطرفين، فأشكل حكمها، فقال …"
summary:
