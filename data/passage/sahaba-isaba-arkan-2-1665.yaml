text: "… ذلك أقول : سفيان الهذلي عن أبيه أن أبا ذؤيب جاء إلى عمر في تَبِعْتُ رَسُولَ اللّهِ إِذْجَاءَ بِالهُدَى خلافته فقال يا أمير المؤمنين؛ أي العمل أفضل؟ قال: وَخَلَّفْتُ قَرَّاطاً بِدَارِ هَوَانٍ الإيمان بالله. قال: قد فعلت. فأي العمل بعده …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1665، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 1665, that mentions faith as the best of deeds, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 1665 کا اقتباس جس میں ایمان بہترین عمل، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
