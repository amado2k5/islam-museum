summary:
  ar: "يقول مالك فالأمر عندنا أنه إذا اشترط الرجل للمرأة، وإن كان ذلك عند عقدة النكاح، أن لا أنكح عليك، ولا أتسرر، إن ذلك ليس بشيء، إلا أن يكون في ذلك يمين بطلاق أو عتاقة، فيجب ذلك عليه ويلزمه. {cite:muwatta-maruf-1997 p.36}"
