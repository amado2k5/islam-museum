label: { ar: "الموطأ 1515 — مالك: إذا اشترط الرجل للمرأة في عقدة النكاح أن لا ينكح عليها ولا يتسرى، فليس ذلك بشيء إلا أن يكون فيه يمين بطلاق أو عتاقة فيلزمه", en: "Muwatta 1515", es: "Muwatta 1515", fr: "Muwatta 1515", ur: "موطا 1515", tr: "El-Muvatta 1515 — Malik: Bir erkek, evlilik sözleşmesinde bir kadına başka bir kadınla evlenmeyeceğine veya cariye edinmeyeceğine dair şart koşarsa, bu, boşanma veya azat etme yemini içermediği sürece geçerli değildir; eğer içeriyorsa, buna bağlıdır.", id: "Al-Muwatta 1515 — Malik: Jika seorang pria mensyaratkan kepada seorang wanita dalam akad nikah bahwa ia tidak akan menikahi wanita lain atau mengambil selir, maka hal ini tidak sah kecuali jika termasuk sumpah cerai atau pembebasan, dalam hal ini ia terikat olehnya." }
summary:
  ar: "يقول مالك فالأمر عندنا أنه إذا اشترط الرجل للمرأة، وإن كان ذلك عند عقدة النكاح، أن لا أنكح عليك، ولا أتسرر، إن ذلك ليس بشيء، إلا أن يكون في ذلك يمين بطلاق أو عتاقة، فيجب ذلك عليه ويلزمه. {cite:muwatta-maruf-1997 p.36}"
  tr: "Malik şöyle diyor: Bizim görüşümüze göre, bir erkek evlilik sözleşmesi sırasında bile bir kadına başka bir kadınla evlenmeyeceğine veya cariye edinmeyeceğine dair söz verirse, bu, boşanma veya azat yemini olmadığı sürece geçerli değildir; boşanma veya azat yemini ise bağlayıcı hale gelir. {cite:muwatta-maruf-1997 s.36}"
  id: "Malik berkata: Menurut pandangan kami, jika seorang pria menyepakati kepada seorang wanita, bahkan pada saat akad nikah, bahwa ia tidak akan menikahi wanita lain atau mengambil selir, hal ini tidak sah kecuali jika itu adalah sumpah cerai atau pembebasan, dalam hal ini menjadi mengikat baginya. {cite:muwatta-maruf-1997 p.36}"
