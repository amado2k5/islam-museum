ref: "2015"
label: { ar: "سنن ابن ماجه 2015 — الحلال، الحرام", en: "Sunan Ibn Majah 2015 — the lawful; the unlawful", ur: "سنن ابن ماجہ 2015 — حلال، حرام", es: "Sunan Ibn Majah 2015 – lo lícito; lo ilegal", fr: "Sunan Ibn Majah 2015 — le licite; l'illégal" }
text: "حَدَّثَنَا يَحْيَى بْنُ مُعَلَّى بْنِ مَنْصُورٍ، حَدَّثَنَا إِسْحَاقُ بْنُ مُحَمَّدٍ الْفَرْوِيُّ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عُمَرَ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، عَنِ النَّبِيِّ ـ قَالَ \" لاَ يُحَرِّمُ الْحَرَامُ الْحَلاَلَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2015، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2015 (The Chapters on Marriage), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2015، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2015 (Los capítulos sobre el matrimonio), menciona lo lícito y lo ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 2015 (Les chapitres sur le mariage), mentionne ce qui est licite et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
