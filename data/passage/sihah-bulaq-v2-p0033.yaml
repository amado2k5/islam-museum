  *⁦(فصل الواووالياء)⁩*
  • ن دا),
  وتبسم رسول اللّٰه صلى اللّه عليه وسلم فقال يارسول اللّٰه قد رزق اللّه خيرا وأعوذبالله من الحور
  بعد الكور وهجارجل بى تيم اللّه فقال
  اناس ربة الحيين منهم • فعدّوها اذاعدّا لصميم
  الاموىّ أهل المهاة القوم البعداء الذين ايسوا بأقارب والمنياة طريق السانية والناحية
  واحدة النواحى وقول الشاءر
  لقد صبرت حنيفة صبرقوم * كرام تحت أظلال النواحى
  فاغمايريدنواح السيوف وقال المكسائى أراد النوائح فقلب بعنى الرايات المتقابلات
  ويقال الجبلان يتناوحان اذا كانا متقابلين ( خا لنخوة الكبر والعظمة يقال اتخى
  فلان علينا أى افتخر وتعظم ا النداء الصوت وقديضم مثل الدعاء والرغاءوناداه
  مغاداة ونداء أى صاح به وتنادوا أى نادى بعضهم بعضا وتنادوا أى تجالسوا فى النادى
  قال المرقش
  والعد وبين المجلسين اذا » آد العشىّ وتنادى العتم
  وناداه جالسه فى النادى وقال • أنادى به آل الوليد وجعرا* والندى على فعيل مجلس
  القوم ومتصدّنهم وكذلك الندوة والنادى والمنتدى فان تفرق القوم فليس بندىّ ومنسه
  سميت دار الندوة بمكة التى بناها قصى لانهم كانوا يندون فيها أى يجتمعون للمشاورة وقوله
  تعالى فليدع ناديه أى عشيرته وانماهم أهل النادى وال:ادى مكانه ومجلسه فسماه به كما يقال
  تقوّض المجلس وندوت أى-ضرت الندى وانتديت مثله وندوت القوم بجعتهم فى الندى
  قال بشر
  وما يندوهم الغادى ولسكن * بكل محلة منهم فئام
  أى مايسعهم المجاس من كنرته-م وندوت أيضا من الجود ويقال سنّ للناس الندى ف_دوا
  ويقال أيضافلان ندىّ الكف اذا كانتخيا عن ابن السكيت وندت الابل اذارعت فيما
  بين النهل والعلل تندوندوافهى فادية وتندّت مثله وأنديتها أنا ونديتها تندية والموضع مندى
  وقال علقمة مي عبدة
  ترادى على دمن الحياض فان تعف • فانّ المندّى رحلة فركوب
  قال الاصمعىّ واختصم حيان من العرب فى موضع فقال أحدهمامي كزرماحمًا ومخرج
  نسائنا ومسرح بهمنا و مندّى خيلنا ويقال هذه الناقة تندوالى نوق كرام أى تنزع فى النسب
  والندوة بالضم موضع شرب الابل وقال * قريبة ندوته من محمضه * يقول موضع شر به
  قريب لا يتعب فى طلب الماء والمنديات المخزيات يقال مانديت بشئ تكرهه قال النابغة
  ما ان نديت بشئ أنت تكرهه» والقدى الغاية مثل المدى والندى أيضا بعد ذهاب الصوت
  يقال فلان أندى صوتامن فلان اذا كان بعبد الصوت وأنشد الاصعمى
  فقلت آدعى وأدع فاتّ أندى • لصوت أن ينادى داعيات
  والندى الجود ورجل ندأى جوادوفلان أندى من فلان اذا كان أكنرخيرامنه وفلان
  يتندّى على أصهابه أى يتسخى ولا تقسل يشدى على أصحابه والندى الشهم والندى المطر
  والبلل وقال كثور العداب الفرديضربه الندى تعلى الندى فى متنه وتحدّرا
  فالندى الأول المطر والثانى الشحم وجع الندى أنداء وقد جع على أندية وقال
