text: |-
  فرح
  ١٨٩
  وبحرأفيح بين الفيح أى واسع وفياح أيضا بالتسديد قال الاصعمى انه لمواد فياح وفيباض
  ععنى وفاحت الغارة مفيح اتسعت وفياح مثل قصام اسم للغارة وكان أهل الجاهلية
  يقرلون فيحى فَاح أى اتسعى وقال
  دذعنا انخيل سائلة عليهم * وقلنا بالخجى فيحى فياح
  ودارفيحاه أى واسعة والفيحا. أيضاحساء مع توابل
  حصل القاف (قح انتيح نقيض الحسن وقدقبع قباحة فهو قبيح وقبحه اللّه أى
  نحاء عن الخيرة،ومن المقبوحين يقال قبحاله وقها أيضا ١ وأقيح فلان أتى يقميح
  والاستقباح ضدّ الاستحسان وقح عليه فعله تقبيها والقبيح طرف عظم المرفق قال الشاهر
  ق اسى التح انفاس فا لذم والو يت الرجل تح البافرة ا ناس في
  وأعراب أتحاح وعربقح أى محض خالص وعربية قمة وعبد قح أى خالص بين القحاحة
  والقموحة والقحقح بالضم العظم المعيف بالدبروهو فوق القب شبئا ⁦( دح)⁩. القدح
  بالكسر السهم قبل أن يراش ويركب نصله وقدح الميسر أيضا والجمع قداح وأقداح
  وأقادمح قال أبوذو يب يصف ابلا
  أتماولات الذرى منها فعاصبة • تجول بين .ناقيها الاقاديح
  فعاصبة أى مجتمعة والذرى الاسمة والقدح واحد الاقداح التى للشرب والمقدح المغرفة
  وقال لنا مقدح منها والجار مقدح والمقدجة ما تقدح به النار والقداحة والقداح
  الحجر الذى يورى الشاروقدحت المرق غرفته والقدحة بالضم الغرفة بقال أعطى قدسة
  من مرقتك وقد حت النار وقد حت فى نسبه اذاطعنت وقدح الدود فى الاسنان والشجر
  قدجاوه ونأكل بقع فيه والقادحة الدودة والقادح الصدع فى العود والسواد الذى
  يظهر فى الاسنان قال جيل
  رمى اللّٰه فى عيف بثينة بالقذى • وفى الغرّ من أنيابها بالقوادح
  وقدحت العين اذا أخرحت منها الماه الفاسد والقديخ مايبقى فى أسفل القدر
  فيغرف بجهد وقال الشاءر
  فظل الاماء يبتدرن قديحها • كما انتدرت كاب مماه قراقر
  وركى" قدوح تغرف باليد وقدحت عينه وقدحت أيضا مخففة أذا تمارت وقدح فرسه تقديحا
  نمره واقتدحت الزند واقتدحت المرق غرفته (قرح القرجة واحدة القرح والقروح
  وقيسل لاهرئ القيس ذوا لقروح لان. لك الروم بعث اليه قبصامسموما فتقرّح منه جسده
  فات والقرح والقرح لغتان مثل الضعف والضعف عن الاخفش ( ٢ قرح قرحاجرحه
  فهو قريح وقوم قرحى قال الهذلى
  لا يسلون قريحاحل وسطهم * يوم اللقاء ولا يشوون من قرحوا
  وقرح جلده بالكسر يقرح قرحافهو قرح اذا خرجت به القروح وأقرجه اللّه والقرحنة
  فى وجه الفرس مادون الغرة والفرس أقرح وروضة قرحاء فيها نوارة بيضاء قال ابن الاعرابى
  مهداح
