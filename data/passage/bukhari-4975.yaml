label:
  ar: "البخاري 4975 — كذبني ابن آدم وشتمني"
  en: "Bukhari 4975 — The son of Adam denied Me and reviled Me"
  ur: "بخاری 4975 — ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا"
  es: "Bujari 4975 — El hijo de Adán me negó y me insultó."
  fr: "Bukhari 4975 — Le fils d'Adam m'a renié et m'a injurié"
  tr: "Buhari 4975 — Âdem oğlu bana yalan söyledi ve bana hakaret etti."
  id: "Al-Bukhari 4975 — Anak Adam telah berbohong kepadaku dan menghinaku"
text: "قال الله كذبني ابن آدم ولم يكن له ذلك، وشتمني ولم يكن له ذلك، أما تكذيبه إياى أن يقول إني لن أعيده كما بدأته، وأما شتمه إياى أن يقول اتخذ الله ولدا، وأنا الصمد الذي لم ألد ولم أولد ولم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4975: كذبني ابن آدم وشتمني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4975: The son of Adam denied Me and reviled Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4975: ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 4975: El hijo de Adán me negó y me insultó. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 4975: « Le fils d’Adam M’a renié et M’a injurié. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble les narrations de ce hadith dans les six livres et la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 4975: “Anak Adam telah berbohong tentangku dan menghinaku.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
