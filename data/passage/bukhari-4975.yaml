label:
  ar: "البخاري 4975 — كذبني ابن آدم وشتمني"
  en: "Bukhari 4975 — The son of Adam denied Me and reviled Me"
  ur: "بخاری 4975 — ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا"
text: "قال الله كذبني ابن آدم ولم يكن له ذلك، وشتمني ولم يكن له ذلك، أما تكذيبه إياى أن يقول إني لن أعيده كما بدأته، وأما شتمه إياى أن يقول اتخذ الله ولدا، وأنا الصمد الذي لم ألد ولم أولد ولم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4975: كذبني ابن آدم وشتمني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4975: The son of Adam denied Me and reviled Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4975: ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
