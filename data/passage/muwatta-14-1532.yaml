label: { ar: "الموطأ 1532 — ابن شهاب عن سعيد بن المسيب وسليمان بن يسار: طليحة الأسدية نكحت في عدتها، فضربها عمر وفرق بينهما، وقضى بأن تكمل عدتها من الأول", en: "Muwatta 1532", es: "Muwatta 1532", fr: "Muwatta 1532", ur: "موطا 1532", tr: "El-Muvatta 1532 — İbn Şihab, Said bin el-Musayyab ve Süleyman bin Yasar'dan rivayetle: Tuleyha el-Asadiyya, bekleme süresi içinde evlendi, bunun üzerine Ömer onu cezalandırdı ve onları ayırdı ve bekleme süresini ilk evliliğinden itibaren tamamlaması gerektiğine hükmetti.", id: "Al-Muwatta 1532 — Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab dan Sulayman bin Yasar: Tulayha Al-Asadiyya menikah selama masa iddahnya, maka Umar menghukumnya dan memisahkan mereka, serta menetapkan bahwa ia harus menyelesaikan masa iddahnya dari pernikahan pertama." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب وسليمان بن يسار أن طليحة الأسدية كانت تحت رشيد الثقفي فطلقها، فنكحت في عدتها، فضربها عمر بن الخطاب، وضرب زوجها بالمخفقة ضربات، وفرق بينهما. ثم قال عمر أيما امرأة نكحت في عدتها، فإن كان زوجها الذي تزوجها لم يدخل بها فرق بينهما، ثم اعتدت بقية عدتها من زوجها الأول، ثم كان الآخر خاطبا من الخطاب. وإن كان دخل بها فرق بينهما، ثم اعتدت بقية عدتها من الأول، ثم اعتدت من الآخر، ثم لا يجتمعان أبدا. ويقول سعيد بن المسيب ولها مهرها بما استحل منها. {cite:muwatta-maruf-1997 p.42}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab ve Süleyman ibn Yasar'dan rivayet ettiğine göre, Tulayha el-Asadiyya, Raşid el-Saqafi ile evliydi ve o da onu boşadı. Bunun üzerine iddet süresi içinde evlendi. Ömer ibn el-Hattab, onu ve kocasını kırbaçla dövdürdü ve onları ayırdı. Sonra Ömer şöyle dedi: \"İddet süresi içinde evlenen her kadın, yeni kocası evliliği tamamlamamışsa, ayrılırlar. Daha sonra ilk kocasından iddet süresini tamamlar ve ikinci kocası ona evlenme teklif edebilir. Eğer evliliği tamamlamışsa, ayrılırlar. Daha sonra ilk kocasından iddet süresini tamamlar, sonra da ikinci kocasından iddet süresini tamamlar ve bir daha asla birlikte olamazlar.\" Sa'id ibn el-Musayyab şöyle der: \"Ondan aldığı şey için mehirini almaya hakkı vardır.\" {cite:muwatta-maruf-1997 s.42}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab dan Sulayman ibn Yasar, bahwa Tulayha al-Asadiyya menikah dengan Rashid al-Thaqafi, yang kemudian menceraikannya. Ia kemudian menikah lagi selama masa iddahnya. Umar ibn al-Khattab mencambuknya dan suaminya, dan mereka dipisahkan. Kemudian Umar berkata: \"Wanita mana pun yang menikah selama masa iddahnya, jika suami barunya belum melakukan hubungan suami istri, mereka harus dipisahkan. Ia kemudian menyelesaikan masa iddahnya dari suami pertamanya, dan kemudian suami kedua boleh melamarnya. Jika suami kedua telah melakukan hubungan suami istri, mereka harus dipisahkan. Ia kemudian menyelesaikan masa iddahnya dari suami pertamanya, dan kemudian dari suami kedua, dan mereka tidak boleh bersama lagi.\" Sa'id ibn al-Musayyab berkata: \"Ia berhak atas maharnya atas apa yang telah diambil suaminya darinya.\" {mengutip:muwatta-maruf-1997 hal.42}"
