label: { ar: "الموطأ 1532 — ابن شهاب عن سعيد بن المسيب وسليمان بن يسار: طليحة الأسدية نكحت في عدتها، فضربها عمر وفرق بينهما، وقضى بأن تكمل عدتها من الأول", en: "Muwatta 1532" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب وسليمان بن يسار أن طليحة الأسدية كانت تحت رشيد الثقفي فطلقها، فنكحت في عدتها، فضربها عمر بن الخطاب، وضرب زوجها بالمخفقة ضربات، وفرق بينهما. ثم قال عمر أيما امرأة نكحت في عدتها، فإن كان زوجها الذي تزوجها لم يدخل بها فرق بينهما، ثم اعتدت بقية عدتها من زوجها الأول، ثم كان الآخر خاطبا من الخطاب. وإن كان دخل بها فرق بينهما، ثم اعتدت بقية عدتها من الأول، ثم اعتدت من الآخر، ثم لا يجتمعان أبدا. ويقول سعيد بن المسيب ولها مهرها بما استحل منها. {cite:muwatta-maruf-1997 p.42}"
