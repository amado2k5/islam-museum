label: { ar: "صحيح البخاري 5596 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 5596 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 5596 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا الشَّيْبَانِيُّ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ أَبِي أَوْفَىما ـ قَالَ نَهَى النَّبِيُّ عَنِ الْجَرِّ الأَخْضَرِ. قُلْتُ أَنَشْرَبُ فِي الأَبْيَضِ قَالَ لاَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5596، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5596 (Drinks), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 5596، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
