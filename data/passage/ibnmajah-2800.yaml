label:
  ar: "ابن ماجه 2800 — كلم الله أبا جابر كفاحا: تمن علي أعطك"
  en: "Ibn Majah 2800 — God spoke to Jabir's father face to face: wish, and I shall give"
  ur: "ابن ماجہ 2800 — اللہ نے جابر کے والد سے روبرو کلام کیا: تمنا کرو، میں دوں گا"
  es: "Ibn Majah 2800 — Dios habló cara a cara con el padre de Jabir: «Pide, y te lo concederé»."
  fr: "Ibn Majah 2800 — Dieu parla face à face au père de Jabir: « Souhaite, et j’exaucerai ton souhait. »"
  tr: "İbn Majah 2800 — Allah, Ebu Cabir'e doğrudan şöyle seslendi: Benden iste, sana vereceğim."
  id: "Ibn Majah 2800 — Allah berbicara langsung kepada Abu Jabir: Mintalah kepada-Ku dan Aku akan memberikannya kepadamu"
text: "يا جابر ألا أخبرك ما قال الله عز وجل لأبيك . قلت بلى . قال ما كلم الله أحدا إلا من وراء حجاب وكلم أباك كفاحا . فقال يا عبدي تمن على أعطك . قال يا رب تحييني فأقتل فيك …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 2800: كلم الله أبا جابر كفاحا: تمن علي أعطك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 2800: God spoke to Jabir's father face to face: wish, and I shall give. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 2800: اللہ نے جابر کے والد سے روبرو کلام کیا: تمنا کرو، میں دوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 2800: Dios habló cara a cara con el padre de Jabir: «Pide lo que quieras, y te lo concederé». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi recopila sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 2800: Dieu s’adressa au père de Jabir face à face: « Souhaite, et Je t’exaucerai. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 2800: Allah berfirman langsung kepada Abu Jabir: “Mintalah sesuatu kepada-Ku, maka Aku akan memberikannya kepadamu.” Nabi (shalawat dan salam kepadanya) meriwayatkan hadits ini dari Tuhannya, dan para penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
