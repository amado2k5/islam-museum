label: { ar: "الموطأ 1397 — مالك: أحسن ما سمع في البدنة والبقرة والشاة الواحدة أن الرجل ينحر عنه وعن أهل بيته، ويكره أن يشترك النفر في شرائها للضحايا", en: "Muwatta 1397", es: "Muwatta 1397", fr: "Muwatta 1397", ur: "موطا 1397", tr: "El-Muvatta 1397 — Malik: Deve, sığır veya koyun hakkında duyduğum en iyi görüş, bir erkeğin onu kendisi ve ailesi adına kesmesi gerektiğidir; bir grup insanın onu kurban etmek için ortaklaşa satın alması ise mekruhtur.", id: "Al-Muwatta 1397 — Malik: Pendapat terbaik yang pernah saya dengar mengenai unta, sapi, atau domba adalah bahwa seseorang boleh menyembelihnya untuk dirinya sendiri dan keluarganya, dan tidak disukai jika sekelompok orang patungan untuk membelinya sebagai kurban." }
summary:
  ar: "يقول مالك أحسن ما سمعه في البدنة والبقرة والشاة الواحدة، أن الرجل ينحر عنه وعن أهل بيته البدنة، ويذبح البقرة والشاة الواحدة وهو يملكها، ويذبحها عنهم ويشركهم فيها. فأما أن يشتري النفر البدنة أو البقرة أو الشاة يشتركون فيها في النسك والضحايا، فيخرج كل إنسان حصته من ثمنها، وتكون له حصته من لحمها، فإن ذلك يكره. {cite:muwatta-maruf-1997 p.625}"
  tr: "Malik, tek bir deve, inek veya koyunla ilgili duyduğu en iyi görüşün, bir kişinin kendisi ve ailesi adına bir deve kesebileceği ve sahip olduğu tek bir inek veya koyunu da kurban edebileceği ve onları da kurbana dahil edebileceği yönünde olduğunu söyledi. Ancak, bir grup insan kurbana katılmak üzere bir deve, inek veya koyun satın alırsa, her kişi fiyatın kendi payını öder ve etten kendi payını alırsa, bu hoş karşılanmaz. {cite:muwatta-maruf-1997 s.625}"
  id: "Malik mengatakan bahwa pendapat terbaik yang pernah ia dengar mengenai seekor unta, sapi, atau domba adalah bahwa seseorang boleh menyembelih seekor unta untuk dirinya dan keluarganya, dan ia boleh menyembelih seekor sapi atau domba miliknya, dan ia boleh menyembelihnya untuk mereka dan memasukkannya ke dalam kurban. Namun, jika sekelompok orang membeli seekor unta, sapi, atau domba untuk dibagi dalam kurban, dengan setiap orang membayar bagian harga dan menerima bagian dagingnya masing-masing, maka hal ini tidak disukai. {cite:muwatta-maruf-1997 p.625}"
