label: { ar: "الموطأ 1397 — مالك: أحسن ما سمع في البدنة والبقرة والشاة الواحدة أن الرجل ينحر عنه وعن أهل بيته، ويكره أن يشترك النفر في شرائها للضحايا", en: "Muwatta 1397" }
summary:
  ar: "يقول مالك أحسن ما سمعه في البدنة والبقرة والشاة الواحدة، أن الرجل ينحر عنه وعن أهل بيته البدنة، ويذبح البقرة والشاة الواحدة وهو يملكها، ويذبحها عنهم ويشركهم فيها. فأما أن يشتري النفر البدنة أو البقرة أو الشاة يشتركون فيها في النسك والضحايا، فيخرج كل إنسان حصته من ثمنها، وتكون له حصته من لحمها، فإن ذلك يكره. {cite:muwatta-maruf-1997 p.625}"
