text: |-
  ٣٧٦
  الغرور السيطان ومنه قوله تعالى ولا يغرّنكم باللّه الغرور والغرور أيضا ما يتغرغربه من
  الادوية وهو مثل قواهم لدود ولعوق وسعوط قال والغروو بااضم ما اغترّبه من متارع الدنيا
  والغوار بالكسر النوم القليل وليث فلان غرارشهرأى مكث مقدارشهو والغرار نقصان
  لبن النساقة وفى الحديث لاغراوفى صلاة وه وأن لا يتم ركومها ومجودهما والغراران شفرتا
  السيف وكل شي له حد خده غراره والجمع أغرّة واتانا على غرار أى على عملة قال الاصمعى
  الغرار الطريقة أيقال رميت ثلاثة أسهم على غرارواحد أى على مجرى واحدوولدت فلانة
  ثلاثة بنين على غوارأى بعضهم خلق بعض وبنى القوم بيوتهم على غرار واحد والغرار المثال
  الذى تطبع عليه نصال السهام بقال ضرب تصاله على غرارواحد قال الهذلى
  سديد العيرلم يدحض عليه السغرارفقدحه زعل دروج
  قوله سديد بالين أى مستقيم ويقال ليت اليوم غرارشهر أى مثال شهر أى طول شهر
  والغرارة وا-دة الغرائرالتى للتين وأظنه معربا وغره يغره غروراخدعه يقال ماغر ك بفلان
  أى كيف اجترأت عليه ومن غوّك من فلان أى من أوظال عشوة فيه وغرّالطائر أيضافرخه
  يغره غرارا أى زقه والتغريرحل النفس على الغرر وقد غرّر بنفسه تغريرا وتفرّة كما يقسال
  حلل تحليلا وتحلة وعلل تعليلا وتعلة ويقال أيضاغررت ثنيتا الغلام أى طلعت أوّل ما تطلع
  الاصححى يقال فارّت الناقة تغار غراراقلّ ابنها قال ومنه غرار النوم وهو قلته حسكا.
  عنه أبو عبيد وقال ابن السكيت غارت النساقة أى تفوت فرفعت الدرّة وفى المثل سبق درّته
  غراره بقال ناقسة مغارة بالضم ونوق مغاريا هذا يفتح الميم غير صروف أبوزيدغارت
  السوق تغار غراراكسدت ودرّت درنفقت والغرغرة تردّد الروح فى الحلق ويقال
  الراعى يغرغر بصوته أى يردده فى حلقه ويتغرغرصونه فى حاقه أى يتردّد والغرغر بالكسم
  الدجاج البرّى الواحسدة غرغرة وأنشد أبوحمر ولا بن أحر
  ألفهم بالسيف من كل جائب • كمالفت العقبان جلى وغرغر
  والغرغرة بالضم غرّة الفرس ورجل غرغرة أيضاشر يف عن اللحبانى وقول الشاعر
  رشيف الغريريات ما الوقائع نوق منسوبات الى مل وفال السكميت
  غربرية الانساب أوشدقية * يصلن الى البيد الفدافد فدفدا
  ⁦( غؤر)⁩ الغزارة الكثرة وقد غزر الشيء بالضم يغزرفه وغُزير وغزرت النسافة أيضاكثر
  لبنهاغزارة فهى غزيرونوق غزار والاسم الغزر مشال الضرب وابهع غزر مثل جون وجون
  وأذن حشروآذان حشر وأغزر القوم غزرت ابلهم والتغزير أن تدع حلبة بين حلبتين
  وذلك اذا أدبر لين النساقة ( شهر الغشهرة اتيان الامر من غير تثبت وغش رالسيل أقبل
  وتغشهره أى أخذه قهراورأيته متغشمرا أى غضبان ( ضر الغضار الطين الحرّ
  والغضارة طيب العيس ققول منه بنوفلان مغضورو وقد غضرهم اللّه وانهسم انى غضارة
  من العيش وفى غضراء من العيش أى فى خصب وخير قال الاصعى لا يتال أباد اللّه خضراءهم
  ولكن أباد اللّه غضرامهم أى أهلل خيرهم وغضارتهم والغضراء طينة خضرا عدكة
  يقال أنيط فلان بثره فى غضراء وعضر عنه يغضر أى عدل عنه قال ابن أحريصف الجوارى
  يوعدن
