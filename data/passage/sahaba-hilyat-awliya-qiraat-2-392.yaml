text: "… بينها وبين زوجها الإسلام - قناطها يوم حنين وقيامها مع عائشة بخدمة عسكر المسلمين. أم حرام بنت ملحان. خبر غزوها البحر وموتها بقيرس. أم ورقة الأنصارية وأنها إحدى من جمع القرآن وأنها كانت توم أهل دارها أم سليط الأنصارية. وأنها …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 392، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 392, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 392 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 2, pág. 392, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
