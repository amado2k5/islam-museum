label: { ar: "سنن النسائي 2850 — الحجامة", en: "Sunan al-Nasa'i 2850 — cupping", ur: "سنن نسائی 2850 — حجامہ" }
text: "أَخْبَرَنِي هِلاَلُ بْنُ بِشْرٍ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ خَالِدٍ، - وَهُوَ ابْنُ عَثْمَةَ - قَالَ حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، قَالَ قَالَ عَلْقَمَةُ بْنُ أَبِي عَلْقَمَةَ أَنَّهُ سَمِعَ الأَعْرَجَ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ ابْنَ بُحَيْنَةَ، يُحَدِّثُ أَنَّ رَسُولَ اللَّهِ احْتَجَمَ وَسَطَ رَأْسِهِ وَهُوَ مُحْرِمٌ بِلَحْىِ جَمَلٍ مِنْ طَرِيقِ مَكَّةَ."
summary:
  ar: "حديث في سنن النسائي، رقم 2850، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 2850 (The Book of Hajj), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 2850، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
