text: "… خَيْبَر أَهلك اللّٰه خَيْبَر كما أَهلك بنى قَيْنُقاع والنَّضِير وقُرَيْظَة. قال : فلما تجهَّزنا لم يبقَ أَحدٌ من يهود المدينة له على أَحدٍ من المسلمين حَقُّ إلَّا لَزِمَه، وكان لأَبى الشَّحْم اليهوديّ عند عبد اللّٰه بن أَبى حدّرَد الأُسلمىّ خمسةُ …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 634، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
