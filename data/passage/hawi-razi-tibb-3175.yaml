  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3175, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
