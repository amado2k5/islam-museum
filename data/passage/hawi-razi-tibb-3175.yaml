text: "… الأخلاط المرارية والأخلاط المالحة، لأن الطعم العفص متى خلط بالمر فشأنه أن يفعل هذه الأفعال. ولذلك صار هذا الدواء نافعاً لأصحاب اليرقان ولمن به وجع الكلى والطحال، وهو مع هذا مبرد؛ ولذلك متى خلط بالضماد مع دقيق الشعير نفع من …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3175، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
