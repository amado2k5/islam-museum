label: { ar: "الموطأ 11 — أنس: يذهب الذاهب إلى قباء والشمس مرتفعة", en: "Muwatta 11", es: "Muwatta 11", fr: "Muwatta 11", ur: "موطا 11", tr: "Al-Muwatta 11 — Enes: Kuba'ya giden, güneş tepede iken gidecektir.", id: "Al-Muwatta 11 — Anas: Orang yang pergi ke Quba’ akan pergi saat matahari masih tinggi." }
text: "كنا نصلي العصر ثم يذهب الذاهب إلى قباء فيأتيهم والشمس مرتفعة"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أنس بن مالك، في باب وقوت الصلاة: كانوا يصلون العصر ثم يذهب الذاهب إلى قباء فيبلغها والشمس ما تزال مرتفعة. ويخرّجه المحقق عند البخاري (551) ومسلم والنسائي، وينقل عن ابن عبد البر أنه موقوف اللفظ في الموطأ لكنه «مرفوع عند أهل العلم بالحديث» لرواية الحفاظ له عن الزهري بذكر رسول الله. وفي لفظة «إلى قباء» خلاف نقله المحقق: نص النسائي والبزار والدارقطني على أن مالكاً وهم فيها وأن الصواب «إلى العوالي»، وجزم ابن عبد البر بالوهم ⁦(التمهيد 6/178)⁩، وتعقبه ابن حجر في فتح الباري (2/37) بأن ابن أبي ذئب رواها عن الزهري كرواية مالك، ويرجح المحقق أن الوهم من مالك، ويذكر رأي ابن رشيد أن رواية العوالي مجملة ورواية قباء مفسرة، وأن ذلك كله لا يقدح في صحة الحديث. {cite:muwatta-maruf-1997 p.39} {cite:muwatta-maruf-1997 p.40}"
  en: "Anas ibn Malik: they used to pray the afternoon prayer, then a man could set out for al-Awali while the sun was still high; the transmitters differ over mentioning the Prophet in it."
  es: "Anas ibn Malik: solían rezar la oración de la tarde, y entonces un hombre podía partir hacia al-Awali mientras el sol aún estaba alto; los transmisores difieren en cuanto a si mencionan al Profeta en ella."
  fr: "Anas ibn Malik: ils avaient coutume de faire la prière de l'après-midi, puis un homme pouvait partir pour al-Awali alors que le soleil était encore haut; les transmetteurs divergent quant à la mention du Prophète dans cette prière."
  ur: "انس بن مالک: وہ عصر کی نماز پڑھتے تھے، پھر آدمی عوالی کے لیے نکل سکتا تھا جب کہ سورج ابھی بلند تھا۔ اس میں نبی کا ذکر کرنے پر ٹرانسمیٹرز کا اختلاف ہے۔"
  tr: "Malik, namaz vakitleri bölümünde İbn Şihab'dan, o da Enes ibn Malik'ten rivayet ederek şöyle anlatmıştır: Öğle namazını kılarlar, sonra biri Kuba'ya gider ve güneş henüz tepede iken oraya varırdı. Editör, bunu Buhari (551), Müslim ve Nesai'nin derlemelerine dahil etmiş ve İbn Abdülberr'in, el-Muvatta'daki ifadenin mevkuf (bir Sahabeye atfedilen) olduğunu, ancak hadis âlimleri tarafından \"merfu\" (Peygambere atfedilen) olarak kabul edildiğini söylediğini aktarmıştır; çünkü hadis üstatları bunu Peygamberden bahseden el-Zuhri'den rivayet etmişlerdir. Editörün belirttiği gibi, \"Kuba'ya\" ifadesi konusunda görüş ayrılığı vardır: el-Nesai, el-Bazzar ve el-Daraqutni, Malik'in bu konuda yanıldığını ve doğru ifadenin \"el-Awali'ye\" olduğunu belirtmişlerdir. İbn Abdül-Barr bunun bir hata olduğunu ileri sürmüştür (el-Tamhid 6/178) ve İbn Hacer, Feth el-Bari'de (2/37) buna karşı çıkarak, İbn Abi Dhi'b'in bunu Malik'in rivayetiyle aynı şekilde el-Zuhri'den rivayet ettiğini belirtmiştir. Editör, hatanın Malik'e ait olduğuna inanmakta ve İbn Raşid'in el-Awali hakkındaki rivayetin genel, Quba hakkındaki rivayetin ise özel olduğu ve bunların hiçbirinin hadisin sahihliğinden bir şey eksiltmediği görüşünü aktarmaktadır. {cite:muwatta-maruf-1997 s.39} {cite:muwatta-maruf-1997 s.40}"
  id: "Malik meriwayatkan hadits ini dari Ibn Shihab, yang juga dari Anas ibn Malik, dalam surah tentang waktu shalat: Mereka akan melaksanakan shalat Ashar, kemudian seseorang akan pergi ke Quba dan tiba di sana ketika matahari masih tinggi. Editor memasukkannya dalam kumpulan hadits al-Bukhari (551), Muslim, dan al-Nasa'i, dan mengutip Ibn Abd al-Barr yang mengatakan bahwa redaksi dalam al-Muwatta' adalah mawquf (disebutkan kepada seorang Sahabat), tetapi dianggap \"marfu'\" (disebutkan kepada Nabi) oleh para ulama hadits karena para ahli hadits meriwayatkannya dari al-Zuhri, dengan menyebutkan Nabi. Terdapat perbedaan pendapat mengenai redaksi \"ke Quba,\" yang dicatat oleh editor: al-Nasa'i, al-Bazzar, dan al-Daraqutni menyatakan bahwa Malik keliru dalam hal ini dan redaksi yang benar adalah \"ke al-'Awali.\" Ibn Abd al-Barr menyatakan bahwa itu adalah sebuah kesalahan (al-Tamhid 6/178), dan Ibn Hajar membantah hal ini dalam Fath al-Bari (2/37), dengan menyatakan bahwa Ibn Abi Dhi'b meriwayatkannya berdasarkan otoritas al-Zuhri dengan cara yang sama seperti riwayat Malik. Editor berpendapat bahwa kesalahan tersebut adalah milik Malik, dan menyebutkan pendapat Ibn Rashid bahwa riwayat tentang al-'Awali bersifat umum sedangkan riwayat tentang Quba bersifat khusus, dan bahwa semua ini tidak mengurangi keabsahan hadits tersebut. {cite:muwatta-maruf-1997 p.39} {cite:muwatta-maruf-1997 p.40}"
