summary:
  ar: "أنس بن مالك: كانوا يصلون العصر ثم يذهب الذاهب إلى العوالي والشمس ما تزال مرتفعة، واختلاف الرواة في ذكر النبي ﷺ."
  en: "Anas ibn Malik: they used to pray the afternoon prayer, then a man could set out for al-Awali while the sun was still high; the transmitters differ over mentioning the Prophet in it."
