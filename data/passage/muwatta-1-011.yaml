label: { ar: "الموطأ 11 — أنس: يذهب الذاهب إلى قباء والشمس مرتفعة", en: "Muwatta 11" }
text: "كنا نصلي العصر ثم يذهب الذاهب إلى قباء فيأتيهم والشمس مرتفعة"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أنس بن مالك، في باب وقوت الصلاة: كانوا يصلون العصر ثم يذهب الذاهب إلى قباء فيبلغها والشمس ما تزال مرتفعة. ويخرّجه المحقق عند البخاري (551) ومسلم والنسائي، وينقل عن ابن عبد البر أنه موقوف اللفظ في الموطأ لكنه «مرفوع عند أهل العلم بالحديث» لرواية الحفاظ له عن الزهري بذكر رسول الله. وفي لفظة «إلى قباء» خلاف نقله المحقق: نص النسائي والبزار والدارقطني على أن مالكاً وهم فيها وأن الصواب «إلى العوالي»، وجزم ابن عبد البر بالوهم (التمهيد 6/178)، وتعقبه ابن حجر في فتح الباري (2/37) بأن ابن أبي ذئب رواها عن الزهري كرواية مالك، ويرجح المحقق أن الوهم من مالك، ويذكر رأي ابن رشيد أن رواية العوالي مجملة ورواية قباء مفسرة، وأن ذلك كله لا يقدح في صحة الحديث. {cite:muwatta-maruf-1997 p.39} {cite:muwatta-maruf-1997 p.40}"
  en: "Anas ibn Malik: they used to pray the afternoon prayer, then a man could set out for al-Awali while the sun was still high; the transmitters differ over mentioning the Prophet in it."
