text: "… سعيد عن الشعبي قال: كتب رسول اللّٰه ولي إلى أهل نجران وهم نصارى أن من بايع منكم بالربا فلا ذمة له. - حدثنا أبو خالد الأحمر عن يحيى بن سعيد أن عمر أجلى أهل نجران اليهود والنصارى، واشترى بياض أرضهم …"
