  tr: "Cami' el-Tirmizi, Cenaze Törenleri Kitabı, Allah Resulü'nün rivayetine göre"
  id: "Jami' al-Tirmidhi, Kitab Pemakaman, berdasarkan riwayat Rasulullah SAW"
summary:
  ar: "القسم 10 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجنائز عن رسول الله»، ويضم فيها النصوص من 965 إلى 1079 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 10 of Jami' al-Tirmidhi (The Book on Jana''iz (Funerals)) in the division of the open hadith dataset the museum took its reports from: reports 965 to 1079 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 10، عنوان «کتاب الجنائز عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 965 تا 1079۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 10 de Jami' al-Tirmidhi (El libro sobre los funerales) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 965 al 1079 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du recueil ouvert Jami' al-Tirmidhi (Livre des funérailles), dans sa partie 10: les hadiths 965 à 1079. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 10. bölümü, \"Allah Resulü'nden Cenaze Kitabı\" başlığını taşımakta olup, 965'ten 1079'a kadar olan metinleri sırasıyla numaralandırarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 10 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pemakaman dari Rasulullah\" dan berisi teks-teks dari tahun 965 hingga 1079, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
