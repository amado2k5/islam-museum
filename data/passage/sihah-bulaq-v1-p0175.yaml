text: |-
  ٤٦٦
  (باب السين
  باضمار أءف ويروى غسو الامانة أيضا بالدين أى غسون فحذف النون للاضافة ويجوز
  غسى بكسر السين باضمار أ عنى وتحدذف النون للاضافة ويقال غس فلان خطبة الخطيب
  أى عابها وغسغست بالهرة اذا بالغت فى زبرها وغسّان قبيلة من اليمن منهسم ملوك غسان
  ويقال غسان ماء هذا اذا كان فعلان فهو من هذا الياب وان كان فعالا فهو من باب
  النون (غطس القطس فى الماء الغمس فيه وقد غطسه فى الماء يغطسه وأنشد أبوعرو
  وألقت ذراعيها وأدنت لبانها • من الماءحتى قلت فى الجم تغطس
  والمغنطيس بجر يجذب الحديد وهو معرب ⁦(غطرس)⁩ الغطريس الظالم المتك
  قال السكميت يخاطب بى فروان
  فلولا حبال منكم هى أسلست • جنائبنا كنا الاباة الغطارسا
  قد تفطرس فهو متغطرس ( غ س ا غلس ظلة آخر الميل قال الاخطل
  كذبتك عينك أم رأيت بواسط * غلس الظلام من الرباب خيالا
  والتغليس السير من الليل بفلس يقال غلسنا الماء أى وردناه بغلس وكذلك اذا فعلنا الصلاة
  بغلس قال أبو زيديقال وقع فلان فى وادى تغلس غير مصروف مثال تخيب وهى الداهيسة
  والباطل ( مس غمسه فى الماء أى مقلد فيه فانغمس واغتمس بمعنى والمغامسة المماقلة
  وكذلك اذارى الرجل نفسه فى وسط الحرب والامر الغموس الشديد والمين الغموم
  التى تغمس صاحبها فى الاتم والطعنة الغسموس النافذة وناقة غموس لا يستبان حلها حتى
  تقرب والغميس من النبات الغميز والغميس مسيل ماءصغير بين البقل والنبات ⁦(غيس )⁩
  الغيسان حدة الشباب
  صل القاء أس الفأس واحد الفؤوس وفأس اللجام الحديدة القائمة
  فى الحنك وفأس الرأس حرف القمحدوة المشرف على القفا وفأسه أى ضر تسه بالفاس
  وكذلك اذا أحيت قاس رأسه ( جس التجس التكبر والتعظم وقد فيس يفجس بالضم
  قال العجاج
  إذا أراد خلقا عفنسا أقرّه الناس وان تفجسا
  دكس الفدوكس الاسدمثل الدوكس وفدوكس أيضارهط الاخطل الشاعروهم
  من بنى جشم بن بكر ⁦(فرس )⁩. الفرس يقع على الذكر والانى ولا يقال للاتى فرسة
  وتصغير الفرس فريس وان أردت الاتى خاصة لم تقل الافريسة بالهاء عن أبى بكر بن السراج
  والجمع أفراس وراكبه فارس وهو مثل لابن وتاهر أى صاحب فرس ويجسمع على فوارس
  وهوشاذلا بقاس عليه لان فواعل انماهو جع فاعلة مثسل ضاربة وضوارب أوجع فاعل
  اذا كان صفة للمونث مثل حائض وحواتض اوما كان لغير الادميين مثل جمل بازل وجمال
  بوازل وجمسل عاضه وبحال عواضه وحائط وحوائط فامامذكر ما يعقل فلم يج-مع عليه
  الافوارس وهوالك ونوا كس فامافوارس فلانه شى لا يكون فى المؤنت فلم يخف فيه اللبس
  وأماهو الك فانماجاء فى المثل يقال هالك فى الهوالل فجرى على الاصل لانه قديجى
  فى الامثال مالايجىء فى غيرها وأمانواكس فقدجاء فى ضرورة الشعر قال ابن السكبت
  اذا
