label: { ar: "الموطأ 1553 — ابن شهاب عن سعيد بن المسيب: المحصنات من النساء هن ذوات الأزواج، ويرجع ذلك إلى أن الله حرم الزنا", en: "Muwatta 1553", es: "Muwatta 1553", fr: "Muwatta 1553", ur: "موطا 1553", tr: "El-Muvatta 1553 — İbn Şihab, Said bin El-Musayyab'dan rivayetle: Namuslu kadınlar, kocaları olanlardır; çünkü Allah zinayı haram kılmıştır.", id: "Al-Muwatta 1553 — Ibn Shihab berdasarkan riwayat Saeed bin Al-Musayyab: Wanita yang suci adalah mereka yang mempunyai suami, dan ini karena Allah telah melarang perzinahan." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أنه قال المحصنات من النساء هن أولات الأزواج، ويرجع ذلك إلى أن الله تعالى حرم الزنا. {cite:muwatta-maruf-1997 p.48}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn al-Musayyab'dan rivayetle şöyle buyurduğunu aktarır: \"Namuslu kadınlar, kocası olanlardır.\" Bunun sebebi ise Yüce Allah'ın zinayı haram kılmış olmasıdır. {cite:muwatta-maruf-1997 s.48}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, bahwa beliau berkata: \"Wanita yang suci adalah mereka yang mempunyai suami,\" dan ini karena Allah Yang Maha Kuasa telah melarang zina. {cite:muwatta-maruf-1997 p.48}"
