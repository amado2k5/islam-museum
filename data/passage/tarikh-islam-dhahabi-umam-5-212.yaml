text: "… عن ابن عبّاس أنّ مُشْرِكي قريش، بعثوا النَّضْرَ بنَ الحارث، وعُقْبة بن أبي مُعَيط إلى أحبار اليهود بالمدينة، وقالوا لهم : سَلُوهم عن محمد، وصفوا لهم صفَتَه، وأخبروهم بقوله، فإنهم أهل الكتاب الأوّل، وعندهم علمُ ما ليس عندنا، فقدِما المدينة، …"
summary:
