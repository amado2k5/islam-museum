text: "… وأضعفها. وقيل: إن استعمل ماؤها لتبريد ما في العين، فماؤها مجرداً شفاء، وإن كان لغير ذلك، فمركب مع غيره. وقال الغافقي: ماء الكماة أصلح الأدوية للعين إذا عُجِنَ به الإثمد واكتُحل به، ويقوِّي أجفانها، ويزيدُ كبات: في الصحيحين : من …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 726، يذكر الكمأة، والإثمد، والكحل، والدواء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 726, that mentions truffles and their water for the eye, ithmid (antimony kohl), kohl for the eye, the drug, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 726 کا اقتباس جس میں کھمبی، اثمد سرمہ، سرمہ، دوا، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
