label: { ar: "سنن النسائي 2619 — ما فُرض على الناس، الفرض", en: "Sunan al-Nasa'i 2619 — what was made obligatory on people; the obligatory (fard)", ur: "سنن نسائی 2619 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Sunan al-Nasa'i 2619 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Sunan al-Nasa'i 2619 — lo que se impuso a la gente; lo obligatorio (fard)" }
text: "… أَبِي هُرَيْرَةَ، قَالَ خَطَبَ رَسُولُ اللَّهِ النَّاسَ فَقَالَ \" إِنَّ اللَّهَ عَزَّ وَجَلَّ قَدْ فَرَضَ عَلَيْكُمُ الْحَجَّ \". فَقَالَ رَجُلٌ فِي كُلِّ عَامٍ فَسَكَتَ عَنْهُ حَتَّى أَعَادَهُ ثَلاَثًا فَقَالَ \" لَوْ قُلْتُ نَعَمْ لَوَجَبَتْ وَلَوْ وَجَبَتْ مَا قُمْتُمْ بِهَا ذَرُونِي مَا تَرَكْتُكُمْ فَإِنَّمَا هَلَكَ مَنْ كَانَ قَبْلَكُمْ بِكَثْرَةِ سُؤَالِهِمْ وَاخْتِلاَفِهِمْ عَلَى أَنْبِيَائِهِمْ فَإِذَا أَمَرْتُكُمْ بِالشَّىْءِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2619، يرد فيه ذكر ما فُرض على الناس، والفرض، و«لو قلت نعم لوجبت». يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 2619 (The Book of Hajj), whose wording mentions what was made obligatory on people, the obligatory (fard), 'had I said yes, it would have become obligatory'. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 2619، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، فرض، «اگر میں ہاں کہہ دیتا تو واجب ہو جاتا» کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 2619, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), « si j'avais dit oui, cela serait devenu obligatoire ». Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 2619, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), «si hubiera dicho que sí, se habría hecho obligatorio». El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
