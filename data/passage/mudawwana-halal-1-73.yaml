text: "… عن نفسه بعطيتهم نفقتهم وان كانوا أغنياء فغيرهم أحق بذلك منهم. وقد قال غيره اذا أعطاهم كما يعطي غيرهم من الأباعد على غير إيثار جاز لان الخمس فى لا وليس هو مثل الزكاة التي لا تحل لغنيّ والفى؛ يحل للغني …"
summary:
