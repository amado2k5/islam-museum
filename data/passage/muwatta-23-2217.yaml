label: { ar: "الموطأ 2217 — يحيى عن مالك عن يحيى بن سعيد عن أبي بكر بن حزم: أن غلاما من غسان حضرته الوفاة بالمدينة، ووارثه بالشام، فقال عمر: ليوص، وكان الغلام ابن عشر سنين أو اثنتي عشرة سنة، فأوصى ببئر جشم، فباعها أهلها بثلاثين ألف درهم", en: "Muwatta 2217" }
summary:
  ar: "قال يحيى بن سعيد: قال أبو بكر: وكان الغلام ابن عشر سنين، أو اثنتي عشرة سنة، فأوصى ببئر جشم، فباعها أهلها بثلاثين ألف درهم. ويروي مالك عن يحيى بن سعيد عن أبي بكر بن حزم أن غلاما من غسان حضرته الوفاة بالمدينة، ووارثه بالشام، فذكر ذلك لعمر بن الخطاب، فقيل له: إن فلانا يموت، أفيوصي؟ قال: فليوص. {cite:muwatta-maruf-1997 p.311}"
