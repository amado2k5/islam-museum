label: { ar: "الموطأ 2217 — يحيى عن مالك عن يحيى بن سعيد عن أبي بكر بن حزم: أن غلاما من غسان حضرته الوفاة بالمدينة، ووارثه بالشام، فقال عمر: ليوص، وكان الغلام ابن عشر سنين أو اثنتي عشرة سنة، فأوصى ببئر جشم، فباعها أهلها بثلاثين ألف درهم", en: "Muwatta 2217", es: "Muwatta 2217", fr: "Muwatta 2217", ur: "موطا 2217", tr: "El-Muvatta 2217 — Yahya, Malik'ten, o da Yahya ibn Said'den, o da Ebu Bekr ibn Hazm'dan rivayet eder ki: Gassanlı genç bir adam Medine'de ölüm döşeğindeydi ve varisi Suriye'deydi. Ömer, \"Vasiyetini yazsın\" dedi. Genç adam on ya da on iki yaşındaydı, bu yüzden Cuşam kuyusunu vasiyet etti ve sahipleri onu otuz bin dirheme sattılar.", id: "Al-Muwatta 2217 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Yahya bin Saeed, berdasarkan riwayat Abu Bakr bin Hazm: bahwa seorang pemuda dari Ghassan sedang sekarat di Madinah, dan ahli warisnya berada di Suriah. Umar berkata: Biarlah dia membuat wasiat. Pemuda itu berumur sepuluh atau dua belas tahun, lalu ia mewariskan sumur Jusham, dan pemiliknya menjualnya seharga tiga puluh ribu dirham." }
summary:
  ar: "قال يحيى بن سعيد: قال أبو بكر: وكان الغلام ابن عشر سنين، أو اثنتي عشرة سنة، فأوصى ببئر جشم، فباعها أهلها بثلاثين ألف درهم. ويروي مالك عن يحيى بن سعيد عن أبي بكر بن حزم أن غلاما من غسان حضرته الوفاة بالمدينة، ووارثه بالشام، فذكر ذلك لعمر بن الخطاب، فقيل له: إن فلانا يموت، أفيوصي؟ قال: فليوص. {cite:muwatta-maruf-1997 p.311}"
  tr: "Yahya ibn Sa'id şöyle dedi: Ebu Bekir dedi ki: Çocuk on ya da on iki yaşındaydı ve Cuşam kuyusunu vasiyet etti; sahipleri kuyuyu otuz bin dirheme sattılar. Malik, Yahya ibn Sa'id'den, o da Ebu Bekir ibn Hazm'dan rivayet eder ki, Gassanlı bir çocuk Medine'de ölüm döşeğindeydi ve varisi Suriye'deydi. Bu durum Ömer ibn el-Hattab'a bildirildi ve ona: Filan kişi ölüyor, vasiyet bırakmalı mı diye soruldu. Ömer şöyle dedi: Vasiyet bıraksın. {cite:muwatta-maruf-1997 s.311}"
  id: "Yahya ibn Sa'id berkata: Abu Bakr berkata: Anak laki-laki itu berumur sepuluh atau dua belas tahun, dan ia mewariskan sumur Jusham, yang pemiliknya menjualnya seharga tiga puluh ribu dirham. Malik meriwayatkan dari Yahya ibn Sa'id, dari Abu Bakr ibn Hazm, bahwa seorang anak laki-laki dari Ghassan sedang sekarat di Madinah, dan ahli warisnya berada di Suriah. Hal ini diceritakan kepada Umar ibn al-Khattab, dan ia ditanya: Si fulan sedang sekarat, haruskah ia membuat wasiat? Ia berkata: Biarlah ia membuat wasiat. {cite:muwatta-maruf-1997 p.311}"
