text: |-
  •⁦(باب اليم)⁩.
  •⁦( عهم)⁩
  ٣١٣
  والعريمة مصغرة رمنة لبنى فزارة. قال بشر بن أبى خازم
  انّ العرية مائع أرماحتا • ما كان من هم جارصفار
  والعر مرم الجيش الكثير وهرام الجيش كثرته (عرتم العرقمة مقدم الانف عن
  بعقوب بقال كان ذلك على رغم عرتمته أى على رغم أنفه وهى العربّيسة بالباء ور بماجاه
  بالثاء وليس بالعالى ( ردم قال أبو عبيدالعردام العود الذى تكون فيه الشماريخ
  ( رزم العرزم الشديد الجتمع والاعرنزام الاجتماع قال نهاربن توسعة
  ومن مترب ذعدعت بالسيف ماله • فذل وقدما كان معرنزم السكرد
  رهم) الفراء بهل عراهم مثل براهم وناقة عراهمة أى ضخمة زم عزمت
  على كذاءزما وعزما بالضم وعزيمة وعزيما اذا أردت فعله وقطعت عليه قال اللّٰه تعالى
  ولم نجدله عزما أى صريمة أمرويقال أيضاعزمت عليك بمعنى أقسمت عليك واعتزمت
  على كذا وعزمت بمعنى والاعستزام لزوم القصد فى المشى والعزائم الرقالادءعى العوزم
  الناقة المسنة وفيهابقية من شباب والعوزم الهجوز وأنتدالفراء
  لقد غدوت خلق الاثواب • أحل عدلين من التراب
  لعوزم وصبية سفاب * فا كل ولاحس وآب
  (عسم العسم فى الكف والقدم أن يببس مفصل الرسخ حتى بعوج الصكف والقدم :
  ررجن أعسم بين العسم وامرأ: عسماء والعسم الطمع يقال هذا الامر لا يعسم فيه أى
  لا يطمع فى مغالبته وقهره قال الراجز» كالبجر لا يعسم فيه عاسم* وماللت فى بني فلان معسم
  أى مطمع وعسم الرجل بنفسه وسط القوم اذا اقتحمهم-تى خالطهم غير مكترث فى حرب
  كان أوغير حرب الفراء العمم الاكنساب وفلان بعسم أى يجتهد فى الامر ويعمل نفسه فيه
  واعتسمته اذا أعطيته ما يطمع منلا والاعتام أن تضع الشاء ويأتى الراعى فيلقى الى كل
  واحدة ولدها شم لعشمة بالتحر يك مثل العشبة يقال شيخ عشمة وعجوز عشمة أى همّ
  وهمة والعشم الخبز اليابس القطعة منه عشمة وعاشم نقابعالج والعيشوم ماهاج من الهاض
  ويبس وقال •كماتناوح يوم الريح عيشوم• الواحدة عيشومة صم بو عمر والعصيم
  بقية كل شئ وأثره من القطران واللخضاب ونحوه والعصم بالضم مثله قال الاصمعى سمعت
  اعرابية تقول لحارتها أعطيني عصم حنائك أى ماسلت منه والعصمة المنع بقال عصمه
  الطعام أى منعه من الجوع وأبو عاصم كنية السويق وأمّاقول الراجز
  أرجدرأس شيخة عبصوم • فيقال هى الاكول ومنهم من يرويه بالضاد معجة والعصمة
  لحفظيق ال عصمته فانعصم واعتصمت باللّه اذا امتنعت بلطفه من المعصية وعصم يعصم عصما
  اكت--ب وقوله نعالى لاعاصم اليوم من أمر اللّٰه يجوز أن براد لا معصوم أى لاذاعصمة
  .كون فاعل بمعنى مفعول والعصمة القلادة والجمع الاعصام قال لبيد
  حتى اذا يئس الرمأة وأرسلوا * غضفادواجن قافلا أعصامها
  والمعصم موضع الوار من الساعد والغراب الاعصم الذى فى جناحه ريشة بيضاءلانّ
  جماح الطائر بنزلة السدله ويقال هذا كقولهم الابلق العقوق وبيض الانوق لمكل شئ
