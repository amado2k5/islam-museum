label: { ar: "الموطأ 1854 — مالك: لا بأس بشراء الذهب بالفضة جزافا إذا كان تبرا أو حليا قد صيغ، أما الدراهم والدنانير المعدودة فلا يشترى شيء منها جزافا حتى يعد، لأنه غرر", en: "Muwatta 1854", es: "Muwatta 1854", fr: "Muwatta 1854", ur: "موطا 1854", tr: "El-Muvatta 1854 — Malik: Külçe altın veya işlenmiş mücevherat ise, gümüşle birlikte toplu halde altın almakta bir sakınca yoktur. Sayılı dirhem ve dinarlara gelince, bunların hiçbiri sayılana kadar toplu halde alınmamalıdır, çünkü bu belirsizliktir.", id: "Al-Muwatta 1854 — Malik: Tidak ada salahnya membeli emas dengan perak dalam jumlah besar jika itu berupa emas batangan atau perhiasan yang telah dibuat. Adapun dirham dan dinar yang dihitung, tidak boleh dibeli dalam jumlah besar sebelum dihitung, karena itu adalah ketidakpastian." }
summary:
  ar: "قال مالك: لا بأس أن يشتري الرجل الذهب بالفضة، والفضة بالذهب، جزافا، إذا كان تبرا أو حليا قد صيغ. فأما الدراهم المعدودة، والدنانير المعدودة، فلا ينبغي لأحد أن يشتري شيئا من ذلك جزافا حتى يعلم ويعد، فإن اشتري ذلك جزافا، فإنما يراد به الغرر، حين يترك عده ويشترى جزافا، وليس هذا من بيوع المسلمين. وأما ما كان يوزن من التبر والحلي فلا بأس أن يباع ذلك جزافا. {cite:muwatta-maruf-1997 p.161}"
  tr: "Malik şöyle dedi: Bir kimsenin ham altın veya işlenmiş mücevheratla birlikte altın veya altınla birlikte gümüş alması sakıncalı değildir. Ancak, miktarı bilinip sayılana kadar sayılmış dirhemler ve sayılmış dinarlar toplu olarak alınmamalıdır. Eğer toplu olarak alınırsa, sayılmadıkları ve toplu olarak alındıkları için belirsizlik yaratmak amaçlanır ve bu Müslüman ticaretinde caiz değildir. Tartılmış ham altın ve mücevherat ise toplu olarak satılmasında sakınca yoktur. {cite:muwatta-maruf-1997 s.161}"
  id: "Malik berkata: Tidak ada salahnya seseorang membeli emas dengan perak, atau perak dengan emas, dalam jumlah besar, jika itu adalah emas mentah atau perhiasan yang telah dibuat. Namun, dirham dan dinar yang dihitung tidak boleh dibeli dalam jumlah besar sampai jumlahnya diketahui dan dihitung. Jika dibeli dalam jumlah besar, hal itu dimaksudkan untuk menciptakan ketidakpastian, karena tidak dihitung dan dibeli dalam jumlah besar, dan ini tidak diperbolehkan dalam transaksi Muslim. Adapun emas mentah dan perhiasan yang ditimbang, tidak ada salahnya menjualnya dalam jumlah besar. {cite:muwatta-maruf-1997 p.161}"
