label: { ar: "الموطأ 1854 — مالك: لا بأس بشراء الذهب بالفضة جزافا إذا كان تبرا أو حليا قد صيغ، أما الدراهم والدنانير المعدودة فلا يشترى شيء منها جزافا حتى يعد، لأنه غرر", en: "Muwatta 1854" }
summary:
  ar: "قال مالك: لا بأس أن يشتري الرجل الذهب بالفضة، والفضة بالذهب، جزافا، إذا كان تبرا أو حليا قد صيغ. فأما الدراهم المعدودة، والدنانير المعدودة، فلا ينبغي لأحد أن يشتري شيئا من ذلك جزافا حتى يعلم ويعد، فإن اشتري ذلك جزافا، فإنما يراد به الغرر، حين يترك عده ويشترى جزافا، وليس هذا من بيوع المسلمين. وأما ما كان يوزن من التبر والحلي فلا بأس أن يباع ذلك جزافا. {cite:muwatta-maruf-1997 p.161}"
