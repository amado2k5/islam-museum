  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 1762. sayfasından bir alıntı, son vasiyetname ve ölüm saatinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir baskıdan alınmıştır. Vasiyetnameler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
