text: "… القصة أيضًا ما رواه أبو جعفر بن جرير: حدَّثني يعقوب، حدَّثنا هُشَيْم، أخبرنا زكريا، عن الشعبي؛ أنَّ رجلًا من المسلمين حضرَتْهُ الوفاة بدَقُوقَا، قال: فحضرته الوفاة ولم يجد أحدًا من المُسْلِمِين يشهده علىٰ وَصِيَّتِّهِ، فأشهد رَجُلَين مِن أهل الكتاب. قال: …"
summary:
