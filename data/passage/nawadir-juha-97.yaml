text: "… المسمار يقوم مقام الرماد أوصتْهُ امرأتُهُ بأَنْ يأْتِيها بدقيقِ فحمِ لصبغ الخطوط، وأعطَتْهُ كيساً لذلك، ولَمَّا لم يَجِدْ دقيقَ فحم ذَهَبَ إلى مكان الحريقِ، ووضعَ شيئاً مِنَ المساميرِ في الكيسِ وعادَ إلى البيت فأعطاها إلى امرأته فلما رأت المسامير تعجبت …"
summary:
  ar: "طلبت زوجة جحا غبار الفحم، فأخذ مسامير بدلًا منه محتجًا بأن «أكثر» و«مسمار» متقاربتان في اللفظ بالتركية، فالمسمار يقوم مقام الرماد. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  en: "Juha's wife asks for coal dust; he takes nails instead, arguing that 'more' and 'nail' sound alike in Turkish, so the nail stands for ash. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  ur: "جحا کی بیوی نے کوئلے کی راکھ مانگی؛ اس نے اس کی جگہ کیلیں لے لیں اور دلیل دی کہ ترکی میں «زیادہ» اور «کیل» کے الفاظ ملتے جلتے لگتے ہیں، اس لیے کیل راکھ کی جگہ لے لیتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  fr: "La femme de Juha demande de la poussière de charbon ; il prend des clous à la place, arguant qu'en turc «plus» et «clou» se ressemblent à l'oreille, si bien que le clou tient lieu de cendre. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  es: "La mujer de Juha pide polvo de carbón; él toma clavos en su lugar, alegando que en turco «más» y «clavo» suenan parecido, así que el clavo hace las veces de ceniza. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  tr: "Juha'nın karısı kömür tozu istemişti, ancak o bunun yerine çivi aldı ve Türkçe'de \"daha\" ve \"çivi\" kelimelerinin benzer ses çıkardığını ve çivinin külle aynı amaca hizmet ettiğini savundu. {cite:juha-nawadir-kubra-djuwaydi s. 49}"
  id: "Istri Juha meminta debu arang, tetapi ia malah mengambil paku, dengan alasan bahwa \"lebih\" dan \"paku\" terdengar mirip dalam bahasa Turki, dan bahwa paku memiliki fungsi yang sama dengan abu. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
