text: |-
  •باب اللام).
  •⁦(طبل)⁩•
  ٢٠٧
  ضال حدا وه والكثير التتبع للضلال وكان يقال لامرئ القيس الملك الضليل والضلفل
  والضلضلة الارض الفليظة عن الاصحعى كانه قصر الضلاضل والضلصّلة بضم الضادوفتح
  اللام وكسر الضاد الثانية جر قدرما بقله الرجل وليس فى الكلام المضاعف غيره وأنشد
  الاصحعى* وبعد اذ نحن على الضلفله » والضلال والضلالة ضد الرشاد وقدفلات أضلّ قال
  تعالى قل ان ضلات قانما أضلّ على نفسى فهذهلغة تجدوهى الفصيحة وأهل العالية يقولون
  ضلات بالكسر أضل وهوضال تال وهى الخلالة والتلالة وأضله أى أضاعه وأهلمكه
  يقال أضل الميت اذادفن وقال النابغة
  وآب مضلوه بعين جلية • وغودر بالجولان حزم ونائل
  ابن السكت أضلات بعيرى اذا ذهب منك وضلات المسجد والداراذ الم تعرف موضعهم
  وكذلك كل شى مقيم لا يهتدى له وفى الحديث عن الرجل الذى قال لعلى أضل اللّٰه يريد أضل
  عنه أى أخفى عليه وأغيب من قوله تعالى أتذاضللنا فى الارض أى خفيذا وغبنا وأضله اللّٰه
  فضل تقول انك تهدى الضال ولا تهدى المتضال وتضليل الرجل ان تنسبه الى الضلال
  وقوله تعالى انّ الجرمين فى ضلال وسعرأى فى هلال الكسائى وقع فى وادى تضلل
  معناه الباطل مثسل تخيب وتهلك كاه لا يتصرف ويقسال للباطل ضل بتضلال قال عمرو
  ابن شاس الاسدىV
  تذكرت ليلى لات حين اذكارها • وقد -ى الاضلاع ضل بتضلال
  وقول أبى ذؤيب ١ رآها الفؤاد فاستضل ضلاله • بعنى طلب منه أن يضل فضلّ
  كمايقال جنّ جذونه ومضلل بفتح اللام اسم رجل من بى أسد وقال ٢
  فقبلى مات الخالدان كلاهما * عيد بى حوان وابن المضلل
  هل لاصمعى تضهل اليه أى رجع على غير وجه المقاتلة والمغالبة وضهله أى دفع اليه
  قليلا قليلا وأعطيته ضهلة من مال أى نذرا وعطية ضهلة أى نذرة وض هل الشراب قلْ ورق
  ويقأل هل ضهل اليكم خبر أى وقع والضهل الماء القليل مثل الضحسل ويترضهول اذا كان
  يخرج ماؤها قليلا قلبلاوشاة ضه ول قليلة اللبن وقد ضهات وجة ضاهلة قليلة الماه
  وأضهات النخسلة أى ارطبت وقد قالوا أضهل البسراذا بدافيه الارطاب ⁦( يل)⁩
  الضال السدر البرى الواحدضالة وقول ابن.مادة
  قطعت بمضلال الخشاش يردها • على المكره منهاضالة وجديل
  يريد الخشاشة التخذة من الضال قال الفراء أضيلت الارض وأضالت اذا صارفيها الضال
  مثل أغيلت المرأة وأغالت
  والطبل انخلق يقال ما أدرى أى الطبل هو أى أى "الناس هو قال لبيد ٣
  ستعلون من خيار الطبل • والطويالة النعجة وججعهاطو بالات ولا يقال للكبش
  طوبال قال طرفة
  نعانى جنانه طوبالة • تسفة يليسا من المشرق
  ياقامن البيض الحسان العطابلو
  ٢ ف نسخسة زيادة الشاءر
  الاسودين يعفراه
  ثم جريت لا نطلاق رسل
