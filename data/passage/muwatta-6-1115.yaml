label: { ar: "الموطأ 1115 — ابن عمر: كان يجلل بدنه القباطي والأنماط والحلل، ثم يبعث بها إلى الكعبة فيكسوها إياها", en: "Muwatta 1115", es: "Muwatta 1115", fr: "Muwatta 1115", ur: "موطا 1115", tr: "El-Muvatta 1115 — İbn Ömer: Vücudunu Kıpti kumaşları, halıları ve elbiseleriyle örter, sonra da Kâbe'yi bunlarla örtmeleri için onlara gönderirdi.", id: "Al-Muwatta 1115 — Ibn Umar: Dia akan menutupi tubuhnya dengan kain Koptik, karpet, dan jubah, lalu mengirimkannya ke Ka'bah untuk menyelimutinya." }
text: "يجلل بدنه القباطي والأنماط والحلل، ثم يبعث بها إلى الكعبة فيكسوها إياها"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يجلل بدنه القباطي والأنماط والحلل، ثم يبعث بها إلى الكعبة فيكسوها إياها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1210) وسويد (525) والبيهقي. {cite:muwatta-maruf-1997 p.510} {cite:muwatta-maruf-1997 p.511}"
  tr: "Malik, Nafi'den rivayet ettiğine göre, Abdullah ibn Umar vücudunu Kıpti kumaşları, halıları ve elbiseleriyle örter, sonra da bunları giydirilmek üzere Kâbe'ye gönderirdi. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1210), Suveyd (525) ve el-Beyhaki tarafından da nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.510} {cite:muwatta-maruf-1997 s.511}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa menutupi tubuhnya dengan kain Koptik, karpet, dan jubah, kemudian mengirim mereka ke Ka'bah untuk dipakaikan pakaian tersebut. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus’ab (1210), Suwaid (525), dan al-Bayhaqi. {cite:muwatta-maruf-1997 p.510} {cite:muwatta-maruf-1997 p.511}"
