text: "… هذا الرجل أنا فمن أنا؟ سافر سفرةً طويلةً فعلَّقَ على جسمه يقطينة قائلاً : أَعَلّقُ هذه حتى لا أضيعَ. وسار، فحطّ في بعض المنازل، فجاءَ رجل وأخذ تلك اليقطينة وعلّقها على نفسه. ففي اليوم التالي رآهُ الشيخُ فحارَ في أمرِه، …"
summary:
  ar: "علّق جحا قرعة على نفسه كي لا يفقدها، فأخذها رجل وعلّقها على نفسه، ورآه جحا في اليوم التالي فسأله من هو. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  en: "Juha hangs a gourd on himself to avoid losing it; a man takes it and hangs it on himself; the next day Juha sees him and asks who he is. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  ur: "جحا نے ایک کدو اپنے اوپر لٹکا لیا تاکہ کھو نہ جائے؛ ایک آدمی نے اسے لے کر اپنے اوپر لٹکا لیا؛ اگلے دن جحا نے اسے دیکھا اور پوچھا کہ تم کون ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  fr: "Juha s'accroche une gourde pour ne pas la perdre ; un homme la prend et se l'accroche ; le lendemain, Juha le voit et lui demande qui il est. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  es: "Juha se cuelga una calabaza para no perderla; un hombre la toma y se la cuelga; al día siguiente Juha lo ve y le pregunta quién es. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
