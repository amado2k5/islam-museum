label: { ar: "الموطأ 911 — مالك: الثوب الذي مسه طيب ثم ذهب ريحه يحرم فيه ما لم يكن فيه صباغ زعفران أو ورس", en: "Muwatta 911", es: "Llama al 911", fr: "Appelez le 911", ur: "911 پر کال کریں۔", tr: "Al-Muwatta 911 — Malik: Parfümle temas ettikten sonra kokusu kaybolmuş bir giysinin, safran veya aspir boyası içermediği sürece giyilmesi yasaktır.", id: "Al-Muwatta 911 — Malik: Pakaian yang telah terkena parfum dan kemudian aromanya memudar haram dipakai kecuali jika mengandung pewarna safflower atau safflower." }
summary:
  ar: "قول يرويه يحيى عن مالك: سئل عن ثوب مسه طيب ثم ذهب منه ريح الطيب، هل يحرم فيه؟ فقال: نعم، ما لم يكن فيه صباغ زعفران أو ورس. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1043). {cite:muwatta-maruf-1997 p.439}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Ona, parfümle dokunulmuş ve sonra kokusu kaybolmuş bir elbise soruldu; bu elbiseyi giymek caiz midir? Cevap verdi: Evet, safran veya zerdeçal boyası içermediği sürece. Araştırmacı, bunu Ebu Mus'ab'ın (1043) Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.439}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Ia ditanya tentang pakaian yang telah terkena parfum dan kemudian aromanya memudar; apakah boleh memakainya? Ia menjawab: Ya, kecuali jika mengandung pewarna safron atau kunyit. Peneliti menyebutkan bahwa Abu Mus'ab (1043) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.439}"
