label: { ar: "سنن النسائي 3554 — أطوار خلق الجنين", en: "Sunan al-Nasa'i 3554 — the stages of the embryo", ur: "سنن نسائی 3554 — جنین کے مراحل", es: "Sunan al-Nasa'i 3554 — Las etapas del embrión", fr: "Sunan al-Nasa'i 3554 — les stades de l'embryon", tr: "Sunan an-Nasa'i 3554 — Fetal gelişim evreleri", id: "Sunan an-Nasa'i 3554 — Tahapan perkembangan janin" }
text: "… مَا نُسِخَ مِنَ الْقُرْآنِ الْقِبْلَةُ وَقَالَ { وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلاَثَةَ قُرُوءٍ وَلاَ يَحِلُّ لَهُنَّ أَنْ يَكْتُمْنَ مَا خَلَقَ اللَّهُ فِي أَرْحَامِهِنَّ } إِلَى قَوْلِهِ { إِنْ أَرَادُوا إِصْلاَحًا } وَذَلِكَ بِأَنَّ الرَّجُلَ كَانَ إِذَا طَلَّقَ امْرَأَتَهُ فَهُوَ أَحَقُّ بِرَجْعَتِهَا وَإِنْ طَلَّقَهَا ثَلاَثًا فَنَسَخَ ذَلِكَ وَقَالَ { الطَّلاَقُ مَرَّتَانِ فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ }."
summary:
  ar: "حديث في سنن النسائي، رقم 3554، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 3554 (The Book of Divorce), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 3554، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3554 (El Libro del Divorcio), menciona las etapas del embrión. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3554 (Le Livre du Divorce), mentionne les stades du développement embryonnaire. Le Répertoire des ressources médicales le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan-ı Nesai'de yer alan 3554 numaralı hadis, fetüsün gelişim aşamalarından bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3554, menyebutkan tahapan perkembangan janin. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
