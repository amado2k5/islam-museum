summary:
  ar: "قال مالك: لا ينبغي أن يشترى دين على رجل غائب ولا حاضر، إلا بإقرار من الذي عليه الدين، ولا على ميت، وإن علم الذي ترك الميت، وذلك أن اشتراء ذلك غرر، لا يدرى أيتم أم لا يتم. وتفسير ما كره من ذلك أنه إذا اشترى دينا على غائب أو ميت، أنه لا يدرى ما يلحق الميت من الدين الذي لم يعلم به. فإن لحق الميت دين، ذهب الثمن الذي أعطى المبتاع باطلا. {cite:muwatta-maruf-1997 p.207}"
