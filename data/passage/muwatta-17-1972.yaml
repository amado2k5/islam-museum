label: { ar: "الموطأ 1972 — مالك: لا ينبغي أن يشترى دين على رجل غائب ولا حاضر إلا بإقرار من الذي عليه الدين، ولا على ميت، لأن شراء ذلك غرر لا يدرى أيتم أم لا يتم", en: "Muwatta 1972", es: "Muwatta 1972", fr: "Muwatta 1972", ur: "موطا 1972", tr: "El-Muvatta 1972 — Malik: Borçlunun rızası olmadan, gıyabında veya fıkıhında olan bir kişinin borcunu satın almak caiz değildir; aynı şekilde, ölmüş bir kişiden de borç satın alınmamalıdır, çünkü böyle bir satın alma belirsizlik içerir; borcun ödenip ödenmeyeceği bilinmez.", id: "Al-Muwatta 1972 — Malik: Tidak diperbolehkan membeli utang yang dimiliki oleh seseorang yang tidak hadir atau hadir, kecuali dengan pengakuan dari debitur, dan tidak boleh dibeli dari orang yang telah meninggal, karena pembelian tersebut mengandung ketidakpastian karena tidak diketahui apakah utang tersebut akan dilunasi atau tidak." }
summary:
  ar: "قال مالك: لا ينبغي أن يشترى دين على رجل غائب ولا حاضر، إلا بإقرار من الذي عليه الدين، ولا على ميت، وإن علم الذي ترك الميت، وذلك أن اشتراء ذلك غرر، لا يدرى أيتم أم لا يتم. وتفسير ما كره من ذلك أنه إذا اشترى دينا على غائب أو ميت، أنه لا يدرى ما يلحق الميت من الدين الذي لم يعلم به. فإن لحق الميت دين، ذهب الثمن الذي أعطى المبتاع باطلا. {cite:muwatta-maruf-1997 p.207}"
  tr: "Malik şöyle demiştir: Borçlunun rızası olmadan, gıyabında veya gıyabında olan bir kişinin borcunu satın almak caiz değildir; aynı şekilde, ölen kişinin mirasçıları biliniyor olsa bile, ölen kişinin borcunu satın almak da caiz değildir. Çünkü böyle bir satın alma belirsizlik içerir, zira borcun ödenip ödenmeyeceği bilinmemektedir. Onaylamamasının sebebi, gıyabında veya gıyabında olan bir kişinin borcunun satın alınması durumunda, ölen kişinin hangi borçtan habersiz olduğunun bilinmemesidir. Eğer ölen kişiye gerçekten bir borç varsa, alıcının ödediği bedel geçersizdir. {cite:muwatta-maruf-1997 s.207}"
  id: "Malik berkata: Tidak diperbolehkan membeli utang yang dimiliki oleh seseorang yang tidak hadir atau hadir, kecuali dengan pengakuan dari debitur, demikian pula utang yang dimiliki oleh orang yang telah meninggal, meskipun ahli waris almarhum diketahui. Hal ini karena pembelian tersebut mengandung ketidakpastian, karena tidak diketahui apakah utang tersebut akan dilunasi atau tidak. Alasan ketidaksetujuannya adalah jika seseorang membeli utang yang dimiliki oleh orang yang tidak hadir atau telah meninggal, tidak diketahui utang apa yang tidak diketahui oleh almarhum. Jika almarhum memang memiliki utang, maka harga yang dibayarkan oleh pembeli menjadi batal. {cite:muwatta-maruf-1997 p.207}"
