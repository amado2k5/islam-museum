text: "المهدي، وكتب له كتابا إلى إبراهيم بن الأغلب عامله على أفريقية فخرج حتى وصل إلى زويلة(١)، وذكر لهم أنه طبيب، وأنه ولي من أوليائهم فاطمان إليه وآنس به، فشكا إليه علة في أسنانه فأعطاء سنونا مسموما ليلا وأمره أن يستن"
