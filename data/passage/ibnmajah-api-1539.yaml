label: { ar: "سنن ابن ماجه 1539 — قيراط الأجر", en: "Sunan Ibn Majah 1539 — the qirat of reward", ur: "سنن ابن ماجہ 1539 — اجر کا قیراط", es: "Sunan Ibn Majah 1539: el qirat de recompensa", fr: "Sunan Ibn Majah 1539 — le qirat de la récompense", tr: "Sünen İbni Mace 1539 — Ödül kıratı", id: "Sunan Ibnu Majah 1539 — Qirat pahala" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ الأَعْلَى، عَنْ مَعْمَرٍ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ ـ قَالَ \" مَنْ صَلَّى عَلَى جِنَازَةٍ فَلَهُ قِيرَاطٌ وَمَنِ انْتَظَرَ حَتَّى يُفْرَغَ مِنْهَا فَلَهُ قِيرَاطَانِ \". قَالُوا وَمَا الْقِيرَاطَانِ قَالَ \" مِثْلُ الْجَبَلَيْنِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1539، يذكر قيراط الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1539 (Chapters Regarding Funerals), that speaks of the qirat of reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1539، جس میں اجر کا قیراط کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1539 (Capítulos sobre los funerales), habla del qirat de recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 1539 (Chapitres relatifs aux funérailles), évoque le calcul de la récompense. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui permettent de compter, d'écrire, d'effacer ou de peser un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 1539 numaralı hadiste, sevabın kıratı (değerlendirilmesi) anlatılmaktadır. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1539, menyebutkan qirat pahala. Qirat ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
