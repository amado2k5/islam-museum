text: "… نصف الإيمان، و اليقين : الإيمان كله الطهور : شطر ونصف الإيمان البذاذَةُ مِن الإيمان لا إيمان لمن لا تقِيَّةَ له نفي الدين عمَّن لا أمانة له ولا عهد أول ما يفقد الناس من الدين الأمانة كثرة المسلمين وقلة المؤمنين …"
