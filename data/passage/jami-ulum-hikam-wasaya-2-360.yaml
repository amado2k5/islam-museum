text: "… بن أوس، به.. هذا الحديث خرَّجه مسلم دونَ البخاري من رواية أبي قلابة، عن أبي الأشعث الصنعاني، عن شدَّاد بنِ أوس في صحيحه من حديث شداد بن أوس به.، وتركه البخاري ؛ لأنَّه لم يخرِّج في صحيحه لأبي الأشعث شيئاً …"
summary:
