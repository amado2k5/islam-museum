text: "… فتحت فمي حتى كاد يتمزق كان بعض المتصلفين في مجلس يهذرُ بكلام لا معنى له ويأخذُ من كلِّ وادٍ عصا. وكان الشيخ منزوياً في جهة يتمطى. وعند قرّب ختام المجلس، التفت ذلك المِهذارُ، قاصداً المُزاح، وقال : لماذا لا تتكلَّم …"
summary:
  ar: "في مجلس تحدث متباهٍ بكلام فارغ، وفي النهاية سأل جحا لماذا يسكت، فقال جحا إنه ضجر من الصمت وإنه فتح فمه حتى كاد يتمزق. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  en: "In a gathering a boaster talks nonsense, and at the end he asks Juha why he is silent. Juha, bored of silence, says that he opened his mouth so wide that it nearly tore. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  ur: "ایک محفل میں ایک شیخی باز بے معنی باتیں کرتا رہتا ہے اور آخر میں جحا سے پوچھتا ہے کہ وہ چپ کیوں ہے۔ جحا خاموشی سے اکتا کر کہتا ہے کہ اس نے منہ اتنا کھولا کہ پھٹنے کو آ گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  fr: "Dans une assemblée, un vantard dit des sottises, et à la fin il demande à Juha pourquoi il se tait. Juha, las du silence, dit qu'il a ouvert la bouche si grand qu'elle a failli se déchirer. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  es: "En una reunión un fanfarrón dice tonterías, y al final pregunta a Juha por qué calla. Juha, harto del silencio, dice que abrió la boca tanto que casi se le desgarró. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
