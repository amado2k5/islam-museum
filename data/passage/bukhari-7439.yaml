label:
  ar: "البخاري 7439 — حديث أبي سعيد في الرؤية والشفاعة: شفعت الملائكة"
  en: "Bukhari 7439 — Abu Sa'id's report of the vision and the intercession"
  ur: "بخاری 7439 — دیدار اور شفاعت کے بارے میں ابو سعید کی روایت"
text: "هل تضارون في رؤية الشمس والقمر إذا كانت صحوا . قلنا لا. قال فإنكم لا تضارون في رؤية ربكم يومئذ، إلا كما تضارون في رؤيتهما ثم قال ينادي مناد ليذهب كل قوم إلى ما كانوا يعبدون. فيذهب أصحاب الصليب مع …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7439: حديث أبي سعيد في الرؤية والشفاعة: شفعت الملائكة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7439: Abu Sa'id's report of the vision and the intercession. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7439: دیدار اور شفاعت کے بارے میں ابو سعید کی روایت۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
