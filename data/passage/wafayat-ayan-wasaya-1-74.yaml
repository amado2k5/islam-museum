text: "بقين من شهر ربيع الأول سنة خمس وثمانين وثلثمائة، وعمره خمس وخمسون سنة وشهور، ودفن من الغد، وصلى عليه أبو بكر محمد بن موسى الحوارزمي، ذكر ذلك ملال بن المحسن ابن الصابي الكاتب في تاريخه. وقال غيره : مولده في …"
