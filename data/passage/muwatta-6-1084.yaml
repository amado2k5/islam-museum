label: { ar: "الموطأ 1084 — زينب بنت أبي سلمة عن أم سلمة زوج النبي: شكوت إلى رسول الله أني أشتكي، فقال: طوفي من وراء الناس وأنت راكبة، فطفت راكبة وهو يصلي إلى جانب البيت يقرأ بالطور وكتاب مسطور", en: "Muwatta 1084", es: "Muwatta 1084", fr: "Muwatta 1084", ur: "موطا 1084", tr: "El-Muvatta 1084 — Zeyneb bint Ebu Seleme, Peygamberin eşi Ümmü Seleme'den rivayetle: Allah Resulü'ne hasta olduğumu söyledim ve o şöyle buyurdu: \"Binek üzerindeyken insanların arkasında tavaf yap.\" Ben de binek üzerinde tavaf yaptım ve o da Kabe'nin yanında namaz kılıyor, Tur Suresi'ni ve yazılı bir kitabı okuyordu.", id: "Al-Muwatta 1084 — Zaynab bint Abi Salamah, dari Umm Salamah, istri Nabi: Aku mengeluh kepada Rasulullah bahwa aku sakit, dan beliau berkata: Lakukan Tawaf di belakang orang-orang sambil kamu menunggangi kendaraan. Maka aku melakukan Tawaf sambil menunggangi kendaraan, dan beliau sedang shalat di samping Ka'bah, membaca Surah At-Tur dan sebuah Kitab tertulis." }
text: "طوفي من وراء الناس وأنت راكبة"
summary:
  ar: "أول حديث في باب جامع الطواف. يرويه مالك عن أبي الأسود محمد بن عبد الرحمن بن نوفل عن عروة بن الزبير عن زينب بنت أبي سلمة عن أم سلمة زوج النبي، أنها قالت: شكوت إلى رسول الله أني أشتكي، فقال: طوفي من وراء الناس وأنت راكبة. قالت: فطفت راكبة بعيري ورسول الله حينئذ يصلي إلى جانب البيت، وهو يقرأ بالطور وكتاب مسطور. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1302) وسويد (552) وإسماعيل بن أبي أويس عند البخاري (1619)، وغيرهم. {cite:muwatta-maruf-1997 p.498}"
  tr: "Kapsamlı tavaf bölümündeki ilk hadis. Malik, Ebu el-Esved Muhammed ibn Abdül-Rahman ibn Nevfel'den, Urve ibn el-Zübeyr'den, Zeynep bint Ebu Seleme'den, Peygamberin eşi Ümmü Seleme'den rivayet etmiştir. Ümmü Seleme şöyle demiştir: \"Hasta olduğumu Resulullah'a bildirdim. O da 'Deveye binerek insanların arkasında tavaf yap' dedi. Ümmü Seleme de 'Ben de deveye binerek tavaf yaptım. Resulullah da Kâbe'nin yanında namaz kılıyor, Tur Suresi ve Mes'ud Suresi okuyordu' dedi.\" Editör, bu hadisin Malik'ten Ebu Musab (1302), Suveyd (552), İsmail ibn Ebu Uveys ve diğerleri tarafından rivayet edildiğini ve Buhari'nin (1619) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.498}"
  id: "Hadits pertama dalam bab tentang tawaf yang lengkap. Diriwayatkan oleh Malik dari Abu al-Aswad Muhammad ibn Abd al-Rahman ibn Nawfal, dari Urwah ibn al-Zubayr, dari Zaynab bint Abi Salamah, dari Umm Salamah, istri Nabi, yang berkata: Aku mengeluh kepada Rasulullah bahwa aku sakit, dan beliau berkata: Lakukan tawaf di belakang orang-orang sambil kamu menunggang unta. Dia berkata: Maka aku melakukan tawaf sambil menunggang unta, dan Rasulullah sedang shalat di samping Ka'bah, membaca Surah At-Tur dan Surah Al-Mas'ud. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1302), Suwayd (552), Isma'il ibn Abi Uways, dan lainnya, sebagaimana dicatat oleh Al-Bukhari (1619). {mengutip:muwatta-maruf-1997 hal.498}"
