label: { ar: "الموطأ 1084 — زينب بنت أبي سلمة عن أم سلمة زوج النبي: شكوت إلى رسول الله أني أشتكي، فقال: طوفي من وراء الناس وأنت راكبة، فطفت راكبة وهو يصلي إلى جانب البيت يقرأ بالطور وكتاب مسطور", en: "Muwatta 1084" }
text: "طوفي من وراء الناس وأنت راكبة"
summary:
  ar: "أول حديث في باب جامع الطواف. يرويه مالك عن أبي الأسود محمد بن عبد الرحمن بن نوفل عن عروة بن الزبير عن زينب بنت أبي سلمة عن أم سلمة زوج النبي، أنها قالت: شكوت إلى رسول الله أني أشتكي، فقال: طوفي من وراء الناس وأنت راكبة. قالت: فطفت راكبة بعيري ورسول الله حينئذ يصلي إلى جانب البيت، وهو يقرأ بالطور وكتاب مسطور. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1302) وسويد (552) وإسماعيل بن أبي أويس عند البخاري (1619)، وغيرهم. {cite:muwatta-maruf-1997 p.498}"
