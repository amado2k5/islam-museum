label: { ar: "الموطأ 1186 — ابن عمر: دخل النبي الكعبة مع أسامة وبلال وعثمان بن طلحة فأغلق الباب ومكث فيها", en: "Muwatta 1186", es: "Muwatta 1186", fr: "Muwatta 1186", ur: "موطا 1186", tr: "El-Muvatta 1186 — İbn Ömer: Peygamber, Usame, Bilal ve Osman ibn Talha ile birlikte Kâbe'ye girdi, sonra kapıyı kapattı ve içeride kaldı.", id: "Al-Muwatta 1186 — Ibn Umar: Nabi memasuki Ka'bah bersama Usama, Bilal, dan Utsman bin Talha, kemudian beliau menutup pintu dan tinggal di dalam." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله دخل الكعبة مع أسامة بن زيد وبلال بن رباح وعثمان بن طلحة الحجبي، فأغلقها عليه ومكث فيها. ويقول ابن عمر إنه سأل بلالا حين خرج عما صنع رسول الله، فقال جعل عمودا عن يمينه وعمودين عن يساره وثلاثة أعمدة وراءه، وكان البيت يومئذ على ستة أعمدة، ثم صلى. ويذكر المحقق أن ابن عبد البر ذكر اختلاف رواة الموطأ في عدد الأعمدة. {cite:muwatta-maruf-1997 p.533}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü Usame ibn Zeyd, Bilal ibn Rabah ve Osman ibn Talha el-Hacebi ile birlikte Kâbe'ye girdi ve kapıyı arkasından kapatarak içeride kaldı. İbn Umar, dışarı çıktığında Bilal'e Allah Resulü'nün ne yaptığını sorduğunu, Bilal'in ise sağına bir, soluna iki ve arkasına üç sütun koyduğunu söylediğini aktarıyor. O sırada Kâbe'nin altı sütunu vardı ve sonra namaz kıldı. Araştırmacı, İbn Abd el-Barr'ın Muwatta'nın rivayetçileri arasında sütun sayısı konusunda farklılıklar olduğunu belirttiğini de ekliyor. {cite:muwatta-maruf-1997 s.533}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa Rasulullah SAW memasuki Ka'bah bersama Usama ibn Zayd, Bilal ibn Rabah, dan Uthman ibn Talha al-Hajabi, lalu beliau menutup pintu di belakangnya dan tetap berada di dalam. Ibn Umar berkata bahwa ketika keluar, ia bertanya kepada Bilal apa yang telah dilakukan Rasulullah SAW, dan Bilal menjawab bahwa beliau meletakkan satu pilar di sebelah kanannya, dua di sebelah kirinya, dan tiga di belakangnya. Pada saat itu, Ka'bah memiliki enam pilar, lalu beliau shalat. Peneliti menyebutkan bahwa Ibn Abd al-Barr mencatat perbedaan di antara para perawi Muwatta’ mengenai jumlah pilar. {cite:muwatta-maruf-1997 p.533}"
