label: { ar: "الموطأ 1186 — ابن عمر: دخل النبي الكعبة مع أسامة وبلال وعثمان بن طلحة فأغلق الباب ومكث فيها", en: "Muwatta 1186" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله دخل الكعبة مع أسامة بن زيد وبلال بن رباح وعثمان بن طلحة الحجبي، فأغلقها عليه ومكث فيها. ويقول ابن عمر إنه سأل بلالا حين خرج عما صنع رسول الله، فقال جعل عمودا عن يمينه وعمودين عن يساره وثلاثة أعمدة وراءه، وكان البيت يومئذ على ستة أعمدة، ثم صلى. ويذكر المحقق أن ابن عبد البر ذكر اختلاف رواة الموطأ في عدد الأعمدة. {cite:muwatta-maruf-1997 p.533}"
