label: { ar: "صحيح البخاري 1201 — الأب والأبوة", en: "Sahih al-Bukhari 1201 — the father and fatherhood", ur: "صحیح بخاری 1201 — باپ اور والدیت", es: "Sahih al-Bukhari 1201 — El padre y la paternidad", fr: "Sahih al-Bukhari 1201 — le père et la paternité" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي حَازِمٍ، عَنْ أَبِيهِ، عَنْ سَهْلٍ ـ قَالَ خَرَجَ النَّبِيُّ يُصْلِحُ بَيْنَ بَنِي عَمْرِو بْنِ عَوْفٍ، وَحَانَتِ الصَّلاَةُ، فَجَاءَ بِلاَلٌ أَبَا بَكْرٍما ـ فَقَالَ حُبِسَ النَّبِيُّ فَتَؤُمُّ النَّاسَ قَالَ نَعَمْ إِنْ شِئْتُمْ. فَأَقَامَ بِلاَلٌ الصَّلاَةَ، فَتَقَدَّمَ أَبُو بَكْرٍ ـ فَصَلَّى، فَجَاءَ النَّبِيُّ يَمْشِي فِي الصُّفُوفِ يَشُقُّهَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1201، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1201 (Actions while Praying), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1201، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1201 (Acciones durante la oración), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1201 (Les actes de la prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
