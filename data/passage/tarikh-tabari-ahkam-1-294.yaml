text: "… ندب اليها عباده الذين، بهم يُحْمَى الدين من الغوالام والمخالفين محاتجين و على الامم بكتاب الله الذى استعلم: به ودعاه الأمّة بحق الله الذى اختارهم له٪ أن جاهدوا ! كانت حتجّة الله معهم وان حاربوا حَكّم بالنصر لهم وان بغاهم …"
summary:
  ar: "مقطع من تاريخ الطبري، المجلد المصوَّر 1، ص 294، يرد فيه ذكر المندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Tabari's History, scan volume 1, p. 294, whose wording mentions the recommended (mandub), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ طبری، اسکین جلد 1، ص 294 کا اقتباس جس میں مندوب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de al-Tabari, volume numérisé 1, p. 294, dont le texte mentionne le recommandé (mandub), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de al-Tabari, volumen digitalizado 1, p. 294, cuyo texto menciona lo recomendado (mandub), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Taberi'nin Resimli Tarih adlı eserinin 1. cildinin 294. sayfasından, tavsiye edilen amelleri ve tavsiye etme eylemini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sejarah Al-Tabari, Jilid Bergambar 1, hlm. 294, yang menyebutkan amalan-amalan yang dianjurkan dan amalan menganjurkan itu sendiri; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan-amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
