label: { ar: "جامع الترمذي 632 — ما يجب على المكلف، ما يجب", en: "Jami' al-Tirmidhi 632 — what is binding on the person addressed; what must be done", ur: "جامع ترمذی 632 — جو مکلف پر واجب ہے، جو واجب ہے", fr: "Jami' al-Tirmidhi 632 — ce qui s'impose à la personne responsable ; ce qui doit être fait", es: "Yami' al-Tirmidhi 632 — lo que obliga a la persona responsable; lo que debe hacerse", tr: "Cami' el-Tirmizi 632 — Sorumlu kişi için farz olan nedir, gerekli olan nedir?", id: "Jami' al-Tirmidhi 632 — Apa yang wajib dilakukan oleh orang yang bertanggung jawab, apa yang diwajibkan" }
text: "… إِذَا كَانَ عِنْدَهُ مَالٌ تَجِبُ فِيهِ الزَّكَاةُ فَفِيهِ الزَّكَاةُ وَإِنْ لَمْ يَكُنْ عِنْدَهُ سِوَى الْمَالِ الْمُسْتَفَادِ مَا تَجِبُ فِيهِ الزَّكَاةُ لَمْ يَجِبْ عَلَيْهِ فِي الْمَالِ الْمُسْتَفَادِ زَكَاةٌ حَتَّى يَحُولَ عَلَيْهِ الْحَوْلُ فَإِنِ اسْتَفَادَ مَالاً قَبْلَ أَنْ يَحُولَ عَلَيْهِ الْحَوْلُ فَإِنَّهُ يُزَكِّي الْمَالَ الْمُسْتَفَادَ مَعَ مَالِهِ الَّذِي وَجَبَتْ فِيهِ الزَّكَاةُ. وَبِهِ يَقُولُ سُفْيَانُ الثَّوْرِيُّ وَأَهْلُ الْكُوفَةِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 632، يرد فيه ذكر ما يجب على المكلف، وما يجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 632 (The Book on Zakat), whose wording mentions what is binding on the person addressed, what must be done. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 632، جس کے الفاظ میں جو مکلف پر واجب ہے، جو واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 632, dont le texte mentionne ce qui s'impose à la personne responsable, ce qui doit être fait. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 632, cuyo texto menciona lo que obliga a la persona responsable, lo que debe hacerse. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 632 numaralı hadis, farz olan ve olmayan şeyleri sıralar. Farz olan, görev olan, itaat edilmesi gereken, tavsiye edilen, mekruh olan, haram olan ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle bir araya getirir. Derleyen kişi metinde yer alanları açıklar, ancak buna dayanarak fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 632, menyebutkan apa yang wajib dan apa yang tidak wajib. Penyusun kitab tentang amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
