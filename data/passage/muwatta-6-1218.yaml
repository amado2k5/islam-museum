label: { ar: "الموطأ 1218 — مالك: لا إعادة على من رمى الجمار أو سعى بين الصفا والمروة وهو غير متوضئ، لكن لا يتعمد ذلك", en: "Muwatta 1218", es: "Muwatta 1218", fr: "Muwatta 1218", ur: "موطا 1218", tr: "El-Muvatta 1218 — Malik: Jamarat'a taş atan veya Safa ile Merve arasında Sa'i yapan, bunu kasten yapmadığı sürece, ritüel temizliğinde olmayan bir kimse için ritüeli tekrarlamaya gerek yoktur.", id: "Al-Muwatta 1218 — Malik: Tidak perlu mengulangi ritual bagi orang yang melempar kerikil ke Jamarat atau melakukan Sa'i antara Safa dan Marwa ketika tidak dalam keadaan suci secara ritual, asalkan ia tidak melakukannya dengan sengaja." }
summary:
  ar: "يقول مالك إنه لا يرى على من يرمي الجمار أو يسعى بين الصفا والمروة وهو غير متوضئ إعادة، ولكن لا يتعمد ذلك. {cite:muwatta-maruf-1997 p.544}"
  tr: "Malik, Cemarat'a taş atan veya Safa ile Merve arasında Sa'i yapan birinin, ritüel temizliğine sahip olmadığı halde, bunu kasıtlı olarak yapmadığı sürece, ritüeli tekrarlamasına gerek görmediğini söylüyor. {cite:muwatta-maruf-1997 s.544}"
  id: "Malik mengatakan bahwa ia tidak melihat perlunya seseorang yang melempar kerikil ke Jamarat atau melakukan Sa'i antara Safa dan Marwa saat tidak dalam keadaan suci secara ritual untuk mengulangi ritual tersebut, asalkan ia tidak melakukannya dengan sengaja. {cite:muwatta-maruf-1997 p.544}"
