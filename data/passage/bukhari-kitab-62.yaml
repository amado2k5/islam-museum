  en: "Sahih al-Bukhari, Book 62: Companions of the Prophet"
  ur: "صحیح بخاری، کتاب فضائل اصحاب النبیٰ"
  es: "Sahih al-Bukhari, Libro 62: Compañeros del Profeta"
