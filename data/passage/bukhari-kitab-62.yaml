summary:
  ar: "القسم 62 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضائل أصحاب النبى»، ويضم فيها النصوص من 3649 إلى 3775 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 62 of Sahih al-Bukhari (Companions of the Prophet) in the division of the open hadith dataset the museum took its reports from: reports 3649 to 3775 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 62، عنوان «کتاب فضائل اصحاب النبیٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3649 تا 3775۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 62 de Sahih al-Bukhari (Compañeros del Profeta) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3649 al 3775, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 62 du Sahih al-Bukhari (Les Compagnons du Prophète), dans la base de données ouverte: les hadiths 3649 à 3775 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
