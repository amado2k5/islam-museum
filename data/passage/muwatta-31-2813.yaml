label: { ar: "الموطأ 2813 — عبد الملك بن مروان يرد على ابن عمر في البيعة فيما استطاع", en: "Muwatta 2813", es: "Muwatta 2813", fr: "Muwatta 2813", ur: "موطا 2813", tr: "El-Muvatta 2813 — Abdülmalik ibn Mervan, biat konusunda İbn Ömer'e elinden geldiğince cevap veriyor.", id: "Al-Muwatta 2813 — Abd al-Malik ibn Marwan menjawab Ibn Umar mengenai baiat, sebisa mungkin." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار أن عبد الله بن عمر كتب إلى عبد الملك بن مروان يبايعه، فكتب إليه عبد الملك يقر له بالسمع والطاعة على سنة الله وسنة رسوله فيما استطاع. {cite:muwatta-maruf-1997 p.579}"
  tr: "Malik, Abdullah ibn Dinar'dan rivayetle, Abdullah ibn Umar'ın Abdülmalik ibn Mervan'a biat ettiğini ve Abdülmalik'in de elinden geldiğince Allah'ın kanununa ve Resulünün sünnetine itaat ve teslimiyetini kabul ettiğini bildiren bir mektup yazdığını nakletmiştir. {cite:muwatta-maruf-1997 s.579}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar bahwa Abdullah ibn Umar menulis surat kepada Abd al-Malik ibn Marwan untuk menyatakan kesetiaan kepadanya, dan Abd al-Malik membalas surat tersebut dengan menyatakan ketaatan dan kepatuhannya kepada hukum Allah dan Sunnah Rasul-Nya, sebisa mungkin. {cite:muwatta-maruf-1997 p.579}"
