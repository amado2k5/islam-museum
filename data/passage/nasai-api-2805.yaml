label: { ar: "سنن النسائي 2805 — الحرام", en: "Sunan al-Nasa'i 2805 — the unlawful", ur: "سنن نسائی 2805 — حرام", es: "Sunan al-Nasa'i 2805 — el ilícito" }
text: "… لَحَلَلْتُ وَلَوِ اسْتَقْبَلْتُ مِنْ أَمْرِي مَا اسْتَدْبَرْتُ مَا أَهْدَيْتُ \". قَالَ وَقَدِمَ عَلِيٌّ مِنَ الْيَمَنِ فَقَالَ \" بِمَا أَهْلَلْتَ \". قَالَ بِمَا أَهَلَّ بِهِ النَّبِيُّ. قَالَ \" فَأَهْدِ وَامْكُثْ حَرَامًا كَمَا أَنْتَ \". قَالَ وَقَالَ سُرَاقَةُ بْنُ مَالِكِ بْنِ جُعْشُمٍ يَا رَسُولَ اللَّهِ أَرَأَيْتَ عُمْرَتَنَا هَذِهِ لِعَامِنَا هَذَا أَوْ لِلأَبَدِ قَالَ \" هِيَ لِلأَبَدِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2805، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2805 (The Book of Hajj), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2805، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2805 (El Libro del Hajj), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
