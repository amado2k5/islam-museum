text: "… بن شماس، قال: سمعت جرير بن عبدالحميد يقول: الإيمان قول وعمل والإيمان يزيد وينقص فقيل له: كيف تقول أنت؟ قال: أقول أنا مؤمن إن شاء اللّٰه. - قال إبراهيم: وسئل الفضيل بن عياض وأنا أسمع عن الإيمان، فقال: الإيمان عندنا …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 811، يذكر السؤال عن الإيمان وجوابه، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 811, that mentions the question about faith and its answer, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 811 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra (El Libro de la Fe) de Ibn Batta, volumen 1, pág. 811, que menciona la cuestión de la fe y su respuesta: el aumento y la disminución de la fe. El extracto, leído mediante lectura automática, se cita en un máximo de cuarenta palabras, según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye en su lista."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 1, page 811, abordant la question de la foi et sa réponse, à savoir la croissance et le déclin de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1, s. 811) adlı eserinden, imanla ilgili soru-cevap, imanın artışı ve azalışı konusunu ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 1 Bergambar, hlm. 811, yang membahas pertanyaan dan jawaban mengenai iman, serta peningkatan dan penurunan iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
