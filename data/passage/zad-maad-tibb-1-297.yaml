text: "… ولا جَحدٌ له، إذ تلك الأسبابُ التي تمنَّاها أيضاً مِن القدر، فهو يقول: لو وقفتُ لهذا القدر، لا ندفع به عنِّي ذلك القدرُ، فإن القدر يُدفع بعضُه ببعض، كما يُدفع قَدَرُ المرضِ بالدواءِ، وقدرُ الذنوب بالتوبةِ، وقدرُ العدوِّ بالجهاد، فكلاهما …"
