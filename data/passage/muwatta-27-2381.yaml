summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن عبد الله بن عباس أنه قال: سمعت عمر بن الخطاب يقول: الرجم حق على من زنى من الرجال والنساء إذا أُحصن، إذا قامت البينة، أو كان الحبل أو الاعتراف. {cite:muwatta-maruf-1997 p.384}"
