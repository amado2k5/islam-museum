label: { ar: "الموطأ 2381 — ابن عباس عن عمر: الرجم حق في كتاب الله إذا قامت البينة أو الحبل أو الاعتراف", en: "Muwatta 2381", es: "Muwatta 2381", fr: "Muwatta 2381", ur: "موطا 2381", tr: "İbn Abbas, Ömer'den rivayetle, El-Muvatta 2381'de şöyle demiştir: Eğer delil sunulursa veya hamilelik ya da itiraf tespit edilirse, taşlama cezası Allah'ın Kitabında hüküm sürmektedir.", id: "Al-Muwatta 2381 — Ibnu Abbas berdasarkan riwayat Umar: Hukuman rajam adalah hak dalam Kitab Allah jika ada bukti yang diajukan, atau kehamilan atau pengakuan dosa terbukti." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن عبد الله بن عباس أنه قال: سمعت عمر بن الخطاب يقول: الرجم حق على من زنى من الرجال والنساء إذا أُحصن، إذا قامت البينة، أو كان الحبل أو الاعتراف. {cite:muwatta-maruf-1997 p.384}"
  tr: "Malik, İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe'den, o da Abdullah ibn Abbas'tan rivayet ederek şöyle buyurmuştur: Ömer ibn el-Hattab'ın şöyle dediğini işittim: Evli olan, delil bulunan, hamile olan veya itiraf eden her erkek ve kadın zina yaparsa, taşlanarak cezalandırılır. {cite:muwatta-maruf-1997 s.384}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Ubayd Allah ibn Abdullah ibn Utbah, dari Abdullah ibn Abbas, yang berkata: Aku mendengar Umar ibn al-Khattab berkata: Hukuman rajam adalah hak bagi setiap laki-laki atau perempuan yang berzina jika mereka sudah menikah, jika ada bukti, atau kehamilan, atau pengakuan. {kutipan:muwatta-maruf-1997 hlm. 384}"
