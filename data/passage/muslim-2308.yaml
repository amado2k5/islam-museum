label: { ar: "مسلم 2308 — أجود الناس بالخير من الريح المُرسلة", en: "Muslim 2308 — More generous with good than the blowing wind", es: "Musulmán 2308 — Más generoso con el bien que el viento que sopla", fr: "Muslim 2308 — Plus généreux en bienfaits que le vent qui souffle", ur: "مسلم 2308 - چلنے والی ہوا سے زیادہ نیکی کرنے والا", tr: "Müslim 2308 — İnsanların en cömert olanı esen bir rüzgâr gibidir.", id: "Muslim 2308 — Orang yang paling dermawan itu seperti angin yang berhembus" }
text: "قال ابن عباس: كان رسول الله أجود الناس بالخير، وكان أجود ما يكون في شهر رمضان؛ إن جبريل كان يلقاه في كل سنة في رمضان حتى ينسلخ، فيعرض عليه رسول الله القرآن، فإذا لقيه جبريل كان رسول الله أجود بالخير من الريح المُرسلة"
summary:
  ar: "رواية ابن عباس في كتاب الفضائل من صحيح مسلم؛ جواده بالخير يشتد في رمضان مع مدارسة جبريل له القرآن — صورة المدارسة الرمضانية الأولى."
  tr: "Sahih Müslim'deki Faziletler Kitabı'nda İbn Abbas'ın rivayetine göre: Ramazan ayında onun iyilik yapma cömertliği artar, Cebrail de onunla birlikte Kur'an öğrenimi görür - bu, Ramazan öğreniminin ilk imgesidir."
  id: "Riwayat Ibnu Abbas dalam Kitab Keutamaan dari Sahih Muslim: Kedermawanannya dalam beramal meningkat di bulan Ramadan, bersamaan dengan Jibril yang mempelajari Al-Qur'an bersamanya — gambaran pertama dari belajar di bulan Ramadan."
