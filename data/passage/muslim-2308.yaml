label: { ar: "مسلم 2308 — أجود الناس بالخير من الريح المُرسلة", en: "Muslim 2308 — More generous with good than the blowing wind" }
text: "قال ابن عباس: كان رسول الله أجود الناس بالخير، وكان أجود ما يكون في شهر رمضان؛ إن جبريل كان يلقاه في كل سنة في رمضان حتى ينسلخ، فيعرض عليه رسول الله القرآن، فإذا لقيه جبريل كان رسول الله أجود بالخير من الريح المُرسلة"
summary:
  ar: "رواية ابن عباس في كتاب الفضائل من صحيح مسلم؛ جواده بالخير يشتد في رمضان مع مدارسة جبريل له القرآن — صورة المدارسة الرمضانية الأولى."
