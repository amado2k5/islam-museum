label: { ar: "الموطأ 144 — مالك فيمن احتلم في سفر ولا يجد إلا قدر الوضوء", en: "Muwatta 144" }
summary:
  ar: "قول لمالك في باب تيمم الجنب: من احتلم في سفر ولا يقدر على الماء إلا قدر الوضوء وهو لا يعطش حتى يأتي الماء، يغسل بذلك الماء فرجه وما أصابه من الأذى ثم يتيمم صعيداً طيباً كما أمره الله. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.102}"
