label: { ar: "الموطأ 144 — مالك فيمن احتلم في سفر ولا يجد إلا قدر الوضوء", en: "Muwatta 144", es: "Muwatta 144", fr: "Muwatta 144", ur: "موطا 144", tr: "Al-Muwatta 144 — Malik, yolculuk halindeyken ıslak rüya gören ve sadece abdest almak için yeterli suyu olan kimse hakkında", id: "Al-Muwatta 144 — Malik tentang orang yang mengalami mimpi basah saat bepergian dan hanya memiliki cukup air untuk berwudhu" }
summary:
  ar: "قول لمالك في باب تيمم الجنب: من احتلم في سفر ولا يقدر على الماء إلا قدر الوضوء وهو لا يعطش حتى يأتي الماء، يغسل بذلك الماء فرجه وما أصابه من الأذى ثم يتيمم صعيداً طيباً كما أمره الله. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.102}"
  tr: "Malik, cünüp haldeki bir kişinin ritüel temizliği hakkındaki bölümde şöyle buyurmuştur: Eğer bir kimse yolculuk sırasında ıslak rüya görür ve ancak abdest almak için yeterli su bulabilirse ve suya ulaşana kadar susamamışsa, cinsel organlarını ve her türlü kirliliği o suyla yıkamalı, sonra da Allah'ın emrettiği gibi temiz toprakla teyemmüm yapmalıdır. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.102}"
  id: "Malik berkata dalam surah tentang penyucian ritual seseorang dalam keadaan junub (najis besar): Jika seseorang mengalami mimpi basah saat bepergian dan hanya mendapatkan air secukupnya untuk berwudu, dan ia tidak haus sampai mencapai air tersebut, maka ia harus membasuh kemaluannya dan najis lainnya dengan air tersebut, kemudian berwudu kering dengan tanah yang bersih, sebagaimana yang diperintahkan Allah. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.102}"
