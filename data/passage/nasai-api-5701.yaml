text: "… النَّيْسَابُورِيَّ - قَالَ حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، قَالَ أَنْبَأَنَا مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ \" كُلُّ مُسْكِرٍ حَرَامٌ وَكُلُّ مُسْكِرٍ خَمْرٌ \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ وَهَؤُلاَءِ أَهْلُ الثَّبْتِ وَالْعَدَالَةِ مَشْهُورُونَ بِصِحَّةِ النَّقْلِ وَعَبْدِ الْمَلِكِ لاَ يَقُومُ مَقَامَ وَاحِدٍ مِنْهُمْ وَلَوْ عَاضَدَهُ مِنْ أَشْكَالِهِ جَمَاعَةٌ وَبِاللَّهِ التَّوْفِيقُ."
summary:
  ar: "حديث في سنن النسائي، رقم 5701، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5701 (The Book of Drinks), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5701، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
