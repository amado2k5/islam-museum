label: { ar: "الموطأ 2690 — زيد بن أسلم عن جدته: لا تحقرن إحداكن لجارتها ولو كراع شاة محرقا", en: "Muwatta 2690", es: "Muwatta 2690", fr: "Muwatta 2690", ur: "موطا 2690", tr: "El-Muvatta 2690 — Zeyd ibn Aslam, ninesinden rivayetle: “Hiçbiriniz komşunuzun malına, yanmış bir koyun bacağı bile olsa, değersiz bir şey söylemesin.”", id: "Al-Muwatta 2690 — Zayd ibn Aslam, berdasarkan riwayat neneknya: “Janganlah seorang pun di antara kalian meremehkan apa yang menjadi milik tetangganya, sekalipun itu adalah kaki domba yang terbakar.”" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عمرو بن سعد بن معاذ عن جدته أن رسول الله قال: يا نساء المؤمنات، لا تحقرن إحداكن لجارتها ولو كراع شاة محرقا. {cite:muwatta-maruf-1997 p.520}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Amr ibn Sa'd ibn Mu'adh'tan, o da büyükannesinden rivayetle, Allah Resulü'nün şöyle buyurduğunu naklediyor: \"Ey mümin kadınlar, hiçbiriniz komşusunun malına, hatta yanmış bir koyun bacağına bile, kötü davranmasın.\" {cite:muwatta-maruf-1997 s.520}"
  id: "Malik meriwayatkan dari Zaid bin Aslam, dari Amr bin Sa'd bin Mu'adh, dari neneknya, bahwa Rasulullah SAW bersabda: \"Wahai wanita-wanita mukmin, janganlah seorang pun di antara kalian meremehkan milik tetangganya, meskipun itu hanya kaki domba yang terbakar.\" {cite:muwatta-maruf-1997 p.520}"
