text: "… المنزلة على المرسلين ترد مسألة الفرق بين النبي والرسول، وقد سبق الكلام عليها عند قول المؤلف: وإن محمدًا عبده المصطفى، ونبيه المجتبى، ورسوله المرتضى. والأصل الثالث من أصول الإيمان في عبارة المؤلف دَ اللّهُ هو الإيمان بالكتب، فإنه قال: ونؤمن …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 204، يذكر أركان الإيمان، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 204, that mentions the pillars of faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 204 کا اقتباس جس میں ارکانِ ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 1, pág. 204, que menciona los pilares de la fe, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 1, p. 204), mentionnant les piliers de la foi, l'un des articles de foi. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Tevrat'ına dair tefsirinin 1. cildinin 204. sayfasından, imanın esaslarını ve imanın esaslarından birini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-Izz tentang Akidah al-Tahawi, Jilid 1, halaman 204, yang menyebutkan rukun-rukun iman dan salah satu rukun iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun-rukun Islam, rukun-rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
