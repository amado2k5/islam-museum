text: "باب الإيمان بالقدر كتاب الإيمان بأربع: يشهد أن لا إله إلا اللّه وأني رسول اللّٰه بعثني بالحق، ويؤمن بالموت، والبعث بعد الموت، ويؤمن بالقدر. رواه الترمذي، وابن ماجه. - وعن ابن عباس، قال: قال رسول اللّٰه ول: صنفان من أمتي …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 142، يذكر الإيمان بالقدر، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 142, that mentions belief in the decree, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 142 کا اقتباس جس میں تقدیر پر ایمان، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 1, pág. 142, que menciona la creencia en el decreto y en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 1, page 142, mentionnant la croyance au décret et la croyance en la résurrection; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 142'den bir alıntı, kader inancına ve dirilişe olan inanca değinmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 142, menyebutkan kepercayaan pada takdir dan kepercayaan pada kebangkitan; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
