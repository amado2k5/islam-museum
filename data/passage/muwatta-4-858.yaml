label: { ar: "الموطأ 858 — مالك: أهل العلم ينهون عن صيام اليوم الذي يشك فيه من شعبان إذا نوي به صيام رمضان؛ ومن صامه ثم ثبت أنه من رمضان فعليه قضاؤه، ولا بأس بصيامه تطوعاً", en: "Muwatta 858" }
summary:
  ar: "يروي مالك أنه سمع أهل العلم ينهون أن يُصام اليوم الذي يُشك فيه من شعبان إذا نُوي به صيام رمضان. ويرون أن من صامه على غير رؤية ثم جاء الثبت أنه من رمضان فعليه قضاؤه، ولا يرون بصيامه تطوعاً بأساً. ويقول مالك: وهذا الأمر عندنا، والذي أدركت عليه أهل العلم ببلدنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (836). {cite:muwatta-maruf-1997 p.414} {cite:muwatta-maruf-1997 p.415}"
