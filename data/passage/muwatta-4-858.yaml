label: { ar: "الموطأ 858 — مالك: أهل العلم ينهون عن صيام اليوم الذي يشك فيه من شعبان إذا نوي به صيام رمضان؛ ومن صامه ثم ثبت أنه من رمضان فعليه قضاؤه، ولا بأس بصيامه تطوعاً", en: "Muwatta 858", es: "Muwatta 858", fr: "Muwatta 858", ur: "موطا 858", tr: "El-Muvatta 858 — Malik: Alimler, Ramazan ayında oruç tutmaya niyetli olan kimsenin Şaban ayında şüphe gününde oruç tutmasını haram kılarlar; kim o günde oruç tutar ve sonradan bunun Ramazan ayından olduğu ispatlanırsa, kaza orucunu tutmalıdır; fakat gönüllü olarak oruç tutmasında bir sakınca yoktur.", id: "Al-Muwatta 858 — Malik: Para ulama melarang berpuasa pada hari keraguan mengenai bulan Sya'ban jika seseorang bermaksud berpuasa Ramadhan; dan siapa pun yang berpuasa pada hari itu dan kemudian terbukti berpuasa Ramadhan, wajib menggantinya, tetapi tidak ada salahnya berpuasa secara sukarela." }
summary:
  ar: "يروي مالك أنه سمع أهل العلم ينهون أن يُصام اليوم الذي يُشك فيه من شعبان إذا نُوي به صيام رمضان. ويرون أن من صامه على غير رؤية ثم جاء الثبت أنه من رمضان فعليه قضاؤه، ولا يرون بصيامه تطوعاً بأساً. ويقول مالك: وهذا الأمر عندنا، والذي أدركت عليه أهل العلم ببلدنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (836). {cite:muwatta-maruf-1997 p.414} {cite:muwatta-maruf-1997 p.415}"
  tr: "Malik, Şaban ayının başlangıcı konusunda şüphe duyulan günde, niyet Ramazan orucu tutmaksa oruç tutmanın âlimler tarafından yasaklandığını duyduğunu rivayet eder. Onlar, yeni ayı görmeden o gün oruç tutan ve daha sonra Ramazan olduğu kesinleşen kimsenin orucunu kaza etmesi gerektiğini savunurlar. Ancak, gönüllü olarak oruç tutmanın bir sakıncası olmadığını düşünürler. Malik şöyle der: \"Bu bizim aramızdaki uygulamadır ve ülkemiz âlimlerinin de böyle yaptığını gördüm.\" Editör, bunu Malik'ten Ebu Mus'ab'ın (836) rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.414} {cite:muwatta-maruf-1997 s.415}"
  id: "Malik meriwayatkan bahwa ia mendengar para ulama melarang berpuasa pada hari keraguan mengenai awal bulan Sya'ban jika niatnya adalah untuk berpuasa Ramadhan. Mereka berpendapat bahwa siapa pun yang berpuasa pada hari itu tanpa melihat bulan sabit, dan kemudian dipastikan bahwa itu adalah bulan Ramadhan, harus mengganti puasanya. Namun, mereka tidak melihat adanya bahaya dalam berpuasa secara sukarela. Malik berkata: \"Ini adalah kebiasaan di antara kami, dan inilah yang saya temukan dilakukan oleh para ulama di negeri kami.\" Editor menyebutkan bahwa Abu Mus'ab (836) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.414} {cite:muwatta-maruf-1997 p.415}"
