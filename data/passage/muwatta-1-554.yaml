label: { ar: "الموطأ 554 — مالك: لا يقرأ أحد سجدة بعد الصبح ولا بعد العصر لأن السجدة من الصلاة", en: "Muwatta 554", es: "Muwatta 554", fr: "Muwatta 554", ur: "موطا 554", tr: "Al-Muwatta 554 — Malik: Hiç kimse sabah namazından sonra veya ikindi namazından sonra secde ayeti okumamalıdır, çünkü secde ayeti namazın bir parçasıdır.", id: "Al-Muwatta 554 — Malik: Tidak seorang pun boleh membaca ayat sujud setelah shalat subuh atau setelah shalat ashar karena ayat sujud merupakan bagian dari shalat." }
summary:
  ar: "قول لمالك: لا ينبغي لأحد أن يقرأ من سجود القرآن شيئاً بعد صلاة الصبح ولا بعد صلاة العصر، ويعلل ذلك بأن النبي نهى عن الصلاة بعد الصبح حتى تطلع الشمس وبعد العصر حتى تغرب، والسجدة من الصلاة، فلا ينبغي أن يقرأ أحد سجدة في تينك الساعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.284}"
  id: "Malik berkata: “Tidak seorang pun boleh membaca ayat-ayat sujud dari Al-Quran setelah shalat Subuh atau setelah shalat Ashar.” Beliau menjelaskan hal ini dengan mengatakan bahwa Nabi (shalawat dan salam kepadanya) melarang shalat setelah Subuh hingga matahari terbit dan setelah Ashar hingga matahari terbenam, dan karena sujud adalah bagian dari shalat, maka tidak seorang pun boleh membaca ayat sujud selama kedua waktu tersebut. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus’ab dan Suwaid. {cite:muwatta-maruf-1997 p.284}"
