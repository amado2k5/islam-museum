label: { ar: "الموطأ 554 — مالك: لا يقرأ أحد سجدة بعد الصبح ولا بعد العصر لأن السجدة من الصلاة", en: "Muwatta 554" }
summary:
  ar: "قول لمالك: لا ينبغي لأحد أن يقرأ من سجود القرآن شيئاً بعد صلاة الصبح ولا بعد صلاة العصر، ويعلل ذلك بأن النبي نهى عن الصلاة بعد الصبح حتى تطلع الشمس وبعد العصر حتى تغرب، والسجدة من الصلاة، فلا ينبغي أن يقرأ أحد سجدة في تينك الساعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.284}"
