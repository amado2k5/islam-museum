label: { ar: "الموطأ 282 — مالك: من رعف والإمام يخطب فلم يرجع صلى أربعاً", en: "Muwatta 282", es: "Muwatta 282", fr: "Muwatta 282", ur: "موطا 282", tr: "Al-Muwatta 282 — Malik: İmam hutbe okurken burnu kanayan ve geri dönmeyen kimse dört rekat namaz kılmalıdır." }
summary:
  ar: "قول لمالك في باب ما جاء فيمن رعف يوم الجمعة: من رعف يوم الجمعة والإمام يخطب فخرج فلم يرجع حتى فرغ الإمام من صلاته، فإنه يصلي أربعاً. ويفسر المحقق الرعاف بخروج الدم من الأنف، ويذكر أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.162}"
  tr: "Malik, Cuma günü burun kanaması geçiren kimse hakkında rivayet edilenler bölümünde şöyle demiştir: \"Eğer bir kimse Cuma günü imam hutbe okurken burun kanaması geçirirse ve imam namazını bitirinceye kadar geri dönmezse, dört rekat namaz kılmalıdır.\" Araştırmacı, burun kanamasının burundan kan akması olduğunu açıklıyor ve bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.162}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan mengenai orang yang mimisan pada hari Jumat: Jika seseorang mimisan pada hari Jumat ketika imam sedang menyampaikan khutbah, dan dia pergi dan tidak kembali sampai imam selesai shalat, maka dia harus shalat empat rakaat. Peneliti menjelaskan bahwa mimisan adalah keluarnya darah dari hidung, dan dia menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.162}"
