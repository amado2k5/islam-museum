label: { ar: "الموطأ 282 — مالك: من رعف والإمام يخطب فلم يرجع صلى أربعاً", en: "Muwatta 282" }
summary:
  ar: "قول لمالك في باب ما جاء فيمن رعف يوم الجمعة: من رعف يوم الجمعة والإمام يخطب فخرج فلم يرجع حتى فرغ الإمام من صلاته، فإنه يصلي أربعاً. ويفسر المحقق الرعاف بخروج الدم من الأنف، ويذكر أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.162}"
