text: "… وحسنه وتقدم لفظه.. والبيهقى باسناد حسن ايضا واللفظ له وتقدم معى غريبه في الكبر الترغيب في اماطة الاذى عن الطريق وغير ذلك مما يذكر - عن ابى هريرة قال قال رسول الله موتلي و الايمان بضع وستون اوسبعون شعبة أدناها …"
