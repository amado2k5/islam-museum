text: "لخطاب فقال عمر: قال رسول الله ولف: ما أحرز - الحديث - قال: نكتب له كتابا فيه شهادة عبد الرحمن بن عوف، وزيد بن ثابت، ورجل آخر». والحديث دليل على أن الولاء لا يورث وفيه خلاف، وتظهر فائدة الخلاف فيما"
