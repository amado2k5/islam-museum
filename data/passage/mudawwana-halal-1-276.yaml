text: "… الحرم فأخذه فى الحرم كان عليه الجزاء قال وأرى من أزسبل كلبَه فى الحرم على ذئب فأخذ صيداً فسبيله سبيل من غرر بقرب الحرم فعليه الجزاء قاتِ لا بن القاسم أرأيت لو أن محرما أمسك ضيداً فقتله حرام أو حلال …"
