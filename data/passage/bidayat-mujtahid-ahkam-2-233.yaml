text: "… وهو الوجوب على ما هو عليه عند الجمهور قال : يجبر، ومن لحظ هذا المعنى الذي قلناه من كون الطلاق واقعاً قال : هذا الأمر هو على الندب. تقدم تخريج الحديث، وهو متفق عليه. إذا طلقها طلاقاً بدعياً، فيستحب أن …"
