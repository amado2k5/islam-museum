summary:
  ar: "القسم 0 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المقدمة»، ويضم فيها النصوص من 1 إلى 266 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 0 of Sunan Ibn Majah (The Book of the Sunnah) in the division of the open hadith dataset the museum took its reports from: reports 1 to 266 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 0، عنوان «کتاب المقدمۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1 تا 266۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El Libro 0 de Sunan Ibn Majah (El Libro de la Sunnah) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1 al 266, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 0 du Sunan Ibn Majah (Le Livre de la Sunna) fait partie de la base de données de hadiths ouverte d'où proviennent les récits du musée: les récits 1 à 266 de cette base de données sont classés dans ce livre. Le musée conserve ses archives de ces récits sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan İbn Majah'ın 0. bölümü \"Giriş Kitabı\" başlığını taşımakta olup, 1'den 266'ya kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 0 dari Sunan Ibn Majah, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pendahuluan\" dan berisi teks 1 hingga 266, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
