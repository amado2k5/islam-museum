label: { ar: "الموطأ 2781 — أبو سعيد الخدري: خير مال المسلم غنم يفر بها بدينه من الفتن", en: "Muwatta 2781" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن عبد الله بن عبد الرحمن بن أبي صعصعة، عن أبيه، عن أبي سعيد الخدري أن النبي قال: يوشك أن يكون خير مال المسلم غنم يتبع بها شعب الجبال ومواقع القطر، يفر بدينه من الفتن. ويذكر المحقق اختلاف الروايات في «شعب» و«شعف»، ويرى أن تغليط ابن عبد البر لرواية «شعب» فيه نظر، لأن المعنى نفسه يرد في حديث أبي هريرة. {cite:muwatta-maruf-1997 p.563}"
