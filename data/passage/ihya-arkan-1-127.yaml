text: "… : اللعن للشخص المعين وهذا فيه خطر كقولك : زيد لعنه اللّه، وهو كافر أو فاسق أو مبتدع، والتفصيل الآفة الثامنة : اللهن حديث المؤمن ليس بلمان تقدم حديث ابن مسعود ليس المؤمن بالطعان ولا المان... الحديث قبل هذا بأحد …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 1، ص 127، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
