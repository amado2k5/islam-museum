text: "… : اللعن للشخص المعين وهذا فيه خطر كقولك : زيد لعنه اللّه، وهو كافر أو فاسق أو مبتدع، والتفصيل الآفة الثامنة : اللهن حديث المؤمن ليس بلمان تقدم حديث ابن مسعود ليس المؤمن بالطعان ولا المان... الحديث قبل هذا بأحد …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 1، ص 127، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 1, p. 127, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 1، ص 127 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 1, pág. 127, que menciona una descripción del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 1, p. 127), contenant une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 1. cildinin 127. sayfasından, mümini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Jilid 1, halaman 127, yang menjelaskan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
