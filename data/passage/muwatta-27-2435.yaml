label: { ar: "الموطأ 2435 — أبو بكر بن محمد بن عمرو بن حزم: النبطي الذي سرق خواتيم حديد", en: "Muwatta 2435", es: "Muwatta 2435", fr: "Muwatta 2435", ur: "موطا 2435", tr: "Al-Muwatta 2435 - Ebu Bekir ibn Muhammed ibn Amr ibn Hazm: Demir yüzükleri çalan Nebati", id: "Al-Muwatta 2435 — Abu Bakr ibn Muhammad ibn Amr ibn Hazm: Orang Nabataean yang mencuri cincin besi" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا بكر بن محمد بن عمرو بن حزم أخذ نبطيا قد سرق خواتيم من حديد، فحبسه ليقطع يده. فأرسلت إليه عمرة بنت عبد الرحمن مولاة لها تقول له: إن عمرة تقول لك: لا قطع إلا في ربع دينار فصاعدا. فأرسل النبطي. {cite:muwatta-maruf-1997 p.405}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ebu Bekir ibn Muhammed ibn Amr ibn Hazm'ın demir yüzük çalan bir Nabatî'yi yakalayıp elini kesmek üzere hapse attığını anlatır. Umre bint Abdülrahman ona bir hizmetçi göndererek şöyle dedi: Umre sana diyor ki: Çeyrek dinar veya daha fazlası için el kesmekten başka bir şey olmaz. Bunun üzerine Nabatî'yi serbest bıraktı. {cite:muwatta-maruf-1997 s.405}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Abu Bakr ibn Muhammad ibn 'Amr ibn Hazm menangkap seorang Nabatea yang telah mencuri cincin besi, dan memenjarakannya untuk memotong tangannya. 'Umrah bint 'Abd al-Rahman mengirim seorang pelayan wanita kepadanya, seraya berkata: 'Umrah berkata kepadamu: tidak ada pemotongan tangan kecuali dengan imbalan seperempat dinar atau lebih. Maka ia membebaskan orang Nabatea itu. {cite:muwatta-maruf-1997 p.405}"
