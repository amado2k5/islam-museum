label: { ar: "الموطأ 2435 — أبو بكر بن محمد بن عمرو بن حزم: النبطي الذي سرق خواتيم حديد", en: "Muwatta 2435" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا بكر بن محمد بن عمرو بن حزم أخذ نبطيا قد سرق خواتيم من حديد، فحبسه ليقطع يده. فأرسلت إليه عمرة بنت عبد الرحمن مولاة لها تقول له: إن عمرة تقول لك: لا قطع إلا في ربع دينار فصاعدا. فأرسل النبطي. {cite:muwatta-maruf-1997 p.405}"
