label: { ar: "الموطأ 1836 — مالك: من اشترى رطبا من صاحب الحائط، فأسلفه دينارا، ثم ذهب رطب الحائط، يحاسب صاحب الحائط، ثم يأخذ ما بقي له من دينار", en: "Muwatta 1836", es: "Muwatta 1836", fr: "Muwatta 1836", ur: "موطا 1836", tr: "El-Muvatta 1836 — Malik: Kim bir bahçıvandan taze hurma alır ve ona bir dinar borç verirse, hurmalar bitince bahçıvanla hesaplaşır, sonra da dinarının kalanını geri alır.", id: "Al-Muwatta 1836 — Malik: Barang siapa membeli kurma segar dari pemilik kebun, dan meminjamkan kepadanya satu dinar, kemudian kurma segar dari kebun itu habis, maka ia harus menyelesaikan perhitungan dengan pemilik kebun tersebut, lalu mengambil kembali sisa dinarnya." }
summary:
  ar: "سئل مالك عن الرجل يشتري الرطب من صاحب الحائط، فيسلفه الدينار، ماذا له إذا ذهب رطب ذلك الحائط؟ قال مالك: يحاسب صاحب الحائط، ثم يأخذ منه ما بقي له من دينار. إن كان أخذ بثلثي دينار رطبا، أخذ ثلث الدينار الذي بقي له. وإن كان أخذ ثلاثة أرباع دينار رطبا أخذ الربع الذي بقي له، أو يتراضيان بينهما. {cite:muwatta-maruf-1997 p.154}"
  tr: "Malik'e, bir hurma bahçesi sahibinden taze hurma satın alan ve ona bir dinar borç veren bir adam hakkında soru soruldu. Bahçenin hurmaları bittiğinde adamın hakkı nedir? Malik şöyle dedi: Bahçe sahibiyle hesaplaşmalı ve sonra dinarın kalanını geri almalıdır. Eğer dinarın üçte ikisi değerinde taze hurma satın aldıysa, kalan dinarın üçte birini geri alır. Eğer dinarın dörtte üçü değerinde taze hurma satın aldıysa, kalan dörtte birini geri alır veya aralarında bir anlaşmaya varabilirler. {cite:muwatta-maruf-1997 s.154}"
  id: "Malik ditanya tentang seorang pria yang membeli kurma segar dari pemilik kebun dan meminjamkan satu dinar kepadanya. Apa haknya jika kurma di kebun itu habis? Malik berkata: Ia harus menyelesaikan perhitungan dengan pemilik kebun dan kemudian mengambil kembali sisa dinar tersebut. Jika ia membeli kurma segar senilai dua pertiga dinar, ia mengambil kembali sepertiga dari sisa dinar tersebut. Jika ia membeli kurma segar senilai tiga perempat dinar, ia mengambil kembali seperempat sisanya, atau mereka dapat menyepakati penyelesaian di antara mereka. {cite:muwatta-maruf-1997 p.154}"
