label: { ar: "الموطأ 1836 — مالك: من اشترى رطبا من صاحب الحائط، فأسلفه دينارا، ثم ذهب رطب الحائط، يحاسب صاحب الحائط، ثم يأخذ ما بقي له من دينار", en: "Muwatta 1836" }
summary:
  ar: "سئل مالك عن الرجل يشتري الرطب من صاحب الحائط، فيسلفه الدينار، ماذا له إذا ذهب رطب ذلك الحائط؟ قال مالك: يحاسب صاحب الحائط، ثم يأخذ منه ما بقي له من دينار. إن كان أخذ بثلثي دينار رطبا، أخذ ثلث الدينار الذي بقي له. وإن كان أخذ ثلاثة أرباع دينار رطبا أخذ الربع الذي بقي له، أو يتراضيان بينهما. {cite:muwatta-maruf-1997 p.154}"
