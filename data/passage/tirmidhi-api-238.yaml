text: "… عِنْدَ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَمَنْ بَعْدَهُمْ. وَبِهِ يَقُولُ سُفْيَانُ الثَّوْرِيُّ وَابْنُ الْمُبَارَكِ وَالشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ أَنَّ تَحْرِيمَ الصَّلاَةِ التَّكْبِيرُ وَلاَ يَكُونُ الرَّجُلُ دَاخِلاً فِي الصَّلاَةِ إِلاَّ بِالتَّكْبِيرِ. قَالَ أَبُو عِيسَى وَسَمِعْتُ أَبَا بَكْرٍ مُحَمَّدَ بْنَ أَبَانَ مُسْتَمْلِيَ وَكِيعٍ يَقُولُ سَمِعْتُ عَبْدَ الرَّحْمَنِ بْنَ مَهْدِيٍّ يَقُولُ لَوِ افْتَتَحَ الرَّجُلُ الصَّلاَةَ بِسَبْعِينَ اسْمًا مِنْ أَسْمَاءِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 238، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 238 (The Book on Salat (Prayer)), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 238، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
