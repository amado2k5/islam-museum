label: { ar: "الموطأ 1760 — مالك: ليس على أم الولد إحداد إذا هلك عنها سيدها، ولا على أمة يموت عنها سيدها، وإنما الإحداد على ذوات الأزواج", en: "Muwatta 1760", es: "Muwatta 1760", fr: "Muwatta 1760", ur: "موطا 1760", tr: "El-Muvatta 1760 — Malik: Efendisi öldüğünde ona çocuk doğurmuş bir cariye için yas süresi yoktur; efendisi ölen bir cariye için de yas süresi yoktur. Yas sadece evli kadınlar için geçerlidir.", id: "Al-Muwatta 1760 — Malik: Tidak ada masa berkabung bagi seorang budak perempuan yang telah melahirkan anak bagi tuannya jika tuannya meninggal, demikian pula bagi seorang budak perempuan yang tuannya meninggal. Masa berkabung hanya diperuntukkan bagi perempuan yang sudah menikah." }
summary:
  ar: "قال مالك: ليس على أم الولد إحداد إذا هلك عنها سيدها، ولا على أمة يموت عنها سيدها إحداد، وإنما الإحداد على ذوات الأزواج. {cite:muwatta-maruf-1997 p.117}"
  tr: "Malik şöyle dedi: Efendisi ölen bir köle kadın için yas tutma süresi yoktur, efendisi ölen bir kadın köle için de yoktur. Yas tutma sadece evli kadınlar içindir. {cite:muwatta-maruf-1997 s.117}"
  id: "Malik berkata: Tidak ada masa berkabung bagi seorang budak perempuan yang tuannya meninggal, demikian pula bagi seorang budak perempuan yang tuannya meninggal. Masa berkabung hanya diperuntukkan bagi perempuan yang sudah menikah. {cite:muwatta-maruf-1997 p.117}"
