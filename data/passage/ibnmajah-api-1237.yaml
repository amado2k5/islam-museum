label: { ar: "سنن ابن ماجه 1237 — الشكوى من العلة، عيادة المريض", en: "Sunan Ibn Majah 1237 — a complaint of an ailment; visiting the sick", ur: "سنن ابن ماجہ 1237 — بیماری کی شکایت، بیمار کی عیادت", es: "Sunan Ibn Majah 1237 — quejarse de una dolencia; visitar a los enfermos", fr: "Sunan Ibn Majah 1237 — une plainte concernant un mal; la visite aux malades", tr: "Sunan İbn Majah 1237 — Hastalıktan şikayet etmek, hasta ziyaretinde bulunmak", id: "Sunan Ibn Majah 1237 — Mengeluh tentang penyakit, mengunjungi orang sakit" }
text: "… بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدَةُ بْنُ سُلَيْمَانَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتِ اشْتَكَى رَسُولُ اللَّهِ ـ فَدَخَلَ عَلَيْهِ نَاسٌ مِنْ أَصْحَابِهِ يَعُودُونَهُ فَصَلَّى النَّبِيُّ ـ جَالِسًا فَصَلَّوْا بِصَلاَتِهِ قِيَامًا فَأَشَارَ إِلَيْهِمْ أَنِ اجْلِسُوا فَلَمَّا انْصَرَفَ قَالَ \" إِنَّمَا جُعِلَ الإِمَامُ لِيُؤْتَمَّ بِهِ. فَإِذَا رَكَعَ فَارْكَعُوا. وَإِذَا رَفَعَ فَارْفَعُوا. وَإِذَا صَلَّى جَالِسًا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1237، يذكر الشكوى من العلة، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1237 (Establishing the Prayer and the Sunnah Regarding Them), that mentions a complaint of an ailment, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1237، جس میں بیماری کی شکایت، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1237 (Establecimiento de la oración y la Sunnah al respecto), menciona una queja sobre una dolencia y la visita a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 1237 (L'établissement de la prière et la Sunna à ce sujet), mentionne une plainte concernant une maladie et la visite aux malades. Le dictionnaire médical le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 1237 numaralı hadiste, hastalıktan şikayet etmek ve hasta ziyaretinde bulunmaktan bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1237, menyebutkan tentang mengeluh sakit dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
