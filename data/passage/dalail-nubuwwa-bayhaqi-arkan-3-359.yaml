text: "… فأكرموه، فقال لي رسول اللّٰه وَيف : يا جرير ! أدعوك إلى شهادة أن لا إله إلا الله وأني رسول اللّه، وأن تؤمن بالله، واليوم الآخر، والقدرِ خيره وَشَرِّهٍ، وتصلي الصلاة المكتوبة، وتؤدي الزكاة المفروضة، قال: فمعلت فكان بعد ذلك …"
