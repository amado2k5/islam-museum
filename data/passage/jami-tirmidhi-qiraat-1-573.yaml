text: "… مِنْ ذَهَبٍ. قَالَ أَبُو عِيسَى : هَذَا حَدِيثٌ غَرِيبٌ حَسَنٌ مِنْ حَدِيثِ أَبِي سَعِيدٍ. المعجم - باب ما جاء في صفة الجنة ونعيمها التحفة - حَدَّثَنَا أَبُو كُرَيْبٍ: حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلِ عَنْ حَمْزَةَ الزَّيَّاتِ، عَنْ زِيَادٍ الطَّائِيِّ، عَنْ أَبِي …"
summary:
