summary:
  ar: "قال: فأما الرجل الذي يعطي أرضه البيضاء بالثلث أو الربع مما يخرج منها، فذلك مما يدخله الغرر، لأن الزرع يقل مرة ويكثر مرة، وربما هلك رأسا، فيكون صاحب الأرض قد ترك كراء معلوما يصلح له أن يكري أرضه به، وأخذ أمرا غررا، لا يدري أيتم أم لا. فهذا مكروه. ولا ينبغي لرجل أن يؤاجر نفسه ولا أرضه ولا سفينته إلا بشيء معلوم لا يزول إلى غيره. {cite:muwatta-maruf-1997 p.244}"
