label: { ar: "الموطأ 2063 — مالك: فأما الرجل الذي يعطي أرضه البيضاء بالثلث أو الربع مما يخرج منها، فذلك مما يدخله الغرر، لأن الزرع يقل مرة ويكثر مرة، وربما هلك رأسا", en: "Muwatta 2063", es: "Muwatta 2063", fr: "Muwatta 2063", ur: "موطا 2063", tr: "El-Muvatta 2063 — Malik: Verimsiz toprağını veriminin üçte biri veya dörtte biri karşılığında veren kişi için bu belirsizlik içeren bir durumdur; çünkü ürün bazen azalır, bazen artar ve hatta tamamen yok olabilir.", id: "Al-Muwatta 2063 — Malik: Adapun orang yang memberikan tanahnya yang tandus dengan imbalan sepertiga atau seperempat dari hasil panennya, itu adalah sesuatu yang penuh ketidakpastian, karena hasil panen kadang berkurang dan kadang bertambah, dan bisa juga musnah sama sekali." }
summary:
  ar: "قال: فأما الرجل الذي يعطي أرضه البيضاء بالثلث أو الربع مما يخرج منها، فذلك مما يدخله الغرر، لأن الزرع يقل مرة ويكثر مرة، وربما هلك رأسا، فيكون صاحب الأرض قد ترك كراء معلوما يصلح له أن يكري أرضه به، وأخذ أمرا غررا، لا يدري أيتم أم لا. فهذا مكروه. ولا ينبغي لرجل أن يؤاجر نفسه ولا أرضه ولا سفينته إلا بشيء معلوم لا يزول إلى غيره. {cite:muwatta-maruf-1997 p.244}"
  tr: "Şöyle dedi: \"Verimsiz toprağını ürününün üçte biri veya dörtte biri karşılığında veren kişi için bu belirsizlik içerir, çünkü ürünler bazen azalır, bazen artar ve hatta tamamen yok olabilir. Böylece, toprak sahibi, toprağını kiraya vermesini sağlayacak bilinen bir kira bedelinden vazgeçmiş ve karlı olup olmayacağını bilmediği belirsiz bir şeye girişmiştir. Bu kınanacak bir durumdur. Bir insan, kendisini, toprağını veya gemisini, başkasına devredilemeyecek bilinen bir miktar dışında kiralamamalıdır.\" {cite:muwatta-maruf-1997 s.244}"
  id: "Ia berkata: Adapun orang yang memberikan tanah tandusnya dengan imbalan sepertiga atau seperempat hasil panennya, ini mengandung ketidakpastian, karena hasil panen kadang berkurang dan kadang bertambah, dan bahkan bisa mati sama sekali. Dengan demikian, pemilik tanah telah kehilangan pendapatan sewa yang pasti yang seharusnya memungkinkannya untuk menyewakan tanahnya, dan telah mengambil sesuatu yang tidak pasti, tanpa mengetahui apakah itu akan menguntungkan atau tidak. Ini tercela. Seseorang tidak boleh menyewakan dirinya sendiri, tanahnya, atau kapalnya kecuali dengan jumlah yang pasti yang tidak dapat dialihkan kepada orang lain. {cite:muwatta-maruf-1997 p.244}"
