summary:
  ar: "القسم 24 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإجارة»، ويضم فيها النصوص من 3416 إلى 3570 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 24 of Sunan Abi Dawud (Wages (Kitab Al-Ijarah)) in the division of the open hadith dataset the museum took its reports from: reports 3416 to 3570 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 24، عنوان «کتاب الاجارۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3416 تا 3570۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 24 de Sunan Abi Dawud (Salarios (Kitab Al-Ijarah)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3416 al 3570, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Abi Dawud (Salaires, Kitab Al-Ijarah), dans la partie ouverte de ce recueil (rapports 3416 à 3570). Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 24. bölümü \"Kira Kitabı\" başlığını taşımakta olup, 3416'dan 3570'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 24 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sewa-Menyewa\" dan berisi teks 3416 hingga 3570, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
