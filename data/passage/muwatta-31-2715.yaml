label: { ar: "الموطأ 2715 — عثمان بن أبي العاص: امسحه بيمينك سبع مرات وقل أعوذ بعزة الله وقدرته", en: "Muwatta 2715" }
summary:
  ar: "يروي مالك عن يزيد بن خصيفة عن عمرو بن عبد الله السلمي أخبره أن نافع بن جبير أخبره عن عثمان بن أبي العاص أنه أتى رسول الله وبه وجع كاد يهلكه، فقال له رسول الله: امسحه بيمينك سبع مرات، وقل: أعوذ بعزة الله وقدرته من شر ما أجد. قال: فقلت ذلك فأذهب الله ما كان بي، فلم أزل آمر بها أهلي وغيرهم. {cite:muwatta-maruf-1997 p.530} {cite:muwatta-maruf-1997 p.531}"
