label: { ar: "الموطأ 2050 — مالك عن ابن شهاب عن سليمان بن يسار: كان رسول الله يبعث عبد الله بن رواحة إلى خيبر فيخرص بينه وبين يهود خيبر، فجمعوا له حليا من حلي نسائهم فقالوا: هذا لك وخفف عنا، فقال ابن رواحة: يا معشر يهود، والله إنكم لمن أبغض خلق الله إلي، وما ذاك بحاملي على أن أحيف عليكم", en: "Muwatta 2050", es: "Muwatta 2050", fr: "Muwatta 2050", ur: "موطا 2050", tr: "El-Muvatta 2050 — Malik, İbn Şihab'dan, o da Süleyman ibn Yasar'dan rivayetle: Allah Resulü, Abdullah ibn Ravaha'yı Hayber'e göndererek kendisi ile Hayber Yahudileri arasındaki ürün dağılımını değerlendirmesini isterdi. Hayber Yahudileri, kadınlarının mücevherlerinden topladıkları takıları ona verdiler ve şöyle dediler: \"Bu senindir, yükümüzü hafiflet.\" İbn Ravaha şöyle dedi: \"Ey Yahudiler, Allah'a yemin ederim ki, siz Allah'ın yaratıkları arasında bana en nefret edilenlerdensiniz, fakat bu beni size karşı haksızlık etmeye sevk etmez.\"", id: "Al-Muwatta 2050 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Sulayman ibn Yasar: Rasulullah SAW biasa mengutus Abdullah ibn Rawahah ke Khaybar untuk menghitung hasil panen antara beliau dan orang-orang Yahudi Khaybar. Mereka mengumpulkan perhiasan dari perhiasan wanita mereka untuk beliau dan berkata: Ini untukmu, dan ringankanlah beban kami. Ibn Rawahah berkata: Wahai orang-orang Yahudi, demi Allah, kalian termasuk makhluk Allah yang paling kubenci, tetapi itu tidak akan membuatku berbuat zalim kepada kalian." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سليمان بن يسار أن رسول الله كان يبعث عبد الله بن رواحة إلى خيبر، فيخرص بينه وبين يهود خيبر، قال: فجمعوا له حليا من حلي نسائهم، فقالوا: هذا لك، وخفف عنا وتجاوز في القسم. فقال عبد الله بن رواحة: يا معشر يهود، والله إنكم لمن أبغض خلق الله إلي، وما ذاك بحاملي على أن أحيف عليكم، فأما ما عرضتم من الرشوة فإنها سحت، وإنا لا نأكلها. فقالوا: بهذا قامت السماوات والأرض. {cite:muwatta-maruf-1997 p.240}"
  tr: "Malik, İbn Şihab'dan, o da Süleyman ibn Yasar'dan rivayet eder ki, Allah Resulü, Abdullah ibn Ravaha'yı Hayber'e göndererek kendisi ile Hayber Yahudileri arasındaki mal paylaşımını değerlendirmesini isterdi. Hayber Yahudileri, kadınlarının mallarından mücevherler topladılar ve \"Bu sizindir; bize karşı müsamahalı olun ve bölüşmeyi göz ardı edin\" dediler. Abdullah ibn Ravaha şöyle cevap verdi: \"Ey Yahudiler, Allah'a yemin ederim ki, siz Allah'ın yarattıkları arasında bana en nefret edilenlerdensiniz, ama bu beni size karşı haksızlık etmeye sevk etmez. Verdiğiniz rüşvet ise haramdır ve biz onu yemeyiz.\" Onlar da, \"Gökler ve yer böyle kurulmuştur\" dediler. {cite:muwatta-maruf-1997 s.240}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sulaiman bin Yasar, bahwa Rasulullah SAW biasa mengutus Abdullah bin Rawahah ke Khaybar untuk menghitung hasil panen antara beliau dan orang-orang Yahudi Khaybar. Mereka mengumpulkan perhiasan dari harta milik wanita mereka dan berkata, \"Ini untukmu; berbaik hatilah kepada kami dan abaikan pembagian ini.\" Abdullah bin Rawahah menjawab, \"Wahai orang-orang Yahudi, demi Allah, kalian termasuk makhluk Allah yang paling kubenci, tetapi itu tidak akan membuatku berbuat zalim kepada kalian. Adapun suap yang kalian tawarkan, itu haram, dan kami tidak memakannya.\" Mereka berkata, \"Demikianlah langit dan bumi diciptakan.\" {cite:muwatta-maruf-1997 p.240}"
