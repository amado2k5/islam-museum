label: { ar: "الموطأ 2050 — مالك عن ابن شهاب عن سليمان بن يسار: كان رسول الله يبعث عبد الله بن رواحة إلى خيبر فيخرص بينه وبين يهود خيبر، فجمعوا له حليا من حلي نسائهم فقالوا: هذا لك وخفف عنا، فقال ابن رواحة: يا معشر يهود، والله إنكم لمن أبغض خلق الله إلي، وما ذاك بحاملي على أن أحيف عليكم", en: "Muwatta 2050" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سليمان بن يسار أن رسول الله كان يبعث عبد الله بن رواحة إلى خيبر، فيخرص بينه وبين يهود خيبر، قال: فجمعوا له حليا من حلي نسائهم، فقالوا: هذا لك، وخفف عنا وتجاوز في القسم. فقال عبد الله بن رواحة: يا معشر يهود، والله إنكم لمن أبغض خلق الله إلي، وما ذاك بحاملي على أن أحيف عليكم، فأما ما عرضتم من الرشوة فإنها سحت، وإنا لا نأكلها. فقالوا: بهذا قامت السماوات والأرض. {cite:muwatta-maruf-1997 p.240}"
