summary:
  ar: "القسم 20 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الخراج والإمارة والفىء»، ويضم فيها النصوص من 2928 إلى 3088 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 20 of Sunan Abi Dawud (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)) in the division of the open hadith dataset the museum took its reports from: reports 2928 to 3088 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 20، عنوان «کتاب الخراج والامارۃ والفیٰء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2928 تا 3088۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 20 de Sunan Abi Dawud (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2928 al 3088 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 20 du Sunan Abi Dawud (Tribut, Butin et Domination (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)) correspond aux hadiths 2928 à 3088, selon la numérotation de la base de données ouverte utilisée par le musée. Le musée classe ses archives relatives à ces hadiths dans ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 20. bölümü \"Toprak Vergisi, Emirlik ve Savaş Ganimetleri Kitabı\" başlığını taşımakta olup, sırasıyla 2928 ila 3088 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 20 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pajak Tanah, Emirat, dan Rampasan Perang\" dan berisi teks 2928 hingga 3088, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
