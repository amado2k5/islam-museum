label: { ar: "صحيح البخاري 5744 — الرقية، الشفاء", en: "Sahih al-Bukhari 5744 — ruqya recited over the sick; healing", ur: "صحیح بخاری 5744 — رقیہ، شفا" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ أَبِي رَجَاءٍ، حَدَّثَنَا النَّضْرُ، عَنْ هِشَامِ بْنِ عُرْوَةَ، قَالَ أَخْبَرَنِي أَبِي، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ يَرْقِي يَقُولُ \" امْسَحِ الْبَاسَ رَبَّ النَّاسِ، بِيَدِكَ الشِّفَاءُ، لاَ كَاشِفَ لَهُ إِلاَّ أَنْتَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5744، يذكر الرقية، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5744 (Medicine), that mentions ruqya recited over the sick, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5744، جس میں رقیہ، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
