text: |-
  ١٦٢
  •⁦(فصل الباء)⁩
  * ⁦(برسم)⁩.
  وهين وأنشدلابى كبير
  الاعواسر كالمراط معيدة • باللسل مورد أيم منغضف
  والجمع أيوم والايام الدخان وابهع أيم وآم الرجل ايامااذادخن على النحل لتخرج من انخلية
  فيأخذمافيها من العسل قال أبو ذؤيب
  فلما جلاها بالايام تحيزت • ثبات عليها ذلها واكتتابها
  ورجل ذو بذم أى حهين ويقال ذورأى وحزم وقال الاموى ذونفس وقال السكسائى ذو
  احتقال لماحل وقال انخليل هو العاقل عند الغضب رم) البرم بالتحر يك مصدرة ولك
  برم به بالكسراذاشمه وتبرّم به منله وأبرمه أى أمله وأضجره والبرم أيضا الذى لايدخل مع
  القوم فى الميسر والجمع أبرام وقال • ولا برماتهدى النسالعرسه* وفى المنسل آبرماقرونا
  آى هو برم ويا كل مع ذلك تمرتين تمرقين والبرم أيضائر العضاه الواحدة برمة وبرمة كل
  المضاه صفراءالا العرفطفان برمته بيضاء وبرمة السلم أطيب البرم ريحا وأبرمت الشئ أى
  أحكمته والمبرم والبريم الحبل الذى جع بين مفتولين ففت لاحبلا واحدامثل ما،مسخن
  وسخين وعسل معقد وعقيسدوميزان مترص وتريص وقال أبو عبيد البريم الحبل المفتول
  يكون فيهلونان وربمائدته المرأة على وسطها وعضدها وأنشدنا الاسمعى
  اذا المرضع العوجاءجال بريمها • وقديعلق على الصى تدفع به العين ومنه قيل للجيس
  بريم لالوان شعار القتبائل فيه وقال • ليقود من أهل الجازيريا* والمبرم من الشياب المفتول
  الغزل طاقين ومنه سمى المبرم وهو جنس من الشياب أبو عبيدة يقال اشولنا من بريميها أى
  من الكبد والسنام يقدان طولا ويلفان بخيط أوغيره يقال سميا بذلللبياض
  السنام وسواد الكبد والبرام بالكسر جع برمة وهى القدر والبرام بالضم القراد
  وبيرم النجار فارى معرب حم البرجة بالضم واحدة البراجم وهى مفاصل
  الاصابع التى بين الاشاجيع والرواجب وهى رؤس السلاميات من ظهر السكف اذاقبض
  القابض كفه تشرت وارتفعت والبراجم قوم من تيم قال أبو عبيدة خمسة من أولاد حنظلة
  ابن مالك بن عروبن تيم يقال اهسم البراجم وفى المثل ان الشقى وافد البراجم وذلذ أن عمرو
  ابن هند أحرق تسعة وتسعين رج لا من بى دارم وكان قدحاف ليحر قن منهم مائة بأخيه أسعد
  ابن المنذر فررجل من البراجم فاشمّ رائحة الشواء من لحوم الناس قطن أنّ الملك اتخسذ
  طعاما فعدل اليه ليرز أمنه فقيل له ممن أنت قال من البراجم فألقاه فى النار فسمت العسرب
  عمرو بن هند عمز فالذلك رسم البرسام علة معروفة وقد برسم الرجسل فهو مبرسم
  والابريسم معرّب وفيه ثلاث لغات والعرب تخلط فيماليس من كلامها قال ابن السكيت هو
  الابريسم بكسر الهمزة والراء وفتح السين وقال ليس فى الكلام افعيال بالكسر ولكن أفعيلل
  مثل اهليلج وابر يسم وهو ينصرف وكذلذ ان سمين به على جهة التلقيب انصرف و المعرفة
  والنكرة لان العرب أعرته فى نكرته وأدخات عليه الالف واللام وأجرته مجرى ما أصل بنائه
  امم وكذلك الفرندوالديباج والراقودوالشهريزوالاجرّ والنبروز والزنجبيل وليس كذلك
  أسمحق
