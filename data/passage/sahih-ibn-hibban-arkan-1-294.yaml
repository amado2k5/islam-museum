text: "… بنُ يحيى، قال: حدثنا ابنُ وهبٍ، قال: حدثنا حنظلةٌ بنُ أبي سفيان، قال: سمِعْتُ عِكْرِمَةَ بنَ خالدٍ المخزوميَّ يُحَدِّث أن رجلًا قال لعبدِ اللَّهِ بنِ عُمَرَ: أَلَا تغْزو؟ فقال : إِنِّي سَمِعْتُ رَسُولَ اللَّهِ،، يَقُولُ: بُنِيَ الإِسْلَامُ على خَمْس : …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 1، ص 294، يذكر ما بُني عليه الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 1, p. 294, that mentions what Islam is built on; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 1، ص 294 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 1, pág. 294, que menciona los fundamentos del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait du Sahih Ibn Hibban, volume 1, page 294, mentionne les fondements de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban, Resimli Cilt 1, sayfa 294'ten, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid Bergambar 1, halaman 294, yang menyebutkan dasar-dasar Islam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
