text: |-
  ٥17
  قال الشاعز ا اعشى ولو كنتم تمر الكنتم حشافة *ولوكنتم سهم اليكمتم معاقصا
  وامي من التيت وهر اتلب المفرة وايق لنماد الأعناس واذ أرض وظارت
  ويقى نبذمنه وبقيت فى رأسه عناص إذابقى فى رأسه شعر تفرّق فى نواحيه قال أبو النعم
  إن يس رأسى اشعط العفادى: • كأغافرقه مناص
  الواحدة عنصوة وهى فعلوة بالضم وبعضهم يقول عنصوة وثندوة وان كان الحرف الشانى
  منهمانونا ويلحقه-مابعرقوة وترقوة وقرنوة (عوص ، اعتاص عليه الامى أى النوى
  واعتاصت القاقة اذاضر بها الفحل فلم تحمل ولا علة بها وشاة عائص اذا لم تحمسل أعواما
  وأعوص بانلخصم اذا لوى عليه أمره والعويص من الشعر ما يصعب استخراج معناه
  والكامة العوصاء الغرية يقال قد أ عوصت ياهذا وقدء وص الشى بالكسر والعوصاء
  الشدة وفلان يركب العوصاء أى بركب أصعب الامود ( يص لعبص الشجرااكثير
  الملتف والمندت معيص والحص الاص-ل والاعماص من قريس أولادأ ممة بن عبدشمس
  الاكبروهم أر بغة العاص وأبو العاص والعبص وأبو العص
  صل النين صص لغصة الشجا والجمع غصص والغصص بالفتح مصدرة ولك
  غصصت يارجل تغص فأنت غاص بالطعام وغصان وأغصصته أنا والمنزل غاص بالقوم أى
  فزلئ بهسم فص) غافست الرجل اى أخذته على غرة ⁦( مص)⁩ غمصه يغمصه غمصا
  واغتمصه أى استصغره ولم يرهشيئا يقال غمص فلان النعمة اذ الم يشكرها وغمصت عليه قولا
  فاله أى عبته ويقال للرجل اذا كان مطعوناعليه فى دينه انه لغموص عليه والغمص
  فى العين ماسال من الرمص وقد غمصت عينه بالكسر غمصا والغميصاء إحدى الشعربين
  ويقال لها الغعوص أيضا وهى التى فى الذراع تزعم العرب أن الشعر بين أختاسهيل
  فالعبور تراها اذاطاعت كاضماتستعبر والغميصا لا تراهافقد بكت-ق غمصت والغميصاء
  أيضاء وضع ( وص لغوص النزول تحت الماء رقد غاص فى الماء والهاج-م على الشي
  غائص والغواص الذى يغوص فى البجر على اللؤاؤوفعله الغياصة
  صل اخاء قحص الفحص البهث عن الشئ وقد فحص عنه وتفحص واقتحص
  بهنى وربما قالوا فخص المطر التراب قلبه والافى وص محتم القطاة لانها تفحصه وكذلك
  المفحص يقال ليس له مفحص قطاة وقى الحديث في صواءن رؤسه-م كأنهم حلقوا وسطها
  وتركوهامثل أفاحيص القطا ⁦(فرص)⁩ الفرصة الشرب والذوبة بقال وجدفلان
  ذرصة أى نهزة وجاءت فرصتك من البئرأى نوبتك وبنوفلان يتفارصون بترهم اذا كانوا
  يتفا ويونها وانتهزفلان الفرصة أى اغتنمها وفازبها وأفرصتنى الفرصة أى أمكنتى وأفرصتها
  اغتنمتها والفريص الذى يقارصك فى الشرب والنوية والفرص بالفتح القطع والمفرص
  والمفراص الذى يقطع به الفضة قال الاعشى
  وادفع عن اعراضكم وأعيركم * لانا كفراص الخفاجىّ محب
  وقد،كون الفرس الشوّيقال فرصت المعل اذاخرقت أذنيها اللشر ال والفرصة الريح التى
  اون
