label: { ar: "الموطأ 1731 — يحيى بن سعيد: توفي السائب بن خباب، فسألت امرأته ابن عمر أن تبيت في حرثهم بقناة، فنهاها، فكانت تخرج سحرا وترجع مساء", en: "Muwatta 1731" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه بلغه أن السائب بن خباب توفي، وأن امرأته جاءت إلى عبد الله بن عمر فذكرت له وفاة زوجها، وذكرت له حرثا لهم بقناة، وسألته هل يصلح لها أن تبيت فيه، فنهاها عن ذلك. فكانت تخرج من المدينة سحرا فتصبح في حرثهم فتظل فيه يومها، ثم تدخل المدينة إذا أمست فتبيت في بيتها. {cite:muwatta-maruf-1997 p.107}"
