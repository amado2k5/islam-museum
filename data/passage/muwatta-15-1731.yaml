label: { ar: "الموطأ 1731 — يحيى بن سعيد: توفي السائب بن خباب، فسألت امرأته ابن عمر أن تبيت في حرثهم بقناة، فنهاها، فكانت تخرج سحرا وترجع مساء", en: "Muwatta 1731", es: "Muwatta 1731", fr: "Muwatta 1731", ur: "موطا 1731", tr: "El-Muvatta 1731 — Yahya ibn Said: El-Sa'ib ibn Khabbab öldü ve karısı İbn Ömer'den Qanat'taki tarlalarında geceyi geçirmesine izin vermesini istedi, ancak İbn Ömer buna izin vermedi. Bu yüzden kadın şafakta dışarı çıkar ve akşam geri dönerdi.", id: "Al-Muwatta 1731 — Yahya ibn Saeed: Al-Sa’ib ibn Khabbab meninggal, dan istrinya meminta Ibn Umar untuk mengizinkannya bermalam di ladang mereka di Qanat, tetapi Ibn Umar melarangnya. Maka ia akan keluar saat fajar dan kembali pada malam hari." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه بلغه أن السائب بن خباب توفي، وأن امرأته جاءت إلى عبد الله بن عمر فذكرت له وفاة زوجها، وذكرت له حرثا لهم بقناة، وسألته هل يصلح لها أن تبيت فيه، فنهاها عن ذلك. فكانت تخرج من المدينة سحرا فتصبح في حرثهم فتظل فيه يومها، ثم تدخل المدينة إذا أمست فتبيت في بيتها. {cite:muwatta-maruf-1997 p.107}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet eder ki, el-Sa'ib ibn Khabbab'ın öldüğünü işitmiş ve karısı Abdullah ibn Umar'a gelerek kocasının ölümünü anlatmış. Ayrıca bir kanalın kenarındaki tarlalarından bahsetmiş ve orada geceyi geçirmesinin caiz olup olmadığını sormuş. Abdullah ibn Umar bunu yasaklamış. Bu yüzden kadın şafak vakti Medine'den ayrılır, sabahı tarlalarında geçirir ve gün boyunca orada kalırmış. Sonra akşam karanlığında Medine'ye döner ve geceyi evinde geçirirmiş. {cite:muwatta-maruf-1997 s.107}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, bahwa ia mendengar bahwa al-Sa'ib ibn Khabbab telah meninggal, dan bahwa istrinya datang kepada Abdullah ibn Umar dan memberitahukan kepadanya tentang kematian suaminya. Ia juga menyebutkan lahan pertanian mereka di tepi kanal dan bertanya kepadanya apakah diperbolehkan baginya untuk bermalam di sana. Abdullah ibn Umar melarangnya. Maka ia akan meninggalkan Madinah saat subuh dan menghabiskan pagi di lahan pertanian mereka, tinggal di sana sepanjang hari. Kemudian ia akan kembali ke Madinah saat senja dan bermalam di rumahnya. {cite:muwatta-maruf-1997 p.107}"
