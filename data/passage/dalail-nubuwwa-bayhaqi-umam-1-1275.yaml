text: "والمؤمنين، وأذل بوقعة بدر رقاب المشركين والمنافقين، فلم يبق بالمدينة منافق ولا يهودي إلا وهو خاضعٌ عنقه لوقعة بدر، وكان ذلك يوم الفرقان يوم فرق اللّٰه تعالى بين الشرك والإيمان. وقالت اليهود تيقنا أنه النبيُّ الذي نجد نعته في التوراة …"
