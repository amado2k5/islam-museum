  ٤١
  أى لا يشغله عن نسكد وحجه عيال ولا متاع وروى مالك بن دينار قال حدّثنا الحسسن قال
  ماشبع رسول اللّٰه صلى اقه عليه وسلم ن -بزرلحم الاعلى ضفنى قال مالك فسألت بدويا عثها
  فقال تناولا مع الناس وقال الخليل الضغف كثرة الايدى على الطعام وقال أبوزيد الضفف
  الضيق والشدة وابن الاعرابىّ مثله تقول منه رجل ضف الجال وقال الاصمعىّ أن يكون
  المال قليلاومن يأكله كثيرا وقال الفراء الضفف الحاجة ويقال أيضالقيته على ضفف
  أى على عملة ومنه قول الشاعر* وليس فى رأيه وهى ولا ضفف • والضفف أيضا ازدحام
  النساس على الماء والضفة الفعلة الواحدة منسه يقال تضافوا على الماءاذا كثر واعليه
  قال الاصمعى ماء مضفوف اذا كثر عليه الناس مثل مشفوه قال الراجز
  لا يستق فى النزح المضفوف * الامدارات الغروب الجوف
  ويقال أيضافلان. ضفوف مثل منموداذانفدما عنده وضفّ الناقة لغة فى ضبها اذا حلبها
  بالكف كاها والضفة بالكسرجانب النهر وضفتاه جانباه ضيف) الضيف بكون واحدا
  وبجعا وقد يجمع على الاضياف والضيوف والضيفان والمرأة ضيف وضيفة قال الشاعر
  لقى حلته أمّه وهى ضيفة * فجاءت بيتن للضيافة أرشما
  وأضفت الرجل وضيفته اذا أنزلته بك ضيفا وقريته وضفت الرجل ضيافة اذا نزات عليه
  ضيفا وكذلك تضيفته ومنه قول الفرزدق * يرج وفضله المتضيف» وتضيفت الشمس اذا
  مالت للغروب وكذلك ضافت وضفت ويقال ضاف المهم عن الهدف مثل صاف أى
  عدل وأضفت الشئ الى الدى أى أملته وأضفت من الامرأى أشفقت وحذرت قال
  لنسابغة المع اقامت ثلا ثابين يوم وليسلة • وكان النكير أن تغيف وتجار:
  وانما غلب التأنيث لانه لم يذكر الايام يقال أقت عنده ثلاثة أيام واذا قالوا أقت عنده ثلا ثابين
  يوم وليسلة غلبوا التأنيث قال الاسمعى" و.نه المضوفة وهو الامر يشفق منه وأنشدلابى
  جندب الهذلى
  وكنت اذا جارى دعالمضوفة • أشهر حتى ينصف الساق متزرى
  قال أبو سعيد وهذا البيت يروى على ثلاثة أوجه علي المضوفة والمضيفة والمضافة وأضفته الى
  كذا أى الجأنه ومنه المضاف فى الحرب وهو الذى أحيط به قال طرفة
  وكرى اذانادى المضاف محنبا • كسيد الغضانبهته المتورد
  والمضاف أيض المسلزق بالقوم وضافه الهتم أى نزل به قال الراعى
  أخليداتَ أباك ضاف وساده • همان باتاجنبة ودخيلا
  قال الاصحعى بقال تضايف الوادى اذا تضايق وقال أبوزيد الضيف بالكسير الجنب وأنشد
  يتبعن عودا يشتكى الاظلا * اذا تضايفن عليه انسلا
  أى اذاصرن قريبامنه الى جنبه والقاف فيه تصصيف والضيفن الذى يجى مع الضيف
  والنون زائدة ((وفعلن وليس بفيعل قال الشاعر
