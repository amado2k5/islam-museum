label: { ar: "جامع الترمذي 2595 — ضحك وتبسم", en: "Jami' al-Tirmidhi 2595 — laughter and smiling", ur: "جامع ترمذی 2595 — ہنسی اور تبسم", fr: "Jami' al-Tirmidhi 2595 — rire et sourire", es: "Jami' al-Tirmidhi 2595 — risa y sonrisa", tr: "Cami' el-Tirmizi 2595 — Kahkaha ve Gülümseme", id: "Jami' al-Tirmidhi 2595 — Tawa dan Senyum" }
text: "… فَيَرْجِعُ فَيَقُولُ يَا رَبِّ قَدْ أَخَذَ النَّاسُ الْمَنَازِلَ. قَالَ فَيُقَالُ لَهُ أَتَذْكُرُ الزَّمَانَ الَّذِي كُنْتَ فِيهِ فَيَقُولُ نَعَمْ. فَيُقَالُ لَهُ تَمَنَّ. قَالَ فَيَتَمَنَّى فَيُقَالُ لَهُ فَإِنَّ لَكَ مَا تَمَنَّيْتَ وَعَشَرَةَ أَضْعَافِ الدُّنْيَا. قَالَ فَيَقُولُ أَتَسْخَرُ بِي وَأَنْتَ الْمَلِكُ . قَالَ فَلَقَدْ رَأَيْتُ رَسُولَ اللَّهِ ضَحِكَ حَتَّى بَدَتْ نَوَاجِذُهُ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2595، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 2595, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 2595، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 2595, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 2595, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Cami' el-Tirmizi'de yer alan 2595 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2595, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
