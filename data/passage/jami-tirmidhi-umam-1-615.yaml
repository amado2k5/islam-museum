text: "… يُوسُفُ بْنُ حَمَادٍ البَصْرِيُّ : حَدَّثَنَا عَبْدُ الأَعْلَى عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكِ: أَنَّ رَسُول اله لَ لهِ مَتَبَ قَبْلَ مَوْتِهِ إِلَى كِسْرَى وَإِلَى قَيْصَرَ، وَإِلَى النَّجَاشِيِّ وَإِلَىٰ كُلِّ جَبَّارٍ يَدْعُوهُمْ إِلَى اللهِ، وَلَيْسَ بالنَّجَاشِيَّ الَّذِي صَلَّى …"
summary:
