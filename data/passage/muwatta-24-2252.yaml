label: { ar: "الموطأ 2252 — مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود: أن رجلا من الأنصار جاء إلى رسول الله بجارية له سوداء، فقال: إن علي عتق رقبة مؤمنة، فإن كنت تراها مؤمنة أعتقها، فقال لها: أتشهدين أن لا إله إلا الله؟ وأن محمدا رسول الله؟ وتوقنين بالبعث؟ قالت نعم، فقال: أعتقها", en: "Muwatta 2252", es: "Muwatta 2252", fr: "Muwatta 2252", ur: "موطا 2252", tr: "El-Muvatta 2252 — Malik, İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe ibn Mesud'dan rivayet eder ki: Ensar'dan bir adam, yanında siyah bir cariyesiyle Allah'ın Resulü'ne geldi ve dedi ki: \"İman eden bir cariyeyi azat etme yükümlülüğüm var, eğer onu mümin sayarsanız, azat edeceğim.\" Resulullah ona dedi ki: \"Allah'tan başka ilah olmadığına ve Muhammed'in Allah'ın Resulü olduğuna şahitlik eder misin? Kıyametin geleceğinden emin misin?\" Kadın dedi ki: \"Evet.\" Resulullah dedi ki: \"Onu azat edeceğim.\"", id: "Al-Muwatta 2252 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Ubaydullah ibn Abdullah ibn Utbah ibn Masoud: bahwa seorang laki-laki dari kaum Ansar datang kepada Rasulullah dengan seorang budak perempuan berkulit hitam miliknya, dan berkata: Aku berkewajiban untuk membebaskan seorang budak perempuan yang beriman, jadi jika engkau menganggapnya sebagai orang yang beriman, aku akan membebaskannya. Beliau berkata kepadanya: Apakah engkau bersaksi bahwa tidak ada Tuhan selain Allah? Dan bahwa Muhammad adalah Rasulullah? Dan apakah engkau yakin akan hari kiamat? Ia menjawab: Ya. Beliau berkata: Aku akan membebaskannya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود أن رجلا من الأنصار جاء إلى رسول الله بجارية له سوداء، فقال: يا رسول الله، إن علي عتق رقبة مؤمنة، فإن كنت تراها مؤمنة أعتقها. فقال لها رسول الله: أتشهدين أن لا إله إلا الله؟ قالت: نعم. قال: أتشهدين أن محمدا رسول الله؟ قالت: نعم. قال: أتوقنين بالبعث بعد الموت؟ قالت: نعم. فقال رسول الله: أعتقها. {cite:muwatta-maruf-1997 p.329} {cite:muwatta-maruf-1997 p.330}"
  tr: "Malik, İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe ibn Mes'ud'dan rivayet eder ki, Ensar'dan bir adam, siyah tenli cariyesiyle birlikte Allah Resulü'ne geldi ve şöyle dedi: \"Ey Allah Resulü, mümin bir cariyeyi azat etme yükümlülüğüm var. Eğer onu mümin sayarsanız, azat edin.\" Allah Resulü ona sordu: \"Allah'tan başka ilah olmadığına şahitlik eder misin?\" O da \"Evet\" dedi. Allah Resulü sordu: \"Muhammed'in Allah'ın Resulü olduğuna şahitlik eder misin?\" O da \"Evet\" dedi. Allah Resulü sordu: \"Ölümden sonra dirilişten emin misin?\" O da \"Evet\" dedi. Allah Resulü şöyle buyurdu: \"Onu azat edin.\" {cite:muwatta-maruf-1997 s.329} {cite:muwatta-maruf-1997 s.330}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Ubaydullah ibn Abdullah ibn Utbah ibn Mas'ud, bahwa seorang laki-laki dari kaum Ansar datang kepada Rasulullah SAW dengan budak perempuannya yang berkulit hitam dan berkata, \"Wahai Rasulullah, aku berkewajiban untuk membebaskan seorang budak perempuan yang beriman. Jika engkau menganggapnya sebagai orang yang beriman, maka bebaskanlah dia.\" Rasulullah SAW bertanya kepadanya, \"Apakah engkau bersaksi bahwa tidak ada Tuhan selain Allah?\" Ia menjawab, \"Ya.\" Beliau bertanya lagi, \"Apakah engkau bersaksi bahwa Muhammad adalah Rasulullah?\" Ia menjawab, \"Ya.\" Beliau bertanya lagi, \"Apakah engkau yakin akan Kebangkitan setelah kematian?\" Ia menjawab, \"Ya.\" Rasulullah SAW bersabda, \"Bebaskanlah dia.\" {cite:muwatta-maruf-1997 p.329} {cite:muwatta-maruf-1997 p.330}"
