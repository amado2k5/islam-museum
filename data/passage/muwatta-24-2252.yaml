label: { ar: "الموطأ 2252 — مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود: أن رجلا من الأنصار جاء إلى رسول الله بجارية له سوداء، فقال: إن علي عتق رقبة مؤمنة، فإن كنت تراها مؤمنة أعتقها، فقال لها: أتشهدين أن لا إله إلا الله؟ وأن محمدا رسول الله؟ وتوقنين بالبعث؟ قالت نعم، فقال: أعتقها", en: "Muwatta 2252" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود أن رجلا من الأنصار جاء إلى رسول الله بجارية له سوداء، فقال: يا رسول الله، إن علي عتق رقبة مؤمنة، فإن كنت تراها مؤمنة أعتقها. فقال لها رسول الله: أتشهدين أن لا إله إلا الله؟ قالت: نعم. قال: أتشهدين أن محمدا رسول الله؟ قالت: نعم. قال: أتوقنين بالبعث بعد الموت؟ قالت: نعم. فقال رسول الله: أعتقها. {cite:muwatta-maruf-1997 p.329} {cite:muwatta-maruf-1997 p.330}"
