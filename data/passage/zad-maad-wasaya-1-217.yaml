text: "… النبي الله اعتمر في رجب متفق عليه. وقد غلَّطته عائشةُ وغيرُها، كما في الصحيحين عن مجاهد، قال: دخلتُ أنا وعُروةُ بن الزبير المسجد، فإذا عبد اللَّه بن عمر جالساً إلى حُجْرَةٍ عائشةِ، وإذا ناسٌ يُصلُّون في المسجد صلاةَ الضحى، قال …"
