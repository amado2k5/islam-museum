label: { ar: "صحيح البخاري 6792 — الأب والأبوة", en: "Sahih al-Bukhari 6792 — the father and fatherhood", ur: "صحیح بخاری 6792 — باپ اور والدیت", es: "Sahih al-Bukhari 6792 — El padre y la paternidad", fr: "Sahih al-Bukhari 6792 — Le père et la paternité", tr: "Sahih el-Buhari 6792 — Baba ve Babalık", id: "Sahih al-Bukhari 6792 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدَةُ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، قَالَ أَخْبَرَتْنِي عَائِشَةُ، أَنَّ يَدَ السَّارِقِ، لَمْ تُقْطَعْ عَلَى عَهْدِ النَّبِيِّ إِلاَّ فِي ثَمَنِ مِجَنٍّ حَجَفَةٍ أَوْ تُرْسٍ. حَدَّثَنَا عُثْمَانُ، حَدَّثَنَا حُمَيْدُ بْنُ عَبْدِ الرَّحْمَنِ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، مِثْلَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6792، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6792 (Limits and Punishments set by Allah (Hudood)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6792، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6792 (Límites y castigos establecidos por Alá (Hudud)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 6792 (Limites et Châtiments fixés par Allah (Hudood)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 6792 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6792, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
