summary:
  ar: "أثر يرويه مالك عن ابن شهاب أن سعد بن أبي وقاص كان يوتر بعد العشاء بركعة واحدة؛ ويعلق مالك بأن العمل عند أهل المدينة ليس على هذا وأن أدنى الوتر ثلاث. وهو في باب الأمر بالوتر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.184}"
