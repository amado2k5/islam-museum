label: { ar: "الموطأ 327 — سعد يوتر بعد العتمة بواحدة، ومالك: أدنى الوتر ثلاث", en: "Muwatta 327", es: "Muwatta 327", fr: "Muwatta 327", ur: "موطا 327", tr: "El-Muvatta 327 — Sa'd şöyle dedi: Gece namazından sonra bir rekat, Malik ise şöyle dedi: Vitr namazının en az rekat sayısı üçtür.", id: "Al-Muwatta 327 — Sa'd berkata: Satu rakaat setelah shalat Isya, dan Malik berkata: Jumlah rakaat minimum untuk shalat Witir adalah tiga." }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب أن سعد بن أبي وقاص كان يوتر بعد العشاء بركعة واحدة؛ ويعلق مالك بأن العمل عند أهل المدينة ليس على هذا وأن أدنى الوتر ثلاث. وهو في باب الأمر بالوتر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.184}"
  tr: "Malik'in İbn Şihab'tan rivayet ettiği bir hadiste, Sa'd ibn Abi Vakkas'ın yatsı namazından sonra tek rekatlık vitir namazı kıldığı belirtilmektedir. Malik, bunun Medine halkı arasında yaygın bir uygulama olmadığını ve vitir namazının en az üç rekat olması gerektiğini belirtmektedir. Bu, vitir namazının kılınması emri bölümünde yer almaktadır. Editör, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.184}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Ibnu Shihab menyatakan bahwa Sa'd ibn Abi Waqqas biasa melaksanakan shalat Witir setelah shalat Isya dengan satu rakaat. Malik berkomentar bahwa ini bukanlah kebiasaan di kalangan penduduk Madinah, dan bahwa jumlah rakaat minimum untuk Witir adalah tiga. Hal ini terdapat dalam surah tentang perintah untuk melaksanakan Witir. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.184}"
