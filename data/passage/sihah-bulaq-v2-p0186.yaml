text: |-
  •⁦(باب النون)⁩
  .•⁦(قطن)⁩•
  ٤٠١
  وذلك الحبل يسمى القران وقرن الفرس يقرن اذا وقعت حوافرر جله مواقع حوافريديه
  بقرن بالضم فى يجيع ذلك وقرنت الشىء بالسى وصلته به وقرّنت الاسارى فى الحبال شدّد المكثرة
  قال اللّٰه تعالى مقرنين فى الاصفاد واقترن الشى بغسيره وقارنته قرانا صاحبته ومنه قران
  لكواكب والقران الجمع بين الحج والعمرة والقران أن تقرن بين تمرتين تأكلهما الاصحعى
  القران التبل المستوية من عمل رجل واحد قال ويقال لقوم اذا تناضلوا اذكروا القران أى
  والوابين سهمين سهمين وأقرن الرجل اذارفع رأس رمحه لثلايه يب من قدامه وآقرن الدمل
  مان أن يدقأ وأقرن الدم فى العرق واستقرن أى كثروتيمغ وأقرن له أى آطاقه وقوى على
  قال اللّه تع الى وما كناله مة رنين أى مطيقين والمقرن أيضا الذى قد غلبته ضعته تكون له ابل
  وغنم ولا مغيز له عليها أو بكون يسقى ابلده ولاذائدله يدودها قاله ابن السكيت والقرين
  المصا-ب والقرينان أبو بكروطلحة لان عثمان بن عبيد اللّٰه أخاطلهة أخذهما فقرتهما بجبل
  نلذلك مهما القرينين وقرينة الرجل امرأته وقولهم اذا جاذبته قرمنته بمرها أى اذاقرات به
  الشديدة أطاقها وغليها ودور قرائن اذا كان بستقبل بعضها بعضا ويقال آسمحت قربنه وقرونه
  وقروسه وقرينته أى ذات نفسه وتابعته على الامر والقرون الناقة التى تجمع بين محلبيز
  والقرون من الدواب الذى يعرق سربعا والقرون الذى تقع -وافررجلميهم واقع حوافريديه
  وكذلك الناقة التى تون ركبتيها اذا بركت عن الاصمعىّ والقرون التى يجمع خلفاها
  القادمان والا خران فيتدانيان والقرون الذى يجمع بين تمرتين فى الاكل يقال أبر ماقرونا
  وقارون اسم دجل من بنى اسرائيل يضرب به المثل فى الغنى ولا ينصر ف للعجمة والتعريف
  والقارون الوج وسقاء قرنوى ومقرتى مقصور ديغ بالقرنوة قال ابن السكيت هى عشبة تنبت
  فى ألوية الرمل ود كادكه تنبت صعداورقها أغيبر يشبه ورق الحندة وق ولم يجئ على هذا
  المثال الاترقوة وعرقوة وعنصوة وثندوة سن) اقسأنّ الرجل اقسئنانا اذا كبروعسا
  قال الراجز بامسد انخوص تعوذمنى * ان تك اد نالينافانى • ماشنت من أشمط مقستن
  أبو عبيدة القسأنينة من اقسأنّ العود وغيره اذا اشتدّوعا واقس أنّ الليل اشتدظلامه
  طن قطر بالمسكان يقطن أقام به وتوطنه ذهوقاطن قال العجاج
  قواطسامكة من ورق الجى • والمع قطان وقاطنة وقطين أيضامشل غازوغزى وعازب
  وعزيب والقطين الخدم والاتياع والقطينة سكن الدارية ال جاء القوم بقطينتهم قال زهير
  رأيت ذوى الحاجات حول بيوتهم • قطينالهم -تى اذا أنيت البقل
  وقال جرير
  هذا ابن عمى فى دمشق خليفة • لوشبت ساقسكم الى قطينا
  والقطان شجار الهودج والقطن بالتحريك مابين الوركين وقطن الطارأصل ذنيه وقطن
  أيضاجبل لبنى أسد والقطنة والق طئة بكسر الطاءمثال المعدة والمعدة التى تكون مع
  لكرش وهى ذات الاطباق التى تسميها العامة الرمّانة وكسر الطاءفيه أجود وقطنسة لقب
  رجسل وهو ثابت قطعة العتكىّ والاسمَاء المعارف تضاف الى ألقابها وتكون الالقاب
  معارف وتتعرّف بها الاسماء كماقيل قيس قفة وزيديطة وسعيد كرز والقطن معروف والقطنة
  أخص منه وأماقول الراجز
  محاج.
