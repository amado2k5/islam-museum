text: "… على فاقةٍ، لا أفلّح مَنْ نَدِم! اللهمّ إنك تعلم أنّى لم أكن أَحبُّ البقاءً فى الدنيا لكَرْى الأنهارِ ولا لغرس الأشجارِ، ولكن كنت أُحبُّ البقاءَ لمكابدة الليل الطويل ولظمأ الهواجر فى الحُرّ الشديد ولمزاحةِ العلماء بالرُكَبِ فى حِلّق الذِّكر. الهجيرى …"
