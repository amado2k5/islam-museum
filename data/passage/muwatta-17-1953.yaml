label: { ar: "الموطأ 1953 — مالك: في الرجل يشتري المتاع بالذهب أو الورق، والصرف يوم اشتراه عشرة دراهم بدينار، فيقدم به بلدا فيبيعه مرابحة على صرف يوم البيع: إن كان المبتاع بالخيار إن لم يفت المتاع، فإن فات كان للمشتري بالثمن الذي ابتاعه به البائع", en: "Muwatta 1953" }
summary:
  ar: "قال مالك في الرجل يشتري المتاع بالذهب أو الورق، والصرف يوم اشتراه عشرة دراهم بدينار، فيقدم به بلدا فيبيعه مرابحة، أو يبيعه حيث اشتراه مرابحة على صرف ذلك اليوم الذي باعه فيه: فإنه إن كان ابتاعه بدراهم وباعه بدنانير، أو ابتاعه بدنانير وباعه بدراهم، وكان المتاع لم يفت، فالمبتاع بالخيار: إن شاء أخذه، وإن شاء تركه. فإن فات المتاع، كان للمشتري بالثمن الذي ابتاعه به البائع، ويحسب للبائع الربح على ما اشتراه به على ما ربحه المبتاع. {cite:muwatta-maruf-1997 p.199}"
