label: { ar: "الموطأ 1953 — مالك: في الرجل يشتري المتاع بالذهب أو الورق، والصرف يوم اشتراه عشرة دراهم بدينار، فيقدم به بلدا فيبيعه مرابحة على صرف يوم البيع: إن كان المبتاع بالخيار إن لم يفت المتاع، فإن فات كان للمشتري بالثمن الذي ابتاعه به البائع", en: "Muwatta 1953", es: "Muwatta 1953", fr: "Muwatta 1953", ur: "موطا 1953", tr: "El-Muvatta 1953 — Malik: Altın veya kağıt para ile mal satın alan ve satın aldığı günkü döviz kurunun 1 dinar karşılığında 10 dirhem olduğu bir kişi, bu malları bir ülkeye götürüp, satış günündeki döviz kuruna göre kârla satarsa: Eğer alıcının, mallar kaybolmazsa satışı iptal etme seçeneği varsa, mallar kaybolursa alıcı, satıcının malları satın aldığı fiyattan geri alır.", id: "Al-Muwatta 1953 — Malik: Mengenai seorang pria yang membeli barang dengan emas atau uang kertas, dan nilai tukar pada hari ia membelinya adalah sepuluh dirham untuk satu dinar, kemudian ia membawanya ke suatu negara dan menjualnya dengan keuntungan berdasarkan nilai tukar pada hari penjualan: Jika pembeli memiliki pilihan untuk membatalkan penjualan jika barang tersebut tidak hilang, maka jika barang tersebut hilang, pembeli mendapatkan harga yang dibayarkan penjual saat membelinya." }
summary:
  ar: "قال مالك في الرجل يشتري المتاع بالذهب أو الورق، والصرف يوم اشتراه عشرة دراهم بدينار، فيقدم به بلدا فيبيعه مرابحة، أو يبيعه حيث اشتراه مرابحة على صرف ذلك اليوم الذي باعه فيه: فإنه إن كان ابتاعه بدراهم وباعه بدنانير، أو ابتاعه بدنانير وباعه بدراهم، وكان المتاع لم يفت، فالمبتاع بالخيار: إن شاء أخذه، وإن شاء تركه. فإن فات المتاع، كان للمشتري بالثمن الذي ابتاعه به البائع، ويحسب للبائع الربح على ما اشتراه به على ما ربحه المبتاع. {cite:muwatta-maruf-1997 p.199}"
  tr: "Malik, altın veya gümüşle mal satın alan ve satın alma günündeki döviz kurunun bir dinara on dirhem olduğunu, sonra bu malları bir şehre götürüp kârla satan veya satın aldığı yerde o günkü döviz kuruna göre kârla satan bir adam hakkında şöyle demiştir: Eğer malları dirhemle alıp dinara satmışsa veya dinara alıp dirhemle satmışsa ve mallar hala mevcutsa, alıcının seçeneği vardır: İsterse alabilir, isterse bırakabilir. Mallar mevcutsa, alıcı satıcının satın aldığı fiyata hak kazanır ve satıcı da alıcının kazandığı kâra göre hak kazanır. {cite:muwatta-maruf-1997 s.199}"
  id: "Malik berkata mengenai seorang pria yang membeli barang dengan emas atau perak, dan nilai tukar pada hari pembelian adalah sepuluh dirham untuk satu dinar, lalu membawanya ke suatu kota dan menjualnya dengan keuntungan, atau menjualnya di tempat pembelian dengan keuntungan berdasarkan nilai tukar pada hari itu: jika ia membelinya dengan dirham dan menjualnya dengan dinar, atau membelinya dengan dinar dan menjualnya dengan dirham, dan barang tersebut masih tersedia, maka pembeli memiliki pilihan: jika ia mau, ia dapat mengambilnya, dan jika ia mau, ia dapat meninggalkannya. Jika barang tersebut masih tersedia, maka pembeli berhak atas harga pembelian oleh penjual, dan penjual berhak atas keuntungan berdasarkan apa yang diperoleh pembeli. {cite:muwatta-maruf-1997 p.199}"
