label: { ar: "صحيح البخاري 4538 — طاعة الله ورسوله، الطاعة", en: "Sahih al-Bukhari 4538 — obedience to God and His Messenger; obedience", ur: "صحیح بخاری 4538 — اللہ اور اس کے رسول کی اطاعت، اطاعت", fr: "Sahih al-Bukhari 4538 — l'obéissance à Dieu et à Son Messager ; l'obéissance", es: "Sahih al-Bujari 4538 — la obediencia a Dios y a Su Mensajero; la obediencia", tr: "Sahih el-Buhari 4538 — Allah'a ve Resulüne İtaat, itaat", id: "Sahih al-Bukhari 4538 — Ketaatan kepada Allah dan Rasul-Nya, ketaatan" }
text: "… نَعْلَمُ. فَقَالَ ابْنُ عَبَّاسٍ فِي نَفْسِي مِنْهَا شَىْءٌ يَا أَمِيرَ الْمُؤْمِنِينَ. قَالَ عُمَرُ يَا ابْنَ أَخِي قُلْ وَلاَ تَحْقِرْ نَفْسَكَ. قَالَ ابْنُ عَبَّاسٍ ضُرِبَتْ مَثَلاً لِعَمَلٍ. قَالَ عُمَرُ أَىُّ عَمَلٍ قَالَ ابْنُ عَبَّاسٍ لِعَمَلٍ. قَالَ عُمَرُ لِرَجُلٍ غَنِيٍّ يَعْمَلُ بِطَاعَةِ اللَّهِ عَزَّ وَجَلَّ، ثُمَّ بَعَثَ اللَّهُ لَهُ الشَّيْطَانَ فَعَمِلَ بِالْمَعَاصِي حَتَّى أَغْرَقَ أَعْمَالَهُ. {فَصُرْهُنَّ} قَطِّعْهُنَّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4538، يرد فيه ذكر طاعة الله ورسوله، والطاعة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 4538 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), whose wording mentions obedience to God and His Messenger, obedience. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 4538، جس کے الفاظ میں اللہ اور اس کے رسول کی اطاعت، اطاعت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 4538, dont le texte mentionne l'obéissance à Dieu et à Son Messager, l'obéissance. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 4538, cuyo texto menciona la obediencia a Dios y a Su Mensajero, la obediencia. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 4538 numaralı hadis, Allah'a ve Resulüne itaatten bahsetmektedir. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4538, menyebutkan ketaatan kepada Allah dan Rasul-Nya. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
