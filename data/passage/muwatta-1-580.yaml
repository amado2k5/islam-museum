text: "اللهم إني أسألك فعل الخيرات، وترك المنكرات، وحب المساكين. وإذا أردت في الناس فتنة، فاقبضني إليك غير مفتون"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن النبي كان يدعو فيسأل الله فعل الخيرات وترك المنكرات وحب المساكين، وأن يقبضه إليه غير مفتون إذا أراد في الناس فتنة. ويذكر المحقق أن في نسخة «أدرت»، وأن أبا مصعب وسويداً روياه عن مالك عن يحيى بن سعيد أن النبي، وينقل عن ابن عبد البر ⁦(التمهيد 24/321–325)⁩ أنه لا يعرفه بهذه الألفاظ إلا في حديث عبد الرحمن بن عائش الحضرمي وهو حديث حسن رواه الثقات، وأنه روي من حديث ابن عباس ومعاذ بن جبل وثوبان وأبي أمامة. ويضيف المحقق أن عبد الرحمن بن عائش لم يسمع من النبي كما نص عليه البخاري والترمذي وأحمد وأبو حاتم، لكنه روي عنه عن مالك بن يخامر عن معاذ بن جبل عند أحمد (5/243) والترمذي (3235) وقال: حسن صحيح، وأن حديث ابن عباس عند عبد الرزاق وأحمد والترمذي ⁦(3233 و3234)⁩ حديث معلول. {cite:muwatta-maruf-1997 p.299} {cite:muwatta-maruf-1997 p.300}"
  id: "Malik meriwayatkan bahwa ia mendengar Nabi (shalawat dan salam kepadanya) biasa berdoa, memohon kepada Allah agar Dia mampu melakukan amal kebaikan, meninggalkan kejahatan, mencintai orang miskin, dan menerima mereka kepada-Nya tanpa tergoda jika Dia berkehendak untuk mendatangkan godaan di antara manusia. Editor mencatat bahwa dalam satu versi, itu adalah “adart,” dan bahwa Abu Mus’ab dan Suwaid meriwayatkannya dari Malik, atas otoritas Yahya ibn Sa’id, atas otoritas Nabi (shalawat dan salam kepadanya). Ia mengutip Ibn ‘Abd al-Barr (al-Tamhid 24/321–325) yang mengatakan bahwa ia hanya mengetahuinya dengan kata-kata persis ini dalam hadits ‘Abd al-Rahman ibn ‘A’ish al-Hadrami, yang merupakan hadits sahih yang diriwayatkan oleh perawi terpercaya. Hadits ini juga diriwayatkan atas otoritas Ibn ‘Abbas, Mu’adh ibn Jabal, Thawban, dan Abu Umamah. Penyunting menambahkan bahwa ‘Abd al-Rahman ibn ‘A’ish tidak mendengarnya langsung dari Nabi (shalawat dan salam kepadanya), sebagaimana dinyatakan oleh al-Bukhari, al-Tirmidhi, Ahmad, dan Abu Hatim. Namun, hadits tersebut diriwayatkan atas otoritasnya dari Malik ibn Yakhamir, atas otoritas Mu’adh ibn Jabal, dalam kumpulan hadits Ahmad (5/243) dan al-Tirmidhi (3235), yang menyatakan bahwa hadits tersebut sahih dan autentik. Hadits Ibnu Abbas, sebagaimana diriwayatkan oleh ‘Abd al-Razzaq, Ahmad, dan al-Tirmidhi (3233 dan 3234), adalah hadits yang cacat. {cite:muwatta-maruf-1997 p.299} {cite:muwatta-maruf-1997 p.300}"
