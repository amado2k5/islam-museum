label: { ar: "الموطأ 580 — بلاغ: اللهم إني أسألك فعل الخيرات وترك المنكرات وحب المساكين", en: "Muwatta 580" }
text: "اللهم إني أسألك فعل الخيرات، وترك المنكرات، وحب المساكين. وإذا أردت في الناس فتنة، فاقبضني إليك غير مفتون"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن النبي كان يدعو فيسأل الله فعل الخيرات وترك المنكرات وحب المساكين، وأن يقبضه إليه غير مفتون إذا أراد في الناس فتنة. ويذكر المحقق أن في نسخة «أدرت»، وأن أبا مصعب وسويداً روياه عن مالك عن يحيى بن سعيد أن النبي، وينقل عن ابن عبد البر (التمهيد 24/321–325) أنه لا يعرفه بهذه الألفاظ إلا في حديث عبد الرحمن بن عائش الحضرمي وهو حديث حسن رواه الثقات، وأنه روي من حديث ابن عباس ومعاذ بن جبل وثوبان وأبي أمامة. ويضيف المحقق أن عبد الرحمن بن عائش لم يسمع من النبي كما نص عليه البخاري والترمذي وأحمد وأبو حاتم، لكنه روي عنه عن مالك بن يخامر عن معاذ بن جبل عند أحمد (5/243) والترمذي (3235) وقال: حسن صحيح، وأن حديث ابن عباس عند عبد الرزاق وأحمد والترمذي (3233 و3234) حديث معلول. {cite:muwatta-maruf-1997 p.299} {cite:muwatta-maruf-1997 p.300}"
