label: { ar: "الموطأ 1250 — عبد الرحمن بن أبي ليلى عن كعب بن عجرة: أذاه القمل في رأسه وهو محرم، فأمره النبي أن يحلق، وخيره في الصيام أو الإطعام أو النسك", en: "Muwatta 1250" }
text: "أو أطعِمْ سِتَةَ مَساكِينَ، مُدَّينِ مُدَّينِ لِكُلِّ إنسانٍ"
summary:
  ar: "يروي مالك عن عبد الكريم بن مالك الجزري عن عبد الرحمن بن أبي ليلى عن كعب بن عجرة أنه كان مع رسول الله محرما، فآذاه القمل في رأسه، فأمره أن يحلق رأسه، وقال صم ثلاثة أيام أو أطعم ستة مساكين، مدين مدين لكل إنسان، أو انسك بشاة، أي ذلك فعلت أجزأ عنك. ويذكر المحقق أن ابن عبد البر رأى الصواب إثبات مجاهد بين عبد الكريم وابن أبي ليلى. {cite:muwatta-maruf-1997 p.556}"
