label: { ar: "الموطأ 1250 — عبد الرحمن بن أبي ليلى عن كعب بن عجرة: أذاه القمل في رأسه وهو محرم، فأمره النبي أن يحلق، وخيره في الصيام أو الإطعام أو النسك", en: "Muwatta 1250", es: "1250 Muwatta", fr: "1250 Muwatta", ur: "1250 موطا", tr: "El-Muvatta 1250 — Abdülrahman ibn Abi Leyla, Ka'b ibn Ujrah'tan rivayetle: İhramlı haldeyken başında bitlerden rahatsız oldu. Bunun üzerine Peygamber ona tıraş olmasını emretti ve oruç tutmak, fakirleri doyurmak veya kurban kesmek arasında seçim yapma şansı verdi.", id: "Al-Muwatta 1250 — Abd al-Rahman ibn Abi Layla berdasarkan riwayat Ka’b ibn ‘Ujrah: Ia terganggu oleh kutu di kepalanya saat dalam keadaan ihram, sehingga Nabi memerintahkannya untuk bercukur, dan memberinya pilihan untuk berpuasa, memberi makan fakir miskin, atau melakukan penyembelihan hewan kurban." }
text: "أو أطعِمْ سِتَةَ مَساكِينَ، مُدَّينِ مُدَّينِ لِكُلِّ إنسانٍ"
summary:
  ar: "يروي مالك عن عبد الكريم بن مالك الجزري عن عبد الرحمن بن أبي ليلى عن كعب بن عجرة أنه كان مع رسول الله محرما، فآذاه القمل في رأسه، فأمره أن يحلق رأسه، وقال صم ثلاثة أيام أو أطعم ستة مساكين، مدين مدين لكل إنسان، أو انسك بشاة، أي ذلك فعلت أجزأ عنك. ويذكر المحقق أن ابن عبد البر رأى الصواب إثبات مجاهد بين عبد الكريم وابن أبي ليلى. {cite:muwatta-maruf-1997 p.556}"
  tr: "Malik, Abdülkerim ibn Malik el-Cezari'den, o da Abdülrahman ibn Abi Leyla'dan, o da Ka'b ibn Ujrah'tan rivayetle, Allah Resulü ile ihram (dini kutsama) halindeyken başının bitlendiğini anlatır. Peygamber ona başını tıraş etmesini emretti ve şöyle dedi: \"Üç gün oruç tut, ya da altı fakire iki mudd (bir ölçü tahıl) vererek yemek yedir, ya da bir koyun kurban et. Hangisini yaparsan yeter.\" Araştırmacı, İbn Abdülberr'in Mücahid'i Abdülkerim ve İbn Abi Leyla arasına dahil etmeyi doğru bulduğunu belirtiyor. {cite:muwatta-maruf-1997 s.556}"
  id: "Malik meriwayatkan dari Abd al-Karim ibn Malik al-Jazari, dari Abd al-Rahman ibn Abi Layla, dari Ka'b ibn Ujrah, bahwa ia bersama Rasulullah SAW dalam keadaan ihram (penyucian ritual), dan kutu menyerang kepalanya. Nabi memerintahkannya untuk mencukur kepalanya dan berkata, \"Berpuasalah selama tiga hari, atau berilah makan enam orang miskin, berikan dua mudd (ukuran biji-bijian) kepada masing-masing, atau persembahkan seekor domba sebagai kurban. Mana pun yang kamu lakukan sudah cukup.\" Peneliti mencatat bahwa Ibnu Abd al-Barr menganggap tepat untuk memasukkan Mujahid di antara Abd al-Karim dan Ibnu Abi Layla. {cite:muwatta-maruf-1997 p.556}"
