  tr: "\"İslam Tarihi ve Ünlü Şahsiyetlerin Ölümleri\" adlı resimli cilt 40'ın 169. sayfasından, esprili bir anekdot veya mizahi bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 40, halaman 169, berisi anekdot cerdas atau cerita lucu; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
