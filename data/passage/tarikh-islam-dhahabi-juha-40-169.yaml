text: "… يظهر له شيء. تُوُفّي بدمشق في صَفَر. - حرف الياء - - ياقوت. أبو الدُّرّ الرُّوميّ، التّاجر، السّفّار، عتيق عُبَيْد الله بن أحمد بن البخاريّ. سمع معه من ابن هَزَارْمُرْد الصَّرِيْفِينيّ كتاب المُزاح والفُكاهة للزُّبَير، وسمع مجالس المخلّص. قال ابن …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 40، ص 169، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, scan volume 40, p. 169, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الاسلام والفاعیۃ المشاہیر والعالم، اسکین جلد 40، ص 169 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
