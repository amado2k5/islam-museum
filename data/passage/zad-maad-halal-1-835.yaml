text: "… حراماً، لَبَيَّنَها له رسولُ اللَّه وَلِيفِ، وإن كانت قد حرمت عليه. قالوا : وفي صحيح البخاري، من حديث القاسم بن محمد، عن عائشة أمِّ المؤمنين، أن رجلاً طلق امرأته ثلاثاً، فتزوَّجت، فطلقت، فسئل رسول اللَّه عَطِه، أتحل للأول؟ قال: لَا …"
