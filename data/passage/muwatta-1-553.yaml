label: { ar: "الموطأ 553 — مالك: عزائم سجود القرآن إحدى عشرة سجدة ليس في المفصل منها شيء", en: "Muwatta 553", es: "Muwatta 553", fr: "Muwatta 553", ur: "موطا 553", tr: "El-Muvatta 553 — Malik: Kur'an'da farz olan on bir secde vardır ve bunların hiçbiri Mufassal'da (Kur'an'ın son bölümünde) yer almaz.", id: "Al-Muwatta 553 — Malik: Sujud wajib dalam Al-Qur'an ada sebelas, dan tidak satu pun di antaranya terdapat dalam Mufassal (bagian terakhir Al-Qur'an)." }
summary:
  ar: "يقول يحيى: قال مالك: الأمر عندنا أن عزائم سجود القرآن إحدى عشرة سجدة، ليس في المفصل منها شيء. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأن قوله «قال يحيى» ليس في نسخة م. {cite:muwatta-maruf-1997 p.284}"
  tr: "Yahya şöyle diyor: Malik dedi ki: Bizde yerleşik uygulama, Kur'an'da farz olan secde sayısının on bir olduğudur ve bunların hiçbiri Mufassal'da (Kur'an'ın son bölümünde) bulunmamaktadır. Editör, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini ve \"Yahya dedi ki\" ifadesinin M el yazmasında bulunmadığını belirtiyor. {cite:muwatta-maruf-1997 s.284}"
  id: "Yahya berkata: Malik berkata: Kebiasaan yang telah mapan di antara kita adalah bahwa sujud wajib dalam Al-Quran ada sebelas, dan tidak satu pun di antaranya terdapat dalam Mufassal (bagian terakhir Al-Quran). Editor mencatat bahwa Abu Mus'ab meriwayatkan hal ini dari Malik, dan bahwa frasa \"Yahya berkata\" tidak ada dalam manuskrip M. {cite:muwatta-maruf-1997 p.284}"
