text: |-
  ٤٠
  *⁦(باب الفاه)⁩
  •⁦(ضفف)⁩
  دثل وههج هامج وشي صيفى قال الشاءر
  انّ بنىّ صبية صيفيون • أفلح من كان لهربعيون
  والصيف أيضا المطار الدء يجى فى الصف والمصيف المعوج من مجارى الما وأصله من صاف
  أى عدل كالمضيق من ضاق ومنه قول أبي ذويب
  جوار--هاتأرى الشعوف دوائبا • وتنصب ألها بامصيفا كرابها
  ويوم صائف أى حارّ وايلة صائفة وربما قالوايوم صاف بمعسن صائم كما فالو ايوم راح ويوم
  طان وعاملت الرجل مصابفة أى أيام الصيف مثل المشاهرة والمياومة والمعاومة وصائفة
  القوم مبرتهم فى الصيف والصائفة غزوة الروم لانهم يغزون صيفالمكان البرد والثلج وصاف
  بالمكان أى أقام به الصيف واصطاف مثله والموضع مصيف ومصطاف وصدما أى آصاببا
  مطر الصيف وهو فعلنا على مالم يسمّ قاعله مثل خرفنا وربعنا وصيفت الارض فهى مصية
  ومصيوفة اذا أصابها مطر الصيف وصاف السهم عى الهدف يصف صيفا وصيفوفة أى
  عدل وأصاف الرجل أى ولدله على الكبر وولده صبفى وصبفى أيضا اسم رجل وهو صيفى
  ابن أكتم وأصاف القوم أى دخلوا فى الصيف وأصاف اللّٰه عنى شرّفلان أى صرفه وعدل
  به رصفى هذا الشى أى كفانى لصيفتى ومنه قول الراجز
  من يك ذابت فهذابتى • مقيظ مصيف مشق
  وقول أب كبيراله ذلىّ
  ولقد وردت المالم يشرب به * حدّالربيع الى شهور الصيفَ
  يعى به مطر الصيف الواحدة صيفة بقال أصابتناصيفة غزيرة بتشديد الياء وتصيف من
  لصيف كما تقول تنتق من الشتاء
  سل الضاد عف) الضعف والضعف خلاف القوة وقد ضعف فهو ضعيف
  وأَضعفه غيره وقوم ضعاف وضعفا وضعفة واستضعفه أى عدّه ضعيفا وذكر انخليل أن
  التضعيف أن يزاد على أصل الشى فيجعل مثاين أوأكثروكذلك الاضعاف والمضاعفة يقال
  -عفت الشئ وأضعفته وضاعفته بعن وضعف الشئ مثله وضعفاء مثلاه وأضعافه أمثاله
  وقوه تعالى اذ الا ذقناك ضعف الحياة وضعف المعات أى ضعف العذاب حيا وميتا يقول
  أضعضالك العذاب فى الديشا والا خرة وقولهم وقع فلان فى أضعاف كتابديرادبه توقيعه
  فى أثناه السطور أوالحاشية وأضعف القوم أى ضوعف لهم وأضعفت الشئفهومضعوف
  على غير قياس عن أبى عمرو قال لبيد
  وعالين مضعوفا وفرداسعوطه • بحان وهر جان يشك المفاصلا
  وأضعف الرجل ضعفت دابته يقال هو ضعيف مضعف فالضعيف فى بدنه والمضعف فى داته كما
  يقال قوى مقو وضعفه السيرأى أضعفه والتضعيف أيضا أن تنسبه الى الضعف
  والمضاعفة الدرع التى نسجت حلقتين -لمقتين غف قال ابن السكيت الضفف كثرة
  العيال وأنتدابشير بن النكث
  قد احتذى عن الدماء وانتعل * وكبرالله وسمى ونزل
  يمنزل ينزله بنو عمل • لاضفف يتغل ولا ثقل
