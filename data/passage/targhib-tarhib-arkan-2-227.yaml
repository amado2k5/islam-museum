text: "… صلة الرحم وان قطعت والترهيب من قطعها.. - عن أبى هريرة أن رسول انته قال ومن كان يؤمن باللّه واليوم الآخر فليكرم ضيفه ومن كان يؤمن بالله واليوم الاخر فليصل ريحه ومن كان يؤمن بالله واليوم الاخر فليل خيرا أوليصمت …"
summary:
