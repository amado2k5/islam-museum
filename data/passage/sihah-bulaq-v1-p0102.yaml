text: |-
  ⁦(مخض)⁩
  ٥٣٩
  •ن لفظها وأنشد للطرماح
  سوف تدنيك من لميس سبنتا :أمارت بالبول ماء الكراض
  أضرته عشر ين يوماونيلت • حين نيات يعارة فى عراض
  وقال أبو عبيدة واحدتها كرضة بااضم
  صل اللام ( ا ض ليل اضلاض أى حاذق واضاضته كثرة تلفته يينا وشمالا
  قال الراجز وبلدة تغبى على اللضلاض
  صل الميم عض الاض الابن الخالص وهو الذى لم يخالطه الماء-المواكان
  أوحامضا ولا يسمى اللبن محضا الااذا كان كذلك ورجل ماحض أى ذو محض كقولك تامر
  ولا بن ومحفت الرجل ستيته المحفر وكذلك الامحاض وامتهضت أنا قال الراجز
  امتحضا وسقيانى الضيحا • فقد كفيت صاحبى" الميحا
  ويقال أيضا محضته الودّ وأمحضته وكل شى أخلصته فقد أهجضته وأنشد الكسائى
  قل للغوائى أما فيكن فاتكة • تعلو اللئيم بضرب فيه إمحاض
  وعربى محض أى خالص النسب الذكر والاننى والجمع فيه سواء وان شقت أنات وثنيت ويحعت
  مثل قلب وجمحت وقد محض بالضم محوضة أى صار محضا فى حسبه ( مخض مخضت اللبن
  أمخضه وأفخضه وأمخضه ثلاث لغات والممفضة الابريج والمخيض والممخوض اللبن الذى
  قد مخض وأخذز بده وأمخض اللبن أى حان له أن يمخض وتخض اللبن وامتخض أى تحرّك
  وكذلك الولد اذاتحرك فى بطن الحامل قال عروين حسان أحدبى الحرث بن همام بن مرة
  فى المعخضة يخاطب امر أته
  ألا با أم عمرو لا تلومى • وأبقى اغماذا الناس هام
  أجتذهل رأيت أباقبيس • أطال حياته النعم الركام
  وكسرى اذ تقسمسه بنوه • باسياف كمافتسم اللعام
  تخضت المنون له يوم • أنى واكل حاملة تمام
  فجعل قوله تخضت ينوب مناب قوله لقحت بولد لانها ما تحخضت بالولد الاوق_داقت وقوله أنى
  أى حان ولادته لتمام أيام الحمل والمخاض وجع الولادة وقد مخضت الناقة بالكسر تخض
  مخاضامثل سمع سماعا وكل حامل ضر بها الطلق فهى ماخض والجمع مخض والخرض أيضا
  الحوامل من النوق واحدتها خلفة ولا واحدلها من افظها ومنه قيل للفصيل اذا
  استكمل الحول ودخل فى الثانية ابن مخاض والاتى ابنة مخناض لانه فصل عن
  أمه وألحقت أمه بالمخاض سواء لقعت أو لم تلقح وابن مخاض نكرة قاذا أردت تعريفه
  أدخلت عليه الالف واللام الاأنه تعريف جنس قال الشاعر
  وجدنا شلافضات فقيما * كفضل ابن المخاض على الفصيل
  ولا يقال فى الجممع الابنات مخاض وييات لبون وبنات آوى قال الفرا مخضت
  بالدلواذانهزت بج افى البئر وأنشد
  ان لنا قليذماهموما * يريدها مخصَّ الدلاجوما ويروى مخبج الدلا
