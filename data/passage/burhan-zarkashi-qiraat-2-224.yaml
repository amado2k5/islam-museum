label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 224 — القراء، جمع القرآن والمصاحف", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 224 — the readers; the collection of the Qur'an and the codices", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 224 — قراء، جمعِ قرآن اور مصاحف", es: "Al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, escaneo del volumen 2, pág. 224: los lectores; la colección del Corán y los códices." }
text: "… ذكره. وبعض العرب يجعل همزة الوصل فيما ذكرنا بين بين، ويقول : الحسن عندك وآيمن الله يمينك فيما ذكرنا، وقد جاء عن القراء بالوجهين في مثل ذلك، والمشهور الأول. وقد أشار الصحابةم إلى التسهيل بين بين في رسم المصاحف العثمانية، …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 224، يذكر القراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 224, that mentions the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 224 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen 2, pág. 224, que menciona a los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
