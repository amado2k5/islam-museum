text: "… خولنجان ومثله دارصيني، وخمسة مثاقيل دارفلفل، تدقّ هذه الأدوية وتطرح عليه، وتخلط وتجعل في جرة خضراء، ويؤخذ منه مثل الجوزة على كل حال. معجون الأثاناسيا الكبرى التي بكبد الذئب : النافع لأوجاع الكبد، والطحال، والمعدة والرياح، والدوسنطاريا، والسعال المزمن. وللذين …"
summary:
