text: "… مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنِ ابْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، أَنَّ أُمَّ مُبَشِّرٍ، قَالَتْ لِلنَّبِيِّ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ مَا يُتَّهَمُ بِكَ يَا رَسُولَ اللَّهِ فَإِنِّي لاَ أَتَّهِمُ بِابْنِي شَيْئًا إِلاَّ الشَّاةَ الْمَسْمُومَةَ الَّتِي أَكَلَ مَعَكَ بِخَيْبَرَ. وَقَالَ النَّبِيُّ \" وَأَنَا لاَ أَتَّهِمُ بِنَفْسِي إِلاَّ ذَلِكَ فَهَذَا أَوَانُ قَطَعَتْ أَبْهَرِي \". قَالَ أَبُو دَاوُدَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4513، يذكر مرض النبي، والمرض والمريض، وأعضاء البدن، والسم والترياق. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4513 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions the Prophet's illness, illness and the sick, the organs of the body, poison and antidote. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4513، جس میں نبی کی بیماری، بیماری اور بیمار، اعضائے بدن، زہر اور تریاق کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
