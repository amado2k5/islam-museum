text: "… مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنِ ابْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، أَنَّ أُمَّ مُبَشِّرٍ، قَالَتْ لِلنَّبِيِّ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ مَا يُتَّهَمُ بِكَ يَا رَسُولَ اللَّهِ فَإِنِّي لاَ أَتَّهِمُ بِابْنِي شَيْئًا إِلاَّ الشَّاةَ الْمَسْمُومَةَ الَّتِي أَكَلَ مَعَكَ بِخَيْبَرَ. وَقَالَ النَّبِيُّ \" وَأَنَا لاَ أَتَّهِمُ بِنَفْسِي إِلاَّ ذَلِكَ فَهَذَا أَوَانُ قَطَعَتْ أَبْهَرِي \". قَالَ أَبُو دَاوُدَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4513، يذكر مرض النبي، والمرض والمريض، وأعضاء البدن، والسم والترياق. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4513 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions the Prophet's illness, illness and the sick, the organs of the body, poison and antidote. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4513، جس میں نبی کی بیماری، بیماری اور بیمار، اعضائے بدن، زہر اور تریاق کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4513 (Tipos de sangre - Sabiduría (Kitab Al-Diyat)), menciona la enfermedad del Profeta, la enfermedad y los enfermos, los órganos del cuerpo, el veneno y el antídoto. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 4513 (Types de sang – Kitab Al-Diyat), mentionne la maladie du Prophète, la maladie et les malades, les organes du corps, les poisons et leurs antidotes. Le navigateur de ressources médicales le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sünen Ebu Davud'da yer alan 4513 numaralı hadiste, Peygamberimizin hastalığı, hastalık ve hasta, vücut organları, zehir ve panzehirden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4513, menyebutkan penyakit Nabi, penyakit dan pasiennya, organ tubuh, racun, dan penawarnya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
