text: "… فيهِ خيرًا كثيرًا. وفي الحديث الصحيح : لا يَفْرك مؤمن مؤمنة : إن كره منها خُلقًا رضي منها خلقًا آخر. إلا أن البغض قد يتضاعف، ويشتد الشقاق، ويصعب العلاج، وينفد الصبر، ويذهب ما أسس عليه البيت من السكن والمودة، والرحمة، …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 323، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 323, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 323 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
