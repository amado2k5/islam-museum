text: |-
  ٣٨٠م
  • ⁦(ف صل الزاى)⁩:
  وقال بعضهم زابن وقال بعضهم زبنية مثال عفرية قال والعرب لا تكاد تعرف هذا وتجعل
  من الجع الذي لاواحدله من افظه مثل أبابيل وعباديد ورحل فيه زيونة بتشديد الياء
  أى كبرورجل ذوزيونة أى مانع جانبه قال سوار بن المضرب
  بدبي الذمّ عن حسبى بمالى * وزيونات أشوس تيحان
  وزبانيا العقرب قرناها والز بانيان كوكبان نيران وهمافرنا المة رب ينزلهما القمر وزبان
  اسم رجل والمزابنة بيع الرطب فى روس النخل بالتمرونهى عن ذلك لانه بيع مجازفة من غير
  كيل ولاوزن ورخص فى العرايا والزسنة قد فسرنا، فى الحزعة وأمّا الزيون للغى والحريف
  فليس من كلام أهل البادية ⁦(زحن)⁩ زحن يزحن زحنا أبطأ وتزحن مثله ويقال تزحن على
  الشئء اذا فعله مع كراهبة له. رجن لزرجون بالحريك الهرويقال السكرم قال الراجز
  كان باليرناه المعلول • ماءدوالى زرجون ميل
  قال الاصمحى وهى فارسية معزية أى لون الذهب وقال الجرمى هو صبغ أحر رفن
  الزرفين والزرفين فارسى معرّب وقد زرفن صسدغيه كلمة مولدة⁦(زفن)⁩ الزفز الرقص وقد
  زفن يرفن ويقال الزيفن الشديد ⁦(زقن)⁩ زقنت الحمل أزقه زقنا اذا حلته وأزقت فلانا
  أعنته على المل ( كن زكنته بالكسر أز كنه زكتا بالتهريك أى علته قال ابن أم
  صاحب وان يراجع قابى ودّهم أبدا * زكنت منهم على مثل الذى ز كنوا
  قوله على مقدمة الاصمعى "التزكيز التشبيه يقال زكن عليهم وزكم أى شبه عليهم وليس
  والزكن بالتهريك أيضا التفرس والظن يقال زكنته صالحا أى ظنقته ولا يقال منه رجل
  زكن وهو أذ كن من اياس وهواياس بن معاوية المرّى وقد أز كنته وان كانت العامّة
  قدأ ولعت يهوانما يتال أزكنتمشيأ بمعنى أعلمتها يادوأفهمته حتى ذكنه ⁦(زمن)⁩ الزمن
  والزمان اسم لقليل الوقت وكثيره ومجمع على أزمان وأزحنة وأزمن ولة ينهذات الزمين تزيد
  بذلك تراخى الوقت كما يقال لقيته ذات العويم أى بين الاءوام الكسائى عاملته حزامنة
  من الزمن كايقال مشاهرة من الشهر والزمانة آفة فى الحيوانات ورجل زمن أى مبتلى بين
  الزمانة وزمان بكسر الزاى أبوحى من بكروه وزمان بن قيم اللّٰه بن تعلبة بن عكابه بن صع
  ابن على بن بكربن وائل ومنهم الفند الزمانى (زنن أرننته بشى اتهمته به وهويزن بكذا
  ان كنت أزننتنى بها كذبا • جزم فلاقت مثلهاءلا
  ويقال أزنه بالاحر مثل أظنه اذاا تهمه وأيوزنة كتية القرد ون لزون الصتم وكل شئ
  يتغذونه آلهة ويعبد قال جرير
  تمنى بها البقرالمونى أكرعه• مشى الهرابذ تبغى بيعة الزون
  وهومثل الزور ورجل زون بالتشديد أى قصير والمرأة زونة والزونزى القصير والزوان حب
  يخالط البرّ والزوان بالضم مثل وقديهمن ⁦(زين)⁩ الزينة مايتزين به ويوم الزينة يوم العيد
  والزين نقيض الشين وزانه وزينه يمعنى قال المجنون
  فيارب اذصيرت ايلى لى الهوى • فزنى لعينيها كمازنتها ليا
  ورجل مزين أى مقذذ الشهر والجام مزين وتزين وازدان عمعسنى وهوافعسل من الزينة
  إلا أنّ التاء لما لان مخرجها ولم نوافق الزاى لشذتها أبدلوا منهاد الاف ومردان وان أدخمن
  عاب
