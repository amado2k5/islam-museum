summary:
  ar: "القسم 17 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب سجود القرآن»، ويضم فيها النصوص من 1067 إلى 1079 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 17 of Sahih al-Bukhari (Prostration During Recital of Qur'an) in the division of the open hadith dataset the museum took its reports from: reports 1067 to 1079 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 17، عنوان «کتاب سجود القرآن»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1067 تا 1079۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 17 de Sahih al-Bukhari (Postración durante la recitación del Corán) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1067 al 1079 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 17, Prosternation lors de la récitation du Coran), plus précisément des hadiths 1067 à 1079, classés dans ce recueil. Les éditions imprimées présentent une classification et une numérotation différentes."
