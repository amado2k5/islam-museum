text: "- - الجزية عمّن أسلم من أهل الذمة من أهل مصر، وألحق فى الديوان صلح من أسلم منهم فى عشائر من أسلموا على يديه. قال : وقال غير عبد الملك، وكانت تؤخذ قبل ذلك ممن أسلم. وأول من أخذ الجزية …"
