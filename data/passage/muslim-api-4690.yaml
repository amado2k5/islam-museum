label: { ar: "صحيح مسلم 4690 — المرض والمريض، مداواة الجراح", en: "Sahih Muslim 4690 — illness and the sick; the treatment of wounds", ur: "صحیح مسلم 4690 — بیماری اور بیمار، زخموں کا علاج", es: "Sahih Muslim 4690 — La enfermedad y los enfermos; el tratamiento de las heridas", fr: "Sahih Muslim 4690 — La maladie et les malades; le traitement des plaies", tr: "Sahih Muslim 4690 — Hastalık ve Hasta, Yaraların Tedavisi", id: "Sahih Muslim 4690 — Penyakit dan Pasien, Pengobatan Luka" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ الرَّحِيمِ بْنُ سُلَيْمَانَ، عَنْ هِشَامٍ، عَنْ حَفْصَةَ، بِنْتِ سِيرِينَ عَنْ أُمِّ عَطِيَّةَ الأَنْصَارِيَّةِ، قَالَتْ غَزَوْتُ مَعَ رَسُولِ اللَّهِ سَبْعَ غَزَوَاتٍ أَخْلُفُهُمْ فِي رِحَالِهِمْ فَأَصْنَعُ لَهُمُ الطَّعَامَ وَأُدَاوِي الْجَرْحَى وَأَقُومُ عَلَى الْمَرْضَى"
summary:
  ar: "حديث في صحيح مسلم، رقم 4690، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 4690 (The Book of Jihad and Expeditions), that mentions illness and the sick, the treatment of wounds, women treating the wounded, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 4690، جس میں بیماری اور بیمار، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4690 (El Libro de la Yihad y las Expediciones), menciona la enfermedad y los enfermos, el tratamiento de las heridas, las mujeres que atienden a los heridos y la búsqueda de tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 4690 (Livre du Jihad et des Expéditions), mentionne la maladie et les malades, le traitement des blessures, les femmes soignant les blessés et la recherche de soins. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 4690 numaralı hadis, hastalık ve hastaları, yaraların tedavisini, kadınların yaralıları tedavi etmesini ve tıbbi tedaviyi konu almaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi ile ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4690, menyebutkan tentang penyakit dan orang sakit, pengobatan luka, wanita yang merawat orang terluka, dan pengobatan medis. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
