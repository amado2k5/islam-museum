text: "… للقاضي عبد الجبار كتابين في أصول الفقه متقاربين في الاسم، وإنما هو كتاب واحد. هذا الكلام والاحتمال يحتاج إلى دليل، ولا دليل، ثم ما هو الاسم الصحيح. هل هو العمد أم العهد. فالأولى، بل الواجب، البقاء على ما نقل حتى …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 61، يرد فيه ذكر الواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 61, whose wording mentions the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 61 کا اقتباس جس میں واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, vol. 1 de al-Ghazali, p. 61, dont le texte mentionne l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mustasfa, vol. 1 de al-Ghazali, p. 61, cuyo texto menciona lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin El-Mustasfa adlı eserinin 1. cildinin 61. sayfasından, farz olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Jilid 1, halaman 61, yang menyebutkan amalan-amalan wajib; dari versi pindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan-amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
