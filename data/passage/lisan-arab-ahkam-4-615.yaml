text: "عقب إذا لم يُصِبْ في أَوَّلِ الغَزْدِ عَقَّبا أَي غَزا غَزوة أُخْرى. وعَقَّبَ في النافِلَةِ بعدَ الفَريضَةِ كذلك. وفي حديث أَبي هرِيرة : كان هو وامرأَته وخادِمُه بَعْتَقِبونَ الليل أَثْلاثاً أَي يَتَناوَبُونه في القيام إلى الصلاة. وفي حديث أَنس بن …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 4، ص 615، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 4, p. 615, whose wording mentions the obligation (farida), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 4، ص 615 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Lisan al-'Arab de Ibn Manzur, volume numérisé 4, p. 615, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen digitalizado 4, p. 615, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Manzur'un Lisan al-Arab adlı eserinin 4. cildinin 615. sayfasından, farz olan fiiller ve çoğulları ile nafile olan fiiller ve çoğullarını ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Lisan al-Arab karya Ibn Manzur, Volume 4, halaman 615, yang menyebutkan amalan wajib dan bentuk jamaknya, serta amalan sunnah dan bentuk jamaknya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
