text: "… والواجد بالجيم الموسر، قال العلماء: يحل عرضه بأن يقول: ظلمني ومطلني وعقوبته الحبس والتعزير. استحب له قبول الحوالة وحملوا الحديث على الندب، وقال بعض العلماء: القبول مباح لا مندوب، وقال بعضهم واجب لظاهر والصواب الأول ومعناه إذا أحيل بالدين الذي …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 996، يرد فيه ذكر الواجب، والمستحب، والمندوب، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 996, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the recommended (mandub), the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 996 کا اقتباس جس میں واجب، مستحب، مندوب، مباح، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on Sahih Muslim de al-Nawawi, volume numérisé 1, p. 996, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), le recommandé (mandub), le permis (mubah), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on Sahih Muslim de al-Nawawi, volumen digitalizado 1, p. 996, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo recomendado (mandub), lo permitido (mubah), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Bu metin, El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 996. sayfasından, farz, tavsiye edilen, müstehap olan, caiz olan ve müstehap olan amelleri ele alan bir alıntıdır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 996, yang membahas amalan wajib, anjuran, keinginan, halal, dan amalan yang diinginkan. Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
