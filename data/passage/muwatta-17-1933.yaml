label: { ar: "الموطأ 1933 — مالك: فيما يكال أو يوزن مما لا يؤكل ولا يشرب، كالعصفر والنوى والخبط والكتم، يؤخذ من كل صنف اثنان بواحد يدا بيد، ولا يؤخذ من صنف واحد اثنان بواحد إلى أجل", en: "Muwatta 1933", es: "Muwatta 1933", fr: "Muwatta 1933", ur: "موطا 1933", tr: "El-Muvatta 1933 — Malik: Hacim veya ağırlıkla ölçülen, ancak yenmeyen veya içilmeyen şeyler, örneğin aspir, hurma çekirdeği, saman ve katam gibi, her türden ikişer adet, elden ele, bir adet yerine alınabilir. Ancak aynı türden iki adet, krediyle bir adet yerine alınamaz.", id: "Al-Muwatta 1933 — Malik: Mengenai barang-barang yang diukur berdasarkan volume atau berat tetapi tidak dimakan atau diminum, seperti bunga safflower, biji kurma, sekam, dan katam, dua dari setiap jenis dapat ditukar dengan satu, secara tunai. Dua dari satu jenis tidak dapat ditukar dengan satu secara kredit." }
summary:
  ar: "قال مالك: الأمر عندنا فيما يكال أو يوزن، مما لا يؤكل ولا يشرب، مثل العصفر والنوى والخبط والكتم وما يشبه ذلك: أنه لا بأس بأن يؤخذ من كل صنف منه اثنان بواحد، يدا بيد، ولا يؤخذ من صنف واحد منه اثنان بواحد إلى أجل. فإن اختلف الصنفان فبان اختلافهما، فلا بأس بأن يؤخذ منهما اثنان بواحد إلى أجل. {cite:muwatta-maruf-1997 p.191}"
  tr: "Malik şöyle dedi: Hacim veya ağırlıkla ölçülen, ancak yenmeyen veya içilmeyen şeyler, örneğin aspir, hurma çekirdeği, saman ve benzeri şeyler konusunda uygulamamız şöyledir: Her türden iki tanesini bire bir almak, elden ele vermek caizdir; ancak aynı türden iki tanesini bire bir olarak kredili almak caiz değildir. İki tür farklı ise ve aralarındaki fark açıkça belli ise, o zaman iki tanesini bire bir olarak kredili almak caizdir. {cite:muwatta-maruf-1997 s.191}"
  id: "Malik berkata: Kebiasaan kita mengenai barang-barang yang diukur berdasarkan volume atau berat, tetapi tidak dimakan atau diminum, seperti bunga safflower, biji kurma, sekam, dan barang-barang serupa, adalah diperbolehkan mengambil dua dari setiap jenis dengan harga satu, secara tunai, tetapi tidak diperbolehkan mengambil dua dari jenis yang sama dengan harga satu secara kredit. Jika kedua jenis tersebut berbeda dan perbedaannya terlihat jelas, maka diperbolehkan mengambil dua dari keduanya dengan harga satu secara kredit. {cite:muwatta-maruf-1997 p.191}"
