label: { ar: "الموطأ 1933 — مالك: فيما يكال أو يوزن مما لا يؤكل ولا يشرب، كالعصفر والنوى والخبط والكتم، يؤخذ من كل صنف اثنان بواحد يدا بيد، ولا يؤخذ من صنف واحد اثنان بواحد إلى أجل", en: "Muwatta 1933" }
summary:
  ar: "قال مالك: الأمر عندنا فيما يكال أو يوزن، مما لا يؤكل ولا يشرب، مثل العصفر والنوى والخبط والكتم وما يشبه ذلك: أنه لا بأس بأن يؤخذ من كل صنف منه اثنان بواحد، يدا بيد، ولا يؤخذ من صنف واحد منه اثنان بواحد إلى أجل. فإن اختلف الصنفان فبان اختلافهما، فلا بأس بأن يؤخذ منهما اثنان بواحد إلى أجل. {cite:muwatta-maruf-1997 p.191}"
