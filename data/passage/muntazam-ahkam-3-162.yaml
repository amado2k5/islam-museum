text: "… الفرض الواجب، فوصلتى بعشرة آلاف درهم - قال وقدروى ان المتوكل قال أشتهى ان انادم ابا العيناء لولا انه ضرير فقال ابو العيناء ان اعفالى امير المؤمنين من رؤية الهلال ونقش الجواهر فانى اصلح. اخبرنا القزاز اخبرنا ابو بكر الخطيب …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 3، ص 162، يرد فيه ذكر الفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 3, p. 162, whose wording mentions the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 3، ص 162 کا اقتباس جس میں فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam de Ibn al-Jawzi, volume numérisé 3, p. 162, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen digitalizado 3, p. 162, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin 3. cildinin 162. sayfasından, farz olan amelleri ve görevleri anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, Jilid 3, halaman 162, yang menyebutkan amalan dan kewajiban wajib; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
