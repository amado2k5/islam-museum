label: { ar: "صحيح مسلم 4582 — ساعة الاحتضار والوفاة، ما خلّفه من تركة وميراث", en: "Sahih Muslim 4582 — a deathbed and last hours; what was left behind: estate and inheritance", ur: "صحیح مسلم 4582 — وقتِ وفات اور آخری لمحات، ترکہ اور میراث", es: "Sahih Muslim 4582 — El lecho de muerte y las últimas horas; lo que quedó: patrimonio y herencia.", fr: "Sahih Muslim 4582 — Le lit de mort et les dernières heures; ce qui a été laissé: biens et héritage", tr: "Sahih Muslim 4582 — Ölüm ve vefat anı, geride bıraktığı miras ve vasiyet.", id: "Sahih Muslim 4582 — Saat wafat dan wafatnya, serta apa yang ditinggalkan oleh almarhum berupa warisan dan harta pusaka." }
text: "… أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، أَنَّ عَائِشَةَ، زَوْجَ النَّبِيِّ أَخْبَرَتْهُ أَنَّ فَاطِمَةَ بِنْتَ رَسُولِ اللَّهِ سَأَلَتْ أَبَا بَكْرٍ بَعْدَ وَفَاةِ رَسُولِ اللَّهِ أَنْ يَقْسِمَ لَهَا مِيرَاثَهَا مِمَّا تَرَكَ رَسُولُ اللَّهِ مِمَّا أَفَاءَ اللَّهُ عَلَيْهِ. فَقَالَ لَهَا أَبُو بَكْرٍ إِنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". قَالَ وَعَاشَتْ بَعْدَ رَسُولِ اللَّهِ سِتَّةَ أَشْهُرٍ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4582، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4582 (The Book of Jihad and Expeditions), that mentions a deathbed and last hours, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 4582، جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 4582 (El Libro de la Yihad y las Expediciones), menciona el lecho de muerte y las últimas horas, así como los bienes y la herencia que dejó. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 4582 (Livre du Jihad et des Expéditions), évoque un lit de mort et les dernières heures du défunt, ainsi que les biens et l'héritage laissés. Le navigateur de textes religieux (Testaments Browser) le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
  tr: "Sahih Müslim'de 4582 numaralı hadis, ölüm anını ve ölen kişinin geride bıraktığı mal ve mirasları ele almaktadır. Bu hadis, vasiyetnameler, miras, tarihi yerler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4582, menyebutkan saat kematian dan apa yang ditinggalkan oleh almarhum dalam hal harta warisan. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, situs bersejarah, dan makam suci, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
