label: { ar: "نوادر جحا الكبرى، ص 90 — «دعوني من تعبير رؤياه»", en: "Nawadir Juha al-Kubra, p. 90 — 'Spare Me the Interpretation of His Dream'", ur: "نوادر جحا الکبریٰ، ص 90 — «مجھے اس کے خواب کی تعبیر سے معاف رکھو»", fr: "Nawadir Juha al-Kubra, p. 90 — « Laissez-moi en dehors de l'interprétation de son rêve »", es: "Nawadir Juha al-Kubra, p. 90 — «Déjenme fuera de la interpretación de su sueño»", tr: "Juha'nın Büyük Fıkraları, s. 90 — “Rüyasını yorumlama işine beni karıştırmayın.”", id: "Anekdot Hebat Juha, hlm. 90 — “Jangan libatkan saya dalam menafsirkan mimpinya.”" }
text: "… دعوني من تعبير رؤياه رأى تيمور لنك في منامه رجلاً أزعجه فقتله. وسمع الشيخ خبر الرؤيا، فأسرع إلى أشيائه فجمعها وفرّ إلى قريةٍ أخرى. فسألوه: لماذا تركت هذا الرجل، وقد وافق نجمك نجمه، وهو لا يغضب منك، وذهابك يضرُّ بالبلدة؟ …"
summary:
  ar: "رأى تيمور في المنام أن رجلًا أزعجه فقتله؛ فلما سمع جحا بذلك حزم أمتعته وهرب إلى قرية أخرى؛ وسُئل لماذا، فقال إن الحلم قد يجلب الخطر إذا أخطأ تأويله، فليتركوه خارج الحلم. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  en: "Timur dreams that a man disturbed him and he killed him; Juha, hearing of it, packs and flees to another village; asked why, he says the dream could bring danger if its interpretation is wrong, so leave him out of the dream. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  ur: "تیمور نے خواب دیکھا کہ ایک آدمی نے اسے تنگ کیا اور اس نے اسے قتل کر دیا؛ جحا نے سنا تو سامان باندھ کر دوسرے گاؤں بھاگ گیا؛ وجہ پوچھی گئی تو اس نے کہا کہ تعبیر غلط ہوئی تو خواب خطرہ لا سکتا ہے، اس لیے مجھے خواب سے باہر رکھو۔ {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  fr: "Timur rêve qu'un homme l'a dérangé et qu'il l'a tué; Juha, l'apprenant, fait ses bagages et s'enfuit dans un autre village; quand on lui demande pourquoi, il dit que le rêve pourrait apporter du danger si son interprétation est fausse, et qu'on le laisse hors du rêve. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  es: "Timur sueña que un hombre lo molestó y que lo mató; Juha, al saberlo, hace el equipaje y huye a otra aldea; preguntado por qué, dice que el sueño podría traer peligro si su interpretación es errónea, así que lo dejen fuera del sueño. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  tr: "Timur rüyasında bir adamın kendisini kızdırdığını ve bu yüzden onu öldürdüğünü gördü. Cuha bunu duyunca eşyalarını toplayıp başka bir köye kaçtı. Neden kaçtığı sorulduğunda, rüyanın yanlış yorumlanmasının tehlike getirebileceğini, bu yüzden rüyayı dikkate almamaları gerektiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 90}"
  id: "Timur bermimpi bahwa seorang pria telah mengganggunya, sehingga ia membunuhnya. Ketika Juha mendengar ini, ia mengemasi barang-barangnya dan melarikan diri ke desa lain. Ketika ditanya mengapa, ia menjawab bahwa mimpi dapat membawa bahaya jika penafsirannya salah, jadi mereka sebaiknya mengabaikan mimpi tersebut. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
