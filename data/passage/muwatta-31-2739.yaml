label: { ar: "الموطأ 2739 — سهيل عن أبيه عن أبي هريرة: رجل من أسلم لدغته عقرب فيعلمه النبي دعاء الإمساء", en: "Muwatta 2739", es: "Muwatta 2739", fr: "Muwatta 2739", ur: "موطا 2739", tr: "El-Muvatta 2739 — Suhayl, babasından, o da Ebu Hurayra'dan rivayet ettiğine göre: Aslam'dan bir adamı akrep soktu, bunun üzerine Peygamber ona akşam için duayı öğretti.", id: "Al-Muwatta 2739 — Suhayl, berdasarkan riwayat ayahnya, berdasarkan riwayat Abu Hurayrah: Seorang pria dari Aslam disengat kalajengking, lalu Nabi mengajarkan kepadanya doa untuk waktu berkabung." }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رجلا من أسلم قال: ما نمت هذه الليلة. فقال له رسول الله: من أي شيء؟ قال: لدغتني عقرب. فقال رسول الله: أما إنك لو قلت حين أمسيت: أعوذ بكلمات الله التامات من شر ما خلق، لم تضرك. {cite:muwatta-maruf-1997 p.541}"
  tr: "Malik, Suhayl ibn Abi Salih'ten, o da babasından, o da Ebu Hurayra'dan rivayet ettiğine göre, Aslam'dan bir adam şöyle dedi: \"Dün gece uyuyamadım.\" Allah'ın Resulü ona sordu: \"Neden?\" Adam cevap verdi: \"Beni bir akrep soktu.\" Allah'ın Resulü şöyle buyurdu: \"Akşam olduğunda, 'Yarattığı şeylerin şerrinden Allah'ın mükemmel sözlerine sığınırım' deseydin, sana bir zarar gelmezdi.\" {cite:muwatta-maruf-1997 s.541}"
  id: "Malik meriwayatkan dari Suhayl ibn Abi Salih, dari ayahnya, dari Abu Hurayrah, bahwa seorang laki-laki dari Aslam berkata: \"Aku tidak tidur semalam.\" Rasulullah bertanya kepadanya: \"Mengapa?\" Dia menjawab: \"Aku disengat kalajengking.\" Rasulullah bersabda: \"Sekiranya kamu mengucapkan ketika malam tiba: 'Aku berlindung kepada firman Allah yang sempurna dari kejahatan ciptaan-Nya,' niscaya itu tidak akan membahayakanmu.\" {cite:muwatta-maruf-1997 p.541}"
