summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رجلا من أسلم قال: ما نمت هذه الليلة. فقال له رسول الله: من أي شيء؟ قال: لدغتني عقرب. فقال رسول الله: أما إنك لو قلت حين أمسيت: أعوذ بكلمات الله التامات من شر ما خلق، لم تضرك. {cite:muwatta-maruf-1997 p.541}"
