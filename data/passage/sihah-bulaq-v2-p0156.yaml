  قه قه يقال قه وقهقه بعى وقدجاء فى الشعر مخففا وقال الراجز * وهنّ فى تهانف وف قه
  والقهقهة فى السيرمثل الهقهقة مقلوب منه وأنشد الاصمعى لرؤبة
  أقب قهقاه اذا ماهقهقا » وأنشدله أيضا
  يصحن بعد القرب المقهقه * بالهيف من داك البعيد الامقه
  يه أبو عبيد الة وهة اللبن اذا تغير طعمه قليلا وفيه حلاوة الحلب والة وهى تضرب
  من النياب يض
  وجهه وبه كده وكدوه وكدهه الحجراذاصكه وأثرفيه أتراشديدا قال رؤية
  أوخاف صقع القارعات الكده* ⁦(كره)⁩ كرهت الشىّ أكرهه كراهة وكراهية
  فهوشى كريه ومكروه والكريهة الشّدّة فى الحرب وذوالكريهة السيف الماضى فى
  الضريبة عن أبى عبيدة الفزاء السكره بالضمّ المشقة يقال قت على كره أى على مشقة قال
