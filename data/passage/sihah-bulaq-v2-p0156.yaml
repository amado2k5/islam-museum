  القاه الطاعة حكاها عن بى أسسديقال مالك على قاه أى سلطان قال الراجز
  تاللّٰه لولا الذار أن نصلاها * أويدء والناس علينا اللّٰه * لماسمعنا لام يرقاها
  يقال منه أيقه الزجل واستيقه أى أطاع قال النخبل
  ودتصدور انلحيل -تى تنهنهوا • الى ذى النهى واستيقهو اللمحلم
  وهو مقلاب لانه قدم الساء على القاف وكانت القاف قبلها ويروى واستيدهوا وأيقه أى:
