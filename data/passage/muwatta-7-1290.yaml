label: { ar: "الموطأ 1290 — ابن شهاب عن ابن لكعب بن مالك: نهى النبي الذين قتلوا ابن أبي الحقيق عن قتل النساء والولدان", en: "Muwatta 1290" }
text: "نهى رَسولُ اللهِ الَّذِينَ قَتَلُوا ابن أبي الْحُقَيْقِ عَن قَتْلِ النِّسَاءِ وَالْوِلْدَانِ"
summary:
  ar: "يروي مالك عن ابن شهاب عن ابن لكعب بن مالك، يحسب مالك أنه عبد الرحمن بن كعب، أن رسول الله نهى الذين قتلوا ابن أبي الحقيق عن قتل النساء والولدان. وكان رجل منهم يقول إن امرأة ابن أبي الحقيق بَرَّحت بهم بالصياح، فيرفع السيف عليها، ثم يذكر نهي رسول الله فيكف، ولولا ذلك لاستراحوا منها. ويذكر المحقق أن الحديث مرسل عند مالك، وأن ابن عبد البر ذكر اختلاف الرواة في اسم الراوي عن الزهري. {cite:muwatta-maruf-1997 p.575}"
