label: { ar: "الموطأ 1290 — ابن شهاب عن ابن لكعب بن مالك: نهى النبي الذين قتلوا ابن أبي الحقيق عن قتل النساء والولدان", en: "Muwatta 1290", es: "Muwatta 1290", fr: "Muwatta 1290", ur: "موطا 1290", tr: "El-Muvatta 1290 — İbn Şihab, İbn Ka'b ibn Malik'ten rivayetle: Peygamber, İbn Abi el-Hukayk'ı öldürenlerin kadın ve çocukları öldürmesini yasakladı.", id: "Al-Muwatta 1290 — Ibn Shihab, berdasarkan riwayat Ibn Ka'b ibn Malik: Nabi melarang orang-orang yang membunuh Ibn Abi al-Huqayq untuk membunuh wanita dan anak-anak." }
text: "نهى رَسولُ اللهِ الَّذِينَ قَتَلُوا ابن أبي الْحُقَيْقِ عَن قَتْلِ النِّسَاءِ وَالْوِلْدَانِ"
summary:
  ar: "يروي مالك عن ابن شهاب عن ابن لكعب بن مالك، يحسب مالك أنه عبد الرحمن بن كعب، أن رسول الله نهى الذين قتلوا ابن أبي الحقيق عن قتل النساء والولدان. وكان رجل منهم يقول إن امرأة ابن أبي الحقيق بَرَّحت بهم بالصياح، فيرفع السيف عليها، ثم يذكر نهي رسول الله فيكف، ولولا ذلك لاستراحوا منها. ويذكر المحقق أن الحديث مرسل عند مالك، وأن ابن عبد البر ذكر اختلاف الرواة في اسم الراوي عن الزهري. {cite:muwatta-maruf-1997 p.575}"
  tr: "Malik, İbn Şihab'dan, o da İbn Ka'b ibn Malik'ten (Malik bunun Abdülrahman ibn Ka'b olduğuna inanır) rivayet eder ki, Allah Resulü, İbn Abi el-Hukayk'ı öldürenlere kadın ve çocuk öldürmeyi yasaklamıştır. Onlardan biri, İbn Abi el-Hukayk'ın karısının ağlamasıyla onları rahatsız ettiğini, bu yüzden ona karşı kılıç çektiğini, sonra Allah Resulü'nün yasağını hatırlayıp durduğunu söylemiştir. Eğer böyle olmasaydı, ondan kurtulmuş olurlardı. Araştırmacı, hadisin Malik'e göre mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve İbn Abdül-Barr'ın, el-Zuhri'den rivayetle ravilerin ravi ismi hakkındaki farklı görüşlerinden bahsettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.575}"
  id: "Malik meriwayatkan berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Ibn Ka'b ibn Malik (Malik meyakini ini adalah Abd al-Rahman ibn Ka'b), bahwa Rasulullah melarang orang-orang yang membunuh Ibn Abi al-Huqayq untuk membunuh wanita dan anak-anak. Salah seorang dari mereka berkata bahwa istri Ibn Abi al-Huqayq telah menyiksa mereka dengan ratapannya, sehingga ia mengangkat pedangnya terhadapnya, kemudian mengingat larangan Rasulullah dan berhenti. Seandainya bukan karena itu, mereka pasti sudah terbebas darinya. Peneliti mencatat bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) menurut Malik, dan bahwa Ibn Abd al-Barr menyebutkan perbedaan pendapat para perawi mengenai nama perawi berdasarkan riwayat al-Zuhri. {cite:muwatta-maruf-1997 p.575}"
