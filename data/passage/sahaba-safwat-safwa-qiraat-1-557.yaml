text: "… به فألقي على الكُناسة. - خيثمة بن عبد الرحمن ابن أبي سبرة، واسمه يزيد بن مالك الجعفي: عن الأعمش قال: ورث خيثمة بن عبد الرحمن مائتي ألف درهم فأنفقها على القراء والفقهاء. قال الأعمش: كان خيثمة يصنع الخبيص والطعام الطيب …"
