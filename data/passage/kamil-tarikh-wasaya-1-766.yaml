text: "ذكر عدة حوادث الوفيات... ثم دخلت سنة خمس وثلاثين ذكر مسير من سار إلى حصر عثمان. ذكر مقتل عثمان.. ذكر الموضع الذي دُفن فيه ومَن صلى عليه. ذكر بعض سيرة عثمان ذكر نسبه وصفته وكنيته. ذكر وقت إسلامه وهجرته ذكر …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 766، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 766, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 766 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Kamil fi al-Tarikh de Ibn al-Athir, volumen 1, pág. 766, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre d'Ibn al-Athir, al-Kamil fi al-Tarikh (tome 1, p. 766), mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 1. cildinin 766. sayfasından, ölüm ve vefat zamanı, defin, mezar ve istirahat yeri konularını ele alan bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Kamil fi al-Tarikh* karya Ibn al-Athir, Jilid 1, halaman 766, yang menyebutkan saat kematian dan wafat, penguburan, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
