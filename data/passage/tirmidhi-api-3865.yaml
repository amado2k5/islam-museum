label: { ar: "جامع الترمذي 3865 — الأب والأبوة", en: "Jami' al-Tirmidhi 3865 — the father and fatherhood", ur: "جامع ترمذی 3865 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3865 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3865 — le père et la paternité" }
text: "… قَالَ حَدَّثَنَا عُثْمَانُ بْنُ نَاجِيَةَ، عَنْ عَبْدِ اللَّهِ بْنِ مُسْلِمٍ أَبِي طَيْبَةَ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَا مِنْ أَحَدٍ مِنْ أَصْحَابِي يَمُوتُ بِأَرْضٍ إِلاَّ بُعِثَ قَائِدًا وَنُورًا لَهُمْ يَوْمَ الْقِيَامَةِ \". هَذَا حَدِيثٌ غَرِيبٌ. وَرُوِيَ هَذَا الْحَدِيثُ عَنْ عَبْدِ اللَّهِ بْنِ مُسْلِمٍ أَبِي طَيْبَةَ عَنِ ابْنِ بُرَيْدَةَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3865، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3865 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3865، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3865 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3865 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
