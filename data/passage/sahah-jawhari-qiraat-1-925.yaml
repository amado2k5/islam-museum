text: "قُرْءَانَهُ القيامة:، أي : قراءته، قال ابن عبَّاس : فإذا البحريَّة تُسْتَخّفَّ لحوائجهم، قال الخليل: القارِب: وقد يكون القُرَّاء جمعًا لقارئ. والقِرْأةُ بالكَسر، مثال الشاكلة إلى مَراقِّ البطن، مثل عُسْر وعُسُر. والجمع القِرْعَةِ: الوباء، قال الأصمعي: إذا قَدِمْتَ بلادًا الأقراب. …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 1، ص 925، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 1, p. 925, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الصحاح، جوہری، اسکین جلد 1، ص 925 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Sihah de al-Jawhari, volumen 1, pág. 925, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
