ref: "2824b"
label:
  ar: "مسلم 2824b — أعددت لعبادي الصالحين ما لا عين رأت"
  en: "Muslim 2824b — I have prepared for My righteous servants what no eye has seen"
  ur: "مسلم 2824b — میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا"
  es: "Muslim 2824b — He preparado para Mis siervos justos lo que ningún ojo ha visto"
  fr: "Muslim 2824b — J’ai préparé pour Mes serviteurs vertueux ce qu’aucun œil n’a vu."
  tr: "Müslim 2824b — Ben, salih kullarım için hiçbir gözün görmediği şeyler hazırladım."
  id: "Muslim 2824b — Aku telah menyiapkan bagi hamba-hamba-Ku yang saleh apa yang belum pernah dilihat mata."
text: "قال الله عز وجل أعددت لعبادي الصالحين ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر ذخرا بله ما أطلعكم الله عليه ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2824b: أعددت لعبادي الصالحين ما لا عين رأت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2824b: I have prepared for My righteous servants what no eye has seen. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2824b: میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2824b: He preparado para Mis siervos justos lo que ningún ojo ha visto. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2824b: « J’ai préparé pour Mes serviteurs vertueux ce qu’aucun œil n’a vu. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2824b: “Aku telah menyiapkan bagi hamba-hamba-Ku yang saleh apa yang belum pernah dilihat mata.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
