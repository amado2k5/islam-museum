label:
  ar: "مسلم 2824b — أعددت لعبادي الصالحين ما لا عين رأت"
  en: "Muslim 2824b — I have prepared for My righteous servants what no eye has seen"
  ur: "مسلم 2824b — میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا"
text: "قال الله عز وجل أعددت لعبادي الصالحين ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر ذخرا بله ما أطلعكم الله عليه ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2824b: أعددت لعبادي الصالحين ما لا عين رأت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2824b: I have prepared for My righteous servants what no eye has seen. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2824b: میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
