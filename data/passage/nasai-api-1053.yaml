label: { ar: "سنن النسائي 1053 — الأب والأبوة", en: "Sunan al-Nasa'i 1053 — the father and fatherhood", ur: "سنن نسائی 1053 — باپ اور والدیت", es: "Sunan al-Nasa'i 1053 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1053 — le père et la paternité" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا بَكْرُ بْنُ مُضَرَ، عَنِ ابْنِ عَجْلاَنَ، عَنْ عَلِيِّ بْنِ يَحْيَى الزُّرَقِيِّ، عَنْ أَبِيهِ، عَنْ عَمِّهِ، رِفَاعَةَ بْنِ رَافِعٍ وَكَانَ بَدْرِيًّا قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ إِذْ دَخَلَ رَجُلٌ الْمَسْجِدَ فَصَلَّى وَرَسُولُ اللَّهِ يَرْمُقُهُ وَلاَ يَشْعُرُ ثُمَّ انْصَرَفَ فَأَتَى رَسُولَ اللَّهِ فَسَلَّمَ عَلَيْهِ فَرَدَّ ثُمَّ قَالَ \" ارْجِعْ فَصَلِّ فَإِنَّكَ لَمْ تُصَلِّ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1053، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1053 (The Book of The At-Tatbiq (Clasping One's Hands Together)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1053، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1053 (El Libro del At-Tatbiq (Junto de las Manos)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1053 (Le Livre de l'At-Tatbiq, ou l'union des mains), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
