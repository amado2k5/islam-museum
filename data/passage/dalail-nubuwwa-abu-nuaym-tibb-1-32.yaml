text: "… وفقكم الله - أنَّ الخالق الحكيم أنشأ الخلْقَ مُختلين الصور والجواهر، متفاوتي الأمزجة والبصائر، أجزاؤهم في الطبيعة والقوّة متفاضلة، وأخلاقهم في النظر والاعتبار متفاوتة، فمِنْ معتدِل في امتزاجه، مستغن بصحته عن الأطباء والعقاقير، ومتوسطٍ في الاعتدال يُطيِّبُه القليل من الأباريز، …"
