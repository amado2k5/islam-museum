  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, scan volume 1, p. 32, that mentions medicine and the physician, the hospital and the medical craft, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
