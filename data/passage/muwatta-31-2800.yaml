label: { ar: "الموطأ 2800 — خولة بنت حكيم: من نزل منزلا فليقل أعوذ بكلمات الله التامات", en: "Muwatta 2800" }
summary:
  ar: "يروي مالك عن الثقة عنده، عن يعقوب بن عبد الله بن الأشج، عن بسر بن سعيد، عن سعد بن أبي وقاص، عن خولة بنت حكيم، أن النبي قال: من نزل منزلا فليقل: أعوذ بكلمات الله التامات من شر ما خلق، فإنه لن يضره شيء حتى يرتحل. ويذكر المحقق قول ابن عبد البر أن يحيى رواه بعبارة «عن الثقة عنده»، وأن القعنبي وابن بكير وابن القاسم وابن وهب رووه بعبارة «بلغه عن يعقوب»، والمعنى واحد. {cite:muwatta-maruf-1997 p.573}"
