label: { ar: "الموطأ 2800 — خولة بنت حكيم: من نزل منزلا فليقل أعوذ بكلمات الله التامات", en: "Muwatta 2800", es: "2800 vatios", fr: "2800 watts", ur: "2800 واٹ", tr: "Al-Muwatta 2800 — Khawla bint Hakim: Bir yerde duran herkes, “Allah’ın mükemmel sözlerine sığınırım” demelidir.", id: "Al-Muwatta 2800 — Khawla bint Hakim: Barangsiapa berhenti di suatu tempat, hendaklah ia berkata, “Aku berlindung pada firman Allah yang sempurna.”" }
summary:
  ar: "يروي مالك عن الثقة عنده، عن يعقوب بن عبد الله بن الأشج، عن بسر بن سعيد، عن سعد بن أبي وقاص، عن خولة بنت حكيم، أن النبي قال: من نزل منزلا فليقل: أعوذ بكلمات الله التامات من شر ما خلق، فإنه لن يضره شيء حتى يرتحل. ويذكر المحقق قول ابن عبد البر أن يحيى رواه بعبارة «عن الثقة عنده»، وأن القعنبي وابن بكير وابن القاسم وابن وهب رووه بعبارة «بلغه عن يعقوب»، والمعنى واحد. {cite:muwatta-maruf-1997 p.573}"
  tr: "Malik, güvenilir bir kişiden, Yakub ibn Abdullah ibn el-Aşajj'dan, Busr ibn Sa'id'den, Sa'd ibn Abi Vakkas'tan ve Havla bint Hakim'den rivayetle, Peygamber'in şöyle buyurduğunu nakletmiştir: \"Kim bir yerde durursa, 'Yarattığı şeylerin şerrinden Allah'ın mükemmel sözlerine sığınırım' desin; çünkü oradan ayrılıncaya kadar hiçbir şey ona zarar vermez.\" Araştırmacı, İbn Abd el-Barr'ın Yahya'nın bunu \"güvenilir bir kişiden\" naklettiği, el-Ka'nebi, İbn Bukayr, İbn el-Kâsim ve İbn Vahb'ın ise \"Yakub'dan kendisine ulaştı\" ifadesiyle naklettiği ve anlamının aynı olduğu yönündeki ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.573}"
  id: "Malik meriwayatkan, berdasarkan riwayat dari orang yang terpercaya, dari Yaqub ibn Abdullah ibn al-Ashajj, dari Busr ibn Sa'id, dari Sa'd ibn Abi Waqqas, dari Khawla bint Hakim, bahwa Nabi bersabda: \"Barangsiapa berhenti di suatu tempat hendaknya mengucapkan: 'Aku berlindung kepada firman Allah yang sempurna dari kejahatan ciptaan-Nya,' karena tidak ada sesuatu pun yang akan membahayakannya sampai ia pergi.\" Peneliti menyebutkan pernyataan Ibn Abd al-Barr bahwa Yahya meriwayatkan hadits tersebut dengan frasa \"berdasarkan riwayat dari orang yang terpercaya,\" dan bahwa al-Qa'nabi, Ibn Bukayr, Ibn al-Qasim, dan Ibn Wahb meriwayatkan hadits tersebut dengan frasa \"hadir dari Yaqub,\" dan maknanya sama. {cite:muwatta-maruf-1997 p.573}"
