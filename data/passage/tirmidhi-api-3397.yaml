label: { ar: "جامع الترمذي 3397 — مغفرة ما تقدم من الذنب", en: "Jami' al-Tirmidhi 3397 — forgiveness of past sins", ur: "جامع ترمذی 3397 — پچھلے گناہوں کی مغفرت" }
text: "… الَّذِي لاَ إِلَهَ إِلاَّ هُوَ الْحَىَّ الْقَيُّومَ وَأَتُوبُ إِلَيْهِ. ثَلاَثَ مَرَّاتٍ غَفَرَ اللَّهُ ذُنُوبَهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ وَإِنْ كَانَتْ عَدَدَ وَرَقِ الشَّجَرِ وَإِنْ كَانَتْ عَدَدَ رَمْلِ عَالِجٍ وَإِنْ كَانَتْ عَدَدَ أَيَّامِ الدُّنْيَا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ مِنْ حَدِيثِ الْوَصَّافِيِّ عُبَيْدِ اللَّهِ بْنِ الْوَلِيدِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3397، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3397 (Chapters on Supplication), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3397، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
