  وحزقت من طواتفها والمجعوع الذى جمع من ههنا وههنا وان لم يجعل كالشئ الواحدولاة
  مجمعة يجتمع القوم فيها ولا يتفرّقون خوف الضلال ونهوه كانهاهي التى بمعتهم واستجمع
  السيل اجتمع من كل موضع ويقال للمستجيش استجمع كل مجم-ع واستجمع القرس جريا وقال
  بصفسرابا
  ومستجمع جربا وليس مارح • تباريه فى ضاحى المذان سواعد
  وجع جمع بجعة وجع بجعاء فى نو كيد المؤث تقول رأيت النسوة جمع غير مصروف وهومعرفة
  فير الالف واللام وكذلك ما يجرى مجراه من التواكيدلانه نوكيد للمه رفة وأخذت حقى
  أجع فى توكيد المذكر وهونو كيد محض وكذلك أجعون وجعاه وجمع وأكتعون وأبتعون
  وابصعون لايكون الاتأكيدانا بعالمما قبل لا يبندأ ولا يخسبر به ولاعنه ولا يكون فاعلا
  ولا مفع ولا كما يكون غيره من التواكيداسمامرة وتوكيدا أخرى مثل نفسه وعينه وكله
  وأيجعون بجع أبجع وأمع واحد فى معنى جممع وليس له مفرد من لفظه والمؤنث بهماءوكان
  بنبغى أن يجمع وابحعاه بالالف والتاء كماجعوا أجمع بالواو والنون ولكنهم قالواف جعها
  جع ويقال باء القوم بأجمعهم وبأجعهم أيضابضم الميم كمانة ول جاؤا بأكلبهم.ه-ع
