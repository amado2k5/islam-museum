  ذريح)
  فقدتك من نفس شعاع قانى • نهيتك عن هذا وأنت جميع
  والجممع الجيش قال ليد
  فى ججيع حافظى عوراتهم • لا يهمون بادعاف الشال
  والجميع الحوالجتمع قال ابيد
  عريت وكان بهاالجميع فأبكروا • منها وغودرنويم اونمامها
