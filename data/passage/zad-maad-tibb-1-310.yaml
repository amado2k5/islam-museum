text: "… وهو صائم أن بُصَلِّيَ، أي يدعو لمن قدَّمه، وإن كان مفطراً أن يأكل منه مسلم:. أحكام الدعوة إلى الطعام المنزل، وقال: إنَّ هذا تَبِعَنَا، فَإِنْ شِئْتَ أَنْ تَأْذَنَ لَهُ، وَإِنْ شِئْتَ رَجَعَ البخاري:. يُؤاكِلهُ : سَمِّ اللَّهَ، وكُلْ ممَّا يَليكَ …"
