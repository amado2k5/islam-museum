text: "… قَالَ : رَبِّ ، إنِّي أَجِد في التَّوْرَاةِ أُمَّةٌ إِذا هَمَّ أَحدُهُم بِسَيّئَةٍ لَمْ تُكْتَبْ عَلَيْهِ ، فَإنْ عَمِلَهَا كُتِبَتْ علَيْهِ سَيْئَةُ وَاحِدةً وإِذَا هَمَّ أَحَدهم بِحَسَنَةٍ وَلَمْ يَعْمَلْهَا كُتِبَتْ لَهُ حَسَنَةً ، فإن عَمِلَهَا كُتِبَتْ لَهُ عَشْرَ حَسَنات إلى …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 550، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، وكتابة السيئات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 550, that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, the writing of bad deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 550 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
