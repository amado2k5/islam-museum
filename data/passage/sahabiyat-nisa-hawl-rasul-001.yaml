text: "حاطب بن أبي بلتعة - رضي الله عنه - بسم الله الرحمن الرحيم. من محمد بن عبد الله، إلى المقوقس عظيم القبط . سلام على من اتبع الهدى . أما بعد، فإني أدعوك بدعاية الإسلام. أسلم تسلم، وأسلم يؤتك الله"
