label: { ar: "الموطأ 2529 — مالك عن ابن شهاب: الدية في قتل العمد على القاتل في ماله إذا عفا الأولياء", en: "Muwatta 2529", es: "Muwatta 2529", fr: "Muwatta 2529", ur: "موطا 2529", tr: "El-Muvatta 2529 — Malik, İbn Şihab'dan rivayetle: Kasıtlı cinayet için kan parası, kurbanın ailesi affettiği takdirde, katilin kendi malından ödemesi gereken bir yükümlülüktür.", id: "Al-Muwatta 2529 — Malik, berdasarkan riwayat Ibn Shihab: Uang darah untuk pembunuhan yang disengaja adalah tanggung jawab si pembunuh, yang harus dibayarkan dari hartanya sendiri, jika keluarga korban memaafkan." }
summary:
  ar: "قال مالك: إن ابن شهاب قال: مضت السنة في قتل العمد حين يعفو أولياء المقتول، أن الدية تكون على القاتل في ماله خاصة، إلا أن تعينه العاقلة عن طيب نفس منها. {cite:muwatta-maruf-1997 p.436}"
  tr: "Malik şöyle dedi: İbn Şihab şöyle dedi: Kasıtlı cinayetlerde, kurbanın ailesi affettiğinde, kan parası katilin kendi servetinden ödenir; ancak aile gönüllü olarak katkıda bulunursa durum değişir. {cite:muwatta-maruf-1997 s.436}"
  id: "Malik berkata: Ibn Shihab berkata: Praktik yang sudah mapan dalam kasus pembunuhan yang disengaja, apabila keluarga korban memaafkan, adalah bahwa uang darah menjadi tanggung jawab si pembunuh, dibayarkan dari hartanya sendiri, kecuali jika keluarga korban secara sukarela ikut berkontribusi. {cite:muwatta-maruf-1997 p.436}"
