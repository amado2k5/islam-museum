text: "… اللّٰه ابن عبد اللّٰه بن عتبة، قال : لم يوص رسول اللّٰه يليم عند موته إلا بثلاث للرُهابيين بجادً ماثة واسق عن خيبر، وللداريين بجاد مائة وسق، وللشانيئين بجاد مائة وسق من خيبر وللأشعريين بجاد مائة وسقٍ من خيبر، وأوصى …"
summary:
