text: "… وإلا فإذا لم يذكروا إلا الإيمان بالغيب فقد يقول من يؤمن ببعض ويكفر ببعض نحن نؤمن بالغيب. ولما كانت سورة البقرة سنام القرآن، ويقال إنها أول سورة نزلت بالمدينة، افتتحها اللّٰه بأربع آيات في صفة المؤمنين وآيتين في صفة الكافرين …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 178، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
