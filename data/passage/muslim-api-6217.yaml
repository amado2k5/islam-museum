label: { ar: "صحيح مسلم 6217 — الأب والأبوة", en: "Sahih Muslim 6217 — the father and fatherhood", ur: "صحیح مسلم 6217 — باپ اور والدیت", es: "Sahih Muslim 6217 — El padre y la paternidad", fr: "Sahih Muslim 6217 — Le père et la paternité", tr: "Sahih Muslim 6217 — Baba ve Babalık", id: "Sahih Muslim 6217 — Ayah dan Peran Ayah" }
text: "… سَلَمَةَ الْمَاجِشُونُ حَدَّثَنَا مُحَمَّدُ بْنُ الْمُنْكَدِرِ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ عَامِرِ بْنِ سَعْدِ، بْنِ أَبِي وَقَّاصٍ عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ لِعَلِيٍّ \" أَنْتَ مِنِّي بِمَنْزِلَةِ هَارُونَ مِنْ مُوسَى إِلاَّ أَنَّهُ لاَ نَبِيَّ بَعْدِي \". قَالَ سَعِيدٌ فَأَحْبَبْتُ أَنْ أُشَافِهَ بِهَا سَعْدًا فَلَقِيتُ سَعْدًا فَحَدَّثْتُهُ بِمَا حَدَّثَنِي عَامِرٌ فَقَالَ أَنَا سَمِعْتُهُ. فَقُلْتُ آنْتَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6217، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6217 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6217، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6217 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6217 (Le Livre des mérites des Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 6217 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6217, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
