text: "… سَلَمَةَ الْمَاجِشُونُ حَدَّثَنَا مُحَمَّدُ بْنُ الْمُنْكَدِرِ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ عَامِرِ بْنِ سَعْدِ، بْنِ أَبِي وَقَّاصٍ عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ لِعَلِيٍّ \" أَنْتَ مِنِّي بِمَنْزِلَةِ هَارُونَ مِنْ مُوسَى إِلاَّ أَنَّهُ لاَ نَبِيَّ بَعْدِي \". قَالَ سَعِيدٌ فَأَحْبَبْتُ أَنْ أُشَافِهَ بِهَا سَعْدًا فَلَقِيتُ سَعْدًا فَحَدَّثْتُهُ بِمَا حَدَّثَنِي عَامِرٌ فَقَالَ أَنَا سَمِعْتُهُ. فَقُلْتُ آنْتَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6217، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6217 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6217، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
