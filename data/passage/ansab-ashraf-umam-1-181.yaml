text: "… بن صالح، ومحمد بن سعد، عن الواقدي، عن عبد اللّٰه بن أبي عبيدة، عن عبد الحكيم بن صهيب، قال: عذّب المشركون عماراً، وقالوا : لا نفارقك أبدا حتى تشتم محمداً، وحتى تقول اللات والعزّى خير من دين محمد. ففعل. فتركوه. …"
