text: "… اللّٰه تعالى. غريب من حديث الاوزاعى عن هارون لم نسكتبه إلا من حديث العكاشى. - منصور بن زاذان ومنهم زين القراء والفتيان، الميسر له تلاوة القرآن، منصور بن زاذان. حدثنا أبو محمد بن حيان قال ثنا الحسن بن هارون قال …"
