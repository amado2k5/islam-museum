text: "… كُلّها على الإطلاق. مَطْلِبٌ: تَعْيينُ العِلْم الذي هو فَرْضُ عَيْنٍ على كُلِّ مُكَلَّف: أعني الذي يتضمنه قوله: طلبُ العِلْم فريضةٌ على كُلِّ مُسلم ومُسْلِمة. واعْلَم أنَّ للعُلماء اختلافًا عظيمًا في تَعْيين ذلك العِلْم. قال المفسِّرون والمُحدِّثون: هو عِلْم الكتاب والسُّنة. …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 155، يرد فيه ذكر الفريضة والفرائض، والفرض، وفرض العين، وما وجب على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 155, whose wording mentions the obligation (farida), the obligatory (fard), the individual obligation (fard 'ayn), a duty laid on every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 155 کا اقتباس جس میں فریضہ اور فرائض، فرض، فرضِ عین، جو ہر مسلمان پر لازم ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kashf al-Zunun de Hajji Khalifa, volume numérisé 1, p. 155, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligation individuelle (fard 'ayn), un devoir imposé à chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen digitalizado 1, p. 155, cuyo texto menciona la obligación (farida), lo obligatorio (fard), la obligación individual (fard 'ayn), un deber impuesto a cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin Resimli Cilt 1, sayfa 155'inden, farz ibadetler, bireysel yükümlülükler ve her Müslümanın yerine getirmesi gerekenler hakkında bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz ibadetler, görevler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram edilen ibadetler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kashf al-Zunun karya Haji Khalifa, Jilid Bergambar 1, halaman 155, membahas amalan wajib, kewajiban individu, dan apa yang wajib dilakukan oleh setiap Muslim; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
