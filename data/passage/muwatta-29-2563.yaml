label: { ar: "الموطأ 2563 — مالك: لا قود بين الحر والعبد في الجراح، والعبد يُقتل بالحر", en: "Muwatta 2563", es: "Muwatta 2563", fr: "Muwatta 2563", ur: "موطا 2563", tr: "El-Muvatta 2563 — Malik: Bir hür insan ile bir köle arasında yaralanma nedeniyle misilleme olmaz, bir köle hür bir insanı öldürürse öldürülür.", id: "Al-Muwatta 2563 — Malik: Tidak ada pembalasan antara orang merdeka dan budak atas luka yang ditimbulkan, dan seorang budak dibunuh karena membunuh orang merdeka." }
summary:
  ar: "قال مالك: ليس بين الحر والعبد قود في شيء من الجراح، والعبد يُقتل بالحر إذا قتله عمدا، ولا يُقتل الحر بالعبد وإن قتله عمدا، وهو أحسن ما سمعت. {cite:muwatta-maruf-1997 p.447}"
  tr: "Malik şöyle dedi: Özgür bir insanla köle arasında herhangi bir zarar için misilleme olmaz. Köle, özgür bir insanı kasten öldürdüğü için öldürülür, ancak özgür bir insan köleyi kasten öldürdüğü için öldürülmez. Bu, duyduğum en iyi görüş. {cite:muwatta-maruf-1997 s.447}"
  id: "Malik berkata: Tidak ada pembalasan antara orang merdeka dan budak atas luka apa pun. Seorang budak dibunuh karena membunuh orang merdeka dengan sengaja, tetapi orang merdeka tidak dibunuh karena membunuh budak dengan sengaja. Ini adalah pendapat terbaik yang pernah saya dengar. {cite:muwatta-maruf-1997 p.447}"
