label: { ar: "الموطأ 2075 — مالك عن ابن شهاب: سأل سالم بن عبد الله عن كراء المزارع، فقال: لا بأس بها بالذهب والورق، فقال ابن شهاب: إن رافع بن خديج كثر في حديثه، ولو كانت لي مزرعة أكريتها", en: "Muwatta 2075" }
summary:
  ar: "يروي مالك عن ابن شهاب أنه سأل سالم بن عبد الله عن كراء المزارع، فقال: لا بأس بها، بالذهب والورق. قال ابن شهاب: فقلت له: أرأيت الحديث الذي يذكر عن رافع بن خديج؟ فقال: أكثر رافع، ولو كانت لي مزرعة أكريتها. {cite:muwatta-maruf-1997 p.250}"
