label: { ar: "الموطأ 2075 — مالك عن ابن شهاب: سأل سالم بن عبد الله عن كراء المزارع، فقال: لا بأس بها بالذهب والورق، فقال ابن شهاب: إن رافع بن خديج كثر في حديثه، ولو كانت لي مزرعة أكريتها", en: "Muwatta 2075", es: "Muwatta 2075", fr: "Muwatta 2075", ur: "موطا 2075", tr: "El-Muvatta 2075 — Malik, İbn Şihab'dan rivayetle: Salim ibn Abdullah'a çiftlik kiralamak soruldu ve o şöyle dedi: Altın veya gümüşle ödenirse bunda bir sakınca yoktur. İbn Şihab dedi ki: Rafi' ibn Hatic birçok hadis rivayet etti ve eğer bir çiftliğim olsaydı, onu kiraya verirdim.", id: "Al-Muwatta 2075 — Malik, berdasarkan riwayat Ibn Shihab: Salim ibn Abdullah ditanya tentang menyewakan ladang, dan dia berkata: Tidak ada salahnya jika dibayar dengan emas atau perak. Ibn Shihab berkata: Rafi’ ibn Khadij meriwayatkan banyak hadits, dan jika aku memiliki ladang, aku akan menyewakannya." }
summary:
  ar: "يروي مالك عن ابن شهاب أنه سأل سالم بن عبد الله عن كراء المزارع، فقال: لا بأس بها، بالذهب والورق. قال ابن شهاب: فقلت له: أرأيت الحديث الذي يذكر عن رافع بن خديج؟ فقال: أكثر رافع، ولو كانت لي مزرعة أكريتها. {cite:muwatta-maruf-1997 p.250}"
  tr: "Malik, İbn Şihab'dan rivayetle, Salim ibn Abdullah'a çiftlik kiralamak hakkında sorduğunu ve onun şöyle dediğini aktarır: \"Altın karşılığında da, gümüş karşılığında da olsa bunda bir sakınca yoktur.\" İbn Şihab şöyle dedi: \"Ona dedim ki: Rafi' ibn Hatic'ten rivayet edilen hadis ne olacak? O da dedi ki: Rafi' daha güvenilirdir ve eğer bir çiftliğim olsaydı onu kiraya verirdim.\" {cite:muwatta-maruf-1997 s.250}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia bertanya kepada Salim ibn Abdullah tentang menyewakan ladang, dan Salim menjawab: Tidak ada salahnya, baik untuk emas maupun perak. Ibnu Shihab berkata: Saya bertanya kepadanya: Bagaimana dengan hadits yang disebutkan dari Rafi’ ibn Khadij? Beliau menjawab: Rafi’ lebih terpercaya, dan jika saya memiliki ladang, saya akan menyewakannya. {cite:muwatta-maruf-1997 p.250}"
