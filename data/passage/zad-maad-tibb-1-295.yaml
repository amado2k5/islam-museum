text: "… يَقُولُ المالِكُ : فَتَايَ وفَتَاتي، ويَقُولُ المملوكُ : سيِّدي وسيّدَتي البخاري:، ومسلم:، وقال لمن ادَّعى أنه طبيب: أَنْتَ رجلٌ رَفِيقٌ، وَطَبِيبُها الَّذِي خَلَقَهَا صحيح: أحمد:، وأبو داود: والجاهلون يُسمُّون الكافَر الذي له عِلْمٌ بشيء من الطبيعة حكيماً، وهو مِن أسفه …"
