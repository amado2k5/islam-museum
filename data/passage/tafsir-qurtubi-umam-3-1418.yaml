text: "… عن النبيّ وَطِفي؛ فذكره. غريب من حديث عطاء أرسله عن معاذ. وقال أبن عباس وأنس بن مالك: لما أفتتح رسول اللّٰه وَا في مكة ووعد أمّته ملك فارس والروم قال المنافقون واليهود : هيهات هيهات ! من أين لمحمد ملك …"
