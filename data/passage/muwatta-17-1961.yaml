label: { ar: "الموطأ 1961 — مالك: فيمن باع سلعة وقال البائع عند المواجبة: أبيعك على أن أستشير فلانا، فإن رضي فقد جاز البيع، فإن ندم المشتري قبل أن يستشير البائع، فالبيع لازم لهما على ما وصفا، ولا خيار للمبتاع", en: "Muwatta 1961", es: "Muwatta 1961", fr: "Muwatta 1961", ur: "موطا 1961", tr: "El-Muvatta 1961 — Malik: Bir mal satan kişi, işlem sırasında şöyle derse: “Şu kişiye danışmam şartıyla size satacağım.” Eğer o kişi kabul ederse, satış geçerlidir. Alıcı, satıcıya danışmadan önce pişman olursa, satış her ikisi için de bağlayıcıdır ve alıcının başka seçeneği yoktur.", id: "Al-Muwatta 1961 — Malik: Mengenai seseorang yang menjual suatu barang dan penjual berkata pada saat transaksi: “Saya akan menjualnya kepada Anda dengan syarat saya berkonsultasi dengan si fulan.” Jika dia setuju, maka penjualan itu sah. Jika pembeli menyesalinya sebelum berkonsultasi dengan penjual, maka penjualan itu mengikat keduanya sebagaimana yang telah mereka sepakati, dan pembeli tidak punya pilihan." }
summary:
  ar: "قال مالك فيمن باع من رجل سلعة. فقال البائع عند مواجبة البيع: أبيعك على أن أستشير فلانا، فإن رضي فقد جاز البيع، وإن كره فلا بيع بيننا. فيتبايعان على ذلك، ثم يندم المستري قبل أن يستشير البائع فلانا: إن ذلك البيع لازم لهما، على ما وصفا، ولا خيار للمبتاع، وهو لازم له، إن أحب الذي اشترط له الخيار أن يجيزه. {cite:muwatta-maruf-1997 p.203}"
  tr: "Malik, bir malın başka bir adama satıldığı ve satıcının satışa razı olduktan sonra şöyle dediği bir durumu anlattı: “Şu kişiye danışmam şartıyla size satacağım. Eğer onaylarsa satış geçerlidir; onaylamazsa aramızda satış olmaz.” Daha sonra bu esasa göre işlem gerçekleşir ve alıcı daha sonra satıcıya danışmadan önce pişman olur. Malik şöyle dedi: “Bu satış, anlattıkları gibi her ikisi için de bağlayıcıdır ve alıcının bunu iptal etme seçeneği yoktur. Seçenek belirtilen kişi bunu onaylamak istese bile, satış alıcı için bağlayıcıdır.” {cite:muwatta-maruf-1997 s.203}"
  id: "Malik berkata mengenai seseorang yang menjual suatu barang kepada orang lain, dan penjual berkata, setelah menyetujui penjualan tersebut: “Saya akan menjualnya kepada Anda dengan syarat saya berkonsultasi dengan si anu. Jika dia menyetujui, maka penjualan itu sah; jika dia tidak menyetujui, maka tidak ada penjualan antara kita.” Mereka kemudian melanjutkan transaksi berdasarkan hal tersebut, dan pembeli kemudian menyesalinya sebelum berkonsultasi dengan penjual. Malik berkata: “Penjualan itu mengikat mereka berdua, sebagaimana yang mereka jelaskan, dan pembeli tidak memiliki pilihan untuk membatalkannya. Itu mengikatnya, bahkan jika orang yang diberi pilihan ingin meratifikasinya.” {cite:muwatta-maruf-1997 p.203}"
