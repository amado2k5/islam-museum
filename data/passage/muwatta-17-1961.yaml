label: { ar: "الموطأ 1961 — مالك: فيمن باع سلعة وقال البائع عند المواجبة: أبيعك على أن أستشير فلانا، فإن رضي فقد جاز البيع، فإن ندم المشتري قبل أن يستشير البائع، فالبيع لازم لهما على ما وصفا، ولا خيار للمبتاع", en: "Muwatta 1961" }
summary:
  ar: "قال مالك فيمن باع من رجل سلعة. فقال البائع عند مواجبة البيع: أبيعك على أن أستشير فلانا، فإن رضي فقد جاز البيع، وإن كره فلا بيع بيننا. فيتبايعان على ذلك، ثم يندم المستري قبل أن يستشير البائع فلانا: إن ذلك البيع لازم لهما، على ما وصفا، ولا خيار للمبتاع، وهو لازم له، إن أحب الذي اشترط له الخيار أن يجيزه. {cite:muwatta-maruf-1997 p.203}"
