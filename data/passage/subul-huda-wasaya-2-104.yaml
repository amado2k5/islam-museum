text: "… شُقَّ بَطْنُه وهو حَىّ لا يتأَلم بذلك، عُرِج بذات روحه المقدسة حقيقةً من غير إماتة. ومَنْ سواه : لا يَنَالُ بذات رُوحه الصَّعُودَ إلى السموات إلا بعد الموت والمفارقة، إلى آخر كلامه، وسيأتى بتمامه فى باب حياته فى قبره. و …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 2، ص 104، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 2, p. 104, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 2، ص 104 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 2, pág. 104, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 2, page 104, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 2. cildinin 104. sayfasında, vasiyet veya son ahit, defin, mezar ve türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
