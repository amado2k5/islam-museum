label:
  ar: "البخاري 7453 — إن رحمتي سبقت غضبي"
  en: "Bukhari 7453 — My mercy outstrips My anger"
  ur: "بخاری 7453 — میری رحمت میرے غضب پر سبقت لے گئی"
  es: "Bujari 7453 — Mi misericordia supera mi ira"
  fr: "Bukhari 7453 — Ma miséricorde surpasse Ma colère"
text: "لما قضى الله الخلق كتب عنده فوق عرشه، إن رحمتي سبقت غضبي ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7453: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7453: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7453: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7453: Mi misericordia supera mi ira. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 7453: « Ma miséricorde surpasse Ma colère. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
