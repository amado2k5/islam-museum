label: { ar: "صحيح مسلم 143 — حق على كل مسلم", en: "Sahih Muslim 143 — a right due from every Muslim", ur: "صحیح مسلم 143 — ہر مسلمان پر حق", fr: "Sahih Muslim 143 — un droit dû par chaque musulman", es: "Sahih Muslim 143 — un derecho debido por cada musulmán", tr: "Sahih Müslim 143 — Her Müslümanın hakkı", id: "Sahih Muslim 143 — Sebuah hak bagi setiap Muslim" }
text: "… مُعَاذَ بْنَ جَبَلٍ \". قُلْتُ لَبَّيْكَ رَسُولَ اللَّهِ وَسَعْدَيْكَ. قَالَ \" هَلْ تَدْرِي مَا حَقُّ اللَّهِ عَلَى الْعِبَادِ \". قَالَ قُلْتُ اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" فَإِنَّ حَقَّ اللَّهِ عَلَى الْعِبَادِ أَنْ يَعْبُدُوهُ وَلاَ يُشْرِكُوا بِهِ شَيْئًا \". ثُمَّ سَارَ سَاعَةً ثُمَّ قَالَ \" يَا مُعَاذَ بْنَ جَبَلٍ \". قُلْتُ لَبَّيْكَ رَسُولَ اللَّهِ وَسَعْدَيْكَ. قَالَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 143، يرد فيه ذكر حق على كل مسلم. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 143 (The Book of Faith), whose wording mentions a right due from every Muslim. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 143، جس کے الفاظ میں ہر مسلمان پر حق کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 143, dont le texte mentionne un droit dû par chaque musulman. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 143, cuyo texto menciona un derecho debido por cada musulmán. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 143 numaralı hadis, her Müslümanın yerine getirmesi gereken bir haktan bahsetmektedir. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 143, menyebutkan sebuah hak yang wajib dilakukan oleh setiap Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
