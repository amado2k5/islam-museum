label: { ar: "سنن ابن ماجه 160 — الأب والأبوة", en: "Sunan Ibn Majah 160 — the father and fatherhood", ur: "سنن ابن ماجہ 160 — باپ اور والدیت" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، وَأَبُو كُرَيْبٍ قَالاَ حَدَّثَنَا وَكِيعٌ، حَدَّثَنَا سُفْيَانُ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ عَبَايَةَ بْنِ رِفَاعَةَ، عَنْ جَدِّهِ، رَافِعِ بْنِ خَدِيجٍ قَالَ جَاءَ جِبْرِيلُ - أَوْ مَلَكٌ - إِلَى النَّبِيِّ ـ فَقَالَ \" مَا تَعُدُّونَ مَنْ شَهِدَ بَدْرًا فِيكُمْ قَالُوا خِيَارَنَا. قَالَ كَذَلِكَ هُمْ عِنْدَنَا خِيَارُ الْمَلاَئِكَةِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 160، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 160 (The Book of the Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 160، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
