text: "… الْمَافِيَةً فيهذه النيات يرخص فى ذكر المرض وإنما يشترط ذلك لأن ذكره شكاية، والشكوى من اللّٰه تعالى حرام، كما ذكرته فى تحريم السؤال على الفقراء إلا بضرورة وإصمير الإظهار شكاية بقرينة السخط وإظهار الكراهة لفعل اللّٰه تعالى. فإن خلا عره …"
