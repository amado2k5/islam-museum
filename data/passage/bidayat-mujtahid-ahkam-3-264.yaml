label: { ar: "بداية المجتهد لابن رشد، المجلد المصوَّر 3، ص 264 — ما فُرض على الناس، الفرض", en: "Ibn Rushd's Bidayat al-Mujtahid, scan volume 3, p. 264 — what was made obligatory on people; the obligatory (fard)", ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 3، ص 264 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 3, p. 264 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 3, p. 264 — lo que se impuso a la gente; lo obligatorio (fard)" }
text: "… الباب الثاني • حكم الأذان اختلف العلماء في حكم الأذان هل هو واجب أو سنة مؤكدة؟ وإن كان وَاجباً فهل هو من فروض الأعيان، أو من فروض الكفاية ؟ فقيل عن مالك : إن الأذان هو فرض على مساجد الجماعات، …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 3، ص 264، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض العين، وفرض الكفاية، والواجب، والسنن المؤكدة والرواتب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 3, p. 264, whose wording mentions what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya), the obligatory (wajib), the emphasised and regular sunnas; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 3، ص 264 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ عین، فرضِ کفایہ، واجب، سننِ مؤکدہ اور رواتب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 3, p. 264, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), l'obligatoire (wajib), les sunnas appuyées et régulières ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 3, p. 264, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), lo obligatorio (wajib), las sunnas enfatizadas y regulares; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
