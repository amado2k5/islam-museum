label: { ar: "الموطأ 741 — مالك: إن بلغ الصنف الواحد خمسة أوسق ففيه الزكاة، والتمر وإن اختلفت أسماؤه وألوانه يجمع بعضه إلى بعض", en: "Muwatta 741" }
summary:
  ar: "قول لمالك: إن كان في الصنف الواحد من تلك الأصناف ما يبلغ خمسة أوسق ففيه الزكاة، وإن لم يبلغ فلا زكاة فيه؛ وتفسير ذلك أن يجذ الرجل من التمر خمسة أوسق وإن اختلفت أسماؤه وألوانه فإنه يُجمع بعضه إلى بعض ثم تؤخذ منه الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.369}"
