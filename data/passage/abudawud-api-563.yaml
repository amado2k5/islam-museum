label: { ar: "سنن أبي داود 563 — كتابة الحسنات، محو السيئات وحط الخطايا", en: "Sunan Abi Dawud 563 — the writing of good deeds; bad deeds erased and sins shed", ur: "سنن ابی داؤد 563 — نیکیوں کا لکھا جانا، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sunan Abi Dawud 563 — la escritura de las buenas obras; las malas obras borradas y los pecados perdonados", fr: "Sunan Abi Dawud 563 — L'inscription des bonnes actions; les mauvaises actions effacées et les péchés pardonnés", tr: "Sunan Abi Davud 563 — İyilikleri yazmak, kötü amelleri silmek ve günahları ortadan kaldırmak", id: "Sunan Abi Dawud 563 — Mencatat amal kebaikan, menghapus amal keburukan, dan menghilangkan dosa" }
text: "… يَقُولُ \" إِذَا تَوَضَّأَ أَحَدُكُمْ فَأَحْسَنَ الْوُضُوءَ ثُمَّ خَرَجَ إِلَى الصَّلاَةِ لَمْ يَرْفَعْ قَدَمَهُ الْيُمْنَى إِلاَّ كَتَبَ اللَّهُ عَزَّ وَجَلَّ لَهُ حَسَنَةً وَلَمْ يَضَعْ قَدَمَهُ الْيُسْرَى إِلاَّ حَطَّ اللَّهُ عَزَّ وَجَلَّ عَنْهُ سَيِّئَةً فَلْيُقَرِّبْ أَحَدُكُمْ أَوْ لِيُبَعِّدْ فَإِنْ أَتَى الْمَسْجِدَ فَصَلَّى فِي جَمَاعَةٍ غُفِرَ لَهُ فَإِنْ أَتَى الْمَسْجِدَ وَقَدْ صَلَّوْا بَعْضًا وَبَقِيَ بَعْضٌ صَلَّى مَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 563، يذكر كتابة الحسنات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 563 (Prayer (Kitab Al-Salat)), that speaks of the writing of good deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 563، جس میں نیکیوں کا لکھا جانا، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 563 (Oración (Kitab Al-Salat)), que habla de la escritura de buenas acciones, el borrado de malas acciones y el perdón de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 563 (La Prière), évoque l'inscription des bonnes actions, l'effacement des mauvaises et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent une action."
  tr: "Sunan Ebu Davud'da yer alan 563 numaralı hadiste, iyi amellerin kaydedilmesi, kötü amellerin silinmesi ve günahların kaldırılmasından bahsedilir. Bu hadis, iyi ve kötü amellerin listesini ve amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 563, menyebutkan pencatatan amal kebaikan, penghapusan amal keburukan, dan penghapusan dosa. Hadits ini memuat daftar amal baik dan amal keburukan beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan-perbuatan tersebut."
