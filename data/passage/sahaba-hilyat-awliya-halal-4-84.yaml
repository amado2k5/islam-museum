text: "… عبد اللّٰه بن احمد بن حقبل حدثنى أبى ثنا خالد بن حيان ثنا جعفر بن برقان عن ميمون بن مهران. قال : لا يسلم للرجل الحلال، حتى يجعل بينه وبين الحرام حاجزا من الحلال. حدثنا أبو بكر بن مالك ثنا …"
summary:
