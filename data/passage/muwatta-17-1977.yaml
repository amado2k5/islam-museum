label: { ar: "الموطأ 1977 — مالك: في الرجل يقول للرجل: اشتر هذه السلعة بيني وبينك، وانقد عني وأنا أبيعها لك، إن ذلك لا يصلح، لأنه إنما هو سلف يسلفه إياه على أن يبيع له، فإن هلكت السلعة أخذ الرجل الذي نقد الثمن من شريكه ما نقد عنه، وهذا من السلف الذي يجر منفعة", en: "Muwatta 1977", es: "Muwatta 1977", fr: "Muwatta 1977", ur: "موطا 1977", tr: "El-Muvatta 1977 — Malik: Bir kimse diğerine, “Bu malı aramızda satın al, bana peşin öde, ben de sana satayım” derse, bu caiz değildir; çünkü bu, ona satması şartıyla verdiği bir borçtur. Mal bozulursa, bedelini ödeyen kişi, ortağından onun adına ödediği parayı geri alır. Bu, kâr getiren bir borçtur.", id: "Al-Muwatta 1977 — Malik: Mengenai seorang pria yang berkata kepada orang lain, “Belilah barang ini di antara kita, dan bayarlah aku di muka, lalu aku akan menjualnya kepadamu,” ini tidak diperbolehkan, karena itu hanyalah pinjaman yang diberikannya dengan syarat ia menjual barang tersebut untuknya. Jika barang tersebut rusak, orang yang membayar harganya akan mengambil kembali dari rekannya apa yang telah dibayarkannya atas namanya. Ini adalah pinjaman yang menghasilkan keuntungan." }
summary:
  ar: "قال مالك في الرجل يقول للرجل: اشتر هذه السلعة بيني وبينك، وانقد عني، وأنا أبيعها لك: إن ذلك لا يصلح، حين قال: انقد عني وأنا أبيعها لك. وإنما ذلك سلف يسلفه إياه على أن يبيعها له. ولو أن تلك السلعة هلكت أو فاتت، أخذ ذلك الرجل الذي نقد الثمن من شريكه ما نقد عنه. فهذا من السلف الذي يجر منفعة. {cite:muwatta-maruf-1997 p.209}"
  tr: "Malik, bir başkasına, “Bu malı aramızda satın al, bana peşin öde, ben de sana satayım” diyen bir adam hakkında şöyle demiştir: Bu caiz değildir, çünkü “Bana peşin öde, ben de sana satayım” demiştir. Aksine, bu, ona satması şartıyla verdiği bir borçtur. Ve eğer o mal imha edilir veya kaybolursa, bedelini ödeyen kişi, ortağından onun adına ödediği parayı geri alabilir. Bu, kâr getiren bir borçtur. {cite:muwatta-maruf-1997 s.209}"
  id: "Malik berkata mengenai seorang pria yang berkata kepada orang lain, “Belilah barang ini di antara kita, dan bayarlah aku di muka, lalu aku akan menjualnya kepadamu,” bahwa hal ini tidak diperbolehkan, karena ia berkata, “Bayarlah aku di muka, lalu aku akan menjualnya kepadamu.” Sebaliknya, itu adalah pinjaman yang diberikannya dengan syarat ia menjual barang tersebut kepadanya. Dan jika barang tersebut rusak atau hilang, orang yang membayar harganya dapat mengambil kembali dari rekannya apa yang telah dibayarkannya atas namanya. Ini adalah pinjaman yang menghasilkan keuntungan. {cite:muwatta-maruf-1997 p.209}"
