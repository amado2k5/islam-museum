summary:
  ar: "قال مالك في الرجل يقول للرجل: اشتر هذه السلعة بيني وبينك، وانقد عني، وأنا أبيعها لك: إن ذلك لا يصلح، حين قال: انقد عني وأنا أبيعها لك. وإنما ذلك سلف يسلفه إياه على أن يبيعها له. ولو أن تلك السلعة هلكت أو فاتت، أخذ ذلك الرجل الذي نقد الثمن من شريكه ما نقد عنه. فهذا من السلف الذي يجر منفعة. {cite:muwatta-maruf-1997 p.209}"
