label: { ar: "سنن ابن ماجه 1178 — الأب والأبوة", en: "Sunan Ibn Majah 1178 — the father and fatherhood", ur: "سنن ابن ماجہ 1178 — باپ اور والدیت" }
text: "… بْنِ أَبِي مَرْيَمَ، عَنْ أَبِي الْحَوْرَاءِ، عَنِ الْحَسَنِ بْنِ عَلِيٍّ، قَالَ عَلَّمَنِي جَدِّي رَسُولُ اللَّهِ ـ كَلِمَاتٍ أَقُولُهُنَّ فِي قُنُوتِ الْوِتْرِ \" اللَّهُمَّ عَافِنِي فِيمَنْ عَافَيْتَ وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ وَاهْدِنِي فِيمَنْ هَدَيْتَ وَقِنِي شَرَّ مَا قَضَيْتَ وَبَارِكْ لِي فِيمَا أَعْطَيْتَ إِنَّكَ تَقْضِي وَلاَ يُقْضَى عَلَيْكَ إِنَّهُ لاَ يَذِلُّ مَنْ وَالَيْتَ سُبْحَانَكَ رَبَّنَا تَبَارَكْتَ وَتَعَالَيْتَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1178، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1178 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1178، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
