label: { ar: "الموطأ 420 — عبد الله بن عتبة يصلي الضحى خلف عمر فيقربه عن يمينه", en: "Muwatta 420", es: "Muwatta 420", fr: "Muwatta 420", ur: "موطا 420", tr: "Al-Muwatta 420 — Abdullah ibn Utbah, Ömer'in arkasında Duha namazını kılar; Ömer de onu sağ tarafına yakın bir yere yerleştirir.", id: "Al-Muwatta 420 — Abdullah ibn Utbah mengerjakan salat Duha di belakang Umar, yang menempatkannya di dekat sebelah kanannya." }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن أبيه عبد الله بن عتبة، في باب جامع سبحة الضحى: دخل على عمر بن الخطاب بالهاجرة فوجده يصلي نافلة، فقام وراءه فقرّبه عمر حتى جعله حذاءه عن يمينه، فلما جاء يرفأ حاجب عمر تأخر فصفّا وراءه. ويعرّف المحقق يرفأ بأنه حاجب عمر، ويذكر أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.219}"
  tr: "Malik'in, İbn Şihab'dan, Ubeydullah ibn Abdullah ibn Utbe ibn Mes'ud'dan, babası Abdullah ibn Utbe'den rivayet ettiği, Duha'nın tam nafile namazı bölümünde yer alan bir rivayete göre: Öğle vakti Ömer ibn el-Hattab'ın yanına girdi ve onu nafile namaz kılarken buldu. Onun arkasında durdu ve Ömer onu yanına, sağına çekti. Ömer'in kâhyası Yarfa' gelince, geri çekildi ve ikisi de onun arkasında durdu. Araştırmacı Yarfa'yı Ömer'in kâhyası olarak tanımlıyor ve bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.219}"
  id: "Sebuah riwayat yang dinabikan oleh Malik atas otoritas Ibn Shihab, atas otoritas Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud, atas otoritas ayahnya Abdullah ibn Utbah, dalam surah tentang shalat sunnah lengkap Duha: Ia menemui Umar ibn al-Khattab pada tengah hari dan mendapati beliau sedang mengerjakan shalat sunnah. Ia berdiri di belakang Umar, dan Umar menariknya mendekat hingga ia berada di sampingnya di sebelah kanan. Ketika Yarfa', pengawal Umar, tiba, ia mundur, dan mereka berdua berdiri di belakang Umar. Peneliti mengidentifikasi Yarfa' sebagai pengawal Umar dan menyebutkan bahwa riwayat ini dinabikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.219}"
