label: { ar: "الموطأ 420 — عبد الله بن عتبة يصلي الضحى خلف عمر فيقربه عن يمينه", en: "Muwatta 420" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن أبيه عبد الله بن عتبة، في باب جامع سبحة الضحى: دخل على عمر بن الخطاب بالهاجرة فوجده يصلي نافلة، فقام وراءه فقرّبه عمر حتى جعله حذاءه عن يمينه، فلما جاء يرفأ حاجب عمر تأخر فصفّا وراءه. ويعرّف المحقق يرفأ بأنه حاجب عمر، ويذكر أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.219}"
