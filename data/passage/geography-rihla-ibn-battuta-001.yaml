text: "ن الخليفة أبي الربيع سليمان العباسي بمصر ، وأعلمه بالأمر . فكتب له كتابا بخطه بالنيابة عنه ببلاد الهند . فاستصحب الشيخ سعيد الكتاب وذهب إلى اليمن واشترى بها ثلاث خلع سودا ، وركب البحر إلى الهند . فلما وصل"
