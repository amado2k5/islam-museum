text: "الذي يلي البرج الأخير الملك فيهم أربعين سنة، وقال أبو معشر في كتاب القرانات: من القران الذي قبلة في المثلثة، وهذا القران الذي هو قران القسمة إذا انتهت إلى السابعة والعشرين من الحوت فيها شرف العلويين ينقسم إلى كبير وصغير"
