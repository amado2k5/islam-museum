text: "… ثم رجعت كحرمتها بالأمس، فليُبلَغ شاهدُكم غائبَكم، ولا يحلّ لنا من غنائمها شءُ. وفتحها يومَ الجمعة لعشر بقين من شهر رمضان، وأَقام بها رسول اللّٰه صلّعم، خمس. عشرة ليلة يصلى ركعتين، ثم خرج إلى حُنين، واستعمل على مكة ' عَتْاب …"
