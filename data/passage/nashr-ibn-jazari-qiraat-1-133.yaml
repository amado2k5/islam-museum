text: "… وقد اشتهر اسمه وطال عمره فانفرد بالعلو مع علمه بالتفسير وعلل القراآت كان يحفظ خمسين الف بيت شاهداً للقرآن قال الداني مشهور نبيل حافظ ماهر حاذق قراءة ابى عمرو - رواية الدوري طريق ابى الزعراء عن الدوري طريق ابن مجاهد …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 133، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 133, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 133 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Nashr fi al-Qira'at al-'Ashr de Ibn al-Jazari, volumen 1, pág. 133, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du traité al-Nashr fi al-Qira'at al-'Ashr d'Ibn al-Jazari (tome 1, p. 133), mentionnant les lectures du Coran et les lecteurs; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "İbn el-Cezeri'nin \"On Okuma\" adlı eserinin 1. cildinin 133. sayfasından, Kur'an okunuşlarını ve okuyucularını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jazari, \"Sepuluh Bacaan,\" Jilid 1, halaman 133, yang menyebutkan bacaan Al-Quran dan para qarinya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
