text: |-
  ١٢٩
  يقال أبننتك أى أظهرت لك يتى ويثبقت اخبر بثيئة نسرته وكذلك الغيار اذا هيجته ⁦(بحث)⁩
  بحثت عن الشى وابتحثت عنه أى فتشت عنه وفى المثل كالباحث عن الشفرة وقواهم
  ركته بباحث البقرأى بالم.كان القفريعى بحيث لا يدرى أين هو برث البرث الارض
  هلة الملينة والجمع براث وابرات وبروث وفى شعرروية البرارث ويقال انه حطداً ب قث
  البرغوث واح_دالبراغيث (بعث بعثه وابتعنه يعنى أى أرسله فائبعث وقواهم كنت
  فى بعث فلان أى فى جيشه الذى بعث معه والبعوث الجيوش وبعثت الذاقة أثرتها وبعثه من
  منامه أى أهبه وبعث الموتى نشرهم ليوم البعث وانبعث فى السير أى أسرع وتبعث منى
  الشعر أى اتبعث كأنه ساروالبعيث اسم شاعر من بنى غيم سمى بذلك لقوله
  تبعث منى ما تبعت بع-دما اسشتمرّ فؤادى واستمر مر يرى
  ويوم بعاث بالفم يوم للاوس واللخزرج ( غت ابن السكيت البغاث طائرا بغث الى
  لغيرة دوين ارخة يطىء الطيران وفى المثل ان البغات بارضنايس تنسر أى من جاورناعز بنها
  وقال يونس فن جعل البغاث واحدافجمعه بغثان مشل غزال وغزلان ومن قال المذكر
  والاتى بغائة فالجمع بغاث مشل نعامة ونعام وقال الفراءيقات الطيرشرارها ومالا يصيد
  منها وفى بغاث ثلاث لغات والابغث قريب من الاغبر والابغث مكان ذور مسل والبغثاءمن
  الغتم مثل الرقطاء والبغنا اخلاط الناس يقال دخلنا فى البغثاء أى فى عامة الناس
  ويهاعتهم (بوث باث عن الشي يتوث بوثابحث عنه والاستباثة الاستخراج وقال ابو المثلم
  لحق بنى شغارة أن يقولوا • لصخرالفىّ ماذا تستبيت
  ( جهث بهئة بالضم أبوحى من سليم وهوب نة بن سليم بن منصور وقال الجهنى
  تنادوايال بهنة اذرأونا • فقلنا أحسنف ملأجهينا
  وفلان لبهئة أى لزنية
  صل التاء) ( فت التفث فى المناسك ماكان من تحوقص الاظفار
  والشارب وحلق الرأس والعانة ورمى الجار ونحر البدن واشباه ذلك قال أبو عبيدة ولم يجئ
  فيه شعر يحتج به
  صل الثاء لث الثلاثة فى عدد المذكر والثلاث فى عدد المؤنث والثلاثاء
  من الايام ويجمع على ثلاثاوات والثلث سهسم من ثلاثة فإذافتحت الثاءزدت ياء فقلت ثليث
  مثل غين وسبيع وسديس وخيس ونصيف وأنكر أبوزيد منها خيسا وثليثا والثلث بالمكسر من
  قواهم هو يس-قى نخله الثلث لا يستعمل النلث الافى هذا الموضع وليس فى الوردثلث لان
  أقصر الورد الرفه وهو أن تشرب الابل كل يوم ثم الغب وهو أن ترديوما وتدع يوماقاذا ارتفع
  من الغب قالظم• اربع ثم الخس وكذلك الى العشر قاله الاصعى وثلاث ومثلت غيرمصروف
  للعدل والصفة لانه عدل من ثلاثة الى ثلاث ومثلث وه وصفة لانك تقول مررت يقوم مننى
  وثلاث وقال تعالى أولى أجنحة مثى وثلاث ورباع فوصف به وهذا قول سيبويه وقال غيره
  اعمالم تصرف المكرر العدل فيه فى اللفظ والمعى لاته عدل عن لفظ النين الى لفظ
  مشى وثناء وعن معنى اثنيز الى معنى اثنير ائدين لانك اذا قلت جاءت الخيدل مثنى فالمعنى اثنيز
  ٢٣
  قولة طائر أبغث قال ابن برعة
  هذا غلط من وجهين أحدهما
  أن البغاث اسم جنس وأبغت
  صفة بدلسل قواه-م أبغت بين
  البغنة وجمعه بغث مثل أحر وحر
  والوجه الشانى أنّ البغاث مالا
  يصيد من الطير وأما الابعث فهو
  ما كان لوند أغبروقد يكون صائدل
  وغير صائدفال النضر وأما الصقود
  فنها أبغث وأحوروأ بيض فجعل
  الابغت صفة لما كان صائدا أو
  غير صائد بخلاف البغاث الذى
  لا يكون منه شئ صائد اه
  باختصار من م ر وسكت عليه
  وفيه تظر
