label: { ar: "الأربعون 8 — أمرت أن أقاتل الناس", en: "Arba'un 8 — I was ordered to fight the people", es: "8 de Arba'un — Me ordenaron luchar contra el pueblo", fr: "Arba'un 8 — J'ai reçu l'ordre de combattre le peuple", ur: "اربعون 8 - مجھے لوگوں سے لڑنے کا حکم دیا گیا تھا۔", tr: "Kırk sekiz — Halkla savaşmam emredildi.", id: "Empat puluh delapan — Aku diperintahkan untuk melawan rakyat" }
text: "أمرت أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأن محمدا رسول الله، ويقيموا الصلاة، ويؤتوا الزكاة، فإذا فعلوا ذلك عصموا مني دماءهم وأموالهم إلا بحق الإسلام، وحسابهم على الله"
summary:
  ar: "حديث عبد الله بن عمر، وهو الحديث الثامن في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري (25) ومسلم (22) من رواية واقد بن محمد عن أبيه عن جده ابن عمر، وتفرد البخاري بلفظ «إلا بحق الإسلام»، وروي بمعناه عن أنس ومعاذ بن جبل وأبي هريرة وجابر وأبي مالك الأشجعي عن أبيه؛ يبين ابن رجب أن النبي كان يقبل من كل من جاءه يريد الدخول في الإسلام الشهادتين فقط فيعصم دمه ويجعله مسلماً دون أن يشترط عليه الصلاة والزكاة ابتداءً، وردّ على سفيان بن عيينة قوله إن هذا كان أول الإسلام قبل فرض الصلاة والزكاة بأن رواة الأحاديث إنما صحبوا النبي بالمدينة، وأنه كان مأموراً بالقتال بعد هجرته ⁦(جامع العلوم والحكم ص 205–217)⁩."
  en: "Abdullah ibn Umar's hadith, the eighth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (25) and Muslim (22) through Waqid ibn Muhammad from his father from his grandfather Ibn Umar — the words 'except by the right of Islam' being unique to al-Bukhari's wording — and reported in the same sense from Anas, Mu'adh ibn Jabal, Abu Hurayra, Jabir and Abu Malik al-Ashja'i from his father; Ibn Rajab explains that the Prophet accepted the two testimonies alone from whoever came wishing to enter Islam, thereby protecting his blood and counting him a Muslim without first stipulating prayer and zakat, and answers Sufyan ibn Uyayna's claim that this belonged to the beginning of Islam before the duties were imposed, noting that the transmitters accompanied the Prophet only in Medina and that he had been ordered to fight after the hijra (Jami' al-Ulum wal-Hikam pp. 205–217)."
  es: "Hadiz de Abdullah ibn Umar, el octavo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Bukhari (25) y Muslim (22) a través de Waqid ibn Muhammad de su padre de su abuelo Ibn Umar —las palabras 'excepto por el derecho del Islam' son únicas de la redacción de al-Bukhari— y reportado en el mismo sentido por Anas, Mu'adh ibn Jabal, Abu Hurayra, Jabir y Abu Malik al-Ashja'i de su padre; Ibn Rajab explica que el Profeta aceptaba solo los dos testimonios de cualquiera que viniera deseando entrar en el Islam, protegiendo así su sangre y considerándolo musulmán sin estipular primero la oración y el zakat, y responde a la afirmación de Sufyan ibn Uyayna de que esto pertenecía al principio del Islam antes de que se impusieran los deberes, señalando que los transmisores acompañaron al Profeta solo en Medina y que se le había ordenado luchar después de la hégira (Jami' al-Ulum wal-Hikam pp. 205–217)."
  fr: "Le hadith d'Abdullah ibn Umar, le huitième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Bukhari (25) et Muslim (22) par Waqid ibn Muhammad de son père de son grand-père Ibn Umar — les mots « sauf par le droit de l'Islam » étant uniques à la formulation d'al-Bukhari — et rapporté dans le même sens par Anas, Mu'adh ibn Jabal, Abu Hurayra, Jabir et Abu Malik al-Ashja'i de son père; Ibn Rajab explique que le Prophète acceptait les deux seuls témoignages de quiconque souhaitait entrer dans l'Islam, protégeant ainsi son sang et le comptant comme musulman sans exiger au préalable la prière et la zakat, et répond à l'affirmation de Sufyan ibn Uyayna selon laquelle cela appartenait au début de l'Islam avant que les devoirs ne soient imposés, notant que les transmetteurs n'ont accompagné le Prophète qu'à Médine et qu'il avait reçu l'ordre de combattre après l'Hégire (Jami' al-Ulum wal-Hikam pp. 205–217)."
  ur: "عبداللہ ابن عمر کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی آٹھویں؛ البخاری (25) اور مسلم (22) نے واقد بن محمد کے ذریعے اپنے والد سے اپنے دادا ابن عمر سے نقل کیا ہے - الفاظ 'حق اسلام کے علاوہ' بخاری کے الفاظ سے منفرد ہیں - اور اسی معنی میں انس، معاذ بن جبل، ابو ہریرہ، جابر اور ان کے والد ابو مالکی سے روایت کی ہے۔ ابن رجب بیان کرتے ہیں کہ رسول اللہ نے ان دونوں شہادتوں کو اکیلے قبول کیا جو اسلام میں داخل ہونے کی خواہش رکھتا تھا، اس طرح اس کے خون کی حفاظت کی اور اسے پہلے نماز اور زکوٰۃ کی شرط کے بغیر مسلمان قرار دیا، اور سفیان بن عیینہ کے اس دعوے کا جواب دیا کہ یہ فرائض کے عائد ہونے سے پہلے اسلام کی ابتداء سے تعلق رکھتا تھا، یہ نوٹ کرتے ہوئے کہ رسول اللہ نے صرف مدینہ میں جنگ کا حکم دیا تھا۔ حجرہ ⁦(جامع العلوم والحکم صفحہ 205-217)⁩۔"
  tr: "Abdullah bin Ömer hadisi, İbn Receb'in açıklamasında ve El-Arba'in El-Neveviyye'de sekizinci hadis olup, Buhari (25) ve Müslim (22) tarafından Vakid bin Muhammed'den, onun babasından, onun da dedesi İbn Ömer'den rivayet edilmiştir. Buhari, \"İslam hakkı dışında\" ifadesiyle benzersizdir ve bu hadis, Enes, Muaz bin Cebel, Ebu Hurayra, Cabir ve Ebu Malik el-Eşcai'den, onun babasından rivayet edilmiştir. İbn Receb, Peygamberin kendisine İslam'a girmek isteyen herkesten sadece iki şahitliği kabul ettiğini, böylece kanlarını koruyup onları Müslüman kıldığını, başlangıçta namaz ve zekât vermelerini şart koşmadığını açıklamış ve Sufyan bin Uyaynah'ın bunun namaz ve zekât zorunluluğundan önce İslam'ın başlangıcında olduğu yönündeki iddiasını, hadis râvîlerinin sadece Medine'de Peygamberle birlikte olduklarını ve hicretinden sonra savaş emri aldığını söyleyerek reddetmiştir (Cami'ül-Ulum ve Hikam, s. 205-217)."
  id: "Hadits Abdullah bin Omar, yang merupakan hadits kedelapan dalam Al-Arba’in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Al-Bukhari (25) dan Muslim (22) dari Waqid bin Muhammad dari ayahnya dari kakeknya Ibn Omar, dan Al-Bukhari unik dalam redaksi “kecuali dengan hak Islam,” dan diriwayatkan dengan maknanya dari Anas, Muadz bin Jabal, Abu Hurairah, Jabir dan Abu Malik Al-Ashja’i dari ayahnya; Ibn Rajab menjelaskan bahwa Nabi biasa menerima dua kesaksian saja dari setiap orang yang datang kepadanya untuk masuk Islam, sehingga beliau akan melindungi darah mereka dan menjadikan mereka seorang Muslim tanpa mengharuskan mereka untuk melaksanakan salat dan zakat pada awalnya. Beliau juga membantah pernyataan Sufyan bin Uyaynah bahwa hal ini terjadi pada awal Islam sebelum kewajiban salat dan zakat, dengan mengatakan bahwa para perawi hadits hanya menyertai Nabi di Madinah, dan bahwa beliau diperintahkan untuk berperang setelah hijrah (Jami’ Al-‘Ulum wa Al-Hikam, hlm. 205–217)."
