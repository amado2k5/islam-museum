label: { ar: "صحيح البخاري 860 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 860 — the orphan and the father lost", ur: "صحیح بخاری 860 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 860 — El huérfano y el padre perdido", fr: "Sahih al-Bukhari 860 — L'orphelin et le père perdus", tr: "Sahih el-Buhari 860 — Yetim ve Babayı Kaybetme", id: "Sahih al-Bukhari 860 — Anak Yatim dan Kehilangan Ayah" }
text: "… إِسْمَاعِيلُ، قَالَ حَدَّثَنِي مَالِكٌ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ جَدَّتَهُ، مُلَيْكَةَ دَعَتْ رَسُولَ اللَّهِ لِطَعَامٍ صَنَعَتْهُ، فَأَكَلَ مِنْهُ فَقَالَ \" قُومُوا فَلأُصَلِّيَ بِكُمْ \". فَقُمْتُ إِلَى حَصِيرٍ لَنَا قَدِ اسْوَدَّ مِنْ طُولِ مَا لُبِسَ، فَنَضَحْتُهُ بِمَاءٍ فَقَامَ رَسُولُ اللَّهِ وَالْيَتِيمُ مَعِي، وَالْعَجُوزُ مِنْ وَرَائِنَا، فَصَلَّى بِنَا رَكْعَتَيْنِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 860، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 860 (Call to Prayers (Adhaan)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 860، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 860 (Llamada a la oración (Adhan)), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un hadith du Sahih al-Bukhari, n° 860 (Appel à la prière (Adhan)), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'nin 860 numaralı hadisinde yetimlerden ve babasızlık durumundan bahsedilir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 860, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
