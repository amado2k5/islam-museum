text: "وإنما يعمل الرجل ما دام حياً، فإذا مات فقد انقضى عمله"
summary:
  ar: "قول لمالك: وإنما يعمل الرجل ما دام حياً، فإذا مات فقد انقضى عمله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1049)، وأن في نسخة م «العمل» بدل «عمله» وليس كذلك في النسخ. {cite:muwatta-maruf-1997 p.440}"
  tr: "Malik şöyle demiştir: “İnsan ancak yaşadığı sürece çalışır; öldüğünde işi biter.” Editör, bunun Malik'ten Ebu Mus'ab (1049) tarafından rivayet edildiğini ve M el yazmasında diğer el yazmalarında olduğu gibi “onun işi” yerine “iş” ifadesinin kullanıldığını belirtmektedir. {cite:muwatta-maruf-1997 s.440}"
  id: "Malik berkata: “Seseorang hanya bekerja selama ia hidup; ketika ia meninggal, pekerjaannya berakhir.” Editor mencatat bahwa ini diriwayatkan dari Malik oleh Abu Mus’ab (1049), dan bahwa dalam manuskrip M tertulis “pekerjaan” dan bukan “pekerjaannya,” yang berbeda dengan manuskrip lainnya. {cite:muwatta-maruf-1997 p.440}"
