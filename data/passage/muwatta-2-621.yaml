label: { ar: "الموطأ 621 — عروة مرسلاً: رجلان بالمدينة أحدهما يلحد والآخر لا يلحد، فجاء الذي يلحد فلحد للنبي", en: "Muwatta 621" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، قال: كان بالمدينة رجلان، أحدهما يلحد والآخر لا يلحد، فقالوا: أيهما جاء أولاً عمل عمله، فجاء الذي يلحد فلحد للنبي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 22/296–297) أنه لم يُختلف عن مالك في إرساله، وأن حماد بن سلمة رواه عن هشام عن أبيه عن عائشة بإسناد صحيح، ويضيف أن ابن ماجة (1558) رواه من طريق ابن أبي مليكة عن عائشة بإسناد ضعيف. {cite:muwatta-maruf-1997 p.317}"
