label: { ar: "الموطأ 1863 — يحيى عن مالك عن نافع عن ابن عمر: من ابتاع طعاما فلا يبعه حتى يستوفيه", en: "Muwatta 1863", es: "Muwatta 1863", fr: "Muwatta 1863", ur: "موطا 1863", tr: "El-Muvatta 1863 — Yahya, Malik'ten, o da Nafi'den, o da İbn Ömer'den rivayetle: Yiyecek satın alan kimse, onu teslim almadan satmamalıdır.", id: "Al-Muwatta 1863 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Nafi’ berdasarkan riwayat Ibn Umar: Barangsiapa membeli makanan, janganlah menjualnya sebelum ia menguasainya." }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: من ابتاع طعاما فلا يبعه حتى يستوفيه. ويعرف المحقق العينة بأنها أن يبيع الرجل متاعه إلى أجل، ثم يشتريه في المجلس بثمن حال، ليسلم به من الربا، وأنها حرام إذا اشترط المشتري على البائع أن يشتريها منه بثمن معلوم. {cite:muwatta-maruf-1997 p.167}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakde çevirmiştir: \"Kim yiyecek alırsa, onu eline geçmeden satmasın.\" Alim, 'Aynah'ı, bir kişinin faizden kaçınmak için malını kredili olarak satıp, aynı işlemde nakit olarak geri satın alması olarak tanımlar. Alıcının satıcıya malları belirli bir fiyata geri alacağına dair şart koşması haramdır. {cite:muwatta-maruf-1997 s.167}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi', dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: \"Barang siapa membeli makanan, janganlah ia menjualnya sebelum ia menerimanya.\" Ulama tersebut mendefinisikan 'Aynah sebagai transaksi di mana seseorang menjual barangnya secara kredit, kemudian membelinya kembali dalam transaksi yang sama secara tunai, untuk menghindari riba. Hal ini diharamkan jika pembeli menetapkan kepada penjual bahwa ia akan membelinya kembali dengan harga yang telah ditentukan. {cite:muwatta-maruf-1997 p.167}"
