label: { ar: "الموطأ 1863 — يحيى عن مالك عن نافع عن ابن عمر: من ابتاع طعاما فلا يبعه حتى يستوفيه", en: "Muwatta 1863" }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: من ابتاع طعاما فلا يبعه حتى يستوفيه. ويعرف المحقق العينة بأنها أن يبيع الرجل متاعه إلى أجل، ثم يشتريه في المجلس بثمن حال، ليسلم به من الربا، وأنها حرام إذا اشترط المشتري على البائع أن يشتريها منه بثمن معلوم. {cite:muwatta-maruf-1997 p.167}"
