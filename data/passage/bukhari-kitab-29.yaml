  en: "Sahih al-Bukhari, Book 29: Virtues of Madinah"
  ur: "صحیح بخاری، کتاب فضائل المدینۃ"
  es: "Sahih al-Bukhari, Libro 29: Virtudes de Medina"
  fr: "Sahih al-Bukhari, Livre 29: Les vertus de Médine"
summary:
  ar: "القسم 29 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضائل المدينة»، ويضم فيها النصوص من 1867 إلى 1890 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 29 of Sahih al-Bukhari (Virtues of Madinah) in the division of the open hadith dataset the museum took its reports from: reports 1867 to 1890 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 29، عنوان «کتاب فضائل المدینۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1867 تا 1890۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 29 de Sahih al-Bukhari (Virtudes de Medina) se encuentra dentro de la base de datos abierta de hadices de la que el museo extrajo sus informes: informes del 1867 al 1890, según la numeración de dicha base de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du Sahih al-Bukhari (Les Vertus de Médine), dans son recueil de hadiths ouverts, le livre 29 (numéros 1867 à 1890). Il conserve ces hadiths sous cette référence; les éditions imprimées classent et numérotent la collection différemment."
