label: { ar: "الموطأ 2830 — لقمان الحكيم: صدق الحديث وأداء الأمانة وترك ما لا يعنيه", en: "Muwatta 2830", es: "Muwatta 2830", fr: "Muwatta 2830", ur: "موطا 2830", tr: "Al-Muwatta 2830 — Bilge Lokman: Sözde doğruluk, emanetleri yerine getirmek ve kendisini ilgilendirmeyen şeylerden uzak durmak", id: "Al-Muwatta 2830 — Luqman yang Bijaksana: Kejujuran dalam berbicara, menunaikan amanah, dan menjauhi hal-hal yang tidak berkaitan dengannya" }
summary:
  ar: "بلغ مالكا أنه قيل للقمان الحكيم، وهم يريدون الفضل: ما بلغ بك ما نرى؟ فقال لقمان: صدق الحديث، وأداء الأمانة، وترك ما لا يعنيني. {cite:muwatta-maruf-1997 p.588}"
  tr: "Malik, Lokman'ın gözüne girmek için kendisine şu sorunun sorulduğunu rivayet etmiştir: \"Sizi şu anki konumunuza getiren nedir?\" Lokman şu cevabı vermiştir: \"Doğruyu söylemek, emanetleri yerine getirmek ve beni ilgilendirmeyen şeylerden uzak durmak.\" {cite:muwatta-maruf-1997 s.588}"
  id: "Malik meriwayatkan bahwa Luqman yang Bijaksana ditanya, ketika mereka berusaha mendapatkan dukungan: \"Apa yang telah membawamu ke posisi yang kita lihat sekarang?\" Luqman menjawab: \"Berbicara jujur, menepati amanah, dan menjauhi hal-hal yang tidak menyangkut diriku.\" {cite:muwatta-maruf-1997 p.588}"
