text: "ما رأيت رسول الله يصلي سبحة الضحى قط وإني لأستحبها"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عائشة، في باب صلاة الضحى: ما رأت النبي يصلي نافلة الضحى قط وإنها لتستحبها، وإن كان النبي ليدع العمل وهو يحب أن يعمله خشية أن يعمل به الناس فيُفرض عليهم. ويبين المحقق أن لفظ «لأستحبها» رواية يحيى وأن باقي الرواة قالوا «لأسبّحها» كما ذكر الزرقاني، ويخرّج الحديث عند البخاري (1128) ومسلم (2/156) وأبي داود (1293) والنسائي في الكبرى وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (8/134). {cite:muwatta-maruf-1997 p.218}"
