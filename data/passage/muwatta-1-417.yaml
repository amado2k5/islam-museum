label: { ar: "الموطأ 417 — عائشة: ما رأيته يصلي سبحة الضحى وإني لأستحبها", en: "Muwatta 417", es: "Muwatta 417", fr: "Muwatta 417", ur: "موطا 417", tr: "Al-Muwatta 417 — Aişe: Onu Duha namazını kılarken hiç görmedim, ama ben onu tercih ederim.", id: "Al-Muwatta 417 — Aisyah: Aku tidak pernah melihatnya mengerjakan salat Dhuha, tetapi aku lebih menyukainya." }
text: "ما رأيت رسول الله يصلي سبحة الضحى قط وإني لأستحبها"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عائشة، في باب صلاة الضحى: ما رأت النبي يصلي نافلة الضحى قط وإنها لتستحبها، وإن كان النبي ليدع العمل وهو يحب أن يعمله خشية أن يعمل به الناس فيُفرض عليهم. ويبين المحقق أن لفظ «لأستحبها» رواية يحيى وأن باقي الرواة قالوا «لأسبّحها» كما ذكر الزرقاني، ويخرّج الحديث عند البخاري (1128) ومسلم (2/156) وأبي داود (1293) والنسائي في الكبرى وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (8/134). {cite:muwatta-maruf-1997 p.218}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Aisyah, dalam surah tentang shalat Duha: Ia tidak pernah melihat Nabi (shalawat dan salam kepadanya) mengerjakan shalat Duha sunnah, dan ia menganggapnya sebagai amalan yang baik. Nabi (shalawat dan salam kepadanya) terkadang menahan diri dari suatu perbuatan yang sangat ia sukai, karena khawatir orang-orang akan mengikuti contohnya dan perbuatan itu akan menjadi wajib bagi mereka. Peneliti menjelaskan bahwa kalimat \"Aku menganggapnya sebagai amalan yang baik\" adalah riwayat Yahya, sedangkan perawi lain mengatakan \"Aku menganggapnya sebagai kewajiban,\" seperti yang disebutkan oleh al-Zarqani. Kemudian ia mencantumkan hadits dalam al-Bukhari (1128), Muslim (2/156), Abu Dawud (1293), al-Nasa'i dalam al-Kubra, dan Ahmad, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (8/134). {mengutip:muwatta-maruf-1997 hal.218}"
