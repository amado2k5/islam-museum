label: { ar: "سنن النسائي 4731 — الأب والأبوة", en: "Sunan al-Nasa'i 4731 — the father and fatherhood", ur: "سنن نسائی 4731 — باپ اور والدیت", es: "Sunan al-Nasa'i 4731 — El padre y la paternidad" }
text: "… خَالِدُ بْنُ خِدَاشٍ، قَالَ حَدَّثَنَا حَاتِمُ بْنُ إِسْمَاعِيلَ، عَنْ بَشِيرِ بْنِ الْمُهَاجِرِ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، أَنَّ رَجُلاً، جَاءَ إِلَى النَّبِيِّ فَقَالَ إِنَّ هَذَا الرَّجُلَ قَتَلَ أَخِي. قَالَ \" اذْهَبْ فَاقْتُلْهُ كَمَا قَتَلَ أَخَاكَ \". فَقَالَ لَهُ الرَّجُلُ اتَّقِ اللَّهَ وَاعْفُ عَنِّي فَإِنَّهُ أَعْظَمُ لأَجْرِكَ وَخَيْرٌ لَكَ وَلأَخِيكَ يَوْمَ الْقِيَامَةِ. قَالَ فَخَلَّى …"
summary:
  ar: "حديث في سنن النسائي، رقم 4731، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4731 (The Book of Oaths (qasamah), Retaliation and Blood Money), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4731، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4731 (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Sangre), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
