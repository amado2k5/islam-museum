label: { ar: "الموطأ 195 — ابن أم مكتوم أعمى لا ينادي حتى يقال له أصبحت", en: "Muwatta 195" }
text: "وكان ابن أم مكتوم رجلاً أعمى لا ينادي حتى يقال له: أصبحت أصبحت"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سالم بن عبد الله مرسلاً، في باب قدر السحور من النداء: أخبر النبي أن بلالاً ينادي بليل فأباح الأكل والشرب حتى ينادي ابن أم مكتوم، وكان ابن أم مكتوم رجلاً أعمى لا يؤذن حتى يقال له: أصبحت أصبحت. ويبين المحقق أن أبا مصعب وسويداً وابن وهب والشافعي ومحمد بن الحسن رووه عن مالك مرسلاً، وأن القعنبي وابن مهدي وعبد الرزاق وغيرهم وصلوه عن سالم عن أبيه (البخاري 617، ابن حبان 3469)، وينقل عن ابن عبد البر أسماء من وصله ومن أرسله من أصحاب مالك، وأن أصحاب ابن شهاب رووه متصلاً مسنداً (التمهيد 10/55–56). {cite:muwatta-maruf-1997 p.122} {cite:muwatta-maruf-1997 p.123}"
