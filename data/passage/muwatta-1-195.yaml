label: { ar: "الموطأ 195 — ابن أم مكتوم أعمى لا ينادي حتى يقال له أصبحت", en: "Muwatta 195", es: "Muwatta 195", fr: "Muwatta 195", ur: "موطا 195", tr: "El-Muvatta 195 — İbn Ümmü Maktum kördür ve kendisine “Sabah oldu” denmedikçe seslenmez.", id: "Al-Muwatta 195 — Ibn Umm Maktum buta dan tidak berseru sampai diberi tahu, “Ini sudah pagi.”" }
text: "وكان ابن أم مكتوم رجلاً أعمى لا ينادي حتى يقال له: أصبحت أصبحت"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سالم بن عبد الله مرسلاً، في باب قدر السحور من النداء: أخبر النبي أن بلالاً ينادي بليل فأباح الأكل والشرب حتى ينادي ابن أم مكتوم، وكان ابن أم مكتوم رجلاً أعمى لا يؤذن حتى يقال له: أصبحت أصبحت. ويبين المحقق أن أبا مصعب وسويداً وابن وهب والشافعي ومحمد بن الحسن رووه عن مالك مرسلاً، وأن القعنبي وابن مهدي وعبد الرزاق وغيرهم وصلوه عن سالم عن أبيه ⁦(البخاري 617، ابن حبان 3469)⁩، وينقل عن ابن عبد البر أسماء من وصله ومن أرسله من أصحاب مالك، وأن أصحاب ابن شهاب رووه متصلاً مسنداً ⁦(التمهيد 10/55–56)⁩. {cite:muwatta-maruf-1997 p.122} {cite:muwatta-maruf-1997 p.123}"
  tr: "Malik, namaz çağrısı bölümündeki sahur miktarı hakkındaki kısımda, İbn Şihab'dan, o da Salim ibn Abdullah'tan mursal hadis olarak rivayet etmiştir: Peygamberimiz bize, Bilal'in gece ezan okuyacağını ve İbn Ümmü Maktum ezan okuyana kadar yeme içmeye izin verdiğini bildirmiştir. İbn Ümmü Maktum kör bir adamdı ve kendisine \"Sabah oldu, sabah oldu\" denmedikçe ezan okumazdı. Araştırmacı, Ebu Musab, Süveyd, İbn Vahb, Şafiî ve Muhammed ibn Hasan'ın bunu Malik'ten mursal hadis olarak rivayet ettiğini ve Kanabi, İbn Mehdi, Abdülrazzak ve diğerlerinin ise Salim'den, o da babasından rivayet ederek bunu bağladığını açıklığa kavuşturmaktadır (Buhari 617, İbn Hibban 3469). İbn Abdülberr'in, hadisi Malik'in sahabelerinden mursal hadis olarak rivayet edenlerin ve hadisi birbirine bağlayanların isimlerini aktardığını ve İbn Şihab'ın sahabelerinin de hadisi bir isnad zinciriyle birbirine bağlı bir hadis olarak rivayet ettiğini belirtiyor (el-Tamhid 10/55-56). {cite:muwatta-maruf-1997 s.122} {cite:muwatta-maruf-1997 s.123}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang juga dari Salim bin Abdullah, sebagai hadits mursal, dalam surah tentang jumlah sahur (makan sebelum subuh) pada bagian tentang azan: Nabi memberitahukan kepada kita bahwa Bilal mengumandangkan azan di malam hari, dan beliau memperbolehkan makan dan minum hingga Ibnu Umm Maktum mengumandangkan azan. Ibnu Umm Maktum adalah seorang tunanetra yang tidak akan mengumandangkan azan sampai diberitahu, \"Sudah subuh, sudah subuh.\" Peneliti menjelaskan bahwa Abu Mus'ab, Suwaid, Ibnu Wahb, al-Shafi'i, dan Muhammad bin al-Hasan meriwayatkan hadits ini dari Malik sebagai hadits mursal, dan bahwa al-Qa'nabi, Ibnu Mahdi, Abd al-Razzaq, dan lainnya menghubungkannya dari Salim, yang juga dari ayahnya (al-Bukhari 617, Ibnu Hibban 3469). Ia mengutip nama-nama yang disebutkan Ibnu Abd al-Barr tentang orang-orang yang menghubungkan hadits tersebut dan orang-orang yang meriwayatkannya sebagai hadits mursal dari para sahabat Malik, dan bahwa para sahabat Ibnu Shihab meriwayatkannya sebagai hadits terhubung dengan sanad (al-Tamhid 10/55–56). {cite:muwatta-maruf-1997 p.122} {cite:muwatta-maruf-1997 p.123}"
