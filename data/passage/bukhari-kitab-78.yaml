summary:
  ar: "القسم 78 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأدب»، ويضم فيها النصوص من 5970 إلى 6226 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 78 of Sahih al-Bukhari (Good Manners and Form (Al-Adab)) in the division of the open hadith dataset the museum took its reports from: reports 5970 to 6226 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 78، عنوان «کتاب الادب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5970 تا 6226۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 78 de Sahih al-Bukhari (Buenas costumbres y etiqueta (Al-Adab)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5970 al 6226, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 78, « Bonnes mœurs et forme » [Al-Adab]), dans la partie ouverte du recueil: les hadiths 5970 à 6226. Le musée conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 78. bölümü \"Adab-ı Kerim\" başlığını taşımakta olup, 5970 ile 6226 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 78 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Adab\" dan berisi teks 5970 hingga 6226, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
