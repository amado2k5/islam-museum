text: "… في وسط النهار في الصيف. التحرّز من أوجاع المفاصل : يجب أن بستعمل من يعتاد هذه الأوجاع الفصد، والإسهال عند الربيع، وعند قرب النوبة، واستعمال التدبير المعتدل في اللطافة. وبالجملة يجب - إن كان السبب فيما يعرض له كثرة الأخلاط …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 835، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 835, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 835 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
