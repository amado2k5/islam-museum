label: { ar: "نوادر جحا الكبرى، ص 128 — «سأقوم بما تأمر به حرفياً»", en: "Nawadir Juha al-Kubra, p. 128 — 'I Will Do Exactly as You Command'", ur: "نوادر جحا الکبریٰ، ص 128 — «میں حرف بہ حرف حکم بجا لاؤں گا»", fr: "Nawadir Juha al-Kubra, p. 128 — « Je ferai à la lettre ce que tu ordonnes »", es: "Nawadir Juha al-Kubra, p. 128 — «Haré al pie de la letra lo que ordenas»", tr: "Juha'nın Büyük Fıkraları, s. 128 — “Tam olarak emrettiğin gibi yapacağım.”", id: "Anekdot Hebat Juha, hlm. 128 — “Aku akan melakukan persis seperti yang kau perintahkan.”" }
text: "… سأقوم بما تأمر به حرفيا كان الشيخ وهو طفل، يعمل عكس ما يقوله والده، فعلم والده طبعه، فصار إذا أراد أن يطلب منه شيئاً يعكس الموضوع، ليعمل الصحيح. ففي ذات يوم. كانا عائدين من الطاحون. وكان الحمارُ لا يقدر على …"
summary:
  ar: "كان جحا في طفولته يفعل عكس ما يقوله أبوه، وفي طريق العودة من الطاحونة أمره أبوه أن يعبر بالحمار المخاضة، فسقط كيس الدقيق في النهر، فقال جحا إنه سيفعل هذه المرة بالضبط ما قيل له. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  en: "As a child, Juha does the opposite of what his father says. On the way back from the mill, the father tells him to take the donkey across the ford, and the flour sack falls into the river. Juha says he will do exactly as told this time. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  ur: "بچپن میں جحا اپنے باپ کی بات کے الٹ کرتا ہے۔ چکی سے لوٹتے ہوئے باپ اسے گدھے کو پایاب سے پار لے جانے کو کہتا ہے اور آٹے کی بوری دریا میں گر جاتی ہے۔ جحا کہتا ہے کہ اس بار وہ ٹھیک وہی کرے گا جو اس سے کہا گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  fr: "Enfant, Juha fait le contraire de ce que dit son père. Sur le chemin du retour du moulin, le père lui dit de faire traverser le gué à l'âne, et le sac de farine tombe dans la rivière. Juha dit qu'il fera cette fois exactement ce qu'on lui dit. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  es: "De niño, Juha hace lo contrario de lo que dice su padre. En el camino de vuelta del molino, el padre le dice que cruce el vado con el burro, y el saco de harina cae al río. Juha dice que esta vez hará exactamente lo que se le dice. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  tr: "Juha çocukken babasının söylediklerinin tam tersini yapardı. Değirmenden dönerken babası ona eşeğiyle nehri geçmesini emretti ve un çuvalı nehre düştü. Juha bu sefer tam olarak söyleneni yapacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 128}"
  id: "Saat masih kecil, Juha selalu melakukan kebalikan dari apa yang diperintahkan ayahnya. Dalam perjalanan pulang dari penggilingan, ayahnya menyuruhnya menyeberangi sungai dengan keledai, dan karung tepung jatuh ke sungai. Juha berkata bahwa kali ini dia akan melakukan persis seperti yang diperintahkan. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
