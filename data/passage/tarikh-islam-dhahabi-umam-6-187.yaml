text: "… ذي الحجّة. وعلى المسلمين الحَكَم بن أبي العاص، فقُتِلَ شَهْرَك مُقَدَّم المشركين. قال خليفة : وفيها أسرت الرومُ عبد الله بن حُذَافة السَّهْميّ. وقيل : فيها فُتِحَت تكريت. ويقال : فيها كانت جلولاء وهي وقعة أخرى كانت بالعجم أو بفارس …"
