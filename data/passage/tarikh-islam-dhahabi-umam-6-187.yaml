text: "… ذي الحجّة. وعلى المسلمين الحَكَم بن أبي العاص، فقُتِلَ شَهْرَك مُقَدَّم المشركين. قال خليفة : وفيها أسرت الرومُ عبد الله بن حُذَافة السَّهْميّ. وقيل : فيها فُتِحَت تكريت. ويقال : فيها كانت جلولاء وهي وقعة أخرى كانت بالعجم أو بفارس …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 187، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
