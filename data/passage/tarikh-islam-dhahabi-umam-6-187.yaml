  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 6. cildinin 187. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Müslüman olmayan milletler, dinler, mezhepler ve halklar için tarayıcı tarafından derlenmiştir."
