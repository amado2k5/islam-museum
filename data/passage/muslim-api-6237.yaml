text: "… بْنُ عَبَّادٍ، حَدَّثَنَا حَاتِمٌ، - يَعْنِي ابْنَ إِسْمَاعِيلَ - عَنْ بُكَيْرِ بْنِ مِسْمَارٍ، عَنْ عَامِرِ بْنِ سَعْدٍ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ جَمَعَ لَهُ أَبَوَيْهِ يَوْمَ أُحُدٍ. قَالَ كَانَ رَجُلٌ مِنَ الْمُشْرِكِينَ قَدْ أَحْرَقَ الْمُسْلِمِينَ فَقَالَ لَهُ النَّبِيُّ \" ارْمِ فِدَاكَ أَبِي وَأُمِّي \". قَالَ فَنَزَعْتُ لَهُ بِسَهْمٍ لَيْسَ فِيهِ نَصْلٌ فَأَصَبْتُ جَنْبَهُ فَسَقَطَ فَانْكَشَفَتْ عَوْرَتُهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6237، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6237 (The Book of the Merits of the Companions), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6237، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 6237 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad, así como el cumplimiento o la desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6237 (Le Livre des mérites des Compagnons), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sahih Müslim'de 6237 numaralı hadis, baba ve babalık kavramından, anne babaya saygı göstermekten veya göstermemekten bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6237, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
