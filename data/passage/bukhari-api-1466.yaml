label: { ar: "صحيح البخاري 1466 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 1466 — the orphan and the father lost", ur: "صحیح بخاری 1466 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 1466 — El huérfano y el padre perdido", fr: "Sahih al-Bukhari 1466 — L'orphelin et le père perdus" }
text: "… مِنَ الأَنْصَارِ عَلَى الْبَابِ، حَاجَتُهَا مِثْلُ حَاجَتِي، فَمَرَّ عَلَيْنَا بِلاَلٌ فَقُلْنَا سَلِ النَّبِيَّ أَيَجْزِي عَنِّي أَنْ أُنْفِقَ عَلَى زَوْجِي وَأَيْتَامٍ لِي فِي حَجْرِي وَقُلْنَا لاَ تُخْبِرْ بِنَا. فَدَخَلَ فَسَأَلَهُ فَقَالَ \" مَنْ هُمَا \". قَالَ زَيْنَبُ قَالَ \" أَىُّ الزَّيَانِبِ \". قَالَ امْرَأَةُ عَبْدِ اللَّهِ. قَالَ \" نَعَمْ لَهَا أَجْرَانِ أَجْرُ الْقَرَابَةِ وَأَجْرُ الصَّدَقَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1466، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1466 (Obligatory Charity Tax (Zakat)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1466، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1466 (Impuesto obligatorio sobre la caridad (Zakat)), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre la paternidad."
  fr: "Un hadith du Sahih al-Bukhari, n° 1466 (L'aumône obligatoire (Zakat)), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
