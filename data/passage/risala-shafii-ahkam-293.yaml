text: "… حالِهَا : لا تَحِلُّ إلاّ بطُمور، ولا تجوز الآبقراءةٍ، وما تجوزُ به المكتوباتُ من السجود والركوع واستقبال القبلة فى الحَضَر وفى الأرض وفى السفر، وأنّ للراكب أن يُصلى فى النافلةِ حيثُ توجهتْ به دابتُه. - أخبرنا ابنُ أبي فُدَيْكٍ عن …"
