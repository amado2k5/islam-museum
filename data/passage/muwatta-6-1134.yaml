label: { ar: "الموطأ 1134 — نافع عن سليمان بن يسار: هبار بن الأسود جاء يوم النحر وعمر ينحر هديه، فقال: يا أمير المؤمنين، أخطأنا العدة، كنا نرى أن هذا اليوم يوم عرفة؛ فقال عمر: اذهب إلى مكة فطف أنت ومن معك، وانحروا هدياً إن كان معكم، ثم احلقوا أو قصروا وارجعوا، فإذا كان عام قابل فحجوا وأهدوا، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع", en: "Muwatta 1134" }
summary:
  ar: "يرويه مالك عن نافع عن سليمان بن يسار، أن هبار بن الأسود جاء يوم النحر وعمر بن الخطاب ينحر هديه، فقال: يا أمير المؤمنين، أخطأنا العدة، كنا نرى أن هذا اليوم يوم عرفة. فقال عمر: اذهب إلى مكة فطف أنت ومن معك، وانحروا هدياً إن كان معكم، ثم احلقوا أو قصروا وارجعوا، فإذا كان عام قابل فحجوا وأهدوا، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1430) وسويد (532) والشيباني (431). {cite:muwatta-maruf-1997 p.516}"
