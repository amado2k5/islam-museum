label: { ar: "الموطأ 1134 — نافع عن سليمان بن يسار: هبار بن الأسود جاء يوم النحر وعمر ينحر هديه، فقال: يا أمير المؤمنين، أخطأنا العدة، كنا نرى أن هذا اليوم يوم عرفة؛ فقال عمر: اذهب إلى مكة فطف أنت ومن معك، وانحروا هدياً إن كان معكم، ثم احلقوا أو قصروا وارجعوا، فإذا كان عام قابل فحجوا وأهدوا، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع", en: "Muwatta 1134", es: "Muwatta 1134", fr: "Muwatta 1134", ur: "موطا 1134", tr: "El-Muvatta 1134 — Nafi'nin Süleyman ibn Yasar'dan rivayet ettiğine göre: Hibber ibn el-Aswad, Kurban Bayramı günü Ömer kurbanını keserken geldi. \"Ey Müminlerin Emiri, sayımda hata yaptık. Bugünün Arafat Günü olduğunu sandık\" dedi. Ömer, \"Mekke'ye gidin, siz ve yanınızdakiler tavaf yapın ve eğer varsa bir kurban kesin. Sonra başlarınızı tıraş edin veya saçlarınızı kısaltın ve geri dönün. Gelecek yıl Hac yapın ve bir kurban kesin. Kim kurban bulamazsa, Hac sırasında üç gün ve döndükten sonra yedi gün oruç tutsun\" dedi.", id: "Al-Muwatta 1134 — Diriwayatkan oleh Nafi’ dari Sulayman ibn Yasar: Hibbar ibn al-Aswad datang pada Hari Raya Kurban ketika Umar sedang menyembelih hewan kurbannya. Dia berkata, “Wahai Amirul Mukminin, kami telah melakukan kesalahan dalam perhitungan. Kami mengira hari ini adalah Hari Arafah.” Umar berkata, “Pergilah ke Mekah dan lakukan Tawaf, engkau dan orang-orang yang bersamamu, dan sembelihlah hewan kurban jika kalian memilikinya. Kemudian cukurlah kepala kalian atau potong rambut kalian dan kembalilah. Tahun depan, lakukan Haji dan persembahkan hewan kurban. Barangsiapa yang tidak dapat menemukan hewan kurban, hendaklah berpuasa tiga hari selama Haji dan tujuh hari setelah kembali.”" }
summary:
  ar: "يرويه مالك عن نافع عن سليمان بن يسار، أن هبار بن الأسود جاء يوم النحر وعمر بن الخطاب ينحر هديه، فقال: يا أمير المؤمنين، أخطأنا العدة، كنا نرى أن هذا اليوم يوم عرفة. فقال عمر: اذهب إلى مكة فطف أنت ومن معك، وانحروا هدياً إن كان معكم، ثم احلقوا أو قصروا وارجعوا، فإذا كان عام قابل فحجوا وأهدوا، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1430) وسويد (532) والشيباني (431). {cite:muwatta-maruf-1997 p.516}"
  tr: "Malik, Süleyman ibn Yasar'dan rivayet ettiğine göre, Hibber ibn el-Esved, Kurban Bayramı günü Ömer ibn el-Hattab kurbanını keserken geldi. \"Ey Müminlerin Emiri, sayımda hata yaptık; bu günü Arafat Günü sandık\" dedi. Ömer, \"Mekke'ye git ve yanındakilerle tavaf yap, eğer varsa kurban kes. Sonra başlarını tıraş et veya saçlarını kısalt ve geri dön. Gelecek yıl gelirsen Hac yap ve kurban kes. Kurban kesmeye gücü yetmeyenler Hac sırasında üç gün, döndükten sonra da yedi gün oruç tutsunlar\" dedi. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab (1430), Suveyd (532) ve Şeybani (431) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.516}"
  id: "Malik meriwayatkannya dari Nafi’ yang juga diriwayatkan oleh Sulayman bin Yasar, bahwa Hibbar bin al-Aswad datang pada Hari Raya Kurban ketika Umar bin al-Khattab sedang menyembelih hewan kurbannya. Ia berkata, “Wahai Amirul Mukminin, kami keliru dalam perhitungan; kami mengira hari ini adalah Hari Arafah.” Umar berkata, “Pergilah ke Mekah dan lakukan Tawaf bersama orang-orang yang bersamamu, dan sembelihlah hewan kurban jika kamu memilikinya. Kemudian cukurlah kepalamu atau potong rambutmu dan kembalilah. Jika kamu datang tahun depan, lakukanlah Haji dan persembahkanlah hewan kurban. Barangsiapa yang tidak mampu membeli hewan kurban, hendaklah berpuasa tiga hari selama Haji dan tujuh hari setelah kembali.” Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus’ab (1430), Suwayd (532), dan al-Shaybani (431). {cite:muwatta-maruf-1997 p.516}"
