text: "قتسام الملك والسيادة في جزيرة العرب، فكتب إليه الرسول: (من محمد رسول الله إلى مسيلمة الكذاب، سلام على من اتبع الهدى، أما بعد فإن الأرض يورثها من يشاء من عباده والعاقبة للمتقين) . ثم لم يلبث الرسول أن توفي ."
