label: { ar: "الموطأ 1393 — عبد الله بن أبي بكر عن عبد الله بن واقد: نهى النبي عن أكل لحوم الضحايا بعد ثلاث، ثم قال إنما نهيتكم من أجل الدافة", en: "Muwatta 1393", es: "Muwatta 1393", fr: "Muwatta 1393", ur: "موطا 1393", tr: "El-Muvatta 1393 — Abdullah bin Ebu Bekir, Abdullah bin Vakid'den rivayetle: Peygamberimiz, kurban edilen hayvanların etini üç günden sonra yemeyi yasakladı, sonra da \"Bunu sadece kalabalıklar yüzünden yasakladım\" dedi.", id: "Al-Muwatta 1393 — Abdullah bin Abi Bakr berdasarkan riwayat Abdullah bin Waqid: Nabi melarang memakan daging hewan kurban setelah tiga hari, kemudian beliau bersabda, “Aku melarang kalian hanya karena banyaknya orang yang berdesakan.”" }
text: "ادَّخِرُوا لِثَلاثِ، وَتصدَّقُوا بِمَا بَقي"
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن عبد الله بن واقد أنه قال نهى رسول الله عن أكل لحوم الضحايا بعد ثلاث. وذكر عبد الله بن أبي بكر ذلك لعمرة بنت عبد الرحمن، فقالت صدق، سمعت عائشة تقول دف ناس من أهل البادية حضرة الأضحى في زمان رسول الله، فقال ادخروا لثلاث وتصدقوا بما بقي، فلما كان بعد ذلك قيل له لقد كان الناس ينتفعون بضحاياهم، فقال وما ذلك؟ قالوا نهيت عن لحوم الضحايا بعد ثلاث، فقال إنما نهيتكم من أجل الدافة التي دفت عليكم، فكلوا وتصدقوا وادخروا. {cite:muwatta-maruf-1997 p.623}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr, dari Abdullah ibn Waqid, bahwa ia berkata: Rasulullah shalla Allahu alaihi wa sallam melarang memakan daging hewan kurban setelah tiga hari. Abdullah ibn Abi Bakr menyampaikan hal ini kepada Amrah binti Abd al-Rahman, dan ia berkata: Beliau berkata benar. Aku mendengar Aisyah berkata: Beberapa orang dari padang pasir datang kepada Nabi shalla Allahu alaihi wa sallam pada waktu Idul Adha, dan beliau berkata: Simpan sebagian untuk tiga hari dan berikan sisanya sebagai sedekah. Kemudian, dikatakan kepadanya: Orang-orang mendapat manfaat dari kurban mereka. Beliau bertanya: Apa alasannya? Mereka berkata: Engkau melarang memakan daging hewan kurban setelah tiga hari. Beliau menjawab: Aku hanya melarang kalian karena orang-orang yang datang kepada kalian. Maka makanlah, berikan sedekah, dan simpanlah sebagian. {cite:muwatta-maruf-1997 p.623}"
