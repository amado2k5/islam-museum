label: { ar: "الموطأ 1393 — عبد الله بن أبي بكر عن عبد الله بن واقد: نهى النبي عن أكل لحوم الضحايا بعد ثلاث، ثم قال إنما نهيتكم من أجل الدافة", en: "Muwatta 1393" }
text: "ادَّخِرُوا لِثَلاثِ، وَتصدَّقُوا بِمَا بَقي"
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن عبد الله بن واقد أنه قال نهى رسول الله عن أكل لحوم الضحايا بعد ثلاث. وذكر عبد الله بن أبي بكر ذلك لعمرة بنت عبد الرحمن، فقالت صدق، سمعت عائشة تقول دف ناس من أهل البادية حضرة الأضحى في زمان رسول الله، فقال ادخروا لثلاث وتصدقوا بما بقي، فلما كان بعد ذلك قيل له لقد كان الناس ينتفعون بضحاياهم، فقال وما ذلك؟ قالوا نهيت عن لحوم الضحايا بعد ثلاث، فقال إنما نهيتكم من أجل الدافة التي دفت عليكم، فكلوا وتصدقوا وادخروا. {cite:muwatta-maruf-1997 p.623}"
