text: "بينا أنا عند البيت بين النائم واليقظان فأتيت بطست من ذهب ملئ حكمة وإيماناً، فشق من النحر إلى مراق البطن ثم غسل البطن بماء زمزم ثم ملئ حكمة وإيماناً، وأتيت بدابة أبيض دون البغل وفوق الحمار: البراق"
summary:
  ar: "في كتاب الصلاة؛ حديث مالك بن صعصعة الطويل في الإسراء والمعراج وفيه شق الصدر الثاني عند البيت وغسل القلب بماء زمزم قبل العروج، ثم ركوب البراق والمرور على الأنبياء في السماوات وفرض الصلاة. من أطول أحاديث الصحيح وأشهرها في وصف الرحلة."
