text: "بينا أنا عند البيت بين النائم واليقظان فأتيت بطست من ذهب ملئ حكمة وإيماناً، فشق من النحر إلى مراق البطن ثم غسل البطن بماء زمزم ثم ملئ حكمة وإيماناً، وأتيت بدابة أبيض دون البغل وفوق الحمار: البراق"
summary:
  ar: "في كتاب الصلاة؛ حديث مالك بن صعصعة الطويل في الإسراء والمعراج وفيه شق الصدر الثاني عند البيت وغسل القلب بماء زمزم قبل العروج، ثم ركوب البراق والمرور على الأنبياء في السماوات وفرض الصلاة. من أطول أحاديث الصحيح وأشهرها في وصف الرحلة."
  tr: "Namaz Kitabı'nda, İsra ve Miraç (Gece Yolculuğu ve Yükseliş) ile ilgili olarak Malik ibn Sa'sa'ya ait uzun bir hadis bulunmaktadır. Bu hadis, Kâbe'de ikinci sandığın yarılmasını, yükselişten önce kalbin Zemzem suyuyla yıkanmasını, Burak'a binilmesini, peygamberlerin göklerde geçişini ve namazın farz kılınmasını anlatmaktadır. Bu, Sahih el-Buhari'de İsra ve Miraç'ı anlatan en uzun ve en meşhur hadislerden biridir."
  id: "Dalam Kitab Doa, terdapat hadits panjang dari Malik bin Sa'sa'ah mengenai Isra' dan Mi'raj (Perjalanan Malam dan Kenaikan), yang menggambarkan terbelahnya dada kedua di Ka'bah, pencucian hati dengan air Zamzam sebelum kenaikan, naiknya Buraq, lewatnya para nabi di langit, dan perintah untuk melaksanakan salat. Hadits ini merupakan salah satu hadits terpanjang dan paling terkenal dalam Sahih al-Bukhari yang menggambarkan perjalanan tersebut."
