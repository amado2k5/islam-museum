text: "كي ، أي : لكي يسأل الصادقين من النبيين عن صدقهم في تبليغ الرسالة إلى قومهم ، وفي هذا وعيد لغيرهم ، لأنهم إذا كانوا يسألون عن ذلك فكيف غيرهم . وقيل : ليسأل الأنبياء عما أجابهم به قومهم ،"
