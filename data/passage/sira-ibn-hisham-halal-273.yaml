text: "… مِنْهُ ءَايَتٌ مُحْكَمَتُ هُنَّ مّ الْكِنَبِ آل عمران: فيهن: حُجَّةُ الرب، وعِصْمَةُ العباد، ودَفْعُ الخُصوم والباطلِ، ليس لهن تصريفّ ولا تحريف عما وُضِعْنَ عليه، وَأُخَرُ مُتَشَيِهَتُ لهن تصريف وتأويلٌ، ابْتَلَى اللّٰه فيهن العباد، كما ابتلاهم في الحلال والحرام، أَلا يُصْرَفْنَ …"
