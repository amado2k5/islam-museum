text: "فقال: بلغني أنك تزعم أن الحسن والحسين من ذرية النبي، تجده في كتاب الله، وقد قرأته من أوله إلى آخره فلم أجده، فنكر يحيى بن يعمر نحو ما تقدم. وأخرج عبد بن حميد، وابن المنذر وابن أبي حاتم، وأبو الشيخ،"
