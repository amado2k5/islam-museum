label: { ar: "الموطأ 1801 — يحيى عن مالك عن ابن شهاب: أن عبيد الله بن عبد الله بن عتبة أخبره أن عبد الله بن مسعود ابتاع جارية من امرأته زينب الثقفية، واشترطت عليه أنك إن بعتها فهي لي بالثمن، فسأل عمر بن الخطاب فقال: لا تقربها وفيها شرط لأحد", en: "Muwatta 1801" }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أن عبيد الله بن عبد الله بن عتبة بن مسعود أخبره أن عبد الله بن مسعود ابتاع جارية من امرأته زينب الثقفية، فاشترطت عليه أنه إن باعها فهي لها بالثمن الذي يبيعها به. فسأل عبد الله بن مسعود عمر بن الخطاب عن ذلك، فقال له عمر: لا تقربها، وفيها شرط لأحد. {cite:muwatta-maruf-1997 p.138}"
