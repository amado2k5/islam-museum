label: { ar: "الموطأ 1801 — يحيى عن مالك عن ابن شهاب: أن عبيد الله بن عبد الله بن عتبة أخبره أن عبد الله بن مسعود ابتاع جارية من امرأته زينب الثقفية، واشترطت عليه أنك إن بعتها فهي لي بالثمن، فسأل عمر بن الخطاب فقال: لا تقربها وفيها شرط لأحد", en: "Muwatta 1801", es: "Muwatta 1801", fr: "Muwatta 1801", ur: "موطا 1801", tr: "El-Muvatta 1801 — Yahya, Malik'ten, o da İbn Şihab'dan rivayet ettiğine göre: Ubeydullah ibn Abdullah ibn Utbe ona, Abdullah ibn Mesud'un karısı Zeynep el-Sakifiyye'den bir cariye satın aldığını ve cariyenin, eğer satılırsa, bedelinin kendisine ait olacağını şart koştuğunu bildirmiştir. Bunun üzerine Ömer ibn el-Hattab'a sormuş ve Ömer şöyle demiştir: Ona yaklaşma, çünkü o başkasıyla bir anlaşma yapmıştır.", id: "Al-Muwatta 1801 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab: bahwa Ubaydullah ibn Abdullah ibn Utbah memberitahunya bahwa Abdullah ibn Masoud membeli seorang budak perempuan dari istrinya, Zaynab al-Thaqafiyyah, dan dia menetapkan syarat bahwa jika dia menjualnya, budak itu akan menjadi miliknya dengan harga tersebut. Maka dia bertanya kepada Umar ibn al-Khattab, dan dia berkata: Jangan mendekatinya, karena dia telah menetapkan syarat untuk orang lain." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أن عبيد الله بن عبد الله بن عتبة بن مسعود أخبره أن عبد الله بن مسعود ابتاع جارية من امرأته زينب الثقفية، فاشترطت عليه أنه إن باعها فهي لها بالثمن الذي يبيعها به. فسأل عبد الله بن مسعود عمر بن الخطاب عن ذلك، فقال له عمر: لا تقربها، وفيها شرط لأحد. {cite:muwatta-maruf-1997 p.138}"
  tr: "Yahya, İbn Şihab'dan rivayetle Malik'ten naklederek, Ubeydullah ibn Abdullah ibn Utbah ibn Mes'ud'un kendisine Abdullah ibn Mes'ud'un karısı Zeynep el-Sakifiyye'den bir cariye satın aldığını ve cariyenin, eğer satarsa, ne kadar fiyata olursa olsun kendisine ait olacağını şart koştuğunu bildirdiğini aktarır. Abdullah ibn Mes'ud bunu Ömer ibn el-Hattab'a sordu ve Ömer ona şöyle dedi: \"Ona yaklaşma, çünkü o başkasıyla bir anlaşma yaptı.\" {cite:muwatta-maruf-1997 s.138}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, bahwa Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud memberitahunya bahwa Abdullah ibn Mas'ud membeli seorang budak perempuan dari istrinya, Zaynab al-Thaqafiyyah, dan wanita itu menetapkan syarat bahwa jika ia menjualnya, budak itu akan menjadi miliknya dengan harga berapa pun ia menjualnya. Abdullah ibn Mas'ud bertanya kepada Umar ibn al-Khattab tentang hal ini, dan Umar berkata kepadanya: \"Jangan mendekatinya, karena dia telah menetapkan syarat untuk orang lain.\" {cite:muwatta-maruf-1997 p.138}"
