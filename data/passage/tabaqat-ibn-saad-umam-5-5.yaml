text: "… : يأرسول اللّٰه عَلَمْنى مما علَّمكَ اللهُ وأَجْهَلُ، فقالِ ! إذا صَلَّيْتَ الصبْحَ فأَقْصِرْ عن الصلاة حى تَطْلُعَ الشمس فإذا طلمَتْ فلا تَصَلّ حتى ترتفعَ فإنها تطلع بين قَرْنَى شيطان وحينئذ يسجد لهما الكُفَّار، فإذا ارتفعَتْ قِيدَ رُمْحٍ أَوْ وُمْحَيْنِ …"
