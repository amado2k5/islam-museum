text: |-
  ويقال أيضارجل مصان اذا كان يرضع الغنم من لؤمه عن أبى عبيد والمصمصة مثل المضمصة
  الا أنه بطرف اللسان والمضهضة بالفم كله وفرق ما يينه-ماش.بيه بفرق ما بين القبصة والقبضة
  وفى الحديث كانتوضأ مما غيرت النار وغصمص من اللبن ولا عصص من التمرويقال مصمص
  انا ءه اذاغل والماصة داء ياخذ الصى والصوص بفتح الميم طعام والعامة تضهه والصاحر
  خاص كل شي يقال فلان مصاص قومه اذا كان أخلصه-م نسبايستوى فيه الواحد
  والاثنان والجمع والمؤنت والمصاص أيضانسات وذرس ورد مصامص اذا كان خالصافى ذلكْ
  ومصيصة بادبالشأم ولا تقل.صيصة بالتشديد ( عص أبو عر والمعص بالتحريك التوا.
  فى عصب الرجل كانه يقصر عص بها فيته وج قدمه ثم بسوّيه سده وقد معص فلان بالكسر
  يمعص معصاوفى الحديث شكى عمرو بن معدى كرب الى عمر رضى اللّٰه عنه المعض فقال
  كذب علميك العسل أى عليك بسرعة المشى وهومن عسلان الذئب ⁦( غص )⁩. ال ابن
  دريد ابل امغاص اذا كانت خيارا لا واحدلها من لفظها وقال ابنْ السكيت المغص خيار
  الابل قال الواحدة مغمة قال الراجز
  أنتم وهبتم مائة برجورا • أدما وجرا.غصاخيورا
  قال والمغص بالتسكين تقطبع فى المماء ووجع قال والعامة تقول مغص بالتحريك وقدمخص
  الرجل فه وممغوص ⁦(.لص)⁩ المص بالتحريك الراق وقد ملص الشى من يدى بالكسر
