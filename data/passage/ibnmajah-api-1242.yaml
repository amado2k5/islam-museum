label: { ar: "سنن ابن ماجه 1242 — الأب والأبوة", en: "Sunan Ibn Majah 1242 — the father and fatherhood", ur: "سنن ابن ماجہ 1242 — باپ اور والدیت", es: "Sunan Ibn Majah 1242 — El padre y la paternidad", fr: "Sunan Ibn Majah 1242 — Le père et la paternité", tr: "Sunan İbn Majah 1242 — Baba ve Babalık", id: "Sunan Ibn Majah 1242 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا حَاتِمُ بْنُ بَكْرٍ الضَّبِّيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ يَعْلَى، زُنْبُورٌ حَدَّثَنَا عَنْبَسَةُ بْنُ عَبْدِ الرَّحْمَنِ، عَنْ عَبْدِ اللَّهِ بْنِ نَافِعٍ، عَنْ أَبِيهِ، عَنْ أُمِّ سَلَمَةَ، قَالَتْ: نَهَى رَسُولُ اللَّهِ ـ عَنِ الْقُنُوتِ فِي الْفَجْرِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1242، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1242 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1242، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1242 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1242 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 1242 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1242, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
