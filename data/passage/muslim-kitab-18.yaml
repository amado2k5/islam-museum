  es: "Sahih Muslim, Libro 18: El Libro del Divorcio"
summary:
  ar: "القسم 18 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطلاق»، ويضم فيها النصوص من 3652 إلى 3742 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 18 of Sahih Muslim (The Book of Divorce) in the division of the open hadith dataset the museum took its reports from: reports 3652 to 3742 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 18، عنوان «کتاب الطلاق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3652 تا 3742۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 18 de Sahih Muslim (El Libro del Divorcio) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3652 al 3742, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
