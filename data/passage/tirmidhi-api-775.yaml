text: "حَدَّثَنَا بِشْرُ بْنُ هِلاَلٍ الْبَصْرِيُّ، حَدَّثَنَا عَبْدُ الْوَارِثِ بْنُ سَعِيدٍ، حَدَّثَنَا أَيُّوبُ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ احْتَجَمَ رَسُولُ اللَّهِ وَهُوَ مُحْرِمٌ صَائِمٌ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ. وَهَكَذَا رَوَى وُهَيْبٌ نَحْوَ رِوَايَةِ عَبْدِ الْوَارِثِ. وَرَوَى إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ عَنْ أَيُّوبَ عَنْ عِكْرِمَةَ مُرْسَلاً وَلَمْ يَذْكُرْ فِيهِ عَنِ ابْنِ عَبَّاسٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 775، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 775 (The Book on Fasting), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 775، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 775 (El Libro del Ayuno), menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 775 (Le Livre du jeûne), mentionne la ventousothérapie. Le Répertoire des ouvrages médicaux la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de 775 numaralı hadiste hacamat uygulamasından bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 775, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
