label: { ar: "الموطأ 2668 — سعيد بن المسيب: إبراهيم أول من ضيّف الضيف واختتن وقص شاربه ورأى الشيب", en: "Muwatta 2668" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه قال: كان إبراهيم أول الناس ضيّف الضيف، وأول الناس اختتن، وأول الناس قص شاربه، وأول الناس رأى الشيب فقال: يا رب ما هذا؟ فقال الله: وقار يا إبراهيم. فقال: رب زدني وقارا. ويذكر المحقق أن هذا الأثر في رواية مالك موقوف، وأن رفعه عند البخاري ومسلم من حديث الزهري عن سعيد بن المسيب عن أبي هريرة. {cite:muwatta-maruf-1997 p.506} {cite:muwatta-maruf-1997 p.507}"
