label: { ar: "الموطأ 2668 — سعيد بن المسيب: إبراهيم أول من ضيّف الضيف واختتن وقص شاربه ورأى الشيب", en: "Muwatta 2668", es: "Muwatta 2668", fr: "Muwatta 2668", ur: "موطا 2668", tr: "El-Muvatta 2668 — Sa’id ibn al-Musayyab: İbrahim, misafir ağırlayan, sünnet olan, bıyığını kesen ve saçlarında beyaz görmeyi başaran ilk kişiydi.", id: "Al-Muwatta 2668 — Sa’id ibn al-Musayyab: Ibrahim adalah orang pertama yang menjamu tamu, melakukan sunat sendiri, memangkas kumisnya, dan melihat uban." }
text: "كان إبراهيم أول الناس ضيف الضيف وأول الناس اختتن وأول الناس قص شاربه وأول الناس رأى الشيب فقال يا رب ما هذا فقال الله وقار يا إبراهيم فقال رب زدني وقارا …"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه قال: كان إبراهيم أول الناس ضيّف الضيف، وأول الناس اختتن، وأول الناس قص شاربه، وأول الناس رأى الشيب فقال: يا رب ما هذا؟ فقال الله: وقار يا إبراهيم. فقال: رب زدني وقارا. ويذكر المحقق أن هذا الأثر في رواية مالك موقوف، وأن رفعه عند البخاري ومسلم من حديث الزهري عن سعيد بن المسيب عن أبي هريرة. {cite:muwatta-maruf-1997 p.506} {cite:muwatta-maruf-1997 p.507}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet ettiğine göre şöyle buyurmuştur: \"İbrahim, misafir ağırlayan ilk kişi, sünnet olan ilk kişi, bıyığını kesen ilk kişi ve saçları beyazlayan ilk kişiydi. 'Ey Rabbim, bu nedir?' dedi. Allah, 'Ey İbrahim, şeref!' dedi. İbrahim, 'Ey Rabbim, şerefimi artır!' dedi.\" Araştırmacı, Malik'in rivayetinde bu hadisin mevkuf (bir Sahabeye isnat edilen) olduğunu, Buhari ve Müslim'deki merfu (Peygambere isnat edilen) versiyonunun ise el-Zuhri'nin, Sa'id ibn al-Musayyab'ın, o da Ebu Hurayra'dan rivayet ettiği hadisinden olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.506} {cite:muwatta-maruf-1997 s.507}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa ia berkata: \"Ibrahim adalah orang pertama yang menjamu tamu, orang pertama yang disunat, orang pertama yang memangkas kumisnya, dan orang pertama yang melihat uban. Dia berkata, 'Ya Tuhan, apakah ini?' Allah menjawab, 'Kemuliaan, wahai Ibrahim.' Dia berkata, 'Ya Tuhan, tambahkanlah kemuliaan kepadaku.'\" Peneliti menyebutkan bahwa riwayat ini dalam versi Malik adalah mawquf (dinikahkan dengan seorang Sahabat), sedangkan versi marfu' (dinikahkan dengan Nabi) dalam Bukhari dan Muslim berasal dari hadits al-Zuhri, dari Sa'id ibn al-Musayyab, dari Abu Hurayrah. {cite:muwatta-maruf-1997 p.506} {cite:muwatta-maruf-1997 p.507}"
