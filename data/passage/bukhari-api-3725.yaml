label: { ar: "صحيح البخاري 3725 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 3725 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 3725 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی" }
text: "حَدَّثَنِي مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا عَبْدُ الْوَهَّابِ، قَالَ سَمِعْتُ يَحْيَى، قَالَ سَمِعْتُ سَعِيدَ بْنَ الْمُسَيَّبِ، قَالَ سَمِعْتُ سَعْدًا، يَقُولُ جَمَعَ لِي النَّبِيُّ أَبَوَيْهِ يَوْمَ أُحُدٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3725، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3725 (Companions of the Prophet), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3725، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
