label: { ar: "سنن النسائي 2195 — ما ليس بواجب، الترغيب في العمل", en: "Sunan al-Nasa'i 2195 — what is said not to be obligatory; encouragement to an act", ur: "سنن نسائی 2195 — جو واجب نہیں، عمل کی ترغیب", fr: "Sunan al-Nasa'i 2195 — ce qui est dit non obligatoire ; l'encouragement à un acte", es: "Sunan al-Nasa'i 2195 — lo que se dice que no es obligatorio; el estímulo a un acto", tr: "Sunan an-Nasa'i 2195 — Zorunlu olmayanlar, çalışmaya teşvik", id: "Sunan an-Nasa'i 2195 — Apa yang tidak wajib, anjuran untuk bekerja" }
text: "… شُعَيْبٍ، عَنْ أَبِيهِ، عَنِ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، أَنَّ عَائِشَةَ، أَخْبَرَتْهُ أَنَّ رَسُولَ اللَّهِ خَرَجَ مِنْ جَوْفِ اللَّيْلِ فَصَلَّى فِي الْمَسْجِدِ وَسَاقَ الْحَدِيثَ وَقَالَ فِيهِ وَكَانَ رَسُولُ اللَّهِ يُرَغِّبُهُمْ فِي قِيَامِ رَمَضَانَ مِنْ غَيْرِ أَنْ يَأْمُرَهُمْ بِعَزِيمَةِ أَمْرٍ فِيهِ فَيَقُولُ \" مَنْ قَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2195، يرد فيه ذكر ما ليس بواجب، والترغيب في العمل. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 2195 (The Book of Fasting), whose wording mentions what is said not to be obligatory, encouragement to an act. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 2195، جس کے الفاظ میں جو واجب نہیں، عمل کی ترغیب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 2195, dont le texte mentionne ce qui est dit non obligatoire, l'encouragement à un acte. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 2195, cuyo texto menciona lo que se dice que no es obligatorio, el estímulo a un acto. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de yer alan 2195 numaralı hadis, farz olmayan şeylerden bahsetmekte ve iyi amelleri teşvik etmektedir. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2195, menyebutkan apa yang tidak wajib dan menganjurkan amal kebaikan. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
