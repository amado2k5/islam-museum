text: "… يَحْطُطْ عَنْ رَاحِلَتِهِ حَتَّى يَرْجِعَ. قَالَ مَالِكٌ الْعُمْرَةُ سُنَّةٌ وَلاَ نَعْلَمُ أَحَدًا مِنَ الْمُسْلِمِينَ أَرْخَصَ فِي تَرْكِهَا. قَالَ مَالِكٌ وَلاَ أَرَى لأَحَدٍ أَنْ يَعْتَمِرَ فِي السَّنَةِ مِرَارًا. قَالَ مَالِكٌ فِي الْمُعْتَمِرِ يَقَعُ بِأَهْلِهِ إِنَّ عَلَيْهِ فِي ذَلِكَ الْهَدْىَ وَعُمْرَةً أُخْرَى يَبْتَدِئُ بِهَا بَعْدَ إِتْمَامِهِ الَّتِي أَفْسَدَ وَيُحْرِمُ مِنْ حَيْثُ أَحْرَمَ بِعُمْرَتِهِ الَّتِي أَفْسَدَ إِلاَّ أَنْ …"
summary:
  ar: "حديث في موطأ مالك، رقم 770، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 770 (Hajj), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 770، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 770, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 770, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
