text: "… مسلم: حدثني من سمع من قريش أصْبَحُ الناس وجوهاً، وأحسنهم خُلُقاً، عروة بن رُوَيم، قال: انطلق أبو عبيدة يريد الصلاة ببيت وأشدهم حياء: أبو بكر، وعثمان، وأبو عبيدة. في المقدس، فأدركه أجله، فتوفي هناك، وأوصى أن يدفن سنده ابن لهيعة. …"
