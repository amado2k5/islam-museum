text: "… وقال الشاعر وزاده كَلَنًا بالحُبِّ أن مَنْعَتْ، أُحَبٌ تَيء إلى الإنسان ما مُنما وقان آخر تَرّى الناس أسواءً إذا جلسوا معًا وفى الناس زَيفٌ مثلُ زَيف الدّراهم ويقالُ : الناسُ سيلُ وأسرابُ طيرٍ يتبعُ بعضُّها بعضًا. وقار طَرَفَةٌ كلُّ خليل …"
