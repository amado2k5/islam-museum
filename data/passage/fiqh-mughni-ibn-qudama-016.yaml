text: "ائة سنة، فهو لأهله. وما كان بعدها، ضرب عليه، وذكر ابن غائذ، في كتابه، بإسناده عن سليمان بن عنبة، أن أمير المؤمين عبدالله بن محمد - أظنه المنصور- سأله في مقدمه الشام، سنة ثلاث أو أربح وخميين، عن سبب الأرضين"
