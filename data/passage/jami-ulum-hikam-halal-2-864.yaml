text: "… عليِّ عن النَّبيِّ وَل لِس ه وقد أجمع العلماء على العمل بهذه الأحاديث في الجملة، وأنَّ الرضاع يُحرِّمُ ما يُحرِّمه النَّسب، ولنذكرِ المحرَّماتِ مِنَ النَّسب كلهن حتّى يعلم بذلك ما يحرم من الرضاع، فنقول : الولادة والنَّسب قد يؤثّران التحريمَ …"
