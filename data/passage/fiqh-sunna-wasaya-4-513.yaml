  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 4, page 513, mentionnant un testament ou des conseils d'adieu, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Seyyid Sabiq'in *Fıkıh el-Sünne* adlı eserinin 4. cildinin 513. sayfasından bir alıntı, vasiyet veya son ahit, defin, mezar ve türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Vasiyetler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
