text: "الصحابة. بخلاف المصنفين في الزهد من أئمة السلف كالإمام أحمد في كتابه «الزهد» وابن المبارك في الزهد كذلك، وابن الجوزي في «صفوة الصفوة» فإنهم يذكرون الزهاد الأوائل من الصحابة والتابعين ومن يليهم، مشيرين إلى منهجهم وسلوكهم؛ فهؤلاء جميعا جعلوا أصولهم"
