text: "… من جمادى الأولى سنة ست وثلاثين، وله من العمر يومئذ سبع وستون سنة، وقد خلف بعده تركة عظيمة، فأوصى من ذلك بالثلث بعد إخراج ألفي ألف ومائتي ألف دينار، فلما قضى دينه وأخرجه ثلث ماله قسّم الباقي على ورثته، فنال …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 371، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 371, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 371 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
