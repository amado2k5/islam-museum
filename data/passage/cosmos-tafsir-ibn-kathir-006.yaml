text: "سبع أرضين في كلِّ أرض نبي كنبيكم، وآدم كآدم، ونوح كنوح، وإبراهيم كإبراهيم، وعيسىٰ كعيسى"
summary:
  ar: "يورد ابن كثير عن ابن عباس تفسير الأرض المثلية للسماوات السبع بأنها سبع أرضين في كل أرض نبي؛ ويحكي عن البيهقي قوله إن إسناده إلى ابن عباس صحيح لكنه شاذ بمرة لا متابع له، ويضعّف محقق الطبعة الإسناد بسبب شريك القاضي."
  en: "Ibn Kathir gives Ibn Abbas's reading of the earths that match the seven heavens: seven earths, each with a prophet like the prophets of ours. He cites al-Bayhaqi, who says the chain to Ibn Abbas is sound yet the report is wholly anomalous with no corroboration, and the edition's footnote calls the chain weak because of Sharik al-Qadi."
  es: "Ibn Kathir presenta la interpretación de Ibn Abbas sobre las tierras que se corresponden con los siete cielos: siete tierras, cada una con un profeta como los nuestros. Cita a al-Bayhaqi, quien afirma que la cadena de transmisión hasta Ibn Abbas es sólida, pero el relato es completamente anómalo y carece de corroboración. Además, la nota a pie de página de la edición califica la cadena de débil debido a Sharik al-Qadi."
  fr: "Ibn Kathir rapporte l'interprétation d'Ibn Abbas concernant les sept terres correspondant aux sept cieux: sept terres, chacune avec un prophète semblable aux nôtres. Il cite al-Bayhaqi, qui affirme que la chaîne de transmission jusqu'à Ibn Abbas est solide, mais que le récit est totalement anormal et sans corroboration. La note de bas de page de l'édition qualifie d'ailleurs la chaîne de transmission de faible en raison de Sharik al-Qadi."
  ur: "ابن کثیر نے ابن عباس کے ساتوں آسمانوں سے ملنے والی زمینوں کے بارے میں پڑھا ہے: سات زمینیں، ہر ایک ہمارے نبیوں کی طرح ایک نبی کے ساتھ ہے۔ اس نے البیحقی کا حوالہ دیا، جو کہتے ہیں کہ ابن عباس کا سلسلہ صحیح ہے لیکن یہ رپورٹ مکمل طور پر غیر متضاد ہے جس کی کوئی تصدیق نہیں ہے، اور ایڈیشن کا حاشیہ شرق القدی کی وجہ سے اس سلسلہ کو کمزور قرار دیتا ہے۔"
