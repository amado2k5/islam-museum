text: "… أذْرع وعَرْضه ثلاثين ذراعاً وطوله في الأرض اثنين وعشرين ذراعاً، وأَدخل الحِجْر وهو سبعة أذرع في البيت، وكان قبل ذلك زَرْباً لغنم إِسماعيل، وإِنما بنَاه بحجارة بعضها على بعض ولم يجعل له سَقْفا، وجعل له بابين وحفر له بئراً عند …"
