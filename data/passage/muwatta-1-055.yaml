label: { ar: "الموطأ 55 — سويق الصهباء عام خيبر: مضمض ثم صلى المغرب", en: "Muwatta 55" }
text: "ثم قام إلى المغرب فمضمض ومضمضنا، ثم صلى ولم يتوضأ"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن بشير بن يسار مولى بني حارثة عن سويد بن النعمان، في باب ترك الوضوء مما مست النار: خرج سويد مع النبي عام خيبر، فلما كانوا بالصهباء، على مقربة من خيبر، نزل النبي فصلى العصر ثم دعا بالأزواد فلم يؤت إلا بالسويق، فأمر به فبُلّ بالماء وأكل وأكلوا، ثم قام إلى المغرب فمضمض ومضمضوا ثم صلى ولم يتوضأ. ويخرّجه المحقق عند البخاري (209، 4195) ومسلم (1/188) وأبي داود (187) والنسائي وابن حبان من طرق أصحاب مالك، ويذكر أن قوله «وهي من أدنى خيبر» مدرج من كلام يحيى بن سعيد الأنصاري كما بينه ابن حجر في فتح الباري (1/413). {cite:muwatta-maruf-1997 p.61}"
