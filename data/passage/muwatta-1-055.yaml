label: { ar: "الموطأ 55 — سويق الصهباء عام خيبر: مضمض ثم صلى المغرب", en: "Muwatta 55", es: "Muwatta 55", fr: "Muwatta 55", ur: "موطا 55", tr: "El-Muvatta 55 — Hayber yılında Sevik el-Sahba': Ağzını çalkaladı ve akşam namazını kıldı.", id: "Al-Muwatta 55 — Sawiq al-Sahba’ pada tahun Khaybar: Dia berkumur lalu shalat Maghrib" }
text: "ثم قام إلى المغرب فمضمض ومضمضنا، ثم صلى ولم يتوضأ"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن بشير بن يسار مولى بني حارثة عن سويد بن النعمان، في باب ترك الوضوء مما مست النار: خرج سويد مع النبي عام خيبر، فلما كانوا بالصهباء، على مقربة من خيبر، نزل النبي فصلى العصر ثم دعا بالأزواد فلم يؤت إلا بالسويق، فأمر به فبُلّ بالماء وأكل وأكلوا، ثم قام إلى المغرب فمضمض ومضمضوا ثم صلى ولم يتوضأ. ويخرّجه المحقق عند البخاري ⁦(209، 4195)⁩ ومسلم (1/188) وأبي داود (187) والنسائي وابن حبان من طرق أصحاب مالك، ويذكر أن قوله «وهي من أدنى خيبر» مدرج من كلام يحيى بن سعيد الأنصاري كما بينه ابن حجر في فتح الباري (1/413). {cite:muwatta-maruf-1997 p.61}"
  tr: "Malik, ateşte pişirilmiş yemek yedikten sonra abdest almamak bölümünde, Yahya ibn Sa'id'den, o da Beni Haritha'nın azatlı kölesi Beşir ibn Yasar'dan, o da Suveyd ibn el-Nu'man'dan rivayet etmiştir: Suveyd, Hayber yılında Peygamberimizle birlikte dışarı çıktı. Hayber yakınlarındaki el-Sahba'da iken, Peygamberimiz bineğinden indi ve ikindi namazını kıldı. Sonra yiyecek istedi, ancak kendisine sadece arpa lapası getirildi. Lapayı suyla ıslatılmasını emretti ve yedi, diğerleri de yedi. Sonra akşam namazı için ayağa kalktı, ağzını çalkaladı, diğerleri de ağızlarını çalkaladı. Sonra abdest almadan namaz kıldı. Araştırmacı, bunu Buhari (209, 4195), Müslim (1/188), Ebu Davud (187), Nesai ve İbn Hibban'da, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla aktarmıştır. \"Hayber'e yakın olan\" ifadesinin, İbn Hacer'in Feth el-Bari'de (1/413) açıkladığı gibi, Yahya ibn Sa'id el-Ensari'nin sözlerinden bir ekleme olduğunu belirtmiştir."
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Bashir ibn Yasar, budak yang dibebaskan dari Banu Haritha, dari Suwaid ibn al-Nu'man, dalam surah tentang tidak berwudhu setelah makan makanan yang dimasak di atas api: Suwaid pergi bersama Nabi pada tahun Khaybar. Ketika mereka berada di al-Sahba', dekat Khaybar, Nabi turun dari kendaraan dan melaksanakan salat Asar. Kemudian beliau meminta bekal, tetapi hanya bubur jelai yang diberikan kepadanya. Beliau memerintahkan agar bubur itu dibasahi dengan air, lalu beliau memakannya, dan mereka pun memakannya. Kemudian beliau berdiri untuk salat Maghrib, berkumur, dan mereka pun berkumur. Kemudian beliau salat tanpa berwudhu. Peneliti tersebut menyertakannya dalam al-Bukhari (209, 4195), Muslim (1/188), Abu Dawud (187), al-Nasa'i, dan Ibn Hibban melalui sanad para sahabat Malik. Ia menyebutkan bahwa frasa \"yang dekat dengan Khaybar\" merupakan sisipan dari ucapan Yahya ibn Sa'id al-Ansari, sebagaimana dijelaskan Ibn Hajar dalam Fath al-Bari (1/413)."
