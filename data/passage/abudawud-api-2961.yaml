label: { ar: "سنن أبي داود 2961 — ما فُرض على الناس، الفرض", en: "Sunan Abi Dawud 2961 — what was made obligatory on people; the obligatory (fard)", ur: "سنن ابی داؤد 2961 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Sunan Abi Dawud 2961 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Sunan Abi Dawud 2961 — lo que se impuso a la gente; lo obligatorio (fard)", tr: "Sunan Abi Davud 2961 — İnsanlar üzerine farz olan şey, yükümlülük", id: "Sunan Abi Dawud 2961 — Apa yang wajib bagi manusia, kewajiban" }
text: "… لِعَدِيِّ بْنِ عَدِيٍّ الْكِنْدِيِّ، أَنَّ عُمَرَ بْنَ عَبْدِ الْعَزِيزِ، كَتَبَ إِنَّ مَنْ سَأَلَ عَنْ مَوَاضِعِ الْفَىْءِ، فَهُوَ مَا حَكَمَ فِيهِ عُمَرُ بْنُ الْخَطَّابِ فَرَآهُ الْمُؤْمِنُونَ عَدْلاً مُوَافِقًا لِقَوْلِ النَّبِيِّ \" جَعَلَ اللَّهُ الْحَقَّ عَلَى لِسَانِ عُمَرَ وَقَلْبِهِ \". فَرَضَ الأَعْطِيَةَ وَعَقَدَ لأَهْلِ الأَدْيَانِ ذِمَّةً بِمَا فُرِضَ عَلَيْهِمْ مِنَ الْجِزْيَةِ لَمْ يَضْرِبْ فِيهَا بِخُمُسٍ وَلاَ مَغْنَمٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2961، يرد فيه ذكر ما فُرض على الناس، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 2961 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), whose wording mentions what was made obligatory on people, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 2961، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 2961, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 2961, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 2961 numaralı hadis, insanların farz olan amellerini ve farz kavramını ele almaktadır. Bu hadis, farz amelleri, görevleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derleyen bir araştırmacı tarafından derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2961, menyebutkan apa yang wajib dilakukan oleh manusia, dan konsep kewajiban. Hadits ini disusun oleh seorang peneliti yang mengumpulkan amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
