label: { ar: "الموطأ 2036 — يحيى عن مالك: فيمن دفع إلى رجل مالا قراضا، ثم استسلف أو أسلفه رب المال، أو أبضع معه بضاعة يبيعها أو دنانير يشتري بها سلعة: إن كان ذلك على وجه المعروف، لا شرطا في أصل القراض، ولم يخف أن يكون لأجل إبقاء المال عنده، فهو جائز", en: "Muwatta 2036", es: "Muwatta 2036", fr: "Muwatta 2036", ur: "موطا 2036", tr: "El-Muvatta 2036 — Yahya, Malik'ten rivayetle: Birine borç para veren, sonra o borçtan borç alan veya borç alan kişiye satması için mal veya mal alması için dinar veren kişi hakkında: Eğer bu, alışılmış bir şekilde, asıl borç sözleşmesinde şart koşulmadan yapılmışsa ve parayı kendisinde tutma amacıyla yapıldığına dair bir şüphe yoksa, caizdir.", id: "Al-Muwatta 2036 — Yahya berdasarkan riwayat Malik: Mengenai orang yang memberi uang kepada seseorang sebagai pinjaman, kemudian meminjam atau dipinjami oleh pemilik uang tersebut, atau memberinya barang dagangan untuk dijual atau dinar untuk membeli barang: jika hal ini dilakukan secara lazim, bukan sebagai syarat dalam perjanjian pinjaman awal, dan tidak ada kekhawatiran bahwa tujuannya adalah untuk menyimpan uang tersebut, maka hal itu diperbolehkan." }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، واستسلف من صاحب المال سلفا، أو استسلف منه صاحب المال سلفا، أو أبضع معه صاحب المال بضاعة يبيعها له، أو بدنانير يشتري له بها سلعة. قال مالك: إن كان صاحب المال إنما أبضع معه، وهو يعلم أنه لو لم يكن ماله عنده، ثم سأله مثل ذلك فعله، لإخاء بينهما، أو ليسارة مؤونة ذلك عليه، ولو أبى ذلك عليه لم ينزع ماله منه، فإذا صح ذلك منهما جميعا، وكان ذلك منهما على وجه المعروف، ولم يكن شرطا في أصل القراض، فذلك جائز لا بأس به. وإن دخل ذلك شرط، أو خيف أن يكون إنما صنع ذلك العامل لصاحب المال، ليقر ماله في يديه، أو إنما صنع ذلك صاحب المال، لأن يمسك العامل ماله ولا يرده عليه، فإن ذلك لا يجوز في القراض، وهو مما ينهى عنه أهل العلم. {cite:muwatta-maruf-1997 p.232} {cite:muwatta-maruf-1997 p.233}"
  tr: "Yahya şöyle dedi: Malik, bir adamın bir başkasına kâr paylaşımı (kırad) için para verip, sonra da borç verenden borç alması, borç verenin de ondan borç alması veya borç verenin ona satması için mal vermesi ya da mal alması için dinar vermesi durumunda şöyle dedi: Malik şöyle dedi: Eğer borç veren, yanında parası olmasa bile, kardeşlik bağından veya kolay olacağından dolayı mal verip, borç alan kişi parasını geri almayacağını bilerek bunu yaparsa ve borç alan kişi reddederse parasını geri almayacağını da bilirse, bu durum her ikisi için de geçerli ise, iyi niyetle yapılmışsa ve asıl kâr paylaşımı anlaşmasında şart değilse, caizdir ve bunda bir sakınca yoktur. Ancak eğer bu bir şart ise veya işçinin bunu borç verenin parasını elinde tutması için yaptığına veya borç verenin işçinin parasını elinde tutması ve geri vermemesi için yaptığına dair bir korku varsa, o zaman bu bir kâr paylaşımı düzenlemesinde caiz değildir ve âlimlerin yasakladığı bir şeydir. {cite:muwatta-maruf-1997 s.232} {cite:muwatta-maruf-1997 s.233}"
  id: "Yahya berkata: Malik berkata tentang seorang pria yang memberikan uang kepada pria lain untuk perjanjian bagi hasil (qirad), dan kemudian meminjam dari pemberi pinjaman, atau pemberi pinjaman meminjam darinya, atau pemberi pinjaman memberinya barang dagangan untuk dijual, atau dinar untuk membeli barang untuknya: Malik berkata: Jika pemberi pinjaman memberikan barang dagangan dengan mengetahui bahwa jika dia tidak memiliki uangnya, dan kemudian meminta uang yang sama, dia akan melakukannya karena persaudaraan mereka, atau karena akan mudah baginya untuk melakukannya, dan jika dia menolak, dia tidak akan mengambil uangnya kembali, maka jika ini sah bagi keduanya, dan dilakukan dengan cara yang baik, dan itu bukan syarat dalam perjanjian bagi hasil awal, maka itu diperbolehkan dan tidak ada yang salah dengannya. Namun jika itu merupakan syarat, atau jika ada kekhawatiran bahwa pekerja melakukan hal ini agar pemberi pinjaman dapat menyimpan uangnya, atau bahwa pemberi pinjaman melakukannya agar pekerja dapat menyimpan uangnya dan tidak mengembalikannya, maka hal ini tidak diperbolehkan dalam pengaturan bagi hasil, dan ini adalah sesuatu yang dilarang oleh para ulama. {cite:muwatta-maruf-1997 p.232} {cite:muwatta-maruf-1997 p.233}"
