label: { ar: "الموطأ 2036 — يحيى عن مالك: فيمن دفع إلى رجل مالا قراضا، ثم استسلف أو أسلفه رب المال، أو أبضع معه بضاعة يبيعها أو دنانير يشتري بها سلعة: إن كان ذلك على وجه المعروف، لا شرطا في أصل القراض، ولم يخف أن يكون لأجل إبقاء المال عنده، فهو جائز", en: "Muwatta 2036" }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، واستسلف من صاحب المال سلفا، أو استسلف منه صاحب المال سلفا، أو أبضع معه صاحب المال بضاعة يبيعها له، أو بدنانير يشتري له بها سلعة. قال مالك: إن كان صاحب المال إنما أبضع معه، وهو يعلم أنه لو لم يكن ماله عنده، ثم سأله مثل ذلك فعله، لإخاء بينهما، أو ليسارة مؤونة ذلك عليه، ولو أبى ذلك عليه لم ينزع ماله منه، فإذا صح ذلك منهما جميعا، وكان ذلك منهما على وجه المعروف، ولم يكن شرطا في أصل القراض، فذلك جائز لا بأس به. وإن دخل ذلك شرط، أو خيف أن يكون إنما صنع ذلك العامل لصاحب المال، ليقر ماله في يديه، أو إنما صنع ذلك صاحب المال، لأن يمسك العامل ماله ولا يرده عليه، فإن ذلك لا يجوز في القراض، وهو مما ينهى عنه أهل العلم. {cite:muwatta-maruf-1997 p.232} {cite:muwatta-maruf-1997 p.233}"
