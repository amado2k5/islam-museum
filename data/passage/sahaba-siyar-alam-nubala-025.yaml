text: "يه فرأيته عند دار الجوهري قاعدا على غرفة، ومعه رجلان ينظران في كتاب، فيحدثهم خمس مئة في اليوم أقل أو أكثر، وهم أسفل، وهو فوق، فيأخذون كتابه فينسخون من غذوة إلى الليل، فرجعت ولم أسمع منه شيئا. وقال أيضا: شهدته"
