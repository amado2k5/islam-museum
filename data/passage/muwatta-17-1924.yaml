label: { ar: "الموطأ 1924 — يحيى عن مالك عن يحيى بن سعيد عن القاسم بن محمد: سمع ابن عباس يقال له عن رجل أسلف في سبائب ثم أراد بيعها قبل قبضها، فقال ابن عباس تلك الورق بالورق، وكره ذلك", en: "Muwatta 1924", es: "Muwatta 1924", fr: "Muwatta 1924", ur: "موطا 1924", tr: "El-Muvatta 1924 — Yahya, Malik'ten, o da Yahya ibn Said'den, o da el-Kasım ibn Muhammed'den rivayetle: İbn Abbas, bir adamın gümüş paralar karşılığında borç verdiğini ve daha eline geçmeden satmak istediğini duydu. İbn Abbas, \"Bu, kağıt para karşılığında kağıt paradır\" dedi ve bunu beğenmedi.", id: "Al-Muwatta 1924 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Yahya ibn Saeed, berdasarkan riwayat al-Qasim ibn Muhammad: Ibnu Abbas mendengar bahwa seorang pria meminjamkan uang dengan imbalan koin perak dan kemudian ingin menjualnya sebelum menerimanya. Ibnu Abbas berkata, “Itu uang kertas untuk uang kertas,” dan dia tidak menyukai hal itu." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن القاسم بن محمد أنه قال: سمعت عبد الله بن عباس، ورجل يسأله عن رجل أسلف في سبائب، فأراد بيعها قبل أن يقبضها. فقال ابن عباس: تلك الورق بالورق. وكره ذلك. {cite:muwatta-maruf-1997 p.188}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayet eder ki, şöyle demiştir: Abdullah ibn Abbas'a bir adamın, köle almak için borç alan ve köleleri teslim almadan önce satmak isteyen bir adam hakkında soru sorduğunu işittim. İbn Abbas, \"Bu, kağıt karşılığı kağıttır\" dedi ve bu durumdan hoşlanmadığını söyledi. {cite:muwatta-maruf-1997 s.188}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, bahwa ia berkata: Aku mendengar Abdullah ibn Abbas ditanya oleh seorang pria tentang seorang pria yang telah mengambil pinjaman untuk membeli budak, dan kemudian ingin menjualnya sebelum memilikinya. Ibn Abbas berkata: Itu adalah pertukaran kertas dengan kertas. Dan dia tidak menyukai hal itu. {cite:muwatta-maruf-1997 p.188}"
