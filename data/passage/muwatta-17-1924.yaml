label: { ar: "الموطأ 1924 — يحيى عن مالك عن يحيى بن سعيد عن القاسم بن محمد: سمع ابن عباس يقال له عن رجل أسلف في سبائب ثم أراد بيعها قبل قبضها، فقال ابن عباس تلك الورق بالورق، وكره ذلك", en: "Muwatta 1924" }
summary:
