text: "… منه رأيا ونصحاً، قالوا : أجل، فادخل، فدخل معهم، وقد اجتمع فيها أشراف قريش : عتبة وشيبة وأبو سفيان وطعيمة بن عدى وجبير ابن مطعم بن عدى والحارث بن عامر بن نوفل والنضر بن الحارث وأبو البخترى بن هشام كذا …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 6، ص 210، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
