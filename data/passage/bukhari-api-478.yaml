label: { ar: "صحيح البخاري 478 — الأب والأبوة", en: "Sahih al-Bukhari 478 — the father and fatherhood", ur: "صحیح بخاری 478 — باپ اور والدیت", es: "Sahih al-Bukhari 478 — El padre y la paternidad", fr: "Sahih al-Bukhari 478 — le père et la paternité", tr: "Sahih el-Buhari 478 — Baba ve Babalık", id: "Sahih al-Bukhari 478 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا حَامِدُ بْنُ عُمَرَ، عَنْ بِشْرٍ، حَدَّثَنَا عَاصِمٌ، حَدَّثَنَا وَاقِدٌ، عَنْ أَبِيهِ، عَنِ ابْنِ عُمَرَ، أَوِ ابْنِ عَمْرٍو شَبَّكَ النَّبِيُّ أَصَابِعَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 478، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 478, that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 478، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 478, menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Le Sahih al-Bukhari, n° 478, mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 478 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 478, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
