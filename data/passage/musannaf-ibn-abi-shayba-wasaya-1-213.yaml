text: "… السوق فأخذ بيدي فصافحني فقال: يا أبا ذر من سأل اللّٰه رضاه فقد سأله أمراً عظيما. - حدثنا خلف بن خليفة عن عون بن شداد أن هرم بن حيان العبدي لما نزل به الموت قالوا له: يا هرم! أوصني، قال: …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 213، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 213, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 213 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
