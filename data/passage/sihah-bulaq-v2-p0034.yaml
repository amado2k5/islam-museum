text: |-
  • (باب الواو واليام-
  • ⁦( ا)⁩ . ..
  ٥٥٢
  وأنيت غيرى أبوزيداستحييت الشجر قطعته من أصوله وأغييت قضيا من الشجرة أى
  قطعت والنجاة الفصن والجمع نجا ويقال أفجف غمما أى اقطعه لى والنيو السهاب الذى
  هراف ماءه والمع تجاهمئل بهروعار وحكى ابن السكيت أنجت السداية اذاوات والنجوة
  والنجاة المكان المرتفع الذى نظن أنه تجاول لايعلوه السيل وقال
  ألم تريا النعمان كان بنجوة • من الشرلوأن امرأً كان ناجيا
  ويقال فجى فلان أرضه تنيية اذا كبه امجافة الغرق والنيواء القطى مثل الملمواء وقال
  وهمّ تأخذالنجواء منسه• ابن الاعرابى بدى وبين فلان فجادة من الارض آى سعة والنجو
  السرّ بين اثنين يقال نجونه فجوا أى ساررته وكذلك ناجبته وانتجى القوم وتناجوا أى
  نساروا وا تججينه أبضا اذا خصصته بناجاتك والاسم التجوى وقال.
  قبت أفجوبه ا نفساتكلفن • مالايهم به الجنامة الورع
  وقولة تعالى واذهم تجرى بفعلهم هسم النجوى وانا النجوى فعلهم كانة ول قوم رضاوانما
  الرضافعلهم والنبيّ على فعيل الذى نساره والجمع الاغجية وقال
  انى اذاما القوم كانوا أغجبه • واضعارب القوم اضطراب الارشيه
  • هناك أوصين ولا توص بيه•
  قال الاخف وقد يكون النيجماعة مثل الصديق قال القه تعالى خله وانجيا وقال الفزاء
  وقد يكون التجى والتبجرى اسمار مصدرا ⁦(فها )⁩ النحو القصد والطريق يقال غحرت
  نعول أى قصدت تصدك وفوت بصرى اليسه أى صرفت وأنحيت عنه بصرى أى عدلته
  وقول الشاءر • تماه المدزيرقان وحارت• أى صيراهذا الميت فى ناحية القبر وأني فى
  سيره أى اعتمد على الجانب الايسر والانتهماء مثله هذاهو الاصل ثم صار الاتهاء الاعتماد
  والميل فى كل وجسه واتتحيت لفلان أى عرضت ه وأغيت على حلقه السكين أى عرضت
  وغحيته عن. وضعه تحية فتنى وقال • كتنهية القتب الجاب• والتهواعراب السكلام
  العربة وحكى عن أعرابي أنه قال انسكم لتنظرون فى نعو كثيرة فشبهها بعتو وهو قليل
  والوجه فى مثل ه-ذه الواواذاجاءت فى جمع الياه كقولهم في جمع ندى وعصاوحة وندى
  وعصى" وحقت وبنوغه وقوم من العرب والنى بالكسرزو للسمن وايمع أنهاء عن أب عبيدة
  وفى المثل أشغل من ذات الصيين وهى امر أمن تيم القّه بن تعلية ك انت تبيع السمن
  فى الجاهلية فأتاها خوات بن جبير الانسادى فساومها فلت غحيا علو أنقال امسكيه
  حتى أنظر الى غيره ثم حلّ آخر وقال لها أمسكيه فلما شغل يديم اساورها حتى قضى
  ما أراد وهرب فقال فى ذلك
  وذات عيال واثة ين بعقلها • خطت لها جاراستها خلات
  وشدت يديها اذ أردت خلاطها • يجهيين من ممن ذوى عجرات
  فكانت لها الويلات من تزك سمتمها • ورجعتها صرابفسيربتات
  فشدت على النحيين كفاشحيصة • على سعنها والفتك من فعلاى
  ثم أس-لم خوّات وشهد بدرافقال درسول اللّٰه على اللّٰه عليه وسلم ياخوّات كيف كان شرادك
  ٤٢٩
