text: "… بن اليهو بن تهو ابن صوف بن علقمة بن ماحث بن عموضا بن عزريا. قال مقاتل : وهو من ورثة هارون. وقال مجاهد : هو أشمويل بن هلفاقا، ولم يرفع في نسبه أكثر من هذا.. والله أعلم. حكى السدي بإسناده …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 582، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 582, that mentions what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 582 کا اقتباس جس میں ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
