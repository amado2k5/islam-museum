  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 582. sayfasından bir alıntı, taranmış, makine tarafından okunabilir versiyondan alınmıştır ve yaklaşık kırk kelimeden oluşmaktadır. Metin, kaynak politikasına uygun olarak derlenmiştir ve \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından hazırlanmıştır."
  id: "Sebuah kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 582, menyebutkan harta dan warisannya; dari versi yang dipindai dan dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Makam Suci\"."
