text: "… بن اليهو بن تهو ابن صوف بن علقمة بن ماحث بن عموضا بن عزريا. قال مقاتل : وهو من ورثة هارون. وقال مجاهد : هو أشمويل بن هلفاقا، ولم يرفع في نسبه أكثر من هذا.. والله أعلم. حكى السدي بإسناده …"
summary:
