text: "… حالًا منهم. وأوصى بنيهِ فقال : لا تُجاوِدُوا اللّٰه فإنه أَمجدُ وأجودُ، ولو شاء أن يُوسِّع على الناس كُلّهم حتى لا يكونَ محتاجٌ لفعلَ، فلا تَجهّدُوا أَنفُسَكم فى التوسُّع فتهلكُوا هُزْلًا. قال: وسمع رجلا يقول: مَن يُعَنّى الجائعَ؟ فقال: علىّ …"
