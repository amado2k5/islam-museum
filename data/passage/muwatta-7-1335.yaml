label: { ar: "الموطأ 1335 — يحيى بن سعيد: كان عمر بن الخطاب يحمل في العام الواحد أربعين ألف بعير في سبيل الله", en: "Muwatta 1335" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب كان يحمل في العام الواحد على أربعين ألف بعير، يحمل الرجل إلى الشام على بعير، ويحمل الرجلين إلى العراق على بعير. فجاءه رجل من أهل العراق فقال احملني وسحيما، فقال له عمر أنشدتك الله، أسحيم زق؟ قال نعم. {cite:muwatta-maruf-1997 p.597}"
