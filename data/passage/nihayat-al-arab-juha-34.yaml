  en: "An excerpt from Nihayat al-Arab fi Funun al-Adab, p. 34, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "نہایۃ الارب فی فنون الادب، ص 34 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
