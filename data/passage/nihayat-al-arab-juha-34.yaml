text: "في المدح والهجو والمجون والفُكاهات والمُلَح والخمر والمُعاقرة والنّدمان والقِيان... الخ أن يستقِلّ. فقال عبد الله: ظلمناك يا أشعبُ في غضبِنا عليك. فقال له سالم: ويلك! ما لك؟ ألم تكن عندي آنفًا وأكلتَ هريسة! قال: لقد شُبّه لك، لا حولَ …"
summary:
