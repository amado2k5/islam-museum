label: { ar: "الموطأ 2650 — هشام بن عروة عن أبيه: عائشة تكسو عبد الله بن الزبير مطرف خز كانت تلبسه", en: "Muwatta 2650", es: "Muwatta 2650", fr: "Muwatta 2650", ur: "موطا 2650", tr: "El-Muvatta 2650 — Hişam ibn Urve, babasının rivayetine göre: Ayşe, Abdullah ibn el-Zübeyr'e kendi giydiği ipek bir pelerin giydirdi.", id: "Al-Muwatta 2650 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Aisyah memakaikan Abdullah ibn al-Zubayr jubah sutra yang biasa ia kenakan sendiri." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة أنها كستْ عبد الله بن الزبير مطرف خز كانت عائشة تلبسه. {cite:muwatta-maruf-1997 p.499}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından, o da Ayşe'den rivayet ettiğine göre, Ayşe, Abdullah ibn el-Zübeyr'e Ayşe'nin kendisinin de giydiği ipek bir pelerin vermiştir. {cite:muwatta-maruf-1997 s.499}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, bahwa ia memberikan kepada Abdullah ibn al-Zubayr sebuah jubah sutra yang biasa dikenakan Aisyah sendiri. {cite:muwatta-maruf-1997 p.499}"
