label: { ar: "صحيح البخاري 5995 — من أحسن إلى البنات كن له سترا", en: "Sahih al-Bukhari 5995 — Good to daughters, a screen from the Fire", ur: "صحیح بخاری 5995 — بیٹیوں سے نیکی، جہنم سے حجاب", es: "Sahih al-Bukhari 5995 — Buenas hijas, una pantalla del Fuego", fr: "Sahih al-Bukhari 5995 — Bienveillante envers ses filles, un rempart contre le Feu", tr: "Sahih el-Buhari 5995 — Kim kızlarına iyi davranırsa, onlar onun için bir koruma kaynağı olurlar." }
text: "حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، قَالَ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي بَكْرٍ، أَنَّ عُرْوَةَ بْنَ الزُّبَيْرِ، أَخْبَرَهُ أَنَّ عَائِشَةَ زَوْجَ النَّبِيِّ صلى الله عليه وسلم حَدَّثَتْهُ قَالَتْ جَاءَتْنِي امْرَأَةٌ مَعَهَا ابْنَتَانِ تَسْأَلُنِي، فَلَمْ تَجِدْ عِنْدِي غَيْرَ تَمْرَةٍ وَاحِدَةٍ، فَأَعْطَيْتُهَا، فَقَسَمَتْهَا بَيْنَ ابْنَتَيْهَا، ثُمَّ قَامَتْ فَخَرَجَتْ، فَدَخَلَ النَّبِيُّ صلى الله عليه وسلم فَحَدَّثْتُهُ فَقَالَ ‏ \"‏ مَنْ يَلِي مِنْ هَذِهِ الْبَنَاتِ شَيْئًا فَأَحْسَنَ إِلَيْهِنَّ كُنَّ لَهُ سِتْرًا مِنَ النَّارِ ‏\"‏‏.‏"
summary:
  ar: "عن عائشة: من يلي من هذه البنات شيئا فأحسن إليهن كن له سترا من النار."
  en: "From Aisha: whoever is put in charge of any of these daughters and is good to them — they will be a screen for him from the Fire."
  ur: "عائشہ سے: جسے ان بیٹیوں کا کچھ بار دیا جائے اور وہ ان سے نیکی کرے وہ اس کے لیے جہنم سے حجاب ہوں گی۔"
  es: "De Aisha: quienquiera que se haga cargo de alguna de estas hijas y las trate bien, ellas serán una protección para él contra el Fuego."
  fr: "D'après Aïcha: quiconque est chargé de prendre soin de l'une de ces filles et qui est bon envers elles, elles seront pour lui un écran contre le Feu."
  tr: "Ayşe'nin rivayetine göre: Bu kızlara sahip çıkan ve onlara iyi davranan kimse için onlar ateşten bir kalkan olurlar."
  id: "Berdasarkan riwayat Aisyah: Siapa pun yang mengurus putri-putri ini dan memperlakukan mereka dengan baik, mereka akan menjadi perisai baginya dari api neraka."
