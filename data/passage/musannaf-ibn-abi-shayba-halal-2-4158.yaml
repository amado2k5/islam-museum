text: "… حِلّ عليّ حرام؛ كفارة يمين. - حدثنا أبو بكر قال: نا حُميد بن عبد الرحمن عن حسن ابن صالح عن جابر عن علي، في الرجل يقول لامرأته: كُلّ حِلّ عليّ فهو حرام، قال: تَحرم عليه أمرأته، ولا تَحلّ له حتى …"
