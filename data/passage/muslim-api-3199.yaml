label: { ar: "صحيح مسلم 3199 — الحلال", en: "Sahih Muslim 3199 — the lawful", ur: "صحیح مسلم 3199 — حلال", es: "Sahih Muslim 3199 — el lícito", fr: "Sahih Muslim 3199 — le licite", tr: "Sahih Muslim 3199 — Helal", id: "Sahih Muslim 3199 — Halal" }
text: "وَحَدَّثَنَا عَلِيُّ بْنُ حُجْرٍ السَّعْدِيُّ، وَيَعْقُوبُ بْنُ إِبْرَاهِيمَ الدَّوْرَقِيُّ، قَالَ ابْنُ حُجْرٍ حَدَّثَنَا إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ، عَنْ أَيُّوبَ، عَنِ الْقَاسِمِ، وَأَبِي، قِلاَبَةَ عَنْ عَائِشَةَ، قَالَتْ كَانَ رَسُولُ اللَّهِ يَبْعَثُ بِالْهَدْىِ أَفْتِلُ قَلاَئِدَهَا بِيَدَىَّ ثُمَّ لاَ يُمْسِكُ عَنْ شَىْءٍ لاَ يُمْسِكُ عَنْهُ الْحَلاَلُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3199، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3199 (The Book of Pilgrimage), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3199، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 3199 (El Libro de la Peregrinación), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3199 (Le Livre du Pèlerinage), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 3199 numaralı hadis, helal olan şeylerden bahsetmektedir. Helal ve haram sözlüğünün bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntıları bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3199, menyebutkan apa yang diperbolehkan (halal). Bagian kamus halal dan haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
