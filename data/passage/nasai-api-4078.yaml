label: { ar: "سنن النسائي 4078 — ما حُرّم", en: "Sunan al-Nasa'i 4078 — what was made unlawful", ur: "سنن نسائی 4078 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 4078 — lo que se declaró ilícito", fr: "Sunan al-Nasa'i 4078 — ce qui a été déclaré illicite", tr: "Sunan an-Nasa'i 4078 — Yasak olan nedir?", id: "Sunan an-Nasa'i 4078 — Apa yang dilarang" }
text: "… عَنْ تِسْعِ آيَاتٍ بَيِّنَاتٍ فَقَالَ لَهُمْ \" لاَ تُشْرِكُوا بِاللَّهِ شَيْئًا وَلاَ تَسْرِقُوا وَلاَ تَزْنُوا وَلاَ تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ وَلاَ تَمْشُوا بِبَرِيءٍ إِلَى ذِي سُلْطَانٍ وَلاَ تَسْحَرُوا وَلاَ تَأْكُلُوا الرِّبَا وَلاَ تَقْذِفُوا الْمُحْصَنَةَ وَلاَ تَوَلَّوْا يَوْمَ الزَّحْفِ وَعَلَيْكُمْ خَاصَّةً يَهُودُ أَنْ لاَ تَعْدُوا فِي السَّبْتِ \". فَقَبَّلُوا يَدَيْهِ وَرِجْلَيْهِ وَقَالُوا نَشْهَدُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4078، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4078 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4078، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4078 (El Libro de la Lucha [La Prohibición del Derrame de Sangre]), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4078 (Le Livre du Combat [L'Interdiction du Sang]), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de yer alan 4078 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4078, menyebutkan apa yang dilarang. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
