text: "… فإنهم قالوا: إن لم يترك الموصي ورثة جاز له أن يوصي بماله كلّه. وقالوا: إن الاقتصار على الثلث في الوصية إنما كان من أجل أن يدع ورثته أغنياء؛ لقوله: إنك أنْ تَذَرَ ورثتك أغنياء خير من أن تذرهم عالة يتكفّفونِ …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 741، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 741, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 741 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
