text: "… عيني وَفي أرَبي من الدّهرِ لا أملِك عَزَاءً وَلَا صَبَرا وَقود الغضًا والقلبُ مضطرمٌ جمرَا على أنّهُ لم يَبقَ سرٌّ وَلَاَ سِترُ ا فُيُسْلِيني عنكِ التّجَهُمُ وَالهَجْرُ ن ونَظرَتِّهَا حتى يُغيّبُني القَبرُ على أنه لم يبق سِتر ولا صبرُ فيسلبني …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 131، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
