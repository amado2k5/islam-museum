text: "… ويجب أن يكون الباط عارفاً بالتشريح، تشريح العصب والأوردة والشرايين لنلا يخطئ، فيقطع شيئاً منها، فيؤدي إلى هلاك المريض. ويجب أن يكون عنده عدد من الأدوية الحابسة للدم ومن المراهم المسكّنة للوجع والآلات التي تجانس ذلك فيكون معه، مثل دواء …"
