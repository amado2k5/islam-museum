text: "إِنَّمَا ٱلْمُؤْمِنُونَ ٱلَّذِينَ ءَامَنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَإِذَا كَانُوا۟ مَعَهُۥ عَلَىٰٓ أَمْرٍ جَامِعٍ لَّمْ يَذْهَبُوا۟ حَتَّىٰ يَسْتَـْٔذِنُوهُ ۚ إِنَّ ٱلَّذِينَ يَسْتَـْٔذِنُونَكَ أُو۟لَـٰٓئِكَ ٱلَّذِينَ يُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ ۚ فَإِذَا ٱسْتَـْٔذَنُوكَ لِبَعْضِ شَأْنِهِمْ فَأْذَن لِّمَن شِئْتَ مِنْهُمْ وَٱسْتَغْفِرْ لَهُمُ ٱللَّهَ ۚ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ"
text_search: "إنما المؤمنون الذين آمنوا بالله ورسوله وإذا كانوا معه على أمر جامع لم يذهبوا حتى يستأذنوه ۚ إن الذين يستأذنونك أولئك الذين يؤمنون بالله ورسوله ۚ فإذا استأذنوك لبعض شأنهم فأذن لمن شئت منهم واستغفر لهم الله ۚ إن الله غفور رحيم"
translations:
  en: { text: "They only are the true believers who believe in Allah and His messenger and, when they are with him on some common errand, go not away until they have asked leave of him. Lo! those who ask leave of thee, those are they who believe in Allah and His messenger. So, if they ask thy leave for some affair of theirs, give leave to whom thou wilt of them, and ask for them forgiveness of Allah. Lo! Allah is Forgiving, Merciful.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "مومن تو وہ ہیں جو خدا پر اور اس کے رسول پر ایمان لائے اور جب کبھی ایسے کام کے لئے جو جمع ہو کر کرنے کا ہو پیغمبر خدا کے پاس جمع ہوں تو ان سے اجازت لئے بغیر چلے نہیں جاتے۔ اے پیغمبر جو لوگ تم سے اجازت حاصل کرتے ہیں وہی خدا پر اور اس کے رسول پر ایمان رکھتے ہیں۔ سو جب یہ لوگ تم سے کسی کام کے لئے اجازت مانگا کریں تو ان میں سے جسے چاہا کرو اجازت دے دیا کرو اور ان کے لئے خدا سے بخششیں مانگا کرو۔ کچھ شک نہیں کہ خدا بخشنے والا مہربان ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
