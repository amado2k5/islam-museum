text: "قتلى المشركين في أحد نقطع رواهشه بسهم فنزف حتى مات. وعثمان بن عبد اللّٰه بن أبي أمية بن المغيرة، قتله الحارث بن الصمة. وكان عثمان بن عبد اللّه أسر ببطن نخلة، أسره عبد اللّه بن جحش، فافتدي فرجع إلى قريش. …"
