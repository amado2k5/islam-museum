label: { ar: "سنن النسائي 2308 — الأب والأبوة", en: "Sunan al-Nasa'i 2308 — the father and fatherhood", ur: "سنن نسائی 2308 — باپ اور والدیت", es: "Sunan al-Nasa'i 2308 — El padre y la paternidad" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَنْبَأَنَا عَبْدَةُ بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ حَمْزَةَ الأَسْلَمِيَّ، سَأَلَ رَسُولَ اللَّهِ عَنِ الصَّوْمِ فِي السَّفَرِ وَكَانَ رَجُلاً يَسْرُدُ الصِّيَامَ. فَقَالَ \" إِنْ شِئْتَ فَصُمْ وَإِنْ شِئْتَ فَأَفْطِرْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2308، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2308 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2308، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2308 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
