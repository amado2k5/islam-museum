text: |-
  *⁦(باب الميم)⁩*
  ٣٣٥
  قال ابن مفرغ
  شدخت غرة السوابق منهم • فى وجوممع اللعام الجعاد
  ويقسال أيضافلان يزور نالماما أى فى الاحايين ومالحة الفيل خرطومه وكتيبة مللمة وماومة
  أيضا أى مجتمعة مضموم بعضها الى بعض وصخرة ملمومة ومللمة أى مستديرة صلبة ويللم وأللم
  موضع و*وميقات أهل اليمن وقوله تعالى ويأكلون التراث أكلالما أى نصيبه ونصيب صاحبه
  قال أبو عبيدة يقال لممته أجمع -تى أتيت على آخره وأماقوله تعالى وانّ كلالماليوفينه-م
  بالتشديد قال القراء أصله لمما فلهما كثرت فيه الميمات حذفت منها واحدة وقرأ الزهركة لما
  بالتنوين أى جيعا ويحتمل أن يكون أصله لمن من فذفت منها احدى الميمات وقول من قال
  لما بعنى الافليس يعرف فى اللغة ولم حرف نفقى لما مضى تقول لم يفعل ذالاريد أنه لم يكن ذلك
  الفعل منه فيمامضى من الزمان وهى جازمة وحروف الجزم لم ولما وألم وألماقال سيبويه
  لم ننى لة ولك فعل ولن تنى اقولك سيفعل ولا ذفى اقولك يفعل ولم يقع الفعل وما تفى لقولك هو
  يفعل اذا كان فى حال الفعل ولماننى لقولك قد فعل يقول الرجل قدمات فلان فتقول لما
  ولم يمت ولما أصله لم أدخل عليه ما وهو يقع موقع لم تقول أنيتك ولما أصل اليك أى ولم أصل
  اليك وقد يتة-ير معناه عن معنى لم فيكون جوابا وسببالما وقع ولمالم يقع تقول ضربت هلما
  ذهب ولما لم يذهب وقد يختزل الفعل بعده تقول قاريت المسكان ولما تريد ولما أدخله ولا يجوز
  أن يختزل الفعل بعدلم ولم بالكسر جرف يستفهم به تقول لم ذهبت ولك أن تدخل عليه ماثم
  تحذف منه الالف قال اللّٰه تعالى عفا الله عنك لم أذنت له-م ولك أن تدخل عليها الهاء
  فى الوقف فتقول له وقول الشاعر
  يا نجبا والدهرجم عحبه • من عنزى سبن لم أضربه
  فانه لما وقف على الهاءنقل حركتها الى ماقبلها ⁦(لوم)⁩ اللوم العذل نقول لامه على كذا
  لوما ولومة٥ وملوم ولوّمه شدد للمبالغة واللوم:مح لائم مثل راكع وركع واللائمة الملامة
  وكذلك اللومى على فعلى يقال مازات أتجترع فيك اللوائم والملاوم جمع الملامة واللامة الامر
  يلام عليه وألام الرحل اذا أتى بمايلام عليه يقال لام فلان غير مليم وفى المنسل دب لاتم مليم
  قال الشاعر* ومن يخذلِ أخاه فقد ألاما * واستلام الرجل إلى الناس أى استذم
  أبو عبيدة يقال ألمته ب؟عى لمته وأنشدلعة ل بن خو يلد الهذلى
  حدت اللّٰه أن أمسى ربيع • بدار الذلّ ملميا ملاما
  والملاومة أن تلوم رجسلا ويلومك وتلاوم والام بعضهم بعضا ورجسل لومة بلومه الناس
  ولومة يلوم الناس مثل هزأة وهزأة والتلوم الانتظار والتمسكث ولام الانسان شفصه غير
  مهموز وقال الراجز مهرية تخطر فى زمامها • لم ييق منها السير غيرلامها
  واللام من حروف الزيادات وهى على شربين متحركة وساكنة فأمًا الساكنة فعسلى ضربين
  وأما اللامات المتحركة فهى ثلاث لام الامر ولام التوكيسد ولام الاضافسة فأمالام الامر
  كولك ليقم زيدتأ مر بها الغائب وربما أمر وابها المخاطب وقرئ فبذلك فلتة رحوا بالتاه وقد
  يجوز حذف لام الامر فى الشعر فتعمل مضمرة كقول متمم بن تويرة
  على مثل أصحاب البعوضة فاخشى • لك الويل حز الوجه أويبك من بكا .
  قوله وقول من قال الخ فى .
  القاموس وانكاراجوهركونه
  ععنى الاغير جيد بقال سألتك
  لما فعلت أى الافعلت ومنه ان
  كل نفس لماعليها حافظ وان كل
  لما جيع لدينا محضرون اه
