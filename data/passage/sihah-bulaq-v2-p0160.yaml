text: |-
  • ⁦(ب ب الها.)⁩
  ٢٤٧
  والشبهان ضرب من العضاه وقال رجل من عيد القيس
  بواديمان ينبت الشث صدره * وأسفه بالمرخ والشبهان
  ويقال هو النمام من الرياخينشده ده الرجل شدها فهو مشدوه هس واا
  لشده والشده مثل البخل والبخل وقال أبوزيد شده الرجل شغل لاغير ره . لشره غلب
  الحرص وقد شره الرجل فهوشره ( فه الشفة أصلها شفهة لان تصغيرهاشفيهة والجمع
  شسفاه بإلهاء واذانسبت اليها فأنت بالحياران شئت تركتها على حالها وقلت شقىّ مثال دمة
  ويدىّ وعدىّ وان شذت شفهىّ وزعم قوم أنّ الناقص من الشفة واولانه يقال فى الهع
  شفوات ورجل أشفى اذا كان لا تنضم شفتاه كالاروق ولادليل على صحته ورجل شفاهىّ
  بالضم عظيم الشفتين ابن السكيت فلان خفيف الشفة أى قليل السؤال للفاس ويقال له
  فى الناس شفة أى شاء حسن وما كلمته بينت شفة أى بكلمة والشفه الشغل يقال شفهى عن
  كذا أى شغلى وقواهم نحن نشفه عليك المرتع والماء يعنى نشغله عنك أى هوقدرنا لافضل
  فيه ورجل مشفوه اذا كثرسؤال الناس اياه حتى نقدماعنده مثل منمود ومضغوف ومكنور
  عليه وقد شة هى فلان اذا ألحّ عليك فى المسئلة حتى أنفدما عندك وماء مشفوه وهو الذى
  قد كثر عليه الناس والمشافهة الخاطبة من فيل الى فيه والحروف الشفهية الباء والفاءوالميم
  ولا تقل شفوية (شكه شاكهه مشاكهة وشكاهاشابهه وقاريه وفى المئل شاكه أبا
  فلان أى قارب فى المدح كما يقال بدون هذا ينف ق الحمار قال زهير
  علون بأغماط عتاف وكلة * وراد حواشح امشاكهة الدم
  أبو عمروين العلاء أشكد الامر منل أشكل⁦(شوه)⁩شادت الوجوه تشوه شوها قيعت
  وسوهه الله ٥هو«- وه وفرص شوهاء صفة محمودة فيهاديقال يرادبم اسعة أشداقها قال
  الشاعر
  فهى شوها كالحوااق فوها * مستجاف يضل فيه الشكيم
  ولا يقال للذكر أشوه ويقال رجل أشوه بين الشوه اذا كان سريع الاصابة بالعين
  ابن السكيت يقال لا تشوّه علىّ أى لا تقل ما أحسنك فتصيبنى بالعين ويقال أيضاتشوهل
  أى تشكره وتغوّل ورجل شائه البصر أى حديد البصر والشاة من الغنم تذكروتوّنت
  وفلان كثير الشاة والبعير وهو فى معنى ابمع لان الالغ واللام الجنس وأصل الشاة شاهة لات
  تصغير هانويهة والجمع شياه بالهاء فى العددتقول ثلاث شياه الى العشر فاذاجاوزت فبالتا.
  فاذا كثرت قيل هذم شا. كثيرة وججع الشاءشوى والشاة أيضا النور الوحشىّ قال طرقة
  كسامعتى شاة بحومل مفرد• وتشوّهت شاة اذا اصطدته أبو عبيد أرض مشأهة ذات
  شاءكما بقال أرض مأبلة والنسبة الى الشامشاوى وقال الراجز
  لا ينفع الشاوى فيهاشاته • ولاماراه ولاعلاته
  وان شهيت به رجلاقلت شائى وان شقت شاوى" كما تقول عطاوى وان نسبت الى الشاقلت
