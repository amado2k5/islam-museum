  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 621, that mentions honey as a remedy, the drug, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 621 کا اقتباس جس میں شہد سے علاج، دوا، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
