  tr: "İbn al-Athir'in \"Asad al-Ghaba\" adlı eserinin resimli 2. cildinin 621. sayfasında bal, ilaç ve şifa ile tedaviye değinilmektedir; makine tarafından okunabilir resimli versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
