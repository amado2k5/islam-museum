text: "عَامر بن مُرَقَش عَامرُ بَنُ مَالك بن جَعْفر أشعث بن سَوّار، عن علي بن زيد، عن زرارة بن أرسل إلى النبي عله يلتمس منه دواء أو شِفاء، فبعث إليه بعُكة عَسَل. أوفى، عن عامر بن مالك، قال: كنت عند النبي …"
summary:
