label: { ar: "الموطأ 1103 — محمد بن يحيى بن حبان عن الأعرج عن أبي هريرة: أن رسول الله نهى عن صيام يومين: يوم الفطر ويوم الأضحى", en: "Muwatta 1103", es: "Muwatta 1103", fr: "Muwatta 1103", ur: "موطا 1103", tr: "El-Muvatta 1103 — Muhammed ibn Yahya ibn Hibban, El-A'raj'dan, o da Ebu Hurayra'dan rivayet ettiğine göre: Allah Resulü iki günde oruç tutmayı yasaklamıştır: Ramazan Bayramı ve Kurban Bayramı.", id: "Al-Muwatta 1103 — Muhammad ibn Yahya ibn Hibban, berdasarkan riwayat Al-A'raj, berdasarkan riwayat Abu Hurayrah: bahwa Rasulullah SAW melarang berpuasa pada dua hari: hari raya Idul Fitri dan hari raya Idul Adha" }
summary:
  ar: "يرويه مالك عن محمد بن يحيى بن حبان عن الأعرج عن أبي هريرة، أن رسول الله نهى عن صيام يومين: يوم الفطر ويوم الأضحى. ويذكر المحقق أنه تقدم تخريجه في كتاب الصيام، الحديث 825. {cite:muwatta-maruf-1997 p.505}"
  tr: "Malik, Muhammed ibn Yahya ibn Hibban'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü iki günde oruç tutmayı yasaklamıştır: Ramazan Bayramı ve Kurban Bayramı. Editör, kaynağının daha önce Oruç Kitabı'nda, Hadis 825'te zikredildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.505}"
  id: "Diriwayatkan oleh Malik dari Muhammad ibn Yahya ibn Hibban, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW melarang berpuasa pada dua hari: hari raya Idul Fitri dan hari raya Idul Adha. Editor menyebutkan bahwa sumbernya sebelumnya telah dikutip dalam Kitab Puasa, Hadits 825. {cite:muwatta-maruf-1997 p.505}"
