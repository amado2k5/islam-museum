label: { ar: "الموطأ 2580 — مالك: القسامة تصير إلى عصبة المقتول وهم ولاة الدم", en: "Muwatta 2580", es: "Muwatta 2580", fr: "Muwatta 2580", ur: "موطا 2580", tr: "El-Muvatta 2580 — Malik: Arınma yemini, öldürülen kişinin erkek akrabalarına, yani kanın koruyucularına edilir.", id: "Al-Muwatta 2580 — Malik: Sumpah penyucian ditujukan kepada kerabat laki-laki dari orang yang dibunuh, yang merupakan penjaga darah." }
summary:
  ar: "قال: والقسامة تصير إلى عصبة المقتول، وهم ولاة الدم الذين يقسمون عليه، والذين يُقتل بقسامتهم. {cite:muwatta-maruf-1997 p.455}"
  tr: "Şöyle dedi: Yemin, öldürülen kişinin erkek akrabalarına, yani kan bağının koruyucularına edilir; onlar yemin ederler ve yeminleri yüzünden öldürülürler. {cite:muwatta-maruf-1997 s.455}"
  id: "Dia berkata: Sumpah itu ditujukan kepada kerabat laki-laki dari orang yang dibunuh, yang merupakan penjaga darah yang bersumpah untuk itu, dan yang terbunuh oleh sumpah mereka. {cite:muwatta-maruf-1997 p.455}"
