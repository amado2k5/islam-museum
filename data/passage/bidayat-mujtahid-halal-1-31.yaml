text: "… قال المواق: قال الباجي: في كراهة أكل الحمر الأهلية، وحرمتها روايتان. التاج والإكليل. قال ابن عبد البر: لا يحل أكل الحمار الأهلي، ولا تعمل الذكاة فيه للحمه ولا لجلده، ولا بدَّ لمن أراد تطهير جلده من دباغه. الكافي، الفواكه الدوانِي. …"
