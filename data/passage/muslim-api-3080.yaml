label: { ar: "صحيح مسلم 3080 — ما أُحل، ما لا يحل", en: "Sahih Muslim 3080 — what was made lawful; what is not lawful", ur: "صحیح مسلم 3080 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih Muslim 3080 — lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih Muslim 3080 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih Muslim 3080 — Neler caizdir, neler caiz değildir", id: "Sahih Muslim 3080 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… تَقُولُ لَكَانَ فَلاَ جُنَاحَ عَلَيْهِ أَنْ لاَ يَطَّوَّفَ بِهِمَا. إِنَّمَا أُنْزِلَ هَذَا فِي أُنَاسٍ مِنَ الأَنْصَارِ كَانُوا إِذَا أَهَلُّوا أَهَلُّوا لِمَنَاةَ فِي الْجَاهِلِيَّةِ فَلاَ يَحِلُّ لَهُمْ أَنْ يَطَّوَّفُوا بَيْنَ الصَّفَا وَالْمَرْوَةِ فَلَمَّا قَدِمُوا مَعَ النَّبِيِّ لِلْحَجِّ ذَكَرُوا ذَلِكَ لَهُ فَأَنْزَلَ اللَّهُ تَعَالَى هَذِهِ الآيَةَ فَلَعَمْرِي مَا أَتَمَّ اللَّهُ حَجَّ مَنْ لَمْ يَطُفْ بَيْنَ الصَّفَا وَالْمَرْوَةِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3080، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3080 (The Book of Pilgrimage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3080، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 3080 (El Libro de la Peregrinación), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3080 (Le Livre du Pèlerinage), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Sahih Müslim'de 3080 numaralı hadis, helal ve haram olanı belirtir. Bu helal ve haram rehberi, bu hadisi Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3080, menyebutkan apa yang diperbolehkan dan apa yang tidak. Panduan halal dan haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
