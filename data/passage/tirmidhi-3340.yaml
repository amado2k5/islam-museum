ref: "3340"
label:
  ar: "الترمذي 3340 — نبي أعجب بأمته فخير بين ثلاث"
  en: "Tirmidhi 3340 — A prophet impressed by his people was given a choice of three"
  ur: "ترمذی 3340 — ایک نبی جو اپنی امت پر نازاں ہوا اسے تین میں اختیار دیا گیا"
  es: "Tirmidhi 3340 — A un profeta impresionado por su pueblo se le dio a elegir entre tres"
  fr: "Tirmidhi 3340 — Un prophète, impressionné par son peuple, se vit offrir le choix entre trois options."
  tr: "Tirmizi 3340 — Bir peygamber, ümmetinden çok etkilendi ve kendisine üç seçenek sunuldu."
  id: "Tirmidzi 3340 — Seorang nabi terkesan oleh umatnya dan diberi pilihan antara tiga"
text: "إن نبيا من الأنبياء كان أعجب بأمته فقال من يقول لهؤلاء فأوحى الله إليه أن خيرهم بين أن أنتقم منهم وبين أن أسلط عليهم عدوهم فاختار النقمة فسلط عليهم الموت فمات منهم في يوم سبعون ألفا . قال وكان إذا …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3340: نبي أعجب بأمته فخير بين ثلاث. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3340: A prophet impressed by his people was given a choice of three. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3340: ایک نبی جو اپنی امت پر نازاں ہوا اسے تین میں اختیار دیا گیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 3340: Un profeta impresionado por su pueblo tuvo que elegir entre tres opciones. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 3340: Un prophète, impressionné par son peuple, se vit offrir trois choix. Le Prophète relate ce fait d’après son Seigneur; le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  tr: "Cami' el-Tirmizi'de 3340 numaralı hadis-i kudsi şöyledir: Bir peygamber, ümmetinden etkilenmiş ve kendisine üç şey arasında seçim yapma şansı verilmiştir. Peygamber bunu Rabbinden rivayet etmiştir ve hadis-i kudsi derleyicisi bu rivayetleri altı şeriat hadis külliyatında ve el-Muvatta'da toplamıştır."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 3340: Seorang Nabi terkesan oleh umatnya dan diberi pilihan antara tiga hal. Nabi meriwayatkannya atas otoritas Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
