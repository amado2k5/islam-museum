text: "… بكر قال: حدثنا غُنْدر عن شعبة قال: سألت حماداً عن العمرة واجبة هي؟ قال: قد أُختلف فيها. - حدثنا أبو بكر قال: حدثنا وكيع قال: حدثنا سفيان عن مُغيرة عن إبراهيم قال: العمرة سُنَّة، وليست بفريضة. - حدثنا أبو بكر …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 3322، يرد فيه ذكر الفريضة والفرائض، والواجب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 3322, whose wording mentions the obligation (farida), the obligatory (wajib), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 3322 کا اقتباس جس میں فریضہ اور فرائض، واجب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
