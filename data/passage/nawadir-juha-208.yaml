text: "… وأنتِ محقَّةٌ أيضاً كان لأحد أحبابه قضية عنده، فحضر إلى دار جحا، وسَرَدَ له دعواه، وقال له: ألست محِقّاً في هذه الدعوى؟ فقال: أجل أنت محقَّ يا أخي. وجاء خصمه في اليوم الثاني ولم يكن يعلم بما فعل الأولُ، فعرض …"
summary:
  ar: "حكى صديق لجحا قضيته فقال له جحا إنه محق، ثم قال خصمه الكلام نفسه فرد عليه بالمثل، فنبهته زوجته إلى أن الاثنين لا يمكن أن يكونا محقين، فقال لها: وأنت محقة أيضاً يا عزيزتي. {cite:juha-nawadir-kubra-djuwaydi p. 94}"
  en: "A friend tells Juha his case and Juha says he is right. The opponent later says the same and Juha answers him likewise. Juha's wife points out that both cannot be right, and Juha says, 'You too are right, my dear.' {cite:juha-nawadir-kubra-djuwaydi p. 94}"
  ur: "ایک دوست جحا کو اپنا مقدمہ سناتا ہے تو جحا کہتا ہے کہ وہ حق پر ہے۔ بعد میں اس کا مخالف بھی یہی کہتا ہے تو جحا اسے بھی یہی جواب دیتا ہے۔ جحا کی بیوی کہتی ہے کہ دونوں حق پر نہیں ہو سکتے، تو جحا کہتا ہے: تم بھی ٹھیک کہتی ہو، میری پیاری۔ {cite:juha-nawadir-kubra-djuwaydi p. 94}"
  fr: "Un ami expose son affaire à Juha, qui lui dit qu'il a raison. L'adversaire dit ensuite la même chose et Juha lui répond de même. La femme de Juha fait remarquer que les deux ne peuvent avoir raison, et Juha dit : « Toi aussi, tu as raison, ma chère. » {cite:juha-nawadir-kubra-djuwaydi p. 94}"
  es: "Un amigo cuenta su caso a Juha y este le dice que tiene razón. El adversario dice después lo mismo y Juha le responde igual. La esposa de Juha señala que los dos no pueden tener razón, y Juha dice: «Tú también tienes razón, querida». {cite:juha-nawadir-kubra-djuwaydi p. 94}"
