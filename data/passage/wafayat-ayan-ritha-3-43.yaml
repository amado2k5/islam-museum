  tr: "\"Vafayat al-A'yan wa Anba' Abna' al-Zaman\" (Önemli Şahsiyetlerin Ölümleri ve Çağın İnsanlarından Haberler) adlı resimli cilt 3'ün 43. sayfasından, felaket karşısında taziye, şefkat ve sabır içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Kematian Tokoh-Tokoh Terkemuka dan Berita tentang Orang-orang di Zaman Ini), Jilid Bergambar 3, hlm. 43, berisi ucapan belasungkawa, simpati, dan kesabaran dalam menghadapi musibah; diambil dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
