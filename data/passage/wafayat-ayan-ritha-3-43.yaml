text: "… والاقلام فأملى على سم غير الدواب فقال القاضى أبو محمد عبد الله التنوخ أحن اللّٰه عزاء كم فى الشيخ فانه ميت فمات وقد أشار فى البيت الأول الى ما كان يعتقده ويتدين به من عدم الذبح كما تقدم ذكره وقبره …"
summary:
  ar: "مقطع من وفيات الأعيان وأنباء أبناء الزمان، المجلد المصوَّر 3، ص 43، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
