text: "… فيكون سكوته عبادة وكلامه عبادة. ومهما اعتادت العين رمى البصر إلى كل شىء جميل لم تتحفظ عن النظر إلى مالا يحل، وكذلك سائر الشهوات، لان الذى يشتهى به الحلال هو بعينه الذى يشتهى الحرام، فالشهوة واحدة وقد وجب على العبد …"
