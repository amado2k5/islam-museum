text: "… قالوا: ولم تطَّرد هذه الولاية إلاّ في علي، ولهذا قال له عمر: أَصْبَحتَ مولى كل مؤمن ومؤمنةٍ. ومنها قوله: أَقْضَاكُمْ عَلِيٌّ. ولا معنى للإمامة إلا القضاء بأحكام الله، وهو المرادُ بأولي الأمر الواجبةِ طاعتهم بقوله: أَطِيْعُوا الله وأطِبْعُوا الْرَّسولَ وَأُوْلِي …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 3، ص 373، يرد فيه ذكر من أطاع الله ورسوله، والواجب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 3, p. 373, whose wording mentions whoever obeys God and His Messenger, the obligatory (wajib), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 3، ص 373 کا اقتباس جس میں جس نے اللہ اور اس کے رسول کی اطاعت کی، واجب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Muqaddima de Ibn Khaldun, volume numérisé 3, p. 373, dont le texte mentionne celui qui obéit à Dieu et à Son Messager, l'obligatoire (wajib), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
