  tr: "İbn Haldun'un Mukaddime adlı eserinin 3. cildinin 373. sayfasından, Allah'a ve Resulüne itaat edenleri ve farz olan ve tavsiye edilen itaat amellerini anlatan bir bölüm. Bu bölüm, makineyle okunabilir baskıdan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Muqaddimah karya Ibnu Khaldun, Jilid 3, halaman 373, yang menyebutkan orang-orang yang taat kepada Allah dan Rasul-Nya, serta amalan ketaatan yang wajib dan dianjurkan. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
