text: "… الرَّزَّاقِ عَنْ مَعْمَرٍ، عَنْ قَتادَةَ قَالَ: مَا فِي القُرْآنِ آيَةٌ إلَّا وَقَدْ سَمِعْتُ فِيهَا بِشَيْءٍ. حَدَّثَنَا ابْنُ أَبِي عُمَرَ : حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ عَنِ الأَعْمَشِ قَالَ : قَالَ مُجاهِدٌ لَوْ كُنْتُ قَرَأْتُ قِرَاءَةَ ابْنِ مَسْعُودٍ لَمْ أَحْتَجْ إِلَى أَنْ …"
