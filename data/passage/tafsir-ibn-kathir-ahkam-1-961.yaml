text: "… فَتُذَكِّرُ حَمْزَةُ وَوَافَقَهُ الْأَعْمَشُ، وَقَرَأَ فَتُذَكِّرَ نَافِعُ وَابْنُ عَامِرٍ وَعَاصِمُ وَالْكِسَائِيُّ وَأَبُو جَعْفَرٍ وَخَلَفٌ فِي اخْتِيَارِه، وَقَرَأَ الْبَاقُونَ فَتُذْكِرَ. فرض الكفاية: هو الذي إذا قام به من يكفي سقط عن الباقين، وفرض العين: ما أوجبه اللّٰه علىٰ كل واحد، ولا …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 961، يرد فيه ذكر الفرض، وفرض العين، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 961, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out, what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 961 کا اقتباس جس میں فرض، فرضِ عین، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tafsir de Ibn Kathir, volume numérisé 1, p. 961, dont le texte mentionne l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent, ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tafsir de Ibn Kathir, volumen digitalizado 1, p. 961, cuyo texto menciona lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen, lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 961. sayfasından bir alıntı, farz olan fiilleri, bireysel yükümlülükleri, toplumsal yükümlülükleri ve bu fiillerin başkaları tarafından yerine getirilmesi durumunda sorumlu kişiden beklenenleri ele almaktadır. Bu alıntı, makine tarafından okunabilir bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Tafsir Ibn Kathir, Jilid 1, halaman 961, membahas tentang amalan wajib, kewajiban individu, kewajiban kolektif, dan apa yang dituntut dari individu yang bertanggung jawab jika dilakukan oleh sebagian orang. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
