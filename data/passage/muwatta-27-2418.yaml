label: { ar: "الموطأ 2418 — عبد الرحمن بن القاسم: الأقطع اليمني وعقد أسماء بنت عميس", en: "Muwatta 2418", es: "Muwatta 2418", fr: "Muwatta 2418", ur: "موطا 2418", tr: "Al-Muwatta 2418 - Abd al-Rahman ibn al-Qasim: Al-Aqta' al-Yamani ve Esma' bint 'Umays'ın sözleşmesi", id: "Al-Muwatta 2418 — Abd al-Rahman ibn al-Qasim: Al-Aqta’ al-Yamani dan kontrak Asma’ binti ‘Umays" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أن رجلا من أهل اليمن أقطع اليد والرجل قدم فنزل على أبي بكر الصديق، فشكا إليه أن عامل اليمن ظلمه. فكان يصلي من الليل، فيقول أبو بكر: وأبيك، ما ليلك بليل سارق. ثم فقدوا عقدا لأسماء بنت عميس امرأة أبي بكر، فجعل الرجل يطوف معهم ويقول: اللهم عليك بمن بيّت أهل هذا البيت الصالح. فوجدوا الحلي عند صائغ زعم أن الأقطع جاءه به، فاعترف الأقطع أو شُهد عليه، فأمر أبو بكر بقطع يده اليسرى، وقال: والله لدعاؤه على نفسه أشد عندي عليه من سرقته. {cite:muwatta-maruf-1997 p.399}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, o da babasından rivayet ettiğine göre, Yemen'den bir eli ve bir ayağı eksik bir adam gelip Ebu Bekir el-Siddik'in yanında kaldı. Yemen valisinin kendisine haksızlık ettiğinden şikayet etti. Geceleri namaz kılardı ve Ebu Bekir, \"Baban adına yemin ederim ki, senin gecen hırsızın gecesi değildir\" derdi. Sonra Ebu Bekir'in karısı Esma bint Ümeys'e ait bir kolyeyi kaybettiler. Adam onlarla birlikte dolaşmaya başladı ve \"Ey Allah'ım, bu salih ailenin ailesine saldıran herkesi cezalandır\" diyordu. Mücevheri bir kuyumcuda buldular ve kuyumcu, kayıp adamın ona verdiğini iddia etti. Kayıp adam itiraf etti veya aleyhine şahitlik edildi, bunun üzerine Ebu Bekir, \"Allah'a yemin ederim ki, kendi aleyhine ettiği dua, benim gözümde hırsızlığından daha şiddetlidir\" diyerek sol elinin kesilmesini emretti."
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, dari ayahnya, bahwa seorang pria dari Yaman, yang kehilangan satu tangan dan satu kaki, datang dan tinggal bersama Abu Bakr al-Siddiq. Ia mengadu kepadanya bahwa gubernur Yaman telah berbuat zalim kepadanya. Ia biasa shalat di malam hari, dan Abu Bakr berkata, \"Demi ayahmu, malammu bukanlah malam seorang pencuri.\" Kemudian mereka kehilangan kalung milik Asma bint Umays, istri Abu Bakr. Pria itu mulai berjalan-jalan bersama mereka, sambil berkata, \"Ya Allah, hukum siapa pun yang menyerang keluarga saleh ini.\" Mereka menemukan perhiasan itu di tangan seorang tukang emas yang mengaku bahwa pria yang hilang itu telah memberikannya kepadanya. Pria yang hilang itu mengaku, atau menjadi saksi yang memberatkan dirinya, sehingga Abu Bakr memerintahkan agar tangan kirinya dipotong, seraya berkata, \"Demi Allah, doanya yang merugikan dirinya sendiri lebih berat di mataku daripada pencuriannya.\""
