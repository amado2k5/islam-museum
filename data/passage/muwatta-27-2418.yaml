label: { ar: "الموطأ 2418 — عبد الرحمن بن القاسم: الأقطع اليمني وعقد أسماء بنت عميس", en: "Muwatta 2418" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أن رجلا من أهل اليمن أقطع اليد والرجل قدم فنزل على أبي بكر الصديق، فشكا إليه أن عامل اليمن ظلمه. فكان يصلي من الليل، فيقول أبو بكر: وأبيك، ما ليلك بليل سارق. ثم فقدوا عقدا لأسماء بنت عميس امرأة أبي بكر، فجعل الرجل يطوف معهم ويقول: اللهم عليك بمن بيّت أهل هذا البيت الصالح. فوجدوا الحلي عند صائغ زعم أن الأقطع جاءه به، فاعترف الأقطع أو شُهد عليه، فأمر أبو بكر بقطع يده اليسرى، وقال: والله لدعاؤه على نفسه أشد عندي عليه من سرقته. {cite:muwatta-maruf-1997 p.399}"
