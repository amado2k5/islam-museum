label: { ar: "صحيح البخاري 4461 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 4461 — what was left behind: estate and inheritance", ur: "صحیح بخاری 4461 — ترکہ اور میراث" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَمْرِو بْنِ الْحَارِثِ، قَالَ مَا تَرَكَ رَسُولُ اللَّهِ دِينَارًا وَلاَ دِرْهَمًا وَلاَ عَبْدًا وَلاَ أَمَةً، إِلاَّ بَغْلَتَهُ الْبَيْضَاءَ الَّتِي كَانَ يَرْكَبُهَا، وَسِلاَحَهُ، وَأَرْضًا جَعَلَهَا لاِبْنِ السَّبِيلِ صَدَقَةً."
summary:
  ar: "حديث في صحيح البخاري، رقم 4461، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4461 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4461، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
