text: "‏ \"‏ قَاتَلَ اللَّهُ الْيَهُودَ، لَمَّا حَرَّمَ اللَّهُ عَلَيْهِمْ شُحُومَهَا جَمَلُوهُ ثُمَّ بَاعُوهُ فَأَكَلُوهَا ‏\"‏‏.‏ وَقَالَ أَبُو عَاصِمٍ حَدَّثَنَا عَبْدُ الْحَمِيدِ، حَدَّثَنَا يَزِيدُ، كَتَبَ إِلَىَّ عَطَاءٌ سَمِعْتُ جَابِرًا، عَنِ النَّبِيِّ صلى الله عليه وسلم‏.‏"
summary:
  ar: "في صحيح البخاري؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sahih al-Bukhari; sending a letter or message to a party."
  ur: "صحیح بخاری میں؛ کسی فریق کو خط یا پیغام بھیجنا."
