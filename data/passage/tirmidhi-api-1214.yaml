label: { ar: "جامع الترمذي 1214 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 1214 — what was left behind: estate and inheritance", ur: "جامع ترمذی 1214 — ترکہ اور میراث", es: "Jami' al-Tirmidhi 1214 — lo que quedó: patrimonio y herencia" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، وَعُثْمَانُ بْنُ عُمَرَ، عَنْ هِشَامِ بْنِ حَسَّانَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ تُوُفِّيَ النَّبِيُّ وَدِرْعُهُ مَرْهُونَةٌ بِعِشْرِينَ صَاعًا مِنْ طَعَامٍ أَخَذَهُ لأَهْلِهِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1214، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1214 (The Book on Business), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1214، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1214 (El Libro de los Negocios), menciona lo que quedó: bienes y herencias. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
