label: { ar: "الموطأ 753 — كتاب عمر بن عبد العزيز إلى أبي بكر بن حزم وهو بمنى: أن لا يأخذ من العسل ولا من الخيل صدقة", en: "Muwatta 753", es: "Muwatta 753", fr: "Muwatta 753", ur: "موطا 753", tr: "El-Muvatta 753 — Ömer ibn Abdülaziz'in Mina'dayken Ebu Bekir ibn Hazm'a yazdığı mektup: Baldan veya atlardan zekât almaması gerektiği konusunda uyarıda bulunmuştur.", id: "Al-Muwatta 753 — Surat dari Umar ibn Abd al-Aziz kepada Abu Bakr ibn Hazm ketika beliau berada di Mina: bahwa beliau tidak boleh mengambil zakat dari madu atau kuda." }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم، أنه قال: جاء كتاب من عمر بن عبد العزيز إلى أبي وهو بمنى أن لا يأخذ من العسل ولا من الخيل صدقة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (337) ويحيى بن بكير عند البيهقي (4/119). {cite:muwatta-maruf-1997 p.373}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan rivayet ederek şöyle demiştir: \"Ömer ibn Abdülaziz'den babama Mina'dayken bir mektup geldi ve ona bal ve atlardan zekât almaması talimatı verildi.\" Editör, bunun Malik'ten Ebu Musab, Muhammed ibn el-Hasan el-Şeybani (337) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki (4/119) tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.373}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, yang berkata: Sebuah surat datang dari Umar ibn Abd al-Aziz kepada ayahku ketika beliau berada di Mina, yang memerintahkannya untuk tidak mengambil zakat atas madu atau kuda. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Muhammad ibn al-Hasan al-Shaybani (337), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (4/119). {cite:muwatta-maruf-1997 p.373}"
