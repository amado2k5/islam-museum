label: { ar: "الموطأ 753 — كتاب عمر بن عبد العزيز إلى أبي بكر بن حزم وهو بمنى: أن لا يأخذ من العسل ولا من الخيل صدقة", en: "Muwatta 753" }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم، أنه قال: جاء كتاب من عمر بن عبد العزيز إلى أبي وهو بمنى أن لا يأخذ من العسل ولا من الخيل صدقة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (337) ويحيى بن بكير عند البيهقي (4/119). {cite:muwatta-maruf-1997 p.373}"
