label: { ar: "الموطأ 575 — ابن عمر في بني معاوية: الثلاث التي دعا بهن النبي في مسجدكم، أُعطي اثنتين ومُنع الثالثة", en: "Muwatta 575", es: "Muwatta 575", fr: "Muwatta 575", ur: "موطا 575", tr: "El-Muvatta 575 — İbn Ömer, Beni Muaviye hakkında: Peygamberin sizin mescidinizde dua ettiği üç şeyden ikisi kabul edildi, üçüncüsü ise edilmedi.", id: "Al-Muwatta 575 — Ibn Umar tentang Bani Muawiyah: Tiga hal yang didoakan Nabi di masjid kalian, dua dikabulkan dan yang ketiga tidak dikabulkan." }
text: "فلن يزال الهرج إلى يوم القيامة"
summary:
  ar: "يرويه مالك عن عبد الله بن عبد الله بن جابر بن عتيك، قال: جاءنا عبد الله بن عمر في بني معاوية، وهي قرية من قرى الأنصار، فسألني هل نعرف أين صلى النبي من مسجدنا، فأشرت له إلى ناحية منه، ثم سألني عن الثلاث التي دعا بهن فيه، فأخبرته: دعا بأن لا يُظهر عليهم عدواً من غيرهم، ولا يهلكهم بالسنين، فأُعطيهما، ودعا بأن لا يجعل بأسهم بينهم، فمُنعها. فقال: صدقت، ثم قال: فلن يزال الهرج إلى يوم القيامة. ويذكر المحقق نقلاً عن ابن عبد البر ⁦(التمهيد 19/195)⁩ أن رواة الموطأ اضطربوا في إسناده اضطراباً شديداً: فطائفة كيحيى وابن وهب وابن بكير ومعن لم تجعل بين عبد الله شيخ مالك وابن عمر أحداً، وطائفة أدخلت عتيك بن الحارث، وطائفة كالقعنبي والتنيسي ومطرف أدخلت جابر بن عتيك، وأن رواية يحيى أولى بالصواب عنده لمتابعة ابن وهب ومعن وأكثر الرواة، وأن البخاري وأبا حاتم صححا سماع عبد الله بن عبد الله من ابن عمر. ويضيف المحقق أنه رواه مثل رواية يحيى أبو مصعب (624) وإسحاق بن سليمان عند الحاكم (4/517)، ورواه بذكر جابر بن عتيك سويد والقعنبي وابن مهدي عند أحمد (5/445) والشافعي. {cite:muwatta-maruf-1997 p.296} {cite:muwatta-maruf-1997 p.297}"
  tr: "Malik, Abdullah ibn Abdullah ibn Cabir ibn Atik'ten rivayet etti ki, Abdullah ibn Ömer şöyle dedi: Abdullah ibn Ömer, Ensar'ın bir köyü olan Beni Muaviye'ye geldi ve mescidimizde Peygamber'in nerede namaz kıldığını bilip bilmediğimizi sordu. Ona mescidin bir köşesini gösterdim. Sonra bana orada üç şey için dua ettiğini sordu ve ben de ona şöyle dedim: Dışarıdan hiçbir düşmanın onlara üstün gelmemesi ve kıtlıkla helak olmamaları için dua etti ve ikisi de kabul edildi. Ayrıca güçlerinin birbirlerine karşı kullanılmaması için dua etti, ancak bu kabul edilmedi. O da: Doğru söyledin dedi. Sonra şöyle dedi: Kıyamet gününe kadar kaos olacaktır. Araştırmacı, İbn Abdülberr'in (el-Tamhid 19/195) el-Muvatta'nın rivayet zincirinde son derece karışıklık olduğunu söylediğini aktarıyor: Yahya, İbn Vahb, İbn Bukayr ve Ma'n gibi bir grup, Abdullah, Malik'in hocası ile İbn Ömer arasına kimseyi koymamıştır; başka bir grup Atik ibn el-Harith'i dahil etmiştir; ve el-Ka'nabi, el-Tunisi ve Mutarrif gibi bir başka grup ise Cabir ibn Atik'i dahil etmiştir. Araştırmacı, Yahya'nın rivayetinin İbn Vahb, Ma'n ve çoğu rivayetçi tarafından doğrulandığı için daha doğru olma olasılığının yüksek olduğunu düşünüyor. Ayrıca, el-Buhari ve Ebu Hatim'in Abdullah ibn Abdullah'ın İbn Ömer'den işittiğini doğruladığını belirtiyor. Araştırmacı, Ebu Mus'ab'ın (624) ve İshak ibn Süleyman'ın, Yahya'nın rivayetine benzer şekilde, el-Hakim'in derlemesinde (4/517) rivayet ettiğini ve Suveyd, el-Ka'nebi ve İbn Mehdi'nin ise Ahmed'in derlemesinde (5/445) ve el-Şafiî'nin derlemesinde Cabir ibn Atik'ten bahsederek rivayet ettiğini ekliyor."
  id: "Malik meriwayatkannya dari Abdullah ibn Abdullah ibn Jabir ibn Atik, yang berkata: Abdullah ibn Umar datang kepada kami di Bani Muawiyah, sebuah desa kaum Ansar, dan bertanya kepadaku apakah kami tahu di mana Nabi shalat di masjid kami. Aku menunjuk ke salah satu sudutnya untuknya. Kemudian dia bertanya kepadaku tentang tiga hal yang beliau doakan di sana, dan aku memberitahunya: Beliau berdoa agar tidak ada musuh dari luar yang akan mengalahkan mereka, dan agar mereka tidak binasa karena kelaparan, dan keduanya dikabulkan. Beliau juga berdoa agar kekuatan mereka tidak saling berlawan, tetapi ini ditolak. Dia berkata: Engkau telah mengatakan yang benar. Kemudian dia berkata: Akan ada kekacauan sampai Hari Kiamat. Peneliti mengutip Ibnu Abd al-Barr (al-Tamhid 19/195) yang mengatakan bahwa para perawi al-Muwatta' sangat bingung dalam rantai periwayatannya: satu kelompok, seperti Yahya, Ibnu Wahb, Ibnu Bukayur, dan Ma'n, tidak menempatkan siapa pun di antara Abdullah, guru Malik, dan Ibnu Umar; kelompok lain memasukkan Atik ibn al-Harith; dan kelompok lain lagi, seperti al-Qa'nabi, al-Tunisi, dan Mutarrif, memasukkan Jabir ibn Atik. Peneliti menganggap riwayat Yahya lebih mungkin benar karena didukung oleh Ibnu Wahb, Ma'n, dan sebagian besar perawi. Ia juga mencatat bahwa al-Bukhari dan Abu Hatim mengesahkan pendengaran Abdullah ibn Abdullah dari Ibnu Umar. Peneliti menambahkan bahwa Abu Mus'ab (624) dan Ishaq ibn Sulayman meriwayatkannya serupa dengan riwayat Yahya dalam koleksi al-Hakim (4/517), dan bahwa Suwayd, al-Qa'nabi, dan Ibn Mahdi meriwayatkannya dengan menyebutkan Jabir ibn Atik dalam koleksi Ahmad (5/445) dan koleksi al-Shafi'i."
