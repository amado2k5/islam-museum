label: { ar: "الموطأ 575 — ابن عمر في بني معاوية: الثلاث التي دعا بهن النبي في مسجدكم، أُعطي اثنتين ومُنع الثالثة", en: "Muwatta 575" }
text: "فلن يزال الهرج إلى يوم القيامة"
summary:
  ar: "يرويه مالك عن عبد الله بن عبد الله بن جابر بن عتيك، قال: جاءنا عبد الله بن عمر في بني معاوية، وهي قرية من قرى الأنصار، فسألني هل نعرف أين صلى النبي من مسجدنا، فأشرت له إلى ناحية منه، ثم سألني عن الثلاث التي دعا بهن فيه، فأخبرته: دعا بأن لا يُظهر عليهم عدواً من غيرهم، ولا يهلكهم بالسنين، فأُعطيهما، ودعا بأن لا يجعل بأسهم بينهم، فمُنعها. فقال: صدقت، ثم قال: فلن يزال الهرج إلى يوم القيامة. ويذكر المحقق نقلاً عن ابن عبد البر (التمهيد 19/195) أن رواة الموطأ اضطربوا في إسناده اضطراباً شديداً: فطائفة كيحيى وابن وهب وابن بكير ومعن لم تجعل بين عبد الله شيخ مالك وابن عمر أحداً، وطائفة أدخلت عتيك بن الحارث، وطائفة كالقعنبي والتنيسي ومطرف أدخلت جابر بن عتيك، وأن رواية يحيى أولى بالصواب عنده لمتابعة ابن وهب ومعن وأكثر الرواة، وأن البخاري وأبا حاتم صححا سماع عبد الله بن عبد الله من ابن عمر. ويضيف المحقق أنه رواه مثل رواية يحيى أبو مصعب (624) وإسحاق بن سليمان عند الحاكم (4/517)، ورواه بذكر جابر بن عتيك سويد والقعنبي وابن مهدي عند أحمد (5/445) والشافعي. {cite:muwatta-maruf-1997 p.296} {cite:muwatta-maruf-1997 p.297}"
