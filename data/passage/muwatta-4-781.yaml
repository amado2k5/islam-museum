label: { ar: "الموطأ 781 — ابن عمر: لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فاقدروا له", en: "Muwatta 781" }
text: "لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فاقدروا له"
summary:
  ar: "أول حديث في كتاب الصيام وفي باب رؤية الهلال للصائم والفطر في رمضان. يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي ذكر رمضان فقال: لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غُمّ عليكم فاقدروا له. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند البخاري (1906) وأبي داود وعبد الرحمن بن القاسم عند النسائي، وأن في بعض الروايات «عن نافع وعبد الله بن دينار» وأنه متفق عليه في الصحيحين من طرق عن ابن عمر. {cite:muwatta-maruf-1997 p.385} {cite:muwatta-maruf-1997 p.386}"
