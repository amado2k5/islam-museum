label: { ar: "الموطأ 781 — ابن عمر: لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فاقدروا له", en: "Muwatta 781", es: "Muwatta 781", fr: "Muwatta 781", ur: "موطا 781", tr: "El-Muvatta 781 — İbn Ömer: Hilali görene kadar oruç tutmayın ve onu görene kadar orucunuzu bozmayın. Eğer hilal sizden gizlenmişse, görünüşüne göre tahmin edin.", id: "Al-Muwatta 781 — Ibn Umar: Jangan berpuasa sampai kamu melihat bulan sabit, dan jangan berbuka puasa sampai kamu melihatnya. Jika bulan sabit terhalang dari pandanganmu, maka perkirakanlah penampakannya." }
text: "لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فاقدروا له"
summary:
  ar: "أول حديث في كتاب الصيام وفي باب رؤية الهلال للصائم والفطر في رمضان. يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي ذكر رمضان فقال: لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غُمّ عليكم فاقدروا له. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند البخاري (1906) وأبي داود وعبد الرحمن بن القاسم عند النسائي، وأن في بعض الروايات «عن نافع وعبد الله بن دينار» وأنه متفق عليه في الصحيحين من طرق عن ابن عمر. {cite:muwatta-maruf-1997 p.385} {cite:muwatta-maruf-1997 p.386}"
  tr: "Oruç Kitabı'ndaki ilk hadis, Ramazan ayında oruç tutan için hilalin görülmesi ve orucun bozulması bölümünde yer almaktadır. Malik'in Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Peygamberimiz Ramazan ayından bahsetmiş ve şöyle buyurmuştur: \"Hilal görünmedikçe oruç tutmayın ve hilal görünmedikçe orucunuzu bozmayın. Eğer hilal sizden gizlenmişse, görünüşüne göre değerlendirin.\" Editör, bu hadisin Buhari'de (1906) Ebu Mus'ab, Suwaid ve el-Ka'nabi tarafından Malik'ten, el-Nasa'i'de ise Ebu Davud ve Abdülrahman ibn el-Kâsim tarafından rivayet edildiğini belirtmektedir. Ayrıca bazı rivayetlerde \"Nafi' ve Abdullah ibn Dinar'dan\" nakledildiği ve İbn Umar'dan çeşitli rivayet zincirleriyle iki Sahih'te (Buhari ve Müslim) ittifakla kabul edildiği de belirtilmiştir. {cite:muwatta-maruf-1997 s.385} {cite:muwatta-maruf-1997 s.386}"
  id: "Hadits pertama dalam Kitab Puasa, dalam bab tentang melihat bulan sabit bagi orang yang berpuasa dan berbuka puasa di bulan Ramadhan. Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, bahwa Nabi menyebutkan bulan Ramadhan dan bersabda: “Jangan berpuasa sampai kalian melihat bulan sabit, dan jangan berbuka puasa sampai kalian melihatnya. Jika bulan sabit itu terhalang, maka perkirakanlah penampakannya.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, dan al-Qa’nabi dalam Bukhari (1906), Abu Dawud, dan Abd al-Rahman ibn al-Qasim dalam al-Nasa’i. Disebutkan juga bahwa dalam beberapa riwayat hadits ini diriwayatkan “dari Nafi’ dan Abdullah ibn Dinar,” dan bahwa hadits ini disepakati dalam dua kitab Sahih (Bukhari dan Muslim) melalui berbagai sanad dari Ibn Umar. {kutip:muwatta-maruf-1997 hal.385} {kutip:muwatta-maruf-1997 hal.386}"
