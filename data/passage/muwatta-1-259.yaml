label: { ar: "الموطأ 259 — خميصة أبي جهم: نظرت إلى علمها في الصلاة فكاد يفتنني", en: "Muwatta 259" }
text: "ردي هذه الخميصة إلى أبي جهم، فإني نظرت إلى علمها في الصلاة فكاد يفتنني"
summary:
  ar: "أول حديث في باب النظر في الصلاة إلى ما يشغلك عنها. يرويه يحيى عن مالك عن علقمة بن أبي علقمة عن أمه عن عائشة: أهدى أبو جهم بن حذيفة للنبي خميصة شامية لها أعلام، فصلى فيها، فلما انصرف أمر بردها إلى أبي جهم لأنه نظر إلى علمها في الصلاة فكاد يشغله. ويبين المحقق أن يحيى أسقط «عن أمه» من الإسناد ولم يتابعه أحد من الرواة، وأن الحديث صحيح متصل لمالك عن علقمة عن أمه عن عائشة كما قال ابن عبد البر (التمهيد 20/108)، ويخرّجه عند أحمد (6/177) والجوهري والبيهقي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.153}"
