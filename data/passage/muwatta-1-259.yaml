label: { ar: "الموطأ 259 — خميصة أبي جهم: نظرت إلى علمها في الصلاة فكاد يفتنني", en: "Muwatta 259", es: "Muwatta 259", fr: "Muwatta 259", ur: "موطا 259", tr: "El-Muvatta 259 — Hamisa Ebu Cahm: Namaz kılarken onun bilgisine baktım ve neredeyse beni de günaha sürükledi.", id: "Al-Muwatta 259 — Khamisa Abi Jahm: Aku memperhatikan ilmunya saat shalat dan itu hampir membuatku tergoda." }
text: "ردي هذه الخميصة إلى أبي جهم، فإني نظرت إلى علمها في الصلاة فكاد يفتنني"
summary:
  ar: "أول حديث في باب النظر في الصلاة إلى ما يشغلك عنها. يرويه يحيى عن مالك عن علقمة بن أبي علقمة عن أمه عن عائشة: أهدى أبو جهم بن حذيفة للنبي خميصة شامية لها أعلام، فصلى فيها، فلما انصرف أمر بردها إلى أبي جهم لأنه نظر إلى علمها في الصلاة فكاد يشغله. ويبين المحقق أن يحيى أسقط «عن أمه» من الإسناد ولم يتابعه أحد من الرواة، وأن الحديث صحيح متصل لمالك عن علقمة عن أمه عن عائشة كما قال ابن عبد البر ⁦(التمهيد 20/108)⁩، ويخرّجه عند أحمد (6/177) والجوهري والبيهقي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.153}"
  tr: "Namaz sırasında dikkati dağıtan şeylere bakmakla ilgili bölümdeki ilk hadis, Yahya'nın Malik'ten, o da Alkame ibn Ebu Alkame'den, o da annesinden, o da Aişe'den rivayet ettiği hadistir: Ebu Cehm ibn Hudeyfe, Peygamber'e üzerinde işaretler bulunan bir Suriye pelerini hediye etmiş ve Peygamber bu pelerinle namaz kılmıştır. Namazı bitirdiğinde, Ebu Cehm'e geri verilmesini emretmiştir çünkü Ebu Cehm namaz sırasında pelerinin üzerindeki işaretlere bakmış ve neredeyse dikkatini dağıtmıştır. Araştırmacı, Yahya'nın rivayet zincirinden \"annesinden\" ibaresini çıkardığını ve diğer ravilerin de bunu doğrulamadığını açıklığa kavuşturmaktadır. Hadis sahihtir ve İbn Abdül-Barr'ın belirttiği gibi (el-Temhid 20/108), Malik'ten, o da Alkame'den, o da annesinden, o da Aişe'den rivayetle nakledilmiştir. Bu rivayet, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla Ahmed (6/177), el-Cevhari ve el-Beyhaki'nin derlemelerinde de bulunmaktadır. {cite:muwatta-maruf-1997 s.153}"
  id: "Hadits pertama dalam bab tentang melihat hal-hal yang mengalihkan perhatian saat shalat. Diriwayatkan oleh Yahya dari Malik, dari Alqamah ibn Abi Alqamah, dari ibunya, dari Aisyah: Abu Jahm ibn Hudhaifa menghadiahkan Nabi sebuah jubah Suriah bercorak, dan beliau shalat mengenakannya. Setelah selesai, beliau memerintahkan agar jubah itu dikembalikan kepada Abu Jahm karena ia melihat corak jubah tersebut selama shalat dan hampir mengalihkan perhatiannya. Peneliti mengklarifikasi bahwa Yahya menghilangkan \"dari ibunya\" dari sanadnya, dan tidak ada perawi lain yang menguatkan hal ini. Hadits ini sahih dan terhubung melalui Malik, dari Alqamah, dari ibunya, dari Aisyah, sebagaimana dinyatakan oleh Ibnu Abd al-Barr (al-Tamhid 20/108). Hal ini juga ditemukan dalam koleksi Ahmad (6/177), al-Jawhari, dan al-Bayhaqi melalui sanad para sahabat Malik. {cite:muwatta-maruf-1997 p.153}"
