text: "… يأكل الميتة والدم و من خبره في ذلك انه خرج في الجاهلية بطلب الدين هو وورقة بن نوفل فلقيا اليهود فعرضت عليها يهود دينهم فتهودورقة ثم لقيا النصارى فمرضوا عليها دينهم فترك ورقة اليهودية وتنصروابى زيد بن عمروان ياتى شيئًا …"
