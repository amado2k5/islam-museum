text: "… العظيم، واجتهد أن يعرف كاتبها فلم يقدر على ذلك. ولما اعتل علة الوفاة آخر السنة المذكورة ركب إليه العزيز عائداً وقال له : وددت أنك تباع فأبتاعك بملكي أو تفدى فأفديك بولدي، فهل من حاجة توصي بها يا يعقوب ؟ …"
