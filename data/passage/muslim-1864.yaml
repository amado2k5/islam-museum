label: { ar: "مسلم 1864 — لا هجرة بعد الفتح ولكن جهاد ونية", en: "Muslim 1864 — No emigration after the conquest, but jihad and intention", es: "Musulmán 1864 — No hubo emigración después de la conquista, pero sí yihad e intención.", fr: "Muslim 1864 — Pas d'émigration après la conquête, mais le jihad et l'intention", ur: "مسلم 1864 - فتح کے بعد ہجرت نہیں بلکہ جہاد اور ارادہ ہے۔", tr: "1864 Müslüman — Fetih sonrası hicret yok, ama cihat ve niyet var.", id: "Muslim 1864 — Tidak ada migrasi setelah penaklukan, tetapi jihad dan niat." }
text: "سئل رسول الله عن الهجرة فقال: «لا هجرة بعد الفتح، ولكن جهاد ونية، وإذا استنفرتم فانفروا»"
summary:
  ar: "رواية عائشة في صحيح مسلم؛ سؤال الهجرة بعد فتح مكة والجواب بانقطاعها وبقاء الجهاد والنية — نص التحول الذي أحدثه الفتح في علاقة مكة بالمدينة."
  tr: "Sahih Müslim'deki Aişe'nin rivayeti; Mekke'nin fethinden sonra hicret meselesi ve bunun sona erdiği, cihat ve niyetin ise devam ettiği cevabı; fethin Mekke ile Medine arasındaki ilişkide meydana getirdiği dönüşümün metni."
  id: "Riwayat Aisyah dalam Sahih Muslim; pertanyaan tentang hijrah setelah penaklukan Mekah dan jawabannya bahwa hijrah telah berakhir dan jihad serta niat tetap ada — teks tentang transformasi yang dibawa oleh penaklukan tersebut dalam hubungan antara Mekah dan Madinah."
