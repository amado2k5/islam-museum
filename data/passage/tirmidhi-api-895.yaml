label: { ar: "جامع الترمذي 895 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 895 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 895 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 895 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 895 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا أَبُو خَالِدٍ الأَحْمَرُ، عَنِ الأَعْمَشِ، عَنِ الْحَكَمِ، عَنْ مِقْسَمٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ أَفَاضَ قَبْلَ طُلُوعِ الشَّمْسِ. قَالَ وَفِي الْبَابِ عَنْ عُمَرَ. قَالَ أَبُو عِيسَى حَدِيثُ ابْنِ عَبَّاسٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَإِنَّمَا كَانَ أَهْلُ الْجَاهِلِيَّةِ يَنْتَظِرُونَ حَتَّى تَطْلُعَ الشَّمْسُ ثُمَّ يُفِيضُونَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 895، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 895 (The Book on Hajj), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 895، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 895 (El Libro del Hajj), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 895 (Le Livre du Hajj), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
