label: { ar: "الموطأ 1636 — مالك: في المفتدية إذا علم أن زوجها أضر بها وضيق عليها وظلمها، مضى الطلاق ورد عليها مالها", en: "Muwatta 1636", es: "Muwatta 1636", fr: "Muwatta 1636", ur: "موطا 1636", tr: "El-Muvatta 1636 — Malik: Boşanma davası açan bir kadına gelince, eğer kocasının ona zarar verdiği, hayatını zorlaştırdığı ve haksızlık yaptığı biliniyorsa, boşanma geçerlidir ve parası kendisine iade edilir.", id: "Al-Muwatta 1636 — Malik: Mengenai seorang wanita yang telah menyerahkan diri untuk bercerai, jika diketahui bahwa suaminya telah menyakitinya, menyulitkannya, dan menganiayanya, maka perceraian itu sah dan hartanya dikembalikan kepadanya." }
summary:
  ar: "يقول مالك في المفتدية التي تفتدي من زوجها، إنه إذا علم أن زوجها أضر بها، وضيق عليها، وعلم أنه ظالم لها، مضى الطلاق، ورد عليها ماله. قال مالك فهذا الذي كنت أسمع، والذي عليه أمر الناس عندنا. {cite:muwatta-maruf-1997 p.75}"
  tr: "Malik, kocasından af dileyen bir kadın hakkında, eğer kocasının ona zarar verdiği, baskı uyguladığı ve adaletsiz davrandığı biliniyorsa, boşanmanın geçerli olduğunu ve kocasının parasını iade etmesi gerektiğini söylüyor. Malik, \"Bunu duydum ve bu bizim bölgemizdeki insanlar arasında yaygın bir uygulamadır\" dedi. {cite:muwatta-maruf-1997 s.75}"
  id: "Malik mengatakan mengenai seorang wanita yang mencari penebusan dari suaminya bahwa jika diketahui bahwa suaminya telah menyakitinya, menindasnya, dan berbuat tidak adil kepadanya, maka perceraian itu sah, dan suaminya harus mengembalikan uangnya. Malik berkata, \"Inilah yang telah saya dengar, dan inilah praktik di kalangan masyarakat di wilayah kami.\" {cite:muwatta-maruf-1997 p.75}"
