summary:
  ar: "يقول مالك في المفتدية التي تفتدي من زوجها، إنه إذا علم أن زوجها أضر بها، وضيق عليها، وعلم أنه ظالم لها، مضى الطلاق، ورد عليها ماله. قال مالك فهذا الذي كنت أسمع، والذي عليه أمر الناس عندنا. {cite:muwatta-maruf-1997 p.75}"
