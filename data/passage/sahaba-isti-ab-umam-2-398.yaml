text: "… من أشراف قريش في الجاهلية، أسلم يوم الفتح، وكان من أحسن قريش وجهاً، وهو الهيثم بن ظَفَر الأَنصارِيّ الظَّفَري : شهد أُحُداً. - عبد اللّٰه بن ربيعةَ بن الأغفل الَّذي بعثته قريش مع عمرو بن العاصِ إلى النجاشي في مطالبة …"
summary:
