text: "… عَامِرٍ الْحَرُورِيُّ إِلَى ابْنِ عَبَّاسٍ يَسْأَلُهُ عَنِ الْعَبْدِ، وَالْمَرْأَةِ يَحْضُرَانِ الْمَغْنَمَ هَلْ يُقْسَمُ لَهُمَا وَعَنْ قَتْلِ الْوِلْدَانِ وَعَنِ الْيَتِيمِ مَتَى يَنْقَطِعُ عَنْهُ الْيُتْمُ وَعَنْ ذَوِي الْقُرْبَى مَنْ هُمْ فَقَالَ لِيَزِيدَ اكْتُبْ إِلَيْهِ فَلَوْلاَ أَنْ يَقَعَ فِي أُحْمُوقَةٍ مَا كَتَبْتُ إِلَيْهِ اكْتُبْ إِنَّكَ كَتَبْتَ تَسْأَلُنِي عَنِ الْمَرْأَةِ وَالْعَبْدِ يَحْضُرَانِ الْمَغْنَمَ هَلْ يُقْسَمُ لَهُمَا شَىْءٌ وَإِنَّهُ لَيْسَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4686، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4686 (The Book of Jihad and Expeditions), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4686، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
