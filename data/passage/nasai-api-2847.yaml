label: { ar: "سنن النسائي 2847 — الحجامة", en: "Sunan al-Nasa'i 2847 — cupping", ur: "سنن نسائی 2847 — حجامہ" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ مَنْصُورٍ، عَنْ سُفْيَانَ، قَالَ أَنْبَأَنَا عَمْرُو بْنُ دِينَارٍ، قَالَ سَمِعْتُ عَطَاءً، قَالَ سَمِعْتُ ابْنَ عَبَّاسٍ، يَقُولُ احْتَجَمَ النَّبِيُّ وَهُوَ مُحْرِمٌ. ثُمَّ قَالَ بَعْدُ أَخْبَرَنِي طَاوُسٌ عَنِ ابْنِ عَبَّاسٍ يَقُولُ احْتَجَمَ النَّبِيُّ وَهُوَ مُحْرِمٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 2847، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 2847 (The Book of Hajj), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 2847، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
