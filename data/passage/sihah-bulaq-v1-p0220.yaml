  الصبان فى بعض حواشيه
  أومذهب جدد على ألواحه * ألناطق المبروز والمختوم..
  الناطق بقطع الالف وان كان وصلا وذلك جائز فى ابتسداء الانصاف لان التقدير الوقف على
  بالابيات المصبرعة وتظاير ماهنا
  النصف من الصدر ١ أنكر أبوحاتم المبروز وقال لعله المزبور وهو المكتوب وقال لبيد
  ول السلم
