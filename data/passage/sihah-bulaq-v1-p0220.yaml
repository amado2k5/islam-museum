text: |-
  ٤٢١
  وأنا الى الحاء أميل يقول سقيته علالة من عدوفرص صباحا يعنى أنه أغار عليه وقت الصبح
  فجعل ذلك صبوحاله ⁦( رز)⁩ الارزحب وفيه ست أغات أرزوا رزتتبع الضمة الضمة
  وأرزوأرزمثل رسل ورسل ورزور نزوهى اعبد القيس أبوعر والارزة بالتحريك شهجر الارزن
  وقال أبو عبيد الارزة بالتسكين شجر الصنوبر والجمع أرزوشجرة آرزة أى ثابتسة فى الارض
  وقد أرزت اارأة تأرزويال للناقة القوية آرزة أيضا قال زهير
  با رزة الفقارة لم يخنها • قطاف فى الركاب ولاخلاء
  أبوزيد الليلة الآرزة هى الباردة جكاها عنه أبو عبيد وأرزفلان يأرز أرزاوأروزا اذاتضام
  وتقبض من بخله فهوأروزقال رؤية فذاك بخال أروز الارز وقد أضافه الى المصدر
  كما يقال عمر العدل وعمر والدها لما كان العسدل والدها. أغلب أجواله ماوقال أبو الاسود
  الدوّلى ان فلانا اذاسئل أرز واذادى اهتزيعنى الى الطعام وفى الحديث ان الاسلام
  قوله ان الاسلام الخ روايم
  ليأرز الى المدينة كما تأر زالحبة الى حجمرها أى ينضم البها و يجتمع بعضه الى بعض فيها و المأرز
  الجامع الصغيران الايمان الخ
  الملجأ ⁦(أزز )⁩ الازيزصوت الرعدوصوت غليان القدروقد أزت القدرتوزأزيزاغلت
  قاله نهر
  وفى الحسديث انه كان يصلى ولحوفه أزيزك أزيز المرحل من البكاء واتتزت القدر
  انتزازا اذا اشتد غليانها والازالتهبيج والاغراء قال تعالى انا أرسلنا الشياطين على
  المكافرين تؤزهم أزا أى تغر يهم على المعاصى والاز الاختلاط وقد أززت الشئ أوزه
  أزا اذاضمت بعضه على بعض ( إ وز الاوزة والاوزالبط وقد جعوه بالواو والنون
  نقالواإوزون
  صل البساء ز برزار ج-ل يبرزبروزاخرج وأبرزه غسيره والبراز المبارزة
  فى الحرب والبرازأيضا كتاية عن ثقسل الغذاء وهو الغائط والمبرز المتوضأ والبراز بالفتح
  الفضاء الواسع قال الفرّاء* والموضع الذى ليس به خرمن شجر ولاء-يره وتبرز الرجل أى
  نرج الى البراز للحاجسة وبرزت الشى تبر يراأى أظهرته ويننته وبرز الرجل أيضافاق على
  أصحابه وكذلك الغرس اذاسيق وامرأة برزة أى جليلة تبرزوتجلس للناس وقال بعضهم رجل
  كان عمرو بن لجأ معاصر الجرير
  برزوامر أة برزة يوصفان بالجهارة والعقل وقال انلخليسل رجل برزأى عفيف وأماقول جرير.
  وكان بينهمامهإ جاة ذكره محشى
  خسل الطريق لن يبن المنار به * وابرز ببرزة حيث اضطرك القدر
  فهواسم أم عمروبن لمأ التيممى وكتاب مبروز أى منشورعلى غيرقياس قال لبيد
  القاموس فى 1مأ
