text: "… شعيب حدثنا أبو اسحاق بن حزة قال ثنا عبد العقار بن الحكم قال ثنا سوار بن مصعب عن ليث وخلف بن حوشب ومجاهد عن مائشة. قالت قال رسول اللّٰه : إن الربا بضع وسبعون بابا، أصغرها كالواقع على أمه، والدرهم …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 5، ص 74، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 5, p. 74, that mentions faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 5، ص 74 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 5, pág. 74, que menciona la fe como setenta y tantos brazos; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym (tome 5, p. 74) mentionne la foi comme étant divisée en une soixantaine de branches; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 5. resimli cildinin 74. sayfasından bir alıntı, yetmişten fazla inanç dalından bahsetmektedir; makine tarafından okunabilir taranmış baskıdan, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 5, halaman 74, menyebutkan lebih dari tujuh puluh cabang iman; dari edisi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
