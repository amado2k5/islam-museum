text: "… لم نر قدماً أشبه بالقدم التي في المقام منه. فقال عبد المطلب لأبي طالب: اسمع ما يقول هؤلاء، فكان أبو طالب يحتفظ به. فلما حضرت عبد المطلب الوفاة أوصى أبا طالب بحفظه. ومات عبد المطلب فدفن بالحجون، وهو ابن ائنتين …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 39، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 39, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 39 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 4, pág. 39, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 4, p. 39) mentionnant un testament ou des adieux, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 4. cildinin 39. sayfasından bir alıntı, vasiyetname veya son miras, ölüm saati, defin, mezar ve istirahat yerinden bahsetmektedir; bu alıntı, makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetnameler, Miraslar, Antikalar ve İstirahat Yerleri\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 4, halaman 39, menyebutkan wasiat atau surat wasiat terakhir, saat kematian, pemakaman, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Peristirahatan\"."
