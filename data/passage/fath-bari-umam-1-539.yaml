text: "… البيت قال : فمر عليه الدهر فانهدم، فبنته العمالقة، فمر عليه الدهر فانهدم، فبنته جرهم، فمر عليه الدهر فانهدم، فبنته قريش، ورسول اللّٰه ول في يو مئذ شاب، فلما أرادوا أن يضعوا الحجر الأسود اختصموا فيه فقالوا : نحكم بيننا …"
