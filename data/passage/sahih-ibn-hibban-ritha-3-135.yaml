text: "… مُحَمَّدُ بنُ بكر، عَنِ الصلتِ بِنِ بهرامَ، حَدَّثَنَا الْحَسَنُ، حَدَّثَنَا جُنْدبٌ البَجَلِيّ، في هذا المسجد: أن حُذَيفة حدَّثه قَالَ : قَالَ رَسُوْلُ اللَّه وَلِ : إِن مَا أَتَخَوَّفُ عَلَيْكُمُ رَجُلٌ قَرَا القُرْآنَ حتَّى إذَا رُثِيَتْ بَهْجَتُهُ عَلَيْهِ وَكَان رِدْئاً للإِسْلاَمِ، …"
