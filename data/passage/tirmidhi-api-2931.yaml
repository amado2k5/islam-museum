label: { ar: "جامع الترمذي 2931 — كتاب القراءات، قراءات القرآن", en: "Jami' al-Tirmidhi 2931 — the Book of the Readings; the readings of the Qur'an", ur: "جامع ترمذی 2931 — کتاب القراءات، قرآن کی قراءتیں", es: "Jami' al-Tirmidhi 2931 — El Libro de las Lecturas; las lecturas del Corán" }
text: "… الْبُنَانِيِّ وَرُوِيَ هَذَا الْحَدِيثُ أَيْضًا عَنْ شَهْرِ بْنِ حَوْشَبٍ عَنْ أَسْمَاءَ بِنْتِ يَزِيدَ. وَسَمِعْتُ عَبْدَ بْنَ حُمَيْدٍ يَقُولُ أَسْمَاءُ بِنْتُ يَزِيدَ هِيَ أُمُّ سَلَمَةَ الأَنْصَارِيَّةُ. قَالَ أَبُو عِيسَى كِلاَ الْحَدِيثَيْنِ عِنْدِي وَاحِدٌ وَقَدْ رَوَى شَهْرُ بْنُ حَوْشَبٍ غَيْرَ حَدِيثٍ عَنْ أُمِّ سَلَمَةَ الأَنْصَارِيَّةِ وَهِيَ أَسْمَاءُ بِنْتُ يَزِيدَ وَقَدْ رُوِيَ عَنْ عَائِشَةَ عَنِ النَّبِيِّ نَحْوُ هَذَا."
summary:
  ar: "حديث في جامع الترمذي، رقم 2931، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 2931 (Chapters on Recitation), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 2931، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2931 (Capítulos sobre la recitación), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
