label:
  ar: "الترمذي 2526 — دعوة المظلوم: وعزتي لأنصرنك ولو بعد حين"
  en: "Tirmidhi 2526 — The prayer of the wronged: by My might I shall help you, even after a while"
  ur: "ترمذی 2526 — مظلوم کی دعا: میری عزت کی قسم، میں تیری مدد کروں گا اگرچہ کچھ دیر بعد"
text: "لو أنكم تكونون إذا خرجتم من عندي كنتم على حالكم ذلك لزارتكم الملائكة في بيوتكم ولو لم تذنبوا لجاء الله بخلق جديد كى يذنبوا فيغفر لهم . قال قلت يا رسول الله مم خلق الخلق قال من الماء . قلنا …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2526: دعوة المظلوم: وعزتي لأنصرنك ولو بعد حين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2526: The prayer of the wronged: by My might I shall help you, even after a while. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2526: مظلوم کی دعا: میری عزت کی قسم، میں تیری مدد کروں گا اگرچہ کچھ دیر بعد۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
