text: |-
  ٢٢٨
  (ياب الدالnn
  العاريق والرصدة بالضم الربية والرصدة بالفتح الدفعة من المطر والجمع رصادتق ول منه
  رصدت الارض فه حر صودة والرصد بالتحريك القليل من الكلا والمطر يقال بهارصد
  من حيا والجمع أرصاد عد ) الرعد الصوت الذى يسمع من السهاب يقال صلف
  تحت الراعدة للرجل يصكثر الكلام ولا خير عنده وبنوراعدة بطن من العرب ورءدت
  السماء وبرقت ورعدت المرأة وبرقت تحسنت وتزينت ورعد الرجل وبرق ته-قد
  وأوعد قال ابن أحر
  ياجل مابعدت عليك بلادنا • وطلابنا فابرق بأرضت وارعد
  وأرعسد القوم وأبرقوا أصابهسم رعد وبرق وحكى أبو عبيدة وأبو عمروأرعدت السما
  وأبرقت وأرعد الرجل وأبرق اذا تهددوأ وعد وأنكره الاصمعى" واحتج عليه ببيت الكميت
  أبرق وأرعديايز يدفاوعيدلدلى بضائر
  فقال ليس الكميت بحجة والارتعاد الاضطراب يقال أرعده فارتعد والاسم الرعدة
  وأرعد الرجل أخذته الرعدة وأرعدت فرائصه عند الفزع والرعديد الجبان والرعديد المرأة
  الرخصة وقيل لاء رابى أتعرف الفالوذفقال نعم أصفررعديدويقال هويرعدد أى يطف
  فى السؤال والرعاد ضربمن سل البحراذامسه الانسان خدرت يده وعضده حتى يرتعد
  مادام السمك حيا ورجل رعاد أى كثير الكلام وقواهم جاء بذات الرعد والصليل يعى
  بها الحرب وذات الرواعد الداهية (رغد عيشة رغدور غداى واسعة طيبة تقول رغد
  يشه-م ورغدعيشهم بكسر الغين وضهها وأرغد القوم أخصبوا وصاروا فى رغدم ن العيسْ
  وأرغد وامواشهم زكوهاوسومها أبو عمر والرغيدة اللين الحليب يغلى ويذر عليه دقيو
  ثم يساط ويلعق لعقا وارغادّ اللبن ار غيدادا أى اختلط بعضه ببعض ولم تتم خنورته بعد
  والمرغاد الشاك فى رأيه لا يدرى كيف يصدره وكذلك الارغيداد فى كل مختلط ⁦( رفد)⁩ الرفد
  بالكسر العطاء والصلة والرفد بالفتح المصدر تقول رفدنه أرفده رفدا اذا أعطيته وكذلك اذا
  أغنته والرفد والرفدأيضا القدح الضخم والارفاد الاعطاء والاعانة والمرافدة المعاونة
  والترافد التعاون والاسترفاد الاستعانة والارتفاد الكسب والترفيد التسويد يقال رفدفلان
  أى سوّد وعظم والمرفد الرفد وهوالقدح الضخم الذى يقرى فيه الضيف والمرفد أيضا
  العظامة تعظم ها المرآة الرسحاء والمرافد الشاءلا نقطع لبنها صفا ولاشاء والرفودمن
  النوق التى تلا الرفد فى حلية واحدة والرفادة خرقة يرفدبم االجرح وغيره قال أبوزيد رفدن
  على البعير أرد رفدا اذا عملت لدرفادة وهى مشل جدية السرج والرفادة أيضاشئ كانت
  تترافدبه قريش فى الجاهلية تخرج فيما بينها مالاتشترى به للجاج طعاما وزييبا للنبيذوكانت
  الرفادة والسقاية لبنى هاشم والسدانة واللواءلبنى عبد الدار والرافدان دجلة والفرات قال
  الفرزدق يخاطب يزيدين عبد الملك ويهجوأبا المثنى عمربن هبيرة الفزارى
  أوليت العراق ورافديه * فزاريا أحذ يدالقميص
  يريد أنه خفيف اليدنبه الى انخيانة والروافد خشب السقف وأنسد الاحر
  وواقده أكرم الرافدات • مح لك مخ لبحرخضم
