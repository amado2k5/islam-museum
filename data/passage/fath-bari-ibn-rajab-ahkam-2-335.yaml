text: "… العلماءِ على جوازِ إنشادِ المباحِ في المساجدِ، وحملَ بعضُهم حديثَ عمرِو بنِ شعيبٍ على أشعارِ الجاهليةِ وما لا يليقُ ذكرُه في المساجد. ولكنَّ الحديثَ المرسل يردُّ ذلك، والصَّحيحُ في الجوابِ: أنَّ أحاديثَ الرخصةِ صحيحةٌ كثيرةٌ فلا تقاومُ أحاديثَ الكراهةِ في …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 2، ص 335، يرد فيه ذكر الكراهة، والمباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 2, p. 335, whose wording mentions dislike (karaha), the permitted (mubah), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 2، ص 335 کا اقتباس جس میں کراہت، مباح، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Rajab, volume numérisé 2, p. 335, dont le texte mentionne la réprobation (karaha), le permis (mubah), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen digitalizado 2, p. 335, cuyo texto menciona la reprobación (karaha), lo permitido (mubah), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 2. cildinin 335. sayfasından, mekruh, helal ve izin verilen fiiller hakkında bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz fiiller, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 2, halaman 335, yang membahas tentang apa yang dibenci, diperbolehkan, dan diizinkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang dibenci, amalan yang dilarang, dan dosa-dosa kecil."
