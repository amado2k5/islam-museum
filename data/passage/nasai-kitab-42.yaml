summary:
  ar: "القسم 42 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصيد والذبائح»، ويضم فيها النصوص من 4263 إلى 4360 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 42 of Sunan al-Nasa'i (The Book of Hunting and Slaughtering) in the division of the open hadith dataset the museum took its reports from: reports 4263 to 4360 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 42، عنوان «کتاب الصید والذبائح»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4263 تا 4360۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 42 de Sunan al-Nasa'i (El Libro de la Caza y la Matanza) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4263 al 4360 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de la chasse et de l'abattage), dans la section 4263 à 4360 de la base de données ouverte, où il a effectué ses relevés. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 42. bölümü \"Av ve Kesim Kitabı\" başlığını taşımakta olup, 4263 ile 4360 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 42 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Perburuan dan Penyembelihan\" dan berisi teks 4263 hingga 4360, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
