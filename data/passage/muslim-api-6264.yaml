label: { ar: "صحيح مسلم 6264 — الأب والأبوة", en: "Sahih Muslim 6264 — the father and fatherhood", ur: "صحیح مسلم 6264 — باپ اور والدیت", es: "Sahih Muslim 6264 — El padre y la paternidad" }
text: "… أَنَّهُ سَمِعَ ابْنَ عُمَرَ، يَقُولُ بَعَثَ رَسُولُ اللَّهِ بَعْثًا وَأَمَّرَ عَلَيْهِمْ أُسَامَةَ بْنَ زَيْدٍ فَطَعَنَ النَّاسُ فِي إِمْرَتِهِ فَقَامَ رَسُولُ اللَّهِ فَقَالَ \" إِنْ تَطْعَنُوا فِي إِمْرَتِهِ فَقَدْ كُنْتُمْ تَطْعَنُونَ فِي إِمْرَةِ أَبِيهِ مِنْ قَبْلُ وَايْمُ اللَّهِ إِنْ كَانَ لَخَلِيقًا لِلإِمْرَةِ وَإِنْ كَانَ لَمِنْ أَحَبِّ النَّاسِ إِلَىَّ وَإِنَّ هَذَا لَمِنْ أَحَبِّ النَّاسِ إِلَىَّ بَعْدَهُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6264، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6264 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6264، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6264 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
