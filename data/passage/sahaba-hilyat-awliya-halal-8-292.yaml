text: "… فاحذرها فانها مزرية فى الدنيا بصاحبها ومخزية له فى الآخرة. لأن الغيبة حرام فى التنزيل، فمن محت فيه الغيبة صح فيه الكذب والبهتان، وذلك لانهما مجانبان للايمان، لان اللّٰه تمالى حرم من المؤمن على لسان نبيه ماله ودمد، وأن يظن …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 292، يذكر الحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 8, p. 292, that mentions the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 8، ص 292 کا اقتباس جس میں حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 8, pág. 292, que menciona lo ilícito y lo que se convirtió en ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
