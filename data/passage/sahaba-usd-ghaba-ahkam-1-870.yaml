text: "عَلْقَمَةُ بنُ مُجزِّزٍ عبد الله بن حذافة السهمي على سريّة، وكان رجلاً فيه دعابة، فأَجج ناراً وقال لأصحابه: أَليس طاعتي واجبة؟ قالوا: بلى، قال: فاقتحموا هذه النار. فقام رجل فاحتجز ليقتحمها، فضحك وقال: إِنما كنت ألعب. فبلغ ذلك النبي عيلة …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 870، يرد فيه ذكر الواجب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 870, whose wording mentions the obligatory (wajib), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 870 کا اقتباس جس میں واجب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
