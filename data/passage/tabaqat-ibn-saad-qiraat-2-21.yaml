text: "… أبى وأى. قال فرفع القوم رؤوسهم وقالوا : دَعنا منك أيّها الغلام فإنَّا لا نَدَعُ ثُفلَ رسول اللّه، صلّعم، لشىء أَبدًا. فعدوا يوم الجمل فقتل بَشَرٌ والله كثير حول عائشة قال ا يومثل سبعون كلهم قد جمع القرآن. قال : …"
summary:
  ar: "مقطع من الطبقات الكبرى لابن سعد، المجلد المصوَّر 2، ص 21، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Sa'd's al-Tabaqat al-Kubra, scan volume 2, p. 21, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الطبقات الکبریٰ، ابن سعد، اسکین جلد 2، ص 21 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Tabaqat al-Kubra de Ibn Sa'd, volumen 2, pág. 21, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Sa'd, al-Tabaqat al-Kubra (tome 2, p. 21), mentionnant la collection du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Sa'd'ın \"El-Tabakat el-Kübra\" adlı eserinin 2. cildinin 21. sayfasından, Kur'an'ın derlenmesi ve el yazmalarına dair bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari kitab Ibn Sa'd, \"Al-Tabaqat al-Kubra,\" Jilid 2, halaman 21, yang menyebutkan penyusunan Al-Qur'an dan manuskrip-manuskripnya; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
