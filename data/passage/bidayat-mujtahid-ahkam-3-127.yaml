text: "… بأن حمل حديثي عائشة وميمونة على الندب، وحديث أم سلمة على الوجوب. تخليل الرأس ولهذا السبب بعينه اختلفوا في تخليل الرأس هل هو واجب في هذه الطهارة أم لا ؟ ومذهب مالك أنه مستحب، ومذهب غيره أنه واجب، وقد عضد …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 3، ص 127، يرد فيه ذكر الواجب، والوجوب، والمستحب، والمندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 3, p. 127, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), the recommended (mandub), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 3، ص 127 کا اقتباس جس میں واجب، وجوب، مستحب، مندوب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
