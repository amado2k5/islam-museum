text: |-
  ٠١٤
  وقرأ الحسن عدوا مثل جلوس وعدافعل يستثف به مع ما و بغيرما تقول جاءنى القوم
  ماعد ازيدا وجأؤنى عد ازيداتنصب مابعد هلج اوالفاعل مضهرفيها وعداه بعدوه أى جاوزه
  وماعدا فلان أن صنع كذا ومالى عن فلان معدى أى لاتجاوزلى الى غيره ولا قصوردونه
  وعدوته عن الامر صر قته عنه والتعدى مجاوزة الشىّ الى غيره يقال عديته فتعدى أى
  تجاوز وعدّ عمازى أى اصرف بصرك عنه وتعادى القوم اذا أصاب هذا مثل داءهذا
  من العدوى أويموت بعضهم فى اثربعض قال الشاعر
  فالل من أروى تعاديت بالعمى * ولاقيت كلابامطلاوراميا
  والعدوان الظلم الصراح وقد عد اعليه وتعدّى عليه واعتدى كله بمعف وعوادى الدهر
  عوائقه قال الشاعر هجرت غضوب وحبة من يتجنب * رعدت عواددون وليك تشعب
  والعدوة والعدوة جانب الوادى وحافته قال اللّٰه تعالى اذ أنتم بالعدوة الدنيا وهم بالعدوة
  القصوى وابمع عداء مثل برمة وبرام ورهمة ورهام وعديات وقال أبو عمر والعدوة والعدوة
  المكان المرتفع والعدوى طلبك الى وال ليعديك على من فللك أى ينتقم منه يقال استعديت
  على فلان الامير فأعدانى عليه أى استعنت به عليه فأعاننى عليه والاسم منه العدوى وهى
  المعونة والعدوى أيضاما يعدى من جرب أوغيره وهو مجماوزته من صاحبه الى غيره بقال
  أعدى فلان فلانا من خلقه أو من علة به أو جرب وفى الحديث لاعدوى أى لا يعدى:ي
  شيأ والعدوالحضر وأعديت فرسى واستعديته أى استهضرته وأعديت فى منطقك أى
  جرت وفلان معدىّ عليه أبدلت الياءمن الواواستثقالا قال الشاعر
  وقد علمت عرسى مليكة أننى * أنا الليث معديا عليه وعاديا
  الاصمعىّ العدوا" على وزن الغلواء المكان الذى لا يطءيْن من قعد عليه يقال جنت على
  مركب ذى عدوا. أى ليس بمطمتن ولا مسووأبوزيد مثله الاصعى تمت على مكان متعاد
  اذا كان متفاوتاليس؟سستو وهذه أرض متعادية ذات جمرة ولخاقيق وعدواء الشغل
  أيضاموانعه قال العجاج بصف تور ايحفر كناسا
  وان أصاب عدواء احرورفا * عنها وولاهاظلوفاظلفا
  والمدواء أيضابعد الدار ويقال انه لعدوان بفتح العيز والدال آى شديد العدو وذتب
  عدوان أيضايعدوعلى الناس ومنه قولهم السلطان دوعدوان ودو بدوان وعدوان
  بالتسكين قبيلة وهو عدوان بن عمروبن قيس عيلان والعادية من الابل المقيمة فى العضاه
  لا تفارقها وليست ترعى الحمض وقال كثير
  وانّ الذى يبغى من المال أهلها * أور اللما تأتاف وعوادى
  يقول أهل هذه المرأة يطلبون من مهرهاما لا يكون ولا يمكن كمالا تأتلف هذه الابل الاوارك
  والعوادى وكذلك العاديات وقال
  رأى صاحبى فى العاديات ضجيبة * وأمثالها فى الواضعات القوامس
  ودفعت عنك عادية فلان أى ظله وشرّه والعدىّ الذين يعدون على أقدامهسم وهوجع عاد
  مثل غاز وغزىّ وقال
