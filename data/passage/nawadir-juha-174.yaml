text: "… عودنا الحمار على الرياضة ولكن لم يساعده الأجل حصل له في شتاء إحدى السنين ضائقة، فقال في نفسه : عجباً ألا يمكنني أن أقلِّلَ علف الحمار؟"
summary:
  ar: "في شتاء قاسٍ كان جحا يقلّل علف حماره شيئًا فشيئًا؛ فبقي الحمار حيًا حتى قطع عنه التبن أيضًا فمات؛ فقال إنه عوّد الحمار على الصوم ولكن الأجل لم يساعده. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  en: "In a hard winter Juha cuts his donkey's feed bit by bit; the donkey survives until he cuts the straw too, and then it dies; he says he trained the donkey to fast but death did not help. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  ur: "سخت سردی میں جحا نے گدھے کا چارہ تھوڑا تھوڑا کر کے گھٹایا؛ گدھا زندہ رہا، یہاں تک کہ اس نے بھوسا بھی بند کر دیا تو وہ مر گیا؛ جحا نے کہا کہ میں نے گدھے کو روزے کی عادت ڈالی تھی مگر موت نے ساتھ نہ دیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  fr: "Pendant un hiver rude, Juha réduit peu à peu la nourriture de son âne; l'âne survit jusqu'à ce qu'il supprime aussi la paille, puis il meurt; Juha dit qu'il avait habitué l'âne à jeûner mais que la mort ne l'a pas aidé. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  es: "En un invierno duro, Juha recorta poco a poco el alimento de su burro; el burro sobrevive hasta que le quita también la paja, y entonces muere; Juha dice que acostumbró al burro a ayunar, pero que la muerte no lo ayudó. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  tr: "Zorlu bir kış mevsiminde Juha, eşeğinin yemini kademeli olarak azalttı; eşek, samanını da kesene kadar hayatta kaldı, ancak o noktada öldü. Juha, eşeği oruç tutmaya alıştırdığını, ancak kaderin hayatta kalmasına izin vermediğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 78}"
  id: "Selama musim dingin yang keras, Juha secara bertahap mengurangi pakan keledainya; keledai itu bertahan hidup sampai ia juga mengurangi jeraminya, pada saat itulah keledai itu mati. Juha mengatakan bahwa ia telah membiasakan keledainya untuk berpuasa, tetapi takdir tidak mengizinkannya untuk bertahan hidup. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
