label: { ar: "الموطأ 1764 — ابن شهاب عن عروة عن عائشة: أفلح أخو أبي القعيس استأذن عليها بعد نزول الحجاب، فأبت حتى أمرها النبي أن تأذن له", en: "Muwatta 1764", es: "Muwatta 1764", fr: "Muwatta 1764", ur: "موطا 1764", tr: "El-Muvatta 1764 — İbn Şihab, Urve'den, o da Aişe'den rivayetle: Ebu el-Kays'ın kardeşi Aflah, hicap ayetinin vahyinden sonra onunla birlikte olmak için izin istedi, ancak o, Peygamber ona izin vermesini emredene kadar reddetti.", id: "Al-Muwatta 1764 — Ibn Shihab, berdasarkan riwayat Urwah, berdasarkan riwayat Aisyah: Aflah, saudara Abu al-Qais, meminta izin untuk menemuinya setelah turunnya ayat tentang hijab, tetapi dia menolak sampai Nabi memerintahkannya untuk memberikan izin kepadanya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أم المؤمنين أنها أخبرته أن أفلح، أخا أبي القعيس، جاء يستأذن عليها، وهو عمها من الرضاعة، بعد أن نزل الحجاب. قالت فأبيت أن آذن له، فلما جاء رسول الله أخبرته بالذي صنعت، فأمرها أن تأذن له. {cite:muwatta-maruf-1997 p.120}"
  tr: "Malik, İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Müminlerin Annesi Aişe'den rivayet eder ki, Aişe ona, hicap ayeti nazil olduktan sonra, Ebu el-Kays'ın kardeşi Aflah'ın, üvey amcası olarak, kendisiyle birlikte olmak için izin istemeye geldiğini anlatmıştır. Aişe, \"Ona izin vermeyi reddettim\" demiştir. Allah'ın Resulü geldiğinde, Aişe yaptıklarını ona anlatmış ve Resulullah ona izin vermesini emretmiştir. {cite:muwatta-maruf-1997 s.120}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah bin al-Zubayr, dari Aisyah, Ummul Mukminin, bahwa ia bercerita kepada beliau bahwa Aflah, saudara Abu al-Qays, datang meminta izin untuk masuk ke kamarnya, dan Aflah adalah paman angkatnya, setelah ayat hijab diturunkan. Ia berkata, \"Aku menolak untuk memberinya izin.\" Ketika Rasulullah datang, ia menceritakan apa yang telah dilakukannya, dan beliau memerintahkannya untuk memberinya izin. {cite:muwatta-maruf-1997 p.120}"
