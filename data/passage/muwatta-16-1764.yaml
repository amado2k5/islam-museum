label: { ar: "الموطأ 1764 — ابن شهاب عن عروة عن عائشة: أفلح أخو أبي القعيس استأذن عليها بعد نزول الحجاب، فأبت حتى أمرها النبي أن تأذن له", en: "Muwatta 1764" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أم المؤمنين أنها أخبرته أن أفلح، أخا أبي القعيس، جاء يستأذن عليها، وهو عمها من الرضاعة، بعد أن نزل الحجاب. قالت فأبيت أن آذن له، فلما جاء رسول الله أخبرته بالذي صنعت، فأمرها أن تأذن له. {cite:muwatta-maruf-1997 p.120}"
