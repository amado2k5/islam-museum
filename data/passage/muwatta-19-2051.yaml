label: { ar: "الموطأ 2051 — مالك: إذا ساقى الرجل النخل وفيها البياض، فما ازدرع الداخل في البياض فهو له، وإن اشترط صاحب الأرض أنه يزرع في البياض لنفسه فلا يصلح، لأن الداخل يسقي له الأرض فذلك زيادة", en: "Muwatta 2051", es: "Muwatta 2051", fr: "Muwatta 2051", ur: "موطا 2051", tr: "El-Muvatta 2051 — Malik: Bir kimse ortakçılık anlaşmasıyla bir hurma ağacı kiralarsa ve ağaçta olgunlaşmamış meyve varsa, olgunlaşmamış meyveye ekim yapan kişinin payı kendisine aittir. Ancak, toprak sahibi olgunlaşmamış meyveye kendisi için ekim yapmasına izin verirse, bu caiz değildir; çünkü ekim yapan kişi onun için araziyi sulamış olur ve bu da bir ek gelirdir.", id: "Al-Muwatta 2051 — Malik: Jika seseorang menyewa pohon kurma dengan perjanjian bagi hasil dan terdapat buah yang belum matang di pohon tersebut, maka apa pun yang ditanam orang di buah yang belum matang itu menjadi miliknya. Namun, jika pemilik tanah menetapkan bahwa ia boleh menanam di buah yang belum matang itu untuk dirinya sendiri, maka hal ini tidak diperbolehkan, karena orang yang menanam tersebut mengairi tanah untuknya, dan itu merupakan tambahan." }
summary:
  ar: "قال مالك: إذا ساقى الرجل النخل، وفيها البياض، فما ازدرع الرجل الداخل في البياض فهو له. قال: وإن اشترط صاحب الأرض أنه يزرع في البياض لنفسه، فذلك لا يصلح، لأن الرجل الداخل في المال يسقي لرب المال الأرض، فذلك زيادة ازدادها عليه. {cite:muwatta-maruf-1997 p.240}"
  tr: "Malik şöyle dedi: Eğer bir kişi hurma ağaçları için ortakçılık anlaşması yaparsa ve ağaçlarda olgunlaşmamış bitki örtüsü varsa, bu olgunlaşmamış bitki örtüsünü işleyen kişinin ektiği her şey ona aittir. Ancak şöyle devam etti: Eğer toprak sahibi, olgunlaşmamış bitki örtüsünü kendisi için ekmesine izin verirse, bu caiz değildir; çünkü anlaşmaya giren kişi toprak sahibi için araziyi sulamaktadır ve bu da onun elde ettiği ek bir kazançtır. {cite:muwatta-maruf-1997 s.240}"
  id: "Malik berkata: Jika seseorang mengadakan perjanjian bagi hasil untuk pohon kurma, dan terdapat tunas yang belum matang di pohon tersebut, maka apa pun yang ditanam oleh orang yang menanam tunas yang belum matang itu menjadi miliknya. Beliau berkata: Jika pemilik tanah menetapkan bahwa ia boleh menanam tunas yang belum matang itu untuk dirinya sendiri, maka hal itu tidak diperbolehkan, karena orang yang mengadakan perjanjian tersebut mengairi tanah untuk pemilik tanah, dan itu merupakan keuntungan tambahan yang diperolehnya. {cite:muwatta-maruf-1997 p.240}"
