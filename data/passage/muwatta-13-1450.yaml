label: { ar: "الموطأ 1450 — مالك: ميراث الرجل من امرأته النصف إذا لم تترك ولدا، والربع إذا تركت ولدا، وميراث المرأة من زوجها الربع والثمن", en: "Muwatta 1450" }
summary:
  ar: "يقول مالك إن ميراث الرجل من امرأته، إذا لم تترك ولدا ولا ولد ابن، النصف. فإن تركت ولدا أو ولد ابن، ذكرا كان أو أنثى، فلزوجها الربع، من بعد وصية توصي بها أو دين. وميراث المرأة من زوجها، إذا لم يترك ولدا، الربع، فإن ترك ولدا أو ولد ابن فلامرأته الثمن، وفي ذلك آية النساء. {cite:muwatta-maruf-1997 p.6}"
