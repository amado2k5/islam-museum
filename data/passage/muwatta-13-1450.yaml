label: { ar: "الموطأ 1450 — مالك: ميراث الرجل من امرأته النصف إذا لم تترك ولدا، والربع إذا تركت ولدا، وميراث المرأة من زوجها الربع والثمن", en: "Muwatta 1450", es: "Muwatta 1450", fr: "Muwatta 1450", ur: "موطا 1450", tr: "El-Muvatta 1450 — Malik: Bir erkeğin karısından alacağı miras, eğer çocuk bırakmazsa yarısı, eğer çocuk bırakırsa dörtte biridir. Bir kadının kocasından alacağı miras ise dörtte bir ve sekizde biridir.", id: "Al-Muwatta 1450 — Malik: Warisan seorang pria dari istrinya adalah setengah jika istrinya tidak meninggalkan anak, dan seperempat jika ia meninggalkan anak. Warisan seorang wanita dari suaminya adalah seperempat dan seperdelapan." }
summary:
  ar: "يقول مالك إن ميراث الرجل من امرأته، إذا لم تترك ولدا ولا ولد ابن، النصف. فإن تركت ولدا أو ولد ابن، ذكرا كان أو أنثى، فلزوجها الربع، من بعد وصية توصي بها أو دين. وميراث المرأة من زوجها، إذا لم يترك ولدا، الربع، فإن ترك ولدا أو ولد ابن فلامرأته الثمن، وفي ذلك آية النساء. {cite:muwatta-maruf-1997 p.6}"
  tr: "Malik, bir erkeğin karısından alacağı mirasın, eğer kadın çocuk veya torun bırakmamışsa, yarısının olduğunu söyler. Eğer kadın çocuk veya torun (erkek veya kız) bırakmışsa, kocası, kadının yaptığı vasiyetlerden veya borçlardan sonra, mirasın dörtte birini alır. Bir kadının kocasından alacağı miras, eğer erkek çocuk veya torun bırakmamışsa, dörtte biridir. Eğer erkek çocuk veya torun bırakmışsa, karısı sekizde birini alır. Bu, Nisa Suresi'nin (4:19) ayetinde geçmektedir. {cite:muwatta-maruf-1997 s.6}"
  id: "Malik mengatakan bahwa warisan seorang pria dari istrinya, jika istrinya tidak meninggalkan anak atau cucu, adalah setengahnya. Jika ia meninggalkan anak atau cucu, laki-laki atau perempuan, suaminya menerima seperempatnya, setelah dikurangi wasiat yang mungkin telah ia buat atau hutang yang dimilikinya. Warisan seorang wanita dari suaminya, jika ia tidak meninggalkan anak atau cucu, adalah seperempatnya. Jika ia meninggalkan anak atau cucu, istrinya menerima seperdelapannya. Hal ini disebutkan dalam ayat Surah An-Nisa (4:19). {cite:muwatta-maruf-1997 p.6}"
