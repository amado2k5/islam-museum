text: |-
  الزماورد بالضم بقال لهميسر
  كعفام وفارسيته فواله وهو طعام
  1-م380
  القاموس قاله نصر
  ٠٢٦٦
  وطد)
  ا وأقدح وذتب وأذوَّب وهمايتوادّان وهم أودّاء والودود المحب ورجال وددا «يستوى فيه
  المذكروالمؤنث لكونه وصفاد اخلاعلى وصف للمبالغة والود بالفتح الوتد فى لغة أهل نجد
  كانهم سكنوا التاءفأدغموها فى الدال والود فى قول امرئ القيس
  تظاه والوداذا ما أشجذت • وتواريه اذا ماتشتكر
  قال ابن دريد هو اسم جبل وودّصنم كان لقوم نوح عليه السلام ثم صارا.كلاب وكان بدومة
  الجندل ومنه سمعبدود ⁦(ورد)⁩. وردفلان وروداحضروأوردمغيره واسستورده أى
  أحضره والورد الحز يقال قرأت وردى والوردخ-لاف الصدر والورد أيضا الورادوهم
  الذين يردون الماه قال يدف قليبا
  صبحن من وشها قليباسكا * يطموادا الورد عليه التكا
  وكذلك الابل قال الراجز وصبح الما يورد عكان والورديوم الحى اذا أخذت صاحبها
  وقت تقول وردته الحى فهوم ورود قال أعرابية لا خوما أمارافراق المورودفقال
  الرحضاء وفلان وارد الارنية اذا كان فيها طول وتوردت انحيل البلدة أى دخلتها قلي لا قليلا
  قطعة قطعة وحبل الوريد عرق تزعم العرب أنه من الوتين وهما وريدان مكتنفاصقى
  العنق مما يلى مقدمه غليظان والورد بالفتح الذى يشم الواحدة وردة وبلونه قيل للاسدورد
  وللغرس وردوهومابين الكميت والاشر والاتى وردة والجمع وودبالضم مثل جون وجون
  ووراد أيضا وق دورد الفرس يوردورودة أى صارورداواللون وردة مثال غيسة وشقرة
  تقول ايراد الفرس كماتقول ادهام الفرس واكمات وأصل إورات صارت الواوياء لكسر
  ما قبلها وقبص مور دصبغ على لون الورد و«ودون المضرّج والوارد الطريق قال لبيد
  ثم أصدرناهمافى وأردصا دروهم صواة كالمثل
  :قول أصدرنا يعيرينا فى طريق صادرو كذلك المورد قال جرير
  أمير المؤمنين على صراط * اذا اعوج الموارد مستقيم
  والزمأورد معرب والعامة تقول بزماورد ⁦( و-د)⁩ الوسادة والوسادة الخسدة والجمع
  وساتدووسدوقد وسدنه الشى فتوسده اذاجعله تحت رأسه وأوسدت الكلب أغريت
  بالسيدمشل آسدته ⁦( وصد)⁩ الوصيد الفناء وأوصدت الباب وآصدته إذا أغلقته
  وأوصد الباب على مالم يسم فاعله فهو، وصدمثل أوجع فهوموجع ومنه قوله نعالى انها
  عليهم مؤصدة قالوا، طبقة والوصيدة كالمظيرة تتخذ للمال الاأنهام ن الجارة والحظيرة من
  الغصنة تقول منه استوصدت فى الجبل اذا اتخذته والوصيد النبات المتقارب الاصول
  ⁦( وطد)⁩ وطدت الذى أطده وطدا أى أنبته وتقلته والتوطيدمثله وقال الشاءر
  يعف قوما بكثرة العدد
  وهم يطدون الارض لولاهم أرتت * ؟من فوقها من ذى بيان وأيهما
  وقدوطدت على باب الغارالصخراذ اسددته به ونضدته عليه ووطده الى الارض مثل وهصبه
  وغمزه الى الارض وتوطد أى ئيت والميطدة خشبة يمسك بها المشقب والوطائد قواعد البذيان
  والواطد النابت والطادى مقلوب منه قال القطامى
  ملاعناد
