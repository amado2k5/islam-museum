label: { ar: "سنن أبي داود 4207 — الطب والطبيب", en: "Sunan Abi Dawud 4207 — medicine and the physician", ur: "سنن ابی داؤد 4207 — طب اور طبیب", es: "Sunan Abi Dawud 4207 — La medicina y el médico", fr: "Sunan Abi Dawud 4207 — La médecine et le médecin", tr: "Sunan Abi Dawud 4207 — Tıp ve Hekim", id: "Sunan Abi Dawud 4207 — Kedokteran dan Tabib" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا ابْنُ إِدْرِيسَ، قَالَ سَمِعْتُ ابْنَ أَبْجَرَ، عَنْ إِيَادِ بْنِ لَقِيطٍ، عَنْ أَبِي رِمْثَةَ، فِي هَذَا الْخَبَرِ قَالَ فَقَالَ لَهُ أَبِي أَرِنِي هَذَا الَّذِي بِظَهْرِكَ فَإِنِّي رَجُلٌ طَبِيبٌ. قَالَ \" اللَّهُ الطَّبِيبُ بَلْ أَنْتَ رَجُلٌ رَفِيقٌ طَبِيبُهَا الَّذِي خَلَقَهَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4207، يذكر الطب والطبيب. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4207 (Combing the Hair (Kitab Al-Tarajjul)), that mentions medicine and the physician. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4207، جس میں طب اور طبیب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4207 (El peinado (Kitab Al-Tarajjul)), menciona la medicina y al médico. El buscador de textos sobre medicina lo incluye junto con los textos sobre medicina profética, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 4207 (Le peignage des cheveux), mentionne la médecine et le médecin. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sünen Ebu Davud'da yer alan 4207 numaralı hadis, tıp ve hekimden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4207, menyebutkan tentang pengobatan dan tabib. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
