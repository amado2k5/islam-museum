label: { ar: "الموطأ 1355 — عروة بن أذينة: خرج مع جدته التي نذرت المشي إلى بيت الله فعجزت، فأمرها ابن عمر أن تركب ثم تمشي من حيث عجزت", en: "Muwatta 1355", es: "Muwatta 1355", fr: "Muwatta 1355", ur: "موطا 1355", tr: "El-Muvatta 1355 — Urve ibn Udeyane: İbn Ömer, Allah'ın Evi'ne yürüyerek gitmeye yemin etmiş ama bunu yapamayan ninesiyle birlikte dışarı çıktı. İbn Ömer ona önce ata binmesini, sonra da yürüyemediği yerden itibaren yürümesini emretti.", id: "Al-Muwatta 1355 — Urwah ibn Udhaynah: Dia pergi bersama neneknya yang telah bernazar untuk berjalan kaki ke Baitullah tetapi tidak mampu melakukannya. Ibn Umar memerintahkannya untuk menunggang kuda dan kemudian berjalan kaki dari tempat yang tidak mampu lagi dilaluinya." }
summary:
  ar: "يروي مالك عن عروة بن أذينة الليثي أنه خرج مع جدة له عليها مشي إلى بيت الله، حتى إذا كانوا ببعض الطريق عجزت، فأرسلت مولى لها يسأل عبد الله بن عمر، فخرج معه، فسأله، فقال له ابن عمر مرها فلتركب، ثم لتمش من حيث عجزت. {cite:muwatta-maruf-1997 p.607}"
  tr: "Malik, Urve ibn Udeyne el-Layti'den rivayet ettiğine göre, büyükannesiyle birlikte Kabe'ye yürüyerek gitmişti. Yolun bir kısmına geldiklerinde büyükannesi yürüyemez hale gelmişti. Bunun üzerine hizmetçisini Abdullah ibn Ömer'e sorması için göndermiş, o da hizmetçiyle birlikte gidip sormuştu. İbn Ömer ona, büyükannesine önce ata binmesini, sonra da yürüyemez hale geldiği yerden itibaren yürümesini söylemesini emretmişti. {cite:muwatta-maruf-1997 s.607}"
  id: "Malik meriwayatkan dari Urwah ibn Udhaynah al-Laythi bahwa ia pergi berjalan kaki bersama neneknya ke Baitullah (Ka'bah), tetapi ketika mereka berada di tengah jalan, neneknya tidak mampu berjalan. Maka ia mengirim pelayannya untuk bertanya kepada Abdullah ibn Umar, dan Abdullah pergi bersamanya dan bertanya kepadanya. Ibnu Umar menyuruhnya untuk menyuruh neneknya naik kendaraan, lalu berjalan kaki dari tempat ia tidak mampu berjalan lagi. {cite:muwatta-maruf-1997 p.607}"
