label: { ar: "الموطأ 1355 — عروة بن أذينة: خرج مع جدته التي نذرت المشي إلى بيت الله فعجزت، فأمرها ابن عمر أن تركب ثم تمشي من حيث عجزت", en: "Muwatta 1355" }
summary:
  ar: "يروي مالك عن عروة بن أذينة الليثي أنه خرج مع جدة له عليها مشي إلى بيت الله، حتى إذا كانوا ببعض الطريق عجزت، فأرسلت مولى لها يسأل عبد الله بن عمر، فخرج معه، فسأله، فقال له ابن عمر مرها فلتركب، ثم لتمش من حيث عجزت. {cite:muwatta-maruf-1997 p.607}"
