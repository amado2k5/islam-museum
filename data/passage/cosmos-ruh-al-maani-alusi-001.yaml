text: "والمناسب للمقام هنا العموم والعوالم كثيرة لا تحصيها الأرقام"
summary:
  ar: "في تفسير «رب العالمين» يرى الألوسي أن المناسب للمقام العموم، وأن العوالم كثيرة لا تحصيها الأرقام، بعد أن عرض تخصيص بعضهم العالمين بالجن والإنس أو بالإنس وردّه بأنه تخصيص من غير دليل."
  en: "In his commentary on 'Lord of the worlds', al-Alusi holds that the fitting reading is the general one, that the worlds are many beyond any count, after surveying readings that limit the word to jinn and humans or to humans alone and objecting that such limiting has no proof."
  es: "En su comentario sobre \"El Señor de los mundos\", al-Alusi sostiene que la lectura adecuada es la general, según la cual los mundos son innumerables, después de examinar las lecturas que limitan la palabra a los genios y a los humanos o solo a los humanos y objetar que tal limitación no tiene pruebas."
  fr: "Dans son commentaire sur « Seigneur des mondes », al-Alusi soutient que l'interprétation appropriée est la plus générale, selon laquelle les mondes sont innombrables, après avoir examiné les interprétations qui limitent le mot aux djinns et aux humains ou aux humains seulement et objecté que de telles limitations n'ont aucune preuve."
  ur: "\"رب العالمین\" پر اپنی تفسیر میں، العلوسی کا خیال ہے کہ مناسب پڑھنا عام ہے، یہ کہ جہان کسی بھی شمار سے باہر بہت سے ہیں، ان پڑھنے کے سروے کے بعد جو لفظ کو جنوں اور انسانوں یا صرف انسانوں تک محدود کرتے ہیں اور اعتراض کرتے ہیں کہ اس طرح کی حد بندی کا کوئی ثبوت نہیں ہے۔"
  tr: "Al-Alusi, “Âlemlerin Rabbi”ni yorumlarken, bazı kişilerin âlemleri cinlere ve insanlara veya sadece insanlara atfetmelerinin delilsiz bir tanımlama olduğunu reddettikten sonra, âlemlerin çok sayıda olduğunu ve sayılamayacağını, dolayısıyla genellemenin uygun bir bağlam olduğunu savunmuştur."
  id: "Dalam menafsirkan “Penguasa Alam Semesta,” Al-Alusi meyakini bahwa konteks yang tepat adalah generalisasi, dan bahwa alam semesta itu banyak dan tidak dapat dihitung, setelah ia menyampaikan beberapa spesifikasi alam semesta yang dibuat oleh sebagian orang, yaitu untuk jin dan manusia atau untuk manusia, dan ia membantah bahwa itu adalah spesifikasi tanpa bukti."
