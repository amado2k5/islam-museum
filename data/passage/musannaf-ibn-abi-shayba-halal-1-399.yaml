text: "… ارض اللّٰه إلى اللّه، إني والله لو لم أخرج منك ما خرجت، وإنها لم تحل لأحد كان قبلي، ولا تحل لأحد بعدي، وإنما أحلت لي ساعة من النهار، وهي ساعتي هذه، حرام لا يعضد شجرها، ولا يحتش حشيشها، ولا يلتقط …"
