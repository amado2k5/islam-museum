text: "… في الحرم من شجر الحرم، فراجع عكرمة عطاء فقال : لمن حَرُم عليَ ما نبت على مائي في الحرم ليحرُمَنَّ علىّ قِطني فإنه تنبت فيه الغريبة، وتنبت فيه الخُضَر، م، فقال : أُحِلَّ لك ما والنجم، فإذاً لا يستطيع الناس …"
