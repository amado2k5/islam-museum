text: "… السند، لكن قال فيه: عن عبيد بن عمر بدل عبد الرحمن بن القاسم، فلعل ليحيى بن سعيد فيه شيخين. قوله: كان لأبي بكر غلام لم أقف على اسمه، ووقع لأبي بكر مع النعيمان بن عمر و أحد الأحرار من الصحابة …"
