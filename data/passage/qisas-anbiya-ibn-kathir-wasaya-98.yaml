  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 98. sayfasında, son bir vasiyet veya ahitten bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Metin, \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
