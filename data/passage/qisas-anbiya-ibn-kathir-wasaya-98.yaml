text: "… أى ومع هذه المدة الطويلة فما آمن به إلا القليل منهم. وكان كلما انقرض جيل وصوا من بعدهم بعدم الإيمان به ومحاربته ومخالفته. وكان الوالد إذا بلغ ولده وعقل عنه كلامه، وصاه فيما بينه وبينه، ألا يؤمن بنوح أبداً ما …"
summary:
