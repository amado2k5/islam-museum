label: { ar: "جامع الترمذي 206 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 206 — what was left behind: estate and inheritance", ur: "جامع ترمذی 206 — ترکہ اور میراث" }
text: "… حَدِيثُ ابْنِ عَبَّاسٍ حَدِيثٌ غَرِيبٌ. وَأَبُو تُمَيْلَةَ اسْمُهُ يَحْيَى بْنُ وَاضِحٍ. وَأَبُو حَمْزَةَ السُّكَّرِيُّ اسْمُهُ مُحَمَّدُ بْنُ مَيْمُونٍ. وَجَابِرُ بْنُ يَزِيدَ الْجُعْفِيُّ ضَعَّفُوهُ تَرَكَهُ يَحْيَى بْنُ سَعِيدٍ وَعَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ. قَالَ أَبُو عِيسَى سَمِعْتُ الْجَارُودَ يَقُولُ سَمِعْتُ وَكِيعًا يَقُولُ لَوْلاَ جَابِرٌ الْجُعْفِيُّ لَكَانَ أَهْلُ الْكُوفَةِ بِغَيْرِ حَدِيثٍ وَلَوْلاَ حَمَّادٌ لَكَانَ أَهْلُ الْكُوفَةِ بِغَيْرِ فِقْهٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 206، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 206 (The Book on Salat (Prayer)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 206، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
