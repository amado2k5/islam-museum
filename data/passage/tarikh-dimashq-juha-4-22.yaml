text: "… نشأ ببغذاذ وأقام بهَا دَهراً طويلاً، ثم انتقل عنها فنزل صُور - من بلاد سَاحل الشام - وَحَدّث عن أبي بكر بن أبي دَاوُد، و القاضي المحَاملي، وَيُوسف بن يعقوب بن إسحَاق بن البَهلول، وغَيرهم. وَفيمَا رَوى أحَاديث وَهمَ فيها …"
