label: { ar: "سنن النسائي 2430 — الأب والأبوة", en: "Sunan al-Nasa'i 2430 — the father and fatherhood", ur: "سنن نسائی 2430 — باپ اور والدیت" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ حَدَّثَنَا خَالِدٌ، عَنْ شُعْبَةَ، قَالَ أَنْبَأَنَا أَنَسُ بْنُ سِيرِينَ، عَنْ رَجُلٍ، يُقَالُ لَهُ عَبْدُ الْمَلِكِ يُحَدِّثُ عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ كَانَ يَأْمُرُ بِهَذِهِ الأَيَّامِ الثَّلاَثِ الْبِيضِ وَيَقُولُ \" هُنَّ صِيَامُ الشَّهْرِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2430، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2430 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2430، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
