text: "… عَلَى رَسُولِ اللَّهِ قَالَتْ عَائِشَةُ وَأَنَا مَعَهُ فِي الْبَيْتِ فَقَالَ رَسُولُ اللَّهِ بِئْسَ ابْنُ الْعَشِيرَةِ . ثُمَّ أَذِنَ لَهُ رَسُولُ اللَّهِ. قَالَتْ عَائِشَةُ فَلَمْ أَنْشَبْ أَنْ سَمِعْتُ ضَحِكَ رَسُولِ اللَّهِ مَعَهُ فَلَمَّا خَرَجَ الرَّجُلُ قُلْتُ يَا رَسُولَ اللَّهِ قُلْتَ فِيهِ مَا قُلْتَ ثُمَّ لَمْ تَنْشَبْ أَنْ ضَحِكْتَ مَعَهُ. فَقَالَ رَسُولُ اللَّهِ إِنَّ مِنْ شَرِّ النَّاسِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1636، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Muwatta Malik, no. 1636, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "موطأ مالک کی حدیث نمبر 1636، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Muwatta Malik, n° 1636, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Muwatta Malik, n.º 1636, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Malik'in Muwatta'sında yer alan 1636 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1636, berisi tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
