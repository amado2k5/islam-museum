text: "ز الدولة إلى الإنحدار ولكنه أنف وأقام على كره ومشقة. فلما ورد عليه رسالة سيف الدولة استراح إليها وأجابه بالشكر الجميل وشكا إليه أخاء وقلة وفائه والغدر به مرة بعد مرة وقال له : - «ان ضمنته أنت أجبت.» نضمنه"
