text: "… أو التفويض عند مرجئة الفقهاء أن أعمال القلوب فيها زيادة ونقص، لكنها خارجة عن ترتب على الخلاف بين أهل السنّة ومرجئة الفقهاء مسألة زيادة الإيمان ونقصانه الإيمان يطلق إطلاقًا عامًا يشمل جميع أمور الدين ويُطلق ويُراد به الأصول الإيمان بالأصول …"
