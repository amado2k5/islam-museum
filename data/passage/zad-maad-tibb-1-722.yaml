text: "… وكست: بمعنى واحد. وفي الصحيحين : من حديث أنس، عن النبيِّ خَيْرُ مَا تَدَاوَيْتُم بِهِ الحِجَامَةُ والقُسْطُ البَحْرِي البخاري:، ومسلم:. وفي السد : من حديث أمّ قيس، عن التي : عَلَيْكُم بِهذا العُود الهِنْدِيِّ، فَإِنّ سَبْعَةَ أَشْفِيَةٍ مِنْهَا ذَاتُ الجَنْبِ …"
