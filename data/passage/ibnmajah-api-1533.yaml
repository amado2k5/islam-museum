label: { ar: "سنن ابن ماجه 1533 — دفن وقبر ومرقد", en: "Sunan Ibn Majah 1533 — a burial, grave or resting place", ur: "سنن ابن ماجہ 1533 — تدفین، قبر اور مرقد", es: "Sunan Ibn Majah 1533 — un entierro, tumba o lugar de descanso", fr: "Sunan Ibn Majah 1533 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا سَعِيدُ بْنُ شُرَحْبِيلَ، عَنِ ابْنِ لَهِيعَةَ، عَنْ عُبَيْدِ اللَّهِ بْنِ الْمُغِيرَةِ، عَنْ أَبِي الْهَيْثَمِ، عَنْ أَبِي سَعِيدٍ، قَالَ كَانَتْ سَوْدَاءُ تَقُمُّ الْمَسْجِدَ فَتُوُفِّيَتْ لَيْلاً فَلَمَّا أَصْبَحَ رَسُولُ اللَّهِ ـ أُخْبِرَ بِمَوْتِهَا فَقَالَ \" أَلاَ آذَنْتُمُونِي بِهَا \". فَخَرَجَ بِأَصْحَابِهِ فَوَقَفَ عَلَى قَبْرِهَا فَكَبَّرَ عَلَيْهَا وَالنَّاسُ مِنْ خَلْفِهِ وَدَعَا لَهَا ثُمَّ انْصَرَفَ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1533، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1533 (Chapters Regarding Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1533، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1533 (Capítulos sobre los funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 1533 (Chapitres relatifs aux funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
