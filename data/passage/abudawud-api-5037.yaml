label: { ar: "سنن أبي داود 5037 — أسماء الأمراض", en: "Sunan Abi Dawud 5037 — named diseases", ur: "سنن ابی داؤد 5037 — بیماریوں کے نام", es: "Sunan Abi Dawud 5037 - enfermedades nombradas", fr: "Sunan Abi Dawud 5037 — maladies nommées", tr: "Sünen Ebu Davud 5037 — Hastalık İsimleri", id: "Sunan Abi Dawud 5037 — Nama-nama Penyakit" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ مُوسَى، أَخْبَرَنَا ابْنُ أَبِي زَائِدَةَ، عَنْ عِكْرِمَةَ بْنِ عَمَّارٍ، عَنْ إِيَاسِ بْنِ سَلَمَةَ بْنِ الأَكْوَعِ، عَنْ أَبِيهِ، أَنَّ رَجُلاً، عَطَسَ عِنْدَ النَّبِيِّ فَقَالَ لَهُ \" يَرْحَمُكَ اللَّهُ \". ثُمَّ عَطَسَ فَقَالَ النَّبِيُّ \" الرَّجُلُ مَزْكُومٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5037، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 5037 (General Behavior (Kitab Al-Adab)), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 5037، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 5037 (Conducta general (Kitab Al-Adab)), menciona enfermedades específicas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 5037 (Guide des mœurs), mentionne des maladies nommées. Le Répertoire des médicaments le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sünen Ebu Davud'da yer alan 5037 numaralı hadiste hastalıkların isimleri geçmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 5037, menyebutkan nama-nama penyakit. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
