text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ مُوسَى، أَخْبَرَنَا ابْنُ أَبِي زَائِدَةَ، عَنْ عِكْرِمَةَ بْنِ عَمَّارٍ، عَنْ إِيَاسِ بْنِ سَلَمَةَ بْنِ الأَكْوَعِ، عَنْ أَبِيهِ، أَنَّ رَجُلاً، عَطَسَ عِنْدَ النَّبِيِّ فَقَالَ لَهُ \" يَرْحَمُكَ اللَّهُ \". ثُمَّ عَطَسَ فَقَالَ النَّبِيُّ \" الرَّجُلُ مَزْكُومٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5037، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 5037 (General Behavior (Kitab Al-Adab)), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 5037، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
