label: { ar: "صحيح البخاري 3842 — ورع أبي بكر عن طعام من كسب الكهانة", en: "Sahih al-Bukhari 3842 — Abu Bakr's scruple over food earned by soothsaying", ur: "صحیح بخاری 3842 — کہانت کی کمائی کے کھانے سے ابوبکر کا ورع" }
text: "… عَائِشَةَا ـ قَالَتْ كَانَ لأَبِي بَكْرٍ غُلاَمٌ يُخْرِجُ لَهُ الْخَرَاجَ، وَكَانَ أَبُو بَكْرٍ يَأْكُلُ مِنْ خَرَاجِهِ، فَجَاءَ يَوْمًا بِشَىْءٍ فَأَكَلَ مِنْهُ أَبُو بَكْرٍ فَقَالَ لَهُ الْغُلاَمُ تَدْرِي مَا هَذَا فَقَالَ أَبُو بَكْرٍ وَمَا هُوَ قَالَ كُنْتُ تَكَهَّنْتُ لإِنْسَانٍ فِي الْجَاهِلِيَّةِ وَمَا أُحْسِنُ الْكِهَانَةَ، إِلاَّ أَنِّي خَدَعْتُهُ، فَلَقِيَنِي فَأَعْطَانِي بِذَلِكَ، فَهَذَا الَّذِي أَكَلْتَ مِنْهُ. فَأَدْخَلَ أَبُو …"
summary:
  ar: "خبر في صحيح البخاري، رقم 3842، في ورع أبي بكر عن طعام من كسب الكهانة. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Sahih al-Bukhari, no. 3842, on Abu Bakr's scruple over food earned by soothsaying. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "صحیح بخاری کی روایت نمبر 3842: کہانت کی کمائی کے کھانے سے ابوبکر کا ورع۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
