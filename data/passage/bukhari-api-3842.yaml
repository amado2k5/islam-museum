label: { ar: "صحيح البخاري 3842 — ورع أبي بكر عن طعام من كسب الكهانة", en: "Sahih al-Bukhari 3842 — Abu Bakr's scruple over food earned by soothsaying", ur: "صحیح بخاری 3842 — کہانت کی کمائی کے کھانے سے ابوبکر کا ورع", es: "Sahih al-Bukhari 3842 — El escrúpulo de Abu Bakr por la comida ganada mediante la adivinación", fr: "Sahih al-Bukhari 3842 — Les scrupules d'Abu Bakr concernant la nourriture obtenue par la divination", tr: "Sahih el-Buhari 3842 — Ebu Bekir'in falcılık yoluyla kazanılan yiyeceklere ilişkin takvası", id: "Sahih al-Bukhari 3842 — Ketakwaan Abu Bakr mengenai makanan yang diperoleh melalui ramalan" }
text: "… عَائِشَةَا ـ قَالَتْ كَانَ لأَبِي بَكْرٍ غُلاَمٌ يُخْرِجُ لَهُ الْخَرَاجَ، وَكَانَ أَبُو بَكْرٍ يَأْكُلُ مِنْ خَرَاجِهِ، فَجَاءَ يَوْمًا بِشَىْءٍ فَأَكَلَ مِنْهُ أَبُو بَكْرٍ فَقَالَ لَهُ الْغُلاَمُ تَدْرِي مَا هَذَا فَقَالَ أَبُو بَكْرٍ وَمَا هُوَ قَالَ كُنْتُ تَكَهَّنْتُ لإِنْسَانٍ فِي الْجَاهِلِيَّةِ وَمَا أُحْسِنُ الْكِهَانَةَ، إِلاَّ أَنِّي خَدَعْتُهُ، فَلَقِيَنِي فَأَعْطَانِي بِذَلِكَ، فَهَذَا الَّذِي أَكَلْتَ مِنْهُ. فَأَدْخَلَ أَبُو …"
summary:
  ar: "خبر في صحيح البخاري، رقم 3842، في ورع أبي بكر عن طعام من كسب الكهانة. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Sahih al-Bukhari, no. 3842, on Abu Bakr's scruple over food earned by soothsaying. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "صحیح بخاری کی روایت نمبر 3842: کہانت کی کمائی کے کھانے سے ابوبکر کا ورع۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3842, sobre el escrúpulo de Abu Bakr respecto a los alimentos obtenidos mediante la adivinación. No utiliza las palabras halal ni haram; el buscador de Halal y Haram lo incluye entre los relatos sobre escrúpulos y la búsqueda de lo lícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 3842, relate les scrupules d'Abu Bakr concernant la nourriture obtenue par la divination. Il n'emploie pas les termes halal ou haram; le Halal and Haram Browser le classe parmi les hadiths relatifs aux scrupules et à la recherche du licite."
  tr: "Sahih el-Buhari'de, 3842 numaralı hadiste, Ebu Bekir'in falcılık yoluyla kazanılan yiyecekler konusundaki takvası hakkında bir hadis bulunmaktadır. Bu hadiste \"helal\" veya \"haram\" terimleri kullanılmamakta olup, takva ve İslam'da helal olanı arama ile ilgili hadisler arasında yer almaktadır."
  id: "Terdapat sebuah hadits dalam Sahih al-Bukhari, nomor 3842, tentang ketakwaan Abu Bakar terkait makanan yang diperoleh melalui ramalan. Hadits ini tidak menggunakan istilah \"halal\" (diperbolehkan) atau \"haram\" (dilarang), dan dikelompokkan dengan hadits-hadits tentang ketakwaan dan mencari apa yang diperbolehkan dalam Islam."
