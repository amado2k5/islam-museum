label: { ar: "صحيح مسلم 5050 — ما كان يُكره", en: "Sahih Muslim 5050 — what used to be disliked", ur: "صحیح مسلم 5050 — جو ناپسند کیا جاتا تھا", fr: "Sahih Muslim 5050 — ce qui était réprouvé", es: "Sahih Muslim 5050 — lo que se reprobaba", tr: "Sahih Muslim 5050 — Hoş karşılanmayanlar", id: "Sahih Muslim 5050 — Apa yang tidak disukai" }
text: "… اللَّهِ بْنُ الْمُغَفَّلِ رَجُلاً مِنْ أَصْحَابِهِ يَخْذِفُ فَقَالَ لَهُ لاَ تَخْذِفْ فَإِنَّ رَسُولَ اللَّهِ كَانَ يَكْرَهُ - أَوْ قَالَ - يَنْهَى عَنِ الْخَذْفِ فَإِنَّهُ لاَ يُصْطَادُ بِهِ الصَّيْدُ وَلاَ يُنْكَأُ بِهِ الْعَدُوُّ وَلَكِنَّهُ يَكْسِرُ السِّنَّ وَيَفْقَأُ الْعَيْنَ. ثُمَّ رَآهُ بَعْدَ ذَلِكَ يَخْذِفُ فَقَالَ لَهُ أُخْبِرُكَ أَنَّ رَسُولَ اللَّهِ كَانَ يَكْرَهُ أَوْ يَنْهَى عَنِ الْخَذْفِ ثُمَّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5050، يرد فيه ذكر ما كان يُكره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 5050 (The Book of Hunting, Slaughter, and what may be Eaten), whose wording mentions what used to be disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 5050، جس کے الفاظ میں جو ناپسند کیا جاتا تھا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 5050, dont le texte mentionne ce qui était réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 5050, cuyo texto menciona lo que se reprobaba. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 5050 numaralı hadis, mekruh sayılan şeylerden bahsetmektedir. Farz, görev, ibadet, tavsiye edilen, mekruh sayılan, haram sayılan ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle bir araya getirir. Derleyen kişi metinde yer alanları açıklar, ancak buna dayanarak dini bir hüküm vermez."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5050, menyebutkan apa yang tidak disukai. Penyusun kitab tentang amalan wajib, kewajiban, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
