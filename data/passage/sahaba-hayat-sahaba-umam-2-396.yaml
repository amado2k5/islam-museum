text: "… من لو امرنى بقتلك لضربت عنقك. وزاد فى آخره: فأسلم حويصة - و أخرجه ايضا ابو داود من طريقه إلا انه اقتصر الى قوله: فى بطنك من ماله ؛ ولم يذكر ما بعده. غزوات بنى قينقاع وبنى النضير وقريظة وماوقع …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 396، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
