text: "… من السابقات إلى الإسلام، أسلمت في أوّل الإسلام، وعَذَّبها المشركون. وقيل: كانت مولاة بني مخزوم، فكان أبو جهل يعذبها. وقيل: كانت مولاة بني عبد الدار، فلما أسلمت عَمِيت، فقال المشركون : أعمتها اللات والعزى لكفرها بهما! فقالت: وما يدري اللات …"
