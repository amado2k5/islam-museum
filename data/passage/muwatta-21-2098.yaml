label: { ar: "الموطأ 2098 — مالك: فيمن اشترى شقصا من أرض مشتركة على أنه بالخيار، فأراد شركاء البائع أخذ ما باع شريكهم بالشفعة قبل أن يختار المشتري: لا يكون لهم ذلك حتى يأخذ المشتري ويثبت له البيع، فإذا وجب له البيع فلهم الشفعة", en: "Muwatta 2098", es: "Muwatta 2098", fr: "Muwatta 2098", ur: "موطا 2098", tr: "Al-Muwatta 2098 — Malik: Ortak mülkiyetteki bir arazinin bir kısmını, seçme hakkı şartıyla satın alan bir kimse hakkında, satıcının ortakları, alıcı seçimini yapmadan önce diğer ortağın sattığı yeri öncelikli satın alma hakkıyla almak isterlerse: Alıcı mülkiyeti devralıp satış onun adına kesinleşene kadar bu hakka sahip değillerdir. Satış onun adına kesinleşirse, o zaman öncelikli satın alma hakkına sahip olurlar.", id: "Al-Muwatta 2098 — Malik: Mengenai seseorang yang membeli bagian dari tanah milik bersama dengan syarat ia memiliki pilihan untuk memilih, dan para mitra penjual ingin mengambil apa yang dijual mitra mereka dengan hak prioritas sebelum pembeli membuat pilihannya: mereka tidak memiliki hak itu sampai pembeli mengambil alih kepemilikan dan penjualan telah disepakati untuknya. Jika penjualan telah disepakati untuknya, maka mereka memiliki hak prioritas." }
summary:
  ar: "قال مالك في رجل اشترى شقصا من أرض مشتركة، على أنه فيها بالخيار، فأراد شركاء البائع أن يأخذوا ما باع شريكهم بالشفعة قبل أن يختار المشتري: إن ذلك لا يكون لهم، حتى يأخذ المشتري ويثبت له البيع. فإذا وجب له البيع، فلهم الشفعة. {cite:muwatta-maruf-1997 p.257}"
  tr: "Malik, ortak mülkiyetteki bir arazinin bir kısmını, satıştan vazgeçme seçeneği şartıyla satın alan bir adam hakkında şunları söyledi: Satıcının ortakları, alıcı seçimini yapmadan önce, ortaklarının sattığı yeri öncelikli satın alma hakkıyla almak istiyorlardı: Alıcı mülkiyeti devralıp satış kesinleşene kadar bunu yapamazlar. Sadece satış kesinleştiğinde öncelikli satın alma hakkına sahip olurlar. {cite:muwatta-maruf-1997 s.257}"
  id: "Malik berkata mengenai seorang pria yang membeli sebagian tanah milik bersama, dengan syarat ia memiliki pilihan untuk membatalkan penjualan, dan mitra penjual ingin mengambil bagian yang telah dijual mitra mereka dengan hak prioritas sebelum pembeli membuat pilihannya: Mereka tidak dapat melakukan hal itu sampai pembeli mengambil alih kepemilikan dan penjualan diselesaikan. Hanya setelah penjualan diselesaikan barulah mereka memiliki hak prioritas. {cite:muwatta-maruf-1997 p.257}"
