label: { ar: "الموطأ 2098 — مالك: فيمن اشترى شقصا من أرض مشتركة على أنه بالخيار، فأراد شركاء البائع أخذ ما باع شريكهم بالشفعة قبل أن يختار المشتري: لا يكون لهم ذلك حتى يأخذ المشتري ويثبت له البيع، فإذا وجب له البيع فلهم الشفعة", en: "Muwatta 2098" }
summary:
  ar: "قال مالك في رجل اشترى شقصا من أرض مشتركة، على أنه فيها بالخيار، فأراد شركاء البائع أن يأخذوا ما باع شريكهم بالشفعة قبل أن يختار المشتري: إن ذلك لا يكون لهم، حتى يأخذ المشتري ويثبت له البيع. فإذا وجب له البيع، فلهم الشفعة. {cite:muwatta-maruf-1997 p.257}"
