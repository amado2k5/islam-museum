label: { ar: "سنن ابن ماجه 1680 — الحجامة", en: "Sunan Ibn Majah 1680 — cupping", ur: "سنن ابن ماجہ 1680 — حجامہ" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُوسُفَ السُّلَمِيُّ، حَدَّثَنَا عُبَيْدُ اللَّهِ، أَنْبَأَنَا شَيْبَانُ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، حَدَّثَنِي أَبُو قِلاَبَةَ، أَنَّ أَبَا أَسْمَاءَ، حَدَّثَهُ عَنْ ثَوْبَانَ، قَالَ: سَمِعْتُ النَّبِيَّ ـ يَقُولُ: \" أَفْطَرَ الْحَاجِمُ وَالْمَحْجُومُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1680، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1680 (Fasting), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1680، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
