label: { ar: "سنن ابن ماجه 1680 — الحجامة", en: "Sunan Ibn Majah 1680 — cupping", ur: "سنن ابن ماجہ 1680 — حجامہ", es: "Sunan Ibn Majah 1680 - catación", fr: "Sunan Ibn Majah 1680 — ventouses", tr: "Sünen İbn Mace 1680 - Hacamat", id: "Sunan Ibnu Majah 1680 — Bekam" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُوسُفَ السُّلَمِيُّ، حَدَّثَنَا عُبَيْدُ اللَّهِ، أَنْبَأَنَا شَيْبَانُ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، حَدَّثَنِي أَبُو قِلاَبَةَ، أَنَّ أَبَا أَسْمَاءَ، حَدَّثَهُ عَنْ ثَوْبَانَ، قَالَ: سَمِعْتُ النَّبِيَّ ـ يَقُولُ: \" أَفْطَرَ الْحَاجِمُ وَالْمَحْجُومُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1680، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1680 (Fasting), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1680، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1680 (Ayuno), menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 1680 (Le jeûne), mentionne la pratique des ventouses. Le Répertoire des ouvrages de médecine le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 1680 numaralı hadiste hacamat uygulamasından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1680, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
