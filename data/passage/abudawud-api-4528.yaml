ref: "4528"
label: { ar: "سنن أبي داود 4528 — ما أُحل", en: "Sunan Abi Dawud 4528 — what was made lawful", ur: "سنن ابی داؤد 4528 — جو حلال کیا گیا", es: "Sunan Abi Dawud 4528: lo que se hizo legal", fr: "Sunan Abi Dawud 4528 — ce qui a été rendu licite", tr: "Sunan Abi Davud 4528 — İzin verilenler", id: "Sunan Abi Dawud 4528 — Apa yang diperbolehkan" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ صَالِحٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، عَنْ مَعْمَرٍ، عَنْ أَيُّوبَ، عَنْ أَبِي قِلاَبَةَ، عَنْ أَنَسٍ، أَنَّ يَهُودِيًّا، قَتَلَ جَارِيَةً مِنَ الأَنْصَارِ عَلَى حُلِيٍّ لَهَا ثُمَّ أَلْقَاهَا فِي قَلِيبٍ وَرَضَخَ رَأْسَهَا بِالْحِجَارَةِ فَأُخِذَ فَأُتِيَ بِهِ النَّبِيُّ فَأَمَرَ بِهِ أَنْ يُرْجَمَ حَتَّى يَمُوتَ فَرُجِمَ حَتَّى مَاتَ. قَالَ أَبُو دَاوُدَ رَوَاهُ ابْنُ جُرَيْجٍ عَنْ أَيُّوبَ نَحْوَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4528، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4528 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4528، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4528 (Tipos de sangre y sabiduría (Kitab Al-Diyat)), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4528 (Types de sang – Kitab Al-Diyat), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 4528 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4528, menyebutkan apa yang diperbolehkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
