label: { ar: "سنن ابن ماجه 1097 — مغفرة ما تقدم من الذنب", en: "Sunan Ibn Majah 1097 — forgiveness of past sins", ur: "سنن ابن ماجہ 1097 — پچھلے گناہوں کی مغفرت" }
text: "… سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ وَدِيعَةَ، عَنْ أَبِي ذَرٍّ، عَنِ النَّبِيِّ ـ قَالَ \" مَنِ اغْتَسَلَ يَوْمَ الْجُمُعَةِ فَأَحْسَنَ غُسْلَهُ، وَتَطَهَّرَ فَأَحْسَنَ طُهُورَهُ، وَلَبِسَ مِنْ أَحْسَنِ ثِيَابِهِ، وَمَسَّ مَا كَتَبَ اللَّهُ لَهُ مِنْ طِيبِ أَهْلِهِ، ثُمَّ أَتَى الْجُمُعَةَ وَلَمْ يَلْغُ وَلَمْ يُفَرِّقْ بَيْنَ اثْنَيْنِ، غُفِرَ لَهُ مَا بَيْنَهُ وَبَيْنَ الْجُمُعَةِ الأُخْرَى \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1097، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1097 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1097، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
