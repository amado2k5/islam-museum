label: { ar: "الموطأ 1881 — مالك: الأمر المجتمع عليه أنه لا تباع الحنطة بالحنطة، ولا التمر بالتمر، ولا الحنطة بالتمر، ولا التمر بالزبيب، ولا شيء من الطعام كله، إلا يدا بيد، فإن دخل شيئا من ذلك الأجل لم يصلح وكان حراما", en: "Muwatta 1881", es: "Muwatta 1881", fr: "Muwatta 1881", ur: "موطا 1881", tr: "El-Muvatta 1881 — Malik: İttihat şudur ki, buğday buğdayla, hurma hurmayla, buğday hurmayla, hurma kuru üzümle veya herhangi bir gıda maddesiyle el ele alışveriş dışında hiçbir şekilde satılmamalıdır. Bu işlemlerden herhangi birinin krediyle yapılması geçersiz ve haramdır.", id: "Al-Muwatta 1881 — Malik: Konsensusnya adalah bahwa gandum tidak boleh dijual dengan gandum, kurma dengan kurma, gandum dengan kurma, kurma dengan kismis, atau makanan apa pun, kecuali secara langsung. Jika salah satu transaksi ini dilakukan secara kredit, maka itu tidak sah dan melanggar hukum." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، أنه لا تباع الحنطة بالحنطة، ولا التمر بالتمر، ولا الحنطة بالتمر، ولا التمر بالزبيب، ولا الحنطة بالزبيب، ولا شيء من الطعام كله، إلا يدا بيد. فإن دخل شيئا من ذلك الأجل لم يصلح، وكان حراما. ولا شيء من الأدم كلها إلا يدا بيد. {cite:muwatta-maruf-1997 p.173} {cite:muwatta-maruf-1997 p.174}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur ki, buğday buğdayla, hurma hurmayla, buğday hurmayla, hurma kuru üzümle, buğday kuru üzümle veya başka herhangi bir gıda maddesiyle elden ele satılmamalıdır. Bunlardan herhangi birinin ödemesi ertelenirse, geçersiz ve yasa dışıdır. Benzer şekilde, başka hiçbir baharat da elden ele satılmamalıdır. {cite:muwatta-maruf-1997 s.173} {cite:muwatta-maruf-1997 s.174}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah gandum tidak boleh dijual dengan gandum, kurma dengan kurma, gandum dengan kurma, kurma dengan kismis, gandum dengan kismis, atau makanan lainnya, kecuali secara langsung. Jika salah satu dari barang-barang ini dikenakan pembayaran tertunda, maka itu tidak sah dan melanggar hukum. Demikian pula, bumbu lainnya tidak boleh dijual kecuali secara langsung. {cite:muwatta-maruf-1997 p.173} {cite:muwatta-maruf-1997 p.174}"
