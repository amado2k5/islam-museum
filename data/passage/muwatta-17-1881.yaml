summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، أنه لا تباع الحنطة بالحنطة، ولا التمر بالتمر، ولا الحنطة بالتمر، ولا التمر بالزبيب، ولا الحنطة بالزبيب، ولا شيء من الطعام كله، إلا يدا بيد. فإن دخل شيئا من ذلك الأجل لم يصلح، وكان حراما. ولا شيء من الأدم كلها إلا يدا بيد. {cite:muwatta-maruf-1997 p.173} {cite:muwatta-maruf-1997 p.174}"
