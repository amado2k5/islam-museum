text: "… كلّ من دخل عليه، ولكان رجل يقال له السَّمَيْلَع الكنلق من بنى ملك بن ربيعة من.. اكنى عُمان يرى رأى الخوارج وكان خرج واصحاب يزيد واصحاب على مصطفُون فلمتزل ومعد نلس من القُراء فقال طائفةً من اصحاب يزيد وطائفة من …"
