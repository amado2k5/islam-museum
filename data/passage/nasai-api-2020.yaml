label: { ar: "سنن النسائي 2020 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan al-Nasa'i 2020 — mentions of non-Muslim nations, religions and peoples", ur: "سنن نسائی 2020 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan al-Nasa'i 2020: menciones de naciones, religiones y pueblos no musulmanes.", fr: "Sunan al-Nasa'i 2020 — mentions de nations, religions et peuples non musulmans", tr: "Sunan an-Nasa'i 2020 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sunan an-Nasa'i 2020 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "أَخْبَرَنَا الْحُسَيْنُ بْنُ حُرَيْثٍ، قَالَ حَدَّثَنَا الْفَضْلُ بْنُ مُوسَى، عَنِ الْحُسَيْنِ بْنِ وَاقِدٍ، قَالَ حَدَّثَنَا عَمْرُو بْنُ دِينَارٍ، قَالَ سَمِعْتُ جَابِرًا، يَقُولُ : إِنَّ النَّبِيَّ أَمَرَ بِعَبْدِ اللَّهِ بْنِ أُبَىٍّ فَأَخْرَجَهُ مِنْ قَبْرِهِ، فَوَضَعَ رَأْسَهُ عَلَى رُكْبَتَيْهِ فَتَفَلَ فِيهِ مِنْ رِيقِهِ، وَأَلْبَسَهُ قَمِيصَهُ. قَالَ جَابِرٌ : وَصَلَّى عَلَيْهِ وَاللَّهُ أَعْلَمُ."
summary:
  ar: "حديث في سنن النسائي، رقم 2020، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2020 (The Book of Funerals), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 2020، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sunan al-Nasa'i, n.º 2020 (El Libro de los Funerales), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan al-Nasa'i, n° 2020 (Le Livre des funérailles), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sunan-ı Nesai'de yer alan 2020 numaralı hadiste, gayrimüslim milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2020, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh peramban yang khusus mempelajari bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
