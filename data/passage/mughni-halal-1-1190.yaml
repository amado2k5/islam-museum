text: "… لليتيم أضحية إذا كان له مال قرض مال التييم إذا ادعى الولى الإنفاق على الصبى، أو على ماله، أو عقاره، بالمعروف من ماله،... إذا اشترى ممن فى ماله حرام وحلال... كل مالين حرم النساء فيهما، لا يجوز إسلام أحدهما فى …"
