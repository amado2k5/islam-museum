label: { ar: "جامع الترمذي 1116 — مضاعفة الأجر", en: "Jami' al-Tirmidhi 1116 — the reward doubled or multiplied", ur: "جامع ترمذی 1116 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… الشَّعْبِيِّ، عَنْ أَبِي بُرْدَةَ بْنِ أَبِي مُوسَى، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثَةٌ يُؤْتَوْنَ أَجْرَهُمْ مَرَّتَيْنِ عَبْدٌ أَدَّى حَقَّ اللَّهِ وَحَقَّ مَوَالِيهِ فَذَلِكَ يُؤْتَى أَجْرَهُ مَرَّتَيْنِ وَرَجُلٌ كَانَتْ عِنْدَهُ جَارِيَةٌ وَضِيئَةٌ فَأَدَّبَهَا فَأَحْسَنَ أَدَبَهَا ثُمَّ أَعْتَقَهَا ثُمَّ تَزَوَّجَهَا يَبْتَغِي بِذَلِكَ وَجْهَ اللَّهِ فَذَلِكَ يُؤْتَى أَجْرَهُ مَرَّتَيْنِ وَرَجُلٌ آمَنَ بِالْكِتَابِ الأَوَّلِ ثُمَّ جَاءَ الْكِتَابُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1116، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 1116 (The Book on Marriage), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 1116، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
