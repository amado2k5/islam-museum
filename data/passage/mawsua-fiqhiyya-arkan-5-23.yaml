text: "… أخرجه عبد اللّه بن المبارك في الزهد ص نشر دار الكتب العلمية، وذكره ابن الأثير في النهاية في غريب الحديث ط دار الفكر. تِفاق - لِلَإِيمَنِ قال: وللنفاق شعب، وقد يجتمع مع شُعَبِ النفاق شعبٌ من الإيمان، ومن كان معه …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 5، ص 23، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 5, p. 23, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 5، ص 23 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 5, pág. 23, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (tome 5, p. 23) mentionnant les branches de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 5, sayfa 23'ten, dinin dallarını ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, dinin dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 5 Bergambar, halaman 23, yang menyebutkan cabang-cabang iman; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
