text: "صفة القرآن، ولما فتح المسلمون الشام كان ممن أرسلهم عمر بن الخطاب إلى الشام؛ ليعلموا الناس القرآن ويفقهوهم في الدين، وأقام بحمص، ثم صار إلى فلسطين، وهو أول من ولي قضاء فلسطين. انظر : (الاستيعاب) ٣٥٥/٢، «أسد الغابة) ١٦٠/٣ ،"
