text: "… وابن عساكر عن عبادة بن محمد بن عبادة بن الصامت قال: لما حضرت عبادة الوفاة قال: اخرجوا الىّ موالى و خدمى وجيرانى ومن كان يدخل علىّ ! فجمعوا له فقال: ان يومى هذا لا اراه الا آخر يوم يأتى علىّ …"
