text: "… الناس فقيراً إلى ربه قال قتادة تلك أخلاق المؤمنين وهو أحسن الناس معرفة وأهونه مؤنة. حدثنا عبدالله حدثني أحمد بن إبراهيم الدور قي حدثنا بهز حدثنا مهدي حدثنا فيلان عن رجل إن لم يكن مطرفا فلا أدري مسن هو عدن …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 3، ص 295، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
