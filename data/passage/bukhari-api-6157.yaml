text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا الْحَكَمُ، عَنْ إِبْرَاهِيمَ، عَنِ الأَسْوَدِ، عَنْ عَائِشَةَا ـ قَالَتْ أَرَادَ النَّبِيُّ أَنْ يَنْفِرَ فَرَأَى صَفِيَّةَ عَلَى باب خِبَائِهَا كَئِيبَةً حَزِينَةً لأَنَّهَا حَاضَتْ فَقَالَ \" عَقْرَى حَلْقَى ـ لُغَةُ قُرَيْشٍ ـ إِنَّكِ لَحَابِسَتُنَا \" ثُمَّ قَالَ \" أَكُنْتِ أَفَضْتِ يَوْمَ النَّحْرِ \". يَعْنِي الطَّوَافَ قَالَتْ نَعَمْ. قَالَ \" فَانْفِرِي إِذًا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6157، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6157 (Good Manners and Form (Al-Adab)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 6157، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
