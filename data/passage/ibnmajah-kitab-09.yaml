summary:
  ar: "القسم 9 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النكاح»، ويضم فيها النصوص من 1845 إلى 2015 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 9 of Sunan Ibn Majah (The Chapters on Marriage) in the division of the open hadith dataset the museum took its reports from: reports 1845 to 2015 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 9، عنوان «کتاب النکاح»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1845 تا 2015۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 9 de Sunan Ibn Majah (Los capítulos sobre el matrimonio) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1845 al 2015, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Ibn Majah (Livre 9, chapitres sur le mariage), qui comprend les hadiths 1845 à 2015 selon la numérotation de ce recueil. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
