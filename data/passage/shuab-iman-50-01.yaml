label: { ar: "شعب الإيمان 50 — ثلاث يرضاها الله ويكرهها", en: "Shu'ab al-Iman, branch 50 — three things God is pleased with and three He dislikes", es: "Shu'ab al-Iman, rama 50 — Tres cosas que agradan a Dios y tres que le desagradan", fr: "Shu'ab al-Iman, branche 50 — trois choses qui plaisent à Dieu et trois qui lui déplaisent", ur: "شعب الایمان، شاخ 50 - تین چیزیں خدا کو پسند ہے اور تین چیزیں ناپسند ہیں۔", tr: "İmanlı İnsanlar 50 — Tanrı'nın onayladığı ve onaylamadığı üç şey", id: "Orang Beriman 50 — Tiga hal yang disetujui dan tidak disukai Tuhan" }
summary:
  ar: "حديث أبي هريرة في باب التمسك بما عليه الجماعة، وهو أول أحاديث الشعبة الخمسين في الجزء العاشر من طبعة دار الرشد؛ يذكر أن الله يرضى ثلاثاً ⁦(عبادته وحده وعدم الإشراك به، والاعتصام بحبله جميعاً وعدم التفرق، ونصيحة من ولاّه أمر المسلمين)⁩ ويكره ثلاثاً ⁦(قيل وقال، وكثرة السؤال، وإضاعة المال)⁩. أسنده البيهقي عن إسحاق بن إبراهيم عن جرير عن سهيل عن أبيه عن أبي هريرة بعد طريق القعنبي عن مالك عن سهيل."
  en: "Abu Hurayra's report that opens branch 50 (adherence to the community) in volume 10 of the Dar al-Rushd edition. It says God is pleased with three things (worshipping Him alone without partners, holding fast together to His rope and not dividing, and giving sincere counsel to whoever holds authority over the Muslims) and dislikes three (idle talk, excessive questioning, and wasting property). Al-Bayhaqi cites it through al-Qa'nabi from Malik and through Jarir from Suhayl from his father from Abu Hurayra; the scan prints it as number 7089."
  es: "El informe de Abu Hurayra abre la rama 50 (adherencia a la comunidad) en el volumen 10 de la edición Dar al-Rushd. Dice que Dios se complace con tres cosas (adorarlo solo a Él sin socios, permanecer unidos a Su cuerda y no dividirse, y dar consejo sincero a quien tenga autoridad sobre los musulmanes) y desaprueba tres (la charla ociosa, el cuestionamiento excesivo y el derroche de bienes). Al-Bayhaqi lo cita a través de al-Qa'nabi de Malik y a través de Jarir de Suhayl de su padre de Abu Hurayra; el escaneo lo imprime como el número 7089."
  fr: "Le hadith d'Abu Hurayra, qui ouvre la branche 50 (l'attachement à la communauté) dans le volume 10 de l'édition Dar al-Rushd, indique que Dieu agrée trois choses (L'adoration exclusive sans associés, l'union sans faille à Sa corde et le conseil sincère prodigué à celui qui détient l'autorité sur les musulmans) et en déteste trois (les paroles vaines, les questions excessives et le gaspillage des biens). Al-Bayhaqi le cite par l'intermédiaire d'al-Qa'nabi, d'après Malik, et par l'intermédiaire de Jarir, d'après Suhayl, d'après son père, d'après Abu Hurayra; le document numérisé porte le numéro 7089."
  ur: "ابو ہریرہ کی رپورٹ جو دارالرشد ایڈیشن کی جلد 10 میں شاخ 50 ⁦(کمیونٹی کی پابندی)⁩ کھولتی ہے۔ اس میں کہا گیا ہے کہ خدا تین چیزوں سے راضی ہے ⁦(بغیر کسی شریک کے اس کی عبادت کرنا، اس کی رسی کو مضبوطی سے پکڑنا اور تفرقہ نہیں ڈالنا، اور جو مسلمانوں پر حاکم ہے اسے مخلصانہ نصیحت کرنا)⁩ اور تین چیزوں کو ناپسند کرتا ہے ⁦(فضول گفتگو، حد سے زیادہ سوال کرنا اور مال ضائع کرنا)⁩۔ بیہقی نے اسے قنبی کے ذریعے مالک سے اور جریر نے سہیل سے اپنے والد ابوہریرہ سے نقل کیا ہے۔ اسکین اسے نمبر 7089 کے طور پر پرنٹ کرتا ہے۔"
  tr: "Dar al-Rushd'un onuncu cildindeki elli hadisin ilki olan, ümmetin ittifakına bağlı kalma bölümündeki Ebu Hurayra hadisinde, Allah'ın üç şeyden hoşnut olduğu belirtilir: Yalnızca O'na ibadet etmek ve O'na hiçbir şeyi ortak koşmamak, O'nun ipine sımsıkı sarılmak ve bölünmemek, Müslümanların işlerinden sorumlu olana samimi nasihatte bulunmak. Üç şeyden ise hoşlanmaz: Dedikodu, aşırı soru sormak ve para israf etmek. Bu hadis, Beyhaki tarafından İshak ibn İbrahim'den, Cerir'den, Suhayl'den, babasından, Ebu Hurayra'dan, Kanabi'den, Malik'ten, Suhayl'den rivayet edilmiştir."
  id: "Hadits Abu Hurayrah, dalam bab tentang berpegang teguh pada konsensus masyarakat, yang merupakan hadits pertama dari lima puluh hadits dalam jilid kesepuluh edisi Dar al-Rushd, menyatakan bahwa Allah ridha dengan tiga hal: menyembah-Nya semata dan tidak menyekutukan-Nya dengan sesuatu pun, berpegang teguh pada tali-Nya dan tidak berpecah belah, serta memberikan nasihat yang tulus kepada orang yang bertanggung jawab atas urusan kaum Muslimin. Allah tidak menyukai tiga hal: gosip, terlalu banyak bertanya, dan menghambur-hamburkan uang. Hadits ini diriwayatkan oleh al-Bayhaqi dari Ishaq bin Ibrahim, dari Jarir, dari Suhayl, dari ayahnya, dari Abu Hurayrah, setelah sanad al-Qa'nabi, dari Malik, dari Suhayl."
