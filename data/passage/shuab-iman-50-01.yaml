summary:
  ar: "حديث أبي هريرة في باب التمسك بما عليه الجماعة، وهو أول أحاديث الشعبة الخمسين في الجزء العاشر من طبعة دار الرشد؛ يذكر أن الله يرضى ثلاثاً (عبادته وحده وعدم الإشراك به، والاعتصام بحبله جميعاً وعدم التفرق، ونصيحة من ولاّه أمر المسلمين) ويكره ثلاثاً (قيل وقال، وكثرة السؤال، وإضاعة المال). أسنده البيهقي عن إسحاق بن إبراهيم عن جرير عن سهيل عن أبيه عن أبي هريرة بعد طريق القعنبي عن مالك عن سهيل."
  en: "Abu Hurayra's report that opens branch 50 (adherence to the community) in volume 10 of the Dar al-Rushd edition. It says God is pleased with three things (worshipping Him alone without partners, holding fast together to His rope and not dividing, and giving sincere counsel to whoever holds authority over the Muslims) and dislikes three (idle talk, excessive questioning, and wasting property). Al-Bayhaqi cites it through al-Qa'nabi from Malik and through Jarir from Suhayl from his father from Abu Hurayra; the scan prints it as number 7089."
