text: "الفصل الحادي عشر في علوم القرآن من التفسير والقراءات القرآن هو كلام الله المنزل على نبيه، المكتوب بين دفتي المصحف، وهو متواتر بين الأمة، إلَّا أن الصحابة رووه عن رسول الله لالِيِ على طرق مختلفة في بعض ألفاظه وكيفيات الحروف …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 444، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 1, p. 444, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 1، ص 444 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 1, pág. 444, que menciona las lecturas del Corán, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de la Muqaddima d'Ibn Khaldoun (tome 1, p. 444) mentionnant les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
