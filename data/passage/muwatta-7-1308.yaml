label: { ar: "الموطأ 1308 — مالك: إذا حاز المشركون غلام رجل ثم غنمه المسلمون فصاحبه أولى به بغير ثمن ولا قيمة ما لم تصبه المقاسم", en: "Muwatta 1308", es: "Muwatta 1308", fr: "Muwatta 1308", ur: "موطا 1308", tr: "El-Muvatta 1308 — Malik: Eğer müşrikler bir adamın kölesini ele geçirir ve Müslümanlar onu savaş ganimeti olarak alırlarsa, köle sahibi, ganimetin paylaşımına dahil edilmediği sürece, bedelsiz ve değersiz olarak köle üzerinde ilk hakka sahiptir.", id: "Al-Muwatta 1308 — Malik: Jika kaum musyrik merebut budak seseorang dan kemudian kaum Muslim mengambilnya sebagai rampasan perang, maka pemiliknya memiliki hak pertama atas budak tersebut tanpa harga atau nilai, kecuali jika ia termasuk dalam pembagian rampasan perang." }
summary:
  ar: "سئل مالك عن رجل حاز المشركون غلامه ثم غنمه المسلمون. فقال صاحبه أولى به بغير ثمن ولا قيمة ما لم تصبه المقاسم، فإن وقعت فيه المقاسم فإنه يرى أن يكون الغلام لسيده بالثمن إن شاء. {cite:muwatta-maruf-1997 p.583}"
  tr: "Malik'e, kölesi müşrikler tarafından esir alınan ve daha sonra Müslümanlar tarafından ganimet olarak alınan bir adam hakkında soru soruldu. Malik, kölenin ganimetin paylaşımına dahil edilmediği sürece, sahibinin ona bedelsiz ve fiyatsız olarak ilk önce sahip olma hakkına sahip olduğunu söyledi. Eğer paylaşıma dahil edilirse, kölenin efendisinin dilerse bir bedel karşılığında ona ait olması gerektiğine inanıyordu. {cite:muwatta-maruf-1997 s.583}"
  id: "Malik ditanya tentang seorang pria yang budaknya ditangkap oleh kaum politeis dan kemudian diambil sebagai rampasan perang oleh kaum Muslim. Dia berkata bahwa pemiliknya memiliki hak pertama atas budaknya tanpa harga atau nilai, kecuali jika budak tersebut termasuk dalam pembagian rampasan perang. Jika budak tersebut termasuk dalam pembagian, maka menurutnya budak tersebut seharusnya menjadi milik tuannya dengan harga tertentu jika tuannya memilih demikian. {cite:muwatta-maruf-1997 p.583}"
