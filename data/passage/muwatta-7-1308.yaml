summary:
  ar: "سئل مالك عن رجل حاز المشركون غلامه ثم غنمه المسلمون. فقال صاحبه أولى به بغير ثمن ولا قيمة ما لم تصبه المقاسم، فإن وقعت فيه المقاسم فإنه يرى أن يكون الغلام لسيده بالثمن إن شاء. {cite:muwatta-maruf-1997 p.583}"
