label: { ar: "سنن النسائي 4987 — حلاوة الإيمان وكماله، خصال من كنّ فيه", en: "Sunan al-Nasa'i 4987 — the sweetness and completeness of faith; traits that, found in a person, mark faith", ur: "سنن نسائی 4987 — ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں" }
text: "… مَنْصُورٍ، عَنْ طَلْقِ بْنِ حَبِيبٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثٌ مَنْ كُنَّ فِيهِ وَجَدَ بِهِنَّ حَلاَوَةَ الإِيمَانِ وَطَعْمَهُ أَنْ يَكُونَ اللَّهُ عَزَّ وَجَلَّ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا وَأَنْ يُحِبَّ فِي اللَّهِ وَأَنْ يُبْغِضَ فِي اللَّهِ وَأَنْ تُوقَدَ نَارٌ عَظِيمَةٌ فَيَقَعُ فِيهَا أَحَبَّ إِلَيْهِ مِنْ أَنْ يُشْرِكَ بِاللَّهِ شَيْئًا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4987، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 4987 (The Book Of Faith and its Signs), that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 4987، جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
