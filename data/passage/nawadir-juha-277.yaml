text: "… إن كان هذا اللحم فأين الهرُّ، وإنْ كان الهرُّ فأين اللحم؟ ابتاع يوماً ثلاث أُقَّات لحم، وأخذها إلى البيت، وذهب إلى شغلِه. فما كان من امرأته إلَّا أن جمعت جاراتها وعملت لهنَّ مأدبة شائقةً بذلك اللحم. وعاد الشيخ في المساء، …"
summary:
  ar: "اشترى جحا ثلاث أواق لحم فأكلته زوجته وصديقاتها وأكمل الهر الباقي، فوزن جحا الهر فوجد وزنه ثلاث أواق، فسأل زوجته أين ذهب اللحم إن كان هذا وزن الهر. {cite:juha-nawadir-kubra-djuwaydi p. 136}"
  en: "Juha buys three oqqa of meat, and his wife and her women friends eat the meat, and the cat finishes the rest. Juha weighs the cat and finds it weighs three oqqa, and he asks his wife where the meat went if the weight is the cat's. {cite:juha-nawadir-kubra-djuwaydi p. 136}"
  ur: "جحا تین اوقیہ گوشت خریدتا ہے تو اس کی بیوی اور اس کی سہیلیاں گوشت کھا جاتی ہیں اور بلی باقی ختم کر دیتی ہے۔ جحا بلی کو تولتا ہے تو اس کا وزن تین اوقیہ نکلتا ہے، اور وہ بیوی سے پوچھتا ہے کہ اگر یہ بلی کا وزن ہے تو گوشت کہاں گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 136}"
  fr: "Juha achète trois oqqa de viande, et sa femme et ses amies mangent la viande, puis le chat finit le reste. Juha pèse le chat et trouve qu'il pèse trois oqqa, et il demande à sa femme où est passée la viande si ce poids est celui du chat. {cite:juha-nawadir-kubra-djuwaydi p. 136}"
  es: "Juha compra tres oqqa de carne, y su esposa y sus amigas se comen la carne, y el gato acaba el resto. Juha pesa al gato y descubre que pesa tres oqqa, y pregunta a su esposa adónde fue la carne si ese peso es el del gato. {cite:juha-nawadir-kubra-djuwaydi p. 136}"
