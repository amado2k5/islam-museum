text: "ا بد أن يمتحن عباده بالسراء والضراء والمشقة رسوله، ولولا أن في كتابه وسنة رسوله فصل النزاع لما أمر بالحق فإنه يمتحن. لما ذكر نعمته العظيمة بإنزال الكتب على أهل الكتاب، انقلبت المحنة في حقه منحة، والمشقات راحات، وأعقبه ٩٥"
