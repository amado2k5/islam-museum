label:
  ar: لبيد، مراثي أربد ⁦(البيت 1.2)⁩
  en: Labid's elegies for Arbad, line 1.2
  es: "Elegías de Labid para Arbad, línea 1.2"
  fr: "Élégies de Labid pour Arbad, vers 1.2"
  ur: "ارباد کے لیے لیبڈ کی خوبیاں، لائن 1.2"
  tr: "Labid, İrbid'in Mersiyeleri (Ayet 1.2)"
  id: "Labid, Elegi Irbid (Ayat 1.2)"
text: أخشى على أربدَ الحتوفَ ولا أرهب نوءَ السماكِ والأسدِ
summary:
  ar: بيت من مراثي لبيد في أخيه أربد، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.404}}. ينقل ابن هشام هذه المراثي عن ابن إسحاق، ويذكر أن بعض أبياتها عن أبي عبيدة أو عن غير ابن إسحاق.
  en: 'The second line of the same piece: Labid fears death''s calamities for Arbad and does not dread the rising of the stars.'
  es: "La segunda línea del mismo texto: Labid teme las calamidades de la muerte para Arbad y no teme el ascenso de las estrellas."
  fr: "Deuxième vers du même texte: Labid craint les calamités de la mort pour Arbad et ne redoute pas le lever des étoiles."
  ur: "اسی تحریر کی دوسری سطر: لبید اربد کے لیے موت کی آفات سے ڈرتا ہے اور ستاروں کے طلوع ہونے سے نہیں ڈرتا۔"
  tr: "Wüstenfeld'in baskısında bulunan Labid'in kardeşi Arbad için yazdığı mersiyelerden bir dize {{cite:ibn-hisham-wustenfeld-1858 s.404}}. İbn Hişam bu mersiyeleri İbn İshak'tan alıntılamış ve bazı dizelerinin Ebu Ubeyde'den veya İbn İshak'tan başka birinden olduğunu belirtmiştir."
  id: "Sebuah bait dari elegi Labid untuk saudaranya Arbad, sebagaimana terdapat dalam edisi Wüstenfeld {{cite:ibn-hisham-wustenfeld-1858 p.404}}. Ibn Hisham mengutip elegi-elegi ini dari Ibn Ishaq, dan menyebutkan bahwa beberapa baitnya berasal dari Abu Ubaidah atau dari orang lain selain Ibn Ishaq."
translations:
