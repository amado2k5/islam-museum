label: { ar: "الموطأ 2484 — مالك: المرأة الحامل إذا قتلت ولم تقد حتى تضع", en: "Muwatta 2484", es: "Muwatta 2484", fr: "Muwatta 2484", ur: "موطا 2484", tr: "Al-Muwatta 2484 — Malik: Hamile bir kadın öldürülür ve doğum yapana kadar adalete teslim edilmezse", id: "Al-Muwatta 2484 — Malik: Jika seorang wanita hamil dibunuh dan tidak dibawa ke pengadilan sampai dia melahirkan" }
summary:
  ar: "قال مالك: إذا قتلت المرأة رجلا أو امرأة عمدا، والتي قتلت حامل، لم يُقد منها حتى تضع حملها. وإن قُتلت المرأة وهي حامل عمدا أو خطأ، فليس على من قتلها في جنينها شيء؛ إن قُتلت عمدا قُتل الذي قتلها، وليس في جنينها دية. وإن قُتلت خطأ فعلى عاقلة قاتلها ديتها، وليس في جنينها دية. {cite:muwatta-maruf-1997 p.425}"
  tr: "Malik şöyle dedi: Bir kadın kasten bir erkeği veya başka bir kadını öldürürse ve öldürdüğü kadın hamile ise, doğum yapana kadar misillemeye tabi değildir. Hamile bir kadın kasten veya kasıtsız öldürülürse, onu öldüren kişi doğmamış çocuğuyla ilgili hiçbir şeyden sorumlu değildir. Kasten öldürülürse, onu öldüren kişi idam edilir ve doğmamış çocuğu için kan parası ödenmez. Kasıtsız öldürülürse, öldürenin klanı kan parasından sorumludur ve doğmamış çocuğu için kan parası ödenmez. {cite:muwatta-maruf-1997 s.425}"
  id: "Malik berkata: Jika seorang wanita dengan sengaja membunuh seorang pria atau wanita lain, dan wanita yang dibunuhnya sedang hamil, dia tidak akan dikenai pembalasan sampai dia melahirkan. Jika seorang wanita hamil dibunuh dengan sengaja atau tidak sengaja, orang yang membunuhnya tidak bertanggung jawab atas apa pun yang berkaitan dengan anak yang belum lahir. Jika dia dibunuh dengan sengaja, orang yang membunuhnya harus dihukum mati, dan tidak ada uang darah yang harus dibayarkan untuk anak yang belum lahir. Jika dia dibunuh tanpa sengaja, klan si pembunuh bertanggung jawab atas uang darahnya, dan tidak ada uang darah yang harus dibayarkan untuk anak yang belum lahir. {cite:muwatta-maruf-1997 p.425}"
