label: { ar: "الموطأ 2484 — مالك: المرأة الحامل إذا قتلت ولم تقد حتى تضع", en: "Muwatta 2484" }
summary:
  ar: "قال مالك: إذا قتلت المرأة رجلا أو امرأة عمدا، والتي قتلت حامل، لم يُقد منها حتى تضع حملها. وإن قُتلت المرأة وهي حامل عمدا أو خطأ، فليس على من قتلها في جنينها شيء؛ إن قُتلت عمدا قُتل الذي قتلها، وليس في جنينها دية. وإن قُتلت خطأ فعلى عاقلة قاتلها ديتها، وليس في جنينها دية. {cite:muwatta-maruf-1997 p.425}"
