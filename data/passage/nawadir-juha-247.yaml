label: { ar: "نوادر جحا الكبرى، ص 120 — «نصحتك كي لا تقع بمثل هذه الورطة\")»", en: "Nawadir Juha al-Kubra, p. 120 — 'I Advised You So You Would Not Fall into Such a Trap'", ur: "نوادر جحا الکبریٰ، ص 120 — «میں نے تمہیں نصیحت کی کہ تم ایسے جال میں نہ پھنسو»", fr: "Nawadir Juha al-Kubra, p. 120 — « Je t'ai conseillé pour que tu ne tombes pas dans un tel piège »", es: "Nawadir Juha al-Kubra, p. 120 — «Te aconsejé para que no cayeras en una trampa así»", tr: "Juha'nın Büyük Fıkraları, s. 120 — “Böyle bir duruma düşmemeniz için size tavsiyede bulundum.”", id: "Anekdot-Anekdot Hebat Juha, hlm. 120 — “Aku menasihatimu agar kamu tidak jatuh ke dalam kesulitan seperti itu.”" }
text: "… نصحتُك كي لا تقع بمثل هذه الورطة كان حاكم مدينة آقَ شَهْرٌ ميالاً إلى امرأته كثيراً حتى أنَّها كانت تتدخّل في شؤون الحكومةِ والعزل والنصب. فراجع بعض الأكابر الشيخ وقالوا له : نرجو أن تدبِّر لنا طريقة لهذه المعضلة. فأخذ …"
summary:
  ar: "في آق شهر كان الوالي تحكمه زوجته، فطلب الأعيان من جحا المساعدة، فضرب جحا أمثلة في لقاءاته مع الوالي فتصحح، ثم استضافت زوجة الوالي جحا وطلبت منه أن يحملها على سرج ورآهما الوالي من الباب، فقال جحا إنه نصحه كي لا يقع في مثل هذه الورطة كما وقع هو. {cite:juha-nawadir-kubra-djuwaydi p. 120}"
  en: "In Akshehir the governor is ruled by his wife, and the notables ask Juha to help. Juha gives examples in his meetings with the governor, who corrects himself. The governor's wife then takes Juha as a guest and asks him to carry her on a saddle, and the governor sees them through the door. Juha says he advised the governor so that he would not fall into such a trap as Juha himself had. {cite:juha-nawadir-kubra-djuwaydi p. 120}"
  ur: "آق شہر میں والی پر اس کی بیوی کا حکم چلتا ہے اور معززین جحا سے مدد مانگتے ہیں۔ جحا والی سے ملاقاتوں میں مثالیں دیتا ہے اور والی اپنی اصلاح کر لیتا ہے۔ پھر والی کی بیوی جحا کو مہمان بناتی ہے اور اس سے کہتی ہے کہ اسے زین پر اٹھائے، اور والی انہیں دروازے سے دیکھ لیتا ہے۔ جحا کہتا ہے کہ اس نے والی کو اس لیے نصیحت کی تھی کہ وہ ایسے جال میں نہ پھنسے جیسے وہ خود پھنسا۔ {cite:juha-nawadir-kubra-djuwaydi p. 120}"
  fr: "À Akshehir, le gouverneur est dominé par sa femme, et les notables demandent à Juha de l'aider. Juha donne des exemples lors de ses rencontres avec le gouverneur, qui se corrige. La femme du gouverneur reçoit ensuite Juha comme invité et lui demande de la porter sur une selle, et le gouverneur les voit par la porte. Juha dit qu'il avait conseillé le gouverneur pour qu'il ne tombe pas dans un piège comme celui où il était tombé lui-même. {cite:juha-nawadir-kubra-djuwaydi p. 120}"
  es: "En Akshehir el gobernador es dominado por su esposa, y los notables piden ayuda a Juha. Juha da ejemplos en sus reuniones con el gobernador, que se corrige. La esposa del gobernador recibe entonces a Juha como invitado y le pide que la lleve sobre una silla, y el gobernador los ve por la puerta. Juha dice que aconsejó al gobernador para que no cayera en una trampa como la que él mismo había caído. {cite:juha-nawadir-kubra-djuwaydi p. 120}"
  tr: "Ak Şahr'da vali, karısı tarafından yönetiliyordu. İleri gelenler Juha'dan yardım istediler ve Juha, valiyle yaptığı görüşmelerde örnekler verdi; bu örnekler daha sonra düzeltildi. Ardından valinin karısı Juha'yı ağırladı ve ondan kendisini eyerde taşımasını istedi. Vali onları kapıdan gördü ve Juha, kendisinin de düştüğü gibi bir duruma düşmemesi için ona tavsiyelerde bulunduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 120}"
  id: "Di Aq Shahr, gubernur diperintah oleh istrinya. Para tokoh terkemuka meminta bantuan Juha, dan Juha memberikan contoh dalam pertemuannya dengan gubernur, yang kemudian dikoreksi. Kemudian istri gubernur menjamu Juha dan memintanya untuk menggendongnya di atas pelana. Gubernur melihat mereka dari pintu, dan Juha mengatakan bahwa ia telah menasihatinya agar ia tidak jatuh ke dalam kesulitan seperti yang dialaminya. {cite:juha-nawadir-kubra-djuwaydi p. 120}"
