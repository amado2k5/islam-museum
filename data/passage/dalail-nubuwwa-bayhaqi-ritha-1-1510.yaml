text: "… هذا عامر بن فهيرة فقال : لقد رأيته بعدما قُتل رفع إلى السماء حتى إني لأنظر الى السماء بينه وبين الأرض، قال : فأتى النبي وَطِفِ خبرهم، فنعاهم، وقال : أن أصحابكم أصيبوا وأنهم قد سألوا ربهم فقالوا ربنا أخبر …"
summary:
  ar: "مقطع من دلائل النبوة، المجلد المصوَّر 1، ص 1510، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Dalail al-Nubuwwa, scan volume 1, p. 1510, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "دلائل النبوۃ، اسکین جلد 1، ص 1510 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Dalail al-Nubuwwa, volume numérisé 1, p. 1510, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Dalail al-Nubuwwa, volumen escaneado 1, p. 1510, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Peygamberliğin İşaretleri, Resimli Cilt 1, sayfa 1510'dan bir alıntı; bir ağıt ve ölüm duyurusu içeriyor; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Tanda-Tanda Kenabian, Jilid Bergambar 1, halaman 1510, berisi pidato penghormatan dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari kumpulan elegi dan pidato penghormatan paling terkenal."
