text: "… لحرف موافق خطّ المصحف فقراءته جائزة في الصلاة. وقالٍ أبو أحمد الفَرَضي راتِب المسجد : صلّى مع الناس، وكان ابن مُقَسِّم قد وَلَّى ظهره القبلة، وهو يصلِّي مُسْتَدبِرَها، فأوَّلْتُ ذلك ما اختاره لنفسه من القراءآت. تُوُفِّي ابن مُقَسِّم في ربيع …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 29، ص 115، يذكر قراءات القرآن، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 29, p. 115, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 29، ص 115 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
