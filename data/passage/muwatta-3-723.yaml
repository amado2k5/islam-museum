label: { ar: "الموطأ 723 — بلاغ: عمر بن عبد العزيز فيمن منع زكاة ماله: دعه ولا تأخذ منه زكاة مع المسلمين، ثم لما أداها: خذها منه", en: "Muwatta 723" }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عاملاً لعمر بن عبد العزيز كتب إليه يذكر أن رجلاً منع زكاة ماله، فكتب إليه عمر: دعه ولا تأخذ منه زكاة مع المسلمين. فبلغ ذلك الرجل فاشتد عليه وأدى بعد ذلك زكاة ماله، فكتب العامل إلى عمر يذكر له ذلك، فكتب إليه عمر: خذها منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.362} {cite:muwatta-maruf-1997 p.363}"
