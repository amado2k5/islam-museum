text: "باب: - كتاب الجنائز سمعتُ أبا وائل عند موته يقول: إذا أنا مِتُ فلا تؤذنوا بي أحداً. - حدثنا أبو داود عن شعبة عن أبي إسحاق قال: أوصى أبو مَيْسرة أخاه: أن لا تؤذن بي أحداً قال أبو إسحاق: وبذلك …"
