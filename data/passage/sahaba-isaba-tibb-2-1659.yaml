text: "باب الكنى حرف الخاء المعجمة قال: الْتَمِسُوا الخَيْرَ عِنْدَ حِسَانِ الوُجُوهِ. رسول اللّٰه ول قه ا رأيت رُقى نرقي بها وأدوية نتداوى بها... الحديث؟. وبه أن رسول اللّٰه وتلفي كان يقول: إذا خَرَجَ أَحَدُكُمْ مِنْ بَيْتِهِ فَلْيَقُلْ لاَ حَوْلَ وَلَاَ …"
