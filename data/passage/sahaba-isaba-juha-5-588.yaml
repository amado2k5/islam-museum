  tr: "\"Al-Isabah fi Tamyiz al-Sahaba\" (Sahabeleri Ayırt Etme) adlı eserin 5. cildinin 588. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
