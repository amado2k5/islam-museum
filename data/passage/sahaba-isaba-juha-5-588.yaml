text: "… زيد بن أسلم مرسلا وقال ابن عبد البر ان صاحب هذه القصة هو ابن النعيان وفيه نظر وقد تقدم فى ترجمة مروان ابن قيس السلمى ان صاحب القصة النعيمان وكذا ذكره الزبير بن بكار فى كتاب الفكاهة والمزاج من طريق …"
summary:
  ar: "مقطع من الإصابة في تمييز الصحابة، المجلد المصوَّر 5، ص 588، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Isaba fi Tamyiz al-Sahaba, scan volume 5, p. 588, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "الاصابہ فی تمیز الصحابہ، اسکین جلد 5، ص 588 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
