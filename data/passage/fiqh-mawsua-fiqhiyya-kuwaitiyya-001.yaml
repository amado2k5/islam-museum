text: "واختلف الفقهاء في الصابئة، فذهب أبو حنيفة إلى أنهم من أهل الكتاب من اليهود أو النصارى. وفي قول لأحمد، وهو أحد وجهين عند الشافعية : أنهم جنس من النصارى. والمذهب عند الشافعي، وهو ما صححه (١) ابن عابدين ٢٦٨/٣ ،"
summary:
