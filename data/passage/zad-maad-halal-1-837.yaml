text: "… إلَّا عمر المحدَّث المُلْهَمُ وحدَه،، لكفى، فإنه لا يُظن به تغييرُ ما شرعه النبي لي مِن الطلاق الرجعي، فيجعله محرَّماً، وذلك يتضمَّن تحريمَ فرج المرأة على من لم تَحْرُمْ عليه، وإباحته لمن لا تَحِلِّ له، ولو فعل ذلك عمر، لما …"
