text: |-
  ( ٢ تسختزيادة الشاعر
  شاجب المازنى وأوّل البيت
  كون القادسية كل قرن
  قولهقبلى المناسب تقديمه على
  سغل كما فعل الجدوكذايقال
  فى سفرجل مع سفل ١ه
  ٦٩٨
  *[فل الين)*
  ذكرا كان أو أنتى نخلة وجمعه -يفل وستحال والسنخال أيضا فى قول الشاءر
  وحلت علوية بالسخال• اسم موضع والسخل الضعفا من الرجال لا واحدله وأهل المدينة
  :سمون الشيص من القر السخل وقد مطات النخلة تسخيلا ويقال أيضاسخات الرجل
  إذا عبته وضعفته وهى لغة هذيل وكوا كب مسخولة أى مجه ولة وقال
  وأنتم كواكب مسخولة • ترى فى السماء ولا تعلم
  ويروى مخسولة⁦( سدل)⁩سدل توبه بسدله بالضم سدلا أى أرخاه وشع رمندل والسدبل
  ما أسبل على الهودج والجع السدول والسدائل والاسدال والسدل السمط من الجوهر
  والجمع -دول وقال زين الاشلة بالسدول • والسدلى على فعلى محرب وأصله بالذارسية
  دله كانه ثلاثة بيوت في بيت كالحارى بكمين والسفدل طائر يأ كل البيش عن الجاحظ
  ريل السريال القميص وسربلته فتسر بل أى أليسته السريال رول
  لسراويل-حروف يذكرويؤنت وابمع السراو بلات قال سيبويه سراويل واحدة وهو
  عجمية أعريت فأشيهت من كلامهسم مالإيتصر ف فى معرفة ولانكرة قهى مصروفة
  فى الذكرة قال وان سميت بهار جلا لم تصرفها وكذلت ان حترتها اسم رجل لانها مؤنث على
  أكثر من ثلاثة أحرف مثل عناق وفى النحو يين من لا يصرفه أيضافى النكرة ويزعم أنه بجع
  سروال وسروالة وينشد • عليه من اللؤم سر واله• ويحتج فى ترك صرفه بة ول ابن مقبل
  فى فارسى فى سراويل رامح * والعسمل على القول الاوّل والنانى آقوى وسر واته ألمبة
  السراويل قتسرول وحامة مسرولة فى وجليهاريش ويقال فرس أبالو مسرول للذى
  بجاوز بياض تحجيله الى العضدين والفخذين ⁦( طل)⁩ السعال معروف والسيطل مثل
  ⁦( عل)⁩ سعل يسعل سعالا والمسعل موضعه من الحلق والعلاة أخبث القيلان وكذلك
  السعلا يمدويقصر والجمع السعالى وا-ة-علت المرأة صارت سعلاة اذا صارت صحابة بذية
  غل لسغل المضطرب الاعضاء السيءّ الخاق والغذاء يقال صبىَّ سفل بين السغل قال
  -لامة بن جندل يصف فرسا
  ليس بأسفى ولا أقى ولاسغل • ي-قدوا ققى السكن مريوبه
  ويقال هو المتخذد المهزول والمسمغلة بزيادة الميم الناقة الطويلة ( غبل سغبل الطعام
  اذا أدمه بالاهالة أو بالعن وسغبل رأسه بالدهن أى روّاه ⁦( سفل)⁩ السفل والسفل
  والسغول والسفال والسفالة بالضم نقمض العلو والملووالعلو والعلاء والعلاوة يقال
  قعدت ب-غالة الريح وعلاوتها والعلاوة حيث تهبة والسغالة بازاءذلك والسافل نقيض
  العالى والسفالة بالفتح النذالة وقدسفل بالضم والسافلة المقعدة والدبر والفلة يكسر الفاء
  قوائم البعير والسفلة أيضا السقاط من الناس يقال هو من السفلة ولا تقل هو سفلة لانها
  جمع والعامّة تقول رجل سفلة من قوم سفل قال ابن السكيت وبعض العرب يخفف فيول
  فلان من سفلة الناس فينقل حكسرة الفاءالى النين والتفيل التصويب والتفل
  التصوّب والاسافل صغار الابل وأنشد الاصحعى".
  تواكلها الازمان حتى أجأنها • الى جاد.نها قليل الاساقل
