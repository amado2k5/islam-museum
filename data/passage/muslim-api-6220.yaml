label: { ar: "صحيح مسلم 6220 — أسماء الأمراض", en: "Sahih Muslim 6220 — named diseases", ur: "صحیح مسلم 6220 — بیماریوں کے نام", es: "Sahih Muslim 6220 — enfermedades nombradas", fr: "Sahih Muslim 6220 — maladies nommées", tr: "Sahih Muslim 6220 — Hastalıkların İsimleri", id: "Sahih Muslim 6220 — Nama-nama Penyakit" }
text: "… \" لأُعْطِيَنَّ الرَّايَةَ رَجُلاً يُحِبُّ اللَّهَ وَرَسُولَهُ وَيُحِبُّهُ اللَّهُ وَرَسُولُهُ \". قَالَ فَتَطَاوَلْنَا لَهَا فَقَالَ \" ادْعُوا لِي عَلِيًّا \". فَأُتِيَ بِهِ أَرْمَدَ فَبَصَقَ فِي عَيْنِهِ وَدَفَعَ الرَّايَةَ إِلَيْهِ فَفَتَحَ اللَّهُ عَلَيْهِ وَلَمَّا نَزَلَتْ هَذِهِ الآيَةُ { فَقُلْ تَعَالَوْا نَدْعُ أَبْنَاءَنَا وَأَبْنَاءَكُمْ} دَعَا رَسُولُ اللَّهِ عَلِيًّا وَفَاطِمَةَ وَحَسَنًا وَحُسَيْنًا فَقَالَ \" اللَّهُمَّ هَؤُلاَءِ أَهْلِي \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6220، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 6220 (The Book of the Merits of the Companions), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 6220، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 6220 (El Libro de los Méritos de los Compañeros), menciona enfermedades específicas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 6220 (Livre des mérites des Compagnons), mentionne des maladies nommées. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 6220 numaralı hadiste hastalıkların isimleri geçmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6220, menyebutkan nama-nama penyakit. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
