text: "… عنه السماع تال الخطيب وجد ثنى عبد الواحد بن برهان قال نال لى ممد بن أبى الفوارس روى ابن بطة عن البغوى عن مصعب عن مالك عن الزهرى عن انس عن الني قال طلب العلم فريضة على كل مسلم قال …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 4، ص 200، يرد فيه ذكر الفريضة والفرائض، وما وجب على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 4, p. 200, whose wording mentions the obligation (farida), a duty laid on every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 4، ص 200 کا اقتباس جس میں فریضہ اور فرائض، جو ہر مسلمان پر لازم ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam de Ibn al-Jawzi, volume numérisé 4, p. 200, dont le texte mentionne l'obligation (farida), un devoir imposé à chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen digitalizado 4, p. 200, cuyo texto menciona la obligación (farida), un deber impuesto a cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin 4. cildinin 200. sayfasından, farz olan görevleri ve her Müslümandan beklenenleri anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, Volume 4, halaman 200, yang menyebutkan kewajiban-kewajiban dan apa yang dituntut dari setiap Muslim; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk kewajiban-kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
