summary:
  ar: "القسم 23 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفرائض»، ويضم فيها النصوص من 2719 إلى 2752 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 23 of Sunan Ibn Majah (Chapters on Shares of Inheritance) in the division of the open hadith dataset the museum took its reports from: reports 2719 to 2752 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 23، عنوان «کتاب الفرائض»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2719 تا 2752۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 23 de Sunan Ibn Majah (Capítulos sobre la herencia) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2719 al 2752, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
