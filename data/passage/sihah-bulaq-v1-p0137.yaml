text: |-
  ٥٠٤
  -لة قلت لعاصم بن أبى النجودما الحصاص قال أمارايت الهارا ذاصر باذنيه ومصع بذنبه
  وعسدافذلك حصاصه قال أبو عبيد بقال هو الضراط فى قول بعضهم قال وقول عاصم
  أعجب الى"وهوقول الاصءعى أونجوه ⁦( فص)⁩ الحفص زبيل من جاود وولد الاسد أيضا
  وأم حفصة الدجاجة وحفصت الشئ بحعته حكاه ابن دريد ⁦(حص )⁩ حص الجرح يحمص
  حوصاسكن ورمه وكذلك انحمص الجرح وحصت الارج وحة سكنت فورتها وحص بلد
  يذكرويونت والحص حب قال تعلب الاختيارفتح الميم وقال المبردهو الحص بكسر الميم ولم
  يأت علهمن الاسماء الاحلزوه والقصير وجلق وهواسم موضع بناحية الشام ⁦( حوص )⁩
  الحوص الخياطة والتضييق بين الشيتين وقد حصت عين البازى أحوصهاحوصا وحياصة
  وقولهسم لا طعنىّ فى حوصهم أى لاخرقن ما خاطوا وأفسدن ما أصلموا والحائص الناقة
  و التى لا يجوز فيها قضيب الفحل قال الفرّاء الحائص منل الرتقاء فى النساء والحوص بالتحريك
  نسق فى مؤخر العين والرجل آحوص وقد حوص ويقال بل هوالضيقّ فى احدى العينيز
  والمرأة حوصاء ويقال هو يحاوص فلانا أى شفرالسه بمؤخر عيفه ويختى ذلك
  والاحوصان أسوص بن جمفر بن كلاب واسمه ربيعة وكان صغير العينين وعمرو
  ابن الاحوص وقدرأس وقول الإعشى
  أتانى وعيد الحوص من آل جعر * فياعبدهم رولونهيت الاخاوما
