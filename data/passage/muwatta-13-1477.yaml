label: { ar: "الموطأ 1477 — يحيى بن سعيد عن سليمان بن يسار: عمة محمد بن الأشعث اليهودية أو النصرانية، فقال عمر يرثها أهل دينها", en: "Muwatta 1477", es: "Muwatta 1477", fr: "Muwatta 1477", ur: "موطا 1477", tr: "El-Muvatta 1477 — Yahya bin Said, Süleyman bin Yaşar'dan rivayetle: Muhammed bin El-Aş'at'ın baba tarafından teyzesi Yahudi veya Hristiyan idi, bu yüzden Ömer şöyle dedi: Onun dinine mensup olanlar ondan miras alacaklardır.", id: "Al-Muwatta 1477 — Yahya bin Saeed berdasarkan riwayat Sulaiman bin Yasar: Bibi dari pihak ayah Muhammad bin Al-Ash’ath beragama Yahudi atau Kristen, maka Umar berkata: Kaumnya yang seagama dengannya akan mewarisi hartanya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار أن محمد بن الأشعث أخبره أن عمة له يهودية أو نصرانية توفيت، فذكر ذلك لعمر بن الخطاب، فقال من يرثها؟ فقال عمر يرثها أهل دينها. ثم أتى عثمان بن عفان فسأله، فقال أتراني نسيت ما قال لك عمر بن الخطاب، يرثها أهل دينها. {cite:muwatta-maruf-1997 p.23}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Muhammed ibn el-Eş'at ona Yahudi veya Hristiyan olan teyzesinin öldüğünü bildirmiş. Bunu Ömer ibn el-Hattab'a anlatmış, Ömer \"Ondan kim miras alacak?\" diye sormuş. Ömer, \"Onun dininden olanlar ondan miras alacak\" diye cevap vermiş. Sonra Osman ibn Affan'a gidip sormuş, o da \"Ömer ibn el-Hattab'ın sana söylediklerini unuttuğumu mu sanıyorsun? Onun dininden olanlar ondan miras alacak\" diye cevap vermiş. {cite:muwatta-maruf-1997 s.23}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa Muhammad ibn al-Ash'ath memberitahunya bahwa bibinya, yang beragama Yahudi atau Kristen, telah meninggal. Ia menyampaikan hal ini kepada Umar ibn al-Khattab, yang bertanya, \"Siapa yang mewarisi hartanya?\" Umar menjawab, \"Kaumnya yang seagama dengannya mewarisi hartanya.\" Kemudian ia pergi kepada Uthman ibn Affan dan bertanya kepadanya, yang menjawab, \"Apakah kamu pikir aku lupa apa yang dikatakan Umar ibn al-Khattab kepadamu? Kaumnya yang seagama dengannya mewarisi hartanya.\" {cite:muwatta-maruf-1997 p.23}"
