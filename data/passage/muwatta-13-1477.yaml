label: { ar: "الموطأ 1477 — يحيى بن سعيد عن سليمان بن يسار: عمة محمد بن الأشعث اليهودية أو النصرانية، فقال عمر يرثها أهل دينها", en: "Muwatta 1477" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار أن محمد بن الأشعث أخبره أن عمة له يهودية أو نصرانية توفيت، فذكر ذلك لعمر بن الخطاب، فقال من يرثها؟ فقال عمر يرثها أهل دينها. ثم أتى عثمان بن عفان فسأله، فقال أتراني نسيت ما قال لك عمر بن الخطاب، يرثها أهل دينها. {cite:muwatta-maruf-1997 p.23}"
