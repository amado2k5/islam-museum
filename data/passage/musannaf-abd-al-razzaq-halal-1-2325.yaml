text: "… عن الحكم عن أَبي عياض أَنه رخص في ذبائحهم، وكره نساءَهم. - عبد الرزاق عن معمر عن قتادة أَنه سئل عن يهودي ذبح شاة فأَخطاً فيها حتى حرمت عليه، قال : لا يحل لمسلم أَن يأكلها. فإذا قرب إليك رجل …"
summary:
