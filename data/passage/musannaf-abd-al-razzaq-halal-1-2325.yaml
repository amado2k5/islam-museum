  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 2325, that mentions what was made lawful, what is not lawful, what was made unlawful, the concession; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
