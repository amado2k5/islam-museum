label: { ar: "الموطأ 971 — بلغ مالكاً أن رسول الله اعتمر ثلاثاً: عام الحديبية، وعام القضية، وعام الجعرانة", en: "Muwatta 971", es: "Muwatta 971", fr: "Muwatta 971", ur: "موطا 971", tr: "El-Muvatta 971 — Malik'e rivayet edildiğine göre, Allah Resulü üç defa Umre yapmıştır: Hudeybiye yılında, Hadis yılında ve Ciranah yılında.", id: "Al-Muwatta 971 — Diriwayatkan kepada Malik bahwa Rasulullah SAW melaksanakan Umrah tiga kali: pada tahun Al-Hudaybiyyah, pada tahun Al-Hadithah, dan pada tahun Al-Ji'ranah." }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن رسول الله اعتمر ثلاثاً: عام الحديبية، وعام القضية، وعام الجعرانة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1103) وسويد (517)، وأن هذا البلاغ يُروى من وجوه ذكرها ابن عبد البر ⁦(التمهيد 24/410)⁩. {cite:muwatta-maruf-1997 p.460}"
  tr: "Malik'in rivayet ettiği bir hadiste, Allah Resulü'nün üç Umre yaptığını işittiği belirtilmektedir: Hudeybiye yılı, Hadis Antlaşması yılı ve Ciranah yılı. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab (1103) ve Suveyd (517) tarafından rivayet edildiğini ve İbn Abdül-Barr'ın (el-Tamhid 24/410) zikrettiği çeşitli rivayet zincirleriyle aktarıldığını belirtmektedir. {cite:muwatta-maruf-1997 s.460}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik menyatakan bahwa ia mendengar Rasulullah SAW melaksanakan tiga kali umrah: tahun Hudaybiyyah, tahun Perjanjian al-Hadits, dan tahun al-Ji'ranah. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab (1103) dan Suwayd (517), dan bahwa riwayat ini ditransmisikan melalui berbagai sanad yang disebutkan oleh Ibnu 'Abd al-Barr (al-Tamhid 24/410). {cite:muwatta-maruf-1997 p.460}"
