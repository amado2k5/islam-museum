summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن رسول الله اعتمر ثلاثاً: عام الحديبية، وعام القضية، وعام الجعرانة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1103) وسويد (517)، وأن هذا البلاغ يُروى من وجوه ذكرها ابن عبد البر (التمهيد 24/410). {cite:muwatta-maruf-1997 p.460}"
