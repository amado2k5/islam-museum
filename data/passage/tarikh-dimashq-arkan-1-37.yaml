text: "… الى يوثر عن رسول اللّه يقول اربع من كن فيه فهو مؤمن ومن جاء بثلاث وكتم واحدة فقد كفر شهادة ان لا اله الا اللّٰه وانى رسول اللّه وانه مبعوث من بعد الموت وايمان بالقدر خيره وشره فمن جاء بثلاث …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 37، يذكر الإيمان بالقدر، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 1, p. 37, that mentions belief in the decree, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 37 کا اقتباس جس میں تقدیر پر ایمان، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Historia de Damasco de Ibn 'Asakir, volumen 1, pág. 37, que menciona la creencia en el decreto, rasgos que, presentes en una persona, indican fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de l'Histoire de Damas d'Ibn Asakir (tome 1, p. 37) mentionne la croyance au décret, ainsi que les traits qui, chez une personne, caractérisent la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Asakir'in Resimli Şam Tarihi adlı eserinin 1. cildinin 37. sayfasından bir alıntı, kader inancını ve bu inanca sahip olanların özelliklerini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlandırılmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 1 Bergambar, halaman 37, membahas kepercayaan pada takdir dan karakteristik orang-orang yang memilikinya. Kutipan ini diambil dari versi yang dapat dibaca mesin dan dipindai, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
