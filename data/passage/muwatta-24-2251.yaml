label: { ar: "الموطأ 2251 — مالك عن هلال بن أسامة عن عطاء بن يسار عن عمر بن الحكم: أتيت النبي فقلت إن جارية لي كانت ترعى غنما، فجئتها وقد فقدت شاة، فسألتها فقالت: أكلها الذئب، فلطمت وجهها، وعلي رقبة، فقال لها النبي: أين الله؟ قالت: في السماء، فقال: من أنا؟ قالت: أنت رسول الله، فقال: أعتقها", en: "Muwatta 2251", es: "Muwatta 2251", fr: "Muwatta 2251", ur: "موطا 2251", tr: "El-Muvatta 2251 — Malik, Hilal ibn Usame'den, Ata ibn Yasar'dan, Ömer ibn el-Hakam'dan rivayetle: Peygamber'e gittim ve dedim ki: \"Koyun otlatan bir cariyem vardı. Yanına gittiğimde koyunlardan birinin eksik olduğunu gördüm. Ona sordum, 'Kurt yedi' dedi. Bunun üzerine yüzüne bir tokat attım ve azat etmem gereken bir cariyem oldu.\" Peygamber ona, \"Allah nerede?\" dedi. O da, \"Göklerde\" dedi. Peygamber, \"Ben kimim?\" dedi. O da, \"Sen Allah'ın Resulüsün\" dedi. Peygamber, \"Onu azat et\" dedi.", id: "Al-Muwatta 2251 — Malik, berdasarkan riwayat Hilal ibn Usamah, berdasarkan riwayat Ata ibn Yasar, berdasarkan riwayat Umar ibn al-Hakam: Aku datang kepada Nabi dan berkata, “Aku mempunyai seorang budak perempuan yang menggembalakan domba. Aku mendatanginya dan mendapati salah satu domba hilang. Aku bertanya kepadanya tentang hal itu, dan dia berkata, ‘Seekor serigala memakannya.’ Maka aku menampar wajahnya, dan aku mempunyai seorang budak perempuan yang harus dibebaskan.” Nabi bertanya kepadanya, “Di manakah Allah?” Dia menjawab, “Di langit.” Beliau bertanya, “Siapakah aku?” Dia menjawab, “Engkau adalah Rasulullah.” Beliau berkata, “Bebaskan dia.”" }
summary:
  ar: "يروي مالك عن هلال بن أسامة عن عطاء بن يسار عن عمر بن الحكم أنه قال: أتيت رسول الله فقلت: يا رسول الله، إن جارية لي كانت ترعى غنما لي، فجئتها وقد فقدت شاة من الغنم، فسألتها عنها، فقالت: أكلها الذئب. فأسفت عليها، وكنت من بني آدم، فلطمت وجهها، وعلي رقبة، أفأعتقها؟ فقال لها رسول الله: أين الله؟ فقالت: في السماء، فقال: من أنا؟ فقالت: أنت رسول الله، فقال رسول الله: أعتقها. ويذكر المحقق أن مالكا سماه عمر بن الحكم وهو وهم، والصواب معاوية بن الحكم السلمي، كما قال ابن عبد البر وغيره. {cite:muwatta-maruf-1997 p.328} {cite:muwatta-maruf-1997 p.329}"
  tr: "Malik, Hilal ibn Usame'den, Ata ibn Yasar'dan, Ömer ibn el-Hakam'dan rivayetle şöyle aktarır: \"Allah'ın Resulü'ne geldim ve dedim ki: 'Ey Allah'ın Resulü, koyunlarımı otlatan bir cariyem var. Yanına gittiğimde koyunlardan birinin eksik olduğunu gördüm. Ona sordum, o da 'Kurt yedi' dedi. Çok üzüldüm ve insan olarak yüzüne tokat attım. Azat etmem gereken bir kölem var; onu azat edeyim mi?' Allah'ın Resulü ona, 'Allah nerede?' dedi. O da 'Göklerde' dedi. Resulullah, 'Ben kimim?' dedi. O da 'Sen Allah'ın Resulüsün' dedi. Allah'ın Resulü, 'Onu azat et' dedi.\" Araştırmacı, Malik'in ona Ömer ibn el-Hakam adını verdiğini belirtiyor ki bu bir hatadır. İbn Abd el-Barr ve diğerlerinin de belirttiği gibi, doğru isim Muaviye ibn el-Hakam el-Sulami'dir. {cite:muwatta-maruf-1997 s.328} {cite:muwatta-maruf-1997 s.329}"
  id: "Malik meriwayatkan dari Hilal ibn Usamah, dari Ata ibn Yasar, dari Umar ibn al-Hakam, yang berkata: Aku datang kepada Rasulullah dan berkata, “Wahai Rasulullah, aku mempunyai seorang budak perempuan yang biasa menggembalakan domba-dombaku. Aku datang kepadanya dan mendapati salah satu domba hilang. Aku bertanya kepadanya tentang hal itu, dan dia berkata, ‘Seekor serigala memakannya.’ Aku sedih mendengarnya, dan sebagai manusia, aku menampar wajahnya. Aku mempunyai seorang budak yang harus dibebaskan; haruskah aku membebaskannya?” Rasulullah bertanya kepadanya, “Di manakah Allah?” Dia menjawab, “Di langit.” Beliau bertanya, “Siapakah aku?” Dia menjawab, “Engkau adalah Rasulullah.” Rasulullah bersabda, “Bebaskan dia.” Peneliti menyebutkan bahwa Malik menyebutnya Umar ibn al-Hakam, yang merupakan kesalahan. Nama yang benar adalah Muawiyah ibn al-Hakam al-Sulami, sebagaimana yang telah disebutkan oleh Ibnu Abd al-Barr dan lainnya. {kutip:muwatta-maruf-1997 hal.328} {kutip:muwatta-maruf-1997 hal.329}"
