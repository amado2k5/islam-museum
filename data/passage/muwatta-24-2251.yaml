label: { ar: "الموطأ 2251 — مالك عن هلال بن أسامة عن عطاء بن يسار عن عمر بن الحكم: أتيت النبي فقلت إن جارية لي كانت ترعى غنما، فجئتها وقد فقدت شاة، فسألتها فقالت: أكلها الذئب، فلطمت وجهها، وعلي رقبة، فقال لها النبي: أين الله؟ قالت: في السماء، فقال: من أنا؟ قالت: أنت رسول الله، فقال: أعتقها", en: "Muwatta 2251" }
summary:
  ar: "يروي مالك عن هلال بن أسامة عن عطاء بن يسار عن عمر بن الحكم أنه قال: أتيت رسول الله فقلت: يا رسول الله، إن جارية لي كانت ترعى غنما لي، فجئتها وقد فقدت شاة من الغنم، فسألتها عنها، فقالت: أكلها الذئب. فأسفت عليها، وكنت من بني آدم، فلطمت وجهها، وعلي رقبة، أفأعتقها؟ فقال لها رسول الله: أين الله؟ فقالت: في السماء، فقال: من أنا؟ فقالت: أنت رسول الله، فقال رسول الله: أعتقها. ويذكر المحقق أن مالكا سماه عمر بن الحكم وهو وهم، والصواب معاوية بن الحكم السلمي، كما قال ابن عبد البر وغيره. {cite:muwatta-maruf-1997 p.328} {cite:muwatta-maruf-1997 p.329}"
