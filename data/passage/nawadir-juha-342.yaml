label: { ar: "نوادر جحا الكبرى، ص 169 — «ستُجازى بعد أربعين يوماً»", en: "Nawadir Juha al-Kubra, p. 169 — 'You Will Be Repaid After Forty Days'", ur: "نوادر جحا الکبریٰ، ص 169 — «چالیس دن بعد تمہیں بدلہ ملے گا»", fr: "Nawadir Juha al-Kubra, p. 169 — « Tu seras payé de retour dans quarante jours »", es: "Nawadir Juha al-Kubra, p. 169 — «Se te pagará dentro de cuarenta días»", tr: "Juha'nın Büyük Öyküleri, s. 169 — “Kırk gün sonra ödüllendirileceksiniz”", id: "Anekdot-anekdot Hebat Juha, hlm. 169 — “Kamu akan diberi pahala setelah empat puluh hari”" }
text: "… ستُجازى بعد أربعين يوماً نسلط أحد العوام على جحا، وأخذ يُؤذيه حتى أنَّه في أحد الأيام، كسر عصا جحا المصنوعة من خشب اللوز، وكان يحمِلُها منذ سبعةٍ وعشِرين عاماً، فأنكسر خاطِرُ جحا، وتألَّم على فقد عصاه، فدعا عليه قائلاً : …"
summary:
  ar: "كسر رجل عصا جحا من خشب اللوز التي حملها سبعاً وعشرين سنة، فلعنه جحا، فانزلق الرجل وكسر ساقه، فقال جحا إن الساق ثمن إيذاء العصا، وإن الرجل سيزحف إليه بعد أربعين يوماً على رجله اليمنى. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  en: "A man breaks Juha's almond-wood staff, which he had carried for twenty-seven years; Juha curses him; the man slips and breaks his leg; Juha says the leg is for the harm to the staff and the man will crawl to him after forty days on the right leg. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  ur: "ایک آدمی نے جحا کی بادام کی لکڑی کی لاٹھی توڑ دی جو وہ ستائیس سال سے اٹھائے پھرتا تھا، جحا نے اسے بددعا دی، آدمی پھسلا اور اس کی ٹانگ ٹوٹ گئی، تو جحا نے کہا کہ ٹانگ لاٹھی کو پہنچنے والے نقصان کا بدلہ ہے اور وہ آدمی چالیس دن بعد دائیں ٹانگ پر گھسٹتا ہوا اس کے پاس آئے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  fr: "Un homme brise le bâton en bois d'amandier que Juha portait depuis vingt-sept ans ; Juha le maudit ; l'homme glisse et se casse la jambe ; Juha dit que la jambe paie le tort fait au bâton et que l'homme rampera jusqu'à lui après quarante jours sur la jambe droite. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  es: "Un hombre rompe el bastón de madera de almendro que Juha había llevado durante veintisiete años; Juha lo maldice; el hombre resbala y se rompe la pierna; Juha dice que la pierna es por el daño al bastón y que el hombre se arrastrará hasta él al cabo de cuarenta días sobre la pierna derecha. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  tr: "Bir adam, Juha'nın yirmi yedi yıldır taşıdığı badem ağacından yapılmış bastonunu kırdı. Juha ona lanet okudu ve adam kayıp düşüp bacağını kırdı. Juha, \"Bacak, bastona zarar vermenin bedelidir ve adam kırk gün içinde sağ bacağı üzerinde sürünerek bana gelecektir.\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 169}"
  id: "Seorang pria mematahkan tongkat kayu almond milik Juha, yang telah dibawanya selama dua puluh tujuh tahun. Juha mengutuknya, dan pria itu terpeleset dan kakinya patah. Juha berkata, \"Kaki ini adalah harga yang harus dibayar karena merusak tongkat ini, dan pria itu akan merangkak kepadaku dengan kaki kanannya dalam empat puluh hari.\" {cite:juha-nawadir-kubra-djuwaydi p. 169}"
