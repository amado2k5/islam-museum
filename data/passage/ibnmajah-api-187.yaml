label: { ar: "سنن ابن ماجه 187 — مضاعفة الأجر", en: "Sunan Ibn Majah 187 — the reward doubled or multiplied", ur: "سنن ابن ماجہ 187 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ صُهَيْبٍ، قَالَ تَلاَ رَسُولُ اللَّهِ ـ هَذِهِ الآيَةَ {لِلَّذِينَ أَحْسَنُوا الْحُسْنَى وَزِيَادَةٌ} وَقَالَ \" إِذَا دَخَلَ أَهْلُ الْجَنَّةِ الْجَنَّةَ وَأَهْلُ النَّارِ النَّارَ نَادَى مُنَادٍ يَا أَهْلَ الْجَنَّةِ إِنَّ لَكُمْ عِنْدَ اللَّهِ مَوْعِدًا يُرِيدُ أَنْ يُنْجِزَكُمُوهُ. فَيَقُولُونَ وَمَا هُوَ أَلَمْ يُثَقِّلِ اللَّهُ مَوَازِينَنَا وَيُبَيِّضْ وُجُوهَنَا وَيُدْخِلْنَا الْجَنَّةَ وَيُنْجِنَا مِنَ النَّارِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 187، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 187 (The Book of the Sunnah), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 187، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
