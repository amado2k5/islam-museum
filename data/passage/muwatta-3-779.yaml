label: { ar: "الموطأ 779 — مالك: وذلك واسع إن شاء الله، أن يؤدوا قبل الغدو من يوم الفطر أو بعده", en: "Muwatta 779", es: "Muwatta 779", fr: "Muwatta 779", ur: "موطا 779", tr: "El-Muvatta 779 — Malik: Bu, Allah'ın izniyle, Ramazan Bayramı sabahından önce veya sonra yapılması fark etmeksizin caizdir.", id: "Al-Muwatta 779 — Malik: Itu diperbolehkan, insya Allah, baik mereka melakukannya sebelum atau sesudah pagi hari raya Idul Fitri." }
summary:
  ar: "قول لمالك: وذلك واسع إن شاء الله، أن يؤدوا زكاة الفطر قبل الغدو من يوم الفطر أو بعده. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.384}"
  tr: "Malik şöyle demiştir: \"Allah'ın izniyle, zekât-ı fitreyi Ramazan Bayramı sabahından önce veya sonra vermek caizdir.\" Editör, rivayetler arasındaki farklılıkları teyit eder ve Ebu Mus'ab'ın bunu Malik'ten naklettiğini belirtir. {cite:muwatta-maruf-1997 s.384}"
  id: "Malik berkata: “Insya Allah, diperbolehkan membayar Zakat Fitrah sebelum atau sesudah pagi Idul Fitri.” Editor menegaskan perbedaan dalam berbagai versi dan menyebutkan bahwa Abu Mus’ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.384}"
