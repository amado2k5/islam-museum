text: "كَتَبَ إِلَىَّ أَبُو بَكْرَةَ يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ لاَ يَقْضِيَنَّ أَحَدٌ فِي قَضَاءٍ بِقَضَاءَيْنِ وَلاَ يَقْضِي أَحَدٌ بَيْنَ خَصْمَيْنِ وَهُوَ غَضْبَانُ ‏\"‏ ‏.‏"
summary:
  ar: "في السنن النسائي؛ إرسال كتاب أو رسالة إلى طرف."
