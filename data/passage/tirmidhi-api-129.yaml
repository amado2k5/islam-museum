text: "… حَبِيبَةَ ابْنَةُ جَحْشٍ رَسُولَ اللَّهِ فَقَالَتْ إِنِّي أُسْتَحَاضُ فَلاَ أَطْهُرُ أَفَأَدَعُ الصَّلاَةَ فَقَالَ \" لاَ إِنَّمَا ذَلِكِ عِرْقٌ فَاغْتَسِلِي ثُمَّ صَلِّي \". فَكَانَتْ تَغْتَسِلُ لِكُلِّ صَلاَةٍ. قَالَ قُتَيْبَةُ قَالَ اللَّيْثُ لَمْ يَذْكُرِ ابْنُ شِهَابٍ أَنَّ رَسُولَ اللَّهِ أَمَرَ أُمَّ حَبِيبَةَ أَنْ تَغْتَسِلَ عِنْدَ كُلِّ صَلاَةٍ وَلَكِنَّهُ شَيْءٌ فَعَلَتْهُ هِيَ. قَالَ أَبُو عِيسَى وَيُرْوَى هَذَا الْحَدِيثُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 129، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 129 (The Book on Purification), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 129، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
