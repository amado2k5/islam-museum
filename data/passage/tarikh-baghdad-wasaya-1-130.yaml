text: "… محمد حدثنا سعد بن عبد الحميد بن جعفر حدثنا ابن أبى الزناد عن موسى بن عقبة. قال : أخبرني رجل من ولد عبادة بن الصامت كان ثقة أنه سمع أبا هربرة يقول سمعت رسول اللّٰه يقول : حضر ملك الموت …"
