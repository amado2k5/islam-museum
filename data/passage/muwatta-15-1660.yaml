label: { ar: "الموطأ 1660 — مالك: الثيب إذا ملكها الرجل فلم يدخل بها تجري مجرى البكر، الواحدة تبينها والثلاث تحرمها حتى تنكح زوجا غيره", en: "Muwatta 1660", es: "Muwatta 1660", fr: "Muwatta 1660", ur: "موطا 1660", tr: "El-Muvatta 1660 — Malik: Bir erkek daha önce evlenmiş bir kadına sahipse ama evliliği tamamlamazsa, kadın bakire sayılır. Bir evlilik onu erkekten ayırır ve üç evlilik onu başka bir erkekle evleninceye kadar erkek için haram kılar." }
summary:
  ar: "يقول مالك والثيب إذا ملكها الرجل فلم يدخل بها، إنها تجري مجرى البكر: الواحدة تبينها، والثلاث تحرمها حتى تنكح زوجا غيره. {cite:muwatta-maruf-1997 p.83}"
  tr: "Malik, bir erkeğin daha önce evlenmiş bir kadına sahip olup da evliliği tamamlamaması durumunda, kadının bakire gibi muamele gördüğünü söyler: bir kez boşanılır ve üç kez boşandıktan sonra, başka bir erkekle evlenene kadar ona yasaklı hale gelir. {cite:muwatta-maruf-1997 s.83}"
  id: "Malik mengatakan bahwa jika seorang pria memiliki seorang wanita yang sebelumnya telah menikah tetapi tidak melakukan hubungan suami istri, wanita tersebut diperlakukan seperti seorang perawan: satu kali ceraikan, dan tiga kali ceraikan membuatnya haram bagi pria tersebut sampai ia menikah dengan pria lain. {cite:muwatta-maruf-1997 p.83}"
