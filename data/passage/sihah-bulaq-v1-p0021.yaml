text: |-
  ٦٢٠
  (باب العين
  بالرفق فى رعاية الابل يسنا آبل مان يجزئها • جزءاشديداوماان ترتوى كرعا
  وكرع فى الماء يتحكرع كروعا اذا تناوله بفيه من موضعه من غيران يشرب بكفيه ولاباناه
  يقال اكرع فى هذا الاناعلفا أونفسين وفيه لغة أخرى كرع بالكسر يكوع كرعاوأكرع
  القوم اذا أصابوا السكرع فأوردوه ابلهم والكارعات والمسكرعات النخيل التى على الما
  عن أبى عبيد والا كرع الدقيق من مقدم الساقين وفيه كرع وقد كرع عن آبى حمرو والكراع
  فى الغم والبقر بمنزلة الوظف فى الفرس والبعيروه ومستدق الساق يذكرويونث وابهم
  أكرع ثم أكارع, فى المئسل اعماى العبد كراعافطلب ذراعالات الذراع فى البدوه وأفضل
  من الصكراع فى الزجل والكراع أنف يتقدم من الحرّة ثم يمنة وقال الاديعى الكراع
  عنق من الحسرّة مدد قال عوف بن الاحوص
  ألم أظف عن الشعراعرضى • كما فالف الوسيقة بالكراع
  ورج لاا بلمندب كراعاء وكراع الفميمه وضع معروف بناحيسة الجاذ والكراع اسم تجمع انايل نفسها ب
  الكوسوع طرف الزند الذى إلى انختصر وه والفاتى عند الرسغ كسع) الكسع
  أن تضرب دبر الانسان بيدك أوبص-درقد مك يقال اتبع فلان أدبارهم يكسعه-م بالسيف
  مثل يك ؤهم أى يعاردهم ومنه قول الشاعر كسع الشتاء بسبعة غبر والكسع سرعة المز
  يقال كعه بكذا اذا جعله تابعاله ومذهبا ووردت انطيول بكسع بعضها بعضا والبكسع
  بياض فى أطراف المنة يقال فرس أكسبع بين الكسع وكسعن الماقة بغبرها أى ضربت
  خلفها بالماء البارد ليتراد اللبن فى ظهرها ويبق لها طرقها وذلك اذاخفت عليها الجدب
  فى العام لقابل قال الحرث بن حلزه
  لا تكسع الشول باغبارها • انك لا تدرى من الشاتج
  ومنه قيل رجل مكسع وهومن نعت الرجل العزب اذ الم يتزوج وتفسيره ودت بقيته فى ظهره
  قال الراجز
  واللّٰه لا يخرجها من قمره • الافنى مكسع بغبره
  واكتسع الكاب بذنبه اذا استنفريه ولكسعة الهير والكسعوم باخهيرية الحارواليم زائدة
  وكسع سى من اليمن ومنه قولهم تدامة السكسعى و«ورجل منهم ربى نبعة حتى اتخذ منها قوحا
  ونبلافرمى الوحش عنهاليلافاصاب وظن أنه أخطأ فكسرالة وس فلها أصبح رأى ما أصمى
  من الصيد فمدِم قال الشاعر
  أيوزيد التكاع) لتمع لغبانية
  ويد سى ذوالكااع لانهسم
  ت-كاء واءلى بديه أى تجمعوا إه
  كذا فى نسيخة
  ندمت ندامة الكسعىّ لما * رأت عيناه ماصنعت يداه
  ⁦( كمع)⁩ كعكعته فتكعكع أى -بسنه فاخبس وأكعه الفرقاكعاعا اذا -بس-ه عن
  وجهه وتكعكع أى جبن لغة فى تكاكأ ورجل كعكع بالضم أى جبان ضعيف وقدكع يكع
  كعوعا وحكى يونس يكع باضم وقال سيبويه يكع بالكسر أجود فهو كع وكاع قال الشاءر
  اذا كان كع القوم للدحسل لازما وقال أبوزيد كمعت وكععت لغتان مثل زلات وزلات
  لع كلع شقاق ووتنخ يكون بالقدم وقد كامت رج-له بالكسر تكلع كلما وانا. كام
  التيد عليه الوسخ وسقاء كام والكلعة القطعة من القسم عن أبى عبيد وذوا الكلاع بالفتح
  اسم• للك من ماول المن من الاذواء ⁦(كمع)⁩ الكميع الضجيع وكذلك الكمع بالكسر
  ولى
