text: "… الجاهل، إنما هنا كلام خبير بالمسؤول عنه، ولم يكن في ذلك الوقت من يعلم هذا غير النبي الأخرى. لسانه. ويده. وفي رواية جابر: المسلم من سلم المسلمون من لسانه ويده الأخرى الحارث. قال العلماء رحهم الله: قوله أي الإسلام خير؟ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 120، يذكر حلاوة الإيمان وكماله، ووصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 120, that mentions the sweetness and completeness of faith, a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 120 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 120, que menciona la dulzura y la plenitud de la fe, una descripción del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 1, p. 120) évoquant la douceur et la plénitude de la foi, ainsi qu'une description du musulman. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih Müslim'in 1. cildinin 120. sayfasında yer alan, imanın tatlılığı ve mükemmelliği ile bir Müslümanı tanımlayan, El-Nevevi'nin tefsirinden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve bir müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari komentar Al-Nawawi tentang Sahih Muslim, Volume 1, halaman 120, yang membahas tentang manisnya dan kesempurnaan iman serta menggambarkan seorang Muslim; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
