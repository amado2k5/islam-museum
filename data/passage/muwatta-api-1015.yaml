label: { ar: "موطأ مالك 1015 — اليتيم وفقد الأب", en: "Muwatta Malik 1015 — the orphan and the father lost", ur: "موطأ مالک 1015 — یتیم اور باپ کی موت", es: "Muwatta Malik 1015 — el huérfano y el padre perdido" }
text: "… فِي الشَّمْسِ فَقَالَ \" مَا بَالُ هَذَا \". فَقَالُوا نَذَرَ أَنْ لاَ يَتَكَلَّمَ وَلاَ يَسْتَظِلَّ مِنَ الشَّمْسِ وَلاَ يَجْلِسَ وَيَصُومَ. فَقَالَ رَسُولُ اللَّهِ \" مُرُوهُ فَلْيَتَكَلَّمْ وَلْيَسْتَظِلَّ وَلْيَجْلِسْ وَلْيُتِمَّ صِيَامَهُ \". قَالَ مَالِكٌ وَلَمْ أَسْمَعْ أَنَّ رَسُولَ اللَّهِ أَمَرَهُ بِكَفَّارَةٍ وَقَدْ أَمَرَهُ رَسُولُ اللَّهِ أَنْ يُتِمَّ مَا كَانَ لِلَّهِ طَاعَةً وَيَتْرُكَ مَا كَانَ لِلَّهِ مَعْصِيَةً."
summary:
  ar: "حديث في موطأ مالك، رقم 1015، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1015 (Vows and Oaths), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1015، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1015 (Votos y Juramentos), menciona al huérfano y al padre desaparecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
