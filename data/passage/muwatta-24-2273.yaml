summary:
  ar: "قال مالك: وكذلك المرأة الملاعنة من العرب، إذا اعترف زوجها بولدها صار إلى هذه المنزلة، إلا أن بقية ميراثه بعد ميراث أمه وإخوته لأمه لعامة المسلمين ما لم يلحق بأبيه، وإنما ورث موالي أمه قبل أن يعترف به أبوه لأنه لم يكن له نسب ولا عصبة. {cite:muwatta-maruf-1997 p.337} {cite:muwatta-maruf-1997 p.338}"
