label: { ar: "الموطأ 2273 — مالك: الملاعنة من العرب وولدها إذا اعترف به زوجها", en: "Muwatta 2273", es: "Muwatta 2273", fr: "Muwatta 2273", ur: "موطا 2273", tr: "El-Muvatta 2273 — Malik: Araplar arasından li'an diye dua eden kadın ve eğer kocası onu kabul ederse çocuğu.", id: "Al-Muwatta 2273 — Malik: Wanita yang memohon li'an dari kalangan Arab dan anaknya jika suaminya mengakuinya" }
summary:
  ar: "قال مالك: وكذلك المرأة الملاعنة من العرب، إذا اعترف زوجها بولدها صار إلى هذه المنزلة، إلا أن بقية ميراثه بعد ميراث أمه وإخوته لأمه لعامة المسلمين ما لم يلحق بأبيه، وإنما ورث موالي أمه قبل أن يعترف به أبوه لأنه لم يكن له نسب ولا عصبة. {cite:muwatta-maruf-1997 p.337} {cite:muwatta-maruf-1997 p.338}"
  tr: "Malik şöyle dedi: Benzer şekilde, kocasına Allah'ın lanetini dileyen bir Arap kadın çocuğunu kabul ederse, çocuk bu statüye ulaşır. Ancak, annesinin ve anne tarafından kardeşlerinin mirasından sonra kalan miras, yasal olarak babasına atfedilmediği sürece genel Müslüman nüfusa gider. Babası onu kabul etmeden önce, soyu veya erkek akrabası olmadığı için annesinin azat edilmiş kölelerinden miras alır. {cite:muwatta-maruf-1997 s.337} {cite:muwatta-maruf-1997 s.338}"
  id: "Malik berkata: Demikian pula, jika seorang wanita Arab yang telah memohon kutukan Allah kepada suaminya mengakui anaknya, anak tersebut memperoleh status ini. Namun, sisa warisannya, setelah warisan ibu dan saudara kandung dari pihak ibu, diberikan kepada penduduk Muslim secara umum kecuali jika ia secara sah dikaitkan dengan ayahnya. Ia mewarisi dari budak-budak yang dibebaskan ibunya sebelum ayahnya mengakuinya karena ia tidak memiliki garis keturunan atau kerabat agnatik. {cite:muwatta-maruf-1997 p.337} {cite:muwatta-maruf-1997 p.338}"
