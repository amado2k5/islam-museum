text: "… ويخرج الفضول التي في الصدر. ورق الأنجرة إذا طبخ مع ماء الشعير أخرج ما في الصدر من الأخلاط الغليظة. وقال ج: بزر الأنجرة يخرج الأخلاط الغليظة من الصدر والرئة إذا شرب. أريباسيوس: إن الأنجرة تعين على قذف الرطوبات الغليظة من …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 604، يرد فيه ذكر فرض العين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 604, whose wording mentions the individual obligation (fard 'ayn); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الحاوی فی الطب، رازی، ص 604 کا اقتباس جس میں فرضِ عین کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Hawi fi al-Tibb de al-Razi, p. 604, dont le texte mentionne l'obligation individuelle (fard 'ayn) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Hawi fi al-Tibb de al-Razi, p. 604, cuyo texto menciona la obligación individual (fard 'ayn); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Razi'nin El-Havi-i el-Tibb adlı eserinin 604. sayfasından, bireysel yükümlülüklerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Hawi fi al-Tibb karya Al-Razi, halaman 604, yang menyebutkan kewajiban individu; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
