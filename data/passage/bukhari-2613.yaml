label: { ar: "البخاري 2613 — ستر باب فاطمة", en: "Bukhari 2613 — Fatima's door-curtain" }
text: "أتى النبي يتبع فاطمة بنته فلم يدخل عليها، وجاء علي فذكرت له ذلك، فذكره للنبي فقال: إني رأيت على بابها ستراً موشياً، فقال: ما لي وللدنيا؟ فأتاها علي فذكر ذلك لها، فقالت: ليأمرني فيه بما شاء، قال: ترسل به إلى فلان أهل بيت بهم حاجة"
summary:
  ar: "في كتاب البيوع بعد الحلة؛ مشهد بيتي صغير يرسم حدود الدنيا في بيت النبوة — الستر الموشى وحده زينة زائدة — ووجهته الصدقة لا الرفض."
