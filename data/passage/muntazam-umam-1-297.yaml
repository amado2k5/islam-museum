text: "… قطنى وكان ثقة وتوف فى ذى القعدة من هذه السنة. سنة اتم دخلت سنة ست وعشرين وثلمائة فن الحوادث فيها انه نحرج الراضى متنزها الى ان حاذى بزوغى فاقام يومين • ثم رجع، وفيها ورد كتاب من ملك الروم الى …"
