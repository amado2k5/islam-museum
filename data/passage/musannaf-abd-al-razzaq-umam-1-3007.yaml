text: "… الإسلام من يهودي ونصراني فإنه لا يُحوَّل عن دينه، وعليه الجزية على كل حالم. ذكر وأُنثى، حر وعبد، دينار، أَو من قيمة المعافر، أَو عرضه. قال الثوري : ذكر عن عمر ضرائب مختلفة على أَهل الذمة الذين أَخذوا عنوة. قال …"
