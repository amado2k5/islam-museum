label: { ar: "الموطأ 967 — مالك: من خرج بهدي لنفسه فأشعره وقلده بذي الحليفة ولم يحرم حتى جاء الجحفة: لا أحب ذلك له، ولا يقلد الهدي ولا يشعره إلا عند الإهلال، إلا رجل لا يريد الحج فيبعث به ويقيم في أهله", en: "Muwatta 967", es: "Muwatta 967", fr: "Muwatta 967", ur: "موطا 967", tr: "El-Muvatta 967 — Malik: Kim Zül-Huleyfe'de kendine kurbanlık hayvan alır, işaretler ve çelenk takar, ancak Cühfe'ye varıncaya kadar ihrama girmezse, ben bunu onun için hoş bulmam. Hac yapmayı düşünmeyen bir kimse hariç, kurbanlık hayvanı çelenk takmamalı veya işaretlememelidir; aksi takdirde hayvanı gönderip ailesinin yanında kalmalıdır.", id: "Al-Muwatta 967 — Malik: Barang siapa mengambil hewan kurban untuk dirinya sendiri, menandainya, dan mengalungkannya pada Dzul Hulayfah, dan tidak memasuki keadaan ihram sampai ia mencapai Juhfah: Aku tidak menyukai hal itu baginya. Ia tidak boleh mengalungkan hewan kurban atau menandainya kecuali pada saat memasuki keadaan ihram, kecuali jika ia adalah seorang laki-laki yang tidak berniat melaksanakan haji, dalam hal ini ia harus mengirimkannya dan tinggal bersama keluarganya." }
summary:
  ar: "يقول يحيى: سئل مالك عمن خرج بهدي لنفسه فأشعره وقلده بذي الحليفة ولم يحرم هو حتى جاء الجحفة. فقال: لا أحب ذلك له، ولم يصب من فعله، ولا ينبغي له أن يقلد الهدي ولا يشعره إلا عند الإهلال، إلا رجل لا يريد الحج فيبعث به ويقيم في أهله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1099). {cite:muwatta-maruf-1997 p.459}"
  tr: "Yahya şöyle dedi: Malik'e, Zül-Huleyfe'de kendine kurbanlık hayvan alan, onu işaretleyen ve çelenk takan, ancak Cühfe'ye ulaşana kadar ihrama girmeyen bir kimse hakkında soru soruldu. Malik şöyle dedi: Ben onun için bunu onaylamıyorum ve yaptığı şey doğru değil. Hac yapmayı düşünmeyen bir kimse hariç, ihrama girmeden önce kurbanlık hayvanı çelenk takmamalı veya işaretlememelidir; aksi takdirde kurbanı gönderip ailesiyle birlikte kalmalıdır. Araştırmacı, bunu Ebu Musab'ın (1099) Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.459}"
  id: "Yahya berkata: Malik ditanya tentang seseorang yang mengambil hewan kurban untuk dirinya sendiri, menandainya, dan mengalungkannya di Dzul Hulayfah, tetapi tidak memasuki keadaan ihram sampai ia sampai di Juhfah. Beliau berkata: Aku tidak menyetujui hal itu baginya, dan dia tidak berbuat benar dengan apa yang dilakukannya. Dia seharusnya tidak mengalungkan atau menandai hewan kurban kecuali pada saat memasuki keadaan ihram, kecuali jika itu adalah seorang pria yang tidak berniat melaksanakan haji, dalam hal ini dia harus mengirimkannya dan tetap bersama keluarganya. Peneliti menyebutkan bahwa Abu Mus'ab (1099) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.459}"
