label: { ar: "الموطأ 967 — مالك: من خرج بهدي لنفسه فأشعره وقلده بذي الحليفة ولم يحرم حتى جاء الجحفة: لا أحب ذلك له، ولا يقلد الهدي ولا يشعره إلا عند الإهلال، إلا رجل لا يريد الحج فيبعث به ويقيم في أهله", en: "Muwatta 967" }
summary:
  ar: "يقول يحيى: سئل مالك عمن خرج بهدي لنفسه فأشعره وقلده بذي الحليفة ولم يحرم هو حتى جاء الجحفة. فقال: لا أحب ذلك له، ولم يصب من فعله، ولا ينبغي له أن يقلد الهدي ولا يشعره إلا عند الإهلال، إلا رجل لا يريد الحج فيبعث به ويقيم في أهله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1099). {cite:muwatta-maruf-1997 p.459}"
