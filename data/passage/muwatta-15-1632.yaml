label: { ar: "الموطأ 1632 — مالك في المخيرة: إذا خيرها زوجها فاختارت نفسها فقد طلقت ثلاثا، وإن قال لم أخيرك إلا واحدة فليس ذلك له", en: "Muwatta 1632", es: "Muwatta 1632", fr: "Muwatta 1632", ur: "موطا 1632", tr: "El-Muvatta 1632 - Malik, seçme hakkı olan kadın hakkında: Eğer kocası ona seçme hakkı verirse ve kadın kendini seçerse, üç defa boşanmış olur. Ancak kocası, “Sana sadece bir seçme hakkı verdim” derse, bu onun için caiz değildir.", id: "Al-Muwatta 1632 — Malik tentang wanita yang memiliki pilihan: Jika suaminya memberinya pilihan dan dia memilih sendiri, maka dia diceraikan tiga kali. Tetapi jika dia berkata, “Aku hanya memberimu satu pilihan,” maka itu tidak diperbolehkan baginya." }
summary:
  ar: "يقول مالك في المخيرة، إذا خيرها زوجها فاختارت نفسها، فقد طلقت ثلاثا. وإن قال زوجها لم أخيرك إلا واحدة، فليس ذلك له، وذلك أحسن ما سمعت. {cite:muwatta-maruf-1997 p.73}"
  tr: "Malik, bir kadına seçim hakkı verildiğinde şunları söylüyor: Eğer kocası ona seçim hakkı verirse ve kadın kendini seçerse, üç kez boşanmış sayılır. Eğer kocası, \"Sana sadece bir seçim hakkı verdim\" derse, bunu yapmaya hakkı yoktur ve bu duyduğum en iyi görüştür. {cite:muwatta-maruf-1997 s.73}"
  id: "Malik berkata mengenai seorang wanita yang diberi pilihan: jika suaminya memberinya pilihan dan dia memilih sendiri, maka dia diceraikan tiga kali. Jika suaminya berkata, \"Aku hanya memberimu satu pilihan,\" maka dia tidak berhak melakukan itu, dan itu adalah pendapat terbaik yang pernah kudengar. {cite:muwatta-maruf-1997 p.73}"
