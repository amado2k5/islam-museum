text: "… الجليد في سرية من المهاجرين أصبح بهم العدو؛ فعليكم بالجهاد. ستأتي في ترجمة علقمة بن علاثة. وروى أبو يعلى من طريق إسماعيل بن أبي خالد، عن قال الزُّبير: ولما حضرت خالداً الوفاة أوصى إلى حمر قَيْس، قال: قال خالد: ما …"
