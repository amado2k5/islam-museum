text: "يشآء وهو أعلم بٱلمهتدين) (القصص: ٥٦) يا أخا تنوخ، إني كتبت بكتاب إلى كسرى، فمزقه، والله ممزقه، وممزق ملكه، وكتبت إلى النجاشي بصحيفة، فخرقها، والله مخرقه، ومخرق ملكه، وكتبت إلى صاحبك بصحيفة، فأمسكها، فلن يزال الناس يجدون منه بأسا ما"
