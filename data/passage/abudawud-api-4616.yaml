label: { ar: "سنن أبي داود 4616 — ما يجب على المكلف", en: "Sunan Abi Dawud 4616 — what is binding on the person addressed", ur: "سنن ابی داؤد 4616 — جو مکلف پر واجب ہے", fr: "Sunan Abi Dawud 4616 — ce qui s'impose à la personne responsable", es: "Sunan Abi Dawud 4616 — lo que obliga a la persona responsable", tr: "Sunan Abi Davud 4616 — Sorumlu kişiye farz olanlar", id: "Sunan Abi Dawud 4616 — Apa yang wajib dilakukan oleh orang yang bertanggung jawab" }
text: "حَدَّثَنَا أَبُو كَامِلٍ، حَدَّثَنَا إِسْمَاعِيلُ، حَدَّثَنَا خَالِدٌ الْحَذَّاءُ، قَالَ قُلْتُ لِلْحَسَنِ { مَا أَنْتُمْ عَلَيْهِ بِفَاتِنِينَ * إِلاَّ مَنْ هُوَ صَالِ الْجَحِيمِ } قَالَ إِلاَّ مَنْ أَوْجَبَ اللَّهُ تَعَالَى عَلَيْهِ أَنَّهُ يَصْلَى الْجَحِيمَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4616، يرد فيه ذكر ما يجب على المكلف. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 4616 (Model Behavior of the Prophet (Kitab Al-Sunnah)), whose wording mentions what is binding on the person addressed. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 4616، جس کے الفاظ میں جو مکلف پر واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 4616, dont le texte mentionne ce qui s'impose à la personne responsable. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 4616, cuyo texto menciona lo que obliga a la persona responsable. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da 4616 numaralı hadis, sorumlu bir kişi için farz olan şeylerden bahsetmektedir. Farz görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh amelleri, haram amelleri ve küçük günahları derleyen bu eser, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte, metinde yer alanları açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4616, menyebutkan apa yang wajib bagi orang yang bertanggung jawab. Penyusun kitab tentang kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
