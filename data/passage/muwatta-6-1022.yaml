label: { ar: "الموطأ 1022 — مالك: كل شيء صيد في الحرم أو أُرسل عليه كلب في الحرم فقُتل ذلك الصيد في الحل فلا يحل أكله، وعلى من فعل ذلك جزاء الصيد؛ والذي يرسل كلبه في الحل فيطلبه حتى يصيده في الحرم فلا يؤكل ولا جزاء عليه، إلا أن يكون أرسله عليه وهو قريب من الحرم", en: "Muwatta 1022", es: "Muwatta 1022", fr: "Muwatta 1022", ur: "موطا 1022", tr: "El-Muvatta 1022 — Malik: Kutsal alan içinde avlanan veya kutsal alan içinde avlanmak üzere köpek gönderilen ve daha sonra kutsal alan dışında öldürülen hiçbir şeyin yenmesi caiz değildir. Bunu yapan kişi avcılık cezasını çeker. Benzer şekilde, bir kimse köpeğini kutsal alan dışına bir hayvan avlamak için gönderir ve köpek hayvanı kutsal alan içinde yakalarsa, hayvanın yenmesi caiz değildir ve o kişi için bir ceza yoktur, ancak köpeği hayvan kutsal alana yakınken göndermişse durum farklıdır.", id: "Al-Muwatta 1022 — Malik: Apa pun yang diburu di dalam tempat suci, atau yang untuknya anjing dikirim ke dalam tempat suci dan kemudian dibunuh di luar tempat suci, tidak boleh dimakan. Orang yang melakukan ini harus membayar hukuman atas perburuannya. Demikian pula, jika seseorang mengirim anjingnya ke luar tempat suci untuk berburu binatang dan anjing itu menangkapnya di dalam tempat suci, maka binatang itu tidak boleh dimakan, dan tidak ada hukuman baginya, kecuali jika ia mengirim anjing itu untuk mengejarnya ketika binatang itu berada dekat tempat suci." }
summary:
  ar: "أول حديث في باب أمر الصيد في الحرم. قول يرويه يحيى عن مالك: كل شيء صيد في الحرم أو أُرسل عليه كلب في الحرم فقُتل ذلك الصيد في الحل، فإنه لا يحل أكله، وعلى من فعل ذلك جزاء الصيد. وأما الذي يرسل كلبه على الصيد في الحل فيطلبه حتى يصيده في الحرم، فإنه لا يؤكل، وليس عليه في ذلك جزاء، إلا أن يكون أرسله عليه وهو قريب من الحرم، فإن أرسله قريباً من الحرم فعليه جزاؤه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1153–1154) وسويد (578). {cite:muwatta-maruf-1997 p.477}"
  tr: "Kutsal alan içinde avlanma bölümündeki ilk hadis. Yahya'nın Malik'ten rivayet ettiği bir hadis: Kutsal alan içinde avlanan veya kutsal alan içinde avı takip etmesi için köpek gönderilen ve avın kutsal alan dışında öldürüldüğü hiçbir şeyin yenmesi caiz değildir. Bunu yapan kişi av cezasını çeker. Ancak, avı kutsal alan dışında takip etmesi için köpeğini gönderen ve avı kutsal alan içinde yakalayan kimse için bu caiz değildir ve eğer avı kutsal alanın yakınındayken takip etmişse, ceza ödemesi gerekir. Eğer avı kutsal alanın yakınındayken takip etmişse, ceza ödemesi gerekir. Editör, bu hadisin Malik'ten Ebu Mus'ab (1153-1154) ve Suveyd (578) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.477}"
  id: "Hadits pertama dalam bab tentang berburu di dalam tempat suci. Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Apa pun yang diburu di dalam tempat suci, atau yang buruannya diburu dengan anjing di dalam tempat suci dan buruannya ditangkap di luar tempat suci, tidak boleh dimakan. Orang yang melakukan ini harus membayar denda karena berburu. Adapun orang yang mengirim anjingnya untuk mengejar buruan di luar tempat suci, dan anjing itu mengejarnya hingga menangkapnya di dalam tempat suci, tidak boleh dimakan, dan dia tidak dikenakan denda kecuali jika dia mengirim anjingnya mengejar buruan tersebut ketika berada di dekat tempat suci. Jika dia mengirimnya di dekat tempat suci, maka dia harus membayar denda. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1153–1154) dan Suwaid (578). {cite:muwatta-maruf-1997 p.477}"
