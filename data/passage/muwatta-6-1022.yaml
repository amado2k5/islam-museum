label: { ar: "الموطأ 1022 — مالك: كل شيء صيد في الحرم أو أُرسل عليه كلب في الحرم فقُتل ذلك الصيد في الحل فلا يحل أكله، وعلى من فعل ذلك جزاء الصيد؛ والذي يرسل كلبه في الحل فيطلبه حتى يصيده في الحرم فلا يؤكل ولا جزاء عليه، إلا أن يكون أرسله عليه وهو قريب من الحرم", en: "Muwatta 1022" }
summary:
  ar: "أول حديث في باب أمر الصيد في الحرم. قول يرويه يحيى عن مالك: كل شيء صيد في الحرم أو أُرسل عليه كلب في الحرم فقُتل ذلك الصيد في الحل، فإنه لا يحل أكله، وعلى من فعل ذلك جزاء الصيد. وأما الذي يرسل كلبه على الصيد في الحل فيطلبه حتى يصيده في الحرم، فإنه لا يؤكل، وليس عليه في ذلك جزاء، إلا أن يكون أرسله عليه وهو قريب من الحرم، فإن أرسله قريباً من الحرم فعليه جزاؤه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1153–1154) وسويد (578). {cite:muwatta-maruf-1997 p.477}"
