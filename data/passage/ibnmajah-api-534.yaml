label: { ar: "سنن ابن ماجه 534 — وصف المؤمن", en: "Sunan Ibn Majah 534 — a description of the believer", ur: "سنن ابن ماجہ 534 — مومن کا وصف", es: "Sunan Ibn Majah 534 — una descripción del creyente", fr: "Sunan Ibn Majah 534 — une description du croyant", tr: "Sunan İbn Majah 534 — Müminin Tanımı", id: "Sunan Ibn Majah 534 — Deskripsi tentang Orang Beriman" }
text: "… بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي رَافِعٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّهُ لَقِيَهُ النَّبِيُّ ـ فِي طَرِيقٍ مِنْ طُرُقِ الْمَدِينَةِ وَهُوَ جُنُبٌ فَانْسَلَّ فَفَقَدَهُ النَّبِيُّ ـ فَلَمَّا جَاءَ قَالَ \" أَيْنَ كُنْتَ يَا أَبَا هُرَيْرَةَ \". قَالَ يَا رَسُولَ اللَّهِ لَقِيتَنِي وَأَنَا جُنُبٌ فَكَرِهْتُ أَنْ أُجَالِسَكَ حَتَّى أَغْتَسِلَ. فَقَالَ رَسُولُ اللَّهِ ـ \" الْمُؤْمِنُ لاَ يَنْجُسُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 534، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 534 (The Book of Purification and its Sunnah), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 534، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 534 (El Libro de la Purificación y su Sunnah), menciona una descripción del creyente. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 534 (Le Livre de la Purification et sa Sunna), mentionne une description du croyant. Le navigateur « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
  tr: "İbn Majah Sünen'inde yer alan 534 numaralı hadis, mümini tanımlar. Bu hadis, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri ile birlikte, bir araştırmacı tarafından derlenmiş olup, bu dört kategori içinde Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetler içermektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 534, menjelaskan tentang orang beriman. Hadits ini, bersama dengan rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri orang beriman, disusun oleh seorang peneliti dan mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka dalam empat kategori tersebut."
