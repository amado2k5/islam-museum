label: { ar: "سنن ابن ماجه 534 — وصف المؤمن", en: "Sunan Ibn Majah 534 — a description of the believer", ur: "سنن ابن ماجہ 534 — مومن کا وصف" }
text: "… بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي رَافِعٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّهُ لَقِيَهُ النَّبِيُّ ـ فِي طَرِيقٍ مِنْ طُرُقِ الْمَدِينَةِ وَهُوَ جُنُبٌ فَانْسَلَّ فَفَقَدَهُ النَّبِيُّ ـ فَلَمَّا جَاءَ قَالَ \" أَيْنَ كُنْتَ يَا أَبَا هُرَيْرَةَ \". قَالَ يَا رَسُولَ اللَّهِ لَقِيتَنِي وَأَنَا جُنُبٌ فَكَرِهْتُ أَنْ أُجَالِسَكَ حَتَّى أَغْتَسِلَ. فَقَالَ رَسُولُ اللَّهِ ـ \" الْمُؤْمِنُ لاَ يَنْجُسُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 534، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 534 (The Book of Purification and its Sunnah), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 534، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
