text: "… يعمل أحد عن أحد عمل الأبدان ؛ لأن الأبدان تعبدت بعمل، فلا يجزى عنها أن يعمل غيرها، ليس الحج والعمرة بالخبر الذى جاء عن النبى ول في وبأن فيهما نفقة، وأن الله فرضهما على من وجد إليهما السبيل، والسبيل بالمال. …"
summary:
  ar: "مقطع من الأم للشافعي، ص 159، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Umm, p. 159, whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الام، شافعی، ص 159 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
