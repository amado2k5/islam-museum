label: { ar: "الأم للشافعي، ص 159 — ما فرضه الله ورسوله، ما فُرض على الناس", en: "al-Shafi'i's al-Umm, p. 159 — what God and His Messenger made obligatory; what was made obligatory on people", ur: "الام، شافعی، ص 159 — جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا", fr: "al-Umm de al-Shafi'i, p. 159 — ce que Dieu et Son Messager ont rendu obligatoire ; ce qui a été imposé aux gens", es: "al-Umm de al-Shafi'i, p. 159 — lo que Dios y Su Mensajero hicieron obligatorio; lo que se impuso a la gente", tr: "Şafiî'nin El-Umm adlı eserinden, s. 159 — Allah ve Resulü'nün takdir ettiği, insanlar için takdir edilen şeyler.", id: "Al-Umm karya Al-Shafi’i, hlm. 159 — Apa yang telah ditetapkan oleh Allah dan Rasul-Nya, apa yang telah ditetapkan untuk manusia." }
text: "… يعمل أحد عن أحد عمل الأبدان ؛ لأن الأبدان تعبدت بعمل، فلا يجزى عنها أن يعمل غيرها، ليس الحج والعمرة بالخبر الذى جاء عن النبى ول في وبأن فيهما نفقة، وأن الله فرضهما على من وجد إليهما السبيل، والسبيل بالمال. …"
summary:
  ar: "مقطع من الأم للشافعي، ص 159، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Umm, p. 159, whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الام، شافعی، ص 159 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Umm de al-Shafi'i, p. 159, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Umm de al-Shafi'i, p. 159, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin El-Umm adlı eserinin 159. sayfasından, Allah ve Resulü'nün emrettiği ve insanlar için farz olan şeylerden bahseden bir alıntı. Metin, makine tarafından okunabilir taranmış bir kopyadan alınmış olup, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Umm karya Al-Shafi'i, halaman 159, yang menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, dan apa yang wajib dilakukan oleh manusia. Teks ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
