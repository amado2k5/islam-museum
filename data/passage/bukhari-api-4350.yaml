label: { ar: "صحيح البخاري 4350 — الأب والأبوة", en: "Sahih al-Bukhari 4350 — the father and fatherhood", ur: "صحیح بخاری 4350 — باپ اور والدیت", es: "Sahih al-Bukhari 4350 — El padre y la paternidad", fr: "Sahih al-Bukhari 4350 — Le père et la paternité", tr: "Sahih el-Buhari 4350 — Baba ve Babalık", id: "Sahih al-Bukhari 4350 — Ayah dan Peran Ayah" }
text: "… بْنُ بَشَّارٍ، حَدَّثَنَا رَوْحُ بْنُ عُبَادَةَ، حَدَّثَنَا عَلِيُّ بْنُ سُوَيْدِ بْنِ مَنْجُوفٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ ـ قَالَ بَعَثَ النَّبِيُّ عَلِيًّا إِلَى خَالِدٍ لِيَقْبِضَ الْخُمُسَ وَكُنْتُ أُبْغِضُ عَلِيًّا، وَقَدِ اغْتَسَلَ، فَقُلْتُ لِخَالِدٍ أَلاَ تَرَى إِلَى هَذَا فَلَمَّا قَدِمْنَا عَلَى النَّبِيِّ ذَكَرْتُ ذَلِكَ لَهُ فَقَالَ \" يَا بُرَيْدَةُ أَتُبْغِضُ عَلِيًّا \". فَقُلْتُ نَعَمْ. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4350، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4350 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4350، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4350 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4350 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 4350 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4350, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
