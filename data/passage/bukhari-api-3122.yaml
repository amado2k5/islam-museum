label: { ar: "صحيح البخاري 3122 — ما أُحل", en: "Sahih al-Bukhari 3122 — what was made lawful", ur: "صحیح بخاری 3122 — جو حلال کیا گیا", es: "Sahih al-Bukhari 3122 — lo que se hizo lícito" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا هُشَيْمٌ، أَخْبَرَنَا سَيَّارٌ، حَدَّثَنَا يَزِيدُ الْفَقِيرُ، حَدَّثَنَا جَابِرُ بْنُ عَبْدِ اللَّهِما ـ قَالَ قَالَ رَسُولُ اللَّهِ \" أُحِلَّتْ لِي الْغَنَائِمُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3122، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 3122 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 3122، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3122 (Una quinta parte del botín para la causa de Alá (Khumus)), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
