text: "… من لحمها، وكرهه الليث، قال : فان طبخ لحمها فلا بأس بأكل الذمى مع المسلمين منه، هذا كلام ابن المنذر، ولم أر لأصحابنا كلاما فيه، ومقتضى المذهب أنه يجوز إطعامهم من أضحية التطوع دون الواجبة والله تعالى أعلم ؟ العاشرة …"
summary:
  ar: "مقطع من المجموع للنووي، ص 408، يرد فيه ذكر الواجب، والتطوع، وما لا بأس به، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 408, whose wording mentions the obligatory (wajib), the voluntary act (tatawwu'), what is said to be no harm, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 408 کا اقتباس جس میں واجب، تطوع ⁦(نفلی عمل)⁩، جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 408, dont le texte mentionne l'obligatoire (wajib), l'acte volontaire (tatawwu'), ce qui est dit sans inconvénient, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 408, cuyo texto menciona lo obligatorio (wajib), el acto voluntario (tatawwu'), lo que se dice que no tiene inconveniente, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Mecmu' adlı eserinin 408. sayfasından, farz, nafile, izin verilen ve mekruh edilen fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz, tavsiye edilen, mekruh edilen, yasaklanan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Majmu' karya al-Nawawi, halaman 408, yang menyebutkan amalan wajib, sunnah, diperbolehkan, dan makruh; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, sunnah, makruh, haram, dan dosa-dosa kecil."
