text: "… هذِهِ السَّاعَةَ غَضَباً عَلَى أَهْلِهَا، أَلاَ ثُمَّ قَدْ رَجَعَتْ كَحُرْمَتِهَا بِالأَمْسِ، فَلْيُبَلِّغ الشَّاهِدُ مِنْكُمُ الْغَائِبَ؛ فَمَنْ قَالَ لَكُمْ إِنَّ رَسُولَ الله وَا لِ قَاتَلَ فِيهَا، فَقُولُوا : إنَّ اللّٰه قَدْ أَحَلَّهَا لِرَسُولِهِ، وَلَمْ يُحْلِلْهَا لَكُمْ، يَا مَعْشَرَ خُزَاعَةَ ارْفَعُوا أَيْدِيَكُمْ …"
