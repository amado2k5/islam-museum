label: { ar: "الموطأ 2750 — أبو قتادة بن ربعي: الرؤيا الصالحة من الله والحلم من الشيطان فلينفث عن يساره", en: "Muwatta 2750", ur: "موطأ 2750 — ابو قتادہ: نیک خواب اللہ کی طرف سے، برا خواب شیطان کی", es: "Muwatta 2750", fr: "Muwatta 2750", tr: "El-Muvatta 2750 — Ebu Katade bin Ribi: Güzel rüya Allah'tandır, kötü rüya ise şeytandandır, o halde soluna tükürsün.", id: "Al-Muwatta 2750 — Abu Qatada bin Rib’i: Mimpi baik berasal dari Allah dan mimpi buruk berasal dari setan, maka hendaklah ia meludah ke sebelah kirinya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي سلمة بن عبد الرحمن أنه سمع أبا قتادة بن ربعي يقول: سمعت رسول الله يقول: الرؤيا الصالحة من الله، والحلم من الشيطان، فإذا رأى أحدكم الشيء يكرهه فلينفث عن يساره ثلاث مرات إذا استيقظ، وليتعوذ بالله من شرها، فإنها لن تضره إن شاء الله. قال أبو سلمة: إن كنت لأرى الرؤيا هي أثقل علي من الجبل، فلما سمعت هذا الحديث فما كنت أبالي بها. {cite:muwatta-maruf-1997 p.547}"
  ur: "موطأ میں حدیث، نمبر 2750: ابو قتادہ بن ربیعی سے نبی نے کہا: «نیک خواب اللہ کی طرف سے ہے اور برا خواب شیطان کی طرف سے؛ جو برا دیکھے تو جاگنے پر بائیں طرف تین بار پھونکے اور اس کی برائی سے پناہ مانگے»۔"
  tr: "Malik, Yahya ibn Sa'id'den, o da Ebu Selama ibn Abdül-Rahman'dan rivayet ettiğine göre, Ebu Katade ibn Ribi'i'nin şöyle dediğini işittiğini rivayet etmiştir: \"Allah Resulü'nün şöyle buyurduğunu işittim: 'Güzel rüya Allah'tandır, kötü rüya ise şeytandandır. Sizden biri hoşuna gitmeyen bir şey görürse, uyanınca soluna üç defa tükürsün ve ondan Allah'a sığınsın; Allah'ın izniyle ona zarar vermez.'\" Ebu Selama şöyle dedi: \"Ben eskiden dağdan daha ağır rüyalar görürdüm, fakat bu hadisi işittiğimden beri onlara aldırış etmedim.\" {cite:muwatta-maruf-1997 s.547}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abu Salama ibn Abd al-Rahman, bahwa ia mendengar Abu Qatada ibn Rib'i berkata: Aku mendengar Rasulullah SAW bersabda: \"Mimpi baik berasal dari Allah, dan mimpi buruk berasal dari setan. Maka jika salah seorang dari kalian melihat sesuatu yang tidak disukainya, hendaklah ia meludah ke kiri tiga kali ketika bangun tidur, dan hendaklah ia berlindung kepada Allah dari keburukannya, karena jika Allah mengizinkan, mimpi itu tidak akan membahayakannya.\" Abu Salama berkata: \"Dahulu aku sering bermimpi yang sangat berat, lebih berat dari gunung, tetapi setelah mendengar hadits ini, aku tidak lagi mempedulikannya.\" {cite:muwatta-maruf-1997 p.547}"
