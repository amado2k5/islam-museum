label: { ar: "الموطأ 2750 — أبو قتادة بن ربعي: الرؤيا الصالحة من الله والحلم من الشيطان فلينفث عن يساره", en: "Muwatta 2750" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي سلمة بن عبد الرحمن أنه سمع أبا قتادة بن ربعي يقول: سمعت رسول الله يقول: الرؤيا الصالحة من الله، والحلم من الشيطان، فإذا رأى أحدكم الشيء يكرهه فلينفث عن يساره ثلاث مرات إذا استيقظ، وليتعوذ بالله من شرها، فإنها لن تضره إن شاء الله. قال أبو سلمة: إن كنت لأرى الرؤيا هي أثقل علي من الجبل، فلما سمعت هذا الحديث فما كنت أبالي بها. {cite:muwatta-maruf-1997 p.547}"
