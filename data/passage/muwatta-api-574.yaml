label: { ar: "الموطأ 574 — تعزية ومواساة وصبر عند المصيبة", en: "Muwatta of Imam Malik 574 — condolence, consolation and patience at a loss", ur: "موطا امام مالک 574 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Muwatta de l'imam Malik 574 — des condoléances, une consolation et la patience devant la perte", es: "Muwatta del Imam Malik 574 — condolencias, consuelo y paciencia ante la pérdida" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ مُحَمَّدِ بْنِ عَمْرِو بْنِ حَلْحَلَةَ الدِّيلِيِّ، عَنْ مَعْبَدِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِي قَتَادَةَ بْنِ رِبْعِيٍّ، أَنَّهُ كَانَ يُحَدِّثُ : أَنَّ رَسُولَ اللَّهِ مُرَّ عَلَيْهِ بِجَنَازَةٍ فَقَالَ : \" مُسْتَرِيحٌ وَمُسْتَرَاحٌ مِنْهُ \". قَالُوا : يَا رَسُولَ اللَّهِ مَا الْمُسْتَرِيحُ وَالْمُسْتَرَاحُ مِنْهُ قَالَ : \" الْعَبْدُ الْمُؤْمِنُ يَسْتَرِيحُ مِنْ نَصَبِ …"
summary:
  ar: "حديث في الموطأ، رقم 574، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Muwatta of Imam Malik, no. 574 (Burials), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "موطا امام مالک کی حدیث نمبر 574، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Muwatta de l'imam Malik, n° 574, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Muwatta del Imam Malik, n.º 574, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
