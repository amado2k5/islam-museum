text: "… : لقاء الاخوان، وادخال السرور عليهم. حدثنا أبو بكر بن مالك ثنا عبد الله بن احمد بن حنبل حدثنى أبى ثنا حجاج ثنا أبو معشر. قال : كان بن المنكدر بمنى ؛ وكان سيداً يطعم الطعام ويجتمع عنده القراء. حدثنا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 149، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 149, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 3، ص 149 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 3, pág. 149, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Hilyat al-Awliya' d'Abu Nu'aym (tome 3, p. 149) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
