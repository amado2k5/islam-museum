text: "جمرز من المية اللّٰه، صلّعم، يقاتل المشركين من قريش فقالا : لا تسأَل أَثرًا بعد عين. فأَسلما ثمّ خرجا حى أَتيسا النبيّ، صلّم : بأُحُد فيجدان القوم يقتتلون والدولة لرسول اللّٰه وأصحابه، فأَغاروا مع المسلمين فى النَّهْبِ، وجاءت الخيل من …"
