text: "… النَّيْسَابُورِيُّ، حَدَّثَنَا عَمْرُو بْنُ أَبِي سَلَمَةَ أَبُو حَفْصٍ التِّنِّيسِيُّ، عَنْ زُهَيْرِ بْنِ مُحَمَّدٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ يُسَلِّمُ فِي الصَّلاَةِ تَسْلِيمَةً وَاحِدَةً تِلْقَاءَ وَجْهِهِ يَمِيلُ إِلَى الشِّقِّ الأَيْمَنِ شَيْئًا. قَالَ وَفِي الْبَابِ عَنْ سَهْلِ بْنِ سَعْدٍ. قَالَ أَبُو عِيسَى وَحَدِيثُ عَائِشَةَ لاَ نَعْرِفُهُ مَرْفُوعًا إِلاَّ مِنْ هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 296، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 296 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 296، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
