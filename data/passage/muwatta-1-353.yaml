text: "من صلى المغرب أو الصبح ثم أدركهما مع الإمام فلا يعد لهما"
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول إن من صلى المغرب أو الصبح ثم أدركهما مع الإمام فلا يعدهما؛ وهو في باب إعادة الصلاة مع الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.194}"
