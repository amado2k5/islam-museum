text: "… المقال العبر. أخرجه البخاري في الصحيح،. ومسلم في الصحيح، عن أبي هريرة في كتاب السلام باب الطب والمرض والرقى حديث رقم،. والترمذي في السنن كتاب الطب باب ما جاء أن العين حق والغسل لها حديث رقم، وقال أبو عيسى حديث …"
