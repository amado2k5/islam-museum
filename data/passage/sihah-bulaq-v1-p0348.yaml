text: |-
  ⁦(فصل الثاء)⁩
  ٢٩٢
  أى مخسور وخاسر يعنى فى انتسابها إلى اليمن والممبر مثال الجلس الموضع الذى تلدفيه المرأة
  من الارض وكذلاحيث تضع الناقة وربعاقيل لجلس الرجل مثبر ⁦(تجر)⁩ الثجرة بالضم
  وسط الوادى ومتعه وتجرة النحر وسطه وورق تجر بالفتح أى عريض وانتجر الدم افسة فى
  انفجروالثجير تفل كل شي يعصر والعامة تقوله بالتاء وفى الحديث لا تتجروا أى لا تخلطوا
  تجير التمر مع غسيره فى النبيذ ر حاب ترأى كثير الماء وعيز ثرة وهى مصابة تأتى
  من قبل قبلة اهل العراق قال عنترة
  جادت علميه كل عيززة * فتركن كل قرارة كالدرهم
  دفاقة ثرّة وعنزثرة أى واسعة الاحليل وربيما قالواطعنة ترّة وناقة ثرة أى غزيرة وقد ثرت
  نترو تترثرا والثرثرة كثرة الكلام وترديده يقسال ثرتر الرجل فهوثر ثار مهذار والترثاراسم نهر
  وتروت المكان مثسل تريتسه اذائيته ⁦(نعر)⁩ التعرورانمثل الحلتين تمكسفات القنب
  من خارج والتعارير النسا ليل وحل الطرائيت أيضا. ⁦(ت جر)⁩ تعجرت الدم وغيره فاتعنجر
  أى صيته فانصب وتصغير المتعجر مشيعج ومتبعيج غر لثة رما تقدم من الاسنان يقال
  ثغرته أى كسرت ثغره واذاسقطت رواضع الصبى قبل نغرفهو مثغور فاذانيتت قيسل أنغر
  وأصله انتغر فقلبت الشاءتاء ثم أدغمت وان شقت قلت آثغر تجع-ل الحرف الاصلى (هوالظاهر
  والأفر أيضاموضع المخافة من فروج لبلدان والشغرة بالضم نقرة النحر التى بين الترقوتين
  والشغرة أيضا الثلة يقال ثغرناهم أى سددنا عليهم ثلم الجيل قال الشاءر ا ن مقبل
  وهم تغروا أقرانهم بمضرس وهذه مدينة فيها تغروثم ⁦(تفر)⁩ الثفرللسسباع وكل ذات
  مخلب ينزلة الحياء من النافة وربما استعير اغيرهما قال الأخطل
  جزى اللّٰه عنا الاعوربن ملامة • وفروة ثفر النورة المتضاجم
  وفروة اسم رجل ونصب الثفرعسلى البدل منه وهولة.ه كقولك عبد اللّٰه قفة وائما خفض
  المتضاجم وهو من صفة الثفر على الجوار كقولهم حرضب تخرب والثفر بالتحريك ثفر الداية
  وقد أثفرتما أى شددت عليها التفروداية ممفارير مى بسرجه الى مؤخره واستشفر الرجل بئوبه
  اذالوى بطرفه بين رجليه الى حجزته واستثفر السكلب بذنبه اذا جعله بين نفذيه قال الزبرقان
  تعدو الذئاب على من لاكلاب له * وتفى مريض المستثر الحامى
  ⁦( تمر)⁩ الثمرة واحدة الثمر والثمرات وجمع الثمر غمار مثل جبل وجبال قال الفرّاء وجع
  النمارتمر مثل كتاب وكتب وجمع النمر أغمار مثل عنق وأعناق والثمر أيضا المال المنمر
  ويخفف ويثقل وقرأ أبو عمرو وكان له؟ر وفسر بانواع الاموال ويقال أغمر الشجرأى طلع
  ثمره وشجر ثامرإذا أدرك تمره وشجرة غراء أى ذات غمر قال الشاعر أبوذؤيب
  نظل على النمراء -نها جوارس والثميرة مايظه (من الزبد قبل أن يجتمع ويبلسغ إناه من الصاوح
  يقال قدة والسفاء تثميرا وكذلك أثمواذاظهر عليه تحبب الزبدوائمر الرجل اذا كثر ماله وعمر
  لله ماله أى كثره وابن غير الليلة القمراء وغر السياط عقد أطرافها ⁦(نور)⁩ نار الغبار يثور
  نورا وثورانا أى سطع وآثاره غيره وثارت بفلان الحصبة ويقال كيف الدبي فيقال ثاثر
  قال ابن سلام فى طبقات الشعراء
  سألت يونسع-ن بيت رووه
  للزبرقان بن بدر وهوتحدو
  الذئاب الخ فقال ه وللنابغة أظن
  الزبرقات بن بدر استزاده فى شعره
  ك المدل حين باءموضعه
  لا مجتلباله وقد تفعل العرب
  ذلك لا يريدون به السرقة اه
  مزهر فى صفيحة ٩٠
