text: "… فلو كان حراماً، لَيَنها له رسولُ اللّٰه، وإن كانت قد حرمت عليه. قالوا: وفي صحيح البخاري، من حديث القاسم بن محمد، عن عائشة أمِّ المؤمنين، أن رجلاً طلق امرأته ثلاثاً، فتزوَّجت، فطلقت، فسئل رسول اللّٰه ولية، أتحل للأول؟ قال: لا …"
