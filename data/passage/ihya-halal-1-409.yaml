text: "… من الحقى الجاهلين لم يحكم قط علما ولم يهذب خلقا ولم يرتب عملا ولم يراقب قلبا سوى اتباع الهوى وتلقف الهذيان وحفظه. وفرقه أخرى وقعت فى الإباحة وطووا بساط الشرع ورفضوا الاحكام وسووا بين الحلال والحرام فبعضهم يزعم أن اللّٰه …"
