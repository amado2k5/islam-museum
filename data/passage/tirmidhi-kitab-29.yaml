summary:
  ar: "القسم 29 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفرائض عن رسول الله»، ويضم فيها النصوص من 2090 إلى 2115 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 29 of Jami' al-Tirmidhi (Chapters On Inheritance) in the division of the open hadith dataset the museum took its reports from: reports 2090 to 2115 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 29، عنوان «کتاب الفرائض عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2090 تا 2115۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 29 de Jami' al-Tirmidhi (Capítulos sobre la herencia) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2090 al 2115, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 29 de Jami' al-Tirmidhi (Chapitres sur l'héritage), qui comprend les hadiths 2090 à 2115 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
