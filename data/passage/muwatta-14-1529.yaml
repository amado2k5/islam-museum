label: { ar: "الموطأ 1529 — عبد الله بن عمر: نهى رسول الله عن الشغار، وهو أن يزوج الرجل ابنته على أن يزوجه الآخر ابنته، ليس بينهما صداق", en: "Muwatta 1529", es: "Muwatta 1529", fr: "Muwatta 1529", ur: "موطا 1529", tr: "El-Muvatta 1529 — Abdullah bin Umar: Allah'ın Resulü, şigarı yasaklamıştır; bu, bir erkeğin kızını, başka bir erkeğin de kızını kendisine vermesi şartıyla, aralarında mehir olmaksızın evlendirmesidir.", id: "Al-Muwatta 1529 — Abdullah bin Umar: Rasulullah SAW melarang Shighar, yaitu ketika seorang pria menikahi putrinya dengan syarat pria lain menikahkan putrinya kepadanya, tanpa mas kawin di antara mereka." }
text: "الشِّغارُ : أنْ يُزَوِّجَ الرَّجُلُ ابْنتهُ، على أنْ يُزَوِّجِهُ الآخرُ ابْنتهُ، لَيْسَ بَيْنهُما صَداقٌ"
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله نهى عن الشغار، والشغار أن يزوج الرجل ابنته على أن يزوجه الآخر ابنته، ليس بينهما صداق. {cite:muwatta-maruf-1997 p.41}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü şigarı yasaklamıştır. Şigar, bir erkeğin kızını başka bir erkekle, o erkeğin de kızını kendisiyle evlendirmesi şartıyla, aralarında mehir olmaksızın evlendirmesidir. {cite:muwatta-maruf-1997 s.41}"
  id: "Malik meriwayatkan dari Nafi’ yang juga dari Abdullah ibn Umar bahwa Rasulullah SAW melarang Shighar, yaitu ketika seorang laki-laki menikahkan putrinya dengan laki-laki lain dengan syarat laki-laki lain tersebut menikahkan putrinya kepadanya, tanpa adanya mas kawin di antara mereka. {cite:muwatta-maruf-1997 p.41}"
