label: { ar: "الموطأ 1675 — نافع عن ابن عمر: إذا طلق العبد امرأته تطليقتين فقد حرمت عليه حتى تنكح زوجا غيره، وعدة الحرة ثلاث حيض وعدة الأمة حيضتان", en: "Muwatta 1675", es: "Muwatta 1675", fr: "Muwatta 1675", ur: "موطا 1675", tr: "El-Muvatta 1675 — İbn Ömer'den rivayet edildiğine göre Nafi': Bir köle karısını iki kez boşadığında, kadın başka bir kocayla evleninceye kadar ona haram olur. Hükümdar kadın için bekleme süresi üç adet adet döngüsü, köle kadın için ise iki adet adet döngüsüdür.", id: "Al-Muwatta 1675 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Jika seorang budak menceraikan istrinya dua kali, maka istrinya menjadi haram baginya sampai ia menikah lagi. Masa iddah bagi wanita merdeka adalah tiga siklus haid, dan masa iddah bagi budak wanita adalah dua siklus haid." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يقول إذا طلق العبد امرأته تطليقتين فقد حرمت عليه حتى تنكح زوجا غيره، حرة كانت أو أمة. وعدة الحرة ثلاث حيض، وعدة الأمة حيضتان. {cite:muwatta-maruf-1997 p.86}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın şöyle dediğini aktarır: \"Bir köle karısını iki kez boşadığında, ister hür ister köle olsun, başka bir erkekle evleninceye kadar ona haram olur. Hür kadın için bekleme süresi üç adet döngüsü, köle kadın için ise iki adet döngüsüdür.\" {cite:muwatta-maruf-1997 s.86}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: “Jika seorang budak menceraikan istrinya dua kali, maka istrinya menjadi haram baginya sampai ia menikah dengan laki-laki lain, baik ia merdeka maupun budak. Masa iddah bagi perempuan merdeka adalah tiga siklus haid, dan masa iddah bagi perempuan budak adalah dua siklus haid.” {cite:muwatta-maruf-1997 p.86}"
