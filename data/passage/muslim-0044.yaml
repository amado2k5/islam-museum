label: { ar: "مسلم 44 — لا يؤمن أحدكم حتى أكون أحب إليه", en: "Muslim 44 — None of you believes until I am dearer to him", es: "Musulmán 44 — Ninguno de vosotros creerá hasta que yo sea más querido para él.", fr: "Muslim 44 — Aucun de vous ne croit tant que je ne lui suis pas plus cher", ur: "مسلم 44 - تم میں سے کوئی اس وقت تک مومن نہیں ہو سکتا جب تک میں اس سے زیادہ محبوب نہ ہو جاؤں۔", tr: "Müslim 44 — Sizden hiç kimse, bana daha çok sevgi göstermedikçe, gerçekten iman etmiş sayılmaz.", id: "Muslim 44 — Tidak seorang pun di antara kalian benar-benar beriman sampai aku lebih dicintai olehnya" }
text: "قال رسول الله: «لا يؤمن أحدكم حتى أكون أحب إليه من والده وولده والناس أجمعين»"
summary:
  ar: "رواية أنس بن مالك في باب وجوب محبة رسول الله أكثر من الأهل والولد والوالد والناس أجمعين من كتاب الإيمان في صحيح مسلم."
  tr: "Sahih Müslim'in İman Kitabı'nda yer alan, Allah'ın Resulünü aileden, çocuklardan, anne babadan ve bütün insanlardan daha çok sevme yükümlülüğü hakkındaki bölümde Enes bin Malik'in rivayeti."
  id: "Riwayat Anas bin Malik dalam bab tentang kewajiban mencintai Rasulullah lebih dari keluarga, anak-anak, orang tua, dan seluruh manusia, dari Kitab Iman dalam Sahih Muslim."
