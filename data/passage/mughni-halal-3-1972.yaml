text: "… لا تَحِلُ لي، يَحْرُمُ مِنْ الرِّضَاعِ مَا يَحْرُمُ مِنْ النُسَبو، وَهِيَ أبْنَةُ أَخِي مِنْ الرَّضَاعَةِ. مُتْفَقٌ عَلَيْهِ خ: م:. فِي أَخْبَارٍ كَثِيرَةٍ، نَذْكُرُ أَكْتَرَهَا إنْ شَاءَ اللّه تَمَالَى فِي تَضَاعِيفِ الْبَابِ. وَأَجْمَعَ عُلَمَاهُ الأُمَّةِ عَلَى التَّحْرِيمِ بِالرَّضَاعِ. إذَا ثُبَتَ هَذَا، …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1972، يذكر ما أُحل، وما لا يحل، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
