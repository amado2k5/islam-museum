label: { ar: "سنن أبي داود — حديث 155", en: "Sunan Abi Dawud 155 — Purification (Kitab Al-Taharah)", ur: "سنن ابی داؤد — حدیث 155" }
text: "… مُسَدَّدٌ، وَأَحْمَدُ بْنُ أَبِي شُعَيْبٍ الْحَرَّانِيُّ، قَالاَ حَدَّثَنَا وَكِيعٌ، حَدَّثَنَا دَلْهَمُ بْنُ صَالِحٍ، عَنْ حُجَيْرِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، أَنَّ النَّجَاشِيَّ، أَهْدَى إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم خُفَّيْنِ أَسْوَدَيْنِ سَاذَجَيْنِ فَلَبِسَهُمَا ثُمَّ تَوَضَّأَ وَمَسَحَ عَلَيْهِمَا ‏.‏ قَالَ مُسَدَّدٌ عَنْ دَلْهَمِ بْنِ صَالِحٍ ‏.‏ قَالَ أَبُو دَاوُدَ هَذَا مِمَّا تَفَرَّدَ بِهِ أَهْلُ الْبَصْرَةِ ‏.‏"
summary:
  ar: "في سنن أبي داود؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sunan Abi Dawud; mention of the chancery or the barid post."
  ur: "سنن ابی داؤد میں؛ دیوآن یا بریڈ کا ذکر."
