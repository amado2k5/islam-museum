text: "… شاعراً مُعْجَباً برأيه، عبدُ اللّه بنُ مسعود أعلم بذلك. وروى شَرِيك، عن يحيى بن قيس الكِنْديّ قال: أوصى شُرَيْح أن يُصَلَّى عليه بالجَبّانة، وأن لا يُؤْذن به أحدٌ، ولا تتبعه صائحة، وأن لا يُجْعَل على قبره ثوب، وأنّ يُسْرَعَ به …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 8، ص 423، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 8, p. 423, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 8، ص 423 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 8, pág. 423, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 8, page 423, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 8. cildinin 423. sayfasından bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 8, halaman 423, menyebutkan wasiat atau surat wasiat terakhir, pemakaman, kuburan, dan makam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
