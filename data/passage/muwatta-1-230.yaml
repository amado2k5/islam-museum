label: { ar: "الموطأ 230 — ما لي أنازع القرآن؟", en: "Muwatta 230" }
text: "هل قرأ معي منكم أحد آنفاً؟ فقال رجل: نعم أنا يا رسول الله. فقال: إني أقول ما لي أنازع القرآن"
summary:
  ar: "يرويه يحيى عن مالك عن ابن شهاب عن ابن أكيمة الليثي عن أبي هريرة، في باب ترك القراءة خلف الإمام فيما جهر فيه: انصرف النبي من صلاة جهر فيها بالقراءة وسأل هل قرأ معه أحد، فأجاب رجل بنعم، فقال النبي إنه يقول في نفسه: ما لي أُنازع القرآن؟ فانتهى الناس عن القراءة معه فيما يجهر فيه حين سمعوا ذلك. ويخرّجه المحقق عند أبي داود (826) والترمذي (312) والنسائي (2/140) وابن حبان (1849) وأحمد والشافعي والبخاري في القراءة خلف الإمام من طرق أصحاب مالك، ويحيل على التمهيد (11/23). {cite:muwatta-maruf-1997 p.139}"
