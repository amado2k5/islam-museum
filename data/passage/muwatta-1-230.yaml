label: { ar: "الموطأ 230 — ما لي أنازع القرآن؟", en: "Muwatta 230", es: "230 Muwatta", fr: "230 Muwatta", ur: "230 موطا", tr: "El-Muvatta 230 — Kur'an'ı neden tartışıyorum?", id: "Al-Muwatta 230 — Mengapa aku membantah Al-Qur'an?" }
text: "هل قرأ معي منكم أحد آنفاً؟ فقال رجل: نعم أنا يا رسول الله. فقال: إني أقول ما لي أنازع القرآن"
summary:
  ar: "يرويه يحيى عن مالك عن ابن شهاب عن ابن أكيمة الليثي عن أبي هريرة، في باب ترك القراءة خلف الإمام فيما جهر فيه: انصرف النبي من صلاة جهر فيها بالقراءة وسأل هل قرأ معه أحد، فأجاب رجل بنعم، فقال النبي إنه يقول في نفسه: ما لي أُنازع القرآن؟ فانتهى الناس عن القراءة معه فيما يجهر فيه حين سمعوا ذلك. ويخرّجه المحقق عند أبي داود (826) والترمذي (312) والنسائي (2/140) وابن حبان (1849) وأحمد والشافعي والبخاري في القراءة خلف الإمام من طرق أصحاب مالك، ويحيل على التمهيد (11/23). {cite:muwatta-maruf-1997 p.139}"
  id: "Diriwayatkan oleh Yahya dari Malik, dari Ibnu Shihab, dari Ibnu Akima al-Laythi, dari Abu Hurayra, dalam surah tentang menahan diri dari membaca di belakang imam dalam salat yang dibaca dengan suara keras: Nabi (shalawat dan salam kepadanya) menyelesaikan salat di mana beliau membaca dengan suara keras dan bertanya apakah ada yang membaca bersamanya. Seorang laki-laki menjawab ya. Nabi (shalawat dan salam kepadanya) bersabda, “Dia berkata kepada dirinya sendiri, ‘Mengapa aku dipertanyakan tentang Al-Quran?’” Maka orang-orang berhenti membaca bersamanya dalam salat di mana beliau membaca dengan suara keras ketika mereka mendengar ini. Penyunting memasukkannya dalam koleksi Abu Dawud (826), al-Tirmidhi (312), al-Nasa’i (2/140), Ibn Hibban (1849), Ahmad, al-Shafi’i, dan al-Bukhari dalam bab tentang membaca di belakang imam, melalui sanad pengikut Malik, dan merujuk pada al-Tamhid (11/23). {cite:muwatta-maruf-1997 p.139}"
