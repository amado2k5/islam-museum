text: "… الْمُسَيَّبِ، أَنَّهُ قَالَ قَالَ عُمَرُ بْنُ الْخَطَّابِ أَيُّمَا رَجُلٍ تَزَوَّجَ امْرَأَةً وَبِهَا جُنُونٌ أَوْ جُذَامٌ أَوْ بَرَصٌ فَمَسَّهَا فَلَهَا صَدَاقُهَا كَامِلاً وَذَلِكَ لِزَوْجِهَا غُرْمٌ عَلَى وَلِيِّهَا. قَالَ مَالِكٌ وَإِنَّمَا يَكُونُ ذَلِكَ غُرْمًا عَلَى وَلِيِّهَا لِزَوْجِهَا إِذَا كَانَ وَلِيُّهَا الَّذِي أَنْكَحَهَا هُوَ أَبُوهَا أَوْ أَخُوهَا أَوْ مَنْ يُرَى أَنَّهُ يَعْلَمُ ذَلِكَ مِنْهَا فَأَمَّا إِذَا كَانَ وَلِيُّهَا …"
summary:
  ar: "حديث في موطأ مالك، رقم 1099، يذكر الجذام والبرص. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1099 (Marriage), that mentions leprosy and vitiligo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1099، جس میں جذام اور برص کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
