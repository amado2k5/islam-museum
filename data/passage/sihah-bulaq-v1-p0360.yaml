text: |-
  ⁦(أمى)⁩
  العهدو الاصر الذنب والثقسل والاصار والايصرحبل قديريشتيه فى أسفل الحبا-الى وتد
  وجع الاصار أصر وجع الايصر أياصر بقاز هو جارى مؤاصرى أى إصارببته الى جنب
  أصاربيى والاضار والايضر أيضا اعشيش يتال افلان محس لا يجزأ يصره أى لا يقطع
  شيشه وحى متا صرون أى متجاورون والاصير المتقارب وقال لكل منامة هدب أصي
  ( أطر أبوزيد الطرت القوس آطرها آطرا اذاحنيتها قال وتاطرت المرأة تأطرا اذا
  اقامت فى بيتها وأنشد لعمر بن أبى ربيعة
  تأطرن حتى قلت ا--ن بوارحا • وذين كماذاب السديف المسرهد
  وتأطراريمح تدى وإطار المنخل خشبه واطار الخافرما أحاط بالائه رومنه إطار الشفة وكل
  شئ أحاط بشى فه وإطارله قال بشر
  وحل الحى حى بى سبيع • قراضبة ونحن لهم اطار
  والاطرة باضم العقبة التى تلف على مجمع الفوق تقول منه أطرت السهم أطرا والاطرة أيضا
  أن يؤخذر مادودم فيلطخ به كسر القدر قال الراجز قد أصلهت قدرالها بأطره والاطير
  الدنبية. ل أخذ فى بأطير غيرى ⁦(أفر)⁩ أفر البعير بالكسر يأفرأفراأى عن بعد
  الجهد ورجل أشران أفران أى بطر وهوا تساع له وأفر الظبى وغيره بالفتح يأفرأفورا أى شد
  الاحضاروأفرالرج-ل أيضا أى خف فى الخدمة والمثفر انلحادم قر أقرموضع
  قال ابن مقبل
  وثروة من رجال لورأيتهم * اقات احدى حراج الجزمن أقر
  (أكر الاكرمع أكاركانه بجع آكرف التة-دير والاكرة بااضم الحفرة يقال تأكرت
  الأكرأى حفرت الحفر والمؤاكرة المقابرة ⁦(أمر)⁩ الامر واحد الامور يقال أمر
  فلان مسستقيم وأموره مستقيمة وقواهم لكَّ علىّ أمرة مطاعة معناه لك علىّ أمرة أطبعك
  فيها وهى المرة الواحدة من الاحر ولا تقسل إمرة بالكسراتما الامرة من الولاية وأمرته
  بكذا أمرا والجمع الا واحر قال أبو عبيدة آمرته بالمذ وأمرته لغتان بمعنى كثرته ومنه الحديث
  خير المال مهرة مأمورة أوسكة مابورة أى كثيرة النتاج والذسل وأمر هوأى كثر خرج على
  نقدير قوله-م علم ذلان ذلك وأعلمته أنا ذلك قال بعة وب ولم يقله أحد غيره ١ قال
  أبو الحسن أمر ماله بالكسرأى كثر وأمر القوم أى كنروا قال الشاعر الاعنى
  أمرون لايرتون-هم القعدد وآمر اللّٰه ماله بالمد قال واغ اقيل مهرة مأمورة للازدواج
  والاصل مؤمرة على مفعلة كاقال صلى اللّٰه عليه وسلم للذ.اءارجعنمأزورات غير مآجورات
  وانماهى-وزورات من الوزرفقيل مأزورات على افظ مأجورات ايزدوجا وقوله تعالى أمرنا
  مترفيها أى أمرناهم بالطاعة فعصوا وقديكون من الامارة ٢ قال الاخفش يقال أيضا
  أمر أهره بأمر أمرا أى اشتد والاسم الامر بكسر الهمزة قال الراجز
  قدلق الاقران منى نكرا • داهية دهياه إذا إمرا
  ومنه قوله تصالى اقدجئت شيئا إمرا ويقال عجبا والاميرذوالامر وقدأ مر فلان وأمر
  أيضا بالضم أى صار أميرا والاتى بالهاء وقال لبابعنا أميرة مؤمنينا والمصدر الامرة
  بالكسر والامارة الولاية يقال فلان أمر وأمر عليسه اذا كان واليا وقد كان سوقة أى انه.
