text: |-
  (ثهمد
  ٢١٥
  فارسىّ معرّب قال الشاعر وأسيافناتحت البنود الصواعق ⁦(بيد)⁩ البيداء المفازة
  والمع بيدوباد الشى يبيديداويوداهلك وأبادهم اللّٰه أى أهدكهم والبيدانة الانان اسم
  لها قال امر والقيس
  ويوما على صلت الجبين مسحج • ويوماعلى بيدانة أم تواب
  وييدبعى غير يقال انه كثير المال يد أنه بخيل
  (ن صل التاء ( تقد التقدة بكسر التاء الكزبرة (تلد لتالد المال القديم
  الاصلى الذى ولد غندل وهو نقيض الطارف وكذلك التلاد والاً فلاد وأصل التاءفيه واو
  تقول منه تلد المال يتادويادتلودا وأتأد الرجل اذا اتخذمالا ومال متادو فى الحديث هنّ
  من تلادى يعنى السورأى من الذى أخذته من القرآن قديما والتدد الذى ولديلاد العجم
  ثم حل صغيراة بت بيبلاد الاسلام ومنه -ديث شريح فى رجل اشترى جارية وشرطوا أنها
  مولدة فوج - دهماتادة فردّها والمولدة بعنزلة التسلادوه والذى ولدعندك وتلدفلان فى بنى
  فلان أقام فيهم والا لادبطاون من عبد القيس اتلادعمان لانهم سكنوها قديما
  فيات يشتزه ثأدوي+ره • تذوب الريح والوسواس والهضب
  وقديحرك ومحكان تقداى ند ورجل :ندأى مقرور والثاداء الامة مثل الدأنا على
  القلب قال الشاعر الكميت
  وما كتابى تأداءلما * شفينا بالاسنة كل وتر
  وكان الفرّاء يقول النأداء والسهناء لمكان حروف الحلق وقال أبو عبيدولم أممع أ-دايقولهما
  بالتصريك غيره قال ابن السكيت وليس فى الكلام فعلاء بالتحريك الاحرف واحدوه والثأدا.
  وقديسكن يعنى فى الصفات وأما الاسما فقدجا فيه حرفان فرماء وجنفا. وهماموضعان
  ⁦( نرد)⁩ تردت اللخبز تردا كسرته فهوثريدوم-ترودوالاسم الثردة يااضم وكذلك اتردت
  لخبز وأصله انتردت على افتعلت فلما اجتمع حرفان مخرجهما متقاريان فى كلمة واحدة وجب
  الادعام الاان الثاهلما كانت مه-موسة والتاءمجهورة لم يصح ذلك فابدلوا من الاول تاء
  وأدنموه فى مثله وناس من العرب بيدلونمن الثاءتاء ويدغمون فيقولون أثردفيكون
  لحرف الاصلىّ هواظاهر والتتريد فى الذبح هو الكسر قبل أن يبردوهومنهىّ عنه والترد
  بالتحريات تشقق فى الشفتين عد التعدمالان من البسروا -دته ثعدة يقال هذا بقل ثعد
  معداذا كان رخصاغضا والمعداتباع لا يفردوبعضهم يفرده وثرى تعد وجعداذا كان لينا
  د) الند والتمدالماء القليلى الذى لامادة له واتمد الرجل وآعسد بالادغام أى ورد التمد
  وما مموداذا كثر عليه الناس -تى يتقدوه الاأقله وروضة التمدموضع ورجل منموداذا
  كثر عليه السؤال حتى ي.ند ما عنده وكذلك اذا ئمدته النساء فأكثر ا لجماع حتى انقطع ماؤه
  والثامد من البهم حين قرم أى أكل ومود قبيلة من العرب الاولى وهم قوم صالح
  بصرف ولا يصرف والاعسد جر يكتحل به نهد الموهد والف وهد الغلام السمين
  التام الخلق الذى قدراهق الحلم والجارية توهدة (نهمد :همداسم موضع قال طرفة
  لحولة اطلال ببرقة ثهمد
