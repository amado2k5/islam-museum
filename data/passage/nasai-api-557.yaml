label: { ar: "سنن النسائي 557 — الأب والأبوة", en: "Sunan al-Nasa'i 557 — the father and fatherhood", ur: "سنن نسائی 557 — باپ اور والدیت", es: "Sunan al-Nasa'i 557 — El padre y la paternidad" }
text: "أَخْبَرَنِي مُوسَى بْنُ سُلَيْمَانَ بْنِ إِسْمَاعِيلَ بْنِ الْقَاسِمِ، قَالَ حَدَّثَنَا بَقِيَّةُ، عَنْ يُونُسَ، قَالَ حَدَّثَنِي الزُّهْرِيُّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ قَالَ \" مَنْ أَدْرَكَ رَكْعَةً مِنَ الْجُمُعَةِ أَوْ غَيْرِهَا فَقَدْ تَمَّتْ صَلاَتُهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 557، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 557 (The Book of the Times (of Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 557، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 557 (El Libro de los Tiempos de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
