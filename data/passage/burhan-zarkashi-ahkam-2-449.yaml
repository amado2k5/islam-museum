text: "… الوجوب ولكن هذا الظاهر متروك بل هو واجب لأن طواف الإفاضة واجب ولأنه ذكره بعد التطوع فقال: وَمَن تَطَوَّعَ خَيْرًا البقرة :، فدل على أن النهي السابق نهي عن ترك واجب لا نهي عن ترك مندوب أو مستحب. وقد يكون …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 449، يرد فيه ذكر الواجب، والوجوب، والمستحب، والمندوب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 449, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), the recommended (mandub), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 449 کا اقتباس جس میں واجب، وجوب، مستحب، مندوب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volume numérisé 2, p. 449, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb), le recommandé (mandub), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen digitalizado 2, p. 449, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mustahabb), lo recomendado (mandub), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
