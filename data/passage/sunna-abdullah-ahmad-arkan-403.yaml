text: "… بن، عن علي قيه، عن النبي للي قال: لا يؤمنُ عبدٌ حتى يؤمنَ بأربعٍ: حتى يَشهدَ أن لا إله إلَّا الله، وأني رسول اللّٰه بَعثني بالحقِّ، وحتّى يؤمِنَ بالبعثِ بعدَ الموتِ، وحتى يؤمنَ بالقَدَرِ. - حدثني أبي، ثنا وكيع، ثنا …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 403، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
