  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 403 کا اقتباس جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de Abd Allah ibn Ahmad, pág. 403, que menciona la creencia en el decreto divino, sin el cual la fe no está completa, y la creencia en la resurrección; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
