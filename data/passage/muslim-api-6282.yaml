label: { ar: "صحيح مسلم 6282 — الأب والأبوة", en: "Sahih Muslim 6282 — the father and fatherhood", ur: "صحیح مسلم 6282 — باپ اور والدیت" }
text: "حَدَّثَنَا سُوَيْدُ بْنُ سَعِيدٍ، حَدَّثَنَا عَلِيُّ بْنُ مُسْهِرٍ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتِ اسْتَأْذَنَتْ هَالَةُ بِنْتُ خُوَيْلِدٍ أُخْتُ خَدِيجَةَ عَلَى رَسُولِ اللَّهِ فَعَرَفَ اسْتِئْذَانَ خَدِيجَةَ فَارْتَاحَ لِذَلِكَ فَقَالَ \" اللَّهُمَّ هَالَةُ بِنْتُ خُوَيْلِدٍ \". فَغِرْتُ فَقُلْتُ وَمَا تَذْكُرُ مِنْ عَجُوزٍ مِنْ عَجَائِزِ قُرَيْشٍ حَمْرَاءِ الشِّدْقَيْنِ هَلَكَتْ فِي الدَّهْرِ فَأَبْدَلَكَ اللَّهُ خَيْرًا مِنْهَا."
summary:
  ar: "حديث في صحيح مسلم، رقم 6282، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6282 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6282، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
