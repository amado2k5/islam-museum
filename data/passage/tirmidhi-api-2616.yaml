label: { ar: "جامع الترمذي 2616 — الصلاة والزكاة والصوم والحج مجتمعة", en: "Jami' al-Tirmidhi 2616 — the prayer, the zakat, the fast and the pilgrimage named together", ur: "جامع ترمذی 2616 — نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Jami' al-Tirmidhi 2616 — la oración, el zakat, el ayuno y la peregrinación nombrados juntos", fr: "Jami' al-Tirmidhi 2616 — la prière, la zakat, le jeûne et le pèlerinage sont mentionnés ensemble" }
text: "… عَظِيمٍ وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ تَعْبُدُ اللَّهَ وَلاَ تُشْرِكُ بِهِ شَيْئًا وَتُقِيمُ الصَّلاَةَ وَتُؤْتِي الزَّكَاةَ وَتَصُومُ رَمَضَانَ وَتَحُجُّ الْبَيْتَ \". ثُمَّ قَالَ \" أَلاَ أَدُلُّكَ عَلَى أَبْوَابِ الْخَيْرِ الصَّوْمُ جُنَّةٌ وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ الْمَاءُ النَّارَ وَصَلاَةُ الرَّجُلِ مِنْ جَوْفِ اللَّيْلِ \". قَالَ ثُمَّ تَلاََ: ⁦( تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ )⁩ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2616، يذكر الصلاة والزكاة والصوم والحج مجتمعة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2616 (The Book on Faith), that mentions the prayer, the zakat, the fast and the pilgrimage named together. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2616، جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2616 (El Libro de la Fe), menciona la oración, el zakat, el ayuno y la peregrinación en conjunto. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2616 (Le Livre de la Foi), mentionne la prière, la zakat, le jeûne et le pèlerinage ensemble. Le moteur de recherche « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
