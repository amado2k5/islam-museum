text: "… عن جدتها : انهن خرجن مع النبى فى حنين، وفيه ان النى سألهن عن ذلك ؛ فقلن خرجنا تغزل الشعر، ونعين فى سيل اللّه، ونداوى الجرحى، وتتاول السهام، ونسقى السويق. و عند عد الرزاق عن الزهرى قال: كان النساء يشهدن …"
