label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ٢٨، المقطع ٣ من ٦", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 28, section 3 of 6", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 28، حصہ 3" }
text: "فتأمل رحمك الله الأمور، وأطل الفكر والتأمل وأصر على ذلك، لتعلم حقائق الأمور. فقد بليت في زمانك بمن يقول في الصحابة المكيين والمهاجرين والذين بنوا الإسلام وشيدوه أنهم ما اعتقدوا الإسلام قط ولا اتبعوا رسول لبصيرة ولا لحجة …"
summary:
  ar: "مقطع من الباب ٢٨ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 28 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 28 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
