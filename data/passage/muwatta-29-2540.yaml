label: { ar: "الموطأ 2540 — مالك: قاتل العمد لا يرث من الدية ولا من المال، والخطأ يرث من ماله", en: "Muwatta 2540", es: "Muwatta 2540", fr: "Muwatta 2540", ur: "موطا 2540", tr: "Al-Muwatta 2540 — Malik: Kasıtlı katil kan parasından veya mirastan pay alamazken, kasıtsız katil mirasından pay alır.", id: "Al-Muwatta 2540 — Malik: Pembunuh yang disengaja tidak mendapat warisan dari uang darah atau dari harta warisan, sedangkan pembunuh yang tidak disengaja mendapat warisan dari harta warisannya." }
summary:
  ar: "قال مالك: الأمر الذي لا اختلاف فيه عندنا أن قاتل العمد لا يرث من دية من قتل شيئا، ولا من ماله، ولا يحجب أحدا وقع له ميراث. وأن الذي يقتل خطأ لا يرث من الدية شيئا. وقد اختُلف في أن يرث من ماله؛ فأحب إليّ أن يرث من ماله، ولا يرث من ديته. {cite:muwatta-maruf-1997 p.440}"
  tr: "Malik şöyle dedi: \"Kasıtlı olarak öldüren kişinin, öldürdüğü kişinin kan parasından veya mirasından hiçbir şey miras alamayacağı ve daha önce ondan miras almış olan kimsenin de miras almasını engellemeyeceği konusunda aramızda bir anlaşmazlık yoktur. Kasıtsız olarak öldüren kişi de kan parasından hiçbir şey miras alamaz. Mirastan miras alıp almayacağı konusunda ise anlaşmazlık vardır; benim tercihim mirasından miras almasıdır, kan parasından değil.\" {cite:muwatta-maruf-1997 s.440}"
  id: "Malik berkata: Tidak ada perbedaan pendapat di antara kita bahwa seseorang yang membunuh dengan sengaja tidak mewarisi apa pun dari uang darah orang yang dibunuhnya, juga tidak dari harta warisannya, dan ia juga tidak menghalangi siapa pun yang telah mewarisi darinya. Dan seseorang yang membunuh tanpa sengaja tidak mewarisi apa pun dari uang darah. Ada perbedaan pendapat mengenai apakah ia mewarisi dari harta warisan; pilihan saya adalah ia mewarisi dari harta warisan, tetapi bukan dari uang darah. {cite:muwatta-maruf-1997 p.440}"
