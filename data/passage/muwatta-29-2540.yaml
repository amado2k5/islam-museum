label: { ar: "الموطأ 2540 — مالك: قاتل العمد لا يرث من الدية ولا من المال، والخطأ يرث من ماله", en: "Muwatta 2540" }
summary:
  ar: "قال مالك: الأمر الذي لا اختلاف فيه عندنا أن قاتل العمد لا يرث من دية من قتل شيئا، ولا من ماله، ولا يحجب أحدا وقع له ميراث. وأن الذي يقتل خطأ لا يرث من الدية شيئا. وقد اختُلف في أن يرث من ماله؛ فأحب إليّ أن يرث من ماله، ولا يرث من ديته. {cite:muwatta-maruf-1997 p.440}"
