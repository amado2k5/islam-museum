text: "… سلمة عن معيقيب أن النبى قال: اهتز المرش لموت سعد فقال : هذا الحديث كذب موضوع، رواه سليمان ابن احمد الواسطى، وعمر وبن مائك. أخبرتى محمد بن على المقرئ أخبرنا أبو مسلم بن مهران أخبرتا عبد المؤمن بن خلف الفسفى …"
