  tr: "Al-Khatib Al-Baghdadi'nin Bağdat Tarihi, Resimli Cilt 1, sayfa 54'ten, mal varlığı ve mirasından bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
