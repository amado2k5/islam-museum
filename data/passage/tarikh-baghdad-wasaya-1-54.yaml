text: "… سلمة عن معيقيب أن النبى قال: اهتز المرش لموت سعد فقال : هذا الحديث كذب موضوع، رواه سليمان ابن احمد الواسطى، وعمر وبن مائك. أخبرتى محمد بن على المقرئ أخبرنا أبو مسلم بن مهران أخبرتا عبد المؤمن بن خلف الفسفى …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 54، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 1, p. 54, that mentions what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 1، ص 54 کا اقتباس جس میں ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
