text: "… خرجنا نريد النبي مللّه ومعنا وائل بن حُجْر، فأخذ عَدُوٌّ له، فتحرج القوم أن يحلفوا، وخَلْفتُ أنه أخي، فخلّى سبيله، فأتينا النبي متلع، فأخبرته أن القوم تحرجوا أن يحلفوا، وحلّفت أنه أخي قال : صدقت، المسلم أخو المسلم. والدليل على …"
