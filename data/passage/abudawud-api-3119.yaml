label: { ar: "سنن أبي داود 3119 — تعزية ومواساة وصبر عند المصيبة", en: "Sunan Abi Dawud 3119 — condolence, consolation and patience at a loss", ur: "سنن ابی داؤد 3119 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Sunan Abi Dawud 3119 — des condoléances, une consolation et la patience devant la perte", es: "Sunan Abi Dawud 3119 — condolencias, consuelo y paciencia ante la pérdida", tr: "Sunan Abi Dawud 3119 — Felaket zamanlarında taziye, şefkat ve sabır.", id: "Sunan Abi Dawud 3119 — Ungkapan belasungkawa, simpati, dan kesabaran di masa musibah" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، أَخْبَرَنَا ثَابِتٌ، عَنِ ابْنِ عُمَرَ بْنِ أَبِي سَلَمَةَ، عَنْ أَبِيهِ، عَنْ أُمِّ سَلَمَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" إِذَا أَصَابَتْ أَحَدَكُمْ مُصِيبَةٌ فَلْيَقُلْ { إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ } اللَّهُمَّ عِنْدَكَ أَحْتَسِبُ مُصِيبَتِي فَآجِرْنِي فِيهَا وَأَبْدِلْ لِي خَيْرًا مِنْهَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3119، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3119 (Funerals (Kitab Al-Jana'iz)), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 3119، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Abi Dawud, n° 3119, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Abi Dawud, n.º 3119, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sünen Ebu Davud'da yer alan 3119 numaralı hadis, musibet karşısında taziye, teselli ve sabır sunmaktadır. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü ağıt ve mersiyelerden bazılarını bir araya getirmektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3119, menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah. Koleksi ini menyusun beberapa elegi dan ratapan paling terkenal, bersama dengan teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
