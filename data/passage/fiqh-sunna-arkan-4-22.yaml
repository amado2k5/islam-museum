text: "… على غير طهارة، فقال : سبحان اللّٰه إن المؤمن لا يَنْجس رواه الجماعة : ووجه دلالة الحديث، أن المؤمن إذا كان لا ينجس ؛ فلا وجه الجعل الماء فاقداً للطهورية بمجرد مماسته له، إذ غايته التقاء طاهر بطاهر وهو لا …"
