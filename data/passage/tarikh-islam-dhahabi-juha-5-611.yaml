text: "… ربي آية الإيمان حُبّ الأنصار... إنّي أخشاكم لله وأعلمكم بما أتّقي. أفَلا أكون عبداً شكوراً. إني أبيت يطعمني ربّ ويسقيني.. إني لأستغفر اللّٰه وأتوب إليه في كل يوم. إني لأمزح وما أقول إلّاّ حقّاً إنّي لا أقول إلاّ حقّا..... احمل …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 5، ص 611، فيه أدب المزاح وحدوده؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, scan volume 5, p. 611, with the ethics and limits of jesting; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الاسلام والفاعیۃ المشاہیر والعالم، اسکین جلد 5، ص 611 کا اقتباس جس میں مزاح کے آداب اور حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volume numérisé 5, p. 611, avec l'éthique et les limites de la plaisanterie ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volumen escaneado 5, p. 611, con la ética y los límites de la broma; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"İslam Tarihi ve Ünlü Şahsiyetlerin Ölümleri\" adlı resimli cilt 5'ten, s. 611'den, mizahın adabı ve sınırlarını ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Folkloru Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 5, hlm. 611, membahas etika humor dan batasannya; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
