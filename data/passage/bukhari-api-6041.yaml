label: { ar: "صحيح البخاري 6041 — حلاوة الإيمان وكماله", en: "Sahih al-Bukhari 6041 — the sweetness and completeness of faith", ur: "صحیح بخاری 6041 — ایمان کی مٹھاس اور اس کا کمال", es: "Sahih al-Bukhari 6041 — La dulzura y la plenitud de la fe" }
text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ قَالَ قَالَ النَّبِيُّ \" لاَ يَجِدُ أَحَدٌ حَلاَوَةَ الإِيمَانِ حَتَّى يُحِبَّ الْمَرْءَ، لاَ يُحِبُّهُ إِلاَّ لِلَّهِ، وَحَتَّى أَنْ يُقْذَفَ فِي النَّارِ أَحَبُّ إِلَيْهِ مِنْ أَنْ يَرْجِعَ إِلَى الْكُفْرِ، بَعْدَ إِذْ أَنْقَذَهُ اللَّهُ، وَحَتَّى يَكُونَ اللَّهُ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6041، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6041 (Good Manners and Form (Al-Adab)), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6041، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6041 (Buenas costumbres y forma (Al-Adab)), menciona la dulzura y la plenitud de la fe. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
