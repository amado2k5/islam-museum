text: "… شدة التقوية والتفريح، يعينها العطرية القوية. وهو أشد اعتدالاً من المسك. نافع من أوجاع المعدة الباردة، ومن الرياح الغليظة العارضة في المعي. ومن الشقيقة والصداع الكائنين من الأخلاط الباردة إذا تبخر به. المعتمد في الأدوية المفردة، الملك المظفّر يوسف بن …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 60، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 60, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 60 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
