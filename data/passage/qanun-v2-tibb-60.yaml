text: "… شدة التقوية والتفريح، يعينها العطرية القوية. وهو أشد اعتدالاً من المسك. نافع من أوجاع المعدة الباردة، ومن الرياح الغليظة العارضة في المعي. ومن الشقيقة والصداع الكائنين من الأخلاط الباردة إذا تبخر به. المعتمد في الأدوية المفردة، الملك المظفّر يوسف بن …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 60، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 60, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 60 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 60, que menciona el dolor, las enfermedades específicas, el hospital y la práctica médica, los órganos del cuerpo, el medicamento, los medicamentos y la farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 60, qui mentionne la douleur, les maladies nommées, l'hôpital et l'art médical, les organes du corps, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 60. sayfasından bir bölüm; ağrı, hastalık isimleri, hastane ve tıp mesleği, vücut organları, tıp, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 60, yang menyebutkan rasa sakit, nama-nama penyakit, rumah sakit dan profesi medis, organ tubuh, obat-obatan, narkoba dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
