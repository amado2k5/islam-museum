  fr: "Un extrait de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volume numérisé 1, p. 243, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
