text: "… القول يقوله سائر الأئمة. فإنه إذا كان في فعل مستحب مفسدة راجحة لم يصر مستحبًّا. ومن هنا ذهب من ذهب من الفقهاء إلى ترك بعض المُستحبات إذا صارت شعارًا لهم، فإنه لم يترك واجبًا بذلك، لكن قال: في إظهار ذلك …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 1، ص 243، يرد فيه ذكر الواجب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 1, p. 243, whose wording mentions the obligatory (wajib), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
