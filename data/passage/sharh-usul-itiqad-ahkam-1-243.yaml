  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 1. cildinin 243. sayfasından, farz ve müstehap amelleri ile ilgili bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, itaat amelleri, müstehap amelleri, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari penjelasan Al-Lalaka'i tentang dasar-dasar keyakinan Sunni, jilid 1, halaman 243, yang menyebutkan amalan wajib dan anjuran; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
