text: "… كلهم أهل فتيا، ولا كان الدين يؤخذ عن جميعهم، وإنما كان ذلك مختصًا بالحاملين للقرآن العارفين بناسخه ومنسوخه ومتشابهه ومحكمه وسائر دلالاته بما تلقوه من النبي أو ممن سمعه منهم من عليتهم، وكانوا يسمون لذلك القراء، أي الذين يقرءون الكتاب …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 2، ص 18، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 2, p. 18, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 2، ص 18 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 2, pág. 18, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
