  tr: "İbn Haldun'un Mukaddime adlı eserinin 2. cildinin 18. sayfasında okuyuculardan bahsedilmektedir; makine tarafından okunabilir taranmış versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Muqaddimah Ibn Khaldun, Volume 2, halaman 18, menyebutkan para pembaca; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
