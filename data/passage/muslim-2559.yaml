label: { ar: "مسلم 2559 — لا تباغضوا ولا تحاسدوا وكونوا عباد الله إخواناً", en: "Muslim 2559 — Do not hate or envy one another; be God's servants, brothers", es: "Muslim 2559 — No odiéis ni envidiéis unos a otros; sed siervos de Dios, hermanos.", fr: "Muslim 2559 — Ne vous haïssez pas et ne vous enviez pas les uns les autres; soyez des serviteurs de Dieu, frères.", ur: "مسلم 2559 - ایک دوسرے سے بغض اور حسد نہ کرو۔ خدا کے بندے، بھائی بنو", tr: "Müslim 2559 — Birbirinize kin ve kıskançlık beslemeyin, ey Allah'ın kulları, kardeş olun.", id: "Muslim 2559 — Janganlah kalian saling membenci atau iri hati, dan jadilah saudara, wahai hamba-hamba Allah." }
text: "قال رسول الله: «لا تباغضوا، ولا تحاسدوا، ولا تدابروا، وكونوا عباد الله إخواناً، ولا يحل لمسلم أن يهجر أخاه فوق ثلاث»"
summary:
  ar: "رواية أنس بن مالك عن الزهري في باب النهي عن التحاسد والتباغض والتدابر من كتاب البر في صحيح مسلم؛ دستور العلاقة بين المسلمين في أربع نواه وأمر."
  tr: "Sahih Müslim'in Salihlik Kitabı'nda yer alan, kıskançlık, nefret ve birbirlerinden yüz çevirmenin yasaklanması bölümünde, Enes bin Malik'in Zühri'den rivayet ettiği hadis; Müslümanlar arasındaki ilişkilerin dört yasak ve dört emirle nasıl kurulduğunu anlatır."
  id: "Riwayat Anas bin Malik berdasarkan Al-Zuhri dalam bab tentang larangan iri hati, kebencian, dan saling berpaling dalam Kitab Kebenaran di Sahih Muslim; konstitusi hubungan antar Muslim dalam empat larangan dan perintah."
