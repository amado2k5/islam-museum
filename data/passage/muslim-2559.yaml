text: "قال رسول الله: «لا تباغضوا، ولا تحاسدوا، ولا تدابروا، وكونوا عباد الله إخواناً، ولا يحل لمسلم أن يهجر أخاه فوق ثلاث»"
summary:
  ar: "رواية أنس بن مالك عن الزهري في باب النهي عن التحاسد والتباغض والتدابر من كتاب البر في صحيح مسلم؛ دستور العلاقة بين المسلمين في أربع نواه وأمر."
