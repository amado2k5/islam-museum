text: "… أبي بُردة قال : أخرجت إلينا عائشةا كساء ملبَّداً وإزاراً غليظاً، فقالت : قُبض رسول اللّٰه وَاي في هذين. أخرجاه في الصحيحين -. وعنهاا قالت: ما ترك رسول اللّٰه مَلِيةِ ديناراً ولا درهماً ولا شاة ولا بعيراً ولا أوصى بشيء. …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 89، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 89, that mentions a testament or parting counsel, a deathbed and last hours, what was left behind: estate and inheritance, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 89 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، ترکہ اور میراث، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 1, pág. 89, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, lo que quedó: patrimonio y herencia, una reliquia conservada tras su dueño; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 1, p. 89) mentionnant un testament ou des dernières volontés, le lit de mort et les dernières heures, ainsi que les biens et l'héritage laissés après le décès; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 1. cildinin 89. sayfasından bir alıntı, bir vasiyetname veya son miras belgesi, ölüm zamanı, geride bıraktığı mal varlığı ve miras ile korunmuş bir kutsal emanetten bahsetmektedir; bu alıntı, makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 1, halaman 89, menyebutkan wasiat atau surat wasiat terakhir, waktu kematian, harta warisan yang ditinggalkan, dan sebuah relik yang terpelihara; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peneliti wasiat, warisan, relik, dan makam suci."
