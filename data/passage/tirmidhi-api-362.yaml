text: "… هِنْدٍ، عَنْ أَبِي وَائِلٍ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، قَالَتْ صَلَّى رَسُولُ اللَّهِ خَلْفَ أَبِي بَكْرٍ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ قَاعِدًا. قَالَ أَبُو عِيسَى حَدِيثُ عَائِشَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ رُوِيَ عَنْ عَائِشَةَ عَنِ النَّبِيِّ أَنَّهُ قَالَ \" إِذَا صَلَّى الإِمَامُ جَالِسًا فَصَلُّوا جُلُوسًا \". وَرُوِيَ عَنْهَا أَنَّ النَّبِيَّ خَرَجَ فِي مَرَضِهِ وَأَبُو بَكْرٍ يُصَلِّي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 362، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 362 (The Book on Salat (Prayer)), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 362، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
