text: "وَلَقَدْ أَرْسَلْنَا رُسُلًا مِّن قَبْلِكَ وَجَعَلْنَا لَهُمْ أَزْوَٰجًا وَذُرِّيَّةً ۚ وَمَا كَانَ لِرَسُولٍ أَن يَأْتِىَ بِـَٔايَةٍ إِلَّا بِإِذْنِ ٱللَّهِ ۗ لِكُلِّ أَجَلٍ كِتَابٌ"
text_search: "ولقد أرسلنا رسلا من قبلك وجعلنا لهم أزواجا وذرية ۚ وما كان لرسول أن يأتي بآية إلا بإذن الله ۗ لكل أجل كتاب"
translations:
  en: { text: "And verily We sent messengers (to mankind) before thee, and We appointed for them wives and offspring, and it was not (given) to any messenger that he should bring a portent save by Allah's leave. For everything there is a time prescribed.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور (اے محمدﷺ) ہم نے تم سے پہلے بھی پیغمبر بھیجے تھے۔ اور ان کو بیبیاں اور اولاد بھی دی تھی ۔اور کسی پیغمبر کے اختیار کی بات نہ تھی کہ خدا کے حکم کے بغیر کوئی نشانی لائے۔ ہر (حکم) قضا (کتاب میں) مرقوم ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
