text: "… الرحم أبخرة لطيفة وتلك الأبخرة هي لا محالة من أجزاء دموية قد كمل نضجها وتلطفت بالحرارة فلذلك هذه الأجزاء البخارية تخالط ما يكون في الرحم من الهواء الواصل بعضه من عنق الرحم بعضه من الشرايين النافذة في جرم الرحم، ويحدث …"
