text: "… بحروفه وإذا قرأ استعاذ، وليجمَعْ طُرُقه وهى التى عليها الجمهور ويترك الشواذّ. ولا يرتَدّ دون غاية لإقصار، ولا يقِفْ فبعد أن أتمّ لم يبق بحمد اللّٰه إحصار، وليتوسع فى مذاهبه ولا يخرج عن قراءة القراء السبعة أئمة الأمصار، وليبذل للطلبة …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 2، ص 201، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 2, p. 201, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 2، ص 201 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen 2, pág. 201, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 2, p. 201) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Kalkaşandi'nin Subh el-A'şa adlı eserinin Resimli Cilt 2, s. 201'deki bir alıntısında Kur'an okuyucularından bahsedilmektedir; makine tarafından okunabilir taranmış versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Subh al-A'sha karya al-Qalqashandi, Jilid Bergambar 2, hlm. 201, menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
