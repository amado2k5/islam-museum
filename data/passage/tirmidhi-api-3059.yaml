label: { ar: "جامع الترمذي 3059 — وصية أو عهد أخير", en: "Jami' al-Tirmidhi 3059 — a testament or parting counsel", ur: "جامع ترمذی 3059 — وصیت یا آخری نصیحت", es: "Jami' al-Tirmidhi 3059 — un testamento o consejo de despedida", fr: "Jami' al-Tirmidhi 3059 — un testament ou un conseil d'adieu" }
text: "… يُقَالُ لَهُ بُدَيْلُ بْنُ أَبِي مَرْيَمَ بِتِجَارَةٍ وَمَعَهُ جَامٌ مِنْ فِضَّةٍ يُرِيدُ بِهِ الْمَلِكَ وَهُوَ عُظْمُ تِجَارَتِهِ فَمَرِضَ فَأَوْصَى إِلَيْهِمَا وَأَمَرَهُمَا أَنْ يُبَلِّغَا مَا تَرَكَ أَهْلَهُ قَالَ تَمِيمٌ فَلَمَّا مَاتَ أَخَذْنَا ذَلِكَ الْجَامَ فَبِعْنَاهُ بِأَلْفِ دِرْهَمٍ ثُمَّ اقْتَسَمْنَاهُ أَنَا وَعَدِيُّ بْنُ بَدَّاءٍ فَلَمَّا قَدِمْنَا إِلَى أَهْلِهِ دَفَعْنَا إِلَيْهِمْ مَا كَانَ مَعَنَا وَفَقَدُوا الْجَامَ فَسَأَلُونَا عَنْهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3059، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3059 (Chapters on Tafsir), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3059، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3059 (Capítulos sobre Tafsir), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3059 (Chapitres sur le Tafsir), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
