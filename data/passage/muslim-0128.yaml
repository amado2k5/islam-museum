label:
  ar: "مسلم 128 — إن الله كتب الحسنات والسيئات"
  en: "Muslim 128 — God has written good deeds and bad deeds"
  ur: "مسلم 128 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
text: "قال الله عز وجل إذا هم عبدي بسيئة فلا تكتبوها عليه فإن عملها فاكتبوها سيئة وإذا هم بحسنة فلم يعملها فاكتبوها حسنة فإن عملها فاكتبوها عشرا ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 128: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 128: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 128: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
