label:
  ar: "مسلم 128 — إن الله كتب الحسنات والسيئات"
  en: "Muslim 128 — God has written good deeds and bad deeds"
  ur: "مسلم 128 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
  es: "Musulmán 128 — Dios ha escrito las buenas y las malas obras."
  fr: "Muslim 128 — Dieu a inscrit les bonnes et les mauvaises actions"
  tr: "Müslim 128 — Allah iyiliği ve kötülüğü takdir etmiştir."
  id: "Muslim 128 — Allah telah menetapkan amal kebaikan dan amal keburukan"
text: "قال الله عز وجل إذا هم عبدي بسيئة فلا تكتبوها عليه فإن عملها فاكتبوها سيئة وإذا هم بحسنة فلم يعملها فاكتبوها حسنة فإن عملها فاكتبوها عشرا ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 128: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 128: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 128: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 128: Dios ha escrito las buenas y las malas acciones. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim n° 128: Dieu a prescrit les bonnes et les mauvaises actions. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  tr: "Sahih Müslim'de 128 numaralı hadis-i kudsi şöyledir: \"Allah iyiliği ve kötülüğü takdir etmiştir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 128: “Allah telah menetapkan amal kebaikan dan amal keburukan.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kumpulan hadits kanonik dan dalam Al-Muwatta."
