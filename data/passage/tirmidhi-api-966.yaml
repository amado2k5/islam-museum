text: "… \" مَا مِنْ شَيْءٍ يُصِيبُ الْمُؤْمِنَ مِنْ نَصَبٍ وَلاَ حَزَنٍ وَلاَ وَصَبٍ حَتَّى الْهَمُّ يَهُمُّهُ إِلاَّ يُكَفِّرُ اللَّهُ بِهِ عَنْهُ سَيِّئَاتِهِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ فِي هَذَا الْبَابِ. قَالَ وَسَمِعْتُ الْجَارُودَ يَقُولُ سَمِعْتُ وَكِيعًا يَقُولُ لَمْ يُسْمَعْ فِي الْهَمِّ أَنَّهُ يَكُونُ كَفَّارَةً إِلاَّ فِي هَذَا الْحَدِيثِ. قَالَ وَقَدْ رَوَى بَعْضُهُمْ هَذَا الْحَدِيثَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 966، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 966 (The Book on Jana''iz (Funerals)), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 966، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 966 (El Libro de los Funerales), habla de las malas acciones borradas y los pecados perdonados. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 966 (Le Livre des Jana'iz [Funérailles]), évoque l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou pèsent un acte."
  tr: "Cami' el-Tirmizi'de 966 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 966, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
