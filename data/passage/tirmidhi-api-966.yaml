text: "… \" مَا مِنْ شَيْءٍ يُصِيبُ الْمُؤْمِنَ مِنْ نَصَبٍ وَلاَ حَزَنٍ وَلاَ وَصَبٍ حَتَّى الْهَمُّ يَهُمُّهُ إِلاَّ يُكَفِّرُ اللَّهُ بِهِ عَنْهُ سَيِّئَاتِهِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ فِي هَذَا الْبَابِ. قَالَ وَسَمِعْتُ الْجَارُودَ يَقُولُ سَمِعْتُ وَكِيعًا يَقُولُ لَمْ يُسْمَعْ فِي الْهَمِّ أَنَّهُ يَكُونُ كَفَّارَةً إِلاَّ فِي هَذَا الْحَدِيثِ. قَالَ وَقَدْ رَوَى بَعْضُهُمْ هَذَا الْحَدِيثَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 966، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 966 (The Book on Jana''iz (Funerals)), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 966، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
