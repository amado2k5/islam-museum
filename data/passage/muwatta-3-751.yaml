label: { ar: "الموطأ 751 — ليس على المسلم في عبده ولا في فرسه صدقة", en: "Muwatta 751" }
text: "ليس على المسلم في عبده ولا في فرسه صدقة"
summary:
  ar: "أول حديث في باب ما جاء في صدقة الرقيق والخيل والعسل. يرويه مالك عن عبد الله بن دينار عن سليمان بن يسار وعن عراك بن مالك عن أبي هريرة، أن النبي قال: ليس على المسلم في عبده ولا في فرسه صدقة. ويذكر المحقق أن الواو بين سليمان وعراك منصوص عليها في رواية يحيى وإن خالفت رواية جماعة رواة الموطأ، وينقل عن ابن عبد البر (التمهيد 17/123–124) أن يحيى أخطأ فيها وأن الحديث محفوظ في الموطآت كلها لسليمان بن يسار عن عراك بن مالك، وهما تابعيان نظيران، وأن عراكاً توفي سنة 102 وسليمان سنة 107. ويضيف المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، والقعنبي عند أبي داود (1595) والطحاوي، وابن القاسم عند النسائي (5/36)، والشافعي، ومحمد بن الحسن الشيباني (336)، ويحيى بن يحيى النيسابوري عند مسلم (3/67). {cite:muwatta-maruf-1997 p.372} {cite:muwatta-maruf-1997 p.373}"
