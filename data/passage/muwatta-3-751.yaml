label: { ar: "الموطأ 751 — ليس على المسلم في عبده ولا في فرسه صدقة", en: "Muwatta 751", es: "Muwatta 751", fr: "Muwatta 751", ur: "موطا 751", tr: "El-Muvatta 751 — Bir Müslüman, kölesi veya atı için zekât vermekle yükümlü değildir.", id: "Al-Muwatta 751 — Seorang Muslim tidak diwajibkan membayar zakat atas budaknya atau kudanya." }
text: "ليس على المسلم في عبده ولا في فرسه صدقة"
summary:
  ar: "أول حديث في باب ما جاء في صدقة الرقيق والخيل والعسل. يرويه مالك عن عبد الله بن دينار عن سليمان بن يسار وعن عراك بن مالك عن أبي هريرة، أن النبي قال: ليس على المسلم في عبده ولا في فرسه صدقة. ويذكر المحقق أن الواو بين سليمان وعراك منصوص عليها في رواية يحيى وإن خالفت رواية جماعة رواة الموطأ، وينقل عن ابن عبد البر ⁦(التمهيد 17/123–124)⁩ أن يحيى أخطأ فيها وأن الحديث محفوظ في الموطآت كلها لسليمان بن يسار عن عراك بن مالك، وهما تابعيان نظيران، وأن عراكاً توفي سنة 102 وسليمان سنة 107. ويضيف المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، والقعنبي عند أبي داود (1595) والطحاوي، وابن القاسم عند النسائي (5/36)، والشافعي، ومحمد بن الحسن الشيباني (336)، ويحيى بن يحيى النيسابوري عند مسلم (3/67). {cite:muwatta-maruf-1997 p.372} {cite:muwatta-maruf-1997 p.373}"
  tr: "Köle, at ve bal zekâtı hakkındaki rivayetler bölümündeki ilk hadis, Malik'in Abdullah ibn Dinar'dan, onun da Süleyman ibn Yasar'dan, onun da Arak ibn Malik'ten, onun da Ebu Hurayra'dan rivayet ettiği hadiste şöyle buyurmuştur: Peygamberimiz şöyle buyurmuştur: \"Bir Müslümanın kölesi veya atı için zekâtı yoktur.\" Araştırmacı, Yahya'nın rivayetinde Süleyman ve Arak arasında \"ve\" bağlacının açıkça belirtildiğini, ancak bunun Muvatta'nın bir grup rivayetçisinin rivayetiyle çeliştiğini belirtmektedir. İbn Abdül-Barr'ın (el-Temhid 17/123-124) Yahya'nın bu konuda yanıldığını ve hadisin tüm Muvattalarda Süleyman ibn Yasar'dan Arak ibn Malik'ten rivayet edildiği şeklinde korunduğunu, her ikisinin de benzer Tabiin (Sahabelerin takipçileri) olduğunu söylediğini aktarmaktadır. Arak'ın H. 102'de, Süleyman'ın da H. 107'de öldüğünü ekliyor. Araştırmacı ayrıca bunun Ebu Mus'ab tarafından Malik'ten, el-Beğavi'nin, Ebu Davud'da (1595) el-Ka'nabi'nin, el-Tahawi'nin, el-Nesa'i'de (5/36) İbnü'l-Kasım'ın, el-Şafi'i, Muhammed ibn el-Hasan el-Şeybani (336) ve Müslim'de Yahya ibn Yahya el-Naysaburi'nin rivayet ettiğini belirtmektedir. (3/67). {cite:muwatta-maruf-1997 s.372} {cite:muwatta-maruf-1997 s.373}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang telah diriwayatkan mengenai zakat atas budak, kuda, dan madu. Diriwayatkan oleh Malik dari Abdullah ibn Dinar, dari Sulayman ibn Yasar, dan dari Arak ibn Malik, dari Abu Hurayrah, bahwa Nabi bersabda: Tidak ada zakat yang wajib dibayarkan oleh seorang Muslim untuk budaknya atau kudanya. Peneliti mencatat bahwa kata penghubung \"wa\" (dan) antara Sulayman dan 'Arak secara eksplisit disebutkan dalam riwayat Yahya, meskipun bertentangan dengan riwayat sekelompok perawi Muwatta. Ia mengutip Ibnu 'Abd al-Barr (al-Tamhid 17/123-124) yang mengatakan bahwa Yahya keliru dalam hal ini, dan bahwa hadits tersebut terpelihara dalam semua Muwatta sebagai diriwayatkan oleh Sulaiman ibn Yasar dari 'Arak ibn Malik, keduanya adalah Tabi'in (pengikut para Sahabat) yang serupa. Ia menambahkan bahwa 'Arak wafat pada tahun 102 H dan Sulaiman pada tahun 107 H. Peneliti tersebut lebih lanjut menyatakan bahwa hadits tersebut diriwayatkan dari Malik oleh Abu Mus'ab, dan dari sanadnya oleh al-Baghawi, al-Qa'nabi dalam Abu Dawud (1595), al-Tahawi, Ibnu al-Qasim dalam al-Nasa'i (5/36), al-Shafi'i, Muhammad ibn al-Hasan al-Shaybani (336), dan Yahya ibn Yahya al-Naysaburi dalam Muslim (3/67). {kutip:muwatta-maruf-1997 hal.372} {kutip:muwatta-maruf-1997 hal.373}"
