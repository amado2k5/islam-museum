text: "… غم ولّى ممرُبنِ الخطَّاب سعيدّ بن عامر بن حِليم عَمَلَه، وكان على حمص وما يليها من الشأم، وكتب إليه كتاباً يوصيه فيه بتقوى اللّٰه والجدّ فى أَمر اللّٰه والقيام بالحقَّ الذى يجب عليه ويلُمره يوَضع الخراجِ والرّفْتى بالرّعيّة، فأجابه سعيد …"
