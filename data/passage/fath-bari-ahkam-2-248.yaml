text: "… رده لأن عنده علماً من ذلك فاستغنى عنه، ويستماد من الحديث بذل النصيحة للأمراء وكشف على سعامن بة أو تبت عنده وكان الدير يتهى تأخير الإنكار، أو كان اللى أنكره من المستحبات لان. الواجبات ولذلك عذره على ولم يذكره بسوء. …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 248، يرد فيه ذكر الواجب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
