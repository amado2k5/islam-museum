text: "… عليهِ؟ قالَ : سمعتُهُ يقولُ: إِنَّ رجلاً حضرَهُ الموتُ لما أَيسَ من الحياةِ أَوصى أَهلَهُ: إِذا مُتُّ فاجمعوا لي حطبًا كثيرًا، ثمّ أَورُوا نارًا، حتى إذا أكلتْ لحمي وخلصَت إِلى عظمي فخُذوها فاطحنوها فذرُّوني في اليمَّ في يوم حارِّ فجمعَهُ …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 594، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 594, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 594 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 2, pág. 594, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fath al-Bari d'Ibn Hajar, tome 2, page 594, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn Hacer'in Feth el-Bari adlı eserinin resimli 2. cildinin 594. sayfasında, vasiyetname veya son miras ve ölüm saati geçmektedir; makine tarafından okunabilir taranmış versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Fath al-Bari karya Ibn Hajar, jilid 2 bergambar, halaman 594, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari versi pindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peramban wasiat, warisan, barang antik, dan tempat suci."
