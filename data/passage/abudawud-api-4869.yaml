label: { ar: "سنن أبي داود 4869 — الحرام", en: "Sunan Abi Dawud 4869 — the unlawful", ur: "سنن ابی داؤد 4869 — حرام", es: "Sunan Abi Dawud 4869 - lo ilegal" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ صَالِحٍ، قَالَ قَرَأْتُ عَلَى عَبْدِ اللَّهِ بْنِ نَافِعٍ قَالَ أَخْبَرَنِي ابْنُ أَبِي ذِئْبٍ، عَنِ ابْنِ أَخِي، جَابِرِ بْنِ عَبْدِ اللَّهِ عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" الْمَجَالِسُ بِالأَمَانَةِ إِلاَّ ثَلاَثَةَ مَجَالِسَ سَفْكُ دَمٍ حَرَامٍ أَوْ فَرْجٌ حَرَامٌ أَوِ اقْتِطَاعُ مَالٍ بِغَيْرِ حَقٍّ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4869، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4869 (General Behavior (Kitab Al-Adab)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4869، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4869 (Conducta General (Kitab Al-Adab)), menciona lo ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
