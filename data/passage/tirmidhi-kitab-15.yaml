summary:
  ar: "القسم 15 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأحكام عن رسول الله»، ويضم فيها النصوص من 1322 إلى 1385 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 15 of Jami' al-Tirmidhi (The Chapters On Judgements From The Messenger of Allah) in the division of the open hadith dataset the museum took its reports from: reports 1322 to 1385 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 15، عنوان «کتاب الاحکام عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1322 تا 1385۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 15 de Jami' al-Tirmidhi (Los capítulos sobre los juicios del Mensajero de Alá) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1322 al 1385 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses données du recueil de hadiths Jami' al-Tirmidhi (chapitres relatifs aux jugements du Messager d'Allah) du livre 15: les hadiths 1322 à 1385 de ce recueil. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 15. bölümü, \"Allah'ın Elçisinden Hükümler Kitabı\" başlığını taşımakta olup, 1322'den 1385'e kadar olan metinleri sırasıyla numaralandırarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 15 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Hukum dari Rasulullah\" dan berisi teks-teks dari tahun 1322 hingga 1385, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
