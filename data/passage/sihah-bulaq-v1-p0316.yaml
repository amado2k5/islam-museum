text: |-
  ٣٢٥
  ⁦( زحر)⁩ الزحير استطلاق البطن وكذلات الزحار بالضم والزحير التنفس بشدة يقال
  زحرت المرأة عند الولادة تزحر وتزر قال الفراء أنشدنى بعض بن كلاب
  أراكيجعت مسئلة وحرصا • وعند الفقرز حارا أنانا
  وزحراسم رجل ⁦( زخر)⁩، زخر الوادى اذا امتتجد اوارتفع يقال محرزائر وأماقول
  الهذلى صناع بإ.شفاها حصان بشكرها • جوادبقوت البطن والعرق زاخر
  فيقال انما تجود بقوتها فى حال الجوع وهيجان الدم والطبائع ويقال نسبها مرتفع لان
  عرق السكريم يزخر بالكرم وقال آبو عبيديقال عرف فلان زاخراذا كان كريمايهى وزخر
  النبات طال فاذا التف النبات وخرج زهره قمل قد آخد زخاريه ومكان زخارة النبات
  قال ابن مقبل زخارى النبات كان فيه • جياد العبقرية والقطوع
  ⁦( زور)⁩ الزرواحد ازرار القميص ويقال للرجل الحسن الرعية للابل انه (ر من أزرارها
  واذا كانت الابل ممانا قيل به ازرّة وزرّبن -بيش رجل من قراء التابعين والزر بالفتح
  مصدر زررت القميص أزرّه بالضم زرا اذاشددت أزراره يقال ازرر عليك قيصك وزره
  وزرّه وزرّه ١ وأزررت القميص اذا جعلت له أزرارافتزرر وأماقول المرار
  تدين لمزرور الى جنب حلقة * من الشبه سوا هابرفق طبيبها
  فانمايعى زمام الناقة جعله مزرور الانه يضفرويشة والزر الشل والطرديقالى هو يزر
  الكتائب بالسيف والزر العض والمزارة المعاضة وجار مزرّ وزرت عينه تز بالكسرزريرا
  وعيناه تزرّان اذانوقد تا والزرزور طائروقد زرزرأى صوّت وزرارة أبو حاجب ⁦(زعر)⁩.
  الزعرلالشعر رجل أزعر وقد زعر بالكسر والازعر الموضع القليل النبات والزعارة
  تشديد الراءشراسة اللخلق لا يصرف منه فعل والزءرور السي الخلق والعامة تقول رجل
  زعروفيه زعارة والزعر ورثرة معروفة. ⁦( زعفر)⁩ الإعفران يجمع على زعافر مشل ترجان
  وتراجم وصحصان ومحاصح وزعفرت الثوب صبغته به والمزعفرالاسد الورد ⁦(زفر)⁩
  الزفر مصدرة ولك زفرالحل يزفره زفرا أى حله وازدفره أيضا والزفر بالمكسر الحمل والج-ع
  أزفاروالزفرأيضا القربة ومنه قيل للاماء الاواتى يحملن القرب زوافر وزافرة الرجل أنصاره
  وعشيرته ويقال هم زافرته-م عند السلطان أى الذين يقومون بامرهم وزافرة السهم
  مادون الريش منه وقال عيسى بن عمر زافرة السهم مادون ثلثيه مما يلى الفصل والزفير اغتراق
  النقس للشّدّة والإفير أول صوت المار والشهيق آخرهلات الزفيرادخال النفس والتهيق
  اخراجه وقدزة ريز فروالاسم الزفرة قال الجعدى
  خبط على زفرة فتم ولم • يرجع الى دقة ولاهضم
  يقول كأنه زفر فيط على ذلا فهوكا نه زافر أبدا من عظ-م جوفه والجمع زقرات
  بالتحريك لانه اسم وليس بنعت وربماسكنها الشاءرلاضرورة كما قال
  تتستريح النفس من زفراتها والزفير الداهية وأنشدأبوزيد والدلو والديلم والزفيرا
  والزفرة بالضم وسط الفرس يقال أنه لعظيم الزفرة والزفر السيد قال أعشى باهلة
  أخورغائب يعطيها ويسئلها * يأبى الظلامة منه الموفل الزفر ١
  ٨٢
  قوله باشفاها بكسر همزة إشفى
  الراء المنتداه
  ١ لانه يزدفر بالاموال فى
  الهالات مطيقالها قوله منه
  مؤكدة للكلام كما قال اللّٰه تعالى
  يغفرلكم من ذنوبكم والمعى
  يأني الظلامة لانه النوفل الزفراه
  كذا وجد بالاصل زيادة فى نسيخة
