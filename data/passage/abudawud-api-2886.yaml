label: { ar: "سنن أبي داود 2886 — المرض والمريض، عيادة المريض", en: "Sunan Abi Dawud 2886 — illness and the sick; visiting the sick", ur: "سنن ابی داؤد 2886 — بیماری اور بیمار، بیمار کی عیادت", es: "Sunan Abi Dawud 2886 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sunan Abi Dawud 2886 — la maladie et les malades; la visite aux malades", tr: "Sunan Abi Davud 2886 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sunan Abi Dawud 2886 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا سُفْيَانُ، قَالَ سَمِعْتُ ابْنَ الْمُنْكَدِرِ، أَنَّهُ سَمِعَ جَابِرًا، يَقُولُ مَرِضْتُ فَأَتَانِي النَّبِيُّ يَعُودُنِي هُوَ وَأَبُو بَكْرٍ مَاشِيَيْنِ وَقَدْ أُغْمِيَ عَلَىَّ فَلَمْ أُكَلِّمْهُ فَتَوَضَّأَ وَصَبَّهُ عَلَىَّ فَأَفَقْتُ فَقُلْتُ يَا رَسُولَ اللَّهِ كَيْفَ أَصْنَعُ فِي مَالِي وَلِي أَخَوَاتٌ قَالَ فَنَزَلَتْ آيَةُ الْمَوَارِيثِ { يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلاَلَةِ }."
summary:
  ar: "حديث في سنن أبي داود، رقم 2886، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 2886 (Shares of Inheritance (Kitab Al-Fara'id)), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 2886، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2886 (Colección de Herencia (Kitab Al-Fara'id)), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 2886 (Partage de l'héritage), évoque la maladie, les malades et les visites aux malades. Le Répertoire des textes médicaux le répertorie parmi les ouvrages traitant de médecine prophétique, de médecine, d'anatomie, de chirurgie, de médicaments et de traitements."
  tr: "Sunan Abi Davud'da yer alan 2886 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2886, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
