text: "نوادر جحا الكبرى المِلْقَطُ بثلاثة آلاف ذهب يوماً إلى السوق فرأى بيد الدلال سيفاً، ينادي عليه، بثلاثة آلاف قرش فأخذه بيده وتأمله فلم يجده يساوي هذه القيمة فسأل من هناك عن ذلك فقالوا له : متى أراد الإنسانُ أن يضرِب …"
summary:
  ar: "أحسّت زوجة جحا بألم فأرسلته إلى طبيب؛ ثم زال الألم فنادته من النافذة لتخبره؛ فذهب إلى الطبيب وقال له ألا يأتي لأن الألم قد زال. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  en: "His wife feels pain and sends Juha for a doctor; she sees the pain pass and calls from the window to say so; Juha goes to the doctor and tells him not to come, since the pain has gone. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  ur: "جحا کی بیوی کو درد ہوا تو اس نے جحا کو طبیب کے پاس بھیجا؛ درد جاتا رہا تو اس نے کھڑکی سے آواز دے کر بتایا؛ جحا طبیب کے پاس گیا اور کہا کہ آپ نہ آئیں کیونکہ درد ختم ہو گیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  fr: "Sa femme ressent une douleur et envoie Juha chercher un médecin; la douleur passe et elle l'appelle de la fenêtre pour le dire; Juha va chez le médecin et lui dit de ne pas venir, puisque la douleur a disparu. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  es: "Su mujer siente un dolor y envía a Juha por un médico; el dolor pasa y ella lo llama desde la ventana para decírselo; Juha va al médico y le dice que no venga, pues el dolor ha desaparecido. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
