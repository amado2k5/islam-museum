text: "… يعقوب، حدثنا أحمد بن عصام بن عبدالمجيد الأصبهاني، حدثنا إسماعيل بن عبدالملك بن أبي شبيب الخزاز أبو إسحاق، حدثنا محمد بن عمرو، عن أبي سلمة، عن أبي هريرة قال: قال رسول اللّٰه ول يه: الحياء من الإيمان، والإيمان في الجنة، …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 149، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 149, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 149 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
