text: "الحسن بن علي بن أبي رافع حدثه أن أبا رافع أخبره، أنه أقبل بكتاب من قريش إلى رسول الله ولي ، فلما رأيت النبي ويد ألقي في قلبي الإسلام، قلت: يا رسول الله، إني والله لا أرجع إليهم أبدا، قال"
