label: { ar: "صحيح مسلم 2572 — الأب والأبوة", en: "Sahih Muslim 2572 — the father and fatherhood", ur: "صحیح مسلم 2572 — باپ اور والدیت", es: "Sahih Muslim 2572 — El padre y la paternidad" }
text: "وَحَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، وَعُثْمَانُ بْنُ أَبِي شَيْبَةَ، جَمِيعًا عَنْ عَبْدَةَ، - قَالَ إِسْحَاقُ أَخْبَرَنَا عَبْدَةُ بْنُ سُلَيْمَانَ، - عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - قَالَتْ نَهَاهُمُ النَّبِيُّ عَنِ الْوِصَالِ رَحْمَةً لَهُمْ. فَقَالُوا إِنَّكَ تُوَاصِلُ. قَالَ \" إِنِّي لَسْتُ كَهَيْئَتِكُمْ إِنِّي يُطْعِمُنِي رَبِّي وَيَسْقِينِي \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2572، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2572 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2572، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2572 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
