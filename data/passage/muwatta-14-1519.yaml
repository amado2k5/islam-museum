label: { ar: "الموطأ 1519 — مالك في المحلل: لا يقيم على نكاحه ذلك حتى يستقبل نكاحا جديدا، فإن أصابها فلها مهرها", en: "Muwatta 1519", es: "Muwatta 1519", fr: "Muwatta 1519", ur: "موطا 1519", tr: "El-Muvatta 1519 — Malik aracı kadın hakkında: O, yeni bir evlilik yapana kadar o evlilikte kalmaz ve eğer onunla cinsel ilişkiye girerse, kadın mehirini almaya hak kazanır.", id: "Al-Muwatta 1519 — Malik tentang mak comblang: Ia tidak tetap berada dalam pernikahan itu sampai ia menikah lagi, dan jika ia bersetubuh dengan istrinya, maka istrinya berhak atas maharnya." }
summary:
  ar: "يقول مالك في المحلل إنه لا يقيم على نكاحه ذلك، حتى يستقبل نكاحا جديدا، فإن أصابها فلها مهرها. {cite:muwatta-maruf-1997 p.38}"
  tr: "Malik, aracı kadın hakkında, yeni bir evlilik yapana kadar o evlilikte kalmadığını ve eğer onunla cinsel ilişkiye girerse, kadının mehirini almaya hakkı olduğunu söylüyor. {cite:muwatta-maruf-1997 s.38}"
  id: "Malik mengatakan mengenai perantara bahwa ia tidak tetap berada dalam pernikahan itu sampai ia menikah lagi, dan jika ia berhubungan intim dengannya, maka wanita itu berhak atas maharnya. {cite:muwatta-maruf-1997 p.38}"
