text: "طرف الحديث أو الأثر ألقي يوسف في الجب إللهم أيما مؤمن لعنته أو سببته ألم أجدكم أعداء فألف اللّٰه آلم أخلاق المؤمن الفحش الم تر أن بركة دعوة ألم تعلموا ما قال المنافق ألم يقم رسول اللّٰه للفي قال بلى …"
summary:
