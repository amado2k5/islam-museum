text: "طرف الحديث أو الأثر ألقي يوسف في الجب إللهم أيما مؤمن لعنته أو سببته ألم أجدكم أعداء فألف اللّٰه آلم أخلاق المؤمن الفحش الم تر أن بركة دعوة ألم تعلموا ما قال المنافق ألم يقم رسول اللّٰه للفي قال بلى …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 8996، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 8996, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 8996 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 8996, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 8996, mentionnant les qualités du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 8996. sayfasından, müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 2, halaman 8996, yang menyebutkan ciri-ciri seorang mukmin; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin."
