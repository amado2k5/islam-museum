label: { ar: "صحيح البخاري 1592 — ما فرضه الله ورسوله، ما فُرض على الناس", en: "Sahih al-Bukhari 1592 — what God and His Messenger made obligatory; what was made obligatory on people", ur: "صحیح بخاری 1592 — جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا", fr: "Sahih al-Bukhari 1592 — ce que Dieu et Son Messager ont rendu obligatoire ; ce qui a été imposé aux gens", es: "Sahih al-Bujari 1592 — lo que Dios y Su Mensajero hicieron obligatorio; lo que se impuso a la gente" }
text: "… مُقَاتِلٍ، قَالَ أَخْبَرَنِي عَبْدُ اللَّهِ ـ هُوَ ابْنُ الْمُبَارَكِ ـ قَالَ أَخْبَرَنَا مُحَمَّدُ بْنُ أَبِي حَفْصَةَ، عَنِ الزُّهْرِيِّ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَا ـ قَالَتْ كَانُوا يَصُومُونَ عَاشُورَاءَ قَبْلَ أَنْ يُفْرَضَ رَمَضَانُ، وَكَانَ يَوْمًا تُسْتَرُ فِيهِ الْكَعْبَةُ، فَلَمَّا فَرَضَ اللَّهُ رَمَضَانَ قَالَ رَسُولُ اللَّهِ \" مَنْ شَاءَ أَنْ يَصُومَهُ فَلْيَصُمْهُ، وَمَنْ شَاءَ أَنْ يَتْرُكَهُ فَلْيَتْرُكْهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1592، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 1592 (Hajj (Pilgrimage)), whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 1592، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 1592, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 1592, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
