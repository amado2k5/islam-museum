text: "… وحاجتنا إلى الماءِ اليوم قليل. فتجهّز صَفوان بن أمَيّة، وأَرسل معه أَبو زَمعة بشلمائة مثقال ذهب ونُقَر فضَّة، وبعث معه رجالاً من قُرَبش ببضائع، وخرج معه عبد اللّٰه بن أَبى رَبيعة وحُوَيطِب بن عبد العُزَّى فى رجالٍ من قُرَيش. وخرج …"
