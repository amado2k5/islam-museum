text: "… إلا اليوم، فسلم وقال: أبشر بنوريْن أُوتيتهما لم يؤتَهما نبى قبلك: فاتحة الكتاب وخواتيم سورة البقرة، لن تقرأ بحرف منها إلا أوتيته. وقال أبو طالب المكى: أركان الإيمان سبعة، يعنى هذه الخمسة والإيمان بالقدر، والإيمان بالجنة والنار. وهذا حق، والأدلة …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 2، ص 241، يذكر أركان الإيمان، والإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 2, p. 241, that mentions the pillars of faith, belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 2، ص 241 کا اقتباس جس میں ارکانِ ایمان، تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
