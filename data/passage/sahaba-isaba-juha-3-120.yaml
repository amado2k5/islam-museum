text: "… بهذا الإسناد أنه كان يهدى رسول اللّٰه الُمسكّة من السمن أو المَسل، ثم يحىء بصاحبها فيقول : أَعْطِهِ الْمَن قلت: ووقع نحو ذلك للنعمان فيما ذكره الز بير بن بكار فى كتاب الفكاهة والمزاح. وروى أبو بكر المروزى فى مسمد …"
