label: { ar: "سنن أبي داود — حديث 4578", en: "Sunan Abi Dawud 4578 — Types of Blood-Wit (Kitab Al-Diyat)", ur: "سنن ابی داؤد — حدیث 4578" }
text: "حَدَّثَنَا عَبَّاسُ بْنُ عَبْدِ الْعَظِيمِ، حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، حَدَّثَنَا يُوسُفُ بْنُ صُهَيْبٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، أَنَّ امْرَأَةً، حَذَفَتِ امْرَأَةً فَأَسْقَطَتْ فَرُفِعَ ذَلِكَ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَجَعَلَ فِي وَلَدِهَا خَمْسَمِائَةِ شَاةٍ وَنَهَى يَوْمَئِذٍ عَنِ الْحَذْفِ ‏.‏ قَالَ أَبُو دَاوُدَ كَذَا الْحَدِيثُ خَمْسَمِائَةِ شَاةٍ ‏.‏ وَالصَّوَابُ مِائَةُ شَاةٍ ‏.‏ قَالَ أَبُو دَاوُد …"
summary:
  ar: "في سنن أبي داود؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sunan Abi Dawud; mention of the chancery or the barid post."
  ur: "سنن ابی داؤد میں؛ دیوآن یا بریڈ کا ذکر."
