text: |-
  ٢١٨
  الكسائى مارأيته مذأبردان ومذجريدان يعنى يومين أوشهر بن والجردة بالضم أرض
  متوية منجردة ويقال أيضافلان حسن الجردة والمجرّد والمتجرّدكة ولك حسن العرية
  والمعرى وهما بمعنى والجردة بالفتح البردة المتجردة الخلق قال أبوذؤيب
  وأشعث بوشى تشفينا أحاحه • غدانتذ ذى جردة متماحل
  بوشى كثير العبال متماحل طويل شفيذا أحاحه أى قتلناه والمتجردة اسم امرأة النعمان بن
  المنذر ملان الجيرة والتجريد التعرية من النياب وتجريد السيف انتضاؤه والتجريد التشذيب
  والتجرد التعزى وتجرد للامرأى جدفيه وانجردبنا السيرأى امتدوطال وانجرد الشوب
  اى انسحق ولان والجردان بالضم قضيب الفرس وغسيره والجراد معروف الواحدة جرادة
  يقع ع-لى الذكر والاتى وليس الجراد بذكر للبجرادة وانماه واسم جنس كالبة روالبقرة
  والتمر والتمرة والحام والحامة وما أشبه ذلك فحق مذكره أن لا يكون موننه من لفظه لئلا
  بلتبس الواحد المذكر بالجمع وقولهم ما أدرى أى جراد عاره أى أى الناس ذهب به
  والحرادتان اسم قينتين كانسا بمكة فى الزمن الاوّل وجردت الارض فهى مجرودة اذا أ كل
  الجرادنيتها ويقال أيضاجرد الانسان اذا أكل الجراد فأشتسكى بطنه فه ومجرود وجرد الرجل
  بالكسر بردا اذا شرى جلد ه من أكل الجراد ⁦(جرهد)⁩ المجرهة المسرع فى الذهاب
  قال الشاعر
  لم تراقب هناك ناهلة الك واشين لما اجرهدنا هلها
  جسد) الجد البدن تقول منه تجد كما تقول من الجسيم تجسم والجد أيضا
  الزعة ران أونحوه من الصبغ وهوالدم أيضا قال النابغة
  وماهريق على الانصاب من جد والجد أيضا مصدر قولك جسديه الدم يجسداذا
  اصق به فهو جاسد وجسد قال الطارماح
  منها جامدو تجمع
  وقال آخر
  بساعديه جدمورس * من الدماءمائع وييس
  والجسد الاحرويقال الجسد ما أشبع صبغه من الثياب والجمع مجاسد وقال ابر السكيت
  يقال على فلان توب مشبع من الصبغ وعليه توب.فدم فاذا قام قياما من الصبغ قيل قد
  أجسدثوب فلان إحسادا فهو محسد قال ويقال للزعف ران الجساد والمجد بكسر الميم مايلى
  الجسد من الثياب وقال الفرّاءأصله الضم لانه من أجسد أى ألسق بالجسد وقال بعضه-م
  قوله تعالى أخرج لهم مجلاجدا أى أحر من ذهب والجلسد بزيادة اللام اسم صنم قال
  الشاءر فبات يجتاب شفارى كا • يقرمن يمنى الى الجدد
  ⁦( مد)⁩ شعر جعد بين الجمودة وقد جعد شعره وجعده صاحبه تجعيداورجل جعد
  وامرأة جعدة ويقال للمكريم من الرجال جعد فأمااذا قسل فلان جعد البدين أوجعد
  الافامل فهو البخيل ور بمالم يذكروامعه اليد قال الراجز
  بااحسن الناس مناط عقد ل، لا تعدامى بضربة جهد
  ويكنى الذئب أبا جعدة وأباجعادة وليس له بنت تسحى بذلك قال الكميت يصقطم
  ومستطعم يكنى بغيريناته • جعلت لهحظامن الزاد أوفرا
  وقال عبيد الابرص
  وقالوا
