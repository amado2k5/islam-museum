text: "… عَنْ جَابِرٍ، قَالَ قَالَ لِي رَسُولُ اللَّهِ هَلْ نَكَحْتَ يَا جَابِرُ . قُلْتُ نَعَمْ. قَالَ مَاذَا أَبِكْرًا أَمْ ثَيِّبًا . قُلْتُ لاَ بَلْ ثَيِّبًا. قَالَ فَهَلاَّ جَارِيَةً تُلاَعِبُكَ . قُلْتُ يَا رَسُولَ اللَّهِ، إِنَّ أَبِي قُتِلَ يَوْمَ أُحُدٍ وَتَرَكَ تِسْعَ بَنَاتٍ كُنَّ لِي تِسْعَ أَخَوَاتٍ، فَكَرِهْتُ أَنْ أَجْمَعَ إِلَيْهِنَّ جَارِيَةً خَرْقَاءَ مِثْلَهُنَّ، وَلَكِنِ امْرَأَةً تَمْشُطُهُنَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4052، فيه مزاح ودعابة. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 4052, with jesting and playfulness. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 4052، جس میں مزاح اور خوش طبعی ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 4052, avec plaisanterie et badinage. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 4052, con broma y jovialidad. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 4052 numaralı hadis, mizah ve şakalar içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4052, yang berisi humor dan lelucon. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
