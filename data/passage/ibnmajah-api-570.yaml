label: { ar: "سنن ابن ماجه 570 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Ibn Majah 570 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابن ماجہ 570 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Ibn Majah 570 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Ibn Majah 570 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا حُمَيْدُ بْنُ عَبْدِ الرَّحْمَنِ، عَنِ ابْنِ أَبِي لَيْلَى، عَنِ الْحَكَمِ، وَسَلَمَةَ بْنِ كُهَيْلٍ، أَنَّهُمَا سَأَلاَ عَبْدَ اللَّهِ بْنَ أَبِي أَوْفَى عَنِ التَّيَمُّمِ، فَقَالَ أَمَرَ النَّبِيُّ ـ عَمَّارًا أَنْ يَفْعَلَ هَكَذَا وَضَرَبَ بِيَدَيْهِ إِلَى الأَرْضِ ثُمَّ نَفَضَهُمَا وَمَسَحَ عَلَى وَجْهِهِ. قَالَ الْحَكَمُ وَيَدَيْهِ. وَقَالَ سَلَمَةُ وَمِرْفَقَيْهِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 570، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 570 (The Book of Purification and its Sunnah), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 570، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan Ibn Majah, n.º 570 (El Libro de la Purificación y su Sunnah), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Ibn Majah, n° 570 (Le Livre de la Purification et sa Sunna), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
