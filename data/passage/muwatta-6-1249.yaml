label: { ar: "الموطأ 1249 — يحيى بن سعيد: عمر سأل كعبا عن جرادة قتلها محرم، فقال كعب درهم، فقال عمر تمرة خير من جرادة", en: "Muwatta 1249", es: "Muwatta 1249", fr: "Muwatta 1249", ur: "موطا 1249", tr: "El-Muvatta 1249 — Yahya ibn Said: Ömer, Kâb'a ihramlı birinin öldürdüğü bir çekirge hakkında sordu. Kâb, \"Bir dirhem\" dedi. Ömer, \"Bir hurma çekirgeden daha iyidir\" dedi.", id: "Al-Muwatta 1249 — Yahya ibn Saeed: Umar bertanya kepada Kaab tentang belalang yang dibunuh oleh seseorang dalam keadaan ihram. Kaab berkata, \"Satu dirham.\" Umar berkata, \"Kurma lebih baik daripada belalang.\"" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رجلا سأل عمر بن الخطاب عن جرادة قتلها وهو محرم، فقال عمر لكعب تعال حتى نحكم، فقال كعب درهم، فقال عمر لكعب إنك لتجد الدراهم، لتمرة خير من جرادة. {cite:muwatta-maruf-1997 p.555}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, bir adamın Ömer ibn el-Hattab'a ihramlı halde öldürdüğü bir çekirge hakkında soru sorduğunu anlatır. Ömer, Ka'b'a, \"Buraya gel de birlikte karar verelim\" dedi. Ka'b, \"Bir dirhem\" dedi. Ömer, Ka'b'a, \"Dirhemler bulabilirsin. Bir hurma, bir çekirgeden daha iyidir\" dedi. {cite:muwatta-maruf-1997 s.555}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa seorang pria bertanya kepada Umar ibn al-Khattab tentang belalang yang telah ia bunuh ketika dalam keadaan ihram. Umar berkata kepada Ka'b, \"Kemarilah agar kita dapat menilai.\" Ka'b berkata, \"Satu dirham.\" Umar berkata kepada Ka'b, \"Kamu dapat menemukan dirham. Kurma lebih baik daripada belalang.\" {cite:muwatta-maruf-1997 p.555}"
