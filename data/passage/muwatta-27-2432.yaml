label: { ar: "الموطأ 2432 — يحيى بن سعيد عن محمد بن يحيى بن حبان: الغلام الذي سرق ودّيا وحكم رافع بن خديج", en: "Muwatta 2432" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان أن عبدا سرق فسيلا من حائط رجل فغرسه في حائط سيده، فاستعدى صاحبه مروان بن الحكم، فسجنه وأراد قطع يده. فذهب سيد العبد إلى رافع بن خديج فأخبره أن النبي قال: لا قطع في ثمر ولا كثر، والكثر هو الجمار. فمشى رافع مع السيد إلى مروان فأخبره، فأمر مروان بإرسال العبد. ويذكر المحقق قول ابن عبد البر إن الحديث منقطع في رواية مالك، وأن له طرقا موصولة عن رافع بن خديج. {cite:muwatta-maruf-1997 p.403} {cite:muwatta-maruf-1997 p.404}"
