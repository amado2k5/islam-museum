summary:
  ar: "القسم 34 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرؤيا عن رسول الله»، ويضم فيها النصوص من 2270 إلى 2294 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 34 of Jami' al-Tirmidhi (Chapters On Dreams) in the division of the open hadith dataset the museum took its reports from: reports 2270 to 2294 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 34، عنوان «کتاب الرؤیا عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2270 تا 2294۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 34 de Jami' al-Tirmidhi (Capítulos sobre los sueños) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2270 al 2294 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 34 de Jami' al-Tirmidhi (Chapitres sur les rêves), soit les hadiths 2270 à 2294 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une numérotation différente."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 34. bölümü \"Allah'ın Elçisi Hakkındaki Vahiy Kitabı\" başlığını taşımakta olup, 2270 ile 2294 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 34 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Penglihatan tentang Rasulullah\" dan berisi teks 2270 hingga 2294, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
