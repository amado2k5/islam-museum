text: "قال أبو مسعود الأنصاري: جاء رجل إلى النبي فقال إني أبدع بي فاحملني، قال ما عندي، فقال رجل: يا رسول الله أنا أدله على من يحمله، فقال رسول الله: من دل على خير فله مثل أجر فاعله"
