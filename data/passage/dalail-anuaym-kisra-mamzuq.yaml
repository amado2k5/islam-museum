label: { ar: "دلائل النبوة لأبي نعيم — كتاب كسرى وتمزيقه", en: "Abu Nu'aym's Dala'il — the letter to Chosroes and its tearing", ur: "ابو نعیم کی دلائل — کسری کو خط اور اس کا پھاڑ دینا" }
text: "من محمد رسول الله النبي الأمي إلى كسرى عظيم فارس، سلام على من اتبع الهدى وآمن بالله ورسوله وشهد أن لا إله إلا الله وحده لا شريك له، وأن محمداً عبده ورسوله، أدعوك بدعاية الله"
summary:
  ar: "في الفصل السابع عشر يروي أبو نعيم عن ابن عباس أن النبي بعث بكتابه إلى كسرى فلما قرأه مزقه، وذكر ابن شهاب أن ابن المسيب قال دعا عليهم أن يمزقوا كل ممزق. ويروي بسند آخر عن ابن عباس أن النبي بعث عبد الله بن حذافة بن قيس بن عدي بن سعد بن سهم إلى كسرى بن هرمز ملك فارس وكتب إليه: من محمد رسول الله النبي الأمي إلى كسرى عظيم فارس، سلام على من اتبع الهدى وآمن بالله ورسوله... أدعوك بدعاية الله فإني أنا رسول الله إلى الناس كافة لأنذر من كان حياً ويحق القول على الكافرين فأسلم تسلم فإن أبيت فإن إثم المجوس عليك. فلما قرئ كتاب النبي شقه وقال: يكتب إلي بهذا الكتاب؟ — ويقدم المؤلف هذا المشهد ضمن أدلة عظمة الرسالة وبلوغها إلى أعظم ملوك عصرها."
  en: "In chapter seventeen Abu Nu'aym reports from Ibn Abbas that the Prophet sent his letter to Chosroes and when it was read he tore it up; Ibn Shihab cites Ibn al-Musayyab saying the Prophet prayed against those who would tear every letter. A second chain has Abdullah ibn Hudhafa ibn Qays ibn Udayyib carrying the letter to Chosroes son of Hurmuz, king of Persia: 'From Muhammad, the Messenger of God, the unlettered prophet, to Chosroes, great king of Persia: peace be on whoever follows guidance and believes in God and His Messenger... I call you to God's call; I am God's messenger to all people to warn the living, and woe to the disbelievers. Submit and you will be safe, or the sin of the Magians be upon you.' When it was read he split it saying: does he write to me with such a letter? The author presents it among proofs of the mission's reach to the greatest kings of its age."
  ur: "سترہویں باب میں ابو نعیم ابن عباس سے روایت کرتا ہے کہ نبی نے اپنا خط کسری کو بھیجا تو پڑھنے پر اس نے اسے پھاڑ دیا؛ ابن سہب نقل کرتا ہے کہ ابن المسیب نے کہا کہ نبی نے ان پر دعا کی جو ہر خط کو پھاڑ دیں۔ دوسری روایت میں عبداللہ بن حذافہ بن قیس کو کسری بن ہرمز کے پاس بھیجا گیا اور خط میں لکھا: 'محمد رسول اللہ نبی امی کی جانب سے فارس کے عظیم بادشاہ کسری کو: سلام اس پر جو ہدایت پر چلے اور اللہ اور اس کے رسول پر ایمان لائے اور گواہی دی کہ اللہ کے سوا کوئی معبود نہیں... میں تمہیں اللہ کی دعوت دیتا ہوں، میں تمام لوگوں کو خبردار کرنے کے لیے اللہ کا رسول ہوں، زندہ رہنے والوں کو ڈرانے اور کافروں پر وا کہنے کے لیے۔ اطاعت کرو تو سلامت رہو، ورنہ مجوسیوں کا گناہ تم پر۔' جب پڑھا تو خط کو شق کر دیا اور بولا: کیا وہ مجھے ایسے خط سے لکھتا ہے؟"
