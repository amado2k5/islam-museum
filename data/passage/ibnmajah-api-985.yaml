label: { ar: "سنن ابن ماجه 985 — اليتيم وفقد الأب", en: "Sunan Ibn Majah 985 — the orphan and the father lost", ur: "سنن ابن ماجہ 985 — یتیم اور باپ کی موت", es: "Sunan Ibn Majah 985 — El huérfano y el padre perdido", fr: "Sunan Ibn Majah 985 — L'orphelin et le père perdus" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عَبْدَةَ، وَحُمَيْدُ بْنُ مَسْعَدَةَ، قَالاَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، أَنْبَأَنَا عَبْدُ الْعَزِيزِ بْنُ صُهَيْبٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَ رَسُولُ اللَّهِ ـ يُوجِزُ وَيُتِمُّ الصَّلاَةَ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 985، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 985 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 985، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 985 (Establecimiento de la oración y la Sunnah al respecto), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un hadith du Sunan Ibn Majah, n° 985 (Établissement de la prière et de la Sunna les concernant), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la figure paternelle."
