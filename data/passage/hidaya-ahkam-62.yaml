text: "… في وقف النهر الفائق. - وأيضاً مما لاحظتُه أن المؤلف يصف الحكمَ الشرعي للمسألة بأنه سُنَّةٌ، وهو في الواقع واجبٌ أو فرضٌ، ويأتي الشُّرَّاح ليعللوا وصفه بأنه سنةٌ، فيقولون: لأنه ثبت بالسُنَّة، ومن المعلوم أن كثيراً من الواجبات أو الفرائض …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 62، يرد فيه ذكر الفريضة والفرائض، والفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Marghinani's al-Hidaya, p. 62, whose wording mentions the obligation (farida), the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ہدایہ، مرغینانی، ص 62 کا اقتباس جس میں فریضہ اور فرائض، فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Hidaya de al-Marghinani, p. 62, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
