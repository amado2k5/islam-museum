label: { ar: "نوادر جحا الكبرى، ص 105 — «ليس في الإمكان أبدع ممّا كان»", en: "Nawadir Juha al-Kubra, p. 105 — 'Nothing Could Be Better Than What Is'", ur: "نوادر جحا الکبریٰ، ص 105 — «جو ہے اس سے بہتر ممکن نہیں»", fr: "Nawadir Juha al-Kubra, p. 105 — « Rien ne saurait être mieux que ce qui est »", es: "Nawadir Juha al-Kubra, p. 105 — «No hay nada mejor que lo que es»", tr: "Juha'nın Büyük Fıkraları, s. 105 — “Mevcut olandan daha mükemmel bir şey olamaz.”", id: "Anekdot Hebat Juha, hlm. 105 — “Tidak ada yang lebih sempurna daripada apa yang sudah ada.”" }
text: "… ليس في الإمكان أبدع ممًا كان ركب حماره في يوم صائف متوجّهاً إلى إحدى القرى ونزل في أثناءِ الطريقِ نحت شجرة جوز، وربط حمارهُ بأحد أغصانِها، وجلس يستريحُ، ويمسحُ عرقه المتصبب. وكان هناك غصن قرع. فأخذ يتأمَّلُ في أثمارِهِ الضخمةِ، …"
summary:
  ar: "استراح جحا تحت شجرة جوز فرأى عريشة قرع، وتساءل لماذا أعطى الله القرع لنباتات صغيرة والجوز لأشجار عظيمة، فأسقط صقر جوزة كادت تصيبه، فقال إن حكمة الله أعلى من حكمتنا وإنه ليس في الإمكان أبدع مما كان، فلو كانت قرعة لقتلته. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  en: "Resting under a walnut tree, Juha sees a gourd vine and wonders why God gave gourds to tiny vines and walnuts to great trees. A hawk drops a walnut that nearly hits him, and he says God's wisdom is beyond ours, that nothing could be better than what is, and that a gourd would have killed him. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  ur: "جحا اخروٹ کے درخت تلے آرام کرتے ہوئے کدو کی بیل دیکھتا ہے اور سوچتا ہے کہ اللہ نے چھوٹی بیلوں کو کدو اور بڑے درختوں کو اخروٹ کیوں دیے۔ ایک باز ایک اخروٹ گرا دیتا ہے جو اسے لگتے لگتے رہ جاتا ہے، تو وہ کہتا ہے کہ اللہ کی حکمت ہماری حکمت سے بالا ہے، جو ہے اس سے بہتر ممکن نہیں، اور کدو ہوتا تو اسے مار ڈالتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  fr: "Se reposant sous un noyer, Juha voit une plante de courge et se demande pourquoi Dieu a donné des courges à de minuscules plants et des noix à de grands arbres. Un faucon laisse tomber une noix qui le manque de peu, et il dit que la sagesse de Dieu dépasse la nôtre, que rien ne saurait être mieux que ce qui est, et qu'une courge l'aurait tué. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  es: "Descansando bajo un nogal, Juha ve una planta de calabaza y se pregunta por qué Dios dio calabazas a plantas diminutas y nueces a grandes árboles. Un halcón deja caer una nuez que casi lo golpea, y dice que la sabiduría de Dios supera la nuestra, que nada podría ser mejor que lo que es, y que una calabaza lo habría matado. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  tr: "Juha bir ceviz ağacının altında dinlenirken bir kabak asması gördü. Tanrı'nın neden küçük bitkilere kabak, büyük ağaçlara ise ceviz verdiğini merak etti. Bir şahin bir ceviz düşürdü ve neredeyse ona isabet edecekti. Bunun üzerine, Tanrı'nın bilgeliğinin bizimkinden daha üstün olduğunu ve O'nun yarattıklarından daha mükemmel bir şey olamayacağını söyledi. Eğer bir kabak olsaydı, onu öldürürdü. {cite:juha-nawadir-kubra-djuwaydi s. 105}"
  id: "Juha beristirahat di bawah pohon kenari dan melihat tanaman labu. Ia bertanya-tanya mengapa Tuhan memberikan labu kepada tanaman kecil dan kenari kepada pohon besar. Seekor elang menjatuhkan kenari yang hampir mengenainya, sehingga ia berkata bahwa kebijaksanaan Tuhan lebih tinggi daripada kebijaksanaan kita dan bahwa tidak ada yang lebih sempurna daripada apa yang telah Dia ciptakan. Jika itu adalah labu, pasti akan membunuhnya. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
