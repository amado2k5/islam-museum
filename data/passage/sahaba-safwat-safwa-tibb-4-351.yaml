text: "مصطفيات من طبقات الصحابياتن قال الواقدي: حضرت أم أيمن أحداً وكانت تسقي الماء وتداوي الجرحى، وشهدت خيبر. وتوفيت في آخر خلافة عثمان له. - أم كلثوم بنت عقبة بن أبي معيطا أسلمت بمكة وبايعت قبل الهجرة وهي أول من هاجر …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 351، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 351, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 351 کا اقتباس جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
