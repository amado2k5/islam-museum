text: "… الأقسام الثلاثة الباقية، فشفاؤها بالإسهال الذي يليق بكُل خلِط منها، وكأنَّه لم نبه بالعسل على المسهلات، وبالحجامة على الفصد، وقد قال بعضُ الناس: إن الفصد يدخل في قوله : شرطة محجم. فإذا أعيا الدواءُ، فآخِرُ الطب الكيُّ، فذكره ول في …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 607، يذكر الحجامة، والكي، والتداوي بالعسل، والطب والطبيب، وأسماء الأمراض، والجراحة والختان والجبائر، والدواء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 607, that mentions cupping, cautery, honey as a remedy, medicine and the physician, named diseases, surgery, circumcision and splints, the drug, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 607 کا اقتباس جس میں حجامہ، داغنا، شہد سے علاج، طب اور طبیب، بیماریوں کے نام، جراحت، ختنہ اور پٹیاں، دوا، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
