text: "… : مرقة الديك نافعة لوجع المعدة من الريح. أعضاء النفض : مرقة الديك الهرم مع السفايج والشبث نافعة للقولنج جداً، لحم الدجاج الفتي يزيد في المني، والمرقة المذكورة مع البسفايج تس السوداء، ومع القرطم تسهّل البلغم، وقد تطبخ بالأدوية القابضة …"
summary:
