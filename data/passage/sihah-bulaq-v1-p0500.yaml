text: |-
  فصلُ البا٠)
  صل الالف قال أبو عمروبن العلاء بعض العرب يبدل الجسيم من الياء المسدّدة
  وقلت لرحل من حنظلة ممن أنت فقال فقيمج فقلت من أيهم فقال مرّج ير يدفقيمى ومرّى
  وأنشدلهميان بن محافة السعدى يطير عنها الوبر الصهابجا قال ريد الصهابى من الصهبة
  وقال خاف الاحر أنشدنى رجل من أهل البادية
  خالى عويف وأبو علج * المطعمان اللحم بالعشج * وبالغداة كسر البرئج
  يريد عليا والعشىّ والبرنى وقد أبدلوها من الياء المخففة أيضا وأنشد أبوزيد
  بأرب ان كنت قبات هتج * فلايزال شاج يأتيلا مج أقرنها زينزى وقرنج
  وأنشد أيضا حتى اذا ما أمسحت وأمهها يريد أمست وأمسى فهذا كله قبيع وقال
  أبو عمر الجرمى ولوردّه انسان لكان مذهبا ⁦(أيج)⁩ الاجيج تلهب النساروقد أحت توج
  جيجا وأججتها فتأججت وأتجت أيضاعلى افتعلت والاجوج المضئ عن أبى عمرو وأنشد
  لابى ذؤيب يصف برقا أغز كصباح اليهود أجوج وأج الظليم يؤج أج أى
  عداوله حفيف فى عدوه قال الشاعر
  يؤج كماأج الظليم المنفر وقوله-م القوم
  فى أجة أى فى اختلاط والاجة شذة الحرّوتوهيه والجمع إجاج مثل جفنة وحفان تقول منه
  انتج النهارائتجاجا وما أجاج أى ملح مر وقد أج الماءيؤج أجوجا قال الاخفس من ه-مز
  يأجوج ومأجوج ويجعل الالف من الاصل يقول بأجوج يفعول وم أجوج مفعول كانه
  من أجيج الشار قال ومن لايه مزويجعل الالفين زائدتين يقول ياجوج من يححت وماجوج
  من مججت وهما غبر مصروفين قال رؤية
  لوأن ياجوج وماجوج معا * وعاد عاد واستجاشوات.(ا
