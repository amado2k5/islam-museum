summary:
  ar: "يقول مالك إن من رمى صيدا أو صاده بعد رميه الجمرة وحلاق رأسه، غير أنه لم يفض، فإن عليه جزاء ذلك الصيد، لقول الله في سورة المائدة، ومن لم يفض فقد بقي عليه مس الطيب والنساء. {cite:muwatta-maruf-1997 p.561}"
