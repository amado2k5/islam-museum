label: { ar: "الموطأ 1263 — مالك: من رمى صيدا أو صاده بعد رمي الجمرة وحلق رأسه، غير أنه لم يفض، فعليه جزاء ذلك الصيد", en: "Muwatta 1263", es: "Muwatta 1263", fr: "Muwatta 1263", ur: "موطا 1263", tr: "El-Muvatta 1263 — Malik: Cemarat'a taş atıp başını tıraş ettikten sonra av hayvanı vuran veya avlanan kimse, ritüel yıkama işlemini yapmazsa, o av hayvanının cezasını ödemek zorundadır.", id: "Al-Muwatta 1263 — Malik: Barang siapa yang menembak hewan buruan atau memburunya setelah melempar kerikil ke Jamarat dan mencukur kepalanya, tetapi tidak melakukan wudhu, maka dia harus membayar denda untuk hewan buruan itu." }
summary:
  ar: "يقول مالك إن من رمى صيدا أو صاده بعد رميه الجمرة وحلاق رأسه، غير أنه لم يفض، فإن عليه جزاء ذلك الصيد، لقول الله في سورة المائدة، ومن لم يفض فقد بقي عليه مس الطيب والنساء. {cite:muwatta-maruf-1997 p.561}"
  tr: "Malik, Cemarat'a taş attıktan ve başını tıraş ettikten sonra avlanan veya av hayvanı vuran, fakat Veda Tavafı'nı yapmayan kimsenin, Allah'ın Maide Suresi'ndeki şu hükmüne göre o avın cezasını çekmesi gerektiğini söyler: \"Ve Veda Tavafı'nı yapmayan kimse, yine de parfüm kullanmaktan ve evlilikten sakınmakla yükümlüdür.\" {cite:muwatta-maruf-1997 s.561}"
  id: "Malik mengatakan bahwa siapa pun yang berburu atau menembak hewan buruan setelah melempar kerikil ke Jamarat dan mencukur kepalanya, tetapi tidak melaksanakan Tawaf Perpisahan, harus membayar denda untuk hewan buruan tersebut, sesuai dengan firman Allah dalam Surat al-Ma'idah: \"Dan barangsiapa yang tidak melaksanakan Tawaf Perpisahan, ia tetap wajib menahan diri dari memakai parfum dan melakukan hubungan suami istri.\" {cite:muwatta-maruf-1997 p.561}"
