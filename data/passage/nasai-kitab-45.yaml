label:
  ar: "سنن النسائي، كتاب القسامة"
  en: "Sunan al-Nasa'i, Book 45: The Book of Oaths (qasamah), Retaliation and Blood Money"
  ur: "سنن نسائی، کتاب القسامۃ"
  es: "Sunan al-Nasa'i, Libro 45: El Libro de los Juramentos (qasamah), la Venganza y el Dinero de Sangre"
  fr: "Sunan al-Nasa'i, Livre 45: Le Livre des serments (qasamah), la vengeance et l'argent du sang"
summary:
  ar: "القسم 45 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب القسامة»، ويضم فيها النصوص من 4706 إلى 4869 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 45 of Sunan al-Nasa'i (The Book of Oaths (qasamah), Retaliation and Blood Money) in the division of the open hadith dataset the museum took its reports from: reports 4706 to 4869 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 45، عنوان «کتاب القسامۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4706 تا 4869۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 45 de Sunan al-Nasa'i (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Sangre) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4706 al 4869 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du recueil ouvert Sunan al-Nasa'i (Livre des serments (qasamah), de la vengeance et du prix du sang) le livre 45 (qasamah), qui comprend les hadiths 4706 à 4869. Il classe ces hadiths sous ce livre; les éditions imprimées les classent et les numérotent différemment."
