summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن عمر بن الخطاب قال: افصلوا بين حجكم وعمرتكم، فإن ذلك أتم لحج أحدكم وأتم لعمرته، أن يعتمر في غير أشهر الحج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1127) وسويد وابن وهب عند الطحاوي. {cite:muwatta-maruf-1997 p.465} {cite:muwatta-maruf-1997 p.466}"
