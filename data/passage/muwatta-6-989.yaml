label: { ar: "الموطأ 989 — ابن عمر: قال عمر: افصلوا بين حجكم وعمرتكم، فإن ذلك أتم لحج أحدكم وأتم لعمرته، أن يعتمر في غير أشهر الحج", en: "Muwatta 989", es: "Muwatta 989", fr: "Muwatta 989", ur: "موطا 989", tr: "El-Muvatta 989 — İbn Ömer: Ömer dedi ki: Hac ve Umrenizi ayrı tutun; çünkü Hac ayları dışında Umre yapmak sizin için daha eksiksizdir.", id: "Al-Muwatta 989 — Ibn Umar: Umar berkata: Pisahkanlah ibadah haji dan umrahmu, karena lebih sempurna bagi salah seorang di antara kalian untuk melaksanakan umrah di luar bulan-bulan haji." }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن عمر بن الخطاب قال: افصلوا بين حجكم وعمرتكم، فإن ذلك أتم لحج أحدكم وأتم لعمرته، أن يعتمر في غير أشهر الحج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1127) وسويد وابن وهب عند الطحاوي. {cite:muwatta-maruf-1997 p.465} {cite:muwatta-maruf-1997 p.466}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Ömer ibn el-Hattab şöyle buyurmuştur: \"Hac ve Umrenizi ayrı tutun; çünkü Hac ayları dışında Umre yapmak, Hac için daha eksiksiz, Umre için de daha eksiksizdir.\" Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab (1127), Suwaid ve İbn Wahb tarafından, el-Tahavi'nin de kaydıyla nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.465} {cite:muwatta-maruf-1997 s.466}"
  id: "Malik meriwayatkannya dari Nafi’ atas otoritas Abdullah ibn Umar, bahwa Umar ibn al-Khattab berkata: “Pisahkanlah ibadah haji dan umrahmu, karena lebih sempurna ibadah haji dan umrah seseorang jika umrah dilakukan di luar bulan-bulan haji.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1127), Suwaid, dan Ibn Wahb, sebagaimana dicatat oleh al-Tahawi. {cite:muwatta-maruf-1997 p.465} {cite:muwatta-maruf-1997 p.466}"
