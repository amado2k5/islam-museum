label:
  ar: "مسلم 2621 — من ذا الذي يتألى علي أن لا أغفر لفلان"
  en: "Muslim 2621 — Who is it that swears by Me that I shall not forgive so-and-so"
  ur: "مسلم 2621 — کون ہے جو مجھ پر قسم کھاتا ہے کہ میں فلاں کو نہیں بخشوں گا"
text: "أن رجلا قال والله لا يغفر الله لفلان وإن الله تعالى قال من ذا الذي يتألى على أن لا أغفر لفلان فإني قد غفرت لفلان وأحبطت عملك . أو كما قال ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2621: من ذا الذي يتألى علي أن لا أغفر لفلان. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2621: Who is it that swears by Me that I shall not forgive so-and-so. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2621: کون ہے جو مجھ پر قسم کھاتا ہے کہ میں فلاں کو نہیں بخشوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
