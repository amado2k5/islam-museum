text: "… الفضل بإذنه وقَسْمه على قدر فضلهم في الدين، فمنهم ذو الحاجة، ومنهم ذو. الحاجتين، ومنهم ذو الحوائج، فيتشاغل بهم ويشغلهم فيما أصلحهم والأمة من مسألته عنهم وإخبارهم بالذي ينبغي لهم، ويقول : ليبلّغ الشاهد منكم الغائب، وأبلغوني حاجة من لا …"
