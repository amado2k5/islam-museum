label: { ar: "الموطأ 2073 — يحيى عن مالك عن ربيعة بن أبي عبد الرحمن عن حنظلة بن قيس الزرقي عن رافع بن خديج: نهى رسول الله عن كراء المزارع، فسأل حنظلة رافعا عن الذهب والورق، فقال: أما بالذهب والورق فلا بأس به", en: "Muwatta 2073", es: "Muwatta 2073", fr: "Muwatta 2073", ur: "موطا 2073", tr: "El-Muvatta 2073 — Yahya, Malik'ten, Rabi'ah ibn Abi Abd al-Rahman'dan, Hanzalah ibn Qays al-Zuraqi'den, Rafi' ibn Khadij'den rivayetle: Allah'ın Resulü, çiftliklerin kiraya verilmesini yasaklamıştır. Hanzalah, Rafi'ye altın ve gümüş hakkında sordu ve Rafi şöyle dedi: Altın ve gümüşe gelince, onda bir sakınca yoktur.", id: "Al-Muwatta 2073 — Yahya, dari Malik, dari Rabi’ah ibn Abi Abd al-Rahman, dari Hanzalah ibn Qays al-Zuraqi, dari Rafi’ ibn Khadij: Rasulullah melarang menyewakan ladang. Hanzalah bertanya kepada Rafi’ tentang emas dan perak, dan dia berkata: Adapun emas dan perak, tidak ada salahnya." }
summary:
  ar: "يروي يحيى عن مالك عن ربيعة بن أبي عبد الرحمن عن حنظلة بن قيس الزرقي عن رافع بن خديج أن رسول الله نهى عن كراء المزارع. قال حنظلة: فسألت رافع بن خديج: بالذهب والورق؟ فقال: أما بالذهب والورق، فلا بأس به. {cite:muwatta-maruf-1997 p.249}"
  tr: "Yahya, Malik'ten, o da Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da Hanzalah ibn Qays al-Zuraqi'den, o da Rafi' ibn Khadij'den rivayet eder ki, Allah Resulü tarım arazilerinin kiraya verilmesini yasaklamıştır. Hanzalah şöyle dedi: Rafi' ibn Khadij'e sordum: Altın ve gümüşle mi? O da dedi ki: Altın ve gümüşe gelince, onda bir sakınca yoktur. {cite:muwatta-maruf-1997 s.249}"
  id: "Yahya meriwayatkan dari Malik, dari Rabi'ah ibn Abi 'Abd al-Rahman, dari Hanzalah ibn Qays al-Zuraqi, dari Rafi' ibn Khadij, bahwa Rasulullah SAW melarang penyewaan lahan pertanian. Hanzalah berkata: Aku bertanya kepada Rafi' ibn Khadij: Dengan emas dan perak? Beliau menjawab: Adapun emas dan perak, tidak ada salahnya. {cite:muwatta-maruf-1997 p.249}"
