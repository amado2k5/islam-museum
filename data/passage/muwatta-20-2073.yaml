summary:
  ar: "يروي يحيى عن مالك عن ربيعة بن أبي عبد الرحمن عن حنظلة بن قيس الزرقي عن رافع بن خديج أن رسول الله نهى عن كراء المزارع. قال حنظلة: فسألت رافع بن خديج: بالذهب والورق؟ فقال: أما بالذهب والورق، فلا بأس به. {cite:muwatta-maruf-1997 p.249}"
