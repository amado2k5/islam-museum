label: { ar: "صحيح البخاري 4679 — القراء، جمع القرآن والمصاحف", en: "Sahih al-Bukhari 4679 — the readers; the collection of the Qur'an and the codices", ur: "صحیح بخاری 4679 — قراء، جمعِ قرآن اور مصاحف", es: "Sahih al-Bukhari 4679 — los lectores; la colección del Corán y los códices", fr: "Sahih al-Bukhari 4679 — Les lecteurs; le recueil du Coran et des codex" }
text: "… فَقَالَ أَبُو بَكْرٍ إِنَّ عُمَرَ أَتَانِي فَقَالَ إِنَّ الْقَتْلَ قَدِ اسْتَحَرَّ يَوْمَ الْيَمَامَةِ بِالنَّاسِ، وَإِنِّي أَخْشَى أَنْ يَسْتَحِرَّ الْقَتْلُ بِالْقُرَّاءِ فِي الْمَوَاطِنِ فَيَذْهَبَ كَثِيرٌ مِنَ الْقُرْآنِ، إِلاَّ أَنْ تَجْمَعُوهُ، وَإِنِّي لأَرَى أَنْ تَجْمَعَ الْقُرْآنَ. قَالَ أَبُو بَكْرٍ قُلْتُ لِعُمَرَ كَيْفَ أَفْعَلُ شَيْئًا لَمْ يَفْعَلْهُ رَسُولُ اللَّهِ فَقَالَ عُمَرُ هُوَ وَاللَّهِ خَيْرٌ. فَلَمْ يَزَلْ عُمَرُ يُرَاجِعُنِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4679، يذكر القراء، وجمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 4679 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the readers, the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 4679، جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4679 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), menciona a los lectores, la colección del Corán y los códices. El navegador del museo sobre cómo se leía y escribía el Corán lo enumera junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sahih al-Bukhari, n° 4679 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne les lecteurs, la compilation du Coran et les codex. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ces textes, ainsi que la Sunna, la Sîra et les ouvrages traitant de ce sujet."
