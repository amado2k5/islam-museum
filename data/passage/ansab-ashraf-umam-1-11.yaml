text: "… العماليق، فقال : ما أكثر بربرتهم. فسموا البرابرة. وأقام مع البرابرة : بنو صنهاجة، وكتامة من جمير. فهم فيهم اليوم. ونزلت ثمودُ الحِجر، بين الحجاز والشأم ؛ وبه أهلكوا. ونزلت طَسمْ بين اليمن واليمامة. ونزلت جدَيس بموضع اليمامة. وكانت اليمامة …"
