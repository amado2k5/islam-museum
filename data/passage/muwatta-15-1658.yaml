label: { ar: "الموطأ 1658 — عطاء بن يسار: سأل رجل عبد الله بن عمرو بن العاص عن رجل طلق امرأته ثلاثا قبل أن يمسها، فقال الواحدة تبينها والثلاث تحرمها حتى تنكح زوجا غيره", en: "Muwatta 1658" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بكير بن عبد الله بن الأشج عن النعمان بن أبي عياش الأنصاري عن عطاء بن يسار أنه قال جاء رجل يسأل عبد الله بن عمرو بن العاص عن رجل طلق امرأته ثلاثا قبل أن يمسها، فقال عطاء فقلت إنما طلاق البكر واحدة، فقال لي عبد الله بن عمرو إنما أنت قاص، الواحدة تبينها، والثلاثة تحرمها حتى تنكح زوجا غيره. {cite:muwatta-maruf-1997 p.82}"
