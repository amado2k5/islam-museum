label: { ar: "الموطأ 1658 — عطاء بن يسار: سأل رجل عبد الله بن عمرو بن العاص عن رجل طلق امرأته ثلاثا قبل أن يمسها، فقال الواحدة تبينها والثلاث تحرمها حتى تنكح زوجا غيره", en: "Muwatta 1658", es: "Muwatta 1658", fr: "Muwatta 1658", ur: "موطا 1658", tr: "El-Muvatta 1658 — Ata’ ibn Yasar: Bir adam Abdullah ibn Amr ibn el-As'a, karısıyla cinsel ilişkiye girmeden önce üç kez boşanan bir adam hakkında sordu. O şöyle dedi: Bir kez boşanması onu boşanmış kılar, üç kez boşanması ise başka bir kocayla evleninceye kadar ona haram kılar.", id: "Al-Muwatta 1658 — Ata’ ibn Yasar: Seorang pria bertanya kepada Abdullah ibn Amr ibn al-As tentang seorang pria yang menceraikan istrinya tiga kali sebelum berhubungan intim dengannya. Beliau berkata: Satu kali talak membuat istrinya dinyatakan cerai, dan tiga kali talak membuat istrinya haram baginya sampai ia menikah lagi dengan suami lain." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بكير بن عبد الله بن الأشج عن النعمان بن أبي عياش الأنصاري عن عطاء بن يسار أنه قال جاء رجل يسأل عبد الله بن عمرو بن العاص عن رجل طلق امرأته ثلاثا قبل أن يمسها، فقال عطاء فقلت إنما طلاق البكر واحدة، فقال لي عبد الله بن عمرو إنما أنت قاص، الواحدة تبينها، والثلاثة تحرمها حتى تنكح زوجا غيره. {cite:muwatta-maruf-1997 p.82}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Bukayr ibn Abdullah ibn al-Ashajj'dan, o da al-Nu'man ibn Abi Ayyash al-Ansari'den, o da Ata' ibn Yasar'dan rivayet eder ki, Ata' ibn Yasar şöyle demiştir: Bir adam Abdullah ibn Amr ibn al-As'a, evliliği tamamlamadan önce karısını üç kez boşayan bir adam hakkında soru sormaya geldi. Ata' dedi ki: \"Bakirenin boşanması sadece bir keredir.\" Abdullah ibn Amr bana dedi ki: \"Sen sadece bir hikaye anlatıyorsun. Bir kere boşanma onu helal kılar, ama üç kere boşanma onu başka bir adamla evleninceye kadar haram kılar.\" {cite:muwatta-maruf-1997 s.82}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Bukayr ibn Abdullah ibn al-Ashajj, dari al-Nu'man ibn Abi Ayyash al-Ansari, dari Ata' ibn Yasar, yang berkata: Seorang pria datang bertanya kepada Abdullah ibn Amr ibn al-As tentang seorang pria yang menceraikan istrinya tiga kali sebelum melakukan hubungan suami istri. Ata' berkata: Saya berkata, \"Cerai seorang perawan hanya satu kali.\" Abdullah ibn Amr berkata kepada saya, \"Anda hanya menceritakan sebuah kisah. Satu kali ceraikan membuatnya halal, tetapi tiga kali ceraikan membuatnya haram baginya sampai dia menikah dengan pria lain.\" {cite:muwatta-maruf-1997 p.82}"
