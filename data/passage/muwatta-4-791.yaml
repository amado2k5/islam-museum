label: { ar: "الموطأ 791 — سعيد بن المسيب مرسلاً: لا يزال الناس بخير ما عجلوا الفطر", en: "Muwatta 791", es: "Muwatta 791", fr: "Muwatta 791", ur: "موطا 791", tr: "Al-Muwatta 791 — Sa’id ibn al-Musayyab, mursal: İnsanlar oruçlarını açmakta acele ettikleri sürece sağlıklı kalırlar.", id: "Al-Muwatta 791 — Sa’id ibn al-Musayyab, mursal: Manusia akan tetap sehat selama mereka bersegera berbuka puasa" }
summary:
  ar: "يرويه مالك عن عبد الرحمن بن حرملة الأسلمي عن سعيد بن المسيب مرسلاً، أن النبي قال: لا يزال الناس بخير ما عجلوا الفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه تقدم موصولاً من حديث سهل بن سعد. {cite:muwatta-maruf-1997 p.389}"
  tr: "Malik, Abdülrahman ibn Harmalah el-Aslami'den, o da Sa'id ibn el-Musayyab'dan rivayetle, mursal bir hadiste Peygamberimizin şöyle buyurduğunu nakletmiştir: \"İnsanlar oruçlarını açmakta acele ettikleri sürece sağlıklı kalırlar.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten naklettiğini ve daha önce Sahl ibn Sa'd'ın hadisinden bağlantılı bir rivayet zinciriyle zikredildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.389}"
  id: "Malik meriwayatkannya dari Abd al-Rahman ibn Harmalah al-Aslami, dari Sa'id ibn al-Musayyab, dalam hadits mursal, bahwa Nabi bersabda: \"Manusia akan tetap sehat selama mereka bersegera berbuka puasa.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan bahwa hadits ini sebelumnya telah disebutkan dengan sanad yang terhubung dari hadits Sahl ibn Sa'd. {cite:muwatta-maruf-1997 p.389}"
