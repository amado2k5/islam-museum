summary:
  ar: "يرويه مالك عن عبد الرحمن بن حرملة الأسلمي عن سعيد بن المسيب مرسلاً، أن النبي قال: لا يزال الناس بخير ما عجلوا الفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه تقدم موصولاً من حديث سهل بن سعد. {cite:muwatta-maruf-1997 p.389}"
