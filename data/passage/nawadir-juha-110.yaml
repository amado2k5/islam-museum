label: { ar: "نوادر جحا الكبرى، ص 53 — «لو ساروا كلهم لجهة واحدة لوقعت الأرض»", en: "Nawadir Juha al-Kubra, p. 53 — 'If They All Walked the Same Way, the Earth Would Fall'", ur: "نوادر جحا الکبریٰ، ص 53 — «اگر سب ایک ہی طرف چلیں تو زمین گر جائے»", fr: "Nawadir Juha al-Kubra, p. 53 — « Si tous marchaient du même côté, la terre tomberait »", es: "Nawadir Juha al-Kubra, p. 53 — «Si todos fueran hacia el mismo lado, la tierra se caería»", tr: "Juha'nın Büyük Fıkraları, s. 53 — “Hepsi aynı yöne doğru yürüselerdi, dünya yere düşerdi.”", id: "Anekdot Hebat Juha, hlm. 53 — “Jika mereka semua berjalan ke satu arah, bumi akan runtuh.”" }
text: "… لو ساروا كلهم لجهة واحدة لوقعت الأرض قالوا له يوماً : نرى الناس في الصباح منهم مَنْ يسيرُ هنا ومنهم مَنْ يسيرُ هناك فلِماذا ؟ فأجابهم: لو ذهبوا كلُّهم إلى جهة واحدة لاختلّت موازنة الأرض ووقعت. الخبز بالثلج قال يوماً: …"
summary:
  ar: "سُئل جحا لماذا يمشي بعض الناس صباحًا في اتجاه وبعضهم في اتجاه آخر، فقال إنهم لو ساروا كلهم إلى جهة واحدة لاختل توازن الأرض وسقطت. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  en: "Asked why some people walk one way and others another in the morning, Juha says that if they all walked one way the earth would lose its balance and fall. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  ur: "جحا سے پوچھا گیا کہ صبح کے وقت کچھ لوگ ایک طرف اور کچھ دوسری طرف کیوں چلتے ہیں، تو اس نے کہا کہ اگر سب ایک ہی طرف چلیں تو زمین کا توازن بگڑ جائے اور وہ گر پڑے۔ {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  fr: "Interrogé sur la raison pour laquelle, le matin, certains marchent dans un sens et d'autres dans un autre, Juha dit que si tous allaient du même côté, la terre perdrait son équilibre et tomberait. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  es: "Al preguntarle por qué por la mañana unos caminan en un sentido y otros en otro, Juha dice que si todos fueran hacia el mismo lado la tierra perdería el equilibrio y caería. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  tr: "Juha'ya, bazı insanların sabahları bir yöne, bazılarının ise başka bir yöne yürümesinin nedeni soruldu. O da, eğer herkes aynı yöne yürüseydi, dünyanın dengesini kaybedip çökeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 53}"
  id: "Juha ditanya mengapa sebagian orang berjalan ke satu arah di pagi hari dan sebagian lainnya ke arah lain. Ia menjawab bahwa jika mereka semua berjalan ke arah yang sama, bumi akan kehilangan keseimbangannya dan runtuh. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
