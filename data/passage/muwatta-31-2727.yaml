summary:
  ar: "يروي مالك عن زياد بن سعد عن ابن شهاب أنه سمعه يقول: سدل رسول الله ناصيته ما شاء الله، ثم فرق بعد ذلك. ويذكر المحقق قول ابن عبد البر أن الرواة رووه عن مالك مرسلا، وأن حماد بن خالد وصله فأخطأ. {cite:muwatta-maruf-1997 p.536}"
