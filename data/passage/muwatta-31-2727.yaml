label: { ar: "الموطأ 2727 — ابن شهاب: النبي سدل ناصيته ما شاء الله ثم فرق بعد ذلك", en: "Muwatta 2727", es: "Muwatta 2727", fr: "Muwatta 2727", ur: "موطا 2727", tr: "El-Muvatta 2727 — İbn Şihab: Peygamber, Allah dilediği sürece alnındaki saç tutamını aşağıya doğru sarkıttı, sonra da ayırdı.", id: "Al-Muwatta 2727 — Ibn Shihab: Nabi membiarkan ubun-ubunnya terurai selama yang dikehendaki Allah, kemudian membelahnya setelah itu." }
summary:
  ar: "يروي مالك عن زياد بن سعد عن ابن شهاب أنه سمعه يقول: سدل رسول الله ناصيته ما شاء الله، ثم فرق بعد ذلك. ويذكر المحقق قول ابن عبد البر أن الرواة رووه عن مالك مرسلا، وأن حماد بن خالد وصله فأخطأ. {cite:muwatta-maruf-1997 p.536}"
  tr: "Malik, İbn Şihab'dan rivayetle Ziyad ibn Sa'd'dan naklederek, Peygamberin şöyle dediğini işittiğini aktarır: \"Allah'ın Resulü, Allah dilediği sürece alnındaki saç tutamını aşağıya sarkıttı, sonra da ayırdı.\" Araştırmacı, İbn Abd el-Barr'ın, rivayetçilerin bunu Malik'ten mursal hadis olarak naklettiği ve Hammad ibn Halid'in bunu bağlayarak hata yaptığı yönündeki ifadesini aktarır. {cite:muwatta-maruf-1997 s.536}"
  id: "Malik meriwayatkan dari Ziyad ibn Sa'd, dari Ibn Shihab, bahwa ia mendengar beliau berkata: \"Rasulullah SAW membiarkan ubun-ubunnya terurai selama yang dikehendaki Allah, kemudian beliau membelahnya setelah itu.\" Peneliti menyebutkan pernyataan Ibn Abd al-Barr bahwa para perawi meriwayatkan hadits ini dari Malik sebagai hadits mursal, dan bahwa Hammad ibn Khalid menghubungkannya dan dengan demikian keliru. {cite:muwatta-maruf-1997 p.536}"
