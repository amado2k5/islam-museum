summary:
  ar: "القسم 8 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة العيدين»، ويضم فيها النصوص من 2044 إلى 2069 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 8 of Sahih Muslim (The Book of Prayer - Two Eids) in the division of the open hadith dataset the museum took its reports from: reports 2044 to 2069 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 8، عنوان «کتاب صلاۃ العیدین»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2044 تا 2069۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 8 de Sahih Muslim (El Libro de la Oración - Dos Eids) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2044 al 2069 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre de la prière – Deux Aïds), dans la section 8 de ce recueil ouvert: les hadiths 2044 à 2069. Le musée classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 8. bölümü \"Bayram Namazları Kitabı\" başlığını taşımakta olup, 2044'ten 2069'a kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 8 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Shalat Id\" dan berisi teks 2044 hingga 2069, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
