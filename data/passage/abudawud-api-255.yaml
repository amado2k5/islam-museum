label: { ar: "سنن أبي داود 255 — الأب والأبوة", en: "Sunan Abi Dawud 255 — the father and fatherhood", ur: "سنن ابی داؤد 255 — باپ اور والدیت", es: "Sunan Abi Dawud 255 — El padre y la paternidad", fr: "Sunan Abi Dawud 255 — le père et la paternité" }
text: "… عَوْفٍ، قَالَ قَرَأْتُ فِي أَصْلِ إِسْمَاعِيلَ بْنِ عَيَّاشٍ - قَالَ ابْنُ عَوْفٍ - وَحَدَّثَنَا مُحَمَّدُ بْنُ إِسْمَاعِيلَ، عَنْ أَبِيهِ، حَدَّثَنِي ضَمْضَمُ بْنُ زُرْعَةَ، عَنْ شُرَيْحِ بْنِ عُبَيْدٍ، قَالَ أَفْتَانِي جُبَيْرُ بْنُ نُفَيْرٍ عَنِ الْغُسْلِ، مِنَ الْجَنَابَةِ أَنَّ ثَوْبَانَ، حَدَّثَهُمْ أَنَّهُمُ، اسْتَفْتَوُا النَّبِيَّ عَنْ ذَلِكَ فَقَالَ \" أَمَّا الرَّجُلُ فَلْيَنْشُرْ رَأْسَهُ فَلْيَغْسِلْهُ حَتَّى يَبْلُغَ أُصُولَ الشَّعْرِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 255، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 255 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 255، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 255 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 255 (Purification (Kitab Al-Taharah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
