text: "… حوشب، عن عبد الرحمن بن سفيان، ولا أدري أدركه أم لا. غنم حديثه: خطب النَّبي يف على ناقته، وأنا تحت وقد روى مكحول عن عمرو بن أبي خزاعة رجل من جرانها... الحديث. وفيه: لاَ وَصِيَّةَ لِوَارِثٍ. ومنهم الصحابة. والله أعلم. …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1098، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 1098, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 1098 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Isaba de Ibn Hajar, volumen 2, pág. 1098, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 2, p. 1098), mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Navigateur de testaments."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 1098. sayfasından bir alıntı, vasiyetname veya son mirastan ve geride bıraktığı mal varlığından bahsetmektedir; makine tarafından okunabilir taranmış kopyadan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 2, halaman 1098, menyebutkan sebuah wasiat atau surat wasiat terakhir, dan apa yang ditinggalkan sebagai warisan dan harta pusaka; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peramban wasiat, warisan, barang antik, dan makam suci."
