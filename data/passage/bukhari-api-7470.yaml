label: { ar: "صحيح البخاري 7470 — الحمى، عيادة المريض", en: "Sahih al-Bukhari 7470 — fever; visiting the sick", ur: "صحیح بخاری 7470 — بخار، بیمار کی عیادت" }
text: "حَدَّثَنَا مُحَمَّدٌ، حَدَّثَنَا عَبْدُ الْوَهَّابِ الثَّقَفِيُّ، حَدَّثَنَا خَالِدٌ الْحَذَّاءُ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّ رَسُولَ اللَّهِ دَخَلَ عَلَى أَعْرَابِيٍّ يَعُودُهُ فَقَالَ \" لاَ بَأْسَ عَلَيْكَ طَهُورٌ، إِنْ شَاءَ اللَّهُ \". قَالَ قَالَ الأَعْرَابِيُّ طَهُورٌ، بَلْ هِيَ حُمَّى تَفُورُ عَلَى شَيْخٍ كَبِيرٍ، تُزِيرُهُ الْقُبُورَ. قَالَ النَّبِيُّ \" فَنَعَمْ إِذًا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7470، يذكر الحمى، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7470 (Oneness, Uniqueness of Allah (Tawheed)), that mentions fever, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7470، جس میں بخار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
