label: { ar: "الموطأ 339 — بلاغ: ابن عمر يقضي ركعتي الفجر بعد طلوع الشمس", en: "Muwatta 339", es: "Muwatta 339", fr: "Muwatta 339", ur: "موطا 339", tr: "El-Muvatta 339 — Rivayet: İbn Ömer, güneş doğduktan sonra iki rekatlık sabah namazını kılıyor.", id: "Al-Muwatta 339 — Riwayat: Ibnu Umar melaksanakan dua rakaat shalat Subuh setelah matahari terbit" }
summary:
  ar: "بلاغ في باب ما جاء في ركعتي الفجر: يروي مالك أنه بلغه أن عبد الله بن عمر فاتته ركعتا الفجر فقضاهما بعد أن طلعت الشمس. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.187}"
  tr: "Fecir namazının iki rekatına ilişkin bir rivayet: Malik, Abdullah ibn Ömer'in fecir namazının iki rekatını kaçırdığını ve güneş doğduktan sonra kaza ettiğini duyduğunu bildirmiştir. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.187}"
  id: "Sebuah riwayat mengenai dua rakaat shalat Subuh: Malik meriwayatkan bahwa ia mendengar Abdullah ibn Umar melewatkan dua rakaat shalat Subuh dan menggantinya setelah matahari terbit. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.187}"
