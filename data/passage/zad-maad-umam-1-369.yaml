text: "… شِرَارُ أَهْلِهَا، تَلْفِظُهُمْ أَرَضُوهُم، تَقْذَرُهُم نَفْسُ اللَّهِ، وَتَحْشُرُهُم النّارُ مَعَ القِرَدَةِ والخَنَازِيرِ أحمد:، وأبو داود:، وفي سنده ضعيف. فصل في هديه في الأمان، والصلح، ومعاملة رسل الكفار، وأخذِ الجزية، ومعاملةِ أهل الكتاب، والمنافقين، وإجارة من جاءه من الكفار حتى يسمع …"
summary:
