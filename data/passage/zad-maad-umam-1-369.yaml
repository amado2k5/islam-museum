text: "… شِرَارُ أَهْلِهَا، تَلْفِظُهُمْ أَرَضُوهُم، تَقْذَرُهُم نَفْسُ اللَّهِ، وَتَحْشُرُهُم النّارُ مَعَ القِرَدَةِ والخَنَازِيرِ أحمد:، وأبو داود:، وفي سنده ضعيف. فصل في هديه في الأمان، والصلح، ومعاملة رسل الكفار، وأخذِ الجزية، ومعاملةِ أهل الكتاب، والمنافقين، وإجارة من جاءه من الكفار حتى يسمع …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 369، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 369, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 369 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
