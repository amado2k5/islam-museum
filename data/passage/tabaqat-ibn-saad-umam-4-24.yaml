text: "… بن شداد بن قتان الحارثى، وأُمّ محمّد وأَمة الرحمن. وأُمّهما أُمّ أَيُّوب ابنة عبد اللّٰه بن زُهير بن أَنى أُميّة بن المغيرة، وفاطمة وأُمّها أُمّ ولد، وعبد الرحمن وعبد اللّٰه الأَكبر وأُمهما عائكة بنت صَقوان بن أُميَة بن خلف الجُمَحى. …"
