summary:
  ar: "القسم 70 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأطعمة»، ويضم فيها النصوص من 5373 إلى 5466 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 70 of Sahih al-Bukhari (Food, Meals) in the division of the open hadith dataset the museum took its reports from: reports 5373 to 5466 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 70، عنوان «کتاب الاطعمۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5373 تا 5466۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 70 de Sahih al-Bukhari (Comida, Comidas) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5373 al 5466, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 70 du Sahih al-Bukhari (Nourriture, Repas), dans la section 5373 à 5466 de la base de données ouverte. Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 70. bölümü \"Yiyecekler Kitabı\" başlığını taşımakta olup, 5373 ile 5466 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 70 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Makanan\" dan berisi teks 5373 hingga 5466, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
