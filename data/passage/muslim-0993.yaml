label:
  ar: "مسلم 993 — أنفق أنفق عليك"
  en: "Muslim 993 — Spend, and I shall spend on you"
  ur: "مسلم 993 — خرچ کرو، میں تم پر خرچ کروں گا"
text: "قال الله تبارك وتعالى يا ابن آدم أنفق أنفق عليك . وقال يمين الله ملأى - وقال ابن نمير ملآن - سحاء لا يغيضها شىء الليل والنهار ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 993: أنفق أنفق عليك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 993: Spend, and I shall spend on you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 993: خرچ کرو، میں تم پر خرچ کروں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
