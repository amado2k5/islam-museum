label: { ar: "الموطأ 2130 — يحيى عن مالك عن داود بن الحصين: سمع أبا غطفان بن طريف المري يقول: اختصم زيد بن ثابت وابن مطيع في دار إلى مروان بن الحكم، فقضى مروان على زيد باليمين على المنبر، فأبى زيد أن يحلف على المنبر إلا عند مقاطع الحقوق", en: "Muwatta 2130" }
summary:
  ar: "قال يحيى: قال مالك عن داود بن الحصين أنه سمع أبا غطفان بن طريف المري يقول: اختصم زيد بن ثابت وابن مطيع في دار كانت بينهما إلى مروان بن الحكم، وهو أمير على المدينة، فقضى مروان على زيد بن ثابت باليمين على المنبر. فقال زيد بن ثابت: أحلف له مكاني. فقال مروان: لا والله إلا عند مقاطع الحقوق. فجعل زيد بن ثابت يحلف أن حقه لحق، ويأبى أن يحلف على المنبر. فجعل مروان بن الحكم يعجب من ذلك. {cite:muwatta-maruf-1997 p.270} {cite:muwatta-maruf-1997 p.271}"
