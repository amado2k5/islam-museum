label: { ar: "الموطأ 2130 — يحيى عن مالك عن داود بن الحصين: سمع أبا غطفان بن طريف المري يقول: اختصم زيد بن ثابت وابن مطيع في دار إلى مروان بن الحكم، فقضى مروان على زيد باليمين على المنبر، فأبى زيد أن يحلف على المنبر إلا عند مقاطع الحقوق", en: "Muwatta 2130", es: "Muwatta 2130", fr: "Muwatta 2130", ur: "موطا 2130", tr: "El-Muvatta 2130 — Yahya, Malik'ten, o da Davud ibn el-Hüseyn'den rivayetle, Ebu Gatfan ibn Tarif el-Murri'nin şöyle dediğini işitti: Zeyd ibn Sabit ile İbn Muti' arasında Mervan ibn el-Hakam'ın huzurunda bir ev konusunda anlaşmazlık çıktı. Mervan, Zeyd'in minberde yemin etmesi gerektiğine hükmetti, ancak Zeyd, son hüküm anı dışında minberde yemin etmeyi reddetti.", id: "Al-Muwatta 2130 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Dawud ibn al-Husayn: Ia mendengar Abu Ghatfan ibn Tarif al-Murri berkata: Zayd ibn Thabit dan Ibn Muti’ berselisih mengenai sebuah rumah di hadapan Marwan ibn al-Hakam. Marwan memutuskan bahwa Zayd harus bersumpah di mimbar, tetapi Zayd menolak untuk bersumpah di mimbar kecuali pada saat keputusan akhir." }
summary:
  ar: "قال يحيى: قال مالك عن داود بن الحصين أنه سمع أبا غطفان بن طريف المري يقول: اختصم زيد بن ثابت وابن مطيع في دار كانت بينهما إلى مروان بن الحكم، وهو أمير على المدينة، فقضى مروان على زيد بن ثابت باليمين على المنبر. فقال زيد بن ثابت: أحلف له مكاني. فقال مروان: لا والله إلا عند مقاطع الحقوق. فجعل زيد بن ثابت يحلف أن حقه لحق، ويأبى أن يحلف على المنبر. فجعل مروان بن الحكم يعجب من ذلك. {cite:muwatta-maruf-1997 p.270} {cite:muwatta-maruf-1997 p.271}"
  tr: "Yahya şöyle dedi: Malik, Davud ibn el-Hüseyn'den rivayet ettiğine göre, Ebu Gatfan ibn Tarif el-Murri'nin şöyle dediğini işitti: Zeyd ibn Sabit ile İbn Muti' arasında, kendilerine ait bir ev konusunda bir anlaşmazlık çıktı ve davayı Medine valisi Mervan ibn el-Hakam'a götürdüler. Mervan, Zeyd ibn Sabit'in minberde yemin etmesi gerektiğine hükmetti. Zeyd ibn Sabit, \"Ben onun yerine yemin ederim\" dedi. Mervan, \"Hayır, Allah'a yemin ederim ki, ancak hakların kesinleştiği yerde yemin edilir\" dedi. Bunun üzerine Zeyd ibn Sabit, hakkının kendi hakkı olduğunu söyleyerek yemin etmeye devam etti ve minberde yemin etmeyi reddetti. Mervan ibn el-Hakam buna çok şaşırdı. {cite:muwatta-maruf-1997 s.270} {cite:muwatta-maruf-1997 s.271}"
  id: "Yahya berkata: Malik meriwayatkan dari Dawud ibn al-Husayn bahwa ia mendengar Abu Ghatfan ibn Tarif al-Murri berkata: Zayd ibn Thabit dan Ibn Muti’ berselisih mengenai sebuah rumah yang menjadi milik mereka, dan mereka membawa perkara mereka kepada Marwan ibn al-Hakam, yang merupakan gubernur Madinah. Marwan memutuskan bahwa Zayd ibn Thabit harus bersumpah di mimbar. Zayd ibn Thabit berkata: Aku akan bersumpah kepadanya di tempatku. Marwan berkata: Tidak, demi Allah, kecuali di tempat di mana hak-hak ditetapkan. Maka Zayd ibn Thabit terus bersumpah bahwa haknya adalah haknya, dan ia menolak untuk bersumpah di mimbar. Marwan ibn al-Hakam sangat heran akan hal itu. {cite:muwatta-maruf-1997 p.270} {cite:muwatta-maruf-1997 p.271}"
