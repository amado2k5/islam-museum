text: "… ابن حزم فى مقدمة كتاب النسب له فصلا فى الرد على من زهم أن علم النسب علم لا ينفع وجهل لا يضر بأن فى علم النسب ما هو فرض على كل أحد، وما هو فرض على الكفاية، وما هو ستحب. …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 609، يرد فيه ذكر ما فُرض على الناس، والفرض، وما وجب على كل مسلم، وفرض الكفاية؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 609, whose wording mentions what was made obligatory on people, the obligatory (fard), a duty laid on every Muslim, the communal obligation (fard kifaya); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 609 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، جو ہر مسلمان پر لازم ہے، فرضِ کفایہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Hajar, volume numérisé 2, p. 609, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), un devoir imposé à chaque musulman, l'obligation collective (fard kifaya) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen digitalizado 2, p. 609, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), un deber impuesto a cada musulmán, la obligación colectiva (fard kifaya); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
