text: "… يا ليتكم لم تعلموا بهذه فإنَّها لا تقرأ للتسلية خلع الشيخ ثيابه ليستحمَّ في بحيرة آقَ شَهْرُ فسقط من جيبه مجموعةٌ مخطوطةٌ، فأسرع رفاقُهُ، واختطفوها، وقلبوا أوراقها بكل اهتمامٍ، فوجدوها نشتمل على عبارات بحق غسل الميت، وتلقينِهِ، ودفنِهِ وما ماثل …"
summary:
  ar: "استحم جحا في بحيرة آق شهر فسقطت من جيبه مخطوطة، فقرأها رفاقه فإذا هي عن الغسل والتلقين والدفن، فقال جحا إنه كان ينبغي ألا يقرأوها لأنها لا تُقرأ للتسلية. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  en: "Juha bathes in the Akshehir lake; a manuscript falls from his pocket; companions read it and find it is about washing, prompting and burying the dead; Juha says they should not have read it, since it does not entertain. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  ur: "جحا آق شہر کی جھیل میں نہا رہا تھا کہ اس کی جیب سے ایک مخطوطہ گر پڑا، ساتھیوں نے اسے پڑھا تو معلوم ہوا کہ وہ میت کے غسل، تلقین اور تدفین کے بارے میں ہے، جحا نے کہا کہ انہیں اسے نہیں پڑھنا چاہیے تھا کیونکہ یہ دل بہلانے کے لیے نہیں پڑھی جاتی۔ {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  fr: "Juha se baigne dans le lac d'Akshehir ; un manuscrit tombe de sa poche ; ses compagnons le lisent et découvrent qu'il traite de la toilette, de la talqin et de l'enterrement des morts ; Juha dit qu'ils n'auraient pas dû le lire, car il ne distrait pas. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  es: "Juha se baña en el lago de Akshehir; un manuscrito cae de su bolsillo; sus compañeros lo leen y descubren que trata del lavado, la talqin y el entierro de los muertos; Juha dice que no deberían haberlo leído, pues no entretiene. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  tr: "Juha, Akşir Gölü'nde yıkanırken cebinden bir el yazması düştü. Arkadaşları onu okudular ve yıkanma, öğüt verme ve definle ilgili olduğunu gördüler. Juha, bunun eğlence için olmadığını, okumamaları gerektiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 162}"
  id: "Juha sedang mandi di Danau Aqsheer ketika sebuah manuskrip jatuh dari sakunya. Teman-temannya membacanya dan mendapati isinya tentang mandi, memberi pengajaran, dan penguburan. Juha berkata bahwa mereka seharusnya tidak membacanya karena itu bukan untuk hiburan. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
