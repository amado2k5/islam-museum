label: { ar: "سنن ابن ماجه 1740 — الأب والأبوة", en: "Sunan Ibn Majah 1740 — the father and fatherhood", ur: "سنن ابن ماجہ 1740 — باپ اور والدیت", es: "Sunan Ibn Majah 1740 — El padre y la paternidad" }
text: "… بْنُ عَبْدِ الْعَظِيمِ الْعَنْبَرِيُّ، حَدَّثَنَا الضَّحَّاكُ بْنُ مَخْلَدٍ، عَنْ مُحَمَّدِ بْنِ رِفَاعَةَ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ـ كَانَ يَصُومُ الاِثْنَيْنِ وَالْخَمِيسَ. فَقِيلَ يَا رَسُولَ اللَّهِ إِنَّكَ تَصُومُ يَوْمَ الاِثْنَيْنِ وَالْخَمِيسِ فَقَالَ \" إِنَّ يَوْمَ الاِثْنَيْنِ وَالْخَمِيسِ يَغْفِرُ اللَّهُ فِيهِمَا لِكُلِّ مُسْلِمٍ إِلاَّ مُهْتَجِرَيْنِ يَقُولُ دَعْهُمَا حَتَّى يَصْطَلِحَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1740، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1740 (Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1740، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1740 (El ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
