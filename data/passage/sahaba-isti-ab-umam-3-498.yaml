text: "… بن مخلد. وكان عمرو بن العاص من فرسان قريش وأبطالهم في الجاهلية، مذكوراً بذلك فيهم، وكان شاعراً حسن الشعر، حُفظ عنه الكثير في مشاهد شتَّى. ومن شِعْرِه في أبياتٍ له يخاطب عمارة بن الوليدِ بن المغيرة عند النجاشي الطويل : …"
summary:
