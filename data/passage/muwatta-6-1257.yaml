label: { ar: "الموطأ 1257 — ابن عباس: من نسي من نسكه شيئا أو تركه فليهرق دما", en: "Muwatta 1257", es: "Muwatta 1257", fr: "Muwatta 1257", ur: "موطا 1257", tr: "İbn Abbas, El-Muvatta 1257: Her kim ibadetlerinin herhangi bir bölümünü unutur veya ihmal ederse, kurban kesmelidir.", id: "Al-Muwatta 1257 — Ibnu Abbas: Barangsiapa lupa atau lalai dalam melaksanakan sebagian dari ritualnya, hendaknya ia mempersembahkan kurban." }
summary:
  ar: "يروي مالك عن أيوب السختياني عن سعيد بن جبير أن عبد الله بن عباس قال من نسي من نسكه شيئا أو تركه فليهرق دما. قال أيوب لا أدري أقال ترك أو نسي. {cite:muwatta-maruf-1997 p.559}"
  tr: "Malik, Ayyub el-Sakhtiyani'den, o da Sa'id ibn Jubayr'den rivayet ettiğine göre, Abdullah ibn Abbas şöyle buyurmuştur: \"Kim ibadetlerinden bir şeyi unutur veya ihmal ederse, kurban kesmelidir.\" Ayyub şöyle demiştir: \" 'İhmal etti' mi yoksa 'unuttu' mu dediğini bilmiyorum.\" {cite:muwatta-maruf-1997 s.559}"
  id: "Malik meriwayatkan dari Ayyub al-Sakhtiyani, dari Sa'id ibn Jubayr, bahwa Abdullah ibn Abbas berkata: \"Barang siapa yang lupa atau lalai dalam suatu ritualnya, hendaknya ia mempersembahkan kurban.\" Ayyub berkata: \"Aku tidak tahu apakah beliau mengatakan 'lalai' atau 'lupa'.\" {cite:muwatta-maruf-1997 p.559}"
