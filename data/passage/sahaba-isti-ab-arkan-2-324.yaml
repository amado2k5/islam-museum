text: "… يَذْكُرْه ابنُ إِسحاق. عطاء بن يسار، عن سكين الضمري، عن النَّبيِّ - سلمة بن قيس الجرْمي : والد عمرو بن وَا ليه، قال : المؤمنُ يأكلُ في معىً واحِد. سلمةَ. له صُحبةٌ ولا بنه عمرو الّذي كان يؤمُّ قومه قال …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 324، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 324, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 324 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
