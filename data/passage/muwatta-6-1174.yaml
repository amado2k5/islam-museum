label: { ar: "الموطأ 1174 — عبد الرحمن بن القاسم عن أبيه: كان يدخل مكة ليلا معتمرا فيطوف ويسعى ويؤخر الحلاق حتى يصبح", en: "Muwatta 1174", es: "Muwatta 1174", fr: "Muwatta 1174", ur: "موطا 1174", tr: "El-Muvatta 1174 — Abdülrahman ibn el-Kâsım, babasından rivayetle: Umre yapmak için geceleyin Mekke'ye girerdi, tavaf eder ve Sa'i yapardı, tıraşını da sabaha bırakırdı.", id: "Al-Muwatta 1174 — Abd al-Rahman ibn al-Qasim, berdasarkan keterangan ayahnya: Beliau biasa memasuki Mekah pada malam hari untuk melaksanakan Umrah, lalu beliau melakukan tawaf dan Sa'i, dan beliau menunda bercukur hingga pagi hari." }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أنه كان يدخل مكة ليلا وهو معتمر، فيطوف بالبيت وبين الصفا والمروة، ويؤخر الحلاق حتى يصبح، ولا يعود إلى البيت فيطوف به حتى يحلق رأسه. {cite:muwatta-maruf-1997 p.530}"
  tr: "Malik, Abdülrahman ibn el-Kasım'dan, babasından rivayetle, Umre yaparken geceleyin Mekke'ye girdiğini, Kâbe'yi tavaf ettiğini ve Safa ile Merve arasında Sa'i yaptığını, saçlarını tıraş etmeyi sabaha kadar ertelediğini ve başını tıraş etmeden tekrar Kâbe'ye tavaf etmek için geri dönmediğini anlatır. {cite:muwatta-maruf-1997 s.530}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, yang juga dari ayahnya, bahwa ia biasa memasuki Mekah pada malam hari saat melaksanakan Umrah, melakukan tawaf mengelilingi Ka'bah dan melakukan Sa'i antara Safa dan Marwa, dan menunda bercukur hingga pagi hari, dan tidak akan kembali ke Ka'bah untuk melakukan tawaf lagi sampai kepalanya dicukur. {cite:muwatta-maruf-1997 p.530}"
