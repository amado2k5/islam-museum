summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أنه كان يدخل مكة ليلا وهو معتمر، فيطوف بالبيت وبين الصفا والمروة، ويؤخر الحلاق حتى يصبح، ولا يعود إلى البيت فيطوف به حتى يحلق رأسه. {cite:muwatta-maruf-1997 p.530}"
