label:
  ar: "البخاري 22 — أخرجوا من النار من كان في قلبه مثقال حبة من خردل من إيمان"
  en: "Bukhari 22 — Bring out of the Fire whoever has a mustard seed's weight of faith"
  ur: "بخاری 22 — آگ سے اسے نکالو جس کے دل میں رائی کے دانے برابر ایمان ہو"
text: "يدخل أهل الجنة الجنة، وأهل النار النار، ثم يقول الله تعالى أخرجوا من كان في قلبه مثقال حبة من خردل من إيمان. فيخرجون منها قد اسودوا فيلقون في نهر الحيا أو الحياة، شك مالك فينبتون كما تنبت الحبة في جانب …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 22: أخرجوا من النار من كان في قلبه مثقال حبة من خردل من إيمان. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 22: Bring out of the Fire whoever has a mustard seed's weight of faith. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 22: آگ سے اسے نکالو جس کے دل میں رائی کے دانے برابر ایمان ہو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
