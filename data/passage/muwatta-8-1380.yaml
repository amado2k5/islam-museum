label: { ar: "الموطأ 1380 — سليمان بن يسار: أدرك الناس يعطون في كفارة اليمين مدا من حنطة بالمد الأصغر ويرونه مجزئا", en: "Muwatta 1380", es: "Muwatta 1380", fr: "Muwatta 1380", ur: "موطا 1380", tr: "El-Muvatta 1380 — Süleyman ibn Yasar: İnsanların yemini bozdukları için kefaret olarak bir mudd buğday (küçük mudd) verdiklerini ve bunu yeterli saydıklarını gördü.", id: "Al-Muwatta 1380 — Sulayman ibn Yasar: Dia melihat orang-orang memberikan satu mudd gandum (mudd yang lebih kecil) sebagai penebusan atas pelanggaran sumpah, dan mereka menganggapnya sudah cukup." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار أنه قال أدركت الناس وهم إذا أعطوا في كفارة اليمين، أعطوا مدا من حنطة بالمد الأصغر، ورأوا ذلك مجزئا عنهم. {cite:muwatta-maruf-1997 p.616}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayetle şöyle buyurduğunu aktarır: \"Yemin bozanların kefaretini öderken, küçük bir mudd kullanarak bir mudd buğday veren ve bunu yeterli sayan insanlar tanıdım.\" {cite:muwatta-maruf-1997 s.616}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa ia berkata: Aku mengenal orang-orang yang, ketika memberikan penebusan atas pelanggaran sumpah, memberikan satu mudd gandum menggunakan mudd yang lebih kecil, dan mereka menganggap itu sudah cukup bagi mereka. {cite:muwatta-maruf-1997 p.616}"
