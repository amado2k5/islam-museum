label: { ar: "صحيح البخاري 92 — الأب والأبوة", en: "Sahih al-Bukhari 92 — the father and fatherhood", ur: "صحیح بخاری 92 — باپ اور والدیت", es: "Sahih al-Bukhari 92 — El padre y la paternidad" }
text: "… عَنْ أَشْيَاءَ كَرِهَهَا، فَلَمَّا أُكْثِرَ عَلَيْهِ غَضِبَ، ثُمَّ قَالَ لِلنَّاسِ \" سَلُونِي عَمَّا شِئْتُمْ \". قَالَ رَجُلٌ مَنْ أَبِي قَالَ \" أَبُوكَ حُذَافَةُ \". فَقَامَ آخَرُ فَقَالَ مَنْ أَبِي يَا رَسُولَ اللَّهِ فَقَالَ \" أَبُوكَ سَالِمٌ مَوْلَى شَيْبَةَ \". فَلَمَّا رَأَى عُمَرُ مَا فِي وَجْهِهِ قَالَ يَا رَسُولَ اللَّهِ، إِنَّا نَتُوبُ إِلَى اللَّهِ عَزَّ وَجَلَّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 92، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 92 (Knowledge), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 92، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 92 (Conocimiento), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
