text: |-
  ٤١.٧
  .نه هجرت البعبر أهجره هجراو هجار القوس وتزها ويقال المهجور الفس-ل بندرأسه الى
  رجله هدر)، هدرد مه يهدرهدرا أى بطل وأهدر السلطان دمه أى أبطله وأبا-ه
  وهدر الشراب يهدرهدراوتهدارا أى غلا قال الاخطل بصف خرا
  كن ثلاثة أحوال بطينتها حتى اذاصر حت من بعد تهدار
  وذهب دم فلان هدراوه_درا بالتحريك أى باطلاليس فيه قود ولا عقل ويقال أيضا بنو
  فلان هدرة باآحريك أى ساقطون ليسوابشئ ورجل هدرة منال همزة أى ساقط قال الراجز
  انى اذا حار الجبان الهدره وهو بالدال فى هذا الموضع أجود منه بالذال وهورواية ابي
  سعيدوضربه فهدرت رتنه تهد رهد ورا أى سقطت وهدر الهام هديرا أى حوّت وهدر
  البعير هديرا أى ردد صوته فى حنجرته وابل هوادر وكذلك هذرتهديرا وفى المئسل كالمهدر
  فى العنة يضرب مثلا للرجر يصيح ويجاب وليمر وراء ذلك شئ كالبعير الذى يحبر فى الحظيرة
  ويمنع من الضراب وحوبهدر قال الوليد بن عقبة يخاطب معاوية
  قطعت الدهر كالسدم المعنى * تهدّر فى دمشق غاتريم
  والهادر اللبن اذاخثر أعلاه وأسف له رقيق قال أبو عبيد وذلك بعد الحزور وجوف أهدرأى
  نتفخ وهدر العرفج أى عظم نساته ⁦(هذر)⁩ هذرف منطقه يهذرويهذرهذرا والاسم
  المذر بالتحريك وه والهذيان والرجل هذر بكسر الذال وهذرة مقال همزة وهذار
  ومهذار قال الرابيز
  انى أذرى حسبى أن أشتما • ج ذرهذاريمج البلغما
  وأهذرف كلل.م أى أكثرور حل هذريان خفيف الكلام والخدمة قال الشاءر
  اذا ما اشتهوامنها شواء -عى لهم • بدهذريان للكرام خدوم
  قولمنها أى من الجزور رر ) الهزّ السنور والجمع هررة مثال قرد وقردة والانى هرة
  وجعها هر رمل قربة وقرب ورأس هزم وضع وهراسم امرأة وقال
  أصحوت اليوم أم شاقتكهر • ومن الحب جنون مستعر
  والهرّالاسم من قولك هررته (هرا أى كرهته وفى المشل فلان لا يعرف هزامن برّأى
  لا يه رف من يكرهه ممن يبرّه ويقسال الهزفى هذا المثسل دعاء الغنم والبرسوقها والهرارداء.
  بأخذ الابل تسلح منه وأنشد أبوع رواغيلان بن حريث
  فان يكن فيها هرارفانف • بسل بانيها الى الجول خائف
  أى خانف سلا والباءزائدتة ول منه هرت الابل تهرهرارا وبعيرمهرور وناقعه رورة
  قال السكميت يمدح خالد بن عبد اللّه القسرى
  ولا يصادفن شربا آجنا كدرا • ولايهر به منهنّ مبتقسل
  قوله به أى بالماء يسنى انه مرى«ايس بالوبى وذكر الابل وهوير يد أصحابه اوه-رير الكلب
  صونه دون نباحه من قلة صبره على البرد وقدهر الكلب يهرهريرا وقال يصف شدة البرد
  اذا كبد التجم السماه بشتوة • على حين هرَ السكاب والثلج خاشف
  وهرفلان الكاس والحرب هريرا أى كرهها قال عنترة -تى ته-روا العواليا وهاره أى
