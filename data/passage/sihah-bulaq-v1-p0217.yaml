text: |-
  570
  (ياب الزاى
  ⁦(جوذ)⁩
  انا النجاشىّ على جاز • حادابن حسان عن ارتجاز
  وحارجزى أى سريع قال الشاءر ⁦(أمية بن أبى عائد)⁩
  كانى ورحلى اذارعتها * على جزى جازئ بالرمال
  والفاقة تعد والهزى وكذلك الفرس والهازة بالضم مدرعة صوف قال الراجز
  يكفيك من طاق كثير الائمان • جازة شهر منها السكان
  والهزان ضرب من التمر والجزة كتلةّ من تروغحوه والبمع جزوالهسيزشبيه بالتين ( ن
  الجنازة واحدة الجنائز والعامة تقول الجمازة بالفتح والمعسى للميت على السريرفاذالم يكن
  عليه الميت فهو مرير ونعش ( هز الأصمعى أجهزت على الجريح اذا أسرعت قت له
  وقد تممت عامه ولا تقل أجزت على الجريح وفرس جه يزاذا كانسريع الشد ومن آمثالهم
  فى الشئء اذانفر فلم يعد ضرب فى جهازه بالفتم قال الادعهى وأصله فى البعير يسقط عن ظهر
  القتب باداته فيقع بين قوائمه فينفرعنه حتى يذهب فى الارض ويجمع على أجهزة قال
  الشاءربصف ابلا
  يبتن ين قلن بأجهزاتها • والحادى اللاعب من حداتها
  والجهاز أيضا فرج المرأة وأماجهاز العروس وجهاز الصفرفيفتح ويكسر وجهزت العروس
  جهيزاوكذلك جهزت الجيش يقال جهز عليه انخسل وجهزت فلانا اذاهيات جهازسفره
  رتجهزت لامى كذا أى تهيأت له وجهيزة اسم امر أقتحمق قال ابن السكيت هى أم شدم
  لخارجى وكان أبوه اشتراها من السى فواقعها فجملت فتحرك الولد فى بطنها فقالت فى بطى
  شى ينة رفقيل أحق من جهيزة وذ) جزت الموضع أجوزه جواز اسدكته وسرت فيه
  وأجزته خلفته وقطعته قال امر ؤالقيس
  فلما أجزناساحسة الحى واتحى * بنابطن خبت ذى قفاف عقنقل
  وأجزنه أنفذته قال الراجز
  خلوا الطريق عن أبى سياره ، حتى يجيز سالماحاره
  والاجنياز السلولك ابن السكيت أجزت على اسمه اذا جعلته جائزا والاجازة أن تتمم مصراع
  غيرك قال افرّاء الاجازة فى قول الخليل أنة.كون القافية طاء والاخرى دالا وغحودل وهو
  الاكفا. فى قول أبى زيدوجاوزت الشى الى غيره وتجاوزته بمعنى أى جزته وتجاوز الله عنا
  وعنه أى عفاوذ والمجازه وضع بن كان فيه سوق فى الجاهلية قال الحرث بن حلزة اليشْكرى
  واذكر واحلف ذى الجمازوما • قدّم فيه العهود والكفلا.
  وجوّزله ماصسنع وأجازله أى سوّغله ذلك وتجوّز فى صلاته أى خفف وتجوّز فى كلامه أى
  كام بالمجازوة ولهم جعل فلان ذلك الامر مجازا الى حاجته أى طر يقاومسلكاوتة ول اللهم
  جوزعني وتجاوزعنى بمعى أبو *رو الجواز الماء الذى يسقاه المال من الماشبة والحرث
  والجواز أبضا السقى والجوزة السقية قال الراجز
  يا ابن رقيع وردت لسَ * أحسن جوازى وأقل حبسى
  يريدأ حسن سق ابلى واستجزت فلانافأجازنى اذا أسة التما لارضك أوماشيتك قال القطامى
  وقالوا فقيم قيم الماءفاستجز • عبادة ان المستجيز على قتر
  قوله
