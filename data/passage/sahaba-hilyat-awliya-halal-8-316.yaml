  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 8. resimli cildinin 316. sayfasından, helal ve haram olanı belirten bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
