text: "… الدينار والدرهم. قال : وسمعته الساجى يقول : سمل ابن عيينة عن الزهد فقال : أن لا يغلب الحلال شكرك ولا الحرام صبرك. حدثنا محمد بن إبراهيم ثنا أحمد بن عبيد الله الدارى الأنطاكى ثنا عبد اللّٰه بن خبيق قال …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 316، يذكر الحلال، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 8, p. 316, that mentions the lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 8، ص 316 کا اقتباس جس میں حلال، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
