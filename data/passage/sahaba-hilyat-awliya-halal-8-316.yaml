text: "… الدينار والدرهم. قال : وسمعته الساجى يقول : سمل ابن عيينة عن الزهد فقال : أن لا يغلب الحلال شكرك ولا الحرام صبرك. حدثنا محمد بن إبراهيم ثنا أحمد بن عبيد الله الدارى الأنطاكى ثنا عبد اللّٰه بن خبيق قال …"
