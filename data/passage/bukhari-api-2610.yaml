label: { ar: "صحيح البخاري 2610 — الأب والأبوة", en: "Sahih al-Bukhari 2610 — the father and fatherhood", ur: "صحیح بخاری 2610 — باپ اور والدیت", es: "Sahih al-Bukhari 2610 — El padre y la paternidad", fr: "Sahih al-Bukhari 2610 — le père et la paternité" }
text: "… ابْنُ عُيَيْنَةَ، عَنْ عَمْرٍو، عَنِ ابْنِ عُمَرَما ـ أَنَّهُ كَانَ مَعَ النَّبِيِّ فِي سَفَرٍ فَكَانَ عَلَى بَكْرٍ لِعُمَرَ صَعْبٍ، فَكَانَ يَتَقَدَّمُ النَّبِيَّ فَيَقُولُ أَبُوهُ يَا عَبْدَ اللَّهِ لاَ يَتَقَدَّمِ النَّبِيَّ أَحَدٌ. فَقَالَ لَهُ النَّبِيُّ \" بِعْنِيهِ \". فَقَالَ عُمَرُ هُوَ لَكَ. فَاشْتَرَاهُ ثُمَّ قَالَ \" هُوَ لَكَ يَا عَبْدَ اللَّهِ، فَاصْنَعْ بِهِ مَا شِئْتَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2610، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2610 (Gifts), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2610، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2610 (Regalos), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2610 (Les Dons), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
