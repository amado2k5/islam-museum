label: { ar: "الموطأ 2184 — يحيى عن مالك: الأمر عندنا في الرجل يحيل الرجل على الرجل بدين له عليه، أنه إن أفلس الذي أحيل عليه، أو مات فلم يدع وفاء، فليس للمحتال على الذي أحاله شيء، ولا يرجع على صاحبه الأول، وهذا الأمر الذي لا اختلاف فيه عندنا", en: "Muwatta 2184" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في الرجل يحيل الرجل على الرجل بدين له عليه، أنه إن أفلس الذي أحيل عليه، أو مات فلم يدع وفاء، فليس للمحتال على الذي أحاله شيء، ولا يرجع على صاحبه الأول. قال مالك: وهذا الأمر الذي لا اختلاف فيه عندنا. {cite:muwatta-maruf-1997 p.296}"
