label: { ar: "الموطأ 2184 — يحيى عن مالك: الأمر عندنا في الرجل يحيل الرجل على الرجل بدين له عليه، أنه إن أفلس الذي أحيل عليه، أو مات فلم يدع وفاء، فليس للمحتال على الذي أحاله شيء، ولا يرجع على صاحبه الأول، وهذا الأمر الذي لا اختلاف فيه عندنا", en: "Muwatta 2184", es: "Muwatta 2184", fr: "Muwatta 2184", ur: "موطا 2184", tr: "El-Muvatta 2184 — Yahya, Malik'ten rivayetle: Hükmümüz şudur ki, bir kimse kendisine olan borcu başka bir kimseye devrettiğinde ve devredilen kişi iflas ettiğinde veya ödeme imkanı bırakmadan öldüğünde, borcu devredenin, borcu yapan kişiye karşı hiçbir hakkı yoktur; ne de asıl alacaklıya karşı rücu yoluna başvurabilir. Bu konuda aramızda ihtilaf yoktur.", id: "Al-Muwatta 2184 — Yahya berdasarkan Malik: Hukum kami adalah jika seseorang mengalihkan utang yang dimiliki orang lain kepadanya kepada orang lain lagi, dan orang yang menerima pengalihan tersebut bangkrut atau meninggal dunia tanpa meninggalkan harta warisan, maka orang yang mengalihkan utang tersebut tidak memiliki hak tuntutan terhadap orang yang memberikan utang tersebut, dan ia juga tidak dapat menuntut ganti rugi dari kreditur semula. Ini adalah masalah yang tidak ada perbedaan pendapat di antara kami." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في الرجل يحيل الرجل على الرجل بدين له عليه، أنه إن أفلس الذي أحيل عليه، أو مات فلم يدع وفاء، فليس للمحتال على الذي أحاله شيء، ولا يرجع على صاحبه الأول. قال مالك: وهذا الأمر الذي لا اختلاف فيه عندنا. {cite:muwatta-maruf-1997 p.296}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Bizim hükmümüz şudur ki, bir kimse kendisine olan borcu başka bir kimseye devrettiğinde ve borcun devredildiği kişi iflas eder veya ödeme imkanı bırakmadan ölürse, borcu devredenin, borcu devredene karşı hiçbir hakkı yoktur; ne de asıl alacaklıya karşı dava açabilir. Malik dedi ki: Bu konuda aramızda ihtilaf yoktur. {cite:muwatta-maruf-1997 s.296}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Hukum kami adalah jika seseorang mengalihkan utang yang dimiliki orang lain kepadanya kepada orang lain, dan orang yang menerima pengalihan utang tersebut bangkrut atau meninggal dunia tanpa meninggalkan harta untuk pembayaran, maka orang yang mengalihkan utang tersebut tidak memiliki hak untuk menuntut orang yang menerima pengalihan tersebut, dan ia juga tidak dapat menuntut kreditur asli. Malik berkata: Ini adalah masalah yang tidak ada perbedaan pendapat di antara kami. {cite:muwatta-maruf-1997 p.296}"
