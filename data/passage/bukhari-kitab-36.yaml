summary:
  ar: "القسم 36 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الشفعة»، ويضم فيها النصوص من 2257 إلى 2259 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 36 of Sahih al-Bukhari (Shuf'a) in the division of the open hadith dataset the museum took its reports from: reports 2257 to 2259 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 36، عنوان «کتاب الشفعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2257 تا 2259۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 36 de Sahih al-Bukhari (Shuf'a) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2257 a 2259 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 36 du Sahih al-Bukhari (Shuf'a), correspondant aux hadiths 2257 à 2259 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
