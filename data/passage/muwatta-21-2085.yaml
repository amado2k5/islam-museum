label: { ar: "الموطأ 2085 — مالك: فيمن اشترى شقصا في أرض مشتركة بثمن إلى أجل، فأراد الشريك أن يأخذها بالشفعة: إن كان المشتري مليا فله الشفعة بذلك الثمن إلى ذلك الأجل، وإن خيف ألا يؤدي الثمن إلى الأجل فيأتي بحميل مليء ثقة", en: "Muwatta 2085", es: "Muwatta 2085", fr: "Muwatta 2085", ur: "موطا 2085", tr: "Al-Muwatta 2085 — Malik: Ortak mülkiyetteki bir arazide, bedeli daha sonra ödenecek şekilde bir pay satın alan ve ortağın öncelikli satın alma hakkı isteyen kişi hakkında: Alıcı ödeme gücüne sahipse, o tarihe kadar o bedel karşılığında öncelikli satın alma hakkına sahiptir. Eğer bedeli o tarihte ödeyemeyeceğinden endişe ediliyorsa, ödeme gücüne sahip ve güvenilir bir kefil getirmelidir.", id: "Al-Muwatta 2085 — Malik: Mengenai seseorang yang membeli bagian dalam tanah milik bersama dengan harga yang akan dibayar di kemudian hari, dan mitra ingin mengambil bagian tersebut dengan hak prioritas: Jika pembeli mampu membayar, ia memiliki hak prioritas untuk harga tersebut hingga tanggal tersebut. Jika ada kekhawatiran bahwa ia tidak akan membayar harga tersebut pada tanggal yang ditentukan, ia harus membawa penjamin yang mampu membayar dan dapat dipercaya." }
summary:
  ar: "قال مالك في رجل اشترى شقصا في أرض مشتركة بثمن إلى أجل، فأراد الشريك أن يأخذها بالشفعة. قال مالك: إن كان مليا، فله الشفعة بذلك الثمن إلى ذلك الأجل. وإن كان مخوفا أن لا يؤدي الثمن إلى ذلك الأجل، فإذا جاءهم بحميل مليء ثقة مثل الذي اشترى منه الشقص في الأرض المشتركة، فذلك له. {cite:muwatta-maruf-1997 p.254}"
  tr: "Malik, ortak mülkiyetteki bir arazide, daha sonra ödenecek bir bedel karşılığında pay satın alan bir kişi ve ortağının bu payı öncelikli olarak almak istemesi durumunda şunları söyledi: Malik şöyle dedi: Eğer ödeme gücü varsa, o tarihe kadar o bedel karşılığında öncelikli alma hakkına sahiptir. Ancak, o tarihe kadar bedeli ödeyemeyeceğinden endişe ediliyorsa, o zaman ortak mülkiyetteki payını satın aldığı kişi gibi güvenilir ve ödeme gücü olan bir kefil getirirse, bu onun hakkıdır. {cite:muwatta-maruf-1997 s.254}"
  id: "Malik berkata mengenai seorang pria yang membeli saham di tanah milik bersama dengan harga yang akan dibayar di kemudian hari, dan rekannya ingin mengambil saham tersebut dengan hak prioritas: Malik berkata: Jika ia mampu membayar, ia memiliki hak prioritas untuk harga tersebut hingga tanggal tersebut. Tetapi jika ada kekhawatiran bahwa ia tidak akan membayar harga tersebut pada tanggal tersebut, maka jika ia membawa penjamin yang dapat dipercaya dan mampu membayar seperti orang yang darinya ia membeli saham di tanah milik bersama, maka itu adalah haknya. {cite:muwatta-maruf-1997 p.254}"
