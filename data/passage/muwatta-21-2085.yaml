label: { ar: "الموطأ 2085 — مالك: فيمن اشترى شقصا في أرض مشتركة بثمن إلى أجل، فأراد الشريك أن يأخذها بالشفعة: إن كان المشتري مليا فله الشفعة بذلك الثمن إلى ذلك الأجل، وإن خيف ألا يؤدي الثمن إلى الأجل فيأتي بحميل مليء ثقة", en: "Muwatta 2085" }
summary:
  ar: "قال مالك في رجل اشترى شقصا في أرض مشتركة بثمن إلى أجل، فأراد الشريك أن يأخذها بالشفعة. قال مالك: إن كان مليا، فله الشفعة بذلك الثمن إلى ذلك الأجل. وإن كان مخوفا أن لا يؤدي الثمن إلى ذلك الأجل، فإذا جاءهم بحميل مليء ثقة مثل الذي اشترى منه الشقص في الأرض المشتركة، فذلك له. {cite:muwatta-maruf-1997 p.254}"
