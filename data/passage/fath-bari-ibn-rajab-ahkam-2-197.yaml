  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 2. resimli cildinin 197. sayfasından, mekruh, kınanacak ve caiz olan fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu, tavsiye edilen ve mekruh olan fiiller, yasaklanmış ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, jilid 2 bergambar, halaman 197, yang menyebutkan perbuatan yang tidak disukai, tercela, dan diperbolehkan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, dianjurkan, dan tidak disukai, serta dosa-dosa kecil."
