text: "… مبنيٌّ على القولِ بأنَّه مكروه كراهة تنزيه. وأكثَرُ العلماءِ على أنَّ الكراهةَ في ذلك كراهةُ تنزيهِ. ومنهم من رخَّصَ فيه. قالَ ابنُ المنذرِ : اختلفوا في الصَّلاةِ في المقبرةٍ، فروينا عن عليِّ، وابنِ عباسٍ، وعبدِ اللهِ بنِ عمرِو، وعطاءٍ، والنخعيّ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 2، ص 197، يرد فيه ذكر المكروه، والكراهة، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 2, p. 197, whose wording mentions the disliked (makruh), dislike (karaha), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 2، ص 197 کا اقتباس جس میں مکروہ، کراہت، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Rajab, volume numérisé 2, p. 197, dont le texte mentionne le réprouvé (makruh), la réprobation (karaha), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
