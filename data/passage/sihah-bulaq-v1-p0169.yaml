text: |-
  ٤٧٢
  (باب السين
  ⁦(كدس )⁩
  فعول فتردها الى الاصل وربماسموا الذراع قوسا والقوس أيضابقية التمرفى الجلة والقوس
  برج فى السماء وقست الشىْ بغيره وعلى غيره أقيسه قيسا وقيا سا فانقاس اذا قدرته على مثاله
  وفيه لغة أخرى قسته أقوسه فوسا وقياسا ولا يقال أقسته والمقدار مقياس وقايست
  بين الاحرين مقايسة وقياسا ويقال أيضا قايست فلانا اذا جاريته فى القياس وهو يقتاس
  الشى بغيره أى يقيسه به ويقتاس بأيه اقتياسا أى بسلك سبيله ويقتدى به والقوس بالضم
  سومعة الراهب قال المشاعر ( ا ذكرامرأة
  ١ رير كذا فى بعض النسخ اه
  لاوصل اذرحلت هند ولووقفت • لاستفتتنى وذا المسحين فى القوس
  قوه الناس بالنون المشددة
  وقوسي اسم موضع وقوّس الشيخ تقويسا أى انحى واستقوس مثله والاقوس المنحى الظهر
  فهو أخوالياس بن مضر الذى
  ابن السكيت يقال رجل متوس قوسه أى معه قوسه والمقوس بالكسر وعاء القوس
  فى العمود النبوى وانما أضيف
  والمقوس أيضاحبل تصف عليه الفيل عند السباق قال أبو العبال الهذلى
  لقبه الى عيلان الذى هو اسم
  ان البلا لدى المقاوس مخرج • ما كان من غيب ورجم ظنون
  فرسه لانه كان فعصره شخص
  يقال لهقيس كبة بضم الكاف
  وشدالموحدة وهواسم فرسه
  أيضافكان كل واحد منه-ما
  يضاف الى ماله للتمييز اه
  باختصار من الوفيات الخلكانية
  فى تريمة مظة والاعمى العيلاوتى
  الشر
  قوله التى يسترق منها الخ الاولى
  سترق اه الان اليوم زيادة
  عليها كما فى القول المانوس ا•
  محني القاموس
  مثاله ويقال بينه-ماقيس ريح وقاس رمح أى قدررع وقيس أبو قبيلة من مضر وهوقيس
  عيلان واسمه الناس بن مضر بن نزاروقيس لقبه يقال تقيس فلان اذا تشبه بهم أوتسك
  منهم بسبب إمايجلف أوجواراوولاء قال رؤية وقيس عيلان ومن تقيسا والقيسان من
  طيء قيس ابن عذاب بن أبى حارثة بن جسدة بن تدول بن عحتر بن عتود وقيس بن هذمة بن
  عذاب بن أبى حارثة وعبدد القيس أبو قبيلة من أسد وهو عبدالقيس بن أفصى بن دعمىّ بن
  مديلة بن أسد بن ربيعة والنسبة اليهم عبقسى وان شئت عبدىّ وقد نعيس الرجل
  كما يقال تعبتم وتقير
  صل الكاف ( أس الكأس مؤنتة قال القه تعالى بكأس من معين بيضاء
  وأنشد الاسعمى
  من لم يمت عبطة يمت *رما • الموت كأس فالمر ذائقها
  قال ابن الاعرابى لاتسمى الكأس كأسا الاوفيها الشراب والجمع كؤوس وأسكوس
  وكناس كبس كيست النهر والبتر كبساطممتها بالنراب واسم ذلك التراب كيس بالكسم
  وربعا قالوا كيس رأسه أى أدخله فى شايه ويقال رجل أكبس بين الكبس للذى أقبلت هامت
  وأدبرت جبهته والكاس بالضم العظيم الرأس والكاسة بالكسر العذق وهو من التمرينزلة
  العنود من العنب والكبيس ضرب من التمر والسنة الكبيسة التى يسترق منهايوم وذلك
  فى كل أربع سنين والكابوس ما يقع على الأنسان بالليل ويقال هو مقدمة الصرع وكبسوا
  دارفلان أغارواعليها فجأة ⁦(كدس )⁩ الكدس اسراع المثقل فى السير وقد كدست
  الخيل وتكدس الفرس اذامشى كانه مثقل قال الراجز
  إنا اذا انخيل عدت اكداسا • مثل الكلاب تتقى الهراسا
  والكدس بالضم واحدأ كداس الطعام والكداس عطاس اليهائم وقد كدست أى عطست
  قال الراجز
  الطير شفع والمطايا تكدس * انى بان تنصيرنى لأحسس
  يقول هذه الابل تغطس بنصرك اياى والطير تر شفها لانه يتطير بالوترمنها وقوه أحسر أى
