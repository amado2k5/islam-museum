summary:
  ar: "القسم 35 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المزارعة»، ويضم فيها النصوص من 3761 إلى 3856 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 35 of Sunan al-Nasa'i (The Book of Agriculture) in the division of the open hadith dataset the museum took its reports from: reports 3761 to 3856 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 35، عنوان «کتاب المزارعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3761 تا 3856۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 35 de Sunan al-Nasa'i (El Libro de la Agricultura) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3761 al 3856, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de l'agriculture), dans la partie 3761 à 3856 de la base de données ouverte. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 35. bölümü \"Tarım Kitabı\" başlığını taşımakta olup, 3761'den 3856'ya kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 35 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pertanian\" dan berisi teks 3761 hingga 3856, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
