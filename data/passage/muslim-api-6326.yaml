text: "… - وَاللَّفْظُ لاِبْنِ رَافِعٍ - قَالَ إِسْحَاقُ أَخْبَرَنَا وَقَالَ ابْنُ رَافِعٍ، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، حَدَّثَنَا ابْنُ أَبِي زَائِدَةَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، عَنِ الأَسْوَدِ بْنِ يَزِيدَ، عَنْ أَبِي مُوسَى، قَالَ قَدِمْتُ أَنَا وَأَخِي، مِنَ الْيَمَنِ فَكُنَّا حِينًا وَمَا نُرَى ابْنَ مَسْعُودٍ وَأُمَّهُ إِلاَّ مِنْ أَهْلِ بَيْتِ رَسُولِ اللَّهِ مِنْ كَثْرَةِ دُخُولِهِمْ وَلُزُومِهِمْ لَهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6326، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6326 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6326، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
