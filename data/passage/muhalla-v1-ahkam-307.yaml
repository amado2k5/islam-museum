text: "… المَرْءِ إِلَى المَسْجِدِ فَهُوَ أَعْظَمُ لأَجِرِهِ. وَللسِّواكِ فَضْلٌ حَسَنٌ، وَنَسْتَحِبُّهُ لِكُلِّ صَلاةٍ، وَنَخْتَارُ لمَنْ دَخَلَ مَقْبَرَةَ المُسْلِمِيْنَ أَنْ يَقولَ: السَّلامُ عَليكُمْ دَارَ قَومٍ مُؤْمِنينَ، وَإِنَّا إِنْ شَاءَ الهُ بِكُمْ لا حِقونَ. وتُكْرَهُ الدَّناءَةُ كُلُّهَا وَالرَّذائِلُ، وَتُسْتَحَبُّ الفَضائِلُ وَمحاسِنُ الأَخْلاقِ وَالكَرَمُ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 307، يرد فيه ذكر المستحب، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 307, whose wording mentions the recommended (mustahabb), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 307 کا اقتباس جس میں مستحب، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 307, dont le texte mentionne le recommandé (mustahabb), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 307, cuyo texto menciona lo recomendado (mustahabb), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
