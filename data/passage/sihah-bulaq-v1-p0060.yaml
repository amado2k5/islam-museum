text: |-
  ٥٨P
  عن على رضى اللّٰه عنه أسلم واللّه أبو بكر وأناجدعمة واصله جذعة والميم زائدة جرع
  برءت الماءأجر عه جر عاو جرعت بالفتح اخسة أنكرها الاصعى والجرعة بالتحريك واسدة
  لجرع وهى رملة مسة وية لا تنبت شيئا وكذلك الجرعاء والجرع أيضا التواء فى قوّة من قوى
  لحبل ظاهرة على ساير القوى والجرعة من الماهحسوة منه وسصغيردجاء المشل أفلت فلان
  بجر يعة الذقن اذا أشرف على التلف ثم نجا قال الفراهو آخر ما يخرج من النفس ونوق
  مجاريع قليلات اللبن كانه ليس فى ضروعها الاجرع وجرّعه غمص الغيظ فتجرعه أى كظعه
  رشع لجرشع من الابل العظيم ويقال العظيم الصدر المنتفخ الجنبين فال أبوذويب
  يصف الحر
  فسكونه قنه ون وامتربت به * هوجاءهادية وهاد جِرشع
  زع الجزع مصدر جزءت الوادى اذا قطعته عرضا ومنه قول امرئ القيس
  واخرمنهم جازع نجد ك بكب والجزع أيضا الجرزاليمانى وهو الذى فيه بياض
  وسواد تشبه به الاعين والجزع بالمكسر منعطف الوادى والجزعة أيضا لقليل من المال
  والماء وطائفة من الليل يسال جزع لهجزعة من المال أى قطع لهمنه قطعة واجتزعت من
  الشهجرةء ودا اقتطعته واكتسرته والجزع بالتحريك نقيض الصبر وقد جزع من الشى بالكسم
  وأجزعه غيره والجازع الخشبة التى توضع في العريش عرضا يطرح عليه ا قضيان الكرم
  لترفعها عن الارض ولم يعرفه أبوسعيد والجزيعة القطعة من الغنم وجزع السرتجزيعافهو
  مجزع وبسرة مجزعة اذا بلغ الارطاب ثلئيها ⁦(جشع)⁩ الجشع أشد الحرس تقول منه
  حشع بالسكسر وتجشع مثله فه ورجل جشع وقوم جشّعون ومجاشع اسم رجل من تميم وهو
  مجاشع بن دارم بن مالك بن حنظلة بن مالت بن عروبن ة-يم مجع) الجعجعة صوت الرس
  وفى المشل أسمع جمجعة ولا أرى طحنا والجعجعة أموات الهال اذا اجتمعت والجعجمة
  لحبس وكتب عبيد اللّٰه بن زياد الى عمر بن سعد أن جمجع بحسين قال الاصمعى يعنى احبسه
  وقال ابن الأعرابى يعى ضيق علبه قال والجعجع والجعجاع الموضع الضيق الخشن والجعيعة
  التضييقء-لى الغريم فى المطالبة وقال أبو عمر والجعجاج الارض الجدبة وكل أرض جعجاج
  قال الشاءر وباتوا يجعجاع جديب المعرّج ويقال هى الارض الغليظة قال
  أبوقيس بن الاسلت.
  من يذق الحرب يجد طعمها • مزاوتنركه بجهجاج
  وجعجع بهم أى أناخ بهسم وألزمهم الجعجاج وجعجعت الابل أى حرّكتها لاناخة أونهوض
  وجعجع البعيرأى برك واس تناخ وجعجع القوم أى أناخوا وفحل جمجاع أى شديد الرغاء
  وتجعمع أى ضرب بنفه الارض من وجع أصابة قال أبوذؤيب
  فأيدهنّ حتوفهنّ فهارب * بدمائه أوبازك متجعجع
  لع جلعت المرأة بالكسرفهى جلعة وجالعة أيضا أى قالالحياء تتكام بالفحتر وكذلك
  الرجل جلع وجالع ومجالعة القوم مجاوبتهم بالفحس وتنازعهم عند الشرب والقمار قال
  الشاعر
  ولا فاحش عند الشراب مجالع قال الاصمعى جلع توبه وخلعه بعنى وأنشد
  قولا اسجبان أرى نوارا • جالعة عن رأسها الخارا
  والاجلع الذى لا تنضم شفتاه على أسفانه تقول منه جلع فه بالكسر جلعا وكان الاخفش
  ١٤٦
  قال القاموس هذا المثل كتاية
  عمابقى من روحه اى نقه
  صارت فى فيه وقر يبامنه اه.
