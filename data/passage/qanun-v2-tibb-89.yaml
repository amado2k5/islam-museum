text: "… الكسر والجبر. وللأطباء في كسر القحف المنقلع الذي هو المنقلة مذهبان، مذهب من يميل إلى الأدوية الهادئة الساكنة الشديدة التسكين للألم، ومذهب من يرى استعمال الأدوية الشديدة التجفيف، ويستعملون بعد قطع المنكسر وقلع المنقلع وجذب انام بالأدوية الجذّابة من المراهم …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 89، يذكر الطب والطبيب، وأعضاء البدن، وجبر الكسر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 89, that mentions medicine and the physician, the organs of the body, bone-setting, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 89 کا اقتباس جس میں طب اور طبیب، اعضائے بدن، ہڈی جوڑنا، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
