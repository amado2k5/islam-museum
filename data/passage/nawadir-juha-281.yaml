label: { ar: "نوادر جحا الكبرى، ص 138 — «جحا والدب على الشجرة»", en: "Nawadir Juha al-Kubra, p. 138 — 'Juha and the Bear in the Tree'", ur: "نوادر جحا الکبریٰ، ص 138 — «جحا اور درخت پر ریچھ»", fr: "Nawadir Juha al-Kubra, p. 138 — « Juha et l'ours dans l'arbre »", es: "Nawadir Juha al-Kubra, p. 138 — «Juha y el oso en el árbol»", tr: "Juha'nın Büyük Fıkraları, s. 138 — “Juha ve Ağaçtaki Ayı”", id: "Anekdot Hebat Juha, hlm. 138 — “Juha dan Beruang di Atas Pohon”" }
text: "… جحا والدبُّ على الشجرة بينما كان الشيخ يحتطِبُ في الجبلِ رأى دُبّاً عظيماً آتِياً نحوه فخافَ الشيخ خَوْفاً شديداً وصعِدَ إلى الشجرة، وكانت من شجر الكُمِّثرى البريّ، فجاء الدبُّ ونامَ تحتها. فأنتظر الشيخ طويلاً فلم يذهب الدُّبُّ، وخيّم الظلامُ وكانتِ …"
summary:
  ar: "تسلق جحا شجرة إجاص برية هرباً من دب، فتسلقها الدب أيضاً، فصاح جحا إنه لا يريد أن يأكل، فسقط الدب ومات، فسلخه جحا وحمل جلده إلى البلدة متفاخراً. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  en: "Juha climbs a wild pear tree to escape a bear, and the bear climbs too. Juha shouts that he does not want to eat, and the bear falls and dies. Juha skins it and carries the pelt to the town, boasting. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  ur: "جحا ریچھ سے بچنے کے لیے جنگلی ناشپاتی کے درخت پر چڑھتا ہے تو ریچھ بھی چڑھ آتا ہے۔ جحا چلاتا ہے کہ وہ کھانا نہیں چاہتا، تو ریچھ گر کر مر جاتا ہے۔ جحا اس کی کھال اتارتا ہے اور فخر کرتا ہوا کھال شہر لے جاتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  fr: "Juha grimpe dans un poirier sauvage pour échapper à un ours, et l'ours grimpe aussi. Juha crie qu'il ne veut pas manger, et l'ours tombe et meurt. Juha l'écorche et porte la peau en ville en se vantant. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  es: "Juha trepa a un peral silvestre para escapar de un oso, y el oso también trepa. Juha grita que no quiere comer, y el oso cae y muere. Juha lo desuella y lleva la piel al pueblo jactándose. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  tr: "Juha, bir ayıdan kaçmak için yabani bir armut ağacına tırmandı, ama ayı da ağaca tırmandı. Juha, yemek istemediğini bağırdı, bunun üzerine ayı düştü ve öldü. Juha daha sonra ayının derisini yüzdü ve gururla kasabaya geri götürdü. {cite:juha-nawadir-kubra-djuwaydi s. 138}"
  id: "Juha memanjat pohon pir liar untuk melarikan diri dari beruang, tetapi beruang itu juga memanjatnya. Juha berteriak bahwa ia tidak ingin makan, sehingga beruang itu jatuh dan mati. Juha kemudian menguliti beruang itu dan dengan bangga membawa kulitnya kembali ke kota. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
