text: "… اللّٰه بن عبد الله أخبره أَن اين عباس أَخبره أَن رسول اللّٰه، صلّعم، خرج عام الفتح فى رمضان فصام، حتى إذا كان بالكَديد واجتمع النساس إليه أَخد قَعْبًا فشرب منه، ثم قال : أَيْها الناس مَن قبِلَ الرخصة فإن رسول …"
summary:
  ar: "مقطع من الطبقات الكبرى لابن سعد، المجلد المصوَّر 1، ص 26، يرد فيه ذكر الرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sa'd's al-Tabaqat al-Kubra, scan volume 1, p. 26, whose wording mentions the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الطبقات الکبریٰ، ابن سعد، اسکین جلد 1، ص 26 کا اقتباس جس میں رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
