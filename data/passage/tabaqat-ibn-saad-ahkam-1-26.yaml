  tr: "İbn Sa'd'ın *El-Tabakat el-Kübra* adlı eserinin 1. cildinin 26. sayfasında yer alan bir alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahların bir tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Sa'd *Al-Tabaqat al-Kubra*, Jilid 1, halaman 26, menyebutkan keringanan hukuman; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
