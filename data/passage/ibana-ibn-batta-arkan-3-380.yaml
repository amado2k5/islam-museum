text: "… يدي رسول اللّٰه ولِفي، وركبته تمسُّ ركبته، فقال: يا محمد، أخبرني عن الإسلام ؟ فقال رسول اللّٰه اليخ: تشهد أن لا إله إلَّا الله، وأن محمدًا رسول الله، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت إن استطعت إليه سبيلًا. …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 3، ص 380، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 3, p. 380, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 3، ص 380 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe de Ibn Batta, volumen 3, pág. 380, que menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du livre « al-Ibana al-Kubra » d'Ibn Batta (Livre de la Foi), volume 3, page 380, qui mentionne l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage (mentionnés ensemble), ainsi que le témoignage. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 3, s. 380) adlı eserinden bir alıntı; bu alıntıda İslam, namaz, zekât, oruç ve Hac gibi ibadetlerle tanımlanır ve iman ikrarı, namaz ve zekât konuları ele alınır; metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 3 Bergambar, hlm. 380, yang mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
