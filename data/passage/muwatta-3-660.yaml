label: { ar: "الموطأ 660 — مالك: لا زكاة في عشرين ديناراً ناقصة بينة النقصان ولا في مئتي درهم ناقصة", en: "Muwatta 660", es: "Muwatta 660", fr: "Muwatta 660", ur: "موطا 660", tr: "El-Muvatta 660 — Malik: Açıkça eksik olan yirmi dinar için de, eksik olan iki yüz dirhem için de zekât gerekmez.", id: "Al-Muwatta 660 — Malik: Tidak ada zakat yang wajib dibayarkan atas dua puluh dinar yang jelas-jelas kurang, dan juga tidak ada zakat atas dua ratus dirham yang kurang." }
summary:
  ar: "قول لمالك: ليس في عشرين ديناراً ناقصة بينة النقصان زكاة، فإن زادت حتى تبلغ عشرين ديناراً وازنة ففيها الزكاة، وليس فيما دون عشرين ديناراً زكاة؛ وليس في مئتي درهم ناقصة بينة النقصان زكاة، فإن بلغت بزيادتها مئتي درهم وافية ففيها الزكاة؛ فإن كانت تجوز بجواز الوازنة رأى فيها الزكاة، دنانير كانت أو دراهم. ويذكر المحقق أن لفظة «عيناً» في نسخة م ليست في النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.336} {cite:muwatta-maruf-1997 p.337}"
  tr: "Malik şöyle demiştir: Açıkça eksik olan yirmi dinar için zekât gerekmez. Eğer eksik yirmi dinara ulaşırsa, o zaman zekât verilir. Yirmi dinardan az olan hiçbir şey için zekât verilmez. Benzer şekilde, açıkça eksik olan iki yüz dirhem için zekât gerekmez. Eğer eksik iki yüz dirheme ulaşırsa, o zaman zekât verilir. Eğer geçerli bir ağırlığa sahip oldukları kabul edilirse, dinar veya dirhem olsun, zekât verilir. Editör, M el yazmasında geçen \"nakit olarak\" kelimesinin diğer el yazmalarında bulunmadığını ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.336} {cite:muwatta-maruf-1997 s.337}"
  id: "Malik berkata: Tidak ada zakat yang wajib dibayarkan atas dua puluh dinar yang jelas-jelas kurang. Jika jumlahnya bertambah hingga mencapai dua puluh dinar penuh, maka zakat wajib dibayarkan. Tidak ada zakat yang wajib dibayarkan atas jumlah kurang dari dua puluh dinar. Demikian pula, tidak ada zakat yang wajib dibayarkan atas dua ratus dirham yang jelas-jelas kurang. Jika jumlahnya bertambah hingga mencapai dua ratus dirham penuh, maka zakat wajib dibayarkan. Jika dianggap memiliki berat yang sah, maka zakat wajib dibayarkan atasnya, baik itu dinar maupun dirham. Editor mencatat bahwa kata \"dalam bentuk tunai\" dalam manuskrip M tidak ditemukan dalam manuskrip lain, dan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.336} {cite:muwatta-maruf-1997 p.337}"
