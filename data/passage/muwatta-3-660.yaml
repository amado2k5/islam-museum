label: { ar: "الموطأ 660 — مالك: لا زكاة في عشرين ديناراً ناقصة بينة النقصان ولا في مئتي درهم ناقصة", en: "Muwatta 660" }
summary:
  ar: "قول لمالك: ليس في عشرين ديناراً ناقصة بينة النقصان زكاة، فإن زادت حتى تبلغ عشرين ديناراً وازنة ففيها الزكاة، وليس فيما دون عشرين ديناراً زكاة؛ وليس في مئتي درهم ناقصة بينة النقصان زكاة، فإن بلغت بزيادتها مئتي درهم وافية ففيها الزكاة؛ فإن كانت تجوز بجواز الوازنة رأى فيها الزكاة، دنانير كانت أو دراهم. ويذكر المحقق أن لفظة «عيناً» في نسخة م ليست في النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.336} {cite:muwatta-maruf-1997 p.337}"
