text: "الأكل بيمينه، والأكل وشماله في الأرض باب الأكل من بين يديه باب الكبر الأكل متكثاً لعق الأصابع طعام الواحد يكفي الاثنين باب المؤمن يأكل في معاً واحد باب اسم اللّه على الطعام باب القزع أكل الحادم باب النفخ في الطعام …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 5525، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 5525, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 5525 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 1, pág. 5525, que menciona una descripción del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 1, page 5525, contenant une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Musannaf Abd al-Razzaq, Resimli Cilt 1, s. 5525'ten, mümini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 5525, yang menjelaskan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
