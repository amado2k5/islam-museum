text: "الأكل بيمينه، والأكل وشماله في الأرض باب الأكل من بين يديه باب الكبر الأكل متكثاً لعق الأصابع طعام الواحد يكفي الاثنين باب المؤمن يأكل في معاً واحد باب اسم اللّه على الطعام باب القزع أكل الحادم باب النفخ في الطعام …"
summary:
