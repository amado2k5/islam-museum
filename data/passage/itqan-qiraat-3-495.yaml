label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 495 — قراءات القرآن، القراء", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 495 — the readings of the Qur'an; the readers", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 495 — قرآن کی قراءتیں، قراء" }
text: "… مَنْ قَبْلَنا في الحروفِ سنةٌ متبعةٌ، لا يجوز مخالفةُ المصحف الذي هو إمامٌ ولا مخالفةُ القراءات التي هي مشهورة، وإِن كان غيرُ ذلك سائغاً في اللغة أو أظهرَ منها. ثم قال ابنُ الجَزَرِي : ونعني بموافقةِ أحد المصاحف ما كان …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 495، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 495, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 495 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
