text: |-
  •⁦(زأم)⁩
  ٢٩٣
  قوله أان زم تقطيعه فعولن ولا يجوزتسكين العين وكذلك قوله تعالى شهررمضان فيمن
  أخفى انماهو بحركة مختلسة ولا يجوز أن تكون الراء الاولى ساكنة لانّ الهاء قبلها سا كن
  فيؤدى الى المع بين الساكنين فى الوصل من غير أن يكون قبلهماحرف لين وهذا غير
  موجود فى شئ من لغات العرب وكذلك قوله عزوجسل اناضحن نزلنا الذكر وأن لا يهسدى
  ويخصمون وأشباه ذلك ولا معتبربة ول القزاء ان هذا ونحوه مدغم لانهم لا يحصلون هذا
  الباب ومن جمع بين الساكنين فى موضع لا يصح فيه اختلاس الحركة فهو مخطئ كراء تجزة
  فى قوله تعالى فا اسطاءوا لان سين الاستفعال لا يجوز تحريكهابوجه من الوجوه ابن
  الاعراتى روّمت فلانا ورومت بفلان اذاجعلته يطلب الشئ والمرام المطلب ورامة اسم
  موضع بالبادية وفيه جاء المثل • تسألى برامتين شلجما * والنسبة اليه راععة على
  غير قياس وكذلكٌ النسبة الى رام«رمزوه وبلد وان شئت هرمزى والرام ضرب من
  الشجر ورومان بالضم اسم رجل والروم هم من وإد الروم بن عيصويقال رومى" وروممثل
  رنجىّ وزتج فليس بين الواحدوابمع الاالياه المشددة كما قالواترة وتمر ولم يكن بين الواحد
  والجمع الاالهاء ⁦(رهم)⁩ الرهمة بالسكسر المطرة الضعيفة الدائمة والمع رهم ورهام
  وروضة مرهومة قال أبو زيدومن الديمة الرهمة وهى أشدوقعا من الديمة وأسرع ذهابا
  وأرهمت السحابة أنت بالرهام ونزلنا بفلان فكنا فى أرهم جانيه أى أخصبهما ورهم
  بالضم اسم امرأة والمرهم الذى يوضع على الجراحات معترب ⁦(ريم)⁩ رامهبريه ريما
  أى برحه بقال لاترمه أى لا تبرحه وقال
  فألقى التهامى منهما بلطاته • وأحلط هذا لا أريم .كانيا
  ويقال رمت فلاناورمت من عندة لان بمعنى وقال
  أبانا فلارحت من عندنا • قانابخير اذالم ترم
  أى لابرحت والريم عظم يبقى بعد ما يقسم الجزور وأنشدابن السكيت
  وكنتم كعظم الريم لم يدر بازر * على أى بدأى مقسم اللحم يوضع
  وغير يعقوب يزويه يجعل وقال ابن الاعرابة الريم القبر وقال
  اذامت فاعمادى التبوروسلى • على الريم أسقيت الغمام الغواديا
  والريم الدرجة لغة يممانيسة حكاها أبوع روبن العلاء والريم الزيادة والفضل يقال اهذاعلى
  مذاريم قال العجاج
  والعصر قبل هذه العصور • مجرّسات غزة الغرير • بالزجر والريم على المزجور
  أى من زجر فعليه الفضل أبدالانه انمايز جو عن أمر قصر فيه ويقال قدبق ديم من النهار
  وهى الساعسة الطويلة وريم بالرجل اذاقطع به وقال* وريم بالساقى الذى كان منى •ابن
  السكيت ريم فلان بالمكان تريما أقام به ورين السحابة فأغضنت اذا دامت فلم تقلع وقريم
  -وضع وقال• بتلاع تريم هامهم لم تقبره أبو عمر وفريم مفعل من رام يريم
  صل الزاى أم الزأمة الصوت الشديد والزأمة شدة الاكل والشرب وقال
  ما الشرب الازأمات فالصدره وزتم به بالكسراذاصاح به وزثم أى ذءر على سالم يسم تقاعله
  صماح نى
