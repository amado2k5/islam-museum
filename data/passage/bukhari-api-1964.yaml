label: { ar: "صحيح البخاري 1964 — الأب والأبوة", en: "Sahih al-Bukhari 1964 — the father and fatherhood", ur: "صحیح بخاری 1964 — باپ اور والدیت", es: "Sahih al-Bukhari 1964 — El padre y la paternidad", fr: "Sahih al-Bukhari 1964 — le père et la paternité" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، وَمُحَمَّدٌ، قَالاَ أَخْبَرَنَا عَبْدَةُ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ نَهَى رَسُولُ اللَّهِ عَنِ الْوِصَالِ، رَحْمَةً لَهُمْ فَقَالُوا إِنَّكَ تُوَاصِلُ. قَالَ \" إِنِّي لَسْتُ كَهَيْئَتِكُمْ، إِنِّي يُطْعِمُنِي رَبِّي وَيَسْقِينِ \". قَالَ أَبُو عَبْدِ اللَّهِ لَمْ يَذْكُرْ عُثْمَانُ رَحْمَةً لَهُمْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1964، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1964 (Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1964، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1964 (El ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1964 (Le jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
