text: "… قالِ : وَفِي الْبَابِ عنْ أَبِي مُوسَى. قَالَ أَبُو عِيسَى: سَمِعْتُ صَالِحَ بنَ محمدٍ التَّرْمِذِيَّ قال: سَمِعْتُ أَبَا مُقَاتِلٍ السَّمَرْ قَنْدِيَّ يَقولُ: دَخَلْتُ عَلَى أَبِي حنِيفَةَ في مَرَضِهِ الَّذِي مَاتَ فِيهِ، فَدَعَا بِمَاءٍ فَتَوَضَّأَ وَعَلَيْهِ جَوْرَبَانٍ، أَنَ أقعَةَ: امَعْت عَلَى …"
