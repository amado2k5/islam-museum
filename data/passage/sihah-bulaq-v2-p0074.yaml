text: |-
  ٥١٣
  وربماقيل للرجل الكثير الشعر أعنى وللاحق الثقيل أعنى وللعجوز عنواء والعثيان بالسكسم
  الضبعان عجا) عجت الام ولدها تعجوه عجوا اذاسقته اللبن والعجىّ الذى تموت أمّه
  فبربيه صاحبه بلبن غيرها والانى عجية قال الشاعر
  عدانى أن أزوركك أنّ بهمى • مجاياكلها الاقليلا
  والعجوة ضرب من أجود التمر بالمدينة ونخلتها تسمى لبنة وعاجيت الصبىّ اذا أرضعقه بلبن
  غير أمه أو منعته اللبن وغذيته بالطعام قال الجعدى
  اذاشئت أيصرت من عقبهم * يتامى يعاجون كالاذوب
  وافى فلان ماعجه أى اق شدة ولقاه اللّٰه ماعجاه وماعظاء أى ماساءه وبقال الفجى الجلود
  اليابسة تطبخ وتؤصكل الواحدة عمية وقال
  ومعصب قطع الشناء وقوته • أكل الهجى وتكسب الاشكاد
  والهجايسان عصبتان فى باطن يدى الفسرس وأسفل منهسماهنات كأنها الاظفارتسمى
  السعدانات ويقال كل عصب يتصل بالخاف رفهو عجاية قال الراجز
  : وحافر صلب الهجى مدملق * وساق هيق أنفها معرّق
  الاصمعى" العجاية والعجاوة لغتان و«ما قدر مضغة من لحم تكون «وصولة بعصبة تتحدر من
  ركبة البعير الى الفرسن دا) العسد وضدّ الولىّ وابهع الاعداء وهو وصف ولسكنه
  ضارع الاسم : قال عدوبين العداوة والمعاداة والاتى عدوّة قال اب السكيت فعول اذا كان
  فى تأويل فاعل كان مؤنثه بغيرهاء نحورجل صبوروامرأة صبور الاحرفا واحداجاء نادرا
  قالواهذه عدوّة اللّٰه قال الفراء وانما أدخلوا فيها الهاءنشيهما لها بصديقه لان الشني قديدن
  على ضدّه والعد ابكسر العين الاعداه وهوجسع لا نظير له قال ابن السكيت ولم يأت فعل فى
  النعوت الاحرف واحسد يقال هؤلا قوم عدا أى غرباء وقوم عدا أى أعداء وأنشد
  لسعدين عبدالزحن من حسان.
  اذا كنت فى قوم عدا لست منهم * فكل ماعلفت من خبيث وطيب
  قال ويقال قوم عداوعدا أى أعداءمثل سوى وسوى قال الاخطل
  ألا يا اسلى ياهند هندبى بدر * وان كان حيانا عد اآخر الدهر
  يروى بالضم والكسر وقال ثعلب بقسال قوم أعداء وعدابكسر العين فان أدخات الهنا.
  الت عداة بالضم والعادى العدة قالت امرأة من العسرب أشمت رب العالمين عاديك
  ونعادى القوم من العداوة وتعادى ما ينهم أى فسد وتعادى ساعد قال الاعنى بصف
  ظبية وغزالها وتعادى عنه النهارفا • تعجوه الاعفافة أوفواف
  يقول تساعد عن ولدها فى المرعى لثلايستدل الذتب بهاعلى ولدها والعداء بالمكسر والمد
  الموالاة بين الصيدين تصرع أحده_ماعلى ائر الآخر فى طلق واحسد قال أمر والقيس
  فعادى عداء بين تورونهجة * درا كاولم ينضح بماء فيغسل
  والعداء بالفتح والمذ طواركل شوهوما انقاد معه من عرضه وطوله والعداء أيضاتجاوز
  الحدّوالظلم بقال عداعليه عدوا وعدوا وعداء ومنه قوله تعالى فيسبوا اللّٰه عدوا بغير علم
