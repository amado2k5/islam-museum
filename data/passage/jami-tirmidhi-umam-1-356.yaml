text: "… قَالَ : إِذَا أَرْسَلْتَ كَلْبَكَ وذَكَرْتَ اسْمَ اللهِ عَلَيْهِ فَأَمْسَكَ عَلَيْكَ فَكُلْ. قُلْتُ: وإِنْ قَتَلَ؟ قَالَ: وإِنْ قَتَلَ. قُلْتُ: إِنَّا أَهْلُ رَهْي قَالَ: مَا رَدَّتْ عَلَيْكَ قَوْسُكَ فَكُلْ. قَالَ: قُلْتُ: إِنَّا أَهْلُ سَفَرٍ نَمُرُّ بِالْيَهُودِ والنَّصَارَى والمَجُوسِ فَلَا نَجِدُ غَيْرَ …"
summary:
