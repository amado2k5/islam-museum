text_search: "ولله الأسماء الحسنى فادعوه بها ۖ وذروا الذين يلحدون في أسمائه ۚ سيجزون ما كانوا يعملون"
translations:
  en: { text: "Allah's are the fairest names. Invoke Him by them. And leave the company of those who blaspheme His names. They will be requited what they do.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور خدا کے سب نام اچھے ہی اچھے ہیں۔ تو اس کو اس کے ناموں سے پکارا کرو اور جو لوگ اس کے ناموں میں کجی اختیار کرتے ہیں ان کو چھوڑ دو۔ وہ جو کچھ کر رہے ہیں عنقریب اس کی سزا پائیں گے", translator: "Fateh Muhammad Jalandhari", license: PD }
