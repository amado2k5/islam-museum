text: "… : أي تفرّقت كلمتهم. أو ذهب عزّهم. القاموس المحيط في المغازي وإن قدمت. في المغازي للواقدي عيينة بن حصن. الفرائض: جمع فريضة؛ وهو البعير المأخوذ في الزكاة، سمى فريضة لأنه فرض واجب على رب المال."
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 3، ص 607، يرد فيه ذكر الفريضة والفرائض، والفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 3, p. 607, whose wording mentions the obligation (farida), the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 3، ص 607 کا اقتباس جس میں فریضہ اور فرائض، فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
