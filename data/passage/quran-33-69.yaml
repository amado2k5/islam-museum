text_search: "يا أيها الذين آمنوا لا تكونوا كالذين آذوا موسى فبرأه الله مما قالوا ۚ وكان عند الله وجيها"
translations:
  en: { text: "O ye who believe! Be not as those who slandered Moses, but Allah proved his innocence of that which they alleged, and he was well esteemed in Allah's sight.", translator: "Marmaduke Pickthall", license: PD }
