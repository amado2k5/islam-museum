text: |-
  قوله قال أبوزيد فى بعض النسخ
  أبو عبيدوس
  ١ ف تسعة زيادة أوص بن عجر
  ٢٩٢
  قال ما أدرى ما الرقيم أكتاب أم ينيان ⁦( ركم)⁩ ركم الشى يركه اذا بجعه وألتى بعضه على
  بعض وارتكم الشئوزاكم اذا اجتمع والركة الطين الجموع والركام الرمل المتراكم وكذلك
  السصاب المتراكم وما أشبه، ومر قكم الطريق يفتح الكاف جادته ⁦(رمم)⁩ ريت الشئء
  أرقه وأره رما ومرمة اذا أصلته يقال قدرمّ شأنه ورمّه أيضابعنى أكله وفى الحديث
  البة وترمّ من كل شجر وفى حديب عروة بن الزبير حيز ذكر أحيحة بن الجلاح وقول أخو اله فيه
  كا أهل ته ورته حتى استوى على عممه قال أيوزيد هكذا يحدنونه بالضمّ والوجه فيهته
  ورمّه بالفتح والثمّ من الاصلاح والرمّ من الاكل واسترمّ الهائط أى حان له أن يرمّ وذلك اذا
  بعد عهده بالتطيين والمرمّة بالسكسرشفة البقرة وكل ذات ظلف لانها بها تأكل والمرة بالنتح
  لغة فيه وارت الشاة من الارض أى رمّت وأكات ومالى منه حمّ ولاومّ أى بدّ وقد يضمان
  ويقال أيضاماله حمّ ولارمأى ليس له شئ قال ابن السكيت بقال ماله ثم" ولارم ومايملك
  شاولارمًا قال قارمّ مرقة البيت والرمّة قطعة من الحبل باليسة والجمع دحم ورمام وبهاسمى
  ذوالرمة لقوله • أشعث ياقى رمّة التقليد يعنى وتدا ومنه قولهم دفع إليه الشى برتته
  وأصله أنّ رحلاد فع الى رجل بعيرا يحبل فى عنقه فقيل ذلك لسكل من دفع شيأبجملته وهذا
  المعنى أراد الأعشى يخاطب خارا
  فقلت له هذههاتها • بأدماه فى حبل مقتادها
  والرمّة بالكسر العظام البالية والممع رحم ورمام تقول منه ومّ العظم يرم بالكسر دمّة أى
  بلى فهورميم وانما قال تعالى تقال من يحي العظام وهى رميم لات فعيلا وفعولاقد يستوى
  فيه-ما المذكر والمؤنت والمع مثل رسول وعد وومديق والرم" بالكسر الغرى بقال جاءه
  بالطمّ والرمّ اذاجاءه بالمال الكثير والرمّ أيضا النق والمخ تقول منه أرم العظم أى جرى فيه
  ارمّ وقال شجاهنْ لما أن أرمّت ،ظامه * ولوكان فى الأعراب مات هزالا
  قال أبو زيدناقسة حرتم بهاشئ من نق ونعجة رماء بيضاء ويقال للشاة اذا كانت مهزولة
  ما يرم منها مضرب أى اذا كسر عظسم من عظامها لم يصب فيه مخ وأرمّ الة وم أى سكنوا
  وقال يردن والليل مرم طائره * وترحر م اذا حترك فاه للسكلام وقال ٢
  ومستعجب ممارى من أناتنا • ولوزينته الحرب لم يترمرم
  والر مرام ضرب من الشجر وحشيش الربيع وارمامموضع وبرحرم جبل ودبما قالوا يللم
  ( رنم الرنم بالتحريك الصوت وقدونم بالسكسر وتر نم اذا رجع صوته والترنيم متله وترنم
  الطائر فى هديره وترنم القوص عند الانساض والترنموت الترنم زادوافيه الواووالماء كمازادوا
  فى ملكوت قال أبو تزاب أنشدنى الغنوفى القوس
  تجاوب الصوت بترغوتها • تستخرج الحبة من تابوتها
  يعنى حبة القلب من الجوف وم) رمت الشى أرومه روما اذاطلبته وروم الحركة الذى
  ذكره سيبويه هى حركة مختلسة محتفاة اضرب من التخفيف وهى أكثر من الاشمام لانها
  تصمع وهى جزنة الحركة وان كانت مختلسة مثل همزة بين بين كما قال
  أارزتم أبحال وفارق جيرة • وصاح غراب البين أنت حرين
