label: { ar: "الموطأ 2412 — نافع: عبد ابن عمر سرق وهو آبق فأبى سعيد بن العاص أن يقطعه", en: "Muwatta 2412", es: "Muwatta 2412", fr: "Muwatta 2412", ur: "موطا 2412", tr: "El-Muvatta 2412 — Nafi’: İbn Ömer kaçak haldeyken kölesi hırsızlık yaptı ve Sa’id ibn al-‘As onun elini kesmeyi reddetti.", id: "Al-Muwatta 2412 — Nafi’: Budak Ibnu Umar mencuri ketika ia melarikan diri, dan Sa’id ibn al-‘As menolak untuk memotong tangannya." }
summary:
  ar: "يروي مالك عن نافع أن عبدا لعبد الله بن عمر سرق وهو آبق، فأرسل به عبد الله بن عمر إلى سعيد بن العاص، وهو أمير المدينة، ليقطع يده. فأبى سعيد أن يقطع يده، وقال: لا تُقطع يد الآبق إذا سرق. فقال له ابن عمر: في أي كتاب الله وجدت هذا؟ ثم أمر به ابن عمر فقطعت يده. {cite:muwatta-maruf-1997 p.396}"
  tr: "Malik, Nafi'den rivayetle, Abdullah ibn Umar'ın bir kölesinin kaçarken hırsızlık yaptığını anlatır. Abdullah ibn Umar, elini kestirmek için onu Medine valisi Sa'id ibn al-As'a gönderdi. Sa'id, \"Kaçan bir köle hırsızlık yaparsa eli kesilmez\" diyerek elini kesmeyi reddetti. İbn Umar ona, \"Bunu Allah'ın hangi kitabında buldun?\" diye sordu. Bunun üzerine İbn Umar, elinin kesilmesini emretti. {cite:muwatta-maruf-1997 s.396}"
  id: "Malik meriwayatkan dari Nafi’ bahwa seorang budak Abdullah ibn Umar mencuri saat melarikan diri. Abdullah ibn Umar mengirimnya kepada Sa’id ibn al-As, gubernur Madinah, untuk dipotong tangannya. Sa’id menolak untuk memotong tangannya, dengan mengatakan, “Tangan seorang budak yang melarikan diri tidak akan dipotong jika ia mencuri.” Ibn Umar bertanya kepadanya, “Dalam Kitab Allah manakah kamu menemukan hal ini?” Kemudian Ibn Umar memerintahkan agar tangannya dipotong. {cite:muwatta-maruf-1997 p.396}"
