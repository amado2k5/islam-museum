label: { ar: "الموطأ 2412 — نافع: عبد ابن عمر سرق وهو آبق فأبى سعيد بن العاص أن يقطعه", en: "Muwatta 2412" }
summary:
  ar: "يروي مالك عن نافع أن عبدا لعبد الله بن عمر سرق وهو آبق، فأرسل به عبد الله بن عمر إلى سعيد بن العاص، وهو أمير المدينة، ليقطع يده. فأبى سعيد أن يقطع يده، وقال: لا تُقطع يد الآبق إذا سرق. فقال له ابن عمر: في أي كتاب الله وجدت هذا؟ ثم أمر به ابن عمر فقطعت يده. {cite:muwatta-maruf-1997 p.396}"
