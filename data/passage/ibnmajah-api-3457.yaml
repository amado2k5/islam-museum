label: { ar: "سنن ابن ماجه 3457 — السنا والسنوت، الداء", en: "Sunan Ibn Majah 3457 — senna and sannut; the disease and its remedy", ur: "سنن ابن ماجہ 3457 — سنا اور سنوت، بیماری" }
text: "… قَدْ صَلَّى مَعَ رَسُولِ اللَّهِ ـ الْقِبْلَتَيْنِ يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" عَلَيْكُمْ بِالسَّنَى وَالسَّنُّوتِ فَإِنَّ فِيهِمَا شِفَاءً مِنْ كُلِّ دَاءٍ إِلاَّ السَّامَ. قِيلَ يَا رَسُولَ اللَّهِ وَمَا السَّامُ قَالَ \" الْمَوْتُ \". قَالَ عَمْرٌو قَالَ ابْنُ أَبِي عَبْلَةَ السَّنُّوتُ الشِّبِتُّ. وَقَالَ آخَرُونَ بَلْ هُوَ الْعَسَلُ الَّذِي يَكُونُ فِي زِقَاقِ السَّمْنِ وَهُوَ قَوْلُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3457، يذكر السنا والسنوت، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3457 (Chapters on Medicine), that mentions senna and sannut, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3457، جس میں سنا اور سنوت، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
