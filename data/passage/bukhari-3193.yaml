label:
  ar: "البخاري 3193 — كذبني ابن آدم وشتمني"
  en: "Bukhari 3193 — The son of Adam denied Me and reviled Me"
  ur: "بخاری 3193 — ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا"
text: "يقول الله شتمني ابن آدم وما ينبغي له أن يشتمني، وتكذبني وما ينبغي له، أما شتمه فقوله إن لي ولدا. وأما تكذيبه فقوله ليس يعيدني كما بدأني ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3193: كذبني ابن آدم وشتمني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3193: The son of Adam denied Me and reviled Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3193: ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
