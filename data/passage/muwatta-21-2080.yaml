label: { ar: "الموطأ 2080 — مالك: بلغه أن سعيد بن المسيب سئل عن الشفعة هل فيها من سنة، فقال: نعم، الشفعة في الدور والأرضين، ولا تكون إلا بين الشركاء", en: "Muwatta 2080", es: "Muwatta 2080", fr: "Muwatta 2080", ur: "موطا 2080", tr: "Al-Muwatta 2080 — Malik: Said bin el-Musayyab'a ön alım hakkı hakkında, bununla ilgili bir sünnet olup olmadığı sorulmuş ve o da şöyle demiş: Evet, ön alım hakkı evler ve arsalar için geçerlidir ve sadece ortaklar arasında uygulanır.", id: "Al-Muwatta 2080 — Malik: Sampai kepadanya bahwa Saeed bin Al-Musayyab ditanya tentang hak prioritas pembelian, apakah ada sunnah mengenainya, dan beliau menjawab: Ya, hak prioritas pembelian berlaku untuk rumah dan tanah, dan hanya berlaku antara para mitra." }
summary:
  ar: "قال مالك: إنه بلغه أن سعيد بن المسيب سئل عن الشفعة، هل فيها من سنة؟ فقال: نعم، الشفعة في الدور والأرضين، ولا تكون إلا بين الشركاء. قال مالك: وعلى ذلك السنة التي لا اختلاف فيها عندنا. {cite:muwatta-maruf-1997 p.252}"
  tr: "Malik şöyle dedi: Sa'id ibn al-Musayyab'a ön alım hakkı (şuf'ah) hakkında, bununla ilgili bir sünnet olup olmadığı sorulmuş. O da şöyle cevap vermiş: Evet, ön alım hakkı evler ve araziler için geçerlidir ve sadece ortaklar arasında uygulanır. Malik dedi ki: Bu, aramızda ihtilaf bulunmayan bir sünnettir. {cite:muwatta-maruf-1997 s.252}"
  id: "Malik berkata: Sampai kepadanya bahwa Sa'id bin al-Musayyab ditanya tentang hak prioritas pembelian (shuf'ah), apakah ada Sunnah mengenainya. Beliau menjawab: Ya, hak prioritas pembelian berlaku untuk rumah dan tanah, dan hanya berlaku antara mitra. Malik berkata: Inilah Sunnah yang tidak ada perselisihan di antara kita. {kutipan:muwatta-maruf-1997 hlm. 252}"
