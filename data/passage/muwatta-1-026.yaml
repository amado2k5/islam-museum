ref: "1.26"
label: { ar: "الموطأ 26 — النوم عن الصبح بطريق مكة وقصة بلال", en: "Muwatta 26" }
text: "فإذا رقد أحدكم عن الصلاة أو نسيها ثم فزع إليها فليصلها كما كان يصليها في وقتها"
summary:
  ar: "يرويه مالك عن زيد بن أسلم مرسلاً، في باب النوم عن الصلاة: نزل النبي ليلةً في طريق مكة ووكّل بلالاً أن يوقظهم للصلاة، فنام بلال وناموا حتى طلعت الشمس، ففزعوا، فأمرهم أن يركبوا حتى يخرجوا من ذلك الوادي وقال إن به شيطاناً، ثم أمرهم أن ينزلوا ويتوضؤوا، وأمر بلالاً فأقام، فصلى بالناس، ثم طمأنهم بأن الله قبض أرواحهم ولو شاء لردها في غير ذلك الحين، وأن من رقد عن الصلاة أو نسيها فليصلها إذا فزع إليها كما كان يصليها في وقتها. ثم أخبر أبا بكر أن الشيطان أتى بلالاً وهو قائم يصلي فأضجعه وهدّأه كما يُهدّأ الصبي حتى نام، وأخبر بلال بمثل ذلك، فقال أبو بكر: أشهد أنك رسول الله. وينقل المحقق عن ابن عبد البر أنه لم يسنده عن زيد أحد من رواة الموطأ، وأن معناه جاء متصلاً مسنداً «من وجوه صحاح ثابتة» رواها جماعة من الصحابة في نومه عن صلاة الصبح في سفره (التمهيد 5/204). {cite:muwatta-maruf-1997 p.46} {cite:muwatta-maruf-1997 p.47}"
