label: { ar: "الموطأ 26 — النوم عن الصبح بطريق مكة وقصة بلال", en: "Muwatta 26", es: "Muwatta 26", fr: "Muwatta 26", ur: "موطا 26", tr: "Al-Muwatta 26 — Mekke yolunda sabahı uyuyarak geçirmek ve Bilal'in hikayesi", id: "Al-Muwatta 26 — Tertidur hingga pagi hari dalam perjalanan ke Mekah dan kisah Bilal" }
text: "فإذا رقد أحدكم عن الصلاة أو نسيها ثم فزع إليها فليصلها كما كان يصليها في وقتها"
summary:
  ar: "يرويه مالك عن زيد بن أسلم مرسلاً، في باب النوم عن الصلاة: نزل النبي ليلةً في طريق مكة ووكّل بلالاً أن يوقظهم للصلاة، فنام بلال وناموا حتى طلعت الشمس، ففزعوا، فأمرهم أن يركبوا حتى يخرجوا من ذلك الوادي وقال إن به شيطاناً، ثم أمرهم أن ينزلوا ويتوضؤوا، وأمر بلالاً فأقام، فصلى بالناس، ثم طمأنهم بأن الله قبض أرواحهم ولو شاء لردها في غير ذلك الحين، وأن من رقد عن الصلاة أو نسيها فليصلها إذا فزع إليها كما كان يصليها في وقتها. ثم أخبر أبا بكر أن الشيطان أتى بلالاً وهو قائم يصلي فأضجعه وهدّأه كما يُهدّأ الصبي حتى نام، وأخبر بلال بمثل ذلك، فقال أبو بكر: أشهد أنك رسول الله. وينقل المحقق عن ابن عبد البر أنه لم يسنده عن زيد أحد من رواة الموطأ، وأن معناه جاء متصلاً مسنداً «من وجوه صحاح ثابتة» رواها جماعة من الصحابة في نومه عن صلاة الصبح في سفره ⁦(التمهيد 5/204)⁩. {cite:muwatta-maruf-1997 p.46} {cite:muwatta-maruf-1997 p.47}"
  id: "Malik meriwayatkannya dari Zaid bin Aslam, dalam hadits mursal, dalam surah tentang tertidur saat shalat: Nabi (shalawat dan salam kepadanya) berhenti suatu malam di jalan menuju Mekah dan mempercayakan Bilal untuk membangunkan mereka untuk shalat. Bilal tertidur, dan mereka tertidur hingga matahari terbit. Mereka terkejut, lalu beliau memerintahkan mereka untuk menaiki kuda mereka hingga meninggalkan lembah itu, seraya mengatakan bahwa ada setan di sana. Kemudian beliau memerintahkan mereka untuk turun dari kuda dan berwudhu. Kemudian beliau memerintahkan Bilal untuk memimpin shalat berjamaah, dan beliau meyakinkan mereka bahwa Allah telah mengambil jiwa mereka, dan jika Dia menghendaki, Dia dapat mengembalikannya di lain waktu. Beliau mengatakan kepada mereka bahwa siapa pun yang tertidur saat shalat atau lupa shalat hendaknya melaksanakannya ketika mereka terkejut, sebagaimana mereka akan melaksanakannya pada waktu yang telah ditentukan. Kemudian beliau memberi tahu Abu Bakar bahwa setan telah datang kepada Bilal ketika ia sedang berdiri shalat, dan telah menidurkannya, seperti menidurkan anak kecil. Dia mengatakan hal yang sama kepada Bilal, dan Abu Bakr berkata, \"Aku bersaksi bahwa engkau adalah Rasulullah.\" Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa tidak ada satu pun perawi al-Muwatta' yang meriwayatkannya dari Zaid, dan bahwa maknanya datang dengan rantai periwayatan yang berkelanjutan \"dari sumber-sumber yang sahih dan terpercaya\" yang diriwayatkan oleh sekelompok Sahabat mengenai tidurnya saat shalat subuh selama perjalanannya (al-Tamhid 5/204). {cite:muwatta-maruf-1997 p.46} {cite:muwatta-maruf-1997 p.47}"
