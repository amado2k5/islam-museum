label: { ar: "سنن أبي داود 2093 — اليتيم وفقد الأب", en: "Sunan Abi Dawud 2093 — the orphan and the father lost", ur: "سنن ابی داؤد 2093 — یتیم اور باپ کی موت", es: "Sunan Abi Dawud 2093 — el huérfano y el padre perdido", fr: "Sunan Abi Dawud 2093 — L'orphelin et le père perdus", tr: "Sunan Abi Dawud 2093 — Yetim ve Babasının Kaybı", id: "Sunan Abi Dawud 2093 — Anak Yatim dan Kehilangan Ayah" }
text: "… بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، - الْمَعْنَى - حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" تُسْتَأْمَرُ الْيَتِيمَةُ فِي نَفْسِهَا فَإِنْ سَكَتَتْ فَهُوَ إِذْنُهَا وَإِنْ أَبَتْ فَلاَ جَوَازَ عَلَيْهَا \". وَالإِخْبَارُ فِي حَدِيثِ يَزِيدَ. قَالَ أَبُو دَاوُدَ وَكَذَلِكَ رَوَاهُ أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ وَمُعَاذٌ عَنْ مُحَمَّدِ بْنِ عَمْرٍو."
summary:
  ar: "حديث في سنن أبي داود، رقم 2093، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2093 (Marriage (Kitab Al-Nikah)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2093، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2093 (Matrimonio (Kitab Al-Nikah)), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un hadith du Sunan Abi Dawud, n° 2093 (Le Mariage (Kitab Al-Nikah)), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sunan Ebu Davud'da yer alan 2093 numaralı hadiste yetimlerden ve babasızlık durumundan bahsedilir. Bu hadis, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinleri içeren \"İslam'da Babalık\" bölümü tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2093, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Hadits ini dikompilasi oleh bagian \"Kebapakan dalam Islam\", yang mencakup teks-teks terkait dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
