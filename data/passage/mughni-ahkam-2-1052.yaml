text: "… استباح كل ما يباح بالتيمم... إن بقى من محل الفرض شىء لم يصله التراب... إذا أحرم بفريضة ثم نوى نقلها إلى فريضة أخرى، يطلت الأولى... لا فرق فى ستر العورة بين الفرض والنقل... يستحب أن يقضى ركعتى الفجر قبل الفريضة …"
