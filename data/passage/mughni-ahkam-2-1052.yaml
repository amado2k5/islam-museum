text: "… استباح كل ما يباح بالتيمم... إن بقى من محل الفرض شىء لم يصله التراب... إذا أحرم بفريضة ثم نوى نقلها إلى فريضة أخرى، يطلت الأولى... لا فرق فى ستر العورة بين الفرض والنقل... يستحب أن يقضى ركعتى الفجر قبل الفريضة …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 2، ص 1052، يرد فيه ذكر الفريضة والفرائض، والفرض، والمستحب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 2, p. 1052, whose wording mentions the obligation (farida), the obligatory (fard), the recommended (mustahabb), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 2، ص 1052 کا اقتباس جس میں فریضہ اور فرائض، فرض، مستحب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 2, p. 1052, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), le recommandé (mustahabb), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
