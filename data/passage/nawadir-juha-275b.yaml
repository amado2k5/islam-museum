text: "نوادر جحا الكبرى وأخيراً أتَّفقوا على أن يستشيروا الشيخ نصر الدين جحا، فبعثوا إليه فجاءهم. وعرضوا عليه ما هم فيه. فتروَّى قليلاً ثُمَّ أجابهم: أتركوا لي المسألة. فقالوا: وما تنوي أن تعمله؟ فقال سأَباحث هذا العالم فإذا أجبته بجواب موافق …"
summary:
  ar: "تواصل جحا والفيلسوف بالإشارات، فقال جحا إن الفيلسوف كان جائعاً وفي ذهنه صحن أرز وفستق، وإنه لم يتناول سوى بيضة واحدة في الفطور، ومُدح الفيلسوف عالماً، وكافأ تيمور جحا بسخاء، وسأل أحد رجال البلاط ما جرى، فقال جحا إن الفيلسوف كان جائعاً مثله. ويقال إن الفيلسوف يتحدث عن مفكرين يونانيين وإسرائيليين. {cite:juha-nawadir-kubra-djuwaydi p. 133}"
  en: "Juha and the philosopher communicate by signs. Juha says the philosopher was hungry and had a dish of rice and pistachio in mind, and that he himself had had only one egg for breakfast. The philosopher is praised as a learned man and Timur rewards Juha generously. A courtier asks what passed, and Juha says the philosopher was only hungry like him. The philosopher is said to speak of Greek and Israelite thinkers. {cite:juha-nawadir-kubra-djuwaydi p. 133}"
  ur: "جحا اور فلسفی اشاروں میں بات کرتے ہیں۔ جحا کہتا ہے کہ فلسفی بھوکا تھا اور اس کے ذہن میں چاول اور پستے کا ایک تھال تھا، اور یہ کہ اس نے خود ناشتے میں صرف ایک انڈا کھایا تھا۔ فلسفی کو عالم کہہ کر سراہا جاتا ہے اور تیمور جحا کو فراخ دلی سے انعام دیتا ہے۔ ایک درباری پوچھتا ہے کہ کیا ہوا تھا تو جحا کہتا ہے کہ فلسفی اسی کی طرح صرف بھوکا تھا۔ کہا جاتا ہے کہ فلسفی یونانی اور اسرائیلی مفکرین کا ذکر کرتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 133}"
  fr: "Juha et le philosophe communiquent par signes. Juha dit que le philosophe avait faim et songeait à un plat de riz et de pistaches, et que lui-même n'avait pris qu'un œuf au petit-déjeuner. Le philosophe est loué comme un savant et Timur récompense généreusement Juha. Un courtisan demande ce qui s'est passé, et Juha dit que le philosophe avait seulement faim, comme lui. On dit que le philosophe parle de penseurs grecs et israélites. {cite:juha-nawadir-kubra-djuwaydi p. 133}"
  es: "Juha y el filósofo se comunican por señas. Juha dice que el filósofo tenía hambre y pensaba en un plato de arroz con pistacho, y que él mismo solo había tomado un huevo en el desayuno. El filósofo es elogiado como sabio y Timur recompensa generosamente a Juha. Un cortesano pregunta qué pasó, y Juha dice que el filósofo solo tenía hambre, como él. Se dice que el filósofo habla de pensadores griegos e israelitas. {cite:juha-nawadir-kubra-djuwaydi p. 133}"
