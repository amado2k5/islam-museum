text: "… أحدهما : الزجرُ عن ضدّه، والآخرُ : أمرُ ندبٍ وإرشاد. النوع الحادي والمائة : الزجر عن الشيء الذي كان مباحاً في كل الأحوال، ثم زُجر عنه بالنسخ في بعض الأحوال، وبقي الباقي على حالته، مباحاً في سائر الأحوال."
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 2، ص 86، يرد فيه ذكر المندوب، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 2, p. 86, whose wording mentions the recommended (mandub), the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 2، ص 86 کا اقتباس جس میں مندوب، مباح، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 2, p. 86, dont le texte mentionne le recommandé (mandub), le permis (mubah), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 2, p. 86, cuyo texto menciona lo recomendado (mandub), lo permitido (mubah), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, 2. Cilt, 86. sayfadan, tavsiye edilen, caiz ve müstehap olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Bu bölüm, farz, tavsiye edilen ve müstehap olan amellerin yanı sıra mekruh edilen, yasaklanan ve küçük günahları da kapsayacak şekilde bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Volume 2, halaman 86, yang menyebutkan amalan yang dianjurkan, diperbolehkan, dan diinginkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, dianjurkan, dan diinginkan, serta dosa yang tidak disukai, dilarang, dan dosa kecil."
