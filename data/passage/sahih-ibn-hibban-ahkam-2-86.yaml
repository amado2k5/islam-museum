text: "… أحدهما : الزجرُ عن ضدّه، والآخرُ : أمرُ ندبٍ وإرشاد. النوع الحادي والمائة : الزجر عن الشيء الذي كان مباحاً في كل الأحوال، ثم زُجر عنه بالنسخ في بعض الأحوال، وبقي الباقي على حالته، مباحاً في سائر الأحوال."
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 2، ص 86، يرد فيه ذكر المندوب، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 2, p. 86, whose wording mentions the recommended (mandub), the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
