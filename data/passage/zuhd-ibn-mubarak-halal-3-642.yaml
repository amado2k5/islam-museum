text: "… فسره مجاهد فقال : أخلص له إخلاصا. وهو تفسير معنى وإلا فأصل التبتل الانقطاع والمعنى انقطع إليه انقطاعا. والخصاء للإشارة إلى أن الذى يكره من التبتل هو الذى يفضى إلى التنطع وتحريم ما أحله الله وليس التبتل من أصله مكروها …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 642، يذكر ما أُحل، والتحريم، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 642, that mentions what was made lawful, prohibition, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 642 کا اقتباس جس میں جو حلال کیا گیا، تحریم، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
