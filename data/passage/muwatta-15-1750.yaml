label: { ar: "الموطأ 1750 — نافع عن صفية بنت أبي عبيد عن عائشة وحفصة: حديث الإحداد ثلاثة أيام إلا على الزوج، مع اختلاف الرواة في تعيين الراوية", en: "Muwatta 1750", es: "Muwatta 1750", fr: "Muwatta 1750", ur: "موطا 1750", tr: "El-Muvatta 1750 — Nafi’nin Safiyya bint Abi Ubayd’dan, o da Aişe ve Hafsa’dan rivayet ettiği hadis: Kocası hariç üç gün yas tutmakla ilgili hadis; rivayet edenlerin kim olduğu konusunda görüş ayrılıkları bulunmaktadır.", id: "Al-Muwatta 1750 — Diriwayatkan oleh Nafi’ dari Safiyya bint Abi Ubayd dari Aisyah dan Hafsa: Hadits tentang masa berkabung selama tiga hari, kecuali suami, dengan perawi yang berbeda pendapat mengenai siapa perawinya." }
summary:
  ar: "يروي مالك عن نافع عن صفية بنت أبي عبيد عن عائشة وحفصة، زوجي النبي، أن رسول الله قال: لا يحل لامرأة تؤمن بالله واليوم الآخر أن تحد على ميت فوق ثلاث ليال، إلا على زوج. وينقل ابن عبد البر أن يحيى روى الحديث عن عائشة وحفصة جميعا، وأن رواة آخرين قالوا «عن عائشة أو حفصة» على الشك، وأن أصحاب نافع اختلفوا فيه اختلافا كثيرا. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
  tr: "Malik, Peygamberin eşleri Ayşe ve Hafsa'dan rivayetle, Nafi'den, o da Safiyye bint Ebu Ubeyd'den, o da Peygamberin eşlerinden rivayetle, Resulullah'ın şöyle buyurduğunu nakletmiştir: \"Allah'a ve Ahiret Günü'ne iman eden bir kadının, kocası hariç, ölen bir kişi için üç geceden fazla yas tutması caiz değildir.\" İbn Abdül-Barr, Yahya'nın bu hadisi hem Ayşe hem de Hafsa'dan rivayetle naklettiğini, diğer ravîlerin ise \"Ayşe veya Hafsa'dan rivayetle\" diye şüpheyle söylediklerini ve Nafi'nin sahabelerinin bu konuda büyük ölçüde ihtilafa düştüğünü bildirmiştir. {cite:muwatta-maruf-1997 s.113} {cite:muwatta-maruf-1997 s.114}"
  id: "Malik meriwayatkan dari Nafi’ dari Safiyya binti Abi Ubayd dari Aisyah dan Hafsa, istri-istri Nabi, bahwa Rasulullah SAW bersabda: “Tidak diperbolehkan bagi seorang wanita yang beriman kepada Allah dan Hari Kiamat untuk berduka atas orang yang meninggal lebih dari tiga malam, kecuali suaminya.” Ibnu Abd al-Barr melaporkan bahwa Yahya meriwayatkan hadits tersebut dari Aisyah dan Hafsa, dan bahwa perawi lain mengatakan “dari Aisyah atau Hafsa” dengan ragu-ragu, dan bahwa para sahabat Nafi’ sangat berbeda pendapat mengenai masalah ini. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
