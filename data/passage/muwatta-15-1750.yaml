label: { ar: "الموطأ 1750 — نافع عن صفية بنت أبي عبيد عن عائشة وحفصة: حديث الإحداد ثلاثة أيام إلا على الزوج، مع اختلاف الرواة في تعيين الراوية", en: "Muwatta 1750" }
summary:
  ar: "يروي مالك عن نافع عن صفية بنت أبي عبيد عن عائشة وحفصة، زوجي النبي، أن رسول الله قال: لا يحل لامرأة تؤمن بالله واليوم الآخر أن تحد على ميت فوق ثلاث ليال، إلا على زوج. وينقل ابن عبد البر أن يحيى روى الحديث عن عائشة وحفصة جميعا، وأن رواة آخرين قالوا «عن عائشة أو حفصة» على الشك، وأن أصحاب نافع اختلفوا فيه اختلافا كثيرا. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
