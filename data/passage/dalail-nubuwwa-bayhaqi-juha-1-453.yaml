text: "… علا الإناءِ بهاء اللبن، وهو وَبِيصُ رِغْوَتِهِ. يريد أنه مَلاها. قوله : فشربوا حتى أراضُوا يريد شربوا حتى رَوَوْا فَنَقِعُوا بالريِّ. وقوله تَشَارَكْنَ هُزْلا أي عَمَّهُنَّ الهزال، فليس فيهن مُنْقِيّة ولا ذات طرْقٍ، وهو من الاشتراك. في ص : شن. …"
