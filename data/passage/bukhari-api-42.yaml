label: { ar: "صحيح البخاري 42 — مضاعفة الحسنة بعشر أمثالها، عدد السيئات", en: "Sahih al-Bukhari 42 — the good deed multiplied tenfold and beyond; a stated number of bad deeds", ur: "صحیح بخاری 42 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا، برائیوں کی تعداد" }
text: "حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، قَالَ حَدَّثَنَا عَبْدُ الرَّزَّاقِ، قَالَ أَخْبَرَنَا مَعْمَرٌ، عَنْ هَمَّامٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِذَا أَحْسَنَ أَحَدُكُمْ إِسْلاَمَهُ، فَكُلُّ حَسَنَةٍ يَعْمَلُهَا تُكْتَبُ لَهُ بِعَشْرِ أَمْثَالِهَا إِلَى سَبْعِمِائَةِ ضِعْفٍ، وَكُلُّ سَيِّئَةٍ يَعْمَلُهَا تُكْتَبُ لَهُ بِمِثْلِهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 42، يذكر مضاعفة الحسنة بعشر أمثالها، وعدد السيئات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 42 (Belief), that speaks of the good deed multiplied tenfold and beyond, a stated number of bad deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 42، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا، برائیوں کی تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
