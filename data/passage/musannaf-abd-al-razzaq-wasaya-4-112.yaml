text: "… عَشَرَ. بدالرزاق، عَنْ مَعْمَرٍ، عَنْ قَتَادَةَ، عَنِ الْحَسَنِ، عَنْ أَبِي هُرَيْرَةَ قَالَ : ثَلَاثٌ أَوْصَانِي بِهِنَّ النَّبِيَّ وَلِفِ : أَنْ أَنَامَ عَلَىٰ وِثْرٍ، وَصِيَامٍ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ، وَرَكْعَتَيٍ الضَّحَى، قَالَ قَتَادَةُ : ثُمَّ تَرَكَ الْحَسَنُ بَعْدُ فِي هَذَا …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 4، ص 112، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 4, p. 112, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 4، ص 112 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Abd al-Razzaq, volumen 4, pág. 112, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 4, page 112, mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur de Testaments."
  tr: "Abdülrazzak'ın Musannaf adlı eserinin Resimli Cilt 4, sayfa 112'sinden bir alıntı; vasiyetname veya son miras olarak bıraktığı şeylerden ve mirastan bahsediyor; makine tarafından okunabilir taranmış kopyadan alınmış olup, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Abd al-Razzaq, Jilid 4 Bergambar, halaman 112, yang menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkan sebagai warisan dan harta pusaka; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
