label:
  ar: "مسلم 2380f — موسى والعبد الصالح بمجمع البحرين"
  en: "Muslim 2380f — Musa and the righteous servant at the meeting of the two seas"
  ur: "مسلم 2380f — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
text: "بينما موسى في ملإ من بني إسرائيل إذ جاءه رجل فقال له هل تعلم أحدا أعلم منك قال موسى لا . فأوحى الله إلى موسى بل عبدنا الخضر - قال - فسأل موسى السبيل إلى لقيه فجعل الله له الحوت …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2380f: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2380f: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2380f: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
