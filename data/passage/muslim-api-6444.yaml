label: { ar: "صحيح مسلم 6444 — الأب والأبوة", en: "Sahih Muslim 6444 — the father and fatherhood", ur: "صحیح مسلم 6444 — باپ اور والدیت", es: "Sahih Muslim 6444 — El padre y la paternidad" }
text: "… مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ مُحَمَّدِ بْنِ أَبِي يَعْقُوبَ، سَمِعْتُ عَبْدَ، الرَّحْمَنِ بْنَ أَبِي بَكْرَةَ يُحَدِّثُ عَنْ أَبِيهِ، أَنَّ الأَقْرَعَ بْنَ حَابِسٍ، جَاءَ إِلَى رَسُولِ اللَّهِ فَقَالَ إِنَّمَا بَايَعَكَ سُرَّاقُ الْحَجِيجِ مِنْ أَسْلَمَ وَغِفَارَ وَمُزَيْنَةَ - وَأَحْسِبُ جُهَيْنَةَ - مُحَمَّدٌ الَّذِي شَكَّ - فَقَالَ رَسُولُ اللَّهِ \" أَرَأَيْتَ إِنْ كَانَ أَسْلَمُ وَغِفَارُ وَمُزَيْنَةُ - …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6444، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6444 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6444، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6444 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
