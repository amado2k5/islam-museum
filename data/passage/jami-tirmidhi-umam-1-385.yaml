text: "… الْجِزْيَةَ مِنْ مُوس الْبَحْرَيْنِ وأَخَذَهَا عُمَرُ مِنْ فَارِسَ وأَخَذَهَا عُثْمَانُ مِنْ الْفُرْسِ. وَسَأَلْتُ مُحَمَّدًا عَنْ هَذَا؟ فَقَالَ : هُوَ مالِكٌ عَنِ الزُّهْرِيِّ عَنِ النَّبِيِّ وَلِعِلْ المعجم - باب ما جاء ما يحل من أموال أهل الذمة التحفة - حَدَّثَنَا قُتَيْبَةُ: …"
