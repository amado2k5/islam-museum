label: { ar: "سنن أبي داود 2709 — الأب والأبوة", en: "Sunan Abi Dawud 2709 — the father and fatherhood", ur: "سنن ابی داؤد 2709 — باپ اور والدیت", es: "Sunan Abi Dawud 2709 — El padre y la paternidad", fr: "Sunan Abi Dawud 2709 — le père et la paternité", tr: "Sunan Abi Davud 2709 — Baba ve Babalık", id: "Sunan Abi Dawud 2709 — Sang Ayah dan Peran Ayah" }
text: "… مُحَمَّدُ بْنُ الْعَلاَءِ، قَالَ أَخْبَرَنَا إِبْرَاهِيمُ، - يَعْنِي ابْنَ يُوسُفَ بْنِ إِسْحَاقَ بْنِ أَبِي إِسْحَاقَ السَّبِيعِيَّ - عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ السَّبِيعِيِّ، حَدَّثَنِي أَبُو عُبَيْدَةَ، عَنْ أَبِيهِ، قَالَ مَرَرْتُ فَإِذَا أَبُو جَهْلٍ صَرِيعٌ قَدْ ضُرِبَتْ رِجْلُهُ فَقُلْتُ يَا عَدُوَّ اللَّهِ يَا أَبَا جَهْلٍ قَدْ أَخْزَى اللَّهُ الأَخِرَ. قَالَ وَلاَ أَهَابُهُ عِنْدَ ذَلِكَ. فَقَالَ أَبْعَدُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2709، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2709 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2709، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2709 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2709 (Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 2709 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2709, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
