text: "… مُحَمَّدُ بْنُ الْعَلاَءِ، قَالَ أَخْبَرَنَا إِبْرَاهِيمُ، - يَعْنِي ابْنَ يُوسُفَ بْنِ إِسْحَاقَ بْنِ أَبِي إِسْحَاقَ السَّبِيعِيَّ - عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ السَّبِيعِيِّ، حَدَّثَنِي أَبُو عُبَيْدَةَ، عَنْ أَبِيهِ، قَالَ مَرَرْتُ فَإِذَا أَبُو جَهْلٍ صَرِيعٌ قَدْ ضُرِبَتْ رِجْلُهُ فَقُلْتُ يَا عَدُوَّ اللَّهِ يَا أَبَا جَهْلٍ قَدْ أَخْزَى اللَّهُ الأَخِرَ. قَالَ وَلاَ أَهَابُهُ عِنْدَ ذَلِكَ. فَقَالَ أَبْعَدُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2709، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2709 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2709، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
