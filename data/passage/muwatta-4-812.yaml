text: "دخل وهو صائم"
summary:
  ar: "أول حديث في باب ما يفعل من قدم من سفر أو أراده في رمضان. بلاغ يرويه مالك أنه بلغه أن عمر بن الخطاب كان إذا كان في سفر في رمضان، فعلم أنه داخل المدينة من أول يومه، دخل وهو صائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.398}"
