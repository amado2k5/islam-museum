label: { ar: "الموطأ 812 — عمر: كان إذا كان في سفر في رمضان فعلم أنه داخل المدينة من أول يومه دخل وهو صائم", en: "Muwatta 812", es: "Muwatta 812", fr: "Muwatta 812", ur: "موطا 812", tr: "Al-Muwatta 812 — Ömer: Eğer Ramazan ayında yolculuk yapıyorsa ve şehre günün başından itibaren gireceğini biliyorsa, oruçlu olarak girerdi.", id: "Al-Muwatta 812 — Umar: Jika dia sedang bepergian pada bulan Ramadan dan tahu bahwa dia akan memasuki kota sejak awal hari, dia akan masuk dalam keadaan berpuasa." }
text: "دخل وهو صائم"
summary:
  ar: "أول حديث في باب ما يفعل من قدم من سفر أو أراده في رمضان. بلاغ يرويه مالك أنه بلغه أن عمر بن الخطاب كان إذا كان في سفر في رمضان، فعلم أنه داخل المدينة من أول يومه، دخل وهو صائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.398}"
  tr: "Ramazan ayında yolculuktan dönen veya yolculuğa çıkmayı planlayanların ne yapması gerektiği konusundaki bölümün ilk hadisi. Malik'ten rivayet edildiğine göre, Ömer ibn el-Hattab'ın Ramazan ayında yolculuk yaparken ve ilk gün Medine'ye gireceğini bildiği halde oruçlu olarak girdiğini duymuştu. Editör, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.398}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang harus dilakukan setelah kembali dari perjalanan atau berniat melakukan perjalanan selama bulan Ramadan. Ini adalah riwayat yang dinarasikan oleh Malik bahwa ia mendengar bahwa Umar bin al-Khattab, ketika melakukan perjalanan selama Ramadan dan mengetahui bahwa ia akan memasuki Madinah pada hari pertama, akan masuk dalam keadaan berpuasa. Editor menyebutkan bahwa hadits ini dinarasikan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.398}"
