text: "… مِمَّنْ أُمِرَ نَبِيُّكُمْ صلى الله عليه وسلم أَنْ يَقْتَدِيَ بِهِ، فَسَجَدَهَا رَسُولُ اللَّهِ صلى الله عليه وسلم‏.‏ ‏{‏عُجَابٌ‏}‏ عَجِيبٌ‏.‏ الْقِطُّ الصَّحِيفَةُ هُوَ هَا هُنَا صَحِيفَةُ الْحَسَنَاتِ‏.‏ وَقَالَ مُجَاهِدٌ ‏{‏فِي عِزَّةٍ‏}‏ مُعَازِّينَ‏.‏ ‏{‏الْمِلَّةِ الآخِرَةِ‏}‏ مِلَّةُ قُرَيْشٍ‏.‏ الاِخْتِلاَقُ الْكَذِبُ‏.‏ الأَسْبَابُ طُرُقُ السَّمَاءِ فِي أَبْوَابِهَا ‏{‏جُنْدٌ مَا هُنَالِكَ مَهْزُومٌ‏}‏ يَعْنِي قُرَيْشًا ‏{‏أُولَئِكَ الأَحْزَابُ‏}‏ الْقُرُونُ الْمَاضِيَةُ‏.‏ ‏{‏فَوَاقٍ‏}‏ رُجُوعٍ‏.‏ ‏{‏قِطَّنَا‏}‏ عَذَابَنَا ‏{‏اتَّخَذْنَاهُمْ سُخْرِيًّا‏}‏ أَحَطْنَا بِهِم …"
summary:
