text: |-
  * ⁦(فصل الحام)⁩ *
  .١ . ⁦(-قق)⁩ .
  ( حرزق قال أبوزيد الحرزقة الفيق يقال حرزقه أى حبه وضيق عليه قال الاعشى
  بساباط حتى مات وهو محرزق * يقول حبس كسرى النعمان بن المذربساباط المدائن-تى
  مات وه ومضيق عليه وكان أبو عم روالتسيبانى يقول محزرق بتسديم الزاى عسلى الراه
  ⁦( -تق)⁩ الحقخلاف الباطل والحق واحد الحقوق والحقة أخص منه يقالى هذه جقنى
  أى حق والحقة أيضاحقيقة الامر يقال لماعرف الحقة منى هرب وقوله-م حق لا آتيك هو
  يمين للعرب يرفعونها بغير تنوين اذاجاءت بعد اللام واذا أزالواعنها اللام قالواحة سالا آتيك
  وقواه-م كان ذاك عن دحق لقاحها وحقّ لقاحها أيضابا لكسرأى حين ثبت ذلا فيها
  والحقة بالضم معروفة والجمع -ق وحقق و-قاق والحق بالكسرما كان من الابل ابن ثلاث
  سنين وقد دخل فى الرابعة والانى حقة وحق أيضاسمى بذلك لاستحة ماقه أن يحمل عليه وأن
  ينتفع به تقول هو -ق بين الحقة وهو مصدر قال الاعنى
  بحقتها ربطت فى اللجين حتى السديس لهاقد أسن
  والجمع حقاق وحقق ولم يرد يحقتها صفة لهالانه لا يقال ذلك كمالا يقال بجددعتها فعل بها
  كذا ولا بثنيتها ولا يسازلها ولا أرادبقوله أ-ن كبرلانه لا يقال أ-ن السنّ واغمايقال أسنّ
  الرجل وأصنت المرأة وانما أراد أنها ربطت فى اللجيز وقتا كانت فيه حقة الى أن نجم سديسها
  أى نبت وجع الحقاق حقق مثال كتاب وكتب ومنمقول المسيب بن علس
  قدنا انى منهم على عدم • مثل الغسيل صغارها الحقق
  وربماجع على حقائق مشل اقال وأفائل قال الراجز
  ومسد أمرمن أيافق • لن بأنياب ولاحقائق
  قال الاصمعىّ اذا جازت الناقة السنة ولم تلدقيل قد بازت الحق وأتت الناقة على حقها أى
  الوقت الذى ضر بت فيه عام أول وسقطفلان على حاق رأسه أى وسط رأسه وجنته فى حاق
  الشتاء أى فى وسطه والحاقة القيامة سميت بذلك لانّ فيهاحواق الامود وحاقه أى خادهه
  وادبى كل واحدمنهما الحق فاذاغلبه قيل حقه ويقال للرجل اذا خاصم فى صغار الاشياء انه
  ا-نزق الحقاق ويقال ماله فيه حق ولاحقاق أى خصومة والتحاق التخاصم والاحتقاق
  الاختصام وتقول احتق فسلان وفلان ولا يقال للوأحدكما لا يقال اختصم للواحددون
  الاخرواحتق الفرس أى ضمروطعنسة محتقة أى لازيغ فيها وقد نفذت ويقال رمى فلان
  الصيد فا حتق بعضا وشرم بعضا أى ققل بعضا وأفات بعض بريحا ومنه فول الشاءر
  من بين محتق اها ومشرّم * وحققت حذره أحه حقا وأحققته أيضا اذافعات ما كان
  يحذره ويقال أيضاحققت الرجل وأ-ققته اذا أتيته حكاه أبو عبيد قال وجققت الامر
  وأحققته أيضا اذا تحققته وصرت منه على يقين قال السكساتى" بقال حقلك أن تفعل هذا
  وحقسقت أن تفسعل هذا يمعنى و-ق له أن يفعل كذا وهو حقيق أن يفعل كذا وه ر حقيق
  بهومحة وقبه أى خليق له والجمع أحقاء ومحتوة ون وحق الشى يحقّ بالكسر أى وجب
  وأحقفت الشئ أى أوجبته واستحقته أى استوجبته وتحقق عنده البر أى صح وحققت
  قوله وظنه تحقيما أى صدقت وكلام محقق أى رمسين قال الراجز
