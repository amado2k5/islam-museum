text: "… خلق اللّٰه القلم ثم نظر إليه فأنشق نصفين؛ فقال: أجرِ؛ فقال: يا ربّ بِمَ أجري؟ قال بما هو كائن إلى يوم القيامة؛ فجرى على اللوح المحفوظ. وقال الوليد بن عُبادة بن الصامت: أوصاني أبي عند موته فقال: يا بُنَيّ، اتقِ …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 6972، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 6972, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
