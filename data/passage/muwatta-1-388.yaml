label: { ar: "الموطأ 388 — بلاغ عن علي بن حسين: الجمع إذا أراد أن يسير يومه أو ليله", en: "Muwatta 388", es: "Muwatta 388", fr: "Muwatta 388", ur: "موطا 388", tr: "Al-Muwatta 388 — Ali bin Hüseyin'den rivayet edildiğine göre: Cemaat, eğer bir kimse gündüz veya gece yolculuk etmeyi düşünüyorsa...", id: "Al-Muwatta 388 — Diriwayatkan dari Ali bin Hussein: Jamaah, jika ia bermaksud melakukan perjalanan pada siang atau malam hari" }
text: "كان رسول الله إذا أراد أن يسير يومه جمع بين الظهر والعصر، وإذا أراد أن يسير ليله جمع بين المغرب والعشاء"
summary:
  ar: "بلاغ في باب الجمع بين الصلاتين في الحضر والسفر: يروي مالك أنه بلغه عن علي بن حسين أنه كان يقول إن النبي كان إذا أراد أن يسير يومه جمع بين الظهر والعصر، وإذا أراد أن يسير ليله جمع بين المغرب والعشاء. ويذكر المحقق أن أبا مصعب رواه عن مالك، ويحيل على الأحاديث المتقدمة في الباب عن الأعرج ومعاذ وابن عمر وابن عباس. {cite:muwatta-maruf-1997 p.208}"
  id: "Sebuah laporan tentang menggabungkan salat saat di rumah atau bepergian: Malik meriwayatkan bahwa ia mendengar dari Ali ibn Husayn bahwa Nabi (shalawat dan salam kepadanya) biasa menggabungkan salat Zuhur dan Ashar ketika beliau bermaksud bepergian di siang hari, dan salat Maghrib dan Isya ketika beliau bermaksud bepergian di malam hari. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan merujuk pada hadits-hadits yang disebutkan sebelumnya dalam bab ini berdasarkan riwayat al-A'raj, Mu'adh, Ibn Umar, dan Ibn Abbas. {cite:muwatta-maruf-1997 p.208}"
