label: { ar: "الموطأ 388 — بلاغ عن علي بن حسين: الجمع إذا أراد أن يسير يومه أو ليله", en: "Muwatta 388" }
text: "كان رسول الله إذا أراد أن يسير يومه جمع بين الظهر والعصر، وإذا أراد أن يسير ليله جمع بين المغرب والعشاء"
summary:
  ar: "بلاغ في باب الجمع بين الصلاتين في الحضر والسفر: يروي مالك أنه بلغه عن علي بن حسين أنه كان يقول إن النبي كان إذا أراد أن يسير يومه جمع بين الظهر والعصر، وإذا أراد أن يسير ليله جمع بين المغرب والعشاء. ويذكر المحقق أن أبا مصعب رواه عن مالك، ويحيل على الأحاديث المتقدمة في الباب عن الأعرج ومعاذ وابن عمر وابن عباس. {cite:muwatta-maruf-1997 p.208}"
