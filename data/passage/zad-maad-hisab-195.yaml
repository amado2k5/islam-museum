text: "… صيامُ ستة أيام من شوال، فصح عنه أنه قال : صِيامُهَا مَعَ رَمَضَانَ يَعْدِلُ صِيَامَ الدَّهْرِ [مسلم: ٢٧٥٨]. صيام عاشوراء وأما صيامُ يوم عاشوراء، فإنه كان يتحرَّى صومَه على سائر الأيَّام، ولما قَدِمَ المدينة، وجد اليهودَ تصومُه وتُعظِّمُه، فقال: نَحْنُ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 195، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 195, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 195 کا اقتباس جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
