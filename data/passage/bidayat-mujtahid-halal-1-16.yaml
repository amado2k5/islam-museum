text: "… فِيهَا الْمُحَرَّمَاتِ، فِي حَالِ الإخْتِيَارِ. الْجُمْلَةُ الثَّانِيَةُ : نَذْكُرُ فِيهَا أَحْوَالَهَا، فِي حَالِ الاضْطِرَارِ. الْجُمْلَةُ الْأُولَى وَالْأَغْذِيَةُ الْإِنْسَانِيَّةُ : نَبَاتٌ، وَحَيَوَانٌ. فَأَمَّا الْحَيَوَانُ الَّذِي يُغْتَذَى بِهِ، فَمِنْهُ حَلَالٌ فِي الشَّرْعِ، وَمِنْهُ حَرَامٌ. وَهَذَا مِنْهُ بَرِّيٌّ، وَمِنْهُ بَحْرِيٌّ. وَالْمُحَرَّمَةُ : مِنْهَا …"
