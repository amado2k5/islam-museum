text: "… غليظا٪ فقلا مقاتل بن حيّان النبطى، يا اهل خراسان انا كنّا بمنزلة بيت! واحد وثغرنا واحده ويدنا على مدونا وأحدة وقد انكرنا ما صنع صاحبكم وجّه اليه ه اميرنا بالفقهاء والقرآء من اصحابه فوجّه ه رجلا واحدا قال محمد أنّما …"
