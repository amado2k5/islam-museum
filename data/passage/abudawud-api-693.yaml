label: { ar: "سنن أبي داود 693 — الأب والأبوة", en: "Sunan Abi Dawud 693 — the father and fatherhood", ur: "سنن ابی داؤد 693 — باپ اور والدیت", es: "Sunan Abi Dawud 693 — El padre y la paternidad", fr: "Sunan Abi Dawud 693 — Le père et la paternité" }
text: "حَدَّثَنَا مَحْمُودُ بْنُ خَالِدٍ الدِّمَشْقِيُّ، حَدَّثَنَا عَلِيُّ بْنُ عَيَّاشٍ، حَدَّثَنَا أَبُو عُبَيْدَةَ الْوَلِيدُ بْنُ كَامِلٍ، عَنِ الْمُهَلَّبِ بْنِ حُجْرٍ الْبَهْرَانِيِّ، عَنْ ضُبَاعَةَ بِنْتِ الْمِقْدَادِ بْنِ الأَسْوَدِ، عَنْ أَبِيهَا، قَالَ مَا رَأَيْتُ رَسُولَ اللَّهِ يُصَلِّي إِلَى عُودٍ وَلاَ عَمُودٍ وَلاَ شَجَرَةٍ إِلاَّ جَعَلَهُ عَلَى حَاجِبِهِ الأَيْمَنِ أَوِ الأَيْسَرِ وَلاَ يَصْمُدُ لَهُ صَمْدًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 693، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 693 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 693، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 693 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 693 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
