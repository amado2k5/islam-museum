text: "… ويُقْرِى الضَّيْف وبُطْعِم الطعام ويُفْثِي السلام ولم يَرُدّ طالبَ حاجة قَطَ، أَنا ابنة حاتم طبئ. فقال النبى : يا جارية هذه صِفَة المؤمنين حقاً، او كان أَبوك مسلماً لَتَرَحَّمنا عليه خَلُّوا عنها فإن أَباها كان يحب مكارم الأخلاق والله يُحِبّ …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 4018، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
