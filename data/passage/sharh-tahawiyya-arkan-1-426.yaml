text: "… الآخر الإيمان بضع وسبعون أو بضع وستون شعبة.. أي الناس أحب إليك؟ قال: عائشة... أين الله؟ قالت: في السماء باسمك ربّ وضعت جنبي وبك أرفعه....... بني الإسلام على خمس: شهادة أن لا إله إلا اللّٰه فغفر له...... بينما كلب يُطيفُ …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 426، يذكر ما بُني عليه الإسلام، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 426, that mentions what Islam is built on, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 426 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
