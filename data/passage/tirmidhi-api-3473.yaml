label: { ar: "جامع الترمذي 3473 — عدد الحسنات، كتابة الحسنات", en: "Jami' al-Tirmidhi 3473 — a stated number of good deeds; the writing of good deeds", ur: "جامع ترمذی 3473 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ إِلَهًا وَاحِدًا أَحَدًا صَمَدًا لَمْ يَتَّخِذْ صَاحِبَةً وَلاَ وَلَدًا وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ عَشْرَ مَرَّاتٍ كَتَبَ اللَّهُ لَهُ أَرْبَعِينَ أَلْفَ أَلْفِ حَسَنَةٍ \". قَالَ هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ. وَالْخَلِيلُ بْنُ مُرَّةَ لَيْسَ بِالْقَوِيِّ عِنْدَ أَصْحَابِ الْحَدِيثِ. قَالَ مُحَمَّدُ بْنُ إِسْمَاعِيلَ هُوَ مُنْكَرُ الْحَدِيثِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3473، يذكر عدد الحسنات، وكتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3473 (Chapters on Supplication), that speaks of a stated number of good deeds, the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3473، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
