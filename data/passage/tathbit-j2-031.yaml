label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ١٣، المقطع ٣ من ٣", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 13, section 3 of 3", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 13، حصہ 3" }
text: "وفيما ألقى من الرعب وفيما غشي من النعاس وفيما بلّغ من الرمي وغير ذلك. وكان المشركون مغيظين وحنقين ومحفظين يتمنون أن يبرز إليهم رسول الله وأصحابه، لا يشكون في أنهم إذا وقعت عيونهم عليهم اصطلموهم واستأصلوا الإسلام وشفوا …"
summary:
  ar: "مقطع من الباب ١٣ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 13 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 13 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
