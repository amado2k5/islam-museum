text: "… قريش القهستانى كان كثير الساع والرحلة صنف وجمع وكان ضابطا متقنا حافظا وروى عن خلق كثير روى عنه ابن مخلد وابو بكر الشانعى وتوقى بقهستان فى هذه السنة. سنة ثم دخلت سنة اربع عشرة وتلمائة من الحوادث فيها ان الروم …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 1، ص 205، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 1, p. 205, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 1، ص 205 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
