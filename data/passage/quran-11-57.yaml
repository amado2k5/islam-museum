text: "فَإِن تَوَلَّوْا۟ فَقَدْ أَبْلَغْتُكُم مَّآ أُرْسِلْتُ بِهِۦٓ إِلَيْكُمْ ۚ وَيَسْتَخْلِفُ رَبِّى قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّونَهُۥ شَيْـًٔا ۚ إِنَّ رَبِّى عَلَىٰ كُلِّ شَىْءٍ حَفِيظٌ"
text_search: "فإن تولوا فقد أبلغتكم ما أرسلت به إليكم ۚ ويستخلف ربي قوما غيركم ولا تضرونه شيئا ۚ إن ربي على كل شيء حفيظ"
translations:
  en: { text: "And if ye turn away, still I have conveyed unto you that wherewith I was sent unto you, and my Lord will set in place of you a folk other than you. Ye cannot injure Him at all. Lo! my Lord is Guardian over all things.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اگر تم روگردانی کرو گے تو جو پیغام میرے ہاتھ تمہاری طرف بھیجا گیا ہے، وہ میں نے تمہیں پہنچا دیا ہے۔ اور میرا پروردگار تمہاری جگہ اور لوگوں کو لابسائے گا۔ اور تم خدا کا کچھ بھی نقصان نہیں کرسکتے۔ میرا پروردگار تو ہر چیز پر نگہبان ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
