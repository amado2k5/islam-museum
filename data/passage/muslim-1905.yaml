label:
  ar: "مسلم 1905 — أول من يقضى عليه يوم القيامة: الشهيد والعالم والمتصدق المراؤون"
  en: "Muslim 1905 — The first judged on the Day: those who fought, taught and gave for show"
  ur: "مسلم 1905 — قیامت کے دن پہلے فیصلہ: دکھاوے کے لیے لڑنے، پڑھانے اور خرچ کرنے والے"
text: "إن أول الناس يقضى يوم القيامة عليه رجل استشهد فأتي به فعرفه نعمه فعرفها قال فما عملت فيها قال قاتلت فيك حتى استشهدت . قال كذبت ولكنك قاتلت لأن يقال جريء . فقد قيل . ثم أمر به فسحب على …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1905: أول من يقضى عليه يوم القيامة: الشهيد والعالم والمتصدق المراؤون. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1905: The first judged on the Day: those who fought, taught and gave for show. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1905: قیامت کے دن پہلے فیصلہ: دکھاوے کے لیے لڑنے، پڑھانے اور خرچ کرنے والے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
