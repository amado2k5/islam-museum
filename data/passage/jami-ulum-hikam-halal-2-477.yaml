text: "… النّبيُّ وَالِيِ نعم. وقد فسَّر بعضُهم تحليلَ الحلالِ باعتقادِ حلِّه، وتحريمَ الحرام باعتقاد حُرمته مع اجتنابه، ويُحتمل أن يراد بتحليل الحلال إتيانُه، ويكون الحلاَلُ هاهنا عبارةً عمَّا ليسَ بحرامٍ، فيدخل فيه الواجبُ والمستحبُّ والمباحُ، ويكونُ المعنى أنَّه يفعلَ ما ليس …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 477، يذكر الحلال، والحرام، والتحريم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
