  ar: "القسم 37 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صفة القيامة والرقائق والورع عن رسول الله صلي الله»، ويضم فيها النصوص من 2415 إلى 2522 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 37 of Jami' al-Tirmidhi (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara') in the division of the open hadith dataset the museum took its reports from: reports 2415 to 2522 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 37، عنوان «کتاب صفۃ القیامۃ والرقائق والورع عن رسول اللہ صلی اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2415 تا 2522۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
