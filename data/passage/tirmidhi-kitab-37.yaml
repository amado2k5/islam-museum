  id: "Jami' al-Tirmidhi, Kitab Deskripsi Hari Kiamat, dan Bab-bab tentang Ketakwaan dan Keagamaan, berdasarkan riwayat Rasulullah shalla Allahu alaihi wa sallam."
summary:
  ar: "القسم 37 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صفة القيامة والرقائق والورع عن رسول الله صلي الله»، ويضم فيها النصوص من 2415 إلى 2522 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 37 of Jami' al-Tirmidhi (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara') in the division of the open hadith dataset the museum took its reports from: reports 2415 to 2522 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 37، عنوان «کتاب صفۃ القیامۃ والرقائق والورع عن رسول اللہ صلی اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2415 تا 2522۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 37 de Jami' al-Tirmidhi (capítulos sobre la descripción del Día del Juicio, Ar-Riqaq y Al-Wara') se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2415 al 2522 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 37 de Jami' al-Tirmidhi (chapitres relatifs à la description du Jour du Jugement, à Ar-Riqaq et à Al-Wara'), dans la base de données ouverte: les hadiths 2415 à 2522 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  id: "Bagian 37 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Deskripsi Kebangkitan, dan Bab-bab tentang Ketakwaan dan Menjauhi Rasulullah (shalawat dan salam kepadanya),\" dan berisi teks 2415 hingga 2522, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
