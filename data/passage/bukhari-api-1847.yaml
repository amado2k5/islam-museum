label: { ar: "صحيح البخاري 1847 — الأب والأبوة", en: "Sahih al-Bukhari 1847 — the father and fatherhood", ur: "صحیح بخاری 1847 — باپ اور والدیت", es: "Sahih al-Bukhari 1847 — El padre y la paternidad", fr: "Sahih al-Bukhari 1847 — le père et la paternité" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا هَمَّامٌ، حَدَّثَنَا عَطَاءٌ، قَالَ حَدَّثَنِي صَفْوَانُ بْنُ يَعْلَى، عَنْ أَبِيهِ، قَالَ كُنْتُ مَعَ رَسُولِ اللَّهِ فَأَتَاهُ رَجُلٌ عَلَيْهِ جُبَّةٌ فِيهِ أَثَرُ صُفْرَةٍ أَوْ نَحْوُهُ، وَكَانَ عُمَرُ يَقُولُ لِي تُحِبُّ إِذَا نَزَلَ عَلَيْهِ الْوَحْىُ أَنْ تَرَاهُ فَنَزَلَ عَلَيْهِ ثُمَّ سُرِّيَ عَنْهُ فَقَالَ \" اصْنَعْ فِي عُمْرَتِكَ مَا تَصْنَعُ فِي حَجِّكَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1847، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1847 (Penalty of Hunting while on Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1847، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1847 (Castigo de la caza durante la peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1847 (La peine pour avoir chassé en pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
