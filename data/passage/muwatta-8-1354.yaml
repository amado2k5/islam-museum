label: { ar: "الموطأ 1354 — عبد الله بن أبي حبيبة: كان يقول وهو حدث إن على الرجل الذي يقول علي مشي إلى بيت الله، فأفتاه سعيد بالمشي", en: "Muwatta 1354" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي حبيبة أنه قال لرجل وهو يومئذ حديث السن، ما على الرجل أن يقول علي مشي إلى بيت الله، ولم يقل علي نذر مشي. فأعطاه رجل شيئا تافها ليقول علي مشي إلى بيت الله، ففعل، ثم عقل فقيل له عليك مشي، فسأل سعيد بن المسيب فقال عليك مشي، فمشى. قال مالك وهو الأمر عندنا. ويذكر المحقق أن ابن القاسم قال إن مالكا أنكر الأحاديث في المشي إلى قباء. {cite:muwatta-maruf-1997 p.606}"
