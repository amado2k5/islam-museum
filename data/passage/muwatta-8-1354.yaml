label: { ar: "الموطأ 1354 — عبد الله بن أبي حبيبة: كان يقول وهو حدث إن على الرجل الذي يقول علي مشي إلى بيت الله، فأفتاه سعيد بالمشي", en: "Muwatta 1354", es: "Muwatta 1354", fr: "Muwatta 1354", ur: "موطا 1354", tr: "El-Muvatta 1354 — Abdullah ibn Abi Habibah: Gençken, “Mutlaka” diyen kişinin Allah’ın Evi’ne (Kâbe’ye) yürüyerek gitmesi gerektiğini söylerdi. Bunun üzerine Said ona yürüyerek gitmesi gerektiğine dair bir fetva verdi.", id: "Al-Muwatta 1354 — Abdullah ibn Abi Habibah: Dahulu ia berkata, ketika masih muda, bahwa orang yang berkata “Aku harus” harus berjalan kaki ke Rumah Allah (Ka'bah), maka Saeed memberinya fatwa bahwa ia harus berjalan kaki." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي حبيبة أنه قال لرجل وهو يومئذ حديث السن، ما على الرجل أن يقول علي مشي إلى بيت الله، ولم يقل علي نذر مشي. فأعطاه رجل شيئا تافها ليقول علي مشي إلى بيت الله، ففعل، ثم عقل فقيل له عليك مشي، فسأل سعيد بن المسيب فقال عليك مشي، فمشى. قال مالك وهو الأمر عندنا. ويذكر المحقق أن ابن القاسم قال إن مالكا أنكر الأحاديث في المشي إلى قباء. {cite:muwatta-maruf-1997 p.606}"
  tr: "Malik, Abdullah ibn Abi Habibah'tan rivayetle, genç bir adama şöyle dediğini aktarır: \"Bir adamın 'Allah'ın Evi'ne yürüyeceğim' demesinde, 'Yürümeye yemin ederim' demesinde ne sakınca var?\" Bunun üzerine bir adam ona önemsiz bir şey verdi ve \"Allah'ın Evi'ne yürüyeceğim\" dedi. O da öyle yaptı. Sonra aklı başına geldi ve kendisine \"Yürümelisin\" denildi. Bunun üzerine Sa'id ibn al-Musayyib'e sordu, o da \"Yürümelisin\" dedi ve o da yürüdü. Malik, \"Bu, aramızdaki doğru görüştür\" dedi. Araştırmacı, İbn al-Qasim'in Malik'in Kuba'ya yürüyerek gitme hakkındaki hadisleri reddettiğini söylediğini belirtiyor. {cite:muwatta-maruf-1997 s.606}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Habibah bahwa ia berkata kepada seorang pemuda, \"Apa salahnya seseorang berkata, 'Aku akan berjalan ke Baitullah,' dan tidak berkata, 'Aku bersumpah untuk berjalan'?\" Maka seorang pemuda memberinya sesuatu yang tidak berarti untuk diucapkan, \"Aku akan berjalan ke Baitullah,\" dan ia melakukannya. Kemudian ia tersadar dan diberitahu, \"Kamu harus berjalan.\" Maka ia bertanya kepada Sa'id ibn al-Musayyib, yang berkata, \"Kamu harus berjalan,\" dan ia pun berjalan. Malik berkata, \"Ini adalah pandangan yang benar di antara kita.\" Peneliti menyebutkan bahwa Ibn al-Qasim berkata bahwa Malik menolak hadits tentang berjalan ke Quba. {cite:muwatta-maruf-1997 p.606}"
