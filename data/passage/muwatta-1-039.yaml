label: { ar: "الموطأ 39 — مالك فيمن نسي المضمضة والاستنثار حتى صلى", en: "Muwatta 39", es: "Muwatta 39", fr: "Muwatta 39", ur: "موطا 39", tr: "Al-Muwatta 39 — Malik, namaza kadar ağzını ve burnunu çalkalamayı unutan kimse hakkında.", id: "Al-Muwatta 39 — Malik tentang orang yang lupa berkumur dan membersihkan hidungnya sampai ia shalat" }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب العمل في الوضوء: من نسي أن يتمضمض ويستنثر حتى صلى فليس عليه إعادة صلاته، وليتمضمض ويستنثر لما يستقبل من الصلاة. ويحيل المحقق على اختلاف الفقهاء في المسألة عند الترمذي. {cite:muwatta-maruf-1997 p.53} {cite:muwatta-maruf-1997 p.54}"
  tr: "Malik'in, Yahya'nın abdest alma usulleri bölümünde rivayet ettiği bir fetvası şöyledir: Namazdan sonra ağzını ve burnunu çalkalamayı unutan kimsenin namazını tekrar etmesi gerekmez, ancak bir sonraki namaz için ağzını ve burnunu çalkalamalıdır. Editör, bu konuda Tirmizi'de farklı görüşler bulunduğuna değinmektedir. {cite:muwatta-maruf-1997 s.53} {cite:muwatta-maruf-1997 s.54}"
  id: "Fatwa Malik, diriwayatkan oleh Yahya dalam bab tentang tata cara wudhu: Barang siapa lupa berkumur dan membersihkan hidungnya hingga setelah shalat, tidak diwajibkan mengulang shalatnya, tetapi harus berkumur dan membersihkan hidungnya untuk shalat berikutnya. Editor merujuk pada perbedaan pendapat para ahli fiqih mengenai masalah ini dalam al-Tirmidhi. {cite:muwatta-maruf-1997 p.53} {cite:muwatta-maruf-1997 p.54}"
