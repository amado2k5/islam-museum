text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا الشَّيْبَانِيُّ، قَالَ سَمِعْتُ ابْنَ أَبِي أَوْفَىما ـ يَقُولُ أَصَابَتْنَا مَجَاعَةٌ لَيَالِيَ خَيْبَرَ، فَلَمَّا كَانَ يَوْمُ خَيْبَرَ وَقَعْنَا فِي الْحُمُرِ الأَهْلِيَّةِ، فَانْتَحَرْنَاهَا فَلَمَّا غَلَتِ الْقُدُورُ، نَادَى مُنَادِي رَسُولِ اللَّهِ اكْفَئُوا الْقُدُورَ، فَلاَ تَطْعَمُوا مِنْ لُحُومِ الْحُمُرِ شَيْئًا. قَالَ عَبْدُ اللَّهِ فَقُلْنَا إِنَّمَا نَهَى النَّبِيُّ لأَنَّهَا لَمْ تُخَمَّسْ. قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3155، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3155 (One-fifth of Booty to the Cause of Allah (Khumus)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3155، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3155 (Una quinta parte del botín para la causa de Alá (Khumus)), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Le Sahih al-Bukhari, n° 3155 (Le cinquième du butin pour la cause d'Allah (Khumus)), mentionne les nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
