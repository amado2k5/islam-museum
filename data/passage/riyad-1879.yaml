label:
  ar: "رياض الصالحين 1879 — تصرفن وأكثرن الاستغفار فإني رأيتكن أكثر أهل النار"
  en: "Riyad al-Salihin 1879 — Women, give charity and seek forgiveness much, for you are the majority of the people of the Fire"
text: "يَا مَعْشَرَ النِّسَاءِ تَصَدَّقْنَ وَأَكْثِرْنَ الاِسْتِغْفَارَ۔ فَإِنِّي رَأَيْتُكُنَّ أَكْثَرَ أَهْلِ النَّارِ۔» فَقَالَتِ امْرَأَةٌ مِنْهُنَّ جَزْلَةٌ: وَمَا لَنَا يَا رَسُولَ اللَّهِ أَكْثَرَ أَهْلِ النَّارِ؟ قَالَ: «تُكْثِرْنَ اللَّعْنَ، وَتَكْفُرْنَ الْعَشِيرَ، وَمَا رَأَيْتُ مِنْ نَاقِصَاتِ عَقْلٍ وَدِينٍ أَغْلَبَ لِذِي لُبٍّ مِنْكُنَّ۔» قَالَتْ: يَا…"
