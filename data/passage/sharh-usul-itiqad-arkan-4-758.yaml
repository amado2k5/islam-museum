text: "شرح أصول اعتقاد أهل السنة والجماعة يدخل النار من كان في قلبه مثقال حبة من إيمان والطهور شطر الإيمان والإيمان بضع وسبعون شعبة. وبه قال من الصحابة: عمر بن الخطاب، وعلي بن أبي طالب، وعبد اللَّه بن مسعود، ومعاذ بن …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 758، يذكر الإيمان بضع وسبعون شعبة، وحلاوة الإيمان وكماله، وتفاضل الإيمان في القلوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 4, p. 758, that mentions faith as seventy-odd branches, the sweetness and completeness of faith, the degrees of faith in hearts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 4، ص 758 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کی مٹھاس اور اس کا کمال، دلوں میں ایمان کے درجے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 4, pág. 758, que menciona la fe como setenta y tantos brazos, la dulzura y la plenitud de la fe, y los grados de fe en los corazones; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 4, p. 758), évoquant la foi comme une soixantaine de branches, sa douceur et sa plénitude, ainsi que ses degrés de profondeur dans les cœurs. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 4. cildinin 758. sayfasından bir alıntı, yetmişten fazla iman dalından, imanın tatlılığından ve mükemmelliğinden ve kalplerdeki imanın farklı derecelerinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 4, halaman 758, menyebutkan lebih dari tujuh puluh cabang iman, kemanisan dan kesempurnaan iman, dan berbagai tingkatan iman di dalam hati. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
