text: "… نه السؤال في كتاب اللّٰه وفي الحديث نوعان: أحدهما ما كان على وجه التبين، والتعلم بما يمس الحاجة إليه، فهو مباح، أو مندوب، أو مأمور به، والثاني: ما كان على طريق التكلف والتعنت، وهو مكروه ومنهي عنه، فإن سكت عن …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 181، يرد فيه ذكر المندوب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 181, whose wording mentions the recommended (mandub), the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 181 کا اقتباس جس میں مندوب، مکروہ، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 1, p. 181, dont le texte mentionne le recommandé (mandub), le réprouvé (makruh), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Mishkat al-Masabih, volumen digitalizado 1, p. 181, cuyo texto menciona lo recomendado (mandub), lo reprobado (makruh), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 181'den, tavsiye edilen, mekruh edilen ve caiz olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Bu bölüm, farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahların tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 181, yang menyebutkan amalan yang dianjurkan, yang tidak disukai, dan yang diperbolehkan; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pembaca yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
