label: { ar: "الموطأ 823 — معاوية على المنبر يوم عاشوراء عام حج: هذا يوم عاشوراء ولم يكتب الله عليكم صيامه، فمن شاء فليصم ومن شاء فليفطر", en: "Muwatta 823" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف، أنه سمع معاوية بن أبي سفيان يوم عاشوراء عام حج وهو على المنبر يقول: يا أهل المدينة أين علماؤكم؟ سمعت رسول الله يقول لهذا اليوم: هذا يوم عاشوراء ولم يكتب الله عليكم صيامه، وأنا صائم، فمن شاء فليصم ومن شاء فليفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن أبا مصعب ومالك يجعلانه من مسند عائشة وغيرهما. {cite:muwatta-maruf-1997 p.402} {cite:muwatta-maruf-1997 p.403}"
