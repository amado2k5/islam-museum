label: { ar: "الموطأ 823 — معاوية على المنبر يوم عاشوراء عام حج: هذا يوم عاشوراء ولم يكتب الله عليكم صيامه، فمن شاء فليصم ومن شاء فليفطر", en: "Muwatta 823", es: "Muwatta 823", fr: "Muwatta 823", ur: "موطا 823", tr: "El-Muvatta 823 — Muaviye, Hac yılında Aşura günü minberde: Bugün Aşura günüdür ve Allah bu günde oruç tutmanızı farz etmemiştir. Dileyen oruç tutabilir, dileyen tutmayabilir.", id: "Al-Muwatta 823 — Muawiyah di mimbar pada hari Asyura di tahun Haji: Ini adalah hari Asyura, dan Allah tidak mewajibkan puasa bagi kalian pada hari ini. Maka barangsiapa yang ingin berpuasa boleh berpuasa, dan barangsiapa yang tidak ingin berpuasa boleh berpuasa." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف، أنه سمع معاوية بن أبي سفيان يوم عاشوراء عام حج وهو على المنبر يقول: يا أهل المدينة أين علماؤكم؟ سمعت رسول الله يقول لهذا اليوم: هذا يوم عاشوراء ولم يكتب الله عليكم صيامه، وأنا صائم، فمن شاء فليصم ومن شاء فليفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن أبا مصعب ومالك يجعلانه من مسند عائشة وغيرهما. {cite:muwatta-maruf-1997 p.402} {cite:muwatta-maruf-1997 p.403}"
  tr: "Malik, İbn Şihab'dan, o da Humaid ibn Abdülrahman ibn Avf'tan rivayet ederek, Hac yaptığı yıl Aşura günü Muaviye ibn Ebu Sufyan'ın minberde şöyle dediğini işittiğini belirtmiştir: “Ey Medine halkı, alimleriniz nerede? Resulullah'ın bu günle ilgili olarak şöyle dediğini işittim: ‘Bu Aşura günüdür ve Allah size o gün oruç tutmayı farz etmemiştir, fakat ben oruç tutuyorum. Dileyen oruç tutsun, dileyen orucunu bozsun.’” Araştırmacı, Ebu Musab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve Ebu Musab ile Malik'in bunu Aişe ve diğerlerinin Musned'inden saydığını belirtmektedir. {cite:muwatta-maruf-1997 s.402} {cite:muwatta-maruf-1997 s.403}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, dari Humaid ibn Abd al-Rahman ibn Awf, bahwa ia mendengar Muawiyah ibn Abi Sufyan pada hari Asyura, pada tahun ia menunaikan ibadah haji, ketika sedang berkhutbah, beliau berkata: “Wahai penduduk Madinah, di manakah para ulama kalian? Aku mendengar Rasulullah SAW bersabda mengenai hari ini: ‘Ini adalah hari Asyura, dan Allah tidak mewajibkan puasa bagi kalian pada hari ini, tetapi aku berpuasa. Maka barangsiapa yang ingin berpuasa boleh berpuasa, dan barangsiapa yang ingin berbuka puasa boleh berbuka.’” Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkan hadits ini dari Malik, dan bahwa Abu Musab dan Malik menganggapnya berasal dari Musnad Aisyah dan lainnya. {cite:muwatta-maruf-1997 p.402} {cite:muwatta-maruf-1997 p.403}"
