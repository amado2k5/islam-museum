label: { ar: "الموطأ 1620 — مالك: لا يدخل على الرجل إيلاء في تظاهر، إلا أن يكون مضارا لا يريد أن يفيء من تظاهره", en: "Muwatta 1620", es: "Muwatta 1620", fr: "Muwatta 1620", ur: "موطا 1620", tr: "El-Muvatta 1620 — Malik: Bir kimse, Allah'a yemin etmiş gibi yaparak perhiz yemini edemez; ancak zararlı bir şekilde davranıyorsa ve bu sahte davranıştan geri dönmek istemiyorsa durum farklıdır.", id: "Al-Muwatta 1620 — Malik: Seseorang tidak dapat bersumpah untuk berpantang sambil berpura-pura bersumpah kepada Tuhan, kecuali jika ia bertindak dengan cara yang merugikan dan tidak ingin kembali dari kepura-puraannya." }
summary:
  ar: "يقول مالك لا يدخل على الرجل إيلاء في تظاهر، إلا أن يكون مضارا لا يريد أن يفيء من تظاهره. {cite:muwatta-maruf-1997 p.70}"
  tr: "Malik, bir erkeğin kötü niyetle hareket etmediği ve yeminini bozmak istemediği sürece, bir perhiz yeminiyle bağlı olamayacağını söyler. {cite:muwatta-maruf-1997 s.70}"
  id: "Malik mengatakan bahwa seseorang tidak dapat terikat oleh sumpah berpantang kecuali jika ia bertindak dengan niat jahat dan tidak ingin melanggar sumpahnya. {cite:muwatta-maruf-1997 p.70}"
