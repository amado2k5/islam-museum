label: { ar: "الموطأ 1391 — عباد بن تميم: عويمر بن أشقر ذبح ضحيته قبل أن يغدو يوم الأضحى، فأمره النبي أن يعود بضحية أخرى", en: "Muwatta 1391" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عباد بن تميم أن عويمر بن أشقر ذبح ضحيته قبل أن يغدو يوم الأضحى، وأنه ذكر ذلك لرسول الله، فأمره أن يعود بضحية أخرى. ويذكر المحقق أن ابن عبد البر رأى أن يحيى بن معين قال إن الحديث مرسل، وأن رواية حماد بن سلمة تدل على ذلك. {cite:muwatta-maruf-1997 p.621}"
