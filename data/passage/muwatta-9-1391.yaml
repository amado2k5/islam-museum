label: { ar: "الموطأ 1391 — عباد بن تميم: عويمر بن أشقر ذبح ضحيته قبل أن يغدو يوم الأضحى، فأمره النبي أن يعود بضحية أخرى", en: "Muwatta 1391", es: "Muwatta 1391", fr: "Muwatta 1391", ur: "موطا 1391", tr: "El-Muvatta 1391 — Abbad ibn Tamim: Uveymir ibn Aşkar, Kurban Bayramı günü dışarı çıkmadan önce kurbanını kesti. Bunun üzerine Peygamber ona başka bir kurbanla geri dönmesini emretti.", id: "Al-Muwatta 1391 — Abbad ibn Tamim: Uwaymir ibn Ashqar menyembelih hewan kurbannya sebelum berangkat pada hari raya Idul Adha, lalu Nabi memerintahkannya untuk kembali dengan hewan kurban lain." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عباد بن تميم أن عويمر بن أشقر ذبح ضحيته قبل أن يغدو يوم الأضحى، وأنه ذكر ذلك لرسول الله، فأمره أن يعود بضحية أخرى. ويذكر المحقق أن ابن عبد البر رأى أن يحيى بن معين قال إن الحديث مرسل، وأن رواية حماد بن سلمة تدل على ذلك. {cite:muwatta-maruf-1997 p.621}"
  tr: "Malik, Yahya ibn Sa'id'den, o da 'Abbad ibn Tamim'den rivayetle, 'Uwaymir ibn Ashqar'ın Kurban Bayramı gününden önce kurbanını kestiğini ve bunu Allah'ın Resulü'ne bildirdiğini, bunun üzerine Resulullah'ın ona başka bir kurban getirmesini emrettiğini nakletmiştir. Araştırmacı, İbn 'Abd al-Barr'ın Yahya ibn Ma'in'in bu hadisi mursal (rivayet zincirinde eksik bir halka bulunan hadis) olarak değerlendirdiğine inandığını ve Hammad ibn Salamah'ın rivayetinin de bunu desteklediğini belirtmektedir. {cite:muwatta-maruf-1997 s.621}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari 'Abbad ibn Tamim, bahwa 'Uwaymir ibn Ashqar menyembelih hewan kurbannya sebelum hari raya Idul Adha, dan bahwa ia menceritakan hal ini kepada Rasulullah, yang kemudian memerintahkannya untuk membawa kurban lain. Peneliti menyebutkan bahwa Ibn 'Abd al-Barr meyakini bahwa Yahya ibn Ma'in menganggap hadits tersebut mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa riwayat Hammad ibn Salamah mendukung hal ini. {cite:muwatta-maruf-1997 p.621}"
