text: "… ويقول ابو تمام الاستاذ، وقيل له ان الناس يزعمون انك اشعر مين لب تمام فقال والته منا ينقعنى هذا ولا يضرابا تمام واللّه ما أكلت الخبز الابه. ولما سمع أبو تمام شعره قال نعيت الى نفسى فانه ليس يطول عمرى …"
summary:
  ar: "مقطع من المنتظم في تاريخ الملوك والأمم، المجلد المصوَّر 3، ص 304، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Muntazam of Ibn al-Jawzi, scan volume 3, p. 304, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنتظم ابن الجوزی، اسکین جلد 3، ص 304 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam d'Ibn al-Jawzi, volume numérisé 3, p. 304, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen escaneado 3, p. 304, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Kralların ve Milletlerin Tarihindeki Düzenlilik), Resimli Cilt 3, sayfa 304'ten bir alıntı; ölüm ilanı ve duyurusu; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve ölüm ilanlarını tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Yang Terhormat dalam Sejarah Raja dan Bangsa-Bangsa), Jilid Bergambar 3, hlm. 304, berisi berita duka dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan berita duka yang paling terkenal."
