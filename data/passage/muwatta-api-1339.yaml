label: { ar: "موطأ مالك 1339 — ما أُحل، ما لا يحل", en: "Muwatta Malik 1339 — what was made lawful; what is not lawful", ur: "موطأ مالک 1339 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… مِنْ ذَلِكَ زِيَادَةٌ أَوْ نُقْصَانٌ أَوْ نَظِرَةٌ فَإِنْ دَخَلَ ذَلِكَ زِيَادَةٌ أَوْ نُقْصَانٌ أَوْ نَظِرَةٌ صَارَ بَيْعًا يُحِلُّهُ مَا يُحِلُّ الْبَيْعَ وَيُحَرِّمُهُ مَا يُحَرِّمُ الْبَيْعَ. قَالَ مَالِكٌ مَنْ سَلَّفَ فِي حِنْطَةٍ شَامِيَّةٍ فَلاَ بَأْسَ أَنْ يَأْخُذَ مَحْمُولَةً بَعْدَ مَحِلِّ الأَجَلِ. قَالَ مَالِكٌ وَكَذَلِكَ مَنْ سَلَّفَ فِي صِنْفٍ مِنَ الأَصْنَافِ فَلاَ بَأْسَ أَنْ يَأْخُذَ خَيْرًا مِمَّا …"
summary:
  ar: "حديث في موطأ مالك، رقم 1339، يذكر ما أُحل، وما لا يحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1339 (Business Transactions), that mentions what was made lawful, what is not lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1339، جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
