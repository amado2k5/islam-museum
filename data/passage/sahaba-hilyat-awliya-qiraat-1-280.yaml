text: "… اللّٰه تعالى عنه : يا معشر القراء أسلكوا الطريق فلئن سلكتموه لقد سبقتم سبقاً بعيدا. ولثن أخذتم يميناً وشمالا لقد ضللتم ضلالا بعيداً حدثنا محمد ابن على ثنا عبد اللّٰه بن محمد ثنا عبد اللّٰه بن الجمد أخبرنا شريك عن …"
