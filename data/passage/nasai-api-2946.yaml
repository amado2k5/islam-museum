text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا حَمَّادٌ، عَنِ الزُّبَيْرِ بْنِ عَرَبِيٍّ، قَالَ سَأَلَ رَجُلٌ ابْنَ عُمَرَ عَنِ اسْتِلاَمِ الْحَجَرِ، فَقَالَ رَأَيْتُ رَسُولَ اللَّهِ يَسْتَلِمُهُ وَيُقَبِّلُهُ. فَقَالَ الرَّجُلُ أَرَأَيْتَ إِنْ زُحِمْتُ عَلَيْهِ أَوْ غُلِبْتُ عَلَيْهِ فَقَالَ ابْنُ عُمَرَما اجْعَلْ أَرَأَيْتَ بِالْيَمَنِ رَأَيْتُ رَسُولَ اللَّهِ يَسْتَلِمُهُ وَيُقَبِّلُهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 2946، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2946 (The Book of Hajj), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 2946، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan al-Nasa'i, n.º 2946 (El Libro del Hajj), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
