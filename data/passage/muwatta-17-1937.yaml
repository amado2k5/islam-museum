label: { ar: "الموطأ 1937 — مالك: بلغه أن القاسم بن محمد سئل عن رجل اشترى سلعة بعشرة دنانير نقدا، أو بخمسة عشر دينارا إلى أجل، فكره ذلك ونهى عنه", en: "Muwatta 1937", es: "Muwatta 1937", fr: "Muwatta 1937", ur: "موطا 1937", tr: "Al-Muwatta 1937 — Malik: Ona şöyle bir rivayet ulaştı: Al-Qasim bin Muhammed'e, bir adamın on dinara nakit veya on beş dinara krediyle mal satın aldığı sorulmuş ve o da bunu hoş karşılamamış ve yasaklamıştır.", id: "Al-Muwatta 1937 — Malik: Sampai kepadanya bahwa Al-Qasim bin Muhammad ditanyai tentang seorang pria yang membeli barang seharga sepuluh dinar secara tunai, atau seharga lima belas dinar secara kredit, dan beliau tidak menyukai hal itu dan melarangnya." }
summary:
  ar: "قال مالك: وبلغه أن القاسم بن محمد سئل عن رجل اشترى سلعة بعشرة دنانير نقدا، أو بخمسة عشر دينارا إلى أجل، فكره ذلك، ونهى عنه. {cite:muwatta-maruf-1997 p.192}"
  tr: "Malik şöyle dedi: El-Kasım ibn Muhammed'e, bir adamın on dinara nakit veya on beş dinara krediyle mal satın alması hakkında soru sorulduğu ve onun bunu hoş karşılamadığı ve yasakladığı rivayet edildi. {cite:muwatta-maruf-1997 s.192}"
  id: "Malik berkata: Telah sampai kepadanya bahwa al-Qasim bin Muhammad ditanyai tentang seorang pria yang membeli barang seharga sepuluh dinar secara tunai, atau seharga lima belas dinar secara kredit, dan beliau tidak menyukai hal itu dan melarangnya. {cite:muwatta-maruf-1997 p.192}"
