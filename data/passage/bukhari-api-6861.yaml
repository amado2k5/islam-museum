label: { ar: "صحيح البخاري 6861 — ما حُرّم", en: "Sahih al-Bukhari 6861 — what was made unlawful", ur: "صحیح بخاری 6861 — جو حرام کیا گیا", es: "Sahih al-Bukhari 6861 — lo que se hizo ilícito" }
text: "… وَهْوَ خَلَقَكَ \". قَالَ ثُمَّ أَىٌّ قَالَ \" ثُمَّ أَنْ تَقْتُلَ وَلَدَكَ، أَنْ يَطْعَمَ مَعَكَ \". قَالَ ثُمَّ أَىٌّ قَالَ \" ثُمَّ أَنْ تُزَانِيَ بِحَلِيلَةِ جَارِكَ \". فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ تَصْدِيقَهَا {وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ وَلاَ يَزْنُونَ وَمَنْ يَفْعَلْ ذَلِكَ يَلْقَ أَثَامًا} الآيَةَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6861، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6861 (Blood Money (Ad-Diyat)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6861، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6861 (Dinero de sangre (Ad-Diyat)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
