label: { ar: "الموطأ 1568 — ابن شهاب: أم حكيم بنت الحارث بن هشام كانت تحت عكرمة بن أبي جهل، فأسلمت يوم الفتح، فلحقته باليمن ودعته إلى الإسلام، فأسلم، فثبتا على نكاحهما", en: "Muwatta 1568" }
summary:
  ar: "يروي مالك عن ابن شهاب أن أم حكيم بنت الحارث بن هشام، وكانت تحت عكرمة بن أبي جهل، أسلمت يوم الفتح، وهرب زوجها عكرمة من الإسلام حتى قدم اليمن، فارتحلت أم حكيم حتى قدمت عليه باليمن، فدعته إلى الإسلام، فأسلم، وقدم على رسول الله عام الفتح، فلما رآه رسول الله رحب به فرحا، حتى بايعه، فثبتا على نكاحهما ذلك. {cite:muwatta-maruf-1997 p.53}"
