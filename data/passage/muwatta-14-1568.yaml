label: { ar: "الموطأ 1568 — ابن شهاب: أم حكيم بنت الحارث بن هشام كانت تحت عكرمة بن أبي جهل، فأسلمت يوم الفتح، فلحقته باليمن ودعته إلى الإسلام، فأسلم، فثبتا على نكاحهما", en: "Muwatta 1568", es: "Muwatta 1568", fr: "Muwatta 1568", ur: "موطا 1568", tr: "El-Muvatta 1568 — İbn Şihab: Ümmü Hakim bint el-Harith ibn Hişam, İkrime ibn Abi Cehl ile evliydi. Fetih gününde İslam'ı kabul etti, bu yüzden Yemen'de ona yetişti ve onu İslam'a davet etti, o da İslam'ı kabul etti ve evlilikleri devam etti.", id: "Al-Muwatta 1568 — Ibn Shihab: Umm Hakim bint al-Harith ibn Hisham menikah dengan Ikrimah ibn Abi Jahl. Ia memeluk Islam pada hari penaklukan, sehingga ia bertemu dengannya di Yaman dan mengajaknya masuk Islam, dan ia pun memeluk Islam, dan mereka tetap menikah." }
summary:
  ar: "يروي مالك عن ابن شهاب أن أم حكيم بنت الحارث بن هشام، وكانت تحت عكرمة بن أبي جهل، أسلمت يوم الفتح، وهرب زوجها عكرمة من الإسلام حتى قدم اليمن، فارتحلت أم حكيم حتى قدمت عليه باليمن، فدعته إلى الإسلام، فأسلم، وقدم على رسول الله عام الفتح، فلما رآه رسول الله رحب به فرحا، حتى بايعه، فثبتا على نكاحهما ذلك. {cite:muwatta-maruf-1997 p.53}"
  tr: "Malik, İbn Şihab'dan rivayetle, İkrime ibn Abi Cehl ile evli olan Ümmü Hakim bint el-Haris ibn Hişam'ın Mekke'nin fethi günü İslam'ı kabul ettiğini anlatır. Kocası İkrime, Yemen'e ulaşana kadar İslam'dan kaçtı. Ümmü Hakim Yemen'e gitti ve orada onunla karşılaştı. Onu İslam'a davet etti ve o da kabul etti. Daha sonra fetih yılında Allah'ın Resulü'nün huzuruna çıktı. Allah'ın Resulü onu görünce sevinçle karşıladı ve biatını kabul etti. O zamana kadar evli kaldılar. {cite:muwatta-maruf-1997 s.53}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa Umm Hakim binti al-Harit binti Hisham, yang menikah dengan Ikrimah binti Abi Jahl, memeluk Islam pada hari penaklukan Mekah. Suaminya, Ikrimah, melarikan diri dari Islam hingga sampai di Yaman. Umm Hakim pergi ke Yaman dan bertemu dengannya di sana. Ia mengajaknya masuk Islam, dan ia menerimanya. Kemudian ia datang kepada Rasulullah pada tahun penaklukan. Ketika Rasulullah melihatnya, beliau menyambutnya dengan gembira dan menerima baiatnya. Mereka tetap menikah pada saat itu. {cite:muwatta-maruf-1997 p.53}"
