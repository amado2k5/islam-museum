text: "… فعبدنا اللّٰه تعالى وحده ولم نشرك به شيئًا وحرَّمنا ما حرم اللّٰه علينا وأَحللنا ما أَحلَّ لنا فعدا علينا قومُنا فعذَّبونا وفتَنونا عن ديننا ليردُّونا إلى عبادة الأَوثان من عبادة اللّٰه وأَن نستحل ما كنا نستحل من الخبائث، فلما قهرونا …"
summary:
