text: "… كيف تعرف النساء والرجال؟ كان يوماً في مكان وقد ذكروا أن سُيَّاحاً أتوا حديثاً من بلاد العرب، وقالوا له : إن أهل تلك البلاد يظلّون عُراةً لشدَّة الحرّ فيها... فأجابهم الشيخ: عجباً وكيف تعرف الرجال من النساء هناك؟ ليعلم قدر …"
summary:
  ar: "قيل لجحا إن الناس في بلاد العرب يمشون عراة من شدة الحر، فسأل كيف يُعرف الرجال من النساء هناك. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  en: "Told that people in Arab lands go naked from the heat, Juha asks how one can tell men from women there. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  ur: "جحا سے کہا گیا کہ عرب ملکوں میں شدید گرمی کی وجہ سے لوگ برہنہ پھرتے ہیں، تو اس نے پوچھا کہ وہاں مردوں اور عورتوں میں فرق کیسے کیا جاتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  fr: "On dit à Juha que dans les pays arabes les gens vont nus à cause de la chaleur; il demande comment on y distingue les hommes des femmes. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  es: "Le dicen a Juha que en las tierras árabes la gente anda desnuda por el calor; él pregunta cómo se distingue allí a los hombres de las mujeres. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
