text: "أمون بغداد، استدعى طاهرا وولى ابنه عبدالله بن طاهر خراسان، وكتب له كتابا مشهورا يوصيه فيه بمحاربة نصر، فجد في حربه وحاصره حتى طلب الأمان. وكان المأمون قد ندب إليه من يؤمنه، فأجاب على ألا يطأ بساط المأمون فأب الخليفة،"
