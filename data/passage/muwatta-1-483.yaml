label: { ar: "الموطأ 483 — عطاء بن يسار لمن يبيع في المسجد: عليك بسوق الدنيا، فإنما هذا سوق الآخرة", en: "Muwatta 483", es: "Muwatta 483", fr: "Muwatta 483", ur: "موطا 483", tr: "El-Muvatta 483 — Ata' ibn Yasar, mescitte satış yapan birine şöyle diyor: \"Sen bu dünyanın pazarında ticaret yapmalısın, çünkü bu ahiretin pazarıdır.\"", id: "Al-Muwatta 483 — Ata’ ibn Yasar kepada seseorang yang berjualan di masjid: Hendaklah kamu berjualan di pasar dunia ini, karena inilah pasar akhirat." }
text: "عليك بسوق الدنيا، فإنما هذا سوق الآخرة"
summary:
  ar: "بلاغ في باب جامع الصلاة: يروي مالك أنه بلغه أن عطاء بن يسار كان إذا مر عليه بعض من يبيع في المسجد دعاه وسأله ما معه وما يريد، فإن أخبره أنه يريد أن يبيعه قال له: عليك بسوق الدنيا، فإنما هذا سوق الآخرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.248}"
  tr: "Kapsamlı namaz bölümüyle ilgili bir rivayette Malik şöyle anlatmıştır: Mescitte bir şey satan biri geçtiğinde, Ata ibn Yasar onu yanına çağırır ve elinde ne olduğunu, ne istediğini sorardı. Satıcı bir şey satmak istediğini söylerse, Ata ona, \"Bu dünyanın pazarına git, çünkü bu ahiretin pazarıdır\" derdi. Araştırmacı, bunu Malik'ten Ebu Mus'ab ve Suveyd'in rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.248}"
  id: "Sebuah laporan mengenai bab tentang shalat lengkap: Malik meriwayatkan bahwa ia mendengar bahwa ketika seseorang yang berjualan di masjid lewat, Ata bin Yasar akan memanggilnya dan bertanya apa yang ia jual dan apa yang ia inginkan. Jika penjual itu mengatakan bahwa ia ingin menjual sesuatu, Ata akan berkata kepadanya, \"Pergilah ke pasar dunia ini, karena inilah pasar akhirat.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.248}"
