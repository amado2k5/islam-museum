text: "عليك بسوق الدنيا، فإنما هذا سوق الآخرة"
summary:
  ar: "بلاغ في باب جامع الصلاة: يروي مالك أنه بلغه أن عطاء بن يسار كان إذا مر عليه بعض من يبيع في المسجد دعاه وسأله ما معه وما يريد، فإن أخبره أنه يريد أن يبيعه قال له: عليك بسوق الدنيا، فإنما هذا سوق الآخرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.248}"
