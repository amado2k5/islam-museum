label: { ar: "صحيح البخاري 2703 — الفرض", en: "Sahih al-Bukhari 2703 — the obligatory (fard)", ur: "صحیح بخاری 2703 — فرض", fr: "Sahih al-Bukhari 2703 — l'obligatoire (fard)", es: "Sahih al-Bujari 2703 — lo obligatorio (fard)", tr: "Sahih el-Buhari 2703 — Vacip", id: "Sahih al-Bukhari 2703 — Kewajiban" }
text: "… النَّبِيَّ فَأَمَرَهُمْ بِالْقِصَاصِ. فَقَالَ أَنَسُ بْنُ النَّضْرِ أَتُكْسَرُ ثَنِيَّةُ الرُّبَيِّعِ يَا رَسُولَ اللَّهِ لاَ وَالَّذِي بَعَثَكَ بِالْحَقِّ لاَ تُكْسَرُ ثَنِيَّتُهَا فَقَالَ \" يَا أَنَسُ كِتَابُ اللَّهِ الْقِصَاصُ \". فَرَضِيَ الْقَوْمُ وَعَفَوْا فَقَالَ النَّبِيُّ \" إِنَّ مِنْ عِبَادِ اللَّهِ مَنْ لَوْ أَقْسَمَ عَلَى اللَّهِ لأَبَرَّهُ \". زَادَ الْفَزَارِيُّ عَنْ حُمَيْدٍ عَنْ أَنَسٍ فَرَضِيَ الْقَوْمُ وَقَبِلُوا الأَرْشَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2703، يرد فيه ذكر الفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 2703 (Peacemaking), whose wording mentions the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 2703، جس کے الفاظ میں فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2703, dont le texte mentionne l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 2703, cuyo texto menciona lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 2703 numaralı hadis, farz olan amellerden bahsetmektedir. Bu hadis, farz, görev, itaat, tavsiye edilen, mekruh edilen, haram olan ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2703, menyebutkan tentang amalan-amalan wajib. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan-amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
