summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن أسامة بن زيد سئل وهو جالس معه كيف كان رسول الله يسير حين دفع في حجة الوداع، فقال كان يسير العنق، فإذا وجد فرجة نص. قال مالك قال هشام: والنص فوق العنق. {cite:muwatta-maruf-1997 p.525}"
