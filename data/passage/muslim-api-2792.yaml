label: { ar: "صحيح مسلم 2792 — الأب والأبوة", en: "Sahih Muslim 2792 — the father and fatherhood", ur: "صحیح مسلم 2792 — باپ اور والدیت", es: "Sahih Muslim 2792 — El padre y la paternidad", fr: "Sahih Muslim 2792 — Le père et la paternité" }
text: "… حَرْبٍ، كُلُّهُمْ عَنِ ابْنِ عُيَيْنَةَ، - قَالَ يَحْيَى أَخْبَرَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، - عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، - - قَالَ سُئِلَ النَّبِيُّ مَا يَلْبَسُ الْمُحْرِمُ قَالَ \" لاَ يَلْبَسُ الْمُحْرِمُ الْقَمِيصَ وَلاَ الْعِمَامَةَ وَلاَ الْبُرْنُسَ وَلاَ السَّرَاوِيلَ وَلاَ ثَوْبًا مَسَّهُ وَرْسٌ وَلاَ زَعْفَرَانٌ وَلاَ الْخُفَّيْنِ إِلاَّ أَنْ لاَ يَجِدَ نَعْلَيْنِ فَلْيَقْطَعْهُمَا حَتَّى يَكُونَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2792، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2792 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2792، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2792 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2792 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
