text: "… أَن اليهود إذا ملكهم المسلم ببيع أَو سبي فإنه يدعوهم إلى الإسلام، فإِن أَبوا إلا التمسك بدينهم، فإن المسلم إن شاءَ باعهم من أَهل الذمة، ولا يبيعهم من أَحد من أَهل الحرب، وإن كانوا على غير دين مثل الهند والزنج، …"
summary:
