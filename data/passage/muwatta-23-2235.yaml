label: { ar: "الموطأ 2235 — مالك: الأمر عندنا أن الوالد يحاسب ولده بما أنفق عليه من يوم يكون للولد مال، ناضا كان أو عرضا، إن أراد الوالد ذلك", en: "Muwatta 2235", es: "Muwatta 2235", fr: "Muwatta 2235", ur: "موطا 2235", tr: "El-Muvatta 2235 — Malik: Bizim meselemiz şudur ki, baba, oğlunun paraya sahip olduğu günden itibaren, ister nakit ister mal olsun, eğer baba dilerse, oğluna yaptığı harcamalardan sorumludur.", id: "Al-Muwatta 2235 — Malik: Masalahnya di antara kita adalah bahwa seorang ayah bertanggung jawab kepada anaknya atas apa yang telah ia berikan kepadanya sejak anaknya memiliki uang, baik berupa uang tunai maupun barang, jika sang ayah menginginkannya." }
summary:
  ar: "قال: وسمعت مالكا يقول: الأمر عندنا أن الوالد يحاسب ولده بما أنفق عليه من يوم يكون للولد مال، ناضا كان أو عرضا، إن أراد الوالد ذلك. {cite:muwatta-maruf-1997 p.319}"
  tr: "Şöyle dedi: Ve Malik'in şöyle dediğini duydum: Bizim meselemiz şudur ki, baba, oğlunun parası olduğu günden itibaren, ister nakit ister mal olsun, babanın dilediği takdirde, oğluna yaptığı harcamalardan sorumludur. {cite:muwatta-maruf-1997 s.319}"
  id: "Dia berkata: Dan aku mendengar Malik berkata: Masalahnya di sini adalah bahwa seorang ayah bertanggung jawab kepada anaknya atas apa yang telah ia belanjakan untuk anaknya sejak hari anaknya memiliki uang, baik itu uang tunai atau barang, jika sang ayah menginginkannya. {cite:muwatta-maruf-1997 p.319}"
