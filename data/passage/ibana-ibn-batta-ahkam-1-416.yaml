text: "… الواجب عليه حين وفد على إمامه أن يشتغل بعلم الفرائض والواجبات والتفقه في الدين من الحلال والحرام فلما بلغ عمر أن مسائله غير هذا علم من قبل أن يلقاه أنه رجل بطال القلب خالي الهمة عما افترضه اللّٰه عليه مصروف …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 416، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والواجب، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 416, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (wajib), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 416 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، واجب، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volume numérisé 1, p. 416, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (wajib), l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volumen digitalizado 1, p. 416, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (wajib), lo prohibido (haram); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1, s. 416) adlı eserinden, farz ve haram olan amelleri ve görevleri, Allah ve Resulü'nün emrettiği şeyleri anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Iman, Jilid 1 Bergambar, hlm. 416, yang menyebutkan amalan dan kewajiban wajib, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, yang wajib, dan yang haram; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
