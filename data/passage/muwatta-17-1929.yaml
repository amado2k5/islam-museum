label: { ar: "الموطأ 1929 — مالك: فيمن سلف دنانير أو دراهم في أربعة أثواب موصوفة إلى أجل، فلما حل الأجل لم يجدها عنده، ووجد عنده ثيابا دونها من صنفها، فيعطيه ثمانية أثواب من ثيابه بها، فلا بأس إن أخذ الأثواب قبل أن يفترقا، ولا يصلح بعد الأجل أو قبله إلا أن تكون من صنف غير صنف ما سلف", en: "Muwatta 1929" }
summary:
  ar: "قال مالك فيمن سلف دنانير أو دراهم في أربعة أثواب موصوفة إلى أجل، فلما حل الأجل تقاضى صاحبها، فلم يجدها عنده، ووجد عنده ثيابا دونها من صنفها، فقال له الذي عليه الأثواب: أعطيك بها ثمانية أثواب من ثيابي هذه. فإنه لا بأس بذلك، إذا أخذ تلك الأثواب التي يعطيه قبل أن يفترقا. قال مالك: فإن دخل ذلك الأجل فإنه لا يصلح، وإن كان ذلك قبل محل الأجل فإنه لا يصلح أيضا، إلا أن يبيعه ثيابا ليست من صنف الثياب التي سلفه فيها. {cite:muwatta-maruf-1997 p.190}"
