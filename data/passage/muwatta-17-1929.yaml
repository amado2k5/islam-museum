label: { ar: "الموطأ 1929 — مالك: فيمن سلف دنانير أو دراهم في أربعة أثواب موصوفة إلى أجل، فلما حل الأجل لم يجدها عنده، ووجد عنده ثيابا دونها من صنفها، فيعطيه ثمانية أثواب من ثيابه بها، فلا بأس إن أخذ الأثواب قبل أن يفترقا، ولا يصلح بعد الأجل أو قبله إلا أن تكون من صنف غير صنف ما سلف", en: "Muwatta 1929", es: "Muwatta 1929", fr: "Muwatta 1929", ur: "موطا 1929", tr: "El-Muvatta 1929 — Malik: Bir kimse, belirli dört giysiyi daha sonra teslim edilmek üzere dinar veya dirhem ödünç vermişse ve teslim tarihi geldiğinde giysileri bulamamış, ancak aynı türden daha düşük kaliteli giysiler bulmuşsa, karşılığında kendi giysilerinden sekiz tanesini vermelidir. Ayrılmadan önce giysileri almasında bir sakınca yoktur. Bu, teslim tarihinden önce veya sonra caiz değildir, ancak ödünç verilenlerden farklı türde giysiler bulunması şartıyla.", id: "Al-Muwatta 1929 — Malik: Mengenai seseorang yang meminjamkan dinar atau dirham untuk empat pakaian tertentu yang akan dikembalikan di kemudian hari, dan ketika tanggal jatuh tempo tiba ia tidak menemukan pakaian tersebut, tetapi menemukan pakaian dengan kualitas lebih rendah tetapi jenis yang sama, maka ia harus memberikan delapan pakaian miliknya sendiri sebagai gantinya. Tidak ada salahnya jika ia mengambil pakaian tersebut sebelum mereka berpisah. Hal ini tidak diperbolehkan setelah atau sebelum tanggal jatuh tempo kecuali jika pakaian tersebut berbeda jenis dengan yang dipinjamkan." }
summary:
  ar: "قال مالك فيمن سلف دنانير أو دراهم في أربعة أثواب موصوفة إلى أجل، فلما حل الأجل تقاضى صاحبها، فلم يجدها عنده، ووجد عنده ثيابا دونها من صنفها، فقال له الذي عليه الأثواب: أعطيك بها ثمانية أثواب من ثيابي هذه. فإنه لا بأس بذلك، إذا أخذ تلك الأثواب التي يعطيه قبل أن يفترقا. قال مالك: فإن دخل ذلك الأجل فإنه لا يصلح، وإن كان ذلك قبل محل الأجل فإنه لا يصلح أيضا، إلا أن يبيعه ثيابا ليست من صنف الثياب التي سلفه فيها. {cite:muwatta-maruf-1997 p.190}"
  tr: "Malik, bir kimsenin belirli dört giysi için dinar veya dirhem borç verdiğini ve bunların daha sonra teslim edileceğini, vade tarihi geldiğinde borç verenin ödeme talep ettiğini ancak giysileri yanında bulamadığını, bunun yerine daha düşük kalitede ancak aynı türden başka giysiler bulduğunu ve borç verenin \"Karşılığında sana bu giysilerimden sekizini vereceğim\" dediğini anlattı. Malik, borç verenin ayrılmadan önce verdiği giysileri alması şartıyla bunun caiz olduğunu söyledi. Malik, vade tarihi geçmişse bunun caiz olmadığını, vade tarihinden önce geçmişse de, borç verdiği giysilerle aynı türden olmayan giysiler satması şartıyla caiz olmadığını ekledi. {cite:muwatta-maruf-1997 s.190}"
  id: "Malik berkata tentang seseorang yang meminjamkan dinar atau dirham untuk empat pakaian tertentu yang akan dikirimkan di kemudian hari, dan ketika tanggal jatuh tempo tiba, pemberi pinjaman meminta pembayaran tetapi tidak menemukan pakaian tersebut, melainkan menemukan pakaian lain yang kualitasnya lebih rendah tetapi jenisnya sama. Pemberi pinjaman kemudian berkata, \"Saya akan memberikan delapan pakaian saya ini sebagai gantinya.\" Malik mengatakan bahwa ini diperbolehkan, asalkan pemberi pinjaman mengambil pakaian yang ditawarkannya sebelum mereka berpisah. Malik menambahkan bahwa jika tanggal jatuh tempo telah lewat, ini tidak diperbolehkan, dan jika telah lewat sebelum tanggal jatuh tempo, itu juga tidak diperbolehkan, kecuali jika ia menjual pakaian yang bukan jenisnya sama dengan pakaian yang dipinjamkan uangnya. {cite:muwatta-maruf-1997 p.190}"
