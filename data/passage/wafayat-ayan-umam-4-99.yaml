text: "… فنوالحرث قال رعاة للقديم كسرى وسكن هو راانى وجاة عن الحرم قال فعك قال ليوث جاهدة فى قلوب فاسدة قال فتغاب قال يصدفون اذا لقواضريا أن مات فيها ودفن ما ويسعرون للاعداء حر باقال فغسان قال أكرم العرب احسابا واثيتها …"
