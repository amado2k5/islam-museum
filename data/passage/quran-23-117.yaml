text: "وَمَن يَدْعُ مَعَ ٱللَّهِ إِلَـٰهًا ءَاخَرَ لَا بُرْهَـٰنَ لَهُۥ بِهِۦ فَإِنَّمَا حِسَابُهُۥ عِندَ رَبِّهِۦٓ ۚ إِنَّهُۥ لَا يُفْلِحُ ٱلْكَـٰفِرُونَ"
text_search: "ومن يدع مع الله إلها آخر لا برهان له به فإنما حسابه عند ربه ۚ إنه لا يفلح الكافرون"
translations:
  en: { text: "He who crieth unto any other god along with Allah hath no proof thereof. His reckoning is only with his Lord. Lo! disbelievers will not be successful.", translator: "Marmaduke Pickthall", license: PD }
