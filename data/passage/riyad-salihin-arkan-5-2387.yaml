text: "… أَوْ لِيَصْمُتْ وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يُؤْذِ جَارَهُ وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 5، ص 2387، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 5, p. 2387, that mentions an act tied to belief in God and the Last Day; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 5، ص 2387 کا اقتباس جس میں اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen 5, pág. 2387, que menciona un acto relacionado con la creencia en Dios y el Último Día; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Riyad al-Salihin d'al-Nawawi, volume 5, page 2387, mentionnant un acte lié à la croyance en Dieu et au Jour dernier; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le répertoire « Piliers et branches de la foi »."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin 5. resimli cildinin 2387. sayfasında, Allah'a ve Ahiret Günü'ne olan imanla ilgili bir olaydan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Riyad as-Salihin karya an-Nawawi, jilid 5 bergambar, halaman 2387, menyebutkan sebuah perbuatan yang berkaitan dengan iman kepada Tuhan dan Hari Kiamat; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
