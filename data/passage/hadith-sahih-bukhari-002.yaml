text: "بكتاب رسول الله لل قريء، فإذا فيه: (بسم الله الرحمن الرحيم، من محمد عبد الله ورسوله إلى هرقل عظيم الروم سلام على من اتبع الهدى، أما بعد، فإني أدعوك بداعية الإسلام، أسلم تسلم، وأسلم يؤتك الله أجرك مرتين، فإن توليت"
