text: "ذاك رجل لا يتوسد القرآن الذاكر اللّٰه في الغافلين، كالمقاتل خلف الفارين ذكر اللّه بالغدو والعشي، أفضل من حطم السيوف ذكر الموت وغمه وكربه وعلزه، فقال ذكر لرسول اللٰه وَال يه ا مرأة صوامة قوامة مصلية ذكر لمسلم بن يسار …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 2، ص 528، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 2, p. 528, that mentions what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 2، ص 528 کا اقتباس جس میں ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ibn al-Mubarak, volumen 2, pág. 528, que menciona lo que quedó: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Kitab al-Zuhd d'Ibn al-Mubarak, tome 2, page 528, mentionnant le patrimoine et l'héritage. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur Testaments."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 528. sayfasından, mal varlığı ve mirasından bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Kemaksiatan), Jilid 2, halaman 528, yang menyebutkan harta dan warisannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
