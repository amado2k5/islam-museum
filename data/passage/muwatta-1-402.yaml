label: { ar: "الموطأ 402 — سعيد بن المسيب: من أجمع إقامة أربع ليال أتم", en: "Muwatta 402", es: "Muwatta 402", fr: "Muwatta 402", ur: "موطا 402", tr: "Al-Muwatta 402 — Sa'id ibn al-Musayyab: Kim dört gece kalmayı dilerse, bu geceyi tamamlar.", id: "Al-Muwatta 402 — Sa’id ibn al-Musayyab: Siapapun yang berniat menginap empat malam, maka lengkaplah" }
text: "من أجمع إقامة أربع ليال وهو مسافر أتم الصلاة"
summary:
  ar: "أول أثر في باب صلاة المسافر إذا أجمع مكثاً. يرويه يحيى عن مالك عن عطاء الخراساني أنه سمع سعيد بن المسيب يقول إن من عزم على إقامة أربع ليال وهو مسافر أتم الصلاة؛ ويقول مالك إن ذلك أحب ما سمع إليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.212} {cite:muwatta-maruf-1997 p.213}"
  tr: "Dört gece kalmayı niyet eden bir yolcunun namazıyla ilgili ilk hadis, Yahya'nın Malik'ten, o da Ata el-Horasani'den rivayet ettiğine göre, Sa'id ibn el-Musayyab'ın şöyle dediğini işitmiştir: \"Kim yolculukta dört gece kalmayı niyet ederse, tam namaz kılmalıdır.\" Malik, bunun işittiği en sevdiği hadis olduğunu söylemiştir. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Abd el-Razzaq ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Bayhaqi tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.212} {cite:muwatta-maruf-1997 s.213}"
  id: "Hadits pertama mengenai salat musafir yang berniat tinggal selama empat malam diriwayatkan oleh Yahya dari Malik, dari Ata al-Khorasani, yang mendengar Sa'id ibn al-Musayyab berkata bahwa siapa pun yang berniat tinggal selama empat malam saat bepergian hendaknya melaksanakan salat lengkap. Malik berkata bahwa ini adalah hadits yang paling dicintai yang pernah didengarnya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, Abd al-Razzaq, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.212} {cite:muwatta-maruf-1997 p.213}"
