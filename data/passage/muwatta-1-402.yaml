label: { ar: "الموطأ 402 — سعيد بن المسيب: من أجمع إقامة أربع ليال أتم", en: "Muwatta 402" }
text: "من أجمع إقامة أربع ليال وهو مسافر أتم الصلاة"
summary:
  ar: "أول أثر في باب صلاة المسافر إذا أجمع مكثاً. يرويه يحيى عن مالك عن عطاء الخراساني أنه سمع سعيد بن المسيب يقول إن من عزم على إقامة أربع ليال وهو مسافر أتم الصلاة؛ ويقول مالك إن ذلك أحب ما سمع إليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.212} {cite:muwatta-maruf-1997 p.213}"
