label: { ar: "جامع الترمذي 657 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 657 — what was made lawful; what is not lawful", ur: "جامع ترمذی 657 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 657 — lo que se ha hecho lícito; lo que no es lícito" }
text: "… اصْحَبْنِي كَيْمَا تُصِيبَ مِنْهَا. فَقَالَ لاَ. حَتَّى آتِيَ رَسُولَ اللَّهِ فَأَسْأَلَهُ. فَانْطَلَقَ إِلَى النَّبِيِّ فَسَأَلَهُ فَقَالَ \" إِنَّ الصَّدَقَةَ لاَ تَحِلُّ لَنَا وَإِنَّ مَوَالِيَ الْقَوْمِ مِنْ أَنْفُسِهِمْ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَأَبُو رَافِعٍ مَوْلَى النَّبِيِّ اسْمُهُ أَسْلَمُ وَابْنُ أَبِي رَافِعٍ هُوَ عُبَيْدُ اللَّهِ بْنُ أَبِي رَافِعٍ كَاتِبُ عَلِيِّ بْنِ أَبِي طَالِبٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 657، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 657 (The Book on Zakat), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 657، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 657 (El Libro del Zakat), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
