label: { ar: "الموطأ 542 — الحارث بن هشام يسأل: كيف يأتيك الوحي؟", en: "Muwatta 542", es: "Muwatta 542", fr: "Muwatta 542", ur: "موطا 542", tr: "Al-Muwatta 542 — Al-Harith bin Hisham soruyor: Vahiy size nasıl geliyor?", id: "Al-Muwatta 542 — Al-Harith bin Hisham bertanya: Bagaimana wahyu datang kepadamu?" }
text: "أحياناً يأتيني مثل صلصلة الجرس، وهو أشده علي، فيفصم عني وقد وعيت ما قال. وأحياناً يتمثل لي الملك رجلاً، فيكلمني فأعي ما يقول"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، أن الحارث بن هشام سأل النبي كيف يأتيه الوحي، فأخبره أنه يأتيه أحياناً مثل صلصلة الجرس وهو أشده عليه، فيفصم عنه وقد وعى ما قيل، وأحياناً يتمثل له الملك رجلاً فيكلمه فيعي ما يقول. وتضيف عائشة أنها رأت الوحي ينزل عليه في اليوم الشديد البرد، فيفصم عنه وإن جبينه ليتفصد عرقاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والتنيسي عند البخاري (2)، ومعن عند الترمذي (3634)، وأن نسخة م تقول «في مثل صلصلة الجرس». {cite:muwatta-maruf-1997 p.279}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Aişe'den rivayet ettiğine göre, el-Harith ibn Hişam, Peygamber'e vahyin kendisine nasıl geldiğini sormuş. Peygamber ona, bazen kendisine çan sesi gibi geldiğini, bunun kendisi için en zor olanı olduğunu ve ses kesildiğinde söylenenleri anladığını söylemiş. Bazen de melek ona insan suretinde görünüp onunla konuştuğunu ve söylediklerini anladığını belirtmiş. Aişe ise, vahyin çok soğuk bir günde kendisine indiğini ve ses kesildiğinde alnından ter damladığını gördüğünü eklemiş. Editör, bunun Malik'ten Ebu Musab tarafından, onun aracılığıyla da İbn Hibban, el-Baghawi ve el-Tunisi tarafından Buhari'de (2) ve Ma'n tarafından Tirmizi'de (3634) rivayet edildiğini ve M el yazmasının \"çan sesi gibi\" dediğini belirtiyor. {cite:muwatta-maruf-1997 s.279}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, bahwa al-Harith ibn Hisham bertanya kepada Nabi bagaimana wahyu datang kepadanya. Nabi memberitahunya bahwa terkadang wahyu datang kepadanya seperti denting lonceng, yang merupakan hal paling sulit baginya, dan ketika berhenti, dia telah mengerti apa yang dikatakan. Terkadang malaikat menampakkan diri kepadanya dalam wujud manusia dan berbicara kepadanya, dan dia mengerti apa yang dikatakannya. Aisyah menambahkan bahwa dia melihat wahyu turun kepadanya pada hari yang sangat dingin, dan ketika berhenti, dahinya meneteskan keringat. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, dan melalui dia oleh Ibn Hibban, al-Baghawi, dan al-Tunisi dalam al-Bukhari (2), dan oleh Ma'n dalam al-Tirmidhi (3634), dan bahwa manuskrip M mengatakan, \"seperti denting lonceng.\" {mengutip:muwatta-maruf-1997 hal.279}"
