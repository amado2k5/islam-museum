label: { ar: "الموطأ 542 — الحارث بن هشام يسأل: كيف يأتيك الوحي؟", en: "Muwatta 542" }
text: "أحياناً يأتيني مثل صلصلة الجرس، وهو أشده علي، فيفصم عني وقد وعيت ما قال. وأحياناً يتمثل لي الملك رجلاً، فيكلمني فأعي ما يقول"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، أن الحارث بن هشام سأل النبي كيف يأتيه الوحي، فأخبره أنه يأتيه أحياناً مثل صلصلة الجرس وهو أشده عليه، فيفصم عنه وقد وعى ما قيل، وأحياناً يتمثل له الملك رجلاً فيكلمه فيعي ما يقول. وتضيف عائشة أنها رأت الوحي ينزل عليه في اليوم الشديد البرد، فيفصم عنه وإن جبينه ليتفصد عرقاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والتنيسي عند البخاري (2)، ومعن عند الترمذي (3634)، وأن نسخة م تقول «في مثل صلصلة الجرس». {cite:muwatta-maruf-1997 p.279}"
