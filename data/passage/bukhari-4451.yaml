label: { ar: "البخاري 4451 — آخر كلامه: في الرفيق الأعلى", en: "Bukhari 4451 — His last words: with the highest Companion" }
text: "توفي النبي في بيتي وفي يومي وبين سحري ونحري، وكانت إحدانا تعوذه بدعاء إذا مرض، فذهبت أعوذ به فرفع رأسه إلى السماء وقال: «في الرفيق الأعلى، في الرفيق الأعلى»"
summary:
  ar: "في كتاب المغازي؛ رواية عائشة في آخر لحظات الوفاة: النظر إلى السماء وتكرار «في الرفيق الأعلى» إجابة للخيار الذي عرض عليه، ودفنه في بيتها حيث مات. من أشهر نصوص الوفاة."
