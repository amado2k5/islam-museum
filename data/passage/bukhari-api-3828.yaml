label: { ar: "صحيح البخاري 3828 — الأب والأبوة", en: "Sahih al-Bukhari 3828 — the father and fatherhood", ur: "صحیح بخاری 3828 — باپ اور والدیت", es: "Sahih al-Bukhari 3828 — El padre y la paternidad", fr: "Sahih al-Bukhari 3828 — le père et la paternité" }
text: "وَقَالَ اللَّيْثُ كَتَبَ إِلَىَّ هِشَامٌ عَنْ أَبِيهِ، عَنْ أَسْمَاءَ بِنْتِ أَبِي بَكْرٍما ـ قَالَتْ رَأَيْتُ زَيْدَ بْنَ عَمْرِو بْنِ نُفَيْلٍ قَائِمًا مُسْنِدًا ظَهْرَهُ إِلَى الْكَعْبَةِ يَقُولُ يَا مَعَاشِرَ قُرَيْشٍ، وَاللَّهِ مَا مِنْكُمْ عَلَى دِينِ إِبْرَاهِيمَ غَيْرِي، وَكَانَ يُحْيِي الْمَوْءُودَةَ، يَقُولُ لِلرَّجُلِ إِذَا أَرَادَ أَنْ يَقْتُلَ ابْنَتَهُ لاَ تَقْتُلْهَا، أَنَا أَكْفِيكَهَا مَئُونَتَهَا. فَيَأْخُذُهَا فَإِذَا تَرَعْرَعَتْ قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3828، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3828 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3828، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3828 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3828 (Mérites des Compagnons de Médine (Ansar)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
