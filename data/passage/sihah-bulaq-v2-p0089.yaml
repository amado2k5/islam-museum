text: |-
  ٤٩٨
  وفى المثسل انّ الموصين بنوسهوان معناه أنك لا تحتاج الى أن يوصى الامن كان عافلاساهد
  والسهو الغفلة وقدسهاعن الشيهونهوساءوسهوان أيوغمرويقال عليه من المال
  ما لا يسهى ولا ينهى أى لا تبلغ غايته وجات المرأة سهوا اذاحبلت على حيض ( ي سية
  القوس ماعطف من طرقيهما والجمع سيات والهاء فى الواحدعوض من الواو والنسبة اليها
  سيوىّ قال أبو عبيسدة كان رؤبة بن العجاج يم مؤسية القوس وسائر العرب لايممزونها
  ، الفراء بقال هوفى سى رأسه وفى سواء رأسه اذا كان فى الهمة قال أبو عبيد وقد يفسرسى
  رأسه عدد شعرهمن الخير قال ذو الرمّة
  كأنه خاضب بالسى مرقعه • أبوثلاثين أفسى وهومنقلب
  والسى أرض من أراضى العرب وقد تكون المفازة والسيان المثلان الواحدسى" قال
  الحطبتة
  فاباكم وحبة بطن واد * هموز الذاب ليس لكم إسى
  يريد تعظيمه وقولهم لاسما كاف يستنى بها وهوسى ضم اليه ما والاسم الذى بعدما للفيه
  وجهان ان شئت جعلت ما ينزلة الذى وأضحرت مبتد أورفعت الاسم الذى تذكره ظبر المبتدا
  تقول جانى القوم لاسما أخوك أى ولاسىّ الذى هو أخوك وان شنت جروت ما بعده على أن
  تجعل ما زائدة وتجرّ الاسم بسى لانّ معنى سى معنى مثل وينشدفول امرئ الغيس
  الارب يوم لك منهن صالح ولاسمايوم بدارة جلجل
  مجروراومر فوعاوتول اضر بن القوم ولاسيما أخيك أى ولامثسل ضربة أخيك وان قات
  ولا سيما أخرك أى ولامشل الذى هوأخوك تجعل ما بعنى الذى وتضمرهو ونجعله مبتدأ
  وأخوك خبره قال الاخفس قولهم ان فلاناكريم ولاسمنا ان أتيمه قاعدافان ماههما زائدة
  لا تكون من الاصل وحذف هنا الأضما روصار ماعوضامنه كانه قال ولا مذ-له ان أتيته
  فاعدا
  تشاءى مابيته-ما مثال تشاعى أى تباعذيقال تشاءى
  القوم اذا تفرقوا قال ذوالرمة
  أبول تلافى الناس والدين بعدما * تشاه واوييت الدين منقطع الكسر
  والشأ والغاية والامدوعدا الفرس شأوا أى طلقا والشأ والسبق أبوزيد شأوت القوم شأوا
  اذاسيقتهم قال امى ؤالقيس
  فالقست فى فيه اللجام فمذنى • وقال صضابى قدناونك فاطاب
  والشأ وما أخوج من تراب المترمنل المشاة يقال أخرج شأوا أوشأوين والمشآ:الزبيل
  يخرج به تراب البئروهو على وزن المشعلة والمع المشائى وقال الراجز
  لولا الاله ماسكتاخضما * ولاظللنا بالمشائى قيما
  وشأوت عن البُراذ انزعت منها التراب وشاآه على فاعله أى سائِه وشاما يضامثل شياهم
  على القلب أى نبقه وقد جعهما الشاء رفى قوله
  مرالخدوح وماشأونك نرة * ولقد أرالتشاء الاطعان
  أبو عبيذاشتاى أى استمع وقال المفضل سبق ( با شباة كل شحتطرفه وابلمع الشيا
  والشبوات
