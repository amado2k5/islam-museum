summary:
  ar: "بلاغ في باب ترك الوضوء مما مست النار: يروي مالك أنه بلغه أن علي بن أبي طالب وعبد الله بن عباس كانا لا يتوضآن مما مسته النار. ويذكر المحقق أن البيهقي روى عنهما بهذا المعنى، وأن عبد الرزاق أخرج آثاراً بمعناه في مصنفه. {cite:muwatta-maruf-1997 p.62}"
