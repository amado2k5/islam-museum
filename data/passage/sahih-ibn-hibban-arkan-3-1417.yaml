text: "… علامة المؤمن والاكثار فيه من أمارة أضدادهم - أَخْبَرَنَا أَبُو يَعْلَى، حَدَّثَنَا مُحَمَّد بن العلاء بن كريب، قَالَ: حَدَّثَنَا أَبُو أُسَامَة، قَالَ: حَدَّثَنَا بُريد، عَن أَبِي بردة، عَن أَبِي مُؤْسَى قَالَ : قَالَ رَسُوْلُ اللَّه وَلِفِ: المُؤْمِنَ يأْكُلُ في مِعىّ …"
summary:
