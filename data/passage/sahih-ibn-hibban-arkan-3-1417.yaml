text: "… علامة المؤمن والاكثار فيه من أمارة أضدادهم - أَخْبَرَنَا أَبُو يَعْلَى، حَدَّثَنَا مُحَمَّد بن العلاء بن كريب، قَالَ: حَدَّثَنَا أَبُو أُسَامَة، قَالَ: حَدَّثَنَا بُريد، عَن أَبِي بردة، عَن أَبِي مُؤْسَى قَالَ : قَالَ رَسُوْلُ اللَّه وَلِفِ: المُؤْمِنَ يأْكُلُ في مِعىّ …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 1417، يذكر خصال المؤمن، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 1417, that mentions the traits of the believer, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 1417 کا اقتباس جس میں مومن کی خصلتیں، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
