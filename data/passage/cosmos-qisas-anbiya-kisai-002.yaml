text: "أمة يقال لهم الخصوم … لهم مخاليب كمخاليب السباع وهم الذين يسلطون على يأجوج ومأجوج فيهلكون على أيديهم"
summary:
  ar: "يذكر الكسائي في وصف الأرض السابعة أمة تُسلَّط على يأجوج ومأجوج؛ وهي رواية قصصية لا تُعرف لها مرتبة في كتب الحديث."
  en: "Describing the seventh earth, al-Kisai names a people set against Gog and Magog; it is a storyteller's account with no standing known to us in the hadith books."
  es: "Al describir la séptima tierra, al-Kisai nombra a un pueblo que se opone a Gog y Magog; es un relato de un narrador que no tiene ninguna relevancia conocida en los libros de hadices."
  fr: "Décrivant la septième terre, al-Kisai nomme un peuple opposé à Gog et Magog; il s'agit d'un récit de conteur sans valeur reconnue dans les livres de hadiths."
  ur: "ساتویں زمین کی وضاحت کرتے ہوئے، الکسائی نے یاجوج اور ماجوج کے خلاف قائم ایک قوم کا نام لیا۔ یہ ایک قصہ گو کا بیان ہے جس کا ہمیں حدیث کی کتابوں میں کوئی حیثیت نہیں ہے۔"
  tr: "El-Kisaî, yedinci yeryüzünü anlatırken, Gog ve Magog üzerinde güç verilecek bir milletten bahseder; bu, hadis kitaplarında bilinen bir sıralaması olmayan bir rivayettir."
  id: "Al-Kisa’i menyebutkan dalam uraiannya tentang bumi ketujuh sebuah bangsa yang akan diberi kekuasaan atas Gog dan Magog; ini adalah riwayat yang tidak memiliki peringkat yang diketahui dalam kitab-kitab Hadits."
