text: "قاتلوهم يعذبهم الله الآية أخرج أبو الشيخ عن قتادة قال ذكر لنا أن هذه الآية نزلت في خزاعة حين جعلوا يقتلون بني بكر بمكة وأخرج عن عكرمة قال نزلت هذه الآية في خزاعة وأخرج عن السدي ويشف صدور قوم مؤمنين قال هم خزاعة حلفاء النبي"
