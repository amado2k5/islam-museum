text: "… فأنَّبه بصنيعه وطلبَ بدم جاره. فأجار حرب قاتليَه ولم يُسلمهما وأخفاهما. وطالبه عبد المطّلب بهما، فتغالظا في القول. حتى دعاهما المحك واللجاج إلى المنافرة، فجعلا بينهما النجاشي صاحب الحبشة. فأبى أن يدخل بينهما، فجعلا بينهما نفيل بن عبد العزى بن …"
