label: { ar: "صحيح البخاري 3816 — الأب والأبوة", en: "Sahih al-Bukhari 3816 — the father and fatherhood", ur: "صحیح بخاری 3816 — باپ اور والدیت", es: "Sahih al-Bukhari 3816 — El padre y la paternidad" }
text: "حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، حَدَّثَنَا اللَّيْثُ، قَالَ كَتَبَ إِلَىَّ هِشَامٌ عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ مَا غِرْتُ عَلَى امْرَأَةٍ لِلنَّبِيِّ مَا غِرْتُ عَلَى خَدِيجَةَ، هَلَكَتْ قَبْلَ أَنْ يَتَزَوَّجَنِي، لِمَا كُنْتُ أَسْمَعُهُ يَذْكُرُهَا، وَأَمَرَهُ اللَّهُ أَنْ يُبَشِّرَهَا بِبَيْتٍ مِنْ قَصَبٍ، وَإِنْ كَانَ لَيَذْبَحُ الشَّاةَ فَيُهْدِي فِي خَلاَئِلِهَا مِنْهَا مَا يَسَعُهُنَّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3816، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3816 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3816، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3816 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
