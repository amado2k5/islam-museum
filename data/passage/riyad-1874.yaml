label:
  ar: "رياض الصالحين 1874 — من قال أستغفر الله العظيم ذنوبه وإن كان فارا من الزحف"
  en: "Riyad al-Salihin 1874 — Whoever says 'I seek God's forgiveness' thrice, his sins are forgiven even if he fled the battle"
  es: "Riyad al-Salihin 1874 — Quien diga tres veces \"Pido perdón a Dios\", sus pecados le serán perdonados, incluso si huyó de la batalla."
  fr: "Riyad al-Salihin 1874 — Quiconque dit trois fois « Je demande pardon à Dieu », ses péchés sont pardonnés, même s'il a fui le combat."
  ur: "ریاض الصالحین 1874 - جو شخص تین بار کہتا ہے کہ میں خدا سے استغفار کرتا ہوں، اس کے گناہ معاف کردیئے جاتے ہیں خواہ وہ جنگ سے بھاگ جائے۔"
  tr: "Riyad es-Salihin 1874 — Savaştan kaçarken bile olsa, “Günahlarım için Yüce Allah'tan bağışlanma diliyorum” diyen kimse..."
  id: "Riyad as-Salihin 1874 — Barangsiapa yang berkata, “Aku memohon ampunan kepada Allah Yang Maha Kuasa atas dosa-dosanya,” meskipun ia sedang melarikan diri dari medan perang"
text: "مَنْ قَالَ أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ ثَلَاثًا غُفِرَتْ لَهُ ذُنُوبُهُ وَإِنْ كَانَ فَارًّا مِنَ الزَّحْفِ"
summary:
  ar: "حديث في رياض الصالحين للنووي، في باب «كتاب الاستغفار»، من نسخة hadithunlocked المستخرجة؛ النص مقتبس بحدود أربعين كلمة."
  en: "A hadith in al-Nawawi's Riyad al-Salihin, in the chapter «كتاب الاستغفار», excerpted within forty words."
  es: "Un hadiz en Riyad al-Salihin de al-Nawawi, en el capítulo «كتاب الاستغفار», extraído en cuarenta palabras."
  fr: "Un hadith du Riyad al-Salihin d'al-Nawawi, dans le chapitre «كتاب الاستغفار», extrait en quarante mots."
  ur: "النووی کی ریاض الصالحین میں ایک حدیث، باب «كتاب الاستغفار» میں، چالیس الفاظ میں نقل کی گئی ہے۔"
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinde, \"Bağışlanma Kitabı\" bölümünde, hadisin ağzından yaklaşık kırk kelimelik bir alıntı yapılmıştır."
  id: "Sebuah hadits dalam kitab Riyad as-Salihin karya an-Nawawi, dalam bab “Kitab Memohon Ampunan”, dari versi hadits yang telah diekstrak; teksnya dikutip sekitar empat puluh kata."
