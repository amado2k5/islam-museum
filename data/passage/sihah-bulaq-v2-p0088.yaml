text: |-
  * ⁦(باب الوادوالية.)⁩*
  ٤٩٩
  والشبوات وشبوة العقرب لاتجرى قال الراجز
  نكس واسمها لحاوتقمطة • قد جعات شبوتز بتر
  والجمع شبوات وأشبى الرجل أى ولدله ولدذكى وأشبى فلانا ولده أى أشبهوه وأشسبيت
  الرجل رفعته وأكرمته وأشبت الشجرة ارتفعت تا) الشستاء معروف قال المبردهو
  جع شنوة وجع الشتاء أشتية والنسبة اليهاشتوىّ وشتوى مثل خرفىّ وخرفى وشتوت بموضع
  كذا وتشتيت أقت به الشستاء وأشتى القوم دخلوا فى الشتاء قال الكسائى عاملته مثاتاة
  من الشماء والشتى على فعيل والشتوىّ مطر الشتاء وقال النر بن تواب يصف روضة
  عزيت وباكرها الشى بديمة • وطفاء تملؤها الى أصبارها
  وهذا الشبيء يشتيف أى يكفين اشتائ وقال الراجز بصف بتاه
  من يك ذابت فهذابى * مقيظ مصيف مشتى
  ما لشجو الهمّ والحزت يقال شجاه يشجوه فجوا اذا أحزنه وأشجاه يشيجيه اشجاء اذا
  أغصه تقول منهما جيعا شى بالكسر يشجى شجى وقال الشاعر • فى حلقكم عظم وقد شحينا
  أراد فى حلوكم فلهذا قال شبين والشجاما ينشب فى الحلق من عظم وغيره ورجل شج
  أى حزين وامرأة شيجية على فعلة ويقال ويل للشحى من الخلى قال المبردياء انلخلى مشدّدة
  وياء الشهي مخففة قال وقد شدد فى الشعر وأنشد
  فام الشهيون عن ليل الخليينا • شأن السلاة سوى شأن المحيينا
  فان جعلت الشهي فعيد لا من تجاه الحزن فه ومشجوّ وشجي فهو بالتشديدلاغير ومفازة
  نجواء صعبة المسلا والشجوجى الرجل الطويل الرجلين مثل اللخجوحى والنسبة الى شج
  نيجوىّ يفتح الجيم كمافتحت ميم غرفا نقلبت اليساء ألفائم قلبتها واوا بها حافاه يشحوه
  ويشحداه شحوا أى فتح فاه وفرس بعيد الشحوة أى بعدد الخطوة وجادت اخيل شواحى أى
  فاتحمات أفواهها وشحافوه ينعوأى انفتح يتعدى ولا يتعدى ندا :دوت الابل
  شدواسقتها والشادى الذى يشدوشيأ من الادب أى يأخذطر فامنه كانه ساقه وجعه
  وشدوت أشدواذا أنتدت بيتاأ وببتين تمدبه صوتك كالفناء ويقال للمغنى الشادى وقد
  شداشعرا أوغناء اذاغى به أوترنمبه ذا لشذامقصور الاذى والشر يقال قد آذيت
  وأشذيت والشذاذياب الكاب وقديقع على البعبر الواحدة شذاة قال الخليل يقال
  للمجائع اذا اشتد جوعه ضرم شذاه والهذا الملح والثذاحدذ كاءالرائحة والشذاة
  بقية القوّة والشدّة قال الراجز
  فاطم ردى لى شذا من نفسى * ومأصريم الامر مثل اللبسن
  والشداضرب من السفن الواحدة شذاة والشذاشحر والشذاكسرِ العود قال ايع أ!
  الاطنابة
  اذا مامشت نادى بمافي ثيابها • ذكى الشذا والمندلى المطير
  رى الشراءيد ويقصر يقال منهشريت النئ أشريه شراء اذا بعته واذا اشتريته
  أيضاوهو من الاضداد قال اللّٰه تعالى ومن الناس من يشرى نفسه ابتغاء حرضاة اللّه أى
  بيعها وقال تعالى وشروه بثمن بخس دراهم معدودة أى باعوه وتوله تعالى اشتروا الصلالة
  ة ولد نام الشتجيون الح فى تسضتم
  بدل هذا الشطر
  تام الخليون عن ليل الثيعينا
