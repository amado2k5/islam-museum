text: "… الزُّهْرِيّ، عَنِ السَّائِبِ بنِ يَزِيدَ قَالَ : أَخَذَ رَسُولُ اللّٰه ونُ الجِزْيَةَ مِنْ مَجُوسِ البَحْرَيْنِ، وَأَخَذَهَا عُمَرُ مِنْ فَارِسَ، وَأَخَذَهَا عُثْمَانُ مِنَ الفُرْسِ. السير - بَابٌ فِي أَخْذِ الجِزْيَةِ مِنَ المَجُوسِ حَدَّثَنَا أَحْمَدُ بنُ مَنِيعٍ قَالَ: حَدَّثَنَا أَبُو مُعَاوِيَةَ قَالَ …"
