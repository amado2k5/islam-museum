label: { ar: "الموطأ 930 — ابن عمر أهل من إيلياء", en: "Muwatta 930", es: "Muwatta 930", fr: "Muwatta 930", ur: "موطا 930", tr: "Al-Muwatta 930 — İbn Ömer, Kudüs sakini", id: "Al-Muwatta 930 — Ibnu Umar, penduduk Yerusalem" }
text: "أهل من إيلياء"
summary:
  ar: "يرويه مالك عن الثقة عنده أن عبد الله بن عمر أهل من إيلياء. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1062) وسويد وعبد الرزاق (5073)، والشيباني (386)، ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.445}"
  tr: "Malik, güvenilir bir kişiden rivayetle Abdullah ibn Umar'ın İlyas (Kudüs) devletine girdiğini bildirmiştir. Araştırmacı, bunun Malik'ten Ebu Musab (1062), Suveyd, Abdül-Razzak (5073), el-Şeybani (386) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.445}"
  id: "Malik meriwayatkannya berdasarkan keterangan orang yang terpercaya bahwa Abdullah ibn Umar memasuki wilayah Ilaia (Yerusalem). Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Musab (1062), Suwaid, Abd al-Razzaq (5073), al-Shaybani (386), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.445}"
