label: { ar: "الموطأ 1797 — مالك: من باع عبدا أو وليدة أو حيوانا بالبراءة فقد برئ من كل عيب فيما باع، إلا أن يكون علم عيبا فكتمه، فإن كتمه لم تنفعه تبرئته، وكان ما باع مردودا عليه", en: "Muwatta 1797" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا فيمن باع عبدا أو وليدة أو حيوانا بالبراءة، من أهل الميراث أو غيرهم: فقد برئ من كل عيب فيما باع، إلا أن يكون علم في ذلك عيبا فكتمه. فإن كان علم عيبا فكتمه، لم تنفعه تبرئته، وكان ما باع مردودا عليه. {cite:muwatta-maruf-1997 p.136}"
