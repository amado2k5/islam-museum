label: { ar: "الموطأ 1797 — مالك: من باع عبدا أو وليدة أو حيوانا بالبراءة فقد برئ من كل عيب فيما باع، إلا أن يكون علم عيبا فكتمه، فإن كتمه لم تنفعه تبرئته، وكان ما باع مردودا عليه", en: "Muwatta 1797", es: "Muwatta 1797", fr: "Muwatta 1797", ur: "موطا 1797", tr: "El-Muvatta 1797 — Malik: Kim bir köleyi, kadın köleyi veya hayvanı sorumluluktan feragat ederek satarsa, sattığı şeydeki herhangi bir kusurdan dolayı sorumluluktan kurtulur; ancak kusuru bilip gizlemişse, sorumluluktan feragat etmesinden fayda görmez ve sattığı şey kendisine iade edilir." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا فيمن باع عبدا أو وليدة أو حيوانا بالبراءة، من أهل الميراث أو غيرهم: فقد برئ من كل عيب فيما باع، إلا أن يكون علم في ذلك عيبا فكتمه. فإن كان علم عيبا فكتمه، لم تنفعه تبرئته، وكان ما باع مردودا عليه. {cite:muwatta-maruf-1997 p.136}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur: Mirasçı olsun ya da olmasın, sorumluluktan feragat beyanıyla köle, kadın köle veya hayvan satan kimse, sattığı maldaki herhangi bir kusurdan dolayı sorumluluktan muaftır; ancak kusuru bilip gizlemişse durum farklıdır. Eğer kusuru bilip gizlemişse, sorumluluktan feragat beyanının bir faydası olmaz ve sattığı mal kendisine iade edilir. {cite:muwatta-maruf-1997 s.136}"
  id: "Malik berkata: Praktik yang berlaku di antara kita adalah bahwa siapa pun yang menjual budak, budak perempuan, atau hewan dengan pelepasan tanggung jawab, baik mereka ahli waris atau bukan, dibebaskan dari semua tanggung jawab atas cacat apa pun pada barang yang mereka jual, kecuali jika mereka mengetahui adanya cacat dan menyembunyikannya. Jika mereka mengetahui adanya cacat dan menyembunyikannya, pelepasan tanggung jawab mereka tidak bermanfaat, dan barang yang mereka jual dikembalikan kepada mereka. {cite:muwatta-maruf-1997 p.136}"
