text: "… أُمِّ سَلَمَةَ أَنَّ رَسُولَ اللّهِ وَل عند وفاته أَوْصَى، فَقَالَ : الحديث أخرجه مسلم فى صحيحه، كتاب فضائل الصحابة - باب وصية النبى % بأهل مصر حديث بلفظه وأحمد فى المسند بلفظه والطحاوى فى مشكل الآثار بمثله والبيهقى فى السنن …"
