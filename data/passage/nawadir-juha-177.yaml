text: "… ما دامت الحال على ما ترى فلا شيء كان يوماً راكباً جملاً، فأخذ يسفُّ سويقاً وهو الدقيق الممزوج بالسكر وكان الهواء شديداً، فكلما وضع شيئاً في فمه يتطايرُ ولا يدخلُ جوفه شيءٌ منه، فسألهُ رفيق له : ماذا تأكل؟ فأجابه …"
summary:
  ar: "كان جحا راكبًا جملًا يحاول أن يأكل مسحوق دقيق وسكر في الريح؛ فسُئل ماذا يأكل، فقال إنه ما دامت الحال على ما يرى فلا شيء. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  en: "Riding a camel, Juha tries to eat flour-and-sugar powder in the wind; asked what he eats, he says if things are as they are, nothing. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  ur: "جحا اونٹ پر سوار ہو کر ہوا میں آٹے اور چینی کا سفوف کھانے کی کوشش کر رہا تھا؛ پوچھا گیا کہ کیا کھا رہے ہو، تو اس نے کہا کہ جب تک حال یہی ہے تو کچھ بھی نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  fr: "À dos de chameau, Juha tente de manger une poudre de farine et de sucre dans le vent; quand on lui demande ce qu'il mange, il dit que, les choses étant ce qu'elles sont, rien. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  es: "Montado en un camello, Juha intenta comer un polvo de harina y azúcar con el viento; cuando le preguntan qué come, dice que, tal como están las cosas, nada. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
