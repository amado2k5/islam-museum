text: "… والصالحين من المسلمين، ونعيت لك نفسى فعليك بذكر الموت، فإن استطعت أن لا يفارق قلبك طرفة عين فافعل، وأنذر قومك إذا رجعت إليهم. واكدح لنفسك وإياك أن تفارق الجماعة فتفارق دينك وأنت لا تشعر فتموت فتدخل النار يوم القيامة، ثم …"
summary:
  ar: "مقطع من حلية الأولياء وطبقات الأصفياء، المجلد المصوَّر 2، ص 85، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym), scan volume 2, p. 85, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "حلیۃ الاولیاء و طبقات الاصفیاء ⁦(ابو نعیم)⁩، اسکین جلد 2، ص 85 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym), volume numérisé 2, p. 85, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym), volumen escaneado 2, p. 85, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Hilyat al-Awliya' wa Tabaqat al-Asfiya' adlı resimli cilt 2'nin 85. sayfasından, bir ağıt ve ölüm ilanı içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Hilyat al-Awliya' wa Tabaqat al-Asfiya', jilid bergambar 2, halaman 85, berisi eulogi dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
