text: "… كنت تعلمين ما يدور في بطني من الريح وما أجده من الصعوبة في إيجاد مكان لتفريغه لرثيت لحالي. نوادر جحا الكبرى نادرةٌ منظومةٌ وَضَعَتْ زَوْجَتُهُ وَقْتَ السَّحَرْ ثُمَّ ثَنَّتْ بِغُلَامِ أَزْهَرِ عِنْدَمَا رَأَى الشَّيْخُ ما قَدْ رَأَى غَضِبَتْ جَارَتُهُ مِنْ …"
summary:
  ar: "سُئل جحا هل يلزم لخمس صلوات خمسة وضوءات، فقال نعم، لكل وقت وضوء، وأجاب عن سؤال زوجته عن استخراج الماء بضرطة عالية. {cite:juha-nawadir-kubra-djuwaydi p. 96}"
  en: "Asked whether five prayers need five ablutions, Juha says yes, one for each time, and he answers his wife's question about drawing water with a loud fart. {cite:juha-nawadir-kubra-djuwaydi p. 96}"
  ur: "جحا سے پوچھا جاتا ہے کہ کیا پانچ نمازوں کے لیے پانچ وضو ضروری ہیں تو وہ کہتا ہے ہاں، ہر وقت کے لیے ایک وضو، اور بیوی کے پانی نکالنے کے سوال کا جواب وہ زور دار پادنے سے دیتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 96}"
  fr: "Interrogé pour savoir si cinq prières exigent cinq ablutions, Juha répond oui, une pour chaque heure, et il répond à la question de sa femme sur le fait de tirer de l'eau par un pet sonore. {cite:juha-nawadir-kubra-djuwaydi p. 96}"
  es: "Al preguntarle si cinco oraciones requieren cinco abluciones, Juha dice que sí, una por cada hora, y responde a la pregunta de su esposa sobre sacar agua con una sonora ventosidad. {cite:juha-nawadir-kubra-djuwaydi p. 96}"
