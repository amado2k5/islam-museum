text: "… لا في شَرْعِ الدّينِ بِما لَمْ يأْذَنْ فيهِ اللهُ تَعالَىٰ، ولا في إسْقاطِ فَرْضٍ فَرَضَهُ اللهُ تَعالَىٰ، ولا في إباحَةِ ما حَرَّمَهُ اللهُ تَعالَىٰ، ولا في تَحْريمِ ما أَحَلَّهُ اللهُ تَعالَىٰ، ولا في إيجابٍ ما لَمْ يُوجِبْهُ الله تَعالَى. وقَدْ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 146، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، والوجوب، والمباح، وما حرّم الله ورسوله، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 146, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), obligation (wujub), the permitted (mubah), what God and His Messenger forbade, forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 146 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، وجوب، مباح، جو اللہ اور اس کے رسول نے حرام کیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 146, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obligation (wujub), le permis (mubah), ce que Dieu et Son Messager ont interdit, l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 146, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), la obligatoriedad (wujub), lo permitido (mubah), lo que Dios y Su Mensajero prohibieron, la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 146. sayfasından bir alıntı, Allah ve Resulü'nün farz kıldığı, farz fiiller, görevler ve helal fiiller ile Allah ve Resulü'nün haram kıldığı, yasaklar da dahil olmak üzere konuları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram edilen fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 146, membahas tentang apa yang telah diwajibkan oleh Allah dan Rasul-Nya, termasuk amalan wajib, kewajiban, dan amalan yang diperbolehkan, serta apa yang telah dilarang oleh Allah dan Rasul-Nya, termasuk larangan-larangan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
