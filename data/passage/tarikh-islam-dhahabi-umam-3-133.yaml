text: "… خير منزل، حتى قلِمْنا على رسول اللّٰه وَلِ بمكة. خرَّجه د من حديث ابن إسحاق عن الزُّهْري. وهؤلاء قدِموا مكةَ، ثم هاجروا إلى المدينة. وبقي جعفر وطائفة بالحبشة إلى عام خَيْبر. وقد قيل إنّ إرسال قُريش إلى النَّجاشيّ كان مرَّتين. …"
