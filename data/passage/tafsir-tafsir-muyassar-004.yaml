text: "عليم بهم، وسيجازيهم على ذلك. (٦٤) قل - أيها الرسول - لأهل الكتاب من اليهود والنصارى: تعالوا إلى كلمة عدل وحق نلتزم بها جميعا: وهي أن نخص الله وحده بالعبادة، ولا نتخذ أي شريك معه، من وثن أو صنم أو"
