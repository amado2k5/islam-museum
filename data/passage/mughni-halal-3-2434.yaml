text: "الرِّوَايَةِ الأُولَى، مَارُويّ عَنْ الزُّهْرِيّ، عَنْ خَارِجَةَ بُن زَيْدٍ، عَنْ مَا أَحَلُ الله عَلَيَّ حَرَامَ إنْ فَعَلْت. ثُمَّ فَعَلَ، فَهُوَ مُخَيَّرٌ، إنْ شَاءَ أَبِيهِ، عَنْ النِّبِيُّ ذَالِ أَنَّهُ سُئِلَ عَنْ الرَّجُلِ يَقُولُ: هُوَ يَهُودِي، أَوْ تَرَكَ مَا حَرَّمَهُ عَلَى نَفْسِهِ، …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 2434، يذكر ما أُحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 2434, that mentions what was made lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
