label: { ar: "صحيح البخاري 4665 — الأب والأبوة", en: "Sahih al-Bukhari 4665 — the father and fatherhood", ur: "صحیح بخاری 4665 — باپ اور والدیت", es: "Sahih al-Bukhari 4665 — El padre y la paternidad" }
text: "… مُحِلِّينَ، وَإِنِّي وَاللَّهِ لاَ أُحِلُّهُ أَبَدًا. قَالَ قَالَ النَّاسُ بَايِعْ لاِبْنِ الزُّبَيْرِ. فَقُلْتُ وَأَيْنَ بِهَذَا الأَمْرِ عَنْهُ أَمَّا أَبُوهُ فَحَوَارِيُّ النَّبِيِّ، يُرِيدُ الزُّبَيْرَ، وَأَمَّا جَدُّهُ فَصَاحِبُ الْغَارِ، يُرِيدُ أَبَا بَكْرٍ، وَأُمُّهُ فَذَاتُ النِّطَاقِ، يُرِيدُ أَسْمَاءَ، وَأَمَّا خَالَتُهُ فَأُمُّ الْمُؤْمِنِينَ، يُرِيدُ عَائِشَةَ، وَأَمَّا عَمَّتُهُ فَزَوْجُ النَّبِيِّ، يُرِيدُ خَدِيجَةَ، وَأَمَّا عَمَّةُ النَّبِيِّ فَجَدَّتُهُ، يُرِيدُ صَفِيَّةَ، ثُمَّ عَفِيفٌ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4665، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4665 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4665، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4665 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
