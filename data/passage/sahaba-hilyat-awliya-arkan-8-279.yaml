text: "… أعمل بها، وخمس منها تخلقنا نها فى الجاهلية فنحن عليها إلا أن تكره منها شيئًا. فقال رسول اللّٰه : وما الخمس التى أمر تمكم رسلى أن تؤمنوا بها أ قلنا : أمرتنا وسلك أن نؤمن بالله وملائكته وكتبه ورسله والبعث …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 279، يذكر الإيمان بالله وملائكته وكتبه ورسله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 8, p. 279, that mentions belief in God, His angels, His books and His messengers; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 8، ص 279 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
