label: { ar: "الموطأ 2101 — مالك: لا شفعة عندنا في عبد ولا وليدة، ولا بعير ولا بقرة ولا شاة، ولا في شيء من الحيوان، ولا في ثوب، ولا في بئر ليس لها بياض، إنما الشفعة فيما يصلح أن ينقسم وتقع فيه الحدود من الأرض", en: "Muwatta 2101", es: "Muwatta 2101", fr: "Muwatta 2101", ur: "موطا 2101", tr: "Al-Muwatta 2101 — Malik: Kölede, erkek veya kadın olsun, devede, inekte veya koyunda, hiçbir hayvanda, giyside veya beyaz kısmı olmayan kuyuda öncelik hakkımız yoktur. Öncelik hakkı ancak bölünebilen ve sınırları belirlenmiş olan şeyler için geçerlidir.", id: "Al-Muwatta 2101 — Malik: Kami tidak mempunyai hak prioritas atas seorang budak, laki-laki maupun perempuan, atau unta, sapi, atau domba, atau hewan apa pun, atau pakaian, atau sumur yang tidak memiliki bagian putih. Hak prioritas hanya berlaku untuk apa yang dapat dibagi dan yang batas-batasnya telah ditetapkan di tanah." }
summary:
  ar: "قال مالك: ولا شفعة عندنا في عبد ولا وليدة، ولا بعير، ولا بقرة، ولا شاة، ولا في شيء من الحيوان، ولا في ثوب، ولا في بئر ليس لها بياض. إنما الشفعة فيما يصلح أن ينقسم، وتقع فيه الحدود من الأرض. فأما ما لا يصلح فيه القسم فلا شفعة فيه. {cite:muwatta-maruf-1997 p.258}"
  tr: "Malik şöyle dedi: Kölede, erkek veya kadın olsun, devede, inekte, koyunda veya herhangi bir hayvanda, giyside veya akmayan su bulunan bir kuyuda ön alım hakkımız yoktur. Ön alım hakkı yalnızca bölünebilen ve sınırları belirlenebilen topraklarda geçerlidir. Bölünemeyen şeylerde ise ön alım hakkı yoktur. {cite:muwatta-maruf-1997 s.258}"
  id: "Malik berkata: Kita tidak memiliki hak prioritas atas seorang budak, laki-laki atau perempuan, seekor unta, seekor sapi, seekor domba, atau hewan apa pun, juga tidak atas pakaian, atau atas sumur yang tidak berair putih. Hak prioritas hanya berlaku untuk apa yang dapat dibagi dan yang batas-batasnya dapat ditetapkan di tanah. Adapun apa yang tidak dapat dibagi, tidak ada hak prioritas atasnya. {cite:muwatta-maruf-1997 p.258}"
