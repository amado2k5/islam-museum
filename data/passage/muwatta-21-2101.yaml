label: { ar: "الموطأ 2101 — مالك: لا شفعة عندنا في عبد ولا وليدة، ولا بعير ولا بقرة ولا شاة، ولا في شيء من الحيوان، ولا في ثوب، ولا في بئر ليس لها بياض، إنما الشفعة فيما يصلح أن ينقسم وتقع فيه الحدود من الأرض", en: "Muwatta 2101" }
summary:
  ar: "قال مالك: ولا شفعة عندنا في عبد ولا وليدة، ولا بعير، ولا بقرة، ولا شاة، ولا في شيء من الحيوان، ولا في ثوب، ولا في بئر ليس لها بياض. إنما الشفعة فيما يصلح أن ينقسم، وتقع فيه الحدود من الأرض. فأما ما لا يصلح فيه القسم فلا شفعة فيه. {cite:muwatta-maruf-1997 p.258}"
