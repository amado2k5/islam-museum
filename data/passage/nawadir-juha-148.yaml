text: "… نركب عليه ونُحمِّله أثقالنا ذهب إلى السوق وابتاع خضراً ووضعها في هِميانه خرجه وجعله على عاتِقه، وركب الحمار. فصادفه أحدهم في الطريق، فقال له: لماذا لا تضع هذا الخرج أمامك على الحمار وتركبه براحة؟ فأجابه الشيخ: أنصِف يا رجلُ، إن …"
summary:
  ar: "اشترى جحا خضارًا ووضعه في كيس وركب وهو يحمله على كتفه؛ فاقترح عابر أن يضعه على الحمار، فقال إن الحمار يحمله هو، ولا يليق أن يُثقل عليه أكثر. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  en: "Juha buys vegetables, puts them in a bag and rides with it on his shoulder; a passer-by suggests placing it on the donkey; Juha says the donkey already carries him, and it would not be fair to load it more. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  ur: "جحا نے سبزیاں خریدیں، تھیلے میں ڈالیں اور انہیں کندھے پر رکھ کر گدھے پر سوار ہو گیا؛ ایک راہگیر نے مشورہ دیا کہ تھیلا گدھے پر رکھ دو؛ جحا نے کہا کہ گدھا مجھے پہلے ہی اٹھائے ہوئے ہے، اس پر اور بوجھ ڈالنا مناسب نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  fr: "Juha achète des légumes, les met dans un sac et monte à dos d'âne avec le sac sur l'épaule; un passant propose de le poser sur l'âne; Juha dit que l'âne le porte déjà, et qu'il ne serait pas juste de le charger davantage. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  es: "Juha compra verduras, las mete en un saco y monta con el saco al hombro; un transeúnte le sugiere ponerlo sobre el burro; Juha dice que el burro ya lo lleva a él y que no sería justo cargarlo más. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
