text: "… فقالوا: - وعن جابر، قال: جاءت ملائكة إلى النبي يل إن لصاحبكم هذا مثلاً، فاضربوا له مثلاً. إذا ترتب على الطالب والمتمني، فكيف بالمباشر؟ وإطلاق السنة على فعل الجاهلية إما على أصل اللغة، أو على التهكم، وهي مثل النياحة، والميسر، …"
