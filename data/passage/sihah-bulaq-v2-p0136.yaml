text: |-
  • (باب الواء وا٠١.١
  •(وى»
  Fo1
  مع استعانة تقول كتبت بالقلم وقد تجى «زائدة كقوله تعالى وكفى باللّه شهيدا وحسبك بزيد
  وليس زيدبقائم والباءهى الاصل فى حروف القسم تشتمل على المظهر والمضمر تقول بالله لقد
  كان كذا وتقول فى المضمر به لافعلن قال الشاعر
  ألانادت أمامة باحتمال • اتحزنف فلابن ما أبالى
  ( يا قولهم حياك الله وبياك مع-ف حباك ملكان وببمالأ قال الاصمحى اعنمدك بالتسينة
  وقال ابن الاعرابى ياءبك قال الراجز
  باتت تبياحوضهاعكوفا • مثل المغوف لاقت الصفوفا
  وقال آخره وععس نعم الفتى تبياه وقال الاثر
  لما تبينا أخاقيم • أعطى عطاء اللحز اللنم
  وهذه الايات تحتمل الوجهين جميعا قال الاحربيال معناه بوال منزلا الا أنها الماجاءت مع
  سيالار كت همزتها وحوّات واوهايا« قال سلمة بن عاصم سكيت للفراوقول خلف فقا!
  ما أحسسن ماقال وفى الحديث ان آدم عليه السلام لماقتل ابنه مكن مائة سنة لا يضصك
  ثم قيل له حبالدا قه وياك فقال وماي الأقيل أضصكك قال أبو عبيد وبعض الناس بقول انه
  اتباع قال وهو عندى على ماجاء تفسيره فى الحديث أى ليمر باتساع وذلك أن الاتياع لا يكاد
  يكون بالواو وهسذا بالواو قال وكذلك قول العباس فى زحزم انى لا أ-له المفتسسل وهى
  إشارب حل وبلّ وقواه-م ما أدرى أى هىّ بن بهو أعدأى الناس هو وهيان بن
  بيان اذا لم به رف هو ولا أبوه .
  صل التاء ا او الشئ الذى يتلوه وتلوالناقة وادها الذى يتاوها والتلوة
  من الغتم التى تنتج قبل الصغرية والتلاه الذمّة ومنه قول زهير
  جوارشاهدعدل عليكم • وسسيان الكفالة والثلاه
  والتلية بقية الدين وكذات التلاوة بالضم يقسال تليت لى من حفى تلبة وتلاوة تتلي أى بقيت
  إلى يقصة عن ابن السكيت وتلوت القرآن تلاوة وتلوت الرجسل أتلوه تلواذا تمعته يقال
  مازات أقلوه حق أتلته أى حتى تقدمته وصارخافى ويقال أيضاتلوته اذا خذلته وتركت
  عن اب عيد والمتالى الذى يراصل المغنى بصوت رفيع قال الاخطل
  صلت الجين كأنَ رجع مهيله • زجر المحاول أو عناء مسالى
  ٤ وأتلت الناقة اذا تلاها ولدها ومنه قواهم لأدريت ولا أقليت يدء وعليسه بأن لا تتلى اله أى
  لا تكون لها أولاد عن يونس وأتليت - فى عنسده أى أبقيت منه بقية وأتلام اقه أطفالا
  أى أسعه أولادا وأتليته أى سبقته وأتليته أى أحلته من الحوالة وأتليته ذمة أى
  أعطيته اياها قال أبوزيد تلى الرجل بالتشديداذا كان باخرريق وتتليت-قى اذا تتبعته
  حتى استوفيته وجاءت الخيل تتاليا أى متتابعة ⁦(توى )⁩ التؤالة ردوفى الحديث الطواف
  تووانسعى توّ والاستجمار توووجه فلان من خيله بألف تو يعف بألف رجل أى بألف واحد
  وجاء الرجل توّا اذاجا وحده والتوى مقصور هلالك لمال بقال نوى المال بالكسر يتوى
  توى وأتواه غيره وهذا مال توعلى فعل
