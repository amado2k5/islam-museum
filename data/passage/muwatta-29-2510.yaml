label: { ar: "الموطأ 2510 — أسلم مولى عمر: عمر قضى في الضرس والترقوة والضلع بجمل", en: "Muwatta 2510", es: "Muwatta 2510", fr: "Muwatta 2510", ur: "موطا 2510", tr: "El-Muvatta 2510 — Ömer'in azatlı kölesi Aslam: Ömer, diş, köprücük kemiği ve kaburga yaralanması için tazminatın deve olacağına hükmetti.", id: "Al-Muwatta 2510 — Aslam, budak yang dibebaskan oleh Umar: Umar memutuskan bahwa seekor unta adalah ganti rugi atas cedera gigi, tulang selangka, dan tulang rusuk." }
summary:
  ar: "يروي يحيى عن مالك عن زيد بن أسلم عن مسلم بن جندب عن أسلم مولى عمر بن الخطاب أن عمر قضى في الضرس بجمل، وفي الترقوة بجمل، وفي الضلع بجمل. {cite:muwatta-maruf-1997 p.431}"
  tr: "Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Müslim ibn Cundub'dan, o da Ömer ibn el-Hattab'ın azatlı kölesi Aslam'dan rivayet eder ki, Ömer kırık bir dişin, kırık bir köprücük kemiğinin ve kırık bir kaburganın tazminatının deve olduğuna hükmetmiştir. {cite:muwatta-maruf-1997 s.431}"
  id: "Yahya meriwayatkan dari Malik, dari Zayd ibn Aslam, dari Muslim ibn Jundub, dari Aslam, budak yang dibebaskan oleh Umar ibn al-Khattab, bahwa Umar menetapkan bahwa ganti rugi untuk gigi yang patah adalah seekor unta, untuk tulang selangka yang patah seekor unta, dan untuk tulang rusuk yang patah seekor unta. {cite:muwatta-maruf-1997 p.431}"
