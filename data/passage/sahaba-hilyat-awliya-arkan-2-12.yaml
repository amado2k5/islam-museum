  fr: "Extrait du Hilyat al-Awliya' d'Abu Nu'aym (tome 2, p. 12), évoquant la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
