label: { ar: "مسلم 2637 — إن الله إذا أحب عبداً دعا جبريل فقال إني أحب فلاناً فأحبه", en: "Muslim 2637 — When God loves a servant He calls Jibril: I love so-and-so, love him" }
text: "قال رسول الله: «إن الله إذا أحب عبداً دعا جبريل فيقول: إني أحب فلاناً فأحبه، فيحبه جبريل، ثم ينادي في السماء فيقول: إن الله يحب فلاناً فأحبوه، فيحبه أهل السماء، ثم يوضع له القبول في الأرض»"
summary:
  ar: "رواية أبي هريرة في باب إذا أحب الله عبداً حببه إلى عباده من كتاب البر في صحيح مسلم؛ تدرج المحبة من الله إلى جبريل إلى أهل السماء إلى قبول الأرض — وفسر به سهيل بن أبي صالح محبة الناس لعمر بن عبد العزيز في الموسم."
