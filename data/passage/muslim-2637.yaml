label: { ar: "مسلم 2637 — إن الله إذا أحب عبداً دعا جبريل فقال إني أحب فلاناً فأحبه", en: "Muslim 2637 — When God loves a servant He calls Jibril: I love so-and-so, love him", es: "Muslim 2637 — Cuando Dios ama a un siervo, llama a Jibril: Yo amo a fulano, ámenlo.", fr: "Muslim 2637 — Quand Dieu aime un serviteur, Il appelle Jibril: J'aime untel, aime-le", ur: "مسلم 2637 - جب اللہ کسی بندے سے محبت کرتا ہے تو جبرائیل کو پکارتا ہے: میں فلاں سے محبت کرتا ہوں، اس سے محبت کرو۔", tr: "Müslim 2637 — Allah bir kulunu sevdiği zaman Cebrail'i çağırır ve şöyle der: \"Ben filan kişiyi seviyorum, öyleyse onu sev.\"", id: "Muslim 2637 — Ketika Allah mencintai seorang hamba, Dia memanggil Jibril dan berkata, “Aku mencintai si fulan, maka cintailah dia.”" }
text: "قال رسول الله: «إن الله إذا أحب عبداً دعا جبريل فيقول: إني أحب فلاناً فأحبه، فيحبه جبريل، ثم ينادي في السماء فيقول: إن الله يحب فلاناً فأحبوه، فيحبه أهل السماء، ثم يوضع له القبول في الأرض»"
summary:
  ar: "رواية أبي هريرة في باب إذا أحب الله عبداً حببه إلى عباده من كتاب البر في صحيح مسلم؛ تدرج المحبة من الله إلى جبريل إلى أهل السماء إلى قبول الأرض — وفسر به سهيل بن أبي صالح محبة الناس لعمر بن عبد العزيز في الموسم."
  tr: "Sahih Müslim'deki Salihlik Kitabı'nda yer alan \"Allah bir kulunu severse, onu kullarına da sevdirir\" bölümünde Ebu Hurayra'nın rivayetine göre, sevgi Allah'tan Cebrail'e, oradan gök ehli ve nihayetinde yeryüzünün kabulüne kadar ilerler; Suhayl bin Ebu Salih ise bunu, o dönemde insanların Ömer bin Abdül Aziz'e duyduğu sevgi olarak yorumlamıştır."
  id: "Riwayat Abu Hurairah dalam surah “Jika Allah mencintai seorang hamba, Dia akan menjadikannya dicintai oleh hamba-hamba-Nya” dari Kitab Kebenaran dalam Sahih Muslim; cinta itu berkembang dari Allah kepada Jibril kepada penghuni surga hingga diterima oleh bumi — dan Suhayl bin Abi Salih menafsirkannya sebagai cinta manusia kepada Umar bin Abdul Aziz pada masa itu."
