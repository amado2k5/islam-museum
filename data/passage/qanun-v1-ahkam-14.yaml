text: "… من الأمور الطبيعية وليس لقائل أن يقول إن أحوال بدن الإنسان ثلاث: الصحة، والمرض، وحالة ثالثة لا صحة ولا مرض، وأنت اقتصرت على قسمين، فإن هذا القائل لعله إذا فكّر، لم يجد أحد الأمرين واجباً، لا هذا التثليث، ولا إخلالنا …"
