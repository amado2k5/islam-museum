label: { ar: "الموطأ 2391 — نافع: عبد على رقيق الخمس استكره جارية فجلده عمر ونفاه", en: "Muwatta 2391", es: "Muwatta 2391", fr: "Muwatta 2391", ur: "موطا 2391", tr: "El-Muvatta 2391 — Nafi’: Kölelerin beşte birinden bir köle bir cariyeye tecavüz etti, bunun üzerine Ömer onu kırbaçlayıp sürgüne gönderdi." }
summary:
  ar: "يروي مالك عن نافع أن عبدا كان يقوم على رقيق الخمس، فاستكره جارية من ذلك الرقيق فوقع بها، فجلده عمر بن الخطاب ونفاه، ولم يجلد الوليدة لأنه استكرهها. {cite:muwatta-maruf-1997 p.389}"
  tr: "Malik, Nafi’den rivayetle, kölelerin beşte birinin başında bir kölenin bulunduğunu ve bu kölelerden bir cariyeye zorla tecavüz ettiğini ve onunla cinsel ilişkiye girdiğini anlatır. Ömer ibn el-Hattab onu kırbaçlatıp sürgüne gönderdi, ancak cariyeye zorla tecavüz ettiği için onu kırbaçlamadı. {cite:muwatta-maruf-1997 s.389}"
  id: "Malik meriwayatkan dari Nafi’ bahwa seorang budak bertugas mengurus seperlima dari budak-budak lainnya, dan ia memaksa seorang budak perempuan dari antara budak-budak tersebut dan bersetubuh dengannya. Umar ibn al-Khattab mencambuknya dan mengasingkannya, tetapi ia tidak mencambuk budak perempuan itu karena ia telah memaksanya. {cite:muwatta-maruf-1997 p.389}"
