  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 643, qui mentionne la médecine et le médecin, la maladie et les malades, l'hôpital et l'art médical, le traitement, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 643. sayfasından, tıp ve hekim, hastalık ve hasta, hastane ve tıp mesleği, tedavi ve ilaçtan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
