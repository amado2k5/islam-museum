text: "… الأطباء في التخييل أموراً عجيبة لا يصل إليها الدواء، فالطبيب الحاذق يستعين على المرض بكل معين. العشرون: - وهو ملاك أمر الطبيب، أن يجعل علاجَه وتدبيرَه دائراً على ستة أركان: حفظ الصحة الموجودة، ورد الصحة المفقودة بحسب الإمكان، وإزالة العلة …"
