text: "… الأطباء في التخييل أموراً عجيبة لا يصل إليها الدواء، فالطبيب الحاذق يستعين على المرض بكل معين. العشرون: - وهو ملاك أمر الطبيب، أن يجعل علاجَه وتدبيرَه دائراً على ستة أركان: حفظ الصحة الموجودة، ورد الصحة المفقودة بحسب الإمكان، وإزالة العلة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 643، يذكر الطب والطبيب، والمرض والمريض، والبيمارستان وصناعة الطب، والعلاج، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 643, that mentions medicine and the physician, illness and the sick, the hospital and the medical craft, treatment, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 643 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، بیمارستان، علاج، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
