text: "د الربوبية، ثم يرتقي إلى توحيد الإلهية، كما يدعو الله عباده في كتابه بهذا النوع من التوحيد إلى النوع الآخر(٤). • هما توحيدان (لا نجاة للعبد إلا بهما): ١ - توحيد المرسل (وهو الله ) ٢- وتوحيد متابعة الرسول؛ فلا"
