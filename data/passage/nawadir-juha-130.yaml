text: "… لو كنت راكباً عليه لَضِعْتُ ضاع حماره، فأخذ يُفتّشُ عليه، ويحمد اللَّه شاكراً، فسألوه: ولِماذا تشكرُ اللَّه؟ فقال: أشكرُهُ لأنِّي لم أكن راكباً على الحمار، وإلا فلو كنت راكباً، لضعت معه."
summary:
  ar: "أضاع جحا حماره وشكر الله؛ فسُئل لماذا، فقال إنه لو كان راكبًا عليه لضاع معه. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  en: "Juha loses his donkey and thanks God; asked why, he says that if he had been riding it, he would have been lost with it. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  ur: "جحا کا گدھا کھو گیا تو اس نے اللہ کا شکر ادا کیا؛ پوچھا گیا کیوں، تو بولا کہ اگر میں اس پر سوار ہوتا تو اس کے ساتھ میں بھی کھو جاتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  fr: "Juha perd son âne et remercie Dieu; quand on lui demande pourquoi, il dit que s'il l'avait monté, il se serait perdu avec lui. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  es: "Juha pierde su burro y da gracias a Dios; cuando le preguntan por qué, dice que, si lo hubiera montado, se habría perdido con él. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  tr: "Juha eşeğini kaybetti ve Tanrı'ya şükretti. Neden diye sorulduğunda, eğer eşeğe binmiş olsaydı, onunla birlikte kaybolacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 61}"
  id: "Juha kehilangan keledainya dan bersyukur kepada Tuhan. Ketika ditanya mengapa, dia menjawab bahwa jika dia menungganginya, dia akan hilang bersama keledainya. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
