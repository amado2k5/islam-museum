text: |-
  ١٦٠
  ⅜n⅜⅜لجÜل
  شى من البطيخ واانواكه لم ينضج فهوفج ورجل تجفاج كثير الكلام ⁦(فحج)⁩. رجل آخج
  بين الفهيج وهو الذى تتدانى صدور قدميه وتتباعد عقباه وتتفهج ساقاه وداية تحجاء والفهج
  بالتكين مشبة الافج وقد فيج يفحج فححا وتفحج فى مشيته مثل قال أبو همر والتفهج
  مثل التفشج وهو أن يفرج بين رجليه اذا حلس وكذلك التفهيج مثل المتقشيج وأفيج الرجل
  حاوبته اذا فرج مابين رجليها ليحليها رج . لفرح من الغم بالتحريك تقول فرّج اللّٰه
  غمن تفر يجاد كذلك فرج اللّٰه عنك غمك يفرج بالكسر والفرج العورة والفرج النغر
  وموضع المخافة قال أبو عبيدة الفرجان السندوخراسان وقال الاصعى سجستان
  وخراسان والمفرج بالتحريك فى قول أبي ذؤيب وللشر بعد القارعات فروج أى
  تفرّج وانكشاف والفرج ساكن فى قول امرى القيس
  لهاذنب مثل ذيل العروس * تسديه فرجها من دير مايين رج-لى الفرس
  والفرجة التفصى من الهم وقال
  ربعاتكره النفوس من الامشرة فرجة كل العقال
  والفرجة بالضم غرجة الحائط وماأشيهه يقال بينهما فرحة أى انفراح والفرح بالكسم
  الذى لا يكتم السروكذلك الفرج يضم المفاء والراء والفرج أيضا الموس البائنة عن الوتر
  وكذلك الفارج والفريج ويقال رجل أفرج بين الفرج للذى لا تلتقى البتاه لعظمهما وأكثر
  ما يكون ذلك فى الحيشة والمرأة فرجاء وفرج الرحل بالكسر فرجافهو فرج أى لايزال
  نكشف فرجه ويقال أفرج الناس عن طريقه أى انكشفوا وفى الحديث لا يترك
  فى الاسلام مفرح وكان الاصمعى يقول هوحفر ح بالحاء ويشكرقواهم مفرج بالجيم وقال
  أبو عبيد سمعت محمد بن الح-ن يقول هو يروى بالجيم والحاء قال فن قال مفرج الحسيم فهو
  القتيل يوحد يأرض فلاة لا يكون عند قرية يقول فانه يودى من بدت المال وقال أيو عبيد:
  المفرح بالحيم الذى يسلم ولا يوالى أحد افاذاجن جناية كان ذلك على بيت المال لانه
  لاعاقلة له والمفرّوجة واحدة الفرارمج بقال دجاحة مفرج أى ذات فراريج والفرّوج بفتح
  الفاءالقياءوفرخ الدياجة ريج فرنيج جلدايحل اذاشوء فييس أعليه ( رتج
  الفرتاج سعة من سمات الايل ⁦(فشج)⁩ يقال فشج فبال أى فرج بين رجليه ينشج وكذلك
  فشبح تفشيها والتفشج مثل التفهج ( ضج فلان يتفضج عرقا اذاعرقت أصول شعره
  ولم يسل (فلج فلح اسم موضع بين البصرة وضرية مذكر.صروف قال الشاعر
  وان الذى حانت بفلج دماؤهم * هم القوم كل القوم يا أمّ خالد
  والفلج أيضانهر صغير وقال فصبحاعيناروى وفلوا والفلج أيضا الظفر والفوزوقد
  فلج الرحل على خصمه يقلج فلجا وفى المثل من يأت الحمكم وحدد يفلج وأفلحه اللّه عليه والاسم
  الفلح بالضم وأفلح اللٰه حسه قومها وأظهرها والفلح بالكسر مكال معروف قال
  الجعدى يصف الخر
  ألتى فيها فلجان من حسك دارين وفلج من عنبر ضرم
  والفلج بالتحريك لغسة في الفلح وهو نهرصغير قال عبيد
  أوفلج بيطن واد • للماء من تحته قسيب
