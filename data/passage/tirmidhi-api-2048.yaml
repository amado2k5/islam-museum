label: { ar: "جامع الترمذي 2048 — الحجامة، الإثمد", en: "Jami' al-Tirmidhi 2048 — cupping; ithmid (antimony kohl)", ur: "جامع ترمذی 2048 — حجامہ، اثمد سرمہ", es: "Jami' al-Tirmidhi 2048 — ventosas; ithmid (kohl de antimonio)", fr: "Jami' al-Tirmidhi 2048 — ventouses; ithmid (khôl à l'antimoine)", tr: "Cami' el-Tirmizi 2048 — Hacamat, Kohl", id: "Jami' al-Tirmidhi 2048 — Bekam, Kohl" }
text: "… عَبَّادُ بْنُ مَنْصُورٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ خَيْرَ مَا تَدَاوَيْتُمْ بِهِ اللَّدُودُ وَالسَّعُوطُ وَالْحِجَامَةُ وَالْمَشِيُّ وَخَيْرُ مَا اكْتَحَلْتُمْ بِهِ الإِثْمِدُ فَإِنَّهُ يَجْلُو الْبَصَرَ وَيُنْبِتُ الشَّعْرَ \". قَالَ وَكَانَ لِرَسُولِ اللَّهِ مُكْحُلَةٌ يَكْتَحِلُ بِهَا عِنْدَ النَّوْمِ ثَلاَثًا فِي كُلِّ عَيْنٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ وَهُوَ حَدِيثُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2048، يذكر الحجامة، والإثمد، والكحل، واللدود والسعوط، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2048 (Chapters on Medicine), that mentions cupping, ithmid (antimony kohl), kohl for the eye, medicine given by the mouth-side or the nose, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2048، جس میں حجامہ، اثمد سرمہ، سرمہ، لدود اور سعوط، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2048 (Capítulos sobre Medicina), menciona la ventosaterapia, el ithmid (kohl de antimonio), el kohl para los ojos, la administración de medicamentos por vía oral o nasal y la búsqueda de tratamiento. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2048 (Chapitres sur la médecine), mentionne la ventousothérapie, l'ithmid (khôl d'antimoine), le khôl pour les yeux, l'administration de médicaments par voie buccale ou nasale, et la recherche de soins. Le Répertoire des ouvrages de référence sur la médecine le classe parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de 2048 numaralı hadiste, hacamat, sürme, göz kalemi, ağızdan ilaç alma, burundan ilaç çekme ve diğer tedavi yöntemlerinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2048, menyebutkan bekam, celak mata, eyeliner, obat oral, inhalasi hidung, dan bentuk pengobatan lainnya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
