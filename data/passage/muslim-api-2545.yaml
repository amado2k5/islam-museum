text: "وَحَدَّثَنَا زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا إِسْمَاعِيلُ ابْنُ عُلَيَّةَ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ سَوَادَةَ، عَنْ أَبِيهِ، عَنْ سَمُرَةَ بْنِ جُنْدَبٍ، - - قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يَغُرَّنَّكُمْ أَذَانُ بِلاَلٍ وَلاَ هَذَا الْبَيَاضُ - لِعَمُودِ الصُّبْحِ - حَتَّى يَسْتَطِيرَ هَكَذَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2545، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2545 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2545، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
