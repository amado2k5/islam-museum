text: "حَدَّثَنَا مُحَمَّدُ بْنُ الصَّبَّاحِ، وَأَبُو يُوسُفَ الرَّقِّيُّ مُحَمَّدُ بْنُ أَحْمَدَ الصَّيْدَلاَنِيُّ قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ سَلَمَةَ، عَنْ خُصَيْفٍ، عَنْ عَبْدِ الْعَزِيزِ بْنِ جُرَيْجٍ، قَالَ سَأَلْنَا عَائِشَةَ بِأَىِّ شَىْءٍ كَانَ يُوتِرُ رَسُولُ اللَّهِ ـ قَالَتْ كَانَ يَقْرَأُ فِي الرَّكْعَةِ الأُولَى بِـ {سَبِّحِ اسْمَ رَبِّكَ الأَعْلَى} وَفِي الثَّانِيَةِ {قُلْ يَا أَيُّهَا الْكَافِرُونَ} وَفِي الثَّالِثَةِ {قُلْ هُوَ اللَّهُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1173، يذكر العقاقير والصيدلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1173 (Establishing the Prayer and the Sunnah Regarding Them), that mentions drugs and pharmacy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1173، جس میں ادویہ اور دواسازی کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
