text: "… هذا؟ قال: لا، قال: فاتقوا اللّٰه واعدلوا بين أولادكم. هنا عَلّق محمد عابد على نسخته م في الهامش بخط دقيق لم يتبين لي كثير منه، ومعناه: أن النهي أول الأمر كان لقلة المصاحف والقراء، فخيف عليها لأجل ذلك؛ كما قال …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 8062، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 8062, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
