label: { ar: "سنن النسائي 4355 — الطب والطبيب، الدواء", en: "Sunan al-Nasa'i 4355 — medicine and the physician; the drug", ur: "سنن نسائی 4355 — طب اور طبیب، دوا" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا ابْنُ أَبِي فُدَيْكٍ، عَنِ ابْنِ أَبِي ذِئْبٍ، عَنْ سَعِيدِ بْنِ خَالِدٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ عُثْمَانَ، أَنَّ طَبِيبًا، ذَكَرَ ضِفْدَعًا فِي دَوَاءٍ عِنْدَ رَسُولِ اللَّهِ فَنَهَى رَسُولُ اللَّهِ عَنْ قَتْلِهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 4355، يذكر الطب والطبيب، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 4355 (The Book of Hunting and Slaughtering), that mentions medicine and the physician, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 4355، جس میں طب اور طبیب، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
