text: |-
  ٥١.٦
  ويروى نه رمن أى تطلب لانها ربما قضت العظام تتملح بها وعرى من نسابه يعرى عريا
  فهوعار وعريان والمرأة عريانة وما كان على فعلان فوننه فعلانة بالهاء وأعريته أنا وعرّيته
  تعرية فته رى ويقال ما أحسن معارى هذه المرأة وهى يداها ورجلاها ووجهها قال
  أبو كبير الهذلى
  متكورين على المعارى بينهم • ضرب كتعطاط المزاد الانجل
  و يقال اعروريت منه أمر اقبيها أى ركبت واعروريت الفرس رصكبته، ريانا وهو
  افعوعل وفرس عرى ليس عليه سرج والجمع الاعراء وأماقول الهذلى
  أبيت على معارى واضحات • بهنّ ملوّب كدم العباط
  فاغمانصب الياءلانه أجراها هجرى الحرف الصميح فى ضرورة الشعر ولم ينون لانه لا ينصرف
  ولو قال معارلم ينكسر البيت ولمكنه فر من الزحاف ويقال أعراه صديقه اذا تياعد منه
  ولم ينصره ( زا . زوته الى أبيه وعزيته لغة اذا نسبته اليسه فاعتزى و وتعزى أى انتمى
  وانتسب والاسم العزاء وفى الحديث من تعسزى بعزاء الجاهلية فأعضوم بهن أبيه
  ولا تكنوايعى بنسب الجاهلية. والعزاء أيضا الصبروا لتأسى يقال عزيته تعزية فتعزى
  هو والعزة الفرقة من النساس والهاءعوض من الياء والجمع عزى على فعل وعزون وعزون
  أيضا بالضم ولم يقولواعزات كما قالواثبات ومنه قوله تعالى عن اليمين وعن الشمال عزين قال
  الراعى
  أخليفة الرحن انّ عشيرتى • أمسى -وامهم عزين فلولا
  وقال آخز
  فلا أن أتين على أضاخ * ضرحن حصاه أشتاتاعزنا
  أى جماعات فى تفرقة قال الاصعى يقال فى الدار عزون أى أصناف من الناس ⁦(عسا )⁩
  الاصحىّ عا الشئ يعوعوا وعاء عدود أى يبس واشتد وصلب وعسا الشيخ يعو
  عسياولى وكير مثل عنا قال الإخفش عست يده تعسوعسوا غلظت من العمل قال الخليل
  يقال للشيخ قدعسا ويقال للنبنات اذا غلظ قد عسا قال وفيسه لغة أخرى عمى بالكسم
  وقال أبو عبيد العاسى شمراخ النحل والعسامصودا البلح وعسى من أفعال المقاربة وفيه
  طمع واشفاق ولا يتصرّف لانه وقع بلفظ الماضى الماجاء فى الحال تقول عسى زيد أن يخرج
  وعست فلانة أن تخرج فزيدفاعل عسى وأن يخرج مفع ولها وهو بمعنى الخروج الا أنّ خبره
  لا يكون اسمالا يقال عسى زيد منطلفا وآماقولهم عسى الغو يرابؤسافشاذنادروض.
  أبوساموضع الخبر وقديأتى فى إلامثال مالا يأتى فى غمها وربماشم واعسى بكاد
  واستعملوا الفعل بعده بغير أن فقالواعسى زيد ينطلق قال الشاعر
  عسنى اللّٰه يغنى عن بلادا بن قادر * بمنه مرجون الرباب سكوب
  ويقال عسيت أن أفعسل ذاك وعسيت بالكسر وقرىً فهل عسيتم بالكسر وتول للمرأة
  عست أن تفعل ذالدوعسيتنّ للنساء وعسيتم للرجال ولاية ال منه يفعل ولا فاعل وعسى
  من اللّٰه واجبة فى جميع القرآن الافى قوله عسى ربه ان طلقسكنّ أن يعسدله وقال أبو عبيدة
  عسى من اللّٰه ايجاب فجاءت على احدى لغق العرب لان عسى فى كلامهم رجاء ويقين وأنشد
  لابن مقبل
  ظى بهم كعسى وهم يتنوفة • يتفازعون جوائز الامشال
