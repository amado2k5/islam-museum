label: { ar: "صحيح البخاري 1321 — دفن وقبر ومرقد", en: "Sahih al-Bukhari 1321 — a burial, grave or resting place", ur: "صحیح بخاری 1321 — تدفین، قبر اور مرقد", es: "Sahih al-Bukhari 1321 — un entierro, tumba o lugar de descanso", fr: "Sahih al-Bukhari 1321 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sahih el-Buhari 1321 — Defin, mezar ve istirahat yeri", id: "Sahih al-Bukhari 1321 — Pemakaman, kuburan, dan tempat peristirahatan" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا الشَّيْبَانِيُّ، عَنْ عَامِرٍ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّ رَسُولَ اللَّهِ مَرَّ بِقَبْرٍ قَدْ دُفِنَ لَيْلاً فَقَالَ \" مَتَى دُفِنَ هَذَا \". قَالُوا الْبَارِحَةَ. قَالَ \" أَفَلاَ آذَنْتُمُونِي \". قَالُوا دَفَنَّاهُ فِي ظُلْمَةِ اللَّيْلِ فَكَرِهْنَا أَنْ نُوقِظَكَ. فَقَامَ فَصَفَفْنَا خَلْفَهُ. قَالَ ابْنُ عَبَّاسٍ وَأَنَا فِيهِمْ فَصَلَّى عَلَيْهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1321، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1321 (Funerals (Al-Janaa'iz)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 1321، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1321 (Funerales (Al-Janaa'iz)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 1321 (Funérailles (Al-Janaa'iz)), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'nin 1321 numaralı hadisinde defin, mezar ve türbeden bahsedilir. Bu hadis, vasiyetnameler, miras, antikalar ve türbeler üzerine araştırmalar yapan bir uzman tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1321, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
