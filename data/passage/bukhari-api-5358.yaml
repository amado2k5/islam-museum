label: { ar: "صحيح البخاري 5358 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 5358 — what was left behind: estate and inheritance", ur: "صحیح بخاری 5358 — ترکہ اور میراث", es: "Sahih al-Bukhari 5358 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 5358 — Ce qui a été laissé derrière: biens et héritage" }
text: "… أَحَدَهُمَا مِنَ الآخَرِ. فَقَالَ عُمَرُ اتَّئِدُوا أَنْشُدُكُمْ بِاللَّهِ الَّذِي بِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ، هَلْ تَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". يُرِيدُ رَسُولُ اللَّهِ نَفْسَهُ. قَالَ الرَّهْطُ قَدْ قَالَ ذَلِكَ. فَأَقْبَلَ عُمَرُ عَلَى عَلِيٍّ وَعَبَّاسٍ فَقَالَ أَنْشُدُكُمَا بِاللَّهِ هَلْ تَعْلَمَانِ أَنَّ رَسُولَ اللَّهِ قَالَ ذَلِكَ قَالاَ قَدْ قَالَ ذَلِكَ. قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5358، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5358 (Supporting the Family), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 5358، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5358 (Apoyo a la Familia), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 5358 (Soutenir la famille), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
