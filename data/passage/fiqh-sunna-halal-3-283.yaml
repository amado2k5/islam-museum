text: "… غير حاجة إليه. فكان حرامًا، مثل إتلاف المال، ولقول الرسول ملياتع لا ضرّرّ ولا ضِرّار. وفي رواية أخرى أن هذا النوع من الطلاق مكروه لقول النبي علية : أبغض الحلال إلى اللّٰه الطلاق. وفي لفظ : ما أحل اللّٰه شيئًا …"
