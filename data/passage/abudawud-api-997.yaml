label: { ar: "سنن أبي داود 997 — الأب والأبوة", en: "Sunan Abi Dawud 997 — the father and fatherhood", ur: "سنن ابی داؤد 997 — باپ اور والدیت" }
text: "حَدَّثَنَا عَبْدَةُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، حَدَّثَنَا مُوسَى بْنُ قَيْسٍ الْحَضْرَمِيُّ، عَنْ سَلَمَةَ بْنِ كُهَيْلٍ، عَنْ عَلْقَمَةَ بْنِ وَائِلٍ، عَنْ أَبِيهِ، قَالَ صَلَّيْتُ مَعَ النَّبِيِّ فَكَانَ يُسَلِّمُ عَنْ يَمِينِهِ \" السَّلاَمُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ \". وَعَنْ شِمَالِهِ \" السَّلاَمُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 997، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 997 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 997، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
