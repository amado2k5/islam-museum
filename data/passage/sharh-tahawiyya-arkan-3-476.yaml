text: "… هذه الأركان الخمسة. وهذه يكفي في تعلمها بدليلها مرّة في العمر في أن يتعلمها، فيدخل في الإيمان عن عِلّمِ بهذا الدّليل، فلو نسيه بعد ذلك، أو غاب عنه، أو غفل لم يؤثّر في استدامة وصحة إيمانه وإسلامه. هذا هو معنى …"
