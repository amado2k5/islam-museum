text: "… في أساس البلاغة البيت له في البيان، والبخلاء، وزهر الآداب، ولكثير في العقد الفريد. - نوادر وأشعار الطويل فقلت لها يا أمَّ بيضاءَ إِنّه صار شنّاً. الكامل مجتاب شملة بُرجُدٍ لسَرَاتِه ويستحسن قوله في صفة الثَّور : من الكامل يبدوُ …"
summary:
