text: "ي الدين، ويعلمهم السنة ومعالم الإسلام، ويأخذ منهم صدقاتهم، وكتب له كتابا عهد إليه فيه عهده وأمره أمره. ثم أورده ابن إسحاق . وقد قدمناه في وفد ملوك حمير من طريق البيهقي، وقد رواه النسائي نظير ما ساقه محمد بن"
