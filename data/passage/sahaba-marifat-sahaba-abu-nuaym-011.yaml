text: "٢٠٩٢ معرفة الصحابة محمد رسول الله إلى عمير ذي مران، ومن أسلم من همدان ، أن سلام عليكم، فإني أحمد إليكم الله الذي لا إله إلا هو، وأن محمدا رسول الله، وأقمتم الصلاة وأزكيتم الزكاة، فإن لكم ذمة الله وذمة"
