text: |-
  قوله وقرلهسم ما أعقله الح.بفى
  التاموس وقول الجوهرى
  ما أءة لدعنك شيأ أى دع عنك
  الشك تصبف والصواب
  ما أعذله بالعين والفاء اهV٧
  ٢٢١٨
  انتصاف النهاروعقات الابل من العقال شتد المكثرة وقال • يعقلهنّ جعد شظعى
  واعتقات الشاة اذا وضعت رباه ابين فخذيك أو ساقيك اتحلبها واعتقل رمحه اذا وضعه
  بين ساقه وركابه واعتقل الرجل حبس واعتقل اسانه اذالم يقدر على الكلام وصارعه
  فاعتة-له الشغزبية وهو أن يلوى رجله على رجله وتعقل تكاف العقل كما يقال تحلم وتكيس
  وتعاقل أرى من نفسه ذلك وليس به وعقلت المرأشعرها مشطته والعاقلة الماشطة
  وقواهم ما أعقله عنك شيأ أى دع عناك الشك وهذا حرف روامسيبو يه فى باب الابتداء يضهر
  فيه مابنى على الابتداء كأنه قال ما أعلم شيأ عماتة ول فذع عنك الشك ويستدلّ بهذا على صمة
  الاضمار فى كلامهم للاختصار وكذلك قوله-م خذ عنك وسرعنك وقال بكر المازنى سالت
  أبازيدوالاصمعى وأبامالك والاخفش عن هذاالح-رف فقالواجيعاماندرى ماهو وقال
  الاخفس أنا مذ خلقت أسأل عن هذا والعقنقل الكتيب العظيم المتداخل الرمل والجمع
  عقاقل وربماسموامصادين الضبّ ءقنقلا قبل العبولة والعقبول الحلاء
  وهو قروح صغار تخرج بالشفة من بقايا المرض والجمع العقابيل ⁦(عكل)⁩ عكات
  المتاع أعكله بالضم اذا نضدت بعضه على بعض وعكاه حبسه يقال عكا وهم معكل سوء
  وعكله صرعه وعكل فى الامر جدّوعسكل فلان مات وعكاه أى ساقه أبو عمرووعكات البعير
  أعكاه عكاا وهو أن تعقله بجبل وذلك الحبل هو العكال قال الفراء أعكل علىّ الخبرواعذكل
  أى أشمكل مثل أحكل واحتكل واعتكل التوران تناطها وعكل برأيه أى حدس به وعكات
  المسرجة بالكسرأى اجتمع فيها الدردى مثل عكرت وعكل قبيلة وبلد أيضا والعوكل
  من النساء المقاء والعوكل الكثيب العظيم الاأنه دون العقنقل والعوكلة الرم-لالعظيمة
  قال ذوالرمّة * وقد قابلته عوكلات عوانك* ⁦(علل )⁩ العلّ القراد المهزول والعل
  الرجل المسنّ الصغير الجثة يشبه بالراد وبنو العلات هم أولاد الرجل من نسوة شتى
  سحيت بذلك لانّ الذى تزوّجها على أولى قسد كانت قبلها ثم علّ من هذه والعال الشرب الثانى
  يقال علل بعد نهل وعلى يعله ويعله اذاسقاه السقية الثانيسة وعلّ بنفسه يتعدى ولا يتعدى
  وأع-ل القوم شربت ابلهم العلل والتعليل سقى بعدسقى وجنى النمرة مرة بعدأخرى وعلّ
  الضارب المضروب اذا تابع عليه الضرب وفى المثل عرض على سوم عالة أى لم يبالغ لان
  العالة لا يعرض عليها السرب عرضايدالغ فيه كالعرض على الناهلة وأعلات الابل اذا
  أصدرتها قبل ريما وفى أصحاب الاشتفاق من يقول هوبالغين المعجمسة كانه من العطس
  والاوّل هوالمسموع والعلة المرض وحدث يشغل صاحبه عن وجهه كأنّ تلك العلة
  صارت شغلا ثانيا منعه عن شغله الاوّل واعسلّ أى مرض فهوعليسل ولا أعلك اللّٰه أى
  لا أصابك بعلة واعتلّ عليه بعسلة وأعتله اذا اعتاقه عن أمر واعت-له تجنى عليه وقواهم على
  علاته أى على كل حال وقال
  وان ضريت على العلات أحت * أجيج الهقل من خيط النعام
  وقال زهير
  انّ البخييل ملوم حيث كان واككن الجواد على علا ته هرم
  وعله
