label: { ar: "نوادر جحا الكبرى، ص 80 — «أيفر الإنسان من رحمة الله؟»", en: "Nawadir Juha al-Kubra, p. 80 — 'Does a Man Flee from God's Mercy?'", ur: "نوادر جحا الکبریٰ، ص 80 — «کیا انسان اللہ کی رحمت سے بھاگتا ہے؟»", fr: "Nawadir Juha al-Kubra, p. 80 — « L'homme fuit-il la miséricorde de Dieu ? »", es: "Nawadir Juha al-Kubra, p. 80 — «¿Huye el hombre de la misericordia de Dios?»", tr: "Juha'nın Büyük Öyküleri, s. 80 — “İnsan Allah'ın merhametinden kaçabilir mi?”", id: "Anekdot-Anekdot Hebat Juha, hlm. 80 — “Bisakah seseorang melarikan diri dari rahmat Tuhan?”" }
text: "… أيَفرّ الإنسان من رحمة اللَّه؟ كان يوماً جالساً في نافذة داره، ينظر إلى المطر الذي كان نازلاً بشدَّة، فرأى أحد جيرانه راكضاً بسرعة البرق، مخافة أن تتبلل ثيابه، فناداهُ الشيخ وقال له: لماذا تركض؟ فأجابه الرجل: أفرّ من المطر وفي …"
summary:
  ar: "ركض جار تحت المطر، فسأله جحا لماذا، فقال إنه يفر من المطر الذي يسمى بالتركية رحمة؛ فقال جحا إن على الإنسان ألا يفر من رحمة الله، فتأثر الجار ومشى ببطء حتى ابتل؛ وفيما بعد ركض جحا تحت المطر وقال إنه يسرع حتى لا يدوس الرحمة. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  en: "A neighbour runs in the rain; Juha asks why; the neighbour says he flees rain, which in Turkish is called mercy; Juha says a man should not flee God's mercy; the neighbour is moved and walks slowly until soaked; later Juha runs in the rain, saying he is hurrying so as not to tread on the mercy. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  ur: "ایک پڑوسی بارش میں دوڑ رہا تھا؛ جحا نے پوچھا کیوں؛ اس نے کہا کہ میں بارش سے بھاگ رہا ہوں جسے ترکی میں رحمت کہتے ہیں؛ جحا نے کہا کہ انسان کو اللہ کی رحمت سے نہیں بھاگنا چاہیے؛ پڑوسی متاثر ہوا اور آہستہ چلتا رہا یہاں تک کہ بھیگ گیا؛ بعد میں جحا خود بارش میں دوڑا اور کہا کہ میں اس لیے جلدی کر رہا ہوں کہ رحمت کو پاؤں تلے نہ روندوں۔ {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  fr: "Un voisin court sous la pluie; Juha lui demande pourquoi; le voisin dit qu'il fuit la pluie, qu'on appelle miséricorde en turc; Juha dit qu'on ne doit pas fuir la miséricorde de Dieu; le voisin, touché, marche lentement jusqu'à être trempé; plus tard, Juha court sous la pluie en disant qu'il se hâte pour ne pas fouler la miséricorde. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  es: "Un vecino corre bajo la lluvia; Juha le pregunta por qué; el vecino dice que huye de la lluvia, que en turco se llama misericordia; Juha dice que el hombre no debe huir de la misericordia de Dios; el vecino, conmovido, camina despacio hasta empaparse; más tarde, Juha corre bajo la lluvia diciendo que se apresura para no pisar la misericordia. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
  tr: "Komşusu yağmurda koşuyordu, bu yüzden Cüha ona nedenini sordu. Komşusu, Türkçede \"rahmet\" denilen yağmurdan kaçtığını söyledi. Cüha, insanın Allah'ın rahmetinden kaçmaması gerektiğini söyledi. Komşusu duygulandı ve ıslanana kadar yavaşça yürüdü. Daha sonra Cüha yağmurda koştu ve rahmete basmamak için acele ettiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 80}"
  id: "Seorang tetangga berlari di tengah hujan, lalu Juha bertanya mengapa. Tetangga itu menjawab bahwa ia berlari karena hujan, yang dalam bahasa Turki disebut \"rahma\" (rahmat). Juha berkata bahwa seseorang tidak boleh lari dari rahmat Tuhan. Tetangga itu terharu dan berjalan perlahan hingga basah kuyup. Kemudian, Juha berlari di tengah hujan dan berkata bahwa ia bergegas agar tidak menginjak rahmat. {cite:juha-nawadir-kubra-djuwaydi p. 80}"
