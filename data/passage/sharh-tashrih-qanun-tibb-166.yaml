text: "… إلى مشابهة المادة المعدة تغذيتها، وتلك الأجسام تسمى أيضا أغذية. وهي مثل الخبز واللحم والطعام للإنسان ولا بد أن تكون لهذه الأجسام التي تسمى أغذية في بدن الإنسان ونحوه عضو يحيلها إلى طبائع الأخلاط وذلك العضو هو الذي نسميه الكبد، …"
