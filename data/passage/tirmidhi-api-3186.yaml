text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ أَبِي زِيَادٍ، حَدَّثَنَا أَبُو زَيْدٍ، عَنْ عَوْفٍ، عَنْ قَسَامَةَ بْنِ زُهَيْرٍ، حَدَّثَنَا الأَشْعَرِيُّ، قَالَ لَمَّا نَزَلََ : (وأنْذِرْ عَشِيرَتَكَ الأَقْرَبِينَ ) وَضَعَ رَسُولُ اللَّهِ أَصْبُعَيْهِ فِي أُذُنَيْهِ فَرَفَعَ مِنْ صَوْتِهِ فَقَالَ \" يَا بَنِي عَبْدِ مَنَافٍ يَا صَبَاحَاهُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ مِنْ حَدِيثِ أَبِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3186، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3186 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3186، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
