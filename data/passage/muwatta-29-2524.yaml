label: { ar: "الموطأ 2524 — سليمان بن يسار: دية المجوسي ثمانمائة درهم", en: "Muwatta 2524", es: "Muwatta 2524", fr: "Muwatta 2524", ur: "موطا 2524", tr: "El-Muvatta 2524 — Süleyman ibn Yasar: Mecusi için kan parası sekiz yüz dirhemdir.", id: "Al-Muwatta 2524 — Sulayman ibn Yasar: Uang darah untuk seorang Majusi adalah delapan ratus dirham" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أن سليمان بن يسار كان يقول: دية المجوسي ثماني مئة درهم. قال مالك: وهو الأمر عندنا. {cite:muwatta-maruf-1997 p.435}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet eder ki, Süleyman ibn Yasar şöyle derdi: Mecusiler için kan parası sekiz yüz dirhemdir. Malik dedi ki: Bu, aramızda yerleşik bir uygulamadır. {cite:muwatta-maruf-1997 s.435}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, bahwa Sulayman ibn Yasar biasa berkata: Uang darah untuk seorang Majusi adalah delapan ratus dirham. Malik berkata: Ini adalah kebiasaan yang berlaku di antara kami. {cite:muwatta-maruf-1997 p.435}"
