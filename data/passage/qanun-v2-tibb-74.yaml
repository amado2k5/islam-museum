text: "الكتاب الثالث الفنّ الأوّل : في أمراض الرأس والدماغ ذلك كان في لبن مرضعة جارية، وخصوصاً عند اشتداد الوجع وغلبة السهر. وأما الكيّ وفصد الشرايين وقطعها وعرق الجبهة في البيضة، فعلى ما كان في الصداع العتيق. وأما الغذاء فما لا …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 74، يذكر الكي، والمرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 74, that mentions cautery, illness and the sick, pain, named diseases, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 74 کا اقتباس جس میں داغنا، بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 74, que menciona la cauterización, la enfermedad y los enfermos, el dolor, enfermedades específicas, los órganos del cuerpo, la cirugía, la circuncisión y las férulas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 74, qui mentionne la cautérisation, la maladie et les malades, la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
