text: "… : فرأيت الماء يخرج من بين أصابعه، وأوضح منه ما وقع في حديث ابن عباس عند الطبراني فجاءوا بشن، فوضع رسول اللّٰه وَ فه يده عليه، ثم فرق أصابعه، فنبع الماء من أصابع رسول الله لللفي مثل عصا موسى، فإن …"
