label: { ar: "جامع الترمذي 1122 — الحرام", en: "Jami' al-Tirmidhi 1122 — the unlawful", ur: "جامع ترمذی 1122 — حرام", es: "Jami' al-Tirmidhi 1122 — lo ilícito", fr: "Jami' al-Tirmidhi 1122 — l'illicite" }
text: "… كَعْبٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ إِنَّمَا كَانَتِ الْمُتْعَةُ فِي أَوَّلِ الإِسْلاَمِ كَانَ الرَّجُلُ يَقْدَمُ الْبَلْدَةَ لَيْسَ لَهُ بِهَا مَعْرِفَةٌ فَيَتَزَوَّجُ الْمَرْأَةَ بِقَدْرِ مَا يَرَى أَنَّهُ يُقِيمُ فَتَحْفَظُ لَهُ مَتَاعَهُ وَتُصْلِحُ لَهُ شَيْئَهُ حَتَّى إِذَا نَزَلَتِ الآيَةُ : ⁦( إِلاَّ عَلَى أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ )⁩ قَالَ ابْنُ عَبَّاسٍ فَكُلُّ فَرْجٍ سِوَى هَذَيْنِ فَهُوَ حَرَامٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1122، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1122 (The Book on Marriage), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1122، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1122 (El Libro del Matrimonio), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1122 (Le Livre du mariage), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
