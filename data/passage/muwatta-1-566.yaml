label: { ar: "الموطأ 566 — لكل نبي دعوة يدعو بها، فأريد أن أختبئ دعوتي شفاعة لأمتي في الآخرة", en: "Muwatta 566", es: "Muwatta 566", fr: "Muwatta 566", ur: "موطا 566", tr: "El-Muvatta 566 — Her peygamberin yaptığı bir dua vardır ve ben de duamı ahirette ümmetim için şefaat olarak tutmak istiyorum.", id: "Al-Muwatta 566 — Setiap nabi memiliki doa yang dipanjatkannya, dan aku ingin menjadikan doaku ini sebagai syafaat bagi umatku di akhirat." }
text: "لكل نبي دعوة يدعو بها، فأريد أن أختبئ دعوتي، شفاعة لأمتي في الآخرة"
summary:
  ar: "أول حديث في باب ما جاء في الدعاء. يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي أخبر أن لكل نبي دعوة يدعو بها، وأنه يريد أن يدخر دعوته شفاعة لأمته في الآخرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق بن عيسى الطباع عند أحمد (2/486) وإسماعيل بن أبي أويس عند البخاري (6304)، وينقل عن ابن عبد البر ⁦(التمهيد 19/62–63)⁩ أن جماعة رواة الموطأ رووه بهذا الإسناد، وأن ابن وهب رواه عن مالك عن الزهري عن أبي سلمة عن أبي هريرة وهو غريب، وأن الإسنادين صحيحان لمالك. {cite:muwatta-maruf-1997 p.291} {cite:muwatta-maruf-1997 p.292}"
  id: "Hadits pertama dalam surah tentang doa. Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) bersabda bahwa setiap nabi memiliki doa yang dipanjatkannya, dan bahwa beliau (Nabi) ingin menyimpan doanya sebagai syafaat bagi umatnya di akhirat. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Ishaq ibn 'Isa al-Tabba' dalam kumpulan hadits Ahmad (2/486) dan oleh Isma'il ibn Abi Uways dalam kumpulan hadits al-Bukhari (6304). Ia mengutip Ibnu 'Abd al-Barr (al-Tamhid 19/62-63) yang mengatakan bahwa sekelompok perawi al-Muwatta' meriwayatkan hadits ini dengan sanad seperti ini, dan bahwa Ibnu Wahb meriwayatkannya dari Malik atas otoritas al-Zuhri, atas otoritas Abu Salamah, atas otoritas Abu Hurayrah, yang dianggap langka, dan bahwa kedua sanad tersebut sahih bagi Malik. {cite:muwatta-maruf-1997 p.291} {cite:muwatta-maruf-1997 p.292}"
