label: { ar: "الموطأ 566 — لكل نبي دعوة يدعو بها، فأريد أن أختبئ دعوتي شفاعة لأمتي في الآخرة", en: "Muwatta 566" }
text: "لكل نبي دعوة يدعو بها، فأريد أن أختبئ دعوتي، شفاعة لأمتي في الآخرة"
summary:
  ar: "أول حديث في باب ما جاء في الدعاء. يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي أخبر أن لكل نبي دعوة يدعو بها، وأنه يريد أن يدخر دعوته شفاعة لأمته في الآخرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق بن عيسى الطباع عند أحمد (2/486) وإسماعيل بن أبي أويس عند البخاري (6304)، وينقل عن ابن عبد البر (التمهيد 19/62–63) أن جماعة رواة الموطأ رووه بهذا الإسناد، وأن ابن وهب رواه عن مالك عن الزهري عن أبي سلمة عن أبي هريرة وهو غريب، وأن الإسنادين صحيحان لمالك. {cite:muwatta-maruf-1997 p.291} {cite:muwatta-maruf-1997 p.292}"
