label: { ar: "الموطأ 1917 — مالك: لحوم الطير كلها مخالفة للحوم الأنعام والحيتان، فلا بأس بأن يشترى بعضها ببعض متفاضلا يدا بيد، ولا يباع شيء منها إلى أجل", en: "Muwatta 1917", es: "Muwatta 1917", fr: "Muwatta 1917", ur: "موطا 1917", tr: "El-Muvatta 1917 — Malik: Bütün kuşların eti, çiftlik hayvanlarının ve balinaların etinden farklıdır; bu yüzden, bunlardan bazılarını elden ele, eşit olmayan miktarlarda satın almakta bir sakınca yoktur ve hiçbiri kredili olarak satılmamalıdır.", id: "Al-Muwatta 1917 — Malik: Daging semua unggas berbeda dengan daging ternak dan paus, jadi tidak ada salahnya membeli sebagian dari mereka untuk sebagian lainnya dalam jumlah yang tidak sama, secara langsung, dan tidak satu pun dari mereka yang boleh dijual secara kredit." }
summary:
  ar: "قال مالك: وأرى لحوم الطير كلها مخالفة للحوم الأنعام والحيتان، فلا أرى بأسا بأن يشترى بعض ذلك ببعض متفاضلا، يدا بيد. ولا يباع شيء من ذلك إلى أجل. {cite:muwatta-maruf-1997 p.185}"
  tr: "Malik şöyle dedi: \"Tüm kuş etlerini sığır ve balina etlerinden farklı görüyorum, bu yüzden bir kısmını diğerleriyle eşit olmayan miktarlarda, elden ele almanın bir sakıncasını görmüyorum. Hiçbiri kredili satılmamalıdır.\" {cite:muwatta-maruf-1997 s.185}"
  id: "Malik berkata: Saya menganggap semua daging unggas berbeda dari daging sapi dan paus, jadi saya tidak melihat ada salahnya membeli sebagian dari mereka untuk orang lain dalam jumlah yang tidak sama, secara langsung. Tidak satu pun dari mereka yang boleh dijual secara kredit. {cite:muwatta-maruf-1997 p.185}"
