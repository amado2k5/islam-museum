text: "… فإن عملَه يُضَاعَفُ له أجرُه. وقد تأوَّل بعضُ السَّلفِ مِنْ بني هاشم دخول آل النَّبِيِّ وَلِيِ في هذا المعنى لدخولِ أزواجهِ؛ فلذلك من حَسُنَ إسلامُه بتحقيقِ إيمانِه وعملِه راجع الدر المنثور فقد عزاه إليه. كذا في ف، ولعل الصواب: وكذلك."
