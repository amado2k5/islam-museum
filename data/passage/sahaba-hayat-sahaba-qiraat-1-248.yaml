text: "… رياض الجنة، ومن تبعه القرآن زخ فى قفاه فقذفه فى النار. وعنده ايضا عن ابى الأسود الديلى قال: جمع ابو موسى القراء فقال : لا تدخلوا على الا من جمع القرآن! قال: فدخلنا عليه زهاء ثلاثمائة فوعظنا وقال : اتم …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 248، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 248, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 248 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 1, pág. 248, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 1, page 248, mentionne les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Kandahlawi'nin \"Sahabelerin Hayatları\" adlı eserinin 1. cildinin 248. sayfasından bir alıntı, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Kandahlawi, \"Kehidupan Para Sahabat,\" Jilid 1, halaman 248, menyebutkan para qari, penyusunan Al-Quran, dan manuskrip; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
