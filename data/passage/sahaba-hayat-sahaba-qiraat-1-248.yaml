text: "… رياض الجنة، ومن تبعه القرآن زخ فى قفاه فقذفه فى النار. وعنده ايضا عن ابى الأسود الديلى قال: جمع ابو موسى القراء فقال : لا تدخلوا على الا من جمع القرآن! قال: فدخلنا عليه زهاء ثلاثمائة فوعظنا وقال : اتم …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 248، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
