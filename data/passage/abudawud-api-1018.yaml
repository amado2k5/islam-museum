text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، ح وَحَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا مَسْلَمَةُ بْنُ مُحَمَّدٍ، قَالَ حَدَّثَنَا خَالِدٌ الْحَذَّاءُ، حَدَّثَنَا أَبُو قِلاَبَةَ، عَنْ أَبِي الْمُهَلَّبِ، عَنْ عِمْرَانَ بْنِ حُصَيْنٍ، قَالَ سَلَّمَ رَسُولُ اللَّهِ فِي ثَلاَثِ رَكَعَاتٍ مِنَ الْعَصْرِ ثُمَّ دَخَلَ - قَالَ عَنْ مَسْلَمَةَ - الْحُجَرَ فَقَامَ إِلَيْهِ رَجُلٌ يُقَالُ لَهُ الْخِرْبَاقُ كَانَ طَوِيلَ الْيَدَيْنِ فَقَالَ لَهُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1018، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1018 (Prayer (Kitab Al-Salat)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1018، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
