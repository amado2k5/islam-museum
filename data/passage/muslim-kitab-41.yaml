summary:
  ar: "القسم 41 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الشعر»، ويضم فيها النصوص من 5887 إلى 5896 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 41 of Sahih Muslim (The Book of Poetry) in the division of the open hadith dataset the museum took its reports from: reports 5887 to 5896 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 41، عنوان «کتاب الشعر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5887 تا 5896۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 41 de Sahih Muslim (El Libro de la Poesía) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5887 al 5896, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
