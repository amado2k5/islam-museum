summary:
  ar: "القسم 46 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب القراءات عن رسول الله»، ويضم فيها النصوص من 2927 إلى 2949 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 46 of Jami' al-Tirmidhi (Chapters on Recitation) in the division of the open hadith dataset the museum took its reports from: reports 2927 to 2949 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 46، عنوان «کتاب القراءات عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2927 تا 2949۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 46 de Jami' al-Tirmidhi (Capítulos sobre la recitación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2927 al 2949 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
