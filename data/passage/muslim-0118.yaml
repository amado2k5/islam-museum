text: "قال رسول الله: «بادروا بالأعمال فتناً كقطع الليل المظلم، يصبح الرجل مؤمناً ويمسي كافراً أو يمسي مؤمناً ويصبح كافراً، يبيع دينه بعرض من الدنيا»"
summary:
