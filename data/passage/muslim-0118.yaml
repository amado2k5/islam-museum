label: { ar: "مسلم 118 — بادروا بالأعمال فتناً كقطع الليل المظلم", en: "Muslim 118 — Hasten to do good before fitan like dark-night segments", es: "Musulmán 118 — Apresúrense a hacer el bien antes de que la tentación sea como una noche oscura.", fr: "Muslim 118 — Hâtez-vous de faire le bien avant que la fitan ne soit comme une nuit obscure", ur: "مسلم 118 - اندھیری رات کے حصوں کی طرح فتن سے پہلے نیکی کرنے میں جلدی کرو", tr: "Müslim 118 - Karanlık gecenin parçaları gibi imtihanlar gelmeden önce, iyi ameller işlemeye acele edin.", id: "Muslim 118 — Bergegaslah dalam melakukan amal kebaikan sebelum cobaan datang seperti bercak-bercak kegelapan malam." }
text: "قال رسول الله: «بادروا بالأعمال فتناً كقطع الليل المظلم، يصبح الرجل مؤمناً ويمسي كافراً أو يمسي مؤمناً ويصبح كافراً، يبيع دينه بعرض من الدنيا»"
summary:
  ar: "رواية أبي هريرة في باب الحث على المبادرة بالأعمال قبل تظاهر الفتن من كتاب الإيمان في صحيح مسلم؛ الفتن كقطع الليل المظلم وبيع الدين بعرض الدنيا — من أشهر نصوص التحذير."
  tr: "Sahih Müslim'de yer alan İman Kitabı'ndaki, insanları musibetler gelmeden önce hayırlı işlerde harekete geçmeye teşvik eden bölümde Ebu Hurayra'nın rivayeti şöyledir: \"Musibetler karanlık bir gecenin parçaları gibidir ve dünyevi kazanç için din satmak da böyledir.\" Bu, en meşhur uyarı metinlerinden biridir."
  id: "Riwayat Abu Hurairah dalam bab tentang mendorong manusia untuk berinisiatif melakukan amal kebaikan sebelum cobaan datang, dari Kitab Iman dalam Sahih Muslim; cobaan itu seperti potongan-potongan malam yang gelap dan menjual agama demi keuntungan duniawi — salah satu teks peringatan yang paling terkenal."
