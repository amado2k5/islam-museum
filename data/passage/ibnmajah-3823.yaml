label:
  ar: "ابن ماجه 3823 — الصوم لي وأنا أجزي به"
  en: "Ibn Majah 3823 — Fasting is Mine, and I reward it"
  ur: "ابن ماجہ 3823 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "كل عمل ابن آدم يضاعف له الحسنة بعشر أمثالها إلى سبعمائة ضعف . قال الله سبحانه إلا الصوم فإنه لي وأنا أجزي به ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3823: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3823: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3823: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
