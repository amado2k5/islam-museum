text: "… الايمان، مع أنهم قائمون بالطاعة الواجبة في الاسلام، وإذا وقعت منهم ذنوب تابوا واستغفروا منها، وحقائق الايمان التي في القلوب لا يعرفون وجوبها، بل ولا أنها من الايمان، بل كثير ممن يعرفها منهم يظن أنها من النوافل المستحبة إن صدق …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 368، يرد فيه ذكر الواجب، والوجوب، والمستحب، والنافلة والنوافل، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 368, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), the supererogatory (nafila), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
