text: "… الايمان، مع أنهم قائمون بالطاعة الواجبة في الاسلام، وإذا وقعت منهم ذنوب تابوا واستغفروا منها، وحقائق الايمان التي في القلوب لا يعرفون وجوبها، بل ولا أنها من الايمان، بل كثير ممن يعرفها منهم يظن أنها من النوافل المستحبة إن صدق …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 368، يرد فيه ذكر الواجب، والوجوب، والمستحب، والنافلة والنوافل، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 368, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), the supererogatory (nafila), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 368 کا اقتباس جس میں واجب، وجوب، مستحب، نفل اور نوافل، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Iman de Ibn Taymiyya, volume numérisé 1, p. 368, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb), le surérogatoire (nafila), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Iman de Ibn Taymiyya, volumen digitalizado 1, p. 368, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mustahabb), lo supererogatorio (nafila), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 368. sayfasından, farz, müstehap, nafile ve itaat amellerini ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, itaat amelleri, müstehap, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 368, yang membahas amalan wajib, amalan anjuran, amalan sunnah, dan amalan ketaatan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
