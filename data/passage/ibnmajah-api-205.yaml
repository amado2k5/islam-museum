label: { ar: "سنن ابن ماجه 205 — عمل يعدل عملا أعظم منه", en: "Sunan Ibn Majah 205 — a deed that equals a greater one", ur: "سنن ابن ماجہ 205 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ سَعْدِ بْنِ سِنَانٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنْ رَسُولِ اللَّهِ ـ أَنَّهُ قَالَ \" أَيُّمَا دَاعٍ دَعَا إِلَى ضَلاَلَةٍ فَاتُّبِعَ فَإِنَّ لَهُ مِثْلَ أَوْزَارِ مَنِ اتَّبَعَهُ وَلاَ يَنْقُصُ مِنْ أَوْزَارِهِمْ شَيْئًا وَأَيُّمَا دَاعٍ دَعَا إِلَى هُدًى فَاتُّبِعَ فَإِنَّ لَهُ مِثْلَ أُجُورِ مَنِ اتَّبَعَهُ وَلاَ يَنْقُصُ مِنْ أُجُورِهِمْ شَيْئًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 205، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 205 (The Book of the Sunnah), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 205، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
