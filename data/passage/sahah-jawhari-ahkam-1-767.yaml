text: "… العِسْبارَةُ : ولد الضبُع من الذئب، الذكَر الدين على عُسْرَتِهِ، وعَسَرَتِ المرأةُ، إذا عَسُرَ ولادها، حرف العين. عسر - واجبةٌ في جميع القرآن إلاّ في قوله: عَسَىٰ رَبُّهُ، إِن من الله إيجابٌ، فجاءت على إحدى لغتي العرب، لأنَّ عَسَى في …"
