label: { ar: "الموطأ 1287 — عبادة بن الوليد عن أبيه عن جده: بايعنا رسول الله على السمع والطاعة في العسر واليسر وأن نقول بالحق حيثما كنا", en: "Muwatta 1287", es: "Muwatta 1287", fr: "Muwatta 1287", ur: "موطا 1287", tr: "El-Muvatta 1287 — Ubadah ibn el-Walid, babasından, o da dedesinden rivayetle: Biz, Allah'ın Resulüne biat ettik; sıkıntı ve kolaylık zamanlarında O'nu dinlemeye ve itaat etmeye, bulunduğumuz her yerde doğruyu söylemeye söz verdik.", id: "Al-Muwatta 1287 — Ubadah ibn al-Walid, berdasarkan riwayat ayahnya, berdasarkan riwayat kakeknya: Kami telah berbaiat kepada Rasulullah untuk mendengarkan dan taat dalam suka dan duka, dan untuk berbicara jujur di mana pun kami berada." }
text: "بَايَعْنا رَسولَ اللهِ على السَّمْعِ وَالطّاعةِ، في الْيُسْرِ وَالْعُسْرِ، وَالْمَنْشطِ وَالْمَكْرهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه أخبره عبادة بن الوليد بن عبادة بن الصامت عن أبيه عن جده أنهم بايعوا رسول الله على السمع والطاعة، في اليسر والعسر، والمنشط والمكره، وأن لا ينازعوا الأمر أهله، وأن يقولوا أو يقوموا بالحق حيثما كانوا. ويذكر المحقق أن ابن عبد البر رأى هذا الإسناد هو الصحيح عند جمهور رواة الموطأ، وأن القعنبي رواه عن عبادة بن الصامت دون ذكر الأب. {cite:muwatta-maruf-1997 p.573}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ettiğine göre, Ubadah ibn al-Walid ibn Ubadah ibn al-Samit'in babasından, dedesinden rivayet ederek kendisine, Allah'ın Resulü'ne biat ettiklerini, kolaylıkta ve zorlukta, sevinçte ve kederde O'nu dinlemeye ve itaat etmeye, yetkililerle otorite konusunda tartışmamaya ve nerede olurlarsa olsunlar doğruyu söylemeye ve savunmaya yemin ettiklerini anlattığını aktarır. Araştırmacı, İbn Abd al-Barr'ın bu rivayet zincirini Muvatta'nın ravilerinin çoğunluğuna göre doğru kabul ettiğini ve Kanabi'nin bunu Ubadah ibn al-Samit'ten, babadan bahsetmeden rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.573}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, yang mengatakan bahwa 'Ubadah ibn al-Walid ibn 'Ubadah ibn al-Samit memberitahunya, dari ayahnya, dari kakeknya, bahwa mereka berjanji setia kepada Rasulullah untuk mendengarkan dan menaati, dalam suka dan duka, dalam kegembiraan dan kesedihan, dan tidak memperdebatkan kekuasaan dengan orang-orang yang berkuasa, dan untuk berbicara atau menegakkan kebenaran di mana pun mereka berada. Peneliti menyebutkan bahwa Ibn 'Abd al-Barr menganggap sanad ini sebagai sanad yang benar menurut mayoritas perawi al-Muwatta', dan bahwa al-Qa'nabi meriwayatkannya dari 'Ubadah ibn al-Samit tanpa menyebutkan ayahnya. {cite:muwatta-maruf-1997 p.573}"
