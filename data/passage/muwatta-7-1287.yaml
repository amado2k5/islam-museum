text: "بَايَعْنا رَسولَ اللهِ على السَّمْعِ وَالطّاعةِ، في الْيُسْرِ وَالْعُسْرِ، وَالْمَنْشطِ وَالْمَكْرهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه أخبره عبادة بن الوليد بن عبادة بن الصامت عن أبيه عن جده أنهم بايعوا رسول الله على السمع والطاعة، في اليسر والعسر، والمنشط والمكره، وأن لا ينازعوا الأمر أهله، وأن يقولوا أو يقوموا بالحق حيثما كانوا. ويذكر المحقق أن ابن عبد البر رأى هذا الإسناد هو الصحيح عند جمهور رواة الموطأ، وأن القعنبي رواه عن عبادة بن الصامت دون ذكر الأب. {cite:muwatta-maruf-1997 p.573}"
