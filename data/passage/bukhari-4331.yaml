label: { ar: "البخاري 4331 — النبي يجمع الأنصار في قبة من أدم", en: "Bukhari 4331 — The Prophet gathers the Ansar in a leather tent" }
text: "فحُدّث رسول الله بمقالتهم فأرسل إلى الأنصار فجمعهم في قبة من أدم ولم يدع معهم غيرهم، فلما اجتمعوا قام النبي فقال: «ما حديث بلغني عنكم؟»… «فإني أعطي رجالاً حديثي عهد بكفر أتألفهم، أما ترضون أن يذهب الناس بالأموال وتذهبون بالنبي إلى رحالكم؟»"
summary:
  ar: "في كتاب المغازي؛ رواية أنس بن مالك في وجد الأنصار حين أعطى النبي قريشاً المئات من الإبل وتركهم وسيوفهم تقطر من دماء هوازن، وجمعه إياهم في قبة أدم دون غيرهم حتى قالوا رضينا، وإخبارهم بالأثرة بعده وتركه علامة عدم الصبر عند أنس «فلم يصبروا»."
