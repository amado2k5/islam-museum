text: "فحُدّث رسول الله بمقالتهم فأرسل إلى الأنصار فجمعهم في قبة من أدم ولم يدع معهم غيرهم، فلما اجتمعوا قام النبي فقال: «ما حديث بلغني عنكم؟»… «فإني أعطي رجالاً حديثي عهد بكفر أتألفهم، أما ترضون أن يذهب الناس بالأموال وتذهبون بالنبي إلى رحالكم؟»"
summary:
  ar: "في كتاب المغازي؛ رواية أنس بن مالك في وجد الأنصار حين أعطى النبي قريشاً المئات من الإبل وتركهم وسيوفهم تقطر من دماء هوازن، وجمعه إياهم في قبة أدم دون غيرهم حتى قالوا رضينا، وإخبارهم بالأثرة بعده وتركه علامة عدم الصبر عند أنس «فلم يصبروا»."
  tr: "Maghazi kitabında Enes bin Malik, Peygamber'in Kureyş'e yüzlerce deve verip, onları Hawazin'in kanıyla ıslanmış kılıçlarıyla bırakıp, başkalarını dışlayarak deri bir çadıra topladığında Ensar'ın üzüntüsünü anlatmıştır. Enes'e göre, Peygamber, Kureyş'e yapılan iltimas ve sabırsızlığın bir işareti olarak onları terk ettiğini bildirmiş ve \"onlar da sabretmemişlerdir.\""
  id: "Dalam kitab Maghazi, Anas bin Malik menceritakan kesedihan kaum Ansar ketika Nabi memberi kaum Quraisy ratusan unta dan meninggalkan mereka dengan pedang yang berlumuran darah Hawazin, lalu mengumpulkan mereka di dalam tenda kulit tanpa kehadiran orang lain sampai mereka berkata, “Kami puas,” dan Nabi memberitahukan mereka tentang perlakuan istimewa setelah beliau dan kepergiannya sebagai tanda ketidaksabaran menurut Anas, “sehingga mereka tidak sabar.”"
