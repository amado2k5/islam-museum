text: "۞ وَقِيلَ لِلَّذِينَ ٱتَّقَوْا۟ مَاذَآ أَنزَلَ رَبُّكُمْ ۚ قَالُوا۟ خَيْرًا ۗ لِّلَّذِينَ أَحْسَنُوا۟ فِى هَـٰذِهِ ٱلدُّنْيَا حَسَنَةٌ ۚ وَلَدَارُ ٱلْـَٔاخِرَةِ خَيْرٌ ۚ وَلَنِعْمَ دَارُ ٱلْمُتَّقِينَ"
text_search: "۞ وقيل للذين اتقوا ماذا أنزل ربكم ۚ قالوا خيرا ۗ للذين أحسنوا في هذه الدنيا حسنة ۚ ولدار الآخرة خير ۚ ولنعم دار المتقين"
translations:
  en: { text: "And it is said unto those who ward off (evil): What hath your Lord revealed? They say: Good. For those who do good in this world there is a good (reward) and the home of the Hereafter will be better. Pleasant indeed will be the home of those who ward off (evil) -", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور (جب) پرہیزگاروں سے پوچھا جاتا ہے کہ تمہارے پروردگار نے کیا نازل کیا ہے۔ تو کہتے ہیں کہ بہترین (کلام) ۔ جو لوگ نیکوکار ہیں ان کے لیے اس دنیا میں بھلائی ہے۔ اور آخرت کا گھر تو بہت ہی اچھا ہے۔ اور پرہیز گاروں کا گھر بہت خوب ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
