label: { ar: "صحيح البخاري 7280 — من أطاع الله ورسوله", en: "Sahih al-Bukhari 7280 — whoever obeys God and His Messenger", ur: "صحیح بخاری 7280 — جس نے اللہ اور اس کے رسول کی اطاعت کی", fr: "Sahih al-Bukhari 7280 — celui qui obéit à Dieu et à Son Messager", es: "Sahih al-Bujari 7280 — quien obedece a Dios y a Su Mensajero", tr: "Sahih el-Buhari 7280 — Allah'a ve Resulüne itaat eden kimse", id: "Sahih al-Bukhari 7280 — Barangsiapa yang taat kepada Allah dan Rasul-Nya" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا فُلَيْحٌ، حَدَّثَنَا هِلاَلُ بْنُ عَلِيٍّ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" كُلُّ أُمَّتِي يَدْخُلُونَ الْجَنَّةَ، إِلاَّ مَنْ أَبَى \". قَالُوا يَا رَسُولَ اللَّهِ وَمَنْ يَأْبَى قَالَ \" مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ، وَمَنْ عَصَانِي فَقَدْ أَبَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7280، يرد فيه ذكر من أطاع الله ورسوله. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 7280 (Holding Fast to the Qur'an and Sunnah), whose wording mentions whoever obeys God and His Messenger. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 7280، جس کے الفاظ میں جس نے اللہ اور اس کے رسول کی اطاعت کی کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 7280, dont le texte mentionne celui qui obéit à Dieu et à Son Messager. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 7280, cuyo texto menciona quien obedece a Dios y a Su Mensajero. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 7280 numaralı hadis, Allah'a ve Resulüne itaat edenlerden bahsetmektedir. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7280, menyebutkan orang-orang yang taat kepada Allah dan Rasul-Nya. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
