text: "… نَقْتَدِي بِهَا يعني: الرمح. قال: وسُمِّيَت مكة: أُمُّ القرى لتقدمها أمام جميعها وجمعها ما سواها، وقيل: لأنَّ الأرض دُحِيَت مِن تحتها. ويقال لها أيضًا: الفاتحة؛ لأنها تفتتح بها القِرَاءة، وافتتحت الصحابة بها كتابة المصحف الإمام، وصَحَّ تسميتها بالسَّبع المثاني، قالوا: …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 231، يذكر جمع القرآن والمصاحف، ورسم المصحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 231, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 231 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
