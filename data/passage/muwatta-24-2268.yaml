summary:
  ar: "يروي مالك عن عبد الله بن دينار عن عبد الله بن عمر أن النبي نهى عن بيع الولاء وعن هبته. {cite:muwatta-maruf-1997 p.336}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Peygamberimiz velayetin (sadakatin) satılmasını ve hediye edilmesini yasaklamıştır. {cite:muwatta-maruf-1997 s.336}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, dari Abdullah ibn Umar, bahwa Nabi melarang jual beli dan pemberian wala' (kesetiaan). {cite:muwatta-maruf-1997 p.336}"
