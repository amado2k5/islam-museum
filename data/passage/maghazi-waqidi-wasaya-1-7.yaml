text: "… رسول اللّٰه ولم يخرج حتى بعشه أَبو بكر بعد وفاة النبيّ، وتُوفّى يوم الاثنين لثنتى عشرة مضت من ربيع الأَوّل سنة إحدى عشرة. فكانت مغازى النبيّ التى غزا بنفسه سبعاً وعشرين غزوة. وكان ما قاتل فيها تسعاً : بدرُ القتالِ، …"
