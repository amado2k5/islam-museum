text: "… من الميت. إنما هو للمهلة. الكفن من الحرير : لا يحل للرجل أن يكفن في الحرير ويحل للمرأة، لقول رسول اللّٰه في الحرير والذهب : إنهما حرام على ذكور أمني حل لإناثها. وكره كثير من أهل العلم للمرأة أن تكفن …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 524، يذكر ما أُحل، وما لا يحل، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 524, that mentions what was made lawful, what is not lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
