label: { ar: "سنن أبي داود 1041 — الأب والأبوة", en: "Sunan Abi Dawud 1041 — the father and fatherhood", ur: "سنن ابی داؤد 1041 — باپ اور والدیت", es: "Sunan Abi Dawud 1041 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ الطَّيَالِسِيُّ، حَدَّثَنَا شُعْبَةُ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ قَبِيصَةَ بْنِ هُلْبٍ، - رَجُلٍ مِنْ طَيِّئٍ - عَنْ أَبِيهِ، أَنَّهُ صَلَّى مَعَ النَّبِيِّ وَكَانَ يَنْصَرِفُ عَنْ شِقَّيْهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1041، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1041 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1041، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1041 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
