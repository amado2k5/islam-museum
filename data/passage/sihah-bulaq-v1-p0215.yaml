text: |-
  ٤٢٢/
  ⁦(باب الزاى)⁩
  وقسدجزز أسنانه والحز الفرض فى الشئ الواحدة حزة وقد وزت العود أحزه حزاواذا
  أصاب المرفق طارف كركرة البعيرفقطعه وأدماه قيل به حاز فأمااذالم يدمه فهو الماسح وفى
  الحديث الاثم حزاز القلوب والحزالمين والوقت قال أبو ذؤيب
  حتق اذاحززت مياه رزونه • وبأى حز ملاوة تتقطع
  وحزة السراويل حجزته وأما الذى فى الحديث آخذ بحزته فاغماير يدبعنقه وهوعلى التشييه
  والحزة قطعة من اللحم قطعت طولا قال اعشى باهلة
  تكفيه حزة فلذان ألمّ:ها • من الشواء ويروى شريه الغمر
  والحزاز الهبرية فى الرأس الواحدة حزازة والحزازة أيضاءج-ع فى القلب من فيظ وغحوه
  قال زفر بن الحرث السكلابى
  وقد ينبت المرعى على دمن الثرى • وتبقى حزازات النفوس كماهيه
  • قال أبو عبيد ضربه مثلالرجسل يفظهرمودة وقلبه نغل بالعداوة قال وكذلك الحزاز والحزاز
  يفتح الحاءوضمها وأنشد للشماخ يصف رحلاباع قوسامن رجلى وغين فيه
  فلما شراها قاضت العين عبرة * وفى القلب حزازمن اللوم حامن
  قال والحزازماحز فى القلب وكل شئحك فى صدركفقدحز والحزيز المكان الغليظ المنقساد
  والجمع حزان مثل ظليم وظلمان وأحزة قال لبيد
  بأحزة الثلبوت يربأفوقها * قفر المراقب خوفها آرامها
  ⁦( -فز)⁩ حفزه أى دفعه من خلفه يحفزمحفزا وقول الراجز
  وتريح بعد النفس الهفوز * اراحة الجداية النفوز
  يريد النفس الشديد المتتابع الذى كانه يحفز أى يدفع من سياق قالليل يحفز النهارأى
  يسوقه وحفزته بالرمح طعنته والحوفزان لقب الحرث بن شريك الشيدانى لقب بذلك لانّ قيس
  ابن عاصم التميمى حفزه بالرمح حين خاف أن يفوته قال برير يفتخريذلك
  وتحن حفزنا الموفزان بطعنة • سقته نجمعامن دم الحوف أشكل
  وأما قول من قال اغماحة زه بسطام بن قيس فغلط لانه شيانى فكيف يفتضر به جررورأيت
  محتفزا أى مستوفزاو فى الجديث عن على رضى اللّه عنه اذاصلت المرأة فلتحتفزأى تتضامّ
  اذا جلت واذاسجدت ولا تحوى كمايخوى الرجل ⁦(حلز)⁩ تحلز الرجل للامراذاتشمر له
  وكذلك تهلز قال الراجز يرفعن للحادى اذا تحلزا * هاما اذا هزهزنه تهزهزا
  ويروى تهلزا والحلزة يتشديد اللام القصيرة ويقسال البخيلة قال أبوع رويقال رجل حلز
  وامرأة حلزة ومنه الحرث بن حلزة اليشكرى (حز الخزحافة الشى يقال شراب يحمز
  اللسان والهزة بقلة حريفة قال أنس رذى اللّٰه عنه كانى رسول اللّٰه صلى اللّٰه عليه وسلم
  بيقلة كنت أجتنيها وكان يكنى أباحزة والحمازة الشدة وقد حزالجل بالضم فهوحيز الفؤاد
  وحامز وفى حديث ابن عباس أفضل الاعمال أحزها أى أمتنها وأقواها قال الشماخ
  فلما شراها فاضت العين عبرة * وفى القلب حزاز من اللوم جاجز
  ورجل مجموز الجنان أى شديد قال أبو خراش
  أقيدر محموز الجنان ضثيل ⁦(حوز)⁩
  الحوز
