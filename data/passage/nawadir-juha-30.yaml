text: "… الديك لا يعرف الطريق وضع دجاجاً له في قفص؛ وسار بها من مدينة، إلى مدينة أخرى، لِيبيعَها، وبينما هو في الطريق، وقد تَقُلَ عليه حملُ القفص، قال في نفسه : تكاد هذه الحيوانات تموت من الحرّ والجصر فوق بعضها، فما …"
summary:
  ar: "حمل جحا دجاجات في قفص، فلما ثقل القفص أطلقها، ثم راح يطارد الديك قائلًا إنه يعرف الفجر لكنه لا يعرف طريقه عند الظهيرة. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  en: "Juha carries hens in a cage, releases them when the cage gets heavy, and then chases the cock, saying it knows the dawn but not its way at noon. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  ur: "جحا ایک پنجرے میں مرغیاں اٹھائے جا رہا تھا، پنجرہ بھاری ہوا تو انہیں چھوڑ دیا، پھر مرغے کے پیچھے دوڑتے ہوئے کہا کہ یہ صبح کا وقت تو جانتا ہے مگر دوپہر کو اپنا راستہ نہیں جانتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  fr: "Juha porte des poules dans une cage, les lâche quand la cage devient lourde, puis court après le coq en disant qu'il connaît l'aube mais pas son chemin à midi. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  es: "Juha lleva gallinas en una jaula, las suelta cuando la jaula pesa demasiado y luego persigue al gallo diciendo que conoce el alba pero no su camino al mediodía. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
  tr: "Juha kafeste tavuklar taşıyordu, ancak kafes çok ağırlaşınca onları serbest bıraktı. Sonra horozun peşinden koşarak, şafağı bildiğini ama öğle vakti yolunu bilmediğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 19}"
  id: "Juha membawa ayam-ayam dalam sangkar, tetapi ketika sangkar itu menjadi terlalu berat, dia melepaskan ayam-ayam itu. Kemudian dia mengejar ayam jantan itu, sambil berkata bahwa dia mengenal fajar tetapi tidak tahu jalan di siang hari. {cite:juha-nawadir-kubra-djuwaydi p. 19}"
