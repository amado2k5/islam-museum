text: "… عَبْدِ اللَّهِ بْنِ عُمَرَ إِذْ دَخَلَ الْحَجَّاجُ بْنُ أَيْمَنَ فَلَمْ يُتِمَّ رُكُوعَهُ وَلاَ سُجُودَهُ، فَقَالَ أَعِدْ. فَلَمَّا وَلَّى قَالَ لِي ابْنُ عُمَرَ مَنْ هَذَا قُلْتُ الْحَجَّاجُ بْنُ أَيْمَنَ ابْنِ أُمِّ أَيْمَنَ. فَقَالَ ابْنُ عُمَرَ لَوْ رَأَى هَذَا رَسُولُ اللَّهِ لأَحَبَّهُ، فَذَكَرَ حُبَّهُ وَمَا وَلَدَتْهُ أُمُّ أَيْمَنَ. قَالَ وَحَدَّثَنِي بَعْضُ أَصْحَابِي عَنْ سُلَيْمَانَ وَكَانَتْ حَاضِنَةَ النَّبِيِّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3737، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3737 (Companions of the Prophet), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3737، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
