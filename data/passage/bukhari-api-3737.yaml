label: { ar: "صحيح البخاري 3737 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 3737 — the orphan and the father lost", ur: "صحیح بخاری 3737 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 3737 — El huérfano y el padre perdido", fr: "Sahih al-Bukhari 3737 — L'orphelin et le père perdus", tr: "Sahih el-Buhari 3737 — Yetim ve Babayı Kaybetme", id: "Sahih al-Bukhari 3737 — Anak Yatim dan Kehilangan Ayah" }
text: "… عَبْدِ اللَّهِ بْنِ عُمَرَ إِذْ دَخَلَ الْحَجَّاجُ بْنُ أَيْمَنَ فَلَمْ يُتِمَّ رُكُوعَهُ وَلاَ سُجُودَهُ، فَقَالَ أَعِدْ. فَلَمَّا وَلَّى قَالَ لِي ابْنُ عُمَرَ مَنْ هَذَا قُلْتُ الْحَجَّاجُ بْنُ أَيْمَنَ ابْنِ أُمِّ أَيْمَنَ. فَقَالَ ابْنُ عُمَرَ لَوْ رَأَى هَذَا رَسُولُ اللَّهِ لأَحَبَّهُ، فَذَكَرَ حُبَّهُ وَمَا وَلَدَتْهُ أُمُّ أَيْمَنَ. قَالَ وَحَدَّثَنِي بَعْضُ أَصْحَابِي عَنْ سُلَيْمَانَ وَكَانَتْ حَاضِنَةَ النَّبِيِّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3737، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3737 (Companions of the Prophet), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3737، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3737 (Compañeros del Profeta), menciona al huérfano y al padre desaparecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sahih al-Bukhari, n° 3737 (Compagnons du Prophète), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3737 numaralı hadis, yetimlerden ve babasızlık durumundan bahseder. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3737, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
