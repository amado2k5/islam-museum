label: { ar: "جامع الترمذي 2664 — الحلال، استحلال الشيء", en: "Jami' al-Tirmidhi 2664 — the lawful; treating a thing as lawful", ur: "جامع ترمذی 2664 — حلال، کسی چیز کو حلال ٹھہرانا", es: "Jami' al-Tirmidhi 2664 — lo lícito; tratar algo como lícito", fr: "Jami' al-Tirmidhi 2664 — le licite; considérer une chose comme licite" }
text: "… اللَّخْمِيِّ، عَنِ الْمِقْدَامِ بْنِ مَعْدِيكَرِبَ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَلاَ هَلْ عَسَى رَجُلٌ يَبْلُغُهُ الْحَدِيثُ عَنِّي وَهُوَ مُتَّكِئٌ عَلَى أَرِيكَتِهِ فَيَقُولُ بَيْنَنَا وَبَيْنَكُمْ كِتَابُ اللَّهِ فَمَا وَجَدْنَا فِيهِ حَلاَلاً اسْتَحْلَلْنَاهُ وَمَا وَجَدْنَا فِيهِ حَرَامًا حَرَّمْنَاهُ وَإِنَّ مَا حَرَّمَ رَسُولُ اللَّهِ كَمَا حَرَّمَ اللَّهُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2664، يذكر الحلال، واستحلال الشيء، والحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2664 (Chapters on Knowledge), that mentions the lawful, treating a thing as lawful, the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2664، جس میں حلال، کسی چیز کو حلال ٹھہرانا، حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2664 (Capítulos sobre el Conocimiento), menciona lo lícito, lo que se considera lícito, lo ilícito y lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2664 (Chapitres sur la science), mentionne ce qui est licite, ce qui est considéré comme licite, et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
