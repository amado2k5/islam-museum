label: { ar: "الموطأ 2488 — مالك: ما فيه الدية كاملة من الإنسان", en: "Muwatta 2488", es: "Muwatta 2488", fr: "Muwatta 2488", ur: "موطا 2488", tr: "Al-Muwatta 2488 — Malik: Bunun içinde bir kişinin tam kan parası da yer almaktadır.", id: "Al-Muwatta 2488 — Malik: Yang termasuk di dalamnya adalah uang darah penuh dari seseorang." }
summary:
  ar: "يروي مالك أنه بلغه أن في كل زوج من الإنسان الدية كاملة، وأن في اللسان الدية كاملة، وأن في الأذنين إذا ذهب سمعهما الدية كاملة، اصطُلمتا أو لم تُصطلما، وفي ذكر الرجل الدية كاملة، وفي الأنثيين الدية كاملة. {cite:muwatta-maruf-1997 p.426}"
  tr: "Malik, insan vücudundaki her bir uzuv çifti için tam kan parası ödenmesi gerektiğini, dil için tam kan parası ödenmesi gerektiğini, işitme kaybı durumunda kulaklar için (hasar görmüş olsun ya da olmasın) tam kan parası ödenmesi gerektiğini, bir erkeğin cinsel organı için tam kan parası ödenmesi gerektiğini ve testisler için de tam kan parası ödenmesi gerektiğini duyduğunu bildirmiştir. {cite:muwatta-maruf-1997 s.426}"
  id: "Malik melaporkan bahwa ia mendengar bahwa uang darah penuh harus dibayarkan untuk setiap pasang anggota tubuh manusia, bahwa uang darah penuh harus dibayarkan untuk lidah, bahwa uang darah penuh harus dibayarkan untuk telinga jika pendengarannya hilang, baik rusak atau tidak, bahwa uang darah penuh harus dibayarkan untuk penis seorang pria, dan bahwa uang darah penuh harus dibayarkan untuk testis. {cite:muwatta-maruf-1997 p.426}"
