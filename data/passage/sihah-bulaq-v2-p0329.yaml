text: |-
  ١ فى نسخة قبل هذا الشطر
  تقاسرت والعيز صين-ة النه-م
  الى سنانا روقودها الرتم
  ٢٥٨
  • ⁦(فصل الهمزة)⁩*
  بفتح الهمزة أصل الشجرة والقرن قال صذر الفىّ يهجور جلا
  تيس تيوس اذا يناطحها • يألم قرنا أرومه نقد.
  قوله يألم قرنا أى يألم قربّه وقد جاء على هذاحروف منها قولهم يبع ظهراو يشتكي عينا أى
  يشتكى عينه ونصب تيس على الذم أبوزيدما بالدار أريم ومابما أرم يحذف الياء أى مابها
  احد قال زهير
  دارلاسماء بالغسمرين ماثلة • كالوحى ليس بها من أهلها أرم
  وأرم على الشي يأرم بالكسر أى عض عليه وأرمه أيضا أى أكله قال الكميت
  ويأرم كل نابتة رعاء * و-شاشالهنّ وساطبينا
  أى من كثرتها وقوله لهن أى للنابتة ومنهسنة آرمة أى مستأصلة ويقال أومت السنة
  بأمو النا أى أكات كل شئ وأرمت الحبل آرمه ارما اذا فتلته فتلاشديدا وقال
  يسد أعلى حبله ويأرمه * ويروى بالزاى والارم الاضراس كأنه جمع آرم يقال فلان
  يحرق عليك الازم اذا تغيظ فك أضراسه بعضها يعض قال الشاعر
  نبئُتِ أَحاءسليى انما • باتواغضايايحرقون الارما
  وقولهم جارية مأرومة حسنة الارم اذا كانت محدولة الحلق ويقال الارم الحجارة قال
  النضر بن شميل سألت نوح بن جريرين الخطفى عن قول الشاءر • يلاك من حرد على"الارّما
  فقال الخصى زم الازمة الشدة والقحط بقال أصابتهم سنة أزمتهم أزما أى
  استأصلتهم وأزم علينا الدهر يأزم ازما أى اشتدوقل خيره ويقال أيضا أزم الرجل
  بصاحبه اذالزمه عن أبى ريدوأزمه أيضا أى عضه وأنم عن الشئ أى أمسكْ عنه قال أبوزيد
  الازم الذى ضمّ شفتيه وفى الحديث أنّ عمردضى اللّٰه عنه سأل الحرث بن كادة ما الدواحفقال
  الازم يعنى الهية وكان طبيب العرب أبوزيد أزمت الخيط اذافتلته بالزاى والراهجيعا قال
  والازم ضرب من الضفر وتأزم التوم دارهم اذا أطالوا الاقامة ج اوالمأزم المضيق مثل
  المأزل وأنشد الاصمحى عن أبى مهدية
  هذاطريق يازم المازما * وعضوات تشق الهازما
  قال ويروى عصوات وهى جمع عصا وتمنق تضرب والما زم كل طريق ضيق بينجيلين
  وموضع الحرب أيضامأزم ومنه هى الموضع الذى بين المشعرو بينعرفة مأزمين الاصمى"
  المأزم فى سندعضيق بينجمع وعرفة وفى الحديث بين المأزمين وأنشداساعدة ين جوّية
  ومقامهنّ اذا حبن بمازم • ضيق ألفة وصدهنّ الاخشب
  سم يقال للاسد أسامة وهوم«رفة نقول همذا أسامة غاديا قال زهير يمدح هرم
  ابن سنان
  ولانب أشجع من أسامة اذ • دعمت نزال ولج فى الذعر
  وأسامة اسم رجل وأما الاسم فنذكره فى المعتل لان الالف زائدة اضمالاضم الغضر
  ويجمع على أضمات وقد أضم عليه بالكسر يأضم أضما واضم بكسر الهمزة جبل قال
  الراجز يسف نارا ١ •شبت بأعلى عاندين من اضم* طم لاطم مثل الاجم يخفف
  وينقل ساد الجمع آطام وهى حصون لاهل المدينة قال أوس بن مغراه السعدى
