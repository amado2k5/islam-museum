text: "… بِي. قال ابن الجوزي : أي في الرجاء وأمل العفو. عَنْ جَابِرِ بْنِ عَبْدِ اللّهَ ته أنه سمع النبي قَبْلَ مَوْتِهِ بِثَلاثَةِ أَيَّامٍ يَقُولُ: لا يَمُوتَّنَّ أَحَدُكُمْ إِلا وَهُوَ يُحْسِنُ بِاللَّهَّ الظَّنَّ. قال العلماء : معنى إحسان الظن بالله أن …"
summary:
