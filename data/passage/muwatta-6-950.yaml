summary:
  ar: "قول لمالك: أهل أصحاب رسول الله بالعمرة عام حجة الوداع، ثم قال لهم رسول الله: من كان معه هدي فليهل بالحج مع العمرة، ثم لا يحل حتى يحل منهما جميعاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1080) وسويد (508) والشيباني (393)، وأنه سيأتي موصولاً في الرقم (1042)، وأن الحديث سيأتي في الباب (74) عن القاسم عن عائشة في دخول الحائض مكة. {cite:muwatta-maruf-1997 p.453}"
