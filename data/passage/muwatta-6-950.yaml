label: { ar: "الموطأ 950 — مالك: أهل أصحاب رسول الله بالعمرة عام حجة الوداع، ثم قال لهم: من كان معه هدي فليهل بالحج مع العمرة، ثم لا يحل حتى يحل منهما جميعاً", en: "Muwatta 950", es: "950 Muwatta", fr: "950 Muwatta", ur: "950 موطا", tr: "El-Muvatta 950 — Malik: Allah Resulü'nün sahabeleri, Veda Hac yılında Umre için ihrama girdiler. Bunun üzerine Resulullah onlara şöyle buyurdu: \"Yanında kurbanlık hayvanı olan kimse, Umre ile birlikte Hac için de ihrama girsin ve ikisi için de ihramdan çıkıncaya kadar ihramdan çıkmasın.\"" }
text: "من كان معه هدي فليهل بالحج مع العمرة، ثم لا يحل حتى يحل منهما جميعاً"
summary:
  ar: "قول لمالك: أهل أصحاب رسول الله بالعمرة عام حجة الوداع، ثم قال لهم رسول الله: من كان معه هدي فليهل بالحج مع العمرة، ثم لا يحل حتى يحل منهما جميعاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1080) وسويد (508) والشيباني (393)، وأنه سيأتي موصولاً في الرقم (1042)، وأن الحديث سيأتي في الباب (74) عن القاسم عن عائشة في دخول الحائض مكة. {cite:muwatta-maruf-1997 p.453}"
  tr: "Malik şöyle demiştir: Allah Resulü'nün Sahabeleri, Veda Hacında Umre için ihrama girdiler. Sonra Allah Resulü onlara şöyle buyurdu: Kimin yanında kurbanlık hayvanı varsa, Hac ve Umre için ihrama girsin ve her ikisi için de ihramdan çıkıncaya kadar ihramdan çıkmasın. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1080), Suveyd (508) ve Şeybani (393) tarafından rivayet edildiğini ve 1042 numaralı hadiste bağlantılı bir rivayet zinciriyle yer alacağını ve hadisin, adetli bir kadının Mekke'ye girmesiyle ilgili olarak, 74. surede, Aişe'den rivayet edilen el-Kasım'dan geçeceğini belirtmektedir. {cite:muwatta-maruf-1997 s.453}"
  id: "Malik berkata: Para Sahabat Rasulullah SAW memasuki keadaan ihram untuk Umrah selama Haji Perpisahan. Kemudian Rasulullah SAW bersabda kepada mereka: Barang siapa yang membawa hewan kurban, hendaklah ia memasuki keadaan ihram untuk Haji bersamaan dengan Umrah, dan ia tidak boleh keluar dari keadaan ihram sampai ia selesai melakukan keduanya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1080), Suwaid (508), dan al-Shaybani (393), dan akan muncul dengan sanad yang berkesinambungan dalam nomor (1042), dan hadits ini akan muncul dalam bab (74) dari al-Qasim dari Aisyah mengenai wanita yang sedang haid memasuki Mekah. {cite:muwatta-maruf-1997 p.453}"
