label: { ar: "الموطأ 1311 — أبو قتادة في حنين: من قتل قتيلا له عليه بينة فله سلبه، وقول أبي بكر في أسد من أسد الله", en: "Muwatta 1311", es: "Muwatta 1311", fr: "Muwatta 1311", ur: "موطا 1311", tr: "El-Muvatta 1311 — Ebu Katade, Huneyn hakkında: Delil bulunan bir düşmanı öldüren kimse, onun ganimetine hak kazanır. Ve Ebu Bekir, Allah'ın aslanlarından biri hakkında şöyle dedi:", id: "Al-Muwatta 1311 — Abu Qatada tentang Hunayn: Barangsiapa membunuh musuh yang terbukti bersalah, maka ia berhak atas rampasan perangnya. Dan Abu Bakr berkata tentang seekor singa dari singa-singa Allah." }
text: "مَن قَتَلَ قَتِيلًا، لَهُ عَلَيْهِ بَيِّنةٌ، فَلهُ سَلَبهُ"
summary:
  ar: "يروي يحيى بن يحيى عن مالك عن يحيى بن سعيد عن عمر بن كثير بن أفلح عن أبي محمد مولى أبي قتادة عن أبي قتادة بن ربعي أنه قال خرجنا مع رسول الله عام حنين، فلما التقينا كانت للمسلمين جولة، فرأى رجلا من المشركين قد علا رجلا من المسلمين، فضربه من ورائه على حبل عاتقه، فأقبل عليه فضمه، ثم أرسله. فقال عمر ما بال الناس، فقال أمر الله. ثم قال رسول الله من قتل قتيلا له عليه بينة فله سلبه، ثلاث مرات، حتى قال له رجل صدق يا رسول الله، وسلب ذلك القتيل عندي، فقال أبو بكر لا ها الله إذا لا يعمد إلى أسد من أسد الله يقاتل عن الله ورسوله فيعطيك سلبه، فقال رسول الله صدق فأعطه إياه، فبعت الدرع فاشتريت به مخرفا في بني سلمة، وهو أول مال تأثلته في الإسلام. ويذكر المحقق أن الصواب فيه عمر بن كثير بن أفلح عند أكثر الرواة. {cite:muwatta-maruf-1997 p.585}"
  tr: "Yahya ibn Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Ömer ibn Kathir ibn Aflah'tan, o da Ebu Katada'nın azatlı kölesi Ebu Muhammed'den, o da Ebu Katada ibn Rib'i'den rivayet ederek şöyle dedi: \"Hunayn yılında Allah'ın Resulü ile birlikte yola çıktık. Düşmanla karşılaştığımızda, Müslümanlar savaşta yer değiştirmişti. Peygamberimiz, müşriklerden birinin bir Müslümanı alt ettiğini gördü ve onu arkadan omzundan vurdu. Peygamberimiz ona döndü, onu kucakladı ve sonra bıraktı. Ömer, 'İnsanlara ne oluyor?' diye sordu. Peygamberimiz, 'Bu Allah'ın emridir' diye cevap verdi.\" Sonra Allah'ın Resulü, \"Kim bir düşmanı öldürür ve bunun delili varsa, ganimetini alır\" dedi ve bunu üç defa tekrarladı. Sonra bir adam ona, \"Ey Allah'ın Resulü, o adam haklı, öldürülen adamın ganimeti bendedir\" dedi. Ebu Bekir, \"Hayır, Allah'a yemin ederim ki, o zaman Allah ve Resulü için savaşan Allah'ın aslanlarından birini alıp sana ganimetini vermez\" dedi. Allah'ın Resulü, \"O adam haklı, öyleyse ona ver\" dedi. Ben de zırhı sattım ve onunla Beni Seleme'de bir hurma bahçesi aldım. Bu, İslam'da edindiğim ilk servet oldu.\" Araştırmacı, çoğu rivayete göre doğru ismin Ömer ibn Kathir ibn Aflah olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.585}"
  id: "Yahya bin Yahya meriwayatkan dari Malik, dari Yahya bin Sa'id, dari Umar bin Kathir bin Aflah, dari Abu Muhammad, budak yang dibebaskan oleh Abu Qatada, dari Abu Qatada bin Rib'i, yang berkata: \"Kami pergi bersama Rasulullah pada tahun Hunayn. Ketika kami bertemu musuh, kaum Muslimin mendapat giliran berperang. Beliau melihat seorang pria dari kaum musyrik yang telah mengalahkan seorang pria Muslim, lalu beliau memukulnya dari belakang di bahunya. Nabi menoleh kepadanya, memeluknya, lalu melepaskannya. Umar bertanya, 'Ada apa dengan orang-orang itu?' Beliau menjawab, 'Itu adalah perintah Allah.'\" Kemudian Rasulullah SAW bersabda, 'Siapa pun yang membunuh musuh dan memiliki bukti, maka dia akan mendapatkan rampasannya,' tiga kali, hingga seorang laki-laki berkata kepadanya, 'Dia benar, wahai Rasulullah, dan rampasan orang yang terbunuh itu ada padaku.' Abu Bakar berkata, 'Tidak, demi Allah, dia tidak mungkin mengambil salah satu singa Allah yang berperang untuk Allah dan Rasul-Nya dan memberikan rampasannya kepadamu.' Rasulullah SAW bersabda, 'Dia benar, maka berikanlah kepadanya.' Maka aku menjual baju besi itu dan membeli kebun kurma di Banu Salama dengannya, dan itu adalah kekayaan pertama yang kudapatkan dalam Islam.\" Peneliti menyebutkan bahwa nama yang benar adalah Umar bin Kathir bin Aflah menurut sebagian besar perawi. {cite:muwatta-maruf-1997 p.585}"
