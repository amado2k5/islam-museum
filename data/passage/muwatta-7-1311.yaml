label: { ar: "الموطأ 1311 — أبو قتادة في حنين: من قتل قتيلا له عليه بينة فله سلبه، وقول أبي بكر في أسد من أسد الله", en: "Muwatta 1311" }
text: "مَن قَتَلَ قَتِيلًا، لَهُ عَلَيْهِ بَيِّنةٌ، فَلهُ سَلَبهُ"
summary:
  ar: "يروي يحيى بن يحيى عن مالك عن يحيى بن سعيد عن عمر بن كثير بن أفلح عن أبي محمد مولى أبي قتادة عن أبي قتادة بن ربعي أنه قال خرجنا مع رسول الله عام حنين، فلما التقينا كانت للمسلمين جولة، فرأى رجلا من المشركين قد علا رجلا من المسلمين، فضربه من ورائه على حبل عاتقه، فأقبل عليه فضمه، ثم أرسله. فقال عمر ما بال الناس، فقال أمر الله. ثم قال رسول الله من قتل قتيلا له عليه بينة فله سلبه، ثلاث مرات، حتى قال له رجل صدق يا رسول الله، وسلب ذلك القتيل عندي، فقال أبو بكر لا ها الله إذا لا يعمد إلى أسد من أسد الله يقاتل عن الله ورسوله فيعطيك سلبه، فقال رسول الله صدق فأعطه إياه، فبعت الدرع فاشتريت به مخرفا في بني سلمة، وهو أول مال تأثلته في الإسلام. ويذكر المحقق أن الصواب فيه عمر بن كثير بن أفلح عند أكثر الرواة. {cite:muwatta-maruf-1997 p.585}"
