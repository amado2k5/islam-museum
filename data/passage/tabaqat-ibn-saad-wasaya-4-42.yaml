text: "… محمّدًا ما دمتُ حيَّا. أخبرنا عبد اللّٰه بن نُمير قال : حدثنا عُبيد اللّٰه بن قسمّاه عبد الرحمن. عمر عن مافع عن ابن عمر أَنَّه حنّط. عبسدٍ الرحمن بن زيد بن الخطَّاب وكفنه وحمله ثم دخسل المسجد فصلى ولم يتوضَّاً. …"
