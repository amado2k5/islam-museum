text: "… الأضياف، ما لكم في العالم من منزل، إن أنتم إلا عابرو سبيل. - حدثنا أبو معاوية عن الأعمش عن خيثمة قال: كان عيسى ابن مريم يصنع الطعام لأصحابه، قال: ثم يقوم عليهم ويقول: هكذا فاصنعوا بالقراء. - حدثنا عفان بن …"
