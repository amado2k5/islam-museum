ref: "2520"
label:
  ar: "أبو داود 2520 — أرواح الشهداء في جوف طير خضر: أنا أبلغهم عنكم"
  en: "Abu Dawud 2520 — The souls of the martyrs in green birds: I shall tell them about you"
  ur: "ابو داود 2520 — شہیدوں کی روحیں سبز پرندوں میں: میں تمہاری طرف سے انہیں خبر دوں گا"
text: "لما أصيب إخوانكم بأحد جعل الله أرواحهم في جوف طير خضر ترد أنهار الجنة، تأكل من ثمارها، وتأوي إلى قناديل من ذهب معلقة في ظل العرش، فلما وجدوا طيب مأكلهم ومشربهم ومقيلهم قالوا : من يبلغ إخواننا عنا أنا أحياء …"
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 2520: أرواح الشهداء في جوف طير خضر: أنا أبلغهم عنكم. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 2520: The souls of the martyrs in green birds: I shall tell them about you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 2520: شہیدوں کی روحیں سبز پرندوں میں: میں تمہاری طرف سے انہیں خبر دوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
