label: { ar: "الموطأ 384 — إذا عجل به السير جمع بين المغرب والعشاء", en: "Muwatta 384", es: "Muwatta 384", fr: "Muwatta 384", ur: "موطا 384", tr: "Al-Muwatta 384 — Eğer yolculuk sırasında acele ediyorsa, akşam namazı ile yatsı namazını birleştirebilir.", id: "Al-Muwatta 384 — Jika ia sedang terburu-buru saat bepergian, ia boleh menggabungkan salat Maghrib dan Isya." }
text: "كان رسول الله إذا عجل به السير يجمع بين المغرب والعشاء"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، في باب الجمع بين الصلاتين في الحضر والسفر: كان النبي إذا عجل به السير يجمع بين المغرب والعشاء. ويخرّجه المحقق عند مسلم (2/150) والنسائي (1/289) وأحمد والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (14/141). {cite:muwatta-maruf-1997 p.207}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayetle, evde veya yolculukta namazları birleştirme bölümünde şöyle nakletmiştir: Peygamberimiz, yolculukta acele ettiği zamanlarda akşam ve yatsı namazlarını birleştirirdi. Editör, bunu Malik'in sahabelerinin rivayet zincirleriyle Müslim (2/150), En-Nesai (1/289), Ahmed, At-Tahavi ve El-Beyhakî'ye dahil etmiş ve At-Tamhid'e (14/141) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.207}"
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, dalam surah tentang menggabungkan salat saat di rumah atau bepergian: Nabi, ketika sedang terburu-buru saat bepergian, biasa menggabungkan salat Maghrib dan Isya. (Penyunting menyertakannya dalam Muslim (2/150), An-Nasa’i (1/289), Ahmad, At-Tahawi, dan Al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada At-Tamhid (14/141)). {cite:muwatta-maruf-1997 p.207}"
