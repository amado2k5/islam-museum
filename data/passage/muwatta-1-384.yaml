  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، في باب الجمع بين الصلاتين في الحضر والسفر: كان النبي إذا عجل به السير يجمع بين المغرب والعشاء. ويخرّجه المحقق عند مسلم (2/150) والنسائي (1/289) وأحمد والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (14/141). {cite:muwatta-maruf-1997 p.207}"
