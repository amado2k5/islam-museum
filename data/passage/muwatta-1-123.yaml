text: "لقد ابتليت بالاحتلام منذ وليت أمر الناس"
summary:
  ar: "أثر يرويه مالك عن إسماعيل بن أبي حكيم عن سليمان بن يسار، في باب إعادة الجنب الصلاة: غدا عمر بن الخطاب إلى أرضه بالجرف فرأى في ثوبه احتلاماً، فقال إنه ابتُلي بالاحتلام منذ ولي أمر الناس، فاغتسل وغسل ما رأى في ثوبه ثم صلى بعد طلوع الشمس. ويذكر المحقق أن رواية يحيى «فرأى» وفي نسخة «فوجد»، وأنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، ويحيل على مصنف عبد الرزاق والبيهقي. {cite:muwatta-maruf-1997 p.94}"
