text: "لقد ابتليت بالاحتلام منذ وليت أمر الناس"
summary:
  ar: "أثر يرويه مالك عن إسماعيل بن أبي حكيم عن سليمان بن يسار، في باب إعادة الجنب الصلاة: غدا عمر بن الخطاب إلى أرضه بالجرف فرأى في ثوبه احتلاماً، فقال إنه ابتُلي بالاحتلام منذ ولي أمر الناس، فاغتسل وغسل ما رأى في ثوبه ثم صلى بعد طلوع الشمس. ويذكر المحقق أن رواية يحيى «فرأى» وفي نسخة «فوجد»، وأنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، ويحيل على مصنف عبد الرزاق والبيهقي. {cite:muwatta-maruf-1997 p.94}"
  tr: "Malik'in İsmail ibn Abi Hakim'den, o da Süleyman ibn Yasar'dan rivayet ettiği, ritüel kirlilik halindeki bir kişinin namazı tekrar etmesiyle ilgili bölümde yer alan bir rivayete göre: Ömer ibn el-Hattab, el-Curuf'taki topraklarına gitti ve elbisesinde ıslak bir rüya gördü. Halkın liderliğini üstlendiğinden beri ıslak rüyalar gördüğünü söyledi. Bunun üzerine gusül abdesti aldı ve elbisesinde gördüğü şeyi yıkadı, sonra güneş doğduktan sonra namaz kıldı. Editör, Yahya'nın rivayetinde \"gördü\", başka bir rivayette ise \"buldu\" yazdığını ve bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtiyor. Abd el-Razzaq ve el-Bayhaqi'nin Musannaf'ına atıfta bulunuyor. {cite:muwatta-maruf-1997 s.94}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Isma'il ibn Abi Hakim atas otoritas Sulayman ibn Yasar, dalam bab tentang seseorang yang dalam keadaan najis mengulang salat: Umar ibn al-Khattab pergi ke tanahnya di al-Juruf dan melihat mimpi basah di pakaiannya. Dia berkata bahwa dia telah mengalami mimpi basah sejak dia memimpin rakyat. Maka dia melakukan ghusl (mandi ritual) dan membersihkan apa yang dilihatnya di pakaiannya, kemudian salat setelah matahari terbit. Editor menyebutkan bahwa versi Yahya berbunyi \"dia melihat,\" sedangkan versi lain berbunyi \"dia menemukan,\" dan bahwa itu dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan. Dia merujuk pada Musannaf Abd al-Razzaq dan al-Bayhaqi. {cite:muwatta-maruf-1997 p.94}"
