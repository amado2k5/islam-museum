  tr: "Al-Isti`ab fi Ma`rifat al-Ashab, Cilt 2, sayfa 336'dan, merhum için ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Al-Isti`ab fi Ma`rifat al-Ashab, Volume 2, halaman 336, berisi elegi dan pujian untuk almarhum; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
