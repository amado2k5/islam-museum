text: "… ولم غسله. ودفع رسول اللّٰه والفي مفتاح الكعبة إِلى عثمان بن طلحة بن أبي طلحة، وإلى ابن عمه شيبة بن وذكر أَبو عبيد أن شمّاسًا هذا قتل يوم بدر نغلط، وقال في ذلك حسّان بن ثابت يرثيه، ويعزي عثمان بن …"
summary:
  ar: "مقطع من الاستيعاب في معرفة الأصحاب، المجلد المصوَّر 2، ص 336، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Istiab fi Ma'rifat al-Ashab, scan volume 2, p. 336, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الاستیعاب فی معرفۃ الاصحاب، اسکین جلد 2، ص 336 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
