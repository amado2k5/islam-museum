text: "وإذا طلقتم النساء الآية روى البخاري وأبو داود والترمذي وغيرهم عن معقل بن يسار أنه زوج أخته رجلا من المسلمين فكانت عنده ثم طلقها تطليقة ولم يراجعها حتى انقضت العدة فهويها وهويته فخطبها مع الخطاب فقال له يا لكع أكرمتك بها وزوجتكها فطلقتها والله لا"
