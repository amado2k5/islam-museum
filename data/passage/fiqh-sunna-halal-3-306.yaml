text: "… لعمر : مُرْهُ فليراجعها.. متفق عليه. أما استثناء الحالات الثلاث من الطلاق الرجعي فثابت بالقرآن الكريم كما هو مبين فيما يلي : فالطلاق المكمل للثلاث يبين المرأة ويحرّمها على الزوج، لا يحل له مراجعتها حتى تنكح زوجًا آخر، نكاحًا لا …"
