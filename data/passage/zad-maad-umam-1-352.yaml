text: "… اللَّه مَن بالمدينة مِن اليهود، وكتب بينه وبينهم كتاباً، وبادر حَبْرَهم وعالمُهم عبدُ اللَّهِ بنُ سلام، فدخل في الإسلام البخاري:، وأبى عامَّتُهم إلَّا الكفرَ. وكانوا ثلاثَ قبائل: بنو قَيْنُقَاع، وبنو النَّضير، وبنو قُرَيْظَة، وحاربه الثلاثة، فمنَّ على بني قَيْنُقَاع، وأجلى …"
