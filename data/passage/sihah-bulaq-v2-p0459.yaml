text: |-
  قواء واليارق يعنى كهاجر كما قاله
  اجد
  ٢٢٨
  ⁦(أكان )⁩
  صل اليساء) رق البرقان مثل الارقات وهوآ فة تصيب الزرع وداه يصيب
  النّاس يقال زرع مأروق وميروق واليارق الجبارة وهوالدستبئد العريض معرّب
  قق لكسائىّ يقال أبيض يقق أى شديد البياض ناصعه وحكى يعقوب أبيض يقق
  أيضابكسر القاف الاولى ق) اليلق الابيض من كل شئ ومنه قول الشاعر
  وأترك القرن فى الغباروفى * حضنيه زرقاء متنهايلق
  والبلقة العسنز البيضاء ( يلق الياق القسباء فارسىّ معرّب قال ذوالرمّة يصف الدور
  الوحنى
  تجلوالبوارق عن مجر غزلهق * كانه متقبى يلق عزب
  والجمع البلامق
  (باب الكاف⅜ ⅜nœn
  صل الااف رك الاراشجر من الححض الواحدة أراكة وأركت الابل
  تارك وتأرك أروكا اذا رعت الاراك قال الاصعىّ أركت الابل بمكان كذا اذ الزمته فلم تبرح
  حكاه عنه ابن السكيت قال وقال غيره انما يقال أركت اذا أقامت فى الارال وهو المذنر
  فهى اركة قال كثير وان الذى ينوى من المال أهلها * أوارل لماتأتلف وعوادى
  يقول انّ أهسل عزة ينون أن لا يجتمع هو وهى ويكونان كالا وارلك مر الابل والعوادى فى ترك
  الاجتماع فى مكان وأرك الرجل بالمكان أى أقام به وأرك الجرح أروكاسكن ورمه وتائل
  ويقال ظهرت أريكة الجرح اذا ذهبت غنيفته وظهر له صحيدا أحرولم يعلد الجلد وليس بعد
  ذلك الاعلو الجلد والجفوف وأركت الابل بالكسر تأرك أركاأى اشتكت بطونها ءن أكل
  الاراك فهى أركة وأرا كى مثسل طلهة وطلاحى ورمشة ورمائى والاريكة سرير ضجد مزين
  فى قبة أويدت فاذ الم يكن فيه سريرفهو حجلة والمع الارائك والاريك اسم وادوأرك بالضم
  مكان سلك الاسكتان بكسر الهمزة جانبا الفرج وه_ماقدتاه والمأسوكة التى أخطأت
  خافضتها فأصايت غيرموضع الخفض ⁦( فك)⁩ الافك الكذب وكذلك الافيكة والجمع
  الافائك ورجل أفال أى كذاب والافك بالمفتح مصدرقولك أفكه يأفكه أفكا أى قلبه
  وضرفه عن الشئ ومنه قوله تعالى قالوا أجئتنا التأفكنا قال عروة بن أذينة
  ان تك عن أحسن الصنيعة مأفوكافق آخرين قد أفكوا
  يقول ان لم توفق للاحسان فأنت فى قوم قد صرفوا عن ذلك أيضاواتتفكت البلدة بأهلها
  اى انقلبت والمؤتفكات المدن التى قلبها اللّه تعالى على قوم لوط عليه السلام والمؤتفسكات
  الرباح تختلف مهايماتقول العرب اذا كثرت المؤتفكات زكت الارض قال أبوزيد
  المأخوك المأفون وهو الضعيف العقل والرأى وقول تعالى يؤفك عنه من أفك حال مجاهد يوفن
  عنه من أفن وأرض مأفوكة أى لم يصبها مطر وايس بهمائبات ورجل مأفوك لايصيب خيراعب
  أبى عبيد (اكل قال الاصمعى الاكة شدة الحر مثل الاجة الا أن الاكة الحر المحتدم الذى
  لاريح فيه والاجة التوهج وقداتتك يومنا وهوافتعل منه فهويوم أل وأكيك قال الراجز
  اد
