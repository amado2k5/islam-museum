text: "… السلفُ علىٰ كراهته. ونقل النحاسُ عن بعضهم : أنه استحبَّ تقييدَه بالإضافة إلىٰ شىء آَخَر، مثل أن يكتب أطالَ اللُّهُ بقاءَك فى طاعته وكَرَامته أو أطال اللّٰه بقاءَك فى أَسَرّ عَيْش وأنعم بال وما أشبه ذلك. وآعلم أنَّ الناس قد …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 7، ص 337، يرد فيه ذكر المستحب، والطاعة، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 7, p. 337, whose wording mentions the recommended (mustahabb), obedience, dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 7، ص 337 کا اقتباس جس میں مستحب، اطاعت، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subh al-A'sha de al-Qalqashandi, volume numérisé 7, p. 337, dont le texte mentionne le recommandé (mustahabb), l'obéissance, la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen digitalizado 7, p. 337, cuyo texto menciona lo recomendado (mustahabb), la obediencia, la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kalkaşandi'nin Subh el-A'şa adlı eserinin resimli 7. cildinin 337. sayfasından, farz olan ameller, itaat amelleri ve mekruh olan amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, itaat amelleri, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Subh al-A'sha karya al-Qalqashandi, jilid bergambar 7, halaman 337, yang menyebutkan amalan yang dianjurkan, amalan ketaatan, dan amalan yang tidak disukai; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
