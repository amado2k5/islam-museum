summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن عن عائشة أنها قالت: ما طال عليّ وما نسيت، القطع في ربع دينار فصاعدا. ويذكر المحقق أن الحديث مسند في الصحيحين من رواية الزهري. {cite:muwatta-maruf-1997 p.395}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Amrah bint Abdülrahman'dan, o da Aişe'den rivayetle şöyle buyurmuştur: \"Uzun zaman olmadı, unutmadım ki, hırsızlığın cezası çeyrek dinar veya daha fazlasıdır.\" Araştırmacı, bu hadisin iki Sahih'te (Buhari ve Müslim) Zühri'nin rivayetiyle bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.395}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari 'Amrah bint 'Abd al-Rahman, dari 'Aisyah, yang berkata: \"Belum lama ini, dan aku pun belum lupa, hukuman untuk pencurian adalah seperempat dinar atau lebih.\" Peneliti menyebutkan bahwa hadits ini terdapat dalam dua kitab Sahih (Bukhari dan Muslim) melalui riwayat al-Zuhri. {cite:muwatta-maruf-1997 p.395}"
