text: "… دام مشتبهاً عليهم،. حتى يتبين باجتهاد أو تقليد، وعند ذلك يرتفع تشابهه فيصير كسائر المبينات. فإن قيل: قد أثبت القرآن متشابهاً في القرآن، وبينت السنة أن في الشريعة متشابهات، بقوله: الحلالُ بَينٌ. والحرام بَينٌ. وبينهما أمورٌ مُشتبهات وهذه المشتبهات متقّاة …"
