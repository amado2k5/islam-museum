text: |-
  ١٢٣٩
  فى كلام قيس سام أبرس والجمع صدائد على غيرقياس والصداد أيضا الطريق الى الماء وضداء
  اسم ركية عذية الماء وفى المثل ماء ولا كصدّاه وقلت لابى على النحوى هو فعلا من المضاعف
  فقال نم وأنشد نى لضرار بن عتية العيشمى السعدى
  كأنى من وجد بزينب هائم * يخالس من أحواض صدا مشربا
  يرى دون برد الماهولا وذادة * اذاشدصاحوا قبل أن يتحبيا
  وبعضهم يول صدآه بالهسمز -ثال صدعا وسألت عنه فى البادية رحلامن بنى سليم فلم يهمزه
  وصديد الجرح ماؤه الرقيق المختلط بالدم قبل أن تغلظ المدة نقول أصدّ الجرح اذاصارفيه
  المدة والسد الجبل قال أبوع روويقال اكل جبل صدوصد وسدودد وأنشدلللى
  الاخطية
  أنابغ لم تنبخ ولم تك أوّلا وكنت صنيا بين صدّين مجهلا
  (صرد الصرد البحت الخالص يقال أحبه حباصرد اونيذسر د وكذب صرد والصرد
  البردقارىّ مع رب تقول يوم صرد والصرود من البلاد خلاف الجروم وصرد الرحل
  بالكسر يصرد صر دافهو صردومصراديجد البردسر بعا قال الساجع
  أصبح قلبى صردا * لايشتهى أن يردا وصرد قلى عن الشئ انتهى عنه وصردالسهم أيضا
  من الرمية آى تقدحده واصرده الرامى وسه-م مصراد وصارداى نافدوبنوا اصارد بن مرّة
  قوم من العسرب والصردان عرقان بستبطنان اللان قال يزيد بن الصعق يهجوالنابغة
  الذسانى
  . وأى الناس أغدر من شام • له صردان منطلق اللسان
  أى ذربان والصرد طائر والجمع الصردان والصرد أيضا بياض يكون على ظهر الفرس من أثر
  الدبروالصرتادبااضم والتشديد غيم رقيق لاماء فيه والتصريد فى السقى دون ائرى والتصريد.
  فى العطاءتقليله وشراب مصرد أى مقلل وكذلك الذى يسق قدلا أ ويعطى قليلا والصحرد
  بالكسر النسافة القليلة اللبن وأرى أن الميم زائدة .⁦( رخد)⁩ الصر خدموضع نسب
  الله الشراب فى قول الشاعر
  ولذ كطهم الصرخدى طرحته • عشية خمس القوم والعين عاشقه
  واللذ النوم ⁦(صعد)⁩ صعد فى السلم صعوداوصعد فى الجبل وعلى الجبل تصعيدا
  قال أبوزيدولم يعرفوافيه صعد وقال الاخفس أصعد فى الارض أى مضى وساروأصعد
  فى الوادى وصعد تصعيدا أى انخدرفيه وأنشد (لعبداللّه بن همام الاولى
  فامازين اليوم مزبى ظعيقى • أصعد طورا فى البلاد وأفرع
  وقال الشماخ فان كرهت هجائى فاجتنب مخطى • لا يدهمنك افراعى وتصعيذى
  وتصعدنى الشى أى شق على وع_ذاب صعد بالتحريك أى شديدوالصعود خلاف الهبوط
  والمع صعائدومعد مث-ل عجوزوعجانزرعج زو معائد بالضم اسم موضع وهو فى شعرلبيد
  والصعود العقبة الكؤود وا اصعود من النوق التى تخدج فتعطف على ولدعام أوّل قال
  الشاعر
  لها لبن انخلية والصعود تقول منه أصعدت النساقة وأصعدتها أنا كاتاهما
  بالالف عن الفرّاء والصعيد التراب وقال ثعلب وحسه الارضاة وله تعالى فتصبح صعبدا
  زاا والجمع صعد وصعدات مثل طريق وطرق وطرقات ويقسال أيضاهذا النبات ينمى صعد
