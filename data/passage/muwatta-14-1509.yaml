label: { ar: "الموطأ 1509 — سعيد بن المسيب: إذا دخل الرجل بالمرأة في بيتها صدق عليها، وإذا دخلت عليه في بيته صدقت عليه", en: "Muwatta 1509", es: "Muwatta 1509", fr: "Muwatta 1509", ur: "موطا 1509", tr: "El-Muvatta 1509 — Sa’id ibn al-Musayyab: Bir erkek bir kadının evine girerse, kadına inanılır; kadın da erkeğin evine girerse, ona inanılır.", id: "Al-Muwatta 1509 — Sa’id ibn al-Musayyab: Jika seorang pria memasuki rumah seorang wanita, maka wanita itu dipercaya, dan jika wanita itu memasuki rumah pria, maka wanita itu juga dipercaya." }
summary:
  ar: "يروي مالك أنه بلغه أن سعيد بن المسيب كان يقول إذا دخل الرجل بالمرأة في بيتها صدق عليها، وإذا دخلت عليه في بيته صدقت عليه. {cite:muwatta-maruf-1997 p.34}"
  tr: "Malik, Sa'id ibn al-Musayyab'ın şöyle dediğini duyduğunu aktarır: \"Bir erkek bir kadının evine girerse, onun hakkında doğruyu söylüyor demektir; bir kadın da onun evine girerse, onun hakkında doğruyu söylüyor demektir.\" {cite:muwatta-maruf-1997 s.34}"
  id: "Malik meriwayatkan bahwa ia mendengar Sa'id ibn al-Musayyab biasa berkata, \"Jika seorang pria memasuki rumah seorang wanita, dia mengatakan yang sebenarnya tentang wanita itu, dan jika wanita itu memasuki rumah pria itu, dia mengatakan yang sebenarnya tentang pria itu.\" {cite:muwatta-maruf-1997 p.34}"
