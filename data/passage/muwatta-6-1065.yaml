label: { ar: "الموطأ 1065 — هشام بن عروة عن أبيه: كان إذا طاف بالبيت يستلم الأركان كلها، لا يدع اليماني إلا أن يغلب عليه", en: "Muwatta 1065", es: "Muwatta 1065", fr: "Muwatta 1065", ur: "موطا 1065", tr: "El-Muvatta 1065 — Hişam ibn Urve, babasından rivayetle: Kâbe'nin tavafında bütün köşelerine dokunur, Yemen köşesini ise ancak çok belirginse terk ederdi.", id: "Al-Muwatta 1065 — Hisham ibn Urwah, berdasarkan keterangan ayahnya: Ketika beliau melakukan tawaf mengelilingi Ka'bah, beliau menyentuh semua sudutnya, tidak meninggalkan sudut Yaman kecuali jika sudut tersebut terlalu menonjol baginya." }
text: "يستلم الأركان كلها، لا يدع اليماني إلا أن يغلب عليه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان إذا طاف بالبيت يستلم الأركان كلها، لا يدع اليماني إلا أن يغلب عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1288) وسويد (551)، وأن عبد الرزاق رواه عن معمر عن هشام. {cite:muwatta-maruf-1997 p.492}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından rivayet ederek, Kâbe'nin tavafını yaparken, Yemen köşesi hariç tüm köşelerine dokunduğunu, Yemen köşesine ise ancak kendisine en çok dokunan köşe olduğunda dokunduğunu naklettiğini belirtmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1288) ve Suveyd (551) tarafından nakledildiğini ve Abdül-Razzak'ın da Ma'mar'dan, o da Hişam'dan rivayet ederek naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.492}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, yang juga dari ayahnya, bahwa ketika ia melakukan tawaf di Ka'bah, ia menyentuh semua sudutnya, tidak meninggalkan sudut Yaman kecuali sudut yang paling dominan baginya. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1288) dan Suwaid (551), dan bahwa Abd al-Razzaq meriwayatkannya dari Ma'mar, yang juga dari Hisham. {cite:muwatta-maruf-1997 p.492}"
