text: "… فعل والقراآت التي تواترت عندنا عن عثمان وعنه وعن ابن مسعود وابي وغيرهم من الصحابةم لم يكن بينهم فيها الا الخلاف اليسير المحفوظ بين القراء ثم ان الصحابةم $ لما كتبوا تلك المصاحف جردوها من النقط والشكل ليحتمله ما لم …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 42، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 42, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 42 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Nashr fi al-Qira'at al-'Ashr de Ibn al-Jazari, volumen 1, pág. 42, que menciona las lecturas del Corán, los lectores, la colección del Corán y los códices, y las marcas de puntos y vocales del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du livre d'Ibn al-Jazari, al-Nashr fi al-Qira'at al-'Ashr (tome 1, p. 42), qui mentionne les lectures du Coran, les lecteurs, la compilation du Coran et les codex, ainsi que la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le navigateur du musée consacré à la lecture et à l'écriture du Coran."
