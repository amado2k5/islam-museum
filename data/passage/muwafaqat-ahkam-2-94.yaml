text: "… البيت الواحد كما في المنهاج. أي قد يكون مخيراً بالجزء كالصناعات المختلفة التي لها أثرها في إقامة العمران وقد يكون مندوباً بالجزء كالعدل والإحسان وسائر النوافل والنكاح وغيرها مما تقدم في المندوب بالجزء ولكن هذا الثاني إنما يكون واجباً كفاية …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 2، ص 94، يرد فيه ذكر فرض الكفاية، والواجب، والمندوب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 2, p. 94, whose wording mentions the communal obligation (fard kifaya), the obligatory (wajib), the recommended (mandub), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 2، ص 94 کا اقتباس جس میں فرضِ کفایہ، واجب، مندوب، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muwafaqat de al-Shatibi, volume numérisé 2, p. 94, dont le texte mentionne l'obligation collective (fard kifaya), l'obligatoire (wajib), le recommandé (mandub), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muwafaqat de al-Shatibi, volumen digitalizado 2, p. 94, cuyo texto menciona la obligación colectiva (fard kifaya), lo obligatorio (wajib), lo recomendado (mandub), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şatibi'nin El-Muvafakat adlı eserinin 2. cildinin 94. sayfasından, toplumsal yükümlülükler, görevler, tavsiye edilen ameller ve nafile amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Zorunlu ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram amelleri ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 2, halaman 94, yang menyebutkan kewajiban-kewajiban komunal, tugas-tugas, amalan yang dianjurkan, dan amalan sunnah; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, tugas-tugas, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
