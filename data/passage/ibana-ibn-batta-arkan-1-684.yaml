text: "… اللّٰه يكون أبين من هذا وأي دليل على أن الإيمان قول وعمل وأن الصلاة والزكاة من الإيمان يكون أدل من كتاب اللّٰه وسنّة رسول اللّٰه وليه وإجماع علماء المسلمين وفقهائهم الذين لا تستوحش القلوب من ذكرهم بل تطمئن إلى اتباعهم …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 684، يذكر ما عُدّ من الإيمان، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
