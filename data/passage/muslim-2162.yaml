text: "قال رسول الله: «حق المسلم على المسلم ست»؛ قيل: ما هن يا رسول الله؟ قال: «إذا لقيته فسلم عليه، وإذا دعاك فأجبه، وإذا استنصحك فانصح له، وإذا عطس فحمد الله فشمته، وإذا مرض فعده، وإذا مات فاتبعه»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ ستة حقوق للمسلم على أخيه: رد السلام وإجابة الدعوة والنصيحة وتشميت العاطس وعيادة المريض واتباع الجنازة — دستور الأخوة الاجتماعية."
