label: { ar: "مسلم 2162 — حق المسلم على المسلم ست", en: "Muslim 2162 — The Muslim's six rights over his brother", es: "Musulmán 2162 — Los seis derechos del musulmán sobre su hermano", fr: "Muslim 2162 — Les six droits du musulman sur son frère", ur: "مسلم 2162 - مسلمان کے اپنے بھائی پر چھ حقوق", tr: "Müslim 2162 — Bir Müslümanın diğer bir Müslüman üzerindeki hakları altı tanedir.", id: "Muslim 2162 — Hak seorang Muslim atas Muslim lainnya ada enam" }
text: "قال رسول الله: «حق المسلم على المسلم ست»؛ قيل: ما هن يا رسول الله؟ قال: «إذا لقيته فسلم عليه، وإذا دعاك فأجبه، وإذا استنصحك فانصح له، وإذا عطس فحمد الله فشمته، وإذا مرض فعده، وإذا مات فاتبعه»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ ستة حقوق للمسلم على أخيه: رد السلام وإجابة الدعوة والنصيحة وتشميت العاطس وعيادة المريض واتباع الجنازة — دستور الأخوة الاجتماعية."
  tr: "Sahih Müslim'de yer alan Salihlik Kitabı'nda Ebu Hurayra'nın rivayetine göre, bir Müslümanın kardeşine karşı altı hakkı vardır: selamı iade etmek, daveti kabul etmek, nasihatte bulunmak, hapşırana \"Allah sana rahmet etsin\" demek, hastayı ziyaret etmek ve cenaze alayına katılmak - bunlar toplumsal kardeşliğin temelleridir."
  id: "Riwayat Abu Hurairah dalam Kitab Kebajikan dari Sahih Muslim: Enam hak seorang Muslim atas saudaranya: membalas salam, menerima undangan, memberi nasihat, mengucapkan “Semoga Allah merahmatimu” kepada orang yang bersin, menjenguk orang sakit, dan mengikuti prosesi pemakaman — konstitusi persaudaraan sosial."
