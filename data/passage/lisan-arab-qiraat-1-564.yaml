text: "… راجع الى التوحيد ويجوز أن يكون ضمير الجّل الصالح أى العملُ الصالحُ رقعه الكَلُمُ العَيْبُ أى لا يُقْبَلُ عمله الح الامن موحد ويجوز أن يكون اللٰهُ تعالى يرفعه وقوله عالى الطَّيّباتُ لالعَليِّينِ والطيبون للطيبات. قال القراه المَيِباتُ من الكلام الطيين …"
summary:
