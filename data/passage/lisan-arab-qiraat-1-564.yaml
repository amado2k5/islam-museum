  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 1, p. 564, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
