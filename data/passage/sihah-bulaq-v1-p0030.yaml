text: |-
  وفرّءت فى الجبل تفر يعبا أى انحدرت وفرّءت الجبل أيضاصعدت وهومن الاضداد
  وفروع الجوزاء أشدما يكون من الحرّقال أبو خراش
  وظل لنايوم كأن أواره • ذكا النار من تجم الفروع طويل.
  قرأنه على أبى سعيد بالعين غير ممجسمة وأفر عنا بفلان ف أحمدناه أى نزلنابه ورجل مفرع
  المكتف أى عر يضها وأفرع ينوفلان أى انتجعوا فى أول الناس ويقال بئس ما أفرعت به
  أى اسدأت وأفرعت الارض أى جوّات فيها ذعرفت خبرها والفرع بالتحريك أوّل
  ولد تنتجه الناقسة وكانوا يذبحونه لا لتهم يتبركون بذلك قال أوس بن حجريذكر
  أزمة فى سنة شديدة البرد (.
  وشبه الهيدب العبام من ا لا قوام سقبامج للافرعا
  أى جلد فرع
  وفى الحديث لافرع ولاعتبرة تقول منه أفرع القوم اذا ذحوه والفرع أيضا المال الطائل
  المعدّواسم موضع والفرعة القملة تسكن وتحرّك والجمع فرع وفرع وبتصغيرهاسميت فربعة
  والفرع أيضا مصدر الافرع وهو التام الشعر وقال ابن دريدامر أة فرعاء كثيرة التعرقال
  ولا يقال للرجل اذا كان = ظيم اللحية أوابهة أفرع وانمايقال رجل أفرع "ضدّ الاصاح وكان
  رسول اللّٰه صلى اللّٰه عليه وسلم أفرع وتفرّءت أغصان الشجر أى كثرت وتفرعت بنى فلان أى
  تزوجت سيدة نسائم-م وافترعت البكراذااقتضضتها ⁦(فرقع)⁩ الفرقعة تنقيض الاصابع
  وقد فرقعهافتفرقعت وفى كلام عيسى بن عمرافر تقعواعنى أى انسكشفوا وتنحوا ⁦(نزع)⁩
  الفزع الذع روهو فى الاصل مصدرور بعاجع على أفزاع تقول منه فزعت اليك وفزعت منك
  ولا تقل فزعتك والمفزع الملجأ وفلان مه زع للناس يستوى فيه الواحد والجمع والمؤنت أى اذا
  دهمه-م أمر فزءوا المه وهمامفزع للناس وهم مفزع لهم وهى مفزع لهم والمفزعة بالهاء
  ما يفزع منه والفزع أيضا الاغاثة قال رسول اللّٰه صلى اللّٰه عليه وسلم للانصارانكم لتكثرون
  عند الفزع وتقلون عند الطمع والافزاع الاخافة والاغاثة أيضا يقال فزءت ال ه فأفزعنى
  أى لمأت اليه من الفزع فأغائى وكذلك الته زيع من الاضداد يقال فزعه أى أخافه
  وفزع عنه أى كشف عنه الخوف ومنه قوله تعالى حتى اذافزع عن قلوبهم أى كشف عنها
  الفزع ( فصع فصع الرطبة عصرها التنقشر وف الحديث أنه نهى عن فصح الرطبة وفصع
  الغسلام وافتصع اذا كشر قلدته وغلام أجلع أفصع بادى القلفة. ن كرته وفصعته من كذا
  نفصيها أى أخر جته فأنفصع وافتصوت - فى من فلان أى أخذته كاه على المكان ولا تلتفت
  الى القاف طع نظع الامر بالضم فظاعة نهو فظيع أى شديد شنيع جاوز المقدار
  وكذلكْ أنظع الامرفه ومفظع وأفظع الرجل على ما لم يسم فاعله أى نزل به أمر عظيم ومنه
  قول لبيد وهم السعاة اذا العشيرة اقطعت * وهم فوارسها وهم حكامها .
  وأفظعت الشى واستفظعته أى وجدته فظيعا مع) ذمقع الراعى إذا زجر الغيم وقال
  فع فع وهو -كاية زجره وراح فعفاع كقولك جرجر البعيرف، وجرجاروثرثر فهوثر تاروفعفعى
  أيضا وضفعانى اذا كان خفيفا فى ذلك ⁦(فقع)⁩ الفقوع مصدرولك أصفرفاقع أى شديد
  الصفرة وقد فقع لونه يفقع ويفقع ذوعا وبرة صفراء فاقع لونها أى لونها فاقع والفاقعة
  قوله فعفعانى تظيره شعشعائي
  وله نظائر أخرى قاله نصبر
