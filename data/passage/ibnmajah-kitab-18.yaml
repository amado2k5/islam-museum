summary:
  ar: "القسم 18 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب اللقطة»، ويضم فيها النصوص من 2502 إلى 2511 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 18 of Sunan Ibn Majah (The Chapters on Lost Property) in the division of the open hadith dataset the museum took its reports from: reports 2502 to 2511 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 18، عنوان «کتاب اللقطۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2502 تا 2511۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 18 de Sunan Ibn Majah (Los capítulos sobre objetos perdidos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2502 al 2511, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
