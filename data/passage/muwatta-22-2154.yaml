label: { ar: "الموطأ 2154 — مالك عن يحيى بن سعيد عن سعيد بن المسيب: وجد رجل من أهل الشام يقال له ابن خيبري مع امرأته رجلا فقتله، فأشكل القضاء على معاوية، فكتب إلى أبي موسى، فسأل علي بن أبي طالب، فقال: إن لم يأت بأربعة شهداء فليعط برمته", en: "Muwatta 2154" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن رجلا من أهل الشام، يقال له ابن خيبري، وجد مع امرأته رجلا فقتله، أو قتلها، فأشكل على معاوية بن أبي سفيان القضاء فيه، فكتب إلى أبي موسى الأشعري يسأل له علي بن أبي طالب عن ذلك. فسأل أبو موسى عليا، فقال: أنا أبو حسن: إن لم يأت بأربعة شهداء فليعط برمته. {cite:muwatta-maruf-1997 p.281} {cite:muwatta-maruf-1997 p.282}"
