label: { ar: "الموطأ 2154 — مالك عن يحيى بن سعيد عن سعيد بن المسيب: وجد رجل من أهل الشام يقال له ابن خيبري مع امرأته رجلا فقتله، فأشكل القضاء على معاوية، فكتب إلى أبي موسى، فسأل علي بن أبي طالب، فقال: إن لم يأت بأربعة شهداء فليعط برمته", en: "Muwatta 2154", es: "Muwatta 2154", fr: "Muwatta 2154", ur: "موطا 2154", tr: "El-Muvatta 2154 — Malik, Yahya ibn Sa’id’den, o da Sa’id ibn al-Musayyab’dan rivayetle: Suriye halkından İbn Hayberi adında bir adam, bir adamı karısıyla birlikte bulup öldürdü. Mu’aviye, hüküm konusunda şaşkına döndü ve Ebu Musa’ya yazdı. Ebu Musa da Ali ibn Abi Talib’e sordu. Ali ibn Abi Talib şöyle dedi: Eğer dört şahit getirmezse, kanının tamamının bedeli ödenmelidir.", id: "Al-Muwatta 2154 — Malik, berdasarkan riwayat Yahya ibn Sa’id, berdasarkan riwayat Sa’id ibn al-Musayyab: Seorang pria dari penduduk Suriah, bernama Ibn Khaybari, menemukan seorang pria bersama istrinya dan membunuhnya. Mu’awiyah bingung tentang hukumnya, lalu ia menulis surat kepada Abu Musa, yang kemudian bertanya kepada Ali ibn Abi Talib, yang berkata: Jika ia tidak membawa empat saksi, maka ia harus diberikan uang ganti rugi darahnya secara penuh." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن رجلا من أهل الشام، يقال له ابن خيبري، وجد مع امرأته رجلا فقتله، أو قتلها، فأشكل على معاوية بن أبي سفيان القضاء فيه، فكتب إلى أبي موسى الأشعري يسأل له علي بن أبي طالب عن ذلك. فسأل أبو موسى عليا، فقال: أنا أبو حسن: إن لم يأت بأربعة شهداء فليعط برمته. {cite:muwatta-maruf-1997 p.281} {cite:muwatta-maruf-1997 p.282}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle, Suriye halkından İbn Hayberi adında bir adamın, bir adamı karısıyla birlikte bulup onu öldürdüğünü veya karısını öldürdüğünü anlatır. Mu'aviye ibn Abi Sufyan bu konuda nasıl hüküm vereceği konusunda şaşkına dönmüş, bu yüzden Ebu Musa el-Eş'ari'ye yazarak Ali ibn Abi Talib'e sormuştur. Ebu Musa, Ali'ye sormuş, Ali de şöyle demiştir: \"Ben Ebu Hasan'ım: Eğer dört şahit getirmezse, ona tam olarak hak ettiği ceza verilmelidir.\" {cite:muwatta-maruf-1997 s.281} {cite:muwatta-maruf-1997 s.282}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa seorang pria dari penduduk Suriah, bernama Ibn Khaybari, menemukan seorang pria bersama istrinya dan membunuhnya, atau membunuh istrinya. Mu'awiyah ibn Abi Sufyan bingung tentang bagaimana memutuskan masalah ini, jadi dia menulis surat kepada Abu Musa al-Ash'ari menanyakan hal itu kepada Ali ibn Abi Talib. Abu Musa bertanya kepada Ali, yang berkata: \"Saya Abu Hasan: Jika dia tidak membawa empat saksi, maka dia harus diberi haknya sepenuhnya.\" {cite:muwatta-maruf-1997 p.281} {cite:muwatta-maruf-1997 p.282}"
