label: { ar: "الموطأ 834 — مالك: وبلغني عن سليمان بن يسار مثل ذلك", en: "Muwatta 834", es: "Muwatta 834", fr: "Muwatta 834", ur: "موطا 834", tr: "El-Muvatta 834 — Malik: Ben de Süleyman ibn Yasar'dan benzer bir şey duydum.", id: "Al-Muwatta 834 — Malik: Dan aku mendengar hal serupa dari Sulayman bin Yasar" }
summary:
  ar: "قول لمالك: وبلغني عن سليمان بن يسار مثل ذلك، أي مثل قول سعيد بن المسيب في تقديم النذر على التطوع. ويذكر المحقق أنه رواه عن مالك سويد بن سعيد (472). {cite:muwatta-maruf-1997 p.407}"
  tr: "Malik şöyle dedi: “Süleyman ibn Yasar’dan da benzer bir şey duydum,” yani Sa’id ibn al-Musayyab’ın ibadetlerin gönüllü ibadetlerden önceliği hakkındaki sözlerine benzer bir şey. Editör, bunun Suwayd ibn Sa’id (472) tarafından Malik’ten rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.407}"
  id: "Malik berkata: “Aku mendengar sesuatu yang serupa dari Sulayman ibn Yasar,” yang berarti sesuatu yang serupa dengan apa yang dikatakan Sa'id ibn al-Musayyab mengenai keutamaan nazar atas ibadah sunnah. Editor menyebutkan bahwa hal itu diriwayatkan dari Malik oleh Suwayd ibn Sa'id (472). {cite:muwatta-maruf-1997 p.407}"
