text: "… وسط بين الوعيدية والمرجئة ما يخرج به المسلم من الإيمان..... مذاهب الفِرَقِ في مسمى الإيمان.... وجوب الإيمان والعمل بكل ما صح عن النبي وَلِلة زيادة الإيمان ونقصانه ولاية اللّٰه وبم تكون؟ الإيمان بالأصول الخمسة، وتفصيل الإيمان باليوم الآخر الإيمان بالقدر …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 477، يذكر الإيمان بالقدر، وما عُدّ من الإيمان، وركن من أركان الإيمان، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 477, that mentions belief in the decree, what is counted as part of faith, one of the articles of faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 477 کا اقتباس جس میں تقدیر پر ایمان، جو ایمان میں سے گنا گیا، ایمان کا ایک رکن، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 1, pág. 477, que menciona la creencia en el decreto, lo que se considera parte de la fe, uno de los artículos de fe, el aumento y la disminución de la fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 1, p. 477) mentionnant la croyance au décret, ce qui est considéré comme faisant partie de la foi, un des articles de foi, et la croissance et la diminution de la foi. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi üzerine tefsirinin 1. cildinin 477. sayfasından bir alıntı, kader inancını, imanın ne olduğunu, imanın rükünlerini ve imanın artış ve azalışını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-`Izz tentang Akidah al-Tahawi, Jilid 1, halaman 477, membahas keyakinan akan takdir, apa yang membentuk iman, rukun iman, serta peningkatan dan penurunan iman. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
