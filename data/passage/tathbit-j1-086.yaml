label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٣٠، المقطع ٥ من ٥", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 30, section 5 of 5", ur: "تثبیت دلائل نبوت — حصہ اول، باب 30، حصہ 5" }
text: "الله وإلى بيتها، وأعطاها ما كان يعطيها من قبله من الخلفاء. ولا يحل لامرأة زعم هؤلاء أنها كافرة يردها أمير المؤمنين إلى قبر رسول الله [وتعطى] ما يعطى أمهات المؤمنين، سيما والمدينة في ملكه وسلطانه وفيها عماله، وليس …"
summary:
  ar: "مقطع من الباب ٣٠ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 30 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 30 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
