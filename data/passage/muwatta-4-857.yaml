label: { ar: "الموطأ 857 — عائشة: كان يكون علي الصيام من رمضان فما أستطيع أصومه حتى يأتي شعبان", en: "Muwatta 857", es: "Muwatta 857", fr: "Muwatta 857", ur: "موطا 857", tr: "Al-Muwatta 857 — Aişe: Ramazan ayından kalma oruç günlerimi telafi etmem gerekirdi, fakat Şaban ayı gelene kadar oruç tutamazdım.", id: "Al-Muwatta 857 — Aisyah: Aku harus mengganti hari-hari puasa Ramadan, tetapi aku tidak dapat melaksanakannya hingga bulan Sya'ban tiba." }
text: "ما أستطيع أصومه حتى يأتي شعبان"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن أبي سلمة بن عبد الرحمن أنه سمع عائشة زوج النبي تقول: إن كان ليكون علي الصيام من رمضان فما أستطيع أصومه حتى يأتي شعبان. ويذكر المحقق أنه رواه عن مالك أبو مصعب (834) ومن طريقه البغوي وسويد والقعنبي عند أبي داود والجوهري. {cite:muwatta-maruf-1997 p.414}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Ebu Salama ibn Abd al-Rahman'dan rivayet ederek, Peygamberin eşi Aişe'nin şöyle dediğini işittiğini belirtmiştir: \"Ramazan'dan telafi etmem gereken oruç günlerim olurdu, ancak Şaban ayı gelene kadar oruç tutamazdım.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (834) tarafından, onun isnadından da el-Baghawi, Suwaid ve el-Qa'nabi tarafından, Ebu Davud ve el-Jawhari tarafından kaydedildiği şeklinde nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.414}"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id, yang juga dari Abu Salama bin Abd al-Rahman, yang mendengar Aisyah, istri Nabi, berkata: \"Aku harus mengganti puasa Ramadan beberapa hari, tetapi aku tidak dapat melaksanakannya hingga bulan Sya'ban tiba.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (834), dan dari sanadnya oleh al-Baghawi, Suwaid, dan al-Qa'nabi, sebagaimana dicatat oleh Abu Dawud dan al-Jawhari. {cite:muwatta-maruf-1997 p.414}"
