text: "ما أستطيع أصومه حتى يأتي شعبان"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن أبي سلمة بن عبد الرحمن أنه سمع عائشة زوج النبي تقول: إن كان ليكون علي الصيام من رمضان فما أستطيع أصومه حتى يأتي شعبان. ويذكر المحقق أنه رواه عن مالك أبو مصعب (834) ومن طريقه البغوي وسويد والقعنبي عند أبي داود والجوهري. {cite:muwatta-maruf-1997 p.414}"
