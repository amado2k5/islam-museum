text: "… فَقَالَ رَسُولُ اللهِ لْاِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهِ الاَ اللّهُ وَأنَّ مُحَدَا رَسُولُ اللهِ وتُقِيمَ اصَّلَاةَ وَتُوْنِى الرَّكَاةَ وَتَصُومَ رَمَضَانَ وَنَّحُجَّ لَبَيْتَ انِ اسْتَطَعْتَ آَلْهِ سَبِيلًا قَالَ صَدَقْتَ قَالَ فًجِبْنَا لَهُ يَسْألُهُ وَيُصَدّقُهُ قَالَ فَأَخْبِرْفِي عَنِ الْإيمَانِ قَالَ أَنْ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 2، ص 157، يذكر تعريف الإسلام بأعماله، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 2, p. 157, that mentions Islam defined by its acts, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 2، ص 157 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 2, pág. 157, que menciona el Islam definido por sus actos, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 2, p. 157) évoquant la définition de l'islam par ses actes, la question de la foi et sa réponse; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 2. cildinin 157. sayfasından bir alıntı, İslam'ın tanımını ve uygulamalarını ele almakta ve iman sorusunu ve cevabını tartışmaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu alıntı, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 2, halaman 157, membahas definisi Islam dan praktik-praktiknya, serta membahas pertanyaan tentang iman dan jawabannya. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
