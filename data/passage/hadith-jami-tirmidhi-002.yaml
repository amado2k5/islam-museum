text: "وقد نقله عن المحدثين مسلم في مقدمة ((صحيحه)) (٣)، والترمذي في كتاب ((العلل)) (٤) ، وقال ابن الصلاح: هو المذهب الذي استقر عليه حفاظ الحديث ونقاد الأثر(٥). ودليلهم في ذلك : أن المحذوف مجهول، لأنه إذا كانت الرواية عن المسمى"
