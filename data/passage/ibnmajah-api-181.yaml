label: { ar: "سنن ابن ماجه 181 — ضحك وتبسم", en: "Sunan Ibn Majah 181 — laughter and smiling", ur: "سنن ابن ماجہ 181 — ہنسی اور تبسم", fr: "Sunan Ibn Majah 181 — rire et sourire", es: "Sunan Ibn Majah 181 — risa y sonrisa", tr: "Sünen İbni Mace 181 — Kahkaha ve Gülümseme", id: "Sunan Ibnu Majah 181 — Tertawa dan Tersenyum" }
text: "… بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَنْبَأَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ ضَحِكَ رَبُّنَا مِنْ قُنُوطِ عِبَادِهِ وَقُرْبِ غِيَرِهِ . قَالَ قُلْتُ يَا رَسُولَ اللَّهِ أَوَ يَضْحَكُ الرَّبُّ قَالَ نَعَمْ . قُلْتُ لَنْ نَعْدِمَ مِنْ رَبٍّ يَضْحَكُ خَيْرًا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 181، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Ibn Majah, no. 181, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابن ماجہ کی حدیث نمبر 181، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Ibn Majah, n° 181, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Ibn Majah, n.º 181, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "İbn Majah'ın Sünen'inde yer alan 181 numaralı hadiste kahkaha ve gülümseme geçmektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 181, memuat tentang tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
