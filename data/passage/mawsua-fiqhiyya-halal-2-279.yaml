text: "تزين - وغير ذلك، إن لم يحصل بالعرض على النار شيء منه، فإن كثر المموه به بأن كان يحصل منه شيء بالعرض على النار حرم. ومحل الحل الاستدامة، أما الفعل فحرام مطلقا. وصرحوا بكراهة تزيين البيوت للرجال وغيرهم حتى مشاهد …"
