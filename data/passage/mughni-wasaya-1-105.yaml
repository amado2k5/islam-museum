text: "… مساكين، لكل مسكين نصف... أو أطعم فرقا بين ستة مساكين أو بعض ساعة أوتروا قبل أن تصبحوا أُوتيت جوامع الكلم... أو زنى بعد إحصان أوص بالثلث والثلث كثير أوص بالعشر أوصيت ؟ أو عدله معافر أوف بنذرك لعمر بن الخطاب …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 1، ص 105، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 1, p. 105, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 1، ص 105 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
