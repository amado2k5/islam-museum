label: { ar: "الموطأ 1243 — مالك: من أهل مكة يحرم بحج أو عمرة وفي بيته فراخ حمام مكة فتموت مغلقا عليها، يفدي عن كل فرخ بشاة", en: "Muwatta 1243", es: "Muwatta 1243", fr: "Muwatta 1243", ur: "موطا 1243", tr: "El-Muvatta 1243 — Malik: Mekke'den bir kimse Hac veya Umre için ihrama girer ve evinde kilitli haldeyken ölen güvercin yavruları varsa, her yavru için kefaret olarak bir koyun kurban etmelidir.", id: "Al-Muwatta 1243 — Malik: Jika seseorang dari Mekah memasuki keadaan ihram untuk haji atau umrah dan memiliki anak burung merpati di rumahnya yang mati saat dikurung, maka ia harus memberikan seekor domba sebagai penebusan untuk setiap anak burung merpati tersebut." }
summary:
  ar: "يقول مالك في الرجل من أهل مكة يحرم بالحج أو العمرة وفي بيته فراخ من حمام مكة فيغلق عليها فتموت، إنه يرى أن يفدي ذلك عن كل فرخ بشاة. {cite:muwatta-maruf-1997 p.554}"
  tr: "Malik, Hac veya Umre için ihrama giren ve evinde Mekke'den getirilmiş güvercin yavruları bulunan, bunları kilit altında tutan ve ölen bir adam hakkında şöyle der: Bu adam, her yavru için kefaret olarak bir koyun kurban etmesi gerektiğine inanır. {cite:muwatta-maruf-1997 s.554}"
  id: "Malik mengatakan mengenai seorang pria dari Mekah yang memasuki keadaan ihram untuk haji atau umrah dan memiliki anak burung merpati dari Mekah di rumahnya, yang dikurungnya dan mati, bahwa ia percaya orang tersebut harus mempersembahkan seekor domba sebagai penebusan untuk setiap anak burung merpati. {cite:muwatta-maruf-1997 p.554}"
