label: { ar: "صحيح البخاري 5559 — الأب والأبوة", en: "Sahih al-Bukhari 5559 — the father and fatherhood", ur: "صحیح بخاری 5559 — باپ اور والدیت", es: "Sahih al-Bukhari 5559 — El padre y la paternidad", fr: "Sahih al-Bukhari 5559 — Le père et la paternité", tr: "Sahih el-Buhari 5559 — Baba ve Babalık", id: "Sahih al-Bukhari 5559 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ دَخَلَ عَلَىَّ رَسُولُ اللَّهِ بِسَرِفَ وَأَنَا أَبْكِي، فَقَالَ \" مَا لَكِ أَنَفِسْتِ \". قُلْتُ نَعَمْ. قَالَ \" هَذَا أَمْرٌ كَتَبَهُ اللَّهُ عَلَى بَنَاتِ آدَمَ اقْضِي مَا يَقْضِي الْحَاجُّ غَيْرَ أَنْ لاَ تَطُوفِي بِالْبَيْتِ \". وَضَحَّى رَسُولُ اللَّهِ عَنْ نِسَائِهِ بِالْبَقَرِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5559، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5559 (Al-Adha Festival Sacrifice (Adaahi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5559، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5559 (El sacrificio de la festividad de Al-Adha (Adaahi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5559 (Le Sacrifice de la fête d'Al-Adha), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 5559 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5559, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
