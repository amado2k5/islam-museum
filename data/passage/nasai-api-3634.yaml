label: { ar: "سنن النسائي 3634 — ما خلّفه من تركة وميراث، وصية أو عهد أخير", en: "Sunan al-Nasa'i 3634 — what was left behind: estate and inheritance; a testament or parting counsel", ur: "سنن نسائی 3634 — ترکہ اور میراث، وصیت یا آخری نصیحت", es: "Sunan al-Nasa'i 3634 — lo que quedó: patrimonio y herencia; un testamento o consejo de despedida", fr: "Sunan al-Nasa'i 3634 — ce qui a été laissé derrière: biens et héritage; testament ou conseils d'adieu" }
text: "أَخْبَرَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ لَوْ غَضَّ النَّاسُ إِلَى الرُّبُعِ لأَنَّ رَسُولَ اللَّهِ قَالَ \" الثُّلُثَ وَالثُّلُثُ كَثِيرٌ أَوْ كَبِيرٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3634، يذكر ما خلّفه من تركة وميراث، ووصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3634 (The Book of Wills), that mentions what was left behind: estate and inheritance, a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 3634، جس میں ترکہ اور میراث، وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3634 (El Libro de los Testamentos), menciona lo que se dejó como legado: bienes y herencia, un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3634 (Le Livre des Testaments), mentionne ce qui a été laissé derrière soi: biens et héritage, testament ou dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des sépultures."
