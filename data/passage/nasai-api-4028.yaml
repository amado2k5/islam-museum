label: { ar: "سنن النسائي 4028 — ألبان الإبل وأبوالها", en: "Sunan al-Nasa'i 4028 — camel milk and urine as treatment", ur: "سنن نسائی 4028 — اونٹنی کا دودھ اور پیشاب", es: "Sunan al-Nasa'i 4028 — Leche y orina de camella como tratamiento", fr: "Sunan al-Nasa'i 4028 — le lait et l'urine de chamelle comme traitement", tr: "Sunan an-Nasa'i 4028 — Deve sütü ve idrarı", id: "Sunan an-Nasa'i 4028 — Susu dan air kencing unta" }
text: "… عَبْدُ اللَّهِ بْنُ عُمَرَ، وَغَيْرُهُ، عَنْ حُمَيْدٍ الطَّوِيلِ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ نَاسًا، مِنْ عُرَيْنَةَ قَدِمُوا عَلَى رَسُولِ اللَّهِ فَاجْتَوَوُا الْمَدِينَةَ فَبَعَثَهُمُ النَّبِيُّ إِلَى ذَوْدٍ لَهُ فَشَرِبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا فَلَمَّا صَحُّوا ارْتَدُّوا عَنِ الإِسْلاَمِ وَقَتَلُوا رَاعِيَ رَسُولِ اللَّهِ مُؤْمِنًا وَاسْتَاقُوا الإِبِلَ فَبَعَثَ رَسُولُ اللَّهِ فِي آثَارِهِمْ فَأُخِذُوا فَقَطَّعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ وَسَمَلَ أَعْيُنَهُمْ وَصَلَبَهُمْ."
summary:
  ar: "حديث في سنن النسائي، رقم 4028، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 4028 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 4028، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan al-Nasa'i, n.° 4028 (El Libro de la Lucha [La Prohibición del Derramamiento de Sangre]), menciona la leche y la orina de camella como tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4028 (Le Livre du Combat [L'Interdiction du Sang]), mentionne l'utilisation du lait et de l'urine de chamelle comme remèdes. Le Répertoire des Médecines le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan-ı Nesai'de yer alan 4028 numaralı hadiste deve sütü ve idrarından bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4028, menyebutkan susu unta dan air kencing. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
