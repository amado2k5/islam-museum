text: |-
  ٤1٦
  • ⁦(فصل الواد)⁩:،:
  •اركن).
  وأمك سوداءمودونة • كانَ أناملها الحفظب
  ومودون اسم فرس ⁦(وزن)⁩ الميزان معروف وأصله موزان انقلبت الواوياء لكسرة
  ما قبلها وقام ميزان النهار أى انتصف ووزنت الشئوزناوزنة ويقال وزنت فلانا ووزنت
  لفلان قال تعالى واذا كالوهم أووزنوهم يخسرون وهذايزن درهما ودرهم وازن أى تاتم
  وقال الشاعر مثل العصافير أحلاما ومقدرة • لويوزنون بزف الريش ماوزنوا
  ووازنت بين الشيتين موازنة ووزانا وهذايوازن هذا اذا كان على زنته أوكان محاذيه ويقال
  وزن المعطى واتزن الآخذ كما بقال نقد المعطى وانتسد الآخذوهو افتعل قلبوا الواوتاه
  وأدغموا والوزين الحنظل المطحون وفلان وزين الرأى أى رزينه وقواهم هو وزن الجبل
  أى ناحمة منه وهوزنة الجبل أى حذاءه قال سيبويه نصباعلى الظرف وتقول العرب حضار
  والوزن محلفان وهما نجمان يطاعان قبل مهيل وموزن بالفتح موضع وهوشاذمثل موحد
  وموهب قال كانهم قصرامصابيح راهب • بموزن روى بالسليط ذبالها
  ( وسن الوسن النعاس والسنة مثله وقدوسن الرجل يومن فهو وسنان واستوسن م:-له
  واوسن يأرجل ليلمتك والالف ألف وصل وتقول ماله همّ ولاوسن الاذاك ووسن الرجل أيضا
  فهووسن أى غشى عليه من تتزريح البثر مثل أسن وأوسفته البثروهى ركية موسنة عن أبى
  زيدوقواهم توسنها أى أتاها وهى نائمة بريدون بداتيان الفحل الناقة وامر أميسان بكسر
  الميم كان بهاسنة من رزانتها وميدان بالمتح موضع ⁦(وضن)⁩ الوضين لاهودج بمنزلة
  | البطان للقتب والتصدير للرحل والحزام للسرج وهما كالنسع الاأنهما من السيوراذانسج
  نساحة بعضه على بعض مضاعفا والمع وضن قال المثقب
  تقول اذادرأت لها وضينى • أهذادينه ابداودي
  فال ابو عبيدة وضيز فموضع موضون مثل قتيل فى-وضع مقتول تقول منه وضذت التسع
  أضنه وضذا اذا تسجته والموضونة أيضا الدرع المنسوجة توضن حلق الدرع بعضها فى بعض
  مضاعفة ويقال أيضامنسوجة بالجحواهر ومنسه قوله تعالى على سررموضونة ⁦( وطن )⁩
  الوطن مجل الانسان وقد خففه روبة بقوله
  أوطنت وطنالم يكن من وطف• لولم يكن عاملها لم أسكن • بها ولم أوجن بها فى الرجن
  وأوطان الغنم مرابضها وأوطنت الارض ووطنتها نوطينا واستوطنتها أى اتخذتها
  وطناوكذلك الاتطان وهوافتعال منسه وتوطين النفس على الشى كالتمهيسدويقال من أين
  ميطانك أى غايتك والميطان الموضع الذى يوطن لترسل منه الخيل فى السباق وهو أول
  الغاية والميتاء والميداه آخر الغاية والموطن المسهد من مشاهد الحرب قال تعالى لقد نسركم
  اللّٰه فى مواطِن كغيرة وقال طرقة
  على. ومن يخشى الفتى عنده الردى • من تعترك فيه الفوارس وعد
  ( وعن الوعنة الارض الصلبة قال أبوزيد نوعنت الناقة أى سمنت ناية السمن
  ( وكن الوكن بالفتح عس الطارفى جبل أوجدار والموكن مثله الاصمىّ الوكن مأوى
  الطائرفى غبرعش ولوكربالراهما كان فى عش أبو عر والوكنة والاكنة بااضم مواقع الطير
