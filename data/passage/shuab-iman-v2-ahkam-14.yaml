text: "… بن عكرمة، يقول: سمعت يحيى بن معاذ الرازي، يقول : الإيمانُ ثلاثة: الخوفُ والرجاءُ والمحبّةُ، وفي جوف الخوف ترك الذنوب، وفيه النجاة من النار، وفي جوف الرجاء الطاعة، وفيه وجوب الجنة ؛ وفي جوف المحبّة احتمال المكروهات، وبه تجد رضا …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 14، يرد فيه ذكر الوجوب، والمكروه، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 14, whose wording mentions obligation (wujub), the disliked (makruh), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
