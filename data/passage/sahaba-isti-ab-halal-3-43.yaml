text: "… الله لَلِيقه قال : أَرْحم أُمَّتي بأُمّتي أَبو بَكْر، وأَقواهم في دينِ اللّٰه عمرُ، وأصدقهم حياءً عثمانُ، وأَقْضَاهم عليُّ بنُ أَبِي طالِبٍ، وأَقْرَؤُهم أُبَيٌّ بنُ كعب، وَأَفْرَضُهم زيدُ ابنُ ثابت، وأَعلمهم بالحلال والحرام معاذ بنُ جَبَل، وما أظلّتِ الخَضْراءُ، ولا …"
