text: "فهذان الخبران يقتضيان كونه في الربع الشمالي الغربي من المعمورة وفي هذه القصة خاصة ما يزيل الثقة به عنها من صفة أهل تلك البلاد من التدين بالإسلام والتكلم بالعربية مع انقطاعهم عن العمران"
summary:
  ar: "يضع البيروني خبر الرحلة إلى السد في الشمال الغربي من المعمور، ويبين ما يضعف ثقته به، كوصف أهل تلك البلاد بالإسلام والعربية مع انقطاعهم عن العمران."
  en: "Al-Biruni places the expedition's barrier in the north-west of the inhabited world and states what lowers his confidence in the story, such as its Arabic-speaking Muslim inhabitants cut off from civilisation."
  es: "Al-Biruni sitúa el límite de la expedición en el noroeste del mundo habitado y expone los motivos que disminuyen su confianza en la historia, como el hecho de que sus habitantes musulmanes de habla árabe estuvieran aislados de la civilización."
  fr: "Al-Biruni situe la barrière de l'expédition au nord-ouest du monde habité et expose ce qui diminue sa confiance dans le récit, notamment le fait que ses habitants musulmans arabophones soient coupés de la civilisation."
