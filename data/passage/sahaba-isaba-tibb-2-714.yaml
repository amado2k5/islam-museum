text: "تراجم الرجال حرف الضاد المعجمة وروى مسدّد في مسنده في أوله زيادة. قال: وكان روى عبدان بن محمدٍ المَروزيّ، من طريق سلمة بن كُهَيل عن عبد اللّٰه بن شداد عن دِحْية الكلبيّ، قال: بعثني ضماد صديقاً للنبي وَالفِ، وكان يتطبَّب، …"
