  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 714, that mentions medicine and the physician, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 714 کا اقتباس جس میں طب اور طبیب، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
