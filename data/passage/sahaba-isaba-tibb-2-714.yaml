  tr: "İbn Hajar'ın El-İsabe adlı eserinin resimli 2. cildinin 714. sayfasından, tıp ve hekim, cerrahi, sünnet ve atellerden bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
