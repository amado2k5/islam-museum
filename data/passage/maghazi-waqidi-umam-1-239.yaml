text: "… اللّٰه قائمٌ تحتها، وأَصحابه مُحدقون به. ودفع لواء المهاجرين إلى أَبى الروم العَبْدَرىّ آخرَ النهار، ونظرتُ إِلى لواء الأوس مع أُسَيد بن حُضَير، فنا وشوهم ساعةً واقتتلوا على الاختلاط من الصفوف. ونادى المشركون بشِعارهم : يا لَلْعُزَّى، يا آل هُبَل …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 239، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
