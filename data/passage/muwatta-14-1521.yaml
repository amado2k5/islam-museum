label: { ar: "الموطأ 1521 — سعيد بن المسيب: ينهى أن تنكح المرأة على عمتها أو خالتها، أو أن يطأ الرجل وليدة وفي بطنها جنين لغيره", en: "Muwatta 1521", es: "Muwatta 1521", fr: "Muwatta 1521", ur: "موطا 1521", tr: "El-Muvatta 1521 — Sa’id ibn al-Musayyab: Bir kadının baba tarafından veya anne tarafından teyzesiyle evlenmesi, bir erkeğin de başka bir erkeğin fetüsüne hamile olan genç bir kızla cinsel ilişkiye girmesi yasaktır.", id: "Al-Muwatta 1521 — Sa’id ibn al-Musayyab: Diharamkan bagi seorang wanita untuk menikahi bibi dari pihak ayah atau ibu, atau bagi seorang pria untuk berhubungan intim dengan seorang gadis muda yang sedang mengandung janin laki-laki lain." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه كان يقول يُنهى أن تنكح المرأة على عمتها، أو على خالتها، أو أن يطأ الرجل وليدة وفي بطنها جنين لغيره. {cite:muwatta-maruf-1997 p.38}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle şöyle der: Bir kadının baba tarafından teyzesiyle evli olduğu sırada onunla evlenmesi, ya da anne tarafından teyzesiyle evlenmesi, ya da bir erkeğin başka bir erkekten hamile olan genç bir kızla cinsel ilişkiye girmesi haramdır. {cite:muwatta-maruf-1997 s.38}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa beliau biasa berkata: Diharamkan menikahi seorang wanita yang masih menikah dengan bibi dari pihak ayah, atau menikahi bibi dari pihak ibu, atau bagi seorang pria untuk berhubungan intim dengan seorang gadis muda yang sedang hamil anak orang lain. {cite:muwatta-maruf-1997 p.38}"
