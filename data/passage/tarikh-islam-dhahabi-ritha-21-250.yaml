text: "صاحب مَرْثِيّة الهرّ، والقاسم بن زكريّا المطرّز، وأبو عثمان سعيد بن عبد الرحيم الضّرير، وعليّ بن سُلَيْم، وجعفر بن محمد بن أسد النَّصيبيّ، والقاسم بن عبد الوارث، وأحمد بن مسعود السّرّاج، وبكر السّراويليّ، وعبد اللّهِ بن أحمد البلْخيّ، وابن النَّفّاح …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 21، ص 250، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, scan volume 21, p. 250, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "تاریخ الاسلام و وفیات المشاہیر والاعلام، اسکین جلد 21، ص 250 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, volume numérisé 21, p. 250, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, volumen escaneado 21, p. 250, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"İslam Tarihi ve Ünlü Şahsiyetlerin Ölümleri\" adlı resimli cilt 21'in 250. sayfasından, ölenler için yazılmış ağıt ve övgüleri içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 21, halaman 250, berisi elegi dan pujian untuk almarhum; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan pujian paling terkenal."
