label: { ar: "الموطأ 2021 — مالك: فيمن دفع إلى رجل مالا قراضا واشترط عليه الضمان: لا يجوز لصاحب المال أن يشترط في ماله غير ما وضع القراض عليه، فإن نما المال على شرط الضمان كان قد ازداد في حقه من الربح من أجل موضع الضمان، وإن تلف المال لم ير على الذي أخذه ضمانا، لأن شرط الضمان في القراض باطل", en: "Muwatta 2021", es: "Muwatta 2021", fr: "Muwatta 2021", ur: "موطا 2021", tr: "El-Muvatta 2021 — Malik: Bir kimseye kâr ortaklığı için para verip ondan kefalet isteyen kişi hakkında: Parayı alan kişinin, kâr ortaklığı için kararlaştırılanın dışında bir şey istemesi caiz değildir. Eğer para kefalet şartına göre artarsa, kefalet şartı nedeniyle kâr payını artırmış olur. Eğer para kaybolursa, onu alan kişi kefaletle yükümlü değildir, çünkü kâr ortaklığında kefalet şartı geçersizdir.", id: "Al-Muwatta 2021 — Malik: Mengenai orang yang memberikan uang kepada seseorang untuk persekutuan bagi hasil dan menetapkan jaminan darinya: Tidak diperbolehkan bagi pemilik uang untuk menetapkan sesuatu selain yang telah ditetapkan untuk persekutuan bagi hasil. Jika uang tersebut bertambah sesuai dengan syarat jaminan, maka ia telah meningkatkan bagian keuntungannya karena syarat jaminan tersebut. Jika uang tersebut hilang, maka orang yang menerimanya tidak bertanggung jawab atas jaminan, karena syarat jaminan dalam persekutuan bagi hasil tidak sah." }
summary:
  ar: "قال مالك في الرجل يدفع إلى الرجل مالا قراضا ويشترط على الذي دفع إليه المال الضمان. قال: لا يجوز لصاحب المال أن يشترط في ماله غير ما وضع القراض عليه، وما مضى من سنة المسلمين فيه، فإن نما المال على شرط الضمان، كان قد ازداد في حقه من الربح من أجل موضع الضمان. وإنما يقتسمان الربح على ما لو أعطاه إياه على غير ضمان. وإن تلف المال لم أر على الذي أخذه ضمانا، لأن شرط الضمان في القراض باطل. {cite:muwatta-maruf-1997 p.226} {cite:muwatta-maruf-1997 p.227}"
  tr: "Malik, bir adamın bir başkasına kâr paylaşımı (kırad) için para vermesi ve alıcının kefalet vermesini şart koşması konusunda şöyle demiştir: Paranın sahibinin, kâr paylaşımı anlaşmasında kararlaştırılan ve Müslümanların bu tür konulardaki yerleşik uygulaması olan şartlardan başka bir şey şart koşması caiz değildir. Eğer para kefalet şartı altında artarsa, sahibi kefalet sayesinde kâr artışı elde etmiş olur. Kârı, para kefaletsiz verilmiş gibi bölüştürmeleri gerekir. Eğer para kaybolursa, onu alan kişi üzerinde herhangi bir sorumluluk görmüyorum, çünkü kâr paylaşımı anlaşmasındaki kefalet şartı geçersizdir. {cite:muwatta-maruf-1997 s.226} {cite:muwatta-maruf-1997 s.227}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain dengan syarat perjanjian bagi hasil (qirad) dan menetapkan bahwa penerima harus memberikan jaminan: Tidak diperbolehkan bagi pemilik uang untuk menetapkan syarat selain yang telah disepakati dalam perjanjian bagi hasil dan yang telah menjadi kebiasaan umat Islam mengenai hal tersebut. Jika uang tersebut bertambah dengan syarat jaminan, maka pemilik telah menerima peningkatan keuntungan karena jaminan tersebut. Mereka hanya perlu membagi keuntungan seolah-olah uang tersebut diberikan tanpa jaminan. Jika uang tersebut hilang, saya tidak melihat adanya tanggung jawab pada penerima, karena syarat jaminan dalam perjanjian bagi hasil tidak sah. {cite:muwatta-maruf-1997 p.226} {cite:muwatta-maruf-1997 p.227}"
