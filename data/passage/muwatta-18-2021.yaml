label: { ar: "الموطأ 2021 — مالك: فيمن دفع إلى رجل مالا قراضا واشترط عليه الضمان: لا يجوز لصاحب المال أن يشترط في ماله غير ما وضع القراض عليه، فإن نما المال على شرط الضمان كان قد ازداد في حقه من الربح من أجل موضع الضمان، وإن تلف المال لم ير على الذي أخذه ضمانا، لأن شرط الضمان في القراض باطل", en: "Muwatta 2021" }
summary:
  ar: "قال مالك في الرجل يدفع إلى الرجل مالا قراضا ويشترط على الذي دفع إليه المال الضمان. قال: لا يجوز لصاحب المال أن يشترط في ماله غير ما وضع القراض عليه، وما مضى من سنة المسلمين فيه، فإن نما المال على شرط الضمان، كان قد ازداد في حقه من الربح من أجل موضع الضمان. وإنما يقتسمان الربح على ما لو أعطاه إياه على غير ضمان. وإن تلف المال لم أر على الذي أخذه ضمانا، لأن شرط الضمان في القراض باطل. {cite:muwatta-maruf-1997 p.226} {cite:muwatta-maruf-1997 p.227}"
