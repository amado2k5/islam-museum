text: "أمراض الأمعاء في القولنج وإيلاوس وأرجاع البطن الشبيهة به والرباح وغير ذلك الكتان والحلبة والسذاب نفع من النفخ العارضة في الأمعاء، الشونيز يحل النفخ جداً. د: الثوم يحل النفخ ويشفي أوجاع الأضلاع الحادثة عن السدد والبرد. ج: إنه يحل من …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1356، يذكر الحبة السوداء، والمرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والعقاقير والصيدلة، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1356, that mentions the black seed, illness and the sick, pain, named diseases, the organs of the body, drugs and pharmacy, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1356 کا اقتباس جس میں کلونجی، بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، ادویہ اور دواسازی، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 1356, que menciona la semilla negra, la enfermedad y los enfermos, el dolor, las enfermedades con nombre, los órganos del cuerpo, los medicamentos y la farmacia, la curación; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 1356, qui mentionne la graine noire, la maladie et les malades, la douleur, les maladies nommées, les organes du corps, les médicaments et la pharmacie, la guérison; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 1356. sayfasından, çörek otu, hastalık ve hasta, ağrı, hastalıkların isimleri, vücut parçaları, ilaçlar ve eczacılık ve şifa konularından bahseden bir pasaj; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 1356, yang menyebutkan biji jintan hitam, penyakit dan pasien, rasa sakit, nama-nama penyakit, bagian tubuh, obat-obatan dan farmasi, serta penyembuhan; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
