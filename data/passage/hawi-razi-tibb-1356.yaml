text: "أمراض الأمعاء في القولنج وإيلاوس وأرجاع البطن الشبيهة به والرباح وغير ذلك الكتان والحلبة والسذاب نفع من النفخ العارضة في الأمعاء، الشونيز يحل النفخ جداً. د: الثوم يحل النفخ ويشفي أوجاع الأضلاع الحادثة عن السدد والبرد. ج: إنه يحل من …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1356، يذكر الحبة السوداء، والمرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والعقاقير والصيدلة، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1356, that mentions the black seed, illness and the sick, pain, named diseases, the organs of the body, drugs and pharmacy, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1356 کا اقتباس جس میں کلونجی، بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، ادویہ اور دواسازی، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
