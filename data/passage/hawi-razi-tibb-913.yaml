text: "في الاستغرافات والإسهال والقيء والقصد والبول والعرق وغيرها ونحوها من العلل. قال: وأسهل السوداء اللذين تكثر همومهم وأحزانهم ويفكرون دائماً ويحبون الانفراد وتكثر بهم الأمراض السوداوية كعظم الطحال وحمى الربع والقوابي السوداوية والبرص الأسود في أيام الخريف. قال: وأسهل البلغم …"
