label:
  ar: "البخاري 2348 — رجل من أهل الجنة يستأذن ربه في الزرع"
  en: "Bukhari 2348 — A man of Paradise asks his Lord's leave to sow a field"
  ur: "بخاری 2348 — جنت کا ایک آدمی اپنے رب سے کھیتی کی اجازت مانگتا ہے"
text: "أن رجلا من أهل الجنة استأذن ربه في الزرع فقال له ألست فيما شئت قال بلى ولكني أحب أن أزرع. قال فبذر فبادر الطرف نباته واستواؤه واستحصاده، فكان أمثال الجبال فيقول الله دونك يا ابن آدم، فإنه لا يشبعك شىء …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 2348: رجل من أهل الجنة يستأذن ربه في الزرع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 2348: A man of Paradise asks his Lord's leave to sow a field. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 2348: جنت کا ایک آدمی اپنے رب سے کھیتی کی اجازت مانگتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
