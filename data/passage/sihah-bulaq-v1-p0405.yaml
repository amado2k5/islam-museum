text: |-
  ٢٣٦
  ⁦(باب الدال)⁩
  والسناد فى الشعر اختلاف الردفين كقول الشاعر
  فقد ألح الحباء على جوار * كان عيونهن عيون عين
  ثم قال *فأصحح رأسه مثل اللجين* يقسال قد ساند الشاعر قال ذوالرمة
  وشعرقد أرقت له غريب • أجانبه المساند والممالا
  وساندت الرجل مساندة اذا عاضدته وكانفته وسنداد اسم نهر ومنه قول أسوذين بعفر
  أهل الفورنق والسدير وبارق • والقصرذوالشرفات من سنداد
  والندبلادتول سندى الواحد وسند للجماعة مثل زنجي وزنج ⁦( ود)⁩ سادقومه
  يسودهم سيادة وسوددا وسيدودة فه وسيدهم وهم سادة تقديره فعلة بالتحريك لان تقدير
  سيد فعبل وهومثل سرى وسراة ولا نظيرلهمايدل على ذلك أنه يجمع على سيائدة باله-مزمثل
  أفيل وأفاتلة وتييع وتبائعة وقال أهل البصرة تقدير سيد فيعل وجمع على فعلة كانه.
  جعواساتدامثل قائدوقادة وذائدوزادة وقالوا انماجعت العرب الجيد والسيد على جيائد
  وسيائد بالهمز على غير قياس لان جمع فبعل فياعل يالهم زوالدال فى سودد زائدة للالحاق بيناء
  فعلل مثل جندب وبرقع وتقول سوّده قومه وهو أسود من فلان أى أجل منه قال الفرّا.
  يقال هذا سيد قومه اليوم فاذا أخبرت أنه عن قليل يكون سيدهم قلت هوسائدقومه عن
  قليل وسيد وأساد الرجل وأسود بمعنى أى ولدغلا ما سيداوكذلك أذا ولد غلاما أسود اللون
  واستاد القوم بنى فلان أى قتلواسيدهم وكذلك اذا أسروه أوخطبوا اليه والسوادلون وقد
  اسودّ الشى اسودادا واسوادًا سويداداويجوز فى الشعر اسوأتتحرك الااف اثلايجمع بين
  ساكنين والامر منه ا-وأددوان شئت أدغمت وسودته أنا وتصغير الاسود أسيد وان شئت
  ٢ و الد سرمار بل وكة والحربتالية - دال تسيب اليا ٠ القركة وتصغير الترخيم
  مودت ولم أملك سوادى وتحته • قيص من القوهيّ بيض بناثقه
  وبعضهمم يول سدت وكلمت فلانا فاردء-لى سودا. ولا ييضا. أى كله قبة ولا حسفة
  والاسودان التمر والماء وضاف قوم مز بدا المدنى فقال له-م مالكم عندى الا الاسودان
  قالوا ان فى ذلك لمقنعا التمر والماء قال ماذا كم عنيت انم أردت الحرّة واللميل والوطأة
  الوداء الدارسة والهراء الجديدة والا-ود العظيم من الحيات وفيه-واد والجمع الاساود
  لانه اسم ولو كان صفة لمع على فعل يقال أسود سالخ غير مضافِ لانه يسلخ جلده كل عام
  والاتى اسودة ولاتوصف بسانخة وساودنى فلان فدته من سواد اللون والسوددجيه
  قال الفترامسودت الابل تسويدا وهو أن تذق المسح البالى من شعر فقداوى به أدبارها قال
  الكسائى السيد من المعز المسنّ وفى الحديت ثىّ الضان خير من السيد من المعز وأفشد
  سواء عليمشاة عام دنت له • ليذيحها للضيف أم شاسيد
  وقولهم با-قلان بغنمه سود البطون وجاء بهاحر الكلى معناهمامهازيل والسواد الشخصر
  والمع اسودة ثم الاساود جع المع قال الاعشى
  تناهيتم عنبا وقد كأن فيكم • أساود صرعى لم يوسد قتيلها
  يدى
