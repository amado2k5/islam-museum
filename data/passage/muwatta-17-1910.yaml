label: { ar: "الموطأ 1910 — مالك: لا ينبغي أن يشتري أحد شيئا من الحيوان بعينه إذا كان غائبا عنه، وإن كان قد رآه ورضيه، على أن ينقد ثمنه، لا قريبا ولا بعيدا", en: "Muwatta 1910", es: "Muwatta 1910", fr: "Muwatta 1910", ur: "موطا 1910", tr: "El-Muvatta 1910 — Malik: Hiç kimse, yakınlarda veya uzakta olsun, bir hayvanı görmüş ve beğenmiş olsa bile, bedelini ödemesi şartıyla, o hayvan kendisinde yoksa onu satın almamalıdır.", id: "Al-Muwatta 1910 — Malik: Tidak seorang pun boleh membeli hewan tertentu jika hewan itu tidak ada di dekatnya, meskipun ia telah melihatnya dan menyetujuinya, dengan syarat ia membayar harganya, baik dekat maupun jauh." }
summary:
  ar: "قال مالك: لا ينبغي أن يشتري أحد شيئا من الحيوان بعينه إذا كان غائبا عنه، وإن كان قد رآه ورضيه، على أن ينقد ثمنه، لا قريبا ولا بعيدا. {cite:muwatta-maruf-1997 p.183}"
  tr: "Malik şöyle demiştir: Hiç kimse, elinde bulunmayan bir hayvanı, görmüş ve beğenmiş olsa bile, bedelini peşin ödemek şartıyla satın almamalıdır; hayvan yakın veya uzak olsun fark etmez. {cite:muwatta-maruf-1997 s.183}"
  id: "Malik berkata: Tidak seorang pun boleh membeli hewan tertentu jika hewan itu tidak ada dalam kepemilikannya, meskipun ia telah melihatnya dan menyetujuinya, dengan syarat ia membayar harganya di muka, baik hewan itu dekat atau jauh. {cite:muwatta-maruf-1997 p.183}"
