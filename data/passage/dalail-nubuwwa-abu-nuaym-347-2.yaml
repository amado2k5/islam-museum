text: "تاب إلى قيصر، فقمت بالباب وقلت: أنا رسول رسول الله ليف، ففزعوا لذلك، فدخل عليه الآذن فقال: هذا رجل بالباب يزعم أنه رسول رسول الله وللي فأذن لي، فدخلت عليه، فأعطيته الكتاب فقرء عليه فإذا فيه : ( بسم الله الرحمن الرحيم"
