text: "… قلب المؤمن من الخير، والجود، والإيمان، والنور، والهدى، والتقوى، والصفات التي يستحق بها هذا الاسم أكثرُ من استحقاق الحَبَلَة له. وعرمُوشها مبرد في آخر الدرجة الأولى، وإذا دُقّت وضُمِّدَ بها من الصداع سكنته، ومن الأورام الحارة والتهاب المعدة. وعصارةُ قضبانه …"
