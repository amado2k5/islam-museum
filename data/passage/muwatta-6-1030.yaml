label: { ar: "الموطأ 1030 — مالك في الكلب العقور الذي أمر بقتله في الحرم: كل ما عقر الناس وعدا عليهم وأخافهم، مثل الأسد والنمر والفهد والذئب، فهو الكلب العقور؛ أما ما كان من السباع لا يعدو مثل الضبع والثعلب والهر، فلا يقتلهن المحرم، فإن قتله فداه", en: "Muwatta 1030" }
summary:
  ar: "قول لمالك في الكلب العقور الذي أمر بقتله في الحرم: كل ما عقر الناس وعدا عليهم وأخافهم، مثل الأسد والنمر والفهد والذئب، فهو الكلب العقور. وأما ما كان من السباع لا يعدو، مثل الضبع والثعلب والهر وما أشبههن، فلا يقتلهن المحرم، فإن قتله فداه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1187) وسويد (628) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.480}"
