label: { ar: "الموطأ 1030 — مالك في الكلب العقور الذي أمر بقتله في الحرم: كل ما عقر الناس وعدا عليهم وأخافهم، مثل الأسد والنمر والفهد والذئب، فهو الكلب العقور؛ أما ما كان من السباع لا يعدو مثل الضبع والثعلب والهر، فلا يقتلهن المحرم، فإن قتله فداه", en: "Muwatta 1030", es: "Muwatta 1030", fr: "Muwatta 1030", ur: "موطا 1030", tr: "El-Muvatta 1030 — Malik, kutsal alanda öldürülmesini emrettiği kuduz köpek hakkında: İnsanlara saldıran, onları avlayan ve korkutan her şey, örneğin aslan, kaplan, leopar veya kurt, kuduz köpektir. Avlanmayan yırtıcı hayvanlara gelince, örneğin sırtlan, tilki veya kedi gibi, ihramlı bir hacı bunları öldürmemelidir. Eğer birini öldürürse, fidye ödemelidir.", id: "Al-Muwatta 1030 — Malik tentang anjing gila yang diperintahkannya untuk dibunuh di tempat suci: Apa pun yang menyerang manusia, memangsa mereka, dan menakut-nakuti mereka, seperti singa, harimau, macan tutul, atau serigala, adalah anjing gila. Adapun hewan pemangsa yang tidak memangsa, seperti hyena, rubah, atau kucing, seorang jamaah haji yang sedang ihram tidak boleh membunuh mereka. Jika ia membunuh salah satunya, ia harus memberikan tebusan." }
summary:
  ar: "قول لمالك في الكلب العقور الذي أمر بقتله في الحرم: كل ما عقر الناس وعدا عليهم وأخافهم، مثل الأسد والنمر والفهد والذئب، فهو الكلب العقور. وأما ما كان من السباع لا يعدو، مثل الضبع والثعلب والهر وما أشبههن، فلا يقتلهن المحرم، فإن قتله فداه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1187) وسويد (628) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.480}"
  tr: "Malik, kutsal alanda öldürülmesini emrettiği kuduz köpek hakkında şunları söylemiştir: İnsanlara saldıran, onları avlayan ve korkutan her şey, örneğin aslan, kaplan, leopar veya kurt, kuduz köpek sayılır. Ancak, sırtlan, tilki, kedi ve benzeri avlanmayan yırtıcı hayvanlar, ihramlı bir hacı tarafından öldürülmemelidir. Eğer biri bunlardan birini öldürürse, fidye ödemesi gerekir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1187), Suveyd (628) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.480}"
  id: "Malik berkata mengenai anjing gila yang diperintahkannya untuk dibunuh di tempat suci: Apa pun yang menyerang manusia, memangsa mereka, dan menakut-nakuti mereka, seperti singa, harimau, macan tutul, atau serigala, dianggap sebagai anjing gila. Namun, hewan pemangsa yang tidak memangsa, seperti hyena, rubah, kucing, dan sejenisnya, tidak boleh dibunuh oleh seorang jamaah haji yang sedang ihram. Jika seseorang membunuhnya, ia harus memberikan tebusan. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1187), Suwaid (628), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.480}"
