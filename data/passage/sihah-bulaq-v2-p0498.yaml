text: |-
  ٨٩
  والغرب معلق بالعجلة والزورق ضرب من السخن قال ذوالرمة
  أو-رة عيطل تيجاء مجفرة • دعائم الزورنعمت زورق البلد
  وأى نعمت سفينة المفازة والزر ق طائر بساديه قال الفراء هو البازى الابيض وابه-ع
  الزراريق والازارقة صنف من اللخواد ج نس-بوا الى نافع بن الازرق وهو من الدول بن
  حنيفة(زرمق الزرمائقة جبة صوف وفى الحديتات موسى عليه اللام لما أتى
  فرعون أتاه وعليه زرمانقة يعن جبة صوف قال أبو عبيد أراها عسبرانية قال والتفسيه
  *وقى الخديث ويقال هو فارىّ معزب وأصله اشتر بانه أى متاع الجمال (زعق».
  الزعق الصياح وقد رعقت به زعقا والزعق بالتحريك مصد رقولات زعق يزعق فهوزعق وهو
  النشيط الذى يفزع مع نشاطه وقد أزعه الخوف حتى زءق وانزعق قال الاصمعى يقال
  أزعقته فهو مزعوف عسلى غيرقياس وأنشد يارب مهر مزعوق *مقيل أومغبوق
  أى مذعورذكىّ الفؤاد وقال الاموى زعقته فهو مزعوق وأتسد
  تعلمى أنّ عليك سائقا • لامبطنا ولا عنفازاعقا • لبابأعجاز المطىّ لاحقا
  والماء الزعاق الملح وطعام منعوق اذا أكثر مله ⁦(زعفق)⁩، الزعفوق السبيء اتخلق
  وأنشدأبومهدى
  الى اذا ما حلق الزعاقق • واضطرمت من تحتها العنافق
  ( زقق الرق السقاء وجع القلة أزقاق والسكثيرز قاق وزقان مثل ذتاب وذوّبان وتزقيق
  الحاد سلخه من قبل رأسه على خلاف ما يسلخ الناس اليوم والزقاق السكة يدكرويونث
  قال الاخفس أهل الجازيؤننون الطريق والصراط والسبيل والسوق والزقاق وااكلاء
  وهو سوق البصرة وبنوتيم يذكرون هذا كله واله-ع الزقان والازقسة مثل -واروحوران
  وأحورة وزق الطائرفرخه يزقه أى أطعمه بفيه والزقزقة ترقيص الطفل ⁦(زلق )⁩ مكان
  زاق بالتهريك أى دحض وهو فى الاصل مصدرزلقت رجله تزلق ناقا وأزآقها غيره والزلق
  أيضاعجز الدابة قال رؤية * كأنم اسقباء بلقا الزاق * وأزلقت الناقة أسقطت والمزلق
  والمزاقة الموضع الذى لا تنبت عليهقدم وكذلل الزلاقة وقوله تعالى قتصيح صعيد ازلقا أى
  أرضاملاء ليس بهاشئ والمزلاق لغة فى المزلاج الذى يغلق به الباب ويفتح إلا مفتاح
  وقرس مزلاق كثيرة الازلاق والزايق السقط وزاق رأسميزاقه زلقا حلقه وكذلك أزاه
  وزلقه تزليقا ورجل زلق وزملق مثال هديد وزمالق وزمّلق يتشديد الميم وهوالذى ينزل
  فبل أن يجامع تقال اتا السيززاق وزتاق • بامت بد عنس من الشأم تاق
  والزليق باتضم والتشديد ضرب من انخوخ أملس يقال له بالفارسية شيفته رنك تق
  الزناق تحت الحنك فى الجلد وقد زنقت الفرس قال الشاعر
  فان يظهر حديثك يؤت عدوا • برأسك فى زناق أوعرات
  والزنق موضع الزناق ومنه قول رؤبة* أو مقرع من ركضهادامى الزنق • والزنقة السكة
  الضيقة والزناذ من الحلىّ المخنقة والمزنوق اسم فرس عامر بن الطفيل وقال
  صاح
  ني
