text: |-
  ⁦(١)⁩ بضمتين اه
  أقول لها اذا جشأت وجاشت
  مكانك تحمدى أوتستريى
  الخ ا
  ٧٦
  ليست بقتاته سبهللة * ولا بطر طبة لها حلب
  إقال أبوزيد فى توادره يشال للرجل ي ز سنة دهدرتين وطرطبين لب طلبت
  الشى طلباوكذلك اطلبته على افتعلته ومنه عبد المطلب بن هاشيم واسمه عامى
  والطلب أيضاجع طالب قال ذوالرمة
  فانصاع جانبه الوحشى وانكدرت • يلمين لا يأتلى المطلوب والطلب
  وطالبه بكذا مطالبة والتطلب الطلب هرة بعد أخرى والطلبة بكسر اللام ماطلبته من شئ
  وأطلبه أى أسعفه بماطلب وأطلبه أى أحوجه الى الطلب وهو من الاضداد ومنه قولهم
  أطلب الماء اذا بعد فلم يثل الابطلب يقال ماء مطلب وكذلك السكلاً وغيره قال الشاعر
  أهاجك برق آخر الليل مطلب ومطلوب اسم موضع قال الاعشى
  بارخاقاظ على مطلوب نب) الطنب ١ بل الحباء واجمع أطناب يشال
  خباءمطذب ورواق مطنب أى مشدود يا لاطناب والطنب أيضاءرق الشجر وعصب الجسد
  والمطنب المنسكب والعائق قال امر ؤالقيس
  واذهى سوداءمثل النيسيم • تغشى المطانب والمنكبا
  والطنب بالتحريك اعوجاج فى الرمح وطنب بالمكان أى أقام به وطنب الفرس أى طال متنه
  وأطنب فى الكلام بالغ فيه وابن الاطنابة رجل شاءر ٢ الاطنابة المظلة والاطنابة سير
  يشد فى طرف وترالقوس العربية وأطنبت الابل اذا اتبع بعضها بعضافى الي
  وأطنبت الريح اذا اشتدت فى غبار (طيب الطيب خلاف الايث وطاب الشئ
  يطيب طيبة وتطمابا قال علقمة
  يحملن أترجة نضخ العبيربهنا • كان تطيابها فى الانف مشموم
  وأطابه غيره وطيبه أيضا واستطابه وجده طيبا والاستطابة أيضا الاستهاء وقولهم
  ما أطيبه وما أيطيه مقلوب منه وفعات ذال بطيبة نفسى اذا لم يكرهك عليه أحد اوتقول
  مابه من الطيب ولا تقل من الطيبة وأطعمنافلان من أطايب الجزور جمع أطيب ولا تثل من
  مطايب الإزور والطيب ما يتطيب به والاطيبان الا كل والجهاع وطايبه أى مازح
  والطاب الطيب والطيب أيضا يقالان جيعا وقال يمدح عمربن عبد العزيزبن مر وان
  مقابل الاعراق فى الطاب بالطاب * بين أبى العاص وآل الخطاب
  وأبو العاص جدّحده وهو عمر بن عبد العزيز بن مروان بن الحكم بن أبى العاص وأمه
  أمّ عاصم بنت عاصم بن عمر بن الخطاب والطابة الحر وتمر بالمدينة يقال له عذق بن طاب
  ورطب بن طاب وعذق بن طاب وعذق بن زيد ضربان من التمر وشئ طياب بالضم
  أى طيب جدا وقال الشاغر
  غن أجدنادونها الضرابا * انا وجدنا ماهاطبابا
  وتقول ه_ذاشراب معايبة للنفس اى تطيب النفوس اذاشر بته وطوبى فعلى من الطيب
  قلبوا الياءوا واللضعة قبلها وتقول طوبى لك وطوباك بالاضافة قال يعقوب ولا تقل طوبيك
  باليا ء وطوبى اسم شجرة فى الجنة وسبى طيبة بكسر الطاء وفتح الياءصحيح السباءلم يكن عن
