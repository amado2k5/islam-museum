text: "دل أن المباح مأمور به. قلنا: قد يترك بالندب حرام: فليكن واجباً، وقد يترك بالحرام حرام آخر، فليكن الشيء الواحد واجباً حراماً، وهو تناقض. ويلزم هذا على مذهب من زعم: أن الأمر بالشيء نهي عن ضده، والنهي عن الشيء أمر …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 330، يرد فيه ذكر الواجب، والمباح، والحرام، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 330, whose wording mentions the obligatory (wajib), the permitted (mubah), the forbidden (haram), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 330 کا اقتباس جس میں واجب، مباح، حرام، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
