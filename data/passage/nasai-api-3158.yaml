label: { ar: "سنن النسائي 3158 — الأب والأبوة", en: "Sunan al-Nasa'i 3158 — the father and fatherhood", ur: "سنن نسائی 3158 — باپ اور والدیت", es: "Sunan al-Nasa'i 3158 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3158 — le père et la paternité", tr: "Sunan an-Nasa'i 3158 — Baba ve Babalık", id: "Sunan an-Nasa'i 3158 — Sang Ayah dan Peran Ayah" }
text: "… بْنُ الْعَلاَءِ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرٍو، سَمِعَ مُحَمَّدَ بْنَ قَيْسٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، عَنْ أَبِيهِ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ وَهُوَ عَلَى الْمِنْبَرِ فَقَالَ يَا رَسُولَ اللَّهِ أَرَأَيْتَ إِنْ ضَرَبْتُ بِسَيْفِي فِي سَبِيلِ اللَّهِ صَابِرًا مُحْتَسِبًا مُقْبِلاً غَيْرَ مُدْبِرٍ حَتَّى أُقْتَلَ أَيُكَفِّرُ اللَّهُ عَنِّي خَطَايَاىَ قَالَ \" نَعَمْ \". فَلَمَّا أَدْبَرَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3158، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3158 (The Book of Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3158، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3158 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3158 (Le Livre du Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 3158 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3158, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
