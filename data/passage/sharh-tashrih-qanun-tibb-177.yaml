  tr: "İbn el-Nafis'in hukukun anatomisi hakkındaki açıklamasından bir alıntı, s. 177; hastalıkların, hastanenin, tıp mesleğinin ve vücut organlarının isimlerini içeriyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikası gereği metin kırk kelime içinde alıntılanmıştır."
  id: "Kutipan dari penjelasan Ibn al-Nafis tentang anatomi hukum, hlm. 177, yang menyebutkan nama-nama penyakit, rumah sakit, profesi medis, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
