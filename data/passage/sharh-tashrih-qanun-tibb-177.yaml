text: "… فإنها ينتفع بها في أمور أخر لتسخين المعدة والمعاء وتنقية الأمعاء أيضا من الرطوبات اللزجة والبلغم ولذلك إذا امتنع نفوذ الصفراء من هناك إلى داخل الأمعاء حدث عن ذلك رياح وآلام شديدة كالقولنج ومع ذلك فإنها تجذبها الصفراء إليها لأجل …"
summary:
  ar: "مقطع من شرح تشريح القانون لابن النفيس، ص 177، يذكر أسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 177, that mentions named diseases, the hospital and the medical craft, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "شرح تشریح القانون، ابن النفیس، ص 177 کا اقتباس جس میں بیماریوں کے نام، بیمارستان، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
