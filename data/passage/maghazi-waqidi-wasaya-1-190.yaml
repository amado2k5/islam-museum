text: "… نيرانهم فى الآطام لَعالية، ثم على بُعاث، حتى إذا كانوا بحرّة العُرَيض نزف الحارث الدم فأَبطاً عليهم فناداهم : أقرعوا رسول اللّٰه منّى السلام ! فعطفوا عليه فاحتملوه حتى أَتوا النبيّ. فلمَّا بلغوا بقيع الغَرْقَد كبّروا. وقد قام رسول اللّٰه …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 190، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
