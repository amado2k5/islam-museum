label: { ar: "سنن ابن ماجه 105 — الأب والأبوة", en: "Sunan Ibn Majah 105 — the father and fatherhood", ur: "سنن ابن ماجہ 105 — باپ اور والدیت" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدٍ أَبُو عُبَيْدٍ الْمَدِينِيُّ، حَدَّثَنَا عَبْدُ الْمَلِكِ بْنُ الْمَاجِشُونِ، حَدَّثَنِي الزَّنْجِيُّ بْنُ خَالِدٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ـ \" اللَّهُمَّ أَعِزَّ الإِسْلاَمَ بِعُمَرَ بْنِ الْخَطَّابِ خَاصَّةً \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 105، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 105 (The Book of the Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 105، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
