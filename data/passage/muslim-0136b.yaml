ref: "136b"
label:
  ar: "مسلم 136b — لا يزالون يسألون حتى يقولوا: هذا الله خلق الخلق فمن خلق الله"
  en: "Muslim 136b — They will keep asking until they say: God created creation, so who created God"
  ur: "مسلم 136b — وہ پوچھتے رہیں گے یہاں تک کہ کہیں: اللہ نے مخلوق پیدا کی تو اللہ کو کس نے پیدا کیا"
  es: "Musulmán 136b — Seguirán preguntando hasta que digan: Dios creó la creación, ¿quién creó a Dios?"
  fr: "Muslim 136b — Ils continueront à interroger jusqu'à ce qu'ils disent: Dieu a créé la création, alors qui a créé Dieu ?"
  tr: "Müslim 136b — Onlar, “Yaratılanı yaratan Tanrı’dır, öyleyse Tanrı’yı kim yarattı?” diyene kadar sormaya devam edeceklerdir."
  id: "Muslim 136b — Mereka akan terus bertanya sampai mereka berkata: Inilah Tuhan yang menciptakan alam, lalu siapa yang menciptakan Tuhan?"
text: "قال الله إن أمتك ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 136b: لا يزالون يسألون حتى يقولوا: هذا الله خلق الخلق فمن خلق الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 136b: They will keep asking until they say: God created creation, so who created God. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 136b: وہ پوچھتے رہیں گے یہاں تک کہ کہیں: اللہ نے مخلوق پیدا کی تو اللہ کو کس نے پیدا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 136b: Seguirán preguntando hasta que digan: Dios creó la creación, ¿quién creó a Dios? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 136b: Ils continueront à interroger jusqu’à dire: « Dieu a créé la création, donc qui a créé Dieu ? » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 136b: Mereka akan terus bertanya sampai mereka berkata: Inilah Tuhan yang menciptakan alam semesta, lalu siapa yang menciptakan Tuhan? Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
