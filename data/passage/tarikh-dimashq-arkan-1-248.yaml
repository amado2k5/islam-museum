text: "… ابنه احمد والدولابى والبرقعيدى وغيرهم ومن حروياته ما رواه بسنده الى ابى هريرة ان رسول اللّه قال لا يزنى الزانى سجين يزنى وهو مؤمن ولا يشرب الجر حين يشر بها وهو مؤمن ولا يسرق السارق حين يسرق وهو مؤمن ولا …"
