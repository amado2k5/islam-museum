text: "… ابنه احمد والدولابى والبرقعيدى وغيرهم ومن حروياته ما رواه بسنده الى ابى هريرة ان رسول اللّه قال لا يزنى الزانى سجين يزنى وهو مؤمن ولا يشرب الجر حين يشر بها وهو مؤمن ولا يسرق السارق حين يسرق وهو مؤمن ولا …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 248، يذكر ما يرتفع معه الإيمان حين الفعل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 1, p. 248, that mentions what faith is lifted by at the moment of the act; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 248 کا اقتباس جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Historia de Damasco de Ibn 'Asakir, volumen 1, pág. 248, que menciona qué es lo que fortalece la fe en el momento del acto; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de l'Histoire de Damas d'Ibn Asakir (tome 1, p. 248) mentionne ce qui fortifie la foi au moment de l'acte; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Asakir'in Resimli Şam Tarihi adlı eserinin 1. cildinin 248. sayfasından bir alıntı, imanı eylem yoluyla yücelten şeylerden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 1 Bergambar, halaman 248, menyebutkan apa yang meninggikan iman melalui perbuatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
