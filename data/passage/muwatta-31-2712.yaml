summary:
  ar: "يروي مالك عن يزيد بن خصيفة عن عروة بن الزبير أنه سمع عائشة تقول: قال رسول الله: لا يصيب المؤمن من مصيبة، حتى الشوكة، إلا قُص بها، أو كُفّر بها من خطاياه. لا يدري يزيد أيهما قال عروة. {cite:muwatta-maruf-1997 p.529}"
