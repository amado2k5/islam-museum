text: "… الفَرَائِضَ. والفَاَرِضُ : الضخمُ من كلِّ شءٍ. قال الأخفش : يقال لحية فارِضَةٌ، إذا كانت عظيمةً. وأنشد : شَيَّبَ أَصْدَاغِى فَرَأْسِي أَبْيَضُ محاملُ فيها رِجَال فُرَض وفَرَضَ اللّٰه علينا كذا وافتَرَضَ، أى أوجب. والاسمُ الفَرِيضَةُ. ويسمَّى العلمُ بقسمة المواريث فَرَائِضَ. …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 2، ص 1120، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 2, p. 1120, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الصحاح، جوہری، اسکین جلد 2، ص 1120 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Sihah de al-Jawhari, volume numérisé 2, p. 1120, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Sihah de al-Jawhari, volumen digitalizado 2, p. 1120, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
