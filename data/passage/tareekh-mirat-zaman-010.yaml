text: "ريخ الأعيان تعالى بذلك، ليثبت جنانه (1) فيصلح حينئذ لحمل الرسالة إلى فرعون. رجع الحديث إلى وهب، قال: وكان لها شعبتان، ومحجن تحت الشعبتين (قال ألقها يموسى) [طه : ١٩] فظن أنه يقول: ارفضها ، فألقاها، ثم حانت منه نظرة"
