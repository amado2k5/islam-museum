text: |-
  • ⁦(ياب اللام)⁩*
  °٦٦١
  والنيتل اسم جبل ⁦( تبل )⁩ النجلة بالضم عظم البطن وسعته يقال رجل أتجل بين النجل
  وامرأة تجلاء وجلة تجلا عظيمة قال الشاءر
  وبانوا يعسون القطيعا ضيفهم • وعندهم البرنى فى جلل "مجل
  ومزادة تجلاءاى واسعة ومنه قول أبى اليحم ( ) • منى الروايا بالمزاد الايحل • ونى
  عجل أى ضخم وقواهم طع ن فلان فلانا الأعجلين اء، رماه بداهيسة من المكلام ⁦(رمل)⁩
  الترملة سو الا كل وأن لا يسالى الانسان كيف كان اكله قراه يتنائر على لحيته ويلطخ يديه
  والترولة بالضم أتى الذعالب وامم رجل فان الراجز
  ذهب ل أن رآها زمة • وقال ياقوم رأيت منكرة
  عل . الثعل بالضم خلم زائد صغير و أخلاف الناقة وفى ضرع الشاة يقال ما أبين
  نعل هذه الشار المع تعول قال ابن همام الساولى يهجو العلماء
  وذموالنا الدنيا وهم يرضعونها • أفاويق حتى ما يدرت لها ئعل
  واغماذ كر الفعل للمبالغة فى الارتضاع والنعسل لايدر والفعل بالتحريك زواتد فى الاسنان
  واختلاف فى منبتهمايركب بعضها بعضا رجل أفعل وامر أة نعلاه وربعما قالوا أنعل القوم
  علينا إذ امالفوا ونعالة اسم للمعلب وهو مه رفة وأرض-فعلة بالفتح أى كثيرة التعالب
  كما قالوامعقرة للارض الكثيرة العقارب وتعل أبو س من طي وهو تعل بن هروأخونبهان
  وهم الذين عناهم امى والقيس بقوله.
  وب رام من بنى تعل • مخرج كفيه من ستره
  ( نفل الثفل ماسقل من كل شى وقواهم تركت بنى فلان مثافلين أى يأكاون التغبل
  بعنون الحبّ وذلكْ اذ الم يكن لهم لبن وكان طعامهم الحب" وذلك أشما يكون حال البدوى
  وجل ثفال بالفتح أى بطىء والثفال بالكسر جلد يبسط فتوضع فوقه الرح فيطحن باليد
  ليسقط عليه الدقيق ومنه قول زهير• فتعر كسكم عرك الرسى بتفالها • وربما-مى الجر
  الاسفل يذلك ( قل الثقل واحد الاثقال مشمل حل وأحال ومنه قواهم أعطه ثل أى
  وزنه وقوله تعالى وأخرجت الارض أثقالها قالوا أجسادبى آدم والثقل ضد الففة
  تقول منه نقل الشى تقلامثل صغر صغرافهو ثقيل والنقل بالتهريك متاع المسافر وحنهه
  والنقلان الانس والجنّ ويقال أيضا وجدت ثقلة فى جسدى أى تقلا وفتورا حكاه
  الكسافة وثقلة القوم بكسر القاف أثقالهم يقال احتمل القوم::قلتهم أى بأمتعتهم كلها
  ونة-ل الشي الشى فى الوزن يثقله ثقلا وثقات الشاة أيضاأى وزنتها وذلك اذارضتها لتنظر
  ما تقلها من خفتها واحر أة ثقال بالفتح أى رزان ذات ما كم وكفل والتنقيل هذالتضفيف
  وقد أنقلدا لحمل وأثقلت المرأة فهى منقل أى ثقسل حلها فى بطنها قال الاخفش أى صارت
  ذات ثقل كاتقول أتمرنا أى صرناذوى تمر والمنقال واحد مناقيل الذهب قال الاصممى
  ديشار ثاقل اذا كان لا ينقص ودنانير وواقل ومثقال الذى. يزانه من .:له وقولهم التى عليه
  مناقيسه أمونته حكاء أبونصر ⁦(ثكل)⁩ الشكل فقدان المرأة ولد هاد كذلك الشكل
  بالحدرين وامرأما كل وسكلى ونكانه أمه شكلا وأنكله انه أمه والشكول الق ذكلت
  قوه ضيفهم فى بعض النخ
  قنى من الردة منى الحفلو
  وهو كذلات فى مادة روى الا أنه
  أجدل الانجل بالانقل اه
