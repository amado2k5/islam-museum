label:
  ar: "أبو داود 5268 — الحُمَّرة وفرخاها وقرية النمل المحروقة"
  en: "Abu Dawud 5268 — The hummarah's chicks and the burned ant-hill"
  ur: "ابو داود 5268 — حمرہ کے بچے اور جلائی ہوئی چیونٹیوں کی بستی"
  es: "Abu Dawud 5268 — Los polluelos de la hummarah y el hormiguero quemado"
  fr: "Abou Dawoud 5268 — Les poussins de la hummara et la fourmilière brûlée"
  tr: "Ebu Davud 5268 — Kızılkuyruk ve yavruları ile yanmış karınca köyü"
  id: "Abu Dawud 5268 — Burung redstart dan anak-anaknya serta desa semut yang terbakar"
text: "فَرَأَيْنَا حُمَّرَةً مَعَهَا فَرْخَانِ فَأَخَذْنَا فَرْخَيْهَا فَجَاءَتِ الْحُمَّرَةُ فَجَعَلَتْ تُعَرِّشُ، فَجَاءَ النَّبِيُّ فَقَالَ: مَنْ فَجَعَ هَذِهِ بِوَلَدِهَا؟ رُدُّوا وَلَدَهَا إِلَيْهَا. وَرَأَى قَرْيَةَ نَمْلٍ قَدْ حَرَّقْنَاهَا فَقَالَ: مَنْ حَرَّقَ هَذِهِ؟ قُلْنَا نَحْنُ، قَالَ: إِنَّهُ لَا يَنْبَغِي أَنْ يُعَذِّبَ بِالنَّارِ إِلَّا رَبُّ النَّارِ"
summary:
  ar: "في كتاب الأدب؛ عن عبد الرحمن بن عبد الله عن أبيه: أخذ أصحاب النبي فرخي حُمّرة فجاءت تعرش، فقال النبي من فجع هذه بولدها ردوا ولدها إليها؛ ورأى قرية نمل حرقوها فقال لا ينبغي أن يعذب بالنار إلا رب النار — أشهر نص في رحمة الحيوان."
  en: "In the Book of General Behaviour, from Abd al-Rahman ibn Abd Allah via his father: the Companions took the two chicks of a hummarah and she came fluttering; the Prophet said 'Who has pained her for her young? Return her young' — and seeing the ant-hill they had burned: 'None should punish with fire but the Lord of Fire.' The most famous text on mercy to animals."
  ur: "کتاب ادب میں عبدالرحمن بن عبداللہ کے والد سے: صحابہ نے ایک حُمَّرہ کے دو بچے اٹھا لیے تو وہ پھڑپھڑاتی آئی، نبی نے فرمایا 'کس نے اسے اس کی اولاد پر افسردہ کیا؟ بچے لوٹاؤ'؛ اور جلائی ہوئی چیونٹیوں کی بستی دیکھ کر فرمایا 'آگ سے اللہ کے سوا کسی کو عذاب دینا زیب نہیں'۔ جانوروں پر رحم کا مشہور ترین متن۔"
  es: "En el Libro de la Conducta General, de Abd al-Rahman ibn Abd Allah, transmitido por su padre: Los Compañeros tomaron los dos polluelos de una hummarah, y ella vino revoloteando; el Profeta dijo: «¿Quién la ha afligido por sus crías? Devuélvanlas». Y al ver el hormiguero que habían quemado, dijo: «Nadie debe castigar con fuego sino el Señor del Fuego». El texto más famoso sobre la misericordia hacia los animales."
  fr: "Dans le Livre des bonnes mœurs, rapporté par Abd al-Rahman ibn Abd Allah via son père: les Compagnons prirent les deux poussins d’une humara, et celle-ci revint en voletant; le Prophète dit: « Qui l’a affligée pour ses petits ? Rendez-lui ses petits ! » — et voyant la fourmilière qu’ils avaient brûlée: « Nul ne doit punir par le feu, si ce n’est le Seigneur du Feu. » Le texte le plus célèbre sur la miséricorde envers les animaux."
  tr: "Edebiyat kitabında, Abdülrahman ibn Abd Allah'ın babasından rivayet ettiğine göre: Peygamberin sahabeleri kırmızı bir kuşun iki yavrusunu aldılar ve kuş aşağı doğru süzüldü. Peygamber, \"Yavrularını alarak bu kuşa kim üzdü? Yavrularını ona geri verin\" dedi. Yakılmış bir karınca kolonisi gördü ve \"Ateşle cezalandırılacak olan yalnızca Ateşin Rabbidir\" dedi. Bu, hayvanlara merhamet konusunda en meşhur hadistir."
  id: "Dalam kitab sastra, berdasarkan riwayat Abd al-Rahman ibn Abd Allah, dari ayahnya: Para sahabat Nabi mengambil dua anak burung merah, dan burung itu terbang menukik ke bawah. Nabi bersabda, “Siapa yang telah menyakiti burung ini dengan mengambil anaknya? Kembalikan anak-anaknya.” Beliau melihat sebuah koloni semut yang telah mereka bakar, dan beliau bersabda, “Tidak seorang pun boleh dihukum dengan api kecuali Tuhan Yang Maha Kuasa” — teks paling terkenal tentang rahmat terhadap hewan."
