label:
  ar: "أبو داود 5268 — الحُمَّرة وفرخاها وقرية النمل المحروقة"
  en: "Abu Dawud 5268 — The hummarah's chicks and the burned ant-hill"
  ur: "ابو داود 5268 — حمرہ کے بچے اور جلائی ہوئی چیونٹیوں کی بستی"
text: "فَرَأَيْنَا حُمَّرَةً مَعَهَا فَرْخَانِ فَأَخَذْنَا فَرْخَيْهَا فَجَاءَتِ الْحُمَّرَةُ فَجَعَلَتْ تُعَرِّشُ، فَجَاءَ النَّبِيُّ فَقَالَ: مَنْ فَجَعَ هَذِهِ بِوَلَدِهَا؟ رُدُّوا وَلَدَهَا إِلَيْهَا. وَرَأَى قَرْيَةَ نَمْلٍ قَدْ حَرَّقْنَاهَا فَقَالَ: مَنْ حَرَّقَ هَذِهِ؟ قُلْنَا نَحْنُ، قَالَ: إِنَّهُ لَا يَنْبَغِي أَنْ يُعَذِّبَ بِالنَّارِ إِلَّا رَبُّ النَّارِ"
summary:
  ar: "في كتاب الأدب؛ عن عبد الرحمن بن عبد الله عن أبيه: أخذ أصحاب النبي فرخي حُمّرة فجاءت تعرش، فقال النبي من فجع هذه بولدها ردوا ولدها إليها؛ ورأى قرية نمل حرقوها فقال لا ينبغي أن يعذب بالنار إلا رب النار — أشهر نص في رحمة الحيوان."
  en: "In the Book of General Behaviour, from Abd al-Rahman ibn Abd Allah via his father: the Companions took the two chicks of a hummarah and she came fluttering; the Prophet said 'Who has pained her for her young? Return her young' — and seeing the ant-hill they had burned: 'None should punish with fire but the Lord of Fire.' The most famous text on mercy to animals."
  ur: "کتاب ادب میں عبدالرحمن بن عبداللہ کے والد سے: صحابہ نے ایک حُمَّرہ کے دو بچے اٹھا لیے تو وہ پھڑپھڑاتی آئی، نبی نے فرمایا 'کس نے اسے اس کی اولاد پر افسردہ کیا؟ بچے لوٹاؤ'؛ اور جلائی ہوئی چیونٹیوں کی بستی دیکھ کر فرمایا 'آگ سے اللہ کے سوا کسی کو عذاب دینا زیب نہیں'۔ جانوروں پر رحم کا مشہور ترین متن۔"
