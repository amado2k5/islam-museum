label: { ar: "سنن أبي داود 2669 — الأب والأبوة", en: "Sunan Abi Dawud 2669 — the father and fatherhood", ur: "سنن ابی داؤد 2669 — باپ اور والدیت", es: "Sunan Abi Dawud 2669 — El padre y la paternidad" }
text: "… جَدِّهِ، رَبَاحِ بْنِ رَبِيعٍ قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ فِي غَزْوَةٍ فَرَأَى النَّاسَ مُجْتَمِعِينَ عَلَى شَىْءٍ فَبَعَثَ رَجُلاً فَقَالَ \" انْظُرْ عَلاَمَ اجْتَمَعَ هَؤُلاَءِ \" فَجَاءَ فَقَالَ عَلَى امْرَأَةٍ قَتِيلٍ. فَقَالَ \" مَا كَانَتْ هَذِهِ لِتُقَاتِلَ \". قَالَ وَعَلَى الْمُقَدِّمَةِ خَالِدُ بْنُ الْوَلِيدِ فَبَعَثَ رَجُلاً فَقَالَ \" قُلْ لِخَالِدٍ لاَ يَقْتُلَنَّ امْرَأَةً وَلاَ عَسِيفًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2669، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2669 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2669، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2669 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
