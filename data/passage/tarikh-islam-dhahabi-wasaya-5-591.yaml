text: "… على عائشة فأخرجتْ إلينا إزاراً غليظاً ممّا يُصنَع باليمن، وكِساءً من هذه التي تَدْعونها الملبَّدة، فأقسمت بالله لقد قُبِض رسول اللّه في هذين الثَوْبَيْن. مُتَّفَقٌ عليه. في الفرائض باب قول النبيّ : لا نُورَث ما تركْنا صَدَقة، وفي الوصايا باب …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 591، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
