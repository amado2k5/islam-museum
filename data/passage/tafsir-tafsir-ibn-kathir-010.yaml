text: "ه فإن تولوا فقولوا اشهدوا بأنامسلمون : هذا الخطاب يعم أهل الكتاب من اليهود والنصارى، ومن جرى مجراهم (قل يأهل الكتب تعالوا إلى كلية) والكلمة تطلق على الجملة المفيدة كما قال هاهنا. ثم وصفها بقوله: (سواء بيننا وبينكم) أي: (٢)"
