  ١١٧
  والافاويق أيضاما اجتمع فى السحاب من ماءفهو بطرساعة بعدساعة قال الكميت
  فباتت تتج أفاويقها • سجال النطاف عليه غزارا
  أى تتج أفاويقهاء-لى الثور الوحشى" كسجال النطاف وأفاقت الناقسة تقيق افاقة أى
  اجتمعت الفيقة فى ضرعها فهى مفيق ومفيقة عن أبى عمر ووابهع منفا ويق وفوقت الفصيل
  أى سقيته اللبن فوا قافوا قا وتفوّق الفصيل اذا شرب الابن كذلك ومنه حديث أبى مومى انه
  تذا كرهو ومعاذقراءة القرآن فقال أبو موسى أما أنافأ تفوّقه تفوّ ق اللقوح أى لا أقرأ
  جزبى بمترة ولكنى أقر أمنه شيأبعد شئ فى آناء الليل والنهار والفاقة الفقروالحاجة وافتاق
  الرجل أى اقتقرولا يقال فاق والفائق موصل العنق فى الرأس فاذاطال الفائق طال
  العنق واستفاق من حرضه ومن سكره وأفاق بمعنى
  صل القاز رق الفرق بكسراراه المكان المستوى يقال قاع قرق
  وقال يصف ابلا بالسرعة
  كان أيديهنّ بالقاع القرق • أيدى جوار بتعاطين الورق
  ريق القريق اسم موضع وأنشد الاصحىّ
  يتبعن ورقا كلون العوهق • لاحقة الرجل عنود المرفقه
  ياابن رقيع هل لهسامن مغبق * ماشربت بعد طوى التمريق
  من قعارة غير التجاء الادفق
  ورواه أ بوعبيدة الكريق بالكاف وبالقاف أيضا دقال ه والبصرة وقال النضربن شميل هو
  الحانوت فارسى معرب يعنى كابه ⁦(قلق)⁩ القلق الانزعاج يقالبات قلة اوأقلقه غيره
  وق) رج-ل قاق وقوق أى فأحس الطول والقوقة الاصلح يق القيقاءة
  الأرض الغليظة والهسمزة مبدلة من الباء والياء الاولى مبدلة من الواويدالك عليه قواهم فى
  الجمع القواقى وهو فعلاء مطحق بسرداح وكذلك الزيزاءة لانه لا يكون في الكلام مثل القلقال
  الامصدراوقد يجمع على اللفظ فيقال قبلق قال الراجز
  اذا تطين على القياتى * لاقين منه أذنى عناق
  وقول رؤية القيق يريد جع قيقاءة كانه أخرجه على جمع قيقة
  صل اللام ق اللبق واللبيق الرجل الحاذق الرفيق بايعدله وقد لبق بالكسر
  لباقة قال الشاعر • وكان بتصريف القناة لبيقا * ويقال أيضالبق به الثوب أى لاق به
  والتريد اللبق الشديد التتريد الملين بالدسم يقال تريدة ملبقة . تف اللثق بالتحريك البلل
  وقد لئق الشئء بالكسر والتنق وألثقه غيره وطائرلئق أى مبتل ق حقه ولحق به
  لحاما بالفمح أى أدركه وألحقه به عيره وألحه أيضا بعى لحقه وفى الدعاءان عذابك بالكفار
  لحق بكسر الحاء أى لاحق والفتح ايض اصواب ولحق اوفاأى ضهر واللهق الدى الملصو
  واستلهقه أى ادعاه وتلاجقت المطابا أي لحق بعضها بعضا واللحق بالتخريك شي يلحق بالأوّل
  واللعو أيضامن التمر الذى بأتى بعد الاول ولاحق اسم فرس كان لمعاوية بن أبي سفيران
