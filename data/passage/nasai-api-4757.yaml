label: { ar: "سنن النسائي 4757 — الفرض", en: "Sunan al-Nasa'i 4757 — the obligatory (fard)", ur: "سنن نسائی 4757 — فرض", fr: "Sunan al-Nasa'i 4757 — l'obligatoire (fard)", es: "Sunan al-Nasa'i 4757 — lo obligatorio (fard)" }
text: "… الرُّبَيِّعُ ثَنِيَّةَ جَارِيَةٍ فَطَلَبُوا إِلَيْهِمُ الْعَفْوَ فَأَبَوْا فَعُرِضَ عَلَيْهِمُ الأَرْشُ فَأَبَوْا فَأَتَوُا النَّبِيَّ فَأَمَرَ بِالْقِصَاصِ. قَالَ أَنَسُ بْنُ النَّضْرِ يَا رَسُولَ اللَّهِ تُكْسَرُ ثَنِيَّةُ الرُّبَيِّعِ لاَ وَالَّذِي بَعَثَكَ بِالْحَقِّ لاَ تُكْسَرُ. قَالَ \" يَا أَنَسُ كِتَابُ اللَّهِ الْقِصَاصُ \". فَرَضِيَ الْقَوْمُ وَعَفَوْا فَقَالَ \" إِنَّ مِنْ عِبَادِ اللَّهِ مَنْ لَوْ أَقْسَمَ عَلَى اللَّهِ لأَبَرَّهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4757، يرد فيه ذكر الفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 4757 (The Book of Oaths (qasamah), Retaliation and Blood Money), whose wording mentions the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 4757، جس کے الفاظ میں فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 4757, dont le texte mentionne l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 4757, cuyo texto menciona lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
