text: "الكتاب الثاني الجملة الثانية : في بيان الأدوية المفردة - حرف الراء ومن ريح السيل والغشاوة سعوطاً بماء المرزنجوش، ويكتحل به مع الإثمد للحَوَل. أعضاء الصدر : يسقى من أصله وزن درهمين في الشراب لذات الجنب البارد، وللربو، والسعال المزمن، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 663، يذكر الإثمد، والكحل، وأسماء الأمراض، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 663, that mentions ithmid (antimony kohl), kohl for the eye, named diseases, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 663 کا اقتباس جس میں اثمد سرمہ، سرمہ، بیماریوں کے نام، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 663, que menciona el ithmid (kohl de antimonio), kohl para los ojos, enfermedades, el medicamento, medicamentos y farmacia; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 663, qui mentionne l'ithmid (khôl d'antimoine), le khôl pour les yeux, les maladies nommées, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 663'ten bir bölüm; antimon, sürme, hastalık isimleri, tıp, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 663, yang menyebutkan antimon, kohl, nama-nama penyakit, obat-obatan, narkoba, dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
