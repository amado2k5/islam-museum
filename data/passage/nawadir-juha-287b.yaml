text: "… نِمْتُ قبل أن أجيء إلى هنا نزل في إحدى القرى ضيفاً على إمام القرية، فسأله صاحب البيت: ألم تنم؟ أأنت عطشان؟ ولم يذكر شيئاً عن الطعام. فأجابه الشيخ: نِمْتُ قبل أن أجيء إلى هنا في قرية بيكارباشي. أنشأتُها حسب مشورتكم …"
summary:
  ar: "سأل إمام القرية جحا هل هو عطشان، فقال إنه نام قبل أن يأتي إلى هذه القرية، قرية بيكاربشي. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  en: "Asked by the village imam whether he is thirsty, Juha says he slept before coming to this village of Bikarbashi. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  ur: "گاؤں کا امام جحا سے پوچھتا ہے کہ کیا وہ پیاسا ہے، تو جحا کہتا ہے کہ وہ اس گاؤں، بیکاربشی، آنے سے پہلے سو چکا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  fr: "Interrogé par l'imam du village pour savoir s'il a soif, Juha dit qu'il a dormi avant de venir dans ce village de Bikarbashi. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  es: "Al preguntarle el imán de la aldea si tiene sed, Juha dice que durmió antes de venir a esta aldea de Bikarbashi. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  tr: "Köy imamı Juha'ya susamış olup olmadığını sordu ve Juha, bu köye, yani Bekarbashi köyüne gelmeden önce uyuyakaldığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 141}"
  id: "Imam desa bertanya kepada Juha apakah dia haus, dan dia menjawab bahwa dia tertidur sebelum datang ke desa ini, desa Bekarbashi. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
