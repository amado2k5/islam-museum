text: "حَدَّثَنَا يَحْيَى بْنُ يَحْيَى، أَخْبَرَنَا يَحْيَى بْنُ زَكَرِيَّاءَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ قَالَ حَسَّانُ يَا رَسُولَ اللَّهِ ائْذَنْ لِي فِي أَبِي سُفْيَانَ قَالَ \" كَيْفَ بِقَرَابَتِي مِنْهُ \". قَالَ وَالَّذِي أَكْرَمَكَ لأَسُلَّنَّكَ مِنْهُمْ كَمَا تُسَلُّ الشَّعَرَةُ مِنَ الْخَمِيرِ. فَقَالَ حَسَّانُ وَإِنَّ سَنَامَ الْمَجْدِ مِنْ آلِ هَاشِمٍ بَنُو بِنْتِ مَخْزُومٍ وَوَالِدُكَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6393، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6393 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6393، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
