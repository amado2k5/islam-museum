text: "عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ يَعْنِي أَنْ لاَ تَمُدَّهُ مَدًّا ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ ‏.‏ وَهُوَ الَّذِي يَسْتَحِبُّهُ أَهْلُ الْعِلْمِ وَرُوِيَ عَنْ إِبْرَاهِيمَ النَّخَعِيِّ أَنَّهُ قَالَ التَّكْبِيرُ جَزْمٌ وَالسَّلاَمُ جَزْمٌ ‏.‏ وَهِقْلٌ يُقَالُ كَانَ كَاتِبَ الأَوْزَاعِيِّ ‏.‏"
summary:
  ar: "في جامع الترمذي؛ ذكر كتابة كتاب أو إرساله."
  en: "In Jami' al-Tirmidhi; mention of writing or dispatching a letter."
  ur: "جامع ترمذی میں؛ خط لکھنے یا بھیجنے کا ذکر."
