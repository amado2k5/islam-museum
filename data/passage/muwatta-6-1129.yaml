label: { ar: "الموطأ 1129 — مالك: الذي يفسد الحج أو العمرة حتى يجب عليه فيه الهدي: التقاء الختانين، وإن لم يكن ماء دافق", en: "Muwatta 1129", es: "Muwatta 1129", fr: "Muwatta 1129", ur: "موطا 1129", tr: "El-Muvatta 1129 — Malik: Kurban kesmeyi gerektiren Hac veya Umre'yi geçersiz kılan şey, meni boşalması olmasa bile, sünnetli iki organın birleşmesidir.", id: "Al-Muwatta 1129 — Malik: Yang membatalkan ibadah haji atau umrah, yang mensyaratkan penyembahan hewan kurban, adalah pertemuan kedua bagian yang disunat, meskipun tidak terjadi ejakulasi." }
summary:
  ar: "قول لمالك: الذي يفسد الحج أو العمرة حتى يجب عليه في ذلك الهدي في الحج أو العمرة هو التقاء الختانين، وإن لم يكن ماء دافق. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1234). {cite:muwatta-maruf-1997 p.515}"
  tr: "Malik şöyle demiştir: Hac veya Umreyi geçersiz kılan ve dolayısıyla kurban kesmeyi gerektiren şey, boşalma olmasa bile, sünnetli iki organın birleşmesidir. Araştırmacı, bunu Ebu Musab'ın (1234) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.515}"
  id: "Malik berkata: Yang membatalkan haji atau umrah, sehingga mengharuskan penyembahan hewan kurban, adalah pertemuan kedua bagian yang disunat, meskipun tidak terjadi ejakulasi. Peneliti menyebutkan bahwa Abu Mus'ab (1234) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.515}"
