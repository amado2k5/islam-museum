text: "… ف سمعته يقول: في ترجمة هبار من وجه آخر، وفيها مغايرة لما ذكر أبو المسلم أخو المسلم إذا لقيه حياه يرد عليه ما هو خير منه، لا يمنعه الماعون... الحديث. نعيم؛ ولفظه عن محمد بن سلمة الحراني، عن الفزاري، عن …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1067، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
