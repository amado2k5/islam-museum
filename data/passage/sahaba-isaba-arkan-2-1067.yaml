  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 1067. sayfasından bir alıntı, bir Müslümanın özelliklerini anlatmaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve bir müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 2, halaman 1067, menjelaskan karakteristik seorang Muslim. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
