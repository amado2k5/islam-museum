text: "ومسند أبي يعلى الموصلي(2). ويذكره الإمام ابن العماد الحنبلي في كتابه: ⁦(⁦(شذرات الذهب)⁩)⁩ في ترجمة : أسعد بن أحمد بن أبي غانم الثقفي الأصبهاني الضرير قائلا: سمع هو وأخوه زاهر الثقفي مسند أبي يعلى(2) . ويذكره الإمام ابن أبي جرادة"
