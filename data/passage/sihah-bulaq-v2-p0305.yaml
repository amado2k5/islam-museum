text: |-
  ٢٨٢
  ⁦(حم)⁩•
  الساكن إذا حرك حرك الى الكسر وأبو عمر ويختلس حركة الخاء اختلاسا وأما الجع بين
  الساكنين فيه فلحن والخصم بكسر الضاد الشديد الخصومة والخصم بالضم جائب العدل
  وزاويته يقال للمتاع اذا وقع فى جانب الوعاء من نرج أوجوالق أوعيبة قد وقع ف خصم
  الوعاء وفى زواية الوعاء وخصم كلت شئ جانبه وناحيته وأخضام العين ماضمت عليه الاشفار
  واختصم القوم وتخاصموا بمعنى والسيف يحتصم جفته اذا أكاه من حدّته ( ضم
  خضمت الشى بالكسر أخضمه خضما قال الاصمفى هوالاكل يجميع القم والخضمة بالضم
  وتتديد الميم مستغلظ الذراع ويقال انّ الخضمة معظم كل أمر والخضم على وزن الهجف
  الكثير العطاء والخضم أيضا الجمع السكثير وقال * فاجتمع الخضم والخضم *والخضم أيضا
  فى قول أبى وجزة السعدى المسنّ من الابل والخضيمة حنطة تطبخ بالماء حتى تنضم
  وخضم على وزن بقم اسم العنبرين عمروين تميم وقد غلب على القبيلة يزعمون أنهسم انماسموا
  يذلك اكثرة الخضم وهو المضغ لانه من أبنية الافعال دون الاسماء وخضم أيضا اسم ماء
  وقال
  لولا الاله ماسكنا خضما • ولاظللنا بالمشائى قيا
  وهو شاذ على ماذكرناه فى يقم ⁦(خضرم)⁩ لحم مخضرم بفتح الراء لايدرى من ذكرهو أو
  أنتى والمخضرم أيضا الشاءر الذى أدركالجاهلية والاسلام مثل ابيد ورجل مخضرم النسب
  أى دعىّ وناقة مخضرمة قطع طرف أذنها وامرأة مخضرمة أى مخفوضة والخضرم بالكسر
  الكثير العطية مسبه بالبحر الخضرم وهو الكثير الماء وأنكر الاصعىّ اللخضرم فى وصف البحر
  وكل شى كثير واسع خضرم والجمع الخضارم قال جرير للمعجاج • تجدبم انبسذاخضرما
  والحضارصة قوم بالنأم وذلك أنّ قوما من العجم خرجوا فى أوّل الاسلام فتفرقوا فى بلاد
  العرب فن أقام منهم بالبصرة فهم الاساورة ومن أقام منهم بالكوفة فهم الاسامرة ومن أقام
  منهسم بالشأم فهم الخضارمة ومن أقام عنهم بالجزيرة فهم الجراجة ومن أقام منهم باليمن فهم
  الابناء ومن أقام منهم بالموصل فهم الجرامقة واللخضرم مثال العابط ولد الضبّ قال ابن
  دريد أوّله حسل ثم مطبخ ثم خضرم ثم ضب ولم يذكر الغيداق وذكره أبوزيد (خطم الخطم
  من كل طائرمنقاره ومن كل داية مقتم أنفه وفه والمخاطم الانوف واحدها مخطم بكسر
  الطاء ورجل أخظم طويل الانف واخطام الزمام وخطعت البعيرز عمتسه وناقة مخطومة
  ونوق مخطمة شدد للكنرة والمخطم أيضا البسراذا صارت فيه خطوط وطرائق وقيس بن
  الخطيم شاعر وخطمة من الانصاروهم بنوعبد الله بن مألك بن أوس والخطمة رعن الجبل
  والخطعى بالسكسر الذى يغسل به الرأس ( -لم الحلم بالكسر الصديق وأصل الخلم
  كنتاس الظبى والمخالمة المصادقة والاخلام الاصحاب قال الكميت
  اذا ابتشر الحرب أخلامها * كشافاوهيجت الاخل
  لجم) انخليم الطويل ⁦( م)⁩ أبوءر ولحم خاتم ومخمّ أى منتى وق_دخمّ اللحم يختم
  بالكسراذا أنتن وهو شوا أو طبيخ ومثل يضرب للرجل اذاذكر جخير وأمنى عليه هوالسمن
  لا يختم وأختمّ مثله وأختمّ البثريخمها أى كسحها ونقاها وكذلك البيت اذا كنسته والاختمام
  مثله وقلب مخموم أى نقىّ من الغنّ والحسدوهو فى الحديث والحامة القمامة وما يخم
