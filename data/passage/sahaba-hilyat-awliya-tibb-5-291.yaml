text: "… بين ذلك خطفات المنايا. فكم رأيت ورأيتم من كان بالدنيا مفترا، وإنما تقر عين من وثق بالنجاة من عذاب اللّٰه، وإنما يفرح من أمن من أهوال يوم. القيامة، فاما من لا يداوى كلا الا أصابه جرح فى ناحية أخرى، أعوذ …"
