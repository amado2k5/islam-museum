text: |-
  الشنشنة الخلق والطبيعة قاله
  المؤاف اه
  ١٩٢
  * ⁦(و معل )⁩ *
  جعد الدرائيك رفل الاجلاد * والترفيل التعظيم قارذوالرمة
  اذا نحن رقلنا امر أسادقومه • وان لم يكن من قبل ذلديذكر
  وترفيل الركية اجامها (رقل الرقلة مثل الرعلة والجمع الرقال وهى الطوال من النخل
  والارقال شرب من الحبب وقد أرقل البعير وناقة مرقل ومر قال اذا كانت كثيرة الارقال
  والمرقال لقب هاشم بن عتبة الزهرىّ لانّ عليا عليه السلام دفع اليه الرابة يوم صفين فكان
  يرقل بها ارقالا والراقول حبل يصعديه النخل وهو الحابول والسكر⁦( ركل )⁩ الركل الضرب
  بالرجل الواحدة وقدركاء يركله وترا كل القوم والمركل الطريق ومرا كل الدابة حيث يركلها
  الفارس برجله اذاح كه للركض وهمامر كلان قال عنترة
  وحشيتى سرج على عبل الشوى • نخدهراكله نبيل المحزم
  أى أنه واسع الجوف عظيم المراكل وأرض مركلة اذا كدت بحوافر الدواب ومنه قول
  امرئ القيس يصف الخيل * أثرن الغبار بالكديد المركل• وتركل الرجسل بمسحاته اذا
  ضر بها برجله لتدخل فى الارض قال الاخطل
  ربت وربافى كرمها ابن مدينة • يظلّ على مسمانه يتركل
  ول الرمل واحد الرمال والرملة أخص منه قال ابن السكيت يال للضبع أم رمال
  ور-لة مدينة بالشأم والرمل بالتحريك الهرولة ورملت بين الصفا والمروة رملاور ملانا والرمل
  جنس من العروض والرمل القليل من المطر والجمع أرمال والرمل أيضاخطوط تكون
  فى قوائم البقرة الوحشية تخالف سأئرلونها قال أبو عبيد الارمل من الشاء الذى اسودت
  قوائمه كاها والانى رملاء والارمل الرجل الذى لا امر أقله والارملة المرأة التى لا زوج لها
  وقد أرملت المرأة اذامات عنها زوجها قال الشاءر
  هذى الارامل قد قضيت حاجتها * فن لحاجة هذا الارمل الذكر
  قال ابن السكيت الارامل المساكيز.ن ربال ونساء قال ويقال لهم وان لم يكن فيهم نساء
  ويقال قدجاءت أرملة من نساء ورجال محتاجين قال ويقال للرجال المحتاجين الضعفاء
  أرملة وان لم يكن فيهم نساء ورمات الخصير أى سففته وأرملته مثله قال الشاعر
  اذلايزال على طريق لاحب * وكان صفعته حصير مرمل
  وقدرمل سريره وأرملهاذارمل شريطا أوغيره فجع-له ظهر اله ويقال أرمل القوم اذا نفد
  زادهم وعام أرمل أى قليل المطروسنة رملاء عن ابن السكيت ورّله بالدم فترمّل وارتمل أى
  تلطخ وقال
  انّ بنى "رماونى بالدم • شنشنة أعرفها من أخزم
  ⁦(رفعل)⁩. ارمعلّ الصبى ارمع لا لاسال لعابه وأرمغلّ الدمع أى تتابع قطرانه بالعيز
  والغين جمعا قال الرفيان
  يقول تورصبح لويفعل * والقطر عن متنيه مر مغل"
  كنظم اللولومر معل • تلفه :كبا" أوشمأل
  وارمعلّ الشواء أى سال دسمه وأنند أبو عرو
  وانصب اما الدهما طاهى وعجلن * لما بشواة هر معلّ ذووبها
  قال
