text: "القسم الثانى مقاصد المكلف المسألة الحادية عشره بهبة المال أو إتلافه أو جمع متفرقه أو تفريق مجتمعه. وهكذا سائر الأمثلة فى تحليل الحرام، واسقاط الواجب. ومثله جار فى تحريم الحلال ؛ كالزوجة ترضع. جارية الزوج أو الضرة لتحرم عليه. أواثبات …"
summary:
