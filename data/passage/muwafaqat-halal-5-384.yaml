text: "القسم الثانى مقاصد المكلف المسألة الحادية عشره بهبة المال أو إتلافه أو جمع متفرقه أو تفريق مجتمعه. وهكذا سائر الأمثلة فى تحليل الحرام، واسقاط الواجب. ومثله جار فى تحريم الحلال ؛ كالزوجة ترضع. جارية الزوج أو الضرة لتحرم عليه. أواثبات …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 5، ص 384، يذكر الحلال، والحرام، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 5, p. 384, that mentions the lawful, the unlawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 5، ص 384 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
