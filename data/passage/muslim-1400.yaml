label: { ar: "مسلم 1400 — يا معشر الشباب من استطاع منكم الباءة فليتزوج", en: "Muslim 1400 — Young men, whoever can afford marriage should marry" }
text: "قال رسول الله: «يا معشر الشباب، من استطاع منكم الباءة فليتزوج؛ فإنه أغض للبصر وأحصن للفرج، ومن لم يستطع فعليه بالصوم؛ فإنه له وجاء»"
summary:
  ar: "رواية عبد الله بن مسعود في كتاب النكاح من صحيح مسلم، يرويها علقمة لما عرض عثمان تزويج ابن مسعود جارية شابة؛ أصل الترغيب في المبادرة إلى الزواج."
