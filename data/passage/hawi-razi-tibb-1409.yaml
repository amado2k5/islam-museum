text: "… عليها أدوية تحبس الدم كالعفص السحيق أو الزاج ثم عالج الجرح بمرهم التوتيا، وإن كان غائراً داخل الرحم فإياك وقطعه فإنه يهلك المرأة، لكن عالجه بالمياه القابضة حتى يذبل ويموت. قال: دم البواسير يخرج بوجع، ودم الطمت إذا أسرف بلا …"
