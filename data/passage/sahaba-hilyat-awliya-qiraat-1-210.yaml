text: "… الذين أوتوا العلم حدثنا محمد بن على ثنا الحسين ابن محمد بن حماد ثنا عبد الوهاب الحوطى ثنا إسماعيل بن عياش ثنا ضمهم. ابن زرعة عن شريح بن عبيد أن رجلا قل لأبى الدرداء : يا معشر القراء ما بالكم …"
