text: "… الذين أوتوا العلم حدثنا محمد بن على ثنا الحسين ابن محمد بن حماد ثنا عبد الوهاب الحوطى ثنا إسماعيل بن عياش ثنا ضمهم. ابن زرعة عن شريح بن عبيد أن رجلا قل لأبى الدرداء : يا معشر القراء ما بالكم …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 210، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 210, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 210 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 1, pág. 210, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Hilyat al-Awliya' d'Abu Nu'aym (tome 1, p. 210) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 1. resimli cildinin 210. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 1, halaman 210, yang menyebutkan para qari; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
