  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3837, that mentions medicine and the physician, illness and the sick, treatment, recovery from an ailment, the organs of the body, the drug, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3837 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، علاج، بیماری سے شفایابی، اعضائے بدن، دوا، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
