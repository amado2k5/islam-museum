  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 3837, qui mentionne la médecine et le médecin, la maladie et le malade, le traitement, la guérison d'une affection, les organes du corps, le médicament, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 3837. sayfasından, tıp ve hekim, hastalık ve hasta, tedavi, hastalıktan iyileşme, vücut organları, ilaç ve hastalıktan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
