text: "… ويدخل أصحابها الحمام، ويأذن لهم في الغذاء والتصرف، ويعرف ويصيب في أكثر زمان الأمراض والبحارين ليمكنه الغذاء بحسبه، وأن يبرىء الطبيب بالأدوية ما يعالج بالحديد دليل على فضله، وكذلك إذا أبرأ الأدواء الغليظة كداء الفيل، والحجارة في الكلى والمثانة، والأورام …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3837، يذكر الطب والطبيب، والمرض والمريض، والعلاج، والبرء من العلة، وأعضاء البدن، والدواء، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
