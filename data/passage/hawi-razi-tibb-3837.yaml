  ur: "الحاوی فی الطب، رازی، ص 3837 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، علاج، بیماری سے شفایابی، اعضائے بدن، دوا، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
