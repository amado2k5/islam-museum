text: "… الصلت بن مغلس بن أخى جبارة بن مغلس حدثنا بشر بن الوليد القاذى حدثنا أبو يوسف القاضى يعقوب بن إراهيم عن أبى حنيفة قال مممت أنس بن مالك يقول سمعت النبى يقول طلب العلم فريضة على كل مسلم : لا …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 4، ص 115، يرد فيه ذكر الفريضة والفرائض، وما وجب على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 4, p. 115, whose wording mentions the obligation (farida), a duty laid on every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 4، ص 115 کا اقتباس جس میں فریضہ اور فرائض، جو ہر مسلمان پر لازم ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh Baghdad de al-Khatib al-Baghdadi, volume numérisé 4, p. 115, dont le texte mentionne l'obligation (farida), un devoir imposé à chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tarikh Baghdad de al-Khatib al-Baghdadi, volumen digitalizado 4, p. 115, cuyo texto menciona la obligación (farida), un deber impuesto a cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Hatib el-Bağdadi'nin *Bağdat Tarihi* adlı eserinin 4. cildinin 115. sayfasından bir alıntı, farz olan amelleri ve görevleri ve her Müslümandan beklenenleri sıralamaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Baghdad* karya Al-Khatib Al-Baghdadi, Jilid 4, halaman 115, menyebutkan amalan dan kewajiban wajib, serta apa yang dituntut dari setiap Muslim. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
