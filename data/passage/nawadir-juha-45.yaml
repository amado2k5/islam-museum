text: "… تفضل أيها البطل كان يوماً ماراً في مقبرة فرأى كَلْباً يبوِّلُ على أحد القبور، فأخذ عصاه وهجمَ عليهِ يُريدُ ضربَهُ فكَشَّرَ الكلبُ عن أنيابِهِ، وأخذ ينبحُ ويهجمُ على الشيخ، كأنه الذئب الكاسر. فخاف جحا وتقهقر إلى الوراء، وقال يخاطب الكلب: …"
summary:
  ar: "بال كلب على قبر، فرفع جحا عصاه وتراجع أمام الكلب الذي زمجر، وسماه بطلًا شجاعًا. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  en: "A dog urinates on a grave; Juha raises his stick, backs away from the snarling dog, and calls it a brave hero. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  ur: "ایک کتے نے قبر پر پیشاب کیا، تو جحا نے اپنی لاٹھی اٹھائی مگر غراتے ہوئے کتے کے سامنے پیچھے ہٹ گیا اور اسے بہادر ہیرو کہا۔ {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  fr: "Un chien urine sur une tombe ; Juha lève son bâton, recule devant le chien qui grogne et l'appelle un vaillant héros. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  es: "Un perro orina sobre una tumba; Juha alza su bastón, retrocede ante el perro que gruñe y lo llama valiente héroe. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
