text: "وقال يحرض بنى عبد مناة بن كنانة على نصرة قريش ومؤازرتهم على رسول نسبهم الى على لان أمهم تزوجت على بن مسعود بن ذئب فضم ولدها بكراً وعامراً ومرة بنى عبد مناف فنسبوا اليها وقال عبد اللّه بن مسلم بن …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 128، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 1, p. 128, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 128 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento del Tarikh Dimashq de Ibn 'Asakir, volumen 1, pág. 128, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tarikh Dimashq d'Ibn 'Asakir, volume 1, page 128, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 1, sayfa 128'den, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 1 Bergambar, halaman 128, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Peramban Bangsa, Agama, Sekte, dan Masyarakat Non-Muslim."
