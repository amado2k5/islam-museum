text: "… اليهود بعدة قضايا، فعاهدَهم أوَّل مقدمه المدينة، ثم حاربه بنُو قَيْنُقَاع، فظَفِرَ بهم، ومنَّ عليهم، ثم حاربه بنو النضير، فظفِرَ بهم، وأجلاهم، ثُمَّ حارَبه بنو قُريطة، فظفِرَ بهم وقتلهم، ثم حاربه أهلُ خيبر، فظَفِرَ بهم وأقرَّهم في أرض خيبرَ ما …"
