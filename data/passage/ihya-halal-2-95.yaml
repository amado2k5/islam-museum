text: "… : نمس المال، وغرض المعطى، وعرصه فى الأخذ. أما نفس المال. فيتبغى أن يكون حلالا خاليا عن الشبهات كلها. فإن كان فيه شبهة فليحترز من أخذه. وقد ذكرنا فى كتاب الحلال والحرام درجات الشبهة، وما يجب أجتنايه وما يستحب. وأما …"
