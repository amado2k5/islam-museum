text: "… محمد قال: تمخّط أبو هريرة وعليه ثوب من كتّان ممشَّق، فتمخط فيه، وقال: بخ, بخٍ، يتمخط أبو هريرة في الكتّان، لقد رأيتني أخِّر فيما بين منبر رسول اللّٰه وَلي وحجرة عائشة، يجيء الجائي يظنّ بي جنونا. شُعْبة، عن محمد بن …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 7، ص 351، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 7, p. 351, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 7، ص 351 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 7, pág. 351, que menciona una reliquia conservada tras su propietario, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 7, page 351 (numérisé), mentionnant une relique conservée après son propriétaire, une sépulture ou un lieu de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 7. cildinin 351. sayfasında, korunmuş bir kutsal emanet, bir mezar yeri, bir türbe ve bir mabetten bahsedilmektedir; bu metin, makineyle okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, kutsal emanetler ve mabetler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 7, halaman 351, menyebutkan sebuah relik yang terpelihara, sebuah situs pemakaman, sebuah kuburan, dan sebuah tempat suci; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, relik, dan tempat suci."
