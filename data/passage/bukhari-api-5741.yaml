label: { ar: "صحيح البخاري 5741 — الرقية", en: "Sahih al-Bukhari 5741 — ruqya recited over the sick", ur: "صحیح بخاری 5741 — رقیہ", es: "Sahih al-Bukhari 5741 - ruqya recitada sobre los enfermos", fr: "Sahih al-Bukhari 5741 – ruqya récitée sur les malades", tr: "Sahih el-Buhari 5741 — Ruqyah", id: "Sahih al-Bukhari 5741 — Ruqyah" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا سُلَيْمَانُ الشَّيْبَانِيُّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ الأَسْوَدِ، عَنْ أَبِيهِ، قَالَ سَأَلْتُ عَائِشَةَ عَنِ الرُّقْيَةِ، مِنَ الْحُمَةِ فَقَالَتْ رَخَّصَ النَّبِيُّ الرُّقْيَةَ مِنْ كُلِّ ذِي حُمَةٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5741، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5741 (Medicine), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5741، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5741 (Medicina), menciona la ruqya recitada sobre los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5741 (Médecine), mentionne la récitation de la roqya sur les malades. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5741 numaralı hadis, rukyeden (Kur'an ayetleri ve dualarla yapılan İslami şifa) bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5741, menyebutkan ruqyah (penyembuhan Islami melalui ayat-ayat Al-Quran dan doa). Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
