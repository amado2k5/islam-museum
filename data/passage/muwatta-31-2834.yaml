label: { ar: "الموطأ 2834 — أبو هريرة: من شر الناس ذو الوجهين", en: "Muwatta 2834", es: "Muwatta 2834", fr: "Muwatta 2834", ur: "موطا 2834", tr: "El-Muvatta 2834 — Ebu Hurayra: İnsanların en kötüsü iki yüzlü olandır.", id: "Al-Muwatta 2834 — Abu Hurairah: Orang yang paling buruk adalah orang yang bermuka dua" }
summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن رسول الله قال: من شر الناس ذو الوجهين، الذي يأتي هؤلاء بوجه وهؤلاء بوجه. {cite:muwatta-maruf-1997 p.590}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakleder: \"İnsanların en kötüsü, iki yüzlü olandır; bir yüzüyle bu insanlara, diğer yüzüyle de diğer insanlara gelir.\" {cite:muwatta-maruf-1997 s.590}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah bahwa Rasulullah SAW bersabda: \"Orang yang paling buruk adalah orang yang bermuka dua, yang datang kepada kaum ini dengan satu wajah dan kepada kaum itu dengan wajah yang lain.\" {cite:muwatta-maruf-1997 p.590}"
