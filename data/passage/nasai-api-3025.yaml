label: { ar: "سنن النسائي 3025 — ما لا يحل", en: "Sunan al-Nasa'i 3025 — what is not lawful", ur: "سنن نسائی 3025 — جو حلال نہیں" }
text: "أَخْبَرَنَا مَحْمُودُ بْنُ غَيْلاَنَ، قَالَ حَدَّثَنَا وَكِيعٌ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ إِبْرَاهِيمَ بْنِ عُقْبَةَ، عَنْ كُرَيْبٍ، عَنْ أُسَامَةَ بْنِ زَيْدٍ، أَنَّ رَسُولَ اللَّهِ نَزَلَ الشِّعْبَ الَّذِي يَنْزِلُهُ الأُمَرَاءُ فَبَالَ ثُمَّ تَوَضَّأَ وُضُوءًا خَفِيفًا فَقُلْتُ يَا رَسُولَ اللَّهِ الصَّلاَةَ. قَالَ \" الصَّلاَةُ أَمَامَكَ \". فَلَمَّا أَتَيْنَا الْمُزْدَلِفَةَ لَمْ يَحُلَّ آخِرُ النَّاسِ حَتَّى صَلَّى."
summary:
  ar: "حديث في سنن النسائي، رقم 3025، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3025 (The Book of Hajj), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3025، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
