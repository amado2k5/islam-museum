text: |-
  ٤٢
  * ⁦(باب الفاء)⁩*
  *⁦(طرق)⁩*
  واضافة الاسم الى الاسم كقولك غلام زيد فالغلام مضاف وزيدمضاف اليه والغرض
  بالاضافة التخصص والتعريف فلهذ الايجوز أن يضاف الشئ الى :فسه لانه لا يعرّف نفسه
  فلوعزفها لما احتيج الى الاضافة
  صل الطا ) ( رف الطخاف السجاب القيق والطخف شى من الهم يغشى
  القلب وطخفة بالكسر موضع قال الشاعر
  خدارية صقعا ألصوريشها ، بطخفة يوم ذوأهاضيب ماطر
  ومنه يوم طغفة لبى يربوع على قابوس بن المنذربن ماء السماء وضرب طلخف بزيادة اللام
  مثال حيجر أى شديد ⁦(طرف)⁩ الطرف العيز ولا يجمع لانه فى الاصل مصدرة يكون واحدا
  ويكون جماعة وقال تعالى لا يرتدالبهم طرفهم والطرف أيضا كوكبان يقدمان الجبهة وهما
  عينا الاسدينزاه ما القمر قال الاصعىّ الطرف بالكسر الكريم من انخيل يقال قرس طرف
  من خيل طروف وقال أبوزيد هو نعت للذكورناصة والطرف أيضا السكريم من الفتيان
  والطرف بالتحريك الناحصة من النواحى والطائفسة من الشئ وفلان كريم الطرفين برادبه
  نسب أبيه ونسب أمّه وأطرافه أبواه واخونه وأعمامه وكل قربب له محرم وأنشد أبوزيد
  وكيف بأطرافى اذا ماشتمتنى * وما بعدشتم الوالدين صلوح
  وقال ابن الاء رابى قولهم لايدرى أى طرفيه أطول طرفاه ذكره ولسانه وحكى ابن السكيت
  عن أبى عبيدة يقال لايملك طرفيه يعى فه واسته اذاشرب الدواء أوسكر والطرف أيضا
  مصدرقولك طرفت الناقة بالمكسر اذاتطزفت أى رعت أطراف المراعى ولم تختلط بالتوق
  يقال ناقة طرفة لا تنبت على مرعى واحد ورجل طرف لا يثبت على امرأة ولاءسلى صاحب
  والطرف أيضانقيض القعدد قال الاصعى" المطراف الناقة التى لاترعى مرعى حتى تستطرف
  غيره والحارفاء شجر الواحدة طرقة وبها سمى طرفة بن العبد وقال سيبويه الطارفاء واحد
  وجيع وامرأ: مطروفسة بالرجال اذاطحت عينها اليهم وصرقت بصرها عن بعلها الى سواه
  ومنه قول الحطمئة
  وما كنت مثل الهااكىّ وعرسه • بغى الودّمن مطروفة الوتطامح
  وقال أبو عمروفلان مطروف العين بفلان اذا كان لاستظر الا المه والمطرف والمطرف واحد
  المطارف وهى أردية من خزمربعبة لها أعلام قال الفراء وأصله الضم لانه فى المعى مأخوذ
  من أطرف أى جعل فى طرفيه العلمان ولكنهم استثقلوا الضعة فكسروه وأطرفت الشئأى
  اشتريته حديثا وهو افتعلت بقال بعير مطرف قال ذوالرقة
  كأنى من هوى خرقاء مطرف • دامى الاظل بعيد الشأومهيوم
  واستطرفه أى عتمطر بفا واستطرفت الشىء استحدثته وقواهم ذعات ذلث فى مستطرف
  الايام ومطرف الايام أى في م--تأنف الايام والطارف والطريف من المال المستحدث ؤهو
  خلاف التالد والتلسد والاسم الطرفة وقدط-رف بالضم والمرف فلان اذا جاه بطرفة
  والطر يق فى النسب الكثيرالا با الى الجدّالاكبروه وخلاف القعدد وقد طرف بالضم
  طرافة وقديدح به قال تعلب الاطراف الاشراف والطريفة النصىّ اذا ابيض وقد أطرف
