label: { ar: "سنن ابن ماجه 2562 — الأب والأبوة", en: "Sunan Ibn Majah 2562 — the father and fatherhood", ur: "سنن ابن ماجہ 2562 — باپ اور والدیت", es: "Sunan Ibn Majah 2562 — El padre y la paternidad", fr: "Sunan Ibn Majah 2562 — Le père et la paternité" }
text: "حَدَّثَنَا يُونُسُ بْنُ عَبْدِ الأَعْلَى، أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ نَافِعٍ، أَخْبَرَنِي عَاصِمُ بْنُ عُمَرَ، عَنْ سُهَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ فِي الَّذِي يَعْمَلُ عَمَلَ قَوْمِ لُوطٍ قَالَ \" ارْجُمُوا الأَعْلَى وَالأَسْفَلَ ارْجُمُوهُمَا جَمِيعًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2562، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2562 (The Chapters on Legal Punishments), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2562، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2562 (Capítulos sobre castigos legales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2562 (Chapitres relatifs aux peines légales), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
