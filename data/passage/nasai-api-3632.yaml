label: { ar: "سنن النسائي 3632 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan al-Nasa'i 3632 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن نسائی 3632 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Sunan al-Nasa'i 3632 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia", fr: "Sunan al-Nasa'i 3632 — testament ou conseils d'adieu; ce qui a été laissé: biens et héritage", tr: "Sunan an-Nasa'i 3632 — Vasiyetname veya son anlaşma, miras ve vasiyet olarak geride bıraktığı şey.", id: "Sunan an-Nasa'i 3632 — Wasiat atau perjanjian terakhir, apa yang ditinggalkannya berupa warisan dan harta pusaka" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ حَدَّثَنَا وَكِيعٌ، قَالَ حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ سَعْدٍ، أَنَّ النَّبِيَّ عَادَهُ فِي مَرَضِهِ فَقَالَ يَا رَسُولَ اللَّهِ أُوصِي بِمَالِي كُلِّهِ قَالَ \" لاَ \". قَالَ فَالشَّطْرَ قَالَ \" لاَ \". قَالَ فَالثُّلُثَ قَالَ \" الثُّلُثَ وَالثُّلُثُ كَثِيرٌ أَوْ كَبِيرٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3632، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3632 (The Book of Wills), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 3632، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3632 (El Libro de los Testamentos), menciona un testamento o consejo de despedida, y lo que se dejó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3632 (Le Livre des Testaments), mentionne un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Le Navigateur de Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sunan-ı Nesai'de yer alan 3632 numaralı hadis, bir vasiyet veya son anlaşmadan ve miras olarak geride bıraktıklarından bahsetmektedir. Bu, vasiyetler, miraslar, kutsal emanetler ve türbeler üzerine çalışan araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3632, menyebutkan tentang wasiat atau perjanjian terakhir, dan apa yang ditinggalkannya dalam hal warisan dan harta pusaka. Ini disusun oleh para peneliti wasiat, warisan, relik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
