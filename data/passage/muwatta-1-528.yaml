label: { ar: "الموطأ 528 — ما بين بيتي ومنبري روضة من رياض الجنة، ومنبري على حوضي", en: "Muwatta 528", es: "Muwatta 528", fr: "Muwatta 528", ur: "موطا 528", tr: "Al-Muwatta 528 — Benim evim ile minberim arasında cennet bahçelerinden bir bahçe vardır ve minberim leğenimin üzerindedir.", id: "Al-Muwatta 528 — Di antara rumahku dan mimbarku terdapat taman dari taman-taman surga, dan mimbarku berada di atas bejana" }
text: "ما بين بيتي ومنبري روضة من رياض الجنة، ومنبري على حوضي"
summary:
  ar: "يرويه مالك عن خبيب بن عبد الرحمن عن حفص بن عاصم، عن أبي هريرة أو عن أبي سعيد الخدري على الشك، أن النبي قال إن ما بين بيته ومنبره روضة من رياض الجنة، وإن منبره على حوضه. ويذكر المحقق نقلاً عن ابن عبد البر ⁦(التمهيد 2/285)⁩ أن أكثر رواة الموطأ رووه على الشك، وأن روح بن القاسم ومعناً روياه عن الصحابيين جمعاً، وأن ابن مهدي رواه من حديث أبي هريرة وحده عند البخاري (7335). {cite:muwatta-maruf-1997 p.272} {cite:muwatta-maruf-1997 p.273}"
  tr: "Malik, Hubeyb ibn Abdülrahman'dan, o da Hafs ibn Asim'den, o da Ebu Hurayra veya Ebu Sa'id el-Hudri'den (şüphe vardır) rivayet ederek, Peygamber'in şöyle buyurduğunu nakletmiştir: \"Evinin ve minberinin arasında cennet bahçelerinden bir bahçe vardır ve minberi Havd'ının üzerindedir.\" Editör, İbn Abdülberr'den (el-Temhid 2/285) alıntı yaparak, Muvatta'nın ravilerinin çoğunun bunu şüpheyle rivayet ettiğini, Ravh ibn el-Kâsım ve Ma'n'ın ise bunu her iki Sahabeden birlikte rivayet ettiğini ve İbn Mehdi'nin ise bunu sadece Ebu Hurayra'nın hadisinden Buhari'de (7335) naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.272} {cite:muwatta-maruf-1997 s.273}"
  id: "Malik meriwayatkannya dari Khubayb ibn Abd al-Rahman, dari Hafs ibn Asim, dari Abu Hurayrah atau Abu Sa'id al-Khudri (ada keraguan), bahwa Nabi bersabda, \"Apa yang ada di antara rumahnya dan mimbarnya adalah taman dari taman-taman Surga, dan mimbarnya berada di atas Bejana (al-Hawd).\" Editor menyebutkan, mengutip Ibn Abd al-Barr (al-Tamhid 2/285), bahwa sebagian besar perawi al-Muwatta' meriwayatkannya dengan keraguan, dan bahwa Rawh ibn al-Qasim dan Ma'n meriwayatkannya dari kedua Sahabat bersama-sama, dan bahwa Ibn Mahdi meriwayatkannya dari hadits Abu Hurayrah saja dalam al-Bukhari (7335). {kutip:muwatta-maruf-1997 hal.272} {kutip:muwatta-maruf-1997 hal.273}"
