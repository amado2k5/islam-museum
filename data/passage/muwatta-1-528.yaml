label: { ar: "الموطأ 528 — ما بين بيتي ومنبري روضة من رياض الجنة، ومنبري على حوضي", en: "Muwatta 528" }
text: "ما بين بيتي ومنبري روضة من رياض الجنة، ومنبري على حوضي"
summary:
  ar: "يرويه مالك عن خبيب بن عبد الرحمن عن حفص بن عاصم، عن أبي هريرة أو عن أبي سعيد الخدري على الشك، أن النبي قال إن ما بين بيته ومنبره روضة من رياض الجنة، وإن منبره على حوضه. ويذكر المحقق نقلاً عن ابن عبد البر (التمهيد 2/285) أن أكثر رواة الموطأ رووه على الشك، وأن روح بن القاسم ومعناً روياه عن الصحابيين جمعاً، وأن ابن مهدي رواه من حديث أبي هريرة وحده عند البخاري (7335). {cite:muwatta-maruf-1997 p.272} {cite:muwatta-maruf-1997 p.273}"
