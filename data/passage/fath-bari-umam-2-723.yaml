text: "… بعدَهُ -وذكرَ وقالَ: - لتُنفقَنَّ كنوزُهما في سبيلِ اللهِ. الحديث الأربعون حديث أبى هريرة إذا هلك كسرى فلا كسرى بعده. قوله كسرى بكسر الكاف ويجوز الفتح، وهو لقب لكل من ولى مملكة الفرس، وقيصر لقب لكل من ولى مملكة الروم، …"
summary:
