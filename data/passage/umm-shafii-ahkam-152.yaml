text: "… الله، وجلال الله، وقدرة الله، يريد بهذا كله اليمين، أو لا نية له فهى يمين. وإن لم يرد بها اليمين فليست بيمين ؛ لأنه يحتمل أن تكون : وحق الله واجب على كل مسلم وقدرة الله ماضية عليه، لا أنه …"
summary:
  ar: "مقطع من الأم للشافعي، ص 152، يرد فيه ذكر ما وجب على كل مسلم، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Umm, p. 152, whose wording mentions a duty laid on every Muslim, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الام، شافعی، ص 152 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Umm de al-Shafi'i, p. 152, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Umm de al-Shafi'i, p. 152, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin El-Umm adlı eserinin 152. sayfasından, her Müslüman için farz olan şeylerden bahseden bir bölüm. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar hakkında bir bölüm içermektedir."
  id: "Kutipan dari kitab Al-Umm karya Al-Shafi'i, halaman 152, yang menyebutkan apa yang wajib dilakukan oleh setiap Muslim. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini mencakup bagian tentang kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
