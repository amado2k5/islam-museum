label: { ar: "جامع الترمذي 2145 — الإيمان بالقدر، ما لا يتم الإيمان إلا به", en: "Jami' al-Tirmidhi 2145 — belief in the decree; what faith is not complete without", ur: "جامع ترمذی 2145 — تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں", es: "Jami' al-Tirmidhi 2145 — creencia en el decreto; lo que la fe no está completa sin", fr: "Jami' al-Tirmidhi 2145 — la croyance au décret; la foi n'est pas complète sans" }
text: "… شُعْبَةُ، عَنْ مَنْصُورٍ، عَنْ رِبْعِيِّ بْنِ حِرَاشٍ، عَنْ عَلِيٍّ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يُؤْمِنُ عَبْدٌ حَتَّى يُؤْمِنَ بِأَرْبَعٍ يَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنِّي مُحَمَّدٌ رَسُولُ اللَّهِ بَعَثَنِي بِالْحَقِّ وَيُؤْمِنُ بِالْمَوْتِ وَبِالْبَعْثِ بَعْدَ الْمَوْتِ وَيُؤْمِنُ بِالْقَدَرِ \". حَدَّثَنَا مَحْمُودُ بْنُ غَيْلاَنَ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، عَنْ شُعْبَةَ، نَحْوَهُ إِلاَّ أَنَّهُ قَالَ رِبْعِيٌّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2145، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به، والإيمان بالبعث. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2145 (Chapters On Al-Qadar), that mentions belief in the decree, what faith is not complete without, belief in the resurrection. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2145، جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2145 (Capítulos sobre Al-Qadar), menciona la creencia en el decreto divino, esencial para una fe plena, y la creencia en la resurrección. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2145 (Chapitres sur Al-Qadar), mentionne la croyance au décret divin, élément essentiel de toute foi, et la croyance en la résurrection. Le guide « Piliers et branches de la foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
