  tr: "Al-Kandahlawi'nin \"Hayat al-Sahaba\" (Sahabelerin Hayatları) adlı eserinin 4. cildinin 399. sayfasından bir alıntı, okuyuculardan bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Hayat al-Sahaba\" (Kehidupan Para Sahabat) karya Al-Kandahlawi, Jilid 4, halaman 399, menyebutkan para pembaca Al-Quran; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
