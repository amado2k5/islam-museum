text: "… قال : لما كان زمن اخرج ابن زياد وثب مروان بالشام حيث وثب، ووثب ابن الزبيرما بمكه، ووثب الذين كانوا يدعون القراء بالبصرة. قال : غم ابى غما شديدا ! فقال: انطلق لا ابالك الى هذا الرجل من اصحاب رسول …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 4، ص 399، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 4, p. 399, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 4، ص 399 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 4, pág. 399, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
