text: "اسجزء الثالث عشر ٣٧- حدثنا عبد الله، قال: وجدت في كتاب أبي بخط يده، ثنا مهدي، ثنا ضمرة، عن ابن شوذب، قال: قلت: وهذا سند مظلم؛ لجهالة معان (١) - هذا-، والرجل من بني تميم. وأخرجه ابن أبي الدنيا في"
