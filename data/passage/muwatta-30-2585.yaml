label: { ar: "الموطأ 2585 — مالك: القسامة في قتل الخطأ ويحلف الورثة خمسين يمينا على قسم مواريثهم", en: "Muwatta 2585" }
summary:
  ar: "قال يحيى: قال مالك: القسامة في قتل الخطأ، يُقسم الذين يدعون الدم ويستحقونه بقسامتهم، يحلفون خمسين يمينا تكون على قسم مواريثهم من الدية. فإن كان في الأيمان كسور إذا قُسمت بينهم، نُظر إلى الذي يكون عليه أكثر تلك الأيمان، فتُجبر عليه تلك اليمين. قال مالك: فإن لم يكن للمقتول ورثة إلا النساء، فإنهن يحلفن ويأخذن الدية. فإن لم يكن له وارث إلا رجل واحد، حلف خمسين يمينا وأخذ الدية. وإنما يكون ذلك في قتل الخطأ ولا يكون في قتل العمد. {cite:muwatta-maruf-1997 p.457}"
