label: { ar: "الموطأ 2585 — مالك: القسامة في قتل الخطأ ويحلف الورثة خمسين يمينا على قسم مواريثهم", en: "Muwatta 2585", es: "Muwatta 2585", fr: "Muwatta 2585", ur: "موطا 2585", tr: "Al-Muwatta 2585 — Malik: Kasıtsız öldürme durumunda arınma yemini ve mirasçıların miraslarının paylaşımı konusunda elli yemin etmeleri.", id: "Al-Muwatta 2585 — Malik: Sumpah penyucian dalam pembunuhan yang tidak disengaja, dan para ahli waris mengucapkan lima puluh sumpah mengenai pembagian warisan mereka" }
summary:
  ar: "قال يحيى: قال مالك: القسامة في قتل الخطأ، يُقسم الذين يدعون الدم ويستحقونه بقسامتهم، يحلفون خمسين يمينا تكون على قسم مواريثهم من الدية. فإن كان في الأيمان كسور إذا قُسمت بينهم، نُظر إلى الذي يكون عليه أكثر تلك الأيمان، فتُجبر عليه تلك اليمين. قال مالك: فإن لم يكن للمقتول ورثة إلا النساء، فإنهن يحلفن ويأخذن الدية. فإن لم يكن له وارث إلا رجل واحد، حلف خمسين يمينا وأخذ الدية. وإنما يكون ذلك في قتل الخطأ ولا يكون في قتل العمد. {cite:muwatta-maruf-1997 p.457}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Kasıtsız öldürme durumlarında, kan parası talep eden ve buna hak kazananlar elli yemin ederler; bu yeminler, mirasçıları arasında kan parasındaki paylarına göre paylaştırılır. Yeminler arasında paylaştırıldığında kesirli sayılar varsa, daha büyük olan yemin dikkate alınır ve ona göre dağıtım yapılır. Malik şöyle dedi: Ölenin kadınlar dışında mirasçısı yoksa, kadınlar yemin eder ve kan parasını alırlar. Ölenin bir erkek dışında mirasçısı yoksa, erkek elli yemin eder ve kan parasını alır. Bu sadece kasıtsız öldürmeler için geçerlidir, kasıtlı öldürmeler için geçerli değildir. {cite:muwatta-maruf-1997 s.457}"
  id: "Yahya berkata: Malik berkata: Dalam kasus pembunuhan yang tidak disengaja, mereka yang menuntut uang darah dan berhak atasnya mengucapkan lima puluh sumpah, yang dibagi di antara ahli waris mereka sesuai dengan bagian mereka dari uang darah tersebut. Jika terdapat pecahan sumpah ketika dibagi di antara mereka, sumpah yang memiliki jumlah lebih besar akan dipertimbangkan, dan sumpah itu kemudian dibagikan sesuai dengan itu. Malik berkata: Jika almarhum tidak memiliki ahli waris kecuali perempuan, mereka mengucapkan sumpah dan menerima uang darah. Jika ia tidak memiliki ahli waris kecuali seorang laki-laki, ia mengucapkan lima puluh sumpah dan menerima uang darah. Ini hanya berlaku untuk pembunuhan yang tidak disengaja dan bukan untuk pembunuhan yang disengaja. {cite:muwatta-maruf-1997 p.457}"
