label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ٢، المقطع ٨ من ٨", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 2, section 8 of 8", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 2، حصہ 8" }
text: "المسلمين كتابا بذلك وأظهر الشماتة بما نزل بالبصرة وبالكوفة وبمكة وبغيرها من وقائع القرامطة بالمسلمين وإذلالهم الإسلام. وقد أجاب عن هذا الكتاب أحمد بن يحيى بن المنجم نديم السلطان، وأجاب عنه عيسى بن داود بن الجراح وزير السلطان. …"
summary:
  ar: "مقطع من الباب ٢ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 2 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 2 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
