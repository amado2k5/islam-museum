label: { ar: "الموطأ 2316 — مالك: لا بأس أن يشتري المكاتب كتابته بعين أو عرض", en: "Muwatta 2316", es: "Muwatta 2316", fr: "Muwatta 2316", ur: "موطا 2316", tr: "El-Muvatta 2316 — Malik: Bir kâtibin kitabın nüshasını nakit veya mal karşılığında satın almasında bir sakınca yoktur.", id: "Al-Muwatta 2316 — Malik: Tidak ada salahnya jika seorang juru tulis membeli salinan kitabnya dengan uang tunai atau barang." }
summary:
  ar: "قال مالك: لا بأس بأن يشتري المكاتب كتابته بعين أو عرض مخالف لما كوتب به أو غير مخالف، معجلا أو مؤجلا. {cite:muwatta-maruf-1997 p.356}"
  tr: "Malik şöyle dedi: Bir kâtibin yazılı eserini nakit veya yazılanlardan farklı mallarla, aynı veya farklı şartlarla, ister hemen ister daha sonra ödenmiş olsun, geri almasında hiçbir sakınca yoktur. {cite:muwatta-maruf-1997 s.356}"
  id: "Malik berkata: Tidak ada yang salah dengan seorang juru tulis yang membeli kembali karyanya yang telah ditulis dengan uang tunai atau barang yang berbeda dari apa yang ditulis, atau dengan syarat yang sama atau berbeda, baik dibayar segera atau kemudian. {cite:muwatta-maruf-1997 p.356}"
