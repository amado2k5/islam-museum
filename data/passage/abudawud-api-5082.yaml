label: { ar: "سنن أبي داود 5082 — الأب والأبوة", en: "Sunan Abi Dawud 5082 — the father and fatherhood", ur: "سنن ابی داؤد 5082 — باپ اور والدیت" }
text: "… فُدَيْكٍ، قَالَ أَخْبَرَنِي ابْنُ أَبِي ذِئْبٍ، عَنْ أَبِي أَسِيدٍ الْبَرَّادِ، عَنْ مُعَاذِ بْنِ عَبْدِ اللَّهِ بْنِ خُبَيْبٍ، عَنْ أَبِيهِ، أَنَّهُ قَالَ خَرَجْنَا فِي لَيْلَةِ مَطَرٍ وَظُلْمَةٍ شَدِيدَةٍ نَطْلُبُ رَسُولَ اللَّهِ لِيُصَلِّيَ لَنَا فَأَدْرَكْنَاهُ فَقَالَ \" أَصَلَّيْتُمْ \". فَلَمْ أَقُلْ شَيْئًا فَقَالَ \" قُلْ \". فَلَمْ أَقُلْ شَيْئًا ثُمَّ قَالَ \" قُلْ \". فَلَمْ أَقُلْ شَيْئًا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5082، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5082 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5082، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
