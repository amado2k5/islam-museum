text: "… اللَّه، لا سيما في أحد الأيام المذكورة في الحديث، وهي الأيام التي يقع فيها بُحران الأمراض الحادة كثيراً، سيما في البلاد المذكورة لرقة أخلاط سكانها، وسُرعة انفعالهم عن الدواء النافع. فصل في هديه في علاج استطلاق البطن علاجه بالعسل في …"
