text: "… أوقد على ذلك الغصن حتى ذاب، فكان أول شيء ضرب منه مدية فكان يعمل بها، ثم ضرب التنور وهو الذي ورثه نوح، وهو الذي فار بالهند بالعذاب، فلما حج آدم وضع الحجر الأسود على أبي قبيس فكان يضي لأهل مكة …"
