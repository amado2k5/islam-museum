label: { ar: "سنن أبي داود 1114 — الأب والأبوة", en: "Sunan Abi Dawud 1114 — the father and fatherhood", ur: "سنن ابی داؤد 1114 — باپ اور والدیت", es: "Sunan Abi Dawud 1114 — El padre y la paternidad", fr: "Sunan Abi Dawud 1114 — Le père et la paternité", tr: "Sunan Abi Davud 1114 — Baba ve Babalık", id: "Sunan Abi Dawud 1114 — Sang Ayah dan Peran Ayah" }
text: "… إِبْرَاهِيمُ بْنُ الْحَسَنِ الْمِصِّيصِيُّ، حَدَّثَنَا حَجَّاجٌ، حَدَّثَنَا ابْنُ جُرَيْجٍ، أَخْبَرَنِي هِشَامُ بْنُ عُرْوَةَ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، قَالَتْ قَالَ النَّبِيُّ \" إِذَا أَحْدَثَ أَحَدُكُمْ فِي صَلاَتِهِ فَلْيَأْخُذْ بِأَنْفِهِ ثُمَّ لْيَنْصَرِفْ \". قَالَ أَبُو دَاوُدَ رَوَاهُ حَمَّادُ بْنُ سَلَمَةَ وَأَبُو أُسَامَةَ عَنْ هِشَامٍ عَنْ أَبِيهِ عَنِ النَّبِيِّ \" إِذَا دَخَلَ وَالإِمَامُ يَخْطُبُ \". لَمْ يَذْكُرَا عَائِشَةَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 1114، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1114 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1114، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1114 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1114 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1114 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1114, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
