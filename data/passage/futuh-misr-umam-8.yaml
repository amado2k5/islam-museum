text: "… أن تفرق بين رئيسى المذهبين في مقامهما، حتى لا يبقى المتنافسان فى بلد واحد، فازدادت الشدائد بالقبط، وتوالت عليهم المصائب، وما كان هناك أمل فى أن يعود السلام والوفاق بين الطائفتين المتنازعتين أبداً، فاشتدت عداوة القبط للرومان واسلطان الدوله الرومانية، …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 8، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 8, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 8 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
