text: "… وصار كالراكب على الدابة صلى وهي تسير؛ أنه يسقط القيام؛ لتعذّر القيام عليها غالباً ؛ كذا هذا. والحديث محمول على الندب دون الوجوب، فإن صلوا في السفينة بجماعةٍ جازت صلاتهم، ولو اقتدى به رجل في سفينة أخرى: فإن كانت السفينتان …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 515، يرد فيه ذكر الوجوب، والمندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
