  tr: "El-Kasani'nin Bada'i' al-Sana'i' adlı eserinin 515. sayfasından, farz, tavsiye edilen ve müstehap olan amellerden bahseden bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz, tavsiye edilen ve farz olan ameller, itaat amelleri, müstehap olan ameller, mekruh olan ameller, yasak olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Bada'i' al-Sana'i' karya al-Kasani, halaman 515, yang menyebutkan amalan wajib, anjuran, dan yang diinginkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, anjuran, dan yang diwajibkan, amalan ketaatan, amalan yang diinginkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
