text: "… إلى مكة، وتزوّج الصَّهباء بنتَ حرب. وقيل إنه لما تعلم أبو سفيان بنُ حرب الحطَّ من أبيه تعلمه عمر بنُ الخطاب وجماعة من قريش، وتعلمه معاويةُ بنُ أبى سفيان من عمه سُفْيانَ. فى الضوء من كاتب الوحى •"
summary:
