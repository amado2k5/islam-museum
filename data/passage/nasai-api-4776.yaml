label: { ar: "سنن النسائي 4776 — الأب والأبوة", en: "Sunan al-Nasa'i 4776 — the father and fatherhood", ur: "سنن نسائی 4776 — باپ اور والدیت", es: "Sunan al-Nasa'i 4776 — El padre y la paternidad" }
text: "أَخْبَرَنِي مُحَمَّدُ بْنُ عَلِيِّ بْنِ مَيْمُونٍ، قَالَ حَدَّثَنِي الْقَعْنَبِيُّ، قَالَ حَدَّثَنِي مُحَمَّدُ بْنُ هِلاَلٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ كُنَّا نَقْعُدُ مَعَ رَسُولِ اللَّهِ فِي الْمَسْجِدِ فَإِذَا قَامَ قُمْنَا فَقَامَ يَوْمًا وَقُمْنَا مَعَهُ حَتَّى لَمَّا بَلَغَ وَسَطَ الْمَسْجِدِ أَدْرَكَهُ رَجُلٌ فَجَبَذَ بِرِدَائِهِ مِنْ وَرَائِهِ - وَكَانَ رِدَاؤُهُ خَشِنًا - فَحَمَّرَ رَقَبَتَهُ فَقَالَ يَا مُحَمَّدُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4776، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4776 (The Book of Oaths (qasamah), Retaliation and Blood Money), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4776، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4776 (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Sangre), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
