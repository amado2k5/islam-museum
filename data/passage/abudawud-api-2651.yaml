text: "انْطَلَقَ حَاطِبٌ فَكَتَبَ إِلَى أَهْلِ مَكَّةَ أَنَّ مُحَمَّدًا صلى الله عليه وسلم قَدْ سَارَ إِلَيْكُمْ وَقَالَ فِيهِ قَالَتْ مَا مَعِي كِتَابٌ ‏.‏ فَانْتَحَيْنَاهَا فَمَا وَجَدْنَا مَعَهَا كِتَابًا فَقَالَ عَلِيٌّ وَالَّذِي يُحْلَفُ بِهِ لأَقْتُلَنَّكِ أَوْ لَتُخْرِجِنَّ الْكِتَابَ ‏.‏ وَسَاقَ الْحَدِيثَ ‏.‏"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
