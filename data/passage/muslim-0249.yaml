label: { ar: "مسلم 249 — أنتم أصحابي وإخواننا الذين لم يأتوا بعد", en: "Muslim 249 — You are my Companions; my brothers are those yet to come" }
text: "قال رسول الله في المقبرة: «وددت أنا قد رأينا إخواننا»، قالوا: أولسنا إخوانك يا رسول الله؟ قال: «أنتم أصحابي، وإخواننا الذين لم يأتوا بعد»"
summary:
  ar: "رواية أبي هريرة في باب الحوض من كتاب الطهارة في صحيح مسلم؛ يفرّق النبي بين الصحابة الذين رأوه والإخوان المؤمنين الذين لم يأتوا، ويعرفهم عند الحوض بالغر والتحجيل."
