label: { ar: "مسلم 249 — أنتم أصحابي وإخواننا الذين لم يأتوا بعد", en: "Muslim 249 — You are my Companions; my brothers are those yet to come", es: "Musulmán 249 — Vosotros sois mis Compañeros; mis hermanos son los que aún están por venir.", fr: "Muslim 249 — Vous êtes mes Compagnons; mes frères sont ceux qui doivent venir", ur: "مسلم 249 - تم میرے ساتھی ہو۔ میرے بھائی وہ ہیں جو ابھی آنا باقی ہیں۔", tr: "Müslim 249 — Sizler benim henüz gelmemiş olan arkadaşlarım ve kardeşlerimsiniz.", id: "Muslim 249 — Kalian adalah sahabat dan saudara-saudaraku yang belum datang" }
text: "قال رسول الله في المقبرة: «وددت أنا قد رأينا إخواننا»، قالوا: أولسنا إخوانك يا رسول الله؟ قال: «أنتم أصحابي، وإخواننا الذين لم يأتوا بعد»"
summary:
  ar: "رواية أبي هريرة في باب الحوض من كتاب الطهارة في صحيح مسلم؛ يفرّق النبي بين الصحابة الذين رأوه والإخوان المؤمنين الذين لم يأتوا، ويعرفهم عند الحوض بالغر والتحجيل."
  tr: "Sahih Müslim'deki Temizlik Kitabı'nın Havza bölümünde Ebu Hurayra'nın rivayetine göre; Peygamberimiz, kendisini gören Sahabeler ile gelmeyen mümin kardeşleri birbirinden ayırır ve onları Havza'da alınlarındaki ve uzuvlarındaki beyaz işaretlerden tanır."
  id: "Riwayat Abu Hurairah dalam surah tentang Telaga dari Kitab Penyucian dalam Sahih Muslim; Nabi membedakan antara para Sahabat yang melihatnya dan saudara-saudara mukmin yang tidak datang, dan mengenali mereka di Telaga berdasarkan tanda putih di dahi dan anggota tubuh mereka."
