label: { ar: "الموطأ 860 — أبو هريرة: الصيام جُنّة؛ فإذا كان أحدكم صائماً فلا يرفث ولا يجهل، فإن امرؤ قاتله أو شاتمه فليقل: إني صائم، إني صائم", en: "Muwatta 860" }
text: "الصيام جُنّة؛ فإذا كان أحدكم صائماً فلا يرفث ولا يجهل. فإن امرؤ قاتله أو شاتمه فليقل: إني صائم، إني صائم"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله قال: الصيام جنة، فإذا كان أحدكم صائماً فلا يرفث ولا يجهل، فإن امرؤ قاتله أو شاتمه فليقل: إني صائم، إني صائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع عند أحمد، وروح بن عبادة، وسويد، والقعنبي عند البخاري (1894)، وعبد الرحمن بن القاسم، وغيرهم. {cite:muwatta-maruf-1997 p.415} {cite:muwatta-maruf-1997 p.416}"
