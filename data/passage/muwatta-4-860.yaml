label: { ar: "الموطأ 860 — أبو هريرة: الصيام جُنّة؛ فإذا كان أحدكم صائماً فلا يرفث ولا يجهل، فإن امرؤ قاتله أو شاتمه فليقل: إني صائم، إني صائم", en: "Muwatta 860", es: "Muwatta 860", fr: "Muwatta 860", ur: "موطا 860", tr: "El-Muvatta 860 — Ebu Hurayra: Oruç bir kalkandır; öyleyse sizden biri oruçlu ise, müstehcen konuşmalar yapmasın ve akılsızca davranmasın. Eğer biri onunla kavga eder veya ona hakaret ederse, \"Oruçluyum, oruçluyum\" desin.", id: "Al-Muwatta 860 — Abu Hurairah: Puasa adalah perisai; maka jika salah seorang dari kalian sedang berpuasa, janganlah ia terlibat dalam ucapan-ucapan kotor atau bertindak bodoh. Jika seseorang memaki atau menghinanya, hendaklah ia berkata: Aku sedang berpuasa, aku sedang berpuasa." }
text: "الصيام جُنّة؛ فإذا كان أحدكم صائماً فلا يرفث ولا يجهل. فإن امرؤ قاتله أو شاتمه فليقل: إني صائم، إني صائم"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله قال: الصيام جنة، فإذا كان أحدكم صائماً فلا يرفث ولا يجهل، فإن امرؤ قاتله أو شاتمه فليقل: إني صائم، إني صائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع عند أحمد، وروح بن عبادة، وسويد، والقعنبي عند البخاري (1894)، وعبد الرحمن بن القاسم، وغيرهم. {cite:muwatta-maruf-1997 p.415} {cite:muwatta-maruf-1997 p.416}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Oruç bir kalkandır. Öyleyse sizden biri oruç tuttuğunda, edepsiz konuşmalar yapmasın ve akılsızca davranmasın. Eğer biri onunla kavga eder veya ona hakaret ederse, 'Oruç tutuyorum, oruç tutuyorum' desin.\" Araştırmacı, bu hadisin Malik'ten Ebu Musab tarafından, onun isnadından da el-Baghawi, İshak el-Tabba' (Ahmed'e göre), Ravh ibn Ubadah, Suveyd, el-Ka'nabi (Buhari'ye göre, 1894), Abdurrahman ibn el-Kâsım ve diğerleri tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.415} {cite:muwatta-maruf-1997 s.416}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Puasa adalah perisai. Maka ketika salah seorang dari kalian berpuasa, janganlah ia berbicara cabul atau bertindak bodoh. Jika ada yang bertengkar dengannya atau menghinanya, hendaklah ia berkata: 'Aku sedang berpuasa, aku sedang berpuasa.'\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan dari sanadnya oleh al-Baghawi, Ishaq al-Tabba' (menurut Ahmad), Rawh ibn 'Ubadah, Suwayd, al-Qa'nabi (menurut al-Bukhari, 1894), 'Abd al-Rahman ibn al-Qasim, dan lain-lain. {cite:muwatta-maruf-1997 p.415} {cite:muwatta-maruf-1997 p.416}"
