text: "… عن العراق وفارس، وقطع قيصر ومَن قام بالأمر بعده عن الشام. وقال في كسرى : مُزِّق مُلْكُمه، فلم يبق للأكاسرة مُلْك، وقال في قيصر ثُبِّتَ مُلْكُه فتُبِّت له مُلْكُ بلاد الروم إلى اليوم. وقال يونس، عن ابن إسحاق : ثنا …"
