text: "… : شهادةُ أنْ لا إله إلا اللّٰه، وأنَّ محمداً عبدُهُ ورسوله، وإيمانٌ بالله وملائكته وكتبه ورُسُلِه، وبالجنَّةِ والنارِ، والحياةِ بعدَ الموتِ هذه واحدة، والصلواتُ الخمسُ عمود الدين لا يقبلُ اللّٰه الإيمان إلا بالصلاة، والزكاةُ طهور من الذنوب، ولا يقبلُ اللّٰه …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 126، يذكر الشهادة والصلاة والزكاة، والإيمان بالله وملائكته وكتبه ورسله، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 126, that mentions the testimony, the prayer and the zakat, belief in God, His angels, His books and His messengers, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 126 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen 2, pág. 126, que menciona el testimonio, la oración y el zakat, la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Jami' al-'Ulum wa-l-Hikam d'Ibn Rajab (tome 2, p. 126) mentionnant le témoignage, la prière et la zakat (l'aumône légale), la croyance en Dieu, Ses anges, Ses livres et Ses messagers, l'un des piliers de la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
