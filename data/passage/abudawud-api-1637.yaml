label: { ar: "سنن أبي داود 1637 — ما لا يحل", en: "Sunan Abi Dawud 1637 — what is not lawful", ur: "سنن ابی داؤد 1637 — جو حلال نہیں", es: "Sunan Abi Dawud 1637 — lo que no es lícito", fr: "Sunan Abi Dawud 1637 — ce qui n'est pas licite", tr: "Sunan Abi Davud 1637 — İzin verilmeyen şeyler", id: "Sunan Abi Dawud 1637 — Apa yang tidak diperbolehkan" }
text: "… الطَّائِيُّ، حَدَّثَنَا الْفِرْيَابِيُّ، حَدَّثَنَا سُفْيَانُ، عَنْ عِمْرَانَ الْبَارِقِيِّ، عَنْ عَطِيَّةَ، عَنْ أَبِي سَعِيدٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ تَحِلُّ الصَّدَقَةُ لِغَنِيٍّ إِلاَّ فِي سَبِيلِ اللَّهِ أَوِ ابْنِ السَّبِيلِ أَوْ جَارٍ فَقِيرٍ يُتَصَدَّقُ عَلَيْهِ فَيُهْدِي لَكَ أَوْ يَدْعُوكَ \". قَالَ أَبُو دَاوُدَ وَرَوَاهُ فِرَاسٌ وَابْنُ أَبِي لَيْلَى عَنْ عَطِيَّةَ عَنْ أَبِي سَعِيدٍ عَنِ النَّبِيِّ مِثْلَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1637، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1637 (Zakat (Kitab Al-Zakat)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1637، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1637 (Zakat (Kitab Al-Zakat)), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 1637 (Zakat), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 1637 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" kitabının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1637, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
