text: "م يثبت بديوان الجيش، ويجهز إلى باب السلطان، فإذا وصل إلى الباب كتب عليه الناظر ومن معه من الرفاق بالمقابلة، وقوبل به، ثم تشمله علامة السلطان أو نائبه بالكتابة، ويخلده كاتب الجيش بالباب عنده، ويكتب مثالا من جهته على ما"
