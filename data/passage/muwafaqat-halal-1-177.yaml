text: "… كافٍ في طلب ترك المباح ؛ لأنَّه أمر دنيويٌّ لا يتعلق بالآخرة من حيث هو مباح. - ومنها: ما فيه من التعرُّض لطول الحساب في الآخرة، وقد جاء: إِنَّ حلالها حساب، وحرامها عذاب، وعن بعضهم : أعزلوا عنّي حسابها، والحرب، …"
