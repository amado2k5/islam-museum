text: "… عمي ألفين، فإذا كثير، فهل عندك من شيءٍ تداويه به؟ فقلت: نعم. فرقيته بفاتحة الكتاب، فبَرَأ، فأعطوني مائة شاة، فلم حرج عطاؤُه قال لغلامه: انطلق فاقض ما علينا، فإني سمعت رسول اللّٰه علة يقول: من ترك ديناراً فَكَيَّةً، آخذها. فأتيت …"
