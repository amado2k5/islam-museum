  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 1432, that mentions cautery, ruqya recited over the sick, recovery from an ailment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 1432 کا اقتباس جس میں داغنا، رقیہ، بیماری سے شفایابی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
