text: "… الهند يقال له زرج وكان ملكًا جبارًا فاسقًا يدعو النأس الى عبدته وكان ابيا عايت اصنام له صنمان يعبدها من دون الله ويدمو الناس الى عبادتهما حتى اضلّ عمّة بنى اسرائيل وكان يعبد الاصنام حتى تُوقّى ثم ملك أبنه اسا …"
summary:
