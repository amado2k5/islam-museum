text: "… قَدْ كَانَتْ إِحْدَاكُنْ عُمَرَ وَاللَّفْظُ لِعَمْرِو حَدْتَنَا سُفْيَان ابْن عُيْنَةَ، عَنْ أيُوبَ ابْنِ ح - كتاب الطلاق - باب وُجُوبِ الإحْدَادِ فِي عِدَّةِ الْوَفَاةِ لَمَا أَتَّى أُمّ حَبِيبَةَ نَعِيَ أَبِي سُفَّيَانَ، دَعَتْ فِي الْيَوْمِ الثَّالِثِ، بِصُفْرَةٍ، فَمَسَحَتْ بِهِ ذِرَاعَيْهَا وَعَارِضَيْهَا، …"
summary:
  ar: "مقطع من المنهاج شرح صحيح مسلم بن الحجاج، المجلد المصوَّر 1، ص 945، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
