text: |-
  ٤٥
  ظليفا أى بغير عن قال ويقال أخذ الشى بظلفه وظليفةء اذا أخذه كله ولم يترك منه شيا وحكى
  أبو عمر وذهب دمه ظلفا وظلفا أيضا بالنسكين أى هدراباطلا قال و~عممه بالطاء والفاء
  جميعا ويقال ذهب به ظليفا أى مجانا أخذه يغيرعمن قال الشاءر
  أيأكاما ابن وعلة فى ظليف * ويأمن هيتم وابناسنان
  وظلف نفسه عن المشيء يظلفها ظلفا أى منعها من أن تفعله أوتأتيه قال الشاءر
  لقد أظلف النفس عن مطعم • اذا ماتهساذت ذيانه
  ويقال أيضاظلفت أثرى وأظلفته اذا مشيت فى الحزونة لثلايتبين أثرك فيها قال عوف
  ابن الاحوص
  ألم أظلف عن الشعراء نفسى • كاظلف الوسيقة بالكراع
  الارض كى لا يقتص أرها وظلفت نفسى عن كذا بالكسر نظاف ظلفا أى كفت وامرأة
  ظلافة النفس أى عزيزة عند نفسها قال الاموى" أرض ظلفة بينة الظلف أى غليظ: لا تؤدّي
  أثراومنه الظلف فى المعيشة وهو للشدة والظلفة واحدة ظلفات الرحل والقتب وهن
  الحشبات الاربع اللواتى يكن على جنبى البعير تصيب أطراقها السفلى الارض اذا وضعت
  عليها وفى الواسط ظلفتان وكذلك فى المؤخرة وهما ماسفل من الحنوين لانّ ماعلاهمامما يلى
  العراقى هما العضدان وأما الخشبات المطوّلة على جنبى البعير فهى الاحناء ظوف).
  يقال أخذه يظوف رقيته ويظاف رقيته لغة فى صوف رقيته
  ماض والعترفان بالضم الديك رف العجف بالتحريك الهزال والاعف المهزول
  وقد عف والآثى عجمفاء والجمع عجاف على غير قياس لانّ أفعل وفعلا لا يجمع على ذعال
  ولكنهم بنوه على سعمان والمعرب قد تبني الشئء-لى ضدّه كما قالوا عدوة بناء على صدديقة
  وذعول اذا كان بمعنى فاعل لا تدخله الهاء قال الشاعر
  وان يعرين ان كسى الجوارى * فتنبو العين عن كرم عجاف
  وأعحفه أى هزله قال الفراء يقال عرف المال بالكسر وعف أيضا بالضم ونصل أعف أى
  رقيق وعجنى نفسه على فلان بالفتح اذا آثره بالطعام على نفسه قال
  انى على ما كان من نحولى• أوازدريت عظعى وطولى • لاعجن النفس على الخليل
  والتعجيف الاكل دون الشبع ومنه قول الراجز
  لم يغذها مذ ولافصيف * ولا تميرات ولا تعجيف
  ( عجرف جل فيه تعجرف وعجرفة وعجرفية كأن فيه خرقاوقلة مبالاة لسر عته وفلان
  بتعجرف على اذا كان يركبه بمايكره ولايهاب شيأ والعجروف دويية ويقال هى الغلة
  الطويلة الارجل وعجارف الدهر وعحاديفه حوادثه ⁦(عدف)⁩، عدف يعدفعدقا
  أى أكل يقال ماذقت عدفا ولاعدوفا ولاعدافا أى شيأ وبانت الداية على غير عدوف أى
  على غير علف هذه لغة مضر والعدف بالتحريك القذى والعدفة بال-كسرمابين العشرة الى
  لى
