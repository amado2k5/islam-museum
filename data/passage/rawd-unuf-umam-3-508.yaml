text: "- - عَدَّيْن مَعِكَ الحجازِ ممداً، فلَم وجها لَطْتَةً خضْر عمنها منها. فاتى بهه رسولُ اللّه وبها أرمنه، فألها ماهو ؟ وأخبَرته هذا الخبر. بقية أمر خيبر وأتي رسولُ اللّه بكنانة بن الربيع، وكان عنده. كَنْز بنى النَّضير، فسأله عنه، …"
