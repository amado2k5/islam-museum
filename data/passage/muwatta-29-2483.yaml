label: { ar: "الموطأ 2483 — مالك: لا حياة لجنين إلا بالاستهلال، وفي جنين الأمة عشر ثمن أمه", en: "Muwatta 2483", es: "Muwatta 2483", fr: "Muwatta 2483", ur: "موطا 2483", tr: "El-Muvatta 2483 — Malik: Bir ceninin hayatı ancak ilk çığlıkla başlar ve bir cariyenin cenininin değeri annesinin değerinin onda biridir.", id: "Al-Muwatta 2483 — Malik: Tidak ada kehidupan bagi janin kecuali melalui tangisan pertama, dan janin seorang budak perempuan hanya bernilai sepersepuluh dari harga ibunya." }
summary:
  ar: "قال مالك: ولا حياة لجنين إلا بالاستهلال، فإذا خرج من بطن أمه فاستهل ثم مات ففيه الدية كاملة. ونرى أن في جنين الأمة عشر ثمن أمه. {cite:muwatta-maruf-1997 p.425}"
  tr: "Malik şöyle dedi: Bir cenin, doğumda ağlaması dışında hayat bulamaz. Annesinin rahminden çıkıp doğumda ağlasa ve sonra ölürse, tam kan bedeli ödenmelidir. Biz, bir köle kadının cenininin, annesinin bedelinin onda biri değerinde olduğuna inanıyoruz. {cite:muwatta-maruf-1997 s.425}"
  id: "Malik berkata: Janin tidak memiliki kehidupan kecuali melalui tangisan saat lahir. Jika ia keluar dari rahim ibunya, menangis saat lahir, dan kemudian mati, maka uang darah penuh harus dibayarkan. Kami percaya bahwa janin seorang wanita budak bernilai sepersepuluh dari harga ibunya. {cite:muwatta-maruf-1997 p.425}"
