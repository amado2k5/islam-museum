label: { ar: "صحيح مسلم 4036 — نقص قيراط من الأجر كل يوم", en: "Sahih Muslim 4036 — a qirat lost from the reward each day", ur: "صحیح مسلم 4036 — ہر روز اجر سے ایک قیراط کی کمی" }
text: "… أَنَّ السَّائِبَ، بْنَ يَزِيدَ أَخْبَرَهُ أَنَّهُ، سَمِعَ سُفْيَانَ بْنَ أَبِي زُهَيْرٍ، - وَهُوَ رَجُلٌ مِنْ شَنُوءَةَ مِنْ أَصْحَابِ رَسُولِ اللَّهِ - قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنِ اقْتَنَى كَلْبًا لاَ يُغْنِي عَنْهُ زَرْعًا وَلاَ ضَرْعًا نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطٌ \". قَالَ آنْتَ سَمِعْتَ هَذَا مِنْ رَسُولِ اللَّهِ قَالَ إِي وَرَبِّ هَذَا الْمَسْجِدِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4036، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4036 (The Book of Musaqah), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4036، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
