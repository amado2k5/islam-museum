text: "سنة ه خرج يوم الخميس ضرب عسكره على ثنية الوداع ومعه زيادة على ثلاثين ألفاً من الناس، وضرب عبد اللّٰه بن أبيّ عدو اللّٰه عسكره أسفلٍ منه - وما كان فيما يزعمون بأقل العسكرين - فلما سار رسول اللّٰه وَاللي …"
summary:
  ar: "مقطع من البداية والنهاية، المجلد المصوَّر 3، ص 12، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Bidaya wa-l-Nihaya, scan volume 3, p. 12, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "البدایہ والنہایہ، اسکین جلد 3، ص 12 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Bidaya wa-l-Nihaya, volume numérisé 3, p. 12, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Bidaya wa-l-Nihaya, volumen escaneado 3, p. 12, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"Başlangıç ve Son\" adlı resimli cilt 3'ün 12. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Awal dan Akhir,\" Jilid Bergambar 3, halaman 12, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
