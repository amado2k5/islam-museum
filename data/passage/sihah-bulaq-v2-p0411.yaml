text: |-
  ١ تسيخة زيادة ابن أخر اه
  ٠١٧٦
  الهاء اذا كان بمعنى مفعول به والحمولة بالضم الاحمال وأما الهول بالضم بلاهاء فهى الابل
  التى عليها الهوادج كان فيهانساء أو لم يكن عن أبي زيدوالاحال فى قول جرير
  أم من يقوم لشدة الاحال * قوم من بنى يربوع هم ثعلبة وعمر ووالحرث والجيل الذى
  يحمل من بلده صغيراولم يواد فى الاسلام والحميل ماحله السيل من الغناء والحميل السكفيل
  والجميل الدعى قال الكميت بعاتب قضاعة فى تحوّاهم الى المن
  علام نزلتم من غيرفر * ولاضرامسنزلة الحميل
  وحومل موضع ول . الحول الحيلة والقوة أيضا والحول السنة وكل ذى حافر أول
  س-نة -ولى والانثى حولية والجمسع حوليات وحال عليه الحول أى مرّوحالت الداروحال
  الغلام أى أتى عليه حول وحالت القوس واستحالت بمعنى أى انقلبت عن حالها التى غمزت
  عليها وحصل فى قابها اعوجاج قال أبوذؤيب
  وحالث كمول القوس طلت وعطلت * ثلانافأعيا عجسها وظهارها
  يقول تغيرت هذه المرأة كالقوس التى أصابها الطل فنديت ونزع عنها الوترثلاث سنين قزاغ
  عجسها واءوج وحال فى متن فرسه حؤولا اذا وثب وركب وحالت الناقة حيالا اذاضربها
  الفعل فلم تحمل وكذلك النخل وهى ابل حيال وحال عن العهدحؤ ولا انقلب وحال لونه أى
  تغير واسودّ عن أبى نصر وحال الشئ بيني وبينك أى حجز ومال الى مكان آخر أى تحوّل وحال
  الشنخص أى تحرّكْ وكذلك كل متحوّل عن حاله ويقال قعدوا حوله وحواله وحوليه
  و-واليه ولا تقل حواليه بكسر اللام وقعد حياله وبحياله أى يازائه وأصله الواو والحول
  بالضم الحيان قال الشاعر (١
  لقعن على حول وصادفن سلوة • من العيش حتى كلهنّ ممتع
  ويروى ممنع بالنون والحول أيضاجع حائل من النوق يقال حائل حول وحوال وة دقسرناه
  فى عائط عوط ويقال أيضاهو حولة من الحول أى داهبة من الدواهي قال ابن السكيت
  الحولاالجددة التى تخرج مع الولدفيها أغراس وفيها خطوط حروخضر وقال أبوز يد
  الحولاء الماء الذى يخرج على رأس الولداذا ولدوفيها لغة أخرى الحولاء قال الخليل ليس فى
  الكلام فعلاء بالكسر مدود الاحولاء وعنباء وسيراء والحمالة واحدة حال الانسان
  وأحو اله والحال الطين الاسود وفى الحديث ان جبريل عليه السلام قال أخذت من حال
  البحر فحشوت فه يعنى فرعون والحال الدرّاجة التى يدرّج عليها الصبى اذامشى وهى
  كالعجلة الصغيرة قال عبد الرجن بن حسان
  مازال ينى جدّه صاعدا * منذلدن فارقه الحال
  والحال الكارة التى يحملها الرجل على ظهره وحال متن الفرس وسط ظهره موضسع الليد
  والحائل الانى من ولد الناقة لانه اذا نتج ووقع عليه اسم تذكيروتأنيث فان الذكرسقب
  والاتى حائل يقال تتجت الناقة حائلا حسنة ولا أذمل ذاك ما أرزمت أمّ حائل والتحوّل
  التنقل من موضع الى موضع والاسم الحول ومنسه قوله تعالى خالدين فيها لا يغون عنها
  حولا ويقال أيضا تحوّل الرجل اذاحل الكارة على ظهره وتحوّل أيضا أى احتال من الحيلة
