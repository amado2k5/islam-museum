text: "… أبي حمزة عن إبراهيم في المضطر إلى الميتة، قال: يأكل ما يقيمه. - حدَّثنا أبو بكر قال: حدَّثنا شَرِيك عن جابر عن أبي جعفر قال: إذا اضطر إلى ما حُرِّم عليه فهو له حلال. - حدَّثنا أبو بكر قال: حدَّثنا …"
