label: { ar: "صحيح البخاري 4433 — مرض النبي، الوجع", en: "Sahih al-Bukhari 4433 — the Prophet's illness; pain", ur: "صحیح بخاری 4433 — نبی کی بیماری، درد" }
text: "… اللَّخْمِيُّ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَا ـ قَالَتْ دَعَا النَّبِيُّ فَاطِمَةَ ـ عَلَيْهَا السَّلاَمُ ـ فِي شَكْوَاهُ الَّذِي قُبِضَ فِيهِ، فَسَارَّهَا بِشَىْءٍ، فَبَكَتْ، ثُمَّ دَعَاهَا فَسَارَّهَا بِشَىْءٍ فَضَحِكَتْ فَسَأَلْنَا عَنْ ذَلِكَ. فَقَالَتْ سَارَّنِي النَّبِيُّ أَنَّهُ يُقْبَضُ فِي وَجَعِهِ الَّذِي تُوُفِّيَ فِيهِ فَبَكَيْتُ، ثُمَّ سَارَّنِي فَأَخْبَرَنِي أَنِّي أَوَّلُ أَهْلِهِ يَتْبَعُهُ فَضَحِكْتُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4433، يذكر مرض النبي، والوجع. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4433, that mentions the Prophet's illness, pain. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4433، جس میں نبی کی بیماری، درد کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
