label: { ar: "صحيح البخاري 4120 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4120 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4120 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا ابْنُ أَبِي الأَسْوَدِ، حَدَّثَنَا مُعْتَمِرٌ، وَحَدَّثَنِي خَلِيفَةُ، حَدَّثَنَا مُعْتَمِرٌ، قَالَ سَمِعْتُ أَبِي، عَنْ أَنَسٍ ـ قَالَ كَانَ الرَّجُلُ يَجْعَلُ لِلنَّبِيِّ النَّخَلاَتِ حَتَّى افْتَتَحَ قُرَيْظَةَ وَالنَّضِيرَ، وَإِنَّ أَهْلِي أَمَرُونِي أَنْ آتِيَ النَّبِيَّ فَأَسْأَلَهُ الَّذِينَ كَانُوا أَعْطَوْهُ أَوْ بَعْضَهُ. وَكَانَ النَّبِيُّ قَدْ أَعْطَاهُ أُمَّ أَيْمَنَ، فَجَاءَتْ أُمُّ أَيْمَنَ فَجَعَلَتِ الثَّوْبَ فِي عُنُقِي تَقُولُ كَلاَّ وَالَّذِي لاَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4120، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4120 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4120، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
