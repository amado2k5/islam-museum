label: { ar: "صحيح مسلم 6457 — الأب والأبوة، اليتيم وفقد الأب", en: "Sahih Muslim 6457 — the father and fatherhood; the orphan and the father lost", ur: "صحیح مسلم 6457 — باپ اور والدیت، یتیم اور باپ کی موت", es: "Sahih Muslim 6457 — El padre y la paternidad; el huérfano y el padre perdido", fr: "Sahih Muslim 6457 — Le père et la paternité; l’orphelin et le père perdu" }
text: "حَدَّثَنَا عَمْرٌو النَّاقِدُ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، يَبْلُغُ بِهِ النَّبِيَّ وَابْنُ طَاوُسٍ عَنْ أَبِيهِ يَبْلُغُ بِهِ النَّبِيَّ. بِمِثْلِهِ غَيْرَ أَنَّهُ قَالَ \" أَرْعَاهُ عَلَى وَلَدٍ فِي صِغَرِهِ \". وَلَمْ يَقُلْ يَتِيمٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6457، يذكر الأب والأبوة، واليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6457 (The Book of the Merits of the Companions), that mentions the father and fatherhood, the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6457، جس میں باپ اور والدیت، یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6457 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad, al huérfano y al padre fallecido. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6457 (Le Livre des mérites des Compagnons), évoque le père et la paternité, l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
