label: { ar: "سنن النسائي 3175 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 3175 — the father raising and counselling", ur: "سنن نسائی 3175 — باپ کی تربیت اور نصیحت", es: "Sunan al-Nasa'i 3175 — El padre que cría y aconseja", fr: "Sunan al-Nasa'i 3175 — l'éducation et les conseils du père", tr: "Sunan an-Nasa'i 3175 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan an-Nasa'i 3175 — Didikan dan Wasiat Ayah" }
text: "… قَالَ حَدَّثَنَا أَسَدُ بْنُ مُوسَى، قَالَ حَدَّثَنَا بَقِيَّةُ، قَالَ حَدَّثَنِي أَبُو بَكْرٍ الزُّبَيْدِيُّ، عَنْ أَخِيهِ، مُحَمَّدِ بْنِ الْوَلِيدِ عَنْ لُقْمَانَ بْنِ عَامِرٍ، عَنْ عَبْدِ الأَعْلَى بْنِ عَدِيٍّ الْبَهْرَانِيِّ، عَنْ ثَوْبَانَ، مَوْلَى رَسُولِ اللَّهِ قَالَ قَالَ رَسُولُ اللَّهِ \" عِصَابَتَانِ مِنْ أُمَّتِي أَحْرَزَهُمَا اللَّهُ مِنَ النَّارِ عِصَابَةٌ تَغْزُو الْهِنْدَ وَعِصَابَةٌ تَكُونُ مَعَ عِيسَى ابْنِ مَرْيَمَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3175، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3175 (The Book of Jihad), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3175، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3175 (El Libro de la Yihad), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3175 (Le Livre du Jihad), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 3175 numaralı hadiste babanın yetiştirilmesi ve öğütlerinden bahsedilir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3175, menyebutkan tentang didikan dan nasihat seorang ayah. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
