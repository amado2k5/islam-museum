text: "أنه تعالى يحبهم. فالحب من الصفات التي أسندت إلى الله تعالى في كتابه وعلى لسان نبيه كل فهو تعالى يحب ويبغض كما يليق بشأنه. ولا يشبه حبه حب البشر، لأنه لا يشبه البشر (ليس كمثله شيء) [الشورى: ١١] وكذلك علمه"
