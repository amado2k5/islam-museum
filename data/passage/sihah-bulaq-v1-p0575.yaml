text: |-
  وقد نزف الحوض والشرب جمع شارب مثل صاحب وصحب ثم يجمع الشرب على شروب
  ٣ قال المجد والشراب ما يشرب
  كالشريب اه ولم يتعرض هنا
  جمعه على أشرية لانه سيأتى فى
  النهارية ول ج أنهر ونهسر أولا
  يجمع كالعذاب والشراب لكن
  ورد فى الحديث أشربة ونظيره
  جواب حيث قالوا جعه على
  أجوبة مولدونوزع نيه ونظيره
  أيضا تكسير نحومضروب
  كصروف على مفاعيل قال نصر
  ١ اشية على بعض نسح الصحاح
  الصواب السريبه بالسين المهملة
  أه مرتضى
  وقال الاعشى هو الواهب المسمعات الشرو * ب بين المريروبين الكتن
  والمشرية بالكسراناء يشرب فيه والمشربة بالفتح الغرفة وكذلك المشمرية بضم الراء والمشارب
  العلالى وهوفى شعر الاعشى والشريب المواع بالشراب ٣ مثل الجير والمشرية كالمشرعة
  وفى الحديث ملعون من أحاط على مشربة والمشرب الوجه الذى يشرب منه ويكونموضعا
  ويكون مصدرا أبو عبيدة يقال ماعشروب وشريب للذى بين الملح والعذب والسريبة
  ١ من الغنم التى تصدرها اذارويت قتتبعها الغنم وشريك الذى يشار بان ويورد ايله مع
  ابلك قال الراجز
  اذا الشريب أخذته أكه * فلدحتى يبك بكم
  وهوفعيل بمعنى مناعل مثل نديم وأسكيل وتقول شرب مالى وأكله أى أطعمه الناس
  رظل مالى يؤكل ويشرّب آى يرعى كيف شاء وشربت القربة أى جعات فيها وهى جديدة طينا
  وماءلطمب طعمها والشربة بالتحريك حوض يتخسذ حول النخلة تتروّى منه والجمع شرب
  وشربات قال زهير
  يخرجن من شربات ماؤها طحل * على الجذوع يخفن العمّ والغرقاة
  والشوارب مجارى الماء فى الحلق وحار صخب الشوارب من هذا أى شديد النهيق وقد طاة
  شارب الغلام وهماشاربان والجمع شوارب أبو عبيد أشريت الابل حق شربت ونقون
  أشريتنى مالم أشرب أى ادّعيت على مالم أفعل والاشراب لون قد أشرب من لون آخريال
  أشرب الابيض حرة أى علاه ذلك وفيه شرية من حرة أى إشراب ويقال أيضاعنده شرية
  من ماء آى مقدار الرة ومثله الحسوة والغرفة واللقمة وأشرب فى قلبه حبه أى خااطه ومنه
  قولد تسارك وتعالى وأشر بوا فى قلوبهم العجل أرادحب العجل فخذف المضاف وأقام المضاف
  اليه قامه والشارية القوم على ضفة النهرولهم ماؤه ورجل أكلة شرية مثال همزة كثير
  الاكل والشمرب عن ابن السكيت وتشرب الثوب العرق أى نشقه واشرأب للشئ اشرتبابا
  مدعنقه لينظر والشرأبيبة بضم الذين اسم من اشرأب كالة شعريرة من اقشعر وشرية بتشديد
  ٢ وايس لها أخت إلاجرية
  الباءموضع ٢ يقال مازال فلان على شربة واحدة أى على أمر واحدوشربب بالضم
  لا ثالث لهمااد قاموس وبعضهم
  جعل غظبة فى وصف الرجل
  موضع وهو فى شعرليد بالهاء هل تعرف الدار يسفح الشريه ⁦(شرجب)⁩ الشرجب
  الغضوب على هذا الوزن فتكون
  الطويل ( رعب الشرعب الطويل وشرعبت الاديم قطعته طولا والشرعى ضرب
  ثلاثة لارابع لها قاله نصر
  من البرود ( زب الشازب الضاهر وقد شزب الفرس شزونا وخيل شزب أى ضوامر
  ومكان شازب أى خشن ( ب اين السكيت الشاسب اليايس من الضهروه والمهزول
  مثل الشاسف وليس مثل الشازب قال الوقاف العقيلى"
  فقلت له حان الرواح ورعته * بأسمر ملوى من القتشاسب
  والشيب القوس صب) الشصب بالكسر الشدة والشصائب الشدائد وقد شصب
  الامر بالمكسر أى اشتدوعيش شاعب وقد شصب بالفتح يشصب بااضم شهويا وأشصب اللّٰه
  عيشه والشيصيان امم قبيلة من الجنّ وينشد لحسان
  ولى صاحب من بن الشيصبان * فيينا أقول وحيناهوه
  شطب )
