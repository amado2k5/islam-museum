text: "المنتظم وسبعائة قبة ولا نكون القبة التركية الالرئيس ومتقدم فوجه اسمعيل احد قواده لهتالهم فوافاهم - وهم غارون فقتل منهم خلقا كثيرا - واستباح عسكرهم وانصرف المسلمون غانمين. وكان طاهر بن بن عمر وبن الليث قد استولى على فارس بعد …"
summary:
