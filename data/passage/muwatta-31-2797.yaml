label: { ar: "الموطأ 2797 — سائبة مولاة عائشة: نهى النبي عن قتل الجنان إلا ذا الطفيتين والأبتر", en: "Muwatta 2797" }
summary:
  ar: "يروي مالك عن نافع، عن سائبة مولاة عائشة، أن رسول الله نهى عن قتل الحيات التي في البيوت إلا ذا الطفيتين والأبتر، فإنهما يخطفان البصر ويطرحان ما في بطون النساء. ويذكر المحقق قول ابن عبد البر أن يحيى رواه عن مالك مرسلا لا يذكر عائشة، وأن أكثر أصحاب نافع يروونه مسندا عن عائشة، ويذكر أنه في الصحيحين من حديث هشام بن عروة عن أبيه عن عائشة. {cite:muwatta-maruf-1997 p.571}"
