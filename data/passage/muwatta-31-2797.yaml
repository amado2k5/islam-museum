label: { ar: "الموطأ 2797 — سائبة مولاة عائشة: نهى النبي عن قتل الجنان إلا ذا الطفيتين والأبتر", en: "Muwatta 2797", es: "Muwatta 2797", fr: "Muwatta 2797", ur: "موطا 2797", tr: "Al-Muwatta 2797 — Sa'iba (Aişe'nin azatlı kölesi): Peygamber, iki beyaz çizgili ve kuyruklu cinler hariç, cinlerin öldürülmesini yasakladı.", id: "Al-Muwatta 2797 — Sa’iba, budak yang dibebaskan oleh Aisyah: Nabi melarang membunuh jin kecuali jin yang memiliki dua garis putih dan jin yang berekor." }
summary:
  ar: "يروي مالك عن نافع، عن سائبة مولاة عائشة، أن رسول الله نهى عن قتل الحيات التي في البيوت إلا ذا الطفيتين والأبتر، فإنهما يخطفان البصر ويطرحان ما في بطون النساء. ويذكر المحقق قول ابن عبد البر أن يحيى رواه عن مالك مرسلا لا يذكر عائشة، وأن أكثر أصحاب نافع يروونه مسندا عن عائشة، ويذكر أنه في الصحيحين من حديث هشام بن عروة عن أبيه عن عائشة. {cite:muwatta-maruf-1997 p.571}"
  id: "Malik meriwayatkan dari Nafi', dari Sa'iba, budak yang dibebaskan oleh Aisyah, bahwa Rasulullah shalla Allahu alaihi wa sallam melarang membunuh ular yang ditemukan di rumah, kecuali ular belang dua dan ular tanpa ekor, karena ular-ular ini dapat menyebabkan kebutaan dan keguguran. Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa Yahya meriwayatkannya dari Malik sebagai hadits mursal, tanpa menyebutkan Aisyah, dan bahwa sebagian besar murid Nafi meriwayatkannya sebagai hadits musnad dari Aisyah. Ia juga menyebutkan bahwa hadits ini ditemukan dalam dua kitab Sahih (Bukhari dan Muslim) dari Hisham bin Urwa, dari ayahnya, dari Aisyah. {cite:muwatta-maruf-1997 p.571}"
