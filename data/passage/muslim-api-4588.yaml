label: { ar: "صحيح مسلم 4588 — الحلال، ما أُحل", en: "Sahih Muslim 4588 — the lawful; what was made lawful", ur: "صحیح مسلم 4588 — حلال، جو حلال کیا گیا" }
text: "… لِبُكَائِكُمَا. فَقَالَ رَسُولُ اللَّهِ \" أَبْكِي لِلَّذِي عَرَضَ عَلَىَّ أَصْحَابُكَ مِنْ أَخْذِهِمُ الْفِدَاءَ لَقَدْ عُرِضَ عَلَىَّ عَذَابُهُمْ أَدْنَى مِنْ هَذِهِ الشَّجَرَةِ \". شَجَرَةٍ قَرِيبَةٍ مِنْ نَبِيِّ اللَّهِ. وَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ { مَا كَانَ لِنَبِيٍّ أَنْ يَكُونَ لَهُ أَسْرَى حَتَّى يُثْخِنَ فِي الأَرْضِ} إِلَى قَوْلِهِ { فَكُلُوا مِمَّا غَنِمْتُمْ حَلاَلاً طَيِّبًا} فَأَحَلَّ اللَّهُ الْغَنِيمَةَ لَهُمْ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4588، يذكر الحلال، وما أُحل، والطيبات. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 4588 (The Book of Jihad and Expeditions), that mentions the lawful, what was made lawful, the good things. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 4588، جس میں حلال، جو حلال کیا گیا، پاکیزہ چیزیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
