text: "… في هاوم مثل الميم في انتم الأصل فيهما الصلة بالواو على ماتقدم في قراءة أبن كثير وابي جعفر ورسم المصحف في جميع ذلك بحذف الواو فيما ليس بعده ساكن فما بعده ساكن اولى فالوقف على الميم لجميع القراء. واذا كان …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 458، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 458, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 458 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
