text: "أمر بقتل الحيات في الحرم"
summary:
  ar: "يرويه مالك عن ابن شهاب أن عمر بن الخطاب أمر بقتل الحيات في الحرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1186) وسويد (628) والشيباني (429)، وأن المطبوع من الموطأ وقع فيه «ابن عمر» وهو غلط. {cite:muwatta-maruf-1997 p.480}"
  tr: "Malik, İbn Şihab'dan rivayet eder ki, Ömer ibn el-Hattab kutsal alanda yılanların öldürülmesini emretmiştir. Editör, bunun Malik'ten Ebu Mus'ab (1186), Suveyd (628) ve el-Şeybani (429) tarafından da rivayet edildiğini ve el-Muvatta'nın basılı baskısında yanlışlıkla \"İbn Ömer\"den bahsedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.480}"
  id: "Malik meriwayatkan dari Ibn Shihab bahwa Umar ibn al-Khattab memerintahkan pembunuhan ular di tempat suci. Editor mencatat bahwa riwayat ini disampaikan dari Malik oleh Abu Mus'ab (1186), Suwaid (628), dan al-Shaybani (429), dan bahwa edisi cetak al-Muwatta' secara keliru menyebutkan \"Ibn Umar.\" {cite:muwatta-maruf-1997 p.480}"
