label: { ar: "الموطأ 2743 — سهيل عن أبيه عن أبي هريرة: إذا أحب الله العبد قال لجبريل قد أحببت فلانا فأحبه", en: "Muwatta 2743" }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله قال: إذا أحب الله العبد قال لجبريل: قد أحببت فلانا فأحبه، فيحبه جبريل، ثم ينادي في أهل السماء: إن الله قد أحب فلانا فأحبوه، فيحبه أهل السماء، ثم يوضع له القبول في الأرض. وإذا أبغض الله العبد... قال مالك: لا أحسبه إلا أنه قال في البغض مثل ذلك. {cite:muwatta-maruf-1997 p.543} {cite:muwatta-maruf-1997 p.544}"
