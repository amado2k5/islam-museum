label: { ar: "الموطأ 2743 — سهيل عن أبيه عن أبي هريرة: إذا أحب الله العبد قال لجبريل قد أحببت فلانا فأحبه", en: "Muwatta 2743", es: "Muwatta 2743", fr: "Muwatta 2743", ur: "موطا 2743", tr: "El-Muvatta 2743 — Suhayl, babasından, o da Ebu Hurayra'dan rivayetle: Allah bir kulunu sevdiği zaman Cebrail'e şöyle der: \"Ben filan kişiyi sevdim, sen de onu sev.\"", id: "Al-Muwatta 2743 — Suhayl, berdasarkan riwayat ayahnya, berdasarkan riwayat Abu Hurayrah: Ketika Allah mencintai seorang hamba, Dia berfirman kepada Jibril, “Aku telah mencintai si fulan, maka cintailah dia.”" }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله قال: إذا أحب الله العبد قال لجبريل: قد أحببت فلانا فأحبه، فيحبه جبريل، ثم ينادي في أهل السماء: إن الله قد أحب فلانا فأحبوه، فيحبه أهل السماء، ثم يوضع له القبول في الأرض. وإذا أبغض الله العبد... قال مالك: لا أحسبه إلا أنه قال في البغض مثل ذلك. {cite:muwatta-maruf-1997 p.543} {cite:muwatta-maruf-1997 p.544}"
  tr: "Malik, Suhayl ibn Abi Salih'ten, o da babasından, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: “Allah bir kulunu sevdiğinde, Cebrail'e şöyle der: ‘Ben falanı sevdim, sen de onu sev.’ Bunun üzerine Cebrail onu sever ve göklerin sakinlerine şöyle seslenir: ‘Allah falanı sevdi, sen de onu sev.’ Bunun üzerine göklerin sakinleri onu sever ve o da yeryüzünde kabul görür. Allah bir kulundan nefret ettiğinde ise…” Malik dedi ki: “Sanırım nefret konusunda da benzer bir şey söylemiştir.”"
  id: "Malik meriwayatkan dari Suhayl ibn Abi Salih, dari ayahnya, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: “Ketika Allah mencintai seorang hamba, Dia berfirman kepada Jibril: ‘Aku telah mencintai si fulan, maka cintailah dia.’ Kemudian Jibril mencintainya, lalu ia berseru kepada penghuni langit: ‘Allah telah mencintai si fulan, maka cintailah dia.’ Kemudian penghuni langit mencintainya, dan kemudian ia diterima di bumi. Dan ketika Allah membenci seorang hamba…” Malik berkata: “Saya kira beliau mengatakan hal yang serupa mengenai kebencian.”"
