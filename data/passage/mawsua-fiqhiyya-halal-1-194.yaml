text: "… أم عقارا وإن أذن البائع وقبض الثمن، وذلك لحديث حكيم ابن حزام قال: قلت: يارسول اللّه، إنى أشترى بيوعا. فما يحل لى منها وما جامع الفصولين، والدر المختار ورد المحتار لابن عابدين وما بعدها. - - عَقَار - يحرم على؟ …"
