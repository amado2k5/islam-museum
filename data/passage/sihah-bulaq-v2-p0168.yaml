text: |-
  *(باب النون,
  ١١٩
  النسب فلا يجتمعان قال سيبويه وبعضهم يقول بمانى بالتشديد قال أمية بن خلف
  يمانيا يظل يندّ كيرا • وينفخ دامالهب الشواظ
  وقوم بمائية ويمانون مثل غمانية وغانون وامرأة يمانية أيضا وأين الرجل وعن وبامن اذا
  أتى المن وكذلك أذا أخذ فسيره يينا يقال يا من يافلان يأصحابك أى خذيهم يمقة ولا تقل
  تيامن بهم والعامّة تقوله وتمن تنسب الى المين والبيمنىّ أقق اليمن واليمن البركة وقديمن
  فلان على قومه فهو ميمون اذا صار مبار كاعليهم ويمنهم فهويا من مثل شتم وشائم وتمنت به
  تبرّكت والايامن خلاف الاشائم قال المرقش
  ولقد غدوت وكنت لا• أغدوعسلى واق وحاتم
  فاذا الاشائم كالايا * من والايامن كالاشائم
  وقول الكميتة
  ورأت قضاعة فى الايا * من رأى مشبوروثابر
  يعنى فى انتسابها الى اليمن كانه بجع المن على أيمن تم على أيا من مشل زمن وأزمن واليمئة
  بالفتح خلاف اليسرة يقال قعد فلان يمنة والايمن والممنة خلاف الايسر والميسرة والمين
  القوة قال الحطيئة
  اذا ماراية رفعت نجد • تلقاهاءراية بالمين
  وقوله تع الى تاتوتساعن المين قال ابن عباس رضى القه عنه-ما أى من قبل الدين فتزينون لنا
  ضلالتنا كانه أراد تأتوتنا عن المأتى السهل الاصمعى فلان عندنا باليمين أى بالمنزلة الحسنة
  ويقال قدم فلان على أيمن اليمين أى على المن واليمين القسم والمع أيمن وأيمان بقال سمى
  بذلك لانخسم كانوا اذا تحالف واضرب كل امرى منهم بمينه ع لى يمين صاحبه وأن جعلت المين
  ظرفالم تجمعه لان الظروف لا تكاد تجمع لانهاجهات وأقطار مختلفسة الالفاظ ألاتزى
  أن قسدام مخالف نخلف واليمين مخالف للشمال وقول الشاعر • يبرى لها من أيمن وأشمل•
  قول بعرض لها من ناحمة المين وناحمة الشمال وذهب الى معنى أيمن الابل وأشملها فيمع
  لذلك وقول الشاعر• ألقت ذ كايمينها فى كافر يعنى مالت بأحدجانييها الى المغسب والميز
  يمين الانسان وغيره وتصغير المين يمين بالتشديد بلاهاء وأما الذى فى حديث عمر رضى اللّٰه عنه
  زوّد تنا أمّنا بيمينتيها من الهبيد فيقال انه أراد بيمينتيها تصغيريني فأبدل من الياه الاولى تاءاذ
  كانتاللتأنيت واليمنة بالضم البردة من برود اليمن وقال والمنة المعصبا وأم أين امرأة
  أعثة هارسول اللّٰه صلى اللّه عليه وسلم وهى حاضنة أولاده فزوجها من زيد فولدت له أسامة
  وايمن اللّٰه اسم وضع لاقسم هكذابضم الميم والنون وألفه ألف وصل عندأ كراتحو يين
  ولم يحى فى الاسماء ألف وصل مفتوحة غيرها وقد تدخل عليه اللام لتأكيد الابتداه تقول
  لمن اللّه متذهب الالف فى الوصل قال الشاعر
  فقال فريق القوم لما نشدتهم • نعم وفريق لين اللّٰه ماندرى
  وهو مر فوع بالابتداء وخبره محذوف والتسدير لمن الّه قسمى ولمن اللّٰه ما أقسم به واذا
  خاطبت قلت ليمنك وفى سديث عروة بن الز بير أنه قال ليمنك اتن كنت ابتليت لقسدعافيت
  واثن كنت سلبت لقد أ يقيت وربماحذفوا منه النون فة الوا أيم اللّٰه وايم القه أيضابكسر
  اله-مزة وربما حذفوا منه الياء فقالواا م اللّٰه وربما أبة واالميم وحدها مضموعة قالوام اقه
