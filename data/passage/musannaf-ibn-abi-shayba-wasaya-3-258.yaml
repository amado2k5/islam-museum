text: "… أبا بكر العنديق حين حضرته الوفاة أوصى اسماء بنت عميس ان تغسله وكانت صائمة فعزم عليها لتفطرن. حدثنا وكيع ابن الجراج عن ابى هلال عن صالح الدهان او حبان الاعرج عن جابر ابن زيد انه أوصى ان تغسله امرأته. حدثنا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 3، ص 258، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 3, p. 258, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 3، ص 258 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 3, pág. 258, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 3, page 258, mentionnant un testament ou des conseils d'adieu, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn Abi Şeybah'ın Musannaf adlı eserinin 3. cildinin 258. sayfasından bir alıntı, vasiyetname veya son vasiyet, ölüm zamanı ve ölüm süreci, defin, mezar ve istirahat yerinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, miraslar, eski eserler ve istirahat yerleri araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf karya Ibn Abi Shaybah, Volume 3, halaman 258, menyebutkan wasiat atau surat wasiat terakhir, waktu kematian dan sekarat, pemakaman, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat peristirahatan."
