text: "… الأكلة قال : فصعدت فى ساقه ؛ فبعث الوليد إليه الأطباء. فقالوا : ليس لها دواء إلا القطع قال فقطعت فيا تضور وجمه... :حدثنا عبد الله بن محمد قال ثنا محمد بن شبل قال ثما أبو بكر بن أبى عيبة …"
