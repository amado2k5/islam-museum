label: { ar: "صحيح مسلم 7096 — الأب والأبوة", en: "Sahih Muslim 7096 — the father and fatherhood", ur: "صحیح مسلم 7096 — باپ اور والدیت", es: "Sahih Muslim 7096 — El padre y la paternidad", fr: "Sahih Muslim 7096 — Le père et la paternité" }
text: "وَحَدَّثَنِيهِ مُحَمَّدُ بْنُ حَاتِمٍ، وَمَحْمُودُ بْنُ غَيْلاَنَ، قَالاَ حَدَّثَنَا بِشْرُ بْنُ السَّرِيِّ، حَدَّثَنَا سُفْيَانُ، عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ، عَنْ عَبْدِ اللَّهِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ غَيْرَ أَنَّ مَحْمُودًا قَالَ فِي رِوَايَتِهِ عَنْ بِشْرٍ \" وَمَثَلُ الْكَافِرِ كَمَثَلِ الأَرْزَةِ \". وَأَمَّا ابْنُ حَاتِمٍ فَقَالَ \" مَثَلُ الْمُنَافِقِ \". كَمَا قَالَ زُهَيْرٌ."
summary:
  ar: "حديث في صحيح مسلم، رقم 7096، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7096 (Characteristics of the Day of Judgment, Paradise, and Hell), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7096، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 7096 (Características del Día del Juicio, el Paraíso y el Infierno), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 7096 (Caractéristiques du Jour du Jugement, du Paradis et de l'Enfer), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
