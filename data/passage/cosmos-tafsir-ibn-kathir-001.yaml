text: "وقال وهب بن منبه: لله ثمانية عشر ألف عالَم؛ الدُّنيا عالم منها. وقال مقاتل: العَوَالِمُ ثمانون ألفًا."
summary:
  ar: "ينقل ابن كثير عن البغوي أعداداً مروية لـ«العالمين»: عن وهب بن منبه ثمانية عشر ألف عالم وهذه الدنيا واحد منها، وعن مقاتل ثمانون ألفاً؛ وقد وصف في الصفحة نفسها قولاً مجاوراً بأنه غريب يحتاج إلى دليل صحيح، ونبّه محقق الطبعة إلى أن مثل هذه الأعداد لا دليل صحيح عليها."
  en: "Ibn Kathir, relaying al-Baghawi, lists transmitted counts for the 'worlds' of the Fatiha: Wahb ibn Munabbih says eighteen thousand worlds, this one among them, and Muqatil says eighty thousand. On the same page he calls a neighbouring report strange and in need of sound evidence, and the edition's footnote says such numbers have no sound proof."
  es: "Ibn Kathir, citando a al-Baghawi, enumera las cifras transmitidas sobre los «mundos» de la Fatiha: Wahb ibn Munabbih menciona dieciocho mil mundos, entre ellos este, y Muqatil afirma que ochenta mil. En la misma página, califica un relato vecino de extraño y necesitado de pruebas sólidas, y la nota a pie de página de la edición indica que tales cifras carecen de fundamento."
