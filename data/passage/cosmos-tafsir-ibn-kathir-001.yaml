text: "وقال وهب بن منبه: لله ثمانية عشر ألف عالَم؛ الدُّنيا عالم منها. وقال مقاتل: العَوَالِمُ ثمانون ألفًا."
summary:
  ar: "ينقل ابن كثير عن البغوي أعداداً مروية لـ«العالمين»: عن وهب بن منبه ثمانية عشر ألف عالم وهذه الدنيا واحد منها، وعن مقاتل ثمانون ألفاً؛ وقد وصف في الصفحة نفسها قولاً مجاوراً بأنه غريب يحتاج إلى دليل صحيح، ونبّه محقق الطبعة إلى أن مثل هذه الأعداد لا دليل صحيح عليها."
  en: "Ibn Kathir, relaying al-Baghawi, lists transmitted counts for the 'worlds' of the Fatiha: Wahb ibn Munabbih says eighteen thousand worlds, this one among them, and Muqatil says eighty thousand. On the same page he calls a neighbouring report strange and in need of sound evidence, and the edition's footnote says such numbers have no sound proof."
  es: "Ibn Kathir, citando a al-Baghawi, enumera las cifras transmitidas sobre los «mundos» de la Fatiha: Wahb ibn Munabbih menciona dieciocho mil mundos, entre ellos este, y Muqatil afirma que ochenta mil. En la misma página, califica un relato vecino de extraño y necesitado de pruebas sólidas, y la nota a pie de página de la edición indica que tales cifras carecen de fundamento."
  fr: "Ibn Kathir, rapportant al-Baghawi, énumère les décomptes transmis concernant les « mondes » de la Fatiha: Wahb ibn Munabbih parle de dix-huit mille mondes, dont celui-ci, et Muqatil de quatre-vingt mille. Sur la même page, il qualifie un récit voisin d'étrange et de non étayé par des preuves solides, et la note de bas de page de l'édition précise que de tels chiffres ne reposent sur aucune preuve tangible."
  ur: "ابن کثیر، البغوی کو بیان کرتے ہوئے، فاتحہ کے 'دنیاوں' کے لیے نقل شدہ شمار کی فہرست دیتے ہیں: وہب بن منبیح کہتے ہیں اٹھارہ ہزار جہانیں، ان میں سے ایک، اور مقاتل کہتے ہیں اسی ہزار۔ اسی صفحہ پر وہ پڑوسی کی ایک رپورٹ کو عجیب اور ٹھوس ثبوت کی ضرورت قرار دیتا ہے، اور ایڈیشن کے فوٹ نوٹ میں کہا گیا ہے کہ ایسے نمبروں کا کوئی ثبوت نہیں ہے۔"
  tr: "İbn Kathir, El-Baghawi'den \"dünyalar\" için rivayet edilen sayıları aktarır: Vahb ibn Munabbih'den on sekiz bin dünya ve bu dünya da onlardan biridir; Muqatil'den ise seksen bin dünya nakledilir. Aynı sayfada, komşu bir ifadeyi garip ve sağlam delil gerektiren bir ifade olarak nitelendirmiş ve baskının editörü de bu tür sayılar için sağlam bir delil bulunmadığına dikkat çekmiştir."
  id: "Ibn Kathir mengutip dari Al-Baghawi angka-angka yang diriwayatkan untuk “dunia”: berdasarkan riwayat Wahb ibn Munabbih, delapan belas ribu dunia dan dunia ini adalah salah satunya, dan berdasarkan riwayat Muqatil, delapan puluh ribu; dan pada halaman yang sama ia menggambarkan pernyataan yang berdekatan sebagai aneh dan membutuhkan bukti yang kuat, dan editor edisi tersebut menunjukkan bahwa tidak ada bukti yang kuat untuk angka-angka tersebut."
