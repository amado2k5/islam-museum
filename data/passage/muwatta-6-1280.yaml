label: { ar: "الموطأ 1280 — مالك في الصرورة من النساء التي لم تحج قط: إن لم يكن لها ذو محرم أو لم يستطع أن يخرج معها، فلا تترك فريضة الحج، وتخرج في جماعة من النساء", en: "Muwatta 1280" }
summary:
  ar: "يقول مالك في الصرورة من النساء، التي لم تحج قط، إنها إن لم يكن لها ذو محرم يخرج معها، أو كان لها فلم يستطع أن يخرج معها، فإنها لا تترك فريضة الله عليها في الحج، ولتخرج في جماعة من النساء. {cite:muwatta-maruf-1997 p.569}"
