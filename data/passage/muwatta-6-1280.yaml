label: { ar: "الموطأ 1280 — مالك في الصرورة من النساء التي لم تحج قط: إن لم يكن لها ذو محرم أو لم يستطع أن يخرج معها، فلا تترك فريضة الحج، وتخرج في جماعة من النساء", en: "Muwatta 1280", es: "Muwatta 1280", fr: "Muwatta 1280", ur: "موطا 1280", tr: "El-Muvatta 1280 — Malik, daha önce hiç Hac yapmamış bir kadın hakkında: Eğer erkek bir vasisi yoksa veya vasisi ona eşlik edemiyorsa, Hac yükümlülüğünü ihmal etmemeli ve kadınlardan oluşan bir grupla birlikte yola çıkmalıdır.", id: "Al-Muwatta 1280 — Malik tentang seorang wanita yang belum pernah menunaikan ibadah haji: Jika dia tidak memiliki wali laki-laki atau walinya tidak mampu menemaninya, dia tidak boleh mengabaikan kewajiban haji, dan dia harus pergi dalam kelompok wanita." }
summary:
  ar: "يقول مالك في الصرورة من النساء، التي لم تحج قط، إنها إن لم يكن لها ذو محرم يخرج معها، أو كان لها فلم يستطع أن يخرج معها، فإنها لا تترك فريضة الله عليها في الحج، ولتخرج في جماعة من النساء. {cite:muwatta-maruf-1997 p.569}"
  tr: "Malik, daha önce hiç Hac yapmamış bir kadın hakkında şöyle der: Eğer ona eşlik edecek erkek bir vasisi yoksa veya varsa da ona eşlik edemiyorsa, o zaman Hac ibadetini ihmal etmemeli ve bir kadın grubuyla birlikte yolculuk etmelidir. {cite:muwatta-maruf-1997 s.569}"
  id: "Malik berkata mengenai seorang wanita yang belum pernah menunaikan ibadah haji, jika ia tidak memiliki wali laki-laki untuk menemaninya, atau jika ia memiliki wali tetapi wali tersebut tidak dapat menemaninya, maka ia tidak boleh mengabaikan kewajiban agamanya untuk menunaikan ibadah haji, dan ia harus melakukan perjalanan haji bersama sekelompok wanita. {cite:muwatta-maruf-1997 p.569}"
