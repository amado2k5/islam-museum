text: "… الحوامل ويحفظ الجنين : سفوف الترياق مثروديطوس، شيلثا فيما يقال، القفطارغان، فيروزنوش أقراص. : وعرق النسا والنقرس المفاصل فيما ينفع أوجاع سوطيرا، شيلثا فيما يقال، معجون الفلاسفة، معجون هرمس، أنقرديا، معجون البزور، أيارج أركاغانيس، تيادريطوس جوارشن السقمونيا، ضماد جوارشن هندي، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 526، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 526, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 526 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
