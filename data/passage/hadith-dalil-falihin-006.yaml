text: "م من دعا إلى ضلالة وفي غيرهما (٢٦٢/٦ و ١٦٩/١٢). وأخرجه مسلم في كتاب: القسامة، باب: بيان إثم من سن القتل (الحديث: ٢٧) . (٤) سورة الأنعام، الآية : ١٦٤ . (٣) سورة الحج ، الآية: ٦٧ ، والقصص، الآية"
