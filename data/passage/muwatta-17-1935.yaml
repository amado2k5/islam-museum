label: { ar: "الموطأ 1935 — يحيى عن مالك: بلغه أن رسول الله نهى عن بيعتين في بيعة", en: "Muwatta 1935", es: "Muwatta 1935", fr: "Muwatta 1935", ur: "موطا 1935", tr: "El-Muvatta 1935 — Yahya, Malik'ten rivayetle: Allah Resulü'nün bir satışta iki satışı yasakladığı kendisine bildirilmiştir.", id: "Al-Muwatta 1935 — Yahya berdasarkan riwayat Malik: Dia diberitahu bahwa Rasulullah melarang dua penjualan dalam satu penjualan." }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن رسول الله نهى عن بيعتين في بيعة. ويذكر المحقق قول ابن عبد البر إن الحديث يتصل ويستند من حديث ابن عمر وأبي هريرة وابن مسعود عن النبي من وجوه صحاح. {cite:muwatta-maruf-1997 p.192}"
  tr: "Yahya, Malik'ten rivayetle, Allah Resulü'nün bir işlemde iki satış yapılmasını yasakladığını işittiğini aktarır. Araştırmacı, İbn Abdül-Barr'ın bu hadisin İbn Ömer, Ebu Hurayra ve İbn Mes'ud'dan Peygamber'den rivayetlerle sahih isnad zincirleriyle bağlantılı ve desteklendiği yönündeki ifadesini aktarır. {cite:muwatta-maruf-1997 s.192}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Rasulullah SAW melarang dua penjualan dalam satu transaksi. Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits tersebut terkait dan didukung oleh riwayat dari Ibnu Umar, Abu Hurairah, dan Ibnu Mas'ud dari Nabi melalui sanad yang sahih. {cite:muwatta-maruf-1997 p.192}"
