label: { ar: "سنن النسائي 4234 — ما حُرّم", en: "Sunan al-Nasa'i 4234 — what was made unlawful", ur: "سنن نسائی 4234 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 4234 — lo que se declaró ilícito", fr: "Sunan al-Nasa'i 4234 — ce qui a été déclaré illicite" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، عَنْ مَيْمُونَةَ، أَنَّ النَّبِيَّ مَرَّ عَلَى شَاةٍ مَيِّتَةٍ مُلْقَاةٍ فَقَالَ \" لِمَنْ هَذِهِ \". فَقَالُوا لِمَيْمُونَةَ. فَقَالَ \" مَا عَلَيْهَا لَوِ انْتَفَعَتْ بِإِهَابِهَا \". قَالُوا إِنَّهَا مَيْتَةٌ. فَقَالَ \" إِنَّمَا حَرَّمَ اللَّهُ عَزَّ وَجَلَّ أَكْلَهَا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4234، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4234 (The Book of al-Fara' and al-'Atirah), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4234، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4234 (El Libro de al-Fara' y al-'Atirah), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4234 (Le Livre d'al-Fara' et d'al-'Atirah), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
