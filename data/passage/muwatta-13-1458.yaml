label: { ar: "الموطأ 1458 — مالك: الجد أبو الأب لا يرث مع الأب شيئا، ويفرض له السدس مع الولد الذكر أو ولد الابن الذكر", en: "Muwatta 1458", es: "Muwatta 1458", fr: "Muwatta 1458", ur: "موطا 1458", tr: "El-Muvatta 1458 — Malik: Baba tarafından dede, babadan hiçbir miras almaz, ancak erkek çocuk veya erkek torun durumunda altıda bir oranında miras hakkına sahiptir.", id: "Al-Muwatta 1458 — Malik: Kakek dari pihak ayah tidak mewarisi apa pun bersama ayah, tetapi ia berhak atas seperenam bagian jika memiliki anak laki-laki atau cucu laki-laki." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم والذي أدرك عليه أهل العلم ببلدهم أن الجد أبا الأب لا يرث مع الأب دنيا شيئا، ويفرض له مع الولد الذكر، ومع ابن الابن الذكر، السدس فريضة. وهو فيما سوى ذلك، ما لم يترك المتوفى أخا أو أختا لأبيه، يبدأ بمن شركه من أهل الفرائض فيعطون فرائضهم، فإن فضل بعدهم السدس فما فوقه كان له، وإلا فرض له السدس. {cite:muwatta-maruf-1997 p.12}"
  tr: "Malik, aralarındaki yerleşik uygulamanın ve ülkelerinin âlimlerinin anlayışının, babanın yanında dedenin hiçbir şey miras almadığı yönünde olduğunu söylüyor. Erkek çocuk veya erkek torun varsa, sabit pay olarak altıda bir oranında hak kazanır. Diğer tüm durumlarda, ölenin baba tarafından bir erkek veya kız kardeşi yoksa, önce kendisiyle birlikte sabit payı paylaşanlarla başlar ve onlara kendi payları verilir. Altıda bir veya daha fazla bir kalan varsa, bu da ona geçer; aksi takdirde, altıda bir oranında hak kazanır. {cite:muwatta-maruf-1997 s.12}"
  id: "Malik mengatakan bahwa praktik yang lazim di antara mereka, dan yang dipahami oleh para ulama di negeri mereka, adalah bahwa kakek dari pihak ayah tidak mewarisi apa pun jika ayah masih hidup. Ia berhak atas seperenam sebagai bagian tetap jika ada anak laki-laki atau cucu laki-laki. Dalam semua kasus lain, kecuali jika almarhum meninggalkan saudara laki-laki atau perempuan dari pihak ayah, ia memulai dengan mereka yang memiliki bagian tetap bersamanya, dan mereka diberikan bagian masing-masing. Jika ada sisa seperenam atau lebih, maka itu menjadi miliknya; jika tidak, ia berhak atas seperenam. {cite:muwatta-maruf-1997 p.12}"
