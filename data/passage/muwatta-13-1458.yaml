label: { ar: "الموطأ 1458 — مالك: الجد أبو الأب لا يرث مع الأب شيئا، ويفرض له السدس مع الولد الذكر أو ولد الابن الذكر", en: "Muwatta 1458" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم والذي أدرك عليه أهل العلم ببلدهم أن الجد أبا الأب لا يرث مع الأب دنيا شيئا، ويفرض له مع الولد الذكر، ومع ابن الابن الذكر، السدس فريضة. وهو فيما سوى ذلك، ما لم يترك المتوفى أخا أو أختا لأبيه، يبدأ بمن شركه من أهل الفرائض فيعطون فرائضهم، فإن فضل بعدهم السدس فما فوقه كان له، وإلا فرض له السدس. {cite:muwatta-maruf-1997 p.12}"
