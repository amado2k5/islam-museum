label: { ar: "الموطأ 1789 — مالك: الأمر المجتمع عليه أن المبتاع إذا اشترط مال العبد فهو له، نقدا كان أو دينا أو عرضا، وأن مال العبد ليس فيه زكاة على سيده، وإن عتق العبد أو كاتب تبعه ماله، وإن أفلس أخذ الغرماء ماله ولم يتبع سيده بشيء", en: "Muwatta 1789" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن المبتاع إذا اشترط مال العبد فهو له، نقدا كان أو دينا أو عرضا، يعلم أو لا يعلم. وإن كان للعبد من المال أكثر مما اشترى به، كان ثمنه نقدا أو دينا أو عرضا، وذلك أن مال العبد ليس على سيده فيه زكاة. وإن كانت للعبد جارية استحل فرجها بملكه إياها. وإن عتق العبد أو كاتب تبعه ماله. وإن أفلس أخذ الغرماء ماله، ولم يتبع سيده بشيء من دينه. {cite:muwatta-maruf-1997 p.133}"
