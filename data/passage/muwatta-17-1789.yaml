label: { ar: "الموطأ 1789 — مالك: الأمر المجتمع عليه أن المبتاع إذا اشترط مال العبد فهو له، نقدا كان أو دينا أو عرضا، وأن مال العبد ليس فيه زكاة على سيده، وإن عتق العبد أو كاتب تبعه ماله، وإن أفلس أخذ الغرماء ماله ولم يتبع سيده بشيء", en: "Muwatta 1789", es: "Muwatta 1789", fr: "Muwatta 1789", ur: "موطا 1789", tr: "El-Muvatta 1789 — Malik: İttihat şudur ki, alıcı kölenin malının mülkiyetini şart koşarsa, ister nakit, ister borç, ister mal olsun, o mal ona aittir. Kölenin malı, efendisinin malına uygulanan zekâta tabi değildir. Köle azat edilirse veya azat sözleşmesi yaparsa, malı da onunla birlikte gelir. İflas ederse, alacaklılar malına el koyar ve efendisine karşı herhangi bir işlem yapmazlar.", id: "Al-Muwatta 1789 — Malik: Konsensusnya adalah jika pembeli menetapkan kepemilikan harta milik budak, maka harta itu menjadi miliknya, baik berupa uang tunai, hutang, atau barang. Harta milik budak tidak dikenakan zakat atas harta milik tuannya. Jika budak dibebaskan atau mengadakan perjanjian pembebasan, hartanya akan tetap bersamanya. Jika ia bangkrut, para kreditur akan mengambil hartanya dan tidak akan menuntut apa pun dari tuannya." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن المبتاع إذا اشترط مال العبد فهو له، نقدا كان أو دينا أو عرضا، يعلم أو لا يعلم. وإن كان للعبد من المال أكثر مما اشترى به، كان ثمنه نقدا أو دينا أو عرضا، وذلك أن مال العبد ليس على سيده فيه زكاة. وإن كانت للعبد جارية استحل فرجها بملكه إياها. وإن عتق العبد أو كاتب تبعه ماله. وإن أفلس أخذ الغرماء ماله، ولم يتبع سيده بشيء من دينه. {cite:muwatta-maruf-1997 p.133}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur: Alıcı, kölenin malının kendisine ait olduğunu, ister nakit, ister borç, isterse mal olsun, beyan ederse ve bunun farkında olsun ya da olmasın, köle satılmış sayılır. Kölenin satın alındığı fiyattan daha fazla malı varsa, ister nakit, ister borç, isterse mal olsun, fiyat aynıdır; çünkü kölenin malı efendisi tarafından zekâta tabi değildir. Kölenin dişi bir kölesi varsa, ona sahip olma hakkı nedeniyle onunla cinsel ilişkiye girebilir. Köle azat edilirse veya azat sözleşmesi yaparsa, malı da onunla birlikte gider. İflas ederse, alacaklıları malına el koyar ve efendisi borçlarından sorumlu tutulmaz. {cite:muwatta-maruf-1997 s.133}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah jika pembeli menetapkan bahwa harta milik budak itu menjadi miliknya, baik berupa uang tunai, hutang, atau barang, dan terlepas dari apakah ia menyadarinya atau tidak. Jika budak tersebut memiliki harta lebih banyak daripada yang dibeli, harganya tetap sama, baik berupa uang tunai, hutang, atau barang, karena harta budak tersebut tidak dikenakan zakat oleh tuannya. Jika seorang budak memiliki budak perempuan, ia boleh melakukan hubungan seksual dengannya berdasarkan kepemilikannya atas budak tersebut. Jika budak tersebut dibebaskan atau mengadakan perjanjian pembebasan, hartanya akan tetap bersamanya. Jika ia bangkrut, para krediturnya akan mengambil hartanya, dan tuannya tidak bertanggung jawab atas hutang-hutangnya. {cite:muwatta-maruf-1997 p.133}"
