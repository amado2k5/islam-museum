label: { ar: "الموطأ 1295 — مالك: الإشارة بالأمان بمنزلة الكلام، وقول ابن عباس: ما خفر قوم بالعهد إلا سلط الله عليهم العدو", en: "Muwatta 1295", es: "Muwatta 1295", fr: "Muwatta 1295", ur: "موطا 1295", tr: "El-Muvatta 1295 — Malik: Güvence işareti söze eşdeğerdir ve İbn Abbas şöyle demiştir: Hiçbir topluluk bir ahdi bozmamıştır ki, Allah onların düşmanlarına karşı güç vermesin.", id: "Al-Muwatta 1295 — Malik: Isyarat keselamatan sama nilainya dengan ucapan, dan Ibnu Abbas berkata: Tidak ada suatu kaum pun yang melanggar perjanjian kecuali Allah memberikan kekuasaan kepada musuh mereka atas mereka." }
text: "مَا خَترَ قَوْمٌ بِالْعَهْدِ، إِلَّا سَلَّطَ اللّهُ عَلَيْهِمُ الْعَدُوَّ"
summary:
  ar: "سئل مالك عن الإشارة بالأمان، أهي بمنزلة الكلام؟ فقال نعم، وأرى أن يتقدم إلى الجيوش أن لا يقتلوا أحدا أشاروا إليه بالأمان، لأن الإشارة عنده بمنزلة الكلام. وبلغه أن عبد الله بن عباس قال ما خفر قوم بالعهد إلا سلط الله عليهم العدو. ويذكر المحقق أن ابن عبد البر قال إن معنى الحديث يتصل من وجوه صحاح، منها حديث بريدة الأسلمي في صحيح مسلم. {cite:muwatta-maruf-1997 p.578}"
  tr: "Malik'e, güvenli geçiş jestinin konuşmaya eşdeğer olup olmadığı soruldu. O da, \"Evet, ve bence ordulara, güvenli geçiş jesti verdikleri kimseyi öldürmemeleri emredilmelidir, çünkü ona göre bir jest konuşmaya eşdeğerdir\" diye cevap verdi. Abdullah ibn Abbas'ın, \"Hiçbir topluluk, Allah'ın düşmanlarına kendileri üzerinde güç vermediği bir ahit bozmamıştır\" dediği kendisine bildirildi. Araştırmacı, İbn Abd al-Barr'ın hadisin anlamının, Sahih Muslim'deki Buraydah al-Aslami hadisi de dahil olmak üzere birçok sahih rivayet zinciriyle desteklendiğini söylediğini belirtiyor. {cite:muwatta-maruf-1997 s.578}"
  id: "Malik ditanya tentang isyarat jalan aman: apakah itu setara dengan ucapan? Dia menjawab, \"Ya, dan saya percaya bahwa pasukan harus diinstruksikan untuk tidak membunuh siapa pun yang telah mereka beri isyarat jalan aman, karena menurut pandangannya, isyarat itu setara dengan ucapan.\" Dia diberitahu bahwa Abdullah ibn Abbas berkata, \"Tidak ada suatu kaum pun yang pernah melanggar perjanjian tanpa Allah memberikan kekuasaan kepada musuh mereka atas mereka.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa makna hadits tersebut didukung oleh beberapa sanad sahih, termasuk hadits Buraydah al-Aslami dalam Sahih Muslim. {cite:muwatta-maruf-1997 p.578}"
