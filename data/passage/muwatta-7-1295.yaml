label: { ar: "الموطأ 1295 — مالك: الإشارة بالأمان بمنزلة الكلام، وقول ابن عباس: ما خفر قوم بالعهد إلا سلط الله عليهم العدو", en: "Muwatta 1295" }
text: "مَا خَترَ قَوْمٌ بِالْعَهْدِ، إِلَّا سَلَّطَ اللّهُ عَلَيْهِمُ الْعَدُوَّ"
summary:
  ar: "سئل مالك عن الإشارة بالأمان، أهي بمنزلة الكلام؟ فقال نعم، وأرى أن يتقدم إلى الجيوش أن لا يقتلوا أحدا أشاروا إليه بالأمان، لأن الإشارة عنده بمنزلة الكلام. وبلغه أن عبد الله بن عباس قال ما خفر قوم بالعهد إلا سلط الله عليهم العدو. ويذكر المحقق أن ابن عبد البر قال إن معنى الحديث يتصل من وجوه صحاح، منها حديث بريدة الأسلمي في صحيح مسلم. {cite:muwatta-maruf-1997 p.578}"
