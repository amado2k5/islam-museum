label: { ar: "مسلم 2693 — من قال لا إله إلا الله وحده لا شريك له عشر مرات كان كمن أعتق أربعة أنفس", en: "Muslim 2693 — Ten tahlilas weigh as freeing four souls", es: "Musulmán 2693 — Diez tahlilas equivalen a liberar cuatro almas", fr: "Muslim 2693 — Dix tahlilas équivalent à la libération de quatre âmes", ur: "مسلم 2693 - دس تہلیل چار جانوں کو آزاد کرنے کے برابر ہیں۔", tr: "Müslim 2693 — “Allah’tan başka ilah yoktur, O’nun tek ortağı yoktur” sözünü on defa söyleyen kimse, dört köleyi azat etmiş gibidir.", id: "Muslim 2693 — Barang siapa mengucapkan “Tidak ada Tuhan selain Allah Yang Maha Esa, tanpa sekutu” sepuluh kali, maka ia seperti orang yang telah membebaskan empat budak." }
text: "قال رسول الله: «من قال لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، عشر مرات؛ كان كمن أعتق أربعة أنفس من ولد إسماعيل»"
summary:
  ar: "رواية أبي أيوب الأنصاري عبر عمرو بن ميمون في كتاب الذكر والدعاء من صحيح مسلم؛ فضل التهليلة بالعشر كعتق أربع رقاب من ولد إسماعيل."
  tr: "Sahih Müslim'de yer alan Dua ve Anma Kitabı'nda Ebu Eyyub el-Ensari'nin Amr ibn Maymun'dan rivayet ettiğine göre: \"La ilaha illallah\"ı on defa söylemenin fazileti, İsmail soyundan dört köleyi azat etmek gibidir."
  id: "Diriwayatkan oleh Abu Ayyub al-Ansari melalui Amr ibn Maymun dalam Kitab Zikir dan Doa dari Sahih Muslim: Keutamaan mengucapkan “La ilaha illallah” sepuluh kali adalah seperti membebaskan empat budak dari keturunan Ismail."
