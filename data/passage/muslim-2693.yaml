text: "قال رسول الله: «من قال لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، عشر مرات؛ كان كمن أعتق أربعة أنفس من ولد إسماعيل»"
summary:
  ar: "رواية أبي أيوب الأنصاري عبر عمرو بن ميمون في كتاب الذكر والدعاء من صحيح مسلم؛ فضل التهليلة بالعشر كعتق أربع رقاب من ولد إسماعيل."
