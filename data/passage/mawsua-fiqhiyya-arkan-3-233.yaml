text: "… واجب على كل مكلف. وقال الإمام أحمد: إن ترك الإنكار بالقلب كفر لحديث وهو أضعف الإيمان الذي يدل على وجوب إنكار المنكر بحسب الإمكان والقدرة عليه، فالإنكار بالقلب لا بد منه فمن لم ينكر قلبه المنكر دل على ذهاب الإيمان …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 3، ص 233، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 3, p. 233, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 3، ص 233 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 3, pág. 233, que menciona la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de l'Encyclopédie koweïtienne de Fiqh (numérisée, volume 3, p. 233) évoque la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 3, sayfa 233'ten bir alıntı, imanın tatlılığı ve mükemmelliğinden bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 3 Bergambar, halaman 233, menyebutkan kemanisan dan kesempurnaan iman; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
