text: "مخلوق . ثم وجه إسحاق بن إبراهيم بجواباتهم الى المأمون . فورد عليه كتاب المأمون: بلقنا ما أجاب به متصعة أهل القبلة ومحمسو الرياسة فيا ليسوا له بأهل؛ فن لم يجب بأنه مخلوق فآمنعه من الفتوى والرواية . ثم قال"
