text: "… حارة، وأما الباردة فإنها تحصر الامتلاء وتحفظه بحاله. الثانية عشر: الامتلاء يداوى بالاستفراغ الدمري وبالحمام والدلك والتزامه وقلة الغذاء والأدوية المحللة. قال: والمحموم لا يمكن استفراغه من امتلائه إلا بالفصد والإسهال وحسم الغذاء. الأولى من الأخلاط: استفرغ الأخلاط نم حيث …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 896، يذكر الحمى والوعك، وأسماء الأمراض، والبيمارستان وصناعة الطب، والجراحة والختان والجبائر، والدواء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
