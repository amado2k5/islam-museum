text: "… على اللّٰه عونهم ثلاث لا يعجزهن ابن آدم ثلاث خصال تتناثر الرحمة عليه ثلاث هن عليّ فريضة، ولكم تطوع ثلاث من كن فيه ؛ أعجبنني ثلاث من كن فيه ؛ اهلكته ثلاث من كن فيه ؛ وجد بهن حلاوة الإيمان …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 6112، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 6112, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 6112 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
