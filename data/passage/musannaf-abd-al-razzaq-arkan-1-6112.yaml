text: "… على اللّٰه عونهم ثلاث لا يعجزهن ابن آدم ثلاث خصال تتناثر الرحمة عليه ثلاث هن عليّ فريضة، ولكم تطوع ثلاث من كن فيه ؛ أعجبنني ثلاث من كن فيه ؛ اهلكته ثلاث من كن فيه ؛ وجد بهن حلاوة الإيمان …"
summary:
