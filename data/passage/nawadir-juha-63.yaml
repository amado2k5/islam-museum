text: "… لا تسموا أولادكم أيوب طلع على المنبر يوماً وقال: أيّها المسلمون، لا أُريدُ أَنْ أعِظَكم بشيء.. إيَّاكم أنْ تُسمُّوا أبناءَكم باسم أيوبَ، لأنه بتكراره يصير إيب، - ومعنى إيب بالتركية حبل. رجلي اليسرى غير متوضئة توضاً ذاتَ يوم، وكان الماءُ …"
summary:
  ar: "حذّر جحا من المنبر من تسمية الأبناء أيوب، لأن الاسم إذا تكرر بدا كأنه «إيب»، وهي تعني الحبل بالتركية. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  en: "From the pulpit Juha warns against naming children Ayyub, because repeated it sounds like 'Eeb', which means rope in Turkish. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  ur: "جحا نے منبر سے خبردار کیا کہ بچوں کا نام ایوب نہ رکھا جائے، کیونکہ بار بار دہرانے پر یہ «ایپ» سنائی دیتا ہے جس کا ترکی میں مطلب رسی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  fr: "Du haut de la chaire, Juha déconseille de donner aux enfants le nom d'Ayyub, parce que, répété, il sonne comme «Eeb», qui signifie corde en turc. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  es: "Desde el púlpito, Juha advierte contra poner a los niños el nombre de Ayyub, porque repetido suena como «Eeb», que significa cuerda en turco. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
