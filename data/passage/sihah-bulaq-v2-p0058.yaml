text: |-
  ,•⁦(لاب الواو والياء)⁩*
  ٥٢٩
  كالزبيسة يقال من حفره فواة وقع فيها ⁦(غيا)⁩ الفياية ضوءشعاع الشمس وليس هو
  نفس الشعاع قال لبيد• وعلى الارض غيايات الطف-ل • وغباية البترقه رها مشسل الغيابة
  أبو عر والغياية كل شئ أظل" الانسان فوق رأسه مثل السحابة والغبرة والظلة ونحوذلك
  وفى الحديث تجى* البقرة وآل عمران يوم القيامة لأنهما غمامتان أوغيايتان وغايا القوم
  فوق رأس فلان بالسيف كأنهم أظلوه به عن الاصعى والغساية مدى الشى وابهع غاى مثل
  ساعة وساع والغاية الراية يقال غيت غاية وأغميت اذانصبتهاءن آبى عبيد ويقال فلان
  فيه وهونة. ض قولك لرشدة
  قص ل أفا ( ف أبوزيد فأوت رأس الرجل فأوا وفأيه فأبااذا فلقته
  بالسيف وقال *حتى انفأى الفأوعن أعناقها-صرا* وانفأى القدح انشق والفأومابين
  الجبلين والفئة الطائفة والجمع فتون والهاء، وض من الياء قال الكميت
  تزى منه بجاجهم فينا* أى فرقا متفرقة تى) الفتى الشاب والفتاة الشابة وقدقتى
  بالكسر يفتى فتى فهوفىّ السن بين الفتاء وقد ولدله فى فتاءسنه أولاد وقال
  اذاعاش الفتى ما ئتين عاما • فقد ذهب المذاذة والمتاء
  والأفتاء من الدواب خلاف المسان واحدهافتىّ مثل يتيم وأيتام ويقال لفلانة بنت تفتت
  أى تشبهت بالفتيات وهى أصغر هنّ وفتيت الجارية تفتية اذا خذرت و-سترت ومنعت
  اللعب مع المبيان وقول الاسود
  ما بعدزيد فى فتاة فرقوا • قتلاوسيا بعدحسن تادى
  يعنى أنهم قتسلوا بسبب جارية وذلك أنّ بعضالموكك خطب الى زيدين مالك الاصفربن
  حنظلة بن مالات الاكبر أوالى بعضر ولده ابنة له يقال لها أتم كهف فلم يزوجه فغزاهم فقتلهم
  وزيدههنا قبيلة والفتى السخى الكريم يقسال هوقتى بين الفتوّة وقد تفتى وتفاتى والجمع
  فتيان وفتية وفتو على فعول وفتى مثل عصىّ وقال جذيمة
  فى فتو أنارابتهم * من كلال غزوة ماتوا
  قال سيبويه أبدلوا الواوفى الجمع والمصدربد لاشاذاويقال لا أفه لهما اختلف الفتيان يعنى
  الليل والنهار كما يقال ما اختاف الاحسدان والجديدان واستفتيت الفقيه فى مسئلة فأنتانى
  والاسم الفتدا والفتوى وتفاتوا الى الفقيه اذا ارتفعوا اليه فى الفتياء فجا) الفجوة الفرجة
  والمتسع بين الشيئين تقول منه تفاجى الشئ أى صارله فجوة وفجوة الدارساحتها والفجاتباعد
  مابين عرقوبى البعير وقوس فجوا. اذابان وترها عن كبدها وفجوتّها أنا فجوا اذا رفعت
  وترها عن كبدهارفجيت هى بالكسر تفجى فيا وقال • لا فحج يرى بها ولا فيا* ( ا فحوى
  القول معناه ولحنه يقال عرفت ذل فى فحوى كلامه وفى فحواء كلامه ممدود اومه ورا وانه
  ليفحى بكلامه الى كذا وكذا والفحامقصور أبزار القدر بكسر الفء والفتح أكثر وابهع
  أفحاء وفى الحديث من أكل فا أرض لم يضره ماؤهايعنى البصل يقال فح قدركك تفعية
  ( فدى الفداء اذا كسر أوله يمدريقصر واذافتح فهومة صور يقال قم فدى لك أبى ومن
  العرب من يكسر قداء بالتنوين اذاجاورلام الجرخاصة فيقول فداءلك لانه نكرة يريدون به
