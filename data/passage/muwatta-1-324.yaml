label: { ar: "الموطأ 324 — بلاغ عن عائشة: من خشي أن ينام فليوتر قبل أن ينام", en: "Muwatta 324", es: "Muwatta 324", fr: "Muwatta 324", ur: "موطا 324", tr: "Al-Muwatta 324 — Aişe'den rivayet: Uykuya dalmaktan korkan kimse uyumadan önce Vitr namazı kılmalıdır.", id: "Al-Muwatta 324 — Sebuah riwayat dari Aisyah: Barangsiapa yang takut tertidur, hendaknya ia mengerjakan salat Witir sebelum tidur." }
text: "من خشي أن ينام حتى يصبح فليوتر قبل أن ينام، ومن رجا أن يستيقظ آخر الليل فليؤخر وتره"
summary:
  ar: "بلاغ في باب الأمر بالوتر: يروي مالك أنه بلغه أن عائشة كانت تقول إن من خشي أن ينام حتى يصبح فليوتر قبل أن ينام، ومن رجا أن يستيقظ آخر الليل فليؤخر وتره. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.183}"
  tr: "Vitr namazının kılınması emriyle ilgili bir rivayet: Malik, Aişe'nin şöyle dediğini işittiğini aktarır: \"Kim sabaha kadar uyuyakalmaktan korkarsa, uyumadan önce vitr namazını kılsın; kim de gecenin sonunda uyanmayı umarsa, vitr namazını geciktirsin.\" Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.183}"
  id: "Sebuah laporan mengenai perintah untuk melaksanakan salat Witir: Malik meriwayatkan bahwa ia mendengar Aisyah biasa berkata, \"Barangsiapa yang khawatir tertidur hingga pagi hendaknya melaksanakan salat Witir sebelum tidur, dan barangsiapa yang berharap bangun di akhir malam hendaknya menunda salat Witirnya.\" Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.183}"
