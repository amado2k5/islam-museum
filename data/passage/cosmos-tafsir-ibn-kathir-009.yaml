text: "وأمَّا أصحاب الرَّسِّ فقال أبن جُرَيْج، قال ابن عبَّاس: هم أهل قريةٍ من قرىٰ ثمود. وقال ابن جريج: قال عكرمة: أصحاب الرَّسِّ بفَلَج وهم أصحاب يس. وقال قتادة: فَلَج مِن قرىٰ اليمامة"
summary:
  ar: "عند ذكر أصحاب الرس في سورة الفرقان يعرض ابن كثير أقوال السلف في تعيينهم: ابن عباس أنهم أهل قرية من قرى ثمود، وعكرمة أنهم بفلج وهم أصحاب يس، وقتادة أن فلجاً من قرى اليمامة؛ ويضيف بعدها خبر البئر وأن ابن جرير لم يجز حمل الرس على هؤلاء."
  en: "Where sura al-Furqan mentions the People of al-Rass, Ibn Kathir lists the early identifications: Ibn Abbas says a village of Thamud's villages, Ikrima says at Falaj and that they are the people of Ya Sin, and Qatada says Falaj is a village of al-Yamama. He goes on to the well report and to Ibn Jarir's refusal to apply the name to the people in that report."
  es: "Donde la sura al-Furqan menciona al Pueblo de al-Rass, Ibn Kathir enumera las primeras identificaciones: Ibn Abbas dice que es una aldea de las aldeas de Thamud, Ikrima dice que es en Falaj y que son el pueblo de Ya Sin, y Qatada dice que Falaj es una aldea de al-Yamama. Luego pasa al relato del pozo y a la negativa de Ibn Jarir a aplicar ese nombre al pueblo mencionado en dicho relato."
  fr: "Lorsque la sourate al-Furqan mentionne les gens d'al-Rass, Ibn Kathir recense les premières identifications: Ibn Abbas parle d'un village appartenant à la dynastie Thamud; Ikrima les situe à Falaj et les désigne comme les habitants de Ya Sin; et Qatada situe Falaj au village d'al-Yamama. Il poursuit en évoquant le récit du puits et le refus d'Ibn Jarir d'attribuer ce nom aux personnes mentionnées dans ce récit."
  ur: "جہاں سورۃ الفرقان میں اہل الراس کا ذکر ہے، ابن کثیر نے ابتدائی شناختوں کی فہرست دی ہے: ابن عباس کہتے ہیں ثمود کے دیہاتوں کا ایک گاؤں، عکرمہ کہتے ہیں فلج میں اور وہ لوگ یا سین ہیں، اور قتادہ کہتے ہیں کہ فلج یمامہ کا ایک گاؤں ہے۔ وہ کنویں کی رپورٹ اور ابن جریر کے اس رپورٹ میں لوگوں کا نام لگانے سے انکار کی طرف جاتا ہے۔"
