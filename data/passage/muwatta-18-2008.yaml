label: { ar: "الموطأ 2008 — مالك عن العلاء بن عبد الرحمن عن أبيه عن جده: أعطاه عثمان بن عفان مالا قراضا يعمل فيه، على أن الربح بينهما", en: "Muwatta 2008", es: "Muwatta 2008", fr: "Muwatta 2008", ur: "موطا 2008", tr: "Al-Muwatta 2008 — Malik, Al-Ala’ ibn Abd al-Rahman’dan, o da babasından, o da dedesinden rivayet ettiğine göre: Osman ibn Affan ona yatırım için para verdi; bu para kâr paylaşımı için kullanılacak ve kâr aralarında paylaşılacaktı.", id: "Al-Muwatta 2008 — Malik, berdasarkan riwayat Al-Ala’ ibn Abd al-Rahman, berdasarkan riwayat ayahnya, berdasarkan riwayat kakeknya: Uthman ibn Affan memberinya uang untuk investasi, yang akan digunakan untuk pembagian keuntungan, dengan keuntungan tersebut dibagi di antara mereka." }
summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن عن أبيه عن جده أن عثمان بن عفان أعطاه مالا قراضا يعمل فيه، على أن الربح بينهما. {cite:muwatta-maruf-1997 p.222}"
  tr: "Malik, Alaa bin Abdülrahman'dan, o da babasından, o da dedesinden rivayet ederek, Osman bin Affan'ın kendisine yatırım yapması için para verdiğini ve kârın aralarında paylaşılacağını naklettiğini bildirir. {cite:muwatta-maruf-1997 s.222}"
  id: "Malik meriwayatkan dari Alaa bin Abd al-Rahman, dari ayahnya, dari kakeknya, bahwa Uthman bin Affan memberinya uang untuk investasi, dengan keuntungan yang akan dibagi di antara mereka. {cite:muwatta-maruf-1997 p.222}"
