text: "… أَقْتَابُ بَطْنِهِ فَيَدُوُرُ بِهَا كَمَا يَدُوُرُ الْحِمَارُ فِي الرَّحَا فَيَجْتَمِعُ إِلَيْهِ هُلُ التَّارِ فَيَقُوْلُونَ يَاقُلَاتُ مَالَتَ ؟ أَلَمْ تَكُ تَأْمُرُ بِالْمَعْرُوُفِ وَتَنْعَى عَنِ الْمُنْكَرِ؟ فَيَتُولٌ: بَلى كُنْتُ آمُرْ بِالْمَعْرُوفِ وَلَا آتِيْهِ وَأَنْهى عَنْ انْمُنْكَرِ وَآتِيْهِ ترجمه: حضرتِ سَيّدَنا الوزيد اسامه …"
summary:
  ar: "مقطع من رياض الصالحين، المجلد المصوَّر 4، ص 118، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Riyad al-Salihin, scan volume 4, p. 118, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ریاض الصالحین، اسکین جلد 4، ص 118 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin, volume numérisé 4, p. 118, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Riyad al-Salihin, volumen escaneado 4, p. 118, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Riyad as-Salihin, Resimli Cilt 4, sayfa 118'den bir alıntı; bir ağıt ve ölüm ilanı içeriyor; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
