label: { ar: "الموطأ 587 — لا يتحر أحدكم فيصلي عند طلوع الشمس ولا عند غروبها", en: "Muwatta 587", es: "Muwatta 587", fr: "Muwatta 587", ur: "موطا 587", tr: "Al-Muwatta 587 — Hiçbiriniz güneş doğarken veya güneş batarken namaz kılmamalısınız.", id: "Al-Muwatta 587 — Tidak seorang pun di antara kalian boleh shalat pada waktu matahari terbit atau terbenam." }
text: "لا يتحر أحدكم فيصلي عند طلوع الشمس، ولا عند غروبها"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي نهى أن يتحرى أحد الصلاة عند طلوع الشمس أو عند غروبها. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (1548) والبغوي، وسويد، والقعنبي ومن طريقه أبو عوانة والجوهري، وابن وهب، والتنيسي عند البخاري (585)، وابن مهدي عند أحمد، وعبد الرزاق (3951)، وقتيبة عند النسائي (1/277)، والشافعي في الرسالة (873)، ومحمد بن الحسن الشيباني (19)، ويحيى بن يحيى النيسابوري عند مسلم (2/207). {cite:muwatta-maruf-1997 p.302} {cite:muwatta-maruf-1997 p.303}"
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, bahwa Nabi (shalawat dan salam kepadanya) melarang siapa pun untuk sengaja memilih shalat saat matahari terbit atau terbenam. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan dari sanadnya oleh Ibn Hibban (1548), al-Baghawi, Suwaid, al-Qa’nabi, dan dari sanadnya oleh Abu ‘Awanah, al-Jawhari, Ibn Wahb, dan al-Tunisi dalam al-Bukhari (585), Ibn Mahdi dalam Ahmad, Abd al-Razzaq (3951), Qutaybah dalam al-Nasa’i (1/277), al-Shafi’i dalam al-Risalah (873), Muhammad ibn al-Hasan al-Shaybani (19), dan Yahya ibn Yahya al-Naysaburi dalam Muslim (2/207). {kutip:muwatta-maruf-1997 hal.302} {kutip:muwatta-maruf-1997 hal.303}"
