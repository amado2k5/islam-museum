text: "لا يتحر أحدكم فيصلي عند طلوع الشمس، ولا عند غروبها"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي نهى أن يتحرى أحد الصلاة عند طلوع الشمس أو عند غروبها. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (1548) والبغوي، وسويد، والقعنبي ومن طريقه أبو عوانة والجوهري، وابن وهب، والتنيسي عند البخاري (585)، وابن مهدي عند أحمد، وعبد الرزاق (3951)، وقتيبة عند النسائي (1/277)، والشافعي في الرسالة (873)، ومحمد بن الحسن الشيباني (19)، ويحيى بن يحيى النيسابوري عند مسلم (2/207). {cite:muwatta-maruf-1997 p.302} {cite:muwatta-maruf-1997 p.303}"
