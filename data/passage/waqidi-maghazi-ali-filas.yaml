label: { ar: "سرية علي بن أبي طالب إلى الفلس", en: "Sariyya of Ali ibn Abi Talib to al-Fils" }
text: "بعث رسول الله علي بن أبي طالب إلى الفلس ليهدمه، في مائة وخمسين من الأنصار، ليس فيها مهاجر واحد"
summary:
  ar: "في أواخر سنة تسع، بعث النبي علي بن أبي طالب في مائة وخمسين رجلا من الأنصار ليس فيها مهاجر واحد ومعهم خمسون فرسا وظهرا، وأمره أن يشن الغارات على الفلس ليهدمه، فخرج بأصحابه معه راية سوداء ولواء أبيض. ويذكر الواقدي خبر الهدم وخبر مسجد الفلس الذي كان قد بناه النبي في السنة الثانية، وقصة الأعرابي الذي وجهه علي ليخطب إلى إحدى بنات عمه."
  en: "Late in year nine the Prophet sent Ali ibn Abi Talib with 150 Ansar — no Emigrant among them — and fifty horses and camels to demolish al-Fils and raid it, Ali carrying a black banner and white standard. The chapter reports the demolition and the mosque the Prophet had built there in year two, and Ali's dispatching an Arab to propose to one of his paternal aunts' daughters."
