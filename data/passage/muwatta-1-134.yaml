text: "ما هي بأول بركتكم يا آل أبي بكر"
summary:
  ar: "أول حديث في باب التيمم. يرويه يحيى عن مالك عن عبد الرحمن بن القاسم عن أبيه القاسم بن محمد عن عائشة أم المؤمنين: خرجت مع النبي في بعض أسفاره، فلما كانوا بالبيداء أو بذات الجيش انقطع عقد لها، فأقام النبي على التماسه وأقام الناس معه وليسوا على ماء ولا معهم ماء، فشكا الناس إلى أبي بكر ما صنعت عائشة، فجاء أبو بكر والنبي نائم واضع رأسه على فخذها فعاتبها وجعل يطعن بيده في خاصرتها وهي لا تتحرك لمكان رأس النبي، فنام النبي حتى أصبح على غير ماء، فأنزل الله آية التيمم، فقال أسيد بن حضير: ما هي بأول بركتكم يا آل أبي بكر. ثم بعثوا البعير الذي كانت عليه فوجدوا العقد تحته. ويخرّجه المحقق عند البخاري ⁦(334، 3672، 4607، 5250، 6844)⁩ ومسلم (1/191) والنسائي (1/163) وابن حبان وابن خزيمة وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (19/265). {cite:muwatta-maruf-1997 p.98} {cite:muwatta-maruf-1997 p.99}"
  tr: "Teyemmüm (kuru abdest) konusundaki ilk hadis, Yahya'nın Malik'ten, o da Abdülrahman ibn el-Kâsım'dan, o da babası el-Kâsım ibn Muhammed'den, o da Müminlerin Annesi Aişe'den rivayet ettiği hadistir: Peygamberimizle bir yolculukta birlikteydim. El-Bayda' veya Dhat el-Ceyş'te iken, Aişe'nin kolyesi koptu. Peygamberimiz kolyeyi aramak için durdu ve insanlar da onunla birlikte durdular, ancak yanlarında su yoktu. İnsanlar Aişe'nin yaptığı şeyden dolayı Ebu Bekir'e şikayet ettiler. Ebu Bekir geldi ve Peygamberimizi başı Aişe'nin dizinde uyurken buldu. Aişe'yi uyardı ve eliyle yanını dürtmeye başladı, ancak Aişe Peygamberimizin başı yüzünden kıpırdamadı. Peygamberimiz sabaha kadar susuz uyudu. Bunun üzerine Allah teyemmüm ayetini indirdi. Usayd ibn Hudeyr, “Ey Ebu Bekir ailesi, bu bahşettiğiniz ilk nimet değil!” dedi. Sonra bindiği deveyi çağırdılar ve kolyeyi devenin altında buldular. Araştırmacı, bunu Buhari (334, 3672, 4607, 5250, 6844), Müslim (1/191), Nesai (1/163), İbn Hibban, İbn Huzeyme, Ahmed ve Şafiî'nin derlemelerinde, Malik'in takipçilerinin rivayet zincirleri aracılığıyla ve Temhid'e (19/265) atıfta bulunarak ele almaktadır. {cite:muwatta-maruf-1997 s.98} {cite:muwatta-maruf-1997 s.99}"
  id: "Hadits pertama tentang tayammum (wudhu kering). Diriwayatkan oleh Yahya dari Malik, dari Abdullah ibn al-Qasim, dari ayahnya, al-Qasim ibn Muhammad, dari Aisyah, Ummul Mukminin: Aku pergi bersama Nabi dalam salah satu perjalanannya. Ketika kami berada di al-Bayda’ atau Dhat al-Jaysh, kalungnya putus. Nabi berhenti untuk mencarinya, dan orang-orang pun ikut bersamanya, tetapi mereka tidak memiliki air. Orang-orang mengadu kepada Abu Bakar tentang apa yang telah dilakukan Aisyah. Abu Bakar datang dan mendapati Nabi tertidur dengan kepala di pahanya. Beliau menasihatinya dan mulai menyenggol sisi tubuhnya dengan tangannya, tetapi Aisyah tidak bergerak karena kepala Nabi. Nabi tidur hingga pagi tanpa air. Kemudian Allah menurunkan ayat tentang tayammum. Usayd bin Hudayr berkata, “Ini bukanlah nikmat pertama yang kalian berikan, wahai keluarga Abu Bakar!” Kemudian mereka memanggil unta yang ditungganginya dan menemukan kalung itu di bawahnya. Peneliti memasukkannya dalam koleksi al-Bukhari (334, 3672, 4607, 5250, 6844), Muslim (1/191), al-Nasa'i (1/163), Ibn Hibban, Ibn Khuzaymah, Ahmad, dan al-Shafi'i, melalui sanad pengikut Malik, dan merujuk pada al-Tamhid (19/265). {cite:muwatta-maruf-1997 p.98} {cite:muwatta-maruf-1997 p.99}"
