text: "ما هي بأول بركتكم يا آل أبي بكر"
summary:
  ar: "أول حديث في باب التيمم. يرويه يحيى عن مالك عن عبد الرحمن بن القاسم عن أبيه القاسم بن محمد عن عائشة أم المؤمنين: خرجت مع النبي في بعض أسفاره، فلما كانوا بالبيداء أو بذات الجيش انقطع عقد لها، فأقام النبي على التماسه وأقام الناس معه وليسوا على ماء ولا معهم ماء، فشكا الناس إلى أبي بكر ما صنعت عائشة، فجاء أبو بكر والنبي نائم واضع رأسه على فخذها فعاتبها وجعل يطعن بيده في خاصرتها وهي لا تتحرك لمكان رأس النبي، فنام النبي حتى أصبح على غير ماء، فأنزل الله آية التيمم، فقال أسيد بن حضير: ما هي بأول بركتكم يا آل أبي بكر. ثم بعثوا البعير الذي كانت عليه فوجدوا العقد تحته. ويخرّجه المحقق عند البخاري (334، 3672، 4607، 5250، 6844) ومسلم (1/191) والنسائي (1/163) وابن حبان وابن خزيمة وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (19/265). {cite:muwatta-maruf-1997 p.98} {cite:muwatta-maruf-1997 p.99}"
