text: "… إلى المكان الذاهب إليه البغل ركب بغلاً حروناً صعبَ المِراس، فلم يُمكِنْهُ سوقُهُ إلى الجهةِ المطلوبة، فصادفَهُ بعضُ أصحابِهِ، فقال له: إلى أين أنت ذاهب أيها الشيخ؟ فأجابه : إلى المكان الذاهب إليه البغل! إلى هنا انتهينا من نوادر الشيخ …"
summary:
  ar: "كان جحا راكباً بغلاً عنيداً فسُئل إلى أين يذهب، فقال «إلى المكان الذاهب إليه البغل». {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  en: "Juha, riding a stubborn mule, is asked where he is going; he says 'to where the mule is going'. {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  ur: "جحا ایک اڑیل خچر پر سوار تھا کہ اس سے پوچھا گیا کہ کہاں جا رہے ہو، تو اس نے کہا «وہیں جہاں خچر جا رہا ہے»۔ {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  fr: "Juha, monté sur une mule têtue, est interrogé sur sa destination ; il répond : « Là où va la mule ». {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  es: "A Juha, montado en una mula terca, le preguntan adónde va; responde: «Adonde va la mula». {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  tr: "Juha, inatçı bir katıra binerken, katırın nereye gittiği sorulduğunda, \"Katır nereye gidiyorsa oraya\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 183}"
  id: "Juha sedang menunggangi seekor keledai yang keras kepala ketika ditanya ke mana keledai itu akan pergi. Dia menjawab, \"Ke mana pun keledai itu pergi.\" {cite:juha-nawadir-kubra-djuwaydi p. 183}"
