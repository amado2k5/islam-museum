label: { ar: "جامع الترمذي 726 — الرخصة", en: "Jami' al-Tirmidhi 726 — the concession (rukhsa)", ur: "جامع ترمذی 726 — رخصت", fr: "Jami' al-Tirmidhi 726 — la dispense (rukhsa)", es: "Yami' al-Tirmidhi 726 — la dispensa (rukhsa)", tr: "Cami' el-Tirmizi 726 — Ruhsat", id: "Jami' al-Tirmidhi 726 — Lisensi" }
text: "… قَالَ \" نَعَمْ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي رَافِعٍ. قَالَ أَبُو عِيسَى حَدِيثُ أَنَسٍ حَدِيثٌ لَيْسَ إِسْنَادُهُ بِالْقَوِيِّ وَلاَ يَصِحُّ عَنِ النَّبِيِّ فِي هَذَا الْبَابِ شَيْءٌ. وَأَبُو عَاتِكَةَ يُضَعَّفُ. وَاخْتَلَفَ أَهْلُ الْعِلْمِ فِي الْكُحْلِ لِلصَّائِمِ فَكَرِهَهُ بَعْضُهُمْ وَهُوَ قَوْلُ سُفْيَانَ وَابْنِ الْمُبَارَكِ وَأَحْمَدَ وَإِسْحَاقَ. وَرَخَّصَ بَعْضُ أَهْلِ الْعِلْمِ فِي الْكُحْلِ لِلصَّائِمِ وَهُوَ قَوْلُ الشَّافِعِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 726، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 726 (The Book on Fasting), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 726، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 726, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 726, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 726 numaralı hadiste bir muafiyetten bahsedilir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar hakkındaki kitapları, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derleyen yazar, metnin içeriğini anlatır ancak buna dayanarak bir fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 726, menyebutkan sebuah keringanan. Penyusun kitab-kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
