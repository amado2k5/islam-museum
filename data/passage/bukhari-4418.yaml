label: { ar: "البخاري 4418 — حديث كعب بن مالك في التخلف عن تبوك", en: "Bukhari 4418 — Ka'b ibn Malik's account of staying behind at Tabuk" }
text: "لم أتخلف عن رسول الله في غزوة غزاها إلا في غزوة تبوك… والله ما اجتمعت عندي قبله راحلتان قط حتى جمعتهما في تلك الغزوة، ولم يكن رسول الله يريد غزوة إلا ورى بغيرها حتى كانت تلك الغزوة غزاها في حر شديد"
summary:
  ar: "في كتاب المغازي باب حديث كعب بن مالك؛ أطول حديث في الصحيح في بابه، يرويه كعب بلسانه: تخلفه عن تبوك دون عذر، ومصارحته النبي بالحق، وهجر الناس له وصاحبيه خمسين ليلة، وكتاب ملك غسان إليه، حتى إعلان توبتهم بعد صلاة الفجر. نصّ القصة الأول في كتب الحديث."
