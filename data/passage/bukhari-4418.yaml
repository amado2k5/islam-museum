text: "لم أتخلف عن رسول الله في غزوة غزاها إلا في غزوة تبوك… والله ما اجتمعت عندي قبله راحلتان قط حتى جمعتهما في تلك الغزوة، ولم يكن رسول الله يريد غزوة إلا ورى بغيرها حتى كانت تلك الغزوة غزاها في حر شديد"
summary:
  ar: "في كتاب المغازي باب حديث كعب بن مالك؛ أطول حديث في الصحيح في بابه، يرويه كعب بلسانه: تخلفه عن تبوك دون عذر، ومصارحته النبي بالحق، وهجر الناس له وصاحبيه خمسين ليلة، وكتاب ملك غسان إليه، حتى إعلان توبتهم بعد صلاة الفجر. نصّ القصة الأول في كتب الحديث."
  tr: "Maghazi kitabında, Ka'b ibn Malik'in hadisleri bölümünde, Sahih el-Buhari'deki kendi kategorisindeki en uzun hadis olan ve Ka'b'ın bizzat rivayet ettiği hadis şöyledir: Tebük seferine mazeretsiz olarak katılmaması, hakikat konusunda Peygamber'e karşı açık sözlü olması, halkın kendisini ve iki sahabesini elli gece boyunca boykot etmesi, Gassan kralının kendisine yazdığı mektup ve sabah namazından sonra tövbelerini bildirmeleri. Bu, hadis kitaplarında bulunan hikayenin ilk versiyonudur."
  id: "Dalam kitab Maghazi, pada bab tentang hadits Ka'b bin Malik, hadits terpanjang dalam kategorinya di Sahih al-Bukhari, diriwayatkan oleh Ka'b sendiri: ketidakhadirannya dari ekspedisi ke Tabuk tanpa alasan, kejujurannya kepada Nabi tentang kebenaran, boikot orang-orang terhadapnya dan dua sahabatnya selama lima puluh malam, surat dari raja Ghassan kepadanya, hingga pernyataan taubat mereka setelah salat Subuh. Ini adalah versi pertama kisah tersebut yang ditemukan dalam kitab-kitab hadits."
