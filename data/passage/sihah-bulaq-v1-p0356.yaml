text: |-
  فص الاء
  ⁦(بشر)⁩
  ٢٨٥
  وبرّة بنت مرّأخت تسيم ين حروهى أم المضر بن كنانة والبربرة الصوت وكلام فى غضب تقول
  بربره وبربار مثل توثر فهوثز ثار وبر برجيل من الناس وهم البرابرة والهاء للعجسمة والذسب
  وان شقت حذفتها والبريرغر الار الواحدتها بريرة وبريرة اسم امرأة والبرّجم-ع برة من
  القمح ومنع سيبويه أن يجمع البرّ على أبراد وجوزه المبردقياسا والبربور الجشيش من البر
  وأبر اللّه حك لغة فى براللّه حجك أى قبله وأبرفلان على أصحابه أى علاهم ابن السكيت أبر
  فلان اذاركب اليه ⁦(بزد)⁩ البزربزرالبقل وغيره ودهن البزر والبزر وبالكسر أفصح
  والابزاروالابازير التوابل والبيزرخشب القصار الذى يدق به والبيازر اعصى المضخام
  وبزره بالعصاضريه بم او البياذرة جمع بيزادوهو معرب بازيار 1 قال الكميت
  كأن سوابة،ا فى الغبار • صقورتعارض بيزارها
  ⁦( بسر)⁩ البسرأقله طلع نخلال تميلح تميسر ثم رطب ثتم تمر الواحدة بسرة وبسرة
  واجمع بسرات وبسروأ بسر النخسل صار ما عليه بسرا ويقال للشمس فى أول طلوءهايسرة
  والبسرة من النبات أوّلها البارض وه وكما يبدوفى الإرض ثم الجيم ثم البسرة
  ثم السعاءثم الحشيش قال ذوالرمة
  رعت بارض البهمى جيما وسرة ل، وصمعاء حتى آنتها فصالها
  والبسر الماء الطرى الحديث احهد بالمطروالجمع بسار مشل رمح ورماح وتبدمرته اذ اطلبته
  وقال الراعى اذا احتحيت بنات الارض عنه * تبسر يبتغى فيها البسارا
  وبنسات الارض المواضع التى تخفى على الراعى وبسر الرجل الحاجة بسرا اذاطلبها فى غير
  موضع الطالب والسرأن يشكأ المين قبل أن يتضج أى يقرف عنه قشره والبسر ظلم البقا.
  والدسران تخلط البسر مع غيره فى النبيذ وفى الحديث لا تبسروا ولا تتجروا وبسر الفهل
  لناقة وابتسرها اذاضر بها من غير ضبعة وبسر الرج-ل وجهه بدورا أى كلح يقال
  عبس وبسر والباسود واحد البواسيروهى علة تحدث فى المقعدة وفى داخل الأف أيضا
  وأبسر المركب فى البحرأى وقف ⁦(بشر)⁩ البشرة والبشرظاهر جلد الانسات
  ويشرة الارض ماظهر من نباتها وقد أبشرت الارض وما أحسن بشرتها والبشر الخلق
  ومباشرة المرأة «لامستها واجر المباشر التى ته-م بالفحل ومباشرة الامور أن تليها بنفسلم
  ويشرت الاديم أبشره بشرا اذا أخذت بشرته وفلان.ودم مبشراذاكان كاملا
  •ن الرجال كانه جمع لين الادمة وخشونة البشرة ويشر الجراد الارض أكل ما عليها
  والبشرأيضا المباشرة قال الافوه
  لمارأت سرى تغيرواى • من دون نحمة بشرها حين اذى
  أى مباشرتى اياها ويشرت الرجل أبشره بالضم بشراويت ورامن البشرى وكذلك الابشار
  والتبشيرثلاث لغات والاسم البشارة والبشارة بالضم والكسريال بشرته بمولود فأبشر
  إبشارا أى سروة ول أيشر بخير بتطع الالف ومنه قول تعالى وأبشروا بالجنة ويشرت يكذا
  بالكسراً بشرأى استبشرت به وقال عملية بن زيد الجاهلى
  وآدارأيت الباهشيز الى العلى • غبرا أكفهم بقاع جمم-ل
  ١ هو حامل البازى وخادم
  الصة رللصيديه عند اللوك
  وصناعته البيزرة اه قاله نصر
  قال فى مروج الذهب صفحة ١٠١
  والبياسرة من ولد من المسلين
  بأرض الهند كانو ايسمونهم بذلك
  واحدهم يبسرى اه وهذا غير
  مافى القاموس من ان البياسرة
  جيل من السند تستأجرهم
  المواخذة لمحارية العدواه أقول
  وأما ارسلان البساسيرى مقدّم
  الاتراك الذى قتسله طغرابك
  السطبوقى وصلبه فى بغداد
  لروجه على الخليفة فهو منسوب
  شذوذا الى بسا ويقال لهافسا
  من ابن خلكان قاله نصر
  قوله والجر بكسر الحاء أى الاننى
  من الخيل كامهوة اه
