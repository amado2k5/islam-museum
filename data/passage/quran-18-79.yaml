text: "أَمَّا ٱلسَّفِينَةُ فَكَانَتْ لِمَسَـٰكِينَ يَعْمَلُونَ فِى ٱلْبَحْرِ فَأَرَدتُّ أَنْ أَعِيبَهَا وَكَانَ وَرَآءَهُم مَّلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًا"
text_search: "أما السفينة فكانت لمساكين يعملون في البحر فأردت أن أعيبها وكان وراءهم ملك يأخذ كل سفينة غصبا"
translations:
  en: { text: "As for the ship, it belonged to poor people working on the river, and I wished to mar it, for there was a king behind them who is taking every ship by force.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(کہ وہ جو) کشتی (تھی) غریب لوگوں کی تھی جو دریا میں محنت (کرکے یعنی کشتیاں چلا کر گذارہ) کرتے تھے۔ اور ان کے سامنے (کی طرف) ایک بادشاہ تھا جو ہر ایک کشتی کو زبردستی چھین لیتا تھا تو میں نے چاہا کہ اسے عیب دار کردوں (تاکہ وہ اسے غصب نہ کرسکے)", translator: "Fateh Muhammad Jalandhari", license: PD }
