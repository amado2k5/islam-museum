label: { ar: "الموطأ 1722 — ثور بن زيد الديلي: كان الرجل يطلق امرأته ثم يراجعها ولا حاجة له بها، ليطول عليها العدة ويضارها، فأنزل الله النهي عن الإمساك ضرارا", en: "Muwatta 1722", es: "Muwatta 1722", fr: "Muwatta 1722", ur: "موطا 1722", tr: "El-Muvatta 1722 — Sevr ibn Zeyd el-Deyli: Bir erkek karısını boşayıp, ona ihtiyacı olmamasına rağmen onu geri alırdı; bunu, bekleme süresini uzatmak ve ona zarar vermek için yapardı. Bunun üzerine Allah, ona zarar vermek amacıyla onu tutmayı yasaklamıştır.", id: "Al-Muwatta 1722 — Thawr ibn Zayd al-Dayli: Seorang pria menceraikan istrinya lalu mengambilnya kembali meskipun ia tidak membutuhkannya, dengan tujuan memperpanjang masa iddahnya dan mencelakainya. Maka Allah menurunkan larangan untuk mempertahankan istri dengan tujuan mencelakainya." }
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي أن الرجل كان يطلق امرأته ثم يراجعها، ولا حاجة له بها، ولا يريد إمساكها، ليطول بذلك عليها العدة ليضارها، فأنزل الله تبارك وتعالى آية البقرة في النهي عن الإمساك ضرارا لتعتدوا، يعظهم الله بذلك. {cite:muwatta-maruf-1997 p.103}"
  tr: "Malik, Sevr ibn Zeyd el-Deyli'den rivayetle, bir adamın karısını boşayıp sonra onu geri aldığını, ona ihtiyacı olmadığı ve onu tutmak istemediği halde, bekleme süresini uzatarak ona zarar vermek için bunu yaptığını anlatır. Bunun üzerine Allah, mübarek ve yüce olan, Bakara Suresi'nde, bir kadına zarar vermek ve onu günaha sürüklemek için onu tutma uygulamasını yasaklayan bir ayet indirmiştir. Allah bunu onlara öğüt olarak iletmiştir. {cite:muwatta-maruf-1997 s.103}"
  id: "Malik meriwayatkan dari Thawr ibn Zayd al-Dayli bahwa seorang pria menceraikan istrinya lalu mengambilnya kembali, karena tidak membutuhkannya dan tidak ingin mempertahankannya, sehingga ia memperpanjang masa iddah istrinya untuk mencelakainya. Kemudian Allah Yang Maha Berkah dan Maha Tinggi menurunkan ayat dalam Surah Al-Baqarah yang melarang praktik mempertahankan istri untuk mencelakainya, sehingga ia melanggar kesuciannya. Allah memperingatkan mereka dengan hal ini. {cite:muwatta-maruf-1997 p.103}"
