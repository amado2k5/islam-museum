label: { ar: "جامع الترمذي 1808 — الأب والأبوة", en: "Jami' al-Tirmidhi 1808 — the father and fatherhood", ur: "جامع ترمذی 1808 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1808 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ مَدُّويَهْ، حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا الْجَرَّاحُ بْنُ مَلِيحٍ، وَالِدُ، وَكِيعٍ، عَنْ أَبِي إِسْحَاقَ، عَنْ شَرِيكِ بْنِ حَنْبَلٍ، عَنْ عَلِيٍّ، أَنَّهُ قَالَ نُهِيَ عَنْ أَكْلِ الثُّومِ، إِلاَّ مَطْبُوخًا."
summary:
  ar: "حديث في جامع الترمذي، رقم 1808، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1808 (The Book on Food), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1808، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1808 (El Libro de la Alimentación), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
