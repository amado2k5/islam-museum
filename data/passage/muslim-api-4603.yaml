label: { ar: "صحيح مسلم 4603 — الأب والأبوة", en: "Sahih Muslim 4603 — the father and fatherhood", ur: "صحیح مسلم 4603 — باپ اور والدیت", es: "Sahih Muslim 4603 — El padre y la paternidad" }
text: "… قَالَ ابْنُ شِهَابٍ وَكَانَ مِنْ شَأْنِ أُمِّ أَيْمَنَ أُمِّ أُسَامَةَ بْنِ زَيْدٍ أَنَّهَا كَانَتْ وَصِيفَةً لِعَبْدِ اللَّهِ بْنِ عَبْدِ الْمُطَّلِبِ وَكَانَتْ مِنَ الْحَبَشَةِ فَلَمَّا وَلَدَتْ آمِنَةُ رَسُولَ اللَّهِ بَعْدَ مَا تُوُفِّيَ أَبُوهُ فَكَانَتْ أُمُّ أَيْمَنَ تَحْضُنُهُ حَتَّى كَبِرَ رَسُولُ اللَّهِ فَأَعْتَقَهَا ثُمَّ أَنْكَحَهَا زَيْدَ بْنَ حَارِثَةَ ثُمَّ تُوُفِّيَتْ بَعْدَ مَا تُوُفِّيَ رَسُولُ اللَّهِ بِخَمْسَةِ أَشْهُرٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4603، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4603 (The Book of Jihad and Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4603، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4603 (El Libro de la Yihad y las Expediciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
