text: "… البر، فبان أنها في نفسها بر ثم رجح هذا البر على البر الذي ينفرد به الواحد بما فيه من حصول بر كثير مع موافقة أهل الدين، والتشبه بما بنى عليه أكثر أهل الطاعات من الاشتراك فيها، وأدائها بالجماعة وبسط الكلام …"
