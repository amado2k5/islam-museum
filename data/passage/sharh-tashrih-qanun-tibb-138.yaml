text: "… في وسطها، فلذلك تسمى البركة لأنها على هيئة البركة التي تسمى في العرف العام: طشتية. وإلى هذه البركة تتوجه أطراف كثيرة من الأوردة النافذة في جرم الدماغ فيخرج الدم من فوهاتها إلى هذه البركة، ولذلك تسمى أيضاً المعصرة. لأن العروق …"
