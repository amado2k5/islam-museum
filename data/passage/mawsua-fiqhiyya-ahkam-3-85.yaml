text: "… فيستحب له أن يستخير اللّٰه تعالى، لكن ليس للحج نفسه، فإنه لا استخارة في فعل الطاعات، لكن للأداء هذا العام إن كانت الحجة نافلة، أو مع هذه القافلة، وترد الاستخارة على الحج الفرض هذا العام لكن على القول بتراخي وجوبه. …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 3، ص 85، يرد فيه ذكر الفرض، والطاعات، والوجوب، والمستحب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 3, p. 85, whose wording mentions the obligatory (fard), the acts of obedience, obligation (wujub), the recommended (mustahabb), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 3، ص 85 کا اقتباس جس میں فرض، طاعات، وجوب، مستحب، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 3, p. 85, dont le texte mentionne l'obligatoire (fard), les actes d'obéissance, l'obligation (wujub), le recommandé (mustahabb), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 3, p. 85, cuyo texto menciona lo obligatorio (fard), los actos de obediencia, la obligatoriedad (wujub), lo recomendado (mustahabb), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
