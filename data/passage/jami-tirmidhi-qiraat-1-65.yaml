text: "… مُعَاوِيَةً و عَبْدُ اللهِ بْنُ نُمَيْرِ عَنِ الأَعْمَشِ، عَنْ إسْمَاعِيلَ بْنِ رَجَاءِ الزُّبَيْديِّ، عَن أَوْسِ بنِ ضَمْعَجٍ قال: سَمعتُ أَبا مَسْعُودٍ الأنصَارِيَّ يَقُولُ: قَالَ رَسُولُ اللهِ وَلِفِ يَؤُمُّ الْقَوْمَ أقرؤُهُمْ لِكتَابِ الله، فَإِنْ كَانُوا فِي الْقرَاءَةِ سَواءً، فَأَعْلَمُهُم بالسُّنَّةِ، فإن …"
