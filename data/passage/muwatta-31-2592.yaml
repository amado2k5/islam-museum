label: { ar: "الموطأ 2592 — قطن بن وهب عن يحنس مولى الزبير: ابن عمر ينهى المرأة عن الخروج من المدينة في الفتنة", en: "Muwatta 2592" }
summary:
  ar: "يروي مالك عن قطن بن وهب بن عويمر بن الأجدع أن يحنس مولى الزبير بن العوام أخبره أنه كان جالسا عند عبد الله بن عمر في الفتنة، فأتته مولاة له تسلم عليه، فقالت: إني أردت الخروج يا أبا عبد الرحمن، اشتد علينا الزمان. فقال لها ابن عمر: اقعدي، فإني سمعت النبي يقول: لا يصبر على لأوائها وشدتها أحد إلا كنت له شفيعا أو شهيدا يوم القيامة. {cite:muwatta-maruf-1997 p.462} {cite:muwatta-maruf-1997 p.463}"
