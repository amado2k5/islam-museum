text: "… مالك. حصن بن حذيفة أوصى ولده عند موته، وكانوا عشرة ؛ يقال كان اسمه حذيفة فلقب عيينة، لأنه كان أصابته قال: وكان سبب موته أن كرز بن عامر العقيلي طعنه، شجة فجحظت عيناه. فاشتد مرضه، فقال لهم: الموت أروح مما …"
summary:
