text: "… بن عمرو الأموي السعيدي: مِن ولدٍ سعيد ابن العاص مِن أَهل الكوفة، ابن عمِّ عبد العزيز بن أَبان، يروي عن: الثَّوري، وهشام الدِّستوائي، ومالك بن مِغْوَل، روى عنه: أَبو عُبيدةَ وغيره، كان ممَّن ينفردُ عنِ الثّقاتِ بالموضوعات، لا يحلّ الاحتجاجُ …"
