label: { ar: "صحيح البخاري 3975 — الأب والأبوة، تربية الأب ووصيته", en: "Sahih al-Bukhari 3975 — the father and fatherhood; the father raising and counselling", ur: "صحیح بخاری 3975 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 3975 — El padre y la paternidad; la crianza y el consejo paternos", fr: "Sahih al-Bukhari 3975 — Le père et la paternité; l'éducation et les conseils du père" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّ أَصْحَابَ، رَسُولِ اللَّهِ قَالُوا لِلزُّبَيْرِ يَوْمَ الْيَرْمُوكِ أَلاَ تَشُدُّ فَنَشُدَّ مَعَكَ فَقَالَ إِنِّي إِنْ شَدَدْتُ كَذَبْتُمْ. فَقَالُوا لاَ نَفْعَلُ، فَحَمَلَ عَلَيْهِمْ حَتَّى شَقَّ صُفُوفَهُمْ، فَجَاوَزَهُمْ وَمَا مَعَهُ أَحَدٌ، ثُمَّ رَجَعَ مُقْبِلاً، فَأَخَذُوا بِلِجَامِهِ، فَضَرَبُوهُ ضَرْبَتَيْنِ عَلَى عَاتِقِهِ بَيْنَهُمَا ضَرْبَةٌ ضُرِبَهَا يَوْمَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3975، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3975 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3975، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3975 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad, así como la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3975 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), évoque le père et la paternité, l'éducation et le rôle du père dans l'enseignement. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant du père."
