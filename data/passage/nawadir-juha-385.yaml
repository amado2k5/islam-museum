text: "… إنَّما هي أمي كان لهم جاريةٌ تسمَّى عُميرة، فضربتها أُمُّه، ذات يوم، فصرخت الجارية، فاجتمع الناس على الباب، فخرج إليهم وقال : عافاكُمُ اللَّهِ، إنَّما هي أمي تجلِدُ عُميرة."
summary:
  ar: "كانت الجارية عميرة تصرخ وهي تُضرب فتجمع الناس عند الباب، فقال جحا إنها أمه فقط تضرب عميرة. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  en: "The slave girl Umayra screams while being beaten; people gather at the door; Juha says it is only his mother beating Umayra. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  ur: "کنیز عمیرہ مار کھاتے ہوئے چیخ رہی تھی تو لوگ دروازے پر جمع ہو گئے، جحا نے کہا کہ یہ تو بس اس کی ماں عمیرہ کو مار رہی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  fr: "L'esclave Umayra hurle pendant qu'on la bat ; des gens s'attroupent à la porte ; Juha dit que ce n'est que sa mère qui bat Umayra. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  es: "La esclava Umayra grita mientras la golpean; la gente se reúne en la puerta; Juha dice que es solo su madre golpeando a Umayra. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  tr: "Köle kız Amira dövülürken çığlık atıyordu ve insanlar kapıda toplandı. Juha, \"Bu sadece annesinin Amira'yı dövmesi,\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 188}"
  id: "Budak perempuan itu, Amira, menjerit saat dipukuli, dan orang-orang berkumpul di pintu. Juha berkata, \"Itu hanya ibunya yang memukuli Amira.\" {cite:juha-nawadir-kubra-djuwaydi p. 188}"
