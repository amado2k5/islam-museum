text: "… سَهْل بن مردوّيه، حدثنا سهل بن عثمان أنبأنا حفص بنُ غيَّاثٍ فذكره باسناده، قال : أتى أعرابيُّ النبي وتعِ فسألَهُ فدخل فلم يجد إلا كسرةً قد يَبسَتْ أخرجه مسلم في : - كتاب الأشربة باب المؤمن يأكل في معى واحد، …"
summary:
