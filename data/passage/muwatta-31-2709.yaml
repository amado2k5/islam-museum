label: { ar: "الموطأ 2709 — حميد بن قيس عن حاضنة ابني جعفر: استرقوا لهما فإن العين تسرع إليهما", en: "Muwatta 2709", es: "Muwatta 2709", fr: "Muwatta 2709", ur: "موطا 2709", tr: "El-Muvatta 2709 — Hamid bin Kays, Cafer'in iki oğlunun süt annesinin rivayetine göre: \"Onlar için koruma dileyin, çünkü nazar onlara çok çabuk bulaşır.\"", id: "Al-Muwatta 2709 — Hamid bin Qais, berdasarkan riwayat dari pengasuh kedua putra Ja'far: “Mohonlah perlindungan bagi mereka, karena mata jahat mudah mempengaruhi mereka.”" }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي أنه قال: دخل على رسول الله بابني جعفر بن أبي طالب، فقال لحاضنتهما: ما لي أراهما ضارعين؟ فقالت حاضنتهما: يا رسول الله، إنه تسرع إليهما العين، ولم يمنعنا أن نسترقي لهما إلا أنا لا ندري ما يوافقك من ذلك. فقال رسول الله: استرقوا لهما، فإنه لو سبق شيء القدر لسبقته العين. {cite:muwatta-maruf-1997 p.528}"
  tr: "Malik, Humaid ibn Kays el-Mekki'den rivayetle şöyle der: Cafer ibn Ebu Talib'in iki oğlu Resulullah'ın huzuruna girdiler ve Resulullah onların bakıcısına, \"Onları neden bu kadar zayıf görüyorum?\" diye sordu. Bakıcıları, \"Ey Resulullah, onlar nazardan kolayca etkileniyorlar ve onlara şifa aramaktan bizi alıkoyan tek şey, bu konuda sizin neyi onaylayacağınızı bilmememizdir\" diye cevap verdi. Resulullah, \"Onlara şifa arayın, çünkü kaderden önce gelen bir şey varsa, o da nazardır\" dedi. {cite:muwatta-maruf-1997 s.528}"
  id: "Malik meriwayatkan dari Humaid ibn Qais al-Makki bahwa ia berkata: Dua putra Ja'far ibn Abi Talib menemui Rasulullah, dan beliau bertanya kepada pengasuh mereka: Mengapa aku melihat mereka begitu kurus? Pengasuh mereka menjawab: Wahai Rasulullah, mereka mudah terkena siksa mata jahat, dan satu-satunya hal yang menghalangi kami untuk mencari pengobatan bagi mereka adalah karena kami tidak tahu apa yang akan engkau setujui dalam hal itu. Rasulullah bersabda: Carilah pengobatan bagi mereka, karena jika ada sesuatu yang dapat mendahului takdir, itu adalah siksa mata jahat. {cite:muwatta-maruf-1997 p.528}"
