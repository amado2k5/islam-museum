label: { ar: "الموطأ 2709 — حميد بن قيس عن حاضنة ابني جعفر: استرقوا لهما فإن العين تسرع إليهما", en: "Muwatta 2709" }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي أنه قال: دخل على رسول الله بابني جعفر بن أبي طالب، فقال لحاضنتهما: ما لي أراهما ضارعين؟ فقالت حاضنتهما: يا رسول الله، إنه تسرع إليهما العين، ولم يمنعنا أن نسترقي لهما إلا أنا لا ندري ما يوافقك من ذلك. فقال رسول الله: استرقوا لهما، فإنه لو سبق شيء القدر لسبقته العين. {cite:muwatta-maruf-1997 p.528}"
