text: "… فى أصحابنا أحفظ من أب، عبد اللّٰه تنذكر مثله. سممت محمد بن أحد بن الحسن بن الصواف يقول سمعت عبد الله بن أحد بن حنيل يقول : مارأيت أبى حدث من حفظه من غير كتاب إلا بأقل من مائة حديث. …"
