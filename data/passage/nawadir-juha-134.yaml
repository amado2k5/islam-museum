text: "… خلٌّ أبنُ أربعينَ سنةً سأله جاره يوماً: هل عندَك خلُّ أبنُ أربعينَ سنةً؟ فقال: نعمْ عندي. فقال له: أعطني قليلاً منه. فأجابه: لا أقدِرُ أنَّ أَعطيك. فقال : ولماذا؟ فأجابه : لو أجبْتُكَ إلى طلبكَ، وأجبْتُ غيرك، فهل يبقى خلَّ …"
summary:
  ar: "طلب منه جار خلًّا عمره أربعون سنة، فرفض، لأنه لو أعطاه لواحد لما بقي للتالي شيء. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  en: "Asked by a neighbour for vinegar aged forty years, Juha refuses, since giving it to one person would leave none for the next. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  ur: "ایک پڑوسی نے جحا سے چالیس سال پرانا سرکہ مانگا تو اس نے انکار کیا، کیونکہ ایک کو دینے سے اگلے کے لیے کچھ نہ بچتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  fr: "Un voisin demande à Juha du vinaigre vieux de quarante ans; Juha refuse, car en donner à l'un n'en laisserait plus pour le suivant. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  es: "Un vecino le pide a Juha vinagre de cuarenta años; Juha se niega, pues dárselo a uno no dejaría nada para el siguiente. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  tr: "Kırk yaşında bir komşusu ondan sirke istedi, ancak o reddetti; çünkü birine verirse, diğerine kalmayacaktı. {cite:juha-nawadir-kubra-djuwaydi s. 63}"
  id: "Seorang tetangga yang berusia empat puluh tahun meminta cuka kepadanya, tetapi dia menolak, karena jika dia memberikannya kepada satu orang, tidak akan ada yang tersisa untuk orang berikutnya. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
