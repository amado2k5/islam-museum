label: { ar: "سنن أبي داود 1212 — الأب والأبوة", en: "Sunan Abi Dawud 1212 — the father and fatherhood", ur: "سنن ابی داؤد 1212 — باپ اور والدیت", es: "Sunan Abi Dawud 1212 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدٍ الْمُحَارِبِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ أَبِيهِ، عَنْ نَافِعٍ، وَعَبْدِ اللَّهِ بْنِ وَاقِدٍ، أَنَّ مُؤَذِّنَ ابْنِ عُمَرَ، قَالَ الصَّلاَةُ. قَالَ سِرْ سِرْ. حَتَّى إِذَا كَانَ قَبْلَ غُيُوبِ الشَّفَقِ نَزَلَ فَصَلَّى الْمَغْرِبَ ثُمَّ انْتَظَرَ حَتَّى غَابَ الشَّفَقُ وَصَلَّى الْعِشَاءَ ثُمَّ قَالَ إِنَّ رَسُولَ اللَّهِ كَانَ إِذَا عَجِلَ بِهِ أَمْرٌ صَنَعَ مِثْلَ الَّذِي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1212، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1212 (Prayer (Kitab Al-Salat): Detailed Rules of Law about the Prayer during Journey), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1212، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1212 (Oración (Kitab Al-Salat): Reglas detalladas sobre la oración durante el viaje), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
