label: { ar: "الموطأ 2022 — مالك: فيمن دفع إلى رجل مالا قراضا، واشترط عليه أن لا يبتاع به إلا نخلا أو دوابا لأجل أنه يطلب ثمر النخل أو نسل الدواب ويحبس رقابها: لا يجوز هذا، وليس هذا من سنة المسلمين في القراض، إلا أن يشتري ذلك، ثم يبيعه كما يباع غيره من السلع", en: "Muwatta 2022", es: "Muwatta 2022", fr: "Muwatta 2022", ur: "موطا 2022", tr: "El-Muvatta 2022 — Malik: Bir kimse, bir adama borç para verip, bununla sadece hurma veya hayvan alabileceğini, çünkü hurma meyvesini veya hayvanların yavrularını istediğini ve onları besleyeceğini şart koşarsa: Bu caiz değildir ve Müslümanların borç vermede uyguladığı yöntem bu değildir; ancak kişi bunları alıp diğer mallar gibi satarsa durum değişir.", id: "Al-Muwatta 2022 — Malik: Mengenai seseorang yang memberi uang kepada orang lain sebagai pinjaman, dengan syarat ia hanya boleh membeli pohon kurma atau ternak dengan uang tersebut karena ia menginginkan buah kurma atau anak ternak dan akan memeliharanya: Hal ini tidak diperbolehkan, dan ini bukan kebiasaan umat Islam dalam memberikan pinjaman, kecuali jika ia membelinya lalu menjualnya seperti barang dagangan lainnya." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، واشترط عليه أن لا يبتاع به إلا نخلا أو دوابا، لأجل أنه يطلب ثمر النخل أو نسل الدواب، ويحبس رقابها: قال مالك: لا يجوز هذا، وليس هذا من سنة المسلمين في القراض، إلا أن يشتري ذلك، ثم يبيعه كما يباع غيره من السلع. {cite:muwatta-maruf-1997 p.227}"
  tr: "Malik, bir adamın, başka bir adama kâr paylaşımı (kırad) için para verip, karşılığında sadece hurma veya hayvan almasını şart koşması, çünkü hurma meyvesini veya hayvanların yavrularını istediğini ve bunları besleyeceğini söylemesi üzerine şöyle buyurmuştur: Malik şöyle buyurdu: Bu caiz değildir ve Müslümanların kâr paylaşımında uyguladığı yöntem bu değildir; ancak satın alıp diğer mallar gibi satması durumunda caiz olur. {cite:muwatta-maruf-1997 s.227}"
  id: "Malik berkata tentang seorang pria yang memberikan uang kepada pria lain untuk perjanjian bagi hasil (qirad), dengan syarat ia hanya boleh membeli pohon kurma atau ternak dengan uang tersebut, karena ia menginginkan buah kurma atau anak ternak dan akan memeliharanya: Malik berkata: Ini tidak diperbolehkan, dan ini bukan praktik umat Islam dalam perjanjian bagi hasil, kecuali jika ia membelinya lalu menjualnya seperti barang dagangan lainnya. {cite:muwatta-maruf-1997 p.227}"
