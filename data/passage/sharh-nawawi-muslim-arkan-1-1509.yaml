text: "… اللَّهُ، وَأشْهَدُ أنْ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ، قال: فَرَجَعْتُ إلَى رسول اللَّهِ! آبشِرْ قَدِ اسْتَجَابَ اللَّهُ دَعْوَتَكَ وَهَدَى أمَّ أَبِي هُرَيْرَةً، إِلَيْنَا، قال، فَقَالَ رسول اللّه اللَّهُمْ حَبِّبْ عُبَيْدَكَ هَذَا - الْمُؤْمِنِينَ. فَمَا خُلِقَ مُؤْمِن يَسْمَعُ بِي، وَلا يَرَانِي إلا أحَبِّنِي. …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 1509، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 1509, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 1509 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 1509, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 1, p. 1509) mentionnant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih Müslim tefsirinin 1. cildinin 1509. sayfasından, müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 1509, yang menyebutkan ciri-ciri seorang mukmin; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin."
