label: { ar: "الموطأ 889 — مالك: لا يحل لرجل أن يمس امرأته وهو معتكف، ولا يتلذذ منها بشيء، بقبلة ولا غيرها، ولم يسمع أحداً يكره للمعتكف والمعتكفة أن ينكحا في اعتكافهما ما لم يكن المسيس", en: "Muwatta 889" }
summary:
  ar: "قول يرويه يحيى عن زياد عن مالك: لا يحل لرجل أن يمس امرأته وهو معتكف، ولا يتلذذ منها بشيء، بقبلة ولا غيرها. ولم يسمع أحداً يكره للمعتكف والمعتكفة أن ينكحا في اعتكافهما ما لم يكن المسيس، فيُكره ذلك، ولا يُكره للصائم أن ينكح في صيامه. ويفرق مالك بين نكاح المعتكف ونكاح المحرم: المحرم يأكل ويشرب ويعود المريض ويشهد الجنائز ولا يتطيب، والمعتكف يدهن ويتطيب ويأخذ من شعره، ولا يشهد الجنائز ولا يعود المرضى. ويذكر المحقق أنه رواه عن مالك أبو مصعب (886) و(887). {cite:muwatta-maruf-1997 p.426} {cite:muwatta-maruf-1997 p.427}"
