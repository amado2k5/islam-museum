label: { ar: "الموطأ 889 — مالك: لا يحل لرجل أن يمس امرأته وهو معتكف، ولا يتلذذ منها بشيء، بقبلة ولا غيرها، ولم يسمع أحداً يكره للمعتكف والمعتكفة أن ينكحا في اعتكافهما ما لم يكن المسيس", en: "Muwatta 889", es: "Muwatta 889", fr: "Muwatta 889", ur: "موطا 889", tr: "El-Muvatta 889 — Malik: Bir erkeğin itikaftayken karısına dokunması, öpüşerek veya başka bir şekilde ondan zevk alması caiz değildir. İtikafta olan bir erkek veya kadının tenha zamanlarında cinsel ilişkiye girmesinden hoşlanmayan birini duymamıştır, ancak cinsel ilişki haram ise durum farklıdır.", id: "Al-Muwatta 889 — Malik: Tidak diperbolehkan bagi seorang laki-laki untuk menyentuh istrinya ketika sedang beritikaf, dan tidak pula untuk mendapatkan kesenangan darinya, baik melalui ciuman maupun cara lain. Ia belum pernah mendengar ada orang yang tidak menyukai seorang laki-laki atau perempuan yang sedang beritikaf melakukan hubungan seksual selama masa i'tikaf, kecuali jika hubungan seksual tersebut dilarang." }
summary:
  ar: "قول يرويه يحيى عن زياد عن مالك: لا يحل لرجل أن يمس امرأته وهو معتكف، ولا يتلذذ منها بشيء، بقبلة ولا غيرها. ولم يسمع أحداً يكره للمعتكف والمعتكفة أن ينكحا في اعتكافهما ما لم يكن المسيس، فيُكره ذلك، ولا يُكره للصائم أن ينكح في صيامه. ويفرق مالك بين نكاح المعتكف ونكاح المحرم: المحرم يأكل ويشرب ويعود المريض ويشهد الجنائز ولا يتطيب، والمعتكف يدهن ويتطيب ويأخذ من شعره، ولا يشهد الجنائز ولا يعود المرضى. ويذكر المحقق أنه رواه عن مالك أبو مصعب (886) و(887). {cite:muwatta-maruf-1997 p.426} {cite:muwatta-maruf-1997 p.427}"
  tr: "Yahya'nın Ziyad'dan, o da Malik'ten rivayet ettiği bir hadis şöyledir: Bir erkeğin itikaf halindeyken karısına dokunması, öpüşme veya başka bir şekilde ondan zevk alması caiz değildir. İtikaf halindeki bir erkek veya kadının, fiziksel temas içermediği sürece, inzivada iken evlenmesini kınayan kimse duyulmamıştır; fiziksel temas söz konusu olduğunda ise bu durum mekruhtur. Oruçlu bir kişinin oruçlu iken evlenmesi mekruh değildir. Malik, itikaf halindeki bir kişinin evliliği ile ihramlı bir kişinin evliliği arasında ayrım yapar: İhramlı kişi yemek yiyebilir, içki içebilir, hasta ziyaretinde bulunabilir, cenazelere katılabilir ve parfüm kullanamaz; itikaf halindeki kişi ise yağ sürebilir, parfüm kullanabilir ve saçını kestirebilir, ancak cenazelere katılamaz veya hasta ziyaretinde bulunamaz. Araştırmacı, bunun Malik'ten Ebu Mus'ab (886) ve (887) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.426} {cite:muwatta-maruf-1997 s.427}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Ziyad dari Malik: Tidak diperbolehkan bagi seorang laki-laki untuk menyentuh istrinya saat sedang i'tikaf, atau untuk mendapatkan kesenangan darinya, baik melalui ciuman atau cara lain. Tidak ada yang pernah mendengar ada orang yang tidak menyetujui seorang laki-laki atau perempuan yang sedang i'tikaf menikah selama masa pengasingannya, kecuali jika melibatkan kontak fisik, dalam hal ini hal itu tidak disukai. Tidaklah tidak disukai bagi orang yang berpuasa untuk menikah selama puasanya. Malik membedakan antara pernikahan orang yang sedang i'tikaf dan pernikahan orang yang sedang ihram: orang yang sedang ihram boleh makan, minum, mengunjungi orang sakit, menghadiri pemakaman, dan tidak menggunakan parfum, sedangkan orang yang sedang i'tikaf boleh mengoleskan minyak, menggunakan parfum, dan memotong rambut, tetapi tidak menghadiri pemakaman atau mengunjungi orang sakit. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (886) dan (887). {kutip:muwatta-maruf-1997 hal.426} {kutip:muwatta-maruf-1997 hal.427}"
