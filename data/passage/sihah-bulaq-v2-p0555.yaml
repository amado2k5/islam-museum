text: |-
  قوله وأماقول الجاج الخ عبادة
  القاموس وقول الجاج اياى
  وه_ذه القفاء تصحيف صوابه
  الشفعاء كانو ايجتمعون عند
  السلطان فيشفعون فى (مريب
  اه كتبه المصحيح
  ٣٢
  وسرعفت الصىّ اذ أحسنت غذاءه وكذلك سرهفته وأنشد أبوعرو
  انك-رهفت غلاماجفرا * (سعف السعفة بالتسكين قروح تخرج برأس الصىّ تقول
  منه سعف الغلام فهو مسعوى والسعفة بالتصريك غصن النخل والجمع سعف والسعف
  أيضا التشعث حول الاظفار وقد سعفت يده بالكسرمثل ستفت قال ابن السكين
  السعف داء يأخذفى أفواه الابل كالجرب يتعط منه خرط ومها وشعرعينها يقال ناقة سعفا
  وبعير أسعف ودسعف ومثله فى الغنم الغرب والاسعف من الخيل الاشيب الناصية فاذا
  ابيضت كلها فهو الاصبغ وأسعفت الرجل بحاجته اذا قضيتهاله والماعفة المؤاتاة
  والمساعدة ⁦( فف)⁩ السفيف حزام الرحل وسفيقة من خوص نسيجة من خوص
  وقد سففت الخوص أسفه بالضم سفا وأسففته أيضا أى نسحجته وسففت الدواء بالكسر
  وأسففته بمعنى اذا أخذته غير ملتوت وكذلك السويق وكل دوا يؤخذغير معجون فهو
  سفوف يفتح السين مثل سقوف حب الرمان ونحوه وسفة من السويق بالضم أى حية منه
  وقيضة وأسف وجهه النؤور أى ذرّ عليه قال ضابئ بن الحرث البرجى يصف تورا
  شديدبريق الحاجبين كانما • أسق على نارفأصبح أكملا .
  وفى الحديث كانما أسف وجهه أى تغير وجهه فكا نه ذرّ عليه فى غيره قال لبيد
  أورجع واشمة أسفّ نوْورها * كففاتعرِّض فوقهنّ وشامها
  والاسفاف شدة النظروحدته وفى الحديثات الشعى كره أن يسف الرجل النظر الى أمه
  وابنته وأخته وأسفت السحابة اذادنت من الارض قال عبيد بن الابرص يذكريحابا
  قد تدلى حتى قرب من الارض
  دان مسف فويق ألارض هيدبه * يكاديد فعه من قام بالراح
  وكذلك الطائراذادنا من الارض فى طيرانه والسفساف الردمن كل شي والامر الحير
  وفى الحدين ان اللّٰه يحب معالى الامورويكر مسفسافها وبروى ويبغض وقد أسف الرجلى
  أى تتبع مداق الامور ومنه قيل للثيم العطية مسقسف والسفساف مادق من التراب
  والمففة الريح التى تثيره وتجرى فويق الارض والسفسفة انتخال الدقيق ونحوه
  ⁦(-قف)⁩ (لسقف للبيت والجهع سقوف وسقف أيضاعن الاخفسْ مثل رهن ورهن وقرى
  سقفامن فضة وقال الفراء سقف انماهو جميع سقيف كما يقال كثيب وكثب وقد سقفت
  البيت أسقفه سقفا والسقف السماه ويقال أيضاحى سقف أى طويل مسترخ والسقائف
  الواح السفينة كل لوح منهاستيفة والسقيفة الصفة ومفه سقيفة بنى ساعدة وأماقول الجاج
  اياى وهذه السقفاء فلا يعرف ماهو والسقف بالتحريك طول فى انحناه يقال رجسل أسقف
  بن السقف قال ابن السكمت ومنه اشتق أسقف النصارى لانه يتخاشم وهورنيس من
  رؤسائهم فى الدين ⁦(سكف)⁩ الاسكاف واحد الاساكفة والاسكوف لغفي
  وقول الشعاخ
  لم يبق الامنطق والطراف • وشعبتاميس براها اسكاف
  انماهو على التوهم كماقال آخر * لم تدرما نسج البرندج * وقال آخر
  ولم تذق
