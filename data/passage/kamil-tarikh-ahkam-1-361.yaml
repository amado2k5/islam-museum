  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 1. cildinin 361. sayfasından, itaat ve itaatsizlik ile müstehaplı amelleri ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu bölüm, farz ameller, görevler, itaat amelleri, müstehaplı amelleri, mekruh amelleri, haram amelleri ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Kamil fi al-Tarikh* karya Ibn al-Athir, Jilid 1, halaman 361, yang membahas tentang ketaatan dan kedurhakaan, serta amalan-amalan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
