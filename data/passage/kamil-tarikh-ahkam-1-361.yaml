text: "… بأعظم ممّا فعله العلاء، فأراد العلاء أن يصنع في الفرس شيئاً، ولم ينظر في الطاعة والمعصية، وقد كان عمر نهاه عن الغزو في البحر، ونهَى غيره أيضاً اتّباعاً لرسول اللهِ، وَلاف، وأبي بكر وخوف الغرر : فندب العلاء النّاسَ إلى …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 361، يرد فيه ذكر الطاعة والمعصية، والطاعة، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
