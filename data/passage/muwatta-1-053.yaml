summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما لا يجب منه الوضوء: سُئل هل في القيء وضوء، فقال: لا، ولكن ليتمضمض منه وليغسل فاه وليس عليه وضوء. ويذكر المحقق أنه لم يجد هذه الفتوى في غير رواية يحيى. {cite:muwatta-maruf-1997 p.60}"
