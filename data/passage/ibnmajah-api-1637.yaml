label: { ar: "سنن ابن ماجه 1637 — ما حُرّم", en: "Sunan Ibn Majah 1637 — what was made unlawful", ur: "سنن ابن ماجہ 1637 — جو حرام کیا گیا", es: "Sunan Ibn Majah 1637: lo que se declaró ilegal", fr: "Sunan Ibn Majah 1637 — ce qui a été rendu illégal" }
text: "… بْنِ نُسَىٍّ، عَنْ أَبِي الدَّرْدَاءِ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" أَكْثِرُوا الصَّلاَةَ عَلَىَّ يَوْمَ الْجُمُعَةِ فَإِنَّهُ مَشْهُودٌ تَشْهَدُهُ الْمَلاَئِكَةُ وَإِنَّ أَحَدًا لَنْ يُصَلِّيَ عَلَىَّ إِلاَّ عُرِضَتْ عَلَىَّ صَلاَتُهُ حَتَّى يَفْرُغَ مِنْهَا \". قَالَ قُلْتُ وَبَعْدَ الْمَوْتِ قَالَ \" وَبَعْدَ الْمَوْتِ إِنَّ اللَّهَ حَرَّمَ عَلَى الأَرْضِ أَنْ تَأْكُلَ أَجْسَادَ الأَنْبِيَاءِ \". فَنَبِيُّ اللَّهِ حَىٌّ يُرْزَقُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1637، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 1637 (Chapters Regarding Funerals), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1637، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1637 (Capítulos sobre los funerales), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 1637 (chapitres relatifs aux funérailles), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
