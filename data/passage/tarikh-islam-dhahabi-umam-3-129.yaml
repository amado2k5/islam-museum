text: "… مخرجَهما كان بعد وقعة بدر. فلما بلغ النّبيَّ بَيَمِ مخرجَهُما، بعث عَمْرو بن أُمِيَّة الضَّمري بكتابه إلى النَّجَاشِيّ. وَقال سعيد بن المسيّب وغيره : فبعث الكفّار مع عَمْرو بن العاص، وعبد اللّه بن أبي ربيعة للنَّجاشي، ولعُظماء الحبشة هدايا. فلما …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 3، ص 129، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 3, p. 129, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 3، ص 129 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
