text: "… مخرجَهما كان بعد وقعة بدر. فلما بلغ النّبيَّ بَيَمِ مخرجَهُما، بعث عَمْرو بن أُمِيَّة الضَّمري بكتابه إلى النَّجَاشِيّ. وَقال سعيد بن المسيّب وغيره : فبعث الكفّار مع عَمْرو بن العاص، وعبد اللّه بن أبي ربيعة للنَّجاشي، ولعُظماء الحبشة هدايا. فلما …"
