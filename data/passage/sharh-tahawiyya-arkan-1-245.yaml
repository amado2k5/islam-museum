text: "الإيمان بالقدر خيره وشره الإيمان بالقدر خيره وشره وقوله: والقدر خيره وشره، وحلوه ومره من اللّٰه تعالى. هذا الأصل السادس من أصول الإيمان: وهو الإيمان بالقدر، قال وَلِيقه وتؤمن بالقدر خيره وشره النبي والطحاوي هنا زَّم اله قال: والقدر خيره …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 245، يذكر أركان الإيمان، والإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 245, that mentions the pillars of faith, belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 245 کا اقتباس جس میں ارکانِ ایمان، تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 1, pág. 245, que menciona los pilares de la fe y la creencia en el decreto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 1, p. 245), mentionnant les piliers de la foi et la croyance au décret. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Tefsiri'ne dair tefsirinin 1. cildinin 245. sayfasından, imanın esasları ve kader inancına değinen bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-Izz tentang Akidah al-Tahawi, Jilid 1, halaman 245, yang menyebutkan rukun iman dan kepercayaan pada takdir; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
