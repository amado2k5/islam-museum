  أبنية ابهع ولم يجئ عليه الواحد الا آنك وأشة ⁦(أيك)⁩ الايت الشير الكثير الملتف
  الواحدة أيسكة ومن قرأ أصاب إلا يكة فهى الغيضة ومن قرأليكة فهى اسم القرية ويقال
  همامثل بكة ومكة
