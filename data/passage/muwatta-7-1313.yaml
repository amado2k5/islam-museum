label: { ar: "الموطأ 1313 — مالك: لا يكون السلب لأحد بغير إذن الإمام، ولم يبلغه أن النبي قال من قتل قتيلا فله سلبه إلا يوم حنين", en: "Muwatta 1313" }
summary:
  ar: "سئل مالك عمن قتل قتيلا من العدو، أيكون له سلبه بغير إذن الإمام؟ فقال لا يكون ذلك لأحد بغير إذن الإمام، ولا يكون ذلك من الإمام إلا على وجه الاجتهاد. ولم يبلغه أن رسول الله قال من قتل قتيلا فله سلبه إلا يوم حنين. {cite:muwatta-maruf-1997 p.587}"
