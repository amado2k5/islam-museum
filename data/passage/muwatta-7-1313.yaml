label: { ar: "الموطأ 1313 — مالك: لا يكون السلب لأحد بغير إذن الإمام، ولم يبلغه أن النبي قال من قتل قتيلا فله سلبه إلا يوم حنين", en: "Muwatta 1313", es: "Muwatta 1313", fr: "Muwatta 1313", ur: "موطا 1313", tr: "El-Muvatta 1313 — Malik: İmamın izni olmadan kimse ganimet alamaz ve Peygamberin, “Düşmanı öldürenin ganimeti kendisine aittir” diye buyurduğuna dair bir bilgisi yoktu, sadece Huneyn günü için bu hüküm geçerliydi.", id: "Al-Muwatta 1313 — Malik: Tidak seorang pun boleh mengambil rampasan perang tanpa izin Imam, dan dia tidak diberitahu bahwa Nabi bersabda, “Siapa pun yang membunuh musuh, maka rampasan perangnya menjadi miliknya,” kecuali pada hari Hunayn." }
summary:
  ar: "سئل مالك عمن قتل قتيلا من العدو، أيكون له سلبه بغير إذن الإمام؟ فقال لا يكون ذلك لأحد بغير إذن الإمام، ولا يكون ذلك من الإمام إلا على وجه الاجتهاد. ولم يبلغه أن رسول الله قال من قتل قتيلا فله سلبه إلا يوم حنين. {cite:muwatta-maruf-1997 p.587}"
  tr: "Malik'e, düşman askerini öldüren birinin, İmam'ın izni olmadan ganimetini alıp alamayacağı soruldu. O da, İmam'ın izni olmadan kimsenin bunu yapamayacağını ve İmam'ın ancak kendi takdirine bağlı olarak böyle bir izin vereceğini söyledi. Ayrıca, Allah Resulü'nün \"Düşman askerini öldüren ganimetini alır\" dediğini, Huneyn günü hariç, duymadığını ekledi. {cite:muwatta-maruf-1997 s.587}"
  id: "Malik ditanya tentang seseorang yang membunuh seorang tentara musuh; dapatkah ia mengambil rampasan perangnya tanpa izin Imam? Ia menjawab bahwa tidak seorang pun dapat melakukannya tanpa izin Imam, dan bahwa Imam hanya akan memberikan izin tersebut berdasarkan pertimbangannya sendiri. Ia menambahkan bahwa ia belum pernah mendengar bahwa Rasulullah SAW bersabda, \"Siapa pun yang membunuh seorang tentara musuh akan mendapatkan rampasan perangnya,\" kecuali pada hari Hunayn. {cite:muwatta-maruf-1997 p.587}"
