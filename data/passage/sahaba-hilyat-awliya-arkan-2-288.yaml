text: "… اللّٰه بن احمد بن حبل قال حدثف أبى قال ثنا عمد الوهاب قال ثنا أيوب عن أب قلابة عن أنس بن مالك عن النب. قال : لا ثلاث من كن فيسه وجد بهن حلاوة الايمان، أن يحب المرء لا يحبه …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 288، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
