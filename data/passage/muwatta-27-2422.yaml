label: { ar: "الموطأ 2422 — مالك: السارق يوجد معه ما سرق فيرد لصاحبه وتقطع يده", en: "Muwatta 2422" }
summary:
  ar: "قال مالك في الذي يسرق ما يجب عليه فيه القطع، ثم يوجد معه ما سرق فيُرد إلى صاحبه: إنه تُقطع يده. فإن قال قائل: كيف تُقطع يده وقد أُخذ المتاع منه ودُفع إلى صاحبه؟ فإنما هو بمنزلة الشارب يوجد منه ريح الخمر وليس به سكر فيُجلد الحد؛ لأنه إنما شربه ليسكره، فكذلك تُقطع يد السارق في السرقة التي أُخذت منه، لأنه إنما سرقها ليذهب بها. {cite:muwatta-maruf-1997 p.400}"
