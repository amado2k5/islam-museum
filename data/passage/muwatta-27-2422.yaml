label: { ar: "الموطأ 2422 — مالك: السارق يوجد معه ما سرق فيرد لصاحبه وتقطع يده", en: "Muwatta 2422", es: "Muwatta 2422", fr: "Muwatta 2422", ur: "موطا 2422", tr: "Al-Muwatta 2422 — Malik: Bir hırsız çaldığı şeyle yakalanırsa, o şey sahibine iade edilmeli ve eli kesilmelidir.", id: "Al-Muwatta 2422 — Malik: Jika seorang pencuri kedapatan membawa barang curiannya, maka barang itu harus dikembalikan kepada pemiliknya, dan tangannya harus dipotong." }
summary:
  ar: "قال مالك في الذي يسرق ما يجب عليه فيه القطع، ثم يوجد معه ما سرق فيُرد إلى صاحبه: إنه تُقطع يده. فإن قال قائل: كيف تُقطع يده وقد أُخذ المتاع منه ودُفع إلى صاحبه؟ فإنما هو بمنزلة الشارب يوجد منه ريح الخمر وليس به سكر فيُجلد الحد؛ لأنه إنما شربه ليسكره، فكذلك تُقطع يد السارق في السرقة التي أُخذت منه، لأنه إنما سرقها ليذهب بها. {cite:muwatta-maruf-1997 p.400}"
  tr: "Malik, bir şeyi çalıp, çalıntı eşyanın sahibine iade edilmesi durumunda, çalıntı eşyanın çalıntı eşyanın kendisinde bulunması halinde, çalıntı eşyanın sahibine iade edilmesi halinde, çalıntı eşyanın çalıntı eşyanın kesilmesi gerektiğini söylemiştir. Eğer biri, \"Eşya zaten elinden alınmış ve sahibine iade edilmişken, eli nasıl kesilebilir?\" diye sorarsa, bu, alkol kokan ama sarhoş olmayan birinin, sarhoş olmak için içki içtiği için kırbaçlanmasına benzer. Benzer şekilde, çalıntı eşya çalıntı olduğu için, hırsızın eli kesilmelidir, çünkü o sadece onu götürmek için çalmıştır. {cite:muwatta-maruf-1997 s.400}"
  id: "Malik berkata mengenai seseorang yang mencuri sesuatu yang mengakibatkan amputasi, dan kemudian barang curian tersebut ditemukan dalam kepemilikannya dan dikembalikan kepada pemiliknya: tangannya harus dipotong. Jika seseorang bertanya: bagaimana mungkin tangannya dipotong ketika barang tersebut telah diambil darinya dan dikembalikan kepada pemiliknya? Ini analog dengan seseorang yang berbau alkohol tetapi tidak mabuk, namun tetap dicambuk karena minum hingga mabuk. Demikian pula, tangan pencuri harus dipotong karena barang curian yang diambil darinya, karena ia hanya mencurinya untuk membawanya pergi. {cite:muwatta-maruf-1997 p.400}"
