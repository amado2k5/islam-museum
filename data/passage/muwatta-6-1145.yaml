label: { ar: "الموطأ 1145 — صدقة بن يسار عن ابن عمر: رجل من أهل اليمن قدم بعمرة مفردة، فأمره ابن عمر أن يهدي", en: "Muwatta 1145" }
text: "لَو لَمْ أجِدْ إلاَّا أن أذْبَحَ شاةً، لكانَ أحَبَّ إلَيَّ من أنْ أصومَ"
summary:
  ar: "يروي صدقة بن يسار المكي أن رجلا من أهل اليمن جاء إلى عبد الله بن عمر وقد ضفر رأسه، وقال إنه قدم بعمرة مفردة. قال له ابن عمر لو كنت معك أو سألتني لأمرتك أن تقرن، ثم قال خذ ما تطاير من رأسك وأهد. وسألت امرأة من أهل العراق عن الهدي، فقال إن لم يجد إلا أن يذبح شاة فهو أحب إليه من أن يصوم. {cite:muwatta-maruf-1997 p.519}"
