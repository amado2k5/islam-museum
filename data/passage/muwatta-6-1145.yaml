label: { ar: "الموطأ 1145 — صدقة بن يسار عن ابن عمر: رجل من أهل اليمن قدم بعمرة مفردة، فأمره ابن عمر أن يهدي", en: "Muwatta 1145", es: "Muwatta 1145", fr: "Muwatta 1145", ur: "موطا 1145", tr: "El-Muvatta 1145 — Sadaqah ibn Yasar, İbn Umar'dan rivayetle: Yemen'den bir adam tek bir Umre yapmak için geldi, bunun üzerine İbn Umar ona kurban kesmesini emretti.", id: "Al-Muwatta 1145 — Sadaqah Ibnu Yasar berdasarkan riwayat Ibnu Umar: Seorang pria dari Yaman datang untuk melaksanakan satu kali ibadah Umrah, lalu Ibnu Umar memerintahkannya untuk mempersembahkan kurban." }
text: "لَو لَمْ أجِدْ إلاَّا أن أذْبَحَ شاةً، لكانَ أحَبَّ إلَيَّ من أنْ أصومَ"
summary:
  ar: "يروي صدقة بن يسار المكي أن رجلا من أهل اليمن جاء إلى عبد الله بن عمر وقد ضفر رأسه، وقال إنه قدم بعمرة مفردة. قال له ابن عمر لو كنت معك أو سألتني لأمرتك أن تقرن، ثم قال خذ ما تطاير من رأسك وأهد. وسألت امرأة من أهل العراق عن الهدي، فقال إن لم يجد إلا أن يذبح شاة فهو أحب إليه من أن يصوم. {cite:muwatta-maruf-1997 p.519}"
  tr: "Sadaqah ibn Yasar al-Makki'nin rivayetine göre, Yemen'den bir adam saçları örgülü olarak Abdullah ibn Umar'ın yanına gelmiş ve tek bir Umre yapmak için geldiğini söylemiştir. İbn Umar ona, \"Eğer seninle birlikte olsaydım veya bana sorsaydın, sana Umre ve Hac'ı birlikte yapmanı söylerdim\" demiştir. Sonra da, \"Saçlarından düşenleri al ve kurban olarak sun\" demiştir. Irak'tan bir kadın kurban hakkında soru sormuş, İbn Umar da, \"Eğer sunabileceği başka bir şey yoksa, bir koyundan başka, oruçtan daha sevaptır\" demiştir. {cite:muwatta-maruf-1997 s.519}"
  id: "Sadaqah ibn Yasar al-Makki meriwayatkan bahwa seorang pria dari Yaman datang kepada Abdullah ibn Umar dengan rambut dikepang, mengatakan bahwa ia datang untuk melaksanakan Umrah tunggal. Ibn Umar berkata kepadanya, \"Seandainya aku bersamamu, atau seandainya kau bertanya kepadaku, aku akan menyuruhmu untuk melaksanakan Umrah dan Haji gabungan.\" Kemudian beliau berkata, \"Ambillah rambutmu yang rontok dan persembahkanlah sebagai kurban.\" Seorang wanita dari Irak bertanya tentang kurban tersebut, dan beliau berkata, \"Jika ia tidak memiliki kurban lain selain seekor domba, maka itu lebih dicintainya daripada berpuasa.\" {cite:muwatta-maruf-1997 p.519}"
