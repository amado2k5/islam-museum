text: "… أخرج الطبرانى فى الكبير عن سعيد بن المسيب قال : شهدت جنازة زيد بن ثابت فلما دفن فى قبره قال ابن عباسما : يا هؤلاء من سره ان يعلم كيف ذهاب العلم فهكذا ذهاب العلم، ايم اللّٰه القد ذهب اليوم …"
