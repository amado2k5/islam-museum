text: "… مات وهم باليمن. باب : بيان معنى قوله حياتى خير لكم وموتى خير لكم. باب : عِظَم المصيبة وما نزل بالمسلمين بموته والظُّلْمة التى غشيت المدينة، وتغيير قلوب الناس وأَحوالهم، وبعض ما رُثِى به من الشِّعر. باب : بلوغ هذا …"
