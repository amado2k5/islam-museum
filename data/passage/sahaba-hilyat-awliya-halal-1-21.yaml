text: "… قال فكيف لنا بالعقل ؟ فقال النى : إن العقل لا غاية له ولكن من أحل حلال اللّٰه وحرم حرامه محمى عاقلا، فان اجتهد بعد ذلك سمى عابدا، فان اجتهد بعد ذلك سمى جواداً فمن اجتهد فى العبادة وسمح فى …"
