text: "… عَبْدُ بْنُ حُمَيْدٍ، أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، قَالَ لَمْ أَتَخَلَّفْ عَنْ رَسُولِ اللَّهِ فِي غَزْوَةٍ غَزَاهَا حَتَّى كَانَتْ غَزْوَةُ تَبُوكَ إِلاَّ بَدْرًا وَلَمْ يُعَاتِبِ النَّبِيُّ أَحَدًا تَخَلَّفَ عَنْ بَدْرٍ إِنَّمَا خَرَجَ يُرِيدُ الْعِيرَ فَخَرَجَتْ قُرَيْشٌ مُغْوِثِينَ لِعِيرِهِمْ فَالْتَقَوْا عَنْ غَيْرِ مَوْعِدٍ كَمَا قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3102، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3102 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3102، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
