label: { ar: "صحيح مسلم 4669 — مضاعفة الأجر", en: "Sahih Muslim 4669 — the reward doubled or multiplied", ur: "صحیح مسلم 4669 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… لَيَهَابُونَ الصَّلاَةَ عَلَيْهِ يَقُولُونَ رَجُلٌ مَاتَ بِسِلاَحِهِ. فَقَالَ رَسُولُ اللَّهِ \" مَاتَ جَاهِدًا مُجَاهِدًا \". قَالَ ابْنُ شِهَابٍ ثُمَّ سَأَلْتُ ابْنًا لِسَلَمَةَ بْنِ الأَكْوَعِ فَحَدَّثَنِي عَنْ أَبِيهِ مِثْلَ ذَلِكَ غَيْرَ أَنَّهُ قَالَ - حِينَ قُلْتُ إِنَّ نَاسًا يَهَابُونَ الصَّلاَةَ عَلَيْهِ - فَقَالَ رَسُولُ اللَّهِ \" كَذَبُوا مَاتَ جَاهِدًا مُجَاهِدًا فَلَهُ أَجْرُهُ مَرَّتَيْنِ \". وَأَشَارَ بِإِصْبَعَيْهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4669، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4669 (The Book of Jihad and Expeditions), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4669، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
