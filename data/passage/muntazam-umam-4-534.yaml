text: "… فى ضر ومجاعة ونزل قريش ابن بدران ف نحو مائتى فارس على مشرعة باب البصرة فلما استقر بالقوم المنزل ركب عميد العراق من الجانب الشرق فى العسكرى وحواشى الدولة والما شميين والعوام والعجم الى آخر النهار فلم يجابوا عسكر البساسيرى …"
