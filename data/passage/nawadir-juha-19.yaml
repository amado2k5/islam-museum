label: { ar: "نوادر جحا الكبرى، ص 15 — «حداداً على والد ابني»", en: "Nawadir Juha al-Kubra, p. 15 — 'In Mourning for My Son's Father'", ur: "نوادر جحا الکبریٰ، ص 15 — «اپنے بیٹے کے باپ کے سوگ میں»", fr: "Nawadir Juha al-Kubra, p. 15 — « En deuil du père de mon fils »", es: "Nawadir Juha al-Kubra, p. 15 — «De luto por el padre de mi hijo»", tr: "Juha'nın Büyük Anekdotları, s. 15 — “Oğlumun babasının yasını tutarken”", id: "Anekdot Hebat Juha, hlm. 15 — “Dalam duka cita atas meninggalnya ayah anakku”" }
text: "… حداداً على والد ابني لبس يوماً ثياباً سوداء، فتقدم إليه بعض معارفه، وسأله عمّا إذا كانت أصابته مصيبة، ألبسته السواد. فقال: نعم، لقد أُصِبْتُ بوفاة والد إبني. الخازوق في أسفل الأنبوب اشتد في بعض أيام الصيف عطشه، وكان عائداً من …"
summary:
  ar: "لبس جحا السواد، وحين سُئل هل أصابته مصيبة قال نعم، فقد مات والد ابنه. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  en: "Juha wears black, and when asked whether a misfortune has struck him, he says yes: his son's father has died. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  ur: "جحا نے سیاہ لباس پہنا، اور جب پوچھا گیا کہ کیا اس پر کوئی مصیبت آئی ہے تو اس نے کہا ہاں، اس کے بیٹے کا باپ مر گیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  fr: "Juha porte du noir, et lorsqu'on lui demande si un malheur l'a frappé, il répond que oui : le père de son fils est mort. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  es: "Juha se viste de negro y, cuando le preguntan si le ha ocurrido una desgracia, dice que sí: ha muerto el padre de su hijo. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  tr: "Juha siyah giymişti ve başına bir felaket gelip gelmediği sorulduğunda, evet, çünkü oğlunun babası ölmüştü dedi. {cite:juha-nawadir-kubra-djuwaydi s. 15}"
  id: "Juha mengenakan pakaian hitam, dan ketika ditanya apakah musibah telah menimpanya, dia menjawab ya, karena ayah anaknya telah meninggal. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
