label: { ar: "الموطأ 2248 — مالك عن نافع عن عبد الله بن عمر: قال عمر بن الخطاب أيما وليدة ولدت من سيدها، فإنه لا يبيعها ولا يهبها ولا يورثها، وهو يستمتع منها، فإذا مات فهي حرة", en: "Muwatta 2248", es: "Muwatta 2248", fr: "Muwatta 2248", ur: "موطا 2248", tr: "El-Muvatta 2248 — Malik, Nafi’den, o da Abdullah ibn Umar’dan rivayetle: Ömer ibn el-Hattab şöyle dedi: “Efendisinin doğurduğu cariye kızını satamaz, başkasına veremez veya miras bırakamaz. Ondan faydalanabilir ve öldüğünde kız özgür kalır.”", id: "Al-Muwatta 2248 — Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Abdullah ibn Umar: Umar ibn al-Khattab berkata: “Budak perempuan yang lahir dari tuannya, tuannya tidak boleh menjualnya, memberikannya kepada orang lain, atau mewariskannya kepada siapa pun. Tuannya boleh menikmatinya, dan ketika ia meninggal, budak perempuan itu bebas.”" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن عمر بن الخطاب قال: أيما وليدة ولدت من سيدها، فإنه لا يبيعها ولا يهبها ولا يورثها، وهو يستمتع بها، فإذا مات فهي حرة. {cite:muwatta-maruf-1997 p.327}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Ömer ibn el-Hattab şöyle buyurmuştur: \"Efendisinin doğurduğu her cariye kızını ne satabilir, ne verebilir, ne de miras bırakabilir. Ondan istediği gibi faydalanabilir ve eğer efendi ölürse, cariye özgür kalır.\" {cite:muwatta-maruf-1997 s.327}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa Umar ibn al-Khattab berkata: “Budak perempuan yang lahir dari tuannya, tuannya tidak boleh menjualnya, memberikannya kepada orang lain, atau mewariskannya kepada siapa pun. Tuannya boleh menikmatinya, dan jika ia meninggal, maka budak perempuan itu bebas.” {cite:muwatta-maruf-1997 p.327}"
