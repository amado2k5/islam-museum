  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن عمر بن الخطاب قال: أيما وليدة ولدت من سيدها، فإنه لا يبيعها ولا يهبها ولا يورثها، وهو يستمتع بها، فإذا مات فهي حرة. {cite:muwatta-maruf-1997 p.327}"
