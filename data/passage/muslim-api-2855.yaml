label: { ar: "صحيح مسلم 2855 — ما حُرّم", en: "Sahih Muslim 2855 — what was made unlawful", ur: "صحیح مسلم 2855 — جو حرام کیا گیا" }
text: "… قَتَادَةَ فَقَالَ \" خُذُوا سَاحِلَ الْبَحْرِ حَتَّى تَلْقَوْنِي \". قَالَ فَأَخَذُوا سَاحِلَ الْبَحْرِ. فَلَمَّا انْصَرَفُوا قِبَلَ رَسُولِ اللَّهِ أَحْرَمُوا كُلُّهُمْ إِلاَّ أَبَا قَتَادَةَ فَإِنَّهُ لَمْ يُحْرِمْ فَبَيْنَمَا هُمْ يَسِيرُونَ إِذْ رَأَوْا حُمُرَ وَحْشٍ فَحَمَلَ عَلَيْهَا أَبُو قَتَادَةَ فَعَقَرَ مِنْهَا أَتَانًا فَنَزَلُوا فَأَكَلُوا مِنْ لَحْمِهَا - قَالَ - فَقَالُوا أَكَلْنَا لَحْمًا وَنَحْنُ مُحْرِمُونَ - قَالَ - …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2855، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 2855 (The Book of Pilgrimage), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 2855، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
