label: { ar: "مسلم 2557 — من سره أن يبسط له في رزقه أو ينسأ له في أثره فليصل رحمه", en: "Muslim 2557 — Whoever wishes his provision expanded and his term deferred should keep his kin", es: "Muslim 2557 — Quien desee que se le amplíe su provisión y se le difiera su plazo debe mantener a sus parientes.", fr: "Muslim 2557 — Quiconque souhaite une augmentation de ses ressources et un report de son terme doit garder ses proches", ur: "مسلم 2557 - جو شخص چاہتا ہے کہ اس کے رزق میں وسعت ہو اور اس کی مدت ملتوی ہو تو وہ اپنے رشتہ داروں کو رکھے۔", tr: "Müslim 2557 — Rızkının artmasını veya ömrünün uzamasını isteyen kimse akrabalık bağlarını korumalıdır.", id: "Muslim 2557 — Barangsiapa ingin rezekinya bertambah atau umurnya panjang, hendaklah ia menjaga hubungan kekerabatan." }
text: "قال رسول الله: «من سره أن يبسط له في رزقه، أو ينسأ له في أثره، فليصل رحمه»"
summary:
  ar: "رواية أنس بن مالك في باب صلة الرحم من صحيح مسلم؛ يقرن بسط الرزق ونسأ الأثر بصلة الرحم."
  tr: "Sahih Müslim'de akrabalık bağlarını koruma bölümünde Enes bin Malik'in rivayetine göre, rızkın genişlemesi ve ömrün uzaması akrabalık bağlarının korunmasıyla ilişkilidir."
  id: "Riwayat Anas bin Malik dalam bab tentang menjaga hubungan kekerabatan di Sahih Muslim menghubungkan perluasan rezeki dan perpanjangan umur dengan menjaga hubungan kekerabatan."
