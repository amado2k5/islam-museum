summary:
  ar: "يروي مالك أنه سأل ابن شهاب ونافعاً مولى ابن عمر عن رجل دخل مع الإمام في الصلاة وقد سبقه الإمام بركعة، أيتشهد معه في الركعتين والأربع وإن كان ذلك له وتراً، فقالا: نعم، ليتشهد معه؛ ويقول مالك إن ذلك الأمر عند أهل المدينة. وهو في باب التشهد في الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.145} {cite:muwatta-maruf-1997 p.146}"
