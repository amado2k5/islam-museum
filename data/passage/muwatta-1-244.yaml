label: { ar: "الموطأ 244 — ابن شهاب ونافع: المسبوق يتشهد مع الإمام وإن كان له وتراً", en: "Muwatta 244", es: "Muwatta 244", fr: "Muwatta 244", ur: "موطا 244", tr: "El-Muvatta 244 — İbn Şihab ve Nafi’: Namaza geç katılan kişi, rekat sayısı tek olsa bile, imamla birlikte teşehhüdü okur.", id: "Al-Muwatta 244 — Ibn Shihab dan Nafi’: Orang yang bergabung dalam salat terlambat membaca Tasyahhud bersama Imam, meskipun jumlah rakaatnya ganjil." }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب ونافعاً مولى ابن عمر عن رجل دخل مع الإمام في الصلاة وقد سبقه الإمام بركعة، أيتشهد معه في الركعتين والأربع وإن كان ذلك له وتراً، فقالا: نعم، ليتشهد معه؛ ويقول مالك إن ذلك الأمر عند أهل المدينة. وهو في باب التشهد في الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.145} {cite:muwatta-maruf-1997 p.146}"
  tr: "Malik, İbn Şihab ve İbn Ömer'in azatlı kölesi Nafi'ye, imamla birlikte namaza katılan ve imamın bir rekatı tamamlamış olduğu bir adam hakkında sorduğunu anlatır. Bu adam, tek sayılı namazda bile olsa, iki veya dört rekatta imamla birlikte teşehhüdü okumalı mıdır? Onlar da: Evet, onunla birlikte teşehhüdü okumalıdır diye cevap verdiler. Malik, bunun Medine halkı arasında yaygın bir uygulama olduğunu söyler. Bu, namazdaki teşehhüd bölümünde yer almaktadır. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Abdül-Razzak tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.145} {cite:muwatta-maruf-1997 s.146}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Ibn Shihab dan Nafi', budak yang dibebaskan oleh Ibn Umar, tentang seorang pria yang bergabung dengan imam dalam salat, dan imam telah menyelesaikan satu rakaat. Haruskah ia membaca tasyahhud bersama imam pada rakaat kedua atau keempat, meskipun itu adalah salatnya yang ganjil? Mereka menjawab: Ya, ia harus membaca tasyahhud bersamanya. Malik mengatakan bahwa ini adalah kebiasaan di kalangan penduduk Madinah. Hal ini terdapat dalam surah tentang tasyahhud dalam salat. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Abd al-Razzaq. {cite:muwatta-maruf-1997 p.145} {cite:muwatta-maruf-1997 p.146}"
