label: { ar: "صحيح البخاري 3936 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 3936 — what was left behind: estate and inheritance", ur: "صحیح بخاری 3936 — ترکہ اور میراث", es: "Sahih al-Bukhari 3936 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 3936 — Ce qui a été laissé derrière: biens et héritage" }
text: "… لَنْ تُخَلَّفَ فَتَعْمَلَ عَمَلاً تَبْتَغِي بِهِ وَجْهَ اللَّهِ إِلاَّ ازْدَدْتَ بِهِ دَرَجَةً وَرِفْعَةً، وَلَعَلَّكَ تُخَلَّفُ حَتَّى يَنْتَفِعَ بِكَ أَقْوَامٌ، وَيُضَرَّ بِكَ آخَرُونَ، اللَّهُمَّ أَمْضِ لأَصْحَابِي هِجْرَتَهُمْ، وَلاَ تَرُدَّهُمْ عَلَى أَعْقَابِهِمْ، لَكِنِ الْبَائِسُ سَعْدُ ابْنُ خَوْلَةَ يَرْثِي لَهُ رَسُولُ اللَّهِ أَنْ تُوُفِّيَ بِمَكَّةَ \". وَقَالَ أَحْمَدُ بْنُ يُونُسَ وَمُوسَى عَنْ إِبْرَاهِيمَ \" أَنْ تَذَرَ وَرَثَتَكَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3936، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3936 (Merits of the Helpers in Madinah (Ansaar)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3936، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3936 (Méritos de los Ayudantes en Medina (Ansar)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 3936 (Mérites des Compagnons de Médine (Ansar)), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
