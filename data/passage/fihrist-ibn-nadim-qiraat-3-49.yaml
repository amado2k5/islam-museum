text: "- - قبل الذاريات قال أبو شاذان قال ابن سيرين وكان عبد اللّٰه بن مسعود لا يكتب المعوذتين فى مصحفه ولا فائحة الكتاب وروى الفضل باسناده عن الاعمش قاله فى قوله فى قراءة عبد اللّه حم سق قال محمد بن …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 3، ص 49، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 3, p. 49, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 3، ص 49 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 3, pág. 49, que menciona las lecturas del Corán, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Fihrist d'Ibn al-Nadim (tome 3, page 49) mentionnant les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Nadim'in Fihrist adlı eserinin 3. cildinin 49. sayfasından, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları konusunu ele alan bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Volume 3, halaman 49, yang membahas bacaan Al-Quran, penyusunan Al-Quran, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
