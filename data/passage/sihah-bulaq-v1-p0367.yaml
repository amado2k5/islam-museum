text: |-
  ٢٧٤
  صل الشين) شذذ) شذعنه يشذ ويشذشذوذا انفرد عن الجهوروندرنهوشاذ
  وأسذه غيره وشذاد الناس الذين يكونون فى القوم وليسوا من قبائلهم وشذان الحصى، بالفتح
  والمون المتفرَق منه قال امى والقيس
  يطارشذان الحصى بناسم * صلاب العجاملدومها غير أمعرا
  وشذان الناس أيضاصتفرّقوهم ⁦(شجذ)⁩ الشجذة المطرة الضعيفة وهى فوق البغشة وقد
  أشحذت السمام أى صعف مطرها قال امر والقيس
  تظهر الوداذاما أشجذت • وتواريه اذا مانشتكر
  ⁦( صذ)⁩ :هذت الكين أخمذ شمذا أى حددته والمشهذ المسن والشهذات
  بالّهريك الجمائع ⁦(ش ذ)⁩ الثقذان الذى لا يكاد يتام ولايكون الاعيونا يسيب الناس
  بالعين تقول منه شقذ الرج-ل بالكسريشة نشة ذا فهوشة ذوشقذان بالتحريك وشقذ أيضا
  بعف ذهب ويعدية ال أشقذه فتقذ أى طرده فذهب وأنشد الاصى للمحارب
  لقد غضبواءلى وأشقذونى • فصرت كانى فرأمتار
  ابن الاعرابى ما يه شقذ ولا تقذ أى مايه والأوفلان يشاقدنى أى يعادن والشقذ ولد الحرباه
  ويجعه شقذات مثل صنو وصنوان والثقذاء العقاب الشديدة الجوع ⁦(شمذ)⁩ شمذت
  النافة تشمذ بالكسر شماذا وشموذا أى لقمحت فثالت يذنيها قال أبو الجراح من الكاش
  ما يشقذومنها ما يغلّ والاشتماذ أن يضرب الالية حتى ترتفع فيسفد والغل أن يسقد من غير
  أن يفعل ذلك ⁦( مشذ)⁩ المشوذ العمامة قال الوليدين بعقبة وكان قدولى صدقات تغلب
  اذا ما شددت الرأس من بمشوذ • فغيك مى تغلب ابنة وائل.
  وفى الحديث أمرهم أن يمسصوا على المشاوذ والتساخين وتشوذ الرجلى واشتاذ أى تعمم
  صل الطاء برزذ) الاصحعى سكر طيرزذ وطيرزل وطبرزن ثلاث لغسات معريات
  (طرهد الطرمذة ايس من كلام أهل البادية قال الرايز
  طر مذشق على طرماذ
  والمطر مذ الذى له كلام وليس له فعل
  ل الين وذ عدت بفلان واستعذت بد أى لجأت اليه وهو عياذى أى
  مكماى وأعذت غيرى به وعوّذته به؟عى وقواهم معاذ ا لله أى أءوذبا لله مماذا تجعله بدلا من
  اللفظ بالفعل لانه مصدروان كان غير مستعمل مثل سجان ويقال أيضا معاذة اللّٰه ومعاذوجه
  اقد ومعاذة رجه الله وهومثل المعنى والمعناة وا. أتى والمأناة ويقال عوذبالله منك أى أعوذ
  باقد منك قال الرايز
  قالت ونيها حيدة رذهر • عوذبر بى منكم وجر
  والعوذة والمهاذة والتعويد كله بمعى ومعوّذ الفرس موضع القلادة ودائرة المعوّذ تستحب
  وقرأت المعوذتين بكسر الواووهماسورتان والهوذ الحديشات النتاج من الظباء والابل
  والخيل واحدتها عاند مثل حدقر وحول ويجمع أيضاعلى عوذان مشل راع ودعيان وحاتو
  وحوران تقول هى عاندّبينة العؤود وذات اذا ولدت عشرة أيام أوخسة عشر يوماتم هى
  مطفل بعد يقال هى فى عياذها أى يحدثان نتاجها والموّذ النيت فى أصل الشولك أوفى المكان
  الازن
