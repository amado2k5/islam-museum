label: { ar: "جامع الترمذي 686 — ما كرهه الفقهاء، ما كُره", en: "Jami' al-Tirmidhi 686 — what the jurists disliked; what was disliked", ur: "جامع ترمذی 686 — جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا", fr: "Jami' al-Tirmidhi 686 — ce que les juristes ont réprouvé ; ce qui fut réprouvé", es: "Yami' al-Tirmidhi 686 — lo que los juristas reprobaron; lo que se reprobó", tr: "Cami' el-Tirmizi 686 — Fıkıhçıların hoşlanmadığı, hoş karşılanmayan şeyler", id: "Jami' al-Tirmidhi 686 — Apa yang tidak disukai oleh para ahli hukum, apa yang tidak disukai" }
text: "… أَبُو عِيسَى حَدِيثُ عَمَّارٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَمَنْ بَعْدَهُمْ مِنَ التَّابِعِينَ وَبِهِ يَقُولُ سُفْيَانُ الثَّوْرِيُّ وَمَالِكُ بْنُ أَنَسٍ وَعَبْدُ اللَّهِ بْنُ الْمُبَارَكِ وَالشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ كَرِهُوا أَنْ يَصُومَ الرَّجُلُ الْيَوْمَ الَّذِي يُشَكُّ فِيهِ وَرَأَى أَكْثَرُهُمْ إِنْ صَامَهُ فَكَانَ مِنْ شَهْرِ رَمَضَانَ أَنْ يَقْضِيَ يَوْمًا مَكَانَهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 686، يرد فيه ذكر ما كرهه الفقهاء، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 686 (The Book on Fasting), whose wording mentions what the jurists disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 686، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 686, dont le texte mentionne ce que les juristes ont réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 686, cuyo texto menciona lo que los juristas reprobaron, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami'ül-Tirmizi'nin 686 numaralı hadisinde, fıkıhçıların hoşlanmadığı ve hoş karşılanmayan şeyler anlatılmaktadır. Bu hadis, farz, ibadet, sünnet, mekruh, haram ve küçük günahlar üzerine araştırma yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 686, menyebutkan apa yang tidak disukai oleh para ahli fiqih dan apa yang dianggap tidak disukai. Hadits ini disusun oleh seorang peneliti mengenai amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
