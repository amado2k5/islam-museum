text: "… الرياح والأخلاط الغليظة اللزجة، ويفتح السدد، ويصلح هواء الطاعون والوباء، وهو يفسد الذوق ويخدّر، ويخشن الصدر ويصلحه العسل، ويبطئ الهضم ويصلحه الكرفس. وفي الطب الحديث يستعمل كمسكّن عام وهاضم، وضد التشنجات، وضد رياح المعدة. التداوي بالنباتات والأعشاب قديماً وحديثاً، أحمد …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 280، يذكر الطب والطبيب، والطاعون والوباء، والبيمارستان وصناعة الطب، وأعضاء البدن، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 280, that mentions medicine and the physician, plague and epidemic, the hospital and the medical craft, the organs of the body, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 280 کا اقتباس جس میں طب اور طبیب، طاعون اور وبا، بیمارستان، اعضائے بدن، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
