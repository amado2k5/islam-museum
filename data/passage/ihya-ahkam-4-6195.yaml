text: "… تحصى فإن المعصية ظاهرة والطاعة ظاهرة وإنما الغامض تقديم بعض الطاعات على بعض كتقديم الفرائض كلها على النوافل وتقديم فروض الأعيان على فروض الكفاية وتقديم فرض كفاية لا قائم به على ما قام به غيره وتقديم الأهم من فروض ا …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 6195، يرد فيه ذكر الفريضة والفرائض، والفرض، وفرض العين، وفرض الكفاية، والطاعات، والنافلة والنوافل، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 6195, whose wording mentions the obligation (farida), the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya), the acts of obedience, the supererogatory (nafila), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 6195 کا اقتباس جس میں فریضہ اور فرائض، فرض، فرضِ عین، فرضِ کفایہ، طاعات، نفل اور نوافل، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din de al-Ghazali, volume numérisé 4, p. 6195, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), les actes d'obéissance, le surérogatoire (nafila), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen digitalizado 4, p. 6195, cuyo texto menciona la obligación (farida), lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), los actos de obediencia, lo supererogatorio (nafila), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin İhya Ulum el-Din (Dinî İlimlerin Yeniden Canlandırılması) adlı eserinin 4. cildinin 6195. sayfasından bir alıntı, farz ibadetler, bireysel yükümlülükler, toplu yükümlülükler, itaat ibadetleri, nafile ibadetler ve küçük günahlar konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ibadetler, görevler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram edilen ibadetler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din (Kebangkitan Ilmu-ilmu Agama) karya Al-Ghazali, Jilid 4, halaman 6195, membahas tentang amalan wajib, kewajiban individu, kewajiban kolektif, amalan ketaatan, amalan sunnah, dan amalan ketaatan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
