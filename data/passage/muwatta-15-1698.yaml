label: { ar: "الموطأ 1698 — ابن شهاب: المبتوتة لا تخرج من بيتها حتى تحل، وليست لها نفقة، إلا أن تكون حاملا فينفق عليها حتى تضع", en: "Muwatta 1698", es: "Muwatta 1698", fr: "Muwatta 1698", ur: "موطا 1698", tr: "İbn Şihab: Geri dönülmez şekilde boşanmış bir kadın, boşanma tamamlanana kadar evini terk etmemelidir ve hamile olmadığı sürece nafaka hakkı yoktur; hamile ise doğum yapana kadar geçimi sağlanmalıdır.", id: "Al-Muwatta 1698 — Ibn Shihab: Seorang wanita yang telah dicerai secara mutlak tidak boleh meninggalkan rumahnya sampai perceraian selesai, dan dia tidak berhak atas nafkah kecuali jika dia hamil, dalam hal ini dia harus diberi nafkah sampai dia melahirkan." }
summary:
  ar: "يروي مالك أنه سمع ابن شهاب يقول المبتوتة لا تخرج من بيتها حتى تحل، وليست لها نفقة، إلا أن تكون حاملا فينفق عليها حتى تضع حملها. قال مالك وهذا الأمر عندنا. {cite:muwatta-maruf-1997 p.95}"
  tr: "Malik, İbn Şihab'ın şöyle dediğini işittiğini rivayet etmiştir: \"Geri dönülmez şekilde boşanmış bir kadın, boşanma tamamlanana kadar evinden ayrılmamalıdır ve hamile olmadığı sürece nafaka hakkı yoktur; hamile ise doğum yapana kadar nafakası ödenmelidir.\" Malik şöyle dedi: \"Bu, aramızda yerleşik uygulamadır.\" {cite:muwatta-maruf-1997 s.95}"
  id: "Malik meriwayatkan bahwa ia mendengar Ibnu Shihab berkata: Seorang wanita yang telah dicerai secara mutlak tidak boleh meninggalkan rumahnya sampai perceraian selesai, dan ia tidak berhak atas nafkah kecuali jika ia hamil, dalam hal ini ia harus ditopang sampai ia melahirkan. Malik berkata: Ini adalah praktik yang telah mapan di antara kami. {cite:muwatta-maruf-1997 p.95}"
