label: { ar: "الموطأ 672 — مالك: الركاز دفن يوجد من دفن الجاهلية ما لم يطلب بمال ولا كبير عمل", en: "Muwatta 672", es: "Muwatta 672", fr: "Muwatta 672", ur: "موطا 672", tr: "El-Muvatta 672 — Malik: Gömülü hazine, İslam öncesi döneme ait, para veya büyük çaba harcanmadan bulunan bir mezardır.", id: "Al-Muwatta 672 — Malik: Harta karun terpendam adalah kuburan yang ditemukan dari era pra-Islam, asalkan tidak dicari dengan uang atau usaha yang besar." }
summary:
  ar: "قول لمالك: الأمر الذي لا اختلاف فيه عندنا والذي سمع أهل العلم يقولون إن الركاز إنما هو دفن يوجد من دفن الجاهلية ما لم يُطلب بمال ولم يُتكلف فيه نفقة ولا كبير عمل ولا مؤونة، فأما ما طُلب بمال وتُكلف فيه كبير عمل فأُصيب مرة وأُخطئ مرة فليس بركاز. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.340}"
  tr: "Malik şöyle demiştir: Aramızda ihtilaf bulunmayan ve âlimlerin de kabul ettiği husus şudur: Gömülü hazine (rikaz), ancak İslam öncesi dönemden kalma ve para ile aranmamış, önemli bir masraf, emek veya çaba gerektirmemiş olanlardır. Ancak para ve emekle aranmış, bazen bulunmuş bazen bulunmamış olanlar gömülü hazine sayılmaz. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.340}"
  id: "Malik berkata: Masalah yang tidak ada perbedaan pendapat di antara kita, dan yang telah didengar oleh para ulama, adalah bahwa harta karun terpendam (rikaz) hanyalah harta karun yang ditemukan dari era pra-Islam, dengan syarat harta karun tersebut tidak dicari dengan uang, dan tidak memerlukan biaya, tenaga, atau usaha yang besar. Namun, harta karun yang dicari dengan uang dan tenaga, dan yang kadang ditemukan dan kadang tidak, tidak dianggap sebagai harta karun terpendam. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.340}"
