label: { ar: "الموطأ 672 — مالك: الركاز دفن يوجد من دفن الجاهلية ما لم يطلب بمال ولا كبير عمل", en: "Muwatta 672" }
summary:
  ar: "قول لمالك: الأمر الذي لا اختلاف فيه عندنا والذي سمع أهل العلم يقولون إن الركاز إنما هو دفن يوجد من دفن الجاهلية ما لم يُطلب بمال ولم يُتكلف فيه نفقة ولا كبير عمل ولا مؤونة، فأما ما طُلب بمال وتُكلف فيه كبير عمل فأُصيب مرة وأُخطئ مرة فليس بركاز. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.340}"
