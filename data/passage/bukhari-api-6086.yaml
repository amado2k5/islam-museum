label: { ar: "صحيح البخاري 6086 — ضحك وتبسم", en: "Sahih al-Bukhari 6086 — laughter and smiling", ur: "صحیح بخاری 6086 — ہنسی اور تبسم", fr: "Sahih al-Bukhari 6086 — rire et sourire", es: "Sahih al-Bujari 6086 — risa y sonrisa", tr: "Sahih el-Buhari 6086 — Kahkaha ve Gülümseme", id: "Sahih al-Bukhari 6086 — Tawa dan Senyum" }
text: "… اللَّهِ بِالطَّائِفِ قَالَ إِنَّا قَافِلُونَ غَدًا إِنْ شَاءَ اللَّهُ . فَقَالَ نَاسٌ مِنْ أَصْحَابِ رَسُولِ اللَّهِ لاَ نَبْرَحُ أَوْ نَفْتَحَهَا. فَقَالَ النَّبِيُّ فَاغْدُوا عَلَى الْقِتَالِ . قَالَ فَغَدَوْا فَقَاتَلُوهُمْ قِتَالاً شَدِيدًا وَكَثُرَ فِيهِمُ الْجِرَاحَاتُ فَقَالَ رَسُولُ اللَّهِ إِنَّا قَافِلُونَ غَدًا إِنْ شَاءَ اللَّهُ . قَالَ فَسَكَتُوا فَضَحِكَ رَسُولُ اللَّهِ. قَالَ الْحُمَيْدِيُّ حَدَّثَنَا سُفْيَانُ بِالْخَبَرِ كُلَّهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6086، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 6086, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 6086، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6086, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 6086, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 6086 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6086, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
