text: "… فيهم فلم اجد احداً يصلح لهذا الامر غير عتبة فلما اخبرتنى بسنه عرفت انه ليس به حين جاوز الاربعين فلم يوح اليه قال ابو سفيان فضرب الدهر ضربة فاوحى الى رسول اللّه وخرجت فى ركب من قريش اريد اليمن فى …"
