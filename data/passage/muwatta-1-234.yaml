label: { ar: "الموطأ 234 — إذا قال الإمام سمع الله لمن حمده فقولوا اللهم ربنا لك الحمد", en: "Muwatta 234" }
text: "إذا قال الإمام: سمع الله لمن حمده، فقولوا: اللهم ربنا لك الحمد، فإنه من وافق قوله قول الملائكة غفر له ما تقدم من ذنبه"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر عن أبي صالح السمان عن أبي هريرة، في باب ما جاء في التأمين خلف الإمام: أمر النبي المأمومين أن يقولوا «اللهم ربنا لك الحمد» إذا قال الإمام «سمع الله لمن حمده»، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه. ويخرّجه المحقق عند البخاري (796، 3228) ومسلم (2/17) وأبي داود (848) والترمذي (267) والنسائي (2/196) وابن حبان وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (22/31). {cite:muwatta-maruf-1997 p.141} {cite:muwatta-maruf-1997 p.142}"
