  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 414, that mentions honey as a remedy, pain, named diseases, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
