  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 414, qui mentionne le miel comme remède, la douleur, les maladies nommées, les organes du corps, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
