text: "… وبزر الكرفس، وأنيسون، وعاقر قرحا، وبزر الأنجرة، وبزر السذاب الجبلي أجزاء متساوية، تجمع هذه الأدوية مسحوقة، ويعجن بعسل منزوع الرغوة، وتستعمل الشربة وزن درهم بماء قشور أصل الرازيانج، وقشور أصل الكرفس. ترتيب معجون آخر لجالينوس: نافع من وجع الكبد والسعال …"
summary:
