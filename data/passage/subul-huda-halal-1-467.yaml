text: "… الوجه، وفي قصص الكسائي: أَن اللّٰه تعالى قال لموسى عليله : إِن محمداً هو النجم الزاهر. الزاهد : وهو من أَسمائه في الكتب المتقدمة، والزهد خلاف الرغبة، وقيل هو ترك الحرام لأن الحلال مباح، وقيل الزهد في الحرام واجب، وفي …"
