label: { ar: "دلائل النبوة للبيهيقي — حنين الجذع", en: "Bayhaqi's Dala'il — the palm trunk's lament", ur: "بیہقی کی دلائل — کھجور کے تنا کے رونے کی صدا", es: "Dala'il de Bayhaqi: el lamento del tronco de la palmera", fr: "Le Dala'il de Bayhaqi — la lamentation du tronc de palmier", tr: "El-Beyhakî'nin Peygamberlik Alametleri - Hortumun Özlemi", id: "Tanda-Tanda Kenabian oleh Al-Bayhaqi — Kerinduan Belalai" }
text: "كان يقوم يوم الجمعة إلى شجرة أو إلى نخلة، فلما كان يوم الجمعة ذهب إلى المنبر فصاحت النخلة صياح الصبي، فنزل فضمها إليه، كانت تبكي على ما كانت تسمع من الذكر عندها"
summary:
  ar: "يذكر البيهيقي أن النبي كان يخطب إلى جذع أو نخلة حتى وُضع له المنبر، فحنّ الجذع وبكى حتى سُمع صياحه، فنزل النبي فضم النخلة إليه، وقيل كانت تبكي على ما كانت تسمع من الذكر عندها، ثم رجع إلى المنبر فسكن. ويروي بسند آخر عن أبي هريرة أن النبي كان يصلي إلى جذع حتى صُنع له منبر فمر الجذع به فخار حتى تصدع وانشق، فنزل فمسحه بيده، ثم أخذه أبي بن كعب فكان في بيته حتى بليته الأرضة. ويورد قول الشافعي: ما أعطى الله نبياً ما أعطى محمداً، فالجذع الذي كان يخطب إليه جنبه حتى هيء له المنبر حنّ الجذع حتى سُمع صوته."
  en: "The Prophet used to preach facing a palm trunk until a minbar was made for him; the trunk then wailed and wept until its cry was heard, and he came down and embraced it — it was said to weep for no longer hearing the remembrance at its side. Another chain has the trunk crack and split as he passed it, until he touched it and it fell silent; Ubayy ibn Ka'b kept it in his house until worms consumed it. Al-Shafi'i summed it: God gave no prophet what He gave Muhammad — the trunk that wailed when the minbar was set for him."
  ur: "نبی جمعہ کے خطبے کے لیے ایک تنا یا کھجور کے درخت کے سامنے کھڑے ہوتے تھے یہاں تک کہ ان کے لیے منبر بنایا گیا۔ منبر بننے کے بعد تنا رونے لگا یہاں تک کہ اس کی آہٹ سنائی دی، تو نبی اتر کر اس سے لپٹ گئے — کہا جاتا ہے کہ وہ اس لیے روتا تھا کہ اس کے پاس ذکر سننے کو نہ رہا۔ ایک دوسری روایت میں تنا پھٹ گیا تو اس نے ہاتھ سے مسح دیا تو خاموش ہو گیا۔ شافعی نے کہا: اللہ نے کسی نبی کو وہ نہیں دیا جو اس نبی کو دیا، یہ تنا بھی اسی میں سے ہے۔"
  es: "El Profeta solía predicar frente a un tronco de palma hasta que le construyeron un púlpito; entonces el tronco gemía y lloraba hasta que se oía su lamento, y él descendía y lo abrazaba. Se decía que lloraba por no oír más el recuerdo a su lado. Otra versión cuenta que el tronco se agrietó y se partió al pasar junto a él, hasta que lo tocó y enmudeció; Ubayy ibn Ka'b lo guardó en su casa hasta que los gusanos lo consumieron. Al-Shafi'i lo resumió así: Dios no le dio a ningún profeta lo que le dio a Muhammad: el tronco que gemía cuando le construyeron el púlpito."
  fr: "Le Prophète avait coutume de prêcher face à un tronc de palmier jusqu'à ce qu'un minbar lui soit dressé; alors, le tronc gémissait et pleurait jusqu'à ce que l'on entende son cri, et il descendait et l'enlaçait – on disait qu'il pleurait de ne plus entendre le rappel à ses côtés. Une autre version raconte que le tronc se fendit et se brisa au passage du Prophète, jusqu'à ce qu'il le touche et qu'il se taise; Ubayy ibn Ka'b le conserva chez lui jusqu'à ce que les vers le dévorent. Al-Shafi'i résume cela ainsi: Dieu n'a donné à aucun prophète ce qu'Il a donné à Muhammad – le tronc qui gémissait lorsque le minbar fut dressé pour lui."
  tr: "El-Beyhaki, Peygamberin minber yapılana kadar hutbelerini bir ağaç gövdesine veya hurma ağacına yaslanarak verdiğini rivayet eder. Gövde daha sonra özlem duyar ve ağlar, ta ki feryadı duyulana kadar. Peygamber aşağı iner ve hurma ağacını kucaklar; rivayete göre ağaç, yanında duyduğu Allah'ı anma sesinden dolayı ağlamıştır. Sonra minbere döner ve ağaç susar. Ayrıca, Ebu Hurayra'dan başka bir rivayet zinciriyle, Peygamberin minber yapılana kadar hutbelerini bir ağaç gövdesine yaslanarak verdiğini de rivayet eder. Gövde yanından geçerken çatlar ve yarılır. Aşağı iner ve eliyle siler. Sonra Ubeyy ibn Ka'b onu alır ve termitler yiyene kadar evinde saklar. Ayrıca Şafiî'nin şöyle dediğini de aktarır: \"Allah, Muhammed'e verdiği şeyi hiçbir peygambere vermedi. Minber yapılana kadar hutbelerini verdiği, yaslanarak hutbe verdiği ağaç gövdesi, feryadı duyulana kadar özlem duyar.\""
  id: "Al-Bayhaqi menceritakan bahwa Nabi biasa menyampaikan khutbahnya sambil bersandar pada batang pohon atau pohon kurma sampai mimbar dibuat untuknya. Batang pohon itu kemudian merindukan dan menangis sampai tangisannya terdengar. Nabi turun dan memeluk pohon kurma itu, yang konon menangis karena mengingat Allah yang didengarnya di dekatnya. Kemudian beliau kembali ke mimbar, dan mimbar itu menjadi tenang. Ia juga meriwayatkan, dengan sanad lain dari Abu Hurayrah, bahwa Nabi biasa shalat sambil bersandar pada batang pohon sampai mimbar dibuat untuknya. Batang pohon itu lewat di dekatnya dan retak serta terbelah. Beliau turun dan mengusapnya dengan tangannya. Kemudian Ubayy ibn Ka'b mengambilnya dan menyimpannya di rumahnya sampai dimakan rayap. Ia juga mengutip Al-Shafi'i yang berkata: \"Allah tidak memberikan kepada nabi mana pun apa yang Dia berikan kepada Muhammad. Batang pohon yang biasa beliau sandari untuk menyampaikan khutbahnya sampai mimbar dibuat untuknya, merindukan sampai tangisannya terdengar.\""
