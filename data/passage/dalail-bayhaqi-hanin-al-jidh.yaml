label: { ar: "دلائل النبوة للبيهيقي — حنين الجذع", en: "Bayhaqi's Dala'il — the palm trunk's lament", ur: "بیہقی کی دلائل — کھجور کے تنا کے رونے کی صدا" }
text: "كان يقوم يوم الجمعة إلى شجرة أو إلى نخلة، فلما كان يوم الجمعة ذهب إلى المنبر فصاحت النخلة صياح الصبي، فنزل فضمها إليه، كانت تبكي على ما كانت تسمع من الذكر عندها"
summary:
  ar: "يذكر البيهيقي أن النبي كان يخطب إلى جذع أو نخلة حتى وُضع له المنبر، فحنّ الجذع وبكى حتى سُمع صياحه، فنزل النبي فضم النخلة إليه، وقيل كانت تبكي على ما كانت تسمع من الذكر عندها، ثم رجع إلى المنبر فسكن. ويروي بسند آخر عن أبي هريرة أن النبي كان يصلي إلى جذع حتى صُنع له منبر فمر الجذع به فخار حتى تصدع وانشق، فنزل فمسحه بيده، ثم أخذه أبي بن كعب فكان في بيته حتى بليته الأرضة. ويورد قول الشافعي: ما أعطى الله نبياً ما أعطى محمداً، فالجذع الذي كان يخطب إليه جنبه حتى هيء له المنبر حنّ الجذع حتى سُمع صوته."
  en: "The Prophet used to preach facing a palm trunk until a minbar was made for him; the trunk then wailed and wept until its cry was heard, and he came down and embraced it — it was said to weep for no longer hearing the remembrance at its side. Another chain has the trunk crack and split as he passed it, until he touched it and it fell silent; Ubayy ibn Ka'b kept it in his house until worms consumed it. Al-Shafi'i summed it: God gave no prophet what He gave Muhammad — the trunk that wailed when the minbar was set for him."
  ur: "نبی جمعہ کے خطبے کے لیے ایک تنا یا کھجور کے درخت کے سامنے کھڑے ہوتے تھے یہاں تک کہ ان کے لیے منبر بنایا گیا۔ منبر بننے کے بعد تنا رونے لگا یہاں تک کہ اس کی آہٹ سنائی دی، تو نبی اتر کر اس سے لپٹ گئے — کہا جاتا ہے کہ وہ اس لیے روتا تھا کہ اس کے پاس ذکر سننے کو نہ رہا۔ ایک دوسری روایت میں تنا پھٹ گیا تو اس نے ہاتھ سے مسح دیا تو خاموش ہو گیا۔ شافعی نے کہا: اللہ نے کسی نبی کو وہ نہیں دیا جو اس نبی کو دیا، یہ تنا بھی اسی میں سے ہے۔"
