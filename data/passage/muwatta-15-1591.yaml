label: { ar: "الموطأ 1591 — يحيى: بلغه أن رجلا جاء إلى عبد الله بن عمر فقال إني جعلت أمر امرأتي في يدها، فطلقت نفسها، فقال أراه كما قالت", en: "Muwatta 1591", es: "Muwatta 1591", fr: "Muwatta 1591", ur: "موطا 1591", tr: "El-Muvatta 1591 — Yahya: Abdullah bin Ömer'e bir adamın gelip, \"Eşime kendi kaderine karar verme yetkisi verdim ve o da kendisinden boşandı\" dediği rivayet edildi. Abdullah bin Ömer, \"Sanırım dediği gibi oldu\" dedi.", id: "Al-Muwatta 1591 — Yahya: Sampai kepadanya bahwa seorang pria datang kepada Abdullah bin Umar dan berkata, “Aku memberi istriku wewenang untuk menentukan nasibnya sendiri, dan dia menceraikan dirinya sendiri.” Beliau berkata, “Aku pikir memang seperti yang dia katakan.”" }
summary:
  ar: "يروي يحيى أنه بلغه أن رجلا جاء إلى عبد الله بن عمر، فقال إني جعلت أمر امرأتي في يدها، فطلقت نفسها، فماذا ترى؟ فقال عبد الله بن عمر أراه كما قالت. فقال الرجل لا تفعل يا أبا عبد الرحمن. فقال ابن عمر أنا أفعل؟ أنت فعلته. {cite:muwatta-maruf-1997 p.62}"
  tr: "Yahya, Abdullah ibn Umar'a bir adamın gelip, \"Eşime kendisini boşayabilme yetkisini verdim ve o da kendisini boşadı. Ne düşünüyorsun?\" dediğini duyduğunu anlatır. Abdullah ibn Umar, \"Bence dediği gibi oldu\" diye cevap verdi. Adam, \"Bunu yapma, Ebu Abdül-Rahman\" dedi. İbn Umar, \"Yapmalı mıyım? Sen yaptın.\" dedi. {cite:muwatta-maruf-1997 s.62}"
  id: "Yahya menceritakan bahwa ia mendengar seorang pria datang kepada Abdullah ibn Umar dan berkata, “Aku memberi istriku wewenang untuk menceraikan dirinya sendiri, dan dia menceraikan dirinya sendiri. Apa pendapatmu?” Abdullah ibn Umar menjawab, “Menurutku memang seperti yang dia katakan.” Pria itu berkata, “Jangan lakukan itu, Abu Abd al-Rahman.” Ibn Umar berkata, “Haruskah aku melakukannya? Kau sudah melakukannya.” {cite:muwatta-maruf-1997 p.62}"
