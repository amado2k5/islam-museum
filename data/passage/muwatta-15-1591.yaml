summary:
  ar: "يروي يحيى أنه بلغه أن رجلا جاء إلى عبد الله بن عمر، فقال إني جعلت أمر امرأتي في يدها، فطلقت نفسها، فماذا ترى؟ فقال عبد الله بن عمر أراه كما قالت. فقال الرجل لا تفعل يا أبا عبد الرحمن. فقال ابن عمر أنا أفعل؟ أنت فعلته. {cite:muwatta-maruf-1997 p.62}"
