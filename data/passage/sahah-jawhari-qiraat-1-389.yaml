text: "… وقولهم: دَهِرْ دَهارِيرُ، أي: شديدٌ، كقولهم : ليْلَةٌ لَيْلاءُ، ونَهارٌ أَنْهَرُ، وَيَومٌ أَيْوَمُ، وساعةٌ سَوْعاءُ. وأنشد أبو عمرو بن العلاء لرجل من أهل نجد: البسيط وبينما المَرْءُ في الأَحْياءِ مُغْتَبِطْ إذا هو الرَّمْسُ تَعْفوهُ الأَعاصيرُ حتى كأنْ لم يكنْ إلاّ …"
