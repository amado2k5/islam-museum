label: { ar: "صحيح مسلم — أبر البر صلة الولد أهل ود أبيه", en: "Sahih Muslim — The truest kindness: a son keeping his father's friends", ur: "صحیح مسلم — سچی نیکی: بیٹے کا باپ کے دوستوں سے تعلق رکھنا", es: "Sahih Muslim — La verdadera bondad: un hijo que cuida de los amigos de su padre", fr: "Sahih Muslim — La plus grande bonté: un fils qui garde les amis de son père", tr: "Sahih Müslim — Bir evladın babasının arkadaşlarıyla bağlarını sürdürmesi, en faziletli iyiliklerden biridir." }
text: "حَدَّثَنِي أَبُو الطَّاهِرِ، أَحْمَدُ بْنُ عَمْرِو بْنِ سَرْحٍ أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي سَعِيدُ بْنُ أَبِي أَيُّوبَ، عَنِ الْوَلِيدِ بْنِ أَبِي الْوَلِيدِ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَجُلاً، مِنَ الأَعْرَابِ لَقِيَهُ بِطَرِيقِ مَكَّةَ فَسَلَّمَ عَلَيْهِ عَبْدُ اللَّهِ وَحَمَلَهُ عَلَى حِمَارٍ كَانَ يَرْكَبُهُ وَأَعْطَاهُ عِمَامَةً كَانَتْ عَلَى رَأْسِهِ فَقَالَ ابْنُ دِينَارٍ فَقُلْنَا لَهُ أَصْلَحَكَ اللَّهُ إِنَّهُمُ الأَعْرَابُ وَإِنَّهُمْ يَرْضَوْنَ بِالْيَسِيرِ ‏.‏ فَقَالَ عَبْدُ اللَّهِ إِنَّ أَبَا هَذَا كَانَ وُدًّا لِعُمَرَ بْنِ الْخَطَّابِ وَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ إِنَّ أَبَرَّ الْبِرِّ صِلَةُ الْوَلَدِ أَهْلَ وُدِّ أَبِيهِ ‏\"‏ ‏.‏"
summary:
  ar: "قال: إن أبر البر صلة الولد أهل ود أبيه."
  en: "«The truest kindness is the son's keeping ties with the people of his father's affection.»"
  ur: "«سب سے سچی نیکی بیٹے کا اپنے باپ کے پیارے لوگوں سے تعلق رکھنا ہے۔»"
  es: "«La verdadera bondad consiste en que el hijo mantenga los lazos con las personas a las que su padre quería.»"
  fr: "« La plus grande bonté est celle du fils qui garde les liens avec les personnes chères à son père. »"
  tr: "Şöyle dedi: Bir oğulun babasının arkadaşlarıyla bağlarını sürdürmesi, en erdemli iyilik eylemidir."
  id: "Dia berkata: Perbuatan baik yang paling mulia adalah ketika seorang anak laki-laki menjaga hubungan dengan teman-teman ayahnya."
