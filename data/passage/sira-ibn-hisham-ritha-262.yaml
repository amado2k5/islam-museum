text: "… وَهُمْ يَسْجُدُونَ آل عمران:. قال ابن هشام: آناء الليل: ساعات الليل، وواحدها إِنّيّ؛ قال الْمُتَنَخِّلُ الْهُذَلِيُّ - واسمه مالكُ بْنُ عُوَيْمِرِ - يَرْثِي أَثَيْلَةَ ابنه : حُلْوٌ وَمُرٌ كَعِطْفِ الْقِدْحِ شِيمَتُهُ فِي كُلِّ إِنْيٍ قَضَاهُ اللَّيْلُ يَنْتَعِلُ وهذا البيت في …"
