summary:
  ar: "القسم 25 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المناسك»، ويضم فيها النصوص من 2882 إلى 3119 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 25 of Sunan Ibn Majah (Chapters on Hajj Rituals) in the division of the open hadith dataset the museum took its reports from: reports 2882 to 3119 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 25، عنوان «کتاب المناسک»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2882 تا 3119۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 25 de Sunan Ibn Majah (Capítulos sobre los rituales del Hajj) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2882 al 3119, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
