label:
  ar: "النسائي 4694 — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Nasa'i 4694 — Pass over My servant: the one who was lenient with debtors"
  ur: "نسائی 4694 — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
  es: "Nasa'i 4694 — Pasa de largo, siervo mío: aquel que fue indulgente con los deudores."
  fr: "Nasa'i 4694 — Passe par-dessus Mon serviteur, celui qui était indulgent envers les débiteurs"
  tr: "Nisa Suresi 4694 — “Kulumu bağışla; o ki, muhtaçlara kolaylık sağladı.”"
  id: "An-Nisa’i 4694 — “Ampuni hamba-Ku: Dia yang memudahkan urusan orang-orang yang membutuhkan.”"
text: "إن رجلا لم يعمل خيرا قط وكان يداين الناس فيقول لرسوله خذ ما تيسر واترك ما عسر وتجاوز لعل الله تعالى أن يتجاوز عنا فلما هلك قال الله عز وجل له هل عملت خيرا قط قال لا إلا أنه كان …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 4694: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 4694: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 4694: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 4694: «Pasa de largo a mi siervo: aquel que fue indulgente con los deudores». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sunan al-Nasa'i, n° 4694: « Passez par-dessus Mon serviteur celui qui était indulgent envers les débiteurs. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 4694: \"Ampuni hamba-Ku: orang yang memudahkan urusan orang yang berhutang.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta'."
