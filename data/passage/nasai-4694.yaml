label:
  ar: "النسائي 4694 — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Nasa'i 4694 — Pass over My servant: the one who was lenient with debtors"
  ur: "نسائی 4694 — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
text: "إن رجلا لم يعمل خيرا قط وكان يداين الناس فيقول لرسوله خذ ما تيسر واترك ما عسر وتجاوز لعل الله تعالى أن يتجاوز عنا فلما هلك قال الله عز وجل له هل عملت خيرا قط قال لا إلا أنه كان …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 4694: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 4694: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 4694: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
