label: { ar: "الأربعون 10 — إن الله طيب لا يقبل إلا طيباً", en: "Arba'un 10 — God is pure and accepts only what is pure", es: "Arba'un 10 — Dios es puro y acepta solo lo que es puro.", fr: "Arba'un 10 — Dieu est pur et n'accepte que ce qui est pur", ur: "اربعون 10 - خدا پاک ہے اور صرف وہی قبول کرتا ہے جو پاک ہے۔", tr: "Kırkıncı ayet: 10 — Tanrı iyidir ve yalnızca iyi olanı kabul eder.", id: "Yang keempat puluh: 10 — Tuhan itu baik dan hanya menerima apa yang baik." }
text: "إن الله طيب لا يقبل إلا طيباً، وإن الله تعالى أمر المؤمنين بما أمر به المرسلين فقال [المؤمنون: 51]، وقال تعالى [البقرة: 172]، ثم ذكر الرجل يطيل السفر أشعث أغبر يمد يديه إلى السماء يا رب يا رب ومطعمه حرام ومشربه حرام وملبسه حرام وغذي بالحرام فأنى يستجاب لذلك"
summary:
  ar: "حديث أبي هريرة، وهو الحديث العاشر في الأربعين النووية وفي شرح ابن رجب؛ رواه مسلم (1015) من رواية فضيل بن مرزوق عن عدي بن ثابت عن أبي حازم عن أبي هريرة، وخرجه الترمذي (2989) وقال: حسن غريب، وله طرق عن أبي هريرة عند عبد الرزاق وأحمد والدارمي والبيهقي والبغوي؛ يقول ابن رجب إن الطيب هنا بمعنى الطاهر، فالله مقدس منزه عن النقائص والعيوب، وقوله «لا يقبل إلا طيباً» ورد بمعناه في حديث الصدقة «لا يقبل الله إلا طيباً»، وقيل إن المراد هنا أعم: لا يقبل من الأعمال إلا ما كان طاهراً من المفسدات كالرياء والعجب، ولا من الأموال إلا ما كان حلالاً، فالأعمال والأقوال والاعتقادات تنقسم إلى طيب وخبيث، وقسّم القرآن الكلام إلى كلمة طيبة كشجرة طيبة وكلمة خبيثة كشجرة خبيثة ⁦(جامع العلوم والحكم ص 239–259)⁩."
  en: "Abu Hurayra's hadith, the tenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim (1015) through Fudayl ibn Marzuq from Adi ibn Thabit from Abu Hazim from Abu Hurayra, and by al-Tirmidhi (2989) who graded it hasan gharib, with further routes in Abd al-Razzaq, Ahmad, al-Darimi, al-Bayhaqi and al-Baghawi; Ibn Rajab explains that tayyib here means pure — God being exalted above all defects — and that 'He accepts only what is pure' occurs in the sadaqa hadith, though some read it more broadly: no deeds are accepted unless pure of corrupting motives such as showing off and conceit, and no wealth unless lawfully gained, since deeds, words and beliefs all divide into pure and foul, as the Quran divides speech into a good word like a good tree and a foul word like a foul tree (Jami' al-Ulum wal-Hikam pp. 239–259)."
  es: "el hadiz de Abu Hurayra, el décimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Muslim (1015) a través de Fudayl ibn Marzuq de Adi ibn Thabit de Abu Hazim de Abu Hurayra, y por al-Tirmidhi (2989) quien lo calificó como hasan gharib, con rutas adicionales en Abd al-Razzaq, Ahmad, al-Darimi, al-Bayhaqi y al-Baghawi; Ibn Rajab explica que tayyib aquí significa puro —siendo Dios exaltado por encima de todos los defectos— y que \"Él acepta solo lo que es puro\" aparece en el hadiz sadaqa, aunque algunos lo interpretan de forma más amplia: no se aceptan obras a menos que estén libres de motivos corruptores como la ostentación y la vanidad, y ninguna riqueza a menos que se haya obtenido lícitamente, puesto que las obras, las palabras y las creencias se dividen en puras y malas, como el Corán divide el habla en una buena palabra como un buen árbol y una mala palabra como un árbol malo (Jami' al-Ulum wal-Hikam pp. 239-259)."
  fr: "le hadith d'Abou Hurayra, le dixième des quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Muslim (1015) à travers Fudayl ibn Marzuq d'Adi ibn Thabit d'Abu Hazim d'Abu Hurayra, et par al-Tirmidhi (2989) qui l'a classé hasan gharib, avec d'autres itinéraires à Abd al-Razzaq, Ahmad, al-Darimi, al-Bayhaqi et al-Baghawi; Ibn Rajab explique que tayyib signifie ici pur — Dieu étant exalté au-dessus de tous les défauts — et que « Il n’accepte que ce qui est pur » apparaît dans le hadith sadaqa, bien que certains le lisent de manière plus large: aucun acte n’est accepté à moins d’être pur de motifs corrupteurs tels que la vanité et l’orgueil, et aucune richesse à moins d’être acquise licitement, puisque les actes, les paroles et les croyances se divisent tous en purs et impurs, comme le Coran divise la parole en une bonne parole comme un bon arbre et une mauvaise parole comme un arbre impur (Jami' al-Ulum wal-Hikam pp. 239–259)."
  ur: "ابوہریرہ کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی دسویں؛ مسلم (1015) نے فضیل بن مرزوق کے ذریعے عدی بن ثابت سے ابو حازم سے ابو ہریرہ سے، اور الترمذی (2989) کے ذریعے جس نے اسے حسن غریب کا درجہ دیا، مزید راستوں کے ساتھ عبد الرزاق، احمد، الدارمی، البیحقی اور البیضاوی؛ ابن رجب نے وضاحت کی ہے کہ یہاں طیب کا مطلب ہے پاکیزہ - خدا تمام عیبوں سے بلند ہے - اور یہ کہ 'وہ صرف وہی قبول کرتا ہے جو خالص ہے' صدقہ حدیث میں آتا ہے، اگرچہ بعض اسے زیادہ وسیع طور پر پڑھتے ہیں: کوئی عمل اس وقت تک قبول نہیں ہوتا جب تک کہ دکھاوے اور تکبر جیسے خراب مقاصد سے پاک ہو، اور کوئی بھی دولت اس وقت تک قبول نہیں کی جاتی جب تک کہ تمام عیبوں سے بالاتر ہو، اور اس کے علاوہ کوئی بھی عمل اس وقت تک قبول نہیں کیا جاتا جب تک کہ وہ تمام عیبوں سے بالاتر ہو۔ اور گندا، جیسا کہ قرآن نے کلام کو ایک اچھے لفظ میں تقسیم کیا ہے جیسے اچھے درخت اور ایک گندے لفظ کو گندے درخت کی طرح ⁦(جامع العلوم والحکم صفحہ 239-259)⁩۔"
  tr: "Ebu Hurayra hadisi, Nevevi'nin Kırk Hadisi'nde onuncu hadis olup İbn Receb'in şerhinde de yer almaktadır; Müslim (1015) tarafından Fudayl ibn Marzuq'tan, o da Adi ibn Sabit'ten, o da Ebu Hazim'den, o da Ebu Hurayra'dan rivayet edilmiştir ve Tirmizi (2989) tarafından da dahil edilmiş olup şöyle denilmiştir: \"Bu hadis güzel ve nazarîdir ve Ebu Hurayra'dan Abdülrazzak, Ahmed, Darimi, Beyhaki ve Bağavi ile rivayet zincirleri vardır.\" İbn Receb, burada \"iyi\"nin saf olanı kastettiğini, dolayısıyla Allah'ın kutsal ve kusurlardan münezzeh olduğunu söyler ve \"O, ancak iyiliği kabul eder\" sözü, sadaka hadisinde geçen \"Allah, ancak iyiliği kabul eder\" anlamında zikredilmiştir. Burada kastedilenin daha genel olduğu da söylenmiştir: O, amellerden ancak münafıklık ve kibir gibi bozguncu şeylerden arındırılmış olanı, mallardan da ancak helal olanı kabul eder. Dolayısıyla ameller, sözler ve inançlar iyi ve kötü olarak ayrılır ve Kur'an, sözü iyi bir ağaç gibi iyi söz ve kötü bir ağaç gibi kötü söz olarak ayırmıştır (Cami' el-Ulum ve el-Hikam, s. 239-259)."
  id: "Hadits Abu Hurairah, yang merupakan hadits kesepuluh dalam Empat Puluh Hadits Nawawi dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Muslim (1015) dari Fudayl ibn Marzuq dari Adi ibn Thabit dari Abu Hazim dari Abu Hurairah, dan dimasukkan oleh al-Tirmidhi (2989) dan beliau berkata: Hadits ini baik dan luar biasa, dan sanadnya dari Abu Hurairah dengan Abd al-Razzaq, Ahmad, al-Darimi, al-Bayhaqi dan al-Baghawi; Ibn Rajab mengatakan bahwa kebaikan di sini berarti kesucian, sehingga Allah Maha Suci dan bebas dari kekurangan dan cela, dan firman-Nya “Dia tidak menerima kecuali yang baik” disebutkan dengan maknanya dalam hadits tentang sedekah “Allah tidak menerima kecuali yang baik,” dan dikatakan bahwa yang dimaksud di sini lebih umum: Dia tidak menerima dari amal perbuatan kecuali yang suci, dari hal-hal yang merusak seperti kemunafikan dan kesombongan, dan dari harta benda kecuali yang halal, sehingga amal perbuatan, ucapan, dan keyakinan dibagi menjadi baik dan buruk, dan Al-Qur'an membagi ucapan menjadi ucapan yang baik seperti pohon yang baik dan ucapan yang buruk seperti pohon yang buruk (Jami’ al-‘Ulum wa al-Hikam hlm. 239–259)."
