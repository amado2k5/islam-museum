text: "… ذَلِكَ قَبْلَ انْقِطاعِ الهِجْرَةِ، وَمَنْ حَمَلَ ذَلِكَ عَلَىٰ عُمُومِهِ فَقَدْ شَهِدَ عَلَىٰ نَفْسِهِ إِنْ كَانَ سَاكِنًّا فِي غَيرِها أَنَّهُ خَبَتّ، وَالخَبَثُ أَهْلٌ أَلَا يُلْتَفَتَ إِليهِ، وَنَسْتَحِبُّ أَنْ تُسَمَّى المّدينَةُ طِيبَةَ، وَلَسْنَا نَكْرَهُ أَنْ تُسَمَّىٰ يَثْرِبَ. وبَيْنَ قَبْرِهِ الاد وَمِنْبَرِهِ رَوْضَةٌ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 314، يرد فيه ذكر المستحب، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 314, whose wording mentions the recommended (mustahabb), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 314 کا اقتباس جس میں مستحب، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 314, dont le texte mentionne le recommandé (mustahabb), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 314, cuyo texto menciona lo recomendado (mustahabb), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 314. sayfasından, müstehaplı ve müstehaplı amelleri sıralayan bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz ameller, görevler, itaat amelleri, müstehaplı ameller, müstehaplı ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 314, yang menyebutkan amalan yang dianjurkan dan yang tidak disukai; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
