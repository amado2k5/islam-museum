label: { ar: "الموطأ 2774 — سليمان بن يسار: ضباب في بيت ميمونة ومسألة الجارية", en: "Muwatta 2774" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن عبد الله بن عبد الرحمن بن أبي صعصعة، عن سليمان بن يسار، أن النبي دخل بيت ميمونة بنت الحارث فوجد عندها ضبابا، أهدتها إليها أختها هزيلة بنت الحارث. فقال لابن عباس وخالد بن الوليد: كلا. فقالا: ألا تأكل أنت؟ فقال إنه يحضره أمر من الله. ثم شرب من لبن قدمته ميمونة، وسألها عن مصدره فأجابت بأنه من الهدية نفسها، فأشار عليها أن تعطي الجارية التي استأمرته في عتقها لأختها، وأن تصل بها رحمها. {cite:muwatta-maruf-1997 p.559}"
