label: { ar: "الموطأ 2774 — سليمان بن يسار: ضباب في بيت ميمونة ومسألة الجارية", en: "Muwatta 2774", es: "Muwatta 2774", fr: "Muwatta 2774", ur: "موطا 2774", tr: "El-Muvatta 2774 — Süleyman ibn Yasar: Meymuna'nın evindeki sis ve cariye meselesi", id: "Al-Muwatta 2774 — Sulayman ibn Yasar: Kabut di rumah Maymuna dan masalah budak perempuan" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن عبد الله بن عبد الرحمن بن أبي صعصعة، عن سليمان بن يسار، أن النبي دخل بيت ميمونة بنت الحارث فوجد عندها ضبابا، أهدتها إليها أختها هزيلة بنت الحارث. فقال لابن عباس وخالد بن الوليد: كلا. فقالا: ألا تأكل أنت؟ فقال إنه يحضره أمر من الله. ثم شرب من لبن قدمته ميمونة، وسألها عن مصدره فأجابت بأنه من الهدية نفسها، فأشار عليها أن تعطي الجارية التي استأمرته في عتقها لأختها، وأن تصل بها رحمها. {cite:muwatta-maruf-1997 p.559}"
  tr: "Malik, Abdülrahman ibn Abd Allah ibn Abdülrahman ibn Abi Sa'sa'ah'tan, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Peygamberimiz Meymune bint el-Harith'in evine girdi ve orada kız kardeşi Huzeyla bint el-Harith'in ona hediye olarak verdiği bazı kertenkeleler buldu. İbn Abbas ve Halid ibn el-Valid'e \"Hayır\" dedi. Onlar, \"Yemeyecek misin?\" diye sordular. Peygamberimiz \"Allah'tan yerine getirmem gereken bir emir var\" diye cevap verdi. Sonra Meymune'nin kendisine ikram ettiği sütten içti ve kaynağını sordu. Meymune, sütün aynı hediyeden olduğunu söyledi. Bunun üzerine Peygamberimiz, Meymune'ye, kendisinden izin istediği cariyeyi kız kardeşine vermesini ve onunla akrabalık bağlarını korumasını tavsiye etti. {cite:muwatta-maruf-1997 s.559}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn Abd Allah ibn Abd al-Rahman ibn Abi Sa'sa'ah, dari Sulayman ibn Yasar, bahwa Nabi memasuki rumah Maymunah binti al-Harith dan menemukan beberapa kadal di sana, yang diberikan oleh saudara perempuannya, Huzaylah binti al-Harith, sebagai hadiah. Beliau berkata kepada Ibnu Abbas dan Khalid ibn al-Walid, \"Tidak.\" Mereka berkata, \"Apakah engkau tidak mau memakannya?\" Beliau menjawab, \"Aku mendapat perintah dari Allah untuk melaksanakannya.\" Kemudian beliau meminum susu yang diberikan Maymunah dan menanyakan sumbernya. Maymunah menjawab bahwa susu itu berasal dari hadiah yang sama. Kemudian beliau menasihati Maymunah untuk memberikan budak perempuan yang telah dimintanya untuk dibebaskan kepada saudara perempuannya, dan untuk menjaga hubungan kekerabatan dengannya. {cite:muwatta-maruf-1997 p.559}"
