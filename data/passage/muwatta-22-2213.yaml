label: { ar: "الموطأ 2213 — مالك: بلغه أن رجلا من الأنصار من بني الحارث بن الخزرج تصدق على أبويه بصدقة فهلكا، فورث ابنهما المال وهو نخل، فسأل النبي، فقال: قد أجرت في صدقتك وخذها بميراثك", en: "Muwatta 2213", es: "Muwatta 2213", fr: "Muwatta 2213", ur: "موطا 2213", tr: "El-Muvatta 2213 — Malik: Peygamberimize, Beni el-Harith ibn el-Hazrec kabilesinden Ensar'dan bir adamın anne ve babasına sadaka verdiği ve onların vefat ettiği rivayet edildi. Oğulları, hurma ağaçları olan parayı miras aldı. Peygamberimize sordu, o da şöyle buyurdu: Sadakanın karşılığını aldın, bunu miras olarak al.", id: "Al-Muwatta 2213 — Malik: Sampai kepadanya kisah seorang laki-laki dari kaum Ansar, dari suku Banu al-Harith ibn al-Khazraj, yang memberikan sedekah kepada orang tuanya, dan mereka meninggal dunia. Putra mereka mewarisi uang tersebut, yang berupa pohon kurma. Ia bertanya kepada Nabi, dan Nabi bersabda: \"Engkau telah diberi pahala atas sedekahmu, dan terimalah itu sebagai warisanmu.\"" }
summary:
  ar: "قال مالك: بلغه أن رجلا من الأنصار من بني الحارث بن الخزرج تصدق على أبويه بصدقة، فهلكا، فورث ابنهما المال، وهو نخل، فسأل عن ذلك رسول الله، فقال: قد أجرت في صدقتك، وخذها بميراثك. {cite:muwatta-maruf-1997 p.307}"
  tr: "Malik şöyle dedi: Ensar'dan, Beni el-Harith ibn el-Hazrec kabilesinden bir adamın anne ve babasına sadaka verdiğini, sonra onların vefat ettiğini işitti. Oğulları, bir hurma ağacı olan parayı miras aldı. Bu konuda Allah'ın Resulü'ne sordu ve o da şöyle buyurdu: Sadakanın karşılığını aldın, onu miras olarak al. {cite:muwatta-maruf-1997 s.307}"
  id: "Malik berkata: Ia mendengar bahwa seorang pria dari kaum Ansar, dari suku Banu al-Harith ibn al-Khazraj, memberikan sedekah kepada orang tuanya, kemudian mereka meninggal. Putra mereka mewarisi uang tersebut, yang berupa pohon kurma. Ia bertanya kepada Rasulullah tentang hal ini, dan beliau bersabda: Kamu telah diberi pahala atas sedekahmu, dan terimalah itu sebagai warisanmu. {cite:muwatta-maruf-1997 p.307}"
