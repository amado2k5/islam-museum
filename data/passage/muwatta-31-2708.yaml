label: { ar: "الموطأ 2708 — ابن شهاب عن أبي أمامة بن سهل: عامر يُغسل له ويُبرأ سهل", en: "Muwatta 2708", es: "Muwatta 2708", fr: "Muwatta 2708", ur: "موطا 2708", tr: "El-Muvatta 2708 — İbn Şihab, Ebu Umame ibn Sahl'dan rivayetle: 'Amir yıkandı ve Sahl iyileşti.", id: "Al-Muwatta 2708 — Ibn Shihab berdasarkan riwayat Abu Umamah ibn Sahl: 'Amir dimandikan dan Sahl disembuhkan" }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي أمامة بن سهل بن حنيف أنه قال: رأى عامر بن ربيعة سهل بن حنيف يغتسل، فقال: ما رأيت كاليوم ولا جلد مخبأة، فلُبط بسهل، فأُتي رسول الله فقيل: يا رسول الله، هل لك في سهل بن حنيف؟ والله ما يرفع رأسه. فقال: هل تتهمون له أحدا؟ قالوا: نتهم عامر بن ربيعة. فدعا عامرا فتغيظ عليه وقال: علام يقتل أحدكم أخاه؟ ألا بركت، اغتسل له. فغسل عامر وجهه ويديه ومرفقيه وركبتيه وأطراف رجليه وداخلة إزاره في قدح، ثم صُب عليه، فراح سهل مع الناس ليس به بأس. ويذكر المحقق أن أبا أمامة وإن كان معدودا في الصحابة فقد سمع هذا من أبيه. {cite:muwatta-maruf-1997 p.527}"
  tr: "Malik, İbn Şihab'dan, Ebu Umame ibn Sahl ibn Huneyf'ten rivayetle, şöyle buyurduğunu aktarır: Emir ibn Rabi'ah, Sahl ibn Huneyf'in yıkandığını gördü ve \"Böyle bir şeyi daha önce hiç görmedim, bakirenin tenini bile!\" dedi. Bunun üzerine Sahl hastalandı. Allah'ın Resulü'ne haber verildi ve \"Ey Allah'ın Resulü, Sahl ibn Huneyf'e ne oldu? Allah'a yemin ederim ki, başını kaldıramıyor!\" denildi. \"Birinden şüpheleniyor musunuz?\" diye sordu. \"Emir ibn Rabi'ah'tan şüpheleniyoruz\" diye cevap verdiler. Bunun üzerine Emir'i çağırdı ve ona kızarak, \"Neden biriniz kardeşini öldürür? Neden ona dua edip yıkamadın?\" dedi. Bunun üzerine Emir, bir kapta Sahl'in yüzünü, ellerini, dirseklerini, dizlerini, ayak uçlarını ve iç eteğini yıkadı, sonra suyu üzerine döktü. Sahl daha sonra iyileşmiş olarak halkın arasına karıştı. Araştırmacı, Ebu Umame'nin Sahabeler arasında sayılmasına rağmen, bunu babasından duyduğunu belirtiyor. {cite:muwatta-maruf-1997 s.527}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Abu Umamah ibn Sahl ibn Hunayf, bahwa ia berkata: Amir ibn Rabi'ah melihat Sahl ibn Hunayf sedang mandi dan berkata, \"Aku belum pernah melihat yang seperti ini, bahkan kulit seorang perawan pun tidak!\" Kemudian Sahl jatuh sakit. Rasulullah diberitahu, dan dikatakan, \"Wahai Rasulullah, bagaimana dengan Sahl ibn Hunayf? Demi Allah, dia tidak dapat mengangkat kepalanya!\" Beliau bertanya, \"Apakah kalian mencurigai seseorang?\" Mereka menjawab, \"Kami mencurigai Amir ibn Rabi'ah.\" Maka beliau memanggil Amir dan marah kepadanya, seraya berkata, \"Mengapa salah seorang dari kalian membunuh saudaranya? Mengapa kalian tidak mengucapkan shalawat dan memandikannya?\" Maka Amir membasuh wajahnya, tangannya, sikunya, lututnya, ujung kakinya, dan bagian dalam pakaian bawahnya dalam sebuah wadah, kemudian menuangkan air itu ke atasnya. Sahl kemudian pergi bersama orang-orang, dalam keadaan sembuh total. Peneliti menyebutkan bahwa meskipun Abu Umamah dianggap termasuk di antara para Sahabat, ia mendengar hal ini dari ayahnya. {cite:muwatta-maruf-1997 p.527}"
