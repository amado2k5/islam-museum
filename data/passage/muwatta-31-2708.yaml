label: { ar: "الموطأ 2708 — ابن شهاب عن أبي أمامة بن سهل: عامر يُغسل له ويُبرأ سهل", en: "Muwatta 2708" }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي أمامة بن سهل بن حنيف أنه قال: رأى عامر بن ربيعة سهل بن حنيف يغتسل، فقال: ما رأيت كاليوم ولا جلد مخبأة، فلُبط بسهل، فأُتي رسول الله فقيل: يا رسول الله، هل لك في سهل بن حنيف؟ والله ما يرفع رأسه. فقال: هل تتهمون له أحدا؟ قالوا: نتهم عامر بن ربيعة. فدعا عامرا فتغيظ عليه وقال: علام يقتل أحدكم أخاه؟ ألا بركت، اغتسل له. فغسل عامر وجهه ويديه ومرفقيه وركبتيه وأطراف رجليه وداخلة إزاره في قدح، ثم صُب عليه، فراح سهل مع الناس ليس به بأس. ويذكر المحقق أن أبا أمامة وإن كان معدودا في الصحابة فقد سمع هذا من أبيه. {cite:muwatta-maruf-1997 p.527}"
