label: { ar: "سنن ابن ماجه 56 — تربية الأب ووصيته", en: "Sunan Ibn Majah 56 — the father raising and counselling", ur: "سنن ابن ماجہ 56 — باپ کی تربیت اور نصیحت", es: "Sunan Ibn Majah 56 — El padre que cría y aconseja" }
text: "حَدَّثَنَا سُوَيْدُ بْنُ سَعِيدٍ، حَدَّثَنَا ابْنُ أَبِي الرِّجَالِ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَمْرٍو الأَوْزَاعِيِّ، عَنْ عَبْدَةَ بْنِ أَبِي لُبَابَةَ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" لَمْ يَزَلْ أَمْرُ بَنِي إِسْرَائِيلَ مُعْتَدِلاً حَتَّى نَشَأَ فِيهِمُ الْمُوَلَّدُونَ أَبْنَاءُ سَبَايَا الأُمَمِ فَقَالُوا بِالرَّأْىِ فَضَلُّوا وَأَضَلُّوا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 56، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 56 (The Book of the Sunnah), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 56، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 56 (El Libro de la Sunnah), menciona la crianza y el consejo paterno. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
