label: { ar: "الموطأ 996 — ربيعة عن سليمان بن يسار: أن رسول الله زوّج أبا رافع مولاه ورجلاً من الأنصار ميمونة بنت الحارث، ورسول الله بالمدينة قبل أن يخرج", en: "Muwatta 996", es: "Muwatta 996", fr: "Muwatta 996", ur: "موطا 996", tr: "El-Muvatta 996 — Rabi’ah, Süleyman ibn Yasar’dan rivayetle: Allah Resulü, azatlı kölesi Ebu Rafi’yi ve Ensar’dan bir adamı Meymune bint el-Harith ile evlendirdi ve Allah Resulü, ayrılmadan önce Medine’deydi.", id: "Al-Muwatta 996 — Rabi’ah berdasarkan riwayat Sulayman ibn Yasar: bahwa Rasulullah SAW menikahkan budaknya yang telah dibebaskan, Abu Rafi’, dengan seorang laki-laki dari kaum Ansar, Maymunah bint al-Harith, dan Rasulullah SAW berada di Madinah sebelum beliau meninggalkannya." }
summary:
  ar: "أول حديث في باب نكاح المحرم. يرويه مالك عن ربيعة بن أبي عبد الرحمن عن سليمان بن يسار، أن رسول الله زوّج أبا رافع مولاه ورجلاً من الأنصار ميمونة بنت الحارث، ورسول الله بالمدينة قبل أن يخرج. ويذكر المحقق أن الحديث يُروى موصولاً من طريق حماد بن زيد عن مطر الوراق عند أحمد وغيره، وأن الترمذي قال إن مالكاً رواه مرسلاً، ثم يرجح المحقق المرسل بعد نقل كلام ابن عبد البر الذي يرى أن مطراً غلط لأن أبا رافع مات بعد قتل عثمان بيسير، وأن سليمان لا يسمع منه، وأن ميمونة مولاته. {cite:muwatta-maruf-1997 p.467} {cite:muwatta-maruf-1997 p.468}"
  tr: "İhram halindeyken evlilik konusundaki bölümün ilk hadisi. Malik'in, Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Allah Resulü, Medine'den ayrılmadan önce Medine'deyken azatlı kölesi Ebu Rafi'yi ve Ensar'dan bir adamı Meymune bint al-Harith ile evlendirmiştir. Editör, hadisin Ahmed ve diğerlerinin derlemelerinde Hammad ibn Zayd'dan Matar al-Warraq'a dayanan bir isnad zinciriyle nakledildiğini ve Tirmizi'nin Malik'in bunu mursal (isna zincirinde eksik bir halka bulunan hadis) olarak rivayet ettiğini söylediğini belirtiyor. Editör daha sonra, Ebu Rafi'nin Osman'ın öldürülmesinden kısa bir süre sonra öldüğüne, Süleyman'ın ondan haber almadığına ve Meymune'nin onun azatlı kölesi olduğuna inanan İbn Abd al-Barr'dan alıntı yaparak mursal versiyona öncelik veriyor. {cite:muwatta-maruf-1997 s.467} {cite:muwatta-maruf-1997 s.468}"
  id: "Hadits pertama dalam bab tentang pernikahan selama ihram. Diriwayatkan oleh Malik atas otoritas Rabi'ah ibn Abi 'Abd al-Rahman atas otoritas Sulayman ibn Yasar, bahwa Rasulullah menikahkan budak yang telah dibebaskannya, Abu Rafi', dengan seorang pria dari kaum Ansar, Maymunah bint al-Harith, ketika Rasulullah berada di Madinah sebelum beliau berangkat. Editor menyebutkan bahwa hadits ini diriwayatkan dengan sanad yang terhubung melalui Hammad ibn Zayd atas otoritas Matar al-Warraq dalam kumpulan hadits Ahmad dan lainnya, dan bahwa al-Tirmidhi mengatakan bahwa Malik meriwayatkannya sebagai mursal (hadits dengan mata rantai yang hilang dalam sanad). Kemudian editor lebih memilih versi mursal setelah mengutip Ibn 'Abd al-Barr, yang meyakini bahwa Matar melakukan kesalahan karena Abu Rafi' meninggal tak lama setelah pembunuhan 'Uthman, dan bahwa Sulayman tidak mendengar kabar darinya, dan bahwa Maymunah adalah budak yang dibebaskannya. {cite:muwatta-maruf-1997 p.467} {cite:muwatta-maruf-1997 p.468}"
