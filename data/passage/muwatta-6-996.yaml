label: { ar: "الموطأ 996 — ربيعة عن سليمان بن يسار: أن رسول الله زوّج أبا رافع مولاه ورجلاً من الأنصار ميمونة بنت الحارث، ورسول الله بالمدينة قبل أن يخرج", en: "Muwatta 996" }
summary:
  ar: "أول حديث في باب نكاح المحرم. يرويه مالك عن ربيعة بن أبي عبد الرحمن عن سليمان بن يسار، أن رسول الله زوّج أبا رافع مولاه ورجلاً من الأنصار ميمونة بنت الحارث، ورسول الله بالمدينة قبل أن يخرج. ويذكر المحقق أن الحديث يُروى موصولاً من طريق حماد بن زيد عن مطر الوراق عند أحمد وغيره، وأن الترمذي قال إن مالكاً رواه مرسلاً، ثم يرجح المحقق المرسل بعد نقل كلام ابن عبد البر الذي يرى أن مطراً غلط لأن أبا رافع مات بعد قتل عثمان بيسير، وأن سليمان لا يسمع منه، وأن ميمونة مولاته. {cite:muwatta-maruf-1997 p.467} {cite:muwatta-maruf-1997 p.468}"
