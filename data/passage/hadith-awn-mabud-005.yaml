text: "واية أبن حبان في ((صحيحه)(1) ((فصك به وجهه)) وبوب عليه: استحباب صك الوجه بالماء للمتوضيء عند إرادته غسل وجهه. انتهى. وفي هذا رد على [العلماء] (٢) الشافعية؛ فإنهم صرحوا بأن من مندوبات الوضوء أن لا يلطم وجهه بالماء كما نقله"
