text: "… : خَرَجَ رَسُولُ اللّٰه لله مُعْضَبًا حتَّى اسْتَوَى عَلَى المِنْبَرِ، فَحَمِدَ اللّه وأَثْنَى عَلَيْه، ثمّ قالَ : مَا بَالُ الرِّجَالِ يُؤْذُونَنِى فِي أهْلِ بَيْتِى ؟، وَالَّذِى نَفْسى بِيَدِهِ، لَا يُؤْمِنُ عَبْدٌ حتَّى يُحِبَّني، وَلَا يُحِبُّني حَتَّى يُحِبَّ ذَوِىَّ. وَرَوَى الطَّبَرَانِيُّ، …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 7573، يذكر ما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
