  tr: "El-Salihi'nin \"Hida ve Doğruluk Yolları\" adlı eserinin 4. cildinin 7573. sayfasından bir alıntı, tam bir iman için gerekli olan unsurları belirtmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
