label: { ar: "سنن أبي داود 5187 — الأب والأبوة", en: "Sunan Abi Dawud 5187 — the father and fatherhood", ur: "سنن ابی داؤد 5187 — باپ اور والدیت", es: "Sunan Abi Dawud 5187 — El padre y la paternidad" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا بِشْرٌ، عَنْ شُعْبَةَ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرٍ، أَنَّهُ ذَهَبَ إِلَى النَّبِيِّ فِي دَيْنِ أَبِيهِ فَدَقَقْتُ الْبَابَ فَقَالَ \" مَنْ هَذَا \". قُلْتُ أَنَا. قَالَ \" أَنَا أَنَا \". كَأَنَّهُ كَرِهَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 5187، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5187 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5187، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5187 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
