text: "… عبد منافِ بن قَصَي بن زهرة : مَخْرّمة، وصفوان، وآسية. ذكرها أبو سعيد فيمن أسلم من النساء، وبايع. - رُفَيدة : امرأة من أسلم، كان رسول اللّٰه ليعوده من قريب، وكانت أمرأَة تداوي الجرحى، وتحتسب بنفسها على خدمة من كانت …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 905، يذكر عيادة المريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
