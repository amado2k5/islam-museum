text: "… عبد منافِ بن قَصَي بن زهرة : مَخْرّمة، وصفوان، وآسية. ذكرها أبو سعيد فيمن أسلم من النساء، وبايع. - رُفَيدة : امرأة من أسلم، كان رسول اللّٰه ليعوده من قريب، وكانت أمرأَة تداوي الجرحى، وتحتسب بنفسها على خدمة من كانت …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 905، يذكر عيادة المريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 905, that mentions visiting the sick, the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 905 کا اقتباس جس میں بیمار کی عیادت، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 3, pág. 905, que menciona la visita a los enfermos, el tratamiento de heridas, mujeres que atienden a los heridos, la búsqueda de tratamiento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isti'ab d'Ibn 'Abd al-Barr, volume 3, page 905, qui mentionne la visite aux malades, le traitement des blessures, les femmes soignant les blessés, la recherche de soins; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 3. cildinin 905. sayfasında, hasta ziyaretinden, yaraların tedavi edilmesinden, kadınların yaralıları tedavi etmesinden ve tıbbi yardım aramasından bahsedilmektedir; bu metin, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 3, hlm. 905, menyebutkan tentang mengunjungi orang sakit, mengobati luka, wanita merawat orang terluka, dan mencari pengobatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
