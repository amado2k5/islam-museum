text: "… هذا بهتان عظيم أن يستمِرَّ هذا الجعلُ الحرام المتضمِّن لتغيير شرع اللّٰه وَدِينه، وإباحة الفَرْجِ لمن هو عليه حرامٌ، وتحريمُه على من هو عليه حلالٌ، على عهد رسول اللّٰه وَالخِ وأصحابه خيرِ الخلق، وهم يفعلونه، ولا يعلمونه، ولا بعلمه هو، …"
summary:
