summary:
  ar: "القسم 22 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب السهو»، ويضم فيها النصوص من 1224 إلى 1236 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 22 of Sahih al-Bukhari (Forgetfulness in Prayer) in the division of the open hadith dataset the museum took its reports from: reports 1224 to 1236 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 22، عنوان «کتاب السہو»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1224 تا 1236۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 22 de Sahih al-Bukhari (El olvido en la oración) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1224 al 1236 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 22 du Sahih al-Bukhari (L'oubli dans la prière), soit les hadiths 1224 à 1236 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 22. bölümü \"Unutkanlık Kitabı\" başlığını taşımakta olup, 1224'ten 1236'ya kadar olan metinleri sırasıyla numaralandırmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 22 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Kelupaan\" dan berisi teks 1224 hingga 1236, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
