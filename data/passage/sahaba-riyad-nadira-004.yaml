text: "لا أم لك . وعن خزيمة بن ثابت قال : كان عمر إذا استعمل عاملا كتب عليه كتابا وأشهد عليه رهطا من المهاجرين والأنصار ثم يقول له : إني لم استعملك على دماء المسلمين ولا على أعراضهم ولا على أستارهم"
