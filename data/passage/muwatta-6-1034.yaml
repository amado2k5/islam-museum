label: { ar: "الموطأ 1034 — أيوب بن موسى: أن عبد الله بن عمر نظر في المرآة لشكر كان بعينيه وهو محرم", en: "Muwatta 1034", es: "Muwatta 1034", fr: "Muwatta 1034", ur: "موطا 1034", tr: "El-Muvatta 1034 — Eyyub ibn Musa: Abdullah ibn Ömer, ihramlı haldeyken gözlerindeki yaş nedeniyle aynaya baktı.", id: "Al-Muwatta 1034 — Ayyub ibn Musa: Abdullah ibn Umar melihat ke cermin karena air mata menggenang di matanya ketika ia sedang dalam keadaan ihram." }
summary:
  ar: "يرويه مالك عن أيوب بن موسى أن عبد الله بن عمر نظر في المرآة لشكر كان بعينيه وهو محرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1195) وسويد (582). {cite:muwatta-maruf-1997 p.482}"
  tr: "Malik, Eyyub ibn Musa'dan rivayet ettiğine göre, Abdullah ibn Ömer ihramlı haldeyken gördüğü bir şey için şükranını ifade etmek amacıyla aynaya bakmıştır. Araştırmacı, bunun Malik'ten Ebu Musab (1195) ve Suveyd (582) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.482}"
  id: "Malik meriwayatkannya dari Ayyub ibn Musa bahwa Abdullah ibn Umar bercermin untuk mengungkapkan rasa syukur atas sesuatu yang dilihatnya saat dalam keadaan ihram. Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Musab (1195) dan Suwaid (582). {cite:muwatta-maruf-1997 p.482}"
