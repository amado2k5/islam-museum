text: |-
  ⁦(فصل الفاء)⁩
  1٥٩
  منه وقال الاصمعى فى كتاب الفرس أعوج كان ابنى آكل المرار ثم صارابى هلال بن
  عامر والعوجا الضامرة من الابل قال طرفة بعوجاء مر قال تروح وتغتدى
  والعوجاءا قوس ورجل أعوج بين العوح أى سي انلف لق وعجت بالمكان أعوج أى أقت
  به وعجت غيرى بالمكان أعوجه يتعدى ولا يتعدى وعجت البعير أعوجه عوجا ومعاجا اذا
  عطفت رأسه بالزمام وانماج عليه أى انعطف والعائج الوقف ووال
  عجناءلى ربع سلى أتعريج وضع التعرمج موضع العوج اذ كان معناه ما واحدا
  وذكرابن الاعراى قلان مايوج عن شى أى ما يرجع عنه واعوج الشاءوجا با يقال عما
  مغوجة ولا تقل مع وجسة بكسر الميم وعوجت الشىء نتعوج والعاج عظم الفيل الواحدة
  عاجة قال سيبويه يقال اصاحب العاج عوّاج وعاج زجر للناقة قال الشاعر
  كأنى لم أزجر بعاج فجيبة • ولم ألق عن شمط خليلا مصافيا
  هيج العوهج الطويلة العنق من الظياء والظلمان والنوق ( يج ابن السكيت
  عن الفرّاءما أعيج من كلامه بشئ أى ما أعبأبه قال وبنوأسدية ولون ما أءوج بكلا مه أى
  ما ألتفت اليه أخذوه من عجت الناقة وحكى ابن الاعرابى ماعجت بالشئ أى
  لم أرض به ويقال شربت ماء ملجافاعجت به أى لم أرومنه وتناولت دواء فاعت به أى
  لم أنتفع به
  ⁦( قصل الغمين علج)⁩ فرس مغلج اذا جرى جر بالا يختاط فيه وقد علج يغلج علم،
  الاموى التعلج البغى (غمج غمج الماءيغمجه غمجاجرعه وفيه لغة أخرى غمج الماه
  بالكسر والغعجة والغمجة ١ الجرعة نج الفنج والغنج الشكل وقد غنجت
  الجارية غنبا وتغتجت فهى غنجة والغنج بالتهريك لسيخ فى لعدهذيل ⁦(غوج)⁩ فرس
  غوج اللبان أى واسع جلد الصدرولا يكون كذلك الاوه وسهل المعطف وغاج يفوج أى
  تذى وتعطف قال أبوذؤيب
  عشية قامت بالفناه كانها • عقيلة تهب تصطفى وتفوج
  أى تتعرض لرئيس الجيش ليتخذها لنفه
  ⁦( فصل الفاء)⁩ فتج) الفاتج والفاسج الحامل من النوق قال أبو عبيدهى الق
  قد لقحت وحسذت وقال الاصحعى هى الفنية الااقح قال هميان بن تحافة السعدى
  يغال بدءونيها الضعاعجا • والبكرات القيح الفوائيا
  ويروى الهوامجا الكسائى يقال عسدا-تى أفتج أى أعيا وانبهر وقواهم بثرلا تفتج وفلان
  مجر لا يفتج أى لا ينزح ( فجج الفيج الطريق الواسع بين الجبلين وابهع فجاج وتجحت
  ما بين رجلىّ أفجهما فيا اذا فتحت يقال هو يمشى مفاجاوقد تفاج وقوس فجاء وفجواء بينة
  الفجيج اذايان وترها عن كبدهاورج-ل أفج بين الفجيج وهو أقيح من الفمسيح وفجيت القوس
  أفجها اذارفعت وترهاعن كيدهامثل فجوتها وقال
  لا فجبج يرى بهاولا فيا.
  وأفجت النعامة رمت بصومها ابن الاعرابى أفج الرحل أى أسرع ويقال أيضاحاذر مفبح
  أى مقبب وهومحمود والفيج بالنكسر البطيخ الشامى الذى تسهيه الفرس الهندى وكل
