  tr: "Gazali'nin El-Mustasfa adlı eserinin ticari baskısından, 174. sayfadan bir alıntı; \"rukhsah\" (izin), \"rukhsah\" (izin) ve \"azimah\" (karar) terimlerini içermektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Edisi Komersial, hlm. 174, yang menyebutkan istilah \"rukhsah\" (dispensasi), \"rukhsah\" (dispensasi), dan \"azimah\" (ketetapan). Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
