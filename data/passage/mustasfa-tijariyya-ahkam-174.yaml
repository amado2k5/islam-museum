text: "… الفصل الثالث فى وصف العبادة بالآداء. والقضاء والامادة الفضل الرابع فى العزيمة والرخصة القطب الثانى فى أدلة الأحكام وهى أربعة : الكتاب والسنة والاجماع ودليل العقل الأصل الأول من أصول الأدلة كتاب اللّٰه تعالى النظر الأول فى حقيقته النظر الثاني …"
summary:
  ar: "مقطع من المستصفى للغزالي، طبعة التجارية، ص 174، يرد فيه ذكر الرخصة، والرخصة والعزيمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, the Tijariyya printing, p. 174, whose wording mentions the concession (rukhsa), the concession and the original rule; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، طبع تجاریہ، ص 174 کا اقتباس جس میں رخصت، رخصت اور عزیمت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 174, dont le texte mentionne la dispense (rukhsa), la dispense et la règle d'origine ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
