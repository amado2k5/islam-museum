text: "… لا ينسخ، فكيف بالخبر إذا جاء مثل مجىء هذا الحبر وهو لانورث. ب يا أَدَاءِ الخُمُسِ مِنَ الإيمانِ - حدثنا أبو النعمانِ قال حدثنا حمَّادٌ عنْ أبي حمزةَ الضَّبعيِّ قالَ: سمعتُ ابن عباسٍ يقولُ: قدمَ وفدُ عبدِ القيس فقالوا : …"
