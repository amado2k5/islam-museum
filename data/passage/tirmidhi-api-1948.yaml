label: { ar: "جامع الترمذي 1948 — الأب والأبوة", en: "Jami' al-Tirmidhi 1948 — the father and fatherhood", ur: "جامع ترمذی 1948 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1948 — El padre y la paternidad" }
text: "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلاَنَ، حَدَّثَنَا مُؤَمَّلٌ، حَدَّثَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ أَبِيهِ، عَنْ أَبِي مَسْعُودٍ الأَنْصَارِيِّ، قَالَ كُنْتُ أَضْرِبُ مَمْلُوكًا لِي فَسَمِعْتُ قَائِلاً مِنْ خَلْفِي يَقُولُ \" اعْلَمْ أَبَا مَسْعُودٍ اعْلَمْ أَبَا مَسْعُودٍ \". فَالْتَفَتُّ فَإِذَا أَنَا بِرَسُولِ اللَّهِ فَقَالَ \" لَلَّهُ أَقْدَرُ عَلَيْكَ مِنْكَ عَلَيْهِ \". قَالَ أَبُو مَسْعُودٍ فَمَا ضَرَبْتُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1948، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1948 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1948، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1948 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los familiares), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
