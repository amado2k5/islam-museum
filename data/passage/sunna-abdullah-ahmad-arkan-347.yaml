text: "… يَدْخُلِ الْإِيمَٰنُ فِي ةُ قُلُوبَكُمْ ه الحجرات:. ويقول النبي لَاِقَة: لا يزني الزاني حين يزني وهو مؤمن.. الحديث. وقال علا في سباب المسلم فسوق، وقتاله كفر. وغيرها من النصوص التي تنفي عنه الإيمان. - كافر بالله العظيم، وهو من لم …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 347، يذكر ما يرتفع معه الإيمان حين الفعل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 347, that mentions what faith is lifted by at the moment of the act; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 347 کا اقتباس جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de Abd Allah ibn Ahmad, pág. 347, que menciona qué es lo que fortalece la fe en el momento del acto; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'Abd Allah ibn Ahmad, p. 347, mentionnant la foi qui est levée au moment de l'acte; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, 347. sayfada, imanı yükselten amellerden bahsediliyor; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 347, menyebutkan amalan-amalan yang meninggikan iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
