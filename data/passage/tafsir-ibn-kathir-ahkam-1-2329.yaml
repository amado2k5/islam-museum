text: "… قومًا مؤمنين، فيجب عليهم قتاله كافة. كما هي نص في وجوب طلب العلم؛ وهو بالرحلة الطويلة إليه، وفي الحديث: طلب العلم فريضة علىٰ كل مسلم، وهذا الحديث دليل على أن طلب العلم يكون فرض عين ويكون فرض كفاية. قال العلامة …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 2329، يرد فيه ذكر الفريضة والفرائض، والفرض، وفرض العين، وما وجب على كل مسلم، وفرض الكفاية، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 2329, whose wording mentions the obligation (farida), the obligatory (fard), the individual obligation (fard 'ayn), a duty laid on every Muslim, the communal obligation (fard kifaya), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 2329 کا اقتباس جس میں فریضہ اور فرائض، فرض، فرضِ عین، جو ہر مسلمان پر لازم ہے، فرضِ کفایہ، وجوب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tafsir de Ibn Kathir, volume numérisé 1, p. 2329, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligation individuelle (fard 'ayn), un devoir imposé à chaque musulman, l'obligation collective (fard kifaya), l'obligation (wujub), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tafsir de Ibn Kathir, volumen digitalizado 1, p. 2329, cuyo texto menciona la obligación (farida), lo obligatorio (fard), la obligación individual (fard 'ayn), un deber impuesto a cada musulmán, la obligación colectiva (fard kifaya), la obligatoriedad (wujub), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
