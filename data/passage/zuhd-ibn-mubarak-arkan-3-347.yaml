summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 347، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
