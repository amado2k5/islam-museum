  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 347 کا اقتباس جس میں اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ibn al-Mubarak, volumen 3, pág. 347, que menciona un acto relacionado con la creencia en Dios y el Último Día; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Zuhd d'Ibn al-Mubarak (tome 3, p. 347) mentionnant un acte lié à la croyance en Dieu et au Jour dernier; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 347. sayfasında, Allah'a ve Ahiret Günü'ne olan imanla bağlantılı bir eylemden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Asketisme), Jilid 3, halaman 347, menyebutkan sebuah perbuatan yang berkaitan dengan iman kepada Tuhan dan Hari Kiamat; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
