text: |-
  ⁦(قلب)⁩
  .٩٣
  أى بأو تارها وهى تتخذمن الامعاء ويروى بقصابها وهى المزامير وشعر مقصب أى مجعد وقد
  قصب الزرع تقصيبا وذلك بعد التفريخ والقصائب الذوائب المقصبة تاوى ليا حتى تترجل
  ولا تضفر ضفرا واحد تها قصيبة وقصابة بالضم والتشديد وهى الانبوبة أيضاوالمزمار والجمع
  قصاب ( ١ والقصاب بالفتح الزمار عن أبى عرو قال رؤية يصف الجار
  فى جوفه وحى كوحى القصاب * وكذلك القاصب والصنعة القصابة والقصب القطع وقسب
  القصاب الشاة قصبا اذ اقطعها عضواعضوا وقصيت البعير وغيره اذا قطعت عليه شر به قبل
  أن يروى وقصب البعير أيضاشر به اذا امتفع منه قبل أن يروى فهو بعير قاصب وناقة قاصب
  أيضا عن ابن السكيت وأقصب الرجل اذافعلت ابله ذلك وفى المشل رعى فأقسب يضرب
  للراعى لانه اذا أساءرعيها لم تشرب الما لانما انما تشرب اذا شبعت من الكلا وقصبه أى عابه
  قال الكميت على أنى أذتمّ رأقصب (قضب ضبه أى قطعه قال الاعشى ⁦(٢)⁩ ⁦(٢)⁩ أوّله
  نضبت عقالها واقتضبته اقتطعته من الشئ واقتضاب الكلام ارتجاله تقول هذاشعر مقتضب
  ولبون مغراب حوين قاصبحت
  وكتاب مقتضب وانقضب الشي انقطع وتقول انقضب الكوكب من مكانه قال ذوالرمة
  هبى وآزلة قضبت عقالها
  كأنه كوكب ف إز عفرية * مسوم فى سواد الليل منقضب
  الازلة الناقة اضاهرة التى
  والقضبة والقضب الرطبة وهى الاسفست بالفارسية والموضع الذى تنبت فيه مقضبة وسيف
  لم تجتزاه
  قاضب وقضيب أى قطاع وابهمع قواضب وقضب ورجل قضابة قطاع الامور مقتدر عليها
  والقضيب واحد القضبان وهى الاغصان وقضبه قضباضر به بالقضيب وقضبت الكرم
  نقضيبا اذا قطعت أغصانه أيام الربيع وقضابة الشجر ما يتساقط من أطراف عيدائها
  اذا قضبت والقضيب الناقة التى لم ترض وقضبت الدابة واقتضبتها اذاركبتها قبسل أن تراض
  قال ابن دريد كل من كلفته عملا قبل أن يحسنه فهو مقتضب فيه وقضيب الحماروغيره
  ( طب قطب الرحى فيه ثلاث لغات قطب وقطب وقطاب والقطب كوكب بين الجدى
  والف وقدين يدورعليه الفلك وفلان قطب بنى فلان أى سيدهم الذى يدور عليه أمرهم
  وصأحب الجيش قطب رحى الحرب والقطبة نصل الهدق وهرم بن قطبة الفزارى الذى نافر
  اليه عامر بن الطفيل وعلسمة بن علاثة وتقول جاء القوم قاطبة أى جيعا وهواسم يدل على
  العموم ابن الاعرابى القطيبة ألبإن الابل والغستم يخلطان وقطب الشراب وأقطبه بمعنى
  أد مى عرو لبلو التف الاخرتم نيام تاكرى فاقة فيراملق بان الراجل
  وحوقل ساعده قداغلق • يقول قطبا ونعما ان ساق
  وتقول أيضاقطب بين عينيه أى بحسع فهور جل قطوب وقطب وجهه تقطيبا أى عبس
  طرب القطرب طائروقطرب لقب محمدين المستير التحوى قعى) القعب قدح
  من خشب مقعر وحافر مقعب مشبه به والجمع قعبة مثل جبءوجبأة وتقعيب المكلام تقعيره
  وقعذب اسم رجل بزيادة الذون عضب قعضيه أى استأصله وقعضبا-م رجل كان
  يعمل الاسنة ⁦(ققب)⁩ القيقب والقيقبان خشب تتخذمنه السروح قال ابن دريد هو
  بالفارسية أزاذدرخت ⁦(قلب)⁩ الغلب الفؤاد وقد يعبر به عن العقل قال النتراء فى قوله
