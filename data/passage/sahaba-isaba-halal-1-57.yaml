text: "… وقال الأعْمَشُ: كان ابن عباس إذا رأيته قلت: أجمل الناس، فإذا تكلم قلت: أفصح الناس، فإذا حدث قلت: أعلم الناس. وأما عائشة -ا - فكانت مقدمة في العلم والفرائض والأحكام والحلال والحرام، وكان من الآخذين عنها الَّذِين لا يكادون يتجاوزون …"
