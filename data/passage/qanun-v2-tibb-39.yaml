text: "… حاجة شديدة ووجع شديد، والبابونج قد يكسر قوّة المخدّرات في الأنطلة، والقيء مما لا ينتفع به في معالجات أمراض الرأس، إلا أن يكون بمشاركة مادة في المعدة، أصلح وجوه دفعها القيء قال جالينوس : ليس حال الصداع في شدة الحاجة …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 39، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 39, that mentions illness and the sick, pain, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 39 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 39, que menciona la enfermedad y los enfermos, el dolor, las enfermedades con nombre y los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 39, qui mentionne la maladie et les malades, la douleur, les maladies nommées, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 39. sayfasından hastalık, hasta, ağrı, hastalıkların isimleri ve vücut bölümlerinden bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 39, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, dan bagian tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
