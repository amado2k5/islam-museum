summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع سليمان بن يسار يذكر أن الموضحة في الوجه مثل الموضحة في الرأس، إلا أن تعيب الوجه فيزاد في عقلها ما بينها وبين عقل نصف الموضحة في الرأس، فيكون فيها خمسة وسبعون دينارا. {cite:muwatta-maruf-1997 p.428}"
