label: { ar: "الموطأ 2496 — يحيى بن سعيد عن سليمان بن يسار: الموضحة في الوجه كالرأس مع زيادة", en: "Muwatta 2496", es: "Muwatta 2496", fr: "Muwatta 2496", ur: "موطا 2496", tr: "El-Muvatta 2496 — Yahya ibn Said, Süleyman ibn Yasar'dan rivayetle: Yüzdeki işaret, baştaki işarete benzer, ancak bir ek özelliği vardır.", id: "Al-Muwatta 2496 — Yahya ibn Saeed berdasarkan riwayat Sulayman ibn Yasar: Tanda di wajah sama seperti tanda di kepala, dengan tambahan" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع سليمان بن يسار يذكر أن الموضحة في الوجه مثل الموضحة في الرأس، إلا أن تعيب الوجه فيزاد في عقلها ما بينها وبين عقل نصف الموضحة في الرأس، فيكون فيها خمسة وسبعون دينارا. {cite:muwatta-maruf-1997 p.428}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet ettiğine göre, Süleyman ibn Yasar'ın, yüzdeki bir yaranın baştaki bir yaraya benzediğini, ancak yüzdeki yaranın tazminatının baştaki yaranın tazminatının yarısı ile yüzdeki yaranın tazminatı arasında bir miktar artırıldığını, yani yetmiş beş dinar olduğunu söylediğini işittiğini aktarır. {cite:muwatta-maruf-1997 s.428}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, bahwa ia mendengar Sulayman ibn Yasar menyebutkan bahwa luka di wajah sama besarnya dengan luka di kepala, kecuali jika lukanya di wajah, kompensasinya ditambah dengan jumlah antara setengah kompensasi untuk luka di kepala, sehingga jumlahnya menjadi tujuh puluh lima dinar. {cite:muwatta-maruf-1997 p.428}"
