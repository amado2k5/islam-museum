summary:
  ar: "القسم 5 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التطوع»، ويضم فيها النصوص من 1250 إلى 1370 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 5 of Sunan Abi Dawud (Prayer (Kitab Al-Salat): Voluntary Prayers) in the division of the open hadith dataset the museum took its reports from: reports 1250 to 1370 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 5، عنوان «کتاب التطوع»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1250 تا 1370۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 5 de Sunan Abi Dawud (Oración (Kitab Al-Salat): Oraciones voluntarias) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1250 al 1370 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du recueil ouvert Sunan Abi Dawud (Prière (Kitab Al-Salat): Prières surérogatoires), dans la section 1250 à 1370 de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 5. bölümü, açık hadis veritabanına dahil edilmiş olup \"Gönüllü Rivayet Kitabı\" başlığını taşımaktadır. Bu bölüm, 1250 ile 1370 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 5 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi basis data hadits terbuka dan diberi judul \"Kitab Bacaan Sukarela\". Bagian ini berisi teks-teks bernomor 1250 hingga 1370. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
