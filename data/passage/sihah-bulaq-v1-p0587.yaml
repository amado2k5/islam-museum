text: |-
  والصّاه
  ٢ و حسان بن ثابت وقب له
  .ولأنت أحسن اذبرزت انا
  يوم الخروج بساحة القصر
  تؤذى ولده عرارا بالسكسر وقبله
  وان عبزارا ان يكن غير واتخ
  قانى أحب الجون ذا المتكب العمم
  يقول لزوجبه كبونى لولدى لسمن
  رب أديه أى طلى برب النمر
  اب الدام
  وهوالرب والشهيد على يو م الحيارين والبلاءبلا.
  والريانى المتأله العارف باللّه تعالى وقال سبحانه كونواربانيين وريبت القوم سستهم أى كنت
  فوقهم قال أبو نصروهومن الربوبية ومنه قول صفوان لأن يربن رجل من قريش أحب
  الىّ من أن يربنى رجل من هوازن ورب الضيعة أى أصلحها وأنها ورب فلان ولده يربه
  رباوربيه وتربيه بعنى أى رباه والمربوب المربى قال الشاعر ه و سلامة بن جندل
  ليس بأقنى ولا أسفى ولا سفل * يسقى دواء قفىّ السكن عربوب ١
  وقال آخر ⁦(٢ )⁩
  من درة ضاء صافية مماترب حار البحر
  بعنى الدرّة التى يربيها الصدف فى قعر الماء والتريب ايضا الاجتماع والربى بالضم على فعلى
  الشاة التى وضعت حديشا وجعهارباب بالضم والمصدر رباب بالكسر وهو قرب العه-د
  بالولادة تقول شاتربي بينة الرباب وأعنزرباب قال الاموى هى ربى ما بينها وبين شهرين
  قال أبوزيد الربى من المعز وقال غيره من المعزوالضأن جيعاور بماجاء فى الابل أيضا قال
  الاصمعىّ أنشدنا منتجع بن تيهان حنين أمّ البوّفى ربابها والراب زوج الامّ والراية امرأة
  الاب وريب الرجل ابن امر أته من غيره وه و بعنى مربوب والاننى ربية والربيسة أيضا
  واحدة الريائب من الغنم التى يربيها الناس فى البيوت لالبانها والربيية الحاضنة ابن
  السكيت بقال افعل ذلك الامر بريانه مضمومة الراءأى بعدثانه وجدّته وطرامته قال
  ومنه قيل شاربي قال ابن أحر
  وانما العيس بريانه * وأنت من أفذانه معتصمر
  وأخذت الشى بربانه أى أخذته كله ولم أترك منه شيئا عن الاصعىّ والرب الطلاه الخائر
  والجمع الربوب والرباب ومنه سقاء مربوب اذاريبته أى جعلت فيه الرب وأصلحته به قال
  ⁦(عمروين شاس)⁩
  فان كنت مى أوتريدين صحبتى * فكونى له كالسمن رب له الادم
  أراد بالادم النحى لانه اذا أصلح بالرب طابت رائحته والمربيات الانيجات وهى المع-مولان
  بالرب كالمعسل وهو المعدول بالعسل وكذلك المربيات الاأنها من التربية بقال زنجييل
  مربى ومريب ورب حرف خافض لا يقع إلا على نكرة يشدد ويحفف وقد تدخل عله التاء
  نيقال ربت وتدخل عليه ماليمكن أن يتكلم بالفعل بعده كقوله تعالى ربا يود الذين
  كفروا وقد تدخل عليه الهاء فيقال ربه رجلاقد ضربت فلا أضفته الى الهاء وهى
  مجهولة نصبت رجلاعلى التمييز وهذه الهاء على لفظ واحدوان وليها المؤنت والائسان والجمع
  فهى موحدة على كل حال وحكى الكوفيون ربه رجلاقدرأيت وربهما رجلين وربهم
  رجالا وربهنّ نساء فن وحد قال انه كتاية عن مجهول ومن لم يوحد قال انه ردّ كلام كانه قيل له
  مالكّ جوار فقال ربهن جوارد ملكت قال ابن السراج النحويون كالجمعين على أنّ رب
  جواب والربة بالكسر ضرب من النبت والمع الريب قال ذوالرحّة يصف الثور الوحشىّ
  أمسى بوهبين مجتاز المرتعه * من ذى الفوارس تدء و أنفه الربب
  واريب
