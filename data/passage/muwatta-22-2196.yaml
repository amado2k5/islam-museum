label: { ar: "الموطأ 2196 — يحيى عن مالك: الأمر المجتمع عليه عندنا أن الهبة إذا تغيرت عند الموهوب له للثواب بزيادة أو نقصان، فإن على الموهوب له أن يعطي صاحبها قيمتها يوم قبضها", en: "Muwatta 2196", es: "Muwatta 2196", fr: "Muwatta 2196", ur: "موطا 2196", tr: "El-Muvatta 2196 — Yahya, Malik'ten rivayetle: Bizim aramızda ittifak şudur ki, bir hediye, ödül olarak alan kişinin elinde bulunduğu süre içinde artma veya azalma şeklinde bir değişiklik gösterirse, alan kişi hediyeyi sahibine, hediyeyi aldığı günkü değerini iade etmelidir.", id: "Al-Muwatta 2196 — Yahya berdasarkan riwayat Malik: Konsensus di antara kami adalah bahwa jika suatu hadiah berubah nilainya pada penerima sebagai imbalan, baik bertambah maupun berkurang, maka penerima wajib memberikan kepada pemiliknya nilai hadiah tersebut pada hari ia menerimanya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر المجتمع عليه عندنا، أن الهبة إذا تغيرت عند الموهوب له للثواب، بزيادة أو نقصان، فإن على الموهوب له أن يعطي صاحبها قيمتها يوم قبضها. {cite:muwatta-maruf-1997 p.301}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Aramızda görüş birliği şudur ki, bir hediye alıcının elindeyken değerinde artış veya azalış olursa, alıcı hediyeyi sahibine aldığı günkü değerini ödemek zorundadır. {cite:muwatta-maruf-1997 s.301}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Konsensus di antara kita adalah bahwa jika suatu hadiah berubah nilainya saat berada di tangan penerima, baik bertambah maupun berkurang, maka penerima harus memberikan kepada pemiliknya nilai hadiah tersebut pada hari ia menerimanya. {cite:muwatta-maruf-1997 p.301}"
