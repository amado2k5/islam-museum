text: "… قال: فكان الناس يقولون: هو محمد بن كعب؛ لأن أباه من أَيُّما رَجُل حَلَفَ عَلَى مال أخيهِ كَاذِباً لِيَقْتَطِعَهُ بِيَمِينِه، فَقَدْ بَرِثَتْ مِنْهُ الذُّمةُ، وَوَجَبَتْ لَهُ النَّارُ ؛ فقال محمد بن قريظة وأمه من بني النضير وهما - أعني بني …"
