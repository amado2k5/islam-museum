text: "… قال نظير هذا في شُهداء أُحد، فقال: زَمِّلُوهُمْ فِي ثِيابهِم، بكُلُومهم، فإنَّهُم يُبْعَثُونَ يَومَ القيامَةِ اللَّوْنُ لَوْنُ الدَّم، والرِّيحُ رِيحُ المِسْكِ صحيح: أحمد:، والنسائي. وهذا غيرُ مختص بهم، وهو نظيرُ قوله : كَفِّنُوهُ في ثَوْبيهِ، فإنه يبعث يوم القيامة مُلبِّياً. …"
summary:
