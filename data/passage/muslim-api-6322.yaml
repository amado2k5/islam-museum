label: { ar: "صحيح مسلم 6322 — تمر العجوة", en: "Sahih Muslim 6322 — 'ajwa dates", ur: "صحیح مسلم 6322 — عجوہ کھجور" }
text: "… أُمَّ سُلَيْمٍ وَلَدَتْ \". قُلْتُ نَعَمْ. فَوَضَعَ الْمِيسَمَ - قَالَ - وَجِئْتُ بِهِ فَوَضَعْتُهُ فِي حَجْرِهِ وَدَعَا رَسُولُ اللَّهِ بِعَجْوَةٍ مِنْ عَجْوَةِ الْمَدِينَةِ فَلاَكَهَا فِي فِيهِ حَتَّى ذَابَتْ ثُمَّ قَذَفَهَا فِي فِي الصَّبِيِّ فَجَعَلَ الصَّبِيُّ يَتَلَمَّظُهَا - قَالَ - فَقَالَ رَسُولُ اللَّهِ \" انْظُرُوا إِلَى حُبِّ الأَنْصَارِ التَّمْرَ \". قَالَ فَمَسَحَ وَجْهَهُ وَسَمَّاهُ عَبْدَ اللَّهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6322، يذكر تمر العجوة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 6322 (The Book of the Merits of the Companions), that mentions 'ajwa dates. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 6322، جس میں عجوہ کھجور کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
