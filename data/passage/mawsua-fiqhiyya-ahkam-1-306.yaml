text: "الصلاة بالعمامة : - اتفق الفقهاء على استحباب ستر الرأس فى الصلاة للرجل بعمامة وما فى معناها، لأنه عَيِلة كان يصلى بالعمامة. أما المرأة فواجب ستر رأسها. ونص الحنفية على كراهة صلاة الرجل مكشوف الرأس إذا كان تكاسلا لترك الوقار، …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 1، ص 306، يرد فيه ذكر الواجب، والمستحب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 1, p. 306, whose wording mentions the obligatory (wajib), the recommended (mustahabb), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 1، ص 306 کا اقتباس جس میں واجب، مستحب، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 1, p. 306, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 1, p. 306, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
