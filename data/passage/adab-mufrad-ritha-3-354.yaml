  ur: "الادب المفرد، اسکین جلد 3، ص 354 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
