text: "… في شيء من الكتب الستة كذا قال، وفاته أنَّ الترمذي أخرجه في الأدب وقد عزاه إليه جمع منهم الشارح ؟ وصححه هو والضياء المقدسي في المختارة وهو حري بذلك ؟ لأنَّ رجاله على شرط مسلم، وأما قول المعلق على مسند …"
summary:
  ar: "مقطع من الأدب المفرد، المجلد المصوَّر 3، ص 354، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
