label: { ar: "سنن النسائي 3635 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan al-Nasa'i 3635 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن نسائی 3635 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Sunan al-Nasa'i 3635 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia", fr: "Sunan al-Nasa'i 3635 — testament ou dernières volontés; ce qui a été laissé: biens et héritage" }
text: "… حَدَّثَنَا هَمَّامٌ، عَنْ قَتَادَةَ، عَنْ يُونُسَ بْنِ جُبَيْرٍ، عَنْ مُحَمَّدِ بْنِ سَعْدٍ، عَنْ أَبِيهِ، سَعْدِ بْنِ مَالِكٍ أَنَّ النَّبِيَّ جَاءَهُ وَهُوَ مَرِيضٌ فَقَالَ إِنَّهُ لَيْسَ لِي وَلَدٌ إِلاَّ ابْنَةٌ وَاحِدَةٌ فَأُوصِي بِمَالِي كُلِّهِ قَالَ النَّبِيُّ \" لاَ \". قَالَ فَأُوصِي بِنِصْفِهِ قَالَ النَّبِيُّ \" لاَ \". قَالَ فَأُوصِي بِثُلُثِهِ قَالَ \" الثُّلُثَ وَالثُّلُثُ كَثِيرٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3635، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3635 (The Book of Wills), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 3635، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3635 (El Libro de los Testamentos), menciona un testamento o consejo de despedida, y lo que se dejó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3635 (Le Livre des Testaments), mentionne un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Le Navigateur de Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
