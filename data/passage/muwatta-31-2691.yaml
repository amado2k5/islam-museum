summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر أنه قال: قال رسول الله: قاتل الله اليهود، نُهوا عن أكل الشحم فباعوه فأكلوا ثمنه. ويذكر المحقق قول ابن عبد البر أن الحديث مروي عن النبي مسندا متصلا من وجوه ثابتة عن عمر وأبي هريرة وابن عباس وجابر وغيرهم. {cite:muwatta-maruf-1997 p.520}"
