label: { ar: "الموطأ 2691 — عبد الله بن أبي بكر: قاتل الله اليهود نهوا عن الشحم فباعوه فأكلوا ثمنه", en: "Muwatta 2691", es: "Muwatta 2691", fr: "Muwatta 2691", ur: "موطا 2691", tr: "El-Muvatta 2691 — Abdullah ibn Abi Bekr: Allah Yahudilere lanet etsin! Yağ tüketimini yasakladılar, fakat onu satıp parasını yediler.", id: "Al-Muwatta 2691 — Abdullah ibn Abi Bakr: Semoga Allah melaknat orang-orang Yahudi! Mereka melarang mengonsumsi lemak, namun mereka menjualnya dan memakan hasilnya." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر أنه قال: قال رسول الله: قاتل الله اليهود، نُهوا عن أكل الشحم فباعوه فأكلوا ثمنه. ويذكر المحقق قول ابن عبد البر أن الحديث مروي عن النبي مسندا متصلا من وجوه ثابتة عن عمر وأبي هريرة وابن عباس وجابر وغيرهم. {cite:muwatta-maruf-1997 p.520}"
  tr: "Malik, Abdullah ibn Abi Bekr'den rivayetle şöyle buyurmuştur: Allah Resulü şöyle buyurdu: \"Allah Yahudilere lanet etsin! Onlara yağ yemeleri yasaklanmıştı, fakat onlar yağı satıp parasını yediler.\" Araştırmacı, İbn Abdül-Barr'ın hadisin, Ömer, Ebu Hurayra, İbn Abbas, Cabir ve diğerleri gibi sahih raviler aracılığıyla kesintisiz bir isnad zinciriyle Peygamberimizden nakledildiğine dair ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.520}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr bahwa beliau berkata: Rasulullah SAW bersabda: Semoga Allah melaknat orang-orang Yahudi! Mereka dilarang memakan lemak, tetapi mereka menjualnya dan memakan hasilnya. Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits ini diriwayatkan dari Nabi dengan sanad yang berkesinambungan melalui perawi-perawi sahih dari Umar, Abu Hurairah, Ibnu Abbas, Jabir, dan lainnya. {cite:muwatta-maruf-1997 p.520}"
