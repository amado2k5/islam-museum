text: "٢٣٨ الفصل الخامس عشر ح / ١٩١ من خلفه، أثقلُ في الميزان من الجبل العظيم، وفي الليلة الظلماء في مثل نورِ الشَّهاب، قالوا : فأسْمعِنا منه، فتلا رسولُ اللّٰه لفي والصَّافاتِ صفًّا حتى بلغ وَرَبّ المشارِقِ - الصافات ١ وما …"
