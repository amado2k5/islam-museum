label: { ar: "مسلم 106 — ثلاثة لا يكلمهم الله يوم القيامة: المسبل والمنان والمنفق سلعته بالحلف الكاذب", en: "Muslim 106 — Three God will not address on the Last Day: the drag-trailing, the reminding giver, the false oathmonger", es: "Musulmán 106 — Tres a quienes Dios no abordará en el Último Día: el que arrastra, el que da recordatorios, el que jura falso", fr: "Muslim 106 — Trois choses auxquelles Dieu ne s'adressera pas au Jour du Jugement dernier: celui qui traîne derrière, celui qui rappelle sans cesse les choses, celui qui prête de faux serments", ur: "مسلم 106 - تین خدا قیامت کے دن خطاب نہیں کریں گے: گھسیٹنے والا، یاد دلانے والا، جھوٹی قسم کھانے والا", tr: "Müslim 106 — Kıyamet günü Allah üç kişiye hitap etmeyecektir: Elbisesini ayak bileklerinin altına sarkıtan, iyiliklerini başkalarına hatırlatan ve yalan yere yemin ederek mal satan." }
text: "قال رسول الله: «ثلاثة لا يكلمهم الله يوم القيامة ولا ينظر إليهم ولا يزكيهم ولهم عذاب أليم: المسبل، والمنان، والمنفق سلعته بالحلف الكاذب»"
summary:
  ar: "رواية أبي ذر في كتاب الإيمان من صحيح مسلم؛ قرأها ثلاث مرات فقال أبو ذر: خابوا وخسروا، من هم يا رسول الله؟ فسماهم: من يسبل إزاره خيلاء، ومن لا يعطي إلا منّاً، ومن يروج سلعته بالحلف الكاذب."
  tr: "Ebu Zer'in Sahih Müslim'den rivayet ettiği İman Kitabı'nda; üç defa okuduktan sonra Ebu Zer şöyle dedi: \"Onlar başarısız oldular ve kaybettiler. Ey Allah'ın Resulü, onlar kimlerdir?\" Bunun üzerine Resulullah onları şöyle sıraladı: \"Gururdan elbisesini aşağı sarkıtan, sadece yükümlülük duygusuyla veren ve yalan yere yemin ederek malını pazarlayan.\""
  id: "Riwayat Abu Dzar dalam Kitab Iman dari Sahih Muslim; beliau membacanya tiga kali dan Abu Dzar berkata: Mereka telah gagal dan rugi. Siapakah mereka, wahai Rasulullah? Maka beliau menyebutkan nama-nama mereka: Orang yang membiarkan pakaiannya menjuntai karena kesombongan, orang yang memberi hanya karena kewajiban, dan orang yang mempromosikan barang dagangannya dengan sumpah palsu."
