label: { ar: "مسلم 106 — ثلاثة لا يكلمهم الله يوم القيامة: المسبل والمنان والمنفق سلعته بالحلف الكاذب", en: "Muslim 106 — Three God will not address on the Last Day: the drag-trailing, the reminding giver, the false oathmonger" }
text: "قال رسول الله: «ثلاثة لا يكلمهم الله يوم القيامة ولا ينظر إليهم ولا يزكيهم ولهم عذاب أليم: المسبل، والمنان، والمنفق سلعته بالحلف الكاذب»"
summary:
  ar: "رواية أبي ذر في كتاب الإيمان من صحيح مسلم؛ قرأها ثلاث مرات فقال أبو ذر: خابوا وخسروا، من هم يا رسول الله؟ فسماهم: من يسبل إزاره خيلاء، ومن لا يعطي إلا منّاً، ومن يروج سلعته بالحلف الكاذب."
