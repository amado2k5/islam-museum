text: "… الاهتمام، وإلا فيُعلّمه قَدْرَ ما يَعْرف الفَرائضَ والسُّنَنَ، ثم يأمرُهُ باشتغالِ الاكتسابِ ونوافل الطّاعات، لكن يَصْبر في امتحانِ ذِمْنه مِقْدار ثلاث سنين، وإن سُئِلَ عما يَشُك فيه يقول: لا أدْرِي، فإنَّ لا أدري نصفُ العِلْم. في م: أنه ينبغي، ولفظة …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 143، يرد فيه ذكر الفريضة والفرائض، والطاعات، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 143, whose wording mentions the obligation (farida), the acts of obedience, the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 143 کا اقتباس جس میں فریضہ اور فرائض، طاعات، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kashf al-Zunun de Hajji Khalifa, volume numérisé 1, p. 143, dont le texte mentionne l'obligation (farida), les actes d'obéissance, le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen digitalizado 1, p. 143, cuyo texto menciona la obligación (farida), los actos de obediencia, lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin Resimli Cilt 1, sayfa 143'ünden, farz olan ameller ve çoğulları, itaat amelleri ve nafile amelleri ve çoğullarını içeren bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kashf al-Zunun karya Haji Khalifa, Jilid Bergambar 1, halaman 143, yang menyebutkan amalan wajib dan bentuk jamaknya, amalan ketaatan, dan amalan sunnah dan bentuk jamaknya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
