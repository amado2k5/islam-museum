text: "… الاهتمام، وإلا فيُعلّمه قَدْرَ ما يَعْرف الفَرائضَ والسُّنَنَ، ثم يأمرُهُ باشتغالِ الاكتسابِ ونوافل الطّاعات، لكن يَصْبر في امتحانِ ذِمْنه مِقْدار ثلاث سنين، وإن سُئِلَ عما يَشُك فيه يقول: لا أدْرِي، فإنَّ لا أدري نصفُ العِلْم. في م: أنه ينبغي، ولفظة …"
