text: "… فلا يخفى عليك أن الشء الواحد يستحيل أن يكون واجبا حراما، طاعة معصية، لكن ربما تخفى عليك حقيقة الواحد. فالواحد ينقسم الى واحد بالنوع، وإلى واحد بالعدد : أما الواحد! بالنوع، كالسجود مثلا فانه نوع واحد من الافعال، فيجوز أن …"
