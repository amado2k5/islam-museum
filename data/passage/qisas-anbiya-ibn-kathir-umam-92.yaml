text: "… وَيَعُوقَ ونَسْراً قال : هذه أسماء من قوم نوح، فلما هلكوا أوحى الشيطان إلى قومهم أن انصبوا إلى مجالسهم التى كانوا يجلسون فيها أنصاباً وسموها بأسمائهم، ففعلوا فلم تعبد، حتى إذا هلك أولئك وانتسخ العلم عبدت. قال ابن عباس : …"
