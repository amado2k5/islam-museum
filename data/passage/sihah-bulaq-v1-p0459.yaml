text: |-
  الاصباح ذكره فى مساء اه
  مختار
  قال أبو عبي-دة كان ذلك
  فى صحه وسة-٠ه كذا فى بعض
  نسح الصصاح اه وانقونى
  .١٨٢
  ⁦(باب الح1)⁩
  والشيح فى لغة هذيل الجاد فى الامور والجع شباح وشايح الرحل حدّ فى الامر
  قال أبوذؤيب يرثى رجلا بدرت الى أولاهم فسبقتهم • وشايحت قبل الموت انك شيح
  وأشاح مثل شامح قال الشاءر
  قبا أطاعت راعيا ميها وفى لفسة غبرهم شايح
  وأشاح بعف حذر قال
  اذاسمعن الرزمزرياح • شايحن منه أيماشياح
  اى حذرن
  والشيحان الغمور لحذره على حرمه وناقة شحانة أى سريعة وأشاح بوجهه أعرض وأشاح
  الفرس بذئه اذا أرخاه والمشوحاء الارض التى تنبت الشيح والمشيوحا أن يكون القوم
  فى أمر يبتدرونه بقال هم فى مشيوحا من أمرهم
  (ف صل الصاد ( بح لصبح الفجر ( و لصباح نقيض المساء وكذلك الصبيحة
  قول منه أصبح الرحل وصبحه اللّٰه وصبحته أى قلت له عم صباحا وصبحته أيضااذا أتيت
  ساحا ولا يراد بالتشديدههنا التكنير وأضبح فلان عالما أى صار وأتيته لصبح خامس
  كما تقول لمسى خامسة وصبح خامسة بالكسراغة فيه وأتيته أصبوحة كل يوم وأمسبة كل
  يوم واقيته صباحا وذاصباح وهوظرف غير متمكن وأماقول الشاعر أنس بن نهيك
  لامر ما يسوّد من إ-ود • عزمت على اقامة ذى صباح
  فلم يستعمله ظرفا قال سيبويه هى لغة تلنهم وفلان ينام الصبحة والصبحة ؟ أ ى ينام حين
  يحبح تقول منه تصبح الرجل والمصبح بالفتح موضع الاصباح ووقت الاصباح أيضا قال الشاءر
  بمصبح الحدوحيث يمسى وهذا مبنى على أصل الفعل قبل أن يزادفيه ولوبنى على أصبح
  لقيل مصبح بضم الميم والصبوح الشرب بالغداة وهو خلاف القبوق تقول منه صبحته صبحا
  وقال يصف فرسا كان ابن أمماء يعشوه ويصبحه * من هجمة كفسيل النخل درار
  واصطيح الرجل شرب صبوحافهو مصطبح وصبحان والمرأة صبحى مثل سكران وسكرى وفى
  المثل انه لا كذب من الاخيذ الصبحان والمصباح السراج وقد استصبحت به اذا أسرحت
  والشمع مما يصطبح به أى يسرج به والمصباح الناقة التى تصبح فى مبركها ولا ترتعى -و
  يرتفع النهار قال الاصمعى وهذامما يستحب من الابل والمصابيح الاقداح التى يصطبج بها
  ويوم الصباح يوم الغارة قال الاعشى
  غداة الصباح اذا النقع ثارا
  والصباحة الجال وقد صبح بالضم صباحة فهو صيح وصباح أيضا بالضم عن الكسائى
  والاصبح قريب من الاصهب تقول رجل أصبح وأسد أصبح بين الصبح والاصبحىّ السوط قال
  أبو عبيدة ذوأصبح ملل من ملول المن واليه نسبت السياط الاصحية (صحح الصحة
  خلاف السقم وقد صح فلان من علته واستمح قال الاعشى
  نفض الاسقام عنه واستصح وصحه اللّٰه فهو هجيح وصصاح بالفتح وكذلك صحيح الاديم وصحاح
  الاديم ععسنى أى غير مقموع وأصح القوم فهم مصمون اذا كانت قد أصابت أموالهم عاعة
  تم ارتفعت وفى الحسديث لايوردن ذوعاهة على مصح وتقول السفر مصمة بالفع والصص
  والصمصاح والصصبحان المكان المستوى والترّهات الصحاصح هى الباطل هكذاحكاء
  أبو عبيدوكذلك الترّهات البدابس وهما بالاضافة أجود عندى ⁦(صدح)⁩ صدح الديك
  والغراب
