text: "… الأَصل المرة من الضياع. نضرب في الأَرض: نسافر. انبعثت به راحلته: قامت من بُروكها. حِلٌّ بكسر الحاء: الحلال ضد الحرام وبِلّ بكسر الباء الموحدة: المباح. وقيل: الشفاء من قولهم: بَلَّ من مرضه وأَبَلَّ. وبعضهم يجعله إتباعاً لجِلّ. قال في النهاية: …"
