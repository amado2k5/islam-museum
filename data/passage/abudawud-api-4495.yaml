label: { ar: "سنن أبي داود 4495 — وزر من تبع", en: "Sunan Abi Dawud 4495 — bearing the burden of those who follow", ur: "سنن ابی داؤد 4495 — پیروی کرنے والوں کا بوجھ" }
text: "… رَسُولَ اللَّهِ قَالَ لأَبِي \" ابْنُكَ هَذَا \". قَالَ إِي وَرَبِّ الْكَعْبَةِ قَالَ \" حَقًّا \". قَالَ أَشْهَدُ بِهِ. قَالَ فَتَبَسَّمَ رَسُولُ اللَّهِ ضَاحِكًا مِنْ ثَبْتِ شَبَهِي فِي أَبِي وَمِنْ حَلْفِ أَبِي عَلَىَّ. ثُمَّ قَالَ \" أَمَا إِنَّهُ لاَ يَجْنِي عَلَيْكَ وَلاَ تَجْنِي عَلَيْهِ \". وَقَرَأَ رَسُولُ اللَّهِ { وَلاَ تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى }"
summary:
  ar: "حديث في سنن أبي داود، رقم 4495، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 4495 (Types of Blood-Wit (Kitab Al-Diyat)), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 4495، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
