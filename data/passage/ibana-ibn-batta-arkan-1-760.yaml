text: "… إلا بإيمان. المجموعة العلمية، ص. وقال البغوي في كتابه شرح السنة : اتفقت الصحابة والتابعون فمن بعدهم من علماء السنة على أن الأعمال من الإيمان. ثم قال أيضاً: وقالوا: إن الإيمان قول وعمل وعقيدة يزيد بالطاعة وينقص بالمعصية على ما …"
