text: |-
  عنز حنطئة يفتح النون مثال عليطة أى عريضة خخمة ⁦(حبطأ)⁩، رجل حينطأ وحبنطأة
  وحبنطى أيضابلاهم رقصير معين ضخم البطن وكذلك المحبنطئ يهمز ولايه مزوبقال هو
  المعتلئ غيظا أبوزيد احبنطاً الرجل اذا انتفتخ جوفه ( فأ لحفأ أصل البردى الاييض
  الرطب وهو يوكل ⁦(حكاً)⁩ أسكأن العقدة وأحكيتها أى شددتها قال عدى بن زيد
  بصف جارية
  اجل انّ اللّه قد فضلكم * فوق من أحكاً صلبا بازار
  هذه رواية أبى زيد ويروى فوق من أحكى بصلب وازار أى بحسي وعفسة ⁦(حلاً)⁩
  ابن السكيت حلات له حاوءا على فعول اذاحككت لهحجزا على حجرثم جعات الحكاكة
  على كفك وصّ أت بد المرآة ثم كملته بهساوالحلامة بالضم على فعالة مثل الحلوء والحلاءة أيضا
  قشيرة الجاد التحدية شرها الدباغ ما يلى اللحم تقول حلات الجلد اذاقشرته وفى المثل حلات
  حالئة عن كوعها لات المرأة الصناع ربما استعجلت فقشرت كوعها والتحلى بالكسر
  ما أفسده السكينزمن الجلد اذا قشر تقول منه حلى الاديم حلا بالتحريك اذا صارقي
  التحلئ والحلا أيضا العقبول وقد حلئت شفتى أى بثرت أبوز يدحلاته بالسوط حلا
  اذا جلدته به وحلاته بالسيف ضربته به وحلاته مائة درهم اذا أعطيته وحلات
  الايل عن المساءتحلثة وتحلينا اذاطردتم اعنه ومنعتها أن ترده قال الشاعر
  لحائم سام -تى لاحوام به *محلا عن سبيل الماءمطرود
  وكذلك غير الايل قال امر والقيس كمشى الاتان حلئت عن مناهل ويقالقدحلات
  السويق قال الفبرّاء قدهمزوا ماليس بمهموزلانه من الحلواء ( أ الهأ الطين
  الاسود قال اللّٰه تعالى من حأصنون وكذلك الهأة بالتسكينة ول منه مأت البئر
  حأبانتسكين اذا نزعت جأتها وحئت البترحأ بالتحريك كثرت حمأتها وأحأتها إحماه
  ألقيت فيها الجأة عن ابن السكيت وحئت عليه غضيت عن الاموى والحم. كل من
  كأن من قبل الزوح مثل الاخ والاب وفيه أربع لغات حم بالهم زوأنشد أبوعمرو
  تبذن فانى حزها وجارها • وحامثسل قفا و•ومثسل أبو وحم مثل أب والجمع الاحاء
  نا الحناء بالمدوالتشديد معروف والحناءة آخص منه آيوذيد حنات لحميته بالحناء
  تحنئة وتحنيمًا خضيت والجناه تان نقوان أحران من رمل عاج
  صل الخا خبا خبأت الشى خبا ومنه الخابئة وهى الحب الاأن العرب تركت
  همزه وانلبء ماخي وكذلت الجي على فعيل وخب. السموات القطر وخب الارض
  النبات واختيأت استترت وجارية مخيأة أى مستترة والحبأة مثال الهمبزة المرأة التى تطلع
  ثم تختي قال الزيرقان بن بدر لت أيغض كائنى الى الحبأة الطلعة ⁦( تا)⁩ اختتأت من
  فلان أى اختيأت منه واستترت خوفا أوحياء وأنشد الاخفش
  فلايرحب ابن العمّ منى صولى * ولا أختتى من قوله المتهدد
  قال واماترك همزه ضرورة أبو عبيدة اختنأت لهاختتاء ختلته ⁦(حجأ)⁩ أبوزيد خجأت
  المرأ: خجأ نكختها ورجل خجأة أى نكحة وفيل خجأة كثير الضراب والجاة أيضا الرجل
  الكثير
