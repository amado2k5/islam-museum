text: "… يقال: فما هذه الصلة الواجبة التي نادت عليها النصوصُ، وبالغت في إيجابها، وذَمَّتْ قاطعها؟ فأيُّ قَدْرٍ زائدٍ فيها على حق الأجنبيِّ حتى تَعْقِلَهُ القلوب، وتُخْبِرَ به الألسنة، وتَعْمَلَ به الجوارحُ؟ أهو السلامُ عليه إذا لقيه، وعيادتُه إذا مرض، وتشميتُه إذا …"
