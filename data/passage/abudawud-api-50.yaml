label: { ar: "سنن أبي داود 50 — الأب والأبوة", en: "Sunan Abi Dawud 50 — the father and fatherhood", ur: "سنن ابی داؤد 50 — باپ اور والدیت", es: "Sunan Abi Dawud 50 — el padre y la paternidad", fr: "Sunan Abi Dawud 50 — le père et la paternité", tr: "Sunan Abi Davud 50 — Baba ve Babalık", id: "Sunan Abi Dawud 50 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عِيسَى، حَدَّثَنَا عَنْبَسَةُ بْنُ عَبْدِ الْوَاحِدِ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ كَانَ رَسُولُ اللَّهِ يَسْتَنُّ وَعِنْدَهُ رَجُلاَنِ أَحَدُهُمَا أَكْبَرُ مِنَ الآخَرِ فَأُوحِيَ إِلَيْهِ فِي فَضْلِ السِّوَاكِ \" أَنْ كَبِّرْ \". أَعْطِ السِّوَاكَ أَكْبَرَهُمَا. قَالَ أَحْمَدُ - هُوَ ابْنُ حَزْمٍ - قَالَ لَنَا أَبُو سَعِيدٍ هُوَ ابْنُ الأَعْرَابِيِّ هَذَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 50، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 50 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 50، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 50 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 50 (Purification (Kitab Al-Taharah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 50. hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 50, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
