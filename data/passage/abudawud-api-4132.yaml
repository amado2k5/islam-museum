label: { ar: "سنن أبي داود 4132 — الأب والأبوة", en: "Sunan Abi Dawud 4132 — the father and fatherhood", ur: "سنن ابی داؤد 4132 — باپ اور والدیت" }
text: "حَدَّثَنَا مُسَدَّدُ بْنُ مُسَرْهَدٍ، أَنَّ يَحْيَى بْنَ سَعِيدٍ، وَإِسْمَاعِيلَ بْنَ إِبْرَاهِيمَ، حَدَّثَاهُمُ - الْمَعْنَى، - عَنْ سَعِيدِ بْنِ أَبِي عَرُوبَةَ، عَنْ قَتَادَةَ، عَنْ أَبِي الْمَلِيحِ بْنِ أُسَامَةَ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ نَهَى عَنْ جُلُودِ السِّبَاعِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4132، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4132 (Clothing (Kitab Al-Libas)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4132، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
