label: { ar: "الموطأ 1475 — ابن شهاب عن علي بن الحسين عن عمر بن عثمان عن أسامة بن زيد: لا يرث المسلم الكافر", en: "Muwatta 1475" }
text: "لا يَرِثُ الْمُسْلمُ الْكَافرَ"
summary:
  ar: "يروي مالك عن ابن شهاب عن علي بن حسين بن علي بن أبي طالب عن عمر بن عثمان بن عفان عن أسامة بن زيد أن رسول الله قال لا يرث المسلم الكافر. ويذكر المحقق أن الترمذي رأى أن الصواب عمرو بن عثمان، وأن ابن عبد البر قال إن الثابت عن مالك عمر بن عثمان كما روى يحيى، وأن الجماعة أولى أن يسلم لها. {cite:muwatta-maruf-1997 p.21}"
