label: { ar: "صحيح مسلم 5707 — مرض النبي، المرض والمريض", en: "Sahih Muslim 5707 — the Prophet's illness; illness and the sick", ur: "صحیح مسلم 5707 — نبی کی بیماری، بیماری اور بیمار", es: "Sahih Muslim 5707 — La enfermedad del Profeta; la enfermedad y los enfermos", fr: "Sahih Muslim 5707 — La maladie du Prophète; la maladie et les malades", tr: "Sahih Muslim 5707 — Peygamberin Hastalığı, Hastalık ve Hasta", id: "Sahih Muslim 5707 — Penyakit Nabi, Penyakit dan Pasien" }
text: "… كَانَ رَسُولُ اللَّهِ إِذَا اشْتَكَى مِنَّا إِنْسَانٌ مَسَحَهُ بِيَمِينِهِ ثُمَّ قَالَ \" أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ وَاشْفِ أَنْتَ الشَّافِي لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ شِفَاءً لاَ يُغَادِرُ سَقَمًا \". فَلَمَّا مَرِضَ رَسُولُ اللَّهِ وَثَقُلَ أَخَذْتُ بِيَدِهِ لأَصْنَعَ بِهِ نَحْوَ مَا كَانَ يَصْنَعُ فَانْتَزَعَ يَدَهُ مِنْ يَدِي ثُمَّ قَالَ \" اللَّهُمَّ اغْفِرْ لِي وَاجْعَلْنِي مَعَ الرَّفِيقِ الأَعْلَى …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5707، يذكر مرض النبي، والمرض والمريض، والسقم، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5707 (The Book of Greetings), that mentions the Prophet's illness, illness and the sick, sickness, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5707، جس میں نبی کی بیماری، بیماری اور بیمار، سقم، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5707 (El Libro de los Saludos), menciona la enfermedad del Profeta, la enfermedad y los enfermos, la enfermedad y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5707 (Le Livre des Salutations), mentionne la maladie du Prophète, la maladie et les malades, ainsi que la guérison. Le dictionnaire médical le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5707 numaralı hadis, Peygamberimizin hastalığını, hastalığı ve hastayı, rahatsızlığı ve iyileşmeyi konu edinmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5707, menyebutkan tentang penyakit Nabi, penyakit dan pasiennya, sakit, dan kesembuhan. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
