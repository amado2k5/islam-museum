label: { ar: "موطأ مالك 124 — ما أُحل، ما لا يحل", en: "Muwatta Malik 124 — what was made lawful; what is not lawful", ur: "موطأ مالک 124 — جو حلال کیا گیا، جو حلال نہیں", es: "Muwatta Malik 124 — lo que se ha hecho lícito; lo que no es lícito", fr: "Muwatta Malik 124 — ce qui a été rendu licite; ce qui ne l’est pas", tr: "Muwatta Malik 124 — İzin verilenler ve izin verilmeyenler", id: "Muwatta Malik 124 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ زَيْدِ بْنِ أَسْلَمَ، أَنَّ رَجُلاً، سَأَلَ رَسُولَ اللَّهِ فَقَالَ مَا يَحِلُّ لِي مِنِ امْرَأَتِي وَهِيَ حَائِضٌ فَقَالَ رَسُولُ اللَّهِ \" لِتَشُدَّ عَلَيْهَا إِزَارَهَا ثُمَّ شَأْنَكَ بِأَعْلاَهَا \"."
summary:
  ar: "حديث في موطأ مالك، رقم 124، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 124 (Purity), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 124، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 124 (Pureza), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 124 (Pureté), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Malik'in Muwatta'sında yer alan 124 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 124, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
