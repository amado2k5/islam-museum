text: |-
  فتلت بيلغى النعمان ان لهV
  ١ أى بضم الباءقان قسل
  ما المانع من كسرها مثل ولدان
  قلت فعلات بالكسر جمع فعسل
  مح-ركاسماعى (كا فى حواشى
  الاشمونى قالواسمع منه خرب
  وخربان اه وتقدم فى الصحاح
  شيت وشبتات وك ذلك ولد
  وولدان قاله نصبر
  ٢١٤
  بأب الباء)
  لانه ينذرقدّام الاسد وحكى أبو عبيد سقيته فأبردت له ابرادا أى سقيته باردا ويقال
  بئنال مبردين اذاجاؤا وقدباخ الحرّ واابردان بالتحريكموضع رجد البرحدكسا.
  غليظ ⁦( بعد)⁩ البعد ضد القرب وقد بعد بالضم فهو بعيد أى تبا-دوا بعدهغيره وباعده
  وبعده تسعيدا والبعد بالصريك جمع باعد مثل حادم وخدم قال النابغة ١
  ان له فضلا على الناس فى الادنين والبعد * والبعد أيضا الهلاك تقول منه بعد بالكسرفهو
  باعد واستبعد أى تباعد واستيعده عده بعبداوتقول تنح غيرباعد وغير بعد أيضا أى غه
  صاغروتح غير بعيد أى كن فريباوما أنتم يعيدوما أنت.نايعيديستوى فيه الواحد
  والجع وك ذلك ما أنت منا بيعدوما أنتم مناي دو ييننا بعدة من الارض والقراية قال
  الاعشى ولا تنأمن ذى بعدة ان تقرّبا ويقال أبعد اللّه الأخر ولا يقال للانى منه
  شئ وقولهم كب اللّٰه الابعد افيه أى ألقاه لوجهه والابعد الخائن والبعدان جع بعدممل
  رغيف ورغفان يقال فلان من قربان الامير ومن بعدانه والاباعد خلاف الاقارب وبعد
  قيض قبل وهما اسمان يكونان ظرفين اذا أضيفا وأصلهما الاضافة فتى حذفت المضاف
  اليهلعلم المخاطب بيتهما على الضم ليعلم أنه مبنى اذ كان الضم لا يدخلهما اءوا بالانه-ما
  لا يصلح وقوعه ماموقع الفاعل ولاموقع المبتداولا انخبر وقواه-م رأيته بعيدات بين أى
  بعبدفراق وذللاذا كان الرجل يمسك عن اتيان صاحبه الزمان ثم يأتيه ثم يمسل عنه نحو
  ذلك ثم يأتيه قال. لقيته بعيدات بين وهومن ظروف الزمان التى لا تتمكن وقواه-م
  أما بعد هو فصل الخطاب (ب د لد بالمكان أقام به فهو بالدوالبادة والبلدواحد البلاد
  والبلدان ⁦(١)⁩ والبلادة ضدالز كاء وقد بلدبالضم فهوبل دوتيلد تكلف البلادة وتبلد أى
  تردد متحيرا وبلمد تيليد اضرب بنفسه الارض وأبادلصق بالارض وقال الشاء ريصف حوضا
  ومباد يين-وماة بمهلكة * اوزته بعلاة الخلق عليان
  والمبالدة مثل المبالطة أبوزيدأبلد الرجل اذاكانت دابته بليدة والبلدالار
  واله-ع أبلاد قال ابن الرقاع
  عرف الديارتوهما فاعتادها * من بعد ما شمل اليلى أبلادهه
  وقال القطامى
  ليست تجرّح فزاراظهورهم • وبالنحور كاوم ذات أبلاد
  والبلد أدحىّ النعام يقال هو أذل.ن بيضة البلدأى من يضة النعام التى تتركها والبادة
  الارض يقال هذه بادتنا كمايقال بحر تنا والبلمدة من منازل القمر وهى ستة أنجم من
  القوس تنزاها الشمس فى أقصريوم من السنة والبلدة الصدر بقال فلان واسع البلدة
  أى واسع الصدر قال الشاء رذوالرمة
  أنيخت فألقت بالدة فوق بادة * قليل بها الاصوات إلا بغامها
  يقول بركت الناقة وألقت صدرهاعلى الارض والبلدة والبادة نقاوة مابين الحاجبين
  يقال رجل أبلدأى أبلج بين البادوهو الذى ليس بق-رون والابلدالرجل العظيم الخاق
  والبلندى العريض والميلندى من الجمال الصلب الشديد (بند البند العلم الكبير
  فارى
