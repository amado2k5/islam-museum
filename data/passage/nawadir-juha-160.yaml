label: { ar: "نوادر جحا الكبرى، ص 74 — «ليعلم قدر الشيء»", en: "Nawadir Juha al-Kubra, p. 74 — 'So That He Knows the Value of the Thing'", ur: "نوادر جحا الکبریٰ، ص 74 — «تاکہ وہ چیز کی قدر جانے»", fr: "Nawadir Juha al-Kubra, p. 74 — « Pour qu'il connaisse la valeur de la chose »", es: "Nawadir Juha al-Kubra, p. 74 — «Para que se conozca el valor de la cosa»", tr: "Juha'nın Büyük Fıkraları, s. 74 — “Böylece şeyin değerini bilsin”", id: "Anekdot-Anekdot Hebat Juha, hlm. 74 — “Agar dia mengetahui nilai dari hal itu”" }
text: "… ليعلم قدر الشيء قيل له : إذا طلب منك شخص شيئاً، فلماذا لا تعطيه إيَّاه إلّا في اليوم التالي؟ فأجابهم : أفعل ذلك ليعرف قدر ما أُعطيه. أسف على حماره ولم يحزن على امرأته ماتت امرأتُهُ فلم يَأْسَفْ عليها كثيراً، …"
summary:
  ar: "سُئل جحا لماذا لا يعطي ما يُطلب منه في الحال بل في اليوم التالي، فقال ليعلم الشخص قدر ما يعطيه. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  en: "Asked why he does not give what is asked at once but the next day, Juha says it is so that the person knows the value of what he gives. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  ur: "جحا سے پوچھا گیا کہ وہ مانگی گئی چیز فوراً کیوں نہیں دیتا بلکہ اگلے دن دیتا ہے، تو اس نے کہا کہ تاکہ لینے والا جان لے کہ جو دیا جا رہا ہے اس کی کیا قدر ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  fr: "Interrogé sur le fait qu'il ne donne pas aussitôt ce qu'on lui demande mais le lendemain, Juha dit que c'est pour que la personne connaisse la valeur de ce qu'il donne. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  es: "Preguntado por qué no da de inmediato lo que le piden sino al día siguiente, Juha dice que es para que la persona conozca el valor de lo que da. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  tr: "Juha'ya, kendisinden isteneni neden hemen değil de ertesi gün verdiği soruldu. O da, \"Böylece kişi verdiği şeyin değerini anlasın diye\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 74}"
  id: "Juha ditanya mengapa ia tidak memberikan apa yang diminta darinya segera, melainkan keesokan harinya. Ia menjawab, \"Agar orang tersebut mengetahui nilai dari apa yang ia berikan.\" {cite:juha-nawadir-kubra-djuwaydi p. 74}"
