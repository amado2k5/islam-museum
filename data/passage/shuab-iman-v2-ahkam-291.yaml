text: "… يجب على أحدكم إذا سمع مائتي حديث أن يعمل بخمسا أحاديث وإلا فانظروا أيش يكون هذا عليكم غداً قال البيهقي : وأصله أراد من الأحاديث التي وردت في الترغيب في النوافل وأما الواجبات فيجب العمل بجميعه - أخبرنا أبو عبد …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 291، يرد فيه ذكر الواجب، وما يجب على المكلف، والنافلة والنوافل، والترغيب في العمل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 291, whose wording mentions the obligatory (wajib), what is binding on the person addressed, the supererogatory (nafila), encouragement to an act; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 291 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، نفل اور نوافل، عمل کی ترغیب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
