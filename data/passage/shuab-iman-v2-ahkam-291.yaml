text: "… يجب على أحدكم إذا سمع مائتي حديث أن يعمل بخمسا أحاديث وإلا فانظروا أيش يكون هذا عليكم غداً قال البيهقي : وأصله أراد من الأحاديث التي وردت في الترغيب في النوافل وأما الواجبات فيجب العمل بجميعه - أخبرنا أبو عبد …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 291، يرد فيه ذكر الواجب، وما يجب على المكلف، والنافلة والنوافل، والترغيب في العمل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 291, whose wording mentions the obligatory (wajib), what is binding on the person addressed, the supererogatory (nafila), encouragement to an act; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 291 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، نفل اور نوافل، عمل کی ترغیب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 291, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, le surérogatoire (nafila), l'encouragement à un acte ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 291, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo supererogatorio (nafila), el estímulo a un acto; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 2. cildinin 291. sayfasından, farz ibadetler, sorumlu bir bireyin görevleri, nafile ibadetler ve iyi ameller işlemeye teşvik konularını ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlıdır ve düzenlenmemiştir. Farz ibadetler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh ibadetler, haram ibadetler ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 291, yang membahas tentang amalan wajib, kewajiban seorang individu yang bertanggung jawab, amalan sunnah, dan anjuran untuk melakukan amal kebaikan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
