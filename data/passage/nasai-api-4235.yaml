label: { ar: "سنن النسائي 4235 — ما حُرّم", en: "Sunan al-Nasa'i 4235 — what was made unlawful", ur: "سنن نسائی 4235 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 4235 — lo que se declaró ilícito" }
text: "… أَسْمَعُ، - وَاللَّفْظُ لَهُ - عَنِ ابْنِ الْقَاسِمِ، قَالَ حَدَّثَنِي مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ مَرَّ رَسُولُ اللَّهِ بِشَاةٍ مَيِّتَةٍ كَانَ أَعْطَاهَا مَوْلاَةً لِمَيْمُونَةَ زَوْجِ النَّبِيِّ فَقَالَ \" هَلاَّ انْتَفَعْتُمْ بِجِلْدِهَا \". قَالُوا يَا رَسُولَ اللَّهِ إِنَّهَا مَيْتَةٌ. فَقَالَ رَسُولُ اللَّهِ \" إِنَّمَا حُرِّمَ أَكْلُهَا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4235، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4235 (The Book of al-Fara' and al-'Atirah), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4235، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4235 (El Libro de al-Fara' y al-'Atirah), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
