summary:
  ar: "القسم 17 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحدود عن رسول الله»، ويضم فيها النصوص من 1423 إلى 1463 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 17 of Jami' al-Tirmidhi (The Book on Legal Punishments (Al-Hudud)) in the division of the open hadith dataset the museum took its reports from: reports 1423 to 1463 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 17، عنوان «کتاب الحدود عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1423 تا 1463۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 17 de Jami' al-Tirmidhi (El Libro de los Castigos Legales (Al-Hudud)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1423 al 1463, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
