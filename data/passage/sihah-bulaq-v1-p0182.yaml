text: |-
  افصل الطاء)
  ٤٥٩
  وأسمر من قداح النبع فرع • به علمان من عقب وضرس
  وضرسهم الزمان اشتد عليهم وفاقة ضروس سيئة الخلق تعض حالبها ومنه قواهسم هى يجن
  ضراسها أى بحد ثان تتباجها واذا حكانت كذلك حامت عن ولدها قال بشر
  عطفنالهم عطف الضروس من الملا * بشهباء لايمسى الضراء رقيبها
  والضروس بضم الضاد الحجارة التى طويت بها البئر قال الراجز
  امايزال قائل أبن أبن * دلوك عن حدّالضروس واللبن
  وبئره ضروسة وضريس أى مطوية بالحجارة وأضرسه أمر كذا أقلقه وضرّسته الحروب
  تضريسا أى جرّبتّه وأحكمته والزجل مضرّس وقال أبوعمر والمضرّس الذى جرب الامور
  وتقول أيضاريط مضرس لضرب من الوشى وحرّة مضرّس ومضروصة فيها حجارة كاضراس
  الكلاب عن أبى عبيد وتضارس البناء اذا لم يستو ورجل أخرس أضرس اتباع له والضرس
  بالتحريك كلال فى السنّ من تناول شئ حامض وقد ضرست أسنانه بالكسر ورجل ضرس
  شرس أى صعب الخلق عن اليزيدى ⁦(ضغبس)⁩ الضغبوس والضغاييس صغار القشاءوفى
  لحديث اهدى لرسول اللّٰه صلى اللّٰه عليه وسلم ضغابيس ويشبه الرحل الضعيف به فيقال
  ضغبوس قالحرير
  قد جربت عركى فى كل معترك • غلب الرجال خابال الضغابيس
  واهر أة ضغبة مواعة بجب الضغابيس وقدذ كرفى باب الياء ⁦(ضهس)⁩ ضهس الشى دهسا
  عضه بمقدم فيه
  الصحيفة ويقال هى التى محيت تم كتبت وكذلك الطلس والهع أطراس وطرسوس اسم بلد
  ولا يخفف الافى ضرورة الشعرلات فعلولاليس من أبنيتهم رفس لطرف.ان القطعة
  من الرمل قال ابن مقبل أنيخت فحرت فوق عوج ذوابل ووسدت رأسى طرفسانا منخلا
  ⁦(طرمس )⁩ الطرمساء بالمدالظلمة والطرمسة الانقباض والنكوص والطرموس خسبز
  الملة :( طسس الطس والطسة لغة فى الطست قال حيدين ثور كأن طسابين قنزعاته
  وقال رؤبة
  حق رأتى هامتى كالطس • توقدها الشمس ائتلاق الترس
  والجمع طساس وطسوس وطسات وطسس فى البلادأى ذهب قال الراجز
  *هدى باظعان الكتوم قملس • صرم جنابى بها مطسس
  ⁦( طفس )⁩ طفس البرذون يطقر طفوسا أى مات والطقس بالتحريك الوخ والدرن
  وقد طفس النوب بالكسر طفسا وطفاسة ورجل طفس والطنفسسة واحدة الطنافس
  ( طلس الطلس المهو وقد طلت الكتاب طلافتطلس والاطلس الخلق وكذلك
  الطلس بالكسر والجمع أطلاس يقال رجل أطلس النوب قال ذوالرمة
  مقزع أطلس الاطمار ليس له • الاالضراء والاصيدهانشب
  وذئب أطلس وهو الذى فى لونه غبرة الى السواد وكل ماسكان عسلى لونه فهو أطلسّ
  والطيلسان يفتح اللام واحد الطيالسة والهاء في الهع للعجمة لانه فارسى معرّب والعامة
