text: "المهاجرون الى الحبشة رسول اللّٰه وَالفمِ طرفي النهار. ودخل أبو حذيفة بن عتبة بن ربيعة بجوار أمية. ودخل مصعب بن عمير بجوار النضر بن الحارث بن كَلدة، ويقال بجوار أبي عزيز بن عمير، أخيه. ودخل الزبير بن العوام بجوار زمعة …"
