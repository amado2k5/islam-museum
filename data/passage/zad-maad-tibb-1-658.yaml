text: "… وإن كان مؤذياً، والأدوية الطبيعية إنما نتفعُ، بعد حصول الداء، فالتعوُّذاتُ والأذكار، إما أن تمنعَ وقوعَ هذه الأسباب، وإما أن تحول بينها وبين كمالٍ تأثيرها بحسب كمال التعوذ وقوته وضعفه، فالرُّقى والعُوَذ تُسْتَعمل لحفظ الصحة، ولإزالة المرض، أما الأول: فكما …"
