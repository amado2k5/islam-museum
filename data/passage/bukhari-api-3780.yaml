text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ لَمَّا قَدِمُوا الْمَدِينَةَ آخَى رَسُولُ اللَّهِ بَيْنَ عَبْدِ الرَّحْمَنِ وَسَعْدِ بْنِ الرَّبِيعِ، قَالَ لِعَبْدِ الرَّحْمَنِ إِنِّي أَكْثَرُ الأَنْصَارِ مَالاً فَأَقْسِمُ مَالِي نِصْفَيْنِ، وَلِي امْرَأَتَانِ، فَانْظُرْ أَعْجَبَهُمَا إِلَيْكَ فَسَمِّهَا لِي أُطَلِّقْهَا، فَإِذَا انْقَضَتْ عِدَّتُهَا فَتَزَوَّجْهَا. قَالَ بَارَكَ اللَّهُ لَكَ فِي أَهْلِكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3780، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3780 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3780، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
