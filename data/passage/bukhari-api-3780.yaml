label: { ar: "صحيح البخاري 3780 — الأب والأبوة", en: "Sahih al-Bukhari 3780 — the father and fatherhood", ur: "صحیح بخاری 3780 — باپ اور والدیت", es: "Sahih al-Bukhari 3780 — El padre y la paternidad", fr: "Sahih al-Bukhari 3780 — Le père et la paternité", tr: "Sahih el-Buhari 3780 — Baba ve Babalık", id: "Sahih al-Bukhari 3780 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ لَمَّا قَدِمُوا الْمَدِينَةَ آخَى رَسُولُ اللَّهِ بَيْنَ عَبْدِ الرَّحْمَنِ وَسَعْدِ بْنِ الرَّبِيعِ، قَالَ لِعَبْدِ الرَّحْمَنِ إِنِّي أَكْثَرُ الأَنْصَارِ مَالاً فَأَقْسِمُ مَالِي نِصْفَيْنِ، وَلِي امْرَأَتَانِ، فَانْظُرْ أَعْجَبَهُمَا إِلَيْكَ فَسَمِّهَا لِي أُطَلِّقْهَا، فَإِذَا انْقَضَتْ عِدَّتُهَا فَتَزَوَّجْهَا. قَالَ بَارَكَ اللَّهُ لَكَ فِي أَهْلِكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3780، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3780 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3780، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3780 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3780 (Mérites des Compagnons de Médine (Ansar)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3780 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3780, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
