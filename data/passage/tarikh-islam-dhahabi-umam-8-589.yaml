text: "حرف القاف المسلمون،،،،،،، القبط.،،، قريش،،،،،،،،،،،،،، المشركون.،،،، مُضَر.،، المهاجرون،،. فيس،. القيسية. حرف النون النصارى. حرف الكاف الكوفيون،،،،، حرف الهاء، الهاشميون. حرف الياء حرف الميم المدنيون. اليهود،"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 8، ص 589، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 8, p. 589, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 8، ص 589 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Tarikh al-Islam de al-Dhahabi, volumen 8, pág. 589, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 8, page 589, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 8. cildinin 589. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 8, halaman 589, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
