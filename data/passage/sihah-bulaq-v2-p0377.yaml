  بالمكسر جمع طويل والطوال بالفتح من قوللك لاأ كله طوال الدهر وطول الدهر بمعنى ويقال
  قلانس لطبال وطوال بمعف والرجال الاطاول جمع الاطول والطولى تأنيث الاطول وابهع
  الطول-ثل الكبرى والكبر والطويل جذس من العروض وهى كلمة موادة ويحل أطول
  اذا طالت شفته العليا وطاولنى فطلته يقال ذلك من الطول والطول جيعا ويقال هذا أمر
  لا طائل فيه اذالم يكن فيه عماء وحزية يقسال ذلك فى التذسكير والتأنيث ولم يحل منه
  بطائل لا ينكام به الافى الجد وبينهم طائلة أى عداوة وترة والطول بالفتح المن يقسال منه طال
  عليه وقطوّل عليه اذا امتن عليه وطاولته فى الاهر أى ماطلته وأطلت الشئ وأطولت على
  النقصان والتمام بمعني وأنشدسيبو به
  صددت فأطوات الصدودوقلا • وصال على طول الصدوديدوم
  وأظالت المرأة اذاولدت ولداطوالا وفى الحديث انّ القصيرة قد تطيل وطوّل له تطوّ يلاأى
  أمهله واستطال عليه أى تطاول يقال استطالوا عليهم أى قتلوامنهم أكثريما كانوا
  نتلوا وقد يكون استطال بعنى طال وتطاولت مثل قطائلت والطوّل بالتش ديد طاروطيل
  الرجح نيحتها ⁦( طهل )⁩ ماعلى السما طهلئة أى شئ من غيم وهو فعلئة وهمزنه زائد
  كهمزة الكرفئة والغرقئ همل ، الطهمل الجسيم القبيح الخلقة والمرأة طهملة وقال
  يصبحن عن قس الاذى غوافلا • لاجعبريات ولاطهاملا
  صل الظاء لل الظل" معروف والبمع ظلال والظلال أيضاما أظلك من
  -حاب وتموه وظلّ الليل سواده يقال أتانا فى ظلّ الليل قال ذوالرمة
  قد أءسف النازح المجهول معسفه • فى ظلّ أخضر تدعوهامه اليوم
  وهو استعارة لان الظلّ فى الحقيقة انماهوضو شماع الشهمر دون الشعاع فاذالم يكن ضوء
  فهو ظلمة وليس بظلّ وقولهم ترك الظبى ظاله يضربمثلا لأرجل النفورلات الظي اذا نفو
  من شى لا يعود اليه أبدا وظل" ظليل أى دائم الظلّ" وفلان يعيش فى ظل فلان أى فى كنفه
  والظلة بالضم كهيئة الصفة وقرئ فى ظال على الارائل متكمون والظلة أيضا أوّل سحابة
  تفلسلّ عن أب زيد وعذاب يوم الظلة قالواغيم تحته مهوم والمفلة بالكسر البيت السكبير من
