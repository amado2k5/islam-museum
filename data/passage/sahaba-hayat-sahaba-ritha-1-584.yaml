text: "… خير من مشى وإن كان فيما جاء شيب الذوائب وكن لى شفيعا يوم لا ذو شفاعة سواك بمعن عن سواد بن قارب قال: ففرح رسول اللّٰه : أصحابه بمقالتى فرحا شديدا حتى رثى الفرح فى وجوههم، قال : فوئب اليه …"
