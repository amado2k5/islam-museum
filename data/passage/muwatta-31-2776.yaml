summary:
  ar: "يروي مالك عن عبد الله بن دينار، عن عبد الله بن عمر أن رجلا نادى النبي فسأله عن الضب، فقال: لست بآكله ولا بمحرمه. ويذكر المحقق قول ابن عبد البر أن يحيى بن يحيى رواه هكذا عن مالك، وأن أكثر رواة الموطأ رووه كذلك، وأن رواية ابن بكير عن نافع عن ابن عمر صحيحة عنهما جميعا. {cite:muwatta-maruf-1997 p.560} {cite:muwatta-maruf-1997 p.561}"
