label: { ar: "الموطأ 2776 — رجل يسأل النبي عن الضب: لست بآكله ولا بمحرمه", en: "Muwatta 2776", es: "Muwatta 2776", fr: "Muwatta 2776", ur: "موطا 2776", tr: "El-Muvatta 2776 — Bir adam Peygambere kertenkele hakkında sorar: Ben onu ne yerim ne de yasaklarım.", id: "Al-Muwatta 2776 — Seorang pria bertanya kepada Nabi tentang kadal: Aku tidak memakannya dan juga tidak melarangnya." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار، عن عبد الله بن عمر أن رجلا نادى النبي فسأله عن الضب، فقال: لست بآكله ولا بمحرمه. ويذكر المحقق قول ابن عبد البر أن يحيى بن يحيى رواه هكذا عن مالك، وأن أكثر رواة الموطأ رووه كذلك، وأن رواية ابن بكير عن نافع عن ابن عمر صحيحة عنهما جميعا. {cite:muwatta-maruf-1997 p.560} {cite:muwatta-maruf-1997 p.561}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den rivayet ettiğine göre, bir adam Peygamber'e seslenerek kertenkele hakkında soru sormuş. Peygamber, \"Ne yerim ne de yasaklarım\" diye cevap vermiş. Araştırmacı, İbn Abdül-Barr'ın Yahya ibn Yahya'nın bunu Malik'ten böyle rivayet ettiğini ve Muwatta'nın ravilerinin çoğunun da bu şekilde rivayet ettiğini, İbn Bukayr'ın Nafi'den, o da İbn Ömer'den rivayet ettiği hadisin ise her ikisine göre de sahih olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.560} {cite:muwatta-maruf-1997 s.561}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, yang juga dari Abdullah ibn Umar, bahwa seorang pria memanggil Nabi dan bertanya tentang kadal. Nabi menjawab, \"Aku tidak memakannya dan tidak pula melarangnya.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa Yahya ibn Yahya meriwayatkannya demikian dari Malik, dan bahwa sebagian besar perawi Muwatta meriwayatkannya dengan cara ini, dan bahwa riwayat Ibnu Bukayir dari Nafi' dari Ibnu Umar adalah sahih dari keduanya. {cite:muwatta-maruf-1997 p.560} {cite:muwatta-maruf-1997 p.561}"
