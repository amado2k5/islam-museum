text: "… ثنا سبل بن عبد اللّٰه التسترى قال أخبرنى خالى محمد بن سوار عن جمفر بن سليمان عن ثابت عن أنس قال : كان رسول اللّٰه يغزو ومعه عدة من نساء الانصار يسقين الماء ويداوين الجرحى حدثناه مجمد ابن على أبى …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 9، ص 211، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
