label: { ar: "الموطأ 1277 — أبو ذر بالربذة: أين تريد؟ الحج. هل نزعك غيره؟ لا. فأتنف العمل، فلما قدم مكة رآه الناس ينصفون عليه", en: "Muwatta 1277", es: "Muwatta 1277", fr: "Muwatta 1277", ur: "موطا 1277", tr: "El-Muvatta 1277 — Ebu Zer, El-Rabadha'da: Nereye gitmek istiyorsun? Hac. Başka bir şey seni engelledi mi? Hayır. Böylece ibadeti yerine getirdi ve Mekke'ye vardığında insanlar onu gördüler ve ona adil davrandılar.", id: "Al-Muwatta 1277 — Abu Dharr dalam Al-Rabadha: Ke mana kamu ingin pergi? Haji. Apakah ada hal lain yang menghalangimu? Tidak. Maka dia melaksanakan tugasnya, dan ketika dia tiba di Mekah, orang-orang melihatnya dan bersikap baik kepadanya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان أنه سمعه يذكر أن رجلا مر على أبي ذر بالربذة، فسأله أين يريد، فقال الحج، فقال هل نزعك غيره؟ قال لا، قال فاستأنف العمل. فلما قدم مكة مكث ما شاء الله، ثم رأى الناس مجتمعين على رجل، فإذا هو الشيخ الذي وجده بالربذة، أبو ذر، فلما رآه عرفه وقال هو الذي حدثتك. {cite:muwatta-maruf-1997 p.568}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn Yahya ibn Hibban'dan rivayet ettiğine göre, Ebu Zerr'in Rabadha'da yanından geçen bir adamın ona nereye gittiğini sorduğunu işittiğini anlatır. Ebu Zerr, \"Hac'a gidiyorum\" diye cevap verdi. Adam, \"Başka bir şey seni engelledi mi?\" diye sordu. Ebu Zerr, \"Hayır\" dedi. Adam, \"Öyleyse işine devam et\" dedi. Mekke'ye vardığında, Allah'ın dilediği kadar orada kaldı. Sonra bir adamın etrafında toplanmış insanlar gördü ve bu, Rabadha'da bulduğu aynı yaşlı adam, Ebu Zerr'di. Onu görünce tanıdı ve \"Sana bahsettiğim kişi o\" dedi. {cite:muwatta-maruf-1997 s.568}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Muhammad ibn Yahya ibn Hibban, bahwa ia mendengar seorang pria melewati Abu Dharr di al-Rabadha dan bertanya kepadanya ke mana ia akan pergi. Ia menjawab, \"Ke haji.\" Pria itu bertanya, \"Apakah ada hal lain yang menghalangimu?\" Ia menjawab, \"Tidak.\" Pria itu berkata, \"Kalau begitu lanjutkan pekerjaanmu.\" Ketika ia tiba di Mekah, ia tinggal selama yang dikehendaki Allah. Kemudian ia melihat orang-orang berkumpul di sekitar seorang pria, dan itu adalah orang tua yang sama yang ia temui di al-Rabadha, Abu Dharr. Ketika ia melihatnya, ia mengenalinya dan berkata, \"Dialah orang yang kuceritakan kepadamu.\" {cite:muwatta-maruf-1997 p.568}"
