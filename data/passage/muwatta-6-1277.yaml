label: { ar: "الموطأ 1277 — أبو ذر بالربذة: أين تريد؟ الحج. هل نزعك غيره؟ لا. فأتنف العمل، فلما قدم مكة رآه الناس ينصفون عليه", en: "Muwatta 1277" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان أنه سمعه يذكر أن رجلا مر على أبي ذر بالربذة، فسأله أين يريد، فقال الحج، فقال هل نزعك غيره؟ قال لا، قال فاستأنف العمل. فلما قدم مكة مكث ما شاء الله، ثم رأى الناس مجتمعين على رجل، فإذا هو الشيخ الذي وجده بالربذة، أبو ذر، فلما رآه عرفه وقال هو الذي حدثتك. {cite:muwatta-maruf-1997 p.568}"
