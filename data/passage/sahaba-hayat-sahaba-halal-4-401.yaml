text: "… قال : كنا معخ رسول اللّٰه فى مسير خفق رجل على راحلته فأخذ رجل سهما من كنانته فاتتبه الرجل فقال رسول اللّٰه: لا يحل لرجل ان يروع مسلما. وعند ابى داود عن عبد الرحمن بن ابى ليلى قال: حدثنا اصحاب …"
