  ur: { text: "کیا تم کو معلوم نہیں کہ آسمانوں اور زمین میں خدا ہی کی سلطنت ہے؟ جس کو چاہے عذاب کرے اور جسے چاہے بخش دے اور خدا ہر چیز پر قادر ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
