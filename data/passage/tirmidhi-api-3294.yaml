text: "… : ( وفُرُشٍ مَرْفُوعَةٍ ) قَالَ \" ارْتِفَاعُهَا كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ وَمَسِيرَةُ مَا بَيْنَهُمَا خَمْسُمِائَةِ عَامٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ رِشْدِينَ. وَقَالَ بَعْضُ أَهْلِ الْعِلْمِ وَارْتِفَاعُهَا كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ. قَالَ ارْتِفَاعُ الْفُرُشِ الْمَرْفُوعَةِ فِي الدَّرَجَاتِ وَالدَّرَجَاتُ مَا بَيْنَ كُلِّ دَرَجَتَيْنِ كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3294، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3294 (Chapters on Tafsir), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3294، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
