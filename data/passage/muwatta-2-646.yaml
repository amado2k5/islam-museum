label: { ar: "الموطأ 646 — كل مولود يولد على الفطرة فأبواه يهودانه أو ينصرانه؛ والذي يموت صغيراً: الله أعلم بما كانوا عاملين", en: "Muwatta 646", es: "Muwatta 646", fr: "Muwatta 646", ur: "موطا 646", tr: "El-Muvatta 646 — Her çocuk fıtrat halinde doğar, sonra anne babası onu Yahudi veya Hristiyan yapar; genç yaşta ölenlere gelince, Allah en iyi ne yapacaklarını bilir.", id: "Al-Muwatta 646 — Setiap anak dilahirkan dalam keadaan suci (fitrah), kemudian orang tuanya menjadikannya seorang Yahudi atau seorang Kristen; dan adapun anak yang meninggal di usia muda: Allah Maha Mengetahui apa yang mereka inginkan" }
text: "كل مولود يولد على الفطرة. فأبواه يهودانه أو ينصرانه. كما تناتج الإبل من بهيمة جمعاء، هل تحس فيها من جدعاء؟"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي أخبر أن كل مولود يولد على الفطرة فأبواه يهودانه أو ينصرانه، كما تُنتج الإبل بهيمة سليمة الأعضاء لا تُحس فيها مقطوعة الأذن. فقالوا: يا رسول الله، أرأيت الذي يموت وهو صغير؟ قال: الله أعلم بما كانوا عاملين. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي عند أبي داود (4714)، ويحيل على التمهيد (18/57). {cite:muwatta-maruf-1997 p.329} {cite:muwatta-maruf-1997 p.330}"
  id: "Malik meriwayatkannya dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) bersabda: Setiap anak dilahirkan dalam keadaan fitrah (kecenderungan alamiah), tetapi orang tuanya menjadikannya seorang Yahudi atau Kristen, sebagaimana seekor unta melahirkan anak yang sehat tanpa cacat yang terlihat, meskipun telinganya dipotong. Mereka bertanya: Wahai Rasulullah, bagaimana dengan anak yang meninggal saat masih bayi? Beliau menjawab: Allah Maha Mengetahui apa yang akan mereka lakukan. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan al-Qa'nabi dalam Abu Dawud (4714), dan beliau merujuk pada al-Tamhid (18/57). {cite:muwatta-maruf-1997 p.329} {cite:muwatta-maruf-1997 p.330}"
