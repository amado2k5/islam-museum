label: { ar: "الموطأ 646 — كل مولود يولد على الفطرة فأبواه يهودانه أو ينصرانه؛ والذي يموت صغيراً: الله أعلم بما كانوا عاملين", en: "Muwatta 646" }
text: "كل مولود يولد على الفطرة. فأبواه يهودانه أو ينصرانه. كما تناتج الإبل من بهيمة جمعاء، هل تحس فيها من جدعاء؟"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي أخبر أن كل مولود يولد على الفطرة فأبواه يهودانه أو ينصرانه، كما تُنتج الإبل بهيمة سليمة الأعضاء لا تُحس فيها مقطوعة الأذن. فقالوا: يا رسول الله، أرأيت الذي يموت وهو صغير؟ قال: الله أعلم بما كانوا عاملين. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي عند أبي داود (4714)، ويحيل على التمهيد (18/57). {cite:muwatta-maruf-1997 p.329} {cite:muwatta-maruf-1997 p.330}"
