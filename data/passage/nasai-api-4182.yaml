label: { ar: "سنن النسائي 4182 — الجذام والبرص", en: "Sunan al-Nasa'i 4182 — leprosy and vitiligo", ur: "سنن نسائی 4182 — جذام اور برص", es: "Sunan al-Nasa'i 4182 - lepra y vitíligo", fr: "Sunan al-Nasa'i 4182 — lèpre et vitiligo", tr: "Sunen an-Nesa'i 4182 - Cüzzam ve Vitiligo", id: "Sunan an-Nasa'i 4182 — Penyakit Kusta dan Vitiligo" }
text: "أَخْبَرَنَا زِيَادُ بْنُ أَيُّوبَ، قَالَ حَدَّثَنَا هُشَيْمٌ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ رَجُلٍ، مِنْ آلِ الشَّرِيدِ يُقَالُ لَهُ عَمْرٌو عَنْ أَبِيهِ قَالَ كَانَ فِي وَفْدِ ثَقِيفٍ رَجُلٌ مَجْذُومٌ فَأَرْسَلَ إِلَيْهِ النَّبِيُّ \" ارْجِعْ فَقَدْ بَايَعْتُكَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4182، يذكر الجذام والبرص. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 4182 (The Book of al-Bay'ah), that mentions leprosy and vitiligo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 4182، جس میں جذام اور برص کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4182 (El Libro de al-Bay'ah), menciona la lepra y el vitíligo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4182 (Le Livre d'al-Bay'ah), mentionne la lèpre et le vitiligo. Le Répertoire des ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan-ı Nesai'de yer alan 4182 numaralı hadiste cüzzam ve vitiligodan bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4182, menyebutkan penyakit kusta dan vitiligo. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
