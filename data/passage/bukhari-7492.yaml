label:
  ar: "البخاري 7492 — الصوم لي وأنا أجزي به"
  en: "Bukhari 7492 — Fasting is Mine, and I reward it"
  ur: "بخاری 7492 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "يقول الله عز وجل الصوم لي وأنا أجزي به يدع شهوته وأكله وشربه من أجلي، والصوم جنة، وللصائم فرحتان فرحة حين يفطر وفرحة حين يلقى ربه، ولخلوف فم الصائم أطيب عند الله من ريح المسك ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7492: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7492: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7492: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
