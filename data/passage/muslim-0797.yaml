label: { ar: "مسلم 797 — مثل المؤمن الذي يقرأ القرآن مثل الأترجة", en: "Muslim 797 — The believer who recites the Qur'an is like the citron", es: "Musulmán 797 — El creyente que recita el Corán es como el cidro.", fr: "Muslim 797 — Le croyant qui récite le Coran est comme le citron.", ur: "مسلم 797 - قرآن کی تلاوت کرنے والا مومن لیموں کی طرح ہے۔", tr: "Müslim 797 — Kur'an okuyan bir müminin örneği, limon kabuğu gibidir.", id: "Muslim 797 — Perumpamaan seorang mukmin yang membaca Al-Quran adalah seperti buah jeruk sitrun" }
text: "قال رسول الله: «مثل المؤمن الذي يقرأ القرآن مثل الأترجة؛ ريحها طيب وطعمها طيب، ومثل المؤمن الذي لا يقرأ القرآن مثل التمرة؛ لا ريح لها وطعمها حلو»"
summary:
  ar: "رواية أبي موسى الأشعري في باب فضل قارئ القرآن من كتاب صلاة المسافرين في صحيح مسلم؛ مثل مركب يقابل المؤمن والمنافق بالأترجة والتمرة والريحانة والحنظلة."
  tr: "Sahih Müslim'in yolculuk duaları kitabındaki Kur'an okuyucusunun faziletine dair bölümünde Ebu Musa el-Eş'ari'nin rivayeti, mümin ile münafığı birer limon, hurma, fesleğen ve adaçayı ile karşı karşıya getiren bir gemiye benzetmektedir."
  id: "Riwayat Abu Musa al-Ash’ari dalam bab tentang keutamaan pembaca Al-Qur'an dari kitab doa musafir dalam Sahih Muslim adalah seperti kapal yang memperhadapkan orang beriman dan orang munafik dengan buah jeruk, kurma, kemangi, dan talas."
