label: { ar: "مسلم 797 — مثل المؤمن الذي يقرأ القرآن مثل الأترجة", en: "Muslim 797 — The believer who recites the Qur'an is like the citron" }
text: "قال رسول الله: «مثل المؤمن الذي يقرأ القرآن مثل الأترجة؛ ريحها طيب وطعمها طيب، ومثل المؤمن الذي لا يقرأ القرآن مثل التمرة؛ لا ريح لها وطعمها حلو»"
summary:
  ar: "رواية أبي موسى الأشعري في باب فضل قارئ القرآن من كتاب صلاة المسافرين في صحيح مسلم؛ مثل مركب يقابل المؤمن والمنافق بالأترجة والتمرة والريحانة والحنظلة."
