text: "… مثل حاله من الاجتهاد والزهادة فى الدنيا، فقلت له : إن فلانا أوصى بى إليك أن آتيك وأكون معك. فقال : فأقم عندى. فأقمت عند على مثل أَمْر صاحبه، حتى حضرته الوفاة فقلت : إِنَّ فلانا أَوصى بى إليكَ تم …"
summary:
