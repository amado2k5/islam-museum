text: "… ببركة الرسول ع وطاعته فما أمرهم فتحوا القلوب والأقاليم شرقا وغربا فى المدة اليسيرة، مع قلة عددهم بالنسبة إلى جيوش سائر الأقاليم من الروم والفرس والترك والصقالبة والبربر والحبوش وأصناف السودان والقبط وطوائف بنى آدم. قهروا الجميع حتى علت كلة …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 2، ص 320، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 2, p. 320, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 2، ص 320 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
