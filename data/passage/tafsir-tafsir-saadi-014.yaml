text: "ا الله إن كنتم اتخذوها هزوا ولعبا ذلك بأنهم قوم اتخاذ أهل الكتاب من اليهود والنصارى وقوله: (وهم راكعون) أي : ومن سائر الكفار أولياء يحبونهم م (١) أسرار خاضعون الله ذليلون. فأداة الحصر في ويتولونهم، ويبدون لهم الولاية على"
