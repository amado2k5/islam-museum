label: { ar: "صحيح البخاري 4313 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 4313 — what was made lawful; what is not lawful", ur: "صحیح بخاری 4313 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 4313 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih al-Bukhari 4313 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih el-Buhari 4313 — Neler caizdir, neler caiz değildir", id: "Sahih al-Bukhari 4313 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… ابْنِ جُرَيْجٍ، قَالَ أَخْبَرَنِي حَسَنُ بْنُ مُسْلِمٍ، عَنْ مُجَاهِدٍ، أَنَّ رَسُولَ اللَّهِ قَامَ يَوْمَ الْفَتْحِ فَقَالَ \" إِنَّ اللَّهَ حَرَّمَ مَكَّةَ يَوْمَ خَلَقَ السَّمَوَاتِ وَالأَرْضَ، فَهْىَ حَرَامٌ بِحَرَامِ اللَّهِ إِلَى يَوْمِ الْقِيَامَةِ، لَمْ تَحِلَّ لأَحَدٍ قَبْلِي، وَلاَ تَحِلُّ لأَحَدٍ بَعْدِي، وَلَمْ تَحْلِلْ لِي إِلاَّ سَاعَةً مِنَ الدَّهْرِ، لاَ يُنَفَّرُ صَيْدُهَا، وَلاَ يُعْضَدُ شَوْكُهَا، وَلاَ يُخْتَلَى …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4313، يذكر ما أُحل، وما لا يحل، والحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4313 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions what was made lawful, what is not lawful, the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4313، جس میں جو حلال کیا گیا، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4313 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona lo que se hizo lícito, lo que no lo es, lo ilícito y lo que se hizo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4313 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne ce qui a été rendu licite, ce qui ne l'est pas, ce qui est illicite et ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 4313 numaralı hadis, helal, haram, yasak ve haram olan şeyleri sıralamaktadır. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4313, menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dilarang, dan diharamkan. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
