label: { ar: "الموطأ 304 — الأعرج: كانوا يلعنون الكفرة في رمضان ويقرأ القارئ البقرة في ثمان", en: "Muwatta 304", es: "Muwatta 304", fr: "Muwatta 304", ur: "موطا 304", tr: "Al-Muwatta 304 — Al-A'raj: Ramazan ayında kâfirlere lanet okurlardı ve okuyucu sekiz günde Bakara Suresi'ni okurdu.", id: "Al-Muwatta 304 — Al-A`raj: Mereka biasa mengutuk orang-orang kafir selama Ramadan, dan pembacanya membaca Surah Al-Baqarah dalam delapan [hari]." }
summary:
  ar: "أثر يرويه مالك عن داود بن الحصين أنه سمع الأعرج يقول، في باب ما جاء في قيام رمضان: ما أدرك الناس إلا وهم يدعون على الكفرة في قنوت رمضان، وكان القارئ يقرأ سورة البقرة في ثمان ركعات، فإذا قام بها في اثنتي عشرة ركعة رأى الناس أنه قد خفف. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق. {cite:muwatta-maruf-1997 p.172}"
  tr: "Malik'in, Ramazan gecesi namazları hakkında rivayet edilenler bölümünde, Davud ibn Hüseyin'den rivayet ettiği bir hadiste, el-A'raj'ın şöyle dediğini aktarır: \"İnsanlar Ramazan ayında Kunut duasında kâfirlere karşı dua etmekten başka bir şey görmemişlerdir. Okuyucu Bakara Suresi'ni sekiz rekatta okurdu, fakat on iki rekatta okursa, insanlar onu kısaltmış sayarlardı.\" Araştırmacı, bu hadisi Ebu Musab ve Abdülrazzak'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.172}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Dawud ibn al-Husayn, yang mendengar al-A'raj berkata, dalam bab tentang apa yang telah diriwayatkan mengenai shalat malam Ramadhan: \"Orang-orang tidak pernah mengalami hal lain selain berdoa melawan orang-orang kafir dalam doa Qunut selama Ramadhan. Pembaca akan membaca Surah al-Baqarah dalam delapan rakaat, tetapi jika ia melakukannya dalam dua belas rakaat, orang-orang akan menganggap bahwa ia telah mempersingkatnya.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Abd al-Razzaq meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.172}"
