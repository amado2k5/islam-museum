label: { ar: "الموطأ 304 — الأعرج: كانوا يلعنون الكفرة في رمضان ويقرأ القارئ البقرة في ثمان", en: "Muwatta 304" }
summary:
  ar: "أثر يرويه مالك عن داود بن الحصين أنه سمع الأعرج يقول، في باب ما جاء في قيام رمضان: ما أدرك الناس إلا وهم يدعون على الكفرة في قنوت رمضان، وكان القارئ يقرأ سورة البقرة في ثمان ركعات، فإذا قام بها في اثنتي عشرة ركعة رأى الناس أنه قد خفف. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق. {cite:muwatta-maruf-1997 p.172}"
