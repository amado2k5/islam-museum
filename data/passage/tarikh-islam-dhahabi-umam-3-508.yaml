text: "… حرب مُطَوَّلاً. وانظر الطبقات الكبرى لابن سعد ومسند أحمد، المغازي لعروة،، فتح الباري لابن حجر. صحيح البخاري : كتاب الجهاد والسير ؛ باب دعوة اليهوديّ والنّصراني... وما كتب النّبيّ لِ إلى كِسْرى وقَيْصر.. أنظر الطبقات الكبرى لابن سعد، وقد أخرجه …"
