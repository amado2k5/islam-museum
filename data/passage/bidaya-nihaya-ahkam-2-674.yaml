text: "… الفرائض التى افترضت على الأنبياء والرسل حتى يأتوفى يوم القامة وزووم مثل نور الابياء. الى أن قال : يا داود إف فضلت محداً وأمته على الامم كلها. والسلم بله موجود فى كتب أهل الكتاب مسلام من الدبن ضرورة وقد دل …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 2، ص 674، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، وما فُرض على الناس؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 2, p. 674, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, what was made obligatory on people; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 2، ص 674 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Bidaya wa-l-Nihaya de Ibn Kathir, volume numérisé 2, p. 674, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen digitalizado 2, p. 674, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 2. cildinin 674. sayfasından, farz olan görevleri, Allah ve Resulü'nün emrettiklerini ve insanlardan istenenleri anlatan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Permulaan dan Akhir), Jilid 2, halaman 674, yang menyebutkan kewajiban-kewajiban dan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, serta apa yang dituntut dari manusia. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk kewajiban-kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
