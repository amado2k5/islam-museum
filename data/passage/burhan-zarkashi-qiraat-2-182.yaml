text: "… شيء واحد، لأنه قد جاء هذا الحديث بلفظ رسول اللٰه وَلِقِ على تأليف القرآن، وفيه أيضًا دليل على أن سورة الأنفال سورة على حدة، وليست من براءة. قال أبو الحسين أحمد بن فارس في كتاب المسائل الخمس جمع القرآن على …"
