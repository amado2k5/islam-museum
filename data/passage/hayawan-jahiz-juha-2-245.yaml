text: "… موضع؛ لم يحدده ياقوت، معجم البلدان ؛ وفيه استشهد برجز الأعشى. الرجز بلا نسبة في نوادر أبي زيد، والأول والثاني في اللسان قبل، والرابع والخامس في ديوان النابغة الجعدي، والبخلاء، واللسان والتاج قبل، والتهذيب، وبلا - عادة الجعل ببيتُ في …"
summary:
  ar: "مقطع من كتاب الحيوان، المجلد المصوَّر 2، ص 245، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Kitab al-Hayawan, scan volume 2, p. 245, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "کتاب الحیوان، اسکین جلد 2، ص 245 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Hayawan, volume numérisé 2, p. 245, avec une anecdote ou un trait d'esprit ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Kitab al-Hayawan, volumen escaneado 2, p. 245, con una anécdota o agudeza; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hayvanlar Kitabı, Resimli Cilt 2, sayfa 245'ten, esprili bir anekdot veya fıkra içeren bir alıntı; makineyle okunabilir resimli baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Kitab Hewan, Jilid 2 Bergambar, halaman 245, berisi anekdot atau lelucon yang jenaka; dari edisi bergambar yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
