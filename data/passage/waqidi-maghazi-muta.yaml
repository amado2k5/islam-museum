label: { ar: "غزوة مؤتة — استشهاد زيد وجعفر وابن رواحة", en: "Battle of Mu'ta — the martyrdom of Zayd, Ja'far and Ibn Rawaha", es: "Batalla de Mu'ta: el martirio de Zayd, Ja'far e Ibn Rawaha", fr: "Bataille de Mu'ta — le martyre de Zayd, Ja'far et Ibn Rawaha", ur: "جنگ موطا - زید، جعفر اور ابن رواحہ کی شہادت", tr: "Mu'te Muharebesi — Zeyd, Cafer ve İbn Ravaha'nın Şehit Edilmesi", id: "Perang Mu'tah — Kemartiran Zaid, Ja'far, dan Ibn Rawahah" }
text: "فدخل على ابنته فاطمة وهي تقول: وا عماه! فقال: على مثل جعفر فلتبك الباكية"
summary:
  ar: "في غزوة مؤتة استشهد القادة الثلاثة على الترتيب: زيد بن حارثة ثم جعفر بن أبي طالب ثم عبد الله بن رواحة. ويروي الواقدي أن رسول الله لما جاءه خبر موت جعفر دخل على ابنته فاطمة وهي تقول «وا عماه»، فقال: على مثل جعفر فلتبك الباكية، ثم قال: اصنعوا لآل جعفر طعاما فقد شغلوا عن أنفسهم اليوم. وتذكر أسماء بنت عميس أنها كانت فيمن قال النبي لها «بنى الله لك بزوج خير منه»."
  en: "At Mu'ta the three commanders fell in succession — Zayd ibn Haritha, then Ja'far ibn Abi Talib, then Abd Allah ibn Rawaha. Waqidi reports the Prophet entering his daughter Fatima's house as she cried 'wa 'ammah', answering 'like Ja'far — let the weeper weep' and ordering food made for the family of Ja'far; Asma' bint Umays narrates the Prophet's words to her that God would give her a better husband."
  es: "En Mu'ta cayeron sucesivamente los tres comandantes: Zayd ibn Haritha, luego Ja'far ibn Abi Talib y después Abd Allah ibn Rawaha. Waqidi relata que el Profeta entró en la casa de su hija Fátima mientras ella lloraba 'wa 'ammah', respondiendo 'como Ja'far, que el que llora siga llorando' y ordenando que se preparara comida para la familia de Ja'far; Asma' bint Umays narra las palabras del Profeta a ella, diciéndole que Dios le daría un mejor esposo."
  fr: "À Mu'ta, les trois commandants tombèrent successivement: Zayd ibn Haritha, puis Ja'far ibn Abi Talib, et enfin Abd Allah ibn Rawaha. Waqidi rapporte que le Prophète entra chez sa fille Fatima alors qu'elle pleurait « Wa 'ammah », et lui répondit: « Comme Ja'far, laisse celui qui pleure pleurer », en ordonnant qu'on prépare un repas pour la famille de Ja'far. Asma' bint Umays rapporte les paroles du Prophète à Fatima, lui assurant que Dieu lui donnerait un meilleur époux."
  ur: "موتہ میں تینوں سردار یکے بعد دیگرے گرے، زید بن حارثہ، پھر جعفر بن ابی طالب، پھر عبداللہ بن رواحہ۔ واقدی نے بیان کیا ہے کہ نبی اپنی بیٹی فاطمہ کے گھر میں داخل ہوئے جب وہ 'و'اممہ' پکار رہی تھیں، 'جعفر کی طرح - رونے والے کو رونے دو' اور جعفر کے خاندان کے لیے کھانے کا آرڈر دیتے ہوئے جواب دیا؛ اسماء بنت عمیس ا ان سے رسول اللہ کا یہ قول بیان کرتی ہیں کہ اللہ تعالیٰ انہیں بہتر شوہر عطا فرمائے گا۔"
  tr: "Mu'te Muharebesi'nde üç komutan şu sırayla şehit edildi: Zeyd ibn Harise, sonra Cafer ibn Ebu Talib, sonra Abdullah ibn Ravaha. El-Vakidi rivayet eder ki, Allah Resulü Cafer'in ölüm haberini aldığında, \"Ey amcam!\" diye ağlayan kızı Fatıma'nın yanına gitti. Peygamberimiz, \"Ağlayanlar Cafer gibiler için ağlasınlar\" dedi. Sonra da, \"Cafer'in ailesi için yemek hazırlayın, çünkü bugün meşguller\" dedi. Esma bint Ümeys, Peygamberimizin kendisine, \"Allah sana ondan daha hayırlı bir eş nasip etsin\" dediği kişiler arasında olduğunu belirtti."
  id: "Dalam Perang Mu'tah, tiga komandan gugur sebagai syuhada dalam urutan berikut: Zayd ibn Harithah, kemudian Ja'far ibn Abi Talib, kemudian Abdullah ibn Rawahah. Al-Waqidi meriwayatkan bahwa ketika Rasulullah menerima kabar kematian Ja'far, beliau pergi menemui putrinya, Fatimah, yang sedang menangis, \"Wahai pamanku!\" Beliau berkata, \"Biarlah mereka yang menangis, menangis untuk orang seperti Ja'far.\" Kemudian beliau berkata, \"Siapkan makanan untuk keluarga Ja'far, karena mereka sedang sibuk hari ini.\" Asma' bint Umays menyebutkan bahwa dia termasuk di antara orang-orang yang kepadanya Nabi berkata, \"Semoga Allah memberimu suami yang lebih baik darinya.\""
