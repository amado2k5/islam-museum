text: "وقتادة وسعيد بن جبير والربيع بن أنس، والزهري، حكاه الرماني في كتابه عنهم. وحكى عن الشافعي أنهم يخرجون من بلد إلى بلد ويطلبون لتقام عليهم الحدود، وبه قال الليث بن سعد. وروي عن مالك أنه ينفى من البلد الذي أحدث"
