label:
  ar: "البخاري 5653 — من ابتليته بحبيبتيه فصبر عوضته الجنة"
  en: "Bukhari 5653 — Whoever I try with the loss of his eyes and is patient, I give him Paradise"
  ur: "بخاری 5653 — جس کی دونوں آنکھیں لے کر میں آزماؤں اور وہ صبر کرے، اسے جنت دیتا ہوں"
text: "إن الله قال إذا ابتليت عبدي بحبيبتيه فصبر عوضته منهما الجنة . يريد عينيه. تابعه أشعث بن جابر وأبو ظلال عن أنس عن النبي."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 5653: من ابتليته بحبيبتيه فصبر عوضته الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 5653: Whoever I try with the loss of his eyes and is patient, I give him Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 5653: جس کی دونوں آنکھیں لے کر میں آزماؤں اور وہ صبر کرے، اسے جنت دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
