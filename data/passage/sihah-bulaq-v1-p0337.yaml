text: |-
  ١ بق برواية أخرى فى ثراه
  ٣٠٤
  ⁦(باب الرا٠)⁩
  المحاذرة وقولهم انه لابن أحذارأى لابن حزم وحذر وحذار مثل قطام بمعن احذر
  وقال الشاءر حذارمن أرماحما حذار والمحذورة الفزع بعينه وقرئ وانا لهيع حاذرون
  وحذرون وحذرون أيضابضم الذال حكاه الاخفس ومعنى حاذرون متأهبون ومعنى
  -ذرون خائفون والحذرية على فعلية قطعة من الارض غليظة والجمع الحذارى وأسمى
  احدى حرتى بنى سليم الحذرية ونفس الديك حذريته أى عفريته ورجل حذريان شديذ
  الفزع والحذر وأبو محذورة أوس بن معير مؤذن رسول اللّٰه على اللّٰه عليه وسلم ⁦(حذفر)⁩
  حذا ذير الشئ أعاليه ونواحيه يقال أعطاه الدنيا بحذافيرها أى بأسرها الواحدحذ فار
  ⁦(حرر)⁩. الحرضد البرد والحرارة ضدّ البرودة والحرة أرض ذات حجارة سود نخرة كانها
  آحرقت بالناروالجمع الحرار والحرّات وربعاجع بالواووالذون فقيل حرّون كما قالوا أرضون
  وأحرّون أيضا كانه جمع أحرّة قال الراجز
  ⁦(زيد بن عتاهية التيمى)⁩
  لاخس الاجندل الاحرّين * والخس قد جشمتك الامرين
  ونهشل بن حرى وبعبر حرة يرعى فى الحرّة والحرّة بالكسر العطس ومنه قواهم أشد العماش
  حرّة على قرّة اذاعطش في يوم باردويقسال انما كسروا الحرة لمكان القرة والحرّان العطشان
  والانثى حرّى مثل عطشى والحرار العطاش وحرّان بلدبالجزيرة بقال ان حرّان بنناها
  هاران بن لوط وبهاسميت فعلى هذا الاسم معرب وليس بعربى محض هذا ان كان فعلان فهو
  من ه_ذا الباب وان كان فعالافهومن باب الذون والحربالضم خلاف العبد وحرّ الرمل
  وحرّالداروسطهاوحّ الوجه مادامن الوجنة بقال اطمه على حوجهه والحزان الأرّ
  وأبجة وهما أخوان وأنشد الاصمعى للمتنخل
  ألامن مبلغ الحرين عني • مغلفلة وخص بها أبيا
  والحرّفرخ المامة وولد الغابية وولدالحية أيضاقال العارمّاح ⁦(يصف صائدا)⁩
  منطوفى جوف ناموسه * كانطوا• الحربين السلام
  وساقى حرّذكر القمارى وأرار البقول مايؤكل غير مطبوخ ويقال أيضا ماهذامنك
  بحرّأى بحسن ولا جميل قال طرفة
  لا يكن حبك دا قاتلا • ليس هذا منك ماوى بجر
  والحزة السكريمة يقال نافة حرّة وسحابة حزة أى كثيرة المطرقال عنترة
  جادت عليها كل بكرسرة•فتركن كل قرارة كالدرهم
  والحرّة خلاف الامة وحرّة الذفرى موضع مجال القرط منها وطين حرّلارمل فيه ورملة
  حرّة أى لاطاين فيها والجمع حرائر وقواهم بانت فلانة بليسلة حرّة اذا لم يقسدر بعلها
  على اقتضاضها قال النابغة
  شمس موانع كل ليلة حرّة *يخلفن ظنّ الفاحس المغيار
  فان اقتضها فهى بليلة شيباء والحريرة واحدة الحرير من الشياب والحريرة دقيق يطبخ بلبن
  والحرير الحرو رالذى تداخلته حرارة الغيظ وغيره قال الشاعر ا فرزدق
  والحري
