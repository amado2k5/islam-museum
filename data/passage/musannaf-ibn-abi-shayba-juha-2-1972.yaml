text: "… بينهن بسلام. - حدثنا هُشَيم عن العوّام قال: حدثنا عن إبراهيم التّيْمي قال: كانوا يكرهون أن يُشبهّوا الوتر بالمغرب. - حدثنا هُشَيم عن مُغيرة عن إبراهيم قال: كانوا يوترون بإحدى عشرة وبتسع وبسبع وبخمس، وكان يقال: لا وتر بأقل من …"
summary:
  ar: "مقطع من المصنف — ابن أبي شيبة، المجلد المصوَّر 2، ص 1972، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Musannaf — Ibn Abi Shayba, scan volume 2, p. 1972, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "المصنف ابن ابی شیبہ، اسکین جلد 2، ص 1972 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Musannaf — Ibn Abi Shayba, volume numérisé 2, p. 1972, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Musannaf - Ibn Abi Shayba, volumen escaneado 2, p. 1972, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "İbn Abi Şeybe'nin resimli cilt 2, s. 1972'deki eserinden, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari karya Ibn Abi Shaybah, jilid bergambar 2, hlm. 1972, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Islamic Folklore Browser."
