text: |-
  ١٥٧
  دحانا فتعجيج والعجاج بن رؤية السعدى الراجز من سعد تيم سمى بذلك لقوله
  -تى يعبج تخنا من عجعجا ويقال أشعر الناس العجاجان أى رؤية وأيوه ١ ونهرتجاج
  لمائه صوت وفحل عجاج فى هديره أى صياح وقد يبي ذلت فى كل ذى صوت من قوس وريح
  والعجعجة فى قضاعة يحوّلون الياء جيما مع العينية ولون هذاراعج خرح معيج أى هذاراعى
  خرج سعى وحكى اللحيانى رخل عمعإج أى صماح وطريق عاج أى طريق ممتلئ وعاج ب؟..
  لجيم مخفف زجر للفاقة وقد عجعحت بها وفلان ياف عماحته على بنى فلان أى يغير عليهم وقال
  ا شنفرى وانى لاهوى أن ألف عجاجتى على ذى كسا.-ن سلامان أوبرد
  أى أكسح غنيهم ذا البردوفقيرهم ذا الكساء ⁦(عذلج)⁩ عذلج فلان ولده أى أحسن
  غذاءه والعذلج المتلى قال أبو ؤيب يصف ميادا
  له من كسبهنّ معذلجات * قعائدقد ملان من الوشيق
  ⁦( عرج)⁩ عرج فى الدرجة والسلم يعرج عروجا اذاارتز وعرج أيضا اذا أصابه شى فى رجله
  فجمع ومشى مشنيه العرجان وليس بخلقسة فاذا كان ذلك خلقة قلت عرج بالكسرفهو
  أعرج بين العرج من قوم عرج وعرجان وأعرجه اللّه وما أشدّعرجه ولا تقل ما أعرجملان
  ماكان لونا أوخلقة فى الحسد لا يقال منه ما أفعلد الامع أشد والعرجان بالتحريك مشبة
  الاعرج وأمرعرحج اذالم يبرم وعرّج البناء تعريجا أى مباه فتعرّج والتعريج على الشئ
  الاقامة عليه يقال عرج فلان على المنزل اذاحبس مطيته عليه وأقام وكذلك التهرّج تقول
  مالى عليه عرحة ولاعر حة ولا تعريج ولا تعرّج وانعرج الشئ أى انعطف ومنعرج الوادى
  فعطفه يمنة ويسرة والمعراج السلم ومنه ابلة المعراج والجع معارج ومعاريج مثل مفاتح
  ومفاتيح قال الاخفشر ان شئت جعات الواحدمعرج ومع-رج مثل مرقاة ومرقاة
  والمعارج المصاعد والعرج غيبوبة الشمس ويقال انعراجهانح والمغرب وأنشد أبوعمر و
  حتى اذا ما الشمر ه.ت بعرج
  والعرجاء الضبع وقال الاصعى العريجا فى الورد
  أن ترد الابل يومانصف النهارويو ما غدوة والعرج منزل بطريق مكة واليه ينسب العر:بى
  لشاعر وهر عبدد اللّٰه بن عمروبر عنمان بن عفان والعرج أيضا القطيع من الابل نحو من
  لثمانين وقال أبو عبيدة مائة وخسون وفويق ذلك وقال الاصمعى خسمائة الى الالف
  والعرج بالصكسر مشله والجمع أعراج وقد أعر جنك أى وهبتك عرجامن الابل
  والعرتجيج اسم جبرين سبأ ⁦(عرفج)⁩ العرفج شجر ينبت فى السهل الواحدة عرفجة ومنه
  سمى الرجل ⁦(عسج)⁩ العسج مدّ العنق فى المشى قال ذوالرمة يصف ناقته
  والعيس من عاسج أو واسج خببا * ينحزن من جانبيها وهى تذسلب
  يقول الابل مسرعات يضر بن بالارجسل فى سيرهنّ ولا يلحة ن ناقتى وبعير معساج والعومج
  ضرب من الشوك الواحدةء وسجة ومنه سمى الرجل ⁦( سلج)⁩ العسلج بالضم والعسلوج
  مالان واخضر من قضبان الشجر والكرم أول ما ينبت وقد عسلجت الشجرة أخرجت
  مساليجها ( فج الأعفاج من الناس ومن الحافر والسباغ كاه امايصير الطعام
  اليه بعد المعدة وهو مث المصارين لذوات الخف والظلف التى تؤدى اليها السكرش مادفعته
  ١ هو مشكل مع النسخ التى
  فيها العجاج بن رؤية واغمايوافق
  بعض النسخ التى فيها العجاج أيو
  رؤبة اه وانقولى وكأنه لا يعلم
  ان العجاج بيزرؤ بتين أب وابن
  ففى القاموس ورؤية بن العجاج
  ابن رؤبة اه فكل من
  الذسختين صحيح ولا أشكال ام
  فالهنصر
