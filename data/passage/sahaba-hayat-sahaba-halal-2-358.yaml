text: "… امور الاسلام - فصدّقناه، وآمنّا به وأتبعناه على ما جاء به، فعبدنا اللّٰه وحدد لا نشرك به شيئا، وحرّمنا ما حرم اللّٰه علينا، و أحللنا ما أحلَّ لنا فقدا علينا قومنا فعذبونا وقتنونا عن ديننا ليردّونا الى عبادة الأوثان من …"
