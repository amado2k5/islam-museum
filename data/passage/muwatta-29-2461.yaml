label: { ar: "الموطأ 2461 — مالك: لا تقبل الدية من أهل القرى إبلا ولا من أهل البادية ذهبا وورقا", en: "Muwatta 2461", es: "Muwatta 2461", fr: "Muwatta 2461", ur: "موطا 2461", tr: "Al-Muwatta 2461 — Malik: Köylülerden deve şeklinde kan parası kabul edilmez, Bedevilerden de altın veya gümüş şeklinde kan parası kabul edilmez.", id: "Al-Muwatta 2461 — Malik: Uang darah tidak diterima dari penduduk desa dalam bentuk unta, juga tidak dari suku Badui dalam bentuk emas atau perak." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أنه لا يُقبل من أهل القرى في الدية الإبل، ولا من أهل العمود ⁦(البادية)⁩ الذهب ولا الورق، ولا من أهل الذهب الورق، ولا من أهل الورق الذهب. {cite:muwatta-maruf-1997 p.418}"
  tr: "Malik şöyle dedi: Aramızdaki görüş birliği şudur ki, ne köylülerden deve ne de gümüş kan parası olarak kabul edilmez; ne göçebelerden altın ne de gümüş; ne altın sahibi olanlardan gümüş; ne de gümüş sahibi olanlardan altın. {cite:muwatta-maruf-1997 s.418}"
  id: "Malik berkata: Konsensus di antara kami adalah bahwa unta maupun perak tidak diterima sebagai uang tebusan dari penduduk desa, demikian pula emas atau perak dari kaum nomaden, perak dari mereka yang memiliki emas, dan emas dari mereka yang memiliki perak. {cite:muwatta-maruf-1997 p.418}"
