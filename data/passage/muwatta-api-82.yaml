label: { ar: "موطأ مالك 82 — الأب والأبوة", en: "Muwatta Malik 82 — the father and fatherhood", ur: "موطأ مالک 82 — باپ اور والدیت", es: "Muwatta Malik 82 — el padre y la paternidad" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّ الْمِسْوَرَ بْنَ مَخْرَمَةَ، أَخْبَرَهُ أَنَّهُ، دَخَلَ عَلَى عُمَرَ بْنِ الْخَطَّابِ مِنَ اللَّيْلَةِ الَّتِي طُعِنَ فِيهَا فَأَيْقَظَ عُمَرَ لِصَلاَةِ الصُّبْحِ فَقَالَ عُمَرُ نَعَمْ وَلاَ حَظَّ فِي الإِسْلاَمِ لِمَنْ تَرَكَ الصَّلاَةَ. فَصَلَّى عُمَرُ وَجُرْحُهُ يَثْعَبُ دَمًا."
summary:
  ar: "حديث في موطأ مالك، رقم 82، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 82 (Purity), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 82، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 82 (Pureza), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
