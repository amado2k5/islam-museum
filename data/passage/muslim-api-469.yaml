label: { ar: "صحيح مسلم 469 — ضحك وتبسم", en: "Sahih Muslim 469 — laughter and smiling", ur: "صحیح مسلم 469 — ہنسی اور تبسم", fr: "Sahih Muslim 469 — rire et sourire", es: "Sahih Muslim 469 — risa y sonrisa" }
text: "… الأُمَمُ بِأَوْثَانِهَا وَمَا كَانَتْ تَعْبُدُ الأَوَّلُ فَالأَوَّلُ ثُمَّ يَأْتِينَا رَبُّنَا بَعْدَ ذَلِكَ فَيَقُولُ مَنْ تَنْظُرُونَ فَيَقُولُونَ نَنْظُرُ رَبَّنَا. فَيَقُولُ أَنَا رَبُّكُمْ. فَيَقُولُونَ حَتَّى نَنْظُرَ إِلَيْكَ. فَيَتَجَلَّى لَهُمْ يَضْحَكُ - قَالَ - فَيَنْطَلِقُ بِهِمْ وَيَتَّبِعُونَهُ وَيُعْطَى كُلُّ إِنْسَانٍ مِنْهُمْ - مُنَافِقٍ أَوْ مُؤْمِنٍ - نُورًا ثُمَّ يَتَّبِعُونَهُ وَعَلَى جِسْرِ جَهَنَّمَ كَلاَلِيبُ وَحَسَكٌ تَأْخُذُ مَنْ شَاءَ اللَّهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 469، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih Muslim, no. 469, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح مسلم کی حدیث نمبر 469، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih Muslim, n° 469, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih Muslim, n.º 469, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
