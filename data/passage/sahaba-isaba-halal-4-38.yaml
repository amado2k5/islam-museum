  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 4, p. 38, that mentions the lawful, what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
