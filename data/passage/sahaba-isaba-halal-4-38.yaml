text: "… إذا كان يوم القيامة أتى بالوالى فرقف على بشر بن عاصم جسر جهنم إذا كنتم ثلاثة فأمروا أحدكم، وتوكلوا على مرئد بن عامر التغلبى الله وتوجهوا إذا لم تحلوا حراما، ولم تحرموا حلالا سليم بن أكيمة، محمد، ابن عبد الله …"
summary:
