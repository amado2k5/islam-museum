text: |-
  .* ⁦(باب الميم)⁩
  .⁦(قدم)⁩.. .
  ٣٢٣
  من غيرروية والقسمة بالضم المهلكة وقحم الطريق مصاعبه وللخصومة قحم أى انها تقعم
  بصاحبها على مالايريده والقحمة السنة الشديدة بقال أصابت الاعراب القحمة اذا أصابهم
  قحط فدخلوا بلاد الريف ويقال أيضا أقحم أهسل البادية ءلى مالم يسم فاعله اذا أجديوا
  فد خلوا الريف وأتحم فرسه النهرفانقهم واقتهم النهر أيضادخله وفى الحديث أتحم يا ابن
  سيف اللّه وقم الفرس فارسه تقهيه اعلى وجهه اذارماه وقحم فى الصف أى دخل وتقهيم
  النفس فى الشيء ادخالها فيه من غيرروية واقتصمته عين ازدرته وقد يكون الذى تقحمه
  عينك فترفعه فوق سنه لعظمه وحسنه نحو أن يكون ابن لبون فتظنه حقا أوجذعا والمقعم
  بفتح الحاء البعير الذى يربع ويننى فى سنة واحدة فيقهم سناعلى -ن قال الاصمعى وذلك
  لا يكون الالابن الهرمين والمقسام الفدل الذى يقتهم الشول من غير ارسال فيها قدم
  قدم من سفره قد وما ومقدما بفتح الدال يقال وردت مقدم الحاج تجعله ظرفا وهو مصدر
  أى وقت مقدم الجاج وقدم بالفتح يقدم قدما أى تقدّم قال اللّٰه تعالى يقدم قومه يوم القيامة
  فأوردهم النار وقدم الشى بالفم قسدمافهو قديم وتقادم من-له وأقدم على الامر اقداما
  والاقدام الشعاعة ويقال أقدم وهوزجر للفرس كانه يؤمر بالاقدام وفى حديث المغازى
  اقدم حيزوم بالسكسر والصواب فتح الههزة وأقدمه أيضا وقدمه بمعنى قال ابيد
  فضى وقدّمها وكانت عادة • منها اذاهى عرّدت اقدامها
  أى تقدمها وقدم بين يديه أى تقدم قال تعالى لا تقدّموا بين يدى اللّٰه ورسوله والقدم خلاف
  الحدوث ويقال قدما كان كذا وكذا وه واسم من القدم جعل اسمامن أسماء الزمان ومضى
  قدمابضم الدال لم يعرّج ولم ينثن وقال يصف احرأة فاجرة
  قضى اذا رجرت عن سوأة قدما • كانهاهدم فى الجفر منقاض
  والقدم واحد الاقدام والقدم أيضا السابقة فى الامر يقال لفلان قدم صدق أى أثرة حسنة
  قال الاخفش هو التقديم كانه قدم خيراوكان له فيه تقديم وكذلك القسدمة بالضم والتسكين
  يقال مشى فلان القدمية أى تقدم ورجل قدم يكسر الدال أى متقدّم وأنثه أ بوعمرو
  أسراق قد علت معدأنى • قدم اذا كره الحياض جسور
  والمقدام والمقدامة الرجل الكثير الاقدام على العدق ويقال ضرب فركب مقاديمه اذا وقع
  على وجهه واستقدم وتقدم بمعنى كمايقمال استحباب وأجاب وفى المثل استقدمت رحالتك
  بعنى سرحك أى سبق ما كان غيره أحق به ويقال هو جرى المقدم بضم الميم وفتح الدال أى
  جرى عند الاقدام ومقدم العين بكسر الدال عمايلى الانف كؤخرهاعما يلى الصدغ ويقال
  أيضا مشطتها المقسدمة بكسر الدال وهى مشطة وتوادم الطير مقاديم ريشه وهى عشر
  فى كل جناج الواحدة قادمة وهى القدامى أيضا وقادم الانسان رأسه وابهع قوادم ولا يكاد
  بتكام بالواحدمنه وقيدوم الجبل أنف يتقدّم منه وقيدوم كل شي مقدمه وصدره والمقدم
  قيض المؤخر يقال ضرب مقدّم وجهه ومقدّمة الجيس بكسر الدال أوّله ومضى القوم
  التقدمية اذا تقدّموا قال سيبويه الثاءزائدة وقال
  الضاريير التقدمية بالمهندة الصفائح
