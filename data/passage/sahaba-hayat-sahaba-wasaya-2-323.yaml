text: "… كنا عند ابى هريرة وعليه ثوبان عشقانا من كتّان. فمخط فى احدهما ثم قال: بخ ابخ! يمتخط أبو هريرة فى الكتان، لقد رأينى وإنى لأخرّ فيما بين منبر رسول اللّٰه و حجرة عائشةا مغشيا علىّ فيجىء الجائى فيضع رجله على …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 323، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
