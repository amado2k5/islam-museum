text: "… ماء الثلج، وأما ماء الجمد وهو الجليد، فبحسب أصله. والثلج يكتسب كيفية الجبالِ والأرضِ التي يسقُط عليها في الجودة والرداءة، وينبغي تجنُّب شربِ الماء المثلوج عقيبَ الحمام والجماع، والرياضة والطعام الحار، ولأصحاب السُّعال، ووجع الصدر، وضعف الكبد، وأصحاب الأمزجة الباردة. …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 736، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
