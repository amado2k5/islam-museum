label:
  ar: "مسلم 136 — لا يزالون يسألون حتى يقولوا: هذا الله خلق الخلق فمن خلق الله"
  en: "Muslim 136 — They will keep asking until they say: God created creation, so who created God"
  ur: "مسلم 136 — وہ پوچھتے رہیں گے یہاں تک کہ کہیں: اللہ نے مخلوق پیدا کی تو اللہ کو کس نے پیدا کیا"
text: "قال الله عز وجل إن أمتك لا يزالون يقولون ما كذا ما كذا حتى يقولوا هذا الله خلق الخلق فمن خلق الله ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 136: لا يزالون يسألون حتى يقولوا: هذا الله خلق الخلق فمن خلق الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 136: They will keep asking until they say: God created creation, so who created God. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 136: وہ پوچھتے رہیں گے یہاں تک کہ کہیں: اللہ نے مخلوق پیدا کی تو اللہ کو کس نے پیدا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
