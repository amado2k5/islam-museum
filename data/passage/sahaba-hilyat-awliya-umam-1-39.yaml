text: "… لما قال أعل هبل، قال رسول اللّٰه لعمر بن الخطاب : قل اللّٰه أءلا وأجل فقال أبو سفيان لنسا عزى ولا عزى لسكم، فقال رمول اللّٰه لعمر : قل اللّٰه مولانا والكافرون لا مولى لهم حدثنا فارق الخطابى ثنا زياد …"
summary:
