label: { ar: "سنن أبي داود 4694 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 4694 — a burial, grave or resting place", ur: "سنن ابی داؤد 4694 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 4694 — un lugar de entierro, tumba o descanso.", fr: "Sunan Abi Dawud 4694 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… عَنْ عَبْدِ اللَّهِ بْنِ حَبِيبٍ أَبِي عَبْدِ الرَّحْمَنِ السُّلَمِيِّ، عَنْ عَلِيٍّ، قَالَ كُنَّا فِي جَنَازَةٍ فِيهَا رَسُولُ اللَّهِ بِبَقِيعِ الْغَرْقَدِ فَجَاءَ رَسُولُ اللَّهِ فَجَلَسَ وَمَعَهُ مِخْصَرَةٌ فَجَعَلَ يَنْكُتُ بِالْمِخْصَرَةِ فِي الأَرْضِ ثُمَّ رَفَعَ رَأْسَهُ فَقَالَ \" مَا مِنْكُمْ مِنْ أَحَدٍ مَا مِنْ نَفْسٍ مَنْفُوسَةٍ إِلاَّ قَدْ كَتَبَ اللَّهُ مَكَانَهَا مِنَ النَّارِ أَوْ مِنَ الْجَنَّةِ إِلاَّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4694، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4694 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4694، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4694 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, patrimonios, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4694 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
