label: { ar: "مسلم 397 — ارجع فصل فإنك لم تصل", en: "Muslim 397 — Go back and pray, you have not prayed", es: "Musulmán 397 — Regresa y ora, no has orado.", fr: "Muslim 397 — Retournez prier, vous n'avez pas prié.", ur: "مسلم 397 - واپس جا کر نماز پڑھی، تم نے نماز نہیں پڑھی۔", tr: "Müslim 397 — Geri dönün ve namaz kılın, çünkü namaz kılmadınız.", id: "Muslim 397 — Kembalilah dan salatlah, karena kamu belum salat." }
text: "قال أبو هريرة: دخل رجل المسجد فصلى ثم جاء فسلم على رسول الله فرد السلام وقال: ارجع فصل فإنك لم تصل، حتى فعل ذلك ثلاث مرات، فقال الرجل: والذي بعثك بالحق ما أحسن غير هذا علمني، قال: إذا قمت إلى الصلاة فكبر ثم اقرأ ما تيسر معك من القرآن ثم اركع حتى تطمئن راكعاً ثم ارفع حتى تعتدل قائماً ثم اسجد حتى تطمئن ساجداً ثم ارفع حتى تطمئن جالساً ثم افعل ذلك في صلاتك كلها"
summary:
  ar: "رواية أبي هريرة في باب الطمأنينة في الصلاة من كتاب الصلاة في صحيح مسلم — حديث المسيء صلاته الشهير: تعليم الطمأنينة ركناً ركناً."
  tr: "Sahih Müslim'in Namaz Kitabı'ndaki namazda sükûnet bölümünde Ebu Hurayra'nın rivayeti - yanlış namaz kılanın meşhur hadisi: sükûneti adım adım öğretmek."
  id: "Riwayat Abu Hurairah dalam bab tentang ketenangan dalam salat dari Kitab Sahih Muslim — hadits terkenal tentang orang yang salat dengan cara yang salah: mengajarkan ketenangan rukun demi rukun."
