label: { ar: "مسلم 397 — ارجع فصل فإنك لم تصل", en: "Muslim 397 — Go back and pray, you have not prayed" }
text: "قال أبو هريرة: دخل رجل المسجد فصلى ثم جاء فسلم على رسول الله فرد السلام وقال: ارجع فصل فإنك لم تصل، حتى فعل ذلك ثلاث مرات، فقال الرجل: والذي بعثك بالحق ما أحسن غير هذا علمني، قال: إذا قمت إلى الصلاة فكبر ثم اقرأ ما تيسر معك من القرآن ثم اركع حتى تطمئن راكعاً ثم ارفع حتى تعتدل قائماً ثم اسجد حتى تطمئن ساجداً ثم ارفع حتى تطمئن جالساً ثم افعل ذلك في صلاتك كلها"
summary:
  ar: "رواية أبي هريرة في باب الطمأنينة في الصلاة من كتاب الصلاة في صحيح مسلم — حديث المسيء صلاته الشهير: تعليم الطمأنينة ركناً ركناً."
