text: |-
  •⁦(باب اللدون)⁩•
  .⁦(متن)⁩•
  ٤٠٩
  انحشونة يقال لان الذى يلين ليناوشى ليز وان مخفف منه والجمع أليذاء وقوم لينون وأليذاء
  انماه وجع ليز منتدوه وفبعل لان فعلالا يجمع على افعلا والليان بالفتح المصدر من اللين
  تقول هو فى ليان من العير أى فى نعيم وخفض ولينت الشئ وألينته أى صيرته لينا ويقال
  أيضا ألنته وألينته على النقصان والتمام مثل أطلته وأطولته والليان بالكسر الملابضة
  والملاطفة تقول لايننى ملاينة وايسانا واستلانه عدّه ليذا وتلين له تملق
  صل الميم أن المؤنة تهمزولا تهمزوهى فعولة وقال الفراءفى مفعلة من
  الاين وه والتعب والثدة ويقال هى مفعلة من الأون وهوالخرج والعدل لانماثقل على
  الانسان قال الخليل ولو كانت مفعلة لكانت مئينة مثل معيشة وعنسد الاخفس يجوز أن
  تكون مفعلة ومأنت القوم أمؤنهم .أنا اذا احتمات مؤنتهم ومن ترك الهمز قال منتهم
  أمونسم وأنانى فسلان وما مأنت مأنه أى لم أكترثف قال المكسائى وما تهيأت له وقال
  أعرابة من سليم أى ماعلت بذلك وهو يمأنه أى يعله وأنشد
  اذا ماعات الامر أقرون علمه • ولا أدّعى مالست أ. أنه جهلا
  كفى بامرى يومايقول بعله • ويسكت عملليس يعلمه فضلا
  ومانت فلانا تمثنة أى أعلتّه وأنشد الاصحمى للمرار الفقعسى
  فتهام-واشأفقالواعرسوا • من غير تمثنة لغير معرس
  أى من غير تعريف ولاه وفى موضع التعريس والتمثنة الاعلام والمئنة العلامة وفى حديث
  : ابن مسعودات طول الصلاة وقصر الخطبة متنة من فقه الرجل قال الاصمعى سألتى شعبة
  عن هذا الحرف فقلت مثنة أى علامة لذا وخليق لذاك قال الراجز
  انَّا كتصالا بالنقّ الابلج • وتطرافى الحاجب المزج • مثنمن الفعال الاءوج
  وهذا الحرف هكذا يروى فى الحديث والشعر بتشديد الذون وحقه عندى أن يقال ممينة
  مثال معينة على فعملة لان الميم أصلية الا أن يكون أول هذا الحرف من غير هذا الباب
  مكون مثفة مفعلة من ان المكسورة المشددة كما يقال هو معسامن كذا أى محدرة ومظنة
  وهومبنى من عسى وكان أبوز يدية ول مئتة بالتاء أى مخلقة لذلا ومحدرة ومحراة وفحوذلك
  وهو مفعلة من أنه يونه أنا اذا غلبه بالحة الاصممىّ ماءنت فى هذا الامر على وزن ماعنت أى
  روأت ويقال ام أن مأنك وامأن تأنك أى اعمل ما تحسسنه والمأن والمأنة الطفطفة والهع
  مأنات ومؤن أيضا على فعولم:ل بدرة وبدور على غيرفياس أبو زيد مأنت الرجل أمأنه مأنا
  اذا أصبت مأنته قال وهى مابين سرّنه وعانته وشرسوفه والمأن أيضا الحشبة فى رأسها حديدة
  تثاربها الارض عن أبى عرووابن الاعراتي ⁦(متن )⁩ المتن من الارض ماصلب وارتفع
  والجمع منان ومتون قال * والقوم قد قطعوامان السجسج * ومتن الشئ بالضم منانة فهو
  متين أَى صلب ومتنا الظهر مكتنفا الصلب عن يمين وشهال من عصب ولحسم يذكر ويؤنث
  ومتنت الرجل متناضرات متنه ومتن السهم مادون الريس منه الى وسطه ويقال أيضارجل
  متن من الرجال أى صلب ومتن به متناساربه يومه أجمع والمماتنة المباعدة في الغاية يقال سار
  سيراعماتنا أى شديدا وماتنه أى ماطله ومتقت الص بش شققت صغنه واستخرجت
  ساح
