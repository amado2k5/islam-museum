label: { ar: "سنن ابن ماجه 2791 — عدد الحسنات", en: "Sunan Ibn Majah 2791 — a stated number of good deeds", ur: "سنن ابن ماجہ 2791 — نیکیوں کی مقررہ تعداد" }
text: "حَدَّثَنَا أَبُو عُمَيْرٍ، عِيسَى بْنُ مُحَمَّدٍ الرَّمْلِيُّ حَدَّثَنَا أَحْمَدُ بْنُ يَزِيدَ بْنِ رَوْحٍ الدَّارِيُّ، عَنْ مُحَمَّدِ بْنِ عُقْبَةَ الْقَاضِي، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ تَمِيمٍ الدَّارِيِّ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنِ ارْتَبَطَ فَرَسًا فِي سَبِيلِ اللَّهِ ثُمَّ عَالَجَ عَلَفَهُ بِيَدِهِ كَانَ لَهُ بِكُلِّ حَبَّةٍ حَسَنَةٌ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2791، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2791 (The Chapters on Jihad), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2791، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
