label: { ar: "جامع الترمذي 2866 — مَثَل المؤمن", en: "Jami' al-Tirmidhi 2866 — the likeness of the believer", ur: "جامع ترمذی 2866 — مومن کی مثال", es: "Jami' al-Tirmidhi 2866 — la imagen del creyente", fr: "Jami' al-Tirmidhi 2866 — l'image du croyant" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ عَلِيٍّ الْخَلاَّلُ، وَغَيْرُ، وَاحِدٍ، قَالُوا حَدَّثَنَا عَبْدُ الرَّزَّاقِ، قَالَ أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَثَلُ الْمُؤْمِنِ كَمَثَلِ الزَّرْعِ لاَ تَزَالُ الرِّيَاحُ تُفِيئُهُ وَلاَ يَزَالُ الْمُؤْمِنُ يُصِيبُهُ بَلاَءٌ وَمَثَلُ الْمُنَافِقِ كَمَثَلِ الشَّجَرَةِ الأَرْزِ لاَ تَهْتَزُّ حَتَّى تُسْتَحْصَدَ \". هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2866، يذكر مَثَل المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2866 (Chapters on Parables), that mentions the likeness of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2866، جس میں مومن کی مثال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2866 (Capítulos sobre las parábolas), menciona la semejanza del creyente. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2866 (Chapitres sur les paraboles), évoque la ressemblance du croyant avec les piliers de l'islam, les branches de la foi et les caractéristiques du croyant. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs."
