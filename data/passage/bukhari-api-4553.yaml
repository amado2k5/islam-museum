text: "… قَالَ انْطَلَقْتُ فِي الْمُدَّةِ الَّتِي كَانَتْ بَيْنِي وَبَيْنَ رَسُولِ اللَّهِ صلى الله عليه وسلم ـ قَالَ ـ فَبَيْنَا أَنَا بِالشَّأْمِ إِذْ جِيءَ بِكِتَابٍ مِنَ النَّبِيِّ صلى الله عليه وسلم إِلَى هِرَقْلَ قَالَ وَكَانَ دِحْيَةُ الْكَلْبِيُّ جَاءَ بِهِ فَدَفَعَهُ إِلَى عَظِيمِ بُصْرَى، فَدَفَعَهُ عَظِيمُ بُصْرَى إِلَى ـ هِرَقْلَ ـ قَالَ فَقَالَ هِرَقْلُ هَلْ هَا هُنَا أَحَدٌ مِنْ قَوْمِ هَذَا الرَّجُلِ الَّذِي يَزْعُمُ أَنَّهُ نَبِيٌّ فَقَالُوا …"
summary:
  ar: "في صحيح البخاري؛ وصول كتاب منسوب إلى مرسل."
  en: "In Sahih al-Bukhari; a letter arriving from a named sender."
  ur: "صحیح بخاری میں؛ نامزد بھیجنے والے کا خط پہنچنا."
