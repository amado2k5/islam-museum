text: |-
  ٢ ٤٢ •
  ⁦(باب الضاد)⁩
  لاجعلنّ لابنسة عثم فنا • من أين عشرون لهامن أنى
  تى يسكون مهرهادهدنا • ياكروانا صلافا كبأنا
  فشن بالسلح فماشنا . بلّ الذنابى عبا مبنا
  أإإلى تأكلها مصناً • خافض سن ومشلاسنا
  ( خوض خضت الماء أخوضه خوضاوخياضا والموضع مخاضة وه وماجاز الناس فيها
  مشاة وركيانا وجمعها المخايض والمخاوض أيضاءن أبى زيد وأخضت فى الماءدابق وأخاض
  القوم أى خاضت خياهم الماء وخضت الغمران اقصمتها وبقال خاضه بالسيف أى حرل
  سسيفه فى المضروب وخوّض فى نجيعه شتدلله بالغسة والمخوس للشراب كالجدح اللسويق
  يقال خضت الشراب وخاض القوم فى الحديت وتخاوضوا أى تفاوضوافيه
  ( ف سل الدال حض مكان دحض ودحض أيضا بالتصريك أى زاق قال
  الراجز يصف ناقته
  قد ترد النهى تنزى عومه • فتستبيح ماه مقتلهمه • حتى يعودد حضا تشهمه
  ودحفت رجله تدحض حضازلقت وحضت الشمس عن كبد السها:ل،لاات وحضت
  يجنه فحوضا بطلت وأدحضها اقه والادحاض الازلاق ( دحرس الدحرض
  اميم موضع قال عنترة
  شريت بماء الدحرضين فأصبحت • زوراء تنفر من حياض الديلم
  ويقال وسيع ودحرض ما آن فئناهما بلفظ أحدهما كمابقال القمران
  صل الرا يض الريض بالتحريك واحد الأوياض وهى حبال الرحل
  وأمعاء البطن وريض المدينة أيضاماحولها وريض الغنم أيضاء أواها قال العجاج
  بصف النور الوحنى
  واعتاداً رياضالها أرى
  وريض الرج-ل امى أنه وكل
  ما يأوى اليه من بيت وغحوه وقال
  جا الشتاء ولما أتخذريضا • ياويح كنو من حخر القراميص
  ومنه قبل لقوت الانسان الذى يقيه ويكفيه من اللين ريض وفى المثسل منك ريضك وان كان
  سهارا أى منك أهلك وخدمك ومن تأوى اليه وان كانوا مقصرين وهذا كقواهسم اتفك
  منك وان كان أجدع قال الكسائى الريض بالضم وسط الشئ والربض بالتحريك نواحب
  وريوض الغنم والبقر والفرص والسكاب مشل برولك الابل وجثوم الطير تقول منه ربنت
  الغنم تزيض بالكسر ريوضا وأريضتها أنا وآربضت الشمس اشتد -زها حتى ربض القي
  والشاة وولهم دعاباناء يريض الرهط أى يرويهم حتى يثقلوافيربضوا ومن قال يبريض الرهما
  فهومن اراض الوادى وريض الكبش عن الغنم ربوضا أى حسر وترك الضراب وعدل
  عنه ولا يقال فيه جفر والمرابض للغنم ك المعاطن للابل واحدهامريض مثال مخاص
  والزبيض الغنم برعاتها المجتمعة فى مر بضها بقال ه_ذارييض بنى قلان وشجرة ريوض أى !
  عظايمة غليظة ومنهقول ذى الرمة
  تجوّف كل ارطاة ريوض • من الدهنا مريعة انخبالا
  وك ذان
