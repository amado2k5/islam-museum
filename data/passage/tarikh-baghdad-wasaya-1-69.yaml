text: "… بيت الشهادة والستر والثقة وكان فى الحديث ثفة جميل الامر. أخبرتى الازهرى. قال: توفى أبو القاسم سليمان بن محمد بن أبى أيوب الشاهد فى شهر ربيع الاول من سنة ثمان وسبعين وثلاثمائة، ومولده سنة ثمان وتسمين ومائتين، ودفن فى مقبرة …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 69، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 1, p. 69, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 1، ص 69 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
