text: "… قد صح بالتجربة أن لقامه حلمة أمه عظيم النفع جداً في دفع ما يؤذيه، ويجب أن يُكتفى بإرضاعه في اليوم مرتين أو ثلاثاً، ولا يبدأ في أوّل الأمر في إرضاعه بإرضاع كثير، على أنه يستحبّ أن تكون من ترضعه في …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 205، يرد فيه ذكر المستحب، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 205, whose wording mentions the recommended (mustahabb), what must be done; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج1، ص 205 کا اقتباس جس میں مستحب، جو واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Canon de Medicine, vol. 1 de Ibn Sina, p. 205, dont le texte mentionne le recommandé (mustahabb), ce qui doit être fait ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Canon de Medicine, vol. 1 de Ibn Sina, p. 205, cuyo texto menciona lo recomendado (mustahabb), lo que debe hacerse; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
