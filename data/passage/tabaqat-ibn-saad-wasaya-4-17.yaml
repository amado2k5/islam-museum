text: "… قد عرفناك، مرحبًا بك فما حاجتك ؟ قالت : هذا الجسد الذى تلتموه فأذنوا لى فى حمله. قوثب شباب من بكر بن وأئل فوضعوه على بغل وشتوه. وأَقبلت اصرأَته إلى عسكر معاوية فتلقَّاها معاوية بسرير فحمله عليه وحفر له وصلى …"
