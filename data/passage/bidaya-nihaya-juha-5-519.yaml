text: "… وقال: إذا ترأس الرجل سريعاً أخر بكثير من العلم. وممن توفي فيها : أبو دلامة زيد بن الجون الشاعر الماجن، أحد الظرفاء، أصله من الكوفة وأقام ببغداد وحظي عند المنصور لأنه كان يضحكه وينشده الأشعار ويمدحه، حضر يوماً جنازة امرأة …"
