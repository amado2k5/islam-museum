label: { ar: "الموطأ 766 — عمر والفرس الذي حمل عليه في سبيل الله: لا تشتره وإن أعطاكه بدرهم، فإن العائد في صدقته كالكلب يعود في قيئه", en: "Muwatta 766", es: "Muwatta 766", fr: "Muwatta 766", ur: "موطا 766", tr: "El-Muvatta 766 — Ömer ve Allah yolunda bindiği at: Onu size bir dirheme bile teklif etse satın almayın; çünkü sadakasını geri alan, kusmuğuna dönen köpek gibidir.", id: "Al-Muwatta 766 — Umar dan kuda yang ditungganginya dalam perjuangan di jalan Allah: Janganlah kamu membelinya meskipun ia menawarkannya kepadamu dengan harga satu dirham, karena orang yang mengambil kembali sedekahnya itu seperti anjing yang kembali kepada muntahannya." }
text: "لا تشتره، وإن أعطاكه بدرهم واحد. فإن العائد في صدقته، كالكلب يعود في قيئه"
summary:
  ar: "أول حديث في باب اشتراء الصدقة والعود فيها. يرويه مالك عن زيد بن أسلم عن أبيه، أنه سمع عمر بن الخطاب يقول: حملت على فرس عتيق في سبيل الله، وكان الرجل الذي هو عنده قد أضاعه، فأردت أن أشتريه منه وظننت أنه بائعه برخص، فسألت النبي فنهاني أن أشتريه ولو أعطانيه بدرهم واحد، وشبه العائد في صدقته بالكلب يعود في قيئه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (5125) والبغوي، وإسماعيل بن أبي أويس عند البخاري (3003)، وسفيان بن عيينة عند الحميدي والبخاري ⁦(2636 و2970)⁩، والقعنبي عند مسلم (5/63)، والتنيسي عند البخاري (1490)، وابن القاسم ومن طريقه النسائي (5/108)، وابن مهدي عند أحمد ومسلم، ويحيى بن قزعة عند البخاري (2623). {cite:muwatta-maruf-1997 p.378} {cite:muwatta-maruf-1997 p.379}"
  id: "Hadits pertama dalam bab ini adalah tentang mengambil kembali apa yang telah diberikan sebagai sedekah. Diriwayatkan oleh Malik dari Zaid bin Aslam, dari ayahnya, yang mendengar Umar bin al-Khattab berkata: “Aku memberikan seekor kuda yang bagus sebagai sedekah karena Allah, tetapi pemiliknya telah mengabaikannya. Aku ingin mengambilnya kembali darinya, kupikir dia akan menjualnya dengan harga murah. Maka aku bertanya kepada Nabi (shalawat dan salam kepadanya), dan beliau melarangku untuk membelinya, meskipun dia menawarkannya kepadaku dengan harga satu dirham. Beliau menyamakan orang yang mengambil kembali apa yang telah diberikannya sebagai sedekah dengan seekor anjing yang kembali memakan muntahannya.” Redaksi menyebutkan bahwa diriwayatkan dari Malik oleh Abu Mus’ab, dan melalui dia oleh Ibnu Hibban (5125), al-Baghawi, Isma’il ibn Abi Uways dalam al-Bukhari (3003), Sufyan ibn Uyaynah dalam al-Humaydi dan al-Bukhari (2636 dan 2970), al-Qa’nabi dalam Muslim (5/63), al-Tunisi dalam al-Bukhari (1490), Ibnu al-Qasim dan melaluinya oleh al-Nasa’i (5/108), Ibnu Mahdi dalam Ahmad dan Muslim, dan Yahya ibn Qaza’ah dalam al-Bukhari (2623). {kutip:muwatta-maruf-1997 hal.378} {kutip:muwatta-maruf-1997 hal.379}"
