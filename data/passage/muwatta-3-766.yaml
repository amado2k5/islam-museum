label: { ar: "الموطأ 766 — عمر والفرس الذي حمل عليه في سبيل الله: لا تشتره وإن أعطاكه بدرهم، فإن العائد في صدقته كالكلب يعود في قيئه", en: "Muwatta 766" }
text: "لا تشتره، وإن أعطاكه بدرهم واحد. فإن العائد في صدقته، كالكلب يعود في قيئه"
summary:
  ar: "أول حديث في باب اشتراء الصدقة والعود فيها. يرويه مالك عن زيد بن أسلم عن أبيه، أنه سمع عمر بن الخطاب يقول: حملت على فرس عتيق في سبيل الله، وكان الرجل الذي هو عنده قد أضاعه، فأردت أن أشتريه منه وظننت أنه بائعه برخص، فسألت النبي فنهاني أن أشتريه ولو أعطانيه بدرهم واحد، وشبه العائد في صدقته بالكلب يعود في قيئه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (5125) والبغوي، وإسماعيل بن أبي أويس عند البخاري (3003)، وسفيان بن عيينة عند الحميدي والبخاري (2636 و2970)، والقعنبي عند مسلم (5/63)، والتنيسي عند البخاري (1490)، وابن القاسم ومن طريقه النسائي (5/108)، وابن مهدي عند أحمد ومسلم، ويحيى بن قزعة عند البخاري (2623). {cite:muwatta-maruf-1997 p.378} {cite:muwatta-maruf-1997 p.379}"
