label: { ar: "الموطأ 461 — كان يأتي قباء راكباً وماشياً", en: "Muwatta 461" }
text: "كان رسول الله يأتي قباء راكباً وماشياً"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، في باب العمل في جامع الصلاة: كان النبي يأتي مسجد قباء راكباً وماشياً. وينقل المحقق عن ابن عبد البر أن يحيى والقعنبي والطباع وابن وهب وابن نافع رووه عن مالك عن نافع، وأن جل رواة الموطأ رووه عن مالك عن عبد الله بن دينار، والحديث صحيح لمالك عنهما جميعاً عن ابن عمر (التمهيد 13/261)، ويخرّج رواية نافع عند أحمد (2/65) والجوهري، ورواية عبد الله بن دينار عند مسلم (4/127) والنسائي (2/37) وابن حبان وأحمد. {cite:muwatta-maruf-1997 p.236} {cite:muwatta-maruf-1997 p.237}"
