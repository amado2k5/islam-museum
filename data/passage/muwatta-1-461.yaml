text: "كان رسول الله يأتي قباء راكباً وماشياً"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، في باب العمل في جامع الصلاة: كان النبي يأتي مسجد قباء راكباً وماشياً. وينقل المحقق عن ابن عبد البر أن يحيى والقعنبي والطباع وابن وهب وابن نافع رووه عن مالك عن نافع، وأن جل رواة الموطأ رووه عن مالك عن عبد الله بن دينار، والحديث صحيح لمالك عنهما جميعاً عن ابن عمر ⁦(التمهيد 13/261)⁩، ويخرّج رواية نافع عند أحمد (2/65) والجوهري، ورواية عبد الله بن دينار عند مسلم (4/127) والنسائي (2/37) وابن حبان وأحمد. {cite:muwatta-maruf-1997 p.236} {cite:muwatta-maruf-1997 p.237}"
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, dalam surah tentang kebiasaan di masjid: Nabi (shalawat dan salam kepadanya) biasa datang ke Masjid Quba’ dengan menunggang kuda dan berjalan kaki. Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa Yahya, al-Qa’nabi, al-Tabba’, Ibnu Wahb, dan Ibnu Nafi’ meriwayatkannya dari Malik dari Nafi’, dan bahwa sebagian besar perawi Muwatta’ meriwayatkannya dari Malik dari Abdullah ibn Dinar. Hadits ini sahih menurut Malik dari keduanya dari Ibnu Umar (al-Tamhid 13/261). Riwayat Nafi’ terdapat pada Ahmad (2/65) dan al-Jawhari, dan riwayat Abdullah bin Dinar terdapat pada Muslim (4/127), al-Nasa’i (2/37), Ibnu Hibban, dan Ahmad. {kutip:muwatta-maruf-1997 hal.236} {kutip:muwatta-maruf-1997 hal.237}"
