label: { ar: "الموطأ 1971 — مالك: في الذي يشتري الطعام فيكتاله، ثم يأتيه من يشتريه منه فيخبره أنه قد اكتاله لنفسه واستوفاه، فإن بيع بنقد فلا بأس به، وإن بيع إلى أجل فهو مكروه حتى يكتاله المشتري الآخر لنفسه، لأنه ذريعة إلى الربا", en: "Muwatta 1971", es: "Muwatta 1971", fr: "Muwatta 1971", ur: "موطا 1971", tr: "El-Muvatta 1971 — Malik: Bir kimse yiyecek alıp ölçer, sonra başka biri gelip ondan satın alır ve o da kendisinin zaten ölçtüğünü ve teslim aldığını söylerse, eğer nakit olarak satılırsa bunda bir sakınca yoktur. Ancak krediyle satılırsa, diğer alıcı kendisi ölçene kadar mekruh olur, çünkü bu faizcilik aracıdır.", id: "Al-Muwatta 1971 — Malik: Mengenai seseorang yang membeli makanan dan menimbangnya, kemudian orang lain datang dan membelinya darinya, dan dia mengatakan kepadanya bahwa dia telah menimbangnya sendiri dan memilikinya, jika dijual secara tunai, tidak ada salahnya. Tetapi jika dijual secara kredit, hal itu tidak disukai sampai pembeli lain menimbangnya sendiri, karena itu merupakan sarana riba." }
summary:
  ar: "قال مالك في الذي يشتري الطعام فيكتاله، ثم يأتيه من يشتريه منه، فيخبر الذي يأتيه أنه قد اكتاله لنفسه واستوفاه، فيريد المبتاع أن يصدقه ويأخذه بكيله. فإن ما بيع على هذه الصفة بنقد فلا بأس به. وما بيع على هذه الصفة إلى أجل فإنه مكروه، حتى يكتاله المشتري الآخر لنفسه. وإنما كره الذي إلى أجل، لأنه ذريعة إلى الربا، ويتخوف أن يدار ذلك على هذا الوجه بغير كيل ولا وزن. {cite:muwatta-maruf-1997 p.206} {cite:muwatta-maruf-1997 p.207}"
  tr: "Malik, bir kimsenin yiyecek alıp ölçtüğünü, sonra başka birinin gelip ondan aynı yiyeceği satın aldığını ve alıcıya kendisinin zaten ölçtüğünü ve tamamını aldığını söylediğini, alıcının da ona inanıp ölçerek almak istediğini şöyle anlatmıştır: Eğer bu şekilde nakit olarak satılırsa, bunda bir sakınca yoktur. Ancak eğer bu şekilde kredili olarak satılırsa, diğer alıcı kendisi ölçene kadar bu durum hoş karşılanmaz. Kredili satışın hoş karşılanmamasının sebebi, tefeciliğe yol açması ve ölçmeden veya tartmadan bu şekilde satılma korkusudur. {cite:muwatta-maruf-1997 s.206} {cite:muwatta-maruf-1997 s.207}"
  id: "Malik berkata tentang seseorang yang membeli makanan dan menimbangnya, kemudian orang lain datang untuk membelinya darinya, dan dia memberi tahu pembeli bahwa dia telah menimbangnya sendiri dan memilikinya sepenuhnya, dan pembeli ingin mempercayainya dan mengambilnya sesuai takaran: Jika dijual dengan cara ini secara tunai, tidak ada yang salah dengan itu. Tetapi jika dijual dengan cara ini secara kredit, itu tidak disukai sampai pembeli lain menimbangnya sendiri. Alasan tidak disukainya secara kredit adalah karena itu merupakan sarana riba, dan ada kekhawatiran bahwa hal itu akan dilakukan dengan cara ini tanpa menimbang atau mengukur. {cite:muwatta-maruf-1997 p.206} {cite:muwatta-maruf-1997 p.207}"
