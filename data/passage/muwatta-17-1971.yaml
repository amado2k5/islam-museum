label: { ar: "الموطأ 1971 — مالك: في الذي يشتري الطعام فيكتاله، ثم يأتيه من يشتريه منه فيخبره أنه قد اكتاله لنفسه واستوفاه، فإن بيع بنقد فلا بأس به، وإن بيع إلى أجل فهو مكروه حتى يكتاله المشتري الآخر لنفسه، لأنه ذريعة إلى الربا", en: "Muwatta 1971" }
summary:
  ar: "قال مالك في الذي يشتري الطعام فيكتاله، ثم يأتيه من يشتريه منه، فيخبر الذي يأتيه أنه قد اكتاله لنفسه واستوفاه، فيريد المبتاع أن يصدقه ويأخذه بكيله. فإن ما بيع على هذه الصفة بنقد فلا بأس به. وما بيع على هذه الصفة إلى أجل فإنه مكروه، حتى يكتاله المشتري الآخر لنفسه. وإنما كره الذي إلى أجل، لأنه ذريعة إلى الربا، ويتخوف أن يدار ذلك على هذا الوجه بغير كيل ولا وزن. {cite:muwatta-maruf-1997 p.206} {cite:muwatta-maruf-1997 p.207}"
