text: |-
  ⁦(باب الشاء)⁩
  ١ نسخة زيادة جزير اه وفى
  ولا يتعدى قال الشاعر⁦(١)⁩
  القاموس وقول جريربرنى عمربن
  الشمس طالعة ليست بكاسفة • تبكى عليك نجوم الليل والقمرا
  عبد العزيز
  أى ليست تكف ضو النجوم مع طلوعها لقلة ضوتها و بكانها عليك وكذلك كسف القمر
  فالشمس كاسفة ليست بطالعة
  الا أن الاجود فيه أن يقال خسف القمر والعامة تقول انكسفت الشهمن وكسفت حال
  تبكى عليك نجوم الليل والقهرا الرجل أى ساءت ورجل كاسف البال أى سيا لحال وكاسف الوجه أى عابس وفى المثل
  أى كاسفة بموتك أبداووه-م
  أكسفاراما كاأى أعبوسامع خل ⁦( ثف)⁩ كشفت الشئ فاذكشف وتكشف
  الجوهرى فغير الرواية بقوله
  يقال تكشف البرق اذا ملا السماء وكائفه بالعداوة أى باداه بها ويقال لو تكاشضم
  الشمس طالعوٱيدت بكاسفة
  ما تدافنتم أى لو أنكشف عيب بعضكم لبعض والكشوف الناقة التى يضر بها الفحل وهى
  وتكاف لمعناه اه كتبه مصحده
  حامل وقد كشفت الناقة كشافا وقال الاصمعىّ فان حل عليها الفهل سنتين منواليتين فذلك
  الكشاف والناقة كشوف قال زهير * وتلقح كشافائم تنتج فتغطم * وأكشف القوم
  أى كشفت ابلهم والكشف بالتحريك انقلاب من قصاص الناصية كأنهادائرة وهى
  شعيرات تنيت صعدا والرجل أكشف وذلك الموضع كشفة والسكشف فى الحيل التواء
  فى عسيب الذنب والاكشف الرجل الذى لاترس معه فى الحرب ( فف لكف
  واحدة الاكف وقولهم لقيته كفة كفة بفتح الكاف أى كفاحا وذلك اذا استقبلته مواجهة
  وهما امممان جعلا واحداوبنيا على الفتح مثل خمسة عشر وكفة الميص بالضم ما استدار
  حول الذيل وكان الاصمعى" يقول كل ما استطال فهو كفة بالضم نحوكفة الئوب وهى حاشيتة
  وكفة الرمل وبحعه كفاف وكل ما استدارفه وكفة بالكسر نح وكفة الميزان وكفة الصائد
  وهى حبالته وكفة اللثة وهى ما انحدر منها قال ويقال أيضا كفة الميزان بالفتح والجمع
  قوله والكافة فى القاموس ولا يقال
  كفف والكفف فى الوشم دارات تكون فيه وكفاف الشئ حتاره والكافسة الهيع من
  جاءت الكافة لانه لا يدخلها أل
  الناس يقمال لقيتهم كافة أى كلهم وأماقول ابن رواحة الانصارى رضى اللّٰه عنه
  ووهم الجوهرى اه كتبه
  فسرنا اليهم كافة فى رحالهم • جها علينا البيض لا تتخشع
  فانما خففه ضرورة لانه لايصح الجمع بين الساكنين فى حشوالميت وكذلا قول الآخر
  جزى اللّٰه الرواب جزاءسوه * وألبيهن من برص قيصا
  وهوجع رابة ويقال للبعيراذا كبرفة صرت أسنانه حتى تكاد تذهب هو كاف والناقة كافّ
  أيضاوقد كفت الشاقة تكف كفوفا وكففت الموب أى خطت حاشمته وهى الخداطة الثانة
  بعد المل وعيبة مكفوفة أى مشرجة مشدودة والمكفوف الضرير والجمع المكافف
  وقد كف بصره وكف يصره أيضا عن ابن الاءرابي وكففت الرجل عن الشئ فكف يتعدى
  ولا يتعدى والمصدرواحد وكفاف الشى بالفتح مثله وقيه والكفاف أيضامن الرزق
  القوت وهو ما كف عن الناس أى أغنى وفى الحديث اللهم اجعل رزق آل محمد كفافا
  واستكففت الشئ استوضحته وهوأن تضع يدكلى حاجبك كالذى يس-تظل من الشمس
  تنظر الى الشئهل تراه واستكف وتكفف بمعنى وهو أن يمدّكفه يسأل الناس يقال فلان
  يتكفف الناس قال الفراء استكف القوم -ول الشى أى أحاطوابه ينقطرون اليه ومنه قول
  ابن مقبل
  ادا
