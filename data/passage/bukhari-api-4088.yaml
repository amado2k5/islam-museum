text: "… أَبُو مَعْمَرٍ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا عَبْدُ الْعَزِيزِ، عَنْ أَنَسٍ ـ قَالَ بَعَثَ النَّبِيُّ سَبْعِينَ رَجُلاً لِحَاجَةٍ يُقَالُ لَهُمُ الْقُرَّاءُ، فَعَرَضَ لَهُمْ حَيَّانِ مِنْ بَنِي سُلَيْمٍ رِعْلٌ وَذَكْوَانُ، عِنْدَ بِئْرٍ يُقَالُ لَهَا بِئْرُ مَعُونَةَ، فَقَالَ الْقَوْمُ وَاللَّهِ مَا إِيَّاكُمْ أَرَدْنَا، إِنَّمَا نَحْنُ مُجْتَازُونَ فِي حَاجَةٍ لِلنَّبِيِّ، فَقَتَلُوهُمْ فَدَعَا النَّبِيُّ عَلَيْهِمْ شَهْرًا فِي صَلاَةِ الْغَدَاةِ، وَذَلِكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4088، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 4088 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 4088، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4088 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona a los lectores. El navegador del museo sobre cómo se leía y escribía el Corán lo enumera junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un récit du Sahih al-Bukhari, n° 4088 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce récit avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "Sahih el-Buhari'de 4088 numaralı hadis, Kur'an okuyucularından bahsetmektedir. Bu derleme, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler hakkında bilgilerin yanı sıra Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine kitaplardan metinler içermektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4088, menyebutkan para pembaca Al-Quran. Koleksi ini menyusun informasi tentang bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
