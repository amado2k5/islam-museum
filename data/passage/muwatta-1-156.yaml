label: { ar: "الموطأ 156 — أسماء بنت أبي بكر: دم الحيضة يصيب الثوب فتقرصه وتنضحه", en: "Muwatta 156", es: "Muwatta 156", fr: "Muwatta 156", ur: "موطا 156", tr: "El-Muvatta 156 — Esma bint Ebu Bekir: Elbisesine adet kanı bulaşınca, onu sıkıştırıp üzerine serpiştiriyor.", id: "Al-Muwatta 156 — Asma binti Abi Bakr: Darah haid mengenai pakaian, lalu dia mencubitnya dan memercikkannya" }
text: "إذا أصاب ثوب إحداكن الدم من الحيضة فلتقرصه ثم لتنضحه بالماء ثم لتصل فيه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن فاطمة بنت المنذر بن الزبير عن أسماء بنت أبي بكر، في باب جامع الحيضة: سألت امرأة النبي عما تصنع إذا أصاب ثوبها دم الحيضة، فأمرها أن تقرصه بأصابعها ثم تنضحه بالماء ثم تصلي فيه. ويبين المحقق أن رواية يحيى «عن أبيه» بين هشام وفاطمة خطأ بيّن، والصواب أن هشاماً يرويه عن امرأته فاطمة كما في بقية الموطآت؛ ويخرّج الحديث عند البخاري (307) ومسلم (1/166) وأبي داود (361) وابن خزيمة (275) والبغوي من طرق أصحاب مالك، ويحيل على التمهيد (22/228). {cite:muwatta-maruf-1997 p.106}"
  tr: "Malik, regl bölümünde, Hişam ibn Urve'den, o da Fatıma bint el-Mundhir ibn el-Zübeyr'den, o da Esma bint Ebu Bekir'den rivayet etmiştir: Bir kadın Peygamberimize, elbisesi regl kanıyla lekelenirse ne yapması gerektiğini sormuştur. Peygamberimiz ona, elbiseyi parmaklarıyla sıkıştırmasını, sonra su serpmesini ve sonra da o elbiseyle namaz kılmasını söylemiştir. Araştırmacı, Yahya'nın Hişam ile Fatıma arasında \"babasından rivayet ettiği\" şeklindeki rivayetinin açık bir hata olduğunu açıklığa kavuşturmaktadır. Doğru rivayet, Hişam'ın bunu karısı Fatıma'dan rivayet etmesidir, tıpkı Muvatta'nın geri kalanında olduğu gibi. Hadis ayrıca Buhari (307), Müslim (1/166), Ebu Davud (361), İbn Huzeyme (275) ve Bağavi'de de Malik'in sahabelerinin rivayet zincirleriyle bulunmakta olup, kendisi de Temhid'e (22/228) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.106}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, dari Fatimah bint al-Mundhir ibn al-Zubayr, dari Asma bint Abi Bakr, dalam surah tentang haid: Seorang wanita bertanya kepada Nabi apa yang harus dilakukannya jika pakaiannya terkena darah haid. Beliau menyuruhnya untuk mencubitnya dengan jari-jarinya, kemudian memercikkannya dengan air, dan kemudian shalat dengan pakaian tersebut. Peneliti mengklarifikasi bahwa riwayat Yahya \"dari ayahnya\" antara Hisham dan Fatimah adalah kesalahan yang jelas. Versi yang benar adalah bahwa Hisham meriwayatkannya dari istrinya Fatimah, seperti dalam riwayat Muwatta lainnya. Hadits ini juga ditemukan dalam al-Bukhari (307), Muslim (1/166), Abu Dawud (361), Ibn Khuzaymah (275), dan al-Baghawi melalui sanad para sahabat Malik, dan beliau merujuk pada al-Tamhid (22/228). {mengutip:muwatta-maruf-1997 hal.106}"
