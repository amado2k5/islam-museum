label: { ar: "الموطأ 156 — أسماء بنت أبي بكر: دم الحيضة يصيب الثوب فتقرصه وتنضحه", en: "Muwatta 156" }
text: "إذا أصاب ثوب إحداكن الدم من الحيضة فلتقرصه ثم لتنضحه بالماء ثم لتصل فيه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن فاطمة بنت المنذر بن الزبير عن أسماء بنت أبي بكر، في باب جامع الحيضة: سألت امرأة النبي عما تصنع إذا أصاب ثوبها دم الحيضة، فأمرها أن تقرصه بأصابعها ثم تنضحه بالماء ثم تصلي فيه. ويبين المحقق أن رواية يحيى «عن أبيه» بين هشام وفاطمة خطأ بيّن، والصواب أن هشاماً يرويه عن امرأته فاطمة كما في بقية الموطآت؛ ويخرّج الحديث عند البخاري (307) ومسلم (1/166) وأبي داود (361) وابن خزيمة (275) والبغوي من طرق أصحاب مالك، ويحيل على التمهيد (22/228). {cite:muwatta-maruf-1997 p.106}"
