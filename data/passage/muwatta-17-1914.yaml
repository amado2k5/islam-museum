label: { ar: "الموطأ 1914 — مالك عن أبي الزناد عن سعيد بن المسيب: نهي عن بيع الحيوان باللحم، وذكر أبو الزناد أن الكتب كانت تكتب بالنهي في عهود العمال في زمن أبان بن عثمان وهشام بن إسماعيل", en: "Muwatta 1914", es: "Muwatta 1914", fr: "Muwatta 1914", ur: "موطا 1914", tr: "El-Muvatta 1914 — Malik, Ebu el-Zinad'dan, o da Said ibn el-Musayyab'dan rivayetle: Hayvanın eti için satılmasını yasakladı. Ebu el-Zinad, bu yasağın, Aban ibn Osman ve Hişam ibn İsmail dönemindeki yöneticiler zamanında kitaplarda yazılı olduğunu belirtti.", id: "Al-Muwatta 1914 — Malik, berdasarkan riwayat Abu al-Zinad, berdasarkan riwayat Saeed ibn al-Musayyab: Beliau melarang penjualan hewan untuk diambil dagingnya. Abu al-Zinad menyebutkan bahwa buku-buku yang berisi larangan ini telah ditulis pada masa pemerintahan gubernur di era Aban ibn Uthman dan Hisham ibn Ismail." }
summary:
  ar: "يروي مالك عن أبي الزناد عن سعيد بن المسيب أنه كان يقول: نهي عن بيع الحيوان باللحم. قال أبو الزناد: فقلت لسعيد بن المسيب: أرأيت رجلا اشترى شارفا بعشر شياه؟ فقال سعيد: إن كان اشتراها لينحرها فلا خير في ذلك. قال أبو الزناد: وكل من أدركت من الناس ينهون عن بيع الحيوان باللحم. وكان ذلك يكتب في عهود العمال في زمان أبان بن عثمان وهشام بن إسماعيل، ينهون عن ذلك. {cite:muwatta-maruf-1997 p.184}"
  tr: "Malik, Ebu el-Zinad'dan, o da Sa'id ibn el-Musayyab'dan rivayet eder ki, şöyle derdi: \"Hayvanı eti için satmak haramdır.\" Ebu el-Zinad dedi ki: \"Sa'id ibn el-Musayyab'a dedim ki: 'Bir adam on koyun karşılığında bir deve alırsa ne olur?' Sa'id şöyle cevap verdi: 'Eğer onu kesmek için aldıysa, bunda bir hayır yoktur.'\" Ebu el-Zinad dedi ki: \"Tanıdığım herkes, hayvanı eti için satmayı haram kılmıştır. Bu, Eban ibn Osman ve Hişam ibn İsmail zamanındaki valilerin resmi kayıtlarında da yazılıdır ve bunu yasaklamaktadır.\" {cite:muwatta-maruf-1997 s.184}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari Sa'id ibn al-Musayyab, bahwa ia biasa berkata: \"Dilarang menjual hewan untuk diambil dagingnya.\" Abu al-Zinad berkata: \"Aku bertanya kepada Sa'id ibn al-Musayyab: 'Bagaimana jika seseorang membeli unta seharga sepuluh ekor domba?' Sa'id menjawab: 'Jika ia membelinya untuk disembelih, maka tidak ada manfaatnya.'\" Abu al-Zinad berkata: \"Semua orang yang kukenal di antara masyarakat melarang menjual hewan untuk diambil dagingnya. Hal ini tertulis dalam catatan resmi para gubernur pada masa Aban ibn Uthman dan Hisham ibn Ismail, yang melarangnya.\" {cite:muwatta-maruf-1997 p.184}"
