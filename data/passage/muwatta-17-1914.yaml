label: { ar: "الموطأ 1914 — مالك عن أبي الزناد عن سعيد بن المسيب: نهي عن بيع الحيوان باللحم، وذكر أبو الزناد أن الكتب كانت تكتب بالنهي في عهود العمال في زمن أبان بن عثمان وهشام بن إسماعيل", en: "Muwatta 1914" }
summary:
  ar: "يروي مالك عن أبي الزناد عن سعيد بن المسيب أنه كان يقول: نهي عن بيع الحيوان باللحم. قال أبو الزناد: فقلت لسعيد بن المسيب: أرأيت رجلا اشترى شارفا بعشر شياه؟ فقال سعيد: إن كان اشتراها لينحرها فلا خير في ذلك. قال أبو الزناد: وكل من أدركت من الناس ينهون عن بيع الحيوان باللحم. وكان ذلك يكتب في عهود العمال في زمان أبان بن عثمان وهشام بن إسماعيل، ينهون عن ذلك. {cite:muwatta-maruf-1997 p.184}"
