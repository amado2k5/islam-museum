text: "… أبو زيد، وهو مدني مولى بني فهم، من ظرفاء المدينة وأصحاب النوادر فيها، وهو أحد المخنثين المشهورين في العصر الأموي. الأغاني، نهاية الأرب. أبو دلامة : زند بن الجون الأسدي، بالولاء، شاعر مطبوع، من أهل الظرف والدعابة، اتصل بالخلفاء من …"
summary:
  ar: "مقطع من كتاب الحيوان، المجلد المصوَّر 4، ص 454، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Kitab al-Hayawan, scan volume 4, p. 454, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "کتاب الحیوان، اسکین جلد 4، ص 454 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Hayawan, volume numérisé 4, p. 454, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Kitab al-Hayawan, volumen escaneado 4, p. 454, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hayvanlar Kitabı, Resimli Cilt 4, sayfa 454'ten, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makineyle okunabilir resimli baskıdan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Kitab Hewan, Jilid Bergambar 4, halaman 454, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari edisi bergambar yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
