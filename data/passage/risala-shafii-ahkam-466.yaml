text: "… والطمامُ مباحاً لآكلِهِ، حتى يأتىَ عليه كلِّه إن شاء، والأرضُ مباحةً له إذا كانت الله لا لآدميّ، وكان الناسُ فيها شَرَعًا : فهو نُهِيَ فيها عن شىء أن يفملَه، وأُمر فيها بأن يفعلَ شيْثًا غيرَ الذى نُهِيَ عنهُ. - والنَّهْىُ …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 466، يرد فيه ذكر المباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 466, whose wording mentions the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 466 کا اقتباس جس میں مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 466, dont le texte mentionne le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 466, cuyo texto menciona lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 466. sayfasından, izin verilen fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelime olarak alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari risalah Al-Shafi'i, halaman 466, yang menyebutkan amalan-amalan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
