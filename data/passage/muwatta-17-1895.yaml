label: { ar: "الموطأ 1895 — مالك: لا ينبغي أن يشتري الرجل طعاما بربع أو ثلث أو كسر من درهم على أن يعطي بذلك طعاما إلى أجل، ولا بأس بأن يبتاع طعاما بكسر من درهم إلى أجل ثم يعطي درهما ويأخذ ببقية درهمه سلعة", en: "Muwatta 1895" }
summary:
  ar: "قال مالك: ولا ينبغي أن يشتري رجل طعاما بربع أو بثلث أو بكسر من درهم، على أن يعطي بذلك طعاما إلى أجل. ولا بأس أن يبتاع الرجل طعاما بكسر من درهم إلى أجل، ثم يعطى درهما ويأخذ بما بقي له من درهمه سلعة من السلع؛ لأنه أعطى الكسر الذي عليه فضة، وأخذ ببقية درهمه سلعة. فهذا لا بأس به. {cite:muwatta-maruf-1997 p.178}"
