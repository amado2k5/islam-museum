label: { ar: "الموطأ 1895 — مالك: لا ينبغي أن يشتري الرجل طعاما بربع أو ثلث أو كسر من درهم على أن يعطي بذلك طعاما إلى أجل، ولا بأس بأن يبتاع طعاما بكسر من درهم إلى أجل ثم يعطي درهما ويأخذ ببقية درهمه سلعة", en: "Muwatta 1895", es: "Muwatta 1895", fr: "Muwatta 1895", ur: "موطا 1895", tr: "El-Muvatta 1895 — Malik: Bir kimse, yiyeceği çeyrek, üçte bir veya bir dirhem karşılığında, karşılığında borç vererek alma şartıyla satın almamalıdır. Ancak, yiyeceği bir dirhemin bir kısmına borç vererek satın alıp, bir dirhem verip, kalan dirhem karşılığında mal almakta bir sakınca yoktur.", id: "Al-Muwatta 1895 — Malik: Seseorang tidak boleh membeli makanan dengan harga seperempat, sepertiga, atau sebagian kecil dirham dengan syarat ia memberikan makanan sebagai gantinya secara kredit. Namun, tidak ada salahnya membeli makanan dengan harga sebagian kecil dirham secara kredit, kemudian memberikan satu dirham dan menerima barang sebagai gantinya dengan sisa dirham tersebut." }
summary:
  ar: "قال مالك: ولا ينبغي أن يشتري رجل طعاما بربع أو بثلث أو بكسر من درهم، على أن يعطي بذلك طعاما إلى أجل. ولا بأس أن يبتاع الرجل طعاما بكسر من درهم إلى أجل، ثم يعطى درهما ويأخذ بما بقي له من درهمه سلعة من السلع؛ لأنه أعطى الكسر الذي عليه فضة، وأخذ ببقية درهمه سلعة. فهذا لا بأس به. {cite:muwatta-maruf-1997 p.178}"
  tr: "Malik şöyle demiştir: Bir kimse, yiyeceğin parasını daha sonra ödeyeceği şartıyla, dirhemin dörtte biri, üçte biri veya bir kısmı karşılığında yiyecek satın almamalıdır. Ancak, bir kimsenin dirhemin bir kısmı karşılığında veresiye yiyecek satın alıp, tam dirhemini ödeyip, kalan dirhemiyle de mal satın almasında bir sakınca yoktur. Çünkü gümüş değerindeki kısmı vermiş ve dirheminin geri kalanıyla da mal almıştır. Bu caizdir. {cite:muwatta-maruf-1997 s.178}"
  id: "Malik berkata: Seseorang tidak boleh membeli makanan dengan harga seperempat, sepertiga, atau sebagian kecil dirham, dengan syarat ia akan membayar makanan tersebut kemudian. Namun, tidak ada salahnya jika seseorang membeli makanan dengan harga sebagian kecil dirham secara kredit, kemudian membayar satu dirham penuh dan menggunakan sisa dirhamnya untuk membeli barang. Hal ini karena ia memberikan sebagian kecil yang bernilai perak dan menerima barang dengan sisa dirhamnya. Hal ini diperbolehkan. {cite:muwatta-maruf-1997 p.178}"
