label: { ar: "الموطأ 1092 — هشام بن عروة عن أبيه: قال عروة: قلت لعائشة وأنا حديث السن: أرأيت قول الله: إن الصفا والمروة من شعائر الله، فما على الرجل شيء أن لا يطوف بهما؟ فقالت عائشة: كلا، إنما أنزلت في الأنصار كانوا يهلون لمناة", en: "Muwatta 1092", es: "Muwatta 1092", fr: "Muwatta 1092", ur: "موطا 1092", tr: "El-Muvatta 1092 — Hişam ibn Urve, babasından rivayetle: Urve dedi ki: Gençken Aişe'ye şöyle dedim: Allah'ın şu sözü hakkında ne düşünüyorsun: \"Şüphesiz Safa ve Merve, Allah'ın sembollerindendir.\" Bir insanın onları tavaf etmemesinde bir sakınca var mı? Aişe dedi ki: Hayır, bu, Haclarını Manat'a adayan Ensar hakkında indirilmiştir.", id: "Al-Muwatta 1092 — Hisham ibn Urwah, dari ayahnya: Urwah berkata: Aku bertanya kepada Aisyah, ketika aku masih muda: Apa pendapatmu tentang firman Allah: “Sesungguhnya Safa dan Marwah adalah di antara simbol-simbol Allah”? Apakah ada kesalahan jika seseorang tidak mengelilinginya? Aisyah menjawab: Tidak, itu diturunkan mengenai kaum Ansar yang biasa mendedikasikan haji mereka kepada Manat." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، قال: قلت لعائشة أم المؤمنين وأنا حديث السن: أرأيت قول الله تعالى: إن الصفا والمروة من شعائر الله فمن حج البيت أو اعتمر فلا جناح عليه أن يطوف بهما، فما على الرجل شيء أن لا يطوف بهما؟ فقالت عائشة: كلا، لو كان كما تقول لكانت فلا جناح عليه أن لا يطوف بهما. إنما أنزلت هذه الآية في الأنصار، كانوا يهلون لمناة وكانت مناة حذو قديد، فكانوا يتحرجون أن يطوفوا بين الصفا والمروة، فلما جاء الإسلام سألوا رسول الله عن ذلك فأنزل الله الآية. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1316) وسويد (545) وغيرهم. {cite:muwatta-maruf-1997 p.500} {cite:muwatta-maruf-1997 p.501}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek şöyle demiştir: \"Gençken, Müminlerin Annesi Aişe'ye şöyle dedim: 'Allah'ın şu sözü hakkında ne düşünüyorsun: 'Şüphesiz Safa ve Merve, Allah'ın sembollerindendir. Kim Kabe'ye hac yapar veya Umre yaparsa, aralarından geçmesinde bir sakınca yoktur.' Peki, bir kimse aralarından geçmezse ne olur?' Aişe dedi ki: 'Hayır, eğer senin dediğin gibi olsaydı, 'aralarından geçmemesinde bir sakınca yoktur' olurdu.' Bu ayet, haclarını Manat'a adayan Ensar hakkında indirilmiştir. Manat, Kudeyd yakınlarındaydı. Ensar, Safa ve Merve arasında yürümekte tereddüt ederdi. İslam gelince, Allah'ın Resulü'ne bu konuda sordular ve Allah bu ayeti indirdi.\" Araştırmacı, bu hadisin Malik'ten Ebu Musab (1316), Suveyd (545) ve diğerleri tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.500} {cite:muwatta-maruf-1997 s.501}"
  id: "Malik meriwayatkan hadits ini dari Hisham bin Urwah, yang meriwayatkan dari ayahnya, yang berkata: Aku bertanya kepada Aisyah, Umrah kaum Mukminin, ketika aku masih muda: Apa pendapatmu tentang firman Allah Yang Maha Agung: “Sesungguhnya Safa dan Marwa adalah di antara tanda-tanda Allah. Maka barangsiapa yang berhaji ke Baitullah atau berumrah, maka tidak ada celaan baginya jika berjalan di antara keduanya”? Lalu apa salahnya jika seseorang tidak berjalan di antara keduanya? Aisyah menjawab: Tidak, jika memang seperti yang engkau katakan, maka seharusnya “tidak ada celaan baginya jika tidak berjalan di antara keduanya.” Ayat ini diturunkan mengenai kaum Ansar, yang biasa mendedikasikan haji mereka ke Manat, dan Manat terletak dekat Qudayd. Mereka ragu untuk berjalan di antara Safa dan Marwa. Ketika Islam datang, mereka bertanya kepada Rasulullah tentang hal itu, dan Allah menurunkan ayat tersebut. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1316), Suwayd (545), dan lainnya. {kutip:muwatta-maruf-1997 hal.500} {kutip:muwatta-maruf-1997 hal.501}"
