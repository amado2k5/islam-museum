label: { ar: "الموطأ 1092 — هشام بن عروة عن أبيه: قال عروة: قلت لعائشة وأنا حديث السن: أرأيت قول الله: إن الصفا والمروة من شعائر الله، فما على الرجل شيء أن لا يطوف بهما؟ فقالت عائشة: كلا، إنما أنزلت في الأنصار كانوا يهلون لمناة", en: "Muwatta 1092" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، قال: قلت لعائشة أم المؤمنين وأنا حديث السن: أرأيت قول الله تعالى: إن الصفا والمروة من شعائر الله فمن حج البيت أو اعتمر فلا جناح عليه أن يطوف بهما، فما على الرجل شيء أن لا يطوف بهما؟ فقالت عائشة: كلا، لو كان كما تقول لكانت فلا جناح عليه أن لا يطوف بهما. إنما أنزلت هذه الآية في الأنصار، كانوا يهلون لمناة وكانت مناة حذو قديد، فكانوا يتحرجون أن يطوفوا بين الصفا والمروة، فلما جاء الإسلام سألوا رسول الله عن ذلك فأنزل الله الآية. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1316) وسويد (545) وغيرهم. {cite:muwatta-maruf-1997 p.500} {cite:muwatta-maruf-1997 p.501}"
