label: { ar: "تفسير ابن كثير، المجلد المصوَّر 1، ص 167 — الأحرف السبعة، قراءات القرآن", en: "Ibn Kathir's Tafsir, scan volume 1, p. 167 — the seven ahruf; the readings of the Qur'an", ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 167 — سبعہ احرف، قرآن کی قراءتیں", es: "Tafsir de Ibn Kathir, volumen escaneado 1, pág. 167 — los siete ahruf; las lecturas del Corán", fr: "Tafsir d'Ibn Kathir, scan volume 1, p. 167 — les sept ahruf; les lectures du Coran", tr: "İbn Kathir'in Tefsiri, Resimli Cilt 1, s. 167 — Yedi Harf, Kur'an Okunuşları", id: "Tafsir Ibn Kathir, Jilid 1 Bergambar, hlm. 167 — Tujuh Huruf, Bacaan Al-Qur'an" }
text: "… علمائنا كالدَّاوُدِي وابن أبي صفرة وغيرهما: هذه القِرَاءَات السَّبع التي تنسب لهؤلاء القرَّاء السبعة ليست هي الأحرف السَّبعة التي اتَّسعت الصَّحابة في القراءة بها، وإنَّما هي راجعة إلىٰ حرفٍ واحدٍ من السَّبعة وهو الَّذِي جمع عليه عثمان المصحف. ذكره ابن …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 167، يذكر الأحرف السبعة، وقراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 167, that mentions the seven ahruf, the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 167 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 1, pág. 167, que menciona los siete ahruf, las lecturas del Corán, los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Tafsir d'Ibn Kathir (tome 1, p. 167) mentionne les sept ahruf, les lectures du Coran, les lecteurs, la compilation du Coran et les codex. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 167. sayfasından, Kur'an'ın yedi farklı okunuş şeklini, okunuş biçimlerini, okuyucularını ve Kur'an'ın derlenmesini ve el yazmalarını ele alan bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuş biçimleri, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Tafsir Ibn Kathir, Jilid 1, halaman 167, yang membahas tujuh cara membaca, bacaan Al-Quran, para qari, dan penyusunan Al-Quran serta manuskripnya; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
