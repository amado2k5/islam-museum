text: "… به من يتفقد يفقد، ومن لا يعد الصبر من يدخل الجنة ينعم لا يبؤس من يرد اللّٰه به خيراً يصب منه المؤمن عبد بين مخافتين: من ذنب قد مضى لا يدري ما المؤمن غر كريم، والفاجر خب لئيم فهرس الأحاديث …"
