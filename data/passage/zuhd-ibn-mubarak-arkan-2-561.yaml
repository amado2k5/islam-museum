text: "… به من يتفقد يفقد، ومن لا يعد الصبر من يدخل الجنة ينعم لا يبؤس من يرد اللّٰه به خيراً يصب منه المؤمن عبد بين مخافتين: من ذنب قد مضى لا يدري ما المؤمن غر كريم، والفاجر خب لئيم فهرس الأحاديث …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 2، ص 561، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 2, p. 561, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 2، ص 561 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ibn al-Mubarak, volumen 2, pág. 561, que menciona una descripción del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Zuhd d'Ibn al-Mubarak (tome 2, p. 561) contenant une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 561. sayfasından, mümini anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Asketisme), Jilid 2, halaman 561, yang menjelaskan tentang orang beriman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
