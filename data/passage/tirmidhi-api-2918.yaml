text: "… فَرْوَةَ، يَزِيدُ بْنُ سِنَانٍ عَنْ أَبِي الْمُبَارَكِ، عَنْ صُهَيْبٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَا آمَنَ بِالْقُرْآنِ مَنِ اسْتَحَلَّ مَحَارِمَهُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ لَيْسَ إِسْنَادُهُ بِالْقَوِيِّ وَقَدْ خُولِفَ وَكِيعٌ فِي رِوَايَتِهِ. وَقَالَ مُحَمَّدٌ أَبُو فَرْوَةَ يَزِيدُ بْنُ سِنَانٍ الرُّهَاوِيُّ لَيْسَ بِحَدِيثِهِ بَأْسٌ إِلاَّ رِوَايَةَ ابْنِهِ مُحَمَّدٍ عَنْهُ فَإِنَّهُ يَرْوِي عَنْهُ مَنَاكِيرَ. قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2918، يذكر استحلال الشيء، والمحرمات. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2918 (Chapters on The Virtues of the Qur'an), that mentions treating a thing as lawful, the forbidden things. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2918، جس میں کسی چیز کو حلال ٹھہرانا، محرمات کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2918 (Capítulos sobre las virtudes del Corán), menciona lo que es lícito y lo que es ilícito. El Navegador Halal y Haram lo incluye en su lista de textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
