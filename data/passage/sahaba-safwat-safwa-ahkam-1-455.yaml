text: "… سعيد بن العاص القرشي، يكنى أبا الحسن، ويلقب بحبش، ويعرف: بابن أبي الورد. عن علي بن عبد الحميد قال: سمعت محمد بن أبي الورد يقول: هلاك الناس في حرفين: اشتغال بنافلة، وتضييع فريضة، وعمل بالجوارح بلا مواطأة القلب عليه، وإنما …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 455، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 455, whose wording mentions the obligation (farida), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 455 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sifat al-Safwa de Ibn al-Jawzi, volume numérisé 1, p. 455, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
