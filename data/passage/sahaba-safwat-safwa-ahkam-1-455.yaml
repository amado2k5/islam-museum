  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 1. cildinin 455. sayfasından, farz ve nafile amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Sifat al-Safwa\" karya Ibn al-Jawzi, Jilid 1, halaman 455, yang menyebutkan amalan wajib dan amalan sunnah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
