label: { ar: "الموطأ 430 — بلاغ: ابن عمر يستتر براحلته إذا صلى", en: "Muwatta 430" }
summary:
  ar: "أول أثر في باب سترة المصلي في السفر، وهو بلاغ: يروي يحيى عن مالك أنه بلغه أن عبد الله بن عمر كان يستتر براحلته إذا صلى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق رواه عن ابن جريج عن نافع عن ابن عمر بمعناه. {cite:muwatta-maruf-1997 p.223}"
