label: { ar: "الموطأ 430 — بلاغ: ابن عمر يستتر براحلته إذا صلى", en: "Muwatta 430", es: "Muwatta 430", fr: "Muwatta 430", ur: "موطا 430", tr: "El-Muvatta 430 — Rivayet: İbn Ömer namaz kılarken bineğini bir perde gibi kullanırdı.", id: "Al-Muwatta 430 — Riwayat: Ibnu Umar biasa menggunakan kendaraannya sebagai kedok ketika ia shalat." }
summary:
  ar: "أول أثر في باب سترة المصلي في السفر، وهو بلاغ: يروي يحيى عن مالك أنه بلغه أن عبد الله بن عمر كان يستتر براحلته إذا صلى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق رواه عن ابن جريج عن نافع عن ابن عمر بمعناه. {cite:muwatta-maruf-1997 p.223}"
  tr: "Yolculuk sırasında namaz kılmak için sutrah (dua perdesi) kullanılmasına ilişkin ilk rivayet şöyledir: Yahya, Malik'ten rivayet eder ki, Abdullah ibn Umar'ın namaz kılarken bineğini sutrah olarak kullandığını işitmiştir. Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten, Abdül-Razzaq'ın da İbn Cüreyc'ten, o da Nafi'den, o da İbn Umar'dan aynı anlamda rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.223}"
  id: "Riwayat pertama mengenai penggunaan sutrah (layar shalat) untuk shalat saat bepergian adalah sebuah riwayat: Yahya meriwayatkan dari Malik bahwa ia mendengar Abdullah ibn Umar biasa menggunakan kendaraannya sebagai sutrah ketika shalat. Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik, dan bahwa Abd al-Razzaq meriwayatkannya dari Ibn Jurayj, dari Nafi, dari Ibn Umar, dengan makna yang sama. {cite:muwatta-maruf-1997 p.223}"
