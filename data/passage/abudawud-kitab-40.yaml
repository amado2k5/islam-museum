summary:
  ar: "القسم 40 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحدود»، ويضم فيها النصوص من 4351 إلى 4493 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 40 of Sunan Abi Dawud (Prescribed Punishments (Kitab Al-Hudud)) in the division of the open hadith dataset the museum took its reports from: reports 4351 to 4493 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 40، عنوان «کتاب الحدود»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4351 تا 4493۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 40 de Sunan Abi Dawud (Castigos Prescritos (Kitab Al-Hudud)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4351 al 4493 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Abi Dawud (Kitab al-Hudud), dans la section 4351 à 4493 de la base de données ouverte, où il a effectué ses relevés. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
