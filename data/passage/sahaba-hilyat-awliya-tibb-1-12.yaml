text: "… أودع القلوب من ذخائر الفيوب فتى معلقة بمواصلته، فيمومم إليه ثائرة، وأعينهم إليه بالغيب ناظرة. قد أقاء مم على باب النظر من قربه، وأجلسهم على كرامى أطباء أهل ممرفقه. ثم قال : إن أماكم عليل من فقرى فداووه أو مريض …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 12، يذكر الطب والطبيب، والمرض والمريض، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 12, that mentions medicine and the physician, illness and the sick, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 12 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 1, pág. 12, que menciona la medicina y el médico, la enfermedad y los enfermos, la búsqueda de tratamiento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 1 scanné, p. 12, qui mentionne la médecine et le médecin, la maladie et les malades, la recherche de soins; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 1. cildinin 12. sayfasından, tıp ve hekim, hastalık ve hasta ile tedaviye dair bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 1, hlm. 12, yang menyebutkan tentang kedokteran dan dokter, penyakit dan pasien, serta pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
