text: "… أودع القلوب من ذخائر الفيوب فتى معلقة بمواصلته، فيمومم إليه ثائرة، وأعينهم إليه بالغيب ناظرة. قد أقاء مم على باب النظر من قربه، وأجلسهم على كرامى أطباء أهل ممرفقه. ثم قال : إن أماكم عليل من فقرى فداووه أو مريض …"
