text: "ألا صلوا في الرحال"
summary:
  ar: "أول حديث في باب النداء في السفر وعلى غير وضوء. يرويه يحيى عن مالك عن نافع: أذّن عبد الله بن عمر بالصلاة في ليلة ذات برد وريح ثم قال: ألا صلوا في الرحال، وأخبر أن النبي كان يأمر المؤذن إذا كانت ليلة باردة ذات مطر أن يقول ذلك. ويخرّجه المحقق عند البخاري (666) ومسلم (2/147) وأبي داود (1063) والنسائي (2/15) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (13/270). {cite:muwatta-maruf-1997 p.121}"
