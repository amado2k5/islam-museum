text: "… حلّة أربعون درهما، وعلى أن يضيفوا رسل رسول اللّٰه، والي، وجعل لهم ذمّة اللّٰه تعالى وعهده ألا يُفتنوا عن دينهم ولا يُعشروا، وشرط بليهم أن لا يأكلوا الربا ولا يتعاملوا به. فلمّا استخلف أبو بكر عامَلَهم بذلك، فلمّ استخلف عمر …"
