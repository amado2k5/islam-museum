text: "… العشاءَ إلى ثُلُثِ الليل أو نِصْفِه، والتأخير إلى النصف مباح، وبعد النصف مكروه كراهة تحريمية. والمكروه تحريما عند الحنفية ما يعاقب على فعله عقابا أقل من عقاب تارك الفرض، أعني أنه يكون بترك واجب عمدا. ويستحب تعجيلها في يوم الغيم …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 182، يرد فيه ذكر الفرض، والواجب، والمستحب، والمكروه، والمباح، والتحريم، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 6, p. 182, whose wording mentions the obligatory (fard), the obligatory (wajib), the recommended (mustahabb), the disliked (makruh), the permitted (mubah), forbidding (tahrim), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 6، ص 182 کا اقتباس جس میں فرض، واجب، مستحب، مکروہ، مباح، تحریم، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 6, p. 182, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), le recommandé (mustahabb), le réprouvé (makruh), le permis (mubah), l'interdiction (tahrim), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 6, p. 182, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), lo recomendado (mustahabb), lo reprobado (makruh), lo permitido (mubah), la prohibición (tahrim), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
