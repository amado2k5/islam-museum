text: "- - ابن سميد إضعة عشر سنة، فلما كان عند موته قالوا أين نذهب بك ؟ قال: اغسلونى وكفنونى وضعونى على السرير واحلوا فيما بينكم السرير، ففعلوا فوضعوه بباب مسجد الجامع، فجاء الساطان فكشف عن وجهه فغاصه فى المكافور، وكتب …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 7، ص 53، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 7, p. 53, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 7، ص 53 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
