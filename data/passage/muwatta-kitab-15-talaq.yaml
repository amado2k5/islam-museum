label: { ar: "الموطأ، كتاب الطلاق", en: "Muwatta, Book of Divorce (talaq)", es: "Muwatta, Libro del divorcio (talaq)", fr: "Muwatta, Livre du divorce (talaq)", ur: "موطا، کتاب طلاق ⁦(طلاق)⁩", tr: "El-Muvatta, Boşanma Kitabı", id: "Al-Muwatta, Kitab Perceraian" }
summary:
  ar: "كتاب الطلاق، الكتاب الخامس عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 181 نصاً (1581–1761) في خمسة وثلاثين باباً، من الصفحة 59 إلى الصفحة 117 من ملف PDF المجلد الثاني. يبدأ بالبتة وألفاظ الطلاق المختلفة، ثم التمليك والخيار والإيلاء، ثم الظهار واللغو، والخلع واللعان، وطلاق المريض والعبد، وعدة المطلقة، والحكمين وأيمان الطلاق، ثم أجل من لا يمس امرأته، وعدة المتوفى عنها زوجها، وعدة أم الولد والأمة، والعزل، ويختم بالإحداد. {cite:muwatta-maruf-1997 p.59} {cite:muwatta-maruf-1997 p.117}"
  en: "The Book of Divorce, fifteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 181 reports (1581–1761) in thirty-five babs, PDF pp. 59–117 of volume 2, from the irrevocable word al-batta and the words of divorce, through delegation, the oath of abstinence, zihar, khul', li'an, the divorce during illness and of slaves, the 'idda and the two arbiters, the term for a husband who does not touch his wife, the widow's 'idda and residence, the umm walad, 'azl, and mourning."
  es: "El Libro del Divorcio, decimoquinto libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 181 informes (1581–1761) en treinta y cinco babs, PDF pp. 59–117 del volumen 2, desde la palabra irrevocable al-batta y las palabras de divorcio, a través de la delegación, el juramento de abstinencia, zihar, khul', li'an, el divorcio durante la enfermedad y de los esclavos, el 'idda y los dos árbitros, el término para un marido que no toca a su esposa, el 'idda y la residencia de la viuda, el umm walad, 'azl y el duelo."
  fr: "Le Livre du Divorce, quinzième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 181 rapports (1581–1761) dans trente-cinq babs, PDF pp. 59–117 du volume 2, à partir du mot irrévocable al-batta et des mots du divorce, par délégation, le serment d'abstinence, zihar, khul', li'an, le divorce pendant la maladie et des esclaves, l''idda et les deux arbitres, le terme pour un mari qui ne touche pas sa femme, l''idda et la résidence de la veuve, l'umm walad, l'azl et le deuil."
  ur: "کتاب طلاق، موطا کی پندرہویں کتاب یحییٰ بن یحییٰ کی تجدید ⁦(ایڈیشن معارف 1997)⁩، جلد 2 میں: 181 رپورٹس (1581–1761) پینتیس باب میں، پی ڈی ایف پی پی 59–117 جلد 2 کے الفاظ، اور البلاغہ کے الفاظ کے ذریعے۔ وفد، پرہیز کی قسم، ظہار، خلع، لعان، بیماری اور غلاموں کی طلاق، عدت اور دو ثالث، بیوی کو ہاتھ نہ لگانے والے شوہر کی اصطلاح، بیوہ کی عدت اور اقامت، ام ولاد، عجل، اور ماتم۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği, El-Muvatta'nın on beşinci kitabı olan Boşanma Kitabı, Beşar Awad Maruf'un (1997) ikinci cildinde, otuz beş bölümden oluşan 181 metin (1581–1761) içermektedir ve ikinci cildin PDF dosyasının 59. sayfasından 117. sayfasına kadar uzanmaktadır. Kitap, geri alınamaz boşanma ve çeşitli boşanma ifadeleriyle başlar, ardından mülkiyetin devri, opsiyon ve cinsel perhiz yemini, sonra zihar ve boş beyan, hulu' ve li'an, hasta ve kölenin boşanması, boşanmış kadının bekleme süresi, iki hakem ve boşanma yeminleri, ardından karısıyla evlilik ilişkisi olmayan erkeğin bekleme süresi, dul kadının bekleme süresi, efendisine çocuk doğurmuş köle kadının ve cariyenin bekleme süresi, cinsel birleşmenin kesilmesi ve son olarak yas tutma ile sona ermektedir. {cite:muwatta-maruf-1997 s.59} {cite:muwatta-maruf-1997 s.117}"
  id: "Kitab Perceraian, kitab kelima belas dari Al-Muwatta, sebagaimana diriwayatkan oleh Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 181 teks (1581–1761) dalam tiga puluh lima bab, dari halaman 59 hingga halaman 117 dari file PDF Jilid Dua. Kitab ini dimulai dengan perceraian yang tidak dapat dibatalkan dan berbagai ungkapan perceraian, kemudian pengalihan kepemilikan, pilihan, dan sumpah abstain, kemudian zihar dan pernyataan yang sia-sia, khul’ dan li’an, perceraian orang sakit dan budak, masa iddah wanita yang bercerai, dua penengah dan sumpah perceraian, kemudian masa iddah bagi laki-laki yang tidak berhubungan badan dengan istrinya, masa iddah janda, masa iddah budak perempuan yang telah melahirkan anak bagi tuannya dan budak perempuan, coitus interruptus, dan diakhiri dengan masa berkabung. {kutip:muwatta-maruf-1997 hal.59} {kutip:muwatta-maruf-1997 hal.117}"
