label: { ar: "الموطأ، كتاب الطلاق", en: "Muwatta, Book of Divorce (talaq)" }
summary:
  ar: "كتاب الطلاق، الكتاب الخامس عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 181 نصاً (1581–1761) في خمسة وثلاثين باباً، من الصفحة 59 إلى الصفحة 117 من ملف PDF المجلد الثاني. يبدأ بالبتة وألفاظ الطلاق المختلفة، ثم التمليك والخيار والإيلاء، ثم الظهار واللغو، والخلع واللعان، وطلاق المريض والعبد، وعدة المطلقة، والحكمين وأيمان الطلاق، ثم أجل من لا يمس امرأته، وعدة المتوفى عنها زوجها، وعدة أم الولد والأمة، والعزل، ويختم بالإحداد. {cite:muwatta-maruf-1997 p.59} {cite:muwatta-maruf-1997 p.117}"
  en: "The Book of Divorce, fifteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 181 reports (1581–1761) in thirty-five babs, PDF pp. 59–117 of volume 2, from the irrevocable word al-batta and the words of divorce, through delegation, the oath of abstinence, zihar, khul', li'an, the divorce during illness and of slaves, the 'idda and the two arbiters, the term for a husband who does not touch his wife, the widow's 'idda and residence, the umm walad, 'azl, and mourning."
