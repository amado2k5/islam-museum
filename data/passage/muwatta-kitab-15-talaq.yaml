label: { ar: "الموطأ، كتاب الطلاق", en: "Muwatta, Book of Divorce (talaq)" }
summary:
  ar: "كتاب الطلاق، الكتاب الخامس عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 133 نصاً (1581–1713) في سبعة وعشرين باباً، من الصفحة 59 إلى الصفحة 98 من ملف PDF المجلد الثاني. يبدأ بالبتة وألفاظ الطلاق المختلفة، ثم التمليك والخيار والإيلاء، ثم الظهار واللغو، والخلع واللعان، وطلاق المريض والعبد، وعدة المطلقة والمتوفى عنها، ويختم بالحكمين وأيمان الطلاق. {cite:muwatta-maruf-1997 p.59} {cite:muwatta-maruf-1997 p.98}"
  en: "The Book of Divorce, fifteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 133 reports (1581–1713) in twenty-seven babs, PDF pp. 59–98 of volume 2, from the irrevocable word al-batta and the words of divorce, through delegation, the oath of abstinence, zihar, khul', li'an, the divorce during illness and of slaves, to the 'idda and the two arbiters."
