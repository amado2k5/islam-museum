text: "… يَا غُلامُ وَأَعْلِنْ فَلَمَّا قَرَأَ كِتَابَهُ اسْتَخْبَرَهُمْ، فَأَخْبَرُوهُ الخبرَ، فقال رسولُ اللّٰه في كَيْفَ أَصْنَعُ بِالْقَثْلِى ثَلاَثَ مرَّات، فقال رفاعة: أَنتَ يَا رَسُولَ اللَّهِ أَعْلَمُ، لاَ نُحَرّم عليك حَلاَلاً، ولا نحلُ لك حراماً، فقال أبو زيد ابن عمرو: أَطْلِقْ لنا …"
summary:
