label: { ar: "سنن النسائي 588 — الأب والأبوة", en: "Sunan al-Nasa'i 588 — the father and fatherhood", ur: "سنن نسائی 588 — باپ اور والدیت", es: "Sunan al-Nasa'i 588 — El padre y la paternidad" }
text: "… قَالَ حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ حَدَّثَنَا كَثِيرُ بْنُ قَارَوَنْدَا، قَالَ سَأَلْتُ سَالِمَ بْنَ عَبْدِ اللَّهِ عَنْ صَلاَةِ، أَبِيهِ فِي السَّفَرِ وَسَأَلْنَاهُ هَلْ كَانَ يَجْمَعُ بَيْنَ شَىْءٍ مِنْ صَلاَتِهِ فِي سَفَرِهِ فَذَكَرَ أَنَّ صَفِيَّةَ بِنْتَ أَبِي عُبَيْدٍ كَانَتْ تَحْتَهُ فَكَتَبَتْ إِلَيْهِ وَهُوَ فِي زَرَّاعَةٍ لَهُ أَنِّي فِي آخِرِ يَوْمٍ مِنْ أَيَّامِ الدُّنْيَا وَأَوَّلِ يَوْمٍ مِنَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 588، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 588 (The Book of the Times (of Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 588، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 588 (El Libro de los Tiempos de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
