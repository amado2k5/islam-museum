summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أنه كان يقول في آية البقرة في التعريض بخطبة النساء، أن يقول الرجل للمرأة وهي في عدتها من وفاة زوجها إنك علي لكريمة، وإني فيك لراغب، وإن الله لسائق إليك خيرا ورزقا، ونحو هذا من القول. {cite:muwatta-maruf-1997 p.28}"
