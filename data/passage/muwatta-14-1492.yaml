label: { ar: "الموطأ 1492 — عبد الرحمن بن القاسم عن أبيه: معنى آية التعريض بالخطبة في العدة من وفاة الزوج أن يقول إنك علي لكريمة", en: "Muwatta 1492", es: "Muwatta 1492", fr: "Muwatta 1492", ur: "موطا 1492", tr: "El-Muvatta 1492 — Abdülrahman ibn el-Kâsım, babasından rivayetle: Kocanın ölümünden sonraki bekleme döneminde evliliğe işaret eden ayetin anlamı, \"Sen bana çok değerlisin\" demektir.", id: "Al-Muwatta 1492 — Abd al-Rahman ibn al-Qasim, berdasarkan riwayat ayahnya: Arti ayat tentang memberi isyarat tentang pernikahan selama masa iddah setelah kematian suami adalah bahwa ia berkata, “Engkau sangat kusayangi.”" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أنه كان يقول في آية البقرة في التعريض بخطبة النساء، أن يقول الرجل للمرأة وهي في عدتها من وفاة زوجها إنك علي لكريمة، وإني فيك لراغب، وإن الله لسائق إليك خيرا ورزقا، ونحو هذا من القول. {cite:muwatta-maruf-1997 p.28}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, babasından rivayetle, Bakara Suresi'ndeki kadınlara dolaylı yoldan evlilik teklif etme ayeti hakkında şöyle dediğini aktarır: Bir erkek, kocasının ölümünden sonra bekleme döneminde olan bir kadına, \"Sen bana çok sevgilisin, seni istiyorum ve Allah sana iyilik ve rızık verecektir\" ve benzeri ifadeler kullanabilir. {cite:muwatta-maruf-1997 s.28}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, dari ayahnya, bahwa beliau biasa berkata mengenai ayat dalam Surah Al-Baqarah tentang melamar wanita secara tidak langsung, bahwa seorang pria dapat berkata kepada seorang wanita selama masa iddahnya setelah kematian suaminya, “Engkau sangat kusayangi, aku menginginkanmu, dan Allah akan memberikan kebaikan dan rezeki kepadamu,” dan pernyataan serupa lainnya. {cite:muwatta-maruf-1997 p.28}"
