text: "حَدَّثَنَا الْحُسَيْنُ بْنُ الْحَسَنِ الْمَرْوَزِيُّ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ بِشْرِ بْنِ عَاصِمٍ، عَنْ أَبِيهِ، عَنْ أَبِي ذَرٍّ، قَالَ قِيلَ لِلنَّبِيِّ ـ - وَرُبَّمَا قَالَ سُفْيَانُ قُلْتُ - يَا رَسُولَ اللَّهِ ذَهَبَ أَهْلُ الأَمْوَالِ وَالدُّثُورِ بِالأَجْرِ يَقُولُونَ كَمَا نَقُولُ وَيُنْفِقُونَ وَلاَ نُنْفِقُ. قَالَ لِي \" أَلاَ أُخْبِرُكُمْ بِأَمْرٍ إِذَا فَعَلْتُمُوهُ أَدْرَكْتُمْ مَنْ قَبْلَكُمْ وَفُتُّمْ مَنْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 927، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 927 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 927، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
