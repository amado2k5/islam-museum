label: { ar: "سنن ابن ماجه 927 — الأب والأبوة", en: "Sunan Ibn Majah 927 — the father and fatherhood", ur: "سنن ابن ماجہ 927 — باپ اور والدیت", es: "Sunan Ibn Majah 927 — El padre y la paternidad", fr: "Sunan Ibn Majah 927 — le père et la paternité", tr: "Sunan İbn Majah 927 — Baba ve Babalık", id: "Sunan Ibn Majah 927 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا الْحُسَيْنُ بْنُ الْحَسَنِ الْمَرْوَزِيُّ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ بِشْرِ بْنِ عَاصِمٍ، عَنْ أَبِيهِ، عَنْ أَبِي ذَرٍّ، قَالَ قِيلَ لِلنَّبِيِّ ـ - وَرُبَّمَا قَالَ سُفْيَانُ قُلْتُ - يَا رَسُولَ اللَّهِ ذَهَبَ أَهْلُ الأَمْوَالِ وَالدُّثُورِ بِالأَجْرِ يَقُولُونَ كَمَا نَقُولُ وَيُنْفِقُونَ وَلاَ نُنْفِقُ. قَالَ لِي \" أَلاَ أُخْبِرُكُمْ بِأَمْرٍ إِذَا فَعَلْتُمُوهُ أَدْرَكْتُمْ مَنْ قَبْلَكُمْ وَفُتُّمْ مَنْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 927، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 927 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 927، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 927 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 927 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 927 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 927, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
