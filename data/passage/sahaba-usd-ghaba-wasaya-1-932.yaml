text: "… قد أعطى كل ذي حق حقه من الميراث، ولا وصية لوارث، الولد للفراش، وللعاهر الحجر الترمذي:. أَخرجه الثلاثة. قلت: وقد روى أَبو أَحمد العسكري هذا الحديث بإسناده عن عبدالله بن نافع، عن عبد الملك بن قادمة، عن أَبيهِ، عن خارجة …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 932، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 932, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 932 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 932, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 932), mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le répertoire Testaments Browser."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 1, s. 932'sinden bir alıntı; vasiyetname veya son miras ve vasiyetten ve geride bıraktığı miras ve vasiyetten bahsediyor; makineyle okunabilir tıpkıbasım baskısından alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, Jilid Bergambar 1, hlm. 932, yang menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkan sebagai warisan dan harta pusaka; dari edisi faksimili yang dapat dibaca mesin, dan teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh Wills, Inheritances, Antiquities, and Shrines Browser."
