label: { ar: "الموطأ 651 — أبو هريرة: أسرعوا بجنائزكم، فإنما هو خير تقدمونهم إليه أو شر تضعونه عن رقابكم", en: "Muwatta 651", es: "Muwatta 651", fr: "Muwatta 651", ur: "موطا 651", tr: "El-Muvatta 651 — Ebu Hurayra: Cenazelerinizi aceleye getirin, çünkü onları gönderdiğiniz şey ya hayırlı bir şeydir ya da boynunuzdan çıkardığınız şey kötü bir şeydir.", id: "Al-Muwatta 651 — Abu Hurairah: Percepatlah pemakaman kalian, karena itu adalah sesuatu yang baik yang kalian kirimkan ke sana dan sesuatu yang buruk yang kalian singkirkan dari leher kalian." }
text: "أسرعوا بجنائزكم، فإنما هو خير تقدمونهم إليه، أو شر تضعونه عن رقابكم"
summary:
  ar: "آخر حديث في كتاب الجنائز. يرويه مالك عن نافع، أن أبا هريرة قال: أسرعوا بجنائزكم، فإنما هو خير تقدمونهم إليه أو شر تضعونه عن رقابكم. ويذكر المحقق أن في نسخة م «تقدمونه»، وأنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر ⁦(التمهيد 16/31–32)⁩ أن جمهور رواة الموطأ رووه موقوفاً على أبي هريرة، وأن الوليد بن مسلم رفعه عن مالك ولم يُتابع، لكنه مرفوع من غير رواية مالك من حديث نافع عن أبي هريرة عند أحمد (2/488)، ومحفوظ من حديث الزهري عن سعيد بن المسيب عن أبي هريرة مرفوعاً عند البخاري (2/108) ومسلم (3/50) وأبي داود (3181) والترمذي (1015) وابن ماجة (1477) والنسائي، ومن طريق أبي أمامة بن سهل عن أبي هريرة عند مسلم. {cite:muwatta-maruf-1997 p.332}"
  tr: "Cenaze Kitabı'ndaki son hadis. Malik, Nafi'den rivayet ettiğine göre, Ebu Hurayra şöyle demiştir: \"Cenazelerinizi aceleye getirin, çünkü onları ya bir hayıra gönderiyorsunuz ya da kendinizi bir kötülükten kurtarıyorsunuz.\" Editör, M el yazmasında \"göndermek\" ifadesinin geçtiğini ve Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtiyor. İbn Abdül-Barr'dan (el-Tamhid 16/31-32) alıntı yaparak, el-Muvatta'nın ravilerinin çoğunun bunu Ebu Hurayra'nın sözü olarak rivayet ettiğini ve el-Valid ibn Müslim'in bunu Malik seviyesine yükselttiğini, ancak ona uyulmadığını söylüyor. Ancak, bu rivayet, Malik'inkinden farklı bir rivayet zinciriyle, Nafi'nin Ebu Hurayra'dan rivayetiyle Ahmed'de (2/488) Malik seviyesine yükseltilmiştir ve el-Zuhri'nin Sa'id ibn el-Musayyab'dan Ebu Hurayra'dan rivayetiyle Buhari'de (2/108), Müslim'de (3/50), Ebu Davud'da (3181), Tirmizi'de (1015), İbn Majah'da (1477) ve Nesai'de Malik seviyesine yükseltilmiş olarak korunmuştur ve Müslim'de Ebu Umame ibn Sahl'ın Ebu Hurayra'dan rivayetiyle de aynı seviyede olduğu belirtilmiştir. {cite:muwatta-maruf-1997 s.332}"
  id: "Hadits terakhir dalam Kitab Pemakaman. Diriwayatkan oleh Malik dari Nafi’, bahwa Abu Hurayrah berkata: “Segeralah laksanakan pemakaman kalian, karena itu adalah kebaikan yang kalian kirimkan kepada mereka atau keburukan yang kalian singkirkan.” Editor menyebutkan bahwa dalam manuskrip M tertulis “mengirimkan mereka,” dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab dan Suwayd. Ia mengutip Ibn ‘Abd al-Barr (al-Tamhid 16/31–32) bahwa mayoritas perawi al-Muwatta’ meriwayatkannya sebagai pernyataan Abu Hurayrah, dan bahwa al-Walid ibn Muslim mengangkatnya ke tingkat Malik, tetapi ia tidak diikuti. Namun, hadits ini diangkat ke tingkat Malik melalui rantai periwayatan selain Malik, dari Nafi' atas otoritas Abu Hurayrah, dalam Ahmad (2/488), dan hadits ini dipertahankan atas otoritas al-Zuhri atas otoritas Sa'id ibn al-Musayyab atas otoritas Abu Hurayrah, diangkat ke tingkat Malik, dalam al-Bukhari (2/108), Muslim (3/50), Abu Dawud (3181), al-Tirmidhi (1015), Ibn Majah (1477), dan al-Nasa'i, dan melalui jalur Abu Umamah ibn Sahl atas otoritas Abu Hurayrah dalam Muslim. {cite:muwatta-maruf-1997 p.332}"
