label: { ar: "الموطأ 651 — أبو هريرة: أسرعوا بجنائزكم، فإنما هو خير تقدمونهم إليه أو شر تضعونه عن رقابكم", en: "Muwatta 651" }
text: "أسرعوا بجنائزكم، فإنما هو خير تقدمونهم إليه، أو شر تضعونه عن رقابكم"
summary:
  ar: "آخر حديث في كتاب الجنائز. يرويه مالك عن نافع، أن أبا هريرة قال: أسرعوا بجنائزكم، فإنما هو خير تقدمونهم إليه أو شر تضعونه عن رقابكم. ويذكر المحقق أن في نسخة م «تقدمونه»، وأنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 16/31–32) أن جمهور رواة الموطأ رووه موقوفاً على أبي هريرة، وأن الوليد بن مسلم رفعه عن مالك ولم يُتابع، لكنه مرفوع من غير رواية مالك من حديث نافع عن أبي هريرة عند أحمد (2/488)، ومحفوظ من حديث الزهري عن سعيد بن المسيب عن أبي هريرة مرفوعاً عند البخاري (2/108) ومسلم (3/50) وأبي داود (3181) والترمذي (1015) وابن ماجة (1477) والنسائي، ومن طريق أبي أمامة بن سهل عن أبي هريرة عند مسلم. {cite:muwatta-maruf-1997 p.332}"
