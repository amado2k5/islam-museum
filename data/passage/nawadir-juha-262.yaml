text: "… هل هو جمل حتى يعضَّ أُذُن نفسه كان عائداً إلى داره مساء يوم، فتقدّم إليه أحد أولاد الحارة، وقال له : يا سيدي الشيخ إن هذا الولد عضّ أُذُني. فقال الولد المُشتَكى عليه: كلَّا أنا لم أعضَّ أذنه بل عضَّ …"
summary:
  ar: "اشتكى صبي أن صبياً آخر عض أذنه، فقال المتهم إن الآخر عض أذن نفسه، فسأل جحا هل هو جمل حتى يعض أذن نفسه. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  en: "A boy complains that another boy bit his ear, and the accused says the other bit his own ear. Juha asks whether the boy is a camel to bite his own ear. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  ur: "ایک لڑکا شکایت کرتا ہے کہ دوسرے لڑکے نے اس کا کان کاٹ لیا، تو ملزم کہتا ہے کہ اس نے اپنا کان خود کاٹا ہے۔ جحا پوچھتا ہے کہ کیا وہ اونٹ ہے کہ اپنا کان خود کاٹے۔ {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  fr: "Un garçon se plaint qu'un autre lui a mordu l'oreille, et l'accusé dit que l'autre s'est mordu sa propre oreille. Juha demande si ce garçon est un chameau pour se mordre sa propre oreille. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  es: "Un muchacho se queja de que otro le mordió la oreja, y el acusado dice que el otro se mordió su propia oreja. Juha pregunta si ese muchacho es un camello para morderse su propia oreja. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
