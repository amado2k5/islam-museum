label: { ar: "الموطأ 2340 — مالك: المكاتب الذي يعتقه سيده عند الموت يحسب من الثلث بقدر الكتابة", en: "Muwatta 2340" }
summary:
  ar: "قال مالك: أحسن ما سمع في المكاتب يعتقه سيده عند الموت: أن المكاتب يقوم على هيئته التي لو بيع كان ذلك الثمن الذي يبلغ. فإن كانت القيمة أقل مما بقي عليه من الكتابة وضع ذلك في ثلث الميت، ولم يُنظر إلى عدد الدراهم الباقية عليه، لأنه لو قُتل لم يغرم قاتله إلا قيمته يوم قتله، ولو جُرح لم يغرم جارحه إلا دية جرحه يوم جرحه. وإن كان ما بقي عليه من كتابته أقل من قيمته لم يُحسب في الثلث إلا ما بقي من الكتابة، لأن الميت إنما ترك له ما بقي عليه من كتابته فصارت وصية. {cite:muwatta-maruf-1997 p.364} {cite:muwatta-maruf-1997 p.365}"
