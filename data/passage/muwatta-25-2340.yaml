label: { ar: "الموطأ 2340 — مالك: المكاتب الذي يعتقه سيده عند الموت يحسب من الثلث بقدر الكتابة", en: "Muwatta 2340", es: "Muwatta 2340", fr: "Muwatta 2340", ur: "موطا 2340", tr: "El-Muvatta 2340 — Malik: Efendisi tarafından ölüm üzerine azat edilen köle, azat anlaşmasının miktarına göre üçte bir oranında sayılır.", id: "Al-Muwatta 2340 — Malik: Budak yang dibebaskan oleh tuannya setelah meninggal dihitung mulai sepertiga sesuai dengan jumlah yang tercantum dalam perjanjian pembebasan." }
summary:
  ar: "قال مالك: أحسن ما سمع في المكاتب يعتقه سيده عند الموت: أن المكاتب يقوم على هيئته التي لو بيع كان ذلك الثمن الذي يبلغ. فإن كانت القيمة أقل مما بقي عليه من الكتابة وضع ذلك في ثلث الميت، ولم يُنظر إلى عدد الدراهم الباقية عليه، لأنه لو قُتل لم يغرم قاتله إلا قيمته يوم قتله، ولو جُرح لم يغرم جارحه إلا دية جرحه يوم جرحه. وإن كان ما بقي عليه من كتابته أقل من قيمته لم يُحسب في الثلث إلا ما بقي من الكتابة، لأن الميت إنما ترك له ما بقي عليه من كتابته فصارت وصية. {cite:muwatta-maruf-1997 p.364} {cite:muwatta-maruf-1997 p.365}"
  tr: "Malik şöyle dedi: Kölelik sözleşmesiyle köleleştirilmiş ve efendisi ölümünden sonra köleyi azat eden bir kişiyle ilgili duyduğum en iyi görüş, kölenin değerinin, satılsa o fiyata satılacak şekilde, durumuna göre belirlenmesidir. Değeri, azatına karşılık kalan borçtan az ise, bu miktar ölenin mirasındaki üçte bir paya eklenir ve kalan dirhem miktarı dikkate alınmaz. Çünkü eğer öldürülürse, katili sadece ölüm günündeki değerinden sorumlu olur; eğer yaralanırsa, saldırganı sadece yaralandığı günkü kan parasından sorumlu olur. Azatına karşılık kalan borç, değerinden az ise, yalnızca kalan miktar üçte bir paya dahil edilir, çünkü ölen kişi ona sadece azatından kalanını vasiyet etmiştir, bu da onu bir vasiyet haline getirir. {cite:muwatta-maruf-1997 s.364} {cite:muwatta-maruf-1997 s.365}"
  id: "Malik berkata: Pendapat terbaik yang pernah saya dengar mengenai seorang budak yang terikat kontrak pembebasan dan tuannya membebaskannya setelah kematiannya adalah bahwa budak tersebut dinilai berdasarkan kondisinya, sehingga jika ia dijual, ia akan mendapatkan harga tersebut. Jika nilainya kurang dari jumlah sisa yang harus dibayarkan untuk pembebasannya, maka jumlah tersebut ditambahkan ke sepertiga harta warisan almarhum, dan jumlah dirham yang tersisa tidak dipertimbangkan. Hal ini karena jika ia terbunuh, pembunuhnya hanya akan bertanggung jawab atas nilainya pada hari kematiannya, dan jika ia terluka, penyerangnya hanya akan bertanggung jawab atas uang darah yang harus dibayarkan pada hari luka tersebut. Jika jumlah sisa yang harus dibayarkan untuk pembebasannya kurang dari nilainya, hanya jumlah sisa tersebut yang dimasukkan ke dalam sepertiga, karena almarhum hanya mewariskan kepadanya apa yang tersisa dari pembebasannya, sehingga menjadikannya wasiat. {cite:muwatta-maruf-1997 p.364} {cite:muwatta-maruf-1997 p.365}"
