label: { ar: "نوادر جحا الكبرى، ص 152 — «عاتكة بن نصر الدين»", en: "Nawadir Juha al-Kubra, p. 152 — 'Atika, Son of Nasr al-Din'", ur: "نوادر جحا الکبریٰ، ص 152 — «عاتکہ بن نصر الدین»", fr: "Nawadir Juha al-Kubra, p. 152 — « Atika, fils de Nasr al-Din »", es: "Nawadir Juha al-Kubra, p. 152 — «Atika, hijo de Nasr al-Din»", tr: "Cuha'nın Büyük Anekdotları, s. 152 — “Atika bint Nasr al-Din”", id: "Anekdot-Anekdot Hebat Juha, hlm. 152 — “Atika bint Nasr al-Din”" }
text: "… عاتكة بن نصر الدين وُلد للشيخ غلام فقالت له النساء : ضَعْ لهُ أسماً. فبعد أن أذّن في أَذُنيهِ قال له: يا عاتكة بن نصر الدين."
summary:
  ar: "وُلد صبي فطلبت النساء من جحا أن يسميه، فهمس باسم «عاتكة بن نصر الدين»، فاعترضت امرأة مسنة بأن الاسم مؤنث، فقال جحا إن الاسم يذكّره بزوجته التي أحبها. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  en: "A boy is born; the women ask Juha to name the child; he whispers the name 'Atika son of Nasr al-Din'; an older woman objects that the name is female; Juha says the name remembers his wife, whom he loved. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  ur: "ایک لڑکا پیدا ہوا تو عورتوں نے جحا سے کہا کہ اس کا نام رکھے، اس نے سرگوشی میں «عاتکہ بن نصر الدین» نام رکھا، ایک بڑی عمر کی عورت نے اعتراض کیا کہ یہ نام تو مؤنث ہے، تو جحا نے کہا کہ یہ نام اسے اپنی بیوی کی یاد دلاتا ہے جس سے وہ محبت کرتا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  fr: "Un garçon naît ; les femmes demandent à Juha de nommer l'enfant ; il murmure le nom « Atika fils de Nasr al-Din » ; une femme âgée objecte que ce nom est féminin ; Juha répond que ce nom lui rappelle sa femme, qu'il aimait. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  es: "Nace un niño; las mujeres piden a Juha que le ponga nombre; él susurra el nombre «Atika hijo de Nasr al-Din»; una mujer mayor objeta que el nombre es femenino; Juha dice que el nombre le recuerda a su esposa, a quien amaba. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  tr: "Bir oğlan çocuğu doğdu ve kadınlar Juha'dan ona isim vermesini istediler. Juha \"Atika bint Nasr al-Din\" ismini fısıldadı, ancak yaşlı bir kadın ismin kadınsı olduğunu söyleyerek itiraz etti. Juha, ismin kendisine sevgili eşini hatırlattığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 152}"
  id: "Seorang anak laki-laki lahir, dan para wanita meminta Juha untuk memberinya nama. Ia membisikkan nama \"Atika bint Nasr al-Din,\" tetapi seorang wanita tua keberatan, mengatakan bahwa nama itu feminin. Juha menjawab bahwa nama itu mengingatkannya pada istri tercintanya. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
