label: { ar: "الموطأ 1570 — حميد الطويل عن أنس: جاء عبد الرحمن بن عوف وعليه أثر صفرة، فقال له النبي أولم ولو بشاة", en: "Muwatta 1570", es: "Muwatta 1570", fr: "Muwatta 1570", ur: "موطا 1570", tr: "El-Muvatta 1570 — Hamid el-Tavil, Enes'ten rivayetle: Abdurrahman bin Avf üzerinde sarı lekelerle geldi. Peygamber ona, \"Koyunla bile olsa düğün ziyafeti ver,\" dedi.", id: "Al-Muwatta 1570 — Hamid Al-Tawil berdasarkan riwayat Anas: Abd Al-Rahman bin Awf datang dengan bercak kuning di tubuhnya, lalu Nabi berkata kepadanya, “Adakan pesta pernikahan, meskipun hanya dengan seekor domba.”" }
text: "أوْلِمْ وَلَوْ بِشاةِ"
summary:
  ar: "يروي مالك عن حميد الطويل عن أنس بن مالك أن عبد الرحمن بن عوف جاء إلى رسول الله وعليه أثر صفرة، فسأله رسول الله، فأخبره أنه تزوج، فقال كم سقت إليها؟ فقال زنة نواة من ذهب، فقال أولم ولو بشاة. {cite:muwatta-maruf-1997 p.54}"
  tr: "Malik, Humaid el-Tawil'den, o da Enes ibn Malik'ten rivayet eder ki, Abdülrahman ibn Avf, üzerinde sarı izlerle Allah Resulü'nün huzuruna geldi. Allah Resulü ona bunun sebebini sordu ve o da evlendiğini söyledi. Allah Resulü ona ne kadar mehir verdiğini sordu ve o da bir hurma çekirdeği ağırlığında altın olduğunu söyledi. Allah Resulü, \"Koyunla bile olsa düğün ziyafeti ver.\" dedi. {cite:muwatta-maruf-1997 s.54}"
  id: "Malik meriwayatkan dari Humaid al-Tawil, dari Anas ibn Malik, bahwa Abd al-Rahman ibn Awf datang kepada Rasulullah SAW dengan bercak kuning di tubuhnya. Rasulullah SAW bertanya kepadanya tentang hal itu, dan dia mengatakan bahwa dia telah menikah. Rasulullah SAW bertanya kepadanya berapa mas kawin yang diberikannya kepada istrinya, dan dia menjawab bahwa mas kawinnya seberat biji kurma dalam emas. Rasulullah SAW bersabda, \"Adakan pesta pernikahan, meskipun hanya dengan seekor domba.\" {cite:muwatta-maruf-1997 p.54}"
