label: { ar: "صحيح مسلم 2333 — الأب والأبوة", en: "Sahih Muslim 2333 — the father and fatherhood", ur: "صحیح مسلم 2333 — باپ اور والدیت", es: "Sahih Muslim 2333 — El padre y la paternidad", fr: "Sahih Muslim 2333 — Le père et la paternité" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ شُعْبَةَ، عَنْ سَعِيدِ بْنِ أَبِي، بُرْدَةَ عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنِ النَّبِيِّ قَالَ \" عَلَى كُلِّ مُسْلِمٍ صَدَقَةٌ \". قِيلَ أَرَأَيْتَ إِنْ لَمْ يَجِدْ قَالَ \" يَعْتَمِلُ بِيَدَيْهِ فَيَنْفَعُ نَفْسَهُ وَيَتَصَدَّقُ \". قَالَ قِيلَ أَرَأَيْتَ إِنْ لَمْ يَسْتَطِعْ قَالَ \" يُعِينُ ذَا الْحَاجَةِ الْمَلْهُوفَ \". …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2333، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2333 (The Book of Zakat), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2333، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2333 (El Libro del Zakat), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2333 (Le Livre de la Zakat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
