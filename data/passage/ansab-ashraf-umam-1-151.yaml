text: "… قالوا : واعترض الوليدُ بن المغيرة رسول اللّٰه ولِخِ. ومع الوليد عدّة من قريش. منهم الأسود بن المطلب بن أسد بن عبد العزي، والعاص بن وائل السهمي، وأمية بن خلف. فقالوا : يا محمد، هلم، فلنعبد ما تعبد، وتعبد ما …"
