label: { ar: "صحيح مسلم 4031 — نقص قيراط من الأجر كل يوم", en: "Sahih Muslim 4031 — a qirat lost from the reward each day", ur: "صحیح مسلم 4031 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sahih Muslim 4031 — una qirat perdida de la recompensa cada día", fr: "Sahih Muslim 4031 — une qirat perdue pour la récompense chaque jour", tr: "Sahih Müslim 4031 — Her gün sevaptan bir kırat düşülür.", id: "Sahih Muslim 4031 — Satu qirat dikurangi dari pahala setiap hari" }
text: "حَدَّثَنَا عَبْدُ بْنُ حُمَيْدٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنِ اتَّخَذَ كَلْبًا إِلاَّ كَلْبَ مَاشِيَةٍ أَوْ صَيْدٍ أَوْ زَرْعٍ انْتَقَصَ مِنْ أَجْرِهِ كُلَّ يَوْمٍ قِيرَاطٌ \". قَالَ الزُّهْرِيُّ فَذُكِرَ لاِبْنِ عُمَرَ قَوْلُ أَبِي هُرَيْرَةَ فَقَالَ يَرْحَمُ اللَّهُ أَبَا هُرَيْرَةَ كَانَ صَاحِبَ زَرْعٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4031، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4031 (The Book of Musaqah), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4031، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih Muslim, n.° 4031 (El Libro de Musaqah), habla de una qirat que se pierde de la recompensa cada día. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 4031 (Le Livre de la Musaqah), mentionne une qirat (consigne) perdue chaque jour et donc déduite de la récompense. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "Sahih Müslim'de 4031 numaralı hadis, her gün sevabın bir kırat (bir ağırlık birimi) azaldığından bahseder. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesine dahildir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4031, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
