label: { ar: "الموطأ 1648 — مالك: العبد بمنزلة الحر في قذفه ولعانه، غير أنه ليس على من قذف مملوكة حد", en: "Muwatta 1648", es: "Muwatta 1648", fr: "Muwatta 1648", ur: "موطا 1648", tr: "El-Muvatta 1648 — Malik: Bir köle, iftira ve küfür konularında özgür bir insan gibi muamele görür; ancak kadın kölesine iftira eden için belirlenmiş bir ceza yoktur.", id: "Al-Muwatta 1648 — Malik: Seorang budak diperlakukan seperti orang merdeka dalam hal fitnah dan kutukan, kecuali bahwa tidak ada hukuman yang ditetapkan bagi orang yang memfitnah budak perempuannya." }
summary:
  ar: "يقول مالك والعبد بمنزلة الحر في قذفه ولعانه، يجري مجرى الحر في ملاعنته، غير أنه ليس على من قذف مملوكة حد. {cite:muwatta-maruf-1997 p.79}"
  tr: "Malik, bir kölenin iftira ve küfür konularında özgür bir insan gibi muamele gördüğünü; küfür etme konusunda da özgür bir insan gibi muamele gördüğünü, ancak kadın kölesine iftira eden için öngörülen bir ceza bulunmadığını söylüyor. {cite:muwatta-maruf-1997 s.79}"
  id: "Malik mengatakan bahwa seorang budak diperlakukan seperti orang merdeka dalam hal fitnah dan kutukan; ia diperlakukan sama seperti orang merdeka dalam hal kutukan, kecuali bahwa tidak ada hukuman yang ditentukan bagi orang yang memfitnah budak perempuannya. {cite:muwatta-maruf-1997 p.79}"
