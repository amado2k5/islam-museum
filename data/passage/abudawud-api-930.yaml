label: { ar: "سنن أبي داود 930 — ما لا يحل", en: "Sunan Abi Dawud 930 — what is not lawful", ur: "سنن ابی داؤد 930 — جو حلال نہیں" }
text: "… رَسُولُ اللَّهِ - بِأَبِي وَأُمِّي - مَا ضَرَبَنِي وَلاَ كَهَرَنِي وَلاَ سَبَّنِي ثُمَّ قَالَ \" إِنَّ هَذِهِ الصَّلاَةَ لاَ يَحِلُّ فِيهَا شَىْءٌ مِنْ كَلاَمِ النَّاسِ هَذَا إِنَّمَا هُوَ التَّسْبِيحُ وَالتَّكْبِيرُ وَقِرَاءَةُ الْقُرْآنِ \". أَوْ كَمَا قَالَ رَسُولُ اللَّهِ. قُلْتُ يَا رَسُولَ اللَّهِ إِنَّا قَوْمٌ حَدِيثُ عَهْدٍ بِجَاهِلِيَّةٍ وَقَدْ جَاءَنَا اللَّهُ بِالإِسْلاَمِ وَمِنَّا رِجَالٌ يَأْتُونَ الْكُهَّانَ. …"
summary:
  ar: "حديث في سنن أبي داود، رقم 930، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 930 (Prayer (Kitab Al-Salat)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 930، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
