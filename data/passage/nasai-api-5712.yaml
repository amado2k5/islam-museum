label: { ar: "سنن النسائي 5712 — الأب والأبوة", en: "Sunan al-Nasa'i 5712 — the father and fatherhood", ur: "سنن نسائی 5712 — باپ اور والدیت", es: "Sunan al-Nasa'i 5712 — El padre y la paternidad", fr: "Sunan al-Nasa'i 5712 — Le père et la paternité", tr: "Sunan an-Nasa'i 5712 — Baba ve Babalık", id: "Sunan an-Nasa'i 5712 — Sang Ayah dan Peran Ayah" }
text: "أَخْبَرَنَا الْجَارُودُ بْنُ مُعَاذٍ، - هُوَ بَاوَرْدِيٌّ - قَالَ حَدَّثَنَا أَبُو سُفْيَانَ، مُحَمَّدُ بْنُ حُمَيْدٍ عَنْ مَعْمَرٍ، عَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يَكْرَهُ أَنْ يَبِيعَ الزَّبِيبَ، لِمَنْ يَتَّخِذُهُ نَبِيذًا."
summary:
  ar: "حديث في سنن النسائي، رقم 5712، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5712 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5712، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5712 (El Libro de las Bebidas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5712 (Le Livre des Boissons), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 5712 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5712, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
