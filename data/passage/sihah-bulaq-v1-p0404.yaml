  هو جبال قيس والسواد السرار تقول ساودته مساودة وسوادا أى ساررته وأصلدادناء
  سوادك من سواده وهو الشخص وقيل لابنة اللحس لم زنيت وأنت سيدة نساء قومك قالت
  قرب الوساد وطول السواد والسبد الذئب يقال سيدرمل والهع السيدان والانى سيدة
