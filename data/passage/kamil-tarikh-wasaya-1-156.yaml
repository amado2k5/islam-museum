text: "… عليها رسول الله، وَلِيفي، ونزل في حفرتها أبو طلحة. وفيها مات عبد اللّٰه بن أُبِيّ بن سَلول رأس المنافقين، وكان ابتداء مرضه في شوال، فلمّا توفّي جاء ابنه عبد اللّٰه إلى النبيّ، في فسأله قميصَه، فأعطاه، فكفّنه فيه، وجاء رسول …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 156، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 156, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 156 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
