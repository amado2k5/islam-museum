label: { ar: "موطأ مالك 154 — الأب والأبوة", en: "Muwatta Malik 154 — the father and fatherhood", ur: "موطأ مالک 154 — باپ اور والدیت" }
text: "وَحَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ عَمِّهِ أَبِي سُهَيْلِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، أَنَّهُ قَالَ مَا أَعْرِفُ شَيْئًا مِمَّا أَدْرَكْتُ عَلَيْهِ النَّاسَ إِلاَّ النِّدَاءَ بِالصَّلاَةِ."
summary:
  ar: "حديث في موطأ مالك، رقم 154، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 154 (Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 154، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
