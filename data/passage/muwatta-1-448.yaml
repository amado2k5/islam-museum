label: { ar: "الموطأ 448 — أبو سلمة يعيب على عمر بن عبيد الله الجلوس قبل أن يركع، ومالك: حسن وليس بواجب", en: "Muwatta 448", es: "Muwatta 448", fr: "Muwatta 448", ur: "موطا 448", tr: "El-Muvatta 448 — Ebu Seleme, Ömer ibn Ubeyd Allah'ı rükûdan önce oturması nedeniyle eleştirir ve Malik şöyle der: Bu iyidir, ancak farz değildir.", id: "Al-Muwatta 448 — Abu Salama mengkritik Umar ibn Ubayd Allah karena duduk sebelum rukuk, dan Malik berkata: Itu baik, tetapi tidak wajib." }
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي سلمة بن عبد الرحمن أنه قال لأبي النضر: ألم أر صاحبك، يعني عمر بن عبيد الله، إذا دخل المسجد يجلس قبل أن يركع؟ يعيب عليه ذلك. ويروي يحيى عن مالك أن ركعتي الدخول حسن وليس بواجب، وهو في باب انتظار الصلاة والمشي إليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن على ذلك جماعة من الفقهاء. {cite:muwatta-maruf-1997 p.230} {cite:muwatta-maruf-1997 p.231}"
  tr: "Malik, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, o da Ebu Salama ibn Abd el-Rahman'dan rivayet ederek, Ebu el-Nadr'ın Ebu el-Nadr'a şöyle dediğini aktarmıştır: \"Arkadaşını, yani Ömer ibn Ubeydullah'ı, mescide girerken rükû etmeden önce otururken görmedim mi?\" Bunu eleştirmişti. Yahya, Malik'ten rivayet ederek, mescide girerken kılınan iki rekat namazın iyi olduğunu ancak farz olmadığını ve bunun namaza hazırlanmak ve mescide yürümek kategorisine girdiğini belirtmiştir. Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve bir grup fıkıhçının da bu görüşü benimsediğini belirtmektedir. {cite:muwatta-maruf-1997 s.230} {cite:muwatta-maruf-1997 s.231}"
  id: "Malik meriwayatkan hadits ini dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Abu Salama ibn Abd al-Rahman, yang berkata kepada Abu al-Nadr: “Tidakkah aku melihat sahabatmu, maksudku Umar ibn Ubayd Allah, ketika memasuki masjid, duduk sebelum rukuk?” Ia mengkritiknya karena hal itu. Yahya meriwayatkan dari Malik bahwa dua rakaat saat memasuki masjid adalah baik tetapi tidak wajib, dan ini termasuk dalam kategori menunggu shalat dan berjalan menuju masjid. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkan hadits ini dari Malik, dan bahwa sekelompok ahli fiqih berpendapat demikian. {cite:muwatta-maruf-1997 p.230} {cite:muwatta-maruf-1997 p.231}"
