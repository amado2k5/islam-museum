label: { ar: "الموطأ 448 — أبو سلمة يعيب على عمر بن عبيد الله الجلوس قبل أن يركع، ومالك: حسن وليس بواجب", en: "Muwatta 448" }
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي سلمة بن عبد الرحمن أنه قال لأبي النضر: ألم أر صاحبك، يعني عمر بن عبيد الله، إذا دخل المسجد يجلس قبل أن يركع؟ يعيب عليه ذلك. ويروي يحيى عن مالك أن ركعتي الدخول حسن وليس بواجب، وهو في باب انتظار الصلاة والمشي إليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن على ذلك جماعة من الفقهاء. {cite:muwatta-maruf-1997 p.230} {cite:muwatta-maruf-1997 p.231}"
