label: { ar: "سنن أبي داود 2990 — الأب والأبوة", en: "Sunan Abi Dawud 2990 — the father and fatherhood", ur: "سنن ابی داؤد 2990 — باپ اور والدیت", es: "Sunan Abi Dawud 2990 — El padre y la paternidad", fr: "Sunan Abi Dawud 2990 — le père et la paternité" }
text: "… مِنَ الْمَوَالِي قَالَ حَدَّثَنِي الدَّخِيلُ بْنُ إِيَاسِ بْنِ نُوحِ بْنِ مُجَّاعَةَ عَنْ هِلاَلِ بْنِ سِرَاجِ بْنِ مُجَّاعَةَ عَنْ أَبِيهِ عَنْ جَدِّهِ مُجَّاعَةَ أَنَّهُ أَتَى النَّبِيَّ يَطْلُبُ دِيَةَ أَخِيهِ قَتَلَتْهُ بَنُو سَدُوسٍ مِنْ بَنِي ذُهْلٍ. فَقَالَ النَّبِيُّ \" لَوْ كُنْتُ جَاعِلاً لِمُشْرِكٍ دِيَةً جَعَلْتُ لأَخِيكَ وَلَكِنْ سَأُعْطِيكَ مِنْهُ عُقْبَى \". فَكَتَبَ لَهُ النَّبِيُّ بِمِائَةٍ مِنَ الإِبِلِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2990، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2990 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2990، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2990 (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2990 (Tribut, Butin et Domination (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
