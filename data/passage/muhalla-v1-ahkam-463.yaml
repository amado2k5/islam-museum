text: "… نَحن -وللهِ الحَمدُ كَثيرًا - فإنَّ أقوالَ جَميعِ الصَّحابَةِ والتَّابعينَ وكُلَّ مَن بَعدَهم من الفُقهاءِ عِندنا واجِبٌ طلَبُها وضَبطُها والنَّظرُ فيها وعَرضُها علَى القُرآنِ والسُّنَّةُ، كما أمرَنا الله تَعالىٰ، إذ يقول: يَأَيُّهَا الَّذِينَ ءَامَنُوا أَطِيعُوا اللَّهُ وَأَطِيمُوا الرَّسُولَ وَأَوْلِ الْأَمْيِ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 463، يرد فيه ذكر من أطاع الله ورسوله، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 463, whose wording mentions whoever obeys God and His Messenger, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 463 کا اقتباس جس میں جس نے اللہ اور اس کے رسول کی اطاعت کی، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 463, dont le texte mentionne celui qui obéit à Dieu et à Son Messager, l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
