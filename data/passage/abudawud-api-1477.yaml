label: { ar: "سنن أبي داود 1477 — الأحرف السبعة", en: "Sunan Abi Dawud 1477 — the seven ahruf", ur: "سنن ابی داؤد 1477 — سبعہ احرف", es: "Sunan Abi Dawud 1477 - los siete ahruf", fr: "Sunan Abi Dawud 1477 - les sept ahruf", tr: "Sunan Abi Davud 1477 — Yedi Mektup", id: "Sunan Abi Dawud 1477 — Tujuh Surat" }
text: "… النَّبِيُّ \" يَا أُبَىُّ إِنِّي أُقْرِئْتُ الْقُرْآنَ فَقِيلَ لِي عَلَى حَرْفٍ أَوْ حَرْفَيْنِ فَقَالَ الْمَلَكُ الَّذِي مَعِي قُلْ عَلَى حَرْفَيْنِ. قُلْتُ عَلَى حَرْفَيْنِ. فَقِيلَ لِي عَلَى حَرْفَيْنِ أَوْ ثَلاَثَةٍ. فَقَالَ الْمَلَكُ الَّذِي مَعِي قُلْ عَلَى ثَلاَثَةٍ. قُلْتُ عَلَى ثَلاَثَةٍ. حَتَّى بَلَغَ سَبْعَةَ أَحْرُفٍ ثُمَّ قَالَ لَيْسَ مِنْهَا إِلاَّ شَافٍ كَافٍ إِنْ قُلْتَ سَمِيعًا عَلِيمًا عَزِيزًا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1477، يذكر الأحرف السبعة. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Abi Dawud, no. 1477 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions the seven ahruf. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 1477، جس میں سبعہ احرف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1477 (Oración (Kitab Al-Salat): Instrucciones detalladas sobre el Witr), menciona los siete ahruf. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Abi Dawud, n° 1477 (Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), mentionne les sept ahruf. Le catalogue du musée consacré à la lecture et à l’écriture du Coran le répertorie avec les textes du Coran, la Sunna, la sira et les ouvrages traitant de ce sujet."
  tr: "Sunan Abi Davud'da yer alan 1477 numaralı hadiste, Kur'an okumasının yedi farklı şeklinden bahsedilir. Bu hadis, Kur'an okuma, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okuma ve yazma üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1477, menyebutkan tujuh cara membaca Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
