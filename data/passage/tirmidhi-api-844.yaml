text: "… تَزَوَّجَ مَيْمُونَةَ وَهُوَ مُحْرِمٌ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ. وَأَبُو الشَّعْثَاءِ اسْمُهُ جَابِرُ بْنُ زَيْدٍ. وَاخْتَلَفُوا فِي تَزْوِيجِ النَّبِيِّ مَيْمُونَةَ لأَنَّ النَّبِيَّ تَزَوَّجَهَا فِي طَرِيقِ مَكَّةَ فَقَالَ بَعْضُهُمْ تَزَوَّجَهَا حَلاَلاً وَظَهَرَ أَمْرُ تَزْوِيجِهَا وَهُوَ مُحْرِمٌ ثُمَّ بَنَى بِهَا وَهُوَ حَلاَلٌ بِسَرِفَ فِي طَرِيقِ مَكَّةَ وَمَاتَتْ مَيْمُونَةُ بِسَرِفَ حَيْثُ بَنَى بِهَا رَسُولُ اللَّهِ وَدُفِنَتْ بِسَرِفَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 844، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 844 (The Book on Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 844، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 844 (El Libro del Hajj), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 844 (Le Livre du Hajj), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'nin 844 numaralı hadisinde helal olan şeyler belirtilmiştir. Helal ve Haram tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 844, menyebutkan apa yang diperbolehkan (halal). Peramban Halal dan Haram menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
