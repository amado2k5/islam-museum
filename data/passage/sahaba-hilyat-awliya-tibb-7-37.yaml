text: "… الرحمن بن مهدى يقول: الناس يزهمون أن سفيان كان يؤخر المصر، وأشهد لقد تتبع المساجد عندنا التى تعجل ويشرب فيها النبيذ، وأشهد لقد وصفت له دواء فى مرضه فقلت له : نأتيك بنبيذ ؟ فقال: لا ائتنى بعسل وماء. حدثنا …"
