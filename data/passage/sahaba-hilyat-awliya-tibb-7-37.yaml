text: "… الرحمن بن مهدى يقول: الناس يزهمون أن سفيان كان يؤخر المصر، وأشهد لقد تتبع المساجد عندنا التى تعجل ويشرب فيها النبيذ، وأشهد لقد وصفت له دواء فى مرضه فقلت له : نأتيك بنبيذ ؟ فقال: لا ائتنى بعسل وماء. حدثنا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 7، ص 37، يذكر التداوي بالعسل، والمرض والمريض، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 7, p. 37, that mentions honey as a remedy, illness and the sick, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 7، ص 37 کا اقتباس جس میں شہد سے علاج، بیماری اور بیمار، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 7, pág. 37, que menciona la miel como remedio, la enfermedad y los enfermos, el medicamento; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 7 scanné, p. 37, qui mentionne le miel comme remède, maladie et malade, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nu'aym'ın Hilyat al-Awliya' adlı eserinin resimli 7. cildinin 37. sayfasından, bal ile tedavi, hastalık ve hasta ile ilaçtan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 7, hlm. 37, yang menyebutkan pengobatan dengan madu, penyakit dan pasien, serta obat-obatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
