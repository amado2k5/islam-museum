text: "… أقْرَأه على حرفين، فرددت إليه: أن هون على أمتى، فأرسل إلى أن اقرأه على سبعة أحرف، فهذا الحديث يدلّ على أن القرآن لم ينزل من أوّل وَهْلة، بل مرّة بعد أخرى. وفى جمال القراء للسخاوىّ بعد أن حكى القول بنزول …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 2، ص 103، يذكر الأحرف السبعة، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 2, p. 103, that mentions the seven ahruf, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 2، ص 103 کا اقتباس جس میں سبعہ احرف، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 2, pág. 103, que menciona a los siete ahruf, los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de l'ouvrage d'al-Suyuti, al-Itqan fi 'Ulum al-Qur'an (tome 2, page 103), mentionne les sept ahruf, les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 2. cildinin 103. sayfasından, Kur'an'ın yedi farklı okunuş şeklini ve okuyucularını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 2, halaman 103, yang menyebutkan tujuh cara membaca dan para pembacanya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
