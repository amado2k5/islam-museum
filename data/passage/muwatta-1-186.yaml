text: "الصلاة خير من النوم"
summary:
  ar: "بلاغ في باب ما جاء في النداء للصلاة: يروي مالك أنه بلغه أن المؤذن جاء إلى عمر بن الخطاب يؤذنه لصلاة الصبح فوجده نائماً، فقال: الصلاة خير من النوم، فأمره عمر أن يجعلها في نداء الصبح. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن ابن أبي شيبة أخرجه موصولاً من طريق هشام بن عروة عن رجل يقال له إسماعيل، والدارقطني من طريقين عن نافع عن ابن عمر عن عمر، وأن ابن ماجه (716) أخرجه مرفوعاً من حديث سعيد بن المسيب عن بلال بإسناد ضعيف لانقطاعه إذ لم يدرك سعيد بلالاً. {cite:muwatta-maruf-1997 p.120}"
