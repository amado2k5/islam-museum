text: "… عبد العزيز تعجبه هذه الكلمة منه ويغبطه عليها، ولما حكي ذلك للحسن قال : أقالها : قيل نعم، قال: عسى. ولما حضرت بلالا الوفاة قالت امرأته : واحزناه قال: بل واطرباه، غدًا فلقى الأحبة محمدًا وحزبه. وقيل فتح عبد اللّٰه …"
