label: { ar: "الموطأ 1372 — مالك فيمن يقول كفر بالله أو أشرك بالله ثم يحنث: ليس عليه كفارة، وليس بكافر ولا مشرك حتى يضمر قلبه الشرك والكفر", en: "Muwatta 1372" }
summary:
  ar: "يذكر يحيى أن مالكا قال في الرجل يقول كفر بالله، أو أشرك بالله، ثم يحنث، إنه ليس عليه كفارة، وليس بكافر ولا مشرك، حتى يكون قلبه مضمرا على الشرك والكفر، وليستغفر الله، ولا يعد إلى شيء من ذلك، وبئس ما صنع. {cite:muwatta-maruf-1997 p.613}"
