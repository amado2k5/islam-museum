text: "… وجعدة وعصارة الغافت من كل واحد ثلاثة مثاقيل، دهن البلسان ستة مثاقيل، أخلاط أندروخورون خمسة مثاقيل، عسل بقدر الكفاية، الشربة مثل البندقة. مع جلنجبين العسل أوقية. معجون الفودنج: ينفع من أوجاع المعدة والكبد الباردة والاقشعرار الشديد والحميّات ذوات الأدوار. أخلاطه: …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 429، يذكر التداوي بالعسل، والوجع، والحمى والوعك، وأعضاء البدن، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 429, that mentions honey as a remedy, pain, fever, the organs of the body, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 429 کا اقتباس جس میں شہد سے علاج، درد، بخار، اعضائے بدن، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
