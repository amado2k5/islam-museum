text: "هذا بما الجواب باطل برواية البخاري في أواخر كتاب السير في باب كتابة الإمام إبراهيم، حدثنا ابن أخي ابن شهاب، عن عمه، قال: أخبرني ١٨٧ نلفظ بالإسلام. (٤) وأما قوله: ونحن ما بين الستمائة إلى السبعمائة فكذا وقع في مسلم"
