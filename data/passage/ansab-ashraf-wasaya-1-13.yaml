text: "… فلما مات نابت، غلبت جرهم على البيت، فكانوا ولاته وقوامه ما شاء اللّٰه. وتفرق ولدُ إسماعيل من العرب بتهامة، وفي البوادي والنواحي إلا من أقام حول مكة من ولد نزار، تبركاً بالبيت. فلما أرسل اللّٰه جل وعز على ولد سبأ …"
