label: { ar: "الموطأ 1575 — زيد بن أسلم: إذا تزوج أحدكم المرأة أو اشترى الجارية فليأخذ بناصيتها وليدع بالبركة، وإذا اشترى البعير فليأخذ بذروة سنامه", en: "Muwatta 1575", es: "Muwatta 1575", fr: "Muwatta 1575", ur: "موطا 1575", tr: "El-Muvatta 1575 — Zeyd ibn Aslam: Sizden biri bir kadınla evlenirse veya bir cariye satın alırsa, onun alın yelesinden tutsun ve bereket duası etsin. Bir deve satın alırsa, hörgücünün tepesinden tutsun.", id: "Al-Muwatta 1575 — Zayd ibn Aslam: Jika salah seorang dari kalian menikahi seorang wanita atau membeli seorang budak perempuan, hendaklah ia memegang ubun-ubunnya dan berdoa memohon keberkahan. Dan jika ia membeli seekor unta, hendaklah ia memegang puncak punuknya." }
text: "فَلْيأْخُذْ بِنَاصِيتَها، وَلَيدْعُ بِالْبَرَكةِ"
summary:
  ar: "يروي يحيى عن مالك عن زيد بن أسلم أن رسول الله قال إذا تزوج أحدكم المرأة، أو اشترى الجارية، فليأخذ بناصيتها، وليدع بالبركة، وإذا اشترى البعير فليأخذ بذروة سنامه، وليستعذ بالله من الشيطان. ويذكر المحقق أن ابن عبد البر قال إنه مرسل عند جميع رواة الموطأ، ومعناه يستند من حديث عبد الله بن عمرو بن العاص وأبي لاس الخزاعي. {cite:muwatta-maruf-1997 p.56}"
  id: "Yahya meriwayatkan dari Malik, dari Zayd ibn Aslam, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: “Apabila salah seorang dari kalian menikahi seorang wanita atau membeli seorang budak perempuan, hendaklah ia memegang ubun-ubunnya dan memohonkan keberkahan kepadanya. Dan apabila ia membeli seekor unta, hendaklah ia memegang punuknya dan memohon perlindungan kepada Allah dari setan.” Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) menurut semua perawi al-Muwatta, dan maknanya berdasarkan hadits Abdullah ibn Amr ibn al-As dan Abu Las al-Khuza’i. {cite:muwatta-maruf-1997 p.56}"
