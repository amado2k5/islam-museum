label: { ar: "الموطأ 1575 — زيد بن أسلم: إذا تزوج أحدكم المرأة أو اشترى الجارية فليأخذ بناصيتها وليدع بالبركة، وإذا اشترى البعير فليأخذ بذروة سنامه", en: "Muwatta 1575" }
text: "فَلْيأْخُذْ بِنَاصِيتَها، وَلَيدْعُ بِالْبَرَكةِ"
summary:
  ar: "يروي يحيى عن مالك عن زيد بن أسلم أن رسول الله قال إذا تزوج أحدكم المرأة، أو اشترى الجارية، فليأخذ بناصيتها، وليدع بالبركة، وإذا اشترى البعير فليأخذ بذروة سنامه، وليستعذ بالله من الشيطان. ويذكر المحقق أن ابن عبد البر قال إنه مرسل عند جميع رواة الموطأ، ومعناه يستند من حديث عبد الله بن عمرو بن العاص وأبي لاس الخزاعي. {cite:muwatta-maruf-1997 p.56}"
