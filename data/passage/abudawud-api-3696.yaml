label: { ar: "سنن أبي داود 3696 — الحرام، ما حُرّم", en: "Sunan Abi Dawud 3696 — the unlawful; what was made unlawful", ur: "سنن ابی داؤد 3696 — حرام، جو حرام کیا گیا", es: "Sunan Abi Dawud 3696 — lo ilícito; lo que se hizo ilícito", fr: "Sunan Abi Dawud 3696 — l'illicite; ce qui a été rendu illicite" }
text: "… يَا رَسُولَ اللَّهِ فَإِنِ اشْتَدَّ فِي الأَسْقِيَةِ قَالَ \" فَصُبُّوا عَلَيْهِ الْمَاءَ \". قَالُوا يَا رَسُولَ اللَّهِ. فَقَالَ لَهُمْ فِي الثَّالِثَةِ أَوِ الرَّابِعَةِ \" أَهْرِيقُوهُ \". ثُمَّ قَالَ \" إِنَّ اللَّهَ حَرَّمَ عَلَىَّ أَوْ حُرِّمَ الْخَمْرُ وَالْمَيْسِرُ وَالْكُوبَةُ \". قَالَ \" وَكُلُّ مُسْكِرٍ حَرَامٌ \". قَالَ سُفْيَانُ فَسَأَلْتُ عَلِيَّ بْنَ بَذِيمَةَ عَنِ الْكُوبَةِ قَالَ الطَّبْلُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3696، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3696 (Drinks (Kitab Al-Ashribah)), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3696، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3696 (Bebidas (Kitab Al-Ashribah)), menciona lo ilícito y lo que se ha prohibido. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3696 (Boissons (Kitab Al-Ashribah)), mentionne ce qui est illicite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
