  هى المتروكة وتخاذلت مثله وتخاذات رجلاه أى ضعفتا قال الاعشى
  وخذول الرجل من غير كسح • وخذل عنه أصحابه تخذيلا أى حلهم على خذلانه
  وتخاذلوا أى خسذل بعضهم بعضا ورجل خ_ذلة مثال ه-مزة أى خاذل لايزال يخذل
