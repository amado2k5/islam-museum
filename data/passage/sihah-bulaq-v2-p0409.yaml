  خا اللح أ ع صاابلل ل جيعا ⁦(خرمل)⁩ ال بلكسر المأة
  الحقاء مثل الخذعل زل لخزل الشى أى انقطع والاحتزال الاقتطاع يقال اختزه
  عن القوم مثل اختزعه والحوزلى واللخيزلى مشية فيها تفكات مثل اللحوزرى والميزرى
  ⁦( خزعل)⁩ خزعل فى مشيته أى عرج وقال يصف ناقته • متى أردشدتها تخز عل • وناقة
  بها نز عال أى ظلع قال الفراء وليس فى الكلام فهلال مفتوح الفاء من غيرذوات التضعيف
