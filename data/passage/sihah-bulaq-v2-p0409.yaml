text: |-
  ١٧٨
  ويقال فلان خبال على أهله أى عناء والخمال أيضا الهداد وأما الذى فى الخديث من
  قفامؤمنا بماليس فيه وقفه اللّه تعالى فى ردغة الخبال حتى يجىء بالخرج منه فيقال هو
  صديد أهل النار قوله تفاأى قذف والردغة الطينة والخبال الذى فى شعر لبيداسم فرس
  وأخبلته المال اذا أعرته ناقة لينتفع بألبانها وأوبارها أوة رسايغز وعليه وهو مثل الأكفه
  ومنه قول زهير (١ هذالك ان يستخباوا المال يخبلوا * (ختل ختله وشاتله أى
  وان بسثلوا يساواوان بيسروايغاوا
  خدعه والتخائل التضادع خنل) خثلة البطن مابين السرّة والعانة وكذات
  انخئلة باتحريك ⁦(خجل)⁩ اخعل التهير والدهش من الاستحياهوقد خجل خملا وأخيله
  غيره والخجل أيضاسبوء احتمال الغف وفى الحديث اذاشبعتن خيلتنّ أى أشرتن وبطرتن
  ورحسل خبل وبه خيلة أى حياء والخيل المكان المكثير العشب الممتف وفى حديث أب
  قوله فوجداً ينقه فيه فى تسجضة
  هريرة رضى اللّٰه عنه أن رجلاضلت له أينق فأتى على وادخيل مغن معشب فوجد أ ينقه فيه
  بعده والحيبل من النساء البذية
  ( ⁦(خدل)⁩ امرأة خدلاء بينة الهدل والحد الة وهى الممتاثة الساقين والذراعين وكذلك
  الدضاباه ولم يذكر فى القاموص
  انخدلم بالسكسر والميم زائدة قال الراجز
  ليست بكروا ولكن خدلم • ولايزلاء ولكن سهم
  ويقال مخلئلها خدل أى نهم ⁦(خذل)⁩ خسذله خذلانا اذاترك عونه وتصرته قال
  الاصمى اذا تخلف الظبي عن القطيع قيسل خذل قال الشاءر يصف فرسا
  فهوكالدنوبكف المتق • خذات عنه العراقى فانجذم
