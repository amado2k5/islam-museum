label: { ar: "الموطأ 2173 — مالك عن عمرو بن يحيى المازني عن أبيه: ساق الضحاك بن خليفة خليجا له من العريض، فأراد أن يمر به في أرض محمد بن مسلمة فأبى، فأمره عمر أن يخلي سبيله، فقال: لا، فقال عمر: والله ليمرن به ولو على بطنك، فمر به الضحاك", en: "Muwatta 2173", es: "Muwatta 2173", fr: "Muwatta 2173", ur: "موطا 2173", tr: "El-Muvatta 2173 — Malik, Amr ibn Yahya el-Mazini'den, o da babasından rivayetle: El-Dahhak ibn Halife'nin el-Arid'de sahip olduğu bir kanal vardı ve Muhammed ibn Maslama'nın topraklarından geçmek istiyordu, ancak o reddetti. Ömer ona geçmesine izin vermesini emretti, ancak o: Hayır dedi. Ömer dedi ki: Allah'a yemin ederim ki, karnının üzerinde sürünerek bile geçecektir. Böylece El-Dahhak geçti.", id: "Al-Muwatta 2173 — Malik, berdasarkan riwayat Amr ibn Yahya al-Mazini, berdasarkan riwayat ayahnya: Al-Dahhak ibn Khalifa mempunyai sebuah kanal di al-Arid, dan ia ingin melewati tanah milik Muhammad ibn Maslama, tetapi ia menolak. Umar memerintahkannya untuk membiarkannya lewat, tetapi ia berkata: Tidak. Umar berkata: Demi Allah, ia akan melewatinya meskipun kau harus merangkak dengan perutmu. Maka al-Dahhak pun melewatinya." }
summary:
  ar: "يروي مالك عن عمرو بن يحيى المازني عن أبيه أن الضحاك بن خليفة ساق خليجا له من العريض، فأراد أن يمر به في أرض محمد بن مسلمة، فأبى محمد، فقال له الضحاك: لم تمنعني وهو لك منفعة، تشرب به أولا وآخرا، ولا يضرك؟ فأبى محمد. فكلم فيه الضحاك عمر بن الخطاب، فدعا عمر محمد بن مسلمة، فأمره أن يخلي سبيله. فقال محمد: لا. فقال عمر: لم تمنع أخاك ما ينفعه، وهو لك نافع، تسقي به أولا وآخرا، وهو لا يضرك؟ فقال محمد: لا. والله. فقال عمر: والله ليمرن به ولو على بطنك. فأمره عمر أن يمر به، ففعل الضحاك. {cite:muwatta-maruf-1997 p.291}"
  tr: "Malik, Amr ibn Yahya el-Mazini'den, o da babasından rivayet ettiğine göre, el-Dahhak ibn Halife'nin el-Aridh'te kendisine ait bir su kanalı vardı. Bu kanalı Muhammed ibn Maslamah'ın arazisinden geçirmek istedi, ancak Muhammed reddetti. El-Dahhak ona, \"Sana faydalı olan bir şeyi neden engelliyorsun? İstediğin zaman ondan su içebilirsin, sana zarar vermez.\" dedi. Muhammed yine de reddetti. Bunun üzerine el-Dahhak, Ömer ibn el-Hattab'a durumu anlattı. Ömer, Muhammed ibn Maslamah'ı çağırdı ve geçmesine izin vermesini emretti. Muhammed, \"Hayır.\" dedi. Ömer, \"Kardeşine faydalı olan bir şeyi neden engelliyorsun? Sana da faydalı olan bir şeyi istediğin zaman onunla arazini sulayabilirsin, sana zarar vermez.\" dedi. Muhammed, \"Hayır, Allah'a yemin ederim.\" dedi. Ömer, \"Allah'a yemin ederim ki, geçecektir, gerekirse karnının üzerinden bile geçecektir.\" dedi. Bunun üzerine Ömer ona bunu vermesini emretti ve el-Dahhak da öyle yaptı. {cite:muwatta-maruf-1997 s.291}"
  id: "Malik meriwayatkan dari Amr ibn Yahya al-Mazini, yang juga meriwayatkan dari ayahnya, bahwa al-Dahhak ibn Khalifah memiliki sebuah kanal di al-Aridh. Ia ingin mengalirkan kanal itu melalui tanah milik Muhammad ibn Maslamah, tetapi Muhammad menolak. Al-Dahhak berkata kepadanya, \"Mengapa engkau menghalangiku padahal itu bermanfaat bagimu? Engkau dapat minum dari kanal itu kapan saja, dan itu tidak akan membahayakanmu.\" Muhammad tetap menolak. Maka al-Dahhak berbicara kepada Umar ibn al-Khattab tentang hal itu. Umar memanggil Muhammad ibn Maslamah dan memerintahkannya untuk mengizinkannya lewat. Muhammad berkata, \"Tidak.\" Umar berkata, \"Mengapa engkau menghalangi saudaramu dari sesuatu yang bermanfaat baginya, padahal itu juga bermanfaat bagimu? Engkau dapat mengairi tanahmu dengan kanal itu kapan saja, dan itu tidak akan membahayakanmu.\" Muhammad berkata, \"Tidak, demi Allah.\" Umar berkata, \"Demi Allah, ia akan melewatinya, meskipun harus melewati perutmu.\" Maka Umar memerintahkannya untuk menyampaikan hal itu, dan al-Dahhak pun melakukannya. {cite:muwatta-maruf-1997 p.291}"
