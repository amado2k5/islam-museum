label: { ar: "الموطأ 2173 — مالك عن عمرو بن يحيى المازني عن أبيه: ساق الضحاك بن خليفة خليجا له من العريض، فأراد أن يمر به في أرض محمد بن مسلمة فأبى، فأمره عمر أن يخلي سبيله، فقال: لا، فقال عمر: والله ليمرن به ولو على بطنك، فمر به الضحاك", en: "Muwatta 2173" }
summary:
  ar: "يروي مالك عن عمرو بن يحيى المازني عن أبيه أن الضحاك بن خليفة ساق خليجا له من العريض، فأراد أن يمر به في أرض محمد بن مسلمة، فأبى محمد، فقال له الضحاك: لم تمنعني وهو لك منفعة، تشرب به أولا وآخرا، ولا يضرك؟ فأبى محمد. فكلم فيه الضحاك عمر بن الخطاب، فدعا عمر محمد بن مسلمة، فأمره أن يخلي سبيله. فقال محمد: لا. فقال عمر: لم تمنع أخاك ما ينفعه، وهو لك نافع، تسقي به أولا وآخرا، وهو لا يضرك؟ فقال محمد: لا. والله. فقال عمر: والله ليمرن به ولو على بطنك. فأمره عمر أن يمر به، ففعل الضحاك. {cite:muwatta-maruf-1997 p.291}"
