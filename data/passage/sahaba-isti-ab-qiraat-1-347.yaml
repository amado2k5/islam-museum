text: "… ومعاذين حبل وابي بن كعب وابو زيد هذا قال ابو عمرائما اريد بهذا. لحديث الانصار و قد جمع القرآن على عهد رسول اللّه جماعة منهم عثمان بن عفان وعلي وعبد الّه اين مسمو دو عبد اللّه بن عمرو إن العاص …"
