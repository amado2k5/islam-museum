label: { ar: "سنن أبي داود 1601 — الأب والأبوة، النسب والانتساب", en: "Sunan Abi Dawud 1601 — the father and fatherhood; paternity and lineage", ur: "سنن ابی داؤد 1601 — باپ اور والدیت، نسب اور انتساب", es: "Sunan Abi Dawud 1601 — El padre y la paternidad; paternidad y linaje" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عَبْدَةَ الضَّبِّيُّ، حَدَّثَنَا الْمُغِيرَةُ، - وَنَسَبَهُ إِلَى عَبْدِ الرَّحْمَنِ بْنِ الْحَارِثِ الْمَخْزُومِيِّ - قَالَ حَدَّثَنِي أَبِي، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ شَبَابَةَ، - بَطْنٌ مِنْ فَهْمٍ - فَذَكَرَ نَحْوَهُ قَالَ مِنْ كُلِّ عَشْرِ قِرَبٍ قِرْبَةٌ وَقَالَ سُفْيَانُ بْنُ عَبْدِ اللَّهِ الثَّقَفِيُّ قَالَ وَكَانَ يُحَمِّي لَهُمْ وَادِيَيْنِ زَادَ فَأَدَّوْا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1601، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1601 (Zakat (Kitab Al-Zakat)), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1601، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1601 (Zakat (Kitab Al-Zakat)), menciona al padre y la paternidad, la linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
