text: "إِنَّ اللهَ فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَنَهَى عَنْ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رُخْصَةً لَكُمْ، لَيْسَ بِنِسْيَانٍ، فَلَا تَبْحَثُوا عَنْهَا"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 5، ص 2896، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والفرض، والرخصة، وما سُكت عنه فهو عفو؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 5, p. 2896, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (fard), the concession (rukhsa), what was passed over in silence and so pardoned; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 5، ص 2896 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، فرض، رخصت، جس سے سکوت کیا گیا وہ معاف ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin de al-Nawawi, volume numérisé 5, p. 2896, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), la dispense (rukhsa), ce qui fut passé sous silence et donc pardonné ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen digitalizado 5, p. 2896, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), la dispensa (rukhsa), lo que se pasó en silencio y quedó dispensado; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin 5. cildinin 2896. sayfasından bir alıntı, farz olan fiiller ve görevler, Allah ve Resulü'nün emrettiği şeyler, farz olan fiil, muafiyet ve söylenmeyenlerin caiz olduğu konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz fiiller, görevler, itaat işleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Riyad as-Salihin karya an-Nawawi, Volume 5, halaman 2896, membahas tentang amalan dan kewajiban yang wajib, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, amalan yang wajib, keringanan, dan apa yang tidak disebutkan yang diperbolehkan. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
