text: "الضرورية الذاتية المشروطة في البرهان وتبطل المواضع التي هي لباب كتاب الجدل. وهي التي يؤخذ منها الوسط الجامع بين الطرفين في القياس، ولا يبقى إلا القياس الصوري، ومن التعريفات المساوئ في الصادقية على إفراد المحمود، لا يكون أعم منها، فيدخل"
