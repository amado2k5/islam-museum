text: |-
  •⁦(نصف)⁩,
  قان الاصمعى أى ينتسفون الكلام انتسافالا يتمونه من الفرق يهمس-ون به رو يدامن الفرف:
  فهو خفى لثلا ينذر بهم ولانهم فى أرض عدوّ وقوله فضء را أى اجتمعوا أوضعوا اليهم دوابهم
  ورحالهم ويقال ه-مايتناسفان الكلام أى يتساران ونسف الطعام نفضه والمنسف
  ما ينسف به الطعام وهوشئ طويل منصوب الصدر أ علاه هى تفع والنسافة ما يقط منه
  يقال اعزل انتسافة وكل الخالص ويقال أتانافلان كأن لحيته منسف حكاء أبونصرأحد
  بن حاتم والمنسفة آلة يقلع بها البنا عن أبي زيد ويقال انتسف لونه أى امتقمع وبعير نسوف
  يقتلح الكللا من أصله بمقدم ذه وابل مناسيف ويقال للفرس انه لنسوف السنبك
  اذا أدناه من الارض فى عدوه وكذلك اذا أدنى الفرس عرفقيه من الحزام وذلك انها.
  يكون لتقارب مرفقيه وهو محمود قال بشر بن أبي خازم
  نوف لحزام؟ رفقيها • يستخواء طبيها الغبار
  ألاترى الى قول الجعدى
  فى مر فقيه تقارب وله • بركة زور كبيأة الخزم
  شف نشف الثوب العرق بالكسر وتشف الحوض الماء ينشفه نشفاشر به وتنشفه
  كذلك وأرض نشفة بسنة النشف بالتحريك اذا كانت تنتف الماء والنشف أيضاجارة
  الحرّة وهى سودكاً نها محترقة والنشف بالتسكين لغة فيه الواحدة نشفة قال أبو عمر وهى التى
  تدلك بماالارخل وأنشد
  طوبى لمن كانت له هرشفه • ونشفة عملامنها كفه
  قال ابن السكيت النشافة الرغوة التى تعلو اللبن اذاحلب وقد ا تتشفت اذاشر بتها ويقول
  الصىّ انشفى أى أعطنى النسافة أشربها ويقال أمست ابلكم تنشف وترغى أى اهانشافة
  ورغوة من التفشيف والترغية ⁦(نصف)⁩ النصف أحدشتى الشئ والنصف أيضا النصفة
  وهو الاسم من الانصاف قال الفرزدق
  ولكن نصف الوسييت وسبنى * بنو عبد شمس من مناف وهاشم
  والنصن بالضم لغة فى النصف وقر أزيد بن ثابت رضى المّه عنه فلها النصف واناء نصفان بالفتح
  أى باغ الماءنصفه والنصف بالتحريك المرأة بين الحدثة والمسنة وتصغيرها نصيف بلاهء
  لانهاصفة ونسا أنصاف ورجل نصف وقوم أنصاف ونصفون عن يعسقوب والنصف
  أيضا الخدام الواحد ناصف والناصفة مجرى الماء والجمع النواصف ومنه قول طرفة
  كأن حدوج المالكية غدوة * خلايا سفين بالنواصف من دد
  وقال الاصمحى "النواصف رحاب "والنصيف الجمار قال التايغة
  سقط التصيف ولم ترداسقاطه • قتناواته واتقتناناليد
  والنصيف نصف الشئ والتصيف مكيال ومنه قول الشاعر
  لم يغذها مد ولانصيف • ولا غميرات ولا تعجيف
  وفى الحديث ما بلغتم مد أجدهم ولا نصيفه ونصفت الشىء اذا بلغت نصفه تقول نصفت القرآن
  أى بلغت النصف ونصف عمره ونصف الشيب رأسه ونصف الازارساقه قال أبوجندب
  صحاج
  نى
