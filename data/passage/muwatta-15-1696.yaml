label: { ar: "الموطأ 1696 — يحيى بن سعيد عن سعيد بن المسيب: الكراء في بيت المطلقة على الزوج، فإن لم يكن فعليها، فإن لم يكن عندها فعلى الأمير", en: "Muwatta 1696", es: "Muwatta 1696", fr: "Muwatta 1696", ur: "موطا 1696", tr: "El-Muvatta 1696 — Yahya ibn Sa’id, Sa’id ibn al-Musayyab’dan rivayetle: Boşanmış kadının evinin kirası kocanın sorumluluğundadır; eğer koca müsait değilse, kadının sorumluluğundadır; eğer kadın da müsait değilse, yöneticinin sorumluluğundadır.", id: "Al-Muwatta 1696 — Yahya ibn Sa’id berdasarkan riwayat Sa’id ibn al-Musayyab: Sewa rumah bagi wanita yang bercerai adalah tanggung jawab suami; jika suami tidak ada, maka itu menjadi tanggung jawab istri; jika istri tidak ada, maka itu menjadi tanggung jawab penguasa." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن سعيد بن المسيب سئل عن المرأة يطلقها زوجها وهي في بيت بكراء، على من الكراء؟ فقال على زوجها، فإن لم يكن عنده فعليها، فإن لم يكن عندها فعلى الأمير. {cite:muwatta-maruf-1997 p.93}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Sa'id ibn al-Musayyab'a, kiralık bir evde oturan ve kocası tarafından boşanan bir kadın hakkında soru sorulduğunu aktarır. Kiradan kim sorumludur? Sa'id ibn al-Musayyab şöyle demiştir: Kocası. Eğer ödeyemezse, kadın sorumludur. Eğer ödeyemezse, yönetici sorumludur. {cite:muwatta-maruf-1997 s.93}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Sa'id ibn al-Musayyab ditanya tentang seorang wanita yang diceraikan suaminya sementara ia tinggal di rumah sewa. Siapa yang bertanggung jawab atas uang sewa? Dia menjawab: Suaminya. Jika suaminya tidak mampu membayarnya, maka istrinyalah yang bertanggung jawab. Jika suaminya juga tidak mampu membayarnya, maka penguasa yang bertanggung jawab. {cite:muwatta-maruf-1997 p.93}"
