text: "… الزواج بالنوم رأى في منامه أنَّ بعض النساء من جاراته اجتمعن عليه وقلن له: لقد وجدنا لك زوجةً مناسبةً، فهبَّ جحا مذعوراً، وأخذ يُوقظ امرأتَهُ قائلاً لها: قومي يا قليلة الغيرةِ، فيا اللَّه ما أكسلكِ، لأنَّك مع كونك نائمةً بجانبي …"
summary:
  ar: "حلم جحا أن نساء الجيران وجدن له عروساً، فأيقظ زوجته وأمرها أن تطرد النساء وإلا صارت له ضرة. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  en: "Juha dreams that neighbour women have found a bride for him; he wakes his wife and tells her to chase the women away or she will have a co-wife. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  ur: "جحا نے خواب دیکھا کہ پڑوس کی عورتوں نے اس کے لیے دلہن ڈھونڈ لی ہے، تو اس نے اپنی بیوی کو جگایا اور کہا کہ ان عورتوں کو بھگا دے، ورنہ اس کی سوکن آ جائے گی۔ {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  fr: "Juha rêve que les voisines lui ont trouvé une épouse ; il réveille sa femme et lui dit de chasser ces femmes, sinon elle aura une coépouse. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  es: "Juha sueña que las vecinas le han encontrado una novia; despierta a su esposa y le dice que ahuyente a esas mujeres, o tendrá una coesposa. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
