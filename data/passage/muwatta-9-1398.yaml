summary:
  ar: "يروي مالك عن ابن شهاب أنه قال ما نحر رسول الله عنه وعن أهل بيته إلا بدنة واحدة أو بقرة واحدة. قال مالك لا أدري أيهما قال ابن شهاب. ويذكر المحقق أن بعضهم رواه عن الزهري عن عمرة عن عائشة، والظاهر أن الزهري لم يسمعه من عمرة. {cite:muwatta-maruf-1997 p.626}"
