summary:
  ar: "يروي مالك عن ابن شهاب أنه قال ما نحر رسول الله عنه وعن أهل بيته إلا بدنة واحدة أو بقرة واحدة. قال مالك لا أدري أيهما قال ابن شهاب. ويذكر المحقق أن بعضهم رواه عن الزهري عن عمرة عن عائشة، والظاهر أن الزهري لم يسمعه من عمرة. {cite:muwatta-maruf-1997 p.626}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa beliau berkata: “Rasulullah shalla Allahu alaihi wa sallam hanya menyembelih satu unta atau satu sapi untuk dirinya dan keluarganya.” Malik berkata: “Saya tidak tahu mana di antara keduanya yang dikatakan Ibnu Shihab.” Peneliti menyebutkan bahwa ada yang meriwayatkannya dari al-Zuhri, dari ‘Amrah, dari ‘Aisyah, tetapi tampaknya al-Zuhri tidak mendengarnya dari ‘Amrah. {cite:muwatta-maruf-1997 p.626}"
