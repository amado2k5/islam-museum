label: { ar: "مسلم 2449 — إنما فاطمة بضعة مني", en: "Muslim 2449 — Fatima is a part of me" }
text: "قال رسول الله: «إنما ابنتي بضعة مني، يُريني ما رابها ويؤذيني ما آذاها»، وفي رواية: «إنما فاطمة بضعة مني يؤذيني ما آذاها»"
summary:
  ar: "رواية المسور بن مخرمة في باب فضائل فاطمة من صحيح مسلم؛ حديث البضعة — النبي يجعل أذى فاطمة أذاه — من أعمدة نصوص منزلتها عند أهل السنة."
