summary:
  ar: "بلغ مالكا أن سعيد بن المسيب قال في رجل هلك وترك ثلاثة بنين وموالي أعتقهم، ثم هلك اثنان من بنيه وتركا أولادا: إن الباقي من الثلاثة يرث ولاء الموالي، فإذا هلك فولده وولد إخوته في ولاء الموالي سواء. {cite:muwatta-maruf-1997 p.340}"
