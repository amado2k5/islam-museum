label: { ar: "جامع الترمذي 1493 — عدد الحسنات", en: "Jami' al-Tirmidhi 1493 — a stated number of good deeds", ur: "جامع ترمذی 1493 — نیکیوں کی مقررہ تعداد" }
text: "… حُصَيْنٍ وَزَيْدِ بْنِ أَرْقَمَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ مِنْ حَدِيثِ هِشَامِ بْنِ عُرْوَةَ إِلاَّ مِنْ هَذَا الْوَجْهِ. وَأَبُو الْمُثَنَّى اسْمُهُ سُلَيْمَانُ بْنُ يَزِيدَ. رَوَى عَنْهُ ابْنُ أَبِي فُدَيْكٍ. - قَالَ أَبُو عِيسَى وَيُرْوَى عَنْ رَسُولِ اللَّهِ أَنَّهُ قَالَ \" فِي الأُضْحِيَةِ لِصَاحِبِهَا بِكُلِّ شَعَرَةٍ حَسَنَةٌ \". وَيُرْوَى \" بِقُرُونِهَا \"."
summary:
  ar: "حديث في جامع الترمذي، رقم 1493، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 1493 (The Book on Sacrifices), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 1493، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
