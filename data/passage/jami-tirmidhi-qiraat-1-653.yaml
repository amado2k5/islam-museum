text: "… بْنُ سُلَيْمَانَ أَبُو عُمَرَ بَزَّازٌ كُوفِيٌّ يُضَعَفُ فِي الْحَدِيثِ. المعجم - باب ما جاء في فضل القرآن التحفة - حَدَّثَنَا عَبْدُ بْنُ حُمَيْدٍ: حَدَّثَنَا حُسَيْنُ ابْنُ عَلِيِّ الجُعْفِيُّ قَالَ : حَدَّثَنَا حَمْزَةُ الزَّيَّاتُ عَنْ أَبِي الْمُخْتَارِ الطَّائِيِّ، عَنِ ابْنِ أَخِي …"
summary:
