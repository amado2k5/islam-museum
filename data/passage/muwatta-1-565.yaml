label: { ar: "الموطأ 565 — رفاعة بن رافع: ربنا ولك الحمد حمداً كثيراً طيباً مباركاً فيه، وبضعة وثلاثون ملكاً يبتدرونها", en: "Muwatta 565" }
text: "لقد رأيت بضعة وثلاثين ملكاً يبتدرونها، أيهم يكتبهن أولاً"
summary:
  ar: "يرويه مالك عن نعيم بن عبد الله المجمر عن علي بن يحيى الزرقي عن أبيه عن رفاعة بن رافع الزرقي، قال: كنا يوماً نصلي وراء النبي، فلما رفع رأسه من الركعة وقال: سمع الله لمن حمده، قال رجل وراءه: ربنا ولك الحمد حمداً كثيراً طيباً مباركاً فيه. فلما انصرف النبي سأل من المتكلم آنفاً، فقال الرجل: أنا يا رسول الله. فأخبره النبي أنه رأى بضعة وثلاثين ملكاً يبتدرونها أيهم يكتبها أول. ويذكر المحقق أن في بعض النسخ «أيهم يكتبها أول» وكله بمعنى كما بينه الزرقاني، وأنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (1910) والبغوي، وروح بن عبادة وابن وهب عند ابن خزيمة (614)، والقعنبي عند البخاري (799) وأبي داود (770) والحاكم والبيهقي، وابن القاسم عند النسائي (2/196). {cite:muwatta-maruf-1997 p.290} {cite:muwatta-maruf-1997 p.291}"
