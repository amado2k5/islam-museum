  ريجانشوة بالسكسرأى شهوت قال الهذلى
  وتشيت ريح الموت من تلقاتهم • وخشيت وقع مهند قرضاب
  واستقشيت مثله قال ذوالرمة • واستفشى الغرب• ويقال أيضانشيت الخيراذ اتخبرت
  ونظرت. ن أين جاء يقال من أين نشيت هذا الخيرأى من أين عله قال يعقوب الذتب
  يسستنشئ الريح بالهمزوانماهو من نشيت غير مهموز ورجل نشيان للاخبار بين النشوة
