  وانتميت الذى اخترته وهذه نصيتق وتذريت بق فلان وتنصيتهم اذا تزوجت فى الذروة منهم
  والناصية وتنصت الرأة رجلت شعرها وانتصى الشعرأى طال والنصى تبت مادام رطبا
