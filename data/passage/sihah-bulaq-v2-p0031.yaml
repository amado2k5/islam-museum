  للكسرة ورجل نشوان أى سكران بين النتوة بالفتح وزعبييونس أنه ممع فيه ننوة بالكسر
  وقد اتشي أى سكر وقول الشاعر
  وقالواقد جننت فقلت كلا • ور بى ماجننت ولا انتشيت
  يريدولا يكيت من سكر والنشاهو النشاستج فارمى معرب حذف شعاره تخفيفا كما قالوا
  للمنازل مناء نصا، الناصية واحدة التواصى ونصوته قيضت على ناصيته قالت عاتشة
  رضى اللٰه عنم امالسكم تتصون مبنكم أى تمدون ناصيته كانها كرهت تسربح رأس الميت
  والناصاة الناصية بلغة طى وقال
  لق-د اذنت أهل المامة طى • بحرب ناصاة الخصان المشهر
  ونواصى الناس أشرافهم وقال
  ومشهد قد كفيت الغاتيين به • فى مجمع من قواصى الناس مشهرد
  والنصية من القوم الفياروكذلك من الابل وغيرهاوهى البقية وأنشدأيوعر والمرار
