label: { ar: "الموطأ 689 — مالك: من عليه دين وعنده عروض وفاء له وناض سوى ذلك زكى الناض؛ وإن لم يكن إلا وفاء دينه فلا زكاة", en: "Muwatta 689" }
summary:
  ar: "قول لمالك يختم به باب الزكاة في الدين: الأمر عندنا في الرجل يكون عليه دين وعنده من العروض ما فيه وفاء لدينه وعنده من الناض سوى ذلك ما تجب فيه الزكاة: أنه يزكي ما بيده من الناض؛ وإن لم يكن عنده من العروض والنقد إلا وفاء دينه فلا زكاة عليه حتى يكون عنده من الناض فضل عن دينه ما تجب فيه الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.346}"
