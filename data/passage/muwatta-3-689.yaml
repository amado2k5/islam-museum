label: { ar: "الموطأ 689 — مالك: من عليه دين وعنده عروض وفاء له وناض سوى ذلك زكى الناض؛ وإن لم يكن إلا وفاء دينه فلا زكاة", en: "Muwatta 689", es: "Muwatta 689", fr: "Muwatta 689", ur: "موطا 689", tr: "El-Muvatta 689 — Malik: Bir kimsenin borcu varsa ve bu borcu ödemeye yetecek kadar malı ve başka varlıkları varsa, malvarlığı üzerinden zekât vermelidir; fakat sadece borcunu ödemeye yetecek kadar malı varsa, zekât verme yükümlülüğü yoktur." }
summary:
  ar: "قول لمالك يختم به باب الزكاة في الدين: الأمر عندنا في الرجل يكون عليه دين وعنده من العروض ما فيه وفاء لدينه وعنده من الناض سوى ذلك ما تجب فيه الزكاة: أنه يزكي ما بيده من الناض؛ وإن لم يكن عنده من العروض والنقد إلا وفاء دينه فلا زكاة عليه حتى يكون عنده من الناض فضل عن دينه ما تجب فيه الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.346}"
  tr: "Malik, borç zekâtı hakkındaki bölümü şu ifadeyle sonlandırıyor: Borcu olan ve borcunu ödemeye yetecek kadar malı ve zekâtın ödenmesi gereken miktarın ötesinde nakdi bulunan kimse hakkında hükmümüz şudur: Sahip olduğu nakde zekât verir. Ancak, sadece borcunu ödemeye yetecek kadar malı ve nakdi varsa, zekâtın ödenmesi gereken borcunun ötesinde nakde sahip olana kadar zekât vermekle yükümlü değildir. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.346}"
  id: "Malik mengakhiri bab tentang zakat atas hutang dengan pernyataan ini: Hukum Kami mengenai seseorang yang memiliki hutang dan memiliki harta benda yang cukup untuk melunasinya, serta uang tunai melebihi jumlah yang wajib dizakati, adalah bahwa ia membayar zakat atas uang tunai yang dimilikinya. Namun, jika ia hanya memiliki harta benda dan uang tunai yang cukup untuk melunasi hutangnya, maka ia tidak wajib membayar zakat sampai ia memiliki uang tunai melebihi jumlah hutangnya yang wajib dizakati. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.346}"
