text: "… وَلَلفِ ثم مَرَّ بهم الثالثةَ فغمزوه بمثلها، فَوَقَفَ، ثم قال: أَتَسْمَعُونَ يَا مَعْشَرَ قُرَيْشٍ، أَمَا وَالَّذِي نَفْسِي بِيَلِهِ، لَقَدْ جِثْتُكُمْ بِالذَّبْحِ قال: فَأَخَذَتِ القَوْمَ كلمتُهُ، حتَّى ما منهم رَجُلٌ إلاً كأنما على رَأْسِهِ طَائِرٌ وَاقِعٌ، حتى إنَّ أَشَدَّهُمْ فيه وَصَاة …"
