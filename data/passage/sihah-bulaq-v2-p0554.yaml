text: |-
  ٣٣
  ولم تذق من البقول فستقا • وقال آخر • كأحرعاد * وقال آخوجائف القرعة أصنع
  حسب أنّ القرعة معمولة وقول من قال كل صائع عند العرب اسكاف فغير معروف
  رأسكفة الباب عتبته ( لف سافت الارض أسلفها سلفا اذاسو يتها بالمسلفة وهى
  ثى تسوّى به الارض وفى حديث عبيد بن عمير أرض الجنة مسلوفة قال الاصمعىّ هى
  المسستوية أو المسواة وسلف يسلف سلفا مثال طلب يطلب طلبا أى حضى والقوم السلاف
  المتق-دمون وسلف الرجل آباؤه المتقدمون والج-ع أسلاف وسلاف والساف نوع من
  البيوع يعجل فيه الثمن وتضبط السلعة بالوصف الى أجل معلوم وقد أسلفت فى كذا
  واستسلفت منه دراهم وتسافت فأسلفى والسلف بالتسكين الجراب الضخم والسلفة بالضم
  ما يتعجله الرجل من الطعام قسل الغداء تقول منه سلفت الرجل نسليفا والنسلف أيضا
  التقسديم وساف الرجل زوج أخت امر أنه وكذلك سلف_← مثال كذب وكذب وكبدوكبد
  والمسلف من الفساء التى بلغت خسا وأر بعيز ونحوها وهووصف خص به الاناث قال
  لشاعر * فيهاثلاث كالد مى وكاعب ومسلف • والسالفة ناحية مقدم العنق من لدن
  معلق القرط الى قلت الترقوة والسالف والسليف المتقدّم والسلوف الناقة تكون فى أوائل
  الابل اذا وردت الماء والسلاف ماسال من عصير العنب قبل أن يعصر وتسمى الخمر
  -لافا وسلافة كل شي عصرته أوله والسلفان أولاد الحجل الواحد ساف مثل صرد
  وصردان قال أبو عمروولم نسمع سلفسة للانى ولوقيل سلفة كماقيل سلكة لواحدة السلكان
  لكان جيدا قال الشاءر
  أعالج سلفاناصغاراتخالهم • اذادرحوابجر الحواصل حرا
  وقال آخر * خطفنه خطف القطاعى السلف • ⁦(سلحف)⁩ السلحفاة :فتح اللام
  واحدة السلا«ف قال أبو عبيد وحكى الرؤاسى سلهحفية مثال بلهنية وهو ملاق بالهاسى
  :ألف واغاصارت يالكسرة ماقبلها نف قال أبوع روالسنف بالسكسر
  ورقة المرخ وقال غيره وعاءغمر المرخ قال الشاعر ٢
  تقلقل ،ن فأس اللهام اسانه • تقلقل سنف المرخ فى جعبة صفر
  وتشبه يه آذان الخيل قان الخليل السناف للبعير عنزلة اللبب للدابة ومنعقول الراجز
  أبقى السناف أثرابأنمضه • وقال الاصمعى السناف حبل تشده من التصدير ثم تقدمه حتى
  جعله وراء الكركرة فيثبت التصدير فى موضعه قال واغايفعل ذلك اذاخص بطن البعير
  واضطرب تصديره وقد سنفت البعير أسنفه وأستفه اذائددت عليه السناى وأبى
  الاصمعىَ الاأسنفت والمسناف البعير الذى يؤخر الرحل فيجعل له سناف ويقال للذى يقدّم
  الرحسل وأسنف الفرص أى تقدم الخيل فاذاسمعت فى الشعر مسنفة بكسر النون فهى من
  هذا وهى القرس تتقدم الخيل فى سيرها واذاسمعت مسنفة يفتح الذون فهن الناقة من
  السناف أى ندعليها ذلكْ وربما قالوا أسنفوا أمرهم أى أحكموه وهواستعارة من
  هذا ويقال فى المثل لمن تحيرف أمرهعى بالاسناف وف صفت الشئ أسوفه
  موفا اذا شممته والاحتياف الاشتمام والمس:فذالبعمد وأصلها من الشم وكان الدليل
  جاح
  قوله كأحرعاد قال فى مادّة حر
  وأحرتودلب قدارين سالف
  عاقرناقصالح عليه السلام
  وانما قال زهير كأ حر عاد لا قامة
  الوزن1 الم يمكنه أن يقول عمود
  أووهم فيه قال أبو عبيد وقد قال
  بعض النساب ان مودا من عاد اه
  كتبه الممحمح
  ٢ ف نسضة زيادة هوابن مقبل اه
