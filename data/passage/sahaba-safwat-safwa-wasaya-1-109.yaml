text: "… فيهن خللاً تقدم فكبّر، وربما قرأ سورة يوسف أو النحل أو نحو ذلك في الركعة الأولى حتى يجتمع الناس، فما هو إلا أن كبّر فسمعته يقول : قتلني أو أكلني الْكَلْبُ - حين طعنه - فطار العلج بسكين ذات طرفين …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 109، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 109, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 109 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de Sifat al-Safwa de Ibn al-Jawzi, volumen 1, pág. 109, que menciona un lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 1, p. 109), mentionnant un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 1. cildinin 109. sayfasından, ölüm anı ve ölüme dair bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 1, halaman 109, yang membahas saat kematian dan proses sekarat; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
