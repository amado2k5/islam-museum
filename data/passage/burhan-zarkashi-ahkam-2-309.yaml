text: "… وهو متكئ فاستوى جالسًا، وقال: أكره أن أحدث عن رسول الله وَلِ لم وأنا متكىء، وكلام الله تعالى أولى. ويستحب أن يكون متوضئًا، ويجوز للمحدث. قال إمام الحرمين وغيره: لا يقال : إنها مكروهة فقد صح أنه وَلِي كان يقرأ …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 309، يرد فيه ذكر المستحب، والمكروه، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 309, whose wording mentions the recommended (mustahabb), the disliked (makruh), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 309 کا اقتباس جس میں مستحب، مکروہ، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volume numérisé 2, p. 309, dont le texte mentionne le recommandé (mustahabb), le réprouvé (makruh), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen digitalizado 2, p. 309, cuyo texto menciona lo recomendado (mustahabb), lo reprobado (makruh), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Al-Zarkashi'nin \"Al-Burhan fi Ulum al-Qur'an\" adlı eserinin 2. cildinin 309. sayfasından, müstehaplı, mekruhlu ve haram olan fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz olan fiiller, görevler, itaat gerektiren fiiller, müstehaplı fiiller, mekruhlu fiiller, haram olan fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 2, halaman 309, yang menyebutkan amalan yang dianjurkan, yang tidak disukai, dan yang dilarang; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pembaca yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
