label: { ar: "صحيح مسلم 5330 — الأب والأبوة", en: "Sahih Muslim 5330 — the father and fatherhood", ur: "صحیح مسلم 5330 — باپ اور والدیت" }
text: "حَدَّثَنَا يَحْيَى بْنُ يَحْيَى التَّمِيمِيُّ، وَعَبْدُ اللَّهِ بْنُ عَوْنٍ الْهِلاَلِيُّ، - قَالَ يَحْيَى أَخْبَرَنَا وَقَالَ ابْنُ عَوْنٍ، حَدَّثَنَا - إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ جَعْفَرٍ، قَالَ رَأَيْتُ رَسُولَ اللَّهِ يَأْكُلُ الْقُثَّاءَ بِالرُّطَبِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5330، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5330 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5330، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
