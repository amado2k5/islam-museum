text: "… عنها فكتموه فقال: أما إنه جاء تأويل رؤيا يوسف بعد أربعين - يعني: سنة-. - حدثنا ابن عُلَيَّة عن أيوب قال: سأل رجل محمداً قال: رأيت كأني آكل خَبِيصاً في الصلاة؟ فقال: الخبيص حلال، ولا يحل لك الأكل في الصلاة، …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 6681، يذكر الحلال، وما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 6681, that mentions the lawful, what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 6681 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
