  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 6681. sayfasından, caiz olan, izin verilen ve caiz olmayan şeyleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
