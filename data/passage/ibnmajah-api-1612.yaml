label: { ar: "سنن ابن ماجه 1612 — بكاء على ميت أو نياحة وحدودها", en: "Sunan Ibn Majah 1612 — weeping over the dead, or wailing and its limits", ur: "سنن ابن ماجہ 1612 — میت پر رونا، یا نوحہ اور اس کی حدود", fr: "Sunan Ibn Majah 1612 — des pleurs sur un défunt, ou la lamentation et ses limites", es: "Sunan Ibn Majah 1612 — llanto por un difunto, o el lamento y sus límites" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، قَالَ حَدَّثَنَا سَعِيدُ بْنُ مَنْصُورٍ، حَدَّثَنَا هُشَيْمٌ، ح وَحَدَّثَنَا شُجَاعُ بْنُ مَخْلَدٍ أَبُو الْفَضْلِ، قَالَ حَدَّثَنَا هُشَيْمٌ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ، عَنْ جَرِيرِ بْنِ عَبْدِ اللَّهِ الْبَجَلِيِّ، قَالَ كُنَّا نَرَى الاِجْتِمَاعَ إِلَى أَهْلِ الْمَيِّتِ وَصَنْعَةَ الطَّعَامِ مِنَ النِّيَاحَةِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1612، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1612 (Chapters Regarding Funerals), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1612، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Ibn Majah, n° 1612, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Ibn Majah, n.º 1612, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
