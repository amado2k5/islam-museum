text: "… بالحديدو وحبس فى المطبق فى رجب وفيها ا اغارت الروم على سُمَيْساط: فقتلوا وسبوا نحوًا من خمسمائة وغزا على بن يحيى الارمنى الصائفة، ومنع اهل لولُونا رئيسهم من الصعود اليها ثلثين يوما فبعث ملك الروم.القضافى الشاعر ,القُناعى.. ;، عشرة بموسى …"
