text: |-
  OVA
  ان الشباب رامح من باءه • والشيب ليس لبائعيه تجار
  يعى من اشتراه وفى الحديت لايخطب الرجل على خطبة أخيه ولايبع على ييع أخيه يعنى
  لا يشترى على شراء أخيه فانما وقع النهى على المشترى لا على البائع والشئ مبيع ومييوع مثل
  مخيط ومخيوط عسلى النقص والتمام قال اخليل الذى حذف من مبيع واومفعول لانها
  زائدة وهى اولى بالحذف وقال الاخفش المحسذوفة عين الفعل لام-م لماسكنوا الياء ألقوا
  حركتهاءلى الحرف الذى قبله افانضمت ثم أبدلوا من الضمة كسرة الياء التى بعدها
  ثم حذفت اليساء وانقلبت الواوياء (كما ا(نقلبت وأوميزان للكسرة قال المازّنى كلاالة ولين
  حسن وقول الاخفس أقيس والبياعة السلعة ويقال للبائع والمشترى البيعان وأبعت
  الشئعرضته قال الاجدع الهمدانى
  ورضيت آلاء الكميت فن يبع * فرسافليس جواد جباع آلاؤه خصاله الجميله
  والابتباع الاشتراء تقول بيع الشى على مالم يسم فاعله ان شئت كسرت الباءوان شئت ضممبتها
  ومنهم من يقلب اليساءواوافية ول بوع الشي وكذلكْ القول فى كيل وقيل وأشباههما وبايعته
  من البيع والبيعة جميعا والتبابع مثله واستبعته الشى أى سألله أن يبعه منى والبيعة
  بالكسر للنصارى ويقال أيضا إنه لحسن البيعة من البيع مثل الركبة والجلسة
  ⁦( صل التاء تتبع)⁩ تبعت القوم ببعا وتباعة بالفتح اذا مشيت خلقهم أو مروا
  لن غضيت معهم وكذلك ايبعتهم وهوافتعلت وأتبعت القوم على أفعلت اذا كانو اقد سبة ول
  فلهقتهم وأتبعت أيضاغيرى يقال أسبعته الشئ قتبعه قال الاخفش تبعته واتبعته بمعنى
  مثل ردفته وأردفته ومنه قوله تعالى الامن خطف الخطفة فآبعه ومنه الأتساع
  فى الكلام مثل حسن بسن وقبيح شقيح والتبع يكون واحداوبماعة قأل اللّٰه تعالى انا كنا
  الكم سبها ويجمع على أتباع وتابعه على كذا متابعة وتباعا والتباع الولاء قال أبوزيد يقال
  تابع الرجَل عمله أى أتقنه وأحكمه وفى حديت أبي واقد اللبى تابعنا الاعمال فلم فجدشيئًا
  أبلغ فى طلب الآخرة من الزهد فى الدنيا أى أحكمنا ها وءرفناها وتتبعت التئ تتبعا
  أى قطلبته منتبعاله وكذلك تتبعته تتبيعا وقول القطاعى
  منع الاتباع موتخ الامح عجاذا و اتباعة مل الية قال النامر اتياعا
  اكات حنيفة ربها : زمن التقحم والمجاعه * لم يحذروا من ربهم * سوء العواقب والتباعه
  لانهم كانواقد اتخذوا الهامن حيس فعبدوه زما نائم أصابتهم مجاعة فأكلوه والتبيع الذى
  للك عليه مال يقال اتبع فلان بفلان أى أحيل له عليه والتبيع التابع وقوله تعالى ثم لا تجدوا
  كم علينا يد تيها قال القرّاء أى ثائراولا طالبساوهو بعنف تابع والتييع ولد البقرة فى أول
  سنة والاتى تبيعة والجمع تساع وتسائع مثل أفيل وأفائل عن أبى عمرو وقولهم معه تابعة
  أى من الجز والتسابعة ملوك الين الواحد تبع والتبع أيضا الظل وقال أبوذؤيب
  يرد الميام حضيرة ونفضة * ورد القطاة اذا اسمال التبع
  والتبع أيضاضرب من الطيعر ترع حوض ترع بالتجريك وكونترع أى ممتلى وقد ترع
  الانا بالكسر يترع تعاأى امتلأ وأزعته أنا وجفنة مترعة وتترع اليه بالشرأى تسرع
  وهو
