text: "… بَصير، فكان يُصلَى بهم ويُفرّضهم ويُجمّعهم، وهم سامعون له مطيعون. فلمّا بلغ سُهَيلَ بن عمرو قتلُ أَبى بصير المعامريّ اشتدً ذلك عليه وقال : والله ما صالحْنا محمَّدًا على هذا. أى يفصل الحلال والحرام والحدود. لسان العرب، ج، ص. ويجمعهم: …"
