label: { ar: "سنن ابن ماجه 324 — ما كرهه الفقهاء، ما كُره", en: "Sunan Ibn Majah 324 — what the jurists disliked; what was disliked", ur: "سنن ابن ماجہ 324 — جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا", fr: "Sunan Ibn Majah 324 — ce que les juristes ont réprouvé ; ce qui fut réprouvé", es: "Sunan Ibn Mayah 324 — lo que los juristas reprobaron; lo que se reprobó", tr: "Sunan İbn Majah 324 — Fıkıhçıların hoşlanmadığı, hoş karşılanmayan şeyler", id: "Sunan Ibn Majah 324 — Apa yang tidak disukai oleh para ahli hukum, apa yang tidak disukai" }
text: "… الْحَذَّاءِ، عَنْ خَالِدِ بْنِ أَبِي الصَّلْتِ، عَنْ عِرَاكِ بْنِ مَالِكٍ، عَنْ عَائِشَةَ، قَالَتْ ذُكِرَ عِنْدَ رَسُولِ اللَّهِ ـ قَوْمٌ يَكْرَهُونَ أَنْ يَسْتَقْبِلُوا بِفُرُوجِهِمُ الْقِبْلَةَ فَقَالَ \" أُرَاهُمْ قَدْ فَعَلُوهَا اسْتَقْبِلُوا بِمَقْعَدَتِي الْقِبْلَةَ \". قَالَ أَبُو الْحَسَنِ الْقَطَّانُ حَدَّثَنَا يَحْيَى بْنُ عُبَيْدٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ الْمُغِيرَةِ، عَنْ خَالِدٍ الْحَذَّاءِ، عَنْ خَالِدِ بْنِ أَبِي الصَّلْتِ، مِثْلَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 324، يرد فيه ذكر ما كرهه الفقهاء، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 324 (The Book of Purification and its Sunnah), whose wording mentions what the jurists disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 324، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 324, dont le texte mentionne ce que les juristes ont réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 324, cuyo texto menciona lo que los juristas reprobaron, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Majah'ın Sünen'inde yer alan 324 numaralı hadiste, fıkıhçıların hoşlanmadığı ve hoş karşılanmayan şeyler anlatılmaktadır. Bu hadis, farz, ibadet, sünnet, mekruh, haram ve küçük günahlar üzerine araştırma yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 324, menyebutkan apa yang tidak disukai oleh para ahli fiqih dan apa yang dianggap tidak disukai. Hadits ini disusun oleh seorang peneliti mengenai amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
