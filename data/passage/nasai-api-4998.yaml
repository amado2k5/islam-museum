label: { ar: "سنن النسائي 4998 — عدد الحسنات، مضاعفة الحسنة بعشر أمثالها", en: "Sunan al-Nasa'i 4998 — a stated number of good deeds; the good deed multiplied tenfold and beyond", ur: "سنن نسائی 4998 — نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "… زَيْدِ بْنِ أَسْلَمَ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِذَا أَسْلَمَ الْعَبْدُ فَحَسُنَ إِسْلاَمُهُ كَتَبَ اللَّهُ لَهُ كُلَّ حَسَنَةٍ كَانَ أَزْلَفَهَا وَمُحِيَتْ عَنْهُ كُلُّ سَيِّئَةٍ كَانَ أَزْلَفَهَا ثُمَّ كَانَ بَعْدَ ذَلِكَ الْقِصَاصُ الْحَسَنَةُ بِعَشْرَةِ أَمْثَالِهَا إِلَى سَبْعِمِائَةِ ضِعْفٍ وَالسَّيِّئَةُ بِمِثْلِهَا إِلاَّ أَنْ يَتَجَاوَزَ اللَّهُ عَزَّ وَجَلَّ عَنْهَا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4998، يذكر عدد الحسنات، ومضاعفة الحسنة بعشر أمثالها، وكتابة الحسنات، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 4998 (The Book Of Faith and its Signs), that speaks of a stated number of good deeds, the good deed multiplied tenfold and beyond, the writing of good deeds, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 4998، جس میں نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
