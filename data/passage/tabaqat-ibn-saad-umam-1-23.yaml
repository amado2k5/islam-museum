text: "… على رأس اثنين وعشرين شهرًا رسول اللّٰه، صلّعم. من صلح الحُديبية كلَّمت بنو نُفائة - وهم من بنى بكر أَشرافَ قريش أَن يُعينوهم على خزاعة بالرجال والسلاح، فوعدوهم ووافوهم بالوتِير متنكرين متنقبين، فيهم صفوان بن أُمية وحُويطب بن عبد العُزى …"
