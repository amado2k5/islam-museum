label: { ar: "موطأ مالك 1101 — الأب والأبوة", en: "Muwatta Malik 1101 — the father and fatherhood", ur: "موطأ مالک 1101 — باپ اور والدیت", es: "Muwatta Malik 1101 — El padre y la paternidad", fr: "Muwatta Malik 1101 — le père et la paternité", tr: "Muwatta Malik 1101 — Baba ve Babalık", id: "Muwatta Malik 1101 — Sang Ayah dan Peran Ayah" }
text: "… كَانَ أَبًا أَوْ غَيْرَهُ - مِنْ حِبَاءٍ أَوْ كَرَامَةٍ فَهُوَ لِلْمَرْأَةِ إِنِ ابْتَغَتْهُ. قَالَ مَالِكٌ فِي الْمَرْأَةِ يُنْكِحُهَا أَبُوهَا وَيَشْتَرِطُ فِي صَدَاقِهَا الْحِبَاءَ يُحْبَى بِهِ إِنَّ مَا كَانَ مِنْ شَرْطٍ يَقَعُ بِهِ النِّكَاحُ فَهُوَ لاِبْنَتِهِ إِنِ ابْتَغَتْهُ وَإِنْ فَارَقَهَا زَوْجُهَا قَبْلَ أَنْ يَدْخُلَ بِهَا فَلِزَوْجِهَا شَطْرُ الْحِبَاءِ الَّذِي وَقَعَ بِهِ النِّكَاحُ. قَالَ مَالِكٌ فِي الرَّجُلِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1101، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1101 (Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1101، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1101 (Matrimonio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Muwatta Malik, n° 1101 (Mariage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Malik'in Muwatta'sında yer alan 1101 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1101, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
