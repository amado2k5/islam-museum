text: "… ابغض الى من قبتك ولا احب ان يبيحها اللّٰه وما فيها، ووالله! ما من قبة احب الىّ ان يعمرها اللّٰه و يبارك فيها من قبتك. فقال رسول اللّه: و أيضا والله! لا يؤمن احدكم حتى اكون احب اليه من ولده …"
