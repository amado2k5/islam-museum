label: { ar: "الموطأ 1390 — أبو بردة بن نيار: ذبح ضحيته قبل أن يذبح النبي يوم الأضحى، فأمره أن يعود بضحية أخرى، فقال لا أجد إلا جذعا، فقال اذبح", en: "Muwatta 1390", es: "Muwatta 1390", fr: "Muwatta 1390", ur: "موطا 1390", tr: "El-Muvatta 1390 — Ebu Burda ibn Niyar: Kurban Bayramı günü Peygamberimiz kurbanını kesmeden önce kendi kurbanını kesti. Bunun üzerine Peygamberimiz ona başka bir kurban getirmesini emretti. Adam, “Sadece genç bir deve bulabiliyorum” dedi. Bunun üzerine Peygamberimiz, “Onu kes” dedi.", id: "Al-Muwatta 1390 — Abu Burda ibn Niyar: Dia menyembelih hewan kurbannya sebelum Nabi menyembelih hewan kurbannya pada hari raya Idul Adha, lalu Nabi memerintahkannya untuk membawa hewan kurban lain. Dia berkata, “Aku hanya bisa menemukan seekor unta muda.” Maka Nabi berkata, “Sembelihlah.”" }
text: "وَإِنْ لَمْ تَجدْ إلاَّا جَذعًا فَاذْبَحْ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بشير بن يسار أن أبا بردة بن نيار ذبح ضحيته قبل أن يذبح رسول الله يوم الأضحى، فزعم أن رسول الله أمره أن يعود بضحية أخرى، فقال أبو بردة لا أجد إلا جذعا يا رسول الله، فقال وإن لم تجد إلا جذعا فاذبح. {cite:muwatta-maruf-1997 p.621}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Beşir ibn Yasar'dan rivayet ettiğine göre, Ebu Burda ibn Niyar, Kurban Bayramı günü, Allah Resulü'nden önce kendi kurbanını kesmiştir. İddiasına göre, Allah Resulü ona başka bir kurbanla geri dönmesini emretmiştir. Ebu Burda, \"Ey Allah Resulü, ancak genç bir keçi bulabiliyorum\" demiştir. Allah Resulü, \"Genç bir keçi bile bulsan, onu kes\" demiştir. {cite:muwatta-maruf-1997 s.621}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Bashir ibn Yasar, bahwa Abu Burda ibn Niyar menyembelih hewan kurbannya sebelum Rasulullah menyembelih hewan kurbannya pada hari raya Idul Adha. Ia mengaku bahwa Rasulullah memerintahkannya untuk kembali dengan hewan kurban lain. Abu Burda berkata, \"Wahai Rasulullah, aku hanya dapat menemukan seekor kambing muda.\" Rasulullah bersabda, \"Sekalipun engkau hanya dapat menemukan seekor kambing muda, maka sembelihlah.\" {cite:muwatta-maruf-1997 p.621}"
