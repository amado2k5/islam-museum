label: { ar: "الموطأ 1390 — أبو بردة بن نيار: ذبح ضحيته قبل أن يذبح النبي يوم الأضحى، فأمره أن يعود بضحية أخرى، فقال لا أجد إلا جذعا، فقال اذبح", en: "Muwatta 1390" }
text: "وَإِنْ لَمْ تَجدْ إلاَّا جَذعًا فَاذْبَحْ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بشير بن يسار أن أبا بردة بن نيار ذبح ضحيته قبل أن يذبح رسول الله يوم الأضحى، فزعم أن رسول الله أمره أن يعود بضحية أخرى، فقال أبو بردة لا أجد إلا جذعا يا رسول الله، فقال وإن لم تجد إلا جذعا فاذبح. {cite:muwatta-maruf-1997 p.621}"
