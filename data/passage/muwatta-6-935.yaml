ref: "935"
label: { ar: "الموطأ 935 — عبيد بن جريج يسأل ابن عمر عن أربع خصال يراه يصنعها: الأركان اليمانيين، والنعال السبتية، والصفرة، والإهلال حتى تنبعث به راحلته", en: "Muwatta 935", es: "Muwatta 935", fr: "Muwatta 935", ur: "موطا 935", tr: "El-Muvatta 935 — Ubeyd ibn Cüreyc, İbn Ömer'e onun yaptığı dört şey hakkında soru sorar: Yemen köşeleri, Cumartesi sandaletleri, sarı renk ve bineği hareket edene kadar ezan okuması.", id: "Al-Muwatta 935 — Ubayd ibn Jurayj bertanya kepada Ibnu Umar tentang empat hal yang dilihatnya dilakukan oleh Ibnu Umar: sudut-sudut Yaman, sandal hari Sabtu, warna kuning, dan seruan azan hingga kendaraannya berangkat." }
text: "لم أر أحداً من أصحابك يصنعها"
summary:
  ar: "يرويه مالك عن سعيد بن أبي سعيد المقبري عن عبيد بن جريج، أنه قال لعبد الله بن عمر: رأيتك تصنع أربعاً لم أر أحداً من أصحابك يصنعها: لا تمس من الأركان إلا اليمانيين، وتلبس النعال السبتية، وتصبغ بالصفرة، وإذا كنت بمكة أهل الناس إذا رأوا الهلال ولم تهل أنت حتى يكون يوم التروية. فأجابه ابن عمر عن كل واحدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1068) وإسحاق الطباع وسويد وعبد الله بن إدريس وغيرهم. {cite:muwatta-maruf-1997 p.448}"
  tr: "Malik, Sa'id ibn Abi Sa'id al-Maqburi'den, o da Ubayd ibn Jurayj'dan rivayet ederek, Abdullah ibn 'Umar'a şöyle dediğini aktarmıştır: \"Senin, hiçbir arkadaşının yapmadığı dört şeyi yaptığını gördüm: Kâbe'nin Yemen köşeleri hariç hiçbir köşesine dokunmuyorsun, ipekten sandalet giyiyorsun, saçını sarıya boyuyorsun ve Mekke'de olduğun zaman, insanlar yeni ayı gördüklerinde ihram ritüelini yerine getiriyorsun, ancak bunu Terviye Günü'ne (Zilhicce'nin 8. günü) kadar yapmıyorsun.\" İbn 'Umar bu noktaların her birine cevap verdi. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1068), İshak al-Tabba', Suwayd, Abdullah ibn Idris ve diğerleri tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.448}"
  id: "Malik meriwayatkan hadits ini dari Sa'id ibn Abi Sa'id al-Maqburi, yang juga dari 'Ubayd ibn Jurayj, yang berkata kepada 'Abdullah ibn 'Umar: \"Aku melihatmu melakukan empat hal yang belum pernah kulihat dilakukan oleh sahabatmu yang lain: engkau tidak menyentuh sudut-sudut Ka'bah kecuali sudut-sudut Yaman, engkau memakai sandal sutra, engkau mewarnai rambutmu kuning, dan ketika engkau berada di Mekah, engkau melakukan ritual Ihram ketika orang-orang melihat bulan sabit, tetapi engkau tidak melakukannya sampai hari Tarwiyah (tanggal 8 Dzul-Hijjah).\" Ibn 'Umar menanggapi setiap poin tersebut. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1068), Ishaq al-Tabba', Suwayd, 'Abdullah ibn Idris, dan lainnya. {cite:muwatta-maruf-1997 p.448}"
