label: { ar: "الموطأ 935 — عبيد بن جريج يسأل ابن عمر عن أربع خصال يراه يصنعها: الأركان اليمانيين، والنعال السبتية، والصفرة، والإهلال حتى تنبعث به راحلته", en: "Muwatta 935" }
text: "لم أر أحداً من أصحابك يصنعها"
summary:
  ar: "يرويه مالك عن سعيد بن أبي سعيد المقبري عن عبيد بن جريج، أنه قال لعبد الله بن عمر: رأيتك تصنع أربعاً لم أر أحداً من أصحابك يصنعها: لا تمس من الأركان إلا اليمانيين، وتلبس النعال السبتية، وتصبغ بالصفرة، وإذا كنت بمكة أهل الناس إذا رأوا الهلال ولم تهل أنت حتى يكون يوم التروية. فأجابه ابن عمر عن كل واحدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1068) وإسحاق الطباع وسويد وعبد الله بن إدريس وغيرهم. {cite:muwatta-maruf-1997 p.448}"
