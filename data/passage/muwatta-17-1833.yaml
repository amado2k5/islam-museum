label: { ar: "الموطأ 1833 — مالك: لا بأس بشراء ثمر من نخل مسماة، أو حائط مسمى، أو لبن من غنم مسماة، إذا كان يؤخذ عاجلا، مثل راوية زيت يبتاع منها بدينار فيكيل له منها", en: "Muwatta 1833", es: "Muwatta 1833", fr: "Muwatta 1833", ur: "موطا 1833", tr: "El-Muvatta 1833 — Malik: Belirli bir hurma ağacından, belirli bir meyve bahçesinden veya belirli bir koyundan alınan meyvenin, hemen tüketilmesi şartıyla, örneğin bir dinara alınan su tulumu dolusu yağın ölçülerek kendisine verilmesi gibi, hiçbir sakınca yoktur.", id: "Al-Muwatta 1833 — Malik: Tidak ada salahnya membeli buah dari pohon kurma tertentu, atau kebun tertentu, atau susu dari domba tertentu, jika langsung dikonsumsi, seperti halnya membeli kantung minyak seharga satu dinar, lalu mengukurnya untuknya." }
summary:
  ar: "قال مالك: من اشترى ثمرا من نخل مسماة، أو حائط مسمى، أو لبنا من غنم مسماة، إنه لا بأس بذلك، إذا كان يؤخذ عاجلا، يشرع المشتري في أخذه عند دفعه الثمن. وإنما مثل ذلك بمنزلة راوية زيت، يبتاع منها رجل بدينار أو بدينارين ويعطيه ذهبه، ويشترط عليه أن يكيل له منها. فهذا لا بأس به. فإن انشقت الراوية، فذهب زيتها، فليس للمبتاع إلا ذهبه، ولا يكون بينهما بيع. {cite:muwatta-maruf-1997 p.152}"
  tr: "Malik şöyle dedi: Bir kimse belirli bir hurma ağacından, belirli bir meyve bahçesinden veya belirli bir koyun sürüsünden meyve veya süt satın alırsa, hemen alınması şartıyla bunda bir sakınca yoktur. Alıcı, bedelini ödedikten sonra almaya başlar. Bu, bir adamın bir veya iki dinara yağ satın alıp, karşılığında altınını vererek, bir kısmını kendisi için ölçmesini şart koştuğu bir kap yağ gibidir. Bu caizdir. Kap patlarsa ve yağı dökülürse, alıcı sadece altınına hak kazanır ve aralarında bir satış olmaz. {cite:muwatta-maruf-1997 s.152}"
  id: "Malik berkata: Jika seseorang membeli buah dari pohon kurma tertentu, atau kebun tertentu, atau susu dari kawanan domba tertentu, tidak ada salahnya, asalkan diambil segera. Pembeli mulai mengambilnya setelah membayar harganya. Ini seperti wadah minyak, yang dibeli seseorang seharga satu atau dua dinar dan diberikan emasnya, dengan syarat pembeli mengukur sebagian minyak tersebut untuknya. Ini diperbolehkan. Jika wadah tersebut pecah dan minyaknya tumpah, pembeli hanya berhak atas emasnya, dan tidak ada jual beli di antara mereka. {cite:muwatta-maruf-1997 p.152}"
