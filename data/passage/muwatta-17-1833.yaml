label: { ar: "الموطأ 1833 — مالك: لا بأس بشراء ثمر من نخل مسماة، أو حائط مسمى، أو لبن من غنم مسماة، إذا كان يؤخذ عاجلا، مثل راوية زيت يبتاع منها بدينار فيكيل له منها", en: "Muwatta 1833" }
summary:
  ar: "قال مالك: من اشترى ثمرا من نخل مسماة، أو حائط مسمى، أو لبنا من غنم مسماة، إنه لا بأس بذلك، إذا كان يؤخذ عاجلا، يشرع المشتري في أخذه عند دفعه الثمن. وإنما مثل ذلك بمنزلة راوية زيت، يبتاع منها رجل بدينار أو بدينارين ويعطيه ذهبه، ويشترط عليه أن يكيل له منها. فهذا لا بأس به. فإن انشقت الراوية، فذهب زيتها، فليس للمبتاع إلا ذهبه، ولا يكون بينهما بيع. {cite:muwatta-maruf-1997 p.152}"
