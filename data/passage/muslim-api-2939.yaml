label: { ar: "صحيح مسلم 2939 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 2939 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 2939 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 2939 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 2939 — mentions de nations, de religions et de peuples non musulmans", tr: "Sahih Müslim 2939 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih Muslim 2939 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "وَحَدَّثَنِي أَبُو غَسَّانَ الْمِسْمَعِيُّ، حَدَّثَنَا مُعَاذٌ، - يَعْنِي ابْنَ هِشَامٍ - حَدَّثَنِي أَبِي، عَنْ مَطَرٍ، عَنْ أَبِي الزُّبَيْرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ عَائِشَةَ، -ا - فِي حَجَّةِ النَّبِيِّ أَهَلَّتْ بِعُمْرَةٍ. وَسَاقَ الْحَدِيثَ بِمَعْنَى حَدِيثِ اللَّيْثِ وَزَادَ فِي الْحَدِيثِ قَالَ وَكَانَ رَسُولُ اللَّهِ رَجُلاً سَهْلاً إِذَا هَوِيَتِ الشَّىْءَ تَابَعَهَا عَلَيْهِ فَأَرْسَلَهَا مَعَ عَبْدِ الرَّحْمَنِ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2939، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2939 (The Book of Pilgrimage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 2939، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 2939 (El Libro de la Peregrinación), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih Muslim, n° 2939 (Le Livre du Pèlerinage), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih Müslim'de 2939 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2939, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
