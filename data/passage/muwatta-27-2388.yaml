label: { ar: "الموطأ 2388 — مالك: الرجوع عن الاعتراف بالزنا لا يقام به الحد إلا بالإقرار", en: "Muwatta 2388", es: "Muwatta 2388", fr: "Muwatta 2388", ur: "موطا 2388", tr: "Al-Muwatta 2388 — Malik: Zina itirafının geri çekilmesi, teyit edilmedikçe hadd cezasının uygulanmasını gerektirmez.", id: "Al-Muwatta 2388 — Malik: Menarik kembali pengakuan perzinahan tidak menjamin penerapan hukuman hadd kecuali jika hal itu dikonfirmasi." }
summary:
  ar: "قال مالك في الذي يعترف على نفسه بالزنا ثم يرجع عن ذلك ويقول: لم أفعل، وإنما كان ذلك مني على وجه كذا لشيء يذكره: إن ذلك يُقبل منه ولا يُقام عليه الحد، لأن حد الله لا يؤخذ إلا ببينة عادلة تثبت على صاحبها، أو باعتراف يُقيم عليه حتى يُقام عليه الحد. فإن أقام على اعترافه أُقيم عليه الحد. {cite:muwatta-maruf-1997 p.388}"
  tr: "Malik, zina suçunu itiraf edip sonra da \"Ben yapmadım; sadece şu şu sebeple yaptım\" diyerek tövbe eden kimse hakkında şöyle demiştir: Bu itirafı kabul edilir ve Allah'ın belirlediği ceza uygulanmaz. Çünkü Allah'ın belirlediği ceza, ancak ilgili kişi aleyhinde ispatlanmış haklı delillerle veya cezanın uygulanabilmesi için aleyhinde tespit edilmiş bir itirafla uygulanır. Eğer kişi itirafında ısrar ederse, o zaman Allah'ın belirlediği ceza uygulanır. {cite:muwatta-maruf-1997 s.388}"
  id: "Malik berkata mengenai seseorang yang mengaku berzina lalu menarik pengakuannya dengan mengatakan, \"Aku tidak melakukannya; itu hanya dilakukan karena alasan ini dan itu,\" bahwa pengakuannya diterima dan hukuman yang ditetapkan tidak dilaksanakan. Ini karena hukuman yang ditetapkan Allah hanya diterapkan dengan bukti yang sah yang terbukti terhadap orang yang terlibat, atau dengan pengakuan yang terbukti terhadapnya sehingga hukuman dapat dilaksanakan. Jika ia tetap pada pengakuannya, maka hukuman yang ditetapkan akan dilaksanakan. {cite:muwatta-maruf-1997 p.388}"
