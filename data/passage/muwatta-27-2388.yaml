label: { ar: "الموطأ 2388 — مالك: الرجوع عن الاعتراف بالزنا لا يقام به الحد إلا بالإقرار", en: "Muwatta 2388" }
summary:
  ar: "قال مالك في الذي يعترف على نفسه بالزنا ثم يرجع عن ذلك ويقول: لم أفعل، وإنما كان ذلك مني على وجه كذا لشيء يذكره: إن ذلك يُقبل منه ولا يُقام عليه الحد، لأن حد الله لا يؤخذ إلا ببينة عادلة تثبت على صاحبها، أو باعتراف يُقيم عليه حتى يُقام عليه الحد. فإن أقام على اعترافه أُقيم عليه الحد. {cite:muwatta-maruf-1997 p.388}"
