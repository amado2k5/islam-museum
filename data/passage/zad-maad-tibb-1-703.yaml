text: "… ص لملا علي القاري، و المنار المنيف للريح والبلغم والبواسير، محدرة الكيموسات المرتبِكَة في الأمعاء، وتُحلِّل البلغم اللزج من الصدر، وتنفع من الدُّبَيْلاتِ وأمراض الرثة، وتُسْتعمل لهذه الأدواء في الأحشاء مع السمن والفانيذ. وإذا شربت مع وزن خمسة دراهم فُوَّةٍ، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 703، يذكر المرض والمريض، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
