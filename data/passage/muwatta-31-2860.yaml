label: { ar: "الموطأ 2860 — عمر يوصي هنيا مولاه على الحمى: اتق دعوة المظلوم", en: "Muwatta 2860", es: "Muwatta 2860", fr: "Muwatta 2860", ur: "موطا 2860", tr: "El-Muvatta 2860 — Ömer, azat ettiği kölesi Haniye'ye ateşli hastalık konusunda şu nasihatte bulunur: \"Zulme uğrayanların duasından sakın.\"", id: "Al-Muwatta 2860 — Umar menasihati budaknya yang telah dibebaskan, Haniya, mengenai penyakit demam: Waspadalah terhadap doa orang yang tertindas." }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن أبيه، أن عمر بن الخطاب استعمل مولى له يدعى هنيا على الحمى، فقال له: يا هني، اضمم جناحك عن الناس، واتق دعوة المظلوم، فإن دعوة المظلوم مجابة، وأدخل رب الصريمة والغنيمة، وإياي ونعم ابن عفان وابن عوف، فإنهما إن تهلك ماشيتهما يرجعان إلى المدينة بنخل وزرع، وإن رب الصريمة والغنيمة إن تهلك ماشيته يأتيني ببنيه فيقول: يا أمير المؤمنين، أفتاركهم أنا لا أبا لك؟ فالماء والكلأ أيسر علي من الذهب والورق. ويقول عمر إنهم يرون أنه ظلمهم، وإن هذه بلادهم ومياههم قاتلوا عليها في الجاهلية وأسلموا عليها في الإسلام، ولولا المال الذي يحمل عليه في سبيل الله ما حمى عليهم من بلادهم شبرا. {cite:muwatta-maruf-1997 p.602} {cite:muwatta-maruf-1997 p.603}"
  tr: "Malik, babasından rivayet ettiği üzere Zeyd ibn Aslam'dan naklederek, Ömer ibn el-Hattab'ın, koruma altındaki otlakların gözetimi için Haniy adında azatlı bir kölesini görevlendirdiğini anlatır. Ona şöyle dedi: “Ey Haniy, insanlara karşı nazik ol ve mazlumların dualarına kulak ver, çünkü mazlumların duaları kabul edilir. Otlakların ve savaş ganimetlerinin sahiplerini de koru ve beni, İbn Affan ve İbn Evf'in hayvanlarını koru. Çünkü hayvanları telef olursa, hurma ve ekinlerle Medine'ye döneceklerdir. Fakat otlakların ve savaş ganimetlerinin sahipleri telef olursa, çocuklarıyla birlikte bana gelip, ‘Ey Müminlerin Emiri, babasız olan sen, onları terk mi edeyim?’ diyeceklerdir. Çünkü su ve otlak benim için altın ve gümüşten daha değerlidir.” Ömer, onların kendisine haksızlık ettiğini düşündüklerini, bu toprakların ve suların kendilerine ait olduğunu, İslam öncesi dönemde bunun için savaştıklarını ve İslam'ı kabul ettiklerini söyledi. Eğer Allah yolunda harcadığı para olmasaydı, topraklarının bir karışını bile onlar için koruyamazdı."
  id: "Malik meriwayatkan dari Zayd ibn Aslam, yang juga dari ayahnya, bahwa Umar ibn al-Khattab menunjuk seorang budak yang telah dibebaskan bernama Haniy untuk mengawasi padang rumput yang dilindungi. Beliau berkata kepadanya, “Wahai Haniy, bersikaplah lembut kepada orang-orang, dan perhatikanlah doa orang-orang yang tertindas, karena doa orang-orang yang tertindas akan dikabulkan. Sertakanlah para pemilik padang rumput dan rampasan perang, dan lindungilah aku dan ternak Ibn Affan dan Ibn Awf. Karena jika ternak mereka binasa, mereka akan kembali ke Madinah dengan pohon kurma dan hasil panen. Tetapi jika para pemilik padang rumput dan rampasan perang binasa, mereka akan datang kepadaku bersama anak-anak mereka dan berkata, ‘Wahai Amirul Mukminin, haruskah aku meninggalkan mereka, engkau yang tidak mempunyai ayah?’ Karena air dan padang rumput lebih mudah bagiku daripada emas dan perak.” Umar berkata bahwa mereka merasa dia telah berbuat salah kepada mereka, dan bahwa ini adalah tanah dan air mereka, yang telah mereka perjuangkan di era pra-Islam dan yang menjadi alasan mereka memeluk Islam. Seandainya bukan karena uang yang dia keluarkan untuk kepentingan Tuhan, dia tidak akan mampu melindungi sejengkal pun tanah mereka."
