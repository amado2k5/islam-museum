label: { ar: "الموطأ 2860 — عمر يوصي هنيا مولاه على الحمى: اتق دعوة المظلوم", en: "Muwatta 2860" }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن أبيه، أن عمر بن الخطاب استعمل مولى له يدعى هنيا على الحمى، فقال له: يا هني، اضمم جناحك عن الناس، واتق دعوة المظلوم، فإن دعوة المظلوم مجابة، وأدخل رب الصريمة والغنيمة، وإياي ونعم ابن عفان وابن عوف، فإنهما إن تهلك ماشيتهما يرجعان إلى المدينة بنخل وزرع، وإن رب الصريمة والغنيمة إن تهلك ماشيته يأتيني ببنيه فيقول: يا أمير المؤمنين، أفتاركهم أنا لا أبا لك؟ فالماء والكلأ أيسر علي من الذهب والورق. ويقول عمر إنهم يرون أنه ظلمهم، وإن هذه بلادهم ومياههم قاتلوا عليها في الجاهلية وأسلموا عليها في الإسلام، ولولا المال الذي يحمل عليه في سبيل الله ما حمى عليهم من بلادهم شبرا. {cite:muwatta-maruf-1997 p.602} {cite:muwatta-maruf-1997 p.603}"
