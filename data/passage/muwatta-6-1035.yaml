summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يكره أن ينزع المحرم حلمة أو قراداً عن بعيره. قال مالك: وذلك أحب ما سمعت إلي في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1193) وسويد (582) والشيباني (432). {cite:muwatta-maruf-1997 p.482}"
