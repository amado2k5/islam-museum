label: { ar: "الموطأ 1035 — ابن عمر كان يكره أن ينزع المحرم حلمة أو قراداً عن بعيره؛ قال مالك: وذلك أحب ما سمعت إلي", en: "Muwatta 1035", es: "Muwatta 1035", fr: "Muwatta 1035", ur: "موطا 1035", tr: "El-Muvatta 1035 — İbn Ömer, ihramlı bir hacının devesinden meme veya kene çıkarmasını hoş karşılamazdı; Malik şöyle dedi: Bu, işittiğim en sevilen şeydir.", id: "Al-Muwatta 1035 — Ibnu Umar tidak menyukai seorang jamaah haji yang sedang ihram mencabut puting susu atau kutu dari untanya; Malik berkata: Itu adalah hal yang paling dicintai yang pernah kudengar." }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يكره أن ينزع المحرم حلمة أو قراداً عن بعيره. قال مالك: وذلك أحب ما سمعت إلي في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1193) وسويد (582) والشيباني (432). {cite:muwatta-maruf-1997 p.482}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın ihramlı bir hacının devesinden meme veya kene çıkarmasından hoşlanmadığını nakletmiştir. Malik şöyle demiştir: \"Bu konuda duyduğum en tercih edilebilir şey budur.\" Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1193), Suwaid (582) ve el-Şeybani (432) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.482}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar tidak menyukai seorang jamaah haji yang sedang ihram mencabut puting susu atau kutu dari untanya. Malik berkata: “Itulah hal yang paling baik yang pernah kudengar mengenai masalah ini.” Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus’ab (1193), Suwaid (582), dan al-Shaybani (432). {cite:muwatta-maruf-1997 p.482}"
