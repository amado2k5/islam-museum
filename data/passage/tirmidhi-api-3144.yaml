label: { ar: "جامع الترمذي 3144 — ما حُرّم", en: "Jami' al-Tirmidhi 3144 — what was made unlawful", ur: "جامع ترمذی 3144 — جو حرام کیا گیا", es: "Jami' al-Tirmidhi 3144 — lo que se declaró ilícito" }
text: "… مُوسَى تِسْعَ آيَاتٍ بَيِّنَاتٍ ) فَقَالَ رَسُولُ اللَّهِ \" لاَ تُشْرِكُوا بِاللَّهِ شَيْئًا وَلاَ تَزْنُوا وَلاَ تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ وَلاَ تَسْرِقُوا وَلاَ تَسْحَرُوا وَلاَ تَمْشُوا بِبَرِيءٍ إِلَى سُلْطَانٍ فَيَقْتُلَهُ وَلاَ تَأْكُلُوا الرِّبَا وَلاَ تَقْذِفُوا مُحْصَنَةً وَلاَ تَفِرُّوا مِنَ الزَّحْفِ شَكَّ شُعْبَةُ وَعَلَيْكُمُ الْيَهُودَ خَاصَّةً أَنْ لاَ تَعْدُوا فِي السَّبْتِ \". فَقَبَّلاَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3144، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3144 (Chapters on Tafsir), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3144، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3144 (Capítulos sobre Tafsir), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
