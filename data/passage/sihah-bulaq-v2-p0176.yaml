text: |-
  •⁦(معن)⁩ ٤١١
  ويقال أراد المرون والمادة أى بكثرة وقوفى و-_لامى عليم التعرف طاعق لها والتمرين
  التلين والمارن مالان من الانف وفضل عن القصبة ومالان من الرمح قال عبيديذ كرفاقته
  هايك تحملنى وأض صارما • ومذريافى مارن مخموص
  والممارن من النوق مثل المماجن بقال مارنت الناقة اذاضربت فلم تلقح والمزان بالضم
  الرماح وهو فعال الواحدة مرانة ومران بالفع موضع على ليلتين من مكة على طريق البصبرة
  وبه قبرقيم بن متز قال جريد
  اتى اذا الشاعر المذرورحزبى • جار لقبرعلى مران مزموس
  أى أذب عنه الشعراء وأماقول منصور• قبرمررت به على مزان • فانما يعق قبر عروبن عبيد
  ⁦( مزن)⁩ أبوزيد المزنة السحابة البيضاء والجع مزن والبردحب المزن والمازن بيض التمل
  ومازن أبو قبيلة من تيم وهو مازن بن مالت بن عروبن عيم ومازن فى بنى صعصسعة بن معاوية
  ومازن فى بنى شيبان ويقال للهلال ابن مزنة قال
  كانَ ابن مننتها جاغها • فسيطادى الافق من خنصر
  والمزنة المطرة قال
  ألم ترأن اقه أنزل مزنة • وعفر الظياء فى الكناس تقمع
  وكانت العرب تسفي عمان المزون قال الكميت
  وأما الازدازد أبى سعيد • فأكره أن أسميها المزونا
  وهو أبوسعيد المهلب المزونى أى أكره أن أنسبه الى المزون وهى أرض عمان يقول هومن
  مضر وقال أبو عبيدة يعنى بالمزون الملاسين قال وكان أردشيربن بابكان جعل الازد ملاحين
  بنهر عمان قبل الاسلام بسة أئة سنة ومن بنة قبيلة من مضر وهو حزينة بن أذين طابخة
  ابن الياس بن مضر والفسبة اليهم حزنقة شن المشن ضرب عن الضرب بالسوط يقال
  مشته عشنا قال الهجاجل، وفى أخاديد السياط المشن» وامتشات الشى اقتطعته واختاسته
  وامتشنت السيف استللته وحكى ابن السكيت عن الكلالي موت بي غرارة فشنقنى وأصابتنى
  شسنة وهو الشى له سعة ولاغوره منه مابض منه دم ومنمالم يجرح الجلديال مشنه
  بالسيف اذا ضريه فقشر الجاد ومشفت الناقة تمشينادرت كارهة والمشان نوع من الرطب
  وفى المثل إلة الورشان تأسكل رطب المشان بالاضافة ولا فقل الرطب المشان
  ويقال امتشن منه مامشن لك أى خذمنه ما وجدت والمشان من النساه السلبطة المشائمة
  ⁦( معن)⁩ المعن النى اليسير الهين قال الخمر بن تولب
  وماضيعه فألام فيه • فان هلاك مالك غير معن
  أى ايس بهين ورجل معن فى حاجته وقولهم حدّث عن معن ولا حرج هو معن بن زائدة بن
  عبد اللّٰه بن زائدة بن مطربن شريك بن عمر والشيبانى وهو عم يزيد بن من يد بن زائدة الشيبانى
  وكان معن أجود العرب ويقال ماله سعنة ولامضة أى شئ والماعونا-م جامع لمنسافع
  البيت كالقدر والفأس وتحوها قال الاعشى
  بأجود منه بماعونه • اذا ماسماؤهم لم نغم
  قوله مخموس بالخاء معيمة أى رمحا
  طول مارنه خمر أذرع قاله
  المؤاف اه
  قوله وهو الشى الهسعة عبارة
  القاموس وهو الجرح له سعة !ه
