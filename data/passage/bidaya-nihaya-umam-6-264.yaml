text: "… الفضل. فصل فى عقده ال ي الألفة بين المهاجرين والأنصار بالكتاب الذى أمر به فكتب بينهم والمؤاخاة التى أمرهم بها وقررهم عليها وموادعته اليهود الذين كانوا بالمدينة وكان بها من أحياء اليهود : بنو قينقاع وبنو النضير وبنو قريظة، وكان …"
