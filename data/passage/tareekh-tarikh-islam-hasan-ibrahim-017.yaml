text: "تقلبت بنا الحال أو دارت علينا الدوائر فلما وقف العزيز عليه رد عليه بكتاب كتب في أوله: إذ ولد السمولود منا تهللت له الأرض واهتزت إليه المنابر عرفتنا فهجوتنا ولو عرفناك لأجبناك، والسلام. ولم يقتصر هذا العداء على الأمويين في"
