label: { ar: "الموطأ 2423 — مالك: القوم يسرقون بيتا ويحملون المتاع جميعا", en: "Muwatta 2423", es: "Muwatta 2423", fr: "Muwatta 2423", ur: "موطا 2423", tr: "Al-Muwatta 2423 — Malik: İnsanlar bir evden hırsızlık yapıp bütün malları alırlar.", id: "Al-Muwatta 2423 — Malik: Orang-orang mencuri dari sebuah rumah dan mengambil semua barang-barang di dalamnya." }
summary:
  ar: "قال مالك في القوم يأتون البيت فيسرقون منه جميعا، فيخرجون بالعدل أو الصندوق أو الخشبة أو المكتل أو ما أشبه ذلك مما يحمله القوم جميعا: إنهم إذا أخرجوه من حرزه وهم يحملونه جميعا، فبلغ ثمن ما خرجوا به ما يجب فيه القطع، وذلك ثلاثة دراهم فصاعدا، فعليهم القطع جميعا. وإن خرج كل واحد منهم بمتاع على حدة، فمن خرج بما تبلغ قيمته ثلاثة دراهم فعليه القطع، ومن لم يخرج بذلك فلا قطع عليه. {cite:muwatta-maruf-1997 p.401}"
  tr: "Malik, bir eve gelip birlikte hırsızlık yapan ve ellerinde bir yük, bir kutu, bir tahta parçası, bir sepet veya benzeri bir şeyle ayrılan bir grup insan hakkında şöyle demiştir: Eğer bunları güvenli yerlerinden birlikte taşıyarak alırlarsa ve aldıklarının değeri hırsızlık sınırına, yani üç dirhem veya daha fazlasına ulaşırsa, hepsi hadd cezasına çarptırılır. Ancak, her biri malları ayrı ayrı alırsa, değeri üç dirheme ulaşan bir şey alan hadd cezasına çarptırılır, bu değerde bir şey almayan ise hadd cezasına çarptırılmaz. {cite:muwatta-maruf-1997 s.401}"
  id: "Malik berkata mengenai sekelompok orang yang datang ke sebuah rumah dan mencuri darinya bersama-sama, lalu pergi dengan membawa barang curian berupa barang, kotak, sepotong kayu, keranjang, atau barang serupa lainnya: Jika mereka mengambilnya dari tempat yang aman sambil membawanya bersama-sama, dan nilai barang yang mereka ambil mencapai ambang batas pencurian, yaitu tiga dirham atau lebih, maka mereka semua dikenai hukuman hadd. Namun, jika masing-masing dari mereka pergi dengan barang curian secara terpisah, maka siapa pun yang mengambil barang yang nilainya mencapai tiga dirham dikenai hukuman hadd, dan siapa pun yang tidak mengambil barang dengan nilai tersebut tidak dikenai hukuman hadd. {cite:muwatta-maruf-1997 p.401}"
