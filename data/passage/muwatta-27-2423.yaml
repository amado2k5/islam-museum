label: { ar: "الموطأ 2423 — مالك: القوم يسرقون بيتا ويحملون المتاع جميعا", en: "Muwatta 2423" }
summary:
  ar: "قال مالك في القوم يأتون البيت فيسرقون منه جميعا، فيخرجون بالعدل أو الصندوق أو الخشبة أو المكتل أو ما أشبه ذلك مما يحمله القوم جميعا: إنهم إذا أخرجوه من حرزه وهم يحملونه جميعا، فبلغ ثمن ما خرجوا به ما يجب فيه القطع، وذلك ثلاثة دراهم فصاعدا، فعليهم القطع جميعا. وإن خرج كل واحد منهم بمتاع على حدة، فمن خرج بما تبلغ قيمته ثلاثة دراهم فعليه القطع، ومن لم يخرج بذلك فلا قطع عليه. {cite:muwatta-maruf-1997 p.401}"
