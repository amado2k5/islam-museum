label: { ar: "سنن ابن ماجه 912 — الأب والأبوة", en: "Sunan Ibn Majah 912 — the father and fatherhood", ur: "سنن ابن ماجہ 912 — باپ اور والدیت", es: "Sunan Ibn Majah 912 — El padre y la paternidad", fr: "Sunan Ibn Majah 912 — le père et la paternité" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ إِدْرِيسَ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ أَبِيهِ، عَنْ وَائِلِ بْنِ حُجْرٍ، قَالَ رَأَيْتُ النَّبِيَّ ـ قَدْ حَلَّقَ الإِبْهَامَ وَالْوُسْطَى وَرَفَعَ الَّتِي تَلِيهِمَا يَدْعُو بِهَا فِي التَّشَهُّدِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 912، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 912 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 912، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 912 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 912 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
