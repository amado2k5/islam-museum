label: { ar: "الموطأ 1254 — مالك: لا يصلح للمحرم أن ينتف من شعره شيئا أو يحلقه أو يقصره حتى يحل، إلا أن يصيبه أذى في رأسه فعليه الفدية", en: "Muwatta 1254", es: "Muwatta 1254", fr: "Muwatta 1254", ur: "موطا 1254", tr: "El-Muvatta 1254 — Malik: İhramda olan bir hacının, ihramdan çıkana kadar saçını yolması, tıraş etmesi veya kısaltması caiz değildir; ancak başına bir darbe gelirse, kefaret ödemesi gerekir.", id: "Al-Muwatta 1254 — Malik: Tidak diperbolehkan bagi seorang jamaah haji yang sedang ihram untuk mencabut rambutnya, mencukurnya, atau memotongnya pendek hingga ia keluar dari ihram, kecuali jika ia mengalami cedera di kepala, dalam hal ini ia wajib membayar tebusan." }
text: "لا يَصْلُحُ للمُحْرِمِ أن يَنْتِفَ من شَعَرِهِ شَيئًا"
summary:
  ar: "يقول مالك إنه لا يصلح للمحرم أن ينتف من شعره شيئا، ولا يحلقه، ولا يقصره، حتى يحل، إلا أن يصيبه أذى في رأسه، فعليه الفدية. {cite:muwatta-maruf-1997 p.558}"
  tr: "Malik, ihramlı bir hacının, başından yaralanmadığı sürece, ihramdan çıkana kadar saçını yolmasının, tıraş etmesinin veya kısaltmasının caiz olmadığını, ancak başından yaralanırsa fidye ödemesi gerektiğini söyler. {cite:muwatta-maruf-1997 s.558}"
  id: "Malik mengatakan bahwa tidak diperbolehkan bagi seorang jamaah haji yang sedang ihram untuk mencabut rambutnya, mencukurnya, atau memotongnya pendek sampai ia keluar dari ihram, kecuali jika ia mengalami cedera di kepala, dalam hal ini ia harus membayar tebusan. {cite:muwatta-maruf-1997 p.558}"
