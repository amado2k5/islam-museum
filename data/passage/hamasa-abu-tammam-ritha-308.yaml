text: "… أوس بن خالث بن يزيد فلم يقر أشيئا فضر به فيات فاقامت بنتمه أم أوس منائح تندبه وأقبل حر يث بن زيد الخيل فاخبرته فاخذ الرمح فشد على أبى سفيان فطعنه فقتله وقتل ناسا من أصحابه ثم هرب الى الشام …"
summary:
