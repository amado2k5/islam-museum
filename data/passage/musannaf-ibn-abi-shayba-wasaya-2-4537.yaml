text: "… الحميد بن بَهْرام عن أسماء بنت يزيد: أن النبي وَالفي توفي ودرعه مرهونة عند يهودي بطعام. - حدثنا يزيد بن هارون عن هشام عن عكرمة عن ابن عباس قال: قُبض رسول اللّٰه والفيه وإنَّ درعه لمرهونة بثلاثين صاعاً من شعير، …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 4537، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 4537, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 4537 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 4537, que menciona el lecho de muerte y las últimas horas, y lo que dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 4537, évoquant un lit de mort et les dernières heures du défunt, ainsi que son héritage. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 4537. sayfasından, vefat zamanını, ölen kişinin ölümünü, mal varlığını ve mirasını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Ibn Abi Shaybah, Volume 2, halaman 4537, yang menyebutkan waktu kematian dan wafatnya almarhum, serta harta warisannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
