text: "… لا وارث لي ذهب يوماً في صباهُ إلى إحدى القرى للوعظ، فمرض مرضاً شديداً، فاجتمع القرويون وقالوا له: إذا متَّ ووقع الأمر الحق، فهل لك في بلدك وارث؟ فأجابهم : لي والدة في بلدي، إلّا أنَّ والدي طلَّقها، فعلى ذلك …"
summary:
  ar: "مرض جحا أثناء زيارة وعظ إلى قرية، فسأله أهلها هل له وارث؛ فقال إن أمه تعيش في بلدته، لكن أباه طلّقها، فلا وارث له. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  en: "Ill during a preaching visit to a village, Juha is asked by the villagers if he has an heir; he says his mother lives in his town, but his father divorced her, so he has no heir. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  ur: "وعظ کے سفر میں ایک گاؤں میں جحا بیمار ہو گیا تو گاؤں والوں نے پوچھا کہ تمہارا کوئی وارث ہے؛ اس نے کہا کہ میری ماں میرے شہر میں رہتی ہے مگر میرے باپ نے اسے طلاق دے دی تھی، اس لیے میرا کوئی وارث نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  fr: "Malade lors d'une visite de prédication dans un village, Juha se voit demander par les villageois s'il a un héritier; il dit que sa mère vit dans sa ville, mais que son père l'a répudiée, et qu'il n'a donc pas d'héritier. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  es: "Enfermo durante una visita de predicación a una aldea, Juha es preguntado por los aldeanos si tiene heredero; dice que su madre vive en su ciudad, pero que su padre la repudió, así que no tiene heredero. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
