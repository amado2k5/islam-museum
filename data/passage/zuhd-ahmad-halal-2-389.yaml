text: "فحدَثانٍ أَحدِثًا في الإسلام: رجلٌ ذو رأي سوء، زعم أَنَّ الجنَّةَ لمن رأى مثلَ رأيُه، فسلَّ سيفَه، وسفكَ دماءَ المسلمين، واستحلّ حُرمَتَهُم. ومُترَفٌ يَعبدُ الدُّنيا؛ لها يغضبُ، وعليها يُقاتل، ولها يطلبُ. وقال: يا سُبحان الله! ما لَقِيَتْ هذه الأُمَّةُ مِن …"
