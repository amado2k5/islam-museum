text: |-
  ⁦(فصل الخا.)⁩
  ⁦(حبجر)⁩
  ٣٠١
  والجع جبورعن يعقوب يقال به حبور أى آناروقدأحبربه أى تركبه أثرا وأنشد
  لقد أشمتت بى أهل فيدوغادرت * بجسمى حبرابنتمصان باديا .
  وفى المديث يخرج رحسل من الشارة د ذهب حبره وسبره قال الفترّاء أى لونه وهيئته من
  قولهم جاءت الابل حسنة الاحباروالاسبار وقال الاصمعى هوالجال والبهاء وأثر النعمة
  يقل فلان حسن الحبر والسبراذا كان جيلاحسن الهيئّة قال ابن أحر
  لبسفا حبرة حتق اقتذينا * لآجال واعمال قضينا
  ويقال أيضافلان حسن المبر والسبر بالفتح وهذاكاً نه مصدرة ولك -برته حبرا اذا حسنته
  والاول اسم وتحبيرالخط والشعر وغيرهما تحسينه قال الاصعى وكان بقال اطفيل الغنوى
  فى الماهلية محبر الانه كان يحسسن الشعر والحبرأيضا الحبور وه والسرور يقسال حبره يحبره
  بالضم حبرا وحبرة وقال اللّٰه تعالى فهم فى روضة يحبرون أى ينعسمون ويكرمون ويسرون
  ور-ل يحبور يفعول من الحبور والحبر والحبر واحد أحبار اليهود وبالكسر أفصج لانه يجمع
  على أفعال دون الفحول قال الفرّاء هو حبرباا-كسريقال ذلك للعالم واغماقيل كعب
  الحبرا. كان هذا الخبر الذى يكتب به قال وذلك أنه كان صاحب كتب قال الاصعمى لا أدرى
  *والحبرأ والحبر للرجسل العالم وقال أبو عبيد والذى عندى أنه الحبر بالفتح ومعناه العالم
  بتعبير السكلام والعلم وتحسينه قال وهكذايرويه المحدثون كلهم بالفتح والحبار الاثر قال الراجر
  لا تملا الدلووعرق فيها * ألاترى حبار من بسقيها
  وقال حيذين تور الارقط ولم يقلب أرضا البيطار ولا لجلميه بهاحمار
  قال يعقوب الجمع الحبارات والحبير لغام البعير والحبير السحاب وتوب خبير أى جديد
  وأرض محبار سريعة النبات حسنته والحبرة دثال العنبة برديمان والجمع حبروحبرات والحبرة
  كسر الخاء والباء القلح فى الاسنان والجمع بطرخ الهاء فى القياس وأمااسم البلدفه و
  حبرّ مشقدة الراء قال عبيد فعردة فقفاحبر * ليس بهامتهم عريب
  وقد حبرت أسنائه تحبر حبرا مثال تعبت تتعب تعبا أى قلمت وحبرالجرح أيضاحبرا أى نمكس
  وغفروقال الكسائى أى برأو بقيت له آثار والحبر فى قول العجاج
  لهد لله الذى أعطى الحبر ويروى الشبر من قولهم حبرنى هذا الامر حبرا أى سرتى
  وقد حرك الباءفيهماوأصلها التسكين ومنه الحابوروهو مجلس الفساق والحبارى طائريقع
  على الذكر والانثى واحدها وجمعهاسواءوان شئت قلت فى الجمع حباريات وفى المثل كل أنتى
  تحب ولدها حتى الحبارى واغماخصوا الحبارى لانه يضرب بها المثل فى الموق فهى على موقها
  تحب ولدها وتعلمه الطيران وألفه ليست للتأنيث ولا للالحاق واغمابنى الاسم لهافصارت
  كانها من نفس الكامة لا تتصرف فى معرفة ولا فى نكرة اى لا ينوّن وحسكى سيبويه
  ما أصاب منه حبر برا ولا تبربراولاحورورا أى ما أصاب منه شيئا ويقال ما فى الذى تحدّثنا به
  حبر برأى شئء حبتر لحبتر بالنتح القصير مثل البحتر بجر ، لحجر بكسر الحا، وفتح
  الباء الغليظ وأنشد الاحر
  أرمى عليها وهى شىّ بجر • والقوس فيها وتر حيجر * وهى ثلاث أذرع وشبر
  محاح
