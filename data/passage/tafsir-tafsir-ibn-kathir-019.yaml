text: "ني عبد الله بن أبي بكر بن محمد بن عمرو بن حزم، عن أبيه قال: هذا كتاب رسول الله وللي عندنا، الذي كتبه لعمرو بن حزم، حين بعثه إلى اليمن يفقه أهلها ويعلمهم السنة، ويأخذ صدقاتهم. فكتب له كتابا وعهدا،"
