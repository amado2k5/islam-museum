text: "… قال : وكانت في يوم السبت رابع عشر شهر ربيع الآخر سنة ثلاث وثماذين وخمسمائة في وسط نهار الجمعة، وكان كثيراً ما يقصد لقاء العدو في يوم الجمعة عند الصلاة تبركاً بدعاء المسلمين والخطباء على المنابر، فسار في ذلك الوقت …"
