text: "… في أيديها مهز القوائم فيفضها، هذا إلى كون القعود لا يقضى به فرض اللّه في الجهاد، ولا يرعى به حقه في العباد، ولا يوفى به واجب التقليد الذي يطَّوَّقه الحادم من أتمة قضوا بالحق وبه كانوا يعدلون، وخلفاء كانوا في …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 181، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 181, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 181 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Wafayat al-A'yan de Ibn Khallikan, volume numérisé 1, p. 181, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Wafayat al-A'yan de Ibn Khallikan, volumen digitalizado 1, p. 181, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 1. cildinin 181. sayfasından bir alıntı, Allah ve Resulü'nün farz kıldığı, farz olan amelleri ve görevleri içermektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibnu Khallikan, \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka), Jilid 1, halaman 181, menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, termasuk amalan dan kewajiban yang wajib. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
