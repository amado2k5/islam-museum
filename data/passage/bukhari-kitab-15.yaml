summary:
  ar: "القسم 15 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاستسقاء»، ويضم فيها النصوص من 1005 إلى 1039 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 15 of Sahih al-Bukhari (Invoking Allah for Rain (Istisqaa)) in the division of the open hadith dataset the museum took its reports from: reports 1005 to 1039 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 15، عنوان «کتاب الاستسقاء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1005 تا 1039۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 15 de Sahih al-Bukhari (Invocando a Alá para que llueva (Istisqaa)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1005 al 1039 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du recueil de hadiths Sahih al-Bukhari, dans son ouvrage n° 15 (Invocation d'Allah pour la pluie – Istisqaa), des hadiths 1005 à 1039. Il conserve ces hadiths sous ce livre; les éditions imprimées les classent et les numérotent différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 15. bölümü \"Yağmur İsteme Kitabı\" başlığını taşımakta olup, 1005'ten 1039'a kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 15 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Memohon Hujan\" dan berisi teks 1005 hingga 1039, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
