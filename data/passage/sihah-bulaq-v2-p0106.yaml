text: |-
  •⁦(باب الواو والياء)⁩•
  ٤٨١
  أى لا نوهيه داهية ولا تغيره ورتاه أيضا أى شده وهو من الاضداد وفى الحديث أنّ انلفزيرة
  ترتوفؤاد المريض أى تشته وتقوّيه قال لبيديصف درعا
  فمة ذفرا ترتى بالعرا * قردمانياوتز كاكالبصل
  يعنى الدروع لهاء رافي أو .اطها فينيم ذيلها الى تلك العراوتشالى فوق لتشمر عن لاب-ها
  فذلك الشهوالرتو الاموى رتوت بالدلورتوا اذا مددتها مدار فيقاد قال غيره رتابرأسه
  يرتورتوا وهو مثل الايماه حكاء أبو عبيد ⁦(رئا)⁩ الرئية بالفتح وجع فى الركيتين
  والمفاصل قال جيديذ كركبره *ورئية تنهض بالتشدد • ويروى فى تشددى والمع
  رئيات قال الراجز
  وللكبيررثيات أربع * الركبتان والنسا والاخدع • ولا يزال رأسه يصدع
  ورثيت الميت حرئية ورتونته أيضا اذا بكيته وعددت محاسنه وكذلك اذا نظمت فيسه شعرا
  ورتى له أى رقله ابن السكيت قالت امر أمن العرب رثأت زوجى بأبيات وهمزت قال
  افترّاءربما خرجت بهم فصاحتهم الى أن يم. زوا ماليس بمهم وز قالوارثأت الميت ولبأت بالحج
  وحلات السويق تحلثة واتماهو من الحلاوة اذا كانت تنوح نياحة وامرأرثاءة ورثاية
  فن لم يهم زأخر جه على أصله ومن ه-مز فلانّ الياءاذا وقعت بعد الالف الساكنة همزت
  وكذلك القول فى سقاءة وسقاية وما أشبهها أبوء رورثيت عنه حديثا أرتى رثاية اذاذ كرته
  عنه ⁦( رجا)⁩. أرجيت الامر أخرنه يمم زولايهمز وقد قرئ وآخرون مرجون لامر اللّه
  وأرحه وأخاه فاذا وصفت الرجل به قلت رجل مرح وقوم مر جيسة واذا نسبت اليه قلت
  رحل مرجىّ بالتشديد على ماذ كرناه فى باب الهمز والرجاء من الامل ممدود يقال رجوت
  فسلانارجواورجاء ورجاوة ويقال ما أتبتك الارجاوة الخير وترجيته وارتجيته ورجبته كاه
  بمعنى رجوته قال بشر يخاطب بنته
  فرجى اخبروا نتظارى ايابي • اذا ما القارظ العنزى آبا
  ومالى فى فلان رجيسة أى ما أرجوه وقديكون الرجو والرجاء بمعنى الدوف قال اقه تعالى
  ما لسكم لا ترجون لله وقارا أى لا تخافون عظمة اللّٰه وقال أبوذؤيب
  اذ السعته النحل لم يرج لسعها • وحالفهافى دت نوب عواسل
  أى لم يخف ولم سال والرجامة صورناسية البتر وحافتاها وكل ناحمة رجابقال منه أرجيت
  والرجوان حافتا البثر فاذا هالوارمى به الرجوان أرادوا أنه طرح فى المهالك قال المرادى
  كان لم ترى قبلى أسيرامكبلا * ولارجلاير مى به الرجوان
  أى لا يستطيع أن يسمسك والمهع أرجاء قال تعالى والملك على أرجائها وقطيفة جراء أرجوان
  وأرجت الناقة دنانتاجهايم. زولايهمز والارجوان صبغ أجرشديد الهرة قال أبو عبيد
  وهو الذى يقال له النشاسيج قال والبهسرمان دونه ويقال أيضا الارجوان معسرّب وهو
  بالفارسية ارغوان وهو شجرله نورأ -رأحسن ما يكون وكللون يشبهه فه وأرجوان
  قال عمروين كلنوم
  كأن ثيابنا منا ومنهم • خضبن بأرجوان أوطلينا
  قوله اذ العته الخل الخ
  فى نسخة فى مادة نوب الدبر بدل
  اانخل وعوامل بدل عواسل
  والذوب النحل وهو جع نائب
  مشل عائط وع وط وفاره وفره
  لا نهساترعى وتنوب الى.كانها
  قال الاصمعى هو من النوبة التى
  تنوب الناس لوقت معروف
  وقال أبو عبيدة سحيت نو بالانها
  أضرب الي المواداح قال المؤاف
