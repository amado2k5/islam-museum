label: { ar: "الموطأ 573 — ابن عباس: كان النبي يعلمهم هذا الدعاء كما يعلمهم السورة: أعوذ بك من عذاب جهنم وعذاب القبر", en: "Muwatta 573" }
text: "اللهم إني أعوذ بك من عذاب جهنم، وأعوذ بك من عذاب القبر، وأعوذ بك من فتنة المسيح الدجال، وأعوذ بك من فتنة المحيا والممات"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي عن طاووس اليماني عن عبد الله بن عباس، أن النبي كان يعلمهم هذا الدعاء كما يعلمهم السورة من القرآن: التعوذ بالله من عذاب جهنم، ومن عذاب القبر، ومن فتنة المسيح الدجال، ومن فتنة المحيا والممات. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسحاق الطباع وابن علية وروح عند أحمد، والقعنبي عند أبي داود (1542)، وابن القاسم، وقتيبة عند مسلم (2/94) والنسائي، ومعن عند الترمذي (3494). {cite:muwatta-maruf-1997 p.295} {cite:muwatta-maruf-1997 p.296}"
