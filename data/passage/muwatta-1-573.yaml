label: { ar: "الموطأ 573 — ابن عباس: كان النبي يعلمهم هذا الدعاء كما يعلمهم السورة: أعوذ بك من عذاب جهنم وعذاب القبر", en: "Muwatta 573", es: "Muwatta 573", fr: "Muwatta 573", ur: "موطا 573", tr: "El-Muvatta 573 — İbn Abbas: Peygamberimiz onlara bu duayı, tıpkı şu sureyi öğrettiği gibi öğretirdi: Cehennem azabından ve kabir azabından sana sığınırım.", id: "Al-Muwatta 573 — Ibnu Abbas: Nabi biasa mengajarkan doa ini kepada mereka sebagaimana beliau mengajarkan surah: Aku berlindung kepada-Mu dari azab neraka dan azab kubur" }
text: "اللهم إني أعوذ بك من عذاب جهنم، وأعوذ بك من عذاب القبر، وأعوذ بك من فتنة المسيح الدجال، وأعوذ بك من فتنة المحيا والممات"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي عن طاووس اليماني عن عبد الله بن عباس، أن النبي كان يعلمهم هذا الدعاء كما يعلمهم السورة من القرآن: التعوذ بالله من عذاب جهنم، ومن عذاب القبر، ومن فتنة المسيح الدجال، ومن فتنة المحيا والممات. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسحاق الطباع وابن علية وروح عند أحمد، والقعنبي عند أبي داود (1542)، وابن القاسم، وقتيبة عند مسلم (2/94) والنسائي، ومعن عند الترمذي (3494). {cite:muwatta-maruf-1997 p.295} {cite:muwatta-maruf-1997 p.296}"
  id: "Malik meriwayatkannya dari Abu al-Zubayr al-Makki, dari Tawus al-Yamani, dari Abdullah ibn Abbas, bahwa Nabi (shalawat dan salam kepadanya) biasa mengajarkan doa ini kepada mereka sebagaimana beliau mengajarkan satu surah Al-Quran: memohon perlindungan kepada Allah dari siksa neraka, dari siksa kubur, dari pengadilan Antikristus, dan dari ujian hidup dan mati. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Ibn Hibban, al-Baghawi, Ishaq al-Tabba', Ibn 'Ulayyah, dan Rawh dalam kumpulan Ahmad, al-Qa'nabi dalam kumpulan Abu Dawud (1542), Ibn al-Qasim, Qutaybah dalam kumpulan Muslim (2/94) dan al-Nasa'i, dan Ma'n dalam kumpulan al-Tirmidhi (3494). {kutip:muwatta-maruf-1997 hal.295} {kutip:muwatta-maruf-1997 hal.296}"
