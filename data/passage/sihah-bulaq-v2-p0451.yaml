text: |-
  قوله وتجسل زكازك هو كعلابط
  ووفى القاموس
  قوله الزونك يعض بتشديد الذون
  كعمار كافى القاموس
  ٣ ف نسيخة زيادة زهير اه
  ٩٣٦
  *فصل السين).
  . (سلك:
  المهزول قال الراجز ياحيذاجارية من حك • مثل كتيب الرمل غيرزك
  ورجل زكازكك أى دميم قليل مك الزمكى مشل الزمجى وهومنيت ذنب الطائر
  ( زنك الزونك القصيرالدميم وريما هالوا الزونزك قاات امر أمترتى زوحَها
  ولست بوكواكولا بزونك • مكالمك -ق يبعث انخاق باعثه
  ويروى ولابزونزك
  صل السين بك سيكت الفضة وغيرها أسبكها سبكا أذبتها والفضة
  سيكة وابهع السبائك والنبك طرف مقدم الحافر والجع السنابك وفى الحديت تخرجكم
  الروم منها كفرا كفرا الى سنيك من الارض فشبه الارض التى يخرجون اليها بالنيك فى
  غلظه وقلة خيره ⁦( حك )⁩ اسجنكات الليل أى أظلم وشعر مسحنكات أى شديد السواد
  هرقته والفان الفاح وهو القادر على الكلام سكال السك الممار والهع
  السكاك قال الشاعر يصف درعا
  ومتدودة السك موضونة • تضاءل فى الطى كالمبرد
  قوله مشدودة عنصوب لانه معطوف عسلى قوله * وأع-ددت للحرب وثاية • وربماً قالوا
  سكىّ كايقال دوودوىّ ومنه قول الأعشى• كماسلك السكىّ فى الباب فيتق• والسن
  الدرع الضيقة الحلق والسك أن نضبب الهاب بالحديد والسكات صغر الاذن وأذن سكا.أى
  صغيرة يقال كل سكاء تبض وكل شرقاء تلد فالكاء التى لا أذن لها والشرقاء التى لما
  أذن وان كانت مشقوقة ويقال سكه يسكه اذا اصطلم أذنيه وهو يسك سكااذارق ما يجى.
  منه من الغائط واحصكت مسامعه أى صعت وضاقت ومنه قول الشاهر
  وتلث التى تستك منها المسامع * وقال عبيدين الابرص
  دعا معاشر فاسنكت مسامعهم • بالهف نفسى لويده وبنى أسة
  واستك النبت أى التف وانسة خصاصه قال الطرمّاح
  قال أبوعمر والسكة حديدة تحرث بها الارض والسكة العاريقة المصطفة من النخل
  ومنه قواهم خير المال مهرة مأمورة أرسكة مأبورة أى ملقعة وكان الاصعى يول السكة
  ههنا الحديدة التى يحرث بهاوم أبورة مصلحة قال ومعنى هذا المكلام خير المال نتاج أو
  زرع والسسكة الزقاق وسكة الدراهم هى المنقوشة والسك بالضم البتر الضيقة من أعلاها
  الى أسفلها ءن أبى زيدويسمى بحمر العقرب سكا والسك أيضامن الطيب عربى والسكالك
  والسكاكة الهوا الذى يلاقى أعنان السماء ومنه قواهم لا أفعل ذاك ولونزوت فى السكاك
  أى فى السماء والسكاسك أبو قبيلة من اليمن وهو السكاست بن واقلة بن حيربن سبا والنسبة
  اليهم سكسكى" ⁦( لك)⁩ السلك الخيط والسلك بالنتح مصدرسلكت الشى فى الشئ فانسلك
  أى أدخلته فيه فدخل ومنه قول الشاعر (٣ • واقصدبذرعك وانظرأين تنسلك •
  وقال تعالى كذلك سلكا. فى قلوب الجرمين وفيه لغة أخرى أساكته فيه قال عبدمناف
