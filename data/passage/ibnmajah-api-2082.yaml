label: { ar: "سنن ابن ماجه 2082 — تربية الأب ووصيته", en: "Sunan Ibn Majah 2082 — the father raising and counselling", ur: "سنن ابن ماجہ 2082 — باپ کی تربیت اور نصیحت", es: "Sunan Ibn Majah 2082 — El padre que cría y aconseja", fr: "Sunan Ibn Majah 2082 — l'éducation et les conseils du père", tr: "Sunan İbn Majah 2082 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan Ibn Majah 2082 — Didikan dan Wasiat Ayah" }
text: "… عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، عَنْ عُمَرَ بْنِ مُعَتِّبٍ، عَنْ أَبِي الْحَسَنِ، مَوْلَى بَنِي نَوْفَلٍ قَالَ سُئِلَ ابْنُ عَبَّاسٍ عَنْ عَبْدٍ طَلَّقَ، امْرَأَتَهُ تَطْلِيقَتَيْنِ ثُمَّ أُعْتِقَا أَيَتَزَوَّجُهَا قَالَ نَعَمْ. فَقِيلَ لَهُ عَمَّنْ قَالَ قَضَى بِذَلِكَ رَسُولُ اللَّهِ ـ. قَالَ عَبْدُ الرَّزَّاقِ قَالَ عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ لَقَدْ تَحَمَّلَ أَبُو الْحَسَنِ هَذَا صَخْرَةً عَظِيمَةً عَلَى عُنُقِهِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2082، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2082 (The Chapters on Divorce), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2082، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2082 (Los capítulos sobre el divorcio), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2082 (Les chapitres sur le divorce), mentionne le rôle du père dans l'éducation et le soutien des enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "İbn Majah'ın Sünen'inde yer alan 2082 numaralı hadiste, babanın terbiyesi ve nasihatlerinden bahsedilir. Bu hadis, \"İslam'da Babalık\" bölümü tarafından Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2082, menyebutkan tentang didikan dan nasihat seorang ayah. Hadits ini dikompilasi oleh bagian \"Kebapakan dalam Islam\", bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
