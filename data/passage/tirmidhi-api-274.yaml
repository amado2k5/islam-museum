label: { ar: "جامع الترمذي 274 — الأب والأبوة", en: "Jami' al-Tirmidhi 274 — the father and fatherhood", ur: "جامع ترمذی 274 — باپ اور والدیت", es: "Jami' al-Tirmidhi 274 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 274 — le père et la paternité" }
text: "… حَدَّثَنَا أَبُو خَالِدٍ الأَحْمَرُ، عَنْ دَاوُدَ بْنِ قَيْسٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ الأَقْرَمِ الْخُزَاعِيِّ، عَنْ أَبِيهِ، قَالَ كُنْتُ مَعَ أَبِي بِالْقَاعِ مِنْ نَمِرَةَ فَمَرَّتْ رَكَبَةٌ فَإِذَا رَسُولُ اللَّهِ قَائِمٌ يُصَلِّي. قَالَ فَكُنْتُ أَنْظُرُ إِلَى عُفْرَتَىْ إِبْطَيْهِ إِذَا سَجَدَ أَىْ بَيَاضِهِ. قَالَ وَفِي الْبَابِ عَنِ ابْنِ عَبَّاسٍ وَابْنِ بُحَيْنَةَ وَجَابِرٍ وَأَحْمَرَ بْنِ جَزْءٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 274، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 274 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 274، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 274 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 274 (Le Livre de la Salat (Prière)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
