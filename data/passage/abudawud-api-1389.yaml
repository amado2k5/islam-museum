label: { ar: "سنن أبي داود 1389 — الأب والأبوة", en: "Sunan Abi Dawud 1389 — the father and fatherhood", ur: "سنن ابی داؤد 1389 — باپ اور والدیت" }
text: "حَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، أَخْبَرَنَا حَمَّادٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ قَالَ لِي رَسُولُ اللَّهِ \" صُمْ مِنْ كُلِّ شَهْرٍ ثَلاَثَةَ أَيَّامٍ وَاقْرَإِ الْقُرْآنَ فِي شَهْرٍ \". فَنَاقَصَنِي وَنَاقَصْتُهُ فَقَالَ \" صُمْ يَوْمًا وَأَفْطِرْ يَوْمًا \". قَالَ عَطَاءٌ وَاخْتَلَفْنَا عَنْ أَبِي فَقَالَ بَعْضُنَا سَبْعَةَ أَيَّامٍ وَقَالَ بَعْضُنَا خَمْسًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 1389، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1389 (Prayer (Kitab Al-Salat): Detailed Injunctions about Ramadan), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1389، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
