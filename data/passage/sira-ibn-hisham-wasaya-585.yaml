text: "… جَنَّاب، حليف لهم من الأسد بن الغوث. قال ابن هشام : ويقال ابن حُبَاب. قال ابن إسحاق: ومن بني تَيْم بن مُرَّة: عبدالله بن أبي بكر الصديق، رُمِيَ بسهم فَمَاتَ منه بالمدينةِ بعد وَفَاةٍ رسولِ اللّٰه وَلِ عم ومن بني …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 585، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 585, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 585 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de la Sira de Ibn Hisham, pág. 585, que menciona un lecho de muerte y las últimas horas; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
