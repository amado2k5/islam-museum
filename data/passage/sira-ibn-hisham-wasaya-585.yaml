  tr: "İbn Hişam'ın Peygamber biyografisinden, ölüm anı ve vefatı anlatan 585. sayfadan bir alıntı; taranmış, makineyle okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Cuplikan dari biografi Nabi karya Ibnu Hisham, halaman 585, yang menyebutkan saat kematian dan wafat; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
