label: { ar: "سنن ابن ماجه 3446 — التلبينة", en: "Sunan Ibn Majah 3446 — talbina (barley gruel)", ur: "سنن ابن ماجہ 3446 — تلبینہ" }
text: "حَدَّثَنَا عَلِيُّ بْنُ أَبِي الْخَصِيبِ، حَدَّثَنَا وَكِيعٌ، عَنْ أَيْمَنَ بْنِ نَابِلٍ، عَنِ امْرَأَةٍ، مِنْ قُرَيْشٍ يُقَالَ لَهَا كَلْثَمُ عَنْ عَائِشَةَ، قَالَتْ قَالَ النَّبِيُّ ـ \" عَلَيْكُمْ بِالْبَغِيضِ النَّافِعِ التَّلْبِينَةِ \". يَعْنِي الْحَسَاءَ. قَالَتْ وَكَانَ رَسُولُ اللَّهِ ـ إِذَا اشْتَكَى أَحَدٌ مِنْ أَهْلِهِ لَمْ تَزَلِ الْبُرْمَةُ عَلَى النَّارِ حَتَّى يَنْتَهِيَ أَحَدُ طَرَفَيْهِ. يَعْنِي يَبْرَأُ أَوْ يَمُوتُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3446، يذكر التلبينة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3446 (Chapters on Medicine), that mentions talbina (barley gruel). The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3446، جس میں تلبینہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
