label: { ar: "سنن ابن ماجه 3446 — التلبينة", en: "Sunan Ibn Majah 3446 — talbina (barley gruel)", ur: "سنن ابن ماجہ 3446 — تلبینہ", es: "Sunan Ibn Majah 3446 - talbina (gachas de cebada)", fr: "Sunan Ibn Majah 3446 — Talbina (bouillie d'orge)", tr: "Sünen İbn Mace 3446 — Talbina", id: "Sunan Ibnu Majah 3446 — Talbina" }
text: "حَدَّثَنَا عَلِيُّ بْنُ أَبِي الْخَصِيبِ، حَدَّثَنَا وَكِيعٌ، عَنْ أَيْمَنَ بْنِ نَابِلٍ، عَنِ امْرَأَةٍ، مِنْ قُرَيْشٍ يُقَالَ لَهَا كَلْثَمُ عَنْ عَائِشَةَ، قَالَتْ قَالَ النَّبِيُّ ـ \" عَلَيْكُمْ بِالْبَغِيضِ النَّافِعِ التَّلْبِينَةِ \". يَعْنِي الْحَسَاءَ. قَالَتْ وَكَانَ رَسُولُ اللَّهِ ـ إِذَا اشْتَكَى أَحَدٌ مِنْ أَهْلِهِ لَمْ تَزَلِ الْبُرْمَةُ عَلَى النَّارِ حَتَّى يَنْتَهِيَ أَحَدُ طَرَفَيْهِ. يَعْنِي يَبْرَأُ أَوْ يَمُوتُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3446، يذكر التلبينة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3446 (Chapters on Medicine), that mentions talbina (barley gruel). The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3446، جس میں تلبینہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Ibn Majah, n.° 3446 (Capítulos sobre Medicina), menciona la talbina (gachas de cebada). El Navegador de Medicina la incluye en los textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3446 (Chapitres sur la médecine), mentionne la talbina (bouillie d'orge). Le navigateur de ressources médicales la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 3446 numaralı hadiste talbina'dan bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 3446, menyebutkan talbina. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
