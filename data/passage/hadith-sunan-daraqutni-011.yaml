text: "ة بن عبدالله) سنده صحيح، وقد رواه البخاري في مواضع من صحيحه في كتاب الزكاة وغيره مطولا ومختصرا بسند واحد، قال: حدثنا محمد بن عبدالله الأنصاري، حدثني أبي، حدثني ثمامة بن عبدالله: أن أنسا حدثه أن أبا بكر كتب له"
