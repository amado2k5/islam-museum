ref: "1.175"
label: { ar: "الموطأ 175 — إذا أقيمت الصلاة فأتوها وعليكم السكينة", en: "Muwatta 175" }
text: "إذا ثوب بالصلاة فلا تأتوها وأنتم تسعون، وأتوها وعليكم السكينة، فما أدركتم فصلوا وما فاتكم فأتموا"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن بن يعقوب عن أبيه وعن إسحاق بن عبد الله، كلاهما عن أبي هريرة، في باب ما جاء في النداء للصلاة: نهى النبي أن يأتي المصلون الصلاة ساعين إذا أقيمت، وأمرهم أن يأتوها بسكينة، فيصلوا ما أدركوا ويتموا ما فاتهم، لأن أحدهم في صلاة ما دام قاصداً إليها. ويفسر المحقق «ثُوّب» بأقيمت، ويخرّج الحديث عند ابن حبان (2148) وأحمد (2/460) والشافعي والبخاري في القراءة خلف الإمام والبيهقي من طرق أصحاب مالك، ويبين أن القعنبي وابن مهدي وعثمان بن عمر رووه عن مالك عن العلاء عن أبيه عن أبي هريرة دون ذكر إسحاق، فقول ابن عبد البر إنه لم يُختلف على مالك فيه نظر. {cite:muwatta-maruf-1997 p.115} {cite:muwatta-maruf-1997 p.116}"
