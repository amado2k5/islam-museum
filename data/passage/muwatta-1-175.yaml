label: { ar: "الموطأ 175 — إذا أقيمت الصلاة فأتوها وعليكم السكينة", en: "Muwatta 175", es: "Muwatta 175", fr: "Muwatta 175", ur: "موطا 175", tr: "El-Muvatta 175 — Namaz çağrısı yapıldığında, ona sükûnetle yaklaşın.", id: "Al-Muwatta 175 — Apabila azan dikumandangkan, datanglah dengan tenang." }
text: "إذا ثوب بالصلاة فلا تأتوها وأنتم تسعون، وأتوها وعليكم السكينة، فما أدركتم فصلوا وما فاتكم فأتموا"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن بن يعقوب عن أبيه وعن إسحاق بن عبد الله، كلاهما عن أبي هريرة، في باب ما جاء في النداء للصلاة: نهى النبي أن يأتي المصلون الصلاة ساعين إذا أقيمت، وأمرهم أن يأتوها بسكينة، فيصلوا ما أدركوا ويتموا ما فاتهم، لأن أحدهم في صلاة ما دام قاصداً إليها. ويفسر المحقق «ثُوّب» بأقيمت، ويخرّج الحديث عند ابن حبان (2148) وأحمد (2/460) والشافعي والبخاري في القراءة خلف الإمام والبيهقي من طرق أصحاب مالك، ويبين أن القعنبي وابن مهدي وعثمان بن عمر رووه عن مالك عن العلاء عن أبيه عن أبي هريرة دون ذكر إسحاق، فقول ابن عبد البر إنه لم يُختلف على مالك فيه نظر. {cite:muwatta-maruf-1997 p.115} {cite:muwatta-maruf-1997 p.116}"
  id: "Malik meriwayatkan hadits ini dari Al-Ala’ ibn Abd al-Rahman ibn Ya’qub, dari ayahnya dan dari Ishaq ibn Abdullah, keduanya dari Abu Hurayrah, dalam bab tentang apa yang diriwayatkan mengenai seruan azan: Nabi (shalawat dan salam kepadanya) melarang orang-orang yang beribadah untuk terburu-buru melaksanakan salat ketika seruan azan berkumandang, dan memerintahkan mereka untuk melaksanakannya dengan tenang, mengerjakan salat semampu mereka dan melengkapi bagian yang terlewat, karena seseorang dianggap telah melaksanakan salat selama ia berniat untuk melaksanakannya. Peneliti menafsirkan “thuwwab” sebagai “iqamah” (seruan azan telah dikumandangkan), dan ia menelusuri hadits ini kepada Ibn Hibban (2148), Ahmad (2/460), al-Shafi’i, al-Bukhari dalam bab tentang membaca di belakang imam, dan al-Bayhaqi melalui sanad para sahabat Malik. Ia menjelaskan bahwa al-Qa’nabi, Ibn Mahdi, dan Uthman ibn Umar meriwayatkan hadits ini dari Malik, dari Al-Ala’, dari ayahnya, dari Abu Hurayrah, tanpa menyebut Ishaq. Oleh karena itu, pernyataan Ibn Abd al-Barr bahwa tidak ada perbedaan pendapat mengenai riwayat Malik patut dipertanyakan. {cite:muwatta-maruf-1997 p.115} {cite:muwatta-maruf-1997 p.116}"
