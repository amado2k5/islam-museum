label: { ar: "الموطأ 223 — جابر: من صلى ركعة لم يقرأ فيها بأم القرآن فلم يصل إلا وراء الإمام", en: "Muwatta 223", es: "Muwatta 223", fr: "Muwatta 223", ur: "موطا 223", tr: "Al-Muwatta 223 — Cabir: Kur'an'ın ilk suresi olan Fatiha suresini okumadan bir rekat namaz kılan kimse, imamın arkasında kılınmadıkça namaz kılmış sayılmaz.", id: "Al-Muwatta 223 — Jabir: Barangsiapa yang mengerjakan satu rakaat shalat tanpa membaca Surah Al-Fatihah (Surah Al-Fatihah), maka shalatnya tidak dilakukan kecuali di belakang imam." }
text: "من صلى ركعة لم يقرأ فيها بأم القرآن فلم يصل، إلا وراء الإمام"
summary:
  ar: "أثر يرويه مالك عن أبي نعيم وهب بن كيسان أنه سمع جابر بن عبد الله يقول، في باب ما جاء في أم القرآن: من صلى ركعة لم يقرأ فيها بفاتحة الكتاب فلم يصل، إلا أن يكون وراء الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسماعيل بن موسى الفزاري وسويد وابن وهب وقتيبة عند الترمذي (313) ومحمد بن الحسن موقوفاً، وأن يحيى بن سلام البصري، وهو ضعيف، رواه عن مالك مرفوعاً عند الطحاوي ولا يصح ذلك. {cite:muwatta-maruf-1997 p.135} {cite:muwatta-maruf-1997 p.136}"
  tr: "Malik'in, Ebu Nu'aym Vahb ibn Kaysan'dan rivayet ettiği ve Cabir ibn Abdullah'ın şöyle dediğini aktaran bir rivayete göre, Kur'an'ın İlk Suresi hakkında rivayet edilenler bölümünde şöyle denmektedir: \"Kim Kitabın İlk Suresini (Fatiha) okumadan bir rekat namaz kılarsa, imamın arkasında namaz kılmadığı sürece namaz kılmış sayılmaz.\" Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, İsmail ibn Musa el-Fazari, Suveyd, İbn Vahb ve Kuteybe tarafından Tirmizi'de (313) ve Muhammed ibn el-Hasan tarafından da Sahabe sözü (mevkuf) olarak nakledildiğini belirtmektedir. Ayrıca, zayıf sayılan Yahya ibn Salam el-Basri'nin de bunu Malik'ten Peygamber sözü (merfu') olarak Tahavi'de naklettiği, ancak bunun sahih olmadığı belirtilmektedir. {cite:muwatta-maruf-1997 s.135} {cite:muwatta-maruf-1997 s.136}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Abu Nu'aym Wahb ibn Kaysan, yang mendengar Jabir ibn Abdullah berkata, dalam bab tentang apa yang telah diriwayatkan mengenai Surah Pembuka Al-Quran: \"Barangsiapa yang mengerjakan satu rakaat tanpa membaca Surah Pembuka Kitab (al-Fatihah), maka ia belum salat, kecuali jika ia salat di belakang imam.\" Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Isma'il ibn Musa al-Fazari, Suwayd, Ibn Wahb, dan Qutaybah dalam al-Tirmidhi (313), dan oleh Muhammad ibn al-Hasan sebagai pernyataan seorang Sahabat (mawquf). Disebutkan juga bahwa Yahya ibn Salam al-Basri, yang dianggap lemah, meriwayatkannya dari Malik sebagai pernyataan Nabi (marfu') dalam al-Tahawi, tetapi ini tidak sahih. {kutip:muwatta-maruf-1997 hal.135} {kutip:muwatta-maruf-1997 hal.136}"
