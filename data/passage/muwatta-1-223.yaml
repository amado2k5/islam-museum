text: "من صلى ركعة لم يقرأ فيها بأم القرآن فلم يصل، إلا وراء الإمام"
summary:
  ar: "أثر يرويه مالك عن أبي نعيم وهب بن كيسان أنه سمع جابر بن عبد الله يقول، في باب ما جاء في أم القرآن: من صلى ركعة لم يقرأ فيها بفاتحة الكتاب فلم يصل، إلا أن يكون وراء الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسماعيل بن موسى الفزاري وسويد وابن وهب وقتيبة عند الترمذي (313) ومحمد بن الحسن موقوفاً، وأن يحيى بن سلام البصري، وهو ضعيف، رواه عن مالك مرفوعاً عند الطحاوي ولا يصح ذلك. {cite:muwatta-maruf-1997 p.135} {cite:muwatta-maruf-1997 p.136}"
