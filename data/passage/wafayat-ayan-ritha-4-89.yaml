text: "… نعى ثم على بن موسى الرضا ثم موسى الكاظم ثم الأمام معفر السادق ثم الامام محمداد لياقوتم الامام زين العابدين ثم الامام حسين بن على ثم الامام بن أبي طالب كرم أللّه وجهمو رفي اللّه تعالى عنه روى ان اشتغال …"
summary:
  ar: "مقطع من وفيات الأعيان وأنباء أبناء الزمان، المجلد المصوَّر 4، ص 89، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Wafayat al-A'yan wa-Anba' Abna' al-Zaman, scan volume 4, p. 89, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "وفایت الاعیان و انبا ابنا الزمان، اسکین جلد 4، ص 89 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volume numérisé 4, p. 89, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volumen escaneado 4, p. 89, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Çağın Önemli Şahsiyetlerinin Biyografileri ve Haberleri) adlı resimli cilt 4'ün 89. sayfasından, bir ölüm ilanı ve duyurusu içeren bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve ölüm ilanlarını tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Biografi Tokoh Terkemuka dan Berita Putra-Putra Zaman), Jilid Bergambar 4, hlm. 89, berisi obituari dan pengumuman kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan obituari paling terkenal."
