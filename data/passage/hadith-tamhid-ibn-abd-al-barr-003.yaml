text: "تها (٢٣) سطرا، ورمزنا له (د٣)، وهو قليل الفائدة لتوفر مادته في نسخة الأصل. مجلد الخزانة الملكية بالرباط رقم (٩٢٧,٨): مجلد يقع في (١٧٥) ورقة مسطرتها (٢٥) سطرا، في كل سطر ١٦-١٧ كلمة، كتب بخط مغربي جيد لكن لا أثر"
