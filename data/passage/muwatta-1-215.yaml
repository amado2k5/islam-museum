label: { ar: "الموطأ 215 — قراءة عمر تُسمع عند دار أبي جهم بالبلاط", en: "Muwatta 215", es: "Muwatta 215", fr: "Muwatta 215", ur: "موطا 215", tr: "El-Muvatta 215 — Ömer'in Kur'an okuması, El-Balat'taki Ebu Cehm'in evinde duyulabilir.", id: "Al-Muwatta 215 — Bacaan Umar dapat didengar di rumah Abu Jahm di Al-Balat" }
summary:
  ar: "أثر يرويه مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر، في باب العمل في القراءة: كانوا يسمعون قراءة عمر بن الخطاب في الصلاة عند دار أبي جهم بالبلاط، لجهره ورفع صوته. ويعرّف المحقق البلاط بأنه موضع بالمدينة بين المسجد والسوق مبلّط، ويذكر أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.132}"
  tr: "Malik'in, amcası Ebu Suhayl ibn Malik'ten, o da babası Malik ibn Abi 'Amir'den rivayet ettiği, Kur'an okuma uygulaması bölümündeki bir rivayete göre: Ömer ibn el-Hattab'ın, yüksek ve duyulabilir sesi nedeniyle, el-Balat'ta, Ebu Cehm'in evinin yakınında namaz kılarken Kur'an okuduğunu duyarlardı. Araştırmacı, el-Balat'ı Medine'de cami ile çarşı arasında bulunan taş döşeli bir alan olarak tanımlar ve bu rivayetin Malik'ten Ebu Mus'ab, Suveyd, Abdülrazzak, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından nakledildiğini belirtir. {cite:muwatta-maruf-1997 s.132}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas pamannya Abu Suhayl ibn Malik, atas otoritas ayahnya Malik ibn Abi 'Amir, dalam bab tentang praktik membaca Al-Quran: Mereka biasa mendengar Umar ibn al-Khattab membaca Al-Quran saat shalat di dekat rumah Abu Jahm di al-Balat, karena suaranya yang keras dan terdengar jelas. Peneliti mendefinisikan al-Balat sebagai daerah beraspal di Madinah antara masjid dan pasar, dan menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, 'Abd al-Razzaq, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.132}"
