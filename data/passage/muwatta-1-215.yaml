label: { ar: "الموطأ 215 — قراءة عمر تُسمع عند دار أبي جهم بالبلاط", en: "Muwatta 215" }
summary:
  ar: "أثر يرويه مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر، في باب العمل في القراءة: كانوا يسمعون قراءة عمر بن الخطاب في الصلاة عند دار أبي جهم بالبلاط، لجهره ورفع صوته. ويعرّف المحقق البلاط بأنه موضع بالمدينة بين المسجد والسوق مبلّط، ويذكر أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.132}"
