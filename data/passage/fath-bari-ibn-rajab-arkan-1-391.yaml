text: "قول النبي عَاق: بني الإسلام على خمس وهو قول وفعل.......... من كره أن يعود في الكفر كما يكره أن يلقى في النار من رقم الباب دعاؤكم إيمانكم.. أمور الإيمان...... المسلم من سلم المسلمون من لسانه ويد...... أيّ الإسلام أفضل...... إطعام …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 391، يذكر ما بُني عليه الإسلام، وحلاوة الإيمان وكماله، ووصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 391, that mentions what Islam is built on, the sweetness and completeness of faith, a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 391 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے، ایمان کی مٹھاس اور اس کا کمال، مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 391, que menciona los fundamentos del Islam, la dulzura y la plenitud de la fe, y una descripción del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Fath al-Bari d'Ibn Rajab (tome 1, p. 391) évoquant les fondements de l'islam, la douceur et la plénitude de la foi, ainsi qu'une description du musulman. Ce passage, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. resimli cildinin 391. sayfasından, İslam'ın temellerini, imanın tatlılığını ve mükemmelliğini ve bir Müslümanın özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve bir müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, jilid 1 bergambar, halaman 391, yang menyebutkan dasar-dasar Islam, keindahan dan kesempurnaan iman, dan deskripsi seorang Muslim; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
