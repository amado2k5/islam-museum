text: "الْبَرَاءَ بْنَ عَازِبٍ، يَقُولُ لَمَّا صَالَحَ رَسُولُ اللَّهِ صلى الله عليه وسلم أَهْلَ الْحُدَيْبِيَةِ كَتَبَ عَلِيٌّ كِتَابًا بَيْنَهُمْ قَالَ فَكَتَبَ ‏\"‏ مُحَمَّدٌ رَسُولُ اللَّهِ ‏\"‏ ثُمَّ ذَكَرَ بِنَحْوِ حَدِيثِ مُعَاذٍ غَيْرَ أَنَّهُ لَمْ يَذْكُرْ فِي الْحَدِيثِ ‏\"‏ هَذَا مَا كَاتَبَ عَلَيْهِ ‏\"‏ ‏.‏"
summary:
