text: "دخلنا على أم سَلَمَة زوج النبي، وَلي، فأخْرَجَتْ إلينا من شعر رسول اللّه، في فإذا هو أحمر مصبوغ بالحنَّاءِ والكَتَّم. وأخبرنا علي بن أحمد بن عبدان، قال : حدثنا أحمد بن عبيد لصفَّار، قال : حدثنا تَمَتَام محمد بن غالب، …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 407، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
