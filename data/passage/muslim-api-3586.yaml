label: { ar: "صحيح مسلم 3586 — ما أُحل، ما لا يحل", en: "Sahih Muslim 3586 — what was made lawful; what is not lawful", ur: "صحیح مسلم 3586 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih Muslim 3586 — lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih Muslim 3586 — Ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih Muslim 3586 — Neler caizdir, neler caiz değildir", id: "Sahih Muslim 3586 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… قَالَ \" أَوَتُحِبِّينَ ذَلِكَ \". قُلْتُ لَسْتُ لَكَ بِمُخْلِيَةٍ وَأَحَبُّ مَنْ شَرِكَنِي فِي الْخَيْرِ أُخْتِي. قَالَ \" فَإِنَّهَا لاَ تَحِلُّ لِي \". قُلْتُ فَإِنِّي أُخْبِرْتُ أَنَّكَ تَخْطُبُ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. قَالَ \" بِنْتَ أُمِّ سَلَمَةَ \". قُلْتُ نَعَمْ. قَالَ \" لَوْ أَنَّهَا لَمْ تَكُنْ رَبِيبَتِي فِي حَجْرِي مَا حَلَّتْ لِي إِنَّهَا ابْنَةُ أَخِي مِنَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3586، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3586 (The Book of Suckling), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3586، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 3586 (El Libro de la Lactancia), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3586 (Le Livre de l'allaitement), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sahih Müslim'de 3586 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3586, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
