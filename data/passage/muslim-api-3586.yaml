label: { ar: "صحيح مسلم 3586 — ما أُحل، ما لا يحل", en: "Sahih Muslim 3586 — what was made lawful; what is not lawful", ur: "صحیح مسلم 3586 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… قَالَ \" أَوَتُحِبِّينَ ذَلِكَ \". قُلْتُ لَسْتُ لَكَ بِمُخْلِيَةٍ وَأَحَبُّ مَنْ شَرِكَنِي فِي الْخَيْرِ أُخْتِي. قَالَ \" فَإِنَّهَا لاَ تَحِلُّ لِي \". قُلْتُ فَإِنِّي أُخْبِرْتُ أَنَّكَ تَخْطُبُ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. قَالَ \" بِنْتَ أُمِّ سَلَمَةَ \". قُلْتُ نَعَمْ. قَالَ \" لَوْ أَنَّهَا لَمْ تَكُنْ رَبِيبَتِي فِي حَجْرِي مَا حَلَّتْ لِي إِنَّهَا ابْنَةُ أَخِي مِنَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3586، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3586 (The Book of Suckling), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3586، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
