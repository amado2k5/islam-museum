text: |-
  ٣٠٢
  وقدشر مواجلده فانشرم* والشارم السهم الذى يشرم جانب الغرض وشرم له بالفتح من
  ماله أى أعطاه قا لا وتشريم الصيدأن ينفلت جريها وقال * من بين محتقت لها ومشرّم
  والمتشريم التشقيق وفى حسديث اين غمر رضى اللّٰه عنهما أنه اشترى ناقة فرأى بها تشريم
  الفئارفردها وتشرّم الشىء تزق وتشقق والشرمة بالضم اسم جبل قال أوس
  تثوب عليهم من أبان وشرمة * وزجل أشرم بين الشرم أى مشروم الانف ولذلك قيل لابرهة
  الاشرم ⁦( شرذم)⁩ الشرذمة الطائفة من النساس والقطعة من الثئ وثوب شراذم
  أى قطع ظم) ابن السكيت الشيظم الشديد الطويل قال وأنشدنا أبو عمرو
  يلحن من أصوات جادشيظم • صاب عداه العطى منهم
  وكذلك الفرس والاننى شيظمة قال عنترة
  وانخيل تقتحم الخبارعوابسا • من بين شيظمة وآخر شيظم
  ويروى وأجرد شيظم ويقال الشظعى" الفتى الجسيم والدرس الرائع ( غم رجل شغموم
  ويجل شغعوم بالغين معجمة أى طويل وقال الخروع السعدى
  وتحت رحلى بازل شغعوم • مالم غاربه مدموم
  ريقال الشغاميم الطوال الحسان ( كم الشكم بالضم الجزاء قاذا كان العطاء ابتداء
  فهو الشكد بالدال تقول منه شكمته أى جزيته وفى الحديث انه عليه الصلاة والسلام
  جتجم ثم قال اشكموه أى أعطوه أبوه قال الشاعر
  أبلغ قتادة غيرسائله • جزل العطاء وعاجل الشكم
  وشكيم القدرعراها والسكيم والشكيمة فى اللجام الحديدة المعترضة فى فم الفرص التى فيم
  الفأس والبهع شكائم قال أبودواد
  فهى شوها، كالجوالق فرها • مستجاف يضل فيه الشكيم
  وفلان شديد الشكيمة اذا كان شديد النفس أنها أبياوفلان ذو شكيمة اذا كان لاينقاد
  قال عمرو بن شاس الاسدى يخاطب امرأه فى ابنه عرار
  وان عرارا ان يكن ذاشكيمة * تغافينها منه فا أمل الشيم .
  وشكمت الوالى اذارشوته كأنك -ددت فه بالشكيمة وقال قوم شكممشكما وشكيما عضه
  قال جرير • أصاب ابن جراء العجان شكيمها ومشكم بالكسراسم دجل لم لم على
  وزن بقم موضع بالسأم ويقمال هوامم مدينة بيت المقدص بالعبرانية وه ولا ينصرف للحجمة
  ووزت الفعل لجم الشلجم نبت معروف قال الراجز• نسألى براءين شلجما
  ⁦(شمم)⁩(شممت الشئ أشمه شما وشميما وشموت بالفتح أشم تاغة وقولهم يا ابن شامة الوذرة
  عكلة معناها القذف وأشممته الطيب فشمه واشتمه بمعى وتشموت الشئ شممت
  فى مهلة والمشامّة مفاعلة منه والتشامّ التفاعل والمشامّة الدنو من العدوّ-ق يتراءى
  الفريضان ويقال شاعم فلانا أى اتعار ماعنده وشاعت الرجل اذا قاربته ودنوت منه وشمام
  اسم جبل قال حرير
  عاينت مشعلة الرعال كانها * طير تغاول فى شمام وكورا
  ويروى بكسر الميم وله رأسان يسميان ابنى شمام قال لبيد
  •هل
