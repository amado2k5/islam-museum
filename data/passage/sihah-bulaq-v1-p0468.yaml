text: |-
  ١٧٣
  صل الحاء حرح الحرمخفف أصله حرح لانّ جعه أحراح وقالواحرون كما قانوا
  فى جمع المنقوص لدون ومئون والفسسبة اليه حرى وان شئت حرحىّ قتفتح عين الفعل
  كمافتحوها فى النسبة الى يدوغدفة الواغدوىّ ويدوى وان شئت قلت سرح كاقالوا
  رجل سته
  نصل الدال جح اصمعى دجح الرجسل تديها اذا بسط ظهره وطأطأر أ.ه
  فيكون رأسه أشداغطاطا من أليتيه وفى الحديث أنه نهى أنيد مح الرجل فى الركوع كمايدمح
  لمار وأبو عمرووابن الاعرابى نحوه ح دحت الشئ فى الارض اذادسته فيها
  قال أبو النجم و ومف قترة الصائد شختاخفيا فى الثرى مدحوحا والدحداح القصير
  وصكذلك الدحيدحة وأندح بطنه اندحاحا اتسع قال اعرابى مطار نالليلتين بقيتا فاند-ت
  الارض كلاً درح) رج-ل درحاية أى قصير سمين ضخم البطن وهو فعلاية
  ملق مجعظارة قال الراجز
  عوكا اذامشي درحايه * يحسبنى لا أعرف الحدايه
  ردح شيخ دروح بالمكسر أى كبير لح دلح الرجل اذا منى بحمله غير منبسط
  انخط ولثقله علميه وعابة داوح أى كثيرة الماء وسحائب دلح مثل راكع وركع وتدالها الشئ
  فيما بينهما اذا حلاه على عودو فى الحديث ان سلان وأبا الدرداء اشتريا لحمافتد الحاه يينه-ما
  ودولح اسم امرأة وح الداح نقش يلوح به للصبيان يعللون به يقال الدياداحة
  والدوحة الشجرة العظيمة.ن أى الشجر كان والجمع دوح
  كانّ بين فكها والفك • فأرمسك ذبحت فس.ك
  أى فتقت وربماً قالواذيحت الدنّ أى بزاته والذيح مصدرذمحت الشاة والذيح بالكسر
  ما يذيح قال اللّٰه تعالى وفديناه بذبح عظيم والذبيح المذبوح والانى ذبيحة وانماجاءت بالها.
  غلية الاسم عليها والذبيح الذى يصلح أن يذبح للفسك قاله ابن السكيت وأنشد لا بن أحر
  إماذيها واما كان حلانا واذبحت اتخذت ذبيها كقولك اطبخت اذا اتخذت طبيما
  وتذابح القوم أى ذبح بعضهم بعضا يقال التمادح التذابح والمذيح شق فى الارض مدار
  الشبرونحوه يقال غادر السيل فى الارض أخاديد ومذابح والمذابح أيضا المماريب سميت
  بذلك للقرابين والذباح بالضم والتشديد شقوق تكون فى باطن الاصابع فى الرجل ومنه
  قواهم مادونه شوكة ولاذباح وسعد الذايح منزل من منازل القمروهما كوكبان تيران بدنه-ما
  مقد ار ذراع وفى حرواحدمنه ما نجم صغير قريب منه كانه يذبحه فسمى ذابحما والذيح على
  مشان الهبع نبت تأكله النعام والذيحة وجع فى الحلق يقال أخذته الذيحة قاله أبوزيد
  ولم يعرف الذيحة بالتسكين الذى عليه العامة ⁦(ذرح)⁩ الذرّاح بالضم دويبة جراءمنقطة
  بسواد تطيروهى من السموم والجمع الذراريح وقال سيبويه واحد الذراريح ذرحرح وليس
  عمده فى الكلام فعول بواحدة وكان يقول سبوح وقدوس بنتح أوائلهما قال الراجز
  قالت له وريا اذا تتحخ • باليته يسقى على الذر حرح
  قوله الذى عليه العامة مع أنه هو
  الذى فى الديوات وققله الازهرى
  عن الاصمصى على ما فى المختار اه
  نقله تصصر
