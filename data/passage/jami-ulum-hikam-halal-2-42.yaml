text: "… : الأعمال بالنِّيَّات، وحديثُ : منْ أحدثَ في أمرِنا ما ليس منه فهو رَدٌّ، وحديثُ : الحلال بَيِّن والحرامُ بيِّن. فإنّ الدِّينَ كلَّه يَرجعُ إلى فعل المأموراتِ، وترك المحظورات، والتَّوقُّف عن الشُّبهاتِ، وهذا كلُّه تضمَّنه حديثُ السُّعمان بن بشيرٍ. وإنَّما …"
