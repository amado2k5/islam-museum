label: { ar: "سنن ابن ماجه 339 — الأب والأبوة", en: "Sunan Ibn Majah 339 — the father and fatherhood", ur: "سنن ابن ماجہ 339 — باپ اور والدیت", es: "Sunan Ibn Majah 339 — El padre y la paternidad" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنِ الْمِنْهَالِ بْنِ عَمْرٍو، عَنْ يَعْلَى بْنِ مُرَّةَ، عَنْ أَبِيهِ، قَالَ كُنْتُ مَعَ النَّبِيِّ ـ فِي سَفَرٍ فَأَرَادَ أَنْ يَقْضِيَ حَاجَتَهُ فَقَالَ لِي \" ائْتِ تِلْكَ الأَشَاءَتَيْنِ \". - قَالَ وَكِيعٌ يَعْنِي النَّخْلَ الصِّغَارَ. قَالَ أَبُو بَكْرٍ الْقِصَارَ - \" فَقُلْ لَهُمَا إِنَّ رَسُولَ اللَّهِ ـ يَأْمُرُكُمَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 339، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 339 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 339، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 339 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
