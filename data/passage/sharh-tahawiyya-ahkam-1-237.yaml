text: "… هم الذين يفعلون الفرائض والنوافل والمستحبات، ويجتنبون المحرمات والمكروهات وفضول المباحات، وهم المسارعون في الخيرات. والمقتصدون: هم الذين يؤدون الفرائض ويجتنبون المحارم، وليس لهم تميز في النوافل، وليس معنى ذلك أنهم لا يفعلون شيئًا من النوافل. فالمؤمنون هم أولياء الله، …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 237، يرد فيه ذكر الفريضة والفرائض، والمستحب، والنافلة والنوافل، والمحارم، والمكروه، والمباح، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 237, whose wording mentions the obligation (farida), the recommended (mustahabb), the supererogatory (nafila), the forbidden things (maharim), the disliked (makruh), the permitted (mubah), the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 237 کا اقتباس جس میں فریضہ اور فرائض، مستحب، نفل اور نوافل، محارم، مکروہ، مباح، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on the Tahawi creed de Ibn Abi al-'Izz, volume numérisé 1, p. 237, dont le texte mentionne l'obligation (farida), le recommandé (mustahabb), le surérogatoire (nafila), les interdits (maharim), le réprouvé (makruh), le permis (mubah), les choses interdites ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on the Tahawi creed de Ibn Abi al-'Izz, volumen digitalizado 1, p. 237, cuyo texto menciona la obligación (farida), lo recomendado (mustahabb), lo supererogatorio (nafila), lo vedado (maharim), lo reprobado (makruh), lo permitido (mubah), las cosas prohibidas; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
