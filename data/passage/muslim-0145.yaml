label: { ar: "مسلم 145 — بدأ الإسلام غريباً وسيعود غريباً فطوبى للغرباء", en: "Muslim 145 — Islam began as a stranger and will return a stranger", es: "Musulmán 145 — El Islam comenzó como un extraño y volverá a ser un extraño.", fr: "Muslim 145 — L'islam a commencé comme un étranger et retournera comme un étranger", ur: "مسلم 145 - اسلام ایک اجنبی کے طور پر شروع ہوا تھا اور اجنبی ہی واپس آئے گا۔", tr: "Müslim 145 — İslam, garip bir şey olarak başladı ve yine garip bir şey olacak; ne mutlu yabancılara!", id: "Muslim 145 — Islam bermula sebagai sesuatu yang asing dan akan kembali menjadi sesuatu yang asing, maka berbahagialah orang-orang asing" }
text: "قال رسول الله: «بدأ الإسلام غريباً وسيعود كما بدأ غريباً، فطوبى للغرباء»"
summary:
  ar: "رواية أبي هريرة في كتاب الإيمان من صحيح مسلم؛ غربة الإسلام في بدئه ومآله والطوبى للغرباء — من أشهر نصوص فتن الآخرة، وفي رواية ابن عمر «يأرز بين المسجدين كما تأرز الحية في جحرها»."
  tr: "Sahih Müslim'deki İman Kitabı'nda Ebu Hurayra'nın rivayeti; İslam'ın başlangıcında ve sonunda yabancılaşması ve yabancıların iyiliği - ahiret azaplarının en meşhur metinlerinden biri - ve İbn Ömer'in rivayetinde, \"İki mescit arasına bir yılanın yuvasına çekildiği gibi çekilecektir.\""
  id: "Riwayat Abu Hurairah dalam Kitab Iman dari Sahih Muslim; Keterasingan Islam pada awal dan akhir serta keberuntungan orang asing — salah satu teks paling terkenal tentang cobaan di akhirat, dan dalam riwayat Ibnu Umar, “Dia akan mundur di antara dua masjid seperti ular yang mundur ke dalam lubangnya.”"
