label: { ar: "الموطأ 1068 — هشام بن عروة عن أبيه: كان لا يجمع بين السبعين، لا يصلي بينهما، ولكنه كان يصلي بعد كل سبع ركعتين، فربما صلى عند المقام أو عند غيره", en: "Muwatta 1068", es: "Muwatta 1068", fr: "Muwatta 1068", ur: "موطا 1068", tr: "El-Muvatta 1068 — Hişam ibn Urve, babasından rivayetle: Yetmiş rekatı birleştirmedi, aralarında da namaz kılmadı; fakat her yedi rekattan sonra iki rekat daha namaz kılardı ve bazen de makamda veya başka bir yerde namaz kılardı.", id: "Al-Muwatta 1068 — Hisham ibn Urwah, berdasarkan keterangan ayahnya: Beliau tidak menggabungkan tujuh puluh rakaat, dan tidak pula shalat di antara rakaat-rakaat tersebut, tetapi beliau shalat dua rakaat setelah setiap tujuh rakaat, dan terkadang beliau shalat di Maqam atau di tempat lain." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان لا يجمع بين السبعين، لا يصلي بينهما، ولكنه كان يصلي بعد كل سبع ركعتين، فربما صلى عند المقام أو عند غيره. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1291) وسويد (554). {cite:muwatta-maruf-1997 p.494}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, yetmiş rekatı birleştirmediğini, aralarında namaz kılmadığını, her yedi rekattan sonra iki rekat daha kıldığını, bazen İbrahim Makamı'nda veya başka bir yerde namaz kıldığını nakletmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1291) ve Suveyd (554) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.494}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa ia tidak menggabungkan tujuh puluh rakaat, dan tidak pula shalat di antara rakaat-rakaat tersebut, tetapi ia shalat dua rakaat setelah setiap tujuh rakaat, kadang-kadang shalat di Surga Ibrahim atau di tempat lain. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1291) dan Suwaid (554). {cite:muwatta-maruf-1997 p.494}"
