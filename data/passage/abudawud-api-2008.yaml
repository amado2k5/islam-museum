ref: "2008"
label: { ar: "سنن أبي داود 2008 — الأب والأبوة", en: "Sunan Abi Dawud 2008 — the father and fatherhood", ur: "سنن ابی داؤد 2008 — باپ اور والدیت", es: "Sunan Abi Dawud 2008 — El padre y la paternidad", fr: "Sunan Abi Dawud 2008 — le père et la paternité", tr: "Sunan Abi Dawud 2008 — Baba ve Babalık", id: "Sunan Abi Dawud 2008 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ إِنَّمَا نَزَلَ رَسُولُ اللَّهِ الْمُحَصَّبَ لِيَكُونَ أَسْمَحَ لِخُرُوجِهِ وَلَيْسَ بِسُنَّةٍ فَمَنْ شَاءَ نَزَلَهُ وَمَنْ شَاءَ لَمْ يَنْزِلْهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2008، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2008 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2008، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 2008 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud n° 2008 (Les Rites du Hajj [Kitab Al-Manasik Wa'l-Hajj]) mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan Abi Davud'da yer alan 2008 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2008, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
