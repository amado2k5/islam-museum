text: "… شىء راحعته فيه : إنى لم أقل لك : ليس به بأس، إما قلت لك : لا أعلى به بأسا. الأشعث قال: كال بى سيرين إدا سئل عن شىء من المقه الحلال والحرام تغير لوه وتدل حتى كأن ليس بالدى …"
