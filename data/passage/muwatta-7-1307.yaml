label: { ar: "الموطأ 1307 — مالك: ما أصابه العدو من أموال المسلمين فأدرك قبل القسمة فهو رد على أهله، وما وقعت فيه المقاسم فلا يرد", en: "Muwatta 1307", es: "Muwatta 1307", fr: "Muwatta 1307", ur: "موطا 1307", tr: "El-Muvatta 1307 — Malik: Düşmanın Müslümanların mallarından ele geçirdiği ve bölüşülmeden önce geri aldığı her şey sahiplerine iade edilir; fakat bölüşüldükten sonra geri verilmez.", id: "Al-Muwatta 1307 — Malik: Apa pun yang dirampas musuh dari harta kaum Muslimin dan diperoleh kembali sebelum dibagi, akan dikembalikan kepada pemiliknya, tetapi apa pun yang telah dibagi tidak akan dikembalikan." }
summary:
  ar: "يقول مالك فيما يصيب العدو من أموال المسلمين، إنه إن أدرك قبل أن تقع فيه المقاسم فهو رد على أهله، وأما ما وقعت فيه المقاسم فلا يرد على أحد. {cite:muwatta-maruf-1997 p.583}"
  tr: "Malik, Müslümanlara ait olup düşman eline geçen mallar hakkında şöyle der: Eğer ganimet paylaşımından önce geri alınırsa, hak sahiplerine iade edilir; ancak ganimet paylaşımından sonra geri alınırsa, kimseye iade edilmez. {cite:muwatta-maruf-1997 s.583}"
  id: "Malik mengatakan mengenai harta milik kaum Muslimin yang jatuh ke tangan musuh, jika harta tersebut ditemukan kembali sebelum pembagian rampasan perang, maka dikembalikan kepada pemiliknya yang sah; namun, jika sudah dibagi, maka tidak dikembalikan kepada siapa pun. {cite:muwatta-maruf-1997 p.583}"
