text: "قال أبو عَمْرو الدالي : الغازي بن قيس الأمويّ القُرطبيّ، قرأ على نافع وضبط عنه اختياره، وسمع من ابن أبي ذئب، وهو أول من أدخل قراءة نافع وموطأ مالك الأندلس. وعنه قال: عرضت مُصْحَفي هذا، مُصْحَف نافع بن أبي نُعَيم …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 16، ص 332، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 16, p. 332, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 16، ص 332 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
