text: "… أعلم. قيلَ له : انظر. قالَ: ما أَعلم شيئًا، غيرَ أني كنتُ أُبايعُ الناسَ في الدنيا وأُجازيهم، فأُنظرُ الموسرَ وأَتجاوزُ عن المعسرِ فأَدخلَهُ اللّهُ الجنةَ. - قالَ: وسمعتُه يقولُ: إِنَّ رجلاً حضرَهُ الموتُ، فلمَّا يئس من الحياة أَوصى أهلَهُ: إذا …"
