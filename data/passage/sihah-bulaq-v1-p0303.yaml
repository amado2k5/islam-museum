text: |-
  ٢ ا أوّلان يفتحات والاخيران
  بكسرأوائلهما اه
  ٢٣٨
  (باب ا⁦(٠١)⁩
  بالفتح مابين اللمحيين والشجر الصرف يقال ماشجرك عفه أى ماصرفك وقد شيربى عنه
  الشواجروشجره بالرمح أى طعنه رشجر بيته أى ع_ده:٩مود وشجر بين القوم اذا اختلف
  الامس بينهم وشجرت الذى طرحته على المشجر وهو المشجب واشتجر القوم وتشاجروا أى
  تنازء واوالمشاجرة المنازعة وتشاجروا بالرماح تطاعنوا واشتبر الرجل اذا وضع يده
  تحت شجره على حنكه قال أبو ذؤيب
  نام انلخلىّ وبت الليل مشتجرا * كأنّ عبي فيها الصاب .ذبوح
  ابن السكيت يقال شابر المال اذارعى العشب والبة-ل فلم ييق منه-ماشئ فصار الى الشجر
  يرعاه قال الراجز
  تعرف فى أوجهها البشار * آسان كل آفق مشاجر
  ودياج مشهجر :قشه على هيئة الشجر ⁦( لشر)⁩ بقال شهرعمان وشحر عمان وهو
  ساحل البحربين عمان وعدن ( خر الشخيررفع الصوت بالنخر يقال شخرالحمار
  يشخر با اكسر شخيرا ومطرّف بن عبد اللّٰه بن الشخير مشال الفسيق لانه ليس فى كلام
  العرب فعيل ولا فعيل ١ ) ذر لشذر من الذهب ما يلقط من المعدن من غيراذاية
  الجارة والقطعة منه شذرة وقال
  ذهب لما انرآها ترمله * وقال ياقوم رأيت منكره * شذرة واداورأيت الزهره
  والشذرأيضاصغار المؤاؤوتة رقواشذر مذروشذر.ذر( ذاذهبوا فى كل وجه وانتشذر
  الاستثفار بالثوب أوبالذنب بقال تشذرفلان اذاتم أللقتال وتشذرالوم فى الحرب
  تطاولوا وتشذرفرسه اذاركبه من ورائه واتشذر الوعيد ومنه قول ايمان بن صرد بلغنى
  عن أميرالمؤمنيز ذره من قول تشذرلى به من شتم وايعاد فسرت اليه جوادا قال أبو ببيد
  است أشك فيها بالذال قال وبعضم يقول تشزر بالزاى والشوذر اللهفة وه ومعرب وأصله
  بالفارسية جاذر وقال الراجز متضرح عن جانبيه الشوذر ⁦(شرد)⁩ الشرّنقيض اخير
  يقال شررت يارجل وشروت لغتان شراوشروا وشرارة وفلان شرّ الماس ولا يقال أشرّ
  اناس الافى لغة ردينة و.نه قول احرأة من العرب أءمذل بالله من نفس -رى وعين شرّى
  .أى خبيثة من الشرّ أخرجته على فعلى مثل أصغروه فرى وقوم أشرار واشراء وقال يونس
  واحد الاشراررجل شرّ مثل زند وأزناد وقال الاخفش واحدها شريروه والرجل ذوالشرّ
  مثل ينيم وأيتام ورجل شرير مثال فسبق أى كثير الشرّ وشرّة النباب حرصه ونشاطه
  والشرّة أيضامصدر الشرّ والشرارة واحدة الشراروهوما يتطاير من الشار وكذلك الشرد
  الواحدة شررة والشرّان شيه بالبعوض يغشى وجه الانسان ولا يعض وربماسموه الاذى
  والنمرّ بالضم العيب بقال ماقلت ذلك لشرّك وانماقاته لغيرشرّ ك أى لغيرعسك والمشارّة
  المخاصمة وشروت النوب بسطلته فى الشهس وكذلك انتشر يروشررت الاقط أشرهشر
  اذا جعاته على خصفة ايجف وكذلك شررت الملح واللهم وغيره والاشرارة ما يبسط عليه الاقط
  وغيره والهع الاشارير وبقال الاشار ير قطع قديد قال الشاعر
  لما أشارير من نلحم تتمره * من الثعالى ووخزمن أراتيتها
  وأشررت الرجل نسبته الى الشرّ وبعضهم ينكره قال الشاعر طرفة
