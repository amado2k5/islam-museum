label: { ar: "سنن أبي داود 4586 — الطب والطبيب", en: "Sunan Abi Dawud 4586 — medicine and the physician", ur: "سنن ابی داؤد 4586 — طب اور طبیب", es: "Sunan Abi Dawud 4586 — La medicina y el médico", fr: "Sunan Abi Dawud 4586 — la médecine et le médecin", tr: "Sunan Abi Dawud 4586 — Tıp ve Hekim", id: "Sunan Abi Dawud 4586 — Kedokteran dan Tabib" }
text: "… وَمُحَمَّدُ بْنُ الصَّبَّاحِ بْنِ سُفْيَانَ، أَنَّ الْوَلِيدَ بْنَ مُسْلِمٍ، أَخْبَرَهُمْ عَنِ ابْنِ جُرَيْجٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" مَنْ تَطَبَّبَ وَلاَ يُعْلَمُ مِنْهُ طِبٌّ فَهُوَ ضَامِنٌ \". قَالَ نَصْرٌ قَالَ حَدَّثَنِي ابْنُ جُرَيْجٍ. قَالَ أَبُو دَاوُدَ هَذَا لَمْ يَرْوِهِ إِلاَّ الْوَلِيدُ لاَ نَدْرِي هُوَ صَحِيحٌ أَمْ لاَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4586، يذكر الطب والطبيب. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4586 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions medicine and the physician. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4586، جس میں طب اور طبیب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 4586 (Tipos de sangre-inteligencia (Kitab Al-Diyat)), menciona la medicina y al médico. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 4586 (Types de sang – Kitab Al-Diyat), mentionne la médecine et le médecin. Le Répertoire des ressources médicales le classe parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 4586 numaralı hadis, tıp ve hekimden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4586, menyebutkan tentang pengobatan dan tabib. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
