label: { ar: "سنن أبي داود 4586 — الطب والطبيب", en: "Sunan Abi Dawud 4586 — medicine and the physician", ur: "سنن ابی داؤد 4586 — طب اور طبیب" }
text: "… وَمُحَمَّدُ بْنُ الصَّبَّاحِ بْنِ سُفْيَانَ، أَنَّ الْوَلِيدَ بْنَ مُسْلِمٍ، أَخْبَرَهُمْ عَنِ ابْنِ جُرَيْجٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" مَنْ تَطَبَّبَ وَلاَ يُعْلَمُ مِنْهُ طِبٌّ فَهُوَ ضَامِنٌ \". قَالَ نَصْرٌ قَالَ حَدَّثَنِي ابْنُ جُرَيْجٍ. قَالَ أَبُو دَاوُدَ هَذَا لَمْ يَرْوِهِ إِلاَّ الْوَلِيدُ لاَ نَدْرِي هُوَ صَحِيحٌ أَمْ لاَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4586، يذكر الطب والطبيب. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4586 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions medicine and the physician. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4586، جس میں طب اور طبیب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
