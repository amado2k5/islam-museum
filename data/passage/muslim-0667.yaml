label: { ar: "مسلم 667 — مثل الصلوات الخمس كمثل نهر جار على باب أحدكم", en: "Muslim 667 — The five prayers are like a river at your door" }
text: "قال رسول الله: «أرأيتم لو أن نهراً بباب أحدكم يغتسل منه كل يوم خمس مرات، هل يبقى من درنه شيء؟» قالوا: لا يبقى من درنه شيء؛ قال: «فذلك مثل الصلوات الخمس، يمحو الله بهن الخطايا»"
summary:
  ar: "رواية أبي هريرة وجابر بن عبد الله في كتاب الطهارة من صحيح مسلم؛ مثل النهر الغمر للصلوات الخمس في محو الخطايا — من أشهر أمثال الصلاة."
