label: { ar: "مسلم 667 — مثل الصلوات الخمس كمثل نهر جار على باب أحدكم", en: "Muslim 667 — The five prayers are like a river at your door", es: "Musulmán 667 — Las cinco oraciones son como un río a tu puerta.", fr: "Muslim 667 — Les cinq prières sont comme un fleuve à votre porte", ur: "مسلم 667 - پانچوں نمازیں تمہارے دروازے پر دریا کی طرح ہیں۔", tr: "Müslim 667 — Beş vakit namaz, sizden birinin kapısının önünde akan bir nehir gibidir.", id: "Muslim 667 — Lima shalat harian itu seperti sungai yang mengalir di depan pintu rumah salah seorang dari kalian." }
text: "قال رسول الله: «أرأيتم لو أن نهراً بباب أحدكم يغتسل منه كل يوم خمس مرات، هل يبقى من درنه شيء؟» قالوا: لا يبقى من درنه شيء؛ قال: «فذلك مثل الصلوات الخمس، يمحو الله بهن الخطايا»"
summary:
  ar: "رواية أبي هريرة وجابر بن عبد الله في كتاب الطهارة من صحيح مسلم؛ مثل النهر الغمر للصلوات الخمس في محو الخطايا — من أشهر أمثال الصلاة."
  tr: "Sahih Müslim'deki Temizlik Kitabı'nda Ebu Hurayra ve Cabir bin Abdullah'ın rivayetine göre; beş vakit namazın günahları silmesi, adeta taşan bir nehir gibidir; namazın en meşhur örneklerinden biridir."
  id: "Riwayat Abu Hurairah dan Jabir bin Abdullah dalam Kitab Penyucian dari Sahih Muslim; seperti sungai yang meluap untuk lima shalat harian dalam menghapus dosa — salah satu contoh shalat yang paling terkenal."
