label: { ar: "الموطأ 2370 — مالك: المدبر إذا جرح وهلك سيده ولا مال له غيره", en: "Muwatta 2370" }
summary:
  ar: "قال مالك: والأمر عندنا في المدبر إذا جرح ثم هلك سيده وليس له مال غيره: أنه يعتق ثلثه، ثم يُقسم عقل الجرح أثلاثا، فيكون ثلث العقل على الثلث الذي عتق، ويكون ثلثاه على الثلثين اللذين بأيدي الورثة. فإن شاءوا أسلموا ما لهم منه إلى صاحب الجرح، وإن شاءوا أعطوه ثلثي العقل وأمسكوا نصيبهم من العبد؛ لأن جناية العبد لم تكن دينا على السيد. {cite:muwatta-maruf-1997 p.375} {cite:muwatta-maruf-1997 p.376}"
