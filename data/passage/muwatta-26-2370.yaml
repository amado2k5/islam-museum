label: { ar: "الموطأ 2370 — مالك: المدبر إذا جرح وهلك سيده ولا مال له غيره", en: "Muwatta 2370", es: "Muwatta 2370", fr: "Muwatta 2370", ur: "موطا 2370" }
summary:
  ar: "قال مالك: والأمر عندنا في المدبر إذا جرح ثم هلك سيده وليس له مال غيره: أنه يعتق ثلثه، ثم يُقسم عقل الجرح أثلاثا، فيكون ثلث العقل على الثلث الذي عتق، ويكون ثلثاه على الثلثين اللذين بأيدي الورثة. فإن شاءوا أسلموا ما لهم منه إلى صاحب الجرح، وإن شاءوا أعطوه ثلثي العقل وأمسكوا نصيبهم من العبد؛ لأن جناية العبد لم تكن دينا على السيد. {cite:muwatta-maruf-1997 p.375} {cite:muwatta-maruf-1997 p.376}"
  tr: "Malik şöyle dedi: Efendisinin ölümü üzerine özgürlüğüne kavuşacağı vaat edilen bir kölenin yaralanması ve efendisinin ölmesi, ayrıca başka mal varlığının olmaması durumunda, kölenin üçte birinin azat edilmesi gerektiği hükmümüz vardır. Yaralanma tazminatı ise üçte birine bölünür: Tazminatın üçte biri azat edilen kısma, üçte ikisi ise mirasçıların elinde bulunan üçte iki kısma gider. Mirasçılar isterlerse, tazminatın üçte ikisini köleyi yaralayana verebilirler; isterlerse, tazminatın üçte ikisini verip kölenin kendi paylarını tutabilirler, çünkü kölenin yaralanması efendinin borcu değildir. {cite:muwatta-maruf-1997 s.375} {cite:muwatta-maruf-1997 s.376}"
  id: "Malik berkata: Putusan kami mengenai seorang budak yang dijanjikan kebebasan setelah kematian tuannya, jika ia terluka dan kemudian tuannya meninggal dan ia tidak memiliki harta lain, adalah bahwa sepertiga dari dirinya dibebaskan. Kemudian kompensasi atas luka tersebut dibagi menjadi tiga: sepertiga dari kompensasi diberikan kepada sepertiga yang dibebaskan, dan dua pertiga diberikan kepada dua pertiga yang berada di tangan ahli waris. Jika mereka mau, mereka dapat memberikan bagian mereka kepada orang yang melukainya, atau jika mereka mau, mereka dapat memberikan dua pertiga dari kompensasi dan menyimpan bagian mereka atas budak tersebut, karena luka budak tersebut bukanlah hutang yang harus dibayar oleh tuannya. {cite:muwatta-maruf-1997 p.375} {cite:muwatta-maruf-1997 p.376}"
