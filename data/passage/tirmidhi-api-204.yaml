label: { ar: "جامع الترمذي 204 — الأب والأبوة", en: "Jami' al-Tirmidhi 204 — the father and fatherhood", ur: "جامع ترمذی 204 — باپ اور والدیت", es: "Jami' al-Tirmidhi 204 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 204 — le père et la paternité" }
text: "… يَكُونَ عَلَى غَيْرِ وُضُوءٍ أَوْ أَمْرٌ لاَ بُدَّ مِنْهُ. وَيُرْوَى عَنْ إِبْرَاهِيمَ النَّخَعِيِّ أَنَّهُ قَالَ يَخْرُجُ مَا لَمْ يَأْخُذِ الْمُؤَذِّنُ فِي الإِقَامَةِ. قَالَ أَبُو عِيسَى وَهَذَا عِنْدَنَا لِمَنْ لَهُ عُذْرٌ فِي الْخُرُوجِ مِنْهُ. وَأَبُو الشَّعْثَاءِ اسْمُهُ سُلَيْمُ بْنُ أَسْوَدَ وَهُوَ وَالِدُ أَشْعَثَ بْنِ أَبِي الشَّعْثَاءِ. وَقَدْ رَوَى أَشْعَثُ بْنُ أَبِي الشَّعْثَاءِ هَذَا الْحَدِيثَ عَنْ أَبِيهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 204، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 204 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 204، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 204 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 204 (Le Livre de la Salat (Prière)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
