label: { ar: "الموطأ 2334 — مالك: مكاتب كاتب عبدا فعتق قبل سيده", en: "Muwatta 2334" }
summary:
  ar: "قال مالك: وكذلك لو كاتب المكاتب عبدا، فعتق المكاتب الآخر قبل سيده الذي كاتبه، فإن ولاءه لسيد المكاتب، ما لم يعتق المكاتب الأول الذي كاتبه؛ فإن عتق الذي كاتبه رجع إليه ولاء مكاتبه الذي كان عتق قبله. وإن مات المكاتب الأول قبل أن يؤدي، أو عجز عن كتابته وله ولد أحرار، لم يرثوا ولاء مكاتب أبيهم، لأنه لم يبق لأبيهم الولاء حتى يعتق. {cite:muwatta-maruf-1997 p.361} {cite:muwatta-maruf-1997 p.362}"
