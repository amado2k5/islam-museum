label:
  ar: "ابن ماجه 4200 — هذا عبدي حقا: من أحسن الصلاة في السر والعلانية"
  en: "Ibn Majah 4200 — This is truly My servant: who prays well in private and in public"
  ur: "ابن ماجہ 4200 — یہ واقعی میرا بندہ ہے: جو چھپ کر اور سب کے سامنے اچھی نماز پڑھے"
text: "إن العبد إذا صلى في العلانية فأحسن وصلى في السر فأحسن - قال الله عز وجل هذا عبدي حقا ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4200: هذا عبدي حقا: من أحسن الصلاة في السر والعلانية. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4200: This is truly My servant: who prays well in private and in public. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4200: یہ واقعی میرا بندہ ہے: جو چھپ کر اور سب کے سامنے اچھی نماز پڑھے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
