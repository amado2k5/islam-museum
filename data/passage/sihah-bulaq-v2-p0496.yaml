  وأسحق الثوب أى أخلق وبلى ءن يعقوب قال وأسجق خف البعير أى مرن وأسحدق الضرع
  أى ذهب لبنه وبلى ولصق بالبطن قال لبيد
  حنى اذا يست وأسحق حالق • لم يبلدارضاعها رفطامها
  والسحوق من النخل الطويلة والمع سيحق وأتان محوق وحار سوق أى طويل والسوحق
  الطويل واسحق اسم رجل فان أردت به الاسم الاعجمى لم تصرفه فى المعرفة لانه غير عن
  جهته فوقع فى كلام العرب غير معروف المذهب وان أردت المصدر من قولك أسحقه السفر
  اسجافا أى أبعده صرفته لانه لم يتغير والسمجوق من النخل الطويلة والميم زائدة والسمداق
  قشرة رقيقة فوق عظم الرأس وبهاسميت الشجة اذا بلفت اليها سمحافا وسماحيق السماه
  القطع الرقاق من الغيم وعلى ترب الشاة سماحيق من شهم وأرى الميمات فى هذه الكامات
  زوائد(سذق السوذق بالفتح السوار وأنشد أبوعمروبر العلاء
