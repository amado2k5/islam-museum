text: "… الصَّيْد، وهذا أمرٌ بعد الحظر، والصحيح الذي يَثْبُت على السَّبْر أنَّه يُرَدُّ الحكم إلى ما كان عليه قبل النَّهْيِ، فإن كان واجبّا رده واجبّا، وإن كان مستحبًّا فمُسْتَحَبٌّ، أو مباحًا فمباح. ومن قال: إنَّه عِلىٰ الوجوبَ، يُنْتَقَضُ عليه بآياتٍ كثيرةٍ، …"
summary:
