text: "… القنطرى بن عبد الملك بن زمجويه بن هارون ابو نشيط الربعى بن يحيى بن عبد اللّه بن خالد الذهلى الامام يحيى بن معاذ الرازى الواعظ يحي بن عبدا للّه الجلاء بن عمر وبن حماد بن عطاء الجماز سنة وو قائعها …"
summary:
  ar: "مقطع من المنتظم في تاريخ الملوك والأمم، المجلد المصوَّر 3، ص 182، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Muntazam of Ibn al-Jawzi, scan volume 3, p. 182, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "المنتظم ابن الجوزی، اسکین جلد 3، ص 182 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam d'Ibn al-Jawzi, volume numérisé 3, p. 182, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen escaneado 3, p. 182, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"Al-Muntazam fi Tarikh al-Muluk wa al-Umam\" (Kralların ve Milletlerin Tarihindeki Düzenlilik) adlı resimli cilt 3'ün 182. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Al-Muntazam fi Tarikh al-Muluk wa al-Umam\" (Kitab Sejarah Raja dan Bangsa-Bangsa yang Teratur), Jilid Bergambar 3, hlm. 182, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
