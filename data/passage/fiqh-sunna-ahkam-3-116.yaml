text: "… الزواج المكروه : ويكره في حق من يخل بالزوجة في الوطء والإنفاق. حيث لا يقع ضرر بالمرأة ؛ بأن كانت غنية وليس لها رغبة قوية في الوطء. فإن انقطع بذلك عن شيء من الطاعات أو الإشتغال بالعلم اشتدت الكراهة. الزواج …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 116، يرد فيه ذكر الطاعات، والمكروه، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 116, whose wording mentions the acts of obedience, the disliked (makruh), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 116 کا اقتباس جس میں طاعات، مکروہ، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 3, p. 116, dont le texte mentionne les actes d'obéissance, le réprouvé (makruh), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 3, p. 116, cuyo texto menciona los actos de obediencia, lo reprobado (makruh), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 3. cildinin 116. sayfasından, itaat gerektiren fiiller, mekruh edilen fiiller ve kınanacak fiiller konusunu ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu bölüm, farz fiiller, itaat gerektiren fiiller, tavsiye edilen fiiller, kınanacak fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 3, halaman 116, yang membahas tentang amalan ketaatan, amalan yang tidak disukai, dan amalan yang tercela; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tercela, amalan yang dilarang, dan dosa-dosa kecil."
