text: "… اللَّهُ نَزَّلَ أَحْسَنَ للْحَدِيثِ كِتَبًا مُتَشَبِهَا مَثَانِيَ، فصَحَ أنَّ أحسنَ القَولِ هو القُرآنُ وكَلامُ الرَّسولِ لل. وأمَّا ما دونَ ذلك فكُلَّ يَدَّعي في قولِه أنَّه الأحسَنُ فدَعاويهم كُلِّهم ساقِطَةٌ؛ لأنَّ العَقيدةَ بُرهانُ القُرآنِ والسُّنَّةِ، وفَرضٌ علىٰ كُلِّ أَحَدٍ أن يَطَلُبَ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 470، يرد فيه ذكر ما فُرض على الناس، والفرض، وما وجب على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 470, whose wording mentions what was made obligatory on people, the obligatory (fard), a duty laid on every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 470 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، جو ہر مسلمان پر لازم ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 470, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), un devoir imposé à chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 470, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), un deber impuesto a cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 470. sayfasından, insanların üzerine farz olan, farz ibadetler ve her Müslümandan istenenler hakkında bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelime olarak alıntılanmıştır ve düzeltilmemiştir. Farz ibadetler, görevler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram edilen ibadetler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 470, yang menyebutkan apa yang wajib dilakukan manusia, amalan-amalan wajib, dan apa yang dituntut dari setiap Muslim; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan-amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
