text: "لم عليك والذين معك أصحابه وهم له أطوع، هبيرة في الصلح، وأن يكتب له كتاب أمان على ما اختاره ابن ولكن أكتب إليه يبعث من يقتله ففعل. وبعث أبو مسلم مرار بن هبيرة وشاور فيه العلماء أربعين يوما حتى رضيه"
