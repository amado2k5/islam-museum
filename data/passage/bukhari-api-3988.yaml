text: "حَدَّثَنِي يَعْقُوبُ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ عَبْدُ الرَّحْمَنِ بْنُ عَوْفٍ إِنِّي لَفِي الصَّفِّ يَوْمَ بَدْرٍ إِذِ الْتَفَتُّ، فَإِذَا عَنْ يَمِينِي وَعَنْ يَسَارِي فَتَيَانِ حَدِيثَا السِّنِّ، فَكَأَنِّي لَمْ آمَنْ بِمَكَانِهِمَا، إِذْ قَالَ لِي أَحَدُهُمَا سِرًّا مِنْ صَاحِبِهِ يَا عَمِّ أَرِنِي أَبَا جَهْلٍ. فَقُلْتُ يَا ابْنَ أَخِي، وَمَا تَصْنَعُ بِهِ قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3988، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3988 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3988، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3988 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
