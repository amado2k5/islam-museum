summary:
  ar: "قول لمالك يختم به الباب: السنة عندنا، والذي أدرك عليه أهل العلم ببلدنا، أنه لا يُضيق على المسلمين في زكاتهم وأن يُقبل منهم ما دفعوا من أموالهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعلقه البيهقي عن مالك. {cite:muwatta-maruf-1997 p.359}"
