label: { ar: "الموطأ 717 — مالك: السنة أن لا يضيق على المسلمين في زكاتهم وأن يقبل منهم ما دفعوا", en: "Muwatta 717", es: "Muwatta 717", fr: "Muwatta 717", ur: "موطا 717", tr: "El-Muvatta 717 — Malik: Sünnet, Müslümanların zekâtları konusunda işlerini zorlaştırmamak ve verdiklerini kabul etmektir.", id: "Al-Muwatta 717 — Malik: Sunnahnya adalah tidak mempersulit kaum Muslimin dalam hal zakat mereka dan menerima apa yang telah mereka bayarkan." }
summary:
  ar: "قول لمالك يختم به الباب: السنة عندنا، والذي أدرك عليه أهل العلم ببلدنا، أنه لا يُضيق على المسلمين في زكاتهم وأن يُقبل منهم ما دفعوا من أموالهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعلقه البيهقي عن مالك. {cite:muwatta-maruf-1997 p.359}"
  tr: "Malik, bölümü şu ifadeyle sonlandırıyor: Alimlerimize göre sünnet, Müslümanların zekât yüküyle yükümlü tutulmaması ve mallarından verdikleri her şeyin kabul edilmesidir. Editör, bunun Ebu Mus'ab'ın Malik'ten rivayet ettiğini ve el-Beyhaki'nin de Malik'ten naklettiğini belirtiyor. {cite:muwatta-maruf-1997 s.359}"
  id: "Malik mengakhiri bab ini dengan pernyataan berikut: Sunnah, menurut ulama kita, adalah bahwa umat Islam tidak boleh dibebani zakat, dan bahwa apa pun yang mereka bayarkan dari harta mereka harus diterima. Editor mencatat bahwa Abu Mus'ab meriwayatkannya dari Malik, dan al-Bayhaqi memasukkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.359}"
