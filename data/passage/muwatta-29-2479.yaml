label: { ar: "الموطأ 2479 — سعيد بن المسيب: قضاء النبي في الجنين المقتول بغرة، واعتراض الغارم", en: "Muwatta 2479", es: "Muwatta 2479", fr: "Muwatta 2479", ur: "موطا 2479", tr: "El-Muvatta 2479 — Sa’id ibn al-Musayyab: Peygamberin öldürülen cenin hakkındaki hükmü: tazminat ödenmesi gerekir ve borçlunun itirazı", id: "Al-Muwatta 2479 — Sa’id ibn al-Musayyab: Hukum Nabi tentang janin yang dibunuh: ganti rugi wajib diberikan, dan keberatan dari pihak yang berutang" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أن رسول الله قضى في الجنين يُقتل في بطن أمه بغرة: عبد أو وليدة. فقال الذي قُضي عليه: كيف أغرم ما لا شرب ولا أكل ولا نطق ولا استهل، ومثل ذلك بطل؟ فقال رسول الله: إنما هذا من إخوان الكهان. {cite:muwatta-maruf-1997 p.424}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet eder ki, Allah Resulü, anne karnındaki ceninin öldürülmesinin cezasının, erkek veya kadın fark etmeksizin bir köle olduğunu hükmetmiştir. Hüküm verilen kişi, \"Ne içen, ne yiyen, ne konuşan, ne de doğduğunda ağlayan bir şey için nasıl ödeme yapabilirim? Böyle bir şey geçersizdir.\" demiştir. Allah Resulü, \"Bu ancak falcıların lafıdır.\" diye cevap vermiştir. {cite:muwatta-maruf-1997 s.424}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, bahwa Rasulullah SAW menetapkan hukuman bagi orang yang membunuh janin dalam kandungan adalah seorang budak, laki-laki atau perempuan. Orang yang dikenai hukum itu berkata, \"Bagaimana saya dapat membayar sesuatu yang tidak minum, tidak makan, tidak berbicara, dan tidak menangis saat lahir, dan hal seperti itu tidak sah?\" Rasulullah SAW menjawab, \"Ini hanyalah omong kosong para peramal.\" {cite:muwatta-maruf-1997 p.424}"
