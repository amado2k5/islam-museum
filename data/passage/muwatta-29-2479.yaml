label: { ar: "الموطأ 2479 — سعيد بن المسيب: قضاء النبي في الجنين المقتول بغرة، واعتراض الغارم", en: "Muwatta 2479" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أن رسول الله قضى في الجنين يُقتل في بطن أمه بغرة: عبد أو وليدة. فقال الذي قُضي عليه: كيف أغرم ما لا شرب ولا أكل ولا نطق ولا استهل، ومثل ذلك بطل؟ فقال رسول الله: إنما هذا من إخوان الكهان. {cite:muwatta-maruf-1997 p.424}"
