text: |-
  ٢٥٨
  لقد اقيت شول بجنبى بوانة • نصيا كأعراف الكوادن أسهما
  وقال وضاح المن أيانخلتى وادى بوانة حبذا • اذا نام حرّاس النخيل جنا كما
  وربمايا بحذف الهاء قال الزفان
  ماذاتذ كرت من الاظعان * طوالعامن نحوذى بوان
  وأمّا الذى بيلاد فارس فهو شعب بوّان بالذتح والتشديد والبوان بكسر الباء وضمها عمود
  من أعمدة الخباء والجمع بون بالضم والبان ضرب من الشجر طيب الزهر واحدتهابانة قال
  امى والقيس• كخر عوية البانة المنقطر• ومنهد هن البان ⁦( هنن)⁩ البهانة المرأة الطيبأ
  النفس والارج وبهان اسم امرأة مثل قطام وقال
  الاقالت بهان ولم تأبق * كبرث ولا يليق يك النعيم.
  هكن قال المؤرج امرأة بهكنة غضة وهى دات شباب بهكن أى غض وربما قالوا
  بجكل وأنشد
  وكفل مثل الكنيب الاهيل * رعبوبة ذات شباب هكل
  ين البين القراق تقول منه بان يبين بينا وبينونة والبين الوصل وهو من الاضداد وقرئ
  اقد تقطع ينكم بالرفع والنصب فالرفع على الفعل أى تقطع وصلكم والنصب على الحذف
  يريدما بينكم والبون الفضل والمزية يقال بانه ييونه ويبينه وبينهمابون بعيدوبين بعب
  والوا وأفصح فأما فى البعد فيقال ان بينهما لبيدا الاغير والبيان النصاحة واللسن وفى الحديث
  انّ من البيان لسهرا وفلان أبين من فلان أى أفصح منه وأوضح كلاما وأبين اسم رجل نسب
  ليم عدن بقال عدن أبين والبدان ما يتدين به الشئ من الدلالة وغيرها وبان الشى سانا تضيم
  فهو بعن وابهع أينا مثل هين وأهيناء وكذلك أيان الذى ذهوممين قال
  لودب ذرفوق ضاحى جادها • لا يان من آثارهنّ حدور
  وأبنته أنا أى أوضحته واستبان الشى ظهر واستبنته أنا عرفته وتبين الشئ وضح وظهروتبينته
  أنا تتعدى هذه الثلاثة ولا تتعدى والقييين الايضاح والتبيين أيضا الوضوح وفى المثل قدبين
  الصبح لذى عينين أى تبين قال النسابغة • الا أوارى لاياماأبينها• أى ما أتينها والتبيان
  صدر وهو شاذلان المصادرانماتجى "على التفعال بفتح التاءمثل التذكار والتكرار
  والتوكاف ولم يجئ بالكسر الاحرفان وهما التبيان والتلقاء وتول ضريه فأبان رأسه
  من جسده وفصله فهو مبين ومبين أيضااسم ماه قال
  ياريها اليوم على مبين • على.بين جرد القصيم
  فجاء بالميم مع النون وهوجائرلا مطبوع على قبحه يقول يارىّ ناقتى على هذا الماه فأخرج
  مخرج الغداء وهو تعجب والمباينة المفارقة وتباين القوم تم اجروا وتباعدوا والباثن الذى
  يأتى الحلوبة من قبل شمالها والمعلى الذى يأتيها من قبل يمينها وتطليقة بائنة وهى فاءلة بمعنى
  مفعولة والبائنة القوس التى بانت عن وترها كثيرا وأمًا التى قربت من وترهاحتى كادت
  تلصق به فهى البانية بتقديم النون وكلاه ماعيب والبائنة البئر البعيدة القعر الواسعة
  والبيون منلدلانَ الاشطان تين عن جرابها كثيرا قال جوبر يصف خيلا
  يشنفن للنظر البعيد كاغما • ارنانها بيواثن الاشطان
  وغراب
