summary:
  ar: "القسم 14 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاعتكاف»، ويضم فيها النصوص من 2780 إلى 2790 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 14 of Sahih Muslim (The Book of I'tikaf) in the division of the open hadith dataset the museum took its reports from: reports 2780 to 2790 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 14، عنوان «کتاب الاعتکاف»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2780 تا 2790۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 14 de Sahih Muslim (El Libro del I'tikaf) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2780 al 2790 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre de l'I'tikaf), dans la partie 2780 à 2790 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 14. bölümü \"İtikaf Kitabı\" başlığını taşımakta olup, 2780 ile 2790 arasındaki hadisleri sırasıyla numaralandırmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 14 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab I'tikaf\" dan berisi hadits 2780 hingga 2790, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
