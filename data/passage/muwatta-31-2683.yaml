label: { ar: "الموطأ 2683 — أبو حازم عن سهل بن سعد: الغلام يأبى أن يؤثر بنصيبه من النبي أحدا", en: "Muwatta 2683" }
summary:
  ar: "يروي مالك عن أبي حازم بن دينار عن سهل بن سعد الأنصاري أن رسول الله أُتي بشراب فشرب منه، وعن يمينه غلام، وعن يساره الأشياخ، فقال للغلام: أتأذن لي أن أعطي هؤلاء؟ فقال الغلام: لا والله يا رسول الله، لا أوثر بنصيبي منك أحدا. قال: فتله رسول الله في يده. {cite:muwatta-maruf-1997 p.515}"
