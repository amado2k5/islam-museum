label: { ar: "الموطأ 2683 — أبو حازم عن سهل بن سعد: الغلام يأبى أن يؤثر بنصيبه من النبي أحدا", en: "Muwatta 2683", es: "Muwatta 2683", fr: "Muwatta 2683", ur: "موطا 2683", tr: "El-Muvatta 2683 — Ebu Hazim, Sahl ibn Saad'dan rivayetle: Çocuk, Peygamberden alacağı paydan başkasını tercih etmeyi reddetti.", id: "Al-Muwatta 2683 — Abu Hazim berdasarkan riwayat Sahl bin Saad: Anak itu menolak untuk mengutamakan siapa pun di atas bagiannya dari Nabi." }
summary:
  ar: "يروي مالك عن أبي حازم بن دينار عن سهل بن سعد الأنصاري أن رسول الله أُتي بشراب فشرب منه، وعن يمينه غلام، وعن يساره الأشياخ، فقال للغلام: أتأذن لي أن أعطي هؤلاء؟ فقال الغلام: لا والله يا رسول الله، لا أوثر بنصيبي منك أحدا. قال: فتله رسول الله في يده. {cite:muwatta-maruf-1997 p.515}"
  tr: "Malik, Ebu Hazim ibn Dinar'dan, o da Sahl ibn Sa'd el-Ensari'den rivayet ettiğine göre, Allah Resulü'ne bir içecek getirildi ve o da bundan içti. Sağında genç bir çocuk, solunda ise yaşlılar vardı. Resulullah çocuğa, \"Bunu bu insanlara vermeme izin verir misin?\" diye sordu. Çocuk, \"Hayır, Allah'a yemin ederim ki, ey Allah Resulü, senden alacağım paydan başkasına öncelik vermeyeceğim\" diye cevap verdi. Bunun üzerine Allah Resulü içeceği ona verdi. {cite:muwatta-maruf-1997 s.515}"
  id: "Malik meriwayatkan dari Abu Hazim ibn Dinar, dari Sahl ibn Sa'd al-Ansari, bahwa Rasulullah SAW disuguhi minuman dan meminumnya. Di sebelah kanannya ada seorang anak laki-laki, dan di sebelah kirinya ada orang-orang tua. Beliau berkata kepada anak laki-laki itu, \"Apakah kamu mengizinkan aku memberikannya kepada orang-orang ini?\" Anak laki-laki itu menjawab, \"Tidak, demi Allah, wahai Rasulullah, aku tidak akan mendahulukan siapa pun daripada bagianku darimu.\" Maka Rasulullah SAW memberikannya kepadanya. {cite:muwatta-maruf-1997 p.515}"
