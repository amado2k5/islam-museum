label:
  ar: "البخاري 6576 — فأقول يا رب أصحابي فيقال إنك لا تدري ما أحدثوا بعدك"
  en: "Bukhari 6576 — I will say: O Lord, my companions; and it will be said: you do not know what they did after you"
  ur: "بخاری 6576 — میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا"
  es: "Bujari 6576 — Yo diré: Oh Señor, mis compañeros; y se dirá: No sabéis lo que hicieron después de vosotros."
  fr: "Bukhari 6576 — Je dirai: « Ô Seigneur, mes compagnons ! » Et l’on me répondra: « Tu ne sais pas ce qu’ils ont fait après toi. »"
  tr: "Buhari 6576 — Sonra ben, “Ey Rabbim, arkadaşlarım!” diyeceğim. “Sen onların senden sonra ne yaptıklarını bilmiyorsun” denilecek."
  id: "Al-Bukhari 6576 — Kemudian aku akan berkata, “Ya Tuhan, sahabat-sahabatku!” Dan akan dikatakan, “Engkau tidak mengetahui apa yang mereka lakukan setelahmu.”"
text: "أنا فرطكم على الحوض وليرفعن رجال منكم ثم ليختلجن دوني فأقول يا رب أصحابي فيقال إنك لا تدري ما أحدثوا بعدك …"
summary:
  ar: "حديث قدسي في البخاري، رقم 6576: فأقول يا رب أصحابي فيقال إنك لا تدري ما أحدثوا بعدك. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Bukhari, no. 6576: I will say: O Lord, my companions; and it will be said: you do not know what they did after you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "بخاری میں حدیثِ قدسی، نمبر 6576: میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Bukhari, n.° 6576: Diré: «¡Oh Señor, mis compañeros!»; y se dirá: «No sabes lo que hicieron después de ti». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Bukhari, n° 6576: Je dirai: « Ô Seigneur, mes compagnons ! » Et il sera répondu: « Tu ne sais pas ce qu’ils ont fait après toi. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 6576: “Aku akan berkata, ‘Ya Tuhan, sahabat-sahabatku!’ dan akan dikatakan, ‘Engkau tidak mengetahui apa yang mereka lakukan setelahmu.’” Nabi (shalawat dan salam kepadanya) meriwayatkan hadits ini dari Tuhannya, dan mereka yang mempelajari hadits qudsi akan menemukan riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta."
