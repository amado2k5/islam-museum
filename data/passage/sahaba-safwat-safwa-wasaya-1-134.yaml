text: "… كانت كاذبة فأذهب بصرها، واقتلها في أرضها. فذهب بصرها، ووقعت في حفرة في أرضها فماتت. ذكر وفاته رصّيَعَنه عن نافع أن سعيد بن زيد مات بالعقيق، فحمل إلى المدينة فدفن بها. وقال ابن سعد: وقال عبد الملك بن زيد: مات …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 134، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
