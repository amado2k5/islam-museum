text: |-
  ٢٧٤
  * ⁦(فصل اح1.)⁩.
  والحرمة يفتح انراء وضهها وقد تحتزم بصمبته وحرمة الرجل حرمه وأهمله ورجل حوام
  أى محرم والجع حرم-شل قذال وقذل ومن الشهور أربعة حرم أيضاوهى ذوالقعدة وذو
  الحجة والحرم ورجب ثلاثة سرد وواحد فردوكانت العرب لاتستعل فيها الققال الاحيان
  خنعم وطيء فاته-ما كانايستصلان الشه وروكان الذين ينسوْن الشهورأيام الموسمية ولون
  حرمنا عليكم القتال فى هذه الشهور الادماه المحلين فكانت العرب تستصل دماءهم خاصة
  فى هذه الشهور والحرام ضت الحلال وكذلك الحرم بالكسر وقرئ ووم على قرية أهلكناها
  وقار الكسائى معناه واجب والحرمة بالكسرالغلمة وفى الحديث الذير تدركهم الساعة
  بعث عليهم الحرمة ويسلبون الحياه والحرمة أيضا الحرمان والحرمى الرجل المفسوب الى
  الحرم والانى حرميسة والحرميسة أيضاسهام تنسب الى الحرم ومكة حرم اللّٰه ءزوجل
  والحرمان-كة والمدينة والحرمقديكون الحرام وتظيره زمن وزمان والحومة بالتحرين
  أيضافى الشاء كالضبعة فى النوق والحناء فى التعاج وهو شهوة البضاع يقال استرمت الشاة
  وكل أننى من ذوات الظلف خاصة اذا اشتهت الفهل وهى شاة حرمى وشياه حرام وحرامى مثال
  عجال وعجالى كانه لوقيل لمذكره اقيل ومان وقال الاموى استحرمت الذبسة والسكابة اذا
  أرادت الفمعل وقواهم حرام اللّٰه لا أفعل كقولهم عين اللّٰه لا أفعل والمحرم الحرام ويقال هو ذو
  محرم منهااذا لم يحلّ له نكاحها ومحارم الليل مخاوفه التى يحرم على الجبان أن يساتها
  وأتشد تعلب
  محادم الليل امن بهرج • حتى نام الورع المزج
  الاصمعى يقال انّ لى مع -رمات فلاتهتكها واحدتها محرمة ومحرمة والمحزم أوّل الشهور
  ويقسال أيضاجلد محرم أى لم تتم دباغته وسوط محزم لم يلين بعد وقال الاعشى
  نحاذر كفى والقطيع الهزماه وناقة محزمة أى لم تتم رياضتها بعده ن أبى ذيد والتهريم ضد
  التحليل وحريم البتروغيرها ماحولها من مرافقها وحة وقها والحريم ثوب المحرم وكانت
  العرب تطوف، راقوثيا بهم مطروحة بين أيديهم فى الطواف وقال
  كف حزنامرى عليه كأنه • اقى بين أيدى الطائفين حيم
  وحريم الذى فى شعرامرى القيس اسم رجل والحريمة مافات من كل مطموع فيه وحوم الشئ
  بالضم رمة يقال حرمت الصلاة على الحائض حرما وحرمه الذي يحرمه حرمامغال سرقه
  سرقا بكسر الراء وحرمة وحريمة وحرمانا وأحرمه أيضا اذ امنعه اياه وقال يصف امرأة
  ونبئتها أرمت قومها • لتنكح فى معشرآً خريبا
  والحرم بكسر الراء أيضا الحرمان قال زهير
  وان أناه خليل يوم مسئلة • يقول لاعائب مالى ولاحرم.
  واغمارفع يقول وهو جواب الجزاء على معنى التقديم عضد سيبويه كانه قال يقول ان أتاه
  لمسل وعند الكوفين على اضمار الفاء أبوز يدحرم الرجل بالكسر يحوم حرما أى قر
  وآحرمته أنا اداقره والكائى مثله ويقال أيضاحرمت الصلاة على المرألغة فى ومث
  وأحرم الرجل اذادخل فى حرمة لا تهتك قال زهير * وكم بالقنان من محلّ ومحرم
  أى عن يحل قتاله وعن لا يحل ذلك منه وأحرم أى دخسل فى الشهر الحرام قال الراعى
  تنلوا
