label:
  ar: "مسلم 2766c — قاتل المائة والقرية الصالحة"
  en: "Muslim 2766c — The man who killed a hundred and the righteous town"
  ur: "مسلم 2766c — سو آدمیوں کا قاتل اور نیک بستی"
  es: "Musulmán 2766c — El hombre que mató a cien y a la ciudad justa"
  fr: "Muslim 2766c — L'homme qui a tué cent personnes et la ville juste"
  tr: "Müslim 2766c — Yüz kişinin ve salih köyün katili"
  id: "Muslim 2766c — Pembunuh seratus orang dan desa yang saleh"
text: "فأوحى الله إلى هذه أن تباعدي وإلى هذه أن تقربي ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2766c: قاتل المائة والقرية الصالحة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2766c: The man who killed a hundred and the righteous town. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2766c: سو آدمیوں کا قاتل اور نیک بستی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2766c: El hombre que mató a cien y la ciudad justa. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim, n° 2766c: L’homme qui tua cent hommes et la ville vertueuse. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Muslim'de 2766c numaralı hadis-i kudsi şöyledir: \"Yüz kişiyi öldüren ve salih bir köyü yıkan kimse...\" Peygamberimiz bunu Rabbinden rivayet etmiş olup, hadis-i kudsi ise bu rivayetleri altı şeriat hadis külliyatında ve Muvatta'da derlemiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2766c: “Orang yang membunuh seratus orang dan menghancurkan sebuah desa yang saleh.” Nabi meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
