  ur: "مسلم 2766c — سو آدمیوں کا قاتل اور نیک بستی"
text: "فأوحى الله إلى هذه أن تباعدي وإلى هذه أن تقربي ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2766c: قاتل المائة والقرية الصالحة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2766c: The man who killed a hundred and the righteous town. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2766c: سو آدمیوں کا قاتل اور نیک بستی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
