text: |-
  *⁦(فصل الالف)⁩*:
  ٦٧
  وامرأة مهفهفة أى ضامرة البطن ومهففة أيضاعن يعقوب واليهقوف الجيان ويقال
  الحديد القلب ( اف الهلوف الاقيل الجاف العظيم اللحية قالت امرأة من العرب
  هى زقص انالها
  أشبه أبا أمّك أو أشبه عمل • ولا تكوننّ كهلوف وكل
  يصبح فم وضعه قدانجدل • وارق الى الخيرات زنأ فى الجبل
  وعمل اسم رحل وهو خاله تقول لا تجاوزنافى الشبه ( نف الاهناف ضحك فيه
  فتور كفحك المتهزئ وكذلك المهائفة والتهانف قال الكميت
  مهفهفة اليكشحين بيضاء كاعب * تهائف الحهال منا وتلعب
  وف الهرف الريح الحارّ ققالت أم تأيط شرا وابناءليس بعلفوف تلقه هوف
  حشى من صرف ف الهيت مثل الهوف وهى ريح حادّة تأتى من قبل الين وهى
  النكاء التى تجرى بين الجنوب والدبور من تحت مجرى سهيل وقال الشاءر ١
  وصوِّح البقل ناجِ تجبه * هيف يمانية فى مرهانكب
  وقد المثل ذهبت هيرف لاديانها أى لعاداتها لانها تجذف كل شئء وتبدسه وتهيف الرجل من
  الهيف كما يقال تشتى من الشتاء والهافة من النوق التى تعطش سريعا وهو من الياء
  وكذلك المهياف واهتاف أى عطش قال الاصمعى رجل هيفان أى عطشان والمهياف
  السريع العطسْ وأهاف القوم أى عطشت ابلهم قال الراجز
  وقد أها فوازعموا وأبزفوا • والهيف بالتهريك صمر البطن والخاصرة ورج-ل أهيف
  وامرأة هيفء وقوم هيف وفرس هيفاء ضامرة وهاف العبد أى أبق
  DLUNNEE
  سل الالف بق أبق العبديأيق ويأبق اباظ أى هرب وتأيق استنر ويقال
  حتيس ومنه قول الاعشى * ولمكن أتاه الموت لا يتأبق * وقال آخر
  ألا قالت بهان ولم تأبق • كبرت ولا يليق بك النعيم
  والايق بالتحريك القنب ومنه قول زهير
  القائد الخيل منكوباد وابرها * قد أحكمت حكمات القدّوالابقا
  ⁦(أرق)⁩ الارق السهر وقد أرقت بالكسر أى سهرت وكذلك اتترقت على افتعات فانا
  أرق وأرّقنى كذا تأريقا أى أسهرنى والأرقان لغسة فى البرقان وهوآفة تصيب الزرع ودا.
  يصيب الناس يقال زرع،لأروق وميروق وقولهم جاءنا بأمّ الربيق على أريق يعنى به الداهية
  قال أبو عدوأصله من الحيات وقال الاصبعى تزعم العرب أنه من قول رجل رأى الغول
  على حِل أورق وأراق بالضم موضع قال ابن أحر
  كأت على الججال أوان حفت * هجائن من نعاج أراق عينا
  زق الازق الازل وهو الضيق والمأزق المضيق ومنه سمي موضع الحرب مأرُقًا وحكى
  ١ تسخة قال ذوالرمة اه
  قوله على جل أورق أى فأريق
  تصغير أورق كويدفى أسود
  والاصل وريق فقلب الواوهمزة
  كمافى القاموس اه مصعه
