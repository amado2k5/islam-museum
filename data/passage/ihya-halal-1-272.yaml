  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 1, halaman 272, yang membahas tentang apa yang diperbolehkan (halal), haram (haram), dan yang diragukan (mushabbih); diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
