text: "… الحلال مخافة أن نقع فى باب من الحرام، أفتطمع من نفسك فى مثل هذا الاحتياط ؟ لاورب الكعبة ما أحسبك كذلك ! ويحك اكن على يُقين أن جمع المال لاعمال البر مكر من الشيطان ليوقعك بسبب البر فى اكتساب الشبهات …"
