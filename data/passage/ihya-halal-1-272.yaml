  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 1, p. 272, that mentions the lawful, the unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 1، ص 272 کا اقتباس جس میں حلال، حرام، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
