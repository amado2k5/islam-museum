text: "عَلِيٌّ مَا عَهِدَ إِلَىَّ رَسُولُ اللَّهِ صلى الله عليه وسلم بِشَىْءٍ دُونَ النَّاسِ إِلاَّ فِي صَحِيفَةٍ فِي قِرَابِ سَيْفِي ‏.‏ فَلَمْ يَزَالُوا بِهِ حَتَّى أَخْرَجَ الصَّحِيفَةَ فَإِذَا فِيهَا ‏ \"‏ الْمُؤْمِنُونَ تَكَافَأُ دِمَاؤُهُمْ يَسْعَى بِذِمَّتِهِمْ أَدْنَاهُمْ وَهُمْ يَدٌ عَلَى مَنْ سِوَاهُمْ لاَ يُقْتَلُ مُؤْمِنٌ بِكَافِرٍ وَلاَ ذُو عَهْدٍ فِي عَهْدِهِ ‏\"‏ ‏.‏"
summary:
  ar: "في السنن النسائي؛ ذكر كتابة كتاب أو إرساله."
