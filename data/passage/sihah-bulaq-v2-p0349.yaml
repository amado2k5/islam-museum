text: |-
  ١ فى نسحخة زيادة زهير وأول
  تحمل منها أهلها وخات لها
  البوشوالنقيرقانه اؤاف اه
  ٢٣٨
  •⁦(فصل الميم)⁩.
  فيهاليلاة فحذفت لان تصغيرهالييلية وليل أليل شنديد الفللمة قال الفرزدق
  واللبسل مختلط الغياطل أليل • وليلة ليلاء وليل لاقل مثل ة ولك شعرشاءرفى التأكيد
  السكسائى عامله ملايلة كماتقول مياومة من اليوم وليلى اسم امرأة والجمع ايال
  قال الراجز
  لم أرفى مواحب النعال • اللايسات البدن الحوالى • شبهالليلى خيرة الليالى
  وذكرة وم أنّ الليل ولد السكروان والنهار ولد الحبارى وقدجاء ذلك فى بعض الاشعار وذكر
  الاصمعى" فى كتاب الفرق النهار ولم يذ كر الليل .
  صل الميسم ذل مثل كلة تسوية يقال هذا مثله ومثله كمايقال شيهه وشبهه
  بمعنى والعرب تقول هومثيل هذا وهم أميشالهم يريدون أنّ المسبه به حقيركما أنّ هذا حقير
  والمنسل ما يضرب به من الامثال ومثل الشئ أيضاصفته والمثال الفراش والمع مثل
  وان شقت خنفت والمثالمعروف والهع أمثلذ ومثل ومئات ف كذا تشلااذاصوّرت له
  فاله مالكتاية وغبرها والتمثال الصورة والجمع التمائيل ومشل بيزيديه منولا أى انتصب
  فائما ومنه قبل لمنارة المسرجة ماثلة ومشل أى اطأ بالأرض وهو من الاضداد وقال ١
  رسوم فنها مستيين وماثل • والمستبين الاطلال والمائل الرسوم وحثل بد يمثل مثلا أى نكل به
  والاسم المثلة بالضم ومثل بالقتيل جدعه والمثلة بفتح الميم وضم الثاء العقوبة والجمع المثلان
  وأمشله جعله مثلديقال أمثل السسلطان فلانا اذاقتله قوداويقال للهاكم أمثلنى وأقصى
  وأقدنى وفلان أمثل بنى فلان أى أدناهم للخير وهؤلا أمائل القوم أى خياره-م وقد مشل
  الرجل بالضم مثالة أى صار فاضلا والمثلى تأنيات الامثل كالقصوى تأنيث الاقصى وعمائل
  من علته أى أقبل وقئل بهذا البيت وهذا البيت بمعنى وامتئل أمره أى احتذاه قال ذوالرقة
  بصف المهار والاتن
  رباع لها مذ أورق العود عنده • خاشات ذحل ما يراد امتثالها
  ( مجل مجات يده تمجل مجلا أى تنفطت من العمل ويقال أيضامجات يده بالكسر
  مجلا وأمجل العمل يده ويات الابل كأماالإل أى عمتلئة كامتلاء المجل محل الهمل
  |الجدب وهو افقطاع المطرويبس الارض من الكلا يقال بمدماحل وزمان مآحل وأرض محل
  وأرض محول كما فانوا بلدسيسب وبلدسباسب وأرس جدبة وأرض ج-دوب بريدون
  بالواحد ابمع وقد أمحلت قال ابن السكيت أعمل البلد فهو ماحل ولم يقواواممح-ل وب اجاء
  ذلك فى الشعر قال حسان بن ثابت
  اماترى رأمى تغيرلونه • شمطافاً صبح كالتغام الممعل
  وأمحل القوم أجدبوا والمحل المكروالسكيد يقال محل به اذاسعى به الى السلطان فه وماحل
  ومحول وفى الدعاء ولا تجعله ماحلامصدقا والمماحلة المماكرة والمكايدة وتمل أى احتال
  فهو متمعل ورجل متماحل اذا كان طويلا وسيدسب متماحل أى بعيدمابين الطرفين
  أوفى الحديث أمور متماحلة أى فتن يطول أمرها وقول أبى ذؤيب
  وأشعت بوشى شفينا أحاحه • :غداتنذذى جردة متما-ل
