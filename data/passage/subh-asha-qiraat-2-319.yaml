text: "من صبح الأعشىٰ إنهم وضعُوا الخط العربى على ما سيأتى ذكره فى الكلام على الحط فيما بعد إن شاء اللّٰه. ومنها هِناء، وهم بنو هِناء، بن عمرو، بن الغَوْث، بن طيئ. ومنهم إياس بن قَبِيصة الذى ملك بعد النَّعمان بن …"
