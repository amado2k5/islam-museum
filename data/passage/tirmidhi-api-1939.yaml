label: { ar: "جامع الترمذي 1939 — ما لا يحل", en: "Jami' al-Tirmidhi 1939 — what is not lawful", ur: "جامع ترمذی 1939 — جو حلال نہیں", es: "Jami' al-Tirmidhi 1939 — lo que no es lícito", fr: "Jami' al-Tirmidhi 1939 — ce qui n'est pas licite", tr: "Cami' el-Tirmizi 1939 — İzin verilmeyen şeyler", id: "Jami' al-Tirmidhi 1939 — Apa yang tidak diperbolehkan" }
text: "… اللَّهِ بْنِ عُثْمَانَ بْنِ خُثَيْمٍ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَسْمَاءَ بِنْتِ يَزِيدَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" لاَ يَحِلُّ الْكَذِبُ إِلاَّ فِي ثَلاَثٍ يُحَدِّثُ الرَّجُلُ امْرَأَتَهُ لِيُرْضِيَهَا وَالْكَذِبُ فِي الْحَرْبِ وَالْكَذِبُ لِيُصْلِحَ بَيْنَ النَّاسِ \". وَقَالَ مَحْمُودٌ فِي حَدِيثِهِ \" لاَ يَصْلُحُ الْكَذِبُ إِلاَّ فِي ثَلاَثٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ لاَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1939، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1939 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1939، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1939 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los parientes), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1939 (chapitres sur la piété et les bonnes relations familiales), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Cami' el-Tirmizi'nin 1939 numaralı hadisinde haram olan şeylerden bahsedilir. Helal ve Haram tarayıcısı, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1939, menyebutkan apa yang dilarang. Peramban Halal dan Haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
