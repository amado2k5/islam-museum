text: "… الطَّوع، هو أشعب بن جُبير، ويُعرف بابن أم حُميدة المدني الذي يُضرب به المثل. روى عن عكرمة وأبان بن عثمان وسالم بن عبد الله. وعنه معدي بن سليمان وأبو عاصم النبيل وغيرهما. وله نوادر وتطفيل ولكنه كُذِب عليه وأُلصق به …"
