text: "… الطَّوع، هو أشعب بن جُبير، ويُعرف بابن أم حُميدة المدني الذي يُضرب به المثل. روى عن عكرمة وأبان بن عثمان وسالم بن عبد الله. وعنه معدي بن سليمان وأبو عاصم النبيل وغيرهما. وله نوادر وتطفيل ولكنه كُذِب عليه وأُلصق به …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 12، ص 373، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, scan volume 12, p. 373, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الاسلام والفاعیۃ المشاہیر والعالم، اسکین جلد 12، ص 373 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volume numérisé 12, p. 373, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volumen escaneado 12, p. 373, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"İslam Tarihi ve Ünlü Kişilerin Ölümleri\" adlı resimli cilt 12'nin 373. sayfasından, zeki ve aptal bireyler hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 12, halaman 373, berisi cerita tentang individu yang cerdas dan bodoh; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
