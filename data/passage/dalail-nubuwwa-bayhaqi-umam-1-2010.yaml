text: "… بين رسول اللّٰه ل وبين كفار قريش، قال أبو سفيان : فوجدنا رسول قيصر ببعض الشام فانطلق بي وبأصحابي حتى قدمنا إيلياء، فأدخلنا عليه فإذا هو جالس في مجلس ملكه وعليه التاج، وإذا حوله عظماء الروم، فقال لترجمانه: سلهم أيهم …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2010، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 2010, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2010 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
