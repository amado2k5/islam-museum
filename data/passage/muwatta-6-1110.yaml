text: "إذا نتجت الناقة فليحمل ولدها حتى ينحر معها"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: إذا نتجت الناقة فليحمل ولدها حتى ينحر معها، فإن لم يوجد له محمل حمل على أمه حتى ينحر معها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1204) وسويد (528) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.509}"
