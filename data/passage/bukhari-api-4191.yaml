text: "حَدَّثَنِي مُحَمَّدُ بْنُ هِشَامٍ أَبُو عَبْدِ اللَّهِ، حَدَّثَنَا هُشَيْمٌ، عَنْ أَبِي بِشْرٍ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ كَعْبِ بْنِ عُجْرَةَ، قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ بِالْحُدَيْبِيَةِ وَنَحْنُ مُحْرِمُونَ، وَقَدْ حَصَرَنَا الْمُشْرِكُونَ ـ قَالَ ـ وَكَانَتْ لِي وَفْرَةٌ فَجَعَلَتِ الْهَوَامُّ تَسَّاقَطُ عَلَى وَجْهِي، فَمَرَّ بِي النَّبِيُّ فَقَالَ \" أَيُؤْذِيكَ هَوَامُّ رَأْسِكَ \". …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4191، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4191 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4191، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
