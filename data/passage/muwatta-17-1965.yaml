label: { ar: "الموطأ 1965 — مالك عن زيد بن أسلم: كان الربا في الجاهلية أن يكون للرجل على الرجل الحق إلى أجل، فإذا حل قال: أتقضي أم تربي؟ فإن قضى أخذ، وإلا زاده في حقه وأخر عنه في الأجل", en: "Muwatta 1965", es: "Muwatta 1965", fr: "Muwatta 1965", ur: "موطا 1965", tr: "El-Muvatta 1965 — Malik, Zeyd ibn Aslam'dan rivayetle: İslam öncesi dönemde faiz, bir adamın başka bir adamdan belirli bir süre için alacağı bir borcu olması durumuydu. Vade tarihi geldiğinde, adam sorardı: Ödeyecek misin yoksa borcu artıracak mısın? Eğer öderse parayı alırdı; aksi takdirde borcu artırır ve ödeme süresini uzatırdı.", id: "Al-Muwatta 1965 — Malik, berdasarkan riwayat Zayd ibn Aslam: Riba di era pra-Islam terjadi ketika seseorang memiliki hutang kepada orang lain untuk jangka waktu tertentu. Ketika tanggal jatuh tempo tiba, ia akan bertanya: Apakah kamu akan membayar atau akan menambah hutang? Jika ia membayar, ia akan mengambil uang tersebut; jika tidak, ia akan menambah hutang dan memperpanjang jangka waktu pembayaran." }
summary:
  ar: "يروي مالك عن زيد بن أسلم أنه قال: كان الربا في الجاهلية أن يكون للرجل على الرجل الحق إلى أجل، فإذا حل الأجل قال: أتقضي أم تربي؟ فإن قضى أخذ، وإلا زاده في حقه، وأخر عنه في الأجل. {cite:muwatta-maruf-1997 p.204}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle şöyle der: İslam öncesi dönemde faiz, bir adamın başka bir adamdan belirli bir süre için alacağı bir borcu olması durumuydu. Vade tarihi geldiğinde, adam sorardı: Ödeyecek misin yoksa borcu artıracak mısın? Eğer öderse parayı alırdı; aksi takdirde borcu artırır ve ödeme süresini uzatırdı. {cite:muwatta-maruf-1997 s.204}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa beliau berkata: Riba di zaman pra-Islam adalah ketika seseorang memiliki hutang kepada orang lain untuk jangka waktu tertentu. Ketika tanggal jatuh tempo tiba, ia akan bertanya: Apakah kamu akan membayar atau akan menambah hutang? Jika ia membayar, ia akan mengambil uangnya; jika tidak, ia akan menambah hutang dan memperpanjang jangka waktu pembayaran. {cite:muwatta-maruf-1997 p.204}"
