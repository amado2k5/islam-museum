label: { ar: "صحيح البخاري 4229 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4229 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4229 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4229 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 4229 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، أَنَّ جُبَيْرَ بْنَ مُطْعِمٍ، أَخْبَرَهُ قَالَ مَشَيْتُ أَنَا وَعُثْمَانُ بْنُ عَفَّانَ، إِلَى النَّبِيِّ فَقُلْنَا أَعْطَيْتَ بَنِي الْمُطَّلِبِ مِنْ خُمْسِ خَيْبَرَ، وَتَرَكْتَنَا، وَنَحْنُ بِمَنْزِلَةٍ وَاحِدَةٍ مِنْكَ. فَقَالَ \" إِنَّمَا بَنُو هَاشِمٍ وَبَنُو الْمُطَّلِبِ شَىْءٌ وَاحِدٌ \". قَالَ جُبَيْرٌ وَلَمْ يَقْسِمِ النَّبِيُّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4229، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4229 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4229، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4229 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 4229 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
