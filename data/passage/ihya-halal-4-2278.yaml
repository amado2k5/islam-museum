text: "… حال ومن قائل يحل برضاها ولا يحل دون رضاها وكأن هذا القائل يحرم الإيذاء دون العزل ومن قائل يباح في المملوكة دون الحرة والصحيح عندنا أن ذلك مبا ا تطلق ح وأما الكراهية فإ لنهي التحريم ولنهي التتريه ولترك الفضيلة …"
