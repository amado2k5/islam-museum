label: { ar: "الموطأ 733 — مالك: السنة في الحبوب المدخرة: العشر فيما سقت السماء ونصف العشر فيما سقي بالنضح إذا بلغ خمسة أوسق بصاع النبي", en: "Muwatta 733", es: "Muwatta 733", fr: "Muwatta 733", ur: "موطا 733", tr: "El-Muvatta 733 — Malik: Depolanmış tahıllar hakkındaki sünnet: Yağmurla sulananın onda biri ve sulama ile sulananın onda birinin yarısı, Peygamberimizin sa's'ına göre beş vasq'a ulaştığında.", id: "Al-Muwatta 733 — Malik: Sunnah mengenai penyimpanan biji-bijian: sepersepuluh dari yang disirami air hujan dan setengah dari sepersepuluh dari yang disirami air irigasi, jika mencapai lima wasq, diukur dengan sa' Nabi." }
summary:
  ar: "قول لمالك: السنة عندنا في الحبوب التي يدخرها الناس ويأكلونها أنه يؤخذ مما سقت السماء من ذلك والعيون وما كان بعلاً العشر، وما سُقي بالنضح نصف العشر، إذا بلغ ذلك خمسة أوسق بالصاع الأول صاع النبي، وما زاد على خمسة أوسق ففيه الزكاة بحساب ذلك. ويذكر المحقق فروق النسخ في العبارة، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.366} {cite:muwatta-maruf-1997 p.367}"
  tr: "Malik şöyle dedi: İnsanların depoladığı ve tükettiği tahıllarla ilgili yerleşik uygulamamız şudur: Yağmurla, pınarlarla ve diğer yağmurla sulanan ürünlerden onda biri, yapay sulama yöntemleriyle sulananlardan ise, Peygamberimizin ilk sa'sı (kuru ölçü birimi) kullanılarak beş vask (kuru ölçü birimi) miktarına ulaştığında, yarım onda biri alınır. Beş vask miktarını aşan her şey için zekât buna göre hesaplanır. Editör, farklı rivayetlerdeki kelime farklılıklarına dikkat çekiyor ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.366} {cite:muwatta-maruf-1997 s.367}"
  id: "Malik berkata: Kebiasaan kita yang telah mapan mengenai biji-bijian yang disimpan dan dimakan orang adalah bahwa sepersepuluh diambil dari apa yang diairi oleh hujan, mata air, dan tanaman tadah hujan lainnya, dan setengah persepuluh dari apa yang diairi dengan cara buatan, jika mencapai lima wasq (satuan ukuran kering) menggunakan sa' pertama (satuan ukuran kering) Nabi. Untuk apa pun yang melebihi lima wasq, zakat dihitung sesuai dengan itu. Editor mencatat variasi dalam redaksi di berbagai versi dan menyatakan bahwa Abu Mus'ab meriwayatkan ini dari Malik. {cite:muwatta-maruf-1997 p.366} {cite:muwatta-maruf-1997 p.367}"
