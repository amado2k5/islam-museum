label: { ar: "الموطأ 733 — مالك: السنة في الحبوب المدخرة: العشر فيما سقت السماء ونصف العشر فيما سقي بالنضح إذا بلغ خمسة أوسق بصاع النبي", en: "Muwatta 733" }
summary:
  ar: "قول لمالك: السنة عندنا في الحبوب التي يدخرها الناس ويأكلونها أنه يؤخذ مما سقت السماء من ذلك والعيون وما كان بعلاً العشر، وما سُقي بالنضح نصف العشر، إذا بلغ ذلك خمسة أوسق بالصاع الأول صاع النبي، وما زاد على خمسة أوسق ففيه الزكاة بحساب ذلك. ويذكر المحقق فروق النسخ في العبارة، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.366} {cite:muwatta-maruf-1997 p.367}"
