text: "حَدَّثَنِي مَالِكٌ، أَنَّهُ بَلَغَهُ أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، سُئِلَ عَنِ الرَّقَبَةِ الْوَاجِبَةِ، هَلْ تُشْتَرَى بِشَرْطٍ فَقَالَ لاَ. قَالَ مَالِكٌ وَذَلِكَ أَحْسَنُ مَا سَمِعْتُ فِي الرِّقَابِ الْوَاجِبَةِ أَنَّهُ لاَ يَشْتَرِيهَا الَّذِي يُعْتِقُهَا فِيمَا وَجَبَ عَلَيْهِ بِشَرْطٍ عَلَى أَنْ يُعْتِقَهَا لأَنَّهُ إِذَا فَعَلَ ذَلِكَ فَلَيْسَتْ بِرَقَبَةٍ تَامَّةٍ لأَنَّهُ يَضَعُ مِنْ ثَمَنِهَا لِلَّذِي يَشْتَرِطُ مِنْ عِتْقِهَا. قَالَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1474، يرد فيه ذكر الواجب، وما يجب على المكلف. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1474 (Setting Free and Wala'), whose wording mentions the obligatory (wajib), what is binding on the person addressed. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1474، جس کے الفاظ میں واجب، جو مکلف پر واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1474, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1474, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
