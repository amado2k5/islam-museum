label: { ar: "جامع الترمذي 1246 — الوجوب", en: "Jami' al-Tirmidhi 1246 — obligation (wujub)", ur: "جامع ترمذی 1246 — وجوب", fr: "Jami' al-Tirmidhi 1246 — l'obligation (wujub)", es: "Yami' al-Tirmidhi 1246 — la obligatoriedad (wujub)", tr: "Cami' el-Tirmizi 1246 — Yükümlülük", id: "Jami' al-Tirmidhi 1246 — Kewajiban" }
text: "… صَحِيحٌ. وَقَوَّى هَذَا الْمَذْهَبَ. وَمَعْنَى قَوْلِ النَّبِيِّ \" إِلاَّ بَيْعَ الْخِيَارِ \". مَعْنَاهُ أَنْ يُخَيِّرَ الْبَائِعُ الْمُشْتَرِيَ بَعْدَ إِيجَابِ الْبَيْعِ فَإِذَا خَيَّرَهُ فَاخْتَارَ الْبَيْعَ فَلَيْسَ لَهُ خِيَارٌ بَعْدَ ذَلِكَ فِي فَسْخِ الْبَيْعِ وَإِنْ لَمْ يَتَفَرَّقَا. هَكَذَا فَسَّرَهُ الشَّافِعِيُّ وَغَيْرُهُ. وَمِمَّا يُقَوِّي قَوْلَ مَنْ يَقُولُ الْفُرْقَةُ بِالأَبْدَانِ لاَ بِالْكَلاَمِ حَدِيثُ عَبْدِ اللَّهِ بْنِ عَمْرٍو عَنِ النَّبِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1246، يرد فيه ذكر الوجوب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 1246 (The Book on Business), whose wording mentions obligation (wujub). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 1246، جس کے الفاظ میں وجوب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1246, dont le texte mentionne l'obligation (wujub). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 1246, cuyo texto menciona la obligatoriedad (wujub). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 1246 numaralı hadis, farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahları derleyen bu eser, Kur'an, Sünnet, biyografi ve Sahabe ve ümmetlerden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1246, menyebutkan tentang kewajiban. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
