label: { ar: "الموطأ 2684 — إسحاق بن عبد الله بن أبي طلحة عن أنس: أم سليم تطعم النبي ومعه الناس من خبز الشعير", en: "Muwatta 2684" }
summary:
  ar: "حدثني يحيى عن مالك عن إسحاق بن عبد الله بن أبي طلحة أنه سمع أنس بن مالك يقول: قال أبو طلحة لأم سليم: لقد سمعت صوت رسول الله ضعيفا، أعرف فيه الجوع، فهل عندك من شيء؟ فقالت: نعم، فأخرجت أقراصا من شعير، ولفّت الخبز ببعضه بخمارها، ثم أرسلتني إلى رسول الله. فوجدته في المسجد ومعه الناس، فقال: أرسلك أبو طلحة؟ قلت: نعم. قال: للطعام؟ قلت: نعم. فقال لمن معه: قوموا. فانطلق، وجاء أبو طلحة مع النبي، فقال النبي: هلمي يا أم سليم، ما عندك؟ فأمر به ففُت، وعصرت عليه أم سليم عكة لها فأدمته. ثم قال: ائذن لعشرة، فأكلوا حتى شبعوا، ثم قال: ائذن لعشرة، حتى أكل القوم كلهم وشبعوا، والقوم سبعون أو ثمانون رجلا. {cite:muwatta-maruf-1997 p.515} {cite:muwatta-maruf-1997 p.516} {cite:muwatta-maruf-1997 p.517}"
