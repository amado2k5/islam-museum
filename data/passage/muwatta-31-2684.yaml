label: { ar: "الموطأ 2684 — إسحاق بن عبد الله بن أبي طلحة عن أنس: أم سليم تطعم النبي ومعه الناس من خبز الشعير", en: "Muwatta 2684", es: "Muwatta 2684", fr: "Muwatta 2684", ur: "موطا 2684", tr: "El-Muvatta 2684 — İshak bin Abdullah bin Abi Talha, Enes'ten rivayetle: Ümmü Süleym, Peygamber'e ve yanındakilere arpa ekmeği yedirdi.", id: "Al-Muwatta 2684 — Ishaq bin Abdullah bin Abi Talha berdasarkan riwayat Anas: Umm Sulaym memberi makan Nabi dan orang-orang yang bersamanya roti jelai" }
summary:
  ar: "حدثني يحيى عن مالك عن إسحاق بن عبد الله بن أبي طلحة أنه سمع أنس بن مالك يقول: قال أبو طلحة لأم سليم: لقد سمعت صوت رسول الله ضعيفا، أعرف فيه الجوع، فهل عندك من شيء؟ فقالت: نعم، فأخرجت أقراصا من شعير، ولفّت الخبز ببعضه بخمارها، ثم أرسلتني إلى رسول الله. فوجدته في المسجد ومعه الناس، فقال: أرسلك أبو طلحة؟ قلت: نعم. قال: للطعام؟ قلت: نعم. فقال لمن معه: قوموا. فانطلق، وجاء أبو طلحة مع النبي، فقال النبي: هلمي يا أم سليم، ما عندك؟ فأمر به ففُت، وعصرت عليه أم سليم عكة لها فأدمته. ثم قال: ائذن لعشرة، فأكلوا حتى شبعوا، ثم قال: ائذن لعشرة، حتى أكل القوم كلهم وشبعوا، والقوم سبعون أو ثمانون رجلا. {cite:muwatta-maruf-1997 p.515} {cite:muwatta-maruf-1997 p.516} {cite:muwatta-maruf-1997 p.517}"
  id: "Yahya meriwayatkan kepadaku dari Malik, dari Ishaq ibn Abdullah ibn Abi Talha, bahwa ia mendengar Anas ibn Malik berkata: Abu Talha berkata kepada Umm Sulaym, “Aku mendengar suara Rasulullah shalla Allahu alaihi wa sallam terdengar lemah, dan aku mengenali rasa laparnya. Apakah engkau punya sesuatu?” Ia menjawab, “Ya,” lalu mengeluarkan beberapa kue jelai, membungkus sebagian roti dengan jilbabnya, kemudian mengutusku kepada Rasulullah. Aku mendapati beliau di masjid bersama beberapa orang. Beliau bertanya, “Apakah Abu Talha yang mengutusmu?” Aku menjawab, “Ya.” Beliau bertanya, “Untuk makanan?” Aku menjawab, “Ya.” Kemudian beliau berkata kepada orang-orang yang bersamanya, “Bangunlah.” Maka mereka pergi, dan Abu Talha datang bersama Nabi. Nabi berkata, “Kemarilah, Umm Sulaym, apa yang engkau punya?” Beliau memerintahkan agar makanan itu disiapkan, dan Umm Sulaym memeras sedikit air dari kantungnya ke makanan itu agar lebih mudah diolah. Kemudian ia berkata, “Masukkan sepuluh orang,” dan mereka makan sampai kenyang. Kemudian ia berkata lagi, “Masukkan sepuluh orang,” sampai semua orang telah makan dan kenyang. Jumlah orang-orang itu adalah tujuh puluh atau delapan puluh orang laki-laki. {cite:muwatta-maruf-1997 p.515} {cite:muwatta-maruf-1997 p.516} {cite:muwatta-maruf-1997 p.517}"
