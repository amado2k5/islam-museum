text: "… أصحابِهِ، وَكَتَبَ معهم كُتُباً إِلى الملوكِ ؛ يَدْعُوهم فيها إِلى الإسلام، فَبَعَثَ دِحْيَةَ بن خليفة الْكَلْبِيَّ إلى قَيْصَرَ مَلِكِ الرومِ، وَبَعَثَ عَبْدَالله بن حُذَافة السَّهْمِيَّ إِلى كِسْرَىْ ملكِ فارس، وبعث عَمْرَو بن أمَيَّة الضَّمْرِيَّ إلى النَّجَاشِيِّ ملك الحبشةِ، وَبَعَثَ حَاطِبَ …"
