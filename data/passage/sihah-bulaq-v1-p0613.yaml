text: |-
  ٢A
  ⁦(مدأ)⁩
  مفتوحان وهما مصدران شاذان وماسواهمامن المصادر فبى على الضم وتقول واضأته
  فوضأنه أضؤه اذا فاخرته بالوضاءة فغلبته والوضاء بالضم والمدالوضئ قال أبو صدقة
  الدبيرى الشاعر
  والمر يلحقه بفتيان الندا * خلق الكريم وليس بالوضاء
  طأ) وطئت الشئ برجلى وطأ ووطى الرجل امر أته يطأفيهما سقطت الواومن يطأ
  كما سقطت من يسع التعديهما لان فعل يفعر مما اعمل فاؤه لا يكون الالاز ما فلماجا آمن
  بين اخواتهما متعد بين خواف به مانظائرهما وقد بوطاته برجلى ولا تقل توطمته والواطئة
  الذين فى الجديثهم السابلة سموابد للذلوطثهم الطاريق ووطؤ الموضع يوطؤ وطاءأى صار
  وطيئا ووطأته آنانوطئة ولا تقل وطبت وفلان قد استوطأ المركب أى وجده وطيمًا وشئ
  الكي نيز الوطاءة والعشة والدأنات الطعة والطعة فالهاء عوض-ن الواوفيهسما قاد
  أغشى المكاره أحيانا ويحملى * منع على طأة والدهرذونوب
  أى على حال لينة ويروى على طئة وهما بعنى والوطأموضع القدم وهى أيضا كالضغطة
  وفى الحديث اللهم اشدد وطأنك على مضر والوطاءخلاف الغطاء والوطيئة على فعيلة شئ
  كالغرارة وفى الحسديث أخرج ثلاث أكل من وطيقة أى ثلاث قرص من غرارة والوطيئة
  أيضاضرب من الطعام وأوطأته الشئ فوطته يقالمن أوطأكعشوة أبو زيد واطأته على
  الامرمواطأة اذا وافقته من الوفاق وفلان يواطئ اسمسه اسمى وتواطؤاعليه أى توافوا
  قال الاخفش فى قوله تعالى ليواطؤاعدة ماحزم اللّٰه هو من واطأت قال ومثلها قوله هى
  أشدوطاء با تأى مواطأة قال وهى المواتاة أمواتاة السمع والبصراياه وقرئ أشدوطما
  أى قياما وتوطأته بقدمى مشل وطئنه وهذاء وطئ قدمك والايطاء فى الشعر اعادة القافية
  و ا رجل تكأ:مثال ه.زة كثبر الاتكاء والتكأة أيضامايتكاً عليه واتكاً على
  الشى فهو. سكى والموضع متكأ وقرى وأعتدت لهنّ متسكاً قال الاخفم هوفى معنى
  مجلس وطعنه حتى أتكأ. على أفعله أى ألقاه على هيئة المتكن وتوكأت،لى المصاوأصل
  الناءفى جميع الذواو وأوأت فلانا إيكاء اذا ئصبت ه متكاً ⁦( لمأ)⁩ أومأت اليه
  أشرت ولا تقل أوميت وومأن اليه أمأومثالغة وأنشد القنانى
  فقلنا السلام قاتقت من أميرها * وما كان إلا ومؤها بالحواجب
  ويقال ذهب قوبى نا أدرى ماكانت وامشته أى لا أدرى من أخذه أبوزيد يقال وقع
  فى وامئة أى فى أغوية وداهية
  •جأجأت بها اللشرب والاسم الهىء والجى" وأنشدوما كان على الهى "ولا الجى امتداحيك
  وقد ذكرفى فصل الجيم (هتا تهتا الثوب تقطع وإلى بالتّاء مهجة بنقطتيز من فوق وكذلك
  تهمأ النوب بالميم جاً ) أبوزيد مجأغرنى سكن وأهجأ طعامكم غرث قطعه وأنشد
  وأخزاهموربي ودل عليه-م * وأطعمهم من معامم غير مهجى
  دا هد أهد ا هدوء اسكن وأهدأمسكنه يقال هدأت ألصى اذا جعلت تضرب
