text: "… ثم إنه أسرّ اليها حديثاً فضحكت. فقلت: ما رأيت كاليوم فرحاً أقرب من حزن؟ فسألتها عما قال؟ فقالت: ما كنت لأفشي سرّ رسول اللّٰه وَيِيِ. فلما قبض لِيِ سألتها؟ فقالت: إنه أسرَّ لي فقال: إن جبريل كان يعارضني بالقرآن في …"
summary:
