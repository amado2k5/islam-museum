text: "… اللهم إياك نعبد، ولك نصلي ونسجد، وإِليك نسعى ونحفد، نرجو رحمتك، ونخشى عذابك الجِدّ، إن عذابك الجِدَّ بالكفار ملحق، اللهم عَذِّب الكَفَرَة والمشركين، وأَلْقِ في قلوبهم الرعب، وخالف بين كلمتهم، وأنزِل عليهم رِجزك وعذابك، اللهم عذِّب كفرة أَهل الكتاب الذين …"
