text: |-
  • (اب الام%nœ*
  *⁦(شال)⁩
  ٢٠١
  ورجل شاعل أى ذواشعال مثل تاهر ولا بن وليس له فعلُ قال عمروبن الاطنابة
  يسوا بأنكاس ولاميل اذا • ما الحرب شبت أشعلوا بالشاعل
  وأشعلت الغارة اذا تقترقت بقال كتيبة مشعلة بكسر العيز اذا انتشرت قال بحر يريخاطب
  رجلا عاينت مشعلة الرعال كأنها • طير تغاول فى شمام وكورا
  وكذلك جراد مشعل اذا انتشروجرى فى كل وجه بقال جاوا كالجراد المشعل (وأماقولهم
  جاءفلان كالحريق المشعل ففوحة العيز لانه من أشعل النار فى الحطب أى أضرمها وكذلك
  أشعل ابله بالقطران أى ط-لاها به وأكثر وأشعلت القربة والمزادة اذاسال ماؤها متفترّقا
  وأشعلت الطعنة أى خرج دمها متفرّقا واشتعلت النارأى اضطرمت واشتعل رأسه شيبا
  والشعل بالتحر يك بياض فى عرض الذنب قال الاصحى اذا خالط البياض الذنب فى أىّ
  لون كان فذلت الشعلة والفرس أشعل بين الشعل والاتى شعلاء وقد اشعل" اشعلا لا قان ابيض
  الذنب كله أوأطرافه فهو أصبغ وشعل اسم رجل ولقب ثابت بن بابرتأبط شراوذهب القوم
  شعاليلمشل شعاريراذا تفرّقوا شغل) المشغل فيه أربع لغات شغل وشغل وشغل وشغل
  والمع أشغال وقد سغلت فلانافأ ناشاغل ولا نقل أشغلته لانهالغة رديتسة وشغل شاغل
  توكيدله مثل ليل لائل ويقال شغلت عنك بكذاء-لى مالم يسمّ فاعل واتستغلت وقد قالوا
  ما أشغله وهو شاذلانه لا يتعجب ممالم يسمّ فاعله ( كل لشكل بالفتح المثل والهع أشكال
  وشكول يقال هذا أشكل بكذا أى أشبه والشكل بالكسر الدل يقال امرأة ذات شكل
  والاشكل من الشاء الابيض الشاكلة والاننى شكلاء بينة الشكل والشكلاء الحاجة وكذلك
  الاشكلة يقال لناقباك أشكلة أى حاجة والشكلة كهيئة الجرة تكون فى بيداض العين كالشهلة
  فى سوادها وعين شكلاه بينة الشكل ورجل أشكل العين ودم أشكل اذا كان فيه بياض وحرة
  قال ابن دريد انماسعي الدم أشكل للحعرة والبياض المختلطين فيه والاشكل السدر الجبلى
  وقال ١ عوجا كمااعوجت قياس الاشكل* وقان آخر • أووجبة من جناة أشكلة *
  يعتى سدرة جبلية والشاكلة الخاصرة وهى الطفطفة وكل يعمل على شاكالته أى على جديلته
  وطريقته وجهته قال قطرب الشاكل مابين العذار والاذن من البياض والشكال العقال
  والجمع شكل الاصمعى" الشكال حبل يجعل بين التصدير والحقب كى لايدنو الحقب من الثيل
  وهو الزوارأ يضاعن أبى عمرو ويقال أيضا بالفرم شكال وهو أن تكون ثلاث قوائم مجمل
  وواحدة مطلقة شبه بالشكال وهو الع-قال أو تكون الثلاث مطلقة ورجل محجلة قال أبو
  عبيد وليس يكون الشكال الافى الرجل ولا يكون فى اليد والفرس مشكول وهويكره
  وفى الحديث أنّ النبي صلى اللّٰه عليه وسلم كره الشكال فى الخيل وأشكل الامر أى التبس قال
  الكسائى أشكل النخل أى طاب رطبه وأدرلة وتشكل العنب أيتع بعضه وشكات الطائر
  وشكات الفرس بالشكال وشكات عن البعيراذاشددت شكاله بين التصدير والحقب أش-كل
  شكلا وشكلت الكتاب أيضا أى قيدته بالاعراب ويقال أيضا أشب كلت الكتاب بالالف
  كأنك أزلت به عنه الاشكال والالتباس وهذا نقلته من كاب من غير سماع والمشاكلة الموافقة
  والتشاكل مثله وشكل بالتحربك بطن من العرب لل شللت الابل أشلهاشلا
