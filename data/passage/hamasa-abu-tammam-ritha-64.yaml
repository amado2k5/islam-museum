text: "… عبد الملك بن مروان فكتب الى عماله ان يطلبوا قتلة عون وان يأخذوا السعاة بذلك اشد الاخذوما زالوا يطلبونهم واحدا بعد واحد حتى ظفروا بيهدل فقتله عثمان بن حيان وكان اميرا على المدينة فقالت بنت بهدل هذه الابيات ترثيه بها …"
summary:
  ar: "مقطع من حماسة أبي تمام، ص 64، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Hamasa of Abu Tammam, p. 64, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ابو تمام کی حماسہ، ص 64 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hamasa d'Abu Tammam, p. 64, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Hamasa de Abu Tammam, p. 64, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Ebu Tammam'ın Hamasa adlı eserinin 64. sayfasından, merhum için yazılmış bir ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari Hamasa karya Abu Tammam, halaman 64, berisi elegi dan pujian untuk almarhum; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
