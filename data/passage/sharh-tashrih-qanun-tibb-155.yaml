text: "… لساناً واحداً وألسنة الأجنة بيض الألوان لأن لحم اللسان كذلك وإنما يحمر اللسان بعد الولادة وذلك لما يلزمه من الدم في العروق المنبثة فيه. وألفاظ الكتاب ظاهرة. والله ولي التوفيق. فصل تشريح أعضاء الحلق قال الشيخ الرئيس رحمة اللّٰه عليه …"
