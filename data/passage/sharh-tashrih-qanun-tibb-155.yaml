text: "… لساناً واحداً وألسنة الأجنة بيض الألوان لأن لحم اللسان كذلك وإنما يحمر اللسان بعد الولادة وذلك لما يلزمه من الدم في العروق المنبثة فيه. وألفاظ الكتاب ظاهرة. والله ولي التوفيق. فصل تشريح أعضاء الحلق قال الشيخ الرئيس رحمة اللّٰه عليه …"
summary:
  ar: "مقطع من شرح تشريح القانون لابن النفيس، ص 155، يذكر أطوار خلق الجنين، وأعضاء البدن، والعروق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 155, that mentions the stages of the embryo, the organs of the body, the vessels; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "شرح تشریح القانون، ابن النفیس، ص 155 کا اقتباس جس میں جنین کے مراحل، اعضائے بدن، رگیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Comentario de Ibn al-Nafis sobre la Anatomía del Canon, pág. 155, que menciona las etapas del embrión, los órganos del cuerpo y los vasos sanguíneos; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Commentaire d'Ibn al-Nafis sur l'Anatomie du Canon, p. 155, qui mentionne les stades de l'embryon, les organes du corps, les vaisseaux; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Nafis'in hukukun anatomisi hakkındaki açıklamasından bir alıntı, s. 155; embriyonik gelişim aşamaları, vücut organları ve damarlardan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari penjelasan Ibn al-Nafis tentang anatomi hukum, hlm. 155, yang menyebutkan tahapan perkembangan embrio, organ tubuh, dan pembuluh darah; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
