text: "حَدَّثَنِي عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرٍو، عَنْ جَابِرٍ، عَنِ النَّبِيِّ قَالَ \" مَنْ لِكَعْبِ بْنِ الأَشْرَفِ \". فَقَالَ مُحَمَّدُ بْنُ مَسْلَمَةَ أَتُحِبُّ أَنْ أَقْتُلَهُ قَالَ \" نَعَمْ \". قَالَ فَأْذَنْ لِي فَأَقُولَ. قَالَ \" قَدْ فَعَلْتُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3032، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3032 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3032، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
