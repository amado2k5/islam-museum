text: "… الشجعان من قريش الدّ ين كانوايحرمون رسول امّه عليه وملم في ممازيه وهو الذى كوف الكوفة واقى الاعاجم وتولى قتال فارمى امره عمر بن الخطاب على ذلك ففتح ان على يديه اكثر فارس وله كان فتح القادسية وغيرها وكان اميرا …"
