text: "… بيعْ بَعْضِكُمْ عَكى بَيْعِ بعْضٍ، ولا يَخْطُبَ على خِطبة أخِيهِ إلاَّ أنْ يَاذَّنَ لَهُ متفقٌ عليه، وهذا لَفّظُ مسلم - وَعَنْ مُقْبةً بِنِ عَامِرِ أنَّ رَسُولَ اللَّهِ لَلٍمِ قَالَ : الُمُؤْمنُ أخُو المُؤْمِن، فَلَاَ يحِلّ لِمُؤْمِنِ أنْ يِبْتَاعَ عُلَى بَيْعِ …"
summary:
