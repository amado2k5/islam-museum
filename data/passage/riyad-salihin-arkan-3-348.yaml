text: "… بيعْ بَعْضِكُمْ عَكى بَيْعِ بعْضٍ، ولا يَخْطُبَ على خِطبة أخِيهِ إلاَّ أنْ يَاذَّنَ لَهُ متفقٌ عليه، وهذا لَفّظُ مسلم - وَعَنْ مُقْبةً بِنِ عَامِرِ أنَّ رَسُولَ اللَّهِ لَلٍمِ قَالَ : الُمُؤْمنُ أخُو المُؤْمِن، فَلَاَ يحِلّ لِمُؤْمِنِ أنْ يِبْتَاعَ عُلَى بَيْعِ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 348، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 348, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 348 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen 3, pág. 348, que menciona la semejanza del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Riyad al-Salihin d'al-Nawawi, volume 3, page 348, évoquant la ressemblance du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin 3. cildinin 348. sayfasından, müminin kıssasını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın Şartları, İmanın Şartları, İmanın Dalları ve Müminin Özellikleri için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Volume 3, halaman 348, yang menyebutkan perumpamaan orang beriman; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Karakteristik Orang Beriman."
