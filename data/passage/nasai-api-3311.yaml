label: { ar: "سنن النسائي 3311 — ما حُرّم", en: "Sunan al-Nasa'i 3311 — what was made unlawful", ur: "سنن نسائی 3311 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 3311 — lo que se declaró ilícito", fr: "Sunan al-Nasa'i 3311 — ce qui a été déclaré illicite" }
text: "… ابْنَ زُرَيْعٍ - قَالَ حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ، قَالَ كَتَبْنَا إِلَى إِبْرَاهِيمَ بْنِ يَزِيدَ النَّخَعِيِّ نَسْأَلُهُ عَنِ الرَّضَاعِ، فَكَتَبَ أَنَّ شُرَيْحًا، حَدَّثَنَا أَنَّ عَلِيًّا وَابْنَ مَسْعُودٍ كَانَا يَقُولاَنِ يُحَرِّمُ مِنَ الرَّضَاعِ قَلِيلُهُ وَكَثِيرُهُ. وَكَانَ فِي كِتَابِهِ أَنَّ أَبَا الشَّعْثَاءِ الْمُحَارِبِيَّ حَدَّثَنَا أَنَّ عَائِشَةَ حَدَّثَتْهُ أَنَّ نَبِيَّ اللَّهِ كَانَ يَقُولُ \" لاَ تُحَرِّمُ الْخَطْفَةُ وَالْخَطْفَتَانِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3311، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3311 (The Book of Marriage), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3311، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3311 (El Libro del Matrimonio), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3311 (Le Livre du Mariage), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
