label: { ar: "نوادر جحا الكبرى، ص 176 — «ما دام هذا الطعام وهذا الكلب عندكم لا يتعافى ابنكم»", en: "Nawadir Juha al-Kubra, p. 176 — 'As Long as This Food and This Dog Are Here, Your Son Will Not Recover'", ur: "نوادر جحا الکبریٰ، ص 176 — «جب تک یہ کھانا اور یہ کتا آپ کے پاس ہے آپ کا بیٹا ٹھیک نہیں ہوگا»", fr: "Nawadir Juha al-Kubra, p. 176 — « Tant que cette nourriture et ce chien seront chez vous, votre fils ne guérira pas »", es: "Nawadir Juha al-Kubra, p. 176 — «Mientras esta comida y este perro estén con ustedes, su hijo no sanará»" }
text: "… ما دام هذا الطعام وهذا الكلب عندكم لا يتعافى ابنكم نزل الشيخ، عند بعض الفلاحين، فأكرمه ذلك الفلاح مع شدَّةِ فقره، وقبلهُ بسرور، وقدَّم له من حواضر البيت لبناً وقشطة وعسلاً، فأكل الشيخ من ذلك الطعام النفيس شيئاً كثيراً، وما …"
summary:
  ar: "استضاف مزارع جحا بسخاء، فاستيقظ جحا ليلاً على كلب أسود عند الباب فبال على فراش الطفل، فاستيقظ أهل المزارع على القذارة في فراش الطفل، فقال جحا إن الكلب عند الباب يمنع الطفل من الشفاء. {cite:juha-nawadir-kubra-djuwaydi p. 176}"
  en: "A farmer hosts Juha lavishly; Juha, woken at night by a black dog at the door, relieves himself on the child's bed; the farmer's family wakes to the mess on the child's bed; Juha says the dog at the door keeps the child from getting well. {cite:juha-nawadir-kubra-djuwaydi p. 176}"
  ur: "ایک کسان نے جحا کی فراخ دلی سے میزبانی کی، جحا رات کو دروازے پر ایک کالے کتے کی آواز سے جاگا اور بچے کے بستر پر پیشاب کر دیا، کسان کے گھر والے جاگے تو بچے کے بستر پر گندگی دیکھی، تو جحا نے کہا کہ دروازے پر کتا ہونے کی وجہ سے بچہ ٹھیک نہیں ہو پا رہا۔ {cite:juha-nawadir-kubra-djuwaydi p. 176}"
  fr: "Un fermier reçoit Juha avec largesse ; Juha, réveillé la nuit par un chien noir à la porte, se soulage sur le lit de l'enfant ; la famille du fermier se réveille devant la saleté sur le lit de l'enfant ; Juha dit que le chien à la porte empêche l'enfant de guérir. {cite:juha-nawadir-kubra-djuwaydi p. 176}"
  es: "Un granjero hospeda a Juha con generosidad; Juha, despertado por la noche por un perro negro en la puerta, se alivia sobre la cama del niño; la familia del granjero despierta ante la suciedad en la cama del niño; Juha dice que el perro en la puerta impide que el niño sane. {cite:juha-nawadir-kubra-djuwaydi p. 176}"
