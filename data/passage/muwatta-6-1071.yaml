label: { ar: "الموطأ 1071 — مالك: من شك في طوافه بعدما يركع ركعتي الطواف فليعد وليتم طوافه على اليقين، ثم ليعد الركعتين، لأنه لا صلاة لطواف إلا بعد إكمال السبع", en: "Muwatta 1071", es: "Muwatta 1071", fr: "Muwatta 1071", ur: "موطا 1071", tr: "El-Muvatta 1071 — Malik: İki rekat tavaf ettikten sonra tavafından şüphe eden kimse, tavafını tekrar etmeli ve kesin olarak tamamlamalıdır; sonra iki rekatı tekrar etmelidir, çünkü yedi rekat tamamlanmadıkça tavaf namazı yoktur.", id: "Al-Muwatta 1071 — Malik: Barang siapa yang ragu dengan tawafnya setelah melakukan dua rakaat tawaf, maka hendaklah ia mengulanginya dan menyelesaikan tawafnya dengan yakin, kemudian hendaklah ia mengulangi dua rakaat tersebut, karena tidak ada salat tawaf kecuali setelah menyelesaikan tujuh rakaat." }
summary:
  ar: "قول لمالك: من شك في طوافه بعدما يركع ركعتي الطواف فليعد وليتم طوافه على اليقين، ثم ليعد الركعتين، لأنه لا صلاة لطواف إلا بعد إكمال السبع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1294). {cite:muwatta-maruf-1997 p.494}"
  tr: "Malik şöyle demiştir: \"Bir kimse iki rekat tavaf ettikten sonra tavafından şüphe ederse, namazı tekrar kılmalı ve tavafını kesin olarak tamamlamalıdır; çünkü yedi rekat tamamlanmadıkça tavaf namazı yoktur.\" Araştırmacı, bunu Malik'ten Ebu Musab'ın (1294) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.494}"
  id: "Malik berkata: Jika seseorang ragu dengan tawafnya setelah melakukan dua rakaat tawaf, maka hendaknya ia mengulangi salat dan menyelesaikan tawafnya dengan yakin, kemudian mengulangi dua rakaat tersebut, karena tidak ada salat tawaf kecuali setelah menyelesaikan tujuh putaran. Peneliti menyebutkan bahwa Abu Mus'ab (1294) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.494}"
