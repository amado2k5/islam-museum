text: "… قريش كانوا أقل عداوة من هؤلاء، كعتبة وشيبة وغيرهما، وكان جماعة من قريش من أشد الناس عليه فأسلموا، تركنا ذكرهم لذلك، منهم: أبو سفيان بن الحارث بن عبد المطلب، وعبد اللّٰه بن أبي أمية المخزومي أخو أم سلمة لأبيها، وكانت …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 565، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
