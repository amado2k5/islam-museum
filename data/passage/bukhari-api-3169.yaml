text: "… اللَّيْثُ، قَالَ حَدَّثَنِي سَعِيدٌ، عَنْ أَبِي هُرَيْرَةَ ـ قَالَ لَمَّا فُتِحَتْ خَيْبَرُ أُهْدِيَتْ لِلنَّبِيِّ شَاةٌ فِيهَا سُمٌّ فَقَالَ النَّبِيُّ \" اجْمَعُوا إِلَىَّ مَنْ كَانَ هَا هُنَا مِنْ يَهُودَ \". فَجُمِعُوا لَهُ فَقَالَ \" إِنِّي سَائِلُكُمْ عَنْ شَىْءٍ فَهَلْ أَنْتُمْ صَادِقِيَّ عَنْهُ \". فَقَالُوا نَعَمْ. قَالَ لَهُمُ النَّبِيُّ \" مَنْ أَبُوكُمْ \". قَالُوا فُلاَنٌ. فَقَالَ \" …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3169، يذكر السم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3169 (Jizyah and Mawaada'ah), that mentions poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3169، جس میں زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
