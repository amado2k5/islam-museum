text: "… الشُّروطُ المعتبرة في صاحب هذه الرُّتبة التي يلاحظُها السُّلطان في اختياره وانتقائه من أصناف النّاسِ فهيَ كثيرةٌ وأحسنُ من استوعبها عبدُ الحميد الكاتبُ في رسالته إلى الكتاب وهي: أمَّا بعِدُ: حفظكم الله يا أهلَ صناعة الكتابةِ، وحاطكم ووفّقكم وأرشدكم!! فإنَّ …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 3، ص 431، يذكر الخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 3, p. 431, that mentions the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 3، ص 431 کا اقتباس جس میں خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
