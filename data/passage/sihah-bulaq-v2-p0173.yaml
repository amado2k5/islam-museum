  أحكدتهما بن. وقوله تعالى فاجتذبوا الرجس من الاوثان أى فاجتنبوا الرجس الذى
  هو الاوثان وكذلك ثوب من خز وقال الاخفش فى قوله تعالى وترى الملاتكة حافين
  من حول العرش وقوله تعالى ماجعل اللّٰه رجل من قلبين فى جوفه انما أدخلمن توكيدا
  كما تقول رأيت زيدانفسه وة ول العرب مارأيته من سنة أى منذسنة قال تعالى لمسجد
