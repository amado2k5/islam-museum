text: "… خَالِدٌ الْحَذَّاءُ، عَنْ أَبِي قِلاَبَةَ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" إِنَّ مِنْ أَكْمَلِ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا وَأَلْطَفُهُمْ بِأَهْلِهِ \". وَفِي الْبَابِ عَنْ أَبِي هُرَيْرَةَ وَأَنَسِ بْنِ مَالِكٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَلاَ نَعْرِفُ لأَبِي قِلاَبَةَ سَمَاعًا مِنْ عَائِشَةَ. وَقَدْ رَوَى أَبُو قِلاَبَةَ عَنْ عَبْدِ اللَّهِ بْنِ يَزِيدَ رَضِيعٌ لِعَائِشَةَ عَنْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2612، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2612 (The Book on Faith), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2612، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2612 (El Libro de la Fe), menciona la dulzura y la plenitud de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2612 (Le Livre de la Foi), évoque la douceur et la plénitude de la foi. Le Guide des Piliers et des Branches de la Foi le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
  tr: "Cami' el-Tirmizi'de 2612 numaralı hadis, imanın tatlılığı ve mükemmelliğinden bahseder. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2612, menyebutkan manisnya dan kesempurnaan iman. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
