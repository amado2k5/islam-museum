text: "… عشر الإشارة إلى الخلاف في ذلك، والمعروف أنه بلغة قريش وحكى عن أبى الأسود الديلى أنه نزل بلسان الكعبين : كعب بن لؤى جد قريش وكعب بن عمرو جد خزاعة فقال له خالد بن سلمة : إنما نزل بلسان قريش …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 199، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 199, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 199 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, volumen 2, pág. 199, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre d'al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an (tome 2, p. 199), mentionnant la collection du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Zarkashi'nin \"El-Burhan fi Ulum el-Kur'an\" adlı eserinin 2. cildinin 199. sayfasından alınan bu alıntı, Kur'an'ın derlenmesini ve el yazmalarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 2, halaman 199, membahas penyusunan Al-Qur'an dan manuskripnya. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
