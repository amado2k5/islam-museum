label: { ar: "صحيح مسلم 7158 — الأب والأبوة", en: "Sahih Muslim 7158 — the father and fatherhood", ur: "صحیح مسلم 7158 — باپ اور والدیت", es: "Sahih Muslim 7158 — El padre y la paternidad", fr: "Sahih Muslim 7158 — Le père et la paternité", tr: "Sahih Muslim 7158 — Baba ve Babalık", id: "Sahih Muslim 7158 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا سَعِيدُ بْنُ مَنْصُورٍ، عَنْ أَبِي قُدَامَةَ، - وَهُوَ الْحَارِثُ بْنُ عُبَيْدٍ - عَنْ أَبِي، عِمْرَانَ الْجَوْنِيِّ عَنْ أَبِي بَكْرِ بْنِ عَبْدِ اللَّهِ بْنِ قَيْسٍ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ قَالَ \" إِنَّ لِلْمُؤْمِنِ فِي الْجَنَّةِ لَخَيْمَةً مِنْ لُؤْلُؤَةٍ وَاحِدَةٍ مُجَوَّفَةٍ طُولُهَا سِتُّونَ مِيلاً لِلْمُؤْمِنِ فِيهَا أَهْلُونَ يَطُوفُ عَلَيْهِمُ الْمُؤْمِنُ فَلاَ يَرَى بَعْضُهُمْ بَعْضًا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7158، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7158 (The Book of Paradise, its Description, its Bounties and its Inhabitants), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7158، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 7158 (El Libro del Paraíso, su Descripción, sus Bendiciones y sus Habitantes), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 7158 (Le Livre du Paradis, sa description, ses bienfaits et ses habitants), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 7158 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 7158, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
