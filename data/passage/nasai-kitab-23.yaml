summary:
  ar: "القسم 23 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزكاة»، ويضم فيها النصوص من 2435 إلى 2618 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 23 of Sunan al-Nasa'i (The Book of Zakah) in the division of the open hadith dataset the museum took its reports from: reports 2435 to 2618 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 23، عنوان «کتاب الزکاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2435 تا 2618۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 23 de Sunan al-Nasa'i (El Libro del Zakat) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2435 al 2618, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan al-Nasa'i (Livre de la Zakat), dans sa partie ouverte, le livre 23 (les hadiths 2435 à 2618). Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
