  ar: "سنن النسائي، كتاب الزكاة"
  en: "Sunan al-Nasa'i, Book 23: The Book of Zakah"
  ur: "سنن نسائی، کتاب الزکاۃ"
  es: "Sunan al-Nasa'i, Libro 23: El Libro del Zakat"
