text: "… اقرأ ياهشام، فقرأ عليه القراءة التى سمعت يقرأ فقال رسول اللّٰه ي: كذلك أنزلت. ثم قال: اقرأ ياعمر فقرأت القراءة التى أقرأنى. فقال رسول اللّٰه ود : كذلك أنزلت ؛ إن هذا القرآن أنزل على سبعة أحرف، فأقرءوا ما تيسر …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 5888، يذكر الأحرف السبعة، وقراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 5888, that mentions the seven ahruf, the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 5888 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
