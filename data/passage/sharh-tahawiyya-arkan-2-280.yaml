  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 2، ص 280 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
