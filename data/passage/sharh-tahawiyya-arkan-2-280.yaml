text: "… فسمى حب الصحابة إيمانا وبغضهم كفرا. وما أعجب ما أجاب به أبو المعين النسفى وغيره عن استدلالهم بحديث شعب الإيمان المذكور وهو أن الراوى قال: بضع وستون أو بضع وسبعون فقد شهد الراوى بفعله نفس حيث شك فقال: بضع وستون …"
