text: "… إمساكهن مع الكراهة فيه خير كثير لكم في الدنيا والأخرة، كما قال ابن عباس: هو أن يعطف عليها فيرزق منها ولدا ويكون في ذلك الولد خير كثير، وفي الحديث الصحيح: لا يَفْرِكَ مؤمن مؤمنة، إن كره منها خلقا رضى منها …"
