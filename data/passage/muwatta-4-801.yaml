label: { ar: "الموطأ 801 — زيد بن أسلم: أبو هريرة وسعد بن أبي وقاص كانا يرخصان في القبلة للصائم", en: "Muwatta 801", es: "Muwatta 801", fr: "Muwatta 801", ur: "موطا 801", tr: "Al-Muwatta 801 - Zeyd ibn Eslem: Ebu Hureyre ve Sa'd ibn Ebi Vakkas oruçlunun öpüşmesine izin verdi", id: "Al-Muwatta 801 — Zayd ibn Aslam: Abu Hurairah dan Sa`d ibn Abi Waqqas diperbolehkan berciuman bagi orang yang berpuasa" }
summary:
  ar: "يرويه مالك عن زيد بن أسلم أن أبا هريرة وسعد بن أبي وقاص كانا يرخصان في القبلة للصائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.394}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Ebu Hurayra ve Sa'd ibn Abi Vakkas'ın oruçluyken öpüşmeyi caiz gördüğünü nakletmiştir. Editör, Ebu Mus'ab ve Suveyd'in bunu Malik'ten naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.394}"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, bahwa Abu Hurayrah dan Sa'd ibn Abi Waqqas memperbolehkan berciuman saat berpuasa. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.394}"
