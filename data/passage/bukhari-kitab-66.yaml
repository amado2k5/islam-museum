summary:
  ar: "القسم 66 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضائل القرآن»، ويضم فيها النصوص من 4979 إلى 5062 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 66 of Sahih al-Bukhari (Virtues of the Qur'an) in the division of the open hadith dataset the museum took its reports from: reports 4979 to 5062 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 66، عنوان «کتاب فضائل القرآن»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4979 تا 5062۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 66 de Sahih al-Bukhari (Virtudes del Corán) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4979 al 5062, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih al-Bukhari (Les Vertus du Coran), dans le livre 66, qui correspond aux hadiths 4979 à 5062 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 66. bölümü \"Kur'an'ın Faziletleri Kitabı\" başlığını taşımakta olup, 4979'dan 5062'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 66 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Keutamaan Al-Qur'an\" dan berisi teks 4979 hingga 5062, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
