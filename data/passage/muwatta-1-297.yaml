text: "من ترك الجمعة ثلاث مرات من غير عذر ولا علة طبع الله على قلبه"
summary:
  ar: "يرويه مالك عن صفوان بن سليم، وقال مالك إنه لا يدري أعن النبي هو أم لا، في باب القراءة في صلاة الجمعة والاحتباء ومن تركها من غير عذر: من ترك الجمعة ثلاث مرات من غير عذر ولا علة طبع الله على قلبه. وينقل المحقق عن ابن عبد البر أن الحديث يُسند من وجوه عن النبي أحسنها إسناداً حديث أبي الجعد الضمري (التمهيد 16/239)، ويرى أن حديث أبي الجعد حسن كما قال الترمذي، ويخرّجه عند أحمد وأبي داود (1052) والترمذي (500) وابن ماجه (1125) والنسائي وابن خزيمة وابن حبان والحاكم. {cite:muwatta-maruf-1997 p.168} {cite:muwatta-maruf-1997 p.169}"
