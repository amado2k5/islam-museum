label: { ar: "الموطأ 297 — من ترك الجمعة ثلاث مرات من غير عذر طبع الله على قلبه", en: "Muwatta 297", es: "Muwatta 297", fr: "Muwatta 297", ur: "موطا 297", tr: "Al-Muwatta 297 — Geçerli bir mazereti olmaksızın üç cuma namazını kaçıran kimsenin kalbini Allah mühürler.", id: "Al-Muwatta 297 — Barang siapa yang melewatkan tiga kali salat Jumat tanpa alasan yang sah, maka Allah akan menutup hatinya." }
text: "من ترك الجمعة ثلاث مرات من غير عذر ولا علة طبع الله على قلبه"
summary:
  ar: "يرويه مالك عن صفوان بن سليم، وقال مالك إنه لا يدري أعن النبي هو أم لا، في باب القراءة في صلاة الجمعة والاحتباء ومن تركها من غير عذر: من ترك الجمعة ثلاث مرات من غير عذر ولا علة طبع الله على قلبه. وينقل المحقق عن ابن عبد البر أن الحديث يُسند من وجوه عن النبي أحسنها إسناداً حديث أبي الجعد الضمري ⁦(التمهيد 16/239)⁩، ويرى أن حديث أبي الجعد حسن كما قال الترمذي، ويخرّجه عند أحمد وأبي داود (1052) والترمذي (500) وابن ماجه (1125) والنسائي وابن خزيمة وابن حبان والحاكم. {cite:muwatta-maruf-1997 p.168} {cite:muwatta-maruf-1997 p.169}"
  tr: "Malik, Safvan ibn Salim'den rivayetle, Cuma namazında dizleri göğse çekerek kılınan ve mazeretsiz olarak namazı kaçıran kişiyle ilgili hadiste, Peygamberimizden olup olmadığını bilmediğini söylemiştir: \"Kim mazeretsiz olarak üç defa Cuma namazını kaçırırsa, Allah onun kalbini mühürler.\" Araştırmacı, İbn Abdül-Barr'ın hadisin çeşitli rivayet zincirleriyle Peygamberimize nakledildiğini, bunların en iyisinin Ebu el-Câd el-Damri hadisi olduğunu (el-Temhid 16/239) söylediğini aktarmaktadır. Ebu el-Câd hadisini Tirmizi'nin dediği gibi sahih kabul etmekte ve Ahmed, Ebu Davud (1052), Tirmizi (500), İbn Mâce (1125), Nesai, İbn Huzeyme, İbn Hibban ve Hakim tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.168} {cite:muwatta-maruf-1997 s.169}"
  id: "Malik meriwayatkannya dari Safwan ibn Salim, dan Malik berkata bahwa ia tidak tahu apakah hadits itu berasal dari Nabi atau bukan, dalam surah tentang bacaan dalam shalat Jumat, duduk dengan lutut ditarik ke dada, dan orang yang ketinggalan tanpa alasan: Barang siapa ketinggalan shalat Jumat tiga kali tanpa alasan atau sebab, Allah akan menutup hatinya. Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa hadits tersebut dinisbatkan kepada Nabi melalui beberapa sanad, yang terbaik adalah hadits Abu al-Ja'd al-Damri (al-Tamhid 16/239). Ia menganggap hadits Abu al-Ja'd sahih, sebagaimana dikatakan al-Tirmidhi, dan hadits tersebut diriwayatkan oleh Ahmad, Abu Dawud (1052), al-Tirmidhi (500), Ibnu Majah (1125), al-Nasa'i, Ibnu Khuzaymah, Ibnu Hibban, dan al-Hakim. {kutip:muwatta-maruf-1997 hal.168} {kutip:muwatta-maruf-1997 hal.169}"
