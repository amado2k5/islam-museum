label: { ar: "الموطأ 2853 — أبو هريرة: لأن يحتطب أحدكم على ظهره خير له من أن يسأل الناس", en: "Muwatta 2853" }
summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن رسول الله قال: والذي نفسي بيده، ليأخذ أحدكم حبله فيحتطب على ظهره، خير له من أن يأتي رجلا أعطاه الله من فضله فيسأله، أعطاه أو منعه. ويبين المحقق أن رواية «ليأخذ» هي المعتمدة في الموطأ، وأن رواية «لأن يأخذ» رواية ابن نافع. {cite:muwatta-maruf-1997 p.598}"
