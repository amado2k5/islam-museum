label: { ar: "الموطأ 2853 — أبو هريرة: لأن يحتطب أحدكم على ظهره خير له من أن يسأل الناس", en: "Muwatta 2853", es: "Muwatta 2853", fr: "Muwatta 2853", ur: "موطا 2853", tr: "El-Muvatta 2853 — Ebu Hurayra: Sizden birinin sırtında odun taşıması, insanlardan yardım istemesinden daha hayırlıdır.", id: "Al-Muwatta 2853 — Abu Hurairah: Bagi salah seorang dari kalian, mengumpulkan kayu bakar dengan cara memanggulnya lebih baik daripada meminta bantuan kepada orang lain." }
summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن رسول الله قال: والذي نفسي بيده، ليأخذ أحدكم حبله فيحتطب على ظهره، خير له من أن يأتي رجلا أعطاه الله من فضله فيسأله، أعطاه أو منعه. ويبين المحقق أن رواية «ليأخذ» هي المعتمدة في الموطأ، وأن رواية «لأن يأخذ» رواية ابن نافع. {cite:muwatta-maruf-1997 p.598}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu naklediyor: \"Canım elinde olan Allah'a yemin ederim ki, sizden birinin ipini alıp sırtında odun toplaması, Allah'ın kendisine lütfettiği bir kimseden bir şey istemesinden, verip vermeyeceğini sormasından daha iyidir.\" Editör, \"alsın\" versiyonunun Muwatta'da kabul edilen versiyon olduğunu, \"alması gereken\" versiyonunun ise İbn Nafi'nin versiyonu olduğunu açıklıyor. {cite:muwatta-maruf-1997 s.598}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: “Demi Dia yang jiwaku berada di tangan-Nya, lebih baik bagi salah seorang di antara kalian untuk mengambil tali dan mengumpulkan kayu bakar di punggungnya daripada pergi kepada seseorang yang telah Allah beri karunia dan bertanya kepadanya, apakah ia memberi atau menahan.” Editor mengklarifikasi bahwa versi “biarkan dia mengambil” adalah versi yang diadopsi dalam Muwatta, dan versi “agar dia mengambil” adalah versi Ibnu Nafi'. {cite:muwatta-maruf-1997 p.598}"
