label:
  ar: "البخاري 5927 — الصوم لي وأنا أجزي به"
  en: "Bukhari 5927 — Fasting is Mine, and I reward it"
  ur: "بخاری 5927 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
  es: "Bukhari 5927 — El ayuno es mío, y yo lo recompenso."
  fr: "Bukhari 5927 — Le jeûne m'appartient et je le récompense."
text: "كل عمل ابن آدم له، إلا الصوم فإنه لي، وأنا أجزي به، ولخلوف فم الصائم أطيب عند الله من ريح المسك ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 5927: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 5927: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 5927: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 5927: El ayuno es mío, y yo lo recompenso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 5927: « Le jeûne M’appartient et Je le récompense. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
