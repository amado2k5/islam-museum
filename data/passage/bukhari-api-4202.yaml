label: { ar: "صحيح البخاري 4202 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4202 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4202 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4202 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 4202 — mentions de nations, religions et peuples non musulmans", tr: "Sahih el-Buhari 4202 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih al-Bukhari 4202 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا يَعْقُوبُ، عَنْ أَبِي حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ـ أَنَّ رَسُولَ اللَّهِ الْتَقَى هُوَ وَالْمُشْرِكُونَ فَاقْتَتَلُوا، فَلَمَّا مَالَ رَسُولُ اللَّهِ إِلَى عَسْكَرِهِ، وَمَالَ الآخَرُونَ إِلَى عَسْكَرِهِمْ، وَفِي أَصْحَابِ رَسُولِ اللَّهِ رَجُلٌ لاَ يَدَعُ لَهُمْ شَاذَّةً وَلاَ فَاذَّةً إِلاَّ اتَّبَعَهَا، يَضْرِبُهَا بِسَيْفِهِ، فَقِيلَ مَا أَجْزَأَ مِنَّا الْيَوْمَ أَحَدٌ كَمَا أَجْزَأَ فُلاَنٌ. فَقَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4202، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4202 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4202، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4202 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 4202 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih el-Buhari'de 4202 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4202, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
