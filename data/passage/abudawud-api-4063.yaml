label: { ar: "سنن أبي داود 4063 — الأب والأبوة", en: "Sunan Abi Dawud 4063 — the father and fatherhood", ur: "سنن ابی داؤد 4063 — باپ اور والدیت", es: "Sunan Abi Dawud 4063 — El padre y la paternidad", fr: "Sunan Abi Dawud 4063 — le père et la paternité" }
text: "حَدَّثَنَا النُّفَيْلِيُّ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا أَبُو إِسْحَاقَ، عَنْ أَبِي الأَحْوَصِ، عَنْ أَبِيهِ، قَالَ أَتَيْتُ النَّبِيَّ فِي ثَوْبٍ دُونٍ فَقَالَ \" أَلَكَ مَالٌ \". قَالَ نَعَمْ. قَالَ \" مِنْ أَىِّ الْمَالِ \". قَالَ قَدْ أَتَانِيَ اللَّهُ مِنَ الإِبِلِ وَالْغَنَمِ وَالْخَيْلِ وَالرَّقِيقِ. قَالَ \" فَإِذَا أَتَاكَ اللَّهُ مَالاً فَلْيُرَ أَثَرُ نِعْمَةِ اللَّهِ عَلَيْكَ وَكَرَامَتِهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4063، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4063 (Clothing (Kitab Al-Libas)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4063، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4063 (El Libro de la Vestimenta (Kitab Al-Libas)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4063 (Vêtements (Kitab Al-Libas)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
