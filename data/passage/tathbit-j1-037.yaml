label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ١٩، المقطع ٤ من ٤", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 19, section 4 of 4", ur: "تثبیت دلائل نبوت — حصہ اول، باب 19، حصہ 4" }
text: "كما تقدم بيان ذلك لك. وهم يقولون: إن الله الأب قال لابنه يسوع المسيح إني ولدتك قبل أن أخلق كوكب الصبح. وليس في هذه الطوائف الثلاث من النصارى من يقول: إن المسيح ابن الله على طريق التشريف والمجاز، …"
summary:
  ar: "مقطع من الباب ١٩ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 19 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 19 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
