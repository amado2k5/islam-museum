text: "، ووددت أني حيث وجهت خالد بن الوليد إلى الشام وجهت عمر بن الخطاب إلى العراق، فاكون قد بسطت يميني وشمالي في سبيل الله. وددت أني سالت رسول الله في من هذا الأمر ولا ينازعه أهله، وأني سألته هل للأنصار"
