label: { ar: "الموطأ 1711 — يحيى عن مالك: بلغه أن عمر وابنه عبد الله وابن مسعود وسالم والقاسم وابن شهاب وسليمان كانوا يقولون إن حلف الرجل بطلاق المرأة قبل أن ينكحها ثم حنث، فإن ذلك لازم له إذا نكحها", en: "Muwatta 1711" }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن عمر بن الخطاب، وعبد الله بن عمر، وعبد الله بن مسعود، وسالم بن عبد الله، والقاسم بن محمد، وابن شهاب، وسليمان بن يسار، كانوا يقولون إذا حلف الرجل بطلاق المرأة قبل أن ينكحها ثم أثم، إن ذلك لازم له إذا نكحها. {cite:muwatta-maruf-1997 p.98}"
