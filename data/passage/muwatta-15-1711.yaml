label: { ar: "الموطأ 1711 — يحيى عن مالك: بلغه أن عمر وابنه عبد الله وابن مسعود وسالم والقاسم وابن شهاب وسليمان كانوا يقولون إن حلف الرجل بطلاق المرأة قبل أن ينكحها ثم حنث، فإن ذلك لازم له إذا نكحها", en: "Muwatta 1711", es: "Muwatta 1711", fr: "Muwatta 1711", ur: "موطا 1711", tr: "El-Muvatta 1711 — Yahya, Malik'ten rivayetle: Ömer, oğlu Abdullah, İbn Mesud, Salim, El-Kâsim, İbn Şihab ve Süleyman'ın şöyle dediği rivayet edilirdi: Eğer bir erkek evlenmeden önce bir kadını boşayacağına yemin eder ve sonra yeminini bozarsa, o kadınla evlendiği takdirde bu yemin onun için bağlayıcı olur.", id: "Al-Muwatta 1711 — Yahya berdasarkan riwayat Malik: Diriwayatkan kepadanya bahwa Umar, putranya Abdullah, Ibnu Masoud, Salim, Al-Qasim, Ibnu Shihab, dan Sulaiman biasa mengatakan bahwa jika seorang pria bersumpah untuk menceraikan seorang wanita sebelum menikahinya dan kemudian mengingkari sumpahnya, maka sumpah itu akan mengikatnya jika ia menikahi wanita tersebut." }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن عمر بن الخطاب، وعبد الله بن عمر، وعبد الله بن مسعود، وسالم بن عبد الله، والقاسم بن محمد، وابن شهاب، وسليمان بن يسار، كانوا يقولون إذا حلف الرجل بطلاق المرأة قبل أن ينكحها ثم أثم، إن ذلك لازم له إذا نكحها. {cite:muwatta-maruf-1997 p.98}"
  tr: "Yahya, Malik'ten rivayetle, Ömer ibn el-Hattab, Abdullah ibn Ömer, Abdullah ibn Mes'ud, Salim ibn Abdullah, el-Kâsim ibn Muhammed, İbn Şihab ve Süleyman ibn Yasar'ın, bir erkek evlenmeden önce bir kadını boşayacağına yemin eder de sonra yeminini bozarsa, o kadınla evlenirse bu yeminin kendisi için bağlayıcı olacağını söylediklerini işittiğini aktarır. {cite:muwatta-maruf-1997 s.98}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Umar ibn al-Khattab, Abdullah ibn Umar, Abdullah ibn Mas'ud, Salim ibn Abdullah, al-Qasim ibn Muhammad, Ibn Shihab, dan Sulayman ibn Yasar biasa mengatakan bahwa jika seorang pria bersumpah untuk menceraikan seorang wanita sebelum menikahinya dan kemudian melanggar sumpahnya, maka sumpah itu akan mengikatnya jika ia menikahinya. {cite:muwatta-maruf-1997 p.98}"
