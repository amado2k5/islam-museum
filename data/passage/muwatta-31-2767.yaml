label: { ar: "الموطأ 2767 — أبو موسى الأشعري عن النبي: الاستئذان ثلاث فإن أذن لك فادخل وإلا فارجع", en: "Muwatta 2767", es: "Muwatta 2767", fr: "Muwatta 2767", ur: "موطا 2767", tr: "El-Muvatta 2767 — Ebu Musa el-Eş'ari, Peygamber'den rivayetle: İzin istemek üç defadır; izin verilirse girin, verilmezse geri dönün.", id: "Al-Muwatta 2767 — Abu Musa al-Ash'ari berdasarkan riwayat Nabi: Memohon izin dilakukan tiga kali; jika izin diberikan, maka masuklah, jika tidak, kembalilah." }
summary:
  ar: "يروي مالك عن الثقة عنده عن بكير بن عبد الله بن الأشج عن بسر بن سعيد عن أبي سعيد الخدري عن أبي موسى الأشعري أن رسول الله قال: الاستئذان ثلاث، فإن أذن لك فادخل، وإلا فارجع. ويذكر المحقق أن الثقة عند مالك هنا قيل إنه مخرمة بن بكير، وأن ابن معين وثّقه. {cite:muwatta-maruf-1997 p.553}"
  tr: "Malik, güvenilir bir kişiden, Bukayr ibn Abdullah ibn al-Ashajj'dan, Busr ibn Sa'id'den, Ebu Sa'id al-Khudri'den ve Ebu Musa al-Ash'ari'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Girmek için üç defa izin istenir. İzin verilirse girin; aksi takdirde geri dönün.\" Araştırmacı, Malik'in burada güvenilir kişi olarak belirttiği kişinin Makhrama ibn Bukayr olduğunu ve İbn Ma'in'in onu güvenilir kabul ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.553}"
  id: "Malik meriwayatkan, berdasarkan riwayat dari orang yang terpercaya, yaitu dari Bukayr ibn Abdullah ibn al-Ashajj, dari Busr ibn Sa'id, dari Abu Sa'id al-Khudri, dari Abu Musa al-Ash'ari, bahwa Rasulullah SAW bersabda: \"Izin masuk diminta tiga kali. Jika diizinkan, masuklah; jika tidak, kembalilah.\" Peneliti menyebutkan bahwa orang terpercaya yang disebutkan Malik di sini adalah Makhrama ibn Bukayr, dan Ibn Ma'in menganggapnya terpercaya. {cite:muwatta-maruf-1997 p.553}"
