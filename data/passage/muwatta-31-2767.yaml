label: { ar: "الموطأ 2767 — أبو موسى الأشعري عن النبي: الاستئذان ثلاث فإن أذن لك فادخل وإلا فارجع", en: "Muwatta 2767" }
summary:
  ar: "يروي مالك عن الثقة عنده عن بكير بن عبد الله بن الأشج عن بسر بن سعيد عن أبي سعيد الخدري عن أبي موسى الأشعري أن رسول الله قال: الاستئذان ثلاث، فإن أذن لك فادخل، وإلا فارجع. ويذكر المحقق أن الثقة عند مالك هنا قيل إنه مخرمة بن بكير، وأن ابن معين وثّقه. {cite:muwatta-maruf-1997 p.553}"
