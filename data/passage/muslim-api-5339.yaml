label: { ar: "صحيح مسلم 5339 — تمر العجوة، السم", en: "Sahih Muslim 5339 — 'ajwa dates; poison", ur: "صحیح مسلم 5339 — عجوہ کھجور، زہر", es: "Sahih Muslim 5339 - fechas 'ajwa; veneno", fr: "Sahih Muslim 5339 — dates 'ajwa; poison", tr: "Sahih Muslim 5339 — Ajwa hurmaları, zehir", id: "Sahih Muslim 5339 — Kurma ajwa, racun" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هَاشِمِ بْنِ هَاشِمٍ، قَالَ سَمِعْتُ عَامِرَ بْنَ سَعْدِ بْنِ أَبِي وَقَّاصٍ، يَقُولُ سَمِعْتُ سَعْدًا، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ تَصَبَّحَ بِسَبْعِ تَمَرَاتٍ عَجْوَةً لَمْ يَضُرَّهُ ذَلِكَ الْيَوْمَ سُمٌّ وَلاَ سِحْرٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5339، يذكر تمر العجوة، والسم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5339 (The Book of Drinks), that mentions 'ajwa dates, poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5339، جس میں عجوہ کھجور، زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5339 (El Libro de las Bebidas), menciona los dátiles 'ajwa como veneno. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5339 (Le Livre des Boissons), mentionne les dattes 'ajwa comme étant toxiques. Le dictionnaire en ligne Medicine Browser les répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5339 numaralı hadiste, ecva hurması ve zehirden bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5339, menyebutkan kurma Ajwa dan racun. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
