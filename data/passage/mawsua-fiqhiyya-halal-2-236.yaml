text: "… السم، ويجعل فيه من لحوم الحيات، ولذلك لم يبيحوا أكله ولا شربه، لأن لحم الحية حرام، ولا يجوز التداوي بمحرم، لقول النبي ل فه. إنّ اللّٰه لم يجعل شفاءَكم فيما حَرّم عليكم عون المعبود شرح سنن أبي داود للعلامة أبي …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 2، ص 236، يذكر الحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 2, p. 236, that mentions the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 2، ص 236 کا اقتباس جس میں حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 2, pág. 236, que menciona lo ilícito y lo que se declaró ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (tome 2, p. 236) mentionnant ce qui est illicite et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 2, sayfa 236'dan, haram ve yasak olan şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 2 Bergambar, halaman 236, yang menyebutkan apa yang dilarang dan diharamkan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
