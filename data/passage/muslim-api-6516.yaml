text: "حَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمِ بْنِ مَيْمُونٍ، حَدَّثَنَا ابْنُ مَهْدِيٍّ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، عَنِ النَّوَّاسِ بْنِ سَمْعَانَ الأَنْصَارِيِّ، قَالَ سَأَلْتُ رَسُولَ اللَّهِ عَنِ الْبِرِّ وَالإِثْمِ فَقَالَ \" الْبِرُّ حُسْنُ الْخُلُقِ وَالإِثْمُ مَا حَاكَ فِي صَدْرِكَ وَكَرِهْتَ أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ \"."
summary:
  ar: "خبر في صحيح مسلم، رقم 6516، في الإثم ما حاك في الصدر. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Sahih Muslim, no. 6516, on sin as what wavers in the breast. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "صحیح مسلم کی روایت نمبر 6516: گناہ وہ جو سینے میں کھٹکے۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6516, sobre el pecado como aquello que vacila en el corazón. No utiliza las palabras halal ni haram; el buscador de halal y haram lo incluye junto con los relatos sobre el escrúpulo y la búsqueda de lo lícito."
  fr: "Un hadith du Sahih Muslim, n° 6516, décrit le péché comme un trouble du cœur. Il n'emploie pas les termes halal ou haram; le Halal and Haram Browser le classe parmi les hadiths relatifs au scrupule et à la recherche du licite."
