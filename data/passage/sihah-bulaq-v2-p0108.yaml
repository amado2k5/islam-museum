text: |-
  .⁦(رأى)⁩.
  ٤٧٩
  وذكوان أبو قبيلة من سليم والمذكية مايلق على الذارتذ كبه ⁦(ذلى)⁩ اذلولى اذليلاء
  أى انطلق فى استخفاء ( ى الذماء مدود بقية الروح فى المذبوح يقال الضب أطول شئ
  ذماء وقدذمى المذبوح يذمى ذماء اذا تحزك والذميان الاسراع وق-دذمى يذمى اذا أسرع
  وذمتنى ريح كذا أى آذتنى وأنتدأبوعمرو
  ليست بمصلاء تذمى الكاب نكهتها • ولابعندلة بصطك تدياها
  وامتذميت ما عند فلان اذا تتبعته وأخذته يسال خذمن فلان ماذمى للّ أى ما ارتفع للَّ
  ⁦( ذوى)⁩ ابن السكيت ذوى البتل بالفتح يذوى ذويا فهوذا وأى ذبل قال ولا يقال ذوى
  البقل بالكسر وقال أبو عبيدة قال يونس هى لغة وأذواه الحرّأى أذبله
  ف ل ا لر" ( ر ى الرؤية بالعين تتعدى الى مفعول واحدو بعف العلم تتعدى
  الى مفعواين يقال رأى زيداعالما ورأى رأياورؤية وراءة مثل راعة والرأى معروف
  وجمعه آراً وأرآه أيضامقلوب ورئىّ على فعيل مثل ضأن وضئين ويقال أيضابه رقىّ عن
  لجنّ أى مسّ ويقال رأى فى الفقه رأيا وقد تركت العرب الهمز فى مستقبله لكثرته
  فى كلامهم وربما احتاجت اليه فهمزته كما قال الشاعر* ومن يقل العيش يرهويسمع •وقال
  سراقة البارقى
  أرى عنينمالم ترأياه • كلا ناعالم بالترهات
  وربما جاءماضيه بلاهمز قال اممعيل بزيسار
  صاح (هل ريت أوسمعت براع • ردّق الضرع ماقرى فى الحلاب
  ويروى فى العلاب وكذلك قالوافى أرأيت وأرأيتك أريت وأريتك بلاهمز قال أبو الاسود
  أريت امر أ كنت لم أيه • أتانى فقال اتخذنى خليلا
  وقال اخ
  أريتك ان منعت كلام ليلى • أتمنعنى على ليلى البكاء
  واذا أمرت منه على الاصل قات اره وعلى الحذف رأوقولهسم على وجهه رأوة الحق اذا
  عرفت الحق فيه قبل أن تخبره وأريتسه الشئفرآه وأصله أرأيته وارتا هافتعل من الرأى
  والتدبير وأرأت الشاة اذا عظم ضرعهاقبل ولادها فهى مرءوفلان حراء وقوم مر وان
  و والاسم الرئاء يقال فعل ذلك رئًا وسمعة ويقال أيضاقوم رتاء أى يقابل بعضهم بعضا
  وكذلك بيوتم-م وئا وزاءى الهعان رأى بعضهم بعضا وتقول فلان يتراءى أى ينظر
  لى وجهه فى المرآة أوفى السيف وترادى لهشئ من الجنّ والاثنين تراءياوللجمع تراءوا وقال
  أبو زيد بميز ما أرينك أى اعجل وكن كاتى أنظر اليك وتة ول من الرثاه يسترأى فلان كماتة ول
  يستصمق ويستعقل عن أبى عمرو والرئة السعر مههوزة وتجمع على رئيز والهاعوض من
  الماء تقول.:ه رأيته أى أصبت رئته والقرية الشىء الخفى اليسير. ن الصفرة والمكدرة تراها
  المرأة بعد الاغتسال من الحيض فأماما كان فى آيام الحيض فهوحيض وايس بترية وقوله تعالى.
  هم أحسن أثاثاوريامن همزه جعله من المنظر من رأيت وهو مارأته العين من حال حصفة
  وكسوقظاهرقسنية وأنتدأبو عبيدة لمحمد بن غير الثقفى
  أشاقتك الظعائن يوم بانوا • بذى الرئى الجيل من الاثاث
  ومن لم يم مزه فامًا أن يكون على تحمف الهمز أويكون من رويت آلوانهم وجلودهم ريا أى :
