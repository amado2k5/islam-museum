text: "… - حدثنا أبو محمد، قال: حدثنا يعقوب، قال: حدثنا خلف بن الوليد، قال: حدثنا الهزيل، عن أبي غنية، قال: قال أبو رزين: يا رسول اللّٰه ما الإيمان، قال: تؤمن بالله وملائكته وكتبه ورسله والجنة والنار والحساب والبعث والقدر خيره وشره …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 808، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بالقدر، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 808, that mentions belief in God, His angels, His books and His messengers, belief in the decree, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 808 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، تقدیر پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe, de Ibn Batta, volumen 1, pág. 808, que menciona la creencia en Dios, sus ángeles, sus libros y sus mensajeros, la creencia en el decreto divino, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 1, page 808, qui évoque la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers, la croyance au décret divin, la question de la foi et sa réponse; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
