label: { ar: "صحيح البخاري 4610 — ألبان الإبل وأبوالها", en: "Sahih al-Bukhari 4610 — camel milk and urine as treatment", ur: "صحیح بخاری 4610 — اونٹنی کا دودھ اور پیشاب", es: "Sahih al-Bukhari 4610 — Leche y orina de camella como tratamiento", fr: "Sahih al-Bukhari 4610 — le lait et l'urine de chamelle comme traitement", tr: "Sahih el-Buhari 4610 — Deve sütü ve idrarı", id: "Sahih al-Bukhari 4610 — Susu unta dan air kencing" }
text: "… فَقَالُوا قَدِ اسْتَوْخَمْنَا هَذِهِ الأَرْضَ. فَقَالَ \" هَذِهِ نَعَمٌ لَنَا تَخْرُجُ، فَاخْرُجُوا فِيهَا، فَاشْرَبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا \". فَخَرَجُوا فِيهَا فَشَرِبُوا مِنْ أَبْوَالِهَا وَأَلْبَانِهَا وَاسْتَصَحُّوا، وَمَالُوا عَلَى الرَّاعِي فَقَتَلُوهُ، وَاطَّرَدُوا النَّعَمَ، فَمَا يُسْتَبْطَأُ مِنْ هَؤُلاَءِ قَتَلُوا النَّفْسَ وَحَارَبُوا اللَّهَ وَرَسُولَهُ، وَخَوَّفُوا رَسُولَ اللَّهِ. فَقَالَ سُبْحَانَ اللَّهِ. فَقُلْتُ تَتَّهِمُنِي قَالَ حَدَّثَنَا بِهَذَا أَنَسٌ. قَالَ وَقَالَ يَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4610، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4610 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4610، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 4610 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona la leche y la orina de camella como tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4610 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne l'utilisation du lait et de l'urine de chamelle comme traitement. Le moteur de recherche médicale le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4610 numaralı hadiste deve sütü ve idrarından bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4610, menyebutkan susu unta dan air kencing. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
