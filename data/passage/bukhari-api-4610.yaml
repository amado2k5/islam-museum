text: "… فَقَالُوا قَدِ اسْتَوْخَمْنَا هَذِهِ الأَرْضَ. فَقَالَ \" هَذِهِ نَعَمٌ لَنَا تَخْرُجُ، فَاخْرُجُوا فِيهَا، فَاشْرَبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا \". فَخَرَجُوا فِيهَا فَشَرِبُوا مِنْ أَبْوَالِهَا وَأَلْبَانِهَا وَاسْتَصَحُّوا، وَمَالُوا عَلَى الرَّاعِي فَقَتَلُوهُ، وَاطَّرَدُوا النَّعَمَ، فَمَا يُسْتَبْطَأُ مِنْ هَؤُلاَءِ قَتَلُوا النَّفْسَ وَحَارَبُوا اللَّهَ وَرَسُولَهُ، وَخَوَّفُوا رَسُولَ اللَّهِ. فَقَالَ سُبْحَانَ اللَّهِ. فَقُلْتُ تَتَّهِمُنِي قَالَ حَدَّثَنَا بِهَذَا أَنَسٌ. قَالَ وَقَالَ يَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4610، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4610 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4610، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
