text: "… يَقُولُ كَانَ لاِبْنِ عَبَّاسٍ غِلْمَةٌ ثَلاَثَةٌ حَجَّامُونَ فَكَانَ اثْنَانِ مِنْهُمْ يُغِلاَّنِ عَلَيْهِ وَعَلَى أَهْلِهِ وَوَاحِدٌ يَحْجُمُهُ وَيَحْجُمُ أَهْلَهُ. قَالَ وَقَالَ ابْنُ عَبَّاسٍ قَالَ نَبِيُّ اللَّهِ \" نِعْمَ الْعَبْدُ الْحَجَّامُ يُذْهِبُ الدَّمَ وَيُخِفُّ الصُّلْبَ وَيَجْلُو عَنِ الْبَصَرِ \". وَقَالَ إِنَّ رَسُولَ اللَّهِ حِينَ عُرِجَ بِهِ مَا مَرَّ عَلَى مَلإٍ مِنَ الْمَلاَئِكَةِ إِلاَّ قَالُوا عَلَيْكَ بِالْحِجَامَةِ. وَقَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2053، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2053 (Chapters on Medicine), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2053، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
