text: "حَدَّثَنِي مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى ـ رضى الله عنه ـ قَالَ أَرْسَلَنِي أَصْحَابِي إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم أَسْأَلُهُ الْحُمْلاَنَ لَهُمْ، إِذْ هُمْ مَعَهُ فِي جَيْشِ الْعُسْرَةِ وَهْىَ غَزْوَةُ تَبُوكَ فَقُلْتُ يَا نَبِيَّ اللَّهِ، إِنَّ أَصْحَابِي أَرْسَلُونِي إِلَيْكَ لِتَحْمِلَهُمْ‏.‏ فَقَالَ ‏\"‏ وَاللَّهِ لاَ أَحْمِلُكُم …"
summary:
  ar: "في صحيح البخاري؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sahih al-Bukhari; mention of the chancery or the barid post."
  ur: "صحیح بخاری میں؛ دیوآن یا بریڈ کا ذکر."
