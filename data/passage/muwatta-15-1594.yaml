label: { ar: "الموطأ 1594 — عبد الرحمن بن القاسم عن أبيه: رجل من ثقيف ملك امرأته أمرها، فقالت أنت الطلاق، ثم قال بفيك الحجر، فحكم مروان بأنه لم يملكها إلا واحدة", en: "Muwatta 1594", es: "Muwatta 1594", fr: "Muwatta 1594", ur: "موطا 1594", tr: "El-Muvatta 1594 — Abdülrahman ibn el-Kâsım, babasının rivayetine göre: Sakif kabilesinden bir adam karısına kendisini boşama yetkisi verdi ve kadın, \"Boşandın\" dedi. Bunun üzerine adam, \"Ağzına taş girsin\" dedi. Mervan, adamın ona sadece bir kez boşanma hakkı verdiğine hükmetti.", id: "Al-Muwatta 1594 — Abd al-Rahman ibn al-Qasim, berdasarkan riwayat ayahnya: Seorang pria dari Thaqif memberi istrinya hak untuk menceraikannya, dan istrinya berkata, “Engkau diceraikan.” Kemudian pria itu berkata, “Semoga batu berada di mulutmu.” Marwan memutuskan bahwa ia hanya memberikan satu kali talak." }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أن رجلا من ثقيف ملك امرأته أمرها، فقالت أنت الطلاق، فسكت، ثم قالت أنت الطلاق، فقال بفيك الحجر، ثم قالت أنت الطلاق، فقال بفيك الحجر. فاختصما إلى مروان بن الحكم، فاستحلفه ما ملكها إلا واحدة، وردها إليه. قال عبد الرحمن فكان القاسم بن محمد يعجبه هذا القضاء. قال مالك وهذا أحسن ما سمعت في ذلك وأحبه إلي. {cite:muwatta-maruf-1997 p.63}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, o da babasından rivayet ettiğine göre, Sakif kabilesinden bir adam karısına boşanma yetkisi verdi. Kadın, \"Boşandın\" dedi, adam sustu. Sonra kadın tekrar, \"Boşandın\" dedi, adam, \"Ağzına taşlar girsin!\" dedi. Sonra kadın tekrar, \"Boşandın\" dedi, adam, \"Ağzına taşlar girsin!\" dedi. Bunun üzerine tartışmalarını Mervan ibn el-Hakam'a götürdüler. Mervan, adama sadece bir kez boşanma yetkisi verdiğine dair yemin ettirdi ve adam karısını ona geri verdi. Abdülrahman, \"El-Kâsım ibn Muhammed bu hükümden memnun kaldı\" dedi. Malik, \"Bu konuda duyduğum en iyi hüküm budur ve benim tercih ettiğim hüküm de budur\" dedi."
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, yang juga dari ayahnya, bahwa seorang pria dari Thaqif memberikan hak cerai kepada istrinya. Istrinya berkata, \"Engkau diceraikan,\" dan pria itu terdiam. Kemudian istrinya berkata lagi, \"Engkau diceraikan,\" dan pria itu berkata, \"Semoga batu ada di mulutmu!\" Lalu istrinya berkata lagi, \"Engkau diceraikan,\" dan pria itu berkata lagi, \"Semoga batu ada di mulutmu!\" Maka mereka membawa perselisihan mereka kepada Marwan ibn al-Hakam, yang menyuruh pria itu bersumpah bahwa ia hanya memberikan satu kali talak, dan pria itu mengembalikan istrinya kepadanya. Abd al-Rahman berkata, \"Al-Qasim ibn Muhammad senang dengan hukum ini.\" Malik berkata, \"Ini adalah hukum terbaik yang pernah kudengar tentang masalah ini, dan yang kusukai.\""
