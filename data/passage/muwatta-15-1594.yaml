label: { ar: "الموطأ 1594 — عبد الرحمن بن القاسم عن أبيه: رجل من ثقيف ملك امرأته أمرها، فقالت أنت الطلاق، ثم قال بفيك الحجر، فحكم مروان بأنه لم يملكها إلا واحدة", en: "Muwatta 1594" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أن رجلا من ثقيف ملك امرأته أمرها، فقالت أنت الطلاق، فسكت، ثم قالت أنت الطلاق، فقال بفيك الحجر، ثم قالت أنت الطلاق، فقال بفيك الحجر. فاختصما إلى مروان بن الحكم، فاستحلفه ما ملكها إلا واحدة، وردها إليه. قال عبد الرحمن فكان القاسم بن محمد يعجبه هذا القضاء. قال مالك وهذا أحسن ما سمعت في ذلك وأحبه إلي. {cite:muwatta-maruf-1997 p.63}"
