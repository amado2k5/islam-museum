text: "… المعلاق والفأس كان كلَّما يأتي بمعلاقٍ إلى دارِهِ تطبخُهُ امرأتُه وتُطعِمُهُ لِصديقاتِها؛ وعندَ المساءِ لا تضعُ أمامَهُ إِلَّا الخبز. فقال لها ذاتَ يوم : أيَّتُها المرأةُ إني كلَّمَا أتيْتُ بمعلاقٍ لا يحصلُ لي نصيبٌ من أكلِه، فأين تذهبينَ به؟ فقالت …"
summary:
  ar: "طبخت زوجة جحا اللحم الذي أحضره وأطعمت صديقاتها، فحبس جحا فأسه في صندوق وقال إن القطة لا تشكل خطرًا على فأس ثمنها أربعون قرشًا. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  en: "Juha's wife cooks the meat he brings and feeds her friends; Juha locks his axe in a box and says a cat is no threat to an axe worth forty piastres. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  ur: "جحا کی بیوی نے اس کا لایا ہوا گوشت پکایا اور اپنی سہیلیوں کو کھلا دیا؛ جحا نے اپنی کلہاڑی صندوق میں بند کر دی اور کہا کہ بلی چالیس قرش کی کلہاڑی کے لیے کوئی خطرہ نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  fr: "La femme de Juha cuit la viande qu'il rapporte et en nourrit ses amies ; Juha enferme sa hache dans un coffre et dit qu'un chat ne menace pas une hache qui vaut quarante piastres. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  es: "La mujer de Juha cocina la carne que él trae y se la da a sus amigas; Juha encierra su hacha en un cofre y dice que un gato no es amenaza para un hacha que vale cuarenta piastras. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
