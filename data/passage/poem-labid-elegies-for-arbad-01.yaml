text: ما أن تُعَدِّي المنونُ من أحدٍ لا والدٍ مشفقٍ ولا ولدِ
summary:
  ar: بيت من مراثي لبيد في أخيه أربد، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.404}}. ينقل ابن هشام هذه المراثي عن ابن إسحاق، ويذكر أن بعض أبياتها عن أبي عبيدة أو عن غير ابن إسحاق.
  en: 'Labid''s opening line of the elegies for his brother Arbad: death passes over no one.'
  es: "La primera frase de las elegías de Labid a su hermano Arbad: la muerte no perdona a nadie."
  fr: "Premier vers des élégies de Labid pour son frère Arbad: la mort n'épargne personne."
  ur: "لیبڈ کی اپنے بھائی ارباد کے لیے عزاداری کی ابتدائی لائن: موت کسی پر نہیں گزرتی۔"
  tr: "Wüstenfeld'in baskısında bulunan Labid'in kardeşi Arbad için yazdığı mersiyelerden bir dize {{cite:ibn-hisham-wustenfeld-1858 s.404}}. İbn Hişam bu mersiyeleri İbn İshak'tan alıntılamış ve bazı dizelerinin Ebu Ubeyde'den veya İbn İshak'tan başka birinden olduğunu belirtmiştir."
  id: "Sebuah bait dari elegi Labid untuk saudaranya Arbad, sebagaimana terdapat dalam edisi Wüstenfeld {{cite:ibn-hisham-wustenfeld-1858 p.404}}. Ibn Hisham mengutip elegi-elegi ini dari Ibn Ishaq, dan menyebutkan bahwa beberapa baitnya berasal dari Abu Ubaidah atau dari orang lain selain Ibn Ishaq."
translations:
  en:
    text: Death passes over no one, neither a caring father nor a son.
