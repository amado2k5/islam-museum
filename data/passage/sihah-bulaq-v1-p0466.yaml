text: |-
  ⁦(فصل ارام )⁩
  ١٧٥
  البعد قال الشيانى المرزيج الشديد الوت وأنشد
  ذرذا ولكن تصرهل تزى ظعنا • تحدى اساقتها بالدومرزيح
  ابن الاعرابي المرزح بالكسر انلخشب يرفع به الكرم عن الارض سخ جل أرمع بين
  الرسح وهو قليل لحم العجز والفخذين والمرأة رس)، وكل ذئب أرسع لانه خفيف الوركين وقيل
  لاهرأة من العرب ما بالنانرا كن رسدافقالت أرسحتذا نارالزحفتين ( شح رشح رشما
  أى عرق وتقول لم يرشح له بدئ اذ الم يعطه شيتا والمرشح والمرشصة ما تحت الميثرة والرشيح
  العرق عن أبى عمرو والنرشيح أن رشح الام ولدها باللبن لقليل تجعله فى فيعشيئا بعدشئ الى
  أن يقوى على المص وتقول فلان يرشح للوزارة أى يربى ويؤهل لها وترشح الفصيل اذاقوى
  على المشى قال الاصمعى اذا قوى ومشى مع أده فه وراشح وأمه مرشح فع) الرضع مثل
  الرضخ وهو كسر الحصى اوالذوى قال الشاعر بكل وأب للحصى رضح والاسم الرضح
  بالضم وهو النوى المرضوح قال كعب بن مال الانصارى وترعى الرذح والدوقا وتقول
  رضت الحصى فترضح قال جران العود
  تخطى الى الحاجرين مدلة * يكاد الحصى من وطثها يترضح
  والمرضاح الجر الدى رضح به النوى أى يدق ونوى الرضح ماندرمنه قح القاحة
  المكسب والتجارة وفى تلبية بعض أهل الجاهلية جئناك للنصاحه لم تأت للرقاحه وفلان يترقح
  اعباله أى يتكسب وزقيح المال اصلا-ه والقيام عايه تقول فلان رقاحى مال
  قال الجوث ين حلزة ١٠؟
  يترل ما رقح من عيشه * يعيث فيه همج هامج
  ( ركح، الركح بالضم ركن الجبل وناحيته والجمع دكوح وأركاح قال بوكبير
  - تى يظل كأنه متثبت بركوح أمعر ذى ريود مشرف
  والركح واركة ساحة الدار قال أبو عبيد فى قول القطامى ألارى ماغشى الاركاحا
  الاركاح الافنية والركمة قطعة. ن التريد تبقى فى الجفنة وبفئة مرتكمة أى مكتنزة بالتريد
  وأركجت اليه أى استذدت والركوح الى الشئ الركون اليه وسرج مركاح
  اذا كان يتأخر عن ظهر الفرس وكذلك الرحسل اذاتأخر عن ظهرا! عيبر (رمح الرمح
  جعه رماح وأرماح ور محه فهو رامح طغه بالرمح ورجل رامح أى ذورمح ولافعل لهمثل لابن
  وتامى وتوررامح لهرنان قال ذوالرمة
  وكاين ذعرنا من مهاة ورامح * بلاد العدى ليست له بيلاد
  والسمال الرامح نجم قدام الفحة وهو أحد السماكين سمى بذلك لكوكب بقدمه يقولون
  هور محه وليس من منازل القمر ورمحه الفرس والبغل والهأراذاضر به برجله ورمح
  الجندب اذاضرب الحصى والرماح الذى يتخذ الرمح وصنعته الرماحة والرماح يضااسم ابن
  ميادة الشاءر وكان يقال لابى براء عامر بن مالك بن جعة ربن كلاب ملاعب الاسنة فيجعله
  لييدملاعب الرماح لما جنه الى القافية فقال ربيه وهوعه
  قوما تنوحان مع الانواح • وأيناملاعب الرماح
  أباراممدر الشياح • فى السلب السودوفى الاساخ
