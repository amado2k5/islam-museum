text: "… عند أَهلها. - عبد الرزاق عن معمر عن ثور عن ميمون بن مهران قال : في حرف أُبَيّ أَن الفداء تطليقة، قال معمر : فذكرت ذلك لأيوب، فأَتينا رجلاً عنده مصحف قديم لأُبَيّ خرج من ثقة، فقرأُنا فيه، فإذا فيه …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 3401، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 3401, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 3401 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Abd al-Razzaq, volumen 1, pág. 3401, que menciona las lecturas del Corán, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 1, page 3401, mentionnant les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Abdülrazzak'ın Resimli Musannaf adlı eserinin 1. cildinin 3401. sayfasından, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları hakkında bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, halaman 3401, yang membahas bacaan Al-Quran, penyusunan Al-Quran, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
