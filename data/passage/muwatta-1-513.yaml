label: { ar: "الموطأ 513 — دعاء الاستسقاء: اللهم اسق عبادك وبهيمتك", en: "Muwatta 513" }
text: "اللهم اسق عبادك وبهيمتك، وانشر رحمتك، وأحي بلدك الميت"
summary:
  ar: "أول حديث في باب ما جاء في الاستسقاء. يرويه يحيى عن مالك عن يحيى بن سعيد عن عمرو بن شعيب مرسلاً: كان النبي إذا استسقى قال: اللهم اسق عبادك وبهيمتك، وانشر رحمتك، وأحي بلدك الميت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن مالكاً رواه مرسلاً وتابعه المعتمر بن سليمان وعبد العزيز بن مسلم القسملي، ورواه جماعة عن يحيى بن سعيد عن عمرو بن شعيب عن أبيه عن جده مسنداً منهم حفص بن غياث والثوري وعبد الرحيم بن سليمان وسلام أبو المنذر (التمهيد 23/432)؛ ويذكر أن أبا داود (1176) أخرج رواية الثوري الموصولة والبيهقي رواية عبد الرحيم، وأن أبا حاتم الرازي رجح الرواية المرسلة، ويرى المحقق أنه كما قال. {cite:muwatta-maruf-1997 p.265}"
