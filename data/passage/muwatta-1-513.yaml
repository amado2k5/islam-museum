text: "اللهم اسق عبادك وبهيمتك، وانشر رحمتك، وأحي بلدك الميت"
summary:
  ar: "أول حديث في باب ما جاء في الاستسقاء. يرويه يحيى عن مالك عن يحيى بن سعيد عن عمرو بن شعيب مرسلاً: كان النبي إذا استسقى قال: اللهم اسق عبادك وبهيمتك، وانشر رحمتك، وأحي بلدك الميت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن مالكاً رواه مرسلاً وتابعه المعتمر بن سليمان وعبد العزيز بن مسلم القسملي، ورواه جماعة عن يحيى بن سعيد عن عمرو بن شعيب عن أبيه عن جده مسنداً منهم حفص بن غياث والثوري وعبد الرحيم بن سليمان وسلام أبو المنذر ⁦(التمهيد 23/432)⁩؛ ويذكر أن أبا داود (1176) أخرج رواية الثوري الموصولة والبيهقي رواية عبد الرحيم، وأن أبا حاتم الرازي رجح الرواية المرسلة، ويرى المحقق أنه كما قال. {cite:muwatta-maruf-1997 p.265}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang telah diriwayatkan mengenai memohon hujan. Diriwayatkan oleh Yahya dari Malik, dari Yahya ibn Sa'id, dari 'Amr ibn Shu'ayb, sebagai hadits mursal: Ketika Nabi (shalawat dan salam kepadanya) memohon hujan, beliau mengucapkan: \"Ya Allah, berilah air kepada hamba-hamba-Mu dan hewan-hewan-Mu, sebarkanlah rahmat-Mu, dan hidupkanlah kembali tanah-Mu yang mati.\" Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan mengutip Ibn 'Abd al-Barr yang mengatakan bahwa Malik meriwayatkannya sebagai hadits mursal, dan bahwa al-Mu'tamir ibn Sulayman dan 'Abd al-'Aziz ibn Muslim al-Qasmli mengikutinya dalam hal ini. Sekelompok perawi meriwayatkan hadits ini berdasarkan riwayat Yahya ibn Sa'id, riwayat 'Amr ibn Shu'ayb, riwayat ayahnya, riwayat kakeknya, dengan hadits musnad, termasuk Hafs ibn Ghiyath, al-Thawri, 'Abd al-Rahim ibn Sulayman, dan Salam Abu al-Mundhir (al-Tamhid 23/432). Ia menyebutkan bahwa Abu Dawud (1176) memasukkan riwayat al-Thawri yang terhubung, dan al-Bayhaqi memasukkan riwayat 'Abd al-Rahim, dan bahwa Abu Hatim al-Razi lebih menyukai riwayat mursal. Editor berpendapat bahwa ini benar. {cite:muwatta-maruf-1997 p.265}"
