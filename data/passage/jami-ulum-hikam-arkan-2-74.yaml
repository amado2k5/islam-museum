text: "… فقال رسول اللّٰه وَلِقِ : عليَّ بالرَّجُلِ، فأخذوا ليردُّوه، فلم يَروا شيئاً، فقال رسولُ اللّٰه وَالي : هذا جبريلُ جاءكم ليعلِّمَكم أمر دينكم. وخرَّجه مسلم بسياقِ أتمَّ مِنْ هذا، وفيه في خصال الإيمان : وتؤمِن بالقدر كلّه، وقال في الإحسان …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 74، يذكر الإيمان بالقدر، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 74, that mentions belief in the decree, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
