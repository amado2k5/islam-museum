text: "لى عمر بن الخطاب م فقال: يا أمير المؤمنين، إنكم تقرءون آية في كتابكم، لو علينا معشر اليهود نزلت لاتخذنا ذلك اليوم عيدا. قال: وأي آية؟ قال قوله: (اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ) فقال عمر: والله إني"
