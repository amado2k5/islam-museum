label: { ar: "الموطأ 970 — ابن عمر: المرأة الحائض التي تهل بالحج أو العمرة تهل بحجها أو عمرتها إذا أرادت، ولكن لا تطوف بالبيت ولا بين الصفا والمروة، وتشهد المناسك كلها، ولا تقرب المسجد حتى تطهر", en: "Muwatta 970" }
text: "تهل بحجها أو عمرتها إذا أرادت، ولكن لا تطوف بالبيت ولا بين الصفا والمروة، وتشهد المناسك كلها، ولا تقرب المسجد حتى تطهر"
summary:
  ar: "أول حديث في باب ما تفعل الحائض في الحج. يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: المرأة الحائض التي تهل بالحج أو العمرة تهل بحجها أو عمرتها إذا أرادت، ولكن لا تطوف بالبيت ولا بين الصفا والمروة، وهي تشهد المناسك كلها مع الناس، ولا تقرب المسجد حتى تطهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1102) ومحمد بن الحسن الشيباني (464). {cite:muwatta-maruf-1997 p.460}"
