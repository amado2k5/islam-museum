label: { ar: "الموطأ 970 — ابن عمر: المرأة الحائض التي تهل بالحج أو العمرة تهل بحجها أو عمرتها إذا أرادت، ولكن لا تطوف بالبيت ولا بين الصفا والمروة، وتشهد المناسك كلها، ولا تقرب المسجد حتى تطهر", en: "Muwatta 970", es: "Muwatta 970", fr: "Muwatta 970", ur: "موطا 970", tr: "Al-Muwatta 970 — İbn Umar: Adet gören bir kadın Hac veya Umre yapmaya niyetlenirse bunu dilerse yapabilir, ancak Kâbe etrafında tavaf yapmamalı veya Safa ile Merve arasında Sa'i çekmemelidir. Tüm ritüelleri izleyebilir, ancak temizlenene kadar camiye yaklaşmamalıdır.", id: "Al-Muwatta 970 — Ibn Umar: Seorang wanita yang sedang haid dan berniat melaksanakan haji atau umrah boleh melakukannya jika ia mau, tetapi ia tidak boleh melakukan tawaf mengelilingi Ka'bah atau Sa'i antara Safa dan Marwa. Ia boleh menyaksikan semua ritual, tetapi ia tidak boleh mendekati masjid sampai ia suci." }
text: "تهل بحجها أو عمرتها إذا أرادت، ولكن لا تطوف بالبيت ولا بين الصفا والمروة، وتشهد المناسك كلها، ولا تقرب المسجد حتى تطهر"
summary:
  ar: "أول حديث في باب ما تفعل الحائض في الحج. يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: المرأة الحائض التي تهل بالحج أو العمرة تهل بحجها أو عمرتها إذا أرادت، ولكن لا تطوف بالبيت ولا بين الصفا والمروة، وهي تشهد المناسك كلها مع الناس، ولا تقرب المسجد حتى تطهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1102) ومحمد بن الحسن الشيباني (464). {cite:muwatta-maruf-1997 p.460}"
  tr: "Hac sırasında adetli bir kadının ne yapması gerektiğiyle ilgili bölümdeki ilk hadis. Malik'in Nafi'den rivayet ettiğine göre Abdullah ibn Umar şöyle derdi: Hac veya Umre için ihrama giren adetli bir kadın dilerse ihrama girebilir, ancak Kâbe etrafında tavaf yapmamalı veya Safa ile Merve arasında sa'i yapmamalıdır. İnsanlarla birlikte tüm ritüelleri yerine getirebilir, ancak temizlenene kadar mescide yaklaşmamalıdır. Editör, bunun Malik'ten Ebu Mus'ab (1102) ve Muhammed ibn el-Hasan el-Şeybani (464) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.460}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang harus dilakukan wanita yang sedang haid selama haji. Diriwayatkan oleh Malik dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: Seorang wanita yang sedang haid yang memasuki keadaan ihram untuk haji atau umrah boleh memasuki keadaan ihram untuk haji atau umrahnya jika ia mau, tetapi ia tidak boleh melakukan tawaf mengelilingi Ka'bah atau sa’i antara Safa dan Marwa. Ia boleh menyaksikan semua ritual bersama orang-orang, tetapi ia tidak boleh mendekati masjid sampai ia suci. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1102) dan Muhammad ibn al-Hasan al-Shaybani (464). {cite:muwatta-maruf-1997 p.460}"
