text: "… أَنَّ رَسُولَ اللَّهِ خَطَبَ النَّاسَ يَوْمَ النَّحْرِ فَقَالَ \" يَا أَيُّهَا النَّاسُ. أَىُّ يَوْمٍ هَذَا \". قَالُوا يَوْمٌ حَرَامٌ. قَالَ \" فَأَىُّ بَلَدٍ هَذَا \". قَالُوا بَلَدٌ حَرَامٌ. قَالَ \" فَأَىُّ شَهْرٍ هَذَا \". قَالُوا شَهْرٌ حَرَامٌ. قَالَ \" فَإِنَّ دِمَاءَكُمْ وَأَمْوَالَكُمْ وَأَعْرَاضَكُمْ عَلَيْكُمْ حَرَامٌ، كَحُرْمَةِ يَوْمِكُمْ هَذَا، فِي بَلَدِكُمْ هَذَا فِي شَهْرِكُمْ هَذَا \". …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1739، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1739 (Hajj (Pilgrimage)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1739، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
