text: "لهم على دينهم وأموالهم، جاء فيه : «بسم الله الرحمن الرحيم، هذا كتاب من محمد النبي (يف) بين المؤمنين والمسلمين من قريش ويثرب ومن تبعهم فلحق بهم وجاهد معهم، إنهم أمة واحدة من دون الناس، المهاجرون من قريش على ربعتهم"
