label: { ar: "الموطأ 602 — هشام بن عروة: ما رأيت أبي قط في جنازة إلا أمامها، ثم يأتي البقيع فيجلس حتى يمروا عليه", en: "Muwatta 602", es: "Muwatta 602", fr: "Muwatta 602", ur: "موطا 602", tr: "El-Muvatta 602 — Hişam ibn Urve: Babamı cenazelerde, sadece önünde gördüğümde, sonra El-Baki'ye gider ve onlar geçene kadar otururdu.", id: "Al-Muwatta 602 — Hisham ibn Urwah: Aku tidak pernah melihat ayahku di pemakaman kecuali di depannya, kemudian dia akan pergi ke Al-Baqi’ dan duduk sampai mereka lewat di depannya." }
summary:
  ar: "يرويه مالك عن هشام بن عروة، قال: ما رأيت أبي قط في جنازة إلا أمامها، ثم يأتي البقيع فيجلس حتى يمروا عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.310}"
  tr: "Malik, Hişam ibn Urve'den rivayet ederek şöyle demiştir: \"Babamı hiçbir cenazede, alayın en önünde olmadıkça görmedim. Sonra el-Baki'ye gider ve alayın geçmesini beklerken otururdu.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.310}"
  id: "Malik meriwayatkan hadits ini dari Hisham bin Urwah, yang berkata: \"Aku tidak pernah melihat ayahku di pemakaman kecuali di barisan depan. Kemudian beliau akan pergi ke al-Baqi' dan duduk sampai mereka lewat di depannya.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.310}"
