label:
  ar: "مسلم 2380 — موسى والعبد الصالح بمجمع البحرين"
  en: "Muslim 2380 — Musa and the righteous servant at the meeting of the two seas"
  ur: "مسلم 2380 — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
text: "قام موسى خطيبا في بني إسرائيل فسئل أى الناس أعلم فقال أنا أعلم . قال فعتب الله عليه إذ لم يرد العلم إليه فأوحى الله إليه أن عبدا من عبادي بمجمع البحرين هو أعلم منك قال موسى أى رب كيف …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2380: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2380: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2380: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
