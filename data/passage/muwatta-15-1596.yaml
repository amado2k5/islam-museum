label: { ar: "الموطأ 1596 — عائشة: زوجت حفصة بنت عبد الرحمن المنذر بن الزبير وعبد الرحمن غائب بالشام، فلما قدم قال مثلي يصنع هذا به، فقرت حفصة عند المنذر، ولم يكن ذلك طلاقا", en: "Muwatta 1596", es: "Muwatta 1596", fr: "Muwatta 1596", ur: "موطا 1596", tr: "El-Muvatta 1596 — Aişe: Abdülrahman Suriye'deyken Hafsa bint Abdülrahman'ı el-Mundhir ibn el-Zubayr ile evlendirdim. Abdülrahman döndüğünde, \"Benim gibi birine böyle mi davranılıyor?\" dedi. Böylece Hafsa el-Mundhir'in yanında kaldı ve bu bir boşanma değildi.", id: "Al-Muwatta 1596 — Aisyah: Aku menikahkan Hafsa binti Abd al-Rahman dengan al-Mundhir ibn al-Zubayr ketika Abd al-Rahman sedang berada di Suriah. Ketika ia kembali, ia berkata, \"Apakah seperti inilah perlakuan terhadap orang sepertiku?\" Maka Hafsa tetap bersama al-Mundhir, dan ini bukanlah perceraian." }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أن عائشة زوج النبي زوجت حفصة بنت عبد الرحمن المنذر بن الزبير، وعبد الرحمن غائب بالشام. فلما قدم عبد الرحمن قال ومثلي يصنع هذا به، ومثلي يفتات عليه، فكلمت عائشة المنذر بن الزبير، فقال المنذر فإن ذلك بيد عبد الرحمن. فقال عبد الرحمن ما كنت لأرد أمرا قضيته، فقرت حفصة عند المنذر، ولم يكن ذلك طلاقا. {cite:muwatta-maruf-1997 p.64}"
  tr: "Malik, babasından rivayet ettiğine göre, Abdülrahman ibn el-Kâsım'dan naklederek, Peygamberimizin eşi Ayşe'nin, Abdülrahman Suriye'deyken Hafsa bint Abdülrahman'ı el-Mundhir ibn el-Zubayr ile evlendirdiğini anlatır. Abdülrahman döndüğünde, \"Benim gibi birine bu mu yapılıyor? Benim rızam olmadan bana bu mu yapılıyor?\" dedi. Bunun üzerine Ayşe, el-Mundhir ibn el-Zubayr ile konuştu ve el-Mundhir, \"Bu Abdülrahman'ın elinde\" dedi. Abdülrahman, \"Aldığım bir karardan geri dönmem\" dedi. Böylece Hafsa, el-Mundhir ile evli kaldı ve bu boşanma olarak kabul edilmedi. {cite:muwatta-maruf-1997 s.64}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, dari ayahnya, bahwa Aisyah, istri Nabi, menikahkan Hafsa binti Abd al-Rahman dengan al-Mundhir ibn al-Zubayr ketika Abd al-Rahman sedang berada di Suriah. Ketika Abd al-Rahman kembali, ia berkata, \"Apakah ini dilakukan kepada orang seperti saya? Apakah ini dilakukan kepada orang seperti saya tanpa persetujuan saya?\" Maka Aisyah berbicara kepada al-Mundhir ibn al-Zubayr, dan al-Mundhir berkata, \"Itu ada di tangan Abd al-Rahman.\" Abd al-Rahman berkata, \"Saya tidak akan menarik kembali keputusan yang telah saya buat.\" Maka Hafsa tetap menikah dengan al-Mundhir, dan ini tidak dianggap sebagai perceraian. {cite:muwatta-maruf-1997 p.64}"
