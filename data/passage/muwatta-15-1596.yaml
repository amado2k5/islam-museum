label: { ar: "الموطأ 1596 — عائشة: زوجت حفصة بنت عبد الرحمن المنذر بن الزبير وعبد الرحمن غائب بالشام، فلما قدم قال مثلي يصنع هذا به، فقرت حفصة عند المنذر، ولم يكن ذلك طلاقا", en: "Muwatta 1596" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أن عائشة زوج النبي زوجت حفصة بنت عبد الرحمن المنذر بن الزبير، وعبد الرحمن غائب بالشام. فلما قدم عبد الرحمن قال ومثلي يصنع هذا به، ومثلي يفتات عليه، فكلمت عائشة المنذر بن الزبير، فقال المنذر فإن ذلك بيد عبد الرحمن. فقال عبد الرحمن ما كنت لأرد أمرا قضيته، فقرت حفصة عند المنذر، ولم يكن ذلك طلاقا. {cite:muwatta-maruf-1997 p.64}"
