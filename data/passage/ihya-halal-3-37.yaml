text: "… ظاهر بين يجده أهل بذلك المقدار كما سبق تفصيله فى كتاب الحلال والحرام. وأما الجناية على القلوب بمشافرة الناس بما يسوؤهم أو يعيبهم فى الغية فيطلب كل من تهرض له بلسانه أو آذى قلبه بفعل من أفعاله وليستحل واحدا واحدا …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 3، ص 37، يذكر الحلال، واستحلال الشيء، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 3, p. 37, that mentions the lawful, treating a thing as lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 3، ص 37 کا اقتباس جس میں حلال، کسی چیز کو حلال ٹھہرانا، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 3, pág. 37, que menciona lo lícito, tratando como lícito lo ilícito; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 3, page 37), mentionnant le licite, le fait de considérer une chose comme licite et l'illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 3. cildinin 37. sayfasından, helal olan (izin verilen) ve haram olan (yasaklanan) şeyleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 3, halaman 37, yang membahas tentang apa yang diperbolehkan (halal), kebolehan sesuatu, dan apa yang dilarang (haram); diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
