text: "… ظاهر بين يجده أهل بذلك المقدار كما سبق تفصيله فى كتاب الحلال والحرام. وأما الجناية على القلوب بمشافرة الناس بما يسوؤهم أو يعيبهم فى الغية فيطلب كل من تهرض له بلسانه أو آذى قلبه بفعل من أفعاله وليستحل واحدا واحدا …"
