label: { ar: "الموطأ 854 — مالك: أهل العلم يرون على الحامل القضاء كما قال الله تعالى، ويرون ذلك مرضاً من الأمراض مع الخوف على ولدها", en: "Muwatta 854", es: "Muwatta 854", fr: "Muwatta 854", ur: "موطا 854", tr: "El-Muvatta 854 — Malik: Alimler, Allah Teala'nın buyurduğu üzere, hamile bir kadının kaçırdığı oruçları kaza etmesi gerektiğine inanırlar ve bunu, çocuğu için duyduğu korkuyla birlikte bir hastalık olarak değerlendirirler.", id: "Al-Muwatta 854 — Malik: Para ulama meyakini bahwa wanita hamil wajib mengganti puasa yang terlewat, sebagaimana firman Allah SWT, dan mereka menganggap ini sebagai penyakit, disertai kekhawatiran akan anaknya." }
summary:
  ar: "قول لمالك: وأهل العلم يرون عليها القضاء كما قال الله عز وجل: فمن كان منكم مريضاً أو على سفر فعدة من أيام أخر [[passage/quran-2-184|البقرة 184]]، ويرون ذلك مرضاً من الأمراض مع الخوف على ولدها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (467). {cite:muwatta-maruf-1997 p.413}"
  tr: "Malik şöyle dedi: Alimler, Allah Teala'nın şu buyurduğu üzere, kadının kaçırdığı günleri kaza etmesi gerektiği görüşündedir: “Sizden kim hasta veya yolculuk halindeyse, onun kadar gün sonra kaza etmelidir.” [Bakara 2:184]. Onlar bunu, çocuğuna duyduğu korkuyla birlikte bir hastalık olarak değerlendiriyorlar. Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten (467) rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.413}"
  id: "Malik berkata: Para ulama berpendapat bahwa dia harus mengganti hari-hari yang terlewat, sebagaimana firman Allah SWT: “Maka barang siapa di antara kamu sakit atau dalam perjalanan, maka harus diganti hari-harinya sebanyak hari-hari yang terlewat itu” [Al-Baqarah 2:184]. Mereka menganggap ini sebagai penyakit, ditambah dengan kekhawatiran akan anaknya. Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkan hal ini dari Malik (467). {cite:muwatta-maruf-1997 p.413}"
