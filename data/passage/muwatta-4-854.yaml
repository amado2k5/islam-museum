summary:
  ar: "قول لمالك: وأهل العلم يرون عليها القضاء كما قال الله عز وجل: فمن كان منكم مريضاً أو على سفر فعدة من أيام أخر [[passage/quran-2-184|البقرة 184]]، ويرون ذلك مرضاً من الأمراض مع الخوف على ولدها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (467). {cite:muwatta-maruf-1997 p.413}"
