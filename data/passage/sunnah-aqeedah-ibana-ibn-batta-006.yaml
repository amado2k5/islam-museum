text: "و تعالى بلطفه بعباده، ورفقه بأهل عنايته، ومن سبقت له الرحمة في كتابه لا يخلي كل زمان من بقايا من أهل العلم، وحملة الحجة، يدعون من ضل إلى الهدى، ويذودونهم عن الردى، يصبرون منهم على الأذى، ويحيون بكتاب الله الموتى،"
