text: |-
  •.ل)*
  ٢٤١
  ومال الرجل يمول ويممال مولا ومؤولا اذاصارذامال وتموّل مثله وموه غيره وزعم قوم أن
  المول العسكبوت الواحدة مولة وأنشد( ١ *ملاى من الماهكعين الموه •ولم أسمعه عن
  ثقة هل) المهل بالتحريك التؤدة وأمهد أنظره ومهله تهيلا والاسم المه-لة بالضم
  والاستمهال الاستنظار ونه-ل فى أمره أى اتأدواتمهل انهلالا أى اعتدل وانتصب
  والاتسلال أيضاسكون وقت وروة واهم مهلا يارجل وكذلات للاثنين والمع والؤنت وهى
  موحدة بعنى أمهل فاذا قيل لأمهلا قلت لا مهل واللّه ولا تقل لامهلا والله وتقول مامهل
  والقه بمغنية عنك شبأ قال الكميت أقول داذا ماجاءمهلا وما مهل بواعظة الجهول
  رقوله تعالى يغاتوابماء كالمهل يقال هو الضاس الذاب وقال أبوعرو المهل دردى الزيت
  قال والهل أيضا القيم والصديد وفى حديث أبى بكراد فنونى فى توبى هذين فاغماهم الممهل
  التراب ميل الميل الميلان يقال مال ال يل مممم لامثل معا مع
  فى الاسم والمصدر ومال عن الحق ومال عليه فى الظلم وأمال الشذ ال والميل بالتصريك
  ما كان خلقة :قال منه رجل أميل العائق فى عنقه ميل والاميل الذى لاسيف معه على
  أفعل والاميل الذى لا يستوى على السرج قال جرير
  لم بركبوا انخيل الابعدماهرموا • فهم ثقال على أكنا فهاميل
  والميلاء من الرمل العقدة الضخمة والشجرة الكثيرة الفروع أيضا قال ذو الرقة
  ميلام من معدن الصيران قاصية • أبعارهنّ على أهدافها كتب
  ميلا مو ضعه خفض لانه من نعت أرطاة فى قوله
  فبات ضيفا الى أرطاة مرتكم • من الكثيب لهادف ومحتجب
  وتسابل فى منيته تمايلا واستماله واستمال بقلبه والتمييل بين الشيئين كالترجيح بينهما والميل
  *ن الارض منتهى مد البصر عن ابن السكيت وميسل الكهل وميل الجراحة وميل الطريق
  والفرمخ ثلاثة أميال
  سل النون ( ل أبو عبيد التألان مشى الذى كانه يتهض برأسه الى فوق
  مثل الذى يعد ووعلي حل ينهض به يقسال رجل نوّل وضبع نوَّل اذا فعات ذلات ل
  النيل السهام العرية وهى مؤتسة لا واحدلها من لفظه(وقديجعوهاعلى نبال وأنيال
  قإل الشاعر
  وكنت اذارميت ذوى سواد • بأنيال مرقن من السواد
  والنبال بالتتديد صاحب النبل قال امروالقيس ⁦(٢)⁩ • وليس بذى سيف وليس فبال
  يعنى وليس يدى نبل وكان الوجه أن ية ول وليمر بنابل مثل لا بن وتامر والنابل الذى يعمل
  الندل وكان حقه أن يكون بالتشديد والفعل النبالة بالكسر والنابل الحادق بالاهى يقال
  الان نابل وامن نابل أى حاذق واين حاذق وأنشد الاصمعى
  قوّم أفواة،او ترّصها • أسل عدوان كلها صنعا
  أى أعلهم بالنبل ويقال ما اتتيل نبله الاباخرة أى ما انقبه له وما بالى به قال يعقوب وفيها
  أربع لغات تبله ونباله ونبالته ونيالته والنبلة بالضم العطية والنبل النبالة والفضل
  وقد نبل بالضم فه ونبيل والجمع نيل باتحريك مثل كريم وكرم والنسبل أيضا الكبار قال بشر
  .٦١.
  مصاح
  حالة دلول لامح وله
