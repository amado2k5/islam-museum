text: "حَدَّثَنِي عُمَرُ بْنُ حَفْصٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا الأَعْمَشُ، حَدَّثَنَا إِبْرَاهِيمُ التَّيْمِيُّ، عَنْ أَبِيهِ، عَنْ أَبِي ذَرٍّ ـ قَالَ قُلْتُ يَا رَسُولَ اللَّهِ. أَىُّ مَسْجِدٍ وُضِعَ أَوَّلُ قَالَ \" الْمَسْجِدُ الْحَرَامُ \". قُلْتُ ثُمَّ أَىٌّ قَالَ \" ثُمَّ الْمَسْجِدُ الأَقْصَى \". قُلْتُ كَمْ كَانَ بَيْنَهُمَا قَالَ \" أَرْبَعُونَ \". ثُمَّ قَالَ \" حَيْثُمَا أَدْرَكَتْكَ الصَّلاَةُ فَصَلِّ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3425، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3425 (Prophets), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3425، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3425 (Profetas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
