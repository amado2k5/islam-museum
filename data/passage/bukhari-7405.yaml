label:
  ar: "البخاري 7405 — أنا عند ظن عبدي بي وأنا معه إذا ذكرني"
  en: "Bukhari 7405 — I am as My servant thinks of Me, and I am with him when he remembers Me"
  ur: "بخاری 7405 — میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں"
text: "يقول الله تعالى أنا عند ظن عبدي بي، وأنا معه إذا ذكرني، فإن ذكرني في نفسه ذكرته في نفسي، وإن ذكرني في ملأ ذكرته في ملأ خير منهم، وإن تقرب إلى بشبر تقربت إليه ذراعا، وإن تقرب إلى ذراعا تقربت …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7405: أنا عند ظن عبدي بي وأنا معه إذا ذكرني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7405: I am as My servant thinks of Me, and I am with him when he remembers Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7405: میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
