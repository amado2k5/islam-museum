text: "… يينه وبين قدره، وإن على من اللّٰه جنة حصيتة فاذا جاء اجالى كشف عنى، وإنه لا يحد طعم الإيمان حتى يعلم ان ما اصابه لم يكن ليخطته وما اخطأه لم يكن ليصيه؛ اخرجه أبو داود فى القدر. وأخرج البيهقى فى …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 41، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 41, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 41 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 1, pág. 41, que menciona la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi (tome 1, p. 41), évoquant la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Kandhlawi'nin Sahabelerin Biyografileri adlı eserinin resimli 1. cildinin 41. sayfasında, imanın tatlılığı ve mükemmelliğinden bahsedilmektedir; bu metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş, makine tarafından okunabilir taranmış baskıdan alınmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi para Sahabat karya Kandhlawi, jilid 1 bergambar, halaman 41, menyebutkan kemanisan dan kesempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
