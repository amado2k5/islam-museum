summary:
  ar: "القسم 28 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الخيل»، ويضم فيها النصوص من 3561 إلى 3593 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 28 of Sunan al-Nasa'i (The Book of Horses, Races and Shooting) in the division of the open hadith dataset the museum took its reports from: reports 3561 to 3593 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 28، عنوان «کتاب الخیل»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3561 تا 3593۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 28 de Sunan al-Nasa'i (El Libro de los Caballos, las Carreras y la Caza) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3561 al 3593, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan al-Nasa'i (Livre des chevaux, des courses et du tir), dans la section 3561 à 3593 de la base de données ouverte. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 28. bölümü \"Atlar Kitabı\" başlığını taşımakta olup, 3561'den 3593'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 28 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Kuda\" dan berisi teks 3561 hingga 3593, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
