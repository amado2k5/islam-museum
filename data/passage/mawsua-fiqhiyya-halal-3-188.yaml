  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation, volume 3, p. 188) mentionnant ce qui est illicite et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
