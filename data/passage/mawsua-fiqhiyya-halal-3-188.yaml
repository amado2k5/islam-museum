text: "… الحرم بفتحتين من حَرُمَ الشيء حُرْماً وحراماً وحرم حرما وحراما أي امتنع فعله. ومنه الحرام بمعنى الممنوع. والحرمة ما لا يحل انتهاكه. والحرمة أيضا المهابة، وهي اسم بمعنى الاحترام، مثل الفرقة والافتراق، والجمع حرمات. وفي الاصطلاح يطلق الحرم على أمور: …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 3، ص 188، يذكر ما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 3, p. 188, that mentions what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 3، ص 188 کا اقتباس جس میں جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
