summary:
  ar: "القسم 9 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب القبلة»، ويضم فيها النصوص من 742 إلى 776 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 9 of Sunan al-Nasa'i (The Book of the Qiblah) in the division of the open hadith dataset the museum took its reports from: reports 742 to 776 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 9، عنوان «کتاب القبلۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 742 تا 776۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 9 de Sunan al-Nasa'i (El Libro de la Qibla) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 742 a 776 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
