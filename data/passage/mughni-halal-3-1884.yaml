text: "… وَإنْ قُصَدَ أَنَّهَا مُحَرَّمَةً عَلَيْهِ بِذَلِّكَ السَّبَبِ، فَلا شَيْءَ فِيهِ. وَإِنْ أَطْلَقَ، فَلَيَسَ بِظِهَارٍ؟ لأنْهُ يَحْتَمِلُ الْخَبِّرَ عَنْ حَالهَا، وَيَحْتَيِلُ إنَّشَاءَ التَّحْرِيمِ فِيهَا بِالظَّهَارِ، فَلا يَتَعَيْنُ أَحَدُهُمَا بِغَيْرِ تَعْبِينٍ فصل من قال: الحل علي حرام أو ما أحل اللّٰه علي …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1884، يذكر ما أُحل، والحرام، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 1884, that mentions what was made lawful, the unlawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
