text: |-
  ٢٥٢٠٠
  *فصل الألث
  *⁦(أفن)⁩•
  تأذن الاميرفى الناس أى نادى فيهم يكون فى التهسدد والنهى أى تقدّم وأعلم وقوله تعالى واذ
  تأذن ربك أى أعلم واذن حرف مكافأة وجواب ان قدّمتها على الفعل المستقبل نصبته بها
  لا غيرادا قال لكقائل الليلة أزورك قلت اذن أكرمك وان أخرتها ألغيتها فقلت أكرمك
  اذن قان كان الفعل الذى بعدها فعل الحال لم تعمل لانّ الحال لا تعمل فيها الموامل الناصسبة
  واذا وقفت على اذن قلت اذا كما تقول زيداوان وسطتها وجعات الفعل بعدها معتمداعلى
  ماقبلها ألغيت أيضا كفولك أنا اذن أكرمك لانها فى عوامل الافعال مشبهة بالظن فى عوامل
  الاسماء وأن أدخات عليها -رف عطف كالوا ووالفاءقانت بالخياران شئت ألغيت وان شئت
  أعملت ⁦(ادن)⁩ الفراء الاون النشاط يقال أرن البعير بالكسر يأرن أرنا اذا مرح مرحا
  فهوأرن أى نشط أبو عروالاران تابوت خشب قال طرفة
  أمون كألواح الاران نسأتها • على لاحب كانه ظهر برجد
  قال وكانوا يحملون فيه موتاهم قال الاعشى يصف ناقته
  أثرت فى جناجن كارن الشميت عواسين فوق عوج رسال
  والاران كاس الوحشىّ والمثران مثله والجمع ما رين وقال» كانه تيس اران منبتل • أى
  منبت وأرنة الحرباء بالضم موضعه من العوداذا انتصب عليه قال ابن أحر
  وتعلل الحرباء أرنته * والاربون والاريان لغة فى العربون والعريان والعامّة تقول ربان
  سن الآسن من الماءمثل الآجن وقد أمن الماهياسن ويأسن أسونا ويقال أيضا
  أسن الماء بالكسر يأسن أسنافهو أسن وأسن الرجل أيضا اذا دخل البسئر فأصابته ريح
  منتنة من ريح البئرأ وغير ذلك فغشى عليه أودارر أه قال زهير
  قد أترك الة رن مصفرا أنامله * عيد فى الرمح مبد المائح الاسن
  ويروى الوسن وتأسن الما تغير أبوزيد تأسن على تأسنا اعقل" وأبطا أبو عمر وتأسن الرجل
  باه اذا أخذ أ خلاقه وقال اللحيانى اذانزع اليه فى الشبه بقال هو على آسان من أبيه أى
  على شمائل من أبيه أوعلى أخلاق من أبيه واحدها أسن مثل خلق وأخلاق والاسن أيضا
  واحد الآسان وهى طاقات النسع والحبل عن أبى عرو وأنشد الفرا لسعددبن زيدمناة
  ابن تيم ولقب سعد االخ-رز
  لقد كنت أهوى الناقية حقبة • فقد جعلت آسان وصل تقطع
  والا-ن أيضابقية الشحم يقال سمنت ناقته عن أنسن أى عن شهم قديم والجمع آسان وتأسن
  ءلىّ أى اعتل" ⁦(أفن)⁩ أبوزيد المأفون المأفوك والاقن بالتهريك ضعف الرأى وقد
  أفن الرجل بالكسر أفتا وأفن فهو مأفون وأفين وفى المثل ان الرقين تغطى أفن الافين وأقنه
  لله سحانه يأفنه أفناة، ومأفون والموز المافون الخشف الناءد والافن النقص والمتأفن
  المتنقص وأفن الفصيل ما فى ضرع أمّه اذاشر بدكله وأفن الحالب اذا لم يدع فى الضرع شيا
  ويقال الافن الحلب خلاف التحيين وهوأن تحليها أنى شئت من غيروقت معلوم قال المخبل
  اذا أفنت أروى عيالكْ أَفتها • وان حيذت أربى على الوطب حينها
  وأفنت الناقة بالكسرقل لبنه افهى أفنة.قصورة أبو عمروجا فافلان على اقان ذلك
