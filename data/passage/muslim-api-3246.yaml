text: "حَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا مُحَمَّدُ بْنُ بَكْرٍ، أَخْبَرَنَا ابْنُ جُرَيْجٍ، قَالَ سَمِعْتُ عَبْدَ، اللَّهِ بْنَ عُبَيْدِ بْنِ عُمَيْرٍ وَالْوَلِيدَ بْنَ عَطَاءٍ يُحَدِّثَانِ عَنِ الْحَارِثِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي رَبِيعَةَ، قَالَ عَبْدُ اللَّهِ بْنُ عُبَيْدٍ وَفَدَ الْحَارِثُ بْنُ عَبْدِ اللَّهِ عَلَى عَبْدِ الْمَلِكِ بْنِ مَرْوَانَ فِي خِلاَفَتِهِ فَقَالَ عَبْدُ الْمَلِكِ مَا أَظُنُّ أَبَا خُبَيْبٍ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3246، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3246 (The Book of Pilgrimage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 3246، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 3246 (El Libro de la Peregrinación), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
