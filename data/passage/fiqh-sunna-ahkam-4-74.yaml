text: "… من النظافة والتطهير. فعن أبي سعيد : أن النبيّ قال: وغُسْلُ الجمعة واجب على كل مُحْتَلم والسواك وأن يمسّ من الطيب ما يقدرُ عليه رواه البخاريُّ ومسلم. والمراد بالمحتلم البالغ، والمراد بالوجوب تأكيد استحبابه، بدليل ما رواه البخاري عن ابن …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 74، يرد فيه ذكر ما وجب على كل مسلم، والواجب، والوجوب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 74, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), obligation (wujub), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 74 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، وجوب، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 4, p. 74, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 4, p. 74, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 4. cildinin 74. sayfasından, her Müslüman için farz olan, zorunlu olan ve tavsiye edilen ibadetleri içeren bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ibadetler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram edilen ibadetler ve küçük günahlar hakkında bir bölüm içermektedir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 4, halaman 74, yang menyebutkan apa yang wajib bagi setiap Muslim, termasuk yang wajib, yang diharuskan, dan yang dianjurkan. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Kutipan ini mencakup bagian tentang amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
