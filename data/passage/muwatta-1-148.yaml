label: { ar: "الموطأ 148 — عائشة تُسأل عن مباشرة الحائض: لتشد إزارها على أسفلها", en: "Muwatta 148", es: "Muwatta 148", fr: "Muwatta 148", ur: "موطا 148", tr: "Al-Muwatta 148 — Aişe'ye adet gören bir kadın hakkında soru sorulur: Alt giysisini alt bedeninin üzerine sıkıca örtmelidir.", id: "Al-Muwatta 148 — Aisyah ditanya tentang seorang wanita yang sedang haid: Ia hendaknya mengencangkan pakaian bawahnya di bagian bawah tubuhnya." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما يحل للرجل من امرأته وهي حائض: أرسل عبيد الله بن عبد الله بن عمر إلى عائشة يسألها هل يباشر الرجل امرأته وهي حائض، فقالت: لتشد إزارها على أسفلها ثم يباشرها إن شاء. ويبين المحقق أن تسمية السائل عبيد الله هي رواية يحيى وقيل القعنبي، وأن سائر الموطآت والشافعي وعبد الرزاق تجعل السائل أباه عبد الله بن عمر وهو الصواب، وينقل عن البيهقي أن الأثر موقوف وقد روي مرسلاً وموصولاً عن النبي. {cite:muwatta-maruf-1997 p.103}"
  tr: "Malik'in Nafi'den rivayet ettiği, bir erkeğin karısı adetliyken onunla ne tür bir ilişkiye girmesinin caiz olduğu bölümünde yer alan bir rivayete göre: Ubeydullah ibn Abdullah ibn Ömer, Aişe'ye bir mesaj göndererek, bir erkeğin karısı adetliyken onunla cinsel ilişkiye girmesinin caiz olup olmadığını sormuştur. Aişe şöyle cevap vermiştir: \"Alt giysisini alt bedeninin üzerine bağlasın, sonra isterse onunla cinsel ilişkiye girebilir.\" Araştırmacı, soruyu soranın Ubeydullah olarak belirtilmesinin Yahya'nın rivayeti olduğunu, ayrıca bunun el-Ka'nebi'nin de rivayeti olduğunu açıklığa kavuşturmaktadır. El-Muvatta'nın diğer rivayetleri ile Şafiî ve Abdül-Razzak ise soruyu soranın babası Abdullah ibn Ömer olduğunu belirtmektedir ki bu doğru olanıdır. El-Beyhaki'den rivayet edildiğine göre bu hadis mevkuftur (bir Sahabeye isnad edilmiştir), ancak Peygamberimizden mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) ve musned (rivayet zinciri tam olan hadis) olarak da rivayet edilmiştir. {cite:muwatta-maruf-1997 s.103}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang apa yang diperbolehkan bagi seorang pria dengan istrinya saat istrinya sedang haid: Ubaydullah ibn Abdullah ibn Umar mengirim pesan kepada Aisyah menanyakan apakah seorang pria boleh berhubungan intim dengan istrinya saat istrinya sedang haid. Aisyah menjawab: “Hendaknya ia menutupi bagian bawah tubuhnya dengan pakaian bawahnya, kemudian ia boleh berhubungan intim dengannya jika ia mau.” Peneliti mengklarifikasi bahwa nama penanya yaitu Ubaydullah adalah riwayat Yahya, dan ada juga yang mengatakan bahwa itu adalah riwayat al-Qa’nabi. Versi lain dari al-Muwatta’, serta al-Shafi’i dan Abd al-Razzaq, mengaitkan penanya dengan ayahnya, Abdullah ibn Umar, yang merupakan versi yang benar. Diriwayatkan dari al-Bayhaqi bahwa riwayat ini mawquf (disaksikan oleh seorang Sahabat), tetapi juga diriwayatkan sebagai mursal (hadits dengan rantai periwayatan yang hilang) dan musnad (hadits dengan rantai periwayatan yang lengkap) dari Nabi. {cite:muwatta-maruf-1997 p.103}"
