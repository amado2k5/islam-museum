label: { ar: "الموطأ 148 — عائشة تُسأل عن مباشرة الحائض: لتشد إزارها على أسفلها", en: "Muwatta 148" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما يحل للرجل من امرأته وهي حائض: أرسل عبيد الله بن عبد الله بن عمر إلى عائشة يسألها هل يباشر الرجل امرأته وهي حائض، فقالت: لتشد إزارها على أسفلها ثم يباشرها إن شاء. ويبين المحقق أن تسمية السائل عبيد الله هي رواية يحيى وقيل القعنبي، وأن سائر الموطآت والشافعي وعبد الرزاق تجعل السائل أباه عبد الله بن عمر وهو الصواب، وينقل عن البيهقي أن الأثر موقوف وقد روي مرسلاً وموصولاً عن النبي. {cite:muwatta-maruf-1997 p.103}"
