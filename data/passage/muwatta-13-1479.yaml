label: { ar: "الموطأ 1479 — سعيد بن المسيب: أبى عمر بن الخطاب أن يورث أحدا من الأعاجم إلا من ولد في العرب", en: "Muwatta 1479", es: "Muwatta 1479", fr: "Muwatta 1479", ur: "موطا 1479", tr: "El-Muvatta 1479 — Sa'id ibn al-Musayyab: Ömer ibn al-Khattab, Arap olmayanların, Araplar arasında doğmadıkları sürece mirasçı olmalarına izin vermeyi reddetti.", id: "Al-Muwatta 1479 — Sa’id ibn al-Musayyab: Umar ibn al-Khattab menolak mengizinkan siapa pun yang bukan orang Arab untuk mewarisi kecuali mereka lahir di kalangan orang Arab." }
summary:
  ar: "يروي مالك عن الثقة عنده أنه سمع سعيد بن المسيب يقول أبى عمر بن الخطاب أن يورث أحدا من الأعاجم، إلا أحدا ولد في العرب. {cite:muwatta-maruf-1997 p.23}"
  tr: "Malik, güvenilir bir kaynağa dayanarak, Sa'id ibn al-Musayyab'ın şöyle dediğini işittiğini aktarır: Ömer ibn al-Khattab, Arap toplumunda doğmuş olanlar dışında hiçbir Arap olmayan kişinin mirasçı olmasına izin vermedi. {cite:muwatta-maruf-1997 s.23}"
  id: "Malik meriwayatkan berdasarkan sumber yang terpercaya bahwa ia mendengar Sa'id ibn al-Musayyab berkata: 'Umar ibn al-Khattab menolak untuk mengizinkan siapa pun yang bukan orang Arab untuk mewarisi, kecuali seseorang yang lahir di masyarakat Arab. {cite:muwatta-maruf-1997 p.23}"
