label: { ar: "الموطأ 410 — مالك: لا بأس بالنافلة في السفر بالليل والنهار", en: "Muwatta 410", es: "Muwatta 410", fr: "Muwatta 410", ur: "موطا 410", tr: "Al-Muwatta 410 — Malik: Yolculuk halindeyken gece gündüz nafile namaz kılmakta bir sakınca yoktur.", id: "Al-Muwatta 410 — Malik: Tidak ada salahnya melaksanakan salat sunnah saat bepergian, siang dan malam." }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب صلاة النافلة في السفر: سُئل عن النافلة في السفر فقال: لا بأس بذلك بالليل والنهار، وقد بلغه أن بعض أهل العلم كان يفعل ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.214}"
  tr: "Yahya'nın, yolculukta kılınan nafile namazlar bölümünde rivayet ettiği Malik'in bir fetvası şöyledir: Malik'e yolculukta kılınan nafile namazlar hakkında soru sorulmuş ve şöyle demiştir: \"Bunda bir sakınca yoktur, gece gündüz kılınabilir ve bazı âlimlerin de böyle yaptığını duymuştum.\" Editör, bu fetvanın Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.214}"
  id: "Fatwa Malik, diriwayatkan oleh Yahya dalam bab tentang salat sunnah saat bepergian: Beliau ditanya tentang salat sunnah saat bepergian, dan beliau berkata: Tidak ada salahnya melakukan itu, siang dan malam, dan beliau mendengar bahwa sebagian ulama biasa melakukannya. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.214}"
