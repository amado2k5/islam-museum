summary:
  ar: "فتوى لمالك يرويها يحيى في باب صلاة النافلة في السفر: سُئل عن النافلة في السفر فقال: لا بأس بذلك بالليل والنهار، وقد بلغه أن بعض أهل العلم كان يفعل ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.214}"
