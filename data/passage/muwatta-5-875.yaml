label: { ar: "الموطأ 875 — مالك: لم أسمع أحداً من أهل العلم يذكر في الاعتكاف شرطاً، وإنما الاعتكاف عمل كالصلاة والصيام والحج، وقد اعتكف رسول الله وعرف المسلمون سنة الاعتكاف", en: "Muwatta 875", es: "Muwatta 875", fr: "Muwatta 875", ur: "موطا 875", tr: "El-Muvatta 875 — Malik: Hiçbir âlimin itikaf için bir şarttan bahsettiğini duymadım. Aksine, itikaf namaz, oruç ve hac gibi bir ibadettir. Allah'ın Resulü itikaf yapmıştır ve Müslümanlar itikafın sünnetini bilmişlerdir.", id: "Al-Muwatta 875 — Malik: Aku belum pernah mendengar seorang ulama menyebutkan syarat untuk i'tikaf. Sebaliknya, i'tikaf adalah suatu amalan seperti salat, puasa, dan haji. Rasulullah SAW melakukan i'tikaf, dan umat Islam mengetahui sunnah i'tikaf." }
summary:
  ar: "قول لمالك: لم أسمع أحداً من أهل العلم يذكر في الاعتكاف شرطاً، وإنما الاعتكاف عمل من الأعمال مثل الصلاة والصيام والحج، وما كان من ذلك فريضة أو نافلة، فمن دخل فيه فإنما يعمل بما مضى من السنة، وليس له أن يحدث غير ما مضى عليه المسلمون، لا من شرط يشترطه ولا يبتدعه. وقد اعتكف رسول الله وعرف المسلمون سنة الاعتكاف. ويذكر المحقق أنه رواه عن مالك أبو مصعب (870) و(874) وسويد. {cite:muwatta-maruf-1997 p.422}"
  id: "Malik berkata: Saya belum pernah mendengar seorang ulama menyebutkan syarat untuk i'tikaf (pengasingan di masjid). Sebaliknya, i'tikaf adalah ibadah seperti salat, puasa, dan haji, baik wajib maupun sunnah. Siapa pun yang melakukannya hanya mengikuti Sunnah yang telah ditetapkan, dan dia tidak diperbolehkan untuk menambahkan sesuatu selain apa yang telah dipraktikkan oleh kaum Muslimin, baik dengan menetapkan syarat maupun menciptakan syarat baru. Rasulullah shalla Allahu alaihi wa sallam melakukan i'tikaf, dan kaum Muslimin mengetahui Sunnah i'tikaf. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (870) dan (874) dan Suwaid. {kutipan:muwatta-maruf-1997 hlm. 422}"
