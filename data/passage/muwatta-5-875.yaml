label: { ar: "الموطأ 875 — مالك: لم أسمع أحداً من أهل العلم يذكر في الاعتكاف شرطاً، وإنما الاعتكاف عمل كالصلاة والصيام والحج، وقد اعتكف رسول الله وعرف المسلمون سنة الاعتكاف", en: "Muwatta 875" }
summary:
  ar: "قول لمالك: لم أسمع أحداً من أهل العلم يذكر في الاعتكاف شرطاً، وإنما الاعتكاف عمل من الأعمال مثل الصلاة والصيام والحج، وما كان من ذلك فريضة أو نافلة، فمن دخل فيه فإنما يعمل بما مضى من السنة، وليس له أن يحدث غير ما مضى عليه المسلمون، لا من شرط يشترطه ولا يبتدعه. وقد اعتكف رسول الله وعرف المسلمون سنة الاعتكاف. ويذكر المحقق أنه رواه عن مالك أبو مصعب (870) و(874) وسويد. {cite:muwatta-maruf-1997 p.422}"
