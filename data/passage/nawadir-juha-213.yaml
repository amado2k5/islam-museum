label: { ar: "نوادر جحا الكبرى، ص 97 — «ذوو اللحى ينامون فما بالك بالطفل؟»", en: "Nawadir Juha al-Kubra, p. 97 — 'Bearded Men Sleep, So What of a Baby?'", ur: "نوادر جحا الکبریٰ، ص 97 — «داڑھی والے سو جاتے ہیں تو بچے کا کیا ذکر»", fr: "Nawadir Juha al-Kubra, p. 97 — « Les barbus s'endorment, alors un bébé ? »", es: "Nawadir Juha al-Kubra, p. 97 — «Los barbudos se duermen, ¿y un niño?»" }
text: "… ذوو اللحى ينامون فما بالك بالطفل؟ تقدمت إليه امرأته ذات ليلة وقالت له والهياج آخذ منها مأخذه: لا أدري ماذا حدث بهذا الطفل فهو لا يفترُ عن البكاء مهما عمِلْتُ له وقد عجزت، فإن كنت تعمل له حجاباً للنوم، أو …"
summary:
  ar: "اشتكت زوجة جحا من أن الطفل لا يكف عن البكاء، فطلب منها أن تأتيه بكتابه ليقرأه للطفل، فغضبت، فقال إن كتاب القدوري ينيم الملتحين كأنهم أهل الكهف، فكيف لا ينيم طفلاً. {cite:juha-nawadir-kubra-djuwaydi p. 97}"
  en: "Juha's wife complains that the baby will not stop crying, and he asks her to bring his book so that he can read it to the child. She is angry, and he says that the book of al-Quduri puts bearded men to sleep like the sleepers of the Cave, so how could it not put a baby to sleep. {cite:juha-nawadir-kubra-djuwaydi p. 97}"
  ur: "جحا کی بیوی شکایت کرتی ہے کہ بچہ رونا بند نہیں کرتا، تو جحا اس سے کہتا ہے کہ اس کی کتاب لے آئے تاکہ وہ بچے کو پڑھ کر سنائے۔ بیوی ناراض ہوتی ہے تو وہ کہتا ہے کہ قدوری کی کتاب داڑھی والوں کو اصحاب کہف کی طرح سلا دیتی ہے، پھر بچے کو کیسے نہ سلائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 97}"
  fr: "La femme de Juha se plaint que le bébé ne cesse de pleurer, et il lui demande d'apporter son livre pour le lire à l'enfant. Elle se fâche, et il dit que le livre d'al-Quduri endort les hommes barbus comme les dormeurs de la Caverne, alors comment n'endormirait-il pas un bébé. {cite:juha-nawadir-kubra-djuwaydi p. 97}"
  es: "La esposa de Juha se queja de que el bebé no deja de llorar, y él le pide que traiga su libro para leérselo al niño. Ella se enfada, y él dice que el libro de al-Quduri duerme a los hombres barbudos como a los durmientes de la Cueva, así que cómo no dormiría a un bebé. {cite:juha-nawadir-kubra-djuwaydi p. 97}"
