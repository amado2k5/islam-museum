label: { ar: "الموطأ 2047 — مالك: فيمن أعطى رجلا مائة دينار قراضا فاشترى بها سلعة، ثم سرقت المائة قبل أن يدفعها إلى رب السلعة: يلزم العامل أداء ثمنها إلى البائع، ويخير رب المال بين أن يدفع المائة إلى العامل والسلعة بينهما قراضا، أو يبرأ من السلعة فتكون للعامل وعليه ثمنها", en: "Muwatta 2047" }
summary:
  ar: "قال مالك في رجل أعطى رجلا مائة دينار قراضا، فاشترى بها سلعة، ثم ذهب ليدفع إلى رب السلعة المائة دينار، فوجدها قد سرقت. فقال رب المال: بع السلعة، فإن كان فيها فضل كان لي، وإن كان فيها نقصان كان عليك، لأنك أنت ضيعت. وقال المقارض: بل عليك وفاء حق هذا، إنما اشتريتها بمالك الذي أعطيتني. قال مالك: يلزم العامل المشتري أداء ثمنها إلى البائع، ويقال لصاحب المال: إن شئت فأد المائة الدينار إلى المقارض، والسلعة بينكما، وتكون قراضا على ما كانت عليه المائة الأولى، وإن شئت فابرأ من السلعة. فإن دفع المائة دينار إلى العامل كانت قراضا على سنة القراض الأول. وإن أبى، كانت السلعة للعامل، وكان عليه ثمنها. {cite:muwatta-maruf-1997 p.236} {cite:muwatta-maruf-1997 p.237}"
