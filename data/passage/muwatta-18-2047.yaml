label: { ar: "الموطأ 2047 — مالك: فيمن أعطى رجلا مائة دينار قراضا فاشترى بها سلعة، ثم سرقت المائة قبل أن يدفعها إلى رب السلعة: يلزم العامل أداء ثمنها إلى البائع، ويخير رب المال بين أن يدفع المائة إلى العامل والسلعة بينهما قراضا، أو يبرأ من السلعة فتكون للعامل وعليه ثمنها", en: "Muwatta 2047", es: "Muwatta 2047", fr: "Muwatta 2047", ur: "موطا 2047", tr: "El-Muvatta 2047 — Malik: Bir kimse bir adama yüz dinar borç vermiş ve adam bu borçla mal almışsa, mal sahibine teslim etmeden önce yüz dinar çalınmışsa: İşçi, malın bedelini satıcıya ödemekle yükümlüdür ve mal sahibi, yüz dinarı işçiye verip malları aralarında borç olarak paylaşmak ya da mallardan vazgeçmek arasında seçim yapabilir; bu durumda mallar işçiye ait olur ve bedelini ödemekle yükümlüdür.", id: "Al-Muwatta 2047 — Malik: Mengenai seseorang yang memberi pinjaman seratus dinar kepada seorang pria, dan pria itu membeli barang dengan uang tersebut, kemudian seratus dinar itu dicuri sebelum ia dapat mengembalikannya kepada pemilik barang: pekerja wajib membayar harganya kepada penjual, dan pemilik modal memiliki pilihan antara memberikan seratus dinar kepada pekerja dan barang-barang tersebut dibagi di antara mereka sebagai pinjaman, atau melepaskan diri dari barang-barang tersebut, dalam hal ini barang-barang tersebut menjadi milik pekerja dan ia wajib membayar harganya." }
summary:
  ar: "قال مالك في رجل أعطى رجلا مائة دينار قراضا، فاشترى بها سلعة، ثم ذهب ليدفع إلى رب السلعة المائة دينار، فوجدها قد سرقت. فقال رب المال: بع السلعة، فإن كان فيها فضل كان لي، وإن كان فيها نقصان كان عليك، لأنك أنت ضيعت. وقال المقارض: بل عليك وفاء حق هذا، إنما اشتريتها بمالك الذي أعطيتني. قال مالك: يلزم العامل المشتري أداء ثمنها إلى البائع، ويقال لصاحب المال: إن شئت فأد المائة الدينار إلى المقارض، والسلعة بينكما، وتكون قراضا على ما كانت عليه المائة الأولى، وإن شئت فابرأ من السلعة. فإن دفع المائة دينار إلى العامل كانت قراضا على سنة القراض الأول. وإن أبى، كانت السلعة للعامل، وكان عليه ثمنها. {cite:muwatta-maruf-1997 p.236} {cite:muwatta-maruf-1997 p.237}"
  tr: "Malik, bir adamın başka bir adama kâr paylaşımı (kırad) için yüz dinar borç verdiğini ve bu borçla mal aldığını, mal sahibine yüz dinarı ödemeye gittiğinde paranın çalındığını gördüğünü anlattı. Mal sahibi, \"Malları sat. Fazlası benim olsun, zararı senin olsun, çünkü zarara sen sebep oldun\" dedi. Borç alan adam, \"Aslında, bu adama borcunu ödemekle yükümlüsün, çünkü ben bu malları sadece senin verdiğin parayla aldım\" dedi. Malik şöyle dedi: \"Malları satın alan işçi, bedelini satıcıya ödemekle yükümlüdür. Mal sahibine şöyle denir: 'İstersen yüz dinarı işçiye ver, mallar aranızda kalsın ve ilk yüz dinarda olduğu gibi kâr paylaşımı olsun. Ya da istersen mallardan vazgeç.'\" Eğer işçiye yüz dinar verirse, asıl anlaşmaya göre kâr paylaşımı söz konusu olur. Vermeyi reddederse, mallar işçiye ait olur ve bedelini ödemekle yükümlüdür."
  id: "Malik berkata tentang seorang pria yang memberi pinjaman seratus dinar kepada pria lain dengan sistem bagi hasil (qirad), dan pria yang menerima pinjaman itu membeli barang dengan uang tersebut. Kemudian, ketika ia pergi untuk membayar seratus dinar kepada pemilik barang, ia mendapati bahwa uang itu telah dicuri. Pemilik modal berkata: \"Jual barang itu. Jika ada surplus, itu milikku; jika ada kerugian, itu milikmu, karena kaulah yang menyebabkan kerugian.\" Pria yang menerima pinjaman itu berkata: \"Sebaliknya, engkau berkewajiban untuk membayar haknya kepada pria ini, karena aku hanya membelinya dengan uang yang engkau berikan kepadaku.\" Malik berkata: Pekerja yang membeli barang berkewajiban untuk membayar harganya kepada penjual. Pemilik modal diberitahu: \"Jika engkau mau, berikan seratus dinar kepada pekerja, dan barang itu tetap menjadi milik kalian berdua, dan itu akan menjadi pengaturan bagi hasil seperti halnya dengan seratus dinar pertama. Atau, jika engkau mau, bebaskan dirimu dari barang tersebut.\" Jika ia memberikan seratus dinar kepada pekerja, itu akan menjadi pengaturan bagi hasil sesuai dengan kesepakatan awal. Jika ia menolak, barang-barang tersebut menjadi milik pekerja, dan ia berkewajiban untuk membayar harganya."
