label: { ar: "سنن أبي داود 2679 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 2679 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 2679 — ترکہ اور میراث", es: "Sunan Abi Dawud 2679 — lo que quedó: patrimonio y herencia", fr: "Sunan Abi Dawud 2679 — Ce qui a été laissé derrière: biens et héritage" }
text: "… تَقْتُلْ تَقْتُلْ ذَا دَمٍ وَإِنْ تُنْعِمْ تُنْعِمْ عَلَى شَاكِرٍ وَإِنْ كُنْتَ تُرِيدُ الْمَالَ فَسَلْ تُعْطَ مِنْهُ مَا شِئْتَ. فَتَرَكَهُ رَسُولُ اللَّهِ حَتَّى إِذَا كَانَ الْغَدُ ثُمَّ قَالَ لَهُ \" مَا عِنْدَكَ يَا ثُمَامَةُ \". فَأَعَادَ مِثْلَ هَذَا الْكَلاَمِ فَتَرَكَهُ رَسُولُ اللَّهِ حَتَّى كَانَ بَعْدَ الْغَدِ فَذَكَرَ مِثْلَ هَذَا فَقَالَ رَسُولُ اللَّهِ \" أَطْلِقُوا ثُمَامَةَ \". …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2679، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2679 (Jihad (Kitab Al-Jihad)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2679، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2679 (Yihad (Kitab Al-Jihad)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2679 (Jihad (Kitab Al-Jihad)), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
