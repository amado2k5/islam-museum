text: "مَن حَلفَ بِيَمينٍ، فَرَأى غَيرَها خَيْرًا مِنْها، فَلْيُكفِّرْ عَن يَمِينِهِ، وَلْيَفْعلِ الَّذِي هُو خَيْرُ"
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله قال من حلف بيمين فرأى غيرها خيرا منها، فليكفر عن يمينه، وليفعل الذي هو خير. {cite:muwatta-maruf-1997 p.613}"
