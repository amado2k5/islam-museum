label: { ar: "الموطأ 1373 — أبو هريرة عن النبي: من حلف بيمين فرأى غيرها خيرا منها فليكفر عن يمينه وليفعل الذي هو خير", en: "Muwatta 1373", es: "Muwatta 1373", fr: "Muwatta 1373", ur: "موطا 1373", tr: "El-Muvatta 1373 — Ebu Hurayra, Peygamber'den rivayetle: Kim bir yemin eder de sonra ondan daha iyisini görürse, yeminini bozup daha iyisini yapsın.", id: "Al-Muwatta 1373 — Abu Hurairah dari Nabi: Barang siapa bersumpah dan kemudian melihat sesuatu yang lebih baik darinya, maka hendaklah ia mengingkari sumpahnya dan melakukan apa yang lebih baik." }
text: "مَن حَلفَ بِيَمينٍ، فَرَأى غَيرَها خَيْرًا مِنْها، فَلْيُكفِّرْ عَن يَمِينِهِ، وَلْيَفْعلِ الَّذِي هُو خَيْرُ"
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله قال من حلف بيمين فرأى غيرها خيرا منها، فليكفر عن يمينه، وليفعل الذي هو خير. {cite:muwatta-maruf-1997 p.613}"
  tr: "Malik, Suhayl ibn Abi Salih'ten, o da babasından, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Kim bir yemin eder de sonra ondan daha iyisini görürse, yeminini bozup daha iyisini yapsın.\" {cite:muwatta-maruf-1997 s.613}"
  id: "Malik meriwayatkan dari Suhayl ibn Abi Salih, dari ayahnya, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: “Barang siapa bersumpah dan kemudian melihat sesuatu yang lebih baik darinya, maka hendaklah ia mengingkari sumpahnya dan melakukan apa yang lebih baik.” {cite:muwatta-maruf-1997 p.613}"
