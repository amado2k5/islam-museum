label: { ar: "الموطأ 1986 — يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار عن أبي رافع مولى رسول الله: استسلف النبي بكرا، فجاءت إبل من الصدقة فأمره أن يقضي الرجل، فأعطاه جملا خيارا رباعيا لأن خيار الناس أحسنهم قضاء", en: "Muwatta 1986" }
summary:
  ar: "يروي يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار عن أبي رافع مولى رسول الله أنه قال: استسلف رسول الله بكرا، فجاءته إبل من الصدقة، قال أبو رافع: فأمرني رسول الله أن أقضي الرجل بكره، فقلت: لم أجد في الإبل إلا جملا خيارا رباعيا، فقال رسول الله: أعطه إياه، فإن خيار الناس أحسنهم قضاء. {cite:muwatta-maruf-1997 p.213}"
