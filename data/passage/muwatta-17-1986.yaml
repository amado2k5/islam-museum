label: { ar: "الموطأ 1986 — يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار عن أبي رافع مولى رسول الله: استسلف النبي بكرا، فجاءت إبل من الصدقة فأمره أن يقضي الرجل، فأعطاه جملا خيارا رباعيا لأن خيار الناس أحسنهم قضاء", en: "Muwatta 1986", es: "Muwatta 1986", fr: "Muwatta 1986", ur: "موطا 1986", tr: "El-Muvatta 1986 — Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan, o da Allah Resulü'nün azatlı kölesi Ebu Rafi'den rivayetle: Peygamber genç bir deve ödünç aldı, sonra sadakadan develer geldi, bu yüzden adama borcunu ödemesini emretti ve adam ona güzel, dört yaşında bir deve verdi; çünkü insanların en hayırlısı borçlarını en iyi ödeyenlerdir.", id: "Al-Muwatta 1986 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Zayd ibn Aslam, berdasarkan riwayat Ata ibn Yasar, berdasarkan riwayat Abu Rafi’, budak yang dibebaskan oleh Rasulullah: Nabi meminjam seekor unta muda, kemudian unta-unta itu berasal dari sedekah, maka beliau memerintahkan orang itu untuk mengembalikan uangnya, dan beliau memberinya seekor unta yang bagus, berumur empat tahun karena orang yang sebaik-baiknya membayar utangnya." }
summary:
  ar: "يروي يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار عن أبي رافع مولى رسول الله أنه قال: استسلف رسول الله بكرا، فجاءته إبل من الصدقة، قال أبو رافع: فأمرني رسول الله أن أقضي الرجل بكره، فقلت: لم أجد في الإبل إلا جملا خيارا رباعيا، فقال رسول الله: أعطه إياه، فإن خيار الناس أحسنهم قضاء. {cite:muwatta-maruf-1997 p.213}"
  tr: "Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan, o da Allah Resulü'nün azatlı kölesi Ebu Rafi'den rivayet ettiğine göre şöyle buyurmuştur: Allah Resulü genç bir deve ödünç aldı ve sonra sadaka olarak kendisine develer geldi. Ebu Rafi' dedi ki: Allah Resulü bana adama genç devesiyle borcunu ödememi emretti. Ben de dedim ki: Develer arasında ancak dört yaşında, güzel bir deve bulabildim. Allah Resulü dedi ki: Ona ver, çünkü insanların en hayırlısı borçlarını en iyi ödeyenlerdir. {cite:muwatta-maruf-1997 s.213}"
  id: "Yahya meriwayatkan dari Malik, dari Zayd ibn Aslam, dari Ata ibn Yasar, dari Abu Rafi', budak yang dibebaskan oleh Rasulullah, bahwa ia berkata: Rasulullah meminjam seekor unta muda, dan kemudian unta-unta datang kepadanya dari sedekah. Abu Rafi' berkata: Rasulullah memerintahkan saya untuk mengembalikan unta muda itu kepada orang tersebut, lalu saya berkata: Saya tidak menemukan unta lain selain unta yang bagus, berumur empat tahun. Rasulullah bersabda: Berikanlah kepadanya, karena orang yang paling baik adalah orang yang paling baik dalam membayar hutang. {cite:muwatta-maruf-1997 p.213}"
