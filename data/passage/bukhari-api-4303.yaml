label: { ar: "صحيح البخاري 4303 — النسب والانتساب", en: "Sahih al-Bukhari 4303 — paternity and lineage", ur: "صحیح بخاری 4303 — نسب اور انتساب", es: "Sahih al-Bukhari 4303 — paternidad y linaje", fr: "Sahih al-Bukhari 4303 — paternité et lignée", tr: "Sahih el-Buhari 4303 — Soy ve Bağlantı", id: "Sahih al-Bukhari 4303 — Silsilah dan Afiliasi" }
text: "… \" هُوَ لَكَ، هُوَ أَخُوكَ يَا عَبْدُ بْنَ زَمْعَةَ \". مِنْ أَجْلِ أَنَّهُ وُلِدَ عَلَى فِرَاشِهِ، وَقَالَ رَسُولُ اللَّهِ \" احْتَجِبِي مِنْهُ يَا سَوْدَةُ \". لِمَا رَأَى مِنْ شَبَهِ عُتْبَةَ بْنِ أَبِي وَقَّاصٍ. قَالَ ابْنُ شِهَابٍ قَالَتْ عَائِشَةُ قَالَ رَسُولُ اللَّهِ \" الْوَلَدُ لِلْفِرَاشِ وَلِلْعَاهِرِ الْحَجَرُ \". وَقَالَ ابْنُ شِهَابٍ وَكَانَ أَبُو هُرَيْرَةَ يَصِيحُ بِذَلِكَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4303، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4303 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4303، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4303 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4303 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sahih el-Buhari'de 4303 numaralı hadis, soy ve atalardan bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4303, menyebutkan tentang garis keturunan dan leluhur. Peramban \"Kebapakan dalam Islam\" mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
