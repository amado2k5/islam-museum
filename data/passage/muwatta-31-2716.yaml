label: { ar: "الموطأ 2716 — ابن شهاب عن عروة عن عائشة: النبي يقرأ على نفسه بالمعوذات وينفث", en: "Muwatta 2716", es: "Muwatta 2716", fr: "Muwatta 2716", ur: "موطا 2716", tr: "El-Muvatta 2716 — İbn Şihab, Urve'den, o da Aişe'den rivayetle: Peygamberimiz kendi üzerine Mu'avvidhat'ı (Kur'an'ın son üç suresini) okudu ve (kendi üzerine) üfledi." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أن رسول الله كان إذا اشتكى يقرأ على نفسه بالمعوذات وينفث، فلما اشتد وجعه كانت هي تقرأ عليه وتمسح عليه بيمينه رجاء بركتها. {cite:muwatta-maruf-1997 p.531}"
  tr: "Malik, İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Aişe'den rivayet eder ki, Allah Resulü hasta olduğunda, Mu'avvidhat'ı (Kur'an'ın son üç suresini) kendi üzerine okur ve üflerdi. Hastalığı kötüleştiğinde ise, Aişe bunları onun üzerine okur ve bereketini umarak sağ eliyle onu silerdi. {cite:muwatta-maruf-1997 s.531}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Aisyah, bahwa ketika Rasulullah SAW sakit, beliau membaca Mu'awwidhat (tiga surah terakhir Al-Quran) dan meniupkan napas ke badannya. Ketika penyakitnya memburuk, Aisyah membacakan surah-surah tersebut ke badannya dan mengusapnya dengan tangan kanannya, dengan harapan mendapat keberkahannya. {cite:muwatta-maruf-1997 p.531}"
