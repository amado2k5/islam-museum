text: "يقطع التلبية حين يرى البيت"
summary:
  ar: "قول لمالك فيمن اعتمر من التنعيم: أنه يقطع التلبية حين يرى البيت. ويذكر المحقق أن في نسخة م «أحرم» بدل «اعتمر»، وأنه رواه عن مالك أبو مصعب (1123). {cite:muwatta-maruf-1997 p.461}"
  tr: "Malik, Al-Tan'im'den umre yapan biri hakkında şöyle demiştir: Kabe'yi görünce Telbiye okumayı bırakmalıdır. Editör, M el yazmasında \"umre yaptı\" yerine \"ihrama girdi\" yazdığını ve bunun Malik'ten Ebu Mus'ab (1123) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.461}"
  id: "Malik berkata mengenai seseorang yang melaksanakan Umrah dari Al-Tan'im: bahwa ia hendaknya berhenti membaca Talbiyah setelah melihat Ka'bah. Editor mencatat bahwa dalam manuskrip M, tertulis \"memasuki Ihram\" dan bukan \"melaksanakan Umrah,\" dan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1123). {cite:muwatta-maruf-1997 p.461}"
