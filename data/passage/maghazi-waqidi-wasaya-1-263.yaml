text: "… سلاحه ثم حضر مع النبيّ فأَصابه القَتْلُ، فقال رسول اللّٰه : مُخَيريق خير يهود. وقد كان مُخَيريق حين خرج إلى أُحُد قال : إن أُصبت فأَموالى لمحمّد يضعها حيث أَراه الله ! فهى عامّة صدقات النبيّ.. وكان حاطب بن أُميّة …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 263، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
