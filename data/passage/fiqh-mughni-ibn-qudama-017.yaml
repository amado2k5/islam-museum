text: "ه ما ذكرنا. قال القاسيم بن محمد: سحان الله، يقول الله تعالى في كتابه: ( والذين يترفرن منكم وبذرون أزواجا). ما هن بأزواج. فأما حديث عمروبن العاص، فضعيف. قال ابن المنذر: ضعف أحمد وأبو عبد حديث عمرو بن العاص. أبن"
