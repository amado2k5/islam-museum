text: "… صفقة يده بأن مثله فى التفسير لا يوجد؛ وآعترف له صاحب الكشاف بالكشف عن الغوامض، وقال الإمام فخر الدين هذه مفاتيح الغيب وأسرار التنزيل فارتفع الخلاف واندفع المعارض، أو أخذ فى القراءات والرسم أزرى بأبى عمرو الدانى، وعدا شأو الشاطبى"
