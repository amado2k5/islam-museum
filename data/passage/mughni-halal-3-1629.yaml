text: "… شَرْطٍ لَيْسَ فِي كِتَابِ اللهِ، فَهُوَ بَاطِلٌ، وَإِنْ كَانَ مِائَةً شَرْطٍ وَهَذَا لَيْ فِي كِتَابِ اللهِ. لأَنَّ الشَّرْعَ لا يَقْتَضِيهِ، وَقَالَ النِّبِيُّ الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ، أَلا شَرْطَا أَحَلْ حَرَاماً، أَوْ حَرْمَ حَلالا وَهَذَا يُحَرَّمُ الْحَلالَ، وَهُوَ التُزْرِيجُ وَالتَّسَرِّي وَالسَّفَرُ، وَلَأَنَ …"
