text: "الترهيب من النياحة على الميت قال ابو الاسود فقلت ماوجيت يا أمير المؤمنين قال قلت كماقال النبى موت أيما مسلم شهدله أربعة نفر بخير ادخله اللّٰه الجنة قال فقلنا وثلاثة فقال وثلاثة فقلنا واثنان قال واثنان ثم لم تسأله عن …"
summary:
  ar: "مقطع من الترغيب والترهيب من الحديث الشريف، المجلد المصوَّر 2، ص 487، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), scan volume 2, p. 487, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الترغیب والترہیب من الحدیث الشریف، اسکین جلد 2، ص 487 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
