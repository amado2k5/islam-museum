text: لا تأخذني بأقوال الوشاةِ ولم أُذنب ولو كثُرت في الأقاويلُ
summary:
  ar: يطلب كعب ألا يؤاخذ بكلام الوشاة، وينفي الذنب عن نفسه كما يرويه ابن هشام {{cite:ibn-hisham-wustenfeld-1858 p.891}}.
  en: Ka'b asks not to be held to the words of slanderers, and says he has not offended, however much is said.
