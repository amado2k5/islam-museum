text: لا تأخذني بأقوال الوشاةِ ولم أُذنب ولو كثُرت في الأقاويلُ
summary:
  ar: يطلب كعب ألا يؤاخذ بكلام الوشاة، وينفي الذنب عن نفسه كما يرويه ابن هشام {{cite:ibn-hisham-wustenfeld-1858 p.891}}.
  en: Ka'b asks not to be held to the words of slanderers, and says he has not offended, however much is said.
  es: "Ka'b pide que no se le tome en cuenta las palabras de los calumniadores y afirma que no ha ofendido a nadie, por mucho que se diga."
  fr: "Ka'b demande à ne pas être tenu responsable des propos calomniateurs et affirme n'avoir offensé personne, quoi qu'on dise."
  ur: "کعب نے غیبت کرنے والوں کی باتوں کو برداشت نہ کرنے کی درخواست کی، اور کہا کہ اس نے ناراض نہیں کیا، چاہے بہت کچھ کہا جائے۔"
  tr: "İbn Hişam'ın rivayetine göre Ka'b, muhbirlerin sözlerinden sorumlu tutulmamayı talep eder ve kendi suçunu da reddeder. {{cite:ibn-hisham-wustenfeld-1858 s.891}}"
  id: "Ka’b meminta agar ia tidak dimintai pertanggungjawaban atas ucapan para informan, dan menyangkal kesalahannya sendiri, sebagaimana diriwayatkan oleh Ibn Hisham {{cite:ibn-hisham-wustenfeld-1858 p.891}}."
translations:
  en:
    text: Do not hold me to the words of the slanderers; I have not wronged, however many the tales.
