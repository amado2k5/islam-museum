text: "… بكر، إِنَّما صَحِبْتُكَ لينفعني اللَّهُ بِكَ، فَانْصَحْنِي وَعَلَّمْنِي، قال: لو لم تَسْأَلْنِي ذلك لفعلتُ. وصية أيي بكر لرافع بن أبي رافع: قال: آمُرُك أَنْ تُوَحّد الله، ولا تُشْرِكَ به شيئاً، وأن تقيمَ الصَّلاةَ، وأَنْ تُؤتي الزكاةَ، وتصومَ رمضانَ،"
summary:
