text: "وَقَدْ رُوِيَ فِي، حَدِيثٍ عَنِ ابْنِ عُمَرَ، عَنِ النَّبِيِّ أَنَّهُ قَالَ \" مَنْ تَوَضَّأَ عَلَى طُهْرٍ كَتَبَ اللَّهُ لَهُ بِهِ عَشْرَ حَسَنَاتٍ \". قَالَ وَرَوَى هَذَا الْحَدِيثَ الإِفْرِيقِيُّ عَنْ أَبِي غُطَيْفٍ عَنِ ابْنِ عُمَرَ عَنِ النَّبِيِّ. حَدَّثَنَا بِذَلِكَ الْحُسَيْنُ بْنُ حُرَيْثٍ الْمَرْوَزِيُّ حَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ الْوَاسِطِيُّ عَنِ الإِفْرِيقِيِّ. وَهُوَ إِسْنَادٌ ضَعِيفٌ. قَالَ عَلِيُّ بْنُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 59، يذكر عدد الحسنات، وكتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 59 (The Book on Purification), that speaks of a stated number of good deeds, the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 59، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 59 (El Libro de la Purificación), que habla de un número determinado de buenas acciones y de cómo escribirlas. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o valoran una acción."
  fr: "Un récit du Jami' al-Tirmidhi, n° 59 (Le Livre de la Purification), mentionne un nombre précis de bonnes actions et leur inscription. Le Livre des Hasanat et Sayyi'at le recense parmi les textes traitant du dénombrement, de l'inscription, de l'effacement ou de la pesée des bonnes actions."
  tr: "Cami' el-Tirmizi'de yer alan 59 numaralı hadis, iyi amellerin sayısını ve kayıt altına alınmasını konu edinmektedir. Bu hadis, iyi ve kötü amellerin listesini ve bu amelleri sayan, kaydeden, silen veya tartan metinleri içermektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 59, menyebutkan tentang jumlah amal kebaikan dan pencatatan amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
