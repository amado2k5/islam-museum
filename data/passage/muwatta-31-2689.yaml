label: { ar: "الموطأ 2689 — جابر بن عبد الله: جيش أبي عبيدة يقتات تمرة تمرة ثم يأكل من حوت البحر", en: "Muwatta 2689" }
summary:
  ar: "يروي مالك عن وهب بن كيسان عن جابر بن عبد الله أنه قال: بعث رسول الله جيشا قبل الساحل، وأمّر عليهم أبا عبيدة بن الجراح، وهم ثلاث مئة، وكان فيهم. فلما كانوا ببعض الطريق فني الزاد، فجمع أبو عبيدة أزواد الجيش فكان مزودي تمر، فكان يعطيهم منه كل يوم قليلا قليلا حتى فني، ولم يصبهم إلا تمرة تمرة. ثم انتهوا إلى البحر، فإذا حوت مثل الظرب، فأكل منه الجيش ثماني عشرة ليلة. ثم أمر أبو عبيدة بضلعين من أضلاعه فنُصبا، ثم أمر براحلة فرُحلت فمرت تحتهما ولم تنصبهما. قال مالك: الظرب الجبيل. {cite:muwatta-maruf-1997 p.519} {cite:muwatta-maruf-1997 p.520}"
