label: { ar: "الموطأ 2689 — جابر بن عبد الله: جيش أبي عبيدة يقتات تمرة تمرة ثم يأكل من حوت البحر", en: "Muwatta 2689", es: "Muwatta 2689", fr: "Muwatta 2689", ur: "موطا 2689", tr: "El-Muvatta 2689 — Cabir ibn Abdullah: Ebu Ubeyde'nin ordusu önce tek tek hurmaları yer, sonra denizden balık avlardı.", id: "Al-Muwatta 2689 — Jabir ibn Abdullah: Pasukan Abu Ubaidah akan memakan kurma satu per satu, kemudian memakan ikan dari laut." }
summary:
  ar: "يروي مالك عن وهب بن كيسان عن جابر بن عبد الله أنه قال: بعث رسول الله جيشا قبل الساحل، وأمّر عليهم أبا عبيدة بن الجراح، وهم ثلاث مئة، وكان فيهم. فلما كانوا ببعض الطريق فني الزاد، فجمع أبو عبيدة أزواد الجيش فكان مزودي تمر، فكان يعطيهم منه كل يوم قليلا قليلا حتى فني، ولم يصبهم إلا تمرة تمرة. ثم انتهوا إلى البحر، فإذا حوت مثل الظرب، فأكل منه الجيش ثماني عشرة ليلة. ثم أمر أبو عبيدة بضلعين من أضلاعه فنُصبا، ثم أمر براحلة فرُحلت فمرت تحتهما ولم تنصبهما. قال مالك: الظرب الجبيل. {cite:muwatta-maruf-1997 p.519} {cite:muwatta-maruf-1997 p.520}"
  tr: "Malik, Vahb ibn Kaysan'dan, o da Cabir ibn Abdullah'tan rivayet ettiğine göre şöyle buyurmuştur: Allah Resulü, Ebu Ubeyde ibn el-Cerrah'ı komutan olarak atayarak kıyıya doğru bir ordu gönderdi. Ordu üç yüz kişiden oluşuyordu ve Ebu Ubeyde de aralarında bulunuyordu. Yola çıktıklarında erzakları tükendi. Ebu Ubeyde, ordunun erzaklarını topladı; bu erzaklar iki çuval hurmadan ibaretti. Her gün biraz hurmayı dağıttı, ta ki hepsi bitene kadar; her birine birer hurma verildi. Sonra denize ulaştılar ve orada dağ büyüklüğünde bir balık vardı. Ordu on sekiz gece boyunca bu balıktan yedi. Sonra Ebu Ubeyde, balığın iki kaburgasının dikilmesini ve bir devenin eyerlenmesini emretti. Deve, kaburgaları dikmeden altlarından geçti. Malik dedi ki: Bu dağa \"zarb\" denir. {cite:muwatta-maruf-1997 s.519} {cite:muwatta-maruf-1997 s.520}"
  id: "Malik meriwayatkan dari Wahb ibn Kaysan, dari Jabir ibn Abdullah, bahwa ia berkata: Rasulullah SAW mengutus pasukan ke arah pantai, menunjuk Abu Ubaydah ibn al-Jarrah sebagai komandan mereka. Jumlah mereka tiga ratus orang, dan ia termasuk di antara mereka. Ketika mereka berada di tengah perjalanan, bekal mereka habis. Abu Ubaydah mengumpulkan bekal pasukan, yang berjumlah dua karung kurma. Ia memberi mereka sedikit demi sedikit setiap hari sampai semuanya habis, dan masing-masing hanya menerima satu kurma setiap kali. Kemudian mereka sampai di laut, dan di sana ada ikan sebesar gunung. Pasukan itu memakan ikan tersebut selama delapan belas malam. Kemudian Abu Ubaydah memerintahkan agar dua tulang rusuk ikan itu dipasang, dan kemudian ia memerintahkan agar seekor unta dipasangi pelana. Unta itu lewat di bawah mereka tanpa memasang tulang rusuk tersebut. Malik berkata: Gunung itu disebut \"zarb.\" {kutip:muwatta-maruf-1997 hal.519} {kutip:muwatta-maruf-1997 hal.520}"
