text: "… ادفنوني في قبر قديم أوصى أهله أن يدفنوه، يوم موته في قبر قديم، قالوا: ولماذا؟ فأجابهم، إذا جاءني ملكا الموت ليسألاني، أجيبهما، أني قديم العهد في هذا القبر، وأني سئلت، ومتى نظرا إلى قبري، رأيا فيه مصداقاً لقولي فيتركاني وشأني، …"
summary:
  ar: "طلب جحا أن يُدفن في قبر قديم، حتى يجد الملكان السائلان القبر باليًا فيتركاه وشأنه. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  en: "Juha asks to be buried in an old grave so that the questioning angels will find it already worn and leave him alone. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  ur: "جحا نے کہا کہ اسے کسی پرانی قبر میں دفن کیا جائے، تاکہ سوال کرنے والے فرشتے قبر کو پہلے سے بوسیدہ پائیں اور اسے اس کے حال پر چھوڑ دیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  fr: "Juha demande à être enterré dans une vieille tombe, afin que les anges interrogateurs la trouvent déjà usée et le laissent tranquille. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  es: "Juha pide que lo entierren en una tumba vieja, para que los ángeles interrogadores la encuentren ya gastada y lo dejen en paz. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  tr: "Juha, kendisini sorguya çeken iki meleğin mezarı harap halde bulup onu yalnız bırakmaları için eski bir mezara gömülmeyi istedi. {cite:juha-nawadir-kubra-djuwaydi s. 15}"
  id: "Juha meminta untuk dimakamkan di kuburan tua, agar kedua malaikat yang menanyainya akan menemukan kuburan itu sudah rusak dan meninggalkannya sendirian. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
