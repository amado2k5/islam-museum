text: |-
  *باب اللام)•
  •⁦(قهل)⁩.
  ٢٢٧
  وفضلته اذاغلبته بالفضل والفضلة والفضالة مافضل من شئ وفضل منهشي يفضل مثل
  دخسل يدخل وفيه لغة أخرى فضل يفضل مثل حذر يهذرحكاها ابن السكيت وفيه لغة
  ثالثة حى كبة منه-مافضل بالكسر يفضل بالضم وهوشاذلا نظيره قال سيبويه هذا عند
  أصحابنااغ ايجى على لفتين قال وكذلت نعم ينعم ومت توت وكدت تسكود وتفضلت المرأة.
  فى بيتهااذا كانت فى نوب واحد كالجيعل وضحوه وذلك الثوب مفضل بكسرالميم والمرأة فضل
  بالضم مثال جنب وكذلت الرجل وانه لمسن انفضلة عن ألج زيد مثال الجلة والركبة
  ⁦( فطهل)⁩ الفطحل على وزن الهزبرز من لم يخلق الناس فيه بعد قال الجرمى سألت أبا
  عبيد ة عنه فقال الاعراب تول انه ذمن كانت الحجارة فيه رطبة وأنشد للعجاج ١
  وقد أثاناز من القطول * والصخرميتل كطين الوحل
  انك لو عمرت عمر الحسل
  وفطحل يضتح الفاءاسم رجل وقال
  أوعمرنوح زمن الفطحل
  تباعدمنى فطهل اذرأيته أمين فزاد الله ما بيننا بعدا
  والصخر متيلوٱوكطلين الوحل
  ⁦(فعل)⁩ الفعل بالفتح مصدرفعل يفعل وقرأبعضهم وأوحينا اليهم فعل الخيرات والفسعل
  كنت رهين هرم أو قتسل
  بالكسر الاسم والجمع الفعال-ثل قرح وقداح وبتروبعار والفعال بالنتح السكرم وقال هدية
  ضروبا بلهسه على عظم زوره • اذا القوم هذو اللفعال تقنعا
  والفعال أيضا مصدر مثل ذهب ذها با وكانت منه فعلة حسنة أوقبيعة وافتعل عليه كذبا
  وزورا أى اختلق وفعلت الشى فانفعل كقولك كسرته فانكسر كل لافكل على
  أفعل الرعدة ولا يبن منه فعل يقال أخذه افكل اذا ارتعد من بردأ وخوف وهو يتصرف
  فان سميت به رجلالم تصرفه فى المعرفة للتعريف ووزن الفعل وصرفته فى النكرة ⁦( لل )⁩
  الفل بالفتح واحد فلول السيف وهى كسور فى حده وسيف أفلّ بين الفلل ونضى مقلل اذا
  أصاب الجارة فحكسرته وتفلات مضار به أى تكسرت ويقال أيضاجاء فل القوم
  (٢ فسخة زيادة شطر ثالث وهو
  أى منهزموهم يستوى فيه الواحد وابهع يقال رجل فلّ وقوم فلّ وربما قالو افلول وفلال
  فاتكادنيتهاتولى
  وفلات الجيس هزمته وفله يفلد با اضم بقال فله فانفلَ أى كسره فاذكسر يقال من قل ذل"
  اه والغتمّ بالغين المههة والمثناة
  ومن أمرفل والفل بالكسر الارض التى لم تمطر ولانيات بها وقال يصف العزى وهى
  الفوقية شدة الحرّ الذى يكاد يأخذ
  شهيرة كانت تعبد
  بالنفس وقوله غير مسنقل أى غير
  وانّ التى بالجزع من إطن غخلة • ومن دانمنافل من الخير معزل
  هى تفع الثبات الحرّ المنسوب اليه
  أى خال من الخيرويروى ومن دونها أى الصتم المنصوب حول العزى وقان الراجزيصف
  وانمايننذالحز عند طلوع
  ابلا ⁦(٢ )⁩
  -رقها حض بلادفل • وغتم نجم غير مستقلّ
  يقال أفللنا أى صرنافى فل من الارض وأفل الرجل أيضا أى ذهب ماله والفليل والفليلة
  الشعرى التى فى الجوزا. قاله
  المؤافاه
  الشعر المجتمع والفليل ناب البعيراذا انتلم والفلفل بالضم حب معروف وشراب مفلفل أى
  يلذع لذع الفلفل وتغلفل قادمتا الضرع اذا اموذّت حلتاها قال ابن مقبل ٣
  اهاتو أبانيان لم يتفلف لا* والتوأبانيان قادمتا الضرع وقولهم فى القداءيافل مخففا اخماهو
  فرت على أظراب هت عشية
  محذوفمن يافلان لاعلى سبيل الترخيم ولو كان ترخيمالقالوا يافلا وربعاقي-ل ذلك فى غير
  النداء للضرورة قال أبو النجم• فى لجة أمسك فلاناءر فل• ⁦(فهل)⁩ يقال هو الضلال
