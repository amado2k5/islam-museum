label: { ar: "جامع الترمذي 617 — الأب والأبوة", en: "Jami' al-Tirmidhi 617 — the father and fatherhood", ur: "جامع ترمذی 617 — باپ اور والدیت", es: "Jami' al-Tirmidhi 617 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 617 — le père et la paternité", tr: "Cami' el-Tirmizi 617 — Baba ve Babalık", id: "Jami' al-Tirmidhi 617 — Sang Ayah dan Peran Ayah" }
text: "… عَنْ أَبِي هُرَيْرَةَ مِثْلُهُ. وَعَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ قَالَ لُعِنَ مَانِعُ الصَّدَقَةِ. وَعَنْ قَبِيصَةَ بْنِ هُلْبٍ عَنْ أَبِيهِ وَجَابِرِ بْنِ عَبْدِ اللَّهِ وَعَبْدِ اللَّهِ بْنِ مَسْعُودٍ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي ذَرٍّ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَاسْمُ أَبِي ذَرٍّ جُنْدُبُ بْنُ السَّكَنِ وَيُقَالُ ابْنُ جُنَادَةَ. حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُنِيرٍ عَنْ عُبَيْدِ اللَّهِ بْنِ مُوسَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 617، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 617 (The Book on Zakat), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 617، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 617 (El Libro del Zakat), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 617 (Le Livre de la Zakat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 617 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı bunu Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 617, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hal ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
