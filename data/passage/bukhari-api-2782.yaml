label: { ar: "صحيح البخاري 2782 — بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 2782 — dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 2782 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 2782 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sahih al-Bukhari 2782 — le respect des parents ou la désobéissance envers eux", tr: "Sahih el-Buhari 2782 — Anne babaya iyilik mi, itaatsizlik mi?", id: "Sahih al-Bukhari 2782 — Kebaikan atau ketidaktaatan kepada orang tua" }
text: "… الْعَيْزَارِ، ذَكَرَ عَنْ أَبِي عَمْرٍو الشَّيْبَانِيِّ، قَالَ قَالَ عَبْدُ اللَّهِ بْنُ مَسْعُودٍ ـ سَأَلْتُ رَسُولَ اللَّهِ قُلْتُ يَا رَسُولَ اللَّهِ أَىُّ الْعَمَلِ أَفْضَلُ قَالَ \" الصَّلاَةُ عَلَى مِيقَاتِهَا \". قُلْتُ ثُمَّ أَىٌّ. قَالَ \" ثُمَّ بِرُّ الْوَالِدَيْنِ \". قُلْتُ ثُمَّ أَىٌّ قَالَ \" الْجِهَادُ فِي سَبِيلِ اللَّهِ \". فَسَكَتُّ عَنْ رَسُولِ اللَّهِ وَلَوِ اسْتَزَدْتُهُ لَزَادَنِي."
summary:
  ar: "حديث في صحيح البخاري، رقم 2782، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2782 (Fighting for the Cause of Allah (Jihaad)), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2782، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2782 (La lucha por la causa de Alá (Yihad)), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2782 (Le Jihad), évoque le devoir envers les parents et la désobéissance à leur égard. Le site « Paternité en Islam » le répertorie avec les versets du Coran, la Sunna, la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'de 2782 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. \"İslam'da Ebeveynlik\" tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2782, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Peramban \"Kekeluargaan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
