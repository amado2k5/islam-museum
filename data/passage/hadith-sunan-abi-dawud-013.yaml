text: "وفي النهاية: هو الشعب الذي مخرجه إلى الأبطح بين مكة ومنى، وفي نسخة ((فنزلت المحصب)). (من تعليق الشيخ محي الدين عبد الحميد) . (٢) وأخرجه النسائي، وأخرجه البخاري في التاريخ الكبير في ترجمة عبد الرحمن بن طارق بالإسناد الذي خرجاه"
