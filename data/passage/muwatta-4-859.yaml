label: { ar: "الموطأ 859 — عائشة: كان رسول الله يصوم حتى نقول لا يفطر، ويفطر حتى نقول لا يصوم، وما رأيته استكمل صيام شهر قط إلا رمضان، وما رأيته في شهر أكثر صياماً منه في شعبان", en: "Muwatta 859" }
summary:
  ar: "أول حديث في باب جامع الصيام. يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي سلمة بن عبد الرحمن عن عائشة زوج النبي، أنها قالت: كان رسول الله يصوم حتى نقول لا يفطر، ويفطر حتى نقول لا يصوم، وما رأيت رسول الله استكمل صيام شهر قط إلا رمضان، وما رأيته في شهر أكثر صياماً منه في شعبان. ويذكر المحقق أنه رواه عن مالك أبو مصعب (852) والترمذي في الشمائل (307) وابن حبان، وأن البخاري ومسلم رويا نحوه من غير طريق مالك. {cite:muwatta-maruf-1997 p.415}"
