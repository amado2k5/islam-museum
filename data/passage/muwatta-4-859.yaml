label: { ar: "الموطأ 859 — عائشة: كان رسول الله يصوم حتى نقول لا يفطر، ويفطر حتى نقول لا يصوم، وما رأيته استكمل صيام شهر قط إلا رمضان، وما رأيته في شهر أكثر صياماً منه في شعبان", en: "Muwatta 859", es: "Muwatta 859", fr: "Muwatta 859", ur: "موطا 859", tr: "El-Muvatta 859 — Aişe: Allah'ın Resulü, orucunu hiç bozmaz diyeceğimiz kadar çok oruç tutardı; orucunu bozar, bir daha asla oruç tutmaz diyeceğimiz kadar çok oruç tutardı. Ramazan ayı dışında hiçbir ayda orucunu tamamladığını görmedim ve Şaban ayından daha fazla oruç tuttuğunu da hiçbir ayda görmedim.", id: "Al-Muwatta 859 — Aisyah: Rasulullah SAW biasa berpuasa hingga kami mengatakan bahwa beliau tidak pernah berbuka puasa, dan beliau juga berbuka puasa hingga kami mengatakan bahwa beliau tidak pernah berpuasa. Aku tidak pernah melihat beliau berpuasa selama sebulan penuh kecuali di bulan Ramadan, dan aku tidak pernah melihat beliau berpuasa lebih banyak di bulan mana pun selain di bulan Sya'ban." }
summary:
  ar: "أول حديث في باب جامع الصيام. يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي سلمة بن عبد الرحمن عن عائشة زوج النبي، أنها قالت: كان رسول الله يصوم حتى نقول لا يفطر، ويفطر حتى نقول لا يصوم، وما رأيت رسول الله استكمل صيام شهر قط إلا رمضان، وما رأيته في شهر أكثر صياماً منه في شعبان. ويذكر المحقق أنه رواه عن مالك أبو مصعب (852) والترمذي في الشمائل (307) وابن حبان، وأن البخاري ومسلم رويا نحوه من غير طريق مالك. {cite:muwatta-maruf-1997 p.415}"
  id: "Hadits pertama dalam bab tentang hukum-hukum puasa secara umum. Diriwayatkan oleh Malik dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Abu Salamah ibn Abd al-Rahman, dari Aisyah, istri Nabi, bahwa dia berkata: “Rasulullah shalla Allahu alaihi wa sallam biasa berpuasa hingga kami mengatakan beliau tidak pernah berbuka puasa, dan beliau juga berbuka puasa hingga kami mengatakan beliau tidak pernah berpuasa. Aku tidak pernah melihat Rasulullah shalla Allahu alaihi wa sallam menyelesaikan puasa sebulan penuh kecuali di bulan Ramadhan, dan aku tidak pernah melihat beliau berpuasa lebih banyak di bulan mana pun selain di bulan Sya'ban.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (852), al-Tirmidhi dalam al-Shama'il (307), dan Ibn Hibban, dan bahwa al-Bukhari dan Muslim meriwayatkan sesuatu yang serupa melalui sanad selain Malik. {mengutip:muwatta-maruf-1997 hal.415}"
