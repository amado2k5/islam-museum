label: { ar: "جامع الترمذي 390 — ما كرهه الفقهاء", en: "Jami' al-Tirmidhi 390 — what the jurists disliked", ur: "جامع ترمذی 390 — جسے فقہاء نے مکروہ کہا", fr: "Jami' al-Tirmidhi 390 — ce que les juristes ont réprouvé", es: "Yami' al-Tirmidhi 390 — lo que los juristas reprobaron" }
text: "… الأَسْوَدَيْنِ فِي الصَّلاَةِ الْحَيَّةُ وَالْعَقْرَبُ. قَالَ وَفِي الْبَابِ عَنِ ابْنِ عَبَّاسٍ وَأَبِي رَافِعٍ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ وَبِهِ يَقُولُ أَحْمَدُ وَإِسْحَاقُ. وَكَرِهَ بَعْضُ أَهْلِ الْعِلْمِ قَتْلَ الْحَيَّةِ وَالْعَقْرَبِ فِي الصَّلاَةِ. وَقَالَ إِبْرَاهِيمُ إِنَّ فِي الصَّلاَةِ لَشُغْلاً. وَالْقَوْلُ الأَوَّلُ أَصَحُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 390، يرد فيه ذكر ما كرهه الفقهاء. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 390 (The Book on Salat (Prayer)), whose wording mentions what the jurists disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 390، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 390, dont le texte mentionne ce que les juristes ont réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 390, cuyo texto menciona lo que los juristas reprobaron. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
