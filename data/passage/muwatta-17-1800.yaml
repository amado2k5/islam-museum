label: { ar: "الموطأ 1800 — مالك: فيمن ابتاع رقيقا في صفقة واحدة فوجد فيهم عبدا مسروقا أو عيبا، فإن كان هو وجه الرقيق أو أكثره ثمنا أو من أجله اشترى ردت الصفقة كلها، وإن كان قليلا لا يضعف الصفقة رد وحده بقدر حصته من الثمن", en: "Muwatta 1800", es: "1800 Muwatta", fr: "1800 Muwatta", ur: "1800 موطا", tr: "El-Muvatta 1800 — Malik: Tek seferde köle satın alan ve bunlar arasında çalıntı veya kusurlu bir köle bulan kimse hakkında, eğer bu kusur kölenin en belirgin özelliği, fiyatının büyük bir kısmını veya satın alma sebebi ise, tüm işlem iade edilir. Kusur küçükse ve işlemi zayıflatmıyorsa, sadece kusurlu köle, fiyattaki payına oranla iade edilir.", id: "Al-Muwatta 1800 — Malik: Mengenai seseorang yang membeli budak dalam satu transaksi dan menemukan di antara mereka budak curian atau budak yang cacat, jika cacat tersebut merupakan ciri utama budak, atau sebagian besar harga, atau alasan pembelian, maka seluruh transaksi dikembalikan. Jika cacat tersebut kecil dan tidak melemahkan transaksi, maka hanya budak yang cacat yang dikembalikan, sesuai dengan bagiannya dari harga." }
summary:
  ar: "قال مالك: الأمر عندنا فيمن ابتاع رقيقا في صفقة واحدة، فوجد في ذلك الرقيق عبدا مسروقا، أو وجد بعبد منهم عيبا: إنه ينظر فيما وجد مسروقا، أو وجد به عيبا، فإن كان هو وجه ذلك الرقيق أو أكثره ثمنا، أو من أجله اشترى، وهو الذي فيه الفضل لو سلم فيما يرى الناس، كان ذلك البيع مردودا كله. وإن كان الذي وجد مسروقا، أو وجد به العيب من ذلك الرقيق في الشيء اليسير منه، ليس هو وجه ذلك الرقيق، ولا من أجله اشتري، ولا فيه الفضل فيما يرى الناس، رد ذلك الذي وجد به العيب، أو وجد مسروقا بعينه، بقدر قيمته من الثمن الذي اشترى به أولئك الرقيق. {cite:muwatta-maruf-1997 p.137} {cite:muwatta-maruf-1997 p.138}"
  tr: "Malik şöyle dedi: Köleleri tek seferde satın alan ve daha sonra aralarında çalıntı bir köle bulan veya birinde kusur tespit eden kimse hakkında hükmümüz şudur: Çalıntı veya kusurlu bulunan köleyi inceler. Eğer bu en değerli köle ise, ya da en çok para ödediği köle ise, ya da satın aldığı ve sağlam olsaydı üstün sayılacak olan köle ise, o zaman tüm satış geçersizdir. Ancak, çalıntı veya kusurlu bulunan kölenin sadece küçük bir parçası ise ve bu en değerli köle değilse, ya da satın aldığı köle değilse, ya da üstün sayılacak olan köle değilse, o zaman kusurlu veya çalıntı bulunan köleyi, diğer köleleri satın aldığı fiyata göre değeri ölçüsünde iade eder."
  id: "Malik berkata: Hukum kami mengenai seseorang yang membeli budak dalam satu transaksi, dan kemudian menemukan di antara mereka budak curian, atau menemukan cacat pada salah satu budak, adalah bahwa ia memeriksa apa yang ditemukan sebagai barang curian atau cacat. Jika itu adalah budak yang paling berharga, atau budak yang paling mahal yang dibelinya, atau budak yang dianggap lebih unggul seandainya utuh—maka seluruh penjualan batal. Namun, jika yang ditemukan sebagai barang curian atau cacat hanyalah sebagian kecil dari budak tersebut, dan itu bukan budak yang paling berharga, bukan budak yang dibelinya, bukan budak yang dianggap lebih unggul, maka ia mengembalikan budak yang cacat atau yang ditemukan sebagai barang curian tersebut, sesuai dengan nilainya relatif terhadap harga pembelian budak-budak lainnya."
