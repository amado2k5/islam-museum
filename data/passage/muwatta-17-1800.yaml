label: { ar: "الموطأ 1800 — مالك: فيمن ابتاع رقيقا في صفقة واحدة فوجد فيهم عبدا مسروقا أو عيبا، فإن كان هو وجه الرقيق أو أكثره ثمنا أو من أجله اشترى ردت الصفقة كلها، وإن كان قليلا لا يضعف الصفقة رد وحده بقدر حصته من الثمن", en: "Muwatta 1800" }
summary:
  ar: "قال مالك: الأمر عندنا فيمن ابتاع رقيقا في صفقة واحدة، فوجد في ذلك الرقيق عبدا مسروقا، أو وجد بعبد منهم عيبا: إنه ينظر فيما وجد مسروقا، أو وجد به عيبا، فإن كان هو وجه ذلك الرقيق أو أكثره ثمنا، أو من أجله اشترى، وهو الذي فيه الفضل لو سلم فيما يرى الناس، كان ذلك البيع مردودا كله. وإن كان الذي وجد مسروقا، أو وجد به العيب من ذلك الرقيق في الشيء اليسير منه، ليس هو وجه ذلك الرقيق، ولا من أجله اشتري، ولا فيه الفضل فيما يرى الناس، رد ذلك الذي وجد به العيب، أو وجد مسروقا بعينه، بقدر قيمته من الثمن الذي اشترى به أولئك الرقيق. {cite:muwatta-maruf-1997 p.137} {cite:muwatta-maruf-1997 p.138}"
