text: "… عَبْدِ اللّٰه بْنِ مَسْعُودٍ قَالَ : قَالَ رسُولُ اللّٰه وَلِيهِ مَنْ قَدَّمَ ثَلَاثَةً لَمْ يَبْلُغُوا الحِنْثَ كانُوا لَهُ حِصْنًا حَصِينًا مِنَ النَّارِ. قَالَ أَبُو ذَرِ : قَدَّمْتُ اثْنَيْنِ. قَالَ : وَاثْنَيْنِ. فَقَالَ أُبَيُّ بْنُ كَعْبٍ سَيِّدُ الْقُرَّاءِ: قَدَّمْتُ وَاحِدًا؟ قَالَ: …"
