label: { ar: "الموطأ 532 — عاتكة بنت زيد تستأذن عمر إلى المسجد فيسكت ولا يمنعها", en: "Muwatta 532", es: "Muwatta 532", fr: "Muwatta 532", ur: "موطا 532", tr: "Al-Muwatta 532 — Atika bint Zayd, Ömer'den camiye gitmek için izin ister ve Ömer sessiz kalır, onu engellemez.", id: "Al-Muwatta 532 — Atika binti Zayd meminta izin kepada Umar untuk pergi ke masjid, dan Umar tetap diam dan tidak mencegahnya." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عاتكة بنت زيد بن عمرو بن نفيل، امرأة عمر بن الخطاب، أنها كانت تستأذن عمر في الخروج إلى المسجد فيسكت، فتقول: والله لأخرجن إلا أن تمنعني، فلا يمنعها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.274}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Ömer ibn el-Hattab'ın karısı Atika bint Zeyd ibn Amr ibn Nufeyl'den rivayet ettiğine göre, Atika mescide gitmek için Ömer'den izin isterdi ve Ömer sessiz kalırdı. Bunun üzerine Atika, \"Allah'a yemin ederim ki, bana yasaklamadığınız sürece gideceğim\" derdi ve Ömer de ona yasaklamazdı. Editör, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.274}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari 'Atika bint Zayd ibn 'Amr ibn Nufayl, istri 'Umar ibn al-Khattab, bahwa ia biasa meminta izin kepada 'Umar untuk pergi ke masjid, dan 'Umar akan diam. Kemudian ia akan berkata, \"Demi Allah, aku akan pergi kecuali jika engkau melarangku,\" dan 'Umar tidak akan melarangnya. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.274}"
