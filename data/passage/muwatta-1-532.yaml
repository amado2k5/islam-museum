label: { ar: "الموطأ 532 — عاتكة بنت زيد تستأذن عمر إلى المسجد فيسكت ولا يمنعها", en: "Muwatta 532" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عاتكة بنت زيد بن عمرو بن نفيل، امرأة عمر بن الخطاب، أنها كانت تستأذن عمر في الخروج إلى المسجد فيسكت، فتقول: والله لأخرجن إلا أن تمنعني، فلا يمنعها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.274}"
