label: { ar: "جامع الترمذي 2144 — الإيمان بالقدر، ما لا يتم الإيمان إلا به", en: "Jami' al-Tirmidhi 2144 — belief in the decree; what faith is not complete without", ur: "جامع ترمذی 2144 — تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں", es: "Jami' al-Tirmidhi 2144 — creencia en el decreto; lo que la fe no está completa sin", fr: "Jami' al-Tirmidhi 2144 — la croyance au décret; quelle foi n'est pas complète sans", tr: "Cami' el-Tirmizi 2144 — Kader inancı, onsuz inanç eksiktir.", id: "Jami' al-Tirmidhi 2144 — Kepercayaan pada takdir, yang tanpanya kepercayaan tidak lengkap" }
text: "… بْنِ مُحَمَّدٍ، عَنْ أَبِيهِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يُؤْمِنُ عَبْدٌ حَتَّى يُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ حَتَّى يَعْلَمَ أَنَّ مَا أَصَابَهُ لَمْ يَكُنْ لِيُخْطِئَهُ وَأَنَّ مَا أَخْطَأَهُ لَمْ يَكُنْ لِيُصِيبَهُ \". قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ عُبَادَةَ وَجَابِرٍ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو. وَهَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2144، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2144 (Chapters On Al-Qadar), that mentions belief in the decree, what faith is not complete without. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2144، جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2144 (Capítulos sobre Al-Qadar), menciona la creencia en el decreto divino, sin el cual la fe no está completa. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2144 (Chapitres sur Al-Qadar), mentionne la croyance au décret divin, élément essentiel à la foi. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Cami' el-Tirmizi'de yer alan 2144 numaralı hadiste, kader inancından ve kader olmadan imanın eksik kalacağından bahsedilir. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2144, menyebutkan keyakinan akan takdir dan sesuatu yang tanpanya keyakinan menjadi tidak lengkap. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
