text: |-
  ⁦(فصل الخاء)⁩
  ⁦( خر)⁩ ٣١٥
  اب بدر الفزارى وخطر الشي يسالى يخطر بالضم خطورا وأخطره اللّه يالى ⁦(خفر)⁩ الخفير
  الهيرخفرت الرجل أخفر بالكسر خفرا اذا أجرته وكذت له خفير اتنعه قال الاسمعى وكذلك
  خفرته تخفيرا وأنشدلابى جندب الهذلى يخفرنى سينى اذالم أخفر قال وتحفرت
  بفلان اذا استجرت به وسألنه أن يكون لك خفيرا وأخفرته اذانقضت عهده وغدرت به
  ويقال أيضا أخفونه اذا بعثت معه خفيرا قالد أبوا لجراح العقيلى والاسم الخفرة بالضم وهى
  الذمة يقاروقت خفرتك وكذلك الخفارة بالضم والخفارة بالكسر وانلخفر يالتحريك شدة
  لحياه تقول منه خفر بالكسر وجارية خفرة ومتخفرة ولتخفبر التشوير والحافورنيت
  عن الاصمى خار الخار مثال السكر لفول ويقال الجلبان ر خرة وخروخور
  مشل عرة وتمردمور يقال خرة صرف قال ابن الاعرابى سميت المرخر الانهاتر كت
  فاختمرت واختمارها تغيرريها ويقال سميت بذلك لمخامرتها العقل وما عذدفلان خل
  ولا خر أى خير ولاشر واتلهير الدائم الشرب للخمر والجار بقية السكر تقول منه رحل خمر
  أى فى عقب خار وقال امر ؤالقيس
  أحارين عمروكأنى خمر * ويعدوعلى المره ما يأتمر
  ويقال هو الذى خامره الداء وخرعنى الخبر أى خقى والخمور الذى به خار والحرة بالضم
  جادة صغيرة تعمل من سعف النخل وترمل بالخيوط والجرة لغة فى الغمرة شى يتطلى به لتحسين
  اللون وخرة الندذ والطيب ما يجعل فيه من الخروالدردى وخرة الهجين ما يجعل فيه من
  ظهيرة ويقال دخل فى خار الناس وخارهم اذ. فى غمار الناس وغمارهم أى فى زحتهم
  وبجاعتهم وكثرتهسم والهار للمرأة تقول منه اختمرت المرأة وانهالحسفة انكهرة وفى المشل
  ان العوان لاتعلم الجمرة والجر بالتحريك ما وار الدمن شئ يقال بوارى الصيدمن فى خر
  الوادى قال ابن السكيت خره ما واراء من جحرف أوحبل من حبال الرمل أو شجر أوشئ
  قال ومنه قولهم دخل فلان فى خار الناس أى فيما يواريه ويستره منهم ويقال للرجل
  اذا خمل صاحبه هو يدب له الضراء وعمنى له الجمر وأخرت الارض أى كثرخرها
  وأخرت الشئ أضمرته قال لبيد
  الفتك -تى أخر القوم ظنة * على بنوأم البنين الا كابر
  وخر الناس زحتهم منل خارهم ويقالى أيضا وحدت خرة الطيب أى ريحه وقد خر عنى
  فلان بالكسر يخمر خرا اذا توارى عنك ومكان خراذا كان كثير الجر والجمير والهيرة الذى
  يجمل فى العجين تقول خرت العجين اخره وأخر خراجعلت فيه الهيرة يقال عندى خبز خير
  كتيا واض ير التغلية تال خروجهلت اوخرانا التو الضرة الشاة يضراً راد ب وتما
  جسد هامثل الرخاء والمخاهرة المخالطة وخامس الرجل المكان أى لزمه ويقال للضبع خامرى
  أم عامى أى استرى واستخمر فلان فلانا أى استعبده ومنه حديثمعاذ من استخمر قوما
  أواهسم أحراراى أخذهم قهراوتام عليهم وقال محمد بن كثير هذا كلام عندنا معروف
  باليمن لا يكاد يتكام بغيره يقول الرحل أخرنى كذا وكذا أى أعطنيه هبة لى وملكنى اياه
