label: { ar: "الموطأ 1095 — مالك سئل عن الرجل يلقاه الرجل بين الصفا والمروة فيقف معه يحدثه؟ فقال: لا أحب ذلك له", en: "Muwatta 1095", es: "Muwatta 1095", fr: "Muwatta 1095", ur: "موطا 1095", tr: "El-Muvatta 1095 — Malik'e Safa ile Merve arasında başka bir adamla karşılaşan ve onunla konuşmak için duran bir adam hakkında soru soruldu. O şöyle dedi: \"Bunu onun için hoş bulmuyorum.\"", id: "Al-Muwatta 1095 — Malik ditanya tentang seorang pria yang bertemu dengan pria lain di antara Safa dan Marwa dan berhenti untuk berbicara dengannya. Dia berkata: Aku tidak menyukai hal itu untuknya." }
text: "لا أحب ذلك له"
summary:
  ar: "سئل مالك عن الرجل يلقاه الرجل بين الصفا والمروة فيقف معه يحدثه؟ فقال: لا أحب ذلك له. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1319). {cite:muwatta-maruf-1997 p.502}"
  tr: "Malik'e Safa ve Merve arasında başka bir adamla karşılaşan ve onunla konuşmak için duran bir adam hakkında soru soruldu. Malik şöyle cevap verdi: \"Bunu onun için hoş bulmuyorum.\" Araştırmacı, bunun Ebu Mus'ab'ın (1319) Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.502}"
  id: "Malik ditanya tentang seorang pria yang bertemu dengan pria lain di antara Safa dan Marwa dan berhenti untuk berbicara dengannya. Dia menjawab: Aku tidak menyukai hal itu untuknya. Peneliti menyebutkan bahwa Abu Mus'ab (1319) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.502}"
