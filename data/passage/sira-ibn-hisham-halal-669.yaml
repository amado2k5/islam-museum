text: "… اللّٰه بما هو أهلُهُ، ثم قال: أما بعد؛ فإني قائلٌ لكم اليوم مقالةً قد قُدِّرَ لي أن أَقُولَهَا، ولا أدري لعلها بين يدي أجلى، فَمَنْ عَقَلَهَا وَوَعَاهَا فليأخذْ بها حَيْثُ انتهتْ به راحلتُهُ، وَمَنْ خشي ألا يعيها فلا يحلُ لأحدٍ …"
