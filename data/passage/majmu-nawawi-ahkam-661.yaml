text: "… المروة لأنه موضع تحلله فرع يستحب لمن معه مديان واجب وتطوع أن يبدأ بذبح الواجب فرع إذا ذبح الهدى والأضحية فلم يفرق لحمه حتى تغير وأنتن قال الشافعى فى مختصر الحج أعاد، وقال فى القديم عليه قيمته الصفحة الأحكام فرع …"
summary:
  ar: "مقطع من المجموع للنووي، ص 661، يرد فيه ذكر الواجب، والمستحب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 661, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 661 کا اقتباس جس میں واجب، مستحب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 661, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 661, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Mecmu'sundan, 661. sayfada yer alan, farz, sünnet ve gönüllülük esaslarını sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, itaat amelleri, sünnet ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Majmu' karya al-Nawawi, hlm. 661, yang menyebutkan amalan wajib, amalan yang dianjurkan, dan amalan sunnah; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
