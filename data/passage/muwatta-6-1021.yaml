label: { ar: "الموطأ 1021 — مالك في الذي يقتل الصيد ثم يأكله: إنما عليه كفارة واحدة، مثل من قتله ولم يأكل منه", en: "Muwatta 1021", es: "Muwatta 1021", fr: "Muwatta 1021", ur: "موطا 1021", tr: "El-Muvatta 1021 — Malik, avladığı hayvanı yiyen kişi hakkında: Onun tek bir kefareti vardır; tıpkı avladığı hayvanı yemeyen gibi.", id: "Al-Muwatta 1021 — Malik tentang orang yang membunuh hewan buruan lalu memakannya: Ia hanya memiliki satu penebusan dosa, seperti orang yang membunuh hewan buruan tetapi tidak memakannya." }
text: "إنما عليه كفارة واحدة، مثل من قتله ولم يأكل منه"
summary:
  ar: "قول لمالك في الذي يقتل الصيد ثم يأكله: إنما عليه كفارة واحدة، مثل من قتله ولم يأكل منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1152). {cite:muwatta-maruf-1997 p.477}"
  tr: "Malik, avladığı hayvanı yiyen kişi hakkında şöyle demiştir: \"Onun da, avladığı hayvanı yemeyen kişi gibi, sadece bir kere kefaret ödemesi gerekir.\" Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab (1152) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.477}"
  id: "Malik berkata mengenai orang yang membunuh hewan buruan lalu memakannya: Ia hanya diwajibkan membayar satu tebusan, sama seperti orang yang membunuh hewan buruan tetapi tidak memakan dagingnya. Peneliti menyebutkan bahwa Abu Mus'ab (1152) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.477}"
