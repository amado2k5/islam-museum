label: { ar: "صحيح البخاري 1568 — الحلال، ما لا يحل", en: "Sahih al-Bukhari 1568 — the lawful; what is not lawful", ur: "صحیح بخاری 1568 — حلال، جو حلال نہیں", es: "Sahih al-Bukhari 1568 — Lo lícito; lo ilícito", fr: "Sahih al-Bukhari 1568 — le licite; ce qui n'est pas licite" }
text: "… وَقَدْ أَهَلُّوا بِالْحَجِّ مُفْرَدًا، فَقَالَ لَهُمْ \" أَحِلُّوا مِنْ إِحْرَامِكُمْ بِطَوَافِ الْبَيْتِ وَبَيْنَ الصَّفَا وَالْمَرْوَةِ، وَقَصِّرُوا ثُمَّ أَقِيمُوا حَلاَلاً، حَتَّى إِذَا كَانَ يَوْمُ التَّرْوِيَةِ فَأَهِلُّوا بِالْحَجِّ، وَاجْعَلُوا الَّتِي قَدِمْتُمْ بِهَا مُتْعَةً \". فَقَالُوا كَيْفَ نَجْعَلُهَا مُتْعَةً وَقَدْ سَمَّيْنَا الْحَجَّ فَقَالَ \" افْعَلُوا مَا أَمَرْتُكُمْ، فَلَوْلاَ أَنِّي سُقْتُ الْهَدْىَ لَفَعَلْتُ مِثْلَ الَّذِي أَمَرْتُكُمْ، وَلَكِنْ لاَ يَحِلُّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1568، يذكر الحلال، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1568 (Hajj (Pilgrimage)), that mentions the lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1568، جس میں حلال، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1568 (Hajj (Peregrinación)), menciona lo lícito y lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito y lo ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1568 (Hajj (Pèlerinage)), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
