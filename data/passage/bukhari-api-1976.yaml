label: { ar: "صحيح البخاري 1976 — مضاعفة الحسنة بعشر أمثالها", en: "Sahih al-Bukhari 1976 — the good deed multiplied tenfold and beyond", ur: "صحیح بخاری 1976 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "… \" فَإِنَّكَ لاَ تَسْتَطِيعُ ذَلِكَ، فَصُمْ وَأَفْطِرْ، وَقُمْ وَنَمْ، وَصُمْ مِنَ الشَّهْرِ ثَلاَثَةَ أَيَّامٍ، فَإِنَّ الْحَسَنَةَ بِعَشْرِ أَمْثَالِهَا، وَذَلِكَ مِثْلُ صِيَامِ الدَّهْرِ \". قُلْتُ إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ. قَالَ \" فَصُمْ يَوْمًا وَأَفْطِرْ يَوْمَيْنِ \". قُلْتُ إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ. قَالَ \" فَصُمْ يَوْمًا وَأَفْطِرْ يَوْمًا، فَذَلِكَ صِيَامُ دَاوُدَ ـ وَهْوَ أَفْضَلُ الصِّيَامِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1976، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1976 (Fasting), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1976، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
