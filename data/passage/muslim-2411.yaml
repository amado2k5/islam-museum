text: "قال علي: ما جمع رسول الله أبويه لأحد غير سعد بن مالك؛ إنه جعل يقول له يوم أحد: «ارمِ فداك أبي وأمي»"
summary:
  ar: "رواية علي في باب فضل سعد بن أبي وقاص من صحيح مسلم؛ لم يجمع النبي أبويه فداءً لأحد إلا لسعد يوم أحد — نص الإجلال النبوي لسعد بن أبي وقاص رامي بدر."
