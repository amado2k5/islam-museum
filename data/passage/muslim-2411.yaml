text: "قال علي: ما جمع رسول الله أبويه لأحد غير سعد بن مالك؛ إنه جعل يقول له يوم أحد: «ارمِ فداك أبي وأمي»"
summary:
  ar: "رواية علي في باب فضل سعد بن أبي وقاص من صحيح مسلم؛ لم يجمع النبي أبويه فداءً لأحد إلا لسعد يوم أحد — نص الإجلال النبوي لسعد بن أبي وقاص رامي بدر."
  tr: "Ali'nin Sahih Müslim'de Sa'd ibn Abi Waqqas'ın faziletine dair bölümde anlattığına göre: Peygamber, Uhud günü Sa'd'dan başkası için anne ve babasını fidye olarak vermedi - bu, Peygamber'in Bedir okçusu Sa'd ibn Abi Waqqas'a duyduğu saygının metnidir."
  id: "Riwayat Ali dalam bab tentang keutamaan Sa'd ibn Abi Waqqas dalam Sahih Muslim: Nabi tidak menggabungkan kedua orang tuanya sebagai tebusan untuk siapa pun kecuali Sa'd pada hari Uhud — teks penghormatan Nabi kepada Sa'd ibn Abi Waqqas, pemanah Badar."
