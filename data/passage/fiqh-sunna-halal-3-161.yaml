text: "… يحل من النساء بعد بيان ما حرم منهن، ولم يذكر أن الزنا من أسباب التحريم. - روت عائشةا، أن النبي علي سئل عن رجل زنى بإمرأة، فأراد أن يتزوجها أو ابنتها. فقال ميع : لا يحرّم الحرامُ الحلال، إنما يحرم …"
