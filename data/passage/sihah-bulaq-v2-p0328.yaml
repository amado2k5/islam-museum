text: |-
  ٢٥٩
  بث الجنودلهم فى الارض يقتلهم * ما بين بصرى الى آطام فجرانا
  والواجدة أطمة مثل أكة وباليمن -صن يعرف بأطم الاضبط وهو الاضبط بن قريع بن
  عوف بن كعب بن سعدين ز يدمغاة كان أغار على أهل صنعاء وبنى بها أطما وقال
  وشقيت نفسى من ذوي يمن • بالطعن فى اللبات والضرب
  قتلتهم وأبحت بلدتهم • وأقت حولا كاملا أسبى
  والأ عام بالذم استا الن ب من و م على الرجل قال أيبون ن بير لموم وقد
  أطم وذلكْ اذ الم يبل من داء يكون يه والاطيمة موقد النار قال الافوه
  فى موطن ذرب الشبافكأنما • فيه الرجال على الاطائم واللظى
  والاطوم السلحفاة البحرية الاصححى "فلان يتأطم على فلان مثل يتأجم قال الاصععى تأطم
  السيل اذا ارتفعت فى وجهه كالامواج ثم تكسر بعضها على بعض (أكم الاكنة
  *روفة والمع أكمات وأ كم وجمع الا كم اكام مشل جبل وجبال وجمع الا كام آكم مشل
  كاب وكتب وجمع الاكم آكام مثل عنق وأعناق كاقلناء في بمع ثمرة والمأكة الههيزة والجع
  الماكم ( ا م لالم الوجع وقد ألم يألم ألما وقولهم ألمت بطنك كقولهم رشدت أمر لتأى
  ألم بطنك ورشدأً مرك والتألم التوجع والايلام الايجاع والاليم الموجع مثل السميع بمعنى
  المسمع (امم أتم السى أصله ومكة أتم القرى والاتم الوالدة والجمع أمات وقال
  فرحت الظلام بأما نكاء وأصل الأم أمهة ولذلكْ تجمع على أمهات وقال
  أتهق خندف والياس أبى• وقال بعضهم الامهات للناس والامات للبهاثم ويقسال ما كنت
  اما ولقدأعمت أمومة وتصغيرها اميمة وأممة اسم امرأة ويقال يا أمّة لا تفعلى ويا أيذ
  افعل يجعلون علامة التأنيث عوضا من ياء الاضافة وتقف عليها بالهاء والامّ العلم الذى
  يتبعه الجيس وأم التناتف المفازة البعيدة وأم مثوال صاحبة منزلك وأمّ البيض فى شعر أبى
  وأتانا يسعى تفرّش أمّ البيض شدا وقد تعالى ألنهار
  يدالنعامة ورئيس القوم أمهم وأمّ الجوم الجرة وأم الطر يقمعظمه فى قول الشاءر
  فص به أمّ الطريق عيالها • ويقال هى الضبع وأمّ الدماغ الجلدة التى تجم.
  الدماغ ويقال أيضا أم الرأس وقوله تعالى هن أم السكاب ولم يقل امهات لانه على الحكاية
  كما يقول الرجل ليس لى معين فتقول فن معينك فتمكيه وكذلك قوله تعانى واجعاذا
  للمتقين اماما والإمة الهاعة قال الإخفش هو فى اللفظ واحد وفى المعنى جع وكل عنس
  من الحيوان أمة وفى الحديت لولا أنّ السكلاب أممن الامم لامرت بقتلها والامّة القامة
  قال الاعشى ١ * حسان الوجوه طوال الامم،والامّة الطريقة والدين يقال فلان
  لإ أمله أى لادين له ولا غلة لم قال الشاعر
  وهل يستوك دُ وأمة وكفوره وقوله تعالى كنيتم خيرأمة أخرجت للناس قال الاخفش يريد
  أهل أمة أى خيرأهل دين وأنشد للنابغة
  حلفت فلم أترككْ هفسك رية • وهل يأتمن ذوأمّة وهو طائع
  ⁦(١)⁩ فى تسفة أوّل البيت
  وانا معاوية الاكرميين
