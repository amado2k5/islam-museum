label: { ar: "سنن النسائي 5735 — التحريم", en: "Sunan al-Nasa'i 5735 — prohibition", ur: "سنن نسائی 5735 — تحریم", es: "Sunan al-Nasa'i 5735 - prohibición", fr: "Sunan al-Nasa'i 5735 - interdiction", tr: "Sünen-i Nesa'i 5735 — Yasak", id: "Sunan an-Nasa'i 5735 — Larangan" }
text: "… فَيْرُوزَ قَالَ قَدِمْتُ عَلَى رَسُولِ اللَّهِ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّا أَصْحَابُ كَرْمٍ وَقَدْ أَنْزَلَ اللَّهُ عَزَّ وَجَلَّ تَحْرِيمَ الْخَمْرِ فَمَاذَا نَصْنَعُ قَالَ \" تَتَّخِذُونَهُ زَبِيبًا \". قُلْتُ فَنَصْنَعُ بِالزَّبِيبِ مَاذَا قَالَ \" تَنْقَعُونَهُ عَلَى غَدَائِكُمْ وَتَشْرَبُونَهُ عَلَى عَشَائِكُمْ وَتَنْقَعُونَهُ عَلَى عَشَائِكُمْ وَتَشْرَبُونَهُ عَلَى غَدَائِكُمْ \". قُلْتُ أَفَلاَ نُؤَخِّرُهُ حَتَّى يَشْتَدَّ قَالَ \" لاَ تَجْعَلُوهُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 5735، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5735 (The Book of Drinks), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5735، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5735 (El Libro de las Bebidas), menciona la prohibición. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5735 (Le Livre des Boissons), mentionne une interdiction. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de 5735 numaralı hadis, bu yasağı zikretmektedir. Helal ve Haram tarayıcısı, bunu Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birleştirerek helal ve haram olanı ayırt eder."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5735, menyebutkan larangan tersebut. Peramban Halal dan Haram menggabungkan ini dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
