label: { ar: "الموطأ 1042 — ابن عمر: إن صددت عن البيت صنعنا كما صنعنا مع رسول الله، فأهل بعمرة، ثم قال: ما أمرهما إلا واحد، فأوجب الحج مع العمرة، ثم طاف طوافاً واحداً ورأى ذلك مجزياً عنه وأهدى", en: "Muwatta 1042" }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه قال حين خرج إلى مكة معتمراً في الفتنة: إن صُددت عن البيت صنعنا كما صنعنا مع رسول الله، فأهل بعمرة، ثم نظر في أمره فقال: ما أمرهما إلا واحد. ثم أشهد أصحابه أنه قد أوجب الحج مع العمرة، ثم نفذ حتى جاء البيت، فطاف طوافاً واحداً، ورأى ذلك مجزياً عنه، وأهدى. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1173) وإسماعيل بن أبي أويس عند البخاري (1813) وغيرهم. {cite:muwatta-maruf-1997 p.484}"
