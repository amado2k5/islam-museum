label: { ar: "الموطأ 1042 — ابن عمر: إن صددت عن البيت صنعنا كما صنعنا مع رسول الله، فأهل بعمرة، ثم قال: ما أمرهما إلا واحد، فأوجب الحج مع العمرة، ثم طاف طوافاً واحداً ورأى ذلك مجزياً عنه وأهدى", en: "Muwatta 1042", es: "Muwatta 1042", fr: "Muwatta 1042", ur: "موطا 1042", tr: "El-Muvatta 1042 — İbn Ömer: Eğer Kabe'ye ulaşmanız engellenirse, biz de Allah'ın Resulü'ne yaptığımız gibi yapacağız. Bunun üzerine Umre için ihrama girdi, sonra şöyle dedi: Emirleri bir ve aynıdır, böylece Hac'ı Umre ile birlikte farz kıldı, sonra bir tavaf yaptı ve bunu kendisine yeterli sayarak kurban kesti.", id: "Al-Muwatta 1042 — Ibn Umar: Jika kalian terhalang untuk mencapai Baitullah, kami akan melakukan seperti yang kami lakukan kepada Rasulullah. Maka beliau memasuki keadaan ihram untuk Umrah, lalu beliau berkata: Perintah mereka adalah satu dan sama, maka beliau mewajibkan Haji bersama Umrah, kemudian beliau melakukan satu tawaf dan menganggapnya cukup baginya dan mempersembahkan kurban." }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه قال حين خرج إلى مكة معتمراً في الفتنة: إن صُددت عن البيت صنعنا كما صنعنا مع رسول الله، فأهل بعمرة، ثم نظر في أمره فقال: ما أمرهما إلا واحد. ثم أشهد أصحابه أنه قد أوجب الحج مع العمرة، ثم نفذ حتى جاء البيت، فطاف طوافاً واحداً، ورأى ذلك مجزياً عنه، وأهدى. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1173) وإسماعيل بن أبي أويس عند البخاري (1813) وغيرهم. {cite:muwatta-maruf-1997 p.484}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, fitne (iç karışıklık) sırasında Umre yapmak için Mekke'ye gittiğinde şöyle demiştir: \"Eğer Kabe'ye girmem engellenirse, Allah Resulü ile yaptığımız gibi yapacağız.\" Bunun üzerine Umre için ihrama girdi, sonra durumunu değerlendirdi ve \"Onların durumu aynı\" dedi. Sonra arkadaşlarına Hac'ı Umre ile birlikte farz kıldığını şahit tuttu, Kabe'ye kadar ilerledi, bir tavaf yaptı ve bunu yeterli sayarak kurban kesti. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1173) ve İsmail ibn Abi Uveys tarafından Buhari'de (1813) ve diğerlerinde rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.484}"
  id: "Malik meriwayatkan hadits ini dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar, yang berkata, ketika ia pergi ke Mekah untuk melaksanakan Umrah selama masa fitnah (pertikaian sipil): “Jika aku terhalang memasuki Baitullah (Ka'bah), kami akan melakukan seperti yang kami lakukan bersama Rasulullah shalla Allahu alaihi wa sallam.” Maka ia mengenakan ihram untuk Umrah, kemudian mempertimbangkan situasinya dan berkata: “Situasi mereka sama.” Kemudian ia meminta para sahabatnya untuk menjadi saksi bahwa ia telah melaksanakan Haji bersama Umrah, lalu ia melanjutkan perjalanan hingga sampai di Baitullah, melakukan satu tawaf (mengelilingi), dan menganggap itu sudah cukup baginya, lalu ia mempersembahkan kurban. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1173) dan Isma’il ibn Abi Uways dalam Bukhari (1813) dan lainnya. {cite:muwatta-maruf-1997 p.484}"
