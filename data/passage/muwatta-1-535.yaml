label: { ar: "الموطأ 535 — مالك: لا يحمل أحد المصحف بعلاقته ولا على وسادة إلا وهو طاهر", en: "Muwatta 535" }
summary:
  ar: "قول لمالك في باب الأمر بالوضوء لمن مس القرآن: لا يحمل أحد المصحف بعلاقته ولا على وسادة إلا وهو طاهر، ولو جاز ذلك لحُمل في خبيئته. ويبين أن الكراهة ليست خوفاً من أن يكون في يدي الحامل ما يدنس المصحف، وإنما كُره ذلك لمن يحمله وهو غير طاهر إكراماً للقرآن وتعظيماً له. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.275}"
