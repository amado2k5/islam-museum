label: { ar: "الموطأ 535 — مالك: لا يحمل أحد المصحف بعلاقته ولا على وسادة إلا وهو طاهر", en: "Muwatta 535", es: "Muwatta 535", fr: "Muwatta 535", ur: "موطا 535", tr: "El-Muvatta 535 — Malik: Hiç kimse, ritüel temizliğine sahip olmadıkça Kur'an'ı kayışından tutarak veya yastık üzerinde taşımamalıdır.", id: "Al-Muwatta 535 — Malik: Tidak seorang pun boleh membawa Al-Qur'an dengan talinya atau di atas bantal kecuali jika ia dalam keadaan suci secara ritual." }
summary:
  ar: "قول لمالك في باب الأمر بالوضوء لمن مس القرآن: لا يحمل أحد المصحف بعلاقته ولا على وسادة إلا وهو طاهر، ولو جاز ذلك لحُمل في خبيئته. ويبين أن الكراهة ليست خوفاً من أن يكون في يدي الحامل ما يدنس المصحف، وإنما كُره ذلك لمن يحمله وهو غير طاهر إكراماً للقرآن وتعظيماً له. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.275}"
  tr: "Malik, Kur'an'a dokunmadan önce abdest alma emriyle ilgili olarak şunları söylemiştir: \"Kimse Kur'an'ı kılıfından veya yastığından tutarak taşımamalıdır, ancak ritüel temizliğine sahipse bu mümkündür. Eğer bunu yapmak caiz olsaydı, onu saklama yerinde taşırdı.\" Bu yasağın, taşıyıcının ellerinde Kur'an'ı kirletecek bir şey bulunmasından korkulmasından değil, Kur'an'a duyulan saygı ve hürmetten dolayı kirli haldeyken taşımanın mekruh olmasından kaynaklandığını açıklamıştır. Editör, bunun Malik'ten Ebu Musab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.275}"
  id: "Malik berkata, mengenai perintah berwudhu sebelum menyentuh Al-Quran: “Tidak seorang pun boleh membawa Al-Quran dengan sampulnya atau di atas bantal kecuali dalam keadaan suci. Jika diperbolehkan, ia akan membawanya di tempat persembunyiannya.” Ia menjelaskan bahwa larangan tersebut bukan karena kekhawatiran bahwa pembawa mungkin memiliki sesuatu di tangannya yang akan menajiskan Al-Quran, tetapi lebih karena tidak disukai jika seseorang membawanya dalam keadaan najis sebagai bentuk penghormatan dan kekaguman terhadap Al-Quran. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab dan Suwaid. {cite:muwatta-maruf-1997 p.275}"
