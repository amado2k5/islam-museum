text: "… : عن ابن عباس قال: خطبنا رسول اللّٰه ال، وقد عَصَبَ رأسَه بِعصَابة. وفي الصحيح، أنه قال في مرض موته: وارَأْسَاهُ البخاري: وكان يُعصِّبُ رأسه في مرضه، وعَصْبُ الرأس ينفع في وجع الشقيقة وغيرها مِن أوجاع الرأس. فصل علاج الصداع …"
