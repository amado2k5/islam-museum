label: { ar: "سنن أبي داود 3973 — كتاب الحروف والقراءات، قراءات القرآن", en: "Sunan Abi Dawud 3973 — the Book of the Letters and the Readings; the readings of the Qur'an", ur: "سنن ابی داؤد 3973 — کتاب الحروف والقراءات، قرآن کی قراءتیں", es: "Sunan Abi Dawud 3973 — El Libro de las Letras y las Lecturas; las lecturas del Corán", fr: "Sunan Abi Dawud 3973 — le Livre des Lettres et des Lectures; les lectures du Coran" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا يَحْيَى بْنُ سُلَيْمٍ، عَنْ إِسْمَاعِيلَ بْنِ كَثِيرٍ، عَنْ عَاصِمِ بْنِ لَقِيطِ بْنِ صَبِرَةَ، عَنْ أَبِيهِ، لَقِيطِ بْنِ صَبِرَةَ قَالَ كُنْتُ وَافِدَ بَنِي الْمُنْتَفِقِ - أَوْ فِي وَفْدِ بَنِي الْمُنْتَفِقِ - إِلَى رَسُولِ اللَّهِ فَذَكَرَ الْحَدِيثَ فَقَالَ - يَعْنِي النَّبِيَّ - \" لاَ تَحْسِبَنَّ \". وَلَمْ يَقُلْ لاَ تَحْسَبَنَّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3973، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Abi Dawud, no. 3973 (Dialects and Readings of the Qur'an (Kitab Al-Huruf Wa Al-Qira'at)), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 3973، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3973 (Dialectos y lecturas del Corán (Kitab Al-Huruf Wa Al-Qira'at)), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Abi Dawud, n° 3973 (Dialectes et lectures du Coran (Kitab Al-Huruf Wa Al-Qira'at)), mentionne les différentes lectures du Coran. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
