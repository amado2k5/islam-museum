text: "… احكامه انما اختلفا في قراأة حروفه وقد ظن كثير من العوام ان المراد بها القراآت السبعة وهو جهل قبيع تنبية اختلف هل المصاحف العثمانية مشتّملة على جميع الاحرف السبعة فذهب جماعات من الفقهاء والقراء والمتكلمين الى ذلك وبنوا عليه انه …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 116، يذكر الأحرف السبعة، وقراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 116, that mentions the seven ahruf, the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 116 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 1, pág. 116, que menciona los siete ahruf, las lecturas del Corán, los lectores, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 1, page 116, mentionnant les sept ahruf, les lectures du Coran, les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 1. cildinin 116. sayfasından, Kur'an'ın yedi okunuş şeklini, kıraat biçimlerini, okuyucularını ve Kur'an'ın derlenmesini ve el yazmalarını ele alan bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an kıraat biçimleri, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 1, halaman 116, yang membahas tujuh cara pembacaan, bacaan Al-Qur'an, para qari, dan penyusunan Al-Qur'an serta manuskripnya; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
