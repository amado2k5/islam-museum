  الغذاه وقد عون بالكسريجون بحنا قال الشماخ
  وقد عرقت مغابنها وجادت * بدرّم اقرى حجن قتين
  يقول صار عرف هذهالناقة قرى للقراد وأيحمنته أسأت غذاء، أبوزيد الجن البطى •الشباب
  والجمعن يضم الميم من النبات القصير القليل الماه وجيحون نهر يلمح وهو فيعول وجيهان نهر
  بالشأم جدن) ذوجدن قيل من أقيال حي برن ابن السكيت يقال للرجل
  والدابة اذا تعوّد الامر ومرن عليه قدحون مجسرن جروناوجرن الثوب جرونا اسحق ولان
  فهوجارن وكذلك الدرع قال لبيد
  وجواون بيض وكل طمرّة • يغدو عليها القرّتين غلام
  يعن در وعالينة والجارن ولدالحية وقال أبو الجراح الجارن الطريق الدارس والجرن
  الارض الغليظة وأنشد أبو عمر ولجندل
  تذكات بعدى وألهتها الطين • ونحن تغدوف الخبار والجرن
  ويقال هو ميدل من الجرل والحرن والجر بن موضع التمر الذى يجفف فيه وجوان البعير
  مقدّم عنقه م ن مذبحه الى محره والجسع جرن وكذلك من الغرس وجران المود لقب شاعر
  من غير واسبه المستورد واغ القب بذلك لقوله يخاطب امر أتيه
  خذا حذر ابإجارقة فانى • رأيت جوان العودد كاديصلح
  يعنى أنه كان اتخذمن جلد العود سوط اليضرب به نساءه والجريان لغة فى الجريال وجيرون
  باب من أيوابدد مشق ⁦(جشن)⁩ الجوشن الصدر والجوشن الدرع واسم رجل
  وجوشن الليل وسطه وصدره بقال مضى جوشن من الليل أى صدرمنه قال ابن أحر يصف
  يضى صبيرهافى ذى حبى • جواشن ليلها بينافينا
  والبين القطعة من الارض ( عئز الجه بالكسرأصول الصليان وجعتن أخت
  الفرزدق فن الجخن جفن العيز والجفن أيضائحمد السيف والجفن اسم موضع
  والجف ن قضبان الكرم الواحدة حفنة والجفنة كالقصعة والمع الجفان والجفئات بالتحردك
  لاتَّ ثانى قعلة يحرك فى المع اذا كان انما الاأن يكونيا. أوواوا فيسكن حينئذ وجفنة فبيئة
  من المن وقولهم وعند حفينة الخبر اليقين قال ابن السكيت هواسم خارولا تقسل جهينة
  وقال أبو عبيد فى كتاب الامثال هذا قول الاصمى وأماهتام بن مجمد السكلبى فانه أخبرانه
  جهينة وكان من حدينه أنّ حصين بن عمروبن معاوية بن عمروبن كلاب خرج ومعه رجل من
