label: { ar: "الموطأ 2190 — مالك عن ابن شهاب عن عروة عن عبد الرحمن بن عبد القاري: قال عمر ما بال رجال ينحلون أبناءهم نحلا ثم يمسكونها، فمن نحل نحلة فلم يحزها الذي نحلها حتى يكون إن مات لورثته فهي باطل", en: "Muwatta 2190" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عبد الرحمن بن عبد القاري أن عمر بن الخطاب قال: ما بال رجال ينحلون أبناءهم نحلا، ثم يمسكونها، فإن مات ابن أحدهم قال: مالي بيدي، لم أعط أحدا، وإن مات هو قال: هو لابني، قد كنت أعطيته إياه. من نحل نحلة فلم يحزها الذي نحلها، حتى تكون إن مات لورثته، فهي باطل. {cite:muwatta-maruf-1997 p.299}"
