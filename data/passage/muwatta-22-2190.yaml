label: { ar: "الموطأ 2190 — مالك عن ابن شهاب عن عروة عن عبد الرحمن بن عبد القاري: قال عمر ما بال رجال ينحلون أبناءهم نحلا ثم يمسكونها، فمن نحل نحلة فلم يحزها الذي نحلها حتى يكون إن مات لورثته فهي باطل", en: "Muwatta 2190", es: "Muwatta 2190", fr: "Muwatta 2190", ur: "موطا 2190", tr: "El-Muvatta 2190 — Malik, İbn Şihab'dan, o da Urve'den, o da Abdurrahman ibn Abdurkari'den rivayetle: Ömer dedi ki: “Oğullarına hediye verip sonra da vermeyenlerin sorunu nedir? Kim bir hediye verir de, öldüğünde mirasçılarına intikal etme hakkı doğana kadar onu teslim almazsa, o hediye geçersizdir.”", id: "Al-Muwatta 2190 — Malik, dari Ibn Shihab, dari Urwah, dari Abd al-Rahman ibn Abd al-Qari: Umar berkata, “Bagaimana dengan orang-orang yang memberi hadiah kepada anak-anak mereka lalu menahannya? Barang siapa memberi hadiah dan tidak mengambilnya sampai menjadi hak ahli warisnya jika ia meninggal, maka hadiah itu tidak sah.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عبد الرحمن بن عبد القاري أن عمر بن الخطاب قال: ما بال رجال ينحلون أبناءهم نحلا، ثم يمسكونها، فإن مات ابن أحدهم قال: مالي بيدي، لم أعط أحدا، وإن مات هو قال: هو لابني، قد كنت أعطيته إياه. من نحل نحلة فلم يحزها الذي نحلها، حتى تكون إن مات لورثته، فهي باطل. {cite:muwatta-maruf-1997 p.299}"
  tr: "Malik, İbn Şihab'dan, Urve ibn el-Zübeyr'den, Abdülrahman ibn Abdülkari'den rivayetle, Ömer ibn el-Hattab'ın şöyle dediğini naklediyor: “Oğullarına hediye veren, sonra da hediyeyi geri verenlerin durumu nedir? Oğullarından biri ölürse, ‘O benim malımdır; ben kimseye vermedim’ derler. Ama oğul kendisi ölürse, ‘Oğluma aittir; ben ona zaten vermiştim’ derler. Kim bir hediye verir de, öldüğünde mirasçılarına geçene kadar onu geri almazsa, o hediye geçersizdir.” {cite:muwatta-maruf-1997 s.299}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Abd al-Rahman ibn Abd al-Qari, bahwa Umar ibn al-Khattab berkata: “Bagaimana dengan orang-orang yang memberi hadiah kepada anak-anak mereka, kemudian menahannya? Jika salah satu anak mereka meninggal, mereka berkata: ‘Itu ada dalam kepemilikanku; aku tidak memberikannya kepada siapa pun.’ Tetapi jika anak itu sendiri meninggal, mereka berkata: ‘Itu milik anakku; aku sudah memberikannya kepadanya.’ Barang siapa memberi hadiah dan tidak mengambilnya sampai menjadi milik ahli warisnya jika ia meninggal, maka hadiah itu tidak sah.” {cite:muwatta-maruf-1997 p.299}"
