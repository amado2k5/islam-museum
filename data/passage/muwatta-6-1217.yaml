summary:
  ar: "يذكر يحيى أن مالكا سئل هل يرمى عن الصبي والمريض، فقال نعم. ويتحرى المريض حين يرمى عنه فيكبر وهو في منزله ويهريق دما، فإن صح في أيام التشريق رمى الذي رمي عنه وأهدى. {cite:muwatta-maruf-1997 p.544}"
