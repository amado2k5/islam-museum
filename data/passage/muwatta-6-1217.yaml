label: { ar: "الموطأ 1217 — مالك: يرمى عن الصبي والمريض، ويتحرى المريض فيكبر في منزله ويهريق دما، فإن صح في أيام التشريق رمى وأهدى", en: "Muwatta 1217", es: "Muwatta 1217", fr: "Muwatta 1217", ur: "موطا 1217", tr: "El-Muvatta 1217 — Malik: Taşlama, çocuk ve hasta kişi adına yapılır. Hasta kişi muayene edilmeli, evde tekbir getirmeli ve kan dökmelidir. Teşrik günlerinde iyileşirse, taşlama yapılmalı ve kurban kesilmelidir.", id: "Al-Muwatta 1217 — Malik: Hukuman rajam dilakukan untuk anak dan orang sakit. Orang sakit harus diperiksa dan hendaknya melakukan takbir di rumah dan menumpahkan darah. Jika ia sembuh selama hari-hari Tashreeq, maka ia harus melakukan hukuman rajam dan mempersembahkan kurban." }
summary:
  ar: "يذكر يحيى أن مالكا سئل هل يرمى عن الصبي والمريض، فقال نعم. ويتحرى المريض حين يرمى عنه فيكبر وهو في منزله ويهريق دما، فإن صح في أيام التشريق رمى الذي رمي عنه وأهدى. {cite:muwatta-maruf-1997 p.544}"
  tr: "Yahya, Malik'e taşlama işleminin bir çocuk veya hasta kişi adına yapılıp yapılmaması gerektiği sorulduğunda, \"Evet\" diye cevap verdiğini aktarır. Ayrıca, taşlama işlemi hasta kişi adına yapılırken dikkatli olunması gerektiğini, evdeyken \"Allahu Ekber\" demesi ve kurban kesmesi gerektiğini ekler. Eğer hasta Teşrik günlerinde iyileşirse, taşlama işlemini kendisi yapmalı ve kurban kesmelidir. {cite:muwatta-maruf-1997 s.544}"
  id: "Yahya menyebutkan bahwa Malik ditanya apakah rajam harus dilakukan untuk anak kecil atau orang sakit, dan beliau menjawab, \"Ya.\" Beliau menambahkan bahwa orang sakit hendaknya berhati-hati ketika rajam dilakukan untuknya, jadi ia hendaknya mengucapkan \"Allahu Akbar\" saat di rumah dan mempersembahkan kurban. Jika ia sembuh selama hari-hari Tashreeq, ia hendaknya melakukan rajam atas nama orang yang menjadi sasaran rajam tersebut dan mempersembahkan kurban. {cite:muwatta-maruf-1997 p.544}"
