label: { ar: "الموطأ 2831 — ابن مسعود: العبد يكذب فتنكت في قلبه نكتة سوداء حتى يكتب عند الله من الكاذبين", en: "Muwatta 2831", es: "Muwatta 2831", fr: "Muwatta 2831", ur: "موطا 2831", tr: "İbn Mes'ud, El-Muvatta 2831: Bir kul yalan söylerse, kalbine kara bir leke düşer ve Allah katında yalancılardan biri olarak kaydedilir.", id: "Al-Muwatta 2831 — Ibnu Mas'ud: Seorang hamba berbohong, dan akan muncul noda hitam di hatinya hingga ia tercatat di sisi Allah sebagai salah satu pendusta." }
summary:
  ar: "بلغ مالكا أن عبد الله بن مسعود كان يقول: لا يزال العبد يكذب وتنكت في قلبه نكتة سوداء، حتى يسود قلبه، فيكتب عند الله من الكاذبين. ويذكر المحقق أن الأثر موقوف، لكن حكمه الرفع لأن الرأي لا مدخل فيه. {cite:muwatta-maruf-1997 p.589}"
  tr: "Malik, Abdullah ibn Mes'ud'un şöyle dediğini rivayet etmiştir: \"Bir kimse yalan söylemeye devam ederse, kalbinde kara bir leke belirir ve kalbi simsiyah olur; Allah katında yalancılardan sayılır.\" Araştırmacı, rivayetin mevkuf (bir Sahabeye atfedilen) olduğunu, ancak hükmünün merfu (Peygambere atfedilen) olduğunu, çünkü kişisel görüşün burada yeri olmadığını belirtmektedir. {cite:muwatta-maruf-1997 s.589}"
  id: "Malik meriwayatkan bahwa Abdullah ibn Mas'ud biasa berkata: \"Seseorang yang terus menerus berbohong, akan muncul bintik hitam di hatinya hingga hatinya menjadi hitam, dan ia tercatat di sisi Allah sebagai salah satu pendusta.\" Peneliti menyebutkan bahwa riwayat tersebut mawquf (dinikahkan dengan seorang Sahabat), tetapi hukumnya adalah marfu' (dinikahkan dengan Nabi) karena pendapat pribadi tidak ada tempatnya di dalamnya. {cite:muwatta-maruf-1997 p.589}"
