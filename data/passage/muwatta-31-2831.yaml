label: { ar: "الموطأ 2831 — ابن مسعود: العبد يكذب فتنكت في قلبه نكتة سوداء حتى يكتب عند الله من الكاذبين", en: "Muwatta 2831" }
summary:
  ar: "بلغ مالكا أن عبد الله بن مسعود كان يقول: لا يزال العبد يكذب وتنكت في قلبه نكتة سوداء، حتى يسود قلبه، فيكتب عند الله من الكاذبين. ويذكر المحقق أن الأثر موقوف، لكن حكمه الرفع لأن الرأي لا مدخل فيه. {cite:muwatta-maruf-1997 p.589}"
