text: "ه أبو الصلت وغيره. كان يهم ويخطى. بينما هو في عرض أصحابه، ورد عليه كتاب الحسن بن سهل يعلمه فيه أن المأمون جعل علي بن موسى ولي عهده، لأنه نظر في بني العبام وبني علي، فلم يجد أحدا هو أفضل"
