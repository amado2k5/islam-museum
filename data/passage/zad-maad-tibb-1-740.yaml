text: "… مِن الصُّداع الرطب والسَّوداوي، ويصدَعُ الرؤوس الحارة، والمحرق منه إذا شُقَّ بصلُه صليباً، وغُرِصَ، صار مضاعفاً، ومن أدمن شمَّه في الشتاء أمن من البِرسام في الصيف، وينفعُ مِن أوجاع الرأس الكائنة من البلغم والمِرة السوداء، وفيه من العِطرية ما يقوي …"
