text: "… فلا يتكل م إلا بحق فيكون سكوته عبادة وكلامه عبادة ومهما اعتادت العين رمي البصر إلى كل شيء جميل لم تتحفظ عن النظر إلى ما لا يحل وكذلك سائر الشهوات لأن الذي يشتهى به الحلال هو بعينه الذي يشتهي الحرام …"
summary:
