text: "… كل ما يعرضه للهلاك من غرق أو حرق، فإن كان قادرا على ذلك دون غيره وجبت الإِعانة عليه وجوبا عينيا، وإن كان ثم غيره كان ذلك واجبا كفائيا على القادرين، فإن قام به أحد سقط عن الباقين وإلا أثموا جميعا …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 4، ص 193، يرد فيه ذكر فرض العين، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين، والواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 4, p. 193, whose wording mentions the individual obligation (fard 'ayn), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out, the obligatory (wajib), obligation (wujub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 4، ص 193 کا اقتباس جس میں فرضِ عین، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے، واجب، وجوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 4, p. 193, dont le texte mentionne l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent, l'obligatoire (wajib), l'obligation (wujub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 4, p. 193, cuyo texto menciona la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen, lo obligatorio (wajib), la obligatoriedad (wujub); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 4, sayfa 193'ten bir alıntı, bireysel yükümlülükleri (farz-ı ayn), toplu yükümlülükleri (farz-ı kifaye) ve bir kısmı bir yükümlülüğü yerine getirirse, geri kalanından artık istenmeyeceği ilkesini ele almaktadır. Ayrıca görev (vacip) ve yükümlülük (vujub) kavramlarına da değinmektedir. Bu alıntı, makine tarafından okunabilir, taranmış bir versiyondan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Düzenlenmemiştir. Alıntı, farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 4 Bergambar, halaman 193, membahas kewajiban individu (fard 'ayn), kewajiban kolektif (fard kifayah), dan prinsip bahwa jika sebagian orang memenuhi suatu kewajiban, maka kewajiban tersebut tidak lagi diwajibkan bagi yang lain. Kutipan ini juga membahas konsep kewajiban (wajib) dan tanggung jawab (wujub). Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin dan dibatasi sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, tugas, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
