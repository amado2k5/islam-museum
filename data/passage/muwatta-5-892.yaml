text: "تحروا ليلة القدر في السبع الأواخر"
summary:
  ar: "يرويه زياد عن مالك عن عبد الله بن دينار عن عبد الله بن عمر، أن رسول الله قال: تحروا ليلة القدر في السبع الأواخر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (888) وإسماعيل بن أبي أويس عند البخاري (2015)، وأن هذا الحديث عند مالك من رواية عبد الله بن دينار عن ابن عمر، خلافاً للحديث 895. {cite:muwatta-maruf-1997 p.428}"
