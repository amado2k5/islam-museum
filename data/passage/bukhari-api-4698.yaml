label: { ar: "صحيح البخاري 4698 — الأب والأبوة", en: "Sahih al-Bukhari 4698 — the father and fatherhood", ur: "صحیح بخاری 4698 — باپ اور والدیت", es: "Sahih al-Bukhari 4698 — El padre y la paternidad" }
text: "… لاَ يَتَكَلَّمَانِ، فَكَرِهْتُ أَنْ أَتَكَلَّمَ، فَلَمَّا لَمْ يَقُولُوا شَيْئًا قَالَ رَسُولُ اللَّهِ \" هِيَ النَّخْلَةُ \". فَلَمَّا قُمْنَا قُلْتُ لِعُمَرَ يَا أَبَتَاهُ وَاللَّهِ لَقَدْ كَانَ وَقَعَ فِي نَفْسِي أَنَّهَا النَّخْلَةُ فَقَالَ مَا مَنَعَكَ أَنْ تَكَلَّمَ قَالَ لَمْ أَرَكُمْ تَكَلَّمُونَ، فَكَرِهْتُ أَنْ أَتَكَلَّمَ أَوْ أَقُولَ شَيْئًا. قَالَ عُمَرُ لأَنْ تَكُونَ قُلْتَهَا أَحَبُّ إِلَىَّ مِنْ كَذَا وَكَذَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 4698، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4698 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4698، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4698 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
