text: "… من المحدثين: مالك وابن المبارك وابن عيينة وابن المديني ويحيى بن معين وأحمد بن حنبل وسعيد بن منصور والبخاري وغيرهم. - ومن الفقهاء: أبو يوسف ومحمد بن الحسن والشافعي والليث بن سعد وأبو ثور وغيرهم. - ومن القراء: سليم صاحب …"
