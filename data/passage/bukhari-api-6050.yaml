text: "حَدَّثَنَا عُمَرُ بْنُ حَفْصٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا الأَعْمَشُ، عَنِ الْمَعْرُورِ، عَنْ أَبِي ذَرٍّ، قَالَ رَأَيْتُ عَلَيْهِ بُرْدًا وَعَلَى غُلاَمِهِ بُرْدًا فَقُلْتُ لَوْ أَخَذْتَ هَذَا فَلَبِسْتَهُ كَانَتْ حُلَّةً، وَأَعْطَيْتَهُ ثَوْبًا آخَرَ. فَقَالَ كَانَ بَيْنِي وَبَيْنَ رَجُلٍ كَلاَمٌ، وَكَانَتْ أُمُّهُ أَعْجَمِيَّةً، فَنِلْتُ مِنْهَا فَذَكَرَنِي إِلَى النَّبِيِّ فَقَالَ لِي \" أَسَابَبْتَ فُلاَنًا \". قُلْتُ نَعَمْ. قَالَ \" أَفَنِلْتَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6050، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6050 (Good Manners and Form (Al-Adab)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 6050، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 6050 (Buenas costumbres y modales (Al-Adab)), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
