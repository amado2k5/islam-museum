text: "… عن أبى حفص الكلاعىّ عن تُبيع عن كعب قال : مات يوسف استعبد أهلُ مصر بنى إسرائيل. ثم رجع إلى حديث عثمان قال : ثم هلك كاشم بن معدان، فملكهم بعده فرعون موسى. قال غير عثمان : واسمه طَلما، قبطىّ …"
summary:
