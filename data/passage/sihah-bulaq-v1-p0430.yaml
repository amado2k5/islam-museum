text: |-
  FIN
  .د) الأمد الغاية كالمدى يقال ما أمدل أى منتهو عمرك والامد أيضا الغضب وقد
  مدعله بالكسروأ بدعليه أى غضب وآمدبلدفى الثغور (أود اود الشى بالكسر
  يأود أودا أى اعوج وتأودتعوج أبوزيدآدنى الحمل يؤودنى أودا أثقلي وأنامؤود مشال
  مقول يقال ما آدل فهولى آيد وآده أيضابعى حناه وعطفه وأصلهماراحد
  وآد العشىّ أى مال قال الهذلى ساعدة بن العجلان
  أقت بمنهار الصيف حتق • رايت ظلال آخره تؤود
  أى ترجع وغبل الى ناسية المشرق وقال المرقش
  لا يبعد اللّٰه التلبب وا! _غارات اذ قال اللهيس نعم
  والعدو بين المجلسين اذ اد العشى وتنادى العم
  والانتياد الاخناء قال العجاج
  من ان تدلت يا دى آدا • لم يك ينادفامسى انا دا
  أى قدانا دفجعل الماضى الاباضما رقدكة وله تعالى أوجاؤكم حصرت صدورهم وأود
  بالضم موضع بالبادية وأود بالفتح اسم رحل قال الافوه الاودى
  ملكذاملك لقاح أول • وأبونا من بى أودخيار
  ⁦( ايد)⁩. أبوزيد الرجل ينبدأبدا اشتدوقوى والايدوالا دالقوة قال العجاج
  من ان تددات با دى آدا يعنى قوة الشبابقول منه أيدته على فعلته نهو مؤيد وتقول
  من الايد أيدته تأييداأى قويته والفاعل مؤيد وتسغيره مؤيدأيضا والمفعول مؤيد وتأيد
  الشئة وى ورجل أيدأى قوى قال الشاعر.
  اذا القوس وزها أيد ١ رمى فاصاب السكلى والذرى
  يقول اذا اللّٰه تعالى وتر القوس التى فى السحاب رمى كَ لى الابل واستمتها بالشهم يعنى
  من النبات الذى يكون من المطر والايادتراب يجعل حول الحوض أوالخباء يقوّى به
  أو يمنع ماء المطار. قال ذوالرمة يصف الظليم
  دفعناه عن بيض حسان بأجرع • حوى حولها من زربدباياد
  يقول طردناه عن بيضه وإيادحىّ من معد وقال الشاعر
  فى فتوحسن أوجههم • من إيادين تزارين معد
  ويقال لميمنة العسكر وميسرته إياد قال الراجز
  عن ذى إيادين لهام لودسر • بركنه أركان دمخ لانعقر
  والمؤيد مثال المؤمن الامر العظيم والداهية قال طرفة
  فقول وقدتر الوظيف وساقها • ألست ترى أن قد أييت بمؤيد
  فصل لبساء جد بالمكان بجودا أقام به وقولهم هو عالم ببجدة أمرك وبجدة
  أمرك وبجدة أمرك بضم الباءرالجيم أى بدخلة أمرك وباطنه ويقال عنده بجدة ذلك بالفتح
  أى علم ذلك ومنه قسل للعالم بالشى المتقن هوابن بجدتها والبجادكساء مخطط من أكسية
  الاعراب ومنه ذوالبجادين واسمه عبد الله ⁦(بخد )⁩ البخنداة وانلحبنداة من النساء
  ⁦(١)⁩ ب نذالياء
