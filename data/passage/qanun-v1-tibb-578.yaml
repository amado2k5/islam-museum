text: "… أورام البلغم والريح. الجراح والقروح : بالخل الثقيف على تقرّح الجرب يضمد بها حاراً. أعضاء النفس والصدر : يليّن الصدر بجلائه، وخصوصاً حسو مائه بالسكر مع دهن اللوز، ويبلّ بالشراب، فينفع من أورام الثدي. أعضاء النفض : يحرّك الأمعاء على …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 578، يذكر أسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر، ومداواة الجراح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 578, that mentions named diseases, the hospital and the medical craft, the organs of the body, surgery, circumcision and splints, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 578 کا اقتباس جس میں بیماریوں کے نام، بیمارستان، اعضائے بدن، جراحت، ختنہ اور پٹیاں، زخموں کا علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
