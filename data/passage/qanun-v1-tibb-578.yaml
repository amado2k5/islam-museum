text: "… أورام البلغم والريح. الجراح والقروح : بالخل الثقيف على تقرّح الجرب يضمد بها حاراً. أعضاء النفس والصدر : يليّن الصدر بجلائه، وخصوصاً حسو مائه بالسكر مع دهن اللوز، ويبلّ بالشراب، فينفع من أورام الثدي. أعضاء النفض : يحرّك الأمعاء على …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 578، يذكر أسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر، ومداواة الجراح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 578, that mentions named diseases, the hospital and the medical craft, the organs of the body, surgery, circumcision and splints, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 578 کا اقتباس جس میں بیماریوں کے نام، بیمارستان، اعضائے بدن، جراحت، ختنہ اور پٹیاں، زخموں کا علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 578, que menciona enfermedades específicas, el hospital y la práctica médica, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el tratamiento de las heridas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 578, qui mentionne les maladies nommées, l'hôpital et l'art médical, les organes du corps, la chirurgie, la circoncision et les attelles, le traitement des plaies; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 578'den bir bölüm; hastalıkların isimleri, hastane, tıp mesleği, vücut organları, cerrahi, sünnet, atel ve yara tedavisi konularını ele almaktadır; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 578, yang menyebutkan nama-nama penyakit, rumah sakit, profesi medis, organ tubuh, pembedahan, sunat, bidai, dan pengobatan luka; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
