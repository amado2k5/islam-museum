label: { ar: "الموطأ 2713 — أبو هريرة: من يرد الله به خيرا يُصب منه", en: "Muwatta 2713", es: "Muwatta 2713", fr: "Muwatta 2713", ur: "موطا 2713", tr: "El-Muvatta 2713 — Ebu Hurayra: Allah kime hayır dilerse, onu zorluğa düşürür.", id: "Al-Muwatta 2713 — Abu Hurairah: Barangsiapa yang Allah kehendaki kebaikan, maka Dia akan menimpakannya dengan kesulitan." }
summary:
  ar: "يروي مالك عن محمد بن عبد الله بن أبي صعصعة أنه سمع أبا الحباب سعيد بن يسار يقول: سمعت أبا هريرة يقول: قال رسول الله: من يرد الله به خيرا يُصب منه. {cite:muwatta-maruf-1997 p.530}"
  tr: "Malik, Muhammed ibn Abdullah ibn Abi Sa'sa'ah'tan rivayetle, Ebu el-Hubab Sa'id ibn Yasar'ın şöyle dediğini işittiğini aktarır: \"Ebu Hurayra'nın şöyle dediğini işittim: Allah'ın Resulü şöyle buyurdu: 'Allah kime hayır dilerse, onu imtihan eder.'\" {cite:muwatta-maruf-1997 s.530}"
  id: "Malik meriwayatkan dari Muhammad ibn Abdullah ibn Abi Sa'sa'ah bahwa ia mendengar Abu al-Hubab Sa'id ibn Yasar berkata: Aku mendengar Abu Hurayrah berkata: Rasulullah SAW bersabda: \"Barangsiapa yang Allah kehendaki kebaikannya, maka Dia akan menimpakannya cobaan.\" {cite:muwatta-maruf-1997 p.530}"
