label: { ar: "الموطأ 1087 — مالك سئل: هل يقف الرجل في الطواف الواجب عليه يتحدث مع الرجل؟ فقال: لا أحب ذلك له", en: "Muwatta 1087", es: "Muwatta 1087", fr: "Muwatta 1087", ur: "موطا 1087", tr: "El-Muvatta 1087 — Malik'e soruldu: Farz tavaf sırasında bir erkek ayakta durup başka bir erkekle konuşmalı mıdır? Cevap verdi: Bunu onun için uygun bulmuyorum.", id: "Al-Muwatta 1087 — Malik ditanya: Bolehkah seorang pria berdiri saat melakukan tawaf wajib dan berbicara dengan pria lain? Dia menjawab: Aku tidak menyukai hal itu baginya." }
text: "لا أحب ذلك له"
summary:
  ar: "سئل مالك: هل يقف الرجل في الطواف الواجب عليه يتحدث مع الرجل؟ فقال: لا أحب ذلك له. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1309) وسويد (550). {cite:muwatta-maruf-1997 p.499}"
  tr: "Malik'e, \"Farz olan tavaf yapan bir erkeğin ayakta durup başka bir erkekle konuşması caiz midir?\" diye soruldu. O da, \"Bunu onun için uygun bulmuyorum\" diye cevap verdi. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1309) ve Suveyd (550) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.499}"
  id: "Malik ditanya: Apakah diperbolehkan bagi seorang laki-laki yang sedang melakukan tawaf (mengelilingi Allah) untuk berdiri dan berbicara dengan laki-laki lain? Beliau menjawab: Saya tidak menyukai hal itu baginya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1309) dan Suwaid (550). {cite:muwatta-maruf-1997 p.499}"
