text: "تراجم الرجال حرف الظاء المثالة ونقط المصاحف أبو الأسود، وقد سئل أبو الأسود عمَّن وقال دِعْبلُ وعمر بن شَبَّة: هو عمرو بن ظالم بن نهج له الطريق، فقال: تلقيته عن علي بن أبي طالب. سفيان، وسيأتي نسبه سواء. وقيل : …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 738، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 738, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 738 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 2, pág. 738, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 2, p. 738), mentionne la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans la limite de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 738. sayfasından bir alıntı, Kur'an'ın derlenmesini ve el yazmalarını, ayrıca Kur'an'ın diyakritik işaretlerini ve biçimlendirmesini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Volume 2, halaman 738, membahas penyusunan Al-Qur'an dan manuskripnya, serta tanda diakritik dan format Al-Qur'an. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
