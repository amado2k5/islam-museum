text: |-
  ١٩٧
  حد وآند الضى
  أتخت قلوصى بالمريزورحلها • لمانابه من طارق الليل مسجل
  أراد بالرحل المنزل وقوه تعالى حل جزاء الاحسان الا الاحسان قال فيه محمسدبن الحنفية
  هى مسحلة للبرّ والفاجر قال الاصمعى أى مرسلة لم يشقرط فيها بردون فاجريقال أصلت
  الكلام أى أرسلته والجنجل المرآة وهورومى معرب قال اهر والقيس
  زائبها معة ولة كالسمغبل* حمل السصل الثوب الابيض من السكرسف ص بداب
  اليمن قال المسيب بن علس يذكر ظعنا
  فى الآل يخفضها ويرفعها • ربع بلوح كأنه سحل
  شبه الطريق بنوب أبيض وابهع سعول ويجمع أيضاعلى سحل مثل سقف وسقف وقال
  لسمل البيض جلالونها • ممح فجاء الجل الاسول
  وكفن رسول اللّٰه على اللّٰه عليه وسلم فى ثلاثة أنواب سحولية كرسف ويقال مصول. وضع
  باليمن وهى تنسب اليه والسمل النقد من الدراهم وقال أبوذؤيب
  فبات بجمع ثم آل الى منى • فاصبح راد ايبتغى المزج بالسحل
  والسصلة مثال الهمزة الارنب الصغيرة التى قدار تفعت عن الخرنق وفارقت أمها والمسصل
  المبرد والمسعل الاسان الخطيب والمحل الهار الوحشى والمصلان حلقتان فى طرفى شكيم
  اللجام احداهما مدخلة فى الاخرى ومسحل اسم تابعة الاعشى وقال فيه
  قوله والمحدل اللسان الخطيب
  دءوت خليلى مسحلاودعواله • جهنام جدعاللهجين المذتم
  أبو نصر السحيل الخيط غير مفتول والسعيدل من الشياب ما كان غزله طاقا واحدا والمبرم
  فى القاموس وكنير المنعت والمبرد
  المفتول الغزل طاقين والمتام ماحكان سداه ولحهته طاقين طاقين ليس بعبرم ولا مسحل
  واللسان ما كان وقول الجوهرة
  والسحيل من المبل الذى يقتسل فتلا واحدا كما يفتل اللخياط سلكه والمبرم أن يجسمع بين
  اللسان الخطيب بغيروا وسهو
  سيجتين فيفتلا حبلا واحدا وقد سهلت الجبل فهو مسحول ويقال مسدل لاجل المبرم
  والصواب والخطيب بجرف
  وصلت الشى حقته وهلت الدراهم فاسحلت اذا املاست ومصلته مائة درهم اذا عجلت
  عطف اه
  له نقددها قال ابن السكيت محات الدراهم صيبتها كأنك حككت بعضها بعض وسحله
  مانة سوط أى ضر به وأصل السهل القشركانه قشر جلده وسهلت الرباح الارض كشعات
  أدمتها الاصمعى تاتت السماء تسهل لملتها أى تصب ويقال الخهابب انسصل بالكلام اذا
  جرى به وركب مسحله اذامضى فى خطبته والسحيل والسجال بالضم السوط الذى يدور
  فى صدر الحمار وقد سل يسصل بالكسر ومنه قيل لعير الفلاة مسحل والسصالة ماسقط من
  الذهب والفضة ونحرهما كالبرادة والساحل شاطئ البحر قال ابن دريد هو مقلوب وانما
