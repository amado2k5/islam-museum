label: { ar: "الموطأ 2443 — ابن شهاب: حد العبد في الخمر نصف حد الحر", en: "Muwatta 2443", es: "Muwatta 2443", fr: "Muwatta 2443", ur: "موطا 2443", tr: "El-Muvatta 2443 — İbn Şihab: Kölenin içki içmesinin cezası, hür bir insanın cezasının yarısıdır.", id: "Al-Muwatta 2443 — Ibn Shihab: Hukuman bagi seorang budak yang minum alkohol adalah setengah dari hukuman bagi orang merdeka." }
summary:
  ar: "حدث مالك عن ابن شهاب أنه سُئل عن حد العبد في الخمر، فقال: بلغني أن عليه نصف حد الحر في الخمر، وأن عمر بن الخطاب وعثمان بن عفان وعبد الله بن عمر قد جلدوا عبيدهم نصف حد الحر في الخمر. {cite:muwatta-maruf-1997 p.409} {cite:muwatta-maruf-1997 p.410}"
  tr: "Malik, İbn Şihab'dan rivayetle, kendisine alkol içen bir kölenin cezası sorulduğunda şöyle dediğini aktarmıştır: \"Alkol içtiği için hür bir adamın cezasının yarısına tabi tutulduğunu duydum ve Ömer ibn el-Hattab, Osman ibn Affan ve Abdullah ibn Ömer, kölelerini alkol içtikleri için hür bir adamın cezasının yarısıyla kırbaçlamışlardır.\" {cite:muwatta-maruf-1997 s.409} {cite:muwatta-maruf-1997 s.410}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia ditanya tentang hukuman bagi seorang budak yang minum alkohol, dan ia berkata: “Aku telah mendengar bahwa ia dikenai hukuman setengah dari hukuman orang merdeka karena minum alkohol, dan bahwa Umar bin al-Khattab, Utsman bin Affan, dan Abdullah bin Umar mencambuk budak mereka dengan setengah hukuman orang merdeka karena minum alkohol.” {cite:muwatta-maruf-1997 p.409} {cite:muwatta-maruf-1997 p.410}"
