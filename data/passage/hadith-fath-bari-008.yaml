text: "النبي عليفي ابن خال والدته، وقد أسلمت أم عثمان كما بينت ذلك في كتاب الصحابة. وروى محمد بن الحسين المخزومي في كتاب المدينة أنها ماتت في خلافة ابنها عثمان وأنه كان ممن حملها إلى قبرها. وأما أبوه فهلك في الجاهلية"
