text: "… فَإِنَّهُ يرجعُ بقِيرَاط رواه البخاري. - وعن أُمّ عطِيَّةَا قَالَتْ : نُهِينَا من اتَّبَاعِ الجَنائز، وَلم يُعزَمْ عَليْنَا متفقٌ عليه. ومعناه ولَمْ يُشدَّد في النَّهي كما يُشدَّدُ في المُحَرَّمَات. - باب استحباب تكثير المصلين على الجنازة وجعل صفوفهم ثلاثة فأكثر …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 212، يرد فيه ذكر المستحب، ونهي لم يُعزم فيه، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 212, whose wording mentions the recommended (mustahabb), a prohibition that was not made firm, the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 212 کا اقتباس جس میں مستحب، وہ ممانعت جس میں سختی نہیں کی گئی، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin de al-Nawawi, volume numérisé 3, p. 212, dont le texte mentionne le recommandé (mustahabb), une interdiction qui ne fut pas rendue ferme, les choses interdites ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen digitalizado 3, p. 212, cuyo texto menciona lo recomendado (mustahabb), una prohibición que no se hizo firme, las cosas prohibidas; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin 3. cildinin 212. sayfasından, müstehaplı ameller, kesin farz olmayan yasaklar, haram ameller ve Allah tarafından haram kılınan amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehaplı ameller, mekruh amelleri, haram amelleri ve küçük günahlar tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Jilid 3, halaman 212, yang menyebutkan amalan-amalan yang dianjurkan, larangan-larangan yang tidak wajib, dan amalan-amalan yang dilarang oleh Allah; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh mesin pembaca yang berisi amalan-amalan wajib, amalan-amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil."
