text: "عشرة سنة. ليفقههم في الدين، ويعلمهم القرآن، ويأخذ صدقاتهم، وكتب له كتابا فيه الفرائض والسنن، والصدقات والديات، وتوفي عمرو بن حزم في خلافة عمر بالمدينة، ذكر هذا ابن عبد البر في الاستيعاب(٣٠٠/٨). (أن (لا يمس القرآن إلا طاهر)) رواه مالك"
