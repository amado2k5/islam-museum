label: { ar: "مسلم 96 — أفلا شققت عن قلبه", en: "Muslim 96 — Did you split open his heart?", es: "Musulmán 96 — ¿Le abriste el corazón?", fr: "Muslim 96 — Lui as-tu ouvert le cœur ?", ur: "مسلم 96 - کیا تم نے اس کا دل پھاڑ دیا؟", tr: "Müslim 96 — Sen onun kalbini yarıp açmadın mı?", id: "Muslim 96 — Tidakkah kamu membelah hatinya?" }
text: "قال رسول الله لأسامة بن زيد حين قتل رجلاً قال لا إله إلا الله: «أقتلته بعدما قال لا إله إلا الله؟» قال: يا رسول الله إنما كان متعوذاً، قال: «أفلا شققت عن قلبه حتى تعلم أقالها أم لا؟» فما زال يكررها حتى تمنيت أني لم أكن أسلمت قبل ذلك اليوم"
summary:
  ar: "رواية أسامة بن زيد في كتاب الإيمان من صحيح مسلم، في سرية إلى الحرقات من جهينة؛ يجعل كلمة التوحيد عاصماً للدم حتى في حالة القتال، ومن أشد النصوص المؤنبة في صحيح مسلم."
  tr: "Sahih Müslim'deki İman Kitabı'nda yer alan Usame bin Zeyd'in, Cuhayna'nın El-Hurakat bölgesine yaptığı gizli bir görevle ilgili rivayeti, tevhid sözünü, savaş halinde bile kan dökülmesinin güvencesi haline getiriyor ve Sahih Müslim'deki en sert kınama içeren metinlerden biridir."
  id: "Riwayat Usama bin Zaid dalam Kitab Iman di Sahih Muslim, tentang misi rahasia ke Al-Huraqat di Juhayna, menjadikan kalimat tauhid sebagai perlindungan terhadap pertumpahan darah bahkan dalam kasus pertempuran, dan merupakan salah satu teks celaan yang paling keras dalam Sahih Muslim."
