label: { ar: "مسلم 96 — أفلا شققت عن قلبه", en: "Muslim 96 — Did you split open his heart?" }
text: "قال رسول الله لأسامة بن زيد حين قتل رجلاً قال لا إله إلا الله: «أقتلته بعدما قال لا إله إلا الله؟» قال: يا رسول الله إنما كان متعوذاً، قال: «أفلا شققت عن قلبه حتى تعلم أقالها أم لا؟» فما زال يكررها حتى تمنيت أني لم أكن أسلمت قبل ذلك اليوم"
summary:
  ar: "رواية أسامة بن زيد في كتاب الإيمان من صحيح مسلم، في سرية إلى الحرقات من جهينة؛ يجعل كلمة التوحيد عاصماً للدم حتى في حالة القتال، ومن أشد النصوص المؤنبة في صحيح مسلم."
