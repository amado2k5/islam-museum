text: "… رِجْلِي فَقَالَ الَّذِي عِنْدَ رَأْسِي لِلَّذِي عِنْدَ رِجْلِي أَوِ الَّذِي عِنْدَ رِجْلِي لِلَّذِي عِنْدَ رَأْسِي مَا وَجَعُ الرَّجُلِ قَالَ مَطْبُوبٌ. قَالَ مَنْ طَبَّهُ قَالَ لَبِيدُ بْنُ الأَعْصَمِ. قَالَ فِي أَىِّ شَىْءٍ قَالَ فِي مُشْطٍ وَمُشَاطَةٍ وَجُفِّ طَلْعَةِ ذَكَرٍ. قَالَ وَأَيْنَ هُوَ قَالَ فِي بِئْرِ ذِي أَرْوَانَ \". قَالَتْ فَأَتَاهُ النَّبِيُّ ـ فِي أُنَاسٍ مِنْ أَصْحَابِهِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3545، يذكر الطب والطبيب، والوجع. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3545 (Chapters on Medicine), that mentions medicine and the physician, pain. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3545، جس میں طب اور طبیب، درد کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3545 (Capítulos sobre Medicina), menciona la medicina, al médico y el dolor. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3545 (Chapitres sur la médecine), mentionne la médecine, le médecin et la douleur. Le Répertoire des sources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3545 numaralı hadiste tıp, hekim ve ağrıdan bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3545, menyebutkan tentang pengobatan, dokter, dan rasa sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
