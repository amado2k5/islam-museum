text: "… الكبير، وحاشية الدسوقي نَقيع - ما أسكر كثيره فقليله حرام. وقال الحنفية: نقيع الزبيب وهو المتخذ من ماء الزبيب مكروه تحريماً إذا اشتد وغلى، إلا أن حرمة هذه الأشربة دون حرمة الخمر حتى لا يكفر مستحلها، ويكفر مستحل الخمر، لأن …"
