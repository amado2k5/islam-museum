label: { ar: "سنن ابن ماجه 1423 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Sunan Ibn Majah 1423 — ranks raised; bad deeds erased and sins shed", ur: "سنن ابن ماجہ 1423 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sunan Ibn Majah 1423 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Sunan Ibn Majah 1423 — les rangs s'élèvent; les mauvaises actions sont effacées et les péchés sont absous", tr: "Sunan İbn Majah 1423 — Rütbeleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Sunan Ibn Majah 1423 — Meningkatkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "… لَهُ حَدِّثْنِي حَدِيثًا عَسَى اللَّهُ أَنْ يَنْفَعَنِي بِهِ. قَالَ فَسَكَتَ ثُمَّ عُدْتُ فَقُلْتُ مِثْلَهَا فَسَكَتَ ثَلاَثَ مَرَّاتٍ فَقَالَ لِي عَلَيْكَ بِالسُّجُودِ لِلَّهِ فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" مَا مِنْ عَبْدٍ يَسْجُدُ لِلَّهِ سَجْدَةً إِلاَّ رَفَعَهُ اللَّهُ بِهَا دَرَجَةً وَحَطَّ عَنْهُ بِهَا خَطِيئَةً \". قَالَ مَعْدَانُ ثُمَّ لَقِيتُ أَبَا الدَّرْدَاءِ فَسَأَلْتُهُ فَقَالَ مِثْلَ ذَلِكَ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1423، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1423 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1423، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1423 (Establecimiento de la oración y la Sunnah al respecto), habla de ascensos de rango, borrado de malas acciones y perdón de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 1423 (Établissement de la prière et de la Sunna à ce sujet), évoque l'élévation de grade, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "İbn Majah'ın Sünen'inde yer alan 1423 numaralı hadis, derecelerin yükseltilmesinden, günahların silinmesinden ve zulümlerin kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1423, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
