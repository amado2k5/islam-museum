label: { ar: "الموطأ 879 — مالك: رأى بعض أهل العلم إذا اعتكفوا العشر الأواخر من رمضان لا يرجعون إلى أهاليهم حتى يشهدوا الفطر مع الناس، وهذا أحب ما سمع إليه", en: "Muwatta 879" }
summary:
  ar: "يرويه زياد عن مالك أنه رأى بعض أهل العلم إذا اعتكفوا العشر الأواخر من رمضان لا يرجعون إلى أهاليهم حتى يشهدوا الفطر مع الناس، وبلغه ذلك عن أهل الفضل الذين مضوا، وقال: وهذا أحب ما سمعت إلي في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (875) وسويد (448)، وأن في نسختي ص ون «أهل العلم والفضل». {cite:muwatta-maruf-1997 p.423}"
