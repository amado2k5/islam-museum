label: { ar: "الموطأ 879 — مالك: رأى بعض أهل العلم إذا اعتكفوا العشر الأواخر من رمضان لا يرجعون إلى أهاليهم حتى يشهدوا الفطر مع الناس، وهذا أحب ما سمع إليه", en: "Muwatta 879", es: "Muwatta 879", fr: "Muwatta 879", ur: "موطا 879", tr: "El-Muvatta 879 — Malik: Bazı âlimler, Ramazan'ın son on gününde itikaf yapanların, insanlarla birlikte iftarı görmeden ailelerinin yanına dönmemeleri gerektiği görüşünü savunmuşlardır ve bu, onun işittiği en meziyetli görüştür.", id: "Al-Muwatta 879 — Malik: Sebagian ulama berpendapat bahwa jika mereka melakukan i'tikaf selama sepuluh hari terakhir Ramadan, mereka tidak boleh kembali ke keluarga mereka sampai mereka menyaksikan berbuka puasa bersama orang banyak, dan ini adalah pendapat yang paling utama yang pernah ia dengar." }
summary:
  ar: "يرويه زياد عن مالك أنه رأى بعض أهل العلم إذا اعتكفوا العشر الأواخر من رمضان لا يرجعون إلى أهاليهم حتى يشهدوا الفطر مع الناس، وبلغه ذلك عن أهل الفضل الذين مضوا، وقال: وهذا أحب ما سمعت إلي في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (875) وسويد (448)، وأن في نسختي ص ون «أهل العلم والفضل». {cite:muwatta-maruf-1997 p.423}"
  tr: "Ziyad, Malik'ten rivayet eder ki, Ramazan'ın son on gününde itikaf yapan bazı âlimlerin, oruçlarını insanlarla birlikte açmadan ailelerinin yanına dönmediklerini görmüştür. Bu uygulamayı vefat etmiş olan erdemli insanlardan duymuş ve şöyle demiştir: \"Bu konuda duyduğum en hoş şey budur.\" Editör, bunun Malik'ten Ebu Mus'ab (875) ve Suveyd (448) tarafından rivayet edildiğini ve benim kopyalarımda metnin \"ilim ve erdem sahibi insanlar\" şeklinde olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.423}"
  id: "Ziyad meriwayatkan dari Malik bahwa ia melihat beberapa ulama yang, ketika mereka melakukan i'tikaf pada sepuluh hari terakhir Ramadan, tidak akan kembali kepada keluarga mereka sampai mereka menyaksikan berbuka puasa bersama orang banyak. Ia mendengar tentang kebiasaan ini dari orang-orang saleh yang telah meninggal dunia, dan ia berkata: \"Ini adalah hal yang paling menyenangkan yang pernah kudengar mengenai masalah ini.\" Editor menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus'ab (875) dan Suwaid (448), dan bahwa dalam salinan saya, teksnya berbunyi \"orang-orang yang berilmu dan berbudi luhur.\" {cite:muwatta-maruf-1997 p.423}"
