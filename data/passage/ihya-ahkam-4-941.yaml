text: "… أولى بأن لا يؤخذ عليها أجر فإن أخذ رزقا ً من مسجد قد وقف على من يقوم بإمامته أو من السلط ان أو آحاد الناس فلا يحكم بتحريمه ولكنه مكروه والكراهية في الفرائض أشد منها في التراويح وتكون أجرة له …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 941، يرد فيه ذكر الفريضة والفرائض، والمكروه، والكراهة، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 941, whose wording mentions the obligation (farida), the disliked (makruh), dislike (karaha), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 941 کا اقتباس جس میں فریضہ اور فرائض، مکروہ، کراہت، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din de al-Ghazali, volume numérisé 4, p. 941, dont le texte mentionne l'obligation (farida), le réprouvé (makruh), la réprobation (karaha), l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen digitalizado 4, p. 941, cuyo texto menciona la obligación (farida), lo reprobado (makruh), la reprobación (karaha), la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 941. sayfasından, farz olan ameller, mekruh olan ameller ve haram olan ameller hakkında bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Jilid 4, halaman 941, yang membahas amalan wajib, amalan makruh, dan amalan haram. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan makruh, amalan haram, dan dosa-dosa kecil."
