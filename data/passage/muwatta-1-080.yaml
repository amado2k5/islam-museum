label: { ar: "الموطأ 80 — ابن عمر ينكر على سعد المسح على الخفين فيحتكمان إلى عمر", en: "Muwatta 80" }
text: "إذا أدخلت رجليك في الخفين وهما طاهرتان فامسح عليهما"
summary:
  ar: "يرويه مالك عن نافع وعبد الله بن دينار، كلاهما عن عبد الله بن عمر، في باب ما جاء في المسح على الخفين: قدم ابن عمر الكوفة على أميرها سعد بن أبي وقاص فرآه يمسح على الخفين فأنكر عليه، فقال له سعد: سل أباك إذا قدمت عليه. فنسي ابن عمر أن يسأل حتى قدم سعد وذكّره، فسأل عمر، فقال: إذا أدخلت رجليك في الخفين وهما طاهرتان فامسح عليهما. فقال ابن عمر: وإن جاء أحدنا من الغائط؟ فقال عمر: نعم، وإن جاء أحدكم من الغائط. ويذكر المحقق أن القصة معروفة مشهورة رواها عبد الرزاق وابن أبي شيبة موقوفة، وأن البخاري (202) روى مسألة المسح على الخفين مرفوعة من حديث أبي سلمة عن ابن عمر. {cite:muwatta-maruf-1997 p.77} {cite:muwatta-maruf-1997 p.78}"
