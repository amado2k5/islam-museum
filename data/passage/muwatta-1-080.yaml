label: { ar: "الموطأ 80 — ابن عمر ينكر على سعد المسح على الخفين فيحتكمان إلى عمر", en: "Muwatta 80", es: "80 Muwatta", fr: "80 Muwatta", ur: "80 موطا", tr: "El-Muvatta 80 — İbn Ömer, Sa'd'ı çorapların üzerine silmesinden dolayı azarlar ve böylece anlaşmazlıklarını Ömer'e götürürler.", id: "Al-Muwatta 80 — Ibn Umar menegur Sa’d karena mengusap kaus kaki, sehingga mereka membawa perselisihan mereka kepada Umar." }
text: "إذا أدخلت رجليك في الخفين وهما طاهرتان فامسح عليهما"
summary:
  ar: "يرويه مالك عن نافع وعبد الله بن دينار، كلاهما عن عبد الله بن عمر، في باب ما جاء في المسح على الخفين: قدم ابن عمر الكوفة على أميرها سعد بن أبي وقاص فرآه يمسح على الخفين فأنكر عليه، فقال له سعد: سل أباك إذا قدمت عليه. فنسي ابن عمر أن يسأل حتى قدم سعد وذكّره، فسأل عمر، فقال: إذا أدخلت رجليك في الخفين وهما طاهرتان فامسح عليهما. فقال ابن عمر: وإن جاء أحدنا من الغائط؟ فقال عمر: نعم، وإن جاء أحدكم من الغائط. ويذكر المحقق أن القصة معروفة مشهورة رواها عبد الرزاق وابن أبي شيبة موقوفة، وأن البخاري (202) روى مسألة المسح على الخفين مرفوعة من حديث أبي سلمة عن ابن عمر. {cite:muwatta-maruf-1997 p.77} {cite:muwatta-maruf-1997 p.78}"
  tr: "Malik, çorapların üzerinden silme konusunda rivayet edilenler bölümünde, Nafi' ve Abdullah ibn Dinar'dan, her ikisi de Abdullah ibn Ömer'den naklettiği bir rivayetle şöyle aktarmıştır: İbn Ömer, Kufa valisi Sa'd ibn Abi Waqqas'ın yanına gitti ve onu çoraplarının üzerinden sildiğini gördü. Bunu onaylamadı, bunun üzerine Sa'd ona: \"Babana geldiğinde sor.\" dedi. İbn Ömer sormayı unuttu, ta ki Sa'd gelip hatırlatana kadar. Bunun üzerine Sa'd Ömer'e sordu, o da: \"Ayaklarını çorapların içine koyarsan ve çoraplar temizse, üzerlerinden silin.\" dedi. İbn Ömer: \"Peki ya sizden biri tuvaletten gelirse?\" dedi. Ömer: \"Evet, sizden biri tuvaletten gelirse.\" dedi. Araştırmacı, hikâyenin iyi bilinen ve yaygın olarak aktarılan bir rivayet olduğunu, Abdül-Razzak ve İbn Abi Şeybe tarafından İbn Ömer'in sözü olarak nakledildiğini ve Buhari'nin (202) çorap üzerine silme meselesini, İbn Ömer'den rivayet edilen Ebu Seleme'den nakledilen bir hadis olarak Peygamber'e dayandırdığını belirtiyor. {cite:muwatta-maruf-1997 s.77} {cite:muwatta-maruf-1997 s.78}"
  id: "Malik meriwayatkannya dari Nafi' dan Abdullah ibn Dinar, keduanya dari Abdullah ibn Umar, dalam bab tentang apa yang diriwayatkan mengenai mengusap kaus kaki: Ibnu Umar datang ke Kufa menemui gubernurnya, Sa'd ibn Abi Waqqas, dan melihatnya mengusap kaus kakinya. Ia tidak menyetujui hal itu, lalu Sa'd berkata kepadanya: Tanyakan kepada ayahmu ketika kau datang menemuinya. Ibnu Umar lupa bertanya sampai Sa'd datang dan mengingatkannya. Maka ia bertanya kepada Umar, yang berkata: Jika kau memasukkan kakimu ke dalam kaus kaki dan kaus kaki itu bersih, maka usaplah. Ibnu Umar berkata: Bahkan jika salah seorang dari kita baru saja buang air besar? Umar berkata: Ya, bahkan jika salah seorang dari kalian baru saja buang air besar. Peneliti menyebutkan bahwa kisah ini terkenal dan tersebar luas, diriwayatkan oleh Abd al-Razzaq dan Ibn Abi Shaybah sebagai pernyataan Ibn Umar, dan bahwa al-Bukhari (202) meriwayatkan masalah mengusap kaus kaki sebagai hadits yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) atas otoritas Abu Salamah atas otoritas Ibn Umar. {cite:muwatta-maruf-1997 p.77} {cite:muwatta-maruf-1997 p.78}"
