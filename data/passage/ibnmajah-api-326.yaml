label: { ar: "سنن ابن ماجه 326 — الأب والأبوة", en: "Sunan Ibn Majah 326 — the father and fatherhood", ur: "سنن ابن ماجہ 326 — باپ اور والدیت", es: "Sunan Ibn Majah 326 — El padre y la paternidad" }
text: "… بْنُ مُحَمَّدٍ، حَدَّثَنَا وَكِيعٌ، ح وَحَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ حَدَّثَنَا زَمْعَةُ بْنُ صَالِحٍ، عَنْ عِيسَى بْنِ يَزْدَادَ الْيَمَانِيِّ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" إِذَا بَالَ أَحَدُكُمْ فَلْيَنْتُرْ ذَكَرَهُ ثَلاَثَ مَرَّاتٍ \". قَالَ أَبُو الْحَسَنِ بْنُ سَلَمَةَ حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ الْعَزِيزِ، حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا زَمْعَةُ، فَذَكَرَ نَحْوَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 326، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 326 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 326، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 326 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
