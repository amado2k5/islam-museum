text: "… • فِي أَدْنَى الْأَرْضِ قَالَ: غُلبَتْ وَغَلبتْ. قَالَ: كَانَ المُشْرِكُونَ يُحِبُّونَ أَنْ يَظْهَرَ أَهْلُ فَارِسَ عَلَى الرُّوم لِأَنَّهُمْ وَإِيَّاهُمْ أَهْلُ الأَوْثَانِ وَكَانَ المُسْلِمُونَ يُحِبُّونَ أَنْ يَظْهَرَ الرُّومُ عَلَى فَارِسَ لأَنَّهُمْ أَهْلُ الكِتَابِ، فَذَكَرُوهُ لأَبِي بَكْرِ فَذَكَرَهُ لِيله فَقَالَ : أمَا …"
