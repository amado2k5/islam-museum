ref: "1686"
label: { ar: "موطأ مالك 1686 — الأب والأبوة", en: "Muwatta Malik 1686 — the father and fatherhood", ur: "موطأ مالک 1686 — باپ اور والدیت", es: "Muwatta Malik 1686 — el padre y la paternidad", fr: "Muwatta Malik 1686 — le père et la paternité", tr: "Muwatta Malik 1686 — Baba ve Babalık", id: "Muwatta Malik 1686 — Sang Ayah dan Peran Ayah" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ عَامِرِ بْنِ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يَشْرَبُ قَائِمًا."
summary:
  ar: "حديث في موطأ مالك، رقم 1686، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1686 (The Description of the Prophet, may Allah Bless Him and Grant Him Peace), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1686، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1686 (Descripción del Profeta), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 1686 (La biographie du Prophète, que la paix et la bénédiction d'Allah soient sur lui), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Malik'in Muwatta'sında yer alan 1686 numaralı hadis, baba ve babalık kavramından bahsetmektedir. Araştırmacı, bu hadisi İslam'da babalık bölümünde, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1686, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits ini dalam bagian tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
