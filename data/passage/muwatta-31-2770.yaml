label: { ar: "الموطأ 2770 — نافع عن ابن عمر: إذا عطس فقيل له يرحمك الله يقول يرحمنا الله وإياكم", en: "Muwatta 2770", es: "Muwatta 2770", fr: "Muwatta 2770", ur: "موطا 2770", tr: "El-Muvatta 2770 — Nafi'nin İbn Ömer'den rivayet ettiğine göre: Bir kimse hapşırdığında kendisine, \"Allah sana rahmet etsin\" denirse, o kişi, \"Allah bize ve size rahmet etsin\" demelidir.", id: "Al-Muwatta 2770 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Jika seseorang bersin dan diberi tahu, “Semoga Allah merahmatimu,” maka hendaklah ia menjawab, “Semoga Allah merahmati kami dan kamu.”" }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان إذا عطس، فقيل له: يرحمك الله. قال: يرحمنا الله وإياكم، ويغفر لنا ولكم. {cite:muwatta-maruf-1997 p.555}"
  tr: "Malik, Nafi'den rivayetle, Abdullah ibn Umar'ın hapşırdığı zaman birinin ona, \"Allah sana rahmet etsin\" demesi üzerine, \"Allah bize ve size rahmet etsin, bizi ve sizi bağışlasın\" diye cevap verdiğini anlatır. {cite:muwatta-maruf-1997 s.555}"
  id: "Malik meriwayatkan dari Nafi’ bahwa ketika Abdullah ibn Umar bersin dan seseorang berkata kepadanya, “Semoga Allah merahmatimu,” dia akan menjawab, “Semoga Allah merahmati kami dan kamu, dan mengampuni kami dan kamu.” {cite:muwatta-maruf-1997 p.555}"
