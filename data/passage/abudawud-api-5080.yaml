label: { ar: "سنن أبي داود 5080 — الأب والأبوة", en: "Sunan Abi Dawud 5080 — the father and fatherhood", ur: "سنن ابی داؤد 5080 — باپ اور والدیت", es: "Sunan Abi Dawud 5080 — El padre y la paternidad", fr: "Sunan Abi Dawud 5080 — le père et la paternité" }
text: "… قَالُوا حَدَّثَنَا الْوَلِيدُ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ حَسَّانَ الْكِنَانِيُّ، قَالَ حَدَّثَنِي مُسْلِمُ بْنُ الْحَارِثِ بْنِ مُسْلِمٍ التَّمِيمِيُّ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ قَالَ نَحْوَهُ إِلَى قَوْلِهِ \" جِوَارٌ مِنْهَا \". إِلاَّ أَنَّهُ قَالَ فِيهِمَا \" قَبْلَ أَنْ تُكَلِّمَ أَحَدًا \". قَالَ عَلِيُّ بْنُ سَهْلٍ فِيهِ إِنَّ أَبَاهُ حَدَّثَهُ وَقَالَ عَلِيٌّ وَابْنُ الْمُصَفَّى بَعَثَنَا رَسُولُ اللَّهِ فِي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5080، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5080 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5080، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5080 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 5080 (Comportement général), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
