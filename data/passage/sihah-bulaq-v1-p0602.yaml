text: |-
  ⁦(فصل الجيم)⁩
  ٣٩
  والتجنيب أيضا انحناء وتوتير فى رجل الفرس وهو مستحب قال أبودواد
  وفى المدين اذا ما الماءأسهلنا * ثنى قليل وفى الرجلين نجنيب
  والجنيبة الدابة تقاد وكل طائع منقاد جنيب والاجنب الذى لا ينقاد والجنيبة العليقة
  وهى النساقسة تعطيها القوم ليمتاروالك عليها قال الراجز ركابه فى القوم كالجنائب
  أى ضائعة لانه ليس عمصلح لماله والجنيب الغريب وجنب فلان فى بنى فلان يجنب جنسابة
  اذا نزل فيهم غريباذ، وجانب والجمع جناب يقال نعم القومهم الجار الجنابة أى لجار
  الغر بة وقول الشاعر علقمة بن عبدة
  فلا تحرمى ناتلاعن جنابة * فانى امرؤوسط القباب غريب
  أى عن بعد والجنبة جلدة من جنب البعيريقال أعطنى جنبة أتخذمنها علبة ونزل ولان
  جنبة أى ناحية واعتزل الناس والجنبة اسم اكل نبت يتربل فى الصيف يقال معر نا مطرا
  كثرت منه الجنبة ورجل جنب من الجنابة يستوى فيه الواحد والجمع والمؤنث وربى هالوا
  فى جعه أجناب وجنبون تقول منه أجنب الرجل وجنب أيضا بالضم والجنوب الريح التى
  تقابل الشمال تقول جنبت الريح اذا تحوّات جنو باوحابة مجنوية اذاهبت بها الجنوب
  والمجنوب الذى به ذات الجنب وهى قرحة تصيب الانسان داخل جنبه وقد جنب وأجنب
  القوم اذادخلوا فى ريح الجنوب وجنبوا ايضا اذا أصابهم الجنوب فهم مجنوبون وكذلك
  القول فى الصباوالدبوروالشمال والمجنب بالكسر الترس وقال ساعدة بن جؤية الهذلى
  يصف منتارالعمل
  الجنب أينا أقسى أرتت الجسم إلى أرضن العسرب وأ دقى أرض العرب الى أرش العجم
  قال الكميت بمعترك الطف فالمجنب والمجنب بالفتح الشئء الكثير يقال ان عند نالخيرا
  مجنبا وشرامجنبا أى كثيرا! والجنب بالتحريك الذى نم سى عنه أن يجنب الرجل مع فرسه عند
  الرهان فرسا آخر لكى يتحوّل عليه ان خاف أن يسبق على الاوّل والجنب أيضا مصدر قولكْ
  جنب البعير بالكسر يجنب جنبا اذاظلع من جنبه قال الاصمعى هو أن تلتصق رئنه بجنبه
  من شدّة العطس قال اين السكيت وقاات الاعراب هو أن يلتوى من شبدّة العطس
  قاك ذوالرمة يصف حمارا كأنه مستبان الشك أوجنب وقال أيضا
  هاجت به جوّع غضف مخصرة * شوازب لاحها التقريب والجنب
  ( ⁦(جوب )⁩ الجواب معروف يقال اجابه وأجاب عن سؤاله والمصدر الاجابة والاسم الجابة
  بمنزلة الطاعة والطاقة يقال أساء سموافأساء جابة هكذايتكام بم-ذا الحرف والاجابة
  والاستجابة بمعنى يقال استجاب اللّٰه دعاءه قال الشاءر كعب بن سعد الغنوى
  وداع دعايا من يجيب الى الندى • فلم يستجبه عندذ اك مجيب
  والمجاوية والتجاوب التحاور وتقول انه لحسن الجيبة بالكسر أى الجواب ورجل ناصح
  الجيب أى أمين والجيب للقميص تقول جبت القميص أجو به واجيبه اذا قورت جيبه
  قال الراجز
  بانت تجيب أدعج الظلام * جيب البيطر مدرع الهمام
