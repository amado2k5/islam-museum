  المقفز كأنه ألبس القفازين ( ز قال الاصعى القمزالرذال الذى لاخيرفيه وأنشد
  أخدت بكرانفزامن النقز • وتاب سوءقزامن القمز
  والتمزة بالضم مثل الجزة وهى كلة من التمر قوز) القوز بالفتح الكنيب الصغير عن
  أبى عبيدة وابهع أقواز وقيزان وأنتدلذى الرمة
