label: { ar: "الموطأ 407 — ابن عمر يعود عبد الله بن صفوان فيصلي بهم ركعتين ثم يتمون", en: "Muwatta 407", es: "Muwatta 407", fr: "Muwatta 407", ur: "موطا 407", tr: "El-Muvatta 407 — İbn Ömer, Abdullah bin Safvan'ın yanına döner ve onlara iki rekat namaz kıldırır, sonra namazı tamamlarlar.", id: "Al-Muwatta 407 — Ibnu Umar kembali kepada Abdullah bin Safwan dan memimpin mereka dalam dua rakaat salat, kemudian mereka menyelesaikannya" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن صفوان بن عبد الله بن صفوان، في باب صلاة المسافر إذا كان إماماً أو كان وراء إمام: جاء عبد الله بن عمر يعود عبد الله بن صفوان فصلى بهم ركعتين ثم انصرف، فقاموا فأتموا لأنهم مقيمون. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي وعبد الرزاق. {cite:muwatta-maruf-1997 p.213} {cite:muwatta-maruf-1997 p.214}"
  tr: "İbn Şihab'tan, o da Safvan ibn Abdullah ibn Safvan'dan rivayet edilen ve Malik'in, bir yolcunun imamlık yaparken veya imamın arkasında namaz kılarkenki namazı bölümünde geçen bir rivayete göre: Abdullah ibn Ömer, Abdullah ibn Safvan'ı ziyarete geldi ve onlara iki rekat namaz kıldırdı, sonra ayrıldı. Onlar da orada ikamet ettikleri için ayağa kalkıp namazı tamamladılar. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve İbn Vahb tarafından, el-Tahavi ve Abdül-Razzak tarafından da kaydedilerek nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.213} {cite:muwatta-maruf-1997 s.214}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Ibn Shihab dari Safwan ibn Abdullah ibn Safwan, dalam surah tentang shalat seorang musafir ketika ia memimpin shalat atau shalat di belakang imam: Abdullah ibn Umar datang mengunjungi Abdullah ibn Safwan dan memimpin mereka dalam dua rakaat shalat, kemudian ia pergi. Mereka kemudian berdiri dan menyelesaikan shalat karena mereka adalah penduduk setempat. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwaid, dan Ibn Wahb, sebagaimana dicatat oleh al-Tahawi dan Abd al-Razzaq. {cite:muwatta-maruf-1997 p.213} {cite:muwatta-maruf-1997 p.214}"
