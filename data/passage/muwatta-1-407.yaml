label: { ar: "الموطأ 407 — ابن عمر يعود عبد الله بن صفوان فيصلي بهم ركعتين ثم يتمون", en: "Muwatta 407" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن صفوان بن عبد الله بن صفوان، في باب صلاة المسافر إذا كان إماماً أو كان وراء إمام: جاء عبد الله بن عمر يعود عبد الله بن صفوان فصلى بهم ركعتين ثم انصرف، فقاموا فأتموا لأنهم مقيمون. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي وعبد الرزاق. {cite:muwatta-maruf-1997 p.213} {cite:muwatta-maruf-1997 p.214}"
