label: { ar: "نوادر جحا الكبرى، ص 88 — «لا تجعليه رقيقاً فيقطع»", en: "Nawadir Juha al-Kubra, p. 88 — 'Do Not Make It Thin or It Will Break'", ur: "نوادر جحا الکبریٰ، ص 88 — «اسے باریک نہ کرو ورنہ ٹوٹ جائے گا»", fr: "Nawadir Juha al-Kubra, p. 88 — « Ne le fais pas fin, il casserait »", es: "Nawadir Juha al-Kubra, p. 88 — «No lo hagas fino, que se rompe»", tr: "Juha'nın Büyük Fıkraları, s. 88 — “Çok ince yapmayın, yoksa kırılır.”", id: "Anekdot Hebat Juha, hlm. 88 — “Jangan membuatnya terlalu tipis, atau akan patah.”" }
text: "… لا تجعليهِ رقيقاً فيُقطع تقدمت إليه امرأتان فاتنتان عندما كان قاضياً في سيوري حصار فقالت الخوان: مائدة الطعام. أفاويه : بهارات. يشيّعه : يودّعه بنظراته. تتضوّع: تنتشر."
summary:
  ar: "بينما كان جحا قاضيًا في سيوري حصار جاءته امرأتان، الأولى تشكو أن خيطًا غُزل رفيعًا جدًا لشعرها، والثانية تشكو أنه لم يكن بالسُّمك المطلوب؛ فقال جحا إن الخيط يجب ألا يكون سميكًا ولا رفيعًا حتى لا ينقطع، كقلب شيخهما. {cite:juha-nawadir-kubra-djuwaydi p. 88}"
  en: "While Juha is judge in Siwri Hisar two women come to him: one complains a thread was spun too thin for her hair, the other that it was not as thick as ordered; Juha says the thread should be neither too thick nor too thin lest it snap, like the heart of their Shaykh. {cite:juha-nawadir-kubra-djuwaydi p. 88}"
  ur: "جب جحا سیوری حصار میں قاضی تھا تو اس کے پاس دو عورتیں آئیں: ایک نے شکایت کی کہ اس کے بالوں کے لیے دھاگا بہت باریک کاتا گیا، دوسری نے کہ وہ مطلوبہ موٹائی کا نہیں تھا؛ جحا نے کہا کہ دھاگا نہ بہت موٹا ہونا چاہیے نہ بہت باریک تاکہ ٹوٹ نہ جائے، جیسے ان کے شیخ کا دل۔ {cite:juha-nawadir-kubra-djuwaydi p. 88}"
  fr: "Alors que Juha est juge à Siwri Hisar, deux femmes viennent le voir: l'une se plaint qu'un fil ait été filé trop fin pour ses cheveux, l'autre qu'il n'ait pas l'épaisseur commandée; Juha dit que le fil ne doit être ni trop épais ni trop fin pour ne pas casser, comme le cœur de leur cheikh. {cite:juha-nawadir-kubra-djuwaydi p. 88}"
  es: "Mientras Juha es juez en Siwri Hisar, se le acercan dos mujeres: una se queja de que un hilo se hiló demasiado fino para su cabello, la otra de que no tenía el grosor pedido; Juha dice que el hilo no debe ser ni demasiado grueso ni demasiado fino para que no se rompa, como el corazón de su jeque. {cite:juha-nawadir-kubra-djuwaydi p. 88}"
  tr: "Juha, Siuri Hisar'da yargıçlık yaparken iki kadın ona geldi. Birincisi, saçları için eğrilen ipliğin çok ince olduğundan, ikincisi ise yeterince kalın olmadığından şikayet etti. Juha, ipliğin çok kalın veya çok ince olmaması gerektiğini, aksi takdirde şeyhlerinin kalbi gibi kırılabileceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 88}"
  id: "Ketika Juha menjadi hakim di Siuri Hisar, dua wanita datang kepadanya. Yang pertama mengeluh bahwa benang yang dipintal untuk rambutnya terlalu tipis, dan yang kedua mengeluh bahwa benang itu tidak cukup tebal. Juha berkata bahwa benang itu tidak boleh terlalu tebal atau terlalu tipis, agar tidak putus, seperti hati syekh mereka. {cite:juha-nawadir-kubra-djuwaydi p. 88}"
