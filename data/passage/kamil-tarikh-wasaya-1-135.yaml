text: "… هوازن!. وقال شَيْبة بن عثمان: اليوم أُدرِك ثاري من محمّد، وكان أبوه قُتل بأحُد، قال: فأدرتُ به لأقتله، فأقبل شيء حتى تغشّى فُؤآدي، فلم أُطِقْ ذلك. وكان العبّاس مع النبيّ، وَلِ، آخذاً بحَكمَة بغلته دُلْدُل وهو عليها، وكان العبّاس جسيما …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 135، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 135, that mentions a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 135 کا اقتباس جس میں محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Kamil fi al-Tarikh de Ibn al-Athir, volumen 1, pág. 135, que menciona una reliquia conservada tras su propietario; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre d'Ibn al-Athir, al-Kamil fi al-Tarikh (tome 1, p. 135), mentionnant une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire Testaments Browser."
  tr: "İbn el-Athir'in El-Kamil fi el-Tarikh adlı eserinin 1. cildinin 135. sayfasında, makineyle okunabilir taranmış kopyadan alınan bir alıntıda, korunmuş bir eserden bahsedilmektedir. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Kamil fi al-Tarikh karya Ibn al-Athir, Volume 1, halaman 135, menyebutkan sebuah artefak yang terpelihara; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
