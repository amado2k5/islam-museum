text: "وفيها بعث رسول الله، عَلِلفي العلاء بن الحضرميّ إلى البحرين وبها المنذر بن ساوَى، فصالح المنذر على أنّ على المجوس الجزية، ولا تؤكل ذبائحهم و لا تُنكح نساؤهم. وقيل: إنّ إرساله كان سنة ستٍ من الهجرة، مع الرسل الذين أرسلهم …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 108، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
