text: "لأَقْضِيَنَّ فِيكَ بِقَضِيَّةِ رَسُولِ اللَّهِ صلى الله عليه وسلم إِنْ كَانَتْ أَحَلَّتْهَا لَكَ جَلَدْتُكَ مِائَةً وَإِنْ لَمْ تَكُنْ أَحَلَّتْهَا لَكَ رَجَمْتُكَ بِالْحِجَارَةِ ‏.‏ فَوَجَدُوهُ قَدْ أَحَلَّتْهَا لَهُ فَجَلَدَهُ مِائَةً ‏.‏ قَالَ قَتَادَةُ كَتَبْتُ إِلَى حَبِيبِ بْنِ سَالِمٍ فَكَتَبَ إِلَىَّ بِهَذَا ‏.‏"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
