text: "… أن أذكر أطرافاً منها مختصرة. كان جلوسه لعبادة من اعتكاف أو قراءة علم أو سماع موعظة أو انتظار صلاه أو نحو ذلك كان مستحباً، وإن لم يكن لشيء من ذلك كان مباحاً، وقال بعض أصحابنا: إنه مكروه وهو ضعيف. الثانية: …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 287، يرد فيه ذكر المستحب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 287, whose wording mentions the recommended (mustahabb), the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
