text: "… أن أذكر أطرافاً منها مختصرة. كان جلوسه لعبادة من اعتكاف أو قراءة علم أو سماع موعظة أو انتظار صلاه أو نحو ذلك كان مستحباً، وإن لم يكن لشيء من ذلك كان مباحاً، وقال بعض أصحابنا: إنه مكروه وهو ضعيف. الثانية: …"
