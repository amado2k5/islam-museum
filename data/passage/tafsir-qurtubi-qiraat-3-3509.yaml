text: "… حكى سيبويه والخليل أن العرب تقول: لا أدرٍ، فتحذف الياء وتجتزىء بالكسرة، إلا أنهم يزعمون أن ذلك لكثرة الاستعمال. قال الزجاج: والأجود في النحو إثبات الياء؛ قال : والذي أراه أتباع المصحف وإجماع القراء؛ لأن القراءة سنّة ؛ وقد جاء …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 3509، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 3509, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 3509 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Qurtubi, al-Jami' li-Ahkam al-Qur'an, volumen 3, pág. 3509, que menciona las lecturas del Corán, los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Jami' li-Ahkam al-Qur'an d'al-Qurtubi (tome 3, p. 3509), numérisé, mentionnant les lectures du Coran, les lecteurs, sa compilation et les codex. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
