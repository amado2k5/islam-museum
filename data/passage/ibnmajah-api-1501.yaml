label: { ar: "سنن ابن ماجه 1501 — المباح", en: "Sunan Ibn Majah 1501 — the permitted (mubah)", ur: "سنن ابن ماجہ 1501 — مباح", fr: "Sunan Ibn Majah 1501 — le permis (mubah)", es: "Sunan Ibn Mayah 1501 — lo permitido (mubah)", tr: "Sünen İbn Mace 1501 — Mubah", id: "Sunan Ibnu Majah 1501 — Al-Mubah" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ سَعِيدٍ، حَدَّثَنَا حَفْصُ بْنُ غِيَاثٍ، عَنْ حَجَّاجٍ، عَنْ أَبِي الزُّبَيْرِ، عَنْ جَابِرٍ، قَالَ مَا أَبَاحَ لَنَا رَسُولُ اللَّهِ ـ وَلاَ أَبُو بَكْرٍ وَلاَ عُمَرُ فِي شَىْءٍ مَا أَبَاحُوا فِي الصَّلاَةِ عَلَى الْمَيِّتِ. يَعْنِي لَمْ يُوَقِّتْ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1501، يرد فيه ذكر المباح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 1501 (Chapters Regarding Funerals), whose wording mentions the permitted (mubah). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1501، جس کے الفاظ میں مباح کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 1501, dont le texte mentionne le permis (mubah). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 1501, cuyo texto menciona lo permitido (mubah). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Majah'ın Sünen'inde 1501 numaralı hadis, caiz olan fiilleri sıralamaktadır. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahları derleyen kişi, bu hadisi Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlemiştir. Derleyen kişi metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1501, menyebutkan amalan-amalan yang diperbolehkan. Penyusun kitab tentang amalan wajib, anjuran, najis, dan dosa-dosa kecil ini menyusunnya bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
