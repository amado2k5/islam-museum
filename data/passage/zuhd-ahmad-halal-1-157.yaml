text: "… فسمع لغطهم ولغوهم يقول : أظن أن ليل هؤلاء ليل سوء. فالذنوب كلها تورث قساوة القلب وتمنع من قيام الليل وأخصها بالتأثير تناول الحرام، وتؤثر اللقمة الحلال في تصفية القلب وتحريكه إلى الخير ما لا يؤثر غيرها، ويعرف ذلك أهل …"
