  tr: "Gazali'nin El-Mustasfa adlı eserinin 1. cildinin 338. sayfasından, farz, haram ve itaat edilmesi gereken amelleri ele alan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Jilid 1, halaman 338, yang membahas amalan wajib, haram, dan taat; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk dosa-dosa wajib, anjuran, yang tidak disukai, yang haram, dan dosa-dosa kecil."
