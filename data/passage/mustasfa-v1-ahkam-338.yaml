text: "مسألة إذا عرفت : أن الحرام ضد الواجب، لأنه المقتضى تركه. والواجب هو المقتضى فعله. فلا يخفى عليك: أن الشيء الواحد يستحيل أن يكون واجباً حراماً، طاعة معصية. لكن، ربما تخفى عليك حقيقة الواحد. فالواحد ينقسم إلى: - واحد بالنوع. …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 338، يرد فيه ذكر الواجب، والحرام، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 338, whose wording mentions the obligatory (wajib), the forbidden (haram), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 338 کا اقتباس جس میں واجب، حرام، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, vol. 1 de al-Ghazali, p. 338, dont le texte mentionne l'obligatoire (wajib), l'interdit (haram), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
