text: "… نَصًّا؛ لأنَّه وَل ليو لم يَجعلِ الحُكمَ إلا لأمرِه ونَهيه فقَطّ، فما أمَرَ به فواحِبٌ أن يُؤتَىٰ منه بما يُستطاعُ، وما نَهانا عنه فواجِبٌ تركُه وما سَكتَ عنه فمَعفُوٌ عنه مُباحٌ النساء :. رواه مسلم من حديث أبي هريرة، وهو …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 440، يرد فيه ذكر الواجب، والمباح، وما سُكت عنه فهو عفو؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 440, whose wording mentions the obligatory (wajib), the permitted (mubah), what was passed over in silence and so pardoned; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 440 کا اقتباس جس میں واجب، مباح، جس سے سکوت کیا گیا وہ معاف ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 440, dont le texte mentionne l'obligatoire (wajib), le permis (mubah), ce qui fut passé sous silence et donc pardonné ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 440, cuyo texto menciona lo obligatorio (wajib), lo permitido (mubah), lo que se pasó en silencio y quedó dispensado; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
