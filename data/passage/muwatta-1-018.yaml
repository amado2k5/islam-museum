label: { ar: "الموطأ 18 — بلاغ عن أبي هريرة: من فاته أم القرآن فاته خير كثير", en: "Muwatta 18" }
text: "من أدرك الركعة فقد أدرك السجدة، ومن فاته قراءة أم القرآن فقد فاته خير كثير"
summary:
  ar: "بلاغ في باب من أدرك ركعة من الصلاة: يروي يحيى عن مالك أنه بلغه أن أبا هريرة كان يقول إن من أدرك الركعة فقد أدرك السجدة، ومن فاتته قراءة فاتحة الكتاب في الصلاة فقد فاته خير كثير. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.42}"
  en: "A report that reached Malik: whoever catches the rak'a has caught the prostration, and whoever misses the rak'a has missed the prayer."
