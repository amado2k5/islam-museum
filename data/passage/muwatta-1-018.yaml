label: { ar: "الموطأ 18 — بلاغ عن أبي هريرة: من فاته أم القرآن فاته خير كثير", en: "Muwatta 18", es: "Muwatta 18", fr: "Muwatta 18", ur: "موطا 18", tr: "El-Muvatta 18 — Ebu Hurayra'dan rivayet edildiğine göre: Kur'an'ın ilk suresini (El-Fatiha) okumayan kimse çok büyük bir hayırdan mahrum kalır.", id: "Al-Muwatta 18 — Sebuah riwayat dari Abu Hurairah: Barang siapa yang melewatkan Surah Pembuka Al-Quran (Al-Fatihah), maka ia kehilangan banyak kebaikan." }
text: "من أدرك الركعة فقد أدرك السجدة، ومن فاته قراءة أم القرآن فقد فاته خير كثير"
summary:
  ar: "بلاغ في باب من أدرك ركعة من الصلاة: يروي يحيى عن مالك أنه بلغه أن أبا هريرة كان يقول إن من أدرك الركعة فقد أدرك السجدة، ومن فاتته قراءة فاتحة الكتاب في الصلاة فقد فاته خير كثير. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.42}"
  en: "A report that reached Malik: whoever catches the rak'a has caught the prostration, and whoever misses the rak'a has missed the prayer."
  es: "Según un informe que llegó a oídos de Malik: quien recibe el rak'a ha recibido la postración, y quien no recibe el rak'a ha perdido la oración."
  fr: "D'après un récit parvenu à Malik: celui qui accomplit la rak'a a accompli la prosternation, et celui qui manque la rak'a a manqué la prière."
  ur: "ایک روایت جو مالک تک پہنچی: جس نے رکعت پکڑی اس نے سجدہ پکڑ لیا اور جس کی رکعت چھوٹ گئی اس نے نماز چھوڑ دی۔"
  tr: "Namazın bir rekatı tutan kimseyle ilgili bir rivayet: Yahya, Malik'ten naklederek Ebu Hurayra'nın şöyle dediğini işittiğini aktarır: \"Kim namazın bir rekatı tutarsa secde etmiş olur, kim de namazda Fatiha suresini okumayı kaçırırsa büyük bir hayırdan mahrum kalmış olur.\" Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından, el-Beyhaki'nin de kaydıyla nakledildiğini belirtir. {cite:muwatta-maruf-1997 s.42}"
  id: "Sebuah riwayat mengenai orang yang melewatkan satu rakaat salat: Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Abu Hurayrah biasa berkata, \"Siapa pun yang melewatkan satu rakaat salat telah melakukan sujud, dan siapa pun yang melewatkan membaca Al-Fatihah dalam salat telah kehilangan banyak kebaikan.\" Editor menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus'ab, Suwayd, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.42}"
