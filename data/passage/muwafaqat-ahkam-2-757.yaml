text: "… يظهر فيه قصد القربة فهو دليل على القدر المشترك بين الثلاثة، وإن ظهر فهو دليل على المشترك بين الواجب والمندوب. و ابن الحاجب قال: إن ظهر قصد القربة فالمختار أنه للندب، وإلا فللإباحة. أي : غير الطبيعة الجبلية، فإنه لا …"
