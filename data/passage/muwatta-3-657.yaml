text: "لا تجب في مال زكاة حتى يحول عليه الحول"
summary:
  ar: "يرويه مالك عن نافع، أن عبد الله بن عمر كان يقول: لا تجب في مال زكاة حتى يحول عليه الحول. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومحمد بن الحسن الشيباني (326)، وأنه روي مرفوعاً ولا يصح، ويحيل على الدارقطني (2/90). {cite:muwatta-maruf-1997 p.336}"
