label: { ar: "الموطأ 657 — ابن عمر: لا تجب في مال زكاة حتى يحول عليه الحول", en: "Muwatta 657", es: "Muwatta 657", fr: "Muwatta 657", ur: "موطا 657", tr: "El-Muvatta 657 — İbn Umar: Malın zekâtı, üzerinde bir yıl geçmeden farz değildir.", id: "Al-Muwatta 657 — Ibn Umar: Zakat tidak diwajibkan atas harta benda sampai setahun berlalu." }
text: "لا تجب في مال زكاة حتى يحول عليه الحول"
summary:
  ar: "يرويه مالك عن نافع، أن عبد الله بن عمر كان يقول: لا تجب في مال زكاة حتى يحول عليه الحول. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومحمد بن الحسن الشيباني (326)، وأنه روي مرفوعاً ولا يصح، ويحيل على الدارقطني (2/90). {cite:muwatta-maruf-1997 p.336}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın şöyle dediğini aktarmıştır: \"Zekât, mal üzerinden bir yıl geçmeden farz değildir.\" Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab, Suveyd, Şafiî'nin Musned'inde ve Muhammed ibn el-Hasan el-Şeybani'de (326) nakledildiğini ve Peygamber'e kadar uzanan bir hadis olarak rivayet edildiğini, ancak bunun sahih olmadığını belirtmektedir. El-Daraqutni'ye (2/90) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.336}"
  id: "Malik meriwayatkannya dari Nafi’, bahwa Abdullah ibn Umar biasa berkata: “Zakat tidak wajib atas harta benda sampai setahun berlalu.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, al-Shafi’i dalam Musnadnya, dan Muhammad ibn al-Hasan al-Shaybani (326), dan bahwa hadits ini diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi, tetapi ini tidak sahih. Ia merujuk pada al-Daraqutni (2/90). {cite:muwatta-maruf-1997 p.336}"
