text: "… القول جماعةٌ من السَّلف والخلف، وهو قولُ ابنِ المبارك وأحمد وإسحاق، وحكى إسحاق عليه إجماع أهل العلم، وقال محمد بن نصر المروزي : هو قولُ جمهور أهل الحديث. وذهبَ طائفةٌ منهم إلى أنَّ منْ تركَ شيئاً من أركان الإسلام الخمسة …"
