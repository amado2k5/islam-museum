  ذات مسم اذا كان عليها أثر ابجمال وفلان وسيم أى حسن الوجه وقوم وسام وامر أة وسيمة
  ونسوة وسام أيضامثل ظريفة وظراف وصيصة وصباح وومبم الرجل بالضم وسامة ووساما
  أيضا عجذف الهاء مثل جل جالاقال الكميت
  يتعرفن حزوجم عليه • عقبة السروظاهواد الوسام
  وقلان موسوم بانخير وقد توسمت فيه انلمير أى تفرست وواسمت فلانا فوسمته اذاغابته
  بالحسن واتسم الرجل اذا جعل لنفسه سمة يعرف بها وأصل التاء الواد شم وشم
  البدوشما اذا غرز هابابرة ثم ذرّ عليها النؤور وهو النسيلج والاشم أيضا الوشم والمع الوشام
  واستوشمه أى سأله أن يشمه وفى الحديث لعن اللّٰه الواشمة والمستوشمة ابن السكيت ماعصيته
  وشعة أى كلة وما أصابتنا العام وشمة أى قطرة مطر ويقال بينهما وشيمة أى كلام شر وعداوة
  وأوشمت الارض ظه رنياتها وأوثم البرق لمع لمساخفيقا قال أبو نيدهو أول البرق حين يبرق
  وأوشمت فى الشى نظرت فيه والوشم بلدذ وتخل به قبا آل من ربيعة ومضردون اليمامة قريب
  منها يقال لهوشم الناقة ( ⁦(صم)⁩ الوصم الصدع فى العود من غيربينونة بقال به-ذه
  القناة وصم وقدوضمت الشي اذاشددته بسرعة والوصم العيب والعاريقال مافى
  فلان وصحة وقال الشاعر .
  فان تك جرم ذات وصم قازا • دلفنا الى جرم بألام من جوم
  والتوصيم فى الجذ كالتكسير والفترة والكسل وقال لبيد
  واذارمت رحيلا فارتحل • واعص ما يأمر توصيم الكسل
  ويقال وصمته الهى قال الراجزه ولم تبت حى به توصمه• { وضم) الوضم كل
  شى يجعل عليه الليم من خشب أوبارية يوق بدمن الارض وقال الراجز
  ليس براعى ابل ولاغنم • ولايجزار على ظه والوضم
  وقد وضمت اللحم أضمه وضما اذا وضعته على الوضم وأوضمسه اذا جعلت له وضما وقال
  ابن دريدأ وضمت اللحم وأوضمته وقواهم الحى وضمة واحدة بالتسك ي أى بماءة
  صتقاربة ابن الاعرابى الوضمة والوضيمة صرم من الناس يكون فيه ماتنا انسان أوثلائة.
  والوضمة القوم يقل عددهم فينزلون غسلى قوم وقد وضم ب:وفلان ع-لى بنى فلان اذا حلوا)
  عليهم والوضيمة مثل الوئيمة من الكلا الفراء الوضيمة طعام المأتم واستوضت الرجل اذا
  ظلته واستضمته ويوضم الرجل المرأاذا وقع عليها غم الكسائى وغمت باخبر
  أغم ونما اذا أخبرت به من غسير أن تستيقنه مثل لغمته بالغين مجمة ووغم عليه بالكسرأى
  -قد وتوغم اذا اغتاظ والوغم الترة والاوغام الترات ("قم الاصمعى وقه أردّه
  وقال أبو عبيعدقهره قال الشاءر
  به أقم الشجاع ل-صاص • من القطمين اذفر الليوث
  والقطم الهائج والوقم جذبك العنان ووقت الرجل عن حاجته رددته أقنح الردّ والموقوم
  الشقيد الجزن عن الكساق والوقم كسر الرجل وتذليله يقال وقم اللّٰه العدواذا أذله ووقت
  الارض أى وطئت واكل نباتها وربا قالو اوكت بالكاف وكذلك الموكوم وتوقت الصنيد
