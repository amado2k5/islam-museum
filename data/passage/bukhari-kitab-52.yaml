summary:
  ar: "القسم 52 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الشهادات»، ويضم فيها النصوص من 2637 إلى 2689 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 52 of Sahih al-Bukhari (Witnesses) in the division of the open hadith dataset the museum took its reports from: reports 2637 to 2689 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 52، عنوان «کتاب الشہادات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2637 تا 2689۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 52 de Sahih al-Bukhari (Testigos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2637 al 2689, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du Sahih al-Bukhari (Livre 52), recueil de hadiths, à partir duquel il a recueilli les hadiths 2637 à 2689. Le musée classe ces hadiths sous ce livre; les éditions imprimées les classent et les numérotent différemment."
