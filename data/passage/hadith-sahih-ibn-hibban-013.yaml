text: "تبنا عن أكثر من ألفي شيخ من إسبيجاب إلى الإسكندرية، ولم نرو في كتابنا هذا إلا عن مائة وخمسين شيخا أقل أو أكثر . ولعل معول كتابنا هذا يكون على نحو من عشرين شيخا ممن أدركنا السنن عليهم، واقتنعنا برواياتهم"
