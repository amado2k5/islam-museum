label: { ar: "الموطأ 25 — النوم عن الصبح في طريق العودة من خيبر", en: "Muwatta 25" }
text: "من نسي الصلاة فليصلها إذا ذكرها"
summary:
  ar: "أول حديث في باب النوم عن الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب مرسلاً: لما رجع النبي من خيبر سار ليلاً، فلما كان آخر الليل نزل للراحة وأمر بلالاً أن يرقب لهم الفجر، فنام هو وأصحابه، وغلب بلالاً النوم وهو مستند إلى راحلته، فلم يستيقظ أحد حتى أصابتهم الشمس. فزع النبي، فاعتذر بلال بأن الذي أخذ بنفس النبي أخذ بنفسه، فأمرهم أن يقتادوا رواحلهم قليلاً، ثم أمر بلالاً فأقام فصلى بهم الصبح، وقال بعدها إن من نسي الصلاة فليصلها إذا ذكرها، واستشهد بآية طه التي تأمر بإقامة الصلاة للذكر. ويبين المحقق أنه مرسل عند جماعة رواة الموطأ وعند ابن عيينة ومعمر عن الزهري، وأنه جاء موصولاً من حديث سعيد عن أبي هريرة عند مسلم (2/138) وأبي داود والترمذي (3163) وابن ماجه والنسائي، ومن طريق أبي حازم عن أبي هريرة عند أحمد ومسلم وغيرهما؛ وينقل تضعيف الترمذي للموصول من طريق صالح بن أبي الأخضر وترجيح الدارقطني للمرسل، ثم يرى أن الحديث اختُلف فيه على الزهري فروي مرسلاً وموصولاً. {cite:muwatta-maruf-1997 p.45} {cite:muwatta-maruf-1997 p.46}"
  en: "Sa'id ibn al-Musayyab, mursal: the Prophet and those with him slept on a journey past the dawn prayer until the sun had risen, so he ordered it made up when they remembered."
