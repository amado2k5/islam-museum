label: { ar: "الموطأ 25 — النوم عن الصبح في طريق العودة من خيبر", en: "Muwatta 25", es: "Muwatta 25", fr: "Muwatta 25", ur: "موطا 25", tr: "Al-Muwatta 25 — Hayber'den dönüş yolunda sabahı uyuyarak geçirmek", id: "Al-Muwatta 25 — Tertidur hingga pagi hari dalam perjalanan pulang dari Khaybar" }
text: "من نسي الصلاة فليصلها إذا ذكرها"
summary:
  ar: "أول حديث في باب النوم عن الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب مرسلاً: لما رجع النبي من خيبر سار ليلاً، فلما كان آخر الليل نزل للراحة وأمر بلالاً أن يرقب لهم الفجر، فنام هو وأصحابه، وغلب بلالاً النوم وهو مستند إلى راحلته، فلم يستيقظ أحد حتى أصابتهم الشمس. فزع النبي، فاعتذر بلال بأن الذي أخذ بنفس النبي أخذ بنفسه، فأمرهم أن يقتادوا رواحلهم قليلاً، ثم أمر بلالاً فأقام فصلى بهم الصبح، وقال بعدها إن من نسي الصلاة فليصلها إذا ذكرها، واستشهد بآية طه التي تأمر بإقامة الصلاة للذكر. ويبين المحقق أنه مرسل عند جماعة رواة الموطأ وعند ابن عيينة ومعمر عن الزهري، وأنه جاء موصولاً من حديث سعيد عن أبي هريرة عند مسلم (2/138) وأبي داود والترمذي (3163) وابن ماجه والنسائي، ومن طريق أبي حازم عن أبي هريرة عند أحمد ومسلم وغيرهما؛ وينقل تضعيف الترمذي للموصول من طريق صالح بن أبي الأخضر وترجيح الدارقطني للمرسل، ثم يرى أن الحديث اختُلف فيه على الزهري فروي مرسلاً وموصولاً. {cite:muwatta-maruf-1997 p.45} {cite:muwatta-maruf-1997 p.46}"
  en: "Sa'id ibn al-Musayyab, mursal: the Prophet and those with him slept on a journey past the dawn prayer until the sun had risen, so he ordered it made up when they remembered."
  es: "Sa'id ibn al-Musayyab, mursal: El Profeta y los que estaban con él durmieron durante un viaje, pasando la hora de la oración del amanecer, hasta que salió el sol, por lo que ordenó que la recuperaran cuando se acordaron."
  fr: "Sa'id ibn al-Musayyab, mursal: le Prophète et ceux qui l'accompagnaient ont dormi pendant un voyage après la prière de l'aube jusqu'à ce que le soleil se soit levé, alors il a ordonné de la rattraper lorsqu'ils s'en sont souvenus."
  ur: "سعید بن المسیب، مرسل: نبی اور آپ کے ساتھ والے سفر میں فجر کی نماز کے بعد سوتے رہے یہاں تک کہ سورج طلوع ہو گیا، تو آپ نے یاد آنے پر قضاء کا حکم دیا۔"
  tr: "Namazda uyuma konusundaki bölümün ilk hadisi. Yahya'nın Malik'ten, o da İbn Şihab'tan, o da Sa'id ibn el-Musayyab'dan rivayet ettiği mursal bir hadiste şöyledir: Peygamberimiz Hayber'den döndüğünde gece yolculuğu yaptı. Gecenin sonunda dinlenmek için bineğinden indi ve Bilal'e şafağı beklemesini emretti. Kendisi ve arkadaşları uyudular ve Bilal bineğine yaslanarak uyuyakaldı. Güneş doğana kadar kimse uyanmadı. Peygamberimiz endişelendi ve Bilal, Peygamberimizin canını alan şeyin kendi canını da aldığını söyleyerek kendini mazur gördü. Bunun üzerine bineklerini biraz ilerletmelerini emretti, sonra Bilal'e ikameti okumasını ve onlara sabah namazını kıldırmasını emretti. Daha sonra, namazı unutanın hatırladığı zaman kılmasını söyledi ve zikir için namaz kılmayı emreden Taha Suresi'ndeki ayeti okudu. Araştırmacı, hadisin Muvatta'nın bir grup ravîsine göre ve İbn Uyaynah ile Ma'mar'ın Zühri'den rivayet ettiğine göre mursal olduğunu, Sa'id'den Ebu Hurayra'dan rivayet edilen bir musnad hadis ile birlikte Müslim'de (2/138), Ebu Davud, Tirmizi (3163), İbn Majah ve Nesai'de ve Ebu Hazim'den Ebu Hurayra'dan rivayet edilen bir hadis yoluyla Ahmed, Müslim ve diğerlerinde geldiğini açıklıyor. Daha sonra Tirmizi'nin Salih ibn Abi el-Akhdar üzerinden gelen bağlantılı isnad zincirini zayıflattığını ve Darakutni'nin mursal isnadı tercih ettiğini aktarıyor. Ardından, Zühri'den rivayet edilen hadis konusunda ihtilaf olduğunu, çünkü hem mursal hem de bağlantılı olarak rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.45} {cite:muwatta-maruf-1997 s.46}"
  id: "Hadits pertama dalam surah tentang tidur saat shalat. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Sa'id ibn al-Musayyab, dalam hadits mursal: Ketika Nabi kembali dari Khaybar, beliau melakukan perjalanan di malam hari. Ketika malam berakhir, beliau turun dari kendaraan untuk beristirahat dan memerintahkan Bilal untuk berjaga menunggu fajar. Beliau dan para sahabatnya tidur, dan Bilal tertidur sambil bersandar di kendaraannya. Tidak seorang pun bangun sampai matahari terbit. Nabi merasa khawatir, dan Bilal meminta maaf, dengan mengatakan bahwa apa yang telah merenggut nyawa Nabi juga telah merenggut nyawanya. Maka beliau memerintahkan mereka untuk membawa kendaraan mereka sedikit, kemudian beliau memerintahkan Bilal untuk mengumandangkan iqamah dan memimpin mereka dalam shalat Subuh. Setelah itu, beliau berkata bahwa siapa pun yang lupa shalat hendaknya melaksanakannya ketika ia ingat, dan beliau mengutip ayat dalam Surah Ta-Ha yang memerintahkan pendirian shalat untuk mengingat. Peneliti menjelaskan bahwa hadits ini mursal menurut sekelompok perawi al-Muwatta' dan menurut Ibn 'Uyaynah dan Ma'mar berdasarkan riwayat al-Zuhri, dan bahwa hadits ini datang dengan hadits musnad dari Sa'id berdasarkan riwayat Abu Hurayrah dalam Muslim (2/138), Abu Dawud, al-Tirmidhi (3163), Ibn Majah, dan al-Nasa'i, dan melalui jalur Abu Hazim berdasarkan riwayat Abu Hurayrah dalam Ahmad, Muslim, dan lainnya. Kemudian ia mengutip pelemahan rantai periwayatan yang terhubung oleh al-Tirmidhi melalui Salih ibn Abi al-Akhdar dan preferensi al-Daraqutni terhadap rantai mursal. Kemudian ia mengamati bahwa ada perbedaan pendapat mengenai hadits berdasarkan riwayat al-Zuhri, karena diriwayatkan baik sebagai mursal maupun terhubung. {kutip:muwatta-maruf-1997 hal.45} {kutip:muwatta-maruf-1997 hal.46}"
