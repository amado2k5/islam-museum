summary:
  ar: "سعيد بن المسيب مرسلًا: النبي ﷺ ومن معه ناموا في السفر عن صلاة الفجر حتى طلعت الشمس، فأمر بالقضاء عند الذكر."
  en: "Sa'id ibn al-Musayyab, mursal: the Prophet and those with him slept on a journey past the dawn prayer until the sun had risen, so he ordered it made up when they remembered."
