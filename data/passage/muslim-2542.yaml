text: "حَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا هَاشِمُ بْنُ الْقَاسِمِ، حَدَّثَنَا سُلَيْمَانُ بْنُ الْمُغِيرَةِ، حَدَّثَنِي سَعِيدٌ الْجُرَيْرِيُّ، عَنْ أَبِي نَضْرَةَ، عَنْ أُسَيْرِ بْنِ جَابِرٍ، أَنَّ أَهْلَ الْكُوفَةِ، وَفَدُوا، إِلَى عُمَرَ وَفِيهِمْ رَجُلٌ مِمَّنْ كَانَ يَسْخَرُ بِأُوَيْسٍ فَقَالَ عُمَرُ هَلْ هَا هُنَا أَحَدٌ مِنَ الْقَرَنِيِّينَ فَجَاءَ ذَلِكَ الرَّجُلُ فَقَالَ عُمَرُ إِنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَدْ قَالَ ‏\"‏ إِنَّ رَجُلاً يَأْتِيكُمْ مِنَ الْيَمَنِ يُقَالُ لَهُ أُوَيْسٌ لاَ يَدَعُ بِالْيَمَنِ غَيْرَ أُمٍّ لَهُ قَدْ كَانَ بِهِ بَيَاضٌ فَدَعَا اللَّهَ فَأَذْهَبَهُ عَنْهُ إِلاَّ مَوْضِعَ الدِّينَارِ أَوِ الدِّرْهَمِ فَمَنْ لَقِيَهُ مِنْكُمْ فَلْيَسْتَغْفِرْ لَكُمْ ‏\" ‏ ‏.‏"
summary:
  ar: "في كتاب فضائل الصحابة: أخبر النبي عن أويس القرني الذي برّ أمه — لم يدع باليمن غير أم له — فطلب عمر من وفد الكوفة أن يلقوه فيستغفر لهم. قصة البر الأشهر عند التابعين."
  en: "In the Book of the Merits of the Companions: the Prophet foretold Uways al-Qarni, who stayed behind in Yemen with no one left there but his mother — Umar asked the Kufa delegation to find him and have him ask forgiveness for them. The best-known story of filial devotion among the Successors."
  ur: "کتاب فضائل صحابہ میں: نبی نے اویس قرنی کی خبر دی جو یمن میں اپنی ماں کے سوا کسی کو نہیں چھوڑا — عمر نے کوفہ کے وفد سے کہا اسے ڈھونڈو کہ وہ تمہارے لیے استغفار کرے۔ تابعین میں برِ والدین کا مشہور ترین قصہ۔"
  es: "En el Libro de los Méritos de los Compañeros, el Profeta predijo que Uways al-Qarni, quien se quedó en Yemen sin más familiares que su madre, sería el único que lo encontraría. Umar pidió a la delegación de Kufa que lo buscara para que pidiera perdón por ellos. Esta es la historia más conocida de devoción filial entre los Sucesores."
  fr: "Dans le Livre des Mérites des Compagnons: le Prophète avait prédit à Uways al-Qarni, resté au Yémen avec pour seule famille sa mère, que ce dernier avait demandé à la délégation de Koufa de le retrouver et de le convaincre d’implorer le pardon pour eux. C’est l’exemple le plus connu de dévotion filiale parmi les Successeurs."
  tr: "\"Sahabelerin Faziletleri\" adlı kitapta, Peygamberimizin, Yemen'de başka annesi olmayan ve annesine çok düşkün olan Uveys el-Karni'den bahsettiği anlatılır. Bunun üzerine Ömer, Kufa'dan gelen heyeti onunla görüşmeye ve onun için bağışlanma dilemeye davet etmiştir. Bu, halifeler arasında en meşhur bağlılık öyküsüdür."
  id: "Dalam kitab \"Keutamaan Para Sahabat,\" diriwayatkan bahwa Nabi menceritakan tentang Uways al-Qarni, yang sangat berbakti kepada ibunya—ia tidak memiliki ibu lain di Yaman—maka Umar meminta delegasi dari Kufa untuk menemuinya agar ia dapat memohonkan ampunan bagi mereka. Inilah kisah ketaatan yang paling terkenal di antara para Penerus."
