text: "… ركن من أركان الايمان. محبة اللّٰه ورسوله. قال علي : ثلاث من كن فيه وجد حلاوة الايمان: ان يجب اللّٰه ورسوله أكثر مما سواهما. وان يحب المرء لا يحبه إلا لله. وان يكره ان يعود إلى الكفر - بعد أن …"
summary:
