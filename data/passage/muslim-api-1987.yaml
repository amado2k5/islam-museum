label: { ar: "صحيح مسلم 1987 — مغفرة ما تقدم من الذنب", en: "Sahih Muslim 1987 — forgiveness of past sins", ur: "صحیح مسلم 1987 — پچھلے گناہوں کی مغفرت", es: "Sahih Muslim 1987 — Perdón de los pecados pasados", fr: "Sahih Muslim 1987 — pardon des péchés passés", tr: "Sahih Muslim 1987 — Geçmiş günahların affı", id: "Sahih Muslim 1987 — Pengampunan dosa masa lalu" }
text: "حَدَّثَنَا أُمَيَّةُ بْنُ بِسْطَامٍ، حَدَّثَنَا يَزِيدُ، - يَعْنِي ابْنَ زُرَيْعٍ - حَدَّثَنَا رَوْحٌ، عَنْ سُهَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" مَنِ اغْتَسَلَ ثُمَّ أَتَى الْجُمُعَةَ فَصَلَّى مَا قُدِّرَ لَهُ ثُمَّ أَنْصَتَ حَتَّى يَفْرُغَ مِنْ خُطْبَتِهِ ثُمَّ يُصَلِّيَ مَعَهُ غُفِرَ لَهُ مَا بَيْنَهُ وَبَيْنَ الْجُمُعَةِ الأُخْرَى وَفَضْلَ ثَلاَثَةِ أَيَّامٍ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1987، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 1987 (The Book of Prayer - Friday), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 1987، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Sahih Muslim, n.° 1987 (El Libro de la Oración - Viernes), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim n° 1987 (Livre de la prière du vendredi) évoque le pardon des péchés passés. Le Hasanat and Sayyi'at Ledger le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "Sahih Müslim'de 1987 numaralı hadis, geçmiş günahların affedilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 1987, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
