text: "… السَّحَابَ حَيْثُ شَاءَ اللَّهُ \". فَقَالُوا فَمَا هَذَا الصَّوْتُ الَّذِي نَسْمَعُ قَالَ \" زَجْرُهُ بِالسَّحَابِ إِذَا زَجَرَهُ حَتَّى يَنْتَهِيَ إِلَى حَيْثُ أُمِرَ \". قَالُوا صَدَقْتَ فَأَخْبِرْنَا عَمَّا حَرَّمَ إِسْرَائِيلُ عَلَى نَفْسِهِ قَالَ \" اشْتَكَى عِرْقَ النَّسَا فَلَمْ يَجِدْ شَيْئًا يُلاَئِمُهُ إِلاَّ لُحُومَ الإِبِلِ وَأَلْبَانَهَا فَلِذَلِكَ حَرَّمَهَا \". قَالُوا صَدَقْتَ. قَالَ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3117، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3117 (Chapters on Tafsir), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3117، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
