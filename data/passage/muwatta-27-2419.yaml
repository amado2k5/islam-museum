label: { ar: "الموطأ 2419 — مالك: الذي يسرق مرارا ثم يستعدى عليه تقطع يده لمن سرق منه", en: "Muwatta 2419", es: "Muwatta 2419", fr: "Muwatta 2419", ur: "موطا 2419", tr: "Al-Muwatta 2419 — Malik: Tekrar tekrar hırsızlık yapan ve daha sonra yetkililere ihbar edilen kimsenin eli, kendisinden çaldığı kişi için kesilir.", id: "Al-Muwatta 2419 — Malik: Barangsiapa mencuri berulang kali dan kemudian dilaporkan kepada pihak berwenang, tangannya akan dipotong untuk orang yang dicurinya." }
summary:
  ar: "قال يحيى: قال مالك: الأمر عندنا في الذي يسرق مرارا ثم يُستعدى عليه: إنه ليس عليه إلا أن تُقطع يده لجميع من سرق منه، إذا لم يكن أُقيم عليه الحد. فإن كان أُقيم عليه الحد قبل ذلك ثم سرق ما يجب فيه القطع، قُطع أيضا. {cite:muwatta-maruf-1997 p.399}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Tekrar tekrar hırsızlık yapan ve daha sonra adalete teslim edilen kimse hakkında hükmümüz şudur: Eğer kendisine öngörülen ceza henüz infaz edilmemişse, ancak çaldığı herkes için eli kesilir. Eğer öngörülen ceza infaz edilmişse ve daha sonra el kesilmesini gerektiren bir şey çalarsa, onun da eli kesilir. {cite:muwatta-maruf-1997 s.399}"
  id: "Yahya berkata: Malik berkata: Hukum kami mengenai seseorang yang mencuri berulang kali dan kemudian diadili adalah bahwa tangannya hanya perlu dipotong untuk semua orang yang dicurinya, dengan syarat hukuman yang ditentukan belum dilaksanakan padanya. Jika hukuman yang ditentukan telah dilaksanakan padanya, dan kemudian ia mencuri sesuatu yang mengharuskan pemotongan tangan, maka tangannya juga dipotong. {cite:muwatta-maruf-1997 p.399}"
