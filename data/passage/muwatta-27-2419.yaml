summary:
  ar: "قال يحيى: قال مالك: الأمر عندنا في الذي يسرق مرارا ثم يُستعدى عليه: إنه ليس عليه إلا أن تُقطع يده لجميع من سرق منه، إذا لم يكن أُقيم عليه الحد. فإن كان أُقيم عليه الحد قبل ذلك ثم سرق ما يجب فيه القطع، قُطع أيضا. {cite:muwatta-maruf-1997 p.399}"
