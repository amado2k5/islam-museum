label: { ar: "جامع الترمذي 2433 — الأب والأبوة", en: "Jami' al-Tirmidhi 2433 — the father and fatherhood", ur: "جامع ترمذی 2433 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2433 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 2433 — le père et la paternité" }
text: "… حَدَّثَنَا بَدَلُ بْنُ الْمُحَبَّرِ، حَدَّثَنَا حَرْبُ بْنُ مَيْمُونٍ الأَنْصَارِيُّ أَبُو الْخَطَّابِ، حَدَّثَنَا النَّضْرُ بْنُ أَنَسِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، قَالَ سَأَلْتُ النَّبِيَّ أَنْ يَشْفَعَ لِي يَوْمَ الْقِيَامَةِ فَقَالَ \" أَنَا فَاعِلٌ \". قَالَ قُلْتُ يَا رَسُولَ اللَّهِ فَأَيْنَ أَطْلُبُكَ قَالَ \" اطْلُبْنِي أَوَّلَ مَا تَطْلُبُنِي عَلَى الصِّرَاطِ \". قَالَ قُلْتُ فَإِنْ لَمْ أَلْقَكَ عَلَى الصِّرَاطِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2433، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2433 (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara'), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2433، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2433 (Capítulos sobre la descripción del Día del Juicio, Ar-Riqaq y Al-Wara'), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2433 (chapitres sur la description du Jour du Jugement, Ar-Riqaq et Al-Wara'), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
