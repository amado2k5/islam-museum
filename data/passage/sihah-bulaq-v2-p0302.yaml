text: |-
  ٢٨٥
  يقال هم ضبة لانهم أوعامتهم دلم ويقال الديلم الاعداء والديلم ابهاعة من الناس والديلم
  مجتمع النمل والقردان عند أعقار الحياض وأعطان الابل والديلم ذكر الدرّاج ⁦( دام)⁩.
  الداقم الناقة التى أكات أسنانها من الكبر والميم زائدة وة دذ كرفى القاف لهم لة
  مدله-مة أى مظلة وداهم اسم رجل ⁦(دهم)⁩ الدمام بالكسر دواء تطلى به جبهه الصبىّ
  وظاهر عيفيه وكل شى طلى به فهودمام وقال يصف سهما
  قرنت بحقويه ثلاثافلم يزغ * عن القصدحتى بصرت بدمام
  وقددحت الشى أدمّه بالضم اذا طليته يأت صبغ كان والمدموم الاحر والمدموم الممتلئ
  هما من البعير وغيره وقددمّ بالشحم أى أوقر قال ذوالرمّة يصف الحار
  -تى انجلى البردعنه وهو محتقر * عرض اللوى زاؤ المتنين مدموم
  وقدر مدمومة ودميم أى مطلية بالطهال والدميم القبيح وقد دعت يافلان تدمّ وتدمّ دمامة
  أى صرت دميما والدمة لعبة والدمة الطريقة والدمة بالكسر البعرة والدامّاء احدى حجرة
  البربوع مثل الراهطاء والجمع دوامّ على فواعل وكذلك الدمّة والدممة أيضاعلى وزن الجمة ودمّ
  البربوع بحره أى حكبسه والدمادم من الارض رواب سهلة ودمدمت الشئ اذا أزقته
  بالارض وطحطحته ود. دم اللّٰه سيجانه عليهم أى أهلكهم والديمومة المفازة لاماه بها والمدمم
  المطوى من الكرار قال الشاعر
  تربع بالفأوين ثم مصيرها • الى كل كترمن لصاف مدمم
  نم لدنامة القصير وكذلك الدغة مثل الدنابة والذتبة وم ام الشى يدوم ويدا
  دوما ودواماودي ومة وأداءه غيره ودوّمت الشمس فى كبد السماء وقال
  والشمس حيرى لها فى الجو تدويم * أى كأنها لاتمضى قال الاصمعىّ دومت انلهر شاربها اذا
  سكرفداروبقال أخذه دوام بالضم أى دواروهود وار الرأس ودام الشئ سكن وفى الحديت
  نهى أن يبال فى الماء الدائم وهو الساكن ودوّمت القدر وأدمتها اذاسكنت غليانهابشئ
  من الماءودومت السى بلته قال ابن أحر⁦(١)⁩ • وقد يدوم ريق الطامع الامل* أى يبله
  وتدويم الزعفران دوفه قال الفراء والتدويم أن يلوكل انه لثلابيبس ريقه قال ذوالرمة
  صف بعبرايهدر فى نقشفته
  رقشاء تنتاخ اللغام المزبدا• دوّم فيهارزه وأرعدا
  وتدويم الطير تحليقه وهو دورانه فى طيرانه ابرتفع الى السماء وقد جعل ذوالرمة الندويم
  فى الارض بقوله بصف نورا
  حتى اذا دومت فى الارض راجعه * كبرولوشاء نجى نفسه الهرب
  وأنكر الاصمعى ذلك وقال انما بقال دوّى فى الارض ودوّم فى السماء وكان بعضهم يصوّب
  التدويم فى الارض ويقول منه اشتقت الدوّامة بالضم والتشديد وهى فلكة يرميها الصبى
  بخيط فتدوم على الارض أى تدور وغيره يقول انماسميت الدوّامة من قولهم دوّمت القدر
  اذا سكنت غلياتها بالماء لانها من سرعة دورانها كا نها قد سكنت وهدأت والتدوام مشل
  التدويم وأنشد الاحر فى نعت الخيل
  فهن يعلكن حدائداتها • جنح النواصى غحو ألوياتها * كالطيرتبق منداوماتها
  . ٧٢
  بى
  ( ١ نسضة أول البيت
  هذا التناء وأجدر أن أصاحيه
  /ه
