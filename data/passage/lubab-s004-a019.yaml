text: "يا أيها الذين آمنوا لا يحل لكم أن ترثوا النساء كرها [19] روى البخاري وأبو داود والنسائي عن ابن عباس قال كانوا إذا مات الرجل كان أولياؤه أحق بامرأته إن شاء بعضهم تزوجها وإن شاءوا زوجوها فهم أحق بها من أهلها فنزلت هذه الآية وأخرج"
