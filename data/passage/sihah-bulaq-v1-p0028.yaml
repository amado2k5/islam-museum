text: |-
  ٦١٣
  بفى خيرى نجزوا من قناذع • أنت من لديكم ولنظرواماشؤونها
  والقسذوع الديون (قرع قرعت الباب أقبرعه أرعاوة ولهم إنّ العصاقرعت لذى الحلم
  اى ان الحليم اذا ئبه انبه وأصلدان حكا من حكام العرب عاش حتى أهتر فقال لابتته اذا
  انكرت من فهمى شياعندالحكم فاقرعى لى الجنّ بالعم الأرتدع قال المتلمس
  لذى الحلم قبل اليوم ماترع العصا • وماعلم الانسان الاليعلها
  وقرءت رأسه بالعصاقر عامثل فرعت وقرع الشارب بالاناء جبهته اذا اشتف مافيه والقراع
  الضراب وقدقرع النوروقرع الغمسل الناقة بقرعها قرعا وقراعا واستة رعف نلان فملى
  فأفرعته أى أعطيته اية رع البله أى يضر بها واسستة رعت البقرة أى أرادت الفحل والقرع
  حسل اليقطين الواحدة قرعة والقرعة بالضم معروفة يقال كانت له القرمة اذا قرع اصحابه
  والمقرعسة أيضاخيار المال يقال أقرعوه اذا أعطوه خيار النهب والفرع بالتحريك بنرأ بيض
  يخرج بالفصال ودواؤه الملح وجباب البان الابل فاذالم يجد واملما نتفوا أوباره ونفحوا
  جلده بالماثم جرّوه عسلى السبخة ومنه المثل هو أحرّ من القرع وربما قالواهو أحوّ من
  القوع بالتسكين يعنونيه قرع الميسم وهوالمكواة قال الشاعر
  كأن على كبدى قرعة • حذارا من البين ماتبرد
  والعامة ريد بهه-ذا القرع الذى يؤكل والفصيل قريع والجمع قرعى مثل مي يض ومرضى
  يقال استنت الفصال حتى القرعى ١ الاقرع الذى ذهب شعر رأسه من آفة وقد قرع
  ذه وأقرع بين الرع وذلك الموضع من الرأس القرعسة والقوم قرع وقرعان والقرع أيضا
  مصدرة ولك قرع الرجل فهوقرع اذا كان يقبسل المشورة ويرتدع اذاردع والقرع أيضا؟
  مصدررع الفناء أى خلا من الغاشية يقال نوذبالله من قرع الفناء وصفر الاناه ومراح
  قرع اذا لم تسكن فيه ابل وقال ثعاب نعوذبالله من قرع الفقاء بالتسكين على غسير قياس وفى
  الحسديث عن عمررضى اللّٰه عنه قرع حكم أى خلت أيام الحج من الناس والاقرعان الافرع
  ابن سابس وأخوم مرندقال الفرزدق
  فانك واجد دونى صعودا • جرائيم الافارع والحتات
  والحمة الاقرع الذى بتعط شعررأسه زع وابمعه السم فيه بقال شجاع أقرع وقولهم سقت
  المك ألفا أقرع من الحيل وغيرها أى تاما وهونعت لكل ألف كما ان هنيدا-يم لكل مائة
  والمة رعة ماتة رع به الداية والمقراع كالفاس تكسريه الجارة قال بصف ذئبا
  ستمفر الريح اذا لم يسمع • بمثل حتراع السفا الموقع
  والمقروع الختار للفصلة والمتروع السيد ومقروع لقب عبد شمس بن سعد ين زيد مناة بن غيم
  وفيه يقول مازن بن مالابن عمرو بن تميم وفى الهيجمانة بذت العنبر بن حروين تميم
  حنت ولات هنت •وانى لل مقروع
  والمقراح الصلب الشديد قال أبوقيس بن الاسلت ومجنا أسمر فزاع ين تزرساصابا
  والاقارع الشدائد عن أبى نصر والقارعة الشدينة من شدائد الدهر وهى الداهية يقال
  قرعتهم قوارع الدهر أى أصابتهم ونعو ذبالته من قوارع فلان ولوا ذعه اى قوارص لسان
  ١٥٤
  قوله بالمفصال أى فى أعناقها
  وقوائها كمافى نسحنة
  ١ ي ضرب مثلالمن تعدى
  طوره وادعى مالميس لهاه
