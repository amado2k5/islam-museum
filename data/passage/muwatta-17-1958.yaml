label: { ar: "الموطأ 1958 — يحيى عن مالك عن نافع عن ابن عمر: قال رسول الله المتبايعان كل واحد منهما بالخيار على صاحبه ما لم يتفرقا، إلا بيع الخيار", en: "Muwatta 1958", es: "Muwatta 1958", fr: "Muwatta 1958", ur: "موطا 1958", tr: "El-Muvatta 1958 — Yahya, Malik'ten, o da Nafi'den, o da İbn Ömer'den rivayetle: Allah Resulü şöyle buyurmuştur: \"İki taraf da, ayrılmadıkları sürece, birbirlerine karşı sözleşmeyi feshetme hakkına sahiptirler; ancak feshetme opsiyonu bulunan satışlarda bu durum geçerli değildir.\"", id: "Al-Muwatta 1958 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Nafi’ berdasarkan riwayat Ibnu Umar: Rasulullah SAW bersabda: “Kedua belah pihak dalam jual beli masing-masing mempunyai pilihan untuk membatalkannya terhadap pihak lain selama mereka belum berpisah, kecuali dalam kasus jual beli dengan pilihan untuk membatalkan.”" }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: المتبايعان كل واحد منهما بالخيار على صاحبه، ما لم يتفرقا، إلا بيع الخيار. {cite:muwatta-maruf-1997 p.201}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakde çevirmiştir: \"İki taraf da, ayrılmadıkları sürece, satışı diğer tarafla iptal etme hakkına sahiptir; ancak iptal opsiyonu bulunan satışlarda bu durum geçerli değildir.\" {cite:muwatta-maruf-1997 s.201}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi', dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: \"Kedua belah pihak dalam jual beli masing-masing mempunyai pilihan untuk membatalkan jual beli tersebut, selama mereka belum berpisah, kecuali dalam kasus jual beli yang memiliki pilihan untuk membatalkan.\" {cite:muwatta-maruf-1997 p.201}"
