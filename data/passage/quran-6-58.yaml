text_search: "قل لو أن عندي ما تستعجلون به لقضي الأمر بيني وبينكم ۗ والله أعلم بالظالمين"
translations:
  en: { text: "Say: If I had that for which ye are impatient, then would the case (ere this) have been decided between me and you. Allah is Best Aware of the wrong-doers.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کہہ دو کہ جس چیز کے لئے تم جلدی کر رہے ہو اگر وہ میرے اختیار میں ہوتی تو مجھ میں اور تم میں فیصلہ ہوچکا ہوتا۔ اور خدا ظالموں سے خوب واقف ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
