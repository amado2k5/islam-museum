  لتوق انجار من الدهن أوالدهن من الغبار ق برق السيف وغيره يبرق بروقا أى
  تلألاً والاسم البريو والبرق واحدبروق السحاب دقال برق ائدلب وبرق خلب بالاضافة
  وبرق خلب بالصفة وهو الذى ليس فيه مطر ويقال رعدت السماء وبرقت برقانا أى لمعت
  ورعد الرجل وبرق أى تهدد ورعدت المرأة وبرقت أى تزيذت وقد ذكرنا الخلاف فى
  أرعد وأبرو فى باب الدال وأرعد القوم وأبرقوا أي أصلبهم رعد وبرق وح-كى أبو نصر أبرق
  الرجل اذ المع بسيفه وأرقت الناقة وبرقت أيضااذاشات بذنبها وتلقمت وليست بلاقح
  فهى بروف ومبرق ونوق مباريق قال أبو صاعد السكلابي البريسة اللبن تصب عليه اهالة
  أوعن قليسل والجمع البرائق يقال ابرقوا المابزيت أى صبوا عليه زيتاقليلا وقد برقوا
  اضاطعاما بز يث أوسم برقا وهى التباريق وهوشئ منه قليل لم يسفسغوه أى لم يكثر وادهنه
