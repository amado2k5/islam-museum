  برقا اذا اشتكت بطونها من أكل البروق وبرق عينيه تبريا أوسعهما رأحد النظر والابريق
  واحد الاباديق فارسى" معرّب والابريق أيضا السف الشديد البريق والابرق غلط فيه ححارة
  ورمل وطين مختاطة وكذلك البرقاء وجمع الابرق أبارق وججع البرقاء برقاوات والبرقة بالضم
