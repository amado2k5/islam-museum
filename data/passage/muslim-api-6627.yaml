label: { ar: "صحيح مسلم 6627 — اليتيم وفقد الأب", en: "Sahih Muslim 6627 — the orphan and the father lost", ur: "صحیح مسلم 6627 — یتیم اور باپ کی موت", es: "Sahih Muslim 6627 — El huérfano y el padre perdido", fr: "Sahih Muslim 6627 — L'orphelin et le père perdus", tr: "Sahih Muslim 6627 — Yetim ve Babayı Kaybetme", id: "Sahih Muslim 6627 — Anak Yatim dan Kehilangan Ayah" }
text: "… حَدَّثَنَا عِكْرِمَةُ بْنُ عَمَّارٍ، حَدَّثَنَا إِسْحَاقُ بْنُ أَبِي طَلْحَةَ، حَدَّثَنِي أَنَسُ بْنُ مَالِكٍ، قَالَ كَانَتْ عِنْدَ أُمِّ سُلَيْمٍ يَتِيمَةٌ وَهِيَ أُمُّ أَنَسٍ فَرَأَى رَسُولُ اللَّهِ الْيَتِيمَةَ فَقَالَ \" آنْتِ هِيَهْ لَقَدْ كَبِرْتِ لاَ كَبِرَ سِنُّكِ \". فَرَجَعَتِ الْيَتِيمَةُ إِلَى أُمِّ سُلَيْمٍ تَبْكِي فَقَالَتْ أُمُّ سُلَيْمٍ مَا لَكِ يَا بُنَيَّةُ قَالَتِ الْجَارِيَةُ دَعَا عَلَىَّ نَبِيُّ اللَّهِ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6627، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6627 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6627، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6627 (El Libro de la Virtud, que ordena las buenas costumbres y fortalece los lazos de parentesco), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sahih Muslim, n° 6627 (Le Livre de la Vertu, l'Exhortation aux bonnes mœurs et le Rétablissement des liens de parenté), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih Müslim'de 6627 numaralı hadis, yetimlerden ve babasızlık durumundan bahseder. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6627, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
