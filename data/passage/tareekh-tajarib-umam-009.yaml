text: "وتبعه وصيفه وجمع مقدمات العسكر. فلما صار أشتاس بعرج الأسقف ورد عليه كتاب المعتصم يأمره بالمقام [250] ويعلمه أن الجواسيس أتته بأن الملك يريد أن يقف على المخاضة ويكبسهم، وأعلمه أيضا أنه ينتظر ساقته لأن فيها الأثقال والمجانيق والزاد. فأقام"
