label: { ar: "الموطأ 2261 — عبد الرحمن بن أبي عمرة: عتق الابن عن أمه", en: "Muwatta 2261", es: "Muwatta 2261", fr: "Muwatta 2261", ur: "موطا 2261", tr: "Al-Muwatta 2261 - Abd al-Rahman ibn Abi Amrah: Oğul annesini serbest bıraktı", id: "Al-Muwatta 2261 — Abd al-Rahman ibn Abi Amrah: Anak laki-laki itu membebaskan ibunya" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن أبي عمرة الأنصاري أن أمه همت بالعتق ثم هلكت قبل أن تفعل، فسأل القاسم بن محمد هل ينفعها أن يعتق ابنها عنها، فذكر القاسم حديث سعد بن عبادة في ذلك، فأجاب النبي بالإيجاب. وينقل المحقق عن ابن عبد البر أن الإسناد منقطع لأن القاسم لم يلق سعدا، وأن القصة مروية من وجوه كثيرة في الصدقة والعتق والصيام. {cite:muwatta-maruf-1997 p.332}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn Abi Amrah al-Ansari bahwa ibunya bermaksud membebaskan seorang budak tetapi meninggal sebelum melakukannya. Ia bertanya kepada al-Qasim ibn Muhammad apakah akan bermanfaat baginya jika putranya membebaskan seorang budak atas namanya. Al-Qasim menyebutkan hadits Sa'd ibn Ubadah tentang masalah ini, dan Nabi (shalawat dan salam kepadanya) menjawab dengan утвердительно (ya). Peneliti mengutip Ibn Abd al-Barr yang mengatakan bahwa rantai periwayatan terputus karena al-Qasim tidak bertemu Sa'd, dan bahwa kisah tersebut diriwayatkan dalam banyak cara lain dalam surah-surah tentang sedekah, membebaskan budak, dan puasa. {cite:muwatta-maruf-1997 p.332}"
