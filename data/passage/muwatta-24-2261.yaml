label: { ar: "الموطأ 2261 — عبد الرحمن بن أبي عمرة: عتق الابن عن أمه", en: "Muwatta 2261" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن أبي عمرة الأنصاري أن أمه همت بالعتق ثم هلكت قبل أن تفعل، فسأل القاسم بن محمد هل ينفعها أن يعتق ابنها عنها، فذكر القاسم حديث سعد بن عبادة في ذلك، فأجاب النبي بالإيجاب. وينقل المحقق عن ابن عبد البر أن الإسناد منقطع لأن القاسم لم يلق سعدا، وأن القصة مروية من وجوه كثيرة في الصدقة والعتق والصيام. {cite:muwatta-maruf-1997 p.332}"
