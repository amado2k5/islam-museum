label: { ar: "الموطأ 1524 — مالك: إذا تزوج الرجل امرأة ثم نكح أمها فأصابها، حرمت عليه امرأته، ويفارقهما جميعا، وتحرمان عليه أبدا إذا أصاب الأم", en: "Muwatta 1524", es: "Muwatta 1524", fr: "Muwatta 1524", ur: "موطا 1524", tr: "El-Muvatta 1524 — Malik: Bir erkek bir kadınla evlenir, sonra da onun annesiyle evlenir ve onunla cinsel ilişkiye girerse, karısı ona haram olur ve her ikisinden de ayrılmalıdır. Annesi ile de cinsel ilişkiye girerse, her ikisi de ona sonsuza dek haram olur.", id: "Al-Muwatta 1524 — Malik: Jika seorang pria menikahi seorang wanita dan kemudian menikahi ibunya dan bersetubuh dengannya, maka istrinya menjadi haram baginya, dan dia harus berpisah dari keduanya. Keduanya haram baginya selamanya jika dia bersetubuh dengan ibunya." }
summary:
  ar: "يقول مالك في الرجل تكون تحته المرأة، ثم ينكح أمها فيصيبها، إنها تحرم عليه امرأته، ويفارقهما جميعا، وتحرمان عليه أبدا إذا كان قد أصاب الأم. فإن لم يصب الأم لم تحرم عليه امرأته، وفارق الأم. {cite:muwatta-maruf-1997 p.39}"
  tr: "Malik, bir erkeğin karısı varken karısının annesiyle evlenmesi durumunda, karısının kendisine haram hale geldiğini ve her ikisinden de ayrılması gerektiğini söyler. Eğer anneyle cinsel ilişkiye girmişse, her iki kadın da kendisine kalıcı olarak haram olur. Ancak anneyle cinsel ilişkiye girmemişse, karısı kendisine haram hale gelmez ve anneden de ayrılması gerekir. {cite:muwatta-maruf-1997 s.39}"
  id: "Malik mengatakan bahwa jika seorang pria memiliki istri dan kemudian menikahi ibu mertuanya, maka istrinya menjadi haram baginya, dan ia harus berpisah dari keduanya. Kedua wanita tersebut menjadi haram baginya secara permanen jika ia telah bersetubuh dengan ibu mertuanya. Namun, jika ia belum bersetubuh dengan ibu mertuanya, maka istrinya tidak menjadi haram baginya, dan ia harus berpisah dari ibu mertuanya. {cite:muwatta-maruf-1997 p.39}"
