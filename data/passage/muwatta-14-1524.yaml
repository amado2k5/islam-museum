label: { ar: "الموطأ 1524 — مالك: إذا تزوج الرجل امرأة ثم نكح أمها فأصابها، حرمت عليه امرأته، ويفارقهما جميعا، وتحرمان عليه أبدا إذا أصاب الأم", en: "Muwatta 1524" }
summary:
  ar: "يقول مالك في الرجل تكون تحته المرأة، ثم ينكح أمها فيصيبها، إنها تحرم عليه امرأته، ويفارقهما جميعا، وتحرمان عليه أبدا إذا كان قد أصاب الأم. فإن لم يصب الأم لم تحرم عليه امرأته، وفارق الأم. {cite:muwatta-maruf-1997 p.39}"
