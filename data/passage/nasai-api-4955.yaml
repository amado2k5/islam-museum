label: { ar: "سنن النسائي 4955 — اليتيم وفقد الأب", en: "Sunan al-Nasa'i 4955 — the orphan and the father lost", ur: "سنن نسائی 4955 — یتیم اور باپ کی موت", es: "Sunan al-Nasa'i 4955 — El huérfano y el padre perdido", fr: "Sunan al-Nasa'i 4955 — L'orphelin et le père perdus" }
text: "أَخْبَرَنَا عَبْدُ الْحَمِيدِ بْنُ مُحَمَّدٍ، قَالَ حَدَّثَنَا مَخْلَدٌ، قَالَ حَدَّثَنَا ابْنُ جُرَيْجٍ، عَنْ عَطَاءٍ، عَنْ أَيْمَنَ، مَوْلَى ابْنِ عُمَرَ عَنْ تُبَيْعٍ، عَنْ كَعْبٍ، قَالَ مَنْ تَوَضَّأَ فَأَحْسَنَ وُضُوءَهُ ثُمَّ شَهِدَ صَلاَةَ الْعَتَمَةِ فِي جَمَاعَةٍ ثُمَّ صَلَّى إِلَيْهَا أَرْبَعًا مِثْلَهَا يَقْرَأُ فِيهَا وَيُتِمُّ رُكُوعَهَا وَسُجُودَهَا كَانَ لَهُ مِنَ الأَجْرِ مِثْلُ لَيْلَةِ الْقَدْرِ."
summary:
  ar: "حديث في سنن النسائي، رقم 4955، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4955 (The Book of Cutting off the Hand of the Thief), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4955، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.° 4955 (El Libro de la Perdición del Ladrón), menciona al huérfano y al padre desaparecido. El navegador \"La Paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4955 (Le Livre de la Main Coupée du Voleur), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
