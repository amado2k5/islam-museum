text: "… فى بطنه أنه إنما يعصى اللّٰه تمالى فيه بالأكل والشرب إما بكثرة الأكل من الحلال فان ذلك مكروه عند اللّٰه ومقوّ الشهوة التى هى سلاح الشيطان عدو اللّٰه وإما بأكل الحرام أو الشبهة فينظر من أين مطعمه وملبعه ومسكنه ومكسبه …"
summary:
