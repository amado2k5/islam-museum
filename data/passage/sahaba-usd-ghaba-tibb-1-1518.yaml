text: "… سار رسول اللّٰه ملاع إلى بدر كانت ابنته رُقَيَّة مريضة، فتخلف عليها عثمان بأمر رسول اللّٰه عله له بذلك، فتوفيت يوم وصول زيد بن حارثة مبشراً بظَفَرِ رسول اللّٰه لله بالمشركين، وكانت قد أصابتها الحَصْبة، فماتت بها. وقيل : ماتت …"
