text: "حَدَّثَنَا ابْنُ الْمُثَنَّى، حَدَّثَنَا أَبُو دَاوُدَ، حَدَّثَنَا أَبَانُ بْنُ يَزِيدَ، عَنْ قَتَادَةَ، عَنْ أَبِي سَعِيدٍ، - مِنْ أَزْدِ شَنُوءَةَ - عَنْ أَبِي هُرَيْرَةَ، قَالَ أَوْصَانِي خَلِيلِي بِثَلاَثٍ لاَ أَدَعُهُنَّ فِي سَفَرٍ وَلاَ حَضَرٍ رَكْعَتَىِ الضُّحَى وَصَوْمِ ثَلاَثَةِ أَيَّامٍ مِنَ الشَّهْرِ وَأَنْ لاَ أَنَامَ إِلاَّ عَلَى وِتْرٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1432، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1432 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 1432، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1432 (Oración (Kitab Al-Salat): Instrucciones detalladas sobre el Witr), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 1432 (La Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 1432 numaralı hadiste, vasiyet veya son bir sözleşmeden bahsedilmektedir. Bu hadis, vasiyetler, miras, eski eserler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1432, menyebutkan tentang wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, barang antik, dan makam suci, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
