summary:
  ar: "يرويه مالك عن عمارة بن صياد عن سعيد بن المسيب، أنه سمعه يقول في الباقيات الصالحات المذكورة في سورة الكهف [[passage/quran-18-46|الكهف 46]]: إنها قول العبد: الله أكبر، وسبحان الله، والحمد لله، ولا إله إلا الله، ولا حول ولا قوة إلا بالله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.289}"
