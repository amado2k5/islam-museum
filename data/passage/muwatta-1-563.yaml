label: { ar: "الموطأ 563 — سعيد بن المسيب في الباقيات الصالحات: التكبير والتسبيح والتحميد والتهليل والحوقلة", en: "Muwatta 563", es: "Muwatta 563", fr: "Muwatta 563", ur: "موطا 563", tr: "Al-Muwatta 563 - Sa'id ibn al-Musayyab'ın kalıcı iyi işler hakkında: Tekbir, Tesbih, Tahmid, Tahlil ve Hawqala", id: "Al-Muwatta 563 — Sa’id ibn al-Musayyab tentang amal shaleh yang kekal: Takbir, Tasbih, Tahmid, Tahlil, dan Hawqala" }
summary:
  ar: "يرويه مالك عن عمارة بن صياد عن سعيد بن المسيب، أنه سمعه يقول في الباقيات الصالحات المذكورة في سورة الكهف [[passage/quran-18-46|الكهف 46]]: إنها قول العبد: الله أكبر، وسبحان الله، والحمد لله، ولا إله إلا الله، ولا حول ولا قوة إلا بالله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.289}"
  tr: "Malik, Ammarah ibn Sayyad'dan, o da Sa'id ibn al-Musayyab'dan rivayet ederek, Kehf Suresi'nde [[pasaj/kuran-18-46|al-Kahf 46]] zikredilen kalıcı amellerle ilgili olarak şöyle buyurduğunu işittiğini belirtmiştir: \"Bunlar kulun sözleridir: Allah en büyüktür, Allah'a hamd olsun, Allah'a şükürler olsun, Allah'tan başka ilah yoktur, Allah'tan başka güç ve kuvvet yoktur.\" Araştırmacı, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.289}"
  id: "Malik meriwayatkannya dari Ammarah ibn Sayyad, dari Sa'id ibn al-Musayyab, bahwa ia mendengar beliau berkata mengenai amal kebaikan abadi yang disebutkan dalam Surah al-Kahf [[passage/quran-18-46|al-Kahf 46]]: Itulah ucapan-ucapan seorang hamba: Allah Maha Besar, Maha Suci Allah, Segala puji bagi Allah, Tidak ada tuhan selain Allah, dan tidak ada daya dan kekuatan kecuali dengan Allah. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.289}"
