text: "… من يعجبه طعامه ويصف زياديه ويشتهى أن تبق على حالها ومنهم من يحضر طعامه فاذا رآم ضيوفه أمر بأن يرفع منها أطبيها واشهاها الى النفوس ويعتذرات فى أصحابه من يحضر بالغداة عنده وسكى عن بعض البخلاء انه استأذن عليه ضيف …"
summary:
  ar: "مقطع من المستطرف في كل فن مستظرف، ص 220، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Mustatraf fi kull fann mustazraf, p. 220, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "المستطرف فی کل فن مستظرف، ص 220 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustatraf fi kull fann mustazraf, p. 220, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Mustatraf fi kull fann mustazraf, p. 220, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"Al-Mustatraf fi Kull Fann Mustazraf\" (s. 220) adlı eserden, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Al-Mustatraf fi Kull Fann Mustazraf\" (hlm. 220), berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha and Islamic Folklore Browser."
