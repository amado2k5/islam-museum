text: "… أفتش على نومي خرج في منتصف الليل يدور في الشوارع، فصادفه رئيس الحراس، وسأله: على أيٍّ شيء تفتش في الشوارع بنصف الليل؟ فأجابه: هرب نومي وأنا أُفتّشُ عليه. أعطيك ما شِئْتَ منَ الوعدة طلب إليه أحد أصدقائه نقوداً بالدَين لوعدة. …"
summary:
  ar: "كان جحا يفتش في الشوارع عند منتصف الليل، فقال لرئيس الحرس إنه يبحث عن نومه الذي هرب منه. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  en: "Searching the streets at midnight, Juha tells the chief of the watch that he is looking for his sleep, which has run off. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  ur: "آدھی رات کو گلیوں میں ڈھونڈتے ہوئے جحا نے پہرے کے سردار سے کہا کہ میں اپنی نیند تلاش کر رہا ہوں جو بھاگ گئی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  fr: "Cherchant dans les rues à minuit, Juha dit au chef du guet qu'il cherche son sommeil, qui s'est enfui. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  es: "Buscando por las calles a medianoche, Juha le dice al jefe de la ronda que busca su sueño, que se ha escapado. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
