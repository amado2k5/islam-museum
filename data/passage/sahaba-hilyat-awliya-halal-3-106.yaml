text: "… قال ثما زرارة بن أبى الحلال العتكى. قال سمعت أنس بن مالك رذى اللّٰه تعالى عنه يقول : سمعت رسول اللّٰه يقول : من صلى فى اليوم ثنتى عشرة ركهة حرم اللّٰه لحمه على النار. قال ما تركتها بعد. حدثنا …"
