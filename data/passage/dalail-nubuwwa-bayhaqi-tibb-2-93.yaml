text: "… وأبوالها : لقد وقع الترخيص في إصابة بول الإبل للتداوي لهؤلاء خاصة، وذلك في صدر الإسلام ثم نسخ، وقيل : للمتداوي أن يصيبه كاكل الميتة لكسر عادية الجوع."
summary:
