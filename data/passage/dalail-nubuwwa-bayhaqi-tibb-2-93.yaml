  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin resimli 2. cildinin 93. sayfasından, deve sütü ve idrarından ve bunların tıpta kullanımından bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
