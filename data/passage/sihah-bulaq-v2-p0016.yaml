text: |-
  ٥y١
  أياظبية الوعساء بين جلاجل • وبين انقا آأن ت أم أمّ -الم
  وقد ينادى بم اتقول أز يد أقبل الاأنصالر يب دون البعبدلانم امقصورة وهى على
  ضربينااف وصل والف قطع وكل مائيت فى الوصل فهو ألف القط-ع ومالم يثبت فه وألف
  الوصل ولا تكون الازائدة وألف القطعة- تكون زائدة مثل الف الاستة هام وقدتكون
  أصلية مشل ألف أخذوأمر ذا اذا اسم يدل على زمان مستقبل ولم تستعمل
  الامضافة الى جملد تقول أجيئك اذا احرّ البسر واذا قدم فلان والذى يدل على ائم ااسم
  وقوعها موقع قولك آ ييك يوم يقدم فلان وهى ظرف وفيها مجازاة لان جزاء الشرط ثلاثة
  أشماء أحدها الفعل كقولك ان تاقى آنك والثانى الفاء كقولك ان تأنى فأناعسن المك
  والشالث اذا كقوله أعالى وان تصبهم سيئة بم قدّمت أيديهم اذا ه-م يقنطون وتكون للشه
  توافقه فى حال أنت فيها وذلك نهوة ولك خرجت فاذا زيد قائم المعسنى خرحت ففاجأنى زيد
  فى الوقت بقسام وأما اذفهو لما مضومن الزمان وقد تكون للمفاجأة مثل اذا ولا يليها
  الا الفعل الواجب وذلك ضوقولك بينها أنا كذا اذجازيد وقد تزادان جميعا فى الكلام
  كقوله تعالى واذوعدناموسى أى وعدنا وقول الشاءر
  حتى اذا أساكوهم فى قتائدة • شلا كماتطردالهالة الشردا
  أى حتى أسلكوه-م فى قنائدة لانه آخر القصيدة أو يكون قد كف عى خبره لع-لم السنامع
  ⁦( الا )⁩ الى حرف خافض وهو منتهى لا يتداء الغاية تقول خرجت من الكوفة الى مكة
  وجائر أن تكون دخلتها وجائز أن تكون بلغتها ولم تدخلها لان المنهايه تشعل أوّل الحد
  وآخره وانما تمتنع مجارزته وربعا استعمل بعنى عند قال الراحى
  فقدسادت الى الغوائيا * وقد تحى بمعنى مع كقولهم الذود الى الذودابل قال اقله تعالى ولا
  تأكاوا أموالهم الى أمو الكم وقال من أنصارى الى اللّٰه أى مع اللّٰه وقال واذا خلوا الى
  شياطيتهم قال سيبويه ألم الى وعلى منقلبتان من واوين لان الالفات لا تكون فيها الامالة
  ولوسعى يه رجل قيل فى تنفيته الوان وعلوان فاذا اتصل به المضمر قلبة، ياه فقلت اليك وعليك
  وبعض العرب يتركه على حاله فيقول الالك وعلاك وأما ألا فحرف يفتعح به المكلام للتنبيه تقول
  ألا ان زيدا خارج كمانة ول اعلم أن زيد اخارج وأما أولو فجمع لا واحدله من افظه واحده ذو
  وألات للاناث وا-دتهاذات تول جاءنى أولو الالباب وألات الاحال وأما أول. فهو أيضا
  جع لا واحدله من لفظه واحدء ذ اللهذ كروذه للمؤنت يمدّوية صرفان قصرته كتيته باليا. ران
  مددته بنيته على الكسر ويستوى فيه المذكر والمؤنت وتصغيره إوليايضم الهسمزة وتشديد
  الياء يمدو يقصر لات تصغير المبهم لا يغسير أوله بل يترل" على ماهو عليه من قتح أرضم وتدخل
  ياء التصغير ثانية اذا كان على حرفين وثالثة اذا كان على ثلاثة أحرف وتدخل عليهها
  للتنبيه تقول هولاه قال أبوز يدومن العرب من يقول هؤلا قومك قينون ويكسرالهسمزة
  وتدخل عليه السكاف للخطاب تقول أولئك وأولاك قال الكساف من قال أولمك فواحد.
  ذلك وحن قال أولاد قواحده ذالذوأ ولالك مثل أوائك وأنشداين السكيت
  أولالك قومى لم يكونوا أشابة • وهل يعظ الضليل الا أولااكا
