text: "… وقال الحافظ وفي هذا الحديث دليل على ماذهب اليه مكحول ومن تابعه في تفسير قوله غسل واغتسل والله اعلم وعن أبى سعيد الحدرى عن رسول اللّٰه وتايا قال غسل يوم الجمعة واجب على كل محتلم وسواك ويمس من الطيب ماقدر …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 4، ص 257، يرد فيه ذكر ما وجب على كل مسلم، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 4, p. 257, whose wording mentions a duty laid on every Muslim, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 4، ص 257 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
