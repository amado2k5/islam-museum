label: { ar: "سنن أبي داود 3100 — عيادة المريض", en: "Sunan Abi Dawud 3100 — visiting the sick", ur: "سنن ابی داؤد 3100 — بیمار کی عیادت", es: "Sunan Abi Dawud 3100 — visitando a los enfermos", fr: "Sunan Abi Dawud 3100 — Visite aux malades", tr: "Sunan Abi Dawud 3100 — Hasta Ziyareti", id: "Sunan Abi Dawud 3100 — Menjenguk Orang Sakit" }
text: "… عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ، عَنِ الْحَكَمِ، عَنْ أَبِي جَعْفَرٍ عَبْدِ اللَّهِ بْنِ نَافِعٍ، قَالَ - وَكَانَ نَافِعٌ غُلاَمَ الْحَسَنِ بْنِ عَلِيٍّ - قَالَ جَاءَ أَبُو مُوسَى إِلَى الْحَسَنِ بْنِ عَلِيٍّ يَعُودُهُ. قَالَ أَبُو دَاوُدَ وَسَاقَ مَعْنَى حَدِيثِ شُعْبَةَ. قَالَ أَبُو دَاوُدَ أُسْنِدَ هَذَا عَنْ عَلِيٍّ، عَنِ النَّبِيِّ مِنْ غَيْرِ وَجْهٍ صَحِيحٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3100، يذكر عيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3100 (Funerals (Kitab Al-Jana'iz)), that mentions visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3100، جس میں بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3100 (Funerales (Kitab Al-Jana'iz)), menciona la visita a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3100 (Funérailles (Kitab Al-Jana'iz)), mentionne la visite aux malades. Le Répertoire des ouvrages de médecine le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 3100 numaralı hadiste, hasta ziyaretinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3100, menyebutkan tentang mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
