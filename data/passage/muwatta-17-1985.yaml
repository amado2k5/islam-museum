label: { ar: "الموطأ 1985 — مالك: فيمن اشترى جارية أو دابة فولدت عنده ثم أفلس المشتري، فالجارية أو الدابة وولدها للبائع، إلا أن يرغب الغرماء فيعطوه حقه كاملا ويمسكوه", en: "Muwatta 1985", es: "Muwatta 1985", fr: "Muwatta 1985", ur: "موطا 1985", tr: "Al-Muwatta 1985 — Malik: Bir kimse, elindeyken doğum yapan bir cariye veya hayvan satın alırsa ve sonra alıcı iflas ederse, cariye veya hayvan ve yavruları satıcıya aittir; ancak alacaklılar ona tam borcunu vermek ve onu elinde tutmak isterlerse durum değişir.", id: "Al-Muwatta 1985 — Malik: Mengenai seseorang yang membeli seorang budak perempuan atau seekor hewan yang melahirkan saat berada dalam kepemilikannya, dan kemudian pembeli tersebut bangkrut, maka budak perempuan atau hewan tersebut beserta anaknya menjadi milik penjual, kecuali jika para kreditur ingin memberikan haknya sepenuhnya dan menahannya." }
summary:
  ar: "قال مالك فيمن اشترى جارية أو دابة فولدت عنده، ثم أفلس المشتري: فإن الجارية أو الدابة وولدها للبائع، إلا أن يرغب الغرماء في ذلك، فيعطونه حقه كاملا، ويمسكون ذلك. {cite:muwatta-maruf-1997 p.213}"
  tr: "Malik, bir köle kız veya hayvanı satın alan ve hayvanın kendi mülkiyetindeyken doğum yapması sonucu iflas eden bir kişi hakkında şöyle demiştir: Köle kız veya hayvan ve yavruları, alacaklılar onları tutmak istemedikçe satıcıya aittir; alacaklılar ise ona tam borcunu öder ve hayvanın mülkiyetini elinde tutar. {cite:muwatta-maruf-1997 s.213}"
  id: "Malik berkata mengenai seseorang yang membeli budak perempuan atau hewan yang melahirkan saat berada dalam kepemilikannya, dan kemudian pembeli tersebut bangkrut: budak perempuan atau hewan tersebut dan keturunannya menjadi milik penjual, kecuali jika para kreditur ingin tetap memilikinya, dalam hal ini mereka memberikan hak penuh kepada penjual dan tetap memiliki hewan tersebut. {cite:muwatta-maruf-1997 p.213}"
