text: "النُّعْمَان بنُ قَوْقَل رسول اللّٰه علة فقال: يا رسول الله، أرأيت إن صَلَّيتُ المكتوبات، وصمت رمضان، وحَرَّمت الحرام، وحلَّلت الحلال، لم أزد على ذلك شيئاً، أدخلِ الجنة؟ قال: نعم. قال: فوالله لا أزِيدُ عليه شيئاً مسلم، وأحمد. أخرجه الثلاثة. - …"
