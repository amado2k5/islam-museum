  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 486 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
