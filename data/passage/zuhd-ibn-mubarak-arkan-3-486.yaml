text: "وإذا خبث أعلاه خبث أسفله. أخبرنا شريك بن عبد الله عن يعلى بن عطاء عن أبيه عن عبد اللّه بن عمرو قال : إن الدنيا جنة الكافر وسجن المؤمن، وإنما مثل المؤمن حين تخرج نفسه كمثل رجل كان فى سجن …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 486، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 486, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 486 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ibn al-Mubarak, volumen 3, pág. 486, que menciona la semejanza del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Zuhd d'Ibn al-Mubarak (tome 3, p. 486) évoquant la ressemblance du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 486. sayfasından, mümin kıssasını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Asketisme), Jilid 3, halaman 486, yang menyebutkan perumpamaan orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
