text: "… لمَا فيه مِن صلَةٍ الأرحامِ، والوقوفِ إلَى ما ندَبَ إليه النبيُّ وَل فِ بيقولِه ا عل تعلَّمُوا مِن أنسابِكم ما تصِلُونَ به أرحامَكم. روَى أنسُ بنُ عياضٍ، عن عبدِ المَلِكِ بنِ عيسَى التَّقفيِّ، عن عبدِ اللهِ بنِ يزيدَ مولَى المُنبعِثِ، …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 5، ص 154، يرد فيه ذكر المندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 5, p. 154, whose wording mentions the recommended (mandub), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 5، ص 154 کا اقتباس جس میں مندوب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Isti'ab de Ibn 'Abd al-Barr, volume numérisé 5, p. 154, dont le texte mentionne le recommandé (mandub), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen digitalizado 5, p. 154, cuyo texto menciona lo recomendado (mandub), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin 5. cildinin 154. sayfasından, tavsiye edilen amelleri ve tavsiye etme eylemini anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 5, halaman 154, yang menyebutkan amalan-amalan yang dianjurkan dan amalan menganjurkan itu sendiri; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan-amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
