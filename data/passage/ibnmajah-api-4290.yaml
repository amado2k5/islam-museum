label: { ar: "سنن ابن ماجه 4290 — الحساب", en: "Sunan Ibn Majah 4290 — the reckoning", ur: "سنن ابن ماجہ 4290 — حساب" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، حَدَّثَنَا أَبُو سَلَمَةَ، حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ سَعِيدِ بْنِ إِيَاسٍ الْجُرَيْرِيِّ، عَنْ أَبِي نَضْرَةَ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ ـ قَالَ نَحْنُ آخِرُ الأُمَمِ وَأَوَّلُ مَنْ يُحَاسَبُ يُقَالُ أَيْنَ الأُمَّةُ الأُمِّيَّةُ وَنَبِيُّهَا فَنَحْنُ الآخِرُونَ الأَوَّلُونَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4290، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 4290 (Zuhd), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4290، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
