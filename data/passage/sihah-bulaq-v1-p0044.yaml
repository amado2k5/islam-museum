text: |-
  ٥٩٧
  الى الظؤورة ومنه قول رؤبة أن تيمالم يراضع مسبعا وأسبع عبده أى أهمله قال
  أبوذؤيب
  يحب الشوارب لا يزال كأنه • عبدلا ل أبد بيعة مسب
  مذه رواية الاصحى وقال أبو سعيد الضرير مسبع بكسر الباء قال فشبه المادوهو نهق
  بعبد قد صادف فى غنه سبعافهو يهجهج به ايزجره عنها قال وأبو ربيعة فى بنى سعد بن بكر
  وفى غيرهم ولمكن جيران أبى ذويب بنوسعد بن بكر وهم أصحاب غنم والمسبوعة البقرة التى
  كل السمع ولدها وقولهم هوساعى البدن أى تامّ البدن والسبمع بطن من همدان رهط
  أبى اسحق السبيعى والسبيع أيضا السبع وهوحز من سبعة والاسبوع من الايام وطفت
  بالبيت اسبوعا أى سبع مرّات وثلاثة أسابيع والسبعان بضم الباءموضع ولم بأت على
  فعلان غسيره قال ابن مقبل
  ألاياديار الحى بالسبعان • أملّ عليها بالبلى الملوان
  وسبعت الشى تسبيها جعلته سبعة وقواه-م وزن سبعة يعنون به سبعة مناقيل( جع
  السمجيع الكلام المقفى والجم-ع اسجاع وأساجمع وقد مجع الرجل سجعا وسجيع تسجيها
  وكلام مسجع ويدتهم آسجوعة وسجعت المهامة أى هدرت وسجعت النعاقة أى مدت حنينها
  على جهة واحدة قال أبوزيد الساجع القاصد وأنشدلذى الرمة
  قطعت بها أرضائرى وجه ركيها • اذا ماعلوها مكفا غير ساجع
  أى جاراغير قاصد رع لسرعة نقبص البطء تقول منه سرع سرعامنال صغر صغرا
  فهوسريع وعجبت من سرعة ذاك وسرع ذالمثال صغر ذاك عن يعقوب وقولهم السرع
  السرع مثال الوحا الوحا وأسرع فى السيروهو فى الاصل متعدّ والمسارعة الى الشى المبادرة
  اليه وتسرّع الى الشرّ وسرعان ذاخر وجا ومرعان وسرعان ثلاث لغات أى سرع ذاخروجا
  نقلت قهحة العين الى النون لانه معدول من سرع فبنى عليه ولسرعان ماصنعت كذا أى
  ما أسرع وقول الباهلى أنوراسرع ماذا با فروق • وحبل الوصل منتكث حذيق
  أراد سرع فحفف والعرب تخفف الضمة والكسرة لتقلهمافتة ول للفخذ فخذ وللعضد عضد
  ولا تقول للحجر حجر نظفة الفتحة أبوز يد أسرع القوم أذا كانت دوابهم سراعا وسادعوا الى
  كذا وتسارعوا اليه بعنى وسرعان الناس بالتحدريك أو ائلهم وهذا يلزم الاعراب نونه
  فى كل وجه والسرع القضيب من قضبان الكرم الغض لسنته وكل قضيب رطب سرع
  وسرعرع والسرعرع أيضا الشاب الماعم البدن والاساريع شكر تخرج فى أصل الحبلة قال
  ابن السكيت البسروع والاسروع دودة جراء تكون فى البقل ثم تنسلخ فتصير ة راشة
  والاصل يسروع بالفتح لانه ليس فى الكلام يفعول قال سيبويه وانماذعوا أوّلها تبا عالضمة
  الراء كما فالوا أسودين يعو ١ ال ذوالرمة
  وحق سرت بعذالكرى فى اوية * أساريع معروف وصرت جناديه
  واقوة ماذبل من البقل يقول قد اشتد الحرقان الاساريع لا تسرى على البقل الاليلالان
  شدة الحرنهاراتقتاها وقال القنانى الاسروع دود -والرور بيض الجسدتكون فى الرمل
  نشبه بها أصابع النساء وأنشدلامرئ القيس
  صحاح
  قوله والجمع أسجاع يستدرك بة
  وبأشكال اضباع واسماع على
  ذولهم فعل الحيح
  العن لا يجمع
  على أفعال الافى ثلاثة ألضاظ
  فرخ وزندوحل قاله نصر
