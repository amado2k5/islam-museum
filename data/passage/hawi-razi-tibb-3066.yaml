text: "الأدوية المفردة باب الخاء مخلوطاً بسقمونيا وملح أسهل بلغماً ومرة. وقد يطبخ بالعدس والأمراق ويستعمل للإسهال. وهو نافع من الصرع والمالنخوليا والفالج والجنون ووجع المفاصل. ومتى احتمل أدر الطمث وقتل الجنين بقوة. وإذا أدخل في ثقب النواصير وترك فيها ثلاثة …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3066، يذكر الوجع، وأسماء الأمراض، والصرع، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3066, that mentions pain, named diseases, epilepsy, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
