text: "- - آخر رزق له، فاتقوا اللّٰه وأجملوا فى الطلب، أخذ الحلال وترك الحرام. غريب من حديث عمل وشعبة تفرد وهب بن جرير. حدثنا على بن الفضل ثنا عد بن أيوب ثنا عبد الله بن الجراح ثنا عبدالله ابن مهرو …"
