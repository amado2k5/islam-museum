text: "… نَبِي اللَّهِ وَعِنْدَهُ زَيْدُ نَظَرْتُ إلَيْهِ وَهُوَ يَضْحَكُ، فَقَالَ: نَظَرَتْ فَإِذَا هِيَ لَمْ تَطْلُعْ، فَاقْبَلَ يُسَبِّحُ، حَتَّى إذا ظَنْ. نَظَرْنَا رَسُولَ اللَّهِ ا لَيْلَةً، حَتّى كَانَ قَريبٌ مِنْ نِصْفِ نَظَرُوا إِلَيَ أعْدُو وَرَاءَهُمْ، فَخَلَّيْتُهُمْ عَنْهُ يَعْنِي أجْلَيْتُهُمْ نَعَى لِلنَّاسِ النَّجَاشِيَ …"
summary:
  ar: "مقطع من المنهاج شرح صحيح مسلم بن الحجاج، المجلد المصوَّر 1، ص 1992، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, scan volume 1, p. 1992, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنہاج شرح صحیح مسلم بن الحجاج، اسکین جلد 1، ص 1992 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
