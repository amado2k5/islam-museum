label: { ar: "مسلم 1031 — سبعة يظلهم الله في ظله", en: "Muslim 1031 — Seven God shades in His shade" }
text: "قال رسول الله: «سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: الإمام العادل، وشاب نشأ في عبادة الله، ورجل قلبه معلق في المساجد، ورجلان تحابا في الله اجتمعا عليه وتفرقا عليه، ورجل دعته امرأة ذات منصب وجمال فقال إني أخاف الله، ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه، ورجل ذكر الله خالياً ففاضت عيناه»"
summary:
  ar: "رواية أبي هريرة في كتاب الزكاة من صحيح مسلم؛ سبع صنوف يظلهم الله في ظل عرشه يوم القيامة — من أشهر نصوص الوعد."
