label: { ar: "صحيح البخاري 6164 — ضحك وتبسم", en: "Sahih al-Bukhari 6164 — laughter and smiling", ur: "صحیح بخاری 6164 — ہنسی اور تبسم", fr: "Sahih al-Bukhari 6164 — rire et sourire", es: "Sahih al-Bujari 6164 — risa y sonrisa", tr: "Sahih el-Buhari 6164 — Kahkaha ve Gülümseme", id: "Sahih al-Bukhari 6164 — Tawa dan Senyum" }
text: "… . قَالَ لاَ أَسْتَطِيعُ. قَالَ فَأَطْعِمْ سِتِّينَ مِسْكِينًا . قَالَ مَا أَجِدُ. فَأُتِيَ بِعَرَقٍ فَقَالَ خُذْهُ فَتَصَدَّقْ بِهِ . فَقَالَ يَا رَسُولَ اللَّهِ أَعَلَى غَيْرِ أَهْلِي فَوَالَّذِي نَفْسِي بِيَدِهِ مَا بَيْنَ طُنُبَىِ الْمَدِينَةِ أَحْوَجُ مِنِّي. فَضَحِكَ النَّبِيُّ حَتَّى بَدَتْ أَنْيَابُهُ قَالَ خُذْهُ . تَابَعَهُ يُونُسُ عَنِ الزُّهْرِيِّ. وَقَالَ عَبْدُ الرَّحْمَنِ بْنُ خَالِدٍ عَنِ الزُّهْرِيِّ وَيْلَكَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6164، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 6164, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 6164، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6164, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 6164, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 6164 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6164, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
