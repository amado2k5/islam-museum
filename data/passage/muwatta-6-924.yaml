label: { ar: "الموطأ 924 — الوليد بن عبد الملك سأل سالم بن عبد الله وخارجة بن زيد عن الطيب بعد الرمي والحلق قبل الإفاضة؛ فنهاه سالم ورخص له خارجة", en: "Muwatta 924" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد وعبد الله بن أبي بكر وربيعة بن أبي عبد الرحمن أن الوليد بن عبد الملك سأل سالم بن عبد الله وخارجة بن زيد بن ثابت، بعد أن رمى الجمرة وحلق رأسه وقبل أن يفيض، عن الطيب، فنهاه سالم وأرخص له خارجة. ويذكر المحقق أن أبا مصعب (1059) وسويداً (493) رويا ذلك. {cite:muwatta-maruf-1997 p.443} {cite:muwatta-maruf-1997 p.444}"
