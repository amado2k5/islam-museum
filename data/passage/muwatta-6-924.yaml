ref: "924"
label: { ar: "الموطأ 924 — الوليد بن عبد الملك سأل سالم بن عبد الله وخارجة بن زيد عن الطيب بعد الرمي والحلق قبل الإفاضة؛ فنهاه سالم ورخص له خارجة", en: "Muwatta 924", es: "Muwatta 924", fr: "Muwatta 924", ur: "موطا 924", tr: "Al-Muwatta 924 - Al-Walid ibn Abd al-Malik, Salim ibn Abdullah ve Kharijah ibn Zeyd'e Cemaratı taşladıktan ve İfade tavafından önce tıraş olduktan sonra parfüm kullanmasını sordu; Selim yasakladı, Harice ise izin verdi.", id: "Al-Muwatta 924 — Al-Walid ibn Abd al-Malik bertanya kepada Salim ibn Abdullah dan Kharijah ibn Zayd tentang penggunaan parfum setelah melempar jumrah dan bercukur sebelum Tawaf al-Ifadah; Salim melarangnya, sedangkan Kharijah mengizinkannya." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد وعبد الله بن أبي بكر وربيعة بن أبي عبد الرحمن أن الوليد بن عبد الملك سأل سالم بن عبد الله وخارجة بن زيد بن ثابت، بعد أن رمى الجمرة وحلق رأسه وقبل أن يفيض، عن الطيب، فنهاه سالم وأرخص له خارجة. ويذكر المحقق أن أبا مصعب (1059) وسويداً (493) رويا ذلك. {cite:muwatta-maruf-1997 p.443} {cite:muwatta-maruf-1997 p.444}"
  tr: "Malik, Yahya ibn Sa'id, Abdullah ibn Abi Bakr ve Rabi'ah ibn Abi Abd al-Rahman'dan rivayet ettiğine göre, el-Walid ibn Abd al-Malik, Cemarat'ı taşladıktan ve başını tıraş ettikten sonra, Tavaf-ı İfade'yi yapmadan önce Salim ibn Abdullah ve Kharijah ibn Zayd ibn Thabit'e parfüm kullanmak hakkında sormuştur. Salim bunu yasaklamış, Kharijah ise izin vermiştir. Araştırmacı, bunun Ebu Mus'ab (ö. 1059) ve Suwayd (ö. 493) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.443} {cite:muwatta-maruf-1997 s.444}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, Abdullah ibn Abi Bakr, dan Rabi'ah ibn Abi Abd al-Rahman, bahwa al-Walid ibn Abd al-Malik bertanya kepada Salim ibn Abdullah dan Kharijah ibn Zayd ibn Thabit, setelah ia melempar Jamarat dan mencukur kepalanya, dan sebelum ia melakukan Tawaf al-Ifadah, tentang penggunaan parfum. Salim melarangnya, sedangkan Kharijah memperbolehkannya. Peneliti menyebutkan bahwa Abu Mus'ab (wafat 1059) dan Suwayd (wafat 493) meriwayatkan hal ini. {cite:muwatta-maruf-1997 p.443} {cite:muwatta-maruf-1997 p.444}"
