label: { ar: "مسلم 2888 — إذا تواجه المسلمان بسيفيهما فالقاتل والمقتول في النار", en: "Muslim 2888 — When two Muslims clash with swords" }
text: "قال أبو بكرة لمن أراد نصر علي: ارجع، فإني سمعت رسول الله يقول: إذا تواجه المسلمان بسيفيهما فالقاتل والمقتول في النار، فقلت: يا رسول الله هذا القاتل فما بال المقتول؟ قال: إنه قد أراد قتل صاحبه"
summary:
  ar: "رواية أبي بكرة في باب إذا تواجه المسلمان بسيفيهما من كتاب الفتن في صحيح مسلم؛ قصده هو نفسه الاعتزال عن فتنة القتال بين المسلمين."
