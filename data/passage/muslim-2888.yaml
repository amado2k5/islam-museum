label: { ar: "مسلم 2888 — إذا تواجه المسلمان بسيفيهما فالقاتل والمقتول في النار", en: "Muslim 2888 — When two Muslims clash with swords", es: "Musulmán 2888 — Cuando dos musulmanes se enfrentan con espadas", fr: "Muslim 2888 — Quand deux musulmans s'affrontent à l'épée", ur: "مسلم 2888 - جب دو مسلمان تلواروں سے ٹکرا گئے۔", tr: "Müslim 2888 — İki Müslüman kılıçlarıyla karşı karşıya gelirse, hem öldüren hem de öldürülen cehennem ateşinde olacaktır.", id: "Muslim 2888 — Jika dua orang Muslim saling berhadapan dengan pedang, baik pembunuh maupun yang terbunuh akan berada di dalam api neraka." }
text: "قال أبو بكرة لمن أراد نصر علي: ارجع، فإني سمعت رسول الله يقول: إذا تواجه المسلمان بسيفيهما فالقاتل والمقتول في النار، فقلت: يا رسول الله هذا القاتل فما بال المقتول؟ قال: إنه قد أراد قتل صاحبه"
summary:
  ar: "رواية أبي بكرة في باب إذا تواجه المسلمان بسيفيهما من كتاب الفتن في صحيح مسلم؛ قصده هو نفسه الاعتزال عن فتنة القتال بين المسلمين."
  tr: "Sahih Müslim'deki Mucizeler Kitabı'nın \"İki Müslüman kılıçlarıyla karşı karşıya gelirse\" bölümünde Ebu Bekir'in rivayetinde; amacı Müslümanlar arasındaki savaş musibetinden kaçınmaktır."
  id: "Riwayat Abu Bakra dalam bab \"Jika dua Muslim saling berhadapan dengan pedang mereka\" dari Kitab Cobaan dalam Sahih Muslim; maksudnya adalah untuk menghindari cobaan berupa pertempuran antar Muslim."
