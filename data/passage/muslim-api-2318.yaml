label: { ar: "صحيح مسلم 2318 — الأجران", en: "Sahih Muslim 2318 — the double reward", ur: "صحیح مسلم 2318 — دوہرا اجر" }
text: "… عَلَى أَزْوَاجِهِمَا وَعَلَى أَيْتَامٍ فِي حُجُورِهِمَا وَلاَ تُخْبِرْهُ مَنْ نَحْنُ - قَالَتْ - فَدَخَلَ بِلاَلٌ عَلَى رَسُولِ اللَّهِ فَسَأَلَهُ فَقَالَ لَهُ رَسُولُ اللَّهِ \" مَنْ هُمَا \". فَقَالَ امْرَأَةٌ مِنَ الأَنْصَارِ وَزَيْنَبُ. فَقَالَ رَسُولُ اللَّهِ \" أَىُّ الزَّيَانِبِ \". قَالَ امْرَأَةُ عَبْدِ اللَّهِ. فَقَالَ لَهُ رَسُولُ اللَّهِ \" لَهُمَا أَجْرَانِ أَجْرُ الْقَرَابَةِ وَأَجْرُ الصَّدَقَةِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2318، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 2318 (The Book of Zakat), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 2318، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
