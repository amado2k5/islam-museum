text: "… تلك الليلة ستة عشر ذراعا، فاستجاب اللّٰه بتطوله لعمر بن الخطاب. كما استجاب لقبيه موسى' ذكر الجزية قال : وكان عمرو يبعث إلى عمر بن الخطاب بالجزية بعد حبس ما كان يحتاج إليه، وكانت فريضة مصر، كماحدثنا عثمان بن صالح …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 235، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 235, whose wording mentions the obligation (farida); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 235 کا اقتباس جس میں فریضہ اور فرائض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Futuh Misr de Ibn 'Abd al-Hakam, p. 235, dont le texte mentionne l'obligation (farida) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Futuh Misr de Ibn 'Abd al-Hakam, p. 235, cuyo texto menciona la obligación (farida); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abdül-Hakam'ın *Futuh Misr* adlı eserinin 235. sayfasından bir alıntı, farz olan fiilleri ve görevleri ele almaktadır; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Futuh Misr* karya Ibnu Abd al-Hakam, halaman 235, menyebutkan amalan dan kewajiban yang wajib dilakukan; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
