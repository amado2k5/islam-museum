text: "… الطِلَّسْم فَاذَ بِكَنْزِهِ أكثر اسقام البدن والقلب من عدم الصبر وأكثرُ أسقام البدن والقلب، إنما تنشأ عن عدم الصبر، فما حُفِظَت صِحَةُ القلوب والأبدان والأرواح بمثل الصبر، فهو الفاروق الأكبر، والتِّرياق الأعظم، ولو لم يكن فيه إلا معيةُ اللهِ مع …"
