text: "… ذي نواس وقصة أصحاب الأخدود.. ذكر ملك الحبشة اليمن...... ابن يزدجرد الأثيم... ذكر ملك كسرى بلاد الروم... ذكر ما فعله أنوشروان بأرمينية وأذربيجان.. ذكر أمر الفيل... ذكر عود اليمن إلى حمير وإخراج الحبشة عنه. ذكر ما أحدثه قريش بعد الفيل.. …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 592، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 3, p. 592, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 3، ص 592 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Al-Kamil fi al-Tarikh de Ibn al-Athir, volumen 3, pág. 592, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du livre d'Ibn al-Athir, al-Kamil fi al-Tarikh (tome 3, page 592), mentionnant des nations, des religions et des peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 3. cildinin 592. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Kutipan dari kitab *Al-Kamil fi al-Tarikh* karya Ibn al-Athir, Jilid 3, halaman 592, yang menyebutkan bangsa, agama, dan kaum non-Muslim; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan kaum non-Muslim."
