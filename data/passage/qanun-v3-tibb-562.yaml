text: "… الصلب في. الرحم المقالة السابعة عرق النسا والنقرس و المفاصل في أوجاع ضمّاد لوجع المفاصل والنقرس : يتخذ بالشوكران والغاريقون وهو دواء منجح. أخلاطه: يؤخذ بزر الشوكران قسط، غاريقون قسط، حلبة قسط، بورق أوقية، شمع رطل، راتينج مطبوخ رطل، أشق …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 562، يذكر الوجع، وأسماء الأمراض، وأطوار خلق الجنين، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 562, that mentions pain, named diseases, the stages of the embryo, the organs of the body, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 562 کا اقتباس جس میں درد، بیماریوں کے نام، جنین کے مراحل، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
