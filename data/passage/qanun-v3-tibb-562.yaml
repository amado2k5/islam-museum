text: "… الصلب في. الرحم المقالة السابعة عرق النسا والنقرس و المفاصل في أوجاع ضمّاد لوجع المفاصل والنقرس : يتخذ بالشوكران والغاريقون وهو دواء منجح. أخلاطه: يؤخذ بزر الشوكران قسط، غاريقون قسط، حلبة قسط، بورق أوقية، شمع رطل، راتينج مطبوخ رطل، أشق …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 562، يذكر الوجع، وأسماء الأمراض، وأطوار خلق الجنين، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 562, that mentions pain, named diseases, the stages of the embryo, the organs of the body, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 562 کا اقتباس جس میں درد، بیماریوں کے نام، جنین کے مراحل، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 562, que menciona el dolor, enfermedades específicas, las etapas del embrión, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el medicamento, los medicamentos y la farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 562, qui mentionne la douleur, les maladies nommées, les stades de l'embryon, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 562. sayfasından bir bölüm; ağrı, hastalık isimleri, fetüs gelişim evreleri, vücut organları, cerrahi, sünnet, ateller, tıp, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 562, yang menyebutkan rasa sakit, nama-nama penyakit, tahapan perkembangan janin, organ tubuh, pembedahan, sunat, bidai, obat-obatan, narkoba, dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
