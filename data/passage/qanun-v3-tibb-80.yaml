text: "… والأضمدة وكثيراً ما يوقع فيه اضطرار الطبيب لسقوط القوة وتواتر الغشي إلى سقي الخمر وماء اللحم، ودواء المسك ونحوه، وقد يتركب الدِّقّ مع حمّيات العفونة والأورام، والدق في أول الأمر عسر المعرفة سهل العلاج، وفي آخره سهل المعرفة صعب العلاج، …"
