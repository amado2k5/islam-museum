label: { ar: "الموطأ 1774 — يحيى عن مالك: الرضاعة في الحولين قليلها وكثيرها تحرم، وما كان بعد الحولين فلا يحرم شيئا وهو بمنزلة الطعام", en: "Muwatta 1774", es: "Muwatta 1774", fr: "Muwatta 1774", ur: "موطا 1774", tr: "El-Muvatta 1774 — Yahya, Malik'ten rivayetle: İlk iki yıl boyunca az ya da çok emzirme haram kılar, ancak ilk iki yıldan sonra emzirme haram kılmaz ve yiyecek gibidir.", id: "Al-Muwatta 1774 — Yahya berdasarkan riwayat Malik: Menyusui selama dua tahun pertama, baik sedikit maupun banyak, hukumnya haram, tetapi apa yang terjadi setelah dua tahun pertama tidak haram dan seperti makanan." }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: الرضاعة، قليلها وكثيرها، إذا كانت في الحولين تحرم. فأما ما كان بعد الحولين فإن قليله وكثيره لا يحرم شيئا، وإنما هو بمنزلة الطعام. {cite:muwatta-maruf-1997 p.123}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Emzirme, az ya da çok olsun, ilk iki yıl içinde gerçekleşirse evliliği yasaklar. Ancak ilk iki yıldan sonra emzirme, az ya da çok olsun, herhangi bir yasak oluşturmaz; tıpkı yemek gibidir. {cite:muwatta-maruf-1997 s.123}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Menyusui, baik sedikit maupun banyak, mengharamkan pernikahan jika terjadi dalam dua tahun pertama. Namun, menyusui setelah dua tahun pertama, baik sedikit maupun banyak, tidak mengharamkan pernikahan; itu hanya seperti makanan. {cite:muwatta-maruf-1997 p.123}"
