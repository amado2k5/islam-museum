summary:
  ar: "قال يحيى: وسمعت مالكا يقول: الرضاعة، قليلها وكثيرها، إذا كانت في الحولين تحرم. فأما ما كان بعد الحولين فإن قليله وكثيره لا يحرم شيئا، وإنما هو بمنزلة الطعام. {cite:muwatta-maruf-1997 p.123}"
