text: "… خطاب هذا الخبر وقع على بعض النساء، أراد به نساءه وَلِلفه، والقصد فيه بعض الأحوال، وهو الحال الذي يكون عليهن إقامة الفرائض فيه كالصلاة والحج وما أَشبههما. - ذكر الإباحة للمرء أَن يؤخر أَداء الحج إذا فرض عليه عن سنته …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 1018، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 1018, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 1018 کا اقتباس جس میں فریضہ اور فرائض، جو لوگوں پر فرض کیا گیا، فرض، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 3, p. 1018, dont le texte mentionne l'obligation (farida), ce qui a été imposé aux gens, l'obligatoire (fard), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 3, p. 1018, cuyo texto menciona la obligación (farida), lo que se impuso a la gente, lo obligatorio (fard), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, Resimli Cilt 3, sayfa 1018'den, farz olan amelleri ve görevleri, insanlar için farz olanları ve caiz olanları anlatan bir alıntı. Bu alıntı, makine tarafından okunabilir, taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh edilen amelleri, haram olan amelleri ve küçük günahları konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid Bergambar 3, halaman 1018, yang menyebutkan amalan dan kewajiban wajib, apa yang dianjurkan bagi manusia, dan apa yang diperbolehkan. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
