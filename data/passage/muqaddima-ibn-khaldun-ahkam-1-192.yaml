text: "… وقد نهى أبو بكر عنه لَا دُعي به، وقال: لست خليفة الله، ولكني خليفة رسول الله يل. ولأن الاستخلاف إنما هو في حق الغائب، وأما الحاضر فلا. ثم إن نصب الإمام واجبٌ قد عرف وجوبه في الشرع بإجماع الصحابة والتابعين، …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 192، يرد فيه ذكر الواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 1, p. 192, whose wording mentions the obligatory (wajib), obligation (wujub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 1، ص 192 کا اقتباس جس میں واجب، وجوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Muqaddima de Ibn Khaldun, volume numérisé 1, p. 192, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Muqaddima de Ibn Khaldun, volumen digitalizado 1, p. 192, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Haldun'un Mukaddime'sinin 1. cildinin 192. sayfasından, \"zorunluluk\" ve \"görev\" terimlerinden bahseden bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Muqaddimah karya Ibnu Khaldun, Jilid 1, halaman 192, yang menyebutkan istilah \"kewajiban\" dan \"tugas.\" Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam perbuatan wajib, tugas, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
