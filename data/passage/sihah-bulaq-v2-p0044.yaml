text: |-
  •(باب الواو والياه,
  •⁦(لذى)⁩.
  B٤P
  ويقال وقع فلان فى اللتيا والتى وهما اسمان من أسماء الداهية(لتى لى الشى بالكسر
  يلتى لثا أى ندى وه-ذانوب لث على فعل اذا ابتلّ من العرق واتسخ ولى الثوب وسيخه قال
  أبو عمر والتى ما يسيل من الشجر كالصمغ فاذاجحد فهوصهرور وألثت الشجرة ماحولها اذا
  كانت يقطر.نها ماء واللئة بالتخفيف ما حول الاسنان وأصله التى والهاءع وض من الياء
  وجمعها لئات وأى ( حى للحى منبت اللحية من الانسان وغيره والنسبة اليملحوى" وهما
  لحيان وثلاثة ألح على أفعل الاأنهم كسروا الحاء لتسلم الياء والكثير لحى" على فعول مثل ندىّ
  وظبيّ ودلىّ وهو فعول ولحيان أبو قبيلة وهولحيان بن هذيل بن مدركة واللحية معروفة
  والجمع لحى ولحى أيضا بالضم مثل ذروة وذرا عن يعقوب وقد التهحى الغلام ورجل لحبانى
  عظيم اللحية وأبو الحسن على بن خازم يلقب بذلك والتلهى نطويق العمامة تحت الحنك وفى
  الحديث نهى عن الاقتعاط وأمر بالتلحى واللحاء عدودقشر الشجر وفى المنسل لا تدخل بين
  العصارلحائها ولحوت العصا ألحوها لحوا اذاقشرتها وكذلك لحيت العصاألحى لحيا وقال
  لحمينهم لحى العصافطردنهم * الى سنة قردانهالم تحلم
  ولحيت الرجل ألحام لحيا اذالمته فهو ملحى ولا حيتهملاحاة ولحاءاذا نا زعته وفى المثل من
  لاسال فقد عاداك وتلاحوا اذا تنازعوا وقولهم لماه اللّٰه أى قيحه ولعنه ( حى للخى
  كثرة الكلام فى باطل تقول رجل أخحى وامر أقنحواء وقد لحى بالسكسر نلحى وبعير لخ وأنخى
  وناقة حواء اذا كانت احدى ركبتيها أعظم من الاخرى مثل الاركب والالحى المعوج
  وعقاب ظواء لان منقارها الاعلى أطول من الاسفل واللغى أيضا المسعط والملخى مشله
  وقد نلحوت الرجل ولحيته وأظحيتها بمعنى أى أسعطته وأنلحمته مالا أى أعطيته واللخى أيضا
  نعت التبل المضطرب الكثير الماء والصى"يلتخى التخا"اذا أكل خبزا مبلولا والاسم اللخاء
  ثل الغذاء ى دى لغة فى لدن قال تعالى وألفياسيدها لدى الباب واتصاله بالمضمرات
  كاتصال عليك وقد أغرى به الشاء رفى قوله
  فدع عنك الصباولديك هما * توقس فى فوادك واختالا
  (لذى الذى اسم مبهم للمذ كروهومبنى معرفة ولا يتم الايصلة وأصله لذى فأدخل عليه
  الالف واللام ولا يجوز أن ينزعاءنه لتنكير وفيه أربع لغات الذى واللذبكسر الذال واللذ
  ياسكانها والذىّ بتشديد الياء وفى تثنيته ثلاث لغات اللذان واللذايحذف النون قال
  الاخطال
  أبى كليب ان عمى اللذا • قتلا اللمولك وفسككا الاغلالا
  واللذان بتشديد الذون وفى بجعهالغتان الذين فى الرفع والنصب والجرّ والذى بحذف النون
  قال الشاعر
  .وانّ الذى حانت بفلج دماؤهم * هم القوم كل القوم يا أم جالد
  يعنى الذين ومنهم من يقول فى الرفع اللذون وزعم بعضهم أنّ أصله ذا لانك تقول ماذارأيت
  بمعنى ما الدى رأيت وهذابعيدلات السكامة ثلاثية ولا يجوز أن يكون أصلها حرفا واحدا
  وتصغير الذى اللذيا بالفتح والتشديد فاذا ثنيت المصغر أوجعته حذفت الالف فقات اللذيان
  واللذيون وقول الشاعر
  فان أدع اللواتى من أناس * أضاء وهن لا أدع الذينا
