label: { ar: "موطأ مالك 132 — الأب والأبوة", en: "Muwatta Malik 132 — the father and fatherhood", ur: "موطأ مالک 132 — باپ اور والدیت", es: "Muwatta Malik 132 — El padre y la paternidad", fr: "Muwatta Malik 132 — le père et la paternité", tr: "Muwatta Malik 132 — Baba ve Babalık", id: "Muwatta Malik 132 — Sang Ayah dan Peran Ayah" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، زَوْجِ النَّبِيِّ أَنَّهَا قَالَتْ كُنْتُ أُرَجِّلُ رَأْسَ رَسُولِ اللَّهِ وَأَنَا حَائِضٌ."
summary:
  ar: "حديث في موطأ مالك، رقم 132، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 132 (Purity), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 132، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 132 (Pureza), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 132 (Pureté), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Malik'in Muwatta adlı eserinde 132 numaralı hadis, baba ve babalık kavramından bahsetmektedir. Araştırmacı, bu hadisi İslam'da babalık bölümünde, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 132, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits ini dalam bagian tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
