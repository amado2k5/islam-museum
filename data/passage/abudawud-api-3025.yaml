label: { ar: "سنن أبي داود 3025 — الأب والأبوة", en: "Sunan Abi Dawud 3025 — the father and fatherhood", ur: "سنن ابی داؤد 3025 — باپ اور والدیت", es: "Sunan Abi Dawud 3025 — El padre y la paternidad" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ الصَّبَّاحِ، حَدَّثَنَا إِسْمَاعِيلُ، - يَعْنِي ابْنَ عَبْدِ الْكَرِيمِ - حَدَّثَنِي إِبْرَاهِيمُ، - يَعْنِي ابْنَ عَقِيلِ بْنِ مُنَبِّهٍ - عَنْ أَبِيهِ، عَنْ وَهْبٍ، قَالَ سَأَلْتُ جَابِرًا عَنْ شَأْنِ، ثَقِيفٍ إِذْ بَايَعَتْ قَالَ اشْتَرَطَتْ عَلَى النَّبِيِّ أَنْ لاَ صَدَقَةَ عَلَيْهَا وَلاَ جِهَادَ وَأَنَّهُ سَمِعَ النَّبِيَّ بَعْدَ ذَلِكَ يَقُولُ \" سَيَتَصَدَّقُونَ وَيُجَاهِدُونَ إِذَا أَسْلَمُوا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3025، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3025 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3025، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3025 (Tributo, Botín y Gobierno (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
