text: |-
  ⁦(نذر)⁩
  ٤٠٢
  وغعر النهار أوله والحرى اللبة مشدل للذيح فى الحلق ورجل مناروه وللمبالفسة يوصف
  بالجودومن كلام العرب انه لاناريوائكها • أى ينحرسمان الابل وغحرت الرجل أصبت نحره
  وكذلك اذاصرت فى تدره والنحيرة آخريوم من الشهر قال الكميت يصف فعل الامطار
  بالديار والغيث بالمتألفا*ت من الاهلة والنوام وقال أبو الغوث النحيرة آخرليلة من
  الشهر مع يومهالانها تنحر الشهر الذى بعدها أى تصير فى نحره أو نصيب ضره فهى ناحرة
  والمع النواحر واحتج بقول ابن أسحر الباهلى
  ثم استمر عليهاوا كف ه مع • فى ليلة نحرت شوّال أورجبا
  والنحرير العالم المتمن والناحران عرقان فى صدر الفرس ودائرة الناحر تكون فى الجران
  الى أسفل من ذلك ويقال اتتحر الرجل أى فحرنفسه وفى المثل سرق السارق فاتهر واتتجر
  القوم على الشى اذا تشاحواعليه حرصا وتناحروا فى القتال نخر نخر الشئ
  بالمكسر أى إلى وتعتت يقال عظام نخرة ونخرة الريح بالضم شدّة هبوبها والنخرة أيضا
  والنخرة مثل الهمزة مقدم أنف الفرس والجار والخنزير يقال هشم غذرته أى أنفه والمنخر
  ثقب الانف وقد تكسم الميم اتساعال كسرة الحاء كما قالوامنتن وهما نادران لان مفعلا
  ليس من الابنية والمنخورلغة فى المنخر قال الراجز
  يستوعب النوعين من خريره • من لدلحيبيه الى منخوره
  الاصمعى النخور من النوق التى لا تدر حتى يضرب أنفها ويقال حتى تدخل إصبعك
  فى أنفها والنخورى الواسع الاحليسل والنخيرصوت بالانف تقول منه نخر ينخر وينخر نخرا
  وتخيرا والناخر من العظام الذى تدخل الريح فيه ثم تخرج منه وله اتخيرويقال مابها ناخر أى
  مابها أحد حكاه يعتوب عن الباهلى ⁦( ن ر)⁩ ندر الشى تدرندراسقط وشذ ومنه
  التوادروأندره غيره أى أسقطه يقال أندر من الحساب كذا وضرب يده بالسيف
  فأندرها وقول الشاعر
  واذا الكماة تنادر واطعن الكلى • ندرالبكارة فى الجزاء المضعف
  يقول أه_درت دما وهم كما تندر البكارة فى الدية وهى جمع بكر من الابل وقوله-م لقيته
  فى الندرة والندرة أى فيمابين الايام وكذلك لقيته فى الندرى بالتحريك وان شئت لقيته فى
  ندرى بلا ألف ولام والاندر البيدر بلغة أهل الشام والجمع الانادر وقال
  يدق معزاء الطريق العادرى • دق الدياس عرم الانادر
  والاندراسم قرية بالشام تقول اذانسبت اليهاهولاءالاندريون وقول عمروين كلثوم
  الاهبي بسحنك فاصبحينا • ولاتيق خمور الاندرينا
  لمانسب اشلهر الى أهل القرية اجتمعت ثلاث يا آت نفففها اللضرورة كما قال آخر
  وماعلى بسدر البابلينا نذر) الانذار الابلاغ ولا يكون الاف التضويف والاسم
  النذر ومنه قوله تعالى فكيف كان عذاب ونذرأى انذارى والنذير المنذر والنذير
  الانذار والتذر واحد النذوروأماقول ابن أحر
