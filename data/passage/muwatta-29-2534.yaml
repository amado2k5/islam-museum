label: { ar: "الموطأ 2534 — مالك: العبد المقتول فيه القيمة يوم يقتل ولا تحمل عاقلة قاتله منها شيئا", en: "Muwatta 2534" }
summary:
  ar: "قال مالك: الأمر عندنا الذي لا اختلاف فيه: أن العبد إذا قُتل كانت فيه القيمة يوم يقتل، ولا تحمل عاقلة قاتله من قيمة العبد شيئا، قل أو كثر، وإنما ذلك على الذي أصابه في ماله خاصة، بالغا ما بلغ؛ لأن العبد سلعة من السلع. {cite:muwatta-maruf-1997 p.437}"
