text: "… لآتينه يوم كذا إن المؤمن جمع إحساناً وشفقةً إن المؤمن شعبة من المؤمن، إن به حاجته إن المؤمن قوام على نفسه، يحاسب نفسه لله إن المؤمن لا يصبح إلا حزيناً إن المؤمن ليرى ذنبه كأنه تحت صخرة إن المؤمن ليرى …"
