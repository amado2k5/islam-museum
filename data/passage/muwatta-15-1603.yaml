label: { ar: "الموطأ 1603 — مالك: بلغه أن مروان بن الحكم كان يقضي في الرجل إذا آلى من امرأته أنها إذا مضت الأربعة الأشهر فهي تطليقة وله عليها الرجعة، وعلى ذلك كان رأي ابن شهاب", en: "Muwatta 1603", es: "Muwatta 1603", fr: "Muwatta 1603", ur: "موطا 1603", tr: "El-Muvatta 1603 — Malik: Mervan ibn el-Hakam'ın, bir erkek karısından cinsel perhiz yemini ederse, dört ay geçtikten sonra bunun boşanma sayıldığını ve erkeğin karısını geri alma hakkına sahip olduğunu söylediği rivayet edilmiştir. İbn Şihab'ın görüşü de bu yöndeydi.", id: "Al-Muwatta 1603 — Malik: Sampai kepadanya bahwa Marwan ibn al-Hakam biasa memutuskan bahwa jika seorang pria bersumpah untuk tidak berhubungan intim dengan istrinya, jika empat bulan telah berlalu, itu dianggap sebagai perceraian, dan dia berhak untuk mengambilnya kembali. Ini juga merupakan pendapat Ibn Shihab." }
summary:
  ar: "يروي مالك أنه بلغه أن مروان بن الحكم كان يقضي في الرجل إذا آلى من امرأته، أنها إذا مضت الأربعة الأشهر فهي تطليقة، وله عليها الرجعة ما دامت في عدتها. قال مالك وعلى ذلك كان رأي ابن شهاب. {cite:muwatta-maruf-1997 p.66}"
  tr: "Malik, Mervan ibn el-Hakam'ın, bir erkeğin karısından cinsel perhiz yemini etmesi halinde, dört ay geçtikten sonra bunun boşanma sayıldığını ve kadının bekleme süresi içinde olduğu sürece onu geri alma hakkına sahip olduğunu hükmettiğini duyduğunu aktardı. Malik, bunun İbn Şihab'ın da görüşü olduğunu söyledi. {cite:muwatta-maruf-1997 s.66}"
  id: "Malik melaporkan bahwa ia mendengar bahwa Marwan ibn al-Hakam memutuskan bahwa jika seorang pria bersumpah untuk tidak berhubungan intim dengan istrinya, maka jika empat bulan telah berlalu, itu dianggap sebagai perceraian, dan ia berhak untuk mengambilnya kembali selama istrinya masih dalam masa iddah. Malik mengatakan bahwa ini juga merupakan pendapat Ibn Shihab. {cite:muwatta-maruf-1997 p.66}"
