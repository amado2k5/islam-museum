text: "… على ظهر الأرض أحد. وأخرجه البخاري ومسلم من حديث الزهرى '. وقال الإمام أحمد : حدثنا محمد بن أبي عدي، عن سليمان التيمي، عن أبي نضرة، عن جابر بن عبد اللّٰه قال : قال رسول الله عليه قبل موته بقليل …"
