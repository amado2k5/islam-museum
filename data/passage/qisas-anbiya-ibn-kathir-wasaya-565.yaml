text: "… على ظهر الأرض أحد. وأخرجه البخاري ومسلم من حديث الزهرى '. وقال الإمام أحمد : حدثنا محمد بن أبي عدي، عن سليمان التيمي، عن أبي نضرة، عن جابر بن عبد اللّٰه قال : قال رسول الله عليه قبل موته بقليل …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 565، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 565, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 565 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Qisas al-Anbiya' de Ibn Kathir, pág. 565, que menciona un lecho de muerte y las últimas horas; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Qisas al-Anbiya' d'Ibn Kathir, p. 565, évoquant un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire Testaments Browser."
  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 565. sayfasından, ölüm anı ve ölüme dair bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 565, yang menyebutkan saat kematian dan sakaratul maut; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
