label: { ar: "سنن أبي داود 560 — رفع الدرجات", en: "Sunan Abi Dawud 560 — ranks raised", ur: "سنن ابی داؤد 560 — درجات کی بلندی" }
text: "… مَيْمُونٍ، عَنْ عَطَاءِ بْنِ يَزِيدَ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ \" الصَّلاَةُ فِي جَمَاعَةٍ تَعْدِلُ خَمْسًا وَعِشْرِينَ صَلاَةً فَإِذَا صَلاَّهَا فِي فَلاَةٍ فَأَتَمَّ رُكُوعَهَا وَسُجُودَهَا بَلَغَتْ خَمْسِينَ صَلاَةً \". قَالَ أَبُو دَاوُدَ قَالَ عَبْدُ الْوَاحِدِ بْنُ زِيَادٍ فِي الْحَدِيثِ \" صَلاَةُ الرَّجُلِ فِي الْفَلاَةِ تُضَاعَفُ عَلَى صَلاَتِهِ فِي الْجَمَاعَةِ \". وَسَاقَ الْحَدِيثَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 560، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 560 (Prayer (Kitab Al-Salat)), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 560، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
