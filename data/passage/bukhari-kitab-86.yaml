label:
  ar: "صحيح البخاري، كتاب الحدود"
  en: "Sahih al-Bukhari, Book 86: Limits and Punishments set by Allah (Hudood)"
  ur: "صحیح بخاری، کتاب الحدود"
  es: "Sahih al-Bukhari, Libro 86: Límites y castigos establecidos por Allah (Hudood)"
summary:
  ar: "القسم 86 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحدود»، ويضم فيها النصوص من 6772 إلى 6860 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 86 of Sahih al-Bukhari (Limits and Punishments set by Allah (Hudood)) in the division of the open hadith dataset the museum took its reports from: reports 6772 to 6860 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 86، عنوان «کتاب الحدود»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6772 تا 6860۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 86 de Sahih al-Bukhari (Límites y castigos establecidos por Alá (Hudud)) se encuentra en la división del conjunto de datos de hadices abiertos del que el museo extrajo sus informes: informes del 6772 al 6860, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
