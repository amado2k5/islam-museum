label: { ar: "صحيح البخاري 2396 — الأب والأبوة", en: "Sahih al-Bukhari 2396 — the father and fatherhood", ur: "صحیح بخاری 2396 — باپ اور والدیت", es: "Sahih al-Bukhari 2396 — El padre y la paternidad", fr: "Sahih al-Bukhari 2396 — Le père et la paternité", tr: "Sahih el-Buhari 2396 — Baba ve Babalık", id: "Sahih al-Bukhari 2396 — Ayah dan Peran Ayah" }
text: "… الَّذِي لَهُ \". فَجَدَّهُ بَعْدَ مَا رَجَعَ رَسُولُ اللَّهِ فَأَوْفَاهُ ثَلاَثِينَ وَسْقًا، وَفَضَلَتْ لَهُ سَبْعَةَ عَشَرَ وَسْقًا، فَجَاءَ جَابِرٌ رَسُولَ اللَّهِ لِيُخْبِرَهُ بِالَّذِي كَانَ، فَوَجَدَهُ يُصَلِّي الْعَصْرَ، فَلَمَّا انْصَرَفَ أَخْبَرَهُ بِالْفَضْلِ، فَقَالَ \" أَخْبِرْ ذَلِكَ ابْنَ الْخَطَّابِ \". فَذَهَبَ جَابِرٌ إِلَى عُمَرَ، فَأَخْبَرَهُ. فَقَالَ لَهُ عُمَرُ لَقَدْ عَلِمْتُ حِينَ مَشَى فِيهَا رَسُولُ اللَّهِ لَيُبَارَكَنَّ فِيهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 2396، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2396 (Loans, Payment of Loans, Freezing of Property, Bankruptcy), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2396، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2396 (Préstamos, Pago de Préstamos, Congelación de Bienes, Quiebra), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2396 (Prêts, Remboursement des prêts, Gel des biens, Faillite), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 2396 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2396, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
