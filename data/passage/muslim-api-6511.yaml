label: { ar: "صحيح مسلم — من أدرك والديه عند الكبر", en: "Sahih Muslim — Whoever reaches his parents' old age", ur: "صحیح مسلم — جو والدین کی بڑھاپے کی عمر پائے" }
text: "حَدَّثَنَا زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا جَرِيرٌ، عَنْ سُهَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ رَغِمَ أَنْفُهُ ثُمَّ رَغِمَ أَنْفُهُ ثُمَّ رَغِمَ أَنْفُهُ ‏\"‏ ‏.‏ قِيلَ مَنْ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ مَنْ أَدْرَكَ وَالِدَيْهِ عِنْدَ الْكِبَرِ أَحَدَهُمَا أَوْ كِلَيْهِمَا ثُمَّ لَمْ يَدْخُلِ الْجَنَّةَ ‏\"‏ ‏.‏"
summary:
  ar: "لفظ آخر: من أدرك والديه عند الكبر أحدهما أو كليهما ثم لم يدخل الجنة."
  en: "Another wording: whoever reaches his parents in old age, one or both, and then does not enter Paradise."
  ur: "دوسرے الفاظ: جو اپنے والدین کی بڑھاپے کی عمر پائے، ایک یا دونوں، پھر جنت میں نہ داخل ہو۔"
