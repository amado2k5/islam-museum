label: { ar: "سنن أبي داود 2675 — الأب والأبوة", en: "Sunan Abi Dawud 2675 — the father and fatherhood", ur: "سنن ابی داؤد 2675 — باپ اور والدیت", es: "Sunan Abi Dawud 2675 — El padre y la paternidad" }
text: "… سَعْدٍ، - قَالَ غَيْرُ أَبِي صَالِحٍ عَنِ الْحَسَنِ بْنِ سَعْدٍ، - عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ، قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ فِي سَفَرٍ فَانْطَلَقَ لِحَاجَتِهِ فَرَأَيْنَا حُمَّرَةً مَعَهَا فَرْخَانِ فَأَخَذْنَا فَرْخَيْهَا فَجَاءَتِ الْحُمَّرَةُ فَجَعَلَتْ تَفْرُشُ فَجَاءَ النَّبِيُّ فَقَالَ \" مَنْ فَجَعَ هَذِهِ بِوَلَدِهَا رُدُّوا وَلَدَهَا إِلَيْهَا \". وَرَأَى قَرْيَةَ نَمْلٍ قَدْ حَرَّقْنَاهَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2675، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2675 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2675، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2675 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
