text: |-
  فصلل الراء)
  ⁦(رقب)⁩ ٥٧
  دهقنكذا سب رسب الشئ فى الماءرسوباسفل فيه ورسبت عيناه غارتا
  وسيغ رسوب أى ماض فى الضريية وبنوراسب حى من العرب ⁦( رضب)⁩ الرضاب الريق
  والراضب ضرب من السدر والراضب السح من المطر وقال يصف ضبعا فى مغارة
  فأدركها فيها قطاروراضب ( طب الرطب بالفتح خلاف اليابس تقول رطب
  الشرطوبة فهورطب ورطيب ورطبته أنا ترطيبا وغصن رطيب وريش رطيب آى فاء.
  والموطوب صاحب الرطوية والرطب بالضم ساكنة الطاء الكلا ومنه قول ذى الرقّة
  حتى اذا معمعان الصيف هب له * بأجسة نش عنها الماء والرطب
  وهومثل عسر وعسر والرطبة بالنتح القضب ١ خاصة مادام رطبا والجمع رطاب تقول
  منه وطبت الفرس رطبا ورطوبا عن أبي عبيد والرطب من التمر معروف الواحدة رطبة
  وجمع الرطب أرطاب ورطاب أيضا مثل ربع ورباع وجمع الرطبة رطبات ورطب وأرطب
  البسر صاررطبا وأرطب النخل صارما عليه رطبا ورطبت القوم ترطيبا اذا أطعمته-م
  الرطب وأرض مى طبة كثيرة الكلاً ⁦(رعب)⁩، الرعب الخوف تقول منه رعبته
  فهو مى حوب اذا أفزعته ولا تقل أرعبته والترعابة الفروق والسنام المرعب المقطع
  والرعيب الذى يقطر دسما والترعيبة بالكسر القطعة من السنام ورعبت الموض
  ملائته وسيل راعب يملا الوادى قال الشاعر
  بذى هيدب أيما الربى تحت ودقه • فيروى وأيما كل وادفيرعب ٢
  وستلم رعيب أى ممتسلى شحما والرعبوب الضعيف الجيان والرعبوبة من النساء الشطبة
  البيضاء والراعى جنس من الحمام والانى راعبية (رغب رغبت فى الشى اذا أردته
  رغبة ورغبا بالتحريك وارتغبت فيه مثله ورغبت عن الشى اذالم ترده وزهدت فيه
  وأرغبنى فى الشئ ورغبنى فيه بعى ورجل رغبوب من الرغبة والرغيبة العطاء الكثر
  والجمع الرغائب قال الشاعر وإلى الذى يعطى الرغائب فارغب والرغيب الواسع الجوف
  بقال حوض رغيب وسقاءرغيب وقرس رغيب الشحوة والرغب بالفم الشره يقال
  الرغب شؤم وقدرغب باضم رغبانهور غيب أبو عبيد الرغاب بالفتح الارض اللينة
  وقال ابن السكيت التى لا تسيل إلا من مطر كثير وقد رغبت رغبا( قب الرقيب الحافظ
  والرقيب المنتظرتة ول رقبت الشىء أرقبه رقوبا ورقبة ورقبانا يبالكسر فيه-مااذارصدته
  والرقيب الموكل بالضريب ورقيب النجم الذى يغيب بطلوعه مشل الثريار قيبها الا كليل
  اذا طلعت الترياعشاءغاب الاكليل واذاطلع الاكاسل عشاءغابت النريا ٣ و لرقيب
  الشالت من سهام الميسر والموقب والمرقبة الموضع المشرف يرتفع عليه الرقيب وراق
  اللّٰه فى أمره أى حافه والترقب الانتظار وكذلك الارتقاب وأرقبته دارا أو أرضا اذا
  أعطيته اياها فكانت للبساقى منكما وقلت ان مت قبلك فهى لك وان مت قبلى فهى لى والاسم
  منه الرقبى وهى من المراقبة لان كل واحدمنهما رقب موت صاحبه والرقبة مؤخر أصل
  العنق وابمع رقب ورقبات ورقاب ورجل أرقب بين الرقب أى غليظ الرقبة ورقبانى أيضا
  على غير قياس والعرب تلقب العجسم برقاب المزاودلانه-م حر وذوارقيبة لقب مألك
  ٢٥
  صحاح
  ١ و المسعى فى مصر بالبرسيم
  الجازى قاله نصر
  ٢ لسان العرب رعب فعل لازم
  ومتعتتقول رعب الوادى ذهو
  راعب اذا امتلاً بالمء ورعب
  السيل الوادى اذاملا همثل
  قولهم نقض الشئ وتقصتم فن
  رواه برعب بالفتح ذعناه ي لى ومن
  رواه فيرعب بالضم فعناه فيملا
  وقد روى بنصب كل على أن يكون
  مفعو لا مقد مليرعب أى أما كل
  وادفيرعب وفى روى ضعير
  السحاب أو المطر المعبرعنه بدى
  هدب اه مى تضى
  يقول نصرأ عالغة فى أماكمافى
  ياب اليم من القاموس
  أحقاعباد اللّه ان لست لاقيا
  بنينة أويلقى التريارقيبها
  واتغافيل للعيوق رقيب التريا
  تشيها برقيب الميسراه مى تضى
