text: |-
  ⁦(صنع)⁩
  ٩٠٥
  والاصقع من الخيل والطبم وغيرهءا الذى فى وسط رأسه بياض يقال عقاب صقعا والاسم
  الصقعة وموضعها من الرأس الصوقعة وه قعته أى ضربته على صوقعته قال الراجز
  والصقع من خابطة وجرز
  وصوقعة الثريد وقبته ومقع الديك أى صاح وبالسين
  أيضاوخطيب مصقع أى يليغ وصقعته الصاقعة لفة فى صعقته الصاعة والصقبع الذى
  يسقط من السماء بالليل شبيه بالثلج وقد صقعت الارض فهى مصقوعة ⁦(صلع)⁩ رجل
  أصلع بين الصلع وهوالذى انحسرشع رمدم رأسه وموضعه الصلعة بالتحريك وكذلك
  الصلعة بالضم وعرقطة صلعامدقعات رؤس أغمانها والصلعاء الداهية والصلعاء من
  الرمال ماليس فيه شجر والاصبلع من الحدات الدقيق العنق كان رأسه بنرقة والصلاع بالضم
  والتشديد اله ريض من الشهر الواحدة صلاعة وكذلك الصلع كأنه مقصور منه قال الاصعى
  الصلع لموضع الذى لا ينبت وأصله من صلح الرأس صلفع صلفع علاوته بالفاء والقساف
  جبعا أى ضرب عذقه والصلقعة أيضا الاعدام يقال صلفع الرجل اذا افلس بالفاء والقاف
  وكذلك السلقعة بالسين والقاف لع قال الاحرصلعت الشئ أى اقتلعته من أصله
  وقال الفراء صلع رأسه أى حلقه والصلعة الافلاس مثل الصافعة ⁦( مع)⁩ يقال هو
  أصمع القلب اذا كان متيقظاذ كيا والاسعمان التلب الدكى والرأى العازم والاصمع
  الصغير الاذن والاتى صمعاه وفى الحديث ان ابن عباس كان لايرى بأسابان يض هى بالصعمام
  والصمع! البهمى اذا ارتقعت قبل أن تتنقأ ويقال خرج السهم متصمعا اذا ايتات قذذه
  من الدم وغيره فاتضمت ومنه قول أبيد ذؤيب فخرور يشه متصمع ويقال الكلاب
  صمع الكعوب أى صغار الكعوب وأنا نا يثريدة مصمعة اذادفقت وحددرأسها وصومعة
  النصارى فوعلة من هذ الانهادقيقة الرأس ( نع لصنح بالضم مصدر قولك صنع اليه
  معروفا وصنع به صنيعاقبيها أى فعل والصناعسة حرفة الصانع وهله الصنعة وصنعة الفرص
  أيضاحسن القيام عليه تقول منه صنعت ذرسى صنعا وصنعة فهو ذرس صنيع قال الشاءر.
  فنقل اصنعه حق شتا • ناعم البال لجوجافى الستى
  وسيف صنبع أى مجلو قال الشاءر
  بابيض من أمية مضرى • كأن جبينه سيف صنيع
  وامر أقصفاع اليدير أى حاذقة ماهرة يعمل اليدين وامر أتان صناعات قال رؤّية
  أماترى ده واحنانى حفضا • أفار الصناهين العريس القعضا
  ونسوة صنع مال قذال وقذل ورجل صنيع اليدين وصنع اليدين أيضا بكسر ااصا. أى صانع
  حاذق وكذلك وحل صنع البدين بالتحريك قال أبوذويب
  وعليهم امسرودتات قضاهما * داودأ وصنع ل-وابغ تبع
  هذه رواية الاصمعى ويروى صسنع السوابع واصطفعت عندفلان صنيعة واصطنعت فلانا
  ١٥٢
  مهام
