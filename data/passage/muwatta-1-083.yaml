label: { ar: "الموطأ 83 — مالك: لا يمسح على الخفين إلا من لبسهما على طهر", en: "Muwatta 83", es: "Muwatta 83", fr: "Muwatta 83", ur: "موطا 83", tr: "El-Muvatta 83 — Malik: Kişi ancak çoraplarını temiz bir halde giyerse üzerlerini silebilir.", id: "Al-Muwatta 83 — Malik: Seseorang hanya boleh mengusap kaus kaki jika ia memakainya dalam keadaan suci." }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما جاء في المسح على الخفين: سُئل عن رجل توضأ ثم لبس خفيه ثم بال ثم نزعهما ثم ردهما، أيستأنف الوضوء؟ فقال: لينزع خفيه ثم ليتوضأ وليغسل رجليه؛ وإنما يمسح على الخفين من أدخل رجليه فيهما وهما طاهرتان بطهر الوضوء، فأما من لبسهما على غير طهر فلا يمسح عليهما. ويذكر المحقق أن معنى هذه الفتوى مروي عن عدد من التابعين عند ابن أبي شيبة وعبد الرزاق والبيهقي. {cite:muwatta-maruf-1997 p.78}"
  tr: "Malik'in, Yahya'nın çorap üzerine meshetme bölümünde rivayet ettiği bir fetva: Abdest alan, sonra çoraplarını giyen, sonra idrarını yapan, sonra çoraplarını çıkaran ve tekrar giyen bir adam hakkında kendisine soru soruldu. Tekrar abdest almalı mıdır? Malik şöyle cevap verdi: Çoraplarını çıkarmalı, sonra abdest almalı ve ayaklarını yıkamalıdır. Çorap üzerine meshetmek, ancak abdestin temizliğinden dolayı ayakları temizken çorap giyen kimse için caizdir. Temiz olmadan çorap giyen kimse ise çorap üzerine meshetmemelidir. Araştırmacı, bu fetvanın anlamının İbn Abi Şeybe, Abdülrazzak ve el-Beyhak gibi birçok Tabiin'den rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.78}"
  id: "Fatwa Malik, diriwayatkan oleh Yahya dalam surah tentang mengusap kaus kaki: Beliau ditanya tentang seorang laki-laki yang berwudhu, kemudian memakai kaus kakinya, kemudian buang air kecil, kemudian melepasnya, lalu memakainya kembali. Haruskah ia berwudhu lagi? Beliau menjawab: Ia harus melepas kaus kakinya, kemudian berwudhu dan mencuci kakinya. Mengusap kaus kaki hanya diperbolehkan bagi orang yang memakainya dalam keadaan bersih setelah berwudhu. Adapun orang yang memakainya dalam keadaan tidak suci, ia tidak boleh mengusapnya. Peneliti menyebutkan bahwa makna fatwa ini diriwayatkan dari sejumlah Tabi'in (Penerus) oleh Ibn Abi Shaybah, Abd al-Razzaq, dan al-Bayhaqi. {cite:muwatta-maruf-1997 p.78}"
