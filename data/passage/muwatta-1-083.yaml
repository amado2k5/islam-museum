label: { ar: "الموطأ 83 — مالك: لا يمسح على الخفين إلا من لبسهما على طهر", en: "Muwatta 83" }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما جاء في المسح على الخفين: سُئل عن رجل توضأ ثم لبس خفيه ثم بال ثم نزعهما ثم ردهما، أيستأنف الوضوء؟ فقال: لينزع خفيه ثم ليتوضأ وليغسل رجليه؛ وإنما يمسح على الخفين من أدخل رجليه فيهما وهما طاهرتان بطهر الوضوء، فأما من لبسهما على غير طهر فلا يمسح عليهما. ويذكر المحقق أن معنى هذه الفتوى مروي عن عدد من التابعين عند ابن أبي شيبة وعبد الرزاق والبيهقي. {cite:muwatta-maruf-1997 p.78}"
