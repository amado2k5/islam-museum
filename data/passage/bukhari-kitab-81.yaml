  ar: "صحيح البخاري، كتاب الرقاق"
  en: "Sahih al-Bukhari, Book 81: To make the Heart Tender (Ar-Riqaq)"
  ur: "صحیح بخاری، کتاب الرقاق"
  es: "Sahih al-Bukhari, Libro 81: Para ablandar el corazón (Ar-Riqaq)"
summary:
  ar: "القسم 81 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرقاق»، ويضم فيها النصوص من 6412 إلى 6593 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 81 of Sahih al-Bukhari (To make the Heart Tender (Ar-Riqaq)) in the division of the open hadith dataset the museum took its reports from: reports 6412 to 6593 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 81، عنوان «کتاب الرقاق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6412 تا 6593۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 81 de Sahih al-Bukhari (Para ablandar el corazón (Ar-Riqaq)) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6412 al 6593, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
