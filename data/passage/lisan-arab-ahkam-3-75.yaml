text: "… اللّه حُدودُه التى أمر بها ونهَى عنها وكذلك الفَراتُضُ بالميرانِ والقارِضُ والفَرضُّ الذى يَعرف الفرائضَ ويسهى العِلم بقسْمةِ المَوَارِيث فَراضٌ وفى الحديث أفْرَضُكم زيدوالفّرْضُ السَّنَفَرَضّ رسولُ اللّه أَى سَنّ وقيل فَرَضَ رسولُ اللّه اى أوْجّبَ وُجُو با لازماقال وهذا هو …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 3، ص 75، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 3, p. 75, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 3، ص 75 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Lisan al-'Arab de Ibn Manzur, volume numérisé 3, p. 75, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
