text: "… شيئا من دنانير مصر ! لمَا عرفتُ من زهدك فيه. ولكن منابرهم ايجُذوع. كان يقال : السِّبابُ مِزاح النَوك. وقال الشاعر وقال مِسْعُرُ بن كِدَام لا بنه كذا فى الأصل. وف مجمع الأمثال المدانى المزاح سباب النّوكى. الجزء الثالث لقد …"
