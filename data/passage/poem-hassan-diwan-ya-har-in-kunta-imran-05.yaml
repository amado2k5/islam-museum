  tr: "Al-Harith bin Hisham'ın hiciv şiirinden, Al-Barquqi'nin Hasan'ın Divanı üzerine yaptığı tefsirde bulunan \"Ey Harith, eğer bir erkeksen\" şiirinden bir dize {{cite:sharh-diwan-hassan-barquqi-1929 s.60}}."
  id: "Sebuah bait dari puisi “Wahai Harith, jika engkau seorang laki-laki” dalam satire Al-Harith bin Hisham, sebagaimana terdapat dalam komentar Al-Barquqi atas Diwan Hassan {{cite:sharh-diwan-hassan-barquqi-1929 p.60}}."
translations:
