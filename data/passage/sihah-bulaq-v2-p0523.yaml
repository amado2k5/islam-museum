text: |-
  ٦٤
  •⁦(باب الذاء )⁩ .
  ناج طواه الاين مماوجفا * ⁦( وحف)⁩ عشب وحف وواحف أى كثير والوحف
  الجفاح الكثير الريش وشعر وحف أى كثير حسن ووحف أيضا بالتحريك وقد وحف
  شعره بالضم والاسم الوحوفسة والوحافة والوحفاء الارض فيهاحجارة سود وليست بحرّة
  والصضرة السوداء وحفة واله-ع وحاف ووحاف القهر موضع وهوفى شعر لبيد ووحف
  الرجل اذاضرب بنفسه الارض وكذلك البعير ووحف توحيفامشله ومواحف الابل
  بساركها والموحف البعير المهزول قال الراجزه لمارآيت الشارف الموحفا* وقال آبو عمرو
  التوحيف الضرب بالعصا وواحف وضع ⁦( وخف)⁩ وخفت الخطمىّ وأوخفته
  أى ضريته حتى تلزج والوخيفة ما أو خفته من الخطعىّ يقال للاحق انه لموخف أى يوخف
  زبله كما يوخف الخطعى ويقال له الهجان أيضا وهو من كاياتهم دف ودف الاناء
  أى قطر واستودفت الشحمة أى استقطرتها فودفت والودفة والوديفة الروضة انخضراء
  من تبت بقال أصبحت الارض ودفة واحدة إذا اخضرت كلها وأخصبت قال أبو صاعد
  يقال وديفة من بق-ل ومن عشب وضفيغة من بقل ومن عشب اذ أ كانت الروضة ناضرة
  متخيلة يقال حلوافى وديقة منكرة وفى غذيمة منكرة ⁦(وذف)⁩ يقال.ريتوذف بذال
  معجة اذامر يقارب الخطو ويحرّك منكبيه وفى الحديت خرج الحجاج يتوذف فى سبتين له حتى
  دخل على أسماه بنت أبى بكر وقال أبو عمر والتوذف التيختر وكان أبو عبيدة يقول التوذف
  الامراع لقول بشر
  يعطى النجائب بالرحال كأنها • بقر الصرائم والجياد توذف
  أى ويعطى الجياد ⁦( ورف )⁩ ظلّ وارف أى واسع عن الفراء وقدورف يرف ورقا
  ووريفا أى اتسع وورف النبت أى اهتزفهو وارف أى ناضررفاف شديد الخضرة
  ( وزف وزف أى أسرع وقرى فأقبلوا اليه يرفون مخففة والوزيف سرعة السيرمثل
  الزفيف (وسف التوسف التقشرقال ابر الكيت بقال للقرح والجدرى اذا
  بس وتقرف وللحرب أيضافى الابل اذاقفل قد توسف جلده وتقشقش جلده وتقشر جلده كاء
  بمعنى⁦( وصف)⁩ وصفت الشئ وصفا وصفة والهاءعوض من الواو وتواصفوا الشئ
  من الوصف واتصف الشئ أى صارمتواصفا قال طرقة بن العبد
  انى كفانى من أمرهممت به * جار كجار الحذاقىّ الذى انصفا
  أى صارموصوفايحسن الجوار وقول الشماخ يصف بعيرا
  اذا ما أدجت رصفت يداها * لها الادلاج ليلة لاهجوع
  يريدأجادت السير وبيع المواصفة أن تبيع الشي بصفة م غير رؤية والوصف الخادم غلاما
  كان أوجارية يقال وصف الغلام اذا باغ حد انلخدمة فهو وصيف بين الوصافة والجمع وصفاء
  وقال ثعلب وربما قالو اللجارية وصيفة بينة الوصافة والايصاف والجمع الوصائف واستوصفت
  الطبيب إدانى اداسألته أن يصف لال ما تتعالج به والصفة كالعلم والسواد وأمّا النحويون
  فليس يريدون بالصفة هذا لان الصفة عندهم هى النعت والنعت هواسم الفاعل نحو ضارب
  أو المفعول نحو مضروب أو ما يرجع اليهما من طريق المعى نحو مثل وشبه وما يجرى مجرى
