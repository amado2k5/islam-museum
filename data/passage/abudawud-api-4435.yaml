label: { ar: "سنن أبي داود 4435 — الأب والأبوة", en: "Sunan Abi Dawud 4435 — the father and fatherhood", ur: "سنن ابی داؤد 4435 — باپ اور والدیت" }
text: "… فِيمَنْ ثَارَ فَانْتَهَيْتُ إِلَى النَّبِيِّ وَهُوَ يَقُولُ \" مَنْ أَبُو هَذَا مَعَكِ \". فَسَكَتَتْ فَقَالَ شَابٌّ حَذْوَهَا أَنَا أَبُوهُ يَا رَسُولَ اللَّهِ. فَأَقْبَلَ عَلَيْهَا فَقَالَ \" مَنْ أَبُو هَذَا مَعَكِ \". قَالَ الْفَتَى أَنَا أَبُوهُ يَا رَسُولَ اللَّهِ. فَنَظَرَ رَسُولُ اللَّهِ إِلَى بَعْضِ مَنْ حَوْلَهُ يَسْأَلُهُمْ عَنْهُ فَقَالُوا مَا عَلِمْنَا إِلاَّ خَيْرًا. فَقَالَ لَهُ النَّبِيُّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4435، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4435 (Prescribed Punishments (Kitab Al-Hudud)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4435، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
