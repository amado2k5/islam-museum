label: { ar: "سنن ابن ماجه 1168 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Ibn Majah 1168 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابن ماجہ 1168 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Ibn Majah 1168 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Ibn Majah 1168 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ رُمْحٍ الْمِصْرِيُّ، أَنْبَأَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ عَبْدِ اللَّهِ بْنِ رَاشِدٍ الزَّوْفِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي مُرَّةَ الزَّوْفِيِّ، عَنْ خَارِجَةَ بْنِ حُذَافَةَ الْعَدَوِيِّ، قَالَ خَرَجَ عَلَيْنَا النَّبِيُّ ـ فَقَالَ \" إِنَّ اللَّهَ قَدْ أَمَدَّكُمْ بِصَلاَةٍ، لَهِيَ خَيْرٌ لَكُمْ مِنْ حُمُرِ النَّعَمِ. الْوِتْرُ، جَعَلَهُ اللَّهُ لَكُمْ فِيمَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1168، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1168 (Establishing the Prayer and the Sunnah Regarding Them), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1168، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1168 (Establecimiento de la oración y la Sunnah al respecto), con menciones a naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Ibn Majah, n° 1168 (Établissement de la prière et de la Sunna les concernant), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, religions, sectes et peuples non musulmans."
