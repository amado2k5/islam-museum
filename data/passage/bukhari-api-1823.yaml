text: "… ـ يَعْنِي وَقَعَ سَوْطُهُ ـ فَقَالُوا لاَ نُعِينُكَ عَلَيْهِ بِشَىْءٍ، إِنَّا مُحْرِمُونَ. فَتَنَاوَلْتُهُ فَأَخَذْتُهُ، ثُمَّ أَتَيْتُ الْحِمَارَ مِنْ وَرَاءِ أَكَمَةٍ، فَعَقَرْتُهُ، فَأَتَيْتُ بِهِ أَصْحَابِي، فَقَالَ بَعْضُهُمْ كُلُوا. وَقَالَ بَعْضُهُمْ لاَ تَأْكُلُوا. فَأَتَيْتُ النَّبِيَّ وَهُوَ أَمَامَنَا، فَسَأَلْتُهُ فَقَالَ \" كُلُوهُ حَلاَلٌ \". قَالَ لَنَا عَمْرٌو اذْهَبُوا إِلَى صَالِحٍ فَسَلُوهُ عَنْ هَذَا وَغَيْرِهِ، وَقَدِمَ عَلَيْنَا هَا هُنَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 1823، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1823 (Penalty of Hunting while on Pilgrimage), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1823، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
