text: "إلى قوله: {وهم يخلقون} قال مجاهد: كان لا يعيش لآدم وامرأة ولد، فقال لهما الشيطان: إذا ولد لكما ولد، فسمياه عبد الحارث، وكان اسم الشيطان قبل ذلك: الحارث، ففعلا، فذلك قوله: {فلما آتاهما صالحا جعلا له شركاء} الآية."
