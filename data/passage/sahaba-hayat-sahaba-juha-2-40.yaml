text: "… '، ولا غليظ، ولاسخابْ، ولا لخاش، ولا عياب، ولا مزاح، يتغافل عما لا يشتهى، ولا يوتس منه راجيه، ولا يخيب فيه قدترك، و ترك الناس من ثلاثث: كان لا يذم احداً و لا يعيره، ولا يطلب عورته، ولا يتكلم إلا …"
