text: |-
  ٠٢٢٨
  •⁦(قبل)⁩•
  ابن فهال غير مصروف من أسماء البال مثل ثهال يل) الفيل معروف والجسع أفيال
  وفيول وفيلة قال ابن السكيت ولا تقل أفيلة وصاحبه فيال قال سيبويه يجوز أن يكون
  أصل فيل فعل فسكسرص أجل الياكما فالوا أبيض وييض وقال الاخفش هذالا يكون فى
  الواحدانما يكون فى الجمع ورجل فيل الرأى أى ضعيف الرأى وقال
  ى رب الجوادفلاتفلوا • فانتم فنعذركم لفيل
  والجمع آفيال ورجل قال أى ضعيف الرأى مخطى الفراسة وقال
  رأيتك يا أخيطل اذجرينا * وجربت الفراسة كنت فالا
  وقد فال الرأى يفيل فيولة وفيل رأيه تفييلا أى ضعفه فهوفيل الرأى أبو عبيد الفائل
  اللحم الذى على خرية الورك قال وكان بعضهم يجعل الفامل عرقافى الفخذ قال الراجز
  كاغما يجع عرفا أيضه • وملتق فائله وأبضه
  وهماعرقان فى الفغذ وقال الاصمحى فى كتاب الفرس وفى الورل الخسرية وهى نقرة فيها لحم
  لاعظم فيهاو فى تلك النقرة الفائل قال وليس بين تلك النقرة وبين الجوف عظم انماه وجلد
  ولحم وأنتد للاعشى
  قد نخضب العيرفى مكنون قائله • وقد يشيط على أرما حنا البطل
  قال ومكنون اافائل دمه يقول نحن بصراء بموضع الطعن وقول امرى القيس
  سليم النظى عبل الشوى شتج النسا • ه حجبات مشرقات على الغال
  أراد على الفائل فقلبه والفول الباقلا
  صل القاف) بل بل نقيض بعد والقبل والق بل نقيض الدبر والدبرووقع
  السهم بقبل الهدف وبديره وقتقيصه من قبل ومن دبر بالتشقيل أك من مقدمه ومن مؤخره
  ويقال انزل بقبل هذا الجبل أى بسفسه وكان ذلا فى قبل الشتاء وفى قبل الصيف أى فى أوّه
  وقولهم اذن أقبل قبلك أى أقصدقصدلك وأتوجه فحول والقبلة من التقبيل معروفة والقبلة
  التى يصلى فحوها ويقال أيضا ماله قبلة ولا دبرة اذالم يهتدلحهة أمره وما لكلامه قبلة أى جهة
  ومن أين قبلتك أى من أين جهتك ويقال فلات حلس قي الته يالضم أى تجاهه وهواسم يكون
  ظرفا وقبال النعل بالمكسر الزمام الذى يكون بين الاصبح الوسطى والتى قليها يقال قايات
  النعل وأقبلتها اذا جعات اهاقبالين وأخذت الامريقوايه أى بأواأله وحد ثانه والقابلة
  الليسلة المقبلة وقد قبسل وأقبل بمعنى يقال عام قابل أى مقبل وقيح اللّٰه منه ما قبل ومادبر
  وبعض-م لا يقول منه فعل وتقبلت الشى وقبلته قبولا بفتح القاف وهو مصدرشاذ وحكى
  اليزيدى عن أبى عمرو بن العلاء القبول بالفتح مصدرولم أسمع غيره ويقال على فلان قبول اذا
  نبلته النفس والقبول أيضا الصباوهى ريح تقابل الدبور وقال • فان الريح طيبة قبسول *
  وقد قبلت الريح بالفتح تقبل قبولا بالضم والاسم من هذا مفتوح والمصدر مضموم والقبل
  بالمحر يك نشز من الارض يستقبلك يقال رأيت بذلك القبل شخصا قال الجعدى
  انماذ كرى كاربقبل • والقبل أيضا فجج وهوأن يتدانى صدر القدمين ويتباعد عقباهما
  ويقال أيضارأ ينا الهلال قبلا اذ الم ي كن روى قبل ذلك والقبل فى المين اقبال المسواد
