label: { ar: "الموطأ 2367 — مالك: العبد المدبر بين شريكين إذا دبر أحدهما حصته", en: "Muwatta 2367", es: "Muwatta 2367", fr: "Muwatta 2367", ur: "موطا 2367", tr: "El-Muvatta 2367 — Malik: İki ortak arasında, ortaklardan birinin kendi payını serbest bırakması halinde efendi tarafından azat edilecek köle (mudabbar).", id: "Al-Muwatta 2367 — Malik: Seorang budak yang akan dibebaskan oleh tuannya (mudabbar) di antara dua mitra, jika salah satu dari mereka membebaskan bagiannya." }
summary:
  ar: "قال مالك في العبد يكون بين رجلين فيدبر أحدهما حصته: إنهما يتقاومانه؛ فإن اشتراه الذي دبره كان مدبرا كله، وإن لم يشتره انتقض تدبيره، إلا أن يشاء الذي بقي له فيه الرق أن يعطيه شريكه الذي دبره بقيمته، فإن أعطاه إياه بقيمته لزمه ذلك، وكان مدبرا كله. {cite:muwatta-maruf-1997 p.375}"
  tr: "Malik, iki adamın ortak mülkiyetinde olan bir köle hakkında, bunlardan birinin kendi payını azat için sunması durumunda, köleyi eşit olarak paylaşmaları gerektiğini söylemiştir. Eğer azat eden kişi köleyi satın alırsa, kölenin tamamı azat edilmiş sayılır. Eğer satın almazsa, azat geçersiz olur; ancak kölenin sahibi olan kişi, azat eden ortağına köleyi bedeli karşılığında vermek isterse, bu durum değişir. Eğer bedelini verirse, bunu yapmakla yükümlüdür ve kölenin tamamı azat edilmiş sayılır. {cite:muwatta-maruf-1997 s.375}"
  id: "Malik berkata mengenai seorang budak yang dimiliki bersama oleh dua orang, di mana salah satu dari mereka menawarkan bagiannya untuk dibebaskan: mereka harus membagi budak itu secara merata. Jika orang yang membebaskan itu membelinya, seluruh budak dianggap telah dibebaskan. Jika dia tidak membelinya, pembebasan itu batal, kecuali jika orang yang masih memiliki budak itu ingin memberikannya kepada rekannya yang membebaskan itu dengan nilai yang setara. Jika dia memberikan nilai yang setara, dia wajib melakukannya, dan seluruh budak dianggap telah dibebaskan. {cite:muwatta-maruf-1997 p.375}"
