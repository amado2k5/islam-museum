label: { ar: "الموطأ 640 — بلاغ عن عائشة: ما من نبي يموت حتى يخير؛ فسمعته يقول: اللهم الرفيق الأعلى، فعرفت أنه ذاهب", en: "Muwatta 640" }
text: "ما من نبي يموت حتى يخير"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عائشة قالت: قال النبي: ما من نبي يموت حتى يُخير. قالت: فسمعته يقول: اللهم الرفيق الأعلى، فعرفت أنه ذاهب. ويذكر المحقق أن قوله «زوج النبي» ليس في النسخ، وأنه رواه عن مالك أبو مصعب وسويد، وأن هذا البلاغ موصول من حديث عروة عن عائشة في الصحيحين (البخاري 6/12 و58، ومسلم 7/137)، ويحيل على تعليقه على ابن ماجة (1620) والتمهيد (24/268). {cite:muwatta-maruf-1997 p.327}"
