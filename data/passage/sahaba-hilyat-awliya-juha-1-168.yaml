text: "… رأس الأمر كله قلت يا رصول اللّٰه زدنى. قال : عليك بتلاوه القرآن فإنه نور لك فى الأرض، وذكر لك فى السماء قلت يا رسول اقّه زدلى. قال إياك وكثرة الضحك فإنه يميت القلب، ويذهب بنور الوجه قلت يا رسول …"
