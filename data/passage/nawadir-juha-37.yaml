text: "… الحمل بين البنات والبقر ذهب يوماً إلى السوق، يريد بيع بقرة له، فلم يتقدَّمْ لِشرائها أحدّ، فرآه أحد أصحابه وسأله: ألم تَبِغ إلى الآن بقرتَك؟ قال: لا، لأنّي ما زلت أسحبها من الصباح إلى الآنَ، وقد وصفتها بأجمل الصفات، فلم …"
summary:
  ar: "لم يستطع جحا بيع بقرته، فطلب من صديق أن يأخذها ويزعم أنها حامل في شهرها السادس، فدفع مشترٍ فيها أكثر مما طلبه جحا. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  en: "Juha cannot sell his cow, so he asks a friend to take it and claim that it is pregnant in its sixth month; a buyer pays more than Juha had asked. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  ur: "جحا اپنی گائے نہ بیچ سکا، تو اس نے ایک دوست سے کہا کہ اسے لے جائے اور دعویٰ کرے کہ یہ چھ ماہ کی حاملہ ہے؛ ایک خریدار نے جحا کی مانگی ہوئی قیمت سے زیادہ دے دی۔ {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  fr: "Juha n'arrive pas à vendre sa vache ; il demande à un ami de l'emmener et de prétendre qu'elle est pleine de six mois ; un acheteur la paie plus cher que ce que Juha demandait. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  es: "Juha no logra vender su vaca, así que le pide a un amigo que se la lleve y diga que está preñada de seis meses; un comprador paga más de lo que Juha pedía. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  tr: "Juha ineğini satamadığı için bir arkadaşından ineği almasını ve altı aylık hamile olduğunu söylemesini istedi. Bunun üzerine bir alıcı, Juha'nın istediğinden daha fazla para ödedi. {cite:juha-nawadir-kubra-djuwaydi s. 22}"
  id: "Juha tidak bisa menjual sapinya, jadi dia meminta seorang teman untuk mengambilnya dan mengaku sapi itu sedang hamil enam bulan. Kemudian, seorang pembeli membayar lebih mahal daripada yang diminta Juha. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
