text: "… وَالتَّمْرِ وَنَحْوِهِمَا مِنَ الأَطْعِمَةِ الَّتِي تُبَاعُ جِزَافًا وَمِثْلُهَا يُكَالُ فَلَيْسَ بِابْتِيَاعِ ذَلِكَ جِزَافًا بَأْسٌ. قَالَ مَالِكٌ مَنِ اشْتَرَى مُصْحَفًا أَوْ سَيْفًا أَوْ خَاتَمًا وَفِي شَىْءٍ مِنْ ذَلِكَ ذَهَبٌ أَوْ فِضَّةٌ بِدَنَانِيرَ أَوْ دَرَاهِمَ فَإِنَّ مَا اشْتُرِيَ مِنْ ذَلِكَ وَفِيهِ الذَّهَبُ بِدَنَانِيرَ فَإِنَّهُ يُنْظَرُ إِلَى قِيمَتِهِ فَإِنْ كَانَتْ قِيمَةُ ذَلِكَ الثُّلُثَيْنِ وَقِيمَةُ مَا فِيهِ مِنَ الذَّهَبِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1326، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Muwatta Malik, no. 1326 (Business Transactions), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "موطأ مالک کی حدیث نمبر 1326، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
