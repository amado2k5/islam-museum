label: { ar: "الموطأ 1318 — مالك: البراذين والهجن من الخيل، وسعيد بن المسيب سئل هل فيها صدقة فقال وهل في الخيل من صدقة", en: "Muwatta 1318" }
summary:
  ar: "يقول مالك إنه لا يرى البراذين والهجن إلا من الخيل، ويستدل بآيتين في سورتي النحل والأنفال عن الخيل والبغال والحمير، ويرى البراذين والهجن من الخيل إذا أجازها الوالي. وقد سئل سعيد بن المسيب عن البراذين، هل فيها صدقة؟ فقال وهل في الخيل من صدقة؟ {cite:muwatta-maruf-1997 p.588}"
