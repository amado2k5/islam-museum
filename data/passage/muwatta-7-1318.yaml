label: { ar: "الموطأ 1318 — مالك: البراذين والهجن من الخيل، وسعيد بن المسيب سئل هل فيها صدقة فقال وهل في الخيل من صدقة", en: "Muwatta 1318", es: "Muwatta 1318", fr: "Muwatta 1318", ur: "موطا 1318", tr: "El-Muvatta 1318 — Malik: Katır ve develer attır ve Said bin el-Musayyab'a bunların zekâtı olup olmadığı soruldu, o da, \"Atların zekâtı var mı?\" dedi.", id: "Al-Muwatta 1318 — Malik: Keledai dan unta adalah kuda, dan Saeed bin Al-Musayyab ditanya apakah ada zakat atas mereka, dan dia berkata, \"Apakah ada zakat atas kuda?\"" }
summary:
  ar: "يقول مالك إنه لا يرى البراذين والهجن إلا من الخيل، ويستدل بآيتين في سورتي النحل والأنفال عن الخيل والبغال والحمير، ويرى البراذين والهجن من الخيل إذا أجازها الوالي. وقد سئل سعيد بن المسيب عن البراذين، هل فيها صدقة؟ فقال وهل في الخيل من صدقة؟ {cite:muwatta-maruf-1997 p.588}"
  tr: "Malik, katır ve eşeklerle ilgili Nahl Suresi ve Enfal Suresi'ndeki iki ayete atıfta bulunarak, yalnızca katır ve develeri at olarak kabul ettiğini söyler. Hükümdar izin verirse katır ve develeri at olarak değerlendirir. Sa'id ibn Al-Musayyab'a katırlar hakkında \"Onlardan zekât alınır mı?\" diye soruldu. O da \"Atlardan zekât alınır mı?\" diye cevap verdi. {cite:muwatta-maruf-1997 s.588}"
  id: "Malik mengatakan bahwa ia hanya menganggap bagal dan unta sebagai kuda, dengan mengutip dua ayat dalam Surah An-Nahl dan Surah Al-Anfal yang berkaitan dengan kuda, bagal, dan keledai. Ia menganggap bagal dan unta sebagai kuda jika penguasa mengizinkannya. Sa'id ibn Al-Musayyab ditanya tentang bagal: \"Apakah ada zakat yang wajib dikenakan pada bagal?\" Ia menjawab, \"Apakah ada zakat yang wajib dikenakan pada kuda?\" {cite:muwatta-maruf-1997 p.588}"
