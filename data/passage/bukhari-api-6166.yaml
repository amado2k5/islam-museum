text: "… الْوَهَّابِ، حَدَّثَنَا خَالِدُ بْنُ الْحَارِثِ، حَدَّثَنَا شُعْبَةُ، عَنْ وَاقِدِ بْنِ مُحَمَّدِ بْنِ زَيْدٍ، سَمِعْتُ أَبِي، عَنِ ابْنِ عُمَرَما ـ عَنِ النَّبِيِّ قَالَ \" وَيْلَكُمْ ـ أَوْ وَيْحَكُمْ قَالَ شُعْبَةُ شَكَّ هُوَ ـ لاَ تَرْجِعُوا بَعْدِي كُفَّارًا، يَضْرِبُ بَعْضُكُمْ رِقَابَ بَعْضٍ \". وَقَالَ النَّضْرُ عَنْ شُعْبَةَ وَيْحَكُمْ. وَقَالَ عُمَرُ بْنُ مُحَمَّدٍ عَنْ أَبِيهِ وَيْلَكُمْ أَوْ وَيْحَكُمْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6166، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6166 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6166، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
