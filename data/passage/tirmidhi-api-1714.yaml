label: { ar: "جامع الترمذي 1714 — الأب والأبوة", en: "Jami' al-Tirmidhi 1714 — the father and fatherhood", ur: "جامع ترمذی 1714 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1714 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1714 — le père et la paternité", tr: "Cami' el-Tirmizi 1714 — Baba ve Babalık", id: "Jami' al-Tirmidhi 1714 — Sang Ayah dan Peran Ayah" }
text: "… يَوْمُ بَدْرٍ وَجِيءَ بِالأُسَارَى قَالَ رَسُولُ اللَّهِ \" مَا تَقُولُونَ فِي هَؤُلاَءِ الأُسَارَى \". فَذَكَرَ قِصَّةً فِي هَذَا الْحَدِيثِ طَوِيلَةً. قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ عُمَرَ وَأَبِي أَيُّوبَ وَأَنَسٍ وَأَبِي هُرَيْرَةَ. وَهَذَا حَدِيثٌ حَسَنٌ وَأَبُو عُبَيْدَةَ لَمْ يَسْمَعْ مِنْ أَبِيهِ. وَيُرْوَى عَنْ أَبِي هُرَيْرَةَ قَالَ مَا رَأَيْتُ أَحَدًا أَكْثَرَ مَشُورَةً لأَصْحَابِهِ مِنْ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1714، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1714 (The Book on Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1714، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1714 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1714 (Le Livre du Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Cami' el-Tirmizi'nin 1714 numaralı hadisinde baba ve babalık kavramından bahsedilir. Araştırmacı, İslam'da babalık konusundaki bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1714, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
