label: { ar: "مسلم 1742 — لا تتمنوا لقاء العدو والجنة تحت ظلال السيوف", en: "Muslim 1742 — Do not wish to meet the enemy; Paradise is under swords' shadows", es: "Musulmán 1742 — No deseéis encontraros con el enemigo; el Paraíso está bajo la sombra de las espadas.", fr: "Muslim 1742 — Ne souhaitez pas rencontrer l'ennemi; le Paradis est sous l'ombre des épées.", ur: "مسلم 1742 - دشمن سے ملنے کی تمنا نہ کرو۔ جنت تلواروں کے سائے تلے ہے۔", tr: "Müslim 1742 — Düşmanla karşılaşmayı ve kılıç gölgesinde cennete girmeyi arzu etmeyin.", id: "Muslim 1742 — Jangan berharap bertemu musuh dan masuk surga di bawah naungan pedang" }
text: "قام رسول الله حين مالت الشمس فقال: يا أيها الناس لا تتمنوا لقاء العدو وسلوا الله العافية، فإذا لقيتموهم فاصبروا واعلموا أن الجنة تحت ظلال السيوف، ثم قال: اللهم منزل الكتاب ومجري السحاب وهازم الأحزاب اهزمهم وانصرنا عليهم"
summary:
  ar: "رواية عبد الله بن أبي أوفى كتب بها إلى عمر بن عبيد الله حين سار إلى الحرورية، في باب كراهة تمني لقاء العدو والأمر بالصبر من كتاب الجهاد والسير في صحيح مسلم."
  tr: "Abdullah bin Abi Awfa'nın, Haricilere karşı yürüyüşü sırasında Ömer bin Ubaidullah'a yazdığı mektuptan rivayet edildiği üzere, Sahih Muslim'deki Cihad ve Seferler kitabında, düşmanla karşılaşma arzusunun hoşnutsuzluk ve sabırlı olma emri bölümünde yer almaktadır."
  id: "Diriwayatkan oleh Abdullah bin Abi Awfa, yang menulis surat kepada Umar bin Ubaidullah ketika beliau berbaris menuju kaum Kharijites, dalam bab tentang ketidaksukaan untuk bertemu musuh dan perintah untuk bersabar, dari kitab Jihad dan Ekspedisi dalam Sahih Muslim."
