label: { ar: "مسلم 1742 — لا تتمنوا لقاء العدو والجنة تحت ظلال السيوف", en: "Muslim 1742 — Do not wish to meet the enemy; Paradise is under swords' shadows" }
text: "قام رسول الله حين مالت الشمس فقال: يا أيها الناس لا تتمنوا لقاء العدو وسلوا الله العافية، فإذا لقيتموهم فاصبروا واعلموا أن الجنة تحت ظلال السيوف، ثم قال: اللهم منزل الكتاب ومجري السحاب وهازم الأحزاب اهزمهم وانصرنا عليهم"
summary:
  ar: "رواية عبد الله بن أبي أوفى كتب بها إلى عمر بن عبيد الله حين سار إلى الحرورية، في باب كراهة تمني لقاء العدو والأمر بالصبر من كتاب الجهاد والسير في صحيح مسلم."
