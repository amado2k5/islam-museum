text: "… : فحدّثني محمد بن حرب، نا الزُّبَيْدِيّ، حدّثني الزُّهْريّ، عن أنس أنّه سمع خُطبة عمر الآخرة قال: حين جلس أبو بكر على منْبَر رسول اللّه وَلِ غداً من مُتَوَفَّى رسول اللّه للهِ فتشهّد عمر، ثمّ قال : أمّا بعد، فإنّي …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 12، يذكر ساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 12, that mentions a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 12 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 6, pág. 12, que menciona un lecho de muerte y las últimas horas, una reliquia conservada tras su dueño; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 6, page 12, mentionnant un lit de mort et les dernières heures d'un défunt, ainsi qu'une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "El-Dhahabi'nin *İslam Tarihi* adlı eserinin 6. cildinin 12. sayfasından alınan bu alıntı, ölüm anını ve vefatın etkilerini ele almaktadır ve korunmuş kutsal emanetlerden biridir; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 6, halaman 12, menyebutkan saat kematian dan akibat dari meninggalnya seseorang, dan merupakan salah satu peninggalan yang terpelihara; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, peninggalan, dan makam suci."
