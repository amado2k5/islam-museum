text: "… لا يحفظها ؛ لكثرتها، فوصَّاه النَّبيُّ وَلِهِ أَنْ لا يغضب، ثم ردَّد هذه المسألة عليه مراراً، والنَّبيُّ وَلِفِ يردِّدُ عليه هذا الجوابَ، فهذا يدلُّ على أنَّ الغضب جماعُ الشرِّ، وأنَّ التحرُّز منه جماعُ الخير. ولعلَّ هذا الرجلَ الذي سأل النَّبيَّ …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 344، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 344, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 344 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
