text: "… لا يحفظها ؛ لكثرتها، فوصَّاه النَّبيُّ وَلِهِ أَنْ لا يغضب، ثم ردَّد هذه المسألة عليه مراراً، والنَّبيُّ وَلِفِ يردِّدُ عليه هذا الجوابَ، فهذا يدلُّ على أنَّ الغضب جماعُ الشرِّ، وأنَّ التحرُّز منه جماعُ الخير. ولعلَّ هذا الرجلَ الذي سأل النَّبيَّ …"
