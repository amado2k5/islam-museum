text: "… لذة وجود المفقود أضاع حماره يوماً، فأخذ ينادي في السوق: مَن وجدَهُ، فإني أعطيه إيَّاهُ مع بردعتِهِ ومقوده. فقالوا له: ما الفائدةُ من وجودِهِ، إذا كنت تريد أن تعطيه بطقمِه؟ فأجابهم: إنكم لا تعرفون لذَّةَ وجود المفقود. إذا لم أجدْهُ …"
summary:
  ar: "نادى جحا في السوق بأنه سيكافئ من يجد حماره بالسرج واللجام؛ فسُئل ما فائدة العثور عليه، فقال إن الناس لا يعرفون لذة العثور على المفقود. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  en: "Juha calls out in the market that he will reward whoever finds his donkey with the saddle and halter; asked the use of finding it, he says people do not know the joy of finding what was lost. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  ur: "جحا نے بازار میں پکار کر کہا کہ جو میرا گدھا ڈھونڈ لائے گا اسے زین اور لگام انعام میں دوں گا؛ پوچھا گیا کہ اسے ڈھونڈنے کا کیا فائدہ، تو اس نے کہا کہ لوگ گمشدہ چیز ملنے کی خوشی نہیں جانتے۔ {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  fr: "Juha crie dans le marché qu'il récompensera celui qui retrouvera son âne avec la selle et le licou; quand on lui demande à quoi bon le retrouver, il dit que les gens ne connaissent pas la joie de retrouver ce qui était perdu. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  es: "Juha pregona en el mercado que recompensará con la silla y el cabestro a quien encuentre su burro; cuando le preguntan para qué sirve encontrarlo, dice que la gente no conoce la alegría de hallar lo perdido. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  tr: "Juha, çarşıda eşeğini bulan kişiye eyer ve dizgin vereceğini duyurdu. Eşeği bulmanın ne anlamı olduğu sorulduğunda ise, insanların kayıp bir şeyi bulmanın sevincini bilmediğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 62}"
  id: "Juha berteriak di pasar bahwa ia akan memberi hadiah kepada siapa pun yang menemukan keledainya berupa pelana dan kekang. Ketika ditanya apa gunanya menemukannya, ia menjawab bahwa orang-orang tidak tahu betapa bahagianya menemukan sesuatu yang hilang. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
