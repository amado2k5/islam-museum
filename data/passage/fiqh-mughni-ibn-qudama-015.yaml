text: "وقال سعيد: حدثنا سفيان، عن معمر، عن ابن طاوس، عن أبيه، قال في كتاب معاذ بن جبل: من أخرج من مخلاف إلى مخلاف، فإن صدتته وعشره ترد إلى بخلافه. وروي عن عمر بن عبد العزيز أنه رد زكاة أتي بها"
