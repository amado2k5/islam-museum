label: { ar: "سنن أبي داود 1766 — النسب والانتساب", en: "Sunan Abi Dawud 1766 — paternity and lineage", ur: "سنن ابی داؤد 1766 — نسب اور انتساب", es: "Sunan Abi Dawud 1766 - paternidad y linaje", fr: "Sunan Abi Dawud 1766 — paternité et lignée", tr: "Sünen Ebi Davud 1766 — Nesil ve Bağlılık", id: "Sunan Abi Dawud 1766 — Silsilah dan Afiliasi" }
text: "… عَنْ عَبْدِ اللَّهِ بْنِ الْحَارِثِ الأَزْدِيِّ، قَالَ سَمِعْتُ غَرَفَةَ بْنَ الْحَارِثِ الْكِنْدِيَّ، قَالَ شَهِدْتُ رَسُولَ اللَّهِ فِي حَجَّةِ الْوَدَاعِ وَأُتِيَ بِالْبُدْنِ فَقَالَ \" ادْعُوا لِي أَبَا حَسَنٍ \". فَدُعِيَ لَهُ عَلِيٌّ - - فَقَالَ لَهُ \" خُذْ بِأَسْفَلِ الْحَرْبَةِ \". وَأَخَذَ رَسُولُ اللَّهِ بِأَعْلاَهَا ثُمَّ طَعَنَ بِهَا فِي الْبُدْنِ فَلَمَّا فَرَغَ رَكِبَ بَغْلَتَهُ وَأَرْدَفَ عَلِيًّا."
summary:
  ar: "حديث في سنن أبي داود، رقم 1766، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1766 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1766، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1766 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1766 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne la paternité et la lignée. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sünen Ebu Davud'da yer alan 1766 numaralı hadis, soy ve atalardan bahsetmektedir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1766, menyebutkan tentang garis keturunan dan leluhur. Bagian \"Kebapakan dalam Islam\" mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
