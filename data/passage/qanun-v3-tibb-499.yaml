text: "… الغافت :. ومن الحمّيات واليرقان الكبد النافع من وجع أخلاطه: يؤخذ صبر وعصارة الغافت وإهليلج أصفر بالسوية، يدقّ وينخل ويعجن بماء الكرفس، ويحبّب. الشربة وزن درهمين. حبّ النجاح : النافع من الفالج واللقوة، ووجع الركبة، وأوجاع المفاصل.، ومن البلغم أخلاطه …"
