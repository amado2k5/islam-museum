text: "… غرابٌ يصيدُ جاموساً بينما كان الشيخ ذاهباً إلى بستانه، ذات يوم، رأى غلامينِ بأيديهما غراب بعذبانه حتى كاد يموت. فتقدَّم إليهما، وقال لهما: لا تتشاجرا، ولا تميتا هذا الطائر المسكين. ولما كان الأولاد يميلون إلى الشيخ، ومداعباته، ويسمونه قاضي الزاوية …"
summary:
  ar: "تخاصم صبيان على غراب أمسكاه، فأخذه جحا وقال إنه صياد مدرب عنده، فاصطاد جاموساً لجار، فشكاه الجار، وحكم الوالي لصاحب الجاموس بعد أن أرسل إليه جحا جرة سمن، لكن الجرة كانت فيها روث جاموس، فاستدعى الوالي جحا، المسمى الشيخ نصر الدين، فبين له الظلم، فتاب الوالي عن الرشوة وأعاد الجاموس. {cite:juha-nawadir-kubra-djuwaydi p. 106}"
  en: "Two boys quarrel over a crow they have caught, and Juha takes it, saying it is his trained hunter. It catches a neighbour's buffalo, and the neighbour sues. The governor judges for the buffalo's owner after Juha sends him a jar of ghee, but the jar contains buffalo dung. The governor summons Juha, called Shaykh Nasr al-Din, and Juha shows him the injustice, so the governor repents of bribery and returns the buffalo. {cite:juha-nawadir-kubra-djuwaydi p. 106}"
  ur: "دو لڑکے ایک پکڑے ہوئے کوے پر جھگڑتے ہیں تو جحا اسے لے لیتا ہے اور کہتا ہے کہ یہ اس کا سدھایا ہوا شکاری ہے۔ وہ ایک پڑوسی کی بھینس پکڑ لیتا ہے اور پڑوسی دعویٰ کر دیتا ہے۔ جحا والی کو گھی کا مٹکا بھیجتا ہے تو والی بھینس کے مالک کے حق میں فیصلہ دیتا ہے، مگر مٹکے میں بھینس کا گوبر ہوتا ہے۔ والی شیخ نصر الدین کہلانے والے جحا کو بلاتا ہے اور جحا اسے ناانصافی دکھا دیتا ہے، تو والی رشوت سے توبہ کرتا ہے اور بھینس لوٹا دیتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 106}"
  fr: "Deux garçons se disputent un corbeau qu'ils ont attrapé, et Juha le prend en disant que c'est son chasseur dressé. Il capture le buffle d'un voisin, et le voisin porte plainte. Le gouverneur juge en faveur du propriétaire du buffle après que Juha lui a envoyé une jarre de beurre clarifié, mais la jarre contient de la bouse de buffle. Le gouverneur convoque Juha, appelé cheikh Nasr al-Din, et Juha lui montre l'injustice, si bien que le gouverneur se repent de la corruption et rend le buffle. {cite:juha-nawadir-kubra-djuwaydi p. 106}"
  es: "Dos muchachos riñen por un cuervo que han atrapado, y Juha lo toma diciendo que es su cazador adiestrado. El cuervo atrapa el búfalo de un vecino, y el vecino lo demanda. El gobernador falla a favor del dueño del búfalo después de que Juha le envía una jarra de mantequilla clarificada, pero la jarra contiene estiércol de búfalo. El gobernador convoca a Juha, llamado el jeque Nasr al-Din, y Juha le muestra la injusticia, así que el gobernador se arrepiente del soborno y devuelve el búfalo. {cite:juha-nawadir-kubra-djuwaydi p. 106}"
