text: "… ثوب عصب ولا خز وإن لم يكن مصبوغاً إذا أرادت به الزينة، وإن لم تُرد بلبس الثوب المصبوغ الزينة، فلا بأس أن تلبسه. وإذا اشتكت عينُها، اكتحلت بالأسود وغيره، وإن لم تشتكِ عينُها، لم تكتحل. فصل وأما الإمام أحمد، فقال …"
