text: "وَتَرَى ٱلْمَلَـٰٓئِكَةَ حَآفِّينَ مِنْ حَوْلِ ٱلْعَرْشِ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْ ۖ وَقُضِىَ بَيْنَهُم بِٱلْحَقِّ وَقِيلَ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ"
text_search: "وترى الملائكة حافين من حول العرش يسبحون بحمد ربهم ۖ وقضي بينهم بالحق وقيل الحمد لله رب العالمين"
translations:
  en: { text: "And thou (O Muhammad) seest the angels thronging round the Throne, hymning the praises of their Lord. And they are judged aright. And it is said: Praise be to Allah, the Lord of the Worlds!", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "تم فرشتوں کو دیکھو گے کہ عرش کے گرد گھیرا باندھے ہوئے ہیں (اور) اپنے پروردگار کی تعریف کے ساتھ تسبیح کر رہے ہیں۔ اور ان میں انصاف کے ساتھ فیصلہ کیا جائے گا اور کہا جائے گا کہ ہر طرح کی تعریف خدا ہی کو سزاوار ہے جو سارے جہان کا مالک ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
