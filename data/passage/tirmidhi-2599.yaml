label:
  ar: "الترمذي 2599 — رجلان من أهل النار اشتد صياحهما"
  en: "Tirmidhi 2599 — Two men of the Fire whose cries grew loud"
  ur: "ترمذی 2599 — آگ والوں میں سے دو آدمی جن کی چیخیں بلند ہوئیں"
text: "إن رجلين ممن دخل النار اشتد صياحهما فقال الرب عز وجل أخرجوهما . فلما أخرجا قال لهما لأى شيء اشتد صياحكما قالا فعلنا ذلك لترحمنا . قال إن رحمتي لكما أن تنطلقا فتلقيا أنفسكما حيث كنتما من النار . فينطلقان …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2599: رجلان من أهل النار اشتد صياحهما. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2599: Two men of the Fire whose cries grew loud. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2599: آگ والوں میں سے دو آدمی جن کی چیخیں بلند ہوئیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
