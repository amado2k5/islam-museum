text: "… قال : سمعت ابن عباس يقول: إِن وفد عبد القيس لما قدموا على رسول اللَّه علي هم أمرهم بالإيمان باللَّه. فقال: أتدرون ما الإيمان؟. قالوا: اللَّه ورسوله أعلم. قال: شهادة أن لا إله إلا اللَّه، وإقام الصلاة، وإِيناء الزكاة، وصوم …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 710، يذكر الشهادة والصلاة والزكاة، والسؤال عن الإيمان وجوابه، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 4, p. 710, that mentions the testimony, the prayer and the zakat, the question about faith and its answer, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 4، ص 710 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، ایمان کے بارے میں سوال اور اس کا جواب، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 4, pág. 710, que menciona el testimonio, la oración y el zakat, la cuestión de la fe y su respuesta, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 4, p. 710), mentionnant le témoignage, la prière et la zakat, la question de la foi et sa réponse, un des articles de foi. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 4. cildinin 710. sayfasından, iman şahadeti, namaz, zekât, iman hakkında soru-cevap ve imanın rükünlerinden birini ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 4, halaman 710, yang menyebutkan kesaksian iman, salat, zakat, tanya jawab tentang iman, dan salah satu rukun iman; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
