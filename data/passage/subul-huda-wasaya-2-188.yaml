text: "… بين أَبى بكر وعمر قال : هكذا نُبْعَث. هذا مع القطع بأَن روحه الكريمة فى الرفيق الأَعلى فى أَعلى عِلَّيِّين مع أَرواح الأَنبياء صلوات اللّٰه وسلامه عليهم. وقد صَحَّ أَنه رأَى موسى قائماً يصلى فى قبره ليلة الإِسراء ورآه فى …"
