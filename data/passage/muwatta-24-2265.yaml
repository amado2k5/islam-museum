label: { ar: "الموطأ 2265 — حديث بريرة: الولاء لمن أعتق لا لمن اشترط", en: "Muwatta 2265", es: "Muwatta 2265", fr: "Muwatta 2265", ur: "موطا 2265", tr: "El-Muvatta 2265 — Barirah Hadisi: Sadakat, köleyi azad edene aittir, şart koşana değil.", id: "Al-Muwatta 2265 — Hadits Barirah: Kesetiaan adalah milik orang yang membebaskan, bukan milik orang yang menetapkan [syarat]." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة قصة بريرة التي استعانت بعائشة في مال كتابتها، فاشترط أهلها الولاء لهم، فأمر النبي عائشة أن تشتريها وتعتقها وتشترط لهم الولاء، لأن الولاء لمن أعتق. ثم أنكر النبي الشروط التي ليست في كتاب الله، وبيّن أن كل شرط خالف كتاب الله باطل وإن كثر. {cite:muwatta-maruf-1997 p.334} {cite:muwatta-maruf-1997 p.335}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından, o da Ayşe'den rivayetle, Barira'nın hikayesini anlatır. Barira, azat edilmesi için Ayşe'den para istemişti. Ailesi, miras hakkının (vela') kendilerine ait olmasını şart koşmuştu. Bunun üzerine Peygamber, Ayşe'ye onu satın almasını, azat etmesini ve miras hakkının onu azat edene ait olmasını şart koşmasını emretti. Ardından Peygamber, Allah'ın Kitabında bulunmayan şartları reddetti ve Allah'ın Kitabına aykırı olan her şartın, ne kadar çok olursa olsun, geçersiz olduğunu açıkladı. {cite:muwatta-maruf-1997 s.334} {cite:muwatta-maruf-1997 s.335}"
  id: "Malik meriwayatkan, berdasarkan riwayat Hisham bin Urwah, berdasarkan riwayat ayahnya, berdasarkan riwayat Aisyah, kisah Barirah yang meminta bantuan Aisyah untuk mendapatkan uang guna pembebasannya. Keluarganya menetapkan bahwa hak waris (wala') adalah milik mereka. Maka Nabi memerintahkan Aisyah untuk membelinya, membebaskannya, dan menetapkan bahwa hak waris adalah milik orang yang membebaskannya. Kemudian Nabi menolak syarat-syarat yang tidak terdapat dalam Kitab Allah, dan menjelaskan bahwa setiap syarat yang bertentangan dengan Kitab Allah adalah tidak sah, betapapun banyaknya. {cite:muwatta-maruf-1997 p.334} {cite:muwatta-maruf-1997 p.335}"
