label: { ar: "الموطأ 2265 — حديث بريرة: الولاء لمن أعتق لا لمن اشترط", en: "Muwatta 2265" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة قصة بريرة التي استعانت بعائشة في مال كتابتها، فاشترط أهلها الولاء لهم، فأمر النبي عائشة أن تشتريها وتعتقها وتشترط لهم الولاء، لأن الولاء لمن أعتق. ثم أنكر النبي الشروط التي ليست في كتاب الله، وبيّن أن كل شرط خالف كتاب الله باطل وإن كثر. {cite:muwatta-maruf-1997 p.334} {cite:muwatta-maruf-1997 p.335}"
