  id: "Cuplikan dari Mishkat al-Masabih, Jilid Bergambar 1, hlm. 261, yang menyebutkan amalan wajib, kewajiban, dosa kecil, dan shalat yang dianjurkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa kecil."
