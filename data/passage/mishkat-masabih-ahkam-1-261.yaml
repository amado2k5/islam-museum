text: "… في بدنه أي أصابته علة، والواو في وذلك الدهر كله للحال، وذو الحال مستتر في خبر كانت، وهو كفارة. شف المشار إليه: إما تكفير الذنوب أي تكفير الصلاة المكتوبة الصغائر لا يختص بفرض واحد، بل فرائض الدهر تكفر صغائره، وإما …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 261، يرد فيه ذكر الفريضة والفرائض، والفرض، وصغائر الذنوب، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 261, whose wording mentions the obligation (farida), the obligatory (fard), the minor sins, the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
