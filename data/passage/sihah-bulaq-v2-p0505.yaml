text: |-
  قول الدعشوقة فى بعض النسخ
  اهمال السين وفى القاموس
  جواز الاهمال والاعمام؟عنى
  ام ه
  ٨٣/
  أباب القاف)
  فيقال هوجمع دعق وهو مصدرفتوهمه اسما أى أنهم اذافزءوالاينفرون ابلهم فيهويون
  ولكن يجمعونها ويقاتلون دونها اعزهم (لعشق الدعشوقة دويسة( دغفق قال
  الاصمعى عيش دغفق أى واسع قال ابن الاعرابي عام دغه ق أى مخسب مثل دغفل د فق )
  دفقت الماء أدفقه دفقا أى صبيثه فهو ماء دافق أى مدفوق كما قالواسر كاتم أى-كتوم لانه
  من قولك دفق الماء على مالم يسم قاعله ولا يقال دفق الماموية ال دفق اللّٰه ووحه اذ ادعى عليه
  بألوت ودفقت كفاه الددى أى صيتامشذد للكثرة والاندقاق الانصباب والتدقق التصيب
  وسيل دفاق بالضم علاً الوادى وناقة دفاق بالسكسرأى متدفقة فى السير والدققّ مثال
  الهجى السريع من الابل ويقال أيضامشى فلان الدفقى اذا أسرع وسير أدفق أى سريع قال
  الراجز * بين الدفق والنجاء الأدفق• وقال أبو عبيدة هوأقصى العنق ويعير أدفق بين الدفق
  .اكانت أسنانه منتصبة الى خارج ويقال جاء القو
  وم دفقة واحدة بااضم اداجاوًا بمزه واحا
  قق الدقيق خلاف الغليظ وكذلك الدقاق بالضم والدق بالكسر م:له ومنه حى الدق
  وقولهم أخ.ذت جله ودقه كما يقال أخذت قليله وكثيره وقددق الشى يذق دقة أى صار
  دقيقاوأدقد غيرهودة م ويقال أييته فاأدقنى ولا أجلنى أى ما أعطانى دقيقا ولاجليلا
  والمداقة فى الامر التداق واستدق الشئأى صارد قيقاودقت الشئ فاندق والتدقيق
  انعام الدق والدقيق الطحين والدقة بالصم التراب اللين الذى كسيينه الريح من الارض
  والجمع دقق ومنه قول رؤّبة
  تبدولنا أعلامه بعد الغرق • فى قطع الال وهبوات الدقق
  والمدق والمدقة مايدق به وكذلك المدق بالضم وهو أحدماجاء من الأدوات التى يعقل بجهاعلى
  مفعل بالضم قال العجاج يصف الهار والاتنل، يتعن جابا كدق المعطيره بعنى مدون
  العطارحسب أنه يدق به وتصغيره مديق والجمع مداق والدقدقة حكاية أصوات-وافر
  الدواب مثل الطقطقة ( لق لاندلاق التقدم وكل ماندر خارجا فقد انداق واندلتي
  السيف خرج من غبرسلّ وكذلك اذا اتشق جفنه وخرج منه وداقته أقادلة ! ادا أرلقته من
  عمده وسف دالق ودلوة اذا كان سلس اللحروج من عمده وكان يقال لعمارة بن زياد العسى
  أخى الربيع بن زيادد الق لكثرة غاراته ويقال لمعنه فانداقت أقتاب رطئه أى خرجت أمعاؤه
  واندلق السيل على القوم أى شجم وانداقت انطيل وغارة دلوق وخيل دلق أى مندلقة شديدة
  الدفعة قال طرفة
  دلق فى غارة مسفوحة • كرعال الطير أسراباتر
  والدلوق اقة التى تكسرن آسنانها من الكبرفقي الماء وهى الدلقاء والداقم أيض
  بالكسر والميم زائدة كما عالو اللدقعاءد قعم وللدرداء دردم قال أبو زيديقال للشاقة بعد البزول
  شارف ثم عوزم ثم اطلط ثم بحمرش ثم جعماء تم داقم اذاسقطت أضراسهاهرما والداو
  بالتحريك دويبة فارسى معرّب (دمق يقال اندعق عليهم بفتة اذادخسل بغيراذن
  وسكذلك دمق دموقا وأدمقته أنا يقال دمق الصائد فى قترته واندمق فيها ودم قت فاه
  أى كسرت أسنانه وأنشد الاصحعى!
  وباصكل
