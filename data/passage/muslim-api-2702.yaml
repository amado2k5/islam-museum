label: { ar: "صحيح مسلم 2702 — النسب والانتساب", en: "Sahih Muslim 2702 — paternity and lineage", ur: "صحیح مسلم 2702 — نسب اور انتساب", es: "Sahih Muslim 2702 — paternidad y linaje", fr: "Sahih Muslim 2702 — paternité et lignée" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَعَمْرٌو النَّاقِدُ، وَزُهَيْرُ بْنُ حَرْبٍ، قَالُوا حَدَّثَنَا سُفْيَانُ، بْنُ عُيَيْنَةَ عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، - - قَالَ أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ رِوَايَةً وَقَالَ عَمْرٌو يَبْلُغُ بِهِ النَّبِيَّ وَقَالَ زُهَيْرٌ عَنِ النَّبِيِّ قَالَ \" إِذَا دُعِيَ أَحَدُكُمْ إِلَى طَعَامٍ وَهُوَ صَائِمٌ فَلْيَقُلْ إِنِّي صَائِمٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2702، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2702 (The Book of Fasting), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2702، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2702 (El Libro del Ayuno), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2702 (Le Livre du jeûne), mentionne la paternité et la lignée. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
