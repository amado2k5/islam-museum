label: { ar: "سنن النسائي 3284 — ما أُحل، ما لا يحل", en: "Sunan al-Nasa'i 3284 — what was made lawful; what is not lawful", ur: "سنن نسائی 3284 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan al-Nasa'i 3284 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sunan al-Nasa'i 3284 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "… ذَلِكِ \". فَقُلْتُ نَعَمْ لَسْتُ لَكَ بِمُخْلِيَةٍ وَأَحَبُّ مَنْ يُشَارِكُنِي فِي خَيْرٍ أُخْتِي. فَقَالَ النَّبِيُّ \" إِنَّ أُخْتَكِ لاَ تَحِلُّ لِي \". فَقُلْتُ وَاللَّهِ يَا رَسُولَ اللَّهِ إِنَّا لَنَتَحَدَّثُ أَنَّكَ تُرِيدُ أَنْ تَنْكِحَ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. فَقَالَ \" بِنْتُ أُمِّ سَلَمَةَ \". فَقُلْتُ نَعَمْ. فَقَالَ \" وَاللَّهِ لَوْلاَ أَنَّهَا رَبِيبَتِي فِي حَجْرِي مَا حَلَّتْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3284، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3284 (The Book of Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3284، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3284 (El Libro del Matrimonio), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3284 (Le Livre du Mariage), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
