text: "… فأبدى له الشيخ البشر والترحيب فسلنا عليه جميعا، ثم بدأ الشاب بالكلام فقال : إذ الله تمالى بمنه وفضله قد جملك طبيبا لسقام القلوب، ومعالجا لأوجاع الذنوب، وبى جرح قد فعل، وداء قد استكمل، فان رأيت أن تتلطف لى ببعض …"
