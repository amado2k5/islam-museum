text: "… فأبدى له الشيخ البشر والترحيب فسلنا عليه جميعا، ثم بدأ الشاب بالكلام فقال : إذ الله تمالى بمنه وفضله قد جملك طبيبا لسقام القلوب، ومعالجا لأوجاع الذنوب، وبى جرح قد فعل، وداء قد استكمل، فان رأيت أن تتلطف لى ببعض …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 365، يذكر الطب والطبيب، والسقم، والوجع، ومداواة الجراح، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 8, p. 365, that mentions medicine and the physician, sickness, pain, the treatment of wounds, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 8، ص 365 کا اقتباس جس میں طب اور طبیب، سقم، درد، زخموں کا علاج، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 8, pág. 365, que menciona la medicina y el médico, la enfermedad, el dolor, el tratamiento de las heridas, la enfermedad y su remedio; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 8 scanné, p. 365, qui mentionne la médecine et le médecin, la maladie, la douleur, le traitement des plaies, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nu'aym'ın Hilyat al-Awliya' adlı eserinin resimli 8. cildinin 365. sayfasından, tıp ve hekim, hastalık, ağrı, yara tedavisi ve rahatsızlıktan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 8, hlm. 365, yang menyebutkan tentang pengobatan dan dokter, penyakit, rasa sakit, pengobatan luka, dan penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
