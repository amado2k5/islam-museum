text: "الكلمة المعنى المختار غريب وفيه تعسف بعيد. الَّذِينَ لَا يُؤْتُونَ قيل: يمنعون زكاة أموالهم. وفيه الزَّكَوَةَ نظر. أبشروا بشرونه عند موته، وفي قبره، وحين يبعث. قيل: نزلت في المؤمنين، دَعَآ إِلَى اللَّهِ والصحيح أنها عامة. لَفِى شَكٍ أي: وما كان …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 5632، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 5632, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 5632 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 1, pág. 5632, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tafsir d'Ibn Kathir (tome 1, p. 5632) mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 5632. sayfasından bir alıntı, ölüm ve ölüm anı, defin, mezar ve istirahat yerinden bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, Miras, Antik Eserler ve İstirahat Yerleri Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Tafsir Ibn Kathir, Jilid 1, halaman 5632, menyebutkan saat kematian dan proses sekarat, penguburan, kuburan, dan tempat peristirahatan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritance, Antiquities, and Resting Places Browser."
