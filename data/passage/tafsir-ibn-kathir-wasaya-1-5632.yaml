text: "الكلمة المعنى المختار غريب وفيه تعسف بعيد. الَّذِينَ لَا يُؤْتُونَ قيل: يمنعون زكاة أموالهم. وفيه الزَّكَوَةَ نظر. أبشروا بشرونه عند موته، وفي قبره، وحين يبعث. قيل: نزلت في المؤمنين، دَعَآ إِلَى اللَّهِ والصحيح أنها عامة. لَفِى شَكٍ أي: وما كان …"
