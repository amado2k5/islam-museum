text: "في الزهد والرقائق محبة اللّٰه وعبل ؟ المحبة هي المنزلة التي فيها تنافس المتنافسون، وإليها شخص العاملون، وإلى علمها شمر السابقون، وبروح نسيمها تروح العابدون، فهي قوت القلوب، وغذاء الأرواح، وقرة العيون، وهي الحياة التي من حرمها فهو من جملة …"
