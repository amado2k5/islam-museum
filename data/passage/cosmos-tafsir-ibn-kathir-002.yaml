text: "كان الجنُّ بنو الجانِّ في الأرض قبل أَنْ يُخْلَقَ آدمُ بِأَلّفَيِ سنة، فأفسدوا في الأرض، وسفكوا الدماء، فبعث اللّٰه جندًا من الملائكة فضربوهم، حتىٰ ألحقوهم بجزائر البحور"
summary:
  ar: "في تفسير آية الاستخلاف يروي ابن كثير عن عبد الله بن عمرو خبراً بأن الجن سكنوا الأرض قبل آدم بألفي سنة فأفسدوا وسفكوا الدماء حتى بعث الله ملائكة ردّتهم إلى جزائر البحار؛ ويذكر محقق الطبعة في الحاشية أن رجال السند ثقات لكن الخبر موقوف وقد يكون مأخوذاً من كتب بني إسرائيل."
  en: "In his commentary on the verse of the vicegerent, Ibn Kathir reports from Abdullah ibn Amr that the jinn inhabited the earth two thousand years before Adam, spread corruption and shed blood, until God sent a force of angels who drove them to the islands of the seas. The edition's footnote says the narrators are trustworthy but the report stops at the Companion and may come from the books of the Children of Israel."
  es: "En su comentario sobre el versículo del virrey, Ibn Kathir relata, citando a Abdullah ibn Amr, que los genios habitaron la tierra dos mil años antes de Adán, sembraron la corrupción y derramaron sangre, hasta que Dios envió un ejército de ángeles que los expulsó a las islas del mar. La nota al pie de la edición indica que los narradores son fidedignos, pero el relato se detiene en el Compañero y podría provenir de los libros de los Hijos de Israel."
