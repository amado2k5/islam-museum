text: "… وأَلَّا يَضِيعُوا وأَنتَ صَالحُ الحالِ، والسَّعْيُ فِي كفايةٍ مَا نابَهُم مِن مَكْروهٍ. والنَّصِيحةُ للهِ ولرسُولِهِ فَرضٌ، وحَدُّهَا الأَمرُ بالمعروفِ والنَّهيُ عن المُنكرِ، ونصرُ دِينِ الإسلامِ بِمَا أَمكنَ، والنَّصيحةُ لأئمَّةِ المُسْلِمِيْنَ فرضٌ، وحَدُّهَا طاعتُهُم فِي كُلِّ مَا لَيْسَ فِيْهِ معصيةٌ للهِ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 298، يرد فيه ذكر الفرض، والمكروه، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 298, whose wording mentions the obligatory (fard), the disliked (makruh), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 298 کا اقتباس جس میں فرض، مکروہ، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 298, dont le texte mentionne l'obligatoire (fard), le réprouvé (makruh), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 298, cuyo texto menciona lo obligatorio (fard), lo reprobado (makruh), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 298. sayfasından, farz ameller, mekruh ameller ve itaat amelleri konusunu ele alan bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, hlm. 298, yang membahas tentang amalan wajib, amalan yang tidak disukai, dan amalan ketaatan; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
