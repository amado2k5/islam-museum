label: { ar: "صحيح البخاري 3395 — الأب والأبوة، النسب والانتساب", en: "Sahih al-Bukhari 3395 — the father and fatherhood; paternity and lineage", ur: "صحیح بخاری 3395 — باپ اور والدیت، نسب اور انتساب" }
text: "… حَدَّثَنَا ابْنُ عَمِّ، نَبِيِّكُمْ ـ يَعْنِي ابْنَ عَبَّاسٍ ـ عَنِ النَّبِيِّ قَالَ \" لاَ يَنْبَغِي لِعَبْدٍ أَنْ يَقُولَ أَنَا خَيْرٌ مِنْ يُونُسَ بْنِ مَتَّى \". وَنَسَبَهُ إِلَى أَبِيهِ. وَذَكَرَ النَّبِيُّ لَيْلَةَ أُسْرِيَ بِهِ فَقَالَ \" مُوسَى آدَمُ طُوَالٌ كَأَنَّهُ مِنْ رِجَالِ شَنُوءَةَ \". وَقَالَ \" عِيسَى جَعْدٌ مَرْبُوعٌ \". وَذَكَرَ مَالِكًا خَازِنَ النَّارِ، وَذَكَرَ الدَّجَّالَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3395، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3395, that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3395، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
