summary:
  ar: "القسم 3 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحيض والاستحاضة»، ويضم فيها النصوص من 348 إلى 395 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 3 of Sunan al-Nasa'i (The Book of Menstruation and Istihadah) in the division of the open hadith dataset the museum took its reports from: reports 348 to 395 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 3، عنوان «کتاب الحیض والاستحاضۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 348 تا 395۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 3 de Sunan al-Nasa'i (El Libro de la Menstruación y la Istihadah) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 348 al 395 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
