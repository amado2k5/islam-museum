text: "… فإِني سَمِعْتُ رسولَ اللَّه ل يقول : مَا مِنْ عَبْدٍ يَسْجُدُ للَّهِ سَجْدَةً إِلَّا رَفَعَ اللَّهُ لَهُ بِهَا دَرَجَةً، وَحَطَّ عَنْهُ بِهَا خَطِيئَةً . قال معدان : ثم لقِيتُ أبا الدرداء، فسألتُه، فقال لِي مثلَ ذلك [مسلم: ١٠٩٣]. وقال رسولُ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 75، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 75, that speaks of ranks raised, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
