text: "… باب بَيّانِ خَصَالٍ مَنِ اتْصَفَ بِهِنَّ وَجَدَ حَلاوَةَ الإِيَمَانِ.. - باب وُجُوبِ مَحَبْةٍ رسول اللّه أكْثَرَ مِنَ الأَمْلِ وَالْوَلَدِ وَالْوَالِدِ وَالنَّاسِ أجْمَعِينَ، وَإِطْلاقِ عَدَمِ الإِيَمَانِ عَلَى مَنْ لَمْ يُحِبَّهُ هَذِهِ الْمَحَبَّةِ - باب الدَّلِيلِ عَلَى أنْ مِنْ خِصَالِ الإيَمَانِ أنْ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 2042، يذكر حلاوة الإيمان وكماله، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 2042, that mentions the sweetness and completeness of faith, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 2042 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
