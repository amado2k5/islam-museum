text: "… باب بَيّانِ خَصَالٍ مَنِ اتْصَفَ بِهِنَّ وَجَدَ حَلاوَةَ الإِيَمَانِ.. - باب وُجُوبِ مَحَبْةٍ رسول اللّه أكْثَرَ مِنَ الأَمْلِ وَالْوَلَدِ وَالْوَالِدِ وَالنَّاسِ أجْمَعِينَ، وَإِطْلاقِ عَدَمِ الإِيَمَانِ عَلَى مَنْ لَمْ يُحِبَّهُ هَذِهِ الْمَحَبَّةِ - باب الدَّلِيلِ عَلَى أنْ مِنْ خِصَالِ الإيَمَانِ أنْ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 2042، يذكر حلاوة الإيمان وكماله، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 2042, that mentions the sweetness and completeness of faith, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 2042 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 2042, que menciona la dulzura y la plenitud de la fe, características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 1, p. 2042) évoquant la douceur et la plénitude de la foi, ainsi que les qualités du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih Muslim'in 1. cildinin 2042. sayfasında yer alan, imanın tatlılığı ve mükemmelliği ile müminin özelliklerini ele alan, El-Nevevi'nin tefsirinden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 2042, yang membahas tentang manisnya dan kesempurnaan iman serta karakteristik seorang mukmin; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
