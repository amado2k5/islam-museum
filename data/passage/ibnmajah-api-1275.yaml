label: { ar: "سنن ابن ماجه 1275 — حلاوة الإيمان وكماله", en: "Sunan Ibn Majah 1275 — the sweetness and completeness of faith", ur: "سنن ابن ماجہ 1275 — ایمان کی مٹھاس اور اس کا کمال", es: "Sunan Ibn Majah 1275 — La dulzura y la plenitud de la fe", fr: "Sunan Ibn Majah 1275 — La douceur et la plénitude de la foi", tr: "Sunan İbn Majah 1275 — İmanın Tatlılığı ve Mükemmelliği", id: "Sunan Ibn Majah 1275 — Manisnya dan Kesempurnaan Iman" }
text: "… خَالَفْتَ السُّنَّةَ أَخْرَجْتَ الْمِنْبَرَ يَوْمَ عِيدٍ وَلَمْ يَكُنْ يُخْرَجُ بِهِ وَبَدَأْتَ بِالْخُطْبَةِ قَبْلَ الصَّلاَةِ وَلَمْ يَكُنْ يُبْدَأُ بِهَا. فَقَالَ أَبُو سَعِيدٍ أَمَّا هَذَا فَقَدْ قَضَى مَا عَلَيْهِ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" مَنْ رَأَى مُنْكَرًا فَاسْتَطَاعَ أَنْ يُغَيِّرَهُ بِيَدِهِ فَلْيُغَيِّرْهُ بِيَدِهِ. فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ. فَإِنْ لَمْ يَسْتَطِعْ بِلِسَانِهِ، فَبِقَلْبِهِ. وَذَلِكَ أَضْعَفُ الإِيمَانِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1275، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 1275 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1275، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1275 (Establecimiento de la oración y la Sunnah al respecto), menciona la dulzura y la plenitud de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 1275 (L'établissement de la prière et la Sunna s'y rapportant), évoque la douceur et la plénitude de la foi. Le Guide des piliers et des branches de la foi le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'islam, les branches de la foi et les qualités du croyant."
  tr: "İbn Majah'ın Sünen'inde yer alan 1275 numaralı hadis, imanın tatlılığı ve mükemmelliğinden bahseder. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1275, menyebutkan tentang manisnya dan kesempurnaan iman. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
