summary:
  ar: "قول لمالك: إنما يؤخذ من الزيتون العشر بعد أن يُعصر ويبلغ زيتونه خمسة أوسق، فما لم يبلغ زيتونه خمسة أوسق فلا زكاة فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.366}"
