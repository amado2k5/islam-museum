label: { ar: "الموطأ 731 — مالك: إنما يؤخذ من الزيتون العشر بعد أن يعصر ويبلغ زيتونه خمسة أوسق", en: "Muwatta 731", es: "Muwatta 731", fr: "Muwatta 731", ur: "موطا 731", tr: "Al-Muwatta 731 — Malik: Zekât, ancak zeytinler sıkıldıktan ve ağırlıkları beş vask'a ulaştıktan sonra alınır.", id: "Al-Muwatta 731 — Malik: Persepuluhan hanya diambil dari buah zaitun setelah diperas dan buahnya mencapai lima wasq." }
summary:
  ar: "قول لمالك: إنما يؤخذ من الزيتون العشر بعد أن يُعصر ويبلغ زيتونه خمسة أوسق، فما لم يبلغ زيتونه خمسة أوسق فلا زكاة فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.366}"
  tr: "Malik şöyle demiştir: Zekat, ancak zeytinler sıkıldıktan ve beş vask ağırlığa ulaştıktan sonra alınır. Zeytinler beş vask ağırlığa ulaşmazsa, zekât verilmez. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.366}"
  id: "Malik berkata: Zakat hanya diambil dari buah zaitun setelah diperas dan buah zaitun tersebut telah mencapai lima wasq. Jika buah zaitun tersebut tidak mencapai lima wasq, maka tidak ada zakat yang wajib dibayarkan. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.366}"
