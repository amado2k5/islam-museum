text: "… فردوها فرجع فى صومعته، فقالوا له : باللّه مم ضحكت ؟ فقال ما ضحكت إلا من دعوة دعتها على أمى وفى الحديث إيثار إجابة الأم على صلاة التطوع لأن الاستمرار فيها نافلة وإجابة الأم وبرها واجب. قال النووى وغيره : …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 556، يرد فيه ذكر الواجب، والنافلة والنوافل، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 556, whose wording mentions the obligatory (wajib), the supererogatory (nafila), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 556 کا اقتباس جس میں واجب، نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Hajar, volume numérisé 2, p. 556, dont le texte mentionne l'obligatoire (wajib), le surérogatoire (nafila), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen digitalizado 2, p. 556, cuyo texto menciona lo obligatorio (wajib), lo supererogatorio (nafila), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hacer'in Fethü'l-Bari adlı eserinin 2. cildinin 556. sayfasından, farz ibadetler, nafile ibadetler ve gönüllü ibadetler konusunu ele alan bir alıntı. Bu alıntı, kaynak yönergelerine uygun olarak, makine tarafından okunabilir taranmış bir versiyondan alınmıştır ve yaklaşık kırk kelime uzunluğundadır ve düzenlenmemiştir. Farz ibadetler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram ibadetler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, Jilid 2, halaman 556, yang membahas amalan wajib, amalan sunnah, dan amalan ibadah sukarela. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin dan panjangnya sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
