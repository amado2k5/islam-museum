label: { ar: "الموطأ 2772 — أبو طلحة ينزع النمط المصور من تحته فيسأله سهل بن حنيف فيقول أطيب لنفسي", en: "Muwatta 2772", es: "Muwatta 2772", fr: "Muwatta 2772", ur: "موطا 2772", tr: "El-Muvatta 2772 — Ebu Talha, altındaki desenli kumaşı çıkarır ve Sahl ibn Huneyf ona sorar, o da, “Bu benim için daha iyidir” der.", id: "Al-Muwatta 2772 — Abu Talha menyingkirkan kain bercorak dari bawahnya, dan Sahl ibn Hunayf bertanya kepadanya, lalu ia berkata, “Ini lebih baik bagiku.”" }
summary:
  ar: "يروي مالك عن أبي النضر عن عبيد الله بن عبد الله بن عتبة بن مسعود أنه دخل على أبي طلحة الأنصاري يعوده، فوجد عنده سهل بن حنيف، فدعا أبو طلحة إنسانا فنزع نمطا من تحته، فقال له سهل: لم تنزعه؟ قال: لأن فيه تصاوير، وقد قال فيها رسول الله ما قد علمت. فقال سهل: ألم يقل رسول الله: إلا ما كان رقما في ثوب؟ قال: بلى، ولكنه أطيب لنفسي. ويذكر المحقق قول ابن عبد البر أن الصواب أن الداخل مع عبيد الله هو عثمان بن حنيف لا سهل. {cite:muwatta-maruf-1997 p.555} {cite:muwatta-maruf-1997 p.556}"
  tr: "Malik, Ebu el-Nadr'dan, o da Ubeydullah ibn Abdullah ibn Utbah ibn Mes'ud'dan rivayet ettiğine göre, Ebu Talha el-Ensari hastayken onu ziyaret etmek için evine girdiğini anlatır. Yanında Sahl ibn Huneyf'i buldu. Ebu Talha birini çağırdı ve o kişi altındaki bir kumaş parçasını kaldırdı. Sahl ona, \"Neden kaldırdın?\" diye sordu. Adam, \"Çünkü üzerinde resimler var ve Allah Resulü'nün bunlar hakkında ne dediğini biliyorsun\" diye cevap verdi. Sahl, \"Allah Resulü, 'Ancak bu sadece bir elbise üzerindeki bir desendir' demedi mi?\" dedi. Adam, \"Evet, ama bu bana daha hoş geliyor\" diye cevap verdi. Araştırmacı, İbn Abd el-Barr'ın, Ubeydullah ile birlikte giren kişinin Sahl değil, Osman ibn Huneyf olduğuna dair ifadesini aktarıyor. {cite:muwatta-maruf-1997 s.555} {cite:muwatta-maruf-1997 s.556}"
  id: "Malik meriwayatkan dari Abu al-Nadr, dari Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud, bahwa ia mengunjungi Abu Talhah al-Ansari ketika beliau sakit. Ia mendapati Sahl ibn Hunayf bersamanya. Abu Talhah memanggil seseorang yang kemudian menyingkirkan sehelai kain dari bawahnya. Sahl bertanya kepadanya, \"Mengapa engkau menyingkirkannya?\" Ia menjawab, \"Karena kain ini bergambar, dan engkau tahu apa yang dikatakan Rasulullah tentang gambar-gambar itu.\" Sahl berkata, \"Bukankah Rasulullah bersabda, 'Kecuali apa yang hanya berupa desain pada pakaian?'\" Ia menjawab, \"Ya, tetapi gambar itu lebih menyenangkan bagiku.\" Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa orang yang tepat yang masuk bersama Ubayd Allah adalah Utsman ibn Hunayf, bukan Sahl. {kutip:muwatta-maruf-1997 hal.555} {kutip:muwatta-maruf-1997 hal.556}"
