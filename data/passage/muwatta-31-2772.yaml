label: { ar: "الموطأ 2772 — أبو طلحة ينزع النمط المصور من تحته فيسأله سهل بن حنيف فيقول أطيب لنفسي", en: "Muwatta 2772" }
summary:
  ar: "يروي مالك عن أبي النضر عن عبيد الله بن عبد الله بن عتبة بن مسعود أنه دخل على أبي طلحة الأنصاري يعوده، فوجد عنده سهل بن حنيف، فدعا أبو طلحة إنسانا فنزع نمطا من تحته، فقال له سهل: لم تنزعه؟ قال: لأن فيه تصاوير، وقد قال فيها رسول الله ما قد علمت. فقال سهل: ألم يقل رسول الله: إلا ما كان رقما في ثوب؟ قال: بلى، ولكنه أطيب لنفسي. ويذكر المحقق قول ابن عبد البر أن الصواب أن الداخل مع عبيد الله هو عثمان بن حنيف لا سهل. {cite:muwatta-maruf-1997 p.555} {cite:muwatta-maruf-1997 p.556}"
