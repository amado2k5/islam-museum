label: { ar: "الموطأ 90 — سعيد بن المسيب يرعف في الصلاة فيتوضأ في حجرة أم سلمة", en: "Muwatta 90", es: "Muwatta 90", fr: "Muwatta 90", ur: "موطا 90", tr: "Al-Muwatta 90 — Sa’id ibn al-Musayyab namaz sırasında burnu kanadı, bu yüzden abdestini Umm Salamah’ın odasında aldı.", id: "Al-Muwatta 90 — Sa’id ibn al-Musayyab mimisan saat shalat, lalu ia berwudhu di kamar Umm Salamah." }
summary:
  ar: "أثر يرويه مالك عن يزيد بن عبد الله بن قسيط الليثي، في باب ما جاء في الرعاف: رأى سعيد بن المسيب رعف وهو يصلي، فأتى حجرة أم سلمة زوج النبي فأُتي بماء فتوضأ، ثم رجع فبنى على ما قد صلى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.80}"
  tr: "Malik'in Yezid ibn Abdullah ibn Kusayt el-Layti'den rivayet ettiği, burun kanamaları bölümündeki bir hadiste şöyle denmektedir: Sa'id ibn el-Musayyab namaz kılarken burnu kanadı, bunun üzerine Peygamber'in eşi Ümmü Seleme'nin odasına gitti ve kendisine su getirildi. Bunun üzerine abdest aldı, sonra geri döndü ve namazına kaldığı yerden devam etti. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.80}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Yazid ibn Abdullah ibn Qusayt al-Laythi, dalam surah tentang mimisan: Sa'id ibn al-Musayyab mengalami mimisan saat shalat, lalu ia pergi ke kamar Umm Salamah, istri Nabi, dan air dibawa kepadanya, lalu ia berwudhu, kemudian kembali dan melanjutkan shalatnya dari tempat ia berhenti. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.80}"
