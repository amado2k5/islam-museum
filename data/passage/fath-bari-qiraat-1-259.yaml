text: "… وأبو سفيان ومعاذ، فأما أبو حفص عمر فلا أعرفه إلا في الحديث المذكور. والله أعلم. قلت: وليس لمعاذ ولا لعمر في البخاري ذكر إلا في هذا الموضع، وأما أبو عمرو ابن العلاء فهو أشهر الإخوة وأجلهم، وهو إمام القراءات بالبصرة، …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 259، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
