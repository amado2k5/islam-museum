label: { ar: "الموطأ 2648 — مالك: يكره للغلمان والرجال لبس شيء من الذهب لنهي النبي عن تختم الذهب", en: "Muwatta 2648", es: "Muwatta 2648", fr: "Muwatta 2648", ur: "موطا 2648", tr: "El-Muvatta 2648 — Malik: Erkeklerin ve oğlan çocuklarının altından yapılmış herhangi bir şey takmaları mekruhtur, çünkü Peygamberimiz altın yüzük takmayı yasaklamıştır.", id: "Al-Muwatta 2648 — Malik: Tidak disukai bagi anak laki-laki dan pria untuk mengenakan apa pun yang terbuat dari emas karena Nabi melarang mengenakan cincin emas." }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: وأنا أكره أن يلبس الغلمان شيئا من الذهب، لأنه بلغني أن رسول الله نهى عن تختم الذهب، فأنا أكرهه للرجال الكبير منهم والصغير. ويذكر المحقق أن حديث النهي عن تختم الذهب في الصحيحين من حديث أبي هريرة. {cite:muwatta-maruf-1997 p.498} {cite:muwatta-maruf-1997 p.499}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: \"Altından yapılmış herhangi bir şeyi erkek çocukların takmasından hoşlanmıyorum, çünkü Allah'ın Resulü'nün altın yüzük takmayı yasakladığını duydum, bu yüzden bunu hem genç hem de yaşlı erkekler için hoş karşılamıyorum.\" Araştırmacı, altın yüzük takmayı yasaklayan hadisin iki Sahih'te (Buhari ve Müslim) bulunduğunu ve Ebu Hurayra tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.498} {cite:muwatta-maruf-1997 s.499}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Saya tidak suka anak laki-laki mengenakan sesuatu yang terbuat dari emas, karena saya mendengar bahwa Rasulullah melarang mengenakan cincin emas, jadi saya tidak menyukainya untuk laki-laki, baik muda maupun tua. Peneliti menyebutkan bahwa hadits yang melarang mengenakan cincin emas terdapat dalam dua kitab Sahih (Bukhari dan Muslim) dan diriwayatkan oleh Abu Hurairah. {cite:muwatta-maruf-1997 p.498} {cite:muwatta-maruf-1997 p.499}"
