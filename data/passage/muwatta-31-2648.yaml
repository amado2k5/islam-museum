label: { ar: "الموطأ 2648 — مالك: يكره للغلمان والرجال لبس شيء من الذهب لنهي النبي عن تختم الذهب", en: "Muwatta 2648" }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: وأنا أكره أن يلبس الغلمان شيئا من الذهب، لأنه بلغني أن رسول الله نهى عن تختم الذهب، فأنا أكرهه للرجال الكبير منهم والصغير. ويذكر المحقق أن حديث النهي عن تختم الذهب في الصحيحين من حديث أبي هريرة. {cite:muwatta-maruf-1997 p.498} {cite:muwatta-maruf-1997 p.499}"
