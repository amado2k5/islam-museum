label: { ar: "الموطأ 70 — سعيد بن المسيب: الاستنجاء بالماء وضوء النساء", en: "Muwatta 70" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يُسأل عن الاستنجاء من الغائط بالماء فقال: إنما ذلك وضوء النساء؛ وهو في باب جامع الوضوء. ويرى المحقق أن سعيداً أراد أن الاستجمار بالحجارة يجزئ الرجل وأن الاستنجاء بالماء يتعين للنساء، ويذكر رواية ابن أبي شيبة عنه حين ذُكر له الاستنجاء بالماء: أنتم فعلتم ذلك، وإنما كانوا يجتزئون بالحجارة. {cite:muwatta-maruf-1997 p.72}"
