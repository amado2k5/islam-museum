label: { ar: "الموطأ 70 — سعيد بن المسيب: الاستنجاء بالماء وضوء النساء", en: "Muwatta 70", es: "Muwatta 70", fr: "Muwatta 70", ur: "موطا 70", tr: "El-Muvatta 70 — Sa’id ibn al-Musayyab: İstinja’ (ihtiyacı giderdikten sonra suyla yapılan ritüel temizlik), kadınların abdestidir.", id: "Al-Muwatta 70 — Sa’id ibn al-Musayyab: Istinja’ (pembersihan ritual setelah buang air besar) dengan air adalah wudhu bagi wanita" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يُسأل عن الاستنجاء من الغائط بالماء فقال: إنما ذلك وضوء النساء؛ وهو في باب جامع الوضوء. ويرى المحقق أن سعيداً أراد أن الاستجمار بالحجارة يجزئ الرجل وأن الاستنجاء بالماء يتعين للنساء، ويذكر رواية ابن أبي شيبة عنه حين ذُكر له الاستنجاء بالماء: أنتم فعلتم ذلك، وإنما كانوا يجتزئون بالحجارة. {cite:muwatta-maruf-1997 p.72}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği bir hadiste, Sa'id ibn al-Musayyab'a dışkılamadan sonra suyla temizlenmenin ne olduğu sorulduğunu ve onun da \"Bu sadece kadınların abdestidir\" diye cevap verdiğini belirtmektedir. Bu, abdestin genel kuralları bölümünde yer almaktadır. Araştırmacı, Sa'id'in erkekler için taşla temizlenmenin yeterli, kadınlar için ise suyla temizlenmenin farz olduğunu kastettiğine inanmaktadır. İbn Abi Şeybe'nin, suyla temizlenmeden bahsedildiğinde kendisine aktardığı şu sözü de zikrediyor: \"Sen öyle yaptın, ama onlar taşla temizlenmekle yetinirlerdi.\" {cite:muwatta-maruf-1997 s.72}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id menyatakan bahwa ia mendengar Sa'id ibn al-Musayyab ditanya tentang berwudhu setelah buang air besar dengan air. Beliau menjawab, \"Itu hanyalah wudhu bagi perempuan.\" Hal ini terdapat dalam bab tentang aturan umum wudhu. Peneliti tersebut meyakini bahwa Sa'id bermaksud bahwa berwudhu dengan batu sudah cukup bagi laki-laki, sedangkan berwudhu dengan air wajib bagi perempuan. Ia menyebutkan riwayat Ibnu Abi Shaybah atas otoritasnya ketika berwudhu dengan air disebutkan kepadanya: \"Anda melakukan itu, tetapi mereka biasa mencukupkan diri dengan batu.\" {cite:muwatta-maruf-1997 p.72}"
