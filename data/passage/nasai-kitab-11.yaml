summary:
  ar: "القسم 11 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الافتتاح»، ويضم فيها النصوص من 876 إلى 1028 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 11 of Sunan al-Nasa'i (The Book of the Commencement of the Prayer) in the division of the open hadith dataset the museum took its reports from: reports 876 to 1028 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 11، عنوان «کتاب الافتتاح»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 876 تا 1028۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 11 de Sunan al-Nasa'i (El Libro del Inicio de la Oración) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 876 al 1028, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre du début de la prière), dans la partie du recueil ouvert de hadiths dont il a tiré ses informations: les hadiths 876 à 1028 de cette numérotation. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
