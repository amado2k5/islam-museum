label: { ar: "سنن النسائي 977 — الأب والأبوة", en: "Sunan al-Nasa'i 977 — the father and fatherhood", ur: "سنن نسائی 977 — باپ اور والدیت", es: "Sunan al-Nasa'i 977 — El padre y la paternidad", fr: "Sunan al-Nasa'i 977 — le père et la paternité" }
text: "… بْنُ الْمُثَنَّى، قَالَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، قَالَ حَدَّثَنَا أَبَانُ بْنُ يَزِيدَ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ يَقْرَأُ فِي الظُّهْرِ وَالْعَصْرِ فِي الرَّكْعَتَيْنِ الأُولَيَيْنِ بِأُمِّ الْقُرْآنِ وَسُورَتَيْنِ وَفِي الأُخْرَيَيْنِ بِأُمِّ الْقُرْآنِ وَكَانَ يُسْمِعُنَا الآيَةَ أَحْيَانًا وَكَانَ يُطِيلُ أَوَّلَ رَكْعَةٍ مِنْ صَلاَةِ الظُّهْرِ."
summary:
  ar: "حديث في سنن النسائي، رقم 977، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 977 (The Book of the Commencement of the Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 977، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 977 (El Libro del Inicio de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 977 (Le Livre du Commencement de la Prière), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
