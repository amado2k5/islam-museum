text: "… مُحَمَّدُ بن عبدالرَّحْمَن بن ثَوْبَان، قَضَوا نَحِبَهُم ثُمَّتْ مَضَوا لِسَبِيلهمْ عن رجل له صحبة قال: قال رسول اللّٰه عله : حق على كل مسلم أن يغتسل يوم الجمعة وأن يَتَسؤَك، وَخُلِّفْتُ للبَلْوَى مَعَ المُتَغَبِّر وأن يَمَسّ من الطيب إن وجد …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 1466، يرد فيه ذكر ما وجب على كل مسلم، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 1466, whose wording mentions a duty laid on every Muslim, a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 1466 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Usd al-Ghaba de Ibn al-Athir, volume numérisé 2, p. 1466, dont le texte mentionne un devoir imposé à chaque musulman, un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
