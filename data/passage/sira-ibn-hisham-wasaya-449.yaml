text: "… عبدالله: أَنَّ رَجُلاً مِنْ بَنِي مُحَارِبٍ يُقَالُ لَهُ: غَوْرَثُ، قال لقومه من غَطَفَانَ وَمُحَارِبِ : أَلاَ أَقْتُلُ لكم محمَّداً؟! قالوا : بَلَىٰ!! وكيف تقتله؟! قال: أَفْتِكُ بِهِ، قال : فأقبل إلى رسول اللّٰه وَلُ وهو جالسٌ وَسَيْفُ رسولِ اللّهِ لِلَ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 449، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 449, that mentions a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
