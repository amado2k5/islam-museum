  نصب النزل لانه م-- دروأنزله غيره واستنزله بمعنى ونزله تنزيلا والتنزيل أيضا الترتيب ونزال
  مثال قطام بمعنى انزل وهومعدول عن المنازلة ولهذا أنته الشاعر ⁦(١)⁩ يقوله
  ولنعم حشو الدرع أنت اذا • دعيت نزال ولج فى الذعر
