  أمنزلتى مىّ سلام عليكم * هل الأزمن اللاتى مضين رواجع
  والمنزلة المرتسة لا تجمع واستنزل فلان أى حط عن مرقببه والنزل بضم الميم وفتح الزاى
  الانزال تقول أنزاى منزلا مباركا والمنزل بفتح الميم والزاى التزول وهو الحلول تقول نزات
