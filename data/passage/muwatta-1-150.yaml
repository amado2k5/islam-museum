label: { ar: "الموطأ 150 — عائشة: لا تعجلن حتى ترين القصة البيضاء", en: "Muwatta 150", es: "150 palabras", fr: "150 mots", ur: "150 الفاظ", tr: "Al-Muwatta 150 — Aişe: Beyaz akıntıyı görene kadar acele etmeyin.", id: "Al-Muwatta 150 — Aisyah: Jangan terburu-buru sampai kamu melihat keluarnya cairan putih." }
text: "لا تعجلن حتى ترين القصة البيضاء"
summary:
  ar: "أول أثر في باب طهر الحائض. يرويه يحيى عن مالك عن علقمة بن أبي علقمة عن أمه مولاة عائشة: كان النساء يبعثن إلى عائشة بالدرجة، وهي الخرقة فيها القطن، عليها الصفرة من دم الحيض، يسألنها عن الصلاة، فتقول لهن: لا تعجلن حتى ترين القصة البيضاء، تريد بذلك الطهر من الحيضة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير، وأن عبد الرزاق أخرجه عن معمر عن علقمة. {cite:muwatta-maruf-1997 p.104}"
  tr: "Adet kanamasından sonra temizlenme konusuyla ilgili ilk hadis. Yahya, Malik'ten, o da Alkame ibn Ebu Alkame'den, o da annesi, Ayşe'nin azatlı kölesinden rivayet etmiştir: Kadınlar Ayşe'ye üzerinde sarımsı adet kanı bulunan bir pamuk parçası gönderir ve namaz hakkında sorarlardı. Ayşe onlara, \"Beyaz akıntıyı görene kadar acele etmeyin\" derdi; bu, adet kanamasından temizlenmenin işaretidir. Araştırmacı, bu hadisin Malik'ten Ebu Musab, Suveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve Abd el-Razzaq'ın da Ma'mar'dan, o da Alkame'den rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.104}"
  id: "Hadits pertama tentang topik penyucian setelah haid. Diriwayatkan oleh Yahya dari Malik, dari Alqamah ibn Abi Alqamah, dari ibunya, seorang budak yang dibebaskan oleh Aisyah: Para wanita biasa mengirimkan kain kepada Aisyah—sepotong kapas dengan darah haid kekuningan di atasnya—untuk menanyakan tentang salat. Aisyah akan berkata kepada mereka, “Jangan terburu-buru sampai kalian melihat cairan putih,” yang berarti tanda penyucian setelah haid. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, dan bahwa Abd al-Razzaq meriwayatkannya dari Ma'mar, dari Alqamah. {cite:muwatta-maruf-1997 p.104}"
