text: "لا تعجلن حتى ترين القصة البيضاء"
summary:
  ar: "أول أثر في باب طهر الحائض. يرويه يحيى عن مالك عن علقمة بن أبي علقمة عن أمه مولاة عائشة: كان النساء يبعثن إلى عائشة بالدرجة، وهي الخرقة فيها القطن، عليها الصفرة من دم الحيض، يسألنها عن الصلاة، فتقول لهن: لا تعجلن حتى ترين القصة البيضاء، تريد بذلك الطهر من الحيضة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير، وأن عبد الرزاق أخرجه عن معمر عن علقمة. {cite:muwatta-maruf-1997 p.104}"
