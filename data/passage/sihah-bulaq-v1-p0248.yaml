text: |-
  ⁦(فصل الكاف)⁩
  ٣٩٣
  فان الكنر أعيانى قديما • ولم أقترلدن انى غلام
  بقال الحدلله على القل والكثر والقلّ والكثر والمكاثر المكاثرة وعدد كاثر أى كثير قال
  الاعشى • واست بالاكثر منهم حصى وانما العزة لمكاثر• وفلان يتكثر بمال غيره
  ابن السكيت فلان مكفور عليه اذا نفدماعنده وكثرت عليه الحقوق مثل منمود ومشفوه
  ومضغوف والكوثر من الربال السيد الكثير انخير قال الكميت
  وأنت كثير يا ابن مروان طيب • وكان أبوك ابن العقاتل كوثرا
  والمكوثر من الغبار الكثير وقد تكوثر قال الشاءر سان بن نشب
  وقد ثار نقع الموت حتى تكوثرا والكوثر نهر فى الجنة والكثار بالضم الكثير والكترجار
  التحل وبقال طلعها وفى الحديث لا قطع فى نرولا كثر وقدأ كثر النخل أى أطلع⁦( كدر)⁩
  الكدر خلاف الصفو وقد كدر الماء بالكسر يكدر كدرافهو كدروكدرأيضامثل فحذ
  ونفذوأنشداين الأعرابى لوكنت ما. كنت غير كدر وكدر الماء بالضم يكدر كدورة
  مشله وكذلك تكذ روكذره غيره تكديراويقال كدرعيش فلان وتكدرت، هيشته والكدر
  أيضامصدرالا كدروهو الذى فى لونه كدرة قال رؤية * أكدرلفاف عناد الروغ
  ويقال لحر الوحس بنات أكدرنسبت الى فيل والصكدرى ضرب من القطاوهو ثلاثة
  أضرب كدرى وجونى وغطاط فالكدرىّ الغسبر الالوان الرقس الظهور والبطون الصفر
  الحالوق وهو الطف من الجونى كانه نسب الى معظم القطا وهي كدروند كرالبساقيين
  فى موضّعهما والاكدرية مسئلة فى الفرائض وهى زوج وأمّ وجدوأخت لاب وأم
  والكديراء لبن حليب يتقع فيه تمروتكادرت العين فى الشئ اذا أدامت النظر اليه والكندر
  اللبان والكندر والسكتادر القصير المغليظ مع شدة ويوصف به الغليظمن -رالوحسْ قال الراجز
  كأن تحتى كندرا كتادرا * جابا قطوطا ينشبج المساحرا
  والكدر" بتشديد الراء الشاب" الحادر الشديدوا نكدراى أسرع وانقض وانكدرت النجوم
  ⁦( كرر)⁩ الكر بالنتح الحبل يصعديه على التخلة والسكتر أيضا واحد الاكراروهى التى تضيم بها
  الظلفتان وتدخل فيهما والكراً يضاحبل الشراع وجمعه كرور قال العجاج
  جذب الصراريين بالسكرور * وقال الفراء الكرار الاحساء واحدها كروكز قال الشاعر
  بهاقلب عادية وكرار» والسكرة المرة والجمع السكترات والكترتان القرتان وهما الغداة والعشى
  لغة حكاهايعقوب والكرة بالضم البعر العفن تجلى بذ الدروع قال النابغة
  علين بكديون وأبكن كزة * فهنّ وضاء صافيات الغلائل
  والسكرواحدأكرار الطعام وفرس مكتر بصلح للكتروالحلة والمكثر بالفتح موضع الحرب وكرار
  مثل قطام خرزة تؤخذبه انساء الاعراب تقول الساحرة ياكرار كزيه والمكركرة رحى زور
  البعير وهى احدى النفنات الجمس والكركرة أيضا الجاعة من التناس وأبو مالك عمرو
  ابن كركرة رجل من علماء اللغة والكرّ الرجوع بق ال كتره وكزبنفسه يتعدى ولا يتعدى والكوير
  صوت كصوت المخنوق تقول منه كز يكر بالكسر قال الشاعر
  يكزكرير البكرشد خناقه • ليقتلنى والمرليس بقتال
  ٩٩
