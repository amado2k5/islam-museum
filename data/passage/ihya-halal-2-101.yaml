text: "… على هدوانه والإعطاء إعانة. فالكاشف للغطاء فيه أن السؤال حرام فى الأصل، وإنما يباح بضرورة أو حاجة مهمة قريبة من الضرورة. فإن كان عنها بد فهو حرام. وإنما قلنا إن الأصل فيه التحريم لأنه لا ينفك عن ثلاثة أمور محرمة …"
summary:
