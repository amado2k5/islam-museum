  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 101, that mentions the unlawful, prohibition, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 2، ص 101 کا اقتباس جس میں حرام، تحریم، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
