label: { ar: "الموطأ 659 — مالك: السنة التي لا اختلاف فيها عندنا أن الزكاة تجب في عشرين ديناراً كما تجب في مئتي درهم", en: "Muwatta 659", es: "Muwatta 659", fr: "Muwatta 659", ur: "موطا 659", tr: "El-Muvatta 659 — Malik: Bizde yerleşik uygulama şudur ki, zekât yirmi dinar üzerinden de tıpkı iki yüz dirhem üzerinden olduğu gibi farzdır.", id: "Al-Muwatta 659 — Malik: Kebiasaan yang telah mapan di antara kita adalah bahwa zakat wajib dikenakan atas dua puluh dinar sebagaimana wajib dikenakan atas dua ratus dirham." }
summary:
  ar: "قول لمالك: السنة التي لا اختلاف فيها عندنا أن الزكاة تجب في عشرين ديناراً كما تجب في مئتي درهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.336}"
  tr: "Malik şöyle demiştir: Bizde yerleşik uygulama şudur ki, zekât yirmi dinar üzerinden de tıpkı iki yüz dirhem üzerinden olduğu gibi farzdır. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.336}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah zakat wajib dikenakan atas dua puluh dinar sebagaimana wajib dikenakan atas dua ratus dirham. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.336}"
