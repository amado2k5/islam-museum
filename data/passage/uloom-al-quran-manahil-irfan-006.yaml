text: "قرآن؛ لأنه إفساد للسورة، ومخالفة لما قصد بها، وتجاوز لما حد في كتابتها وتلاوتها، وليس يريد بذلك من قرأ القرآن من أسفل إلى فوق، ومن بدأ بآل عمران وثنى بالبقرة، وكيف يريدون ذلك وهم قد علموا اختلاف تأليف المصاحف، وأن"
