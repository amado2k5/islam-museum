text: "… مِهْران يعمل عمل الصبيان!. - حدثنا أبو أُسامة عن إسماعيل عن قيس قال: كان أبو عُبيد ابن مسعود عَبَر الفرات إلى مِهران، فقطعوا الجسر خلفه، فقتلوه هو وأصحابه، قال: فأوصى إلى عمر بن الخطاب، قال: فرثاه أبو مِحْجَن الثقفي فقال: …"
