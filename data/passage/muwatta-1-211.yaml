text: "صليت مع رسول الله العشاء فقرأ فيها بالتين والزيتون"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عدي بن ثابت الأنصاري عن البراء بن عازب، في باب القراءة في المغرب والعشاء: صلى البراء مع النبي العشاء فقرأ فيها بسورة التين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وقتيبة عند النسائي (2/173)، وأنه في الصحيحين من غير طريق مالك، ويحيل على تعليقه على الترمذي (310) والتمهيد (23/223). {cite:muwatta-maruf-1997 p.130}"
