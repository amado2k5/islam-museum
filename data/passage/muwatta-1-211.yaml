label: { ar: "الموطأ 211 — البراء: صليت معه العشاء فقرأ بالتين والزيتون", en: "Muwatta 211", es: "Muwatta 211", fr: "Muwatta 211", ur: "موطا 211", tr: "Muvatta 211 — Bera': Onunla birlikte yatsı namazını kıldım, o da Tin ve Zeytun surelerini okudu.", id: "Al-Muwatta 211 — Al-Bara’: Aku salat Isya bersamanya dan dia membacakan Surah At-Tin dan Surah Az-Zaytun" }
text: "صليت مع رسول الله العشاء فقرأ فيها بالتين والزيتون"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عدي بن ثابت الأنصاري عن البراء بن عازب، في باب القراءة في المغرب والعشاء: صلى البراء مع النبي العشاء فقرأ فيها بسورة التين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وقتيبة عند النسائي (2/173)، وأنه في الصحيحين من غير طريق مالك، ويحيل على تعليقه على الترمذي (310) والتمهيد (23/223). {cite:muwatta-maruf-1997 p.130}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Adi ibn Sabit el-Ensari'den, o da el-Bara' ibn Azib'den rivayetle, akşam ve yatsı namazlarında okuma bölümünde şöyle nakletmiştir: El-Bara', Peygamberimizle birlikte yatsı namazını kılmış ve bu namazda Tein Suresi'ni okumuştur. Editör, bunun Malik'ten rivayetle Ebu Mus'ab, Suveyd, el-Ka'nebi ve Kuteybe tarafından En-Nasa'i'nin derlemesinde (2/173) nakledildiğini ve iki Sahih'te (Buhari ve Müslim) Malik'inkinden farklı rivayet zincirleriyle geçtiğini belirtmektedir. Tirmizi (310) ve Temhid (23/223) üzerine yaptığı tefsirine atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.130}"
  id: "Diriwayatkan oleh Malik dari Yahya ibn Sa'id, dari 'Adi ibn Thabit al-Ansari, dari al-Bara' ibn 'Azib, dalam bab tentang bacaan shalat Maghrib dan Isya': Al-Bara' shalat Isya' bersama Nabi, dan beliau membaca Surah At-Tin di dalamnya. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, al-Qa'nabi, dan Qutaybah dalam kumpulan An-Nasa'i (2/173), dan bahwa hadits ini terdapat dalam dua kitab Sahih (Bukhari dan Muslim) melalui sanad selain Malik. Beliau merujuk pada komentarnya tentang At-Tirmidhi (310) dan At-Tamhid (23/223). {cite:muwatta-maruf-1997 p.130}"
