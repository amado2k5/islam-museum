summary:
  ar: "القسم 32 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب القدر عن رسول الله»، ويضم فيها النصوص من 2133 إلى 2298 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 32 of Jami' al-Tirmidhi (Chapters On Al-Qadar) in the division of the open hadith dataset the museum took its reports from: reports 2133 to 2298 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 32، عنوان «کتاب القدر عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2133 تا 2298۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 32 de Jami' al-Tirmidhi (Capítulos sobre Al-Qadar) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2133 al 2298, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 32 de Jami' al-Tirmidhi (Chapitres sur Al-Qadar), correspondant aux hadiths 2133 à 2298 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 32. bölümü, \"Allah'ın Elçisinden Kader Kitabı\" başlığını taşımakta olup, sırasıyla 2133'ten 2298'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 32 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Takdir dari Rasulullah\" dan berisi teks 2133 hingga 2298, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
