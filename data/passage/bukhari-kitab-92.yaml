summary:
  ar: "القسم 92 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفتن»، ويضم فيها النصوص من 7048 إلى 7136 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 92 of Sahih al-Bukhari (Afflictions and the End of the World) in the division of the open hadith dataset the museum took its reports from: reports 7048 to 7136 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 92، عنوان «کتاب الفتن»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7048 تا 7136۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 92 de Sahih al-Bukhari (Aflicciones y el fin del mundo) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 7048 a 7136 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
