text: "عنده يصلحُ للطهر والحيض، وقال أبو عمرو بن العلاء: القرء الوقت، وهو يصلُح للحيض، ويصلح للطهر، وإذا كانت هذه نصوص أهل اللغة، فكيف يحتجون بقولهم: إن الأقراء الحيض؟ قولكم: إن من جعله الطهر، فإنه يُريد أوقاتَ الطهر التي يحتوشها الدم، …"
