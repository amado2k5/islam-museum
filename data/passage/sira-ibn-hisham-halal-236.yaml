text: "… نقيبَهُمْ خَبَرُ الأذانِ قال ابن إسحاق: فلما اطمأنّ رسُولُ اللّٰه وَلله بالمدينةِ، واجْتَمَعَ إليه إخوانُهُ مِنَ المُهاجرين، واجْتَمَعَ أمرُ الأنصارِ؛ اسْتَحْكَمَ أمْرُ الإِسلامِ، فقامتِ الصلاةُ، وفُرِضَت الزكاةُ والصيامُ، وقامتِ الحدودُ، وفُرض الحلالُ والحرامُ، وتبوأ الإِسلامُ بين أظهُرِهِمْ، وَكَانَ هذا الحيُّ …"
