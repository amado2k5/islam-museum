text: "… اللّٰه بن عمرو بن العاص، به. وأخرجه : الطيالسي، وأحمد، ومسلم، وابن حبان من طرق عن جابر بن عبد اللّٰه، به.، وإذا حسُنَ الإسلامُ اقتضى ترك ما لا يعني كله من المحرمات والمشتبهات والمكروهات، وفضول المباحات التي لا يحتاج سقطت …"
summary:
