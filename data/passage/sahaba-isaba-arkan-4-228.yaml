text: "الهند كعب الأحبار أنس بن مالك أن الرُّبيع بنت النضر عمته لطمت إنسانًا... عمر إن الزبير ركن من أركان الدين أن الزبير كان بالشام لما هاجر النبى وَا يعم عبدِ اللهِ بنِ مصعب أن الزبيرَ كنَتْه أمُّه صفيةُ أبا الطاهرِ …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 4، ص 228، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 4, p. 228, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 4، ص 228 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 4, pág. 228, que menciona los pilares del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 4, page 228), mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 4. cildinin 228. sayfasından, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 4, halaman 228, yang menyebutkan rukun Islam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
