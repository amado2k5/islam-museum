label: { ar: "الموطأ 1644 — مالك: ذكر الله حكم الذين يرمون أزواجهم ولا شهداء لهم إلا أنفسهم، بأربع شهادات ثم الخامسة في اللعن والغضب", en: "Muwatta 1644" }
summary:
  ar: "يقول مالك قال الله تبارك وتعالى في الذين يرمون أزواجهم ولم يكن لهم شهداء إلا أنفسهم، فشهادة أحدهم أربع شهادات بالله، ثم الخامسة في اللعن إن كان من الكاذبين، ويدرأ عنها العذاب أن تشهد أربع شهادات، ثم الخامسة في الغضب إن كان من الصادقين. ويستشهد بآيات سورة النور. {cite:muwatta-maruf-1997 p.78}"
