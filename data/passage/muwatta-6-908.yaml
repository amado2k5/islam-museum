label: { ar: "الموطأ 908 — ابن عمر: نهى رسول الله أن يلبس المحرم ثوباً مصبوغاً بزعفران أو ورس، ومن لم يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين", en: "Muwatta 908", es: "Muwatta 908", fr: "Muwatta 908", ur: "موطا 908", tr: "El-Muvatta 908 — İbn Ömer: Allah'ın Resulü, ihramlı hacıların safran veya aspir çiçeği ile boyanmış bir elbise giymelerini yasaklamıştır. Sandalet bulamayanlar ise deri çorap giyip bileklerinin altından kesmelidirler.", id: "Al-Muwatta 908 — Ibn Umar: Rasulullah SAW melarang jamaah haji yang sedang ihram mengenakan pakaian yang dicelup dengan kunyit atau bunga safflower. Dan barang siapa yang tidak dapat menemukan sandal, hendaklah ia mengenakan kaus kaki kulit dan memotongnya di bawah mata kaki." }
text: "نهى رسول الله أن يلبس المحرم ثوباً مصبوغاً بزعفران أو ورس"
summary:
  ar: "أول حديث في باب لبس الثياب المصبغة في الإحرام. يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أنه قال: نهى رسول الله أن يلبس المحرم ثوباً مصبوغاً بزعفران أو ورس، وقال: من لم يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن ماجة وابن حبان، وسويد، والقعنبي عند أبي داود (1824)، والتنيسي عند البخاري (5852)، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم. {cite:muwatta-maruf-1997 p.438}"
  id: "Hadits pertama dalam bab ini tentang mengenakan pakaian berwarna saat ihram. Diriwayatkan oleh Malik dari Abdullah ibn Dinar dari Abdullah ibn Umar, yang berkata: Rasulullah shalla Allahu alaihi wa sallam melarang seorang jamaah haji yang sedang ihram mengenakan pakaian yang diwarnai dengan safron atau bunga safflower. Beliau juga bersabda: Barangsiapa yang tidak dapat menemukan sandal, hendaklah ia mengenakan kaus kaki kulit dan memotongnya di bawah mata kaki. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, dan dari sanadnya oleh Ibn Majah, Ibn Hibban, Suwaid, al-Qa'nabi dalam Abu Dawud (1824), al-Tunisi dalam al-Bukhari (5852), al-Shafi'i, dan Yahya ibn Yahya al-Naysaburi dalam Muslim. {cite:muwatta-maruf-1997 p.438}"
