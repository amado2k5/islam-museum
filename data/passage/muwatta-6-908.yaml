label: { ar: "الموطأ 908 — ابن عمر: نهى رسول الله أن يلبس المحرم ثوباً مصبوغاً بزعفران أو ورس، ومن لم يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين", en: "Muwatta 908" }
text: "نهى رسول الله أن يلبس المحرم ثوباً مصبوغاً بزعفران أو ورس"
summary:
  ar: "أول حديث في باب لبس الثياب المصبغة في الإحرام. يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أنه قال: نهى رسول الله أن يلبس المحرم ثوباً مصبوغاً بزعفران أو ورس، وقال: من لم يجد نعلين فليلبس خفين وليقطعهما أسفل من الكعبين. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن ماجة وابن حبان، وسويد، والقعنبي عند أبي داود (1824)، والتنيسي عند البخاري (5852)، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم. {cite:muwatta-maruf-1997 p.438}"
