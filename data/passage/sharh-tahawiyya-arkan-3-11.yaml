text: "… أعظم أركان الإيمان بعد الإيمان بالله ال، والإيمان بالنبي اليفي أنه رسول لابدّ فيه من العمل. الإيمان باليوم الآخر، وأن اللّه يحاسب العباد فيجزي المحسن بإحسانه. والمسيء بإساءته، هذا يَبْعَثُ على العمل في أن يتقي السوء ويعمل بالخير. الإيمان بالقدر …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 3، ص 11، يذكر أركان الإيمان، والإيمان بالقدر، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 3, p. 11, that mentions the pillars of faith, belief in the decree, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 3، ص 11 کا اقتباس جس میں ارکانِ ایمان، تقدیر پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 3, pág. 11, que menciona los pilares de la fe, la creencia en el decreto, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 3, p. 11), mentionnant les piliers de la foi, la croyance au décret (un des articles de foi). Extrait du scan automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in, Tahavi'nin akidesine dair açıklamasından (resimli cilt 3, sayfa 11) bir alıntı; imanın esasları, kader inancı ve imanın esaslarından birini içermektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari penjelasan Ibn Abi al-Izz tentang Akidah al-Tahawi, jilid bergambar 3, halaman 11, yang menyebutkan rukun iman, kepercayaan pada takdir, dan salah satu rukun iman; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
