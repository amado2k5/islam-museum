text: "… من النَّظَر في الكتاب ببيانِ ألفاظِه أولًا، وهذا هو علم التَّفسير. ثم بإسناد نَقْلِه وروايتِه إلى النبيِّ الذي جاءَ به من عندِ اللّٰه واختلافِ روايات القُرّاء في قراءته، وهو: علم القراءات. ثم بإسناد السُّنّة إلى صاحبها والكلام في الرُّواة الناقلينَ …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 125، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 125, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 125 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen 1, pág. 125, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Kashf al-Zunun de Hajji Khalifa, volume 1 numérisé, page 125, mentionne les lectures du Coran et les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin resimli 1. cildinin 125. sayfasından, Kur'an okunuşlarını ve okuyucularını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Kashf al-Zunun karya Haji Khalifa, jilid 1 bergambar, halaman 125, yang menyebutkan bacaan Al-Qur'an dan para qarinya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
