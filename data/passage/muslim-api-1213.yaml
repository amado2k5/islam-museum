label: { ar: "صحيح مسلم 1213 — تربية الأب ووصيته", en: "Sahih Muslim 1213 — the father raising and counselling", ur: "صحیح مسلم 1213 — باپ کی تربیت اور نصیحت", es: "Sahih Muslim 1213 — La crianza y el consejo del padre", fr: "Sahih Muslim 1213 — L'éducation et les conseils du père", tr: "Sahih Muslim 1213 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sahih Muslim 1213 — Didikan dan Wasiat Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، عَنْ عُثْمَانَ بْنِ أَبِي سُلَيْمَانَ، وَابْنِ، عَجْلاَنَ سَمِعَا عَامِرَ بْنَ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، يُحَدِّثُ عَنْ عَمْرِو بْنِ سُلَيْمٍ الزُّرَقِيِّ، عَنْ أَبِي قَتَادَةَ الأَنْصَارِيِّ، قَالَ رَأَيْتُ النَّبِيَّ يَؤُمُّ النَّاسَ وَأُمَامَةُ بِنْتُ أَبِي الْعَاصِ وَهْىَ ابْنَةُ زَيْنَبَ بِنْتِ النَّبِيِّ عَلَى عَاتِقِهِ فَإِذَا رَكَعَ وَضَعَهَا وَإِذَا رَفَعَ مِنَ السُّجُودِ أَعَادَهَا."
summary:
  ar: "حديث في صحيح مسلم، رقم 1213، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1213 (The Book of Mosques and Places of Prayer), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1213، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 1213 (El Libro de las Mezquitas y Lugares de Oración), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 1213 (Livre des mosquées et des lieux de prière), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih Müslim'de 1213 numaralı hadis, babanın yetiştirilmesi ve öğütlerinden bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 1213, menyebutkan tentang didikan dan nasihat seorang ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
