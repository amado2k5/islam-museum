text: "… من العيش مزهودة، فأولتك الذين أجلسهم على كراسى ألباق أهل المعرفة بالأدواء والنظر فى منابت الدواء، نجمل تلامدً بهم أهل الورع والبصر، فقال لهم : إن أتا كم عليل من فقدى فداووه، أو مريض من تذكرى فأدنوه، أو نأس لنعمتى …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 337، يذكر المرض والمريض، والدواء، والداء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 8, p. 337, that mentions illness and the sick, the drug, the disease and its remedy, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 8، ص 337 کا اقتباس جس میں بیماری اور بیمار، دوا، بیماری، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 8, pág. 337, que menciona la enfermedad y los enfermos, el medicamento, la enfermedad y su remedio, la búsqueda de tratamiento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 8, p. 337, qui mentionne la maladie et les malades, le médicament, la maladie et son remède, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 8. cildinin 337. sayfasından, hastalık, hasta kişi, ilaç, rahatsızlık ve tedaviye dair bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 8, hlm. 337, yang menyebutkan penyakit, orang sakit, obat-obatan, penyakit, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
