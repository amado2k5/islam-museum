label: { ar: "نوادر جحا الكبرى، ص 187 — «من ضغط القبر»", en: "Nawadir Juha al-Kubra, p. 187 — 'From the Pressure of the Grave'", ur: "نوادر جحا الکبریٰ، ص 187 — «قبر کے دباؤ سے»", fr: "Nawadir Juha al-Kubra, p. 187 — « De la pression de la tombe »", es: "Nawadir Juha al-Kubra, p. 187 — «Por la presión de la tumba»", tr: "Juha'nın Büyük Fıkraları, s. 187 — “Mezarın Baskısından”", id: "Anekdot-Anekdot Hebat Juha, hlm. 187 — “Dari Tekanan Kubur”" }
text: "… من ضغط القبر مرّ جحا بجنازة، فقالوا له: صلِّ على هذا الغريبِ الفقير. فصلَّى، فلمَّا رفع يديهِ أفْلَتَ صَوْتاً، فالتفت إليهم وقال: إنْ كان على صاحبِكم دَينٌ، فأقضُوهُ فهذا من ضغط القبر. اقلبوه أمره أبوهُ أن يُصلح جُبّاً، ويضع له …"
summary:
  ar: "في جنازة أطلق جحا ريحاً بصوت عال حين رفع يديه للدعاء، فقال للمشيعين إنه إن كان على الميت دين فليسددوه، فهذا ضغط القبر. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  en: "At a funeral, when Juha raises his hands to pray he lets out a loud fart; he tells the mourners that if the dead man owed money, they should pay it, since this is the pressure of the grave. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  ur: "ایک جنازے میں جب جحا نے دعا کے لیے ہاتھ اٹھائے تو اس سے زور سے ہوا خارج ہو گئی، تو اس نے تعزیت کرنے والوں سے کہا کہ اگر میت پر قرض تھا تو اسے ادا کر دو، کیونکہ یہ قبر کا دباؤ ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  fr: "À des funérailles, lorsque Juha lève les mains pour prier, il lâche un pet sonore ; il dit aux personnes en deuil que si le défunt avait des dettes, elles doivent les payer, car c'est la pression de la tombe. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  es: "En un funeral, cuando Juha levanta las manos para rezar, suelta un pedo sonoro; dice a los dolientes que si el difunto tenía deudas, deben pagarlas, pues esta es la presión de la tumba. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  tr: "Bir cenaze töreninde Juha, ellerini dua eder gibi kaldırırken yüksek sesle osurdu. Ardından yas tutanlara, ölen kişinin herhangi bir borcu varsa bunları ödemeleri gerektiğini, çünkü bunun mezarın ağırlığı olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 187}"
  id: "Di sebuah pemakaman, Juha kentut dengan keras sambil mengangkat tangannya berdoa. Kemudian dia memberi tahu para pelayat bahwa jika almarhum memiliki hutang, mereka harus melunasinya, karena ini adalah tekanan dari kubur. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
