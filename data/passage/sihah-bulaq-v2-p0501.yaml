text: |-
  ٨٦
  •⁦(باب القاف)⁩*
  = •⁦(روق )⁩ .
  أى قلة والرقاق بالضم الخبز الرقيق قال ثعلب بقال عندى غلام يخبز الغليظ والرقيق فان قلت
  يخبز الجردق قلت والرقاق لانهما اسمان والرقيق نقيض الفليظ والثخين وقدرق الشئء يرق رقة
  قوله وفى المثل الخ فى القاموس
  تزل جابان بقوم فأضافوه وغبة وه
  وأرقه ورققه وترقيق الكلام تحسينه وفى المثل أعن صبوح ترقق وترققت له اذارق له قلبك
  واسترق الشئء نقيض استغلظ واستزق عملوكه وأرقه وهونقيض أعمقه والرقيق المملوكْ واحد
  فما فرغ قال اذا هيجتمونى كيف
  وجع وهراق البطن مارق منه ولان ولا واحدله وترقرق الشئ تلألا ولمسع ورقراق
  آخذ فى طريقى فقيل له أعن صبوح
  السراب ماثلاً لأمنه أى جاء وذهب وكل شئله تلا لؤفهور قراق ورقرقت الماءقترقرق
  ترقق أى تكن اه كتبه معمه
  أى جاء وذهب وكذلك الدمع اذا دارفى الهلاق قال الاعشى
  وتبرد بردرداء العرو • س فى الصيف رقرقت فيه العبيرا
  ⁦( رمق)⁩ رمقته أرمقه رمقانظرت اليه ورمق ترميقا أدام النظر مثل رتق والرمق بقية
  الروح ويقال هذه النخلة ترامق بعرق لا تحيا ولاتموت والمرامق الذى لم يبق فى قلبه من
  مودقك الاقليل قال الراجز
  وصاحب مرامق داجيته • دهنته بالدهن أو طليته * على بلال نفسه طويته
  وما فى عيش فلان الارمقة ورماق أى بلغة وحبل أرماق أى ضعيف وقدارماق الحبل
  ارميقاقا وارمقّ الامرار مقاقا أى ضعف وعيش مرمق أى دون ومنه قول الكميت
  تعالج مرمقامن العيس فانيا * له حارك" لايحمل العب أجزل
  وعيش رمق أى يمسك الرمق والرمق القطيع من الغنم فارسى معرّب وتمّق الرجل الماءاذا
  حساه ورامقت الامر اذالم تبرمه قال العجاج
  والامر مارامقته ملهوجا • يضويك مالم تجن منه منخا
  ⁦( رفق)⁩ ماءرنق بالتسكين أى كدر والرنق بالتحريك.صدرقولك رئق ألماء بالكسر وأرنتته
  أناورفقته ترنيقا أى كدرته وعيس رئق أى كدر قال أبو عبيد التروق الطين الذى فى الانهار
  والمسيل ورزق الطائراذاخفق يبناحيه فى الهواء وثيت ولم يطر قال الراجز
  وتحت كل خافق مى نق * من طي كل متى عشنق
  ورزق النوم أى خااط عينيه والترنيق ضعف يكون فى البصروفى البدن وفى الامر يقال رأق
  القوم فى أمر كذا أى خلطوا الرأى ولقيت فلانامر نقة عيناه أى منكسر الطارف من جوع
  أوغيره والترنيق ادامة النظرافة فى الترميق والتدنيق يقال رمّدت المعزى فرنق رئق أى انتظر
  الولادة لانهاترنى ولا تضع الابع-دمدة وربماقانوه بالميم وبالدال أيضا ورئو القوم بالمكان
  قوله وريق شبابه وريق شبابه
  الاولى :فتح فسكون والثانية
  ككيس وأصلدريوق كافى
  القاموس اجتمعت الواو والساء
  وسبقت احداهما بالسكون
  قلبت الواوياء وأدغمت فى الياء
  كافى سيد إه مجحه
  اذا أفاموابه واحتبواورونق السيف ماؤه وحسنه ومنه رونق الضحى وغيرها( وق
  الروق القرن والهع أرواق ومضى روق من الليل أى طائفة والروق أيضاوالرواق سقف فى
  مقدم البيت وثلاثة أروقة والكثير ووق ويقال فعله فى روق شبابه وريق شبابه وريق شبابه
  أى فى أوله وريق كل شى أفضل وهو فيعل فأدغم ويقال أكل فلان روقه اذا طال عمره حتى
  تتحات أسنانه والأرواق الفساطيطيقال ضرب ذلان روقه بموضع كذا اذا نزل به وضرب
  خيمته وفى الحديث حين ضرب الشيطان روقه ومدّأطنابه ويقال ألتى فلان عليك أرواقه
  وشراشره وهو أن تحبه حياشديدا ويقسال أيضا ألقى أرواقه اذا عدا واشتدعدوه حكاه أبو
