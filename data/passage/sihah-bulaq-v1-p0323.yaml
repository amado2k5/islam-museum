text: |-
  ٣١٨
  ذهب كما ذهب آمس الدابر ومنه قوله تعالى والليل اذادبرأى تسع النهارقيله وقرى
  أدبر قال صخرين عمروبن الشريد السلمى
  ولقد قتلتكم ثناءوم وحدا * وتركت حرة مثل أمس الدابر
  ويروى المدبر ويقال قيح اللّٰه ماقبل منه وماد برودبر الرحل ولى وشيخ ودبرت المسديث عن
  فلان حدثت به عنه بعدموته وديرت الريح أى تحوّات دبورا ودبرموضع بالهن ومنه فلان
  الدبرى ودبرالوم على مالم يسم فاعلد فهم مدبورون اذا أصابتهم ديح الدبور وأدبروا أى
  والا فتب النرر الدك ل المرل واير لو نا ا الاس الخ الف
  الاستقبال والتدبير فى الامران تنظار الى ما يؤول البه عاقبته والتدبر التفسكر فيه والتدبير
  عتق العبد عن دبر وهوأن يعتق بعدموت صاحبه فهو مدير قال الاصمعى دبرت الحديث
  اذا حدثت به عن غيركْوهويدبرحديث فلان أى يرويه وتدابر القوم أى تقاطعوا وفى
  الحديث لاتدابروا ر) الدئر بالفت المال الكثير يقال مال دثرومالان دئر
  وأموال دثروعسكرد ترأى كثير وهو من الاوّل الا أنه جاء بالتصريك والدثار كل ما كان من
  المياب فوق الشعار وقد تدثرأى تلفف فى الدثار وتدثر الفحل الناقة أى تسخها وتدثر الرجل
  فرسه اذاوثب عليه فركبه والدثور الدروس وقددثر الرسم وتدائر والدنورالرج-ل الخامل
  النؤوم ودثر الطائرتدنيرا أصلح عنه (⁦(لجر)⁩ الدجران النشيط الذى فيه مع نشاطه أشر
  ويقال حيران دجران وقد دبر بالكسرد جراوقوم دجارى قان العجاج دجران لايشعر من
  حيث أتى والديجورااظلام وليلة ديجور مظلمة ⁦(دحر )⁩ الدحور الطرد والابعاد
  وقد دحره قال اللّٰه تعالى اخرج منها مذ ؤمامد حورا أى مقصى ( دخر الدخور الصغار
  والذل يقال دخر الرجل بالفتح فهوداخر وأدخره غيره ⁦(دخدر)⁩ الدخدارتوب
  أبيض مدون فارسى معرّب أى يسكه التخت أى ذوتخت قال السكميت يصف مهابا
  تجلو البوارق عنه صفح دخدار رر الدر اللبن يقال فى الذم لادردره أى لا كثر
  خيره ويقال فى المدح لله دره أى عله ولله درك من رجل وناقة درور أى كثيرة اللين ودار
  أيضاونوق درّارمثل كافروكفار. وقال
  كان ابن أسماء يعشوه ويصبحه * من هجمة كفسيل الفخل درار
  وفرس درير أى سريع قال امر ؤالقيس
  درير كحذ روف الوليد أمره • تتابع كفيه بخيطا موصل
  والدرة اللؤلؤة والجمع دررودرات وأنشد أبوزيد
  كانهادرة -ضاءمنعمة * فى نسوة كنة لهادررا
  والنكوكب الدرىّ الماقب المضى نسب الى الدرابياضه وة-د تكسر الدال فيقال درى
  مثل سخرى و"نجرة ولجى ولجى والدرة بالكسر التى يضرب بها والدرة أيضا كثرة اللبين
  وسيلانه وللساق درة أى استدرار للجرى وللسوق درة أى نفاق عن أبى زيد وللسيهاب
  درة أى صب والجمع درر قال النمر بن تولب
  سلام
