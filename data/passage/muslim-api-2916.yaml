text: "وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا وَكِيعٌ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - قَالَتْ خَرَجْنَا مَعَ رَسُولِ اللَّهِ مُوَافِينَ لِهِلاَلِ ذِي الْحِجَّةِ مِنَّا مَنْ أَهَلَّ بِعُمْرَةٍ وَمِنَّا مَنْ أَهَلَّ بِحَجَّةٍ وَعُمْرَةٍ وَمِنَّا مَنْ أَهَلَّ بِحَجَّةٍ فَكُنْتُ فِيمَنْ أَهَلَّ بِعُمْرَةٍ. وَسَاقَ الْحَدِيثَ بِنَحْوِ حَدِيثِهِمَا وَقَالَ فِيهِ قَالَ عُرْوَةُ فِي ذَلِكَ إِنَّهُ قَضَى اللَّهُ حَجَّهَا وَعُمْرَتَهَا. قَالَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2916، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2916 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2916، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
