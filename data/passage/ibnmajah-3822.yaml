label:
  ar: "ابن ماجه 3822 — أنا عند ظن عبدي بي وأنا معه إذا ذكرني"
  en: "Ibn Majah 3822 — I am as My servant thinks of Me, and I am with him when he remembers Me"
  ur: "ابن ماجہ 3822 — میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں"
text: "يقول الله سبحانه أنا عند ظن عبدي بي وأنا معه حين يذكرني فإن ذكرني في نفسه ذكرته في نفسي وإن ذكرني في ملإ ذكرته في ملإ خير منهم وإن اقترب إلى شبرا اقتربت إليه ذراعا وإن أتاني يمشي أتيته هرولة …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3822: أنا عند ظن عبدي بي وأنا معه إذا ذكرني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3822: I am as My servant thinks of Me, and I am with him when he remembers Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3822: میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
