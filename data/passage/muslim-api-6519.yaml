label: { ar: "صحيح مسلم — الرحم معلقة بالعرش", en: "Sahih Muslim — Kinship suspended from the Throne", ur: "صحیح مسلم — رشتہ عرش سے لٹکا ہوا", es: "Sahih Muslim — El parentesco suspendido del trono", fr: "Sahih Muslim — La parenté suspendue du trône" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَزُهَيْرُ بْنُ حَرْبٍ، - وَاللَّفْظُ لأَبِي بَكْرٍ - قَالاَ حَدَّثَنَا وَكِيعٌ، عَنْ مُعَاوِيَةَ بْنِ أَبِي مُزَرِّدٍ، عَنْ يَزِيدَ بْنِ رُومَانَ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ الرَّحِمُ مُعَلَّقَةٌ بِالْعَرْشِ تَقُولُ مَنْ وَصَلَنِي وَصَلَهُ اللَّهُ وَمَنْ قَطَعَنِي قَطَعَهُ اللَّهُ ‏\"‏ ‏.‏"
summary:
  ar: "قال: الرحم معلقة بالعرش تقول من وصلني وصله الله ومن قطعني قطعه الله."
  en: "«Kinship is suspended from the Throne, saying: whoever joins me, God joins him; whoever severs me, God severs him.»"
  ur: "«رشتہ عرش سے لٹکا ہوا کہتا ہے: جو مجھے جوڑے اللہ اسے جوڑے، جو مجھے کاٹے اللہ اسے کاٹے۔»"
  es: "«El parentesco se suspende del Trono, diciendo: quien se une a mí, Dios se une a él; quien se separa de mí, Dios se separa de él.»"
  fr: "«La parenté est suspendue au Trône, disant: celui qui me rejoint, Dieu le rejoint; celui qui me quitte, Dieu le quitte.»"
