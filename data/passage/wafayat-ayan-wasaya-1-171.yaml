text: "… حلب، والملك العادل لا ينصفه ويقدم عليه غيره، وكان صلاح الدين قد مرض على حصار الموصل وحمل إلى حران وأشفى على الهلاك، فلما عوفي رجع إلى الشام، واجتمعا في المسير، قال له وكان صلاح الدين، قد أوصى لكل واحد من …"
