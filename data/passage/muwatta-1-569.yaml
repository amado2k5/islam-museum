text: "يستجاب لأحدكم ما لم يعجل، فيقول: قد دعوت فلم يستجب لي"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي عبيد مولى ابن أزهر عن أبي هريرة، أن النبي أخبر أن الداعي يستجاب له ما لم يستعجل فيقول: قد دعوت فلم يستجب لي. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان، وإسحاق بن سليمان عند ابن ماجة (3853)، والقعنبي عند أبي داود (1484)، والتنيسي عند البخاري (6340)، ومعن عند الترمذي (3387)، ويحيى بن يحيى النيسابوري عند مسلم (8/87). {cite:muwatta-maruf-1997 p.292} {cite:muwatta-maruf-1997 p.293}"
