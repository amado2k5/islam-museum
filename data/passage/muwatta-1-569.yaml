label: { ar: "الموطأ 569 — يستجاب لأحدكم ما لم يعجل فيقول: قد دعوت فلم يستجب لي", en: "Muwatta 569", es: "Muwatta 569", fr: "Muwatta 569", ur: "موطا 569", tr: "El-Muvatta 569 — Sizden birinin duası, sabırsızlanıp, “Namaz kıldım ama duam kabul olmadı” demediği sürece kabul olacaktır.", id: "Al-Muwatta 569 — Doa salah seorang di antara kalian akan dikabulkan selama ia tidak menjadi tidak sabar dan berkata: Aku sudah berdoa tetapi doaku tidak dikabulkan" }
text: "يستجاب لأحدكم ما لم يعجل، فيقول: قد دعوت فلم يستجب لي"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي عبيد مولى ابن أزهر عن أبي هريرة، أن النبي أخبر أن الداعي يستجاب له ما لم يستعجل فيقول: قد دعوت فلم يستجب لي. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان، وإسحاق بن سليمان عند ابن ماجة (3853)، والقعنبي عند أبي داود (1484)، والتنيسي عند البخاري (6340)، ومعن عند الترمذي (3387)، ويحيى بن يحيى النيسابوري عند مسلم (8/87). {cite:muwatta-maruf-1997 p.292} {cite:muwatta-maruf-1997 p.293}"
  id: "Diriwayatkan oleh Malik dari Ibnu Shihab, dari Abu Ubayd, budak yang dibebaskan oleh Ibnu Azhar, dari Abu Hurairah, bahwa Nabi (shalawat dan salam kepadanya) bersabda bahwa doa orang yang berdoa akan dikabulkan selama ia tidak menjadi tidak sabar dan berkata, \"Aku telah berdoa, tetapi belum dikabulkan.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan dari sanadnya oleh Ibnu Hibban, dan oleh Ishaq ibn Sulayman dalam Ibnu Majah (3853), dan oleh al-Qa'nabi dalam Abu Dawud (1484), dan oleh al-Tunisi dalam al-Bukhari (6340), dan oleh Ma'n dalam al-Tirmidhi (3387), dan oleh Yahya ibn Yahya al-Naysaburi dalam Muslim (8/87). {kutip:muwatta-maruf-1997 hal.292} {kutip:muwatta-maruf-1997 hal.293}"
