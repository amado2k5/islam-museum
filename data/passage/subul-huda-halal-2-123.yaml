text: "… ما رُوْيِ من اللحم، وإذا جوله جِيَف، فجعلوا بُقْبِلون على الجِيَف يأكلون منها ويَدَعُونَ اللحم. فقال : من هولاء يا جبريل ؟ قال : هؤلاء الزنَاة يُحِدّون ما حَرَّم اللّٰه عليهم ويتركون ما أَحَلَّ اللّٰه لهم. ثم مضى هنيهة فإذا …"
