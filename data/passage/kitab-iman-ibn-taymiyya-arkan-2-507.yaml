text: "الحديث الإسلام أن تشهد أن لا إله إلا اللّه...... الإشراك بالله وعقوق الوالدين........ الإيمان بضع وتسعون شعبة.......... الإيمان بضع وسبعون أعلاها شهادة أن لا إله إلا اللّٰه....... الإيمان بضع وسبعون شعبة......... الإيمان بضع وستون..... الإيمان بالله قال: ثم ماذا قال: …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 2، ص 507، يذكر تعريف الإسلام بأعماله، والإيمان بضع وسبعون شعبة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 2, p. 507, that mentions Islam defined by its acts, faith as seventy-odd branches, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 2، ص 507 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 2, pág. 507, que menciona el Islam definido por sus actos, la fe como setenta y tantos pilares, uno de los artículos de fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Pilares de la Fe lo incluye."
  fr: "Un extrait du Kitab al-Iman d'Ibn Taymiyya (tome 2, p. 507) mentionne que l'islam est défini par ses actes, la foi étant divisée en soixante-dix branches, un des articles de foi. Cet extrait provient d'une numérisation automatique et est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 2. cildinin 507. sayfasından bir alıntı, İslam'ı amelleriyle tanımlar, imanın yetmişten fazla dalı olduğunu ve imanın rükünlerinden birini belirtir. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 2, halaman 507, mendefinisikan Islam melalui perbuatannya, iman yang memiliki lebih dari tujuh puluh cabang, dan salah satu rukun iman. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
