label: { ar: "الموطأ 1968 — يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: قال رسول الله مطل الغني ظلم، وإذا أتبع أحدكم على مليء فليتبع", en: "Muwatta 1968", es: "Muwatta 1968", fr: "Muwatta 1968", ur: "موطا 1968", tr: "El-Muvatta 1968 — Yahya, Malik'ten, o da Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle: Allah Resulü şöyle buyurdu: \"Zengin birinin ertelemesi haksızlıktır. Eğer sizden biri varlıklı birine yönlendirilirse, ona uysun.\"" }
summary:
  ar: "يروي يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: مطل الغني ظلم، وإذا أتبع أحدكم على مليء فليتبع. {cite:muwatta-maruf-1997 p.205}"
  tr: "Yahya, Malik'ten, o da Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakde çevirmiştir: \"Zengin birinin gecikmesi haksızlıktır. Eğer sizden biri varlıklı birine yönlendirilirse, onu takip etsin.\" {cite:muwatta-maruf-1997 s.205}"
  id: "Yahya meriwayatkan dari Malik, dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Menunda-nunda pekerjaan oleh orang kaya adalah suatu kezaliman, dan jika salah seorang di antara kalian dirujuk kepada orang yang mampu, maka hendaklah ia mengikutinya.\" {cite:muwatta-maruf-1997 p.205}"
