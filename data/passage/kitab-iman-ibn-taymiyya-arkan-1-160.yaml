text: "… إذا أطلق في القرآن يرادف لفظ البر فإذا تبين هذا فلفظ الإيمان إذا أطلق في القرآن والسنة يراد به ما يراد بلفظ البر، وبلفظ التقوى، وبلفظ الدين كما تقدم، فإن الني عليله بين أن الإيمان بضع وسبعون شعبة أفضلها قول …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 160، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 160, that mentions faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 160 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 160, que menciona la fe como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 160), qui décrit la foi comme une soixantaine de branches; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 160. sayfasından bir alıntı, yetmişten fazla iman dalından bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 160, menyebutkan lebih dari tujuh puluh cabang keimanan. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang keimanan, dan karakteristik seorang mukmin."
