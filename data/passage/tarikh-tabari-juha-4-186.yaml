text: "… يزيد مرثد. دعامة الشيبالى ابن دعباش. دعبل الشاعر الدملمان بنو لغش دغفل بن حنظلة الراوى ابن الدغنة دكيف بن راشد مولى بنى يزيد بن حاتم -- دقينوس اللك دكين بن الشماخ الكلبى الراوى ابو دلامة الشاعر اسم بغلة رسول الله …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك، المجلد المصوَّر 4، ص 186، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Rusul wa'l-Muluk, scan volume 4, p. 186, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الرسول و الملوک، اسکین جلد 4، ص 186 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Rusul wa'l-Muluk, volume numérisé 4, p. 186, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Tarikh al-Rusul wa'l-Muluk, volumen escaneado 4, p. 186, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"Peygamberler ve Krallar Tarihi\"nin Resimli Cilt 4, sayfa 186'sından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Para Nabi dan Raja,\" Jilid Bergambar 4, halaman 186, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Islamic Folklore Browser."
