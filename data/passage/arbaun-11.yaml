label: { ar: "الأربعون 11 — دع ما يريبك إلى ما لا يريبك", en: "Arba'un 11 — leave what makes you doubt for what does not", es: "Arba'un 11 — deja lo que te hace dudar por lo que no.", fr: "Arba'un 11 — abandonne ce qui te fait douter pour ce qui ne te fait pas douter." }
text: "دع ما يريبك إلى ما لا يريبك"
summary:
  ar: "حديث الحسن بن علي — «سبط رسول الله وريحانته» كما في المتن — وهو الحديث الحادي عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه النسائي والترمذي (2518) وقال الترمذي: حسن صحيح، وخرجه أحمد وابن حبان (722) والحاكم من رواية بريد بن أبي مريم عن أبي الحوراء السعدي عن الحسن بن علي، واختلف في أبي الحوراء: قال الأكثرون اسمه ربيعة بن شيبان ووثقه النسائي وابن حبان، وتوقف أحمد، وقال الجوزجاني إنه مجهول؛ وفي رواية الترمذي وغيره زيادة «فإن الصدق طمأنينة وإن الكذب ريبة»، وعند ابن حبان «فإن الخير طمأنينة وإن الشر ريبة»؛ وروي بأسانيد ضعيفة عن أنس وابن عمر وأبي هريرة وواثلة بن الأسقع — وفي رواية واثلة سئل «فمن الورع؟ قال: الذي يقف عند الشبهة» — وورد موقوفاً على عمر وابن عمر وأبي الدرداء، وعن ابن مسعود «ما تريد إلى ما يريبك وحولك أربعة آلاف لا تريبك؟» وقال عمر «دعوا الربا والريبة»؛ ومعنى الحديث عند ابن رجب يرجع إلى الوقوف عند الشبهات واتقائها ⁦(جامع العلوم والحكم ص 260–267)⁩."
  en: "The hadith of al-Hasan ibn Ali — 'the Prophet's grandson and his delight' in the wording of the text — the eleventh of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Nasa'i and al-Tirmidhi (2518), who graded it hasan sahih, and by Ahmad, Ibn Hibban (722) and al-Hakim through Burayd ibn Abi Maryam from Abu al-Hawra' al-Sa'di from al-Hasan; Abu al-Hawra's identity was disputed — most name him Rabi'a ibn Shayban, deemed reliable by al-Nasa'i and Ibn Hibban, while Ahmad was undecided and al-Jawzjani called him unknown; al-Tirmidhi's route adds 'truthfulness is tranquility and lying is doubt', Ibn Hibban's 'good is tranquility and evil is doubt'; weaker chains report it from Anas, Ibn Umar, Abu Hurayra and Wathila ibn al-Asqa' — Wathila's version adding, when asked who is scrupulous, 'the one who stops at the doubtful' — and it is cited as the saying of Umar, Ibn Umar and Abu al-Darda', with Ibn Masud's 'why turn to what troubles you when four thousand things around you do not?' and Umar's 'leave both usury and suspicion'; for Ibn Rajab its meaning reduces to stopping at the doubtful and guarding against it (Jami' al-Ulum wal-Hikam pp. 260–267)."
  es: "El hadiz de al-Hasan ibn Ali — 'el nieto del Profeta y su deleite' en la redacción del texto — el undécimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Nasa'i y al-Tirmidhi (2518), quienes lo clasificaron hasan sahih, y por Ahmad, Ibn Hibban (722) y al-Hakim a través de Burayd ibn Abi Maryam de Abu al-Hawra' al-Sa'di de al-Hasan; la identidad de Abu al-Hawra fue disputada: la mayoría lo nombra Rabi'a ibn Shayban, considerado confiable por al-Nasa'i e Ibn Hibban, mientras que Ahmad no se decidió y al-Jawzjani lo llamó desconocido; La ruta de al-Tirmidhi añade \"la veracidad es tranquilidad y la mentira es duda\", la de Ibn Hibban \"el bien es tranquilidad y el mal es duda\"; cadenas más débiles lo recogen de Anas, Ibn Umar, Abu Hurayra y Wathila ibn al-Asqa' —la versión de Wathila añade, cuando se le pregunta quién es escrupuloso, \"el que se detiene en lo dudoso\"— y se cita como dicho de Umar, Ibn Umar y Abu al-Darda', con Ibn Masud \"¿por qué recurrir a lo que te preocupa cuando cuatro mil cosas a tu alrededor no lo hacen?\" y Umar \"deja tanto la usura como la sospecha\"; para Ibn Rajab su significado se reduce a detenerse en lo dudoso y protegerse de ello (Jami' al-Ulum wal-Hikam pp. 260-267)."
  fr: "Le hadith d'al-Hasan ibn Ali — « le petit-fils du Prophète et son plaisir » dans la formulation du texte — le onzième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Nasa'i et al-Tirmidhi (2518), qui l'ont classé hasan sahih, et par Ahmad, Ibn Hibban (722) et al-Hakim par l'intermédiaire de Burayd ibn Abi Maryam d'après Abu al-Hawra' al-Sa'di d'après al-Hasan; l'identité d'Abu al-Hawra a été contestée — la plupart le nomment Rabi'a ibn Shayban, considéré comme fiable par al-Nasa'i et Ibn Hibban, tandis qu'Ahmad était indécis et al-Jawzjani le disait inconnu; la voie d'al-Tirmidhi ajoute « la vérité est tranquillité et le mensonge est doute », celle d'Ibn Hibban « le bien est tranquillité et le mal est doute »; Des chaînes de transmission plus faibles rapportent cette information d'Anas, Ibn Umar, Abu Hurayra et Wathila ibn al-Asqa' — la version de Wathila ajoutant, lorsqu'on lui demande qui est scrupuleux, « celui qui s'arrête au doute » — et elle est citée comme la parole d'Umar, d'Ibn Umar et d'Abu al-Darda', avec celle d'Ibn Masud: « pourquoi se tourner vers ce qui vous trouble alors que quatre mille choses autour de vous ne le font pas ? » et celle d'Umar: « abandonnez l'usure et la suspicion »; pour Ibn Rajab, sa signification se réduit à s'arrêter au doute et à s'en prémunir (Jami' al-Ulum wal-Hikam pp. 260–267)."
