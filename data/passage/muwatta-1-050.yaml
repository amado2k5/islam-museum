label: { ar: "الموطأ 50 — ربيعة يقلس في المسجد ولا يتوضأ", en: "Muwatta 50" }
summary:
  ar: "يروي مالك أنه رأى شيخه ربيعة بن أبي عبد الرحمن يقلس مراراً وهو في المسجد فلا ينصرف ولا يتوضأ حتى يصلي؛ وهو في باب ما لا يجب منه الوضوء. ويفسر المحقق القلس بما يخرج من الجوف ملء الفم أو دونه وليس بقيء، ويذكر أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.59} {cite:muwatta-maruf-1997 p.60}"
