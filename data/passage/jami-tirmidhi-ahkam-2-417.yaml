text: "… : حَدَّثَنَا سَالِمُ بنُ نُوحٍ، عَنِ ابنِ جُرَيْجٍ، عَنْ عَمْرِو بنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ أَنَّ النَّبِيَّ وَوِلِ بَعَثَ مُنَادِياً فِي فِجَاجٍ مَكَّةَ : أَلا إِنَّ صَدَقَةَ الفِطْرِ وَاجِبَةٌ عَلَى كُلِّ مُسْلِمٍ: ذَكَرٍ أَوْ أُنْتَى، حُرِّ أَوْ عَبْدٍ، صَغِيرٍ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 417، يرد فيه ذكر ما وجب على كل مسلم، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
