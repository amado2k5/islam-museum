text: "… المسهّلات، وفيه تليين وجذب. الأورام والبثور : يطلى ويضمّد به بالخلّ والنطرون، وينفع من الخنازير والصلابات والسلع.، نافع للجراحات الرديئة : الجراح والقروح ويأكل اللحم الخبيث وينبت الجيّد. آلات المفاصل : ينفع من وجع عرق النسا والخاصرة والمفاصل سقياً بعسل، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 358، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، ومداواة الجراح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 358, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 358 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، زخموں کا علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 358, que menciona el dolor, enfermedades específicas, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el tratamiento de las heridas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 358, qui mentionne la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles, le traitement des plaies; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Bölümünün 358. sayfasından bir bölüm; ağrı, hastalıkların isimleri, vücut organları, cerrahi, sünnet, atel ve yara tedavisi konularını ele almaktadır; metin, makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 358, yang menyebutkan rasa sakit, nama-nama penyakit, organ tubuh, pembedahan, sunat, bidai, dan pengobatan luka; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
