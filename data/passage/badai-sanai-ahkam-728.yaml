text: "… سبيها، وفي بيان مواضعها من القرآن. أما الأول: فقد قال أصحابنا: إنها واجبة، وقال الشافعي: إنها مستحبة، وليست بواجبة ؛ واحتجَّ بحديث الأعرابيِّ حينَ عَلَّمَهُ رسُولُ اللّٰه لفي الشرائع فقال: هَلْ عَلَيَّ غَيْرُهُنَّ؟ قال : لاَ، إِلاَّ أَنْ تَطَوَّعَ فلو …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 728، يرد فيه ذكر الواجب، والمستحب، والتطوع، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 728, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the voluntary act (tatawwu'), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 728 کا اقتباس جس میں واجب، مستحب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 728, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 728, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), el acto voluntario (tatawwu'), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' al-Sana'i' adlı eserinin 728. sayfasından, farz, sünnet, gönüllülük esasına dayalı ve farz olmayan amellerden bahseden bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz ameller, itaat amelleri, sünnet amelleri, mekruh amelleri, haram amelleri ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Bada'i' al-Sana'i' karya al-Kasani, halaman 728, yang menyebutkan amalan wajib, anjuran, sukarela, dan najis; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
