summary:
  ar: "القسم 48 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الدعوات عن رسول الله»، ويضم فيها النصوص من 3370 إلى 3604.1 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 48 of Jami' al-Tirmidhi (Chapters on Supplication) in the division of the open hadith dataset the museum took its reports from: reports 3370 to 3604.1 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 48، عنوان «کتاب الدعوات عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3370 تا 3604.1۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 48 de Jami' al-Tirmidhi (Capítulos sobre la súplica) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 3370 a 3604.1 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 48 de Jami' al-Tirmidhi (Chapitres sur l'invocation), qui comprend les hadiths 3370 à 3604.1 de la numérotation de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Cami' el-Tirmizi'nin 48. bölümü \"Allah Resulü'nden Dualar Kitabı\" başlığını taşımakta olup, 3370 ile 3604.1 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 48 dari Jami' al-Tirmidhi, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Doa-doa dari Rasulullah\" dan berisi teks 3370 hingga 3604.1, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
