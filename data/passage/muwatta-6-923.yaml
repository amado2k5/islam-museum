label: { ar: "الموطأ 923 — الصلت بن زبيد عن أهله: عمر وجد ريح طيب بالشجرة، فقال كثير بن الصلت: لبدت رأسي وأردت أن أحلق؛ فقال عمر: اذهب إلى شربة فادلك رأسك حتى تنقيه", en: "Muwatta 923" }
text: "اذهب إلى شربة فادلك رأسك حتى تنقيه"
summary:
  ar: "يرويه مالك عن الصلت بن زبيد عن غير واحد من أهله، أن عمر بن الخطاب وجد ريح طيب وهو بالشجرة، وإلى جنبه كثير بن الصلت، فقال: ممن ريح هذا الطيب؟ فقال كثير: مني يا أمير المؤمنين، لبدت رأسي وأردت أن أحلق. فقال عمر: فاذهب إلى شربة فادلك رأسك حتى تنقيه، ففعل كثير. ويقول مالك: الشربة حفير يكون عند أصل النخلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1058) وسويد (492) والشيباني (403). {cite:muwatta-maruf-1997 p.443}"
