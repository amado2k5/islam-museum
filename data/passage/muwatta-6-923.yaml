label: { ar: "الموطأ 923 — الصلت بن زبيد عن أهله: عمر وجد ريح طيب بالشجرة، فقال كثير بن الصلت: لبدت رأسي وأردت أن أحلق؛ فقال عمر: اذهب إلى شربة فادلك رأسك حتى تنقيه", en: "Muwatta 923", es: "Muwatta 923", fr: "Muwatta 923", ur: "موطا 923", tr: "El-Muvatta 923 — El-Salt bin Zubayd, ailesinden rivayetle: Ömer ağaçta hoş bir koku buldu. Bunun üzerine Kathir bin El-Salt, \"Saçlarım keçeleşti, tıraş etmek istiyorum\" dedi. Ömer de, \"Bir su kaynağına git ve saçların temizlenene kadar başını ov\" dedi.", id: "Al-Muwatta 923 — Al-Salt bin Zubayd meriwayatkan dari keluarganya: Umar menemukan aroma yang harum pada pohon itu, lalu Kathir bin Al-Salt berkata: Rambutku kusut dan aku ingin mencukurnya; lalu Umar berkata: Pergilah minum dan gosok kepalamu sampai bersih." }
text: "اذهب إلى شربة فادلك رأسك حتى تنقيه"
summary:
  ar: "يرويه مالك عن الصلت بن زبيد عن غير واحد من أهله، أن عمر بن الخطاب وجد ريح طيب وهو بالشجرة، وإلى جنبه كثير بن الصلت، فقال: ممن ريح هذا الطيب؟ فقال كثير: مني يا أمير المؤمنين، لبدت رأسي وأردت أن أحلق. فقال عمر: فاذهب إلى شربة فادلك رأسك حتى تنقيه، ففعل كثير. ويقول مالك: الشربة حفير يكون عند أصل النخلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1058) وسويد (492) والشيباني (403). {cite:muwatta-maruf-1997 p.443}"
  tr: "Malik, el-Salt ibn Zubayd'dan, onun da ailesinden birkaç kişiden rivayet ettiğine göre, Ömer ibn el-Hattab, yanında Kathir ibn el-Salt varken bir ağacın altında hoş bir koku duydu. \"Bu koku kimden geliyor?\" diye sordu. Kathir, \"Ey Müminlerin Emiri, benden geliyor. Saçlarım keçeleşmişti ve tıraş etmek istedim.\" diye cevap verdi. Ömer, \"Bir çukura git ve başını temizlenene kadar ov.\" dedi. Kathir de öyle yaptı. Malik şöyle der: \"Çukur, hurma ağacının dibinde oluşan bir çukurdur.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1058), Suveyd (492) ve el-Şeybani (403) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.443}"
  id: "Malik meriwayatkannya dari al-Salt ibn Zubayd, dari beberapa anggota keluarganya, bahwa Umar ibn al-Khattab mencium aroma yang harum ketika berada di bawah pohon, dengan Kathir ibn al-Salt di sampingnya. Ia bertanya, \"Dari siapa aroma ini berasal?\" Kathir menjawab, \"Dari saya, wahai Amirul Mukminin. Rambut saya kusut dan saya ingin mencukurnya.\" Umar berkata, \"Pergilah ke cekungan dan gosok kepalamu sampai bersih.\" Kathir pun melakukannya. Malik berkata: \"Cekungan adalah lekukan di pangkal pohon kurma.\" Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1058), Suwayd (492), dan al-Shaybani (403). {cite:muwatta-maruf-1997 p.443}"
