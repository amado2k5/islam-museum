label: { ar: "نوادر جحا الكبرى، ص 148 — «إذا لم يحدد العكس فلا يتقرر الطرد»", en: "Nawadir Juha al-Kubra, p. 148 — 'If the Opposite Is Not Fixed, Expulsion Cannot Be Established'", ur: "نوادر جحا الکبریٰ، ص 148 — «اگر الٹ طے نہ ہو تو اخراج ثابت نہیں ہوتا»", fr: "Nawadir Juha al-Kubra, p. 148 — « Si le contraire n'est pas fixé, l'exclusion ne peut être établie »", es: "Nawadir Juha al-Kubra, p. 148 — «Si no se fija lo contrario, no se establece la expulsión»" }
text: "… إذا لم يحدَّد العكسُ فلا يتقرَّرُ الطرد سألُوه يوماً : أين أنفك؟ فأراهم عقدة الحياة التي في رقبته. فقالوا له : يا شيخ أنت أجبت بالضدِّ وأشرْتَ إلى الجهة المقابلة. فأجابهم: أرأيتُمْ أنه لو لم يحدَّد العكسُ هل يتقرَّرُ الطرْدُ؟"
summary:
  ar: "سُئل جحا أين أنفه، فأشار إلى عقدة الحياة في عنقه، فقالوا له إنه أشار إلى الجهة المعاكسة، فسأل هل يتقرر الطرد إذا لم يُحدَّد العكس. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  en: "Asked where his nose is, Juha points to the knot of life on his neck; they say he pointed the opposite way; he asks whether, if the opposite is not fixed, expulsion can be established. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  ur: "جحا سے پوچھا گیا کہ اس کی ناک کہاں ہے تو اس نے اپنی گردن میں زندگی کی گرہ کی طرف اشارہ کیا، لوگوں نے کہا کہ اس نے الٹی طرف اشارہ کیا ہے، تو اس نے پوچھا کہ اگر الٹ طے نہ ہو تو کیا اخراج ثابت ہو سکتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  fr: "Interrogé sur l'emplacement de son nez, Juha montre le nœud de vie sur son cou ; on lui dit qu'il a indiqué le côté opposé ; il demande si, lorsque le contraire n'est pas fixé, l'exclusion peut être établie. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  es: "Al preguntarle dónde tiene la nariz, Juha señala el nudo de la vida en su cuello; le dicen que ha señalado el lado contrario; él pregunta si, cuando lo contrario no está fijado, puede establecerse la expulsión. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
