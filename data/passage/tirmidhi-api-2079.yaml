text: "… الْحَذَّاءِ، حَدَّثَنَا مَيْمُونٌ أَبُو عَبْدِ اللَّهِ، قَالَ سَمِعْتُ زَيْدَ بْنَ أَرْقَمَ، قَالَ أَمَرَنَا رَسُولُ اللَّهِ أَنْ نَتَدَاوَى مِنْ ذَاتِ الْجَنْبِ بِالْقُسْطِ الْبَحْرِيِّ وَالزَّيْتِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ صَحِيحٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ مَيْمُونٍ عَنْ زَيْدِ بْنِ أَرْقَمَ. وَقَدْ رَوَى عَنْ مَيْمُونٍ غَيْرُ وَاحِدٍ مِنْ أَهْلِ الْعِلْمِ هَذَا الْحَدِيثَ. وَذَاتُ الْجَنْبِ السُّلُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2079، يذكر القسط والعود الهندي، والقسط، وأسماء الأمراض، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2079 (Chapters on Medicine), that mentions costus (Indian aloeswood), costus, named diseases, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2079، جس میں قسط ہندی، قسط، بیماریوں کے نام، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
