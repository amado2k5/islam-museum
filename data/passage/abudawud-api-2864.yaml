label: { ar: "سنن أبي داود 2864 — ما خلّفه من تركة وميراث، وصية أو عهد أخير", en: "Sunan Abi Dawud 2864 — what was left behind: estate and inheritance; a testament or parting counsel", ur: "سنن ابی داؤد 2864 — ترکہ اور میراث، وصیت یا آخری نصیحت", es: "Sunan Abi Dawud 2864 — lo que quedó: patrimonio y herencia; un testamento o consejo de despedida" }
text: "… إِلاَّ ابْنَتِي أَفَأَتَصَدَّقُ بِالثُّلُثَيْنِ قَالَ \" لاَ \". قَالَ فَبِالشَّطْرِ قَالَ \" لاَ \". قَالَ فَبِالثُّلُثِ قَالَ \" الثُّلُثُ وَالثُّلُثُ كَثِيرٌ إِنَّكَ أَنْ تَتْرُكَ وَرَثَتَكَ أَغْنِيَاءَ خَيْرٌ مِنْ أَنْ تَدَعَهُمْ عَالَةً يَتَكَفَّفُونَ النَّاسَ وَإِنَّكَ لَنْ تُنْفِقَ نَفَقَةً إِلاَّ أُجِرْتَ بِهَا حَتَّى اللُّقْمَةَ تَرْفَعُهَا إِلَى فِي امْرَأَتِكَ \". قُلْتُ يَا رَسُولَ اللَّهِ أَتَخَلَّفُ عَنْ هِجْرَتِي قَالَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2864، يذكر ما خلّفه من تركة وميراث، ووصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2864 (Wills (Kitab Al-Wasaya)), that mentions what was left behind: estate and inheritance, a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2864، جس میں ترکہ اور میراث، وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 2864 (Testamentos (Kitab Al-Wasaya)), menciona lo que se dejó como legado: bienes y herencia, un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
