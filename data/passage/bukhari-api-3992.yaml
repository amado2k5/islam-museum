label: { ar: "صحيح البخاري 3992 — الأب والأبوة", en: "Sahih al-Bukhari 3992 — the father and fatherhood", ur: "صحیح بخاری 3992 — باپ اور والدیت", es: "Sahih al-Bukhari 3992 — El padre y la paternidad", fr: "Sahih al-Bukhari 3992 — Le père et la paternité", tr: "Sahih el-Buhari 3992 — Baba ve Babalık", id: "Sahih al-Bukhari 3992 — Ayah dan Peran Ayah" }
text: "حَدَّثَنِي إِسْحَاقُ بْنُ إِبْرَاهِيمَ، أَخْبَرَنَا جَرِيرٌ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ مُعَاذِ بْنِ رِفَاعَةَ بْنِ رَافِعٍ الزُّرَقِيِّ، عَنْ أَبِيهِ ـ وَكَانَ أَبُوهُ مِنْ أَهْلِ بَدْرٍ ـ قَالَ جَاءَ جِبْرِيلُ إِلَى النَّبِيِّ فَقَالَ \" مَا تَعُدُّونَ أَهْلَ بَدْرٍ فِيكُمْ قَالَ مِنْ أَفْضَلِ الْمُسْلِمِينَ ـ أَوْ كَلِمَةً نَحْوَهَا ـ قَالَ وَكَذَلِكَ مَنْ شَهِدَ بَدْرًا مِنَ الْمَلاَئِكَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3992، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3992 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3992، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3992 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3992 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3992 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3992, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
