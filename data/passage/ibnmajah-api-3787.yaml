label: { ar: "سنن ابن ماجه 3787 — عمل يعدل عملا أعظم منه", en: "Sunan Ibn Majah 3787 — a deed that equals a greater one", ur: "سنن ابن ماجہ 3787 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sunan Ibn Majah 3787 — una acción que equivale a una mayor", fr: "Sunan Ibn Majah 3787 — un acte qui en vaut un plus grand", tr: "Sunan İbn Majah 3787 — Daha büyük bir amele denk bir amel", id: "Sunan Ibn Majah 3787 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "حَدَّثَنَا أَبُو بَكْرٍ، حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ، حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، حَدَّثَنِي سُهَيْلٌ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" {قُلْ هُوَ اللَّهُ أَحَدٌ} تَعْدِلُ ثُلُثَ الْقُرْآنِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3787، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3787 (Etiquette), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3787، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3787 (Etiqueta), habla de una acción que equivale a otra mayor. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3787 (Étiquette), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pondération des actes."
  tr: "İbn Majah'ın Süneni'nde yer alan 3787 numaralı hadiste, daha büyük bir ameli sayan bir amelden bahsedilir. Bu amel, iyi ve kötü ameller listeleriyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3787, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
