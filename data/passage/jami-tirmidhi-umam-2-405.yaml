text: "… هَذَا عِنْدَ عَامَّةِ أَهْلِ العِلْمِ أَنَّ النَّصْرَانِيَّ إِذَا أَسْلَمَ، وُضِعَتْ عَنْهُ جِزْيَةُ رَقَبَتِهِ، وَقَوْلُ النَّبِيِّ وَل علو لَيْسَ عَلَى المُسْلِمِينَ عُشُورٌ إِنَّمَا يَعْنِي بِهِ جِزْيَةَ الرَّقَبَةِ، وَفِي الحَدِيثِ مَا يُفَسِّرُ هَذَا حَيْثُ قَالَ : إِنَّمَا المُشُورُ عَلَى اليَهُودِ وَالنَّصَارَى، وَلَيْسَ …"
summary:
