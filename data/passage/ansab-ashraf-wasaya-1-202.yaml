text: "… أني سمعتُ رسول اللّٰه ولي يقول : لا يَتَمَنَّيِنَّ أحدكم الموت، لتمنيته. قال : وأتي بكفنه قباطي. فبكى، ثم قال : لكن حمزة كفن في بردة، إذا مُدَّت على قدميه قصرت عن رأسه، وإذا مُدّت على رأسه قصرت عن قدميه …"
