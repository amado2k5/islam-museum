text: "… وتلبّسوا السلاح : فانتظر بهم صلاة العصر والمغرب والعشاء لا يسسح أذاناً. ثم حمل عليهم فقتل من قتل وأسر من أسر، فادّنَوا بماْ الإسلام. قال عبد الملِلك : وما عتَب رسول اللّٰه في ذلك ا على خالدا واقا كان المُقَدِّمُ …"
