label: { ar: "الموطأ 696 — أبو هريرة موقوفاً: من كان عنده مال لم يؤد زكاته مُثل له يوم القيامة شجاعاً أقرع يقول: أنا كنزك", en: "Muwatta 696" }
text: "مثل له يوم القيامة شجاعاً أقرع له زبيبتان يطلبه حتى يمكنه، يقول: أنا كنزك"
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن أبي صالح السمان عن أبي هريرة، أنه كان يقول: من كان عنده مال لم يؤد زكاته مُثّل له يوم القيامة شجاعاً أقرع له زبيبتان، يطلبه حتى يمكنه ويقول: أنا كنزك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي ومحمد بن الحسن الشيباني (342)، وينقل عن ابن عبد البر (التمهيد 17/146) أنه روي عن أبي هريرة مرفوعاً من طرق صحاح ثابتة، منها حديث سهيل بن أبي صالح عن أبيه وحديث ابن عجلان عن القعقاع عن أبي صالح، ويضيف أن حديث أبي صالح المرفوع عند البخاري (2/132 و6/49) وحديث همام عنده أيضاً (9/30). {cite:muwatta-maruf-1997 p.348} {cite:muwatta-maruf-1997 p.349}"
