label: { ar: "الموطأ 696 — أبو هريرة موقوفاً: من كان عنده مال لم يؤد زكاته مُثل له يوم القيامة شجاعاً أقرع يقول: أنا كنزك", en: "Muwatta 696", es: "Muwatta 696", fr: "Muwatta 696", ur: "موطا 696", tr: "El-Muvatta 696 — Ebu Hurayra, bir Sahabeden rivayetle: Kimin malı olup da zekâtını vermezse, kıyamet günü kendisine kel, yılan benzeri bir yaratık olarak sunulacak ve şöyle diyecektir: \"Ben senin hazinenim.\"", id: "Al-Muwatta 696 — Abu Hurairah, dari seorang Sahabat: Barangsiapa mempunyai harta dan tidak menunaikan zakatnya, maka pada Hari Kiamat ia akan diperlihatkan makhluk botak menyerupai ular yang akan berkata: \"Akulah hartamu.\"" }
text: "مثل له يوم القيامة شجاعاً أقرع له زبيبتان يطلبه حتى يمكنه، يقول: أنا كنزك"
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن أبي صالح السمان عن أبي هريرة، أنه كان يقول: من كان عنده مال لم يؤد زكاته مُثّل له يوم القيامة شجاعاً أقرع له زبيبتان، يطلبه حتى يمكنه ويقول: أنا كنزك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي ومحمد بن الحسن الشيباني (342)، وينقل عن ابن عبد البر ⁦(التمهيد 17/146)⁩ أنه روي عن أبي هريرة مرفوعاً من طرق صحاح ثابتة، منها حديث سهيل بن أبي صالح عن أبيه وحديث ابن عجلان عن القعقاع عن أبي صالح، ويضيف أن حديث أبي صالح المرفوع عند البخاري ⁦(2/132 و6/49)⁩ وحديث همام عنده أيضاً (9/30). {cite:muwatta-maruf-1997 p.348} {cite:muwatta-maruf-1997 p.349}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Dinar, dari Abu Salih al-Samman, dari Abu Hurayrah, yang biasa berkata: “Barangsiapa mempunyai harta dan tidak membayar zakatnya, maka pada Hari Kiamat ia akan digambarkan sebagai ular botak, berkepala dua, dengan dua bercak hitam di kepalanya, yang akan mengejarnya hingga menangkapnya dan berkata: ‘Akulah hartamu.’” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwayd, al-Shafi’i, dan Muhammad ibn al-Hasan al-Shaybani (342). Ia mengutip Ibnu Abd al-Barr (al-Tamhid 17/146) yang mengatakan bahwa hadits tersebut diriwayatkan dari Abu Hurayrah, yang kemudian ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya), melalui sanad yang sahih dan terpercaya, termasuk hadits Suhayl ibn Abi Salih dari ayahnya, dan hadits Ibnu Ajlan dari al-Qa’qa’ dari Abu Salih. Ia menambahkan bahwa hadits Abu Salih yang ditelusuri kembali kepada Nabi terdapat dalam al-Bukhari (2/132 dan 6/49), dan hadits Hammam juga terdapat dalam al-Bukhari (9/30)."
