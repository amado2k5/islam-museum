label: { ar: "صحيح مسلم 1833 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 1833 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 1833 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 1833: menciones de naciones, religiones y pueblos no musulmanes.", fr: "Sahih Muslim 1833 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنِي حَرْمَلَةُ بْنُ يَحْيَى، وَمُحَمَّدُ بْنُ سَلَمَةَ الْمُرَادِيُّ، قَالاَ حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، أَنَّ عَائِشَةَ، زَوْجَ النَّبِيِّ أَخْبَرَتْهُ أَنَّ الْحَوْلاَءَ بِنْتَ تُوَيْتِ بْنِ حَبِيبِ بْنِ أَسَدِ بْنِ عَبْدِ الْعُزَّى مَرَّتْ بِهَا وَعِنْدَهَا رَسُولُ اللَّهِ فَقُلْتُ هَذِهِ الْحَوْلاَءُ بِنْتُ تُوَيْتٍ وَزَعَمُوا أَنَّهَا لاَ تَنَامُ اللَّيْلَ فَقَالَ رَسُولُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1833، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1833 (The Book of Prayer - Travellers), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 1833، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 1833 (El Libro de la Oración - Viajeros), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih Muslim, n° 1833 (Le Livre de la prière – Guide du voyageur), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
