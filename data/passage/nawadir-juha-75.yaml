text: "… كان يسابق الطير دعاه تيمور لنك لركوب دابته، والدخول في ميدان السباق، ولعب الجريد، فذهب إلى الاصطبل، وركب ثوراً هرماً، وجاءَ به، فلما رآه الناس ضَحِكُوا وضجُوا. فسأله تيمور لنك: كيف تدخل ميدان السباق، وأنت راكب الثور؟ فأجابه الشيخ: إنني …"
summary:
  ar: "دعا تيمور لنك جحا إلى سباق خيل، فركب جحا ثورًا هرمًا من الإسطبل، ولما سخروا منه قال إن الثور كان يسابق الطير قبل عشر سنين فلم لا الآن. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  en: "Timur Lenk invites Juha to a horse race; Juha rides an old ox from the stable, and when mocked, says that the ox used to race birds ten years ago, so why not now. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  ur: "تیمور لنگ نے جحا کو گھوڑوں کی دوڑ میں بلایا؛ جحا اصطبل سے ایک بوڑھے بیل پر سوار ہو کر آیا، اور جب اس کا مذاق اڑایا گیا تو اس نے کہا کہ یہ بیل دس سال پہلے پرندوں سے دوڑ لگایا کرتا تھا، تو اب کیوں نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  fr: "Timur Lenk invite Juha à une course de chevaux ; Juha monte un vieux bœuf pris à l'écurie et, quand on se moque de lui, dit que le bœuf faisait la course avec les oiseaux il y a dix ans, alors pourquoi pas maintenant. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  es: "Timur Lenk invita a Juha a una carrera de caballos; Juha monta un viejo buey sacado del establo y, cuando se burlan, dice que el buey corría carreras con los pájaros hace diez años, así que por qué no ahora. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
