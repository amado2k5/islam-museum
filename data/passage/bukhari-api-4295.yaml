label: { ar: "صحيح البخاري 4295 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 4295 — what was made lawful; what is not lawful", ur: "صحیح بخاری 4295 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 4295 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih al-Bukhari 4295 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih el-Buhari 4295 — Neler caizdir, neler caiz değildir", id: "Sahih al-Bukhari 4295 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… سَمِعَتْهُ أُذُنَاىَ وَوَعَاهُ قَلْبِي، وَأَبْصَرَتْهُ عَيْنَاىَ، حِينَ تَكَلَّمَ بِهِ حَمِدَ اللَّهَ وَأَثْنَى عَلَيْهِ ثُمَّ قَالَ \" إِنَّ مَكَّةَ حَرَّمَهَا اللَّهُ وَلَمْ يُحَرِّمْهَا النَّاسُ، لاَ يَحِلُّ لاِمْرِئٍ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ أَنْ يَسْفِكَ بِهَا دَمًا، وَلاَ يَعْضِدَ بِهَا شَجَرًا، فَإِنْ أَحَدٌ تَرَخَّصَ لِقِتَالِ رَسُولِ اللَّهِ فِيهَا فَقُولُوا لَهُ إِنَّ اللَّهَ أَذِنَ لِرَسُولِهِ، وَلَمْ يَأْذَنْ لَكُمْ. وَإِنَّمَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4295، يذكر ما أُحل، وما لا يحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4295 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions what was made lawful, what is not lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4295، جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4295 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona lo que es lícito, lo que no lo es y lo que es ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4295 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 4295 numaralı hadis, helal, haram ve haramdan bahsetmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4295, menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dan dilarang. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
