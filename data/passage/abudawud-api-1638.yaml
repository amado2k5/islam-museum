label: { ar: "سنن أبي داود 1638 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 1638 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 1638 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 1638 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 1638 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ مُحَمَّدِ بْنِ الصَّبَّاحِ، حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنِي سَعِيدُ بْنُ عُبَيْدٍ الطَّائِيُّ، عَنْ بُشَيْرِ بْنِ يَسَارٍ، زَعَمَ أَنَّ رَجُلاً، مِنَ الأَنْصَارِ يُقَالُ لَهُ سَهْلُ بْنُ أَبِي حَثْمَةَ أَخْبَرَهُ أَنَّ النَّبِيَّ وَدَاهُ بِمِائَةٍ مِنْ إِبِلِ الصَّدَقَةِ - يَعْنِي دِيَةَ الأَنْصَارِيِّ الَّذِي قُتِلَ بِخَيْبَرَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1638، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1638 (Zakat (Kitab Al-Zakat)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1638، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1638 (Zakat (Kitab Al-Zakat)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 1638 (Zakat (Kitab Al-Zakat)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
