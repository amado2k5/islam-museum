text: "قال عبد الله بن سرجس: رأيت النبي وأكلت معه خبزاً ولحماً أو قال ثريداً، ثم درت خلفه فنظرت إلى خاتم النبوة بين كتفيه عند ناغض كتفه اليسرى جمعاً عليه خيلان كأمثال الثآليل"
summary:
  ar: "رواية عبد الله بن سرجس في باب إثبات خاتم النبوة من كتاب الفضائل في صحيح مسلم؛ أدق وصف لموضع الخاتم عند ناغض الكتف اليسرى وشكله."
