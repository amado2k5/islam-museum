text: "قال عبد الله بن سرجس: رأيت النبي وأكلت معه خبزاً ولحماً أو قال ثريداً، ثم درت خلفه فنظرت إلى خاتم النبوة بين كتفيه عند ناغض كتفه اليسرى جمعاً عليه خيلان كأمثال الثآليل"
summary:
  ar: "رواية عبد الله بن سرجس في باب إثبات خاتم النبوة من كتاب الفضائل في صحيح مسلم؛ أدق وصف لموضع الخاتم عند ناغض الكتف اليسرى وشكله."
  tr: "Sahih Müslim'in Faziletler Kitabı'ndaki Peygamberliğin Mührünün İspatlanması bölümünde Abdullah bin Sarjis'in rivayeti; mührün sol omuz eklemindeki yeri ve şeklinin en doğru açıklamasıdır."
  id: "Riwayat Abdullah bin Sarjis dalam bab tentang pembuktian Tanda Kenabian dari Kitab Keutamaan dalam Sahih Muslim; deskripsi paling akurat tentang lokasi tanda kenabian di persendian bahu kiri dan bentuknya."
