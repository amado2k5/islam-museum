text: "… للمبالغة فى التحريم وسدّ الطريق إلى الإباحة لأن المعنى إن أَمكنكم أَن تَنْكحوا ما قد سلَف فانكحوه. فإنه لا يحل لكم غيره، من قِبَل أَنه علَّق نميضَ المدَّعى وهو إثبات الحل بالمحال وهو نكاح ما سلف، فيكون مُحَالاً، وحينئذ فعدَم …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 549، يذكر ما أُحل، وما لا يحل، والتحريم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
