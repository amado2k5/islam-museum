label: { ar: "الموطأ 1364 — القاسم بن محمد: امرأة نذرت أن تنحر ابنها فقال ابن عباس لا تنحريه وكفري عن يمينك، واستشهد بآية الظهار", en: "Muwatta 1364" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد أنه سمعه يقول أتت امرأة إلى عبد الله بن عباس فقالت إني نذرت أن أنحر ابني، فقال ابن عباس لا تنحري ابنك، وكفري عن يمينك. فقال شيخ عند ابن عباس كيف يكون في هذا كفارة؟ فاستشهد ابن عباس بآية الظهار في سورة المجادلة، ثم جعل فيه من الكفارة ما قد رأيت. ويذكر المحقق أن حديث ابن عباس رواه عنه عكرمة في البخاري، وأن ابن عبد البر ذكر رواية عن عائشة في النذر لم تكن في نسخة يحيى. {cite:muwatta-maruf-1997 p.610}"
