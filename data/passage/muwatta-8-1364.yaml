label: { ar: "الموطأ 1364 — القاسم بن محمد: امرأة نذرت أن تنحر ابنها فقال ابن عباس لا تنحريه وكفري عن يمينك، واستشهد بآية الظهار", en: "Muwatta 1364", es: "Muwatta 1364", fr: "Muwatta 1364", ur: "موطا 1364", tr: "El-Muvatta 1364 — El-Kâsım ibn Muhammed: Bir kadın oğlunu kurban etmeye yemin etti. İbn Abbas, \"Onu kurban etme, yeminini boz\" dedi ve zihar (bir tür boşanma) ile ilgili ayeti zikretti.", id: "Al-Muwatta 1364 — Al-Qasim ibn Muhammad: Seorang wanita bersumpah akan menyembelih anaknya, lalu Ibnu Abbas berkata, “Jangan menyembelihnya, tetapi tebuslah sumpahmu,” dan beliau mengutip ayat tentang zihar (suatu bentuk perceraian)." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد أنه سمعه يقول أتت امرأة إلى عبد الله بن عباس فقالت إني نذرت أن أنحر ابني، فقال ابن عباس لا تنحري ابنك، وكفري عن يمينك. فقال شيخ عند ابن عباس كيف يكون في هذا كفارة؟ فاستشهد ابن عباس بآية الظهار في سورة المجادلة، ثم جعل فيه من الكفارة ما قد رأيت. ويذكر المحقق أن حديث ابن عباس رواه عنه عكرمة في البخاري، وأن ابن عبد البر ذكر رواية عن عائشة في النذر لم تكن في نسخة يحيى. {cite:muwatta-maruf-1997 p.610}"
  tr: "Malik, Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayet ettiğine göre, şöyle dediğini işittiğini aktarır: Bir kadın Abdullah ibn Abbas'a gelip, \"Oğlumu kurban etmeye yemin ettim\" dedi. İbn Abbas, \"Oğlunu kurban etme, yeminini boz\" dedi. İbn Abbas'ın yanında bulunan bir büyüğü, \"Bunun nasıl bir kefareti olabilir?\" diye sordu. İbn Abbas daha sonra Müceddile Suresi'ndeki zihar (boşanma şekli) ayetini okudu ve ardından gördüğünüz kefareti emretti. Araştırmacı, İbn Abbas'ın hadisinin İkrime tarafından Buhari'de onun rivayetiyle nakledildiğini ve İbn Abd el-Barr'ın Yahya'nın rivayetinde olmayan, yeminlerle ilgili Aişe'den bir rivayet zikrettiğini belirtiyor. {cite:muwatta-maruf-1997 s.610}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, bahwa ia mendengar beliau berkata: Seorang wanita datang kepada Abdullah ibn Abbas dan berkata, \"Aku telah bernazar untuk mengorbankan anakku.\" Ibnu Abbas berkata, \"Jangan korbankan anakmu, dan tebuslah nazarmu.\" Seorang tetua yang hadir bersama Ibnu Abbas bertanya, \"Bagaimana mungkin ada penebusan dalam hal ini?\" Ibnu Abbas kemudian mengutip ayat tentang zihar (suatu bentuk perceraian) dalam Surah al-Mujadilah, dan kemudian menetapkan penebusan yang telah Anda lihat. Peneliti menyebutkan bahwa hadits Ibnu Abbas diriwayatkan darinya oleh Ikrimah dalam al-Bukhari, dan bahwa Ibnu Abd al-Barr menyebutkan sebuah riwayat dari Aisyah tentang nazar yang tidak ada dalam versi Yahya. {cite:muwatta-maruf-1997 p.610}"
