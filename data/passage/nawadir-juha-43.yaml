text: "… الذنب موجود احتاجَ إلى دراهم فأرادَ بيعَ حمارِهِ في السوق، ولَمَّا كانَ في الطريق رأى ذنب الحمارِ ملوَّثاً فاستقبحَ هذا المنظرَ، ولم يكن منه إلَّا أن أخذّ سكيناً وقطع الذنب، ووضعه في الخرج. ولما دخل السوق اجتمعَ عليه المُشترون، ولكنهم …"
summary:
  ar: "قطع جحا ذيل حماره المتسخ ليبيعه، فلما تردد المشترون قال إن الذيل قريب. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  en: "Juha cuts off the dirty tail of his donkey to sell it, and when buyers hold back, he says the tail is nearby. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  ur: "جحا نے اپنے گدھے کی گندی دم کاٹ دی تاکہ اسے بیچ سکے، اور جب خریدار ہچکچائے تو اس نے کہا کہ دم قریب ہی پڑی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  fr: "Juha coupe la queue sale de son âne pour le vendre, et quand les acheteurs hésitent, il dit que la queue est tout près. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  es: "Juha corta la cola sucia de su burro para venderlo, y cuando los compradores dudan, dice que la cola está cerca. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  tr: "Juha, satmak için eşeğinin kirli kuyruğunu kesti, ancak alıcılar tereddüt edince, \"Kuyruk yakınlarda,\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 25}"
  id: "Juha memotong ekor keledainya yang kotor untuk dijual, tetapi ketika pembeli ragu-ragu, dia berkata, \"Ekornya ada di dekat sini.\" {cite:juha-nawadir-kubra-djuwaydi p. 25}"
