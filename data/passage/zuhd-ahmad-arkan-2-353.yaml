text: "… وإِن رُدَّت: حمد الله، قال: وسمعتُ الحسنَ يقولَ: ما رأيتُ فقيهًا قطّ، وإِنَّما الفقيه: الزَّاهدُ في الدُّنيا، الرَّاغبُ في الآخرةِ، الدَّائبُ على العبادةِ، المتمسِّكُ بالسنَّةِ. وأخرجه البيهقي في المدخل إلى السنن الكبرى، و شعب الإيمان من طريق أَبي حمزةً محمَّد …"
