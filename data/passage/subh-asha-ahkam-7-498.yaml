text: "… فتُقُضُّها؛ هذا إلى كون القعُود لا يَقْضى فرضَ اللّٰه فى الحهاد، ولا يُرْعى به حقُّ اللّه فى العباد؛ ولا يُوفى به واجبُ التقليد الذى تطوّقَهُ الحادمُ من أئمةٍ قضَوْا بالحقِّ وبه كأنُوا يَعْدِلُون، وخلفاء اللّه كانُوا فى مثل هذا اليوم …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 7، ص 498، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 7, p. 498, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 7، ص 498 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subh al-A'sha de al-Qalqashandi, volume numérisé 7, p. 498, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen digitalizado 7, p. 498, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kalkaşandi'nin Subh al-A'sha adlı eserinin 7. resimli cildinin 498. sayfasından, Allah ve Resulü'nün farz kıldığı, farz olan amelleri ve görevleri içeren bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Subh al-A'sha karya al-Qalqashandi, jilid 7, halaman 498, yang menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, termasuk amalan dan kewajiban yang wajib. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
