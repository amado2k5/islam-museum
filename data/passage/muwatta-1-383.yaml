label: { ar: "الموطأ 383 — معاذ بن جبل: الجمع عام تبوك وعين تبوك", en: "Muwatta 383" }
text: "يوشك يا معاذ إن طالت بك حياة أن ترى ما هاهنا قد ملئ جناناً"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي عن أبي الطفيل عامر بن واثلة عن معاذ بن جبل، في باب الجمع بين الصلاتين في الحضر والسفر: خرجوا مع النبي عام تبوك فكان يجمع بين الظهر والعصر وبين المغرب والعشاء، فأخّر الصلاة يوماً ثم خرج فصلى الظهر والعصر جميعاً ثم دخل ثم خرج فصلى المغرب والعشاء جميعاً، ثم أخبرهم أنهم سيأتون من الغد عين تبوك ضحىً ونهى من جاءها أن يمس من مائها شيئاً حتى يأتي. فجاؤوها وقد سبقهم رجلان والعين تبضّ بشيء من ماء، فسألهما النبي أمسّا من مائها فقالا نعم، فعاتبهما، ثم غرفوا بأيديهم من العين قليلاً قليلاً حتى اجتمع في شيء فغسل النبي فيه وجهه ويديه ثم أعاده فيها فجرت العين بماء كثير فاستقى الناس، ثم قال لمعاذ إنه يوشك إن طالت به حياة أن يرى ما هناك قد ملئ جناناً. ويخرّجه المحقق عند مسلم (7/60) وأبي داود (1206) والنسائي (1/285) وابن خزيمة وابن حبان وأحمد والدارمي والشافعي والبيهقي في الدلائل من طرق أصحاب مالك، ويحيل على التمهيد (12/193). {cite:muwatta-maruf-1997 p.206} {cite:muwatta-maruf-1997 p.207}"
