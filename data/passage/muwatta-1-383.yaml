label: { ar: "الموطأ 383 — معاذ بن جبل: الجمع عام تبوك وعين تبوك", en: "Muwatta 383", es: "Muwatta 383", fr: "Muwatta 383", ur: "موطا 383", tr: "El-Muvatta 383 — Mu'az ibn Cebel: Toplanma Tebük'te ve Tebük pınarında gerçekleşti.", id: "Al-Muwatta 383 — Mu'adh ibn Jabal: Pertemuan itu terjadi di Tabuk dan mata air Tabuk" }
text: "يوشك يا معاذ إن طالت بك حياة أن ترى ما هاهنا قد ملئ جناناً"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي عن أبي الطفيل عامر بن واثلة عن معاذ بن جبل، في باب الجمع بين الصلاتين في الحضر والسفر: خرجوا مع النبي عام تبوك فكان يجمع بين الظهر والعصر وبين المغرب والعشاء، فأخّر الصلاة يوماً ثم خرج فصلى الظهر والعصر جميعاً ثم دخل ثم خرج فصلى المغرب والعشاء جميعاً، ثم أخبرهم أنهم سيأتون من الغد عين تبوك ضحىً ونهى من جاءها أن يمس من مائها شيئاً حتى يأتي. فجاؤوها وقد سبقهم رجلان والعين تبضّ بشيء من ماء، فسألهما النبي أمسّا من مائها فقالا نعم، فعاتبهما، ثم غرفوا بأيديهم من العين قليلاً قليلاً حتى اجتمع في شيء فغسل النبي فيه وجهه ويديه ثم أعاده فيها فجرت العين بماء كثير فاستقى الناس، ثم قال لمعاذ إنه يوشك إن طالت به حياة أن يرى ما هناك قد ملئ جناناً. ويخرّجه المحقق عند مسلم (7/60) وأبي داود (1206) والنسائي (1/285) وابن خزيمة وابن حبان وأحمد والدارمي والشافعي والبيهقي في الدلائل من طرق أصحاب مالك، ويحيل على التمهيد (12/193). {cite:muwatta-maruf-1997 p.206} {cite:muwatta-maruf-1997 p.207}"
  tr: "Malik, Ebu Zübeyr el-Mekki'den, o da Ebu Tüfeyl Amir ibn Vatila'dan, o da Muaz ibn Cebel'den rivayetle, evde veya yolculukta namazları birleştirme bölümünde şöyle anlatmaktadır: Tebük yılında Peygamberimizle birlikte dışarı çıktılar ve o öğle namazını, ikindi namazını, akşam namazını ve yatsı namazını birleştirirdi. Bir gün namazı geciktirdi, sonra dışarı çıktı ve öğle namazını ve ikindi namazını birlikte kıldı. Sonra içeri girdi, tekrar dışarı çıktı ve akşam namazını birlikte kıldı. Sonra onlara ertesi sabah Tebük pınarına geleceklerini bildirdi ve oraya varana kadar kimsenin suyuna dokunmasını yasakladı. Onlar da pınara vardılar ve onlardan önce iki adam gelmişti ve pınardan biraz su akıyordu. Peygamberimiz onlara suyuna dokunup dokunmadıklarını sordu ve onlar da evet dediler. Bunun üzerine onları uyardı. Sonra elleriyle pınardan biraz su alıp bir kapta topladılar ve Peygamber bu suyla yüzünü ve ellerini yıkadı, sonra suyu tekrar pınara döktü. Pınar bol su fışkırttı ve insanlar su içtiler. Sonra Mu'adh'a, eğer yeterince uzun yaşarsa o yerin bahçelerle dolu olduğunu göreceğini söyledi. Araştırmacı bunu Müslim (7/60), Ebu Davud (1206), el-Nesai (1/285), İbn Huzeyme, İbn Hibban, Ahmed, el-Darimi, el-Şafiî ve el-Beyhaki'nin Dalail adlı eserinde, Malik'in takipçilerinin rivayet zincirleri aracılığıyla aktardığını ve el-Tamhid'e (12/193) atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.206} {cite:muwatta-maruf-1997 s.207}"
  id: "Diriwayatkan oleh Malik dari Abu Zubayr al-Makki, dari Abu Tufayl 'Amir ibn Wathila, dari Mu'adh ibn Jabal, dalam surah tentang menggabungkan salat saat di rumah atau bepergian: Mereka pergi bersama Nabi pada tahun Tabuk, dan beliau biasa menggabungkan salat Zuhur dan Ashar, serta salat Maghrib dan Isya. Suatu hari, beliau menunda salat, kemudian keluar dan mengerjakan salat Zuhur dan Ashar bersama-sama. Kemudian beliau kembali masuk, lalu keluar lagi dan mengerjakan salat Maghrib dan Isya bersama-sama. Kemudian beliau memberitahu mereka bahwa mereka akan datang ke mata air Tabuk keesokan paginya, dan beliau melarang siapa pun yang datang ke sana untuk menyentuh airnya sampai mereka tiba. Maka mereka datang ke sana, dan dua orang laki-laki telah mendahului mereka, dan mata air itu mengeluarkan sedikit air. Nabi bertanya kepada mereka apakah mereka telah menyentuh airnya, dan mereka menjawab ya. Maka beliau menasihati mereka. Kemudian mereka mengambil sedikit air dari mata air dengan tangan mereka hingga terkumpul dalam sebuah wadah, dan Nabi membasuh wajah dan tangannya dengan air itu, lalu menuangkannya kembali ke mata air, dan mata air itu memancar dengan air yang melimpah, dan orang-orang mengambil air. Kemudian beliau berkata kepada Mu'adz bahwa jika ia hidup cukup lama, ia akan melihat tempat itu dipenuhi dengan taman-taman. Peneliti memasukkan riwayat ini dalam Muslim (7/60), Abu Dawud (1206), al-Nasa'i (1/285), Ibn Khuzaymah, Ibn Hibban, Ahmad, al-Darimi, al-Shafi'i, dan al-Bayhaqi dalam Dalail-nya, melalui sanad pengikut Malik, dan merujuk pada al-Tamhid (12/193). {cite:muwatta-maruf-1997 p.206} {cite:muwatta-maruf-1997 p.207}"
