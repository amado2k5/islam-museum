text: "… ابن مجاهد عن أَبيه قال : توضاً من القيح والدكر والدم، وذكر خصلتين لم أذكرهما. باب الوضوء من الدم - عبد الرزاق عن ابن جريج عن عطاءٍ في الشَجَّة يكون بالرجل قال : إن سَال الدم فليتوضأُ، وإن ظهر ولم …"
