text: "يسلم، والأول هو اختيار ابن سعد وغيره، والظاهر قول ابن حزم. (الكتاب إلى هرقل) وبعث دحية بن خليفة الكلبي إلى قيصر ملك الروم، واسمه هرقل، وهم بالإسلام وكاد، ولم يفعل، وقيل : بل أسلم، وليس بشيء . وقد روى أبو حاتم ابن"
