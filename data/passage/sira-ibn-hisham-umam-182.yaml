text: "… مَنْ شَرِبَ مِنْهُ لاَ يَظْمأ أُبداً. طلب كفار قريش إنزال مَلَكِ : قال ابن إسحاق: وَدَعَا رَسُولُ اللّٰه وَلِفِ قومه إِلَى الإِسْلاَم، وكلَّمهم فأَبْلَغَ إِلَيْهِمْ، فقال زَمْعَةُ بنُ الأسْوَدِ، والنَّضْرُ بْنُ الحَارثِ، والأسْوَدُ بُن عَبْدِ يَغُوثَ، وأبيِّ بْنُ خَلَف، والعاص …"
