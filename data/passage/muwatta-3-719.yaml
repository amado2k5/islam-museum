label: { ar: "الموطأ 719 — مالك: قسم الصدقات على وجه الاجتهاد من الوالي، وليس للعامل عليها فريضة مسماة", en: "Muwatta 719" }
summary:
  ar: "قول لمالك: الأمر عندنا في قسم الصدقات أن ذلك لا يكون إلا على وجه الاجتهاد من الوالي، فأي الأصناف كانت فيه الحاجة والعدد أُوثر بقدر ما يرى الوالي، وعسى أن ينتقل ذلك إلى الصنف الآخر بعد عام أو أعوام، فيُؤثر أهل الحاجة والعدد حيثما كانوا، وعلى هذا أدرك من يرضى من أهل العلم. ويقول مالك: وليس للعامل على الصدقات فريضة مسماة إلا على قدر ما يرى الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.361}"
