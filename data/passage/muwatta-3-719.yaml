label: { ar: "الموطأ 719 — مالك: قسم الصدقات على وجه الاجتهاد من الوالي، وليس للعامل عليها فريضة مسماة", en: "Muwatta 719", es: "Muwatta 719", fr: "Muwatta 719", ur: "موطا 719", tr: "Al-Muwatta 719 — Malik: Zekat dağıtımı yöneticinin takdirine bırakılmıştır ve toplayıcının sabit bir payı yoktur.", id: "Al-Muwatta 719 — Malik: Pembagian zakat diserahkan kepada kebijaksanaan penguasa, dan pengumpul zakat tidak memiliki bagian tetap." }
summary:
  ar: "قول لمالك: الأمر عندنا في قسم الصدقات أن ذلك لا يكون إلا على وجه الاجتهاد من الوالي، فأي الأصناف كانت فيه الحاجة والعدد أُوثر بقدر ما يرى الوالي، وعسى أن ينتقل ذلك إلى الصنف الآخر بعد عام أو أعوام، فيُؤثر أهل الحاجة والعدد حيثما كانوا، وعلى هذا أدرك من يرضى من أهل العلم. ويقول مالك: وليس للعامل على الصدقات فريضة مسماة إلا على قدر ما يرى الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.361}"
  tr: "Malik şöyle demiştir: Zekat dağıtımı konusunda, yönetici (veya vali), hangi kategorinin en çok ihtiyacı olduğunu ve en çok alıcıya sahip olduğunu belirleme yetkisine sahiptir. Daha sonra, kendi takdirine göre ihtiyaç sahibi kategoriye öncelik verebilir. Bu, bir yıl veya daha uzun bir süre sonra başka bir kategoriye aktarılabilir, böylece ihtiyaç sahipleri nerede olurlarsa olsunlar önceliklendirilmiş olur. Bu, bu görüşten memnun olan âlimlerin anlayışıdır. Malik ayrıca şöyle demiştir: Zekat toplayıcısının, imamın (liderin) uygun gördüğü dışında sabit bir maaşı yoktur. Araştırmacı, bunun Malik'ten Ebu Mus'ab tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.361}"
  id: "Malik berkata: Mengenai pembagian sedekah, penguasa (atau gubernur) memiliki wewenang untuk menentukan kategori mana yang paling membutuhkan dan memiliki jumlah penerima terbanyak. Kemudian, ia dapat memprioritaskan kategori yang membutuhkan sesuai dengan pertimbangannya. Prioritas ini dapat dialihkan ke kategori lain setelah satu tahun atau lebih, sehingga memprioritaskan mereka yang membutuhkan di mana pun mereka berada. Inilah pemahaman para ulama yang puas dengan pandangan ini. Malik juga berkata: Pengumpul sedekah tidak memiliki gaji tetap kecuali sebagaimana yang dianggap pantas oleh imam (pemimpin). Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab. {cite:muwatta-maruf-1997 p.361}"
