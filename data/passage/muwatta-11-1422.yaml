text: "كُلْ، وَإِنْ لَمْ تَبْقَ إلاَّا ضْعةٌ وَاحدةٌ"
summary:
  ar: "بلغ مالكا عن سعد بن أبي وقاص أنه سئل عن الكلب المعلم إذا قتل الصيد، فقال كل، وإن لم تبق إلا ضعة واحدة. ويذكر المحقق أن البيهقي ذكر أن مالكا رواه منقطعا، ثم رواه بإسناد متصل من طريق شعبة وسفيان، وقال إنه أيضا مرسل. {cite:muwatta-maruf-1997 p.637}"
