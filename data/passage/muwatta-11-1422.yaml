label: { ar: "الموطأ 1422 — سعد بن أبي وقاص: سئل عن الكلب المعلم إذا قتل الصيد، فقال كل وإن لم تبق إلا ضعة واحدة", en: "Muwatta 1422", es: "Muwatta 1422", fr: "Muwatta 1422", ur: "موطا 1422", tr: "El-Muvatta 1422 — Sa'd ibn Abi Waqqas: Avı öldüren eğitilmiş bir köpek hakkında kendisine sorulduğunda, \"Tek bir parçası bile kalsa, onu ye\" demiştir.", id: "Al-Muwatta 1422 — Sa'd ibn Abi Waqqas: Dia ditanya tentang anjing terlatih yang membunuh buruan, dan dia berkata: Makanlah meskipun hanya tersisa satu potong." }
text: "كُلْ، وَإِنْ لَمْ تَبْقَ إلاَّا ضْعةٌ وَاحدةٌ"
summary:
  ar: "بلغ مالكا عن سعد بن أبي وقاص أنه سئل عن الكلب المعلم إذا قتل الصيد، فقال كل، وإن لم تبق إلا ضعة واحدة. ويذكر المحقق أن البيهقي ذكر أن مالكا رواه منقطعا، ثم رواه بإسناد متصل من طريق شعبة وسفيان، وقال إنه أيضا مرسل. {cite:muwatta-maruf-1997 p.637}"
  tr: "Malik, Sa'd ibn Abi Waqqas'tan rivayetle, avı öldürmüş eğitimli bir köpek hakkında kendisine soru sorulduğunu ve köpeğin, \"Tek bir leş kalsa bile yiyin\" diye cevap verdiğini aktarmıştır. Araştırmacı, el-Bayhaqi'nin Malik'in bunu önce eksik bir isnad zinciriyle, sonra Şube ve Sufyan aracılığıyla kesintisiz bir isnad zinciriyle rivayet ettiğini ve bunun da mursal (isnad zincirinde eksik bir halka bulunan hadis) olduğunu söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.637}"
  id: "Malik meriwayatkan dari Sa'd ibn Abi Waqqas bahwa ia ditanya tentang seekor anjing terlatih yang telah membunuh buruan, dan ia menjawab, \"Makanlah, meskipun hanya tersisa satu bangkai.\" Peneliti mencatat bahwa al-Bayhaqi menyebutkan bahwa Malik meriwayatkan hadits tersebut dengan sanad yang terputus, kemudian meriwayatkannya dengan sanad yang berkesinambungan melalui Shu'bah dan Sufyan, dan mengatakan bahwa hadits tersebut juga mursal (hadits dengan mata rantai yang hilang dalam sanad). {cite:muwatta-maruf-1997 p.637}"
