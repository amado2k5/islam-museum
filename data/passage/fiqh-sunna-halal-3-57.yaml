text: "… الشافعية، ولا يلزمه شيء عند مالك. ومن حلف فقال : إن فعلت كذا فعليِّ صيام شهر أو الحج إلى بيت اللّٰه الحرام. أو قال : إن فعلت كذا فالحلال عليِّ حرامّ. أو قال : إن فعلت كذا فكل ما أملكه …"
