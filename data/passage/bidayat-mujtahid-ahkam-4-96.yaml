text: "… مأمور بها في الشرع واختلفوا: هل ذلك على الوجوب أو على الندب المذكور، وهو الذي يعبر عنه بالسنة؟ فقال قوم: إن إزالة النجاسات واجبة، وبه قال أبو حنيفة والشافعي، وقال قوم: إزالتها سنة مؤكدة وليست بفرض. وقال قوم: هي فرض …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 96، يرد فيه ذكر الفرض، والواجب، والوجوب، والمندوب، وما ليس بواجب، والسنن المؤكدة والرواتب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 96, whose wording mentions the obligatory (fard), the obligatory (wajib), obligation (wujub), the recommended (mandub), what is said not to be obligatory, the emphasised and regular sunnas, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 96 کا اقتباس جس میں فرض، واجب، وجوب، مندوب، جو واجب نہیں، سننِ مؤکدہ اور رواتب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 96, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), l'obligation (wujub), le recommandé (mandub), ce qui est dit non obligatoire, les sunnas appuyées et régulières, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 96, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mandub), lo que se dice que no es obligatorio, las sunnas enfatizadas y regulares, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
