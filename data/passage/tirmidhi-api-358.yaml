text: "… أَبُو عِيسَى وَمُحَمَّدُ بْنُ الْقَاسِمِ تَكَلَّمَ فِيهِ أَحْمَدُ بْنُ حَنْبَلٍ وَضَعَّفَهُ وَلَيْسَ بِالْحَافِظِ. وَقَدْ كَرِهَ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ أَنْ يَؤُمَّ الرَّجُلُ قَوْمًا وَهُمْ لَهُ كَارِهُونَ فَإِذَا كَانَ الإِمَامُ غَيْرَ ظَالِمٍ فَإِنَّمَا الإِثْمُ عَلَى مَنْ كَرِهَهُ. وَقَالَ أَحْمَدُ وَإِسْحَاقُ فِي هَذَا إِذَا كَرِهَ وَاحِدٌ أَوِ اثْنَانِ أَوْ ثَلاَثَةٌ فَلاَ بَأْسَ أَنْ يُصَلِّيَ بِهِمْ حَتَّى يَكْرَهَهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 358، يرد فيه ذكر ما كرهه الفقهاء، وما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 358 (The Book on Salat (Prayer)), whose wording mentions what the jurists disliked, what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 358، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 358, dont le texte mentionne ce que les juristes ont réprouvé, ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 358, cuyo texto menciona lo que los juristas reprobaron, lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
