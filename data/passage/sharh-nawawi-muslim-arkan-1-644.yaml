text: "… والسلامة من الخبث وهذا الحليث أحد الأحاديث الكف وعن تضعيف أجرها بالتربية قال القاضي عياض لما كان الشيء التي هي قواعد الإسلام ومباني الاحكام وقد جمعت منها أربعين حديثاً في في هذا قال وقيل المراد بكف الرحمن هنا ويمينه كف …"
