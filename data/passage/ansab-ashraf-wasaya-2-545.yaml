text: "… ثم قال : هل علمتَ يأبا مويهبة ؟ أنى قد خيرت بين مفاتح خزائن الدنيا والحلد فيها، ثم الجنة، وبين لقاء ربى وابلحنة. واخترت لقاء ربى والحنة. ثم استغفر لأهل البقيع وانصرف. فيدى رسول اللّٰه بوجعه الذى قبض فيه حين …"
