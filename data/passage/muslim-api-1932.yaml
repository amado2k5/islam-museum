label: { ar: "صحيح مسلم 1932 — الأب والأبوة", en: "Sahih Muslim 1932 — the father and fatherhood", ur: "صحیح مسلم 1932 — باپ اور والدیت", es: "Sahih Muslim 1932 — El padre y la paternidad", fr: "Sahih Muslim 1932 — le père et la paternité" }
text: "وَحَدَّثَنَا حَسَنٌ الْحُلْوَانِيُّ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّهَا قَالَتْ لَمْ يَدَعْ رَسُولُ اللَّهِ الرَّكْعَتَيْنِ بَعْدَ الْعَصْرِ. قَالَ فَقَالَتْ عَائِشَةُ قَالَ رَسُولُ اللَّهِ \" لاَ تَتَحَرَّوْا طُلُوعَ الشَّمْسِ وَلاَ غُرُوبَهَا فَتُصَلُّوا عِنْدَ ذَلِكَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1932، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1932 (The Book of Prayer - Travellers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1932، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 1932 (El Libro de la Oración - Viajeros), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim n° 1932 (Le Livre de la prière – Guide du voyageur) mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
