label: { ar: "صحيح البخاري 4101 — الأب والأبوة", en: "Sahih al-Bukhari 4101 — the father and fatherhood", ur: "صحیح بخاری 4101 — باپ اور والدیت", es: "Sahih al-Bukhari 4101 — El padre y la paternidad", fr: "Sahih al-Bukhari 4101 — le père et la paternité", tr: "Sahih el-Buhari 4101 — Baba ve Babalık", id: "Sahih al-Bukhari 4101 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا خَلاَّدُ بْنُ يَحْيَى، حَدَّثَنَا عَبْدُ الْوَاحِدِ بْنُ أَيْمَنَ، عَنْ أَبِيهِ، قَالَ أَتَيْتُ جَابِرًا ـ فَقَالَ إِنَّا يَوْمَ الْخَنْدَقِ نَحْفِرُ فَعَرَضَتْ كُدْيَةٌ شَدِيدَةٌ، فَجَاءُوا النَّبِيَّ فَقَالُوا هَذِهِ كُدْيَةٌ عَرَضَتْ فِي الْخَنْدَقِ، فَقَالَ \" أَنَا نَازِلٌ \". ثُمَّ قَامَ وَبَطْنُهُ مَعْصُوبٌ بِحَجَرٍ، وَلَبِثْنَا ثَلاَثَةَ أَيَّامٍ لاَ نَذُوقُ ذَوَاقًا، فَأَخَذَ النَّبِيُّ الْمِعْوَلَ فَضَرَبَ، فَعَادَ كَثِيبًا أَهْيَلَ أَوْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4101، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4101 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4101، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4101 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4101 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 4101 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4101, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
