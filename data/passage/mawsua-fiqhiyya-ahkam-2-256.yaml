text: "تزويج فيكون فرضا أو واجبا أو حراما أو مكروها أو مندوبا أو مباحا. فيكون فرضا أو واجبا : إذا كان الشخص في حالة يتيقن فيها الوقوع في الزنى إن لم يتزوج، وكان قادرا على النفقة والمهر وحقوق الزواج الشرعية، ولا …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 2، ص 256، يرد فيه ذكر الفرض، والواجب، والمندوب، والمكروه، والمباح، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 2, p. 256, whose wording mentions the obligatory (fard), the obligatory (wajib), the recommended (mandub), the disliked (makruh), the permitted (mubah), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 2، ص 256 کا اقتباس جس میں فرض، واجب، مندوب، مکروہ، مباح، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 2, p. 256, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), le recommandé (mandub), le réprouvé (makruh), le permis (mubah), l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 2, p. 256, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), lo recomendado (mandub), lo reprobado (makruh), lo permitido (mubah), lo prohibido (haram); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
