text: "… اللّٰه عليه وسولم. أنه قال : حلال بين وحرام بين وشبهات بين ذلك، فمن ترك الشبهات كان للحرام أترك، ومحارم اللّٰه حى فمن رقع حول الحى كان قمنا أن يرتع فيه. هذا جديث محيح ثابت من حديث الشعبى عن النعمان …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 125، يذكر الحلال، والحرام، والمحرمات، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
