text: "… عليه فى المال والخلق فلينظر الى من هو اسفل منه. قال ابن ابى حاتم عن المترجم كتبت عنه وهو صدوق وقال الطحاوى مات سنة سبعين ومأتين وكان قد فلج وثقل لسانه قبل موته بيسير اسماعيل بن ايوب بن سلمة بن …"
