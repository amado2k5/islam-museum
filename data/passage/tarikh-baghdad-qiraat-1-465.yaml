text: "… علماء ذلك الوقت. فسمع بخراسان، والجبال، واصبهان، وفارس، والبصرة، وبغداد، والكوفة، والمدينة، ومكة، والشام، ومصر، والجزيرة، والثغور. واستوطن إغداد وصنف المسند، والسنن، والمفسير، والقراآت، والناسخ والمنسوش، وغير ذلك. وكان فيما عالما حافظا. محدث عن على بن خشرم المروزى، وأبى داود …"
