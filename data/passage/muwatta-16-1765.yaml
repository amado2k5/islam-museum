label: { ar: "الموطأ 1765 — مالك عن ثور بن زيد الديلي عن ابن عباس: ما كان في الحولين، وإن كان مصة واحدة، فهو يحرم", en: "Muwatta 1765", es: "Muwatta 1765", fr: "Muwatta 1765", ur: "موطا 1765", tr: "El-Muvatta 1765 — Malik, Sevr ibn Zeyd el-Dili'den, o da İbn Abbas'tan rivayetle: İki yıl içinde gerçekleşen her şey, tek bir emme bile olsa, haramdır.", id: "Al-Muwatta 1765 — Malik, berdasarkan riwayat Thawr ibn Zayd al-Dili, berdasarkan riwayat Ibn Abbas: Apa pun yang terjadi dalam kurun waktu dua tahun tersebut, meskipun hanya sekali menyusu, hukumnya haram." }
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي عن عبد الله بن عباس أنه كان يقول: ما كان في الحولين، وإن كان مصة واحدة، فهو يحرم. {cite:muwatta-maruf-1997 p.121}"
  tr: "Malik, Abdullah ibn Abbas'tan rivayetle, Sevr ibn Zeyd el-Dili'nin şöyle dediğini aktarır: \"İlk iki yıl içinde olan her şey, tek bir emme bile olsa, haramdır.\" {cite:muwatta-maruf-1997 s.121}"
  id: "Malik meriwayatkan dari Thawr ibn Zayd al-Dili, dari Abdullah ibn Abbas, bahwa beliau biasa berkata: \"Apa pun yang terjadi dalam dua tahun pertama, meskipun hanya satu kali menyusu, hukumnya haram.\" {cite:muwatta-maruf-1997 p.121}"
