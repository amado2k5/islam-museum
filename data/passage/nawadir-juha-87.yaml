text: "… ازرع الجانب الآخر كتّاناً حَلَقَ لِه مُزيْنٌ بليدٌ فجرحَهُ عِدَّةَ جِراحٍ ووضعَ عليها قُطْناً فشعرَ جحا بذلك ونهض قائماً، فقال له: اصبر حتى تنتهِيَ. فأجابه: كفى فقد زرعت نصف رأسي قطناً وأريد أن أزرع النصف الآخر كِتاناً. جحا أكبر أم …"
summary:
  ar: "جرح حلاق أخرق رأس جحا وضمّده بالقطن، فقال جحا إن الحلاق زرع نصف رأسه قطنًا ويريد أن يزرع النصف الآخر كتانًا. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  en: "A clumsy barber cuts and dresses Juha's head with cotton; Juha says the barber has planted half his head in cotton and wants to plant the other half with flax. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  ur: "ایک اناڑی حجام نے جحا کے سر کو زخمی کر دیا اور اس پر روئی کی پٹی باندھی؛ جحا نے کہا کہ حجام نے میرے آدھے سر میں کپاس بو دی ہے اور باقی آدھے میں السی بونا چاہتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  fr: "Un barbier maladroit coupe et panse la tête de Juha avec du coton ; Juha dit que le barbier a planté la moitié de sa tête en coton et veut planter l'autre moitié en lin. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  es: "Un barbero torpe corta y venda la cabeza de Juha con algodón; Juha dice que el barbero ha sembrado la mitad de su cabeza de algodón y quiere sembrar la otra mitad de lino. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  tr: "Beceriksiz bir berber Juha'nın başını kesti ve pamukla sardı. Juha, \"Berber başımın yarısını pamukla sardı, diğer yarısını da ketenle sarmak istiyor\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 45}"
  id: "Seorang tukang cukur yang kikuk memotong kepala Juha dan membalutnya dengan kapas. Juha berkata, \"Tukang cukur itu membalut separuh kepalanya dengan kapas dan ingin membalut separuh lainnya dengan rami.\" {cite:juha-nawadir-kubra-djuwaydi p. 45}"
