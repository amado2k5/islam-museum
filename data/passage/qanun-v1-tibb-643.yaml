text: "… قوّته مسخّنة محمّرة، وفيه قوّة مذيبة، وخاصيته تقوية الأعضاء الباطنة. القروح : هو نافع من الجرب والقوباء طلاء بالخلّ. آلات المفاصل : ينفع من أمراض العصب، ومن وجع الورك من البلغم، وينفع من الفالج ورضّ العضل. أعضاء الرأس : ينفع …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 643، يذكر المرض والمريض، والوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 643, that mentions illness and the sick, pain, named diseases, the hospital and the medical craft, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 643 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، بیمارستان، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 643, que menciona la enfermedad y los enfermos, el dolor, las enfermedades con nombre, el hospital y la práctica médica, los órganos del cuerpo; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 643, qui mentionne la maladie et les malades, la douleur, les maladies nommées, l'hôpital et l'art médical, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 643'ten bir bölüm; hastalık, hasta, ağrı, hastalıkların isimleri, hastane, tıp mesleği ve vücut organlarından bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikası gereği metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 643, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, rumah sakit, profesi medis, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
