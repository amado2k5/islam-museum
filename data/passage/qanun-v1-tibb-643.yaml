text: "… قوّته مسخّنة محمّرة، وفيه قوّة مذيبة، وخاصيته تقوية الأعضاء الباطنة. القروح : هو نافع من الجرب والقوباء طلاء بالخلّ. آلات المفاصل : ينفع من أمراض العصب، ومن وجع الورك من البلغم، وينفع من الفالج ورضّ العضل. أعضاء الرأس : ينفع …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 643، يذكر المرض والمريض، والوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 643, that mentions illness and the sick, pain, named diseases, the hospital and the medical craft, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
