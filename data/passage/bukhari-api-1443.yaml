label: { ar: "صحيح البخاري 1443 — أعضاء البدن", en: "Sahih al-Bukhari 1443 — the organs of the body", ur: "صحیح بخاری 1443 — اعضائے بدن" }
text: "… مَثَلُ الْبَخِيلِ وَالْمُنْفِقِ كَمَثَلِ رَجُلَيْنِ، عَلَيْهِمَا جُبَّتَانِ مِنْ حَدِيدٍ، مِنْ ثُدِيِّهِمَا إِلَى تَرَاقِيهِمَا، فَأَمَّا الْمُنْفِقُ فَلاَ يُنْفِقُ إِلاَّ سَبَغَتْ ـ أَوْ وَفَرَتْ ـ عَلَى جِلْدِهِ حَتَّى تُخْفِيَ بَنَانَهُ وَتَعْفُوَ أَثَرَهُ، وَأَمَّا الْبَخِيلُ فَلاَ يُرِيدُ أَنْ يُنْفِقَ شَيْئًا إِلاَّ لَزِقَتْ كُلُّ حَلْقَةٍ مَكَانَهَا، فَهُوَ يُوَسِّعُهَا وَلاَ تَتَّسِعُ \". تَابَعَهُ الْحَسَنُ بْنُ مُسْلِمٍ عَنْ طَاوُسٍ فِي الْجُبَّتَيْنِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1443، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 1443 (Obligatory Charity Tax (Zakat)), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 1443، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
