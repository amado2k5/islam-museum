text: "… الصَّيْقل، كان يعمل سيوفَ المسلمين ويخدُمُنا، فإذا مِتُّ فادْفَعِيهِ إلى عمر، فلمّا دفعتُه إلى عمر قال عمر : رحِم اللُّه أبا بكرٍ لقد أتعب مَنْ بَعْدَه. وقال الزُّهْرِيّ : أوصى أبو بكر أنْ تُغَسِّلَه امرأتُه أسماءُ بنتُ عُمَيْس، فإنْ سورة …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 119، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
