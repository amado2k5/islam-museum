text: "… مُضَرَ، فَلَسْنَا نَخْلُصُ إِلَيْكَ إِلا فِي كُلِّ شَهْرٍ حَرَامٍ، فَلَوْ أَمَرْتَنَا بِأَمْرٍ نَأْخُذُهُ عَنْكَ وَنُبَلّغُهُ مَنْ وَرَاءَنَا. قَالَ وَلفِ: آمُرُكُمْ بِأَرْبَعِة وَأَنْهَاكُمْ عَنْ أَرْبَيَة: الإيمَانِ بِاللَّهِ شَهَادَةِ أَنْ لا إِلَهَ إلا اللَّهُ، وَإِقَامِ الصَّلاةِ، وَإِبتَاءِ الزَّكَاةِ، وَأَنْ تُؤَدُوا إِلَى اللَّهِ …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 163، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 1, p. 163, that mentions the testimony, the prayer and the zakat, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 1، ص 163 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 1, pág. 163, que menciona el testimonio, la oración y el zakat, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
