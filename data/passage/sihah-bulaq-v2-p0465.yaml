text: |-
  قول ثغرتق يعن باليجزيك
  وكذا ما بعد مافى القاموس اه
  T٢5
  •⁦(ق )⁩ •
  ونتقوا أحلامنا الاناقلا • وقال أبو عبيدة فى قوله تعالى واذنتقنا الجبل أى زعزعناه
  وفرس ناتق اذا كان ينفض راكبه ونتقت الغرب من البترأى جسذيته والبعيراذا تز عزع
  حلد نتق عراحباله وذلك جذبه اياها فسترخى ونتقت الجلد أى سلحته ونتقت المرأة أى كثر
  ولدها فهى ناتق ومنتاق وناقة ناتق اذا أسرعت الحمل وزندناتق أى واد ⁦(نزق )⁩ النزق
  انخفة والعايس وقدنزق بالكسر ينزق نزقاوفاقة نزاق مثل مزاق عن يعدة وب ونزق
  الفرس ينزق بالضم نرها ونزوقا أى نزا وأنرقه صاحبه ونرقه تنزيقا ⁦(نسق)⁩ تغرذسق
  اذا كانت الإسذان مستوية وخررنسق منظم قال أبوزبيد
  بجيدر ثم كريم زانه نسق * يكاديلهيه الياقوت الهابا
  والنسق ماجاء من السكلام على نظام واحد والذق بالتسكين مصدرنسقت الكلام اذا
  عطلفت بعضه على بعض والتفيق التنظيم نشق ) قال ابن السكيت النشوق سعوط
  يجعل فى المنخرين وقد أنشقته انشاقاواستنشقت الماء وغيره اذا أدخلته فى الانف
  واستشقت الريح ثممتها ونشقت منسه ريحاطيبة بالكسر أى شممت وهذهريح مكروهة
  النشق يعى الشم والنشقة بالضم الربقة التى تجعل فى أعناق البهم ونشق الطبي فى الحبالة أى
  علق فيها ورجل نشق اذا كان ممن يدخسل فى أمورلا يكاد يتخلص منها (نطق المنطق
  الكلام وقد نطق نطقا وأنطقه غيره وناطقه واستنطقه أى كله والمنطيق المبطيغ وقوله-م ماله
  صامت ولا ناطق فالتاطق الحيوان والصامت ما-واء والنطاق شقة تلبسها المرأة وتشد
  وسطها تم ترسل الاعلى على الاسفل الى الركبة والاسفل يتجرّ على الارض وليس لها حجزة
  ولا نيفق ولا ساقان والجمع نطق وكان يقال لاسماه بنت أبى بكررضى اللّه عنه-ماذات النطاقيز
  وذات النطاق أيضا اسم أكسة لهم وقد انتطقت المرأة أى لبست النطاق وانتطق الرجل أى
  شذها فى وسطه ومنه قولهم جبل أشم منطق لان السحاب لا يبلغ أعلاه وجاءفلان منتطقا
  فرسه اذا جنبه ولم يركبه قال الشاعر
  وأبرح ما أدام اللّٰه قومى • على الاعداء منتطتا مجيدا
  بقول لا أزال أجنب فرسى جواداويقال انه أراد قولا يستباد فى الثناء على قومى والناطقة
  الخاصرة (فدق النعيق صوت الراعى بغمه وقد نعق الراعى بغمه يبعق بالكسر
  نعيقا ونعاقاً ونعقا نا أى صاح بها وزجرها قال الاخطل
  انعق بضأنك يا جريرفانما • منتك نفسك فى الخلا مضلالا
  و-كى ابن كيسان نعق المغراب أيضابعين غير ججة والناعقان كوكبان من كواكب
  الجوزاء غق نغق الغراب ينفق بالكسر نغية ابغين معيجمة أى صاح وناقة نغيق وهى
  التى تتعم بعيدات بين أى مرة بعد هرة ( ن ق نفقت الدابة تنفق نهوقا أى ماتت
  ونفق البيع نفاقا بالفتح أى راج والنفاق بالكسر فعل المنافق والتفاق أيضاجع
  النفقة من الدراهم ية-ال نفقت بالكسر نفاذ ا لقوم أى فنيت ونفق الزادينة ق نفقا أى نفد
  وقرس
