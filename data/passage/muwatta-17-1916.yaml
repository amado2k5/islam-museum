label: { ar: "الموطأ 1916 — مالك: لا بأس بلحم الحيتان بلحم الإبل والبقر والغنم وما أشبهها من الوحوش، اثنين بواحد وأكثر، يدا بيد، فإن دخل الأجل فلا خير فيه", en: "Muwatta 1916", es: "Muwatta 1916", fr: "Muwatta 1916", ur: "موطا 1916", tr: "El-Muvatta 1916 — Malik: Balina etini deve, inek, koyun veya benzeri vahşi hayvanlarla, iki karşılığında bir veya daha fazla, elden ele takas etmekte bir sakınca yoktur. Ödeme zamanı geldiğinde ise bunun bir faydası kalmaz.", id: "Al-Muwatta 1916 — Malik: Tidak ada salahnya menukar daging paus dengan unta, sapi, domba, atau hewan liar serupa, dua untuk satu atau lebih, secara langsung. Jika waktu pembayaran tiba, maka tidak ada manfaatnya." }
summary:
  ar: "قال مالك: ولا بأس بلحم الحيتان، بلحم الإبل والبقر والغنم، وما أشبه ذلك من الوحوش كلها، اثنين بواحد، وأكثر من ذلك، يدا بيد. فإن دخل ذلك الأجل فلا خير فيه. {cite:muwatta-maruf-1997 p.185}"
  tr: "Malik şöyle dedi: Balina eti, deve eti, sığır eti, koyun eti ve benzeri vahşi hayvanların etini, iki tanesini bir fiyatına veya daha fazlasını, elden ele yemenin hiçbir sakıncası yok. Ancak bu dönem sona ermişse, o zaman bunun bir faydası kalmaz. {cite:muwatta-maruf-1997 s.185}"
  id: "Malik berkata: Tidak ada yang salah dengan memakan daging paus, daging unta, daging sapi, daging domba, dan jenis hewan liar serupa lainnya, dua untuk satu, atau lebih dari itu, secara langsung. Tetapi jika jangka waktunya telah berakhir, maka tidak ada gunanya. {cite:muwatta-maruf-1997 p.185}"
