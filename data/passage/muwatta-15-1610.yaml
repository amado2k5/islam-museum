label: { ar: "الموطأ 1610 — سعيد بن عمرو بن سليم الزرقي عن القاسم بن محمد: رجل جعل امرأة عليه كظهر أمه إن تزوجها، فأمره عمر أن لا يقربها حتى يكفر كفارة المتظاهر", en: "Muwatta 1610", es: "Muwatta 1610", fr: "Muwatta 1610", ur: "موطا 1610", tr: "El-Muvatta 1610 — Sa’id ibn ‘Amr ibn Salim el-Zarqi, el-Kâsim ibn Muhammed’den rivayetle: Bir adam, evlendiği kadını annesinin sırtı gibi kabul ederdi; bunun üzerine Ömer, iftira yemini edenin kefaretini ödeyene kadar ona yaklaşmamasını emretti.", id: "Al-Muwatta 1610 — Sa’id ibn ‘Amr ibn Salim al-Zarqi, berdasarkan riwayat al-Qasim ibn Muhammad: Seorang pria akan menjadikan seorang wanita seperti punggung ibunya jika ia menikahinya, maka ‘Umar memerintahkannya untuk tidak mendekatinya sampai ia membayar tebusan bagi orang yang bernazar fitnah." }
summary:
  ar: "يروي مالك عن سعيد بن عمرو بن سليم الزرقي أنه سأل القاسم بن محمد عن رجل طلق امرأة إن هو تزوجها، فقال القاسم بن محمد إن رجلا جعل امرأة عليه كظهر أمه إن هو تزوجها، فأمره عمر بن الخطاب، إن هو تزوجها، أن لا يقربها حتى يكفر كفارة المتظاهر. {cite:muwatta-maruf-1997 p.68}"
  tr: "Malik, Sa'id ibn 'Amr ibn Salim al-Zuraqi'den rivayetle, al-Qasim ibn Muhammad'a, evlendiği kadını boşayan bir adam hakkında soru sorduğunu aktarır. Al-Qasim ibn Muhammad şöyle demiştir: \"Bir adam evlendiği kadını annesinin sırtı gibi görüyordu. Bunun üzerine Ömer ibn al-Khattab ona, eğer onunla evlenirse, zihar (bir tür boşanma) kefaretini ödemeden ona yaklaşmamasını emretti.\" {cite:muwatta-maruf-1997 s.68}"
  id: "Malik meriwayatkan dari Sa'id ibn 'Amr ibn Salim al-Zuraqi bahwa ia bertanya kepada al-Qasim ibn Muhammad tentang seorang pria yang menceraikan seorang wanita jika ia menikahinya. Al-Qasim ibn Muhammad berkata: Seorang pria menjadikan seorang wanita seperti punggung ibunya jika ia menikahinya, maka 'Umar ibn al-Khattab memerintahkannya bahwa jika ia menikahinya, ia tidak boleh mendekatinya sampai ia membayar tebusan untuk zihar (suatu bentuk perceraian). {cite:muwatta-maruf-1997 p.68}"
