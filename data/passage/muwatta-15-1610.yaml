label: { ar: "الموطأ 1610 — سعيد بن عمرو بن سليم الزرقي عن القاسم بن محمد: رجل جعل امرأة عليه كظهر أمه إن تزوجها، فأمره عمر أن لا يقربها حتى يكفر كفارة المتظاهر", en: "Muwatta 1610" }
summary:
  ar: "يروي مالك عن سعيد بن عمرو بن سليم الزرقي أنه سأل القاسم بن محمد عن رجل طلق امرأة إن هو تزوجها، فقال القاسم بن محمد إن رجلا جعل امرأة عليه كظهر أمه إن هو تزوجها، فأمره عمر بن الخطاب، إن هو تزوجها، أن لا يقربها حتى يكفر كفارة المتظاهر. {cite:muwatta-maruf-1997 p.68}"
