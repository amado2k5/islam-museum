label: { ar: "مسلم 2424 — حديث الكساء وآية التطهير", en: "Muslim 2424 — The cloak report and the purification verse" }
text: "قالت عائشة: خرج النبي غداة وعليه مرط مرحل من شعر أسود، فجاء الحسن بن علي فأدخله، ثم جاء الحسين فدخل معه، ثم جاءت فاطمة فأدخلها، ثم جاء علي فأدخله، ثم قال: «إنما يريد الله ليذهب عنكم الرجس أهل البيت ويطهركم تطهيرا»"
summary:
  ar: "رواية عائشة عند صفية بنت شيبة في باب فضائل أهل بيت النبي؛ أدخل النبي الحسن والحسين وفاطمة وعليا تحت المرط المرحل ثم تلا آية التطهير (الأحزاب 33) — من أظهر النصوص في حد أهل البيت عند أهل السنة."
