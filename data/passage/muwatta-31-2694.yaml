label: { ar: "الموطأ 2694 — يحيى بن سعيد: عمر يأكل الخبز بالسمن ثم يمتنع عنه حتى يحيا الناس", en: "Muwatta 2694", es: "Muwatta 2694", fr: "Muwatta 2694", ur: "موطا 2694", tr: "El-Muvatta 2694 — Yahya bin Said: Ömer, tereyağıyla ekmek yerdi, sonra insanlar iyileşinceye kadar bundan uzak dururdu.", id: "Al-Muwatta 2694 — Yahya bin Saeed: Umar biasa makan roti dengan ghee, kemudian ia berhenti memakannya sampai orang-orang sembuh." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب كان يأكل خبزا بسمن، فدعا رجلا من أهل البادية فجعل يأكل ويتبع اللقمة وضر الصحفة، فقال عمر: كأنك مقفر؟ فقال: والله ما أكلت سمنا ولا رأيت أكلا به منذ كذا وكذا. فقال عمر: لا آكل السمن حتى يحيا الناس من أول ما يحيون. {cite:muwatta-maruf-1997 p.521} {cite:muwatta-maruf-1997 p.522}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ömer ibn el-Hattab'ın tereyağı sürülmüş ekmek yediğini ve yanına bir Bedevi adamı davet ettiğini anlatır. Adam yemeye başladı, her lokmayı dikkatlice yedi ve tabağı kemirdi. Ömer, \"Yiyecekten mahrum kalmış gibi görünüyorsun!\" dedi. Adam, \"Allah'a yemin ederim ki, o kadar uzun zamandır tereyağı yemedim ve tereyağı sürülmüş yemek görmedim.\" diye cevap verdi. Ömer, \"İnsanlar doğmadan önceki gibi yaşayana kadar tereyağı yemeyeceğim.\" dedi. {cite:muwatta-maruf-1997 s.521} {cite:muwatta-maruf-1997 s.522}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Umar ibn al-Khattab sedang makan roti dengan ghee (minyak samin) ketika ia mengundang seorang pria Badui untuk bergabung dengannya. Pria itu mulai makan, mengikuti setiap gigitan dan menggerogoti piring. Umar berkata, \"Kau tampak seperti orang yang kekurangan makanan!\" Pria itu menjawab, \"Demi Allah, aku sudah lama tidak makan ghee atau melihat makanan yang mengandungnya.\" Umar berkata, \"Aku tidak akan makan ghee sampai orang-orang hidup seperti sebelum mereka dilahirkan.\" {cite:muwatta-maruf-1997 p.521} {cite:muwatta-maruf-1997 p.522}"
