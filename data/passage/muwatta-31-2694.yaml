label: { ar: "الموطأ 2694 — يحيى بن سعيد: عمر يأكل الخبز بالسمن ثم يمتنع عنه حتى يحيا الناس", en: "Muwatta 2694" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب كان يأكل خبزا بسمن، فدعا رجلا من أهل البادية فجعل يأكل ويتبع اللقمة وضر الصحفة، فقال عمر: كأنك مقفر؟ فقال: والله ما أكلت سمنا ولا رأيت أكلا به منذ كذا وكذا. فقال عمر: لا آكل السمن حتى يحيا الناس من أول ما يحيون. {cite:muwatta-maruf-1997 p.521} {cite:muwatta-maruf-1997 p.522}"
