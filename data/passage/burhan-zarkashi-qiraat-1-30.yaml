text: "… المنقولة عن الأئمة الأثبات. أحببت أن أملى كتابًا يصغر حجمه ويكثر علمه، أقتصر منه على ذكر الإعراب ووجوه القراءات فأتيت به على ذلك. وبدأ كتابه بالحديث عن الاستعاذة والبسملة، وهو فى أثناء حديثه يعرض لرأى الكوفيين والبصريين وأشعار العرب ويشير …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 30، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
