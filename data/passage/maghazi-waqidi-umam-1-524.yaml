text: "… يَعقوب بن زيد، عن أَبيه، قال : كان يومثلٍ يُفرَّق بين الأُختين إذا بلغتا، وبين الأُمّ وابنتها إذا بلغت، وكانت الأُمّ تُباع، وولدها الصِّغار، من المشركين من العرب، ومن يهود المدينة وتَيْماءَ وخَيْبر يخرجون بهم، فإذا كان الوليد صغيرًا ليس …"
