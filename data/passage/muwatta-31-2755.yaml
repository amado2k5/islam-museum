label: { ar: "الموطأ 2755 — مالك: لا خير في الشطرنج وكره اللعب بها وبغيرها من الباطل", en: "Muwatta 2755", es: "Muwatta 2755", fr: "Muwatta 2755", ur: "موطا 2755", tr: "Al-Muwatta 2755 — Malik: Satrançta hiçbir hayır yoktur ve satranç ile diğer yanlış oyunları oynamak hoş karşılanmaz.", id: "Al-Muwatta 2755 — Malik: Tidak ada kebaikan dalam catur, dan memainkan catur serta permainan-permainan sesat lainnya adalah perbuatan yang tidak disukai." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: لا خير في الشطرنج، وكرهها. وسمعته يكره اللعب بها وبغيرها من الباطل، ويستدل بآية سورة يونس في أن ما بعد الحق إلا الضلال. {cite:muwatta-maruf-1997 p.548}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Satrançta hiçbir hayır yoktur ve ondan hoşlanmazdı. Ayrıca satranç ve diğer batıl oyunları oynamaktan da hoşlanmadığını duydum ve hakikatten sonra sadece sapıklık olduğunu delil olarak Yunus Suresi'nden bir ayet gösterdi. {cite:muwatta-maruf-1997 s.548}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Tidak ada kebaikan dalam catur, dan dia tidak menyukainya. Aku juga mendengar dia tidak menyukai permainan catur dan permainan-permainan kebohongan lainnya, dan dia mengutip ayat dari Surah Yunus sebagai bukti bahwa setelah kebenaran hanya ada kesesatan. {cite:muwatta-maruf-1997 p.548}"
