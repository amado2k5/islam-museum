label: { ar: "صحيح البخاري 791 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 791 — the orphan and the father lost", ur: "صحیح بخاری 791 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 791 — El huérfano y el padre perdido", fr: "Sahih al-Bukhari 791 — L'orphelin et le père perdus" }
text: "حَدَّثَنَا حَفْصُ بْنُ عُمَرَ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ سُلَيْمَانَ، قَالَ سَمِعْتُ زَيْدَ بْنَ وَهْبٍ، قَالَ رَأَى حُذَيْفَةُ رَجُلاً لاَ يُتِمُّ الرُّكُوعَ وَالسُّجُودَ قَالَ مَا صَلَّيْتَ، وَلَوْ مُتَّ مُتَّ عَلَى غَيْرِ الْفِطْرَةِ الَّتِي فَطَرَ اللَّهُ مُحَمَّدًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 791، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 791 (Call to Prayers (Adhaan)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 791، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 791 (Llamada a la oración (Adhan)), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un hadith du Sahih al-Bukhari, n° 791 (Appel à la prière (Adhan)), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages consacrés à la figure paternelle."
