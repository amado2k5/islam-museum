label: { ar: "الموطأ 197 — علي بن حسين: كان يكبر كلما خفض ورفع", en: "Muwatta 197" }
text: "كان رسول الله يكبر في الصلاة كلما خفض ورفع، فلم تزل تلك صلاته حتى لقي الله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن علي بن حسين بن علي بن أبي طالب مرسلاً، في باب افتتاح الصلاة: كان النبي يكبر في الصلاة كلما خفض ورفع، ولم تزل تلك صلاته حتى لقي الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب وعبد الرزاق والشافعي ومحمد بن الحسن، وينقل عن ابن عبد البر أنه لا يعلم بين رواة الموطأ خلافاً في إرساله، وأن من وصله عن مالك عن علي بن الحسين عن أبيه أو عن علي بن أبي طالب أخطأ، ولا يصح فيه إلا ما في الموطأ مرسلاً (التمهيد 9/173). {cite:muwatta-maruf-1997 p.125}"
