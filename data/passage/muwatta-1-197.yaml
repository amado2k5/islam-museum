label: { ar: "الموطأ 197 — علي بن حسين: كان يكبر كلما خفض ورفع", en: "Muwatta 197", es: "Muwatta 197", fr: "Muwatta 197", ur: "موطا 197", tr: "Al-Muwatta 197 — Ali bin Hüseyin: Başını her eğdiğinde veya kaldırdığında \"Allahu Ekber\" derdi.", id: "Al-Muwatta 197 — Ali bin Hussein: Beliau mengucapkan \"Allahu Akbar\" setiap kali menundukkan atau mengangkat kepalanya." }
text: "كان رسول الله يكبر في الصلاة كلما خفض ورفع، فلم تزل تلك صلاته حتى لقي الله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن علي بن حسين بن علي بن أبي طالب مرسلاً، في باب افتتاح الصلاة: كان النبي يكبر في الصلاة كلما خفض ورفع، ولم تزل تلك صلاته حتى لقي الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب وعبد الرزاق والشافعي ومحمد بن الحسن، وينقل عن ابن عبد البر أنه لا يعلم بين رواة الموطأ خلافاً في إرساله، وأن من وصله عن مالك عن علي بن الحسين عن أبيه أو عن علي بن أبي طالب أخطأ، ولا يصح فيه إلا ما في الموطأ مرسلاً ⁦(التمهيد 9/173)⁩. {cite:muwatta-maruf-1997 p.125}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, dari Ali ibn Husayn ibn Ali ibn Abi Talib, sebagai hadits mursal, dalam surah tentang pembukaan salat: Nabi (shalawat dan salam kepadanya) biasa mengucapkan takbir (Allahu Akbar) dalam salat setiap kali beliau sujud atau berdiri, dan kebiasaan ini tetap beliau lakukan hingga beliau bertemu dengan Allah. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, Ibnu Wahb, Abd al-Razzaq, al-Shafi'i, dan Muhammad ibn al-Hasan. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa ia tidak mengetahui adanya perbedaan pendapat di antara para perawi al-Muwatta' mengenai status mursalnya, dan bahwa siapa pun yang menghubungkannya dari Malik, dari Ali ibn Husayn, dari ayahnya, atau dari Ali ibn Abi Talib, telah keliru. Tidak ada yang sahih kecuali apa yang terdapat dalam al-Muwatta' sebagai hadits mursal (al-Tamhid 9/173). {cite:muwatta-maruf-1997 p.125}"
