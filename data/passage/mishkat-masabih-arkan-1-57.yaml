text: "… هريرة، وكذا غير هذا من نحو هذه الأحاديث لم يذكر في بعضها الصوم، وفي بعضها الزكاة، وذكر في بعضها صلة الرحم، وفي بعضها أداء الخمس، ولم يقع في بعضها ذكر الإيمان، فتفاوتت هذه الأحاديث في عدد خصال الإيمان زيادة ونقصاناً، …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 57، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
