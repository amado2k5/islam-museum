label: { ar: "صحيح البخاري 4124 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4124 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4124 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4124 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "وَزَادَ إِبْرَاهِيمُ بْنُ طَهْمَانَ عَنِ الشَّيْبَانِيِّ، عَنْ عَدِيِّ بْنِ ثَابِتٍ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ، قَالَ رَسُولُ اللَّهِ يَوْمَ قُرَيْظَةَ لِحَسَّانَ بْنِ ثَابِتٍ \" اهْجُ الْمُشْرِكِينَ، فَإِنَّ جِبْرِيلَ مَعَكَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4124، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4124 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4124، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4124 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
