text: "فصل في نسبه وَلِ عِ وهو خير أهل الأرض نسباً على الإطلاق، فلنسبه من الشرف أعلى ذِرْوة، وأعداؤه كانوا يشهدون له بذلك، ولهذا شهد له به عدوُّه إذ ذاك أبو سفيان بين يدي مَلِك الرّوم البخاري:، فأَشرف القوم قومُه، وأَشرف …"
