label: { ar: "جامع الترمذي 3727 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 3727 — what was made lawful; what is not lawful", ur: "جامع ترمذی 3727 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 3727 — lo que se ha hecho lícito; lo que no es lícito", fr: "Jami' al-Tirmidhi 3727 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Cami' el-Tirmizi 3727 — Neler caizdir, neler caiz değildir", id: "Jami' al-Tirmidhi 3727 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… عَنْ سَالِمِ بْنِ أَبِي حَفْصَةَ، عَنْ عَطِيَّةَ، عَنْ أَبِي سَعِيدٍ، قَالَ قَالَ رَسُولُ اللَّهِ لِعَلِيٍّ \" يَا عَلِيُّ لاَ يَحِلُّ لأَحَدٍ أَنْ يُجْنِبَ فِي هَذَا الْمَسْجِدِ غَيْرِي وَغَيْرَكَ \". قَالَ عَلِيُّ بْنُ الْمُنْذِرِ قُلْتُ لِضِرَارِ بْنِ صُرَدَ مَا مَعْنَى هَذَا الْحَدِيثِ قَالَ لاَ يَحِلُّ لأَحَدٍ يَسْتَطْرِقُهُ جُنُبًا غَيْرِي وَغَيْرُكَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3727، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3727 (Chapters on Virtues), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3727، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3727 (Capítulos sobre las virtudes), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3727 (Chapitres sur les vertus), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Cami' el-Tirmizi'de 3727 numaralı hadis, helal ve haram olanı belirtir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinlerle bu konuyu ele almaktadır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3727, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
