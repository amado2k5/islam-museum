label: { ar: "صحيح البخاري 7189 — الأب والأبوة", en: "Sahih al-Bukhari 7189 — the father and fatherhood", ur: "صحیح بخاری 7189 — باپ اور والدیت", es: "Sahih al-Bukhari 7189 — El padre y la paternidad", fr: "Sahih al-Bukhari 7189 — Le père et la paternité" }
text: "… ابْنِ عُمَرَ، بَعَثَ النَّبِيُّ خَالِدًا ح وَحَدَّثَنِي نُعَيْمٌ أَخْبَرَنَا عَبْدُ اللَّهِ أَخْبَرَنَا مَعْمَرٌ عَنِ الزُّهْرِيِّ عَنْ سَالِمٍ عَنْ أَبِيهِ قَالَ بَعَثَ النَّبِيُّ خَالِدَ بْنَ الْوَلِيدِ إِلَى بَنِي جَذِيمَةَ فَلَمْ يُحْسِنُوا أَنْ يَقُولُوا أَسْلَمْنَا. فَقَالُوا صَبَأْنَا صَبَأْنَا، فَجَعَلَ خَالِدٌ يَقْتُلُ وَيَأْسِرُ، وَدَفَعَ إِلَى كُلِّ رَجُلٌ مِنَّا أَسِيرَهُ، فَأَمَرَ كُلَّ رَجُلٍ مِنَّا أَنْ يَقْتُلَ أَسِيرَهُ، فَقُلْتُ وَاللَّهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7189، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7189 (Judgments (Ahkaam)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7189، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7189 (Juicios (Ahkaam)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7189 (Jugements), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
