label: { ar: "سنن ابن ماجه 2714 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan Ibn Majah 2714 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن ابن ماجہ 2714 — وصیت یا آخری نصیحت، ترکہ اور میراث" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ شُعَيْبِ بْنِ شَابُورَ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ يَزِيدَ بْنِ جَابِرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، أَنَّهُ حَدَّثَهُ عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ إِنِّي لَتَحْتَ نَاقَةِ رَسُولِ اللَّهِ يَسِيلُ عَلَىَّ لُعَابُهَا فَسَمِعْتُهُ يَقُولُ \" إِنَّ اللَّهَ قَدْ أَعْطَى كُلَّ ذِي حَقٍّ حَقَّهُ أَلاَ لاَ وَصِيَّةَ لِوَارِثٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2714، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2714 (The Chapters on Wills), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2714، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
