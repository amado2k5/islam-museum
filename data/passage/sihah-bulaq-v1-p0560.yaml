text: |-
  عصب)
  لا أهل له والعزية التى لازوج لها والاسم العزبة والعزوبة بقال تعزب فلان زما ناثم تاهل
  وعزب عنى فلان يعزب ويعزب أى بعد وعاب وعزب عن فلان حلمسه وأعز به اللّٰه وأعزبت
  الابل أى بعدت فى المرحى لا تروح وأعزب القوم فهسم معزبون أى عزبت ابله-م والمعزابة
  الرجل الذى يعزب بماشيه عن الناس فى المرعى وكذلك الذى طالت عزبته والعازب
  الكال البعيد وقد أعزينا أى أصبناه وابل عزيب أى لا تروح على الحى وهو جع عازب مثل
  غازوغزىّ و«راوة الاعزاب هراوة الذين يبعدون بابلهم فى المرعى ويشبه بها الفرس وسوام
  معزب بالتشديد( ١ ا اعزب به عن الداروفى الحديث من قرأ القرآن فى أربمين ليلة فقد عزب
  أى بعد عهده بما ابتدأه منه وعزب طهرالمرأة اذا ئاب عنها زوجها وقال الدابغسة
  شعب العلافيات بين فروجهم * والمصنات عوازب الاطهار
  وعزبت الارض اذا لم يكن بها أحد مخصبة كانت أو مجدية سب لعسيب من السعف
  نويق الكرب لم ينبت عليه الخوص ومانبت عليه اللحوص فهو السعف وعسيب الذنب منبت
  من الجلد والعظم وعسيب اسم جبل قال امر والقيس أجارتناان الخطوب تنوب
  وانى مقيم ما أقام عسيب والعسيب الكراء الذى يؤخذ على ضراب الفهل ونهى عن عسب
  الغحل تقول عسب فل يعسبه أى أكراه وعسب الفمل أيضاضرابه وية ال ماؤه قال زهمي
  هجوة وما أخذوا غلاماه ولولاعسبه لتركتموه • وشرمنيجة فحل معار
  واستعسبت الفرس اذا استودقت واليعسوب ملك النحل ومنه قيل للسيد يصوب قومه
  والبعسوب أيضاطأ وأطول من الجرادة لايضم جماحه اذا وقع تشبه به الخيل فى الضمر
  قال بشر أبوصبية شعت تطيف بشخصه • كوالح أمثال البعاسيب ضمر
  والياءفيهن زوائدلانه ليس فى الكلام فعاول غير صعفوق شب) العشب السكلا
  الرطب ولا يقال له حشيش حتى يهيج تقول منه بلدعاشب ولا يقال فى ماضبه الا آعشبت
  الارض اذا أنبتت العشب وبعير عاشب يرعى العشب وأعشب القوم أصابوا عشبا وأرض
  معشبة وعشيبة ومكان عشيب بين العشاية واعش وشبت الارض أى كثر عشبها وهو للمبالغة
  كقولك خشن واخشوشن وأرض فيها تعاشيب اذا كان فيهاعشب نبذمتفرّق لا واحدلها
  والعشبة بالتحريث الشاب الكبرة وكذلك العشمة بالميم يقال سألته فأعشبنى أى أعطانى ناقة
  مسنة وشيخ عشبة وعجوز عشبة أى هم وهمة وعدال عشب ليس فيهسم صغير وقال
  جعت منهم عشباشهابرا ⁦( عصب )⁩ العصبة واحد المصب والاعصاب وهى أطناب
  المفاصل تقول عصب اللحم بالكسرآى كثرعصبه وانعصب اشتد والمعصوب الشديد
  اكتناز اللحم والعصب الطى الشديد ورجل معصوب الخلق وجارية معصوبة حسنة العصب
  أى مجدولة انخلق والمعصوب فى لغة هذيل الجائع والمعه ب الذى بعصب وسطه من الجوع
  وقال أبو عبيدهو الذى عصبته السنون أى أكات ماله وتقول أيضاعصب رأسه بالعصابة
  تعصيباوعصبة الرجل بنوه وقرابتة لابيه واغماسم واعصبة لانه-م تصبوا به أى أحاطوابه
  فالأب طسرف والابن طرف والعمّ جانب والأخ جانب والهع العصبات والتعصب من
  العصبية وتعصب أى شد العصابة والعصبة من الرجال مابين العشرة الى الاربعين والعصب
  إكم
  ب
