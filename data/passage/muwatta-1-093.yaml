label: { ar: "الموطأ 93 — عمر يصلي الصبح ليلة طُعن وجرحه يثعب دماً", en: "Muwatta 93", es: "Muwatta 93", fr: "Muwatta 93", ur: "موطا 93", tr: "El-Muvatta 93 — Ömer, bıçaklandığı gece sabah namazını kıldı ve yarasından kan fışkırıyordu.", id: "Al-Muwatta 93 — Umar melaksanakan salat subuh pada malam ia ditikam dan lukanya mengeluarkan banyak darah." }
text: "نعم، ولا حظ في الإسلام لمن ترك الصلاة"
summary:
  ar: "أول حديث في باب العمل فيمن غلبه الدم من جرح أو رعاف. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه أن المسور بن مخرمة أخبره أنه دخل على عمر بن الخطاب في الليلة التي طُعن فيها فأيقظه لصلاة الصبح، فقال عمر: نعم، ولا حظ في الإسلام لمن ترك الصلاة، فصلى وجرحه يسيل دماً. ويذكر المحقق أن عبد الرزاق رواه بأسانيد من غير طريق مالك عن المسور أنه دخل هو وابن عباس على عمر حين طُعن. {cite:muwatta-maruf-1997 p.81}"
  tr: "Yaradan veya burun kanamasından dolayı kan kaybeden bir kişiyle ilgili ameller bölümündeki ilk hadis. Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayet ettiğine göre, el-Misver ibn Makhrama, kendisine Ömer ibn el-Hattab'ın bıçaklandığı gece yanına girdiğini ve onu sabah namazı için uyandırdığını bildirmiştir. Ömer, \"Evet, namazı terk edenin İslam'da hiçbir payı yoktur\" demiştir. Böylece yarası hala kanarken namaz kılmıştır. Araştırmacı, Abd el-Razzaq'ın, Malik'inkinden farklı rivayet zincirleriyle, el-Misver'den rivayet ederek, kendisinin ve İbn Abbas'ın Ömer bıçaklandığı sırada yanına girdiklerini belirttiğini aktarmaktadır. {cite:muwatta-maruf-1997 s.81}"
  id: "Hadits pertama dalam bab tentang amalan yang berkaitan dengan seseorang yang mengalami pendarahan akibat luka atau mimisan. Diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya, bahwa al-Miswar ibn Makhrama memberitahunya bahwa ia menemui Umar ibn al-Khattab pada malam ia ditikam dan membangunkannya untuk salat subuh. Umar berkata: \"Ya, dan tidak ada bagian dalam Islam bagi orang yang meninggalkan salat.\" Maka ia salat selagi lukanya masih berdarah. Peneliti menyebutkan bahwa Abd al-Razzaq meriwayatkannya dengan sanad selain Malik, dari al-Miswar, bahwa ia dan Ibn Abbas menemui Umar ketika ia ditikam. {cite:muwatta-maruf-1997 p.81}"
