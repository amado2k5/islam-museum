label: { ar: "الموطأ 93 — عمر يصلي الصبح ليلة طُعن وجرحه يثعب دماً", en: "Muwatta 93" }
text: "نعم، ولا حظ في الإسلام لمن ترك الصلاة"
summary:
  ar: "أول حديث في باب العمل فيمن غلبه الدم من جرح أو رعاف. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه أن المسور بن مخرمة أخبره أنه دخل على عمر بن الخطاب في الليلة التي طُعن فيها فأيقظه لصلاة الصبح، فقال عمر: نعم، ولا حظ في الإسلام لمن ترك الصلاة، فصلى وجرحه يسيل دماً. ويذكر المحقق أن عبد الرزاق رواه بأسانيد من غير طريق مالك عن المسور أنه دخل هو وابن عباس على عمر حين طُعن. {cite:muwatta-maruf-1997 p.81}"
