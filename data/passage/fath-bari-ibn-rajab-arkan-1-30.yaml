text: "… الجوارحِ. وخَرَّجَ البُخَارِيُّ مِنْ حدِيثِ: - سُلّيِّمَانَ بْنٍ بِلالٍ، عَنْ عَبْدِ الّهِبْنِ دِينَار، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيَ وَلَّقَالَ: الإِيمَانُ بِضَعٌ وَسَتُّونَ شُعْبَةً، وَالحَيَاءُ شُعْبَّةٌ مِنَ الإِيمَانِ. وخرَّجهُ مسلمٌ من هذا الوجهِ، ولفظُهُ: بضعٌ وسبعونَ. وخرجه مسلمٌ …"
summary:
