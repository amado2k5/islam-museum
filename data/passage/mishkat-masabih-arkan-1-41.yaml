text: "… اللفظ، وإلى أنه تعالى فصل بينهما في عامة التنزيل بالعطف، وإلى حديث جبرئيل عليلا، ومن قال بالثاني: نظر إلى ما ورد من قوله: الإيمان معرفة بالقلب، وإقرار باللسان، وعمل بالأركان، وإلى قوله ويل: الإيمان بضع وسبعون شعبة، قيل: أما تأويل …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 41، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 41, that mentions faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 41 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 1, pág. 41, que menciona la fe como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 1, page 41, évoquant la foi comme une soixantaine de branches; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 41'den bir alıntı, yetmişten fazla inanç dalından bahsetmektedir; bu, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, imanın dallarını ve bir müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 41, menyebutkan sekitar tujuh puluh cabang iman; ini berasal dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
