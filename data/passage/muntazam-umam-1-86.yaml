text: "… من قتل ومنهم من قدى نفسه. والنصف من شوال خاع على مؤنس الخادم وامر بالشخوص الى طرسوس لغز و الروم فخرج. وفى هذه السنة امر المقتدر أن لا يستعان بأحد من اليهود والنصارى فالزموا بيوتهم وأخذوا بلبس العسلى والرتاع من …"
summary:
