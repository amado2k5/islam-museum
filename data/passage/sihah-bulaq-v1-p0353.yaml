text: |-
  ٢٨٨
  باب الرا.)
  والاننى واغادخلته الهاء على أنه واحد من جنس والهع البقرات والباقرجاعة البقر
  مع زعاتهاوالبيور البر قال الشاعر
  أجاعل أنت بية ورامسلعة • ذريعة لك بإن اللّٰه والمطر
  وأهل الين يسمون البقرة ياقورة وكتب النبى على اللّٰه عليه وسلم فى كتاب الصدقة لاهل اليمن
  فى كل ثلاثين ناقورة بقرة والبقاداسم واد قال لبيد
  قيات السيل يركب جانيه * من البقار كالعمد الثقال
  وبقرت الشئبقراقتحته ووسعته ومنه قولهم ابرها عن جنينها أى شق بطنها عن ولدها
  والتبرالتوسع فى العلم والمنال وكان يقال لمحمدين علىّ بن الحسين بن على بن أبى طالب رضى
  اللّٰه عنم الساقرلتسقره فى العلم ويقال فتنة باقرة كداء البطن وهو الماء الاصغر والبقير واليقر
  الاتب وهو قص لاكة تلبه النساءوناقة بقيراذاشق بطنها عن ولدها والبقبرأيضاجاعة
  البروالبقيرى مثال السميهى لعبة للصبيان وهى كومة من تراب و-ولها خطوط وقد يقروا
  أى لعبواذلك قال طفيل الغنوى يصف فرسا
  ابتت فناتنفك حول متالع * لها مثل آثار المبقر ملعب
  وبقر الرجل بالكسر يقربقرا أى حسر وأعبا ويقرمنله ويقال بقر الكاب
  و -قراذارأى البقرفتر كما يقال غزل اذارأى الغزال فلهى وسقر الرج-ل أقام
  بالخضروترك قومه بالبادية قال امر والقيس
  الاهل أتاها والحوادث جة * بأن امرأ القيس بن غلك بيقرا
  والبيقرة اسراع بطاطئ الرجل فيه رأسه وقال الشاءر
  فبات يجتاب شقارى كما * بيقرمن عشى الى الجلد
  كر البكر العذر ا و يمع أبكاد والمعدر البكارة بالفت والبكر المرأة التى ولدت بطنا
  واحداويكرهاولدها والذكر والاتى فيهسواء وقال
  يا يكر بكرين ويا خلب الكبد • أصبحت منى كذراع من عضد.
  وكذلك البكر من الابل قال الهذلى
  مطافيل أبكارحديث نتاجها * تشاب بما مثل ماء المعاقل
  بعى مساها تجرى فى مواضع صلبة بين الجبال والبكر الفتى من الابل والاتى بكرة
  والجمع بكار مثل فرخ وذراخ وبكارة أيضامشل فحل وفحالة قال أبو عسدة البكر من الايل بمنزلة
  الفتى من الناس والبكرة بمنزلة الفتاة والقلوص بنزلة الجارية والبعير بنزلة الانسان والجل
  عنزلة الرجل والناقة بمنزلة المرأة ويجمع فى القلة على أبكر وقد صغره الراجزوجعه بالياء
  قد شريت الاالدهيدهينا • قلبصات وأبيكرنا
  وبكر أبو قبسيلة وهو بكر بن وائل بن قاسط فاذا نسبت الى أبى بكرقات بكرى تخسذف منه
  الاسم الأوّل وكذلك فى كل كنية ويكرة البئرما يستق عليها وجعها بكربالتحريك وهو من
  شواذالمع لان فعلة لا تجمع على فعل الا أحر فامثل حلقة وحلق وحأة وحأوبكرة وبكر
  وبكرات أيضاقال الراجز والبكرات شرهن المائمه يعنى التى لاتدورويقال جاء واعلى
