label: { ar: "الموطأ 694 — مالك: من تجر من المسلمين ومن لم يتجر سواء، ليس عليهم إلا صدقة واحدة في كل عام", en: "Muwatta 694", es: "Muwatta 694", fr: "Muwatta 694", ur: "موطا 694", tr: "El-Muvatta 694 — Malik: Müslüman ticaretle uğraşsın ya da uğraşmasın, her yıl yalnızca bir sadaka vermekle yükümlüdür.", id: "Al-Muwatta 694 — Malik: Baik Muslim berbisnis atau tidak, mereka hanya diwajibkan untuk melakukan satu amal sedekah setiap tahunnya." }
summary:
  ar: "قول لمالك يختم به باب زكاة العروض: من تجر من المسلمين ومن لم يتجر سواء، ليس عليهم إلا صدقة واحدة في كل عام، تجروا فيه أو لم يتجروا. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.348}"
  tr: "Malik, mal zekâtı hakkındaki bölümü şu ifadeyle sonlandırıyor: Müslümanlar ticaret yapsın ya da yapmasın, o yıl ticaretle uğraşıp uğraşmamalarına bakılmaksızın, her yıl yalnızca bir zekât ödeme yükümlülüğüne sahiptirler. Editör, bunun Malik'ten Ebu Mus'ab tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.348}"
  id: "Malik mengakhiri bab tentang zakat barang dagangan dengan pernyataan ini: Baik Muslim berdagang atau tidak, mereka hanya diwajibkan membayar satu kali zakat setiap tahun, terlepas dari apakah mereka berdagang pada tahun itu atau tidak. Editor mencatat bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab. {cite:muwatta-maruf-1997 p.348}"
