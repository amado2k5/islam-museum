label: { ar: "صحيح البخاري 2889 — التحريم", en: "Sahih al-Bukhari 2889 — prohibition", ur: "صحیح بخاری 2889 — تحریم", es: "Sahih al-Bukhari 2889 - prohibición" }
text: "… مَوْلَى الْمُطَّلِبِ بْنِ حَنْطَبٍ، أَنَّهُ سَمِعَ أَنَسَ بْنَ مَالِكٍ ـ يَقُولُ خَرَجْتُ مَعَ رَسُولِ اللَّهِ إِلَى خَيْبَرَ أَخْدُمُهُ، فَلَمَّا قَدِمَ النَّبِيُّ رَاجِعًا، وَبَدَا لَهُ أُحُدٌ قَالَ \" هَذَا جَبَلٌ يُحِبُّنَا وَنُحِبُّهُ \". ثُمَّ أَشَارَ بِيَدِهِ إِلَى الْمَدِينَةِ قَالَ اللَّهُمَّ إِنِّي أُحَرِّمُ مَا بَيْنَ لاَبَتَيْهَا كَتَحْرِيمِ إِبْرَاهِيمَ مَكَّةَ \" اللَّهُمَّ بَارِكْ لَنَا فِي صَاعِنَا وَمُدِّنَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2889، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 2889 (Fighting for the Cause of Allah (Jihaad)), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 2889، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2889 (La lucha por la causa de Alá (Yihad)), menciona la prohibición. El navegador Halal and Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
