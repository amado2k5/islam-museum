text: "… كذا، أخرجوا من كان في قلبه كذا، فهذا يدلُّ على ذاك. - أخبرنا أبو بكر المروذي، قال: سمعت إسحاق بن هلول، قال : سألت ابن ب عيينة عن الإيمان. فقال: قول وعمل، يزيد وينقص، أما تقرأ: لِيَزْدَادُوَا إِيمَانًا مَعَ إيمَٰنِهِمْ …"
summary:
