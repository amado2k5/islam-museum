text: "… كذا، أخرجوا من كان في قلبه كذا، فهذا يدلُّ على ذاك. - أخبرنا أبو بكر المروذي، قال: سمعت إسحاق بن هلول، قال : سألت ابن ب عيينة عن الإيمان. فقال: قول وعمل، يزيد وينقص، أما تقرأ: لِيَزْدَادُوَا إِيمَانًا مَعَ إيمَٰنِهِمْ …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 515، يذكر السؤال عن الإيمان وجوابه، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 515, that mentions the question about faith and its answer, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 515 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 515, que menciona la cuestión de la fe y su respuesta, el aumento y la disminución de la fe; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 515, abordant la question de la foi et sa réponse, à savoir la croissance et le déclin de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın \"Sünnet\" adlı kitabının 515. sayfasından bir alıntı, imanla ilgili soru ve cevabı, imanın artışını ve azalışını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal, \"Al-Sunnah,\" halaman 515, membahas pertanyaan dan jawaban mengenai iman, serta peningkatan dan penurunan iman. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
