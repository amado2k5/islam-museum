label:
  ar: "ابن ماجه 3821 — من جاء بالحسنة فله عشر أمثالها وأزيد"
  en: "Ibn Majah 3821 — Whoever brings a good deed has ten like it and more"
  ur: "ابن ماجہ 3821 — جو نیکی لائے اس کے لیے دس گنا اور اس سے زیادہ ہے"
text: "يقول الله تبارك وتعالى من جاء بالحسنة فله عشر أمثالها وأزيد ومن جاء بالسيئة فجزاء سيئة مثلها أو أغفر ومن تقرب مني شبرا تقربت منه ذراعا ومن تقرب مني ذراعا تقربت منه باعا ومن أتاني يمشي أتيته هرولة ومن لقيني …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3821: من جاء بالحسنة فله عشر أمثالها وأزيد. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3821: Whoever brings a good deed has ten like it and more. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3821: جو نیکی لائے اس کے لیے دس گنا اور اس سے زیادہ ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
