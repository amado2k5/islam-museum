text: "… وَدَلائِلَ مَذْهَبِ أَصْحَابِ الحَديثِ وَالسُّنَّةِ وَاجِبٌ، وَالمنَاظَرَةُ عَلَىٰ سَبيلٍ بَيانِ الحَقِّ وَقَمْعِ البَاطِلِ مِنْ أَفْضَلٍ الأَعْمالِ، وَلا يَكْرَهُ ذَلِكَ إلا جَاهِلٌ مُقَلِّدٌ في دِينِهِ. وحِفْظُ القُرآنِ كُلِّهِ حَسَنٌ، وَأَمَّا حِفْظُ أُمِّ القُرآنِ وَقُرآنٍ مَعَها وَإِنْ قَلَّ فَفَرْضٌ، وَمَنْ كَانَ لَهُ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 309، يرد فيه ذكر الفرض، والواجب، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 309, whose wording mentions the obligatory (fard), the obligatory (wajib), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 309 کا اقتباس جس میں فرض، واجب، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 309, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 309, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 309. sayfasından, farz olan amelleri, görevleri ve mekruh olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları sıralayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 309, yang menyebutkan amalan wajib, kewajiban, dan amalan yang tidak disukai; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
