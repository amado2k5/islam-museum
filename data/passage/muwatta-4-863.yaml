summary:
  ar: "يرويه مالك أنه سمع أهل العلم لا يكرهون السواك للصائم في رمضان في ساعة من ساعات النهار، لا في أوله ولا في آخره، ولم يسمع أحداً من أهل العلم يكرهه أو ينهى عنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (856). {cite:muwatta-maruf-1997 p.417}"
