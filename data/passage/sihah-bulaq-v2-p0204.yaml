text: |-
  •⁦(باب النون)⁩*
  * ⁦(ستى)⁩
  ٣٨٣
  ولا يفطن له فعطى والمرأة مسكينة ومسكير أيضا وانغاقيل بالهاء ومفعيل ومفعال يستوى
  فيهما الذكروالانى تشبيهما بالفقيرة وقوم مساكيزومسكينون أيضا وانما قالواذلك من
  حيث قبل للاناثه-كينات لاجل دخول الهاء والسكنة بكسر السكاف مقتّ الرأس من
  العفق قال بضرب يزيل الهام عن سكاته • وطعن كتشهاق العفاهم بالنهق
  وفى الحديت استرواعلى سكناتكم فة دانقطعت الهجرة أى على مواضعكم ومساكنكم ويقاز
  أيضا الناس على سكنتهم أى على استقامبتهم عن الفراء والسكين معروف بذكرويؤنت
  والغالب عليه التذ كير وقال أبو ذؤيب .
  يرى ناصحافيما بدافاذاخلا • قذلك سكين على الحلق حاذق
  والسكون بالفتح حمن اليمن وسكينة بنت الحسين عليه السلام والعارة السكنية.نسوية
  اليها من السمن للبقروقد يكون للمعزى ويجمع على سمنان مثل عبد وعبدان
  وظهر وظهران قال امى والقيس وذ كرمعزى له
  فتملا بيتنا أقطا وسمنا * وجسبك من غنى شبع ورى
  ومضنت لهم الطعام أسمنههنا اذ التقه بالسحن وقال
  عظيم القفار خوانل واصر أوهبت * له عجوة مسمونة وخمير
  والسمان ان جعلته بائع السمن انصرف وان جعلته من السم"لم يتسرف فى المعرفة وسمنت
  القوم تسمينا زودتهم السمن والتسمين فى لغة أهمل الطائف واليمن التبريد وأتى الجاج بسمكة
  فقال للطباخ ممنها أى بردها والسمين خلاف المهزول وقد سمن سمنا فهو سمين وتسمن مشله
  وسمنه غيره وفى المثل سمن كلبك يأكلك والسمنة بالضم دواء تسمن به النساء وأسمن الرجل
  ملك شيأ ممينا أو أعطى غيره واستسمنه ع_ته سمينا وجاوايس تسحنون أى بطلبون آن يوهب
  لهم السمن وقول الراجز
  فياكرتناجفنة بطينه * لحم جزورغشة سمينة
  أى مسمونة من السمن لامن السمن والسعمانى طارولا يقال سمانى بالتشديد قال الشاعر
  لنفسى تقس من سمانى الاقبره الواحدة سماناة وابلمع سمانيات والسمنية بضم السين وقق
  اليم فرقة من عبدة الاصظام تقول بالتناسخ وتتكر وقوح العلم بالاخبار سنى السنز
  اطريقة يقال استقام فلان على سنى واحد ويقال ا.ض على سننك و- ننك أى على
  وجهك وجاء من الجيل سنى لا يردوحهه وتنح عن سنن الجبل أى عن وجهه وعن منن الطريق
  وسفنه وسنهثلاث لغات وجاءت الروح سفائن اذاجاءت على طريقة واحدة لا تختاف
  والسنة السيرة قال الهذلحة
  فلا تجز عن من سنة أنت سرتها • فأول راض سنة من يسيرها
  والسنة أيضاضرب من تمر المديشة ابن السكيت من الرجل ابلك اذا أحسن رعيها والقيام
  عليهما حتى كانه صقلها قال النابغة
  نبئت حصنا وحيا من بنى أسد • قاموافة الواحمانا غيرمة روب
  ضلت حلومهم عنهسم وغزهم * من المعبدى فى رعى وتعزيب
