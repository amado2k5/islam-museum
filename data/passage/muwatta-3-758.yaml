label: { ar: "الموطأ 758 — أسلم وعمر والناقة العمياء من نعم الجزية: أمر بها فنحرت وبعث بلحمها إلى أزواج النبي ودعا عليه المهاجرين والأنصار", en: "Muwatta 758", es: "Muwatta 758", fr: "Muwatta 758", ur: "موطا 758", tr: "El-Muvatta 758 — Aslam, Ömer ve cizye hayvanlarından kör deve: Peygamberimiz devenin kesilmesini emretti ve etini Peygamberin eşlerine gönderdi; Muhacirler ve Ensar'dan deve için dua etmelerini istedi.", id: "Al-Muwatta 758 — Aslam dan Umar dan unta buta dari ternak jizya: beliau memerintahkan agar unta itu disembelih dan mengirimkan dagingnya kepada istri-istri Nabi dan menyeru kaum Muhajirin dan Ansar untuk mendoakannya." }
text: "أمن نعم الجزية هي أم من نعم الصدقة؟"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن أبيه، أنه قال لعمر بن الخطاب: إن في الظهر ناقة عمياء. فقال عمر: ادفعها إلى أهل بيت ينتفعون بها. قلت: وهي عمياء؟ قال: يقطرونها بالإبل. قلت: كيف تأكل من الأرض؟ فسأل عمر: أمن نعم الجزية هي أم من نعم الصدقة؟ قلت: بل من نعم الجزية. فقال عمر: أردتم والله أكلها. قلت: إن عليها وسم نعم الجزية. فأمر بها عمر فنُحرت، وكان عنده صحاف تسع لا تكون فاكهة ولا طريفة إلا جعل منها فيها فبعث بها إلى أزواج النبي، ويكون الذي يبعث به إلى حفصة ابنته من آخر ذلك فإن كان فيه نقصان كان في حظها، فجعل في تلك الصحاف من لحم تلك الجزور وبعث به إلى أزواج النبي، وأمر بما بقي فصُنع ودعا عليه المهاجرين والأنصار. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.375} {cite:muwatta-maruf-1997 p.376}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da babasından rivayet ederek, Ömer ibn el-Hattab'a şöyle dediğini aktardı: \"Arkada kör bir deve var.\" Ömer dedi ki: \"Ondan fayda görecek bir eve verin.\" Ben dedim ki: \"Kör mü?\" O dedi ki: \"Develerle ondan su çekecekler.\" Ben dedim ki: \"Topraktan nasıl yiyecek?\" Ömer sordu: \"Cizye hayvanlarından mı, yoksa zekât hayvanlarından mı?\" Ben dedim ki: \"Cizye hayvanlarından.\" Ömer dedi ki: \"Allah'a yemin ederim ki, onu yemek istedin!\" Ben dedim ki: \"Cizye hayvanı işareti taşıyor.\" Bunun üzerine Ömer, devenin kesilmesini emretti. Dokuz tabağı vardı, her birinde meyve veya alışılmadık bir şey vardı ve bunlardan bir kısmını Peygamberin eşlerine gönderirdi. Kızı Hafsa'ya gönderdiği kısım bunların sonuncusuydu; Eğer bir eksiklik olursa, bu onun payıydı. Bu yüzden o devenin etinden bir kısmını o tabaklara koydu ve Peygamberin eşlerine gönderdi. Geri kalanının hazırlanmasını emretti ve Muhacirleri (göçmenleri) ve Ensar'ı (yardımcıları) yemeye davet etti. Araştırmacı, Ebu Musab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.375} {cite:muwatta-maruf-1997 s.376}"
  id: "Malik meriwayatkannya dari Zaid bin Aslam, dari ayahnya, yang berkata kepada Umar bin al-Khattab: “Ada seekor unta buta di punggung.” Umar berkata: “Berikanlah kepada keluarga yang akan mendapat manfaat darinya.” Aku bertanya: “Dan apakah unta itu buta?” Beliau menjawab: “Mereka akan mengambil air darinya dengan unta.” Aku bertanya: “Bagaimana ia akan makan dari tanah?” Umar bertanya: “Apakah itu dari ternak jizya (pajak upeti) atau dari ternak zakat (sedekah)?” Aku menjawab: “Itu dari ternak jizya.” Umar berkata: “Demi Allah, kamu ingin memakannya!” Aku menjawab: “Ia memiliki tanda ternak jizya.” Maka Umar memerintahkan agar unta itu disembelih. Ia memiliki sembilan piring, masing-masing berisi buah atau sesuatu yang tidak biasa, dan ia akan menaruh sebagian di dalamnya dan mengirimkannya kepada istri-istri Nabi. Bagian yang ia kirimkan kepada putrinya Hafsa adalah yang terakhir dari semuanya; Jika ada kekurangan, itu adalah bagiannya. Maka beliau menaruh sebagian daging unta itu ke dalam piring-piring tersebut dan mengirimkannya kepada istri-istri Nabi. Beliau memerintahkan agar sisanya disiapkan dan mengundang kaum Muhajirin (imigran) dan Ansar (penolong) untuk ikut serta. Peneliti menyebutkan bahwa Abu Musab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.375} {cite:muwatta-maruf-1997 p.376}"
