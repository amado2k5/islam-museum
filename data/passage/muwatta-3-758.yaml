label: { ar: "الموطأ 758 — أسلم وعمر والناقة العمياء من نعم الجزية: أمر بها فنحرت وبعث بلحمها إلى أزواج النبي ودعا عليه المهاجرين والأنصار", en: "Muwatta 758" }
text: "أمن نعم الجزية هي أم من نعم الصدقة؟"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن أبيه، أنه قال لعمر بن الخطاب: إن في الظهر ناقة عمياء. فقال عمر: ادفعها إلى أهل بيت ينتفعون بها. قلت: وهي عمياء؟ قال: يقطرونها بالإبل. قلت: كيف تأكل من الأرض؟ فسأل عمر: أمن نعم الجزية هي أم من نعم الصدقة؟ قلت: بل من نعم الجزية. فقال عمر: أردتم والله أكلها. قلت: إن عليها وسم نعم الجزية. فأمر بها عمر فنُحرت، وكان عنده صحاف تسع لا تكون فاكهة ولا طريفة إلا جعل منها فيها فبعث بها إلى أزواج النبي، ويكون الذي يبعث به إلى حفصة ابنته من آخر ذلك فإن كان فيه نقصان كان في حظها، فجعل في تلك الصحاف من لحم تلك الجزور وبعث به إلى أزواج النبي، وأمر بما بقي فصُنع ودعا عليه المهاجرين والأنصار. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.375} {cite:muwatta-maruf-1997 p.376}"
