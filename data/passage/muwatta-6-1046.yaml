label: { ar: "الموطأ 1046 — أيوب السختياني عن رجل من أهل البصرة: خرجت إلى مكة فكُسرت فخذي بالطريق، فأرسلت إلى مكة فلم يرخص لي أحد أن أحل، فأقمت على ذلك الماء سبعة أشهر حتى أحللت بعمرة", en: "Muwatta 1046", es: "Muwatta 1046", fr: "Muwatta 1046", ur: "موطا 1046", tr: "El-Muvatta 1046 — Eyyub el-Sakhtiyani, Basralı bir adamın rivayetine göre: Mekke'ye gittim ve yolda bacağım kırıldı. Mekke'ye haber gönderdim, ancak kimse bana ihramdan çıkma izni vermedi. Umre yaparak ihramdan çıkabilene kadar yedi ay orada kaldım.", id: "Al-Muwatta 1046 — Ayyub al-Sakhtiyani, berdasarkan riwayat seorang pria dari Basra: Aku pergi ke Mekah dan pahaku patah di tengah jalan. Aku mengirim pesan ke Mekah, tetapi tidak ada yang mengizinkanku untuk keluar dari keadaan ihram. Aku tinggal di sana selama tujuh bulan sampai aku bisa keluar dari keadaan ihram dengan melaksanakan Umrah." }
summary:
  ar: "يرويه مالك عن أيوب بن أبي تميمة السختياني عن رجل من أهل البصرة كان قديماً، أنه قال: خرجت إلى مكة، حتى إذا كنت ببعض الطريق كُسرت فخذي، فأرسلت إلى مكة، وبها عبد الله بن عباس وعبد الله بن عمر والناس، فلم يرخص لي أحد أن أحل. فأقمت على ذلك الماء سبعة أشهر حتى أحللت بعمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1164) وسويد (567). {cite:muwatta-maruf-1997 p.485} {cite:muwatta-maruf-1997 p.486}"
  tr: "Malik, Ayyub ibn Abi Tamimah al-Sakhtiyani'den, çok eski zamanlarda yaşamış Basralı bir adamdan rivayet ettiğine göre şöyle buyurmuştur: “Mekke'ye doğru yola çıktım ve yolun yarısındayken uyluğum kırıldı. Mekke'ye, Abdullah ibn Abbas, Abdullah ibn Umar ve diğerlerinin bulunduğu yere haber gönderdim, ancak kimse bana ihramdan çıkma izni vermedi. Umre yaparak ihramdan çıkabilene kadar yedi ay orada kaldım.” Araştırmacı, bunun Malik'ten Ebu Musab (1164) ve Suwaid (567) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.485} {cite:muwatta-maruf-1997 s.486}"
  id: "Malik meriwayatkan hadits ini dari Ayyub ibn Abi Tamimah al-Sakhtiyani, dari seorang pria dari Basra yang hidup dahulu kala, yang berkata: “Aku berangkat ke Mekah, dan ketika aku berada di tengah perjalanan, pahaku patah. Aku mengirim pesan ke Mekah, di mana Abdullah ibn Abbas, Abdullah ibn Umar, dan orang-orang lain berada, tetapi tidak seorang pun mengizinkanku untuk keluar dari keadaan ihram. Aku tinggal di sana selama tujuh bulan sampai aku bisa keluar dari ihram dengan melaksanakan Umrah.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1164) dan Suwaid (567). {cite:muwatta-maruf-1997 p.485} {cite:muwatta-maruf-1997 p.486}"
