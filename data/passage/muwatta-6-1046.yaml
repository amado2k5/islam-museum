label: { ar: "الموطأ 1046 — أيوب السختياني عن رجل من أهل البصرة: خرجت إلى مكة فكُسرت فخذي بالطريق، فأرسلت إلى مكة فلم يرخص لي أحد أن أحل، فأقمت على ذلك الماء سبعة أشهر حتى أحللت بعمرة", en: "Muwatta 1046" }
summary:
  ar: "يرويه مالك عن أيوب بن أبي تميمة السختياني عن رجل من أهل البصرة كان قديماً، أنه قال: خرجت إلى مكة، حتى إذا كنت ببعض الطريق كُسرت فخذي، فأرسلت إلى مكة، وبها عبد الله بن عباس وعبد الله بن عمر والناس، فلم يرخص لي أحد أن أحل. فأقمت على ذلك الماء سبعة أشهر حتى أحللت بعمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1164) وسويد (567). {cite:muwatta-maruf-1997 p.485} {cite:muwatta-maruf-1997 p.486}"
