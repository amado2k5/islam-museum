text: "… قال: قال رسول اللّٰه ي : المسلم من سلم المسلمون من لسانه ويده، والمؤمن من أمنه الناس على دمائهم وأموالهم. رواه الترمذي، والنسائي. - وزاد البيهقي في شعب الإيمان. برواية فضالة: وامجاهد من جاهد نفسه في طاعة الله، والمهاجر من …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 4، ص 21، يذكر وصف المؤمن، ووصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 4, p. 21, that mentions a description of the believer, a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 4، ص 21 کا اقتباس جس میں مومن کا وصف، مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 4, pág. 21, que menciona una descripción del creyente y del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de Mishkat al-Masabih, volume 4, page 21, qui décrit le croyant et le musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 4, sayfa 21'den bir alıntı, mümini ve Müslümanı tanımlamaktadır; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 4, halaman 21, menjelaskan tentang orang beriman dan seorang Muslim; ini diambil dari versi pindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
