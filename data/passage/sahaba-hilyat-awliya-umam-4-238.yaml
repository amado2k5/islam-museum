text: "… غير أنها كانت وأدت فى الجاهلية. فقال : إمكما فى النار فادبوا والشريرى فى وجوههما، فأمر بهما فردا والبشرى ترى فى وجوههما رجاء أن يكون حدث شيء. قال : أمى مع أمكما. فقال رجل من المنافقين : وما يغنى عن …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 238، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 238, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 4، ص 238 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 4, pág. 238, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 4, page 238, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur Umam."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 4. resimli cildinin 238. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Müslüman olmayan milletler, dinler, mezhepler ve halklar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 4, halaman 238, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peramban bangsa, agama, sekte, dan masyarakat non-Muslim."
