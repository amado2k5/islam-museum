label: { ar: "سنن أبي داود 213 — ما أُحل", en: "Sunan Abi Dawud 213 — what was made lawful", ur: "سنن ابی داؤد 213 — جو حلال کیا گیا", es: "Sunan Abi Dawud 213: lo que se hizo legal", fr: "Sunan Abi Dawud 213 — ce qui a été rendu licite", tr: "Sunan Abi Davud 213 — İzin verilenler", id: "Sunan Abi Dawud 213 — Apa yang diperbolehkan" }
text: "… ابْنُ عَبْدِ اللَّهِ - عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَائِذٍ الأَزْدِيِّ، - قَالَ هِشَامٌ وَهُوَ ابْنُ قُرْطٍ أَمِيرُ حِمْصَ - عَنْ مُعَاذِ بْنِ جَبَلٍ، قَالَ سَأَلْتُ رَسُولَ اللَّهِ عَمَّا يَحِلُّ لِلرَّجُلِ مِنَ امْرَأَتِهِ وَهِيَ حَائِضٌ قَالَ فَقَالَ \" مَا فَوْقَ الإِزَارِ وَالتَّعَفُّفُ عَنْ ذَلِكَ أَفْضَلُ \". قَالَ أَبُو دَاوُدَ وَلَيْسَ هُوَ - يَعْنِي الْحَدِيثَ - بِالْقَوِيِّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 213، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 213 (Purification (Kitab Al-Taharah)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 213، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 213 (Purificación (Kitab Al-Taharah)), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 213 (Purification (Kitab Al-Taharah)), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 213 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile haleflerinin rivayetlerinden derlenmiş, helal ve haram konularını ele alan Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 213, menyebutkan apa yang diperbolehkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
