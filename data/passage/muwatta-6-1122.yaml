label: { ar: "الموطأ 1122 — ثور بن زيد الديلي عن عبد الله بن عباس: مثل ذلك", en: "Muwatta 1122", es: "Muwatta 1122", fr: "Muwatta 1122", ur: "موطا 1122", tr: "Al-Muwatta 1122 — Sevr ibn Zeyd el-Dili, Abdullah ibn Abbas'tan rivayetle: Aynı", id: "Al-Muwatta 1122 — Thawr ibn Zayd al-Dili atas wewenang Abdullah ibn Abbas: Sama" }
text: "مثل ذلك"
summary:
  ar: "يرويه مالك عن ثور بن زيد الديلي عن عبد الله بن عباس، مثل ذلك، أي مثل قول سعيد بن المسيب في البدنة التي تعطب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1217) وسويد ⁦(527م)⁩. {cite:muwatta-maruf-1997 p.513}"
  tr: "Malik, bunu Sevr ibn Zeyd el-Dili'den, o da Abdullah ibn Abbas'tan rivayet etmiştir; yani, Sa'id ibn el-Musayyab'ın kurbanlık devenin kullanılamaz hale gelmesiyle ilgili söylediğine benzer şekilde. Editör, bunun Malik'ten Ebu Mus'ab (ö. 1217) ve Suveyd (ö. 527) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.513}"
  id: "Malik meriwayatkan hadits ini dari Thawr ibn Zayd al-Dili, yang juga dari Abdullah ibn Abbas, serupa dengan apa yang dikatakan Sa'id ibn al-Musayyab mengenai unta kurban yang menjadi tidak dapat digunakan lagi. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (wafat 1217) dan Suwayd (wafat 527). {cite:muwatta-maruf-1997 p.513}"
