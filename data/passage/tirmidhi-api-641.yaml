text: "… يَحْيَى بْنُ سَعِيدٍ فِي حَدِيثِ عَمْرِو بْنِ شُعَيْبٍ وَقَالَ هُوَ عِنْدَنَا وَاهٍ ‏.‏ وَمَنْ ضَعَّفَهُ فَإِنَّمَا ضَعَّفَهُ مِنْ قِبَلِ أَنَّهُ يُحَدِّثُ مِنْ صَحِيفَةِ جَدِّهِ عَبْدِ اللَّهِ بْنِ عَمْرٍو وَأَمَّا أَكْثَرُ أَهْلِ الْحَدِيثِ فَيَحْتَجُّونَ بِحَدِيثِ عَمْرِو بْنِ شُعَيْبٍ وَيُثْبِتُونَهُ مِنْهُمْ أَحْمَدُ وَإِسْحَاقُ وَغَيْرُهُمَا ‏.‏"
summary:
  ar: "في جامع الترمذي؛ ذكر كتابة كتاب أو إرساله."
  en: "In Jami' al-Tirmidhi; mention of writing or dispatching a letter."
  ur: "جامع ترمذی میں؛ خط لکھنے یا بھیجنے کا ذکر."
  es: "En Jami' al-Tirmidhi; mención de escribir o enviar una carta."
  fr: "Dans Jami' al-Tirmidhi; mention de la rédaction ou de l'envoi d'une lettre."
  tr: "Cami'ül-Tirmizi'de onun bir kitap yazdığı veya gönderdiği belirtilmektedir."
  id: "Dalam Jami’ al-Tirmidhi, disebutkan bahwa beliau menulis sebuah buku atau mengirimkannya."
