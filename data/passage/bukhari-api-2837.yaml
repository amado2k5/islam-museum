label: { ar: "صحيح البخاري 2837 — الأب والأبوة", en: "Sahih al-Bukhari 2837 — the father and fatherhood", ur: "صحیح بخاری 2837 — باپ اور والدیت" }
text: "حَدَّثَنَا حَفْصُ بْنُ عُمَرَ، حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْبَرَاءِ ـ قَالَ رَأَيْتُ رَسُولَ اللَّهِ يَوْمَ الأَحْزَابِ يَنْقُلُ التُّرَابَ وَقَدْ وَارَى التُّرَابُ بَيَاضَ بَطْنِهِ، وَهُوَ يَقُولُ لَوْلاَ أَنْتَ مَا اهْتَدَيْنَا وَلاَ تَصَدَّقْنَا وَلاَ صَلَّيْنَا. فَأَنْزِلِ السَّكِينَةَ عَلَيْنَا وَثَبِّتِ الأَقْدَامَ إِنْ لاَقَيْنَا. إِنَّ الأُلَى قَدْ بَغَوْا عَلَيْنَا إِذَا أَرَادُوا فِتْنَةً أَبَيْنَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 2837، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2837 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2837، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
