label: { ar: "صحيح البخاري 1979 — عمل يعدل عملا أعظم منه", en: "Sahih al-Bukhari 1979 — a deed that equals a greater one", ur: "صحیح بخاری 1979 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… النَّبِيُّ \" إِنَّكَ لَتَصُومُ الدَّهْرَ، وَتَقُومُ اللَّيْلَ \". فَقُلْتُ نَعَمْ. قَالَ \" إِنَّكَ إِذَا فَعَلْتَ ذَلِكَ هَجَمَتْ لَهُ الْعَيْنُ وَنَفِهَتْ لَهُ النَّفْسُ، لاَ صَامَ مَنْ صَامَ الدَّهْرَ، صَوْمُ ثَلاَثَةِ أَيَّامٍ صَوْمُ الدَّهْرِ كُلِّهِ \". قُلْتُ فَإِنِّي أُطِيقُ أَكْثَرَ مِنْ ذَلِكَ. قَالَ \" فَصُمْ صَوْمَ دَاوُدَ كَانَ يَصُومُ يَوْمًا وَيُفْطِرُ يَوْمًا، وَلاَ يَفِرُّ إِذَا لاَقَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1979، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1979 (Fasting), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1979، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
