summary:
  ar: "القسم 60 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب أحاديث الأنبياء»، ويضم فيها النصوص من 3326 إلى 3488 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 60 of Sahih al-Bukhari (Prophets) in the division of the open hadith dataset the museum took its reports from: reports 3326 to 3488 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 60، عنوان «کتاب احادیث الانبیاء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3326 تا 3488۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 60 de Sahih al-Bukhari (Profetas) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3326 al 3488, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 60 du Sahih al-Bukhari (Les Prophètes), dans la base de données ouverte: les hadiths 3326 à 3488 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 60. bölümü \"Peygamberlerin Rivayetleri Kitabı\" başlığını taşımakta olup, 3326'dan 3488'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 60 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Riwayat Para Nabi\" dan berisi teks 3326 hingga 3488, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
