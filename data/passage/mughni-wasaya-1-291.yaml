text: "… فى القبلة أوجب الصحابة حد الفرية أوجب عمر التشهد والجلوس له أوصت أم سلمة أن يصلى عليها سعيد بن زيد أوصت عائشة أن يصلى عليها أبو هريرة أوصى أبو بكر أن يصلى عليه عمر أوصى أبو بكر بالخمس أوصى أبو …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 1، ص 291، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 1, p. 291, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 1، ص 291 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de Al-Mughni de Ibn Qudama, volumen 1, pág. 291, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Mughni d'Ibn Qudama (tome 1, p. 291) mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 1. cildinin 291. sayfasından bir alıntı, vasiyet veya son sözleşme, defin, mezar ve istirahat yerinden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Vasiyetler, Miras, Antik Eserler ve İstirahat Yerleri Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Mughni karya Ibn Qudamah, Volume 1, halaman 291, menyebutkan wasiat atau perjanjian terakhir, pemakaman, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh Wills, Inheritance, Antiquities, and Resting Places Browser."
