text: "… قدم من غَزَّةَ بتجارة له، فورد المدينة مريضاً، فنزل على أخوال أبيه، فمات عندهم. وهو يومئذ ابن خمس وعشرين سنة. ويقال : ثمان وعشرين سنة. وأنّ أباه بعث إليه الزبير بن عبد المطلب، أخاه، فحضر وفاته. ودُفن في دار النابغة. …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 1، ص 101، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
