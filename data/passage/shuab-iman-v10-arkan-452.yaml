text: "… أبو موسى الهروي، حدثنا عباد بن العوام أبو سهل، عن أبي إسحاق، عن عبدالله بن أبي أمامة، عن عبدالله بن كعب بن مالك، عن أبيه قال : قال رسول اللّٰه لِ قِ البذاذة من الإيمان. قال عباد: يعني التقشف كذا …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 452، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
