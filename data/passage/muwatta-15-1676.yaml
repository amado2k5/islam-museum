label: { ar: "الموطأ 1676 — نافع عن ابن عمر: من أذن لعبده أن ينكح فالطلاق بيد العبد لا بيد غيره، وأما أن يأخذ الرجل أمة غلامه فلا جناح عليه", en: "Muwatta 1676", es: "Muwatta 1676", fr: "Muwatta 1676", ur: "موطا 1676", tr: "El-Muvatta 1676 — İbn Ömer'den rivayet edildiğine göre Nafi': Kim kölesinin evlenmesine izin verirse, boşanma kölenin elindedir, başkasının değil. Bir erkeğin kölesinin cariyesini almasına gelince, bunda bir sakınca yoktur.", id: "Al-Muwatta 1676 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Barang siapa mengizinkan budaknya menikah, maka perceraian berada di tangan budak tersebut, bukan orang lain. Adapun seorang laki-laki yang mengambil budak perempuan dari budaknya, tidak ada dosa baginya." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يقول من أذن لعبده أن ينكح، فالطلاق بيد العبد، ليس بيد غيره من طلاقه شيء. فأما أن يأخذ الرجل أمة غلامه، أو أمة وليدته، فلا جناح عليه. {cite:muwatta-maruf-1997 p.87}"
  tr: "Malik, Nafi’den rivayetle Abdullah ibn Umar’ın şöyle dediğini aktarır: “Kim kölesinin evlenmesine izin verirse, boşanma kölenin elindedir; boşanmada başkasının söz hakkı yoktur. Ancak bir erkek, kölesinin cariyesini veya kendi cariyesinin cariyesini alırsa, bunda bir sakınca yoktur.” {cite:muwatta-maruf-1997 s.87}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: “Barangsiapa mengizinkan budaknya menikah, maka perceraian ada di tangan budak itu; tidak ada orang lain yang berhak ikut campur dalam perceraiannya. Namun, jika seorang laki-laki mengambil budak perempuan dari budak laki-lakinya, atau budak perempuan dari budak perempuannya sendiri, maka tidak ada dosa baginya.” {cite:muwatta-maruf-1997 p.87}"
