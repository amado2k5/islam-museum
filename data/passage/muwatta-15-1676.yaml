label: { ar: "الموطأ 1676 — نافع عن ابن عمر: من أذن لعبده أن ينكح فالطلاق بيد العبد لا بيد غيره، وأما أن يأخذ الرجل أمة غلامه فلا جناح عليه", en: "Muwatta 1676" }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يقول من أذن لعبده أن ينكح، فالطلاق بيد العبد، ليس بيد غيره من طلاقه شيء. فأما أن يأخذ الرجل أمة غلامه، أو أمة وليدته، فلا جناح عليه. {cite:muwatta-maruf-1997 p.87}"
