text: "… لا يلبثون خلفك إلاقليلاي أى بعدك قال خلافك وخلفك سواه، وهما لفتان بمعى ؛ وقرتى بهما. قلت : والتزاءتان مشهورتأن، فقرأ خلفك الجهور، وقرأ خلافك ابن عامر والاخران، وهى رواية حفص عن عاصم. قوله ونأى تباعد هو قول أبى عبيدة، …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 393، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 3, p. 393, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 3، ص 393 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
