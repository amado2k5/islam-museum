text: "… وابن مائك القطيعى. كتبت عنه وكان صدوقا، وكان يذكر أنه ولد بنصيبين فى سنة سبع وثلاثين وثلاثمائة، ومات بيغداد فى يوم الثلاثاء الثامن والمشرين من صفر سنة سبع عشرة وأربعمائة، وكنت فيمن صلى عليه، ودفن من يومه. سلامة بن الحسين، …"
summary:
