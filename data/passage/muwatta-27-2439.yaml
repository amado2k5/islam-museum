label: { ar: "الموطأ 2439 — مالك: السارق الذي وجد في البيت وقد جمع المتاع ولم يخرج به", en: "Muwatta 2439", es: "Muwatta 2439", fr: "Muwatta 2439", ur: "موطا 2439", tr: "Al-Muwatta 2439 — Malik: Evde bulunan hırsız, eşyaları toplamış ancak dışarı çıkarmamıştı.", id: "Al-Muwatta 2439 — Malik: Pencuri yang ditemukan di rumah itu telah mengumpulkan barang-barang tetapi belum membawanya keluar." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في السارق يوجد في البيت قد جمع المتاع ولم يخرج به: إنه ليس عليه قطع. وإنما مثل ذلك مثل رجل وضع بين يديه خمرا ليشربها فلم يفعل، فليس عليه حد. ومثل رجل جلس من امرأة مجلسا محرما يريد أن يصيبها حراما فلم يفعل، فليس عليه حد. {cite:muwatta-maruf-1997 p.406}"
  tr: "Malik şöyle dedi: Bizde yerleşik uygulama şudur ki, bir evde eşyaları toplamış ancak almamış bir hırsıza uzuv kesme cezası verilmez. Bu, önüne içmesi için şarap konulmuş ama içmeyen bir adama benzer; o da öngörülen cezaya tabi değildir. Benzer şekilde, bir kadınla haram bir şekilde oturup onunla gayri meşru ilişki kurmayı amaçlayan ama kurmayan bir adama da öngörülen ceza verilmez. {cite:muwatta-maruf-1997 s.406}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita mengenai seorang pencuri yang ditemukan di sebuah rumah yang telah mengumpulkan barang-barang tetapi tidak membawanya adalah bahwa ia tidak dikenai hukuman amputasi. Ini mirip dengan seorang pria yang disodorkan anggur di hadapannya untuk diminum tetapi tidak meminumnya; ia tidak dikenai hukuman yang telah ditetapkan. Demikian pula, seorang pria yang duduk dengan seorang wanita dengan cara yang dilarang dengan maksud untuk melakukan hubungan terlarang dengannya tetapi tidak melakukannya; ia tidak dikenai hukuman yang telah ditetapkan. {cite:muwatta-maruf-1997 p.406}"
