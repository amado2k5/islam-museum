summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في السارق يوجد في البيت قد جمع المتاع ولم يخرج به: إنه ليس عليه قطع. وإنما مثل ذلك مثل رجل وضع بين يديه خمرا ليشربها فلم يفعل، فليس عليه حد. ومثل رجل جلس من امرأة مجلسا محرما يريد أن يصيبها حراما فلم يفعل، فليس عليه حد. {cite:muwatta-maruf-1997 p.406}"
