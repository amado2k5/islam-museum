text: "نوادر جحا الكبرى الوداع، ودعا لهم بخير، ثُمَّ قال لهم: إنَّ مَنْ لا يدفع الحقَّ لصاحبهِ يأخذ له اللَّه حقَّهُ مضاعفاً. ويقال : إن مقاطعة الهواء ما زالت جارية في تلك القرية حتى هذه الأيام : الخفيف رَجِمَ اللَّهُ رُوْحَ …"
summary:
  ar: "أبيات تمدح نصر الدين وتقول إن كلامه سديد وفيه حبل من الحكمة، ويذكر المصدر أن عادة بيع الريح استمرت في القرية. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  en: "Verse praise for Nasr al-Din says his words are sound and carry a rope of wisdom; the source adds that the wind-trade custom continued in the village. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  ur: "نصر الدین کی تعریف میں چند اشعار کہتے ہیں کہ اس کی باتیں درست ہیں اور ان میں حکمت کی رسی ہے، اور ماخذ بتاتا ہے کہ ہوا بیچنے کا رواج گاؤں میں جاری رہا۔ {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  fr: "Des vers à la louange de Nasr al-Din disent que ses paroles sont justes et portent une corde de sagesse ; la source ajoute que la coutume du commerce du vent s'est poursuivie dans le village. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  es: "Unos versos en alabanza de Nasr al-Din dicen que sus palabras son acertadas y llevan una cuerda de sabiduría; la fuente añade que la costumbre del comercio del viento continuó en la aldea. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
