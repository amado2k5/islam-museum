text: "شرح أصول اعتقاد أهل السنة والجماعة قال: نعم. قال: فما الإِيمان؟ قال: أن تؤمن باللَّه وملائكته وكتبه ورسله والبعث بعد الموت والجنة والنار والقدر خيره وشره. قال: فإذا فعلت ذلك فقد آمنت؟ قال: نعم. إسناد صحيح. - أخبرنا محمد بن …"
