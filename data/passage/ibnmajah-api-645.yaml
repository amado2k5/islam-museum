label: { ar: "سنن ابن ماجه 645 — ما لا يحل", en: "Sunan Ibn Majah 645 — what is not lawful", ur: "سنن ابن ماجہ 645 — جو حلال نہیں", es: "Sunan Ibn Majah 645 — lo que no es lícito", fr: "Sunan Ibn Majah 645 — ce qui n'est pas licite" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَمُحَمَّدُ بْنُ يَحْيَى، قَالاَ حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا ابْنُ أَبِي غَنِيَّةَ، عَنْ أَبِي الْخَطَّابِ الْهَجَرِيِّ، عَنْ مَحْدُوجٍ الذُّهْلِيِّ، عَنْ جَسْرَةَ، قَالَتْ أَخْبَرَتْنِي أُمُّ سَلَمَةَ، قَالَتْ دَخَلَ رَسُولُ اللَّهِ ـ صَرْحَةَ هَذَا الْمَسْجِدِ فَنَادَى بِأَعْلَى صَوْتِهِ \" إِنَّ الْمَسْجِدَ لاَ يَحِلُّ لِجُنُبٍ وَلاَ لِحَائِضٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 645، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 645 (The Book of Purification and its Sunnah), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 645، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 645 (El Libro de la Purificación y su Sunnah), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 645 (Le Livre de la Purification et sa Sunna), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
