label: { ar: "الموطأ 2026 — يحيى عن مالك: فيمن دفع إليه مالا قراضا فربح، ثم اشترى من ربح المال أو من جملته جارية فوطئها فحملت، ثم نقص المال: تؤخذ قيمة الجارية من ماله إن كان له مال فيجبر به المال، وإن لم يكن له وفاء بيعت الجارية حتى يجبر المال من ثمنها", en: "Muwatta 2026", es: "Muwatta 2026", fr: "Muwatta 2026", ur: "موطا 2026", tr: "El-Muvatta 2026 — Yahya, Malik'ten rivayet eder: Bir kimse, bir başkasına borç para verip kâr elde ettikten sonra, bu kârın bir kısmından veya tamamından bir cariye satın alıp onunla cinsel ilişkiye girerse ve cariye hamile kalırsa, cariyenin değeri azalır. Eğer parası varsa, cariyenin değeri parasından düşülür ve cariyenin değeri tamamlanır. Eğer yeterli parası yoksa, cariyenin değeri tamamlanana kadar satılır.", id: "Al-Muwatta 2026 — Yahya dari Malik: Mengenai seseorang yang memberi uang kepada orang lain sebagai pinjaman dan memperoleh keuntungan, kemudian membeli seorang budak perempuan dari keuntungan atau sebagian darinya dan bersetubuh dengannya, dan budak perempuan itu hamil, lalu uangnya berkurang: nilai budak perempuan itu diambil dari uangnya jika ia memiliki uang, dan uangnya ditambah dengan uang tersebut. Jika ia tidak memiliki cukup uang, budak perempuan itu dijual sampai uangnya ditambah dengan harga jualnya." }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، فعمل فيه فربح، ثم اشترى من ربح المال أو من جملته جارية، فوطئها، فحملت منه، ثم نقص المال. قال مالك: إن كان له مال أخذت قيمة الجارية من ماله، فيجبر به المال. فإن كان فضل بعد وفاء المال، فهو بينهما على القراض الأول. وإن لم يكن له وفاء بيعت الجارية حتى يجبر المال من ثمنها. {cite:muwatta-maruf-1997 p.229}"
  tr: "Yahya şöyle dedi: Malik, bir adamın başka bir adama kâr paylaşımı ortaklığı (kırad) için para verdiğini, bu parayı yatırıp kâr elde ettiğini, sonra bu kârın bir kısmından veya tamamından bir cariye satın alıp onunla cinsel ilişkiye girdiğini ve cariyenin hamile kaldığını, bunun üzerine paranın azaldığını şöyle ifade etti: Malik dedi ki: Eğer adamın parası varsa, zararı karşılamak için cariyenin değeri parasından alınmalıdır. Para geri ödendikten sonra bir fazlalık kalırsa, bu fazlalık ilk kırad anlaşmasına göre aralarında paylaştırılır. Eğer adamın yeterli parası yoksa, zararı karşılamak için cariye satılmalıdır. {cite:muwatta-maruf-1997 s.229}"
  id: "Yahya berkata: Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain untuk kemitraan bagi hasil (qirad), yang kemudian menginvestasikannya dan memperoleh keuntungan, lalu membeli seorang budak perempuan dari keuntungan atau sebagian darinya, bersetubuh dengannya, dan budak perempuan itu hamil, kemudian uangnya berkurang: Malik berkata: Jika dia memiliki uang, nilai budak perempuan itu harus diambil dari uangnya untuk mengganti kerugian. Jika ada surplus setelah uang dikembalikan, maka surplus itu akan dibagi di antara mereka sesuai dengan perjanjian qirad semula. Jika dia tidak memiliki cukup uang, budak perempuan itu harus dijual untuk mengganti kerugian dari harganya. {cite:muwatta-maruf-1997 p.229}"
