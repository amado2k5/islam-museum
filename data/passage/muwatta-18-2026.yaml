label: { ar: "الموطأ 2026 — يحيى عن مالك: فيمن دفع إليه مالا قراضا فربح، ثم اشترى من ربح المال أو من جملته جارية فوطئها فحملت، ثم نقص المال: تؤخذ قيمة الجارية من ماله إن كان له مال فيجبر به المال، وإن لم يكن له وفاء بيعت الجارية حتى يجبر المال من ثمنها", en: "Muwatta 2026" }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، فعمل فيه فربح، ثم اشترى من ربح المال أو من جملته جارية، فوطئها، فحملت منه، ثم نقص المال. قال مالك: إن كان له مال أخذت قيمة الجارية من ماله، فيجبر به المال. فإن كان فضل بعد وفاء المال، فهو بينهما على القراض الأول. وإن لم يكن له وفاء بيعت الجارية حتى يجبر المال من ثمنها. {cite:muwatta-maruf-1997 p.229}"
