text: "… اذا خرجتم من عندى حمسين مرة - قال ابن حبيق وقال لى حذيفة اتما هى اربعة، عيناك ولسانك وهوا ك وقلبك فانظر عينيك لا تنظر بهما الى ما لا يحل لك، وانظر لسانك لا تقل به شيئا يعلم اللّٰه خلافه …"
summary:
