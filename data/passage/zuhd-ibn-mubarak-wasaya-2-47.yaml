text: "… غيرَ الحقِّ، ولا يُلْقي بيدِه إلى التَّهلُكةِ، فإن حَفِظتَ قولي، فلا يكونَنَّ غائبٌ أحبَّ إليك من الموتِ، ولا بُدَّ لك منه، وإن ضَيَّعتَ وصيَّتي، فلا يكونَنَّ غائبٌ أبغضَ إليك من الموتِ، ولن تُعجِزَه. عن ابن مسعود، فوهمَ. رجاله ثقات، وهو …"
