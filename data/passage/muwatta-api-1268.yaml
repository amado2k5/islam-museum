text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، وَسُلَيْمَانَ بْنِ يَسَارٍ، أَنَّهُمَا كَانَا يَقُولاَنِ فِي الْمَرْأَةِ يُتَوَفَّى عَنْهَا زَوْجُهَا إِنَّهَا إِذَا خَشِيَتْ عَلَى بَصَرِهَا مِنْ رَمَدٍ أَوْ شَكْوٍ أَصَابَهَا إِنَّهَا تَكْتَحِلُ وَتَتَدَاوَى بِدَوَاءٍ أَوْ كُحْلٍ وَإِنْ كَانَ فِيهِ طِيبٌ. قَالَ مَالِكٌ وَإِذَا كَانَتِ الضَّرُورَةُ فَإِنَّ دِينَ اللَّهِ يُسْرٌ."
summary:
  ar: "حديث في موطأ مالك، رقم 1268، يذكر الكحل، وأسماء الأمراض، والدواء، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1268 (Divorce), that mentions kohl for the eye, named diseases, the drug, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1268، جس میں سرمہ، بیماریوں کے نام، دوا، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
