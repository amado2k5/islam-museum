label: { ar: "موطأ مالك 1268 — الكحل، أسماء الأمراض", en: "Muwatta Malik 1268 — kohl for the eye; named diseases", ur: "موطأ مالک 1268 — سرمہ، بیماریوں کے نام", es: "Muwatta Malik 1268 — kohl para los ojos; enfermedades nombradas", fr: "Muwatta Malik 1268 — khôl pour les yeux; maladies nommées", tr: "Muwatta Malik 1268 — Kohl, Hastalık İsimleri", id: "Muwatta Malik 1268 - Kohl, Nama Penyakit" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، وَسُلَيْمَانَ بْنِ يَسَارٍ، أَنَّهُمَا كَانَا يَقُولاَنِ فِي الْمَرْأَةِ يُتَوَفَّى عَنْهَا زَوْجُهَا إِنَّهَا إِذَا خَشِيَتْ عَلَى بَصَرِهَا مِنْ رَمَدٍ أَوْ شَكْوٍ أَصَابَهَا إِنَّهَا تَكْتَحِلُ وَتَتَدَاوَى بِدَوَاءٍ أَوْ كُحْلٍ وَإِنْ كَانَ فِيهِ طِيبٌ. قَالَ مَالِكٌ وَإِذَا كَانَتِ الضَّرُورَةُ فَإِنَّ دِينَ اللَّهِ يُسْرٌ."
summary:
  ar: "حديث في موطأ مالك، رقم 1268، يذكر الكحل، وأسماء الأمراض، والدواء، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1268 (Divorce), that mentions kohl for the eye, named diseases, the drug, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1268، جس میں سرمہ، بیماریوں کے نام، دوا، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1268 (Divorcio), menciona el kohl para los ojos, las enfermedades, el medicamento y la búsqueda de tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, medicamentos y tratamientos."
  fr: "Un rapport du Muwatta Malik, n° 1268 (Divorce), mentionne le khôl pour les yeux, les maladies citées, le médicament et la recherche de traitement. Le Répertoire des médicaments le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta'sında yer alan 1268 numaralı hadiste sürme, hastalıkların isimleri, ilaç ve tedavi konularından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1268, menyebutkan kohl, nama-nama penyakit, obat-obatan, dan pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
