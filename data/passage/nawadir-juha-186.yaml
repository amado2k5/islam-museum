label: { ar: "نوادر جحا الكبرى، ص 83 — «أنت لا تسألني وأنا لا أتكلم»", en: "Nawadir Juha al-Kubra, p. 83 — 'You Do Not Ask Me and I Do Not Speak'", ur: "نوادر جحا الکبریٰ، ص 83 — «تم مجھ سے نہ پوچھو اور میں نہ بولوں»", fr: "Nawadir Juha al-Kubra, p. 83 — « Tu ne me demandes rien et je ne dis rien »", es: "Nawadir Juha al-Kubra, p. 83 — «Tú no me preguntas y yo no hablo»", tr: "Juha'nın Büyük Fıkraları, s. 83 — “Bana sormazsan konuşmam.”", id: "Anekdot Hebat Juha, hlm. 83 — “Jika kau tidak bertanya padaku, aku tidak akan berbicara.”" }
text: "… أنت لا تسألني وأنا لا أتكلم سلّمه يوماً أحدُهم علبةً مغلقةً وقال له: أرجو أن تحفظها إلى أن أعود، ومضت بِضعةُ أيام، ولم يحضر الرجلُ، فقال جحا: عجبا ما تحتوي هذه العلبة؟ ثم فتح الغطاء فوجد فيهَا عسلاً مصفّى من …"
summary:
  ar: "ترك رجل عند جحا صندوقًا مختومًا، وبعد أيام فتحه جحا فوجد عسلًا فلعقه؛ ثم ملأ الصندوق ذرة؛ وحين عاد صاحبه لم يجد فيه إلا الذرة؛ فقال جحا إنك لا تسألني وأنا لا أتكلم. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  en: "A man leaves a sealed box with Juha; days later Juha opens it, finds honey and licks it; he later fills the box with corn; when the owner returns, he finds only corn; Juha says 'you do not ask me and I do not speak'. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  ur: "ایک شخص نے جحا کے پاس ایک مہر بند صندوق رکھوایا؛ کچھ دن بعد جحا نے اسے کھولا تو شہد ملا اور اس نے چاٹ لیا؛ پھر اس نے صندوق مکئی سے بھر دیا؛ مالک لوٹا تو اسے صرف مکئی ملی؛ جحا نے کہا کہ تم مجھ سے نہ پوچھو اور میں نہ بولوں۔ {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  fr: "Un homme laisse à Juha une caisse scellée; quelques jours plus tard, Juha l'ouvre, y trouve du miel et le lèche; il remplit ensuite la caisse de maïs; quand le propriétaire revient, il n'y trouve que du maïs; Juha dit: «Tu ne me demandes rien et je ne dis rien.» {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  es: "Un hombre deja con Juha una caja sellada; días después Juha la abre, encuentra miel y la lame; luego llena la caja de maíz; cuando vuelve el dueño, solo encuentra maíz; Juha dice: «Tú no me preguntas y yo no hablo». {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  tr: "Bir adam Juha'ya mühürlü bir kutu bıraktı. Birkaç gün sonra Juha kutuyu açtı ve içinde bal buldu, onu yaladı. Sonra kutuyu mısırla doldurdu. Adam geri döndüğünde, mısırdan başka bir şey bulamadı. Juha, \"Sen bana sormuyorsun, ben de konuşmuyorum.\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 83}"
  id: "Seorang pria meninggalkan sebuah kotak tertutup rapat kepada Juha. Setelah beberapa hari, Juha membukanya dan menemukan madu, yang dijilatnya. Kemudian dia mengisi kotak itu dengan jagung. Ketika pria itu kembali, dia tidak menemukan apa pun kecuali jagung. Juha berkata, \"Kau tidak bertanya padaku, dan aku tidak berbicara.\" {cite:juha-nawadir-kubra-djuwaydi p. 83}"
