text: "و الفرج، فقال له : لماذا أغفات نسخ الكتاب السلطانى فى آخر الكتاب إلى العمال وإثباته فى الديوان ؟، فأجاب جوابا علل فيه، فقال له يا أبا الفرج : ما تركت ذلك إلا حسدا لأبى إسحق على كتابه، وهو والله"
