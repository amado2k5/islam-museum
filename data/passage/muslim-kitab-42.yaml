summary:
  ar: "القسم 42 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرؤيا»، ويضم فيها النصوص من 5897 إلى 5937 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 42 of Sahih Muslim (The Book of Dreams) in the division of the open hadith dataset the museum took its reports from: reports 5897 to 5937 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 42، عنوان «کتاب الرؤیا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5897 تا 5937۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 42 del Sahih Muslim (El Libro de los Sueños) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5897 al 5937 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des rêves), volume 42, qui correspond aux hadiths 5897 à 5937 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 42. bölümü \"Vizyonlar Kitabı\" başlığını taşımakta olup, 5897 ile 5937 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 42 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Penglihatan\" dan berisi teks 5897 hingga 5937, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
