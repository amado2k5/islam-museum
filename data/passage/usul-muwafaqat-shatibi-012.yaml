text: "وقد روي عن عمران بن حصين أنه قال لرجل: إنك امرؤ أحمق. أتجد في كتاب الله الظهر أربعا لا يجهر فيها بالقراءة؟ ثم عدد إليه الصلاة والزكاة ونحو هذا، ثم قال: أتجد هذا في كتاب الله مفسرا؟ إن كتاب الله"
