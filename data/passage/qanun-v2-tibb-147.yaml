text: "… السندي أو الدلاّع أو البطيخ الشامي بلغة أهل المغرب. وهو بارد رطب في الدرجة الثانية، ينفع من الأمراض الحارة والحميات المحرقة، والألزجة الملتهبة، ويسكن العطش، ومع السكنجبين يدر البول، ويغسل المثانة. المعتمد في الأدوية المفردة، الملك المظفّر يوسف بن عمر …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 147، يذكر المرض والمريض، والحمى والوعك، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 147, that mentions illness and the sick, fever, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 147 کا اقتباس جس میں بیماری اور بیمار، بخار، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 147, que menciona la enfermedad y los enfermos, la fiebre, los órganos del cuerpo, el medicamento, los medicamentos y la farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 147, qui mentionne la maladie et les malades, la fièvre, les organes du corps, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 147. sayfasından, hastalık ve hasta, ateş ve halsizlik, vücut organları, ilaç, ilaçlar ve eczacılıktan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 147, yang menyebutkan penyakit dan pasien, demam dan rasa tidak enak badan, organ tubuh, obat-obatan, narkoba dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
