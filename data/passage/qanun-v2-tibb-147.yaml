text: "… السندي أو الدلاّع أو البطيخ الشامي بلغة أهل المغرب. وهو بارد رطب في الدرجة الثانية، ينفع من الأمراض الحارة والحميات المحرقة، والألزجة الملتهبة، ويسكن العطش، ومع السكنجبين يدر البول، ويغسل المثانة. المعتمد في الأدوية المفردة، الملك المظفّر يوسف بن عمر …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 147، يذكر المرض والمريض، والحمى والوعك، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 147, that mentions illness and the sick, fever, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
