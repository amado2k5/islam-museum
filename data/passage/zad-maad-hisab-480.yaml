text: "… الْحَسَنَٰتِ يُذْهِبْنَ الشَّيِّئَانِ [هُود: ١١٤]، وقوله تعالى : إن تَجْتَنِبُوا كَبَآئرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنكُمْ سَيِّئَاتِكُمْ [النّساء: ٣١]، وقوله ل في ا «وأتبع السَّيِّنَةَ الحَسَنَة تَمْحُها [صحيح: أحمد: ٢١٣٥٤] نهو ثابت فى عكسه لقوله تعالى: يَلأيُّهَا الَّذِينَ ءَامَنُواْ لَا …"
