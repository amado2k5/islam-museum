  tr: "\"Başlangıç ve Son\" adlı resimli cilt 4'ün 310. sayfasından, esprili bir anekdot veya fıkra içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
