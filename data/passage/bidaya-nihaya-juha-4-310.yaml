text: "… وكان مع فضله ودينه فيه دعابة وفكاهة وانشراح، روي أن رسول اللّٰه للي رآه يأكل بقثاء رطباً وهو أرمد إحدى العينين، فقال: أَتَأْكُلُ رُطَبا وَأنَّتَ أَرْمَدُ ؟ فقال: إنما آكل من ناحية عيني الصحيحة، فضحك رسول اللّٰه وَاليم وكانت وفاته …"
summary:
  ar: "مقطع من البداية والنهاية، المجلد المصوَّر 4، ص 310، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Bidaya wa-l-Nihaya, scan volume 4, p. 310, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "البدایہ والنہایہ، اسکین جلد 4، ص 310 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
