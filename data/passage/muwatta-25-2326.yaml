summary:
  ar: "بلغ مالكا أن سعيد بن المسيب سئل عن مكاتب كان بين رجلين، فأعتق أحدهما نصيبه، فمات المكاتب وترك مالا كثيرا، فقال: يؤدى إلى الذي تمسك بكتابته ما بقي له، ثم يقتسمان ما بقي بالسوية. {cite:muwatta-maruf-1997 p.359}"
