label: { ar: "الموطأ 2326 — بلغ مالكا عن ابن المسيب: مكاتب بين شريكين أعتق أحدهما نصيبه", en: "Muwatta 2326", es: "Muwatta 2326", fr: "Muwatta 2326", ur: "موطا 2326", tr: "El-Muvatta 2326 — Malik, İbn el-Musayyab'dan şöyle rivayet etmiştir: İki ortak arasında sözleşmeli bir köle vardı; ortaklardan biri kendi payını azat etti.", id: "Al-Muwatta 2326 — Malik meriwayatkan dari Ibn al-Musayyab: Seorang budak terikat kontrak antara dua mitra, salah satu di antaranya membebaskan bagiannya." }
summary:
  ar: "بلغ مالكا أن سعيد بن المسيب سئل عن مكاتب كان بين رجلين، فأعتق أحدهما نصيبه، فمات المكاتب وترك مالا كثيرا، فقال: يؤدى إلى الذي تمسك بكتابته ما بقي له، ثم يقتسمان ما بقي بالسوية. {cite:muwatta-maruf-1997 p.359}"
  tr: "Malik, Sa'id ibn al-Musayyab'a, iki adam arasında azat sözleşmesi bulunan bir köle hakkında soru sorulduğunu, adamlardan birinin kendi payını azat ettiğini, kölenin daha sonra öldüğünü ve geride büyük bir miktar para bıraktığını anlattı. Sa'id ibn al-Musayyab şöyle dedi: \"Kalan kısım, sözleşmeyi elinde tutana verilmeli, geri kalan kısım ise iki adam arasında eşit olarak paylaşılmalıdır.\" {cite:muwatta-maruf-1997 s.359}"
  id: "Malik meriwayatkan bahwa Sa'id ibn al-Musayyab ditanya tentang seorang budak yang memiliki perjanjian pembebasan antara dua orang, dan salah satu dari mereka membebaskan bagiannya. Budak itu kemudian meninggal, meninggalkan sejumlah besar uang. Beliau berkata: Bagian yang tersisa harus diberikan kepada orang yang mempertahankan perjanjian tersebut, dan kemudian kedua orang itu harus membagi sisanya secara merata. {cite:muwatta-maruf-1997 p.359}"
