text: "عض أبي حاتم (٤) ، وابن جرير نسخ كتابه مختصرا . وقد روى وكيع في كتابه عن الأعمش ، عن شقيق - هو أبو وائل - قال : خطب أعرابي من الحي امرأة يقال لها : أم قيس . فأبت"
