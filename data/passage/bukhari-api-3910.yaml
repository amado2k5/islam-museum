label: { ar: "صحيح البخاري 3910 — الأب والأبوة", en: "Sahih al-Bukhari 3910 — the father and fatherhood", ur: "صحیح بخاری 3910 — باپ اور والدیت" }
text: "حَدَّثَنَا قُتَيْبَةُ، عَنْ أَبِي أُسَامَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ أَوَّلُ مَوْلُودٍ وُلِدَ فِي الإِسْلاَمِ عَبْدُ اللَّهِ بْنُ الزُّبَيْرِ، أَتَوْا بِهِ النَّبِيَّ فَأَخَذَ النَّبِيُّ تَمْرَةً فَلاَكَهَا ثُمَّ أَدْخَلَهَا فِي فِيهِ، فَأَوَّلُ مَا دَخَلَ بَطْنَهُ رِيقُ النَّبِيِّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3910، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3910 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3910، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
