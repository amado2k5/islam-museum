label: { ar: "صحيح البخاري 3910 — الأب والأبوة", en: "Sahih al-Bukhari 3910 — the father and fatherhood", ur: "صحیح بخاری 3910 — باپ اور والدیت", es: "Sahih al-Bukhari 3910 — El padre y la paternidad", fr: "Sahih al-Bukhari 3910 — Le père et la paternité", tr: "Sahih el-Buhari 3910 — Baba ve Babalık", id: "Sahih al-Bukhari 3910 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا قُتَيْبَةُ، عَنْ أَبِي أُسَامَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ أَوَّلُ مَوْلُودٍ وُلِدَ فِي الإِسْلاَمِ عَبْدُ اللَّهِ بْنُ الزُّبَيْرِ، أَتَوْا بِهِ النَّبِيَّ فَأَخَذَ النَّبِيُّ تَمْرَةً فَلاَكَهَا ثُمَّ أَدْخَلَهَا فِي فِيهِ، فَأَوَّلُ مَا دَخَلَ بَطْنَهُ رِيقُ النَّبِيِّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3910، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3910 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3910، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3910 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3910 (Mérites des Compagnons de Médine (Ansar)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3910 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3910, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
