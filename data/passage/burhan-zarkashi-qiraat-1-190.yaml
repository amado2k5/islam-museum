text: "… فى المدينة، يقول: ومن المعلوم أن هذه السور كلها مكية إلا البقرة وآل عمران. فأما المكية فلدعوة المشركين إلى إثبات النبوة والوحى، وأما الزهراوان المدنيتان فلمجادلة أهل الكتاب بالتى هى أحسن. ولم يغفل الحديث عن القراءات وإلقراء السبعة، والناسخ والمنسوخ …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 190، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 190, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
