text: "… لَيْسَ فِي التَّمْرِ حُكْرَةٌ. قَالَ ابْنُ الْمُثَنَّى قَالَ عَنِ الْحَسَنِ فَقُلْنَا لَهُ لاَ تَقُلْ عَنِ الْحَسَنِ. قَالَ أَبُو دَاوُدَ هَذَا الْحَدِيثُ عِنْدَنَا بَاطِلٌ. قَالَ أَبُو دَاوُدَ كَانَ سَعِيدُ بْنُ الْمُسَيَّبِ يَحْتَكِرُ النَّوَى وَالْخَبَطَ وَالْبِزْرَ سَمِعْتُ أَحْمَدَ بْنَ يُونُسَ يَقُولُ سَأَلْتُ سُفْيَانَ عَنْ كَبْسِ الْقَتِّ فَقَالَ كَانُوا يَكْرَهُونَ الْحُكْرَةَ وَسَأَلْتُ أَبَا بَكْرِ بْنَ عَيَّاشٍ فَقَالَ اكْبِسْهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3448، يرد فيه ذكر ما كان يُكره، وما كرهه الفقهاء، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 3448 (Wages (Kitab Al-Ijarah)), whose wording mentions what used to be disliked, what the jurists disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 3448، جس کے الفاظ میں جو ناپسند کیا جاتا تھا، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 3448, dont le texte mentionne ce qui était réprouvé, ce que les juristes ont réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 3448, cuyo texto menciona lo que se reprobaba, lo que los juristas reprobaron, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
