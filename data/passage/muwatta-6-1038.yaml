label: { ar: "الموطأ 1038 — مالك: لا بأس أن يبط المحرم خراجه ويفقأ دمله ويقطع عرقه، إذا احتاج إلى ذلك", en: "Muwatta 1038", es: "Muwatta 1038", fr: "Muwatta 1038", ur: "موطا 1038", tr: "El-Muvatta 1038 — Malik: İhramda olan bir hacının, ihtiyaç duyarsa apsesini açmasında, çıbanını patlatmasında veya damarını kesmesinde bir sakınca yoktur.", id: "Al-Muwatta 1038 — Malik: Tidak ada salahnya seorang jamaah haji yang sedang ihram menusuk absesnya, memecahkan bisulnya, atau memotong pembuluh darahnya, jika ia perlu melakukannya." }
summary:
  ar: "قول لمالك: لا بأس أن يبط المحرم خراجه، ويفقأ دمله، ويقطع عرقه، إذا احتاج إلى ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1198). {cite:muwatta-maruf-1997 p.482}"
  tr: "Malik şöyle demiştir: İhramda olan bir hacının, ihtiyaç duyarsa apsesini açmasında, çıbanını patlatmasında veya damarını kesmesinde bir sakınca yoktur. Araştırmacı, bunu Ebu Musab'ın (1198) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.482}"
  id: "Malik berkata: Tidak ada salahnya seorang jamaah haji yang sedang ihram menusuk absesnya, memencet bisulnya, atau memotong pembuluh darahnya, jika ia perlu melakukannya. Peneliti menyebutkan bahwa Abu Mus'ab (1198) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.482}"
