text: "ك 1338 بها، وقد وجدوا الدليل الذي لم يجده، وها أنا أوجدكموه في كتاب الله، أو فيما صح من سنة رسوله، وذلك أهدى لكم مما وجدتم عليه آباءكم، قالوا: لا نعمل بهذا، ولا سمع لك، ولا طاعة، ووجدوا في صدورهم"
