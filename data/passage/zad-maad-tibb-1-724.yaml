text: "… لِعرق النَّسَا: بسم اللَّه الرحمن الرحيم، اللّهُمَّ ربَّ كلِّ شيء، ومليكَ كل شيء، وخالق كل شيء، أنت خلقتني، وأنت خلقت النَّسا، فلا تُسلطه عليَّ بأذى، ولا تُسلطني عليه بقطع، واشفني شفاء لا يُغادر سقماً، لا شافي إلّا أنت. ونعر العرق …"
