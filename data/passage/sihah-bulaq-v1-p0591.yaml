text: |-
  مضارعه يفعل بالكسرسواء كان
  ماضيه مفتوح العين أومكسورها
  فان المفسعل منه فيه تفصيل يفتح
  للمصدرويكسر للزمان والمكان
  الاماشذاه مخسى القاموس
  ٥٠
  ياب اليام)
  (درب
  التباسه بالمصادر والخنابتان ما عن يمين الانف وشماله بينهما الوترة قال الراجز
  أكوى ذوى الاضغان كامنضها * منهم وذا انظنابة العننجيها
  ويقال الخنأية بااهمزخوب ) الخوبة الارض التى لم تغطربين أرضين عطورتين يقال نزلما
  بخوبة من الارض أى بموضع سولارعى بها وقال أبوع رواذاقلت أصابتناخوبة بالحاء
  المهجمة نعناه المجماعة واذاقلت أصابتنا حوبة بالحاء غير دجمة فعناه الحاجة ( خيب
  خاب الرجل خيبة اذ الم ينل ما يطلب وخيبته أنا تخييبا وفى المثل الهيبة خيبة ويقال خيبة
  لزيد وخيبة لزيد فالنصب على اضمارفعل والرفع على الانتداء الكسائى يقال وقعوا
  فى وادى تخيب على تفعل إضم التاء والفاء وكسر العين غير مصروف معناه الباطل
  صل الدال ) ( أب دأب فلان فى عملد أى جد وتعب دأ باودؤوبافهودائب
  قال الراجز
  راحت كماراح أبوربال * قاهى الفؤاددائب الاجفال
  وأدأته أنا والدائبان الليل والنهار والدأب العادة والشأن وقد يحرّك قال الفرّاء أصله
  من دأبت الاأنّ العرب حوّات معناه الى الشأن بب دب على الارضيدب دبيما
  وكل ماش على الارض دابة ودبيب والدابة التى تركب ودابة الارض أحد أشراط الساعة
  وقولهم أكذب من دب ودرج أى أكذب الاحيا والاموات ودب الشيخ أى مشى مش
  رويدا وأديبت الصى أى حلته على الدييب ويقال ما بالداردبى ودبى أى أحد قال
  الكسائى هو من دببت أى ليس فيها من يدب وكذلك مابهادءوىّ ودورىّ" وطورىّ
  لا يتكام بها الافى الجد ودبب الوجه زغبه والدب من السباع والانى دبة وأرض مدبة
  أى ذات دبية وحدب السيل ومدبه موضع جريه يقال تنح عن مدب السيل ومدبه ومدب
  النمل ومدبه فالاسم مكسور والمصدر مفتوح وكذلك المفعل من كل ما كانعلى فعل
  يفعل ١ الديد التى للدهن والدية أيضا الكتيب من الرمل وديبت دية خفية بالكسمر
  والدية بالضم الطريق قال الشاءر
  طها هذربان قل تغميض عينه • على دبة مثل انلحنيف المرعبل
  يقال دعنى ودبتى أى دعنى وطر يقتى وسحيتى وناقة دبوب لا تكاد تمشى من كثرة لجها انما
  تدب وتقول فعلت كذامن شب الى دب وان شئت نوّنت أى من الشباب الى أن دببت على
  العصا والدبدية ضرب من الصوت وأنشد أبو مهدى
  عاثور شرّ أيماعاثور ، دبدية الخيل على المسور
  ( درب الدوبة عادة وجرأة على الحرب وكل أمر وقد درب بالشئ ودردب بهاذا اعتاده
  وضرى به تقول مازلت أعفو عن فلان -تى اتخذهادر بة قال الشاعر
  وفى الحلم ادهان وفى العفودربة • وفى الصدق منياة من الشرفاصدق
  وفى المثل دردب لمساعضه الثقاف أى خضع وذل والثقاف خشبة تسوّى بها الرماح وهوفعلل
  ورحل مدرب ومدرب مثل مجرّب ومحرب وقددر بته الشد ائدحق قوى وهرن عليها
  ودرّ بت البازى عسلى الصيداذاضريته والدرب معروف وأصله المضيق فى الجبل ومنه
  قولهم
