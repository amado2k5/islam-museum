text: "ى كلامه. ولشيخنا العلامة القاضي بشير الدين القنوجي في ذلك الباب كتاب مستقل: سماه غاية الكلام في إبطال عمل المولد والقيام، وهو كتاب عديم المثيل في بابه، ومن البدع المحدثة القول بوجوب التقليد لأحد من الأئمة الأربعة رحمهم الله تعالى،"
