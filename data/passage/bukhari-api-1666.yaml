label: { ar: "صحيح البخاري 1666 — الأب والأبوة", en: "Sahih al-Bukhari 1666 — the father and fatherhood", ur: "صحیح بخاری 1666 — باپ اور والدیت", es: "Sahih al-Bukhari 1666 — El padre y la paternidad", fr: "Sahih al-Bukhari 1666 — Le père et la paternité" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ قَالَ سُئِلَ أُسَامَةُ وَأَنَا جَالِسٌ، كَيْفَ كَانَ رَسُولُ اللَّهِ يَسِيرُ فِي حَجَّةِ الْوَدَاعِ حِينَ دَفَعَ قَالَ كَانَ يَسِيرُ الْعَنَقَ، فَإِذَا وَجَدَ فَجْوَةً نَصَّ. قَالَ هِشَامٌ وَالنَّصُّ فَوْقَ الْعَنَقِ. قَالَ أَبُو عَبْدِ اللَّهِ فَجْوَةٌ مُتَّسَعٌ، وَالْجَمِيعُ فَجَوَاتٌ وَفِجَاءٌ، وَكَذَلِكَ رَكْوَةٌ وَرِكَاءٌ. مَنَاصٌ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1666، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1666 (Hajj (Pilgrimage)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1666، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1666 (Hajj (Peregrinación)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1666 (Hajj, le pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
