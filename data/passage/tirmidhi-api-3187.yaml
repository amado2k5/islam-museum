text: "… عَلِيِّ بْنِ زَيْدٍ، عَنْ أَوْسِ بْنِ خَالِدٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" تَخْرُجُ الدَّابَّةُ مَعَهَا خَاتَمُ سُلَيْمَانَ وَعَصَا مُوسَى فَتَجْلُو وَجْهَ الْمُؤْمِنِ وَتَخْتِمُ أَنْفَ الْكَافِرِ بِالْخَاتَمِ حَتَّى إِنَّ أَهْلَ الْخِوَانِ لَيَجْتَمِعُونَ فَيَقُولُ هَاهَا يَا مُؤْمِنُ وَيُقَالُ هَاهَا يَا كَافِرُ وَيَقُولُ هَذَا يَا كَافِرُ وَهَذَا يَا مُؤْمِنُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3187، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3187 (Chapters on Tafsir), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3187، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
