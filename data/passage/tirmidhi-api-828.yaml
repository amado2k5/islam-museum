label: { ar: "جامع الترمذي 828 — الأب والأبوة", en: "Jami' al-Tirmidhi 828 — the father and fatherhood", ur: "جامع ترمذی 828 — باپ اور والدیت", es: "Jami' al-Tirmidhi 828 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 828 — le père et la paternité" }
text: "… مِنْ عَبْدِ الرَّحْمَنِ بْنِ يَرْبُوعٍ وَقَدْ رَوَى مُحَمَّدُ بْنُ الْمُنْكَدِرِ عَنْ سَعِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ يَرْبُوعٍ عَنْ أَبِيهِ غَيْرَ هَذَا الْحَدِيثِ. وَرَوَى أَبُو نُعَيْمٍ الطَّحَّانُ ضِرَارُ بْنُ صُرَدٍ هَذَا الْحَدِيثَ عَنِ ابْنِ أَبِي فُدَيْكٍ عَنِ الضَّحَّاكِ بْنِ عُثْمَانَ عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ عَنْ سَعِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ يَرْبُوعٍ عَنْ أَبِيهِ عَنْ أَبِي بَكْرٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 828، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 828 (The Book on Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 828، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 828 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 828 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
