ref: "42"
label: { ar: "الأربعون 42 — يا بن آدم إنك ما دعوتني ورجوتني غفرت لك", en: "Arba'un 42 — son of Adam, so long as you call and hope in Me", es: "Arba'un 42 — hijo de Adán, mientras me llames y tengas esperanza en mí.", fr: "Arba'un 42 — fils d'Adam, tant que tu m'appelleras et que tu espéreras en moi", ur: "اربعون 42 - ابن آدم، جب تک تم مجھے پکارو اور امید رکھو" }
summary:
  ar: "حديث أنس بن مالك قال: سمعت رسول الله يقول: «قال الله تعالى: يا بن آدم إنك ما دعوتني ورجوتني غفرت لك على ما كان منك ولا أبالي، يا بن آدم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك، يا بن آدم إنك لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك بي شيئاً لأتيتك بقرابها مغفرة» — وهو الحديث الثاني والأربعون وآخر الأربعين النووية في شرح ابن رجب؛ تفرد به الترمذي (3540) من طريق كثير بن فائد عن سعيد بن عبيد عن بكر بن عبد الله المزني عن أنس وقال حسن غريب لا نعرفه إلا من هذا الوجه؛ قال ابن رجب إسناده لا بأس به وسعيد بن عبيد هو الهنائي قال أبو حاتم شيخ وذكره ابن حبان في الثقات ومن زعم أنه غير الهنائي فقد وهم، وقال الدارقطني تفرد به كثير بن فائد عن سعيد مرفوعاً ورواه سلم بن قتيبة عن سعيد بن عبيد فوقفه على أنس، وتابعه على رفعه أبو سعيد مولى بني هاشم، وروي أيضاً من حديث ثابت عن أنس مرفوعاً لكن قال أبو حاتم هو منكر؛ وروي من حديث أبي ذر عند أحمد من رواية شهر بن حوشب عن معديكرب عن أبي ذر يرويه عن ربه ومن رواية شهر عن عبد الرحمن بن غنم عن أبي ذر ومن رواية أخشن السدوسي وفيه جهالة، وقيل عن شهر عن أم الدرداء عن أبي الدرداء ولا يصح؛ وروي من حديث ابن عباس عند الطبراني من رواية قيس بن الربيع عن حبيب بن أبي ثابت عن سعيد بن جبير؛ واستخرج ابن رجب منه أن المغفرة تحصل بثلاثة أسباب: الدعاء مع الرجاء — وفي السنن عن النعمان بن بشير «إن الدعاء هو العبادة» — والاستغفار — وفيه حديث أنس عند أحمد «لو أخطأتم حتى تملأ خطاياكم ما بين السماء والأرض ثم استغفرتم الله لغفر لكم» — ولقاء الله بلا شرك — ويؤيده حديث أبي ذر القدسي عند مسلم «من لقيني بقراب الأرض خطيئة لا يشرك بي شيئاً لقيته بقرابها مغفرة» ⁦(جامع العلوم والحكم ص 830–863)⁩."
  en: "The hadith of Anas ibn Malik that he heard the Messenger of God say: 'God Most High said: son of Adam, so long as you call upon Me and hope in Me, I forgive you whatever has issued from you, and I do not care; son of Adam, were your sins to reach the clouds of the sky and then you sought My forgiveness, I would forgive you; son of Adam, were you to come to Me with an earthful of sins and then meet Me associating nothing with Me, I would come to you with an earthful of forgiveness' — the forty-second and last of al-Nawawi's Forty in Ibn Rajab's commentary, uniquely transmitted by al-Tirmidhi (3540) through Kathir ibn Fa'id from Sa'id ibn Ubayd from Bakr ibn Abdullah al-Muzani from Anas, graded hasan gharib 'known only from this route'; Ibn Rajab held its isnad not bad, Sa'id ibn Ubayd being al-Hina'i — Abu Hatim called him a shaykh and Ibn Hibban listed him among the trustworthy, whoever claims he is another having erred — while al-Daraqutni noted Kathir ibn Fa'id alone raised it, Sallam ibn Qutayba stopping it at Anas, and Abu Sa'id the client of Banu Hashim corroborating its elevation; a route through Thabit from Anas exists but Abu Hatim called it repudiated; it also comes through Abu Dharr in Ahmad — Shahr ibn Hawshab from Ma'dikarib from Abu Dharr reporting it from his Lord, and Shahr from Abd al-Rahman ibn Ghanam from Abu Dharr, and the route of Akhshan al-Sadusi who is unknown — while the claimed route Shahr from Umm al-Darda' from Abu al-Darda' is unsound; and Ibn Abbas's version in al-Tabarani runs through Qays ibn al-Rabi' from Habib ibn Abi Thabit from Sa'id ibn Jubayr; Ibn Rajab drew from it that forgiveness is won by three means — supplication joined to hope, for which he cites al-Nu'man ibn Bashir's 'supplication is worship'; seeking forgiveness, for which Anas's report in Ahmad 'were you to err until your sins filled what lies between heaven and earth, then sought God's forgiveness, He would forgive you'; and meeting God without association, corroborated by Abu Dharr's sacred hadith in Muslim 'whoever meets Me with an earthful of sin associating nothing with Me, I meet him with an earthful of forgiveness' (Jami' al-Ulum wal-Hikam pp. 830–863)."
  es: "El hadiz de Anas ibn Malik que oyó al Mensajero de Dios decir: 'Dios Altísimo dijo: hijo de Adán, mientras me invoques y tengas esperanza en mí, te perdono todo lo que haya salido de ti, y no me importa; hijo de Adán, si tus pecados llegaran a las nubes del cielo y luego buscaras mi perdón, te perdonaría; hijo de Adán, si vinieras a mí con la tierra llena de pecados y luego te encontraras conmigo sin asociar nada conmigo, vendría a ti con la tierra llena de perdón' — el cuadragésimo segundo y último de los Cuarenta de al-Nawawi en el comentario de Ibn Rajab, transmitido de forma única por al-Tirmidhi (3540) a través de Kathir ibn Fa'id de Sa'id ibn Ubayd de Bakr ibn Abdullah al-Muzani de Anas, clasificado hasan gharib 'conocido solo por esta ruta'; Ibn Rajab sostuvo que su isnad no era malo, siendo Sa'id ibn Ubayd al-Hina'i — Abu Hatim lo llamó un shaykh e Ibn Hibban lo incluyó entre los dignos de confianza, quien afirma que es otro ha cometido un error — mientras que al-Daraqutni señaló que Kathir ibn Fa'id fue el único que lo elevó, Sallam ibn Qutayba lo detuvo en Anas, y Abu Sa'id, el cliente de Banu Hashim, corroboró su elevación; existe una ruta a través de Thabit desde Anas, pero Abu Hatim la llamó repudiada; también llega a través de Abu Dharr en Ahmad — Shahr ibn Hawshab de Ma'dikarib de Abu Dharr lo reportó de su Señor, y Shahr de Abd al-Rahman ibn Ghanam de Abu Dharr, y la ruta de Akhshan al-Sadusi, que es desconocido — mientras que la ruta afirmada Shahr de Umm al-Darda' de Abu al-Darda' no es sólida; y la versión de Ibn Abbas en al-Tabarani pasa por Qays ibn al-Rabi' de Habib ibn Abi Thabit de Sa'id ibn Jubayr; Ibn Rajab extrajo de ella que el perdón se obtiene por tres medios: la súplica unida a la esperanza, para la cual cita a al-Nu'man ibn Bashir 'la súplica es adoración'; la búsqueda del perdón, para la cual el informe de Anas en Ahmad 'si erraras hasta que tus pecados llenaran lo que hay entre el cielo y la tierra, y luego buscaras el perdón de Dios, Él te perdonaría'; y el encuentro con Dios sin asociación, corroborado por el hadiz sagrado de Abu Dharr en Muslim 'quien se encuentre conmigo con un montón de pecado sin asociar nada conmigo, yo me encuentro con él con un montón de perdón' (Jami' al-Ulum wal-Hikam pp. 830–863)."
  fr: "Le hadith d'Anas ibn Malik selon lequel il a entendu le Messager de Dieu dire: « Dieu le Très-Haut a dit: fils d'Adam, tant que tu M'invoques et que tu espères en Moi, Je te pardonne tout ce qui est sorti de toi, et cela ne Me regarde pas; fils d'Adam, si tes péchés atteignaient les nuages du ciel et que tu recherchais ensuite Mon pardon, Je te pardonnerais; fils d'Adam, si tu venais à Moi avec une terre pleine de péchés et que tu Me rencontrais sans rien M'associer, Je viendrais à toi avec une terre pleine de pardon » — le quarante-deuxième et dernier des Quarante d'al-Nawawi dans le commentaire d'Ibn Rajab, transmis de manière unique par al-Tirmidhi (3540) à travers Kathir ibn Fa'id de Sa'id ibn Ubayd de Bakr ibn Abdullah al-Muzani d'Anas, classé hasan gharib « connu uniquement par cette voie »; Ibn Rajab considérait son isnad comme correct, Sa'id ibn Ubayd étant al-Hina'i — Abu Hatim le qualifiait de cheikh et Ibn Hibban le comptait parmi les dignes de confiance, quiconque prétend le contraire se trompant — tandis qu'al-Daraqutni notait que seul Kathir ibn Fa'id l'avait établi, Sallam ibn Qutayba l'arrêtant à Anas, et Abu Sa'id, le client des Banu Hashim, corroborant son élévation; une route passant par Thabit depuis Anas existe, mais Abu Hatim la qualifiait de répudiée; elle passe également par Abu Dharr à Ahmad — Shahr ibn Hawshab de Ma'dikarib d'Abu Dharr rapportant de son Seigneur, et Shahr d'Abd al-Rahman ibn Ghanam d'Abu Dharr, et la route d'Akhshan al-Sadusi qui est inconnu — tandis que la route revendiquée Shahr d'Umm al-Darda' d'Abu al-Darda' est non fondée; La version d'Ibn Abbas dans al-Tabarani passe par Qays ibn al-Rabi', qui la transmet d'après Habib ibn Abi Thabit, lui-même transmis par Sa'id ibn Jubayr. Ibn Rajab en déduit que le pardon s'obtient par trois moyens: la supplication accompagnée d'espoir, pour laquelle il cite al-Nu'man ibn Bashir: « la supplication est une forme d'adoration »; la recherche du pardon, pour laquelle Anas rapporte dans Ahmad: « si vous commettez des erreurs au point que vos péchés remplissent l'espace entre le ciel et la terre, puis implorez le pardon de Dieu, Il vous pardonnera »; et la rencontre avec Dieu sans association, corroborée par le hadith sacré d'Abu Dharr rapporté par Muslim: « Quiconque Me rencontre avec une terre remplie de péchés, sans M'associer rien, Je le rencontre avec une terre remplie de pardon » (Jami' al-Ulum wal-Hikam, p. 830-863)."
  ur: "انس بن مالک سے روایت ہے کہ انہوں نے رسول اللہ کو فرماتے ہوئے سنا: اللہ تعالیٰ نے فرمایا: اے ابن آدم جب تک تم مجھے پکارتے ہو اور مجھ پر امید رکھتے ہو، میں تجھ سے جو کچھ بھی نازل ہوا ہے اسے معاف کرتا ہوں اور مجھے کوئی پرواہ نہیں۔ ابن آدم اگر تیرے گناہ آسمان کے بادلوں تک پہنچ جائیں اور پھر تو نے مجھ سے معافی مانگی تو میں تجھے بخش دوں گا۔ ابن آدم اگر تو زمین بھر گناہوں کے ساتھ میرے پاس آئے اور پھر مجھ سے میرے ساتھ کسی چیز کو شریک نہ ٹھہرائے تو میں تیرے پاس زمین بھر کی بخشش کے ساتھ حاضر ہوجاؤں گا - ابن رجب کی تفسیر میں نووی کی چالیسویں اور آخری روایت، جسے الترمذی (3540) نے مصنف ابن ابن کثیر سے روایت کیا ہے۔ ابن عبداللہ المزانی انس سے، درجہ حسن غریب 'صرف اس راستے سے جانا جاتا ہے'؛ ابن رجب نے اس کی سند کو برا نہیں سمجھا، سعید بن عبید الحنائی تھے - ابو حاتم نے اسے شیخ کہا اور ابن حبان نے اسے ثقہ قرار دیا، جو کوئی یہ دعوی کرے کہ وہ خطا کار ہے - جب کہ الدارقطنی نے نوٹ کیا کہ کثیر بن فائد نے اسے اکیلے اٹھایا، ابو سعید بن عبید کے مؤکل نے اسے روکا اور ابو سعید بن سعید نے اسے روکا۔ بنو ہاشم اس کی بلندی کی تصدیق کرتے ہوئے؛ انس سے ثابت سے گزرنے کا راستہ موجود ہے لیکن ابو حاتم نے اسے منکر کہا ہے۔ یہ احمد میں ابوذر کے ذریعے بھی آتا ہے — شہر بن حوشب نے معدیکریب سے ابوذر سے، اور شہر نے عبدالرحمٰن بن غنم سے ابوذر سے، اور اخشن السدوسی کا راستہ جو نامعلوم ہے — جب کہ دعوی شدہ راستہ ام الدرداء سے شہر ابو الدرداء سے ہے؛ اور الطبرانی میں ابن عباس کا نسخہ قیس بن الربیع سے حبیب بن ابی ثابت سے سعید بن جبیر سے ہے۔ ابن رجب نے اس سے یہ اخذ کیا کہ بخشش تین طریقوں سے جیتی جاتی ہے - دعا امید سے جڑی ہوئی ہے، جس کے لیے وہ نعمان بن بشیر کی 'دعا عبادت ہے' کا حوالہ دیتے ہیں۔ استغفار کرنا، جس کے لیے احمد میں انس کی روایت ہے کہ 'کیا تم اس وقت تک غلطی کرتے رہے جب تک کہ تمہارے گناہ آسمان اور زمین کے درمیان موجود نہ ہو جائیں، پھر اللہ سے معافی مانگیں، وہ تمہیں معاف کر دے گا'؛ اور بغیر کسی تعلق کے خدا سے ملاقات، مسلم میں ابوذر کی حدیث مبارک سے ثابت ہے کہ ''جو مجھ سے زمین بھر گناہ کے ساتھ ملے جس میں میرے ساتھ کسی کو شریک نہیں کیا جاتا، میں اس سے زمین بھر بخشش کے ساتھ ملتا ہوں'' ⁦(جامع العلوم والحکم صفحہ 830-863)⁩۔"
