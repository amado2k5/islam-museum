text: "… في الآخرة ولا أدأب ليلاً ونهاراً منه. قال: فأحببته حباً لم أحبه أحداً من قبل، فأقمت معه زماناً، ثم حضَرَتْهُ الوفاةُ قلت له: يا فلان إني كنت معك فأحببتك حباً لم أحبه مَن قبلك، وقد حضرتك الوفاة فإلى من توصي …"
