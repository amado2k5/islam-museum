text: |-
  ⁦( اغرب)⁩
  ٨٧
  السقامملانه قال بشر
  وكأنّ ظعنهم غداة عملوا • سقن تكفأفى خليج مغرب
  وأغرب الرجل صار غريبا حكاه أبو نصر واستغرب فى الضحك اشتد فصكه وكثروالمغرب الابيض
  قال الشاعر فهذا مكانى أو أرى القار مغربا • وحتى أرى سم الجبال تكلم
  والمغرب أيضا الابيض الاشفار من كل شئ ئقول أغرب الفرس على مالم يسم فاء-له اذا
  فشت غرته حتق تأخذ العينين فتبيض الاشفاروكذلك اذا ابيضتمن الزرق وأغرب الرجل
  أيضااذا اشتدوجعه عن الاصمعى والغراب واحد الغربان وجمع القلة أغربة وغراب الناس
  حدها قال الشماخ يصف رج لا قطع نبعة
  فأنحى عليهاذات حد غراجا • عدولا وساط العضاه مشارز
  وغرابا الفرس والبعير حد الوركين وهماحر فاهما الايسر والايمن اللذان فوق الذنب
  حيث يلتق رأس الورك عن الاصحمى قال الراجز:
  ياعجبا للعجب العجاب • خسة غربان على غراب
  وجعه أيضاغربان قال ذوالرمة
  وقز بن بالزرق الهائل بعدما • تقوب عن غربان أوراكها الظطر
  أراد تقوّ بت غربانها عن الخطرفة لبه لان المعق معروف كة ولك لا يدخسل اللحاتم فى اصبعى
  أى لا يدخل الاصبع فى خاتى ورجل الخراب ضرب من الصرار شديد وقول الساءر
  رأى درة يضاء يحفل لونها • سخام كغربان البرير مقصب
  يعنى به النضيج من غر الاراك وتقول هذا أسودغربيب أى شديد السوادواذا قلت غرايب
  سود تجعل السودبدلا من الغرابيب لان تواكيد الالوان لانقدم والغرب والمغرب
  بمعنى واحد⁦(١)⁩ وقولهم لقيته مغيربان الشمس صغروه على غير مكبره كانهم صغر وامغربانا
  والجمع مغيربانات كما قالوامفارق الراس كأنهم جعلوا ذلات الحين أجزاء كلما تصوّبت الشمس
  ذهب منهاجره فصغروه فجمعوه على ذلك وغرب أى بعديقال اغرب عنى أى تباعد وغريت
  لشمس غروبا والغروب أيضامجارى الدمع وللعين غرابان مقدمها ومؤخرها قال الاصمعى
  يقال لعينه غرب اذا كانت تسيل ولا تنقطع دموعها والغروب الدموع وقال الراجز
  مالك لاتذ كرام عمرو • الالعينيك غروب تجرى
  والغروب أيضاحدة الاسنان وماؤها واحدهاغرب قال عنترة
  اذتستد ك بذى غروب واضع • عذب مقبله لذيذ المطعم
  والغرب أيضا الدلو العظيمة ويقال لحدّ السيف غرب وغرب كل فئ حدهية ال فى لسانه
  غرب أى حدة وغرب الفرس حدّته وأوّل جريه تقول كففت من غربه قال النابغة
  والخيل تنزع غربادى أعنتها وفرس غرب أى كثير الجرى والغرب أيضاءرق فى مجرى الدمع
  يسقى فلا ينقطح مثل الناسور ونوى غر بة أى بعيدة وغرية الذوى بعدها والنوى المكان
  الذى تنوى ان تأتيه فى-فرك والغارب ما بين السسنام والعنق ومنه قولهم حبلك على غاربك
  أى اذهبى حيث شقت وأصله أنّ الشاقة اذارعت وعليها الخطام ألقى ع-لى غاربه الانمم اذا.
  للغرب اه مرنضى
