text: "وَكَيْفَ يُحَكِّمُونَكَ وَعِندَهُمُ ٱلتَّوْرَىٰةُ فِيهَا حُكْمُ ٱللَّهِ ثُمَّ يَتَوَلَّوْنَ مِنۢ بَعْدِ ذَٰلِكَ ۚ وَمَآ أُو۟لَـٰٓئِكَ بِٱلْمُؤْمِنِينَ"
text_search: "وكيف يحكمونك وعندهم التوراة فيها حكم الله ثم يتولون من بعد ذلك ۚ وما أولئك بالمؤمنين"
translations:
  en: { text: "How come they unto thee for judgment when they have the Torah, wherein Allah hath delivered judgment (for them)? Yet even after that they turn away. Such (folk) are not believers.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور یہ تم سے (اپنے مقدمات) کیونکر فیصل کرایں گے جبکہ خود ان کے پاس تورات (موجود) ہے جس میں خدا کا حکم (لکھا ہوا) ہے (یہ اسے جانتے ہیں) پھر اس کے بعد اس سے پھر جاتے ہیں اور یہ لوگ ایمان ہی نہیں رکھتے", translator: "Fateh Muhammad Jalandhari", license: PD }
