text: "… يسكّن الداحس، ويحلّل الصلبة، ويفجّر الدبيلة، وإن شرب ثلاثين يوماً، كل يوم ثلاث أثولوسات بالخلّ حلّل أورام الطحال. وضمّاداً مع التين أيضاً للطحال، ويسكّن الطحال من الوجع، ويسكّن الداحس إذا ضمّد به مع الشراب. يراجع: المعتمد في الأدوية المفردة، الملك …"
summary:
