  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 627, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
