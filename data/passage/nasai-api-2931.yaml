label: { ar: "سنن النسائي 2931 — ما أُحل، ما لا يحل", en: "Sunan al-Nasa'i 2931 — what was made lawful; what is not lawful", ur: "سنن نسائی 2931 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… الْحُلَيْفَةِ صَلَّى الظُّهْرَ ثُمَّ رَكِبَ رَاحِلَتَهُ فَلَمَّا اسْتَوَتْ بِهِ عَلَى الْبَيْدَاءِ أَهَلَّ بِالْحَجِّ وَالْعُمْرَةِ جَمِيعًا فَأَهْلَلْنَا مَعَهُ فَلَمَّا قَدِمَ رَسُولُ اللَّهِ مَكَّةَ وَطُفْنَا أَمَرَ النَّاسَ أَنْ يَحِلُّوا فَهَابَ الْقَوْمُ فَقَالَ لَهُمْ رَسُولُ اللَّهِ \" لَوْلاَ أَنَّ مَعِي الْهَدْىَ لأَحْلَلْتُ \". فَحَلَّ الْقَوْمُ حَتَّى حَلُّوا إِلَى النِّسَاءِ وَلَمْ يَحِلَّ رَسُولُ اللَّهِ وَلَمْ يُقَصِّرْ إِلَى يَوْمِ النَّحْرِ."
summary:
  ar: "حديث في سنن النسائي، رقم 2931، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2931 (The Book of Hajj), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2931، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
