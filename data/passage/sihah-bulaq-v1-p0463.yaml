text: |-
  قوله -هعبح بالضم وبضمتين قال
  الشاعر
  دعوا التخاجؤ وامشوامشية سجدا
  إن الرجال اولوعصب وتذ كير
  N٧A
  والريحان الرزق تقول خرحت أبتغى ريحان اللّٰه قال النمر بن نواب.
  سلام الاله وريحانه • ورحته وسماءدرر
  وفى الحديث الولد من ريحان اللّٰه وقولهم سحان اللّٰه وريحانه نصبوهما على المصدريريدون
  تنزيهاله واس ترزاقا وأماقوله تعالى والحبّ ذو العصف والريحان فالعصف ساق الزرع
  والر يحان ورقه عن الفرّاء وروجاء مدود بلد والنسبة اليه روحاوى
  صل المين) ح) زحه يزحه أى نحاه عن وضعه وزحزحته عن كذا أى
  باعدته عنه فتزحزح أى تنحى قال ذو الرمّة
  يا قابض اروح عن جسم عدى زمنا * وغافر الذنب زحز-ى عن النار
  وتقول هو بزحزح عن ذاك أى يعدمنه (زرح الزروح الاكمة المنبسطة والبمع
  اوح قال أبو عمروهى الروابي الصغار ( لح صعة زلحلمة أى منبسطة قريبة
  القعر قالد كين
  اذاقصاع كالاكف خس • زامات قدجن ملس
  مح) الزح بالتشدد اللتيم ويتال القصير الدميم يح اح الشي يزيح زيها أى
  بعدوذهب وأزاحه غيره ومنه قول الاعشى
  قد أزحناهزالها • وأزحت علته فزاحت
  صل الزى سبح السباحة العوم والسبح الفراغ والسبح التصرة ف فى المعاش
  قال قتادة فى قوله تعالى إنّ لك فى النهارسبحاطو يلا أى فراعاط ويسلا وقال أبو عبيدة متقلبا
  لمويلا وقال المؤرّج ه والفراغ والجمئة والذهاب وسمح الفرس جريه وهوفرس سامح
  والسبحة بالضم خرزات يسبح بم اوالسبحة أيضا التطوع من الذكر والصلاة تة ول قضيت سحتى
  روى أنّ عمر رضى اللّٰه عنه جلد رجلين سبحابعد العصر أى صليا والتسيح التنزيه وسبحان
  اللّٰه معناه التنزيه قه نصب على المصدر كانه قال أبرئ اللّٰه من السوبراءة والعرب تقول
  سبحان من كذا اذا تعجبت منه قال الاعشى
  أقول لماجاءنى فحره * سبجان من علقمة الفاخر
  يقول العجب منه اذ يفخرواغالم ينون لانه معرفة عندهم وفيه شبه اتأنيت وقواهم نسبحات
  وحه ربنا بضم السيز والباء أى حلااته وسبوح من مفات اللّٰه قال ثعلب كل اسم على فعول
  فهو مفتوح الأوّل الا السبوح والقدوس فان الضم فيهما أكثر و كذلك الذرّوح وقال سيبويه
  دس فى الكلام فعول بواحدة وسيوحة بفتح السين محففة الباء البلد الحرام ويقال
  واديعرفات وقال يصف نوق الجيم
  خوارج من نعمان أومن سبوحة • الى البيت أويخرجن من نجد كبكب
  مجمح) الاسجاح حسن العفويال ملمكت فأسجح ويقال اذاسالت فأسجع أى
  سهل ألناظل وارفق ومشية سهبح أى -هلة والسجيحة الطبيعة ووجه أحجح بين السجح
  أى حسن معتدل قال ذوالرمة
  لها أذن حشر وذ فرى أسيلة • ووجه كرآة الغريبة أسجيح
  ومجاح اسم امرأة من بني يربوع تنبات ويقال خل له عن سيجح الطريق بالضم أى عن وسطانه
