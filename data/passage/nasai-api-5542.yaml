label: { ar: "سنن النسائي 5542 — التحريم", en: "Sunan al-Nasa'i 5542 — prohibition", ur: "سنن نسائی 5542 — تحریم", es: "Sunan al-Nasa'i 5542 - prohibición", fr: "Sunan al-Nasa'i 5542 - interdiction" }
text: "… الْمُبَارَكِ - عَنْ سَعِيدِ بْنِ أَبِي عَرُوبَةَ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ، قَالَ كُنْتُ أَسْقِي أَبَا طَلْحَةَ وَأُبَىَّ بْنَ كَعْبٍ وَأَبَا دُجَانَةَ فِي رَهْطٍ مِنَ الأَنْصَارِ فَدَخَلَ عَلَيْنَا رَجُلٌ فَقَالَ حَدَثَ خَبَرٌ نَزَلَ تَحْرِيمُ الْخَمْرِ. فَكَفَأْنَا. قَالَ وَمَا هِيَ يَوْمَئِذٍ إِلاَّ الْفَضِيخُ خَلِيطُ الْبُسْرِ وَالتَّمْرِ. قَالَ وَقَالَ أَنَسٌ لَقَدْ حُرِّمَتِ الْخَمْرُ وَإِنَّ عَامَّةَ خُمُورِهِمْ يَوْمَئِذٍ الْفَضِيخُ."
summary:
  ar: "حديث في سنن النسائي، رقم 5542، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5542 (The Book of Drinks), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5542، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5542 (El Libro de las Bebidas), menciona la prohibición. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5542 (Le Livre des Boissons), mentionne une interdiction. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
