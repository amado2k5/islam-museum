text: "حَدَّثَنَا الْحُمَيْدِيُّ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا بَيَانٌ، وَإِسْمَاعِيلُ، قَالاَ سَمِعْنَا قَيْسًا، يَقُولُ سَمِعْتُ خَبَّابًا، يَقُولُ أَتَيْتُ النَّبِيَّ وَهْوَ مُتَوَسِّدٌ بُرْدَةً، وَهْوَ فِي ظِلِّ الْكَعْبَةِ، وَقَدْ لَقِينَا مِنَ الْمُشْرِكِينَ شِدَّةً فَقُلْتُ أَلاَ تَدْعُو اللَّهَ فَقَعَدَ وَهْوَ مُحْمَرٌّ وَجْهُهُ فَقَالَ \" لَقَدْ كَانَ مَنْ قَبْلَكُمْ لَيُمْشَطُ بِمِشَاطِ الْحَدِيدِ مَا دُونَ عِظَامِهِ مِنْ لَحْمٍ أَوْ عَصَبٍ مَا يَصْرِفُهُ ذَلِكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3852، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3852 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3852، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 3852 (Méritos de los Ayudantes en Medina (Ansar)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
