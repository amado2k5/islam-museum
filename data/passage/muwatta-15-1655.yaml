label: { ar: "الموطأ 1655 — عروة بن الزبير: في ولد الملاعنة وولد الزنا، إذا مات ورثته أمه حقها في كتاب الله، وإخوته لأمه حقوقهم، وما بقي للمسلمين", en: "Muwatta 1655", es: "Muwatta 1655", fr: "Muwatta 1655", ur: "موطا 1655", tr: "El-Muvatta 1655 — Urve ibn el-Zübeyr: Zina ile suçlanan kadının çocuğu ve fuhuştan doğan çocuk hakkında, eğer ölürse, annesi Allah'ın Kitabına göre kendi payını miras alır, anne tarafından kardeşleri haklarını miras alır ve geriye kalan kısım Müslümanlara kalır.", id: "Al-Muwatta 1655 — Urwah ibn al-Zubayr: Mengenai anak dari seorang wanita yang dituduh berzina dan anak hasil hubungan di luar nikah, jika ia meninggal, ibunya mewarisi bagiannya sesuai dengan Kitab Allah, saudara-saudara kandung dari pihak ibunya mewarisi hak mereka, dan sisanya menjadi milik kaum Muslimin." }
summary:
  ar: "يروي مالك أنه بلغه أن عروة بن الزبير كان يقول في ولد الملاعنة وولد الزنا، إنه إذا مات ورثته أمه حقها في كتاب الله تعالى، وإخوته لأمه حقوقهم، ويرث البقية موالي أمه إن كانت مولاة، وإن كانت عربية ورثت حقها، وورث إخوته لأمه حقوقهم، وكان ما بقي للمسلمين. {cite:muwatta-maruf-1997 p.81}"
  tr: "Malik, Urva ibn el-Zübeyr'in zina ile suçlanan bir kadının çocuğu veya nikahsız doğan bir çocuk hakkında şöyle dediğini işittiğini rivayet eder: Eğer çocuk ölürse, annesi Allah'ın Kitabına göre kendi payını alır, anne tarafından kardeşleri de kendi paylarını alır. Geri kalan kısım, eğer anne azatlı köle ise azatlı kölelerine, eğer Arap ise kendi payını alır, anne tarafından kardeşleri de kendi paylarını alır ve geriye kalan kısım Müslümanlara kalır. {cite:muwatta-maruf-1997 s.81}"
  id: "Malik meriwayatkan bahwa ia mendengar Urwah ibn al-Zubayr biasa berkata mengenai anak dari seorang wanita yang dituduh berzina atau anak yang lahir di luar nikah, bahwa jika anak itu meninggal, ibunya mewarisi bagiannya sesuai dengan Kitab Allah Yang Maha Agung, dan saudara-saudara kandung dari pihak ibunya mewarisi bagian mereka. Sisanya diberikan kepada budak-budak yang telah dibebaskan ibunya jika ibunya adalah budak yang telah dibebaskan, dan jika ibunya seorang Arab, ia mewarisi bagiannya, dan saudara-saudara kandung dari pihak ibunya mewarisi bagian mereka, dan sisanya diberikan kepada kaum Muslimin. {cite:muwatta-maruf-1997 p.81}"
