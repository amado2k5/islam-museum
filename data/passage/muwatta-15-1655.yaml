label: { ar: "الموطأ 1655 — عروة بن الزبير: في ولد الملاعنة وولد الزنا، إذا مات ورثته أمه حقها في كتاب الله، وإخوته لأمه حقوقهم، وما بقي للمسلمين", en: "Muwatta 1655" }
summary:
  ar: "يروي مالك أنه بلغه أن عروة بن الزبير كان يقول في ولد الملاعنة وولد الزنا، إنه إذا مات ورثته أمه حقها في كتاب الله تعالى، وإخوته لأمه حقوقهم، ويرث البقية موالي أمه إن كانت مولاة، وإن كانت عربية ورثت حقها، وورث إخوته لأمه حقوقهم، وكان ما بقي للمسلمين. {cite:muwatta-maruf-1997 p.81}"
