text: "إلى أخيه أبي ثعلب، وقارن ذلك وزارة ابن بقية، وقصر أبو ثعلب في خطابه فاغرى به بختيار فسار إليه، ونزل الموصل، وفارقها أبو ثعلب إلى سنجار وأخلاها من الميرة والكتاب والدواوين. ثم سار من سنجار إلى بغداد فحاربها، ولم يحدث"
