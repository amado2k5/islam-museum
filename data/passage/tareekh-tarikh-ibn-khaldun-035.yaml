  ur: "\"کتاب الابر - ابن خلدون\" کا ایک اقتباس جس میں خط و کتابت، خط، خط یا سیاق و سباق میں جواب کی رپورٹ شامل ہے۔ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
