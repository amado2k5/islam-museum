text: "… شعب الإيمان. باب الاعتكاف الفصل الأول - عن عائشةا، أن الني تظ كان يعتكف العشر الأواخر من رمضان حتى توفاه الله، ثم أعتكف أزواجه من بعده. متفق عليه. - وعن ابن عباسما، قال: كان رسول اللٰه لم أجود الناس بالخير، …"
