label: { ar: "الموطأ 2420 — أبو الزناد: عامل عمر بن عبد العزيز وأخذ الناس في الحرابة", en: "Muwatta 2420", es: "Muwatta 2420", fr: "Muwatta 2420", ur: "موطا 2420", tr: "El-Muvatta 2420 — Ebu el-Zinad: Ömer ibn Abdülaziz'in ajanıydı ve eşkıyalık için insanları yakalıyordu.", id: "Al-Muwatta 2420 — Abu al-Zinad: Agen Umar ibn Abd al-Aziz dan dia menangkap orang untuk melakukan perampokan" }
summary:
  ar: "يروي مالك أن أبا الزناد أخبره أن عاملا لعمر بن عبد العزيز أخذ ناسا في الحرابة، ولم يقتلوا أحدا، فأراد أن يقطع أيديهم أو يقتلهم، فكتب إلى عمر بن عبد العزيز، فكتب إليه: لو أخذت بأيسر من ذلك. {cite:muwatta-maruf-1997 p.399} {cite:muwatta-maruf-1997 p.400}"
  tr: "Malik, Ebu el-Zinad'ın kendisine, Ömer ibn Abdülaziz'in bir ajanının, kimseyi öldürmemiş olmalarına rağmen bazı kişileri eşkıyalık suçundan tutukladığını anlattığını aktarır. Ajan, onların ellerini kesmek veya onları öldürmek istediği için Ömer ibn Abdülaziz'e bir mektup yazmış ve Ömer şöyle cevap vermiş: \"Daha hafif bir şey yapmış olsaydın...\" {cite:muwatta-maruf-1997 s.399} {cite:muwatta-maruf-1997 s.400}"
  id: "Malik meriwayatkan bahwa Abu al-Zinad memberitahunya bahwa seorang agen Umar ibn Abd al-Aziz menangkap beberapa orang karena perampokan, padahal mereka tidak membunuh siapa pun. Agen itu ingin memotong tangan mereka atau membunuh mereka, jadi dia menulis surat kepada Umar ibn Abd al-Aziz, yang menjawab: \"Jika kamu mengambil tindakan yang lebih ringan.\" {cite:muwatta-maruf-1997 p.399} {cite:muwatta-maruf-1997 p.400}"
