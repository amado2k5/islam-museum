summary:
  ar: "يروي مالك أن أبا الزناد أخبره أن عاملا لعمر بن عبد العزيز أخذ ناسا في الحرابة، ولم يقتلوا أحدا، فأراد أن يقطع أيديهم أو يقتلهم، فكتب إلى عمر بن عبد العزيز، فكتب إليه: لو أخذت بأيسر من ذلك. {cite:muwatta-maruf-1997 p.399} {cite:muwatta-maruf-1997 p.400}"
