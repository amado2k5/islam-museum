text: "… ابن مَعْقِل عن العزل؟ فقال: قد فعل ذلك من هو خير مني ومنك: سعد. كذا في جميع الأصول. وهي قراءة نافع وأبي عمرو وابن عامر وأبي جعفر ويعقوب. القراءات العشر المتواترة لمحمد كريم راجح ص، بهامش المصحف. في ه : …"
