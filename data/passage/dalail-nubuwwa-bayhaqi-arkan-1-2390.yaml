text: "… الضيف، ويطعم الطعام، ويفشي السلام، ولا يَرُدَّ طالب حاجة قط، انا ابنة حاتم طيّء، فقال النبي وايف : يا جارية ! هذه صفة المؤمنين حقاً لو كان أبوك مسلماً لترحِّمنا عليه، خَلوا عنها فإنَّ اباها كان يُحب مكارم الأخلاق، والله …"
