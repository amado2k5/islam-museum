text: "… الضيف، ويطعم الطعام، ويفشي السلام، ولا يَرُدَّ طالب حاجة قط، انا ابنة حاتم طيّء، فقال النبي وايف : يا جارية ! هذه صفة المؤمنين حقاً لو كان أبوك مسلماً لترحِّمنا عليه، خَلوا عنها فإنَّ اباها كان يُحب مكارم الأخلاق، والله …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2390، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 2390, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2390 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 2390, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Dala'il al-Nubuwwa d'al-Bayhaqi (tome 1, p. 2390), numérisé, mentionnant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Beyhakî'nin \"Delil-i Nubuvve\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 2390. sayfasından, müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi \"Dala'il an-Nubuwwah\" (Bukti Kenabian), Jilid 1, halaman 2390, yang menyebutkan ciri-ciri seorang mukmin; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin."
