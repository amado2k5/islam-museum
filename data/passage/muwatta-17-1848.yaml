label: { ar: "الموطأ 1848 — مالك عن زيد بن أسلم عن عطاء بن يسار: باع معاوية سقاية من ذهب أو ورق بأكثر من وزنها، فأنكر أبو الدرداء، فكتب عمر إلى معاوية أن لا يبيع ذلك إلا مثلا بمثل وزنا بوزن", en: "Muwatta 1848" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن معاوية بن أبي سفيان باع سقاية من ذهب أو ورق بأكثر من وزنها، فقال أبو الدرداء: سمعت رسول الله ينهى عن مثل هذا إلا مثلا بمثل. فقال له معاوية: ما أرى بمثل هذا بأسا. فقال أبو الدرداء: من يعذرني من معاوية؟ أنا أخبره عن رسول الله ويخبرني عن رأيه، لا أساكنك بأرض أنت بها. ثم قدم أبو الدرداء على عمر بن الخطاب فذكر ذلك له، فكتب عمر إلى معاوية أن لا يبيع ذلك إلا مثلا بمثل، وزنا بوزن. ويذكر المحقق قول ابن عبد البر إن ظاهر الحديث الانقطاع، لأن عطاء لم يسمع من أبي الدرداء فيما يعلم. {cite:muwatta-maruf-1997 p.159} {cite:muwatta-maruf-1997 p.160}"
