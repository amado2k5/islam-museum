label: { ar: "الموطأ 1848 — مالك عن زيد بن أسلم عن عطاء بن يسار: باع معاوية سقاية من ذهب أو ورق بأكثر من وزنها، فأنكر أبو الدرداء، فكتب عمر إلى معاوية أن لا يبيع ذلك إلا مثلا بمثل وزنا بوزن", en: "Muwatta 1848", es: "Muwatta 1848", fr: "Muwatta 1848", ur: "موطا 1848", tr: "El-Muvatta 1848 — Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayetle: Muaviye, altın veya gümüşten yapılmış bir içki kabını ağırlığından fazla fiyata sattı. Ebu el-Darda' buna itiraz etti, bunun üzerine Ömer, Muaviye'ye, ancak eşit miktarda, ağırlık olarak eşit miktarda satması gerektiğini yazdı.", id: "Al-Muwatta 1848 — Malik, berdasarkan riwayat Zayd ibn Aslam, berdasarkan riwayat Ata ibn Yasar: Muawiyah menjual sebuah bejana minum yang terbuat dari emas atau perak dengan harga lebih tinggi dari beratnya. Abu al-Darda’ keberatan, maka Umar menulis surat kepada Muawiyah agar ia tidak menjualnya kecuali dengan harga yang sama, berat demi berat." }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن معاوية بن أبي سفيان باع سقاية من ذهب أو ورق بأكثر من وزنها، فقال أبو الدرداء: سمعت رسول الله ينهى عن مثل هذا إلا مثلا بمثل. فقال له معاوية: ما أرى بمثل هذا بأسا. فقال أبو الدرداء: من يعذرني من معاوية؟ أنا أخبره عن رسول الله ويخبرني عن رأيه، لا أساكنك بأرض أنت بها. ثم قدم أبو الدرداء على عمر بن الخطاب فذكر ذلك له، فكتب عمر إلى معاوية أن لا يبيع ذلك إلا مثلا بمثل، وزنا بوزن. ويذكر المحقق قول ابن عبد البر إن ظاهر الحديث الانقطاع، لأن عطاء لم يسمع من أبي الدرداء فيما يعلم. {cite:muwatta-maruf-1997 p.159} {cite:muwatta-maruf-1997 p.160}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan naklederek, Muaviye ibn Ebu Sufyan'ın altın veya gümüşten yapılmış bir içki kabını ağırlığından fazla fiyata sattığını rivayet eder. Ebu el-Darda', \"Allah Resulü'nün böyle bir işlemi, eşit miktarda mal karşılığında mal satılması dışında yasakladığını duydum\" dedi. Muaviye, \"Böyle bir işlemde bir sakınca görmüyorum\" diye cevap verdi. Ebu el-Darda', \"Beni Muaviye'den kim koruyacak? Ona Allah Resulü'nün ne dediğini anlatıyorum, o da bana kendi fikrini söylüyor. Seninle aynı topraklarda yaşamayacağım\" dedi. Bunun üzerine Ebu el-Darda', Ömer ibn el-Hattab'a gidip durumu anlattı. Ömer, Muaviye'ye böyle bir kabı, eşit miktarda mal karşılığında, ağırlık olarak ağırlık olarak satmaması konusunda talimat veren bir mektup yazdı. Araştırmacı, İbn Abd el-Barr'ın hadisin bağlantısız göründüğüne dair ifadesinden bahseder; çünkü Ata'nın bildiği kadarıyla Ebu el-Darda'dan bir şey duymamıştır."
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari Ata ibn Yasar, bahwa Muawiyah ibn Abi Sufyan menjual sebuah bejana minum yang terbuat dari emas atau perak dengan harga lebih tinggi dari beratnya. Abu al-Darda' berkata, \"Aku mendengar Rasulullah melarang transaksi seperti itu kecuali dengan harga yang sama.\" Muawiyah menjawab, \"Aku tidak melihat ada masalah dalam transaksi seperti itu.\" Abu al-Darda' berkata, \"Siapa yang akan memaafkanku dari Muawiyah? Aku memberitahunya apa yang dikatakan Rasulullah, dan dia memberitahuku pendapatnya sendiri. Aku tidak akan tinggal di negeri yang sama denganmu.\" Kemudian Abu al-Darda' pergi kepada Umar ibn al-Khattab dan menceritakan hal itu kepadanya. Umar menulis surat kepada Muawiyah yang memerintahkannya untuk tidak menjual bejana seperti itu kecuali dengan harga yang sama, berat demi berat. Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits tersebut tampaknya tidak terkait, karena Ata' tidak mendengar dari Abu al-Darda', sejauh yang dia ketahui."
