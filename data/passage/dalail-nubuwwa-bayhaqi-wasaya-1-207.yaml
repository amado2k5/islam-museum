text: "… رسول اللّٰه ال لأمته معاني الأي التي أنزات عليه مع أمر اللّٰه جل وعلا له بذلك وجاز له ذلك كان لمن بعده من أمته أجْوَز، وتَرْك التفسير لما تركه رسول اللّٰه ولي أَحْرىٰ. وعن أعظم الدليل على أن اللّٰه جل …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 207، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
