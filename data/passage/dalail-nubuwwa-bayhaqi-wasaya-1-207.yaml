  tr: "El-Beyhakî'nin \"Dala'il al-Nubuwwah\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 207. sayfasından, mal varlığı ve mirasından bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Dala'il al-Nubuwwah\" (Bukti Kenabian) karya Al-Bayhaqi, Jilid 1, halaman 207, yang menyebutkan harta dan warisannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
