label: { ar: "صحيح مسلم — ففيهما فجاهد", en: "Sahih Muslim — In them, do your striving", ur: "صحیح مسلم — انہی دونوں میں جہاد کرو", es: "Sahih Muslim — En ellos, esfuérzate" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَزُهَيْرُ بْنُ حَرْبٍ، قَالاَ حَدَّثَنَا وَكِيعٌ، عَنْ سُفْيَانَ، عَنْ حَبِيبٍ، ح وَحَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا يَحْيَى، - يَعْنِي ابْنَ سَعِيدٍ الْقَطَّانَ - عَنْ سُفْيَانَ، وَشُعْبَةَ قَالاَ حَدَّثَنَا حَبِيبٌ، عَنْ أَبِي الْعَبَّاسِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ صلى الله عليه وسلم يَسْتَأْذِنُهُ فِي الْجِهَادِ فَقَالَ ‏\"‏ أَحَىٌّ وَالِدَاكَ ‏\"‏ ‏.‏ قَالَ نَعَمْ ‏.‏ قَالَ ‏\"‏ فَفِيهِمَا فَجَاهِدْ ‏\"‏ ‏.‏"
summary:
  ar: "جاء رجل يستأذن النبي في الجهاد فقال أحي والداك، قال نعم، قال ففيهما فجاهد."
  en: "A man asked the Prophet's leave to go on jihad; «are your parents alive?« — «yes« — «then in them do your striving.»"
  ur: "ایک شخص نے جہاد کی اجازت چاہی؛ «کیا تمہارے والدین زندہ ہیں؟» — «ہاں» — «تو انہی میں جہاد کرو۔»"
  es: "Un hombre pidió permiso al Profeta para ir a la yihad; «¿Están vivos tus padres?» — «Sí» — «Entonces, en ellos centra tu lucha.»"
