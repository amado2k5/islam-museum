label: { ar: "الموطأ 198 — سليمان بن يسار: كان يرفع يديه في الصلاة", en: "Muwatta 198" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار مرسلاً، في باب افتتاح الصلاة: كان النبي يرفع يديه في الصلاة. ويذكر المحقق أن أبا مصعب رواه عن مالك، وينقل عن ابن عبد البر أنه مرسل عند كل من رواه عن مالك وكذلك رواه شعبة عن يحيى بن سعيد (التمهيد 23/159). {cite:muwatta-maruf-1997 p.125} {cite:muwatta-maruf-1997 p.126}"
