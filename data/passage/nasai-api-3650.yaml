label: { ar: "سنن النسائي 3650 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Sunan al-Nasa'i 3650 — a testament or parting counsel; a deathbed and last hours", ur: "سنن نسائی 3650 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات", es: "Sunan al-Nasa'i 3650 — un testamento o consejo de despedida; un lecho de muerte y últimas horas", fr: "Sunan al-Nasa'i 3650 — un testament ou des derniers conseils; le lit de mort et les dernières heures", tr: "Sunan an-Nasa'i 3650 — Ölüm anında yapılan son vasiyetname.", id: "Sunan an-Nasa'i 3650 — Surat wasiat terakhir, pada saat kematian" }
text: "… عَنْ جَدِّهِ، قَالَ خَرَجَ سَعْدُ بْنُ عُبَادَةَ مَعَ النَّبِيِّ فِي بَعْضِ مَغَازِيهِ وَحَضَرَتْ أُمَّهُ الْوَفَاةُ بِالْمَدِينَةِ فَقِيلَ لَهَا أَوْصِي. فَقَالَتْ فِيمَ أُوصِي الْمَالُ مَالُ سَعْدٍ. فَتُوُفِّيَتْ قَبْلَ أَنْ يَقْدَمَ سَعْدٌ فَلَمَّا قَدِمَ سَعْدٌ ذُكِرَ ذَلِكَ لَهُ فَقَالَ يَا رَسُولَ اللَّهِ هَلْ يَنْفَعُهَا أَنْ أَتَصَدَّقَ عَنْهَا فَقَالَ النَّبِيُّ \" نَعَمْ \". فَقَالَ سَعْدٌ حَائِطُ كَذَا وَكَذَا …"
summary:
  ar: "حديث في سنن النسائي، رقم 3650، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3650 (The Book of Wills), that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 3650، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3650 (El Libro de los Testamentos), menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3650 (Le Livre des Testaments), mentionne un testament ou des dernières volontés, le lit de mort et les dernières heures. Le Navigateur de Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
  tr: "Sunan-ı Nesai'de yer alan 3650 numaralı hadis, vasiyetname ve ölüm anından bahsetmektedir. Bu hadis, vasiyetnameler, miras, tarihi kayıtlar ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3650, menyebutkan wasiat terakhir dan saat kematian. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, catatan sejarah, dan makam suci, bersama dengan teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
