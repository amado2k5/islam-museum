text: "… عَنْ أَبِي سَعِيدٍ، أَنَّ نَاسًا، مِنْ أَصْحَابِ النَّبِيِّ مَرُّوا بِحَىٍّ مِنَ الْعَرَبِ فَلَمْ يَقْرُوهُمْ وَلَمْ يُضَيِّفُوهُمْ فَاشْتَكَى سَيِّدُهُمْ فَأَتَوْنَا فَقَالُوا هَلْ عِنْدَكُمْ دَوَاءٌ قُلْنَا نَعَمْ وَلَكِنْ لَمْ تَقْرُونَا وَلَمْ تُضَيِّفُونَا فَلاَ نَفْعَلُ حَتَّى تَجْعَلُوا لَنَا جُعْلاً. فَجَعَلُوا عَلَى ذَلِكَ قَطِيعًا مِنَ الْغَنَمِ. قَالَ فَجَعَلَ رَجُلٌ مِنَّا يَقْرَأُ عَلَيْهِ بِفَاتِحَةِ الْكِتَابِ فَبَرَأَ فَلَمَّا أَتَيْنَا النَّبِيَّ ذَكَرْنَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2064، يذكر الشكوى من العلة، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2064 (Chapters on Medicine), that mentions a complaint of an ailment, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2064، جس میں بیماری کی شکایت، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
