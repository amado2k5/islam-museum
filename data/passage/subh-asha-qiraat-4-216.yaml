text: "… منتهى الأسم، فهو مفرد فى المعنى وفى اللفظ. وكتبوا لئلاً مهموزةً وغير مهموزة بالياء وكان القياس أن تكتب بالألف كما تكتب لأنْ إذا كانت اللام مكسورة بالألف فكذلك إذا زيدت عليها لا، إلا أن الناس آتبعوا رسم المصحف، وكذلك كئِنْ …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 4، ص 216، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 4, p. 216, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 4، ص 216 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
