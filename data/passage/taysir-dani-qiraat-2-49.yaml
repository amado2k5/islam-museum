text: "… و حينئذ وشبهه فصل : واعلم ان جميع ما يسهله حمزة من الهمزات فاعما يُراعى فيه خطّ المصحف دون القياس كما قدّ مناه وقد اختلف. اصحابنا فى سهيل ما يتوسّط من الهمزات بدخول الزوائد عليهن نحو قوله أفَأَنْتَ و فَبِأَىّ …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 2، ص 49، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 2, p. 49, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 2، ص 49 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Dani, al-Taysir fi al-Qira'at al-Sab', volumen 2, pág. 49, que menciona la colección del Corán y los códices, la ortografía del mushaf; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait de l'ouvrage d'al-Dani, al-Taysir fi al-Qira'at al-Sab', volume 2, page 49, mentionnant la collection du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dani'nin \"Al-Taysir fi al-Qira'at al-Sab'a\" (Yedi Okumanın Kolaylaştırılması) adlı eserinin 2. cildinin 49. sayfasında, Kur'an'ın derlenmesi, el yazmaları ve yazı sistemi ele alınmaktadır; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okumaları, yazı sistemi, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan) karya Al-Dani, Volume 2, halaman 49, membahas penyusunan Al-Quran dan manuskripnya, serta aksara Al-Quran; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan diakritik."
