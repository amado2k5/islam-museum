label: { ar: "جامع الترمذي 2944 — كتاب القراءات، الأحرف السبعة", en: "Jami' al-Tirmidhi 2944 — the Book of the Readings; the seven ahruf", ur: "جامع ترمذی 2944 — کتاب القراءات، سبعہ احرف", es: "Jami' al-Tirmidhi 2944 — el Libro de las Lecturas; los siete ahruf" }
text: "… مِنْهُمُ الْعَجُوزُ وَالشَّيْخُ الْكَبِيرُ وَالْغُلاَمُ وَالْجَارِيَةُ وَالرَّجُلُ الَّذِي لَمْ يَقْرَأْ كِتَابًا قَطُّ \". قَالَ يَا مُحَمَّدُ إِنَّ الْقُرْآنَ أُنْزِلَ عَلَى سَبْعَةِ أَحْرُفٍ. وَفِي الْبَابِ عَنْ عُمَرَ وَحُذَيْفَةَ بْنِ الْيَمَانِ وَأُمِّ أَيُّوبَ وَهِيَ امْرَأَةُ أَبِي أَيُّوبَ الأَنْصَارِيِّ وَسَمُرَةَ وَابْنِ عَبَّاسٍ وَأَبِي هُرَيْرَةَ وَأَبِي جُهَيْمِ بْنِ الْحَارِثِ بْنِ الصِّمَّةِ وَعَمْرِو بْنِ الْعَاصِ وَأَبِي بَكْرَةَ. قَالَ أَبُو عِيسَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2944، يذكر الأحرف السبعة. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 2944 (Chapters on Recitation), that mentions the seven ahruf. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 2944، جس میں سبعہ احرف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2944 (Capítulos sobre la recitación), menciona los siete ahruf. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
