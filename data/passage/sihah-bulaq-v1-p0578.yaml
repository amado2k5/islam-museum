text: |-
  ٦٣
  يعلون بالمردقوش الورد ضاحية * على سعابيب ماء الضالة اللجز
  أراد المزج فقلبه ⁦(سغب)⁩ سغب بالكسريسغب سغبا أى جاع فهوساغب وسفبان
  وامرأة سغى ويتيم ذومسغبة أى ذومجاعة قب) السقب القرب ومنه الحديث
  الجارأحق بسقبه وقد سقبت داره بالكسر وأسقبت أى قربت وأسقبتها أنا أى
  قرّبتها والسقب الذكر من ولد الفاقة ولا يقال الانثى سقبة ولكن حائل والسقبة عندهيم هى
  لحشة قال الاعشى يصف حاراوحشا
  تلاسقية قودا مهضومة الحشا « متى ما تخالفه عن القصذيعدم
  وناقة مسقاب اذا كان عادتها أن تلد الذكور وقال الشاعر غرّاء مسا بالفحل أسقبا
  قوله اسقبافعل لانعت والسقب الطويل من كل شئ مع نزارة والسقب والصقب عمود
  الخباء والسقيبة.ثله ( كب سكبت المامسكا أى صيبته وماء مسكوب أى يجر
  على وجه الارض من غيرحفر وسكب الماءينفسه سكوبا وتسكايا وانسكب بعنى وماء
  أسكوب قال الشاعر
  والطاعن الطعقة النجلاء يتبعها•متعجر من دم الاجواف أسكوب
  ومامسكب أى مسكوب وصف بالصدركة ولهم ماصب وما غور والسكب أيضاضرب من
  الشياب وفرس سكب أى ذريع مشل حت والسكب بالتحريك ضرب من الشجر طيب الريح
  قال الكمت بصف تورا وحسا
  كأنه من ندى العرارمع إل * قرّاص أوما ينفض السكب
  الواحدة مكبة وسكاب أسم فرس مثل قطام وقال الشاعر
  أبدت اللعن انّ سكاب علق • نفيس لا يعارولا يباع
  (⁦(ساب)⁩ سلبت الشئ سلبا والاستلاب الاختلاس والسلاب واحد السلب مثل كتاب
  وكشب وهى ثباب الماتم السود قال لبيد فى السلب السودوفى الامساح
  تقول مشمتسلبت المرأة اذا أحدت ويقال بل الاحداد على الزوج والقسلب قد
  كون على غير زوج واتسلبت الذاقة اذا أسرعت فى سيرها حق كانها تخرج من جلدها
  والساب بكسر اللام الطويل قال ذوالرمة يصف فراخ النمامة
  كان أعناقها كتراث سائغة * طارت لفاتفه أوهيشرسلب
  ويروى بالضم من قولهم نخل سلب لاحل عليها وشجرسلب لاورق عليه وهو جع سليب فعيل
  بمعى مفعول والأسلوب بالضم الفنّ يقال أخ_ذفلان فى أساليب من القول أى فى فنون
  منه والسلب بالتحريك الملوب ركذلك السليب والساب أيضالحاء شجر
  معروف بالمن تعمل منه الحبال وهو أجفى من ليف المقل وأصلب وبالمدينة سوق يقال له
  سوق السلابين قال الشاعر (هومرة بن محكان
  فتشنشر الجلد عنها وهى باركة * كما تنشنشْ كفافاتل سلبا
  واء الاصمى قاتل بالفه ودواء اب الأيراية بالقاف واقت وده الغب عام وابمع ملي
