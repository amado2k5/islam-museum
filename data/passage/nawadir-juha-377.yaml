text: "… كان فيها قطن فما سال منها شيء حمل جرة إلى السوق ليبيعها، فقالوا: هي مثقوبة؟ فقال: كلا، فقد كان فيها قطن لوالدتي فما سال منها شيء. لستم بأعلم من صاحبها لبس فروة ثعلب مقلوباً شعرها إلى الخارج، فقيل له ما …"
summary:
  ar: "حمل جحا جرة ليبيعها، فسأل المشترون هل هي مشققة، فقال لا، فقد كانت أمه تحفظ فيها القطن ولم يسل منها شيء. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  en: "Juha carries a jar to sell; buyers ask if it is cracked; he says no, his mother kept cotton in it and nothing ran out. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  ur: "جحا ایک مٹکا بیچنے لے گیا، خریداروں نے پوچھا کہ کیا اس میں دراڑ ہے، تو اس نے کہا نہیں، اس کی ماں اس میں روئی رکھتی تھی اور اس سے کچھ بھی بہا نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  fr: "Juha porte une jarre pour la vendre ; les acheteurs demandent si elle est fêlée ; il dit que non, sa mère y gardait du coton et rien n'en a jamais coulé. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  es: "Juha lleva una jarra para venderla; los compradores preguntan si está agrietada; dice que no, su madre guardaba algodón en ella y nunca se salió nada. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  tr: "Juha satmak için bir kavanoz taşıyordu ve alıcılar kavanozun çatlak olup olmadığını sordular. Juha, annesinin içinde pamuk sakladığını ve hiçbir şeyin sızmadığını, bu yüzden çatlak olmadığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 186}"
  id: "Juha membawa sebuah guci untuk dijual, dan para pembeli bertanya apakah guci itu retak. Ia menjawab bahwa guci itu tidak retak, karena ibunya biasa menyimpan kapas di dalamnya dan tidak ada yang tumpah. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
