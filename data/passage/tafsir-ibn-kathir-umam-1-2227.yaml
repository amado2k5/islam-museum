text: "… في المشهور عنه- وقال أبو حنيفة تكمّلِله: بل تُؤْخَذْ مِن جميع الأعاجم، سواء كانوا مِن أهل الكتاب أو من المشركين، ولا تُؤْخَذْ مِن العرب إلَّا من أهل الكتاب. وقال الإمام مالك: بل يجوزُ أن تُضرب الجزية علىٰ جميع الكُفَّار مِن …"
