text: "… على موضعه الدى كان يقعد فيه للتذكير فسكت حتى طال سكوته فاداه رجل ترى ان تقول فى سكوتك شيئا فانشأ يقول - وغير تقى يأمر الناس بالتقى طبيب يداوى والطبيب مريض فارتفعت الاصوات بالبكاء والضجيج عبد اللّه الرازى قال لما …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 2، ص 91، يذكر الطب والطبيب، والمرض والمريض، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 2, p. 91, that mentions medicine and the physician, illness and the sick, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 2، ص 91 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen escaneado 2, pág. 91, que menciona la medicina y el médico, la enfermedad y los enfermos, y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Sifat al-Safwa d'Ibn al-Jawzi, volume 2, p. 91, qui mentionne la médecine et le médecin, la maladie et les malades, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin resimli 2. cildinin 91. sayfasından, tıp ve hekim, hastalık ve hasta ile tedaviye dair bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari kitab “Sifat al-Safwa” karya Ibn al-Jawzi, jilid 2 bergambar, halaman 91, yang membahas tentang kedokteran dan dokter, penyakit dan pasien, serta pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
