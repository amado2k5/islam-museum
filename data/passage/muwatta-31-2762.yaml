label: { ar: "الموطأ 2762 — أنس بن مالك: عمر يرد السلام ويسأل الرجل كيف أنت فيحمد الله إليه", en: "Muwatta 2762" }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك أنه سمع عمر بن الخطاب، فألقى عليه رجل التحية فرد عليه التحية، ثم سأل عمر الرجل: كيف أنت؟ فقال: أحمد الله إليك. فقال عمر: ذلك الذي أردت منك. {cite:muwatta-maruf-1997 p.551}"
