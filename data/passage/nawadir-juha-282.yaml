text: "… خروف الشيخ ونعجة جاره كان للشيخ خروف، وقد ربَّاهٍ وأطعمَهُ كلّ طعام لذيذ، حتى سَمن وأصبح لا يقدر على الجري، وكان جيرانُهُ كلَّما رأوهُ يقولون للشيخ : يا ليتك تذبح لنا هذا عاتقه: كتفه. ذعر : خاف."
summary:
  ar: "ربى جحا خروفاً سميناً اشتهاه جيرانه، فسُرق وأُكل، وبعد سنتين سرق جحا نعجة جاره البخيل، فمدح الجار النعجة كثيراً كأنها أعجوبة، فجاء جحا بجلدها في كيس ليختبر دعواه، فاستسلم الجار. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  en: "Juha raises a fat sheep that neighbours want to eat, and the sheep is stolen and eaten. Two years later Juha steals the stingy neighbour's ewe, and the neighbour praises the ewe so much, as if it were a marvel, that Juha brings its hide in a sack to test his claim, and the neighbour gives up. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  ur: "جحا ایک موٹا مینڈھا پالتا ہے جسے پڑوسی کھانا چاہتے ہیں، اور مینڈھا چرا کر کھا لیا جاتا ہے۔ دو سال بعد جحا کنجوس پڑوسی کی بھیڑ چرا لیتا ہے، اور پڑوسی اس کی اتنی تعریف کرتا ہے گویا وہ کوئی عجوبہ ہو، تو جحا اس کا دعویٰ آزمانے کو اس کی کھال بوری میں لے آتا ہے، اور پڑوسی ہار مان لیتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  fr: "Juha élève un mouton gras que les voisins veulent manger, et le mouton est volé et mangé. Deux ans plus tard, Juha vole la brebis du voisin avare, et le voisin la loue tellement, comme si c'était une merveille, que Juha apporte sa peau dans un sac pour mettre sa prétention à l'épreuve, et le voisin abandonne. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
  es: "Juha cría un cordero gordo que los vecinos quieren comer, y el cordero es robado y comido. Dos años después Juha roba la oveja del vecino tacaño, y el vecino la alaba tanto, como si fuera una maravilla, que Juha trae su piel en un saco para probar su afirmación, y el vecino se rinde. {cite:juha-nawadir-kubra-djuwaydi p. 138}"
