text: "… - الكلب يرسل على صيد فيعْتَقِبُه غيره - حدَّثنا أبو بكر قال: نا محمد بن فُضَيْل عن مجالد عن الشعبيّ عن عدي بن حاتم قال: قلت: يا رسول اللّٰه إنا قوم نصيد فما يَحِلُّ لنا وما يحرم علينا؟ قال: يَحِلُ …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 4463، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
