text: |-
  *⁦(باب اليم)⁩.
  ٢٦١
  منقطعة مما قبله اخبرا كان أواستفها ماتقول فى الخبرانهالابل أم شاءيافتى وذلاث اذا نظرت
  الى شخص فتوهمته ابلا فقلت ماسبق السك ثم أدركل الظنّ أنه شاءفانصرفت عن الآوّل
  فقلت أم شاءيمعنى بل لانه اضراب عما كان قبله الا أنّ ما يقع بعدبل يقين ومابعد أم مظنون
  وتقول فى الاستفهام هل زيد منطلق أم عمرويافتى انما أضربت عن سؤاللّ عن انطلاق زيد
  وجعلته عن عمروفأم معهاظنّ واستفهام واضراب وأنشد الاخفسْ
  كذبتك عينك أم رأيت بواسط • غلس الظلام من الرباب خيالا
  قال تعالى لاريب فيه من رب العالمين أم يقولون اقتراه وهذا كلام لم يكن أصله اسستفها ما
  ليس قوله أم يقولون افتراه شكا واكنه قال هذ التقبيح صنيعهم ثم قال:ل هو الحق
  -ز ربك كأنه أراد أن ينبه عسلى ما قالوه تحوقولك للرجل الخيرأحب اليك أم الشر وأنت
  تعلم أنه يقول الخير واحكن أردت أن تقبح عنده ماصنع وتدخل أم على هل فتقول أم هلى
  عندك عمرو وقال
  أم هن كبير بكى لم يقض عبرته • اثر الاحبة يوم البين مسكوم
  ولا تدخل أم على الالف لا تقول أعند زيد أم أعندك عمرولات أصل ماوضع للاستفهام
  وفان أحدهما الالف ولا تقع الافى أول المكلام والمانى أم ولاتسع الافى وسط المكلام
  وهل انما أقيم مقام الالف فى الاستفهام فقط ولذلك لم يقع فى كلمواقع الاصل وأم قد تكون
  زائدة كقول الشاعر*ياهند أم ما كان مشي رقصاء يعنى ما كان ⁦(أوم)⁩ يسال أوّمه
  الكلا تأويًا أى سمنه وعظم خلقه قال الشاعر
  عركرك مهجر الضوبان أوّمه • روض القذاف ربيعا أىّ تأويم
  والمأوم العظيم الخلق والرأس قال عنتزة
  وكانى تنأى بجانب دفها الكوحشى من هزج العشىّ مأوم
  يعنى سنورا والاوام بالضم -رالعطسْ ⁦(أيم)⁩ الايامى الذين لا أزواج لهم من الرجال
  والنساء وأصلها أيائم فقلبت لات الواحد رجل أيم سواء كان تزوج من قبل أولم يتزقح وامرأة
  أيم أيضابكرا كانت أوثيبا وقدآمت المرأة من زوجها تقيم ايمة وأيما وأيوما وفى الحديث انه
  سكان يتعوّذ من الايمة وتأيمت المرأة وتأيم الرحل زمانا اذامكث لا يتزوج قال يزيدين
  لحكم النقفوٱو
  كلّ امرئ ستنيم من← العرس أومنها يتيم
  وقال آخر
  نجوت بة وف نفسك غير أنى • اخال بأن سييتم أوتقيم
  أى بيتم ابنك وتقيم امر أقك وقال يعقوب سمعت رجلا من العرب يقول أىّ يكوننّ
  ء-لى الايم نصييى يقول ما يقع ببدى بعد ترك التزوّج أى امرأة صالحة أو غير ذلك وأيمه الله
  تأيما وة ولهم ماله آم وعام أى هلكت امرأته وماشيته حتى يتيم ويعيم فعيمان الى اللين وأيمان
  الى النساء والحرب مأيمة أى تقتل الرجال فتدع النساء بلا أزواج وقدأ أمتها وأنا أئيمها
  مثال أعمتها وأنا أعيمها والايم الحية قال ابن السكيت أصله أيم نحفف مثل لين ولين وهين
