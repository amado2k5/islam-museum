label: { ar: "مسلم 1218 — صفة حجة النبي ⁦(حديث جابر)⁩", en: "Muslim 1218 — Jabir's description of the Prophet's hajj", es: "Muslim 1218 — Descripción de Jabir del Hajj del Profeta", fr: "Muslim 1218 — Description du pèlerinage du Prophète par Jabir", ur: "مسلم 1218 - جابر کا نبی کے حج کا بیان", tr: "Müslim 1218 — Peygamberin hac yolculuğunun tasviri (Cabir Hadisi)", id: "Muslim 1218 — Deskripsi tentang haji Nabi (Hadits Jabir)" }
text: "ثم خطب الناس خطبة فقال: «إن دماءكم وأموالكم حرام عليكم كحرمة يومكم هذا في شهركم هذا في بلدكم هذا، ألا وكل شيء من أمر الجاهلية تحت قدمي موضوع»"
summary:
  ar: "حديث جابر بن عبد الله المطوَّل في وصف حجة الوداع من التلبية إلى الرمي والنحر؛ أثبت وثيقة نبوية لمناسك الحج. وفيه خطبة عرفة: تحريم الدماء والأموال، ووضع ربا الجاهلية وأوله ربا العباس، ودماء الجاهلية وأولها دم ابن ربيعة بن الحارث."
  tr: "Cabir ibn Abdullah'ın, Talbiye'den Cemarat'ın taşlanmasına ve kurban kesimine kadar Hac ibadetini anlatan uzun hadisi, Hac ritüellerini özetleyen kesin bir peygamberlik belgesi niteliğindedir. Bu hadis, kan dökülmesini ve mal edinmeyi yasaklayan, Abbas'ın faiziyle başlayan İslam öncesi faizciliği ve İbn Rabi'ah ibn al-Harith'in kanıyla başlayan İslam öncesi dönemdeki kan dökülmesini ortadan kaldıran Arafat hutbesini de içerir."
  id: "Hadits panjang Jabir bin Abdullah yang menjelaskan tentang Haji Perpisahan, mulai dari Talbiyah hingga pelemparan batu Jamarat dan penyembelihan hewan kurban, memberikan dokumen kenabian yang pasti yang menguraikan ritual-ritual Haji. Dokumen ini mencakup khutbah Arafat, yang melarang pertumpahan darah dan pengambilan harta benda, serta menghapuskan riba pra-Islam, dimulai dengan riba al-Abbas, dan pertumpahan darah di zaman pra-Islam, dimulai dengan darah Ibnu Rabi'ah bin al-Harith."
