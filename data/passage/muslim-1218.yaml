label: { ar: "مسلم 1218 — صفة حجة النبي (حديث جابر)", en: "Muslim 1218 — Jabir's description of the Prophet's hajj" }
text: "ثم خطب الناس خطبة فقال: «إن دماءكم وأموالكم حرام عليكم كحرمة يومكم هذا في شهركم هذا في بلدكم هذا، ألا وكل شيء من أمر الجاهلية تحت قدمي موضوع»"
summary:
  ar: "حديث جابر بن عبد الله المطوَّل في وصف حجة الوداع من التلبية إلى الرمي والنحر؛ أثبت وثيقة نبوية لمناسك الحج. وفيه خطبة عرفة: تحريم الدماء والأموال، ووضع ربا الجاهلية وأوله ربا العباس، ودماء الجاهلية وأولها دم ابن ربيعة بن الحارث."
