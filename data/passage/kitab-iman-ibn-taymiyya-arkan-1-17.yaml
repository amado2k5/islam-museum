text: "… اسم الإيمان مجرداً دخل فيه الإسلام والأعمال الصالحة. كقوله في حديث الشعب الإيمان بضع وسبعون شعبة أعلاها قول لا إله إلا اللّٰه وأدناها إماطة الأذى عن الطريق وكذلك سائر الأحاديث التي يجعل فيها أعمال البر من الإيمان. ثم إن نفي …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 17، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة، وما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 17, that mentions the branches of faith, faith as seventy-odd branches, what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 17 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں، جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 17, que menciona las ramas de la fe, la fe como setenta y tantos ramas, lo que se considera parte de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 17) mentionnant les piliers de la foi, la foi étant définie comme une soixantaine de branches. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Taymiyye'nin \"İman\" (İman) adlı eserinin 1. cildinin 17. sayfasından, yetmişi aşkın iman dalını ve imanın bir parçası olarak kabul edilen şeyleri anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 17, yang menyebutkan cabang-cabang iman, yang jumlahnya lebih dari tujuh puluh, dan apa yang dianggap sebagai bagian dari iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
