text: "… اسم الإيمان مجرداً دخل فيه الإسلام والأعمال الصالحة. كقوله في حديث الشعب الإيمان بضع وسبعون شعبة أعلاها قول لا إله إلا اللّٰه وأدناها إماطة الأذى عن الطريق وكذلك سائر الأحاديث التي يجعل فيها أعمال البر من الإيمان. ثم إن نفي …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 17، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة، وما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 17, that mentions the branches of faith, faith as seventy-odd branches, what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 17 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں، جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
