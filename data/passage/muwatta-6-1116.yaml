summary:
  ar: "يرويه مالك أنه سأل عبد الله بن دينار: ما كان عبد الله بن عمر يصنع بجلال بدنه، حين كُسيت الكعبة هذه الكسوة؟ فقال: كان يتصدق بها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1211) وسويد (526) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.511}"
