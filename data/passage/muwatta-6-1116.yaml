label: { ar: "الموطأ 1116 — مالك سأل عبد الله بن دينار: ما كان ابن عمر يصنع بجلال بدنه حين كُسيت الكعبة هذه الكسوة؟ قال: كان يتصدق بها", en: "Muwatta 1116", es: "Muwatta 1116", fr: "Muwatta 1116", ur: "موطا 1116", tr: "El-Muvatta 1116 — Malik, Abdullah bin Dinar'a sordu: Kâbe bu örtüyle örtüldüğünde İbn Ömer vücudunun örtüsünü ne yaptı? O şöyle dedi: Onu sadaka olarak dağıttı.", id: "Al-Muwatta 1116 — Malik bertanya kepada Abdullah bin Dinar: Apa yang dilakukan Ibnu Umar dengan kain penutup tubuhnya ketika Ka'bah diselimuti kain ini? Dia menjawab: Dia memberikannya sebagai sedekah." }
summary:
  ar: "يرويه مالك أنه سأل عبد الله بن دينار: ما كان عبد الله بن عمر يصنع بجلال بدنه، حين كُسيت الكعبة هذه الكسوة؟ فقال: كان يتصدق بها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1211) وسويد (526) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.511}"
  tr: "Malik, Abdullah ibn Dinar'a şöyle sordu: \"Kâbe bu örtüyle örtüldüğünde Abdullah ibn Ömer vücudunun örtüsünü ne yaptı?\" O da şöyle cevap verdi: \"Onu sadaka olarak verdi.\" Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab (1211), Suveyd (526) ve Yahya ibn Bukayr tarafından, el-Beyhaki'nin de kaydettiği şekilde nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.511}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Abdullah ibn Dinar: \"Apa yang dilakukan Abdullah ibn Umar dengan kain penutup tubuhnya ketika Ka'bah diselimuti kain ini?\" Ia menjawab: \"Ia memberikannya sebagai sedekah.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1211), Suwaid (526), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.511}"
