label: { ar: "صحيح البخاري 6899 — ألبان الإبل وأبوالها", en: "Sahih al-Bukhari 6899 — camel milk and urine as treatment", ur: "صحیح بخاری 6899 — اونٹنی کا دودھ اور پیشاب", es: "Sahih al-Bukhari 6899 — Leche y orina de camello como tratamiento", fr: "Sahih al-Bukhari 6899 — le lait et l'urine de chamelle comme traitement", tr: "Sahih el-Buhari 6899 — Deve sütü ve idrarı", id: "Sahih al-Bukhari 6899 — Susu unta dan air kencing" }
text: "… فَشَكَوْا ذَلِكَ إِلَى رَسُولِ اللَّهِ قَالَ \" أَفَلاَ تَخْرُجُونَ مَعَ رَاعِينَا فِي إِبِلِهِ، فَتُصِيبُونَ مِنْ أَلْبَانِهَا وَأَبْوَالِهَا \". قَالُوا بَلَى، فَخَرَجُوا فَشَرِبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا فَصَحُّوا، فَقَتَلُوا رَاعِيَ رَسُولِ اللَّهِ وَأَطْرَدُوا النَّعَمَ، فَبَلَغَ ذَلِكَ رَسُولَ اللَّهِ فَأَرْسَلَ فِي آثَارِهِمْ، فَأُدْرِكُوا فَجِيءَ بِهِمْ، فَأَمَرَ بِهِمْ فَقُطِّعَتْ أَيْدِيهِمْ وَأَرْجُلُهُمْ، وَسَمَرَ أَعْيُنَهُمْ، ثُمَّ نَبَذَهُمْ فِي الشَّمْسِ حَتَّى مَاتُوا. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6899، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6899 (Blood Money (Ad-Diyat)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6899، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6899 (Dinero de sangre (Ad-Diyat)), menciona la leche y la orina de camella como tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 6899 (Le Prix du Sang (Ad-Diyat)), mentionne le lait et l'urine de chamelle comme remèdes. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 6899 numaralı hadiste deve sütü ve idrarından bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6899, menyebutkan susu unta dan air kencing. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
