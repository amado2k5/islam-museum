label: { ar: "صحيح البخاري 6899 — ألبان الإبل وأبوالها", en: "Sahih al-Bukhari 6899 — camel milk and urine as treatment", ur: "صحیح بخاری 6899 — اونٹنی کا دودھ اور پیشاب" }
text: "… فَشَكَوْا ذَلِكَ إِلَى رَسُولِ اللَّهِ قَالَ \" أَفَلاَ تَخْرُجُونَ مَعَ رَاعِينَا فِي إِبِلِهِ، فَتُصِيبُونَ مِنْ أَلْبَانِهَا وَأَبْوَالِهَا \". قَالُوا بَلَى، فَخَرَجُوا فَشَرِبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا فَصَحُّوا، فَقَتَلُوا رَاعِيَ رَسُولِ اللَّهِ وَأَطْرَدُوا النَّعَمَ، فَبَلَغَ ذَلِكَ رَسُولَ اللَّهِ فَأَرْسَلَ فِي آثَارِهِمْ، فَأُدْرِكُوا فَجِيءَ بِهِمْ، فَأَمَرَ بِهِمْ فَقُطِّعَتْ أَيْدِيهِمْ وَأَرْجُلُهُمْ، وَسَمَرَ أَعْيُنَهُمْ، ثُمَّ نَبَذَهُمْ فِي الشَّمْسِ حَتَّى مَاتُوا. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6899، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6899 (Blood Money (Ad-Diyat)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6899، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
