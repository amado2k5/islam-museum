text: "… الظَّهْرَانِ قال العباس بن عبد المطلب: فقلت: وَاصَبَاحَ قريش، والله، لئن دَخَلَ رسولُ اللّٰه للم مَكَّةَ عَنْوَةً قَبْلَ أن يأتوه فيستأمنوه إنَّه لَهَلاَكُ قريش إلى آخر الدهر، قال : فَجَلَسْتُ على بَغْلَةٍ رسول الله البيضاء، فَخَرَجْتُ عليها، قال: حتى جئتُ …"
