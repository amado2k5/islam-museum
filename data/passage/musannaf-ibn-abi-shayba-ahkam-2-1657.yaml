text: "… - في من لا تجب عليه جمعة - حدثنا أبو بكر قال: حدثنا حُميد بن عبد الرحمن الرؤاسي عن الحسن عن أبيه عن أبي حازم عن مولى لآل الزبير قال: قال رسول اللّٰه والخي الجمعة واجبة على كل حالم إلا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 1657، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 1657, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 1657 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de Ibn Abi Shayba, volume numérisé 2, p. 1657, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Musannaf de Ibn Abi Shayba, volumen digitalizado 2, p. 1657, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 1657. sayfasından, her Müslümanın yükümlülüklerini, yerine getirmesi gereken görevleri ve sorumlu bireyin üzerine düşenleri anlatan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 2, halaman 1657, yang menyebutkan kewajiban setiap Muslim, tugas-tugas yang diwajibkan, dan apa yang menjadi tanggung jawab individu yang bertanggung jawab. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, tugas-tugas, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
