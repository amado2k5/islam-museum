text: "… لم أتعلم أيام البلدة بعد ذهب إلى إحدى المدن، وبينما هو في السوق سأله بعض أهلها : ما هو اليوم؟ حَصِرَ : أي عَيِيَ في النطق. وأصله من الحصر أي الضيق والاحتباس."
summary:
  ar: "سأل أهل بلدة جحا أي يوم هو، فقال إنه جاء اليوم ولم يتعلم أيام البلدة بعد، فليسأل أحد أهلها. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  en: "Asked by townspeople what day it is, Juha says he came today and has not yet learned the days of the town, so they should ask one of its people. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  ur: "ایک شہر کے لوگوں نے جحا سے پوچھا کہ آج کون سا دن ہے، تو اس نے کہا کہ میں آج ہی آیا ہوں اور ابھی اس شہر کے دن نہیں سیکھے، اس لیے یہاں کے کسی باشندے سے پوچھ لو۔ {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  fr: "Des habitants d'une ville demandent à Juha quel jour on est; il dit qu'il est arrivé aujourd'hui et n'a pas encore appris les jours de la ville, et qu'ils devraient demander à l'un de ses habitants. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  es: "Los habitantes de una ciudad le preguntan a Juha qué día es; él dice que llegó hoy y aún no ha aprendido los días de la ciudad, y que le pregunten a uno de sus vecinos. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
