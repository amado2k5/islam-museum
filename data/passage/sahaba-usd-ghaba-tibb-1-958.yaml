text: "… : فاكتوينا فما أفلحنا ولا أَنجحنا. الترمذي. وكان في مرضه تسلم عليه الملائكة، فاكتوى ففقد التسليم، ثمّ عادت إِليه، وكان به استسقاءً فطال به سنين كثيرة، وهو صابر عليه، وشُقَّ بطنه، وأُخذ منه شحم، وثقب له سريرِ فَبَقِي عليه ثلاثين …"
summary:
