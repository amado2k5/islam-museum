  fr: "Un extrait de l'Usd al-Ghaba d'Ibn al-Athir, volume 1 scanné, p. 958, qui mentionne la cautérisation, la maladie et les malades, l'ouverture de la poitrine; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Athir'in \"Asad al-Ghaba\" adlı eserinin resimli 1. cildinin 958. sayfasından, yakma, hastalık ve hasta ile göğüs yarılması konularına değinen bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikası gereği metin kırk kelime içinde alıntılanmıştır."
