text: "… : فاكتوينا فما أفلحنا ولا أَنجحنا. الترمذي. وكان في مرضه تسلم عليه الملائكة، فاكتوى ففقد التسليم، ثمّ عادت إِليه، وكان به استسقاءً فطال به سنين كثيرة، وهو صابر عليه، وشُقَّ بطنه، وأُخذ منه شحم، وثقب له سريرِ فَبَقِي عليه ثلاثين …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 958، يذكر الكي، والمرض والمريض، وشق الصدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 958, that mentions cautery, illness and the sick, the opening of the chest; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 958 کا اقتباس جس میں داغنا، بیماری اور بیمار، شقِّ صدر کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
