text: "… الأئمة، كتاب الصوم والكفارات كتاب الجمع بين الصلادين، كتاب المساجد. كتاب الماتم، كتاب فرض طاعة العلماء، كتاب الصدقة غير الواجية، كتاب الكمبة، كتاب جلد الشارب، كتاب ما أبيح قتله للمحرم، كتاب وجوب الحج، كتاب باطن القراءات، كتاب الجنة والنار، كتاب …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 3، ص 285، يرد فيه ذكر الفرض، والوجوب، والمباح، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 3, p. 285, whose wording mentions the obligatory (fard), obligation (wujub), the permitted (mubah), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 3، ص 285 کا اقتباس جس میں فرض، وجوب، مباح، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Fihrist de Ibn al-Nadim, volume numérisé 3, p. 285, dont le texte mentionne l'obligatoire (fard), l'obligation (wujub), le permis (mubah), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Fihrist de Ibn al-Nadim, volumen digitalizado 3, p. 285, cuyo texto menciona lo obligatorio (fard), la obligatoriedad (wujub), lo permitido (mubah), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Nadim'in Fihrist adlı eserinin 3. cildinin 285. sayfasından, farz olan ameller, görevler, helal olan ameller ve itaat amelleri hakkında bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Jilid 3, halaman 285, yang membahas tentang amalan wajib, kewajiban, amalan yang diperbolehkan, dan amalan ketaatan; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
