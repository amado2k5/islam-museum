text: "… الأئمة، كتاب الصوم والكفارات كتاب الجمع بين الصلادين، كتاب المساجد. كتاب الماتم، كتاب فرض طاعة العلماء، كتاب الصدقة غير الواجية، كتاب الكمبة، كتاب جلد الشارب، كتاب ما أبيح قتله للمحرم، كتاب وجوب الحج، كتاب باطن القراءات، كتاب الجنة والنار، كتاب …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 3، ص 285، يرد فيه ذكر الفرض، والوجوب، والمباح، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 3, p. 285, whose wording mentions the obligatory (fard), obligation (wujub), the permitted (mubah), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 3، ص 285 کا اقتباس جس میں فرض، وجوب، مباح، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
