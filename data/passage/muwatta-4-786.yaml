label: { ar: "الموطأ 786 — مالك: من رأى هلال شوال وحده لا يفطر، لأن الناس يتهمونه، ومن رآه نهاراً فليتم صيام يومه", en: "Muwatta 786" }
summary:
  ar: "قول لمالك: من رأى هلال شوال وحده فإنه لا يفطر، لأن الناس يتهمون على أن يفطر منهم من ليس مأموناً، فيقول أولئك إذا ظهر عليهم: قد رأينا الهلال. ومن رأى هلال شوال نهاراً فلا يفطر، وليتم صيام يومه ذلك، فإنما هو هلال الليلة التي تأتي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (767). {cite:muwatta-maruf-1997 p.387}"
