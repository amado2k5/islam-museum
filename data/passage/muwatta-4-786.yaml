label: { ar: "الموطأ 786 — مالك: من رأى هلال شوال وحده لا يفطر، لأن الناس يتهمونه، ومن رآه نهاراً فليتم صيام يومه", en: "Muwatta 786", es: "Muwatta 786", fr: "Muwatta 786", ur: "موطا 786", tr: "El-Muvatta 786 — Malik: Kim Şevval hilalini yalnız görürse orucunu bozmasın, çünkü insanlar onu suçlayacaklardır. Ama kim gündüz görürse o günkü orucunu tamamlasın.", id: "Al-Muwatta 786 — Malik: Barang siapa melihat hilal bulan Syawal saja, maka janganlah ia membatalkan puasanya, karena orang-orang akan menuduhnya. Tetapi barang siapa melihat hilal di siang hari, maka hendaklah ia menyempurnakan puasanya untuk hari itu." }
summary:
  ar: "قول لمالك: من رأى هلال شوال وحده فإنه لا يفطر، لأن الناس يتهمون على أن يفطر منهم من ليس مأموناً، فيقول أولئك إذا ظهر عليهم: قد رأينا الهلال. ومن رأى هلال شوال نهاراً فلا يفطر، وليتم صيام يومه ذلك، فإنما هو هلال الليلة التي تأتي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (767). {cite:muwatta-maruf-1997 p.387}"
  tr: "Malik şöyle demiştir: \"Kim Şevval hilalini yalnız görürse orucunu bozmasın; çünkü güvenilmez biri görünürse orucu bozmuş sayılırlar ve bunu yapanlar 'Hilal gördük' derler. Kim Şevval hilalini gündüz görürse orucunu bozmasın, o günkü orucunu tamamlasın; çünkü bu sadece ertesi gecenin hilalidir.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (767) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.387}"
  id: "Malik berkata: Barang siapa yang melihat hilal Syawal saja, hendaknya ia tidak berbuka puasa, karena orang-orang dicurigai berbuka puasa jika melihat orang yang tidak dapat dipercaya, dan orang-orang yang melakukannya akan berkata, \"Kami telah melihat hilal.\" Barang siapa yang melihat hilal Syawal di siang hari, hendaknya ia tidak berbuka puasa, tetapi hendaknya ia menyempurnakan puasanya untuk hari itu, karena itu hanyalah hilal malam berikutnya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (767). {cite:muwatta-maruf-1997 p.387}"
