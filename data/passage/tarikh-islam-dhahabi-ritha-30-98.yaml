text: "… خرج نعشه، صاح الناس صيحة واحدة، وقبّلوا الأرض، ومشى فخر الدولة ابن بُوَيْه أمام نعشه، وقعد للعزاء. ولبعضهم فيه : كأنْ لم يَمُتْ حيَّ سواك ولم تُقَمْ على أحدٍ إلا عليك النَّوائحُ لَئِن حَسُنَتْ فيك المراثي وذِكْرُها لقد حَسُنَتْ من …"
