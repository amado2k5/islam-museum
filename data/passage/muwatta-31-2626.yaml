label: { ar: "الموطأ 2626 — مالك: معاذ بن جبل يروي آخر وصية النبي له أن يحسن خلقه للناس", en: "Muwatta 2626", es: "Muwatta 2626", fr: "Muwatta 2626", ur: "موطا 2626", tr: "El-Muvatta 2626 — Malik: Mu'az ibn Cebel, Peygamber'in kendisine verdiği son nasihati şöyle aktarır: İnsanlara iyi ahlaklı davranmak.", id: "Al-Muwatta 2626 — Malik: Mu'adh ibn Jabal meriwayatkan nasihat terakhir Nabi kepadanya: untuk memperlakukan orang lain dengan akhlak yang baik." }
summary:
  ar: "يروي مالك أن معاذ بن جبل قال: آخر ما أوصاني به رسول الله حين وضعت رجلي في الغرز أن قال: أحسن خلقك للناس يا معاذ بن جبل. ويذكر المحقق قول ابن عبد البر إن الحديث منقطع جدا في رواية مالك، وإن الصحيح في معناه حديث أبي ذر. {cite:muwatta-maruf-1997 p.485} {cite:muwatta-maruf-1997 p.486}"
  tr: "Malik, Mu'az ibn Cebel'in şöyle dediğini rivayet eder: \"Ayakkabımı üzengiye koyduğumda Allah Resulü'nün bana son tavsiyesi şuydu: 'Ey Mu'az ibn Cebel, insanlara karşı iyi bir ahlak sahibi ol.'\" Araştırmacı, İbn Abdül-Barr'ın hadisin Malik'in rivayetinde çok kopuk olduğunu ve aynı anlama gelen doğru hadisin Ebu Zerr hadisi olduğunu belirttiğini aktarır. {cite:muwatta-maruf-1997 s.485} {cite:muwatta-maruf-1997 s.486}"
  id: "Malik meriwayatkan bahwa Mu'adz ibn Jabal berkata: \"Nasihat terakhir Rasulullah SAW kepadaku ketika aku meletakkan kakiku di sanggurdi adalah: 'Berbuat baiklah kepada manusia, wahai Mu'adz ibn Jabal.'\" Peneliti menyebutkan pernyataan Ibnu 'Abd al-Barr bahwa hadits tersebut sangat terputus-putus dalam riwayat Malik, dan bahwa versi yang benar dengan makna yang sama adalah hadits Abu Dzar. {cite:muwatta-maruf-1997 p.485} {cite:muwatta-maruf-1997 p.486}"
