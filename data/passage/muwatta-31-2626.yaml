summary:
  ar: "يروي مالك أن معاذ بن جبل قال: آخر ما أوصاني به رسول الله حين وضعت رجلي في الغرز أن قال: أحسن خلقك للناس يا معاذ بن جبل. ويذكر المحقق قول ابن عبد البر إن الحديث منقطع جدا في رواية مالك، وإن الصحيح في معناه حديث أبي ذر. {cite:muwatta-maruf-1997 p.485} {cite:muwatta-maruf-1997 p.486}"
