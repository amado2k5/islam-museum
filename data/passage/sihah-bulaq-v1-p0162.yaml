text: |-
  ٤٧٩
  ندسنا أبامندوسة القيز بالقنا * وماردم من جاربيبة ناقع
  والمنادسة المطاعنة ورماح نوادس قال الشاعر
  ونحن صجنا آل فجران غارة • تمسيم بن مرّوالرماح الفوادسا
  أبوزيد تندست الاخباروعن الاخباراذا تخبرت عنها من حيث لا يعلم بك مثسل تسدّست
  وتنطت ( نسس نست الناقة أنسهانسا اذازجرتها ومنه المنسة وهى العصاعلى
  مفعلة بالكسر فان همزت كان من نسأتها والنسيئة الايسكال بين الناس والنسائس
  النهائم عن ابن السكيت والنسيسبقيسة الروح ومنه قول الشاعر ١
  فقد أودى اذا بلغ النسيس قال الاصمعى النس اليبس وقدنس ينس وينس نسا أى يبس
  يقال جاءناجخبزة ناسة قال العجاج ٢ وبلدقسى قطاهنسا أى يابسة من العطش
  ويقال لمكة الناسة لقلة الماهبها وذ-نس الطائراذا أسرع فى طيرانه والفسناس جنس من
  نلخلق يثب أحدهم على رجل واحدة والنسناس الجوع عن أبي عمرو والتنساس السير
  الشديد وأنشد الاه ى للمطيئة ٣ ال بها حورى وتنساسى طس) التنطس
  المبالغة فى التطهر وكل من أدق النظر فى الامور واستقصى علها فهو متنطس وفى حديث
  عررضى اللّٰه عنه لولا التنطس ما باليت أن لا أغسل يدى يقال منه رجل نطس ونطس وقد
  نطس بالكسر نطسا و-نسه قبل للمتطيب نطيس مثال فسيق ونطاسى أيضا قال البعيث
  ابن بشريص ف شجة أوجراحة
  اذا قاسها الاسى النطاسى أدبرت • غثيئتها وازداد وهياهزومها
  قال أبو عبيدة ويروى النطاسى بفتح النون وتنطست الاخبارتحسستها والناطس الجاسوس
  ( ن س النعاس الوسن وفى المئل مطل كنعاس الكاب أى متعل دائم وقد
  عست بالفتح أنعس نعاسا ونعست نعسة واحدة وأنا ناعس وناقة نعوس توصف بالسماحة
  بالدرّلانها اذادرّت نعنت قال الشاعر
  نعوس اذادرتت جروزا ذاغدت • بويزل عام أوسديس كبازل
  قمي النفس الروح يقال خرجت نفسه قال أبو خراش
  فجاسالم والنفس منه بندقه • ولم ينج الاجفن سف ومتزرا
  أى بجفن سيف ومنزر والنفس الدم يقال مالت نفسه وفى الحديث ماليس له نفس سائلة
  فانه لا ينصس الماء اذامات فيه والنفس أيضا الجسد قال الشاعر أ وس بن ججر
  نبئت أن بنى تصيم أدخلوا أبياتهم تامورنفس المنذر
  والتامور الدم وأماقولهم ثلاثة أنفس فيذ كرونه لانه-م يربدون به الانسان والنفس العين
  بقال أصابت فلانانفس ونفسته بنفس اذا أصبته بعين والنافس العاثن والنافس الخامس
  من سهام الميسرويقال «والرابع ونفس الشىء عينه يؤ كدبه يقال رأيت فلانانفسه وجاءنى
  نفسه والنفس أيضاقدردبغة مما يدبغ به الاديم من القرظ وغيره يقال هب له نفسا
  من دباغ قال الاصهمى بعثت امرأة من العرب بنتالها الى جارتها فقالت لها تقول لك أمى
  اعطينى نفسا أونفسين أمعس به منيذنى فانى أفدة أى مستعجله لا أتفر غ لا تخاذ الدباغ من
  ١ و أبوزبيد وصدره كما
  فى نسعنة * اذا علت مخالبه
  روابعا وبعدربع خسا
  وقد تظرنسكم
  للودد
