text: "… وارثاً، وزاد على حقه، أو نقصه منه، ولهذا قال النَّبِيُّ وَلِلمه في خطبته في حجَّة الوداع : إنَّ اللّه قد أعطى كلَّ ذي حقِّ حقَّه فلا وصية لوارث أخرجه : أبو داود و، وابن ماجه، والترمذي، والبيهقي من حديث أبي …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 627، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
