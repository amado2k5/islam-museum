  فأقع كما أقعى أبوك على استه * رأى أن ريما فوقه لا يعادله
  وف الحديث أنه صلى اللّٰه عليه وسلم أكل مفعيا أبو زيدقعا الفححل على الناقة يقهو قعوا وقعوا
  على فعول مثل قاع وقد يكون القعوّ للظليم أيضا قال ابن دريدامرأة قعواء دقيقة الساقين
  والقعوخشبتان فى البكرة فيه-ما المحورفاذا كانا من حديد فهوالططاف فا) القفا
  مقصور مؤخر العنق يذكرويونت قال يعقوب وأنشدنا الفرّاء
  وما المولى وان عرضت قفاه • بأجل للمحامد من حار
  يقول ليس المولى وان أتى بما يحمد عليه بأكثر من الهار محامد وابمع ققى" على فعولمذل
  عصاوعصىّ ويجمع فى القلة على أقفاءمثل رحا وأرحاء وقدجاء عنهم أقفية وهو على غير
  قياس لانه جمع الممدود مثل سماء وأ-مية أبوزيد قفيت الرجل أقفه قفما اذاضريت قفاه قال
  وهذه شاة قفية أى مذبوحة من قفاها وغيره يقول قفينة والنون زائدة وقفوت أثره قذوا
  وقفوًا أى اتبعته وقفيت على أثره بفلان أى أبيعته اياه قال تع-الى ثم قفيذا على آثارهم برسلنا
  ومنه الكلام المقنى ومنه سهيت قوافى الشهرلات بعضها يتبع أربعض والقافية أيضا القفا
  وفى الحديث يعقد الشيطان على قافية رأس أحدكم وعويف القوافى أسم شاعروهوعويف
  ابن معاوية بن عقية بن حدن بن حذيفة بن بدر وقفوت الرجل اذا قذف، بقجورصر يحاوفى
  الحديث لاحدّ الافى القفو المين وقفوت الرجسل أقفوه قفوا اذارميته بأمرقبيح والاسم
  القفوة بالمكسر والتنىّ والققية الشى يؤثربه الضيف والسى وقال يصف قرسا
  يسق دوا قنى السكن مربوب * وانماجعل اللبن دواء لانحم يضمرون الخيل بسقى اللبن
  والحنذ وسكذلك القفاوة يقال منه قفوته به قفوا وأقفيته به أيضا اذا آثرته به ويقال هو
  مقتفى به اذا كان مؤترامكرما والاسم القفوة بالكسر ويقال فلان قفوتى أى خيرتى عن أوثره
  وفلان قفوتى أتهمتى كأنه من الاضداد وقال بعضهم قرقتى واقتفاه أى اختاره واقتنى
  أثره وتقفاه أى اتبعه وقولهم لا أفعله قفا الدهرأى أبدا لا قلبت السويق واللهم
  نهومة لىّ وقلوته فهو مقلوّاغة والرجسل قلاء والقلية من الطعام وابهع قلايا والمقلاة والمقلى
  الذى يقلى عليه وهما مقليان والمع المقالى وقلا العيرأتنه ية لوها قلوا اذا طردها وساقها
  قال ذوالزقة* بقلو تحائص أشباها محملجة• والقلى البغض فان قتحدت القاف مددت تقول
  قلاه يقليه قلى وقلا ويقلاه لغة طي وأنشدثعاب • أيام أمّ الغمر لا نقلاها * وتقلى
  أى تبغض وقال
  أسيثى بنا أوأحسى لاملومة • لدينا ولا مقلية ان تقلت
  خاطبه ائم غايب أبو عمر والمقلاء على مفعال والقلة مخففة عودان يلعب بم ما الصبيان والمقلا.:
