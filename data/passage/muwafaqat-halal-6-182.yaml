text: "… يبين هذا المفى، ذكره ابن عبد البر بسندِ لم يَرضَهِ وان كان غيرُه قد هون الأمر فيه، أنه قال : ستفترقُ أمتى على يضعٍ وسبعين فرقة، أعظمها فتنة الذين يَقِيسون الأمورَ برأيهم، فيُحِلُّون الحرامَ ويحرِّّمون الحلال فهذا نص على دخول …"
