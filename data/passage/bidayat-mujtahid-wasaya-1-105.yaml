text: "… يحضره الشهود، أما ما حضره شاهدان؛ فهو نكاح علانية، لا نكاح السر. أما المالكية فلهم في حقيقة نكاح السر، طريقتان: الأولى: طريقة الباجي وهي استكتام غير الشهود، كما لو تواصى الزوجان والولي على كتمه، سواء أوصى الشهود بذلك أم لا."
