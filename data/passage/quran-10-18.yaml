text: "وَيَعْبُدُونَ مِن دُونِ ٱللَّهِ مَا لَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَيَقُولُونَ هَـٰٓؤُلَآءِ شُفَعَـٰٓؤُنَا عِندَ ٱللَّهِ ۚ قُلْ أَتُنَبِّـُٔونَ ٱللَّهَ بِمَا لَا يَعْلَمُ فِى ٱلسَّمَـٰوَٰتِ وَلَا فِى ٱلْأَرْضِ ۚ سُبْحَـٰنَهُۥ وَتَعَـٰلَىٰ عَمَّا يُشْرِكُونَ"
text_search: "ويعبدون من دون الله ما لا يضرهم ولا ينفعهم ويقولون هؤلاء شفعاؤنا عند الله ۚ قل أتنبئون الله بما لا يعلم في السماوات ولا في الأرض ۚ سبحانه وتعالى عما يشركون"
translations:
  en: { text: "They worship beside Allah that which neither hurteth them nor profiteth them, and they say: These are our intercessors with Allah. Say: Would ye inform Allah of (something) that He knoweth not in the heavens or in the earth? Praised be He and High Exalted above all that ye associate (with Him)!", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور یہ (لوگ) خدا کے سوا ایسی چیزوں کی پرستش کرتے ہیں جو نہ ان کا کچھ بگاڑ ہی سکتی ہیں اور نہ کچھ بھلا ہی کر سکتی ہیں اور کہتے ہیں کہ یہ خدا کے پاس ہماری سفارش کرنے والے ہیں۔ کہہ دو کہ کیا تم خدا کو ایسی چیز بتاتے ہو جس کا وجود اسے نہ آسمانوں میں معلوم ہوتا ہے اور نہ زمین میں۔ وہ پاک ہے اور (اس کی شان) ان کے شرک کرنے سے بہت بلند ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
