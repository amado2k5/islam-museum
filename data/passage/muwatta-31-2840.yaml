label: { ar: "الموطأ 2840 — عائشة: لا نورث ما تركنا فهو صدقة", en: "Muwatta 2840" }
summary:
  ar: "يروي مالك عن ابن شهاب، عن عروة بن الزبير، عن عائشة أم المؤمنين أن أزواج النبي لما توفي رسول الله أرسلن عثمان بن عفان إلى أبي بكر الصديق يسألنه ميراثهن من رسول الله، فقالت لهن عائشة: ألم يقل رسول الله: لا نورث، ما تركنا فهو صدقة؟ ويذكر المحقق قول ابن عبد البر أن الرواية في الموطأ عن عائشة عن النبي، وأن رواية إسحاق الفروي عن أبي بكر الصديق عن النبي غير محفوظة عن مالك. {cite:muwatta-maruf-1997 p.592}"
