label: { ar: "الموطأ 2840 — عائشة: لا نورث ما تركنا فهو صدقة", en: "Muwatta 2840", es: "Muwatta 2840", fr: "Muwatta 2840", ur: "موطا 2840", tr: "Al-Muwatta 2840 — Aişe: Biz miras bırakmayız; bıraktığımız şey sadakadır.", id: "Al-Muwatta 2840 — Aisyah: Kami tidak meninggalkan warisan; yang kami tinggalkan adalah sedekah." }
summary:
  ar: "يروي مالك عن ابن شهاب، عن عروة بن الزبير، عن عائشة أم المؤمنين أن أزواج النبي لما توفي رسول الله أرسلن عثمان بن عفان إلى أبي بكر الصديق يسألنه ميراثهن من رسول الله، فقالت لهن عائشة: ألم يقل رسول الله: لا نورث، ما تركنا فهو صدقة؟ ويذكر المحقق قول ابن عبد البر أن الرواية في الموطأ عن عائشة عن النبي، وأن رواية إسحاق الفروي عن أبي بكر الصديق عن النبي غير محفوظة عن مالك. {cite:muwatta-maruf-1997 p.592}"
  tr: "Malik, İbn Şihab'dan, Urve ibn el-Zübeyr'den, o da Müminlerin Annesi Ayşe'den rivayet ettiğine göre, Allah Resulü vefat ettiğinde, Peygamberin eşleri Osman ibn Affan'ı Ebu Bekir el-Siddik'e göndererek ondan Allah Resulü'nden miraslarını istemesini rica etmişlerdir. Ayşe onlara, \"Allah Resulü, 'Biz miras bırakmayız; bıraktığımız şey sadakadır' dememiş miydi?\" demiştir. Araştırmacı, İbn Abd el-Barr'ın, el-Muvatta'daki rivayetin Ayşe'den, o da Peygamberden rivayet edildiğine ve İshak el-Feravi'nin Ebu Bekir el-Siddik'ten, o da Peygamberden rivayet ettiğine dair ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.592}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Urwah ibn al-Zubayr, dari Aisyah, Ibu Kaum Mukmin, bahwa ketika Rasulullah wafat, istri-istri Nabi mengutus Utsman ibn Affan kepada Abu Bakar al-Siddiq untuk meminta warisan mereka dari Rasulullah. Aisyah berkata kepada mereka, “Bukankah Rasulullah bersabda, ‘Kita tidak meninggalkan warisan; yang kita tinggalkan adalah sedekah’?” Peneliti menyebutkan pernyataan Ibn Abd al-Barr bahwa riwayat dalam al-Muwatta adalah dari Aisyah atas otoritas Nabi, dan bahwa riwayat Ishaq al-Farawi atas otoritas Abu Bakar al-Siddiq atas otoritas Nabi tidak terpelihara dari Malik. {cite:muwatta-maruf-1997 p.592}"
