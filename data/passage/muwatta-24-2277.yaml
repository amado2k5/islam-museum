label: { ar: "الموطأ 2277 — عبد الله بن أبي بكر بن حزم: ولاء الموالي بعد موت الوارث", en: "Muwatta 2277" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن عبد الملك بن أبي بكر بن عبد الرحمن بن الحارث بن هشام عن أبيه، أن العاص بن هشام توفي عن ثلاثة بنين، اثنين لأم وواحد من أم أخرى. فورث أحد الشقيقين ماله وولاء موالي أبيه، ثم توفي الوارث وترك ابنه وأخاه لأبيه، فاختصما إلى عثمان بن عفان، فقضى للأخ بولاء الموالي. {cite:muwatta-maruf-1997 p.339}"
