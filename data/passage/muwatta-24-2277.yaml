label: { ar: "الموطأ 2277 — عبد الله بن أبي بكر بن حزم: ولاء الموالي بعد موت الوارث", en: "Muwatta 2277", es: "Muwatta 2277", fr: "Muwatta 2277", ur: "موطا 2277", tr: "El-Muvatta 2277 — Abdullah ibn Abi Bakr ibn Hazm: Veliahtın ölümünden sonra azat edilen kölelerin sadakati", id: "Al-Muwatta 2277 — Abdullah ibn Abi Bakr ibn Hazm: Kesetiaan budak yang dibebaskan setelah kematian ahli waris" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن عبد الملك بن أبي بكر بن عبد الرحمن بن الحارث بن هشام عن أبيه، أن العاص بن هشام توفي عن ثلاثة بنين، اثنين لأم وواحد من أم أخرى. فورث أحد الشقيقين ماله وولاء موالي أبيه، ثم توفي الوارث وترك ابنه وأخاه لأبيه، فاختصما إلى عثمان بن عفان، فقضى للأخ بولاء الموالي. {cite:muwatta-maruf-1997 p.339}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Hazm'dan, o da Abdul Malik ibn Abi Bakr ibn Abdur Rahman ibn al-Harith ibn Hisham'dan, o da babasından rivayet eder ki, el-As ibn Hisham üç oğul bırakarak vefat etmiştir; iki oğlu bir anneden, biri de başka bir annedendir. Kardeşlerden biri babasının servetini ve azat edilmiş kölelerinin biatını miras almıştır. Sonra mirasçı vefat etmiş, oğlunu ve kardeşini babasına bırakmıştır. Anlaşmazlıklarını Osman ibn Affan'a götürmüşler ve Osman ibn Affan, azat edilmiş kölelerin biatı konusunda kardeşin lehine hüküm vermiştir. {cite:muwatta-maruf-1997 s.339}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Hazm, dari Abdul Malik ibn Abi Bakr ibn Abdur Rahman ibn al-Harith ibn Hisham, dari ayahnya, bahwa al-As ibn Hisham meninggal dunia meninggalkan tiga putra, dua dari satu ibu dan satu dari ibu yang lain. Salah satu saudara mewarisi kekayaannya dan baiat para budak yang dibebaskan ayahnya. Kemudian ahli waris tersebut meninggal dunia, meninggalkan putra dan saudaranya kepada ayahnya. Mereka membawa perselisihan mereka kepada Uthman ibn Affan, yang memutuskan untuk memihak saudara tersebut mengenai baiat para budak yang dibebaskan. {cite:muwatta-maruf-1997 p.339}"
