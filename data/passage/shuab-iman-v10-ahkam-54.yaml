text: "… عقدهم، وسلامة سريرتهم، هو الأمر بالمعروف والنهي عن المنكر، ثم إن ذلك ليس يليق بكل أحد، ولا يجب على كل أحد، وإنما هو من الفروض التي ينبغي أن يقوم بها سلطان المسلمين إذا كانت إقامة الحدود إليه، والتعزير موكولا إلى …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 54، يرد فيه ذكر الفرض، وما وجب على كل مسلم، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 54, whose wording mentions the obligatory (fard), a duty laid on every Muslim, what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
