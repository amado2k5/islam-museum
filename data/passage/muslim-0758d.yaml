label:
  ar: "مسلم 758d — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Muslim 758d — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "مسلم 758d — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
text: "ينزل الله في السماء الدنيا لشطر الليل أو لثلث الليل الآخر فيقول من يدعوني فأستجيب له أو يسألني فأعطيه . ثم يقول من يقرض غير عديم ولا ظلوم . قال مسلم ابن مرجانة هو سعيد بن عبد الله ومرجانة أمه …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 758d: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 758d: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 758d: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
