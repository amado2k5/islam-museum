text: "السيرة لابن هشام فهرس الموضوعات الصفحة الموضوع رأي عتبة.. حديث زعماء قريش مع النبي رَيِة عبد الله بن أبي أمية ورسول اللّٰه وَلِلخم أبو جهل يتوعّد الرسول وَلِ خي النضر بن الحارث يذكر لقريش رأيه في النبي لَالفي أذى النَّضر …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 689، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Hisham's Sira, p. 689, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "سیرت ابن ہشام، ص 689 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de la Sira de Ibn Hisham, pág. 689, con menciones de naciones, religiones y pueblos no musulmanes; tomado del escaneo automático, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait de la Sira d'Ibn Hisham, p. 689, mentionnant des nations, des religions et des peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "İbn Hişam'ın Peygamber biyografisinden, 689. sayfadan, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Müslüman olmayan milletler, dinler, mezhepler ve halklar için tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari biografi Nabi karya Ibnu Hisham, halaman 689, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
