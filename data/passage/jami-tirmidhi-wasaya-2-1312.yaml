text: "… عِنْدَ أَبِي هُرَيْرَةَ وَعَلَيْهِ ثَوْبَانِ مُمَشَّقَانِ مِنْ كَتَّانٍ، فَتَمَخَّطَ فِي أَحَدِهِمَا، ثُمَّ قَالَ: بَخِ بَخٍ، يَتَمَحَّطُ أَبُو هُرَيْرَةَ فِي الكَتَّانِ، لَقَدْ رَأْيُنِي وَإِنِّي لأَخِرُّ فِيمَا بَيْنَ مِنْبَرِ رَسُولِ اللّهِ وَيِلّ وَحُجْرَةِ عَائِشَةً، مَغْشِيًّا عَلَيَّ، فَيَجِيءُ الجَائِي فَيَضَعُ رِجْلَهُ عَلَى عُنُقِي …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 1312، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 1312, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
