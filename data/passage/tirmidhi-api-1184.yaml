label: { ar: "جامع الترمذي 1184 — أدب المزاح وحدوده", en: "Jami' al-Tirmidhi 1184 — the ethics and limits of jesting", ur: "جامع ترمذی 1184 — مزاح کے آداب اور حدود", fr: "Jami' al-Tirmidhi 1184 — l'éthique et les limites de la plaisanterie", es: "Jami' al-Tirmidhi 1184 — la ética y los límites de la broma" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا حَاتِمُ بْنُ إِسْمَاعِيلَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَرْدَكَ، عَنْ عَطَاءٍ، عَنِ ابْنِ مَاهَكَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ثَلاَثٌ جِدُّهُنَّ جِدٌّ وَهَزْلُهُنَّ جِدٌّ النِّكَاحُ وَالطَّلاَقُ وَالرَّجْعَةُ . قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ. قَالَ أَبُو عِيسَى وَعَبْدُ الرَّحْمَنِ هُوَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1184، فيه أدب المزاح وحدوده. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 1184, with the ethics and limits of jesting. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 1184، جس میں مزاح کے آداب اور حدود ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1184, avec l'éthique et les limites de la plaisanterie. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 1184, con la ética y los límites de la broma. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
