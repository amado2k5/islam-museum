text: |-
  ٢١٠
  الجداجد والجدحد بالفتح الارض الصلبة المستوية وقال الشاعر
  سم السنابك لاتقى بالحدجد وجد الشئ يجد بالكسر حدّة صار جديدا وهو نقيض الخلق
  وجددت الشئ أجده بالضم حد اقطعته وتوب جديد وهوفى معنى مجدوديرادبه حين جد
  الحاتك أى قطعه قال الشاعر
  أبى حى سليمى أن يبيدا • وأمسى حبلها خلقا جديدا .
  أبى مقطوعا
  ومنه قيل ملحفة جديد بلاها لانها بمعنى مفعولة وشياب جدد مثل سرير وسرر وتجدد الشئ
  صارجديد اوأجه واستجده وجدده أى صيره جديدا وجى بيت فسلان فاحدّبيتا من شعر
  ويقال إن ليس الجديد أبل وأجد واحد الكاسى والجديد وجه الارض وقوله-م لا أفعله
  ما اختلف الجديدان وما اختلف الاجدان يعنى به الليل والنهار وجديدة السرج ما تحت
  الدقتيز من الرفادة واللبد الملزق وهماجديدتان وهومولد والعرب تقول جدية السرج
  وجدية السرج وجد النخل يجده أى صرمه وأجد النخل حان له أن يجد وهذاز من الجداد
  والجداد مثل الصرام والقطاف فكانّ الفعال والفعال مطردان فى كل ما كان فيه معنى وقت
  الف-عل مشبهان فى معاقبته سما بالاوان والاوان والمصدر من ذلاك كله على الفعل مثل الجدّ
  والصرم والقطف وحدّت أخلاف الناقة اذا أضربما الصرار وقطعها فهى فاقة مجدودة
  الاخلاف وامر أة جداءصغيرة الشدى وفلاة جداء لاماه بها و تجدد الضرع ذهب لبنه
  ابن السكيت الجد ود النهجة التى قل" لبنها من غير بأس والجمع الجد ائد ولاية-ال للمنزجدود
  ولسكن مصور قال والجداء التى ذهب لبنها من عيب وجدودموضع فيه ما يسمى الكلاب
  وكانت به وقعة مرّتين ويقال للكلاب الأوّل يوم جدودوهو لنغلب على بكر بن وائل
  قال الشاعر أرى إلى عافت جدود فلم تذق * جافطرة الاتحلة مقسم
  ⁦( برد)⁩ الجرد فضاء لانبات فيه قال أبوذؤيب يصف حاروحش وانه يأتى الماءليلا
  فيشمرب بقضى لبانته بالليل ثم اذا ، أضحى تيم حزماحوله جرد .
  والجرد فى قول الراجز ياريها اليوم على مبين • على مبين جرد القصيم
  اسم موضع بيلادبني تميم وأرض حردة وفضاء أحرد لانبسات فيه والجمع الابارد وأجارد بالضم
  موضع ورجل أجردبين الجرد لاشعر عليه وفرس أجرد وذلك اذارقت شعرته وقصرت
  وهو. ذح وقول أبى ذؤيب
  تدلى عليها بين سب وحيطة * بجرداء مثل الوكف يكبو غرابها .
  يعنى دذرة ملساء والجريد الذى يجرّد عنه الحوض ولا يسمى جريدا مادام عليه الخوص
  وانمايسمى سعفا الواحدة جريدة وكل شئ قشرته عرشيفة_دبردته عنه والمقشور مجرود
  وماقش رعنه جرادة ورجل جارود أى مشؤم وسنة جارود أى شديدة المحل والجارود العبدى
  رجل من الصابة واعه بشر بن عمروبن عبد القيس وسمى الجارودلاته قرّبابله الى أخواله
  بنى شيبان وجاداء فه شاذلك الداء فى ابل أخواله فاهلكها وفيه قال الشاعر
