text: "… عَامِ، لَوَجَبَتْ، وَإِذَنْ لَمَا اسْتَطَعْتُمْ، وَلَوْ لَمْ تَسْتَطِيعُوا لَكَفَرْتُمْ، وَإِنَّمَا هِيَ حَجَّةٌ وَعُمْرَةٌ، فَمَنْ قَضَاهُمَا فَقَدْ قَضَى الْفَرِيضَةَ، ثُمَّ كُلَّ شَيْءٍ أَصَبْتَهُ بَعْدُ فَهُوَ تَطَوُّعٌ. قَالَ قَتَادَةُ : وَقَالَ عُمَرُ بْنُ الْخَطَّابِ : يَا أَيُّهَا النَّاسُ، كُتِبَ عَلَيْكُمُ الْعُمْرَةُ. • …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 3، ص 396، يرد فيه ذكر الفريضة والفرائض، وما كُتب على المؤمنين، و«لو قلت نعم لوجبت»، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 3, p. 396, whose wording mentions the obligation (farida), what was prescribed for the believers, 'had I said yes, it would have become obligatory', the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 3، ص 396 کا اقتباس جس میں فریضہ اور فرائض، جو مومنوں پر لکھ دیا گیا، «اگر میں ہاں کہہ دیتا تو واجب ہو جاتا»، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de 'Abd al-Razzaq, volume numérisé 3, p. 396, dont le texte mentionne l'obligation (farida), ce qui a été prescrit aux croyants, « si j'avais dit oui, cela serait devenu obligatoire », l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Musannaf de 'Abd al-Razzaq, volumen digitalizado 3, p. 396, cuyo texto menciona la obligación (farida), lo que se prescribió a los creyentes, «si hubiera dicho que sí, se habría hecho obligatorio», el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Musannaf Abd al-Razzaq'ın Resimli Cilt 3, sayfa 396'sından bir alıntı; farz olan fiiller ve görevler, müminler için farz kılınanlar, \"Evet deseydim, farz olurdu\" ifadesi ve gönüllü fiillerden bahsediliyor; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına göre yaklaşık kırk kelime olarak alıntılanmıştır ve düzeltilmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 3, hlm. 396, yang menyebutkan amalan dan kewajiban wajib, apa yang dianjurkan bagi orang beriman, pernyataan \"Jika aku berkata ya, maka itu wajib,\" dan amalan sunnah; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks tersebut disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
