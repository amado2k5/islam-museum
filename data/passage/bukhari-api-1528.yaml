label: { ar: "صحيح البخاري 1528 — الأب والأبوة", en: "Sahih al-Bukhari 1528 — the father and fatherhood", ur: "صحیح بخاری 1528 — باپ اور والدیت", es: "Sahih al-Bukhari 1528 — El padre y la paternidad", fr: "Sahih al-Bukhari 1528 — le père et la paternité" }
text: "حَدَّثَنَا أَحْمَدُ، حَدَّثَنَا ابْنُ وَهْبٍ، قَالَ أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ ـ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مُهَلُّ أَهْلِ الْمَدِينَةِ ذُو الْحُلَيْفَةِ، وَمُهَلُّ أَهْلِ الشَّأْمِ مَهْيَعَةُ وَهِيَ الْجُحْفَةُ، وَأَهْلِ نَجْدٍ قَرْنٌ \". قَالَ ابْنُ عُمَرَما ـ زَعَمُوا أَنَّ النَّبِيَّ قَالَ وَلَمْ أَسْمَعْهُ \" وَمُهَلُّ أَهْلِ الْيَمَنِ يَلَمْلَمُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1528، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1528 (Hajj (Pilgrimage)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1528، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1528 (Hajj (Peregrinación)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1528 (Hajj (Pèlerinage)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
