text: "… خَيْرَ في الإمَارَةِ لِرَجُلٍ مُسلِم، ثم قام آخر، فقال: يا الإفريقي، وهو ضعيف. مُقرَّبِ، ولا نَبِيِّ مُرْسَل، حتَّى جَزَّأْهَا ثَمَانِيَةَ أَجْزَاءِ، فإِنْ كُنْتَ جُزْءاً منها أَعْمَلِيْتُكَ، وإِنْ كُنْتَ غَنِيّاً عنها، فإِنَّما هِيَ صُداعٌ في الرَّأْسِ، وداءٌ في البَطْن، فقُلتُ في …"
