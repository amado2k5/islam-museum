label: { ar: "سنن أبي داود 2967 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 2967 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 2967 — ترکہ اور میراث" }
text: "… بْنِ أَوْسِ بْنِ الْحَدَثَانِ، قَالَ كَانَ فِيمَا احْتَجَّ بِهِ عُمَرُ أَنَّهُ قَالَ كَانَتْ لِرَسُولِ اللَّهِ ثَلاَثُ صَفَايَا بَنُو النَّضِيرِ وَخَيْبَرُ وَفَدَكُ فَأَمَّا بَنُو النَّضِيرِ فَكَانَتْ حُبْسًا لِنَوَائِبِهِ وَأَمَّا فَدَكُ فَكَانَتْ حُبْسًا لأَبْنَاءِ السَّبِيلِ وَأَمَّا خَيْبَرُ فَجَزَّأَهَا رَسُولُ اللَّهِ ثَلاَثَةَ أَجْزَاءٍ جُزْءَيْنِ بَيْنَ الْمُسْلِمِينَ وَجُزْءًا نَفَقَةً لأَهْلِهِ فَمَا فَضَلَ عَنْ نَفَقَةِ أَهْلِهِ جَعَلَهُ بَيْنَ فُقَرَاءِ الْمُهَاجِرِينَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2967، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2967 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2967، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
