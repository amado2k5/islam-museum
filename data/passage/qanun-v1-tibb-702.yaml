text: "… الوجه ويزيل الكهبة وأثر الدم الميّت. والبرّي ضماد جيد للبهق، ويجفّف اللسان، وينفع من داء التعلب. الأورام والبثور : يحلّل الأورام الحارة وكل ورم مزمن، ويوضع بالكبريت على الخنازير. الجراح والقروح : ينفع من الجرب والقوابي. آلات المفاصل : ينفع …"
