label: { ar: "سنن ابن ماجه 249 — وصية أو عهد أخير", en: "Sunan Ibn Majah 249 — a testament or parting counsel", ur: "سنن ابن ماجہ 249 — وصیت یا آخری نصیحت", es: "Sunan Ibn Majah 249 - un testamento o consejo de despedida" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَمْرُو بْنُ مُحَمَّدٍ الْعَنْقَزِيُّ، أَنْبَأَنَا سُفْيَانُ، عَنْ أَبِي هَارُونَ الْعَبْدِيِّ، قَالَ كُنَّا إِذَا أَتَيْنَا أَبَا سَعِيدٍ الْخُدْرِيَّ قَالَ مَرْحَبًا بِوَصِيَّةِ رَسُولِ اللَّهِ ـ. إِنَّ رَسُولَ اللَّهِ ـ قَالَ لَنَا \" إِنَّ النَّاسَ لَكُمْ تَبَعٌ وَإِنَّهُمْ سَيَأْتُونَكُمْ مِنْ أَقْطَارِ الأَرْضِ يَتَفَقَّهُونَ فِي الدِّينِ فَإِذَا جَاءُوكُمْ فَاسْتَوْصُوا بِهِمْ خَيْرًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 249، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 249 (The Book of the Sunnah), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 249، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 249 (El Libro de la Sunnah), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
