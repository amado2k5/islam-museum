label: { ar: "صحيح البخاري 3479 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Sahih al-Bukhari 3479 — a testament or parting counsel; a deathbed and last hours", ur: "صحیح بخاری 3479 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات", es: "Sahih al-Bukhari 3479 — un testamento o consejo de despedida; un lecho de muerte y últimas horas", fr: "Sahih al-Bukhari 3479 — un testament ou des adieux; un lit de mort et les dernières heures", tr: "Sahih el-Buhari 3479 — Ölüm anında yapılan son vasiyet veya sözleşme", id: "Sahih al-Bukhari 3479 — Wasiat atau perjanjian terakhir, pada saat kematian" }
text: "… أَلاَ تُحَدِّثُنَا مَا سَمِعْتَ مِنَ النَّبِيِّ. قَالَ سَمِعْتُهُ يَقُولُ \" إِنَّ رَجُلاً حَضَرَهُ الْمَوْتُ، لَمَّا أَيِسَ مِنَ الْحَيَاةِ، أَوْصَى أَهْلَهُ إِذَا مُتُّ فَاجْمَعُوا لِي حَطَبًا كَثِيرًا، ثُمَّ أَوْرُوا نَارًا حَتَّى إِذَا أَكَلَتْ لَحْمِي، وَخَلَصَتْ إِلَى عَظْمِي، فَخُذُوهَا فَاطْحَنُوهَا، فَذَرُّونِي فِي الْيَمِّ فِي يَوْمٍ حَارٍّ أَوْ رَاحٍ. فَجَمَعَهُ اللَّهُ، فَقَالَ لِمَ فَعَلْتَ قَالَ خَشْيَتَكَ. فَغَفَرَ لَهُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3479، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3479 (Prophets), that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3479، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3479 (Profetas), menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 3479 (Les Prophètes), mentionne un testament ou des dernières volontés, le lit de mort et les dernières heures. Le navigateur de textes religieux le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 3479 numaralı hadis, son vasiyetten ve ölüm anından bahsetmektedir. Bu hadis, vasiyetler, miras, tarihi yerler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3479, menyebutkan wasiat terakhir dan saat kematian. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, situs bersejarah, dan makam suci, bersama dengan teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
