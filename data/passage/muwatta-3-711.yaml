label: { ar: "الموطأ 711 — مالك في تفسير قول عمر: لا يجمع بين مفترق ولا يفرق بين مجتمع خشية الصدقة", en: "Muwatta 711", es: "Muwatta 711", fr: "Muwatta 711", ur: "موطا 711", tr: "El-Muvatta 711 — Malik, Ömer'in şu sözünü yorumlarken: \"Sadakadan korktuğunuz için ayrı olanı birleştirmeyin, birleşmiş olanı da ayırmayın.\"", id: "Al-Muwatta 711 — Malik, dalam menafsirkan pernyataan Umar: \"Janganlah kamu menggabungkan apa yang terpisah, dan jangan pula kamu memisahkan apa yang telah digabungkan, karena takut akan sedekah.\"" }
summary:
  ar: "قول لمالك: قال عمر بن الخطاب: لا يُجمع بين مفترق ولا يُفرق بين مجتمع خشية الصدقة، وإنما يعني أصحاب المواشي. وتفسير «لا يجمع بين مفترق» أن يكون النفر الثلاثة لكل واحد منهم أربعون شاة قد وجبت على كل منهم الصدقة، فإذا أظلهم المصدق جمعوها لئلا يكون عليهم إلا شاة واحدة، فنُهوا عن ذلك. وتفسير «لا يفرق بين مجتمع» أن الخليطين يكون لكل منهما مئة شاة وشاة فيكون عليهما ثلاث شياه، فإذا أظلهما المصدق فرّقا غنمهما فلم يكن على كل منهما إلا شاة، فنُهي عن ذلك. ويقول مالك: فهذا الذي سمعت في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.356}"
  tr: "Malik şöyle demiştir: Ömer ibn el-Hattab şöyle buyurmuştur: “Zekât ödeme korkusuyla ayrı olanı birleştirmemeli, ayrı olanı da ayırmamalıdır.” Hayvan sahiplerini kastediyordu. “Ayrı olanı birleştirmemeli”nin yorumu şudur: Her birinin kırk koyunu olan üç kişi zekât ödemekle yükümlüdür. Zekât toplayıcısı geldiğinde koyunlarını birleştirerek sadece bir koyun borçlu olurlar ve bunu yapmaları yasaktır. “Ayrı olanı ayırmamalı”nın yorumu ise şudur: Her birinin yüz koyunu olan iki kişi üç koyun borçludur. Zekât toplayıcısı geldiğinde koyunlarını ayırarak her birinin sadece bir koyun borçlu olmasını sağlarlar ve bunu yapmaları yasaktır. Malik şöyle diyor: “Bu konuda bunu işittim.” Araştırmacı, Ebu Musab'ın bunu Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.356}"
  id: "Malik berkata: Umar bin al-Khattab berkata: “Seseorang tidak boleh menggabungkan apa yang terpisah, dan tidak pula memisahkan apa yang tergabung, karena takut menunggak zakat.” Yang dimaksud adalah para pemilik ternak. Interpretasi dari “seseorang tidak boleh menggabungkan apa yang terpisah” adalah bahwa tiga orang, masing-masing memiliki empat puluh ekor domba, masing-masing wajib membayar zakat. Ketika penagih zakat datang, mereka menggabungkan domba-domba mereka sehingga mereka hanya wajib membayar satu ekor domba, dan mereka dilarang melakukan hal itu. Interpretasi dari “seseorang tidak boleh memisahkan apa yang tergabung” adalah bahwa dua orang, masing-masing memiliki seratus ekor domba, wajib membayar tiga ekor domba. Ketika penagih zakat datang, mereka memisahkan domba-domba mereka sehingga masing-masing hanya wajib membayar satu ekor domba, dan mereka dilarang melakukan hal itu. Malik berkata: “Inilah yang saya dengar mengenai masalah ini.” Peneliti menyebutkan bahwa Abu Mus’ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.356}"
