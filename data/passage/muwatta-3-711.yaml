label: { ar: "الموطأ 711 — مالك في تفسير قول عمر: لا يجمع بين مفترق ولا يفرق بين مجتمع خشية الصدقة", en: "Muwatta 711" }
summary:
  ar: "قول لمالك: قال عمر بن الخطاب: لا يُجمع بين مفترق ولا يُفرق بين مجتمع خشية الصدقة، وإنما يعني أصحاب المواشي. وتفسير «لا يجمع بين مفترق» أن يكون النفر الثلاثة لكل واحد منهم أربعون شاة قد وجبت على كل منهم الصدقة، فإذا أظلهم المصدق جمعوها لئلا يكون عليهم إلا شاة واحدة، فنُهوا عن ذلك. وتفسير «لا يفرق بين مجتمع» أن الخليطين يكون لكل منهما مئة شاة وشاة فيكون عليهما ثلاث شياه، فإذا أظلهما المصدق فرّقا غنمهما فلم يكن على كل منهما إلا شاة، فنُهي عن ذلك. ويقول مالك: فهذا الذي سمعت في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.356}"
