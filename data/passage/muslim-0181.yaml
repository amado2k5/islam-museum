label:
  ar: "مسلم 181 — تريدون شيئا أزيدكم: النظر إلى وجه الله"
  en: "Muslim 181 — Do you want anything more: the sight of God's face"
  ur: "مسلم 181 — کیا تم کچھ اور چاہتے ہو: اللہ کے چہرے کا دیدار"
  es: "Musulmán 181 — ¿Deseas algo más: la visión del rostro de Dios?"
  fr: "Muslim 181 — Désires-tu quelque chose de plus: la vue du visage de Dieu ?"
  tr: "Müslim 181 — Daha fazlasını mı istiyorsunuz? Size Allah'ın yüzünün görüntüsünü vereceğim."
  id: "Muslim 181 — Apakah kamu menginginkan sesuatu yang lebih? Akan kuberikan kepadamu: penglihatan akan wajah Tuhan."
text: "إذا دخل أهل الجنة الجنة - قال - يقول الله تبارك وتعالى تريدون شيئا أزيدكم فيقولون ألم تبيض وجوهنا ألم تدخلنا الجنة وتنجنا من النار - قال - فيكشف الحجاب فما أعطوا شيئا أحب إليهم من النظر إلى ربهم عز …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 181: تريدون شيئا أزيدكم: النظر إلى وجه الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 181: Do you want anything more: the sight of God's face. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 181: کیا تم کچھ اور چاہتے ہو: اللہ کے چہرے کا دیدار۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 181: ¿Acaso deseas algo más? La visión del rostro de Dios. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim n° 181: « Désirez-vous quelque chose de plus que la vision du visage de Dieu ? » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, nomor 181: “Apakah kalian menginginkan sesuatu yang lebih? Akan kukatakan kepadamu: untuk memandang wajah Allah.” Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
