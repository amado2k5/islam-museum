label:
  ar: "مسلم 181 — تريدون شيئا أزيدكم: النظر إلى وجه الله"
  en: "Muslim 181 — Do you want anything more: the sight of God's face"
  ur: "مسلم 181 — کیا تم کچھ اور چاہتے ہو: اللہ کے چہرے کا دیدار"
text: "إذا دخل أهل الجنة الجنة - قال - يقول الله تبارك وتعالى تريدون شيئا أزيدكم فيقولون ألم تبيض وجوهنا ألم تدخلنا الجنة وتنجنا من النار - قال - فيكشف الحجاب فما أعطوا شيئا أحب إليهم من النظر إلى ربهم عز …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 181: تريدون شيئا أزيدكم: النظر إلى وجه الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 181: Do you want anything more: the sight of God's face. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 181: کیا تم کچھ اور چاہتے ہو: اللہ کے چہرے کا دیدار۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
