text: "… بن سويد - عن الخمر، بعني حكمة لقمان، فقال رسول اللّٰه علية: اعرضها فنهاه، فقال: إنها يُتَداوى بها! فقال رسول اللّٰه : عَليّ. فعَرضها عليه، فقال: إن هذا لَكَلام حَسَن، ليست بدواءٍ، ولكنها دَاءً. والذي معي أفضل منه، قرآن أنزله …"
summary:
