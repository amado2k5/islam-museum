text: "… بن سويد - عن الخمر، بعني حكمة لقمان، فقال رسول اللّٰه علية: اعرضها فنهاه، فقال: إنها يُتَداوى بها! فقال رسول اللّٰه : عَليّ. فعَرضها عليه، فقال: إن هذا لَكَلام حَسَن، ليست بدواءٍ، ولكنها دَاءً. والذي معي أفضل منه، قرآن أنزله …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 536، يذكر الدواء، والداء، والتداوي، والتداوي بالمحرم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 536, that mentions the drug, the disease and its remedy, seeking treatment, treatment with what is forbidden; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 536 کا اقتباس جس میں دوا، بیماری، علاج کرانا، حرام سے علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Usd al-Ghaba de Ibn al-Athir, volumen escaneado 2, pág. 536, que menciona el medicamento, la enfermedad y su remedio, la búsqueda de tratamiento, el tratamiento con lo que está prohibido; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'Usd al-Ghaba d'Ibn al-Athir, volume 2, p. 536, qui mentionne le médicament, la maladie et son remède, la recherche d'un traitement, le traitement avec ce qui est interdit; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Athir'in \"Asad al-Ghaba\" adlı eserinin resimli 2. cildinin 536. sayfasından, tıp, hastalık, tedavi ve haram olan şeylerle tedaviye dair bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikası gereği metin kırk kelime içinde alıntılanmıştır."
  id: "Kutipan dari kitab “Asad al-Ghaba” karya Ibn al-Athir, jilid 2 bergambar, hlm. 536, yang membahas tentang obat-obatan, penyakit, pengobatan, dan pengobatan dengan hal-hal yang dilarang; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
