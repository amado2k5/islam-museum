label: { ar: "سنن أبي داود 2309 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 2309 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 2309 — جو حلال کیا گیا، جو حلال نہیں" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ، عَنِ الأَسْوَدِ، عَنْ عَائِشَةَ، قَالَتْ سُئِلَ رَسُولُ اللَّهِ عَنْ رَجُلٍ طَلَّقَ امْرَأَتَهُ - يَعْنِي ثَلاَثًا - فَتَزَوَّجَتْ زَوْجًا غَيْرَهُ فَدَخَلَ بِهَا ثُمَّ طَلَّقَهَا قَبْلَ أَنْ يُوَاقِعَهَا أَتَحِلُّ لِزَوْجِهَا الأَوَّلِ قَالَتْ قَالَ النَّبِيُّ \" لاَ تَحِلُّ لِلأَوَّلِ حَتَّى تَذُوقَ عُسَيْلَةَ الآخَرِ وَيَذُوقَ عُسَيْلَتَهَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2309، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2309 (Divorce (Kitab Al-Talaq)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2309، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
