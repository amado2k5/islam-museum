text: "… أن نفراً من اليهود - منهم سَلأَم بن أبي الحُقَيْقِ النَّضَرِيُّ، وَحُيَيُّ بن أَخْطَبَ النَّضَرِيُّ، وكنانة بن الربيع بن أبي الحُقَيْقِ النَّضَرِيُّ، وَهَوْدَةُ بنِ قَيْسِ الوَائِليُّ، وأبو عَمَّارٍ الوائليُّ، في نَفَرِ من بني النَّضِيرِ، ونفر مِن بني وائل، وهم الذين …"
summary:
