label: { ar: "صحيح البخاري 3696 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3696 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3696 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3696 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3696 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ شَبِيبِ بْنِ سَعِيدٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ يُونُسَ، قَالَ ابْنُ شِهَابٍ أَخْبَرَنِي عُرْوَةُ، أَنَّ عُبَيْدَ اللَّهِ بْنَ عَدِيِّ بْنِ الْخِيَارِ، أَخْبَرَهُ أَنَّ الْمِسْوَرَ بْنَ مَخْرَمَةَ وَعَبْدَ الرَّحْمَنِ بْنَ الأَسْوَدِ بْنِ عَبْدِ يَغُوثَ قَالاَ مَا يَمْنَعُكَ أَنْ تُكَلِّمَ عُثْمَانَ لأَخِيهِ الْوَلِيدِ فَقَدْ أَكْثَرَ النَّاسُ فِيهِ. فَقَصَدْتُ لِعُثْمَانَ حَتَّى خَرَجَ إِلَى الصَّلاَةِ، قُلْتُ إِنَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3696، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3696 (Companions of the Prophet), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3696، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 3696 (Compañeros del Profeta), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 3696 (Compagnons du Prophète), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés aux nations, religions, sectes et peuples non musulmans."
