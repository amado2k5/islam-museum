label: { ar: "الموطأ 1748 — زينب بنت أبي سلمة: دخلت على زينب بنت جحش حين توفي أخوها، فدعت بطيب ومست منه، وقالت مثل ما قالت أم حبيبة", en: "Muwatta 1748", es: "Muwatta 1748", fr: "Muwatta 1748", ur: "موطا 1748", tr: "El-Muvatta 1748 — Zeynep bint Ebu Seleme: Kardeşi öldüğünde Zeynep bint Cahş'ın yanına girdim ve o, güzel bir parfüm istedi, biraz sürdü ve Ümmü Habibe'nin söylediğinin aynısını söyledi.", id: "Al-Muwatta 1748 — Zaynab bint Abi Salama: Aku menemui Zaynab bint Jahsh ketika saudaranya meninggal, dan dia meminta parfum dan memakainya, lalu berkata sama seperti yang dikatakan Umm Habiba." }
summary:
  ar: "قالت زينب بنت أبي سلمة: ثم دخلت على زينب بنت جحش، زوج النبي، حين توفي أخوها، فدعت بطيب فمست منه، ثم قالت: والله ما لي بالطيب حاجة، غير أني سمعت رسول الله يقول مثل ذلك. {cite:muwatta-maruf-1997 p.112} {cite:muwatta-maruf-1997 p.113}"
  tr: "Zeynep bint Ebu Seleme şöyle dedi: \"Sonra, Peygamberimizin eşi Zeynep bint Cahş'ın yanına gittim, kardeşi vefat ettiğinde. Parfüm istedi ve biraz sürdü, sonra şöyle dedi: 'Allah'a yemin ederim ki, parfüme ihtiyacım yok, ancak Allah'ın Resulü'nün de benzer bir şey söylediğini duydum.'\" {cite:muwatta-maruf-1997 s.112} {cite:muwatta-maruf-1997 s.113}"
  id: "Zaynab bint Abi Salamah berkata: Kemudian aku pergi menemui Zaynab bint Jahsh, istri Nabi, ketika saudaranya meninggal. Dia meminta parfum dan memakainya, lalu berkata: Demi Allah, aku tidak membutuhkan parfum, kecuali aku mendengar Rasulullah SAW mengatakan hal yang serupa. {cite:muwatta-maruf-1997 p.112} {cite:muwatta-maruf-1997 p.113}"
