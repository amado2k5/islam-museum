text: "وَحَدَّثَنَا هَدَّابُ بْنُ خَالِدٍ الأَزْدِيُّ، حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ عَلِيِّ بْنِ زَيْدٍ، وَثَابِتٍ، الْبُنَانِيِّ عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ أُفْرِدَ يَوْمَ أُحُدٍ فِي سَبْعَةٍ مِنَ الأَنْصَارِ وَرَجُلَيْنِ مِنْ قُرَيْشٍ فَلَمَّا رَهِقُوهُ قَالَ \" مَنْ يَرُدُّهُمْ عَنَّا وَلَهُ الْجَنَّةُ أَوْ هُوَ رَفِيقِي فِي الْجَنَّةِ \". فَتَقَدَّمَ رَجُلٌ مِنَ الأَنْصَارِ فَقَاتَلَ حَتَّى قُتِلَ ثُمَّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4641، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4641 (The Book of Jihad and Expeditions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 4641، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
