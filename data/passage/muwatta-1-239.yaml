label: { ar: "الموطأ 239 — القاسم بن محمد يريهم الجلوس في التشهد", en: "Muwatta 239" }
summary:
  ar: "أثر يرويه يحيى عن مالك عن يحيى بن سعيد، في باب العمل في الجلوس في الصلاة: أراهم القاسم بن محمد الجلوس في التشهد، فنصب رجله اليمنى وثنى اليسرى وجلس على وركه الأيسر ولم يجلس على قدمه، ثم قال إن عبد الله بن عبد الله بن عمر أراه ذلك وحدثه أن أباه كان يفعله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.143} {cite:muwatta-maruf-1997 p.144}"
