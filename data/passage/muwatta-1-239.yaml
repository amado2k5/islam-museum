label: { ar: "الموطأ 239 — القاسم بن محمد يريهم الجلوس في التشهد", en: "Muwatta 239", es: "Muwatta 239", fr: "Muwatta 239", ur: "موطا 239", tr: "El-Muvatta 239 — El-Kasım bin Muhammed onlara Teşehhüd sırasında nasıl oturulacağını gösteriyor.", id: "Al-Muwatta 239 — Al-Qasim bin Muhammad menunjukkan kepada mereka cara duduk saat Tasyahhud" }
summary:
  ar: "أثر يرويه يحيى عن مالك عن يحيى بن سعيد، في باب العمل في الجلوس في الصلاة: أراهم القاسم بن محمد الجلوس في التشهد، فنصب رجله اليمنى وثنى اليسرى وجلس على وركه الأيسر ولم يجلس على قدمه، ثم قال إن عبد الله بن عبد الله بن عمر أراه ذلك وحدثه أن أباه كان يفعله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.143} {cite:muwatta-maruf-1997 p.144}"
  tr: "Yahya'nın, Malik'ten, o da Yahya ibn Sa'id'den rivayet ettiği, namazda doğru oturma pozisyonu bölümündeki bir rivayette şöyle denmektedir: El-Kâsım ibn Muhammed onlara teşehhüd için doğru oturma pozisyonunu gösterdi. Sağ bacağını kaldırdı, sol bacağını büktü ve ayağının üzerine değil, sol kalçasının üzerine oturdu. Sonra Abdullah ibn Abdullah ibn Ömer'in bunu kendisine gösterdiğini ve babasının da böyle yaptığını söylediğini aktardı. Editör, bunun Malik'ten, Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.143} {cite:muwatta-maruf-1997 s.144}"
  id: "Sebuah riwayat yang dinarasikan oleh Yahya atas otoritas Malik atas otoritas Yahya ibn Sa'id, dalam bab tentang posisi duduk yang benar dalam shalat: Al-Qasim ibn Muhammad menunjukkan kepada mereka posisi duduk yang benar untuk Tasyahhud. Dia mengangkat kaki kanannya, menekuk kaki kirinya, dan duduk di pinggul kirinya, bukan di kakinya. Kemudian dia berkata bahwa Abdullah ibn Abdullah ibn Umar menunjukkan hal ini kepadanya dan mengatakan kepadanya bahwa ayahnya biasa melakukannya. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.143} {cite:muwatta-maruf-1997 p.144}"
