text: "… كلمة باطل حقنت بها دما والله لقد فقدوه سهما من مرامز طيب واللّه ليس بسروقة لمال اللّٰه، ولا بنؤمة عن أمر الله، أعطى القرآن عزائعه فيها عليه وله، أحل حلاله وحرم حرامه، حتى أورده ذلك على حياض غدقة، ورياض مونقة، …"
summary:
