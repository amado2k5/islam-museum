text: "… فتردُّ اليمينُ على المدَّعين، ويحلفون مع اللوث، ويستحقُّون ما ادَّعُوهُ، كما يحلفُ الأولياء في القسامة مع اللوث، ويستحقون بذلك الدِّيَةَ والدَّم أيضاً عندَ مالكِ وأحمد وغيرهما. وقضى ابنُ مسعود في رجل مسلم حضره الموت، فأوصى إلى رجلين مسلمين معه، وسلَّمهما …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 695، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 695, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 695 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen 2, pág. 695, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Jami' al-'Ulum wa-l-Hikam d'Ibn Rajab (tome 2, p. 695), mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 695. sayfasından, vasiyetname ve ölüm anını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 695, yang menyebutkan wasiat terakhir dan saat kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
