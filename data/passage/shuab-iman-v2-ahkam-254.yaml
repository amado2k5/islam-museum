text: "… عطية عن أبي عاتكة وفي رواية أبي عبد اللّٰه ثنا أبو عاتكة عن أنس بن مالك قال : قال رسول اللّه لا عِ اطلبوا العلم ولو بالصين فإن طلب العلم فريضة على كل مسلم. هذا الحديث شبه مشهور وإسناده ضعيف …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 254، يرد فيه ذكر الفريضة والفرائض، وما وجب على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 254, whose wording mentions the obligation (farida), a duty laid on every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 254 کا اقتباس جس میں فریضہ اور فرائض، جو ہر مسلمان پر لازم ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
