  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 2. cildinin 254. sayfasından, farz olan amelleri ve görevleri, her Müslümandan beklenenleri anlatan bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 254, yang menyebutkan amalan dan kewajiban wajib, serta apa yang dituntut dari setiap Muslim; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
