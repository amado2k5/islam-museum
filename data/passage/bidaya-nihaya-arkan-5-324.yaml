text: "… بمكة فسألته عن شيء فقال: من أين أنت؟ فقلت: من أهل الكوفة. قال: أنت من أهل القرية الذين فارقوا دينهم وكانوا شيعاً؟ قلت: نعم! قال: فمن أي الأصناف أنت؟ قلت: ممن لا يسب السلف ويؤمن بالقدر، ولا يكفر أحداً من …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 5، ص 324، يذكر الإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 5, p. 324, that mentions belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 5، ص 324 کا اقتباس جس میں تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 5, pág. 324, que menciona la creencia en el decreto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 5, p. 324), mentionnant la croyance en ce décret; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 5. cildinin 324. sayfasında kader inancından bahsedilmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Permulaan dan Akhir), Jilid 5, halaman 324, menyebutkan kepercayaan pada takdir. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
