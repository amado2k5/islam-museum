text: "… بمكة فسألته عن شيء فقال: من أين أنت؟ فقلت: من أهل الكوفة. قال: أنت من أهل القرية الذين فارقوا دينهم وكانوا شيعاً؟ قلت: نعم! قال: فمن أي الأصناف أنت؟ قلت: ممن لا يسب السلف ويؤمن بالقدر، ولا يكفر أحداً من …"
