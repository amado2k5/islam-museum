text: "… نجائب كأنها الياقوت أهل الجنة يلهمون الحمد والتسبيح كما يلهمون الأواب الحفيظ: الذي لا يقوم من مجلسه الأواب الحفيظ: الذي يذكر الذنب فيتوب منه الأواه: الخاشع الدعاء المتضرع أوحى اللّٰه إلى داود: اتق اللّٰه يا داود أوصاهم ثمامة بن بجاد …"
summary:
