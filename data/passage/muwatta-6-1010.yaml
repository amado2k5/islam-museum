label: { ar: "الموطأ 1010 — ابن شهاب عن سالم: أبو هريرة حدث ابن عمر أنه مر به قوم محرمون بالربدة، فاستفتوه في لحم صيد وجدوا ناساً أحلة يأكلونه فأفتاهم بأكله، ثم قدم على عمر فسأله فقال: بم أفتيتهم؟ فلو أفتيتهم بغير ذلك لأوجعتك", en: "Muwatta 1010", es: "Muwatta 1010", fr: "Muwatta 1010", ur: "موطا 1010", tr: "El-Muvatta 1010 — İbn Şihab, Salim'den rivayetle: Ebu Hurayra, İbn Ömer'e, El-Rabadha'da ihramlı bazı kişilerin yanından geçtiğini ve ihramlı kişilerin yediği av etini sorduklarını anlattı. İbn Ömer onlara bu eti yemelerine izin veren bir fetva verdi. Sonra Ömer'in yanına gittiler. Ömer ona, \"Onlara verdiğin fetva neydi? Eğer onlara farklı bir fetva vermiş olsaydın, seni çok ağır cezalandırırdım\" dedi." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن سالم بن عبد الله، أنه سمع أبا هريرة يحدث عبد الله بن عمر، أنه مر به قوم محرمون بالربدة فاستفتوه في لحم صيد وجدوا ناساً أحلة يأكلونه، فأفتاهم بأكله. ثم قدم أبو هريرة المدينة على عمر، فسأله عن ذلك، فقال عمر: بم أفتيتهم؟ فقال: أفتيتهم بأكله. فقال عمر: لو أفتيتهم بغير ذلك لأوجعتك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1141) وسويد (574). {cite:muwatta-maruf-1997 p.473}"
  tr: "Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan rivayet etmiştir ki, Salim ibn Abdullah, Ebu Hurayra'nın Abdullah ibn Ömer'e anlattığına göre, Rabbedaha'da ihramlı bazı kişiler yanından geçerken, ihramlı kişilerin yediği av etini sormuşlar. Ebu Hurayra onlara bu eti yemelerine izin veren bir fetva vermiş. Bunun üzerine Ebu Hurayra, Ömer'i görmek için Medine'ye gitmiş ve Ömer ona bu konuda soru sormuş. Ömer, \"Onlara verdiğin fetva neydi?\" diye sormuş. Ebu Hurayra, \"Onlara bu eti yemelerine izin veren bir fetva verdim\" diye cevap vermiş. Ömer, \"Eğer onlara farklı bir fetva vermiş olsaydın, seni çok ağır cezalandırırdım\" demiş. Araştırmacı, bu rivayetin Malik'ten Ebu Musab (1141) ve Suveyd (574) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.473}"
  id: "Malik meriwayatkannya dari Ibnu Shihab, dari Salim ibn Abdullah, yang mendengar Abu Hurayrah meriwayatkan kepada Abdullah ibn Umar bahwa beberapa orang yang sedang ihram melewatinya di al-Rabadhah dan bertanya kepadanya tentang daging buruan yang mereka temukan sedang dimakan oleh orang-orang yang sedang ihram. Beliau memberi mereka fatwa yang memperbolehkan mereka memakannya. Kemudian Abu Hurayrah pergi ke Madinah untuk menemui Umar, yang bertanya kepadanya tentang hal itu. Umar berkata, \"Apa fatwamu kepada mereka?\" Dia menjawab, \"Aku memberi mereka fatwa yang memperbolehkan mereka memakannya.\" Umar berkata, \"Jika engkau memberi mereka fatwa yang berbeda, aku akan menghukummu dengan berat.\" Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1141) dan Suwayd (574). {cite:muwatta-maruf-1997 p.473}"
