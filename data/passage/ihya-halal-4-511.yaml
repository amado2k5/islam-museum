text: "… عليه بأنه حرام كالسم الذي يقتل قليله وكثيره وإلى ما يضر عند الكثرة فيطلق القول عليه بالإباحة كالعسل فإن كثيره يضر بالمحرور وكأكل الطين وكأن إطلاق التحريم على الطين والخمر والتحليل على العسل التفات إلى أغلب الأح وال فإن تصدى …"
