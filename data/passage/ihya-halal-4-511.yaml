  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 511. sayfasından, haram, izin verilen ve yasak olan konuları ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 4, halaman 511, yang membahas tentang yang haram, yang dilarang, dan yang diperbolehkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
