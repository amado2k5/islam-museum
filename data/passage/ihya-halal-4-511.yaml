text: "… عليه بأنه حرام كالسم الذي يقتل قليله وكثيره وإلى ما يضر عند الكثرة فيطلق القول عليه بالإباحة كالعسل فإن كثيره يضر بالمحرور وكأكل الطين وكأن إطلاق التحريم على الطين والخمر والتحليل على العسل التفات إلى أغلب الأح وال فإن تصدى …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 511، يذكر الحرام، والتحريم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 511, that mentions the unlawful, prohibition, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 511 کا اقتباس جس میں حرام، تحریم، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
