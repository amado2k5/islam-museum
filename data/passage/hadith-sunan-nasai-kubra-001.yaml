text: "الله ويم فأمر به ، فقرئ، فإذا فيه: «بسم الله الرحمن الرحيم، من محمد عبد الله ورسوله، إلى هرقل عظم الروم، سلام على من اتبع الهدى، أما بعد، فإني أدعوك بدعاية الإسلام، أسلم تسلم، وأسلم يؤتك الله أجرك مرتين، وإن"
