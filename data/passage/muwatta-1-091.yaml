label: { ar: "الموطأ 91 — سعيد بن المسيب يرعف فيصلي ولا يتوضأ", en: "Muwatta 91", es: "Muwatta 91", fr: "Muwatta 91", ur: "موطا 91", tr: "El-Muvatta 91 — Sa’id ibn al-Musayyab'ın burnu kanadı ve abdest almadan namaz kıldı.", id: "Al-Muwatta 91 — Sa’id ibn al-Musayyab mimisan dan shalat tanpa berwudhu." }
summary:
  ar: "أول أثر في باب العمل في الرعاف. يرويه يحيى عن مالك عن عبد الرحمن بن حرملة الأسلمي: رأى سعيد بن المسيب يرعف فيخرج منه الدم حتى تختضب أصابعه من دم أنفه، ثم يصلي ولا يتوضأ. ويذكر المحقق أن عبد الرزاق رواه عن معمر عن أبي الزناد عن ابن المسيب، وابن أبي شيبة عن يحيى بن سعيد عنه. {cite:muwatta-maruf-1997 p.80} {cite:muwatta-maruf-1997 p.81}"
  tr: "Burun kanaması hakkındaki ilk hadis, Yahya'nın Malik'ten, o da Abdülrahman ibn Harmalah el-Aslami'den rivayet ettiğine göre şöyledir: Yahya, Sa'id ibn el-Musayyib'in burnunun kanadığını ve burnundan parmakları kana bulaşana kadar kan aktığını gördü, buna rağmen abdest almadan namaz kıldı. Araştırmacı, Abdülrazzak'ın bunu Ma'mar'dan, o da Ebu el-Zinad'dan, o da İbn el-Musayyib'den ve İbn Abi Şeybe'den, o da Yahya ibn Sa'id'den, o da onun rivayetine dayanarak naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.80} {cite:muwatta-maruf-1997 s.81}"
  id: "Hadits pertama mengenai hukum mimisan diriwayatkan oleh Yahya dari Malik, dari Abd al-Rahman ibn Harmalah al-Aslami: Ia melihat Sa'id ibn al-Musayyib mimisan, dan darah mengalir dari hidungnya hingga jari-jarinya berlumuran, namun ia tetap shalat tanpa berwudhu. Peneliti menyebutkan bahwa Abd al-Razzaq meriwayatkannya dari Ma'mar, dari Abu al-Zinad, dari Ibn al-Musayyib, dan Ibn Abi Shaybah dari Yahya ibn Sa'id, darinya. {cite:muwatta-maruf-1997 p.80} {cite:muwatta-maruf-1997 p.81}"
