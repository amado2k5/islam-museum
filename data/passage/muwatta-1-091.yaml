label: { ar: "الموطأ 91 — سعيد بن المسيب يرعف فيصلي ولا يتوضأ", en: "Muwatta 91" }
summary:
  ar: "أول أثر في باب العمل في الرعاف. يرويه يحيى عن مالك عن عبد الرحمن بن حرملة الأسلمي: رأى سعيد بن المسيب يرعف فيخرج منه الدم حتى تختضب أصابعه من دم أنفه، ثم يصلي ولا يتوضأ. ويذكر المحقق أن عبد الرزاق رواه عن معمر عن أبي الزناد عن ابن المسيب، وابن أبي شيبة عن يحيى بن سعيد عنه. {cite:muwatta-maruf-1997 p.80} {cite:muwatta-maruf-1997 p.81}"
