text: "… فاوصى عند موته ان تقلع وتغسل وتجعل فى فه. وقال ابو جمفر الصائغ امر ابو نواس قال يعقوب العنبرى وغيره كانت ولادة ابى نواس سنة خمس واربعين ومائة بالاهواز بالتقرب من الجبل المقطوع وقال جماعة كانت ولادته سنة ست وثلاثين …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 2، ص 283، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 2, p. 283, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 2، ص 283 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
