text: "… عَلَى الْبِرِّ وَالتَّقْوَى. وَلَأَنَّ فِي تَرْكِ الإِنْفَاقِ عَلَيْهِ هَلاكَهُ، وَحِفْظُهُ عَنْ ذِلِكَ وَاجبٌ، كَإِنْقَاذِهِ مِنْ الْغَرَقِ، وَهَذَا فَرْضُ كِفَّايَةٍ، إذَا قَامَ بِهِ قَوْمٌ سَقَطَ عَنْ الْبَاقِينَ، فَإِنْ تَرَكَهُ الْكُلُّ أَيِمُوا. وَمَنْ أَنْفَقَ عَلَيْهِ مُتَبَرُعا، فَلا شَيْءَ لَهُ، سَوَاءٌ كَانَ يَه …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1376، يرد فيه ذكر الفرض، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 1376, whose wording mentions the obligatory (fard), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 1376 کا اقتباس جس میں فرض، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 3, p. 1376, dont le texte mentionne l'obligatoire (fard), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent, l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mughni de Ibn Qudama, volumen digitalizado 3, p. 1376, cuyo texto menciona lo obligatorio (fard), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen, lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 3. cildinin 1376. sayfasından bir alıntı, farz ibadetleri, toplumsal yükümlülükleri ve bir ibadetin bazıları tarafından yerine getirilmesi durumunda geri kalanlar için artık gerekli olmadığı ilkesini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ibadetler, görevler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram edilen ibadetler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Jilid 3, halaman 1376, membahas tentang amalan wajib, kewajiban masyarakat, dan prinsip bahwa jika sebagian orang melakukan suatu amalan, maka amalan tersebut tidak lagi diwajibkan bagi yang lain. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
