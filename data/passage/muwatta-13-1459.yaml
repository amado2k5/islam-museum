label: { ar: "الموطأ 1459 — مالك: إذا شرك الجد والإخوة للأب والأم أحد بفريضة مسماة، يخير الجد بين الثلث مما بقي أو مقاسمة الإخوة أو السدس من رأس المال", en: "Muwatta 1459" }
summary:
  ar: "يقول مالك إن الجد والإخوة للأب والأم، إذا شركهم أحد بفريضة مسماة، يبدأ بمن شركهم من أهل الفرائض فيعطون فرائضهم، فما بقي بعد ذلك للجد والإخوة ينظر أي ذلك أفضل لحظ الجد: أن يعطى الثلث مما بقي له وللإخوة، أو أن يكون بمنزلة رجل من الإخوة فيقاسمهم بمثل حصة أحدهم، أو السدس من رأس المال كله، فأي ذلك كان أفضل لحظ الجد أعطيه. ويذكر مالك فريضة واحدة تكون قسمتهم فيها على غير ذلك، وهي امرأة ماتت وتركت زوجها وأمها وأختها لأمها وأبيها وجدها. {cite:muwatta-maruf-1997 p.13}"
