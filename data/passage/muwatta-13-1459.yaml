label: { ar: "الموطأ 1459 — مالك: إذا شرك الجد والإخوة للأب والأم أحد بفريضة مسماة، يخير الجد بين الثلث مما بقي أو مقاسمة الإخوة أو السدس من رأس المال", en: "Muwatta 1459", es: "Muwatta 1459", fr: "Muwatta 1459", ur: "موطا 1459", tr: "El-Muvatta 1459 — Malik: Eğer dede ve anne-babadan olan kardeşler belirli bir mirası bir başkasıyla paylaşırsa, dedenin mirasın üçte birini kardeşlerle paylaşma veya sermayenin altıda birini alma seçeneği vardır.", id: "Al-Muwatta 1459 — Malik: Jika kakek dan saudara-saudara dari pihak ayah dan ibu berbagi warisan tertentu dengan seseorang, maka kakek memiliki pilihan antara sepertiga dari sisanya, berbagi dengan saudara-saudaranya, atau seperenam dari modal tersebut." }
summary:
  ar: "يقول مالك إن الجد والإخوة للأب والأم، إذا شركهم أحد بفريضة مسماة، يبدأ بمن شركهم من أهل الفرائض فيعطون فرائضهم، فما بقي بعد ذلك للجد والإخوة ينظر أي ذلك أفضل لحظ الجد: أن يعطى الثلث مما بقي له وللإخوة، أو أن يكون بمنزلة رجل من الإخوة فيقاسمهم بمثل حصة أحدهم، أو السدس من رأس المال كله، فأي ذلك كان أفضل لحظ الجد أعطيه. ويذكر مالك فريضة واحدة تكون قسمتهم فيها على غير ذلك، وهي امرأة ماتت وتركت زوجها وأمها وأختها لأمها وأبيها وجدها. {cite:muwatta-maruf-1997 p.13}"
  tr: "Malik, eğer dede ve öz kardeşler sabit bir miras payına dahilse, dağıtımın öncelikle asıl mirasçılarla başladığını ve onların paylarını aldığını söylüyor. Daha sonra dede ve kardeşler için kalan kısım değerlendiriliyor ve dedeye en uygun seçenek sunuluyor: mirasın üçte biri kendisi ve kardeşleri için; mirasın üçte biri kardeşler arasında eşit olarak paylaştırılıyor; veya mirasın altıda biri. Dede için en avantajlı seçenek hangisi ise o veriliyor. Malik, dağıtımın farklı olduğu özel bir durumdan bahsediyor: Bir kadın, kocası, annesi, öz kız kardeşi, dedesi ve annesini geride bırakarak vefat ediyor. {cite:muwatta-maruf-1997 s.13}"
  id: "Malik mengatakan bahwa jika seorang kakek dan saudara kandung termasuk dalam bagian warisan tetap, pembagian dimulai dengan ahli waris asli, yang menerima bagian mereka. Sisa harta untuk kakek dan saudara kandung kemudian dipertimbangkan, dengan kakek diberi pilihan terbaik: sepertiga dari sisa harta untuk dirinya dan saudara kandung; sepertiga dari harta dibagi rata di antara saudara kandung; atau seperenam dari seluruh harta. Pilihan mana pun yang paling menguntungkan bagi kakek akan diberikan. Malik menyebutkan satu kasus khusus di mana pembagiannya berbeda: seorang wanita meninggal dunia meninggalkan suami, ibu, saudara perempuan kandung, kakek, dan ibunya. {cite:muwatta-maruf-1997 p.13}"
