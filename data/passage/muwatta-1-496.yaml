label: { ar: "الموطأ 496 — مالك فيمن وجد الناس قد انصرفوا من صلاة العيد", en: "Muwatta 496", es: "Muwatta 496", fr: "Muwatta 496", ur: "موطا 496", tr: "Al-Muwatta 496 — Malik, bayram namazının bittiğini gören kişi hakkında", id: "Al-Muwatta 496 — Malik tentang orang yang mendapati orang-orang telah selesai melaksanakan salat Id" }
summary:
  ar: "قول مالك في باب ما جاء في التكبير والقراءة في صلاة العيدين: من وجد الناس قد انصرفوا من الصلاة يوم العيد فلا يرى عليه صلاة في المصلى ولا في بيته، وإن صلى في المصلى أو في بيته لم ير بذلك بأساً، ويكبر سبعاً في الأولى قبل القراءة وخمساً في الثانية قبل القراءة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.254}"
  tr: "Malik, bayram namazlarında tekbir ve Kur'an okuma ile ilgili rivayetler bölümünde şöyle buyurmuştur: \"Bayram günü insanların namazı bitirdiğini gören kimsenin namaz yerinde veya evinde namaz kılması zorunlu değildir. Ancak namaz yerinde veya evinde namaz kılarsa bunda bir sakınca yoktur. Birinci rekatta Kur'an okumadan önce yedi defa, ikinci rekatta ise Kur'an okumadan önce beş defa tekbir getirmelidir.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.254}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan mengenai takbir dan bacaan dalam salat Id: Barang siapa mendapati bahwa orang-orang telah selesai salat pada hari raya Id, maka ia tidak wajib salat di tempat salat atau di rumah. Namun, jika ia salat di tempat salat atau di rumah, tidak ada salahnya. Ia hendaknya mengucapkan takbir tujuh kali pada rakaat pertama sebelum bacaan dan lima kali pada rakaat kedua sebelum bacaan. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.254}"
