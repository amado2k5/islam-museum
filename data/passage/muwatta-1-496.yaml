label: { ar: "الموطأ 496 — مالك فيمن وجد الناس قد انصرفوا من صلاة العيد", en: "Muwatta 496" }
summary:
  ar: "قول مالك في باب ما جاء في التكبير والقراءة في صلاة العيدين: من وجد الناس قد انصرفوا من الصلاة يوم العيد فلا يرى عليه صلاة في المصلى ولا في بيته، وإن صلى في المصلى أو في بيته لم ير بذلك بأساً، ويكبر سبعاً في الأولى قبل القراءة وخمساً في الثانية قبل القراءة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.254}"
