text: "فهذه الأحاديث كالمتواترة في إثبات سبع أرضين والمراد بذلك أن كل واحدة فوق الأخرى … واختلفوا هل هن متراكمات بلا تفاصل أو بين كل واحدة والتي تليها خلاء على قولين"
summary:
  ar: "يقرر ابن كثير أن الأحاديث في الأرضين السبع كالمتواترة، ويذكر أن العلماء اختلفوا هل بينها فواصل وخلاء أم هي متراكمة."
  en: "Ibn Kathir says the reports about seven earths are close to mass-transmitted, that each lies above the other, and that scholars differed over whether empty space separates them."
  es: "Ibn Kathir afirma que los relatos sobre las siete Tierras son prácticamente de dominio público, que cada una se encuentra encima de la otra y que los eruditos discrepaban sobre si el espacio vacío las separaba."
  fr: "Ibn Kathir affirme que les récits concernant sept terres sont quasiment transmis par la force, que chacune se situe au-dessus de l'autre et que les érudits divergent quant à savoir si un espace vide les sépare."
  ur: "ابن کثیر کا کہنا ہے کہ سات زمینوں کے بارے میں اطلاعات بڑے پیمانے پر منتقل ہونے کے قریب ہیں، کہ ہر ایک دوسرے کے اوپر ہے، اور علماء کا اس بات پر اختلاف ہے کہ آیا خالی جگہ ان کو الگ کرتی ہے۔"
  tr: "İbn Kathir, yedi yer hakkındaki hadislerin birden fazla ravi tarafından rivayet edilmiş gibi olduğunu belirtir ve âlimlerin hadisler arasında boşluklar olup olmadığı veya bunların bir araya getirilmiş olup olmadığı konusunda görüş ayrılığına düştüklerini söyler."
  id: "Ibn Kathir menyatakan bahwa hadits tentang tujuh bumi seperti hadits yang diriwayatkan oleh banyak orang, dan beliau menyebutkan bahwa para ulama berbeda pendapat mengenai apakah ada celah dan jarak di antara hadits-hadits tersebut atau apakah hadits-hadits itu terakumulasi."
