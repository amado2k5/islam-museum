text: "… حَبْسَه وأوْقَعَ به مَكْرُوهَا، ثم خَلَّاهُ بعد أن كَفَلَهُ وأخْلَفَهُ أنَّه يَطْلُبُ الحَلَّاجِ وبَذَلَ له مَالًا، وكان يَجُولُ البِلادَ خَلْفَه. واتَّفَقَ أنْ دَخَلَ الشُّوسَ في ذلك الوَقْتِ وعَرَفَ الخَبَرَ، فبَادَرَ وعَرَّفَ السُّلْطَانَ الصُّورَة وتَحَقَّقَ أمْرَه فحْمِلَ، وكان منْ أمْرِه ما …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 957، يرد فيه ذكر المكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
