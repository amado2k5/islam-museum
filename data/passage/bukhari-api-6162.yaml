label: { ar: "صحيح البخاري 6162 — الأب والأبوة", en: "Sahih al-Bukhari 6162 — the father and fatherhood", ur: "صحیح بخاری 6162 — باپ اور والدیت", es: "Sahih al-Bukhari 6162 — El padre y la paternidad" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا وُهَيْبٌ، عَنْ خَالِدٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ أَثْنَى رَجُلٌ عَلَى رَجُلٍ عِنْدَ النَّبِيِّ فَقَالَ \" وَيْلَكَ قَطَعْتَ عُنُقَ أَخِيكَ ـ ثَلاَثًا ـ مَنْ كَانَ مِنْكُمْ مَادِحًا لاَ مَحَالَةَ فَلْيَقُلْ أَحْسِبُ فُلاَنًا ـ وَاللَّهُ حَسِيبُهُ ـ وَلاَ أُزَكِّي عَلَى اللَّهِ أَحَدًا. إِنْ كَانَ يَعْلَمُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6162، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6162 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6162، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6162 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
