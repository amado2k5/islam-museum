label: { ar: "الموطأ 505 — ابن عمر يصف صلاة الخوف، وإن اشتد الخوف صلوا رجالاً أو ركباناً", en: "Muwatta 505" }
text: "فإن كان خوفاً هو أشد من ذلك صلوا رجالاً قياماً على أقدامهم، أو ركباناً مستقبلي القبلة أو غير مستقبليها"
summary:
  ar: "يرويه مالك عن نافع، في باب صلاة الخوف: كان عبد الله بن عمر إذا سُئل عن صلاة الخوف وصفها: يتقدم الإمام وطائفة فيصلي بهم ركعة وتكون طائفة بينه وبين العدو لم يصلوا، فإذا صلى الذين معه ركعة استأخروا مكان الذين لم يصلوا ولا يسلمون، ويتقدم الذين لم يصلوا فيصلون معه ركعة، ثم ينصرف الإمام وقد صلى ركعتين، فتقوم كل طائفة فتصلي لنفسها ركعة؛ فإن كان الخوف أشد صلوا رجالاً قياماً أو ركباناً مستقبلي القبلة أو غير مستقبليها. قال مالك: قال نافع: لا أرى عبد الله بن عمر حدثه إلا عن النبي. ويخرّجه المحقق عند البخاري (4535) وعبد الرزاق والشافعي وابن خزيمة والطحاوي والبيهقي ومحمد بن الحسن من طرق أصحاب مالك، وينقل عن ابن عبد البر أن مالكاً رواه على الشك في رفعه، ورواه عن نافع جماعة لم يشكوا في رفعه منهم ابن أبي ذئب وموسى بن عقبة وأيوب بن موسى، وكذلك الزهري عن سالم عن ابن عمر (التمهيد 15/258). {cite:muwatta-maruf-1997 p.258} {cite:muwatta-maruf-1997 p.259}"
