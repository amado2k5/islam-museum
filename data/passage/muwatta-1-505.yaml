label: { ar: "الموطأ 505 — ابن عمر يصف صلاة الخوف، وإن اشتد الخوف صلوا رجالاً أو ركباناً", en: "Muwatta 505", es: "Muwatta 505", fr: "Muwatta 505", ur: "موطا 505", tr: "İbn Umar, El-Muvatta 505'te, korku namazını şöyle anlatır: Korku şiddetlenirse, yaya veya binek üzerinde namaz kılınmalıdır.", id: "Al-Muwatta 505 — Ibnu Umar menjelaskan tentang salat dalam keadaan takut, dan jika rasa takut semakin kuat, mereka hendaknya salat sambil berjalan kaki atau menunggang kuda." }
text: "فإن كان خوفاً هو أشد من ذلك صلوا رجالاً قياماً على أقدامهم، أو ركباناً مستقبلي القبلة أو غير مستقبليها"
summary:
  ar: "يرويه مالك عن نافع، في باب صلاة الخوف: كان عبد الله بن عمر إذا سُئل عن صلاة الخوف وصفها: يتقدم الإمام وطائفة فيصلي بهم ركعة وتكون طائفة بينه وبين العدو لم يصلوا، فإذا صلى الذين معه ركعة استأخروا مكان الذين لم يصلوا ولا يسلمون، ويتقدم الذين لم يصلوا فيصلون معه ركعة، ثم ينصرف الإمام وقد صلى ركعتين، فتقوم كل طائفة فتصلي لنفسها ركعة؛ فإن كان الخوف أشد صلوا رجالاً قياماً أو ركباناً مستقبلي القبلة أو غير مستقبليها. قال مالك: قال نافع: لا أرى عبد الله بن عمر حدثه إلا عن النبي. ويخرّجه المحقق عند البخاري (4535) وعبد الرزاق والشافعي وابن خزيمة والطحاوي والبيهقي ومحمد بن الحسن من طرق أصحاب مالك، وينقل عن ابن عبد البر أن مالكاً رواه على الشك في رفعه، ورواه عن نافع جماعة لم يشكوا في رفعه منهم ابن أبي ذئب وموسى بن عقبة وأيوب بن موسى، وكذلك الزهري عن سالم عن ابن عمر ⁦(التمهيد 15/258)⁩. {cite:muwatta-maruf-1997 p.258} {cite:muwatta-maruf-1997 p.259}"
  tr: "Malik, Nafi'den rivayetle, Korku Namazı bölümünde şöyle anlatmıştır: Abdullah ibn Umar'a Korku Namazı sorulduğunda, şöyle tarif etmiştir: İmam ve bir grup insan öne çıkar ve bir rekat namaz kılarlar. Başka bir grup ise onunla düşman arasında yer alır ve namaz kılmazlar. İmamla birlikte olanlar bir rekat namaz kıldıktan sonra, namaz kılmayanların yerini almak için geri çekilirler ve selam vermezler. Namaz kılmayanlar da öne çıkar ve onunla birlikte bir rekat namaz kılarlar. İmam iki rekat namaz kıldıktan sonra ayrılır. Her grup daha sonra ayağa kalkar ve bireysel olarak bir rekat namaz kılar. Korku daha büyükse, ayakta veya binek üzerinde, kıbleye dönerek veya dönmeden namaz kılarlar. Malik dedi ki: Nafi' dedi ki: Abdullah ibn Umar'ın bunu Peygamber'den başka bir rivayetle naklettiğini sanmıyorum. Araştırmacı, bu hadisi Buhari (4535), Abdülrazzak, Şafiî, İbn Huzeyme, Tahavi, Beyhaki ve Muhammed ibn Hasan üzerine yaptığı çalışmasına, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla dahil etmiştir. İbn Abdülberr'in, Malik'in bu hadisi Peygamber'e isnat edip etmediği konusunda şüpheyle rivayet ettiğini söylediğini aktarmaktadır. İbn Ebi Zihb, Musa ibn Ukbe ve Eyyub ibn Musa da dahil olmak üzere bir grup insan, hadisi şüphe duymadan Nafi'den rivayet etmiştir. Benzer şekilde, el-Zühri de bunu Salim'den, o da İbn Ömer'den rivayet etmiştir (el-Temhid 15/258). {cite:muwatta-maruf-1997 s.258} {cite:muwatta-maruf-1997 s.259}"
  id: "Malik meriwayatkannya dari Nafi', dalam surah Shalat Karena Takut: Ketika Abdullah ibn Umar ditanya tentang Shalat Karena Takut, beliau menjelaskannya: Imam dan sekelompok orang akan maju dan memimpin mereka dalam satu rakaat. Kelompok lain akan ditempatkan di antara beliau dan musuh, dan mereka tidak akan shalat. Setelah mereka yang bersamanya shalat satu rakaat, mereka akan mundur untuk menggantikan tempat mereka yang belum shalat, tanpa mengucapkan taslim (salam penutup). Mereka yang belum shalat kemudian akan maju dan shalat satu rakaat bersamanya. Imam kemudian akan pergi, setelah shalat dua rakaat. Setiap kelompok kemudian akan berdiri dan shalat satu rakaat secara individu. Jika rasa takutnya lebih besar, mereka akan shalat sambil berdiri atau menunggang kuda, menghadap kiblat atau tidak. Malik berkata: Nafi' berkata: Saya tidak berpikir Abdullah ibn Umar meriwayatkan ini kecuali dari Nabi. Peneliti memasukkannya dalam karyanya tentang al-Bukhari (4535), Abd al-Razzaq, al-Shafi'i, Ibn Khuzaymah, al-Tahawi, al-Bayhaqi, dan Muhammad ibn al-Hasan, melalui rantai periwayatan para sahabat Malik. Ia mengutip Ibn Abd al-Barr yang mengatakan bahwa Malik meriwayatkan hadits tersebut dengan keraguan mengenai atribusinya kepada Nabi. Sekelompok orang meriwayatkan hadits tersebut dari Nafi' tanpa keraguan mengenai atribusinya, termasuk Ibn Abi Dhi'b, Musa ibn Uqbah, dan Ayyub ibn Musa. Demikian pula, al-Zuhri meriwayatkan hadits tersebut dari Salim, dari Ibn Umar (al-Tamhid 15/258). {cite:muwatta-maruf-1997 p.258} {cite:muwatta-maruf-1997 p.259}"
