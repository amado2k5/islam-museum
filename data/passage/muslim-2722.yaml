label: { ar: "مسلم 2722 — اللهم آت نفسي تقواها وزكها أنت خير من زكاها", en: "Muslim 2722 — Grant my soul its piety, You are its best purifier" }
text: "قال زيد بن أرقم: لا أقول لكم إلا كما كان رسول الله يقول، قال كان يقول: اللهم إني أعوذ بك من العجز والكسل والجبن والبخل والهرم وعذاب القبر، اللهم آت نفسي تقواها وزكها أنت خير من زكاها أنت وليها ومولاها، اللهم إني أعوذ بك من علم لا ينفع ومن قلب لا يخشع ومن نفس لا تشبع ومن دعوة لا يستجاب لها"
summary:
  ar: "رواية زيد بن أرقم في باب التعوذ من العجز والكسل وغيرهما من كتاب الذكر والدعاء في صحيح مسلم؛ الدعاء الجامع بتزكية النفس وطلب تقواها — نقله زيد كما سمعه لا يزيد فيه."
