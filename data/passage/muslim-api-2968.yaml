label: { ar: "صحيح مسلم 2968 — الأب والأبوة", en: "Sahih Muslim 2968 — the father and fatherhood", ur: "صحیح مسلم 2968 — باپ اور والدیت", es: "Sahih Muslim 2968 — El padre y la paternidad" }
text: "… عَبْدِ الرَّحْمَنِ بْنِ أَبِي الشَّعْثَاءِ، قَالَ أَتَيْتُ إِبْرَاهِيمَ النَّخَعِيَّ وَإِبْرَاهِيمَ التَّيْمِيَّ فَقُلْتُ إِنِّي أَهُمُّ أَنْ أَجْمَعَ الْعُمْرَةَ وَالْحَجَّ الْعَامَ. فَقَالَ إِبْرَاهِيمُ النَّخَعِيُّ لَكِنْ أَبُوكَ لَمْ يَكُنْ لِيَهُمَّ بِذَلِكَ. قَالَ قُتَيْبَةُ حَدَّثَنَا جَرِيرٌ عَنْ بَيَانٍ عَنْ إِبْرَاهِيمَ التَّيْمِيِّ عَنْ أَبِيهِ أَنَّهُ مَرَّ بِأَبِي ذَرٍّ - - بِالرَّبَذَةِ فَذَكَرَ لَهُ ذَلِكَ فَقَالَ إِنَّمَا كَانَتْ لَنَا خَاصَّةً دُونَكُمْ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2968، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2968 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2968، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2968 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
