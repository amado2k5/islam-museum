text: "الجز الثالث عشر - حدَّثنا عبدُ الله، قال: ثنا أَبي، قال: ثنا أَبو المغيرةِ، قال: ثنا حَرِيزٌ، قال: حدَّثني راشدُ بنُ سعدٍ، عن أَبي مُلَيكَةَ الذِّماريِّ، قال: لا يَستكْمِلُ المرءُ الإِيمانَ كلَّه حتَّى: يُحِبَّ لِأَخيهِ ما يُحِبُّ لنفسه وحتَّى يُقِيمَ …"
summary:
