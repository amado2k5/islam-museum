text: "الجز الثالث عشر - حدَّثنا عبدُ الله، قال: ثنا أَبي، قال: ثنا أَبو المغيرةِ، قال: ثنا حَرِيزٌ، قال: حدَّثني راشدُ بنُ سعدٍ، عن أَبي مُلَيكَةَ الذِّماريِّ، قال: لا يَستكْمِلُ المرءُ الإِيمانَ كلَّه حتَّى: يُحِبَّ لِأَخيهِ ما يُحِبُّ لنفسه وحتَّى يُقِيمَ …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 250، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 2, p. 250, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 2، ص 250 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 2, pág. 250, que menciona la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal (tome 2, p. 250), qui évoque la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 250. sayfasından, imanın tatlılığı ve mükemmelliğinden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 2, halaman 250, yang menyebutkan manisnya dan kesempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
