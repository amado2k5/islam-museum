text: "… كلُّها أسماء معناها واحدٌ وهو الأسدُ.. أقسامٌ تبطلُ كلُّها إلا واحدًا فيصحُّ ذلكَ الواحدُ، مثلَ أن يكونَ هذا الشيءُ إمَّا حرامٌ فله حكمُ كذا، وإمَّا فرضٌ له حكمُ كَذا، وإمَّا مباحٌ فله حكمُ كذا، فليس فرضًا ولا حرامًا فهو مباحٌ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 142، يرد فيه ذكر الفرض، والمباح، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 142, whose wording mentions the obligatory (fard), the permitted (mubah), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 142 کا اقتباس جس میں فرض، مباح، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 142, dont le texte mentionne l'obligatoire (fard), le permis (mubah), l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 142, cuyo texto menciona lo obligatorio (fard), lo permitido (mubah), lo prohibido (haram); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 142. sayfasından, farz, helal ve haram fiilleri ele alan bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 142, yang membahas tentang amalan wajib, yang diperbolehkan, dan yang dilarang; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk dosa-dosa wajib, yang dianjurkan, yang tidak disukai, yang dilarang, dan dosa-dosa kecil."
