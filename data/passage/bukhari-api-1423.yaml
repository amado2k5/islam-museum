label: { ar: "صحيح البخاري 1423 — تربية الأب ووصيته", en: "Sahih al-Bukhari 1423 — the father raising and counselling", ur: "صحیح بخاری 1423 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 1423 — El padre que cría y aconseja", fr: "Sahih al-Bukhari 1423 — l'éducation et les conseils du père", tr: "Sahih el-Buhari 1423 — Babanın Terbiyesi ve Vasiyeti", id: "Sahih al-Bukhari 1423 — Didikan dan Wasiat Ayah" }
text: "… فِي ظِلِّهِ يَوْمَ لاَ ظِلَّ إِلاَّ ظِلُّهُ إِمَامٌ عَدْلٌ، وَشَابٌّ نَشَأَ فِي عِبَادَةِ اللَّهِ، وَرَجُلٌ قَلْبُهُ مُعَلَّقٌ فِي الْمَسَاجِدِ، وَرَجُلاَنِ تَحَابَّا فِي اللَّهِ اجْتَمَعَا عَلَيْهِ وَتَفَرَّقَا عَلَيْهِ، وَرَجُلٌ دَعَتْهُ امْرَأَةٌ ذَاتُ مَنْصِبٍ وَجَمَالٍ فَقَالَ إِنِّي أَخَافُ اللَّهَ، وَرَجُلٌ تَصَدَّقَ بِصَدَقَةٍ فَأَخْفَاهَا حَتَّى لاَ تَعْلَمَ شِمَالُهُ مَا تُنْفِقُ يَمِينُهُ، وَرَجُلٌ ذَكَرَ اللَّهَ خَالِيًا فَفَاضَتْ عَيْنَاهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1423، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1423 (Obligatory Charity Tax (Zakat)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1423، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1423 (Impuesto obligatorio sobre la caridad (Zakat)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1423 (L'aumône obligatoire (Zakat)), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site « Paternité en Islam » le répertorie avec les versets du Coran, la Sunna, la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'nin 1423 numaralı hadisinde babanın yetiştirilmesi ve öğütlerinden bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1423, menyebutkan tentang didikan dan nasihat seorang ayah. Situs web \"Kebapakan dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
