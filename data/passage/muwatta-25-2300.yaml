label: { ar: "الموطأ 2300 — مالك: لا يتحمل أحد لسيد المكاتب بكتابة عبده", en: "Muwatta 2300" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أنه لا ينبغي لسيد المكاتب أن يتحمل له أحد بكتابة عبده، إن مات العبد أو عجز؛ لأن الكتابة ليست دينا ثابتا يُتحمل به، وإن عجز المكاتب رجع إلى سيده عبدا، وإن مات وعليه دين لم يحاص سيده غرماءه بكتابته، وكان الغرماء أولى بماله منه. {cite:muwatta-maruf-1997 p.348}"
