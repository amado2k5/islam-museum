label: { ar: "الموطأ 2300 — مالك: لا يتحمل أحد لسيد المكاتب بكتابة عبده", en: "Muwatta 2300", es: "2300 vatios", fr: "2300 watts", ur: "2300 واٹ", tr: "El-Muvatta 2300 — Malik: Kâtiplerin efendisinin kölesi için yazı yazmasından kimse sorumlu değildir.", id: "Al-Muwatta 2300 — Malik: Tidak seorang pun bertanggung jawab atas seorang kepala juru tulis yang menulis untuk budaknya." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أنه لا ينبغي لسيد المكاتب أن يتحمل له أحد بكتابة عبده، إن مات العبد أو عجز؛ لأن الكتابة ليست دينا ثابتا يُتحمل به، وإن عجز المكاتب رجع إلى سيده عبدا، وإن مات وعليه دين لم يحاص سيده غرماءه بكتابته، وكان الغرماء أولى بماله منه. {cite:muwatta-maruf-1997 p.348}"
  tr: "Malik şöyle dedi: Aramızdaki görüş birliği, köle azat sözleşmesi yapmış bir kölenin efendisinin, köle ölürse veya sözleşmeyi yerine getiremeyecek duruma gelirse, kölenin azatını garanti altına alacak kimseye sahip olmaması gerektiğidir; çünkü azat sözleşmesi garanti edilebilecek sabit bir borç değildir. Köle sözleşmeyi yerine getiremeyecek duruma gelirse, efendisine köle olarak geri döner. Borçluyken ölürse, efendisi azat sözleşmesi nedeniyle alacaklılarının borçlarına ortak olamaz ve alacaklıların onun mal varlığı üzerinde efendisinden daha büyük bir hakkı vardır. {cite:muwatta-maruf-1997 s.348}"
  id: "Malik berkata: Konsensus di antara kami adalah bahwa tuan dari seorang budak yang telah membuat perjanjian pembebasan tidak boleh meminta siapa pun untuk menjamin pembebasan budaknya jika budak tersebut meninggal atau menjadi tidak mampu memenuhi perjanjian; karena perjanjian pembebasan bukanlah hutang tetap yang dapat dijamin. Jika budak tersebut menjadi tidak mampu memenuhi perjanjian, ia kembali kepada tuannya sebagai budak. Jika ia meninggal dunia saat masih berhutang, tuannya tidak dapat ikut menanggung hutang para krediturnya karena perjanjian pembebasan tersebut, dan para kreditur memiliki hak yang lebih besar atas hartanya daripada dirinya. {cite:muwatta-maruf-1997 p.348}"
