text: "… اليهود والنصارى في إبراهيم ليَّاِم : وقال أحبارُ يَهُودَ ونصارى نجران حين اجتمعوا عند رسول اللّٰه لل في فتنازعوا، فقالَتِ الأحبار : ما كان إبراهيمُ إلاَّ يهوديّاً، وقالت النصارَىٰ من أهل نجران: ما كان إبراهيمُ إلا نصرانيّاً؛ فأنزل اللّٰه عَزَّ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 260، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
