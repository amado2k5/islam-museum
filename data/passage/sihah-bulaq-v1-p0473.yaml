text: |-
  ١١٦٨
  ليت شعرى أأول الهرج هذا * أم زمان من قتذه غير هرج
  يعف أأول الهرج المذ كور فى الحديث هذا أم زمان من قتنة سوى ذلك الهرج وأصل الهرج
  الكثرة فى الشى ومنه قواهم فى الجماع بات يهرجها ايلته جعاء ويقال للفرس مرّيهرج وانه
  لمهرج ومراج اذا كان كثير الجسرى قال العجاج من كل هراج نبيل محزمه وهرج
  البعير بالكسريرج *رجااذاسدر من شدة الحرّوكثرة الطلا بالقطران قال العجاج بصف
  الحاروالأنان ورهبا من حنذه أن يهرجا وهرّجت البعيرتهر يجا وأهرجته اذا حلت
  عليه فى السير فى الهاجرة -تى يسدر وهزج النبيذ فلانا اذا بلغ منه فانهرج وانهك وهرّجت
  بالسبع اذا صت به وزجرته قال رؤية هرجت فارتدارتدادالاكمه ⁦(همرج)⁩
  الهمرجة الاختلاط فى المشى وهمرجت عليه الخبرأى خلطته ⁦(هزج)⁩ المزج صوت
  و الرعد والهزج أيضا من الاغانى وفيه ترنم وقد هزج بالكسر وتهزج قال الراجز
  حك أنهاجارية أزج
  وتهزجت القوس اذاصوّتت عند إنياص الرامى عنها
  قال السكميت
  لم يعب ربها ولا الناس منها * غير انذارهاعليه الهيرا
  باهازيج من أغانيها الجس * وإتباعها النحيب الزفيرا
  والهزج جنس من العروض واله-زامج بالضم الصوت المتسدارك بزيادة الميم ⁦( زلج )⁩
  الهزلاج الذئب الخفيف ( ل ج الاهليلج معرب قال ابن السكيت هوالاهليلج
  والاهليلجة بالكسر ولا تقل هليلجة وقال ابن الاعرابى هوالاهليلج بفتح اللام الاخيرة قال
  وليس فى الكلام افعيلل بالسكسر ولكن إفعيلل مثل إهليلج وإبريسم وإطر يقل ليج)
  الهلباجة الاحق قال خلف الاسمرسألت أعرابيا عن الهلباجة فقال هو الاحق الضخ.
  الفدم الاكول الذى والذى ثم جعل يلقانى بعد ذلك يزيد فى التفسير كل مرة شيئا ثم قال لى
  بعد حين وأراد انخروج هو الذى يجمع كل شر ⁦( همج)⁩ الهمج جع همجة وهوذباب صغير
  كالبعوض يسقط عسلى وجوه الغنم والهير وأعينها والهمجة أيضا الشاة المهزولة وقول
  أى ذؤيب
  كان ابنة السهمى يوم لقيتها • موشحة بالطرقين هسميج
  قالواظبية ذعرت من الهمج وبقال ارعاع من الناس الحقى اغماهم همج وقول الراجز
  قدهلكت جارتنا من الهمج * وان تجع تأ كل عنودا أوبذج
  قالواسو-التدبير فى المعاش وقيل الهمج الجوع وقولهم همج هامج وكبدله كة ولت ليل لائل
  قال الحرث بن حلزة
  يترك مارقح من عيشه • بعيث فيه همج هامج
  وهمجت الابل من الماهتهميج همجابالاسكان اذ اشر بت دفعة واحدة -تى رويت وأهمج
  الفرس أى حدفى جريه ⁦(هملج)⁩، الهملاج من البراذين واحد الهماليج ومشيها الهملجة
  فارمى معرب (هوج رجل أهوج بين الهوج أى طويل وبه تسرع وحق والهوجاء الناقة
  التى كان بهاهويا من مرعتها والهوجاء الريح التى تتلع البيون والجع هوج ⁦(هيج)⁩
  إهاج الشى يهيج هيجارهيا جاوهيجانا واهتاج وتهج أى ثار وهاجه غسير يتمدى ولا يتعذى
