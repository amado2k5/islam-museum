label: { ar: "جامع الترمذي 1818 — أعضاء البدن", en: "Jami' al-Tirmidhi 1818 — the organs of the body", ur: "جامع ترمذی 1818 — اعضائے بدن", es: "Jami' al-Tirmidhi 1818 — los órganos del cuerpo", fr: "Jami' al-Tirmidhi 1818 — les organes du corps", tr: "Cami' el-Tirmizi 1818 — Vücut Parçaları", id: "Jami' al-Tirmidhi 1818 — Bagian Tubuh" }
text: "… بَشَّارٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، حَدَّثَنَا عُبَيْدُ اللَّهِ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، عَنِ النَّبِيِّ قَالَ \" الْكَافِرُ يَأْكُلُ فِي سَبْعَةِ أَمْعَاءٍ وَالْمُؤْمِنُ يَأْكُلُ فِي مِعًى وَاحِدٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. قَالَ وَفِي الْبَابِ عَنْ أَبِي هُرَيْرَةَ وَأَبِي سَعِيدٍ وَأَبِي بَصْرَةَ الْغِفَارِيِّ وَأَبِي مُوسَى وَجَهْجَاهٍ الْغِفَارِيِّ وَمَيْمُونَةَ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو."
summary:
  ar: "حديث في جامع الترمذي، رقم 1818، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 1818 (The Book on Food), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 1818، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1818 (El Libro de los Alimentos), menciona los órganos del cuerpo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1818 (Le Livre des Aliments), mentionne les organes du corps. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de yer alan 1818 numaralı hadiste vücut organlarından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1818, menyebutkan organ-organ tubuh. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
