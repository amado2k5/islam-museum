label: { ar: "سنن أبي داود 62 — عدد الحسنات، كتابة الحسنات", en: "Sunan Abi Dawud 62 — a stated number of good deeds; the writing of good deeds", ur: "سنن ابی داؤد 62 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… يَحْيَى، أَتْقَنُ - عَنْ غُطَيْفٍ، - وَقَالَ مُحَمَّدٌ عَنْ أَبِي غُطَيْفٍ الْهُذَلِيِّ، - قَالَ كُنْتُ عِنْدَ عَبْدِ اللَّهِ بْنِ عُمَرَ فَلَمَّا نُودِيَ بِالظُّهْرِ تَوَضَّأَ فَصَلَّى فَلَمَّا نُودِيَ بِالْعَصْرِ تَوَضَّأَ فَقُلْتُ لَهُ فَقَالَ كَانَ رَسُولُ اللَّهِ يَقُولُ \" مَنْ تَوَضَّأَ عَلَى طُهْرٍ كَتَبَ اللَّهُ لَهُ عَشْرَ حَسَنَاتٍ \". قَالَ أَبُو دَاوُدَ وَهَذَا حَدِيثُ مُسَدَّدٍ وَهُوَ أَتَمُّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 62، يذكر عدد الحسنات، وكتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 62 (Purification (Kitab Al-Taharah)), that speaks of a stated number of good deeds, the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 62، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
