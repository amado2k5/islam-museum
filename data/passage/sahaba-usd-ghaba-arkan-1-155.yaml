text: "… سوداء من نفاق في قلبه لا يغيّرها شيء إلى يوم القيامة. وقد روي عن عبد الحميد أيضاً، عن عبد الله بن ثعلبة، عن عبد الرحمن، عن علبة أن النبي ع قال : البذاذة من الإيمان. أخرجه ابن منده وأبو نعيم. …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 155، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
