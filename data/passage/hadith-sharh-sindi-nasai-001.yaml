text: "برية وكتابت بلا الف كا في تعض السخ مبنى علي عادة اهل الحديث في كتابة النصوب بلا الف احيانا حتى ملعمه من القمة حجراري ادخل فى فمه قولد اذلكانت رسلالا هلها رسلا بلسر الراء معني اللبن وكذما كان من الابل"
