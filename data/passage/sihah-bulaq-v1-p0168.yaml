text: |-
  ٤٧٣
  أحس فأظهر التضعيف الضرورة كما قال آخر تشكوالوجى من أظلل واظال
  والكادس ما يتطيريه من الفال والعطاس ولح وذلك ومنه قيل للفابى وغيره اذا نزل من الجبل
  كأدس يتشاءم به كمايتشامم بالبارح ⁦( رس )⁩ السكرس بالكسر الابوال والابعار
  يتلبد بعضها على بعض بقال أكرست الدار قال الحجاج
  ياصاح هل تعرف رسما.كرسا • قال نعم أعرفه وأبلسا
  والكرس أيضا أبيات من الناس مجتمعة والجمع أكراس وأكاريس والكرس أيضا الاصل
  قال العجاج بمدح الوليد ين عبد الملك
  أنت أبا العباس أولى نفس • بعدن الملك القديم الكرس
  والانكراس الانكاب وقد انكرس فى الشيء اذادخل فه منكا والكرمى واحد
  الكواسى وربما قالوا كرسى بكسر الكاف والكروس بتشديد الواوالعظيم الرآس واسم
  رجل والكرّاسة واحدة المكراس والكراريس قال الكميت
  -تى كانَء راص الدار أردية * من التجاويز أوكراس أسفار
  جمع سفروال.كرياس الكنيف فى أعلى السطح ربس) الكرباس فارسى معرب بكسر
  الكاف والكرباسة أخص منه والبهع الكرابيس وهى شياج خشنة ردس !
  السكردوس القطعة من الخيل العظيمة والكراديس الفرق منهم بقال كردس القائد خيله
  أى جعلها كتيبة كتيبة وكل عظمين التقيافى مفصل فهوكردوس نحو المنسكبين والركبتين
  والور كين قال أبو عمر والكردسة الوثاق يقال كردسه وليج به الارض أنشد
  وحاجب كردسه فى الحبل • مناغلام كان غيروغل • حتى اقتدى منابمال حبل
  وكردس الرجلبحعت يداه ورجلاه قال ورجل مكردس علززالحلق وأنشد
  دحونة. كردس بلندم والتكرذس الانقباض واجتماع بعضه الى بعض والكردسة
  مشى المقيد قال ابن الكاب الكردوسان قيس ومعاوية ابنامالك بن حنظلة بن مالك بن زيد
  مناة بن تيم وهه افى بنى فقيم بن جرير بن دارم ⁦(كرفس)⁩ الكرفس بقسلة معروفة
  ( كركس الكركسسة تزديد الشئ ويقال للذى ولدنه الاماءمكركس كانه مرددفى
  الهجذاء ⁦(كسس)⁩ المكسيس نبيذالتر قال الشاعر
  فان تسق من أعضاب وج فاننا * لنا العين تجرى من كسيس ومن خر
  والمكسيس أيضالحم يجففءلى الحجارة ثم يدق ويتزوّد والكس قصر الاسنان بقال
  رجل أكس ⁦(كاس)⁩ الكاس الصاروج يبنى به وقال عدى بن زيد
  شاده مر مر اوجااه ككسافلطير فى ذراه وكور
  ومنه الكاسة فى المون يقال ذتب أكاس ( نس لكانس الظبى يدخل فى كناسه وهو
  موضعه فى الشجر يكتن فيه ويستتر وقد كنس الفبي يكنس بالكسر وتكنس منله وكنست
  البيت أكنسه بالضم كنسا والمكنسة ما يكنس به والمكناسة القمامة واسم موضع بالكوفة
  والكنيسة للنصارى والكنس المكوا كب قال أبو عبيدة لانها تكنس فى المغيب أى تستتر
  ١١٩
  قوله المكراسة بضم الكاف فيه
  وفى السكراس ثم ان محشى
  القاموس اعترض قوله واحدة
  المكراس فقال ان أراد أنناه
  فظاهروان أراد أنها واحدة
  والكراس بجع أواسم جنس
  ججعى فليس كذلكك وقد حققته
  فى شرح الاقتراح وغيره اه
  وعسلى هذا فليس مثل رمّان
  ورمانة قاله نصر
  ⁦(١)⁩ أى صرعه وقوله بمال
  حبل فى نسححة بمال جزل اه
