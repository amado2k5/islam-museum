  والقدام القادمون من سفر قالمهلهل
  انالنضرب بالسيوف رؤسهم • ضرب القدارنقيعة القدّام
  ويقال هو الملك والقادمتان والتادمان الملفان المتقدّمان من أخلاف الناقة اللذان يلبان
  السرّة وفى قادمة الرحل ست لغات مقدم ومقدمة بكسر الدال مخففة ومقدّم ومقدّمة بفتح
  الدال مشتدة وقادم وقادمة وكذلك هذه اللغات كلها فى اخرة الرحل وقال
  كأنّ من آخرها إلقادم • مخرم فخذفارع الخارم
  أراد من آخرها الى القادم فحذف احدى اللامين اللام الأ ولى والقدوم التى ينحت بها
  مخففة قال ابن السكيت ولا تقل قدوم بالتشديد والجمع قدم قال الاعشى
  أقام به شاهبور الجنو * دحولين تضرب فيه القدم
  وجمع القدم قدائم مغل قلص وقلائص والقدوم أيضااسم موضع ⁦(قدم)⁩ القذم
  على وزن الهجف الشديد والقدم أيضا السريع وانقدم أسرع وقدمت له من المال مثل قتمت
