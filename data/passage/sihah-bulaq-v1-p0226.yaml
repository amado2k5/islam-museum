text: |-
  ⁦(ف صل الواد)⁩
  ⁦(هير)⁩
  ٤١٥
  بالتسكين ووقراللّه أذنه يقرها ورايقال اللهتم قرأذنه ووقرت أذنه على مالم يسمّ فاعله فهو
  موقور ووقرت العظم أقره وقراصدعته قال الأعشى
  يادهرقد أكثرت فجعتنا * يسنراتنا ووقرت فى العظم
  والوقرة أن يصيب الحافر حجرا وغيره فينكبه تقول منه وقرت الداية بالكسر وأوقرها اللّٰه
  عن المكسائى مثل رهمت وأرهصها اللّه قال الهجاج
  كأنه مستبطن اصرارا • وأباحت نسوره الاوقارا
  بقال فى الصبرعلى المصيبة كانت وقرة فى صخرة يعنى ثلة وهزمة أى أنه احتمل المصيبة
  ولم تؤثر فيه الامثل تلك الهزمة فى الصخرة والوقار الجلم والرزانة وقد وقر الرجسل يقروقارا
  وقرة اذائات فهو وقور قال الراجز
  بكل أخلاف الرجال قدمهر * نبت اذا ماصيح بالقوم وقر
  وقال اللّٰه تعالى وقرن فى بيوتكنّ وقرى بالفتح فهذا من القرار كأنه يريداقرون فتحذف
  الراء الاولى للتخضيف وتلقى فتحتها على القاف فيستغق عن الالف لحركة ما بعدها وتحتمل
  قراءة من قرأ بالكسراً يضا أن تكون من اقررن بكسر الراء على هذا كماة رئ فظلتم تفكهون
  بفتح الظاء وكسرها وهو من شواذ التخفيف والتوفير التعظيم والترزين أيضاوقوله تعالى
  مالكم لاتزجون لله وقارا أى لا تخافون للّه عظمة عن الاخفش ورجسل موقرأى مجرب
  والتيقور الوقار وأصلدويورقلبت الواوتاء قال العجاج فان يكن أمى البلى تيقورى
  أى أمسى وقارى والوقبرة نقرة فى الجبل عظيمة وقولهم فتير وقيرا تساع له ويقال معفاه أنه
  أوقره الدين أى أنقله والوقير الغنم قال ذو الزمة يصف بقرة
  مولعة خنساء ليست بنعجة * يدمّن أجواف المياه وقيرها
  وكذلك القرة والهاءعوض عن الواد قال الإغلب العجلى
  ماان رأ بنا ملكا اغارا • أكثرمنه قرة وقارا.
  ( وكر وكر الطائرعشه والجمسع وكوروأ وكار قال أبو يوسف سمعت أباعمرو يقول الوكر
  العش حيثما كان فى جبل أوشهجر وق دوكر الطائر يكروكرا أى دخسل وكره ووكرت النساقة
  تكروكرا اذاعدت الوكرى وهى عدوفيه نزو وكذلك الفرس وناقة وكرى أيضاأى قصيرة
  ووكرت السقاء وكراملاً ته وكذلك وكرته توكيرا وقال يصف مغزى امتلات بطونها
  نج المزاد مفرطاتو كيرا• وكذلك وكرفلان بطنه وأوكره والتوكيراتخاذالو كيرة وهى طعام
  البناءقال الاصمحي شرب حتى بوكروحتى تضلع وتوكر الطائرامتلات -وصلته
  صل الهاء بر لهبيرما اطمات من الارض وكذلك الهبروالبجمع هبود ويقال
  هى الصدون بين الروابى والهبرة القطعة من اللهم وقد هبرت له من اللحم هبرة أى قطعت له
  نطعة وقد هبر ابهل بالكسر يهبر عبرا فهو هبروأهسبراذا كان كثير اللحم يقنال بعير هبر وبرأى
  كثير الوبر والهسبر وهو اللحم عن يعقوب والناقة هبرة وهبراء واله وبر القرد الكثير الشعر
  وكذلك الهبار وقال سفرت فقات لهاهج فتبرقعت • وذكرت حين تبرقعت هبارا
  والهباراسم رجل من قريسْ وقوله-م لا آتيك هبيرة بن سعد أى أبدا وهورجل فقد ويقال
