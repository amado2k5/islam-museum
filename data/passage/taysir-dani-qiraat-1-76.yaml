text: "… بسم الله، وه الحمد لله، و قل اللهمّ، • وشبهه وكذا سائر اللامات لاخلاف فى ترقيقهن سواء تحركن او سكنّ وبالله التوفيق باب ذكر الوقف على اواخر الكلم اعلم ان من عادة القرّاء ان يقفوا على اواخر الكلم المتحركات فى …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 1، ص 76، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 1, p. 76, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 1، ص 76 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Dani, al-Taysir fi al-Qira'at al-Sab', volumen 1, pág. 76, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du livre d'al-Dani, al-Taysir fi al-Qira'at al-Sab', volume 1, page 76, mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dani'nin \"Al-Taysir fi al-Qira'at al-Sab'\" adlı eserinin 1. cildinin 76. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Al-Taysir fi al-Qira'at al-Sab' karya Al-Dani, Volume 1, halaman 76, yang menyebutkan para qari; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
