label: { ar: "صحيح البخاري 6281 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Sahih al-Bukhari 6281 — a testament or parting counsel; a deathbed and last hours", ur: "صحیح بخاری 6281 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات", es: "Sahih al-Bukhari 6281 — un testamento o consejo de despedida; un lecho de muerte y últimas horas", fr: "Sahih al-Bukhari 6281 — un testament ou des adieux; un lit de mort et les dernières heures" }
text: "… ثُمَامَةَ، عَنْ أَنَسٍ، أَنَّ أُمَّ سُلَيْمٍ، كَانَتْ تَبْسُطُ لِلنَّبِيِّ نِطَعًا فَيَقِيلُ عِنْدَهَا عَلَى ذَلِكَ النِّطَعِ ـ قَالَ ـ فَإِذَا نَامَ النَّبِيُّ أَخَذَتْ مِنْ عَرَقِهِ وَشَعَرِهِ، فَجَمَعَتْهُ فِي قَارُورَةٍ، ثُمَّ جَمَعَتْهُ فِي سُكٍّ ـ قَالَ ـ فَلَمَّا حَضَرَ أَنَسَ بْنَ مَالِكٍ الْوَفَاةُ أَوْصَى أَنْ يُجْعَلَ فِي حَنُوطِهِ مِنْ ذَلِكَ السُّكِّ ـ قَالَ ـ فَجُعِلَ فِي حَنُوطِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6281، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6281 (Asking Permission), that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 6281، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6281 (Pedidos de permiso), menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 6281 (Demande de permission), mentionne un testament ou des dernières volontés, le lit de mort et les dernières heures. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
