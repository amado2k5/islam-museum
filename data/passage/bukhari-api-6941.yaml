label: { ar: "صحيح البخاري 6941 — حلاوة الإيمان وكماله، خصال من كنّ فيه", en: "Sahih al-Bukhari 6941 — the sweetness and completeness of faith; traits that, found in a person, mark faith", ur: "صحیح بخاری 6941 — ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں", es: "Sahih al-Bukhari 6941 — La dulzura y la plenitud de la fe; rasgos que, encontrados en una persona, marcan la fe.", fr: "Sahih al-Bukhari 6941 — la douceur et la plénitude de la foi; les traits qui, chez une personne, marquent la foi", tr: "Sahih el-Buhari 6941 — İmanın tatlılığı ve mükemmelliği, ona sahip olanların sahip olduğu nitelikler.", id: "Sahih al-Bukhari 6941 — Manisnya dan kesempurnaan iman, sifat-sifat yang dimiliki oleh orang-orang yang memilikinya" }
text: "… اللَّهِ بْنِ حَوْشَبٍ الطَّائِفِيُّ، حَدَّثَنَا عَبْدُ الْوَهَّابِ، حَدَّثَنَا أَيُّوبُ، عَنْ أَبِي قِلاَبَةَ، عَنْ أَنَسٍ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثٌ مَنْ كُنَّ فِيهِ وَجَدَ حَلاَوَةَ الإِيمَانِ أَنْ يَكُونَ اللَّهُ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا، وَأَنْ يُحِبَّ الْمَرْءَ لاَ يُحِبُّهُ إِلاَّ لِلَّهِ، وَأَنْ يَكْرَهَ أَنْ يَعُودَ فِي الْكُفْرِ، كَمَا يَكْرَهُ أَنْ يُقْذَفَ فِي النَّارِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6941، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6941 ((Statements made under) Coercion), that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6941، جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6941 ((Declaraciones hechas bajo coacción)), menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 6941 (« Déclarations faites sous la contrainte »), évoque la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent. Le répertoire « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih el-Buhari'de 6941 numaralı hadis, imanın tatlılığı ve mükemmelliğinden ve ona sahip olanların niteliklerinden bahseder. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6941, menyebutkan manisnya dan kesempurnaan iman, serta sifat-sifat orang yang memilikinya. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
