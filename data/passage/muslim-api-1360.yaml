label: { ar: "صحيح مسلم 1360 — الأب والأبوة", en: "Sahih Muslim 1360 — the father and fatherhood", ur: "صحیح مسلم 1360 — باپ اور والدیت", es: "Sahih Muslim 1360 — El padre y la paternidad", fr: "Sahih Muslim 1360 — Le père et la paternité" }
text: "… وَقُتَيْبَةُ بْنُ سَعِيدٍ، وَابْنُ، حُجْرٍ عَنْ إِسْمَاعِيلَ بْنِ جَعْفَرٍ، - قَالَ ابْنُ أَيُّوبَ حَدَّثَنَا إِسْمَاعِيلُ، - أَخْبَرَنِي الْعَلاَءُ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِذَا ثُوِّبَ لِلصَّلاَةِ فَلاَ تَأْتُوهَا وَأَنْتُمْ تَسْعَوْنَ وَأْتُوهَا وَعَلَيْكُمُ السَّكِينَةُ فَمَا أَدْرَكْتُمْ فَصَلُّوا وَمَا فَاتَكُمْ فَأَتِمُّوا فَإِنَّ أَحَدَكُمْ إِذَا كَانَ يَعْمِدُ إِلَى الصَّلاَةِ فَهُوَ فِي صَلاَةٍ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1360، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1360 (The Book of Mosques and Places of Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1360، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 1360 (El Libro de las Mezquitas y Lugares de Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 1360 (Livre des mosquées et des lieux de prière), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
