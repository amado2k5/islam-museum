text: "نهم، ويجعل بين المملكتين حدا لا يجوزه. فرضى أخشنواز بذلك، وكتب له كتابا مختوما وأشهد له على نفسه شهودا، ثم خلى سبيله وانصرف. فلما صار إلى مملكته حمله الأنف على معاودة أخشنواز. . عاقبة غدره فكان من عاقبة غدره: أنه"
