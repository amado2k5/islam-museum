text: "… من أمر الجاهلية لا يتركونهن : الفخر في الأحساب، والطعن في الأنساب، والاستسقاء بالنجوم، والنياحة وقال : النائحة إذا لم تتب قبل موتها تقام يوم القيامة وعليها سرنان من قطران، ودرع من جرب، رواه أحمد ومسلم. وعن أم عطية قالت …"
summary:
  ar: "مقطع من فقه السنة — سعيد رمضان البوطي، المجلد المصوَّر 4، ص 511، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Fiqh al-Sunna — Sa'id Ramadan al-Buti, scan volume 4, p. 511, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "فقہ السنۃ - سعید رمضان البوطی۔، اسکین جلد 4، ص 511 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna — Sa'id Ramadan al-Buti, volume numérisé 4, p. 511, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Fiqh al-Sunna - Sa'id Ramadan al-Buti, volumen escaneado 4, p. 511, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Sa'id Ramadan al-Buti'nin *Fıkıhü'l-Sünne* adlı eserinin 4. cildinin 511. sayfasından, yas tutma ve sınırları konusunu ele alan bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Ağıt ve ağıt üzerine en meşhur sözlerden derlenmiştir."
  id: "Kutipan dari *Fiqh al-Sunnah* karya Sa'id Ramadan al-Buti, Volume 4, halaman 511, yang membahas tentang berkabung dan batas-batasnya; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan ucapan-ucapan paling terkenal tentang elegi dan ratapan."
