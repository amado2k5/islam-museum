text: "وحديث شعب الإيمان تقدم، وقوله: ا: يخرج من النار من كان فى قلبه مثقال ذرة من إيمان فعلم أن من كان معه من الإيمان أقل القليل لم يخلد فى النار، وإن كان معه كثير من النفاق فهو يعذب فى النار …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 2، ص 298، يذكر شعب الإيمان، وتفاضل الإيمان في القلوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 2, p. 298, that mentions the branches of faith, the degrees of faith in hearts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 2، ص 298 کا اقتباس جس میں ایمان کی شاخیں، دلوں میں ایمان کے درجے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 2, pág. 298, que menciona las ramas de la fe y los grados de fe en los corazones; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 2, p. 298), mentionnant les branches de la foi et les degrés de foi dans les cœurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi'nin 2. cildinin 298. sayfasından, imanın dalları ve kalplerdeki imanın farklı dereceleri üzerine yaptığı açıklamadan bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari penjelasan Ibn Abi al-`Izz tentang Akidah al-Tahawi, Jilid 2, halaman 298, yang membahas cabang-cabang iman dan berbagai tingkatan iman dalam hati; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
