text: "وحديث شعب الإيمان تقدم، وقوله: ا: يخرج من النار من كان فى قلبه مثقال ذرة من إيمان فعلم أن من كان معه من الإيمان أقل القليل لم يخلد فى النار، وإن كان معه كثير من النفاق فهو يعذب فى النار …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 2، ص 298، يذكر شعب الإيمان، وتفاضل الإيمان في القلوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 2, p. 298, that mentions the branches of faith, the degrees of faith in hearts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 2، ص 298 کا اقتباس جس میں ایمان کی شاخیں، دلوں میں ایمان کے درجے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
