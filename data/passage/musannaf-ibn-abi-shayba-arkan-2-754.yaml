text: "… لن يحافظ على الوضوء إلا مؤمن. - حدثنا عفان قال: حدثنا أبان العَطَّار عن يحيى بن أبي كثير عن زيد عن أبي سلام عن أبي مالك الأشعري، أن رسول الله كان يقول: الطهور شَطر الإيمان. - حدثنا عبدالرحمن بن مهدي …"
