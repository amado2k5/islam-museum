text: "وَحَدَّثَنِي مَالِكٌ، أَنَّهُ بَلَغَهُ أَنَّ رَسُولَ اللَّهِ قَالَ \" إِنْ كَانَ دَوَاءٌ يَبْلُغُ الدَّاءَ فَإِنَّ الْحِجَامَةَ تَبْلُغُهُ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 1789، يذكر الحجامة، والدواء، والداء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1789 (General Subjects), that mentions cupping, the drug, the disease and its remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1789، جس میں حجامہ، دوا، بیماری کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
