ref: "1789"
label: { ar: "موطأ مالك 1789 — الحجامة، الدواء", en: "Muwatta Malik 1789 — cupping; the drug", ur: "موطأ مالک 1789 — حجامہ، دوا", es: "Muwatta Malik 1789 - ventosas; la droga", fr: "Muwatta Malik 1789 — ventouses; la drogue", tr: "Muwatta Malik 1789 — Hacamat, Tıp", id: "Muwatta Malik 1789 — Bekam, Kedokteran" }
text: "وَحَدَّثَنِي مَالِكٌ، أَنَّهُ بَلَغَهُ أَنَّ رَسُولَ اللَّهِ قَالَ \" إِنْ كَانَ دَوَاءٌ يَبْلُغُ الدَّاءَ فَإِنَّ الْحِجَامَةَ تَبْلُغُهُ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 1789، يذكر الحجامة، والدواء، والداء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1789 (General Subjects), that mentions cupping, the drug, the disease and its remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1789، جس میں حجامہ، دوا، بیماری کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1789 (Temas generales), menciona la ventosaterapia, el medicamento, la enfermedad y su remedio. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik, n° 1789 (Sujets généraux), mentionne la ventousothérapie, le médicament, la maladie et son remède. Le Répertoire des médicaments le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta'sında yer alan 1789 numaralı hadiste hacamat, tıp ve hastalıktan bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1789, menyebutkan tentang bekam, pengobatan, dan penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
