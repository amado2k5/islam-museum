  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 1810, que menciona el dolor, enfermedades específicas, la recuperación de una dolencia, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 1810, qui mentionne la douleur, les maladies nommées, la guérison d'une affection, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinden, s. 1810'da yer alan, ağrı, hastalıkların isimleri, hastalıktan iyileşme, vücut organları, ameliyat, sünnet, atel ve ilaçlardan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
