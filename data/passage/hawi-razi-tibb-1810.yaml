text: "… يطلى عليه. للبارد: لحم الزبيب يدق بالسذاب والبثور ويضمد به. حب للنقرس: إهليلج أصفر تربد بابونج سورنجان بوزيدان بالسوية ملح هندي ثلث جزء يجمع بعنب الثعلب وماء اللبلاب، الشربة مثقالان. ج: في حيلة البرء : الأدوية القطاعة، تستعمل لوجع المفاصل …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1810، يذكر الوجع، وأسماء الأمراض، والبرء من العلة، وأعضاء البدن، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1810, that mentions pain, named diseases, recovery from an ailment, the organs of the body, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1810 کا اقتباس جس میں درد، بیماریوں کے نام، بیماری سے شفایابی، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
