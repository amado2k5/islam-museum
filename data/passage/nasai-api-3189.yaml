label: { ar: "سنن النسائي 3189 — الأب والأبوة", en: "Sunan al-Nasa'i 3189 — the father and fatherhood", ur: "سنن نسائی 3189 — باپ اور والدیت", es: "Sunan al-Nasa'i 3189 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3189 — Le père et la paternité", tr: "Sunan an-Nasa'i 3189 — Baba ve Babalık", id: "Sunan an-Nasa'i 3189 — Sang Ayah dan Peran Ayah" }
text: "… - وَاللَّفْظُ لِحُسَيْنٍ - قَالاَ حَدَّثَنَا وَكِيعٌ، عَنْ سُفْيَانَ، عَنْ عَلْقَمَةَ بْنِ مَرْثَدٍ، عَنْ سُلَيْمَانَ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" حُرْمَةُ نِسَاءِ الْمُجَاهِدِينَ عَلَى الْقَاعِدِينَ كَحُرْمَةِ أُمَّهَاتِهِمْ وَمَا مِنْ رَجُلٍ يَخْلُفُ فِي امْرَأَةِ رَجُلٍ مِنَ الْمُجَاهِدِينَ فَيَخُونُهُ فِيهَا إِلاَّ وُقِفَ لَهُ يَوْمَ الْقِيَامَةِ فَأَخَذَ مِنْ عَمَلِهِ مَا شَاءَ فَمَا ظَنُّكُمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3189، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3189 (The Book of Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3189، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3189 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3189 (Le Livre du Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 3189 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3189, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
