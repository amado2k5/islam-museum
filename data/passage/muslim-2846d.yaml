label:
  ar: "مسلم 2846d — تحاجت الجنة والنار: أنت رحمتي وأنت عذابي"
  en: "Muslim 2846d — Paradise and the Fire disputed: you are My mercy, you are My punishment"
  ur: "مسلم 2846d — جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب"
  es: "Musulmán 2846d — El Paraíso y el Fuego en disputa: Tú eres Mi misericordia, tú eres Mi castigo"
  fr: "Muslim 2846d — Le Paradis et le Feu sont sujets à controverse: vous êtes Ma miséricorde, vous êtes Mon châtiment"
  tr: "Müslim 2846d — Cennet ve Cehennem tartıştı: Sen benim rahmetimsin, sen de benim azabımısın."
  id: "Muslim 2846d — Surga dan Neraka berdebat: Engkau adalah rahmat-Ku dan engkau adalah azab-Ku"
text: "تحاجت الجنة والنار فقالت النار أوثرت بالمتكبرين والمتجبرين . وقالت الجنة فما لي لا يدخلني إلا ضعفاء الناس وسقطهم وغرتهم قال الله للجنة إنما أنت رحمتي أرحم بك من أشاء من عبادي . وقال للنار إنما أنت عذابي أعذب بك …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2846d: تحاجت الجنة والنار: أنت رحمتي وأنت عذابي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2846d: Paradise and the Fire disputed: you are My mercy, you are My punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2846d: جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2846d: El Paraíso y el Fuego en disputa: Tú eres Mi misericordia, tú eres Mi castigo. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2846d: Le Paradis et l’Enfer sont sujets à controverse: « Vous êtes Ma miséricorde, vous êtes Mon châtiment. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2846d: Surga dan Neraka berargumen: \"Kamu adalah rahmat-Ku dan kamu adalah azab-Ku.\" Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
