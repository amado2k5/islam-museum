text: |-
  ١ رواية الزوزنى فى شرح
  المعلقات طلايك بكاف الخطاب
  لا يضير الغائبة وأجاب الشارح
  عن وجه العدول الى انخطاب
  قاتظره فى صفصة ١٥٣ من
  المطبوع قاله نصر
  قوله مرزبان بفسع الميم وضم
  الزاى بمعنى رئيس اه وانV
  والهسمز مثال الزنبر الداهية
  وربماجاه ضم الباء فيهسما قال
  تعلب لانعلم فى الكلام فعلل
  فان كان هذان الحرقان مسموعين
  بضم الباءفيهمافهو من النوادر
  ادوة د غلط المترسم هنا فى تفسير
  الضبل فضره بعني الضئيل
  بوزن حتير قاله نصر
  ٢٢٤
  ⁦(باب الرام)⁩
  فهوزائر قال عنترة
  حات بأرض الزاترين فأصبحت • عسر اعلى طلابه!ابنة مخرم ١
  يعف الاعداء ويتال أيضازتر الاسد بالكسر يزأرفهوزتر قال الشاعر
  ما مخدر حوب مستأسد أسد • ضِبَارم خادرذ وصولة زمر
  وكذلك تزأر الاسدع لى تفعل بالتشديدوالزأرة الاجة ويقال أبو الحرث حرز بان الزأرة
  ⁦( زبر)⁩. الزبرة القطعمن الحديد والجمع زبرقال اللّٰه تعالى آلونى زبر الحديد وزير
  أيضاقال تعالى فتقطعوا أمرهم بينهم زبرا أى قطعا والزبرة أيضاموضع الكاهل بقال
  رجل أزبر أى عظيم الزبرة ومنه زبرة الاسديقال أسد حز برانى أى ضخم الزبرة وقواهم فى المثل
  قد هاحت زبراء هى اسم جارية كانت للاحنف بن قيس وكانت سليدة فاذا غضبت قال
  الاحنف قدهاجت زبراء فذهبت مثلا والزبرة كوكبان فيران وهما كاهلا الاسدينزله-ما
  القمروالزبربا افتح الزجر والمنع يقال زبره يزبره بالضم زبرا اذا انتهره ويقال مالدز برأى عقل
  وتماسك وهو فى الاصل مصدر والزبر أيضاطىّ البئر بالحجارة يقال بتر حزبورة والزبر الكتابة
  يقال زبريز بر ويزبر قال الاصمعى ممعت اء راييا يقول أنا أعرف تزبرتى أى خطى وكتابتى
  والربوالكتاب والمع زبور مشل قدر وقد ورومنه قرأبعضه-م وآتينادا ودزبوراوالمزبر القلم
  والزيور بالفتح لكتاب وهوفعول بمعنى مفسعول من زبرت والزيور كاب داود عليسه السلام
  والزبيراسم الجبل الذى كام اللّٰهء ليه مومي عليه السلام والزبرّ بالكسر والتشديد القوى
  الشديد قال الراجز
  أكون ثم أسدازبرًا أبوزيد أخذت الشى برويره وبزأبر.
  وبزغبره اذا أخذته كله ولم تدع منهشيئا قال ابن احر
  اذا قال غاومن تنوخ قصيدة * بهاجرب عدّت على بزوبرا
  أى نسبت الىّ بكمالها والزنيرية ضرب من السفن فخمة والزنيور الدبروهى تؤنث والزئيار
  لغة فيها حكاها ابن السكيت والجمسع الزنابير وأرض حزبرة كثيرة الزنانير كانه-م ردوه الى
  ثلاثة أحرف وحذفوا الزيادات ثم بنواعليه كما قالوا أرض معقرة ومشعلة أى ذات عقارب
  وتعالب وازبار الكاب تنفش واز بأرّ الشعر تنفس قال الشاء و(المرارين منقذ الحتظلى
  فهوورد اللون فى ازيتراره * وكيت اللون مالم يزبتر
  أبو زيدازبأرّ النبت والوبراذانت والزتبر بالكسر مهم وز ما يعلوا الموب الجد يد مثل ما يعلو
  الحزيقال زأبر الثوب فهو مز أبراذاخرج زئبره قال يعة وب وقد قيل زتبر بضم الياه وقد
  ذكرنا، فى ضئبل فى باب اللام ٢ زبطر) الزبطرة مثال القمطرة ثغرمن ثغور
  الروم ⁦( زبعر )⁩ قال الفراء الزبعرى الدي الخلق ومنه عي الرجل الكثير شعر الوجه
  والحاجبين واللسيين وبحل زبعرى كذلك وأيو عمر ومثل ⁦(زجر)⁩ الزجر المنسع والنهى
  يقال زبره وازدجره فانزبر وازدحر والزجور من الابل التى تعرف بعينها وتنكر بأنفها
  والزجر العيافة و«وضرب من التكهن تقول زجرت أنه يكون كذا وكذاوزجر البعسير أى
  ساقه والزنجرة قرع الابهام على الوسطى بالسبابة والاسم الزنجير وقال
  فأرسلت الى سلى بأن النفس مشغوفه • ناجادت لناسلى بز نجير ولا فوفه: :
  ⁦( ذ- )⁩
