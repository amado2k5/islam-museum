text: "بقوله : باب في الذي ينتمي إلى غير مواليه . ثم أعاد الموضوع في كتاب الفرائض حيث ترجم : باب من ادعى إلى غير أبيه . فموضوع الترجمتين واحد، وقد يشتركان أيضا في بعض أحاديثهما ، إلا أنه اختار من"
