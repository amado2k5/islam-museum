label: { ar: "الموطأ 2740 — كعب الأحبار: كلمات يقولها تحفظه من أن تجعله يهود حمارا", en: "Muwatta 2740" }
summary:
  ar: "يروي مالك عن سمي مولى أبي بكر عن القعقاع بن حكيم أن كعب الأحبار قال: لولا كلمات أقولهن لجعلتني يهود حمارا. فقيل له: وما هن؟ فقال: أعوذ بوجه الله العظيم الذي ليس شيء أعظم منه، وبكلمات الله التامات، وبأسماء الله الحسنى كلها ما علمت منها وما لم أعلم، من شر ما خلق وبرأ وذرأ. {cite:muwatta-maruf-1997 p.541} {cite:muwatta-maruf-1997 p.542}"
