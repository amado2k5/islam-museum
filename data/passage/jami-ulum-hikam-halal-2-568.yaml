text: "… الخشني يقول : قلتُ : يا رسول اللّٰه، أخبرني ما يحلُّ لي وما يحرُمُ عليَّ، فقال : البرُّ ما سَكَنَتْ إليه النَّفسُ، واطمأنَّ إليه القلبُ، والإثم ما لم تسكن إليه النَّفسُ، ولم يطمئنَّ إليه القلب، وإنْ أفتاك المفتون، وهذا أيضاً …"
summary:
