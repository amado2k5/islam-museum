text: "… فدافع، وانحاز، وتُحُيِّزَ عنه، ثم انصرف بالنّاس. وقال حمّاد بن زيد، عن أيوب، عن حُمَيْد بن هلال، عن أَنَّس قال: نَعَى النبي جعفراً، وزيدَ بنَ حارثة، وابنَ رَواحة، نعاهم قبل أن يجيء خبرهم، وعيناه تذرفان. أخرجه البخاري، وزاد فيه: فَنّعَاهم، …"
summary:
  ar: "مقطع من سير أعلام النبلاء، المجلد المصوَّر 1، ص 257، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Siyar A'lam al-Nubala', scan volume 1, p. 257, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "سیر اعلام النبلاء، اسکین جلد 1، ص 257 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
