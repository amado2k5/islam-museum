text: "… إلى غيره. وقد ظن بعض الناس أن التوكل ينافى الاكتساب وتعاطى الأسباب وأن الأمور إذا كانت مقدرة فلا حاجة إلى الأسباب، وهذا فاسد، فإن الاكتساب منه فرض ومنه مستحب ومنه مباح ومنه مكروه ومنه حرام، كما قد عرف فى موضعه، …"
