summary:
  ar: "القسم 24 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب اللباس»، ويضم فيها النصوص من 1720 إلى 1787 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 24 of Jami' al-Tirmidhi (The Book on Clothing) in the division of the open hadith dataset the museum took its reports from: reports 1720 to 1787 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 24، عنوان «کتاب اللباس»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1720 تا 1787۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 24 de Jami' al-Tirmidhi (El libro sobre la vestimenta) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1720 al 1787, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 24 de Jami' al-Tirmidhi (Le Livre du vêtement), qui comprend les hadiths 1720 à 1787 selon la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Cami' el-Tirmizi'nin 24. bölümü \"Giysiler Kitabı\" başlığını taşımakta olup, 1720 ile 1787 yılları arasındaki metinleri sırasıyla numaralandırarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 24 dari Jami' al-Tirmidhi, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pakaian\" dan berisi teks-teks dari tahun 1720 hingga 1787, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
