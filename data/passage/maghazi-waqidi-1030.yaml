text: "هذا كتاب من محمد رسول اللاه لاكيدر حين اجاب الي الاسلام وخلع الانداد والاصنام ، مع خالد ابن الوليد سيف الله ، في دومة الجندل واكنافها . وان لنا الضاحية⁦(١)⁩ من الضحل ، والبور ، والمعامي ، واغفال الارض ، والحلقة"
summary:
