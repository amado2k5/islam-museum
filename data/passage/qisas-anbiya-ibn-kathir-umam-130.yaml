text: "… كما سيأتى فى قصة أهل مدين أصحاب الأيكة فإنه اجتمع عليهم أنواع من العقوبات، ثم لا خلاف أن عاداً قبل ثمود. والمقصود أن عاداً كانوا جفاة كافرين، عتاة متمردين فى عبادة الأصنام، فأرسل اللّٰه فيهم رجلًا منهم يدعوهم إلى اللّٰه …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 130، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
