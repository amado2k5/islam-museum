label: { ar: "سنن ابن ماجه 2006 — النسب والانتساب", en: "Sunan Ibn Majah 2006 — paternity and lineage", ur: "سنن ابن ماجہ 2006 — نسب اور انتساب", es: "Sunan Ibn Majah 2006 - paternidad y linaje" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ـ قَالَ \" الْوَلَدُ لِلْفِرَاشِ. وَلِلْعَاهِرِ الْحَجَرُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2006، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2006 (The Chapters on Marriage), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2006، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2006 (Los capítulos sobre el matrimonio), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
