label: { ar: "سنن النسائي 2052 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 2052 — a burial, grave or resting place", ur: "سنن نسائی 2052 — تدفین، قبر اور مرقد", es: "Sunan al-Nasa'i 2052 — un lugar de entierro, tumba o descanso.", fr: "Sunan al-Nasa'i 2052 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sunan an-Nasa'i 2052 — Defin, mezar ve istirahat yeri", id: "Sunan an-Nasa'i 2052 — Pemakaman, kuburan, dan tempat peristirahatan" }
text: "… خَالِدٌ، عَنْ شُعْبَةَ، قَالَ أَخْبَرَنِي جَامِعُ بْنُ شَدَّادٍ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ يَسَارٍ، قَالَ كُنْتُ جَالِسًا وَسُلَيْمَانُ بْنُ صُرَدٍ وَخَالِدُ بْنُ عُرْفُطَةَ فَذَكَرُوا أَنَّ رَجُلاً، تُوُفِّيَ مَاتَ بِبَطْنِهِ فَإِذَا هُمَا يَشْتَهِيَانِ أَنْ يَكُونَا شُهَدَاءَ جَنَازَتِهِ فَقَالَ أَحَدُهُمَا لِلآخَرِ أَلَمْ يَقُلْ رَسُولُ اللَّهِ \" مَنْ يَقْتُلْهُ بَطْنُهُ فَلَنْ يُعَذَّبَ فِي قَبْرِهِ \". فَقَالَ الآخَرُ بَلَى."
summary:
  ar: "حديث في سنن النسائي، رقم 2052، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2052 (The Book of Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2052، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2052 (El Libro de los Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un verset du Sunan al-Nasa'i, n° 2052 (Le Livre des Funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sunan-ı Nesai'de 2052 numaralı hadis, defin, mezar ve türbeden bahsetmektedir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 2052, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
