label: { ar: "الموطأ 103 — عروة: من مس ذكره وجب عليه الوضوء", en: "Muwatta 103", es: "Muwatta 103", fr: "Muwatta 103", ur: "موطا 103", tr: "Al-Muwatta 103 — Urwah: Her kim cinsel organına dokunursa abdest almalıdır.", id: "Al-Muwatta 103 — Urwah: Barangsiapa menyentuh kemaluannya, wajib berwudhu." }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه عروة بن الزبير أنه كان يقول: من مس ذكره فقد وجب عليه الوضوء؛ وهو في باب الوضوء من مس الفرج. ويذكر المحقق رواية الطحاوي من طريق هشام عن أبيه أن مروان سأله عن مس الذكر فقال: لا وضوء فيه، أي قبل أن يبلغه حديث بسرة، ورواية الدارقطني عن هشام أن أباه كان يقول بوجوب الوضوء منه. {cite:muwatta-maruf-1997 p.86}"
  tr: "Malik'in Hişam ibn Urve'den, onun babası Urve ibn el-Zübeyr'den rivayet ettiği bir hadiste, Hişam ibn Urve'nin şöyle dediği belirtilir: \"Kim cinsel organına dokunursa abdest almalıdır.\" Bu, cinsel organlara dokunduktan sonra abdest alınmasıyla ilgili bölümde yer almaktadır. Araştırmacı ayrıca, Hişam'dan, onun babasından rivayet ettiği, el-Tahavi'nin de aktardığı bir rivayete göre, Mervan'ın ona cinsel organa dokunmak hakkında sorduğu soruyu, onun da \"Bunun için abdest gerekmez\" diye cevap verdiğini belirtir. Bu, Busra hadisi ona ulaşmadan önceydi. El-Daraqutni de Hişam'dan, babasının cinsel organa dokunduktan sonra abdest alınması gerektiğini söylediğini rivayet eder. {cite:muwatta-maruf-1997 s.86}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Hisham ibn Urwah, dari ayahnya Urwah ibn al-Zubayr, menyatakan bahwa beliau biasa berkata: \"Siapa pun yang menyentuh kemaluannya wajib berwudhu.\" Hal ini terdapat dalam surah tentang wudhu setelah menyentuh kemaluan. Peneliti juga menyebutkan riwayat al-Tahawi, dari Hisham, dari ayahnya, bahwa Marwan bertanya kepadanya tentang menyentuh kemaluan, dan beliau menjawab: \"Tidak diperlukan wudhu untuk itu.\" Ini sebelum hadits Busrah sampai kepadanya. Al-Daraqutni juga meriwayatkan dari Hisham bahwa ayahnya biasa berkata bahwa wudhu diperlukan setelah menyentuh kemaluan. {cite:muwatta-maruf-1997 p.86}"
