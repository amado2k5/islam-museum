label: { ar: "الموطأ 103 — عروة: من مس ذكره وجب عليه الوضوء", en: "Muwatta 103" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه عروة بن الزبير أنه كان يقول: من مس ذكره فقد وجب عليه الوضوء؛ وهو في باب الوضوء من مس الفرج. ويذكر المحقق رواية الطحاوي من طريق هشام عن أبيه أن مروان سأله عن مس الذكر فقال: لا وضوء فيه، أي قبل أن يبلغه حديث بسرة، ورواية الدارقطني عن هشام أن أباه كان يقول بوجوب الوضوء منه. {cite:muwatta-maruf-1997 p.86}"
