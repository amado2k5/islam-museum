text: |-
  ١٧٣
  الحكل مالايسمع لهصوت وقال ١
  لو كنت قد أوتيت علم الحمكل • علم سلمان كلام النمل • كنت رهين هرم أوقتل
  ويقال فى لسانه حكلة أى عجمة لا يبين الكلام قال الفراء قد أحكل على الخبر أى أشكل
  واحتكل أى اشتكل والحنكل القصير اللتيم قال الاخطل
  فكيف تساميى وأنت معلهيج *هذارمة جعد الانامل حكل
  حلل حلات العقدة أحلها حلاقتحتها فا نحلت يقال ياعاقد اذ كرحلا وحلّ بالمكان
  حلا وحاولا ومحلا والمحل أيضا المكان الذى تحله وحللت القوم وحللت بهم بمعسنى والحل
  دهن السمسم والحل بالكسر الحلال وهوضد الحرام وأما الحلال فى قول الرامى
  وعيرنى تلك الحلال ولم يكن ليجعلها لا بن الخبينة خالقه
  فهو لقب رجل من بنى غيرورجل حل من الاحرام أى حلال يقال أنت حل وأنت حرم
  والح-ل أيضاماجاوز الحرم ويقال أيضاحلا أى استنن وياحالف اذكرحلا وقوم حلة أى
  نزول وفيهم كثرة قال الشاعر ( ٣
  لقد كان فى شيبان لو كنت عالما * قباب وحى حلة ودراهم
  وكذلك حىّ حلال قال زهبر
  نحى" حلال يعصم الناس أمرهم * اذا طرقت احدى الليالى بعظم
  وأتاقول الاعشى كا نها لم تلقستة أشهر * ضرا اذاوضعت اليك حلالما
  فيقال هومتاع رحل البعير ويروى بالجيم والحلة أيضاءصدرقولا حل الهدى ويقال أيضا
  هو فى حلة صدق أى بعملة صدق. والمحلة منزل القوم ومكان محلال أى يحل به الناس كثيرا
  وقوله تعالى حتى يداخ الهدى محله هو الموضع الذى ينحرفيه ومحسل الدين أيضا أجله قال
  أبو عبي-د الحلل برود المن والحلة ازارورداء لاتسمى حلة حتى تسكون ثوبين والحليل الزوج
  والحليلة الزوجة قال عنترة
  وحليل غانية زكت مجدّلا ,ل، تمكوفر بضته كشدق الاعلم
  ويقال أيضاهذا حليله وهذه حايلمته لإن يحاله فى دارواحدة وقال
  واست بأطلس الثوبين يصبى • حلية اذاحدأ النيام
  يعنى بارته والاحليل مخرج البول ومخرج اللبن من الضرع والثدى وحل لك الشي يحل -لا
  وحلالا وهو حلّ بلّ أى طلق وحل انحرم يحل حلالا وأحل بعنى وحل الهدى يحل حلة
  وحاولا أى بلغ الموضع الذى يح-ل فيه نحره وحسل العذاب يحل بالصكسر أى وحب
  ويحل بالضم أى نزل وقرى به ماقوله تعالى فيحل عليكم غضى وأمّنقوله تعالى أو تحل قسر با
  من دارهم فبالضم أى تنزل وحل الدين يحل حاولا وحلت المسرأة أى خرجت من عدتها
  وأماقول الشاعر ٤
  فاحلّ من جهل حبى حلماتنا * ولا قائل المعروف فينا يعنف
  أراد حلّ على مالم يسمّ قاعله فطرح كسرة اللام الاولىء-لى الحاء قال الاخفس سمعنا من
  رؤية اه
  تول وء رفى الاته فى إ الي
  الابل اه
  ٣ نسيخة زيادة الاعشي ١ه
  ٤ ى نسيخة زيادة الفرز دق اه.
