label: { ar: "صحيح مسلم 2735 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 2735 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 2735 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 2735 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 2735 — mentions de nations, de religions et de peuples non musulmans" }
text: "وَحَدَّثَنِيهِ مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا مُحَمَّدُ بْنُ بَكْرٍ، أَخْبَرَنَا ابْنُ جُرَيْجٍ، بِهَذَا الإِسْنَادِ وَقَالَ إِنَّ أَبَا الْعَبَّاسِ الشَّاعِرَ أَخْبَرَهُ. قَالَ مُسْلِمٌ أَبُو الْعَبَّاسِ السَّائِبُ بْنُ فَرُّوخَ مِنْ أَهْلِ مَكَّةَ ثِقَةٌ عَدْلٌ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2735، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2735 (The Book of Fasting), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 2735، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 2735 (El Libro del Ayuno), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih Muslim, n° 2735 (Le Livre du jeûne), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
