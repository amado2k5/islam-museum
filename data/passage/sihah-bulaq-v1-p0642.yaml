  يمب منها كان يلزم له ٢٨ فصلافيباع مجموعها ٧٥٦ لكن لم يكمل عدد الفصول الا
  فى خسة أبواب فقط وشى باب الالف المهموزة واللام والميم والنون وباب الممل يبق ٢٢
  بابافواقص ٢٤ إنتهامدنتص منه واحد وه وباب الراءسقط منمفصل اللام ومنهامانص
  منه فصلان وهى أربعة أبواب البا والتاو الدال والقاف ومنها ماسقطعه ثلاثة فصول وهى
  أربعة أبواب أيضا الجيم والطاوالسيز والفا ومنها ماسقط منه خسة فصول وهماباب انلحا
  والدين ومنهامانقص منه ٦ فصول وهمابابا التا والزاى ومنها مانقص ٢ وهمايايا إلحا
  والصاد المهملتين ومنهامانقص ٨ وهوباب الذال المهجمة فقط ومنها مانقص ٩ فصول.
  وهى ثلاثة أبواب الغين المههمة والكاف وللها ومنها ما نتص هشرة فصول وهمابابا الشين
