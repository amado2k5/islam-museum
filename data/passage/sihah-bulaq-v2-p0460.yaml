text: |-
  ١٢٧
  شبه الجنون ومنه قول الشاعر لعمرك بى من حبة أسماء أواق* وقال الاعشى يصف ناقته
  وتصبح عن غبّ السرى وكانما * ألمّ بها من طائف الجن أواق
  وهو أفعل لانهسم قالوا ألق الرجل فه ومألوق على مقعول ويقال أيضامؤواق مثال معولق
  فان جعلته من هذاذه و فوعل ⁦(ومق)⁩ المقة المحبة والهاءعوض من الواو وقد ومقه يمقه
  بالكسرفيهما أى أحبه فهو وامق هق الوهق بالتحريك حبل كالطول وقد يسكن
  ثل نمرونهر قال أبوعمر والمواهقة منسل المواغدة والمواضخة ومواهقة الابل مدّ آعناقه-
  فى السمريقال تواهقت الركاب أى تسارت وهذه الناقة نواهق هذه كان ا تساريهافى السم
  فال ابن آحر
  وتواهقت أخفافها طبقا ، والظللم يفضل ولم بكر
  والهبانيق قيام معهم • كل ملثوم اذاصبت حمل
  والهبنقة لقب رجل يقال له ذوالودعات واممه يزد بن تروان أحدبنى قيس بن تعلبة وكان
  يضرب به المثل فى الحمق قال الشاءر
  عش بجدّوكن هبنقة القيت سىّ أومثل شيبة بن الوليد
  (هبرق الهبرقى بالكسر الحدّاد والصائع قال النسابغة يسنتورا
  ذالهبرقىّ تتحى ينفخ الفهما • يقول أكب فى كناسه يحفر أصل الشجرة كالسائغ اذا
  أن الشامر • لإ-وأسمة مثل المرق ابلل الهر والعافة فاريية موب والج امهاء
  هراقة أى صبه وأصله أراق يريق اراقة وأصل أراق أريق وأصسل بريق يريق وأصل يريق
  يؤديق وائما قالوا أنا أهريقه وهم لاية ولون أنا أأريقه لاستثقالهم الهسمزتين وقد زال ذلكْ
  بعسد الابدال وفيه لغة أخرى أهرق الماءيهرقسه اهراقا على أفعل يفعل قال سيبويه وقد
  أبدلوا من الهمزة الهاء ثم ألزمت قصارت كانخها من نفس الحرف تم أدخلت الالف بعد
  على الهاءوتركت الهاءعوضا من حذفهم حركة العيز لاتَ أصل أهرف أريق وفيه لغة ثالثة
  أهراق يهريق اهراقا فهو مهريق والشئ مهراق ومهراق أيضا بالتحريك وهذا شاذ ونظيره
  أسطاع يسطيع اسطيما عابفتح الالف فى الماضى وضم الياء فى المستقبل لغة فى أطاع يطيع
  فجعلوا السين عوضا من ذهاب حركة عين الفعل على ماذكرناء عن الاخفش فى باب العين
  فكذلك سكم الهاءعندى وفى الحديث أهر يق دمه وتقدير يهر يق بفتح الهاعيهفعل وتقدير
  مهراق بالتحويك مهفعل وأماتة -دير يهريق بالتسكين فلايمكن أن ينعاق بدلان الهاء والفاء
  معاسا كان وكذلك تقسدير مهراق وحكى بعضهم مطرمهرورق، هزق ، أهزق الرجل
  فى الضحك أى أكثرمنه والمهزاق المرأة الكثيرة الفصك والهزق الرعد الشديد، هقق
  قال الاصحعى الهقهقة مثل الحقعقة وهى السير الشديد وقد هقهق الرجسل مثل حقسق
  وأنشدارؤية • أقب قهقاه اذا ماهقهقا مق . الهعق من الكلاالهش قال الراجز
  لبابة من همق هيشور ل، ومشى الهمقى اذامشى على جانبم رة وعلى جانب مرة ⁦( يق )⁩
  الهيق الظليم وكذلك الهيقم والميم زائدة
  قول الهبنيق كفندبلى ويفتح .
  وكفنقذ وزنيوروكسعيدع
  وعلابط اه من القاموس
  قوله ذو الودعات لقب به لانه
  جعل فى عنقه قلادة من ودع
  وعظام وخزف مع طول لحميته
  فسئل فقال اثلا أضل ضرقها
  أخوه فى ليسلة وتقلدها فأصبح
  هبدقة ورآها فى عنته فقسال أخى
  أنت أناقن أنااه من القاموس
  قوله والهسزق ككتف وكذلك
  الهمق كماقاله الجد اه
