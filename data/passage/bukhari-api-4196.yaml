label: { ar: "صحيح البخاري 4196 — تربية الأب ووصيته", en: "Sahih al-Bukhari 4196 — the father raising and counselling", ur: "صحیح بخاری 4196 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 4196 — El padre que cría y aconseja", fr: "Sahih al-Bukhari 4196 — l'éducation et les conseils du père", tr: "Sahih el-Buhari 4196 — Babanın Terbiyesi ve Vasiyeti", id: "Sahih al-Bukhari 4196 — Didikan dan Wasiat Ayah" }
text: "… قَالَ سَلَمَةُ رَآنِي رَسُولُ اللَّهِ وَهْوَ آخِذٌ بِيَدِي، قَالَ \" مَا لَكَ \". قُلْتُ لَهُ فِدَاكَ أَبِي وَأُمِّي، زَعَمُوا أَنَّ عَامِرًا حَبِطَ عَمَلُهُ. قَالَ النَّبِيُّ \" كَذَبَ مَنْ قَالَهُ، إِنَّ لَهُ لأَجْرَيْنِ ـ وَجَمَعَ بَيْنَ إِصْبَعَيْهِ ـ إِنَّهُ لَجَاهِدٌ مُجَاهِدٌ قَلَّ عَرَبِيٌّ مَشَى بِهَا مِثْلَهُ \". حَدَّثَنَا قُتَيْبَةُ حَدَّثَنَا حَاتِمٌ قَالَ \" نَشَأَ بِهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4196، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4196 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4196، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4196 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4196 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le rôle du père dans l'éducation et le soutien des enfants. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sahih el-Buhari'de 4196 numaralı hadis, babanın yetiştirilmesi ve öğütlerinden bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4196, menyebutkan tentang didikan dan nasihat seorang ayah. Situs web \"Kebapakan dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
