text: "… مجربُ إذا الليوثُ أقبلت تلهَّبُ وأحجمت عن صولة المغلَّب فقال عليُّ : أنا الذي سمَّتهُ أمي حيدرة كليث غاباتٍ شديد القسورة أكيلهم بالصاع كيل السندرة فاختلفا ضربتين فبدره علي بضربة فقد الحجر والمغْفَرَ ورأسه ووقع في وهو الصداع وراجع الطب …"
