text: "ما تنازعنا فيه إلى كتاب الله وسنة رسوله كما أمرنا الله بذلك في كتابه بقوله : ( فإن تنازغتم في شيء فردوه إلى الله والرسول ) فإن الرد إليهما أهدى لنا ولكم من الرد إلى ما قاله أسلافكم ودرج عليه"
