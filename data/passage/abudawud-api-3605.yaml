label: { ar: "سنن أبي داود 3605 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Sunan Abi Dawud 3605 — a testament or parting counsel; a deathbed and last hours", ur: "سنن ابی داؤد 3605 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات", es: "Sunan Abi Dawud 3605 — un testamento o consejo de despedida; un lecho de muerte y últimas horas", fr: "Sunan Abi Dawud 3605 — un testament ou des conseils d'adieu; un lit de mort et les dernières heures", tr: "Sunan Abi Dawud 3605 — Ölüm anında yapılan son vasiyetname.", id: "Sunan Abi Dawud 3605 — Surat wasiat terakhir, pada saat kematian" }
text: "… زَكَرِيَّا، عَنِ الشَّعْبِيِّ، أَنَّ رَجُلاً، مِنَ الْمُسْلِمِينَ حَضَرَتْهُ الْوَفَاةُ بِدَقُوقَاءَ هَذِهِ وَلَمْ يَجِدْ أَحَدًا مِنَ الْمُسْلِمِينَ يُشْهِدُهُ عَلَى وَصِيَّتِهِ فَأَشْهَدَ رَجُلَيْنِ مِنْ أَهْلِ الْكِتَابِ فَقَدِمَا الْكُوفَةَ فَأَتَيَا أَبَا مُوسَى الأَشْعَرِيَّ فَأَخْبَرَاهُ وَقَدِمَا بِتَرِكَتِهِ وَوَصِيَّتِهِ. فَقَالَ الأَشْعَرِيُّ هَذَا أَمْرٌ لَمْ يَكُنْ بَعْدَ الَّذِي كَانَ فِي عَهْدِ رَسُولِ اللَّهِ. فَأَحْلَفَهُمَا بَعْدَ الْعَصْرِ بِاللَّهِ مَا خَانَا وَلاَ كَذِبَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3605، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3605 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3605، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3605 (El Oficio del Juez (Kitab Al-Aqdiyah)), menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 3605 (Le Bureau du Juge (Kitab Al-Aqdiyah)), mentionne un testament ou des conseils d'adieu, le lit de mort et les dernières heures. Le Navigateur de Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 3605 numaralı hadis, vasiyetname ve ölüm anından bahsetmektedir. Bu hadis, vasiyetnameler, miras, tarihi kayıtlar ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3605, menyebutkan wasiat terakhir dan saat kematian. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, catatan sejarah, dan makam suci, bersama dengan teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
