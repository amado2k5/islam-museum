text: "… بثر ثمود الإبل. في أمره بعلف الإبل العجين دليل على جواز حمل الرجل النجاسة إلى كلابه ليأكلوها. الدليل على التبرك بآثار الأنبياء والصالحين. ما جاء من النهي عن الصلاة في بعض المواضع. جواز التيمم على مقبرة المشركين إذا كان الموضع …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 4233، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 4233, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 4233 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Qurtubi, al-Jami' li-Ahkam al-Qur'an, volumen 3, pág. 4233, que menciona una reliquia conservada tras su dueño, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Coran d'al-Qurtubi (al-Jami' li-Ahkam al-Qur'an), volume 3, page 4233, mentionnant une relique conservée après son propriétaire, une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin 3. cildinin 4233. sayfasında, korunmuş bir eser, bir mezar yeri, bir türbe ve bir mabetten bahsedilmektedir; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, eserler ve mabetler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Qurtubi, Al-Jami' li-Ahkam al-Qur'an, Volume 3, halaman 4233, menyebutkan sebuah artefak yang terpelihara, sebuah situs pemakaman, sebuah kuburan, dan sebuah tempat suci; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, artefak, dan tempat suci."
