text: "… فيها من الأمثالِ الدوالِّ على ظاعته، المبيِّنّةِ لاجتناب معصيتِهِ. وَتَرْكُ الغفلة عن الحظّ، والازديادُ من نوافِلِ الفَضْلِ. فالواجبُ على العالمينَ أن لا يقولوا إِلامن حيثُ عَلِمُوا. - وقد تَكَلَّم فى العلمِ مَنْ لَوْ أَمْسَكَ عن بعضِ ما تَكَلَّمَ فيه منه …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 156، يرد فيه ذكر الواجب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 156, whose wording mentions the obligatory (wajib), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 156 کا اقتباس جس میں واجب، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 156, dont le texte mentionne l'obligatoire (wajib), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 156, cuyo texto menciona lo obligatorio (wajib), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi 156. sayfasından, farz, nafile ve gönüllü amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari risalah Al-Shafi'i, halaman 156, yang menyebutkan amalan wajib, amalan sunnah, dan amalan sukarela; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
