text: |-
  ⁦(كيد)⁩
  ٢٥٧
  والكردبالضم جيل من الناس وهم إلاكرادوالسكرديدة بالكسر مايبقى فى أسفل الجلة من
  جاتبيها من التمر قال الواجز
  وأصلت قدر الها بأطسرم • وأطعمت كرديدة وقدره • من ترها واعلوطت بسحره
  والجمع الكراديد قال الشاعر
  القاعدات فلايعن ضيفكم * والآكلات بقيات الكراديد
  ( كد كدالشى كسادافهو كاسدوكيدوساعة كاسدة و-وق كاسديلاهاء
  وأكسد الرجل أى كسدت سوقه وقول الشاءر معاوية بن مالك.
  اذ كل حى نابت بأرومة * نيت العضامفا جدوكسيد
  اى دون
  ( كاد الكاد المكان الصلب من غسبر حصى والكلدة قطعة من الأرض غليظة وكذلك
  الكاندى والمكاندد الصلب واكاندى البعير اذاغلظ واشتد مثل اعلندى وكادة اسم
  أرجل (كد الكمد الحزن المكتوم تقول منه كد الرجل فهوكند وكيد والكمدة
  تغير اللون وأكد القصار الثوب اذالم ينقه وتكميد العضو تسخينه بخرق ونحوها وكذلك
  لكماد بالكسر وفى الحديث الكاد أحب الى من الكن" ⁦(€ لكند)⁩ كند كنودا
  أى كفر النعمة فهوكنود وامرأة كنودأ يضاوكندمث له وأرض كنودلا تنيت شيئا
  وكندمأى قطعه قال الاعشى أميطى تيطى بصلب الفؤاد • وصول حبال وكنادها
  وكندة أبو حة من المن وهو كندة بن ثور ( كنعد الكنعد ضرب من سمك
  البحر قال جرير كانوا اذاجعلوا فى صيرهم يصلاً • ثم اشتووا كنعدامن مالح جدفوا
  ⁦( كود )⁩ كاديفعل كذا يكاد كوداومكادة أى قارب ولم يفعل وحكى سيبويه عن بعض
  لعرب كدت أفعل كذا بضم الكاف قال وجتثنى أبو الخطاب أن ناسامن العرب يقولون
  كدز يديفعل كذاومازيل يفعل كذايريدون كادوزال فنقاوا الكسر الى السكاف فى فعل
  كما نقلوا فى فعلت وزعم الاصمعى أنه سمع من العرب من يقول لا أفعل ذلكْ ولا كؤذا فجعلها
  من الواووقديد خلون عليها أن تشبيها بعسى قال رؤية قد كاد من طول البلى أن يصها
  وقولهم عرف فلان ما يكاد منه أى ما يراد منه ويقال لامهمة لى ولا مكادة أى لا أهسم ولا
  أكادو تقول لمن يطلب منك الشىء فلاتر يداعطاءملا ولامكادة وكاد وضعت اقارية الشى
  فعل أو لم يفسعل فجرده يني عن تفي الفعل ومقرونه بالحمد يني عن وقوع الفعل قال بعضهم
  فى قوله تعالى أكاد أخفيها أريد أخفيها قال فكلياز أن يوضع أريد موضع أكاد
  فى قوله تعالى حدار ايريد أن ي.قض فكذلك أكادوأزشد الاخفس
  كادت وكدت وتلك خيرارادة * لوعاد من اهوالصبابة مامضى
  ⁦( كهد)⁩ كهد الجبار كهدانا أى عداوأكهدنه أناوا كوهد الفرخ اكرهداد
  وهوارتعاده الى أمه لتزقه ( يد الكيد المكركاده يكيده كيداومكيدة وكذلك
  المكايدة وربماسمى الحرب كيداً يقال غزافلان فلم يلق كيدا وكل شئ تعالحه فأنت
  تكيده ويقال هو يكيد ينفسه أى يجودج اويسمى اجتهاد الغراب فى صباحه كيدا
  وكذلك القى.
  29
  ل
