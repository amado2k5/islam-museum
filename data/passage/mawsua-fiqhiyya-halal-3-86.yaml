text: "… من حج الإسلام لم يلتفت إلى منعه، وإن منعه من حج التطوع لم يجزله الإحرام، فإن أحرم فللوالد تحليله على الأصح عند الشافعية، خلافا للجمهور. ه - ليحرص أن تكون نفقته كثيرة وحلالا خالصة من الشبهة، فإن خالف وحج بمال …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 3، ص 86، يذكر الحلال، وما حُرّم، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 3, p. 86, that mentions the lawful, what was made unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 3، ص 86 کا اقتباس جس میں حلال، جو حرام کیا گیا، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 3, pág. 86, que menciona lo lícito, lo ilícito y los asuntos dudosos; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation, volume 3, p. 86) mentionnant ce qui est licite, ce qui a été déclaré illicite et les points litigieux; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 3, sayfa 86'dan, izin verilenler, yasak olanlar ve şüpheli konuları ele alan bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 3 Bergambar, halaman 86, yang membahas tentang apa yang diperbolehkan, apa yang dilarang, dan hal-hal yang menimbulkan keraguan; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
