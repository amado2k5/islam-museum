label: { ar: "الموطأ 2072 — مالك: لا يجوز للذي ساقى أن يشترط على رب المال رقيقا يعمل بهم في الحائط، ولا ينبغي لرب المال أن يشترط على الذي دخل في ماله أن يأخذ من رقيق المال أحدا يخرجه من المال، فإن مات أحد من الرقيق أو غاب أو مرض فعلى رب المال أن يخلفه", en: "Muwatta 2072", es: "Muwatta 2072", fr: "Muwatta 2072", ur: "موطا 2072", tr: "El-Muvatta 2072 — Malik: Ortakçılık anlaşması yapanın, toprak sahibinin bahçede çalışacak köle sağlamasını şart koşması caiz değildir; toprak sahibi de, arazisine giren kişinin kölelerinden birini alıp götürmesini şart koşamaz. Kölelerden biri ölür, kaybolur veya hastalanırsa, toprak sahibi onun yerine yenisini almalıdır.", id: "Al-Muwatta 2072 — Malik: Tidak diperbolehkan bagi orang yang mengadakan perjanjian bagi hasil untuk menetapkan bahwa pemilik tanah menyediakan budak untuk bekerja di kebun, dan pemilik tanah juga tidak boleh menetapkan bahwa orang yang memasuki tanahnya mengambil salah satu budak dari tanah tersebut untuk mengeluarkannya dari tanah. Jika salah satu budak meninggal, menghilang, atau sakit, maka pemilik tanah wajib menggantinya." }
summary:
  ar: "قال مالك: ولا يجوز للذي ساقى أن يشترط على رب المال رقيقا يعمل بهم في الحائط، ليسوا فيه حين ساقاه إياه. قال مالك: ولا ينبغي لرب المال أن يشترط على الذي دخل في ماله بمساقاة، أن يأخذ من رقيق المال أحدا يخرجه من المال، وإنما مساقاة المال على حاله الذي هو عليه. قال: فإن كان صاحب المال يريد أن يخرج من رقيق المال أحدا فليخرجه قبل المساقاة، أو يريد أن يدخل فيه أحدا فليفعل ذلك قبل المساقاة، ثم يساقي بعد ذلك إن شاء. قال: ومن مات من الرقيق أو غاب أو مرض، فعلى رب المال أن يخلفه. {cite:muwatta-maruf-1997 p.247}"
  tr: "Malik şöyle dedi: Ortakçı, araziyi edindiği sırada mevcut olmayan kölelerin bahçede çalıştırılmasını arazi sahibinin şart koşması caiz değildir. Malik ayrıca şunları söyledi: Arazi sahibinin, ortakçılık anlaşmasına giren kişinin kölelerden herhangi birini araziden almasını ve ortakçılık anlaşmasından çıkarmasını şart koşması uygun değildir. Aksine, ortakçılık anlaşması arazinin mevcut mülkiyetine dayanmalıdır. Şöyle dedi: Arazi sahibi kölelerden herhangi birini çıkarmak isterse, bunu ortakçılık anlaşması kurulmadan önce yapmalıdır. Benzer şekilde, araziye köle eklemek isterse, bunu anlaşma kurulmadan önce yapmalı ve daha sonra isterse ortakçılık anlaşmasına girebilir. Şöyle dedi: Kölelerden herhangi biri ölürse, kaybolursa veya hastalanırsa, arazi sahibi onlara bakmakla yükümlüdür."
  id: "Malik berkata: Tidak diperbolehkan bagi petani penggarap untuk menetapkan bahwa pemilik tanah harus menyediakan budak untuk bekerja di kebun jika budak tersebut tidak ada ketika petani penggarap memperoleh tanah tersebut. Malik juga berkata: Tidak pantas bagi pemilik tanah untuk menetapkan bahwa orang yang telah membuat perjanjian bagi hasil harus mengambil salah satu budak dari tanah tersebut dan mengeluarkannya dari perjanjian bagi hasil. Sebaliknya, perjanjian bagi hasil harus didasarkan pada kepemilikan tanah yang ada. Beliau berkata: Jika pemilik tanah ingin mengeluarkan salah satu budak, ia harus melakukannya sebelum perjanjian bagi hasil dibuat. Demikian pula, jika ia ingin menambahkan budak ke tanah tersebut, ia harus melakukannya sebelum perjanjian dibuat, dan kemudian ia dapat membuat perjanjian bagi hasil setelahnya jika ia menginginkannya. Beliau berkata: Jika salah satu budak meninggal, menghilang, atau sakit, pemilik tanah wajib menafkahi mereka."
