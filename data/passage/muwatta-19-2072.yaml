label: { ar: "الموطأ 2072 — مالك: لا يجوز للذي ساقى أن يشترط على رب المال رقيقا يعمل بهم في الحائط، ولا ينبغي لرب المال أن يشترط على الذي دخل في ماله أن يأخذ من رقيق المال أحدا يخرجه من المال، فإن مات أحد من الرقيق أو غاب أو مرض فعلى رب المال أن يخلفه", en: "Muwatta 2072" }
summary:
  ar: "قال مالك: ولا يجوز للذي ساقى أن يشترط على رب المال رقيقا يعمل بهم في الحائط، ليسوا فيه حين ساقاه إياه. قال مالك: ولا ينبغي لرب المال أن يشترط على الذي دخل في ماله بمساقاة، أن يأخذ من رقيق المال أحدا يخرجه من المال، وإنما مساقاة المال على حاله الذي هو عليه. قال: فإن كان صاحب المال يريد أن يخرج من رقيق المال أحدا فليخرجه قبل المساقاة، أو يريد أن يدخل فيه أحدا فليفعل ذلك قبل المساقاة، ثم يساقي بعد ذلك إن شاء. قال: ومن مات من الرقيق أو غاب أو مرض، فعلى رب المال أن يخلفه. {cite:muwatta-maruf-1997 p.247}"
