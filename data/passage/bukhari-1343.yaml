label: { ar: "البخاري 1343 — دفن قتلى أحد بدمائهم", en: "Bukhari 1343 — The Uhud dead buried in their blood" }
text: "كان النبي يجمع بين الرجلين من قتلى أحد في ثوب واحد ثم يقول: «أيهم أكثر أخذاً للقرآن؟» فإذا أُشير له إلى أحدهما قدّمه في اللحد، وقال: «أنا شهيد على هؤلاء يوم القيامة»، وأمر بدفنهم في دمائهم ولم يغسلوا ولم يصل عليهم"
summary:
  ar: "في كتاب الجنائز؛ رواية جابر بن عبد الله في دفن شهداء أحد اثنين اثنين في ثوب واحد، وتقديم أكثرهما أخذاً للقرآن في اللحد، ودفنهم بدمائهم بلا غسل ولا صلاة. وهو من أثبت نصوص فضل شهداء أحد وأحكامهم."
