label:
  ar: "النسائي 1280 — قال الله على لسان نبيه: سمع الله لمن حمده"
  en: "Nasa'i 1280 — God said on the tongue of His prophet: God hears whoever praises Him"
  ur: "نسائی 1280 — اللہ نے اپنے نبی کی زبان پر فرمایا: اللہ نے سن لی جس نے اس کی حمد کی"
text: "إذا قمتم إلى الصلاة فأقيموا صفوفكم ثم ليؤمكم أحدكم فإذا كبر فكبروا وإذا قال ولا الضالين فقولوا آمين يجبكم الله ثم إذا كبر وركع فكبروا واركعوا فإن الإمام يركع قبلكم ويرفع قبلكم . قال نبي الله فتلك بتلك وإذا قال …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 1280: قال الله على لسان نبيه: سمع الله لمن حمده. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 1280: God said on the tongue of His prophet: God hears whoever praises Him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 1280: اللہ نے اپنے نبی کی زبان پر فرمایا: اللہ نے سن لی جس نے اس کی حمد کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
