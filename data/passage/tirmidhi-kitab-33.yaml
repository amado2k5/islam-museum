summary:
  ar: "القسم 33 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفتن عن رسول الله»، ويضم فيها النصوص من 2158 إلى 2269 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 33 of Jami' al-Tirmidhi (Chapters On Al-Fitan) in the division of the open hadith dataset the museum took its reports from: reports 2158 to 2269 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 33، عنوان «کتاب الفتن عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2158 تا 2269۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 33 de Jami' al-Tirmidhi (Capítulos sobre Al-Fitan) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2158 al 2269, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
