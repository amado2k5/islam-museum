label:
  ar: "صحيح البخاري، كتاب الاعتكاف"
  en: "Sahih al-Bukhari, Book 33: Retiring to a Mosque for Remembrance of Allah (I'tikaf)"
  ur: "صحیح بخاری، کتاب الاعتکاف"
  es: "Sahih al-Bukhari, Libro 33: Retirarse a una mezquita para recordar a Allah (I'tikaf)"
  fr: "Sahih al-Bukhari, Livre 33: Se retirer dans une mosquée pour se souvenir d'Allah (I'tikaf)"
summary:
  ar: "القسم 33 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاعتكاف»، ويضم فيها النصوص من 2025 إلى 2046 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 33 of Sahih al-Bukhari (Retiring to a Mosque for Remembrance of Allah (I'tikaf)) in the division of the open hadith dataset the museum took its reports from: reports 2025 to 2046 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 33، عنوان «کتاب الاعتکاف»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2025 تا 2046۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 33 de Sahih al-Bukhari (Retiro a una mezquita para el recuerdo de Alá (I'tikaf)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2025 al 2046 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih al-Bukhari (Livre 33, « Le Retraite à la mosquée pour le souvenir d'Allah (I'tikaf) »), dans la base de données ouverte: il s'agit des hadiths numérotés de 2025 à 2046. Le musée classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
