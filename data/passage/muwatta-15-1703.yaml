label: { ar: "الموطأ 1703 — عمر بن الخطاب عن سعيد بن المسيب: المرأة المطلقة التي حاضت حيضة أو حيضتين ثم رفعتها حيضتها تنتظر تسعة أشهر، فإن بان بها حمل فذلك، وإلا اعتدت ثلاثة أشهر", en: "Muwatta 1703", es: "Muwatta 1703", fr: "Muwatta 1703", ur: "موطا 1703", tr: "El-Muvatta 1703 — Ömer ibn el-Hattab, Said ibn el-Musayyab'dan rivayetle: Bir veya iki adet dönemi geçirdikten sonra adet kanaması kesilen boşanmış bir kadın dokuz ay beklemelidir. Hamilelik belirginleşirse, o zaman durum böyledir; aksi takdirde üç ay bekleme süresine uymalıdır.", id: "Al-Muwatta 1703 — Umar ibn al-Khattab, berdasarkan riwayat Saeed ibn al-Musayyab: Seorang wanita yang bercerai yang telah mengalami satu atau dua siklus menstruasi dan kemudian menstruasinya berhenti, hendaknya menunggu selama sembilan bulan. Jika kehamilan terlihat, maka itu adalah kehamilan; jika tidak, ia harus menjalani masa iddah selama tiga bulan." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد وعن يزيد بن عبد الله بن قسيط الليثي عن سعيد بن المسيب أنه قال قال عمر بن الخطاب أيما امرأة طلقت فحاضت حيضة أو حيضتين، ثم رفعتها حيضتها، فإنها تنتظر تسعة أشهر، فإن بان بها حمل فذلك، وإلا اعتدت بعد التسعة أشهر ثلاثة أشهر، ثم حلت. {cite:muwatta-maruf-1997 p.96}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Yazid ibn Abdullah ibn Qusayt al-Laythi'den, o da Sa'id ibn al-Musayyab'dan rivayetle şöyle buyurmuştur: Ömer ibn al-Khattab dedi ki: Bir kadın boşanmışsa ve bir veya iki adet dönemi geçirmişse, adeti kesildikten sonra dokuz ay beklemelidir. Hamilelik belirginleşirse, bu sorun teşkil etmez. Aksi takdirde, dokuz aydan sonra üç ay daha bekler, sonra yeniden evlenebilir. {cite:muwatta-maruf-1997 s.96}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dan dari Yazid ibn Abdullah ibn Qusayt al-Laythi, dari Sa'id ibn al-Musayyab, bahwa ia berkata: Umar ibn al-Khattab berkata: Jika seorang wanita diceraikan dan mengalami satu atau dua kali haid, kemudian haidnya berhenti, ia harus menunggu sembilan bulan. Jika kehamilan terlihat, maka itu tidak apa-apa. Jika tidak, ia menjalani masa iddah selama tiga bulan setelah sembilan bulan, kemudian ia bebas untuk menikah lagi. {cite:muwatta-maruf-1997 p.96}"
