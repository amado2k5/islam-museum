label: { ar: "الموطأ 1703 — عمر بن الخطاب عن سعيد بن المسيب: المرأة المطلقة التي حاضت حيضة أو حيضتين ثم رفعتها حيضتها تنتظر تسعة أشهر، فإن بان بها حمل فذلك، وإلا اعتدت ثلاثة أشهر", en: "Muwatta 1703" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد وعن يزيد بن عبد الله بن قسيط الليثي عن سعيد بن المسيب أنه قال قال عمر بن الخطاب أيما امرأة طلقت فحاضت حيضة أو حيضتين، ثم رفعتها حيضتها، فإنها تنتظر تسعة أشهر، فإن بان بها حمل فذلك، وإلا اعتدت بعد التسعة أشهر ثلاثة أشهر، ثم حلت. {cite:muwatta-maruf-1997 p.96}"
