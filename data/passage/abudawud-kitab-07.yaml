  en: "Sunan Abi Dawud, Book 7: Prayer (Kitab Al-Salat): Prostration while reciting the Qur'an"
  ur: "سنن ابی داؤد، کتاب سجود القرآن"
  es: "Sunan Abi Dawud, Libro 7: La oración (Kitab Al-Salat): Postración al recitar el Corán"
summary:
  ar: "القسم 7 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب سجود القرآن»، ويضم فيها النصوص من 1401 إلى 1415 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 7 of Sunan Abi Dawud (Prayer (Kitab Al-Salat): Prostration while reciting the Qur'an) in the division of the open hadith dataset the museum took its reports from: reports 1401 to 1415 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 7، عنوان «کتاب سجود القرآن»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1401 تا 1415۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 7 de Sunan Abi Dawud (Oración (Kitab Al-Salat): Postración al recitar el Corán) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 1401 a 1415 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
