text: "… لي آل عبد الله بن جَحْشِ - وكان لأمَيْمَةَ بنت عبد المطلب، حَمْزَة خَالُهُ، وقد كان مُثّلَ به كما مُثّلَ بحمزة، إلا أنه لم يُبْقَرْ عن كبده - أن رسول اللّٰه لَلِفِ دفنه مع حَمْزَةَ في قبره، ولم أسمع ذلك …"
summary:
