label: { ar: "الموطأ 2561 — مالك: من أمسك رجلا لآخر فقتله فيُقتل الاثنان إن أراد القتل", en: "Muwatta 2561" }
summary:
  ar: "قال مالك في الرجل يمسك الرجل للرجل فيضربه فيموت مكانه: إن أمسكه وهو يرى أنه يريد قتله قُتلا به جميعا. وإن أمسكه وهو يرى أنه إنما يريد الضرب مما يضربه الناس، لا يرى أنه عمد لقتله، فإنه يُقتل القاتل، ويُعاقب الممسك أشد العقوبة ويُسجن سنة، ولا يكون عليه القتل. {cite:muwatta-maruf-1997 p.446}"
