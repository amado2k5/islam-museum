label: { ar: "الموطأ 2561 — مالك: من أمسك رجلا لآخر فقتله فيُقتل الاثنان إن أراد القتل", en: "Muwatta 2561", es: "Muwatta 2561", fr: "Muwatta 2561", ur: "موطا 2561", tr: "El-Muvatta 2561 — Malik: Bir adam başka bir adamı yakalayıp öldürürse, birbirlerini öldürmeyi amaçlamışlarsa ikisi de öldürülmelidir.", id: "Al-Muwatta 2561 — Malik: Jika seorang pria menangkap pria lain dan membunuhnya, maka keduanya harus dibunuh jika mereka bermaksud saling membunuh." }
summary:
  ar: "قال مالك في الرجل يمسك الرجل للرجل فيضربه فيموت مكانه: إن أمسكه وهو يرى أنه يريد قتله قُتلا به جميعا. وإن أمسكه وهو يرى أنه إنما يريد الضرب مما يضربه الناس، لا يرى أنه عمد لقتله، فإنه يُقتل القاتل، ويُعاقب الممسك أشد العقوبة ويُسجن سنة، ولا يكون عليه القتل. {cite:muwatta-maruf-1997 p.446}"
  tr: "Malik, bir adamın başka bir adamı vurup öldürmesi için tutması durumunda şöyle demiştir: Eğer onu öldürme niyetiyle tuttuğuna inanarak tutarsa, her ikisi de öldürülür. Fakat eğer onu sadece insanlar arasında yaygın olan bir şekilde vurmak niyetiyle tuttuğuna ve öldürme niyetiyle tutmadığına inanarak tutarsa, o zaman öldüren öldürülür, tutan ise ağır bir şekilde cezalandırılır ve bir yıl hapse atılır, ancak öldürülmez. {cite:muwatta-maruf-1997 s.446}"
  id: "Malik berkata mengenai seorang pria yang menahan pria lain agar dapat memukulnya dan pria itu mati di tempat: Jika ia menahannya dengan keyakinan bahwa ia bermaksud membunuhnya, maka keduanya harus dibunuh. Tetapi jika ia menahannya dengan keyakinan bahwa ia hanya bermaksud memukulnya dengan cara yang umum di antara orang-orang, dan tidak yakin bahwa ia bermaksud membunuhnya, maka si pembunuh harus dibunuh, dan orang yang menahannya harus dihukum berat dan dipenjara selama setahun, tetapi ia tidak boleh dibunuh. {cite:muwatta-maruf-1997 p.446}"
