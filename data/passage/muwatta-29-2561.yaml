summary:
  ar: "إن أمسك الرجل رجلًا لآخر فضربه فمات مكانه، وكان الممسِك يعلم أن الضارب يريد قتله قُتلا به جميعًا؛ أما إن ظن أن الضارب يريد الضرب فقط فالحكم يختلف."
