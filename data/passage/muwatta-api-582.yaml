label: { ar: "موطأ مالك 582 — الأب والأبوة", en: "Muwatta Malik 582 — the father and fatherhood", ur: "موطأ مالک 582 — باپ اور والدیت" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ عُمَرَ بْنِ حُسَيْنٍ، عَنْ عَائِشَةَ بِنْتِ قُدَامَةَ، عَنْ أَبِيهَا، أَنَّهُ قَالَ : كُنْتُ إِذَا جِئْتُ عُثْمَانَ بْنَ عَفَّانَ أَقْبِضُ عَطَائِي سَأَلَنِي : هَلْ عِنْدَكَ مِنْ مَالٍ وَجَبَتْ عَلَيْكَ فِيهِ الزَّكَاةُ قَالَ فَإِنْ قُلْتُ : نَعَمْ أَخَذَ مِنْ عَطَائِي زَكَاةَ ذَلِكَ الْمَالِ، وَإِنْ قُلْتُ : لاَ، دَفَعَ إِلَىَّ عَطَائِي."
summary:
  ar: "حديث في موطأ مالك، رقم 582، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 582 (Zakat), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 582، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
