label: { ar: "سنن النسائي 2003 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 2003 — a burial, grave or resting place", ur: "سنن نسائی 2003 — تدفین، قبر اور مرقد" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَنْبَأَنَا وَكِيعٌ، قَالَ حَدَّثَنَا سَعِيدُ بْنُ السَّائِبِ، عَنْ رَجُلٍ، يُقَالُ لَهُ عُبَيْدُ اللَّهِ بْنُ مُعَيَّةَ قَالَ : أُصِيبَ رَجُلاَنِ مِنَ الْمُسْلِمِينَ يَوْمَ الطَّائِفِ، فَحُمِلاَ إِلَى رَسُولِ اللَّهِ فَأَمَرَ أَنْ يُدْفَنَا حَيْثُ أُصِيبَا. وَكَانَ ابْنُ مُعَيَّةَ وُلِدَ عَلَى عَهْدِ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 2003، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2003 (The Book of Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2003، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
