label: { ar: "جامع الترمذي 2045 — الدواء، السم والترياق", en: "Jami' al-Tirmidhi 2045 — the drug; poison and antidote", ur: "جامع ترمذی 2045 — دوا، زہر اور تریاق", es: "Jami' al-Tirmidhi 2045 — la droga; veneno y antídoto", fr: "Jami' al-Tirmidhi 2045 — le médicament; le poison et l'antidote", tr: "Cami' el-Tirmizi 2045 — İlaç, Zehir ve Panzehir", id: "Jami' al-Tirmidhi 2045 — Obat-obatan, Racun dan Penawarnya" }
text: "حَدَّثَنَا سُوَيْدُ بْنُ نَصْرٍ، قال أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، عَنْ يُونُسَ بْنِ أَبِي إِسْحَاقَ، عَنْ مُجَاهِدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ نَهَى رَسُولُ اللَّهِ عَنِ الدَّوَاءِ الْخَبِيثِ. قَالَ أَبُو عِيسَى يَعْنِي السُّمَّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2045، يذكر الدواء، والسم والترياق، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2045 (Chapters on Medicine), that mentions the drug, poison and antidote, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2045، جس میں دوا، زہر اور تریاق، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2045 (Capítulos sobre Medicina), menciona el medicamento, el veneno y el antídoto, así como el tratamiento con lo prohibido. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2045 (Chapitres sur la médecine), mentionne les médicaments, les poisons et leurs antidotes, ainsi que les traitements interdits. Le Navigateur de médecine le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de 2045 numaralı hadis, ilaç, zehir, panzehir ve yasaklanmış maddelerle tedaviden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve hastalıkların tedavisi hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2045, menyebutkan obat-obatan, racun, penawar racun, dan pengobatan dengan zat-zat terlarang. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan penyakit."
