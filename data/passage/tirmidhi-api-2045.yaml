label: { ar: "جامع الترمذي 2045 — الدواء، السم والترياق", en: "Jami' al-Tirmidhi 2045 — the drug; poison and antidote", ur: "جامع ترمذی 2045 — دوا، زہر اور تریاق" }
text: "حَدَّثَنَا سُوَيْدُ بْنُ نَصْرٍ، قال أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، عَنْ يُونُسَ بْنِ أَبِي إِسْحَاقَ، عَنْ مُجَاهِدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ نَهَى رَسُولُ اللَّهِ عَنِ الدَّوَاءِ الْخَبِيثِ. قَالَ أَبُو عِيسَى يَعْنِي السُّمَّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2045، يذكر الدواء، والسم والترياق، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2045 (Chapters on Medicine), that mentions the drug, poison and antidote, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2045، جس میں دوا، زہر اور تریاق، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
