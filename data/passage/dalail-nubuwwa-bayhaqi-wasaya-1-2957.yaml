text: "باب ما جاء في إخباره عن حال ابي ذر - - عند موته وما اوصاه به من الخروج عن المدينة عند ظهور الفتن حدثنا أبو عبد اللّه الحافظ، حدثنا أبو بكر احمد بن كامل القاضي، حدثنا ابو قلابة بن الرقاشي، …"
