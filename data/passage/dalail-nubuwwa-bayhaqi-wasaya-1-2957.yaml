text: "باب ما جاء في إخباره عن حال ابي ذر - - عند موته وما اوصاه به من الخروج عن المدينة عند ظهور الفتن حدثنا أبو عبد اللّه الحافظ، حدثنا أبو بكر احمد بن كامل القاضي، حدثنا ابو قلابة بن الرقاشي، …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2957، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
