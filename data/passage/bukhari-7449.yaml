label:
  ar: "البخاري 7449 — تحاجت الجنة والنار: أنت رحمتي وأنت عذابي"
  en: "Bukhari 7449 — Paradise and the Fire disputed: you are My mercy, you are My punishment"
  ur: "بخاری 7449 — جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب"
text: "اختصمت الجنة والنار إلى ربهما فقالت الجنة يا رب ما لها لا يدخلها إلا ضعفاء الناس وسقطهم. وقالت النار يعني أوثرت بالمتكبرين. فقال الله تعالى للجنة أنت رحمتي. وقال للنار أنت عذابي أصيب بك من أشاء، ولكل واحدة منكما ملؤها …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7449: تحاجت الجنة والنار: أنت رحمتي وأنت عذابي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7449: Paradise and the Fire disputed: you are My mercy, you are My punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7449: جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
