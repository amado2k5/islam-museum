text: "… بأس أن يأكل من جزاء الصيد وغيره • والله أعلم • فرع الأكل من أضحية التطوع وهديه سنة ليس بواجب • هذا مذهبنا ومذهب مالك وأبى حنيفة والجمهور، وأوجبه بعض السلف، وهو وجه لنا سبق وممن استحب أن يأكل ثلثا …"
summary:
  ar: "مقطع من المجموع للنووي، ص 400، يرد فيه ذكر الواجب، والمستحب، والتطوع، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 400, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the voluntary act (tatawwu'), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 400 کا اقتباس جس میں واجب، مستحب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 400, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 400, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), el acto voluntario (tatawwu'), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
