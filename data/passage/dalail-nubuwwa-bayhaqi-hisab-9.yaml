text: "… الفتح : ٢٩ والذين آمنُوا وعمِلُوا الصَّالِحاتِ وءامَنُوا بما نُزِّل عَلى محمَّدٍ وهو الحقُّ مِن ربُّهمْ كفّر عنهُم سيئاتِهم وأصْلح بالهم . ٤٧ : محمد : ٢ ما كَانَ محمَّدُ أبا أَحدٍ من رجالِكُمْ وَلِكِن رَسولَ اللّه وخَاتَم التّبين وكان"
summary:
