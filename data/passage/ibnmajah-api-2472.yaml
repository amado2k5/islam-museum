label: { ar: "سنن ابن ماجه 2472 — الحرام", en: "Sunan Ibn Majah 2472 — the unlawful", ur: "سنن ابن ماجہ 2472 — حرام", es: "Sunan Ibn Majah 2472 - lo ilegal", fr: "Sunan Ibn Majah 2472 — l'illégal", tr: "Sünen İbn Mace 2472 — Haram", id: "Sunan Ibnu Majah 2472 — Al-Haram" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ سَعِيدٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ خِرَاشِ بْنِ حَوْشَبٍ الشَّيْبَانِيُّ، عَنِ الْعَوَّامِ بْنِ حَوْشَبٍ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" الْمُسْلِمُونَ شُرَكَاءُ فِي ثَلاَثٍ فِي الْمَاءِ وَالْكَلإِ وَالنَّارِ وَثَمَنُهُ حَرَامٌ \". قَالَ أَبُو سَعِيدٍ يَعْنِي الْمَاءَ الْجَارِيَ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2472، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2472 (The Chapters on Pawning), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2472، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2472 (Los capítulos sobre el empeño), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 2472 (Les chapitres sur le gage), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde yer alan 2472 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alınan metinleri bir araya getirmektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 2472, menyebutkan apa yang dilarang. Bagian dari peramban Halal dan Haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
