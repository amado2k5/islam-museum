text: "ما بين المشرق والمغرب قبلة، إذا توجه قبل البيت"
summary:
  ar: "أثر موقوف يرويه مالك عن نافع عن عمر بن الخطاب، في باب ما جاء في القبلة: ما بين المشرق والمغرب قبلة إذا توجه المصلي قبل البيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن مثله روي عن علي بن أبي طالب وابن عباس، وروي مرفوعاً من حديث أبي هريرة عند الترمذي (344) وقال: حسن صحيح. {cite:muwatta-maruf-1997 p.272}"
