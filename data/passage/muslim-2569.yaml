label:
  ar: "مسلم 2569 — يا ابن آدم مرضت فلم تعدني"
  en: "Muslim 2569 — Son of Adam, I was ill and you did not visit Me"
  ur: "مسلم 2569 — اے ابن آدم، میں بیمار تھا تو نے میری عیادت نہیں کی"
text: "إن الله عز وجل يقول يوم القيامة يا ابن آدم مرضت فلم تعدني . قال يا رب كيف أعودك وأنت رب العالمين . قال أما علمت أن عبدي فلانا مرض فلم تعده أما علمت أنك لو عدته لوجدتني عنده يا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2569: يا ابن آدم مرضت فلم تعدني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2569: Son of Adam, I was ill and you did not visit Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2569: اے ابن آدم، میں بیمار تھا تو نے میری عیادت نہیں کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
