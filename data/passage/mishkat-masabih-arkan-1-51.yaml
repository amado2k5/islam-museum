text: "… بل، ولا شك أن من كان كذلك فقد خلصت حلاوة الإيمان إلى قلبه وذاق طعمه. وبالإسلام: إما أن يراد به الانقياد كما في حديث جبرئيل عليلا، أو مجموع ما يعبر عنه بالدين في قوله بني الإسلام على خمس، ويؤيد الثاني …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 51، يذكر ما بُني عليه الإسلام، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 51, that mentions what Islam is built on, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 51 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 1, pág. 51, que menciona los fundamentos del Islam: la dulzura y la plenitud de la fe. Este extracto, extraído de la lectura automática y citado con un límite de cuarenta palabras según la política de fuentes, se encuentra en la lista de Pillars and Branches of Faith Browser."
  fr: "Extrait de Mishkat al-Masabih, volume 1, page 51, évoquant les fondements de l'islam, la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 51'den bir alıntı, İslam'ın temellerinden ve imanın tatlılığından ve mükemmelliğinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 51, menyebutkan landasan Islam dan keindahan serta kesempurnaan iman. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
