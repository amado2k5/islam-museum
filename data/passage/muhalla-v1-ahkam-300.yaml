text: "… المعَاصِي حَسَنٌ. والجِهادُ أفضَلُ الأغمالِ كُلِّها بَعدَ الفَرائضِ وبَعدَ تَعلُّمِ الفِقهِ وتعلِيْمهِ، والحُكمُ بالعدْلِ والتَّعاونُ عَلَى البرِّ وَاحِبٌ، وعَونُ الضَّعِيفِ وَاجبٌ، وَلَا بَأْسَ بأنْ يَقُولَ المسْلِمُ لِأَخيهِ المسْلِمِ: جَمَلني اللهُ فِداكَ، وفِدَاكَ أَبِي وَأَمِّي. ولَسْنَا نَكْرهُ الدُّعَاء بِطُولِ البَقاءِ والسَّلَامَةِ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 300، يرد فيه ذكر الفريضة والفرائض، والواجب، وما لا بأس به، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 300, whose wording mentions the obligation (farida), the obligatory (wajib), what is said to be no harm, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 300 کا اقتباس جس میں فریضہ اور فرائض، واجب، جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 300, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), ce qui est dit sans inconvénient, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 300, cuyo texto menciona la obligación (farida), lo obligatorio (wajib), lo que se dice que no tiene inconveniente, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 300. sayfasından, farz olan ameller, görevler, helal olan ve mekruh olan amelleri ele alan bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 300, yang membahas tentang amalan wajib, kewajiban, apa yang diperbolehkan, dan apa yang tidak disukai; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
