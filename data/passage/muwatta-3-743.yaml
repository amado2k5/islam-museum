summary:
  ar: "قول لمالك: وكذلك الزبيب كله، أسوده وأحمره، فإذا قطف الرجل منه خمسة أوسق وجبت فيه الزكاة، فإن لم يبلغ ذلك فلا زكاة فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.369}"
