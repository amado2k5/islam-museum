text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ نَافِعٍ، وَعَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ عُمَرَ بْنَ الْخَطَّابِ، خَطَبَ النَّاسَ بِعَرَفَةَ وَعَلَّمَهُمْ أَمْرَ الْحَجِّ وَقَالَ لَهُمْ فِيمَا قَالَ إِذَا جِئْتُمْ مِنًى فَمَنْ رَمَى الْجَمْرَةَ فَقَدْ حَلَّ لَهُ مَا حَرُمَ عَلَى الْحَاجِّ إِلاَّ النِّسَاءَ وَالطِّيبَ لاَ يَمَسَّ أَحَدٌ نِسَاءً وَلاَ طِيبًا حَتَّى يَطُوفَ بِالْبَيْتِ."
summary:
  ar: "حديث في موطأ مالك، رقم 924، يذكر ما أُحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 924 (Hajj), that mentions what was made lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 924، جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 924 (Hajj), menciona lo que se ha hecho lícito y lo que se ha hecho ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 924 (Hajj), mentionne ce qui a été rendu licite et ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Malik'in Muwatta'sında yer alan 924 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 924, menyebutkan apa yang diperbolehkan dan apa yang diharamkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
