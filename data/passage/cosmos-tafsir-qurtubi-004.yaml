text: "ثم خلق الثانية مثلها في العرض والغلظ وجعل فيها أقواماً، أفواههم كأفواه الكلاب وأيديهم أيدي الناس؛ وآذانهم آذان البقر وشعورهم شعور الغنم، فإذا كان عند اقتراب الساعة ألقتهم الأرض إلى يأجوج ومأجوج"
summary:
  ar: "عند آية الرتق والفتق يحكي القرطبي عن القتبي في عيون الأخبار عن إسماعيل بن أبي خالد وصفاً للأرضين السبع: العليا سكانها الجن والإنس، والثانية فيها أقوام بأفواه كأفواه الكلاب إذا اقتربت الساعة ألقتهم الأرض إلى يأجوج ومأجوج؛ ويسوقه خبراً منقولاً من غير أن يزكّيه."
  en: "At the verse of the joined and split heavens and earth, al-Qurtubi relays from al-Qutaybi (Uyun al-Akhbar), citing Ismail ibn Abi Khalid, a description of the seven earths: the upper one is inhabited by jinn and humans, and in the second live peoples with dog-like mouths whom, near the Hour, the earth casts out to Gog and Magog. He passes it on as a transmitted report without endorsing it."
  es: "En el versículo sobre los cielos y la tierra unidos y divididos, al-Qurtubi relata, citando a Ismail ibn Abi Khalid (Uyun al-Akhbar), una descripción de las siete tierras: la superior está habitada por genios y humanos, y en la segunda viven pueblos con bocas parecidas a las de los perros, a quienes, cerca de la Hora, la tierra arroja a Gog y Magog. La transmite como un relato sin respaldarlo."
  fr: "Au verset évoquant la jonction et la séparation des cieux et de la terre, al-Qurtubi rapporte d'al-Qutaybi (Uyun al-Akhbar), citant Ismail ibn Abi Khalid, une description des sept terres: la terre supérieure est habitée par les djinns et les humains, et la seconde par des peuples à la gueule canine que, près de l'Heure, la terre chasse vers Gog et Magog. Il transmet ce récit comme une parole rapportée, sans l'approuver."
  ur: "زمین اور آسمانوں کو ملانے اور تقسیم کرنے کی آیت میں، القرطبی نے القطیبی ⁦(عیون الاخبار)⁩ سے اسمٰعیل بن ابی خالد کا حوالہ دیتے ہوئے، سات زمینوں کی تفصیل بیان کی ہے: اوپر والے میں جن اور انسان آباد ہیں، اور دوسرے میں کتے کی طرح کے زندہ لوگ ہیں، جو زمین کے قریب گوگوگوں اور گوگوں کے منہ سے نکلتے ہیں۔ وہ اس کی توثیق کیے بغیر اسے منتقل شدہ رپورٹ کے طور پر منتقل کرتا ہے۔"
  tr: "Birleşme ve ayrılma ayetinde, El-Kurtubi, Uyun el-Akhbar'da İsmail bin Ebu Halid'den rivayetle El-Kutbi'den yedi yeryüzünün tasvirini naklediyor: Üstteki yeryüzünde cinler ve insanlar yaşar, ikincisinde ise ağızları köpek ağzına benzeyen insanlar bulunur. Kıyamet yaklaşınca, yeryüzü onları Gog ve Magog'a atar; ve bunu övmeden, rivayet olarak sunar."
  id: "Pada ayat tentang penyatuan dan pemisahan, Al-Qurtubi meriwayatkan dari Al-Qutbi dalam Uyun Al-Akhbar atas otoritas Ismail bin Abi Khalid, sebuah uraian tentang tujuh bumi: bumi bagian atas dihuni oleh jin dan manusia, dan bumi bagian kedua dihuni oleh orang-orang dengan mulut seperti mulut anjing. Ketika Hari Kiamat mendekat, bumi akan melemparkan mereka ke Gog dan Magog; dan dia menyajikannya sebagai riwayat yang diriwayatkan tanpa memujinya."
