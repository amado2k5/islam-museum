text: "لآخرة(٣)، معه ثمانية رهط من المهاجرين، وقيل اثنا عشر رجلا، وكتب له كتابا، وأمره أن لا ينظر فيه حتى يسير يومين، ثم ينظر فيه، فيمضي لما أمره به، ولا يكره أحدا من أصحابه، ففعل ذلك، ثم قرأ الكتاب وفيه يأمره"
