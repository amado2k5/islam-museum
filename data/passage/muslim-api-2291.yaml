label: { ar: "صحيح مسلم 2291 — الكي", en: "Sahih Muslim 2291 — cautery", ur: "صحیح مسلم 2291 — داغنا" }
text: "… بْنُ وَهْبٍ، حَدَّثَنِي هِشَامُ، بْنُ سَعْدٍ عَنْ زَيْدِ بْنِ أَسْلَمَ، فِي هَذَا الإِسْنَادِ بِمَعْنَى حَدِيثِ حَفْصِ بْنِ مَيْسَرَةَ إِلَى آخِرِهِ غَيْرَ أَنَّهُ قَالَ \" مَا مِنْ صَاحِبِ إِبِلٍ لاَ يُؤَدِّي حَقَّهَا \". وَلَمْ يَقُلْ \" مِنْهَا حَقَّهَا \". وَذَكَرَ فِيهِ \" لاَ يَفْقِدُ مِنْهَا فَصِيلاً وَاحِدًا \". وَقَالَ \" يُكْوَى بِهَا جَنْبَاهُ وَجَبْهَتُهُ وَظَهْرُهُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2291، يذكر الكي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2291 (The Book of Zakat), that mentions cautery. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2291، جس میں داغنا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
