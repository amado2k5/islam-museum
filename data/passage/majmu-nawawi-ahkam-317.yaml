text: "… وسائر الأسفار غير سفر الحج الواجب الثالث ذكره القاضى أبو الطيب أنه محمول على ما إذا لم يكن الطريق أمنا والجواب عن قياسهم على حج التطوع وسفر التجارة وأنه ليس بواجب بخلاف حج الفرض والله أعلم."
summary:
  ar: "مقطع من المجموع للنووي، ص 317، يرد فيه ذكر الفرض، والواجب، والتطوع، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 317, whose wording mentions the obligatory (fard), the obligatory (wajib), the voluntary act (tatawwu'), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 317 کا اقتباس جس میں فرض، واجب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 317, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
