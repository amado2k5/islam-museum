text: "… من المنكر ولا من الكبائر ولا من الصغائر إن شاء اللّه. وسينتهى بك كتابنا هذا الى باب المزاح والفكاهة وما روى عن الأشراف والأئمة فيبما. فاذا مرّ بك أيها المتزَمّتُ حديث تستخفّه أو تستحسنه أو تعجب منه أو تضحك.. له …"
summary:
