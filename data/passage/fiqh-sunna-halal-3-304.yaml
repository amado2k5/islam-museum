text: "… الشرعية الكتاب، والسنة، والإجماع، والقياس ما يوجب لزوم الثلاثة له، ونكاحه ثابت بيقين، وأمراته محرمة على الغير بيقين، وفي إلزامه بالثلاث إباحتها للغير مع تحريمها عليه، وذريعة إلى نكاح التحليل الذي حرمه اللّٰه ورسوله ونكاح التحليل لم يكن ظاهرًا على …"
summary:
