label: { ar: "سنن النسائي 3134 — الأب والأبوة", en: "Sunan al-Nasa'i 3134 — the father and fatherhood", ur: "سنن نسائی 3134 — باپ اور والدیت", es: "Sunan al-Nasa'i 3134 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3134 — le père et la paternité" }
text: "… اللَّهِ يَقُولُ \" إِنَّ الشَّيْطَانَ قَعَدَ لاِبْنِ آدَمَ بِأَطْرُقِهِ فَقَعَدَ لَهُ بِطَرِيقِ الإِسْلاَمِ فَقَالَ تُسْلِمُ وَتَذَرُ دِينَكَ وَدِينَ آبَائِكَ وَآبَاءِ أَبِيكَ فَعَصَاهُ فَأَسْلَمَ ثُمَّ قَعَدَ لَهُ بِطَرِيقِ الْهِجْرَةِ فَقَالَ تُهَاجِرُ وَتَدَعُ أَرْضَكَ وَسَمَاءَكَ وَإِنَّمَا مَثَلُ الْمُهَاجِرِ كَمَثَلِ الْفَرَسِ فِي الطِّوَلِ فَعَصَاهُ فَهَاجَرَ ثُمَّ قَعَدَ لَهُ بِطَرِيقِ الْجِهَادِ فَقَالَ تُجَاهِدُ فَهُوَ جَهْدُ النَّفْسِ وَالْمَالِ فَتُقَاتِلُ فَتُقْتَلُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3134، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3134 (The Book of Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3134، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3134 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3134 (Le Livre du Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
