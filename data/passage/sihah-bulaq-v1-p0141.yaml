text: |-
  (١ ي شديد الميم من الهمرش
  جارية ليست من الوخشْنّ • كانْ مجرى دمعها المشنْ • قطمة من أجود القطنّ
  أراد الوخش فزاد فيها نونائقيلة وأوخس القوم أى ردّوا السهام فى الرياية مرة بعد أجرى
  كأنهم صاروا الى الوخاشة والرذالة وأنشد أبوالجراح ليزيدبن الطئرية
  وألقيت سهمى وسطهم حيز أوخشوا • فاصارلى فى القسم الامينها
  رش ورش شيئا من الطعام وروشا أى تناوله والوارش الداخل على القوم وهم
  يأكاون ولم يدع مثل الواغل فى الشراب والتوريس التحريس يقال ورتشت بين القوم
  وأتشت والورشة من الدواب التى قفلت الى الجرى وصاحبها يكفها قال أبوعم روالورشات
  الخفاف من النوق وأنشد بات يبارى ورشات كالقطا والورشان طائر وهو ساق حرّ
  وفى المثل بعلة الورشان تأكل رطب المشان والجمع الوراشين ويجمع على ورشان بكسر
  الواووتسكين اراءمثل كروان بجمع كروان على غير قياس وورش لقب رجسل من رواة القرّاء
  شوش . رجل وشواش أى خفيف عن الاصعى وأنشد
  فى الركب وشواش وفى الحى رفل والوشوسة كلام فى اختلاط ⁦(وطس)⁩ يقال
  ضربوه فاوطس اليهم توطيشا اى لم يددييده ولم يدفع عن نفسه وسألوه فاوطش اليهم بشئ
  أى لم يعطهم شيئا قال الفرّاء وطسْ له اذاهيأه وجه الكلام أو العمل أو الرأى بقال
  وطش لى شيئا حتى أذكره أى افتح ⁦(وقش)⁩. الوقش الحسركة يقال سمعت وقشه
  أى حسه وتوقش أى تحرلا" قال الشاءر والرمة
  قدع عنك الصباولديك هما • توقش فى فؤادك واختبالا
  ووقس أيضا اسم رجل من الاوس وبنوأقيش قوم من العرب وأصل الالف فيه واوصل
  أقتت ووقنت وأنشد الاخفس للنابغة
  كأنك من حال بف أقيس * يقعقع خلف رجليه بشن
  أراد كانك جل من جالهسم فى ذف كاقال اللّه تعالى وان من أهسل الكتاب الاليومنن به أى
  وما من أهل الكتاب أحد إلا ليؤمنى به
  ف صل الماء) ( يس لهبش اجمع والكسب يقال هو يهيس لعياله ويتهبش فهو
  هباش قال رؤية
  أعدولهبش المغنم المهبوش * سيدا كسيد الردهة المغبوش
  والهباشة مثل الحباشة وهى ماجع من الناس والمال ⁦(هرش)⁩ الهراش المهارشة
  بالكلاب وه وتحريش بعضهاعلى بعض والتهر بس التحريش وهرشى ثنية فى طريق
  مكة قريبة من الجفة يرى منها اليروله اطريقان فكل من سلكهما كان مصيبا قال الشاءر
  خذى أنف هرشى أوقفاهافانه • كلاجاني هردى لمن طريق
  أى للابل
  ⁦(همرش)⁩ الهمرش العجوز السكبيرة والناقة الغزيرة واسيم كلبة قال الراجر
  ان الجراءتخترش • فى بطرأم الهمرش ( ١
  قال الاخفسْ هو من بنات انلمسة والميم الاولى نون مثال ححمرس لانه لم يجى ئ من بنات
  الاربعة على هذا البناه واغمالم يبين الفون لانه ليس له مثال يلتبس به فيفصل بينهما
  ⁦( هنس)⁩ هثنت الورق أهشه هنا خبطته بعصاليتهات ومنه قوله تعالى وأهش بها على
