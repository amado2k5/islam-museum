text: "… اللّٰه: دفناه ولم نلحد له. فرجعنا لتلحد له فلم نجد موضع قبره. وأخرجه أبو نعيم فى الدلائل ص عن ابى هريرة - نحو رواية الطبرانى. وأخرج الشيخان عن ابى هريرة قال: بعث رسول اللّٰه سرية و أمر عليهم عاصم بن …"
