label: { ar: "غزوة تبوك — تبشير كعب بن مالك عند أم سلمة", en: "Battle of Tabuk — the glad tidings to Ka'b ibn Malik at Umm Salama's" }
text: "قال لي رسول الله من الليل: يا أم سلمة، قد نزلت توبة كعب بن مالك وصاحبيه"
summary:
  ar: "في غزوة تبوك، وهي آخر غزوات النبي، كان كعب بن مالك أحد المنافقين الثلاثة الذين تخلفوا عن الجهاد بلا عذر، فنزلت توبتهم. ويروي الواقدي أن النبي قال لأم سلمة من الليل: «يا أم سلمة، قد نزلت توبة كعب بن مالك وصاحبيه»، فقالت: ألا أرسلت إليهم فأبشرهم؟ قال: يمنعونك النوم آخر الليل، ولكن لا يرون حتى يصبحوا، فلما صلى الصبح أخبر الناس بما تاب الله عليهم. ويذكر الباب القبائل التي بعث إليها النبي."
  en: "At Tabuk, the Prophet's last campaign, Ka'b ibn Malik was one of the three hypocrites who stayed behind without excuse until their repentance descended. Waqidi reports the Prophet telling Umm Salama at night that Ka'b's repentance had come down, and that he would not send for them until dawn lest he keep her awake; at morning prayer he announced their repentance to the people."
