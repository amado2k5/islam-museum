label: { ar: "غزوة تبوك — تبشير كعب بن مالك عند أم سلمة", en: "Battle of Tabuk — the glad tidings to Ka'b ibn Malik at Umm Salama's", es: "Batalla de Tabuk: las buenas nuevas para Ka'b ibn Malik en Umm Salama", fr: "Bataille de Tabuk - la bonne nouvelle de Ka'b ibn Malik chez Umm Salama", ur: "جنگ تبوک - ام سلمہ ا کی کعب بن مالک کو بشارت" }
text: "قال لي رسول الله من الليل: يا أم سلمة، قد نزلت توبة كعب بن مالك وصاحبيه"
summary:
  ar: "في غزوة تبوك، وهي آخر غزوات النبي، كان كعب بن مالك أحد المنافقين الثلاثة الذين تخلفوا عن الجهاد بلا عذر، فنزلت توبتهم. ويروي الواقدي أن النبي قال لأم سلمة من الليل: «يا أم سلمة، قد نزلت توبة كعب بن مالك وصاحبيه»، فقالت: ألا أرسلت إليهم فأبشرهم؟ قال: يمنعونك النوم آخر الليل، ولكن لا يرون حتى يصبحوا، فلما صلى الصبح أخبر الناس بما تاب الله عليهم. ويذكر الباب القبائل التي بعث إليها النبي."
  en: "At Tabuk, the Prophet's last campaign, Ka'b ibn Malik was one of the three hypocrites who stayed behind without excuse until their repentance descended. Waqidi reports the Prophet telling Umm Salama at night that Ka'b's repentance had come down, and that he would not send for them until dawn lest he keep her awake; at morning prayer he announced their repentance to the people."
  es: "En Tabuk, la última campaña del Profeta, Ka'b ibn Malik fue uno de los tres hipócritas que se quedaron atrás sin excusa hasta que su arrepentimiento descendió. Waqidi relata que el Profeta le dijo a Umm Salama por la noche que el arrepentimiento de Ka'b había descendido y que no los mandaría llamar hasta el amanecer para no mantenerla despierta; en la oración de la mañana anunció su arrepentimiento al pueblo."
  fr: "À Tabuk, lors de la dernière campagne du Prophète, Ka'b ibn Malik fut l'un des trois hypocrites qui restèrent sur place sans excuse jusqu'à ce que leur repentir soit révélé. Waqidi rapporte que le Prophète dit à Umm Salama, la nuit, que le repentir de Ka'b était descendu sur terre et qu'il ne les ferait pas venir avant l'aube pour ne pas la réveiller; à la prière du matin, il annonça leur repentir au peuple."
  ur: "تبوک میں، نبی کی آخری مہم، کعب بن مالک ان تین منافقوں میں سے ایک تھے جو بغیر کسی عذر کے پیچھے رہے یہاں تک کہ ان کی توبہ اتر گئی۔ واقدی روایت کرتے ہیں کہ نبی نے رات کو ام سلمہ ا سے کہا کہ کعب کی توبہ نازل ہو گئی ہے، اور وہ صبح تک ان کے لیے نہیں بھیجیں گے ورنہ وہ اسے بیدار رکھیں گے۔ صبح کی نماز میں اس نے لوگوں سے ان کی توبہ کا اعلان کیا۔"
