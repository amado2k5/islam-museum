text: "ل سعيد بن عفير : شهد فتح مصر هو وأبوه. وقال أبو عمر الكندي في كتاب الخندق: حدثني يحيى بن أبي معاوية بن خلف بن ربيعة، عن أبيه: حدثني الوليد بن سليمان، قال: كان أكدر علويا، وكان ذا دين وفضل"
