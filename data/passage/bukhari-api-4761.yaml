label: { ar: "صحيح البخاري 4761 — ما حُرّم", en: "Sahih al-Bukhari 4761 — what was made unlawful", ur: "صحیح بخاری 4761 — جو حرام کیا گیا" }
text: "… أَنْ تَجْعَلَ لِلَّهِ نِدًّا وَهْوَ خَلَقَكَ \". قُلْتُ ثُمَّ أَىٌّ قَالَ \" ثُمَّ أَنْ تَقْتُلَ وَلَدَكَ خَشْيَةَ أَنْ يَطْعَمَ مَعَكَ\". قُلْتُ ثُمَّ أَىٌّ قَالَ \" أَنْ تُزَانِيَ بِحَلِيلَةِ جَارِكَ \". قَالَ وَنَزَلَتْ هَذِهِ الآيَةُ تَصْدِيقًا لِقَوْلِ رَسُولِ اللَّهِ {وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ وَلَا يَزْنُونَ}"
summary:
  ar: "حديث في صحيح البخاري، رقم 4761، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4761 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4761، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
