text: "… ثابت الأنصاري: أحد أئمة الأدب واللغة. من أهل البصرة. ووفاته بها. كان يرى رآي القدرية. وهو من ثقات اللغويين، قال ابن الأنباري: كان سيبويه إذا قال سمعت الثقة عنى أبا زيد. من تصانيفه كتاب النوادر في اللغة، و الهمز و …"
