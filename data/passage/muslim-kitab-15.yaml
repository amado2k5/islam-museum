label:
  ar: "صحيح مسلم، كتاب الحج"
  en: "Sahih Muslim, Book 15: The Book of Pilgrimage"
  ur: "صحیح مسلم، کتاب الحج"
  es: "Sahih Muslim, Libro 15: El Libro de la Peregrinación"
  fr: "Sahih Muslim, Livre 15: Le Livre du Pèlerinage"
summary:
  ar: "القسم 15 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحج»، ويضم فيها النصوص من 2791 إلى 3397 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 15 of Sahih Muslim (The Book of Pilgrimage) in the division of the open hadith dataset the museum took its reports from: reports 2791 to 3397 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 15، عنوان «کتاب الحج»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2791 تا 3397۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 15 de Sahih Muslim (El Libro de la Peregrinación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2791 al 3397, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre 15), c'est-à-dire des hadiths 2791 à 3397, selon la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
