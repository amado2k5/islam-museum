text: "د فتنازعوا عند رسول الله صلي الله عليه وسلم ، فقال رافع بن حريملة : ما انتم علي شي ، وكفر بعيسي وبالانجيل ، فقال رجل من اهل نجران من النصاري لليهود : ما انتم علي شيء ، وجهد نبوة موسي وكفر"
