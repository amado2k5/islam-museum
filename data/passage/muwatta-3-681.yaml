label: { ar: "الموطأ 681 — مالك: لا بأس بالتجارة في أموال اليتامى لهم إذا كان الولي مأموناً، ولا ضمان عليه", en: "Muwatta 681", es: "Muwatta 681", fr: "Muwatta 681", ur: "موطا 681", tr: "El-Muvatta 681 — Malik: Eğer vasi güvenilir ise ve hiçbir sorumluluk taşımıyorsa, yetimlerin parasıyla onlar adına işlem yapmakta bir sakınca yoktur.", id: "Al-Muwatta 681 — Malik: Tidak ada salahnya memperdagangkan uang anak yatim atas nama mereka jika walinya dapat dipercaya dan tidak bertanggung jawab atas apa pun." }
summary:
  ar: "قول لمالك يختم به الباب: لا بأس بالتجارة في أموال اليتامى لهم إذا كان الولي مأموناً، ولا يرى عليه ضماناً. ويذكر المحقق أن في نسخة م «مأذوناً»، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.343}"
  tr: "Malik bölümü şu ifadeyle sonlandırıyor: Eğer vasi güvenilir ise ve sorumlu tutulmazsa, yetimlerin parasıyla ticaret yapmanın bir sakıncası yoktur. Editör, M el yazmasında bunun \"yetkilendirilmiş\" olarak geçtiğini ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.343}"
  id: "Malik menyimpulkan bab tersebut dengan pernyataan: Tidak ada yang salah dengan memperdagangkan uang anak yatim jika walinya dapat dipercaya, dan ia tidak dimintai pertanggungjawaban. Editor mencatat bahwa dalam manuskrip M tertulis \"diizinkan,\" dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.343}"
