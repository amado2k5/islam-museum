label: { ar: "الموطأ 260 — أعطى الخميصة أبا جهم وأخذ أنبجانيته", en: "Muwatta 260", es: "260 copias", fr: "260 exemplaires", ur: "260 کاپیاں", tr: "El-Muvatta 260 — Hamisa'yı Ebu Cehm'e verdi ve enbecenyesini aldı.", id: "Al-Muwatta 260 — Dia memberikan khamisah kepada Abu Jahm dan mengambil anbajaniyahnya" }
text: "إني نظرت إلى علمها في الصلاة"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، في باب النظر في الصلاة إلى ما يشغلك عنها: لبس النبي خميصة لها أعلام ثم أعطاها أبا جهم وأخذ منه أنبجانية له، وهي كساء غليظ لا علم فيه، فلما سأله أبو جهم عن السبب أخبره أنه نظر إلى علمها في الصلاة. وينقل المحقق عن ابن عبد البر أنه مرسل عند جميع الرواة عن مالك إلا معن بن عيسى فأسنده عن هشام عن أبيه عن عائشة، وكذلك يرويه أصحاب هشام مسنداً، ورواه الزهري عن عروة عن عائشة ⁦(التمهيد 22/314)⁩، ويخرّج الموصول عند البخاري ومسلم (2/77–78) وأبي داود (914–915) وابن ماجه (3550) والنسائي وأحمد. {cite:muwatta-maruf-1997 p.153} {cite:muwatta-maruf-1997 p.154}"
  tr: "Malik, namazda dikkati dağıtan şeylere bakma bölümünde, Hişam ibn Urve'den, onun babasından rivayetle, mursal bir hadis olarak şöyle aktarır: Peygamberimiz üzerinde işaretler bulunan bir khamisah (bir tür giysi) giydi, sonra onu Ebu Cehm'e verdi ve ondan işaretsiz, kalın bir pelerin olan bir enbecaniye (başka bir tür giysi) aldı. Ebu Cehm ona bunun sebebini sorduğunda, namaz sırasında üzerindeki işaretlere baktığını söyledi. Araştırmacı, İbn Abdül-Barr'ın, Malik'ten gelen tüm ravilere göre mursal olduğunu, ancak Ma'n ibn İsa'nın Hişam'dan, onun babasından, onun da Aişe'den rivayetle musned (bağlantılı isnad) ile rivayet ettiğini söylediğini aktarır. Benzer şekilde, Hişam'ın öğrencileri de musned ile rivayet ederler. Ez-Zühri bunu Urve'den, Aişe'den rivayet etmiştir (et-Temhid 22/314). Bağlantılı versiyon el-Buhari ve Müslim (2/77-78), Ebu Davud (914-915), İbn Mace (3550), el-Nesa'i ve Ahmed'in koleksiyonlarında bulunur. {cite:muwatta-maruf-1997 s.153} {cite:muwatta-maruf-1997 s.154}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, sebagai hadits mursal, dalam surah tentang memperhatikan hal-hal yang mengalihkan perhatian saat shalat: Nabi mengenakan khamisah (sejenis pakaian) yang bercorak, kemudian memberikannya kepada Abu Jahm dan mengambil darinya anbajaniyah (sejenis pakaian lain), yaitu jubah tebal tanpa corak. Ketika Abu Jahm bertanya kepadanya tentang alasannya, beliau mengatakan bahwa beliau telah memperhatikan coraknya saat shalat. Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa hadits ini mursal menurut semua perawi dari Malik kecuali Ma'n ibn Isa, yang meriwayatkannya dengan musnad (rantai periwayatan yang terhubung) dari Hisham, dari ayahnya, dari Aisyah. Demikian pula, murid-murid Hisham meriwayatkannya dengan musnad. Al-Zuhri meriwayatkannya atas wewenang Urwah, atas wewenang Aisyah (al-Tamhid 22/314). Versi yang terhubung ditemukan dalam koleksi al-Bukhari dan Muslim (2/77–78), Abu Dawud (914–915), Ibnu Majah (3550), al-Nasa'i, dan Ahmad. {kutip:muwatta-maruf-1997 hal.153} {kutip:muwatta-maruf-1997 hal.154}"
