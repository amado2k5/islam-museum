label: { ar: "الموطأ 260 — أعطى الخميصة أبا جهم وأخذ أنبجانيته", en: "Muwatta 260" }
text: "إني نظرت إلى علمها في الصلاة"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، في باب النظر في الصلاة إلى ما يشغلك عنها: لبس النبي خميصة لها أعلام ثم أعطاها أبا جهم وأخذ منه أنبجانية له، وهي كساء غليظ لا علم فيه، فلما سأله أبو جهم عن السبب أخبره أنه نظر إلى علمها في الصلاة. وينقل المحقق عن ابن عبد البر أنه مرسل عند جميع الرواة عن مالك إلا معن بن عيسى فأسنده عن هشام عن أبيه عن عائشة، وكذلك يرويه أصحاب هشام مسنداً، ورواه الزهري عن عروة عن عائشة (التمهيد 22/314)، ويخرّج الموصول عند البخاري ومسلم (2/77–78) وأبي داود (914–915) وابن ماجه (3550) والنسائي وأحمد. {cite:muwatta-maruf-1997 p.153} {cite:muwatta-maruf-1997 p.154}"
