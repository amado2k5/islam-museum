label: { ar: "الموطأ 1091 — نافع: سمع ابن عمر وهو على الصفا يدعو: اللهم إنك قلت: ادعوني أستجب لكم، وإنك لا تخلف الميعاد، وإني أسألك كما هديتني للإسلام أن لا تنزعه مني حتى تتوفاني وأنا مسلم", en: "Muwatta 1091" }
summary:
  ar: "يرويه مالك عن نافع أنه سمع عبد الله بن عمر وهو على الصفا يدعو يقول: اللهم إنك قلت ادعوني أستجب لكم، وإنك لا تخلف الميعاد، وإني أسألك كما هديتني للإسلام أن لا تنزعه مني حتى تتوفاني وأنا مسلم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1313) وسويد (543). {cite:muwatta-maruf-1997 p.500}"
