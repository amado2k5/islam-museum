label: { ar: "الموطأ 1091 — نافع: سمع ابن عمر وهو على الصفا يدعو: اللهم إنك قلت: ادعوني أستجب لكم، وإنك لا تخلف الميعاد، وإني أسألك كما هديتني للإسلام أن لا تنزعه مني حتى تتوفاني وأنا مسلم", en: "Muwatta 1091", es: "Muwatta 1091", fr: "Muwatta 1091", ur: "موطا 1091", tr: "El-Muvatta 1091 — Nafi’: İbn Ömer’in Safa’da iken şöyle dua ettiğini işitti: “Ey Allah’ım, Sen ‘Bana dua et, sana icabet edeceğim’ dedin ve sözünden dönmezsin. Beni İslam’a hidayete erdirdiğin gibi, beni Müslüman olarak ölene kadar İslam’ı benden almamanı diliyorum.”", id: "Al-Muwatta 1091 — Nafi’: Dia mendengar Ibnu Umar, ketika berada di Safa, berdoa: “Ya Allah, Engkau telah berfirman: ‘Mohonlah kepada-Ku, niscaya Aku akan mengabulkan doamu,’ dan Engkau tidak mengingkari janji-Mu. Aku memohon kepada-Mu, karena Engkau telah membimbingku kepada Islam, janganlah Engkau mengambil Islam dariku sampai Engkau menjadikan aku wafat sebagai seorang Muslim.”" }
summary:
  ar: "يرويه مالك عن نافع أنه سمع عبد الله بن عمر وهو على الصفا يدعو يقول: اللهم إنك قلت ادعوني أستجب لكم، وإنك لا تخلف الميعاد، وإني أسألك كما هديتني للإسلام أن لا تنزعه مني حتى تتوفاني وأنا مسلم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1313) وسويد (543). {cite:muwatta-maruf-1997 p.500}"
  tr: "Malik, Nafi'den rivayetle, Safa'da iken Abdullah ibn Umar'ın dua ederken şöyle dediğini işittiğini aktarmıştır: \"Ey Allah'ım, Sen 'Bana dua et, sana icabet edeceğim' dedin ve sözünden dönmezsin. Beni İslam'a hidayete erdirdiğin gibi, beni Müslüman olarak ölene kadar İslam'ı benden almamanı da istiyorum.\" Editör, bu rivayetin Malik'ten Ebu Mus'ab (1313) ve Suveyd (543) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.500}"
  id: "Malik meriwayatkannya dari Nafi’ bahwa ia mendengar Abdullah ibn Umar, ketika berada di Safa, berdoa, berkata: “Ya Allah, Engkau telah berfirman, ‘Mohonlah kepada-Ku, niscaya Aku akan mengabulkan doamu,’ dan Engkau tidak mengingkari janji-Mu. Aku memohon kepada-Mu, karena Engkau telah membimbingku kepada Islam, janganlah Engkau mengambil Islam dariku sampai Engkau menjadikan aku wafat sebagai seorang Muslim.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1313) dan Suwaid (543). {cite:muwatta-maruf-1997 p.500}"
