  es: "Un extracto de Kitab al-Hayawan, volumen escaneado 3, p. 103, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hayvanlar Kitabı, Resimli Cilt 3, sayfa 103'ten bir alıntı; zeki ve aptal insanlar hakkında bir hikaye içeriyor; makineyle okunabilir resimli baskıdan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Kitab Hewan, Jilid Bergambar 3, halaman 103, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari edisi bergambar yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
