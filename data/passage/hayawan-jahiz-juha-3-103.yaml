text: "وقيل لمَزبِّد: يا مُزَبِّد، ما هذا الذي تحتَ حضنك؟ فقال: يا أحمق، فلمَ وقال سُحَيمٌ الفقعسيّ، في نشر ما يُودَعُ من السِّرًا : من الطويل وقال الفَرَار السُّلَميِّ - وهذا الشعر في طريقِ شعرٍ سُحَيمٍ، وإِن لم يكن في معنى …"
summary:
  ar: "مقطع من كتاب الحيوان، المجلد المصوَّر 3، ص 103، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Kitab al-Hayawan, scan volume 3, p. 103, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "کتاب الحیوان، اسکین جلد 3، ص 103 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
