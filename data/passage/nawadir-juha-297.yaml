label: { ar: "نوادر جحا الكبرى، ص 145 — «أنا طلبت حماراً فأرسلت مهراً يركبني»", en: "Nawadir Juha al-Kubra, p. 145 — 'I Asked for a Donkey and You Sent a Foal to Ride Me'", ur: "نوادر جحا الکبریٰ، ص 145 — «میں نے گدھا مانگا تو تم نے ایسا بچھیرا بھیجا جو مجھ پر سوار ہو»", fr: "Nawadir Juha al-Kubra, p. 145 — « J'ai demandé un âne et tu m'as envoyé un poulain qui me monte »", es: "Nawadir Juha al-Kubra, p. 145 — «Pedí un burro y enviaste un potro que me monta»" }
text: "… أنا طلبت حماراً فأرسلت مهراً يركبني كان الشيخ سائراً في طريق طويلةٍ فأخذ يقولُ في نفسه : يا ربي ماذا عسى لو مننت عليّ بحماري، فأراهُ، وأركبُهُ، وأرفع رجلي عنِ الأرض، وإذا بفارس يسوق فرسهُ سوقاً شديداً، ووراءها فلوٌ صغيرً …"
summary:
  ar: "كان جحا يمشي ويدعو الله أن يرزقه حماراً، فطارد فارس مهراً عمره ستة أشهر وأمر جحا أن يحمله إلى القرية، فانهار تحت الحمل، فقال إن الله أرسل إليه مهراً يركبه حين طلب حماراً. {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  en: "Walking, Juha prays for a donkey, and a horseman chases a six-month foal and orders Juha to carry it to the village. Juha collapses under the load, and he says God sent him a foal to ride him when he asked for a donkey. {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  ur: "جحا چلتے ہوئے دعا کرتا ہے کہ اللہ اسے ایک گدھا دے، تو ایک سوار چھ ماہ کے بچھیرے کا پیچھا کرتا ہے اور جحا کو حکم دیتا ہے کہ اسے اٹھا کر گاؤں لے چلے۔ جحا بوجھ تلے گر پڑتا ہے اور کہتا ہے کہ اس نے گدھا مانگا تھا تو اللہ نے اسے ایسا بچھیرا بھیج دیا جو اس پر سوار ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  fr: "En marchant, Juha prie pour avoir un âne, et un cavalier poursuit un poulain de six mois et ordonne à Juha de le porter jusqu'au village. Juha s'effondre sous la charge, et il dit que Dieu lui a envoyé un poulain pour le monter alors qu'il demandait un âne. {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  es: "Caminando, Juha ruega por un burro, y un jinete persigue a un potro de seis meses y ordena a Juha que lo cargue hasta la aldea. Juha se desploma bajo la carga, y dice que Dios le envió un potro que lo monte cuando él pedía un burro. {cite:juha-nawadir-kubra-djuwaydi p. 145}"
