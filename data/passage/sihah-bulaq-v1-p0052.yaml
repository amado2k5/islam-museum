text: |-
  ⁦(ق عل الرا)⁩
  ٥٨٩
  قالواترّقواذعاذع ( ذيع ذاع الخير يديع ذيعاوذيوعا وذيعوعة وذيعانا أى انتشر
  وأذاعه غيره أى أفشاه والمذباع الذى لايكيم السر وفى الحديث لي وابالمذايع البذر
  وأذاغ القوم مافى الحرض أى شربوه كاه
  وربع وارج الصة يقال ما ادع د يح غلات والاربة مدماكروالايع قمدم
  المؤنث والاريعون بعد الثلاثين والربع جزء من أربعة وينقل مثل عسروعسر وربع
  وتره يربعه روما أى فتله من أربيع قوى والقوة الطاقة وصنه قول لبيد
  أعطف الجون بمربوع مشل أى بعنان شديد من أربع قوى ويقال أرادر محامر بوعا
  لا قصيراولاطو يلا والباء بمعنى مع أى ومعى دمح وربعت الابل اذا وردت الربع يقبال جاءت
  الابل روابع ابن السكيت ربع الرجل يربع اذا وقف وتجبس ومنه قواهم اربع على نفسك
  واربع على ظلهك أى ارفق ينفسك وكف والربع فى الحى أن تأخذيوما وتدع يومين ثم تجى
  فى اليوم الرابع تقول منه ربعت عليه الحى وقد ربع الرجل فهو مربوع والربع أيضا النظم:
  تقول منه ربعت الابل فهى روابسع وخوامس وكذلكْ الى العشر وربع أيضا اسم رجل من
  هذيل والربيع عند العرب ربيعان ريع الشهورور بيع الازمنة فربيع الشهورشهران بعد
  صفر ولا يقال فيه الاشهرد بيسع الاول وشهرريع الآخر وأماربيع الازمنة فربيعان
  الربيع الاول وه والفصل الذى تأتى فيه المكمأة والنور وهور بيع الكلا والربيع الثانى
  وهو الفصل الذى تدرد فيه الثمار وفى الناس من يسميه الربيع الأوّل وسمعت أبا الغوث
  يقول العرب تجعل السنستة أزمنة شهران منها الربيع الاوّل وشهران صيف وشهران قيظ
  وشه ران ربيع الثانى وشهران خريف وشهران شتاء وأنتد لسعيد بن مالت بن ضبيعة
  ان بنت صبية صيفيون أفلح من كان له ربعيون
  فيعل الصف بعد الربيع الاوّل وجمع الربيع أربعاه وأربعة مثل نصيب وأنصباء وأنصبة
  قال بعقوب ويجمع ربيع السكلا أربعة وربيع الجداول أربعاء والربيع المطر فى الربيع تقول
  منه ربعت الارض فهى مربوعة والربيع الجدول والمربع منزل القوم فى الربيع خاصة
  تقول هذه مر ابعنا ومصايقنا أى حيث نرتسع ونصيف والنسبة الى الربيع ربعى بكسر الراء
  وكذلك ربعى بن حراش وقواهم ماله هبع ولاربع فالربع الفصيل ينتج فى الربيع وهو أول
  التشاج والجمع رباع وارباع مثل رطب ورطاب وارطاب قال الراجز
  وعلية نازعتهارباعى • وعلبة عند مقيل الراعى
  والاتى ربعة والجمع ربعات فاذانتج فى آخر النتاج فهوهبع والاتى هبعة وربعت القوم
  أر بعهم بالفتح اذاصرت رابعهم أو آخذت ربع الغنيمة وفى الحسديث ألم أجعلك تربع أى
  تأخذ المرباع وقال قطرب المرباع الربع والمعشار العشر ولم يسمع فى غيره-ما وربعت الحجر
  وارمعته اذا أشلته وفى الحديث مربوم يربعون حجراوير تبعون وذلك الحجريسمى ربيعة
  والربيعة أيضابيضة الحديد وربيعة الفرس أبو قبيلة وهو ربيعة بن نزار بن معدّين عسدنان
  وانماخى ربيعة الفرس لانه أعطى من مبراث أبيه الخيل وأعطى أخوه الذهب فسحى
  ٠١٤٨
  صاح
