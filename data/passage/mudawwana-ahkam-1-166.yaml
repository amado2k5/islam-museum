text: "… قال لا الا أن مالكا قال لى فى الذى يتعدى الميقات وهو صرورة ثم يحرم ان عليه الدم فليس يكون ما أوجب على نفسه مما أفسده أوجب مما أوجب اللّه عليه من الفريضة. ومما يبين ذلك أن من أفطر فى …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 166، يرد فيه ذكر الفريضة والفرائض، وما يجب على المكلف، وما حُرّم على الناس؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 166, whose wording mentions the obligation (farida), what is binding on the person addressed, what was forbidden to people; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 166 کا اقتباس جس میں فریضہ اور فرائض، جو مکلف پر واجب ہے، جو لوگوں پر حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 1, p. 166, dont le texte mentionne l'obligation (farida), ce qui s'impose à la personne responsable, ce qui a été interdit aux gens ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mudawwana al-Kubra, volumen digitalizado 1, p. 166, cuyo texto menciona la obligación (farida), lo que obliga a la persona responsable, lo que se prohibió a la gente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Büyük Derleme, Resimli Cilt 1, sayfa 166'dan bir alıntı; zorunlu görevler ve yükümlülükler, sorumlu bireyden beklenenler ve insanlara yasaklananlar; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu görevler, itaat eylemleri, tavsiye edilen eylemler, hoş karşılanmayan eylemler, yasaklanan eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kompendium Agung, Jilid Bergambar 1, halaman 166, yang menyebutkan kewajiban dan tanggung jawab wajib, apa yang dituntut dari individu yang bertanggung jawab, dan apa yang dilarang bagi manusia; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk kewajiban wajib, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa-dosa kecil."
