label: { ar: "الموطأ 686 — عمر بن عبد العزيز في المال المقبوض ظلماً: يرد إلى أهله وتؤخذ منه زكاة واحدة فإنه كان ضماراً", en: "Muwatta 686", es: "Muwatta 686", fr: "Muwatta 686", ur: "موطا 686", tr: "El-Muvatta 686 — Ömer ibn Abdülaziz, haksız yere el konulan para hakkında: Sahiplerine iade edilmeli ve ondan zekât ödenmelidir, çünkü bu kayıp mal olarak kabul edilmiştir.", id: "Al-Muwatta 686 — Umar ibn Abd al-Aziz tentang uang yang dirampas secara tidak adil: Uang itu harus dikembalikan kepada pemiliknya dan satu zakat harus diambil darinya, karena dianggap sebagai harta yang hilang." }
summary:
  ar: "يرويه مالك عن أيوب بن أبي تميمة السختياني، أن عمر بن عبد العزيز كتب في مال قبضه بعض الولاة ظلماً يأمر برده إلى أهله وتؤخذ منه زكاته لما مضى من السنين، ثم عقب بعد ذلك بكتاب ألا يؤخذ منه إلا زكاة واحدة، فإنه كان ضماراً. ويذكر المحقق أن الضمار المال الذي لا يدري صاحبه أيخرج أم لا، وأنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي (4/150). {cite:muwatta-maruf-1997 p.344}"
  tr: "Malik, Eyyub ibn Ebu Teme el-Sakhtiyani'den rivayet ettiğine göre, Ömer ibn Abdülaziz, bazı valiler tarafından haksız yere el konulan mallar hakkında yazmış ve bunların hak sahiplerine iade edilmesini ve geçmiş yıllara ait zekâtın ödenmesini emretmiştir. Ardından, \"dammar\" (sahipsiz mal) olarak kabul edildiği için sadece bir zekât ödemesinin alınması gerektiğini belirten başka bir mektup yazmıştır. Araştırmacı, \"dammar\"ın sahibinin tahsil edilip edilmeyeceğini bilmediği mal anlamına geldiğini ve bu rivayetin Malik'ten Ebu Musab ve Yahya ibn Bukayr aracılığıyla, el-Beyhaki (4/150) tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.344}"
  id: "Malik meriwayatkannya dari Ayyub ibn Abi Tamimah al-Sakhtiyani, bahwa Umar ibn Abd al-Aziz menulis tentang harta yang dirampas secara tidak adil oleh beberapa gubernur, memerintahkan pengembaliannya kepada pemiliknya yang sah dan pembayaran zakat untuk tahun-tahun sebelumnya. Kemudian ia melanjutkan dengan surat lain yang menetapkan bahwa hanya satu kali pembayaran zakat yang harus diambil, karena dianggap sebagai \"dammar\" (sejenis harta tak bertuan). Peneliti menyebutkan bahwa \"dammar\" merujuk pada harta yang pemiliknya tidak tahu apakah akan diambil atau tidak, dan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus'ab dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (4/150). {cite:muwatta-maruf-1997 p.344}"
