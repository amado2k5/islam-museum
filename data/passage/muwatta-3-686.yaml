label: { ar: "الموطأ 686 — عمر بن عبد العزيز في المال المقبوض ظلماً: يرد إلى أهله وتؤخذ منه زكاة واحدة فإنه كان ضماراً", en: "Muwatta 686" }
summary:
  ar: "يرويه مالك عن أيوب بن أبي تميمة السختياني، أن عمر بن عبد العزيز كتب في مال قبضه بعض الولاة ظلماً يأمر برده إلى أهله وتؤخذ منه زكاته لما مضى من السنين، ثم عقب بعد ذلك بكتاب ألا يؤخذ منه إلا زكاة واحدة، فإنه كان ضماراً. ويذكر المحقق أن الضمار المال الذي لا يدري صاحبه أيخرج أم لا، وأنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي (4/150). {cite:muwatta-maruf-1997 p.344}"
