text: "… روى عنه عَبَاية بن رِفَاعة بن رَافِع بن خَدِيج. وكان وشهد الجمل مع عائشة، وكان صِهْرَ عثمان، بكتب بالعَرَبِيِّ قبل الإسلام. تزوج مَرْيَم ابنةً عثمان. وهو ممن أمَرّه عثمان أن أخبرنا مسمار بن عمر بن العويس وأبو الفرج يَكْتُبَ المصاحف …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 757، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 757, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 757 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Usd al-Ghaba de Ibn al-Athir, volumen 2, pág. 757, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 2, p. 757), mentionne la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin resimli 2. cildinin 757. sayfasından bir alıntı, Kur'an'ın derlenmesini ve el yazmalarını, ayrıca çeşitli yazı biçimlerini ve yazım yöntemlerini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, Kur'an okunuşları, yazı biçimi, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 2 bergambar, halaman 757, menyebutkan penyusunan Al-Qur'an dan manuskrip-manuskripnya, serta berbagai jenis aksara dan metode penulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
