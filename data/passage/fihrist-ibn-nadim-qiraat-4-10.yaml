text: "فِهْرسْت المَوْضُوعَات صفحة تَسْمِيّةُ الكُتُب التي ألَّفَها العُلَمَاءُ في قِرَاءَتِه أَسْمَاءُ قُرَّاءِ الشَّوَاذِ وأَنْسَابُ القِرَاءَات... أَهْلُ المَدينَة.... أهْلُ مَكَّة أهْلُ البَصْرَة أهْلُ الكُوفَة أهْلُ الشَّام أَهْلُ اليَمَن أَهْلُ بَغْدَاد.... خَلَفُ بن هِشَام ابْنُ مُجَاهِد ابْنُ شَنَبُوذ ذِكْرُ شيءٍ ممَّا قَرَأْ …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 4، ص 10، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 4, p. 10, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 4، ص 10 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 4, pág. 10, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du *Fihrist* d'Ibn al-Nadim (tome 4, page 10) mentionne les lectures du Coran et les lecteurs; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "İbn el-Nadim'in Fihrist adlı eserinin 4. cildinin 10. sayfasından, Kur'an okunuşları ve okuyucularından bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Volume 4, halaman 10, yang menyebutkan bacaan dan para qari Al-Quran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
