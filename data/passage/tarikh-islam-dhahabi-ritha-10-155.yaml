text: "… سُوِّي عَمرو بعبد العزيز في سلطاننا وهو ابن عمّنا، ألا وهو أشرف منه، ثم خطب ابنة عَمروٍ وتزوّج بها، وكان عبد العزيز جواداً ممدَّحاً. تُوُفِّي برصافة هشام بن عبد الملك زائراً له، فرثاه أبو صخر الهُذَليّ بأبياتٍ. - عبد العزيز …"
summary:
