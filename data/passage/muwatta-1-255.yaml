label: { ar: "الموطأ 255 — ابن عمر في النسيان في الصلاة: ليتوخ ما يظن أنه نسي", en: "Muwatta 255", es: "Muwatta 255", fr: "Muwatta 255", ur: "موطا 255", tr: "Al-Muwatta 255 — İbn Umar namazda unutkanlık hakkında: Unuttuğunu sandığı şey konusunda dikkatli olmalıdır.", id: "Al-Muwatta 255 — Ibnu Umar tentang kelupaan dalam salat: Hendaknya ia berhati-hati terhadap apa yang menurutnya telah ia lupakan." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب إتمام المصلي ما ذكر إذا شك في صلاته: كان عبد الله بن عمر إذا سُئل عن النسيان في الصلاة قال: ليتحرّ أحدكم الذي يظن أنه نسي من صلاته فليصله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.151}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, namazda unutulan şeyleri tamamlama bölümünde şöyle denmektedir: Abdullah ibn Umar'a namazda unutkanlık sorulduğunda, \"Aranızdan biri namazda neyi unuttuğunu düşünsün ve onu yerine getirsin\" derdi. Araştırmacı, bu hadisin Malik'ten rivayetle Ebu Mus'ab, Suveyd ve İbn Vahb tarafından el-Tahavi'nin derlemesinde, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından ise el-Beyhakî'nin derlemesinde nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.151}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’, dalam bab tentang melengkapi apa yang terlupakan dalam salat: Ketika Abdullah ibn Umar ditanya tentang kelupaan dalam salat, beliau berkata: “Hendaklah salah seorang di antara kalian berusaha menentukan apa yang menurutnya telah terlupakan dalam salatnya dan melaksanakannya.” Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, dan Ibn Wahb dalam kumpulan al-Tahawi, dan oleh Muhammad ibn al-Hasan dan Yahya ibn Bukayr dalam kumpulan al-Bayhaqi. {cite:muwatta-maruf-1997 p.151}"
