label: { ar: "الموطأ 255 — ابن عمر في النسيان في الصلاة: ليتوخ ما يظن أنه نسي", en: "Muwatta 255" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب إتمام المصلي ما ذكر إذا شك في صلاته: كان عبد الله بن عمر إذا سُئل عن النسيان في الصلاة قال: ليتحرّ أحدكم الذي يظن أنه نسي من صلاته فليصله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.151}"
