text: "… بن زياد الألهاني وشرحبيل بن مسلم عن أبي أُمامة: أنه كان لا يمرُّ بمسلم، ولا يهوديّ، ولا نصراني إلا بدأه بالسلام. - حدثنا إسماعيل بن عياش عن ابن عجلان: أن عبدالله، وأبا الدرداء، وفضالة بن عُبيد كانوا يبدؤون أهل الشرك …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 5650، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 5650, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 5650 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
