text: "… مكة: إِن هذا البلد حرَّمه الله يوم خلق السموات والأرض والشمس والقمر ووضع هذين الأخْشَبَيْنِ، فهو حرام بحزمَةِ اللّٰه تعالى إلى يوم القيامة، وإنه لم يحل القتال فيه لأَحدٍ قَبْلي ولا يحل لأَحد بَعْدِي، ولم يحل لي إِلا ساعة من …"
