text: "… التى لا أبن فيها. كذا بالأصل، ومتعثر على هذه النسبة، فلعله الهدلى بالباء أو الهدى بدون لام. فى اليان والنيين : متدلا. الأدر : جع آدرة وهو من به الأدرة وهى انتفاخ الخصية بما، يصيبها كذا فى شرح ديوان طرفة …"
