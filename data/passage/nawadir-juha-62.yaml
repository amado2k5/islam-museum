text: "… نقطة من عرق حماد رَأَوْا على ثياب جحا نقطة حبر سوداءَ فسألوه عنها فقال: لا أدري، ولكن أتذكر أن تلميذي حمَّاداً الحبشي جاءَني أمسِ عرقاناً فقبّل يدي وأظنُّها نقطةً من عرقه. لا تسموا أولادكم أيوب طلع على المنبر يوماً وقال: …"
summary:
  ar: "رأى الناس بقعة حبر على ثياب جحا، فقال إنها ربما عرق تلميذه حماد الحبشي الذي قبّل يده في اليوم السابق. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  en: "People see an ink spot on Juha's clothes; he says it is probably the sweat of his pupil Hammad the Abyssinian, who kissed his hand the day before. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  ur: "لوگوں نے جحا کے کپڑوں پر سیاہی کا دھبا دیکھا، تو اس نے کہا کہ یہ شاید اس کے شاگرد حماد حبشی کا پسینہ ہے جس نے ایک دن پہلے اس کا ہاتھ چوما تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  fr: "Les gens voient une tache d'encre sur les vêtements de Juha ; il dit que c'est probablement la sueur de son élève Hammad l'Abyssin, qui lui a baisé la main la veille. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  es: "La gente ve una mancha de tinta en la ropa de Juha; él dice que probablemente es el sudor de su alumno Hammad el abisinio, que le besó la mano el día anterior. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  tr: "İnsanlar Juha'nın kıyafetlerinde bir mürekkep lekesi gördüler ve o da bunun muhtemelen bir gün önce elini öpen öğrencisi Hammad al-Habashi'nin terinden kaynaklandığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 36}"
  id: "Orang-orang melihat noda tinta di pakaian Juha, dan dia mengatakan itu mungkin keringat muridnya, Hammad al-Habashi, yang telah mencium tangannya sehari sebelumnya. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
