label: { ar: "الموطأ 1646 — مالك: إذا فارق الرجل امرأته فراقا باتا ثم أنكر حملها، لاعنها إذا كانت حاملا يشبه أن يكون الحمل منه", en: "Muwatta 1646" }
summary:
  ar: "يقول مالك إذا فارق الرجل امرأته فراقا باتا، ليس له عليها فيه رجعة، ثم أنكر حملها، لاعنها إذا كانت حاملا، وكان حملها يشبه أن يكون منه إذا ادعته، ما لم يأت دون ذلك من الزمان الذي يشك فيه، فلا يعرف أنه منه. قال فهذا الأمر عندنا. {cite:muwatta-maruf-1997 p.79}"
