label: { ar: "الموطأ 1646 — مالك: إذا فارق الرجل امرأته فراقا باتا ثم أنكر حملها، لاعنها إذا كانت حاملا يشبه أن يكون الحمل منه", en: "Muwatta 1646", es: "Muwatta 1646", fr: "Muwatta 1646", ur: "موطا 1646", tr: "El-Muvatta 1646 — Malik: Bir adam karısını geri dönülmez bir şekilde boşadıktan sonra onun hamileliğini inkar ederse, eğer kadın hamile ise ve hamileliğin kendisinden olma ihtimali varsa, ona lanet okumalıdır.", id: "Al-Muwatta 1646 — Malik: Jika seorang pria menceraikan istrinya secara mutlak dan kemudian mengingkari kehamilannya, maka ia harus mengutuk istrinya jika istrinya hamil dan kemungkinan besar kehamilan itu berasal darinya." }
summary:
  ar: "يقول مالك إذا فارق الرجل امرأته فراقا باتا، ليس له عليها فيه رجعة، ثم أنكر حملها، لاعنها إذا كانت حاملا، وكان حملها يشبه أن يكون منه إذا ادعته، ما لم يأت دون ذلك من الزمان الذي يشك فيه، فلا يعرف أنه منه. قال فهذا الأمر عندنا. {cite:muwatta-maruf-1997 p.79}"
  tr: "Malik şöyle dedi: Bir erkek karısını geri dönülmez bir şekilde, uzlaşma imkanı olmaksızın boşadıktan sonra, hamileliğini inkar ederse, eğer kadın hamile ise ve hamileliğin onun çocuğu olma ihtimali varsa, Allah'ın lanetini ona yöneltmelidir; ancak hamileliğin onun çocuğu olup olmadığını belirleyebilmesi için belirli bir süre geçmesi gerekir. Şöyle dedi: Bu, bizim mezhebimize göre hükümdür. {cite:muwatta-maruf-1997 s.79}"
  id: "Malik berkata: Jika seorang pria menceraikan istrinya secara mutlak, tanpa kemungkinan rekonsiliasi, dan kemudian menyangkal kehamilannya, maka ia harus memohon kutukan Allah atas istrinya jika ia hamil dan kehamilan tersebut tampaknya adalah anaknya jika istrinya mengakuinya, kecuali jika telah berlalu beberapa waktu sebelum ia dapat memastikan apakah itu anaknya. Ia berkata: Inilah hukum menurut mazhab kami. {cite:muwatta-maruf-1997 p.79}"
