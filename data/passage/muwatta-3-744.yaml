label: { ar: "الموطأ 744 — مالك: القطنية صنف واحد: الحمص والعدس واللوبيا والجلبان وكل ما عرفه الناس قطنية", en: "Muwatta 744" }
summary:
  ar: "قول لمالك: وكذلك القطنية صنف واحد مثل الحنطة والتمر والزبيب وإن اختلفت أسماؤها وألوانها، والقطنية الحمص والعدس واللوبيا والجلبان وكل ما ثبتت معرفته عند الناس أنه قطنية، فإذا حصد الرجل من ذلك خمسة أوسق بصاع النبي، وإن كان من أصناف القطنية كلها لا من صنف واحد، جُمع بعضه إلى بعض وعليه فيه الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند أبي عبيد في الأموال (1395). {cite:muwatta-maruf-1997 p.370}"
