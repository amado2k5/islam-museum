label: { ar: "الموطأ 744 — مالك: القطنية صنف واحد: الحمص والعدس واللوبيا والجلبان وكل ما عرفه الناس قطنية", en: "Muwatta 744", es: "Muwatta 744", fr: "Muwatta 744", ur: "موطا 744", tr: "Al-Muwatta 744 — Malik: Baklagiller tek çeşittir: nohut, mercimek, bezelye, baklagil olarak bilinen her şey.", id: "Al-Muwatta 744 — Malik: Kacang-kacangan hanya satu jenis: buncis, lentil, kacang panjang, kacang polong, dan semua yang dikenal orang sebagai kacang-kacangan." }
summary:
  ar: "قول لمالك: وكذلك القطنية صنف واحد مثل الحنطة والتمر والزبيب وإن اختلفت أسماؤها وألوانها، والقطنية الحمص والعدس واللوبيا والجلبان وكل ما ثبتت معرفته عند الناس أنه قطنية، فإذا حصد الرجل من ذلك خمسة أوسق بصاع النبي، وإن كان من أصناف القطنية كلها لا من صنف واحد، جُمع بعضه إلى بعض وعليه فيه الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند أبي عبيد في الأموال (1395). {cite:muwatta-maruf-1997 p.370}"
  tr: "Malik şöyle demiştir: “Miras, isimleri ve renkleri farklı olsa bile, buğday, hurma ve kuru üzüm gibi tek bir kategori olarak kabul edilir. Miras, nohut, mercimek, bezelye ve baklagiller de dahil olmak üzere, yaygın olarak baklagiller olarak bilinen her şeyi kapsar. Bir kimse, Peygamberimizin sa’ (kuru ölçü birimi) ölçüsünü kullanarak, bunlardan beş vask (kuru ölçü birimi) hasat ederse, bu sadece bir baklagil türünden değil, tüm baklagil türlerinden olsa bile, hepsi birlikte toplanır ve zekâtı verilir.” Araştırmacı, bunun Ebu Musab ve Yahya ibn Bukayr tarafından Ebu Ubeyd'in servet üzerine kitabında (1395) Malik'ten rivayet edildiğini belirtmektedir."
  id: "Malik berkata: “Warisan dianggap sebagai satu kategori, seperti gandum, kurma, dan kismis, meskipun nama dan warnanya berbeda. Warisan meliputi buncis, lentil, kacang panjang, dan kacang polong—apa pun yang umumnya dikenal sebagai kacang-kacangan. Jika seseorang memanen lima wasq (satuan ukuran kering) dari kacang-kacangan ini, menggunakan satuan sa' Nabi (satuan ukuran kering), meskipun itu dari semua jenis kacang-kacangan dan bukan hanya satu, maka semuanya dikumpulkan bersama, dan zakat wajib dibayarkan atasnya.” Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Yahya ibn Bukayr dalam kitab Abu Ubayd tentang kekayaan (1395)."
