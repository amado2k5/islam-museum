text: |-
  *اقتل) •)
  ٢F٩
  على الانف وقد قبلت عينه وأقبلتها أنا ورجل أقبل بين القبل وهوالذى كانه ينظر الى طرف
  أنقه قالت الخنساء
  ولما أن رأيت اخيل بلا • تبارى بانطد ود شبا العوالى
  وشاة قبلاء ينة القبل وهى التى أقبل قرناها على وجهها والقبل أيضا أن تشرب الابل الماه
  وهو يصب على رؤسها ولم يكن اها قبل ذلك شوتكلم فلان قبلافأياد وهو أن يتسكلم ولم
  يستعده الاصمعى ترجزته قبلااذا أنشدته رجز الم تكن أعددته والقبل أيضاجع قبلة وهى
  الفلكة وهى أيضاضرب من الخرز يؤخذيم اوتقول الساحرة باقبلة اقبايه ور بماعاقت
  فى عنق الداية تدفع بها العين ورأيته قب لا وقبلا بالضم أى مقابلة وعيانا ورأيته قبلا بكسر
  القاف قال اللٰه تعالى أوياً تيهسم العذاب قبلا أى عيانا ولى قبل فلان حق أى عندم ولا أكلمك
  الى مشر من ذى قبل أى فيما استأنف ومالى به قبل أى طاقة والقابلة من النساء معروفة
  يقال قبلت القابلة المرأة تقبلها قبالة اذاقبلت الولد أى تلقته عقد الولادة وكذلك قبل الرجل
  الدلومن المستق قبولا فهو قابل والقبيل والقبول القابلة قال الاعشى
  كصرخة حبلى أسلتها قبيلها* ويروى قبولها أى يئست منها والقبيل الكفيل والعريف
  وقد قبل به يقبل ويقبل قبالة ونحن فى قبالله أى فى عرافته والقبيل الجهاعة تسكون من الثلاثة
  فصاعدا من قوم شق مثل الروم والزفج والعرب والجمع قبل وقوله تعالى وحشرنا عليهم كل شئ
  قبلا قال الاخفس أى قبيلا وقال الحسن عيانا والقبيلة واحدة قبائل الرأس وهى القطع
  لمشغوب بعضها الى بعض تصل بها الشوْن وبها سميت قبائل العرب والواحدة قبيلة وهم بئو
  أب واحد والقبيل ما أقبات به المرأة من غزلها حين تفتله ومنه قيل ما يعرف قبسلا من دبير
  وأقبل نقيض أدبر يقال أقبل مقبلا مثل أدخلى مدخل صدق وفى الحديث سئل الحسن
  عن مقبله من العراف وأقبل عليه بوجهه وأقبلت الفعل مثل قابلتها أى جعات لهاقبالا
  وأقبلته السى أى جعلته يلى قبالته يقال أقبلنا الرماح غحوالقوم وأقبلت الابل أفواه
  الوادى والمقابلة المواجهة والتقابل منله ورجلمتقابل أى كريم النسب من قبل أبويه ود
  قوبل وقال ان كنت فى بكرتمت خولة • فأنا المقابل من ذوى الاعمام
  واقتبل أمره أى استأنفه ورجل مقتبل الشباب اذالم يبن فيه أثركبر واقتبل الخطبة أى
  ارتجلها والاستقبال ضد الاستدبارومقا بهذ الكتاب معارضته وشاقمقابلة قطعت
  من أذتها قطعة لم تين وتركت معلقة من قدم فان كانت من أخرهى مدابرة ⁦(قتل )⁩. القتل
  معروف وقتله قتلا وتقنالا وقتلد قتلة سو بالكسرومقائل الانسان المواضع التى اذا
  صيعت قتلته يقال مقتل الرجل بين فكيه وقتات الشئ خبرا قال اقه تعالى وماقتلوه
  بقينا أى لم عهيطوا به علما وقتات الشراب عزجته بالماه قال حسان
  انّ انتى ناولتنى فرددتها * قتلت قتلت فهابم الم نقتل
  والمقائلة القتال وة-د قاتلته قتالا وقيتا لا وهومن كلام العرب والمقائلة بكسر الساء القوم
  الذين يصلمون للقتال والقتل بالسكسر العدة وقال
  واغترابي عن عامى بن لوعة * فى بلاد كثيرة الاقتال
  ٨•
