text: "… قال: أن يموت فأحتسبه. عن جعفر قال: قيل لسعيد: من أعبد الناس؟ قال: رجل اجترح من الذنوب، فكلما ذكر ذنوبه احتقر عمله. مقتل سعيد بن جبير قال المصنف: كان سعيد بن جبير فيمن خرج على الحَجَّاج من القُرَّاء، وشهد دير …"
