summary:
  ar: "القسم 2 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصلاة»، ويضم فيها النصوص من 667 إلى 705 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 2 of Sunan Ibn Majah (The Book of the Prayer) in the division of the open hadith dataset the museum took its reports from: reports 667 to 705 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 2، عنوان «کتاب الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 667 تا 705۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El Libro 2 de Sunan Ibn Majah (El Libro de la Oración) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 667 al 705 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Ibn Majah (Livre 2), soit les hadiths 667 à 705, de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan İbn Majah'ın 2. bölümü \"Namaz Kitabı\" başlığını taşımakta olup, 667'den 705'e kadar olan metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 2 dari Sunan Ibn Majah, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Shalat\" dan berisi teks 667 hingga 705, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
