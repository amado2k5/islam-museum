label: { ar: "الموطأ 2232 — مالك عن يحيى بن سعيد: كتب أبو الدرداء إلى سلمان الفارسي: هلم إلى الأرض المقدسة، فكتب إليه سلمان: إن الأرض لا تقدس أحدا، وإنما يقدس الإنسان عمله، وقد بلغني أنك جعلت طبيبا تداوي، فاحذر أن تقتل إنسانا فتدخل النار", en: "Muwatta 2232", es: "Muwatta 2232", fr: "Muwatta 2232", ur: "موطا 2232", tr: "El-Muvatta 2232 — Malik, Yahya ibn Sa’id’den rivayetle: Ebu el-Darda’, Salman el-Farisi’ye şöyle yazdı: “Kutsal Topraklara gel.” Salman ona şöyle cevap verdi: “Toprak kimseyi kutsal kılmaz; aksine, insanı kutsal kılan amelleridir. Senin hekim olduğunu duydum, sakın birini öldürüp cehenneme girme.”", id: "Al-Muwatta 2232 — Malik, berdasarkan riwayat Yahya ibn Sa’id: Abu al-Darda’ menulis kepada Salman al-Farisi: Datanglah ke Tanah Suci. Salman membalasnya: Tanah itu tidak menyucikan siapa pun; melainkan amal perbuatan seseoranglah yang menyucikannya. Aku telah mendengar bahwa engkau telah menjadi seorang tabib, maka berhati-hatilah agar engkau tidak membunuh seseorang dan masuk ke dalam api neraka." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا الدرداء كتب إلى سلمان الفارسي: هلم إلى الأرض المقدسة. فكتب إليه سلمان: إن الأرض لا تقدس أحدا، وإنما يقدس الإنسان عمله، وقد بلغني أنك جعلت طبيبا تداوي، فإن كنت تبرئ فنعما لك، وإن كنت متطببا فاحذر أن تقتل إنسانا فتدخل النار. ويذكر المحقق أن معنى طبيب في الأثر قاض، أي جعلت قاضيا. فكان أبو الدرداء إذا قضى بين اثنين ثم أدبرا عنه، نظر إليهما، وقال: ارجعا إلي، أعيدا علي قصتكما. {cite:muwatta-maruf-1997 p.318} {cite:muwatta-maruf-1997 p.319}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ebu el-Darda'nın Salman el-Farisi'ye şöyle yazdığını aktarır: \"Kutsal Topraklara gel.\" Salman şöyle cevap verdi: \"Toprak kimseyi kutsal kılmaz; onu kutsal kılan amelleridir. Senin hekim olduğunu duydum ve eğer şifa verirsen, sana hamd olsun. Ama sadece tıp uyguluyorsan, birini öldürüp cehenneme girmemeye dikkat et.\" Araştırmacı, bu rivayette \"hekim\" kelimesinin \"hakim\" anlamına geldiğini, yani \"hakim oldun\" demek olduğunu belirtiyor. Dolayısıyla, Ebu el-Darda iki kişi arasında hüküm verdiğinde ve onlar ondan yüz çevirdiğinde, onlara bakıp şöyle derdi: \"Bana geri dönün ve anlattıklarınızı tekrarlayın.\""
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Abu al-Darda' menulis kepada Salman al-Farisi: \"Datanglah ke Tanah Suci.\" Salman menjawab: \"Tanah itu tidak menyucikan siapa pun; melainkan, amal perbuatanlah yang menyucikannya. Aku telah mendengar bahwa engkau telah menjadi seorang tabib, dan jika engkau menyembuhkan, maka pujian bagimu. Tetapi jika engkau hanya mempraktikkan pengobatan, maka berhati-hatilah jangan sampai engkau membunuh seseorang dan masuk ke dalam api neraka.\" Peneliti mencatat bahwa arti \"tabib\" dalam riwayat ini adalah \"hakim,\" yang berarti \"engkau telah menjadi hakim.\" Jadi, ketika Abu al-Darda' menghakimi dua orang dan mereka berpaling darinya, dia akan memandang mereka dan berkata: \"Kembalilah kepadaku dan ulangi kisahmu.\""
