label: { ar: "الموطأ 2232 — مالك عن يحيى بن سعيد: كتب أبو الدرداء إلى سلمان الفارسي: هلم إلى الأرض المقدسة، فكتب إليه سلمان: إن الأرض لا تقدس أحدا، وإنما يقدس الإنسان عمله، وقد بلغني أنك جعلت طبيبا تداوي، فاحذر أن تقتل إنسانا فتدخل النار", en: "Muwatta 2232" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا الدرداء كتب إلى سلمان الفارسي: هلم إلى الأرض المقدسة. فكتب إليه سلمان: إن الأرض لا تقدس أحدا، وإنما يقدس الإنسان عمله، وقد بلغني أنك جعلت طبيبا تداوي، فإن كنت تبرئ فنعما لك، وإن كنت متطببا فاحذر أن تقتل إنسانا فتدخل النار. ويذكر المحقق أن معنى طبيب في الأثر قاض، أي جعلت قاضيا. فكان أبو الدرداء إذا قضى بين اثنين ثم أدبرا عنه، نظر إليهما، وقال: ارجعا إلي، أعيدا علي قصتكما. {cite:muwatta-maruf-1997 p.318} {cite:muwatta-maruf-1997 p.319}"
