label: { ar: "الموطأ 1944 — مالك: لا ينبغي بيع الإناث واستثناء ما في بطونها، كأن يقول الرجل: ثمن شاتي الغزيرة ثلاثة دنانير، فهي لك بدينارين ولي ما في بطنها، فهذا مكروه لأنه غرر ومخاطرة", en: "Muwatta 1944", es: "Muwatta 1944", fr: "Muwatta 1944", ur: "موطا 1944", tr: "El-Muvatta 1944 — Malik: Dişi hayvanları satıp rahimlerindeki yavruları dışarıda bırakmak caiz değildir. Bir adamın şöyle demesi gibi: \"Doğurgan koyunlarımın fiyatı üç dinar, iki dinara sizin olsunlar, rahimlerindeki yavruları ise kendime saklarım.\" Bu, aldatma ve risk içerdiği için mekruhtur.", id: "Al-Muwatta 1944 — Malik: Tidak diperbolehkan menjual perempuan dan mengambil janin yang ada di dalam kandungannya, seolah-olah seorang laki-laki berkata: Harga domba betina saya yang beranak adalah tiga dinar, maka domba itu menjadi milikmu dengan harga dua dinar dan saya mengambil janin yang ada di dalam kandungannya. Hal ini tidak disukai karena mengandung penipuan dan risiko." }
summary:
  ar: "قال مالك: ولا ينبغي بيع الإناث واستثناء ما في بطونها، وذلك أن يقول الرجل للرجل: ثمن شاتي الغزيرة ثلاثة دنانير، فهي لك لدينارين، ولي ما في بطنها. فهذا مكروه، لأنه غرر ومخاطرة. {cite:muwatta-maruf-1997 p.195}"
  tr: "Malik şöyle demiştir: Dişi hayvanları satıp, rahimlerindeki yavruları dışarıda bırakmak caiz değildir. Örneğin, bir adamın diğerine, \"Doğum yapan koyunumun fiyatı üç dinar, iki dinara senin olsun, rahimdeki yavruyu ben alayım\" demesi gibi. Bu, belirsizlik ve risk içerdiği için hoş karşılanmaz. {cite:muwatta-maruf-1997 s.195}"
  id: "Malik berkata: Tidak diperbolehkan menjual hewan betina dan mengambil janinnya, seperti ketika seorang pria berkata kepada pria lain: Harga domba betina saya yang melahirkan adalah tiga dinar, jadi Anda bisa mendapatkannya dengan harga dua dinar, dan saya akan mengambil janinnya. Hal ini tidak disukai karena mengandung ketidakpastian dan risiko. {cite:muwatta-maruf-1997 p.195}"
