text: "… النَّاسُ البَقَرَة: وهذه المخالفة من أركانِ الحجُّ باتفاق المسلمين، فالأمُور التي نُخَالِفُ فيها المشركين هي الواجبُ أو المستحبُّ، ليس فيها مكروه، فكيف يكون فيها محرم، وكيف يُقال: إن النبيَّ وَليفِ أمر أصحابه بِنُسُكٍ يُخالِفُ نُسُكَ المشركين، مع كون الذي نهاهم …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 251، يرد فيه ذكر الواجب، والمستحب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
