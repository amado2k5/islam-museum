text: "… : انك شاب عاقل لا تهمك وقد كنت تكتب الوحى لرسول اللّٰه فاجمعه! قال زيد: فو اللّه ! لثن كلفونى نقل جيل من الجبال ما كان بأثقل علىّ مما أمركَى به من جمع القرآن. فقلت : كيف تفعلون شيئا لم …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 3، ص 359، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 3, p. 359, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 3، ص 359 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 3, pág. 359, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 3, page 359, mentionne la collection du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Kandahlawi'nin \"Sahabelerin Hayatları\" adlı eserinin 3. cildinin 359. sayfasında, Kur'an'ın derlenmesi ve el yazmaları hakkında bilgi veren bir bölüm yer almaktadır; bu bölüm, makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu bölüm, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Kandahlawi, \"Kehidupan Para Sahabat,\" Jilid 3, halaman 359, menyebutkan penyusunan Al-Qur'an dan manuskripnya; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
