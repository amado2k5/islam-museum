label: { ar: "صحيح مسلم 217 — الأب والأبوة، النسب والانتساب", en: "Sahih Muslim 217 — the father and fatherhood; paternity and lineage", ur: "صحیح مسلم 217 — باپ اور والدیت، نسب اور انتساب", es: "Sahih Muslim 217 — El padre y la paternidad; paternidad y linaje", fr: "Sahih Muslim 217 — le père et la paternité; la paternité et la lignée", tr: "Sahih Muslim 217 — Baba ve babalık, soy ve bağlılık", id: "Sahih Muslim 217 — Ayah dan peran ayah, garis keturunan dan afiliasi" }
text: "… عَنِ ابْنِ بُرَيْدَةَ، عَنْ يَحْيَى بْنِ يَعْمَرَ، أَنَّ أَبَا الأَسْوَدِ، حَدَّثَهُ عَنْ أَبِي ذَرٍّ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" لَيْسَ مِنْ رَجُلٍ ادَّعَى لِغَيْرِ أَبِيهِ وَهُوَ يَعْلَمُهُ إِلاَّ كَفَرَ وَمَنِ ادَّعَى مَا لَيْسَ لَهُ فَلَيْسَ مِنَّا وَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ وَمَنْ دَعَا رَجُلاً بِالْكُفْرِ أَوْ قَالَ عَدُوَّ اللَّهِ. وَلَيْسَ كَذَلِكَ إِلاَّ حَارَ عَلَيْهِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 217، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 217 (The Book of Faith), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 217، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 217 (El Libro de la Fe), menciona al padre y la paternidad, la genealogía y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Le Sahih Muslim, n° 217 (Le Livre de la Foi), mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sahih Müslim'de 217 numaralı hadis, babalık, soy ve atalık kavramlarından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 217, menyebutkan tentang ayah, garis keturunan, dan leluhur. Peramban \"Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang subjek tersebut."
