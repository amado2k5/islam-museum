label: { ar: "جامع الترمذي 805 — المرض والمريض، عيادة المريض", en: "Jami' al-Tirmidhi 805 — illness and the sick; visiting the sick", ur: "جامع ترمذی 805 — بیماری اور بیمار، بیمار کی عیادت" }
text: "… لِحَاجَةِ الإِنْسَانِ وَاجْتَمَعُوا عَلَى هَذَا أَنَّهُ يَخْرُجُ لِقَضَاءِ حَاجَتِهِ لِلْغَائِطِ وَالْبَوْلِ. ثُمَّ اخْتَلَفَ أَهْلُ الْعِلْمِ فِي عِيَادَةِ الْمَرِيضِ وَشُهُودِ الْجُمُعَةِ وَالْجَنَازَةِ لِلْمُعْتَكِفِ فَرَأَى بَعْضُ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ أَنْ يَعُودَ الْمَرِيضَ وَيُشَيِّعَ الْجَنَازَةَ وَيَشْهَدَ الْجُمُعَةَ إِذَا اشْتَرَطَ ذَلِكَ. وَهُوَ قَوْلُ سُفْيَانَ الثَّوْرِيِّ وَابْنِ الْمُبَارَكِ. وَقَالَ بَعْضُهُمْ لَيْسَ لَهُ أَنْ يَفْعَلَ شَيْئًا مِنْ هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 805، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 805 (The Book on Fasting), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 805، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
