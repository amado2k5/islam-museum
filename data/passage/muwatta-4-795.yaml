label: { ar: "الموطأ 795 — أبو بكر بن عبد الرحمن عند مروان: ذُكر له أن أبا هريرة يقول من أصبح جنباً أفطر، فأرسل إلى عائشة وأم سلمة فأنكرتا", en: "Muwatta 795", es: "Muwatta 795", fr: "Muwatta 795", ur: "موطا 795", tr: "El-Muvatta 795 — Ebu Bekr ibn Abdülrahman, Mervan'ın evinde: Ona, Ebu Hurayra'nın, \"Kim ritüel kirlilik halinde uyanırsa orucunu bozmuştur\" dediği bildirildi. Bunun üzerine Ayşe ve Ümmü Seleme'yi çağırdı ve onlar bunu yalanladılar.", id: "Al-Muwatta 795 — Abu Bakr ibn Abd al-Rahman, di rumah Marwan: Diceritakan kepadanya bahwa Abu Hurayrah berkata, “Siapa pun yang bangun dalam keadaan najis berarti puasanya batal.” Maka ia memanggil Aisyah dan Umm Salamah, dan mereka mengingkarinya." }
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن، أنه سمع أبا بكر بن عبد الرحمن يقول: كنت أنا وأبي عند مروان بن الحكم، وهو أمير المدينة، فذكر له أن أبا هريرة يقول من أصبح جنباً أفطر ذلك اليوم. فأقسم مروان أن يذهب عبد الرحمن إلى أم المؤمنين عائشة وأم سلمة. فذهب وذهب معه، فسألتا، فقالتا: ليس كما قال أبو هريرة، فكان النبي يصبح جنباً من جماع غير احتلام ثم يصوم. ثم جاؤوا مروان فركب عبد الرحمن إلى أبي هريرة بالعقيق، فقال أبو هريرة: لا علم لي بذاك، إنما أخبرنيه مخبر. ويذكر المحقق أن عبارة «زوج النبي» وردت، وأنه رواه عن مالك أبو مصعب (780) وسويد والقعنبي وابن وهب، ويحيل على التمهيد (17/31). {cite:muwatta-maruf-1997 p.391} {cite:muwatta-maruf-1997 p.392}"
  id: "Malik meriwayatkannya dari Sumayy, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, yang mendengar Abu Bakr ibn Abd al-Rahman berkata: “Ayahku dan aku bersama Marwan ibn al-Hakam, yang merupakan gubernur Madinah, ketika dia menyebutkan bahwa Abu Hurayrah berkata, ‘Siapa pun yang bangun dalam keadaan junub (najis secara ritual) telah membatalkan puasanya pada hari itu.’ Maka Marwan bersumpah bahwa Abd al-Rahman harus pergi kepada Ibu-ibu Kaum Beriman, Aisyah dan Umm Salamah. Maka dia pergi, dan Marwan pergi bersamanya. Mereka bertanya, dan mereka berkata, ‘Bukan seperti yang dikatakan Abu Hurayrah. Nabi biasa bangun dalam keadaan junub secara ritual karena hubungan seksual, bukan karena mimpi basah, lalu beliau berpuasa.’ Kemudian mereka datang kepada Marwan, dan Abd al-Rahman menunggang kuda al-Aqiq kepada Abu Hurayrah. Abu Hurayrah berkata, “Saya tidak tahu tentang itu; seseorang memberitahu saya tentang itu.” Editor menyebutkan bahwa frasa “istri Nabi” digunakan, dan bahwa itu diriwayatkan atas otoritas Malik oleh Abu Mus’ab (780), Suwayd, al-Qa’nabi, dan Ibn Wahb, dan dia merujuk pada al-Tamhid (17/31)."
