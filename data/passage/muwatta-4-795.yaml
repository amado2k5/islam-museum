label: { ar: "الموطأ 795 — أبو بكر بن عبد الرحمن عند مروان: ذُكر له أن أبا هريرة يقول من أصبح جنباً أفطر، فأرسل إلى عائشة وأم سلمة فأنكرتا", en: "Muwatta 795" }
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن، أنه سمع أبا بكر بن عبد الرحمن يقول: كنت أنا وأبي عند مروان بن الحكم، وهو أمير المدينة، فذكر له أن أبا هريرة يقول من أصبح جنباً أفطر ذلك اليوم. فأقسم مروان أن يذهب عبد الرحمن إلى أم المؤمنين عائشة وأم سلمة. فذهب وذهب معه، فسألتا، فقالتا: ليس كما قال أبو هريرة، فكان النبي يصبح جنباً من جماع غير احتلام ثم يصوم. ثم جاؤوا مروان فركب عبد الرحمن إلى أبي هريرة بالعقيق، فقال أبو هريرة: لا علم لي بذاك، إنما أخبرنيه مخبر. ويذكر المحقق أن عبارة «زوج النبي» وردت، وأنه رواه عن مالك أبو مصعب (780) وسويد والقعنبي وابن وهب، ويحيل على التمهيد (17/31). {cite:muwatta-maruf-1997 p.391} {cite:muwatta-maruf-1997 p.392}"
