label: { ar: "الموطأ 2556 — مالك: الضرب بالعصا أو الحجر عمدا يوجب القصاص إذا مات", en: "Muwatta 2556", es: "Muwatta 2556", fr: "Muwatta 2556", ur: "موطا 2556", tr: "El-Muvatta 2556 — Malik: Bir sopa veya taşla kasten vurmak, ölümle sonuçlanması halinde misilleme yapılmasını gerektirir.", id: "Al-Muwatta 2556 — Malik: Memukul dengan sengaja menggunakan tongkat atau batu akan memicu pembalasan jika menyebabkan kematian." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه الذي لا اختلاف فيه عندنا: أن الرجل إذا ضرب الرجل بعصا أو رماه بحجر أو ضربه عمدا فمات من ذلك، فإن ذلك هو العمد وفيه القصاص. {cite:muwatta-maruf-1997 p.444}"
  tr: "Malik şöyle dedi: Aramızda fikir birliği olan ve hiçbir ihtilaf bulunmayan konu şudur ki, bir adam başka bir adama sopayla vurursa, taş atarsa veya kasten vurursa ve bunun sonucunda ölürse, bu kasten adam öldürme suçudur ve misilleme yapılması gerekir. {cite:muwatta-maruf-1997 s.444}"
  id: "Malik berkata: Hal yang disepakati dan tidak ada perbedaan pendapat di antara kita adalah bahwa jika seseorang memukul orang lain dengan tongkat, atau melempar batu kepadanya, atau memukulnya dengan sengaja, dan orang tersebut meninggal sebagai akibatnya, maka itu adalah pembunuhan yang disengaja dan pembalasan harus dilakukan. {cite:muwatta-maruf-1997 p.444}"
