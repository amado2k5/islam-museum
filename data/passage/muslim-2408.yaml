label: { ar: "مسلم 2408 — حديث الثقلين عند غدير خم", en: "Muslim 2408 — The Thaqalayn report at Ghadir Khumm" }
text: "قام رسول الله يوما فينا خطيبا بماء يدعى خما بين مكة والمدينة... قال: «ألا وإني تارك فيكم ثقلين: أحدهما كتاب الله هو حبل الله، من اتبعه كان على الهدى ومن تركه كان على ضلالة»"
summary:
  ar: "رواية زيد بن أرقم في كتاب فضائل الصحابة؛ خطب النبي عند ماء خم راجعة من حجة الوداع، فأوصى بكتاب الله ثم قال «وأهل بيتي، أذكركم الله في أهل بيتي». ولما سأله حصين بن سبرة عن حد أهل البيت، قال زيد: هم من حرم الصدقة بعده — آل علي وآل عقيل وآل جعفر وآل عباس."
