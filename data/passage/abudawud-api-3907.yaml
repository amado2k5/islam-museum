label: { ar: "سنن أبي داود 3907 — الأب والأبوة", en: "Sunan Abi Dawud 3907 — the father and fatherhood", ur: "سنن ابی داؤد 3907 — باپ اور والدیت", es: "Sunan Abi Dawud 3907 — El padre y la paternidad", fr: "Sunan Abi Dawud 3907 — Le père et la paternité" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، حَدَّثَنَا عَوْفٌ، حَدَّثَنَا حَيَّانُ، - قَالَ غَيْرُ مُسَدَّدٍ حَيَّانُ بْنُ الْعَلاَءِ - حَدَّثَنَا قَطَنُ بْنُ قَبِيصَةَ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" الْعِيَافَةُ وَالطِّيَرَةُ وَالطَّرْقُ مِنَ الْجِبْتِ \". الطَّرْقُ الزَّجْرُ وَالْعِيَافَةُ الْخَطُّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3907، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3907 (Divination and Omens (Kitab Al-Kahanah Wa Al-Tatayyur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3907، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3907 (Adivinación y Presagios (Kitab Al-Kahanah Wa Al-Tatayyur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3907 (Divination et présages), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
