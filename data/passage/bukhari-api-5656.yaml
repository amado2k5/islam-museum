text: "… الْعَزِيزِ بْنُ مُخْتَارٍ، حَدَّثَنَا خَالِدٌ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّ النَّبِيَّ دَخَلَ عَلَى أَعْرَابِيٍّ يَعُودُهُ ـ قَالَ ـ وَكَانَ النَّبِيُّ إِذَا دَخَلَ عَلَى مَرِيضٍ يَعُودُهُ فَقَالَ لَهُ \" لاَ بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ \". قَالَ قُلْتَ طَهُورٌ، كَلاَّ بَلْ هِيَ حُمَّى تَفُورُ ـ أَوْ تَثُورُ ـ عَلَى شَيْخٍ كَبِيرٍ، تُزِيرُهُ الْقُبُورَ. فَقَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5656، يذكر المرض والمريض، والحمى، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5656 (Patients), that mentions illness and the sick, fever, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5656، جس میں بیماری اور بیمار، بخار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
