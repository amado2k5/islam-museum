label:
  ar: "الترمذي 2549 — قوموا إلى ما أعددت لكم من الكرامة"
  en: "Tirmidhi 2549 — Rise to the honour I have prepared for you"
  ur: "ترمذی 2549 — اٹھو اس عزت کی طرف جو میں نے تمہارے لیے تیار کی ہے"
text: "أن أهل الجنة إذا دخلوها نزلوا فيها بفضل أعمالهم ثم يؤذن في مقدار يوم الجمعة من أيام الدنيا فيزورون ربهم ويبرز لهم عرشه ويتبدى لهم في روضة من رياض الجنة فتوضع لهم منابر من نور ومنابر من لؤلؤ ومنابر من …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2549: قوموا إلى ما أعددت لكم من الكرامة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2549: Rise to the honour I have prepared for you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2549: اٹھو اس عزت کی طرف جو میں نے تمہارے لیے تیار کی ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
