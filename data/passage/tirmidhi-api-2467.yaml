text: "حَدَّثَنَا هَنَّادٌ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ تُوُفِّيَ رَسُولُ اللَّهِ وَعِنْدَنَا شَطْرٌ مِنْ شَعِيرٍ فَأَكَلْنَا مِنْهُ مَا شَاءَ اللَّهُ ثُمَّ قُلْتُ لِلْجَارِيَةِ كِيلِيهِ فَكَالَتْهُ فَلَمْ يَلْبَثْ أَنْ فَنِيَ. قَالَتْ فَلَوْ كُنَّا تَرَكْنَاهُ لأَكَلْنَا مِنْهُ أَكْثَرَ مِنْ ذَلِكَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ. وَمَعْنَى قَوْلِهَا شَطْرٌ تَعْنِي شَيْئًا."
summary:
  ar: "حديث في جامع الترمذي، رقم 2467، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2467 (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara'), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2467، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2467 (Capítulos sobre la descripción del Día del Juicio, Ar-Riqaq y Al-Wara'), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
