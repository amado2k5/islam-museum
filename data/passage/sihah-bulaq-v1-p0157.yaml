text: |-
  ٤٨٤
  ⁦(أشس)⁩
  اخدى لياليلافهيسى هيسى • لا تتعمى الليلة بالتعريس
  قال الاصمعى يقال حل على فلان عسكرهم فهاسهم أى داسهم مثل حاسهم والاهيس الشجاع
  مثل الاحوس والهيسر اسم اداة الفدان كلها
  صل البا س ليأس القنوط وقد ينس من الشئ ييأس وفيه لغة أخرى
  ثمرينس بالكسر فيه-ما وه وشاذ ورجل يؤوس قال المبرد منهم من يددل فى المستقبل من
  الاءالثانية ألفاويقول ياءس وبادس وقال الاصمعى يقال يئس يتس وحسب يحسب ونعم
  نعم بالسكسرفيهنّ وقال أبوزيد عليا مضر يحسب وينعم ويفس بالكسروسفلاها بالفتح
  وقال سيبوبه وهذاعند أصحابنا انمايجى عسلى لغتين يعسن يئس بيأس ويأس ييئس لغتان
  ثم يرصكب منه-مالغة وآما ومق يمق ووفق يفق وورم يرم وولى يلى ووثق يثق وورث يرث
  . فلايجوزفيهنّ الا المكسرلغة واحدة ويئس آيضابمعنى عسلم فى لغة النخع قال مهيم بن ويسسل
  البربوعى
  أقول اهم بالشعب اذ بيسروننى • ألم تيأسوا انى ابن فارس زهدم
  ومنه قوله تعالى أفلم يبيئس الذين آمنوا و آيسه فلان من كَذافاستيأس منه ؟عن أيس
  واتأس أيضاوهو افتعل فأدغم مثل ائعد ⁦( يبس )⁩ اليس بالضم مصدرولك يبس
  الشئ بيبس وفيه لغة أخرى يبس يببس بالسكسر فيهها وهوشاذ واليس بالفتح الدايس يقال
  حطب يبس قال تعلب كانه خلقة قال علقمة ,
  تخشخس أبدان الحديد عليهم * كما خشخشت يبس الحصاد جذوب
  وقال ابن السكيت ه و جمع يابس مثل راكب وركب وقال أبو عبيد فى قول ذى الرمة
  ولم ييق بالخلصاء مماعنت له * من الرطب الاييسما وهجيرها
  ويروى ييسم ابالفتح قال وهم الغتان واليدس بالتحريك المكان يكون رطبائم يببس ومنه قوله
  تعالى فاضرب اه-م طر يقنا فى البحر يبساوية ال أيضاشاة يبراذالم يكن بهالين وييس
  أيضا بالقسكين حكاهما أبو عبيدو بقال أيضا امرأ: يبس لاتنيل خيرا قال الراجز
  الى عجوزشنة الوجه يبس واليبيس من النبات مايبس منه بقال يبر فهو ييس مثل سلم
  فهو سليم وأيبست الارض يبس بقلها عن يعقوب وأيبس القوم أيضا كما يقال أجرزوا من ا
  الارض الجرز والايبسان مالالحم عليه من الساقين والجمع الايابس وتيبيس الشى تجفيفه
  وقد يسته فاتبس وهوافتعل فأدغم فهو متبس عن ابن السراج وتيبيس الما. العرق عن أبى
  عمرووأنشد لبشر بن أبى خازم يصف خيلا
  تزاهامن ييس الماءنهبا * مخالط درة منها غرار
  الغرارانقطاع الدرة يقول تعطى أحيانا وتمنع أحيانا وانما قال شهبالان العرق عليها يجف
