text: "… عمرو، يعني: خزاعة، ثم إنهما جعلاه من أهل الحجاز لظنِّهما أنه خزاعي، على تأديته، قال: لا بأس زدت أو نقصت، إذا لم وإلاً فلو ظنّاه تميمياً لما جعلاه من أهل الحجاز، تحل حراماً أو تحرّم حلالاً وأصبت المعنى. ومثل هذا …"
