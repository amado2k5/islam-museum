text: "… التكليفي، كالواجب والمندوب ونحوها، ولكني رأيتُ له استعمالاً نادراً مرة واحدة، أحببتُ أن أشير إليه، وهو ما جاء في كتاب الأشربة، حيث يقول عن حكم مسألة: حرامٌ مكروهٌ، فقد دمج وصفين في وصف واحد. وأيضاً له استعمالٌ لألفاظ في الحكم …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 74، يرد فيه ذكر الواجب، والمندوب، والمكروه، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Marghinani's al-Hidaya, p. 74, whose wording mentions the obligatory (wajib), the recommended (mandub), the disliked (makruh), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
