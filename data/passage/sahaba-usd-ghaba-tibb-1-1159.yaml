text: "لُعَيقيبُ بن أبي فاطمة والنبي علي بخيبر، وقيل: قدمها قبل ذلك. وقال ابن منده: إنه شهد بدراً، وكان على خاتم النبي عليل، واستعمله عمر بن الخطاب خازناً على بيت المال، وأصابه الجذام، وأحضر له عمر الأطباء، فعالجوه، فوقف المرض. وهو …"
