label: { ar: "صحيح البخاري 6118 — ما عُدّ من الإيمان", en: "Sahih al-Bukhari 6118 — what is counted as part of faith", ur: "صحیح بخاری 6118 — جو ایمان میں سے گنا گیا", es: "Sahih al-Bukhari 6118 — lo que se considera parte de la fe" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي سَلَمَةَ، حَدَّثَنَا ابْنُ شِهَابٍ، عَنْ سَالِمٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَما مَرَّ النَّبِيُّ عَلَى رَجُلٍ وَهْوَ يُعَاتَبُ فِي الْحَيَاءِ يَقُولُ إِنَّكَ لَتَسْتَحْيِي. حَتَّى كَأَنَّهُ يَقُولُ قَدْ أَضَرَّ بِكَ. فَقَالَ رَسُولُ اللَّهِ \" دَعْهُ فَإِنَّ الْحَيَاءَ مِنَ الإِيمَانِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6118، يذكر ما عُدّ من الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6118 (Good Manners and Form (Al-Adab)), that mentions what is counted as part of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6118، جس میں جو ایمان میں سے گنا گیا کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6118 (Buenas costumbres y forma (Al-Adab)), menciona lo que se considera parte de la fe. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
