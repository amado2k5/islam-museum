text: "… قال: فنُخرجها، ثُمَّ يخرجُ بِنَا إِلَى ظَاهِر حَرَّتِنَا فيستسقي اللّٰه لنا، فوالله ما يَبْرَحُ مجلسه حتى تَمُرَّ السَّحَابَةُ ونُسْقَى، قد فَعَلَ ذلك غَيْرَ مرةٍ ولا مرتين ولا ثلاث، قال: ثُمَّ حَضَرَتْهُ الوَفَاةُ عِنْدَنَا، فَلَمَّا عَرَفَ أَنَّهُ مَيِّتْ قال: يَا مَعْشَرَ …"
