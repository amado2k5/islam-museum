text: "… أنت عليَّ حرام، وبين قولهِ لطعامه: هو عليَّ حرام. قالوا: وقوله: أنتِ عليَّ حرام، إما أن يُريد به إنشاء تحريمها، أو الاخبارَ عنها بأنها حرام، وإنشاء تحريم محال، فإنه ليس إليه، إنما هو إلى من أحلَّ الحلال، وحرَّمَ الحرامَ، وشرع …"
