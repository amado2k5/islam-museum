summary:
  ar: "القسم 35 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب تعبير الرؤيا»، ويضم فيها النصوص من 3893 إلى 3926 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 35 of Sunan Ibn Majah (Interpretation of Dreams) in the division of the open hadith dataset the museum took its reports from: reports 3893 to 3926 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 35، عنوان «کتاب تعبیر الرؤیا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3893 تا 3926۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 35 de Sunan Ibn Majah (Interpretación de los sueños) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3893 al 3926, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
