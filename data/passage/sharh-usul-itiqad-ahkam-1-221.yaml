  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 1. cildinin 221. sayfasından, toplumsal yükümlülük (fard kifayah) ve farz fiil (vacip) konularından bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar keyakinan Sunni, jilid 1, halaman 221, yang menyebutkan kewajiban berjamaah (fard kifayah) dan amalan wajib (wajib). Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
