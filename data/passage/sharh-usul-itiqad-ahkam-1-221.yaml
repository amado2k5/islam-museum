text: "… أيوب، قال: ثنا روح، قال: أنا الربيع بن صُبيح، عن الحسن، قال: ليس لأهلِ البدعِ غيبة. - الخبرنا أحمد بن عبيد، قال: أنا محمد بن الحسين، قال: ثنا أحمد بن زهير، ذلك واجب على الكفاية باتفاق المسلمين، ولولا من يقيمه …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 1، ص 221، يرد فيه ذكر فرض الكفاية، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 1, p. 221, whose wording mentions the communal obligation (fard kifaya), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
