label: { ar: "الموطأ 1047 — ابن عمر: من حبس دون البيت بمرض فإنه لا يحل حتى يطوف بالبيت وبين الصفا والمروة", en: "Muwatta 1047", es: "Muwatta 1047", fr: "Muwatta 1047", ur: "موطا 1047", tr: "İbn Ömer: Hastalık nedeniyle Kâbe'ye ulaşamayan kimse, Kâbe'nin etrafında ve Safa ile Merve arasında tavaf etmedikçe ihram halinden kurtulamaz.", id: "Al-Muwatta 1047 — Ibn Umar: Barangsiapa yang terhalang mencapai Ka'bah karena sakit, maka ia belum terbebas dari keadaan ihram sampai ia melakukan tawaf mengelilingi Ka'bah dan antara Safa dan Marwa." }
text: "من حبس دون البيت بمرض فإنه لا يحل حتى يطوف بالبيت، وبين الصفا والمروة"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر، أنه قال: من حُبس دون البيت بمرض فإنه لا يحل حتى يطوف بالبيت وبين الصفا والمروة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1165) وسويد (566). {cite:muwatta-maruf-1997 p.486}"
  tr: "Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan, o da Abdullah ibn Ömer'den rivayet ederek şöyle buyurmuştur: \"Hastalık nedeniyle Kâbe'ye ulaşamayan kimse, Kâbe'nin etrafında tavaf yapıp Safa ile Merve arasında sa'y yapmadıkça ihram halinden kurtulamaz.\" Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab (1165) ve Suveyd (566) tarafından da rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.486}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, dari Salim bin Abdullah, dari Abdullah bin Umar, yang berkata: Barangsiapa yang terhalang mencapai Ka'bah karena sakit, maka ia belum terbebas dari keadaan ihram sampai ia melakukan tawaf mengelilingi Ka'bah dan sa'i antara Safa dan Marwa. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1165) dan Suwaid (566). {cite:muwatta-maruf-1997 p.486}"
