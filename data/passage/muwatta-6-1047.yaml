text: "من حبس دون البيت بمرض فإنه لا يحل حتى يطوف بالبيت، وبين الصفا والمروة"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر، أنه قال: من حُبس دون البيت بمرض فإنه لا يحل حتى يطوف بالبيت وبين الصفا والمروة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1165) وسويد (566). {cite:muwatta-maruf-1997 p.486}"
