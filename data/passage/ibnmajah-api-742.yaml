label: { ar: "سنن ابن ماجه 742 — دفن وقبر ومرقد", en: "Sunan Ibn Majah 742 — a burial, grave or resting place", ur: "سنن ابن ماجہ 742 — تدفین، قبر اور مرقد", es: "Sunan Ibn Majah 742 — un lugar de entierro, tumba o descanso.", fr: "Sunan Ibn Majah 742 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… عَنْ أَبِي التَّيَّاحِ الضُّبَعِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَ مَوْضِعُ مَسْجِدِ النَّبِيِّ ـ لِبَنِي النَّجَّارِ وَكَانَ فِيهِ نَخْلٌ وَمَقَابِرُ لِلْمُشْرِكِينَ فَقَالَ لَهُمُ النَّبِيُّ ـ \" ثَامِنُونِي بِهِ \". قَالُوا لاَ نَأْخُذُ لَهُ ثَمَنًا أَبَدًا. قَالَ فَكَانَ النَّبِيُّ ـ يَبْنِيهِ وَهُمْ يُنَاوِلُونَهُ وَالنَّبِيُّ ـ يَقُولُ \" أَلاَ إِنَّ الْعَيْشَ عَيْشُ الآخِرَةِ فَاغْفِرْ لِلأَنْصَارِ وَالْمُهَاجِرَةِ \". …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 742، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 742 (The Book On The Mosques And The Congregations), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 742، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 742 (El Libro de las Mezquitas y las Congregaciones), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 742 (Livre des Mosquées et des Congrégations), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
