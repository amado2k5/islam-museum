text: "… بن أسد؛ ومن بني مَخْزُومِ : أبو قَيْسِ ابن الْفَاكِهِ بن الْمُغِيرَةِ بن عبد الله بن عُمَرَ بْنِ مخزومٍ، وَأبو قَيْسِ ابْنُ الْوَلِيدِ بن المُغِيرة بن عَبْدِالله بن عُمَرَ بنِ مخزومِ؛ ومن بني جُمَحَ: عليُّ بن أَمَيَّة بن خَلَفٍ بن …"
