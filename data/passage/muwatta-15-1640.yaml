label: { ar: "الموطأ 1640 — مالك في المفتدية: لا ترجع إلى زوجها إلا بنكاح جديد، فإن تزوجها ففارقها قبل أن يمسها لم تكن عليه عدة من الطلاق الآخر", en: "Muwatta 1640", es: "Muwatta 1640", fr: "Muwatta 1640", ur: "موطا 1640", tr: "El-Muvatta 1640 — Malik, kendini fidye karşılığında kurtaran kadın hakkında: Yeni bir evlilik sözleşmesi yapmadan kocasına geri dönemez. Eğer onunla evlenir ve evliliği tamamlamadan önce boşanırsa, önceki boşanmadan sonra bekleme süresine uyması gerekmez.", id: "Al-Muwatta 1640 — Malik tentang wanita yang menebus dirinya: Ia tidak dapat kembali kepada suaminya kecuali dengan akad nikah baru. Jika suaminya menikahinya dan kemudian menceraikannya sebelum perkawinan disempurnakan, maka ia tidak diwajibkan untuk menjalani masa iddah sejak perceraian sebelumnya." }
summary:
  ar: "يقول مالك في المفتدية إنها لا ترجع إلى زوجها إلا بنكاح جديد، فإن هو نكحها ففارقها قبل أن يمسها، لم يكن له عليها عدة من الطلاق الآخر، وتبني على عدتها الأولى. قال مالك وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.76}"
  tr: "Malik, boşanma davası açan bir kadının, yeni bir evlilik sözleşmesi yapmadıkça kocasına geri dönemeyeceğini söylüyor. Eğer erkek onunla evlenir ve evliliği tamamlamadan önce boşanırsa, ikinci boşanmadan itibaren bekleme süresi olmaz ve kadın ilk bekleme süresine yeniden başlar. Malik, \"Bu konuda duyduğum en iyi görüş bu.\" dedi. {cite:muwatta-maruf-1997 s.76}"
  id: "Malik mengatakan mengenai seorang wanita yang telah menyerahkan diri dalam perceraian bahwa ia tidak dapat kembali kepada suaminya kecuali melalui akad nikah baru. Jika suaminya menikahinya dan kemudian menceraikannya sebelum hubungan suami istri terwujud, maka suaminya tidak memiliki masa tunggu sejak perceraian kedua, dan wanita tersebut kembali menjalani masa tunggu pertamanya. Malik berkata, \"Ini adalah pendapat terbaik yang pernah saya dengar mengenai masalah ini.\" {cite:muwatta-maruf-1997 p.76}"
