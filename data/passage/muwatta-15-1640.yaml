summary:
  ar: "يقول مالك في المفتدية إنها لا ترجع إلى زوجها إلا بنكاح جديد، فإن هو نكحها ففارقها قبل أن يمسها، لم يكن له عليها عدة من الطلاق الآخر، وتبني على عدتها الأولى. قال مالك وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.76}"
