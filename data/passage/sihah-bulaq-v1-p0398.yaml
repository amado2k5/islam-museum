  النصرائية بالحميرة والنسبة اليهم عبادى وقيسل لعبادى أى جاريك شرفقال هذا ئم هذا
  وعبيدان اسم وإدكان يقال ان فيه حية قد منعته فلا يرحى ولا يؤنى قال النابغة
