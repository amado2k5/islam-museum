text: |-
  ⁦(فصل الجيم)⁩
  ٤٢٣
  بغضائ الاترض للذين تبغضهسم الا بالاستمه ال والجارز الشديذ من السعال قال الشماخل
  صف اخر :
  يعشرجها طورا وطورا كانها • لها بالرغامى واللحياشيم جارز
  وأرض جارزة بابسة غليظة يكتننفها رمل أوفاع والجمع بوارزوامر أة جارز أى عاقر والجرز
  بالكسر لباس من لباس الذاءمن الوبرويال هوالفر والغليظ ربز رجل بر بن
  بالضم بين الجربزة بالفتح أى خب وهو التريز أيضاره مامعريان ⁦( جرمز)⁩ الجرموز
  لحوض الصغير قال الراجز (عمروبن جيل
  كأنها والعهد مذ أقياظ * أس براه يزعلى وجاز
  وجزًا. يزالرحل أيضاجسده وأعضاؤه ويقال بجع جراءيزه اذا تقبض ليئب قال أمية
  اب أبي عائد الهذلى يصف حارا
  أواصحم حام براميزه * حزابية حيدى بالدحال
  وابن حر موز قائل الز بيروجر من الشىْ واجر غز أى اجتمع الى ناحية وتجر حن الليل ذهب
  قال الراجز لمار أيت الليل قد تجر مزا * ولم أجد عما امامى مارزا
  ( جزز جززت البروالنخسل والهوف أجزه جزا والجز مايجز به وهذازمن المزاز
  والجزاز أى زمن الجصادوسرام النهه-ل وأجزا لنخل والبروالغنمْ أى حان لها أن تجزِ وأجز
  القوم اذاجزت عنه-م أوزرعهم واستجز البرأى استحصد واجتززت الشيح وغيره واجد رزته
  اذاجززته وأنتد السكسائى ايزيد بن الطئرية
  فقلت اصاحى لا تحبسانا • بنع أصوله واجتزشيها
  ويروى واجد زوقوله لا تحيسانافان العرب ربما خاطبت الواحد يلفظ الاثنين وقال الآنر
  فان تزجرانى يا ابن عفان ازدبر * وان تدعانى أحم عرضاممنعا
  وجز التمريب ز بالكسر جزوزا أى يبس وأجزمثل وتمرفيه حزوزأى يبس عن يعقوب والجزة
  صوف ساة فى السنة يقال اقرضى جزة أوجزتيز فيعطيه موف شاة أوشاتين قال
  والجزوزة الغنم التى يجزصوفها وهو مثل الركوية والملوية والعلوفة أى هي مما يجز والمزازة أ
  ماسقط من الاديم وغيره اذا قطع والحزيزة خصلة من صوف وكذلك الجزجزة وهي عهنة تعلق
  من الهودج قال الراجز كالرناست فوة الجزاجز ⁦(جلز)⁩ جلزت السكين
  والسوط أجلزه جلزا اذا شددت مقبضه بعاباء البعبر وكذلك التجايزواسم ذلك العلباء الجلاز
  بالك سروية ال لاغلظ السنان حلزوهذا أبو مجلز قدباء بكسر الميم قال يعقوب هو مشتق
  من جلز السنان وهو أغاظه ومن جلزالسوط وهو مقبضه والحلواز الشرطى والجمع الجلاوزة
  والجلوذشبيه بالفستق جائز الحلفزيز العجوز المتشنجة العمول وقال العامرى
  العجوز التى ليست فيها بقية قال
  السن من جلفز يزءوزم خلق • والعقل عقل صى يمرث الودعه
  ⁦( ز)⁩ الجزضرب من السير أشدٍ من العنق وقدبح ز البعير يجمز بالكسر جزاء
  والجاز البعير الذى يركبه المجمز قال الراجز
  (جعز لمعزوالجاز الغصص
  كِذا فى نسمفه
