text: |-
  ٢٠٨
  ⁦(بلب الا.)⁩
  ⁦(تفخ)⁩
  والنخ الابل التى تناخ عند المصدّق ايدقها وقال أكرم أمير المؤمنين النخا والنخة
  الرقيق ويقال البقر العوامل قال ثعلب هذاهو الصواب لانه من النخ وهوالسوق الشديد
  وفى الحديث ليس فى النغة صدقة وكان الكسائى يقول انماهو النخة بالضم قال وهو البقر
  العوامل وقال الفرّاء النخة بالفتح أن يأخذ المصدق ديشار النفسه بعد فراعه من أخذ
  الصدقة وأنشد
  عمى الذى منع الدينا رضاحية • دينارغخة كاب وهو مشهود
  ونختخت الاقة فتختخت أبركتها فبركت قال العجاج ولو أنخابمعهم تنخنحوا ⁦( سخ)⁩
  نسخت الشمس الظسل وانتحته از الله ونسخت الريمح آثار الدار غيرتها ونسيخت الكتاب
  وانتستخته واستنسحتهكاء بمعنى والنسخة بالضم اسم المنتسخ منه ونسخ الآية بالاية ازالة مثل
  حكمها فالثانية ناسخة والاولى منسوخة وااتناسخ فى الميراث أن يموت ورنة بعدورثة وأصل
  الميرات قاتم لم يقسم ن خ الاصمعى يقال أصابد نضخ من كذا وهوأكثر من التضع
  ولا يقبال منه فعل ولا يفعل وقال أبوعمر التوّزى النضخ الاثرييق فى الثوب وغيره والنضح
  بالحاغير محجمة الفعل وقال أبوزيد النضخ الرش مثل النضح وهماسواء تول نضخت
  أنضخ بالنتح والنفاخ المناضحة قال الشاعر
  بهمن نضاخ الشول ردع كانه • نقاعة حناه بماء الصنوبر
  وقال القطامى
  واذاتضيفى الهموم قريتها • سرح اليدين تجالس الجطوانا
  حرجاكان من الكحيل صبابة • نضخت مغابئهابم الضخانا
  وقال اليزيدى نضخذاهم بالنبسل لغة فى نضحنا هم اذا فرّقوهافيهم واقتضخ الماءترشش
  وغيث نضاخ غزير قال جران العود وباظط نضاخ العثانين واسع وعيز نضاخة
  كثيرة الماه قال أبو عبيدة فى قوله تعالى فيم-ماعينان نضاختان أى فوّارتان
  والنضة المطرة وأنتدأ بوحرو
  لا يفرحون اذا مانضخة وقعت * وهم كرام اذا اشتدّ الملازيب
  ⁦(نفخ)⁩ تفخ فيه ونفخه أيضالغة قال الشاعر
  لولاابن جعدة لم يفتح قهند ركم * ولاخراسان حق ينفخ الصور
  وقول القطامى
  ألم يخز التفرّق جند كسرى • ونففوا فى مداينهم فطاروا
  أراد نفيغوا فخذف وتفخ بهاحبق والمنفاخ الذى يتفخ فيه وقولهم ما يالدارنافخ ضرمة أى
  ما بها أحدوانتفخ الثوربعماقالوا انتفخ النهاراى علا ورجل ذو نفخ وذونفج بالجيم أى
  ساحب فحرو كبرويقال أجد تعغة وافخة وتفخة اذا انتفخ بطنه ويقال رجل آنفخ بين
  التفخ للذى فى خصييه نقمخة والنفذاء من الارض مثل التيخاء ⁦(نقخ)⁩ الفقاخ الماء العذب
  الذي ينقخ الفؤادبيرده قال العرجى
  وان شئت حرمت انساءسواكم * وان شقت لم أطعم نقاخا ولابردا
  والنقخ النقف وهوكسر الرأس عن الدماغ قال العجاج
  لعلم الاقوام انى مفخخ • لهامهم أرضه وأنقخ
