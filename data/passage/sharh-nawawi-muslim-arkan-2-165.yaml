text: "… رُكُبَتَيْهِ فَقَالَ يَارَسُولَ الهِهَ الْاِسْلَامُ قَالَ لَا تُشْرِكُ بالهِ شَيْئَا وَتِقِيمُ الصَّلاةَ وَتُؤْنِى الزَّكَاةَ وَتَصُومُ رَمَضَانَ قَالَ صَدَقْتَ قَالَ يَا رَسُولَ اللّه مَا الْأيَانُ قَالَ أَنْ تُؤْمِنَ باللّٰه وَمَلَاَئِكَته وَكَتَابه وَلَقَائه وَرُسُله وَتُؤْمِنَ بالْبَعْث وَتُوْمنَ بالْقَدَر كُلّه قَالَ صَدَقْتَ قَالَ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 2، ص 165، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 2, p. 165, that mentions belief in God, His angels, His books and His messengers, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 2، ص 165 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 2, pág. 165, que menciona la creencia en Dios, sus ángeles, sus libros y sus mensajeros, así como la creencia en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 2, page 165) mentionnant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, ainsi que la croyance en la résurrection. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 2. cildinin 165. sayfasından bir alıntı, Allah'a, meleklerine, kitaplarına, peygamberlerine ve kıyamete olan inancı ele almaktadır. Bu alıntı, makine tarafından okunabilir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 2, halaman 165, membahas tentang kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, para rasul-Nya, dan kepercayaan kepada Kebangkitan. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, pilar-pilar iman, cabang-cabang iman, dan karakteristik seorang mukmin."
