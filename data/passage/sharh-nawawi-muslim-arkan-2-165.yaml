summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 2، ص 165، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
