label: { ar: "الموطأ 727 — مالك: الحبوب التي تؤكل بعد الحصاد لا تخرص، وعلى أهلها فيها الأمانة", en: "Muwatta 727" }
summary:
  ar: "قول لمالك: فأما ما لا يؤكل رطباً وإنما يؤكل بعد حصاده من الحبوب كلها فإنه لا يُخرص، وإنما على أهلها فيها الأمانة إذا حصدوها ودقوها وطيبوها وخلصت حباً، يؤدون زكاتها إذا بلغ ذلك ما تجب فيه الزكاة. ويقول مالك: وهذا الأمر الذي لا اختلاف فيه عندنا. ويذكر المحقق أن قوله «قال مالك» ليس في نسخة م، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.365}"
