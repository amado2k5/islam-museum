label: { ar: "الموطأ 727 — مالك: الحبوب التي تؤكل بعد الحصاد لا تخرص، وعلى أهلها فيها الأمانة", en: "Muwatta 727", es: "Muwatta 727", fr: "Muwatta 727", ur: "موطا 727", tr: "Al-Muwatta 727 — Malik: Hasattan sonra tüketilen tahılların değeri hesaplanmaz ve sahipleri bu konuda güvenilirdir.", id: "Al-Muwatta 727 — Malik: Biji-bijian yang dimakan setelah panen tidak diestimasi, dan pemiliknya dapat dipercaya dalam hal itu." }
summary:
  ar: "قول لمالك: فأما ما لا يؤكل رطباً وإنما يؤكل بعد حصاده من الحبوب كلها فإنه لا يُخرص، وإنما على أهلها فيها الأمانة إذا حصدوها ودقوها وطيبوها وخلصت حباً، يؤدون زكاتها إذا بلغ ذلك ما تجب فيه الزكاة. ويقول مالك: وهذا الأمر الذي لا اختلاف فيه عندنا. ويذكر المحقق أن قوله «قال مالك» ليس في نسخة م، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.365}"
  tr: "Malik şöyle dedi: Taze tüketilmeyen, hasattan sonra yenen tahıllara gelince, bunlar hesaplanmaz. Aksine, sahipleri sorumludur. Tahılı hasat edip, harmanlayıp, işleyip, asıl haline getirdikten sonra, zekât miktarına ulaştığında zekâtını ödemekle yükümlüdürler. Malik şöyle dedi: Bu konuda aramızda hiçbir ihtilaf yoktur. Editör, \"Malik dedi ki\" ifadesinin M el yazmasında bulunmadığını ve Ebu Mus'ab tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.365}"
  id: "Malik berkata: Adapun biji-bijian yang tidak dimakan segar tetapi dimakan setelah panen, tidak dihitung zakatnya. Sebaliknya, pemiliknya bertanggung jawab atasnya. Setelah mereka memanen, mengirik, dan mengolah biji-bijian tersebut, dan biji-bijian itu dipisahkan ke bentuk aslinya, mereka wajib membayar zakat atasnya ketika jumlahnya mencapai jumlah yang wajib dizakati. Malik berkata: Ini adalah masalah yang tidak ada perselisihan di antara kita. Editor mencatat bahwa frasa \"Malik berkata\" tidak ada dalam manuskrip M, dan bahwa itu diriwayatkan dari Malik oleh Abu Mus'ab. {cite:muwatta-maruf-1997 p.365}"
