label: { ar: "الموطأ 2731 — يحيى بن سعيد: أبو قتادة يسأل عن جمته أيرجلها فيقول النبي نعم وأكرمها", en: "Muwatta 2731" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا قتادة الأنصاري قال لرسول الله: إن لي جمة، أفأرجلها؟ فقال رسول الله: نعم، وأكرمها. فكان أبو قتادة ربما دهنها في اليوم مرتين، لما قال له رسول الله. ويذكر المحقق أن الحديث في الموطأ مرسل منقطع عند جميع الرواة، وأن البزار أسنده من طريق ابن المنكدر عن أبي قتادة. {cite:muwatta-maruf-1997 p.537} {cite:muwatta-maruf-1997 p.538}"
