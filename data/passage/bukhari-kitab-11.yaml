summary:
  ar: "القسم 11 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجمعة»، ويضم فيها النصوص من 876 إلى 941 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 11 of Sahih al-Bukhari (Friday Prayer) in the division of the open hadith dataset the museum took its reports from: reports 876 to 941 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 11، عنوان «کتاب الجمعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 876 تا 941۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 11 de Sahih al-Bukhari (Oración del viernes) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 876 al 941 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 11 du Sahih al-Bukhari (Prière du vendredi), dans la partie ouverte du recueil: les hadiths 876 à 941 de cette base de données sont classés sous ce livre. Les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 11. bölümü \"Cuma Kitabı\" başlığını taşımakta olup, 876'dan 941'e kadar olan metinleri sırasıyla numaralandırmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 11 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Jumat\" dan berisi teks 876 hingga 941, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
