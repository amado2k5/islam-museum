text: "… شعب الإيمان مرسلاً. - وعن ابن عباسما، قال: من تعلم كتاب اللّٰه ثم اتبع ما فيه؛ هداه اللّٰه من الضلالة في الدنيا، ووقاه يوم القيامة سوء الحساب. وفي رواية، قال: من اقتدى بكتاب اللّٰه لا يضل في الدنيا ولا يشقى …"
