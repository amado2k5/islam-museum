text: "رِجالٍ : خالد بن سعيد على صنعاء، والمهاجر بن فباع النَّبيّ يفي ماله كله في دَيْنِه، حتَّى قام معاذ وقال رسولُ اللٰه وَاله : أعلمهم بالحلال والحرام قد خشيت الغرق، فخلَّصتني منه يا عمر، فأتى حدَّثنا خَلفُ بنُ القاسم، قال …"
