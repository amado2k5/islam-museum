text: "… علينا، وأحلننا ما أحل لنا، فعدا علينا قومُنا، فعذّبونا وفَتنونا على ديننا ليردونا إلى عبادة الأوثان، وأن نستحل ما كنا نستحل من الخبائث، فلما قهرونا وظلمونا وشقوا علينا وحالوا بيننا وبين قومنا خرجنا إلى بلدك فاخترناك على من سواك، ورغبنا …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 188، يذكر ما أُحل، واستحلال الشيء، والخبائث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 188, that mentions what was made lawful, treating a thing as lawful, the foul things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 188 کا اقتباس جس میں جو حلال کیا گیا، کسی چیز کو حلال ٹھہرانا، خبیث چیزیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
