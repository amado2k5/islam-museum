text: "… ولَمّا كانَ الأصْلُ بَقاءَ الصَّلاةِ فِي ذِمَّتِهِ أُمِرَ الشّالُّ أنْ يَبْنِيَ عَلَى اليَقِينِ ويَطْرَحَ الشَّكَّ، ولا يُعارِضُ هذا رَفْعُهُ لِلنِّكاحِ المُتَيَقَّنِ بِقَوْلِ الأمَةِ السَّوْداءِ إنَّها أرْضَعَت الزَّوْجَيْنِ، فإنَّ أصْلَ الأبْضاعِ عَلَى التَّحْرِيمِ، وإنَّما أُبِيحَت الزَّوْجَةُ بِظاهِرِ الحالِ مَعَ كَوْنِها أجْنَبِيَّةً، …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 131، يرد فيه ذكر المباح، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 131, whose wording mentions the permitted (mubah), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 131 کا اقتباس جس میں مباح، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 131, dont le texte mentionne le permis (mubah), l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 131, cuyo texto menciona lo permitido (mubah), la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
