text: |-
  قولد بعوناء بالعين المهملوومصدره
  البعو بعى الجناية والجرم قاله
  المؤاف اه
  قوله نخل -قى ولا بعل رواه
  فى مادّة أتى نخل بعل ولا-ق
  وعيارته ولاتا الغلة وسمل التخل
  تقول منه أتت الهخلة تأتو وأنشد
  ابن السكيت وساف البيت على
  ماقلنا اه
  ١٥٦
  *⁦(بغل)⁩
  من امرئ ذى هاح لاتزال له * بزلاء يعيابها الجنامة الليد
