  انى اذا شغلت ومافروجهم * رحب المسالك نهاض بيزلاه
  سل البسل الحرام والحلال أيضا والابسال التعريم قال الشاعر
  أجارتكم بسل علينا محزم • وجارتناحل" لكم وحليلها
  والبسلة بالضم أجرة الراقى والبسالة الشجاعة وقد بسل بالضم فهو باسل أى بظل وقوم بسل
  مثل بازل وبزل والميادلة المصاولة فى الحرب والبسيل الكريه الوجه والبسيل أيضابقية
  النهيذوهوما يبقى فى الا نية من شراب القوم فيبيت فيها وأبسلت فلانا اذا أسلمته للهلكة
  فهومدسل قال عوف بن الاحوص بن جعفر
  واب- الى بنى بغير يرم * بعوناه ولابدم مراق
  وكان حل عن غى لبن قشير دم ابنى السصفية فقالوا لانرضى بكف وهنهم بنيه طلبا للصلح وقوله
  تعالى أن تبسل نضر بما كسبت قال أبو عبيدة أى ت-لم وانشد للنابغة الجعدة
  ونحن وهنا بالافاقة عامرا • بما كان فى الدرداء رهمًا فأبسلا
  قال الدرداه كتيبة كانت له-م والمستبسل الذى يوطن نفسه على الموت أو الضرب وقد
  استبل أى استقتل وهو أن يطرح نفسه فى الحرب ويريد أن يقتل أو يقتل لامحالة
  سمل قال ابن السكيت بسمل الرحل اذا قال بسم اللّٰه يقال قدأ كثرت من البسملة
  أى من قول بسم اللّٰه ( بصل البصل معروف الواحدة بصلة وتشبه به بيضة الحديد قال
  لبيد* قردمانياوتزكاكالبصل* طل) الباطل ضدّ الحق وابهع أباطيل على غير قياس
  كانهسم بهعوا ابطيلاوة_دبطل الشَىء يبطل بطلا وبطولا وبطلانا وأبطله غيره ويقال ذهب
  دمه بعطلا أى هدرا والبطل الشهياع والمرأة بطلة وقد بطل الرجل بالضم يبطل بطولة وبطالة
  أى صارشجاعا وبعال الاجير بالفتح بطالة أى تعطل فهو بطال ( بعل البعل الزوج والجهع
  البعولة ويقاز للمرأة أيضابعل وبعلة مثل زوج وزوجسة وبدل الرجل أى صار بعلا قال
  يارب بعل ساءما كان بعل» وقولهم من يعل هذه الناقة أى من ربها وصاحبها والبعل النخل
  الذى يشرب بعروقه فيستغنى عن السق يقال قد استبعل النخل قال أبو عمر والبعل والعذى
  واحجدوه وماسقته السماء وقال الاصعى العذى ماسقته السهاء والبع-ل ماشرب بعروقه
  من غير-ق ولاسماء وأنشد
  هنالك لا أبالى نخل سق • ولا بعل وان عظم الاتاه
  وفى الحديث ماشرب بعلاففيه العشر والبعل اسم صتم كان لة وم الياس عليه السلام وبعلبك
  اسم يلد والقول فيه كالقول فى سام أبرص وقدذكرناه فى باب الصاد وأمّاقول الشاعر
  إذا ماعلوناظه ربعل عريضة • فيقال هى أرض هى تفعة لا يصيه اسيح ولاسيل والبعال
  ملاعبة الرجل أهله وفى الحديث أيام أكل وشرب وبعال والمرأة تياعل زوجها أى تلاعبه
  وبع-ل الرجسل بالمكسر أى دهس وامرأة بعلة ب ل لبغل واحد البغال التى تركب
