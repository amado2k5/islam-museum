summary:
  ar: "يروي مالك عن ابن شهاب، وبلغه عن عروة بن الزبير، أنهما كانا يقولان مثل قول سعيد بن المسيب في المرأة، أنها تعاقل الرجل إلى ثلث دية الرجل، فإذا بلغت ثلث دية الرجل كانت إلى النصف من دية الرجل. {cite:muwatta-maruf-1997 p.422}"
