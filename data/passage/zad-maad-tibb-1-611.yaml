text: "… قطع العروق والكي ثبت في الصحيح من حديث جابر بن عبد اللَّه، أن النبي للا بعث إلى أُبي بن كعب طبيباً، فقطع له عِرقاً وكواه عليه مسلم:. ولما رُمي سعد بن معاذ في أَكْحَلِهِ حسمه النبيُّ وَلِلِ ثم وَرِمَتْ، فحسمه …"
