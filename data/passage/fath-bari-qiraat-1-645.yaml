text: "… قال: وقيل: وإنما أطلق على هذه الأنهار أنها من الجنة تشبيهًا لها بأنهار الجنة لما فيها من شدة العذوبة والحسن والبركة، والأول أولى. والله أعلم. تنبيه : الفرات بالمثناة في الخط في حالتي الوصل والوقف في القراءات المشهورة، وجاء في …"
