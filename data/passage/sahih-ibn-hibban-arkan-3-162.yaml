text: "… ما الإِيمانُ؟ قَالَ: أَنْ تُؤْمِنَ باللَّهِ وَمَلاَئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ، وَالْبَعْثِ بَعْدَ الْمَوْتِ، وَالْقَدَر خيْرِهِ وَشَرِّهِ حُلْوِهِ وَمُرِّه. قَالَ : صَدَقْتَ. قَالَ : فَعَجِبْنَا مِنْ سُؤالِهِ إياه، وَتَصْدِيقِهِ إياه. قَالَ : فأَخْبِرْنِي: ما الإِحْسَان؟ قَالَ: أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ، فإِنْ …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 162، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بالقدر، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 162, that mentions belief in God, His angels, His books and His messengers, belief in the decree, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 162 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، تقدیر پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 162, que menciona la creencia en Dios, sus ángeles, sus libros y sus mensajeros, la creencia en el decreto, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sahih Ibn Hibban, volume 3, page 162, évoquant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, la croyance au décret divin, la question de la foi et sa réponse; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban, Resimli Cilt 3, sayfa 162'den bir alıntı, Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inancın yanı sıra kader inancını ve imanla ilgili soruları ve cevaplarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Jilid Bergambar 3, halaman 162, membahas tentang kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya, serta kepercayaan pada takdir, dan pertanyaan-pertanyaan tentang iman dan jawabannya. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
