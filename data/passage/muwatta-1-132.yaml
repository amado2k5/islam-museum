label: { ar: "الموطأ 132 — مالك في إصابة الرجل نساءه وجواريه قبل أن يغتسل", en: "Muwatta 132", es: "Muwatta 132", fr: "Muwatta 132", ur: "موطا 132", tr: "El-Muvatta 132 — Malik, bir erkeğin gusül (ritüel banyo) yapmadan önce eşleriyle ve cariyeleriyle cinsel ilişkiye girmesi hakkında." }
summary:
  ar: "فتوى لمالك في باب جامع غسل الجنابة: سُئل عن رجل له نسوة وجوار هل يطؤهن جميعاً قبل أن يغتسل، فقال: لا بأس أن يصيب جاريتيه قبل أن يغتسل، فأما الحرائر فيكره أن يصيب الحرة في يوم الأخرى، وأما أن يصيب الجارية ثم الأخرى وهو جنب فلا بأس. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.98}"
  tr: "Malik'in cinsel ilişkiden sonraki ritüel temizliğe ilişkin kapsamlı hükmü hakkında bir fetva: Ona, eşleri ve cariyeleri olan bir adam hakkında soru soruldu; ritüel temizliği yapmadan önce hepsiyle cinsel ilişkiye girebilir mi? Cevap verdi: Ritüel temizliği yapmadan önce iki cariyesiyle cinsel ilişkiye girmesinde bir sakınca yoktur. Hükümdar kadınlara gelince, aynı gün bir hükümdar kadınla diğeriyle cinsel ilişkiye girmesi mekruhtur. Ancak, ritüel kirlilik halindeyken önce bir cariyeyle, sonra diğeriyle cinsel ilişkiye girerse, bunda bir sakınca yoktur. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.98}"
  id: "Fatwa Malik mengenai hukum lengkap tentang penyucian diri setelah hubungan seksual: Beliau ditanya tentang seorang pria yang mempunyai istri dan budak perempuan; apakah ia boleh berhubungan seksual dengan semuanya sebelum melakukan penyucian diri? Beliau menjawab: Tidak ada salahnya jika ia berhubungan seksual dengan kedua budak perempuannya sebelum melakukan penyucian diri. Adapun perempuan merdeka, tidak disukai jika ia berhubungan seksual dengan satu perempuan merdeka pada hari yang sama dengan perempuan merdeka lainnya. Namun, jika ia berhubungan seksual dengan satu budak perempuan dan kemudian dengan budak perempuan lainnya dalam keadaan najis, tidak ada salahnya. Peneliti menyebutkan bahwa fatwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.98}"
