summary:
  ar: "فتوى لمالك في باب جامع غسل الجنابة: سُئل عن رجل له نسوة وجوار هل يطؤهن جميعاً قبل أن يغتسل، فقال: لا بأس أن يصيب جاريتيه قبل أن يغتسل، فأما الحرائر فيكره أن يصيب الحرة في يوم الأخرى، وأما أن يصيب الجارية ثم الأخرى وهو جنب فلا بأس. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.98}"
