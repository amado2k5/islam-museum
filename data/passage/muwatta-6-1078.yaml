label: { ar: "الموطأ 1078 — مالك: لا بأس أن يطوف الرجل طوافاً واحداً بعد الصبح وبعد العصر، لا يزيد على سبع واحد، ويؤخر الركعتين حتى تطلع الشمس كما صنع عمر بن الخطاب، ويؤخرهما بعد العصر حتى تغرب الشمس", en: "Muwatta 1078" }
summary:
  ar: "قول لمالك: لا بأس أن يطوف الرجل طوافاً واحداً بعد الصبح وبعد العصر، لا يزيد على سبع واحد، ويؤخر الركعتين حتى تطلع الشمس كما صنع عمر بن الخطاب، ويؤخرهما بعد العصر حتى تغرب الشمس، فإذا غربت الشمس صلاهما إن شاء، وإن شاء أخرهما حتى يصلي المغرب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1301). {cite:muwatta-maruf-1997 p.496}"
