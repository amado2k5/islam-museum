label: { ar: "الموطأ 1078 — مالك: لا بأس أن يطوف الرجل طوافاً واحداً بعد الصبح وبعد العصر، لا يزيد على سبع واحد، ويؤخر الركعتين حتى تطلع الشمس كما صنع عمر بن الخطاب، ويؤخرهما بعد العصر حتى تغرب الشمس", en: "Muwatta 1078", es: "Muwatta 1078", fr: "Muwatta 1078", ur: "موطا 1078", tr: "El-Muvatta 1078 — Malik: Bir erkeğin sabah namazından sonra ve ikindi namazından sonra bir tavaf yapmasında, yediyi geçmemesi şartıyla, Ömer ibn el-Hattab'ın yaptığı gibi iki rekatı güneş doğana kadar ertelemesinde ve ikindi namazından sonra güneş batana kadar ertelemesinde bir sakınca yoktur.", id: "Al-Muwatta 1078 — Malik: Tidak ada salahnya bagi seorang pria untuk melakukan satu tawaf setelah fajar dan setelah shalat Ashar, tidak melebihi satu kali tujuh kali, dan menunda dua rakaat hingga matahari terbit, sebagaimana yang dilakukan Umar bin al-Khattab, dan menundanya setelah shalat Ashar hingga matahari terbenam." }
summary:
  ar: "قول لمالك: لا بأس أن يطوف الرجل طوافاً واحداً بعد الصبح وبعد العصر، لا يزيد على سبع واحد، ويؤخر الركعتين حتى تطلع الشمس كما صنع عمر بن الخطاب، ويؤخرهما بعد العصر حتى تغرب الشمس، فإذا غربت الشمس صلاهما إن شاء، وإن شاء أخرهما حتى يصلي المغرب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1301). {cite:muwatta-maruf-1997 p.496}"
  tr: "Malik şöyle demiştir: Bir erkeğin sabah namazından sonra bir, ikindi namazından sonra bir olmak üzere toplam yedi rekat tavaf etmesinde ve Ömer ibn el-Hattab'ın yaptığı gibi iki rekatı güneş doğana kadar ertelemesinde veya ikindi namazından sonra güneş batana kadar ertelemesinde bir sakınca yoktur. Güneş batmışsa, dilerse bu rekatı kılabilir veya akşam namazından sonraya erteleyebilir. Araştırmacı, bunu Ebu Musab'ın (1301) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.496}"
  id: "Malik berkata: Tidak ada salahnya seorang pria melakukan satu tawaf setelah shalat Subuh dan satu lagi setelah shalat Ashar, tidak melebihi tujuh putaran, dan menunda dua rakaat tersebut hingga matahari terbit, sebagaimana yang dilakukan Umar bin al-Khattab, dan menundanya setelah shalat Ashar hingga matahari terbenam. Kemudian, jika matahari telah terbenam, ia boleh mengerjakannya jika ia mau, atau ia boleh menundanya hingga setelah shalat Maghrib. Peneliti menyebutkan bahwa Abu Mus'ab (1301) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.496}"
