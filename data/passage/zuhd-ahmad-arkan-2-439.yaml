text: "… أَبي، قال: ثنا عبدُ الصَّمدِ، قال: ثنا أَبو الأَشهبِ، قال: سمعتُ الحسنَ يدعو بهذا الدُّعاءِ: اللَّهُمَّ! ائتِ نفسي تَقواها، زَكِّها أَنتَ خيرُ مَن زكَّاها، أَنتَ ولِيُّها ومَولَاها. - وقال: حدَّثنا أَبو الأَشهبِ، عنِ الحسنِ، قال: كانوا يقولونَ: أَفضلُ أَخلاقِ المؤمنينَ: …"
