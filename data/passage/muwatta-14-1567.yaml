label: { ar: "الموطأ 1567 — ابن شهاب: لم يبلغنا أن امرأة هاجرت إلى الله ورسوله وزوجها كافر مقيم بدار الكفر إلا فرقت هجرتها بينها وبين زوجها، إلا أن يقدم زوجها مهاجرا قبل انقضاء عدتها", en: "Muwatta 1567", es: "Muwatta 1567", fr: "Muwatta 1567", ur: "موطا 1567", tr: "El-Muvatta 1567 — İbn Şihab: Kocası kâfir olup küfr ülkesinde ikamet ederken Allah'a ve Resulüne hicret eden hiçbir kadından, hicretinin onu kocasından ayırmadığı bir durum duymadık; ancak kocası, bekleme süresi bitmeden önce hicret etmişse durum farklıdır.", id: "Al-Muwatta 1567 — Ibn Shihab: Kami belum pernah mendengar tentang seorang wanita yang berhijrah kepada Allah dan Rasul-Nya sementara suaminya adalah seorang kafir yang tinggal di negeri kekafiran, kecuali bahwa hijrahnya memisahkan dia dari suaminya, kecuali jika suaminya datang sebagai muhajirin sebelum berakhirnya masa iddahnya." }
summary:
  ar: "يقول مالك قال ابن شهاب ولم يبلغنا أن امرأة هاجرت إلى الله ورسوله وزوجها كافر مقيم بدار الكفر، إلا فرقت هجرتها بينها وبين زوجها، إلا أن يقدم زوجها مهاجرا قبل أن تنقضي عدتها. {cite:muwatta-maruf-1997 p.53}"
  tr: "Malik, İbn Şihab'ın şöyle dediğini aktarmıştır: \"Kocası kâfir olup küfr ülkesinde ikamet ederken Allah'a ve Resulüne hicret eden hiçbir kadından, hicretinin onu kocasından ayırmadığı bir durum duymadık; ancak kocası bekleme süresi dolmadan önce hicret etmişse durum farklıdır.\" {cite:muwatta-maruf-1997 s.53}"
  id: "Malik berkata, Ibnu Shihab berkata, \"Kami belum pernah mendengar tentang seorang wanita yang berhijrah kepada Allah dan Rasul-Nya sementara suaminya adalah seorang kafir yang tinggal di negeri kekafiran, kecuali bahwa hijrahnya memisahkannya dari suaminya, kecuali jika suaminya berhijrah sebelum masa iddahnya berakhir.\" {kutipan:muwatta-maruf-1997 hlm. 53}"
