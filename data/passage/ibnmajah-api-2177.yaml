label: { ar: "سنن ابن ماجه 2177 — الأب والأبوة", en: "Sunan Ibn Majah 2177 — the father and fatherhood", ur: "سنن ابن ماجہ 2177 — باپ اور والدیت", es: "Sunan Ibn Majah 2177 — El padre y la paternidad" }
text: "حَدَّثَنَا الْعَبَّاسُ بْنُ عَبْدِ الْعَظِيمِ الْعَنْبَرِيُّ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَنْبَأَنَا مَعْمَرٌ، عَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ نَهَى رَسُولُ اللَّهِ ـ أَنْ يَبِيعَ حَاضِرٌ لِبَادٍ. قُلْتُ لاِبْنِ عَبَّاسٍ مَا قَوْلُهُ حَاضِرٌ لِبَادٍ قَالَ لاَ يَكُونُ لَهُ سِمْسَارًا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2177، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2177 (The Chapters on Business Transactions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2177، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2177 (Capítulos sobre transacciones comerciales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
