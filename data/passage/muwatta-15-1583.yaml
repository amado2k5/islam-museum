label: { ar: "الموطأ 1583 — يحيى بن سعيد عن أبي بكر بن حزم: سأل عمر بن عبد العزيز عن البتة، فقال أبو بكر كان أبان بن عثمان يجعلها واحدة، فقال عمر لو كان الطلاق ألفا لأبقت البتة منه شيئا", en: "Muwatta 1583" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي بكر بن حزم أن عمر بن عبد العزيز قال له البتة، ما يقول الناس فيها؟ فقال أبو بكر فقلت له كان أبان بن عثمان يجعلها واحدة. فقال عمر بن عبد العزيز لو كان الطلاق ألفا ما أبقت البتة منه شيئا، من قال البتة فقد رمى الغاية القصوى. {cite:muwatta-maruf-1997 p.59}"
