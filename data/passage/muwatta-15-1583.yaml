label: { ar: "الموطأ 1583 — يحيى بن سعيد عن أبي بكر بن حزم: سأل عمر بن عبد العزيز عن البتة، فقال أبو بكر كان أبان بن عثمان يجعلها واحدة، فقال عمر لو كان الطلاق ألفا لأبقت البتة منه شيئا", en: "Muwatta 1583", es: "Muwatta 1583", fr: "Muwatta 1583", ur: "موطا 1583", tr: "El-Muvatta 1583 — Yahya ibn Said, Ebu Bekir ibn Hazm'dan rivayetle: Ömer ibn Abdülaziz son boşanma hakkında sordu ve Ebu Bekir şöyle dedi: Ebu Bekir ibn Osman bunu tek bir boşanma olarak kabul ederdi. Ömer dedi ki: Bin boşanma olsa bile, son boşanma bunların bir kısmını geride bırakır.", id: "Al-Muwatta 1583 — Yahya ibn Saeed berdasarkan riwayat Abu Bakr ibn Hazm: Umar ibn Abd al-Aziz bertanya tentang talak terakhir, dan Abu Bakr berkata: Aban ibn Uthman biasa menganggapnya sebagai satu talak. Umar berkata: Sekalipun ada seribu talak, talak terakhir akan menyisakan sebagian darinya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي بكر بن حزم أن عمر بن عبد العزيز قال له البتة، ما يقول الناس فيها؟ فقال أبو بكر فقلت له كان أبان بن عثمان يجعلها واحدة. فقال عمر بن عبد العزيز لو كان الطلاق ألفا ما أبقت البتة منه شيئا، من قال البتة فقد رمى الغاية القصوى. {cite:muwatta-maruf-1997 p.59}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Ebu Bekir ibn Hazm'dan rivayet ettiğine göre, Ömer ibn Abdülaziz ona \"el-batta\" kelimesi ve insanların bu kelime hakkında ne düşündükleri hakkında soru sormuş. Ebu Bekir şöyle cevap vermiş: \"Ona, Ebu Bekir ibn Osman'ın bunu tek bir boşanma olarak kabul ettiğini söyledim.\" Ömer ibn Abdülaziz şöyle demiş: \"Bin boşanma olsa bile, 'el-batta' kelimesi hiçbirinden eksik olmaz. 'El-batta' diyen kimse nihai hedefe ulaşmıştır.\" {cite:muwatta-maruf-1997 s.59}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abu Bakr ibn Hazm, bahwa Umar ibn Abd al-Aziz bertanya kepadanya tentang kata \"al-batta,\" dan apa pendapat orang-orang tentangnya. Abu Bakr menjawab, \"Aku memberitahunya bahwa Aban ibn Uthman menganggapnya sebagai satu kali perceraian.\" Umar ibn Abd al-Aziz berkata, \"Sekalipun ada seribu kali perceraian, kata 'al-batta' tidak akan meninggalkan satu pun di antaranya. Siapa pun yang mengucapkan 'al-batta' telah mencapai tujuan akhir.\" {cite:muwatta-maruf-1997 p.59}"
