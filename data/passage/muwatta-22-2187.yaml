label: { ar: "الموطأ 2187 — يحيى عن مالك: وإن ابتاع رجل ثوبا به عيب من حرق أو عوار، فزعم البائع أنه لم يعلم، وقد قطع المشتري الثوب أو صبغه، فالمبتاع بالخيار: إن شاء أن يوضع عنه قدر ما نقص العيب من ثمن الثوب ويمسكه، وإن شاء أن يغرم ما نقص التقطيع أو الصبغ من ثمنه ويرده", en: "Muwatta 2187", es: "Muwatta 2187", fr: "Muwatta 2187", ur: "موطا 2187", tr: "El-Muvatta 2187 — Yahya, Malik'ten rivayet ettiğine göre: Bir kimse yanık veya kusur gibi bir hatası olan bir giysi satın alırsa ve satıcı bunun farkında olmadığını iddia ederse ve alıcı giysiyi keser veya boyarsa, alıcının iki seçeneği vardır: Dilerse, giysinin fiyatından kusur nedeniyle azalan miktarı düşüp giysiyi elinde tutabilir; isterse, kesme veya boyama nedeniyle azalan miktarı ödeyip giysiyi iade edebilir.", id: "Al-Muwatta 2187 — Yahya berdasarkan riwayat Malik: Jika seseorang membeli pakaian yang memiliki cacat seperti bekas terbakar atau kerusakan, dan penjual mengaku tidak mengetahuinya, dan pembeli telah memotong atau mewarnai pakaian tersebut, maka pembeli memiliki pilihan: jika ia mau, ia dapat mengurangi harga pakaian tersebut sebesar jumlah penurunan harga akibat cacat tersebut dan menyimpan pakaian tersebut, atau jika ia mau, ia dapat membayar jumlah penurunan harga akibat pemotongan atau pewarnaan dan mengembalikannya." }
summary:
  ar: "قال: وإن ابتاع رجل ثوبا وبه عيب من حرق أو عوار، فزعم الذي باعه أنه لم يعلم بذلك، وقد قطع الثوب الذي ابتاعه، أو صبغه، فالمبتاع بالخيار: إن شاء أن يوضع عنه قدر ما نقص الحرق أو العوار من ثمن الثوب، وإن شاء أن يغرم ما نقص التقطيع أو الصبغ من ثمن الثوب ويرده. فإن كان المبتاع قد صبغ الثوب صبغا يزيد في ثمنه، فالمبتاع بالخيار: إن شاء أن يوضع عنه قدر ما نقص العيب من ثمن الثوب، وإن شاء أن يكون شريكا للذي باعه الثوب، فعل. {cite:muwatta-maruf-1997 p.297}"
  tr: "Şöyle dedi: Bir kişi yanık veya kusur gibi bir kusuru olan bir giysi satın alırsa ve satıcı bunun farkında olmadığını iddia ederse ve giysi kesilmiş veya boyanmışsa, alıcının iki seçeneği vardır: ya fiyatın yanık veya kusur miktarı kadar düşürülmesini talep eder ya da kesme veya boyama nedeniyle oluşan fiyat indirimini ödeyerek giysiyi iade eder. Eğer alıcı giysiyi fiyatını artıracak şekilde boyamışsa, alıcının iki seçeneği vardır: ya fiyatın kusur miktarı kadar düşürülmesini talep eder ya da satıcıyla ortak olur, hangisini isterse. {cite:muwatta-maruf-1997 s.297}"
  id: "Dia berkata: Jika seseorang membeli pakaian dengan cacat seperti bekas terbakar atau kerusakan, dan penjual mengklaim bahwa dia tidak menyadarinya, dan pakaian tersebut telah dipotong atau diwarnai, pembeli memiliki pilihan: apakah harga dikurangi sebesar jumlah kerusakan atau cacat tersebut, atau membayar jumlah pengurangan harga karena pemotongan atau pewarnaan dan mengembalikan pakaian tersebut. Jika pembeli mewarnai pakaian tersebut dengan cara yang meningkatkan harganya, pembeli memiliki pilihan: apakah harga dikurangi sebesar jumlah kerusakan tersebut, atau menjadi mitra dengan penjual, mana pun yang dia pilih. {cite:muwatta-maruf-1997 p.297}"
