label: { ar: "الموطأ 2187 — يحيى عن مالك: وإن ابتاع رجل ثوبا به عيب من حرق أو عوار، فزعم البائع أنه لم يعلم، وقد قطع المشتري الثوب أو صبغه، فالمبتاع بالخيار: إن شاء أن يوضع عنه قدر ما نقص العيب من ثمن الثوب ويمسكه، وإن شاء أن يغرم ما نقص التقطيع أو الصبغ من ثمنه ويرده", en: "Muwatta 2187" }
summary:
  ar: "قال: وإن ابتاع رجل ثوبا وبه عيب من حرق أو عوار، فزعم الذي باعه أنه لم يعلم بذلك، وقد قطع الثوب الذي ابتاعه، أو صبغه، فالمبتاع بالخيار: إن شاء أن يوضع عنه قدر ما نقص الحرق أو العوار من ثمن الثوب، وإن شاء أن يغرم ما نقص التقطيع أو الصبغ من ثمن الثوب ويرده. فإن كان المبتاع قد صبغ الثوب صبغا يزيد في ثمنه، فالمبتاع بالخيار: إن شاء أن يوضع عنه قدر ما نقص العيب من ثمن الثوب، وإن شاء أن يكون شريكا للذي باعه الثوب، فعل. {cite:muwatta-maruf-1997 p.297}"
