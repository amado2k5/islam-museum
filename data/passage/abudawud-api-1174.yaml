label: { ar: "سنن أبي داود 1174 — تربية الأب ووصيته", en: "Sunan Abi Dawud 1174 — the father raising and counselling", ur: "سنن ابی داؤد 1174 — باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 1174 — El padre que cría y aconseja" }
text: "… ثُمَّ أَنْشَأَتْ سَحَابَةً ثُمَّ اجْتَمَعَتْ ثُمَّ أَرْسَلَتِ السَّمَاءُ عَزَالِيَهَا فَخَرَجْنَا نَخُوضُ الْمَاءَ حَتَّى أَتَيْنَا مَنَازِلَنَا فَلَمْ يَزَلِ الْمَطَرُ إِلَى الْجُمُعَةِ الأُخْرَى فَقَامَ إِلَيْهِ ذَلِكَ الرَّجُلُ أَوْ غَيْرُهُ فَقَالَ يَا رَسُولَ اللَّهِ تَهَدَّمَتِ الْبُيُوتُ فَادْعُ اللَّهَ أَنْ يَحْبِسَهُ فَتَبَسَّمَ رَسُولُ اللَّهِ ثُمَّ قَالَ \" حَوَالَيْنَا وَلاَ عَلَيْنَا \". فَنَظَرْتُ إِلَى السَّحَابِ يَتَصَدَّعُ حَوْلَ الْمَدِينَةِ كَأَنَّهُ إِكْلِيلٌ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1174، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1174 (The Book Of The Prayer For Rain (Kitab al-Istisqa')), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1174، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 1174 (El Libro de la Oración para la Lluvia (Kitab al-Istisqa')), menciona la crianza y el consejo paternos. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
