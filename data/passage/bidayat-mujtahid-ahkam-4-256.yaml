text: "… ينطلق على المصلى ندب إلى التنفل قبلها. ومن شبهها بالصلاة المفروضة استحب التنفل قبلها وبعدها كما قلنا. ورأى قوم أن التنفل قبلها وبعدها من باب المباح الجائز، لا من باب المندوب، ولا من باب المكروه، وهو أقل اشتباهاً إن لم …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 256، يرد فيه ذكر الفرض، والمستحب، والمندوب، والنافلة والنوافل، والمكروه، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 256, whose wording mentions the obligatory (fard), the recommended (mustahabb), the recommended (mandub), the supererogatory (nafila), the disliked (makruh), the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 256 کا اقتباس جس میں فرض، مستحب، مندوب، نفل اور نوافل، مکروہ، مباح، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 256, dont le texte mentionne l'obligatoire (fard), le recommandé (mustahabb), le recommandé (mandub), le surérogatoire (nafila), le réprouvé (makruh), le permis (mubah), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 256, cuyo texto menciona lo obligatorio (fard), lo recomendado (mustahabb), lo recomendado (mandub), lo supererogatorio (nafila), lo reprobado (makruh), lo permitido (mubah), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
