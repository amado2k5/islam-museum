label: { ar: "سنن أبي داود 2032 — الحرام", en: "Sunan Abi Dawud 2032 — the unlawful", ur: "سنن ابی داؤد 2032 — حرام", es: "Sunan Abi Dawud 2032: lo ilícito", fr: "Sunan Abi Dawud 2032 — l'illégal" }
text: "… عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنِ الزُّبَيْرِ، قَالَ لَمَّا أَقْبَلْنَا مَعَ رَسُولِ اللَّهِ مِنْ لِيَّةَ حَتَّى إِذَا كُنَّا عِنْدَ السِّدْرَةِ وَقَفَ رَسُولُ اللَّهِ فِي طَرَفِ الْقَرْنِ الأَسْوَدِ حَذْوَهَا فَاسْتَقْبَلَ نَخِبًا بِبَصَرِهِ وَقَالَ مَرَّةً وَادِيَهُ وَوَقَفَ حَتَّى اتَّقَفَ النَّاسُ كُلُّهُمْ ثُمَّ قَالَ \" إِنَّ صَيْدَ وَجٍّ وَعِضَاهَهُ حَرَامٌ مُحَرَّمٌ لِلَّهِ \". وَذَلِكَ قَبْلَ نُزُولِهِ الطَّائِفَ وَحِصَارِهِ لِثَقِيفٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2032، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2032 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2032، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2032 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2032 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
