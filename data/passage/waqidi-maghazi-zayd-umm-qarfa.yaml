ref: "564"
label: { ar: "سرية زيد بن حارثة إلى أم قرفة", en: "Sariyya of Zayd ibn Haritha to Umm Qirfa", es: "Sariyya de Zayd ibn Haritha a Umm Qirfa", fr: "Sariyya de Zayd ibn Haritha à Umm Qirfa", ur: "زید بن حارثہ کی ساریہ ام قرفہ سے" }
text: "فأتى زيد فقرع الباب، فقام إليه رسول الله يجر ثوبه عريانا، ما رأيته عريانا قبلها، حتى اعتنقه وقبله، ثم سأله فأخبره بما ظفره الله"
summary:
  ar: "بعث النبي زيد بن حارثة — ابنه بالتبني — إلى أم قرفة وبني فزارة بعد هزيمة أهل بئر معونة، فقتلها وأهلها وأسر الجارية التي وهبها النبي لحزن بن أبي وهب من الأنصار. ويذكر الواقدي أن عائشة روت حديثا في هذا الباب، وأن النبي لما رجع زيد قام إليه يجر ثوبه عريانا حتى اعتنقه وقبله وسأله عما ظفره الله به."
  en: "After the defeat at Bi'r Ma'una, the Prophet sent his adopted son Zayd ibn Haritha to Umm Qirfa and Banu Fazar; he killed her household and captured the slave-girl later gifted to Hazzan ibn Abi Wahb of the Ansar. The chapter also carries Aisha's narration, and the scene of the Prophet rising to meet Zayd, embracing and kissing him as he returned."
  es: "Tras la derrota en Bi'r Ma'una, el Profeta envió a su hijo adoptivo Zayd ibn Haritha a Umm Qirfa y Banu Fazar; allí, Zayd asesinó a su familia y capturó a la esclava que posteriormente fue entregada a Hazzan ibn Abi Wahb de los Ansar. El capítulo también incluye la narración de Aisha y la escena en la que el Profeta se levanta para recibir a Zayd, lo abraza y lo besa a su regreso."
  fr: "Après la défaite de Bi'r Ma'una, le Prophète envoya son fils adoptif Zayd ibn Haritha auprès d'Umm Qirfa et des Banu Fazar; il massacra sa famille et captura l'esclave qui fut plus tard offerte en cadeau à Hazzan ibn Abi Wahb des Ansar. Ce chapitre rapporte également le récit d'Aïcha, ainsi que la scène où le Prophète se lève pour accueillir Zayd, l'embrasse et le serre dans ses bras à son retour."
  ur: "بئر معونہ میں شکست کے بعد رسول اللہ نے اپنے لے پالک بیٹے زید بن حارثہ کو ام قرفہ اور بنو فجر کے پاس بھیجا۔ اس نے اس کے گھر والوں کو قتل کر دیا اور اس لونڈی کو پکڑ لیا جو بعد میں انصار کے حذان بن ابی وہب کو تحفے میں دی گئی تھی۔ اس باب میں عائشہ کی روایت بھی ہے، اور نبی کا زید سے ملنے کے لیے اٹھنے کا منظر، جب وہ واپس آئے تو انہیں گلے لگاتے اور بوسہ دیتے ہیں۔"
