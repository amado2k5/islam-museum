text: "… حظر أو يحير على حسب أحوال المفروض كافى المناجاة فانه كان جع الجوامع كمختصر يناجى النبى بلا تقديم صدقة ثم فرض اللّٰه تقديم الصدقة ثم أزال ذلك ابن الحاجب وغيرهما من فردهم على ما كانوا عليه وهذا الحل هو الذى …"
summary:
  ar: "مقطع من إرشاد الفحول للشوكاني، ص 190، يرد فيه ذكر ما فرضه الله ورسوله، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shawkani's Irshad al-Fuhul, p. 190, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ارشاد الفحول، شوکانی، ص 190 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Irshad al-Fuhul de al-Shawkani, p. 190, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Irshad al-Fuhul de al-Shawkani, p. 190, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şavani'nin *İrşad el-Fuhul* adlı eserinin 190. sayfasından, Allah ve Resulü'nün emrettiği hususlardan bir alıntı. Metin, makine tarafından okunabilir taranmış bir kopyadan alınmış olup, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Irshad al-Fuhul* karya Al-Shawkani, halaman 190, yang menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya. Teks ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin dan diringkas dalam sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
