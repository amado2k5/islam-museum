text: "… بأمر عظيم، أما إني لا أخيبك بوجه ربي، بعني. قال : فقدمه إلى السوق فباعه بأربعمائة درهم، فمكث عند المشتري زمانا لا يستعمله في شيء، فقال له : إنك إنما ابتعتني التماس خير فأوصني بعمل، قال : أكره أن أشق …"
