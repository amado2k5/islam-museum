text: |-
  ٤٧٦
  لمارأت ساتى دما استعبرت • لله درّ اليوم من لامها
  وقال الاعشى وهرقلايوم ذى ساتى دما • من:ى برجان ذى الباس رخ
  وقد حذف يز يدبن مفرغ الحيرى منه الميم فقال • فد رسوى فايدافبصرى• والمدمى
  السهم الذى عليه حرة الدم وقد جسدبه-تى يضرب الى السواد وكان الرجل اذارمى البعدو
  بسهم فأصاب ثم رماه به العد ووعليه دم جعله فى كانته تبركابه ويقال المدمى الشديد الحهرة
  من الخيل وغيره وكل أحرشديد الهمرة فهومدى يقال كيت مدمى ويقال المدمى السهم
  الذى يتعاوده الرماة بينه-م وهو راجع الى ماذكرناه الاصمعى المستدمى الذى يستخرج من
  غر يمه دينه بالرفق قال والمستدمى أيضا الذى يقطر من أنفه الدم المطأطئ رأسه وأدميته أنا
  ودميقه تدمية اذاضر بته حتى خرح منه دم قال رؤية
  فلا تكونى ياابنة الاشم • ورقاءدمى ذتبها المدمى
  والدامية الشبجة التى تدمى ولا تسيل ودم الاخوين العندم والدمة أخص من الدم كماقالوا
  بياض وبياضة ن دنوت منه دنوا وأدنيت غيرى وسميت الدنيا لدنوها والجمع دنى
  مثل الكبرى والكبر والصغرى والصغر وأصل دنوغذفت الواولاججتماع الساسكنين
  والنسبة اليهادنياوى" ويقال دنيوى ودنى ويقال أدنت الناقة اذاد فانتاجها ودانيت بيز
  الامرين أى قاربت ومنهمادفاوة أى قرابة يقسال ماتزدادهما الاقرباودناوة والدنى
  القريب غيرههموزوقوام لقيته أدتى دنىَ أى أول:ى وأما الدنى بمعن الدون فهو مهموز
  ويقال انه لبدنى فى الامورتدنية أى يتتبع صغيرها وخسيها وفى الحديث اذا أكلتم
  فدنوا أى كلوامما يليكم والمدنى من الرجال الضعيف وتدنى فلان أى دناقليلا قليلا وتدانوا
  أى دنابعضهم من بعض والادنيان واديات والدناموضع بالبادية قال
  فأمواء الدنافعويرضات • دوارس بعد أحيا حلال
  وتقول هوابن عمّ دنى ودنيا ود نيا ودنيا اذا ضممت الدال لم تجر واذا كسرت ان شنت
  أجر يت وان شئت لم تجر فأمّا اذا أضفت العتمّ الى معرفة لم يجز الخفض فى دنى كقولك هو ابن
  عمه دنياودنية أى لحمالان دنيانكرة فلا تنكون نعتالمعرفة وى الدواء ممدود واحد
  الادوية والدواء بالكسر لغة فيه وهذا البيت ينشد على هذه اللغة
  يقولون مخم رروذ اك دواؤه • علىّ اذن منى الى البيت واجب
  أى قالوا ان الجلد والتعز يردواؤه قال وعلى جة ماشيا لن كنت شر:تها ويقال الدواءانما
  هو مصدر داويته مداوأة ودواء ورجل دو بكسر الواوأى فاسد الجوف من داء وامرأة
  دوية فاذاقات رجل دوى بالفتح استوى فيه المذكروالمؤنث والجع لانه مصدرفى الاص-ل
  ويقال أيضارجل دوى بالفتح أى أحق وأنشد الفراء
  وقد أقود بالدوى المزكل • أخرس فى السفر بقاق المتزل
  ويقال تركت فلانادوى ما أدى به حماة والدوى مقصورا المرض:قول منه دوى بالكم
  أى مرض ودوى هدره أيتا أى ضغن وأدواه غيره أى أمرضه وداواه أى عالجه يقال هو
  يدوى ويداوى أى بعالج وتداوى بالشئ أى تعالج به ودووى الشئ أى ءولج ولا يدغم فرقا
