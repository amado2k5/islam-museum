label:
  ar: "أبو داود 3383 — أنا ثالث الشريكين ما لم يخن أحدهما صاحبه"
  en: "Abu Dawud 3383 — I am the third of two partners as long as neither betrays the other"
  ur: "ابو داود 3383 — میں دو شریکوں کا تیسرا ہوں جب تک ان میں سے کوئی خیانت نہ کرے"
text: "إن الله يقول أنا ثالث الشريكين، ما لم يخن أحدهما صاحبه فإذا خانه خرجت من بينهما ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 3383: أنا ثالث الشريكين ما لم يخن أحدهما صاحبه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 3383: I am the third of two partners as long as neither betrays the other. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 3383: میں دو شریکوں کا تیسرا ہوں جب تک ان میں سے کوئی خیانت نہ کرے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
