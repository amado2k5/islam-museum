text: "… ! وأَنا أَسأَلك أُخرى : أَن تلى تَرِكَنى من بعدى. فقال رسول اللّٰه : نعم. فخرج عبد اللّٰه وقاتل حتى قُتل، ومُثل به كلّ المثْل ودُفِن، ودُفن هو وحمزة فى قبرٍ واحد. ووَلِى تَرِكَته رسول اللّٰه فاشترى لأُمّه مالاً بخَيْبَر. …"
