label:
  ar: "الترمذي 3540 — يا ابن آدم إنك ما دعوتني ورجوتني غفرت لك"
  en: "Tirmidhi 3540 — Son of Adam, as long as you call on Me and hope in Me, I forgive you"
  ur: "ترمذی 3540 — اے ابن آدم، جب تک تو مجھے پکارے اور مجھ سے امید رکھے میں تجھے بخشتا رہوں گا"
text: "قال الله يا ابن آدم إنك ما دعوتني ورجوتني غفرت لك على ما كان فيك ولا أبالي يا ابن آدم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك ولا أبالي يا ابن آدم إنك لو أتيتني بقراب الأرض خطايا …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3540: يا ابن آدم إنك ما دعوتني ورجوتني غفرت لك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3540: Son of Adam, as long as you call on Me and hope in Me, I forgive you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3540: اے ابن آدم، جب تک تو مجھے پکارے اور مجھ سے امید رکھے میں تجھے بخشتا رہوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
