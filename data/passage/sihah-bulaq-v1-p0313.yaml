text: |-
  قوله المزه ربوزن منبر فهواسم آلة
  وأما المزهر بالضم فى واسم فاعل
  من أزهر الذار للضيفان وبه
  سحى السسبوطى كتابه فى أنواع
  اللغية الحمسين قاله نصر
  ٢٢٨
  زهراء قال قيس بن انلخطيم
  تمشى كمشى زهرا. فى دمث الروض الى الحزن دونها الجرف
  وأزهر النبت ظه- رزهره والمزهر العود الذى يضرب به والازدهار بالشى الاحتفاظ به
  وفى الحديت أنه أوصى أباقتادة بالانا. الذى توضأمنه فقال ازدهربم ذافان لهشأنا أى
  احتفظ به ولا تضيعه
  صل المين ( أر سؤر الفأرة وغيرها وابمع الاسا روقد أسأر ويقال
  اذا شربت فأستر أى أيق شيئا من الشراب فى قعر الاناء والنعت منه سار على غير قياس لان
  قياسه مسترو نظيره اجبره فهوجبار قال الاخطل
  وشارب مريح بالكاس نادمن • لابالحصور ولافيهابسا ر
  ى لا يستر كثير اويروى ولا فيها ياروه والمعربد الوثاب وانم أدخل الباءفى اخب لان
  ذهب به امذهب ليس لمضارعته له فى النفى ⁦(سبر)⁩ سبرت الجرح أسبره اذا نظرت ما غوره
  والمسبارما يسبر به الجرح والسبار مثله وكل أمر رزته فقد سبرته واستبرته يقال
  حدت مسبره ومخبره والسبرة الغداة الباردة وفى الحديث اسباغ الوضوه فى السبرات
  والسير بالكسر الهيئة بقال فلان حن الحبر والسبرادا كان يميلاحسن الهيئة قال الشاعر
  أنا ابن أبى البراء وكل قوم * لهم من سبر والده-م رداء
  وسبرى أننى حرّ تنىّ وانى لا يزايلف الحياه
  قال ابن الاعرابى سمعت أبازياد الكلابى يقول رجعث من مي والى البدو فقال لى بعض
  أهله أما السبر فضرى وأما السان فبدوى والسابرى ضرب من المياب رقيق وفى المشل
  عرض سابرئ يقوله من يعرض عليه الشىء رضالا يبالغ فيه لان السابرى من أجود
  الثباب يرغب فيه بأدتئرض قال الشاعر
  بمنزلة لا يشتكى السل أهلها • وعيش كمس السابرى رقيق
  والسابرى أيضاضرب من التمريقال أجود تر بالكوفة النرسيان والسابرى ⁦(سبطر)⁩
  اسبطراضطجع وامتد وأسد سيطر مثال هز برأى يمند عندالوثبة ويحال سبطرات طوال على
  وجه الارض والتّاءليست للتأنيت وإنماهى كة واهم حامات ورجالات فى بجمع المذكر
  والسبيطر مثال العمئل طائرطويل العنق جدّا تراء أبدافى الماء الضهضاح بكن أيا
  العيزار بر) اسبكرت الجارية استقامت واعتدات وقال أبو عمرو
  اسبكر الرجل اض ممجع واستد مثل اسبطر وأنشد
  اذالهدان حار واسبكرًا • وكان كالعدل يجرّجرًا
  وقال أبو زياد الكلابى المسبكر هو الشاب المعتدل التام حكاء عنه أبو عبيد قال اهر والقيس
  الى مثلها يرنو الحليم صبابة • اذا ما اسبكرت بين درع ومجول
  وشعر مسبكرأى مسترسل قال ذوارمة
  وأسود كالاساودمبكرا على المتنيز من-دلاجفالا
  ⁦(لÜتر)⁩ السترواحد الستور والاستاروالسترة مايستربه كائناما كان وكذلك الستارة
  والجمع
