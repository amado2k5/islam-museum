label: { ar: "الموطأ 1104 — عبد الله بن عمرو بن العاص: دخل على أبيه عمرو فوجده يأكل، فقال: إني صائم، فقال: هذه الأيام التي نهانا رسول الله عن صيامهن وأمرنا بفطرهن. قال مالك: هي أيام التشريق", en: "Muwatta 1104", es: "Muwatta 1104", fr: "Muwatta 1104", ur: "موطا 1104", tr: "El-Muvatta 1104 — Abdullah ibn Amr ibn el-As: Babası Amr'ın yanına girdi ve onu yemek yerken buldu. Bunun üzerine, \"Oruçluyum\" dedi. Babası, \"Bunlar, Allah Resulü'nün oruç tutmayı yasakladığı ve orucu bozmamızı emrettiği günler\" dedi. Malik, \"Bunlar Teşrik günleridir\" dedi.", id: "Al-Muwatta 1104 — Abdullah ibn Amr ibn al-As: Dia masuk menemui ayahnya, Amr, dan mendapatinya sedang makan, lalu dia berkata: Aku sedang berpuasa. Ayahnya berkata: Ini adalah hari-hari di mana Rasulullah melarang kita berpuasa dan memerintahkan kita untuk berbuka puasa. Malik berkata: Ini adalah hari-hari Tashreeq" }
text: "هذه الأيام التي نهانا رسول الله عن صيامهن، وأمرنا بفطرهن"
summary:
  ar: "يرويه مالك عن يزيد بن عبد الله بن الهاد عن أبي مرة مولى أم هانئ عن عبد الله بن عمرو بن العاص، أنه دخل على أبيه عمرو بن العاص فوجده يأكل، فدعاه، فقال: إني صائم. فقال عمرو: هذه الأيام التي نهانا رسول الله عن صيامهن وأمرنا بفطرهن. قال مالك: هي أيام التشريق. ويذكر المحقق أن يحيى قال «مولى أم هانئ امرأة عقيل» وهو خطأ فاحش أدركه ابن وضاح، وأن الصواب أخت أم هانئ، وأن ابن عبد البر ⁦(التمهيد 23/67–68)⁩ بين أن أبا مرة لم يسمع من عمرو. {cite:muwatta-maruf-1997 p.506}"
  tr: "Malik, Yezid ibn Abdullah ibn el-Had'dan, o da Ümmü Hani'nin azatlı kölesi Ebu Murra'dan, o da Abdullah ibn Amr ibn el-As'tan rivayet ettiğine göre, babası Amr ibn el-As'ın yanına girdiğinde onu yemek yerken bulmuş. Onu yanına çağırmış ve babası, \"Oruçluyum\" demiş. Amr, \"Bunlar, Allah Resulü'nün oruç tutmayı yasakladığı ve orucumuzu bozmamızı emrettiği günler\" demiş. Malik, \"Bunlar Teşrik günleridir\" demiş. Araştırmacı, Yahya'nın \"Ümmü Hani'nin azatlı kölesi, Akil'in karısı\" dediğini, bunun İbn Waddah'ın fark ettiği büyük bir hata olduğunu ve doğru ismin Ümmü Hani'nin kız kardeşi olduğunu belirtiyor. İbn Abd el-Barr (el-Tamheed 23/67-68), Ebu Murra'nın Amr'dan duymadığını açıklığa kavuşturmuştur. {cite:muwatta-maruf-1997 s.506}"
  id: "Malik meriwayatkannya dari Yazid ibn Abdullah ibn al-Had, dari Abu Murrah, budak yang dibebaskan oleh Umm Hani, dari Abdullah ibn Amr ibn al-As, bahwa ia menemui ayahnya, Amr ibn al-As, dan mendapatinya sedang makan. Ia memanggilnya, dan Amr berkata, “Aku sedang berpuasa.” Amr berkata, “Ini adalah hari-hari di mana Rasulullah melarang kita berpuasa dan memerintahkan kita untuk berbuka puasa.” Malik berkata, “Ini adalah hari-hari Tashreeq.” Peneliti menyebutkan bahwa Yahya berkata, “Budak yang dibebaskan oleh Umm Hani, istri Aqil,” yang merupakan kesalahan besar yang disadari oleh Ibn Waddah, dan bahwa nama yang benar adalah saudara perempuan Umm Hani. Ibn Abd al-Barr (al-Tamheed 23/67–68) mengklarifikasi bahwa Abu Murrah tidak mendengar dari Amr. {mengutip:muwatta-maruf-1997 hal.506}"
