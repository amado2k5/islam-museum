label: { ar: "الموطأ 1104 — عبد الله بن عمرو بن العاص: دخل على أبيه عمرو فوجده يأكل، فقال: إني صائم، فقال: هذه الأيام التي نهانا رسول الله عن صيامهن وأمرنا بفطرهن. قال مالك: هي أيام التشريق", en: "Muwatta 1104" }
text: "هذه الأيام التي نهانا رسول الله عن صيامهن، وأمرنا بفطرهن"
summary:
  ar: "يرويه مالك عن يزيد بن عبد الله بن الهاد عن أبي مرة مولى أم هانئ عن عبد الله بن عمرو بن العاص، أنه دخل على أبيه عمرو بن العاص فوجده يأكل، فدعاه، فقال: إني صائم. فقال عمرو: هذه الأيام التي نهانا رسول الله عن صيامهن وأمرنا بفطرهن. قال مالك: هي أيام التشريق. ويذكر المحقق أن يحيى قال «مولى أم هانئ امرأة عقيل» وهو خطأ فاحش أدركه ابن وضاح، وأن الصواب أخت أم هانئ، وأن ابن عبد البر (التمهيد 23/67–68) بين أن أبا مرة لم يسمع من عمرو. {cite:muwatta-maruf-1997 p.506}"
