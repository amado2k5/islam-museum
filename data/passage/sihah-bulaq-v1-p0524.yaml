text: |-
  MTY
  ف ل الر يت ربت الصبت يربته تر بيتا أى وباه قال الراجز
  سميتها اذ ولدت تموت * والقبرمهرضامن زميت • ايس ان ضمنه تربيت
  ⁦( رتت)⁩ ابن الاعرابى الرت رئيس البلدوه ؤلا رتوت البلدوالرتوت أيضا الخنازير والرتة
  بالضم العجمة فى الكلام والحكلة فيه رجل أرت بين الرتت وفى لسانه رتة وأرته اللّه فرت
  ( رفت الرقات الخطام قال اللّٰه تعالى وقالوا أثذاكناءظا ما ورقاتا قال الاخفش
  تقول منه رفت التى فهو مر قوت اذافت
  سل الزاى نت قال الفرازتت العروس أنتهازتا اذا زيتها فترتتت أى
  تزينت ( فت الزفت بالسكسر القير ومنه المزفت تقول جرّة منفتة أى مطلية بالزفت
  ⁦( ذكت)⁩ قال اللحياتى قرية من كوتة أى مملوءة وزكت القرية تزكيتاملاً ها وأذكتت
  المرأة بعلام ولدته زمت الزميت الوقور قال الراحز والقبرصهرضامن رميت والزمّيت
  مثال الفسمق أوقر من الزمت وفلان أزمت الناس أى أوقرهم وما أشدتزمته عن
  الفرّاء يت الزيتون معروف الواحدة زيتونة والزيت دهنه وزت الطعام أزيته
  زيتا اذاجعات فيه الزيت وطعام مزيت ء-لى النقص وحزيوت عسلى التمام وقال
  فى النقصان والفرزدق جاؤابعير لم تسكن يمنية • ولاحفطة الشام المزيت خيرها
  وزت القوم جعلت أدمهسم الزيت وزيتهسم اذا زودتهم الزيت وجاوًا يستزيتون أى
  يستوهبون الزيت
  وأبوز يدمنله الاأنه لم يقل حتى يموت ⁦(سبت)⁩ السبت الراحة والسيت الدهر والسبت
  حلق الرأس والسيت ارسال الشعر عن العقص والديت ضرب من سير الابل قال أبو عرو
  هوالعنق قالح.دين تور ومطوية الاقراب أمانهارها • فسيت وأماالملهافذم.ل
  وست علاوته سبتا اذ اضرب عنقه ومنه "؟ى يوم السبت لا نقطاع الايام عنده والجع أسبن
  وسبوت والسبت قيام اليهودبأمرسبتها قال اللّٰه تعالى ويوم لايسيتون وأسبتت اليهود أى
  دخلت فى السبت أبو عمر والمسبت الذى لا يتحرّك وقد أسبت والسبات النوم وأصله الراحة
  ومنه قوله تعالى وجعلنا نومكم سباتاتقول منه سبت بيت هذه و-دها بالضم
  قال ابن أحو
  وكتا وهسم كابنى سبات تفرقا * سوى ثم كانا متجداوتهاميا
  قالوا السبات الدهروابناه الليل والنهاروا لمسبوت الميت والمغشى عليه وكذاك العليل
  اذا كان ملقى كالمائم يغمض عينه فى أكثر أحواله مسبوت والسبت بالكسر جاود البقر
  المدبوغة بالقرظ تحذى مته التعال السبتية وفى الحديث ياصاحب السبتين اخلع سبتيك
  وخرج الحجاج يتوذف فى سبتين له ووطب منسبت اذاعه الارطاب أبو عروالسبنتى
  والسبندى الجرىء المقدم من كل شى والياء للالحاق لا للتأنيث ألاترى انّ الهاء تلحقه يقال
  سينتاة وسبنداة قال ابن أحر بصف رجلا
  كأن الليل لا يغوعليه * اذازجر السبنتاة الامونا
  ٢٠
  قوله القير فى بعض قسخ كالقير
