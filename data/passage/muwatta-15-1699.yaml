label: { ar: "الموطأ 1699 — مالك: إذا طلق العبد الأمة وهي أمة ثم عتقت بعد، فعدتها عدة الأمة، لا يغير عدتها عتقها", en: "Muwatta 1699", es: "Muwatta 1699", fr: "Muwatta 1699", ur: "موطا 1699", tr: "El-Muvatta 1699 — Malik: Bir köle, henüz köle iken bir kadın köleden boşanırsa ve daha sonra kadın azat edilirse, bekleme süresi bir kölenin bekleme süresiyle aynıdır; azat edilmesi bekleme süresini değiştirmez.", id: "Al-Muwatta 1699 — Malik: Jika seorang budak laki-laki menceraikan budak perempuan ketika ia masih berstatus budak, dan kemudian ia dibebaskan, masa iddahnya sama dengan masa iddah seorang budak; pembebasannya tidak mengubah masa iddahnya." }
summary:
  ar: "يقول مالك الأمر عندنا في طلاق العبد الأمة، إذا طلقها وهي أمة ثم عتقت بعد، فعدتها عدة الأمة، لا يغير عدتها عتقها، كانت له عليها رجعة أو لم تكن، لا تنتقل عدتها. {cite:muwatta-maruf-1997 p.95}"
  tr: "Malik, bir köle kadının boşanmasıyla ilgili olarak şunları söylüyor: Eğer bir erkek onu köle iken boşayıp daha sonra özgür bırakırsa, bekleme süresi köle bir kadınınkiyle aynıdır. Özgür bırakılması, erkeğin onu geri alma hakkı olup olmamasına bakılmaksızın bekleme süresini değiştirmez. Bekleme süresi değişmez. {cite:muwatta-maruf-1997 s.95}"
  id: "Malik mengatakan mengenai perceraian seorang budak perempuan: jika ia menceraikannya saat ia masih menjadi budak dan kemudian ia dibebaskan, masa iddahnya sama dengan masa iddah seorang budak perempuan. Pembebasannya tidak mengubah masa iddahnya, terlepas dari apakah ia berhak untuk mengambilnya kembali atau tidak. Masa iddahnya tidak berubah. {cite:muwatta-maruf-1997 p.95}"
