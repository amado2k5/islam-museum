label: { ar: "صحيح البخاري 1390.3 — الأب والأبوة", en: "Sahih al-Bukhari 1390.3 — the father and fatherhood", ur: "صحیح بخاری 1390.3 — باپ اور والدیت", es: "Sahih al-Bukhari 1390.3 — El padre y la paternidad" }
text: "حَدَّثَنَا فَرْوَةُ، حَدَّثَنَا عَلِيٌّ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، لَمَّا سَقَطَ عَلَيْهِمُ الْحَائِطُ فِي زَمَانِ الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ أَخَذُوا فِي بِنَائِهِ، فَبَدَتْ لَهُمْ قَدَمٌ فَفَزِعُوا، وَظَنُّوا أَنَّهَا قَدَمُ النَّبِيِّ فَمَا وَجَدُوا أَحَدًا يَعْلَمُ ذَلِكَ حَتَّى قَالَ لَهُمْ عُرْوَةُ لاَ وَاللَّهِ مَا هِيَ قَدَمُ النَّبِيِّ مَا هِيَ إِلاَّ قَدَمُ عُمَرَ ـ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1390.3، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1390.3 (Funerals (Al-Janaa'iz)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1390.3، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1390.3 (Funerales (Al-Janaa'iz)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
