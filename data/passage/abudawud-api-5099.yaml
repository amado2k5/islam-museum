label: { ar: "سنن أبي داود 5099 — الأب والأبوة", en: "Sunan Abi Dawud 5099 — the father and fatherhood", ur: "سنن ابی داؤد 5099 — باپ اور والدیت" }
text: "حَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، حَدَّثَنَا سُفْيَانُ، عَنِ الْمِقْدَامِ بْنِ شُرَيْحٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ،ا أَنَّ النَّبِيَّ كَانَ إِذَا رَأَى نَاشِئًا فِي أُفُقِ السَّمَاءِ تَرَكَ الْعَمَلَ وَإِنْ كَانَ فِي صَلاَةٍ ثُمَّ يَقُولُ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّهَا \". فَإِنْ مُطِرَ قَالَ \" اللَّهُمَّ صَيِّبًا هَنِيئًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5099، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5099 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5099، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
