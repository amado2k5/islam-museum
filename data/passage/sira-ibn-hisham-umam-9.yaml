text: "… ابن هشام: فالعربُ كلُّها من ولد إسماعيلَ وقَخْطَانَ، وبعضُ أهل اليمن يقول: قَخْطَانُ من ولد إسماعيل، ويقول: إسماعيل أبو العرب كلِّها. قال ابن إسحاق: عَادُ بْنُ عوص بْنِ إِرَمَ بْنِ سَامِ بْنِ نُوحٍ، وثَمُودُ وجَدِيسٌ ابنا عَابر بن إرَمَ بن …"
