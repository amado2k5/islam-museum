text: "… لهم والرفق بهم، وأخبر الملك أنه حفيظ، أي قوي على حفظ ما لديه أمين عليه، عليم بضبط الأشياء ومصالح الأهراء. وفي هذا دليل على جواز طلب الولاية لمن علم من نفسه الأمانة والكفاءة. وعند أهل الكتاب : أن فرعون عظم …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 316، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
