label: { ar: "سنن ابن ماجه 3812 — مغفرة ما تقدم من الذنب", en: "Sunan Ibn Majah 3812 — forgiveness of past sins", ur: "سنن ابن ماجہ 3812 — پچھلے گناہوں کی مغفرت", es: "Sunan Ibn Majah 3812 — Perdón de los pecados pasados", fr: "Sunan Ibn Majah 3812 — le pardon des péchés passés", tr: "Sunan İbn Majah 3812 — Geçmiş günahların bağışlanması", id: "Sunan Ibn Majah 3812 — Pengampunan dosa masa lalu" }
text: "حَدَّثَنَا نَصْرُ بْنُ عَبْدِ الرَّحْمَنِ الْوَشَّاءُ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ الْمُحَارِبِيُّ، عَنْ مَالِكِ بْنِ أَنَسٍ، عَنْ سُمَىٍّ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ مِائَةَ مَرَّةٍ غُفِرَتْ لَهُ ذُنُوبُهُ وَلَوْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3812، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3812 (Etiquette), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3812، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3812 (Etiqueta), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3812 (Étiquette), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "İbn Majah'ın Sünen'inde yer alan 3812 numaralı hadis, geçmiş günahların affedilmesinden bahsetmektedir. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3812, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
