text: "حَدَّثَنَا أَحْمَدُ بْنُ مُحَمَّدٍ، أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، أَخْبَرَنَا ابْنُ عُيَيْنَةَ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَيُّوبَ بْنِ بَشِيرٍ، عَنْ سَعِيدٍ الأَعْشَى، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنْ كَانَ لَهُ ثَلاَثُ بَنَاتٍ أَوْ ثَلاَثُ أَخَوَاتٍ أَوِ ابْنَتَانِ أَوْ أُخْتَانِ فَأَحْسَنَ صُحْبَتَهُنَّ وَاتَّقَى اللَّهَ فِيهِنَّ فَلَهُ الْجَنَّةُ ‏\"‏ ‏.‏ قَالَ هَذَا حَدِيثٌ غَرِيبٌ ‏.‏"
summary:
  ar: "قال: من كان له ثلاث بنات أو ثلاث أخوات أو ابنتان أو أختان فأحسن صحبتهن واتقى الله فيهن فله الجنة."
  en: "«Whoever has three daughters or three sisters, or two daughters or two sisters, keeps them good company and is mindful of God regarding them — Paradise is his.»"
  ur: "«جس کے تین بیٹیاں یا تین بہنیں ہوں یا دو بیٹیاں یا دو بہنیں اور وہ ان کی اچھی صحبت رکھے اور ان کے حق میں اللہ سے ڈرے تو اس کے لیے جنت ہے۔»"
  es: "«Quien tenga tres hijas o tres hermanas, o dos hijas o dos hermanas, y las trate bien y se acuerde de Dios respecto a ellas, el Paraíso le pertenece.»"
  fr: "«Celui qui a trois filles ou trois sœurs, ou deux filles ou deux sœurs, qui les traite bien et qui se souvient de Dieu à leur sujet, le Paradis lui appartient.»"
  tr: "Şöyle buyurdu: \"Üç kızı veya üç kız kardeşi, ya da iki kızı veya iki kız kardeşi olan ve onlara iyi davranan, onlarla ilişkilerinde Allah'tan korkan kimsenin cenneti vardır.\""
