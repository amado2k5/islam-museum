label: { ar: "الموطأ 323 — بلاغ: ابن عمر يُسأل أواجب الوتر؟ أوتر رسول الله وأوتر المسلمون", en: "Muwatta 323", es: "Muwatta 323", fr: "Muwatta 323", ur: "موطا 323" }
text: "قد أوتر رسول الله وأوتر المسلمون"
summary:
  ar: "بلاغ في باب الأمر بالوتر: يروي مالك أنه بلغه أن رجلاً سأل عبد الله بن عمر عن الوتر أواجب هو، فقال ابن عمر: قد أوتر رسول الله وأوتر المسلمون، فجعل الرجل يردد عليه وابن عمر يكرر جوابه. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.183}"
  id: "Sebuah riwayat mengenai kewajiban shalat Witir: Malik meriwayatkan bahwa ia mendengar seorang pria bertanya kepada Abdullah ibn Umar tentang shalat Witir, apakah itu wajib. Ibn Umar menjawab, \"Rasulullah shalla Allahu alaihi wa sallam shalat Witir, dan umat Islam juga shalat Witir.\" Pria itu terus mengulangi pertanyaannya, dan Ibn Umar terus memberikan jawabannya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.183}"
