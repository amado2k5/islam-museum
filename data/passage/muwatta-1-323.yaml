text: "قد أوتر رسول الله وأوتر المسلمون"
summary:
  ar: "بلاغ في باب الأمر بالوتر: يروي مالك أنه بلغه أن رجلاً سأل عبد الله بن عمر عن الوتر أواجب هو، فقال ابن عمر: قد أوتر رسول الله وأوتر المسلمون، فجعل الرجل يردد عليه وابن عمر يكرر جوابه. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.183}"
