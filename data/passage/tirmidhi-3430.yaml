label:
  ar: "الترمذي 3430 — من قال لا إله إلا الله والله أكبر صدقه ربه"
  en: "Tirmidhi 3430 — Whoever says there is no god but God and God is greatest, his Lord confirms him"
  ur: "ترمذی 3430 — جو لا الٰہ الا اللہ اور اللہ اکبر کہے اس کا رب اس کی تصدیق کرتا ہے"
text: "من قال لا إله إلا الله والله أكبر . صدقه ربه فقال لا إله إلا أنا وأنا أكبر . وإذا قال لا إله إلا الله وحده . قال يقول الله لا إله إلا أنا وأنا وحدي . وإذا قال لا …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3430: من قال لا إله إلا الله والله أكبر صدقه ربه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3430: Whoever says there is no god but God and God is greatest, his Lord confirms him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3430: جو لا الٰہ الا اللہ اور اللہ اکبر کہے اس کا رب اس کی تصدیق کرتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
