label: { ar: "الموطأ 1486 — مالك: العمة وابن أخيها، أو ابنة الأخ وعمها، إذا هلكا ولم يعلم أيهما مات قبل، لم يرث العم من ابنة أخيه شيئا، ولا ابن الأخ من عمته", en: "Muwatta 1486", es: "Muwatta 1486", fr: "Muwatta 1486", ur: "موطا 1486", tr: "Al-Muwatta 1486 — Malik: Eğer bir teyze ve yeğeni veya bir yeğen ve amcası ikisi de ölürse ve hangisinin önce öldüğü bilinmiyorsa, amca yeğeninden hiçbir şey miras alamaz, yeğen de teyzesinden hiçbir şey miras alamaz.", id: "Al-Muwatta 1486 — Malik: Jika seorang bibi dan keponakannya, atau seorang keponakan perempuan dan paman dari pihak ayah, keduanya meninggal dunia dan tidak diketahui siapa yang meninggal lebih dulu, maka paman dari pihak ayah tidak mewarisi apa pun dari keponakannya, dan keponakan laki-laki pun tidak mewarisi apa pun dari bibinya." }
summary:
  ar: "يقول مالك ومن ذلك أيضا أن تهلك العمة وابن أخيها، أو ابنة الأخ وعمها، فلا يعلم أيهما مات قبل، فإن لم يعلم أيهما مات قبل، لم يرث العم من ابنة أخيه شيئا، ولا يرث ابن الأخ من عمته شيئا. {cite:muwatta-maruf-1997 p.25}"
  tr: "Malik şöyle diyor: Başka bir örnek de, teyze ve yeğeninin ya da yeğen ve amcasının ikisinin de ölmesi ve hangisinin önce öldüğünün bilinmemesidir. Eğer hangisinin önce öldüğü bilinmiyorsa, amca yeğeninden hiçbir şey miras alamaz, yeğen de teyzesinden hiçbir şey miras alamaz. {cite:muwatta-maruf-1997 s.25}"
  id: "Malik berkata: Contoh lain adalah ketika seorang bibi dan keponakannya, atau seorang keponakan perempuan dan pamannya, keduanya meninggal, dan tidak diketahui siapa di antara mereka yang meninggal lebih dulu. Jika tidak diketahui siapa di antara mereka yang meninggal lebih dulu, paman tidak mewarisi apa pun dari keponakannya, dan keponakan juga tidak mewarisi apa pun dari bibinya. {cite:muwatta-maruf-1997 p.25}"
