text: "… أبي أبي! فقالوا: والله ما عرفناه. فقال: يغفر اللّٰه لكم. وأراد رسول الله، ولي، أن يَدِيَهُ، فتصدّق حذيفةُ بدِيته على المسلمين. واحتمل بعضُ الناس قتلاهم إلى المدينة، فأمر رسول الله، وله، بدفنهم حيث صُرعوا، وأمر أن يُدْفن الاثنان والثلاثة في …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 51، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
