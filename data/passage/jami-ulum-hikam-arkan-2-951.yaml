text: "… قال : بينما نحن جلوس عند رسول الله بَلِلُ ذات يوم، إذْ طَلَعَ علينا رجل شديد بياض الثياب، شديد سواد الشعر، لا يُرى عن عبد اللّٰه بن عمرما قال : سمعت رسول اللّٰه وَلِّيِ يقول : بُني الإسلام على خمس …"
