text: |-
  ١ هوذوالرمة وأوه
  زى عصب القطاهملا عليها
  يصف مأءنى فلاة اه
  11E
  وقارعة الدارساحتها وقارعة الطريق أعلاهوقوارع القرآن الايكت التى بقرؤها الانسان
  اذا فزع من الجن أوالانس تحوآية الكرسى كانم ا تفرع الشيطات والقريع الفحل لانه
  مقترع من الابل أى مختاراوأنه يقوع الثاقة قال ذوالرمة
  وقدلاح للسارى سهيل كانه • قريع هجان عارض الشول جافر
  ويروى وقد عارض الشعرى سهيل والقراع السيد يقال قلان قريع دهره وقريعك الذى
  يقارعك وقولهسم مادخات لفلان قريعة بيت قط أى سقف بت ويقال قريعة البيت خير
  موضع فيه ان كان برد فياركنه وان كان ونخيار ظله والقريعة مثل القرعة وهى خيار
  المال وناقة قربعة اذاسكان الفحل يكثر ضرابها و يبطى لقاحها وأفرع الى الحق
  أى رجع وذل يقال أقرع لى فلان قال رؤية
  دعنى فقد يقرع للاضز • صكى ججابى رأسه وبهزى
  أى يصرف صكى اليه ويراض له ويذل وفلان لا بقرع اقراعا اذا كان لا يقبل المشورة
  والنصيحة وأقرعه اى أعطاه خير ماله يقال أقرعوه خير نهيه-م وأقرعت بينهم من القرعة
  واقترعواوتة ارء وابمعنى وأقرعنه كففته ية ال أقرعت الداية إلخامها اذا كيحتها به والتقريع
  التعنيف والتقريع معالجة الفصيل من القرع كانه ينزع ذلك منه كما يقال قذيت العين
  وقزدت البعير وقلمت العود قال أوس بن حجر
  لدى كل أخدود بغادرن دارعا • يجركماجرّ الفصيل المفرّع
  ومضارعة الابطال قرع بعضهم بعضا والمقارعة المساهمة بقال قارعته فقرعته اذا أصايك
  القرعة دونه والاقتراع الاختيار يقال اقترع فلان أى اختير وبت أتقرع أى أتقاب
  وقرفع أبوبطن من بنى تميم رهط بى أنف الذاقة وهوقر يع بن عوف بن كعب بن سعد مي زيد
  متاة ابن تميم وهوأبوالاضبط ربع اقربيع الرحل فى مجله أى تقبض من البرد
  (قريع القريع من التساء البلهاه وسئل اء رابى عنها فقال هى التى تكمل احدى عينيها
  وتترك الاخرى وتلبس قيصها متلوبا وفلان قرئعة مال بالكسبراذا كان يحسن رعية المال
  ويصلح على يديه⁦( قرصع)⁩ الرصعة الانقباض والاستخفاء وقد اقر نصع الرجل أبوزيد
  قرص مت السكاب قرمعته حكاهعفه أبو عبيد وقرصعت المرأة أى مشت مشبة قبيصة قال
  الشاعر اذامشت سالت ولم تقرصع قزع قزع الظبي وغيره يقزع قزوعا أسرع
  وخف ومنه قولهم قوزع الديك اذا غاب فهرب قال بعوب ولاقة-ل قنزع لانه ليس بمأخوذ
  من قنازع الرأس واماهو من قزع يقزع اذاخف فى عدوه هاريا والقزع قطع من السحاب
  رقيقة الواسدة قزعة قال الشاءر ١ كأن وعاله قزع الجهام
  وفى الحديث كانمم فزع اخريف والقزع أيضاصفار الابل والقزع أيضا أن يحلق رأس
  الصبى ويترك فى مواضع منه الشعر متفرقا وقد نهى عنه وقزع رأسه تفز يعا اذاحلق شعره
  ويقيت منه يقبايا فى نواحى رأسه ورجل مقزع رقيق شعر الرأس متفرّقه والمقزع السربع
  الخفيف قال ابن الكيت يقال ماعليه قزاع أى قطعة خرقة وتقزع الفرس أى تهيا للركض
  وقزعته انافهو مقزع والقنزعة واحدة القنازع وهى الشعر حو الى الرأس قال حيد بن الارقط
  يصف
