text: |-
  ٦١٥
  يصف الصلع كأنّ طابين قنزعاته وفى الحديث غطى عناقنا زعك يا أم أيمن ⁦(قشع)⁩
  الاصمى الفسع الجلود اليابسة الواحدة قشع ع لى غير قياس لانّ قياسه قشعة وقشع مثل بدرة
  وبدر الا أنه هكذا يقال وفى حديث سلمة بن الاكوع فى غزاة بنى فزارة قال أغرنا عليهم فاذا
  امرأة عليها قشع لها فأخذتها فقد- ت بها المدينة ومنه حديث أبى هريرة لوحدئسكم
  بكل ما أء-لم رميتمونى بالقشع والقشع بيت من جلد فان كان من أدم فهو الطراف قال متمم
  ابن نويرة يرتى أخاه مالكا
  ولا برماتهدى النساطعرسه • اذا القشع من برد الشتاء تقعقعا
  وقشعت الريح السحاب أى كشفته فانقشع وتقشع وأقشع أيضا وقشعته أنا مشل كبيته
  فأكب والقشعة بالكسر القطعة من السحاب تبقى بعد انقشاع الغيم وقشعت القوم
  فأقشعوا وتشعوا أى فرقتهم فتفرقوا وأقشع القوم عن الماء أقلعواعنه صع .
  القصمة معروفة والجمع قصع وقصاع والقصع استلاع جرع الماء اوالجرّة وقد قصعت الناقة
  بجرّتها أى ردّتها الى جوفها وقال بعضهم أى أخرجتها فلات فاها وفى الحديث أنه عاه
  انسلام خطيهم على راحلته وانها لتقصع بجرتها قال آبو عسد قصع الجزة شدّة المضغ وضم
  بعض الاسنان على بعض جعله من قصع القملة وهو أن يهشمها ويقتلها ويقال قصع الماه
  عطشه أى أذهبه وسكنه قال ذوالرمة
  فانصاعت الحقب لم تقصع صرائرها • وقد نشحن فلارىْ ولاهيم
  وقصعت الرجل قصعا صغرنه وحقرته وقصعت هامته اذاضر بتها ببسط كفل وقصع اللّٰه
  شبايه وغلام مقصوع اذابقى شيئا لا يشب ولا يزداد وقد قصع قصاعة فهوقصبع والقاصعاء
  حر من جهرة اليرابسع الذى تقصع فيه أى تدخل والجمع قواصع شبهوا فا علاء بفاعلة وجعلوا
  ألفى التأنيت بعنزة الهاء والقصعة مثال الهمزة مثل القاصعاء ١) ( ضع قضاعة
  أبوحى من اليمن وه وقضاعة بن مالك بن حيرين سبأ وتزعم نساب مضرانه قضاعة بن معدّ
  ابن عدنان والقضاعة كلبة الماء ولم يعرفه أبو الغوث،⁦(قطع)⁩. قطعت الشئء قطعا وقطعيت
  النهرقط وعاعبرته وقطع ماعالركية قطوعا وقطاعا أى انقطع وذهب وقطعت الطسير قطوعا
  وقطا عاخرجت من بلاد البرد الى بلاد الحر فهى قواطع ذواهب أورواجع. وقطع رحه
  قطيعة فهورجل قطع وقطعة مثال همزة ويقال رحم قطعا؟ بيني وبينك اذالم يوصل وقوله
  تعالى ثم ليقطع قالو اليختنق لان المختنق عمد السبب الى السقف ثم يقع نفسه من الارض
  -تى يختنق يقال منه قطع الرجل وقطعت الشئء فا نقطع وفلان منقطع القرين فى سنخاء أوغيره
  ومنقطع الرمل حيث ينقطع ولارمل خلفه ومقاطيع الاودية ما خيرها ومقاطع الانمار
  حيث تعبرفيه والاقطوعة علامة تبعنها المرأة الى أخرى للصريمة والهجران ولين قاطع
  أى حامض والاقطع المقطوع اليدوا لجسع قطعان مثل أسود وسودان والقطعة بالتحريك
  موضع القطع بقال ضر به بقطعته وكذلك القطعة بالضم مثل الصلعة بالضم والصلعة
  إلقطعة أيضاقطعة من الارض اذا كانت مفروزة و-كى عن اعرابى أنه قال ورثت من أبى
  طعة ويق ال أيضا أصاب الناس قطع وقطعة اذا انقطع ماء بئرهم فى القيظ وأصابه قطع أى
  ١ ال الفِرزدق بهجوجرير!
  واذا أخذت بقاصعائن لم تجد
  أحدايعينك غير من يتقمع اه
