label: { ar: "الموطأ 1600 — علي بن أبي طالب: إذا آلى الرجل من امرأته لم يقع عليه طلاق وإن مضت الأربعة الأشهر، حتى يوقف، فإما أن يطلق وإما أن يفيء", en: "Muwatta 1600", es: "1600 copias", fr: "1600 exemplaires", ur: "1600 کاپیاں", tr: "El-Muvatta 1600 — Ali ibn Abi Talib: Bir erkek karısından cinsel perhiz yemini ederse, dört ay geçse bile, kendisine bir seçenek sunulmadıkça (ya boşanmak ya da evliliğe devam etmek) boşanma geçerli olmaz.", id: "Al-Muwatta 1600 — Ali ibn Abi Talib: Jika seorang pria bersumpah untuk berpantang dari istrinya, perceraian tidak akan berlaku meskipun empat bulan telah berlalu, sampai ia diberi pilihan: menceraikannya atau melanjutkan hubungan perkawinan." }
summary:
  ar: "يروي يحيى عن مالك عن جعفر بن محمد عن أبيه عن علي بن أبي طالب أنه كان يقول إذا آلى الرجل من امرأته، لم يقع عليه طلاق، وإن مضت الأربعة الأشهر، حتى يوقف، فإما أن يطلق، وإما أن يفيء. قال مالك وذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.65}"
  tr: "Yahya, Malik'ten, o da Cafer ibn Muhammed'den, o da babasından, o da Ali ibn Abi Talib'den rivayetle şöyle der: Bir erkek karısından cinsel perhiz yemini ederse, dört ay geçse bile, kendisine ya boşanma ya da evliliğe devam etme seçeneği sunulmadıkça boşanma geçerli olmaz. Malik şöyle dedi: Bu bizim aramızdaki uygulamadır. {cite:muwatta-maruf-1997 s.65}"
  id: "Yahya meriwayatkan dari Malik, dari Ja'far bin Muhammad, dari ayahnya, dari Ali bin Abi Talib, bahwa ia biasa berkata: Jika seorang pria bersumpah untuk berjauhan dari istrinya, maka perceraian tidak akan berlaku, meskipun telah berlalu empat bulan, sampai ia diberi pilihan: menceraikannya atau melanjutkan hubungan suami istri. Malik berkata: Itulah kebiasaan di antara kami. {cite:muwatta-maruf-1997 p.65}"
