text: "… -، وابن عساكر في تاريخ دمشق عن عبد اللّٰه بن نمير، عن عُبيد اللّٰه بن عمر العمري، عن ثابتٍ، عن أَنسٍ، قال: تَقَرْقَرَ بطنُ عمرَ، قال: وكان يأكلُ الزَّبتَ عامَ الرَّمادة، وكان قد حرَّمَ عليها السَّمْنَ، قال: فنقرَ بطنَه بإِصبُعه، …"
