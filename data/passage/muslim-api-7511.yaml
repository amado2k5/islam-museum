label: { ar: "صحيح مسلم 7511 — الجذام والبرص، البرء من العلة", en: "Sahih Muslim 7511 — leprosy and vitiligo; recovery from an ailment", ur: "صحیح مسلم 7511 — جذام اور برص، بیماری سے شفایابی" }
text: "… مِنِّي. قَدْ بَلَغَ مِنْ أَمْرِكَ مَا أَرَى وَإِنَّكَ سَتُبْتَلَى فَإِنِ ابْتُلِيتَ فَلاَ تَدُلَّ عَلَىَّ. وَكَانَ الْغُلاَمُ يُبْرِئُ الأَكْمَهَ وَالأَبْرَصَ وَيُدَاوِي النَّاسَ مِنْ سَائِرِ الأَدْوَاءِ فَسَمِعَ جَلِيسٌ لِلْمَلِكِ كَانَ قَدْ عَمِيَ فَأَتَاهُ بِهَدَايَا كَثِيرَةٍ فَقَالَ مَا هَا هُنَا لَكَ أَجْمَعُ إِنْ أَنْتَ شَفَيْتَنِي فَقَالَ إِنِّي لاَ أَشْفِي أَحَدًا إِنَّمَا يَشْفِي اللَّهُ فَإِنْ أَنْتَ آمَنْتَ بِاللَّهِ دَعَوْتُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 7511، يذكر الجذام والبرص، والبرء من العلة، والداء، والتداوي، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 7511 (The Book of Zuhd and Softening of Hearts), that mentions leprosy and vitiligo, recovery from an ailment, the disease and its remedy, seeking treatment, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 7511، جس میں جذام اور برص، بیماری سے شفایابی، بیماری، علاج کرانا، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
