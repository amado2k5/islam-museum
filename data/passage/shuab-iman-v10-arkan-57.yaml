text: "الجامع لشعب الإيمان قال الإمام أحمد: وهذا لا يخالف ما رويناه في حديث شعب الإيمان أعلاها شهادة أن لا إله إلا الله، وأدناها إماطة الأذى عن الطريق لأن الأدنى غير الأضعف، فإن الأدنى اسم لما يتباعد عن معاني القُرب، وإن …"
