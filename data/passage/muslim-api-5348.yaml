label: { ar: "صحيح مسلم 5348 — الكمأة، الشفاء", en: "Sahih Muslim 5348 — truffles and their water for the eye; healing", ur: "صحیح مسلم 5348 — کھمبی، شفا" }
text: "وَحَدَّثَنَا يَحْيَى بْنُ حَبِيبٍ الْحَارِثِيُّ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ شَبِيبٍ، قَالَ سَمِعْتُهُ مِنْ، شَهْرِ بْنِ حَوْشَبٍ فَسَأَلْتُهُ فَقَالَ سَمِعْتُهُ مِنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، قَالَ فَلَقِيتُ عَبْدَ الْمَلِكِ فَحَدَّثَنِي عَنْ عَمْرِو بْنِ حُرَيْثٍ، عَنْ سَعِيدِ بْنِ زَيْدٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" الْكَمْأَةُ مِنَ الْمَنِّ وَمَاؤُهَا شِفَاءٌ لِلْعَيْنِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5348، يذكر الكمأة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5348 (The Book of Drinks), that mentions truffles and their water for the eye, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5348، جس میں کھمبی، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
