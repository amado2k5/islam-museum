label: { ar: "الموطأ 89 — بلاغ: ابن عباس يغسل دم الرعاف ثم يبني على صلاته", en: "Muwatta 89", es: "Muwatta 89", fr: "Muwatta 89", ur: "موطا 89", tr: "El-Muvatta 89 — Rivayet: İbn Abbas burun kanamasından kanı temizledikten sonra namazına devam etti.", id: "Al-Muwatta 89 — Riwayat: Ibnu Abbas membersihkan darah dari mimisan dan kemudian melanjutkan salatnya." }
summary:
  ar: "بلاغ في باب ما جاء في الرعاف: يروي مالك أنه بلغه أن عبد الله بن عباس كان إذا رعف خرج فغسل الدم ثم رجع فبنى على ما قد صلى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.80}"
  tr: "Burun kanamalarıyla ilgili bir rivayet: Malik, Abdullah ibn Abbas'ın burnu kanadığında dışarı çıkıp kanı yıkadığını, sonra geri dönüp namazına devam ettiğini duyduğunu aktarır. Editör, bu rivayetin Malik'ten Ebu Musab ve Suveyd tarafından nakledildiğini belirtir. {cite:muwatta-maruf-1997 s.80}"
  id: "Sebuah laporan mengenai mimisan: Malik meriwayatkan bahwa ia mendengar bahwa ketika Abdullah ibn Abbas mimisan, ia akan keluar, membasuh darahnya, kemudian kembali dan melanjutkan salatnya. Editor menyebutkan bahwa Abu Musab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.80}"
