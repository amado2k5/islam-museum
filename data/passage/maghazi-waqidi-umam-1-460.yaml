text: "… الكَرْب. فسمعه مُعَتِّب فقال ما قال. فجدّثنى ابن أَبى سَبْرَة، عن الحارث بن الفُضَيل قال : همّت بذو قُرَيْظَةَ أَن يُغيروا على بَيْضَة المدينة ليلاً، فأَرسلوا حُيَىّ بن أَخْطَب إلى قُرَيشِ أَن يأْتيهم منهم أَلفُ رجلٍ، ومن غَطَفان أَلف، فيُغيروا …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 460، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 460, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 460 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento del Maghazi de al-Waqidi, volumen 1, pág. 460, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
