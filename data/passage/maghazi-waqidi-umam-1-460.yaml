  tr: "El-Vakidi'nin Resimli Maghazi adlı eserinin 1. cildinin 460. sayfasından, Müslüman olmayan milletleri, dinleri ve halkları anlatan bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş, makine tarafından okunabilir taranmış versiyondan alınmıştır. Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar Tarayıcısı tarafından derlenmiştir."
