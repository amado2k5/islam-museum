label: { ar: "سنن أبي داود 2258 — الأب والأبوة", en: "Sunan Abi Dawud 2258 — the father and fatherhood", ur: "سنن ابی داؤد 2258 — باپ اور والدیت" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَنْبَلٍ، حَدَّثَنَا إِسْمَاعِيلُ، حَدَّثَنَا أَيُّوبُ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ قُلْتُ لاِبْنِ عُمَرَ رَجُلٌ قَذَفَ امْرَأَتَهُ. قَالَ فَرَّقَ رَسُولُ اللَّهِ بَيْنَ أَخَوَىْ بَنِي الْعَجْلاَنِ وَقَالَ \" اللَّهُ يَعْلَمُ أَنَّ أَحَدَكُمَا كَاذِبٌ. فَهَلْ مِنْكُمَا تَائِبٌ \". يُرَدِّدُهَا ثَلاَثَ مَرَّاتٍ فَأَبَيَا فَفَرَّقَ بَيْنَهُمَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 2258، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2258 (Divorce (Kitab Al-Talaq)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2258، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
