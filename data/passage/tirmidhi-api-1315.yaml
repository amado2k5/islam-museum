text: "… \" أَفَلاَ جَعَلْتَهُ فَوْقَ الطَّعَامِ حَتَّى يَرَاهُ النَّاسُ \". ثُمَّ قَالَ \" مَنْ غَشَّ فَلَيْسَ مِنَّا \". قَالَ وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَأَبِي الْحَمْرَاءِ وَابْنِ عَبَّاسٍ وَبُرَيْدَةَ وَأَبِي بُرْدَةَ بْنِ نِيَارٍ وَحُذَيْفَةَ بْنِ الْيَمَانِ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ كَرِهُوا الْغِشَّ وَقَالُوا الْغِشُّ حَرَامٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1315، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1315 (The Book on Business), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1315، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
