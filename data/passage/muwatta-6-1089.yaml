label: { ar: "الموطأ 1089 — جعفر بن محمد عن أبيه عن جابر: سمعت رسول الله حين خرج من المسجد وهو يريد الصفا يقول: نبدأ بما بدأ الله به، فبدأ بالصفا", en: "Muwatta 1089" }
text: "نبدأ بما بدأ الله به، فبدأ بالصفا"
summary:
  ar: "أول حديث في باب البدء بالصفا في السعي. يرويه مالك عن جعفر بن محمد بن علي عن أبيه عن جابر بن عبد الله، أنه قال: سمعت رسول الله حين خرج من المسجد وهو يريد الصفا يقول: نبدأ بما بدأ الله به، فبدأ بالصفا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1311)، وأنه من طرق مسلم وغيره عن جابر في حديث الحج الطويل. {cite:muwatta-maruf-1997 p.499}"
