label: { ar: "الموطأ 1089 — جعفر بن محمد عن أبيه عن جابر: سمعت رسول الله حين خرج من المسجد وهو يريد الصفا يقول: نبدأ بما بدأ الله به، فبدأ بالصفا", en: "Muwatta 1089", es: "Muwatta 1089", fr: "Muwatta 1089", ur: "موطا 1089", tr: "El-Muvatta 1089 — Cafer ibn Muhammed, babasından, o da Cabir'den rivayetle: Allah Resulü'nün mescitten çıkıp Safa'ya doğru giderken şöyle dediğini işittim: \"Allah'ın başladığı yerden biz de başlıyoruz.\" Ve Safa'dan başladı.", id: "Al-Muwatta 1089 — Ja'far bin Muhammad, dari ayahnya, dari Jabir: Aku mendengar Rasulullah SAW, ketika beliau keluar dari masjid dan sedang menuju Safa, bersabda: “Kita mulai dengan apa yang telah Allah mulai,” dan beliau mulai dengan Safa." }
text: "نبدأ بما بدأ الله به، فبدأ بالصفا"
summary:
  ar: "أول حديث في باب البدء بالصفا في السعي. يرويه مالك عن جعفر بن محمد بن علي عن أبيه عن جابر بن عبد الله، أنه قال: سمعت رسول الله حين خرج من المسجد وهو يريد الصفا يقول: نبدأ بما بدأ الله به، فبدأ بالصفا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1311)، وأنه من طرق مسلم وغيره عن جابر في حديث الحج الطويل. {cite:muwatta-maruf-1997 p.499}"
  id: "Hadits pertama dalam bab tentang memulai Sa'i (ritual berjalan antara Safa dan Marwa) diriwayatkan oleh Malik dari Ja'far ibn Muhammad ibn Ali, dari ayahnya, dari Jabir ibn Abdullah, yang berkata: \"Aku mendengar Rasulullah shalla Allahu alaihi wa sallam ketika beliau keluar dari masjid, menuju Safa, beliau bersabda: 'Kita mulai dengan apa yang telah Allah mulai,' dan beliau mulai dengan Safa.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1311), dan bahwa hadits ini ditemukan dalam sanad Muslim dan lainnya dari Jabir dalam hadits panjang tentang Haji. {cite:muwatta-maruf-1997 p.499}"
