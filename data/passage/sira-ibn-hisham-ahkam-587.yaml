text: "… وَإنْعَامُ رَسُول اللّٰه لِفُ فيهَا السيرة لابن هشام ما كان لنا فهو لرسولِ اللّٰه لِلفِيِ قَالَ: يَقُولُ عَبَّاس بن مِرْدَاس لبني سُلَيم: وهَنْتُمُوني، فَقَالَ رسولُ اللّٰه وَالفرْ أمَّا مَنْ تَمَسَكَ مِنْكُمْ بِحَقِّهِ مِنْ هذَا السَّبْي، فَلَهُ بِكُلُّ إِنْسَانٍ سِتُّ فَرَائِضَ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 587، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hisham's Sira, p. 587, whose wording mentions the obligation (farida); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سیرت ابن ہشام، ص 587 کا اقتباس جس میں فریضہ اور فرائض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sira de Ibn Hisham, p. 587, dont le texte mentionne l'obligation (farida) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sira de Ibn Hisham, p. 587, cuyo texto menciona la obligación (farida); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hişam'ın Peygamber biyografisinden bir alıntı, 587. sayfada, farz olan amelleri ve görevleri sıralamaktadır; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari biografi Nabi karya Ibnu Hisham, halaman 587, menyebutkan amalan dan kewajiban yang wajib dilakukan; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
