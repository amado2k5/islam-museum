label: { ar: "الموطأ 928 — ابن عمر عن النبي: أمر أهل المدينة أن يهلوا من ذي الحليفة، وأهل الشام من الجحفة، وأهل نجد من قرن، وأهل اليمن من يلملم", en: "Muwatta 928" }
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أنه قال: أمر رسول الله أهل المدينة أن يهلوا من ذي الحليفة، وأهل الشام من الجحفة، وأهل نجد من قرن. قال ابن عمر: أما هؤلاء الثلاث فسمعتهن من رسول الله، وأُخبرت أن رسول الله قال: ويهل أهل اليمن من يلملم. ويذكر المحقق أن جماعة رواة الموطأ رووه هكذا، وأن أصحاب نافع رووه كلهم عن ابن عمر. {cite:muwatta-maruf-1997 p.445}"
