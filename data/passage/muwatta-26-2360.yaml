label: { ar: "الموطأ 2360 — مالك: مدبر كاتبه سيده ثم مات السيد ولا مال غيره", en: "Muwatta 2360", es: "Muwatta 2360", fr: "Muwatta 2360", ur: "موطا 2360", tr: "El-Muvatta 2360 — Malik: Efendisi kâtibi olan bir köleydi, sonra efendisi öldü ve ondan başka parası kalmadı.", id: "Al-Muwatta 2360 — Malik: Seorang budak yang juru tulisnya adalah tuannya, kemudian tuannya meninggal dan tidak ada harta lain selain miliknya." }
summary:
  ar: "قال مالك في مدبر كاتبه سيده فمات السيد ولم يترك مالا غيره: يُعتق منه ثلثه، ويوضع عنه ثلث كتابته، ويكون عليه ثلثاها. {cite:muwatta-maruf-1997 p.373}"
  tr: "Malik, efendisinin bir kâtibi olan ve kâtibi öldükten sonra başka mal varlığı bırakmayan bir köle hakkında şunları söylemiştir: Kölenin üçte biri azat edilecek, kâtibinin maaşının üçte birinden feragat edilecek ve köle maaşının üçte ikisinden sorumlu kalacaktır. {cite:muwatta-maruf-1997 s.373}"
  id: "Malik berkata mengenai seorang budak yang tuannya memiliki seorang juru tulis yang kemudian meninggal tanpa meninggalkan harta lain: sepertiga dari hartanya harus dibebaskan, sepertiga dari gaji juru tulisnya harus dihapuskan, dan ia tetap bertanggung jawab atas dua pertiga sisanya. {cite:muwatta-maruf-1997 p.373}"
