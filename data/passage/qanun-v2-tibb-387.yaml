text: "… لم يكن مخوّفاً، وذلك مثل الغشي الذي يعرض بعد الفصد. وأما الوجع، فيحدث الغشي لفرط تحليله الروح كما يعرض في إيلاوس، والقولنج، وفي اللذع المفرط العارض في الأعضاء ونحوها، وفي مثل وجع والمعي، الحساسة من فم المعدة جراحات العصب وقروحها، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 387، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، ومداواة الجراح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 387, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 387 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، زخموں کا علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 387, que menciona el dolor, enfermedades específicas, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el tratamiento de las heridas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 387, qui mentionne la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles, le traitement des plaies; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, s. 387'sinden bir bölüm; ağrı, hastalıkların isimleri, vücut organları, cerrahi, sünnet, atel ve yara tedavisi konularını ele almaktadır; metin, makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 387, yang menyebutkan rasa sakit, nama-nama penyakit, organ tubuh, pembedahan, sunat, bidai, dan pengobatan luka; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
