  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 387, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
