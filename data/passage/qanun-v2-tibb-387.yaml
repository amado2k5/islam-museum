text: "… لم يكن مخوّفاً، وذلك مثل الغشي الذي يعرض بعد الفصد. وأما الوجع، فيحدث الغشي لفرط تحليله الروح كما يعرض في إيلاوس، والقولنج، وفي اللذع المفرط العارض في الأعضاء ونحوها، وفي مثل وجع والمعي، الحساسة من فم المعدة جراحات العصب وقروحها، …"
summary:
