text: |-
  عمر والغنوى اه
  ٤٦
  * ⁦(كاب الفاء)⁩.
  الاسين من الرجال وأعطاه عدفة من مال أى قطعة منه ومرّعدف من الليل أى قطعة منه
  والعدفة كالصنفة من الثوب ذف) العذف الاكل وقد عذف بالذال المعمة هذه
  اغة ربيعة يقال ماذقت عذفا ولاعذرفا أى شيأوباتت الدابة على غسير عذوف ⁦(عرف)⁩
  عرقته معرفة وعرفانا وقولهم ما أعرف لاحديصرعنى أى ما أعسترف وعرفت الفرس أى
  جززت عرفه والعرف الريح طيبة كانت أومنقنة يقال ما أطيب عرفه وفى المثل لا يعجز مسسك
  السومعن عرف السوء والعرفة قرحة تخرج فى بياض الكف عن ابن السكيت يقال عرف
  الرجل فهو معروف أى خرجت به تلك القرحة والمعروف ضدّ المنكر والعرف ضد النكر
  يقال أولامعرفا أى معروفا والعرف أيضا الاسم من الاعتراف ومنه قولهم له علىّ ألف
  عرفا أى اعترافا وهوتوكيد والعرف عرف الفرس وقوله تعالى والمرسلات عرفايقال
  هو مسستعار من عرف الفرس أى يتتابعون كعرف الفرس ويقال أرسلت بالعرف أى
  بالمعروف والمعرفسة بنتح الراء الموضع الذى ينبت عليه العرف والعرف والعرف الرمل
  المرتفع قان التكميت
  أأبكالك بالعرف المنزل * وما أنت والطلل المحول
  وهو مثل عسر وعسر وكذلك العرفة وابهع عرف وأعراف ويقال الاعراف الذى فى
  الة وآن سور بين الجنسة والشار وشى أعرف أى له عرف وأعرف الفرس أى طال عسرفه
  واعرورف أى صارذاعرف واء رورف الرجل أى تهيأ للمشر واء رورف البجرأى ارتفعت
  أمواجه ويقال للضبع عرفاء سميت بذلك لكثرة شعرها والعرف بالكسر من قولهم
  ماعرف عرفى الاباخرة أى ماعرفنى الا أخسيرا وتقول هذايوم عرفة غير منون ولا تدخله
  الالف واللام وعرفات موضع بنى وهواسم فى لفظ الجمع فلا يجمع قال الفرّاء ولا واحدله
  صحة وقول الناس نزلنا ء رفة شبيه بمولد وليس بعربى محض وهى معرفة وان كان ججعا
  لانَ الاماجكن لا تزول فصار تالشى الواحد وخالف الزيدين تقول هؤلا عرفات حسنة
  تنصب التعت لانه نكرة وهى مصروفة قال تعالى فاذا أفضتم من عرفات قال الاخفش
  وانماصرفت لان التاءصارت بنزلة الياء والواوفى مسلمين ومسلون لانه تذكيره وصار
  التنوين ينزلة النون فلماسى به تزككلى ساله كما يقال مسلمون اذا محى به على حاله وكسذلك
  القول فى أذرعات وعانات وعريتفات والعارف الصبور يقال أصيب فلان فوجد عارفا
  والعروف مثله قال عنترة
  قصبرت عارفة لذلك -رة • ترسواذا نفس الجبان تطلع
  يقول حبست نفساعاوفة أى صابرة والعارفة أيضا المعروف ورجل عروفة بالامورأى
  عارف يم اوالهاء للمبالغة والعريف والعارف بعنى مثل عليم وعالم وأنشد الاخفش ١
  أوكامادودت عكاظ قبيلة • بعثوا الى عريفهم يتوسم
  أى عارفهم والعريف النقسب وهودون الرئيس والمع عرفاء تقول منسه عرف فلان بالضم
  عرافة.:سل خطب خطابة أى صارعر بفا واذا أردت أنه عمل ذلك قلت عرف فلان علينا
  سنين يعرف عرافة مثال كتب يكتب كتابة والتعريف الاعلام والتعريف أيضا انشاد
  الضالة
