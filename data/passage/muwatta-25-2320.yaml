label: { ar: "الموطأ 2320 — مالك: الأبناء الصغار لا ينتظر بهم أن يكبروا", en: "Muwatta 2320", es: "Muwatta 2320", fr: "Muwatta 2320", ur: "موطا 2320", tr: "Al-Muwatta 2320 — Malik: Küçük çocukların büyümeleri beklenmez.", id: "Al-Muwatta 2320 — Malik: Anak-anak kecil tidak diharapkan untuk tumbuh dewasa" }
summary:
  ar: "قال مالك: وإن كانوا صغارا لا يطيقون السعي، لم يُنتظر بهم أن يكبروا، وكانوا رقيقا لسيد أبيهم، إلا أن يكون المكاتب ترك ما يؤدى به عنهم نجومهم حتى يتكلفوا السعي؛ فإن أدوا عتقوا، وإن عجزوا رقوا. {cite:muwatta-maruf-1997 p.357}"
  tr: "Malik şöyle dedi: Eğer gençler ve çalışamayacak durumdaysalar, büyümeleri beklenmemeli ve babalarının efendisinin kölesi olarak kalmalılar; ancak sözleşmeyi yapan kişi, çalışmayı taahhüt edene kadar taksitlerini ödemek için gerekli olanı geride bırakmışsa durum değişir; eğer ödeme yaparlarsa özgür bırakılırlar, eğer ödeme yapamazlarsa köle olarak kalırlar. {cite:muwatta-maruf-1997 s.357}"
  id: "Malik berkata: Jika mereka masih muda dan tidak mampu bekerja, mereka tidak perlu ditunggu sampai dewasa, dan mereka tetap menjadi budak majikan ayah mereka, kecuali jika orang yang membuat perjanjian meninggalkan sejumlah uang yang dibutuhkan untuk membayar cicilan mereka sampai mereka mulai bekerja; jika mereka membayar, mereka dibebaskan, dan jika mereka tidak mampu, mereka tetap menjadi budak. {cite:muwatta-maruf-1997 p.357}"
