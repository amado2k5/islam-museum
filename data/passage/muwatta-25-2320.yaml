summary:
  ar: "قال مالك: وإن كانوا صغارا لا يطيقون السعي، لم يُنتظر بهم أن يكبروا، وكانوا رقيقا لسيد أبيهم، إلا أن يكون المكاتب ترك ما يؤدى به عنهم نجومهم حتى يتكلفوا السعي؛ فإن أدوا عتقوا، وإن عجزوا رقوا. {cite:muwatta-maruf-1997 p.357}"
