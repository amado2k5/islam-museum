text: "… آبارٌ مقلوبة ذهب يوماً مع أحد رفاقه إلى قونيةً، لتحصيل العلم، فرأى رفيقُهُ منارة قُونية. المرتفعة، وكان لم يرَ ذلك قبلاً فقال للشيخ : كيف يبنون هذه يا ترى؟ فأجابه الشيخ : هذه آبار مقلوبةً. مال الفقير يجب أن يكون …"
summary:
  ar: "كان جحا ذاهباً إلى قونية للدراسة فرأى رفيقه المئذنة العالية وسأله كيف بُنيت، فقال جحا إنها آبار مقلوبة. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  en: "Going to Konya to study, Juha is asked by a companion, who sees the tall minaret, how it was built, and Juha says they are upturned wells. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  ur: "جحا پڑھنے کے لیے قونیہ جا رہا ہوتا ہے کہ اس کا ساتھی اونچا مینار دیکھ کر پوچھتا ہے کہ یہ کیسے بنایا گیا، تو جحا کہتا ہے کہ یہ الٹے کنویں ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  fr: "Alors qu'il se rend à Konya pour étudier, Juha est interrogé par un compagnon, qui voit le haut minaret, sur la façon dont il a été construit, et Juha répond que ce sont des puits retournés. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  es: "Yendo a Konya a estudiar, Juha es interrogado por un compañero, que ve el alto minarete, sobre cómo fue construido, y Juha dice que son pozos al revés. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  tr: "Cühe, Konya'ya okumaya giderken arkadaşı yüksek minareyi gördü ve nasıl yapıldığını sordu. Cühe, minarenin ters çevrilmiş kuyulardan yapıldığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 102}"
  id: "Juha sedang pergi ke Konya untuk belajar ketika temannya melihat menara yang tinggi dan bertanya kepadanya bagaimana cara membangunnya. Juha menjawab bahwa menara itu terbuat dari sumur-sumur yang dibalik. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
