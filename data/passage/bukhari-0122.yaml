label:
  ar: "البخاري 122 — موسى والعبد الصالح بمجمع البحرين"
  en: "Bukhari 122 — Musa and the righteous servant at the meeting of the two seas"
  ur: "بخاری 122 — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
  es: "Bujari 122 — Moisés y el siervo justo en el encuentro de los dos mares"
  fr: "Bukhari 122 — Moïse et le serviteur vertueux au confluent des deux mers"
  tr: "Buhari 122 — Musa ve salih kul, iki denizin birleştiği yerde"
  id: "Al-Bukhari 122 — Musa dan hamba yang saleh di pertemuan dua laut"
text: "قام موسى النبي خطيبا في بني إسرائيل، فسئل أى الناس أعلم فقال أنا أعلم. فعتب الله عليه، إذ لم يرد العلم إليه، فأوحى الله إليه أن عبدا من عبادي بمجمع البحرين هو أعلم منك. قال يا رب وكيف به فقيل …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 122: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 122: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 122: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 122: Moisés y el siervo justo en el encuentro de los dos mares. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 122: Moïse et le pieux au confluent des deux mers. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 122 numaralı hadis-i kudsi şöyledir: Musa ve salih kul, iki denizin birleştiği yerde. Peygamberimiz bunu Rabbinden rivayet eder ve hadis-i kudsi, bu rivayetleri altı şeriat hadis külliyatında ve el-Muvatta'da derler."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 122: Musa dan hamba yang saleh di pertemuan dua laut. Nabi meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
