text: "… والبصير. ثم دخلا الشام، فأقاما بدمشق قليلاً، وتحولا إلى حلب. ثم تزوج ابن جابر، فافترقا. ومات الرعيني فرثاه ابن جابر ومات بعده بنحو سنة، في البيرة. من كتب ابن جابر شرح ألفية ابن مالك و شرح ألفية ابن معطي، و …"
