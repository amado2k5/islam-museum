text: "… وروى عن ابن عباس ان رسول اللّٰه عني لو قال وان أول مايجازى به العبد بعد موته ان يغفر لجميع من اتبع جنازته رواء البزار الترغيب في كثرة المصلين على الجنازة وفي التعزية.. - عن عائشةا قالت قال رسول الله …"
summary:
  ar: "مقطع من الترغيب والترهيب من الحديث الشريف، المجلد المصوَّر 2، ص 484، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), scan volume 2, p. 484, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الترغیب والترہیب من الحدیث الشریف، اسکین جلد 2، ص 484 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), volume numérisé 2, p. 484, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), volumen escaneado 2, p. 484, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Hadislerden Teşvik ve Uyarı\" adlı kitabın 2. cildinin 484. sayfasından, musibet zamanlarında taziye, teselli ve sabır içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü mersiye ve ağıtların bir derlemesinden derlenmiştir."
  id: "Cuplikan dari buku \"Dorongan dan Peringatan dari Hadits Mulia,\" Jilid 2, halaman 484, berisi ucapan belasungkawa, penghiburan, dan kesabaran di masa musibah; diambil dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan ratapan paling terkenal."
