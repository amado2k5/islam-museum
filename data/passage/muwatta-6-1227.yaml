label: { ar: "الموطأ 1227 — عائشة: أهللنا بعمرة في حجة الوداع، فقال من كان معه هدي أن يهل بالحج مع العمرة، فلما حاضت أمرها أن تدع العمرة وتهل بالحج", en: "Muwatta 1227", es: "Muwatta 1227", fr: "Muwatta 1227", ur: "موطا 1227", tr: "Al-Muwatta 1227 — Aişe: Veda Hacında Umre için ihram haline girdik. Yanında kurbanlık hayvanı olan herkes, Umre ile birlikte Hac için de ihram haline girmesi gerektiğini söyledi. Aişe adet olunca, ona Umre'yi bırakıp Hac için ihram haline girmesini emretti.", id: "Al-Muwatta 1227 — Aisyah: Kami memasuki keadaan ihram untuk Umrah selama Haji Perpisahan. Seseorang yang membawa hewan kurban berkata bahwa ia harus memasuki keadaan ihram untuk Haji bersamaan dengan Umrah. Ketika ia mengalami haid, orang itu menyuruhnya untuk meninggalkan Umrah dan memasuki keadaan ihram untuk Haji." }
text: "من كانَ معَهُ هَذْيٌ فَلْيُهْلِلْ بِالحَجِّ مع العُمْرَةِ، ثم لا يَحِلُّ حتَّى يَحِلَّ مِنْهُما جَميعًا"
summary:
  ar: "تروي عمرة بنت عبد الرحمن عن عائشة أنها قالت خرجنا مع رسول الله عام حجة الوداع، فأهللنا بعمرة، فقال من كان معه هدي فليهل بالحج مع العمرة، ثم لا يحل حتى يحل منهما جميعا. ثم قدمت مكة وهي حائض، فلم تطف بالبيت ولا بين الصفا والمروة، فأمرها النبي أن تنقض رأسها وتمتشط وتهل بالحج وتدع العمرة. فلما قضوا الحج أرسلها مع عبد الرحمن بن أبي بكر إلى التنعيم فاعتمرت، فقال هذه مكان عمرتك. ويذكر المحقق أن ابن عبد البر رأى إسناد عبد الرحمن بن القاسم عند يحيى خطأ لانفراده به. {cite:muwatta-maruf-1997 p.547}"
  tr: "Umre bint Abdülrahman, Aişe'den rivayetle şöyle buyurmuştur: \"Veda Hacında Allah Resulü ile birlikte çıktık ve Umre için ihram giydik. Peygamberimiz şöyle buyurdu: 'Yanında kurbanlık hayvanı olan kimse, Umre ile birlikte Hac için de ihram giysin ve her ikisi için de ihramdan çıkıncaya kadar ihramdan çıkmasın.'\" Sonra Mekke'ye adetliyken vardı, bu yüzden Kâbe'nin etrafında tavaf yapmadı ve Safa ile Merve arasında sa'y yapmadı. Bunun üzerine Peygamber ona saçlarını açmasını, taramasını, Hac için ihram haline girmesini ve Umre'yi atlamasını emretti. Hac'ı tamamladıktan sonra onu Abdurrahman ibn Ebu Bekir ile Tanim'e gönderdi ve Umre yaptı. Peygamber, \"Bu, Umre'nin yerine geçer\" dedi. Araştırmacı, İbn Abdülbarr'ın, tek ravî olduğu için Abdurrahman ibn Kasım'ın Yahya ile olan rivayet zincirini hatalı kabul ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.547}"
  id: "'Umrah binti 'Abd al-Rahman meriwayatkan dari 'Aisyah bahwa dia berkata: \"Kami pergi bersama Rasulullah SAW pada Haji Perpisahan, dan kami memasuki keadaan ihram untuk Umrah. Beliau bersabda, 'Barangsiapa membawa hewan kurban, hendaklah ia memasuki keadaan ihram untuk Haji bersamaan dengan Umrah, dan ia tidak boleh keluar dari keadaan ihram sampai ia selesai keluar dari keadaan ihram untuk kedua ibadah tersebut.'\" Kemudian ia tiba di Mekah saat sedang haid, sehingga ia tidak melakukan tawaf mengelilingi Ka'bah maupun sa'i antara Safa dan Marwa. Maka Nabi memerintahkannya untuk melepaskan ikatan rambutnya, menyisirnya, memasuki keadaan ihram untuk haji, dan meninggalkan umrah. Setelah mereka menyelesaikan haji, beliau mengutusnya bersama 'Abd al-Rahman ibn Abi Bakr ke al-Tan'im, dan ia melakukan umrah. Beliau bersabda, 'Ini sebagai pengganti umrahmu.'\" Peneliti menyebutkan bahwa Ibn 'Abd al-Barr menganggap sanad 'Abd al-Rahman ibn al-Qasim dengan Yahya keliru karena ia adalah satu-satunya perawi. {cite:muwatta-maruf-1997 p.547}"
