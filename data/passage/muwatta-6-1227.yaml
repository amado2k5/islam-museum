label: { ar: "الموطأ 1227 — عائشة: أهللنا بعمرة في حجة الوداع، فقال من كان معه هدي أن يهل بالحج مع العمرة، فلما حاضت أمرها أن تدع العمرة وتهل بالحج", en: "Muwatta 1227" }
text: "من كانَ معَهُ هَذْيٌ فَلْيُهْلِلْ بِالحَجِّ مع العُمْرَةِ، ثم لا يَحِلُّ حتَّى يَحِلَّ مِنْهُما جَميعًا"
summary:
  ar: "تروي عمرة بنت عبد الرحمن عن عائشة أنها قالت خرجنا مع رسول الله عام حجة الوداع، فأهللنا بعمرة، فقال من كان معه هدي فليهل بالحج مع العمرة، ثم لا يحل حتى يحل منهما جميعا. ثم قدمت مكة وهي حائض، فلم تطف بالبيت ولا بين الصفا والمروة، فأمرها النبي أن تنقض رأسها وتمتشط وتهل بالحج وتدع العمرة. فلما قضوا الحج أرسلها مع عبد الرحمن بن أبي بكر إلى التنعيم فاعتمرت، فقال هذه مكان عمرتك. ويذكر المحقق أن ابن عبد البر رأى إسناد عبد الرحمن بن القاسم عند يحيى خطأ لانفراده به. {cite:muwatta-maruf-1997 p.547}"
