text: "… البدن عاماً بالفصد من الأكحل، وإن احتيج ثني من الباسليق، واستفراغ الخلط الحاد كل خلط بما يستفرغه، مثل الصفراء بحبوب السقمونيا، والبلغم بحبّ الأصطمحيقون، والسوداء بحبّ الأفتيمون وطبيخه، وكسره من سورة المني بالأدوية المفردة مما يبرّد، وبالأدوية المحركّة له بحسب …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 794، يذكر البيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 794, that mentions the hospital and the medical craft, the organs of the body, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 794 کا اقتباس جس میں بیمارستان، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
