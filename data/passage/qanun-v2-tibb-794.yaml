text: "… البدن عاماً بالفصد من الأكحل، وإن احتيج ثني من الباسليق، واستفراغ الخلط الحاد كل خلط بما يستفرغه، مثل الصفراء بحبوب السقمونيا، والبلغم بحبّ الأصطمحيقون، والسوداء بحبّ الأفتيمون وطبيخه، وكسره من سورة المني بالأدوية المفردة مما يبرّد، وبالأدوية المحركّة له بحسب …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 794، يذكر البيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 794, that mentions the hospital and the medical craft, the organs of the body, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 794 کا اقتباس جس میں بیمارستان، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 794, que menciona el hospital y la práctica médica, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el medicamento, los medicamentos y la farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 794, qui mentionne l'hôpital et l'art médical, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 794. sayfasından bir bölüm; hastane, tıp mesleği, vücut organları, cerrahi, sünnet, atel, tıp, ilaçlar ve eczaneden bahsediliyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 794, yang menyebutkan rumah sakit, profesi medis, organ tubuh, pembedahan, sunat, bidai, obat-obatan, narkoba, dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
