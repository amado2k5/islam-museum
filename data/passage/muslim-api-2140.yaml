text: "… عُثْمَانُ بْنُ عُمَرَ، أَخْبَرَنَا شُعْبَةُ، عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ أَتَى عَلَى امْرَأَةٍ تَبْكِي عَلَى صَبِيٍّ لَهَا فَقَالَ لَهَا \" اتَّقِي اللَّهَ وَاصْبِرِي \". فَقَالَتْ وَمَا تُبَالِي بِمُصِيبَتِي. فَلَمَّا ذَهَبَ قِيلَ لَهَا إِنَّهُ رَسُولُ اللَّهِ. فَأَخَذَهَا مِثْلُ الْمَوْتِ فَأَتَتْ بَابَهُ فَلَمْ تَجِدْ عَلَى بَابِهِ بَوَّابِينَ فَقَالَتْ يَا رَسُولَ اللَّهِ لَمْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2140، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih Muslim, no. 2140 (The Book of Prayer - Funerals), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح مسلم کی حدیث نمبر 2140، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih Muslim, n° 2140, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih Muslim, n.º 2140, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sahih Müslim'de 2140 numaralı hadis, ölüler için ağlamayı ve bunun sınırlarını ele almaktadır. Bu derleme, ağıt ve yakarışla ilgili en meşhur sözleri, Kur'an'dan, Sünnet'ten, Peygamberimizin hayatından, Sahabelerin ve haleflerinin rivayetlerinden ve diğer ilgili kitaplardan alıntılarla bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2140, membahas tentang menangis atau meratap atas orang yang meninggal dan batasannya. Hadits ini mengumpulkan ucapan-ucapan paling terkenal tentang elegi dan ratapan, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, riwayat dari para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
