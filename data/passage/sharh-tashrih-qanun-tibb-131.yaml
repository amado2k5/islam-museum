text: "… لبناً، ويصير بذلك غذاء للجنين بعد انفصاله ولا يبقى في الرحم فضلاً ويندفع إلى غير الثدي من الأعضاء فيؤذيه وعبارة باقي الفصل ظاهرة. والله ولي التوفيق. تم القسم الأول بحمد اللّٰه ومنه ومن هنا نأخذ في تشريح الأعضاء الآلية مسنعينا …"
