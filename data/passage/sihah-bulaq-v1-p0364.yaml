text: |-
  ⁦(هريذ)⁩
  ٢٧٧
  مال ومن كلاً وفى رأسه نبذمن شيب وأصاب الارض نبذمن مطر أى شى بسير والنبيذ
  واحد الانبذة يقال نيذت نبيذا اى اتخذته والعلمة تقول أنيذت وتبذ العرق نيذا نالغة
  فى نبض والمنبذة الوسادة ⁦(نجذ)⁩ الناجذ آخر الاضراس والاذان أربعة نواجذ
  فى أقصى الاسنان بعد الارحاء ويمى ضرس الحلم لانه ينبت بعد البلوغ وكمال العقل يقال
  ضحك -تى بدت نواجذه اذا استغرب فيه وقد تكون التواجذ للغرس وهى الانياب
  من الحف والصوالغ من الظلف قال الشماخ يذكرابلاحداد الانياب
  يساكرن المضاه بمقنعات • نواجذهنّ كالحد إالوقيع
  ورجل منجذ مجزب أحكمته الامور وقال الشاعر حيم بن وثيل
  اخوخسين مجتمع أشدى • ونجذنى مداورة الشؤون
  فذ تفذ السهم من الرمية ١ و فذ الكتاب الى فلان تفاذا ونفوذا وأنقدته أنا
  ⁦(١)⁩ ب سر اليم وتدالياء اه
  والتنفيذ مثله ورجل نافذفى أمره أى ماض وأمره نافذ أى مطاع وقولهسم أتى يتفذما قال
  أى بالخرج منه وطعنة اها نفذ أى نافذة قال الشاعر قيس بن الخطيم
  طعنت ابن عبد القدس طعنة ثائر • لها نفذلولا الشعاع أضاءها
  قذ) أنقذه من فلان واستنقذه منه وتنقذه بمعنى أى نجاه وخلصه والنقذ بالتحريك
  ما أنقدته وهو فعل بمعنى مفعول مثسل نفض وقبض والنقائدّ من الحيل ما أنقذته من العدو
  وأخذته منهم الواحدة نقيذة ومنقذاسم رجل
  صل الداد جذ لوجسذ بالجيم نقرة فى الجبل يجتمع فيه ا الماء والجمع وجاذ قال
  قاسترفى وأشرف على الموت وشاة وقوذة قلت انطقب ويقال وقذمالتعاس
  اذا غلبه قال الاعشى
  يلويذى دين النهاروأقتضى • دي اذا وقذ النعاس الرقدا
  ورجل وقيسذ أى مابه طرق الاصمعى الموقذة الناقة التى قد أثر الصرار فى أخلافها وقال!
  العدبس هى التى يرغنها الواد ولا يخرج لبنها الانزر العظم الضرع فيوقذهاذ المأوياخذهاله.
  داءوورم
  ⁦( صل المناء )⁩ ذذ لهذ الاسراع فى القطع وفى القراءة يقال هويم ذالقرآن هذا
  ويهذا لحديث هذا أى يسرده وسكين هذوذ قطاع قال الاصمعى تقول للناس اذا أردت أن
  يكفواءن الشى هجاجيك وهذا ذيك على تقدير الاثنين قال عبدبنى الحسحاس
  اذاشق بردشق بالبردمثله • هذا ذيك حتى ليس للبردلابس
  تزعم النساء أنه اذا شق عند البضاع شيئا من توب صاحبه دام الودبينهما وإلا تهاجرا
  واهتذذت الشئ اقتطعته بسرعة وقال الشاعر
  وعبديغون تحجل الطيرحوله • قد اهتذعرشيه الحسام المذكر
  ويروى قد احتز ر⁦( ريذ )⁩ الهربذبالكسروا حدهرابذة الجوس وهم خدم النسار قارسى
  معرب والهربذة سيردون الخيب وعدا الجمل الهربذى أى فى شق وقال الاصمعى الهريذى
  قوله اى فى شق اى جانب وتظيره
  مايذكر فى فصل العين من باب
  الضاد العرضة ان عمنى
  معارضة ويقال هو يمشى
  العرضئة ويدى العرضى بالف
  مقصورة اذامشى مشية فى شق
  فيها بقى من نشاطه اه كذانة له
  وانقولى عن ماحب الصراح
