summary:
  ar: "القسم 30 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوصايا عن رسول الله»، ويضم فيها النصوص من 2116 إلى 2124 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 30 of Jami' al-Tirmidhi (Chapters On Wasaya (Wills and Testament)) in the division of the open hadith dataset the museum took its reports from: reports 2116 to 2124 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 30، عنوان «کتاب الوصایا عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2116 تا 2124۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 30 de Jami' al-Tirmidhi (Capítulos sobre la Wasaya (Testamentos)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2116 al 2124 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 30 de Jami' al-Tirmidhi (chapitres sur les testaments), soit les hadiths 2116 à 2124 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
