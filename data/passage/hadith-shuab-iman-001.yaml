text: "فاظ الجزلة وجدت كثيرة فمنها كتابه لوائل بن حجر الحضرمي ((من محمد رسول الله إلى الاقيال العباهلة من أهل حضرموت بإقام الصلاة وإيتاء الزكاة على التبعة شاة والنتمة لصاحبها وفي السبوب الخمس لا خلاط ولا وراط ولا ساق ولا شغار"
