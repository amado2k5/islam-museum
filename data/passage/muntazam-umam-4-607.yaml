text: "… وقرأ صحيح البخارى على كريمة بنت احمد المروزية فى خمسة ايام ورجع الى بغداد فقرب من ابى القاسم بن المسلمة الوزير وكان قد اظهر بعض اليهود كتابا وادعى انه كتااب رسول الّه باسقاط الجزية عن اهل خيبر و فيه شهادات …"
