label: { ar: "سنن أبي داود 1498 — الأب والأبوة", en: "Sunan Abi Dawud 1498 — the father and fatherhood", ur: "سنن ابی داؤد 1498 — باپ اور والدیت", es: "Sunan Abi Dawud 1498 — El padre y la paternidad", fr: "Sunan Abi Dawud 1498 — le père et la paternité" }
text: "حَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، حَدَّثَنَا شُعْبَةُ، عَنْ عَاصِمِ بْنِ عُبَيْدِ اللَّهِ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ، عَنْ عُمَرَ، - - قَالَ اسْتَأْذَنْتُ النَّبِيَّ فِي الْعُمْرَةِ فَأَذِنَ لِي وَقَالَ \" لاَ تَنْسَنَا يَا أُخَىَّ مِنْ دُعَائِكَ \". فَقَالَ كَلِمَةً مَا يَسُرُّنِي أَنَّ لِي بِهَا الدُّنْيَا قَالَ شُعْبَةُ ثُمَّ لَقِيتُ عَاصِمًا بَعْدُ بِالْمَدِينَةِ فَحَدَّثَنِيهِ وَقَالَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1498، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1498 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1498، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1498 (Oración (Kitab Al-Salat): Preceptos detallados sobre el Witr), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1498 (La Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
