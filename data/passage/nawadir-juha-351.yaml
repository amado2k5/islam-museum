text: "… نادتني جارتنا لأن حمارتها ولدت فلواً بلا ذنب خرج الشيخ من بيته، بعد أن قال لامرأته: يا عزيزتي، اطبخي لنا برغلاً مفلفلاً لنتناوله مساءً بلذة وسرور. وعاد في المساء تعباً فخلع ثيابه، واستراح قليلاً، ونهض إلى المائدة لأنَّ معدته كانت …"
summary:
  ar: "كانت زوجة جحا تطبخ البرغل، فناداه صبي الجيران لأن حمارة الجارة ولدت فلواً بلا ذنب، فذهب جحا ثم عاد وقال إنه كان يأمل أن يأكل البرغل بهدوء. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  en: "Juha's wife cooks bulgur; a neighbour boy calls him away because the neighbour's donkey has foaled one without a tail; Juha goes, returns, and says he hoped to eat bulgur in peace. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  ur: "جحا کی بیوی بلغور پکا رہی تھی کہ پڑوسی لڑکے نے اسے بلا لیا کیونکہ پڑوسن کی گدھی نے بغیر دم کا بچہ جنا تھا، جحا گیا، واپس آیا اور بولا کہ اسے امید تھی کہ سکون سے بلغور کھائے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  fr: "La femme de Juha cuit du boulgour ; un garçon voisin l'appelle car l'ânesse de la voisine a mis bas un ânon sans queue ; Juha s'y rend, revient, et dit qu'il espérait manger son boulgour en paix. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  es: "La esposa de Juha cocina bulgur; un muchacho vecino lo llama porque la burra de la vecina ha parido un pollino sin cola; Juha va, regresa y dice que esperaba comer su bulgur en paz. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  tr: "Juha'nın karısı bulgur pişirirken, komşunun oğlu onu çağırdı çünkü komşunun eşeği kuyruksuz bir tay doğurmuştu. Juha gitti ve sonra geri döndü, bulguru huzur içinde yiyebilmeyi umduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 174}"
  id: "Istri Juha sedang memasak bulgur ketika anak tetangga memanggilnya karena keledai tetangga melahirkan anak keledai tanpa ekor. Juha pergi dan kemudian kembali, mengatakan bahwa ia berharap dapat makan bulgur dengan tenang. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
