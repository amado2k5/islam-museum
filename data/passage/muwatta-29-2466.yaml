label: { ar: "الموطأ 2466 — عراك بن مالك وسليمان بن يسار: الفرس الذي وطئ إصبع رجل من جهينة", en: "Muwatta 2466", es: "Muwatta 2466", fr: "Muwatta 2466", ur: "موطا 2466", tr: "El-Muvatta 2466 — Arak bin Malik ve Süleyman bin Yaşar: Cühayna'dan bir adamın ayağına basan at", id: "Al-Muwatta 2466 — Arak bin Malik dan Sulayman bin Yasar: Kuda yang menginjak jari kaki seorang pria dari Juhayna" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عراك بن مالك وسليمان بن يسار أن رجلا من بني سعد بن ليث أجرى فرسا فوطئ على إصبع رجل من جهينة، فنُزف منها فمات. فقال عمر بن الخطاب للذين ادعي عليهم: أتحلفون بالله خمسين يمينا أنه ما مات منها؟ فأبوا وتحرجوا. ثم سألهم عن الآخرين فأبوا، فقضى عمر بشطر الدية على السعديين. قال مالك: وليس العمل على هذا. {cite:muwatta-maruf-1997 p.419} {cite:muwatta-maruf-1997 p.420}"
  tr: "Malik, İbn Şihab'dan, o da Arak ibn Malik ve Süleyman ibn Yasar'dan rivayet ettiğine göre, Beni Sa'd ibn Layth'ten bir adam atıyla yarışırken, atı Cuhaynah'tan bir adamın parmağını ezmiş ve adam kan kaybından ölmüştür. Ömer ibn el-Hattab, suçlananlara, \"Allah'a elli kez yemin eder misiniz ki, bu yüzden ölmedi?\" diye sormuştur. Onlar reddetmiş ve tereddüt etmişlerdir. Sonra diğerleri hakkında sormuş, onlar da reddetmişlerdir. Bunun üzerine Ömer, kan parasının yarısının Beni Sa'd'dan iki adam tarafından ödenmesine hükmetmiştir. Malik, \"Bu, yerleşik uygulama değildir\" demiştir. {cite:muwatta-maruf-1997 s.419} {cite:muwatta-maruf-1997 s.420}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Arak ibn Malik dan Sulayman ibn Yasar, bahwa seorang pria dari Bani Sa'd ibn Layth memacu kudanya, yang kemudian menginjak jari seorang pria dari Juhaynah, menyebabkannya berdarah hingga meninggal. Umar ibn al-Khattab bertanya kepada mereka yang dituduh, \"Apakah kalian akan bersumpah demi Allah lima puluh sumpah bahwa dia tidak meninggal karena ini?\" Mereka menolak dan ragu-ragu. Kemudian dia bertanya kepada mereka tentang yang lain, dan mereka juga menolak. Maka Umar memutuskan bahwa setengah dari uang darah harus dibayar oleh dua orang dari Bani Sa'd. Malik berkata, \"Ini bukan praktik yang lazim.\" {cite:muwatta-maruf-1997 p.419} {cite:muwatta-maruf-1997 p.420}"
