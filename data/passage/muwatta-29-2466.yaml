label: { ar: "الموطأ 2466 — عراك بن مالك وسليمان بن يسار: الفرس الذي وطئ إصبع رجل من جهينة", en: "Muwatta 2466" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عراك بن مالك وسليمان بن يسار أن رجلا من بني سعد بن ليث أجرى فرسا فوطئ على إصبع رجل من جهينة، فنُزف منها فمات. فقال عمر بن الخطاب للذين ادعي عليهم: أتحلفون بالله خمسين يمينا أنه ما مات منها؟ فأبوا وتحرجوا. ثم سألهم عن الآخرين فأبوا، فقضى عمر بشطر الدية على السعديين. قال مالك: وليس العمل على هذا. {cite:muwatta-maruf-1997 p.419} {cite:muwatta-maruf-1997 p.420}"
