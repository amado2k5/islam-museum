text: "… يكون الأمر كذلك في كل ما يوجد فيه علة تحريم الخمر، إلا أن يثبت في ذلك فارق شرعي. واتفقوا على أن الانتباذ حلال ما لم تحدث فيه الشدة المطربة الخمرية لقوله وَليف: فَانْتَبِذُوا وَكُلُّ مُسْكِرٍ حَرَامٌ، ولما ثبت عنه ال …"
