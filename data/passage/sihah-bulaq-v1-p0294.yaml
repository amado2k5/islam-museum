text: |-
  ⁦(ص غر)⁩
  ٣٤٧
  والباب يصر صريرا أى صوّت ويقال درهم صرىّ وصرى للذى له صوت اذا فقدوة ولهم
  فى اليمين هى مى صرى مثال الشعرى أى عزيمة وجدّ وهى مشتقة من أصروت على الشئ
  أى أقت ودمت قال أبو سعال الاسدى وقد ضلت ناقنه أيمنك لش لم تردّها على لاعبدتك
  فأصاب ناقته وقد تعلق زمامهايعو سيجة فاخذها وقال علم ربى أنهامف صرى وحكى
  بعقوب أصرى وأصرى وصرى وصرى وقد اختلف عنه واصطرّ الحافر أى ضاق قال الراجز
  ليس بصطر ولافرشاح وصر الجندب صريرا وصرصر الاخطب صرصرة كأنه-م
  قدروافى صوت الجندب المد وفى صوت الاخطب الترجيع فكوهع- لى ذلك وكذلك
  الصقر والبازى وأنشد الاصمعى جريريصف ابنه سوادة
  ذا كم سوادة يجلو مقلتى لحم * بازيصر صرفوق المرقب العالى
  وصر صراسم نهر بالعراق وريح صرصر أى باردة ويقال أصلهاصرّر من الصر فأبدلوا!
  مكان الراء الوسطى فاء الفعل كفولهم كبكبوا أصله كببوا وتجفيف الثوب أمسله تجفف
  والصر صرائى واحد الصرصرانيات وهى الابل بين البخاتى والعراب ويقال هى الغوالج
  والصر صرانى ضرب من سمك البحر والصراصرة بط الشام والصر صور مشل الجرجودوهى
  العظام من الابل ⁦(صعر)⁩ الصعر الميل فى الخدخاصة وقد صعر خده وصاعره أى
  أماله من الكبر ومنه قوله تعالى ولا تصعر خدك للناس وقال الشاعر ⁦(المتلس)⁩
  وكنا اذا الجبار صعر خده • أقناله من درنه فتقوما
  رفى الحديث ليس فيه الااصهر أوابتر آى ليس فيه الاذاهب بنفسه أوذليل وربما كان
  لانسان والظليم أصعر خلقة وقول الرابز وقدقر بن قربا مصعرا يعنى شديدا
  والصعر الشديد والميم زائدة يقال رجل صمعرى والصمعرة الارض الغليظة وتعلبة
  ابن صعير المازنى والصيعرية اعتراض فى السير وهو من الصعر والصبعرية سمة
  فى عنق البعير قال الشاعر (المتلمس
  وقد أ تناسى الهم عند احتضاره • بناج عليه الصبعرية مكدم
  والصعر ورقطعة من الصمغ فيها طول والنواء وقال أبوع روالصمارير ما جدمن اللثا
  وصعررت الشى فتصعر رأى استدار قال الراجز سودكب الفلفل الصعرد
  ( م عبر الصعير تجر بنزلة السدروكذات الصتعبر (صعفر اصعنفرت الجر
  ابذعرّت ومحفرها الخوف قال الراجز يصف الرامى والمر فلم يصب واصعنفرت جواذلا
  ويروى وا-حنفرت صغر الصخرضد الكبر وقد صغر الشئ وهوصغير وصغار
  بالضم وأصغره غيره وصغره تصغيراوأصغرت القرية خرزتها صغيرة قال الراجز
  شلت يداقارية فرتها • لو كانت الساقى أصغرتها
  واستصغره عدّه صغيرا وتصاغرت اليه نفسه تحاقرت وقدجع الصغير فى الشعر على صغرا.
  وأنتدأبوعمرو فللكبرا.أكل حيث شاؤا * والصغراءأكل واقتذام
  والصغرى تأنيت الاصغروالجهع الصغر قال سيبويه لا يقال نسوة صغر ولاقوم أصاغر
  الابالالف واللام قال وسمعنا العرب تقول الاصاغروان شئت قلت الاصفرون والصغار
