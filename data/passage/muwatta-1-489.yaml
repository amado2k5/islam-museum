label: { ar: "الموطأ 489 — كان يصلي يوم الفطر ويوم الأضحى قبل الخطبة", en: "Muwatta 489" }
summary:
  ar: "أول حديث في باب الأمر بالصلاة قبل الخطبة في العيدين. يرويه يحيى عن مالك عن ابن شهاب مرسلاً أن النبي كان يصلي يوم الفطر ويوم الأضحى قبل الخطبة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن معناه ثابت في الصحيحين من حديث ابن عمر وابن عباس وجابر بن عبد الله، ويحيل على التمهيد (12/7). {cite:muwatta-maruf-1997 p.250} {cite:muwatta-maruf-1997 p.251}"
