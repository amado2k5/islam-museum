text: "… بْنِ أَبِي عَبْدِ اللَّهِ، عَنْ أَيُّوبَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ سَأَلْنَا ابْنَ عُمَرَ عَنْ نَبِيذِ الْجَرِّ، فَقَالَ حَرَّمَهُ رَسُولُ اللَّهِ. فَأَتَيْتُ ابْنَ عَبَّاسٍ فَقُلْتُ سَمِعْتُ الْيَوْمَ شَيْئًا عَجِبْتُ مِنْهُ. قَالَ مَا هُوَ قُلْتُ سَأَلْتُ ابْنَ عُمَرَ عَنْ نَبِيذِ الْجَرِّ فَقَالَ حَرَّمَهُ رَسُولُ اللَّهِ. فَقَالَ صَدَقَ ابْنُ عُمَرَ. قُلْتُ مَا الْجَرُّ قَالَ كُلُّ شَىْءٍ مِنْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 5619، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5619 (The Book of Drinks), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5619، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
