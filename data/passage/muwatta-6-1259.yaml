label: { ar: "الموطأ 1259 — مالك: لا ينبغي للمحرم أن يلبس ما لا يلبسه، أو يقصر شعره، أو يمس طيبا من غير ضرورة، وإنما أرخص فيه للضرورة", en: "Muwatta 1259" }
summary:
  ar: "يقول مالك في من أراد أن يلبس شيئا من الثياب التي لا ينبغي للمحرم لبسها، أو يقصر شعره، أو يمس طيبا من غير ضرورة، ليسارة مؤنة الفدية عليه، إنه لا ينبغي لأحد أن يفعل ذلك، وإنما أرخص فيه للضرورة، وعلى من فعل ذلك الفدية. {cite:muwatta-maruf-1997 p.560}"
