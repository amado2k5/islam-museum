text: |-
  وقد تقضى نظمي المقدمة * مني لقارئ القرآن تقدمة
  والحمد لله لها ختام * ثم الصلاة بعد والسلام
  على النبي المصطفى محمدا * وآله وصحبه ذوي الهدى
  أبياتها قاف وزاي بالعدد * من يحسن التجويد يظفر بالرشد
