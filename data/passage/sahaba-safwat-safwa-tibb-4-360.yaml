text: "… اللّٰه بلّ. وهذه بضم النون، على خلاف اسم أم عمارة المتقدمة. عن حفصة بنت سيرين، عن أم عطية قالت: غزوت مع رسول اللّٰه بي سبع غزوات، وكنت أخلفهم في الرحال، وأصنع لهم الطعام، وأقوم على المرضى، وأداوي الجرحى. - أم …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 360، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 360, that mentions illness and the sick, the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 360 کا اقتباس جس میں بیماری اور بیمار، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen escaneado 4, pág. 360, que menciona la enfermedad y los enfermos, el tratamiento de las heridas, las mujeres que atienden a los heridos, la búsqueda de tratamiento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Sifat al-Safwa d'Ibn al-Jawzi, volume 4 scanné, p. 360, qui mentionne la maladie et les malades, le traitement des blessures, les femmes soignant les blessés, la recherche de soins; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin resimli 4. cildinin 360. sayfasından, hastalık ve hastalar, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedavi arayışından bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikası gereği metin kırk kelime içinde alıntılanmıştır."
  id: "Kutipan dari kitab “Sifat al-Safwa” karya Ibn al-Jawzi, jilid 4, halaman 360, yang membahas tentang penyakit dan orang sakit, pengobatan luka, perempuan yang merawat orang terluka, dan mencari pengobatan; dari versi ilustrasi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
