label: { ar: "صحيح مسلم 6265 — وصية أو عهد أخير", en: "Sahih Muslim 6265 — a testament or parting counsel", ur: "صحیح مسلم 6265 — وصیت یا آخری نصیحت", es: "Sahih Muslim 6265 — un testamento o consejo de despedida", fr: "Sahih Muslim 6265 — un testament ou un conseil d'adieu", tr: "Sahih Muslim 6265 — Son Vasiyetname", id: "Sahih Muslim 6265 — Surat Wasiat Terakhir" }
text: "… تَطْعَنُوا فِي إِمَارَتِهِ - يُرِيدُ أُسَامَةَ بْنَ زَيْدٍ - فَقَدْ طَعَنْتُمْ فِي إِمَارَةِ أَبِيهِ مِنْ قَبْلِهِ وَايْمُ اللَّهِ إِنْ كَانَ لَخَلِيقًا لَهَا. وَايْمُ اللَّهِ إِنْ كَانَ لأَحَبَّ النَّاسِ إِلَىَّ. وَايْمُ اللَّهِ إِنَّ هَذَا لَهَا لَخَلِيقٌ - يُرِيدُ أُسَامَةَ بْنَ زَيْدٍ - وَايْمُ اللَّهِ إِنْ كَانَ لأَحَبَّهُمْ إِلَىَّ مِنْ بَعْدِهِ فَأُوصِيكُمْ بِهِ فَإِنَّهُ مِنْ صَالِحِيكُمْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6265، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6265 (The Book of the Merits of the Companions), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 6265، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6265 (El Libro de los Méritos de los Compañeros), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 6265 (Livre des mérites des Compagnons), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih Müslim'de 6265 numaralı hadis, vasiyet veya son bir ahitten bahsetmektedir. Bu hadis, vasiyet, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6265, menyebutkan tentang wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
