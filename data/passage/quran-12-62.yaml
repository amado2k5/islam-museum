translations:
  en: { text: "He said unto his young men: Place their merchandise in their saddlebags, so that they may know it when they go back to their folk, and so will come again.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(اور یوسف نے) اپنے خدام سے کہا کہ ان کا سرمایہ (یعنی غلّے کی قیمت) ان کے شلیتوں میں رکھ دو عجب نہیں کہ جب یہ اپنے اہل وعیال میں جائیں تو اسے پہچان لیں (اور) عجب نہیں کہ پھر یہاں آئیں", translator: "Fateh Muhammad Jalandhari", license: PD }
