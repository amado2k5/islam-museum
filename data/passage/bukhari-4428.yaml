label: { ar: "البخاري 4428 — ألم الأكلة التي أكلها بخيبر", en: "Bukhari 4428 — The pain of the meal he ate at Khaybar" }
text: "قالت عائشة: كان النبي يقول في مرضه الذي مات فيه: «يا عائشة، ما أزال أجد ألم الطعام الذي أكلت بخيبر، فهذا أوان وجدت انقطاع أبهري»"
summary:
  ar: "في كتاب المغازي؛ رواية عائشة أن النبي كان يجد في مرض موته ألم الطعام الذي أكل بخيبر — الشاة المسمومة التي قدمتها له يهودية — حتى قال إنه وجد انقطاع أبهره. من نصوص خبر سم خيبر وأثره الباقي."
