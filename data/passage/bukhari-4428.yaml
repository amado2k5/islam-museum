text: "قالت عائشة: كان النبي يقول في مرضه الذي مات فيه: «يا عائشة، ما أزال أجد ألم الطعام الذي أكلت بخيبر، فهذا أوان وجدت انقطاع أبهري»"
summary:
  ar: "في كتاب المغازي؛ رواية عائشة أن النبي كان يجد في مرض موته ألم الطعام الذي أكل بخيبر — الشاة المسمومة التي قدمتها له يهودية — حتى قال إنه وجد انقطاع أبهره. من نصوص خبر سم خيبر وأثره الباقي."
  tr: "Askeri Seferler Kitabı'nda Aişe, Peygamber'in son hastalığı sırasında Hayber'de yediği zehirli koyundan dolayı acı çektiğini, hatta aortunun koptuğunu hissettiğini anlatır. Bu, Hayber'deki zehirlenme ve bunun kalıcı etkilerine dair anlatımlardan biridir."
  id: "Dalam kitab ekspedisi militer, Aisyah menceritakan bahwa Nabi, selama sakit terakhirnya, menderita kesakitan akibat makanan yang dimakannya di Khaybar—domba beracun yang diberikan seorang wanita Yahudi kepadanya—sampai-sampai beliau merasa seperti aortanya putus. Ini adalah salah satu kisah tentang keracunan di Khaybar dan dampaknya yang berkepanjangan."
