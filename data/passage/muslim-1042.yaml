label: { ar: "مسلم 1042 — لأن يغدو أحدكم فيحطب على ظهره خير من أن يسأل", en: "Muslim 1042 — Gathering firewood beats begging", es: "Musulmán 1042 — Recoger leña es mejor que mendigar", fr: "Muslim 1042 — Ramasser du bois vaut mieux que mendier", ur: "مسلم 1042 - لکڑیاں جمع کرنا بھیک مانگنا", tr: "Müslim 1042 — Sizden birinizin sırtında odun taşıması, yardım istemekten daha iyidir.", id: "Muslim 1042 — Lebih baik salah seorang dari kalian pergi mencari kayu bakar dengan memikulnya di punggung daripada meminta pertolongan." }
text: "قال رسول الله: لأن يغدو أحدكم فيحطب على ظهره فيتصدق به ويستغني به من الناس خير من أن يسأل رجلاً أعطاه أو منعه، ذلك بأن اليد العليا أفضل من اليد السفلى، وابدأ بمن تعول"
summary:
  ar: "رواية أبي هريرة عن قيس بن أبي حازم في باب كراهة المسألة للناس من كتاب الزكاة في صحيح مسلم؛ الاشتغال بالحطب خير من السؤال، وختم الحديث بتفضيل اليد العليا والبدء بمن تعول."
  tr: "Sahih Müslim'deki Zekat Kitabı'nın, insanlardan yardım istemenin sakıncalı olduğu bölümünde, Ebu Hurayra'nın Kays bin Ebu Hazim'den rivayet ettiği hadis şöyledir: \"Odun satmak, yardım istemekten daha hayırlıdır.\" Hadis, üstün durumda olanlara öncelik verilmesi ve desteklenenlerden başlanması gerektiğini vurgulayarak sona erer."
  id: "Riwayat Abu Hurairah dari Qais bin Abi Hazim dalam bab tentang hal yang tidak dianjurkan meminta bantuan kepada orang lain dalam Kitab Zakat di Sahih Muslim: “Membakar kayu lebih baik daripada meminta bantuan,” dan hadits tersebut diakhiri dengan mendahulukan orang yang berkuasa dan memulai dengan orang-orang yang Anda dukung."
