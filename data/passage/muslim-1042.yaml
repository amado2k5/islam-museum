label: { ar: "مسلم 1042 — لأن يغدو أحدكم فيحطب على ظهره خير من أن يسأل", en: "Muslim 1042 — Gathering firewood beats begging" }
text: "قال رسول الله: لأن يغدو أحدكم فيحطب على ظهره فيتصدق به ويستغني به من الناس خير من أن يسأل رجلاً أعطاه أو منعه، ذلك بأن اليد العليا أفضل من اليد السفلى، وابدأ بمن تعول"
summary:
  ar: "رواية أبي هريرة عن قيس بن أبي حازم في باب كراهة المسألة للناس من كتاب الزكاة في صحيح مسلم؛ الاشتغال بالحطب خير من السؤال، وختم الحديث بتفضيل اليد العليا والبدء بمن تعول."
