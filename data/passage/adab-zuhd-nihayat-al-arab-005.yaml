text: "هو سقط . فإذا نقص عنه، فهو عداب . فإذا نقص ، فهو لبب . وقال في كتابه «الغريب)) (١) : إذا كانت الرملة مجتمعة، فهي العوكلة. فإذا انبسطت وطالت، فهي الكثيب. فإذا انتقل الكثيب من موضع إلى آخر بالرياح"
