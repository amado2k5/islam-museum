text: "… تخرج كل الغرابيل وتسير أمامي كان يفتّشُ على شيء في بيت المؤونة.. وإذا بغربال كان مملوءاً بصلاً، قد وقع على رأسه فأضاع صوابه لشدَّةِ اللَّطمةِ، وأسودَّت الدُّنيا في عينيه، فضرب به الأرض. فأتَّفق وقوعُ الغربال على جانبه فارتدَّ إليه ورض …"
summary:
  ar: "سقط على رأس جحا غربال مليء بالبصل فرماه، فارتد الغربال وجرح جبهته، فأخذ سكيناً كبيراً وأمر كل الغرابيل أن تخرج وتسير أمامه. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  en: "A sieve full of onions falls on Juha's head, and he throws it down. The sieve jumps back and cuts his forehead, and he takes a big knife and tells all the sieves to come out and walk in front of him. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  ur: "پیاز سے بھری ایک چھلنی جحا کے سر پر گرتی ہے تو وہ اسے پھینک دیتا ہے۔ چھلنی اچھل کر اس کے ماتھے کو زخمی کر دیتی ہے، تو وہ ایک بڑی چھری اٹھا کر سب چھلنیوں سے کہتا ہے کہ نکلیں اور اس کے آگے آگے چلیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  fr: "Un tamis plein d'oignons tombe sur la tête de Juha, et il le jette à terre. Le tamis rebondit et lui entaille le front, et il prend un grand couteau et ordonne à tous les tamis de sortir et de marcher devant lui. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  es: "Un cedazo lleno de cebollas cae sobre la cabeza de Juha, y él lo tira al suelo. El cedazo rebota y le corta la frente, y él toma un gran cuchillo y ordena a todos los cedazos que salgan y caminen delante de él. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
