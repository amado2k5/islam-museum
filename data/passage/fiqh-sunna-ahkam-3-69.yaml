text: "… داود : إن أمرأة قالت : يارسول اللّٰه إني نذرت إذا انصرفت من غزوتك سالما أن أضرب على رأسك بالدف، فقال لها : أو في بنذرك.. وضرب الدف إذا لم يكن مباحًا فهو إما مكروه أو أشد من المكروه، ولا …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 69، يرد فيه ذكر المكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 69, whose wording mentions the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 69 کا اقتباس جس میں مکروہ، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 3, p. 69, dont le texte mentionne le réprouvé (makruh), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 3, p. 69, cuyo texto menciona lo reprobado (makruh), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 3. cildinin 69. sayfasından, mekruh ve helal fiilleri ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz fiiller, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 3, halaman 69, yang membahas amalan yang tidak disukai dan yang diperbolehkan; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
