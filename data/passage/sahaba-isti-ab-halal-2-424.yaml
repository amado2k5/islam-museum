text: "… أجلة الصحابة. وكان عمر عيَّاش، عن عاصم، عن شقيق، مثله. يقولُ : أبن عبَّاسٍ فتى الكهول، له لسان سَؤول، وقال عمرو بن دينارٍ: مَا رأيت مجلسا أجمع لكل خير من مجلس ابن عبَّاس : الحلال، والحرام، وقلب عقول. ورُوي عن …"
