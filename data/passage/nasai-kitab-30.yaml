  ar: "سنن النسائي، كتاب الوصايا"
  en: "Sunan al-Nasa'i, Book 30: The Book of Wills"
  ur: "سنن نسائی، کتاب الوصایا"
  es: "Sunan al-Nasa'i, Libro 30: El Libro de los Testamentos"
  fr: "Sunan al-Nasa'i, Livre 30: Le Livre des Testaments"
summary:
  ar: "القسم 30 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوصايا»، ويضم فيها النصوص من 3611 إلى 3671 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 30 of Sunan al-Nasa'i (The Book of Wills) in the division of the open hadith dataset the museum took its reports from: reports 3611 to 3671 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 30، عنوان «کتاب الوصایا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3611 تا 3671۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 30 de Sunan al-Nasa'i (El Libro de los Testamentos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3611 al 3671 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre des Testaments), dans le recueil ouvert de hadiths, le livre 30 (rapports 3611 à 3671). Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
