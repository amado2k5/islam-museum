label: { ar: "سنن النسائي 3193 — الأب والأبوة", en: "Sunan al-Nasa'i 3193 — the father and fatherhood", ur: "سنن نسائی 3193 — باپ اور والدیت", es: "Sunan al-Nasa'i 3193 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3193 — le père et la paternité" }
text: "أَخْبَرَنَا أَبُو مُحَمَّدٍ، مُوسَى بْنُ مُحَمَّدٍ - هُوَ الشَّامِيُّ - قَالَ حَدَّثَنَا مَيْمُونُ بْنُ الأَصْبَغِ، قَالَ حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، قَالَ أَنْبَأَنَا شَرِيكٌ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْقَاسِمِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ، عَنْ رَسُولِ اللَّهِ أَنَّهُ أَمَرَ بِقَتْلِ الْحَيَّاتِ وَقَالَ \" مَنْ خَافَ ثَأْرَهُنَّ فَلَيْسَ مِنَّا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3193، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3193 (The Book of Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3193، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3193 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3193 (Le Livre du Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
