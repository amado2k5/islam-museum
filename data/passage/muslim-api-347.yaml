label: { ar: "صحيح مسلم 347 — الأب والأبوة", en: "Sahih Muslim 347 — the father and fatherhood", ur: "صحیح مسلم 347 — باپ اور والدیت", es: "Sahih Muslim 347 — El padre y la paternidad" }
text: "… عَبْدِ الصَّمَدِ، قَالَ حَدَّثَنِي أَبِي، عَنْ جَدِّي، عَنْ أَيُّوبَ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" لاَ يَزَالُ النَّاسُ يَسْأَلُونَكُمْ عَنِ الْعِلْمِ حَتَّى يَقُولُوا هَذَا اللَّهُ خَلَقَنَا فَمَنْ خَلَقَ اللَّهَ \". قَالَ وَهُوَ آخِذٌ بِيَدِ رَجُلٍ فَقَالَ صَدَقَ اللَّهُ وَرَسُولُهُ قَدْ سَأَلَنِي اثْنَانِ وَهَذَا الثَّالِثُ. أَوْ قَالَ سَأَلَنِي وَاحِدٌ وَهَذَا الثَّانِي."
summary:
  ar: "حديث في صحيح مسلم، رقم 347، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 347 (The Book of Faith), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 347، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 347 (El Libro de la Fe), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
