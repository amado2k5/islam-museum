summary:
  ar: "القسم 39 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب البيعة»، ويضم فيها النصوص من 4149 إلى 4211 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 39 of Sunan al-Nasa'i (The Book of al-Bay'ah) in the division of the open hadith dataset the museum took its reports from: reports 4149 to 4211 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 39، عنوان «کتاب البیعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4149 تا 4211۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 39 de Sunan al-Nasa'i (El Libro de al-Bay'ah) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4149 al 4211, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre d'al-Bay'ah), dans la partie 39 de la base de données ouverte (les hadiths 4149 à 4211 de cette base de données). Il classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 39. bölümü \"Bağlılık Kitabı\" başlığını taşımakta olup, 4149'dan 4211'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 39 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Syahadat\" dan berisi teks 4149 hingga 4211, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
