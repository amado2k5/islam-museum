text: "… من أبيذيميا قال: الأمراض التي تتزيد وتترى إن لم تعالج كلما تمادى الزمان: الصرع والنقرس ووجع المفاصل وعلل الكلى والوسواس السوداوي. السادسة من السادسة من أبيذيميا: الربع تشفي من الصرع وتمنع حدوثه إذا كان قد تقدم، وجميع الحميات تشفي من …"
