text: |-
  كان الزبيرين العوام أجلع فرجا
  وهو الذى لايزال يسدوفرجه
  .كذا فى نسهخة
  ٥٨٢
  (باب العين
  الاصغر النوى اجلع وانجاع الذى أى انكشف وقال أبو عر والجالع السافر وقد جاءت
  تجلع جلوعا وأنند
  ومزت علينا أم -فيان جالعا • فلم تزعينى مثلها جالعاشى
  والجليم قليل الحياء والميم زائدة لفع قال أيونيد الجلنفعة من النوق الجسيمة وهى
  الواسعة الجوف التامة وأنيد
  جلنفعة تشق على المطابا * اذا ما اختب رقراف السراب
  وقداجلنقع أى غلظ ح جعت الشىء المتفزق فاجتمع والرجل المجتمع الذى بلغ أشد.
  ولا يقال ذلك للنساه ويقال للجارية اذاشبت قد يحعت البداب أى قدليت الدرع والمار
  والمحفة وتجمع القوم أى اجتمموا من ههنا رههنا وجاع الناس بالضم اخلاطهم وهم
  الاشابة من قبائل شى ومنه قول ابن الاسلت يصف الحرب
  ثم تجلت واضاغاية • من بين جمع غير بماع
  والبمع مصدرقولات بحهت الشى وقد يكون اسمالهاعة الناس ويجمع على جوع والموضع
  مجمع ومجمع مثال مطلع ومطلع والمع أيضا الدقل بقال ما أكر الجمع فى أرض بى فلان انخل
  يخرج من النوى ولا يعرف اسمه ويقال أيضا للمزدلفة جمع لاجتماع الناس فيم اوجمع الكف
  بالضم وهو حين تقبضها يقال ضربته بجمع كفى وجاءفلان بقبضة مل بجعه قال الشاعر
  ومافعلت بي ذالكحتى تركتها • تقلب رأسامثل ب٣مى عاريا
  وتقول أخذت فلانا يجمع ثيابه وأمربن فلان بجمع وجع بالضم والكسراذا كان مكنوما
  لم يفشوه ولم يعلم به أحد وفلانة من زوجها بجمع ويجع أى لم يقتضها قالت دهناه بنت مسصل
  امرأة العجاج للعامل أصلح اللّٰه الامير إنى منه مجمع أى عذرا لم يقتضى ومانت فلانة بجمه
  وجمع أى مانت وولدها فى بطنها وجعة من ترأى قبضة منه ويوم الهعة يوم العروبة وكذلت
  الجعة بضم الميم ويجمع عسلى بحعات وجمع وأنان جامح اذاحات أول ما تحمل وقدرجامعة
  وهى العظيمة والجامعة الغل لانها تجمع اليدين الى العفق والمسجد الجامع وان شئت
  نلت مسجد الجامع بالاضافة كقولات الحق اليقين وحق البقين يمدى منهد اليوم الجاءم
  رحق الشئء اليقين لانَ اضافة الشئء الى نفصه لا تجوز الاعلى هذا التقدير وكان الفرّاءية ول
  العرب تضيف الشى الى نفسه لاختلاف اللفظين كما قال الشاءر
  فقلت انجواعنهانجا الجلد إنه • سيرضيكما منها سنام وغاربه
  فأضاف النجاوه والجاد الى الجلد لما اختلف اللفظان والجعاء من اليهاتم التى لم يذهب من
  بدنهاشئ وأجمع بنافته أى صرّاخلافها بجمع قال الكسائى بقال أبحعت الامر وعلى
  الامر اذاء ز-ت عليه والامر مجمع ويقال أيضا أجمع أمرك ولا تدعه منتشرا قال الشاءر
  تهل وتسعى بالمصابيح وسطها • لها أمرحزم لا يفرق مجمع
  وقال آخر
  يالبت شعرى والمنى لا تنفع • هل أغدون يوماوأمرى مجمع
  وقوله تعالى فأجعوا أمركم وشركاء كم أى وادعواشركا- كم لأنه لا يقال أجعت شركاق
  انمايقال بجعت قال الشاءر باليت زوجك قد غدا • متقلداسيفاورمحا
  إى
