text: "… كان الحسن يكره أن يأخذ المحرم من رأس الحلال يعني: من شعره أو يعمله. - حدثنا أبو بكر قال: حدثنا يحيى بن سعيد عن ابن جُرَيج عن عمرو بن دينار قال: أخبرني من رأى بعض أصحابنا حراماً يَقُصُّ عن جابر …"
