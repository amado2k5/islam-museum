label: { ar: "صحيح مسلم 4218 — ما خلّفه من تركة وميراث، وصية أو عهد أخير", en: "Sahih Muslim 4218 — what was left behind: estate and inheritance; a testament or parting counsel", ur: "صحیح مسلم 4218 — ترکہ اور میراث، وصیت یا آخری نصیحت", es: "Sahih Muslim 4218 — lo que quedó: patrimonio y herencia; un testamento o consejo de despedida", fr: "Sahih Muslim 4218 — Ce qui a été laissé derrière: biens et héritage; testament ou conseils d’adieu", tr: "Sahih Muslim 4218 — Miras ve vasiyet olarak geride bıraktığı şey, vasiyetname veya son ahit.", id: "Sahih Muslim 4218 — Apa yang ditinggalkannya berupa warisan dan wasiat atau perjanjian terakhir" }
text: "… ح وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو كُرَيْبٍ قَالاَ حَدَّثَنَا وَكِيعٌ، ح وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا ابْنُ نُمَيْرٍ، كُلُّهُمْ عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ لَوْ أَنَّ النَّاسَ، غَضُّوا مِنَ الثُّلُثِ إِلَى الرُّبُعِ فَإِنَّ رَسُولَ اللَّهِ قَالَ \" الثُّلُثُ وَالثُّلُثُ كَثِيرٌ \". وَفِي حَدِيثِ وَكِيعٍ \" كَبِيرٌ أَوْ كَثِيرٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4218، يذكر ما خلّفه من تركة وميراث، ووصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4218 (The Book of Wills), that mentions what was left behind: estate and inheritance, a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 4218، جس میں ترکہ اور میراث، وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4218 (El Libro de los Testamentos), menciona lo que se dejó como legado: bienes y herencia, un testamento o consejo de despedida. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 4218 (Le Livre des Testaments), mentionne ce qui a été laissé derrière soi: biens et héritage, testament ou dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih Müslim'de 4218 numaralı hadis, Peygamberin miras, vasiyet veya son vasiyetname açısından geride bıraktıklarından bahsetmektedir. Bu derleme, vasiyetler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4218, menyebutkan apa yang ditinggalkannya berupa warisan, wasiat, atau surat wasiat terakhir. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam suci, beserta teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
