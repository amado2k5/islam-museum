label: { ar: "الموطأ 1056 — ابن شهاب سمع بعض علمائنا يقول: ما حُجر الحجر فطاف الناس من ورائه إلا إرادة أن يستوعب الناس الطواف بالبيت كله", en: "Muwatta 1056", es: "Muwatta 1056", fr: "Muwatta 1056", ur: "موطا 1056", tr: "El-Muvatta 1056 — İbn Şihab, bazı âlimlerimizin şöyle dediğini işitti: Kara Taş, insanların arkasında tavaf etmeleri için değil, ancak insanların Kâbe'nin tamamını tavaf etmeleri niyetiyle çevrilmiştir.", id: "Al-Muwatta 1056 — Ibn Shihab mendengar sebagian ulama kami berkata: Batu Hitam tidak dikelilingi agar orang-orang melakukan tawaf di belakangnya kecuali dengan tujuan untuk melakukan tawaf mengelilingi seluruh Ka'bah." }
text: "ما حُجر الحجر فطاف الناس من ورائه إلا إرادة أن يستوعب الناس الطواف بالبيت كله"
summary:
  ar: "يرويه مالك أنه سمع ابن شهاب يقول: سمعت بعض علمائنا يقول: ما حُجر الحجر فطاف الناس من ورائه إلا إرادة أن يستوعب الناس الطواف بالبيت كله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1280). {cite:muwatta-maruf-1997 p.489}"
  tr: "Malik, İbn Şihab'ın şöyle dediğini rivayet etmiştir: \"Bazı âlimlerimizin şöyle dediğini duydum: Kara Taş, insanların arkasından tavaf etmeleri için değil, Kâbe'nin tamamını tavaf etmelerini sağlamak için yapılmıştır.\" Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (ö. 1280) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.489}"
  id: "Malik meriwayatkan bahwa ia mendengar Ibnu Shihab berkata: Aku mendengar sebagian ulama kita berkata: Batu Hitam tidak ditutup agar orang-orang dapat melakukan tawaf di belakangnya, kecuali untuk memastikan bahwa orang-orang akan melakukan tawaf mengelilingi seluruh Ka'bah. Peneliti menyebutkan bahwa Abu Mus'ab (wafat 1280) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.489}"
