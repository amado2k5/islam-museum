label: { ar: "الموطأ 800 — عائشة بنت طلحة: زوجها عبد الله بن عبد الرحمن بن أبي بكر دخل وهو صائم، فقالت له عائشة: ما يمنعك أن تقبّلها وتلاعبها؟", en: "Muwatta 800", es: "800 vatios", fr: "800 watts", ur: "800 واٹ", tr: "Al-Muwatta 800 — Aişe bint Talha: Kocası Abdullah bin Abdul Rahman bin Abi Bakr oruçlu iken içeri girdi. Aişe ona şöyle dedi: Onu öpmene ve onunla oynamana ne engel oluyor?", id: "Al-Muwatta 800 — Aisyah binti Talha: Suaminya, Abdullah bin Abdul Rahman bin Abi Bakr, masuk dalam keadaan berpuasa, lalu Aisyah berkata kepadanya: Apa yang menghalangimu untuk menciumnya dan bermain dengannya?" }
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله أن عائشة بنت طلحة أخبرته أنها كانت عند عائشة زوج النبي، فدخل عليها زوجها عبد الله بن عبد الرحمن بن أبي بكر الصديق وهو صائم، فقالت له عائشة: ما يمنعك أن تدنو من أهلك فتقبلها وتلاعبها؟ فقال: أقبلها وأنا صائم؟ قالت: نعم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.394}"
  tr: "Malik, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan rivayet ettiğine göre, Aişe bint Talha ona şöyle anlatmıştır: Peygamberin eşi Aişe ile birlikteyken, kocası Abdullah ibn Abdülrahman ibn Ebu Bekir el-Siddik oruçlu iken içeri girmiştir. Aişe ona, \"Eşine yaklaşmana, onu öpmene ve onunla oynamana ne engel oluyor?\" diye sormuştur. Adam, \"Oruçluyken onu öpmeli miyim?\" diye sormuştur. Aişe, \"Evet\" demiştir. Editör, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.394}"
  id: "Malik meriwayatkannya dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, bahwa Aisyah binti Talha bercerita kepadanya bahwa ia sedang bersama Aisyah, istri Nabi, ketika suaminya, Abdullah ibn Abd al-Rahman ibn Abi Bakr al-Siddiq, masuk dalam keadaan sedang berpuasa. Aisyah berkata kepadanya, \"Apa yang menghalangimu untuk mendekati istrimu, menciumnya, dan bermain dengannya?\" Ia menjawab, \"Haruskah aku menciumnya saat aku sedang berpuasa?\" Aisyah menjawab, \"Ya.\" Editor menyebutkan bahwa Abu Musab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.394}"
