label: { ar: "الموطأ 800 — عائشة بنت طلحة: زوجها عبد الله بن عبد الرحمن بن أبي بكر دخل وهو صائم، فقالت له عائشة: ما يمنعك أن تقبّلها وتلاعبها؟", en: "Muwatta 800" }
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله أن عائشة بنت طلحة أخبرته أنها كانت عند عائشة زوج النبي، فدخل عليها زوجها عبد الله بن عبد الرحمن بن أبي بكر الصديق وهو صائم، فقالت له عائشة: ما يمنعك أن تدنو من أهلك فتقبلها وتلاعبها؟ فقال: أقبلها وأنا صائم؟ قالت: نعم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.394}"
