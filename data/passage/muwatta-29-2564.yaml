label: { ar: "الموطأ 2564 — يحيى: من أوصى أن يُعفى عن قاتله عمدا فذلك جائز له", en: "Muwatta 2564", es: "Muwatta 2564", fr: "Muwatta 2564", ur: "موطا 2564", tr: "Al-Muwatta 2564 — Yahya: Kim katilinin kasten affedilmesini vasiyet ederse, bu onun için caizdir.", id: "Al-Muwatta 2564 — Yahya: Barangsiapa yang mewasiatkan agar pembunuhnya diampuni secara sengaja, maka hal itu diperbolehkan baginya." }
summary:
  ar: "حدثني يحيى عن مالك أنه أدرك من يرضى من أهل العلم يقولون في الرجل إذا أوصى أن يُعفى عن قاتله، إذا قتل عمدا: إن ذلك جائز له، وأنه أولى بدمه من غيره من أوليائه من بعده. {cite:muwatta-maruf-1997 p.447}"
  tr: "Yahya, Malik'ten rivayetle bana, bir kimsenin kasten öldürülmesi durumunda katilinin affedilmesini vasiyet etmesi halinde bunun caiz olduğunu ve kendisinden sonraki diğer mirasçılarından daha fazla kan hakkına sahip olduğunu söyleyen âlimlerin görüşlerine katılan bazı âlimler bulduğunu söyledi. {cite:muwatta-maruf-1997 s.447}"
  id: "Yahya memberitahuku, berdasarkan riwayat Malik, bahwa ia menemukan beberapa ulama yang puas dengan fatwa para ulama yang mengatakan, mengenai seorang pria yang mewasiatkan agar pembunuhnya diampuni jika ia dibunuh dengan sengaja: bahwa hal ini diperbolehkan baginya, dan bahwa ia memiliki hak yang lebih besar atas darahnya daripada ahli waris lainnya setelahnya. {cite:muwatta-maruf-1997 p.447}"
