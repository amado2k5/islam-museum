label: { ar: "الموطأ 1967 — مالك: في الرجل يكون له على الرجل مائة دينار إلى أجل، فإذا حلت قال المدين: بعني سلعة ثمنها مائة دينار نقدا بمائة وخمسين إلى أجل، فهذا بيع لا يصلح، لأنه يعطيه ثمن ما باعه ويؤخر المائة الأولى، ويزداد خمسين دينارا في تأخيره", en: "Muwatta 1967", es: "Muwatta 1967", fr: "Muwatta 1967", ur: "موطا 1967", tr: "El-Muvatta 1967 — Malik: Bir adamın başka bir adamdan yüz dinarlık bir borcu varsa ve bu borç daha sonraki bir tarihte ödenecekse, vadesi geldiğinde borçlu şöyle derse: \"Bana yüz dinar değerindeki bir malı nakit olarak yüz elli dinara sat, daha sonraki bir tarihte ödeyeceğim.\" Bu satış geçersizdir, çünkü borçlu sattığı malın bedelini vermiş ve ilk yüz dinarı ertelemiş, gecikme için borca elli dinar daha eklemiştir.", id: "Al-Muwatta 1967 — Malik: Jika seseorang mempunyai hutang seratus dinar dari orang lain, yang harus dibayar di kemudian hari, dan ketika tanggal jatuh tempo tiba, si debitur berkata: \"Jual kepadaku barang senilai seratus dinar secara tunai seharga seratus lima puluh dinar yang harus dibayar di kemudian hari,\" maka penjualan ini tidak sah karena ia memberikan harga barang yang dijualnya dan menunda pembayaran seratus dinar pertama, serta menambahkan lima puluh dinar pada hutang tersebut sebagai kompensasi atas penundaan pembayaran." }
summary:
  ar: "قال مالك في الرجل يكون له على الرجل مائة دينار إلى أجل، فإذا حلت، قال له الذي عليه الدين: بعني سلعة يكون ثمنها مائة دينار نقدا، بمائة وخمسين إلى أجل. قال مالك: هذا بيع لا يصلح، ولم يزل أهل العلم ينهون عنه. وإنما كره ذلك لأنه إنما يعطيه ثمن ما باعه بعينه، ويؤخر عنه المائة الأولى إلى الأجل الذي ذكر له آخر مرة، ويزداد عليه خمسين دينارا في تأخيره عنه، فهذا مكروه لا يصلح. وهو يشبه حديث زيد بن أسلم في بيع أهل الجاهلية. {cite:muwatta-maruf-1997 p.205}"
  tr: "Malik, bir adamın bir başkasından daha sonraki bir tarihte yüz dinar alacağı olduğunu ve vade tarihi geldiğinde borçlunun ona, \"Bana yüz dinar değerindeki bir malı daha sonraki bir tarihte yüz elli dinara nakit olarak sat\" dediğini rivayet etmiştir. Malik, \"Bu geçersiz bir satıştır ve âlimler bunu her zaman yasaklamışlardır\" demiştir. Bunu hoş karşılamamasının sebebi, borçlunun esasen sattığı malın tam fiyatını alacaklıya vermesi, ilk yüz dinarı daha sonra belirtilen tarihe ertelemesi ve gecikme için elli dinar eklemesidir. Bu, kınanacak ve geçersiz bir satıştır. Bu, İslam öncesi dönemin satış uygulamalarıyla ilgili Zeyd ibn Aslam'ın hadisine benzer. {cite:muwatta-maruf-1997 s.205}"
  id: "Malik berkata tentang seorang pria yang berhutang seratus dinar kepada pria lain di kemudian hari, dan ketika tanggal jatuh tempo tiba, si debitur berkata kepadanya: \"Jual kepadaku barang senilai seratus dinar secara tunai seharga seratus lima puluh dinar di kemudian hari.\" Malik berkata: \"Ini adalah penjualan yang tidak sah, dan para ulama selalu melarangnya.\" Beliau tidak menyukainya karena pada dasarnya debitur memberikan kepada kreditur harga pasti barang yang dijualnya, sementara menunda pembayaran seratus dinar pertama hingga tanggal yang disebutkan terakhir, dan menambahkan lima puluh dinar untuk penundaan. Ini tercela dan tidak sah. Hal ini mirip dengan hadits Zayd ibn Aslam mengenai praktik penjualan di era pra-Islam. {cite:muwatta-maruf-1997 p.205}"
