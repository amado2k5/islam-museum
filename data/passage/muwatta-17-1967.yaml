label: { ar: "الموطأ 1967 — مالك: في الرجل يكون له على الرجل مائة دينار إلى أجل، فإذا حلت قال المدين: بعني سلعة ثمنها مائة دينار نقدا بمائة وخمسين إلى أجل، فهذا بيع لا يصلح، لأنه يعطيه ثمن ما باعه ويؤخر المائة الأولى، ويزداد خمسين دينارا في تأخيره", en: "Muwatta 1967" }
summary:
  ar: "قال مالك في الرجل يكون له على الرجل مائة دينار إلى أجل، فإذا حلت، قال له الذي عليه الدين: بعني سلعة يكون ثمنها مائة دينار نقدا، بمائة وخمسين إلى أجل. قال مالك: هذا بيع لا يصلح، ولم يزل أهل العلم ينهون عنه. وإنما كره ذلك لأنه إنما يعطيه ثمن ما باعه بعينه، ويؤخر عنه المائة الأولى إلى الأجل الذي ذكر له آخر مرة، ويزداد عليه خمسين دينارا في تأخيره عنه، فهذا مكروه لا يصلح. وهو يشبه حديث زيد بن أسلم في بيع أهل الجاهلية. {cite:muwatta-maruf-1997 p.205}"
