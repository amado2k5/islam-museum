text: "… فَلْيُعَلِّقْ أَوْ لِيُمْسِكْ. وقال ابن عمر : قرأ رسول اللّه لا أحمد:، وأبو داود:، ورجاله ثقات في قُبُلِ عِدْتِهِنْ انواع الطلاق من حيث الحل والحرمة نتضمَّن هذا الحكمُ أن الطلاقَ على أربعة أوجه : وجهانٍ حلال، ووجهان حرام. فالحلالان: أن …"
