label: { ar: "صحيح البخاري 4066 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4066 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4066 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4066 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 4066 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا عَبْدَانُ، أَخْبَرَنَا أَبُو حَمْزَةَ، عَنْ عُثْمَانَ بْنِ مَوْهَبٍ، قَالَ جَاءَ رَجُلٌ حَجَّ الْبَيْتَ فَرَأَى قَوْمًا جُلُوسًا فَقَالَ مَنْ هَؤُلاَءِ الْقُعُودُ قَالُوا هَؤُلاَءِ قُرَيْشٌ. قَالَ مَنِ الشَّيْخُ قَالُوا ابْنُ عُمَرَ. فَأَتَاهُ فَقَالَ إِنِّي سَائِلُكَ عَنْ شَىْءٍ أَتُحَدِّثُنِي، قَالَ أَنْشُدُكَ بِحُرْمَةِ هَذَا الْبَيْتِ أَتَعْلَمُ أَنَّ عُثْمَانَ بْنَ عَفَّانَ فَرَّ يَوْمَ أُحُدٍ قَالَ نَعَمْ. قَالَ فَتَعْلَمُهُ تَغَيَّبَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4066، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4066 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4066، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4066 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 4066 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
