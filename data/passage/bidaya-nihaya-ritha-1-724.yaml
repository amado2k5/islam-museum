text: "… كان مولده في سنة أربع وتسعين، فتوفي عن ثلاث وسبعين سنة، وقد نال العز عزا في الدنيا ورفعة هائلة، ومناصب وتداريس كبار، ثم عزل نفسه وتفرغ للعبادة والمجاورة بالحرمين الشريفين، فيقال له ما قلته في بعض المراثي. فكأنك قد أعلمت …"
summary:
