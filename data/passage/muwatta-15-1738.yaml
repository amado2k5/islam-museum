label: { ar: "الموطأ 1738 — مالك عن ابن شهاب مثل ذلك: عدة الأمة المتوفى عنها زوجها شهران وخمس ليال", en: "Muwatta 1738", es: "Muwatta 1738", fr: "Muwatta 1738", ur: "موطا 1738", tr: "El-Muvatta 1738 — Malik, İbn Şihab'dan rivayetle benzer bir şey söylemiştir: Kocası ölmüş bir cariyenin bekleme süresi iki ay beş gecedir.", id: "Al-Muwatta 1738 — Malik, berdasarkan riwayat Ibn Shihab, mengatakan hal serupa: Masa iddah seorang budak perempuan yang suaminya telah meninggal adalah dua bulan dan lima malam." }
summary:
  ar: "يروي مالك عن ابن شهاب مثل ذلك، أي أن عدة الأمة المتوفى عنها زوجها شهران وخمس ليال. {cite:muwatta-maruf-1997 p.109}"
  tr: "Malik, İbn Şihab'dan benzer bir rivayet aktarır; buna göre kocası ölmüş bir cariyenin bekleme süresi iki ay beş gecedir. {cite:muwatta-maruf-1997 s.109}"
  id: "Malik meriwayatkan hal serupa dari Ibn Shihab, yang berarti bahwa masa iddah bagi seorang budak perempuan yang suaminya telah meninggal adalah dua bulan dan lima malam. {cite:muwatta-maruf-1997 p.109}"
