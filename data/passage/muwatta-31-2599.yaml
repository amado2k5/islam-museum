  ar: "حدثني يحيى عن مالك عن عمرو مولى المطلب عن أنس بن مالك أن النبي طلع له أحد، فقال: هذا جبل يحبنا ونحبه. اللهم إن إبراهيم حرم مكة، وإني أحرم ما بين لابتيها. {cite:muwatta-maruf-1997 p.467}"
