label: { ar: "الموطأ 2599 — أنس بن مالك: النبي يحرم ما بين لابتي المدينة كما حرم إبراهيم مكة", en: "Muwatta 2599", es: "Muwatta 2599", fr: "Muwatta 2599", ur: "موطا 2599", tr: "El-Muvatta 2599 — Enes bin Malik: Peygamber, İbrahim'in Mekke'yi kutsal ilan ettiği gibi, Medine'nin iki lav ovası arasındaki bölgeyi de kutsal ilan etmiştir.", id: "Al-Muwatta 2599 — Anas bin Malik: Nabi menyatakan daerah di antara dua ladang lava Madinah sebagai tempat suci, sebagaimana Ibrahim menyatakan Mekah sebagai tempat suci." }
summary:
  ar: "حدثني يحيى عن مالك عن عمرو مولى المطلب عن أنس بن مالك أن النبي طلع له أحد، فقال: هذا جبل يحبنا ونحبه. اللهم إن إبراهيم حرم مكة، وإني أحرم ما بين لابتيها. {cite:muwatta-maruf-1997 p.467}"
  tr: "Yahya, Malik'ten, o da El-Muttalib'in azatlı kölesi Amr'dan, o da Enes ibn Malik'ten rivayet ederek bana, Peygamberin Uhud Dağı'nı gördüğünü ve şöyle buyurduğunu naklettiğini aktardı: “Bu dağ bizi sever ve biz de onu severiz. Ey Allah’ım, İbrahim Mekke’yi kutsal kıldı, ben de onun iki lav ovası arasında kalan yeri kutsal kılıyorum.” {cite:muwatta-maruf-1997 s.467}"
  id: "Yahya meriwayatkan kepadaku dari Malik, dari Amr, budak yang dibebaskan oleh Al-Muttalib, dari Anas ibn Malik, bahwa Nabi melihat Gunung Uhud dan berkata: “Ini adalah gunung yang mencintai kita dan kita mencintainya. Ya Allah, Ibrahim menyucikan Mekah, dan aku menyucikan apa yang terletak di antara dua ladang lavanya.” {cite:muwatta-maruf-1997 p.467}"
