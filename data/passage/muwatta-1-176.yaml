label: { ar: "الموطأ 176 — أبو سعيد الخدري: ارفع صوتك بالنداء فكل من سمعه يشهد لك", en: "Muwatta 176" }
text: "لا يسمع مدى صوت المؤذن جن ولا إنس ولا شيء إلا شهد له يوم القيامة"
summary:
  ar: "يرويه مالك عن عبد الرحمن بن عبد الله بن عبد الرحمن بن أبي صعصعة الأنصاري المازني عن أبيه، في باب ما جاء في النداء للصلاة: قال له أبو سعيد الخدري إنه يراه يحب الغنم والبادية، فإذا كان في غنمه أو باديته وأذّن للصلاة فليرفع صوته، فإنه لا يسمع مدى صوت المؤذن جن ولا إنس ولا شيء إلا شهد له يوم القيامة، وأخبر أبو سعيد أنه سمع ذلك من النبي. ويخرّجه المحقق عند البخاري (609، 3296، 7548) والنسائي (2/12) وأحمد والشافعي والبيهقي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.116} {cite:muwatta-maruf-1997 p.117}"
