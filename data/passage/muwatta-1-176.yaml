label: { ar: "الموطأ 176 — أبو سعيد الخدري: ارفع صوتك بالنداء فكل من سمعه يشهد لك", en: "Muwatta 176", es: "Muwatta 176", fr: "Muwatta 176", ur: "موطا 176", tr: "El-Muvatta 176 — Ebu Said El-Hudri: Çağırırken sesinizi yükseltin, çünkü onu duyan herkes sizin için şahitlik edecektir.", id: "Al-Muwatta 176 — Abu Saeed Al-Khudri: Tinggikan suaramu ketika berseru, karena setiap orang yang mendengarnya akan menjadi saksi bagimu." }
text: "لا يسمع مدى صوت المؤذن جن ولا إنس ولا شيء إلا شهد له يوم القيامة"
summary:
  ar: "يرويه مالك عن عبد الرحمن بن عبد الله بن عبد الرحمن بن أبي صعصعة الأنصاري المازني عن أبيه، في باب ما جاء في النداء للصلاة: قال له أبو سعيد الخدري إنه يراه يحب الغنم والبادية، فإذا كان في غنمه أو باديته وأذّن للصلاة فليرفع صوته، فإنه لا يسمع مدى صوت المؤذن جن ولا إنس ولا شيء إلا شهد له يوم القيامة، وأخبر أبو سعيد أنه سمع ذلك من النبي. ويخرّجه المحقق عند البخاري ⁦(609، 3296، 7548)⁩ والنسائي (2/12) وأحمد والشافعي والبيهقي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.116} {cite:muwatta-maruf-1997 p.117}"
  tr: "Malik, ezanla ilgili rivayetler bölümünde, Abdurrahman ibn Abdullah ibn Abdurrahman ibn Abi Sa'sa'ah el-Ensari el-Mazini'den, babasından rivayetle şöyle nakletmiştir: Ebu Sa'id el-Hudri ona, Peygamber'in koyunları ve çölü sevdiğini gördüğünü söyledi. Bu yüzden, eğer koyunlarıyla birlikte veya çölde ise ve ezan okursa, sesini yükseltmelidir; çünkü kıyamet gününde müezzinin sesinin duyulduğu mesafedeki hiçbir cin, insan veya başka bir şey onun için şahitlik etmekten geri kalmayacaktır. Ebu Sa'id bunu Peygamber'den işittiğini rivayet etmiştir. Bu hadis, Malik'in sahabelerinin rivayet zincirleriyle Buhari (609, 3296, 7548), Nesai (2/12), Ahmed, Şafiî ve Beyhaki'nin hadis külliyatlarında da bulunmaktadır. {cite:muwatta-maruf-1997 s.116} {cite:muwatta-maruf-1997 s.117}"
  id: "Malik meriwayatkannya dari Abdur-Rahman ibn Abdullah ibn Abdur-Rahman ibn Abi Sa'sa'ah al-Ansari al-Mazini, dari ayahnya, dalam bab tentang apa yang telah diriwayatkan mengenai seruan azan: Abu Sa'id al-Khudri berkata kepadanya bahwa ia melihat beliau (Nabi) mencintai domba dan padang pasir. Maka, jika beliau sedang bersama dombanya atau di padang pasir dan mengumandangkan azan (seruan azan), hendaknya beliau meninggikan suaranya, karena tidak ada jin, manusia, atau apa pun yang berada dalam jangkauan suara muazin yang akan gagal menjadi saksi baginya pada Hari Kiamat. Abu Sa'id melaporkan bahwa ia mendengar ini dari Nabi. Hadits ini juga ditemukan dalam kumpulan hadits al-Bukhari (609, 3296, 7548), an-Nasa'i (2/12), Ahmad, ash-Shafi'i, dan al-Bayhaqi, melalui sanad para sahabat Malik. {cite:muwatta-maruf-1997 p.116} {cite:muwatta-maruf-1997 p.117}"
