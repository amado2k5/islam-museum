label: { ar: "المطالب العالية 3100 — القرآن يشتمل على علم الأولين والآخرين", en: "al-Matalib al-Aliya 3100 — the Qur'an contains the knowledge of the first and the last", es: "al-Matalib al-Aliya 3100 — El Corán contiene el conocimiento del primero y del último", fr: "al-Matalib al-Aliya 3100 — Le Coran contient la connaissance du premier et du dernier", ur: "المطلب العالیہ 3100 - قرآن میں اول و آخر کا علم ہے" }
summary:
  ar: "أثر عن عبد الله بن مسعود، رواه مُسَدَّد عن يحيى القطان عن شعبة عن أبي إسحاق عن مرة، في أن من أراد العلم فليتدبر القرآن لأن فيه علم الأولين والآخرين. أورده ابن حجر في باب اشتمال القرآن على الأحكام، وهو الباب 36 في كتاب العلم. حكم المحقق قاسم القاسم على إسناده بأن أبا إسحاق السبيعي مدلس وقد اختلط، لكن شعبة انتقى من حديثه فأُمن تدليسه، وأنه روى عنه قبل الاختلاط؛ ونقل عن الهيثمي أن الطبراني رواه بأسانيد أحدها رجال الصحيح، وعن البوصيري في الإتحاف أنه ذكره وقال إن مسدداً رواه موقوفاً. الألفاظ والتخريج عند المحقق على طريق عبد الله بن أحمد في زوائد الزهد، والطبراني في الكبير، والخطيب في الفقيه والمتفقه."
  en: "A report from Abd Allah ibn Mas'ud, transmitted by Musaddad from Yahya from Shu'ba from Abu Ishaq from Murra, that whoever seeks knowledge should reflect on the Qur'an, because it holds the knowledge of the first and the last. Ibn Hajar places it in the chapter on the Qur'an containing the rulings (chapter 36, in the Book of Knowledge). The editor Qasim al-Qasim notes that Abu Ishaq al-Sabi'i was a mudallis who later became confused, but Shu'ba selected from his reports and so his tadlis is safe; the editor cites al-Haythami saying al-Tabarani transmitted it with chains one of whose men are those of the sahih, and al-Busayri in al-Ittihaf saying Musaddad transmitted it as a saying of Ibn Mas'ud (mawquf). The editor's takhrij lists Abd Allah ibn Ahmad in Zawa'id al-Zuhd, al-Tabarani in al-Kabir and al-Khatib in al-Faqih wal-Mutafaqqih."
  es: "Un informe de Abd Allah ibn Mas'ud, transmitido por Musaddad de Yahya de Shu'ba de Abu Ishaq de Murra, dice que quien busca conocimiento debe reflexionar sobre el Corán, porque contiene el conocimiento del primero y del último. Ibn Hajar lo coloca en el capítulo sobre el Corán que contiene los preceptos (capítulo 36, en el Libro del Conocimiento). El editor Qasim al-Qasim señala que Abu Ishaq al-Sabi'i era un mudallis que luego se confundió, pero Shu'ba seleccionó de sus informes y por lo tanto su tadlis es seguro; el editor cita a al-Haythami diciendo que al-Tabarani lo transmitió con cadenas uno de cuyos hombres son los sahih, y al-Busayri en al-Ittihaf diciendo que Musaddad lo transmitió como un dicho de Ibn Mas'ud (mawquf). El takhrij del editor enumera a Abd Allah ibn Ahmad en Zawa'id al-Zuhd, al-Tabarani en al-Kabir y al-Khatib en al-Faqih wal-Mutafaqqih."
  fr: "D'après un hadith rapporté par Abd Allah ibn Mas'ud et transmis par Musaddad d'après Yahya d'après Shu'ba d'après Abu Ishaq d'après Murra, quiconque recherche la science doit méditer sur le Coran, car il contient la science du commencement et de la fin. Ibn Hajar le place dans le chapitre du Coran contenant les règles (chapitre 36, du Livre de la Science). L'éditeur Qasim al-Qasim note qu'Abu Ishaq al-Sabi'i était un mudallis qui a ensuite perdu la notion du temps, mais que Shu'ba a sélectionné parmi ses hadiths, ce qui garantit la validité de sa transmission. L'éditeur cite également al-Haythami, qui rapporte qu'al-Tabarani l'a transmis avec des chaînes de transmission dont l'un des membres est reconnu comme authentique, et al-Busayri, dans al-Ittihaf, qui indique que Musaddad l'a transmis comme un hadith d'Ibn Mas'ud (mawquf). Le takhrij de l'éditeur répertorie Abd Allah ibn Ahmad dans Zawa'id al-Zuhd, al-Tabarani dans al-Kabir et al-Khatib dans al-Faqih wal-Mutafaqqih."
  ur: "عبد اللہ بن مسعود سے روایت ہے جسے مسدد نے یحییٰ سے شعبہ سے ابواسحاق سے مرہ سے نقل کیا ہے کہ جو کوئی علم حاصل کرے اسے چاہیے کہ وہ قرآن میں غور کرے کیونکہ اس میں اول و آخر کا علم ہے۔ ابن حجر نے اسے احکام پر مشتمل قرآن کے باب میں ⁦(باب 36، کتاب العلم میں)⁩ رکھا ہے۔ مدیر قاسم القاسم نوٹ کرتے ہیں کہ ابو اسحاق السبیعی مدلس تھے جو بعد میں الجھن میں پڑ گئے، لیکن شعبہ نے اپنی رپورٹوں سے انتخاب کیا اور اس لیے ان کی تدلیس محفوظ ہے۔ مدیر نے الہیثمی کا حوالہ دیا ہے کہ طبرانی نے اسے زنجیروں کے ساتھ نقل کیا ہے جن میں سے ایک صحیح ہے اور البصیری نے التحف میں کہا ہے کہ مسدد نے اسے ابن مسعود ⁦(موقف)⁩ کے قول کے طور پر نقل کیا ہے۔ مدیر تخریج نے زوائد الزہد میں عبد اللہ بن احمد، الکبیر میں الطبرانی اور الفقہ والمتفقہ میں الخطیب کو درج کیا ہے۔"
