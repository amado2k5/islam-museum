label: { ar: "صحيح مسلم 7228 — الحساب", en: "Sahih Muslim 7228 — the reckoning", ur: "صحیح مسلم 7228 — حساب" }
text: "وَحَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ بِشْرٍ، حَدَّثَنِي يَحْيَى، - وَهُوَ الْقَطَّانُ - عَنْ عُثْمَانَ بْنِ، الأَسْوَدِ عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ قَالَ \" مَنْ نُوقِشَ الْحِسَابَ هَلَكَ \". ثُمَّ ذَكَرَ بِمِثْلِ حَدِيثِ أَبِي يُونُسَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 7228، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 7228 (The Book of Paradise, its Description, its Bounties and its Inhabitants), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 7228، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
