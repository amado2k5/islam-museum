label: { ar: "الموطأ 1533 — مالك: الأمر عندنا في الحرة يتوفى عنها زوجها فتعتد أربعة أشهر وعشرا، فإن ارتابت من حيضتها لا تنكح حتى تستبرئ نفسها", en: "Muwatta 1533", es: "Muwatta 1533", fr: "Muwatta 1533", ur: "موطا 1533", tr: "El-Muvatta 1533 — Malik: Kocası ölen hür bir kadın hakkında hükmümüz şudur: Dört ay on gün bekleme süresi vardır. Eğer adet görmesi konusunda şüpheleri varsa, temizliğini tespit edene kadar evlenemez.", id: "Al-Muwatta 1533 — Malik: Hukum kami mengenai wanita merdeka yang suaminya meninggal adalah bahwa ia harus menjalani masa iddah selama empat bulan sepuluh hari. Jika ia ragu tentang haidnya, ia tidak boleh menikah sampai ia memastikan kesuciannya." }
summary:
  ar: "يقول مالك الأمر عندنا في المرأة الحرة يتوفى عنها زوجها، فتعتد أربعة أشهر وعشرا، إنها لا تنكح إن ارتابت من حيضتها، حتى تستبرئ نفسها من تلك الريبة، إذا تخافت الحمل. {cite:muwatta-maruf-1997 p.43}"
  tr: "Malik, geleneğimizde özgür bir kadının kocası öldüğünde dört ay on gün beklemesi gerektiğini söylüyor. Adet döngüsüyle ilgili şüpheleri varsa, özellikle hamilelikten şüpheleniyorsa, bu şüphelerin ortadan kalktığından emin olana kadar evlenemez. {cite:muwatta-maruf-1997 s.43}"
  id: "Malik mengatakan bahwa dalam tradisi kita, jika suami seorang wanita merdeka meninggal, dia harus menjalani masa tunggu selama empat bulan sepuluh hari. Dia tidak dapat menikah jika dia ragu tentang menstruasinya sampai dia memastikan tidak adanya keraguan tersebut, terutama jika dia mencurigai kehamilan. {cite:muwatta-maruf-1997 p.43}"
