label: { ar: "الموطأ 2089 — مالك: فيمن اشترى حق شريكه، فقال أحد الشركاء: أنا آخذ بالشفعة بقدر حصتي، وقال المشتري: إن شئت أن تأخذ الشفعة كلها أسلمتها إليك، وإن شئت أن تدع فدع: فليس للشفيع إلا أن يأخذ الشفعة كلها أو يسلمها", en: "Muwatta 2089", es: "Muwatta 2089", fr: "Muwatta 2089", ur: "موطا 2089", tr: "Al-Muwatta 2089 — Malik: Bir ortağın hakkını satın alan kişi hakkında, ortaklardan biri şöyle derse: \"Öncelik hakkını kendi payım kadar alacağım.\" Alıcı da şöyle derse: \"Öncelik hakkının tamamını almak istersen sana devrederim, bırakmak istersen bırak.\" Öncelik alan kişinin ya öncelik hakkının tamamını alması ya da devretmesi gerekir.", id: "Al-Muwatta 2089 — Malik: Mengenai seseorang yang membeli hak mitranya, dan salah satu mitra berkata: Saya akan mengambil hak prioritas pembelian sesuai dengan bagian saya, dan pembeli berkata: Jika Anda ingin mengambil seluruh hak prioritas pembelian, saya akan menyerahkannya kepada Anda, dan jika Anda ingin meninggalkannya, maka tinggalkanlah: pihak yang mengambil hak prioritas pembelian tidak punya pilihan selain mengambil seluruh hak prioritas pembelian atau menyerahkannya." }
summary:
  ar: "قال مالك: فأما أن يشتري رجل من رجل من شركائه حقه، فيقول أحد الشركاء: أنا آخذ من الشفعة بقدر حصتي، ويقول المشتري: إن شئت أن تأخذ الشفعة كلها أسلمتها إليك، وإن شئت أن تدع فدع: فإن المشتري إذا خيره في هذا وأسلمه إليه، فليس للشفيع إلا أن يأخذ الشفعة كلها، أو يسلمها إليه. فإن أخذها فهو أحق بها، وإلا فلا شيء له فيها. {cite:muwatta-maruf-1997 p.254} {cite:muwatta-maruf-1997 p.255}"
  tr: "Malik şöyle demiştir: Bir kişi bir ortağın payını diğerinden satın alırsa ve ortaklardan biri, \"Öncelik hakkımın payını alacağım\" derse ve alıcı, \"Öncelik hakkının tamamını almak istersen sana veririm, bırakmak istersen bırak\" derse, eğer alıcı ona bu seçeneği sunar ve payı verirse, öncelik hakkı sahibi ya tüm payı almak ya da ona vermek zorundadır. Eğer alırsa, o paya sahip olur; aksi takdirde, hiçbir hakkı olmaz. {cite:muwatta-maruf-1997 s.254} {cite:muwatta-maruf-1997 s.255}"
  id: "Malik berkata: Jika seseorang membeli saham mitra dari orang lain, dan salah satu mitra berkata, \"Saya akan mengambil bagian saya dari hak prioritas,\" dan pembeli berkata, \"Jika Anda ingin mengambil seluruh hak prioritas, saya akan memberikannya kepada Anda, dan jika Anda ingin meninggalkannya, maka tinggalkanlah,\" maka jika pembeli memberikan pilihan ini kepadanya dan memberikannya kepadanya, maka pemegang hak prioritas tidak punya pilihan selain mengambil seluruh hak prioritas atau memberikannya kepadanya. Jika dia mengambilnya, maka dia memiliki hak atasnya; jika tidak, dia tidak memiliki hak atasnya. {cite:muwatta-maruf-1997 p.254} {cite:muwatta-maruf-1997 p.255}"
