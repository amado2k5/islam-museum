text: "ما أخبرت به، وموافقته لما معهم. فإن قيل: إن كثيرا من أهل الكتاب من اليهود والنصارى، بل ربما كان أكثرهم ومعظمهم كذبوا رسول الله وعاندوه، وردوا عليه دعوته. والله تعالى أمر رسوله أن يستشهد بهم، وجعل شهادتهم حجة لما جاء"
