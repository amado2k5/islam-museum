  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 785 کا اقتباس جس میں فریضہ اور فرائض، واجب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
