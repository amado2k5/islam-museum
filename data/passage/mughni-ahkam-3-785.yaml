text: "… تَجِدَهُ صَامَتْ، ثُمْ فصل المرأة تحرم بواجب فيحلف زوجها بالطلاق الثلاث أن لا نحج العام وَإِنْ أَحْرَمَتْ بِوَاجِبٍ، فَحَلَفَ زَوْجُهَا بالطَّلاق الثَّلاثِ أَنْ لا تَحُجَّ الْعَامَ، فَلَيْسَ لَهَا أَنْ تَحِلَّ؛ لأَنَ الطَّلاقَ مُبَاحٌ، فَلَيْنَ لَهَا تَرْكَ فَرِيضَةِ اللهِ. خَوْفاً مِنْ …"
summary:
