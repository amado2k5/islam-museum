text: "… أبي، ثنا عبد اللّٰه بن يزيد المقرئ، ثنا سعيد - يعني: ابن أبي أيوب - حدثني ابن عجلان، عن القَعقَاع بن حكيم، عن أبي صالح، عن أبي هريرة صيعنه، قال: قال رسول اللّٰه ويف: أكملُ المؤمنين إيمانًا أحسنهم خُلُقًا. - …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 361، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 361, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 361 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
