text: "… تزوجت امرأة وهذان ابناها واذا دخلت المدينة فقال احدهم بإنصرانى وقيل لولدي وامهم كذلك لاوالله لا افعل فقلت له قد كنت قارئا للقرآن فقال اى والله قد كنت من اقرأ القراء للقرآن فقلت فا قى معك من القرآن قال لاشئ …"
