text: "… مهدي بن عبد اللّٰه بن جميع، عن خارجة بن عقفان، وهو والد زيد بن خارجة الذي تكلم بعد الموت. عن أبيها، عن أجدادها حتّى بلغت خارجة بن عقفان، أنه أتى النَّبيّ للفي لمم مرض، فجعل يعرق فقالتِ فاطمة : - …"
