text: "عن قيس بن السكن، أَن ابن مسعود قال : إنكم نزلتم أَرضاً لا يقصب بها المسلمون، إنما هم النبط، وفارس، فإذا اشتريتم لحماً فسَلُوا، فإن كان ذبيحة يهودي، أَو نصراني فكلوه. فإن طعامهم لكم حلٌّ. - قال عبد الرزاق : …"
