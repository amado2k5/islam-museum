text: "… وراء النهر وأوائل بلاد المغرب، وأوائل بلاد الهند. فكان سوق الجهاد قائماً في القرن الأول من بعد الهجرة إلى انقضاء دولة بني أمية وفي أثناء خلافة بني العباس مثل أيام المنصور وأولاده، والرشيد وأولاده، في بلاد الروم والترك والهند. وقد …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 5، ص 100، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 5, p. 100, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 5، ص 100 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
