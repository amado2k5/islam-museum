label: { ar: "مسلم 2699 — من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة", en: "Muslim 2699 — Whoever travels a path seeking knowledge, God eases for him a path to Paradise" }
text: "قال رسول الله: «ومن سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة، وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة وغشيتهم الرحمة وحفتهم الملائكة»"
summary:
  ar: "رواية أبي هريرة في كتاب الذكر من صحيح مسلم؛ جامع يبدأ بتفريج الكرب ويمر بطلب العلم ومجالس تلاوة القرآن — من أجلّ نصوص فضل العلم."
