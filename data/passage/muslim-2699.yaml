label: { ar: "مسلم 2699 — من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة", en: "Muslim 2699 — Whoever travels a path seeking knowledge, God eases for him a path to Paradise", es: "Muslim 2699 — Quien recorre un camino en busca de conocimiento, Dios le facilita el camino al Paraíso.", fr: "Muslim 2699 — Quiconque emprunte un chemin en quête de connaissance, Dieu lui facilite le chemin du Paradis", ur: "مسلم 2699 - جو شخص علم کی تلاش میں کسی راستے پر نکلے اللہ تعالیٰ اس کے لیے جنت کا راستہ آسان کر دیتا ہے۔", tr: "Müslim 2699 — Kim ilim öğrenmek için yola koyulursa, Allah ona cennete giden yolu kolaylaştırır.", id: "Muslim 2699 — Barangsiapa menempuh jalan untuk mencari ilmu, maka Allah akan memudahkan jalannya menuju surga." }
text: "قال رسول الله: «ومن سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة، وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة وغشيتهم الرحمة وحفتهم الملائكة»"
summary:
  ar: "رواية أبي هريرة في كتاب الذكر من صحيح مسلم؛ جامع يبدأ بتفريج الكرب ويمر بطلب العلم ومجالس تلاوة القرآن — من أجلّ نصوص فضل العلم."
  tr: "Sahih Müslim'deki Hatırat Kitabı'nda Ebu Hurayra'nın rivayeti; sıkıntıyı gidermekle başlayan ve bilgi arayışını ve Kur'an okumak için bir araya gelmeyi içeren bir derlemedir; Kur'an, bilginin faziletine dair en önemli metinlerden biridir."
  id: "Riwayat Abu Hurairah dalam Kitab Zikir dari Sahih Muslim; sebuah kumpulan yang dimulai dengan menghilangkan kesusahan dan mencakup mencari ilmu serta perkumpulan untuk membaca Al-Qur'an — salah satu teks terpenting tentang keutamaan ilmu."
