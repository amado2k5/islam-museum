label: { ar: "سنن ابن ماجه 2598 — الأب والأبوة", en: "Sunan Ibn Majah 2598 — the father and fatherhood", ur: "سنن ابن ماجہ 2598 — باپ اور والدیت", es: "Sunan Ibn Majah 2598 — El padre y la paternidad", fr: "Sunan Ibn Majah 2598 — Le père et la paternité" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مَيْمُونٍ الرَّقِّيُّ، وَأَيُّوبُ بْنُ مُحَمَّدٍ الْوَزَّانُ، وَعَبْدُ اللَّهِ بْنُ سَعِيدٍ، قَالُوا حَدَّثَنَا مُعَمَّرُ بْنُ سُلَيْمَانَ، أَنْبَأَنَا الْحَجَّاجُ بْنُ أَرْطَاةَ، عَنْ عَبْدِ الْجَبَّارِ بْنِ وَائِلٍ، عَنْ أَبِيهِ، قَالَ اسْتُكْرِهَتِ امْرَأَةٌ عَلَى عَهْدِ رَسُولِ اللَّهِ فَدَرَأَ عَنْهَا الْحَدَّ وَأَقَامَهُ عَلَى الَّذِي أَصَابَهَا. وَلَمْ يَذْكُرْ أَنَّهُ جَعَلَ لَهَا مَهْرًا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2598، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2598 (The Chapters on Legal Punishments), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2598، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2598 (Capítulos sobre castigos legales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2598 (Chapitres relatifs aux peines légales), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
