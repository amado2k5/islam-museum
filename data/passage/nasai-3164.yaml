ref: "3164"
label:
  ar: "النسائي 3164 — الشهداء والمتوفون على فرشهم في الذين يموتون بالطاعون"
  en: "Nasa'i 3164 — The martyrs and those who died in bed dispute over the plague dead"
  ur: "نسائی 3164 — شہدا اور بستر پر وفات پانے والے طاعون سے مرنے والوں کے بارے میں"
  es: "Nasa'i 3164 — Los mártires y los que murieron en cama se disputan a los muertos por la peste."
  fr: "Nasa'i 3164 — Les martyrs et ceux qui sont morts dans leur lit se disputent au sujet des morts de la peste"
  tr: "Kadınlar 3164 — Şehitler ve vebadan ölenler arasında yataklarında ölenler"
  id: "Perempuan 3164 — Para martir dan mereka yang meninggal di tempat tidur di antara mereka yang meninggal karena wabah"
text: "يختصم الشهداء والمتوفون على فرشهم إلى ربنا في الذين يتوفون من الطاعون فيقول الشهداء إخواننا قتلوا كما قتلنا . ويقول المتوفون على فرشهم إخواننا ماتوا على فرشهم كما متنا فيقول ربنا انظروا إلى جراحهم فإن أشبه جراحهم جراح المقتولين فإنهم …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 3164: الشهداء والمتوفون على فرشهم في الذين يموتون بالطاعون. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 3164: The martyrs and those who died in bed dispute over the plague dead. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 3164: شہدا اور بستر پر وفات پانے والے طاعون سے مرنے والوں کے بارے میں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 3164: Los mártires y los que murieron en cama disputan sobre los muertos por la peste. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan an-Nasa'i, n° 3164: Les martyrs et ceux qui sont morts en couches se disputent au sujet des victimes de la peste. Le Prophète rapporte ce hadith de son Seigneur; le navigateur de hadiths qudsi rassemble les narrations issues des six livres et de la Muwatta."
  tr: "Sunan-ı Nesai'de 3164 numaralı hadis-i kudsi şöyledir: \"Şehitler ve yataklarında ölenler, vebadan ölenler arasındadır.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 3164: \"Para syuhada dan orang-orang yang meninggal di tempat tidur mereka termasuk di antara orang-orang yang meninggal karena wabah.\" Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta."
