label:
  ar: "النسائي 3164 — الشهداء والمتوفون على فرشهم في الذين يموتون بالطاعون"
  en: "Nasa'i 3164 — The martyrs and those who died in bed dispute over the plague dead"
  ur: "نسائی 3164 — شہدا اور بستر پر وفات پانے والے طاعون سے مرنے والوں کے بارے میں"
text: "يختصم الشهداء والمتوفون على فرشهم إلى ربنا في الذين يتوفون من الطاعون فيقول الشهداء إخواننا قتلوا كما قتلنا . ويقول المتوفون على فرشهم إخواننا ماتوا على فرشهم كما متنا فيقول ربنا انظروا إلى جراحهم فإن أشبه جراحهم جراح المقتولين فإنهم …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 3164: الشهداء والمتوفون على فرشهم في الذين يموتون بالطاعون. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 3164: The martyrs and those who died in bed dispute over the plague dead. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 3164: شہدا اور بستر پر وفات پانے والے طاعون سے مرنے والوں کے بارے میں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
