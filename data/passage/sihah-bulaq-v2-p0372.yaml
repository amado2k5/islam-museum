text: |-
  : *⁦(باب اللام)⁩.
  ٢١٥٠
  الضرب السريع رفع إليد والعذل الناقة السريعة قال الاعشى
  وقد أقطع الجوز جوز القلا * : بالحزة البازل العذل
  والنون زائدة (لسقل العلتريع العاقيل وهى السراب ولم أسمع بواحده وقال
  كعب
  عيرانة كانات الضحل ناجية * اذا ترقص بالقور العساقيل
  والصاقيل شرب من الكمأة الواحدعول وقال
  واقد جنيتك أكوا وعساقلا * ولقد نهيتك عن بذات الاوبر
  وهى الكمرة الكار البيض بقال لهاشحمة الارض وقال
  وأغبر فل منيف الزيا • عليه العساقيل مثل الشحم
  وعستلان مدينة وهعروص الشأم صل لعصل واحد الاعصال وهى الاعقاج عن
  الاصححى وأتسدلابى النهيم يرمى يه الجرع الى أعصالها• والعصل النواء في عسيب الذنب
  حتى يبدوبعض بالمنه الذى لاشعر عليه والعصل جع عصلة وهى شجرة اذا أكل البعبر منها
  لمحته تسليحا وقال • كسلاح النيب يا كلن العصل * وقال لبدد
  وقبيل من عقيل صادق * كليوث بين غاب وعصل
  وناب أعصل بين العصل أى معوج شديد ويقال للرجل المعوج الساق أعصل وشهرة عملة
  عوجاء ومهام عصل معوجة والمعصل بالتديد السهم الذى يلتوى اذارى به والعنصل
  البصل البرى والعفصلاء والعنصلا« مثل والمع العناصلى وه والدى يسمية الاطباء الاسقال
  ويكون منه خلّ عن ابن اسرافيون والعنصلى موضع ويقال للرجل اذاضل- أخذ فى طريق
  العنصلين وطريق العنصل هو طريق: من المامة الى البصرة ضل لعضلة بالضم الهداهية
  يقال إنِه لعضلة من العضل أعداهية من الدواهى والعضل الجرد قال أيونصر العضلان
  الجرذان والعضر بإلتهريك جمع عضلة الساق وكل لجن مجتمعة مكتنزة فى عصبة فهى عضلة وقد
  عضل الرحل بالكسرفه وعضل ويز العضل اذا كان كثير العضل وعضل قبيلة وهو عضلديز
  الهون بن خزيعة أخو الديس وهما القارة وداء عضال وأمر عضال أى شديدا عا الاطباء
  وأعضلنى فلان أى أعيافى أمره . وقسد أعضلى الامر اشتدواستغلق وأمر معضل لا يهتدى
  لوجهه والمعضلات الشدائد الاصمعى يقال عضل الرجل أيمه إذا منعها من التزويج يعضل
  ويعضل عضلا وعضلت عليه أعضيلا اذا ضيقت عليه في أمره وجات بينه وبين ما بريد
  وعضلت الشاة تعضيلا اذانشب الولد فلم يسهل مخرجه وكذلك المرأوهى شاة معضلة
  ومعضل أيضايلاهاء وغتممعاضيل وعضلت الارض بأهلهاعضت قال أوس
  وى الارض منا بالفضاه مريضة • معضلة منابحش عر حرم
  وقول الشاعر
  كانْ زمامهاأيم شجاع • ترامى في عصون معضل
  من قولهم !
  إعضألت الشجرة بالهمز اذا كثرت أغصانها والتفت ⁦( طل)⁩ العطل الشخصر
  ثل الطال يقال ما أحسن عطله أي بطِاطه وتمامه والعطل الشَّهراخ صشماريخ التخله
  والعطل أيضامصدر عطات المرأة وتعطات اذاخلا حمدها من القسلائد فهى عطل بالضه
  وعاطل ومعطال وقديستعمل العطل في الجلومن السوان كأن أصله فى الحلى يقال عطل
  قوله الاسقال يعنى بكسر الهمزة
  وبالسين كما في القاموس
