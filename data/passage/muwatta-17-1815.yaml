label: { ar: "الموطأ 1815 — مالك: إنما تباع العرايا بخرصها من التمر، يتحرى ذلك ويخرص في رؤوس النخل، وليست لها مكيلة، وإنما رخص فيها لأنها بمنزلة التولية والإقالة والشركة", en: "Muwatta 1815" }
summary:
  ar: "قال مالك: وإنما تباع العرايا بخرصها من التمر، يتحرى ذلك ويخرص في رءوس النخل، وليست له مكيلة. وإنما أرخص فيه لأنه أنزل بمنزلة التولية والإقالة والشرك. ولو كان بمنزلة غيره من البيوع، ما أشرك أحد أحدا في طعام حتى يستوفيه، ولا أقاله منه، ولا ولاه أحدا حتى يقبضه المبتاع. {cite:muwatta-maruf-1997 p.143}"
