label: { ar: "الموطأ 1815 — مالك: إنما تباع العرايا بخرصها من التمر، يتحرى ذلك ويخرص في رؤوس النخل، وليست لها مكيلة، وإنما رخص فيها لأنها بمنزلة التولية والإقالة والشركة", en: "Muwatta 1815", es: "Muwatta 1815", fr: "Muwatta 1815", ur: "موطا 1815", tr: "Al-Muwatta 1815 — Malik: Al-`Araya, hurma veriminin tahminiyle satılır. Bu, hurma ağaçlarının tepelerinde belirlenir ve tahmin edilir. Hacimle ölçülmez. Sadece devir, iptal ve ortaklık sözleşmesine benzer olduğu için izin verilir.", id: "Al-Muwatta 1815 — Malik: Al-`Araya dijual dengan memperkirakan hasil panen kurmanya. Ini ditentukan dan diperkirakan di puncak pohon kurma. Bukan diukur berdasarkan volume. Hal ini hanya diperbolehkan karena mirip dengan kontrak pengalihan, pembatalan, dan kemitraan." }
summary:
  ar: "قال مالك: وإنما تباع العرايا بخرصها من التمر، يتحرى ذلك ويخرص في رءوس النخل، وليست له مكيلة. وإنما أرخص فيه لأنه أنزل بمنزلة التولية والإقالة والشرك. ولو كان بمنزلة غيره من البيوع، ما أشرك أحد أحدا في طعام حتى يستوفيه، ولا أقاله منه، ولا ولاه أحدا حتى يقبضه المبتاع. {cite:muwatta-maruf-1997 p.143}"
  tr: "Malik şöyle dedi: “Olgunlaşmamış hurmalar, hurma ağaçlarındaki verimleri tahmin edilerek satılıyor. Bu, hurma ağaçlarının tepelerindeki miktarın tahmin edilmesiyle yapılıyor ve bunun için herhangi bir ölçüm cihazı yok. Bu, devir, iptal veya ortaklık yoluyla yapılan satışa benzer kabul edildiği için izin veriliyor. Eğer diğer satışlar gibi olsaydı, kimse yiyeceği teslim alana kadar başkasıyla paylaşmazdı, iptal etmezdi veya alıcı teslim alana kadar başkasına devretmezdi.” {cite:muwatta-maruf-1997 s.143}"
  id: "Malik berkata: “Kurma mentah dijual dengan memperkirakan hasil panennya di pohon kurma. Ini dilakukan dengan memperkirakan jumlah di puncak pohon kurma, dan tidak ada alat ukur untuk itu. Hal ini diperbolehkan karena dianggap analog dengan penjualan melalui pendelegasian, pembatalan, atau kemitraan. Jika seperti penjualan lainnya, tidak seorang pun akan mengizinkan orang lain untuk berbagi makanan sampai mereka memilikinya, mereka juga tidak akan membatalkannya, atau mendelegasikannya kepada orang lain sampai pembeli memilikinya.” {cite:muwatta-maruf-1997 p.143}"
