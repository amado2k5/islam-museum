label: { ar: "الموطأ 1746 — مالك: لا يعزل الرجل المرأة الحرة إلا بإذنها، ولا بأس أن يعزل عن أمته بغير إذنها، ومن كانت تحته أمة قوم فلا يعزل إلا بإذنهم", en: "Muwatta 1746", es: "Muwatta 1746", fr: "Muwatta 1746", ur: "موطا 1746", tr: "El-Muvatta 1746 — Malik: Bir erkek, özgür bir kadınla ancak onun izniyle cinsel ilişkiyi yarıda kesebilir; cariyesiyle ise onun izni olmadan cinsel ilişkiyi yarıda kesmesinde bir sakınca yoktur. Bir kimsenin bir topluluğa ait cariyesi varsa, onların izni olmadan cinsel ilişkiyi yarıda kesebilir.", id: "Al-Muwatta 1746 — Malik: Seorang pria tidak boleh melakukan coitus interruptus dengan wanita merdeka kecuali dengan izinnya, dan tidak ada salahnya melakukan coitus interruptus dengan budak perempuannya tanpa izinnya. Dan siapa pun yang mempunyai budak perempuan milik suatu kaum tidak boleh melakukan coitus interruptus kecuali dengan izin mereka." }
summary:
  ar: "قال مالك: لا يعزل الرجل المرأة الحرة إلا بإذنها، ولا بأس أن يعزل عن أمته بغير إذنها، ومن كانت تحته أمة قوم فلا يعزل إلا بإذنهم. {cite:muwatta-maruf-1997 p.112}"
  tr: "Malik şöyle dedi: Bir erkek, özgür bir kadınla ancak onun izniyle cinsel ilişkiyi yarıda kesebilir; fakat köle kızıyla onun izni olmadan cinsel ilişkiyi yarıda kesmesinde bir sakınca yoktur. Eğer bir erkeğin bir topluluğa ait bir köle kızı varsa, onların izni olmadan cinsel ilişkiyi yarıda kesebilir. {cite:muwatta-maruf-1997 s.112}"
  id: "Malik berkata: Seorang pria tidak boleh melakukan coitus interruptus dengan wanita merdeka kecuali dengan izinnya, tetapi tidak ada salahnya melakukannya dengan budak perempuannya tanpa izinnya. Dan jika seorang pria memiliki budak perempuan yang menjadi milik sekelompok orang, ia tidak boleh melakukan coitus interruptus kecuali dengan izin mereka. {cite:muwatta-maruf-1997 p.112}"
