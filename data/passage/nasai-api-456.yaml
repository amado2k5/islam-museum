label: { ar: "سنن النسائي 456 — ما فُرض على الناس", en: "Sunan al-Nasa'i 456 — what was made obligatory on people", ur: "سنن نسائی 456 — جو لوگوں پر فرض کیا گیا", fr: "Sunan al-Nasa'i 456 — ce qui a été imposé aux gens", es: "Sunan al-Nasa'i 456 — lo que se impuso a la gente", tr: "Sunan an-Nasa'i 456 — İnsanlar üzerine farz olan şeyler", id: "Sunan an-Nasa'i 456 — Apa yang wajib dilakukan oleh manusia" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا يَحْيَى، وَعَبْدُ الرَّحْمَنِ، قَالاَ حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ بُكَيْرِ بْنِ الأَخْنَسِ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ فُرِضَتِ الصَّلاَةُ عَلَى لِسَانِ النَّبِيِّ فِي الْحَضَرِ أَرْبَعًا وَفِي السَّفَرِ رَكْعَتَيْنِ وَفِي الْخَوْفِ رَكْعَةً."
summary:
  ar: "حديث في سنن النسائي، رقم 456، يرد فيه ذكر ما فُرض على الناس. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 456 (The Book of Salah), whose wording mentions what was made obligatory on people. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 456، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 456, dont le texte mentionne ce qui a été imposé aux gens. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 456, cuyo texto menciona lo que se impuso a la gente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de yer alan 456 numaralı hadis, insanların farz olan şeylerden bahsetmektedir. Bu hadis, farz olan görevleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları ele alan bir araştırmacı tarafından derlenmiştir. Araştırmacı, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile onların haleflerinin bu konulardaki rivayetlerinden alıntılar yapmıştır. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 456, menyebutkan apa yang wajib dilakukan oleh manusia. Hadits ini disusun oleh seorang peneliti yang membahas kewajiban-kewajiban, amalan-amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
