label: { ar: "صحيح البخاري 5691 — الحجامة، اللدود والسعوط", en: "Sahih al-Bukhari 5691 — cupping; medicine given by the mouth-side or the nose", ur: "صحیح بخاری 5691 — حجامہ، لدود اور سعوط" }
text: "حَدَّثَنَا مُعَلَّى بْنُ أَسَدٍ، حَدَّثَنَا وُهَيْبٌ، عَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍما ـ عَنِ النَّبِيِّ احْتَجَمَ وَأَعْطَى الْحَجَّامَ أَجْرَهُ وَاسْتَعَطَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5691، يذكر الحجامة، واللدود والسعوط. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5691 (Medicine), that mentions cupping, medicine given by the mouth-side or the nose. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5691، جس میں حجامہ، لدود اور سعوط کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
