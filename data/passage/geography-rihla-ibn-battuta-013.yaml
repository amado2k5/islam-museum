text: "معني، وقبر أويس القرني، وقبركعب الأحبار رضياللهعنهما، ووجدت في كتاب املعلمفيشرحصحيحمسلمللقرطبي: أنجماعةمن الصحابةصحبهم أويس القرنيمن املدينة إلى الشام،فتوفيفي أثناء الطريقفيبرية لاعمارةفيها ولاماء،فتحري وا في أمره،فنزلوافوجدواحنوطا وكفنا وماء،فعجبوامن ذلك وغسلوه وكفنوه وصل وا عليه ودفنوه،ثم ركبوا،فقالبعضهم:كيفنتركقبرهبغريعلامة؟فعادواللموضع فلميجدواللقبرمن أثر،قال ابنجزي: ويقال: إن"
