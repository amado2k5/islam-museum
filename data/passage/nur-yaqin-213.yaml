  tr: "Peygamber Efendimiz'in biyografisinde yer alan Nur el-Yakin'den, Necran yazışmalarından, alıntılanan versiyondan bir bölüm; metin, kaynakların politikasına göre yaklaşık kırk kelimeyle aktarılmıştır."
