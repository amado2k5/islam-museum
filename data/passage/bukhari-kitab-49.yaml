summary:
  ar: "القسم 49 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العتق»، ويضم فيها النصوص من 2517 إلى 2559 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 49 of Sahih al-Bukhari (Manumission of Slaves) in the division of the open hadith dataset the museum took its reports from: reports 2517 to 2559 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 49، عنوان «کتاب العتق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2517 تا 2559۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 49 de Sahih al-Bukhari (Manumisión de esclavos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2517 al 2559 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du Sahih al-Bukhari (Livre 49, « L’affranchissement des esclaves »), dans la partie ouverte du recueil de hadiths d’où proviennent les récits 2517 à 2559. Le musée classe ces récits sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 49. bölümü \"Kurtuluş Kitabı\" başlığını taşımakta olup, 2517'den 2559'a kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 49 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pembebasan\" dan berisi teks 2517 hingga 2559, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
