label: { ar: "الموطأ 2536 — عمرو بن شعيب: قتادة المدلجي وسراقة بن جعتم وإبل الدية", en: "Muwatta 2536" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عمرو بن شعيب أن رجلا من بني مدلج يقال له قتادة حذف ابنه بالسيف فأصاب ساقه، فنُزف في جرحه فمات. فقدم سراقة بن جعتم على عمر بن الخطاب فذكر له ذلك، فقال له عمر: اعدد على ماء قديد مائة وعشرين بعيرا حتى أقدم عليك. فلما قدم أخذ منها ثلاثين حقة، وثلاثين جذعة، وأربعين خلفة، ثم قال: أين أخو المقتول؟ قال: ها أنذا. قال: خذها، فإن رسول الله قال: ليس لقاتل شيء. {cite:muwatta-maruf-1997 p.438} {cite:muwatta-maruf-1997 p.439}"
