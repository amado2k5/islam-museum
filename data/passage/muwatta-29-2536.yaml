summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عمرو بن شعيب أن رجلا من بني مدلج يقال له قتادة حذف ابنه بالسيف فأصاب ساقه، فنُزف في جرحه فمات. فقدم سراقة بن جعتم على عمر بن الخطاب فذكر له ذلك، فقال له عمر: اعدد على ماء قديد مائة وعشرين بعيرا حتى أقدم عليك. فلما قدم أخذ منها ثلاثين حقة، وثلاثين جذعة، وأربعين خلفة، ثم قال: أين أخو المقتول؟ قال: ها أنذا. قال: خذها، فإن رسول الله قال: ليس لقاتل شيء. {cite:muwatta-maruf-1997 p.438} {cite:muwatta-maruf-1997 p.439}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Amr ibn Şuayb'dan rivayet eder ki, Beni Mudlij kabilesinden Katada adında bir adam oğlunu kılıçla vurmuş, bacağından yaralamış. Oğlu yaradan kan kaybetti ve öldü. Sürakah ibn Ca'tam, Ömer ibn el-Hattab'a gelip bunu anlattı. Ömer ona, \"Ben sana gelene kadar Kudayd su kaynağında yüz yirmi deve say\" dedi. Sürakah geldiğinde otuz dişi deve, otuz dişi deve ve kırk gebe dişi deve aldı. Sonra, \"Öldürülen adamın kardeşi nerede?\" diye sordu. Sürakah, \"İşte buradayım\" dedi. \"Onları alın,\" dedi, \"çünkü Allah'ın Resulü şöyle buyurmuştur: 'Katilin hiçbir payı yoktur.'\" {cite:muwatta-maruf-1997 s.438} {cite:muwatta-maruf-1997 s.439}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari 'Amr ibn Shu'ayb, bahwa seorang pria dari Banu Mudlij, bernama Qatada, menebas anaknya dengan pedang, mengenai kakinya. Anak itu berdarah dari luka tersebut dan meninggal. Suraqah ibn Ja'tam datang kepada 'Umar ibn al-Khattab dan menceritakan hal itu kepadanya. 'Umar berkata kepadanya, \"Hitung seratus dua puluh unta di tempat minum Qudayd sampai aku datang kepadamu.\" Ketika dia tiba, dia mengambil tiga puluh unta betina, tiga puluh unta betina, dan empat puluh unta betina bunting. Kemudian dia berkata, \"Di mana saudara laki-laki orang yang terbunuh itu?\" Dia berkata, \"Aku di sini.\" Dia berkata, \"Ambillah mereka, karena Rasulullah SAW bersabda, 'Pembunuh tidak mendapat bagian.'\" {cite:muwatta-maruf-1997 p.438} {cite:muwatta-maruf-1997 p.439}"
