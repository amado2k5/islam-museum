summary:
  ar: "القسم 34 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب البيوع»، ويضم فيها النصوص من 2047 إلى 2238 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 34 of Sahih al-Bukhari (Sales and Trade) in the division of the open hadith dataset the museum took its reports from: reports 2047 to 2238 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 34، عنوان «کتاب البیوع»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2047 تا 2238۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 34 de Sahih al-Bukhari (Ventas y Comercio) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2047 al 2238, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 34 du Sahih al-Bukhari (Commerce et Ventes), dans la section du recueil ouvert de hadiths: les hadiths 2047 à 2238 de cette numérotation. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 34. bölümü \"Satış Kitabı\" başlığını taşımakta olup, 2047 ile 2238 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 34 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Penjualan\" dan berisi teks 2047 hingga 2238, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
