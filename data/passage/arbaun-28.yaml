text: "أوصيكم بتقوى الله، والسمع والطاعة وإن تأمر عليكم عبد، وإنه من يعش منكم بعدي فسيرى اختلافاً كثيراً، فعليكم بسنتي وسنة الخلفاء الراشدين المهديين، عضوا عليها بالنواجذ، وإياكم ومحدثات الأمور، فإن كل بدعة ضلالة"
summary:
  ar: "حديث العرباض بن سارية قال: وعظنا رسول الله موعظة وجلت منها القلوب وذرفت منها العيون فقلنا كأنها موعظة مودع فأوصنا — وهو الحديث الثامن والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه أبو داود (4607) والترمذي (2676) وقال حسن صحيح وابن ماجه والإمام أحمد من رواية ثور بن يزيد عن خالد بن معدان عن عبد الرحمن بن عمرو السلمي وحجر بن حجر الكلاعي عنه، وقال الحافظ أبو نعيم هو حديث جيد من صحيح حديث الشاميين ولم يتركه الشيخان من جهة إنكار، وزعم الحاكم أن سبب تركهما توهمهما أن ليس له راو عن خالد بن معدان غير ثور بن يزيد وقد رواه عنه بحير بن سعد ومحمد بن إبراهيم التيمي وغيرهما — ورد ابن رجب ذلك بأن الحديث ليس على شرطهما إذ لم يخرجا لعبد الرحمن بن عمرو ولا لحجر شيئاً وليسا ممن اشتهر بالعمل والرواية؛ وروي عن خالد عن ابن أبي بلال عن العرباض، وفي طريق ضمرة بن حبيب زيادة «فقد تركتكم على البيضاء ليلها كنهارها لا يزيغ عنها بعدي إلا هالك» وزيادة «فإنما المؤمن كالجمل الأنف حيثما قيد انقاد» التي أنكرها طائفة من الحفاظ — منهم أحمد بن صالح المصري — وقالوا هي مدرجة وليست من الحديث وكان أسد بن وداعة يزيدها؛ ولابن ماجه طريق عبد الله بن العلاء بن زبر عن يحيى بن أبي المطاع سمعت العرباض في الظاهر إسناد جيد متصل وقد ذكره البخاري في التاريخ إلا أن حفاظ أهل الشام أنكروا سماع يحيى من العرباض وقالوا لم يلقه — منهم أبو زرعة الدمشقي عن دحيم — وعند ابن رجب أن البخاري يقع له أوهام في أخبار أهل الشام وهؤلاء أعرف بشيوخهم، وروي من حديث بريدة وإسناده لا يثبت؛ وفي شرحه أن «فسيرى اختلافاً كثيراً» إخبار بما وقع في الأمة بعده من كثرة الاختلاف في الأصول والفروع موافق لما روي من افتراق الأمة على بضع وسبعين، وأن الأمر بالسمع والطاعة وإن تأمر عليكم عبد استشهد له بأن الأئمة من قريش عند أنس وهو حديث صحيح وحديث علي عند الحاكم بإسناد جيد وإن روي موقوفاً وقال الدارقطني هو أشبه، وقيل إن ذكر العبد الحبشي على وجه ضرب المثل؛ وفي «عضوا عليها بالنواجذ» كناية عن شدة التمسك والنواجذ الأضراس؛ ووصف الخلفاء بالراشدين لأنهم عرفوا الحق وقضوا به فالراشد ضد الغاوي وقيل المهديين أي يهديهم الله للحق ولا يضلهم فالأقسام ثلاثة: راشد عرف الحق واتبعه وغاو عرفه ولم يتبعه وضال لم يعرفه بالكلية؛ وفي «إياكم ومحدثات الأمور فإن كل بدعة ضلالة» تحذير من اتباع الأمور المحدثة المبتدعة والمراد بالبدعة ما أحدث مما لا أصل له في الشريعة يدل عليه فأما ما كان له أصل من الشرع يدل عليه فليس ببدعة شرعاً وإن كان بدعة لغة، وفي صحيح مسلم عن جابر أن النبي كان يقول في خطبته «شر الأمور محدثاتها وكل بدعة ضلالة»، وخرج الترمذي وابن ماجه من حديث كثير بن عبد الله المزني — وفيه ضعف شديد نص عليه ابن حبان وقال الشافعي ركن من أركان الكذب — «من ابتدع بدعة ضلالة كان عليه وزرها ووزر من عمل بها» ⁦(جامع العلوم والحكم ص 581–601)⁩."
  en: "The hadith of al-Irbad ibn Sariya that the Messenger of God admonished them with an admonition at which hearts trembled and eyes wept, so they said it was like a parting admonition and asked for counsel — the twenty-eighth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Abu Dawud (4607) and al-Tirmidhi (2676, graded hasan sahih), Ibn Majah and the Imam Ahmad through Thawr ibn Yazid from Khalid ibn Ma'dan from Abd al-Rahman ibn Amr al-Sulami and Hujr ibn Hujr al-Kila'i from him; al-Hafiz Abu Nu'aym called it a good hadith among the soundest of the Syrians and held the two Shaykhs did not drop it out of rejection, while al-Hakim claimed their reason was a supposition that Thawr was Khalid's only transmitter — though Bahir ibn Sa'd and Muhammad ibn Ibrahim al-Taymi also carry it — which Ibn Rajab counters: the hadith is not on their condition anyway, for neither narrated anything from Abd al-Rahman ibn Amr nor Hujr, men not famed for practice and transmission; it also comes through Khalid from Ibn Abi Bilal from al-Irbad, and the Damra ibn Habib route adds 'I have left you upon the white way whose night is as its day; none swerves from it after me but is destroyed', plus 'the believer is like the familiar camel — wherever it is led it follows', an addition a group of memorisers — Ahmad ibn Salih al-Misri among them — denounced as interpolated and attributed to Asad ibn Wada'a's insertion; Ibn Majah's route through Abdullah ibn al-Ala' ibn Zabr from Yahya ibn Abi al-Muta' with explicit hearing from al-Irbad is outwardly a fine connected chain, noted in al-Bukhari's Tarikh, yet the Syrian memorisers — Abu Zur'a al-Dimashqi reporting from Duhaym — denied Yahya ever met al-Irbad, and Ibn Rajab observes al-Bukhari does make slips in Syrian reports where these men know their own shaykhs better; the Burayda route does not stand; in the commentary, 'you will see much disagreement' is foretelling of what befell the community in roots and branches, matching the seventy-odd sects reports; the command to hear and obey even should a slave be set over them is supported by 'the imams are of Quraysh' from Anas — a sound hadith — and Ali's report in al-Hakim with a good chain though transmitted halted, preferred so by al-Daraqutni, some saying the Abyssinian slave is mentioned only by way of example; 'bite on it with the molar teeth' is a figure for firmest adherence, nawajidh being the back teeth; the Rightly Guided are so named for knowing the truth and judging by it — rashid being the contrary of ghawi, who knows the truth and acts otherwise — while 'guided' (mahdiyyin) means God guides them to the truth and does not lead them astray, giving three classes: the guided who knows and follows, the deviant who knows and does not, and the astray who does not know at all; and 'beware of newly introduced matters, for every innovation is error' warns the community against following invented matters, innovation meaning what is introduced with no foundation in the Law to indicate it — whatever has a basis in the Law is no innovation legally though it may be linguistically — with Jabir's sermon report in Sahih Muslim 'the worst of matters are their novelties, and every innovation is error', and the Tirmidhi–Ibn Majah route through the weak Kathir ibn Abdullah al-Muzni — called a pillar of lying by al-Shafi'i — for 'whoever invents a misleading innovation bears its burden and the burden of whoever acts on it' (Jami' al-Ulum wal-Hikam pp. 581–601)."
  es: "El hadiz de al-Irbad ibn Sariya que el Mensajero de Dios los amonestó con una amonestación en la que los corazones temblaron y los ojos lloraron, por lo que dijeron que era como una amonestación de despedida y pidieron consejo —el vigésimo octavo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Abu Dawud (4607) y al-Tirmidhi (2676, clasificado hasan sahih), Ibn Majah y el Imam Ahmad a través de Thawr ibn Yazid de Khalid ibn Ma'dan de Abd al-Rahman ibn Amr al-Sulami y Hujr ibn Hujr al-Kila'i de él; al-Hafiz Abu Nu'aym lo llamó un buen hadiz entre los más sólidos de los sirios y sostuvo que los dos jeques no lo descartaron por rechazo, mientras que al-Hakim afirmó que su razón era una suposición de que Thawr era el único transmisor de Khalid —aunque Bahir ibn Sa'd y Muhammad ibn Ibrahim al-Taymi también lo transmiten— lo cual Ibn Rajab refuta: el hadiz no está en su condición de todos modos, ya que ninguno narró nada de Abd al-Rahman ibn Amr ni de Hujr, hombres no famosos por la práctica y la transmisión; también llega a través de Khalid de Ibn Abi Bilal de al-Irbad, y la ruta de Damra ibn Habib agrega 'Te he dejado en el camino blanco cuya noche es como su día; nadie se desvía de ella después de mí sin ser destruido', además de 'el creyente es como el camello familiar: dondequiera que se le lleve, lo sigue', una adición que un grupo de memorizadores, entre ellos Ahmad ibn Salih al-Misri, denunció como interpolada y atribuida a la inserción de Asad ibn Wada'a; la ruta de Ibn Majah a través de Abdullah ibn al-Ala' ibn Zabr desde Yahya ibn Abi al-Muta' con una escucha explícita de al-Irbad es externamente una cadena bien conectada, señalada en el Tarikh de al-Bukhari, sin embargo, los memorizadores sirios, Abu Zur'a al-Dimashqi informando de Duhaym, negaron que Yahya alguna vez se encontrara con al-Irbad, e Ibn Rajab observa que al-Bukhari comete errores en los informes sirios donde estos hombres conocen mejor a sus propios shaykhs; la ruta de Burayda no se sostiene; En el comentario, \"verás mucha discordia\" es una premonición de lo que le sucedió a la comunidad en sus raíces y ramas, coincidiendo con los informes de las más de setenta sectas; el mandato de escuchar y obedecer incluso si se les pone un esclavo encima está respaldado por \"los imanes son de Quraysh\" de Anas —un hadiz auténtico— y el informe de Ali en al-Hakim con una buena cadena aunque transmitida interrumpida, preferida así por al-Daraqutni, algunos dicen que el esclavo abisinio se menciona solo a modo de ejemplo; \"muérdelo con los molares\" es una figura para la adhesión más firme, siendo nawajidh los molares; Los Bien Guiados son llamados así por conocer la verdad y juzgar por ella —siendo rashid lo contrario de ghawi, que conoce la verdad y actúa de otra manera— mientras que 'guiado' (mahdiyyin) significa que Dios los guía a la verdad y no los extravía, dando tres clases: el guiado que sabe y sigue, el desviado que sabe y no hace, y el extraviado que no sabe en absoluto; y 'cuidado con los asuntos recién introducidos, pues toda innovación es un error' advierte a la comunidad contra seguir asuntos inventados, entendiendo por innovación aquello que se introduce sin fundamento en la Ley que lo indique; todo lo que tiene una base en la Ley no es una innovación legal, aunque pueda serlo lingüísticamente. Con el informe del sermón de Jabir en Sahih Muslim: \"lo peor de los asuntos son sus novedades, y toda innovación es un error\", y la ruta Tirmidhi-Ibn Majah a través del débil Kathir ibn Abdullah al-Muzni —llamado pilar de la mentira por al-Shafi'i— porque \"quien inventa una innovación engañosa carga con su peso y con el de quien actúa en consecuencia\" (Jami' al-Ulum wal-Hikam pp. 581-601)."
  fr: "Le hadith d'al-Irbad ibn Sariya selon lequel le Messager de Dieu les a exhortés par une admonition qui a fait trembler les cœurs et pleurer les yeux, de sorte qu'ils ont dit que c'était comme une admonition d'adieu et ont demandé conseil — le vingt-huitième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Abu Dawud (4607) et al-Tirmidhi (2676, classé hasan sahih), Ibn Majah et l'Imam Ahmad par Thawr ibn Yazid de Khalid ibn Ma'dan d'Abd al-Rahman ibn Amr al-Sulami et Hujr ibn Hujr al-Kila'i de lui; Al-Hafiz Abu Nu'aym le qualifia de bon hadith parmi les plus solides des Syriens et affirma que les deux cheikhs ne l'avaient pas abandonné par rejet, tandis qu'al-Hakim prétendait que leur raison était une supposition que Thawr était le seul transmetteur de Khalid — bien que Bahir ibn Sa'd et Muhammad ibn Ibrahim al-Taymi le transmettent également — ce qu'Ibn Rajab réfute: le hadith ne répond pas à leurs conditions de toute façon, car aucun des deux n'a rien rapporté d'Abd al-Rahman ibn Amr ni de Hujr, hommes peu réputés pour leur pratique et leur transmission; il vient également de Khalid d'Ibn Abi Bilal d'al-Irbad, et la voie de Damra ibn Habib ajoute: « Je vous ai laissés sur la voie blanche dont la nuit est comme son jour; « Nul ne s'en écarte après moi sans périr », et « le croyant est comme le chameau familier: où qu'on le mène, il suit », une addition qu'un groupe de mémorisateurs – dont Ahmad ibn Salih al-Misri – a dénoncée comme une interpolation et attribuée à Asad ibn Wada'a; la chaîne transmise par Ibn Majah via Abdullah ibn al-Ala' ibn Zabr, depuis Yahya ibn Abi al-Muta', avec une transmission explicite d'al-Irbad, semble en apparence bien cohérente, comme le mentionne le Tarikh d'al-Bukhari. Pourtant, les mémorisateurs syriens – Abu Zur'a al-Dimashqi rapportant de Duhaym – ont nié que Yahya ait jamais rencontré al-Irbad, et Ibn Rajab observe qu'al-Bukhari commet effectivement des erreurs dans les récits syriens, notamment lorsque ces hommes connaissent mieux leurs propres cheikhs; la voie de Burayda ne tient pas. Dans le commentaire, l'affirmation « vous verrez de nombreux désaccords » prédit ce qui est arrivé à la communauté à tous les niveaux, correspondant aux récits des quelque soixante-dix sectes; l'ordre d'écouter et d'obéir même si un esclave est placé à leur tête est appuyé par « les imams sont de Quraysh » d'après Anas — un hadith authentique — et par le récit d'Ali dans al-Hakim avec une bonne chaîne de transmission, bien que transmise de manière interrompue, comme le préfère al-Daraqutni, certains disant que l'esclave abyssin n'est mentionné qu'à titre d'exemple; « mordez-le avec les molaires » est une image pour l'adhésion la plus ferme, nawajidh étant les dents du fond; Les bien guidés sont ainsi nommés parce qu'ils connaissent la vérité et jugent selon elle — rashid étant le contraire de ghawi, qui connaît la vérité et agit autrement — tandis que « guidé » (mahdiyyin) signifie que Dieu les guide vers la vérité et ne les égare pas, donnant trois classes: le guidé qui sait et suit, le déviant qui sait et ne le fait pas, et l'égaré qui ne sait pas du tout; et « méfiez-vous des choses nouvellement introduites, car toute innovation est une erreur » met en garde la communauté contre le fait de suivre des choses inventées, l'innovation signifiant ce qui est introduit sans fondement dans la Loi pour l'indiquer — ce qui a une base dans la Loi n'est pas une innovation juridiquement, même si cela peut l'être linguistiquement — avec le rapport du sermon de Jabir dans Sahih Muslim: « les pires choses sont leurs nouveautés, et toute innovation est une erreur », et la voie Tirmidhi–Ibn Majah à travers le faible Kathir ibn Abdullah al-Muzni — qualifié de pilier du mensonge par al-Shafi'i — pour « quiconque invente une innovation trompeuse en porte le fardeau et le fardeau de celui qui agit selon elle » (Jami' al-Ulum wal-Hikam pp. 581–601)."
  ur: "عرباد بن ساریہ کی حدیث ہے کہ رسول اللہ نے انہیں ایک ایسی نصیحت کی جس پر دل کانپ اٹھے اور آنکھیں روئیں، تو انہوں نے کہا کہ یہ ایک جدائی کی نصیحت کی طرح ہے اور نصیحت طلب کی ہے۔ ابوداؤد (4607) اور الترمذی ⁦(2676، درجہ حسن صحیح)⁩، ابن ماجہ اور امام احمد نے ثور بن یزید کے ذریعے خالد بن معدن سے عبدالرحمٰن بن عمرو السلمی سے اور حجر ابن حجر الکلیٰ سے روایت کی ہے۔ حافظ ابو نعیم نے اسے شامیوں میں سب سے زیادہ صحیح حدیث قرار دیا اور کہا کہ دونوں شیوخ نے اسے رد نہیں کیا، جبکہ الحاکم نے دعویٰ کیا کہ ان کا یہ قیاس تھا کہ ثور ہی خالد کا واحد نقل کرنے والا تھا - حالانکہ بحر بن سعد اور محمد بن ابراہیم التیمی نے اس کی شرط نہیں رکھی تھی - جس پر ان کے راجح کی شرط نہیں ہے: بہرحال، کیونکہ نہ تو عبدالرحمٰن بن عمرو اور نہ ہی حجر سے کچھ روایت کیا ہے، وہ لوگ جو عمل اور نشر و اشاعت کے لیے مشہور نہیں ہیں۔ یہ بھی خالد کے ذریعے ابن ابی بلال سے العرباد سے آتا ہے، اور دمرہ ابن حبیب کا راستہ یہ ہے کہ میں نے تمہیں اس سفید راستے پر چھوڑا ہے جس کی رات دن کی طرح ہے۔ میرے بعد کوئی بھی اس سے نہیں ہٹتا بلکہ ہلاک ہو جاتا ہے، نیز 'مومن مانوس اونٹ کی طرح ہوتا ہے - جہاں بھی اسے لے جایا جاتا ہے وہ اس کے پیچھے چلتا ہے'، اس کے علاوہ حافظوں کے ایک گروہ - احمد بن صالح المصری ان میں سے - نے اس کی تردید کی اور اسد بن وداع کے اندراج سے منسوب کیا؛ ابن ماجہ کا عبداللہ ابن الاعلٰی ابن زبر سے یحییٰ بن ابی المطا کی طرف سے العرباد سے صریح سماعت کے ساتھ راستہ ظاہری طور پر ایک عمدہ جڑا ہوا سلسلہ ہے، جسے البخاری کی تاریخ میں ذکر کیا گیا ہے، پھر بھی شام کے حافظ ابو زرعہ الدمشقیہ دومشقی سے رپورٹ کرتے ہیں۔ العربد، اور ابن رجب نے مشاہدہ کیا ہے کہ البخاری شامی رپورٹوں میں پرچی بناتا ہے جہاں یہ لوگ اپنے شیخوں کو بہتر جانتے ہیں۔ بوریدا راستہ کھڑا نہیں ہے۔ تبصرے میں، 'آپ کو بہت زیادہ اختلاف نظر آئے گا' اس بات کی پیشین گوئی کر رہا ہے کہ جڑوں اور شاخوں میں کمیونٹی پر کیا گزری، ستر فرقوں کی رپورٹوں سے مماثل ہے۔ سننے اور اطاعت کرنے کے حکم کی جب ان پر غلام بھی مقرر ہو تو اس کی تائید انس کی 'امام قریش کے ہیں' سے ہوتی ہے - ایک صحیح حدیث - اور الحاکم میں علی کی روایت اچھی سند کے ساتھ ہے اگرچہ اسے روک دیا گیا ہے، جسے الدارقطنی نے ترجیح دی ہے، بعض کہتے ہیں کہ حبشی غلام کا ذکر صرف مثال کے طور پر کیا گیا ہے۔ 'اس پر داڑھ کے دانتوں سے کاٹنا' مضبوطی سے التزام کا ایک پیکر ہے، نواجد پچھلے دانتوں کی وجہ سے ہے۔ ہدایت یافتہ کو حق جاننے اور اس کے مطابق فیصلہ کرنے کے لیے نامزد کیا گیا ہے - راشد غوی کا مخالف ہے، جو حقیقت کو جانتا ہے اور دوسری صورت میں عمل کرتا ہے - جب کہ 'ہدایت یافتہ' ⁦(مہدیین)⁩ کا مطلب ہے کہ خدا ان کو حق کی طرف رہنمائی کرتا ہے اور انہیں گمراہ نہیں کرتا، تین طبقے دیتا ہے: ہدایت یافتہ جو جانتا ہے اور اس کی پیروی کرتا ہے، گمراہ جو جانتا ہے اور نہیں جانتا ہے؛ گمراہ اور نہیں جانتا۔ اور 'نئے متعارف شدہ امور سے بچو، کیونکہ ہر بدعت غلطی ہے' ایجاد شدہ امور کی پیروی کے خلاف برادری کو متنبہ کرتا ہے، بدعت کا مطلب ہے کہ جس چیز کی شریعت میں کوئی بنیاد نہ ہو اس کی نشاندہی کرنے کے لیے - جس چیز کی شریعت میں کوئی بنیاد ہے وہ قانونی طور پر بدعت نہیں ہے اگرچہ وہ لسانی طور پر ہو - صحیح مسلم میں جابر کے خطبہ کی رپورٹ کے ساتھ 'صحیح مسلم میں 'ہر بدعت ان کی خرابی اور بدعت ہے'۔ ترمذی-ابن ماجہ ضعیف کثیر بن عبداللہ المزنی کے ذریعے راستہ - جسے شافعی نے جھوٹ کا ستون کہا ہے - کیونکہ 'جو کوئی گمراہ کن بدعت ایجاد کرتا ہے اس کا بوجھ اور اس پر عمل کرنے والے کا بوجھ ہے' ⁦(جامع العلوم والحکم والحکمۃ ص 65)⁩۔"
  tr: "El-Arbad ibn Sariye'nin hadisi şöyledir: \"Allah Resulü bize öyle bir hutbe verdi ki, kalplerimiz titredi ve gözlerimiz yaşlarla doldu. Biz de 'Sanki bir veda hutbesi gibi, bize nasihat et' dedik.\" Bu hadis, El-Arba'in el-Nawawiyyah'da ve İbn Receb'in tefsirinde yirmi sekizinci hadistir. Ebu Davud (4607) ve Tirmizi (2676) tarafından sahih ve sağlam olduğu söylenmiştir. İbn Majah ve İmam Ahmed de, Sevr ibn Yezid'den, Halid ibn Ma'dan'dan, Abdurrahman ibn Amr el-Sulami'den ve Hacer ibn Hacer el-Kala'i'den rivayet etmiştir. Hafız Ebu Nu'aym, \"Bu, Suriyelilerin sahih hadislerinden sağlam bir hadistir ve iki şeyh de onu reddetme gerekçesiyle terk etmemiştir\" demiştir. El-Hakim, hadisi terk etmelerinin sebebinin, Halid ibn Ma'dan'ın rivayetinde Sevr ibn Yazid'den başka bir ravi olmadığına ve bu hadisin Buhayr ibn Sa'd, Muhammed ibn İbrahim el-Taymi ve diğerleri tarafından rivayet edildiğine dair yanlış bir inançtan kaynaklandığını iddia etti. İbn Receb ise, hadisin onların şartlarına göre olmadığını, çünkü Abdurrahman ibn Amr veya Hacer'in rivayetine dayalı hiçbir şey içermediklerini ve bunların amelleri ve rivayetleriyle ünlü kişiler arasında olmadıklarını söyleyerek bunu reddetti. Bu hadis, Halid'den, o da İbn Ebi Bilal'den, o da El-Arbad'dan rivayet edilmiştir ve Damra İbn Habib'in rivayetinde şu ekleme vardır: \"Sizi temiz yolda bıraktım, gecesi gündüzü gibidir ve benden sonra ondan sapacak kimse, helak olan kimsedir\" ve şu ekleme: \"Mümin, burnuna halka takılmış bir deveye benzer, nereye götürülürse oraya gider.\" Bu, aralarında Ahmed İbn Salih el-Mişri'nin de bulunduğu bir grup hadis âlimi tarafından reddedilmiş ve hadisin bir parçası değil, sonradan eklenmiş bir kısım olduğu söylenmiştir. Esad İbn Veda'ah bunu eklerdi. İbn Majah, Yahya İbn Abi el-Muta'dan rivayet edilen Abdullah İbn el-Ala' İbn Zebr'ın bir nakline dayanarak, \"El-Arbad'ı işittim\" dediğini aktarmıştır. Görünüşe göre, sağlam ve sürekli bir isnad zinciri vardır ve Buhari bunu tarih kitabında zikretmiştir. Ancak Suriye halkının hadis âlimleri, Yahya'nın El-Arbad'dan işittiğini reddetmiş ve onunla görüşmediğini söylemişlerdir; bunlar arasında Dahim'den rivayet edilen Ebu Zur'a el-Dimaşki de bulunmaktadır. İbn Receb, Buhari'nin Suriye halkının rivayetlerinde hatalar yaptığını ve bu insanların şeyhlerini daha iyi tanıdığını söylemiştir. Burayde'den rivayet edilmiş olup, isnad zinciri sağlam değildir. “Çok fazla ihtilaf görecektir” ifadesinin, kendisinden sonra gelen ümmette temel konularda ve mezheplerde yaşanan ihtilafların bolluğuna dair bir rapor olduğu, ümmetin yetmişten fazla mezhebe bölünmesiyle ilgili rivayetlere uygun olduğu ve “üzerinize bir köle bile atanmış olsa bile dinleme ve itaat etme” emrinin, Enes'e göre imamların Kureyş'ten olmasıyla desteklendiği, bunun sahih bir hadis olduğu ve El-Hakim'e göre Ali'nin hadisinin de iyi bir isnad zinciriyle rivayet edildiği, hatta bir Sahabenin sözü olarak rivayet edilmiş olsa bile, El-Daraqutni'nin daha muhtemel olduğunu söylediği ve Habeşli kölenin zikredilmesinin bir örnek olarak verildiği; ve “azı dişlerinizle ona sarılın” ifadesinin ise tutunmanın yoğunluğunun bir metaforu olduğu, azı dişlerinin ise dişler olduğu açıklanmaktadır. Halifeler, hakikati bildikleri ve ona göre hüküm verdikleri için doğru yolda olanlar olarak nitelendirilmişlerdir; dolayısıyla doğru yolda olanlar, sapkınların tam tersidir. Ve şöyle denmiştir: \"Doğru yolda olanlar\", Allah'ın onları hakikate yönlendirdiği ve sapkınlığa düşürmediği anlamına gelir; dolayısıyla üç kategori vardır: Hakikati bilen ve ona uyan doğru yolda olanlar, bilen ama uymayan sapkınlar ve hiç bilmeyenler. \"Yeni icat edilen şeylerden sakının, çünkü her bidat sapkınlıktır\" ayetinde, yeni icat edilen şeylere uymaya karşı bir uyarı vardır. Bidat ile kastedilen, Şeriatta dayanağı olmayan yeni icat edilmiş şeylerdir. Şeriatta dayanağı olan şeylere gelince, bunlar Şeriatta bidat sayılmaz, hatta dildeki bidat bile olsa. Sahih Müslim'de, Cabir'den rivayet edildiğine göre, Peygamberimiz hutbesinde şöyle buyurmuştur: \"En kötü şeyler yeni icat edilenlerdir ve her bidat sapkınlıktır.\" Tirmizi ve İbn Majah, Kathir bin Abdullah el-Muzani'den rivayet etmişlerdir -ki bu hadisin İbn Hibban'ın belirttiği gibi ciddi bir zaafı vardır ve Şafiî de bunun bir yalan direği olduğunu söylemiştir- \"Kim sapkın bir bidat ortaya atarsa, onun yükünü ve ona göre amel edenlerin yükünü de o bidatı çeker.\" (Cami' el-Ulum ve'l-Hikam, s. 581-601)."
  id: "Hadits Al-Arbad ibn Sariyah, yang berkata: Rasulullah SAW memberi kami khutbah yang membuat hati kami gemetar dan mata kami berlinang air mata, lalu kami berkata, “Seolah-olah itu adalah khutbah perpisahan, maka berilah kami nasihat.” — Ini adalah hadits ke-28 dalam Al-Arba’in Al-Nawawiyyah dan dalam tafsir Ibn Rajab. Hadits ini diriwayatkan oleh Abu Dawud (4607) dan Al-Tirmidhi (2676), yang mengatakan hadits ini baik dan sahih, dan oleh Ibn Majah dan Imam Ahmad, berdasarkan riwayat Thawr ibn Yazid, berdasarkan riwayat Khalid ibn Ma’dan, berdasarkan riwayat Abd Al-Rahman ibn Amr Al-Sulami dan Hajar ibn Hajar Al-Kala’i, berdasarkan riwayatnya. Al-Hafiz Abu Nu’aym berkata, “Ini adalah hadits yang baik dari hadits-hadits sahih kaum Suriah, dan kedua syekh itu tidak meninggalkannya dengan alasan penolakan.” Al-Hakim mengklaim bahwa alasan mereka meninggalkannya adalah karena keyakinan keliru mereka bahwa tidak ada perawi atas otoritas Khalid ibn Ma’dan selain Thawr ibn Yazid, dan hadits itu diriwayatkan atas otoritasnya oleh Buhayr ibn Sa’d, Muhammad ibn Ibrahim Al-Taymi, dan lainnya. — Ibn Rajab membantah hal itu dengan mengatakan bahwa hadits tersebut tidak sesuai dengan syarat mereka, karena mereka tidak memasukkan apa pun atas otoritas Abd Al-Rahman ibn Amr atau Hajar, dan mereka bukanlah termasuk orang-orang yang terkenal karena amal perbuatan dan riwayat mereka. Diriwayatkan dari Khalid, dari Ibnu Abi Bilal, dari Al-Arbad, dan dalam riwayat Damrah Ibnu Habib terdapat tambahan: “Aku telah meninggalkanmu di jalan yang terang, malamnya seperti siangnya, dan tidak seorang pun akan menyimpang darinya setelahku kecuali orang yang celaka,” dan tambahan: “Orang beriman itu seperti unta yang memakai cincin hidung, ke mana pun ia dibawa, ia akan mengikuti.” Hal ini ditolak oleh sekelompok penghafal—di antaranya Ahmad Ibnu Salih Al-Misri—dan mereka mengatakan itu adalah sisipan dan bukan bagian dari hadits. Asad Ibnu Wada’ah biasa menambahkannya. Ibnu Majah memiliki riwayat Abdullah Ibnu Al-Ala’ Ibnu Zabr dari Yahya Ibnu Abi Al-Muta’, yang berkata, “Aku mendengar Al-Arbad.” Tampaknya, riwayat ini memiliki sanad yang baik dan berkesinambungan, dan Al-Bukhari menyebutkannya dalam sejarahnya. Namun, para penghafal Al-Qur'an dari kalangan penduduk Suriah menyangkal bahwa Yahya mendengar dari Al-Arbad dan mengatakan bahwa ia tidak bertemu dengannya—di antara mereka Abu Zur’ah Al-Dimashqi berdasarkan riwayat Dahim. Ibn Rajab mengatakan bahwa Al-Bukhari membuat kesalahan dalam riwayat-riwayat dari penduduk Suriah, dan orang-orang ini lebih mengenal para syekh mereka. Riwayat ini berasal dari Buraydah, dan sanadnya tidak dapat dipastikan kebenarannya. Dalam menjelaskan bahwa “dia akan melihat banyak perbedaan pendapat” adalah laporan tentang apa yang terjadi di bangsa setelahnya dalam hal banyaknya perbedaan pendapat dalam hal-hal mendasar dan cabang-cabangnya, sesuai dengan apa yang diriwayatkan tentang bangsa yang terpecah menjadi tujuh puluh lebih sekte, dan bahwa perintah untuk mendengarkan dan menaati bahkan jika seorang budak diangkat atasmu didukung oleh fakta bahwa para imam berasal dari Quraisy menurut Anas, dan itu adalah hadits sahih, dan hadits Ali menurut Al-Hakim dengan sanad yang baik, meskipun diriwayatkan sebagai pernyataan seorang Sahabat, dan Al-Daraqutni mengatakan bahwa itu lebih mungkin, dan dikatakan bahwa penyebutan budak Abyssinia adalah dalam bentuk contoh; dan dalam “berpegang teguhlah padanya dengan gigi gerahammu” adalah metafora untuk intensitas berpegang teguh, dan gigi geraham adalah gigi. Para khalifah digambarkan sebagai orang yang mendapat petunjuk karena mereka mengetahui kebenaran dan menghakimi berdasarkan kebenaran tersebut, sehingga orang yang mendapat petunjuk adalah kebalikan dari orang yang sesat. Dikatakan bahwa orang-orang yang mendapat petunjuk berarti bahwa Allah membimbing mereka kepada kebenaran dan tidak menyesatkan mereka, sehingga kategorinya ada tiga: orang yang mendapat petunjuk, yang mengetahui kebenaran dan mengikutinya, orang yang sesat, yang mengetahuinya tetapi tidak mengikutinya, dan orang yang sesat, yang sama sekali tidak mengetahuinya; Dalam “Waspadalah terhadap perkara-perkara yang baru diciptakan, karena setiap bid'ah adalah kesesatan,” terdapat peringatan terhadap mengikuti perkara-perkara yang baru diciptakan. Yang dimaksud dengan bid'ah adalah perkara yang baru diciptakan yang tidak memiliki dasar dalam syariat untuk menunjukkannya. Adapun perkara yang memiliki dasar dalam syariat untuk menunjukkannya, itu bukanlah bid'ah dalam syariat, meskipun itu adalah bid'ah dalam bahasa. Dalam Sahih Muslim, dari Jabir, Nabi biasa mengatakan dalam khutbahnya, “Perkara yang paling buruk adalah perkara-perkara yang baru diciptakan, dan setiap bid'ah adalah kesesatan.” Al-Tirmidhi dan Ibn Majah meriwayatkan dari Kathir bin Abdullah Al-Muzani — dan hadits ini memiliki kelemahan yang serius, sebagaimana dinyatakan oleh Ibn Hibban, dan Al-Shafi’i mengatakan bahwa hadits ini adalah pilar kepalsuan — “Barangsiapa yang melakukan bid'ah yang sesat, maka ia akan menanggung beban bid'ah tersebut dan beban barangsiapa yang mengamalkannya” (Jami’ Al-‘Ulum wal-Hikam, hlm. 581–601)."
