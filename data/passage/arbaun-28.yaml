label: { ar: "الأربعون 28 — أوصيكم بتقوى الله وإياكم ومحدثات الأمور", en: "Arba'un 28 — fear of God and beware of novelties" }
text: "أوصيكم بتقوى الله، والسمع والطاعة وإن تأمر عليكم عبد، وإنه من يعش منكم بعدي فسيرى اختلافاً كثيراً، فعليكم بسنتي وسنة الخلفاء الراشدين المهديين، عضوا عليها بالنواجذ، وإياكم ومحدثات الأمور، فإن كل بدعة ضلالة"
summary:
  ar: "حديث العرباض بن سارية قال: وعظنا رسول الله موعظة وجلت منها القلوب وذرفت منها العيون فقلنا كأنها موعظة مودع فأوصنا — وهو الحديث الثامن والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه أبو داود (4607) والترمذي (2676) وقال حسن صحيح وابن ماجه والإمام أحمد من رواية ثور بن يزيد عن خالد بن معدان عن عبد الرحمن بن عمرو السلمي وحجر بن حجر الكلاعي عنه، وقال الحافظ أبو نعيم هو حديث جيد من صحيح حديث الشاميين ولم يتركه الشيخان من جهة إنكار، وزعم الحاكم أن سبب تركهما توهمهما أن ليس له راو عن خالد بن معدان غير ثور بن يزيد وقد رواه عنه بحير بن سعد ومحمد بن إبراهيم التيمي وغيرهما — ورد ابن رجب ذلك بأن الحديث ليس على شرطهما إذ لم يخرجا لعبد الرحمن بن عمرو ولا لحجر شيئاً وليسا ممن اشتهر بالعمل والرواية؛ وروي عن خالد عن ابن أبي بلال عن العرباض، وفي طريق ضمرة بن حبيب زيادة «فقد تركتكم على البيضاء ليلها كنهارها لا يزيغ عنها بعدي إلا هالك» وزيادة «فإنما المؤمن كالجمل الأنف حيثما قيد انقاد» التي أنكرها طائفة من الحفاظ — منهم أحمد بن صالح المصري — وقالوا هي مدرجة وليست من الحديث وكان أسد بن وداعة يزيدها؛ ولابن ماجه طريق عبد الله بن العلاء بن زبر عن يحيى بن أبي المطاع سمعت العرباض في الظاهر إسناد جيد متصل وقد ذكره البخاري في التاريخ إلا أن حفاظ أهل الشام أنكروا سماع يحيى من العرباض وقالوا لم يلقه — منهم أبو زرعة الدمشقي عن دحيم — وعند ابن رجب أن البخاري يقع له أوهام في أخبار أهل الشام وهؤلاء أعرف بشيوخهم، وروي من حديث بريدة وإسناده لا يثبت؛ وفي شرحه أن «فسيرى اختلافاً كثيراً» إخبار بما وقع في الأمة بعده من كثرة الاختلاف في الأصول والفروع موافق لما روي من افتراق الأمة على بضع وسبعين، وأن الأمر بالسمع والطاعة وإن تأمر عليكم عبد استشهد له بأن الأئمة من قريش عند أنس وهو حديث صحيح وحديث علي عند الحاكم بإسناد جيد وإن روي موقوفاً وقال الدارقطني هو أشبه، وقيل إن ذكر العبد الحبشي على وجه ضرب المثل؛ وفي «عضوا عليها بالنواجذ» كناية عن شدة التمسك والنواجذ الأضراس؛ ووصف الخلفاء بالراشدين لأنهم عرفوا الحق وقضوا به فالراشد ضد الغاوي وقيل المهديين أي يهديهم الله للحق ولا يضلهم فالأقسام ثلاثة: راشد عرف الحق واتبعه وغاو عرفه ولم يتبعه وضال لم يعرفه بالكلية؛ وفي «إياكم ومحدثات الأمور فإن كل بدعة ضلالة» تحذير من اتباع الأمور المحدثة المبتدعة والمراد بالبدعة ما أحدث مما لا أصل له في الشريعة يدل عليه فأما ما كان له أصل من الشرع يدل عليه فليس ببدعة شرعاً وإن كان بدعة لغة، وفي صحيح مسلم عن جابر أن النبي كان يقول في خطبته «شر الأمور محدثاتها وكل بدعة ضلالة»، وخرج الترمذي وابن ماجه من حديث كثير بن عبد الله المزني — وفيه ضعف شديد نص عليه ابن حبان وقال الشافعي ركن من أركان الكذب — «من ابتدع بدعة ضلالة كان عليه وزرها ووزر من عمل بها» (جامع العلوم والحكم ص 581–601)."
  en: "The hadith of al-Irbad ibn Sariya that the Messenger of God admonished them with an admonition at which hearts trembled and eyes wept, so they said it was like a parting admonition and asked for counsel — the twenty-eighth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Abu Dawud (4607) and al-Tirmidhi (2676, graded hasan sahih), Ibn Majah and the Imam Ahmad through Thawr ibn Yazid from Khalid ibn Ma'dan from Abd al-Rahman ibn Amr al-Sulami and Hujr ibn Hujr al-Kila'i from him; al-Hafiz Abu Nu'aym called it a good hadith among the soundest of the Syrians and held the two Shaykhs did not drop it out of rejection, while al-Hakim claimed their reason was a supposition that Thawr was Khalid's only transmitter — though Bahir ibn Sa'd and Muhammad ibn Ibrahim al-Taymi also carry it — which Ibn Rajab counters: the hadith is not on their condition anyway, for neither narrated anything from Abd al-Rahman ibn Amr nor Hujr, men not famed for practice and transmission; it also comes through Khalid from Ibn Abi Bilal from al-Irbad, and the Damra ibn Habib route adds 'I have left you upon the white way whose night is as its day; none swerves from it after me but is destroyed', plus 'the believer is like the familiar camel — wherever it is led it follows', an addition a group of memorisers — Ahmad ibn Salih al-Misri among them — denounced as interpolated and attributed to Asad ibn Wada'a's insertion; Ibn Majah's route through Abdullah ibn al-Ala' ibn Zabr from Yahya ibn Abi al-Muta' with explicit hearing from al-Irbad is outwardly a fine connected chain, noted in al-Bukhari's Tarikh, yet the Syrian memorisers — Abu Zur'a al-Dimashqi reporting from Duhaym — denied Yahya ever met al-Irbad, and Ibn Rajab observes al-Bukhari does make slips in Syrian reports where these men know their own shaykhs better; the Burayda route does not stand; in the commentary, 'you will see much disagreement' is foretelling of what befell the community in roots and branches, matching the seventy-odd sects reports; the command to hear and obey even should a slave be set over them is supported by 'the imams are of Quraysh' from Anas — a sound hadith — and Ali's report in al-Hakim with a good chain though transmitted halted, preferred so by al-Daraqutni, some saying the Abyssinian slave is mentioned only by way of example; 'bite on it with the molar teeth' is a figure for firmest adherence, nawajidh being the back teeth; the Rightly Guided are so named for knowing the truth and judging by it — rashid being the contrary of ghawi, who knows the truth and acts otherwise — while 'guided' (mahdiyyin) means God guides them to the truth and does not lead them astray, giving three classes: the guided who knows and follows, the deviant who knows and does not, and the astray who does not know at all; and 'beware of newly introduced matters, for every innovation is error' warns the community against following invented matters, innovation meaning what is introduced with no foundation in the Law to indicate it — whatever has a basis in the Law is no innovation legally though it may be linguistically — with Jabir's sermon report in Sahih Muslim 'the worst of matters are their novelties, and every innovation is error', and the Tirmidhi–Ibn Majah route through the weak Kathir ibn Abdullah al-Muzni — called a pillar of lying by al-Shafi'i — for 'whoever invents a misleading innovation bears its burden and the burden of whoever acts on it' (Jami' al-Ulum wal-Hikam pp. 581–601)."
