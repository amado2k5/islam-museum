label: { ar: "سنن النسائي 2041 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan al-Nasa'i 2041 — mentions of non-Muslim nations, religions and peoples", ur: "سنن نسائی 2041 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ : لَمَّا مَاتَ النَّجَاشِيُّ قَالَ النَّبِيُّ : \" اسْتَغْفِرُوا لَهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2041، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2041 (The Book of Funerals), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 2041، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
