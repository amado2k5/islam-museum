label: { ar: "الموطأ 2408 — عمرة عن عائشة: سارق الأترجة في زمن عثمان", en: "Muwatta 2408", es: "Muwatta 2408", fr: "Muwatta 2408", ur: "موطا 2408", tr: "El-Muvatta 2408 — Aişe'nin rivayetine göre Umre: Osman zamanındaki limon hırsızı", id: "Al-Muwatta 2408 — Umrah menurut riwayat Aisyah: Pencuri jeruk sitrun pada masa Utsman" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن أبيه عن عمرة بنت عبد الرحمن أن سارقا سرق في زمان عثمان أترجة، فأمر عثمان أن تُقوَّم، فقُومت بثلاثة دراهم من صرف اثني عشر درهما بدينار، فقطع عثمان يده. {cite:muwatta-maruf-1997 p.394} {cite:muwatta-maruf-1997 p.395}"
  tr: "Malik, Abdullah ibn Abi Bakr'dan, o da babasından, o da Amrah bint Abd al-Rahman'dan rivayet eder ki, Osman zamanında bir hırsız bir limon çalmıştır. Osman, limonun değerinin belirlenmesini emretmiş ve limonun değeri, o dönemde 12 dirhemin 1 dinar olduğu kur üzerinden 3 dirhem olarak belirlenmiştir. Bunun üzerine Osman, hırsızın elini kesmiştir. {cite:muwatta-maruf-1997 s.394} {cite:muwatta-maruf-1997 s.395}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr, dari ayahnya, dari Amrah bint Abd al-Rahman, bahwa seorang pencuri mencuri buah jeruk sitrun pada masa pemerintahan Utsman. Utsman memerintahkan agar buah itu dinilai, dan dinilai seharga tiga dirham, dengan kurs dua belas dirham untuk satu dinar. Maka Utsman memotong tangannya. {cite:muwatta-maruf-1997 p.394} {cite:muwatta-maruf-1997 p.395}"
