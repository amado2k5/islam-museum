text: "… المصائب بهم. ولم يمض على جماعة المؤمنين زمن طويل، حتى أصبح الناس المحيطون بهم : يحترمونهم احتراماً عظيماً، ويعظمون قَدْرَهم، وراح عدد المؤمنين يتزايد يوماً بعد يوم !! ومن فضائل الدين الإسلامي : أنه أوصى خيراً بالمسيحيين واليهود ورجال دينهم. …"
summary:
