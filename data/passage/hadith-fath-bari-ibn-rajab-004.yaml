text: "ل الكتاب؛ لأنهم يتخذون قبور أنبيائهم وصالحيهم مساجد، ووجدنا في كتاب مصنف على مذهب سفيان الثوري : وإذا صلى الرجل ( ٣٩٠- ب/ ق) وبين يديه ميت تنحى عنه؛ إنما كره الصلاة إلى القبور من أجل الميت، فإن صلى إليها"
