label: { ar: "صحيح البخاري 6495 — الأب والأبوة", en: "Sahih al-Bukhari 6495 — the father and fatherhood", ur: "صحیح بخاری 6495 — باپ اور والدیت", es: "Sahih al-Bukhari 6495 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا الْمَاجِشُونُ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي صَعْصَعَةَ، عَنْ أَبِيهِ، عَنْ أَبِي سَعِيدٍ، أَنَّهُ سَمِعَهُ يَقُولُ سَمِعْتُ النَّبِيَّ يَقُولُ \" يَأْتِي عَلَى النَّاسِ زَمَانٌ خَيْرُ مَالِ الرَّجُلِ الْمُسْلِمِ الْغَنَمُ، يَتْبَعُ بِهَا شَعَفَ الْجِبَالِ وَمَوَاقِعَ الْقَطْرِ، يَفِرُّ بِدِينِهِ مِنَ الْفِتَنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6495، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6495 (To make the Heart Tender (Ar-Riqaq)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6495، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6495 (Para ablandar el corazón (Ar-Riqaq)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
