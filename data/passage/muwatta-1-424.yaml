label: { ar: "الموطأ 424 — بلاغ: ابن عمر يكره المرور بين أيدي النساء وهن يصلين", en: "Muwatta 424", es: "Muwatta 424", fr: "Muwatta 424", ur: "موطا 424", tr: "El-Muvatta 424 — Rivayet: İbn Ömer, kadınlar namaz kılarken onların önünden geçmekten hoşlanmazdı.", id: "Al-Muwatta 424 — Riwayat: Ibnu Umar tidak menyukai melewati wanita-wanita yang sedang shalat." }
summary:
  ar: "بلاغ في باب التشديد في أن يمر أحد بين يدي المصلي: يروي مالك أنه بلغه أن عبد الله بن عمر كان يكره أن يمر بين أيدي النساء وهن يصلين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.221}"
  tr: "Namaz kılan bir kişinin önünden geçmenin kesinlikle yasaklanmasıyla ilgili bir rivayet: Malik, Abdullah ibn Umar'ın namaz kılan kadınların önünden geçmekten hoşlanmadığını işittiğini aktarır. Editör, bunun Malik'ten Ebu Musab ve Suveyd tarafından rivayet edildiğini belirtir. {cite:muwatta-maruf-1997 s.221}"
  id: "Sebuah laporan mengenai larangan keras untuk melewati orang yang sedang shalat: Malik meriwayatkan bahwa ia mendengar bahwa Abdullah ibn Umar tidak menyukai melewati wanita yang sedang shalat. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Musab dan Suwaid. {cite:muwatta-maruf-1997 p.221}"
