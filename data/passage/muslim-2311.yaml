text: "قال جابر بن عبد الله: ما سئل رسول الله شيئاً قط فقال لا"
summary:
  ar: "رواية جابر بن عبد الله في باب كثرة عطائه من كتاب الفضائل في صحيح مسلم؛ إجمال العطاء النبوي — لم يُسأل شيئاً قط فقال لا."
  tr: "Sahih Müslim'in Faziletler Kitabı'ndaki \"Cömertliğinin Bolluğu\" bölümünde Cabir bin Abdullah'ın rivayeti; Peygamberimizin cömertliğinin bir özeti: Ondan hiçbir şey istenmedi ve o da hayır demedi."
  id: "Riwayat Jabir bin Abdullah dalam bab tentang kedermawanannya dari Kitab Keutamaan dalam Sahih Muslim; ringkasan tentang kedermawanan Nabi — beliau tidak pernah dimintai apa pun dan selalu menolak."
