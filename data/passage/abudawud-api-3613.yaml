label: { ar: "سنن أبي داود 3613 — الأب والأبوة", en: "Sunan Abi Dawud 3613 — the father and fatherhood", ur: "سنن ابی داؤد 3613 — باپ اور والدیت", es: "Sunan Abi Dawud 3613 — El padre y la paternidad", fr: "Sunan Abi Dawud 3613 — le père et la paternité" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ مِنْهَالٍ الضَّرِيرُ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا ابْنُ أَبِي عَرُوبَةَ، عَنْ قَتَادَةَ، عَنْ سَعِيدِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ أَبِي مُوسَى الأَشْعَرِيِّ، أَنَّ رَجُلَيْنِ، ادَّعَيَا بَعِيرًا أَوْ دَابَّةً إِلَى النَّبِيِّ لَيْسَتْ لِوَاحِدٍ مِنْهُمَا بَيِّنَةٌ فَجَعَلَهُ النَّبِيُّ بَيْنَهُمَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 3613، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3613 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3613، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3613 (El Oficio del Juez (Kitab Al-Aqdiyah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3613 (Le Livre du Juge (Kitab Al-Aqdiyah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
