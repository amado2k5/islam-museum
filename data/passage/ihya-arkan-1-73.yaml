text: "… حتى ترك فواحش المعاصى ربما يظن بنفسه أنه هذب نفسه وحسن خلقه واستغنى عن المجاهدة، فلا بد من إيضاح علامة حسن الخلق. فإن حسن الخلق هو الإيمان، وسوء الخلق هو اللفاق. وقد ذكر اللّٰه تعالى صفات المؤمنين والمنافقين فى كتابه …"
