label: { ar: "الموطأ 2824 — عطاء بن يسار: من وقاه الله شر اثنين ولج الجنة", en: "Muwatta 2824" }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن عطاء بن يسار، أن رسول الله قال: من وقاه الله شر اثنين ولج الجنة. فقال رجل: لا تخبرنا يا رسول الله، فسكت النبي، ثم عاد إلى مثل قوله، فقال الرجل: لا تخبرنا، وتكرر ذلك حتى أسكته رجل بجانبه، فقال النبي: من وقاه الله شر ما بين لحييه وما بين رجليه ولج الجنة. ويذكر المحقق اختلاف الرواة في «لا تخبرنا» بين النهي والعرض، وأن الحديث موصول من حديث العلاء بن عبد الرحمن عن أبيه عن أبي هريرة عند مسلم وغيره. {cite:muwatta-maruf-1997 p.585} {cite:muwatta-maruf-1997 p.586}"
