label: { ar: "الموطأ 2824 — عطاء بن يسار: من وقاه الله شر اثنين ولج الجنة", en: "Muwatta 2824", es: "Muwatta 2824", fr: "Muwatta 2824", ur: "موطا 2824", tr: "El-Muvatta 2824 — Ata’ ibn Yasar: Kim Allah tarafından iki şeyin şerrinden korunursa cennete girer.", id: "Al-Muwatta 2824 — Ata’ ibn Yasar: Barangsiapa dilindungi Allah dari kejahatan dua hal, maka ia akan masuk Surga." }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن عطاء بن يسار، أن رسول الله قال: من وقاه الله شر اثنين ولج الجنة. فقال رجل: لا تخبرنا يا رسول الله، فسكت النبي، ثم عاد إلى مثل قوله، فقال الرجل: لا تخبرنا، وتكرر ذلك حتى أسكته رجل بجانبه، فقال النبي: من وقاه الله شر ما بين لحييه وما بين رجليه ولج الجنة. ويذكر المحقق اختلاف الرواة في «لا تخبرنا» بين النهي والعرض، وأن الحديث موصول من حديث العلاء بن عبد الرحمن عن أبيه عن أبي هريرة عند مسلم وغيره. {cite:muwatta-maruf-1997 p.585} {cite:muwatta-maruf-1997 p.586}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Allah iki şeyin şerrinden korursa, o cennete girer.\" Bir adam, \"Bize söylemeyin, ey Allah Resulü!\" dedi. Peygamber sustu. Sonra sözünü tekrarladı ve adam, \"Bize söylemeyin!\" dedi. Bu, yanındaki bir adam onu susturana kadar tekrarlandı. Sonra Peygamber şöyle buyurmuştur: \"Allah, çenesinin ve bacaklarının arasındaki şeyin şerrinden korursa, o cennete girer.\" Araştırmacı, \"Bize söylemeyin\" ifadesinin bir yasak mı yoksa bir teklif mi olduğu konusunda raviler arasında görüş ayrılığı olduğunu ve hadisin, Müslim ve diğer hadis külliyatlarında bulunan, Alaa ibn Abdülrahman'ın babasından, o da Ebu Hurayra'dan rivayet ettiği naklediyle bağlantılı olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.585} {cite:muwatta-maruf-1997 s.586}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari Ata ibn Yasar, bahwa Rasulullah SAW bersabda: “Barangsiapa yang dilindungi Allah dari keburukan dua hal, maka ia akan masuk surga.” Seorang laki-laki berkata: “Jangan beritahukan kepada kami, wahai Rasulullah.” Nabi SAW terdiam. Kemudian beliau mengulangi pernyataannya, dan laki-laki itu berkata: “Jangan beritahukan kepada kami.” Hal ini diulangi hingga seorang laki-laki di sebelahnya membungkamnya. Kemudian Nabi SAW bersabda: “Barangsiapa yang dilindungi Allah dari keburukan yang ada di antara rahangnya dan yang ada di antara kedua kakinya, maka ia akan masuk surga.” Peneliti menyebutkan perbedaan pendapat di antara para perawi mengenai “Jangan beritahukan kepada kami,” apakah itu larangan atau ajakan, dan bahwa hadits ini terhubung melalui riwayat Alaa ibn Abd al-Rahman, dari ayahnya, dari Abu Hurayrah, sebagaimana terdapat dalam Muslim dan koleksi lainnya. {kutip:muwatta-maruf-1997 hal.585} {kutip:muwatta-maruf-1997 hal.586}"
