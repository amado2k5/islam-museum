label: { ar: "الموطأ 844 — حميد بن قيس ومجاهد في صيام أيام الكفارة: أتتابع أم تقطع؟ مجاهد: لا تقطع فإنها في قراءة أبي بن كعب ثلاثة أيام متتابعات", en: "Muwatta 844", es: "Muwatta 844", fr: "Muwatta 844", ur: "موطا 844", tr: "El-Muvatta 844 — Humaid ibn Kays ve Mücahid, kefaret günlerinde oruç tutma konusunda: Ardışık mı olmalı yoksa kesintili mi? Mücahid: Kesintili olmasın, çünkü Ubeyy ibn Ka'b'ın rivayetinde üç ardışık gün olarak geçmektedir.", id: "Al-Muwatta 844 — Humaid ibn Qais dan Mujahid tentang puasa hari-hari penebusan dosa: Haruskah puasa itu dilakukan secara berurutan atau terputus-putus? Mujahid: Jangan memutusnya, karena menurut bacaan Ubayy ibn Ka’b, puasa itu dilakukan selama tiga hari berturut-turut." }
summary:
  ar: "يرويه مالك عن حميد بن قيس المكي، أنه كان مع مجاهد وهو يطوف بالبيت، فسأله رجل عن صيام أيام الكفارة أمتتابعات هي أم تُقطع؟ فقال حميد: نعم، يقطعها إن شاء. فقال مجاهد: لا يقطعها، فإنها في قراءة أُبيّ بن كعب ثلاثة أيام متتابعات. ويذكر المحقق أنه رواه عن مالك أبو مصعب (804) وسويد (466). {cite:muwatta-maruf-1997 p.409}"
  tr: "Malik, Humaid ibn Kays el-Mekki'den rivayet ettiğine göre, Mücahid ile birlikte Kâbe'yi tavaf ederken, bir adam ona kefaret günlerinin ardışık mı olması gerektiğini yoksa bölünebilir mi olduğunu sormuş. Humaid, \"İsterse bölebilir\" demiş. Mücahid ise, \"Bölemez, çünkü Ubeyy ibn Ka'b'ın rivayetinde üç gün ardışık olarak geçmektedir\" demiş. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab (804) ve Suveyd (466) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.409}"
  id: "Malik meriwayatkan hadits ini dari Humaid bin Qays al-Makki, yang mengatakan bahwa ia bersama Mujahid ketika Mujahid sedang melakukan tawaf di sekitar Ka'bah, dan seorang pria bertanya kepadanya tentang hari-hari penebusan dosa: apakah hari-hari itu harus berurutan atau dapat dipisahkan? Humaid berkata: Ya, ia dapat memisahkannya jika ia mau. Mujahid berkata: Ia tidak dapat memisahkannya, karena dalam bacaan Ubayy bin Ka'b, hari-hari itu adalah tiga hari berurutan. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (804) dan Suwaid (466). {cite:muwatta-maruf-1997 p.409}"
