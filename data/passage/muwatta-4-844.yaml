label: { ar: "الموطأ 844 — حميد بن قيس ومجاهد في صيام أيام الكفارة: أتتابع أم تقطع؟ مجاهد: لا تقطع فإنها في قراءة أبي بن كعب ثلاثة أيام متتابعات", en: "Muwatta 844" }
summary:
  ar: "يرويه مالك عن حميد بن قيس المكي، أنه كان مع مجاهد وهو يطوف بالبيت، فسأله رجل عن صيام أيام الكفارة أمتتابعات هي أم تُقطع؟ فقال حميد: نعم، يقطعها إن شاء. فقال مجاهد: لا يقطعها، فإنها في قراءة أُبيّ بن كعب ثلاثة أيام متتابعات. ويذكر المحقق أنه رواه عن مالك أبو مصعب (804) وسويد (466). {cite:muwatta-maruf-1997 p.409}"
