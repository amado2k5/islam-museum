label: { ar: "صحيح البخاري 6124 — الحرام", en: "Sahih al-Bukhari 6124 — the unlawful", ur: "صحیح بخاری 6124 — حرام" }
text: "… أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ لَمَّا بَعَثَهُ رَسُولُ اللَّهِ وَمُعَاذَ بْنَ جَبَلٍ قَالَ لَهُمَا \" يَسِّرَا وَلاَ تُعَسِّرَا، وَبَشِّرَا وَلاَ تُنَفِّرَا، وَتَطَاوَعَا \". قَالَ أَبُو مُوسَى يَا رَسُولَ اللَّهِ إِنَّا بِأَرْضٍ يُصْنَعُ فِيهَا شَرَابٌ مِنَ الْعَسَلِ، يُقَالُ لَهُ الْبِتْعُ، وَشَرَابٌ مِنَ الشَّعِيرِ، يُقَالُ لَهُ الْمِزْرُ. فَقَالَ رَسُولُ اللَّهِ \" كُلُّ مُسْكِرٍ حَرَامٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6124، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6124 (Good Manners and Form (Al-Adab)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6124، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
