text: "ك ١٥٨٥ - حدثني يحيى عن مالك؛ أنه بلغه أنه كتب إلى عمر بن الخطاب من العراق: أن رجلا قال لامرأته: حبلك على غاربك. فكتب عمر بن الخطاب إلى عامله: أن مره يوافيني بمكة في الموسم. فبينما عمر يطوف بالبيت،"
