text: "… و، وعبدالله بن أحمد في زياداته على مستد أبيه، وأبو يعلى، والطبراني في الكبير، وسنده ضعيف، وروي نحوه عن أنس في الصحيحين مرفوعاً : لا يؤمن أحدكم حتى يحب لأخيه ما يُحبُّ لنفسه. في صحبة يزيد بن شريح هذا خلاف …"
summary:
