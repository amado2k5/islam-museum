text: "ها، ساريا في ليلة أمل كلها نهار فلا يسأل عن صبحها. وقد رغب في خطابة الكرك وهو خطيب، وتوصل بالملوك في هذا الملتمس وهو قريب، ونزع من مصر إلى الشام ومن عيذاب إلى الكرك وهذا عجيب، والفقر سائق عنيف والمذكور"
