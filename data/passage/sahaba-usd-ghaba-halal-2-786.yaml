  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin resimli 2. cildinin 786. sayfasından, helal, haram ve yasak olan şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
