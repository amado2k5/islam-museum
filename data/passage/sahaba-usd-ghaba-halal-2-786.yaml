  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 786 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
