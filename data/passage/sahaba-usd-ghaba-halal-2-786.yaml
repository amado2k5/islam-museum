text: "… حبيب، عن سويد بن قيس، عن عبد الرحمٰن بن معاوية: أن رجلاً سأل النبي عليل قال: لما اشتعل الوجع قام أبو عبيدة بن الجراح في فقال: يا رسول اللّه، ما يحل لي وما يحرم علي؟ الناس خطيباً، فقال: يا أيها …"
summary:
