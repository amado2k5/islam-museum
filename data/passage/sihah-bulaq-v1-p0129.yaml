text: |-
  قوله واستتصه سأله الخ فالسين
  والتاء لاطلب وأماقول القاموس
  واقتص فلانا ..أله الخ فهووهم
  يه عله شارحه
  الناقسة وحلت الشاة وأقصت
  الفرس والاتان فى أول حلها
  وأعقت فى آخره اذا استيان
  جلها اه إو
