  الاصمعى قصاص الشعر حيث تنتهو نبنته من مقدّمه ومؤخرء وفسه ثلاث لغات قصاص
  وقداص وقصاص والضم أعلى قال ابن السكيت القصيصة نبت يخرج الى جائبه الكماً:
  والجمع قصيص وقد أقصت الارض أى أنيتته ويقال أيضا أفصت الشاة والفرس استبان
  جلهما فهى مقص من خيل مقاص عن الاصمعى التصيصة من الابل الزاملة يحمل عليها
