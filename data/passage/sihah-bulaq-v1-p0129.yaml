  والقصة الاهر والحديث وقد اقتصصت الحديث رويته على وجهه وقد قص عليه الخبرقصص
  والاسم أيضا القه ص بالفتح وضع موضع المصدرحى صار أغلب عليه والقصص بكسم
  القاف بمع القصة التى تكتب والقصاص القود وقدأقص الامير فلانا من فلان اذا اققصر
