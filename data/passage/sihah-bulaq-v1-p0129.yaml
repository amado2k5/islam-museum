  وفى الحديثان امر أة سألته عن دم المحيض فقال اقرصيه بماء أى اغسليه بأطراف أصابعك
  ويروى قرّصيه بالتشديد قال أبو عبيد أى قطعيه به والقرص بالضم والقرصة من الخبز وجع
  القرص قرصة وأقراص مشل غصن وغصفة وأغصان وجمع القرصة قرص مثل صبرة وصبر
  وقرصت المرأة الحجين تقرصه قرصا وقرّصته تقر يصاأى قطعته قرصة قرصة والتشديد للتكثير
  وقرص الشمس عينها والقارص اللبن الذى يحذى اللسان وفى المثل عدا القارص فحزرأى
  جاوز الى ان حض يعنى تفاقم الامر واشتد والقراص البسابونج وهونور الاقحوان اذا يبس
  الواحدة قراصة عن أبى عمرو ⁦( رفص)⁩ القرفصة أن تجمع الانسان وتشدرجليه ويديه
  قال الشاعر ظلت عليه عقاب الموت ساقطة قدة رفصت روحه تلك المخاليب
  والقرفصاء ضرب من القعوديمدو يقصر فاذا قلت قعد فلان الرفصاء فكأنك قلت قعد
  فعود امخصوصا وهو أن يجاس ع-لى البتبه ويلصق فحذيه ببطنه ويحتبى بيديه يضعه-ماعلى
  ساقيه كما يحتبى بالموب تكون يداه مكان الموب عن أبى عبيد وقال آبو المهدى هو
  أ أن يجلس على ركبيمه منكبا وبلصق بطنه بفغذيه ويتأبط كفيه وهى جلسة الاعراب
