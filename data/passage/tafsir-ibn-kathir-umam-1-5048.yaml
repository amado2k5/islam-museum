text: "… ملوك حمير، وكان مشركًا- هو الَّذِي قتل أصحاب الأخدود، وكانوا نصارى، وكانوا قريبًا من عشرين ألفًا، فلم يَفْلِتْ منهم إلا دَوس ذو ثعلبان، فذهب فاستغاث بقيصر ملك الشام - وكان نصرانيًّا- فكتب له إلىٰ النَّجاشي ملك الحبشة؛ لكونه أقرب إليهم، …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 5048، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 5048, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 5048 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
