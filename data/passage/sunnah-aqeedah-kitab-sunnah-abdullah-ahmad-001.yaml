text: "، ومبدلة الصابئين: من الهند، واليونان، وكان من مبدلة أهل الكتاب من اليهود، وأن الجعد بن درهم، ثم الجهم بن صفوان ومن اتبعهما أخذوا ذلك عنهم . اه. وقد ظهرت الجهمية بعد انقراض أكابر التابعين، وأجمع السلف على كفرهم، وإخراجهم"
