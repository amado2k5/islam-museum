text: ": لأنذركم به يا أهل مكة، ولأنذر به أيضا جميع من بلغه هذا الكتاب من اليهود والنصارى وغيرهم. وقيل : المراد بما أنزل إليهم من ربهم. كتب أنبيائهم السابقين مثل كتاب شعياء، وكتاب حزقيل، وكتاب دانيال. فإنها مشتملة أيضا على"
