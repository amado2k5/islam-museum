label: { ar: "صحيح مسلم 2150 — وزر من تبع", en: "Sahih Muslim 2150 — bearing the burden of those who follow", ur: "صحیح مسلم 2150 — پیروی کرنے والوں کا بوجھ", es: "Sahih Muslim 2150 — llevando la carga de aquellos que siguen", fr: "Sahih Muslim 2150 — Porter le fardeau de ceux qui suivent", tr: "Sahih Muslim 2150 — Takip edenlerin yükü", id: "Sahih Muslim 2150 — Beban bagi orang-orang yang mengikuti" }
text: "… مَا حَدَّثَ رَسُولُ اللَّهِ \" إِنَّ اللَّهَ يُعَذِّبُ الْمُؤْمِنَ بِبُكَاءِ أَحَدٍ \". وَلَكِنْ قَالَ \" إِنَّ اللَّهَ يَزِيدُ الْكَافِرَ عَذَابًا بِبُكَاءِ أَهْلِهِ عَلَيْهِ \" قَالَ وَقَالَتْ عَائِشَةُ حَسْبُكُمُ الْقُرْآنُ { وَلاَ تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى} قَالَ وَقَالَ ابْنُ عَبَّاسٍ عِنْدَ ذَلِكَ وَاللَّهُ أَضْحَكَ وَأَبْكَى. قَالَ ابْنُ أَبِي مُلَيْكَةَ فَوَاللَّهِ مَا قَالَ ابْنُ عُمَرَ مِنْ شَىْءٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2150، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 2150 (Introduction), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 2150، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Sahih Muslim, n.° 2150 (Introducción), que habla de asumir la responsabilidad de quienes le siguen. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 2150 (Introduction), évoque le fardeau de ceux qui suivent. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, écrivent, effacent ou évaluent un acte."
  tr: "Sahih Müslim'de 2150 numaralı hadis, kişinin takipçilerinin yükünden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2150, menyebutkan beban amal pengikut seseorang. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
