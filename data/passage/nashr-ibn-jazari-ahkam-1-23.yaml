text: "… السبع كلها متواترة اي كل فرد فردما روي عن هؤلاء الأئمة السبعة قالوا والقطع بانها منزلة من عند اللّٰه واجب ونحن بهذا نقول ولكن فيما اجتمعت على نقله عنهم الطرق واتفقت عليه لفرق من غير نكير له مع انه شاع …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 23، يرد فيه ذكر الواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
