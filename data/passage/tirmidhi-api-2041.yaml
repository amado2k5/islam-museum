label: { ar: "جامع الترمذي 2041 — الحبة السوداء، الداء", en: "Jami' al-Tirmidhi 2041 — the black seed; the disease and its remedy", ur: "جامع ترمذی 2041 — کلونجی، بیماری", es: "Jami' al-Tirmidhi 2041 — La semilla negra; la enfermedad y su remedio", fr: "Jami' al-Tirmidhi 2041 — la graine noire; la maladie et son remède", tr: "Cami' el-Tirmizi 2041 — Çörek otu, hastalık", id: "Jami' al-Tirmidhi 2041 — Biji hitam, penyakitnya" }
text: "… أَبِي عُمَرَ، وَسَعِيدُ بْنُ عَبْدِ الرَّحْمَنِ الْمَخْزُومِيُّ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ قَالَ \" عَلَيْكُمْ بِهَذِهِ الْحَبَّةِ السَّوْدَاءِ فَإِنَّ فِيهَا شِفَاءً مِنْ كُلِّ دَاءٍ إِلاَّ السَّامَ \". وَالسَّامُ الْمَوْتُ. قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ بُرَيْدَةَ وَابْنِ عُمَرَ وَعَائِشَةَ. وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْحَبَّةُ السَّوْدَاءُ هِيَ الشُّونِيزُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2041، يذكر الحبة السوداء، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2041 (Chapters on Medicine), that mentions the black seed, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2041، جس میں کلونجی، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2041 (Capítulos sobre Medicina), menciona la semilla negra, la enfermedad y su remedio, la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2041 (Chapitres sur la médecine), mentionne la graine de nigelle, la maladie et son remède. Le Répertoire des ressources médicales la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de yer alan 2041 numaralı hadiste çörek otu, hastalık ve tedavi konularından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2041, menyebutkan biji jintan hitam, penyakit, dan pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
