label: { ar: "جامع الترمذي 2041 — الحبة السوداء، الداء", en: "Jami' al-Tirmidhi 2041 — the black seed; the disease and its remedy", ur: "جامع ترمذی 2041 — کلونجی، بیماری" }
text: "… أَبِي عُمَرَ، وَسَعِيدُ بْنُ عَبْدِ الرَّحْمَنِ الْمَخْزُومِيُّ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ قَالَ \" عَلَيْكُمْ بِهَذِهِ الْحَبَّةِ السَّوْدَاءِ فَإِنَّ فِيهَا شِفَاءً مِنْ كُلِّ دَاءٍ إِلاَّ السَّامَ \". وَالسَّامُ الْمَوْتُ. قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ بُرَيْدَةَ وَابْنِ عُمَرَ وَعَائِشَةَ. وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْحَبَّةُ السَّوْدَاءُ هِيَ الشُّونِيزُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2041، يذكر الحبة السوداء، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2041 (Chapters on Medicine), that mentions the black seed, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2041، جس میں کلونجی، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
