text: "… فوجده مريضاً، فتوقّف عليه، فاجتمع على جابان نصارى عِجْل، وتَيْم اللات، وضُبَيْعة، وجابر بن بُجَير، وعرب الضاحية من أهل الحيرة،. وكان خالد لما بلغه تجمع نصارى بكر وغيرهم سار إليهم ولا يشعر بدنوّ جابان. فلما طلع جابان بالَّيْس قالت العجم …"
