label: { ar: "سنن أبي داود 1623 — الأب والأبوة", en: "Sunan Abi Dawud 1623 — the father and fatherhood", ur: "سنن ابی داؤد 1623 — باپ اور والدیت", es: "Sunan Abi Dawud 1623 — El padre y la paternidad", fr: "Sunan Abi Dawud 1623 — Le père et la paternité", tr: "Sunan Abi Davud 1623 — Baba ve Babalık", id: "Sunan Abi Dawud 1623 — Sang Ayah dan Peran Ayah" }
text: "… الْوَلِيدِ وَالْعَبَّاسُ فَقَالَ رَسُولُ اللَّهِ \" مَا يَنْقِمُ ابْنُ جَمِيلٍ إِلاَّ أَنْ كَانَ فَقِيرًا فَأَغْنَاهُ اللَّهُ وَأَمَّا خَالِدُ بْنُ الْوَلِيدِ فَإِنَّكُمْ تَظْلِمُونَ خَالِدًا فَقَدِ احْتَبَسَ أَدْرَاعَهُ وَأَعْتُدَهُ فِي سَبِيلِ اللَّهِ وَأَمَّا الْعَبَّاسُ عَمُّ رَسُولِ اللَّهِ فَهِيَ عَلَىَّ وَمِثْلُهَا \". ثُمَّ قَالَ \" أَمَا شَعَرْتَ أَنَّ عَمَّ الرَّجُلِ صِنْوُ الأَبِ \". أَوْ \" صِنْوُ أَبِيهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1623، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1623 (Zakat (Kitab Al-Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1623، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1623 (Zakat (Kitab Al-Zakat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1623 (Zakat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1623 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1623, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
