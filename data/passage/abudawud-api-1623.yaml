text: "… الْوَلِيدِ وَالْعَبَّاسُ فَقَالَ رَسُولُ اللَّهِ \" مَا يَنْقِمُ ابْنُ جَمِيلٍ إِلاَّ أَنْ كَانَ فَقِيرًا فَأَغْنَاهُ اللَّهُ وَأَمَّا خَالِدُ بْنُ الْوَلِيدِ فَإِنَّكُمْ تَظْلِمُونَ خَالِدًا فَقَدِ احْتَبَسَ أَدْرَاعَهُ وَأَعْتُدَهُ فِي سَبِيلِ اللَّهِ وَأَمَّا الْعَبَّاسُ عَمُّ رَسُولِ اللَّهِ فَهِيَ عَلَىَّ وَمِثْلُهَا \". ثُمَّ قَالَ \" أَمَا شَعَرْتَ أَنَّ عَمَّ الرَّجُلِ صِنْوُ الأَبِ \". أَوْ \" صِنْوُ أَبِيهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1623، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1623 (Zakat (Kitab Al-Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1623، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
