text: "… ولا تجب على المسافرين، وخالفه صاحباه أبو يوسف ومحمد فقالا: إنها ليست بواجبة، وروى عن مالك مثل قول أبي حنيفة. وسبب اختلافهم شيئان: أحدهما: هل فعله مَلِي في ذلك محمول على الوجوب أو على الندب، وذلك أنه لم يترك وَلِلية …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 476، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف، والمندوب، وما ليس بواجب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 476, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed, the recommended (mandub), what is said not to be obligatory, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 476 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے، مندوب، جو واجب نہیں، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 476, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable, le recommandé (mandub), ce qui est dit non obligatoire, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 476, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo que obliga a la persona responsable, lo recomendado (mandub), lo que se dice que no es obligatorio, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Rüşd'ün *Bidayat al-Mujtahid* adlı eserinin 4. cildinin 476. sayfasından, farz olan amelleri, hukuki sorumluluğu olan kişiden beklenenleri, müstehap olan amelleri, farz olmayan amelleri ve müstehap olan amelleri ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan amelleri, itaat amellerini, müstehap olan amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Bidayat al-Mujtahid* karya Ibnu Rushd, Jilid 4, halaman 476, yang membahas tentang amalan wajib, apa yang dituntut dari orang yang bertanggung jawab secara hukum, amalan yang dianjurkan, apa yang tidak wajib, dan amalan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
