label: { ar: "موطأ مالك 678 — الواجب", en: "Muwatta Malik 678 — the obligatory (wajib)", ur: "موطأ مالک 678 — واجب", fr: "Muwatta de Malik 678 — l'obligatoire (wajib)", es: "Muwatta de Malik 678 — lo obligatorio (wajib)", tr: "Muwatta Malik 678 — Zorunluluk", id: "Muwatta Malik 678 — Kewajiban" }
text: "… رَمَضَانَ فَقَالَ سَعِيدٌ أَحَبُّ إِلَىَّ أَنْ لاَ يُفَرَّقَ قَضَاءُ رَمَضَانَ وَأَنْ يُوَاتَرَ. قَالَ يَحْيَى سَمِعْتُ مَالِكًا يَقُولُ فِيمَنْ فَرَّقَ قَضَاءَ رَمَضَانَ فَلَيْسَ عَلَيْهِ إِعَادَةٌ وَذَلِكَ مُجْزِئٌ عَنْهُ وَأَحَبُّ ذَلِكَ إِلَىَّ أَنْ يُتَابِعَهُ. قَالَ مَالِكٌ مَنْ أَكَلَ أَوْ شَرِبَ فِي رَمَضَانَ سَاهِيًا أَوْ نَاسِيًا أَوْ مَا كَانَ مِنْ صِيَامٍ وَاجِبٍ عَلَيْهِ أَنَّ عَلَيْهِ قَضَاءَ يَوْمٍ مَكَانَهُ."
summary:
  ar: "حديث في موطأ مالك، رقم 678، يرد فيه ذكر الواجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 678 (Fasting), whose wording mentions the obligatory (wajib). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 678، جس کے الفاظ میں واجب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 678, dont le texte mentionne l'obligatoire (wajib). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 678, cuyo texto menciona lo obligatorio (wajib). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 678 numaralı hadis, farz olan amellerden bahsetmektedir. Bu hadis, farz, itaat, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 678, menyebutkan tentang amalan-amalan wajib. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan-amalan wajib, amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
