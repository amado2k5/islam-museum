text: |-
  الحفارب طرق ضفة واحدما
  مطربة والرقب أيضا الضيقة قهو
  هو نيدنلنظى بالمرادف مكذا يظهر
  ٦٠
  |الازب الاتفور الانه ينبت على حاجبيه شعيرات فاذاضربته الريح :فرقال الكميت
  أو يتناسى الازب النفورا وعام أزب أى خصيب كثير النبات والزباءملكة الجزيرة
  وتعدّ من حلول الطوائف والزباب بمع زباية وهى خأرة صماء تضرب العرب بها المشل فتقول
  أسرق من زباية ويشبه بها الجاهل قال ابن حلزة
  وهم زباب حار • لا تسمع الآذان رعدا
  وأزبت الشمس أى دتت للغروب والزبيب الذى يؤكل الواحدة زبيبة تقول منه ز بب خلان
  عنبه تزييبا والزييبة قرحة تخرج فى اليدوالز بيبتان الزبدتان فى الشدقين يقال تصكلم
  فلان حتى زيب شدقاء أى خرج الزبد عليه ما ومنه الحية ذوالز بيبتين ويقال هما المكتتان
  السود اوان فوق عينيه والربزب ضرب من السفن زخزب الزخزب بالضم وتشديد
  الباء الغليظ يقال صارولد الناقة زخزنا اذا غلظ جسمه واشتدلحه ⁦( رب)⁩ الزرب
  والزربية قترة الصائد وقد انزرب الصائد اذادخل فيه قال ذوارمة
  و الشمابل من جلان مقتنص رذل الشياب خفى النحضر منزرب
  والزرب والزريبة أيضا خيرة للغنم من خشب قال ابن السكيت وبعضهم بق ول زرب بالسكسم
  الكسائى زربت للغنم أزرب زربا وقال أبوعم ر والزرب المدخسل ومنه زرب القسم وزريبة
  السبع موضعه الذى يكنن فيه والزرابي المارق :⁦(زرتب)⁩ الررنب ضرب
  من النيات طيب الرائحة وهو فعلل وقال
  يا يأبى أنت وقول الاشنب * كا غماذر عليه الزرنب
  ⁦(زعب)⁩ الزعبة الدفعة من المال يقال زعبت لهزعبة من المال وزعبة أى دفعت له
  قطعة منه وزعيته عنى زعبا أى دفعته الاصمعى ازدعيت الشئاذا حلته بقال مر به
  فازد عبه وياء ناسيل يزعب زعبا أى يتدافع فى الوادى واذ اقلت يرعب بالراهتع-ى يملا
  الوادى والزاعبية الرماح قال الطر ماح
  وأجوبة كالزاعبية وخزها * يبادهها شيخ العرافين أحردا
  ويقال سنان زاعىّ فاماقول ابن هرمة يكاديم للافيها الراعب الهادى فيقال هو
  السياح فى الارض وازامباب السيل كثرته وتدافعه يقال سيل مزلعب بزيادة اللام
  ⁦( زغب)⁩ الزغب الشعيرات الصفر على ريش الفرخ والفراخ زغب وقدرغب الفرخ
  تزغا وأزغب الكرم وذلك يعدبرى الماءفيه وازلغب الشعراذاندت بعدالحلق وازلغب
  وفى الحكم بن الصلت منك مخيلة • تراها وبحر من فعالك زغسرب
  قال الاصمعى الزغرب البول الكثير (ز قب ، زقبت الجرذ فى بحره فازقب أى أدخلته
  فدخل وطربق زقب أى ضيق قال أبو ذوْيب
  ومتلف مثل فرق الرأس تخليه • مطارب زقب أمبالهافيج
  ويروى تقب بالضم ⁦(ذكب)⁩ ذكبت المرأة ولدهارمت به عند الولادة والاناءملاته
  والمراة
