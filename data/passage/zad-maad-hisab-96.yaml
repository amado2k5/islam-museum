label: { ar: "زاد المعاد لابن القيم ص 96 — عدد الحسنات، كتابة الحسنات", en: "Ibn al-Qayyim's Zad al-Ma'ad, p. 96 — a stated number of good deeds; the writing of good deeds", ur: "زاد المعاد، ابن القیم ص 96 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… لَهُ، لَهُ المُلْكُ، وَلَهُ الْحَمْدُ يُحْيِيٍ وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيءٍ قَدِيرٌ، عَشْرُ مَرَّات، كُتِبَ لَهُ عَشْرُ حَسَنَاتٍ، وَمُحِيَ عَنْهُ عَشْرُ سَيِّئَاتٍ، وَرُفِعَ لَهُ عَشْرُ دَرَجَاتٍ، وَكَانَ يَوْمَهُ ذُلِكَ كُلَّهُ في حِرْزٍ مِنْ كُلِّ مَكْرُوهِ، وَحُرِسَ مِنَ الشَّيْطَانِ، وَلَمْ يَنْبَغ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 96، يذكر عدد الحسنات، وكتابة الحسنات، ورفع الدرجات، وعدد السيئات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 96, that speaks of a stated number of good deeds, the writing of good deeds, ranks raised, a stated number of bad deeds, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 96 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، درجات کی بلندی، برائیوں کی تعداد، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
