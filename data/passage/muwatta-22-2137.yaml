label: { ar: "الموطأ 2137 — يحيى عن مالك: الأمر الذي لا اختلاف فيه عندنا في الرهن: أن ما كان من أمر يعرف هلاكه من أرض أو دار أو حيوان فهلك في يد المرتهن وعلم هلاكه فهو من الراهن، ومن هلك في يد المرتهن ولا يعلم هلاكه إلا بقوله فهو منه وهو لقيمته ضامن", en: "Muwatta 2137", es: "Muwatta 2137", fr: "Muwatta 2137", ur: "موطا 2137", tr: "El-Muvatta 2137 — Yahya, Malik'ten rivayetle: Rehinler konusunda aramızda ihtilaf bulunmayan husus şudur: Eğer bir şeyin, örneğin arazi, ev veya hayvan gibi, yok olacağı biliniyorsa ve rehin alanın elindeyken yok olursa ve yok olduğu biliniyorsa, sorumluluk rehin verene aittir. Eğer bir şey rehin alanın elindeyken yok olursa ve yok olduğu ancak onun beyanıyla biliniyorsa, sorumluluk ona aittir ve değerinden sorumludur.", id: "Al-Muwatta 2137 — Yahya dari Malik: Perkara yang tidak ada perbedaan pendapat di antara kami mengenai gadai adalah jika sesuatu diketahui akan binasa, seperti tanah, rumah, atau hewan, dan binasa saat berada dalam kepemilikan penerima gadai dan binasanya diketahui, maka itu menjadi tanggung jawab pemberi gadai. Dan jika sesuatu binasa saat berada dalam kepemilikan penerima gadai dan binasanya tidak diketahui kecuali berdasarkan pengakuannya, maka itu menjadi tanggung jawabnya, dan dia bertanggung jawab atas nilainya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر الذي لا اختلاف فيه عندنا في الرهن: أن ما كان من أمر يعرف هلاكه من أرض أو دار أو حيوان، فهلك في يد المرتهن وعلم هلاكه، فهو من الراهن، وإن ذلك لا ينقص من حق المرتهن شيئا. وما كان من رهن يهلك في يد المرتهن، فلا يعلم هلاكه إلا بقوله، فهو من المرتهن، وهو لقيمته ضامن. يقال له: صفه. فإذا وصفه أحلف على صفته وتسمية ماله فيه، ثم يقومه أهل البصر بذلك. فإن كان فيه فضل عما سمى فيه المرتهن أخذه الراهن، وإن كان أقل مما سمى، أحلف الراهن على ما سمى المرتهن، وبطل عنه الفضل الذي سمى المرتهن فوق قيمة الرهن. {cite:muwatta-maruf-1997 p.273} {cite:muwatta-maruf-1997 p.274}"
  tr: "Yahya dedi ki: Malik'in şöyle dediğini işittim: Rehinler konusunda aramızda ihtilaf bulunmayan husus şudur: Eğer bir şeyin, örneğin arazi, ev veya hayvan gibi, yok olacağı biliniyorsa ve rehin alanın elindeyken yok olursa ve yok olduğu biliniyorsa, o şey rehin verene aittir ve bu, rehin alanın hakkını hiçbir şekilde azaltmaz. Ancak, rehin verilen bir şey rehin alanın elindeyken yok olursa ve yok olduğu ancak onun beyanıyla biliniyorsa, o şey rehin alana aittir ve değerinden sorumludur. Ona şöyle denir: Tarif et. Tarif ederse, tarifine ve payını belirteceğine yemin eder. Sonra uzmanlar buna göre değerlendirir. Eğer değeri rehin alanın belirttiğinden fazlaysa, rehin veren onu alır. Eğer değeri belirttiğinden azsa, rehin veren rehin alanın belirttiğine yemin eder ve rehin alanın belirttiği fazlalık rehin değerinden düşülür. {cite:muwatta-maruf-1997 s.273} {cite:muwatta-maruf-1997 s.274}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Hal yang tidak ada perbedaan pendapat di antara kita mengenai gadai adalah jika sesuatu diketahui akan binasa, seperti tanah, rumah, atau hewan, dan binasa saat berada dalam kepemilikan penerima gadai, dan binasanya diketahui, maka itu menjadi milik pemberi gadai, dan ini tidak mengurangi hak penerima gadai sedikit pun. Namun, jika sesuatu yang digadaikan binasa saat berada dalam kepemilikan penerima gadai, dan binasanya hanya diketahui melalui pernyataannya, maka itu menjadi milik penerima gadai, dan dia bertanggung jawab atas nilainya. Dia diberitahu: Jelaskanlah. Jika dia menjelaskannya, dia bersumpah atas penjelasannya dan untuk menentukan bagiannya. Kemudian, para ahli menilainya sesuai dengan itu. Jika nilainya lebih dari yang ditentukan oleh penerima gadai, pemberi gadai mengambilnya. Jika nilainya kurang dari yang ditentukannya, pemberi gadai bersumpah atas apa yang ditentukan oleh penerima gadai, dan kelebihan yang ditentukan oleh penerima gadai di atas nilai gadai dibatalkan. {kutip:muwatta-maruf-1997 hal.273} {kutip:muwatta-maruf-1997 hal.274}"
