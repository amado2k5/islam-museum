label: { ar: "الموطأ 2137 — يحيى عن مالك: الأمر الذي لا اختلاف فيه عندنا في الرهن: أن ما كان من أمر يعرف هلاكه من أرض أو دار أو حيوان فهلك في يد المرتهن وعلم هلاكه فهو من الراهن، ومن هلك في يد المرتهن ولا يعلم هلاكه إلا بقوله فهو منه وهو لقيمته ضامن", en: "Muwatta 2137" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر الذي لا اختلاف فيه عندنا في الرهن: أن ما كان من أمر يعرف هلاكه من أرض أو دار أو حيوان، فهلك في يد المرتهن وعلم هلاكه، فهو من الراهن، وإن ذلك لا ينقص من حق المرتهن شيئا. وما كان من رهن يهلك في يد المرتهن، فلا يعلم هلاكه إلا بقوله، فهو من المرتهن، وهو لقيمته ضامن. يقال له: صفه. فإذا وصفه أحلف على صفته وتسمية ماله فيه، ثم يقومه أهل البصر بذلك. فإن كان فيه فضل عما سمى فيه المرتهن أخذه الراهن، وإن كان أقل مما سمى، أحلف الراهن على ما سمى المرتهن، وبطل عنه الفضل الذي سمى المرتهن فوق قيمة الرهن. {cite:muwatta-maruf-1997 p.273} {cite:muwatta-maruf-1997 p.274}"
