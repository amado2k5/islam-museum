text: "… حتى صار شقياً، وأخذ الأمير سيف الدين قطز خطه بمائة ألف دينار، وقد هجاه بهاء الدين زهير بن علي، فقال : اللّٰهُ فصاعدا صاعداً وأباهُ لعن وبنيهِ فنازلاً واحداً ثم واحدا ثم قتل بعد ذلك كله ودفن بالقرافة، وقد رثاه …"
summary:
  ar: "مقطع من البداية والنهاية، المجلد المصوَّر 1، ص 216، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Bidaya wa-l-Nihaya, scan volume 1, p. 216, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "البدایہ والنہایہ، اسکین جلد 1، ص 216 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Bidaya wa-l-Nihaya, volume numérisé 1, p. 216, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Bidaya wa-l-Nihaya, volumen escaneado 1, p. 216, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Başlangıç ve Son\" adlı eserin 1. resimli cildinin 216. sayfasından, ölen kişi için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Awal dan Akhir,\" Jilid Bergambar 1, halaman 216, berisi elegi dan eulogi untuk almarhum; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
