label: { ar: "صحيح مسلم 6334 — القراء", en: "Sahih Muslim 6334 — the readers", ur: "صحیح مسلم 6334 — قراء", es: "Sahih Muslim 6334 — los lectores", fr: "Sahih Muslim 6334 — les lecteurs" }
text: "… فَنَتَحَدَّثُ إِلَيْهِ - وَقَالَ ابْنُ نُمَيْرٍ عِنْدَهُ - فَذَكَرْنَا يَوْمًا عَبْدَ اللَّهِ بْنَ مَسْعُودٍ فَقَالَ لَقَدْ ذَكَرْتُمْ رَجُلاً لاَ أَزَالُ أُحِبُّهُ بَعْدَ شَىْءٍ سَمِعْتُهُ مِنْ رَسُولِ اللَّهِ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" خُذُوا الْقُرْآنَ مِنْ أَرْبَعَةٍ مِنِ ابْنِ أُمِّ عَبْدٍ - فَبَدَأَ بِهِ - وَمُعَاذِ بْنِ جَبَلٍ وَأُبَىِّ بْنِ كَعْبٍ وَسَالِمٍ مَوْلَى أَبِي حُذَيْفَةَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6334، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih Muslim, no. 6334 (The Book of the Merits of the Companions), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح مسلم کی حدیث نمبر 6334، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 6334 (El Libro de los Méritos de los Compañeros), menciona a los lectores. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un récit du Sahih Muslim, n° 6334 (Livre des mérites des Compagnons), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran le répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
