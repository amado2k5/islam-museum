label: { ar: "الموطأ 1757 — مالك: بلغه أن النبي دخل على أم سلمة وهي حاد على أبي سلمة وقد جعلت على عينيها صبرا، فقال اجعليه بالليل وامسحيه بالنهار", en: "Muwatta 1757", es: "Muwatta 1757", fr: "Muwatta 1757", ur: "موطا 1757", tr: "El-Muvatta 1757 — Malik: Peygamberin, Ebu Seleme'nin ölümüne yas tutan Ümmü Seleme'nin yanına girdiği ve gözlerine aloe vera sürdüğü kendisine bildirildi. Bunun üzerine Peygamber şöyle buyurdu: \"Geceleyin sürün, gündüz silin.\"", id: "Al-Muwatta 1757 — Malik: Ia diberitahu bahwa Nabi masuk menemui Umm Salamah ketika ia sedang berduka atas Abu Salamah dan meletakkan lidah buaya di matanya, lalu beliau berkata: Oleskanlah di malam hari dan bersihkan di siang hari." }
text: "اجْعَلِيهِ فِي اللَّيْلِ وَامْسَحِيهِ بِالنَّهارِ"
summary:
  ar: "يروي مالك أنه بلغه أن رسول الله دخل على أم سلمة وهي حاد على أبي سلمة، وقد جعلت على عينيها صبرا، فقال: اجعليه في الليل وامسحيه بالنهار. {cite:muwatta-maruf-1997 p.116}"
  tr: "Malik rivayet eder ki, Resulullah Ümmü Seleme'nin yanına girdiğini, Ümmü Seleme'nin Ebu Seleme'nin ölümüne yas tuttuğunu ve gözlerine aloe vera sürdüğünü işitmiştir. Resulullah şöyle buyurmuştur: \"Geceleyin sürün, gündüz silin.\" {cite:muwatta-maruf-1997 s.116}"
  id: "Malik meriwayatkan bahwa ia mendengar Rasulullah SAW memasuki rumah Umm Salamah ketika ia sedang berduka atas meninggalnya Abu Salamah, dan Umm Salamah telah mengoleskan lidah buaya di matanya. Beliau bersabda: Oleskanlah pada malam hari dan bersihkanlah pada siang hari. {cite:muwatta-maruf-1997 p.116}"
