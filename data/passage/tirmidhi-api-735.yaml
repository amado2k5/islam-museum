text: "… كُنْتُ أَنَا وَحَفْصَةُ، صَائِمَتَيْنِ فَعُرِضَ لَنَا طَعَامٌ اشْتَهَيْنَاهُ فَأَكَلْنَا مِنْهُ فَجَاءَ رَسُولُ اللَّهِ فَبَدَرَتْنِي إِلَيْهِ حَفْصَةُ وَكَانَتِ ابْنَةَ أَبِيهَا فَقَالَتْ يَا رَسُولَ اللَّهِ إِنَّا كُنَّا صَائِمَتَيْنِ فَعُرِضَ لَنَا طَعَامٌ اشْتَهَيْنَاهُ فَأَكَلْنَا مِنْهُ. قَالَ \" اقْضِيَا يَوْمًا آخَرَ مَكَانَهُ \". قَالَ أَبُو عِيسَى وَرَوَى صَالِحُ بْنُ أَبِي الأَخْضَرِ وَمُحَمَّدُ بْنُ أَبِي حَفْصَةَ هَذَا الْحَدِيثَ عَنِ الزُّهْرِيِّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 735، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 735 (The Book on Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 735، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 735 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 735 (Le Livre du jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
