text: "… في كتابهم. وعندهم أنهم الاثنا عشر عظيماً المبشر بهم، المتقدم ذكرهم وكذبوا في تأويلهم ذلك. وكان إسماعيل رسولاً إلى أهل تلك الناحية وما والاها، من قبائل جرهم والعماليق وأهل اليمن، صلوات الله وسلامه عليه. ولما حضرته الوفاة أوصى إلى أخيه …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 282، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 282, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 282 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
