text: "… فِيهِ وَلا يَصحُ حَمْلُ الْحَدِيث عَلَى مَا ذَكَرُوهُ لِوَجْهَيْنٍ: وَاحِدٍ مِنْهُمَا مَا كَانَ مُحَرَّماً عَلَيْهِ قَبْلَهُ، وَكَذَلِكَ الصُّلْحُ بِمَعْنَى الْهِبَةِ، أَدَاءِ مَا كَانَ وَاجِباً عَلَيْهِ. الثَّانِي: أَنْهُ لَوْ حَلْ بِهِ الْمُحَرَّمُ، لَكَانَ الصُلْحُ صَحيحاً، فَإِنَّ الصَلْحَ الْفَاسِدَ لا يُحِلُ الْحَرَامَ، …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1023، يذكر ما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 1023, that mentions what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
