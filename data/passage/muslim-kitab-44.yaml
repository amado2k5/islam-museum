  ar: "القسم 44 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضائل الصحابة رضي الله تعالي عنهم»، ويضم فيها النصوص من 6169 إلى 6499 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 44 of Sahih Muslim (The Book of the Merits of the Companions) in the division of the open hadith dataset the museum took its reports from: reports 6169 to 6499 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 44، عنوان «کتاب فضائل الصحابۃ رضی اللہ تعالی عنہم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6169 تا 6499۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
