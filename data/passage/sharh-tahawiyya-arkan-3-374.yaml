text: "… على مسائل كثيرة تدخل تحت أركان الإيمان الستة، وذَكَرَ فيها كعادة من ألّف في عقائد السلف ما يتصل بذل، الاحق بالخلافة ن الكلام فى الصحابة وما وقع من الفتن والكلام فى من والكلام في العشرة المبشرين بالجنّة، وما أشبه ذلك …"
