text: "… لعل عزرائيل يتركني وياخذُك قال الشيخ لا مرأتِهِ، وهو في مرض الموت: أيَّتُها المرأةُ العزيزةُ البسي ثيابك الفاخرة، وتزيّني أحسن زينة، ومشّطي رأسك واغسلِي وجهِك، واعملي كلَّ أنواع التبرُّج والزينة، وتعالي أمامي. فقالت له: يا سيدي كيف أدعُ خدمتك في …"
summary:
  ar: "قال جحا لزوجته وهو على فراش الموت أن تتزين وتتجمل، آملاً أن يأخذها ملك الموت بدلاً منه. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  en: "On his deathbed Juha tells his wife to dress up and make herself beautiful, hoping the angel of death will take her instead of him. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  ur: "جحا نے بستر مرگ پر اپنی بیوی سے کہا کہ بن سنور کر خوبصورت ہو جائے، اس امید میں کہ موت کا فرشتہ اس کی جگہ اسے لے جائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  fr: "Sur son lit de mort, Juha dit à sa femme de se parer et de se faire belle, espérant que l'ange de la mort la prendra à sa place. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  es: "En su lecho de muerte, Juha dice a su esposa que se arregle y se embellezca, con la esperanza de que el ángel de la muerte se la lleve a ella en su lugar. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  tr: "Ölüm döşeğinde Juha, karısına süslenip güzelleşmesini, ölüm meleğinin kendisi yerine onu almasını umduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 178}"
  id: "Di ranjang kematiannya, Juha menyuruh istrinya untuk berdandan dan mempercantik diri, dengan harapan Malaikat Maut akan mengambilnya sebagai pengganti dirinya. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
