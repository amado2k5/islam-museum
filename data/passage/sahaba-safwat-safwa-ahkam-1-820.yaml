text: "… النفس، ولا قوة كرد الغضب، ولا نور كنور اليقين، ولا يقين كاستصغار الدنيا، ولا معرفة كمعرفة النفس، ولا نعمة كالعافية من الذنوب، ولا عافية كمساعدة التوفيق، ولا زهد كقصر الأمل، ولا حرص كالمنافسة في الدرجات، ولا طاعة كأداء الفرائض، ولا …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 820، يرد فيه ذكر الفريضة والفرائض، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 820, whose wording mentions the obligation (farida), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
