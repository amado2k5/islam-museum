label: { ar: "نوادر جحا الكبرى، ص 59 — «أعطوني همياني أو أريكم ماذا أفعل»", en: "Nawadir Juha al-Kubra, p. 59 — 'Give Me My Purse or I Will Show You What I Do'", ur: "نوادر جحا الکبریٰ، ص 59 — «میری تھیلی دو ورنہ میں تمہیں دکھاؤں گا کہ کیا کرتا ہوں»", fr: "Nawadir Juha al-Kubra, p. 59 — « Rendez-moi ma bourse ou je vous montrerai ce que je fais »", es: "Nawadir Juha al-Kubra, p. 59 — «Devuélvanme mi bolsa o les mostraré lo que hago»", tr: "Juha'nın Muhteşem Fıkraları, s. 59 — “Çantamı ver yoksa sana neler yapabileceğimi göstereceğim.”", id: "Anekdot Hebat Juha, hlm. 59 — “Berikan dompetku atau aku akan menunjukkan apa yang bisa kulakukan.”" }
text: "… أعطوني هِمياني أو أُرِيكُم ماذا أفعل كان الشيخ ضيفاً في إحدى القرى، فضاع هِميانُهُ خرجه، فقال لأهل القرية: إما أنْ تجدوا لي خرجي، أو أنِّي أعرف ماذا أصنع. ولما كان الفلاحون يعرفون أن الشيخ، من أعيان البلد، حاروا في أمرهم، …"
summary:
  ar: "نزل جحا ضيفًا في قرية وضاع منه همیانه، فقال لأهل القرية أن يجدوه وإلا أراهم ما يفعل؛ فوجدوه، فقال لهم إنه لولا ذلك لجعل سجادة تقوم مقام الكيس. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  en: "Juha, a guest in a village, loses his purse, called a hemyan; he tells the villagers to find it or he will show them what he does; they find it, and he says that otherwise he would have made a carpet serve as a bag. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  ur: "جحا ایک گاؤں میں مہمان تھا کہ اس کی ہمیانی نام کی تھیلی گم ہو گئی؛ اس نے گاؤں والوں سے کہا کہ اسے ڈھونڈ دو ورنہ میں دکھاؤں گا کہ میں کیا کرتا ہوں؛ انہوں نے تھیلی ڈھونڈ دی، تو اس نے کہا کہ ورنہ میں قالین کو تھیلی بنا لیتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  fr: "Juha, invité dans un village, perd sa bourse, appelée hemyan; il dit aux villageois de la retrouver, sinon il leur montrera ce qu'il fait; ils la retrouvent, et il dit que sinon il aurait fait d'un tapis un sac. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  es: "Juha, invitado en una aldea, pierde su bolsa, llamada hemyan; les dice a los aldeanos que la encuentren o les mostrará lo que hace; la encuentran, y él dice que, de no ser así, habría usado una alfombra como bolsa. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  tr: "Juha bir köyde misafirdi ve cüzdanını kaybetti. Köylülere cüzdanını bulmalarını, aksi takdirde onlara ne yapacağını göstereceğini söyledi. Cüzdanı buldular ve Juha onlara, eğer cüzdanı olmasaydı, kilimden cüzdan görevi göreceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 59}"
  id: "Juha adalah tamu di sebuah desa dan kehilangan dompetnya. Dia menyuruh penduduk desa untuk mencarinya atau dia akan menunjukkan kepada mereka apa yang akan dia lakukan. Mereka menemukannya, dan dia mengatakan kepada mereka bahwa jika bukan karena itu, dia akan membuat permadani untuk dijadikan dompet. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
