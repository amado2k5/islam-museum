label: { ar: "سنن أبي داود 3309 — الأب والأبوة", en: "Sunan Abi Dawud 3309 — the father and fatherhood", ur: "سنن ابی داؤد 3309 — باپ اور والدیت", es: "Sunan Abi Dawud 3309 — El padre y la paternidad", fr: "Sunan Abi Dawud 3309 — Le père et la paternité", tr: "Sunan Abi Dawud 3309 — Baba ve Babalık", id: "Sunan Abi Dawud 3309 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَطَاءٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، بُرَيْدَةَ : أَنَّ امْرَأَةً، أَتَتْ رَسُولَ اللَّهِ فَقَالَتْ : كُنْتُ تَصَدَّقْتُ عَلَى أُمِّي بِوَلِيدَةٍ، وَإِنَّهَا مَاتَتْ وَتَرَكَتْ تِلْكَ الْوَلِيدَةَ. قَالَ : \" قَدْ وَجَبَ أَجْرُكِ، وَرَجَعَتْ إِلَيْكِ فِي الْمِيرَاثِ \". قَالَتْ : وَإِنَّهَا مَاتَتْ وَعَلَيْهَا صَوْمُ شَهْرٍ. …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3309، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3309 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3309، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3309 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3309 (Serments et Vœux), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 3309 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3309, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
