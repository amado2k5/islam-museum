label: { ar: "سنن أبي داود 4679 — بر الوالدين أو عقوقهما", en: "Sunan Abi Dawud 4679 — dutifulness to the parents or disobedience to them", ur: "سنن ابی داؤد 4679 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Abi Dawud 4679 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan Abi Dawud 4679 — le respect des parents ou la désobéissance envers eux" }
text: "… ابْنِ الْهَادِ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" مَا رَأَيْتُ مِنْ نَاقِصَاتِ عَقْلٍ وَلاَ دِينٍ أَغْلَبَ لِذِي لُبٍّ مِنْكُنَّ \". قَالَتْ وَمَا نُقْصَانُ الْعَقْلِ وَالدِّينِ قَالَ \" أَمَّا نُقْصَانُ الْعَقْلِ فَشَهَادَةُ امْرَأَتَيْنِ شَهَادَةُ رَجُلٍ وَأَمَّا نُقْصَانُ الدِّينِ فَإِنَّ إِحْدَاكُنَّ تُفْطِرُ رَمَضَانَ وَتُقِيمُ أَيَّامًا لاَ تُصَلِّي \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4679، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4679 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4679، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4679 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4679 (Conduite exemplaire du Prophète (Kitab Al-Sunnah)), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
