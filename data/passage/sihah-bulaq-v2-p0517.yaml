text: |-
  قول أسم حصن للعوأك بناه
  أبوه أو سلمان عليه السلام كمافى
  القاموس اه معصه
  اين العنبرين عمروين تميم
  رددنا جمع سابوروأتم • بهواة متالفها كثير
  تظل جياده متمطرات * برازيقا تصبح ٢وتغير
  يعنى بماعات الخيل رشف) المبرنشق الفرح المسرود وقدابرنشق قال الراجز
  أو أن ترى كاباء لم تبرنشقى * وقال الاصعى خدّثت الرشيد يحديث فابرنشق ورءا قالوا
  ابرنشق الشجراذا أزهر رق) البزاق البصاق وقديزق برقا سق البساق
  البصلق وقد بسق بسقاوبسق النخل بسوقا أى طال ومنه قوله تعالى والنخل باسقات ويقال
  بسق فلان على أصحابه أى علاهم وأبسقت الناقة اذا وقع فى ضرعها الابأقبل النتاج فهى
  مدسق ونوق مباسيق ( بصق البصاق البزاق وقد إصحق بصقا والبصاق جنس من
  النخل ويقال لحجرأ بيض يتلالا بصاقة القمر بطق) البطاقة بالكسر رقيعة توضع
  فى الثوب فيها رقم التمن بلغة أهل مصر يقال سميت بذلك لانها تشديطاقة من هدب الثوب
  طرق) البطريق القائد من قواد الروم وهو معرب والجع البطارقة ( ق
  وجودهرون اذا تدفقا • جود كود الغيث اذا تبعقا
  والانبعاق أن يمبعق عليك الذئ مفاجأة وأنت لا تشعر قان الشاعر
  بيها المرء آمن راعدرا * تع حتف لم يخش منه انبعاقه
  وفى الحديت انّ اللّٰه يكره الانبعاق فى الكلام فرحم اللّٰه عبدا أوجز فى كلامه وبعقت زق
  المرتبعيا أى شققته وفى الحديث يبعقون اقاحنا قال أبو عييد أى ينحرون ابلنا
  ويسيلون دماءها ويقال عقاب بعنقاة مثل عقنياة ق البقة البعوضة والجمع
  البق والبقسة اسم موضع قريب من الحيرة ورجل بقاف وبقاقة أى كثير الكلام والها
  للمبالغة قال الراجز* أخرس فى اركب بقاق المنزل * وكذلك البقباق وأيق الرجل
  أى كثر كلامه واليقيقة حكاية صوت يقال يقبق المكوز ويقت المرأة وأيقت أى كثرولدها
  وبقت السهاء أى جامت بطرشديد لعف البلعق نوع من التمرقال الاصمعىّ أجود
  تمرعمان الف-رض والبلعق ⁦(بلق )⁩ البلف سواد وياض وكذلك البلقة بالمضم وفرس
  أيلق وفرس بلقاء وقد ابلقَ آبلقافا وفى المثل يجرى بليق ويذمّ وهو اسم فرس كان يسبق
  نليسل وهو مع ذلك يعاب والابلق اسم حصن للسموأل بن عادياء يأرص تيماء وو المثل
  تمرد مارد وعز الابلق وهماحصنان قصدته مازياء ملكة الجزيرة فلمالم تقدر عليه ما قالت
  ذلك والبان الفسطاط قال امر والقيس
  فديأت وسط قبابه بلق • وليأت وسطخيسه رجلى
  والبلقاءمدينة بالشأم وبلقت البساب وأيلقته اذافتحته كله فانبلق . ومنه قول الشاعر
  والحصن منعلم والباب منبلق,،,والبلاليق الموامى الواحدة يلوقة وهى المفاذة ثق
  البلائق المياء المستنقعات قال امر والمقيم
  فاوردها
