text: "… يَستحبّون أن يُلَقِّنُوا العبدَ محاسنَ عمله عند موته لكَيْ يُحسِن ظنَّه بربّه - قال وحدثنا عبد اللّٰه، ثنا سوار بن عبد اللّٰه العنبري، ثنا المعتمر بن سليمان قال: قال لي أبي - حين حضرته الوفاةُ: يا معتمر حدِّثني بالرُّخص لعلّي …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 7، يرد فيه ذكر المستحب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 7, whose wording mentions the recommended (mustahabb), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 7 کا اقتباس جس میں مستحب، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 7, dont le texte mentionne le recommandé (mustahabb), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 7, cuyo texto menciona lo recomendado (mustahabb), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"Şu'ab el-İman\" (İman Dalları) adlı eserinin 2. cildinin 7. sayfasından, müstehaplı ve caiz amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu bölüm, farz ameller, itaat amelleri, müstehaplı ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Shu'ab al-Iman\" (Cabang-Cabang Iman) karya Al-Bayhaqi, Jilid 2, halaman 7, yang menyebutkan amalan yang dianjurkan dan amalan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
