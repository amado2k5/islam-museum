text: "… فَأَنْزَلَ اللَّهُ فِيهِمَا مَا ذُكِرَ فِي الْقُرْآنِ مِنَ التَّلاَعُنِ، فَقَالَ لَهُ رَسُولُ اللَّهِ \" قَدْ قُضِيَ فِيكَ وَفِي امْرَأَتِكَ \". قَالَ فَتَلاَعَنَا، وَأَنَا شَاهِدٌ عِنْدَ رَسُولِ اللَّهِ فَفَارَقَهَا فَكَانَتْ سُنَّةً أَنْ يُفَرَّقَ بَيْنَ الْمُتَلاَعِنَيْنِ وَكَانَتْ حَامِلاً، فَأَنْكَرَ حَمْلَهَا وَكَانَ ابْنُهَا يُدْعَى إِلَيْهَا، ثُمَّ جَرَتِ السُّنَّةُ فِي الْمِيرَاثِ أَنْ يَرِثَهَا، وَتَرِثَ مِنْهُ مَا فَرَضَ اللَّهُ لَهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 4746، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4746 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4746، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4746 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
