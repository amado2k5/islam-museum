label: { ar: "نوادر جحا الكبرى، ص 87 — «لماذا تنظر ولا تأكل؟»", en: "Nawadir Juha al-Kubra, p. 87 — 'Why Do You Stare and Not Eat?'", ur: "نوادر جحا الکبریٰ، ص 87 — «تم دیکھتے کیوں ہو اور کھاتے کیوں نہیں؟»", fr: "Nawadir Juha al-Kubra, p. 87 — « Pourquoi regardes-tu sans manger ? »", es: "Nawadir Juha al-Kubra, p. 87 — «¿Por qué miras y no comes?»", tr: "Juha'nın Muhteşem Fıkraları, s. 87 — “Neden bakıyorsun da yemiyorsun?”", id: "Anekdot Hebat Juha, hlm. 87 — “Mengapa kamu melihat-lihat dan tidak makan?”" }
text: "… لماذا تنظر ولا تأكُلُ؟ ذهب من بلدته آقَ شَهْرٌ إلى سيوري حصار، وكان جائعاً وكيسه فارغاً، فمرّ بالسوق، ورأى باعة الخبز يخرجونه من الفرن طرياً، وقدٍ أنتشرت روائحُهُ الزكية، فقال للخباز : هل هذا الخبز لك؟ فقال : نعم. فكرَّر …"
summary:
  ar: "سافر جحا جائعًا مفلسًا من آق شهر إلى سيوري حصار، ورأى الخبازين يخرجون الخبز الطازج من الفرن؛ فسأل هل كل الخبز للخباز، فقالوا نعم؛ فقال إذن لماذا يقف ينظر بدل أن يأكل. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  en: "Hungry and penniless, Juha travels from Akshehir to Siwri Hisar and sees bakers pulling fresh bread from the oven; he asks if all the bread is the baker's; yes; he says then why stand and stare instead of eating. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  ur: "بھوکا اور بے پیسہ جحا آق شہر سے سیوری حصار گیا اور نانبائیوں کو تنور سے تازہ روٹیاں نکالتے دیکھا؛ اس نے پوچھا کہ کیا یہ ساری روٹیاں نانبائی کی ہیں؛ جواب ملا ہاں؛ تو اس نے کہا کہ پھر کھڑے ہو کر دیکھنے کی بجائے کھاتے کیوں نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  fr: "Affamé et sans le sou, Juha va d'Akşehir à Siwri Hisar et voit des boulangers sortir du pain frais du four; il demande si tout ce pain est au boulanger; on lui dit que oui; il dit alors pourquoi rester à regarder au lieu de manger. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  es: "Hambriento y sin un céntimo, Juha viaja de Akşehir a Siwri Hisar y ve a unos panaderos sacar pan fresco del horno; pregunta si todo ese pan es del panadero; le dicen que sí; dice entonces por qué se quedan mirando en lugar de comer. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  tr: "Juha, Akşehir'den Sivrihisar'a aç ve parasız bir şekilde yolculuk etti ve fırıncıların fırından taze ekmek çıkardığını gördü. Tüm ekmeklerin fırıncıya ait olup olmadığını sordu ve onlar da evet dediler. Bunun üzerine, \"Öyleyse neden yemek yerine ayakta durup izliyor?\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 87}"
  id: "Juha melakukan perjalanan dalam keadaan lapar dan tanpa uang sepeser pun dari Aqshehir ke Sivrihisar, dan melihat para tukang roti mengeluarkan roti segar dari oven. Dia bertanya apakah semua roti itu milik tukang roti, dan mereka menjawab ya. Kemudian dia berkata, \"Lalu mengapa dia berdiri dan menonton alih-alih makan?\" {cite:juha-nawadir-kubra-djuwaydi p. 87}"
