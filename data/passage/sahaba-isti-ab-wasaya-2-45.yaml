text: "… وأبو الحُضَير، وأبو عيسيِ، وذكر له في موضع آخر خمس كنى، وذكر له أَبو الخَطَّاب بَين العمودين من بني عبد الأَشْهلِ حتى الحسن علي بن عمر الدّارَقُطْني كنيةً سادسة : أَبو وضعه بالبقيع، وصَلَّى عليه. وأوصى إِلى عمر بن عتيق، …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 45، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
