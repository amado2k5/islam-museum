text: |-
  أى وأخلاطهم وقوله تعالى -شنابكم لفيفا أى مجتمعين مختلطين وطعام لفيق اذا كان
  مخلوطا من جنسين فصاعدارفلان لفيف فلان أى صديقه وياب من العربية بقال له اللفيف
  لاجتماعالرفين المعتلين فى تلائيه فحوذوى وحي والالساف الاشجاريلتن بعضها ببعض
  ومنه قوله تمالى وجنات ألفافا واحدها لف بالسكسر ومنه قولهم كالفا أى مجتمعيز فى
  موضع واحد ورجل ألف بين اللنف أى عىّ بطئ الكلام اذاتكام ملا لسانه فه قال
  السكميت
  . ولاية سلغد أتف كانه • من الرهق الخلوط بالنوك أثول
  والالفّ أيضا الرجل النقيسل البطى وامرأذ افاخخمة الفخذين مكتزة ونفذان لفاوان
  تساهم توباهافتى الدرع رأدة * وفى المرط لفاوان رد فهما عبل
  قوله تساهم أى تقارع ويقال ألف الطائرر أسه تحت جناحه وفى أرض بنى فلان تلافيف
  من عشب أى نبات ملتف قال الاصعىّ الالقّ الموضع اللتذ المكثير الاهل وأنشد
  لساعدة بن جوية الهذلى
  ومقامهن اذا -بسن بمأزم * ضبق ألف وصدّهنّ الاخشب
  ل ف لقفت الشى بالكسر ألقفه لقفا وتلقفته أيضا أى تناوله بسرعة عن يعقوب
  يقال رجل ثقف لقف أى خفيف حاذق والأقف بالتحريلك سقوط الحائط وقد لقف الحوض
  لففا أى تهوّر من أسفل. واتسع وحوض لقف قال خويلد
  كابى الرماد عظيم القدر جفنته * حين الشتاء كموض المنهل اللقف
  واللقيف مثله ومنه قول أب ذوّيب
  فلم ترغير عادية زاما كما يتفجر الحوض اللقيف
  ويقال الملان والاوّله والصحيح والعادية القوم يعدون على أرجلهم أى فى ملتهم (زام كانهم
  زد وه لا يفارقون ماهم فيه والالقاف جوانب البئر والحوض مثل الالجاف الواحداقف
  لجف لهف ) لهف بالسكسر يلهف لهفا أى حزن وتحسر وكذلك التلهف على
  الشئ ؤة راهم يالهف ذلان كلة يتحسر بهاء-لى ماقات وقول الشاءر
  ذلست بدرك مافات فى • بلهف ولا بليت ولالوانى
  أراد لهفاه فخذف والملهوف المظلوم يستغيث واللهيف المضطر واللهفان المتحسر
  يف الليف للنخل الواحدة ليفة
  سل انون ف أبوز يدنئفت من الطعام أنأف نأفااذا أكات منه
  وقال غيره نتف فى الشرب أى ارتوى (نتف نتفت الشعر تتفافانتف الشعر
  وتناتف ونتفت الشعور شدّد للكثرة والمنتاف المنتاخ والنتافة ماسقط من النتف والنتفة
  ما نتفته بأصابعك من النبت أو غيره والجمع النسف ويقال رجل نتفة مثال همزة للذى ينتف
  من العلم شبأولا يستقصيه ⁦( جف)⁩ التجف والنجفة بالتحريك مكان لا يعلوه الماء
  مستطيل منقادوالجمع نجاف والنجاف أيضا العتبة وهى أسكفة البساب عن الاصمعى ويقال
  قوله وفلان لفيف الخ فى التاموس
  وقول الجوهرى لفيفه صديقه
  غلط والصراب لغيفه بالغين اه
  كنبه المصحيح
  الخضرى اه
