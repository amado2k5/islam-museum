label: { ar: "سنن النسائي 4003 — إبدال السيئة حسنة", en: "Sunan al-Nasa'i 4003 — a bad deed exchanged for a good one", ur: "سنن نسائی 4003 — برائی کا نیکی سے بدل جانا", es: "Sunan al-Nasa'i 4003 — una mala acción intercambiada por una buena", fr: "Sunan al-Nasa'i 4003 — une mauvaise action échangée contre une bonne", tr: "Sunan an-Nasa'i 4003 — Kötü bir ameli iyi bir aleme çevirmek", id: "Sunan an-Nasa'i 4003 — Mengganti perbuatan buruk dengan perbuatan baik" }
text: "… النَّبِيَّ قَالُوا يَا مُحَمَّدُ إِنَّ الَّذِي تَقُولُ وَتَدْعُو إِلَيْهِ لَحَسَنٌ لَوْ تُخْبِرُنَا أَنَّ لِمَا عَمِلْنَا كَفَّارَةً. فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ { وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ } إِلَى { فَأُولَئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ } قَالَ يُبَدِّلُ اللَّهُ شِرْكَهُمْ إِيمَانًا وَزِنَاهُمْ إِحْصَانًا وَنَزَلَتْ { قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَى أَنْفُسِهِمْ } الآيَةَ."
summary:
  ar: "حديث في سنن النسائي، رقم 4003، يذكر إبدال السيئة حسنة. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 4003 (The Book of Fighting [The Prohibition of Bloodshed]), that speaks of a bad deed exchanged for a good one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 4003، جس میں برائی کا نیکی سے بدل جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4003 (El Libro de la Lucha [La Prohibición del Derramamiento de Sangre]), que habla de una mala acción que se intercambia por una buena. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4003 (Le Livre du Combat [L'Interdiction du Sang]), évoque le remplacement d'une mauvaise action par une bonne. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent une action."
  tr: "Sunan-ı Nesai'de yer alan 4003 numaralı hadis, kötü bir amelin iyi bir amel ile değiştirilmesinden bahseder. Bu hadis, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte, iyi ve kötü ameller listesiyle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4003, menyebutkan penggantian amal buruk dengan amal baik. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
