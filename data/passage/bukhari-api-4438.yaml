label: { ar: "صحيح البخاري 4438 — ساعة الاحتضار والوفاة", en: "Sahih al-Bukhari 4438 — a deathbed and last hours", ur: "صحیح بخاری 4438 — وقتِ وفات اور آخری لمحات", es: "Sahih al-Bukhari 4438 — un lecho de muerte y últimas horas" }
text: "… الرَّحْمَنِ سِوَاكٌ رَطْبٌ يَسْتَنُّ بِهِ، فَأَبَدَّهُ رَسُولُ اللَّهِ بَصَرَهُ، فَأَخَذْتُ السِّوَاكَ فَقَصَمْتُهُ وَنَفَضْتُهُ وَطَيَّبْتُهُ، ثُمَّ دَفَعْتُهُ إِلَى النَّبِيِّ فَاسْتَنَّ بِهِ، فَمَا رَأَيْتُ رَسُولَ اللَّهِ اسْتَنَّ اسْتِنَانًا قَطُّ أَحْسَنَ مِنْهُ، فَمَا عَدَا أَنْ فَرَغَ رَسُولُ اللَّهِ رَفَعَ يَدَهُ أَوْ إِصْبَعَهُ ثُمَّ قَالَ \" فِي الرَّفِيقِ الأَعْلَى \". ثَلاَثًا ثُمَّ قَضَى، وَكَانَتْ تَقُولُ مَاتَ بَيْنَ حَاقِنَتِي وَذَاقِنَتِي."
summary:
  ar: "حديث في صحيح البخاري، رقم 4438، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4438 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4438، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4438 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
