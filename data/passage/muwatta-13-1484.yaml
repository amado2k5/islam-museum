label: { ar: "الموطأ 1484 — مالك: لا ينبغي أن يرث أحد أحدا بالشك، ولا يرث إلا باليقين من العلم والشهداء، فميراث الرجل يكون لأولى الناس به من الأحياء", en: "Muwatta 1484" }
summary:
  ar: "يقول مالك لا ينبغي أن يرث أحد أحدا بالشك، ولا يرث أحد أحدا إلا باليقين من العلم والشهداء، وذلك أن الرجل يهلك هو ومولاه الذي أعتقه أبوه، فيقول بنو الرجل العربي قد ورثه أبونا، فليس ذلك لهم أن يرثوه بغير علم ولا شهادة أنه مات قبله، وإنما يرثه أولى الناس به من الأحياء. {cite:muwatta-maruf-1997 p.25}"
