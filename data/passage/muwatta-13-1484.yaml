label: { ar: "الموطأ 1484 — مالك: لا ينبغي أن يرث أحد أحدا بالشك، ولا يرث إلا باليقين من العلم والشهداء، فميراث الرجل يكون لأولى الناس به من الأحياء", en: "Muwatta 1484", es: "Muwatta 1484", fr: "Muwatta 1484", ur: "موطا 1484", tr: "El-Muvatta 1484 — Malik: Hiç kimse şüpheye dayanarak başkasından miras almamalıdır; miras ancak kesin bilgi ve şahitlere dayanır. Bir insanın mirası, yaşayanlar arasında kendisine en yakın olan kişiye geçer.", id: "Al-Muwatta 1484 — Malik: Tidak seorang pun boleh mewarisi dari orang lain berdasarkan keraguan, dan warisan hanya berdasarkan kepastian pengetahuan dan saksi. Warisan seseorang diberikan kepada orang yang paling dekat dengannya di antara orang-orang yang masih hidup." }
summary:
  ar: "يقول مالك لا ينبغي أن يرث أحد أحدا بالشك، ولا يرث أحد أحدا إلا باليقين من العلم والشهداء، وذلك أن الرجل يهلك هو ومولاه الذي أعتقه أبوه، فيقول بنو الرجل العربي قد ورثه أبونا، فليس ذلك لهم أن يرثوه بغير علم ولا شهادة أنه مات قبله، وإنما يرثه أولى الناس به من الأحياء. {cite:muwatta-maruf-1997 p.25}"
  tr: "Malik, kimsenin sadece şüpheye dayanarak bir başkasından miras almaması gerektiğini ve kimsenin de bilgi ve şahitlere dayalı kesinlik olmadan bir başkasından miras almaması gerektiğini söyler. Çünkü eğer bir adam, babasının azat ettiği kölesiyle birlikte ölürse ve Arap adamın oğulları, \"Babamız ondan miras aldı\" derlerse, onun kendilerinden önce öldüğüne dair bilgi veya şahitlik olmadan ondan miras alma hakları yoktur. Aksine, ondan miras alacak kişi, hayatta olan en yakın akrabasıdır. {cite:muwatta-maruf-1997 s.25}"
  id: "Malik mengatakan bahwa tidak seorang pun boleh mewarisi dari orang lain hanya berdasarkan keraguan semata, dan tidak seorang pun boleh mewarisi dari orang lain kecuali dengan kepastian berdasarkan pengetahuan dan saksi. Hal ini karena jika seseorang meninggal bersama budaknya yang telah dibebaskan oleh ayahnya, dan anak-anak orang Arab itu berkata, \"Ayah kami mewarisi darinya,\" maka mereka tidak berhak mewarisi darinya tanpa pengetahuan atau kesaksian bahwa ia telah meninggal sebelum mereka. Sebaliknya, yang berhak mewarisi darinya adalah kerabat terdekat yang masih hidup. {cite:muwatta-maruf-1997 p.25}"
