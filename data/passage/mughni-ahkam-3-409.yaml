text: "… صَلاةِ الْعِيدَيْنِ. وَصَلاةُ الْعِيدِ فَرْضْ عَلَى الْكِفَايَةِ، فِي ظَاهِر الْمَذْهَبِ، إِذَا قَامَ بِهَا مَنْ يَكْفِي سَقَطَتْ عَنْ الْبَاقِينَ، وَإِنْ انِّفَقَ أَمْلُ بَلَدٍ عَلَى تَرْكِهَا قَاتَلَهُمْ الإِمَامُ. وَبِهِ قَالَ بَعْضُ أَصْحَابِ الشَّامِعِيَّ. وَقَالَ أَبُو حَيِيفَةَ: هِيَ وَاجِبَةً عَلَى الأَعْيانِ، وَلَيْسَتْ فَرْضاً، …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 409، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 409, whose wording mentions what was made obligatory on people, the obligatory (fard), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 409 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 3, p. 409, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent, l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mughni de Ibn Qudama, volumen digitalizado 3, p. 409, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen, lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 3. cildinin 409. sayfasından bir alıntı, insanlar için farz olan şeyleri, farz fiilleri, toplu yükümlülükleri ve bazıları tarafından yerine getirildikten sonra geri kalanlar için artık gerekli olmayan şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir baskıdan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Jilid 3, halaman 409, membahas tentang apa yang wajib dilakukan oleh manusia, perbuatan wajib, kewajiban kolektif, dan apa yang, jika dipenuhi oleh sebagian orang, tidak lagi diwajibkan bagi yang lain. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk perbuatan wajib, kewajiban, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
