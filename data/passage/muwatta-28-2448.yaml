summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن النبي نهى أن يُنبذ البسر والرطب جميعا، والتمر والزبيب جميعا. ويذكر المحقق أن الحديث في الموطأ مرسل، وأنه متصل من وجوه صحاح منها حديث ابن عباس وجابر وأبي قتادة وأبي سعيد وأنس وأبي هريرة. {cite:muwatta-maruf-1997 p.411}"
