  ur: { text: "خدا نے نہ تو بحیرہ کچھ چیز بنایا ہے اور نہ سائبہ اور نہ وصیلہ اور نہ حام بلکہ کافر خدا پر جھوٹ افترا کرتے ہیں اور یہ اکثر عقل نہیں رکھتے", translator: "Fateh Muhammad Jalandhari", license: PD }
