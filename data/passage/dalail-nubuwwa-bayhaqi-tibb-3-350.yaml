text: "المدينة فإنه ! يقال قد سمَّاها رسول اللّه وليه باسم غير الحُمَّى، وغير أم ملدم، فلم يُثبته، فلما انتهى من بلدٍ نجد الى ماءٍ من مياهه، يقال له : قَرْدَةُ أصابته الحُمَّى فمات بها، فلما مات عَمدت إمرأته إلى ما …"
