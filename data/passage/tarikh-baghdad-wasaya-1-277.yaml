text: "… محمد بن الحسين الزيفرانى قالا : حدثنا أبن أبى خيثمة قال سمعت يحى بن ممين يقول : شيبان ثقة، وهو صاحب كتاب رجل صالح، يقال إنه مات ببغداد فى خلاقة المهدى، ودفن فى مقابر الختزران. أخبرنا أحمد ابن عبد الله …"
