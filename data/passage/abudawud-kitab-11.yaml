summary:
  ar: "القسم 11 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المناسك»، ويضم فيها النصوص من 1721 إلى 2045 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 11 of Sunan Abi Dawud (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)) in the division of the open hadith dataset the museum took its reports from: reports 1721 to 2045 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 11، عنوان «کتاب المناسک»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1721 تا 2045۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 11 de Sunan Abi Dawud (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1721 al 2045, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait les hadiths du Sunan Abi Dawud (Les Rites du Hajj – Kitab Al-Manasik Wa'l-Hajj), dans la base de données ouverte (de 1721 à 2045). Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées les classent et les numérotent différemment."
