  en: "Sunan Abi Dawud, Book 11: The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)"
  ur: "سنن ابی داؤد، کتاب المناسک"
  es: "Sunan Abi Dawud, Libro 11: Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)"
