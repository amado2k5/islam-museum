label: { ar: "الموطأ 1799 — مالك: من اشترى عبدا فأجره بأجرة عظيمة أو غلة قليلة، ثم وجد به عيبا يرد منه، فإنه يرده وتكون له إجارته وغلته، وذلك ما كانت عليه الجماعة ببلدنا", en: "Muwatta 1799", es: "Muwatta 1799", fr: "Muwatta 1799", ur: "موطا 1799", tr: "El-Muvatta 1799 — Malik: Kim bir köle satın alıp onu yüksek bir ücret veya küçük bir kâr karşılığında kiraya verirse, sonra da kölede iadesini gerektiren bir kusur bulursa, onu iade edebilir ve ücretini ve kârını almaya hak kazanır. Ülkemizdeki toplum böyle yapardı.", id: "Al-Muwatta 1799 — Malik: Barang siapa membeli seorang budak dan menyewakannya dengan upah besar atau keuntungan kecil, kemudian mendapati cacat pada budak tersebut yang mengharuskan pengembaliannya, maka ia boleh mengembalikannya dan berhak atas upah dan keuntungannya. Inilah yang biasa dilakukan masyarakat di negara kita." }
summary:
  ar: "قال مالك في الرجل يشتري العبد فيؤاجره بالإجارة العظيمة، أو الغلة القليلة، ثم يجد به عيبا يرد منه: إنه يرده بذلك العيب، وتكون له إجارته وغلته. وذلك الأمر الذي كانت عليه الجماعة ببلدنا. وذلك لو أن رجلا ابتاع عبدا فبنى له دارا قيمة بنائها أضعاف ثمن العبد، ثم وجد به عيبا يرد منه، رده، ولا يحسب للعبد عليه إجارة فيما عمل له، فكذلك تكون له إجارته إذا آجره من غيره، لأنه ضامن له. {cite:muwatta-maruf-1997 p.137}"
  tr: "Malik, bir köle satın alıp onu yüksek bir ücret veya küçük bir kâr karşılığında kiraya veren ve daha sonra kölede iadesini gerektiren bir kusur bulan bir adam hakkında şöyle demiştir: Bu kusur nedeniyle köleyi iade edebilir ve hem ücretini hem de kârını almaya hak kazanır. Bu, ülkemizdeki toplumun uygulamasıydı. Benzer şekilde, bir adam bir köle satın alıp ona, yapım maliyeti kölenin fiyatının kat kat fazlası olan bir ev inşa ederse ve daha sonra kölede iadesini gerektiren bir kusur bulursa, onu iade edebilir ve köle yaptığı iş için herhangi bir ücret almaya hak kazanmaz. Aynı şekilde, köleyi başkasına kiraya verse bile, ondan sorumlu olduğu için ücretini almaya hak kazanır. {cite:muwatta-maruf-1997 s.137}"
  id: "Malik berkata mengenai seorang pria yang membeli seorang budak dan kemudian menyewakannya dengan upah besar atau keuntungan kecil, lalu menemukan cacat pada budak tersebut yang mengharuskan pengembaliannya: ia boleh mengembalikannya karena cacat tersebut, dan ia berhak atas upah dan keuntungannya. Ini adalah praktik masyarakat di negeri kita. Demikian pula, jika seorang pria membeli seorang budak dan membangun rumah untuknya yang biaya pembangunannya berkali-kali lipat harga budak tersebut, dan kemudian menemukan cacat pada budak tersebut yang mengharuskan pengembaliannya, ia boleh mengembalikannya, dan budak tersebut tidak berhak atas upah apa pun untuk pekerjaan yang telah dilakukannya. Demikian pula, ia berhak atas upahnya jika ia menyewakannya kepada orang lain, karena ia bertanggung jawab atas budak tersebut. {cite:muwatta-maruf-1997 p.137}"
