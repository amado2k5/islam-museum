label: { ar: "الموطأ 1799 — مالك: من اشترى عبدا فأجره بأجرة عظيمة أو غلة قليلة، ثم وجد به عيبا يرد منه، فإنه يرده وتكون له إجارته وغلته، وذلك ما كانت عليه الجماعة ببلدنا", en: "Muwatta 1799" }
summary:
  ar: "قال مالك في الرجل يشتري العبد فيؤاجره بالإجارة العظيمة، أو الغلة القليلة، ثم يجد به عيبا يرد منه: إنه يرده بذلك العيب، وتكون له إجارته وغلته. وذلك الأمر الذي كانت عليه الجماعة ببلدنا. وذلك لو أن رجلا ابتاع عبدا فبنى له دارا قيمة بنائها أضعاف ثمن العبد، ثم وجد به عيبا يرد منه، رده، ولا يحسب للعبد عليه إجارة فيما عمل له، فكذلك تكون له إجارته إذا آجره من غيره، لأنه ضامن له. {cite:muwatta-maruf-1997 p.137}"
