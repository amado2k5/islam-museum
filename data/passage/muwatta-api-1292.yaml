text: "… الثَّلاَثَةِ مِنْ حِينِ يُشْتَرَيَانِ حَتَّى تَنْقَضِيَ الأَيَّامُ الثَّلاَثَةُ فَهُوَ مِنَ الْبَائِعِ وَإِنَّ عُهْدَةَ السَّنَةِ مِنَ الْجُنُونِ وَالْجُذَامِ وَالْبَرَصِ فَإِذَا مَضَتِ السَّنَةُ فَقَدْ بَرِئَ الْبَائِعُ مِنَ الْعُهْدَةِ كُلِّهَا. قَالَ مَالِكٌ وَمَنْ بَاعَ عَبْدًا أَوْ وَلِيدَةً مِنْ أَهْلِ الْمِيرَاثِ أَوْ غَيْرِهِمْ بِالْبَرَاءَةِ فَقَدْ بَرِئَ مِنْ كُلِّ عَيْبٍ وَلاَ عُهْدَةَ عَلَيْهِ إِلاَّ أَنْ يَكُونَ عَلِمَ عَيْبًا فَكَتَمَهُ فَإِنْ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1292، يذكر الجذام والبرص. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1292 (Business Transactions), that mentions leprosy and vitiligo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1292، جس میں جذام اور برص کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
