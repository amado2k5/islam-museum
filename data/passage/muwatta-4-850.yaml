label: { ar: "الموطأ 850 — مالك: لا ينبغي للرجل أن يدخل في شيء من الأعمال الصالحة التي يتطوع بها الناس ثم يقطعه؛ بل يتمه على سنته: الصلاة والصيام والحج والطواف", en: "Muwatta 850", es: "850 Muwatta", fr: "850 Muwatta", ur: "850 موطا", tr: "El-Muvatta 850 — Malik: Bir insan, insanların gönüllü olarak yaptığı iyi işlerden hiçbirine başlayıp sonra onu terk etmemelidir; aksine, namaz, oruç, Hac ve Tavaf gibi işleri, yerleşik uygulamasına göre tamamlamalıdır.", id: "Al-Muwatta 850 — Malik: Seseorang tidak boleh memulai amal kebaikan yang dilakukan orang lain secara sukarela lalu meninggalkannya; melainkan, ia harus menyelesaikannya sesuai dengan tata cara yang telah ditetapkan: salat, puasa, haji, dan tawaf." }
summary:
  ar: "قول لمالك: لا ينبغي للرجل أن يدخل في شيء من الأعمال الصالحة التي يتطوع بها الناس فيقطعه، حتى يتمه على سنته: إذا كبّر لم ينصرف حتى يصلي ركعتين، وإذا صام لم يفطر حتى يتم صوم يومه، وإذا أهل لم يرجع حتى يتم حجه، وإذا دخل في الطواف لم يقطعه حتى يتم سبعه. ويستشهد مالك بقوله تعالى: ثم أتموا الصيام إلى الليل [[passage/quran-2-187|البقرة 187]]، وقوله: وأتموا الحج والعمرة لله [[passage/quran-2-196|البقرة 196]]. ويقول: فلو أن رجلاً أهل بالحج تطوعاً، وقد قضى الفريضة، لم يكن له أن يترك الحج بعد أن دخل فيه ويرجع حلالاً من الطريق. ويذكر المحقق أنه رواه عن مالك أبو مصعب (831). {cite:muwatta-maruf-1997 p.412}"
  tr: "Malik şöyle demiştir: Bir kimse, nafile bir ibadete başlayıp, onu farz olan şekliyle tamamlayana kadar bırakmamalıdır. Namaza başlarsa, iki rekat kılıncaya kadar bırakmamalıdır; oruca başlarsa, günlük orucunu tamamlayıncaya kadar orucunu bozmamalıdır; ihrama girerse, Hac ibadetini tamamlayıncaya kadar geri dönmemelidir; tavafa başlarsa, yedi tavaf tamamlayıncaya kadar ara vermemelidir. Malik, \"Öyleyse orucu geceye kadar tamamla\" [Bakara 2:187] ve \"Hac ve Umreyi Allah için tamamla\" [Bakara 2:196] ayetlerini zikreder. Şöyle der: Bir kimse, farz Hac ibadetini yerine getirdikten sonra nafile Hac için ihrama girerse, Hac'a başladıktan sonra bırakıp yolculuktan ihramlı olarak dönmesine izin verilmez. Araştırmacı, bunun Malik'ten Ebu Mus'ab (831) tarafından rivayet edildiğini belirtiyor."
  id: "Malik berkata: Seseorang tidak boleh memulai ibadah sunnah lalu meninggalkannya sampai ia menyelesaikannya sesuai dengan tata cara yang telah ditentukan. Jika ia memulai salat, ia tidak boleh berhenti sampai ia menyelesaikan salat dua rakaat; jika ia memulai puasa, ia tidak boleh berbuka sampai ia menyelesaikan puasanya untuk hari itu; jika ia memasuki keadaan ihram, ia tidak boleh kembali sampai ia menyelesaikan hajinya; dan jika ia memulai tawaf, ia tidak boleh menghentikannya sampai ia menyelesaikan tujuh putaran. Malik mengutip ayat: \"Kemudian sempurnakanlah puasa sampai malam\" [Al-Baqarah 2:187], dan ayat: \"Dan sempurnakanlah haji dan umrah karena Allah\" [Al-Baqarah 2:196]. Ia berkata: Jika seseorang memasuki keadaan ihram untuk haji sunnah, setelah telah melaksanakan haji wajib, ia tidak diperbolehkan untuk meninggalkan haji setelah memulainya dan kembali dalam keadaan ihram dari perjalanan tersebut. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (831)."
