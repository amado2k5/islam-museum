label: { ar: "الموطأ 850 — مالك: لا ينبغي للرجل أن يدخل في شيء من الأعمال الصالحة التي يتطوع بها الناس ثم يقطعه؛ بل يتمه على سنته: الصلاة والصيام والحج والطواف", en: "Muwatta 850" }
summary:
  ar: "قول لمالك: لا ينبغي للرجل أن يدخل في شيء من الأعمال الصالحة التي يتطوع بها الناس فيقطعه، حتى يتمه على سنته: إذا كبّر لم ينصرف حتى يصلي ركعتين، وإذا صام لم يفطر حتى يتم صوم يومه، وإذا أهل لم يرجع حتى يتم حجه، وإذا دخل في الطواف لم يقطعه حتى يتم سبعه. ويستشهد مالك بقوله تعالى: ثم أتموا الصيام إلى الليل [[passage/quran-2-187|البقرة 187]]، وقوله: وأتموا الحج والعمرة لله [[passage/quran-2-196|البقرة 196]]. ويقول: فلو أن رجلاً أهل بالحج تطوعاً، وقد قضى الفريضة، لم يكن له أن يترك الحج بعد أن دخل فيه ويرجع حلالاً من الطريق. ويذكر المحقق أنه رواه عن مالك أبو مصعب (831). {cite:muwatta-maruf-1997 p.412}"
