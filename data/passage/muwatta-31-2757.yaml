label: { ar: "الموطأ 2757 — وهب بن كيسان عن محمد بن عمرو بن عطاء: رجل من اليمن يسلم على ابن عباس فيقول إن السلام انتهى إلى البركة", en: "Muwatta 2757" }
summary:
  ar: "يروي مالك عن وهب بن كيسان عن محمد بن عمرو بن عطاء أنه كان جالسا عند عبد الله بن عباس، فدخل عليه رجل من أهل اليمن فقال: السلام عليكم ورحمة الله وبركاته، ثم زاد شيئا مع ذلك أيضا. فقال ابن عباس، وقد ذهب بصره: من هذا؟ فقيل: هذا اليماني الذي يغشاك. فقال ابن عباس: إن السلام انتهى إلى البركة. {cite:muwatta-maruf-1997 p.549}"
