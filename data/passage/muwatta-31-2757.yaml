label: { ar: "الموطأ 2757 — وهب بن كيسان عن محمد بن عمرو بن عطاء: رجل من اليمن يسلم على ابن عباس فيقول إن السلام انتهى إلى البركة", en: "Muwatta 2757", es: "Muwatta 2757", fr: "Muwatta 2757", ur: "موطا 2757", tr: "El-Muvatta 2757 — Vahb ibn Kaysan, Muhammed ibn Amr ibn Ata'dan rivayetle: Yemenli bir adam İbn Abbas'ı selamladı ve İbn Abbas, \"Selam, bereket derecesine ulaştı\" dedi.", id: "Al-Muwatta 2757 — Wahb ibn Kaysan berdasarkan riwayat Muhammad ibn Amr ibn Ata: Seorang pria dari Yaman memberi salam kepada Ibn Abbas, yang berkata, “Salam ini telah mencapai tingkat keberkahan.”" }
summary:
  ar: "يروي مالك عن وهب بن كيسان عن محمد بن عمرو بن عطاء أنه كان جالسا عند عبد الله بن عباس، فدخل عليه رجل من أهل اليمن فقال: السلام عليكم ورحمة الله وبركاته، ثم زاد شيئا مع ذلك أيضا. فقال ابن عباس، وقد ذهب بصره: من هذا؟ فقيل: هذا اليماني الذي يغشاك. فقال ابن عباس: إن السلام انتهى إلى البركة. {cite:muwatta-maruf-1997 p.549}"
  tr: "Malik, Vahb ibn Kaysan'dan, o da Muhammed ibn Amr ibn Ata'dan rivayet ettiğine göre, Abdullah ibn Abbas ile otururken Yemenli bir adam içeri girip, \"Size selam olsun, Allah'ın rahmeti ve bereketi üzerinize olsun\" dedi ve sonra buna başka bir şey ekledi. Gözleri görmez hale gelen İbn Abbas, \"Bu kim?\" diye sordu. \"Sizi ziyaret eden Yemenli bu\" denildi. İbn Abbas, \"Selamlaşma, bereket seviyesine ulaştı\" dedi. {cite:muwatta-maruf-1997 s.549}"
  id: "Malik meriwayatkan dari Wahb ibn Kaysan, dari Muhammad ibn Amr ibn Ata, bahwa beliau sedang duduk bersama Abdullah ibn Abbas ketika seorang pria dari Yaman masuk dan berkata, \"Salam sejahtera dan rahmat serta berkah Allah tercurah kepada Anda,\" lalu menambahkan sesuatu lagi. Ibnu Abbas, yang telah kehilangan penglihatannya, bertanya, \"Siapakah ini?\" Dijawab, \"Ini orang Yaman yang mengunjungi Anda.\" Ibnu Abbas berkata, \"Salam ini telah mencapai tingkat berkah.\" {cite:muwatta-maruf-1997 p.549}"
