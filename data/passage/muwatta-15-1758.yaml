label: { ar: "الموطأ 1758 — مالك: الإحداد على الصبية التي لم تبلغ المحيض كهيئته على التي بلغت المحيض", en: "Muwatta 1758", es: "Muwatta 1758", fr: "Muwatta 1758", ur: "موطا 1758", tr: "El-Muvatta 1758 — Malik: Henüz ergenliğe ulaşmamış bir kız çocuğunun yas süresi, ergenliğe ulaşmış bir kız çocuğunun yas süresiyle aynıdır.", id: "Al-Muwatta 1758 — Malik: Masa berkabung bagi seorang gadis yang belum mencapai pubertas sama dengan masa berkabung bagi seorang gadis yang telah mencapai pubertas." }
summary:
  ar: "قال مالك: الإحداد على الصبية التي لم تبلغ المحيض، كهيئته على التي قد بلغت المحيض، تجتنب ما تجتنب المرأة البالغة، إذا هلك زوجها. {cite:muwatta-maruf-1997 p.117}"
  tr: "Malik şöyle dedi: Henüz ergenliğe ulaşmamış bir kız için yas dönemi, ergenliğe ulaşmış bir kız için olduğu gibidir; kocasının ölümünden sonra olgun bir kadının kaçındığı şeylerden o da kaçınmalıdır. {cite:muwatta-maruf-1997 s.117}"
  id: "Malik berkata: Masa berkabung bagi seorang gadis yang belum mencapai pubertas sama dengan masa berkabung bagi seorang gadis yang telah mencapai pubertas; ia harus menjauhi apa yang dihindari oleh seorang wanita dewasa ketika suaminya meninggal. {cite:muwatta-maruf-1997 p.117}"
