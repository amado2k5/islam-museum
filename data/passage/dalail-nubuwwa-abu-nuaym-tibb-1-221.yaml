text: "… وشيبان قالا ثنا حماد بن سلمة قال ثنا ثابت عن أنس : أن جبريل أتى النبيّ وَلفي وهو يلعبُ مع الغلمان، فأخذه فصرعَه فشقَّ بطنه، فاستخرجَه ثم استخرج من قلبه علقة سوداءَ، فقال هذا ح قال السيوطي أخرجه الدارمي رقم …"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، المجلد المصوَّر 1، ص 221، يذكر أطوار خلق الجنين، وشق الصدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, scan volume 1, p. 221, that mentions the stages of the embryo, the opening of the chest; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، ابو نعیم، اسکین جلد 1، ص 221 کا اقتباس جس میں جنین کے مراحل، شقِّ صدر کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de Abu Nu'aym, volumen escaneado 1, pág. 221, que menciona las etapas del embrión, la apertura del tórax; del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Dala'il al-Nubuwwa d'Abu Nu'aym, volume 1 scanné, p. 221, qui mentionne les étapes de l'embryon, l'ouverture de la poitrine; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nu'aym'ın Peygamberliğin Alametleri adlı eserinin resimli 1. cildinin 221. sayfasından bir bölüm; embriyonik yaratılışın aşamalarından ve göğsün yarılmasından bahsedilmektedir; metin, makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Tanda-Tanda Kenabian karya Abu Nu’aym, jilid bergambar 1, hlm. 221, yang menyebutkan tahapan penciptaan embrio dan pembelahan dada; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
