label: { ar: "الموطأ 1384 — عثمان بن حفص عن ابن شهاب: أبو لبابة لما تاب الله عليه قال أنخلع من مالي صدقة، فقال النبي يجزيك الثلث", en: "Muwatta 1384", es: "Muwatta 1384", fr: "Muwatta 1384", ur: "موطا 1384", tr: "El-Muvatta 1384 — Osman ibn Hafs, İbn Şihab'dan rivayetle: Allah tövbesini kabul edince Ebu Lubaba, \"Malımı sadaka olarak vereceğim\" dedi. Peygamberimiz şöyle buyurdu: \"Üçte biri sana yeter.\"", id: "Al-Muwatta 1384 — Utsman bin Hafs berdasarkan riwayat Ibnu Shihab: Abu Lubaba, ketika Allah menerima taubatnya, berkata, “Aku akan memberikan hartaku sebagai sedekah.” Nabi bersabda, “Sepertiga sudah cukup bagimu.”" }
summary:
  ar: "يروي مالك عن عثمان بن حفص بن عمر بن خلدة عن ابن شهاب أنه بلغه أن أبا لبابة بن عبد المنذر، حين تاب الله عليه، قال يا رسول الله أهجر دار قومي التي أصبت فيها الذنب، وأجاورك، وأنخلع من مالي صدقة إلى الله وإلى رسوله، فقال رسول الله يجزيك من ذلك الثلث. {cite:muwatta-maruf-1997 p.617}"
  tr: "Malik, Osman ibn Hafs ibn Ömer ibn Halde'den, o da İbn Şihab'dan rivayet ettiğine göre, Ebu Lubabah ibn Abdül-Mundhir'in, Allah tövbesini kabul edince, \"Ey Allah'ın Resulü, günah işlediğim kavmimin yurdunu terk edip senin yanında yaşayacağım ve malımı Allah'a ve Resulüne sadaka olarak vereceğim\" dediğini işittiğini aktarır. Allah'ın Resulü, \"Bunun üçte biri sana yeter\" demiştir. {cite:muwatta-maruf-1997 s.617}"
  id: "Malik meriwayatkan dari Uthman ibn Hafs ibn Umar ibn Khaldah, dari Ibn Shihab, bahwa ia mendengar bahwa Abu Lubabah ibn Abd al-Mundhir, ketika Allah menerima taubatnya, berkata, “Wahai Rasulullah, aku akan meninggalkan rumah kaumku tempat aku berbuat dosa, dan tinggal di dekatmu, dan aku akan memberikan hartaku sebagai sedekah kepada Allah dan Rasul-Nya.” Rasulullah SAW bersabda, “Sepertiga dari itu sudah cukup bagimu.” {cite:muwatta-maruf-1997 p.617}"
