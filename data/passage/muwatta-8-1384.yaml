label: { ar: "الموطأ 1384 — عثمان بن حفص عن ابن شهاب: أبو لبابة لما تاب الله عليه قال أنخلع من مالي صدقة، فقال النبي يجزيك الثلث", en: "Muwatta 1384" }
summary:
  ar: "يروي مالك عن عثمان بن حفص بن عمر بن خلدة عن ابن شهاب أنه بلغه أن أبا لبابة بن عبد المنذر، حين تاب الله عليه، قال يا رسول الله أهجر دار قومي التي أصبت فيها الذنب، وأجاورك، وأنخلع من مالي صدقة إلى الله وإلى رسوله، فقال رسول الله يجزيك من ذلك الثلث. {cite:muwatta-maruf-1997 p.617}"
