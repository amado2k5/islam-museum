text: "… شُغُلٍ فَاكِهُونَ. و شُغُل و شُغْلِ لغتان قرىء. فاكِهُونَ قال بهما مثل الرُّعُبِ والرُّعْبِ، والسُّحت والسحْت؛ وقد تقدم الحسن: مسرورون. وقال أبن عباس: فرحون. مجاهد والضحاك: معجَبون. السدي: ناعمون. والمعنى متقارب. والفكاهة المزاح والكلام الطيب. وقرأ أبو جعفر وشيبة والأعرج …"
