label: { ar: "سنن أبي داود 4697 — تعريف الإسلام بأعماله، الصلاة والزكاة والصوم والحج مجتمعة", en: "Sunan Abi Dawud 4697 — Islam defined by its acts; the prayer, the zakat, the fast and the pilgrimage named together", ur: "سنن ابی داؤد 4697 — اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Sunan Abi Dawud 4697 — El Islam definido por sus actos; la oración, el zakat, el ayuno y la peregrinación mencionados juntos.", fr: "Sunan Abi Dawud 4697 — L'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage sont cités ensemble.", tr: "Sunan Abi Davud 4697 — İslam'ı ibadetleriyle tanımlamak: namaz, zekât, oruç ve Hac bir arada.", id: "Sunan Abi Dawud 4697 — Mendefinisikan Islam melalui amalan-amalannya: salat, zakat, puasa, dan haji secara gabungan." }
text: "حَدَّثَنَا مَحْمُودُ بْنُ خَالِدٍ، حَدَّثَنَا الْفِرْيَابِيُّ، عَنْ سُفْيَانَ، قَالَ حَدَّثَنَا عَلْقَمَةُ بْنُ مَرْثَدٍ، عَنْ سُلَيْمَانَ بْنِ بُرَيْدَةَ، عَنِ ابْنِ يَعْمَرَ، بِهَذَا الْحَدِيثِ يَزِيدُ وَيَنْقُصُ قَالَ فَمَا الإِسْلاَمُ قَالَ \" إِقَامُ الصَّلاَةِ وَإِيتَاءُ الزَّكَاةِ وَحَجُّ الْبَيْتِ وَصَوْمُ شَهْرِ رَمَضَانَ وَالاِغْتِسَالُ مِنَ الْجَنَابَةِ \". قَالَ أَبُو دَاوُدَ عَلْقَمَةُ مُرْجِئٌ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4697، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، وزيادة الإيمان ونقصانه. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 4697 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, faith increasing and decreasing. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 4697، جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4697 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, que se mencionan conjuntamente, y el fortalecimiento y debilitamiento de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Abi Dawud, n° 4697 (Le Guide du Prophète), définit l'islam par ses actes: la prière, la zakat, le jeûne et le pèlerinage, cités ensemble, ainsi que la croissance et le déclin de la foi. Le moteur de recherche « Piliers et Branches de la Foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sünen Ebu Davud'da yer alan 4697 numaralı hadis, namaz, zekât, oruç ve Hac gibi ibadetler aracılığıyla İslam'ı tanımlar ve imanın artışını ve azalışını ele alır. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an'dan, Sünnet'ten, Peygamberin hayatından ve Sahabeler ile onların haleflerinden rivayetlerle birlikte, bu dört kategori içinde derler."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4697, mendefinisikan Islam melalui amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta membahas tentang peningkatan dan penurunan iman. Hadits ini merangkum rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, semuanya dalam empat kategori ini."
