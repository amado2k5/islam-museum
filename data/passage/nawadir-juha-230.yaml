label: { ar: "نوادر جحا الكبرى، ص 105 — «أما كفاه حمله؟»", en: "Nawadir Juha al-Kubra, p. 105 — 'Did He Not Have Enough Load?'", ur: "نوادر جحا الکبریٰ، ص 105 — «کیا اس پر بوجھ کم تھا؟»", fr: "Nawadir Juha al-Kubra, p. 105 — « Sa charge ne lui suffisait-elle pas ? »", es: "Nawadir Juha al-Kubra, p. 105 — «¿No le bastaba su carga?»", tr: "Juha'nın Büyük Fıkraları, s. 105 — “Yükü ona yetmedi mi?”", id: "Anekdot Hebat Juha, hlm. 105 — “Bukankah bebannya sudah cukup berat baginya?”" }
text: "… أما كفاه حمله؟ حمَّل يوماً حمارَهُ حطباً، وركب مرتفعاً بعد أن أخرج رجليه من الركاب. فشاهده صبيان الأزقة. فأخذوا يضحكون من عمله. ثم قال له واحد منهم : لماذا لا تركب جالساً وتستريح؟ فأجابه : يا أولادي أما يكفي الحمار …"
summary:
  ar: "حمّل جحا حماره حطباً وركب فوقه رافعاً قدميه عن الركابين، فضحك الصبية، فقال إن الحمار يكفيه حمله وإن رفع قدميه راحة له. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  en: "Juha loads his donkey with firewood and rides high with his feet off the stirrups, and boys laugh. He says the donkey has enough load, and that lifting his feet is a relief to it. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  ur: "جحا اپنے گدھے پر لکڑیاں لادتا ہے اور رکابوں سے پاؤں اٹھا کر اوپر سوار ہو جاتا ہے تو لڑکے ہنستے ہیں۔ وہ کہتا ہے کہ گدھے کے لیے اس کا بوجھ کافی ہے اور پاؤں اٹھا لینا اس کے لیے راحت ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  fr: "Juha charge son âne de bois à brûler et le monte haut, les pieds hors des étriers, et des garçons rient. Il dit que l'âne a assez de sa charge et que lever les pieds est un soulagement pour lui. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  es: "Juha carga su burro con leña y lo monta alto, con los pies fuera de los estribos, y unos muchachos se ríen. Dice que el burro ya tiene bastante con su carga y que levantar los pies es un alivio para él. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  tr: "Juha eşeğine odun yükledi ve ayaklarını üzengilerin üzerine kaldırarak bindi. Çocuklar gülünce, \"Eşeğin zaten taşıyacak yeterince yükü var, ayaklarını kaldırması onun için daha rahat,\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 105}"
  id: "Juha memuat kayu bakar ke atas keledainya dan menungganginya, mengangkat kakinya di atas sanggurdi. Anak-anak itu tertawa, jadi dia berkata, \"Keledai itu sudah membawa beban yang cukup, dan mengangkat kakinya akan membuatnya lebih nyaman.\" {cite:juha-nawadir-kubra-djuwaydi p. 105}"
