label: { ar: "صحيح البخاري 2972 — «لولا أن أشق على أمتي»", en: "Sahih al-Bukhari 2972 — 'were it not that I would burden my community'", ur: "صحیح بخاری 2972 — «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا»", fr: "Sahih al-Bukhari 2972 — « si je ne craignais d'accabler ma communauté »", es: "Sahih al-Bujari 2972 — «si no temiera agobiar a mi comunidad»", tr: "Sahih el-Buhari 2972 — “Eğer ümmetime zorluk çektirmek istemezsem…”", id: "Sahih al-Bukhari 2972 — “Sekiranya bukan karena aku ingin mendatangkan kesulitan bagi umatku”" }
text: "… يَحْيَى بْنِ سَعِيدٍ الأَنْصَارِيِّ، قَالَ حَدَّثَنِي أَبُو صَالِحٍ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" لَوْلاَ أَنْ أَشُقَّ عَلَى أُمَّتِي مَا تَخَلَّفْتُ عَنْ سَرِيَّةٍ، وَلَكِنْ لاَ أَجِدُ حَمُولَةً، وَلاَ أَجِدُ مَا أَحْمِلُهُمْ عَلَيْهِ، وَيَشُقُّ عَلَىَّ أَنْ يَتَخَلَّفُوا عَنِّي، وَلَوَدِدْتُ أَنِّي قَاتَلْتُ فِي سَبِيلِ اللَّهِ فَقُتِلْتُ، ثُمَّ أُحْيِيتُ ثُمَّ قُتِلْتُ، ثُمَّ أُحْيِيتُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2972، يرد فيه ذكر «لولا أن أشق على أمتي». يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 2972 (Fighting for the Cause of Allah (Jihaad)), whose wording mentions 'were it not that I would burden my community'. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 2972، جس کے الفاظ میں «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا» کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2972, dont le texte mentionne « si je ne craignais d'accabler ma communauté ». Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 2972, cuyo texto menciona «si no temiera agobiar a mi comunidad». El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 2972 numaralı hadiste şöyle buyurulmaktadır: \"Ümmetimi zor durumda bırakmak istemezdim.\" Bu hadis, farz, ibadet, sünnet, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2972, menyebutkan, \"Sekiranya bukan karena aku ingin menyulitkan umatku.\" Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
