text: "… يَشْكرَ نعمتَه عليه بإعطائِه الكوثَرَ بالصلاةِ لهُ والنَّحرِ كما شرعَ ذلك لإبراهيمَ خليلِه عند أَمرِه بذبحِ ولَدِه وافتدائِه بذبحِ عظيم. وأمَّا - أ ف عيدُ الأسبوعِ: فهو يومُ الجمعةِ، وهو متعلقٌ بإكمالِ فريضة الصلاةِ؛ فإن اللّٰه فرض على عبادِه المسلمينَ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 175، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، وما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 175, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 175 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Rajab, volume numérisé 1, p. 175, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen digitalizado 1, p. 175, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
