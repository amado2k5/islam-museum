label: { ar: "الموطأ 2724 — بكير بن عبد الله بن الأشج عن ابن عطية: لا عدوى ولا هامة ولا صفر", en: "Muwatta 2724" }
summary:
  ar: "بلغ مالكا عن بكير بن عبد الله بن الأشج عن ابن عطية أن رسول الله قال: لا عدوى ولا هامة ولا صفر، ولا يحل الممرض على المصح، وليحل المصح حيث شاء. فقالوا: يا رسول الله، وما ذاك؟ قال: إنه أذى. ويذكر المحقق أن يحيى رواه مرسلا، وأن الموصول عن أبي هريرة في الصحيحين، وأن ابن بكير رواه عن أبي عطية الأشجعي، وهو مجهول لا يحتج به. {cite:muwatta-maruf-1997 p.534} {cite:muwatta-maruf-1997 p.535}"
