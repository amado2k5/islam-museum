label: { ar: "الموطأ 2724 — بكير بن عبد الله بن الأشج عن ابن عطية: لا عدوى ولا هامة ولا صفر", en: "Muwatta 2724", es: "Muwatta 2724", fr: "Muwatta 2724", ur: "موطا 2724", tr: "Al-Muwatta 2724 - Bakir ibn Abdullah ibn al-Ashajj, İbn Atiyyah'ın yetkisine göre: Bulaşma yok, baykuş alamet yok ve Safar alamet yok.", id: "Al-Muwatta 2724 — Bakir ibn Abdullah ibn al-Ashajj, dari Ibnu Atiyyah: Tidak ada penyakit menular, tidak ada pertanda burung hantu, dan tidak ada pertanda Safar." }
summary:
  ar: "بلغ مالكا عن بكير بن عبد الله بن الأشج عن ابن عطية أن رسول الله قال: لا عدوى ولا هامة ولا صفر، ولا يحل الممرض على المصح، وليحل المصح حيث شاء. فقالوا: يا رسول الله، وما ذاك؟ قال: إنه أذى. ويذكر المحقق أن يحيى رواه مرسلا، وأن الموصول عن أبي هريرة في الصحيحين، وأن ابن بكير رواه عن أبي عطية الأشجعي، وهو مجهول لا يحتج به. {cite:muwatta-maruf-1997 p.534} {cite:muwatta-maruf-1997 p.535}"
  id: "Malik meriwayatkan dari Bukayr ibn Abdullah ibn al-Ashajj, berdasarkan riwayat Ibn Atiyyah, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: “Tidak ada penularan penyakit, tidak ada pertanda buruk dari burung hantu, dan tidak ada pertanda buruk dari bulan Safar. Orang sakit tidak boleh tinggal bersama orang sehat, tetapi orang sehat boleh tinggal di mana pun ia mau.” Mereka bertanya: “Wahai Rasulullah, apakah itu?” Beliau menjawab: “Itu berbahaya.” Peneliti menyebutkan bahwa Yahya meriwayatkan hadits ini sebagai mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa versi yang terhubung berasal dari Abu Hurayrah dalam dua kitab Sahih (Bukhari dan Muslim), dan bahwa Ibn Bukayr meriwayatkannya dari Abu Atiyyah al-Ashja’i, yang tidak dikenal dan riwayatnya tidak dianggap otoritatif. {kutip:muwatta-maruf-1997 hal.534} {kutip:muwatta-maruf-1997 hal.535}"
