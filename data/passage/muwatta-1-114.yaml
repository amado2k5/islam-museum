text: "هل تدري ما مثلك يا أبا سلمة؟ مثل الفروج يسمع الديكة تصرخ فيصرخ معها"
summary:
  ar: "أثر يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي سلمة بن عبد الرحمن بن عوف، في باب واجب الغسل إذا التقى الختانان: سأل أبو سلمة عائشة عما يوجب الغسل، فشبهته بالفروج الذي يسمع الديكة تصرخ فيصرخ معها، ثم أجابته بأن الغسل يجب إذا جاوز الختان الختان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي مختصراً وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.90} {cite:muwatta-maruf-1997 p.91}"
