label: { ar: "الموطأ 114 — عائشة لأبي سلمة: مثلك مثل الفروج يصرخ مع الديكة", en: "Muwatta 114", es: "Muwatta 114", fr: "Muwatta 114", ur: "موطا 114", tr: "Al-Muwatta 114 — Aişe'den Ebu Seleme'ye: Sen horozla birlikte öten bir civciv gibisin.", id: "Al-Muwatta 114 — Aisyah kepada Abu Salama: Engkau seperti anak ayam yang berkokok bersama ayam jantan." }
text: "هل تدري ما مثلك يا أبا سلمة؟ مثل الفروج يسمع الديكة تصرخ فيصرخ معها"
summary:
  ar: "أثر يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي سلمة بن عبد الرحمن بن عوف، في باب واجب الغسل إذا التقى الختانان: سأل أبو سلمة عائشة عما يوجب الغسل، فشبهته بالفروج الذي يسمع الديكة تصرخ فيصرخ معها، ثم أجابته بأن الغسل يجب إذا جاوز الختان الختان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي مختصراً وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.90} {cite:muwatta-maruf-1997 p.91}"
  tr: "Malik'in, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, Ebu Selama ibn Abd el-Rahman ibn Avf'tan rivayet ettiği, sünnetli iki bölgenin birleştiği yerdeki gusül abdestinin farz olduğu bölümünde yer alan bir rivayette şöyle denmektedir: Ebu Selama, Ayşe'ye gusül abdestini neyin gerektirdiğini sormuş, Ayşe de bunu horozun ötüşünü duyup onunla birlikte öten genç bir erkeğe benzetmiştir. Sonra da sünnetli iki bölgenin birleştiği yerde gusül abdestinin farz olduğunu söylemiştir. Araştırmacı, bu rivayetin Malik'ten Ebu Musab ve İbn Vahb tarafından el-Tahavi'de kısaltılmış bir biçimde, Abd el-Razzak, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından ise el-Beyhakî'de nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.90} {cite:muwatta-maruf-1997 s.91}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Abu Salama ibn Abd al-Rahman ibn Awf, dalam bab tentang kewajiban mandi ritual ketika kedua bagian yang disunat bertemu: Abu Salama bertanya kepada Aisyah apa yang mengharuskan mandi ritual, dan dia menyamakannya dengan seorang pemuda yang mendengar ayam jantan berkokok dan ikut berkokok. Kemudian dia menjawabnya bahwa mandi ritual wajib dilakukan ketika kedua bagian yang disunat bertemu. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Musab dan Ibn Wahb dalam al-Tahawi dalam bentuk ringkas, dan oleh Abd al-Razzaq, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr dalam al-Bayhaqi. {kutip:muwatta-maruf-1997 hal.90} {kutip:muwatta-maruf-1997 hal.91}"
