label: { ar: "صحيح البخاري 1742 — الحرام، ما حُرّم", en: "Sahih al-Bukhari 1742 — the unlawful; what was made unlawful", ur: "صحیح بخاری 1742 — حرام، جو حرام کیا گیا", es: "Sahih al-Bukhari 1742 — lo ilícito; lo que se hizo ilícito" }
text: "… قَالَ النَّبِيُّ بِمِنًى \" أَتَدْرُونَ أَىُّ يَوْمٍ هَذَا \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. فَقَالَ \" فَإِنَّ هَذَا يَوْمٌ حَرَامٌ، أَفَتَدْرُونَ أَىُّ بَلَدٍ هَذَا \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" بَلَدٌ حَرَامٌ، أَفَتَدْرُونَ أَىُّ شَهْرٍ هَذَا \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" شَهْرٌ حَرَامٌ ـ قَالَ ـ فَإِنَّ اللَّهَ حَرَّمَ عَلَيْكُمْ دِمَاءَكُمْ وَأَمْوَالَكُمْ وَأَعْرَاضَكُمْ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1742، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1742 (Hajj (Pilgrimage)), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1742، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1742 (Hajj (Peregrinación)), menciona lo ilícito y lo que se ha prohibido. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
