label: { ar: "سنن ابن ماجه 2235 — عدد الحسنات، كتابة الحسنات", en: "Sunan Ibn Majah 2235 — a stated number of good deeds; the writing of good deeds", ur: "سنن ابن ماجہ 2235 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا", es: "Sunan Ibn Majah 2235 — un número determinado de buenas obras; la escritura de buenas obras", fr: "Sunan Ibn Majah 2235 — un nombre déterminé de bonnes actions; la consignation des bonnes actions", tr: "Sunan İbn Majah 2235 — İyi amellerin sayısı, iyi amellerin yazılması", id: "Sunan Ibn Majah 2235 — Jumlah amal kebaikan, mencatat amal kebaikan" }
text: "… قَالَ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ قَالَ حِينَ يَدْخُلُ السُّوقَ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ حَىٌّ لاَ يَمُوتُ بِيَدِهِ الْخَيْرُ كُلُّهُ وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ - كَتَبَ اللَّهُ لَهُ أَلْفَ أَلْفِ حَسَنَةٍ وَمَحَا عَنْهُ أَلْفَ أَلْفِ سَيِّئَةٍ وَبَنَى لَهُ بَيْتًا فِي الْجَنَّةِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2235، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2235 (The Chapters on Business Transactions), that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2235، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2235 (Capítulos sobre transacciones comerciales), habla de un número determinado de buenas acciones, su registro, un número determinado de malas acciones, la eliminación de malas acciones y la purificación de pecados. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que registran, registran, borran o ponderan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 2235 (Les chapitres sur les transactions commerciales), mentionne un nombre précis de bonnes actions, leur inscription, un nombre précis de mauvaises actions, l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes traitant du dénombrement, de l'inscription, de l'effacement ou de la pesée des actes."
  tr: "İbn Majah'ın Sünen'inde yer alan 2235 numaralı hadis, iyi amellerin sayısını, iyi amellerin kaydedilmesini, kötü amellerin sayısını, kötü amellerin silinmesini ve günahların kaldırılmasını ele almaktadır. Bu hadis, iyi ve kötü amellerin listesini, amelleri sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2235, menyebutkan jumlah amal baik, pencatatan amal baik, jumlah amal buruk, penghapusan amal buruk, dan penghapusan dosa. Hadits ini menggabungkan daftar amal baik dan buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
