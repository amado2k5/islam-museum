label: { ar: "سنن ابن ماجه 2235 — عدد الحسنات، كتابة الحسنات", en: "Sunan Ibn Majah 2235 — a stated number of good deeds; the writing of good deeds", ur: "سنن ابن ماجہ 2235 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… قَالَ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ قَالَ حِينَ يَدْخُلُ السُّوقَ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ حَىٌّ لاَ يَمُوتُ بِيَدِهِ الْخَيْرُ كُلُّهُ وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ - كَتَبَ اللَّهُ لَهُ أَلْفَ أَلْفِ حَسَنَةٍ وَمَحَا عَنْهُ أَلْفَ أَلْفِ سَيِّئَةٍ وَبَنَى لَهُ بَيْتًا فِي الْجَنَّةِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2235، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2235 (The Chapters on Business Transactions), that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2235، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
