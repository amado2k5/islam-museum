text: |-
  أفصل الحا.)
  ٣٠٢
  ورتى أى جمان أحصرنسى وتال أبوعر والشياف لمرق الذى ولأمرن أى
  حسف ⁦( حضر)⁩ حضرة الرجل قربه وفناؤه والحضر بلديازا مسكن ويقال كلمته
  بحضرة فلان وبمحضر من فلان أى بمشه-د منه وح-كى يعوب كلمته بعضرفلان بالتصريك
  والحضر أيضاخلاف البدو والمحضر السجل والمحضر المرجع الى المياه وفلان حسن الحضر
  اذا كان ممن يذكر الغائب بخير يقال فلان حسن الحضرة والحضرة وكلمته بضرة فلان
  وحضرته وحضرته والحضر بالضم العدو يقال أحضر الفرس احضارا واحتضر أى عدا
  واستحضرته أعديته وهذا فرس محضير أى كثير العدو ولاية ال محضار وهو من النوادر
  والحاضر خلاف البادى والحاضرة خلاف البادية وهى المدن والقرى والريف والبادية
  خلاف ذلك يقال فلان من أهل الخاضرة وفلان من أهسل البادية وفلان حضرى وفلان
  بدوى والحاضر الحىّ العظيم بقال حاضر طي وهو جمع كما بقال ساهر للسمار
  وحاج للحجاج قال حسان
  لناحاضر فعم وباد كأنه • قطين الاله عزة وتكرما
  وفلان حاضر بموضع كذا أى مقيم بدويقسال على الماءحاضر وهؤلاء قوم حضاراذاحضروا
  المياه ومحاضر قال لبيد وعلى المإه محاضر وخيام وحضرة مشل كافر وكفرة
  وحضارمثل قطام فجم يقال حضاروالوزن محلفان وهما نجمان بطلعان قبل سهيل فيحلف
  أنهماسهيل للشبه والحضيرة الاربعة والخمسة يغزون قالت سلى الجهنيه تربى أخاها أسعد
  يرد المياه حضيرة ونفيضة • ورد القطاة اذا اسمال التبع
  والجمع الحضائر قال الهذلى
  رجال حروب يسعرون وحلقة • من الدارلاتأتى عليها الحضائر
  والحضيرة ما اجتمع فى الجرح من المدة وفى السلامن السخد يقال القت الشاة حضيرتماوهى
  ما تلقبه بعد الولد من السخد والقذى وحاضرته جاثيته عند الساطان وهو كالمغالبة
  والمكاثرة وحاضرته حضاراعدوت معه والحضار أيضامن الابل الهجان واحده وبمعهسوا.
  قال أبو ذؤيب فلاتشترى الابرمح سباءها • بنات الخاض شؤمها وحضارها
  أى سودها وبيضها ورواه أبوع روشيها وهما؟"فى الواحد أشيم ويقال ناقة حضاراذا جمعت
  قوّة ورحلة أى جودة سير والحضارة الاقاصة فى الحضر عن أبى زيدوكان الاديمى يقول
  لحضارة بالفتح قال القطاعى ومن تكن الحضارة أعجبته • فأى رجال بادية زانا
  والحضور نقيض الغيبة وقد حضر الرجل حضورا وأحضره غيره وحكى الفرّامحضر بالكسر
  اغة فيه يقال حضرت القاضى اليوم اهرأة قال وأنتدنا أبو ثروان المكلى لجر ير على
  هذه اللغة فامن جفانا اذا حاجاتنا حضرت • كن لناعنده التكريم واللعف
  قال وكلهم يقول يحضر بالضم ورجل حضر لايصلح للسفر والمحتضر الذى يأتى الحضروهو
  خلاف البادى وحضره الهمّ واحتضره وتحضر هبمعنى واللبن محتضر ومحضور أى كثير
  الآفة وانّ الجن تحضره يقال اللبن محتضر فغط اناءك والكنف محضورة وقوله تعالى
