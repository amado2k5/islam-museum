label: { ar: "صحيح البخاري 5151 — استحلال الشيء", en: "Sahih al-Bukhari 5151 — treating a thing as lawful", ur: "صحیح بخاری 5151 — کسی چیز کو حلال ٹھہرانا", es: "Sahih al-Bukhari 5151 — tratar algo como lícito", fr: "Sahih al-Bukhari 5151 — considérer une chose comme licite", tr: "Sahih el-Buhari 5151 — Bir şeyi helal kılmak", id: "Sahih al-Bukhari 5151 — Memperbolehkan sesuatu" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، هِشَامُ بْنُ عَبْدِ الْمَلِكِ حَدَّثَنَا لَيْثٌ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ أَبِي الْخَيْرِ، عَنْ عُقْبَةَ، عَنِ النَّبِيِّ قَالَ \" أَحَقُّ مَا أَوْفَيْتُمْ مِنَ الشُّرُوطِ أَنْ تُوفُوا بِهِ مَا اسْتَحْلَلْتُمْ بِهِ الْفُرُوجَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5151، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5151 (Wedlock, Marriage (Nikaah)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5151، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5151 (Matrimonio (Nikaah)), menciona que se considera algo lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5151 (Mariage), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 5151 numaralı hadis, bir şeyin helal olup olmadığını belirtir. Helal ve haram bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntılar derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5151, menyebutkan tentang kebolehan sesuatu. Bagian halal dan haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
