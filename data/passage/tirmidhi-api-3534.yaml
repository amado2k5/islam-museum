label: { ar: "جامع الترمذي 3534 — عدد الحسنات، كتابة الحسنات", en: "Jami' al-Tirmidhi 3534 — a stated number of good deeds; the writing of good deeds", ur: "جامع ترمذی 3534 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… شَيْءٍ قَدِيرٌ. عَشْرَ مَرَّاتٍ عَلَى إِثْرِ الْمَغْرِبِ بَعَثَ اللَّهُ لَهُ مَسْلَحَةً يَحْفَظُونَهُ مِنَ الشَّيْطَانِ حَتَّى يُصْبِحَ وَكَتَبَ اللَّهُ لَهُ بِهَا عَشْرَ حَسَنَاتٍ مُوجِبَاتٍ وَمَحَا عَنْهُ عَشْرَ سَيِّئَاتٍ مُوبِقَاتٍ وَكَانَتْ لَهُ بِعَدْلِ عَشْرِ رِقَابٍ مُؤْمِنَاتٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ لَيْثِ بْنِ سَعْدٍ. وَلاَ نَعْرِفُ لِعُمَارَةَ بْنِ شَبِيبٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3534، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3534 (Chapters on Supplication), that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3534، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
