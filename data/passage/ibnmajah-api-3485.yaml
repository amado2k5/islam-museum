label: { ar: "سنن ابن ماجه 3485 — الحجامة", en: "Sunan Ibn Majah 3485 — cupping", ur: "سنن ابن ماجہ 3485 — حجامہ", es: "Sunan Ibn Majah 3485 - catación", fr: "Sunan Ibn Majah 3485 — ventouses", tr: "Sünen İbn Mace 3485 — Hacamat", id: "Sunan Ibnu Majah 3485 — Bekam" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ طَرِيفٍ، حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، أَنَّ النَّبِيَّ ـ سَقَطَ مِنْ فَرَسِهِ عَلَى جِذْعٍ فَانْفَكَّتْ قَدَمُهُ. قَالَ وَكِيعٌ يَعْنِي أَنَّ النَّبِيَّ ـ احْتَجَمَ عَلَيْهَا مِنْ وَثْءٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3485، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3485 (Chapters on Medicine), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3485، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "En el Sunan Ibn Majah, n.º 3485 (Capítulos sobre Medicina), se menciona la ventosaterapia. El buscador de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos la incluye en su lista."
  fr: "Un hadith du Sunan Ibn Majah, n° 3485 (Chapitres sur la médecine), mentionne la ventousothérapie. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 3485 numaralı hadiste hacamat uygulamasından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3485, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
