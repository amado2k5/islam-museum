label: { ar: "الموطأ 1845 — مالك عن نافع عن أبي سعيد الخدري: لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا منها شيئا غائبا بناجز", en: "Muwatta 1845", es: "Muwatta 1845", fr: "Muwatta 1845", ur: "موطا 1845", tr: "El-Muvatta 1845 — Malik, Nafi’den, o da Ebu Sa’id el-Hudri’den rivayetle: Altını altınla satmayın, ancak aynı türden olanı aynı türden olanla değiştirin; birine diğerinden üstün tutmayın; olmayan bir şeyi var olan bir şeyle satmayın.", id: "Al-Muwatta 1845 — Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Abu Sa’id al-Khudri: Janganlah menjual emas dengan emas kecuali dengan cara yang sama, dan janganlah memberikan keutamaan kepada sebagian orang atas sebagian lainnya, dan janganlah menjual sesuatu yang tidak ada untuk sesuatu yang ada." }
summary:
  ar: "يروي مالك عن نافع عن أبي سعيد الخدري أن رسول الله قال: لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا الورق بالورق إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا منها شيئا غائبا بناجز. {cite:muwatta-maruf-1997 p.157}"
  tr: "Malik, Nafi'den, o da Ebu Sa'id el-Hudri'den rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Altını altına ancak aynı türden olanla takas edin, birini diğerine tercih etmeyin. Gümüşü gümüşe ancak aynı türden olanla takas edin, birini diğerine tercih etmeyin. Yok olan bir şeyi var olan bir şeyle satmayın.\" {cite:muwatta-maruf-1997 s.157}"
  id: "Malik meriwayatkan dari Nafi’ dari Abu Sa’id al-Khudri bahwa Rasulullah SAW bersabda: “Janganlah kalian menjual emas dengan emas kecuali dengan cara yang sama, dan janganlah kalian mengutamakan salah satu di antara keduanya. Janganlah kalian menjual perak dengan perak kecuali dengan cara yang sama, dan janganlah kalian mengutamakan salah satu di antara keduanya. Janganlah kalian menjual sesuatu yang tidak ada dengan sesuatu yang ada.” {cite:muwatta-maruf-1997 p.157}"
