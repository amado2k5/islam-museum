label: { ar: "الموطأ 1845 — مالك عن نافع عن أبي سعيد الخدري: لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا منها شيئا غائبا بناجز", en: "Muwatta 1845" }
summary:
  ar: "يروي مالك عن نافع عن أبي سعيد الخدري أن رسول الله قال: لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا الورق بالورق إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا منها شيئا غائبا بناجز. {cite:muwatta-maruf-1997 p.157}"
