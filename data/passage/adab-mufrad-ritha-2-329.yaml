text: "… عددَها. فلما حضره الموت جمع بنيه فقال : يا بَنىِّ، خذوا عنى. فانكم لن تأخذوا عن أحد هو أنصح لكم منى. لا تنوحوا علىَّ فان رسول اللّٰه :يَايِّ لم يُتَحْ عليه، وقد سمعتُ النبّ مَيةُ ينهى عن النياحة. وكفنونى فى …"
summary:
  ar: "مقطع من الأدب المفرد، المجلد المصوَّر 2، ص 329، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Al-Adab al-Mufrad, scan volume 2, p. 329, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الادب المفرد، اسکین جلد 2، ص 329 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Al-Adab al-Mufrad, volume numérisé 2, p. 329, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Al-Adab al-Mufrad, volumen escaneado 2, p. 329, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "El-Adab El-Mufrad'ın 2. cildinin 329. sayfasından, ölenler için yazılmış bir ağıt ve bunun sınırlılıklarını içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Al-Adab Al-Mufrad, Volume 2, halaman 329, berisi ratapan untuk orang yang meninggal dan keterbatasannya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
