text: "… إدريس الخولاني، قال: كان قال: كان عند ذي الكلاع اثنا عشر ألف بيت من أبو مسلم الجليلي معلم كعب الأحبار، وكان يلومه على المسلمين، فبعث إليه عمر، فقال: بعنَا هؤلاء نستعين إبطائه عن الإسلام، قال كعب: فخرجت حتى أتيت ذا …"
