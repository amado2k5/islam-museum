text: |-
  عوجاعلى الطئل المحيل لعلنا
  نبكى الديار اه
  ٢٨٠
  •(فصل انخاه,,
  •حرم)•
  وقصها والخيتام وانطاتام كا-ه بمعنى وابهع الخواتيم وتختمت اذ البسنه وخاعة النى آخره
  ومحمد صلى اللّٰه عليه وسلم خاتم الانبياء عليهم الصلاة والسلام والختام المطين الذى يختمبه
  وقوله تعالى ختامه صسك أى آخره لانَ آخر ما يجدونه رائحة المسكْ وقول الاعشى
  وأبرزها وعليها ختم• أى عليه اطينة مختومة مثل نفض بمعنى منفوض وقبض بعنى مقبوض
  ( خثم اخم بالتحريك عرض الانف وتورأ خثم قال الاعشى
  على ظهر طاو أسفع الحد أخثما•وقد ختم المعول صارمف رطها قال النابغة الجعدى
  ردت معاوله ختمام فللة • وصادفت أخضر الجالين صلالا
  وتعل مختمة عريضة وخيمة لسم رجل ( ثرم الخنارم بالضم الرجل المتطير قاله أبو
  عبيدة وأنشد نلخثيم بن عدى
  واست بهياب اذا شدرحله • يقول عدانى اليوم واق وحاتم
  ولكنه يمضى على ذالكمقدما • اذا صدعن تلك الهناة الخفارم
  وعروين الخنارم اليجلى نيم خشم أبو قبيلة وهو خنعم بن أنمار من الين ويقال هم
  من معدّ وصاروا باليمن ⁦(خدم)⁩ خدمه يخدمه خدمة والخادم واحد الخدم غلاما كان
  أوجارية وأخدمه أى أعطاءخاد ما والخدمة سيريشد ف رسغ البعير تشد اليمسريحة النعل
  وبه بمى الخلوال خدمة لانه ربما كان من سيورير كب فيه الذهب والفضة والهع خدام وقد
  عى حلقة القوم خدمة وفى الحديث فضّ خدمنكم أى فرق جعكم والمخدم والمخدّمتموضع
  الخدام من الساق والتخديم أن يقصريياض التحعيل عى الوظيف فيستديربأ رساغ رجليه
  دون يديه فوق الاشاعرفان كان برجل واحدة فهو أرجسل وفرس مخدم وأخدم أيضا وقوم
  مخدمون أى مخدومون يراديه كثرة الخ-دم والحشم ورحل مخدوم له تابعة من الجنّ
  والخدماء الشاة بيض أوظفتها مثل الجلاه وقول الشاعر * تعي الارح المخدماء فائما
  يريد وعلاا بيضت أوظفته ⁦(خذم)⁩ خذمه خذما أى قطعه والتخذيم التقطيع والمخذم
  السيف الناطع وفرس خدم أى سريع ورجل خدم أى سمح عند العطاء والخذماء العنرتشق
  أذنهاءر ضا من غيريينونة وانلخذم بالتدريك السرعة فى السير وظليم خذوم وقال يصف ظليما!
  مزع يطيره أزفتخذوم * وابن خدام رجل من الشعراء فى قول امرئ القيس ١
  كما يكى اين خذام • ⁦(خرم)⁩ انخرم أنف الجيل والخرم مصدوة ولك خرمت اتء رزأخرحه
  بالمكسراذا أثأيته وماخرمت منه شيأ أى ما تقضت وما قطعت وماخرم الدليل عن الطريق
  أى ماع_دل ورجل أخرم بين الحرم وهو الذى قطعت وترة أنفه أو طرف أنفه لا يبلغ الجدع
  والاخرم أيضا المثقوب الاذن وقدانخرم نقبسه أى انشق فاذالم ينشق فهو أخرم وذلك
  الموضع منه الحرمة وأخرم الكتف طرف عيره والمخبرم يكسر الراممنقطع أنف الجبل
  والجمع المخارم وهى أفواه الفجاج وعين ذات مخارم أى ذات مخارج ومخرمة بالفتح اسم
  رجل واخترمهم الدهر وتخزمهم أى اقتطعهم واستأصلهم وتخترم زبدفلان أى سكن
  غضبه وتخزم أى دان بدين الجرمية وهم أمحاب التناسخ والاباحة والخرمات بالضم
  الكذب يقال جاءفلان بالخرمان والخورم صخرة فيها نروق والخورمة أرنبة الانسان.
  حرنم
