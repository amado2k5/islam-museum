label: { ar: "سنن ابن ماجه 1834 — اليتيم وفقد الأب", en: "Sunan Ibn Majah 1834 — the orphan and the father lost", ur: "سنن ابن ماجہ 1834 — یتیم اور باپ کی موت", es: "Sunan Ibn Majah 1834 — El huérfano y el padre perdido", fr: "Sunan Ibn Majah 1834 — L'orphelin et le père perdus", tr: "Sunan İbn Majah 1834 — Yetim ve Babayı Kaybetme", id: "Sunan Ibn Majah 1834 — Anak Yatim dan Kehilangan Ayah" }
text: "… سَأَلْتُ رَسُولَ اللَّهِ ـ أَيُجْزِئُ عَنِّي مِنَ الصَّدَقَةِ النَّفَقَةُ عَلَى زَوْجِي وَأَيْتَامٍ فِي حِجْرِي قَالَ رَسُولُ اللَّهِ ـ \" لَهَا أَجْرَانِ أَجْرُ الصَّدَقَةِ وَأَجْرُ الْقَرَابَةِ \". حَدَّثَنَا الْحَسَنُ بْنُ مُحَمَّدِ بْنِ الصَّبَّاحِ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، حَدَّثَنَا الأَعْمَشُ، عَنْ شَقِيقٍ، عَنْ عَمْرِو بْنِ الْحَارِثِ ابْنِ أَخِي، زَيْنَبَ عَنْ زَيْنَبَ، امْرَأَةِ عَبْدِ اللَّهِ عَنِ النَّبِيِّ ـ نَحْوَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1834، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1834 (The Chapters Regarding Zakat), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1834، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1834 (Los capítulos sobre el Zakat), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sunan Ibn Majah, n° 1834 (Les chapitres relatifs à la Zakat), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "İbn Majah'ın Sünen'inde yer alan 1834 numaralı hadiste yetimlerden ve babasızlık durumundan bahsedilir. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1834, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Hadits ini dikumpulkan oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
