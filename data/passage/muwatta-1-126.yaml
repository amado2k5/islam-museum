label: { ar: "الموطأ 126 — مالك فيمن وجد أثر الاحتلام ولا يدري متى كان", en: "Muwatta 126", ur: "موطأ 126 — مالک: احتلام کا اثر ملے مگر خواب یاد نہ ہو", es: "Muwatta 126", fr: "Muwatta 126", tr: "Al-Muwatta 126 — Malik, gece boşalmasının izlerini bulan ve ne zaman gerçekleştiğini bilmeyen kişi hakkında", id: "Al-Muwatta 126 — Malik tentang orang yang menemukan jejak ejakulasi nokturnal dan tidak mengetahui kapan terjadinya" }
summary:
  ar: "قول لمالك في باب إعادة الجنب الصلاة: من وجد في ثوبه أثر احتلام ولا يدري متى كان ولا يذكر شيئاً رآه في منامه، فليغتسل من أحدث نوم نامه، وإن كان صلى بعد ذلك النوم أعاد ما صلى بعده، لأن الرجل قد يحتلم ولا يرى شيئاً ويرى ولا يحتلم، فإذا وجد في ثوبه ماءً فعليه الغسل؛ ويستدل بأن عمر أعاد ما صلى بعد آخر نوم نامه ولم يعد ما قبله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.95} {cite:muwatta-maruf-1997 p.96}"
  ur: "موطأ میں مالک کا قول، نمبر 126: جو شخص اپنے کپڑے میں احتلام کا اثر پائے اور خواب میں کچھ یاد نہ ہو تو وہ اپنی سب سے حالیہ نیند سے غسل کرے، اور اگر اس کے بعد نماز پڑھی ہو تو وہی نماز دوبارہ پڑھے — کیونکہ عمر نے بھی آخری نیند کے بعد کی نماز دہرائی۔"
  tr: "Malik, ritüel kirlilik halinde olan birinin namazlarını tekrar etmesiyle ilgili bölümde şöyle demiştir: Bir kimse elbisesinde ıslak rüya izleri bulur ve bunun ne zaman olduğunu veya rüyasında ne gördüğünü bilmiyorsa, en son uykusundan sonra gusül abdesti almalıdır. Eğer o uykudan sonra namaz kılmışsa, daha sonra kıldığı namazları tekrar etmelidir, çünkü bir insan hiçbir şey görmeden ıslak rüya görebilir veya ıslak rüya görmeden bir şey görebilir. Bu nedenle, elbisesinde su bulursa, gusül abdesti almalıdır. Bu, Ömer'in son uykusundan sonra kıldığı namazları tekrar etmesi, ancak öncesinde kıldığı namazları tekrar etmemesi gerçeğiyle desteklenmektedir. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.95} {cite:muwatta-maruf-1997 s.96}"
  id: "Malik berkata dalam bab tentang mengulang salat bagi orang yang dalam keadaan najis: Jika seseorang menemukan bekas mimpi basah pada pakaiannya dan tidak tahu kapan itu terjadi atau apa yang dilihatnya dalam mimpinya, ia harus melakukan ghusl (mandi wajib) setelah tidur terakhirnya. Jika ia telah salat setelah tidur itu, ia harus mengulang salat yang dilakukannya setelah itu, karena seseorang mungkin mengalami mimpi basah tanpa melihat apa pun, atau ia mungkin melihat sesuatu tanpa mengalami mimpi basah. Oleh karena itu, jika ia menemukan air pada pakaiannya, ia harus melakukan ghusl. Hal ini didukung oleh fakta bahwa Umar mengulang salat yang dilakukannya setelah tidur terakhirnya tetapi tidak mengulang salat sebelumnya. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.95} {cite:muwatta-maruf-1997 p.96}"
