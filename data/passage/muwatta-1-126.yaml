label: { ar: "الموطأ 126 — مالك فيمن وجد أثر الاحتلام ولا يدري متى كان", en: "Muwatta 126" }
summary:
  ar: "قول لمالك في باب إعادة الجنب الصلاة: من وجد في ثوبه أثر احتلام ولا يدري متى كان ولا يذكر شيئاً رآه في منامه، فليغتسل من أحدث نوم نامه، وإن كان صلى بعد ذلك النوم أعاد ما صلى بعده، لأن الرجل قد يحتلم ولا يرى شيئاً ويرى ولا يحتلم، فإذا وجد في ثوبه ماءً فعليه الغسل؛ ويستدل بأن عمر أعاد ما صلى بعد آخر نوم نامه ولم يعد ما قبله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.95} {cite:muwatta-maruf-1997 p.96}"
