label: { ar: "صحيح مسلم 4689 — اليتيم وفقد الأب", en: "Sahih Muslim 4689 — the orphan and the father lost", ur: "صحیح مسلم 4689 — یتیم اور باپ کی موت" }
text: "وَحَدَّثَنِي أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا زَائِدَةُ، حَدَّثَنَا سُلَيْمَانُ الأَعْمَشُ، عَنِ الْمُخْتَارِ بْنِ صَيْفِيٍّ، عَنْ يَزِيدَ بْنِ هُرْمُزَ، قَالَ كَتَبَ نَجْدَةُ إِلَى ابْنِ عَبَّاسٍ. فَذَكَرَ بَعْضَ الْحَدِيثِ وَلَمْ يُتِمَّ الْقِصَّةَ كَإِتْمَامِ مَنْ ذَكَرْنَا حَدِيثَهُمْ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4689، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4689 (The Book of Jihad and Expeditions), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4689، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
