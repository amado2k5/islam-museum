text: "… عَنْ يَحْيِى أبْنِ لِلنَّاس. فَأَنَاهُ رَجُلّ، فَقَالَ: يَا رَسُولَ اللّه! مَا الإِيَمَانُ؟ قال: أنْ يَعْمَرَ، قال: لَمَّا تَكَلَّمَ مَعْبَدٌ بِمَا تَكَلَّمَ بِهِ فِي شَأْنِ الْقَلَرِ، أَنْكَرْنَا تُؤْمِنَ باللّه وَمَلائِكَيْهِ وَكِتَابِهِ وَلِقَائِهِ وَرُسُلِهِ وَتُؤْمِنَ بِالْبَعْثِ ذَلِكَ. قال فَحَجَجْتُ أنَا وَحُميْدُ ايْنُ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 83، يذكر السؤال عن الإيمان وجوابه، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 83, that mentions the question about faith and its answer, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 83 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
