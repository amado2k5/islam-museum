label: { ar: "جامع الترمذي 3104 — جمع القرآن والمصاحف", en: "Jami' al-Tirmidhi 3104 — the collection of the Qur'an and the codices", ur: "جامع ترمذی 3104 — جمعِ قرآن اور مصاحف", es: "Jami' al-Tirmidhi 3104 — la colección del Corán y los códices" }
text: "… قَبْلَ أَنْ يَخْتَلِفُوا فِي الْكِتَابِ كَمَا اخْتَلَفَتِ الْيَهُودُ وَالنَّصَارَى فَأَرْسَلَ إِلَى حَفْصَةَ أَنْ أَرْسِلِي إِلَيْنَا بِالصُّحُفِ نَنْسَخُهَا فِي الْمَصَاحِفِ ثُمَّ نَرُدُّهَا إِلَيْكِ فَأَرْسَلَتْ حَفْصَةُ إِلَى عُثْمَانَ بِالصُّحُفِ فَأَرْسَلَ عُثْمَانُ إِلَى زَيْدِ بْنِ ثَابِتٍ وَسَعِيدِ بْنِ الْعَاصِي وَعَبْدِ الرَّحْمَنِ بْنِ الْحَارِثِ بْنِ هِشَامٍ وَعَبْدِ اللَّهِ بْنِ الزُّبَيْرِ أَنِ انْسَخُوا الصُّحُفَ فِي الْمَصَاحِفِ وَقَالَ لِلرَّهْطِ الْقُرَشِيِّينَ الثَّلاَثَةِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3104، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 3104 (Chapters on Tafsir), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 3104، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3104 (Capítulos sobre Tafsir), menciona la colección del Corán y los códices. El catálogo del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
