text: "أصلاتان معاً؟ أصلاتان معاً؟"
summary:
  ar: "يرويه مالك عن شريك بن عبد الله بن أبي نمر عن أبي سلمة بن عبد الرحمن مرسلاً، في باب ما جاء في ركعتي الفجر: سمع قوم الإقامة فقاموا يصلون ركعتي الفجر، فخرج عليهم النبي فقال منكراً: أصلاتان معاً؟ ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن الثوري والدراوردي تابعا مالكاً على إرساله، وأن محمد بن عمارة وإبراهيم بن طهمان روياه عن شريك عن أنس مرفوعاً، وينقل عن أبي حاتم الرازي أن رواية مالك ومن تابعه المرسلة أشبه وأصح ⁦(العلل 369)⁩. {cite:muwatta-maruf-1997 p.187}"
  tr: "Malik, Şerik ibn Abdullah ibn Abi Namir'den, o da Ebu Seleme ibn Abdülrahman'dan rivayetle, sabah namazının iki rekatıyla ilgili rivayetler bölümünde, mursal bir hadis olarak şöyle aktarmıştır: Bazı insanlar ezanı işittiler ve sabah namazının iki rekatını kılmak için ayağa kalktılar. Peygamber onlara çıktı ve onaylamayan bir şekilde, \"İki namazı birden mi kılacaksınız?\" dedi. Araştırmacı, Ebu Musab, Suveyd ve Muhammed ibn Hasan'ın bunu Malik'ten rivayet ettiğini ve el-Sevri ile el-Darawardi'nin de Malik'i mursal rivayetinde takip ettiğini belirtmektedir. Muhammed ibn Ammarah ve İbrahim ibn Tahman ise bunu Şerik'ten, o da Enes'ten merfu bir hadis olarak rivayet etmişlerdir. Ebu Hatim el-Razi'nin, Malik ve onu izleyenlerin mursal rivayetinin daha muhtemel ve daha sahih olduğunu söylediğini aktarmaktadır (el-İlal 369). {cite:muwatta-maruf-1997 s.187}"
  id: "Malik meriwayatkan hadits ini dari Sharik ibn Abdullah ibn Abi Namir, dari Abu Salamah ibn Abd al-Rahman, sebagai hadits mursal, dalam surah tentang apa yang diriwayatkan mengenai dua rakaat Subuh: Sebagian orang mendengar iqamah dan berdiri untuk mengerjakan dua rakaat Subuh. Nabi keluar kepada mereka dan berkata dengan nada tidak setuju, \"Dua rakaat shalat?\" Peneliti menyebutkan bahwa Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan meriwayatkannya dari Malik, dan bahwa al-Thawri dan al-Darawardi mengikuti Malik dalam riwayat mursalnya. Muhammad ibn Ammarah dan Ibrahim ibn Tahman meriwayatkannya dari Sharik, dari Anas, sebagai hadits marfu'. Ia mengutip Abu Hatim al-Razi yang mengatakan bahwa riwayat mursal Malik dan para pengikutnya lebih mungkin benar dan lebih otentik (al-`Ilal 369). {cite:muwatta-maruf-1997 p.187}"
