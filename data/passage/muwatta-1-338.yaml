text: "أصلاتان معاً؟ أصلاتان معاً؟"
summary:
  ar: "يرويه مالك عن شريك بن عبد الله بن أبي نمر عن أبي سلمة بن عبد الرحمن مرسلاً، في باب ما جاء في ركعتي الفجر: سمع قوم الإقامة فقاموا يصلون ركعتي الفجر، فخرج عليهم النبي فقال منكراً: أصلاتان معاً؟ ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن الثوري والدراوردي تابعا مالكاً على إرساله، وأن محمد بن عمارة وإبراهيم بن طهمان روياه عن شريك عن أنس مرفوعاً، وينقل عن أبي حاتم الرازي أن رواية مالك ومن تابعه المرسلة أشبه وأصح (العلل 369). {cite:muwatta-maruf-1997 p.187}"
