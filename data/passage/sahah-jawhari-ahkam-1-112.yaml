text: "… اجتزأتْ بالرُّطْبِ عن الماء. والبلَّةُ، بالكسر : النداوةُ. والبِلِّ: المباح. ومنه قول إنّي لا أُحِلْها لمغتسِل، وهي لشاربٍ حِلِّ وبِلَّ. قال الأصمعي: كنت أرى أن بِلا إتباع حتى زعم المعتمر بن سليمان أن بِلا في لغة حمير مباح، قال أبو …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 1، ص 112، يرد فيه ذكر المباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 1, p. 112, whose wording mentions the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الصحاح، جوہری، اسکین جلد 1، ص 112 کا اقتباس جس میں مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Sihah de al-Jawhari, volume numérisé 1, p. 112, dont le texte mentionne le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Sihah de al-Jawhari, volumen digitalizado 1, p. 112, cuyo texto menciona lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Cevheri'nin Sahih'inin 1. cildinin 112. sayfasından, izin verilen fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Al-Jawhari, Jilid 1, halaman 112, yang menyebutkan amalan-amalan yang diperbolehkan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
