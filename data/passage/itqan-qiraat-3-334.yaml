text: "الجزء الأول الإتقان في علوم القرآن تنبيه اختلف : هل المصاحفُ العثمانية مشتملةٌ على جميع الأحرف السبعةِ، فذهب جماعاتٌ من الفقهاء والقراءِ والمتكلمين إِلى ذلك، وبَنَوْا عليه أنه لا يجوزُ على الأمة أنْ تُهْمِلَ نَقْلَ شيءٍ منها، وقد أجمع الصحابةُ …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 334، يذكر الأحرف السبعة، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 334, that mentions the seven ahruf, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 334 کا اقتباس جس میں سبعہ احرف، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 334, que menciona los siete ahruf, los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre « al-Itqan fi 'Ulum al-Qur'an » d'al-Suyuti (tome 3, p. 334), mentionnant les sept ahruf (lecteurs), la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
