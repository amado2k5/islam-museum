text: "… معان مبينة فى علم بالكراهة لما تقدم فى الاعراب فلا حاجة لنا الى التطويل بهذه الحروف التى لا يتعلق بتطويل الكلام فيها كثير فائدة فان معرفة الواجب ما أى شىء ذلك قد عرفت من ذلك العلم، ولنشرع الآن بعون اللّٰه …"
summary:
  ar: "مقطع من إرشاد الفحول للشوكاني، ص 31، يرد فيه ذكر الواجب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shawkani's Irshad al-Fuhul, p. 31, whose wording mentions the obligatory (wajib), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ارشاد الفحول، شوکانی، ص 31 کا اقتباس جس میں واجب، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Irshad al-Fuhul de al-Shawkani, p. 31, dont le texte mentionne l'obligatoire (wajib), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Irshad al-Fuhul de al-Shawkani, p. 31, cuyo texto menciona lo obligatorio (wajib), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şavani'nin *İrshad el-Fuhul* adlı eserinin 31. sayfasından, farz ve mekruh amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh amelleri, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Irshad al-Fuhul* karya Al-Shawkani, halaman 31, yang menyebutkan amalan wajib dan amalan yang tidak disukai; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
