text: "… معان مبينة فى علم بالكراهة لما تقدم فى الاعراب فلا حاجة لنا الى التطويل بهذه الحروف التى لا يتعلق بتطويل الكلام فيها كثير فائدة فان معرفة الواجب ما أى شىء ذلك قد عرفت من ذلك العلم، ولنشرع الآن بعون اللّٰه …"
