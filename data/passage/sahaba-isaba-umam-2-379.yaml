text: "… زوج النَّبيّ وَلِلقه، كان وروى يعقوب بن سفيان من طريق أبي الأسود، عن عروة، قال: لما فرغ خالد من اليمامة أمره أبو بكر أحد أشراف قريش في الجاهلية، وكان إليه أعنة الخيل في الجاهلية، وشهد مع كفار قريش الحروب إلى …"
