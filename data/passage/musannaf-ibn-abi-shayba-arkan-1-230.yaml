text: "… من الليل إلى فنائه فيلقيه عليها. - حدثنا يزيد بن هارون قال أخبرنا المسعودي عن عون بن عبد اللّٰه كان يقول: ألا إن الحلم والحياء والعي عي اللسان، لا عي القلب، والفقه من الإيمان، وهن مما ينقصن من الدنيا ويزدن …"
summary:
