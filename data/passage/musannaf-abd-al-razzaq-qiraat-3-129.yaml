text: "… قَالَ رَسُولُ اللَّهِ لِهِ : حُبِّبَ إِلَيَّ الطَّيِّبُ وَالنَّسَاءُ، وَجُعِلَتْ قُرَةُ عَيْنِي فِي الصَّلَاةِ. - بَابُ مَا يُكْرَهُ أَنْ يُصْنَعَ فِي الْمَصَاحِفِ • عبد الرزاق، عَنْ مَعْمَرٍ، عَنْ أَيُوبَ، عَنِ ابْنِ سِيرِينَ أَنَّهُ كَانَ يَكْرَهُ أَنْ يُشَكَّلَ الْمُصْحَفُ، أَوْ يُزَادَ …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 3، ص 129، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 3, p. 129, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 3، ص 129 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 3, pág. 129, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 3, page 129, mentionnant la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Abdülrazzak'ın Musannaf adlı eserinin Resimli Cilt 3, sayfa 129'dan bir alıntı, Kur'an'ın derlenmesini ve el yazmalarını, ayrıca Kur'an'ın diyakritik işaretlerini ve biçimlendirmesini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 3, hlm. 129, membahas penyusunan Al-Qur'an dan manuskripnya, serta tanda diakritik dan format Al-Qur'an. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
