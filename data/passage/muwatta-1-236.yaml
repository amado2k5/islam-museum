label: { ar: "الموطأ 236 — ابن عمر يعيب التربع في الصلاة ويعتذر بالشكوى", en: "Muwatta 236", es: "Muwatta 236", fr: "Muwatta 236", ur: "موطا 236", tr: "El-Muvatta 236 — İbn Ömer, namazda bağdaş kurarak oturmayı eleştirir ve şikayet ederek kendini savunur.", id: "Al-Muwatta 236 — Ibnu Umar mengkritik duduk bersila dalam salat dan membenarkan tindakannya dengan mengeluh." }
summary:
  ar: "أثر يرويه مالك عن عبد الله بن دينار، في باب العمل في الجلوس في الصلاة: صلى رجل إلى جنب عبد الله بن عمر فلما جلس في الرابعة تربع وثنى رجليه، فعاب ذلك عليه ابن عمر بعد الصلاة، فقال الرجل إنه يفعله، فأجاب ابن عمر بأنه يفعله لأنه يشتكي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.142} {cite:muwatta-maruf-1997 p.143}"
  tr: "Malik'in, namazda doğru oturma pozisyonu bölümünde Abdullah ibn Dinar'dan rivayet ettiği bir hadis şöyledir: Bir adam Abdullah ibn Umar'ın yanında namaz kılıyordu. Dördüncü rekatta bağdaş kurarak oturdu. İbn Umar namazdan sonra onu bu yüzden eleştirdi. Adam hasta olduğu için böyle yaptığını söyledi. İbn Umar da bir rahatsızlığı olduğu için böyle yaptığını söyledi. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.142} {cite:muwatta-maruf-1997 s.143}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Abdullah ibn Dinar, dalam bab tentang postur duduk yang benar dalam salat: Seorang pria salat di sebelah Abdullah ibn Umar. Ketika ia duduk di rakaat keempat, ia duduk bersila dengan kedua kaki terlipat. Ibn Umar mengkritiknya setelah salat. Pria itu berkata bahwa ia melakukannya karena sakit. Ibn Umar menjawab bahwa ia melakukannya karena sedang sakit. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.142} {cite:muwatta-maruf-1997 p.143}"
