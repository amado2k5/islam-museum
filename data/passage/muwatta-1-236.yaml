label: { ar: "الموطأ 236 — ابن عمر يعيب التربع في الصلاة ويعتذر بالشكوى", en: "Muwatta 236" }
summary:
  ar: "أثر يرويه مالك عن عبد الله بن دينار، في باب العمل في الجلوس في الصلاة: صلى رجل إلى جنب عبد الله بن عمر فلما جلس في الرابعة تربع وثنى رجليه، فعاب ذلك عليه ابن عمر بعد الصلاة، فقال الرجل إنه يفعله، فأجاب ابن عمر بأنه يفعله لأنه يشتكي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.142} {cite:muwatta-maruf-1997 p.143}"
