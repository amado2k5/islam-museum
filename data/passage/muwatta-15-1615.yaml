label: { ar: "الموطأ 1615 — مالك: من تظاهر من امرأته ثم مسها قبل أن يكفر، فعليه كفارة واحدة، ويكف عنها حتى يكفر ويستغفر الله", en: "Muwatta 1615", es: "Muwatta 1615", fr: "Muwatta 1615", ur: "موطا 1615", tr: "El-Muvatta 1615 — Malik: Kim karısına takva yemini eder de kefaretini ödemeden önce onunla cinsel ilişkiye girerse, bir kefaret namazı kılmalı ve kefaretini ödeyip Allah'tan bağışlanma dileyene kadar onunla cinsel ilişkiden uzak durmalıdır.", id: "Al-Muwatta 1615 — Malik: Barang siapa yang bernazar kepada istrinya dan kemudian bersetubuh dengannya sebelum menebus nazarnya, maka ia wajib menebus nazarnya sekali saja, dan ia wajib menahan diri dari bersetubuh dengannya sampai ia menebus nazarnya dan memohon ampunan kepada Allah." }
summary:
  ar: "يقول مالك ومن تظاهر من امرأته ثم مسها قبل أن يكفر، إنه ليس عليه إلا كفارة واحدة، ويكف عنها حتى يكفر ويستغفر الله، وذلك أحسن ما سمعت. {cite:muwatta-maruf-1997 p.69}"
  tr: "Malik şöyle dedi: Bir erkek karısına karşı dindarlık yemini eder ve sonra kefaretini ödemeden önce onunla cinsel ilişkiye girerse, yalnızca bir kere kefaret ödemesi gerekir ve kefaretini ödeyip Allah'tan bağışlanma dileyene kadar onunla cinsel ilişkiden uzak durmalıdır. Duyduğum en iyi görüş budur. {cite:muwatta-maruf-1997 s.69}"
  id: "Malik berkata: Jika seorang pria bernazar untuk berbuat saleh terhadap istrinya dan kemudian bersetubuh dengannya sebelum menebus dosanya, maka ia hanya diwajibkan untuk melakukan satu penebusan dosa, dan ia harus menahan diri dari bersetubuh dengannya sampai ia menebus dosanya dan memohon ampunan dari Tuhan. Itulah pendapat terbaik yang pernah saya dengar. {cite:muwatta-maruf-1997 p.69}"
