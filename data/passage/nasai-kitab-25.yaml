  en: "Sunan al-Nasa'i, Book 25: The Book of Jihad"
  ur: "سنن نسائی، کتاب الجہاد"
  es: "Sunan al-Nasa'i, Libro 25: El Libro de la Yihad"
  fr: "Sunan al-Nasa'i, Livre 25: Le Livre du Jihad"
