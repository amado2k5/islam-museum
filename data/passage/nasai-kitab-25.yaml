summary:
  ar: "القسم 25 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجهاد»، ويضم فيها النصوص من 3085 إلى 3195 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 25 of Sunan al-Nasa'i (The Book of Jihad) in the division of the open hadith dataset the museum took its reports from: reports 3085 to 3195 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 25، عنوان «کتاب الجہاد»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3085 تا 3195۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 25 de Sunan al-Nasa'i (El Libro de la Yihad) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3085 al 3195 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre du Jihad), dans la partie 3085 à 3195 de la base de données ouverte, sous laquelle il a conservé les informations relatives à ces hadiths. Les éditions imprimées classent ces hadiths différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 25. bölümü \"Cihad Kitabı\" başlığını taşımakta olup, 3085 ile 3195 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 25 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Jihad\" dan berisi teks 3085 hingga 3195, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
