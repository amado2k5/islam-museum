label: { ar: "الموطأ 2692 — بلغ مالكا: عيسى ابن مريم يوصي بني إسرائيل بالماء القراح والبقل البري وخبز الشعير", en: "Muwatta 2692", es: "Muwatta 2692", fr: "Muwatta 2692", ur: "موطا 2692", tr: "El-Muvatta 2692 — Malik şöyle rivayet etmiştir: Meryem oğlu İsa, İsrailoğullarına temiz su içmelerini, yabani otlar yemelerini ve arpa ekmeği yemelerini tavsiye etti.", id: "Al-Muwatta 2692 — Malik meriwayatkan: Isa, putra Maryam, menasihati Bani Israel untuk minum air murni, makan tumbuh-tumbuhan liar, dan makan roti jelai." }
summary:
  ar: "بلغ مالكا أن عيسى ابن مريم كان يقول: يا بني إسرائيل، عليكم بالماء القراح، والبقل البري، وخبز الشعير، وإياكم وخبز البر، فإنكم لن تقوموا بشكره. {cite:muwatta-maruf-1997 p.521}"
  tr: "Malik, Meryem oğlu İsa'nın şöyle buyurduğunu aktarmıştır: \"Ey İsrailoğulları, temiz su, yabani otlar ve arpa ekmeği yiyin; buğday ekmeğinden sakının, çünkü onun için şükredemezsiniz.\" {cite:muwatta-maruf-1997 s.521}"
  id: "Malik melaporkan bahwa Yesus, putra Maria, biasa berkata: \"Wahai Bani Israel, makanlah air murni, tumbuh-tumbuhan liar, dan roti jelai, tetapi waspadalah terhadap roti gandum, karena kamu tidak akan dapat mengucap syukur karenanya.\" {cite:muwatta-maruf-1997 p.521}"
