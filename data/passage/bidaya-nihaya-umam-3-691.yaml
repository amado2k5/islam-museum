text: "… أن اليمن كانت لحمير، وكانت ملوكهم يسمون التبابعة، وتكلمنا في أيام الجاهلية على طرف صالح من هذا، ثم إن ملك الحبشة بعث أميرين من قواده، وهما أبرهه الأشرم، وأرياط، فتملكا له اليمن من حمير، وصار ملكها للحبشة، ثم اختلف هذان …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 691، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
