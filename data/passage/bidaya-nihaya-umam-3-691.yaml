text: "… أن اليمن كانت لحمير، وكانت ملوكهم يسمون التبابعة، وتكلمنا في أيام الجاهلية على طرف صالح من هذا، ثم إن ملك الحبشة بعث أميرين من قواده، وهما أبرهه الأشرم، وأرياط، فتملكا له اليمن من حمير، وصار ملكها للحبشة، ثم اختلف هذان …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 691، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 691, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 691 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
