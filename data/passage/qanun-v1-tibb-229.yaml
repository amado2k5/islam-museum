text: "الكتاب الأول الفن الثالث: في سبب الصحة والمرض وضرورة الموت الغليظة أورثت وجع المفاصل والكلى والربو وضيق النفس البلغمية والسوداوية. وأما إذا عرضت من أغذية لطيفة فيعرض منها حميات حادة خبيئة وأورام حادة رديئة، وربما احتيج إلى إدخال طعام ما …"
