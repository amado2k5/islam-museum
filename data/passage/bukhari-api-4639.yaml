label: { ar: "صحيح البخاري 4639 — الكمأة، الشفاء", en: "Sahih al-Bukhari 4639 — truffles and their water for the eye; healing", ur: "صحیح بخاری 4639 — کھمبی، شفا", es: "Sahih al-Bukhari 4639 — Trufas y su agua para los ojos; curación", fr: "Sahih al-Bukhari 4639 — Les truffes et leur eau pour les yeux; guérison", tr: "Sahih al-Buhari 4639 — Yermantarları, Şifa", id: "Sahih al-Bukhari 4639 — Truffle, Penyembuhan" }
text: "حَدَّثَنَا مُسْلِمٌ، حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ الْمَلِكِ، عَنْ عَمْرِو بْنِ حُرَيْثٍ، عَنْ سَعِيدِ بْنِ زَيْدٍ، عَنِ النَّبِيِّ قَالَ \" الْكَمْأَةُ مِنَ الْمَنِّ وَمَاؤُهَا شِفَاءُ الْعَيْنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4639، يذكر الكمأة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4639 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions truffles and their water for the eye, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4639، جس میں کھمبی، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4639 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona las trufas y su agua para la curación de los ojos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4639 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne les truffes et leur eau pour les yeux, ainsi que leurs vertus curatives. Le moteur de recherche « Medicine Browser » le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4639 numaralı hadis, trüf mantarlarının şifalı özelliklerinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4639, menyebutkan jamur truffle dan khasiat penyembuhannya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
