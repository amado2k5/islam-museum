text: "… في ترجمة نافع مولاه. سلمة بن عبد يسوع عن أبيه عن جده... فذكر قصة أسقف نجران وإرسالهم إلى النَّبي للاليه و مصالحتهم له ومن أخبار غيلان في الجاهلية ما حكاه أبو سعيد وكتابه لهم بذلك وفي آخره: شهد أبو سفيان …"
summary:
