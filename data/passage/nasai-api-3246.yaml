text: "أَخْبَرَنَا مُحَمَّدُ بْنُ آدَمَ، قَالَ حَدَّثَنَا عَلِيُّ بْنُ هَاشِمِ بْنِ الْبَرِيدِ، عَنْ يَزِيدَ بْنِ كَيْسَانَ، عَنْ أَبِي حَازِمٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ جَاءَ رَجُلٌ مِنَ الأَنْصَارِ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ إِنِّي تَزَوَّجْتُ امْرَأَةً ‏.‏ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ أَلاَ نَظَرْتَ إِلَيْهَا فَإِنَّ فِي أَعْيُنِ الأَنْصَارِ شَيْئًا ‏\"‏ ‏.‏ قَالَ أَبُو عَبْدِ الرَّحْمَن …"
summary:
  ar: "في السنن النسائي؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sunan al-Nasa'i; mention of the chancery or the barid post."
  ur: "سنن النسائی میں؛ دیوآن یا بریڈ کا ذکر."
