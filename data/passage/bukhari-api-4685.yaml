text: "هِشَامٌ يَدْنُو الْمُؤْمِنُ ـ حَتَّى يَضَعَ عَلَيْهِ كَنَفَهُ، فَيُقَرِّرُهُ بِذُنُوبِهِ تَعْرِفُ ذَنْبَ كَذَا يَقُولُ أَعْرِفُ، يَقُولُ رَبِّ أَعْرِفُ مَرَّتَيْنِ، فَيَقُولُ سَتَرْتُهَا فِي الدُّنْيَا وَأَغْفِرُهَا لَكَ الْيَوْمَ ثُمَّ تُطْوَى صَحِيفَةُ حَسَنَاتِهِ، وَأَمَّا الآخَرُونَ أَوِ الْكُفَّارُ فَيُنَادَى عَلَى رُءُوسِ الأَشْهَادِ هَؤُلاَءِ الَّذِينَ كَذَبُوا عَلَى رَبِّهِمْ ‏\"‏‏.‏ وَقَالَ شَيْبَانُ عَنْ قَتَادَةَ حَدَّثَنَا صَفْوَانُ‏.‏"
summary:
  ar: "في صحيح البخاري؛ ذكر كتابة كتاب أو إرساله."
  en: "In Sahih al-Bukhari; mention of writing or dispatching a letter."
  ur: "صحیح بخاری میں؛ خط لکھنے یا بھیجنے کا ذکر."
