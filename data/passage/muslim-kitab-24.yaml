label:
  ar: "صحيح مسلم، كتاب الهبات"
  en: "Sahih Muslim, Book 24: The Book of Gifts"
  ur: "صحیح مسلم، کتاب الہبات"
  es: "Sahih Muslim, Libro 24: El Libro de los Regalos"
  fr: "Sahih Muslim, Livre 24: Le Livre des dons"
summary:
  ar: "القسم 24 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الهبات»، ويضم فيها النصوص من 4163 إلى 4203 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 24 of Sahih Muslim (The Book of Gifts) in the division of the open hadith dataset the museum took its reports from: reports 4163 to 4203 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 24، عنوان «کتاب الہبات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4163 تا 4203۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 24 de Sahih Muslim (El Libro de los Regalos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4163 al 4203 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre des dons), volume 24, qui correspond aux hadiths 4163 à 4203 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
