text: "… وكلَّ نهرِ عظيم بَحْرٌ، قال عديٌّ : الخفيف سَرَّهُ مَالُهُ وكَثْرَةُ ما يَمْ لِكُ والبَخرُ مُعْرِضًا والسَديرُ يعني : الفرات. ويسمَّى الفرسُ الواسعُ الجري بَخْرًا، ومنه قول النبي وَل في في مندوبٍ فَرَسِ أبي طلحةً: إنْ وجَدْناه لَبَحْرًا. وماءٌ بَحْرٌ، …"
