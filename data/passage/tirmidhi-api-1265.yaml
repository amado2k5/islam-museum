label: { ar: "جامع الترمذي 1265 — بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 1265 — dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 1265 — والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 1265 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Jami' al-Tirmidhi 1265 — le respect des parents ou la désobéissance envers eux", tr: "Cami' el-Tirmizi 1265 — Anne babaya iyilik mi, yoksa onlara itaatsizlik mi?", id: "Jami' al-Tirmidhi 1265 — Berbuat baik kepada orang tua atau durhaka kepada mereka" }
text: "… عَيَّاشٍ، عَنْ شُرَحْبِيلَ بْنِ مُسْلِمٍ الْخَوْلاَنِيِّ، عَنْ أَبِي أُمَامَةَ، قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ فِي خُطْبَتِهِ عَامَ حَجَّةِ الْوَدَاعِ \" الْعَارِيَةُ مُؤَدَّاةٌ وَالزَّعِيمُ غَارِمٌ وَالدَّيْنُ مَقْضِيٌّ \". قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ سَمُرَةَ وَصَفْوَانَ بْنِ أُمَيَّةَ وَأَنَسٍ. قَالَ وَحَدِيثُ أَبِي أُمَامَةَ حَدِيثٌ حَسَنٌ. وَقَدْ رُوِيَ عَنْ أَبِي أُمَامَةَ عَنِ النَّبِيِّ أَيْضًا مِنْ غَيْرِ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1265، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1265 (The Book on Business), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1265، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1265 (El Libro de los Negocios), menciona la obediencia o desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1265 (Livre des Affaires), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Cami' el-Tirmizi'nin 1265 numaralı hadisinde, anne babaya saygı göstermek veya göstermemek konusu ele alınmaktadır. \"İslam'da Ebeveynlik\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1265, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Bagian \"Kekeluargaan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
