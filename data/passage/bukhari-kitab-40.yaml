summary:
  ar: "القسم 40 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوكالة»، ويضم فيها النصوص من 2299 إلى 2319 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 40 of Sahih al-Bukhari (Representation, Authorization, Business by Proxy) in the division of the open hadith dataset the museum took its reports from: reports 2299 to 2319 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 40، عنوان «کتاب الوکالۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2299 تا 2319۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 40 de Sahih al-Bukhari (Representación, Autorización, Negocios por Poder) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2299 al 2319 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 40, « Représentation, autorisation, commerce par procuration »), dans la section 2299 à 2319 de la base de données ouverte. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 40. bölümü \"Temsilcilik Kitabı\" başlığını taşımakta olup, 2299'dan 2319'a kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 40 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Keagenan\" dan berisi teks 2299 hingga 2319, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
