label: { ar: "سنن النسائي 1981 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 1981 — a burial, grave or resting place", ur: "سنن نسائی 1981 — تدفین، قبر اور مرقد", es: "Sunan al-Nasa'i 1981 — un lugar de entierro, tumba o descanso.", fr: "Sunan al-Nasa'i 1981 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sunan al-Nasa'i 1981 — Defin, Mezar ve Türbe", id: "Sunan al-Nasa'i 1981 — Pemakaman, Kuburan, dan Makam" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي أُمَامَةَ بْنِ سَهْلٍ، قَالَ مَرِضَتِ امْرَأَةٌ مِنْ أَهْلِ الْعَوَالِي وَكَانَ النَّبِيُّ أَحْسَنَ شَىْءٍ عِيَادَةً لِلْمَرِيضِ فَقَالَ \" إِذَا مَاتَتْ فَآذِنُونِي \". فَمَاتَتْ لَيْلاً فَدَفَنُوهَا وَلَمْ يُعْلِمُوا النَّبِيَّ فَلَمَّا أَصْبَحَ سَأَلَ عَنْهَا فَقَالُوا كَرِهْنَا أَنْ نُوقِظَكَ يَا رَسُولَ اللَّهِ. فَأَتَى قَبْرَهَا فَصَلَّى عَلَيْهَا وَكَبَّرَ أَرْبَعًا."
summary:
  ar: "حديث في سنن النسائي، رقم 1981، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1981 (The Book of Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 1981، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1981 (El Libro de los Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Sunan al-Nasa'i, n° 1981 (Le Livre des Funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sunan-ı Nesai'de yer alan 1981 numaralı hadiste, defin, mezar ve türbeden bahsedilir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler üzerine araştırmalar yapan uzmanlar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 1981, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh para peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
