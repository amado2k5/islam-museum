summary:
  ar: "القسم 14 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجمعة»، ويضم فيها النصوص من 1367 إلى 1432 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 14 of Sunan al-Nasa'i (The Book of Jumu'ah (Friday Prayer)) in the division of the open hadith dataset the museum took its reports from: reports 1367 to 1432 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 14، عنوان «کتاب الجمعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1367 تا 1432۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 14 de Sunan al-Nasa'i (El Libro de la Oración del Viernes) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1367 al 1432, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre 14), dans la base de données ouverte, les hadiths 1367 à 1432. Il conserve ces informations sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 14. bölümü \"Cuma Namazı Kitabı\" başlığını taşımakta olup, 1367 ile 1432 Hicri yılları arasındaki metinleri buna göre numaralandırılmış olarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 14 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Shalat Jumat\" dan berisi teks-teks dari tahun 1367 hingga 1432 H, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
