label: { ar: "نوادر جحا الكبرى، ص 81 — «القاووق يلعب\")»", en: "Nawadir Juha al-Kubra, p. 81 — 'The Cap Is Playing'", ur: "نوادر جحا الکبریٰ، ص 81 — «ٹوپی کھیل رہی ہے»", fr: "Nawadir Juha al-Kubra, p. 81 — « Le bonnet joue »", es: "Nawadir Juha al-Kubra, p. 81 — «El gorro está jugando»", tr: "Juha'nın Büyük Fıkraları, s. 81 — “Kavuk çalıyor”", id: "Anekdot Hebat Juha, hlm. 81 — “Qawuq sedang bermain”" }
text: "… القاووقُ يلعبُ ذهب في يوم عيد إلى الميدان، خارج البلدة، ليرى الأولاد، كيف يلعبون،"
summary:
  ar: "في يوم عيد كان جحا يشاهد الأطفال يلعبون، فخطف أحدهم طاقيته ولعبوا بها؛ فعاد إلى البيت راكبًا بلا غطاء رأس؛ وسأله صديق أين طاقيته، فقال إنه شارك الأطفال اللعب متذكرًا طفولته. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  en: "On a feast day Juha watches children play; one snatches his cap and they play with it; he rides home bareheaded; a friend asks where his cap is; he says he joined the children at play, remembering his childhood. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  ur: "عید کے دن جحا بچوں کو کھیلتے دیکھ رہا تھا؛ ایک بچے نے اس کی ٹوپی جھپٹ لی اور وہ اس سے کھیلنے لگے؛ وہ ننگے سر سوار ہو کر گھر لوٹا؛ ایک دوست نے ٹوپی کا پوچھا تو اس نے کہا کہ میں بچپن یاد کرتے ہوئے بچوں کے کھیل میں شامل ہو گیا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  fr: "Un jour de fête, Juha regarde des enfants jouer; l'un lui arrache son bonnet et ils jouent avec; il rentre à cheval, nu-tête; un ami demande où est son bonnet; il dit qu'il s'est joint aux jeux des enfants, se souvenant de son enfance. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  es: "En un día de fiesta, Juha mira jugar a unos niños; uno le arrebata el gorro y juegan con él; vuelve a casa montado y sin cubrirse la cabeza; un amigo pregunta dónde está su gorro; él dice que se unió al juego de los niños, recordando su infancia. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  tr: "Bir tatil gününde Juha, çocukların oyun oynadığını izlerken içlerinden biri şapkasını kapıp onunla oynamaya başladı. Şapkasız eve döndü ve bir arkadaşı ona şapkasının nerede olduğunu sorduğunda, kendi çocukluğunu anımsayarak çocukların oyununa katıldığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 81}"
  id: "Pada suatu hari libur, Juha sedang memperhatikan anak-anak bermain ketika salah satu dari mereka merebut topinya dan mereka bermain dengannya. Dia pulang tanpa topinya, dan ketika seorang teman bertanya di mana topinya, dia mengatakan bahwa dia telah bergabung dengan anak-anak dalam permainan mereka, mengenang masa kecilnya sendiri. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
