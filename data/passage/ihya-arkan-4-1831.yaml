text: "… شعرة في جسده حسنة وانقلب بحجة مبرورة فإن جلس حتى يركع كتب له بكل ركعة ألفا ألف حسنة ومن صلى العتمة فله مثل ذلك ذا السياق وفي  وانقلب بحجة مبرورة لم أجد له أصلا شعب الإيمان للبيهقي من حديث …"
