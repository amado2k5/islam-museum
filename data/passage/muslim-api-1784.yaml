label: { ar: "صحيح مسلم 1784 — ما فُرض على الناس، ما تُرك خشية أن يُفرض", en: "Sahih Muslim 1784 — what was made obligatory on people; what was left for fear it would be made obligatory", ur: "صحیح مسلم 1784 — جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا", fr: "Sahih Muslim 1784 — ce qui a été imposé aux gens ; ce qui fut délaissé de crainte qu'il ne devienne obligatoire", es: "Sahih Muslim 1784 — lo que se impuso a la gente; lo que se dejó por temor a que se hiciera obligatorio" }
text: "… فَلَمَّا كَانَتِ اللَّيْلَةُ الرَّابِعَةُ عَجَزَ الْمَسْجِدُ عَنْ أَهْلِهِ فَلَمْ يَخْرُجْ إِلَيْهِمْ رَسُولُ اللَّهِ فَطَفِقَ رِجَالٌ مِنْهُمْ يَقُولُونَ الصَّلاَةَ. فَلَمْ يَخْرُجْ إِلَيْهِمْ رَسُولُ اللَّهِ حَتَّى خَرَجَ لِصَلاَةِ الْفَجْرِ فَلَمَّا قَضَى الْفَجْرَ أَقْبَلَ عَلَى النَّاسِ ثُمَّ تَشَهَّدَ فَقَالَ \" أَمَّا بَعْدُ فَإِنَّهُ لَمْ يَخْفَ عَلَىَّ شَأْنُكُمُ اللَّيْلَةَ وَلَكِنِّي خَشِيتُ أَنْ تُفْرَضَ عَلَيْكُمْ صَلاَةُ اللَّيْلِ فَتَعْجِزُوا عَنْهَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1784، يرد فيه ذكر ما فُرض على الناس، وما تُرك خشية أن يُفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 1784 (The Book of Prayer - Travellers), whose wording mentions what was made obligatory on people, what was left for fear it would be made obligatory. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 1784، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 1784, dont le texte mentionne ce qui a été imposé aux gens, ce qui fut délaissé de crainte qu'il ne devienne obligatoire. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 1784, cuyo texto menciona lo que se impuso a la gente, lo que se dejó por temor a que se hiciera obligatorio. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
