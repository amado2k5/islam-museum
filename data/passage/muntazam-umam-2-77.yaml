text: "ج - المنتظم صاحب صدقاته وتال له امض الى انتاجر وخذ ممه الحمسين الف دينار وتصدق بها. ولما اشتد مرضه فى علة الموت نخرج المسلمون بالمصاحف واليهود بالتوراة والنصارى بالأناجيل والمعلمون بالصبيان وكثر الدعاء فى الصحراء والمساجد نلما أحس با …"
summary:
