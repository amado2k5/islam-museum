label: { ar: "الموطأ 2579 — مالك: القوم المتهمون بالدم يحلف كل واحد منهم خمسين يمينا", en: "Muwatta 2579", es: "Muwatta 2579", fr: "Muwatta 2579", ur: "موطا 2579", tr: "El-Muvatta 2579 — Malik: Kan dökmekle suçlananların her biri elli yemin eder.", id: "Al-Muwatta 2579 — Malik: Orang-orang yang dituduh melakukan pertumpahan darah masing-masing mengucapkan lima puluh sumpah." }
summary:
  ar: "قال يحيى: وقد قال مالك في القوم يكون لهم العدد يُتهمون بالدم، فيرد ولاة المقتول الأيمان عليهم وهم نفر لهم عدد: أن يحلف كل إنسان منهم عن نفسه خمسين يمينا، ولا تُقطع الأيمان عليهم بقدر عددهم، ولا يبرؤون دون أن يحلف كل إنسان منهم عن نفسه خمسين يمينا. قال مالك: وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.455}"
  tr: "Yahya şöyle dedi: Malik, kan dökmekle suçlanan bir grup insan hakkında şöyle dedi: Öldürülen kişinin vasileri, sayıları çok olsa bile, onlardan yemin isterler: Her biri kendi adına elli yemin eder ve yeminler sayılarına göre alınmaz; her biri kendi adına elli yemin etmedikçe beraat etmezler. Malik dedi ki: Bu konuda duyduğum en iyi şey budur. {cite:muwatta-maruf-1997 s.455}"
  id: "Yahya berkata: Malik berkata mengenai sekelompok orang yang dituduh melakukan penumpahan darah, dan para wali dari orang yang dibunuh menuntut sumpah dari mereka, meskipun jumlah mereka banyak: bahwa masing-masing dari mereka bersumpah lima puluh sumpah atas namanya sendiri, dan sumpah itu tidak diambil dari mereka sesuai dengan jumlah mereka, dan mereka tidak dibebaskan kecuali masing-masing dari mereka bersumpah lima puluh sumpah atas namanya sendiri. Malik berkata: Ini adalah hal terbaik yang pernah saya dengar tentang masalah ini. {cite:muwatta-maruf-1997 p.455}"
