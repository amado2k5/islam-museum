label: { ar: "الموطأ 2579 — مالك: القوم المتهمون بالدم يحلف كل واحد منهم خمسين يمينا", en: "Muwatta 2579" }
summary:
  ar: "قال يحيى: وقد قال مالك في القوم يكون لهم العدد يُتهمون بالدم، فيرد ولاة المقتول الأيمان عليهم وهم نفر لهم عدد: أن يحلف كل إنسان منهم عن نفسه خمسين يمينا، ولا تُقطع الأيمان عليهم بقدر عددهم، ولا يبرؤون دون أن يحلف كل إنسان منهم عن نفسه خمسين يمينا. قال مالك: وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.455}"
