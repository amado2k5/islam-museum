label: { ar: "الموطأ 595 — مالك: ليس لغسل الميت عندنا شيء موصوف، ولكن يغسل فيطهر", en: "Muwatta 595", es: "Muwatta 595", fr: "Muwatta 595", ur: "موطا 595", tr: "El-Muvatta 595 — Malik: Ölen kişinin yıkanması için belirli bir yöntemimiz yoktur, fakat o yıkanır ve temizlenir.", id: "Al-Muwatta 595 — Malik: Kami tidak memiliki tata cara yang ditentukan untuk memandikan jenazah, tetapi ia dimandikan dan disucikan." }
summary:
  ar: "قول لمالك يختم به باب ما جاء في غسل الميت: ليس لغسل الميت عندنا شيء موصوف، وليس لذلك صفة معلومة، ولكن يُغسل فيُطهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب، ونقله الترمذي عنه عقب الحديث (990) من جامعه. {cite:muwatta-maruf-1997 p.307}"
  tr: "Malik, ölülerin yıkanmasıyla ilgili bölümü şu ifadeyle sonlandırıyor: \"Bizim mezhebimizde ölülerin yıkanması için belirlenmiş bir yöntem yoktur, bilinen belirli bir uygulama da yoktur. Aksine, ölüler yıkanır ve temizlenir.\" Editör, bunun Malik'ten Ebu Mus'ab tarafından rivayet edildiğini ve Tirmizi'nin de hadis derlemesinde (990) hadis esas alınarak bunu ondan naklettiğini belirtiyor. {cite:muwatta-maruf-1997 s.307}"
  id: "Malik menyimpulkan bab tentang memandikan jenazah dengan pernyataan berikut: \"Tidak ada metode yang ditentukan untuk memandikan jenazah dalam mazhab kami, dan tidak ada cara khusus yang diketahui untuk melakukannya. Sebaliknya, jenazah dimandikan dan disucikan.\" Editor mencatat bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab, dan bahwa al-Tirmidhi meriwayatkannya darinya setelah hadits (990) dalam koleksinya. {cite:muwatta-maruf-1997 p.307}"
