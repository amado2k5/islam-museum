summary:
  ar: "قول لمالك يختم به باب ما جاء في غسل الميت: ليس لغسل الميت عندنا شيء موصوف، وليس لذلك صفة معلومة، ولكن يُغسل فيُطهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب، ونقله الترمذي عنه عقب الحديث (990) من جامعه. {cite:muwatta-maruf-1997 p.307}"
