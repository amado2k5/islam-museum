label: { ar: "سنن ابن ماجه 117 — أسماء الأمراض", en: "Sunan Ibn Majah 117 — named diseases", ur: "سنن ابن ماجہ 117 — بیماریوں کے نام", es: "Sunan Ibn Majah 117 - enfermedades nombradas", fr: "Sunan Ibn Majah 117 — maladies nommées", tr: "Sünen İbni Mace 117 — Hastalık İsimleri", id: "Sunan Ibnu Majah 117 — Nama-nama Penyakit" }
text: "… الشِّتَاءِ وَثِيَابَ الشِّتَاءِ فِي الصَّيْفِ فَقُلْنَا لَوْ سَأَلْتَهُ فَقَالَ إِنَّ رَسُولَ اللَّهِ ـ بَعَثَ إِلَىَّ وَأَنَا أَرْمَدُ الْعَيْنِ يَوْمَ خَيْبَرَ قُلْتُ يَا رَسُولَ اللَّهِ إِنِّي أَرْمَدُ الْعَيْنِ. فَتَفَلَ فِي عَيْنِي ثُمَّ قَالَ \" اللَّهُمَّ أَذْهِبْ عَنْهُ الْحَرَّ وَالْبَرْدَ \". قَالَ فَمَا وَجَدْتُ حَرًّا وَلاَ بَرْدًا بَعْدَ يَوْمِئِذٍ. وَقَالَ \" لأَبْعَثَنَّ رَجُلاً يُحِبُّ اللَّهَ وَرَسُولَهُ وَيُحِبُّهُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 117، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 117 (The Book of the Sunnah), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 117، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 117 (El Libro de la Sunnah), menciona enfermedades específicas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 117 (Le Livre de la Sunna), mentionne des maladies nommées. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 117 numaralı hadiste hastalıkların isimleri geçmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 117, menyebutkan nama-nama penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
