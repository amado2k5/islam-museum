  en: "A report in Sahih Muslim, no. 7035 (Characteristics of The Hypocrites And Rulings Concerning Them), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
