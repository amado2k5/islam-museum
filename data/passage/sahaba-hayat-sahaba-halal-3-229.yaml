text: "… بالمعروف. وفى رواية اخرى عنه قال: انى انزلت مال اللّٰه منى بمنزلة مال اليتيم، مَنْ كَانَ عَيَّا قَلْيَسْتَمْعِفُ وَمَنْ كَانَ فَغِيْرًا فَلْيَأْ كُلْ يالْمَعْرُوفِ-.....و عنده ايضا عن عروة ان عمر بن الخطاب قال: لا يحل لي. من هذا المال إلا …"
