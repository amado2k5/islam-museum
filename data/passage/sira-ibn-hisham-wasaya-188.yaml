text: "… على حِمَارٍ له يريدُ الطائفَ، فَرَبَضَ به على شُبارِقَة، فدخلت في أخمُص رجله شَوْكَةٌ فقتلته، ومَرَّ به الحارثُ بن الطُّلاطِلَة، فأشار إلى رأسه، فامتخض قَيْحاً فقتله. قصة أبي أُزَيْهِر الدوسي قال ابن إسحاق: فلما حَضَرت الوليدَ الوفاةُ دعا بنيه، وكانوا …"
