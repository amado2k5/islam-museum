text: "… عاد الرابعةَ فاقتُلوه، أدرك النَّبيّ لِيِ، وكان أميراً على حمص وهو منسوخ بالإجماع، وبقوله وَلِية : لا يحلُّ دمُ لمعاوية، وماتَ بها، وصَلِّى عليه حبيب بن مَسْلمة. امرىٍ مسلم إلاَّ بإحدى ثلاث، وبجلده نُعيمان وقِيل : إِنَّه ماتَ سنة أَربعين. …"
