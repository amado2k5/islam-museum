ref: "4339"
label:
  ar: "ابن ماجه 4339 — آخر أهل النار خروجا وآخر أهل الجنة دخولا"
  en: "Ibn Majah 4339 — The last to leave the Fire and the last to enter Paradise"
  ur: "ابن ماجہ 4339 — آگ سے سب سے آخر میں نکلنے والا اور جنت میں سب سے آخر میں جانے والا"
  es: "Ibn Majah 4339 — El último en abandonar el Fuego y el último en entrar al Paraíso"
  fr: "Ibn Majah 4339 — Le dernier à quitter le Feu et le dernier à entrer au Paradis"
  tr: "İbn Majah 4339 — Cehennem ehlinin en son çıkanı ve cennet ehlinin en son girenidir."
  id: "Ibn Majah 4339 — Orang terakhir dari penghuni Neraka yang meninggalkannya dan orang terakhir dari penghuni Surga yang memasukinya"
text: "إني لأعلم آخر أهل النار خروجا منها وآخر أهل الجنة دخولا الجنة . رجل يخرج من النار حبوا فيقال له اذهب فادخل الجنة . فيأتيها فيخيل إليه أنها ملأى فيرجع فيقول يا رب وجدتها ملأى . فيقول الله اذهب فادخل …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4339: آخر أهل النار خروجا وآخر أهل الجنة دخولا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4339: The last to leave the Fire and the last to enter Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4339: آگ سے سب سے آخر میں نکلنے والا اور جنت میں سب سے آخر میں جانے والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 4339: El último en salir del Fuego y el último en entrar al Paraíso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 4339: Le dernier à quitter le Feu et le dernier à entrer au Paradis. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "İbn Majah Süneni'nde 4339 numaralı hadis-i kudsi şöyledir: \"Cehennem ehlinin en son çıkanı ve cennet ehlinin en son girenidir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 4339: “Orang terakhir dari penghuni neraka yang meninggalkannya dan orang terakhir dari penghuni surga yang memasukinya.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
