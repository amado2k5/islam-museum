label:
  ar: "ابن ماجه 4339 — آخر أهل النار خروجا وآخر أهل الجنة دخولا"
  en: "Ibn Majah 4339 — The last to leave the Fire and the last to enter Paradise"
  ur: "ابن ماجہ 4339 — آگ سے سب سے آخر میں نکلنے والا اور جنت میں سب سے آخر میں جانے والا"
text: "إني لأعلم آخر أهل النار خروجا منها وآخر أهل الجنة دخولا الجنة . رجل يخرج من النار حبوا فيقال له اذهب فادخل الجنة . فيأتيها فيخيل إليه أنها ملأى فيرجع فيقول يا رب وجدتها ملأى . فيقول الله اذهب فادخل …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4339: آخر أهل النار خروجا وآخر أهل الجنة دخولا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4339: The last to leave the Fire and the last to enter Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4339: آگ سے سب سے آخر میں نکلنے والا اور جنت میں سب سے آخر میں جانے والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
