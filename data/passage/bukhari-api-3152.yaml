label: { ar: "صحيح البخاري 3152 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3152 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3152 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3152 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3152 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ الْمِقْدَامِ، حَدَّثَنَا الْفُضَيْلُ بْنُ سُلَيْمَانَ، حَدَّثَنَا مُوسَى بْنُ عُقْبَةَ، قَالَ أَخْبَرَنِي نَافِعٌ، عَنِ ابْنِ عُمَرَما أَنَّ عُمَرَ بْنَ الْخَطَّابِ، أَجْلَى الْيَهُودَ وَالنَّصَارَى مِنْ أَرْضِ الْحِجَازِ، وَكَانَ رَسُولُ اللَّهِ لَمَّا ظَهَرَ عَلَى أَهْلِ خَيْبَرَ أَرَادَ أَنْ يُخْرِجَ الْيَهُودَ مِنْهَا، وَكَانَتِ الأَرْضُ لَمَّا ظَهَرَ عَلَيْهَا لِلْيَهُودِ وَلِلرَّسُولِ وَلِلْمُسْلِمِينَ، فَسَأَلَ الْيَهُودُ رَسُولَ اللَّهِ أَنْ يَتْرُكَهُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3152، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3152 (One-fifth of Booty to the Cause of Allah (Khumus)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3152، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3152 (Una quinta parte del botín para la causa de Alá (Khumus)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 3152 (Le cinquième du butin pour la cause d'Allah (Khumus)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
