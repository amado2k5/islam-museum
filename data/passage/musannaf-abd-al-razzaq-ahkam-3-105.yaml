text: "… يَصُومُهُ أَيِ النَّبِيَّ وَلِلفِ وَقُرَيْشٌ فِي الْجَاهِلِيَّةِ، ثُمّ أَمَرَ النَّبِيَّ وَلِلِ فَصَامَهُ حِينَ قَدِمَ الْمَدِينَةَ، وَأَمَرَ بِصِيَامِهِ قَبْلَ أَنْ يُفْرَضَ رَمَضَانُ، فَلَمَّا فُرِضَ رَمَضَانُ كَانَ هُوَ الْفَرِيضَةَ، قَالَتْ عَائِشَةُ : مَنْ شَاءَ صَامَهُ، وَمَنْ شَاءَ تَرَكَهُ. بدالرزاق، عَن الثَّوريّ، عَنْ …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 3، ص 105، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض، وما جُعل لمن شاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 3, p. 105, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard), what is left to whoever wishes; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 3، ص 105 کا اقتباس جس میں فریضہ اور فرائض، جو لوگوں پر فرض کیا گیا، فرض، جو چاہنے والے کے لیے چھوڑا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de 'Abd al-Razzaq, volume numérisé 3, p. 105, dont le texte mentionne l'obligation (farida), ce qui a été imposé aux gens, l'obligatoire (fard), ce qui est laissé à qui le veut ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Musannaf de 'Abd al-Razzaq, volumen digitalizado 3, p. 105, cuyo texto menciona la obligación (farida), lo que se impuso a la gente, lo obligatorio (fard), lo que se deja a quien quiera; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
