label:
  ar: "مسلم 2985 — أنا أغنى الشركاء عن الشرك"
  en: "Muslim 2985 — I am the partner least in need of partnership"
  ur: "مسلم 2985 — میں شرکت سے سب شریکوں سے زیادہ بے نیاز ہوں"
text: "قال الله تبارك وتعالى أنا أغنى الشركاء عن الشرك من عمل عملا أشرك فيه معي غيري تركته وشركه ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2985: أنا أغنى الشركاء عن الشرك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2985: I am the partner least in need of partnership. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2985: میں شرکت سے سب شریکوں سے زیادہ بے نیاز ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
