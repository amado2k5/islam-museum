  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin 3. cildinin 381. sayfasından, mekruh edilen, tavsiye edilen ve kınanması gereken amellerden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz edilen ameller, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, yasaklanan ameller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Jilid 3, halaman 381, yang menyebutkan amalan yang tidak disukai, dianjurkan, dan tercela; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
