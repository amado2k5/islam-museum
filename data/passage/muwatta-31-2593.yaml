summary:
  ar: "يروي مالك عن محمد بن المنكدر عن جابر بن عبد الله أن أعرابيا بايع النبي على الإسلام، فأصابه وعك بالمدينة، فأتى النبي يطلب أن يُقيله من بيعته، فأبى، ثم عاد فأبى، فخرج الأعرابي، فقال النبي: إنما المدينة كالكير، تنفي خبثها، وينصع طيبها. {cite:muwatta-maruf-1997 p.463}"
