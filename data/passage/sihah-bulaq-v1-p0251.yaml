text: |-
  :٢٩٠
  ⁦(باب الرام)⁩
  قال أبو عبيد اقطار" النبت اقطيراراتهيأ لليبس وقطرى بن الفجاءة المازنى زعم بعضه-م أن
  أصل الاسم مأخوذ من قطرة النعال والقنطرة الحسر والقنطر بالكسر الداهية
  قال الشاعر إن الغريف يجن ذات القنطر الغريف الاجمة والتنطار معيار ويروى عن
  معاذبن جبل رضى اللّٰه عنه أنه قال هو ألف ومائنا أوقية ويقال هومائة وعشرون رطلا
  ويقال مل «مسدك الثورذهبنا ويق ال غير ذلك واللّٰه أعلم ومنه قولهم قناطير مقذطرة
  ( (قطمر القطمير الفوفة التى فى النواة وهى القشرة الرقيقة ويقال هى النكنة البيضاء
  التى فى ظهر النواة تنبت منها النخلة :⁦(قطر)⁩ يوم قاطرويوم قطريرأى شديد قال الشاعر
  بنى عمناهل تذكرون بلاءنا • عليكم اذا ما كان يوم قاطر بضم القاف
  واقطرّيومنا اشتد أبو عبيد المقمطرّ الجتمع واقطرت العقرب اذاعطفت ذبيها وجعت نفسهنا
  أبو عمر وقطرت القربة اذاشددتها بالوكاء والقمطر والقمطيرة مايصان فيه الكتب قال ابن
  السكيت لا يقال بالتشديد وينشد ليس بعلم مابعى القمطر • ما العلم الاماوعاه الصدر
  وابمع قاطر (قعر، قعر البئروغيرها عمقها وقدح قعران أى مقعر وقصعة قعيرة وقعرت
  الشجرة م راقلعتها من أصلمها فانقعرت الكسائى قعرت البئرأى نزات حتى انتهيت الى
  قعرها وكذلك الاناء اذاشربت مافيه حتى انتهيت الى قهره قال وأقعرت البثرجعات لها قعرا.
  والتقعير التعميق والتقعير فى الكلام التشدّق فيه والتقعر التعمق ⁦(فعسر)⁩. القعسر
  والقعسرى الضخم الشديد يقال جحل قعسرى" ⁦(قعصر)⁩ اقعنصرار جل إذا
  تقاصر الى الارض عن الاخفس:⁦(قفر)⁩ القفر مفازة لاماء فيها ولاتبات والمع قفاريقال:
  أرض قفر ومقازة قفروقفرة أيضاومة فار ونزلنا ببى فسلان فيتنا القفر أى لم يقرونا وقفرت
  المرأة بالتكسرة قفر قفرافهى قفرة أى قليلة اللحم والقفاربالفتح الخيز يلا أدم يقال أكل خيزه
  تفارا وقفرت أثره أقفره بالضم أى قفوته واقتفرت مثله قال الباهلى
  لا يغمز الساق من أين ولاوصب • ولايزال امام القوم يقتفر
  وكذلك تقفرت قال صخر
  فانى عن تقفركم مكيث وأقفرت الدارخلت وأقفر الرجل
  صار الى القفر عن اين السكت وأقفر فلان اذالم يبق عنده أدم وفى الحديث ما اقفريدت فيه
  خل :القفور مشال التنور كافور النخل وهو وعاء الطلع والقفور الذى فى شعرابن أحرنْيت
  ( قفخر رجل قفا خريضم القاف وقفاخرىً ضجم الجثة وقنفخر أيضام:ال جرد حل
  والنون زائدة عن عحمد بن السرى قفندر القفندرالقبيح المنظر "قال الراجز
  ها ألوم البيض أن لا تسخرا * وقدرأين الشمط القفندرا
  يريد أن تسخر ولا زائدة قال اللّٰه تعالى مامنعل أن لاتسجد قر القمر بعدثلات ليال الى
  آخر الشهرسمى قر البياضة ومن كلام بعضهم قير وهو تصغيره والقمرأيضا تحير البصر من الثلي
  وقد قر الرجل يقمرة را اذالم يبصر فى النلج وقرت القرية أيضاوهونئ بصيبها من القمر
  كالاحتراق فيد خل الماءبين الادمة والبشرة عن ابن السكيت وتقمرته أتيته فى القمراء
  وتقمر الاسداذاخرج فى القمراءيطلب الصيد ومنه قول الشاءر
  سقط العشاءيه على متقمر * حامى الدمار معاود الاقران
  وقال
