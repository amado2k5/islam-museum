  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 787, that mentions what was made unlawful, prohibition, the forbidden things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 787 کا اقتباس جس میں جو حرام کیا گیا، تحریم، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
