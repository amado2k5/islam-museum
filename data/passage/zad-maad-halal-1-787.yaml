text: "مثلُ ما حرَّمه اللَّه، ولكن هو مستنبط مِن دلالة التحريم، وليس تحريمُهنَّ مستفاداً مِن المفهوم. واحدة، فإن لم يكن بينهما قرابةً، لم يحرم الجمع المزوَّجَةَ يحرُم وطؤُها على مالكها، فأين محلّ واستُفِيدَ مِن عموم تحريمه سبحانه المحرَّماتِ أيمانُكم، ورُدَّ هذا …"
summary:
