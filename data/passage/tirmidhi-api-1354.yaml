label: { ar: "جامع الترمذي 1354 — الأب والأبوة", en: "Jami' al-Tirmidhi 1354 — the father and fatherhood", ur: "جامع ترمذی 1354 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1354 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1354 — le père et la paternité", tr: "Cami' el-Tirmizi 1354 — Baba ve Babalık", id: "Jami' al-Tirmidhi 1354 — Sang Ayah dan Peran Ayah" }
text: "… قُتَيْبَةُ، وَأَحْمَدُ بْنُ مَنِيعٍ، - الْمَعْنَى وَاحِدٌ - قَالاَ حَدَّثَنَا هُشَيْمٌ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" الْيَمِينُ عَلَى مَا يُصَدِّقُكَ بِهِ صَاحِبُكَ \". وَقَالَ قُتَيْبَةُ \" عَلَى مَا صَدَّقَكَ عَلَيْهِ صَاحِبُكَ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1354، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1354 (The Chapters On Judgements From The Messenger of Allah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1354، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato de Jami' al-Tirmidhi, n.º 1354 (Los capítulos sobre los juicios del Mensajero de Alá), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1354 (Les chapitres sur les jugements du Messager d'Allah), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 1354 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1354, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
