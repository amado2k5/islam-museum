text: |-
  ⁦(ظنن)⁩•
  ٣٩١
  فى السير قال لبيد ترقى وتطعن فى العنان وتتهى * ورد الحمامة اذ أجتحامها
  أى كورد الهامة والفراء يجيز الفتح فى جبع ذلك والمطعان الرجل الكثير الطعن للعد ووهم
  مطاعين وتعااعنوا فى الحرب واطعنواعلى اقتعلوا وفى الحديث لا يكون المؤمن معانا يعنى
  فى أعراض الناس والطاءون الموت الوحىّ من الوباء وابهع الطواعين عن لطمأن
  الرجل اطممّنانا وطمأنينة أى سكن وهومطمئن الى كذا وذاك مطمأنّ اليه والمبأن مثله على
  الابدال وتصغير مطسمتى طميتن تحذف اليم من أوله واحدى النونين من آخره وتصغير
  طمأنينة طميقينة تحذف احدى النونين لانها زائدة وطمأن ظهره وطأمنه بمعتى على القلب
  وطأمنت منه سكنت ⁦( نن)⁩ الطنين صوت الذباب والعلست والبطة تعان اذاصونت
  وأطنفت الطت فطنت وكانّ مات وهوفى المصنف والطن بالضم حزمة القصب والقصبة
  الواحدة من الحزمة طنة وضربه فأطن ساقه أى قطعها يراد بذلك صوت القطع (طين
  الطين معروف والطيقة أخص منه وطينت السطح وبعضهم يشكره ويقول طقت السطح فهوا
  مطين وأنشد
  فأبقى باطلى والجدمنها. كد كان الدرابنة المطين
  والطينة انظلقة والجبلة يقال فلان من الطينة الأولى وطان فلان كتايه ختمه بالطين ابن
  السكيت طانه اللّٰه على اخير وطامه أى جبله علميه وأنتده ألا تلك نفسرطين فيها حياؤها
  ويروى كان ويوم طان ومكان طان وأرض طانة كثيرة العاين وفلسطين بكسر الفاء يلد
  ( نصل الظاء ،ظعن ظعن أى سار ظعنا وظعنا بالتهريك وقرئ بهما قوله تعالى
  يوم ظعنكم وأظعته سيره والظعينة الهودج كأنت فيه احرأة أولم تمكن والجمع ظعن وظعن
  وظعائن وأظعان أبوز يدلاية ال حول ولاظعن الاللابل التى عليها الهوادج كان فيهانساء
  أولم يكنّ وهذا بعبر تظعفه المرأة أى تركبه وهو تفتعله والظعينة المرأة مادامت فى الهودج
  فاذالم تسكن فيه فليست بنطعينة وقال عمرو بن كلثوم
  فتى قبل التفرق ياظعينا * غخبرك اليقين وتخبرينا
  أراد يا ظعينة الكسائى الظعون البعير الذى يعتمل ويحمل عليه والطعان الحبل الذى يشده
  الهودج قال كعب بن زهير له عنق تاوى بما وصلت به * ودقان يشتفان كل ظعان
  [⁦(نن)⁩ الظنّ معروف وقديوضع موضع العلم قال دويدبن الصمة
  فقات لهم ظنوا بألتى مديج • سراتهم فى الفارمىّ المسرد
  أى استيقنوا وانما يخوف عدوّه باليقين لا بالشسك وتقول ظننتل زيدا وظنئت زيدا اياك
  تضع المنفصل موضع المتصل فى الكتاية عن الاسم والخبر لانهما منفصلان فى الاصل لانهما
  مبتدأ وخبر والظنين الرجل المتهم والظنة التهمة وابهع الظنن يقسال منه اطنه وافانه بالطاء
  والفظاء اذا اتهمه وفى حديث ابن سيرين لم يكن على عليه السلام يظن فى قتل عثمان وهو
  فتعل من يظتنوفأدغم قال الشاعر
  ولا كل من يظنى أنا معتب • ولا كل مايروى علىّ أقول
  والتظنى اعمال الطنّ وأصله التظفن أبدل من احدى النونات ياه ومظنة الشئ موضعه
  ومألفه الذى يظنّ كونه فيه واجمع المظات يقال موضع كذا مظفة من فلان أى معلم منه
