text: |-
  ٥٧٢
  ... .⁦(اي)⁩.
  وربما فالوا آولئك فى غير العقلاء قال الشاهر
  ذقم المنازل بعد منزلة اللوى • والعيش بعد ألتك الايام
  وقال تعالى انّ السمع والبصر والقؤاد كل أولئك كان عنه م.ؤْلا وأما الا ولى بوزن العلى فهو
  أيضاجع لا واحدله من لفظه واحده الذى وأمّاولهم ذهبت العرب الألى (ه ومقلوب من
  الاول لانه بجمع أولى مثل أخرى وأخر وأمّا الافهو حرف استئناء يستنى به على خسه أوجه
  بعد الايجاب وبعد النفي والمفرّغ والمقدم والمنقطع فيكون فى الاستثناء المنقطع؛عنى الكن
  لان المستثف من فيرجنس المستننى منه وقديوصف بالافان وصفت بهاجعلتها وما بعدها
  فى موضع غير وأتبعت الاسم بعدها ما قبله فى الاعراب فقلت جاءنى القوم الازيد كق وله
  تعالى لو كان فيهما آلهة الااللّٰه لغسدنا وقال عمرو بن معديكرب
  وكل أخ مفارقه أخوه • لعمرأ بيك الا الفرقدان
  كأنه قال غير الفرقدين وأصل الا الاستّنفاء والصفة عارضة وأصل غيرصفة والاستنناء
  عارض وقد يكون الابمنزلة الواو فى العطف كقول الشاعر
  وأرى لهادارا بأغدرة السيدان لم يدرس لهارسم
  الارماداهامدادفعت • عنه الرياح خوالد سص-م
  يريد أرى لهاداراورمادا نى) أنى معذاه أين تقول أنى لك هذا أى. ن أبن لك هذا وهى
  .ن الظروف التى يجازى بهاتقول أنى تأتنى آتك معناه من أىّ جهة تأتى آتك وقد تكون
  بعنى كيفتقول أنى لك أن تفتح الحصن أى كيف لك ذلك وأمّا قولا: أنا فقد ذ كرناه فى باب
  النون/ابا ايااسم مبهم وتص-ل به بجمع المضرات المتصلة التى للنصب تقول ابالواياى
  واياهوايانا وجعلت الكاف والهاء والماء والذون ساناءن المقضود ليهلم المخاطب من الغائب
  ولا موضع لها من الاءراب فهى كالكاف فى ذلك وأرأ يتسك وكالااف والنون النى فى أنت
  أكون ايا الاسم وما بعدها للخطاب وقد صارا كالشئ الواحدلات الاسماء الميهسمة وسار
  المكنات لا تضاف لانها معارف وقال بعض التحويين انّ ايامضاف الى مابعده واستدل
  على ذلك بقواهم اذا بلغ الرجل الستين فاياهوايا الشواب فأضافوها الى الشواب وخفضوها
  وقال ابن كيسان الكاف والهاء وألياء والنون هى الاسماء واياعمادلها لانم الاثقوم بأنفسها
  كالكاف والهاء والياء فى التأخير في يضريك ويضربه ويضر بن فماقدّمت الكاف والها.
  والياءعمدت بايافصاركا، كالشئ الواحد ولك أن تقول ضربت اياى لانه يمح أن تقول
  ضريقف ولا يجونأن تة ول ضربت ايالثلافك انما تحتاج الى ابالكاذ الم يمكنك اللفظ بالكاف
  فاذارصات الى الكاف تزكها ويجوز أن تقول ضربنك ابالدلاث الكاف اعتمد بها على الفعل
  فاذا أعدتم ااحتجت الى ايا وأماقول الشاءر
  كانايوم قرى • اغمانقتل ايانا
  فانه انمافصلها من الفعل لان العرب لا توقع فعل الفاءل على نفسه باتصال الكتاية لا تقول
  قتاتنى اغماتقول قتلت نفسى كمانول نفلت نفسى فاغفرلى ولم تقل ظلاتنى فأجرى أيانا مجرى
  أنفسسفا وقد تكون لاتصذيرقول ايالا والاسد وهو بدل من فعل كانك قلت باعدو يقال
  هياك مثل أراق وهراق وأنتد الاخفس
  .ال
