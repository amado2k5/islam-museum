text: "… بني النضير، و أَقرّ قريظة، ومَنَّ عليهم، حتى حاربت قريظة بعد ذلك، فقتل رجالهم، وقسم نساءهم، وأَولادهم، وأموالهم، بين المسلمين، إلا بعضهم، لحقوا برسول اللّٰه عليله، فأَمَّنهم، وأَسلموا، وأَجلى رسول اللّٰه ليل يهود المدينة كلهم، بني قينقاع، وهم قوم عبد …"
