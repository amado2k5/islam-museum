label: { ar: "جامع الترمذي 2868 — محو السيئات وحط الخطايا", en: "Jami' al-Tirmidhi 2868 — bad deeds erased and sins shed", ur: "جامع ترمذی 2868 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Jami' al-Tirmidhi 2868 — malas acciones borradas y pecados perdonados", fr: "Jami' al-Tirmidhi 2868 — Les mauvaises actions effacées et les péchés pardonnés", tr: "Cami' el-Tirmizi 2868 — Günahları silmek ve suçları ortadan kaldırmak", id: "Jami' al-Tirmidhi 2868 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "… الرَّحْمَنِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" أَرَأَيْتُمْ لَوْ أَنَّ نَهْرًا بِبَابِ أَحَدِكُمْ يَغْتَسِلُ مِنْهُ كُلَّ يَوْمٍ خَمْسَ مَرَّاتٍ هَلْ يَبْقَى مِنْ دَرَنِهِ شَيْءٌ \". قَالُوا لاَ يَبْقَى مِنْ دَرَنِهِ شَيْءٌ. قَالَ \" فَذَلِكَ مَثَلُ الصَّلَوَاتِ الْخَمْسِ يَمْحُو اللَّهُ بِهِنَّ الْخَطَايَا \". وَفِي الْبَابِ عَنْ جَابِرٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2868، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2868 (Chapters on Parables), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2868، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.° 2868 (Capítulos sobre parábolas), que habla de malas acciones borradas y pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2868 (Chapitres sur les paraboles), évoque l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'une action."
  tr: "Cami' el-Tirmizi'de 2868 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2868, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
