label: { ar: "الموطأ 1213 — مالك: حصى الجمار مثل حصى الخذف، وأكبر منه قليلا أعجب إليه", en: "Muwatta 1213", es: "Muwatta 1213", fr: "Muwatta 1213", ur: "موطا 1213", tr: "El-Muvatta 1213 — Malik: Cemarat'ı taşlamak için kullanılan taşlar, fırlatmak için kullanılan taşlara benzer; biraz daha büyük olanlar ise O'nun daha çok hoşuna gider.", id: "Al-Muwatta 1213 — Malik: Kerikil yang digunakan untuk melempar Jamarat sama seperti kerikil yang digunakan untuk melempar, dan yang sedikit lebih besar lebih disukai olehnya." }
summary:
  ar: "يروي مالك أنه سمع بعض أهل العلم يقول إن الحصى التي يرمى بها الجمار مثل حصى الخذف، فقال مالك إن أكبر من ذلك قليلا أعجب إليه. ويذكر المحقق أن رمي الجمار بمثل حصى الخذف روي مرفوعا من حديث جابر في صحيح مسلم. {cite:muwatta-maruf-1997 p.543}"
  id: "Malik menceritakan bahwa ia mendengar beberapa ulama mengatakan bahwa kerikil yang digunakan untuk ritual pelemparan batu harus berukuran sama dengan kerikil yang digunakan untuk ketapel. Malik kemudian mengatakan bahwa kerikil yang sedikit lebih besar lebih disukai. Peneliti menyebutkan bahwa praktik penggunaan kerikil seukuran kerikil yang digunakan untuk ketapel diriwayatkan dalam sebuah hadits yang dinisbahkan kepada Nabi dari Jabir dalam Sahih Muslim. {cite:muwatta-maruf-1997 p.543}"
