label: { ar: "الموطأ 1213 — مالك: حصى الجمار مثل حصى الخذف، وأكبر منه قليلا أعجب إليه", en: "Muwatta 1213" }
summary:
  ar: "يروي مالك أنه سمع بعض أهل العلم يقول إن الحصى التي يرمى بها الجمار مثل حصى الخذف، فقال مالك إن أكبر من ذلك قليلا أعجب إليه. ويذكر المحقق أن رمي الجمار بمثل حصى الخذف روي مرفوعا من حديث جابر في صحيح مسلم. {cite:muwatta-maruf-1997 p.543}"
