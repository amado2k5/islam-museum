text: "… كحكاية أحوال النساء ومجالس الخر ومقامات الفاق وتنعم الاغنياء وتجبر الملوك ومراسمهم المذمومة وأحوالهم المكروهة، فإن كل ذلك مما لا يحل الخوض فيه وهو حرام. وأما الكلام فيما لا يعنى أو أكثر مما يعنى فهو ترك الأولى ولا تحريم فيه. …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 1، ص 119، يذكر ما لا يحل، والحرام، والتحريم، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 1, p. 119, that mentions what is not lawful, the unlawful, prohibition, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 1، ص 119 کا اقتباس جس میں جو حلال نہیں، حرام، تحریم، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 1, pág. 119, que menciona lo ilícito, lo prohibido, lo reprobable; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 1, p. 119), mentionnant ce qui est illicite, interdit et déconseillé; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 1. cildinin 119. sayfasından, haram, izin verilmeyen, yasak ve hoş karşılanmayan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Jilid 1, halaman 119, yang menyebutkan apa yang tidak diperbolehkan, dilarang, diharamkan, dan tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
