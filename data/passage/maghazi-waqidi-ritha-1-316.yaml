text: "إذ رأَيتُك سالماً، فقد أَشْوَت المُصيبة. فعزاها رسول اللّه بعمرو بن مُعاذ ابنها، ثم قال : يا أُم سعد، أَبشرى وبَشِّرى أَهليهم أَنَّ قتلاهم قد ترافقوا فى الجنَّة جميعاً - وهم اثنا عشر رجلاً - وقد شُفّعوا فى أَهليهم. قالت …"
summary:
  ar: "مقطع من كتاب المغازي — محمد بن عمر الواقدي، المجلد المصوَّر 1، ص 316، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Kitab al-Maghazi — Muhammad ibn Umar al-Waqidi, scan volume 1, p. 316, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "کتاب المغازی - محمد ابن عمر الواقدی، اسکین جلد 1، ص 316 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Maghazi - Muhammad ibn Umar al-Waqidi, volume numérisé 1, p. 316, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Kitab al-Maghazi - Muhammad ibn Umar al-Waqidi, volumen escaneado 1, p. 316, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Muhammed ibn Ömer el-Vakidi'nin *El-Magazi* adlı eserinin resimli 1. cildinin 316. sayfasından, felaket karşısında taziye, teselli ve sabır içeren bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari buku *Al-Maghazi* karya Muhammad ibn Umar al-Waqidi, jilid 1 bergambar, halaman 316, berisi ucapan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan pujian paling terkenal."
