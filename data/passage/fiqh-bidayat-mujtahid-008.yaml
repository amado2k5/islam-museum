text: "مولاة. وأما المختلف فيهم فهم ذوو الأرحام، وهم من لا فرض لهم في كتاب الله ولا هم عصبة، وهم بالجملة: بنو البنات، وبنات الإخوة، وبنو الأخوات، وبنات الأعمام، والعم أخو الأب للأم فقط، وبنو الأخوة للأم، والعمات، والخالات، والأخوال. فذهب"
