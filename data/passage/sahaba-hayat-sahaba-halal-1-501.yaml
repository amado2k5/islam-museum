text: "… بفعل ولا قول كان حقا على اللّٰه أن يدخله مدخله، ألا او إن هؤلاء قد لزموا طاعة الشيطان و تركوا طاعة الرحن، وأظهروا الفساد و عطلوا الحدود واستأثروا بالفىء وأحلوا حرام اللّٰه وعرموا حلاله، وأنا أحق من غير وقد أنتى …"
