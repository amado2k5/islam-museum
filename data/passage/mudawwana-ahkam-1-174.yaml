text: "… حدّ ما يقصر الرجل من شعره فى قول مالك قال ما سمعت من مالك فيه حداً وما أخذ من ذلك يجزئه قلت لا بن القاسم أكان مالك يرى طواف الصدر واجبا قال لا ولكنه كان لا يستحب تركه وكان يقول …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 174، يرد فيه ذكر الواجب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 174, whose wording mentions the obligatory (wajib), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 174 کا اقتباس جس میں واجب، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 1, p. 174, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mudawwana al-Kubra, volumen digitalizado 1, p. 174, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Büyük Derleme, Resimli Cilt 1, sayfa 174'ten, zorunlu ve tavsiye edilen amellerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu ameller, görevler, itaat amelleri, tavsiye edilen amelleri, tiksindirilen amelleri, yasaklanan amelleri ve küçük günahları içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kompendium Agung, Jilid Bergambar 1, halaman 174, yang menyebutkan perbuatan wajib dan anjuran; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan anjuran, perbuatan yang tidak disukai, perbuatan terlarang, dan dosa kecil."
