ref: "4257"
label:
  ar: "ابن ماجه 4257 — يا عبادي كلكم ضال إلا من هديت"
  en: "Ibn Majah 4257 — My servants, all of you are astray except those I guide"
  ur: "ابن ماجہ 4257 — اے میرے بندو، تم سب گمراہ ہو سوائے اس کے جسے میں ہدایت دوں"
  es: "Ibn Majah 4257 — ¡Oh, siervos míos! Todos vosotros estáis extraviados, excepto aquellos a quienes yo guío."
  fr: "Ibn Majah 4257 — Mes serviteurs, vous êtes tous égarés, sauf ceux que je guide."
  tr: "İbn Majah 4257 — Ey kullarım! Hidayete erdirdiklerim hariç, hepiniz sapmışsınız."
  id: "Ibn Majah 4257 — Wahai hamba-hamba-Ku, kalian semua sesat kecuali orang-orang yang telah Aku beri petunjuk."
text: "إن الله تبارك وتعالى يقول يا عبادي كلكم مذنب إلا من عافيت فسلوني المغفرة فأغفر لكم ومن علم منكم أني ذو قدرة على المغفرة فاستغفرني بقدرتي غفرت له، وكلكم ضال إلا من هديت فسلوني الهدى أهدكم، وكلكم فقير إلا من …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4257: يا عبادي كلكم ضال إلا من هديت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4257: My servants, all of you are astray except those I guide. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4257: اے میرے بندو، تم سب گمراہ ہو سوائے اس کے جسے میں ہدایت دوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 4257: «¡Oh, siervos míos! Todos vosotros estáis extraviados, excepto aquellos a quienes yo guío». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi recopila sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 4257: « Mes serviteurs, vous êtes tous égarés, sauf ceux que Je guide. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "İbn Majah'ın Süneni'nde 4257 numaralı hadis-i kudsi şöyledir: \"Ey kullarım! Hidayete erdirdiklerim hariç, hepiniz sapmışsınızdır.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 4257: “Wahai hamba-hamba-Ku, kalian semua sesat kecuali orang-orang yang telah Aku beri petunjuk.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
