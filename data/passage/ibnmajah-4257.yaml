label:
  ar: "ابن ماجه 4257 — يا عبادي كلكم ضال إلا من هديت"
  en: "Ibn Majah 4257 — My servants, all of you are astray except those I guide"
  ur: "ابن ماجہ 4257 — اے میرے بندو، تم سب گمراہ ہو سوائے اس کے جسے میں ہدایت دوں"
text: "إن الله تبارك وتعالى يقول يا عبادي كلكم مذنب إلا من عافيت فسلوني المغفرة فأغفر لكم ومن علم منكم أني ذو قدرة على المغفرة فاستغفرني بقدرتي غفرت له، وكلكم ضال إلا من هديت فسلوني الهدى أهدكم، وكلكم فقير إلا من …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4257: يا عبادي كلكم ضال إلا من هديت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4257: My servants, all of you are astray except those I guide. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4257: اے میرے بندو، تم سب گمراہ ہو سوائے اس کے جسے میں ہدایت دوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
