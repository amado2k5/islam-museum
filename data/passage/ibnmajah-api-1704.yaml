label: { ar: "سنن ابن ماجه 1704 — اليتيم وفقد الأب", en: "Sunan Ibn Majah 1704 — the orphan and the father lost", ur: "سنن ابن ماجہ 1704 — یتیم اور باپ کی موت", es: "Sunan Ibn Majah 1704 — El huérfano y el padre perdido", fr: "Sunan Ibn Majah 1704 — L'orphelin et le père perdus" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نُمَيْرٍ، عَنْ عُبَيْدِ اللَّهِ، عَنْ نَافِعٍ، قَالَ سَأَلْتُ أُمَّ سَلَمَةَ عَنِ الرَّجُلِ، يُصْبِحُ، وَهُوَ جُنُبٌ، يُرِيدُ الصَّوْمَ؟ قَالَتْ: كَانَ رَسُولُ اللَّهِ ـ يُصْبِحُ جُنُبًا مِنَ الْوِقَاعِ، لاَ مِنِ احْتِلاَمٍ، ثُمَّ يَغْتَسِلُ وَيُتِمُّ صَوْمَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1704، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1704 (Fasting), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1704، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1704 (El ayuno), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sunan Ibn Majah, n° 1704 (Le jeûne), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
