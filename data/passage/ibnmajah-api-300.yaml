text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا يَحْيَى بْنُ أَبِي بُكَيْرٍ، حَدَّثَنَا إِسْرَائِيلُ، حَدَّثَنَا يُوسُفُ بْنُ أَبِي بُرْدَةَ، سَمِعْتُ أَبِي يَقُولُ، دَخَلْتُ عَلَى عَائِشَةَ فَسَمِعْتُهَا تَقُولُ، كَانَ رَسُولُ اللَّهِ ـ إِذَا خَرَجَ مِنَ الْغَائِطِ قَالَ \" غُفْرَانَكَ \". قَالَ أَبُو الْحَسَنِ بْنُ سَلَمَةَ وَأَخْبَرَنَا أَبُو حَاتِمٍ، حَدَّثَنَا أَبُو غَسَّانَ النَّهْدِيُّ، حَدَّثَنَا إِسْرَائِيلُ، نَحْوَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 300، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 300 (The Book of Purification and its Sunnah), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 300، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
