label: { ar: "الموطأ 128 — أم سلمة تروي سؤال أم سليم: نعم إذا رأت الماء", en: "Muwatta 128" }
text: "إن الله لا يستحيي من الحق، هل على المرأة من غسل إذا هي احتلمت؟ فقال: نعم، إذا رأت الماء"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة عن أم سلمة زوج النبي، في باب غسل المرأة إذا رأت في المنام مثل ما يرى الرجل: جاءت أم سليم امرأة أبي طلحة الأنصاري إلى النبي فقالت إن الله لا يستحيي من الحق، وسألت هل على المرأة غسل إذا احتلمت، فقال: نعم، إذا رأت الماء. ويخرّجه المحقق عند البخاري (282، 6121) وابن حبان وابن خزيمة والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جماعة رواة الموطأ رووه بهذا الإسناد إلا القعنبي فأرسله عن هشام عن أبيه، وأن ابن شهاب رواه عن عروة مرة مرسلاً ومرة عن عائشة. {cite:muwatta-maruf-1997 p.96} {cite:muwatta-maruf-1997 p.97}"
