ref: '1.128'
label:
  ar: 'الموطأ 128 — أم سلمة تروي سؤال أم سليم: نعم إذا رأت الماء'
  en: Muwatta 128
  ur: 'موطأ 128 — ام سلمہ کی روایت: «نعم، اگر وہ پانی دیکھے»'
  es: "Muwatta 128"
  fr: "Muwatta 128"
  tr: "Al-Muwatta 128 - Ümmü Seleme, Ümmü Süleym'in sorusunu anlatıyor: Evet, eğer su görürse"
  id: "Al-Muwatta 128 — Ummu Salama meriwayatkan pertanyaan Ummu Sulaim: Ya, jika dia melihat air"
text: 'إن الله لا يستحيي من الحق، هل على المرأة من غسل إذا هي احتلمت؟ فقال: نعم، إذا رأت الماء'
summary:
  ar: 'يرويه مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة عن أم سلمة زوج النبي، في باب غسل المرأة إذا رأت في المنام مثل ما يرى الرجل: جاءت أم سليم امرأة أبي طلحة الأنصاري إلى النبي فقالت إن الله لا يستحيي من الحق، وسألت هل على المرأة غسل إذا احتلمت، فقال: نعم، إذا رأت الماء. ويخرّجه المحقق عند البخاري ⁦(282، 6121)⁩ وابن حبان وابن خزيمة والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جماعة رواة الموطأ رووه بهذا الإسناد إلا القعنبي فأرسله عن هشام عن أبيه، وأن ابن شهاب رواه عن عروة مرة مرسلاً ومرة عن عائشة. {cite:muwatta-maruf-1997 p.96} {cite:muwatta-maruf-1997 p.97}'
  ur: 'موطأ میں حدیث، نمبر 128: ام سلیم — ابو طلحہ انصاری کی بیوی — نے نبی سے پوچھا کہ کیا عورت پر اس کے احتلام کا غسل ہے، تو آپ نے کہا: «ہاں، جب وہ پانی دیکھے»۔'
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Zeynep bint Ebu Seleme'den, o da Peygamberin eşi Ümmü Seleme'den rivayet ederek, bir kadının rüyasında erkeğin gördüğünü görmesi halinde gusül abdesti almasıyla ilgili bölümde şöyle anlatmıştır: Ebu Talha el-Ensari'nin eşi Ümmü Süleym, Peygambere gelip, \"Allah hakikatten utanmaz\" dedi ve \"Bir kadın rüyasında ıslaklık görürse gusül abdesti alması farz mıdır?\" diye sordu. Peygamber, \"Evet, eğer sıvıyı görürse farzdır\" dedi. Araştırmacı, bu rivayeti Buhari (282, 6121), İbn Hibban, İbn Huzeyme, Şafiî ve Beyhaki'de, Malik'in sahabelerinin rivayet zincirleri aracılığıyla nakletmiştir. İbn Abdülberr'in, Muvatta'nın ravilerinden bir grubun bu hadisi bu isnad zinciriyle rivayet ettiğini, ancak Kanabi'nin bunu Hişam'dan, o da babasından rivayet ederek mursal hadis olarak naklettiğini söylediğini aktarıyor. Ayrıca İbn Şihab'ın bunu bir kez Urve'den mursal hadis olarak, bir kez de Aişe'den rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.96} {cite:muwatta-maruf-1997 s.97}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, dari ayahnya, dari Zaynab bint Abi Salamah, dari Umm Salamah, istri Nabi, dalam surah tentang mandi ritual wanita jika ia melihat dalam mimpi apa yang dilihat laki-laki: Umm Sulaym, istri Abu Talhah al-Ansari, datang kepada Nabi dan berkata, \"Allah tidak malu dengan kebenaran,\" dan dia bertanya, \"Apakah wajib bagi seorang wanita untuk mandi ritual jika ia mengalami mimpi basah?\" Beliau menjawab, \"Ya, jika ia melihat cairan tersebut.\" Peneliti memasukkannya dalam al-Bukhari (282, 6121), Ibn Hibban, Ibn Khuzaymah, al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa sekelompok perawi al-Muwatta' meriwayatkan hadits ini dengan sanad seperti ini, kecuali al-Qa'nabi, yang meriwayatkannya sebagai hadits mursal atas otoritas Hisham atas otoritas ayahnya. Ia juga menyatakan bahwa Ibnu Shihab meriwayatkannya atas otoritas Urwah sekali sebagai hadits mursal dan sekali atas otoritas Aisyah. {cite:muwatta-maruf-1997 p.96} {cite:muwatta-maruf-1997 p.97}"
