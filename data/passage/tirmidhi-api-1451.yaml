label: { ar: "جامع الترمذي 1451 — ما أُحل", en: "Jami' al-Tirmidhi 1451 — what was made lawful", ur: "جامع ترمذی 1451 — جو حلال کیا گیا" }
text: "حَدَّثَنَا عَلِيُّ بْنُ حُجْرٍ، حَدَّثَنَا هُشَيْمٌ، عَنْ سَعِيدِ بْنِ أَبِي عَرُوبَةَ، وَأَيُّوبَ بْنِ مِسْكِينٍ، عَنْ قَتَادَةَ، عَنْ حَبِيبِ بْنِ سَالِمٍ، قَالَ رُفِعَ إِلَى النُّعْمَانِ بْنِ بَشِيرٍ رَجُلٌ وَقَعَ عَلَى جَارِيَةِ امْرَأَتِهِ فَقَالَ لأَقْضِيَنَّ فِيهَا بِقَضَاءِ رَسُولِ اللَّهِ لَئِنْ كَانَتْ أَحَلَّتْهَا لَهُ لأَجْلِدَنَّهُ مِائَةً وَإِنْ لَمْ تَكُنْ أَحَلَّتْهَا لَهُ رَجَمْتُهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1451، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1451 (The Book on Legal Punishments (Al-Hudud)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1451، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
