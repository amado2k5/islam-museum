summary:
  ar: "القسم 46 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المظالم»، ويضم فيها النصوص من 2440 إلى 2482 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 46 of Sahih al-Bukhari (Oppressions) in the division of the open hadith dataset the museum took its reports from: reports 2440 to 2482 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 46، عنوان «کتاب المظالم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2440 تا 2482۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 46 de Sahih al-Bukhari (Opresiones) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2440 al 2482, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 46 (Sahih al-Bukhari, « Oppressions »), dans la base de données ouverte: il s’agit des hadiths 2440 à 2482. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
