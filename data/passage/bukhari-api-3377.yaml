label: { ar: "صحيح البخاري 3377 — الأب والأبوة", en: "Sahih al-Bukhari 3377 — the father and fatherhood", ur: "صحیح بخاری 3377 — باپ اور والدیت", es: "Sahih al-Bukhari 3377 — El padre y la paternidad", fr: "Sahih al-Bukhari 3377 — le père et la paternité", tr: "Sahih el-Buhari 3377 — Baba ve Babalık", id: "Sahih al-Bukhari 3377 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا الْحُمَيْدِيُّ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنَ زَمْعَةَ، قَالَ سَمِعْتُ النَّبِيَّ. وَذَكَرَ الَّذِي عَقَرَ النَّاقَةَ قَالَ \" انْتَدَبَ لَهَا رَجُلٌ ذُو عِزٍّ وَمَنَعَةٍ فِي قُوَّةٍ كَأَبِي زَمْعَةَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3377، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3377 (Prophets), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3377، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3377 (Profetas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3377 (Les Prophètes), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3377 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3377, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
