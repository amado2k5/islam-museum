text: "… مَوْلَى أُمِّ سَلَمَةَ حَدَّثَهُ أَنَّ عَبْدَ اللَّهِ بْنَ عَمْرِو بْنِ الْعَاصِ قَالَ أَقْبَلَ رَجُلٌ إِلَى نَبِيِّ اللَّهِ فَقَالَ أُبَايِعُكَ عَلَى الْهِجْرَةِ وَالْجِهَادِ أَبْتَغِي الأَجْرَ مِنَ اللَّهِ. قَالَ \" فَهَلْ مِنْ وَالِدَيْكَ أَحَدٌ حَىٌّ \". قَالَ نَعَمْ بَلْ كِلاَهُمَا. قَالَ \" فَتَبْتَغِي الأَجْرَ مِنَ اللَّهِ \". قَالَ نَعَمْ. قَالَ \" فَارْجِعْ إِلَى وَالِدَيْكَ فَأَحْسِنْ صُحْبَتَهُمَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6507، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6507 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6507، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6507 (El Libro de la Virtud, que ordena las buenas costumbres y fortalece los lazos de parentesco), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye entre los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6507 (Le Livre de la Vertu, qui exhorte à la bienséance et renforce les liens de parenté), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih Müslim'de 6507 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. Bu hadis, \"İslam'da Anne Babalık\" tarayıcısı tarafından Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6507, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Hadits ini dikumpulkan oleh peramban \"Parenthood in Islam\" bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
