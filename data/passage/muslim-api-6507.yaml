label: { ar: "صحيح مسلم — ارجع إلى والديك فأحسن صحبتهما", en: "Sahih Muslim — Return to your parents and keep them good company", ur: "صحیح مسلم — اپنے والدین کے پاس لوٹو اور ان کی اچھی صحبت کرو" }
text: "حَدَّثَنَا سَعِيدُ بْنُ مَنْصُورٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي عَمْرُو بْنُ الْحَارِثِ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، أَنَّ نَاعِمًا، مَوْلَى أُمِّ سَلَمَةَ حَدَّثَهُ أَنَّ عَبْدَ اللَّهِ بْنَ عَمْرِو بْنِ الْعَاصِ قَالَ أَقْبَلَ رَجُلٌ إِلَى نَبِيِّ اللَّهِ صلى الله عليه وسلم فَقَالَ أُبَايِعُكَ عَلَى الْهِجْرَةِ وَالْجِهَادِ أَبْتَغِي الأَجْرَ مِنَ اللَّهِ ‏.‏ قَالَ ‏\"‏ فَهَلْ مِنْ وَالِدَيْكَ أَحَدٌ حَىٌّ ‏\"‏ ‏.‏ قَالَ نَعَمْ بَلْ كِلاَهُمَا ‏.‏ قَالَ ‏\"‏ فَتَبْتَغِي الأَجْرَ مِنَ اللَّهِ ‏\"‏ ‏.‏ قَالَ نَعَمْ ‏.‏ قَالَ ‏\"‏ فَارْجِعْ إِلَى وَالِدَيْكَ فَأَحْسِنْ صُحْبَتَهُمَا ‏\"‏ ‏.‏"
summary:
  ar: "جاء رجل فبايع النبي على الهجرة ثم ذكر والديه فقيل له ارجع إلى والديك فأحسن صحبتهما."
  en: "A man pledged the Prophet on migration, then his parents were mentioned and he was told: return to your parents and keep them good company."
  ur: "ایک شخص نے ہجرت پر بیعت کی پھر اس کے والدین کا ذکر آیا تو کہا گیا: اپنے والدین کے پاس لوٹو اور ان کی اچھی صحبت کرو۔"
