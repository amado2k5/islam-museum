  معروف (زرد. ذرد اللقمة بالكسم يزردهازرداأى بلعها والازدراد الابتلاع والمزرد
  بالفتح الحاق والزرادخيط يخنق به البعيرلملا يدسع بجرّته فيملأراكبه تقول زرده بالفتح
  يزرده زردا اذاخنه والحلق عزرود والزردمثل السرد وهو تداخسل حلق الدرع بعضها
  فى بعض والزرد بالتحريك الدرع المزرودة والزرّ اد صانعها ومزرّ د بن ضرار أخو الشماخ
  الشاءر وزرود. وضع ⁦(زغد )⁩ الزغد الهدير الشديد تقول زغدالبعيريزغد قال الراجز
  قلذا ويخباخ الهدير الزغد
  وزغدسقاء،أى عصره حتى يخرج الزيدمن فه وذلك الزبد
  زغيدوز غده أى عصر حلقه ⁦( زند )⁩ الزندموصل طرف الذراع فى الكف وهما الزندان
  الكوع والسكر سوع والزند العود الذي يقدح به النار وهو الاعلى والزندة السفلى فيهاثقب
  وهى الانى فاذا اجتمعاقيل زندان ولم يقل زندتان والجمع زناد وأزند وأزناد وتقول لمن أنجدك
  وأعانك ورت بك زفادى والمزند الضبق البخيل وثوب هزندقليل العرض وأصسل التزنيد
  أن تخل أشاعر الناقة بأخلة صغار ثم تشتبشعر وذلك اذا اندحقت رحها بعد الولادة عن ابز
  دريد وترندفلان اذاضاق بالجواب وغضب وقول عدى فقل مثل ماقالواولا تتزند يروى
  بالنون والياء ⁦(زهد)⁩ الرهد خلاف الرغبة تقول زهد فى الشى وعن الشى يزهدزهدا
  وزهادة وزه_ديز هداغة فيسه وفلان يتزه دأى يتعبد والتزهيد فى الشى وعن الشئ خلاف
  الترغيب فيه والمزهد القليل المال وفى الحديث أفضل الناس. ؤمن مزهد قال الاعشى
  فان يطلبواسرهاللغى * ولن يتركوهالازهادها
  والزهيد القليل يقال رجل زهيد الاكل وواد زهيد قليل الاخذللاء ويقال خذزهد
  ما يكفيك أى قدرما يكفيك وفلان يرد «دعطاء فلان أى يعده زهيد اقليلا وأرض زهاد أى
  لا تسيل إلا عن مطار كثير قال الشيباتى زهدت النخل أزهده زهد احزرته وخرصته ⁦(زود)⁩
  الزاد طعام يتخذللسفرتقول زوّدت الرجل فتزوّد والمزود ما يجعل فيه الزاد والعرب تلقب
  العجم برقاب المزاود ( يد الزيادة التموركذل الزوادة حكاها يعقوب عن الكسائ
  عر البكرى تقول زاد الشئيريد زيدا وزيادة أى ازداد وزاده اللّه خيرا ١ وزاد فيما عنده
  والمزيد الزيادة ويقسال افعل ذلك زيادة والعامة تقول زائدة واستزاده أى استقصره وتزيد
  السعر غلا والتزيد فى السيرذوق العنق والتزيد فى المديث الكذب وزائدة الكدهنية منه-
  صغيرة الى جنبها متنحية عنها وبجعها زوائد وكان سعيد بن عنمان بلقب بالزوائدى لانه كان
  لهثلاث بيضات زعمواو الاسدذ وزوائديه فى به أظفاره وأنيايه وزئيره وصواته والزيد والزيد
  ربادة ويروى قول الشاعر(ذى الاميع، فأجموا أمر كم لمزافكيد ونى من
  بالنتح والصكسر وتزيد آبوقبيلة وهوتزيدين حلوان بن عمران بن الحساف بن قضاعة واليه
  سب البرود التزيديه عال علمقمة
  ردّالقيان جال السىّ فاحتقملوا • فكاها بالتزيديات معكوم
