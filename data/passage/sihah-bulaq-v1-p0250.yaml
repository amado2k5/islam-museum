text: |-
  ٢٩١
  وقال الاعشى تقمرهاشيخ عشاء فأصبحت * قضاعية تأتى الكواهن ناشصا
  يقول صادها فى القمراءوتة مرفلان أى غلب من يقامره قالد ابن دريد والقمار المقامرة
  وتقامر والعبوا القمار وقرت الرجل أقره بالكسر قرا اذالاعيته فيه ففليته وقامرته
  فقدرته أقره بالمضم قرا اذا فاخرته فيسه فغلبته وعود قارى" منسوب الى موضع ببسلاد
  الهندوالمرى" منسوب الى طير قر وقراما أن يكون جمع أقرمشل أ«روجرواما أن يكون
  جمع قرى مثل رومى وروم وزنجيّ وزنج قال الشاعر
  لاصلح بيني فاعلوه ولا بينكم ماحلت عانقى *سينى وما كنابنجدوما • قرقرقر الواد بالشاهق
  والانى قرية والذكرساف حز والجمع قارى غير مصروف والاقر الايبيض يقال جار أخر
  وسحاب أقروليله قراء أى مضيئة وأقرت ليلتنا أضاءت وأقرنا أى طلع علينا الة-مر وأخر
  التمرضربه البرد فذهبت حلاوته قبل أن ينضيج ⁦(]جر)⁩ المقمجر القوّاس قارسى معرب
  وأنشدأ بوعبيدة مثل القسى تعاجها المقمعر نر . لقنوّر يتشديد الواو
  الضخم الرأس يقال بعير قنوروية ال هو الشرس الصعب من كل شئ ⁦(قور)⁩ قوره
  واقتوره واقتاره كله بعنى قطعه مدوّرا ومنه قوّارة القميص والبطيخ ودار قوراء واسعة
  لكسائى لقيت منه الاقورين يكسر الراء والاقوريات وهى الدواهى العظام قال نهار
  ابن ترّسعة وكتاقبل ملك بن سليم نسومهم الدواهى الاقورينا واقورّ الجلداقوراراتشتج
  وقال رؤية وانعاج عودى كالنظيف الإخثن • عنداقورار الجلد والتشنن
  والمقور من الخيل الضامر قال بشر
  يضمر بالاصائل فهونهد • أقب مقلص فيه اقورار
  والقارة الاكمة وجعها قاروقور قال الراجز
  هل نعرف الداربأ على ذى القور * قددرست غيرر مادمكفور
  والقارة الدبة والقارة قبيلة وهم عضل والديس إبنا الهون بن خزيمة سمواقارة لاجتماعهم
  والتفافهح لما أراد ابن الشدّاخ أن يفرة مم في بنى كانة فقال شاعرهم
  دعونا قارة لا تنفرونا * فتحفل مثل اجفال الظليم
  وهم رماة وفى المثل أنصف القارة من راماها وفلان بن عبد القارى منسوب الى القارة وعبد
  منوّن ولا يضاف الفرّاء انقارت البتراذا انهدمت والقار القير والقار الابل قال الراجز
  ما إت رأنا ملكا أغارا • أكر منه قرة وقارا
  ويوم ذى قاريوم لبنى شيبان وكان أبرويز أغزاهم جيئا فظفرت بنوشيبان وهو أوّل يوم
  تتصرت فيه العرب على العجم ⁦(قهر)⁩. قهره قهراغلبه وأقهرته وجدته مقهورا قال
  أبو عبيد ومنه قول المخبل
  تحنى حصين أن يسود جذاءه * فأمسى حصين قد أذل" وأقهرا على مالم يسم فاعله
  أى وجد كذلاويروى قد أذل وأقهرا أى صار أمره الى الذل والقهر وهو من قياس
  قولهم أحجد الرجل صار أمرء الى الجد وصين اسم الزبرقان وجذاعه رهطه من تيم وقهر
  غلب وقهر اللحم أيضا اذا أخذته الناروسال ماؤه ويقال أخسذت فلاناقهرة بالضم أى
