text: "… وَرَسُولَهُ وَيُحِبُّهُ اللَّهُ وَرَسُولُهُ \". قَالَ فَتَطَاوَلْنَا لَهَا فَقَالَ \" ادْعُ لِي عَلِيًّا \". فَأَتَاهُ وَبِهِ رَمَدٌ فَبَصَقَ فِي عَيْنِهِ فَدَفَعَ الرَّايَةَ إِلَيْهِ فَفَتَحَ اللَّهُ عَلَيْهِ. وَأُنْزِلَتْ هَذِهِ الآيَةُ : ( فَقلْ تَعَالَوْا نَدْعُ أَبْنَاءَنَا وَأَبْنَاءَكُمْ ) الآيَةَ دَعَا رَسُولُ اللَّهِ عَلِيًّا وَفَاطِمَةَ وَحَسَنًا وَحُسَيْنًا فَقَالَ \" اللَّهُمَّ هَؤُلاَءِ أَهْلِي \". قَالَ أَبُو عِيسَى هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3724، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3724 (Chapters on Virtues), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3724، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
