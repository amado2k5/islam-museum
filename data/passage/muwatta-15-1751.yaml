label: { ar: "الموطأ 1751 — مالك: بلغه أن أم سلمة قالت لمرأة حادّ على زوجها اشتكت عينيها: اكتحلي بكحل الجلاء بالليل وامسحيه بالنهار", en: "Muwatta 1751", es: "Muwatta 1751", fr: "Muwatta 1751", ur: "موطا 1751", tr: "El-Muvatta 1751 — Malik: Ona, Ümmü Seleme'nin kocasının ölümüne yas tutan ve gözlerinden şikayet eden bir kadına şöyle dediği rivayet edildi: Geceleyin gözlerini temizlemek için sürme sür, gündüz ise sil.", id: "Al-Muwatta 1751 — Malik: Diriwayatkan kepadanya bahwa Umm Salamah berkata kepada seorang wanita yang sedang berduka atas kematian suaminya dan mengeluh tentang matanya: Oleskan celak untuk membersihkan mata di malam hari dan hapuslah di siang hari." }
text: "اكْتَحلي بِكُحْلِ الْجَلاءِ بِاللَّيْلِ، وَامْسَحيهِ بِالنَّهارِ"
summary:
  ar: "قال مالك إنه بلغه أن أم سلمة، زوج النبي، قالت لامرأة حاد على زوجها، اشتكت عينيها: اكتحلي بكحل الجلاء بالليل، وامسحيه بالنهار. {cite:muwatta-maruf-1997 p.115}"
  tr: "Malik, Peygamberimizin eşi Ümmü Seleme'nin, kocasının ölümüne yas tutan ve gözlerinden şikayet eden bir kadına, \"Geceleyin sürme sürün, gündüz silin\" dediğini işittiğini söyledi. {cite:muwatta-maruf-1997 s.115}"
  id: "Malik berkata bahwa ia mendengar Umm Salamah, istri Nabi, berkata kepada seorang wanita yang sedang berduka atas kematian suaminya dan mengeluh tentang matanya: \"Oleskan celak di malam hari dan hapuslah di siang hari.\" {cite:muwatta-maruf-1997 p.115}"
