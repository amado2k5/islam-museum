label: { ar: "الموطأ 1378 — نافع عن ابن عمر: من حلف بيمين فوكدها ثم حنث فعليه عتق رقبة أو كسوة عشرة مساكين، ومن لم يؤكدها فإطعام عشرة مساكين", en: "Muwatta 1378" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يقول من حلف بيمين فأكدها ثم حنث، فعليه عتق رقبة أو كسوة عشرة مساكين، ومن حلف بيمين فلم يؤكدها ثم حنث، فعليه إطعام عشرة مساكين، لكل مسكين مد من حنطة، فمن لم يجد فصيام ثلاثة أيام. {cite:muwatta-maruf-1997 p.615}"
