label: { ar: "الموطأ 1378 — نافع عن ابن عمر: من حلف بيمين فوكدها ثم حنث فعليه عتق رقبة أو كسوة عشرة مساكين، ومن لم يؤكدها فإطعام عشرة مساكين", en: "Muwatta 1378", es: "Muwatta 1378", fr: "Muwatta 1378", ur: "موطا 1378", tr: "El-Muvatta 1378 — İbn Ömer'den rivayet edildiğine göre Nafi': Kim yemin eder ve yeminini tasdik eder, sonra da bozarsa, bir köleyi azat etmeli veya on fakiri giydirmelidir. Yeminini tasdik etmeyen ise on fakiri doyurmalıdır.", id: "Al-Muwatta 1378 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Barang siapa bersumpah dan mengukuhkannya, kemudian mengingkarinya, maka wajib membebaskan seorang budak atau memberi pakaian kepada sepuluh orang miskin. Barang siapa tidak mengukuhkannya, maka wajib memberi makan sepuluh orang miskin." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يقول من حلف بيمين فأكدها ثم حنث، فعليه عتق رقبة أو كسوة عشرة مساكين، ومن حلف بيمين فلم يؤكدها ثم حنث، فعليه إطعام عشرة مساكين، لكل مسكين مد من حنطة، فمن لم يجد فصيام ثلاثة أيام. {cite:muwatta-maruf-1997 p.615}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre şöyle buyurmuştur: \"Kim yemin eder ve yeminini doğrular, sonra da bozarsa, bir köle azat etmeli veya on fakiri giydirmelidir. Kim yemin eder de yeminini doğrulamaz ve sonra da bozarsa, on fakiri doyurmalı, her birine bir mudd (belirli bir ölçü) buğday vermelidir. Bunlardan hiçbirini bulamazsa, üç gün oruç tutmalıdır.\" {cite:muwatta-maruf-1997 s.615}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa beliau biasa berkata: Barang siapa bersumpah dan mengukuhkannya, kemudian mengingkarinya, maka wajib membebaskan seorang budak atau memberi pakaian kepada sepuluh orang miskin. Barang siapa bersumpah tetapi tidak mengukuhkannya, kemudian mengingkarinya, maka wajib memberi makan sepuluh orang miskin, masing-masing diberi satu mudd (ukuran tertentu) gandum. Barang siapa tidak dapat menemukan salah satu dari keduanya, maka wajib berpuasa selama tiga hari. {cite:muwatta-maruf-1997 p.615}"
