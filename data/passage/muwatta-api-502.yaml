label: { ar: "موطأ مالك 502 — تربية الأب ووصيته", en: "Muwatta Malik 502 — the father raising and counselling", ur: "موطأ مالک 502 — باپ کی تربیت اور نصیحت", es: "Muwatta Malik 502 — el padre que cría y aconseja", fr: "Muwatta Malik 502 — l'éducation et le conseil du père", tr: "Muwatta Malik 502 — Babanın Yetiştirilme Tarzı ve Vasiyeti", id: "Muwatta Malik 502 — Didikan dan Wasiat Sang Ayah" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ أَبِي الزُّبَيْرِ الْمَكِّيِّ، عَنْ طَاوُسٍ الْيَمَانِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ كَانَ يُعَلِّمُهُمْ هَذَا الدُّعَاءَ كَمَا يُعَلِّمُهُمُ السُّورَةَ مِنَ الْقُرْآنِ يَقُولُ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 502، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 502 (The Qur'an), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 502، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 502 (El Corán), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el papel del padre."
  fr: "Un hadith du Muwatta Malik, n° 502 (Coran), mentionne le rôle du père dans l'éducation et le soutien des enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Malik'in Muwatta adlı eserinde yer alan 502 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 502, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini dikumpulkan oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
