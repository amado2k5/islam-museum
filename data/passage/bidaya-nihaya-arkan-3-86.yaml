text: "… إذا أتاكم كريم قوم فأكرموه ثم قال: يا جرير أدعوك إلى شهادة أن لا إله إلا اللّٰه وأني رسول الله، وأن تؤمن بالله واليوم الآخر، والقدر خيره وشرّه، وتصلي الصلاة المكتوبة، وتؤدي الزكاة المفروضة، ففعلت ذلك، فكان بعد ذلك لا …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 86، يذكر الشهادة والصلاة والزكاة، والإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 86, that mentions the testimony, the prayer and the zakat, belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 86 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
