text: "… ذنب قدتاب منه رواه الترمذى وقال حديث حسن غريب وليس اسناده بمتصل خالدين معدان لم يدرك معاذبن جبل الترهيب من ارتكاب الصغائر والمحقرات من الذنوب والاصرار على شىء منها - عن أبى هريرة عن رسول اللّٰه قال ان العبد اذا …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 2، ص 215، يرد فيه ذكر صغائر الذنوب، ومحقرات الذنوب، والإصرار على الذنب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 2, p. 215, whose wording mentions the minor sins, the sins held to be slight, persistence in a sin; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 2، ص 215 کا اقتباس جس میں صغیرہ گناہ، وہ گناہ جنہیں معمولی سمجھا جاتا ہے، گناہ پر اصرار کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Targhib wa-l-Tarhib de al-Mundhiri, volume numérisé 2, p. 215, dont le texte mentionne les péchés mineurs, les péchés tenus pour légers, la persistance dans le péché ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Targhib wa-l-Tarhib de al-Mundhiri, volumen digitalizado 2, p. 215, cuyo texto menciona los pecados menores, los pecados tenidos por leves, la persistencia en el pecado; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
