text: "… فهر القلاف قال: قال عبد الصمد: يا أبا علي رأيت اليوم عجباً: اجتزت ببعض الخرابات فسمعتُ منها أنيناً، فدخلت واذا برجل قد شد حبلاً يريد أن يخنق نفسه! فزعقت عليه وقلت له: لا يحل لك أن تفعل هذا! فقال لي …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 494، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
