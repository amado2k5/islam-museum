text: "… : لولا مخافة السُّبة عليك وعلى بنى أَبيك من بَعْدى وأَن تظن قريشٌ أَنى إنما قلتها جزَعًا من الموت لقلتها لا أَقولها إِلا لأَسرَّك بها. وذكر ابن الكَلْبى أَن أَبا طالب لمما حضرتْه الوفاةُ جمع إليه وجوهَ قريش فأوصاهم فقال …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 1442، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
