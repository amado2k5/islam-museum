text: "العمرة سنة، ولا نعلم أحداً من المسلمين أرخص في تركها"
summary:
  ar: "قول لمالك: العمرة سنة، ولا نعلم أحداً من المسلمين أرخص في تركها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1130). {cite:muwatta-maruf-1997 p.466}"
  tr: "Malik şöyle demiştir: “Umre sünnettir ve onu terk etmeye izin veren hiçbir Müslüman bilmiyoruz.” Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (ö. 1130) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.466}"
  id: "Malik berkata: “Umrah adalah sunnah, dan kami tidak mengetahui adanya seorang Muslim yang memperbolehkan untuk tidak melaksanakannya.” Peneliti menyebutkan bahwa Abu Mus’ab (wafat 1130) meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.466}"
