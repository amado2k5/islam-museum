text: "- - قال قال رسول الله : الحياء من الايمان والإيمان فى الجنة والبذاء من الجفاء والجفاء فى النار. ورواه عن الحسن أيضاً عن أبى بكرة. حدثنا احمد بن يعقوب بن المهرجان قال ثما الحسن بن على العمرى قال. ثنا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 60، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
