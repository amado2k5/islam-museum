text: |-
  ⁦(فصل الرام)⁩
  ⁦(دعد )⁩
  ١٣٣
  الانخناث التذف والتكسر والاسم الخذث قال جرير
  أتوء_دنى وأنت مجاشعىّ * أرى فى خنث لميتك اضطرابا
  وخذث أيضا اسم اهرأة لا يجرى وخننت الشئ فتخنت أى عطفته فتعطف ومنه سحى المخنت
  وتختث فى كلامه والحنت بكسر النون المسترخى المتذنى وفى المثل أخنث من دلال وانطفى
  الذى له ما للربال والفساء جميعا والجمع الخمائى مثل الج الى وخفات السقاء واختنشته اذاثنيته
  لى خارج فشربتمنه قان كسرته الى داخل فقد قبعته- وث رجل أخوث أى
  مسترخى البطى بين الخوث والانتى خوناه
  صل الدال أن الاصعى دأنت الطعام أكلته والدأناء الامة وقد يحرّك
  لحرف الخلق وهو نادرلات فعلاء بفتح العيز لم يجىّ فى الصفات وانماجاء حرفان فى الاسماء فقط
  وهو قرماء وجففاء وهماموضعان ( ثت الدث والدثاث المطر الضعيف قال الراجز
  قلفع روض شرب الدثانا (دعث الاموى الدعث أول الموض وقد دعث الرجل اذا
  أصابه اقشعراروتور ⁦( داث)⁩. ناقة دلاث أى سر بعة ونوق دلت قال الراجز يصف
  النوف
  وخلطت كل دلاث علين * تخليط خرقاء اليدين خلبز
  اللحيانى اندات علينا فسلان يشتم أى انخرق وانصب وقال الاصعى المنداث الدى يمضى
  ويركب رأسه لا يثنيه شئ ؤمد الث الوادى مدافع سيله لهث لدلهاث الاسدور جل
  دلهات ودلاهث أى جرى مقدم مث). الدمث المكان اللين ذور.ل والجم-ع الدماث
  وقد دمث بالكسريدهت دمشا والدماثة-هولة انخلق يقال ما كان أدمث فلانا وألينه
  والادموث مكان اللذ اذا خيزت وتدميث المضجع تليينه (ديت ديثه ذلله وطويق مديث
  أى مذال والديون القنذع وهوالذى لا غيرة له
  ق ل الر بت) وبنته عن حاجته أريه بالضم وبثاحبسته والربيئة الامر
  وسك وكذلك الرشى منال الخصيصى وفى الحديث اذاكان يوم الجعة بعث ابليس
  نوده الى الناس فأخذوا عليهم بالريائت أى ذكروهم الحوائج التى تربئهم وتربث فى مسير
  أى تلئث واربث أمرهم أى ضعف وأبطأحتى تفرقوا قال أبو ذوتب
  وميناهم حتى اذا اربث أمرهم * وعاد الرضيع نهبة للحمائل
  ( رثث الرث الشئ البالى وجعه رثاث وقدرث الحبل وغسيره يرت رثائة وفلان رث
  الهمئة وفى هئته رثاثة أى يذاذة وأرث الثوب أى اخاق والرثة السقط من متاع اليت من
  الخلقان والجمع رنث مثل قربة وقرب ورثاث مثل رهسمة ورهأم وأرتتشنارنة التوم أى
  جعناها والرثة أيضا الخشارة الضعفا من الناس والرنة أيضا المرأة الحقاء وارتت فلان
  وهو افتعل على مالم يسم فاعلد أى حسل من المعركة رئينا أى جريجاوبه دمق عث
  الرعاث القرطة واحدتها رعنة ورعنة بالتحريك وترعثت الرأة أى تة رطت وكان بشار بن برد
  الشاعر يلقب بالمرعث لرعشة كانت له فى صغره ورعشة الديك عثنونه يقال ديك
  هيعث قال الاخطل
  ماذا يؤر فى والنوم بفجبى * من صوت دى رعشات ساكن الدار
  5S
  صحاج
  قوله ومنة سمى المخنث قال
  الازهرى الاختناث التكسر
  والتنى ومنه سي المحذث لتكسره
  وقال الليت انماسمى المخنت
  من الحنى اه مختار
