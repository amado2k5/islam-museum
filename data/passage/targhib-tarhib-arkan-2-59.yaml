label: { ar: "الترغيب والترهيب للمنذري، المجلد المصوَّر 2، ص 59 — تعريف الإسلام بأعماله، الإيمان بالله وملائكته وكتبه ورسله", en: "al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 2, p. 59 — Islam defined by its acts; belief in God, His angels, His books and His messengers", ur: "الترغیب والترہیب، منذری، اسکین جلد 2، ص 59 — اسلام کی تعریف اس کے اعمال سے، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان", es: "Al-Targhib wa-l-Tarhib de al-Mundhiri, escaneo del volumen 2, pág. 59: El Islam se define por sus actos; la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros.", fr: "al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 2, p. 59 — L'islam défini par ses actes; la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers" }
text: "… الله ما الإسلام قال لاتشرك بالله شيئاً وتقيم الصلاة وتؤتى الزكاة وتصوم رمضان قال صدقت قال يا رسول اللّه ما الإيمان قال ان تؤمن بالله وملائكته وكتابه ورسله وتؤمن بالبعث الآخر وتؤمن بالقدر كله قال صدقت قال يا رسول اللّه …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 2، ص 59، يذكر تعريف الإسلام بأعماله، والإيمان بالله وملائكته وكتبه ورسله، والإيمان بالقدر، والسؤال عن الإيمان وجوابه، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 2, p. 59, that mentions Islam defined by its acts, belief in God, His angels, His books and His messengers, belief in the decree, the question about faith and its answer, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 2، ص 59 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، تقدیر پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 2, pág. 59, que menciona el Islam definido por sus actos, la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, la creencia en el decreto, la cuestión de la fe y su respuesta, y la creencia en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Tarhib wa-l-Tarhib d'al-Mundhiri (tome 2, p. 59): l'islam y est défini par ses actes, la croyance en Dieu, Ses anges, Ses livres et Ses messagers, la croyance au décret divin, la question de la foi et sa réponse, et la croyance en la résurrection. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
