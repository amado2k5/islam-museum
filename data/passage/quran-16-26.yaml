text: "قَدْ مَكَرَ ٱلَّذِينَ مِن قَبْلِهِمْ فَأَتَى ٱللَّهُ بُنْيَـٰنَهُم مِّنَ ٱلْقَوَاعِدِ فَخَرَّ عَلَيْهِمُ ٱلسَّقْفُ مِن فَوْقِهِمْ وَأَتَىٰهُمُ ٱلْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ"
text_search: "قد مكر الذين من قبلهم فأتى الله بنيانهم من القواعد فخر عليهم السقف من فوقهم وأتاهم العذاب من حيث لا يشعرون"
translations:
  en: { text: "Those before them plotted, so Allah struck at the foundations of their building, and then the roof fell down upon them from above them, and the doom came on them whence they knew not;", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "ان سے پہلے لوگوں نے بھی (ایسی ہی) مکاریاں کی تھیں تو خدا (کا حکم) ان کی عمارت کے ستونوں پر آپہنچا اور چھت ان پر ان کے اوپر سے گر پڑی اور (ایسی طرف سے) ان پر عذاب آ واقع ہوا جہاں سے ان کو خیال بھی نہ تھا", translator: "Fateh Muhammad Jalandhari", license: PD }
