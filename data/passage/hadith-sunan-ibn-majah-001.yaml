text: "ن رباح اللخمي، عن عقبة بن عامر الجهني، أنه قدم على عمر بن الخطاب من مصر. فقال : منذ كم لم تنزع خفيك؟ قال : من الجمعة إلى الجمعة. قال : أصبت السنة . (88/88) باب ما جاء في المسح"
