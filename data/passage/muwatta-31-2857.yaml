label: { ar: "الموطأ 2857 — عامل الصدقة من بني عبد الأشهل يسأل النبي إبلا من الصدقة فيغضب النبي", en: "Muwatta 2857" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر، عن أبيه، أن رسول الله استعمل رجلا من بني عبد الأشهل على الصدقة، فلما قدم سأله إبلا من الصدقة. فغضب رسول الله حتى عرف الغضب في وجهه، وكانت علامة غضبه أن تحمر عيناه، ثم قال: إن الرجل ليسألني ما لا يصلح لي ولا له، فإن منعته كرهت المنع، وإن أعطيته أعطيته ما لا يصلح لي ولا له. فقال الرجل: يا رسول الله، لا أسألك منها شيئا أبدا. ويذكر المحقق قول ابن عبد البر أن جماعة الرواة رووه عن مالك مرسلا، وأن أحمد بن منصور التلي رواه عن مالك عن عبد الله بن أبي بكر عن أنس، ويرى المحقق أن هذه الرواية لا يعول عليها بالنسبة لمن رواه مرسلا. {cite:muwatta-maruf-1997 p.600} {cite:muwatta-maruf-1997 p.601}"
