label: { ar: "الموطأ 2857 — عامل الصدقة من بني عبد الأشهل يسأل النبي إبلا من الصدقة فيغضب النبي", en: "Muwatta 2857", es: "Muwatta 2857", fr: "Muwatta 2857", ur: "موطا 2857", tr: "El-Muvatta 2857 — Beni Abdül-Eşhal kabilesinden sadaka toplayıcısı, Peygamberimizden sadakalardan deve ister ve Peygamberimiz öfkelenir.", id: "Al-Muwatta 2857 — Pemungut sedekah dari Bani Abd al-Ashhal meminta unta kepada Nabi dari sedekahnya, dan Nabi menjadi marah." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر، عن أبيه، أن رسول الله استعمل رجلا من بني عبد الأشهل على الصدقة، فلما قدم سأله إبلا من الصدقة. فغضب رسول الله حتى عرف الغضب في وجهه، وكانت علامة غضبه أن تحمر عيناه، ثم قال: إن الرجل ليسألني ما لا يصلح لي ولا له، فإن منعته كرهت المنع، وإن أعطيته أعطيته ما لا يصلح لي ولا له. فقال الرجل: يا رسول الله، لا أسألك منها شيئا أبدا. ويذكر المحقق قول ابن عبد البر أن جماعة الرواة رووه عن مالك مرسلا، وأن أحمد بن منصور التلي رواه عن مالك عن عبد الله بن أبي بكر عن أنس، ويرى المحقق أن هذه الرواية لا يعول عليها بالنسبة لمن رواه مرسلا. {cite:muwatta-maruf-1997 p.600} {cite:muwatta-maruf-1997 p.601}"
  tr: "Malik, Abdullah ibn Abi Bekr'den, o da babasından rivayet ettiğine göre, Allah Resulü'nün Beni Abdüleşhal kabilesinden bir adamı zekât toplamakla görevlendirdiğini anlatır. Adam geri döndüğünde, Allah Resulü'nden zekâttan deve istedi. Allah Resulü öfkelendi ve öfkesi yüzünden okundu; gözleri kızardı. Sonra şöyle dedi: \"Bu adam benden ne bana ne de ona yakışmayan bir şey istiyor. Ona hayır dersem, hayır demekten hoşlanmam; ona verirsem de, ne bana ne de ona yakışmayan bir şey vermiş olurum.\" Adam şöyle dedi: \"Ey Allah Resulü, bundan sonra senden asla zekâttan bir şey istemeyeceğim.\" Araştırmacı, İbn Abdülberr'in, bir grup ravi tarafından Malik'ten mursal hadis olarak nakledildiğini ve Ahmed ibn Mansur el-Tali'nin bunu Malik'ten, Abdullah ibn Abi Bekr'den, o da Enes'ten rivayet ettiğini belirttiğini aktarıyor. Araştırmacı, bu rivayetin mursal hadis olarak nakledenler açısından güvenilir olmadığına inanmaktadır. {cite:muwatta-maruf-1997 s.600} {cite:muwatta-maruf-1997 s.601}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr, yang juga meriwayatkan dari ayahnya, bahwa Rasulullah SAW menunjuk seorang laki-laki dari Bani Abd al-Ashhal untuk mengumpulkan zakat. Ketika laki-laki itu kembali, ia meminta unta kepada Rasulullah SAW dari zakat tersebut. Rasulullah SAW menjadi marah, dan kemarahannya terlihat jelas di wajahnya; matanya memerah. Kemudian beliau berkata, “Orang ini meminta sesuatu yang tidak pantas bagiku maupun baginya. Jika aku menolaknya, aku tidak suka menolak, dan jika aku memberikannya kepadanya, aku memberikan sesuatu yang tidak pantas bagiku maupun baginya.” Laki-laki itu berkata, “Wahai Rasulullah, aku tidak akan pernah meminta apa pun lagi darinya.” Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa sekelompok perawi meriwayatkan hadits ini dari Malik sebagai hadits mursal, dan bahwa Ahmad ibn Mansur al-Tali meriwayatkannya dari Malik, yang juga meriwayatkan dari Abdullah ibn Abi Bakr, yang juga meriwayatkan dari Anas. Peneliti tersebut meyakini bahwa riwayat ini tidak dapat diandalkan bagi mereka yang meriwayatkannya sebagai hadits mursal. {cite:muwatta-maruf-1997 p.600} {cite:muwatta-maruf-1997 p.601}"
