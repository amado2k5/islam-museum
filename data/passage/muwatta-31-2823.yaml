label: { ar: "الموطأ 2823 — المطلب بن عبد الله بن حنطب: ما الغيبة؟ أن تذكر من المرء ما يكره أن يسمع", en: "Muwatta 2823", es: "Muwatta 2823", fr: "Muwatta 2823", ur: "موطا 2823", tr: "Al-Muwatta 2823 — Al-Muttalib ibn Abdullah ibn Hantab: Gıybet nedir? Bir kişi hakkında, onun duymaktan hoşlanmayacağı şeyleri söylemektir.", id: "Al-Muwatta 2823 — Al-Muttalib ibn Abdullah ibn Hantab: Apakah yang dimaksud dengan ghibah? Itu adalah membicarakan tentang seseorang sesuatu yang tidak disukainya." }
summary:
  ar: "يروي مالك عن الوليد بن عبد الله بن صياد أن المطلب بن عبد الله بن حنطب المخزومي أخبره أن رجلا سأل النبي: ما الغيبة؟ فقال: أن تذكر من المرء ما يكره أن يسمع. قال: يا رسول الله، وإن كان حقا؟ قال: إذا قلت باطلا فذلك البهتان. ويذكر المحقق قول ابن عبد البر أن الصواب في اسم الراوي «حنطب» لا «حويطب» كما في رواية يحيى، وأن الحديث موصول من حديث العلاء بن عبد الرحمن عن أبيه عن أبي هريرة عند مسلم وغيره. {cite:muwatta-maruf-1997 p.585}"
  tr: "Malik, el-Valid ibn Abdullah ibn Seyyid'den rivayetle, el-Muttalib ibn Abdullah ibn Hantab el-Makhzumi'nin kendisine bir adamın Peygamber'e \"Gıybet nedir?\" diye sorduğunu, Peygamber'in ise \"Bir kimse hakkında duymaktan hoşlanmayacağı şeyleri söylemektir\" diye cevap verdiğini aktarır. Adam, \"Ey Allah'ın Resulü, doğru olsa bile mi?\" diye sordu. Peygamber, \"Eğer yalan söylersen, bu iftiradır\" diye cevap verdi. Araştırmacı, İbn Abd el-Barr'ın, ravi'nin doğru adının Yahya'nın rivayetindeki gibi \"Huveytib\" değil \"Hantab\" olduğunu ve hadisin, Müslim ve diğer hadis derlemelerinde bulunan, el-Ala' ibn Abd el-Rahman'ın babasından, onun da Ebu Hurayra'dan rivayetiyle bağlantılı olduğunu belirttiğini aktarır. {cite:muwatta-maruf-1997 s.585}"
  id: "Malik meriwayatkan dari al-Walid ibn Abdullah ibn Sayyad bahwa al-Muttalib ibn Abdullah ibn Hantab al-Makhzumi memberitahunya bahwa seorang pria bertanya kepada Nabi: \"Apakah yang dimaksud dengan ghibah?\" Beliau menjawab: \"Itu adalah menyebutkan tentang seseorang sesuatu yang tidak disukainya.\" Pria itu bertanya: \"Wahai Rasulullah, bagaimana jika itu benar?\" Beliau menjawab: \"Jika kamu mengatakan sesuatu yang salah, maka itu adalah fitnah.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa nama perawi yang benar adalah \"Hantab,\" bukan \"Huwaytib\" seperti dalam riwayat Yahya, dan bahwa hadits tersebut terhubung melalui riwayat al-Ala' ibn Abd al-Rahman, dari ayahnya, dari Abu Hurayrah, sebagaimana terdapat dalam Muslim dan koleksi lainnya. {cite:muwatta-maruf-1997 p.585}"
