label: { ar: "الموطأ 2823 — المطلب بن عبد الله بن حنطب: ما الغيبة؟ أن تذكر من المرء ما يكره أن يسمع", en: "Muwatta 2823" }
summary:
  ar: "يروي مالك عن الوليد بن عبد الله بن صياد أن المطلب بن عبد الله بن حنطب المخزومي أخبره أن رجلا سأل النبي: ما الغيبة؟ فقال: أن تذكر من المرء ما يكره أن يسمع. قال: يا رسول الله، وإن كان حقا؟ قال: إذا قلت باطلا فذلك البهتان. ويذكر المحقق قول ابن عبد البر أن الصواب في اسم الراوي «حنطب» لا «حويطب» كما في رواية يحيى، وأن الحديث موصول من حديث العلاء بن عبد الرحمن عن أبيه عن أبي هريرة عند مسلم وغيره. {cite:muwatta-maruf-1997 p.585}"
