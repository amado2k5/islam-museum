label: { ar: "سنن النسائي 1355 — الأب والأبوة", en: "Sunan al-Nasa'i 1355 — the father and fatherhood", ur: "سنن نسائی 1355 — باپ اور والدیت" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى الصَّنْعَانِيُّ، وَالْحُسَيْنُ بْنُ مُحَمَّدٍ الذَّارِعُ، - وَاللَّفْظُ لَهُ - قَالاَ حَدَّثَنَا عَثَّامُ بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا الأَعْمَشُ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ رَأَيْتُ رَسُولَ اللَّهِ يَعْقِدُ التَّسْبِيحَ."
summary:
  ar: "حديث في سنن النسائي، رقم 1355، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1355 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1355، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
