label: { ar: "الموطأ 1083 — مالك: لو جهل رجل أن يكون آخر عهده الطواف بالبيت حتى صدر، لم أر عليه شيئاً، إلا أن يكون قريباً فيرجع فيطوف بالبيت ثم ينصرف إذا كان قد أفاض", en: "Muwatta 1083", es: "Muwatta 1083", fr: "Muwatta 1083", ur: "موطا 1083", tr: "El-Muvatta 1083 — Malik: Bir kimse, ayrılmadan önce son amellerinin Kâbe'yi tavaf etmek olduğunu bilmiyorsa, yakınlarda değilse, onun için bir yükümlülük görmüyorum. Yakınlardaysa, geri dönüp Kâbe'yi tavaf etmeli, sonra da Tawaf al-Ifadah'ı yapmışsa ayrılmalıdır.", id: "Al-Muwatta 1083 — Malik: Jika seseorang tidak menyadari bahwa amalan terakhirnya adalah mengelilingi Ka'bah hingga ia pergi, saya tidak melihat adanya kewajiban baginya, kecuali jika ia sudah dekat, dalam hal ini ia harus kembali dan mengelilingi Ka'bah, kemudian pergi jika ia telah melaksanakan Tawaf al-Ifadah." }
summary:
  ar: "قول لمالك: لو جهل رجل أن يكون آخر عهده الطواف بالبيت حتى صدر، لم أر عليه شيئاً، إلا أن يكون قريباً، فيرجع فيطوف بالبيت ثم ينصرف إذا كان قد أفاض. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1446). {cite:muwatta-maruf-1997 p.497}"
  tr: "Malik şöyle demiştir: Bir kimse, son amellerinin Kâbe'yi tavaf etmek olduğunu, oradan ayrıldıktan sonra öğrenmişse, ona bir yükümlülük görmüyorum; ancak yakınlarda ise, geri dönüp Kâbe'yi tavaf etmeli, daha önce Tavafü'l-İfade'yi yapmışsa oradan ayrılmalıdır. Araştırmacı, bu rivayetin Ebu Mus'ab (1446) tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.497}"
  id: "Malik berkata: Jika seseorang tidak menyadari bahwa amalan terakhirnya adalah tawaf mengelilingi Ka'bah hingga ia telah pergi, saya tidak melihat kewajiban apa pun baginya, kecuali jika ia sudah dekat, dalam hal ini ia harus kembali dan melakukan tawaf mengelilingi Ka'bah, kemudian pergi jika ia telah melakukan Tawaf al-Ifadah. Peneliti menyebutkan bahwa Abu Mus'ab (1446) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.497}"
