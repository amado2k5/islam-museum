text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا أَبُو عَاصِمٍ، حَدَّثَنَا رَبِيعَةُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ حِصْنٍ، حَدَّثَتْنِي جَدَّتِي، سَرَّاءُ بِنْتُ نَبْهَانَ - وَكَانَتْ رَبَّةَ بَيْتٍ فِي الْجَاهِلِيَّةِ - قَالَتْ خَطَبَنَا رَسُولُ اللَّهِ يَوْمَ الرُّءُوسِ فَقَالَ \" أَىُّ يَوْمٍ هَذَا \". قُلْنَا اللَّهُ وَرَسُولُهُ أَعْلَمُ قَالَ \" أَلَيْسَ أَوْسَطَ أَيَّامِ التَّشْرِيقِ \". قَالَ أَبُو دَاوُدَ وَكَذَلِكَ قَالَ عَمُّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1953، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1953 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1953، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1953 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
