text: "… عَبد اللّه القاضي الجُعْفي، وَبالرقة: عَلى أبي طاهر محمّد بن أسَد بن هلال الأشناني الرّقّي، وبمنبج: عَلى أبي العَباس أحمَد بن علي المَنْبِجي بقراءة أبي عمرو وَابن عامر وَحَمزة وعاصم بن أبي النُجُود. رَوى عنه أحمَد بن الفَضل البَاطرقاني، وَأبُو …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 474، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 4, p. 474, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 4، ص 474 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 4, pág. 474, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh Dimashq d'Ibn 'Asakir, volume 4, page 474, mentionne les lectures du Coran et les lecteurs; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 4, sayfa 474'ten bir alıntı, Kur'an okunuşlarını ve okuyucularını ele almaktadır; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 4 Bergambar, halaman 474, menyebutkan bacaan Al-Quran dan para qarinya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
