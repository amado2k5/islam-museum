label: { ar: "سنن النسائي 2135 — الأب والأبوة", en: "Sunan al-Nasa'i 2135 — the father and fatherhood", ur: "سنن نسائی 2135 — باپ اور والدیت" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ بِشْرٍ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنْ مُحَمَّدِ بْنِ سَعْدِ بْنِ أَبِي وَقَّاصٍ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ أَنَّهُ ضَرَبَ بِيَدِهِ عَلَى الأُخْرَى وَقَالَ \" الشَّهْرُ هَكَذَا وَهَكَذَا وَهَكَذَا \". وَنَقَصَ فِي الثَّالِثَةِ إِصْبَعًا."
summary:
  ar: "حديث في سنن النسائي، رقم 2135، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2135 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2135، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
