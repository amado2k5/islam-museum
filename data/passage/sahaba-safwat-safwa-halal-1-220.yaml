text: "… على القلوب، فأي قلبٍ أنس بها نكتت في نُكتةً سوداء، فإن أنكرها نكتت فيه نكتة بيضاء، فمن أحب منكم أن يعلم أصابته الفتنة أم لا؟ فلينظر فإن كان يرى حراماً كان يراه حلالاً أو يرى حلالاً كان حراماً فقد أصابته …"
