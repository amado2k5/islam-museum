label: { ar: "الموطأ 2116 — مالك: فالسنة عندنا أن العبد إذا جاء بشاهد على عتاقته استحلف سيده ما أعتقه، وبطل ذلك عنه", en: "Muwatta 2116", es: "Muwatta 2116", fr: "Muwatta 2116", ur: "موطا 2116", tr: "El-Muvatta 2116 — Malik: Bizde sünnet şudur ki, bir köle azat edildiğine dair bir şahit getirirse, efendisi onu azat etmediğine dair yemin ettirilir ve bu onun için geçersiz olur.", id: "Al-Muwatta 2116 — Malik: Sunnah di kalangan kami adalah jika seorang budak membawa saksi atas pembebasannya, maka tuannya disuruh bersumpah bahwa ia tidak membebaskannya, dan hal itu menjadi batal baginya." }
summary:
  ar: "قال مالك: فالسنة عندنا أن العبد إذا جاء بشاهد على عتاقته، استحلف سيده ما أعتقه، وبطل ذلك عنه. {cite:muwatta-maruf-1997 p.264}"
  tr: "Malik şöyle dedi: Geleneklerimize göre, bir köle azat edildiğine dair bir şahit getirirse, efendisi onu azat etmediğine dair yemin ettirilir ve bu azat geçersiz sayılır. {cite:muwatta-maruf-1997 s.264}"
  id: "Malik berkata: Menurut tradisi kami, jika seorang budak membawa saksi atas pembebasannya, tuannya harus bersumpah bahwa ia tidak membebaskannya, dan pembebasan itu menjadi batal. {cite:muwatta-maruf-1997 p.264}"
