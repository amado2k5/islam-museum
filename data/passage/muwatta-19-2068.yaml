label: { ar: "الموطأ 2068 — مالك: والمقارض أيضا بهذه المنزلة لا يصلح، إذا دخلت الزيادة في المساقاة أو المقارضة صارت إجارة، وما دخلته الإجارة فإنه لا يصلح، ولا ينبغي أن تقع الإجارة بأمر غرر", en: "Muwatta 2068", es: "Muwatta 2068", fr: "Muwatta 2068", ur: "موطا 2068", tr: "Al-Muwatta 2068 — Malik: Ortakçı da bu statüdedir ve geçerli değildir. Ortakçılık veya ortakçılık sözleşmesine bir artış eklenirse, bu bir kira sözleşmesi haline gelir ve kira sözleşmesine dahil edilen şey geçerli değildir ve kira sözleşmesi belirsiz bir şeye dayanmamalıdır.", id: "Al-Muwatta 2068 — Malik: Petani penggarap juga berstatus demikian dan tidak sah. Jika kenaikan harga dimasukkan dalam perjanjian penggarapan atau perjanjian bagi hasil, maka perjanjian tersebut menjadi sewa, dan apa yang termasuk dalam sewa tidak sah, dan sewa tidak boleh didasarkan pada sesuatu yang tidak pasti." }
summary:
  ar: "قال مالك: والمقارض أيضا بهذه المنزلة لا يصلح، إذا دخلت الزيادة في المساقاة أو المقارضة صارت إجارة. وما دخلته الإجارة فإنه لا يصلح، ولا ينبغي أن تقع الإجارة بأمر غرر، لا يدري أيكون أم لا يكون، أو يقل أو يكثر. {cite:muwatta-maruf-1997 p.245}"
  tr: "Malik şöyle dedi: Bu durumda ortakçılık sözleşmesi de geçersizdir. Ortakçılık sözleşmesine veya ortakçılık düzenlemesine bir artış getirilirse, bu bir kira sözleşmesi haline gelir. Bir kira sözleşmesine getirilen her şey geçersizdir ve bir kira sözleşmesi, gerçekleşip gerçekleşmeyeceği veya daha az mı yoksa daha fazla mı olacağı bilinmediği belirsizliğe dayanmamalıdır. {cite:muwatta-maruf-1997 s.245}"
  id: "Malik berkata: Perjanjian bagi hasil juga tidak sah dalam kasus ini. Jika kenaikan dimasukkan ke dalam perjanjian bagi hasil atau pengaturan bagi hasil, maka itu menjadi sewa. Apa pun yang dimasukkan ke dalam sewa tidak sah, dan sewa tidak boleh didasarkan pada ketidakpastian, di mana tidak diketahui apakah itu akan terjadi atau tidak, atau apakah akan kurang atau lebih. {cite:muwatta-maruf-1997 p.245}"
