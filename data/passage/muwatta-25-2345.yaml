label: { ar: "الموطأ 2345 — مالك: الموصى له بربع المكاتب وورثة سيده في الفاضل", en: "Muwatta 2345", es: "Muwatta 2345", fr: "Muwatta 2345", ur: "موطا 2345", tr: "Al-Muwatta 2345 — Malik: Kölenin sözleşmesinin dörtte birinin mirasçısı ve geri kalanının efendisinin mirasçıları.", id: "Al-Muwatta 2345 — Malik: Penerima warisan seperempat dari perjanjian perbudakan dan ahli waris tuannya atas sisanya" }
summary:
  ar: "قال مالك في رجل أوصى لرجل بربع مكاتب له، وأعتق ربعه، فهلك الرجل ثم هلك المكاتب وترك مالا أكثر مما بقي عليه: يُعطى ورثة السيد والموصى له ما بقي لهم على المكاتب، ثم يقتسمون الفاضل، فيكون للموصى له ثلث ما فضل بعد أداء الكتابة، ولورثة السيد الثلثان؛ لأن المكاتب عبد ما بقي عليه شيء من كتابته، فإنما يورث بالرق. {cite:muwatta-maruf-1997 p.367} {cite:muwatta-maruf-1997 p.368}"
  tr: "Malik, kölesinin özgürlüğünün dörtte birini başka bir adama vasiyet eden ve kölesinin dörtte birini de azat eden, sonra o adamın vefat etmesi ve ardından kölenin de ölmesi, geride özgürlüğünün kalan kısmından daha fazla para bırakması durumunda şöyle demiştir: Efendinin ve vasiyet alan kişinin mirasçılarına kölenin özgürlüğünün kalan kısmı verilir, sonra da kalanını paylaşırlar. Vasiyet alan kişi, azat bedeli ödendikten sonra kalan kısmın üçte birini alır, efendinin mirasçıları ise üçte ikisini alır; çünkü köle, özgürlüğünün bir kısmı ödenene kadar köle olarak kalır ve köle olarak miras alınır. {cite:muwatta-maruf-1997 s.367} {cite:muwatta-maruf-1997 s.368}"
  id: "Malik berkata mengenai seorang pria yang mewariskan seperempat kebebasan budaknya kepada pria lain, dan membebaskan seperempat darinya, lalu pria itu meninggal, diikuti oleh budak tersebut, meninggalkan lebih banyak uang daripada sisa kebebasannya: Ahli waris majikan dan penerima warisan diberikan sisa kebebasan budak tersebut, kemudian mereka membagi sisanya. Penerima warisan menerima sepertiga dari sisa setelah uang pembebasan dibayarkan, dan ahli waris majikan menerima dua pertiga, karena budak tetap menjadi budak sampai sebagian dari kebebasannya dibayarkan, dan ia diwarisi sebagai budak. {cite:muwatta-maruf-1997 p.367} {cite:muwatta-maruf-1997 p.368}"
