label: { ar: "الموطأ 2345 — مالك: الموصى له بربع المكاتب وورثة سيده في الفاضل", en: "Muwatta 2345" }
summary:
  ar: "قال مالك في رجل أوصى لرجل بربع مكاتب له، وأعتق ربعه، فهلك الرجل ثم هلك المكاتب وترك مالا أكثر مما بقي عليه: يُعطى ورثة السيد والموصى له ما بقي لهم على المكاتب، ثم يقتسمون الفاضل، فيكون للموصى له ثلث ما فضل بعد أداء الكتابة، ولورثة السيد الثلثان؛ لأن المكاتب عبد ما بقي عليه شيء من كتابته، فإنما يورث بالرق. {cite:muwatta-maruf-1997 p.367} {cite:muwatta-maruf-1997 p.368}"
