label: { ar: "الموطأ 2603 — عائشة: دعاء النبي بحب المدينة وصحة هوائها ونقل حماها إلى الجحفة", en: "Muwatta 2603", es: "Muwatta 2603", fr: "Muwatta 2603", ur: "موطا 2603", tr: "Al-Muwatta 2603 — Aişe: Peygamber, Medine sevgisi, havasının sağlığı ve Medine'nin ateşinin Cuhfa'ya bulaşması için dua etti.", id: "Al-Muwatta 2603 — Aisyah: Nabi berdoa memohon kecintaan terhadap Madinah, kesehatan udaranya, dan agar demamnya berpindah ke Al-Juhfa." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة أنها قالت: لما قدم رسول الله المدينة وُعك أبو بكر وبلال، فدخلت عليهما، فكان أبو بكر إذا أخذته الحمى يقول أبياتا في أن كل امرئ مصبح في أهله والموت أدنى من شراك نعله، وكان بلال إذا أقلع عنه يرفع صوته بأبيات يتمنى فيها المبيت بوادٍ حول الإذخر والجليل ومياه مجنة. فأخبرت النبي، فقال: اللهم حبب إلينا المدينة كحبنا مكة أو أشد، وصححها، وبارك لنا في صاعها ومدها، وانقل حماها فاجعلها بالجحفة. {cite:muwatta-maruf-1997 p.469} {cite:muwatta-maruf-1997 p.470}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Aişe'den rivayet ettiğine göre şöyle buyurmuştur: \"Allah'ın Resulü Medine'ye vardığında Ebu Bekir ve Bilal hastalandılar. Onların yanına gittim ve Ebu Bekir ateşlendiğinde, her insanın ailesiyle birlikte uyandığı, ölümün ise ayakkabısının kayışından daha yakın olduğuyla ilgili ayetler okurdu. Bilal iyileştiğinde ise, güzel kokulu otlar, yaseminler ve Mekenne sularıyla çevrili bir vadide geceyi geçirme arzusunu dile getiren ayetlerle sesini yükseltirdi. Peygamberimize haber verdim ve şöyle buyurdu: 'Ey Allah'ım, Medine'yi bize Mekke kadar, hatta daha da sevdir. Ona sağlık ver, tahıllarıyla bizi bereketlendir ve ateşini Cühfe'ye indir.'\""
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, bahwa ia berkata: Ketika Rasulullah tiba di Madinah, Abu Bakar dan Bilal jatuh sakit. Aku pergi menemui mereka, dan ketika Abu Bakar demam, ia membacakan ayat-ayat tentang bagaimana setiap orang bangun bersama keluarganya sementara kematian lebih dekat daripada tali sandalnya. Dan ketika Bilal sembuh, ia melantunkan ayat-ayat yang mengungkapkan keinginannya untuk bermalam di lembah yang dikelilingi rumput harum, melati, dan air Majannah. Aku memberitahu Nabi, dan beliau bersabda: “Ya Allah, jadikan Madinah dicintai oleh kami seperti Mekah, atau bahkan lebih dicintai. Berikanlah kesehatan kepadanya, berkahilah kami dalam takaran biji-bijiannya, dan pindahkanlah demamnya ke al-Juhfah.”"
