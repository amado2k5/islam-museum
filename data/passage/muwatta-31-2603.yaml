label: { ar: "الموطأ 2603 — عائشة: دعاء النبي بحب المدينة وصحة هوائها ونقل حماها إلى الجحفة", en: "Muwatta 2603" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة أنها قالت: لما قدم رسول الله المدينة وُعك أبو بكر وبلال، فدخلت عليهما، فكان أبو بكر إذا أخذته الحمى يقول أبياتا في أن كل امرئ مصبح في أهله والموت أدنى من شراك نعله، وكان بلال إذا أقلع عنه يرفع صوته بأبيات يتمنى فيها المبيت بوادٍ حول الإذخر والجليل ومياه مجنة. فأخبرت النبي، فقال: اللهم حبب إلينا المدينة كحبنا مكة أو أشد، وصححها، وبارك لنا في صاعها ومدها، وانقل حماها فاجعلها بالجحفة. {cite:muwatta-maruf-1997 p.469} {cite:muwatta-maruf-1997 p.470}"
