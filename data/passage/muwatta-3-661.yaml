label: { ar: "الموطأ 661 — مالك: مئة وستون درهماً وازنة والصرف ثمانية دراهم بدينار لا تجب فيها الزكاة", en: "Muwatta 661", es: "Muwatta 661", fr: "Muwatta 661", ur: "موطا 661", tr: "El-Muvatta 661 — Malik: Ağırlığı yüz altmış dirhemdir ve döviz kuru bir dinara sekiz dirhemdir; bu durumda zekât farz değildir.", id: "Al-Muwatta 661 — Malik: Beratnya seratus enam puluh dirham, dan nilai tukarnya adalah delapan dirham untuk satu dinar, di mana zakat tidak diwajibkan." }
summary:
  ar: "قول لمالك في رجل عنده مئة وستون درهماً وازنة وصرف الدراهم ببلده ثمانية دراهم بدينار: أنها لا تجب فيها الزكاة، وإنما تجب في عشرين ديناراً عيناً أو مئتي درهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.337}"
  tr: "Malik, yerel döviz kuru sekiz dirhem olan ve yüz altmış dirhem ağırlığında malı bulunan bir adam hakkında şöyle demiştir: Zekat, bu miktar üzerinden değil, yirmi dinar ayni mal veya iki yüz dirhem üzerinden farzdır. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.337}"
  id: "Malik berkata mengenai seorang pria yang memiliki seratus enam puluh dirham beratnya, dan nilai tukar lokalnya adalah delapan dirham untuk satu dinar: bahwa zakat tidak wajib atas jumlah tersebut, melainkan atas dua puluh dinar dalam bentuk barang atau dua ratus dirham. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.337}"
