summary:
  ar: "قول لمالك في رجل عنده مئة وستون درهماً وازنة وصرف الدراهم ببلده ثمانية دراهم بدينار: أنها لا تجب فيها الزكاة، وإنما تجب في عشرين ديناراً عيناً أو مئتي درهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.337}"
