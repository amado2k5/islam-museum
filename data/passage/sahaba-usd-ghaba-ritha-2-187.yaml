text: "… اللّٰه عله الحزن. الذي أرضعني، وكان أحد بني مرة بن عوف، قال: والله لكأني أنظر إلى جعفر بن أبي طالب يوم مؤتة، وروى أن رسول اللّٰه عليه لما أتاه نعي جعفر، دخل على امرأته أسماء بنت عميس، فعزاها فيه ودخلت …"
