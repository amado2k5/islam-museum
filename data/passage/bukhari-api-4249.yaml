label: { ar: "صحيح البخاري 4249 — السم", en: "Sahih al-Bukhari 4249 — poison", ur: "صحیح بخاری 4249 — زہر", es: "Sahih al-Bukhari 4249 - veneno", fr: "Sahih al-Bukhari 4249 — poison" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، حَدَّثَنَا اللَّيْثُ، حَدَّثَنِي سَعِيدٌ، عَنْ أَبِي هُرَيْرَةَ ـ قَالَ لَمَّا فُتِحَتْ خَيْبَرُ أُهْدِيَتْ لِرَسُولِ اللَّهِ شَاةٌ فِيهَا سُمٌّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4249، يذكر السم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4249 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4249، جس میں زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 4249 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona el veneno. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4249 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le poison. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
