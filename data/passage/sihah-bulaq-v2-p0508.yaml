text: |-
  • ⁦(فصل انخاه)⁩
  *خفق)*
  ٧٩
  وأكثرنائما مخراق حرب • يعير على السيادة أويسود
  يقول لم أرم عشمرا أكثرقيان حرب منهم وأما المخرقة فكلمة مولدة والحرق بالتحريك الدهش
  من الخوف أوالحياء وقد خرق بالكسرفهو خرق وأخرقته أنا أى أدهشته وانذ رق أيضا
  مصدر الأخرق وه وضد الرفيق وقدخرق بالححكسر يخرق خرقا والاسم الحرق بالضم
  وفى المثل لاتعدم الحرقا علة ومعناه أن العال كيرة موجودة تجنها احرقا ففلا عن
  الكيس واندرقاء من الغنم التى فى أذنها خرق وهو ثقب مسمدير وخرقاء صاسبة ذى الرقّة.
  وهى من بى عامر ين ربيعة بن عامر بن صعصعة وريع خرقاء أى شديدة ⁦(خريق)⁩ خربقت
  الثوب أى شققته ووى قالو خبرت وهومثل جذب وجمذ يقال -تفلان ى خرباقه أى فى
  ضرطه واللخر باف أيضا اسم وجل ص العصابة بقال نه ذواليدين وخريقت الشى مثل جردلته
  أى قطعته وخريق عمله أى أقسده والحر بق من الادوية والمخرنيق المطرق الساكت وفى
  الممل مخرنيو لبنباع أى ليثب اذا أصاب فرصة ومعناه أنه سكت لداهية يريدها رنق
  نلرنق ولد الارنب وأرض مخرنة-ة ذات خرائق وخرنق أيض اسم امرأة شاعرة قال أبو
  مبيدة هى خرتوينت هفان من بنى سعد بن ضبيعة رهط الاعشى والخورنقاسم قصر بالعراق
  فارسىّ معرب بناه النعمان الأكبر الذى بقال له الاعوروه والدى ليس المسوح وساح
  فى الارض قال عدبن زيديذ كره
  وتسين رب المورنق اذ أشثرف يوما وللهدى تفكير
  مرمماله وحكترة ماعٍ • لك والجر معرضا والسدير
  فارءوى قلبه فقال وماغبتطة حىّ الى الممات بصير
  (خزق الخزق الطعر والحازق السنان يقال هوأمضى من خارق والمازق من السهام
  المقرطس وقد خزق السهم يخزق وقد خزقتهم بالنبل أى أصبتهم بها خسق انخاسق اغة
  فى الخازق ⁦(خفق)⁩ حفقت الراية تخدق وتحفق خذقا وخفقانا وكذلت التلب والسراب
  اذا اضطربا ويقال خفق البرق خفقا وخفقت الري خفانا وهو حفضها أى دوى جريها
  وأماقول رؤية • منتبه الاعلام لماع الخفق • فانماحركه للضرورة وخفق الرجل أى جرك
  رأسه وه وناعس وفى الحسديث كانت رؤسهم تخفق خفقة أوخفقتين وخفق الارض بنعله
  وكل ضرب بشى غريض خفق يقال خفقه بالسيف يحفق ويحفق اداضريه به ضربة خف.فة
  ولمخفقة الدرّة التى يضرب بها والمخفق السف العريض ويقال خفق الطائرأى طاروأخفو
  اذاضرب بجناحيه رأخفو الرجل بنويه أى لمع به وحفقت النجوم خفوقاعابت وأخفقت
  اذا توات للمغيب عن يعقرب يقال وردت خفوق النجسم أى وقت خفوق التر يا يجعله ظارفا
  وهو مصدر وأخفق الرجسل اذاغزا ولم يغتم وأخفق الصائداذارج-ع ولم يص-طد وطلب
  حاجة فأخفق ورجل خفاف القدم اذا كان صدر قد.ه، ويضا قال الرايز يصف رجلا
  خدلج الساقين خفاق القدم • قدافها الليل بواق حطم
  وامر أ: خفاقة الحشاأى خصة والحافقان أفقا المشرق والمغرب قال ابن السكيت
  لان الليل والنهاريخفة ان فيهماوذلاة خيفق أى واسعة يخفق فيها السراب وفرس خيذق أى
  قوله معرب أى من خور نكاه أى
  موضع الاكل كافى القاموس اه
