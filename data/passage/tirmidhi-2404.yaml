label:
  ar: "الترمذي 2404 — أبي يغترون أم علي يجترئون"
  en: "Tirmidhi 2404 — Is it Me they are deceived about, or against Me they are bold"
  ur: "ترمذی 2404 — کیا وہ مجھ سے دھوکا کھاتے ہیں یا مجھ پر جرأت کرتے ہیں"
text: "يخرج في آخر الزمان رجال يختلون الدنيا بالدين يلبسون للناس جلود الضأن من اللين ألسنتهم أحلى من السكر وقلوبهم قلوب الذئاب يقول الله عز وجل أبي يغترون أم على يجترئون فبي حلفت لأبعثن على أولئك منهم فتنة تدع الحليم منهم …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2404: أبي يغترون أم علي يجترئون. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2404: Is it Me they are deceived about, or against Me they are bold. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2404: کیا وہ مجھ سے دھوکا کھاتے ہیں یا مجھ پر جرأت کرتے ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
