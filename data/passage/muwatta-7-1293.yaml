label: { ar: "الموطأ 1293 — عمر بن عبد العزيز إلى عامله: كان النبي إذا بعث سرية يقول لهم اغزوا باسم الله، لا تغلوا، ولا تغدروا، ولا تمثلوا، ولا تقتلوا وليدا", en: "Muwatta 1293" }
text: "لَا نَغُلُوا، وَلَا تَغْدِرُوا، وَلَاَ تُمَثَّلُوا، وَلَا تَقْتُلُوا وَلِيدًا"
summary:
  ar: "يروي مالك أنه بلغه أن عمر بن عبد العزيز كتب إلى عامل من عماله أن رسول الله كان إذا بعث سرية يقول لهم اغزوا باسم الله في سبيل الله، تقاتلون من كفر بالله، لا تغلوا، ولا تغدروا، ولا تمثلوا، ولا تقتلوا وليدا، وأمره أن يقول ذلك لجيوشه وسراياه. {cite:muwatta-maruf-1997 p.577}"
