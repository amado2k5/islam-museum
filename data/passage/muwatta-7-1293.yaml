label: { ar: "الموطأ 1293 — عمر بن عبد العزيز إلى عامله: كان النبي إذا بعث سرية يقول لهم اغزوا باسم الله، لا تغلوا، ولا تغدروا، ولا تمثلوا، ولا تقتلوا وليدا", en: "Muwatta 1293", es: "Muwatta 1293", fr: "Muwatta 1293", ur: "موطا 1293", tr: "El-Muvatta 1293 — Ömer ibn Abdülaziz valisine: Peygamber bir askeri sefere gönderdiğinde onlara şöyle derdi: \"Allah adına ilerleyin, aşırıya kaçmayın, ihanet etmeyin, sakat bırakmayın ve çocuk öldürmeyin.\"", id: "Al-Muwatta 1293 — Umar ibn Abd al-Aziz kepada gubernurnya: Ketika Nabi mengirimkan ekspedisi militer, beliau akan berkata kepada mereka: \"Berangkatlah atas nama Allah, jangan berlebihan, jangan berkhianat, jangan melukai, dan jangan membunuh anak kecil.\"" }
text: "لَا نَغُلُوا، وَلَا تَغْدِرُوا، وَلَاَ تُمَثَّلُوا، وَلَا تَقْتُلُوا وَلِيدًا"
summary:
  ar: "يروي مالك أنه بلغه أن عمر بن عبد العزيز كتب إلى عامل من عماله أن رسول الله كان إذا بعث سرية يقول لهم اغزوا باسم الله في سبيل الله، تقاتلون من كفر بالله، لا تغلوا، ولا تغدروا، ولا تمثلوا، ولا تقتلوا وليدا، وأمره أن يقول ذلك لجيوشه وسراياه. {cite:muwatta-maruf-1997 p.577}"
  tr: "Malik, Ömer ibn Abdülaziz'in valilerinden birine yazdığı bir mektupta, Allah Resulü askeri bir sefere çıktığında onlara şöyle diyeceğini anlattığını aktarır: \"Allah adına ve Allah yolunda ilerleyin. Allah'a inanmayanlarla savaşın. Aşırıya kaçmayın, ihanet etmeyin, sakat bırakmayın ve çocuk öldürmeyin.\" Bunu ordularına ve seferlerine söylemesini emretti. {cite:muwatta-maruf-1997 s.577}"
  id: "Malik menceritakan bahwa ia mendengar Umar ibn Abd al-Aziz menulis kepada salah seorang gubernurnya bahwa ketika Rasulullah mengirimkan ekspedisi militer, beliau akan berkata kepada mereka: \"Berangkatlah dengan nama Allah dan di jalan Allah. Perangilah orang-orang yang tidak percaya kepada Allah. Jangan berlebihan, jangan berkhianat, jangan memutilasi, dan jangan membunuh anak kecil.\" Ia memerintahkan gubernurnya untuk menyampaikan hal ini kepada pasukan dan ekspedisinya. {cite:muwatta-maruf-1997 p.577}"
