text: "الب والزبير ابن العوام فقال : أدركا امرأة قد كتب معها حاطب بكتاب إلى قريش يحذرهم ما قد أجمعنا له في أمرهم . فخرجا حتى أدركاها بالحليفة حليفة ابن أبي أحمد فاستنزلاها فالتمسا في رحلها فلم يجدا شيئا فقال لها"
