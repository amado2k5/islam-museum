text: |-
  ٤٤٣
  •⁦(اما)⁩.
  لا أدر ويقال أيضا ألى يؤلى تألية اذاقصر وأبطأ قال أيوعمرو وسالى القاميم بن معن
  عن بت الربيع بن ضبع الفزارى
  وانَّ كاننى لنساءصدق * وما ألى بيّ وما أساوًا
  فقلت أبطوا ذقال ماتدع شبأ وهوفعلت من ألوت وتقول ألاه بألوه ألوا استطاعه قال
  العرجى
  اذا قاده السوّاس لا علكونه • وكان الذى يألون قولاله هلا
  أى يدتظيعون قال ابر السكيت قواهم لادريت ولا اتتليت هوافتعلت من قولك ما ألوت
  هذا أى ما استطعته أى ولا استطعت قال وبعضهم يقول لادريت ولا أتليت وقدذ كرناه
  فى تلا والا لاءالنعم واحدها ألا بالفتح وقد يكسرويكت باليا مثاة معى وأمعاء وآلى
  يؤلى ايلاءحلف وتألى واتتلى مثله فيه ويقال أيض اتقلى فى الامر اذا قصر والالية اليمين
  على فعيلة والمع ألايا قال الشاعر
  قليل الالا باحافظ ليمينه • وان سبقت منه الالية برت
  وكذلك الالوة والالوة والالوة فاما الالوّة بالتشديد فهو العود الذى يتبخريه وفيه لغتان ألوة
  وألوّة بضم الهمزة وقتهها قال الاصمعى هو فارسىّ معرب والمثلاة بالهمز على وزن المعلاة
  الحرقة التى تسكها المرأة عند النوح وتشير بها وابهع الما لى قال الشاعر يصف يابا
  كأنّ مصفيحاة فى ذراه • وأنواحا عليهن الماكى
  والالاه بالفتح شجرحسن المنظر مر الطعم قال الشاعر
  فانسكم ومدحكم بجيرا • أبالها كما امتدح الالاء
  والالية بالفتح ألية الشاة ولا تقل الية ولالية فاذاثنيت قلت أليان فلا تلحقه التاء وقال الراجز
  زتج- ألياه ارتجاج الوطب • وبائعه ألاء على فعال وكبش آلى على أفعل ونعجة ألياء والبهع
  ألى على فعل ويقال أيضا كيش أليان بالتهريك ونعمة أليانة وكباش اليانات ورجل آلى أى
  عظيم الالية وامرأة عجزاء ولا تقل ألياء وبعضهم يقوله وقد ألى الرجل بالكسريألى ألى
  وألية الحافر أيضامؤخره والالية اللحمة التى فى أصل الابهام والضرة التى تقابلها
  ⁦(اما)⁩ الامخلاف المحرّة والجمع اماء وآم وقال الشاعر
  محلة سوأهلاب الدهر أهلها * فلم يبق فيها غيرام خوالف
  وتجمع أيضاعلى اموان مثل اخوان وقال القتال• اذا ترامى بنو الاموان بالعاره وأصل
  امة أموة بالتحر يك لانه يجمع على آم وهو أفعل مثل أينق ولا تجمع فعلة بالتسكين على ذلك
  وتقول ما كنت أمة ولدأموت أموة والنسبة اليها أمويّ بالفتح وتصغيرها أمية وأمية
  أيضاقبيسلة من قريس والنسبة اليها أموى بالضم وربماقصوا ومنهسم من يقول أمبي
  فيجمع بين أربع يا آت وهو فى الاصل اسم رحل وهما أميتان الاكبر والاصغر ابناعبدشمس
  بن عبد مناف أولاد علة فن أمية الكبرى أبو سفيان بن حرب والعنابس والاعياص وأمية
  صقرى هم ثلاثة اخوة لاتم اسمها عيلة يقال لهم العبلات بالتحريك ويقال استأم أمة غه
  أمتك يتسكين الهمز أى اتخذ وتأميت أمة وأمت الستورتأموأ ما أى صاحت وكذلت
  ماءت تمومواء وامًا بالكسر والتشديد حرف عطف بنز لة أوفى جيع أحكامها الافى وجه
  واحسد وهو أنك تنتدى فى أومتيقنا ثم يدركك الشك واما تبتدى بح اشاكاولا بد من
  ر رما
