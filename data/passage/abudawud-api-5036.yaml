label: { ar: "سنن أبي داود 5036 — الأب والأبوة", en: "Sunan Abi Dawud 5036 — the father and fatherhood", ur: "سنن ابی داؤد 5036 — باپ اور والدیت", es: "Sunan Abi Dawud 5036 — El padre y la paternidad" }
text: "… بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا مَالِكُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ السَّلاَمِ بْنُ حَرْبٍ، عَنْ يَزِيدَ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ يَحْيَى بْنِ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أُمِّهِ، حُمَيْدَةَ أَوْ عُبَيْدَةَ بِنْتِ عُبَيْدِ بْنِ رِفَاعَةَ الزُّرَقِيِّ عَنْ أَبِيهَا، عَنِ النَّبِيِّ قَالَ \" تُشَمِّتُ الْعَاطِسَ ثَلاَثًا فَإِنْ شِئْتَ أَنْ تُشَمِّتَهُ فَشَمِّتْهُ وَإِنْ شِئْتَ فَكُفَّ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5036، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5036 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5036، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5036 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
