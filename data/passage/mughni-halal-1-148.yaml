text: "لا يجوز للمرأة عطية من مالها... لا يحتش حشيشها لا يحج بعد العام مشرك لا يحرم الحرام الحلال لا يحرم من الرضاع، إلا ما فتق الأمعاء، وكان قبل الفطام لا يحلبن أحد ماشية أحد إلا بإذنه،... لئن أدركتهم، لأقتلنهم قتل …"
summary:
