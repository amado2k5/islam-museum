text: "… بلاد الشأم، فقبره بها. وقدم بتركته ومتاعه أبو رُهم بن عبد العزى بن أبى قيس ا من بنى عامر بن لؤى. وكان لهاشم يوم مات خمس وعشرون سنة. وذلك الثبت. ويقال عشرون سنة. وقال مطرود يرثيه : مرات تور عليع …"
