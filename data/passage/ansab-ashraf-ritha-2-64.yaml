  tr: "\"Soyluların Şecere Kayıtları\" adlı eserin 2. cildinin 64. sayfasından, ölen kişi için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Silsilah Para Bangsawan,\" Volume 2, halaman 64, berisi elegi dan eulogi untuk almarhum; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
