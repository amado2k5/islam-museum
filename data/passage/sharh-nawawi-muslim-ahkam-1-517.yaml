text: "… يأمرهم بعزيمة معناه لا يأمرهم أمر إيجاب وتحتيم بل أمر ندب وترغيب، ثم فسره بقوله فيقول من قام رمضان وهذه الصيغة تقتضي الترغيب والندب دون الإيجاب، واجتمعت الأمة على أن قيام رمضان ليس بواجب بل هو مندوب. قوله: فتوفي رسول …"
