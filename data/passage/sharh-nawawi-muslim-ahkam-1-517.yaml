text: "… يأمرهم بعزيمة معناه لا يأمرهم أمر إيجاب وتحتيم بل أمر ندب وترغيب، ثم فسره بقوله فيقول من قام رمضان وهذه الصيغة تقتضي الترغيب والندب دون الإيجاب، واجتمعت الأمة على أن قيام رمضان ليس بواجب بل هو مندوب. قوله: فتوفي رسول …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 517، يرد فيه ذكر الواجب، والوجوب، والمندوب، وما ليس بواجب، والترغيب في العمل، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 517, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), what is said not to be obligatory, encouragement to an act, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 517 کا اقتباس جس میں واجب، وجوب، مندوب، جو واجب نہیں، عمل کی ترغیب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on Sahih Muslim de al-Nawawi, volume numérisé 1, p. 517, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mandub), ce qui est dit non obligatoire, l'encouragement à un acte, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on Sahih Muslim de al-Nawawi, volumen digitalizado 1, p. 517, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mandub), lo que se dice que no es obligatorio, el estímulo a un acto, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Bu metin, El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 517. sayfasından, farz, müstehap ve farz olmayan amelleri, ayrıca iyi ameller ve müstehap amelleri yapmaya teşviki ele alan bir alıntıdır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehap amelleri, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari komentar Al-Nawawi tentang Sahih Muslim, Volume 1, halaman 517, yang membahas amalan wajib, amalan anjuran, dan amalan sunnah, serta anjuran untuk melakukan amal kebaikan dan amalan anjuran. Cuplikan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan cuplikan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
