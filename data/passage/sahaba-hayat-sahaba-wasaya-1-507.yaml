text: "… فقالوا: اللّه ورسوله أعلم، فقال : إنما مثل أحدكم ومثل ماله : أهله وولده و عمله كمثل رجل له ثلاثة إخوة فلما حضرته الوفاة دعا بعض إخوته فقال: إنه قد نزل بى من الأمر ما ترى فالى عندك ومالى لديك؟ …"
