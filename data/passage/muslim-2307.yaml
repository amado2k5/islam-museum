label: { ar: "مسلم 2307 — كان أشجع الناس؛ قصة فزعة المدينة", en: "Muslim 2307 — The bravest of people; the night fright of Medina" }
text: "قال أنس: كان رسول الله أحسن الناس وأجود الناس وأشجع الناس، ولقد فزع أهل المدينة ذات ليلة فانطلق ناس قبل الصوت فتلقاهم رسول الله راجعاً وقد سبقهم إلى الصوت، وهو على فرس لأبي طلحة عرى في عنقه السيف وهو يقول: لم تراعوا، لم تراعوا؛ وجدناه بحراً — أو إنه لبحر"
summary:
  ar: "رواية أنس بن مالك في باب شجاعة النبي من كتاب الفضائل في صحيح مسلم؛ سبق الناس إلى مصدر الفزع على فرس أبي طلحة والسيف في عنقه — مشهد الشجاعة الأشهر في الدواوين."
