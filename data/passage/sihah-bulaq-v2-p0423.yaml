text: |-
  وقوله المافر الظاهر لذى الحافر
  وعبارة القاموس الجفلة بمنزلة
  الشخة للفيل والبغال والحيراه
  ⁦(٢ )⁩ ى نسخة أول البيت
  كسوت العلافيات هوجا كانما
  ٣ ف يَسِمةُ وَيَادة المقعَرِي
  وضة الديت
  ولم يكن يخلديا المواعد!!
  الجل الجعل وحله أى صرعه وعله شتد لله بالغة قال الكميت
  ومال أبو الشه:ا أشعت داميا * وان أبا جمل قبل مجمل
  ورعما قالواجهله اذاصر عه والميم زائدة ⁦(بحدل)⁩ الججدل الحادر السمين وجهدله أى سرعه
  جفل الحفل الجيش ورجل بحفل أى عظيم القسدر وال:لة المافر كالشفة للانسان
  ويعفله أى صرعه ورماءور بما فالواجعفله وتجحفل القوم أن اجتمعوا والخنفل الغليظ
  الشفة بزيادة النون ⁦(جدل)⁩ الجدل العضووابهع الجدول والاجدل الصقر والإدل
  القصدومنه قول الكميت ٢ مجادل شداراصفون اجتدالها * وقال الاغشى
  فى مجدل شيد بنبانه • يزلة عنه ظفر الطائر
  والجدال البلح اذا اخضرّ واستدار قبل أن يشتدبلفة أهل غجد الواحدة جد الة وقال يصف
  وسارت الى يبرين خساف أصحبت • يخز على أيدى السقاة جدالها
  والجدالة الارض ومنه قول الراجز
  قد أركب الآلة بعدالا"لة • وأنزك العابز بالجدالة
  بقال طعنه فيته أى رماه بالارض فانجدل أى سقط وجادل أى خاصمه مجادلة وجدالا
  والاسم الجدل وهوشده الخصومة وجدلت الحبل أجده جدلا أى قتلته فتلا محكا ومنه
  جارية مجدولة الخلق حسنة الجدل والجدول القضيف لا من هزال وغلام جادل متتد وجدل
  الحبة فى-فبلة قوى قال الاصمعى الجادل من ولد الناقة فوق الراشح وهو الذى قوى وصنى
  مع أمّه والجديل الزمام الجدول من أدم ومنه قول أمرى القيس
  وكشح الطيف كالجديل مخصر • وساق كابوب الدق المذلل
  وربماسمى الوشاح جديلا قال عيدالله بن عملان النهدىّ
  كأن دمفا أوفروع نمامة • على متنهاحيث استقزجد يلها
  وجديل وشدم فلان من الابل كانا للنعمان بن المنذر والجديلة الشاكلة والجديلة القبيله
  والناسجية وجديلة ى من طيء و«واسم أمهم وهى جديلة بنت سبيع بن عمرومن حيراليها
  يسبون والنسبة اليهم جدلىّ مثل "قق• والجدلا« من الدروع المنوجة وكذلك الجدولة
  وهى المكمة والإندل الجارة ومنه سمى الرجل والجندل:فتح الذون وكسر الدال الموضع
  فيه جارة والجدول التهر الصغير ذل لجذل واحد الاجذال وهى أصول المطب
  العظام ومنه قول الحباب بن المنذر أناجذ يلها الصكل والجاذل المنتصب مكانه لا يبرح شبه
  بالجذل الذى ينصب فى المعاطن اتعتك بد الابل الجرب قال الشاءر ٣
  لاقت على الماهجذيلا واتدا• ويقال فلان جذل مال اذا كان رفيق ابسياسته والجذل
  بالتصريك الفرح وقد جذل بالكسر يجذل فهو حذلان وأجذه غيره أى أفرحه واجتذل
  أى ابتهج رل الجرل بالتصرين الجارة وكذاك الحرول والواوللالحاق بجعغر وحرول
  لقب الخطيقة العبسىَ الشاعر قال ال.كميت
  وماضرتها أن كعبانوى • وتوزمن بوذه جرول
  وأرض جرة ذات براول ومكان جرل والمع الاجرال ومنه أول الشاءو
  من
