label: { ar: "الموطأ 572 — مرسل طلحة بن عبيد الله بن كريز: أفضل الدعاء دعاء يوم عرفة", en: "Muwatta 572", es: "Muwatta 572", fr: "Muwatta 572", ur: "موطا 572", tr: "El-Muvatta 572 — Talha ibn Ubeyd Allah ibn Kurayz'dan rivayet edilen mürsel bir hadis: En faziletli dua, Arafat Günü duasıdır.", id: "Al-Muwatta 572 — Hadits mursal dari Talha ibn Ubayd Allah ibn Kurayz: Doa terbaik adalah doa pada hari Arafah." }
text: "أفضل الدعاء دعاء يوم عرفة، وأفضل ما قلت أنا والنبيون من قبلي: لا إله إلا الله وحده لا شريك له"
summary:
  ar: "يرويه مالك عن زياد بن أبي زياد عن طلحة بن عبيد الله بن كريز مرسلاً، أن النبي قال إن أفضل الدعاء دعاء يوم عرفة، وأفضل ما قاله هو والنبيون من قبله: لا إله إلا الله وحده لا شريك له. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر ⁦(التمهيد 6/39)⁩ أنه لا خلاف عن مالك في إرساله، وأنه جاء مسنداً من حديث علي بن أبي طالب عن طريق دينار أبي عمرو وليس ممن يحتج به، ومن حديث عبد الله بن عمرو بن العاص من حديث عمرو بن شعيب، ويضيف أن حديث عبد الله بن عمرو عند أحمد (2/210) والترمذي (3585) وقال: غريب من هذا الوجه، وأن الحديث سيأتي في كتاب الحج. {cite:muwatta-maruf-1997 p.295}"
  tr: "Malik, Ziyad ibn Abi Ziyad'dan, o da Talha ibn Ubayd Allah ibn Kurayz'dan mursal bir hadiste rivayet ederek, Peygamberimizin şöyle buyurduğunu bildirmiştir: “En faziletli dua, Arafat Günü duasıdır ve Peygamberimizin ve ondan önceki peygamberlerin söylediği en güzel söz şudur: ‘Allah'tan başka ilah yoktur, O tektir, ortağı yoktur.’” Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve İbn Abd al-Barr'ın (el-Tamhid 6/39) Malik'in rivayetinin mursal statüsü konusunda ihtilaf bulunmadığını ve Ali ibn Abi Talib'den Dinar Abi Amr aracılığıyla (ki kendisi güvenilir bir ravi olarak kabul edilmez) ve Abdullah ibn Amr ibn al-As'tan Amr ibn Şuayb aracılığıyla musnad bir hadis olarak geldiğini söylediğini aktarmaktadır. Abdullah ibn Amr hadisinin Ahmed (2/210) ve Tirmizi'de (3585) bulunduğunu, Tirmizi'nin \"Bu isnad zincirinden garabittir\" dediğini ve hadisin Hac Kitabı'nda zikredileceğini ekliyor. {cite:muwatta-maruf-1997 s.295}"
  id: "Malik meriwayatkan hadits ini dari Ziyad ibn Abi Ziyad, yang juga dari Talhah ibn Ubayd Allah ibn Kurayz, dalam hadits mursal, bahwa Nabi bersabda: “Doa terbaik adalah doa di Arafah, dan ucapan terbaik yang beliau dan para nabi sebelum beliau sampaikan adalah: ‘Tidak ada Tuhan selain Allah, Yang Maha Esa, tanpa sekutu.’” Peneliti menyebutkan bahwa Abu Mus’ab dan Suwayd meriwayatkan hadits ini dari Malik, dan mengutip Ibnu Abd al-Barr (al-Tamhid 6/39) yang mengatakan bahwa tidak ada perbedaan pendapat mengenai otoritas Malik terkait status mursal hadits ini, dan bahwa hadits ini datang dengan hadits musnad dari Ali ibn Abi Talib melalui Dinar Abi Amr, yang tidak dianggap sebagai perawi yang terpercaya, dan dari Abdullah ibn Amr ibn al-As melalui Amr ibn Shu’ayb. Ia menambahkan bahwa hadits Abdullah ibn Amr terdapat dalam Ahmad (2/210) dan al-Tirmidhi (3585), yang mengatakan: “Hadits ini gharib (jarang) dari sanad ini,” dan bahwa hadits ini akan disebutkan dalam Kitab Haji. {cite:muwatta-maruf-1997 p.295}"
