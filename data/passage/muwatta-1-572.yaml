label: { ar: "الموطأ 572 — مرسل طلحة بن عبيد الله بن كريز: أفضل الدعاء دعاء يوم عرفة", en: "Muwatta 572" }
text: "أفضل الدعاء دعاء يوم عرفة، وأفضل ما قلت أنا والنبيون من قبلي: لا إله إلا الله وحده لا شريك له"
summary:
  ar: "يرويه مالك عن زياد بن أبي زياد عن طلحة بن عبيد الله بن كريز مرسلاً، أن النبي قال إن أفضل الدعاء دعاء يوم عرفة، وأفضل ما قاله هو والنبيون من قبله: لا إله إلا الله وحده لا شريك له. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 6/39) أنه لا خلاف عن مالك في إرساله، وأنه جاء مسنداً من حديث علي بن أبي طالب عن طريق دينار أبي عمرو وليس ممن يحتج به، ومن حديث عبد الله بن عمرو بن العاص من حديث عمرو بن شعيب، ويضيف أن حديث عبد الله بن عمرو عند أحمد (2/210) والترمذي (3585) وقال: غريب من هذا الوجه، وأن الحديث سيأتي في كتاب الحج. {cite:muwatta-maruf-1997 p.295}"
