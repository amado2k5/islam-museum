label: { ar: "الموطأ 1468 — مالك: الكلالة على وجهين، الآية في أول سورة النساء حيث لا يرث الإخوة للأم مع ولد ولا والد، والآية في آخرها حيث يرث الإخوة عصبة مع الجد", en: "Muwatta 1468" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الكلالة على وجهين: فأما الآية التي في أول سورة النساء، فهذه الكلالة التي لا يرث فيها الإخوة للأم حتى لا يكون ولد ولا والد. وأما الآية التي في آخر سورة النساء، فهذه الكلالة التي يكون فيها الإخوة عصبة إذا لم يكن ولد، فيرثون مع الجد في الكلالة، لأن الجد أولى بالميراث منهم، فهو يرث مع ذكور ولد المتوفى السدس. ويعقب مالك بأن الجد حجب الإخوة للأم ومنعهم مكانه الميراث، فهو أولى بالذي كان لهم. ويذكر المحقق أن يحيى رواه مرسلا، وتابعه أكثر الرواة على إرساله، ووصله القعنبي وابن القاسم على اختلاف. {cite:muwatta-maruf-1997 p.17}"
