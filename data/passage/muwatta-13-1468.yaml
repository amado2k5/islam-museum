label: { ar: "الموطأ 1468 — مالك: الكلالة على وجهين، الآية في أول سورة النساء حيث لا يرث الإخوة للأم مع ولد ولا والد، والآية في آخرها حيث يرث الإخوة عصبة مع الجد", en: "Muwatta 1468", es: "Muwatta 1468", fr: "Muwatta 1468", ur: "موطا 1468", tr: "El-Muvatta 1468 — Malik: Doğrudan mirasçı (kalalah) bulunmadığı durumlarda miras meselesinin iki yorumu vardır. Nisa Suresi'nin başındaki ayet, çocuk veya ebeveyn varsa anne tarafından kardeşlerin mirasçı olamayacağını belirtir. Nisa Suresi'nin sonundaki ayet ise dede varsa anne tarafından kardeşlerin kalan mirasçı olarak miras alacağını belirtir.", id: "Al-Muwatta 1468 — Malik: Masalah warisan tanpa ahli waris langsung (kalalah) mempunyai dua penafsiran. Ayat di awal Surat An-Nisa' menyatakan bahwa saudara kandung dari pihak ibu tidak berhak mewarisi jika ada anak atau orang tua. Ayat di akhir Surat An-Nisa' menyatakan bahwa saudara kandung dari pihak ibu berhak mewarisi sebagai ahli waris sisa jika ada kakek." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الكلالة على وجهين: فأما الآية التي في أول سورة النساء، فهذه الكلالة التي لا يرث فيها الإخوة للأم حتى لا يكون ولد ولا والد. وأما الآية التي في آخر سورة النساء، فهذه الكلالة التي يكون فيها الإخوة عصبة إذا لم يكن ولد، فيرثون مع الجد في الكلالة، لأن الجد أولى بالميراث منهم، فهو يرث مع ذكور ولد المتوفى السدس. ويعقب مالك بأن الجد حجب الإخوة للأم ومنعهم مكانه الميراث، فهو أولى بالذي كان لهم. ويذكر المحقق أن يحيى رواه مرسلا، وتابعه أكثر الرواة على إرساله، ووصله القعنبي وابن القاسم على اختلاف. {cite:muwatta-maruf-1997 p.17}"
  tr: "Malik, aralarındaki görüş birliğinin, kalalah'ın (doğrudan varis olmaksızın miras) iki türü olduğu yönünde olduğunu belirtiyor: Nisa Suresi'nin başındaki ayet, çocuk veya ebeveyn yoksa anne tarafından kardeşlerin miras alamadığı kalalah'ı ifade eder. Nisa Suresi'nin sonundaki ayet ise, çocuk yoksa kardeşlerin dede ile birlikte miras aldığı kalalah'ı ifade eder; çünkü dedenin mirasa onlardan daha güçlü bir hakkı vardır. Dede, ölenin erkek çocuklarıyla birlikte mirasın altıda birini alır. Malik, dedenin anne tarafından kardeşleri dışladığını ve onların kendi yerine miras almalarını engellediğini, bu nedenle onlarınkine daha güçlü bir hak iddia ettiğini ekliyor. Araştırmacı, Yahya'nın bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak rivayet ettiğini ve çoğu ravi'nin de bu mursal rivayeti izlediğini belirtiyor. Al-Qa'nabi ve İbn al-Qasim ise bazı farklılıklarla da olsa bunu mursal olarak rivayet etmişlerdir. {cite:muwatta-maruf-1997 s.17}"
  id: "Malik menyatakan bahwa konsensus di antara mereka adalah bahwa ada dua jenis kalalah (warisan tanpa ahli waris langsung): Ayat di awal Surah An-Nisa merujuk pada kalalah di mana saudara kandung dari pihak ibu tidak mewarisi jika tidak ada anak maupun orang tua. Ayat di akhir Surah An-Nisa merujuk pada kalalah di mana saudara kandung menjadi agnat jika tidak ada anak, mewarisi bersama kakek dalam kasus kalalah, karena kakek memiliki hak waris yang lebih kuat daripada mereka. Ia mewarisi seperenam bagian bersama dengan anak laki-laki dari almarhum. Malik menambahkan bahwa kakek mengecualikan saudara kandung dari pihak ibu dan mencegah mereka mewarisi di tempatnya, sehingga ia memiliki hak waris yang lebih kuat atas apa yang menjadi milik mereka. Peneliti menyebutkan bahwa Yahya meriwayatkannya sebagai mursal (hadits dengan mata rantai yang hilang dalam riwayat), dan sebagian besar perawi mengikutinya dalam riwayat mursal ini. Al-Qa'nabi dan Ibn al-Qasim menghubungkannya, meskipun dengan beberapa perbedaan. {cite:muwatta-maruf-1997 p.17}"
