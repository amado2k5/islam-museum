label:
  ar: "البخاري 6491 — إن الله كتب الحسنات والسيئات"
  en: "Bukhari 6491 — God has written good deeds and bad deeds"
  ur: "بخاری 6491 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
text: "إن الله كتب الحسنات والسيئات، ثم بين ذلك فمن هم بحسنة فلم يعملها كتبها الله له عنده حسنة كاملة، فإن هو هم بها فعملها كتبها الله له عنده عشر حسنات إلى سبعمائة ضعف إلى أضعاف كثيرة، ومن هم بسيئة فلم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6491: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6491: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6491: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
