label:
  ar: "البخاري 6491 — إن الله كتب الحسنات والسيئات"
  en: "Bukhari 6491 — God has written good deeds and bad deeds"
  ur: "بخاری 6491 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
  es: "Bukhari 6491 — Dios ha escrito las buenas y las malas obras."
  fr: "Bukhari 6491 — Dieu a inscrit les bonnes et les mauvaises actions"
  tr: "Buhari 6491 — Allah iyiliği ve kötülüğü takdir etmiştir."
  id: "Al-Bukhari 6491 — Allah telah menetapkan amal kebaikan dan amal keburukan."
text: "إن الله كتب الحسنات والسيئات، ثم بين ذلك فمن هم بحسنة فلم يعملها كتبها الله له عنده حسنة كاملة، فإن هو هم بها فعملها كتبها الله له عنده عشر حسنات إلى سبعمائة ضعف إلى أضعاف كثيرة، ومن هم بسيئة فلم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6491: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6491: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6491: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 6491: Dios ha escrito las buenas y las malas acciones. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 6491: Dieu a prescrit les bonnes et les mauvaises actions. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 6491 numaralı hadis-i kudsi şöyledir: \"Allah iyilikleri ve kötülükleri takdir etmiştir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 6491: “Allah telah menetapkan amal kebaikan dan amal keburukan.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta."
