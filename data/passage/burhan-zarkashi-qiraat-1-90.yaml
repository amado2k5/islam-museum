label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 90 — الأحرف السبعة، جمع القرآن والمصاحف", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 90 — the seven ahruf; the collection of the Qur'an and the codices", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 90 — سبعہ احرف، جمعِ قرآن اور مصاحف", es: "Al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, escaneo del volumen 1, pág. 90: los siete ahruf; la colección del Corán y los códices.", fr: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 90 — les sept ahruf; la collection du Coran et des codex", tr: "El-Zarkashi'nin \"El-Burhan fi Ulum al-Qur'an\" adlı eserinin resimli 1. cildinin 90. sayfası — Yedi Mektup, Kur'an ve Kodekslerin Derlemesi", id: "Al-Burhan fi Ulum al-Qur'an karya al-Zarkashi, Jilid Bergambar 1, hlm. 90 — Tujuh Huruf, Kompilasi Al-Qur'an dan Kodeks" }
text: "… كان يقف على رؤوس الآى للتوقيف، ونزول البسملة مع السور التى فى الأحرف السبعة، وسبب خلاف الكلمة أن لها حقيقة ومجازًا ورسمًا واعتبار كل منها جائز. ويشير إلى أنصافه بالكلمات والآيات وعدد السور، وإلى ترتيب وضع السور فى المصحف وهو …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 90، يذكر الأحرف السبعة، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 90, that mentions the seven ahruf, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 90 کا اقتباس جس میں سبعہ احرف، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen 1, pág. 90, que menciona los siete ahruf, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre d'al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an (tome 1, p. 90), mentionnant les sept ahruf, le recueil du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Zarkashi'nin \"El-Burhan fi Ulum el-Kur'an\" adlı eserinin 1. cildinin 90. sayfasından, Kur'an'ın yedi okunuş şeklini, derlenmesini ve el yazmalarını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 1, halaman 90, yang menyebutkan tujuh cara pembacaan, penyusunan Al-Qur'an, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
