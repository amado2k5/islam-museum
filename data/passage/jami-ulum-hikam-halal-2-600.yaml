text: "… عنه عمرُ وطائفةٌ مِن الصَّحابة، ورخَّص فيها الأكثرون، واستدلوا له بأحاديث من السُّنَّة. ومنها : كتابة تفسير الحديث والقرآن، كرهه قومٌ من العُلماء، ورخَّصَ فيها كثيرٌ منهم. وكذلك اختلافُهم في كتابة الرَّأي في الحلال والحرام ونحوه، وفي توسِعَةِ الكلام في …"
