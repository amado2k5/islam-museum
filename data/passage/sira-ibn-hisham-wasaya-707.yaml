text: "… مربع بن قيظي المنافق نزول رسول اللّٰه والي بالشعب وتعبئته للقتال وصاة رسول اللّٰه كَيم للرماة بعض من أجازه رسول اللّٰه وَلِ فيِ وبعض من رده لصغر سنه أبو دجانة وسيف رسول الله لَالِلقم أبو عامر الفاسق أبو سفيان وامرأته …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 707، يذكر وصية أو عهد أخير، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 707, that mentions a testament or parting counsel, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 707 کا اقتباس جس میں وصیت یا آخری نصیحت، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de la Sira de Ibn Hisham, pág. 707, que menciona un testamento o consejo de despedida, una reliquia conservada tras su dueño; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de la Sira d'Ibn Hisham, p. 707, mentionnant un testament ou des dernières volontés, une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire des Testaments Browser."
  tr: "İbn Hişam'ın Peygamber biyografisinden, 707. sayfada, bir vasiyetname veya son miras belgesi ve korunmuş kutsal emanetler arasından bir kalıntıdan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi Nabi karya Ibnu Hisham, halaman 707, menyebutkan wasiat atau surat wasiat terakhir, dan sebuah relik dari antara relik-relik yang terpelihara; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, relik, dan makam suci."
