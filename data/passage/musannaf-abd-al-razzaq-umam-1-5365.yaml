text: "… حدّ، وإن قذف نصرانيّ نصرانية لا يضرب بعضهم لبعض إن تخاصموا إلى أَهل الإسلام، كما لا يضرب لهم مسلم إذا قذفهم، كذلك لا يضرب بعضهم لبعض. باب هل يقاتل أَهل الشرك حتي يومنوا من غير أَهل الكتاب ؟ وتوّخذ منهم …"
