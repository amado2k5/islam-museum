text: "… - ما يجب فى جراح العبد - الحديث : جع السنة وأنه لا يحيط بها فرد واحد، وأنه إذا جمع علم عامة أهل العلم بها ألى على السنن، وجوب العمل بالحديث وجوب طاعة الرسول، وأنها من طاعة اللّٰه، وأن الحديث …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 780، يرد فيه ذكر طاعة الله ورسوله، والوجوب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 780, whose wording mentions obedience to God and His Messenger, obligation (wujub), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 780 کا اقتباس جس میں اللہ اور اس کے رسول کی اطاعت، وجوب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 780, dont le texte mentionne l'obéissance à Dieu et à Son Messager, l'obligation (wujub), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 780, cuyo texto menciona la obediencia a Dios y a Su Mensajero, la obligatoriedad (wujub), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 780. sayfasından bir alıntı, Allah'a ve Resulüne itaati, itaatin farzını ve fiilini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 780, menyebutkan ketaatan kepada Allah dan Rasul-Nya, serta kewajiban dan perbuatan ketaatan itu sendiri. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
