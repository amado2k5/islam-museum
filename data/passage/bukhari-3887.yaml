label:
  ar: "البخاري 3887 — المعراج وفرض الصلوات: أمضيت فريضتي وخففت عن عبادي"
  en: "Bukhari 3887 — The Ascension and the prayers: I have upheld My command and lightened it for My servants"
  ur: "بخاری 3887 — معراج اور نمازوں کی فرضیت: میں نے اپنا فریضہ نافذ کیا اور بندوں پر تخفیف کی"
text: "بينما أنا في الحطيم وربما قال في الحجر مضطجعا، إذ أتاني آت فقد قال وسمعته يقول فشق ما بين هذه إلى هذه فقلت للجارود وهو إلى جنبي ما يعني به قال من ثغرة نحره إلى شعرته، وسمعته يقول من قصه …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3887: المعراج وفرض الصلوات: أمضيت فريضتي وخففت عن عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3887: The Ascension and the prayers: I have upheld My command and lightened it for My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3887: معراج اور نمازوں کی فرضیت: میں نے اپنا فریضہ نافذ کیا اور بندوں پر تخفیف کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
