text: "… كثيراً من أهل أوجاع المفاصل الباردة والأمزجة الرطبة، لا ينتفعون بالاسهال الكثير شرباً وحقنة، فإذا عولي بالمدرّات عوفوا. ومن الأبدان النحيفة، أبدان لا تحتمل الاسهالات والادرارات الكثيرة، ويتولّد منها فيهم احتراق الدم، فليراع جميع ذلك. والترياق أيضاً نافع في البارد، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 827، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والسم والترياق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 827, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, poison and antidote; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 827 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، زہر اور تریاق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
