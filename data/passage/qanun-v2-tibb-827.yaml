text: "… كثيراً من أهل أوجاع المفاصل الباردة والأمزجة الرطبة، لا ينتفعون بالاسهال الكثير شرباً وحقنة، فإذا عولي بالمدرّات عوفوا. ومن الأبدان النحيفة، أبدان لا تحتمل الاسهالات والادرارات الكثيرة، ويتولّد منها فيهم احتراق الدم، فليراع جميع ذلك. والترياق أيضاً نافع في البارد، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 827، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والسم والترياق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 827, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, poison and antidote; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 827 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، زہر اور تریاق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 827, que menciona el dolor, enfermedades específicas, el hospital y la práctica médica, los órganos del cuerpo, el veneno y el antídoto; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 827, qui mentionne la douleur, les maladies nommées, l'hôpital et l'art médical, les organes du corps, le poison et l'antidote; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 827. sayfasından bir bölüm; ağrı, hastalıkların isimleri, hastane ve tıp mesleği, vücut organları, zehir ve panzehirden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 827, yang menyebutkan rasa sakit, nama-nama penyakit, rumah sakit dan profesi medis, organ tubuh, racun dan penawarnya; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
