text: "أن الحسن بن على بن ابي رافع حدته ان ابارافع آخبره انه اقبل بكتاب من قريش الى رسول الله صلى الله عليه وآله وسلم قال فلما اديت الكتاب التي في قابى الاسلام فقات يارسول الله انى والله لا ارجع اليهم"
