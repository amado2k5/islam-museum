text: "حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، حَدَّثَنَا شُعْبَةُ، عَنْ عَمْرِو بْنِ مُرَّةَ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ أَبِي أَوْفَى ـ وَكَانَ مِنْ أَصْحَابِ الشَّجَرَةِ ـ قَالَ كَانَ النَّبِيُّ إِذَا أَتَاهُ قَوْمٌ بِصَدَقَةٍ قَالَ \" اللَّهُمَّ صَلِّ عَلَيْهِمْ \". فَأَتَاهُ أَبِي بِصَدَقَتِهِ فَقَالَ \" اللَّهُمَّ صَلِّ عَلَى آلِ أَبِي أَوْفَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4166، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4166 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4166، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
