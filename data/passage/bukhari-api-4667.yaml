label: { ar: "صحيح البخاري 4667 — الأب والأبوة", en: "Sahih al-Bukhari 4667 — the father and fatherhood", ur: "صحیح بخاری 4667 — باپ اور والدیت" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ أَبِيهِ، عَنِ ابْنِ أَبِي نُعْمٍ، عَنْ أَبِي سَعِيد ـ قَالَ بُعِثَ إِلَى النَّبِيِّ بِشَىْءٍ، فَقَسَمَهُ بَيْنَ أَرْبَعَةٍ وَقَالَ \" أَتَأَلَّفُهُمْ \". فَقَالَ رَجُلٌ مَا عَدَلْتَ. فَقَالَ \" يَخْرُجُ مِنْ ضِئْضِئِ هَذَا قَوْمٌ يَمْرُقُونَ مِنَ الدِّينِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4667، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4667 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4667، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
