label: { ar: "نوادر جحا الكبرى، ص 31 — «الحكم عن خبرة»", en: "Nawadir Juha al-Kubra, p. 31 — 'Judging from Experience'", ur: "نوادر جحا الکبریٰ، ص 31 — «تجربے کی بنیاد پر فیصلہ»", fr: "Nawadir Juha al-Kubra, p. 31 — « Un jugement fondé sur l'expérience »", es: "Nawadir Juha al-Kubra, p. 31 — «Un fallo basado en la experiencia»" }
text: "… الحكم عن خبرة تولى القضاءَ، فجاءَهُ يوماً رجلٌ يدَّعي على آخرَ أنَّهُ عضَّهُ في أُذنِهِ، فدافع المُدَّعى عليه قائلاً بأنه هو الذي عَضِّ أذنَ نفسِه. قال جحا: إصبرا قليلاً حتى أعودَ إليكما فأحكمَ بينكما. ثم دخل إلى دارِهِ وأخذ يُجَرِّبُ …"
summary:
  ar: "كان جحا قاضيًا فاختبر دعوى أن رجلًا عضّ أذن آخر بأن حاول عضّ أذنه هو، فسقط وجرح رأسه، ثم حكم بأن الرجل يستطيع عضّ أذنه. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  en: "As judge, Juha tests a claim that a man bit another's ear by trying to bite his own, falls and cuts his head, and then rules that a man can bite his own ear. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  ur: "قاضی کی حیثیت سے جحا نے اس دعوے کو آزمایا کہ ایک آدمی نے دوسرے کا کان کاٹا ہے، اور اس کے لیے اپنا ہی کان کاٹنے کی کوشش کی، گر پڑا اور سر زخمی کر لیا، پھر فیصلہ دیا کہ آدمی اپنا کان کاٹ سکتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  fr: "Juha, juge, met à l'épreuve l'affirmation qu'un homme a mordu l'oreille d'un autre en essayant de mordre sa propre oreille ; il tombe et se blesse la tête, puis juge qu'un homme peut se mordre l'oreille. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
  es: "Como juez, Juha pone a prueba la afirmación de que un hombre mordió la oreja de otro intentando morderse la suya; se cae y se hiere la cabeza, y luego falla que un hombre puede morderse su propia oreja. {cite:juha-nawadir-kubra-djuwaydi p. 31}"
