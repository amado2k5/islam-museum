text: "… الظلم، فإن اللّٰه كَرِهَ الظلم ونهى عنه، فقال: أَلَا هود:، ويُبَشَرَ الناسَ بالجنةِ وبَعملها، وينذرَ الناسَ النارَ وعملها، ويَسْتَألِفَ لَعْنَةُ اللَّهِ عَلَى الظَّٰلِمِينَ الناسَ حتى يَفْقَهُوا في الدينِ، وَيُعلِّمَ الناسَ مَعَالِمَ الْحَجِّ وسنِتَهُ وفريضتَهُ وما أَمَرَ اللّٰه به، والحجّ الأكبرُ …"
