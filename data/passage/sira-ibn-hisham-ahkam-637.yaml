text: "… الظلم، فإن اللّٰه كَرِهَ الظلم ونهى عنه، فقال: أَلَا هود:، ويُبَشَرَ الناسَ بالجنةِ وبَعملها، وينذرَ الناسَ النارَ وعملها، ويَسْتَألِفَ لَعْنَةُ اللَّهِ عَلَى الظَّٰلِمِينَ الناسَ حتى يَفْقَهُوا في الدينِ، وَيُعلِّمَ الناسَ مَعَالِمَ الْحَجِّ وسنِتَهُ وفريضتَهُ وما أَمَرَ اللّٰه به، والحجّ الأكبرُ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 637، يرد فيه ذكر الفريضة والفرائض، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hisham's Sira, p. 637, whose wording mentions the obligation (farida), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سیرت ابن ہشام، ص 637 کا اقتباس جس میں فریضہ اور فرائض، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sira de Ibn Hisham, p. 637, dont le texte mentionne l'obligation (farida), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sira de Ibn Hisham, p. 637, cuyo texto menciona la obligación (farida), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hişam'ın Peygamber biyografisinden, 637. sayfadan, farz olan amelleri ve görevleri, ayrıca mekruh olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. Farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları sıralayan bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari biografi Nabi karya Ibnu Hisham, halaman 637, yang menyebutkan amalan dan kewajiban wajib, serta amalan yang tidak disukai; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
