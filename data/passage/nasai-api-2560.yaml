label: { ar: "سنن النسائي 2560 — مَثَل المؤمن", en: "Sunan al-Nasa'i 2560 — the likeness of the believer", ur: "سنن نسائی 2560 — مومن کی مثال", es: "Sunan al-Nasa'i 2560 — la imagen del creyente", fr: "Sunan al-Nasa'i 2560 — l'image du croyant", tr: "Sunan an-Nasa'i 2560 — Müminin Meseli", id: "Sunan an-Nasa'i 2560 — Perumpamaan orang beriman" }
text: "أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ الْهَيْثَمِ بْنِ عُثْمَانَ، قَالَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ بُرَيْدِ بْنِ أَبِي بُرْدَةَ، عَنْ جَدِّهِ، عَنْ أَبِي مُوسَى، قَالَ قَالَ رَسُولُ اللَّهِ \" الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا \". وَقَالَ \" الْخَازِنُ الأَمِينُ الَّذِي يُعْطِي مَا أُمِرَ بِهِ طَيِّبًا بِهَا نَفْسُهُ أَحَدُ الْمُتَصَدِّقَيْنِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2560، يذكر مَثَل المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 2560 (The Book of Zakah), that mentions the likeness of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 2560، جس میں مومن کی مثال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2560 (El Libro del Zakat), menciona la semejanza del creyente. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Sunan an-Nasa'i, n° 2560 (Le Livre de la Zakat), évoque les qualités du croyant. Le navigateur « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux caractéristiques du croyant."
  tr: "Sunan-ı Nesai'de yer alan 2560 numaralı hadiste müminin örneği anlatılmaktadır. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2560, menyebutkan perumpamaan tentang orang beriman. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
