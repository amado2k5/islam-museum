text: "{234}. أخبرنا أبو عمر محمد بن عبد العزيز المروزي في كتابه، أخبرنا أبو الفضل محمد بن الحسين الحدادي، أخبرنا محمد بن يحيى بن خالد، أخبرنا إسحاق بن إبراهيم الحنظلي قال: حدثت عن مقاتل بن حيان في هذه الآية: أن رجلا من أهل الطائف قدم"
