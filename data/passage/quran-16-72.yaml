text: "وَٱللَّهُ جَعَلَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًا وَجَعَلَ لَكُم مِّنْ أَزْوَٰجِكُم بَنِينَ وَحَفَدَةً وَرَزَقَكُم مِّنَ ٱلطَّيِّبَـٰتِ ۚ أَفَبِٱلْبَـٰطِلِ يُؤْمِنُونَ وَبِنِعْمَتِ ٱللَّهِ هُمْ يَكْفُرُونَ"
text_search: "والله جعل لكم من أنفسكم أزواجا وجعل لكم من أزواجكم بنين وحفدة ورزقكم من الطيبات ۚ أفبالباطل يؤمنون وبنعمت الله هم يكفرون"
translations:
  en: { text: "And Allah hath given you wives of your own kind, and hath given you, from your wives, sons and grandsons, and hath made provision of good things for you. Is it then in vanity that they believe and in the grace of Allah that they disbelieve?", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور خدا ہی نے تم میں سے تمہارے لیے عورتیں پیدا کیں اور عورتوں سے تمہارے بیٹے اور پوتے پیدا کیے اور کھانے کو تمہیں پاکیزہ چیزیں دیں۔ تو کیا بےاصل چیزوں پر اعتقاد رکھتے اور خدا کی نعمتوں سے انکار کرتے ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
