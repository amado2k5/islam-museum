text: |-
  ⁦(ته)⁩٥
  ٤٣٣
  كفى حزنا أن لامهاه لعيشنا • ولا عمل يرضى بد اللّه صالح
  وهذه الهاهاذا انصات بالكلام لم نصرتاء واغاتصيرتاء اذا أردت بالهاة البقرة الاحروالفراه
  يقال فى المثل كل شئ مهه ما النساءوذ كرهن أى ان الرجل يحتمل كل شئ حتى يأتى ذكرحرمه
  يمتعض حينئذ فلا يحتمله وقواهم مهه أى يسيروبقال أيضامهاه أى حسن ونصب النساء على
  الاستتناء أى ماخلا النساء وانما أظهروا التضعيف فى مهه فرقابين فعل وفعل والمهمه المفارة.
  البعيدة الاطراف والجهع المهامه ومه كلة بنيت على السكون وهواسم سمى به الفعل ومعناه
  اكفف لانه زبر فان وصلت تونت فقلت مهمه ويقال مهمهت به أى زجرته ⁦(موه)⁩ الماء
  الذى يشرب والهمزة فيهمبدلة من الهاءفى موضع اللام وأصله موه بالتحريك لانه يجمع على
  أمواه فى القلة ومماه فى المكثرة مثل جل وأجال وجحال والذاهب منه الهاءلان تصغيره مويه
  فاذا أنفته قلت ماءة مثال ماعة وماهت الركية تموه وتميه وتماء موها ومؤها اذاظهر ماؤها
  وكثر وكذلك السفينة اذادخل فيها الماه ومهت الرجل ومهته بكسر الميم وضمها اذاسقيته
  الماه ورجل ماه أى كثير ماء القلب كقولك رجل مال قال الراجزه ال ياجهضم ماه القلب
  أى بليد السكسائى بترماهة وميهة أى كثيرة الماء وأماء الحافرأى أنيط الماء وأماهت
  الارض اذا ظهر فيها النز وأمهت الرجل والسكين اذاسقيتهما وأمهت الدواة صببت فيها
  لماه وأماه الفسل اذا آلق ماءء فى رحم الاننى وموهت الشى طليته بفضة أوذهب وتحت
  ذلك غحاس أوحديد ومنه التمويه وهو التلبيس والمادية المرآة كأنها منسوية الى الماه
  وماوية أيضااسم امرأة قال طرفة• ليس هذامنك ماوى يحزه ونصغير هاموية قال
  عاتم الطاقى يخاطب ماو بة امر أنه
  فضارته موى ولم تضرنى • ولم بعرق موى تلهاجبين
  يعن الكلمة العوراء ومامموضع يذكرويونت والنسبة الى الماءماقة وان شقت ماوة
  فى قول من يقول صطاوى وماء السما لقب عامى بن حارثة الازدى" وهو أبوحمر وعن يقيا
  الذى خرج من الإن لما أحس بسيل العرم فسهى بذلك لانه كان اذا أجدب قومه مانهم حق
  يأتيهم انفصب فقالواه وماء السعاء لانه خلف منه وقيل لواده بنو ماء السماءوهم ملول
  الشام قال بعض الانصار
  أنا ابن عن يقياعمرو وجدى • أبوم عامر ماء السماه
  وماه السماء أيضالقب أم المنذر بزامرى القيس بن عمرو بن عدى بن د بيعة بن نصر
  النخمى وهى ابنة عوف بن جشم بن النربن قاسط وسميت بذلك بهالها وقيسل لولدها بنوما«ا
  السماءوهم ملول العراق قال زهبر بن جناب
  ولازمت الملول من آل نصر • وبعدهم: فماء السماء
  صل النون ن به ى ثبه ونبه أى مشهور قال ذوالرقة
  كانه دملج من ففة نبه • فى ملعب من جوارى الحىّ مغصوم
  اتماجعله مفصوما لتثنيه وانحفائه اذانام ويقال النبه الضالة توجد عن غفلهلاعن طلب
  يقال وجدت الضالة نبها وثيه الرجل بالضم شرف واشتم رغبه نباهة فهونيه ونابه وهو خلاف
