text: "… لعل للدار بابين دعا بعضَ الطلبةِ إلى دارهِ ودخلَ يُفْسِحُ لهمُ الطريقَ، فلما رأى زوجتهُ قال لها : في البابِ ضيوفٌ أرى أنْ تصرفِيهم بحكمتِك. فأقبلَتْ عليهم زوجتُهُ وقالت مِنْ وراءِ الباب: ماذا تُريدون؟ فقالوا : نُريد الشيخ. قالت : …"
summary:
  ar: "جاء طلاب إلى باب جحا فقالت زوجته إنه غير موجود، فقالوا إنه دعاهم، فقال جحا من النافذة إن للدار ربما بابين وإنه خرج من الآخر. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  en: "Students come to Juha's door; his wife says he is not in; they say he invited them; Juha says from the window that perhaps the house has two doors and he left by the other one. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  ur: "طلبہ جحا کے دروازے پر آئے تو اس کی بیوی نے کہا کہ وہ گھر پر نہیں؛ انہوں نے کہا کہ اسی نے بلایا تھا؛ تو جحا نے کھڑکی سے کہا کہ شاید گھر کے دو دروازے ہوں اور میں دوسرے سے نکل گیا ہوں۔ {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  fr: "Des étudiants viennent à la porte de Juha ; sa femme dit qu'il n'est pas là ; ils disent qu'il les a invités ; Juha dit depuis la fenêtre que la maison a peut-être deux portes et qu'il est sorti par l'autre. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  es: "Unos estudiantes llegan a la puerta de Juha; su mujer dice que no está; ellos dicen que los invitó; Juha dice desde la ventana que quizá la casa tenga dos puertas y que salió por la otra. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
