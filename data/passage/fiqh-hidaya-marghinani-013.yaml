text: "ويأكل . قال أبو حنيفة رحمه الله : ابتليت بهذا مرة، فصبرت. وهذا جواب الحكم، فأما في الاحتياط: فيتيمم بعد الوضوء؛ لما قلنا. ومنها(١) : الحل والحرمة إذا لم يكن فيه زوال الملك، وفيها تفاصيل وتفريعات ذكرناها في ((كفاية المنتهي))."
