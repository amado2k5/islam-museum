label: { ar: "سنن ابن ماجه 245 — دفن وقبر ومرقد", en: "Sunan Ibn Majah 245 — a burial, grave or resting place", ur: "سنن ابن ماجہ 245 — تدفین، قبر اور مرقد", es: "Sunan Ibn Majah 245 — un entierro, tumba o lugar de descanso" }
text: "… حَدَّثَنَا أَبُو الْمُغِيرَةِ، حَدَّثَنَا مُعَانُ بْنُ رِفَاعَةَ، حَدَّثَنِي عَلِيُّ بْنُ يَزِيدَ، قَالَ سَمِعْتُ الْقَاسِمَ بْنَ عَبْدِ الرَّحْمَنِ، يُحَدِّثُ عَنْ أَبِي أُمَامَةَ، قَالَ مَرَّ النَّبِيُّ ـ فِي يَوْمٍ شَدِيدِ الْحَرِّ نَحْوَ بَقِيعِ الْغَرْقَدِ وَكَانَ النَّاسُ يَمْشُونَ خَلْفَهُ فَلَمَّا سَمِعَ صَوْتَ النِّعَالِ وَقَرَ ذَلِكَ فِي نَفْسِهِ فَجَلَسَ حَتَّى قَدَّمَهُمْ أَمَامَهُ لِئَلاَّ يَقَعَ فِي نَفْسِهِ شَىْءٌ مِنَ الْكِبْرِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 245، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 245 (The Book of the Sunnah), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 245، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 245 (El Libro de la Sunnah), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
