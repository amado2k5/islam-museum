label: { ar: "سنن النسائي 4132 — وصية أو عهد أخير", en: "Sunan al-Nasa'i 4132 — a testament or parting counsel", ur: "سنن نسائی 4132 — وصیت یا آخری نصیحت", es: "Sunan al-Nasa'i 4132 — un testamento o consejo de despedida" }
text: "أَخْبَرَنَا أَبُو عُبَيْدَةَ بْنُ أَبِي السَّفَرِ، قَالَ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نُمَيْرٍ، قَالَ حَدَّثَنَا إِسْمَاعِيلُ، عَنْ قَيْسٍ، قَالَ بَلَغَنِي أَنَّ جَرِيرَ بْنَ عَبْدِ اللَّهِ، قَالَ قَالَ لِي رَسُولُ اللَّهِ \" اسْتَنْصِتِ النَّاسَ \". ثُمَّ قَالَ \" لاَ أُلْفِيَنَّكُمْ بَعْدَ مَا أَرَى تَرْجِعُونَ بَعْدِي كُفَّارًا يَضْرِبُ بَعْضُكُمْ رِقَابَ بَعْضٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4132، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4132 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 4132، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4132 (El Libro de la Guerra [La Prohibición del Derramamiento de Sangre]), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
