text: "ورَوَى الطَّبَرانِيُّ، عَنْ يَحْيَى بنِ بَكِيرٍ تعالَى، قَالَ توفى ابنُ مَسْعُودٍ بالمدِينةِ، وَدُفِنَ بِالبَقِيعِ، وَأَوْصَى إلَى الَزّبَيْرِ بْنِ العَوَّامِ. الباب السابع ة فِى ذِكْرٍ رُعَاةِ إِبِلِهِ، وَشِيَاهِهِ... زيادة من ب. له ترجمة فى : الثقات والطبقات والإصابة وحلية الأولياء وتاريخ …"
