label: { ar: "سنن ابن ماجه 3468 — القسط والعود الهندي، أسماء الأمراض", en: "Sunan Ibn Majah 3468 — costus (Indian aloeswood); named diseases", ur: "سنن ابن ماجہ 3468 — قسط ہندی، بیماریوں کے نام", es: "Sunan Ibn Majah 3468 - costus (madera de áloe india); enfermedades nombradas", fr: "Sunan Ibn Majah 3468 — costus (bois d'aloès indien); maladies nommées", tr: "Sunan İbn Majah 3468 - Costus ve Hint Udu, Hastalık İsimleri", id: "Sunan Ibnu Majah 3468 — Costus dan Indian Oud, Nama-Nama Penyakit" }
text: "… سَمْعَانَ عَنِ ابْنِ شِهَابٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، عَنْ أُمِّ قَيْسٍ بِنْتِ مِحْصَنٍ، قَالَتْ قَالَ رَسُولُ اللَّهِ ـ \" عَلَيْكُمْ بِالْعُودِ الْهِنْدِيِّ - يَعْنِي بِهِ الْكُسْتَ - فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ مِنْهَا ذَاتُ الْجَنْبِ \". قَالَ ابْنُ سَمْعَانَ فِي الْحَدِيثِ \" فَإِنَّ فِيهِ شِفَاءً مِنْ سَبْعَةِ أَدْوَاءٍ مِنْهَا ذَاتُ الْجَنْبِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3468، يذكر القسط والعود الهندي، وأسماء الأمراض، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3468 (Chapters on Medicine), that mentions costus (Indian aloeswood), named diseases, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3468، جس میں قسط ہندی، بیماریوں کے نام، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Ibn Majah, n.° 3468 (Capítulos sobre Medicina), menciona el costus (árbol de aloe indio), las enfermedades, su remedio y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3468 (Chapitres sur la médecine), mentionne le costus (bois d'aloès indien), les maladies qu'il désigne, la maladie elle-même et son remède, ainsi que la guérison. Le Répertoire des médicaments le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 3468 numaralı hadiste, kostus ve Hint öd ağacının yanı sıra hastalıkların, rahatsızlıkların ve tedavilerinin isimleri de geçmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3468, menyebutkan costus dan gaharu India, beserta nama-nama penyakit, gangguan kesehatan, dan pengobatannya. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
