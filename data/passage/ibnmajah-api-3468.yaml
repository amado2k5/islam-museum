label: { ar: "سنن ابن ماجه 3468 — القسط والعود الهندي، أسماء الأمراض", en: "Sunan Ibn Majah 3468 — costus (Indian aloeswood); named diseases", ur: "سنن ابن ماجہ 3468 — قسط ہندی، بیماریوں کے نام" }
text: "… سَمْعَانَ عَنِ ابْنِ شِهَابٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، عَنْ أُمِّ قَيْسٍ بِنْتِ مِحْصَنٍ، قَالَتْ قَالَ رَسُولُ اللَّهِ ـ \" عَلَيْكُمْ بِالْعُودِ الْهِنْدِيِّ - يَعْنِي بِهِ الْكُسْتَ - فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ مِنْهَا ذَاتُ الْجَنْبِ \". قَالَ ابْنُ سَمْعَانَ فِي الْحَدِيثِ \" فَإِنَّ فِيهِ شِفَاءً مِنْ سَبْعَةِ أَدْوَاءٍ مِنْهَا ذَاتُ الْجَنْبِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3468، يذكر القسط والعود الهندي، وأسماء الأمراض، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3468 (Chapters on Medicine), that mentions costus (Indian aloeswood), named diseases, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3468، جس میں قسط ہندی، بیماریوں کے نام، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
