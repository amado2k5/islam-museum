summary:
  ar: "كتاب الشفعة، الكتاب الحادي والعشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 24 نصا (2079–2102) في بابين، من الصفحة 251 إلى الصفحة 258 من ملف PDF المجلد الثاني. يبدأ بالشفعة في الدور والأرضين بين الشركاء، وما يحدث من الهبة والبيع المؤجل والغياب، ثم ما لا تقع فيه الشفعة من الطرق والبئر والحيوان والثوب. {cite:muwatta-maruf-1997 p.251} {cite:muwatta-maruf-1997 p.258}"
  en: "The Book of Pre-emption (shufa), twenty-first book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 24 reports (2079–2102) in two babs, PDF pp. 251–258 of volume 2. It opens with pre-emption among partners in houses and land, the gift and the sale on credit, absence, and inheritance, and closes with what is not subject to pre-emption: roads, wells, animals, and cloth."
