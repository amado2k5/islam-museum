summary:
  ar: "كتاب الشفعة، الكتاب الحادي والعشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 24 نصا (2079–2102) في بابين، من الصفحة 251 إلى الصفحة 258 من ملف PDF المجلد الثاني. يبدأ بالشفعة في الدور والأرضين بين الشركاء، وما يحدث من الهبة والبيع المؤجل والغياب، ثم ما لا تقع فيه الشفعة من الطرق والبئر والحيوان والثوب. {cite:muwatta-maruf-1997 p.251} {cite:muwatta-maruf-1997 p.258}"
  en: "The Book of Pre-emption (shufa), twenty-first book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 24 reports (2079–2102) in two babs, PDF pp. 251–258 of volume 2. It opens with pre-emption among partners in houses and land, the gift and the sale on credit, absence, and inheritance, and closes with what is not subject to pre-emption: roads, wells, animals, and cloth."
  es: "El Libro del Derecho de Preferencia (shufa), vigésimo primer libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 24 informes (2079–2102) en dos babs, PDF pp. 251–258 del volumen 2. Comienza con el derecho de preferencia entre socios en casas y tierras, la donación y la venta a crédito, ausencia y herencia, y termina con lo que no está sujeto a derecho de preferencia: caminos, pozos, animales y telas."
  fr: "Le Livre de la Préemption (shufa), vingt et unième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 24 rapports (2079–2102) dans deux babs, PDF pp. 251–258 du volume 2. Il s'ouvre sur la préemption entre associés dans les maisons et les terres, le don et la vente à crédit, l'absence et l'héritage, et se termine sur ce qui n'est pas soumis à la préemption: les routes, les puits, les animaux et les tissus."
  ur: "دی بک آف پری ایمپشن ⁦(شفا)⁩، یحییٰ بن یحییٰ کی تجدید میں موطا کی اکیسویں کتاب ⁦(موضوع 1997)⁩، جلد 2 میں: 24 رپورٹس (2079-2102) دو بابوں میں، پی ڈی ایف پی پی 251-258 میں اوپن ہاؤس پارٹنر کے ساتھ والیوم 2. کریڈٹ، غیر موجودگی، اور وراثت پر تحفہ اور فروخت، اور اس کے ساتھ بند ہوتا ہے جو پہلے سے خالی نہیں ہے: سڑکیں، کنویں، جانور، اور کپڑا۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği Al-Muwatta'nın yirmi birinci kitabı olan \"Öncelikli Alım Hakkı Kitabı\", Beşar Awad Maruf'un (1997) baskısının İkinci Cildinde, iki bölümde 24 metin (2079–2102) içermektedir ve İkinci Cildin PDF dosyasının 251. sayfasından 258. sayfasına kadar uzanmaktadır. Kitap, ortaklar arasındaki ev ve arazilerdeki öncelikli alım hakkıyla başlar ve bağışlar, ertelenmiş satışlar ve yokluk durumlarında neler olduğunu, ardından yollar, kuyular, hayvanlar ve giysiler gibi öncelikli alım hakkının uygulanmadığı durumları ele alır. {cite:muwatta-maruf-1997 s.251} {cite:muwatta-maruf-1997 s.258}"
  id: "Kitab Hak Prioritas Pembelian, kitab ke-21 dari Al-Muwatta' dalam riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 24 teks (2079–2102) dalam dua bab, dari halaman 251 hingga halaman 258 dari file PDF Jilid Dua. Dimulai dengan hak prioritas pembelian rumah dan tanah antara pasangan suami istri, dan apa yang terjadi dalam pemberian hadiah, penjualan tertunda, dan ketidakhadiran, kemudian apa yang tidak termasuk dalam hak prioritas pembelian, seperti jalan, sumur, hewan, dan pakaian. {cite:muwatta-maruf-1997 p.251} {cite:muwatta-maruf-1997 p.258}"
