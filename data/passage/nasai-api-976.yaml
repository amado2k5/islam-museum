text: "أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، قَالَ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي قَتَادَةَ، أَنَّ أَبَاهُ، أَخْبَرَهُ قَالَ كَانَ رَسُولُ اللَّهِ يَقْرَأُ بِنَا فِي الرَّكْعَتَيْنِ الأُولَيَيْنِ مِنْ صَلاَةِ الظُّهْرِ وَيُسْمِعُنَا الآيَةَ أَحْيَانًا وَيُطَوِّلُ فِي الأُولَى وَيُقَصِّرُ فِي الثَّانِيَةِ وَكَانَ يَفْعَلُ ذَلِكَ فِي صَلاَةِ الصُّبْحِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 976، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 976 (The Book of the Commencement of the Prayer), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 976، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
