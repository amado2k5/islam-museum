label: { ar: "صحيح مسلم 5215 — الحرام", en: "Sahih Muslim 5215 — the unlawful", ur: "صحیح مسلم 5215 — حرام" }
text: "… جَدِّهِ، أَنَّ النَّبِيَّ بَعَثَهُ وَمُعَاذًا إِلَى الْيَمَنِ فَقَالَ لَهُمَا \" بَشِّرَا وَيَسِّرَا وَعَلِّمَا وَلاَ تُنَفِّرَا \". وَأُرَاهُ قَالَ \" وَتَطَاوَعَا \". قَالَ فَلَمَّا وَلَّى رَجَعَ أَبُو مُوسَى فَقَالَ يَا رَسُولَ اللَّهِ إِنَّ لَهُمْ شَرَابًا مِنَ الْعَسَلِ يُطْبَخُ حَتَّى يَعْقِدَ وَالْمِزْرُ يُصْنَعُ مِنَ الشَّعِيرِ فَقَالَ رَسُولُ اللَّهِ \" كُلُّ مَا أَسْكَرَ عَنِ الصَّلاَةِ فَهُوَ حَرَامٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5215، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 5215 (The Book of Drinks), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 5215، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
