text: "… ولم يتركه إلا وقد ورد في كثير من الأحاديث أن الذُّنُوبَ تَنْزِلُ عن صاحبها مع كل قَطْرَةٍ من قطرات الوضوء، لذلك شُرِعَ الوضوء قبل الصلاة. وقد فُرِضَ الوضوء ليلة الإِسراء مع الصلاة، قبل الهِجْرَةِ، وكان الوضوء أَوَّلَ الأمر وَاجِباً لكل …"
