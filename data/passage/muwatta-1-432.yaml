summary:
  ar: "أول أثر في باب مسح الحصباء في الصلاة. يرويه يحيى عن مالك عن أبي جعفر القارئ: رأى عبد الله بن عمر إذا أهوى ليسجد مسح الحصباء لموضع جبهته مسحاً خفيفاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.223}"
