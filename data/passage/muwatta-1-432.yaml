label: { ar: "الموطأ 432 — ابن عمر يمسح الحصباء لموضع جبهته مسحاً خفيفاً", en: "Muwatta 432", es: "Muwatta 432", fr: "Muwatta 432", ur: "موطا 432", tr: "El-Muvatta 432 — İbn Ömer, alnının olması gereken yere taşları hafifçe sildi.", id: "Al-Muwatta 432 — Ibnu Umar mengusap kerikil di tempat seharusnya dahinya berada, mengusapnya dengan lembut." }
summary:
  ar: "أول أثر في باب مسح الحصباء في الصلاة. يرويه يحيى عن مالك عن أبي جعفر القارئ: رأى عبد الله بن عمر إذا أهوى ليسجد مسح الحصباء لموضع جبهته مسحاً خفيفاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.223}"
  tr: "Namaz sırasında çakıl taşlarını silmekle ilgili ilk rivayet, Yahya'nın Malik'ten, o da Ebu Cafer el-Kari'den rivayet ettiğine göre şöyledir: Abdullah ibn Ömer, secdeye eğildiğinde, alnının değeceği yerdeki çakıl taşlarını hafifçe silerdi. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr'dan rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.223}"
  id: "Riwayat pertama mengenai mengusap kerikil saat shalat. Diriwayatkan oleh Yahya dari Malik dari Abu Ja'far al-Qari': Abdullah ibn Umar, ketika rukuk sujud, mengusap kerikil di tempat dahinya akan bertumpu dengan ringan. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.223}"
