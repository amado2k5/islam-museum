text: "… النبى، ولم يختلفوا أن سورة اتتشر نزلته فى بى النَّضِير، ولا اختلفوا فى أموالهِم، لأن المسلمين لم يُوحِفُوا عليها بَخَيْل ولا رِكَابٍ، وإنما قُذِفَ الرُّعْبُ في قُلوبهم وجَلَوْا عن منازِلهم إلى خَيْبَرَ : ولم يكن ذلك عن قتالٍ من المسلمين …"
summary:
