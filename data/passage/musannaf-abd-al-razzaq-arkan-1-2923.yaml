text: "… في الإسلام فيقول : تُقيم الصلاة، وتُؤتي الزكاة، وتحجّ البيت. وتصوم رمضان، وأَنك لا ترى نار مشرك إِلا وأَنت له حرب. بيعة النساءِ - أَخبرنا عبد الرزاق قال : أَخبرنا معمر عن الزهري عن أخرجه النسائي من طريق شعبة عن …"
