text: "… فى القرآن وجعسل لهسم يوما الماحضر وا عصفور خرج الهم وكان في المعد رحل يؤذن فيه وكأن من القراء فقال ماقراً فقرأفاتعة الكتاب وقال المولى على الشهيه فسر عا-ق مر فى القرآن كله على ذلك يقرأً الرجل والقراء يفسر وكابه …"
