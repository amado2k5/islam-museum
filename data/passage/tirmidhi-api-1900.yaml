label: { ar: "جامع الترمذي 1900 — قصة رجل وأمه وزوجته", en: "Jami' al-Tirmidhi 1900 — The man, his mother and his wife", ur: "جامع ترمذی 1900 — ایک شخص، اس کی ماں اور بیوی" }
text: "حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ عَطَاءِ بْنِ السَّائِبِ الْهُجَيْمِيِّ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ السُّلَمِيِّ، عَنْ أَبِي الدَّرْدَاءِ، أَنَّ رَجُلاً، أَتَاهُ فَقَالَ إِنَّ لِي امْرَأَةً وَإِنَّ أُمِّي تَأْمُرُنِي بِطَلاَقِهَا ‏.‏ قَالَ أَبُو الدَّرْدَاءِ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الْوَالِدُ أَوْسَطُ أَبْوَابِ الْجَنَّةِ فَإِنْ شِئْتَ فَأَضِعْ ذَلِكَ الْبَابَ أَوِ احْفَظْهُ ‏\"‏ ‏.‏ قَالَ وَقَالَ ابْنُ أَبِي عُمَرَ وَرُبَّمَا قَالَ سُفْيَانُ إِنَّ أُمِّي وَرُبَّمَا قَالَ أَبِي ‏.‏ وَهَذَا حَدِيثٌ صَحِيحٌ ‏.‏ وَأَبُو عَبْدِ الرَّحْمَنِ السُّلَمِيُّ اسْمُهُ عَبْدُ اللَّهِ بْنُ حَبِيبٍ ‏.‏"
summary:
  ar: "جاء رجل إلى أبي الدرداء فقال إن لي امرأة وإن أمي تطمع بفراقها، فقال إني سمعت النبي يقول الوالد أوسط أبواب الجنة فأضع ذلك الباب أو احفظه."
  en: "A man came to Abu al-Darda saying he had a wife and a mother who wanted him to part from her — he answered with the Prophet's saying: the parent is the middle gate of Paradise, lose that door or keep it."
  ur: "ایک شخص ابوالدرداء کے پاس آیا کہ میری بیوی ہے اور ماں اس سے جدائی چاہتی ہے — اس نے نبی کے قول سے جواب دیا: والد جنت کا درمیانی دروازہ ہے، ضائع کرو یا حفاظت کرو۔"
