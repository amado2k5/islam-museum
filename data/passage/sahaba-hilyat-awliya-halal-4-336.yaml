text: "… الحسن قالوا ثنا أبو مسلم الكشى قال ثنا الانصارى قالا تنا عبد اللّٰه بن عوك قالا من الشعى عن النعمان بن بشير. قال سمعت رسول اللّٰه يقول : الحلال بين، والحرام بين، وبينهما امور مشتبهات لا يعلمها كثير من الناس. …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 336، يذكر الحلال، والحرام، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 336, that mentions the lawful, the unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
