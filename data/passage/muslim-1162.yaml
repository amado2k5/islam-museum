label: { ar: "مسلم 1162 — صيام يوم عرفة يكفر سنتين", en: "Muslim 1162 — The fast of Arafah expiates two years" }
text: "قال أبو قتادة: سئل النبي عن صومه فأنكره ثم قال: ثلاث من كل شهر ورمضان إلى رمضان فهذا صيام الدهر كله، صيام يوم عرفة أحتسب على الله أن يكفر السنة التي قبله والسنة التي بعده، وصيام يوم عاشوراء أحتسب على الله أن يكفر السنة التي قبله"
summary:
  ar: "رواية أبي قتادة الأنصاري في باب فضل صيام ثلاثة أيام من كل شهر ويوم عرفة وعاشوراء ويوم الاثنين من كتاب الصيام في صحيح مسلم؛ وفي لفظ شعبة الإجابة عن صوم الاثنين «ذاك يوم ولدت فيه وبعثت أو أنزل علي فيه»."
