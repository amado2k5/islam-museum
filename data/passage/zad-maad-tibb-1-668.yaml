text: "… الصَّلاة شِفَاءَ ابن ماجه:، وسنده ضيف. وقد رُوي هذا الحديثُ موقوفاً على أبي هريرة، وأنه هو الذي قال ذلك لِمجاهد، وهو أشبهُ. ومعنى هذه اللفظة بالفارسي: أيوجعك بطنك؟ الرد على الأطباء المنكرين لفائدة الصلاة في العلاج فإن لم ينشرح صدرُ …"
