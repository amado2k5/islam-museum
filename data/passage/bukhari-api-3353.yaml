label: { ar: "صحيح البخاري 3353 — الأب والأبوة", en: "Sahih al-Bukhari 3353 — the father and fatherhood", ur: "صحیح بخاری 3353 — باپ اور والدیت", es: "Sahih al-Bukhari 3353 — El padre y la paternidad" }
text: "… عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، حَدَّثَنَا عُبَيْدُ اللَّهِ، قَالَ حَدَّثَنِي سَعِيدُ بْنُ أَبِي سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ قِيلَ يَا رَسُولَ اللَّهِ، مَنْ أَكْرَمُ النَّاسِ قَالَ \" أَتْقَاهُمْ \". فَقَالُوا لَيْسَ عَنْ هَذَا نَسْأَلُكَ. قَالَ \" فَيُوسُفُ نَبِيُّ اللَّهِ ابْنُ نَبِيِّ اللَّهِ ابْنِ نَبِيِّ اللَّهِ ابْنِ خَلِيلِ اللَّهِ \". قَالُوا لَيْسَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3353، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3353 (Prophets), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3353، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3353 (Profetas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
