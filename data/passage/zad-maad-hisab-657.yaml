text: "… الوالد والولد، والكُفءِ عنه المتضمن لنفي الأصل، والفرع والنظير، والممائل مما اختصَّت به وصارت تَعْدِلُ ثُلُثَ القرآن، ففي اسمه الصمد إثباتُ كل الكمال، وفي نفي الكُفءِ التنزيه عن الشبيه والمثال، وفي الأحد نفيُ كلِّ شريك لذي الجلال، وهذه الأصول الثلاثة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 657، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 657, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 657 کا اقتباس جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
