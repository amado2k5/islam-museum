label: { ar: "الموطأ 1657 — محمد بن إياس بن البكير: طلق رجل امرأته ثلاثا قبل أن يدخل بها، ثم أراد نكاحها، فقال ابن عباس وأبو هريرة لا نرى أن تنكحها حتى تنكح زوجا غيرك", en: "Muwatta 1657", es: "Muwatta 1657", fr: "Muwatta 1657", ur: "موطا 1657", tr: "El-Muvatta 1657 — Muhammed ibn İyas ibn el-Bukayr: Bir adam, evliliği tamamlamadan önce karısını üç kez boşadı, sonra onunla tekrar evlenmek istedi. İbn Abbas ve Ebu Hurayra, \"Bizce, o başka bir adamla evleninceye kadar onunla tekrar evlenmemelisin\" dediler.", id: "Al-Muwatta 1657 — Muhammad ibn Iyas ibn al-Bukayr: Seorang pria menceraikan istrinya tiga kali sebelum melakukan hubungan suami istri, kemudian ingin menikahinya kembali. Ibn Abbas dan Abu Hurayrah berkata, “Kami tidak berpendapat bahwa kamu harus menikahinya kembali sampai dia menikah dengan pria lain.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن محمد بن عبد الرحمن بن ثوبان عن محمد بن إياس بن البكير أنه قال طلق رجل امرأته ثلاثا قبل أن يدخل بها، ثم بدا له أن ينكحها، فجاء يستفتي، فذهبت معه أسأل له، فسأل عبد الله بن عباس وأبا هريرة عن ذلك، فقالا لا نرى أن تنكحها حتى تنكح زوجا غيرك. قال فإنما طلاقي إياها واحدة. فقال ابن عباس إنك أرسلت من يدك ما كان لك من فضل. {cite:muwatta-maruf-1997 p.81}"
  tr: "Malik, İbn Şihab'dan, o da Muhammed ibn Abdülrahman ibn Sevban'dan, o da Muhammed ibn İyas ibn el-Bukayr'dan rivayet ettiğine göre şöyle demiştir: Bir adam, evliliği tamamlamadan önce karısını üç kez boşadı. Sonra onunla tekrar evlenmeye karar verdi ve hukuki görüş almak için geldi. Ben de onun adına sormak için onunla birlikte gittim. Abdullah ibn Abbas ve Ebu Hurayra'ya sordu ve onlar şöyle dediler: Bizce, o başka bir adamla evlenene kadar onunla tekrar evlenmemelisin. Adam dedi ki: Ama benim boşanmam sadece bir kezdi. İbn Abbas dedi ki: Elinden geleni yaptın. {cite:muwatta-maruf-1997 s.81}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Muhammad ibn Abd al-Rahman ibn Thawban, dari Muhammad ibn Iyas ibn al-Bukayr, bahwa ia berkata: Seorang pria menceraikan istrinya tiga kali sebelum melakukan hubungan suami istri. Kemudian ia memutuskan untuk menikahinya kembali, sehingga ia datang untuk meminta pendapat hukum. Aku pergi bersamanya untuk meminta pendapatnya. Ia bertanya kepada Abdullah ibn Abbas dan Abu Hurayrah tentang hal itu, dan mereka berkata: Kami tidak berpikir kamu harus menikahinya kembali sampai ia menikah dengan pria lain. Ia berkata: Tetapi perceraianku dengannya hanya satu kali. Ibn Abbas berkata: Kamu telah memberikan apa yang berada dalam kekuasaanmu. {cite:muwatta-maruf-1997 p.81}"
