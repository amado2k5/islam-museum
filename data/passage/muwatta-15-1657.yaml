label: { ar: "الموطأ 1657 — محمد بن إياس بن البكير: طلق رجل امرأته ثلاثا قبل أن يدخل بها، ثم أراد نكاحها، فقال ابن عباس وأبو هريرة لا نرى أن تنكحها حتى تنكح زوجا غيرك", en: "Muwatta 1657" }
summary:
  ar: "يروي مالك عن ابن شهاب عن محمد بن عبد الرحمن بن ثوبان عن محمد بن إياس بن البكير أنه قال طلق رجل امرأته ثلاثا قبل أن يدخل بها، ثم بدا له أن ينكحها، فجاء يستفتي، فذهبت معه أسأل له، فسأل عبد الله بن عباس وأبا هريرة عن ذلك، فقالا لا نرى أن تنكحها حتى تنكح زوجا غيرك. قال فإنما طلاقي إياها واحدة. فقال ابن عباس إنك أرسلت من يدك ما كان لك من فضل. {cite:muwatta-maruf-1997 p.81}"
