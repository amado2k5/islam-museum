text: "دلوك الشمس ميلها"
summary:
  ar: "أول أثر في باب ما جاء في دلوك الشمس وغسق الليل، وهما لفظان من آية الإسراء في إقامة الصلاة. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان يفسر دلوك الشمس بميلها عن وسط السماء، أي الزوال. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.42}"
  en: "Ibn Umar on the meaning of the sun's decline (duluk): its turning away from the middle of the sky."
