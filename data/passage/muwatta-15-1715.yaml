label: { ar: "الموطأ 1715 — مالك سأل ابن شهاب: متى يضرب الأجل؟ أمن يوم يبني بها أم من يوم يرافعه إلى السلطان؟ فقال من يوم يرافعه إلى السلطان", en: "Muwatta 1715", es: "Muwatta 1715", fr: "Muwatta 1715", ur: "موطا 1715", tr: "El-Muvatta 1715 — Malik, İbn Şihab'a sordu: Süre ne zaman belirleniyor? Evliliğin tamamlandığı günden mi yoksa meseleyi hükümdara götürdüğü günden mi? İbn Şihab şöyle dedi: Meseleyi hükümdara götürdüğü günden itibaren.", id: "Al-Muwatta 1715 — Malik bertanya kepada Ibnu Shihab: Kapan batas waktunya ditetapkan? Apakah dari hari ia melakukan hubungan suami istri atau dari hari ia membawa masalah itu kepada penguasa? Beliau menjawab: Dari hari ia membawa masalah itu kepada penguasa" }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب متى يضرب له الأجل، أمن يوم يبني بها أم من يوم يرافعه إلى السلطان؟ فقال بل من يوم يرافعه إلى السلطان. {cite:muwatta-maruf-1997 p.99}"
  tr: "Malik, İbn Şihab'a kendisine süre sınırının ne zaman konulacağını sorduğunu anlatır: evliliğin gerçekleştiği günden mi yoksa konuyu Sultan'a götürdüğü günden mi? İbn Şihab, \"Daha ziyade, konuyu Sultan'a götürdüğü günden itibaren\" diye yanıtlamıştır. {cite:muwatta-maruf-1997 s.99}"
  id: "Malik menceritakan bahwa ia bertanya kepada Ibn Shihab kapan batas waktu akan ditetapkan baginya: dari hari ia melakukan hubungan suami istri atau dari hari ia menyampaikan masalah tersebut kepada Sultan? Ibn Shihab menjawab, \"Lebih tepatnya, dari hari ia menyampaikan masalah tersebut kepada Sultan.\" {cite:muwatta-maruf-1997 p.99}"
