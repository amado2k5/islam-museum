label: { ar: "الموطأ 994 — مالك: من دخل مكة بعمرة فطاف بالبيت وسعى بين الصفا والمروة وهو جنب أو على غير وضوء، ثم وقع بأهله، ثم ذكر: يغتسل أو يتوضأ، ثم يعود فيطوف، ويعتمر عمرة أخرى ويهدي، وعلى المرأة مثل ذلك", en: "Muwatta 994" }
summary:
  ar: "قول لمالك: من دخل مكة بعمرة، فطاف بالبيت وسعى بين الصفا والمروة وهو جنب أو على غير وضوء، ثم وقع بأهله، ثم ذكر، قال: يغتسل أو يتوضأ، ثم يعود فيطوف بالبيت وبين الصفا والمروة، ويعتمر عمرة أخرى ويهدي. وعلى المرأة إذا أصابها زوجها وهي محرمة مثل ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.466} {cite:muwatta-maruf-1997 p.467}"
