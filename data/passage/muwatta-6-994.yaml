label: { ar: "الموطأ 994 — مالك: من دخل مكة بعمرة فطاف بالبيت وسعى بين الصفا والمروة وهو جنب أو على غير وضوء، ثم وقع بأهله، ثم ذكر: يغتسل أو يتوضأ، ثم يعود فيطوف، ويعتمر عمرة أخرى ويهدي، وعلى المرأة مثل ذلك", en: "Muwatta 994", es: "Muwatta 994", fr: "Muwatta 994", ur: "موطا 994", tr: "El-Muvatta 994 — Malik: Umre için Mekke'ye giren, cünüp halde veya abdestsizken Kâbe'nin etrafında tavaf ve Safa ile Merve arasında sa'i yapan, sonra karısıyla cinsel ilişkiye giren ve sonra bunu hatırlayan kimse, gusül veya abdest almalı, sonra geri dönüp tavaf yapmalı, bir Umre daha yapmalı ve kurban kesmelidir. Aynı durum kadınlar için de geçerlidir.", id: "Al-Muwatta 994 — Malik: Barang siapa memasuki Mekah untuk Umrah, melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa dalam keadaan junub atau tanpa wudhu, kemudian bersetubuh dengan istrinya, lalu ingat: ia harus mandi atau berwudhu, kemudian kembali dan melakukan Tawaf, melakukan Umrah lagi, dan mempersembahkan kurban. Hal yang sama berlaku untuk wanita." }
summary:
  ar: "قول لمالك: من دخل مكة بعمرة، فطاف بالبيت وسعى بين الصفا والمروة وهو جنب أو على غير وضوء، ثم وقع بأهله، ثم ذكر، قال: يغتسل أو يتوضأ، ثم يعود فيطوف بالبيت وبين الصفا والمروة، ويعتمر عمرة أخرى ويهدي. وعلى المرأة إذا أصابها زوجها وهي محرمة مثل ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.466} {cite:muwatta-maruf-1997 p.467}"
  tr: "Malik şöyle demiştir: Bir kimse Umre için Mekke'ye girer, cünüp halde veya abdestsizken Kâbe'nin etrafında tavaf yapar ve Safa ile Merve arasında sa'i çeker, sonra karısıyla cinsel ilişkiye girer ve sonra bunu hatırlarsa, gusül abdesti almalı, sonra geri dönüp Kâbe'nin etrafında tavaf yapmalı ve Safa ile Merve arasında sa'i çekmeli, bir Umre daha yapmalı ve kurban kesmelidir. Aynı durum, kocası ihramlı haldeyken kadınla cinsel ilişkiye girerse de geçerlidir. Araştırmacı, bunu Ebu Musab'ın Malik'ten rivayet ettiğini belirtmektedir."
  id: "Malik berkata: Jika seseorang memasuki Mekah untuk Umrah, melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa dalam keadaan junub atau tanpa wudhu, kemudian bersetubuh dengan istrinya, dan kemudian ingat, ia harus mandi wajib (Ghusl) atau berwudhu (wudu), kemudian kembali dan melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa, melakukan Umrah lagi, dan mempersembahkan hewan kurban. Hal yang sama berlaku untuk seorang wanita jika suaminya bersetubuh dengannya saat ia dalam keadaan ihram. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik."
