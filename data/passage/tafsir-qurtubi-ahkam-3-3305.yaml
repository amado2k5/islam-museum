text: "… أبي سليمان عن إبراهيم النَّخَعِيّ قال سمعت أنس بن مالك يقول: سمعت رسول اللّٰه ال في يقول: طلب العلم فريضة على كل مسلم. قال إبراهيم: لم أسمع من أنس بن مالك إلا هذا الحديث. وفرضٌ على الكفاية؛ كتحصيل الحقوق وإقامة …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 3305، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض، وما وجب على كل مسلم، وفرض الكفاية؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 3305, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard), a duty laid on every Muslim, the communal obligation (fard kifaya); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
