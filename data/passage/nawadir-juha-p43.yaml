text: "… نِلْتُ مرادي كان عندَ جحا ثورٌ عظيمُ القرنينِ حتى كأنّهُما قوسانٍ، وبينما الثور راقدٌ تأمَّلَ فيه وتمنَّى لو يجلسُ ساعةً بين قرنيه، فتقدَّمَ متأنياً وقفزَ إلى رأس الثور فركبَهُ وأمسَكَ القرنين وذُعِرَ الثورُ فنهضَ قائماً وانتفضَ فسقط الشيخُ على الأرض …"
summary:
  ar: "جلس جحا بين قرني ثور، فاستوى الثور وألقاه فأغمي عليه، وظنته زوجته ميتًا، فأفاق وقال إنه نال مراده. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  en: "Juha sits between the horns of a bull; the bull rears and throws him, and he faints; his wife thinks he is dead; he wakes saying 'I got my wish'. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  ur: "جحا ایک بیل کے سینگوں کے بیچ بیٹھ گیا؛ بیل اچھلا اور اسے پھینک دیا تو وہ بے ہوش ہو گیا؛ بیوی نے اسے مردہ سمجھا؛ وہ ہوش میں آ کر بولا کہ مجھے اپنی مراد مل گئی۔ {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  fr: "Juha s'assied entre les cornes d'un taureau ; le taureau se cabre et le jette à terre, et il s'évanouit ; sa femme le croit mort ; il se réveille en disant : «j'ai obtenu ce que je voulais». {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  es: "Juha se sienta entre los cuernos de un toro; el toro se encabrita y lo arroja, y se desmaya; su mujer lo cree muerto; despierta diciendo: «conseguí lo que quería». {cite:juha-nawadir-kubra-djuwaydi p. 43}"
