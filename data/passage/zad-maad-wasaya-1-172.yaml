text: "… رَسُولِ اللَّهِ. وفي رواَيِةِ : بِسْمِ اللّهِ، وَفي سَبِيلِ اللّهِ، وَعَلَى مِلَّةِ رَسُولِ اللَّهِ صحيح: أحمد:، وأبو داود:، والترمذي:، وابن ماجه:. ويُذكر عنه أيضاً أنه كان يحتُو التراب على قبر الميت إذا دُفِنَ مِنْ قِبَلَ رأسِه ثلاثاً ابن ماجه :. …"
