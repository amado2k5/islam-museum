text: "… ذكره البَغَوِيّ في الصحابة. وقد تقدم. وأخرج من طريق ابن لهيعة، عن أبي الزُّبير، قال: - عمر بن مالك: قلت لجابر : أسمعت النبيَّ للفي يقول: لا يَزْنِي الزَّانِي ذكره الطَّبَرَانِيّ في الصحابة. حِينَ يَزْنِي وَهُوَ مُؤْمِنٌ قال: لا، حدثني …"
