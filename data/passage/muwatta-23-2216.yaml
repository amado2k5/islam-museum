label: { ar: "الموطأ 2216 — مالك عن عبد الله بن أبي بكر بن حزم عن أبيه عن عمرو بن سليم الزرقي: قيل لعمر بن الخطاب إن هاهنا غلاما يفاعا لم يحتلم من غسان، وارثه بالشام، وهو ذو مال، فأوصى لابنة عمه بمال يقال له بئر جشم، فبيع بثلاثين ألف درهم", en: "Muwatta 2216", es: "Muwatta 2216", fr: "Muwatta 2216", ur: "موطا 2216", tr: "El-Muvatta 2216 — Malik, Abdullah ibn Abi Bakr ibn Hazm'dan, o da babasından, o da Amr ibn Salim el-Zuraki'den rivayetle: Ömer ibn el-Hattab'a şöyle denildi: \"Burada henüz ergenliğe ulaşmamış, Gassanlı bir genç oğlan var. Varisi Suriye'de ve zengin. Kuzenine Bi'r Jusham adında bir mülk miras bıraktı. Bu mülk otuz bin dirheme satıldı.\"", id: "Al-Muwatta 2216 — Malik, berdasarkan riwayat Abdullah ibn Abi Bakr ibn Hazm, berdasarkan riwayat ayahnya, berdasarkan riwayat Amr ibn Salim al-Zuraqi: Dikatakan kepada Umar ibn al-Khattab, “Ada seorang anak laki-laki di sini yang belum mencapai usia baligh, dari Ghassan, yang ahli warisnya berada di Suriah, dan dia kaya. Dia mewariskan kepada sepupunya sebuah properti bernama Bi’r Jusham, yang dijual seharga tiga puluh ribu dirham.”" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه أن عمرو بن سليم الزرقي أخبره أنه قيل لعمر بن الخطاب: إن هاهنا غلاما يفاعا، لم يحتلم، من غسان، وارثه بالشام، وهو ذو مال، وليس له هاهنا إلا ابنة عم له. فقال عمر بن الخطاب: فليوص لها. فأوصى لها بمال يقال له: بئر جشم. قال عمرو بن سليم: فبيع ذلك المال بثلاثين ألف درهم، وابنة عمه التي أوصى لها، هي أم عمرو بن سليم الزرقي. {cite:muwatta-maruf-1997 p.310}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Hazm'dan, o da babasından rivayet ettiğine göre, Amr ibn Salim el-Zuraqi'nin kendisine, Ömer ibn el-Hattab'a şöyle denildiğini aktarır: \"Burada, henüz reşit olmayan, Ghassanlı bir genç oğlan var. Varisi Suriye'de. Zengin ve burada kuzeninden başka kimsesi yok.\" Ömer ibn el-Hattab, \"Ona miras bıraksın\" dedi. Bunun üzerine Bi'r Jusham adlı mülkü ona miras bıraktı. Amr ibn Salim şöyle dedi: \"Bu mülk otuz bin dirheme satıldı ve miras bıraktığı kuzen, Amr ibn Salim el-Zuraqi'nin annesiydi.\" {cite:muwatta-maruf-1997 s.310}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Hazm, dari ayahnya, bahwa Amr ibn Salim al-Zuraqi memberitahunya bahwa dikatakan kepada Umar ibn al-Khattab: “Ada seorang pemuda di sini, belum cukup umur, dari Ghassan, yang ahli warisnya berada di Suriah. Dia kaya, dan dia tidak memiliki siapa pun di sini kecuali sepupunya.” Umar ibn al-Khattab berkata: “Biarlah dia mewariskan hartanya kepada sepupunya.” Maka dia mewariskan kepadanya harta yang disebut Bi’r Jusham. Amr ibn Salim berkata: “Harta itu dijual seharga tiga puluh ribu dirham, dan sepupu yang menerima warisan itu adalah ibu dari Amr ibn Salim al-Zuraqi.” {cite:muwatta-maruf-1997 p.310}"
