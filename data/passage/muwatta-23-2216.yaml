label: { ar: "الموطأ 2216 — مالك عن عبد الله بن أبي بكر بن حزم عن أبيه عن عمرو بن سليم الزرقي: قيل لعمر بن الخطاب إن هاهنا غلاما يفاعا لم يحتلم من غسان، وارثه بالشام، وهو ذو مال، فأوصى لابنة عمه بمال يقال له بئر جشم، فبيع بثلاثين ألف درهم", en: "Muwatta 2216" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه أن عمرو بن سليم الزرقي أخبره أنه قيل لعمر بن الخطاب: إن هاهنا غلاما يفاعا، لم يحتلم، من غسان، وارثه بالشام، وهو ذو مال، وليس له هاهنا إلا ابنة عم له. فقال عمر بن الخطاب: فليوص لها. فأوصى لها بمال يقال له: بئر جشم. قال عمرو بن سليم: فبيع ذلك المال بثلاثين ألف درهم، وابنة عمه التي أوصى لها، هي أم عمرو بن سليم الزرقي. {cite:muwatta-maruf-1997 p.310}"
