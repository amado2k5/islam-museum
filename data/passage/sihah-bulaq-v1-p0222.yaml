text: |-
  ⁦(فصل اليام)⁩
  ٤١٩
  وهو يف-هل لانه ليس فى الكلام فعيل وقال الاحر الحجر اليهير الدلب ومنه سمى صمغ الطلح
  يهيرا قال أبو بكر بن السراج ورعازادوافيه الالف فقالوا يهيرى قال وهو من أسماء الباطل
  وولهم أكذب من اليهيرهو السراب
  صل الياء بر برين موضع يقال رمل يبرين وقدذ كرنا اعرابه فى نصيبين من
  باب الباء ( يرد البرر مصد رقواه-م حجراير أى صاد صلب وفى حسديث لقمان انه
  يبصر أثر الذر فى الحجر الاير قال العجاج
  سنابك انلخيل يصدّعن الاير • من الصفا القامى ويدعسن الغدر
  والجمع يرّوشى حارياروحران يران اجاع له يسر البسرنقيض العسروكذلك اليسم
  ثل عسروع سرواليسر أيضاذحل لبى يربوع بالدهناء قال طرفة
  أزرق العين خيال لم يقر • طاف والركب بصدراء يسز
  واليسورضدّ المعسود وقدبسره اللّٰه لليسرى أى وفقه لها ويقال أيضايسرت الغنم
  اذا كثرا لبانها ونسلها قال الشاعر
  هماسيدانا يزعمان وانما * يسوداننا ان يسرت غنماهما
  ومنه قواهِم رجل ميسر بكسر السين وه وخلاف الجنب وقعد فلان يسرة أى شأمة واليسر
  الفتل الى أسفل وهوأن تديمينك نحو جسدك والشزرالى فوق والطعن اليسر حذاء وجهك
  وتيسراء لان انحروج واستيسرله بعنى أى تهيأ والايسر نقيض الايمن والميسرة خسلاف
  الميمنة والميسرة والميسرة السعة والغنى وقرأبعضهم فنظرة الى ميسره بالاضافة قال الاخفس
  وهو غير جائزلانه ليس فى المكلام مفعل بغير الهاء وأمامكرمٍ ومعون فهماجع كمرمة
  ومعونة والميسرا والعرب بالازلام واليسرة بالتحريك أسرار الكف اذا كانت غير، لمتزقة
  وهى تستحب واليسرة أيضاسعة فى الفخدين عن أبى عمرووججعها أيسار قال ومنه قول ابن
  مقبل على ذات أيساركان ضلوعها • وألواحها العليا السقيف المنيح
  واليسرات القوائم الخفاف وداية حسسن التيسور أى حسن نقل القوائم. ويقال السمن
  وقال الشاعر قدبلوناه على علاته • وعلى التيسور منه والذر
  والياسر نقيض اليا من تول ياسر بأصحابك أى خذبهم يسارا وتياسر يا رجسل لغة فى يامر
  وبعضهسم شكره وياسره أى ساهله والياسر اللاعب بالقداح وقد يسر يسر قال الشاعر
  فأعنهم وايسر بمايسروايه * واذاهم نزلوايضنك فانزل
  مده رواية أبى سعيد ولم تحذف الياءفيه ولا فى يبعرو يينع كماحذفت فى يعدو أخواته لتقوى
  احدى المامس بالاخرى فلهسذا قالوا فى لغة فى أسد ييحسل وهم لا يقولون يعلم لاستثقاله.
  الكسرة على الياءفإن قال فكيف لم يحذفوهامع التاء والالف والذون قيل له هذه الثلاثة
  مبدلة من الياء والياء هى الاصل يدل على ذلكان فعلت وفعلت وفعلنا مبنيات على فعسل
  واليسر والياسر بيعنى والجمع أي ار قال أبوذؤيب
  وكأنهن ربابة وكانه • يسريفيض على القداح ويصدع
  ويقال رجل أعسريسر للذى يعمل بكاتايديه جيها ويسرالة وم الجزور أى اجتزروها
