text: |-
  • ⁦(باب النون)⁩*
  •(دون
  ٣٧٥
  قال هودان الرباب يعنى أذلها وقهر ها ثم قال دانت بعد الرباب أى ذلت له وأطاعت والدين
  الجزاء والمسكافأة يقال دانه دينا أى جازاه بقال كما تدين تدان أى كما تجازى تجازى أى
  تجازى يفعلك ويحسب ماهملت وقوله تعالى انالمدينون أى مجزيون محاسبون ومنه الديان
  فى صفة اللّٰه تعالى وقوم دين أى دائنون وقال * وكان الناس الانحن دينا ، والمدين
  العبد والمدينة الامة كأنم ما أذلهما العمل قال الاخطل
  ربت وربا فى كرمها ابن مدينة * يظل على مسحاته يتركل
  قال أبو عبيدة أى ابن أمة الفراء يقال دينته ملكته وأنشد لنهطيئة بهجوأمه
  لقدد ينت أمر ينيك حتى • تركتهم أدق من اللمحسين
  بعنى ملكت ويروى سوّست وناس يولون ومنه سمى المصر مدشة والدين الطاعة ودان
  ف أى أطاعه قال عمروبن كلنوم
  وأيام لنا ولهم طوال • عصينا المه فيها أن ندينا
  ومنه الدين والمع الاديان يقال دان بكذاديانة وتدين بدفهودين ومتدين ودينت
  الرجل تديننا اذا وكلته الى دينه وقول ذى الاصبع
  لا اين عمك لا أفضات فى حسب * عنى ولا أنت دياتى فتخزونى
  قال ابن السكيت أى ولا أنت مالك أمرى فنس وسنى
  لحيبه وفى المثل مثقل استعان بذقنه يضر ب لرحسل ذليل يستعين برجل آخر مثله وأصله
  البعير يحمل عليه الحل النقيل فلا يقدر على النهوض فيعتمد بذقنه على الارض وذقنت
  ضربت ذقته والذاقنة طارف الحلقوم الناتئ وفى المثل لاً لحقن حواقتك بذواقنك وقال
  أبوزيد الذواقين أسفل البعان وناقة ذقون ترخى ذقنها فى انسير ودلوذقون وقدذقنت
  بالكسراذإخررتها تجاءت شفتها مائلة (ذتن الذنيز مخاط يسيل من الانف
  والذنان بالضم مثله قال الشماخ
  توائل من مصك أنصبته • حوالب أسهريه بالذتين
  وقدذن يذنَ ذنيناو ذلكْ اذا سال وذننت يارجل تذنّ ذننا فأنت أذت والمسرأة ذنا والذناء
  أيضا المرأة لا يتقطع حيضها والذنانة بقية الشئ الهالك الضعيف تذنها شيا بعدشئ وان
  ذلا نا ليذن اذا كان ضعيفاها لكاهرما أومرضا وفلان بذان فلانا على حاجة بطلبها منه أى
  طلب اليه ويسأله اياها والذنائة بالنون والضم بقيسة الدين والعدة تبقى لمك عند القوم وهو
  أدق من الذيابة لات الذياية بالباء بقية شى مصحيح والدقانة بالمنون لا تكون الابقية شئ ضعيف
  هالكْ تنتها شيأ بعدشئ ابن السكيت ذناذن القميص مثل ذلاذله الواحدذنذن وذلذل
  ون لذان العيب قال ابن السكيت سمفت أباعمر ويقول الذام والذيم والذان والذاب
  بمعنى واحد قال قيس بن الخطيم الانصارى
  رددنا الكتيبة مغلوة: • بها أقتها وج اذاتها
