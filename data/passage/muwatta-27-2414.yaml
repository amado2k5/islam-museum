label: { ar: "الموطأ 2414 — القاسم وسالم وعروة: العبد الآبق إذا سرق ما يجب فيه القطع يقطع", en: "Muwatta 2414", es: "Muwatta 2414", fr: "Muwatta 2414", ur: "موطا 2414", tr: "Al-Muwatta 2414 — Al-Qasim, Salim ve Urwah: Kaçak bir köle, uzuv kesilmesini gerektiren bir şey çalarsa, eli kesilir.", id: "Al-Muwatta 2414 — Al-Qasim, Salim, dan Urwah: Jika seorang budak yang melarikan diri mencuri sesuatu yang mengharuskan amputasi, maka tangannya dipotong." }
summary:
  ar: "بلغ مالكا أن القاسم بن محمد وسالم بن عبد الله وعروة بن الزبير كانوا يقولون: إذا سرق العبد الآبق ما يجب فيه القطع قُطع. {cite:muwatta-maruf-1997 p.397}"
  tr: "Malik, el-Kâsım ibn Muhammed, Salim ibn Abdullah ve Urve ibn el-Zübeyr'in şöyle dediklerini rivayet etmiştir: \"Kaçak bir köle, kesilmesi gereken bir şey çalarsa, eli kesilmelidir.\" {cite:muwatta-maruf-1997 s.397}"
  id: "Malik meriwayatkan bahwa al-Qasim ibn Muhammad, Salim ibn Abdullah, dan Urwah ibn al-Zubayr biasa berkata: Jika seorang budak yang melarikan diri mencuri sesuatu yang mengharuskan amputasi, maka tangannya harus dipotong. {cite:muwatta-maruf-1997 p.397}"
