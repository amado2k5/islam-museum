  الغلام طلعت وأصبأ النجم أى طلع التريا قال الشاعر يصف مطا
  وأصبأ النجم فى غبراء مظلمة * كأنه بابس محتاب أخلاق
  وصبآ الرجل صبوءا اذا خر ج من دين الى دين قال أبو عبددة صبأمن دينه الى دين آخر كما
  صبأ النحوم أى تخرج من مطالعها وصبأ ايضا اذا صار صا بئا والصابئون جنس من أهل
  الكاب ⁦(صدأ)⁩ صدأ الخديد ونه وقد صدى يصدأ مد.اويدى من الحديد مدئة أى
  سهكة وفلان صاغر صدى أيضا اذ الزمه العار واللوم وجدى أصدأبين الصدأ اذا كان
  أسود مشر باحرة وقد صدئ وعناق صدآء والصدأة بالضم اسم ذلك اللون وهى من شيات
  المعزوالجسل يقال كيت أصدأ اذاعته كدرة وصداءحى من اليمن قال ابيد
