  الحديث فقحنا وصأه أتم أبوز يد صأصأت من الرجل وتسأصأت مثل تزأزأت اذافرقت منه
  واذا الم تقبل التخلة اللقاح ولم يكل للبسرنوى قيل قد صأصأت النخلة ⁦(صبأ )⁩ صبأت على
