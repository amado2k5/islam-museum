summary:
  ar: "القسم 32 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب اللباس»، ويضم فيها النصوص من 3550 إلى 3656 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 32 of Sunan Ibn Majah (Chapters on Dress) in the division of the open hadith dataset the museum took its reports from: reports 3550 to 3656 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 32، عنوان «کتاب اللباس»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3550 تا 3656۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 32 de Sunan Ibn Majah (Capítulos sobre la vestimenta) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3550 al 3656, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 32 du Sunan Ibn Majah (Chapitres sur le vêtement), soit les hadiths 3550 à 3656 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
