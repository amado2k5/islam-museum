text: "… الُّوخَ لأنه فى مَعى الَّنْسِ، وهى لغة مشهورة معروفة. أمر ذُو الرئمَّةِ عندموته أن يُكْتَبَ على قبره : وقَارِجَ الكَرْب أَنْقِذْنِي من النَّارِ. يانازِعَ الدُّوح مِنْ حِسْ إذا قُبِضَّتْ فكان ذلك مكتوباً على قبره. وقوله : فاخرِ الزَّبرج، أى : …"
