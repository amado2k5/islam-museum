summary:
  ar: "قال مالك في رجل ورث مكاتبا من امرأته هو وابنها: إن المكاتب إن مات قبل أن يقضي كتابته اقتسما ميراثه على كتاب الله. وإن أدى كتابته ثم مات، فميراثه لابن المرأة، وليس للزوج من ميراثه شيء. {cite:muwatta-maruf-1997 p.345}"
