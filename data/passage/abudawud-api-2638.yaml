label: { ar: "سنن أبي داود 2638 — الأب والأبوة", en: "Sunan Abi Dawud 2638 — the father and fatherhood", ur: "سنن ابی داؤد 2638 — باپ اور والدیت", es: "Sunan Abi Dawud 2638 — El padre y la paternidad", fr: "Sunan Abi Dawud 2638 — le père et la paternité" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ عَلِيٍّ، حَدَّثَنَا عَبْدُ الصَّمَدِ، وَأَبُو عَامِرٍ عَنْ عِكْرِمَةَ بْنِ عَمَّارٍ، حَدَّثَنَا إِيَاسُ بْنُ سَلَمَةَ، عَنْ أَبِيهِ، قَالَ أَمَّرَ رَسُولُ اللَّهِ عَلَيْنَا أَبَا بَكْرٍ - - فَغَزَوْنَا نَاسًا مِنَ الْمُشْرِكِينَ فَبَيَّتْنَاهُمْ نَقْتُلُهُمْ وَكَانَ شِعَارُنَا تِلْكَ اللَّيْلَةَ أَمِتْ أَمِتْ. قَالَ سَلَمَةُ فَقَتَلْتُ بِيَدِي تِلْكَ اللَّيْلَةَ سَبْعَةَ أَهْلِ أَبْيَاتٍ مِنَ الْمُشْرِكِينَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2638، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2638 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2638، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2638 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2638 (Jihad (Kitab Al-Jihad)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
