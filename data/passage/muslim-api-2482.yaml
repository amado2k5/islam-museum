label: { ar: "صحيح مسلم 2482 — ما لا يحل", en: "Sahih Muslim 2482 — what is not lawful", ur: "صحیح مسلم 2482 — جو حلال نہیں", es: "Sahih Muslim 2482 — lo que no es lícito", fr: "Sahih Muslim 2482 — ce qui n'est pas licite", tr: "Sahih Müslim 2482 — İzin verilmeyen şeyler", id: "Sahih Muslim 2482 — Apa yang tidak diperbolehkan" }
text: "… إِلَيْكُمَا ابْنَاكُمَا بِحَوْرِ مَا بَعَثْتُمَا بِهِ إِلَى رَسُولِ اللَّهِ. وَقَالَ فِي الْحَدِيثِ ثُمَّ قَالَ لَنَا \" إِنَّ هَذِهِ الصَّدَقَاتِ إِنَّمَا هِيَ أَوْسَاخُ النَّاسِ وَإِنَّهَا لاَ تَحِلُّ لِمُحَمَّدٍ وَلاَ لآلِ مُحَمَّدٍ \". وَقَالَ أَيْضًا ثُمَّ قَالَ رَسُولُ اللَّهِ \" ادْعُوَا لِي مَحْمِيَةَ بْنَ جَزْءٍ \". وَهُوَ رَجُلٌ مِنْ بَنِي أَسَدٍ كَانَ رَسُولُ اللَّهِ اسْتَعْمَلَهُ عَلَى الأَخْمَاسِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2482، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 2482 (The Book of Zakat), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 2482، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 2482 (El Libro del Zakat), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 2482 (Le Livre de la Zakat), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 2482 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinler sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2482, menyebutkan apa yang dilarang. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
