label: { ar: "الموطأ 668 — قطع النبي لبلال بن الحارث المزني معادن القبلية، فلا يؤخذ منها إلى اليوم إلا الزكاة", en: "Muwatta 668", es: "Muwatta 668", fr: "Muwatta 668", ur: "موطا 668", tr: "El-Muvatta 668 — Peygamber, Bilal ibn el-Harith el-Muzani'ye el-Kıbleyye madenlerini bağışladı ve bugüne kadar bu madenlerden sadece zekât alınmaktadır.", id: "Al-Muwatta 668 — Nabi menganugerahkan tambang al-Qibliya kepada Bilal ibn al-Harith al-Muzani, dan hingga hari ini hanya zakat yang diambil dari tambang tersebut." }
summary:
  ar: "أول حديث في باب الزكاة في المعادن. يرويه مالك عن ربيعة بن أبي عبد الرحمن عن غير واحد، أن النبي أقطع بلال بن الحارث المزني معادن القبلية، وهي من ناحية الفُرع، فتلك المعادن لا يؤخذ منها إلى اليوم إلا الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (339)، وأنه يُروى متصلاً مرفوعاً عند أحمد (1/306) وأبي داود ⁦(3062 و3063)⁩ والبيهقي ولا يصح. {cite:muwatta-maruf-1997 p.339}"
  tr: "Madenlerden zekât alınması konusundaki ilk hadis. Malik'in, Rabi'ah ibn Abi 'Abd al-Rahman'dan, birden fazla kişiden rivayet ettiğine göre, Peygamberimiz, Bilal ibn al-Harith al-Muzani'ye, Fura bölgesinde bulunan el-Kibliyye madenlerini vermiştir. Bugüne kadar bu madenlerden sadece zekât alınmaktadır. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn al-Hasan al-Şeybani (339) tarafından rivayet edildiğini ve Ahmed (1/306), Ebu Davud (3062 ve 3063) ve el-Beyhaki tarafından Peygamberimize atfedilen sürekli bir isnad zinciriyle rivayet edildiğini, ancak sahih olmadığını belirtmektedir. {cite:muwatta-maruf-1997 s.339}"
  id: "Hadits pertama tentang zakat atas mineral. Diriwayatkan oleh Malik dari Rabi'ah ibn Abi 'Abd al-Rahman, dari lebih dari satu orang, bahwa Nabi memberikan kepada Bilal ibn al-Harith al-Muzani tambang al-Qibliyyah, yang terletak di wilayah al-Fura'. Hingga hari ini, hanya zakat yang diambil dari tambang tersebut. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan al-Shaybani (339), dan bahwa hadits ini diriwayatkan dengan sanad yang berkesinambungan yang dinisbahkan kepada Nabi oleh Ahmad (1/306), Abu Dawud (3062 dan 3063), dan al-Bayhaqi, tetapi hadits ini tidak sahih. {cite:muwatta-maruf-1997 p.339}"
