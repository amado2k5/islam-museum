label: { ar: "الموطأ 668 — قطع النبي لبلال بن الحارث المزني معادن القبلية، فلا يؤخذ منها إلى اليوم إلا الزكاة", en: "Muwatta 668" }
summary:
  ar: "أول حديث في باب الزكاة في المعادن. يرويه مالك عن ربيعة بن أبي عبد الرحمن عن غير واحد، أن النبي أقطع بلال بن الحارث المزني معادن القبلية، وهي من ناحية الفُرع، فتلك المعادن لا يؤخذ منها إلى اليوم إلا الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (339)، وأنه يُروى متصلاً مرفوعاً عند أحمد (1/306) وأبي داود (3062 و3063) والبيهقي ولا يصح. {cite:muwatta-maruf-1997 p.339}"
