label: { ar: "نوادر جحا الكبرى، ص 177 — «أين مقر تيمور في الآخرة؟»", en: "Nawadir Juha al-Kubra, p. 177 — 'Where Is Timur's Place in the Afterlife?'", ur: "نوادر جحا الکبریٰ، ص 177 — «آخرت میں تیمور لنگ کا ٹھکانا کہاں ہے؟»", fr: "Nawadir Juha al-Kubra, p. 177 — « Où est la place de Timur dans l'au-delà ? »", es: "Nawadir Juha al-Kubra, p. 177 — «¿Dónde está el lugar de Timur en la otra vida?»", tr: "Cuha'nın Büyük Fıkraları, s. 177 — “Timur'un ahiretteki ikametgahı nerededir?”", id: "Anekdot-Anekdot Hebat Juha, hlm. 177 — “Di manakah kediaman Timur di akhirat?”" }
text: "… أين مقر تيمور في الآخرة؟ كانوا يتداولون الحديث في مجلسٍ عن أعوام يوم القيامة وأهوالها، والخوف ملء قلوبهم. وكان الشيخ جالساً بجانب تيمور لنك، الذي تأوَّهَ من فؤاده، وقال: يا حضرة الشيخ ماذا يكون نصيبُنا يوم القيامة؟ فهل يكون مقامُنا …"
summary:
  ar: "سأل تيمور لنك جحا هل سيكون في الجنة أم في أسفل جهنم، فقال جحا إن تيمور لنك وجنكيز وهولاكو سيجلسون في النار مع فرعون ونمرود والإسكندر وأمثالهم. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  en: "Timur asks Juha whether he will be in paradise or in the lowest hell; Juha says Timur, Genghis and Hulagu will sit in the fire with Pharaoh, Nimrod, Alexander and their like. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  ur: "تیمور لنگ نے جحا سے پوچھا کہ وہ جنت میں ہوگا یا جہنم کے سب سے نچلے درجے میں، تو جحا نے کہا کہ تیمور لنگ، چنگیز اور ہلاکو آگ میں فرعون، نمرود، سکندر اور ان جیسوں کے ساتھ بیٹھیں گے۔ {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  fr: "Timur demande à Juha s'il sera au paradis ou au plus bas de l'enfer ; Juha dit que Timur, Gengis et Houlagou siégeront dans le feu avec Pharaon, Nemrod, Alexandre et leurs semblables. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  es: "Timur pregunta a Juha si estará en el paraíso o en lo más hondo del infierno; Juha dice que Timur, Gengis y Hulagu se sentarán en el fuego con el faraón, Nemrod, Alejandro y sus semejantes. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  tr: "Timur, Cuha'ya cennette mi yoksa cehennemin derinliklerinde mi olacağını sordu. Cuha, Timur, Cengiz Han ve Hulagu'nun Firavun, Nemrut, Büyük İskender ve onlar gibi diğerleriyle birlikte cehennemde oturacaklarını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 177}"
  id: "Timur bertanya kepada Juha apakah ia akan berada di Surga atau di kedalaman Neraka. Juha menjawab bahwa Timur, Genghis Khan, dan Hulagu akan duduk di Neraka bersama Firaun, Nimrod, Alexander, dan orang-orang seperti mereka. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
