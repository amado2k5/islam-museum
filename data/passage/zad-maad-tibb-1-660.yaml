text: "… وتفويض الأمر إليه، وقد تقدم أن قُوى الرُّقية وتأثيرها بحسب الراقي، وانفعال المرقي عن رُقيته، وهذا أمر لا يُنكره طبيب فاضل عاقل مسلم، فإن انتفى أحدُ الأوصاف، فليقل ما شاء. فصل في هديه وَلِ في في علاج الوجع بالرُّقية تضمنت …"
