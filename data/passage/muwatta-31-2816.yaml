label: { ar: "الموطأ 2816 — أبو هريرة: لا يقل أحدكم يا خيبة الدهر فإن الله هو الدهر", en: "Muwatta 2816", es: "Muwatta 2816", fr: "Muwatta 2816", ur: "موطا 2816", tr: "El-Muvatta 2816 — Ebu Hurayra: Hiçbiriniz, \"Ah, ne büyük bir zaman felaketi!\" demesin; çünkü Allah zamanın kendisidir.", id: "Al-Muwatta 2816 — Abu Hurairah: Janganlah seorang pun di antara kalian berkata, \"Oh, betapa malangnya waktu ini!\" karena Tuhan adalah Waktu." }
summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن النبي قال: لا يقل أحدكم: يا خيبة الدهر، فإن الله هو الدهر. {cite:muwatta-maruf-1997 p.580}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle Peygamberimizin şöyle buyurduğunu nakletmiştir: \"Hiçbiriniz 'Vay haline!' demesin; çünkü Allah zamandır.\" {cite:muwatta-maruf-1997 s.580}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah bahwa Nabi bersabda: \"Janganlah seorang pun di antara kalian berkata, 'Celakalah waktu!' karena Allah adalah waktu.\" {cite:muwatta-maruf-1997 p.580}"
