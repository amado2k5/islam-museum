label: { ar: "الموطأ 2034 — يحيى عن مالك: الأمر المجتمع عليه عندنا فيمن دفع مالا قراضا فاشترى به سلعة، ثم باعها بدين، فربح في المال، ثم هلك الذي أخذ المال قبل أن يقبض: إن أراد ورثته أن يقبضوا المال، وهم على شرط أبيهم من الربح، فذلك لهم إذا كانوا أمناء، وإن كرهوا فليس عليهم شيء", en: "Muwatta 2034" }
summary:
  ar: "قال يحيى: قال مالك: الأمر المجتمع عليه عندنا في رجل دفع إلى رجل مالا قراضا، فاشترى به سلعة، ثم باع السلعة بدين، فربح في المال، ثم هلك الذي أخذ المال قبل أن يقبض المال. قال: إن أراد ورثته أن يقبضوا ذلك المال، وهم على شرط أبيهم من الربح، فذلك لهم، إذا كانوا أمناء على ذلك. فإن كرهوا أن يقبضوه، وخلوا بين صاحب المال وبينه، لم يكلفوا أن يقتضوه، ولا شيء عليهم، ولا شيء لهم، إذا أسلموه إلى رب المال. فإن اقتضوه، فلهم فيه من الشرط والنفقة، مثل ما كان لأبيهم في ذلك، هم فيه بمنزلة أبيهم. فإن لم يكونوا أمناء على المال، فإن لهم أن يأتوا بأمين فيقتضي ذلك المال. {cite:muwatta-maruf-1997 p.231} {cite:muwatta-maruf-1997 p.232}"
