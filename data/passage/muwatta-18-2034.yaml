label: { ar: "الموطأ 2034 — يحيى عن مالك: الأمر المجتمع عليه عندنا فيمن دفع مالا قراضا فاشترى به سلعة، ثم باعها بدين، فربح في المال، ثم هلك الذي أخذ المال قبل أن يقبض: إن أراد ورثته أن يقبضوا المال، وهم على شرط أبيهم من الربح، فذلك لهم إذا كانوا أمناء، وإن كرهوا فليس عليهم شيء", en: "Muwatta 2034", es: "Muwatta 2034", fr: "Muwatta 2034", ur: "موطا 2034", tr: "El-Muvatta 2034 — Yahya, Malik'ten rivayetle: Bizim aramızda ittifak şudur: Borç olarak para veren, bu parayla mal alan, sonra da bu malları kredili olarak satıp kâr elde eden ve parayı alan kişi, malı teslim almadan önce vefat eden kimse hakkında: Eğer mirasçıları parayı teslim almak isterlerse ve babalarının kârla ilgili şartına bağlılarsa, eğer güvenilir iseler bu onlara caizdir. Ancak reddederlerse, hiçbir şey yapmak zorunda değillerdir.", id: "Al-Muwatta 2034 — Yahya berdasarkan riwayat Malik: Konsensus di antara kami adalah mengenai seseorang yang memberikan uang sebagai pinjaman dan membeli barang dengannya, kemudian menjualnya secara kredit dan memperoleh keuntungan, dan kemudian orang yang menerima uang tersebut meninggal sebelum menerima hartanya: Jika ahli warisnya ingin menerima harta tersebut, dan mereka terikat oleh syarat ayah mereka mengenai keuntungan, maka hal itu diperbolehkan bagi mereka jika mereka dapat dipercaya. Tetapi jika mereka menolak, maka mereka tidak berkewajiban untuk melakukan apa pun." }
summary:
  ar: "قال يحيى: قال مالك: الأمر المجتمع عليه عندنا في رجل دفع إلى رجل مالا قراضا، فاشترى به سلعة، ثم باع السلعة بدين، فربح في المال، ثم هلك الذي أخذ المال قبل أن يقبض المال. قال: إن أراد ورثته أن يقبضوا ذلك المال، وهم على شرط أبيهم من الربح، فذلك لهم، إذا كانوا أمناء على ذلك. فإن كرهوا أن يقبضوه، وخلوا بين صاحب المال وبينه، لم يكلفوا أن يقتضوه، ولا شيء عليهم، ولا شيء لهم، إذا أسلموه إلى رب المال. فإن اقتضوه، فلهم فيه من الشرط والنفقة، مثل ما كان لأبيهم في ذلك، هم فيه بمنزلة أبيهم. فإن لم يكونوا أمناء على المال، فإن لهم أن يأتوا بأمين فيقتضي ذلك المال. {cite:muwatta-maruf-1997 p.231} {cite:muwatta-maruf-1997 p.232}"
  tr: "Yahya dedi ki: Malik dedi ki: Bizde yerleşik uygulama şudur: Bir adam başka bir adama borç para verirse ve o adam bu parayla mal alır, sonra da malı kredili olarak satıp kâr ederse ve parayı alan kişi parayı almadan önce ölürse, mirasçıları bu konuda güvenilir olmaları şartıyla parayı alabilirler. Eğer parayı almayı reddederler ve sahibine bırakırlarsa, parayı tahsil etmekle yükümlü değillerdir ve sahibine teslim etmeleri durumunda da hiçbir hakka sahip değillerdir. Eğer parayı tahsil ederlerse, babalarının bu durumda sahip olacağı şartlara ve masraflara hak kazanırlar; bu konuda babalarıyla aynı konumdadırlar. Eğer para konusunda güvenilir değillerse, parayı tahsil etmesi için güvenilir birini görevlendirebilirler."
  id: "Yahya berkata: Malik berkata: Kebiasaan yang berlaku di antara kita adalah jika seseorang memberi uang kepada orang lain sebagai pinjaman, dan orang yang menerima uang itu membeli barang dengan uang tersebut, kemudian menjual barang tersebut secara kredit dan memperoleh keuntungan, dan kemudian orang yang menerima uang tersebut meninggal sebelum menerimanya, maka ahli warisnya dapat mengambil alih uang tersebut, asalkan mereka dapat dipercaya dalam hal ini. Jika mereka menolak untuk mengambil alih dan meninggalkan uang tersebut kepada pemiliknya, mereka tidak berkewajiban untuk mengambilnya, dan mereka juga tidak berhak atas apa pun jika mereka menyerahkannya kepada pemiliknya. Jika mereka mengambilnya, mereka berhak atas kondisi dan biaya yang sama seperti yang akan diterima ayah mereka dalam hal itu; mereka berada dalam posisi yang sama dengan ayah mereka dalam hal ini. Jika mereka tidak dapat dipercaya dengan uang tersebut, maka mereka dapat menunjuk orang yang dapat dipercaya untuk mengambilnya."
