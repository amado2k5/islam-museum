label: { ar: "الموطأ 1317 — مالك: الذي يحضر بأفراس كثيرة لا يقسم إلا لفرس واحد هو الذي يقاتل عليه", en: "Muwatta 1317", es: "Muwatta 1317", fr: "Muwatta 1317", ur: "موطا 1317", tr: "Al-Muwatta 1317 — Malik: Çok sayıda at getiren, ganimetleri ancak savaşacağı atlar arasında paylaştıracaktır.", id: "Al-Muwatta 1317 — Malik: Barangsiapa membawa banyak kuda, maka ia hanya akan membagi rampasan perang di antara kuda-kuda yang akan ia tunggangi dalam pertempuran." }
summary:
  ar: "سئل مالك عن رجل يحضر بأفراس كثيرة، فهل يقسم لها كلها؟ فقال لم أسمع بذلك، ولا أرى أن يقسم إلا لفرس واحد، الذي يقاتل عليه. {cite:muwatta-maruf-1997 p.588}"
  tr: "Malik'e, çok sayıda at getiren bir adam hakkında soru soruldu; ganimeti hepsine paylaştırmalı mıydı? O şöyle cevap verdi: \"Böyle bir şey duymadım ve bence sadece bir atı, yani savaşta kullandığı atı paylaştırmalıydı.\" {cite:muwatta-maruf-1997 s.588}"
  id: "Malik ditanya tentang seorang pria yang membawa banyak kuda; haruskah dia membagi rampasan perang di antara mereka semua? Dia menjawab, \"Aku belum pernah mendengar hal seperti itu, dan menurutku dia tidak perlu membaginya kecuali untuk satu kuda, yaitu kuda yang dia gunakan untuk berperang.\" {cite:muwatta-maruf-1997 p.588}"
