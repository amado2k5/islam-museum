text: "والزيت في الجاهليّة وبعد أَن دخل الإِسلام، فإنما كانت أَخبار الشام عند المسلمين كلّ يوم ؛ لِكَثْرة مَن يَقدَم عليهم من الأَنْباط، فقدمت قادمة فذكروا أَنَّ الروم قد جمعت جُموعاً كثيرةً بالشام، وأَنَّ هِرَقْلُ قد رَزَق أَصحابه. لِسَنَة، وأَجلبت معه …"
