label: { ar: "الموطأ 2267 — يحيى بن سعيد عن عمرة: عرض الدفع دفعة واحدة", en: "Muwatta 2267", es: "Muwatta 2267", fr: "Muwatta 2267", ur: "موطا 2267", tr: "El-Muvatta 2267 — Yahya bin Said, Amrah'tan rivayetle: Tek seferde toplu ödeme yapılması", id: "Al-Muwatta 2267 — Yahya bin Saeed berdasarkan riwayat Amrah: Menawarkan pembayaran sekaligus" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن أن عائشة عرضت على أهل بريرة أن تدفع ثمنها دفعة واحدة وتعتقها، فأبوا إلا أن يكون الولاء لهم، فأمرها النبي أن تشتريها وتعتقها، فإن الولاء لمن أعتق. {cite:muwatta-maruf-1997 p.335} {cite:muwatta-maruf-1997 p.336}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Amrah bint Abdülrahman'dan rivayet ettiğine göre, Aişe, Berirah halkına bedelini tek seferde ödeyip kendisini serbest bırakmalarını teklif etmiş, ancak onlar biat kendilerinde kalmadığı sürece bunu reddetmişlerdir. Bunun üzerine Peygamberimiz ona Amrah'ı satın alıp serbest bırakmasını emretmiştir; zira biat, onu serbest bırakana aittir. {cite:muwatta-maruf-1997 s.335} {cite:muwatta-maruf-1997 s.336}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari 'Amrah bint 'Abd al-Rahman, bahwa 'Aisyah menawarkan kepada penduduk Barirah untuk membayar harganya sekaligus dan membebaskannya, tetapi mereka menolak kecuali baiat tetap berada pada mereka. Maka Nabi memerintahkannya untuk membelinya dan membebaskannya, karena baiat hanya milik orang yang membebaskannya. {cite:muwatta-maruf-1997 p.335} {cite:muwatta-maruf-1997 p.336}"
