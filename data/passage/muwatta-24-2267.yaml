summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن أن عائشة عرضت على أهل بريرة أن تدفع ثمنها دفعة واحدة وتعتقها، فأبوا إلا أن يكون الولاء لهم، فأمرها النبي أن تشتريها وتعتقها، فإن الولاء لمن أعتق. {cite:muwatta-maruf-1997 p.335} {cite:muwatta-maruf-1997 p.336}"
