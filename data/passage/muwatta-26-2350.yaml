summary:
  ar: "قال مالك في مدبرة دبرت وهي حامل ولم يعلم سيدها بحملها: إن ولدها بمنزلتها. وإنما هذا بمنزلة رجل أعتق جارية له وهي حامل ولم يعلم بحملها، فالسنة فيها أن ولدها يتبعها ويعتق بعتقها. {cite:muwatta-maruf-1997 p.369} {cite:muwatta-maruf-1997 p.370}"
