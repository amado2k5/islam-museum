label: { ar: "الموطأ 2350 — مالك: مدبرة دبرت وهي حامل ولم يعلم سيدها بحملها", en: "Muwatta 2350", es: "Muwatta 2350", fr: "Muwatta 2350", ur: "موطا 2350", tr: "Al-Muwatta 2350 — Malik: Efendisinin ölümünden sonra özgür bırakılacağı sözü verilen, hamile bir köle kadın; efendisi ise hamileliğinden habersizdi." }
summary:
  ar: "قال مالك في مدبرة دبرت وهي حامل ولم يعلم سيدها بحملها: إن ولدها بمنزلتها. وإنما هذا بمنزلة رجل أعتق جارية له وهي حامل ولم يعلم بحملها، فالسنة فيها أن ولدها يتبعها ويعتق بعتقها. {cite:muwatta-maruf-1997 p.369} {cite:muwatta-maruf-1997 p.370}"
  tr: "Malik, efendisinin ölümünden sonra özgür bırakılacağı sözü verilen hamile bir köle kadın hakkında, efendisinin hamileliğinden habersiz olduğu halde, çocuğunun da onun konumunda sayıldığını söylemiştir. Bu, hamile olduğunu bilmeden hamile bir köle kızı özgür bırakan bir erkeğe benzer; yerleşik uygulama, çocuğunun da annesiyle birlikte özgür bırakılmasıdır. {cite:muwatta-maruf-1997 s.369} {cite:muwatta-maruf-1997 s.370}"
  id: "Malik berkata mengenai seorang budak perempuan yang dijanjikan kebebasan setelah kematian tuannya saat sedang hamil, dan tuannya tidak mengetahui kehamilannya: anaknya dianggap berada di posisi yang sama dengannya. Ini mirip dengan seorang pria yang membebaskan budak perempuannya saat ia sedang hamil, tanpa mengetahui kehamilannya; praktik yang berlaku adalah bahwa anaknya akan mengikuti ibunya dan dibebaskan bersamaan dengan kebebasannya. {cite:muwatta-maruf-1997 p.369} {cite:muwatta-maruf-1997 p.370}"
