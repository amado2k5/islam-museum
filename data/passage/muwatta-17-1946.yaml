label: { ar: "الموطأ 1946 — مالك: من باع سلعة لرجل على أنه لا نقصان على المبتاع، فإن ذلك بيع غير جائز ومن المخاطرة، كأنه استأجره برمح، إن كان في تلك السلعة ربح، وإن باع برأس المال أو بنقصان فلا شيء له", en: "Muwatta 1946" }
summary:
  ar: "قال مالك في رجل باع سلعة من رجل، على أنه لا نقصان على المبتاع: إن ذلك بيع غير جائز وهو من المخاطرة. وتفسير ذلك أنه كأنه استأجره برمح، إن كان في تلك السلعة ربح، وإن باع برأس المال أو بنقصان فلا شيء له، وذهب عناؤه باطلا، فهذا لا يصلح. وللمبتاع في هذا أجرة بمقدار ما عالج من ذلك. وما كان في تلك السلعة من نقصان أو ربح، فهو للبائع وعليه. {cite:muwatta-maruf-1997 p.196}"
