label: { ar: "الموطأ 1946 — مالك: من باع سلعة لرجل على أنه لا نقصان على المبتاع، فإن ذلك بيع غير جائز ومن المخاطرة، كأنه استأجره برمح، إن كان في تلك السلعة ربح، وإن باع برأس المال أو بنقصان فلا شيء له", en: "Muwatta 1946", es: "Muwatta 1946", fr: "Muwatta 1946", ur: "موطا 1946", tr: "El-Muvatta 1946 — Malik: Bir kimse, alıcının zarar görmeyeceği şartıyla bir malı bir kişiye satarsa, bu caiz olmayan bir satış olur ve spekülasyon teşkil eder; sanki o maldan kâr elde ediliyorsa, onu mızrak karşılığında kiraya vermiş gibidir. Ancak eğer malı maliyet fiyatına veya zararına satarsa, hiçbir hak iddia edemez.", id: "Al-Muwatta 1946 — Malik: Barang siapa menjual suatu barang kepada seseorang dengan syarat pembeli tidak akan mengalami kerugian, maka itu adalah penjualan yang haram dan merupakan spekulasi, seolah-olah ia menyewanya untuk sebuah tombak, jika barang tersebut mendapat keuntungan. Tetapi jika ia menjualnya dengan harga pokok atau rugi, maka ia tidak memiliki hak untuk menuntut." }
summary:
  ar: "قال مالك في رجل باع سلعة من رجل، على أنه لا نقصان على المبتاع: إن ذلك بيع غير جائز وهو من المخاطرة. وتفسير ذلك أنه كأنه استأجره برمح، إن كان في تلك السلعة ربح، وإن باع برأس المال أو بنقصان فلا شيء له، وذهب عناؤه باطلا، فهذا لا يصلح. وللمبتاع في هذا أجرة بمقدار ما عالج من ذلك. وما كان في تلك السلعة من نقصان أو ربح، فهو للبائع وعليه. {cite:muwatta-maruf-1997 p.196}"
  tr: "Malik, bir adamın bir başkasına, alıcının zarar görmeyeceği şartıyla bir mal sattığı konusunda şöyle demiştir: Bu caiz olmayan bir satış olup spekülasyon teşkil eder. Açıklama şudur ki, sanki satıcıyı bir ücret karşılığında işe almış gibidir; malda kâr varsa, hiçbir şey almaz ve emeği boşa gider. Bu caiz değildir. Alıcı, emeğine orantılı bir ücret almaya hak kazanır. Maldaki herhangi bir zarar veya kâr satıcıya aittir. {cite:muwatta-maruf-1997 s.196}"
  id: "Malik berkata mengenai seorang pria yang menjual suatu barang kepada pria lain dengan syarat pembeli tidak akan mengalami kerugian: Ini adalah penjualan yang tidak diperbolehkan dan merupakan spekulasi. Penjelasannya adalah seolah-olah ia menyewa penjual dengan imbalan; jika ada keuntungan pada barang tersebut, ia tidak menerima apa pun, dan usahanya sia-sia. Ini tidak diperbolehkan. Pembeli berhak atas pembayaran yang sebanding dengan usahanya. Kerugian atau keuntungan apa pun pada barang tersebut menjadi hak penjual. {cite:muwatta-maruf-1997 p.196}"
