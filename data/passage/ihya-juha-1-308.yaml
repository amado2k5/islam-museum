text: "… من جملة العامة كالذى يمشى مستعجلا فيطلع عليه الناس فيحسن المشى ويترك المجلة كيلا يقال إنه من أهل اللهو والسهو لا من أهل الوقار، وكذلك إن سبق إلى الضحك أو بدا منه المزاح فيخاف أن ينظر إليه بعين الاحتقار فيتبع …"
