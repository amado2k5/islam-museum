  ur: "احیاء علوم الدین، اسکین جلد 1، ص 308 کا اقتباس جس میں مزاح اور خوش طبعی ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
