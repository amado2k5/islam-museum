label: { ar: "الموطأ 1503 — مالك: الرجل يزوج ابنه الصغير الذي لا مال له، فالصداق على أبيه إلا أن يسمي الأب أن الصداق عليه", en: "Muwatta 1503", es: "Muwatta 1503", fr: "Muwatta 1503", ur: "موطا 1503", tr: "El-Muvatta 1503 — Malik: Bir adam parasız olan genç oğlunu evlendirirse, mehir sorumluluğu babaya aittir; ancak baba mehirin kendi sorumluluğu olduğunu belirtirse durum değişir.", id: "Al-Muwatta 1503 — Malik: Seorang pria menikahkan putranya yang masih muda dan tidak memiliki uang, maka mahar menjadi tanggung jawab ayahnya kecuali jika sang ayah secara khusus menetapkan bahwa mahar adalah tanggung jawabnya." }
summary:
  ar: "يقول مالك في الرجل يزوج ابنه صغيرا لا مال له، إن الصداق على أبيه إذا كان الغلام يوم تزوج لا مال له، وإن كان للغلام مال فالصداق في ماله، إلا أن يسمي الأب أن الصداق عليه، وذلك النكاح ثابت على الابن إذا كان صغيرا وكان في ولاية أبيه. {cite:muwatta-maruf-1997 p.32}"
  tr: "Malik, parası olmayan küçük oğlunu evlendiren bir adam hakkında şöyle der: Eğer oğlanın evlilik günü parası yoksa, başlık parası babanın sorumluluğundadır. Eğer oğlanın parası varsa, baba başlık parasının kendi sorumluluğunda olduğunu şart koşmadığı sürece, başlık parası oğlanın parasından karşılanır. Bu evlilik, oğlan reşit değilse ve babasının vesayeti altındaysa geçerlidir. {cite:muwatta-maruf-1997 s.32}"
  id: "Malik mengatakan mengenai seorang pria yang menikahkan putranya yang masih muda dan tidak memiliki uang, bahwa mahar menjadi tanggung jawab ayah jika anak laki-laki tersebut tidak memiliki uang pada hari pernikahan. Jika anak laki-laki tersebut memiliki uang, maka mahar berasal dari uangnya, kecuali jika ayah menetapkan bahwa mahar adalah tanggung jawabnya. Pernikahan ini sah bagi anak laki-laki tersebut jika ia masih di bawah umur dan berada di bawah perwalian ayahnya. {cite:muwatta-maruf-1997 p.32}"
