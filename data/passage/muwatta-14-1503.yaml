label: { ar: "الموطأ 1503 — مالك: الرجل يزوج ابنه الصغير الذي لا مال له، فالصداق على أبيه إلا أن يسمي الأب أن الصداق عليه", en: "Muwatta 1503" }
summary:
  ar: "يقول مالك في الرجل يزوج ابنه صغيرا لا مال له، إن الصداق على أبيه إذا كان الغلام يوم تزوج لا مال له، وإن كان للغلام مال فالصداق في ماله، إلا أن يسمي الأب أن الصداق عليه، وذلك النكاح ثابت على الابن إذا كان صغيرا وكان في ولاية أبيه. {cite:muwatta-maruf-1997 p.32}"
