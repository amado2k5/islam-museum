text: "… ومسلم:. ومنها : سبُ الرِّيحِ إذا هبَّتْ، بل يسألُ اللهَ خَيْرَها، وخَيْرَ مَا أُرسلَتْ بهِ، ويَعُوذُ باللهِ مِنْ شرِّهَا وشر ما أرسلت به صحيح: أحمد:، وأبو داود:، والترمذي:. ومنها: سبُّ الحُمَّى، نهى عنه، وقال: إنَّهَا تُذْهِبُ خَطَايَا بَنِي آدمَ، كمَا …"
