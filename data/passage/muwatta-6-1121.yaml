label: { ar: "الموطأ 1121 — سعيد بن المسيب: من ساق بدنة تطوعاً فعطبت فنحرها ثم خلى بينها وبين الناس يأكلونها فليس عليه شيء، وإن أكل منها أو أمر من يأكل منها غرمها", en: "Muwatta 1121", es: "Muwatta 1121", fr: "Muwatta 1121", ur: "موطا 1121", tr: "El-Muvatta 1121 — Sa’id ibn al-Musayyab: Kim kurbanlık bir hayvanı kendi isteğiyle sürer ve hayvan yaralanırsa, onu kesip insanların yemesi için bırakırsa, ona bir ceza verilmez. Ancak eğer kendisi ondan yerse veya birine yemesini emrederse, bedelini ödemesi gerekir.", id: "Al-Muwatta 1121 — Sa’id ibn al-Musayyab: Barang siapa yang dengan sukarela menggembalakan hewan kurban dan hewan itu terluka, lalu ia menyembelihnya dan meninggalkannya untuk dimakan orang, maka tidak ada hukuman baginya. Tetapi jika ia memakan sebagian darinya atau memerintahkan seseorang untuk memakan sebagian darinya, maka ia harus membayarnya." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب، أنه قال: من ساق بدنة تطوعاً فعطبت فنحرها، ثم خلى بينها وبين الناس يأكلونها، فليس عليه شيء. وإن أكل منها، أو أمر من يأكل منها، غرمها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1216) وسويد (527). {cite:muwatta-maruf-1997 p.512} {cite:muwatta-maruf-1997 p.513}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn al-Musayyab'dan rivayet ederek şöyle buyurmuştur: \"Kim gönüllü olarak kurbanlık bir hayvanı sürer ve hayvan yaralanırsa, sonra onu kesip insanların yemesi için bırakırsa, hiçbir şeyden sorumlu değildir. Ancak eğer kendisi yerse veya birine yedirirse, bedelini ödemek zorundadır.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1216) ve Suveyd (527) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.512} {cite:muwatta-maruf-1997 s.513}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang juga meriwayatkan dari Sa'id ibn al-Musayyab, yang berkata: \"Jika seseorang dengan sukarela menggembalakan hewan kurban dan hewan itu terluka, lalu ia menyembelihnya dan meninggalkannya untuk dimakan orang, maka ia tidak bertanggung jawab atas apa pun. Tetapi jika ia memakan sebagian darinya, atau memerintahkan seseorang untuk memakannya, maka ia harus membayarnya.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1216) dan Suwayd (527). {cite:muwatta-maruf-1997 p.512} {cite:muwatta-maruf-1997 p.513}"
