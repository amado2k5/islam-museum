label: { ar: "الموطأ 1121 — سعيد بن المسيب: من ساق بدنة تطوعاً فعطبت فنحرها ثم خلى بينها وبين الناس يأكلونها فليس عليه شيء، وإن أكل منها أو أمر من يأكل منها غرمها", en: "Muwatta 1121" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب، أنه قال: من ساق بدنة تطوعاً فعطبت فنحرها، ثم خلى بينها وبين الناس يأكلونها، فليس عليه شيء. وإن أكل منها، أو أمر من يأكل منها، غرمها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1216) وسويد (527). {cite:muwatta-maruf-1997 p.512} {cite:muwatta-maruf-1997 p.513}"
