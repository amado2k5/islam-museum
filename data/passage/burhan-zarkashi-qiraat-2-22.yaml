text: "البرهان في علوم القرآن فصل في علم التفسير التفسير علم يعرف به فهم كتاب الله المنزل على نبيه محمد وَلِلي، وبيان معانيه، واستخراج أحكامه وحكمه. واستمداد ذلك من: علم اللغة، والنحو، والتصريف، وعلم البيان وأصول الفقه، والقراءات ويحتاج لمعرفة أسباب …"
summary:
