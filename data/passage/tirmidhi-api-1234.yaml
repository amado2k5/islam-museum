label: { ar: "جامع الترمذي 1234 — ما لا يحل", en: "Jami' al-Tirmidhi 1234 — what is not lawful", ur: "جامع ترمذی 1234 — جو حلال نہیں", es: "Jami' al-Tirmidhi 1234 — lo que no es lícito", fr: "Jami' al-Tirmidhi 1234 — ce qui n'est pas licite" }
text: "… بْنُ شُعَيْبٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، حَتَّى ذَكَرَ عَبْدَ اللَّهِ بْنَ عَمْرٍو أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يَحِلُّ سَلَفٌ وَبَيْعٌ وَلاَ شَرْطَانِ فِي بَيْعٍ وَلاَ رِبْحُ مَا لَمْ يُضْمَنْ وَلاَ بَيْعُ مَا لَيْسَ عِنْدَكَ \". قَالَ أَبُو عِيسَى وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. قَالَ أَبُو عِيسَى حَدِيثُ حَكِيمِ بْنِ حِزَامٍ حَدِيثٌ حَسَنٌ قَدْ رُوِيَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1234، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1234 (The Book on Business), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1234، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1234 (El Libro de los Negocios), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1234 (Le Livre des Affaires), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
