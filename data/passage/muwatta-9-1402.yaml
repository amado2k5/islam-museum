label: { ar: "الموطأ 1402 — مالك: الضحية سنة وليست بواجبة، ولا يحب لمن قوي على ثمنها أن يتركها", en: "Muwatta 1402", es: "Muwatta 1402", fr: "Muwatta 1402", ur: "موطا 1402", tr: "El-Muvatta 1402 — Malik: Kurban sünnettir, farz değildir ve maddi durumu elverişli olanın ihmal etmesi tavsiye edilmez.", id: "Al-Muwatta 1402 — Malik: Kurban adalah sunnah dan bukan kewajiban, dan tidak dianjurkan bagi seseorang yang mampu untuk mengabaikannya." }
summary:
  ar: "يقول مالك الضحية سنة وليست بواجبة، ولا أحب لأحد ممن قوي على ثمنها أن يتركها. {cite:muwatta-maruf-1997 p.627}"
  tr: "Kurbanlık hayvanın sahibi bunun sünnet (tavsiye edilen uygulama) olduğunu, farz olmadığını söylüyor ve maddi durumu elverişli olan birinin bunu ihmal etmesini istemiyorum. {cite:muwatta-maruf-1997 s.627}"
  id: "Pemilik hewan kurban mengatakan bahwa itu adalah Sunnah (praktik yang dianjurkan) dan bukan wajib, dan saya tidak ingin siapa pun yang mampu melakukannya mengabaikannya. {cite:muwatta-maruf-1997 p.627}"
