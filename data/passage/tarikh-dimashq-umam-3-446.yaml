text: "… وقسم لها فكانت من نسائَه، وزعم بعض إني المصطلق أن أباها طلبها فافتداءا من رسول اللّه ثم خطبها فزوجه إِياها، ورجع معه عبد الله بن أبي بن سلول في عصابة من المنافقين، فلما رأوا أن اللّٰه فد نصر البي وأصحابه …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 446، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
