label: { ar: "مسلم 2708 — أعوذ بكلمات الله التامات من شر ما خلق", en: "Muslim 2708 — I seek refuge in God's perfect words", es: "Musulmán 2708 — Busco refugio en las palabras perfectas de Dios.", fr: "Muslim 2708 — Je cherche refuge dans la parole parfaite de Dieu", ur: "مسلم 2708 — میں خدا کے کامل کلمات کی پناہ مانگتا ہوں۔", tr: "Müslim 2708 — Allah'ın mükemmel sözlerine sığınırım, O'nun yarattığı her şeyin şerrinden.", id: "Muslim 2708 — Aku berlindung kepada firman Allah yang sempurna dari kejahatan ciptaan-Nya." }
text: "قالت خولة بنت حكيم السلمية: سمعت رسول الله يقول: من نزل منزلاً ثم قال أعوذ بكلمات الله التامات من شر ما خلق لم يضره شيء حتى يرتحل من منزله ذلك"
summary:
  ar: "رواية خولة بنت حكيم السلمية عن سعد بن أبي وقاص في باب التعوذ بكلمات الله التامات من كتاب الذكر والدعاء في صحيح مسلم؛ ورد النازل في منزل."
  tr: "Sahih Müslim'in Dua ve Yakup Kitabı'ndaki Allah'ın mükemmel sözlerine sığınma bölümünde, Khawla bint Hakim al-Salamiyya'nın Sa'd ibn Abi Waqqas'tan rivayet ettiği hadis; bir eve inen kişinin cevabı."
  id: "Riwayat dari Khawla bint Hakim al-Salamiyya berdasarkan Sa'd bin Abi Waqqas dalam bab tentang mencari perlindungan pada firman Allah yang sempurna dari Kitab Zikir dan Doa dalam Sahih Muslim; jawaban dari orang yang turun ke sebuah rumah."
