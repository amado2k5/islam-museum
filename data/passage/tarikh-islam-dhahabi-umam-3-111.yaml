text: "… بدر رقابَ المشركين والمنافقين، فلم يبق بالمدينة منافقٌ ويهوديّ إلا وهو خاضع عنقُه لوقعة بدر. وكان ذلك يوم الفُرْقان ؛ فرّق اللّٰه بين الشّرْك والإِيمان. وقالت اليهود : تَيَقَّنَّا أنّه النّبيّ الذي نجد نَعْتَه في التوراة. والله، لا يرفع رايةً …"
