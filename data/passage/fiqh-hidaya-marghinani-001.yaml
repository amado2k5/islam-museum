text: "٩٠ باب باب كتاب القاضي إلى القاضي ويقبل كتاب القاضي إلى القاضي في الحقوق، إذا شهد به عنده. فإن شهدوا على خصم حاضر : حكم بالشهادة، وكتب بحكمه. وإن شهدوا به بغير حضرة الخصم : لم يحكم، وكتب بالشهادة؛ ليحكم"
