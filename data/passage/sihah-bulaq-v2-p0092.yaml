text: |-
  •⁦(باب الواد والياء)⁩•
  ٤٩٥
  وسقيته المامشدد للكثرة وسقيته أيضا اذاقلت لهسقاك اللّٰه وكذلك أسقيته قال ذوالرقة
  فازلت أسقى ربعها وأخاطبه• والمساقاة أن يستعمل رحسل رجسلا فى نخيل أوكروم ليقوم.
  باصلاحها على أن يكون لهسهم معلوم مما تغله وتساقى القوم سق كل واحد منهم صاحبه بجمام
  الاناء الذى يسقيان فيه قال طرفة
  وتساق القوم كاسامرة وعلا الخيل دماء كالشقر
  واستقيت من البئر وأسقيت فى القربة وسقيت فيها أيضا قال الشاعر
  وماشنتا خرقاء واهكلاهما • -قى فيهما مستعمل لم تبللا
  يأنبع من عيفيك للتمع كما • تعرفت دارا أونوهمت منزلا
  وسقاية الما معروفة والسقاية التى فى القرآن قالوا الصواع الذى كان الملك يشرب فيه وقول
  الهذلى •مجدّل يتسق جلده دمه • أى يتشرّبه وبروى يتكسى من الكسوة ⁦( لا)⁩
  سلوت عنسه سلوا وسليت عنه بالسكسر سليا مثله والسسلوى طأئرقال الاخفش كم أسمع له
  بواحد قال وهو يشبه أن يكون واحده سلوى مثل بماعنه كما قالواد فلى للواحد والجهاعة
  والساوى العسل وقال الهذلألذمن السلوى اذا مانشورها • ويقال هو فى سلوقمن
  العيش أى فى رغد عن أبى زيد والسلامتصور الجلدة الرقيقة التى يكون فيها الولد من
  المواشى ان نزعت عن وجه القصيل ساعة يولد والاقتدته وكذلك ان انقطع السلافى البطن
  فاذا خرج السلاسلت التاقة وسلم الولدوان انقطع فى بطنهاهلكت وهلك الولد ويقال ناقة
  سلياء اذا افقطع سلاها وسليت الناقة أسليما تسلية اذا نزعت سلاهافهى سلياء وفى المثل
  وقع القوم فى سلاجحل أى فى أمر صعب والجل لا يكون لهسلا وانما يكون للناقة وهذا
  كقولهم أعز من الابلق العقوق ومن بيض الانوق ويقال أيضا انقطع السلافى البطن اذا
  ذهبت الحيلة كما يقال بلغ السكين العظم وسلانى فلان من همى تسلية وأسلانى أى كشفه
  عن وانسلى عنه الهمّ وتسلى بمعنى أى ا:-كشف والسلوانة بالضم خرزة كانواية ولون اذاصب
  عليهاماء المطرفشريه العاشق سلا وقال
  شريت على سلوانة ما مزنة • فلا وجديد العيش يامى ما أسلو
  واسم ذلك الماء السلوان قال رؤبة
  لوأشرب السلوان ماسلت • مابى غنى عنك وان غنيت
  قال الاصمعىّ يقول الرجل لصاحبه سقيقنى سلوة وسلوانا أى طيبت نفسى عنك وقال بعضهم
  السلوان دواء يقاه الحزين فيلووالاطاءيسمونه المفرّح (سما السماميذكر
  ويونث أيضا ويجمع على أسمية وسموات والسماء كل ماعلاك فأظلك ومنه قبل لسقف البيت
  مماء والسمماء المطريقال مازلنا زطاً السماء حتى أتينا كم قال الشاعر
  اذا سقط السماه بأرض قوم • رعيتاهوان كانواغضايا
  ويجمع على أسمية وسمى على فعول قال المجاج* تلفه الرياح والسمى• والسمو الارتفاع
  والعلوة غول منه سموت وسميت مثل علوت وعليت وسلوت وسليت عن ثعلب وفلان لا يساعى.
  وقد علا من ساماه وتساموا أى تساروا وسمالى شخص ارتقع حتى استثبته ونها بصره علا
  قوله فازلت أستى الخ فى سيمة
  بده
  وأسفيه حق كادما أبنه
  تكلمنى أحجاره وملاعيه
