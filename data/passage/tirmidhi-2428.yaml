label:
  ar: "الترمذي 2428 — ألم أجعل لك سمعا وبصرا ومالا وولدا"
  en: "Tirmidhi 2428 — Did I not give you hearing, sight, wealth and children"
  ur: "ترمذی 2428 — کیا میں نے تمہیں سننا، دیکھنا، مال اور اولاد نہیں دی"
  es: "Tirmidhi 2428 — ¿Acaso no os di el oído, la vista, la riqueza y los hijos?"
  fr: "Tirmidhi 2428 — Ne t’ai-je pas donné l’ouïe, la vue, la richesse et des enfants ?"
  tr: "Tirmizi 2428 — Size işitme, görme, mal ve çocuk vermedim mi?"
  id: "Tirmidzi 2428 — Bukankah Aku telah memberimu pendengaran, penglihatan, kekayaan, dan anak-anak?"
text: "يؤتى بالعبد يوم القيامة فيقول الله له ألم أجعل لك سمعا وبصرا ومالا وولدا وسخرت لك الأنعام والحرث وتركتك ترأس وتربع فكنت تظن أنك ملاقي يومك هذا قال فيقول لا . فيقول له اليوم أنساك كما نسيتني . قال أبو …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2428: ألم أجعل لك سمعا وبصرا ومالا وولدا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2428: Did I not give you hearing, sight, wealth and children. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2428: کیا میں نے تمہیں سننا، دیکھنا، مال اور اولاد نہیں دی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 2428: ¿Acaso no os di el oído, la vista, la riqueza y los hijos? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 2428: Ne vous ai-je pas donné l’ouïe, la vue, la richesse et des enfants ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 2428: \"Bukankah Aku telah memberikan kepadamu pendengaran, penglihatan, harta, dan anak-anak?\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
