text: "… بهذا الشّأن، وكتب الكثير، وكان مليح الخطّ، ثقة، ظريفاً صاحب نوادر. قال الدُّبيثيّ : سمعته يقول: كتبتُ القرآن بخطّي مائة وإحدى وعشرين مرّة، منها ختمة تحت ميزاب الكعبة. قال ابن النّجّار: كان ثقةً موصوفاً بالدَّماثة والظُّرْف والتّجمّل والمزاح والدُّعابة. وكان …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 44، ص 255، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, scan volume 44, p. 255, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الاسلام والفاعیۃ المشاہیر والعالم، اسکین جلد 44، ص 255 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
