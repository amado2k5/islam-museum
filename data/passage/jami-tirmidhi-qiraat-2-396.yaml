text: "هذه القراءة لم ينسبها أحد ممن ألف في القراءات إلى أحد القراء العشرة أو غيرهم، وقرأ ابن كثير وحده: أسِنَ مقصوراً على وزن فَعِل، وقرأ الباقون: آسِن بالمد على وزن فَاعِل. انظر التبسير في القراءات السبع لأبي عمرو الداني ص، …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 396، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 396, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 396 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
