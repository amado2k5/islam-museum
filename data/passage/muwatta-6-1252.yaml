label: { ar: "الموطأ 1252 — عطاء الخراساني عن شيخ بسوق البرم بالكوفة عن كعب بن عجرة: جاءني النبي وأنا أنفخ تحت قدر وقد امتلأ رأسي قملا، فأمرني أن أحلق", en: "Muwatta 1252", es: "Muwatta 1252", fr: "Muwatta 1252", ur: "موطا 1252", tr: "El-Muvatta 1252 — Ata’ el-Horasani, Kufa’daki el-Barm çarşısında bir şeyhten, Ka’b ibn ‘Ujrah’tan rivayetle: Peygamber bana bir tencerenin altında üflerken geldi ve başım bitlerle doluydu, bu yüzden bana saçımı tıraş etmemi emretti.", id: "Al-Muwatta 1252 — Ata’ al-Khorasani, berdasarkan riwayat seorang syekh di pasar al-Barm di Kufa, berdasarkan riwayat Ka’b ibn ‘Ujrah: Nabi datang kepadaku ketika aku sedang meniup di bawah panci masak dan kepalaku penuh kutu, lalu beliau memerintahkanku untuk bercukur." }
summary:
  ar: "يروي مالك عن عطاء بن عبد الله الخراساني أنه حدثه شيخ بسوق البرم بالكوفة عن كعب بن عجرة أنه قال جاءني رسول الله وأنا أنفخ تحت قدر لأصحابي، وقد امتلأ رأسي ولحيتي قملا، فأخذ بجبهتي، وقال احلق هذا الشعر، وصم ثلاثة أيام، أو أطعم ستة مساكين، وكان قد علم أنه ليس عنده ما ينسك به. ويذكر المحقق أن ابن عبد البر رأى أن قول من قال إن الشيخ هو عبد الرحمن بن أبي ليلى بعيد. {cite:muwatta-maruf-1997 p.557}"
  tr: "Malik, Ata ibn Abdullah el-Horasani'den rivayetle, Kufa'daki el-Barm çarşısında yaşlı bir adamın, Ka'b ibn Ujrah'tan naklederek kendisine şöyle dediğini aktarır: \"Allah'ın Resulü, ben arkadaşlarım için bir tencerenin altına üflerken yanıma geldi. Başım ve sakalım bit doluydu. Alnımdan tuttu ve 'Bu saçı tıraş et ve üç gün oruç tut ya da altı fakiri doyur' dedi. Çünkü kurban kesecek hiçbir şeyim olmadığını biliyordu.\" Araştırmacı, İbn Abd el-Barr'ın, yaşlı adamın Abd el-Rahman ibn Abi Leyla olduğunu söyleyenlerin ifadesini abartılı bulduğunu belirtir. {cite:muwatta-maruf-1997 s.557}"
  id: "Malik meriwayatkan dari Ata ibn Abdullah al-Khorasani bahwa seorang lelaki tua di pasar al-Barm di Kufa menceritakan kepadanya, dari Ka'b ibn Ujrah, bahwa ia berkata: \"Rasulullah SAW datang kepadaku ketika aku sedang meniup di bawah panci masak untuk para sahabatku, dan kepala serta janggutku penuh kutu. Beliau memegang dahiku dan berkata, 'Cukurlah rambut ini dan berpuasalah selama tiga hari, atau beri makan enam orang miskin,' karena beliau tahu bahwa aku tidak memiliki apa pun untuk melakukan kurban.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr menganggap pernyataan orang-orang yang mengatakan bahwa lelaki tua itu adalah Abd al-Rahman ibn Abi Layla sebagai sesuatu yang mengada-ada. {cite:muwatta-maruf-1997 p.557}"
