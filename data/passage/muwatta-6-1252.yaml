label: { ar: "الموطأ 1252 — عطاء الخراساني عن شيخ بسوق البرم بالكوفة عن كعب بن عجرة: جاءني النبي وأنا أنفخ تحت قدر وقد امتلأ رأسي قملا، فأمرني أن أحلق", en: "Muwatta 1252" }
summary:
  ar: "يروي مالك عن عطاء بن عبد الله الخراساني أنه حدثه شيخ بسوق البرم بالكوفة عن كعب بن عجرة أنه قال جاءني رسول الله وأنا أنفخ تحت قدر لأصحابي، وقد امتلأ رأسي ولحيتي قملا، فأخذ بجبهتي، وقال احلق هذا الشعر، وصم ثلاثة أيام، أو أطعم ستة مساكين، وكان قد علم أنه ليس عنده ما ينسك به. ويذكر المحقق أن ابن عبد البر رأى أن قول من قال إن الشيخ هو عبد الرحمن بن أبي ليلى بعيد. {cite:muwatta-maruf-1997 p.557}"
