summary:
  ar: "أثر يرويه مالك عن أبي نعيم وهب بن كيسان عن جابر بن عبد الله، في باب افتتاح الصلاة: كان جابر يعلّمهم التكبير في الصلاة ويأمرهم أن يكبروا كلما خفضوا ورفعوا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ويحيى القطان عند ابن أبي شيبة. {cite:muwatta-maruf-1997 p.126} {cite:muwatta-maruf-1997 p.127}"
