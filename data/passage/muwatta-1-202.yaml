label: { ar: "الموطأ 202 — جابر يعلمهم التكبير كلما خفضوا ورفعوا", en: "Muwatta 202", es: "Muwatta 202", fr: "Muwatta 202", ur: "موطا 202", tr: "Al-Muwatta 202 — Cabir onlara başlarını eğip kaldırdıkları her seferinde tekbir getirmeyi öğretir.", id: "Al-Muwatta 202 — Jabir mengajarkan mereka untuk mengucapkan Takbir setiap kali mereka menundukkan dan mengangkat kepala mereka" }
summary:
  ar: "أثر يرويه مالك عن أبي نعيم وهب بن كيسان عن جابر بن عبد الله، في باب افتتاح الصلاة: كان جابر يعلّمهم التكبير في الصلاة ويأمرهم أن يكبروا كلما خفضوا ورفعوا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ويحيى القطان عند ابن أبي شيبة. {cite:muwatta-maruf-1997 p.126} {cite:muwatta-maruf-1997 p.127}"
  tr: "Malik'in, Ebu Nu'aym Vahb ibn Kaysan'dan, o da Cabir ibn Abdullah'tan rivayet ettiği, namazın başlangıcı bölümündeki bir rivayete göre: Cabir onlara namazda tekbir getirmeyi (\"Allahu Ekber\") öğretir ve secdeye eğildiklerinde veya kalktıklarında bunu söylemelerini tembih ederdi. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd, Abdül-Razzak, Muhammed ibn el-Hasan ve Yahya el-Kattan tarafından, İbn Abi Şeybe'nin de kaydıyla nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.126} {cite:muwatta-maruf-1997 s.127}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Abu Nu'aym Wahb ibn Kaysan dari Jabir ibn Abdullah, dalam surah tentang pembukaan salat: Jabir biasa mengajari mereka takbir (mengucapkan \"Allahu Akbar\") dalam salat dan menginstruksikan mereka untuk mengucapkannya setiap kali mereka menurunkan atau mengangkat diri. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, Abd al-Razzaq, Muhammad ibn al-Hasan, dan Yahya al-Qattan, sebagaimana dicatat oleh Ibn Abi Shaybah. {cite:muwatta-maruf-1997 p.126} {cite:muwatta-maruf-1997 p.127}"
