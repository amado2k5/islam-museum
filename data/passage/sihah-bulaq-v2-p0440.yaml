text: |-
  *دك)•
  ١٤٧
  على الرحل اليمنى وأماحديث ابراهيم أنه كان يكره التور ل فى الصلاة فاغمايريد وضع
  الاليتين أواحداهما على الارض ومنه الحديث الآخرنهى أن يسهد الرجل مئوركا
  وتورتك لى الدابة أى ثى رجله ووضع احدى وركيه فى السرح وكذلك التوريك وبورّتكت
  المرأة الصيّ اذا حاته على وركها قال الاصمعى ورّكت الجبل تور يكا أى جاوزته ووركته
  وركاأى جعلته حبال وركى -كاه عنه أبو عبيد فى المصنف قال زهير
  ووركن فى السوبان يعلون متنه • عليهن دلالناعم المتنعم
  ويقسال ورّكن أى ءدلى وورّك فلان ذنبه على غيره أى قرفه به وانه لمور فى هذا الامر أى
  ليس له فيه ذنب وقولهم هذه ذعل موركة بتسكين ألوا وومورك أيضاعن أبي عبيداذا كانت
  من الورك يعنى نعل الخف وقال أبو عبيدة المورك والموركة الموضع الذى يثى الراكب رجله
  عليه قدام واسطة الرحل اذا-ل من الركوب قال والوراك المرقة التى تلبس مقدّم الرح-ل ثم
  نقنى تحته يزين بها والجمع ورك قال زهير
  مقورة تتبارى لاشوارلها • الا القطوع على الاجواز والورل
  ⁦( وشك)⁩ قواهم وشئ ذاخر وبا بالضم يوشك وشكا أى سرع وعجبت من وشك ذلك الامر
  ووشك ذللن الامريضم الواو ومن وشكان ذلت الامر ووشكان ذلات الامرأى من سرعته
  عن يعدة وب ويقال وشكان ذاخر وجا أى عجلان ووشك البين سرعة الفراق وخرج وشيكا
  أى سريعا وامرأة وشيك وقد أوشك فلان يوشك ايشا كاأى أسرع السير ومنه قولهم
  وشك أن يكون كذا قال جرير بهجو العباس بن يزيد الكندىّ
  اذا جهل الشقىّ ولم يقدر * ببعض الامر أوشك أن يصابا
  والعامنق ول يوثك بفتح الشين وهى لغة رديئة قال أبويو-ف واشك يواشك وشكانامثل
  أوشك يقال انهم واشك مستعجل أى مسارع وقال أحدين يحي ثعلب هذا يقال بهذا اللفظ
  ولايقال منه واشك عسك الوعل مغث الحى وقد وعكته الحى فهوموعوك
  وأوعكت الكلاب الصيد اذامرّغمه فى التراب وأوعكت الابل عند الحوض ازدحت فركب
  بعضها بعضا والاسممنه الوعكة والوعكة السقطة الشديدة فى الجرى والوعكة أيضامعركة
  الابطال اذا أخذ بعضهم بعضا ( كك الوكوالاالجبان قالت امر أفترتى زوجها
  ولست يوكواك ولا بزونك • مكانت حتى يعث الخلق باعنه
  صل الاساء تث الهتك خرق الستر عما وراءه وقد هتكد فانهتك وهتك
  الاستارشذد للسكثرة والاسم الهتكة بالضم وتهذك أى اقتضح دك) الهنادكة الهنود
  والكاف زائدة نسبوا الى الهند على غير قياس ⁦(دكان)⁩ قال الاصمعى انهك صلا امرأة
  انه كاكااذا انفرج عفد الولادة ويقال هك فلانا النبيذاذا بلغ منه مثل تكدفانهك والهك تهور
  البئر وحكى ابن الاعرابى حكه بالسيف ضربه لك هلن الشى يهلك هلا كاوهاوكا
  ومهلكاو مها كاومهلمكاوتهلكة والاسم الهلمك بالضم قال اليزيدى التهلسكة من نوادر
  المصادرايست مما يجرى على القماس وأهلكه غيره واستهلكه والمهاكة والمهاسكة المفازة
  وقال أبو عبيد تقيم ذقول هاكه يهلكه هلكا بمعنى أهلكه وأنشد للعجاج
  السوبان اسم واد قال المؤافة
  قوله بتسكين الواوأى كوعدة
  و.ورك أى كوعد كيا فى القامومن
