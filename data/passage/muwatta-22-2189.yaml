label: { ar: "الموطأ 2189 — مالك عن ابن شهاب عن عروة عن عائشة: أن أبا بكر نحلها عشرين وسقا من ماله بالغابة، فلما حضرته الوفاة قال: يا بنية، ما من الناس أحد أحب إلي غنى بعدي منك، ولو كنت جددته واحتزته كان لك، وإنما هو اليوم مال وارث", en: "Muwatta 2189" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أن أبا بكر الصديق كان نحلها جاد عشرين وسقا من ماله بالغابة. فلما حضرته الوفاة قال: والله يا بنية، ما من الناس أحد أحب إلي غنى بعدي منك، ولا أعز علي فقرا بعدي منك، وإني كنت نحلتك جاد عشرين وسقا، فلو كنت جددته واحتزته كان لك، وإنما هو اليوم مال وارث، وإنما هما أخواك وأختاك، فاقتسموه على كتاب الله. قالت عائشة: فقلت يا أبت، والله لو كان كذا وكذا لتركته، إنما هي أسماء، فمن الأخرى؟ فقال أبو بكر: ذو بطن بنت خارجة، أراها جارية. {cite:muwatta-maruf-1997 p.298} {cite:muwatta-maruf-1997 p.299}"
