label: { ar: "الموطأ 2189 — مالك عن ابن شهاب عن عروة عن عائشة: أن أبا بكر نحلها عشرين وسقا من ماله بالغابة، فلما حضرته الوفاة قال: يا بنية، ما من الناس أحد أحب إلي غنى بعدي منك، ولو كنت جددته واحتزته كان لك، وإنما هو اليوم مال وارث", en: "Muwatta 2189", es: "Muwatta 2189", fr: "Muwatta 2189", ur: "موطا 2189", tr: "El-Muvatta 2189 — Malik, İbn Şihab'dan, Urve'den, Aişe'den rivayetle: Ebu Bekir, ona El-Gabah'ta yirmi vask malını verdi. Ölüm ona yaklaşınca şöyle dedi: “Ey kızım, benden sonra senin malından daha çok seveceğim kimse yok. Eğer onu yenileyip edinmiş olsaydın, senin olurdu, fakat bugün bir varisin malı oldu.”", id: "Al-Muwatta 2189 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Urwah, berdasarkan riwayat Aisyah: bahwa Abu Bakar memberikan dua puluh wasq dari hartanya kepada putrinya di Al-Ghabah. Ketika ajal menjemputnya, beliau berkata: “Wahai putriku, tidak ada seorang pun di antara manusia yang hartanya setelahku lebih kucintai daripada hartamu. Sekiranya engkau memperbaruinya dan memperolehnya, tentu itu akan menjadi milikmu, tetapi hari ini harta itu menjadi milik ahli waris.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أن أبا بكر الصديق كان نحلها جاد عشرين وسقا من ماله بالغابة. فلما حضرته الوفاة قال: والله يا بنية، ما من الناس أحد أحب إلي غنى بعدي منك، ولا أعز علي فقرا بعدي منك، وإني كنت نحلتك جاد عشرين وسقا، فلو كنت جددته واحتزته كان لك، وإنما هو اليوم مال وارث، وإنما هما أخواك وأختاك، فاقتسموه على كتاب الله. قالت عائشة: فقلت يا أبت، والله لو كان كذا وكذا لتركته، إنما هي أسماء، فمن الأخرى؟ فقال أبو بكر: ذو بطن بنت خارجة، أراها جارية. {cite:muwatta-maruf-1997 p.298} {cite:muwatta-maruf-1997 p.299}"
  tr: "Malik, İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Aişe'den rivayet eder ki, Ebu Bekir es-Siddik, Gaba'daki malından Aişe'ye yirmi vask hurma vermişti. Ölüm yaklaşınca şöyle dedi: \"Allah'a yemin ederim ki, kızım, ölümümden sonra malı sana tercih edeceğim, yoksulluğuna da senin için üzüleceğim kimse yok. Sana yirmi vask hurma vermiştim, eğer onları hasat edip toplasaydın senin olurdu. Ama bugün bu bir varisin malı ve sadece iki erkek ve iki kız kardeşin var, Allah'ın Kitabına göre bölüştür.\" Aişe dedi ki: \"Dedim ki: 'Ey babam, Allah'a yemin ederim ki, eğer şu veya bu olsaydı, onu bırakırdım. Sadece Esma var, peki diğeri kim?' Ebu Bekir dedi ki: 'Hariye'nin kızının karnına sahip olan, sanırım o bir kız.'\""
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Aisyah, bahwa Abu Bakar al-Siddiq telah memberikan kepadanya dua puluh wasq kurma dari hartanya di al-Ghaba. Ketika ajal menjemputnya, ia berkata: “Demi Allah, putriku, tidak ada seorang pun di antara manusia yang kekayaannya setelah kematianku akan kuutamakan darimu, dan tidak ada seorang pun yang kemiskinannya setelah kematianku akan kusesali untukmu. Aku telah memberimu dua puluh wasq kurma, dan jika kau telah memanen dan mengumpulkannya, itu akan menjadi milikmu. Tetapi hari ini itu adalah milik seorang ahli waris, dan hanya ada dua saudara laki-laki dan dua saudara perempuanmu, maka bagilah sesuai dengan Kitab Allah.” Aisyah berkata: “Aku berkata, ‘Wahai ayahku, demi Allah, jika itu begini dan begitu, aku akan meninggalkannya. Itu hanya Asma’, lalu siapa yang lain?’ Abu Bakar berkata: ‘Yang perutnya seperti anak perempuan Kharijah, kurasa dia perempuan.’”"
