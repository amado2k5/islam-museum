label: { ar: "الموطأ 2338 — مالك: المكاتب يموت وعليه بقية وقد ترك أم ولد", en: "Muwatta 2338", es: "Muwatta 2338", fr: "Muwatta 2338", ur: "موطا 2338", tr: "El-Muvatta 2338 — Malik: Azat sözleşmesi bulunan bir köle, ödenmemiş borçları varken ölür ve geride kendisine bir çocuk doğurmuş bir cariye bırakır." }
summary:
  ar: "قال مالك في رجل يكاتب عبده، ثم يموت المكاتب وقد بقيت عليه بقية من كتابته، وترك أم ولد، ولم يترك وفاء بما عليه: إن أم ولده أمة مملوكة حين لم يُعتق المكاتب حتى مات، فيُعتقون بأداء ما بقي، فتُعتق أم ولد أبيهم بعتقهم. {cite:muwatta-maruf-1997 p.363} {cite:muwatta-maruf-1997 p.364}"
  tr: "Malik, kölesiyle azat sözleşmesi yapan bir adam hakkında şöyle demiştir: Köle, kararlaştırılan bedelin bir kısmı ödenmeden ölmüş, geride bir cariye bırakmış ancak kalan borcu ödeyecek imkanı kalmamıştır: Cariye, köle azat edilene kadar köle olarak kalır ve kalan miktar ödenince azat edilir. Dolayısıyla cariye, babasının azatıyla özgür kalır. {cite:muwatta-maruf-1997 s.363} {cite:muwatta-maruf-1997 s.364}"
  id: "Malik berkata mengenai seorang pria yang mengadakan perjanjian pembebasan dengan budaknya, kemudian budak itu meninggal dengan sebagian dari harga yang disepakati masih tersisa, meninggalkan seorang selir tetapi tanpa sarana untuk memenuhi kewajiban yang tersisa: Selir itu tetap menjadi budak sampai budak itu dibebaskan, dan mereka dibebaskan setelah pembayaran jumlah yang tersisa. Dengan demikian, selir itu dibebaskan oleh pembebasan ayahnya. {cite:muwatta-maruf-1997 p.363} {cite:muwatta-maruf-1997 p.364}"
