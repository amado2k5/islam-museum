label: { ar: "الموطأ 2338 — مالك: المكاتب يموت وعليه بقية وقد ترك أم ولد", en: "Muwatta 2338" }
summary:
  ar: "قال مالك في رجل يكاتب عبده، ثم يموت المكاتب وقد بقيت عليه بقية من كتابته، وترك أم ولد، ولم يترك وفاء بما عليه: إن أم ولده أمة مملوكة حين لم يُعتق المكاتب حتى مات، فيُعتقون بأداء ما بقي، فتُعتق أم ولد أبيهم بعتقهم. {cite:muwatta-maruf-1997 p.363} {cite:muwatta-maruf-1997 p.364}"
