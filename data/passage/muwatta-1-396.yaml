label: { ar: "الموطأ 396 — ابن عمر يقصر في مسيره اليوم التام", en: "Muwatta 396", es: "Muwatta 396", fr: "Muwatta 396", ur: "موطا 396", tr: "El-Muvatta 396 — İbn Ömer, tam gün süren bir yolculuk sırasında namazlarını kısaltıyor.", id: "Al-Muwatta 396 — Ibnu Umar mempersingkat salatnya selama perjalanan seharian penuh" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سالم بن عبد الله أن عبد الله بن عمر كان يقصر الصلاة في مسيره اليوم التام؛ وهو في باب ما يجب فيه قصر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأن عبد الرزاق وابن أبي شيبة أخرجاه من غير طريق مالك. {cite:muwatta-maruf-1997 p.211}"
  tr: "Malik'in İbn Şihab'tan, o da Salim ibn Abdullah'tan rivayet ettiği bir hadiste, Abdullah ibn Ömer'in tam gün süren yolculuklarda namazlarını kısalttığı belirtilmektedir; bu, namazları kısaltmanın farz olduğu haller bölümünde yer almaktadır. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Beyhaki tarafından kaydedildiğini ve Abdülrazzak ile İbn Abi Şeybe'nin de Malik'inkinden farklı rivayet zincirleriyle naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.211}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Ibn Shihab atas otoritas Salim ibn Abdullah menyatakan bahwa Abdullah ibn Umar biasa mempersingkat salatnya selama perjalanan seharian penuh; ini termasuk dalam bab tentang situasi di mana mempersingkat salat adalah wajib. Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi, dan bahwa Abd al-Razzaq dan Ibn Abi Shaybah meriwayatkannya melalui sanad selain sanad Malik. {cite:muwatta-maruf-1997 p.211}"
