label: { ar: "الموطأ 396 — ابن عمر يقصر في مسيره اليوم التام", en: "Muwatta 396" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سالم بن عبد الله أن عبد الله بن عمر كان يقصر الصلاة في مسيره اليوم التام؛ وهو في باب ما يجب فيه قصر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأن عبد الرزاق وابن أبي شيبة أخرجاه من غير طريق مالك. {cite:muwatta-maruf-1997 p.211}"
