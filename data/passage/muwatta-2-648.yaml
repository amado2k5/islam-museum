label: { ar: "الموطأ 648 — أبو قتادة: مستريح ومستراح منه؛ المؤمن يستريح من نصب الدنيا، والفاجر يستريح منه العباد والبلاد", en: "Muwatta 648" }
text: "العبد المؤمن يستريح من نصب الدنيا وأذاها، إلى رحمة الله. والعبد الفاجر يستريح منه العباد والبلاد والشجر والدواب"
summary:
  ar: "يرويه مالك عن محمد بن عمرو بن حلحلة الديلي عن معبد بن كعب بن مالك عن أبي قتادة بن ربعي، أنه كان يحدث أن النبي مُر عليه بجنازة فقال: مستريح ومستراح منه. فسألوه عن المستريح والمستراح منه، فقال: العبد المؤمن يستريح من نصب الدنيا وأذاها إلى رحمة الله، والعبد الفاجر يستريح منه العباد والبلاد والشجر والدواب. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع عند الدارقطني في اختلاف الموطآت والبيهقي، وإسماعيل بن أبي أويس عند البخاري (6534)، وسويد، والقعنبي، وابن القاسم، وابن مهدي عند أحمد، وقتيبة عند مسلم (3/54) والنسائي (4/48). {cite:muwatta-maruf-1997 p.330}"
