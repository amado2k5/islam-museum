text: "… قال: قال رسول اللّٰه يَافي : لا يَنْكِحُ المُحْرِمُ وَلاَ يُنْكَحُ. هل تزوج ميمونة وهو واختُلِفَ عنه وَلفي، هل تزوَّج ميمونةَ حلالاً أو حراماً؟ فقال ابنُ عباس : معترم؟ انظر، أخرجه البخاري في تفسير سورة المائدة: باب لا تحرموا طيبات …"
summary:
