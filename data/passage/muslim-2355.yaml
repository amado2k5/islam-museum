text: "قال رسول الله: «إن لي أسماء: أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشر الذي يحشر الناس على قدمي، وأنا العاقب الذي ليس بعده نبي»"
summary:
  ar: "رواية جبير بن مطعم في باب أسماء النبي من كتاب الفضائل بصحيح مسلم؛ خمسة أسماء نبوية تجمع الدعوة والفناء على الكفر والحشر وختم النبوة."
  tr: "Sahih Müslim'in Faziletler Kitabı'ndaki Peygamberin İsimleri bölümünde Cübeyr ibn Mut'im'in rivayetine göre; daveti, küfrün yok edilmesini, dirilişi ve peygamberliğin sonunu birleştiren beş peygamber ismi."
  id: "Riwayat Jubayr ibn Mut’im dalam bab tentang nama-nama Nabi dalam Kitab Keutamaan di Sahih Muslim; lima nama kenabian yang menggabungkan seruan dan penghancuran kekafiran, kebangkitan dan penutup kenabian."
