text: "قال رسول الله: «إن لي أسماء: أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشر الذي يحشر الناس على قدمي، وأنا العاقب الذي ليس بعده نبي»"
summary:
  ar: "رواية جبير بن مطعم في باب أسماء النبي من كتاب الفضائل بصحيح مسلم؛ خمسة أسماء نبوية تجمع الدعوة والفناء على الكفر والحشر وختم النبوة."
