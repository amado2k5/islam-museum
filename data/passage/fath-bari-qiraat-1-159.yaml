text: "… ثَابِتَ فِي شَيْءٍ مِنَ القُرْآنِ فَاكْتُبُوهُ بِلِسَانِ قُرَيشٍ فَإِنَّمَا نَزَلَ بِلسَانِهِم. فَفَعَلُوا ذِلَك. الحديث:، طرفاه في :، قوله : باب نزل القرآن بلسان قريش أورد فيه طرفًا من حديث أنس في أمر عثمان بكتابة المصاحف، وسيأتي مبسوطًا مشروحًا في فضائل …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 159، يذكر جمع القرآن والمصاحف، ورسم المصحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 1, p. 159, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 1، ص 159 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 1, pág. 159, que menciona la colección del Corán y los códices, la ortografía del mushaf, los alfabetos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Fath al-Bari d'Ibn Hajar (tome 1, p. 159) évoquant la compilation du Coran et des codex, l'orthographe du mushaf, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hacer'in Fethü'l-Bari adlı eserinin 1. resimli cildinin 159. sayfasından bir alıntı, Kur'an'ın derlenmesini ve el yazmalarını, Kur'an'ın yazısını ve çeşitli hat sanatı stillerini ve yazım yöntemlerini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, jilid 1 bergambar, halaman 159, membahas penyusunan Al-Qur'an dan manuskripnya, aksara Al-Qur'an, serta berbagai gaya kaligrafi dan metode penulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
