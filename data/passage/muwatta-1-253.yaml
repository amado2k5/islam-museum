label: { ar: "الموطأ 253 — ابن عمر: من شك فليتوخ الذي يظن أنه نسي", en: "Muwatta 253" }
text: "إذا شك أحدكم في صلاته فليتوخ الذي يظن أنه نسي من صلاته فليصله، ثم ليسجد سجدتي السهو وهو جالس"
summary:
  ar: "أثر يرويه مالك عن عمر بن محمد بن زيد عن سالم بن عبد الله، في باب إتمام المصلي ما ذكر إذا شك في صلاته: كان عبد الله بن عمر يقول إن من شك في صلاته فليتحرّ ما يظن أنه نسيه فليصله، ثم ليسجد سجدتي السهو وهو جالس. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرجه عن معمر عن الزهري عن سالم بنحوه. {cite:muwatta-maruf-1997 p.151}"
