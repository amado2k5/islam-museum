label: { ar: "الموطأ 253 — ابن عمر: من شك فليتوخ الذي يظن أنه نسي", en: "Muwatta 253", es: "Muwatta 253", fr: "Muwatta 253", ur: "موطا 253", tr: "El-Muvatta 253 — İbn Ömer: Şüpheye düşen kimse unuttuğunu sandığı seçeneği tercih etsin.", id: "Al-Muwatta 253 — Ibn Umar: Barangsiapa yang ragu, hendaklah ia memilih yang menurutnya telah ia lupakan." }
text: "إذا شك أحدكم في صلاته فليتوخ الذي يظن أنه نسي من صلاته فليصله، ثم ليسجد سجدتي السهو وهو جالس"
summary:
  ar: "أثر يرويه مالك عن عمر بن محمد بن زيد عن سالم بن عبد الله، في باب إتمام المصلي ما ذكر إذا شك في صلاته: كان عبد الله بن عمر يقول إن من شك في صلاته فليتحرّ ما يظن أنه نسيه فليصله، ثم ليسجد سجدتي السهو وهو جالس. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرجه عن معمر عن الزهري عن سالم بنحوه. {cite:muwatta-maruf-1997 p.151}"
  tr: "Malik'in, Ömer ibn Muhammed ibn Zeyd'den, o da Salim ibn Abdullah'tan rivayet ettiği, namazda unutulanı tamamlama bölümünde yer alan bir hadiste şöyle denmektedir: Abdullah ibn Ömer, namazında şüpheye düşen kimsenin, unuttuğunu sandığı şeyi hatırlamaya çalışıp onu yerine getirmesi, sonra da oturarak iki secde yapması gerektiğini söylerdi. Araştırmacı, bu hadisin Malik'ten Ebu Musab, Suveyd ve Yahya ibn Bukayr tarafından el-Beyhaki'nin derlemesinde nakledildiğini ve Abd el-Razzaq'ın da Ma'mar'dan, o da el-Zuhri'den, o da Salim'den benzer şekilde rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.151}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Umar ibn Muhammad ibn Zayd atas otoritas Salim ibn Abdullah, dalam bab tentang melengkapi apa yang terlupakan dalam salat: Abdullah ibn Umar biasa berkata bahwa siapa pun yang ragu dalam salatnya hendaknya berusaha menentukan apa yang menurutnya telah terlupakan dan melaksanakannya, kemudian melakukan dua sujud lupa sambil duduk. Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Musab, Suwayd, dan Yahya ibn Bukayr dalam kumpulan al-Bayhaqi, dan bahwa Abd al-Razzaq meriwayatkannya atas otoritas Ma'mar atas otoritas al-Zuhri atas otoritas Salim dengan cara yang serupa. {cite:muwatta-maruf-1997 p.151}"
