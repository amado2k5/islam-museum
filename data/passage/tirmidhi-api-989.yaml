label: { ar: "جامع الترمذي 989 — بكاء على ميت أو نياحة وحدودها", en: "Jami' al-Tirmidhi 989 — weeping over the dead, or wailing and its limits", ur: "جامع الترمذی۔ 989 — میت پر رونا، یا نوحہ اور اس کی حدود", fr: "Jami' al-Tirmidhi 989 — des pleurs sur un défunt, ou la lamentation et ses limites", es: "Jami' al-Tirmidhi 989 — llanto por un difunto, o el lamento y sus límites" }
text: "… حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، حَدَّثَنَا سُفْيَانُ، عَنْ عَاصِمِ بْنِ عُبَيْدِ اللَّهِ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ عَائِشَةَ، أَنَّ النَّبِيَّ قَبَّلَ عُثْمَانَ بْنَ مَظْعُونٍ وَهُوَ مَيِّتٌ وَهُوَ يَبْكِي. أَوْ قَالَ عَيْنَاهُ تَذْرِفَانِ. وَفِي الْبَابِ عَنِ ابْنِ عَبَّاسٍ وَجَابِرٍ وَعَائِشَةَ قَالُوا إِنَّ أَبَا بَكْرٍ قَبَّلَ النَّبِيَّ وَهُوَ مَيِّتٌ. قَالَ أَبُو عِيسَى حَدِيثُ عَائِشَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 989، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 989 (The Book on Jana''iz (Funerals)), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "جامع الترمذی۔ کی حدیث نمبر 989، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Jami' al-Tirmidhi, n° 989, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Jami' al-Tirmidhi, n.º 989, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
