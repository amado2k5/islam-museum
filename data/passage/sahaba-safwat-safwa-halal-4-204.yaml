text: "… وآمنا به فعبدنا اللّٰه كنك وحده فلم نشرك به شيئاً، وحرمنا ما حرم علينا وأحللنا ما أحل لنا فعدا علينا قومنا فعذبونا وفتنونا على ديننا ليردونا إلى عبادة الأوثان وأن نستحل ما كنا نستحل من الخبائث. فلما قهرونا وظلمونا وشقوا …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 204، يذكر ما أُحل، واستحلال الشيء، وما حُرّم، والخبائث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 204, that mentions what was made lawful, treating a thing as lawful, what was made unlawful, the foul things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 204 کا اقتباس جس میں جو حلال کیا گیا، کسی چیز کو حلال ٹھہرانا، جو حرام کیا گیا، خبیث چیزیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 4, pág. 204, que menciona lo que se hizo lícito, lo que se consideró lícito, lo que se hizo ilícito y las cosas impuras; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi, volume 4, page 204, mentionnant ce qui a été rendu licite, la manière de considérer une chose comme licite, et ce qui a été rendu illicite, les choses impures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Le Halal and Haram Browser le répertorie."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 4. cildinin 204. sayfasından bir alıntı; helal olan, bir şeyin helalliği, haram olan ve necis olan şeyleri ele almaktadır; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Sifat al-Safwa\" karya Ibn al-Jawzi, Jilid 4, halaman 204, membahas tentang apa yang diperbolehkan, kebolehan sesuatu, apa yang dilarang, dan hal-hal yang najis; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
