text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، أَنَّهُ كَانَ يَقُولُ فِي حَمَامِ مَكَّةَ إِذَا قُتِلَ شَاةٌ. وَقَالَ مَالِكٌ فِي الرَّجُلِ مِنْ أَهْلِ مَكَّةَ يُحْرِمُ بِالْحَجِّ أَوِ الْعُمْرَةِ وَفِي بَيْتِهِ فِرَاخٌ مِنْ حَمَامِ مَكَّةَ فَيُغْلَقُ عَلَيْهَا فَتَمُوتُ فَقَالَ أَرَى بِأَنْ يَفْدِيَ ذَلِكَ عَنْ كُلِّ فَرْخٍ بِشَاةٍ. قَالَ مَالِكٌ لَمْ أَزَلْ أَسْمَعُ أَنَّ …"
summary:
  ar: "حديث في موطأ مالك، رقم 937، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 937 (Hajj), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "موطأ مالک کی حدیث نمبر 937، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
