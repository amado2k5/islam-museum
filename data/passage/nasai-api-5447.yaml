label: { ar: "سنن النسائي 5447 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 5447 — the father raising and counselling", ur: "سنن نسائی 5447 — باپ کی تربیت اور نصیحت", es: "Sunan al-Nasa'i 5447 — El padre que cría y aconseja", fr: "Sunan al-Nasa'i 5447 — l'éducation et les conseils du père", tr: "Sunan an-Nasa'i 5447 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan an-Nasa'i 5447 — Didikan dan Wasiat Ayah" }
text: "… مَيْمُونٍ الأَوْدِيِّ، قَالَ كَانَ سَعْدٌ يُعَلِّمُ بَنِيهِ هَؤُلاَءِ الْكَلِمَاتِ كَمَا يُعَلِّمُ الْمُعَلِّمُ الْغِلْمَانَ وَيَقُولُ إِنَّ رَسُولَ اللَّهِ كَانَ يَتَعَوَّذُ بِهِنَّ دُبُرَ الصَّلاَةِ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ \". فَحَدَّثْتُ بِهَا مُصْعَبًا فَصَدَّقَهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 5447، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5447 (The Book of Seeking Refuge with Allah), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5447، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5447 (El Libro de la Búsqueda de Refugio en Alá), menciona la crianza y el consejo paternos. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5447 (Le Livre de la recherche de refuge auprès d'Allah), mentionne le rôle du père dans l'éducation et le soutien des enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 5447 numaralı hadis, babanın yetiştirilmesi ve öğütlerinden bahsetmektedir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5447, menyebutkan tentang didikan dan nasihat seorang ayah. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
