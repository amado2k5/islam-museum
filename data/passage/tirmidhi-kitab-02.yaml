summary:
  ar: "القسم 2 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصلاة»، ويضم فيها النصوص من 149 إلى 451 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 2 of Jami' al-Tirmidhi (The Book on Salat (Prayer)) in the division of the open hadith dataset the museum took its reports from: reports 149 to 451 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 2، عنوان «کتاب الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 149 تا 451۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 2 de Jami' al-Tirmidhi (El libro sobre la oración) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 149 al 451, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du recueil ouvert Jami' al-Tirmidhi (Livre sur la Salat, ou prière) dans son deuxième livre: les hadiths 149 à 451 de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
