text: |-
  ٢r.
  ⁦(باب الكاف)⁩
  ⁦(عر)⁩
  فقيث أنت للضركاه منا • بسيبك حين تجدأ وتغور
  وقال أيضا
  اذ لا تبض الى التراتك والضرائك كف بازر
  كان الضكفكة ضرب من المشى فيه سرعة ورجل ضكضال أى قصير وامرأة
  ضكضاكة مكتنزة اللعم مك ) قال الكسائى اضمأكت الارض واضبأكت أيضا
  افهكا كااذاخرج بتها وقال أبوزيد افمأك التيت اذاروى واخضر (ضنك الضنك
  الضيق والضنال بالفتح المرأة المكتهرة والضفال بالضم الزكام ورجل مضنوك أى من كوم
  صل الحين) بك اذقت عبكة ولالبكة فالعبكة مثل الحبكة وهى الحبة من
  السويق واللبكة قطعة تريد . ومافى النحى عبكة أى شئ من السمن مثل عبقة ومنه قولهم
  ماآ باليه عبكة عتك عتك به الطليب أى لرقبه وعمك البول على فحذ الناقة أى يبسر
  والعاذكة القوس اذا قدمت واحرّت وعاتكة من أسماء النساء قال النيّصلى اللّٰه عليه وسا
  يوم حنين أنا ابن العواتك من سليمٍ بهعه حدّانه وهنّ نسعءواتك عائمكة بذت هلال أمّ جد
  هما شم وعائمكة بذت مرّة بن هلال أمّ هاشم وعاتمكة بنت الاوقص بن مرّة بن هلال أمّ وهب
  ابن عبد مناف بن زهرة جدرسول اللّٰه صلى اللّٰه عليه وسلم من قبل أمه آمنة بنت وهب وسائر
  العواتك أمهات النبىّ"صلى اللّٰه عليه وس-لم من غير بى سليم وعيدك حىّ من العرب ومنهم
  فلان العشكى" (عرك عركت الشى أعركد عركاد لكته وعرله البعير جنبه بمرفقه وعركت
  القوم فى الحرب عركاوالمعاركة القتال والمعترك موضع الحرب وكذلك المعرك والمعركة
  والمعركة أيضابضم الراء واعتركوا أى ازدس وافى المعترك ويقال أورد ابله العراك اذا
  أورد ها ججيعا الاء ونصب نصب المصادر أى أوردهاء راكاثم أدخل عليه الالف واللام كما قالوا
  حروت بهم الجاء الغفير والحد للّٰه فيمن نصب ولم تغير الالف واللام المصدر عن حاله قال لبيد
  يصف الحاروالاتن فاوردها العر الكولم يذدها * ولم يشفق على نغص الدخال
  ابن السكيت يقال هي عريكة السنام لبقيته والعريكة الطبيعة وفلان لين العريكة اذا كان
  ملسا ويقال لانت ءريكنه اذا افكسرت نخوته والعرول من الذوق مثل الشكوك وعركت
  السنام اذا المسسته تنظر أبه طرق أم لا وماء مع روك مز دحم عليه وأرض معروكة عركتها
  الساءة حتى أجدبت وعركت المرأة تعركء ,وكاأى حاضت ومنه قول الشاعر
  وهى شمطاءعارك . قال أبو عمر والعرك الذين بصيدون السمك واحدهم عركىّ مثل عرب
  وعربىّ وانماقيل للملاحين عرل لانهم يصيدون السمك قال وليس أنّ العركًا سم للملاحين
  قال زهير تغنى الحداة جم -ز الكنيب كما • يغشى السفائن موج اللجة العرك
  ورواه أبو عبيدة موج بارفع وجعل العرك نعتا للموج بعنى المتلاطم والعرك أيضا الصوت
  وكذلك العرك بكسر الراء ورجلءرك أى صريع (دقومءركون أى أشداء صرّاع ويقال
  اقيته عركة بالتسكين أى.رة ولقيته عركات أت مررات والعرككة المرأة الضخمة قال المشاعر
  ومامن هواى ولا شمتى * عركركة ذات لحم زيم
  والعركرك اجهل الغليظ القوى قال الراجز
  أصبر من ذى ضاغط عركوك • ألتى بوانى زوره فى المبرك
  ⁦( عسن )⁩
