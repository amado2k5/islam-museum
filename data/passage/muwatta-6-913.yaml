label: { ar: "الموطأ 913 — سعيد بن المسيب: لا بأس بالمنطقة تلبس تحت الثياب للمحرم إذا جعل في طرفيها جميعاً سيوراً يعقد بعضها إلى بعض، وهذا أحب ما سمع مالك إليه", en: "Muwatta 913", es: "Muwatta 913", fr: "Muwatta 913", ur: "موطا 913", tr: "El-Muvatta 913 — Sa’id ibn al-Musayyab: İhramda olan hacıların, iki ucundan birbirine bağlanan kayışları olan bir kemer takmasında bir sakınca yoktur. Malik de bunu tercih etmiştir.", id: "Al-Muwatta 913 — Sa’id ibn al-Musayyab: Tidak ada salahnya mengenakan ikat pinggang di bawah pakaian bagi jamaah haji yang sedang ihram jika ikat pinggang tersebut memiliki tali yang diikat bersama di kedua ujungnya. Inilah yang lebih disukai Malik." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول في المنطقة يلبسها المحرم تحت ثيابه: لا بأس بذلك إذا جعل في طرفيها جميعاً سيوراً يعقد بعضها إلى بعض. ويقول مالك: وهذا أحب ما سمعت إلي في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1046) وسويد (490). {cite:muwatta-maruf-1997 p.439}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ederek, Sa'id ibn al-Musayyab'ın hacıların elbiselerinin altına taktığı kemer hakkında şöyle dediğini işitmiştir: \"Eğer iki ucuna da kayışlar takılıp birbirine bağlanırsa bunda bir sakınca yoktur.\" Malik şöyle demiştir: \"Bu konuda duyduğum en tercih edilebilir görüş budur.\" Editör, bunun Malik'in rivayetine göre Ebu Mus'ab (1046) ve Suwayd (490) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.439}"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id, yang mendengar Sa'id bin al-Musayyab berkata mengenai ikat pinggang yang dikenakan seorang peziarah di bawah pakaiannya: \"Tidak ada salahnya jika tali pengikat diletakkan di kedua ujungnya dan diikat bersama.\" Malik berkata: \"Ini adalah pendapat yang paling baik yang pernah saya dengar mengenai masalah ini.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1046) dan Suwayd (490). {cite:muwatta-maruf-1997 p.439}"
