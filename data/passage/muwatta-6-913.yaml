label: { ar: "الموطأ 913 — سعيد بن المسيب: لا بأس بالمنطقة تلبس تحت الثياب للمحرم إذا جعل في طرفيها جميعاً سيوراً يعقد بعضها إلى بعض، وهذا أحب ما سمع مالك إليه", en: "Muwatta 913" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول في المنطقة يلبسها المحرم تحت ثيابه: لا بأس بذلك إذا جعل في طرفيها جميعاً سيوراً يعقد بعضها إلى بعض. ويقول مالك: وهذا أحب ما سمعت إلي في ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1046) وسويد (490). {cite:muwatta-maruf-1997 p.439}"
