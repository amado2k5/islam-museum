text: "… أعطني جبتي وخذ بردعتك نزل يوماً عن حماره لقضاء حاجة في مكان خال، ووضع جُبَّتَهُ على ظهر الحمار. فمرّ به سارقٌ فسرقَ الجبَّة. وعادَ جحا فلما لم يجدِ الجبّة أهوى بعصاهُ على الحمار وجعل يضربه ويسأله أين الجبَّة؟ اغتاظ : …"
summary:
  ar: "ترك جحا جبته على حماره فسرقها لص، فضرب الحمار على ذلك ثم أخذ بردعته وقال له أن يعطيه جبته ويأخذ بردعته. {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  en: "Juha leaves his robe on his donkey; a thief steals it; he beats the donkey for it and then takes the donkey's saddle, saying 'give me my robe and take your saddle'. {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  ur: "جحا نے اپنا چوغہ اپنے گدھے پر چھوڑ دیا اور ایک چور اسے لے گیا؛ جحا نے اس پر گدھے کو مارا اور پھر اس کی زین اتار لی اور کہا کہ میرا چوغہ دو اور اپنی زین لے لو۔ {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  fr: "Juha laisse sa robe sur son âne ; un voleur la dérobe ; il bat l'âne pour cela, puis prend le bât de l'âne en disant : «rends-moi ma robe et prends ton bât». {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  es: "Juha deja su túnica sobre su burro; un ladrón se la roba; golpea al burro por ello y luego le quita la albarda diciendo: «dame mi túnica y quédate con tu albarda». {cite:juha-nawadir-kubra-djuwaydi p. 39}"
