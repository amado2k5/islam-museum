text: "وما كان المؤمنون لينفروا كافة الآية أخرج ابن أبي حاتم عن عكرمة قال لما نزلت إلا تنفروا يعذبكم عذابا أليما وقد كان تخلف عنه ناس في البدو يفقهون قومهم فقال المنافقون قد بقي ناس في البوادي هلك أصحاب البوادي فنزلت وما كان المؤمنون لينفرو لأن"
