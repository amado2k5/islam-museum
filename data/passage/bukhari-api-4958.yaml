label: { ar: "صحيح البخاري 4958 — تربية الأب ووصيته", en: "Sahih al-Bukhari 4958 — the father raising and counselling", ur: "صحیح بخاری 4958 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 4958 — El padre que cría y aconseja", fr: "Sahih al-Bukhari 4958 — l'éducation et les conseils du père" }
text: "حَدَّثَنَا يَحْيَى، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، عَنْ مَعْمَرٍ، عَنْ عَبْدِ الْكَرِيمِ الْجَزَرِيِّ، عَنْ عِكْرِمَةَ، قَالَ ابْنُ عَبَّاسٍ قَالَ أَبُو جَهْلٍ لَئِنْ رَأَيْتُ مُحَمَّدًا يُصَلِّي عِنْدَ الْكَعْبَةِ لأَطَأَنَّ عَلَى عُنُقِهِ. فَبَلَغَ النَّبِيَّ فَقَالَ \" لَوْ فَعَلَهُ لأَخَذَتْهُ الْمَلاَئِكَةُ \". تَابَعَهُ عَمْرُو بْنُ خَالِدٍ عَنْ عُبَيْدِ اللَّهِ عَنْ عَبْدِ الْكَرِيمِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4958، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4958 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4958، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4958 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4958 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne le rôle du père dans l'éducation et le soutien des enfants. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
