label: { ar: "الموطأ 969 — مالك: الأمر عندنا في تقليد الهدي لمن لا يريد الحج ولا العمرة قول عائشة: إن رسول الله بعث بهديه ثم أقام فلم يحرم عليه شيء حتى نحر الهدي", en: "Muwatta 969" }
summary:
  ar: "سئل مالك عما اختلف فيه الناس من الإحرام لتقليد الهدي ممن لا يريد الحج ولا العمرة، فقال: الأمر عندنا الذي نأخذ به في ذلك قول عائشة أم المؤمنين: إن رسول الله بعث بهديه ثم أقام، فلم يحرم عليه شيء مما أحله الله له حتى نحر الهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1101). {cite:muwatta-maruf-1997 p.459}"
