label: { ar: "الموطأ 969 — مالك: الأمر عندنا في تقليد الهدي لمن لا يريد الحج ولا العمرة قول عائشة: إن رسول الله بعث بهديه ثم أقام فلم يحرم عليه شيء حتى نحر الهدي", en: "Muwatta 969", es: "Muwatta 969", fr: "Muwatta 969", ur: "موطا 969", tr: "El-Muvatta 969 — Malik: Hac veya Umre niyeti olmayanlar için kurban gönderme uygulamasına ilişkin görüşümüz, Aişe'nin şu sözüne dayanmaktadır: Allah Resulü kurbanlarını gönderdi ve sonra orada kaldı; kurbanları kesinceye kadar ona hiçbir şey haram değildi.", id: "Al-Muwatta 969 — Malik: Pendirian kami mengenai praktik mengirimkan hewan kurban bagi mereka yang tidak berniat melaksanakan haji atau umrah didasarkan pada pernyataan Aisyah: Rasulullah mengirimkan hewan kurbannya kemudian tinggal di sana, dan tidak ada sesuatu pun yang diharamkan baginya sampai beliau menyembelih hewan kurban tersebut." }
summary:
  ar: "سئل مالك عما اختلف فيه الناس من الإحرام لتقليد الهدي ممن لا يريد الحج ولا العمرة، فقال: الأمر عندنا الذي نأخذ به في ذلك قول عائشة أم المؤمنين: إن رسول الله بعث بهديه ثم أقام، فلم يحرم عليه شيء مما أحله الله له حتى نحر الهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1101). {cite:muwatta-maruf-1997 p.459}"
  tr: "Malik'e, Hac veya Umre niyeti olmayanların kurban kesmek amacıyla ihrama girme konusundaki farklı görüşler soruldu. O şöyle cevap verdi: \"Bu konuda izlediğimiz husus, Müminlerin Annesi Aişe'nin şu sözüdür: 'Allah'ın Resulü kurbanlarını gönderdi ve sonra orada kaldı; kurbanları kesinceye kadar Allah'ın kendisine helal kıldığı hiçbir şey ona haram olmadı.'\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1101) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.459}"
  id: "Malik ditanya tentang perbedaan pendapat mengenai memasuki keadaan ihram untuk menandai hewan kurban bagi mereka yang tidak berniat haji atau umrah. Beliau menjawab: \"Masalah yang kami ikuti dalam hal ini adalah pernyataan Aisyah, Umrah: 'Rasulullah mengirimkan hewan kurbannya dan kemudian tetap tinggal di tempatnya, dan tidak ada sesuatu pun yang dihalalkan Allah baginya sampai beliau menyembelih hewan kurban tersebut.'\" Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1101). {cite:muwatta-maruf-1997 p.459}"
