label: { ar: "الموطأ 139 — مالك: الجنب يتيمم ويقرأ حزبه ويتنفل", en: "Muwatta 139", es: "Muwatta 139", fr: "Muwatta 139", ur: "موطا 139" }
summary:
  ar: "قول لمالك في باب التيمم: الرجل الجنب يتيمم ويقرأ حزبه من القرآن ويتنفل ما لم يجد ماءً، وذلك في المكان الذي يجوز له أن يصلي فيه بالتيمم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.100}"
  tr: "Malik, teyemmüm bölümüyle ilgili olarak şöyle buyurmuştur: \"Ritüel kirlilik halinde olan bir kimse, su bulamadığı sürece, teyemmümle namaz kılmasının caiz olduğu bir yerde teyemmüm yapabilir, Kur'an'dan kendi payını okuyabilir ve nafile namazlar kılabilir.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.100}"
  id: "Malik berkata mengenai surah tayammum: Seorang laki-laki yang dalam keadaan najis boleh bertayammum, membaca bagian Al-Quran, dan melaksanakan salat sunnah selama ia tidak menemukan air, di tempat yang diperbolehkan baginya untuk salat dengan tayammum. Peneliti menyebutkan bahwa hadis ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.100}"
