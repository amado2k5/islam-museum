label: { ar: "الموطأ 669 — مالك: لا يؤخذ من المعادن شيء حتى يبلغ ما يخرج منها النصاب، ففيه الزكاة مكانه", en: "Muwatta 669" }
summary:
  ar: "قول لمالك: أرى، والله أعلم، أن لا يؤخذ من المعادن مما يخرج منها شيء حتى يبلغ ما يخرج منها قدر عشرين ديناراً عيناً أو مئتي درهم، فإذا بلغ ذلك ففيه الزكاة مكانه، وما زاد أُخذ بحسابه ما دام في المعدن نيل، فإذا انقطع عرقه ثم جاء نيل بعد ذلك ابتُدئت فيه الزكاة كما ابتُدئت في الأول. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.339}"
