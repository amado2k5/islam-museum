text: "بَدِيعُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ أَنَّىٰ يَكُونُ لَهُۥ وَلَدٌ وَلَمْ تَكُن لَّهُۥ صَـٰحِبَةٌ ۖ وَخَلَقَ كُلَّ شَىْءٍ ۖ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ"
text_search: "بديع السماوات والأرض ۖ أنى يكون له ولد ولم تكن له صاحبة ۖ وخلق كل شيء ۖ وهو بكل شيء عليم"
translations:
  en: { text: "The Originator of the heavens and the earth! How can He have a child, when there is for Him no consort, when He created all things and is Aware of all things?", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(وہی) آسمانوں اور زمین کا پیدا کرنے والا (ہے) ۔ اس کے اولاد کہاں سے ہو جب کہ اس کی بیوی ہی نہیں۔ اور اس نے ہر چیز کو پیدا کیا ہے۔ اور وہ ہر چیز سے باخبر ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
