summary:
  ar: "القسم 39 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الملاحم»، ويضم فيها النصوص من 4291 إلى 4350 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 39 of Sunan Abi Dawud (Battles (Kitab Al-Malahim)) in the division of the open hadith dataset the museum took its reports from: reports 4291 to 4350 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 39، عنوان «کتاب الملاحم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4291 تا 4350۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 39 de Sunan Abi Dawud (Batallas (Kitab Al-Malahim)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4291 al 4350, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
