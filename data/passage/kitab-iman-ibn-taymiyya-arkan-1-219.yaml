text: "… الكفر حتى يجيء من ذلك أمر لا يختلف فيه، وقال ابن أبى شيبة لا يزني الزاني حين يزني وهو مؤمن لا يكون مستكمل الإيمان يكون ناقصاً من إيمانه. قال الشالنجي: وسألت أحمد عن الإيمان والإسلام، فقال: الإيمان قول وعمل، والإسلام …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 219، يذكر ما يرتفع معه الإيمان حين الفعل، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 219, that mentions what faith is lifted by at the moment of the act, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 219 کا اقتباس جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 219, que menciona qué fortalece la fe en el momento del acto, aumentando o disminuyendo esta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 219) mentionne ce qui fortifie la foi au moment de l'acte, la foi augmentant et diminuant. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 219. sayfasından bir alıntı, amellerle imanın yükselmesine yol açan faktörleri ve imanın artış ve azalışını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 219, membahas faktor-faktor yang meningkatkan iman melalui perbuatan, serta peningkatan dan penurunan iman. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
