text: "… أشعاراً في ذلك حِسَاناً، وهو الذي يقول : أَلَاَ مَا اسْتَطَعْتُمْ مِنْ وَصَاتِيَ فَافْعَلُوا يَقُولُ أَبْو قَيْسٍ وَأَصْبَعَ غَادِياً: وَأَعْرَاضكُمْ وَالْبِرُّ بِاللَّهِ أَوَلُ فأوصيكُمُ بِاللَّهِ وَالْبِرَّ وَالتّقَىٰ وَإِنْ كُنْتُمُ أَهْلَ الرّيَاسَةِ فَأَعْدِلُوا وَإِنْ قَوْمُكُمْ سَادُوا فَلاَ تَحْسُدُنَّهُمْ فَأنْفُسَكُمْ دُونَ الْعَشِيرَةِ …"
