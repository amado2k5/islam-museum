ref: "711"
label: { ar: "موطأ مالك 711 — ما أُحل", en: "Muwatta Malik 711 — what was made lawful", ur: "موطأ مالک 711 — جو حلال کیا گیا", es: "Muwatta Malik 711: lo que se legalizó", fr: "Muwatta Malik 711 — ce qui a été légalisé", tr: "Muwatta Malik 711 — İzin Verilen Şeyler", id: "Muwatta Malik 711 — Apa yang diperbolehkan" }
text: "… نَافِعٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، كَانَ لاَ يَغْسِلُ رَأْسَهُ وَهُوَ مُحْرِمٌ إِلاَّ مِنَ الاِحْتِلاَمِ. قَالَ مَالِكٌ سَمِعْتُ أَهْلَ الْعِلْمِ يَقُولُونَ لاَ بَأْسَ أَنْ يَغْسِلَ الرَّجُلُ الْمُحْرِمُ رَأْسَهُ بِالْغَسُولِ بَعْدَ أَنْ يَرْمِيَ جَمْرَةَ الْعَقَبَةِ وَقَبْلَ أَنْ يَحْلِقَ رَأْسَهُ وَذَلِكَ أَنَّهُ إِذَا رَمَى جَمْرَةَ الْعَقَبَةِ فَقَدْ حَلَّ لَهُ قَتْلُ الْقَمْلِ وَحَلْقُ الشَّعْرِ وَإِلْقَاءُ التَّفَثِ وَلُبْسُ الثِّيَابِ."
summary:
  ar: "حديث في موطأ مالك، رقم 711، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 711 (Hajj), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 711، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 711 (Hajj), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 711 (Hajj), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Malik'in Muwatta'sında yer alan 711 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve haram tarayıcısı, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinler sunmaktadır."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 711, menyebutkan apa yang diperbolehkan. Peramban Halal dan Haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
