label: { ar: "سنن أبي داود 4279 — الأب والأبوة", en: "Sunan Abi Dawud 4279 — the father and fatherhood", ur: "سنن ابی داؤد 4279 — باپ اور والدیت", es: "Sunan Abi Dawud 4279 — El padre y la paternidad", fr: "Sunan Abi Dawud 4279 — le père et la paternité" }
text: "حَدَّثَنَا عَمْرُو بْنُ عُثْمَانَ، حَدَّثَنَا مَرْوَانُ بْنُ مُعَاوِيَةَ، عَنْ إِسْمَاعِيلَ، - يَعْنِي ابْنَ أَبِي خَالِدٍ - عَنْ أَبِيهِ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" لاَ يَزَالُ هَذَا الدِّينُ قَائِمًا حَتَّى يَكُونَ عَلَيْكُمُ اثْنَا عَشَرَ خَلِيفَةً كُلُّهُمْ تَجْتَمِعُ عَلَيْهِ الأُمَّةُ \". فَسَمِعْتُ كَلاَمًا مِنَ النَّبِيِّ لَمْ أَفْهَمْهُ قُلْتُ لأَبِي مَا يَقُولُ قَالَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4279، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4279 (The Promised Deliverer (Kitab Al-Mahdi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4279، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4279 (El Libertador Prometido (Kitab Al-Mahdi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4279 (Le Libérateur Promis (Kitab Al-Mahdi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
