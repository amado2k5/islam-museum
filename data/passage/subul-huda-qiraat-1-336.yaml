  fr: "Un extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 1, page 336, mentionne la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation automatique, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 1. cildinin 336. sayfasından alınan bir alıntı, Kur'an'ın diyakritik işaretlerini ve biçimini ele almaktadır; bu alıntı, makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Subul al-Huda wa al-Rashad\" karya Al-Salihi, Volume 1, halaman 336, menyebutkan tanda diakritik dan bentuk Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
