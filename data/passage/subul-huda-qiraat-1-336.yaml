text: "… أن يكون مولده في نيسان إلا أن يكون مولده في رمضان. وقال الإمام أبو الحسن الماوردي رجمه الله تعالى: وافق شهر ربيع من شهور الروم العشرين من شباط. انتهى. ويقال: شباط بالإعجام والإهمال. قال الدمياطي تعالى: في بُرْج الحمَل. قال …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 336، يذكر نقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
