label: { ar: "صحيح مسلم 6177 — الأب والأبوة", en: "Sahih Muslim 6177 — the father and fatherhood", ur: "صحیح مسلم 6177 — باپ اور والدیت", es: "Sahih Muslim 6177 — El padre y la paternidad", fr: "Sahih Muslim 6177 — Le père et la paternité", tr: "Sahih Muslim 6177 — Baba ve Babalık", id: "Sahih Muslim 6177 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا يَحْيَى بْنُ يَحْيَى، أَخْبَرَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنْ خَالِدٍ، عَنْ أَبِي عُثْمَانَ، أَخْبَرَنِي عَمْرُو بْنُ الْعَاصِ، أَنَّ رَسُولَ اللَّهِ بَعَثَهُ عَلَى جَيْشِ ذَاتِ السَّلاَسِلِ فَأَتَيْتُهُ فَقُلْتُ أَىُّ النَّاسِ أَحَبُّ إِلَيْكَ قَالَ \" عَائِشَةُ \". قُلْتُ مِنَ الرِّجَالِ قَالَ \" أَبُوهَا \". قُلْتُ ثُمَّ مَنْ قَالَ \" عُمَرُ \". فَعَدَّ رِجَالاً."
summary:
  ar: "حديث في صحيح مسلم، رقم 6177، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6177 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6177، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6177 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6177 (Livre des mérites des Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 6177 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6177, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
