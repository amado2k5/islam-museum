label: { ar: "الموطأ 504 — سهل بن أبي حثمة يصف صلاة الخوف: الإمام يسلم ثم تقضي الطائفة الثانية", en: "Muwatta 504" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد عن صالح بن خوات الأنصاري أن سهل بن أبي حثمة الأنصاري حدثه، في باب صلاة الخوف: أن صلاة الخوف أن يقوم الإمام ومعه طائفة من أصحابه وطائفة مواجهة العدو، فيركع الإمام ركعة ويسجد بالذين معه ثم يقوم، فإذا استوى قائماً ثبت وأتموا لأنفسهم الركعة الباقية ثم يسلمون وينصرفون والإمام قائم فيكونون وجاه العدو، ثم يقبل الآخرون الذين لم يصلوا فيكبرون وراء الإمام فيركع بهم ويسجد ثم يسلم، فيقومون فيركعون لأنفسهم الركعة الثانية ثم يسلمون. وينقل المحقق عن ابن عبد البر أنه موقوف على سهل في الموطأ عند جماعة الرواة ومثله لا يقال من جهة الرأي، وأنه روي مرفوعاً بهذا الإسناد من رواية عبد الرحمن بن القاسم عن أبيه (التمهيد 23/166)؛ ويذكر أن الموقوف عند البخاري (5/145–146) والمرفوع في الصحيحين، وأن الترمذي ساق الروايتين (565، 566) وصحح المرفوع. {cite:muwatta-maruf-1997 p.257} {cite:muwatta-maruf-1997 p.258}"
