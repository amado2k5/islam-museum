label: { ar: "الموطأ 504 — سهل بن أبي حثمة يصف صلاة الخوف: الإمام يسلم ثم تقضي الطائفة الثانية", en: "Muwatta 504", es: "Muwatta 504", fr: "Muwatta 504", ur: "موطا 504", tr: "El-Muvatta 504 — Sahl ibn Abi Hatma, korku namazını şöyle anlatır: İmam selam verir, sonra ikinci grup namazı kılar.", id: "Al-Muwatta 504 — Sahl ibn Abi Hathma menjelaskan tentang salat dalam keadaan takut: Imam mengucapkan taslim, kemudian kelompok kedua melaksanakan salat." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد عن صالح بن خوات الأنصاري أن سهل بن أبي حثمة الأنصاري حدثه، في باب صلاة الخوف: أن صلاة الخوف أن يقوم الإمام ومعه طائفة من أصحابه وطائفة مواجهة العدو، فيركع الإمام ركعة ويسجد بالذين معه ثم يقوم، فإذا استوى قائماً ثبت وأتموا لأنفسهم الركعة الباقية ثم يسلمون وينصرفون والإمام قائم فيكونون وجاه العدو، ثم يقبل الآخرون الذين لم يصلوا فيكبرون وراء الإمام فيركع بهم ويسجد ثم يسلم، فيقومون فيركعون لأنفسهم الركعة الثانية ثم يسلمون. وينقل المحقق عن ابن عبد البر أنه موقوف على سهل في الموطأ عند جماعة الرواة ومثله لا يقال من جهة الرأي، وأنه روي مرفوعاً بهذا الإسناد من رواية عبد الرحمن بن القاسم عن أبيه ⁦(التمهيد 23/166)⁩؛ ويذكر أن الموقوف عند البخاري (5/145–146) والمرفوع في الصحيحين، وأن الترمذي ساق الروايتين ⁦(565، 566)⁩ وصحح المرفوع. {cite:muwatta-maruf-1997 p.257} {cite:muwatta-maruf-1997 p.258}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, dari Salih ibn Khawat al-Ansari, bahwa Sahl ibn Abi Hathmah al-Ansari memberitahunya, dalam surah Shalat Ketakutan: bahwa Shalat Ketakutan adalah ketika imam berdiri bersama sekelompok sahabatnya dan sekelompok lainnya menghadap musuh. Imam melaksanakan satu rakaat dan sujud bersama mereka, kemudian berdiri. Ketika ia berdiri tegak, mereka tetap diam dan menyelesaikan rakaat yang tersisa untuk diri mereka sendiri, kemudian mereka mengucapkan taslim dan pergi sementara imam masih berdiri, menghadap musuh. Kemudian yang lain yang belum shalat maju dan mengucapkan takbir di belakang imam, yang kemudian memimpin mereka dalam rukuk dan sujud, kemudian mengucapkan taslim. Kemudian mereka berdiri dan melaksanakan rakaat kedua untuk diri mereka sendiri, kemudian mengucapkan taslim. Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa itu adalah pernyataan yang dinisbahkan kepada Sahl dalam al-Muwatta' oleh sekelompok perawi, dan pernyataan seperti itu tidak dapat dibuat berdasarkan pendapat pribadi. Hal itu juga diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) dengan sanad ini dari Abd al-Rahman ibn al-Qasim atas otoritas ayahnya (al-Tamhid 23/166). Perlu dicatat bahwa hadits tersebut dinisbahkan kepada seorang Sahabat (mawquf) dalam al-Bukhari (5/145–146) dan kepada Nabi (marfu') dalam dua kitab Sahih (al-Bukhari dan Muslim), dan bahwa al-Tirmidhi memasukkan kedua riwayat tersebut (565, 566) dan mengesahkan riwayat yang dinisbahkan kepada Nabi. {kutip:muwatta-maruf-1997 hal.257} {kutip:muwatta-maruf-1997 hal.258}"
