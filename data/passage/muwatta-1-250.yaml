label: { ar: "الموطأ 250 — مثله عن ابن شهاب عن سعيد بن المسيب وأبي سلمة، واضطراب الزهري في حديث ذي اليدين", en: "Muwatta 250" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن مثل الحديث السابق مرسلاً؛ وهو في باب ما يفعل من سلم من ركعتين ساهياً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أنه لم يسنده عن مالك إلا عبد الحميد بن سليمان فرواه عن سعيد عن أبي هريرة، وأن الزهري اضطرب في حديث ذي اليدين اضطراباً شديداً أوجب عند أهل العلم بالنقل تركه من روايته خاصة، وقوله: لا أعلم أحداً من أهل العلم المنصفين عوّل على حديث ابن شهاب في قصة ذي اليدين، فالغلط لا يسلم منه أحد، وكل أحد يؤخذ من قوله ويترك إلا النبي (التمهيد 1/366، 7/55). {cite:muwatta-maruf-1997 p.149}"
