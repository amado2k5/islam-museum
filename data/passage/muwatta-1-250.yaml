label: { ar: "الموطأ 250 — مثله عن ابن شهاب عن سعيد بن المسيب وأبي سلمة، واضطراب الزهري في حديث ذي اليدين", en: "Muwatta 250", es: "250 vatios", fr: "250 watts", ur: "250 واٹ", tr: "El-Muvatta 250 — İbn Şihab'ın rivayetine göre, Said bin el-Musayyab ve Ebu Salama'nın rivayetine göre benzerdir ve El-Zuhri'nin Zül-Yadayn hadisindeki karışıklığı söz konusudur.", id: "Al-Muwatta 250 — serupa dengannya menurut Ibn Shihab, menurut Saeed bin Al-Musayyab dan Abu Salama, dan kekeliruan Al-Zuhri dalam hadits Dhu Al-Yadayn" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن مثل الحديث السابق مرسلاً؛ وهو في باب ما يفعل من سلم من ركعتين ساهياً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أنه لم يسنده عن مالك إلا عبد الحميد بن سليمان فرواه عن سعيد عن أبي هريرة، وأن الزهري اضطرب في حديث ذي اليدين اضطراباً شديداً أوجب عند أهل العلم بالنقل تركه من روايته خاصة، وقوله: لا أعلم أحداً من أهل العلم المنصفين عوّل على حديث ابن شهاب في قصة ذي اليدين، فالغلط لا يسلم منه أحد، وكل أحد يؤخذ من قوله ويترك إلا النبي ⁦(التمهيد 1/366، 7/55)⁩. {cite:muwatta-maruf-1997 p.149}"
  tr: "Malik, bu hadisi İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan ve o da Ebu Seleme ibn Abd el-Rahman'dan rivayet etmiştir; önceki hadise benzer şekilde, ancak isnad zinciri kopuktur. Bu hadis, iki rekat namazdan sonra selam vermeyi unutanların ne yapması gerektiği bölümünde yer almaktadır. Editör, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtir ve İbn Abd el-Barr'ın, Malik'ten isnad zinciriyle rivayet eden tek kişinin Abd el-Hamid ibn Süleyman olduğunu, onun da Sa'id'den, o da Ebu Hurayra'dan rivayet ettiğini söylediğini aktarır. Ayrıca, el-Zuhri'nin Zü'l-Yadayn hadisi konusunda son derece karışıklık içinde olduğunu, hadis âlimlerinin bu hadisi özellikle ondan rivayet etmeyi uygunsuz bulduklarını belirtir. Şöyle diyor: \"Zu el-Yadayn kıssası hakkında İbn Şihab'ın hadisine güvenen tarafsız bir âlim tanımıyorum. Hiç kimse hatadan muaf değildir ve Peygamber hariç herkesin sözü kabul edilebilir veya reddedilebilir.\" (el-Tamhid 1/366, 7/55). {cite:muwatta-maruf-1997 s.149}"
  id: "Malik meriwayatkannya dari Ibn Shihab, dari Sa'id ibn al-Musayyab, dan dari Abu Salamah ibn 'Abd al-Rahman, serupa dengan hadits sebelumnya, tetapi dengan sanad yang terputus. Hadits ini terdapat dalam surah tentang apa yang harus dilakukan jika seseorang lupa mengucapkan taslim setelah dua rakaat. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan mengutip Ibn 'Abd al-Barr yang mengatakan bahwa tidak ada yang meriwayatkannya dengan sanad dari Malik kecuali 'Abd al-Hamid ibn Sulayman, yang meriwayatkannya dari Sa'id, dari Abu Hurayrah. Ia juga menyatakan bahwa al-Zuhri sangat bingung mengenai hadits Dhu al-Yadayn, sampai-sampai para ulama perawi hadits menganggapnya tidak pantas untuk meriwayatkannya secara khusus darinya. Dia berkata: \"Aku tidak mengetahui adanya ulama yang berpikiran adil yang mengandalkan hadits Ibnu Shihab mengenai kisah Dhu al-Yadayn. Tidak ada seorang pun yang kebal terhadap kesalahan, dan perkataan setiap orang dapat diterima atau ditolak kecuali Nabi\" (al-Tamhid 1/366, 7/55). {cite:muwatta-maruf-1997 p.149}"
