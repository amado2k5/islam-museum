label: { ar: "مسلم 2578 — اتقوا الظلم فإن الظلم ظلمات يوم القيامة", en: "Muslim 2578 — Beware injustice, for injustice is darkness on the Last Day" }
text: "قال رسول الله: «اتقوا الظلم؛ فإن الظلم ظلمات يوم القيامة، واتقوا الشح؛ فإن الشح أهلك من كان قبلكم، حملهم على أن سفكوا دماءهم واستحلوا محارمهم»"
summary:
  ar: "رواية جابر بن عبد الله في كتاب البر من صحيح مسلم؛ يقترن فيها النهي عن الظلم بالنهي عن الشح الذي أهلك الأمم قبلها."
