text: "أي: ما يعلم عددهم وكثرتهم إلا هو تعالى؛ لئلًا يتوهَّم متوهّمٌ أنَّهم تسعة عشر فقط"
summary:
  ar: "في تفسير «وما يعلم جنود ربك إلا هو» يفسّر ابن كثير الجنود بأن عددهم وكثرتهم لا يعلمها إلا الله، حتى لا يُظن أنهم تسعة عشر فقط، ويستشهد بحديث الإسراء في البيت المعمور الذي يدخله كل يوم سبعون ألف ملك لا يعودون إليه."
  en: "In his commentary on 'none knows the hosts of your Lord but He', Ibn Kathir says only God knows their number and multitude, so that no one should suppose they are merely nineteen, and he cites the night-journey report of the Frequented House that seventy thousand angels enter each day and never return to it."
  es: "En su comentario sobre \"Nadie conoce las huestes de tu Señor sino Él\", Ibn Kathir dice que solo Dios conoce su número y multitud, por lo que nadie debería suponer que son solo diecinueve, y cita el relato del viaje nocturno de la Casa Frecuentada según el cual setenta mil ángeles entran cada día y nunca regresan a ella."
