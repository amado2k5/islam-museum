text: |-
  ⁦(فصل الحاء)⁩
  ⁦(حز )⁩
  ٤٢٥
  قوله على قترأى على ناحية وحرف اما أن يسقى واما أن لايسق والجوز فارى معرّب الواحدة
  جوزة والجمع جوزات وأرض مجازة فيها أشجار الجوز وجوذ كل شئء وسطه والج-ع
  الاجواز قال زهير مقورة تتبارى لاشواراها• الاالقطوع على الاجوازوالورك
  والجوزاء الشاة يبيض وسطها والجوزاء نجم يقال انها تعترض فى جوز السماء والجائز الجذع
  الذى يقمال له بالفارسية تبروه وسهم البيت والمع أجوزة وجوزان والجيزة الناحية من
  الوادى ونجوه والهع جيز وأجازه بجائزة سفية أى بعطاء ويقال أصل الجوائزان قطن بن عبد
  عوف من بن هلال بن عامر بن صعصعة ولى فارس لعبد اللّٰه بن عامر فز به الاحفف فى جيشه
  غازيا الى خراسان فوقف لهم على قنطرة فقال أجيزوهسم فجعل ينسب الرحسل فيعطيه على أ
  قدرحسبه قال الشاعر
  قدى للا كرمين بنى حلال • على علاته-م اهلى ومالى
  هم سنوا الجوائزفى معد • فصارت سنة أخرى اللسالى
  وأماقول القطامى
  ظلات أسأل أهل المامجائرة فهى الشرية من الماء
  والتجاويزضرب من البرود قال السكميت
  -تى كأنء راص الدار أردية • من التجاويز أوكرّاس أسفار
  صل الحا جزه حجزه حجزا أى منعه فانججز والحاجزة الممانعة وفى المئسل
  ن أردت المحاجزة فقبل المناجزة وقدصاجز الفريقان ويقال كانت بين القوم رمما
  ثم صارت الى حجيزى أى ترامواثم تحاجزوا وهما على مثال خصيصى وقواهم حجازيك مثال
  حذانيك أى احجز بين القوم والجزة بالتحريك الظلمة وفى حديث قيلة أيعجزابن هذه أن يننصف
  من وراه الجزة وهم الذين يحجزونه عن حقسه والحجاز بلاد سهيت بذلك لانها هزت بين تجد
  والغور وقال الاصعى لانها احتجزت بالحرار الاس منهاحرة بنى سليم وحرة واقم ويقال احتجز
  الرجل بازارأى شذه على وسطه واختجز القوم أى أنوا الجازوانحعزوا أيضاعن ابن السكيت
  وحجزت البعير أحجزه حجزا قال الاصعى هوان تنيخه ثم تشد حبلا فى أصل خفيه بجميعا من
  رحليه ثم ترفع الحبل من تحته حتى تشدّه على حقويه وذلكْ اذا أردت أن يرتفع خفه وذلك
  لحبل هو الحجاز والبعير محجوز وقال أبو الفوث الجاز حبل يشدّ بوسطه يدى البعيرثم يخسالف
  فيعقدبه رجلاه ثم يشتطرفاه الى حقويه ثم يلق على جنبه شبه المقموط ثم تداوى دبرته فلا
  يستطيع أن يمتنع الا أن يجرّجنبه على الارض وأنشد كوس الهبلّ النطف المحجوز
  وحزة الازار معقده وحجزة السراويل التى فيها التكة وأماقول النابغة
  رقاق النعال طيب حجزاتهم • يحيون بالريحان يوم السباسب
  فاغاكنى بها عن الفروح بريد أنهم اعفاء (حرز الحرز الموضع الحصين يقال هذاحرز
  حويزو يسمى التعويد حرزا واحسترزت من كذا وتحرزت أى توقيته والحرز بالتحريك الظطر
  وهوالجوز المحكوك يلعب بد الصبى ومن أمشالهم فيمن طمع فى الرمح حتى فاته رأس المال
  قولهم واحرزا وأبتغى النوافلايريدوا حرزاه فهذف وقد اختلف فيه.(حرمن الحرماز
  حىّ من تمسيم ( ز حزه واحتزه أى قطعه والتجزز التقطع وفى أسنانه تحزيز أى أشر
  ١.٧
