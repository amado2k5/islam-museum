text: "… الدواء على حاله. قلت: يا أبا سليمان سبحان الله، لِم لَم تعالج بهذا الدواء؟ فقال لي : إن أنت لم تأخذ الدينار لم أمسه. عن إسماعيل بن زيان قال: حجم حجّام داود الطائي فأعطاه ديناراً لا يملك غيره. حدثنا أبو …"
