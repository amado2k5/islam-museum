text: |-
  ٤٣٧
  يشادى بيهداه وياه كأنه • صويت رويع ضل بالليل صاحيه
  ويهيوت بالابل اذاقلت لها يامياه
  باب الواو والياء
  قال الجوهرى" بجيع مافى هذا اليابمن الالف اما أن تكون منقلبة من واومشل دعا
  أومن ياءمثل رمى وكل مافيه من الهمزة فهى مبدلة من الياء أو من الواوتحو القضاء أصلد
  قضاى لانه من قضيت ونحو العزاء أصله عزا ولانه من عزوت ونحن نشير فى الواو والياء الى
  أصولهما ان شاءاللّٰه تعالى
  الابام بالفع والمدّ القصب الواحدة أباءة ويقال هو أجمة
  الخلفاء والقصب خاصة قال الشاعر
  من مرة ضرب يرعبل بعضه • بعضا كعمعة الاباه المحرق
  والاياء بالكسر مس-در قولك أبى فلان يأبى بالفتح فيهما مع خلوه من حروف الحلق وهو شاذ
  أى امتنع فهوآب وأبى وأبيان بالتحريك قال الشاعر
  وقبلك ماهاب الرجال ظلامتى * وفقأت عين الاشوس الابيان
  وتأبى عليه أى امتنع وأبى فلان الماء وآيينه الماء قال الساء,
  قد أويت كل ماء فهى صاوية • مهما نصب أفقامن بارق تشم
  وعنز أبواه وقد أبيت تأبى أبا وتيس الى بين الابا لذا شم بول الاروى فرض منه قال الشاعر
  فقلت لكنازنو كل فاته • ابى لااخال الضأن منه نواجيا
  ويقال أخذه أبا على فعال بالضم اذا جعل يألب الطعام وقولهم فى تحية الملوك فى الجاهلية
  أهت اللعن قال ابن السكمت أى أيت أن تأتى من الامور ماتل ن عليه والاب أصله أبو
  بالتحريك لان جمعه آياء مثل قفا واقفا ورحاوأرحا فالذاهب منه واولانكْ تقول فى التنني
  ي أبوان وبعض العرب يقول أبان على النقص وفى الاضافة أبيك واذايحعت بالواو والنون
  قلت أيون وكذلك أخون وحون وهنون. قال الشاعر.
  ظا تعزفن أصواتنا • بكين وفدخنا بالاينا .
  وعلى هذا قراً بعضهم واله أبيك ابراهيم واسمعيل وامصق يريد جمع أب أى أبينك فحذف
  النون للاضافة ويقال ما كنت أبا ولقد أبوت أبوة وماله أب يأبوه أى يغذوه ويربيه والنسبة
  اليه أبوى والابوان الاب والام وبينى وبين فلان أبوة والابوة أبضاالا بامثل العمومة
  وانخؤلة وكان الاصممى يروى قول أبى ذويب
  لو كان مدحة حى أنشرت أحدا • أحيا أبوتك الشمّ الاماديخ
  وغيره يرويه أبا كن باليلى الاماديه وقولهم ياأية افعل يجعلون علامة التأنيت ء وضامن باء
  الاضافة كة ولهم فى الام يا أمة وتتف عليها بالهاه الافى القرآن قائك تقف عليها بالتاه اتباعا
  للكتاب وقد يقفيعض العرب على هاه التأنيث بالتاءفيقولون باطلحت واغمالم تسقط التاءفى
  الوصل من الاب وسقات من الام اذا قلت يا أمّ أقبلى لان الاب لما كان على حوفين كان كانه
  صاح
