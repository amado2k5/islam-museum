label: { ar: "الموطأ 693 — مالك: المدير للتجارة يجعل له شهراً من السنة يقوم فيه عروضه ويحصي نقده فيزكي ما بلغ النصاب", en: "Muwatta 693" }
summary:
  ar: "قول لمالك: ما كان من مال عند رجل يديره للتجارة ولا ينض لصاحبه منه شيء تجب فيه الزكاة، فإنه يجعل له شهراً من السنة يقوّم فيه ما عنده من عرض للتجارة ويحصي ما عنده من نقد أو عين، فإذا بلغ ذلك كله ما تجب فيه الزكاة زكاه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.347} {cite:muwatta-maruf-1997 p.348}"
