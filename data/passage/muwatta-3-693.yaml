label: { ar: "الموطأ 693 — مالك: المدير للتجارة يجعل له شهراً من السنة يقوم فيه عروضه ويحصي نقده فيزكي ما بلغ النصاب", en: "Muwatta 693", es: "Muwatta 693", fr: "Muwatta 693", ur: "موطا 693", tr: "Al-Muwatta 693 — Malik: Ticaret yöneticisi, yılın bir ayını ayırarak mallarını değerlendirir, nakitini sayar ve nisaba (asgari eşiğe) ulaşan miktardan zekâtını verir.", id: "Al-Muwatta 693 — Malik: Pengelola perdagangan harus menyisihkan satu bulan dalam setahun untuk menilai barang dagangannya dan menghitung uang tunainya, kemudian membayar zakat atas apa yang mencapai nisab (ambang batas minimum)." }
summary:
  ar: "قول لمالك: ما كان من مال عند رجل يديره للتجارة ولا ينض لصاحبه منه شيء تجب فيه الزكاة، فإنه يجعل له شهراً من السنة يقوّم فيه ما عنده من عرض للتجارة ويحصي ما عنده من نقد أو عين، فإذا بلغ ذلك كله ما تجب فيه الزكاة زكاه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.347} {cite:muwatta-maruf-1997 p.348}"
  tr: "Malik şöyle demiştir: Bir kimsenin ticaret için yönettiği ve sahibine para çekmediği bir parası varsa ve bu paradan zekât ödenmesi gerekiyorsa, yılın bir ayını mallarının değerini hesaplamak ve nakit veya diğer varlıklarını saymak için ayırmalıdır. Eğer bunların hepsi zekât ödenmesi gereken miktara ulaşırsa, zekâtını vermelidir. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.347} {cite:muwatta-maruf-1997 s.348}"
  id: "Malik berkata: Jika seseorang memiliki uang yang ia kelola untuk berdagang dan dari mana ia tidak menarik uang untuk pemiliknya, dan zakat wajib dibayarkan atas uang tersebut, maka ia harus mengalokasikan satu bulan dalam setahun untuk menilai nilai barang dagangannya dan menghitung uang tunai atau aset lainnya. Jika semua itu mencapai jumlah yang wajib dibayarkan zakat, maka ia harus membayar zakat atasnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.347} {cite:muwatta-maruf-1997 p.348}"
