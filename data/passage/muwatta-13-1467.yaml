label: { ar: "الموطأ 1467 — زيد بن أسلم: سأل عمر النبي عن الكلالة، فقال يكفيك الآية التي أنزلت في الصيف في آخر سورة النساء", en: "Muwatta 1467", es: "Muwatta 1467", fr: "Muwatta 1467", ur: "موطا 1467", tr: "El-Muvatta 1467 — Zeyd ibn Aslam: Ömer, Peygamberimize doğrudan varis olmaksızın miras hakkında sordu ve Peygamberimiz şöyle buyurdu: Nisa Suresi'nin sonunda yaz mevsiminde indirilen ayet sana yeterlidir.", id: "Al-Muwatta 1467 — Zayd ibn Aslam: Umar bertanya kepada Nabi tentang warisan tanpa ahli waris langsung, dan beliau menjawab: Ayat yang diturunkan pada musim panas di akhir Surat An-Nisa sudah cukup bagimu." }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن عمر بن الخطاب سأل رسول الله عن الكلالة، فقال له رسول الله يكفيك من ذلك الآية التي أنزلت في الصيف في آخر سورة النساء. {cite:muwatta-maruf-1997 p.17}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Ömer ibn el-Hattab'ın Allah Resulü'ne, soy ağacı (kalalah) olmayan vefat eden bir kişinin miras hakkı hakkında sorduğunu ve Allah Resulü'nün ona, \"Bu konuda Nisa Suresi'nin sonundaki yaz mevsiminde indirilen ayet sana yeterlidir\" dediğini aktarır. {cite:muwatta-maruf-1997 s.17}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa Umar ibn al-Khattab bertanya kepada Rasulullah tentang warisan seseorang yang meninggal tanpa leluhur atau keturunan (kalalah), dan Rasulullah bersabda kepadanya, \"Ayat yang diturunkan pada musim panas di akhir Surah An-Nisa' sudah cukup bagimu mengenai hal itu.\" {cite:muwatta-maruf-1997 p.17}"
