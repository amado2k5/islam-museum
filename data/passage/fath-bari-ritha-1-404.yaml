text: "… -أَوِ الرَّهْطِ - الَّذِينَ تُوُفِّيَ رَسُولُ اللَّه وَلِلِهِ وَهُوَ عَنْهُمْ رَاضٍ. فَسَمَّى عَلِيًّا وَعُثْمَانَ وَالزُّبَيْرَ وَطَلْحَةَ وَسَعْدًا وَعَبْدَ الرَّحْمَنِ،. وَقَالَ : يَشْهَدُكُمْ عَبْدُ اللَّهِ بْنُ عُمَرَ، وَلَيْسَ لَهُ مِنَ الأمْرِ شَيْءٌ كَهَيْئَةِ التَّعْزِيَةِ لَهُ فَإِنْ أَصَابَتِ الإمْرَةُ سَعْدًا فَهُوَ ذَاكَ، …"
