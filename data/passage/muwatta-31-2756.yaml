label: { ar: "الموطأ 2756 — زيد بن أسلم: يسلم الراكب على الماشي وإذا سلم واحد من القوم أجزأ عنهم", en: "Muwatta 2756", es: "Muwatta 2756", fr: "Muwatta 2756", ur: "موطا 2756", tr: "El-Muvatta 2756 — Zeyd ibn Aslam: Binici yayayı selamlar, gruptan birinin selamlaması da yeterlidir.", id: "Al-Muwatta 2756 — Zayd ibn Aslam: Pengendara menyapa pejalan kaki, dan jika salah satu dari kelompok tersebut memberi salam, itu sudah cukup bagi mereka." }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رسول الله قال: يسلم الراكب على الماشي، وإذا سلم من القوم واحد أجزأ عنهم. {cite:muwatta-maruf-1997 p.549}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu aktarır: \"Binicilik yapan kişi, yaya olanı selamlasın; topluluktan bir kişi selam verirse, bu hepsi için yeterlidir.\" {cite:muwatta-maruf-1997 s.549}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa Rasulullah SAW bersabda: \"Pengendara hendaknya memberi salam kepada pejalan kaki, dan jika satu orang dari suatu kelompok memberi salam, itu sudah cukup bagi mereka semua.\" {cite:muwatta-maruf-1997 p.549}"
