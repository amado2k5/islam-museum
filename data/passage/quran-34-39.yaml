text: "قُلْ إِنَّ رَبِّى يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ مِنْ عِبَادِهِۦ وَيَقْدِرُ لَهُۥ ۚ وَمَآ أَنفَقْتُم مِّن شَىْءٍ فَهُوَ يُخْلِفُهُۥ ۖ وَهُوَ خَيْرُ ٱلرَّٰزِقِينَ"
text_search: "قل إن ربي يبسط الرزق لمن يشاء من عباده ويقدر له ۚ وما أنفقتم من شيء فهو يخلفه ۖ وهو خير الرازقين"
translations:
  en: { text: "Say: Lo! my Lord enlargeth the provision for whom He will of His bondmen, and narroweth (it) for him. And whatsoever ye spend (for good) He replaceth it. And He is the Best of Providers.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کہہ دو کہ میرا پروردگار اپنے بندوں میں سے جس کے لئے چاہتا ہے روزی فراخ کردیتا ہے اور (جس کے لئے چاہتا ہے) تنگ کردیتا ہے اور تم جو چیز خرچ کرو گے وہ اس کا (تمہیں) عوض دے گا۔ اور وہ سب سے بہتر رزق دینے والا ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
