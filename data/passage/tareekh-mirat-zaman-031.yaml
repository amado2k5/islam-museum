text: "المغيرة بن شعبة. وسار عثمان بن قطن إلى عسكر عبد الرحمن لما ورد عليه كتاب الحجاج، فوافى عسكر ابن الأشعث ليلة التروية عشية الثلاثاء، فوقف على الناس وقال: اخرجوا إلى قتال عدوكم، فناشده الله الناس أن يصبر عليهم إلى الغد،"
