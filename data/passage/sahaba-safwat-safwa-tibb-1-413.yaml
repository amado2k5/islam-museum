text: "… فخرج إلينا فجلسنا إليه فبداً الشاب بالسلام عليه وصافحه، فأبدى الشيخ له البشر والترحيب، ثم سلمنا عليه فقال الشاب : إن اللّٰه بمنه وفضله قد جعلك طبيباً لسقام القلوب معالجاً لأوجاع الذنوب، وبي جرح نغل وداء قد استكمل، فإن رأيت …"
