text: "… قَالَ فَأَخْبَرْتُ بِذَلِكَ أَبَا الْعَالِيَةِ فَقَالَ صَدَقَ وَأَحْسَنَ. حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا أَبُو بَكْرِ بْنُ شُعَيْبِ بْنِ الْحَبْحَابِ، عَنْ أَبِيهِ، عَنْ أَنَسِ بْنِ مَالِكٍ، نَحْوَهُ بِمَعْنَاهُ وَلَمْ يَرْفَعْهُ وَلَمْ يَذْكُرْ قَوْلَ أَبِي الْعَالِيَةِ وَهَذَا أَصَحُّ مِنْ حَدِيثِ حَمَّادِ بْنِ سَلَمَةَ وَرَوَى غَيْرُ وَاحِدٍ مِثْلَ هَذَا مَوْقُوفًا وَلاَ نَعْلَمُ أَحَدًا رَفَعَهُ غَيْرَ حَمَّادِ بْنِ سَلَمَةَ وَرَوَاهُ مَعْمَرٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3119، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3119 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3119، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
