label: { ar: "نوادر جحا الكبرى، ص 53 — «ازرعوني فأخرج ثمرا»", en: "Nawadir Juha al-Kubra, p. 53 — 'Plant Me and I Will Bear Fruit'", ur: "نوادر جحا الکبریٰ، ص 53 — «مجھے بھی بو دو، میں پھل دوں گا»", fr: "Nawadir Juha al-Kubra, p. 53 — « Plantez-moi et je porterai des fruits »", es: "Nawadir Juha al-Kubra, p. 53 — «Siémbrenme y daré fruto»" }
text: "… ازرعوني فأُخرج ثمراً رأى يوماً مزارعين يزرعون كَزْماً فسألهم؟ ماذا تصنعون؟ نقالوا : نزرع كرمةً تحملُ عنباً، عناقيدَ عناقيدَ. فتأمَّلَ الشيخُ قليلاً، وقال : ازرعوني أيضاً فإني أعطي أثماراً متنوعة. قَرباناً، بضم القاف: أضحيَّة."
summary:
  ar: "غرس بعض الفلاحين كرمة، فطلب جحا أن يغرسوه هو أيضًا لأنه يثمر ثمارًا شتى، فدفنوه إلى وسطه، ثم اشتكى أن برد الربيع والجوع أخرجاه. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  en: "Some farmers plant a vine, and Juha asks to be planted too, since he yields varied fruits; they bury him up to the waist, and he complains that the spring cold and hunger drove him out. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  ur: "کچھ کسانوں نے انگور کی بیل لگائی تو جحا نے کہا کہ مجھے بھی لگا دو، کیونکہ میں طرح طرح کے پھل دیتا ہوں؛ انہوں نے اسے کمر تک دفن کر دیا، اور اس نے شکایت کی کہ بہار کی سردی اور بھوک نے اسے باہر نکال دیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  fr: "Des paysans plantent une vigne et Juha demande à être planté lui aussi, puisqu'il donne des fruits variés; ils l'enterrent jusqu'à la taille, et il se plaint que le froid du printemps et la faim l'ont fait sortir. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  es: "Unos campesinos plantan una vid y Juha pide que lo planten también a él, pues da frutos variados; lo entierran hasta la cintura, y él se queja de que el frío de la primavera y el hambre lo sacaron de allí. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
