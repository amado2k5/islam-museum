label: { ar: "مسلم 184 — يبثّون على أنهار الجنة فينبتون نبات الحبة", en: "Muslim 184 — Cast on Paradise's rivers, growing like the seed in flood silt", es: "Musulmán 184 — Arrojado a los ríos del Paraíso, creciendo como la semilla en el limo de la inundación.", fr: "Muslim 184 — Jeté sur les fleuves du Paradis, il grandit comme une graine dans la vase des crues", ur: "مسلم 184 - جنت کی ندیوں پر ڈالنا، سیلاب کی گاد میں بیج کی طرح اگنا", tr: "Müslim 184 — Onlar cennet nehirlerine dağılırlar ve tohum gibi filizlenirler.", id: "Muslim 184 — Mereka tersebar di sungai-sungai Surga, dan mereka tumbuh seperti benih." }
text: "قال أبو سعيد الخدري: قال رسول الله: أما أهل النار الذين هم أهلها فإنهم لا يموتون فيها ولا يحيون، ولكن ناس أصابتهم النار بذنوبهم فأماتهم إماتة، حتى إذا كانوا فحماً أذن بالشفاعة فجيء بهم ضبائر ضبائر فبثوا على أنهار الجنة ثم قيل: يا أهل الجنة أفيضوا عليهم، فينبتون نبات الحبة تكون في حميل السيل"
summary:
  ar: "رواية أبي سعيد الخدري في باب الشفاعة وإخراج الموحدين من النار من كتاب الإيمان في صحيح مسلم؛ خروج من أصابتهم النار بذنوبهم بعد الشفاعة فينبتون على أنهار الجنة."
  tr: "Sahih Müslim'in İman Kitabı'ndaki şefaat ve tevhid ehlilerin cehennemden azabının giderilmesi bölümünde Ebu Said el-Hudri'nin rivayetine göre; günahları yüzünden cehennem azabı çekenler şefaat sayesinde azaptan kurtulacak ve cennetin sularında çoğalacaklardır."
  id: "Riwayat Abu Saeed Al-Khudri dalam bab tentang syafaat dan pengeluaran orang-orang musafir dari neraka dalam Kitab Iman di Sahih Muslim; pengeluaran orang-orang yang ditimpa neraka karena dosa-dosa mereka setelah syafaat, dan mereka akan tumbuh di sungai-sungai surga."
