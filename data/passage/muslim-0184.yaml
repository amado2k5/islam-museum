label: { ar: "مسلم 184 — يبثّون على أنهار الجنة فينبتون نبات الحبة", en: "Muslim 184 — Cast on Paradise's rivers, growing like the seed in flood silt" }
text: "قال أبو سعيد الخدري: قال رسول الله: أما أهل النار الذين هم أهلها فإنهم لا يموتون فيها ولا يحيون، ولكن ناس أصابتهم النار بذنوبهم فأماتهم إماتة، حتى إذا كانوا فحماً أذن بالشفاعة فجيء بهم ضبائر ضبائر فبثوا على أنهار الجنة ثم قيل: يا أهل الجنة أفيضوا عليهم، فينبتون نبات الحبة تكون في حميل السيل"
summary:
  ar: "رواية أبي سعيد الخدري في باب الشفاعة وإخراج الموحدين من النار من كتاب الإيمان في صحيح مسلم؛ خروج من أصابتهم النار بذنوبهم بعد الشفاعة فينبتون على أنهار الجنة."
