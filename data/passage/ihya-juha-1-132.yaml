  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 1, p. 132, with the ethics and limits of jesting; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 1، ص 132 کا اقتباس جس میں مزاح کے آداب اور حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
