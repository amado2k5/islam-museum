  tr: "İhya Ulum el-Din, Resimli Cilt 1, s. 132'den, mizahın adabı ve sınırlarını ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
