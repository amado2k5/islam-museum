text: "النهى عن المزاح قلب فلم ينهى عنه ؟ فاعلم أنّ المنهى عنه الإفراط فيه أو المداومة عليه. أما المداومة فلانه اشتغال باللمب والهزل فيه واللعب مباح ولكن المواظبة عليه مذمومة، وأما الإفراط فيه فإنه يورث كثرة الضحك وكثرة الضحك تميت …"
