label: { ar: "سنن ابن ماجه 3002 — محو السيئات وحط الخطايا", en: "Sunan Ibn Majah 3002 — bad deeds erased and sins shed", ur: "سنن ابن ماجہ 3002 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… الْحِمْصِيُّ، حَدَّثَنَا أَحْمَدُ بْنُ خَالِدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ يَحْيَى بْنِ أَبِي سُفْيَانَ، عَنْ أُمِّهِ أُمِّ حَكِيمٍ بِنْتِ أُمَيَّةَ، عَنْ أُمِّ سَلَمَةَ، زَوْجِ النَّبِيِّ ـ قَالَتْ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ أَهَلَّ بِعُمْرَةٍ مِنْ بَيْتِ الْمَقْدِسِ كَانَتْ لَهُ كَفَّارَةً لِمَا قَبْلَهَا مِنَ الذُّنُوبِ \". قَالَتْ فَخَرَجْتُ - أَىْ مِنْ بَيْتِ الْمَقْدِسِ - بِعُمْرَةٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3002، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3002 (Chapters on Hajj Rituals), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3002، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
