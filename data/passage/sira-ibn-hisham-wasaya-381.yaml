text: "… عتبة، ثم عدل السيفَ عنها، قال الزبير فقلتُ: اللّٰه ورسوله أعلم. قال ابن إسحاق : وقال أبو دُجَانَةَ سِماكُ بن خَرَشَة: رأيت إنساناً يَحْمِش الناس حَمْشاً شديداً، فصَمَدتْ له، فلما حَمَلْتُ عليه السيف وَلْوَلَ؛ فإذا امرأة، فأكرمتُ سيف رسول اللّٰه …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 381، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
