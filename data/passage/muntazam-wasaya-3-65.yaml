text: "… وستين. - عمار بن رجاء ابو نصر الاستراباذى. رحل الى العراق وسمع من ابى داود الحفرى ويزيد بن هارون وأبى نعيم وغيرهم وكان عابدا زاهدا ورعا وتوفى فى هذه السنة وقبره يزار ويتبرك به. - حمل بن احمد ابن الجنيد …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 3، ص 65، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 3, p. 65, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 3، ص 65 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen 3, pág. 65, que menciona una reliquia conservada tras su propietario, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Muntazam d'Ibn al-Jawzi (tome 3, p. 65) mentionnant une relique conservée après son propriétaire, une sépulture ou un lieu de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin resimli 3. cildinin 65. sayfasında, korunmuş bir kutsal emanet, bir defin, bir mezar ve bir türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, jilid 3 bergambar, halaman 65, menyebutkan sebuah relik yang terpelihara, sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, relik, dan makam."
