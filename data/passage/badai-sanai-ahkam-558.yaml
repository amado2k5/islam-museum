text: "… يجوز أداء الفرض قبل وقته، إلا صلاة العصر يوم عرفة على ما يذكر. والكلام فيه يقع في ثلاث مواضع: في بيان أصل أوقات الصلوات المفروضة، وفي بيان حدودها بأوائلها وأواخرها، وفي بيان الأوقات المستحبة منها، وفي بيان الوقت المكروه لبعض …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 558، يرد فيه ذكر الفرض، والمستحب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 558, whose wording mentions the obligatory (fard), the recommended (mustahabb), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 558 کا اقتباس جس میں فرض، مستحب، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 558, dont le texte mentionne l'obligatoire (fard), le recommandé (mustahabb), le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 558, cuyo texto menciona lo obligatorio (fard), lo recomendado (mustahabb), lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 558. sayfasından, farz, tavsiye edilen ve mekruh sayılan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz, tavsiye edilen, mekruh sayılan, yasak ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 558, yang menyebutkan amalan wajib, anjuran, dan najis; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, anjuran, najis, dan dosa-dosa kecil."
