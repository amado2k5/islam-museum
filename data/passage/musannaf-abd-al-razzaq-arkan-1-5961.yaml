text: "… رجع فقال : إني لأجد في ظهري شيئاً. فلم يلبث أَن مات، فناحته الجن، فقالوا : قتلنا سيد الخز رج سعد بن عبادة سين فلم نُخط فؤاده رميناه بسهم.. - ويقال: إنما هو الرجوع من الإيمان إلى الكفر، أو من …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 5961، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 5961, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 5961 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 1, pág. 5961, que menciona lo que se considera parte de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq (tome 1, p. 5961) mentionnant les éléments considérés comme faisant partie de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Musannaf Abd al-Razzaq'ın Resimli Cilt 1, sayfa 5961'deki bir alıntısında, imanın ne olarak kabul edildiğinden bahsediliyor; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 5961, menyebutkan apa yang dianggap sebagai iman; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks tersebut disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
