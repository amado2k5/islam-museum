text: "طريق العوفي عن ابن عباس (ومن عنده علم الكتاب) قال: هم أهل الكتاب من اليهود والنصارى. وأخرج عبد الرزاق، وابن جرير، وابن المنذر، وابن أبي حاتم في الآية قال: كان قوم من أهل الكتاب يشهدون بالحق ويعرفونه، منهم عبد الله"
