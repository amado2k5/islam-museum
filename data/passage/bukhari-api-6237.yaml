label: { ar: "صحيح البخاري 6237 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 6237 — what was made lawful; what is not lawful", ur: "صحیح بخاری 6237 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 6237 — Lo que se ha hecho lícito; lo que no es lícito" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ عَطَاءِ بْنِ يَزِيدَ اللَّيْثِيِّ، عَنْ أَبِي أَيُّوبَ ـ عَنِ النَّبِيِّ قَالَ \" لاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثٍ، يَلْتَقِيَانِ فَيَصُدُّ هَذَا، وَيَصُدُّ هَذَا، وَخَيْرُهُمَا الَّذِي يَبْدَأُ بِالسَّلاَمِ \". وَذَكَرَ سُفْيَانُ أَنَّهُ سَمِعَهُ مِنْهُ ثَلاَثَ مَرَّاتٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6237، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6237 (Asking Permission), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6237، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6237 (Pedir permiso), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
