  en: "A report in Sahih Muslim, no. 7431 (The Book of Zuhd and Softening of Hearts), that mentions leprosy and vitiligo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
