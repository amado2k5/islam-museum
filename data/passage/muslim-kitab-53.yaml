label:
  ar: "صحيح مسلم، كتاب الجنة وصفة نعيمها وأهلها"
  en: "Sahih Muslim, Book 53: The Book of Paradise, its Description, its Bounties and its Inhabitants"
  ur: "صحیح مسلم، کتاب الجنۃ وصفۃ نعیمہا واہلہا"
  es: "Sahih Muslim, Libro 53: El Libro del Paraíso, su descripción, sus bendiciones y sus habitantes."
summary:
  ar: "القسم 53 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجنة وصفة نعيمها وأهلها»، ويضم فيها النصوص من 7130 إلى 7234 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 53 of Sahih Muslim (The Book of Paradise, its Description, its Bounties and its Inhabitants) in the division of the open hadith dataset the museum took its reports from: reports 7130 to 7234 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 53، عنوان «کتاب الجنۃ وصفۃ نعیمہا واہلہا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7130 تا 7234۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 53 de Sahih Muslim (El Libro del Paraíso, su Descripción, sus Bendiciones y sus Habitantes) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 7130 al 7234 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
