label: { ar: "الموطأ 570 — ينزل ربنا كل ليلة إلى السماء الدنيا حين يبقى ثلث الليل الآخر: من يدعوني فأستجيب له", en: "Muwatta 570", es: "Muwatta 570", fr: "Muwatta 570", ur: "موطا 570", tr: "El-Muvatta 570 — Rabbimiz her gece gecenin son üçte biri kaldığında en alt semaya iner: “Kim bana dua eder de ben ona icabet edeyim?”", id: "Al-Muwatta 570 — Tuhan kita turun setiap malam ke langit terendah ketika sepertiga malam terakhir tersisa: “Siapa yang akan memohon kepada-Ku sehingga Aku dapat mengabulkannya?”" }
text: "من يدعوني فأستجيب له؟ من يسألني فأعطيه؟ من يستغفرني فأغفر له؟"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي عبد الله الأغر وعن أبي سلمة، كلاهما عن أبي هريرة، أن النبي أخبر أن الله ينزل كل ليلة إلى السماء الدنيا حين يبقى ثلث الليل الآخر، فيقول: من يدعوني فأستجيب له؟ من يسألني فأعطيه؟ من يستغفرني فأغفر له؟ ويذكر المحقق أن في بعض النسخ «أبي سلمة بن عبد الرحمن»، وأنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والقعنبي عند البخاري (1145) وأبي داود ⁦(1315 و4733)⁩، وعبد العزيز بن عبد الله عند البخاري (6321)، ومعن عند الترمذي (3498)، ويحيى بن يحيى النيسابوري عند مسلم (2/175)، وأن إسماعيل بن أبي أويس رواه عن مالك من طريق الأغر وحده عند البخاري (7494). {cite:muwatta-maruf-1997 p.293} {cite:muwatta-maruf-1997 p.294}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Abdullah el-Aghar ve Ebu Seleme'den, her ikisi de Ebu Hurayra'dan rivayet ederek, Peygamberimizin bize şöyle buyurduğunu aktarmıştır: Allah her gece gecenin son üçte biri kaldığında en alt semaya iner ve şöyle buyurur: \"Kim bana dua eder de ona icabet edeyim? Kim benden bir şey ister de ona vereyim? Kim benden bağışlanma diler de onu bağışlayayım?\" Editör, bazı rivayetlerde \"Ebu Seleme ibn Abdülrahman\" olarak geçtiğini ve Malik'ten Ebu Musab tarafından, onun isnadıyla da İbn Hibban, el-Baghawi ve el-Ka'nabi tarafından Buhari'de (1145) ve Ebu Davud'da (1315 ve 4733), Abdülaziz ibn Abdullah tarafından Buhari'de (6321), Ma'n tarafından Tirmizi'de (3498), Yahya ibn Yahya el-Naysaburi tarafından Müslim'de (2/175) ve İsmail ibn Ebi Uveys'in de Malik'ten, sadece el-Ağar'ın rivayetiyle Buhari'de (7494) nakledildiğini belirtiyor."
  id: "Malik meriwayatkannya dari Ibnu Shihab, dari Abu Abdullah al-Aghar dan Abu Salamah, keduanya dari Abu Hurayrah, bahwa Nabi memberitahukan kepada kita bahwa Allah turun setiap malam ke langit terendah ketika sepertiga malam terakhir tersisa, dan berfirman: “Siapa yang akan memohon kepada-Ku sehingga Aku mengabulkannya? Siapa yang akan meminta kepada-Ku sehingga Aku memberinya? Siapa yang akan memohon ampunan-Ku sehingga Aku mengampuninya?” Penyunting menyebutkan bahwa dalam beberapa versi disebutkan “Abu Salamah ibn Abd al-Rahman,” dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, dan dari sanadnya oleh Ibn Hibban, al-Baghawi, dan al-Qa’nabi dalam al-Bukhari (1145) dan Abu Dawud (1315 dan 4733), dan oleh Abd al-Aziz ibn Abdullah dalam al-Bukhari (6321), dan oleh Ma’n dalam al-Tirmidhi (3498), dan oleh Yahya ibn Yahya al-Naysaburi dalam Muslim (2/175), dan bahwa Ismail ibn Abi Uways meriwayatkannya dari Malik berdasarkan otoritas al-Aghar saja dalam al-Bukhari (7494)."
