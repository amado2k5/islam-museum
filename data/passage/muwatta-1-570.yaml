label: { ar: "الموطأ 570 — ينزل ربنا كل ليلة إلى السماء الدنيا حين يبقى ثلث الليل الآخر: من يدعوني فأستجيب له", en: "Muwatta 570" }
text: "من يدعوني فأستجيب له؟ من يسألني فأعطيه؟ من يستغفرني فأغفر له؟"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي عبد الله الأغر وعن أبي سلمة، كلاهما عن أبي هريرة، أن النبي أخبر أن الله ينزل كل ليلة إلى السماء الدنيا حين يبقى ثلث الليل الآخر، فيقول: من يدعوني فأستجيب له؟ من يسألني فأعطيه؟ من يستغفرني فأغفر له؟ ويذكر المحقق أن في بعض النسخ «أبي سلمة بن عبد الرحمن»، وأنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والقعنبي عند البخاري (1145) وأبي داود (1315 و4733)، وعبد العزيز بن عبد الله عند البخاري (6321)، ومعن عند الترمذي (3498)، ويحيى بن يحيى النيسابوري عند مسلم (2/175)، وأن إسماعيل بن أبي أويس رواه عن مالك من طريق الأغر وحده عند البخاري (7494). {cite:muwatta-maruf-1997 p.293} {cite:muwatta-maruf-1997 p.294}"
