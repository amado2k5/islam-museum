label: { ar: "الموطأ 512 — مالك: صلاة الاستسقاء ركعتان ثم خطبة قائماً وتحويل الرداء", en: "Muwatta 512", es: "Muwatta 512", fr: "Muwatta 512", ur: "موطا 512", tr: "El-Muvatta 512 — Malik: Yağmur duası iki rekattan oluşur, ardından ayakta hutbe okunur ve sonra elbise ters çevrilir.", id: "Al-Muwatta 512 — Malik: Shalat memohon hujan terdiri dari dua rakaat, diikuti dengan khutbah sambil berdiri, dan kemudian membalikkan jubah dari dalam ke luar." }
summary:
  ar: "سؤال في باب العمل في الاستسقاء: سُئل مالك عن صلاة الاستسقاء كم هي، فقال ركعتان، ولكن يبدأ الإمام بالصلاة قبل الخطبة فيصلي ركعتين ثم يخطب قائماً ويدعو ويستقبل القبلة ويحول رداءه حين يستقبل القبلة، ويجهر في الركعتين بالقراءة، وإذا حول رداءه جعل الذي على يمينه على شماله والذي على شماله على يمينه، ويحول الناس أرديتهم إذا حول الإمام رداءه ويستقبلون القبلة وهم قعود. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.265}"
  tr: "Yağmur duasının yapılış şekliyle ilgili bir soru: Malik'e kaç rekattan oluştuğu soruldu ve o şöyle dedi: \"İki rekattır. İmam hutbeden önce namaz kılar. İki rekat namaz kılar, sonra ayakta, dua ederek ve kıbleye dönerek hutbe okur. Kıbleye döndüğünde cübbesini çevirir ve her iki rekatta da yüksek sesle okur. Cübbesini çevirdiğinde sağındaki giysiyi soluna, solundaki giysiyi de sağına koyar. İmam cübbesini çevirdiğinde cemaat de cübbelerini çevirir ve oturarak kıbleye dönerler.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.265}"
  id: "Pertanyaan mengenai tata cara salat memohon hujan: Malik ditanya berapa rakaat salat tersebut, dan beliau menjawab, \"Dua rakaat. Imam memulai dengan salat sebelum khutbah. Beliau salat dua rakaat, kemudian menyampaikan khutbah sambil berdiri, berdoa, dan menghadap kiblat. Beliau membalikkan jubahnya ketika menghadap kiblat, dan beliau membaca Al-Quran dengan suara keras di kedua rakaat. Ketika beliau membalikkan jubahnya, beliau meletakkan kain di sebelah kanan ke sebelah kiri dan kain di sebelah kiri ke sebelah kanan. Orang-orang membalikkan jubah mereka ketika imam membalikkan jubahnya, dan mereka menghadap kiblat sambil duduk.\" Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.265}"
