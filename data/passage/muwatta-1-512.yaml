label: { ar: "الموطأ 512 — مالك: صلاة الاستسقاء ركعتان ثم خطبة قائماً وتحويل الرداء", en: "Muwatta 512" }
summary:
  ar: "سؤال في باب العمل في الاستسقاء: سُئل مالك عن صلاة الاستسقاء كم هي، فقال ركعتان، ولكن يبدأ الإمام بالصلاة قبل الخطبة فيصلي ركعتين ثم يخطب قائماً ويدعو ويستقبل القبلة ويحول رداءه حين يستقبل القبلة، ويجهر في الركعتين بالقراءة، وإذا حول رداءه جعل الذي على يمينه على شماله والذي على شماله على يمينه، ويحول الناس أرديتهم إذا حول الإمام رداءه ويستقبلون القبلة وهم قعود. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.265}"
