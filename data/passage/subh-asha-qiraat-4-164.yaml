text: "… الشيخ أبو عمرو الدانى : وأرىٰ أن أستعمل النقط لونين، الحمرة والصُّفْرَة، فتكون الحمرة للحركات، والتنوين، والتشديد، والتخفيف، والسكون، والوصل، والمدّب وتكون الصفرة للهمزة خاصة. قال : وعلىٰ ذلك مَصَاحف أهل المدينة. ثم قال : وإن استعملت الخضرة للابتداء بألفات …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 4، ص 164، يذكر جمع القرآن والمصاحف، ورسم المصحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 4, p. 164, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 4، ص 164 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen 4, pág. 164, que menciona la colección del Corán y los códices, la ortografía del mushaf, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 4, p. 164) mentionne la compilation du Coran et des codex, l'orthographe du mushaf, ainsi que la ponctuation et les signes vocaliques de ce dernier. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin Resimli Cilt 4, s. 164'ünden bir alıntı, Kur'an'ın derlenmesini ve el yazmalarını, Kur'an'ın yazısını, noktalama işaretlerini ve genel biçimini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve noktalama işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Subh al-A'sha karya Al-Qalqashandi, Jilid 4 Bergambar, hlm. 164, membahas penyusunan Al-Qur'an dan manuskripnya, aksara Al-Qur'an, tanda diakritiknya, dan bentuk keseluruhannya. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
