text: "… اقلبوه أمره أبوهُ أن يُصلح جُبّاً، ويضع له قارا، ويصقله، فوضع له القار مِنَ الخارج وصقلَه، فقال له أبوه : ويْحَكَ، إنَّما يقيَّر من الداخل. فقال: اقلبوه! القار : القطران."
summary:
  ar: "قال أب جحا له أن يصلح صهريجاً ويقطره من الداخل، فقطّر جحا الخارج، فوبخه أبوه، فقال جحا «اقلبوه». {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  en: "Juha's father tells him to repair a cistern and tar it from the inside; Juha tars the outside; the father rebukes him; Juha says 'turn it over'. {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  ur: "جحا کے باپ نے اسے حکم دیا کہ حوض کی مرمت کرے اور اندر سے تارکول لگائے، جحا نے باہر سے لگا دیا، باپ نے اسے ڈانٹا، تو جحا نے کہا «اسے الٹ دو»۔ {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  fr: "Le père de Juha lui dit de réparer une citerne et de la goudronner à l'intérieur ; Juha la goudronne à l'extérieur ; le père le réprimande ; Juha dit : « Retournez-la ». {cite:juha-nawadir-kubra-djuwaydi p. 187}"
  es: "El padre de Juha le dice que repare una cisterna y la alquitrane por dentro; Juha la alquitrana por fuera; el padre lo reprende; Juha dice: «Dénle la vuelta». {cite:juha-nawadir-kubra-djuwaydi p. 187}"
