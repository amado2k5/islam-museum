label: { ar: "جامع الترمذي 742 — المستحب، ما كُره", en: "Jami' al-Tirmidhi 742 — the recommended (mustahabb); what was disliked", ur: "جامع ترمذی 742 — مستحب، جو ناپسند کیا گیا", fr: "Jami' al-Tirmidhi 742 — le recommandé (mustahabb) ; ce qui fut réprouvé", es: "Yami' al-Tirmidhi 742 — lo recomendado (mustahabb); lo que se reprobó" }
text: "… كُلِّ شَهْرٍ ثَلاَثَةَ أَيَّامٍ وَقَلَّمَا كَانَ يُفْطِرُ يَوْمَ الْجُمُعَةِ. قَالَ وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَأَبِي هُرَيْرَةَ. قَالَ أَبُو عِيسَى حَدِيثُ عَبْدِ اللَّهِ حَدِيثٌ حَسَنٌ غَرِيبٌ. وَقَدِ اسْتَحَبَّ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ صِيَامَ يَوْمِ الْجُمُعَةِ وَإِنَّمَا يُكْرَهُ أَنْ يَصُومَ يَوْمَ الْجُمُعَةِ لاَ يَصُومُ قَبْلَهُ وَلاَ بَعْدَهُ. قَالَ وَرَوَى شُعْبَةُ عَنْ عَاصِمٍ هَذَا الْحَدِيثَ وَلَمْ يَرْفَعْهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 742، يرد فيه ذكر المستحب، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 742 (The Book on Fasting), whose wording mentions the recommended (mustahabb), what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 742، جس کے الفاظ میں مستحب، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 742, dont le texte mentionne le recommandé (mustahabb), ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 742, cuyo texto menciona lo recomendado (mustahabb), lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
