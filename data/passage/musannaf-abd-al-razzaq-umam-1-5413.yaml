text: "… اليهود والنصارى، وأَن يصافحوا. كنَّى - أَخبرنا معمر عن الزهري أَنَّ رسول اللّٰه عل ا تقدم في السادس في باب الجزية. قدّمه المصنف في السادس، وزاد هنا قول الثوري وقول نفسه أنه لا بأس به، راجع باب مصافحة أهل الكتاب."
