label: { ar: "الموطأ 1941 — يحيى عن مالك عن أبي حازم بن دينار عن سعيد بن المسيب: أن رسول الله نهى عن بيع الغرر", en: "Muwatta 1941", es: "Muwatta 1941", fr: "Muwatta 1941", ur: "موطا 1941", tr: "El-Muvatta 1941 — Yahya, Malik'ten, o da Ebu Hazim bin Dinar'dan, o da Said bin el-Musayyab'dan rivayetle: Allah'ın Resulü, belirsizliğin satışını yasaklamıştır.", id: "Al-Muwatta 1941 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Abu Hazim bin Dinar berdasarkan riwayat Saeed bin Al-Musayyab: bahwa Rasulullah melarang jual beli barang yang tidak pasti" }
summary:
  ar: "يروي يحيى عن مالك عن أبي حازم بن دينار عن سعيد بن المسيب أن رسول الله نهى عن بيع الغرر. ويذكر المحقق أن حديث أبي هريرة المتصل في النهي عن بيع الغرر يصح من حديث الأعرج، لا من حديث سعيد عن أبي هريرة. {cite:muwatta-maruf-1997 p.194}"
  id: "Yahya meriwayatkan dari Malik, dari Abu Hazim ibn Dinar, dari Sa'id ibn al-Musayyab, bahwa Rasulullah shalla Allahu alaihi wa sallam melarang jual beli spekulatif. Peneliti mencatat bahwa hadits terkait dari Abu Hurayrah mengenai larangan jual beli spekulatif adalah sahih melalui riwayat al-A'raj, bukan melalui riwayat Sa'id dari Abu Hurayrah. {cite:muwatta-maruf-1997 p.194}"
