text: "غاب عمي أنس بن النضر عن قتال بدر فقال: يا رسول الله، غبت عن أول قتال قاتلت المشركين، لئن الله أشهدني قتال المشركين ليرين الله ما أصنع. فلما كان يوم أحد وانكشف المسلمون قال: اللهم إني أعتذر إليك مما صنع هؤلاء"
summary:
  ar: "في كتاب الجهاد؛ رواية أنس بن مالك عن عمه الذي فاته بدر فنذر، فلما انكشف الناس يوم أحد تقدم وقال لسعد بن معاذ «الجنة ورب النضر، إني أجد ريحها من دون أحد»، فوجدوا به بضعاً وثمانين ضربة وطعنة ورمية وقد مُثّل به حتى لم يعرفه إلا أخته ببنانه، وكانوا يظنون أن آية «من المؤمنين رجال صدقوا ما عاهدوا الله عليه» نزلت فيه وأشباهه."
  tr: "Cihad kitabında Enes bin Malik, Bedir'i özleyen ve bunun üzerine bir adak adayan amcasından bahsetmiştir. Uhud günü insanlar dağıldığında, amcası öne çıkıp Saad bin Muaz'a, \"Nadr'ın Rabbine yemin ederim ki, Uhud'un ötesinden bile onun kokusunu alabiliyorum\" demiştir. Amcasının üzerinde seksenin üzerinde darbe, bıçak darbesi ve ok yarası bulunmuş, o kadar parçalanmıştı ki, kız kardeşi dışında kimse onu parmak uçlarından tanıyamamıştı. \"Müminler arasında Allah ile olan ahdine sadık kalanlar vardır\" ayetinin onun ve onun gibiler için nazil olduğunu düşünmüşlerdir."
  id: "Dalam kitab Jihad, Anas bin Malik meriwayatkan tentang pamannya yang gagal ikut serta dalam Perang Badar dan membuat nazar. Ketika orang-orang berpencar pada hari Perang Uhud, ia maju dan berkata kepada Saad bin Muadz, “Demi Tuhan Al-Nadr, aku dapat mencium keharumannya dari seberang Uhud.” Mereka mendapati padanya lebih dari delapan puluh luka tusukan, tusukan, dan panah, dan ia telah dimutilasi sehingga tidak ada yang mengenalinya kecuali saudara perempuannya melalui ujung jarinya. Mereka mengira bahwa ayat “Di antara orang-orang mukmin ada orang-orang yang bertakwa kepada Allah” diturunkan kepadanya dan orang-orang seperti dia."
