label: { ar: "البخاري 2805 — استشهاد أنس بن النضر", en: "Bukhari 2805 — The martyrdom of Anas ibn al-Nadr" }
text: "غاب عمي أنس بن النضر عن قتال بدر فقال: يا رسول الله، غبت عن أول قتال قاتلت المشركين، لئن الله أشهدني قتال المشركين ليرين الله ما أصنع. فلما كان يوم أحد وانكشف المسلمون قال: اللهم إني أعتذر إليك مما صنع هؤلاء"
summary:
  ar: "في كتاب الجهاد؛ رواية أنس بن مالك عن عمه الذي فاته بدر فنذر، فلما انكشف الناس يوم أحد تقدم وقال لسعد بن معاذ «الجنة ورب النضر، إني أجد ريحها من دون أحد»، فوجدوا به بضعاً وثمانين ضربة وطعنة ورمية وقد مُثّل به حتى لم يعرفه إلا أخته ببنانه، وكانوا يظنون أن آية «من المؤمنين رجال صدقوا ما عاهدوا الله عليه» نزلت فيه وأشباهه."
