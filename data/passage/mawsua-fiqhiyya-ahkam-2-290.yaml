text: "تسبيح ولم يذكروا التسبيح في افتتاح الصلاة لا من الفرائض ولا من السنن. التسبيح في الركوع : - التسبيح في الركوع سنة عند الحنفية في المشهور، وقيل واجب. ومستحب عند الشافعية، ومندوب عند المالكية. وواجب عند الحنابلة بتسبيحة واحدة، والسنة …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 2، ص 290، يرد فيه ذكر الفريضة والفرائض، والواجب، والمستحب، والمندوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 2, p. 290, whose wording mentions the obligation (farida), the obligatory (wajib), the recommended (mustahabb), the recommended (mandub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 2، ص 290 کا اقتباس جس میں فریضہ اور فرائض، واجب، مستحب، مندوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 2, p. 290, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), le recommandé (mustahabb), le recommandé (mandub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 2, p. 290, cuyo texto menciona la obligación (farida), lo obligatorio (wajib), lo recomendado (mustahabb), lo recomendado (mandub); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 2, sayfa 290'dan, farz olan ameller, görevler, tavsiye edilen ameller ve müstehap olan ameller ile ilgili bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 2 Bergambar, halaman 290, yang menyebutkan amalan wajib, kewajiban, amalan yang dianjurkan, dan amalan yang disukai; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
