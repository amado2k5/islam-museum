text: |-
  ٣٨٢
  . •⁦(سكن)⁩ o .
  الاسلام والاسدان لغة فى الاسدال وهى سدول الهوادج قال الزفيان
  ماذا تذكرت من الاظعان * طوالعام غحوذى بوان
  كاتماءلقن بالاسدان * يانع حاض رأرجوان
  وسدن الرجل توبه وسدن الستراذا أرسله ( رجن السرجين بالكسر معرب لانه
  يس فى الكلام فعلين بالنتح وية ال سرقين (سطن ، الاسطوانة معروفة والنون أصاية
  وهوافعوالة مثل ألحوانة لانه يقال أساطين مسطنة وكان الاخفسر يقول هو فعلوانة وهذا
  يوجب أن تكون الواوزائدة والى جنبهازائدتان الالف والمون وهذ الايكاديكون
  وقال قوم هو أفعلانة ولو كان كذلك لما بمع على أساطين لانه ليس فى السلام أفاعين وجل
  أسطوان أى مر تفع وقال • جزين من أسطوانا أعنقا * ⁦( سعن)⁩ السعن بالضم قربة
  تقطع من نصفها وينبسذفيها وريا اسة قى به، كالدلووربعاً جعات المرأة فيم اغزلها وقطنها
  والمع سعنة مثل غصن وغصنة وقواهم ماله سعنة ولا معنة بالفتح أى شئ (سفن السفن
  ما يتحت به الشى والمسفن مثله قال * وأنت فى كفكالبراة والسمن* يقول انك نجار
  وقال ذوالرمة تخوّف الرحل منهانا. كاقردا • كما تخوّف ظهر النبعة السفن
  بعى تنقص والسفن أيضا جلد أخشن لملود التماسيح يجعل على قواتم السيوف وسفنت
  الذئ سفناقشرته قال امر ؤالقيس
  نجاء خفيايسفن الارض بطنه * ترى الترب منه لازقا كل ملزق
  واغاجاء متلبداعلى الارض لثلابراء الصيدفية رمنه وستنت الريح التراب عسن وجه
  الارض والسوافن الرياح الواحدة سافنة والسفينة معروفة والفان صاحبها وسفانة
  نت حاتم جاي وبها يكنى والسفين يجمع سسفينة قال ابن دريد سة ينة فعيلة بمعن فاءلة كانها
  تسفن الماء أى تقشره كن سكن الشوسكونا استقرونبت وسكنه غيره تسكينا
  والسكينة الوداع والوقار وسكنت دارى وأسكنته اغيرى والاسم منه السكنى كمى أن
  العتسم من الاعتاب رهم سكان فلان والسكان أيضاذئب السفينة ومسكن بكر
  الكافموضع من أرض الكوفة والمكن أيضا المنزل والبيت وأهل الي زيقولون
  مسكن بالفتح والسكن أهل الدار قال ذو الرقة
  فياكرم السكن الذين تحملوا • عن الدار والمستخلف المتيدل
  وف الحديث حتى انَ الرمانة لتشبع السكن والسكن بالتهريك النسار قال الراجز
  ألجأها الليل وريح :له * الى سوادابل وتله • وسكن توقد فى مظله
  والسكن أيضا كل ماسكنت اليه وفلان ابن السكن وكان الاصععى يقوه يجزم المكاف
  وسوكين مصغراحى من العرب فى شعر النابقة الذيانىّ والمكين الفقير وقد يكون
  بمفى الذلة والضعف يقال تسكن الرجل وتمسكن كما فا لواتدوع وتندل من المدرعة
  والنديل على تفعل وهوشاذ وقاسه تسكن وتدرّع وتندل.مل تشهيع وتحلم وكان
  يونس يقول المسكيز أشتحالا من الفقسيز قال وقلت لاعراب أفقير أنت فقال لا والقه :ل
  مسكين وفى الحديت ايس المسكمين الذى ترده اللقمة والاقمتان وائما المسسكين الذى لا يسال
  ولا
