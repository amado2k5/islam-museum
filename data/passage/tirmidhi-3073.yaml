label:
  ar: "الترمذي 3073 — إن الله كتب الحسنات والسيئات"
  en: "Tirmidhi 3073 — God has written good deeds and bad deeds"
  ur: "ترمذی 3073 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
text: "قال الله عز وجل وقوله الحق إذا هم عبدي بحسنة فاكتبوها له حسنة فإن عملها فاكتبوها له بعشر أمثالها وإذا هم بسيئة فلا تكتبوها فإن عملها فاكتبوها بمثلها فإن تركها وربما قال لم يعمل بها فاكتبوها له حسنة ثم قرأ …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3073: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3073: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3073: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
