label:
  ar: "الترمذي 3073 — إن الله كتب الحسنات والسيئات"
  en: "Tirmidhi 3073 — God has written good deeds and bad deeds"
  ur: "ترمذی 3073 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
  es: "Tirmidhi 3073 — Dios ha escrito las buenas y las malas obras."
  fr: "Tirmidhi 3073 — Dieu a écrit les bonnes et les mauvaises actions"
  tr: "Tirmizi 3073 — Allah iyilikleri ve kötülükleri takdir etmiştir."
  id: "Tirmidzi 3073 — Tuhan telah menetapkan amal baik dan amal buruk."
text: "قال الله عز وجل وقوله الحق إذا هم عبدي بحسنة فاكتبوها له حسنة فإن عملها فاكتبوها له بعشر أمثالها وإذا هم بسيئة فلا تكتبوها فإن عملها فاكتبوها بمثلها فإن تركها وربما قال لم يعمل بها فاكتبوها له حسنة ثم قرأ …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3073: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3073: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3073: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 3073: Dios ha escrito las buenas y las malas acciones. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 3073: Dieu a prescrit les bonnes et les mauvaises actions. Le Prophète le relate d’après son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Cami' el-Tirmizi'de 3073 numaralı hadis-i kudsi şöyledir: \"Allah iyiliği ve kötülüğü takdir etmiştir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 3073: \"Allah telah menetapkan amal kebaikan dan amal keburukan.\" Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta'."
