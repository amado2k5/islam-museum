  ar: "صحيح مسلم، كتاب الصلاة"
  en: "Sahih Muslim, Book 4: The Book of Prayers"
  ur: "صحیح مسلم، کتاب الصلاۃ"
  es: "Sahih Muslim, Libro 4: El Libro de las Oraciones"
  fr: "Sahih Muslim, Livre 4: Le Livre des prières"
summary:
  ar: "القسم 4 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصلاة»، ويضم فيها النصوص من 837 إلى 1160 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 4 of Sahih Muslim (The Book of Prayers) in the division of the open hadith dataset the museum took its reports from: reports 837 to 1160 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 4، عنوان «کتاب الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 837 تا 1160۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 4 de Sahih Muslim (El Libro de las Oraciones) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 837 al 1160 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des prières), volume 4, qui correspond aux hadiths 837 à 1160 de la numérotation de ce recueil. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
