text: "… فحدثني العباسُ بن عبدالله بن مَعْبَدٍ بن عباس، عن بعض أهله، عن ابن عبَّاس، قال: مَشَوْا إلى أبي طالب فكَلَّموه - وهم أشرافُ قومه: عُتْبَةُ بْنُ ربيعَة، وشَيْبة بن ربيعة، وأبو جهل بن مشام، وأُمَيَّةُ بن خلف، وأبو سُفيانَ بنِ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 192، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
