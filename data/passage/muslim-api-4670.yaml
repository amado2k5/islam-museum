label: { ar: "صحيح مسلم 4670 — الأب والأبوة", en: "Sahih Muslim 4670 — the father and fatherhood", ur: "صحیح مسلم 4670 — باپ اور والدیت", es: "Sahih Muslim 4670 — El padre y la paternidad", fr: "Sahih Muslim 4670 — Le père et la paternité", tr: "Sahih Muslim 4670 — Baba ve Babalık", id: "Sahih Muslim 4670 — Ayah dan Peran Ayah" }
text: "… قَالَ سَمِعْتُ الْبَرَاءَ، قَالَ كَانَ رَسُولُ اللَّهِ يَوْمَ الأَحْزَابِ يَنْقُلُ مَعَنَا التُّرَابَ وَلَقَدْ وَارَى التُّرَابُ بَيَاضَ بَطْنِهِ وَهُوَ يَقُولُ \" وَاللَّهِ لَوْلاَ أَنْتَ مَا اهْتَدَيْنَا وَلاَ تَصَدَّقْنَا وَلاَ صَلَّيْنَا فَأَنْزِلَنْ سَكِينَةً عَلَيْنَا إِنَّ الأُلَى قَدْ أَبَوْا عَلَيْنَا \". قَالَ وَرُبَّمَا قَالَ \" إِنَّ الْمَلاَ قَدْ أَبَوْا عَلَيْنَا إِذَا أَرَادُوا فِتْنَةً أَبَيْنَا \". وَيَرْفَعُ بِهَا صَوْتَهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4670، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4670 (The Book of Jihad and Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4670، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4670 (El Libro de la Yihad y las Expediciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 4670 (Livre du Jihad et des Expéditions), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 4670 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4670, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
