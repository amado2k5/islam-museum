text: "… ثمنه. أذا بيع لمن يغزو به في سبيل اللّه فثمنه من الطيبات. وكذلك ثياب الحرير. إذا بيعت لمن يلبسها ممن يحرم عليه لبسها، حرم أكل ثمنها، بخلاف بيعها ممن يحل له لبسها أه. وإذا كانت الأعيان التي يحل الإنتفاع بها …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 395، يذكر ما أُحل، وما حُرّم، والطيبات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 395, that mentions what was made lawful, what was made unlawful, the good things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 395 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا، پاکیزہ چیزیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 3, pág. 395, que menciona lo que se hizo lícito, lo que se hizo ilícito y las buenas obras; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 3, page 395, mentionnant ce qui a été déclaré licite, ce qui a été déclaré illicite et les bonnes choses; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 3. cildinin 395. sayfasından, helal, haram ve hayırlı olanı belirten bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 3, halaman 395, yang menyebutkan apa yang diperbolehkan, apa yang diharamkan, dan apa yang baik; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
