label: { ar: "الموطأ 1540 — مالك: الأمة التي ولدت من الرجل وهي لغيره لا تكون أم ولد له بذلك الولد، حتى تلد منه وهي في ملكه بعد ابتياعه إياها", en: "Muwatta 1540", es: "Muwatta 1540", fr: "Muwatta 1540", ur: "موطا 1540", tr: "Al-Muwatta 1540 — Malik: Başkasına ait olan bir köle kadın, bir erkekten çocuk doğurursa, o erkeğin satın aldığı kadın, erkeğin mülkiyetindeyken ondan çocuk doğurmadıkça, o erkekle çocuk sahibi olmuş sayılmaz.", id: "Al-Muwatta 1540 — Malik: Seorang budak perempuan yang melahirkan anak dari seorang laki-laki tetapi menjadi milik orang lain tidak menjadi ibu dari anak laki-laki tersebut, sampai ia melahirkan anak dari laki-laki itu saat ia masih berada dalam kepemilikan laki-laki itu setelah laki-laki itu membelinya." }
summary:
  ar: "يقول مالك في الرجل ينكح الأمة فتلد منه ثم يبتاعها، إنها لا تكون أم ولد له بذلك الولد الذي ولدت منه، وهي لغيره، حتى تلد منه وهي في ملكه بعد ابتياعه إياها. {cite:muwatta-maruf-1997 p.44}"
  tr: "Malik, bir erkeğin bir köle kadınla evlenip, ondan bir çocuk doğurduktan sonra onu geri satın alması durumunda, kadının henüz onun malı iken doğurduğu çocuk nedeniyle cariyesi haline gelmediğini, ancak satın aldıktan sonra hala onun malı iken bir çocuk doğurması halinde cariyesi haline geleceğini söyler. {cite:muwatta-maruf-1997 s.44}"
  id: "Malik mengatakan mengenai seorang pria yang menikahi seorang wanita budak, wanita itu melahirkan anak baginya, dan kemudian pria itu membelinya kembali, bahwa wanita itu tidak menjadi selirnya karena anak yang dilahirkannya, selama ia masih menjadi miliknya, sampai ia melahirkan anak lagi baginya saat ia masih menjadi miliknya setelah dibeli. {cite:muwatta-maruf-1997 p.44}"
