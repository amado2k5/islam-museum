label: { ar: "سنن أبي داود 646 — الأب والأبوة", en: "Sunan Abi Dawud 646 — the father and fatherhood", ur: "سنن ابی داؤد 646 — باپ اور والدیت", es: "Sunan Abi Dawud 646 — El padre y la paternidad", fr: "Sunan Abi Dawud 646 — Le père et la paternité", tr: "Sunan Abi Davud 646 — Baba ve Babalık", id: "Sunan Abi Dawud 646 — Sang Ayah dan Peran Ayah" }
text: "… حَدَّثَنَا عَبْدُ الرَّزَّاقِ، عَنِ ابْنِ جُرَيْجٍ، حَدَّثَنِي عِمْرَانُ بْنُ مُوسَى، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ الْمَقْبُرِيِّ، يُحَدِّثُ عَنْ أَبِيهِ، أَنَّهُ رَأَى أَبَا رَافِعٍ مَوْلَى النَّبِيِّ مَرَّ بِحَسَنِ بْنِ عَلِيٍّ وَهُوَ يُصَلِّي قَائِمًا وَقَدْ غَرَزَ ضُفُرَهُ فِي قَفَاهُ فَحَلَّهَا أَبُو رَافِعٍ فَالْتَفَتَ حَسَنٌ إِلَيْهِ مُغْضَبًا فَقَالَ أَبُو رَافِعٍ أَقْبِلْ عَلَى صَلاَتِكَ وَلاَ تَغْضَبْ فَإِنِّي سَمِعْتُ رَسُولَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 646، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 646 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 646، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 646 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 646 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 646 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 646, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
