text: |-
  والصواب فى صاحب لات
  العرب ولادة وموتاات ولادته
  سنة ٦٣٠ وموته سنة ٧١١
  كافى صنيحة ٢٤٦ من حسن
  المحاضرة للسيوطى وفى أول
  شرح م روان المزبيدى صاحب
  مختصر العين مات سنة ٧٩م
  وان غلام تعلب مات سنة ٣٤٥
  عن تانين سنة كافى صفحة ٢٣٣
  من المزهر وكذا فى الوفيات يفتح
  الفاء كمصيات وانمانبهت على
  هذا لانى سمعت من يكسر الفاء
  ويسدد الياغلطا اه مؤلفه
  ١٠
  ولما تصفحت ملازم الجزه الاول من هذا الكتاب بعد الطبع عنرت على بعض هفوات وقها يسلم
  انسان من العنرات: وجب الفرار من السكات على الخطأ ببيان الصواب فقط فقلت راهزا
  للصفحة بااصادولاسطر بالسين ص ٤ س ٣ وابرياء بوضع الهمزبع-دالالف لافوقها
  ص ١٠ س ١٧ وتنفل بتامين ٢٥ ادرأت بلا ألف قبل الراء ص ١٢ س ٦ خبيت
  ص ١٣ س ٢٧ والسرأة بجعل الهمز على الالف لابعدها ص ١٦ س ٦ كانه بائس
  ٢٤ مثال الطاعة ص ١٨ س ٧ نبورها بالنون فيه وفى قوله بعد فسنرى على رواية مر
  لا بالفوقية ص ٢٠ س ٢٢ أكساخيل بجعل الهمزعلى الالف الاولى لاتتها
  ص ٢٣ س ١م تنادواتقشط الواوقبل الدال ص ٢٦ من ١٧ ونخأونها: يمل
  الهسمزعلى الالف فى الكلمة الاولى المهركة وبعدها فى الثانية ص ٣٠ س ٥ وأص-لدها.
  يجعل الهمز بعد الالف لاقوقها ١٩ والمع باثبات الواو ص ٢٢ س ٢٨ على أظراب
  بالظاء المعجمة والباء الموحدة ص ٣٣ س ١٣ وذات سدم بالدال لاالراءص ٣٦
  س ١١ جديب الجناب بائيات الااف الاقطة عند الطبع ١٦ والجندب بائبات الواو
  أولاص ٦٩ س ٢ شهريه بلانقط الها فيه وفى الرقيه ص ٧٥ صن ١٠٠ يدين بالتهتية
  أولا أى يطيع كافى مر ص ٨٤ س ٣ من سنته ص ٩٣ بالهامسْ ولبون معزاب
  -ويت فاصيت نهبى وآزية الخ والازية بالبا لا اللام ص ٩٦ س ٢٢ برح
  بالعنين بكسر العيز وشد النون على ماف مر ٢٦ لاصبح رقا بالمثناة لاالمثلثة ص ١١٣
  س ١٤ وبانته قال فى المختار «كذاهو فى النسخ بنون بعدهاتاء ولا أعرف له وجها
  وي-تمل أن يكون من تحريف النساخ وكأن أصله وباتنه من اليت اه ثم رأيت المتريم
  الوانى جعله ابالنون والتاءمعطوفة على انقماعت وعليه تكون الثاء للتأنيت وفى الملزمة ٤٧
  غلطان أواهما فى رأص الصفحة ١٧٧ وصوابه فصل الرارحح والثانى فى صفحة ١٧٨
  وضع فدل السين. وضع نمل الزاى وبالعكس امونهم أخر وا وضع ذلك بالحروف الفارس
  مدتعصيم الملزمة وجل من لايسه وولا يغفل وأما الحزه الثانى فقد طاب منى جولان النظر
  فيه لا صلاح ماعدى أن يكون وقع فيه فلم أنتهز من الزمان فرصة ذلك الا ائه اتفق الاطلاع
  على ملزمة ٤٧ رأيت فى أولها صفحة ١٨٥ هامشة معزية للقاموس من نسخة غير صيحة
  وفى آخرهاص ١٨٨ هامشة كذلك أسندفيها للقساموس عن تحريف قول العامة أحق
  من رحله:أورث ذلكْ تحر بفا فى متن الصحاح فيلزم اصلاح كل من القاموس الصميح
  ونس أنه سبحانه أن لايؤا خذنا ان نينا أ وأخطأ ناحى يتوفانا
  على الايمان يخامسيد وادعدنات صلى الله
  وسلم عليه وعلى آله وأتصمابه
  ومن تبعه-م
  احسان
  آمين
