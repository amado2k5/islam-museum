text: "… إِنَّ رسول اللّٰه بعثَنا إليك أَن تخرج إليه فيستعملك على خَيْبَر ويُحسِن إليك. فطمع فى ذلك، وشاور اليهود فخالفوه فى الخروج وقالوا : ما كان محمّدٌ يستعمل رجلاً من بنى إسرائيل. فقال : بلى، قد مَللنا الحربَ. قال : فخرج …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 567، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 567, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
