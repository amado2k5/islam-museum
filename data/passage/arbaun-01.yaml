label: { ar: "الأربعون 1 — إنما الأعمال بالنيات", en: "Arba'un 1 — Actions are but by intentions", es: "Arba'un 1 — Las acciones son solo por intenciones", fr: "Arba'un 1 — Les actions ne valent que par les intentions", ur: "اربعون 1 - اعمال صرف نیتوں پر ہوتے ہیں۔" }
text: "إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله، ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها فهجرته إلى ما هاجر إليه"
summary:
  ar: "حديث عمر بن الخطاب في النية، وهو الحديث الأول في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري ⁦(1، 54، 2529، 3898، 5070، 6689، 6953)⁩ ومسلم (1907) من طريق يحيى بن سعيد الأنصاري عن محمد بن إبراهيم التيمي عن علقمة بن وقاص الليثي عن عمر، وهي الطريق الصحيحة الوحيدة له عند أهل الحديث كما حكاه الخطابي، وروى عن يحيى بن سعيد مئتا راوٍ أو أكثر؛ افتتح به البخاري صحيحه، وشرحه ابن رجب في النية والإخلاص وأحكام الهجرة ⁦(جامع العلوم والحكم ص 29–69)⁩."
  en: "Umar ibn al-Khattab's hadith on intention, the first hadith of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (1, 54, 2529, 3898, 5070, 6689, 6953) and Muslim (1907) through Yahya ibn Sa'id al-Ansari from Muhammad ibn Ibrahim al-Taymi from Alqama ibn Waqqas al-Laythi from Umar — the only sound chain according to the hadith scholars as al-Khattabi reports — with over two hundred narrators from Yahya ibn Sa'id; al-Bukhari opened his Sahih with it, and Ibn Rajab comments on intention, sincerity and the rulings of emigration (Jami' al-Ulum wal-Hikam pp. 29–69)."
  es: "El hadiz de Umar ibn al-Khattab sobre la intención, el primer hadiz de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Bukhari (1, 54, 2529, 3898, 5070, 6689, 6953) y Muslim (1907) a través de Yahya ibn Sa'id al-Ansari de Muhammad ibn Ibrahim al-Taymi de Alqama ibn Waqqas al-Laythi de Umar —la única cadena sólida según los eruditos del hadiz como informa al-Khattabi— con más de doscientos narradores de Yahya ibn Sa'id; al-Bukhari abrió su Sahih con él, e Ibn Rajab comenta sobre la intención, la sinceridad y las normas de la emigración (Jami' al-Ulum wal-Hikam pp. 29–69)."
  fr: "Le hadith d'Umar ibn al-Khattab sur l'intention, le premier des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Bukhari (1, 54, 2529, 3898, 5070, 6689, 6953) et Muslim (1907) par Yahya ibn Sa'id al-Ansari, de Muhammad ibn Ibrahim al-Taymi, d'Alqama ibn Waqqas al-Laythi, d'Umar — la seule chaîne authentique selon les spécialistes du hadith, comme le rapporte al-Khattabi — avec plus de deux cents narrateurs remontant à Yahya ibn Sa'id; al-Bukhari a ouvert son Sahih avec ce hadith, et Ibn Rajab commente l'intention, la sincérité et les règles de l'émigration (Jami' al-Ulum wal-Hikam pp. 29–69)."
  ur: "نیت پر عمر بن الخطاب کی حدیث، نووی کی چالیس اور ابن رجب کی تفسیر کی پہلی حدیث؛ البخاری ⁦(1، 54، 2529، 3898، 5070، 6689، 6953)⁩ اور مسلم (1907) کے ذریعے یحییٰ بن سعید الانصاری سے محمد بن ابراہیم التیمی سے علقمہ بن وقاص الثیث کے ذریعہ نقل کیا گیا ہے - جیسا کہ عالم کے مطابق صرف چاثی الثیث کی آواز تھی۔ الخطابی روایت کرتے ہیں - یحییٰ بن سعید سے دو سو سے زیادہ راویوں کے ساتھ؛ البخاری نے اپنی صحیح کو اس سے کھولا ہے، اور ابن رجب نے نیت، اخلاص اور ہجرت کے احکام پر تبصرہ کیا ہے ⁦(جامع العلوم والحکم صفحہ 29-69)⁩۔"
