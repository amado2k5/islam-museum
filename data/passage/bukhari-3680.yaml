label: { ar: "البخاري 3680 — قصر عمر في الجنة وغيرته", en: "Bukhari 3680 — Umar's palace in Paradise and his jealousy" }
text: "بينا أنا نائم رأيتني في الجنة فإذا امرأة تتوضأ إلى جانب قصر، فقلت: لمن هذا القصر؟ فقالوا: لعمر. فذكرت غيرته فوليت مدبراً. فبكى عمر وقال: أعليك أغار يا رسول الله"
summary:
  ar: "في كتاب مناقب الأنصار؛ رواية أبي هريرة في رؤيا النبي قصر عمر في الجنة وإحجامه عن النظر إليه لغيرة عمر المعروفة. من مشهور مناقب عمر في الصحيح."
