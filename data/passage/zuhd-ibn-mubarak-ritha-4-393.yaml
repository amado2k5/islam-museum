text: "… فى المسجد. فأشرف عليهم فقال : اكلفوا من الأعمال أخرجه الامام أحمد، و عند الشيخين فى معناه عن أبى هريرة. راجع الفتح. قال الزهشرى فى نمايا ثلاثة اوجه احدها ان يكون جمع نعى وهو المصدر كصفى وصفايا، وانثانى ان يكون …"
