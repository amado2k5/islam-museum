label: { ar: "سنن ابن ماجه 3779 — الأجران", en: "Sunan Ibn Majah 3779 — the double reward", ur: "سنن ابن ماجہ 3779 — دوہرا اجر", es: "Sunan Ibn Majah 3779: la doble recompensa", fr: "Sunan Ibn Majah 3779 — la double récompense", tr: "Sünen İbni Mace 3779 — İki Ödül", id: "Sunan Ibnu Majah 3779 — Dua Pahala" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا عِيسَى بْنُ يُونُسَ، حَدَّثَنَا سَعِيدُ بْنُ أَبِي عَرُوبَةَ، عَنْ قَتَادَةَ، عَنْ زُرَارَةَ بْنِ أَوْفَى، عَنْ سَعْدِ بْنِ هِشَامٍ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ ـ \" الْمَاهِرُ بِالْقُرْآنِ مَعَ السَّفَرَةِ الْكِرَامِ الْبَرَرَةِ وَالَّذِي يَقْرَؤُهُ يَتَتَعْتَعُ فِيهِ وَهُوَ عَلَيْهِ شَاقٌّ لَهُ أَجْرَانِ اثْنَانِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3779، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3779 (Etiquette), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3779، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3779 (Etiqueta), habla de la doble recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3779 (Étiquette), évoque la double récompense. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 3779 numaralı hadis, iki tür mükafattan bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3779, menyebutkan dua pahala. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
