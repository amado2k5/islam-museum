label: { ar: "سنن ابن ماجه 57 — شعب الإيمان، الإيمان بضع وسبعون شعبة", en: "Sunan Ibn Majah 57 — the branches of faith; faith as seventy-odd branches", ur: "سنن ابن ماجہ 57 — ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں", es: "Sunan Ibn Majah 57 — Las ramas de la fe; la fe como setenta y tantos ramas", fr: "Sunan Ibn Majah 57 — les branches de la foi; la foi comme soixante-dix branches environ" }
text: "… دِينَارٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" الإِيمَانُ بِضْعٌ وَسِتُّونَ أَوْ سَبْعُونَ بَابًا أَدْنَاهَا إِمَاطَةُ الأَذَى عَنِ الطَّرِيقِ وَأَرْفَعُهَا قَوْلُ لاَ إِلَهَ إِلاَّ اللَّهُ وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ \". حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو خَالِدٍ الأَحْمَرُ، عَنِ ابْنِ عَجْلاَنَ، ح وَحَدَّثَنَا عَمْرُو بْنُ رَافِعٍ، حَدَّثَنَا جَرِيرٌ، …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 57، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 57 (The Book of the Sunnah), that mentions the branches of faith, faith as seventy-odd branches. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 57، جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 57 (El Libro de la Sunnah), menciona las ramas de la fe, que constan de setenta y tantas ramas. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 57 (Le Livre de la Sunna), mentionne les soixante-dix branches de la foi. Le moteur de recherche « Piliers et Branches de la Foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
