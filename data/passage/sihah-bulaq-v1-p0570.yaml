text: |-
  الفبعل وبه سمى الرجل مصعبا وصعب الامر صعوبة صارصعبا وأصعبت الامر وجدته معبا
  وأصعبت الجل فهو مصعب اذاتركته فلم تركبه ولم يمسه حبل حتى صار صعبا واستصعب
  عليه الامرأى صعب والمصعبان مصعب بن الز بيروا بنه عيسى بن مصعب وكان ذوالة رفين
  المنذرين ماء السماء يلقب بالصعب قال إبيد
  والصعب ذوالقرنين أصبح ثاويا * بالحنوفى جدث أميم مقيم
  صعذب الصعنب الصغير الرأس ومعنب الئريدة اذارفع وسطها وقوّرر أسها
  ⁦( صقب )⁩ مقبت داره بالكسر أى قربت وفى الحديث الجار أحق بصقبه وتقول أصقبه
  نصقب أى قربه فقرب والصقب العمود الذى يصكون فى وسط الخباء وهو الاطول
  والج-ع صقوب والصقب أيضا الضرب على شى مصمت يابس والصقب الطويل من كل شى
  مع زارة والصاقب اسم جبل عقب) الصعقب الطويل لب ) ابو عمر والصلب
  والصليب الشديدوكذلك الصلب بتشديد اللام وقد صلب الشئ صلابة وصلبته أنا ومنه
  قول الشاءر الاعشى يصف ناقبه
  من سراة الهجان صلبها العض * ورعى الحى وطول الحبال * صلبها أى شدها
  وتقول أيضاصلب الرطب اذا بلغ اليبس فهو مصلب بكسر اللام فاذاصب عليه الديس ليلين
  فهو مصة روالصلبية حجارة المسن تقول سنان صلبى ومصلب أيضا أى مسنون والصلب من
  الظهر وكل شي من الظهر فيه فقار فذلك الصلب والصلب من الارض المكان الغليظ
  المقاد والجمع الصلبة مثل قلب وقلبة والصلب أيضاموضع بالصمان والصلب الجسب
  قال عدى بن زيد اجل ان اللّٰه قد فضلكم فوق ما أحكى بصلب وازار
  قال أبو عمر والصلب الحسب والازار العفاف والصلب بالتحريك لغسة فى الصلب من الظهر
  قال العجاج يصف امرأة
  ريا العظام فحمه المخدم • فى صلب مثل العنان المؤدم
  والصلب أيضا ماصب من الارض والصليب ودل العظام قال الهذلى وذكرعقاي!
  جريمه ناهض فى رأس نيق * ترى لعظام ماجعت صليبا
  والاصطلاب استخراج الودك من العظام ليوتدم به وقال الكميت
  واحتل برك الشتا منزله * وبات شيخ العيال بصطلب
  وصلبه صلبا وصلبه أيضاشدد للتكثير قال تعالى ولا لبنكم فى جذوع النخل والصليب
  للنصارى والجم-ع صلب وصلبان وتوب مصلب عليه نقس كالصليب والعرب تسمى الاغجم
  الاربعة التى خلف النسر الواقع صليبا والصالب الجارة من الحى خلاف النافض تقول
  صلبت عليه حاه تصلب بالكسر أى دامت واشتدت فهوم صلوب عليه ⁦(صلهب)⁩.
  الاموى"الصلهبى مبن الابل الشديد والياء للاسلحاق والاتى صلهياة ⁦(صنب)⁩ الصشاب
  صباغ يتخسذ من الخردل والربيب قال جرير
  تسكلفى معيشة آل زيد • ومن لى بالصلائق والصناب
  والصنابي هو الكميت أ والاشة واذاخالط شقرته شعرة بيضاء ينسب الى الصناب ⁦(صوب)⁩
