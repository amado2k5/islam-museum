label: { ar: "الموطأ 1512 — أنس بن مالك: للبكر سبع، وللثيب ثلاث، وذلك الأمر عندنا", en: "Muwatta 1512", es: "Muwatta 1512", fr: "Muwatta 1512", ur: "موطا 1512", tr: "El-Muvatta 1512 — Enes bin Malik: Bakirenin yedi [yas günü] vardır, daha önce evlenmiş kadının ise üç [yas günü] vardır ve bu bizim aramızdaki uygulamadır." }
text: "لِلْبِكْرِ سَبْعٌ، وَلِلثَّيِّبِ ثَلاثٌ"
summary:
  ar: "يروي مالك عن حميد الطويل عن أنس بن مالك أنه كان يقول للبكر سبع، وللثيب ثلاث. قال مالك وذلك الأمر عندنا. ويذكر المحقق أن الحديث مرفوع في الصحيحين من طريق أبي قلابة عن أنس. {cite:muwatta-maruf-1997 p.35}"
  id: "Malik meriwayatkan dari Humaid al-Tawil, dari Anas ibn Malik, bahwa beliau biasa berkata: \"Untuk seorang perawan, tujuh [hari], dan untuk wanita yang telah menikah sebelumnya, tiga hari.\" Malik berkata: \"Dan itulah kebiasaan di kalangan kami.\" Peneliti menyebutkan bahwa hadits ini dinisbahkan kepada Nabi (shalawat dan salam kepadanya) dalam dua kitab Sahih (Bukhari dan Muslim) melalui sanad Abu Qilabah dari Anas. {cite:muwatta-maruf-1997 p.35}"
