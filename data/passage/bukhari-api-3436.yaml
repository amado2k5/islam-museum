label: { ar: "صحيح البخاري 3436 — قصة جريج ودعوة أمه", en: "Sahih al-Bukhari 3436 — The story of Jurayj and his mother's prayer", ur: "صحیح بخاری 3436 — جریج اور اس کی ماں کی دعا کا قصہ" }
text: "حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ لَمْ يَتَكَلَّمْ فِي الْمَهْدِ إِلاَّ ثَلاَثَةٌ عِيسَى، وَكَانَ فِي بَنِي إِسْرَائِيلَ رَجُلٌ يُقَالُ لَهُ جُرَيْجٌ، كَانَ يُصَلِّي، فَجَاءَتْهُ أُمُّهُ فَدَعَتْهُ، فَقَالَ أُجِيبُهَا أَوْ أُصَلِّي‏.‏ فَقَالَتِ اللَّهُمَّ لاَ تُمِتْهُ حَتَّى تُرِيَهُ وُجُوهَ الْمُومِسَاتِ‏.‏ وَكَانَ جُرَيْجٌ فِي صَوْمَعَتِهِ، فَتَعَرَّضَتْ لَهُ امْرَأَةٌ وَكَلَّمَتْهُ فَأَبَى، فَأَتَتْ رَاعِيًا، فَأَمْكَنَتْهُ مِنْ نَفْسِهَا فَوَلَدَتْ غُلاَمًا، فَقَالَتْ مِنْ جُرَيْجٍ‏.‏ فَأَتَوْهُ فَكَسَرُوا صَوْمَعَتَهُ، وَأَنْزَلُوهُ وَسَبُّوهُ، فَتَوَضَّأَ وَصَلَّى ثُمَّ أَتَى الْغُلاَمَ فَقَالَ مَنْ أَبُوكَ يَا غُلاَمُ قَالَ الرَّاعِي‏.‏ قَالُوا نَبْنِي صَوْمَعَتَكَ مِنْ ذَهَبٍ‏.‏ قَالَ لاَ إِلاَّ مِنْ طِينٍ‏.‏ وَكَانَتِ امْرَأَةٌ تُرْضِعُ ابْنًا لَهَا مِنْ بَنِي إِسْرَائِيلَ، فَمَرَّ بِهَا رَجُلٌ رَاكِبٌ ذُو شَارَةٍ، فَقَالَتِ اللَّهُمَّ اجْعَلِ ابْنِي مِثْلَهُ‏.‏ فَتَرَكَ ثَدْيَهَا، وَأَقْبَلَ عَلَى الرَّاكِبِ فَقَالَ اللَّهُمَّ لاَ تَجْعَلْنِي مِثْلَهُ‏.‏ ثُمَّ أَقْبَلَ عَلَى ثَدْيِهَا يَمَصُّهُ ـ قَالَ أَبُو هُرَيْرَةَ كَأَنِّي أَنْظُرُ إِلَى النَّبِيِّ صلى الله عليه وسلم يَمَصُّ إِصْبَعَهُ ـ ثُمَّ مُرَّ بِأَمَةٍ فَقَالَتِ اللَّهُمَّ لاَ تَجْعَلِ ابْنِي مِثْلَ هَذِهِ‏.‏ فَتَرَكَ ثَدْيَهَا فَقَالَ اللَّهُمَّ اجْعَلْنِي مِثْلَهَا‏.‏ فَقَالَتْ لِمَ ذَاكَ فَقَالَ الرَّاكِبُ جَبَّارٌ مِنَ الْجَبَابِرَةِ، وَهَذِهِ الأَمَةُ يَقُولُونَ سَرَقْتِ زَنَيْتِ‏.‏ وَلَمْ تَفْعَلْ ‏\"‏‏.‏"
summary:
  ar: "قصة العابد جريج الذي انشغل بصلاته عن إجابة أمه فدعت عليه، وفيه إثبات براءته على يدي طفل رضيع تكلم في المهد."
  en: "The story of the devotee Jurayj, whose prayer to God kept him from answering his mother, who then prayed against him — and his innocence was proven by a suckling infant who spoke in the cradle."
  ur: "عبادت گھر کے عابد جریج کا قصہ جس نے اپنی ماں کی آواز نہیں سنی، ماں نے بددعا کی — اور ایک دودھ پینے والے بچے نے گود میں بول کر اس کی براءت ثابت کی۔"
