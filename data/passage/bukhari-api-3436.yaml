text: "… نَفْسِهَا فَوَلَدَتْ غُلاَمًا، فَقَالَتْ مِنْ جُرَيْجٍ. فَأَتَوْهُ فَكَسَرُوا صَوْمَعَتَهُ، وَأَنْزَلُوهُ وَسَبُّوهُ، فَتَوَضَّأَ وَصَلَّى ثُمَّ أَتَى الْغُلاَمَ فَقَالَ مَنْ أَبُوكَ يَا غُلاَمُ قَالَ الرَّاعِي. قَالُوا نَبْنِي صَوْمَعَتَكَ مِنْ ذَهَبٍ. قَالَ لاَ إِلاَّ مِنْ طِينٍ. وَكَانَتِ امْرَأَةٌ تُرْضِعُ ابْنًا لَهَا مِنْ بَنِي إِسْرَائِيلَ، فَمَرَّ بِهَا رَجُلٌ رَاكِبٌ ذُو شَارَةٍ، فَقَالَتِ اللَّهُمَّ اجْعَلِ ابْنِي مِثْلَهُ. فَتَرَكَ ثَدْيَهَا، وَأَقْبَلَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3436، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3436 (Prophets), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3436، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
