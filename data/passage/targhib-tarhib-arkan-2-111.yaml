text: "… وسلم يوما عنده الدنيا فقال رسول الله مل عم ألا تسممون ألاتسمعون ان البذاذة من الايمان أن البذاذة من الايمان يعنى التفحل رواء أبوداود وأبن ماجه كلاهما من رواية محمد بن اسحق وقد تكلم أبو عمر النمرى في هذا الجديث …"
summary:
