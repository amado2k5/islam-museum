label: { ar: "صحيح البخاري 2920 — الرخصة", en: "Sahih al-Bukhari 2920 — the concession (rukhsa)", ur: "صحیح بخاری 2920 — رخصت", fr: "Sahih al-Bukhari 2920 — la dispense (rukhsa)", es: "Sahih al-Bujari 2920 — la dispensa (rukhsa)", tr: "Sahih el-Buhari 2920 — Lisans", id: "Sahih al-Bukhari 2920 — Lisensi" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا هَمَّامٌ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ، حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا هَمَّامٌ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ ـ أَنَّ عَبْدَ، الرَّحْمَنِ بْنَ عَوْفٍ وَالزُّبَيْرَ شَكَوَا إِلَى النَّبِيِّ ـ يَعْنِي الْقَمْلَ ـ فَأَرْخَصَ لَهُمَا فِي الْحَرِيرِ، فَرَأَيْتُهُ عَلَيْهِمَا فِي غَزَاةٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2920، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 2920 (Fighting for the Cause of Allah (Jihaad)), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 2920، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2920, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 2920, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 2920 numaralı hadiste bir istisnadan bahsedilir. Farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle birlikte derleyen bu hadis, metnin içeriğini tanımlar ancak buna dayanarak bir fetva vermez."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2920, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
