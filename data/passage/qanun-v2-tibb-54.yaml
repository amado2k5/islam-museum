text: "… المعدة وبمشاركتها، فينتفع بالقيء. والصداع الذي يكون في مؤخر الرأس، فإنه إن لم يكن حمّى كان علاجه بالاستفراغ بالمطبوخ، أوّلاً بقدر القوة، ثم الفصد. ومن وجد صداعاً ينتقل في رأسه ويسكّنه البرد، فلعل الفصد لا بدّ منه، أو الحجامة لئلا …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 54، يذكر الحجامة، والحمى، وأسماء الأمراض، والعلاج، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 54, that mentions cupping, fever, named diseases, treatment, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 54 کا اقتباس جس میں حجامہ، بخار، بیماریوں کے نام، علاج، اعضائے بدن، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 54, que menciona la ventosaterapia, la fiebre, enfermedades específicas, tratamientos, los órganos del cuerpo, cirugía, circuncisión y férulas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 54, qui mentionne la ventousothérapie, la fièvre, les maladies nommées, le traitement, les organes du corps, la chirurgie, la circoncision et les attelles; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 54. sayfasından bir bölüm; hacamat, ateş, hastalık isimleri, tedavi, vücut parçaları, ameliyat, sünnet ve atellerden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 54, yang menyebutkan bekam, demam, nama-nama penyakit, pengobatan, bagian tubuh, pembedahan, sunat, dan bidai; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
