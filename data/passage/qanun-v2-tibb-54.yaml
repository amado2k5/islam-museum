text: "… المعدة وبمشاركتها، فينتفع بالقيء. والصداع الذي يكون في مؤخر الرأس، فإنه إن لم يكن حمّى كان علاجه بالاستفراغ بالمطبوخ، أوّلاً بقدر القوة، ثم الفصد. ومن وجد صداعاً ينتقل في رأسه ويسكّنه البرد، فلعل الفصد لا بدّ منه، أو الحجامة لئلا …"
