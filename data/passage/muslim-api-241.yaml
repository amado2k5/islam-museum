label: { ar: "صحيح مسلم 241 — بر الوالدين أو عقوقهما", en: "Sahih Muslim 241 — dutifulness to the parents or disobedience to them", ur: "صحیح مسلم 241 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih Muslim 241 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sahih Muslim 241 — le respect des parents ou la désobéissance envers eux", tr: "Sahih Muslim 241 — Anne babaya iyilik mi, itaatsizlik mi?", id: "Sahih Muslim 241 — Kebaikan atau ketidaktaatan kepada orang tua" }
text: "… يَا رَسُولَ اللَّهِ أَكْثَرَ أَهْلِ النَّارِ. قَالَ \" تُكْثِرْنَ اللَّعْنَ وَتَكْفُرْنَ الْعَشِيرَ وَمَا رَأَيْتُ مِنْ نَاقِصَاتِ عَقْلٍ وَدِينٍ أَغْلَبَ لِذِي لُبٍّ مِنْكُنَّ \". قَالَتْ يَا رَسُولَ اللَّهِ وَمَا نُقْصَانُ الْعَقْلِ وَالدِّينِ قَالَ \" أَمَّا نُقْصَانُ الْعَقْلِ فَشَهَادَةُ امْرَأَتَيْنِ تَعْدِلُ شَهَادَةَ رَجُلٍ فَهَذَا نُقْصَانُ الْعَقْلِ وَتَمْكُثُ اللَّيَالِيَ مَا تُصَلِّي وَتُفْطِرُ فِي رَمَضَانَ فَهَذَا نُقْصَانُ الدِّينِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 241، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 241 (The Book of Faith), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 241، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 241 (El Libro de la Fe), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 241 (Le Livre de la Foi), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih Müslim'de 241 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. Bu hadis, \"İslam'da Anne Babalık\" tarayıcısı tarafından Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 241, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Hadits ini dikumpulkan oleh peramban \"Parenthood in Islam\" bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
