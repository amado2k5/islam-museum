label: { ar: "الموطأ 341 — صلاة الجماعة تفضل صلاة الفذ بسبع وعشرين درجة", en: "Muwatta 341", es: "Muwatta 341", fr: "Muwatta 341", ur: "موطا 341", tr: "Al-Muwatta 341 — Cemaatle kılınan namaz, tek başına kılınan namazdan yirmi yedi kat daha faziletlidir.", id: "Al-Muwatta 341 — Shalat berjamaah lebih utama dua puluh tujuh kali lipat daripada shalat sendirian." }
text: "صلاة الجماعة تفضل صلاة الفذ بسبع وعشرين درجة"
summary:
  ar: "أول حديث في باب فضل صلاة الجماعة على صلاة الفذ. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر: أخبر النبي أن صلاة الجماعة تفضل صلاة المنفرد بسبع وعشرين درجة. ويخرّجه المحقق عند البخاري (645) ومسلم (2/122–123) والنسائي (2/103) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (14/137). {cite:muwatta-maruf-1997 p.188}"
  tr: "Cemaat namazının tek başına namaza üstünlüğü bölümündeki ilk hadis. Yahya'nın Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiği hadis şöyledir: Peygamberimiz bize cemaat namazının tek başına namazdan yirmi yedi kat daha faziletli olduğunu bildirmiştir. Bu hadis, Buhari (645), Müslim (2/122-123), Nesai (2/103), İbn Hibban, Ahmed ve Şafiî'nin hadis külliyatlarında, Malik'in takipçilerinin rivayet zincirleriyle bulunmakta ve Temhid'de (14/137) de zikredilmektedir. {cite:muwatta-maruf-1997 s.188}"
  id: "Hadits pertama dalam bab ini membahas keutamaan shalat berjamaah atas shalat perorangan. Diriwayatkan oleh Yahya dari Malik, dari Nafi’, dari Abdullah ibn Umar: Nabi memberitahukan kepada kita bahwa shalat berjamaah lebih utama dua puluh tujuh kali lipat daripada shalat perorangan. Hadits ini terdapat dalam kumpulan hadits al-Bukhari (645), Muslim (2/122–123), al-Nasa’i (2/103), Ibn Hibban, Ahmad, dan al-Shafi’i, melalui sanad pengikut Malik, dan dirujuk dalam al-Tamhid (14/137). {cite:muwatta-maruf-1997 p.188}"
