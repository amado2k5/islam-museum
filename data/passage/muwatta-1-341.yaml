text: "صلاة الجماعة تفضل صلاة الفذ بسبع وعشرين درجة"
summary:
  ar: "أول حديث في باب فضل صلاة الجماعة على صلاة الفذ. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر: أخبر النبي أن صلاة الجماعة تفضل صلاة المنفرد بسبع وعشرين درجة. ويخرّجه المحقق عند البخاري (645) ومسلم (2/122–123) والنسائي (2/103) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (14/137). {cite:muwatta-maruf-1997 p.188}"
