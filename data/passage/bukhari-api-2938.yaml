text: "أَنَسًا ـ رضى الله عنه ـ يَقُولُ لَمَّا أَرَادَ النَّبِيُّ صلى الله عليه وسلم أَنْ يَكْتُبَ إِلَى الرُّومِ، قِيلَ لَهُ إِنَّهُمْ لاَ يَقْرَءُونَ كِتَابًا إِلاَّ أَنْ يَكُونَ مَخْتُومًا‏.‏ فَاتَّخَذَ خَاتَمًا مِنْ فِضَّةٍ، فَكَأَنِّي أَنْظُرُ إِلَى بَيَاضِهِ فِي يَدِهِ، وَنَقَشَ فِيهِ مُحَمَّدٌ رَسُولُ اللَّهِ‏.‏"
summary:
  ar: "في صحيح البخاري؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sahih al-Bukhari; sending a letter or message to a party."
  ur: "صحیح بخاری میں؛ کسی فریق کو خط یا پیغام بھیجنا."
