label:
  ar: "مسلم 2758c — أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب"
  en: "Muslim 2758c — My servant sinned and knew he has a Lord who forgives sin"
  ur: "مسلم 2758c — میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے"
  es: "Musulmán 2758c — Mi siervo pecó y sabía que tiene un Señor que perdona el pecado."
  fr: "Muslim 2758c — Mon serviteur a péché et savait qu'il a un Seigneur qui pardonne les péchés"
  tr: "Müslim 2758c — Kulum bir günah işledi; oysa o, günahları bağışlayan bir Rabbi olduğunu biliyordu."
  id: "Muslim 2758c — Hamba-Ku telah berbuat dosa, padahal ia tahu bahwa ia mempunyai Tuhan yang Maha Pengampun dosa."
text: "إن عبدا أذنب ذنبا . بمعنى حديث حماد بن سلمة . وذكر ثلاث مرات أذنب ذنبا . وفي الثالثة قد غفرت لعبدي فليعمل ما شاء ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2758c: أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2758c: My servant sinned and knew he has a Lord who forgives sin. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2758c: میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2758c: Mi siervo pecó y supo que tiene un Señor que perdona los pecados. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2758c: Mon serviteur a péché, sachant qu’il a un Seigneur qui pardonne les péchés. Le Prophète le relate d’après son Seigneur; le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2758c: Seorang hamba-Ku berbuat dosa dan kemudian menyadari bahwa ia mempunyai Tuhan yang Maha Pengampun dosa. Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
