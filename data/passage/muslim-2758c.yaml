label:
  ar: "مسلم 2758c — أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب"
  en: "Muslim 2758c — My servant sinned and knew he has a Lord who forgives sin"
  ur: "مسلم 2758c — میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے"
text: "إن عبدا أذنب ذنبا . بمعنى حديث حماد بن سلمة . وذكر ثلاث مرات أذنب ذنبا . وفي الثالثة قد غفرت لعبدي فليعمل ما شاء ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2758c: أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2758c: My servant sinned and knew he has a Lord who forgives sin. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2758c: میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
