text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" مَا مِنْ نَبِيٍّ يَمُوتُ حَتَّى يُخَيَّرَ \". قَالَتْ فَسَمِعْتُهُ يَقُولُ \" اللَّهُمَّ الرَّفِيقَ الأَعْلَى \". فَعَرَفْتُ أَنَّهُ ذَاهِبٌ."
summary:
  ar: "حديث في موطأ مالك، رقم 566، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 566 (Burials), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "موطأ مالک کی حدیث نمبر 566، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
