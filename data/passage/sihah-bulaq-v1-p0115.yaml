text: |-
  القيقا وعاء زهر النضل اه
  وانة ولى بالمعنى وهو الطلع
  ويقال له الكفرّى قاله نصر
  ٥٢٦
  ⁦(إب الضاد)⁩
  بهارفض من كل خرجاء صعلة * وأخرج يمشى مقل مشى الخيل
  ويقال أيضافى القرية رفض من ماءأى قليل ورفاض الشئ بالضم ماقحطم منه وتفرّق
  ورفوض الناس فرقهم ورفوض الارض ماترك بعدان كانحى وفى أرض كذارفوض
  من كار أذا كان متفرقابعيد ابعضه من بعض ويقال رجل قبضة رفضة للذى بقسك بالشئ
  ثم لا يلبت أن يدعه وقال ابن السكيت يقال راع قبضة رفضة للذى يقبض الابل ويجمعها
  فاذا صارت الى الموضع الذى تحبه وتهواء رفضهاوتركها ترعى حسث شاءت ويقال رنض
  النحل وذلك اذا انتشر عدقه وسمقط ققاؤه ور فضت فى القربة ترفيضا أى أبقيت فيها رفض
  من ماء وارفضاض الدمع زششه وكل متفرق ذاهب مرفض قال القطامى
  أخوك الذى لا تلك الجم نفسه • وترفض عند الحفظات السكتائف
  يقول هو الذى اذارآل مغلومارق لك وذهب حقده ومر انض الوادى.فاجر حيث برفض
  اليه السيل وأماقول الراجز
  كالعيس فوق الشرك الرفاض( ١ هى الطرق المتفرقة
  والرفاضة القوم يرعون رفوض الارض ⁦(ركض)⁩ الركض نحرين الرجسل ومنه قوله
  تعالى اركض برجلك ور كضت الفرس برجلى اذا استحثته ليعدو ثم كثرحق قيل ركض
  الفرس اذاعداوليس بالاصل والصواب ركض الفرس على مالم يسم ت فاعلد فهومى كوض
  وفى حديث الاستحاضة هى ركضة من الشيطان يريد الدفعة وأركضت الفرس اذا عظم
  ولدها فى بطنها وتحترك وارتسكض المهرفى بطن أمه وارتكض فلان فى أمره اضطرب وربا
  قالوار كي الطائراذا حرك جناحيه فى الطيران قال الرابز
  أرَّقنى طارقهم أرّقا • وركض غربان غدون نعقا
  وركضه البعيراذا ضريه برجله ولا يقال رمحه عن يعة وب وراكضت فلانا اذا أعدى كل واحد
  منكافرسه وتراكضوا اليه خيلهم ومر كضة القوس معروفة وهمامر كضتان وقوس
  ركوض أى سريعة السهم وهى تكض الماءموضع مجمه مض) الرمض شدّة وقع
  الشمس على الرول وغيره والارض رمضاء كماترى وقدرمض يومنا بالسكسر يرمض رمضا
  اشتتحره وأرض رمضة الحجارة ورمضت قدمه أيضا من الرمضا أى احترقت وفى الحديث
  ملاة الاوابين اذارمضت الفصال من الذهى أى اذا وجد الفصيل حرّ الشمس من الرمضاء
  يقول فصلاة الضحى تلك الساعة ويقال أيضار مضت الغنم اذارعت فى شدّة الحرفة وحت
  أكبادها وحبنت رئاتها وأرمضتنى الرمضاء أحرقتنى ومنعقبل أرمضه الامر والترمض
  صيد الظبي فى وقت الهاجرة تتبعه حتى اذا تفسذت قوائمه من شدة الرمضا أخذته وبقال
  أتيت فلا نا علم أصبه فرتضته ترميضا أى انتظرته شيئا ورمضت الشاة أرمضها رمضااذا
  شققتها وعليها جلدها وطرحتها على الرضفة وجعلت فوقها الملة لتنضج وذلك الموضع هرمض
  واللعم مر موض وشفرة رميض ونصل رميض أى وقيع وكل حادّ رميض ورمضته آنا أرمضه
  وأرمضه اذا جهلته بين حجرين أملسين ثم دققته ليرق عن ابن السكيت وارقض الرجل من
  كذا أى اشتدعله وأقله وارتمضت كبده فسدت وارتضت لفلان حزنت له وشهررمضان
  جمع على رمضانات وأرمضاء يقال امسم لمانقلوا أسماء الشهورعن اللغة الق_ديمة سهوها
  بالازمفة
