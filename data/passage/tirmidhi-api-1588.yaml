text: "حَدَّثَنَا الْحُسَيْنُ بْنُ أَبِي كَبْشَةَ الْبَصْرِيُّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، عَنْ مَالِكٍ، عَنِ الزُّهْرِيِّ، عَنِ السَّائِبِ بْنِ يَزِيدَ، قَالَ أَخَذَ رَسُولُ اللَّهِ الْجِزْيَةَ مِنْ مَجُوسِ الْبَحْرَيْنِ وَأَخَذَهَا عُمَرُ مِنْ فَارِسَ وَأَخَذَهَا عُثْمَانُ مِنَ الْفُرْسِ. وَسَأَلْتُ مُحَمَّدًا عَنْ هَذَا فَقَالَ هُوَ مَالِكٌ عَنِ الزُّهْرِيِّ عَنِ النَّبِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1588، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1588 (The Book on Military Expeditions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 1588، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1588 (El Libro de las Expediciones Militares), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1588 (Livre des expéditions militaires), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
