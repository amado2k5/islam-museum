text: "… ماذا يعنيك أنت؟ أتاهُ رجل في السوق، وقال له: أبشّرُك بمولود ذكر. قال: إذا وُلِدَ لي مولودٌ ذكر، فإني أحمدُ اللّه، ولكنْ ماذا يعنيك أنت؟ لم يرضَ الحمار جاءَهُ رجلٌ يطلُبُ إليهِ إعارتَهُ حمارَهُ فقال : إنِّي ذاهب لِلْحمارِ أستشيرُه …"
summary:
  ar: "قيل لجحا إنه وُلد له ابن، فحمد الله ثم سأل الرجل ماذا يعنيه هو من الأمر. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  en: "Told that a son has been born to him, Juha thanks God but asks the other man what business it is of his. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  ur: "جحا کو بتایا گیا کہ اس کے ہاں بیٹا پیدا ہوا ہے، تو اس نے اللہ کا شکر ادا کیا مگر اس دوسرے آدمی سے پوچھا کہ اس میں تمہارا کیا لینا دینا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  fr: "Quand on lui annonce qu'un fils lui est né, Juha remercie Dieu mais demande à l'autre homme en quoi cela le regarde. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  es: "Al decirle que le ha nacido un hijo, Juha da gracias a Dios pero le pregunta al otro hombre qué le importa a él. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
  tr: "Juha'ya kendisine bir oğul doğduğu söylendi, bunun üzerine Tanrı'ya şükretti ve sonra adama bunun kendisi için ne anlama geldiğini sordu. {cite:juha-nawadir-kubra-djuwaydi s. 23}"
  id: "Juha diberitahu bahwa ia telah dikaruniai seorang putra, lalu ia memuji Tuhan dan kemudian bertanya kepada pria itu apa arti hal ini baginya. {cite:juha-nawadir-kubra-djuwaydi p. 23}"
