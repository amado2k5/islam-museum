label: { ar: "صحيح البخاري 5290 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 5290 — what was made lawful; what is not lawful", ur: "صحیح بخاری 5290 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 5290 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih al-Bukhari 5290 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا اللَّيْثُ، عَنْ نَافِعٍ، أَنَّ ابْنَ عُمَرَ،ما كَانَ يَقُولُ فِي الإِيلاَءِ الَّذِي سَمَّى اللَّهُ لاَ يَحِلُّ لأَحَدٍ بَعْدَ الأَجَلِ إِلاَّ أَنْ يُمْسِكَ بِالْمَعْرُوفِ، أَوْ يَعْزِمَ بِالطَّلاَقِ، كَمَا أَمَرَ اللَّهُ عَزَّ وَجَلَّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5290، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5290 (Divorce), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5290، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5290 (Divorcio), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5290 (Divorce), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
