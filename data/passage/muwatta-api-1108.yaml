label: { ar: "موطأ مالك 1108 — ما أُحل، ما لا يحل", en: "Muwatta Malik 1108 — what was made lawful; what is not lawful", ur: "موطأ مالک 1108 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… الزَّبِيرِ، أَنَّ رِفَاعَةَ بْنَ سِمْوَالٍ، طَلَّقَ امْرَأَتَهُ تَمِيمَةَ بِنْتَ وَهْبٍ فِي عَهْدِ رَسُولِ اللَّهِ ثَلاَثًا فَنَكَحَتْ عَبْدَ الرَّحْمَنِ بْنَ الزَّبِيرِ فَاعْتَرَضَ عَنْهَا فَلَمْ يَسْتَطِعْ أَنْ يَمَسَّهَا فَفَارَقَهَا فَأَرَادَ رِفَاعَةُ أَنْ يَنْكِحَهَا - وَهُوَ زَوْجُهَا الأَوَّلُ الَّذِي كَانَ طَلَّقَهَا - فَذَكَرَ ذَلِكَ لِرَسُولِ اللَّهِ فَنَهَاهُ عَنْ تَزْوِيجِهَا وَقَالَ \" لاَ تَحِلُّ لَكَ حَتَّى تَذُوقَ الْعُسَيْلَةَ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 1108، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1108 (Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1108، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
