text: "… لهذا التدريج علمت أن المذهب ا لحق هو هذا وتحققت أن كل عبد هو في مجاري أحواله في يومه وليلته لا يخلو من وقائع في عبادته ومعاملاته عن تجدد لوازم عليه فيلزمه السؤال عن كل ما يقع له من النوادر …"
