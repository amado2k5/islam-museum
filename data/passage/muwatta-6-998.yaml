label: { ar: "الموطأ 998 — داود بن الحصين عن أبي غطفان بن طريف: أن أباه طريفاً تزوج امرأة وهو محرم، فرد عمر بن الخطاب نكاحه", en: "Muwatta 998", es: "Muwatta 998", fr: "Muwatta 998", ur: "موطا 998", tr: "El-Muvatta 998 — Davud ibn el-Hüseynin, Ebu Gatfan ibn Tarif'ten rivayet ettiğine göre: Babası Tarif, ihramlı haldeyken bir kadınla evlenmiş, bunun üzerine Ömer ibn el-Hattab onun evliliğini feshetmiştir.", id: "Al-Muwatta 998 — Dawud ibn al-Husayn, berdasarkan riwayat Abu Ghatfan ibn Tarif: bahwa ayahnya, Tarif, menikahi seorang wanita ketika ia sedang dalam keadaan ihram, sehingga Umar ibn al-Khattab membatalkan pernikahannya." }
text: "تزوج امرأة وهو محرم، فرد عمر بن الخطاب نكاحه"
summary:
  ar: "يرويه مالك عن داود بن الحصين أن أبا غطفان بن طريف المري أخبره أن أباه طريفاً تزوج امرأة وهو محرم، فرد عمر بن الخطاب نكاحه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1178) وسويد والشافعي عند البيهقي ومحمد بن الحسن الشيباني (438). {cite:muwatta-maruf-1997 p.469}"
  tr: "Malik, Davud ibn el-Hüseynin'den rivayet ettiğine göre, Ebu Gatfan ibn Tarif el-Murri'nin kendisine babası Tarif'in ihramlı (dini kutsama halinde) iken bir kadınla evlendiğini ve Ömer ibn el-Hattab'ın bu evliliği feshettiğini söylediğini aktarmıştır. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1178), Suveyd, el-Şafiî (el-Beyhaki'ye göre) ve Muhammed ibn el-Hasan el-Şeybani (438) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.469}"
  id: "Malik meriwayatkannya dari Dawud ibn al-Husayn, yang mengatakan bahwa Abu Ghatfan ibn Tarif al-Murri memberitahunya bahwa ayahnya, Tarif, menikahi seorang wanita saat dalam keadaan ihram (penyucian ritual), dan Umar ibn al-Khattab membatalkan pernikahan tersebut. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1178), Suwayd, al-Shafi'i (menurut al-Bayhaqi), dan Muhammad ibn al-Hasan al-Shaybani (438). {cite:muwatta-maruf-1997 p.469}"
