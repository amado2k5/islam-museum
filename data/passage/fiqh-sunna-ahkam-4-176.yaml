  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 176, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
