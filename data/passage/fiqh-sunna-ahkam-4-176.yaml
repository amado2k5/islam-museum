text: "… لوجوبه، بأن الصلاة فرضت أولا ركفتهن، وكان التشهد فيها واجباً، فلما زيدت لم تكن الزيادة مُزيلة لذلك الوجوب. استحباب التخفيف فيه : ويستحب التخفيف فيه. فعن ابن مسعود قال : كان النبيّ إذا جلس في الركعتين الأوليين كأنه على الرَّضف …"
