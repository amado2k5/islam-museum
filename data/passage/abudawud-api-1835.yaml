label: { ar: "سنن أبي داود 1835 — الحجامة", en: "Sunan Abi Dawud 1835 — cupping", ur: "سنن ابی داؤد 1835 — حجامہ", es: "Sunan Abi Dawud 1835 - catación", fr: "Sunan Abi Dawud 1835 — ventouses", tr: "Sünen Ebî Davud 1835 — Hacamat", id: "Sunan Abi Dawud 1835 — Bekam" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ عَطَاءٍ، وَطَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ احْتَجَمَ وَهُوَ مُحْرِمٌ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1835، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 1835 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 1835، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1835 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 1835 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne la pratique des ventouses. Le dictionnaire médical The Medicine Browser le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Abi Davud'da yer alan 1835 numaralı hadiste hacamat uygulamasından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1835, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
