text: "… من قريش، فلما رجعوا مروا بالمدينة وعبد اللّٰه مريض فقال: أتخلف عند أخوالي بني عدي بن النجار. فقام عندهم شهراً ومضى أصحابه فقدموا مكة، فأخبروا عبد المطلب، فبعث إليه ولده الحارث فوجده قد توفي ودُفن في دار النابغة - وهو …"
summary:
