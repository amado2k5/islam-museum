label: { ar: "صحيح البخاري 5997 — من لا يرحم لا يرحم", en: "Sahih al-Bukhari 5997 — He who shows no mercy is shown none", ur: "صحیح بخاری 5997 — جو رحم نہیں کرتا اس پر رحم نہیں ہوتا", es: "Sahih al-Bukhari 5997 — Quien no muestra misericordia, no recibe ninguna.", fr: "Sahih al-Bukhari 5997 — Celui qui ne fait preuve d'aucune miséricorde n'en récoltera aucune.", tr: "Sahih el-Buhari 5997 — Merhamet göstermeyen, merhamet görmez.", id: "Sahih al-Bukhari 5997 — Barangsiapa tidak menunjukkan belas kasih, maka ia tidak akan menerima belas kasih." }
text: "حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، حَدَّثَنَا أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ، أَنَّ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَبَّلَ رَسُولُ اللَّهِ صلى الله عليه وسلم الْحَسَنَ بْنَ عَلِيٍّ وَعِنْدَهُ الأَقْرَعُ بْنُ حَابِسٍ التَّمِيمِيُّ جَالِسًا‏.‏ فَقَالَ الأَقْرَعُ إِنَّ لِي عَشَرَةً مِنَ الْوَلَدِ مَا قَبَّلْتُ مِنْهُمْ أَحَدًا‏.‏ فَنَظَرَ إِلَيْهِ رَسُولُ اللَّهِ صلى الله عليه وسلم ثُمَّ قَالَ ‏ \"‏ مَنْ لاَ يَرْحَمُ لاَ يُرْحَمُ ‏\"‏‏.‏"
summary:
  ar: "عن عائشة: جاء أعرابي فقال تقبلون الصبيان فما قبلت من عشرة أولادي أحدا، فقال من لا يرحم لا يرحم."
  en: "From Aisha: a desert Arab boasted he had never kissed any of his ten sons; the Prophet answered — he who shows no mercy is shown none."
  ur: "عائشہ سے: ایک دیہاتی نے فخر کیا کہ اپنے دس بیٹوں میں سے کسی کو چوما نہیں؛ نبی نے فرمایا — جو رحم نہیں کرتا اس پر رحم نہیں ہوتا۔"
  es: "De Aisha: un árabe del desierto se jactó de que nunca había besado a ninguno de sus diez hijos; el Profeta respondió: quien no muestra misericordia, no recibe ninguna."
  fr: "D'après Aïcha: un Arabe du désert se vantait de n'avoir jamais embrassé aucun de ses dix fils; le Prophète répondit: « Celui qui ne fait preuve d'aucune miséricorde n'en récolte aucune. »"
  tr: "Ayşe'nin rivayetine göre: Bir bedevi gelip, \"Çocukları öper misin? Ben on çocuğumdan hiçbirini öpmedim\" dedi. O da, \"Merhamet göstermeyene merhamet gösterilmez\" dedi."
