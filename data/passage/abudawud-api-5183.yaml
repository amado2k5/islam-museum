label: { ar: "سنن أبي داود 5183 — الأب والأبوة", en: "Sunan Abi Dawud 5183 — the father and fatherhood", ur: "سنن ابی داؤد 5183 — باپ اور والدیت", es: "Sunan Abi Dawud 5183 — El padre y la paternidad", fr: "Sunan Abi Dawud 5183 — Le père et la paternité" }
text: "حَدَّثَنَا زَيْدُ بْنُ أَخْزَمَ، حَدَّثَنَا عَبْدُ الْقَاهِرِ بْنُ شُعَيْبٍ، حَدَّثَنَا هِشَامٌ، عَنْ حُمَيْدِ بْنِ هِلاَلٍ، عَنْ أَبِي بُرْدَةَ بْنِ أَبِي مُوسَى، عَنْ أَبِيهِ، بِهَذِهِ الْقِصَّةِ قَالَ فَقَالَ عُمَرُ لأَبِي مُوسَى إِنِّي لَمْ أَتَّهِمْكَ وَلَكِنَّ الْحَدِيثَ عَنْ رَسُولِ اللَّهِ شَدِيدٌ."
summary:
  ar: "حديث في سنن أبي داود، رقم 5183، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5183 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5183، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5183 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 5183 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
