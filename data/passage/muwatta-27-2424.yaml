label: { ar: "الموطأ 2424 — مالك: الدار المغلقة حرز لصاحبها ولساكنيها", en: "Muwatta 2424", es: "Muwatta 2424", fr: "Muwatta 2424", ur: "موطا 2424", tr: "Al-Muwatta 2424 — Malik: Kapalı bir ev, sahibi ve sakinleri için güvenli bir yerdir.", id: "Al-Muwatta 2424 — Malik: Rumah tertutup adalah tempat yang aman bagi pemiliknya dan penghuninya" }
summary:
  ar: "قال يحيى: قال مالك: الأمر عندنا أنه إذا كانت دار رجل مغلقة عليه ليس معه فيها غيره، فإنه لا يجب القطع على من سرق منها شيئا حتى يخرج به من الدار كلها، لأن الدار كلها حرزه. فإن كان معه في الدار ساكن غيره، وكان كل واحد منهم يغلق بابه، وكانت الدار حرزا لهم جميعا، فمن سرق من بيوتهم شيئا يجب فيه القطع فخرج به إلى الدار فقد أخرجه من حرزه إلى غير حرزه، ووجب عليه القطع. {cite:muwatta-maruf-1997 p.401}"
  tr: "Yahya dedi ki: Malik dedi ki: Bizde kural şudur: Bir adamın evi kilitliyse ve o adam evde yalnızsa, bir şey çalan kişi, çaldığı şeyi evin tamamından dışarı çıkarmadıkça eli kesilmez; çünkü evin tamamı onun güvenli yeridir. Fakat evde onunla birlikte başka insanlar yaşıyorsa ve her biri kendi kapısını kilitliyorsa ve ev hepsi için güvenliyse, o zaman kim onların evlerinden el kesilmesini gerektirecek bir şey çalarsa ve onu evin içine çıkarırsa, onu güvenli yerinden çıkarıp güvenli yerinden başka bir yere götürmüş olur ve eli kesilir. {cite:muwatta-maruf-1997 s.401}"
  id: "Yahya berkata: Malik berkata: Aturan di antara kami adalah jika rumah seseorang terkunci dan dia sendirian di dalamnya, maka tangan tidak dipotong bagi seseorang yang mencuri sesuatu dari rumah itu sampai dia membawanya keluar dari seluruh rumah, karena seluruh rumah adalah tempat yang aman baginya. Tetapi jika ada orang lain yang tinggal di rumah bersamanya, dan masing-masing dari mereka mengunci pintunya, dan rumah itu aman bagi mereka semua, maka siapa pun yang mencuri sesuatu dari rumah mereka yang menyebabkan tangannya dipotong, dan membawanya keluar ke dalam rumah, telah membawanya keluar dari tempat yang aman dan ke tempat lain selain tempat yang aman, dan tangannya dipotong. {cite:muwatta-maruf-1997 p.401}"
