label: { ar: "الموطأ 2424 — مالك: الدار المغلقة حرز لصاحبها ولساكنيها", en: "Muwatta 2424" }
summary:
  ar: "قال يحيى: قال مالك: الأمر عندنا أنه إذا كانت دار رجل مغلقة عليه ليس معه فيها غيره، فإنه لا يجب القطع على من سرق منها شيئا حتى يخرج به من الدار كلها، لأن الدار كلها حرزه. فإن كان معه في الدار ساكن غيره، وكان كل واحد منهم يغلق بابه، وكانت الدار حرزا لهم جميعا، فمن سرق من بيوتهم شيئا يجب فيه القطع فخرج به إلى الدار فقد أخرجه من حرزه إلى غير حرزه، ووجب عليه القطع. {cite:muwatta-maruf-1997 p.401}"
