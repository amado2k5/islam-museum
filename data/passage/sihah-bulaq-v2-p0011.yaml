text: |-
  ٠٧٦
  -⁦(لا)⁩.
  ظروف الزمان التى لا قتمكن تقول لقيته ذات يوم وذات ليلة وذات غداة وذات العشاءوذات
  مرقوذات الزمين وذات العويم وذاصباح وذامساء وذاصبوح وذاغبوق فهذه الاربعة بغير
  هاء وانما مع فى هذه الاوقات ولم يقولواذات شهر ولاذات سنة قال الاختش فى قوله تعالى
  وأصلى واذات بينكم انما أننواذات لان بعض الاشياه قد يوضع له اسم مؤنت ولبعضها اسم
  مذكركا قالواداروحا ئط أنفوا الداروذكروا الخائط وقواهم كان ذيت وذيت مثل كيت
  وكيت أصك ذيو على فعل ساكفة العين فحذفت الواوفبق عسلى حرفين فشددكما شددكى اذا
  جعلته اسماثم عوض من التشديد التاءفان -ذفت الناء وجنت بالهاء فلابد من أن ترد
  التشديد تقول كان ذيت وذيه وان نسبت اليه قلت ذيوى كما تقول بنوى فى النسبة الى
  البنت قأ الفاءمن حروف العطف وامائلاثمواضع يعطف بهاوتدل على الترتيب
  والتعقيب مع الاشر التقول ضريت زيد افعهرا والموضع الثانى أن يكون ماقبلها ءلة لما
  عدها وتجرى على العطف والتعقيب دون الاشراك كولك ذريه فبكى وضربه فأوجعه
  اذا كان الضرب علة للبكا والوجع والموضع الثالث «والذى يكون ة(بتداء وذلك فى جواب
  الشرط كفولك ان تزرنى فأنت محسن يكون ما بعد الفاء كلا ما مستأ نفا يعمل بعضه فى بعض
  لان قولك أنت ابتداء ومحن خبره وقد صارت الجملة جوا يابالفاء وكذلك القول اذا
  جئت بهابعد الامر والنهى والاستفهام والتق والتمى والعرض الا أنك تنصب ما بعد الفا.
  فى هذه الاشياء الستة بانمار أن تقول زرف فأحسن اليسك لم تجعل الزيارة علة للاحسان
  واكنك قات ذاك من شأنى أيدا أن أفعل وأن أحسن اليك على كل سال ( كذا
  كذا اسم مبهم تقول فعات كذا وقد يج رى مجرى كم فتنصب مابعده على التمييرتول عن_دى
  كذا وكذ ادرهم الانه كالكفاية ⁦(كلا )⁩ كلاكلة زجروردع ومعناها انته لا تفعل
  كفوله تعالى أيطمع كلّ اهرئ منهم أن يدخل جنة نعيم كلا أى لا يطمع فى ذلك وقد نكون
  بعنى حقا كقوله تعالى كلالتن لم يقته انسفما بالناصية ⁦(لا)⁩ لاحرف نفى لة ولان يفعل
  ولم يقع الفعل اذا قال هويفسعل غدا وقديكون ضد البلى ونحم وقد يكون للنهى كة ولك لا تقم
  ولا يقم زيد ينهى به كل منهىّ من غائب أوحاضر وقديكون لفوا قال العجاج
  فى بثرلا حورسرى وماشعر• وقال تعالى ماصنعك أن لا تسجد أى مامنهسك أن تسجد
  وقد يكون حرف عطف لاخراج الثانى عمادخل فيه الاول كولك وأيت زيد الاهرا فان
  أدخلت عليها الواوخرجت من أن تكون حرف عطف كة ولك لم يقم زيد ولا عمرولان
  حروف النسق لا يدخسل بعضهاءلى بعض قسكون الواوالحطف ولا انماهى امو كد التقى
  وقد تزادفه التافقال لات وقدد كرناء فى عاب التاءوادا استقلها الالف واللام ذهت
  ألفه كما قال أبى جوده لا البخل واستعجلت نعم • به من فق لا ينع الجوع قاتله
  وذكريونس أنّ أباعمروبن العلاه كان يجرّ البخل ويجعل لامضافة الله لان لا قد تكون للجود
  وللبخل ألاثرى أنه لويل ه اصنع الحق فقال لا كان جودا منه فأما ان جءاتها لغوائدبت البخل
  بالفسعل وان شقت نصبه على البدل وقولهم ام الى فافعل كذا بالامالة أصلهان لا وماصلة
  ومعنادان لا يكن ذلك الامر فافعل كذا وأماة ول السكميت
