label: { ar: "صحيح البخاري 4469 — الأب والأبوة", en: "Sahih al-Bukhari 4469 — the father and fatherhood", ur: "صحیح بخاری 4469 — باپ اور والدیت", es: "Sahih al-Bukhari 4469 — El padre y la paternidad" }
text: "… عَبْدِ اللَّهِ بْنِ عُمَرَما أَنَّ رَسُولَ اللَّهِ بَعَثَ بَعْثًا وَأَمَّرَ عَلَيْهِمْ أُسَامَةَ بْنَ زَيْدٍ، فَطَعَنَ النَّاسُ فِي إِمَارَتِهِ، فَقَامَ رَسُولُ اللَّهِ فَقَالَ \" إِنْ تَطْعُنُوا فِي إِمَارَتِهِ فَقَدْ كُنْتُمْ تَطْعُنُونَ فِي إِمَارَةِ أَبِيهِ مِنْ قَبْلُ، وَايْمُ اللَّهِ إِنْ كَانَ لَخَلِيقًا لِلإِمَارَةِ، وَإِنْ كَانَ لَمِنْ أَحَبِّ النَّاسِ إِلَىَّ، وَإِنَّ هَذَا لَمِنْ أَحَبِّ النَّاسِ إِلَىَّ بَعْدَهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4469، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4469 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4469، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4469 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
