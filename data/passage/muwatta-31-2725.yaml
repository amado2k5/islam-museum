label: { ar: "الموطأ 2725 — أبو بكر بن نافع عن ابن عمر: أمر النبي بإحفاء الشوارب وإعفاء اللحى", en: "Muwatta 2725", es: "Muwatta 2725", fr: "Muwatta 2725", ur: "موطا 2725", tr: "El-Muvatta 2725 — Ebu Bekr bin Nafi', İbn Ömer'den rivayetle: Peygamber, bıyıkların kısaltılmasını ve sakalların bırakılmasını emretti.", id: "Al-Muwatta 2725 — Abu Bakr bin Nafi’ meriwayatkan dari Ibn Umar: Nabi memerintahkan untuk memangkas kumis dan membiarkan janggut tumbuh." }
summary:
  ar: "يروي مالك عن أبي بكر بن نافع عن أبيه عن عبد الله بن عمر أن رسول الله أمر بإحفاء الشوارب وإعفاء اللحى. {cite:muwatta-maruf-1997 p.535}"
  tr: "Malik, Ebu Bekir ibn Nafi'den, o da babasından, o da Abdullah ibn Umar'dan rivayetle, Allah Resulü'nün bıyıkların kısaltılmasını ve sakalların uzatılmasını emrettiğini nakletmiştir. {cite:muwatta-maruf-1997 s.535}"
  id: "Malik meriwayatkan dari Abu Bakar bin Nafi, dari ayahnya, dari Abdullah bin Umar, bahwa Rasulullah SAW memerintahkan agar kumis dipangkas dan janggut dibiarkan tumbuh. {cite:muwatta-maruf-1997 p.535}"
