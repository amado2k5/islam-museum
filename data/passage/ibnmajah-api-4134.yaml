text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَفَّانُ، حَدَّثَنَا غَسَّانُ بْنُ بُرْزِينَ، ح وَحَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُعَاوِيَةَ الْجُمَحِيُّ، حَدَّثَنَا غَسَّانُ بْنُ بُرْزِينَ، حَدَّثَنَا سَيَّارُ بْنُ سَلاَمَةَ، عَنِ الْبَرَاءِ السَّلِيطِيِّ، عَنْ نُقَادَةَ الأَسَدِيِّ، قَالَ بَعَثَنِي رَسُولُ اللَّهِ ـ إِلَى رَجُلٍ يَسْتَمْنِحُهُ نَاقَةً فَرَدَّهُ ثُمَّ بَعَثَنِي إِلَى رَجُلٍ آخَرَ فَأَرْسَلَ إِلَيْهِ بِنَاقَةٍ فَلَمَّا أَبْصَرَهَا رَسُولُ اللَّهِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4134، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4134 (Zuhd), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4134، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
