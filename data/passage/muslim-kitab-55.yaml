summary:
  ar: "القسم 55 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزهد والرقائق»، ويضم فيها النصوص من 7417 إلى 7522 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 55 of Sahih Muslim (The Book of Zuhd and Softening of Hearts) in the division of the open hadith dataset the museum took its reports from: reports 7417 to 7522 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 55، عنوان «کتاب الزہد والرقائق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7417 تا 7522۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 55 de Sahih Muslim (El Libro del Zuhd y el Ablandamiento de los Corazones) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 7417 a 7522 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre du Zuhd et de l'Adoucissement des Cœurs), dans la partie ouverte du recueil de hadiths d'où proviennent les rapports 7417 à 7522. Le musée classe ses archives de ces rapports sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih Müslim'in 55. bölümü \"Zilecilik ve Kalpleri Yumuşatma Kitabı\" başlığını taşımakta olup, 7417 ile 7522 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 55 dari Sahih Muslim, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab tentang Pertapaan dan Pelunakan Hati\" dan berisi teks 7417 hingga 7522, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
