label:
  ar: "صحيح البخاري، كتاب في اللقطة"
  en: "Sahih al-Bukhari, Book 45: Lost Things Picked up by Someone (Luqatah)"
  ur: "صحیح بخاری، کتاب فی اللقطۃ"
  es: "Sahih al-Bukhari, Libro 45: Cosas perdidas recogidas por alguien (Luqatah)"
  fr: "Sahih al-Bukhari, Livre 45: Objets perdus retrouvés par quelqu'un (Luqatah)"
summary:
  ar: "القسم 45 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب في اللقطة»، ويضم فيها النصوص من 2426 إلى 2439 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 45 of Sahih al-Bukhari (Lost Things Picked up by Someone (Luqatah)) in the division of the open hadith dataset the museum took its reports from: reports 2426 to 2439 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 45، عنوان «کتاب فی اللقطۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2426 تا 2439۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 45 de Sahih al-Bukhari (Cosas perdidas recogidas por alguien (Luqatah)) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2426 al 2439 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de forma diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari, dans son livre 45 (Rites perdus retrouvés par quelqu'un – Luqatah), qui correspond aux hadiths 2426 à 2439 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
