text: |-
  ⁦(فصل انخاء )⁩
  غرد)
  ٤٢٧
  الموزالمع وكل من ضم النفسه شيئا فقد حازه حوزاوحيازة واحتازه أيضاوالحوز والحيز
  السوق اللين وقد حازالابل يحوزها ويحبزها والاحوزى مثسل الاحوذى وهو السايق
  الخفيف عن أبى عمرو قال العجاج
  يحوزهنّ وله حوزى* كمايحوز الفئة الكمى
  وأبو عبيد يرويه بالذال والمعنى واحديعنى به الثورأنه يطارد السكلاب وله طارد من تفسه يطرده
  من نشاطه وحوّز الابل ساقها الى الماءقال الاصمعى اذا كانت بعدة المرعى من الماء فأول
  ليلة توجهها الى الماليلة الموزوقد حوّزها وأنشد
  -وَزها من برق الغميم * أهدأ يمنى مشية الظليم * بالحوزوالرفق وبالطميم
  والمحاوزة الخالطة وتحوّزت الحية وتحيزت أى تلوّت يقال مالك تتهوّز تحوّز الحية وتهيز تخيز
  الحية قال سيبويه هو تفعيل من حزت الشئ قال القطامى
  تحيزمن خشية ان أضيفها * كما انحازت الافعى مخافة ضارب
  يقول تتنى عنى هذه العجوز وتتأخر خوفا ان أنزل عليها ضيفا ويروى تحوّزمف قال أبو عمرو
  وتحوّز تحوّز الحينة وهو بط• القيام اذا أراد أن يقوم والحيزما انضم الى الدار من مرافقها
  وكل ناحية حيز وأصلهمن الواو والميز تخفيف الحير مشل هين وهين ولين ولين والجمع أحياز.
  والحوزة الناحية وحوزة الملك بيضته وانهاز عنه أى عدل واضازالقوم تركوامى كزهم
  الى آخر يقنال للاوليا. انحازوا عن العدو وحاصوا وللاعداء انهزم واوولوامديرين وقحاوز
  الفريقان فى الحرب أى انحاز كل فريق عن الآخر
  صل الخاء خبز)، الخبز الذى يؤكل والخبز بالفتح المصدروة دخبزت الخبزواسميزته
  ويقسال أيضا أخبزت القوم اذا أطعمتهم انخبز ورجل خابز أى ذو خبز مثل تامر ولا بن عن ابن
  السكيت والجبز السوق الشديد عن أبى زيد وأنشد
  لا تخبزا خبزا وبسابسا • ولا تطيلا بناخ حبسا
  ونذ كرفول أبى عبيدة فيه فى باب السين ان شاه اللّٰه عزوجل وانلمبز ضرب البعير يده الارض
  وهو ع-لى التشبيه وانخبز الطلة وهى عجين يوضع فى اللّٰه حتى ينضج والخيا ز وأنه بازى نبت
  معروف ⁦( خرز)⁩. خرز الطف وغيره يخرزه ويخرذه خرزاه وخرّاز والحرزة الكتبة
  الواحدة والجمع خرز والمخرزما يخرزبه والخرز بالتحريك الذى ينظم الواحدة خرزة وخوزات
  لملك جواهر تاجه ويقال سكان الملك اذا ملك عامازيدت فى تاجه خرزة ليعلم عدد سف
  ملكد قال لبيديذ كر الحرث بن أبى شهر الغسانى
  رعى خرزات الملك عشرين حجة * وعشرين حتى فادوالشيب شامل
  وخرز الظهر أيضافقاره ⁦(خزز)⁩، الحزوا حد انلخزوز من الثياب والحززذ كرالارانب والبمع
  خزان مثل صرد وصردان وخزه بسهم واختزه أى انتظمه وطعنه فاختزه قال ابن أحر
  شد الجواروصل هدية روقه • لاختزرت فؤاده بالمطرد
  وفلان خز حائطه أى وضع فيه الشول لثلايتسلق وخزاز جبل كانت العرب توقد عديه
  النارغداة الغارة ويقال أيضاخزازى قال عمروبن كلنوم
