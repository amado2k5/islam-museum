label: { ar: "سنن أبي داود 4272 — ما حُرّم", en: "Sunan Abi Dawud 4272 — what was made unlawful", ur: "سنن ابی داؤد 4272 — جو حرام کیا گیا" }
text: "… أَبِي الزِّنَادِ، عَنْ مُجَالِدِ بْنِ عَوْفٍ، أَنَّ خَارِجَةَ بْنَ زَيْدٍ، قَالَ سَمِعْتُ زَيْدَ بْنَ ثَابِتٍ، فِي هَذَا الْمَكَانِ يَقُولُ أُنْزِلَتْ هَذِهِ الآيَةُ { وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ خَالِدًا فِيهَا } بَعْدَ الَّتِي فِي الْفُرْقَانِ { وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ } بِسِتَّةِ أَشْهُرٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4272، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4272 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4272، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
