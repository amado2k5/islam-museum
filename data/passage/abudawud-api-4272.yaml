ref: "4272"
label: { ar: "سنن أبي داود 4272 — ما حُرّم", en: "Sunan Abi Dawud 4272 — what was made unlawful", ur: "سنن ابی داؤد 4272 — جو حرام کیا گیا", es: "Sunan Abi Dawud 4272: lo que se declaró ilegal", fr: "Sunan Abi Dawud 4272 — ce qui a été rendu illégal", tr: "Sunan Abi Davud 4272 — Yasak olan nedir?", id: "Sunan Abi Dawud 4272 — Apa yang dilarang" }
text: "… أَبِي الزِّنَادِ، عَنْ مُجَالِدِ بْنِ عَوْفٍ، أَنَّ خَارِجَةَ بْنَ زَيْدٍ، قَالَ سَمِعْتُ زَيْدَ بْنَ ثَابِتٍ، فِي هَذَا الْمَكَانِ يَقُولُ أُنْزِلَتْ هَذِهِ الآيَةُ { وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ خَالِدًا فِيهَا } بَعْدَ الَّتِي فِي الْفُرْقَانِ { وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ } بِسِتَّةِ أَشْهُرٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4272، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4272 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4272، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4272 (Pruebas y batallas feroces (Kitab Al-Fitan Wa Al-Malahim)), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4272 (Épreuves et Combats acharnés), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 4272 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" kitabının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4272, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
