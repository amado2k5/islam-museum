text: "حَدَّثَنَا أَبُو عَاصِمٍ الضَّحَّاكُ بْنُ مَخْلَدٍ، عَنْ يَزِيدَ بْنِ أَبِي عُبَيْدٍ، عَنْ سَلَمَةَ بْنِ الأَكْوَعِ ـ أَنَّ النَّبِيَّ رَأَى نِيرَانًا تُوقَدُ يَوْمَ خَيْبَرَ. قَالَ \" عَلَى مَا تُوقَدُ هَذِهِ النِّيرَانُ \". قَالُوا عَلَى الْحُمُرِ الإِنْسِيَّةِ. قَالَ \" اكْسِرُوهَا، وَأَهْرِقُوهَا \". قَالُوا أَلاَ نُهْرِيقُهَا وَنَغْسِلُهَا قَالَ \" اغْسِلُوا \". قَالَ أَبُو عَبْد اللَّهِ كَانَ ابْنُ أَبِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2477، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2477 (Oppressions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 2477، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 2477 (Opresiones), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista de textos del Corán, la Sunnah, la Seerah y libros sobre naciones, religiones, sectas y pueblos no musulmanes."
