label: { ar: "الموطأ 1041 — بلغ مالكاً أن رسول الله حل هو وأصحابه بالحديبية، فنحروا الهدي وحلقوا رؤوسهم، وحلوا من كل شيء قبل أن يطوفوا بالبيت؛ ولم يعلم أنه أمر أحداً منهم بقضاء شيء", en: "Muwatta 1041" }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن رسول الله حل هو وأصحابه بالحديبية، فنحروا الهدي، وحلقوا رؤوسهم، وحلوا من كل شيء قبل أن يطوفوا بالبيت، وقبل أن يصل الهدي إليه، ثم لم يعلم أنه أمر أحداً منهم بقضاء شيء. ويذكر المحقق أن أصل معنى البلاغ في حديث المسور بن مخرمة الذي أخرجه الشيخان. {cite:muwatta-maruf-1997 p.484}"
