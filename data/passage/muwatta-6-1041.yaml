label: { ar: "الموطأ 1041 — بلغ مالكاً أن رسول الله حل هو وأصحابه بالحديبية، فنحروا الهدي وحلقوا رؤوسهم، وحلوا من كل شيء قبل أن يطوفوا بالبيت؛ ولم يعلم أنه أمر أحداً منهم بقضاء شيء", en: "Muwatta 1041", es: "Muwatta 1041", fr: "Muwatta 1041", ur: "موطا 1041", tr: "El-Muvatta 1041 — Malik'e, Allah Resulü ve sahabelerinin Hudeybiye'de durdukları, kurbanlarını kestikleri, başlarını tıraş ettikleri ve Kâbe'nin etrafında tavaf yapmadan önce tüm kısıtlamalardan kurtuldukları bildirildi; ve onlardan herhangi birine herhangi bir şeyi telafi etmelerini emrettiğini bilmiyordu.", id: "Al-Muwatta 1041 — Malik diberitahu bahwa Rasulullah dan para sahabatnya telah berhenti di Al-Hudaybiyyah, menyembelih hewan kurban mereka, mencukur rambut kepala mereka, dan dibebaskan dari segala larangan sebelum melakukan Tawaf mengelilingi Ka'bah; dan dia tidak mengetahui bahwa beliau telah memerintahkan salah seorang dari mereka untuk mengganti sesuatu." }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن رسول الله حل هو وأصحابه بالحديبية، فنحروا الهدي، وحلقوا رؤوسهم، وحلوا من كل شيء قبل أن يطوفوا بالبيت، وقبل أن يصل الهدي إليه، ثم لم يعلم أنه أمر أحداً منهم بقضاء شيء. ويذكر المحقق أن أصل معنى البلاغ في حديث المسور بن مخرمة الذي أخرجه الشيخان. {cite:muwatta-maruf-1997 p.484}"
  tr: "Malik, Resulullah ve arkadaşlarının Hudeybiye'ye vardıklarını, kurbanlarını kestiklerini, başlarını tıraş ettiklerini ve Kâbe'yi tavaf etmeden ve kurbanlar kendisine ulaşmadan önce tüm ritüel temizliklerini tamamladıklarını duyduğunu bildirmiştir. Daha sonra Peygamberin onlardan herhangi birine başka bir şey yapmalarını emrettiğini bilmediğini belirtmiştir. Araştırmacı, bu rivayetin kaynağının Buhari ve Müslim tarafından kaydedilen el-Miswar ibn Makhramah hadisinde bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.484}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa Rasulullah dan para sahabatnya telah tiba di al-Hudaybiyyah, menyembelih hewan kurban mereka, mencukur rambut kepala mereka, dan menyelesaikan semua ritual penyucian mereka sebelum melakukan tawaf di Ka'bah dan sebelum hewan kurban sampai kepadanya. Ia kemudian tidak mengetahui bahwa Nabi telah memerintahkan salah satu dari mereka untuk melakukan hal lain. Peneliti mencatat bahwa asal usul riwayat ini ditemukan dalam hadits al-Miswar ibn Makhramah, yang dicatat oleh al-Bukhari dan Muslim. {cite:muwatta-maruf-1997 p.484}"
