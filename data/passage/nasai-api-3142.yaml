label: { ar: "سنن النسائي 3142 — عمل يعدل عملا أعظم منه", en: "Sunan al-Nasa'i 3142 — a deed that equals a greater one", ur: "سنن نسائی 3142 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… بْنِ عَبَسَةَ يَا عَمْرُو حَدِّثْنَا حَدِيثًا، سَمِعْتَهُ مِنْ، رَسُولِ اللَّهِ. قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ شَابَ شَيْبَةً فِي سَبِيلِ اللَّهِ تَعَالَى كَانَتْ لَهُ نُورًا يَوْمَ الْقِيَامَةِ وَمَنْ رَمَى بِسَهْمٍ فِي سَبِيلِ اللَّهِ تَعَالَى بَلَغَ الْعَدُوَّ أَوَلَمْ يَبْلُغْ كَانَ لَهُ كَعِتْقِ رَقَبَةٍ وَمَنْ أَعْتَقَ رَقَبَةً مُؤْمِنَةً كَانَتْ لَهُ فِدَاءَهُ مِنَ النَّارِ عُضْوًا بِعُضْوٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3142، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3142 (The Book of Jihad), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3142، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
