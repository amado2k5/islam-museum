label: { ar: "صحيح مسلم 5323 — الأب والأبوة", en: "Sahih Muslim 5323 — the father and fatherhood", ur: "صحیح مسلم 5323 — باپ اور والدیت", es: "Sahih Muslim 5323 — El padre y la paternidad", fr: "Sahih Muslim 5323 — Le père et la paternité" }
text: "… عَصَّبَ رَسُولُ اللَّهِ بَطْنَهُ فَقَالُوا مِنَ الْجُوعِ. فَذَهَبْتُ إِلَى أَبِي طَلْحَةَ وَهُوَ زَوْجُ أُمِّ سُلَيْمٍ بِنْتِ مِلْحَانَ فَقُلْتُ يَا أَبَتَاهُ قَدْ رَأَيْتُ رَسُولَ اللَّهِ عَصَّبَ بَطْنَهُ بِعِصَابَةٍ فَسَأَلْتُ بَعْضَ أَصْحَابِهِ فَقَالُوا مِنَ الْجُوعِ. فَدَخَلَ أَبُو طَلْحَةَ عَلَى أُمِّي فَقَالَ هَلْ مِنْ شَىْءٍ فَقَالَتْ نَعَمْ عِنْدِي كِسَرٌ مِنْ خُبْزٍ وَتَمَرَاتٌ فَإِنْ جَاءَنَا رَسُولُ اللَّهِ وَحْدَهُ أَشْبَعْنَاهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5323، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5323 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5323، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5323 (El Libro de las Bebidas), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 5323 (Le Livre des Boissons), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
