text: "… الْذَّخِيْرَةِ، وتنفيذ ما يحتاجُ إليه في ذلك على أهل الجباية، فَخَصّوه باسم الحاجِبِ، ورُبَّما أضِافوا إليه كتابةَ العلامةِ على الْسِّجِلاَتِ، إذا اتَّفَقَ أَنَّهُ يُحْسِنُ صِنَاعةُ الكِتَابَةِ، وَرُبَّما جَعَلُوه لغيرهِ. واستمرَّ الأمرُ على ذلك، وحجبَ الْسُّلطانُ نفسهُ عنِ النَّاسِ فصارَ هذا …"
