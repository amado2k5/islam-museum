label: { ar: "جامع الترمذي 2198 — استحلال الشيء", en: "Jami' al-Tirmidhi 2198 — treating a thing as lawful", ur: "جامع ترمذی 2198 — کسی چیز کو حلال ٹھہرانا" }
text: "حَدَّثَنَا صَالِحُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا جَعْفَرُ بْنُ سُلَيْمَانَ، عَنْ هِشَامٍ، عَنِ الْحَسَنِ، قَالَ كَانَ يَقُولُ فِي هَذَا الْحَدِيثِ \" يُصْبِحُ الرَّجُلُ مُؤْمِنًا وَيُمْسِي كَافِرًا وَيُمْسِي مُؤْمِنًا وَيُصْبِحُ كَافِرًا \". قَالَ يُصْبِحُ الرَّجُلُ مُحَرِّمًا لِدَمِ أَخِيهِ وَعِرْضِهِ وَمَالِهِ وَيُمْسِي مُسْتَحِلاًّ لَهُ وَيُمْسِي مُحَرِّمًا لِدَمِ أَخِيهِ وَعِرْضِهِ وَمَالِهِ وَيُصْبِحُ مُسْتَحِلاًّ لَهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2198، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2198 (Chapters On Al-Fitan), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2198، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
