label: { ar: "الموطأ 963 — مالك: هل يهل من أهل مكة بعمرة من جوف مكة؟ بل يخرج إلى الحل فيحرم منه", en: "Muwatta 963", es: "Muwatta 963", fr: "Muwatta 963", ur: "موطا 963", tr: "El-Muvatta 963 — Malik: Mekke halkı Umre için ihram halini Mekke içinden mi almalıdır? Aksine, Haram sınırına kadar çıkıp oradan ihram halini almalıdır.", id: "Al-Muwatta 963 — Malik: Haruskah penduduk Mekah memasuki keadaan ihram untuk Umrah dari dalam Mekah? Sebaiknya, mereka keluar ke perbatasan Haram dan memasuki keadaan ihram dari sana." }
text: "بل يخرج إلى الحل فيحرم منه"
summary:
  ar: "سئل مالك: هل يهل رجل من أهل مكة بعمرة من جوف مكة؟ فقال: بل يخرج إلى الحل فيحرم منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1088). {cite:muwatta-maruf-1997 p.457}"
  tr: "Malik'e şu soru soruldu: Mekke'li bir adam, Umre için Mekke içinden ihramlı hale girebilir mi? O şöyle cevap verdi: Aksine, Haram'ın (Mekke dışındaki bölgenin) sınırlarının dışına çıkmalı ve oradan ihramlı hale gelmelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1088) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.457}"
  id: "Malik ditanya: Dapatkah seorang pria dari Mekah memasuki keadaan ihram untuk Umrah dari dalam Mekah? Beliau menjawab: Sebaiknya ia pergi ke luar batas Haram (wilayah di luar Mekah) dan memasuki keadaan ihram dari sana. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1088). {cite:muwatta-maruf-1997 p.457}"
