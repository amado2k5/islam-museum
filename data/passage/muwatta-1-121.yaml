text: "ثم أشار إليهم بيده أن امكثوا، فذهب ثم رجع وعلى جلده أثر الماء"
summary:
  ar: "أول حديث في باب إعادة الجنب الصلاة وغسله إذا صلى ولم يذكر وغسله ثوبه. يرويه يحيى عن مالك عن إسماعيل بن أبي حكيم أن عطاء بن يسار أخبره مرسلاً أن النبي كبّر في صلاة من الصلوات ثم أشار إلى المصلين بيده أن يمكثوا، فذهب فاغتسل ثم رجع وعلى جلده أثر الماء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن هذا المتن في الصحيحين موصولاً من حديث أبي سلمة عن أبي هريرة (البخاري 1/77، مسلم 2/101). {cite:muwatta-maruf-1997 p.93} {cite:muwatta-maruf-1997 p.94}"
