label: { ar: "سنن أبي داود 2198 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 2198 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 2198 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 2198 — lo que fue lícito; lo que no es lícito" }
text: "… ابْنَ عَبَّاسٍ، وَأَبَا، هُرَيْرَةَ وَعَبْدَ اللَّهِ بْنَ عَمْرِو بْنِ الْعَاصِ سُئِلُوا عَنِ الْبِكْرِ، يُطَلِّقُهَا زَوْجُهَا ثَلاَثًا فَكُلُّهُمْ قَالُوا لاَ تَحِلُّ لَهُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ. قَالَ أَبُو دَاوُدَ وَرَوَى مَالِكٌ عَنْ يَحْيَى بْنِ سَعِيدٍ عَنْ بُكَيْرِ بْنِ الأَشَجِّ عَنْ مُعَاوِيَةَ بْنِ أَبِي عَيَّاشٍ أَنَّهُ شَهِدَ هَذِهِ الْقِصَّةَ حِينَ جَاءَ مُحَمَّدُ بْنُ إِيَاسِ بْنِ الْبُكَيْرِ إِلَى …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2198، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2198 (Divorce (Kitab Al-Talaq)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2198، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2198 (Divorcio (Kitab Al-Talaq)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
