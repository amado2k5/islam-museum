label: { ar: "الموطأ 1771 — مالك عن إبراهيم بن عقبة: سأل سعيد بن المسيب عن الرضاعة، فقال كل ما كان في الحولين فهو يحرم، وما كان بعدهما فإنما هو طعام، ثم سأل عروة فقال مثل ذلك", en: "Muwatta 1771", es: "Muwatta 1771", fr: "Muwatta 1771", ur: "موطا 1771", tr: "El-Muvatta 1771 — Malik, İbrahim ibn Ukba'dan rivayetle: Said ibn el-Musayyab'a emzirme hakkında sordu ve o şöyle dedi: \"İlk iki yıl içinde olan her şey haramdır, ondan sonraki her şey ise sadece yiyecektir.\" Sonra Urva'ya sordu ve o da aynı şeyi söyledi.", id: "Al-Muwatta 1771 — Malik, berdasarkan riwayat Ibrahim ibn Uqba: Dia bertanya kepada Saeed ibn al-Musayyab tentang pemberian ASI, dan dia berkata: “Segala sesuatu yang terjadi dalam dua tahun pertama haram, dan apa pun setelah itu hanyalah makanan.” Kemudian dia bertanya kepada Urwa, dan dia mengatakan hal yang sama." }
summary:
  ar: "يروي مالك عن إبراهيم بن عقبة أنه سأل سعيد بن المسيب عن الرضاعة، فقال سعيد: كل ما كان في الحولين، وإن كانت قطرة واحدة، فهو يحرم، وما كان بعد الحولين فإنما هو طعام يأكله. قال إبراهيم بن عقبة: ثم سألت عروة بن الزبير فقال مثل ما قال سعيد بن المسيب. {cite:muwatta-maruf-1997 p.122} {cite:muwatta-maruf-1997 p.123}"
  tr: "Malik, İbrahim ibn Ukba'dan rivayetle, Sa'id ibn el-Musayyab'a emzirme hakkında sorduğunu ve Sa'id'in şöyle dediğini aktarır: \"İlk iki yıl içinde gerçekleşen her şey, tek bir damla bile olsa, haram bir ilişki kurar. İlk iki yıldan sonra gerçekleşen her şey ise çocuğun yediği besindir.\" İbrahim ibn Ukba şöyle dedi: \"Sonra Urva ibn el-Zubayr'a sordum ve o da Sa'id ibn el-Musayyab ile aynı şeyi söyledi.\" {cite:muwatta-maruf-1997 s.122} {cite:muwatta-maruf-1997 s.123}"
  id: "Malik meriwayatkan dari Ibrahim ibn Uqba bahwa ia bertanya kepada Sa'id ibn al-Musayyab tentang pemberian ASI, dan Sa'id berkata: \"Segala sesuatu yang terjadi dalam dua tahun pertama, meskipun hanya setetes, merupakan hubungan yang dilarang. Segala sesuatu yang terjadi setelah dua tahun pertama hanyalah makanan yang dimakan anak.\" Ibrahim ibn Uqba berkata: \"Kemudian saya bertanya kepada Urwa ibn al-Zubayr, dan dia mengatakan hal yang sama seperti Sa'id ibn al-Musayyab.\" {cite:muwatta-maruf-1997 p.122} {cite:muwatta-maruf-1997 p.123}"
