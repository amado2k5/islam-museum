label: { ar: "الموطأ 1771 — مالك عن إبراهيم بن عقبة: سأل سعيد بن المسيب عن الرضاعة، فقال كل ما كان في الحولين فهو يحرم، وما كان بعدهما فإنما هو طعام، ثم سأل عروة فقال مثل ذلك", en: "Muwatta 1771" }
summary:
  ar: "يروي مالك عن إبراهيم بن عقبة أنه سأل سعيد بن المسيب عن الرضاعة، فقال سعيد: كل ما كان في الحولين، وإن كانت قطرة واحدة، فهو يحرم، وما كان بعد الحولين فإنما هو طعام يأكله. قال إبراهيم بن عقبة: ثم سألت عروة بن الزبير فقال مثل ما قال سعيد بن المسيب. {cite:muwatta-maruf-1997 p.122} {cite:muwatta-maruf-1997 p.123}"
