label: { ar: "الموطأ 846 — مالك عن المرأة تصبح صائمة في رمضان فتدفع دفعة دم عبيط في غير أوان حيضتها: تفطر وتقضي، فإذا ذهب الدم اغتسلت وصامت", en: "Muwatta 846" }
summary:
  ar: "مسألة سئل عنها مالك: امرأة تصبح صائمة في رمضان فتدفع دفعة من دم عبيط في غير أوان حيضتها، ثم تنتظر حتى تمسي فلا تر شيئاً، ثم تصبح يوماً آخر فتدفع دفعة أخرى دون الأولى، ثم ينقطع عنها قبل حيضتها بأيام. فقال مالك: ذلك الدم من الحيضة، فإذا رأته فلتفطر ولتقض ما أفطرت، فإذا ذهب عنها الدم فلتغتسل ولتصم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (825). {cite:muwatta-maruf-1997 p.410}"
