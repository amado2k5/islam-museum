label: { ar: "الموطأ 846 — مالك عن المرأة تصبح صائمة في رمضان فتدفع دفعة دم عبيط في غير أوان حيضتها: تفطر وتقضي، فإذا ذهب الدم اغتسلت وصامت", en: "Muwatta 846", es: "Muwatta 846", fr: "Muwatta 846", ur: "موطا 846", tr: "El-Muvatta 846 — Malik, Ramazan ayında oruç tutmaya başlayan ve daha sonra adet dönemi dışında aniden şiddetli bir kanama yaşayan bir kadının rivayetine dayanarak, orucunu bozup daha sonra kaza ettiğini, kanama durunca gusül abdesti alıp orucuna devam ettiğini belirtmiştir.", id: "Al-Muwatta 846 — Malik berdasarkan riwayat seorang wanita yang mulai berpuasa di bulan Ramadan dan kemudian mengalami pendarahan hebat secara tiba-tiba di luar masa menstruasinya: ia membatalkan puasanya dan menggantinya kemudian. Ketika pendarahan berhenti, ia melakukan ghusl (penyusuan ritual) dan melanjutkan puasanya." }
summary:
  ar: "مسألة سئل عنها مالك: امرأة تصبح صائمة في رمضان فتدفع دفعة من دم عبيط في غير أوان حيضتها، ثم تنتظر حتى تمسي فلا تر شيئاً، ثم تصبح يوماً آخر فتدفع دفعة أخرى دون الأولى، ثم ينقطع عنها قبل حيضتها بأيام. فقال مالك: ذلك الدم من الحيضة، فإذا رأته فلتفطر ولتقض ما أفطرت، فإذا ذهب عنها الدم فلتغتسل ولتصم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (825). {cite:muwatta-maruf-1997 p.410}"
  tr: "Malik'e şöyle bir soru yöneltildi: Bir kadın Ramazan ayında oruç tutmaya başlar ve adet döneminin dışında aniden yoğun bir kanama yaşar. Akşama kadar bekler ve hiçbir şey görmez. Ertesi sabah, ilkine göre daha az bir kanama daha yaşar ve ardından beklenen adet döneminden birkaç gün önce kanama durur. Malik şöyle dedi: Bu kanama adet kanamasıdır. Eğer bunu görürse, orucunu bozmalı ve kaçırdığı günleri daha sonra kaza etmelidir. Kanama durduğunda, gusül abdesti almalı ve oruca devam etmelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (825) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.410}"
  id: "Sebuah pertanyaan diajukan kepada Malik: Seorang wanita memulai puasanya di bulan Ramadan dan mengalami pendarahan hebat secara tiba-tiba di luar masa menstruasinya. Ia menunggu hingga sore hari dan tidak melihat apa pun. Keesokan paginya, ia mengalami pendarahan lagi, lebih sedikit dari yang pertama, dan kemudian berhenti beberapa hari sebelum masa menstruasinya yang seharusnya. Malik berkata: Darah itu adalah darah menstruasinya. Jika ia melihatnya, ia harus membatalkan puasanya dan mengganti hari-hari yang terlewatkan di kemudian hari. Ketika pendarahan berhenti, ia harus melakukan ghusl (pembersihan ritual) dan melanjutkan puasanya. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (825). {cite:muwatta-maruf-1997 p.410}"
