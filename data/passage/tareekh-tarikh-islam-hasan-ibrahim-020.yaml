text: "حته إلى خاتمته، نحيي ما أحيا ونميت ما أمات. فما وجد الحكمان في كتاب الله عز وجل، وهما أبو موسى الأشعري عبد الله ابن قيس، وعمرو بن العاص القرشي، عملا به، وما لم يجدا في كتاب الله عز وجل فالسنة"
