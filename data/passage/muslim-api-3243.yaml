text: "… بْنُ وَهْبٍ، عَنْ مَخْرَمَةَ، ح وَحَدَّثَنِي هَارُونُ، بْنُ سَعِيدٍ الأَيْلِيُّ حَدَّثَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي مَخْرَمَةُ بْنُ بُكَيْرٍ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ نَافِعًا، مَوْلَى ابْنِ عُمَرَ يَقُولُ سَمِعْتُ عَبْدَ اللَّهِ بْنَ أَبِي بَكْرِ بْنِ أَبِي قُحَافَةَ، يُحَدِّثُ عَبْدَ اللَّهِ بْنَ عُمَرَ عَنْ عَائِشَةَ، زَوْجِ النَّبِيِّ أَنَّهَا قَالَتْ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" لَوْلاَ أَنَّ قَوْمَكِ حَدِيثُو …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3243، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3243 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 3243، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
