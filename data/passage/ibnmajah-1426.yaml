ref: "1426"
label:
  ar: "ابن ماجه 1426 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Ibn Majah 1426 — The first thing a servant is reckoned for is his prayer"
  ur: "ابن ماجہ 1426 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
  es: "Ibn Majah 1426 — Lo primero por lo que se cuenta de un siervo es su oración."
  fr: "Ibn Majah 1426 — La première chose dont un serviteur est tenu compte, c'est sa prière."
  tr: "İbn Majah 1426 — Bir kulun hesaba çekileceği ilk şey namazıdır: Kulumun gönüllü namazı olup olmadığına bakın."
  id: "Ibn Majah 1426 — Hal pertama yang akan dipertanggungjawabkan kepada seorang hamba adalah shalatnya: Perhatikanlah apakah hamba-Ku mempunyai shalat sunnah."
text: "أول ما يحاسب به العبد يوم القيامة صلاته. فإن أكملها كتبت له نافلة. فإن لم يكن أكملها، قال الله سبحانه لملائكته: انظروا، هل تجدون لعبدي من تطوع؟ فأكملوا بها ما ضيع من فريضته . ثم تؤخذ الأعمال على حسب ذلك …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1426: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1426: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1426: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 1426: Lo primero por lo que se cuenta a un siervo es su oración. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 1426: La première chose dont un serviteur est tenu compte est sa prière. Le Prophète le rapporte de son Seigneur; le dictionnaire Qudsi Browser rassemble ses narrations issues des six livres et du Muwatta."
  tr: "İbn Majah Süneni'nde 1426 numaralı hadis-i kudsi şöyledir: Bir kulun hesaba çekileceği ilk şey namazıdır: \"Kulumun nafile namazları olup olmadığına bakın.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı şeriat hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 1426: Hal pertama yang akan dimintai pertanggungjawaban dari seorang hamba adalah salatnya: Perhatikanlah apakah hamba-Ku mempunyai salat sunnah. Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
