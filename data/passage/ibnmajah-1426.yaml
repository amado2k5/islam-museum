label:
  ar: "ابن ماجه 1426 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Ibn Majah 1426 — The first thing a servant is reckoned for is his prayer"
  ur: "ابن ماجہ 1426 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
text: "أول ما يحاسب به العبد يوم القيامة صلاته. فإن أكملها كتبت له نافلة. فإن لم يكن أكملها، قال الله سبحانه لملائكته: انظروا، هل تجدون لعبدي من تطوع؟ فأكملوا بها ما ضيع من فريضته . ثم تؤخذ الأعمال على حسب ذلك …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1426: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1426: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1426: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
