text: "… الرزاق عن عبد القدوس قال : سمعت الحسن يقول : قال النبي عليلا : لا تشهدوا على أُمتكم بشرك، ولا تُكَفَّروهم بذنب، والجهاد لا يضره جور جائر، ولا عدل عادل، والجهاد ماض حتى يبعث آخر هذه الأُمة، والإيمان بالقدر خيره …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 2676، يذكر الإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 2676, that mentions belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 2676 کا اقتباس جس میں تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
