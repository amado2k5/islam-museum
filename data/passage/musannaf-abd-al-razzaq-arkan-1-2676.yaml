  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 1, page 2676, mentionnant la croyance en ce décret; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Musannaf Abd al-Razzaq'ın Resimli Cilt 1'inden, sayfa 2676'dan bir alıntı, kader inancından bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 2676, menyebutkan kepercayaan pada takdir; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
