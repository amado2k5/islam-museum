text: "… يصيبه ورم ونفخة في العين بلا وجع في الأكثر، وربما كان مع وجع في الرحم. العلاج : أمّا سيلان المني منهن، فيعالج بمثل ما يعالج ذلك في الرجال، وأمّا السيلانات الأخرى، فيجب أن يبتدأ فيها بتنقية البدن بالفصد والإسهال، إن …"
