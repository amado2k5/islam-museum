text: "الرشيد رمى به ليحيى ، وقال له : يا أبت اقرأ هذا الكتاب ، واكتب اليه كتابا يردعه عن مثل هذا . فمديده الى دواة الرشيد وكتب الى الفضل على ظهر كتاب صاحب البريد : حفظك الله يا بني ،"
