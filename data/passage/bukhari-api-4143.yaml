label: { ar: "صحيح البخاري 4143 — الحمى", en: "Sahih al-Bukhari 4143 — fever", ur: "صحیح بخاری 4143 — بخار", es: "Sahih al-Bukhari 4143 – fiebre", fr: "Sahih al-Bukhari 4143 – fièvre", tr: "Sahih el-Buhari 4143 — Ateş", id: "Sahih al-Bukhari 4143 — Demam" }
text: "… رَسُولُ اللَّهِ قَالَتْ نَعَمْ. قَالَتْ وَأَبُو بَكْرٍ قَالَتْ نَعَمْ. فَخَرَّتْ مَغْشِيًّا عَلَيْهَا، فَمَا أَفَاقَتْ إِلاَّ وَعَلَيْهَا حُمَّى بِنَافِضٍ، فَطَرَحْتُ عَلَيْهَا ثِيَابَهَا فَغَطَّيْتُهَا. فَجَاءَ النَّبِيُّ فَقَالَ \" مَا شَأْنُ هَذِهِ \". قُلْتُ يَا رَسُولَ اللَّهِ أَخَذَتْهَا الْحُمَّى بِنَافِضٍ. قَالَ \" فَلَعَلَّ فِي حَدِيثٍ تُحُدِّثَ بِهِ \". قَالَتْ نَعَمْ. فَقَعَدَتْ عَائِشَةُ فَقَالَتْ وَاللَّهِ لَئِنْ حَلَفْتُ لاَ تُصَدِّقُونِي، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4143، يذكر الحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4143 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4143، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4143 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona la fiebre. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4143 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne la fièvre. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4143 numaralı hadis, ateşten bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4143, menyebutkan tentang demam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
