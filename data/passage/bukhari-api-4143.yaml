text: "… رَسُولُ اللَّهِ قَالَتْ نَعَمْ. قَالَتْ وَأَبُو بَكْرٍ قَالَتْ نَعَمْ. فَخَرَّتْ مَغْشِيًّا عَلَيْهَا، فَمَا أَفَاقَتْ إِلاَّ وَعَلَيْهَا حُمَّى بِنَافِضٍ، فَطَرَحْتُ عَلَيْهَا ثِيَابَهَا فَغَطَّيْتُهَا. فَجَاءَ النَّبِيُّ فَقَالَ \" مَا شَأْنُ هَذِهِ \". قُلْتُ يَا رَسُولَ اللَّهِ أَخَذَتْهَا الْحُمَّى بِنَافِضٍ. قَالَ \" فَلَعَلَّ فِي حَدِيثٍ تُحُدِّثَ بِهِ \". قَالَتْ نَعَمْ. فَقَعَدَتْ عَائِشَةُ فَقَالَتْ وَاللَّهِ لَئِنْ حَلَفْتُ لاَ تُصَدِّقُونِي، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4143، يذكر الحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4143 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4143، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
