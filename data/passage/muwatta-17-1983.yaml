summary:
  ar: "قال مالك: وكذلك الغزل وغيره مما أشبهه، إذا دخله هذا، ولحق المشتري دين لا وفاء له. وهذا العمل فيه. {cite:muwatta-maruf-1997 p.212}"
  tr: "Malik şöyle dedi: Aynı durum iplik eğirme ve benzeri şeyler için de geçerlidir; eğer bu gerçekleşirse ve alıcı geri ödenemeyecek bir borç altına girerse, bu caizdir. {cite:muwatta-maruf-1997 s.212}"
  id: "Malik berkata: Hal yang sama berlaku untuk memintal dan hal-hal serupa; jika ini terjadi, dan pembeli menanggung hutang yang tidak dapat dibayar, maka ini diperbolehkan. {cite:muwatta-maruf-1997 p.212}"
