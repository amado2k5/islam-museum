text: "… قال المُصَنِّفُ ذلك لأن الشَّخْصَ ليس مأموراً بالخوض فيما جرى بينهم، فإنه ليس من العَقَائِدِ الدِّينية، ولا من القواعد الكلامية، وليس ممّا يُنتفع به في الدِّين، بل ربّما ضرّ في اليقين، فلا يباح الخوض فيه إلا للرَّدِّ على المتعصبين، أو …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 26، يرد فيه ذكر المباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 1, p. 26, whose wording mentions the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 1، ص 26 کا اقتباس جس میں مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Isaba de Ibn Hajar, volume numérisé 1, p. 26, dont le texte mentionne le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen digitalizado 1, p. 26, cuyo texto menciona lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 1. cildinin 26. sayfasından, izin verilen fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram kılınan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Isabah* karya Ibnu Hajar, Jilid 1, halaman 26, yang menyebutkan amalan-amalan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
