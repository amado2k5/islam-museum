label: { ar: "الموطأ 71 — غسل الإناء من شرب الكلب سبع مرات", en: "Muwatta 71" }
text: "إذا شرب الكلب في إناء أحدكم فليغسله سبع مرات"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب جامع الوضوء: أمر النبي بغسل الإناء سبع مرات إذا شرب منه الكلب. ويخرّجه المحقق عند البخاري (172) ومسلم (1/161) والنسائي (1/52) وابن ماجه (364) وأحمد من طرق أصحاب مالك، ويبين أن لفظ يحيى وأكثر الموطآت «إذا شرب» وأن المشهور عن أصحاب أبي الزناد «إذا ولغ» وهو المعروف في اللغة، وأن ابن عبد البر زعم أن مالكاً لم يقل «ولغ» وليس كذلك إذ جاء في رواية روح بن عبادة عنه عند ابن ماجه، وينقل عن ابن حجر أن أبا الزناد كأنه حدث به باللفظين لتقارب معناهما (فتح الباري 1/364–365). {cite:muwatta-maruf-1997 p.72} {cite:muwatta-maruf-1997 p.73}"
