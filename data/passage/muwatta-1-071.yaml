label: { ar: "الموطأ 71 — غسل الإناء من شرب الكلب سبع مرات", en: "Muwatta 71", es: "Muwatta 71", fr: "Muwatta 71", ur: "موطا 71", tr: "Al-Muwatta 71 — Köpeğin içtiği kabın yedi defa yıkanması", id: "Al-Muwatta 71 — Mencuci bejana tujuh kali setelah anjing minum darinya" }
text: "إذا شرب الكلب في إناء أحدكم فليغسله سبع مرات"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب جامع الوضوء: أمر النبي بغسل الإناء سبع مرات إذا شرب منه الكلب. ويخرّجه المحقق عند البخاري (172) ومسلم (1/161) والنسائي (1/52) وابن ماجه (364) وأحمد من طرق أصحاب مالك، ويبين أن لفظ يحيى وأكثر الموطآت «إذا شرب» وأن المشهور عن أصحاب أبي الزناد «إذا ولغ» وهو المعروف في اللغة، وأن ابن عبد البر زعم أن مالكاً لم يقل «ولغ» وليس كذلك إذ جاء في رواية روح بن عبادة عنه عند ابن ماجه، وينقل عن ابن حجر أن أبا الزناد كأنه حدث به باللفظين لتقارب معناهما ⁦(فتح الباري 1/364–365)⁩. {cite:muwatta-maruf-1997 p.72} {cite:muwatta-maruf-1997 p.73}"
  tr: "Malik, abdestle ilgili kapsamlı hükümler bölümünde, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ederek şöyle buyurmuştur: Peygamberimiz, bir köpek bir kaptan su içerse, o kabın yedi defa yıkanmasını emretmiştir. Araştırmacı ayrıca bunu, Malik'in sahabelerinin rivayet zincirleri aracılığıyla Buhari (172), Müslim (1/161), Nesai (1/52), İbn Majah (364) ve Ahmed'in derlemelerine de dahil etmiştir. Yahya ve Muvatta'nın çoğunun ifadesinin \"eğer içtiyse\" olduğunu, Ebu el-Zinad'ın sahabeleri arasında daha yaygın olan ve dilde daha çok kabul gören ifadenin ise \"eğer yaladıysa\" olduğunu açıklığa kavuşturmuştur. İbn Abdülbarr'ın Malik'in \"lapped\" kelimesini kullanmadığını iddia ettiğini belirtiyor, ancak bu yanlıştır, zira İbn Majah tarafından kaydedilen Rawh ibn Ubadah'ın rivayetinde bu kelime geçmektedir. İbn Hajar'ın, Ebu el-Zinad'ın benzer anlamlarından dolayı her iki kelimeyi de kullanarak rivayet etmiş gibi göründüğünü söylediğini aktarıyor (Fath al-Bari 1/364–365). {cite:muwatta-maruf-1997 s.72} {cite:muwatta-maruf-1997 s.73}"
  id: "Malik meriwayatkan hadits ini dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam bab tentang hukum-hukum wudhu yang komprehensif: Nabi memerintahkan agar sebuah bejana dicuci tujuh kali jika seekor anjing meminum airnya. Peneliti juga memasukkannya dalam kumpulan hadits al-Bukhari (172), Muslim (1/161), al-Nasa'i (1/52), Ibn Majah (364), dan Ahmad, melalui sanad para sahabat Malik. Ia menjelaskan bahwa redaksi Yahya dan sebagian besar Muwatta adalah \"jika ia meminum,\" sedangkan redaksi yang lebih umum di kalangan sahabat Abu al-Zinad adalah \"jika ia menjilat,\" yang merupakan penggunaan yang lebih umum diterima dalam bahasa tersebut. Ia mencatat bahwa Ibn 'Abd al-Barr mengklaim bahwa Malik tidak menggunakan kata \"terjepit,\" tetapi ini tidak benar, karena kata tersebut muncul dalam riwayat Rawh ibn 'Ubadah atas otoritasnya, sebagaimana dicatat oleh Ibn Majah. Ia mengutip Ibn Hajar yang mengatakan bahwa Abu al-Zinad tampaknya meriwayatkannya dengan kedua redaksi tersebut karena maknanya yang serupa (Fath al-Bari 1/364–365). {cite:muwatta-maruf-1997 p.72} {cite:muwatta-maruf-1997 p.73}"
