text: "… ما أبصرناه، وقاموا ينفضُون التراب عن رؤوسهم، وهم: أبو جهل، والحكمُ بنُ العاص، وعُقْبَةُ بن أبي مُعيط، والنَّضرُ بن الحارث، وأميَّةُ بن خلف، وزمعةٌ بن الأسود، وطُعيمة بن عدي، وأبو لهب، وأبيُّ بن خلف، ونبيه ومنبّه ابنا الحجاج، فلم أصبحوا، …"
