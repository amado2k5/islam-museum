text: "… ما أبصرناه، وقاموا ينفضُون التراب عن رؤوسهم، وهم: أبو جهل، والحكمُ بنُ العاص، وعُقْبَةُ بن أبي مُعيط، والنَّضرُ بن الحارث، وأميَّةُ بن خلف، وزمعةٌ بن الأسود، وطُعيمة بن عدي، وأبو لهب، وأبيُّ بن خلف، ونبيه ومنبّه ابنا الحجاج، فلم أصبحوا، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 347، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
