label: { ar: "الموطأ، كتاب الأقضية", en: "Muwatta, Book of Judgements (aqdiya)", es: "Muwatta, Libro de los Juicios (aqdiya)", fr: "Muwatta, Livre des Jugements (aqdiya)", ur: "موطا، کتاب فیصل ⁦(اقدیہ)⁩", tr: "El-Muvatta, Hükümler Kitabı", id: "Al-Muwatta, Kitab Keputusan" }
summary:
  ar: "كتاب الأقضية، الكتاب الثاني والعشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 111 نصا (2103–2213) في واحد وأربعين بابا، من الصفحة 259 إلى الصفحة 307 من ملف PDF المجلد الثاني. يبدأ بالترغيب في القضاء بالحق والشهادات واليمين مع الشاهد، ثم الدعوى والرهن والكراء والاستهلاك والردة والنسب والمنبوذ، ويختم بالمرفق والقسم والضوال والصدقة عن الميت. {cite:muwatta-maruf-1997 p.259} {cite:muwatta-maruf-1997 p.307}"
  en: "The Book of Judgements (aqdiya), twenty-second book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 111 reports (2103–2213) in forty-one babs, PDF pp. 259–307 of volume 2. It opens with judging by the truth and the testimony of witnesses, judgement by oath with one witness, pledges, hire, damage, apostasy, paternity, found property, lost animals, and charity on behalf of the dead."
  es: "El Libro de los Juicios (aqdiya), vigésimo segundo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 111 informes (2103–2213) en cuarenta y un babs, PDF pp. 259–307 del volumen 2. Comienza con juzgar por la verdad y el testimonio de los testigos, juicio por juramento con un testigo, promesas, alquiler, daños, apostasía, paternidad, bienes encontrados, animales perdidos y caridad en nombre de los muertos."
  fr: "Le Livre des Jugements (aqdiya), vingt-deuxième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 111 rapports (2103–2213) en quarante et un babs, PDF pp. 259–307 du volume 2. Il s'ouvre sur le jugement par la vérité et le témoignage des témoins, le jugement par serment avec un témoin, les gages, le loyer, les dommages, l'apostasie, la paternité, les biens trouvés, les animaux perdus et la charité au nom des morts."
  ur: "کتاب قضاء ⁦(اقدیہ)⁩، یحییٰ بن یحییٰ کی تجدید میں موطا کی بائیسویں کتاب ⁦(معروف 1997)⁩، جلد 2 میں: 111 رپورٹس (2103-2213) اکتالیس باب میں، پی ڈی ایف صفحہ 259-30 کے ساتھ کھلی سچائی کے ساتھ۔ گواہوں کی گواہی، ایک گواہ کے ساتھ حلف کے ذریعے فیصلہ، عہد، کرایہ، نقصان، ارتداد، ولدیت، مل گئی جائیداد، گمشدہ جانور، اور مرنے والوں کی طرف سے صدقہ۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği, El-Muvatta'nın yirmi ikinci kitabı olan Hükümler Kitabı, Beşar Awad Maruf'un (1997) ikinci cildinde, kırk bir bölümde 111 metin (2103–2213) içermektedir; bu metin, ikinci cildin PDF dosyasının 259. sayfasından 307. sayfasına kadar uzanmaktadır. Kitap, adaletle, şahitlerle ve yeminlerle hüküm vermeye teşvikle başlar, ardından alacaklar, ipotekler, kiralar, tüketim, dinden dönme, soy ve gayrimeşru çocuk konularını ele alır ve haciz, yeminler, kayıp mal ve ölen kişi adına sadaka verme konularıyla sona erer. {cite:muwatta-maruf-1997 s.259} {cite:muwatta-maruf-1997 s.307}"
  id: "Kitab Penghakiman, kitab kedua puluh dua dari Al-Muwatta, sebagaimana diriwayatkan oleh Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 111 teks (2103–2213) dalam empat puluh satu bab, dari halaman 259 hingga halaman 307 dari file PDF Jilid Dua. Kitab ini dimulai dengan anjuran untuk menghakimi dengan adil, kesaksian, dan sumpah dengan saksi, kemudian membahas tentang klaim, hipotek, sewa, konsumsi, kemurtadan, garis keturunan, dan anak haram, dan diakhiri dengan masalah keterikatan, sumpah, harta yang hilang, dan sedekah atas nama orang yang meninggal. {cite:muwatta-maruf-1997 p.259} {cite:muwatta-maruf-1997 p.307}"
