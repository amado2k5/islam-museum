summary:
  ar: "كتاب الأقضية، الكتاب الثاني والعشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 111 نصا (2103–2213) في واحد وأربعين بابا، من الصفحة 259 إلى الصفحة 307 من ملف PDF المجلد الثاني. يبدأ بالترغيب في القضاء بالحق والشهادات واليمين مع الشاهد، ثم الدعوى والرهن والكراء والاستهلاك والردة والنسب والمنبوذ، ويختم بالمرفق والقسم والضوال والصدقة عن الميت. {cite:muwatta-maruf-1997 p.259} {cite:muwatta-maruf-1997 p.307}"
  en: "The Book of Judgements (aqdiya), twenty-second book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 111 reports (2103–2213) in forty-one babs, PDF pp. 259–307 of volume 2. It opens with judging by the truth and the testimony of witnesses, judgement by oath with one witness, pledges, hire, damage, apostasy, paternity, found property, lost animals, and charity on behalf of the dead."
