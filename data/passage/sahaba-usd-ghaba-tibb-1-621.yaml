text: "عَامرُ بَنُ مَالك بن جَعْفر أرسل إلى النبي عله يلتمس منه دواء أو شِفاء، فبعث إليه بعُكة عَسَل. كذا أخرجه ابن منده وأبو نعيم. قلت: الصحيح أن أبا براء لم يسلم، وقال المستغفري: لم يخرجه في الصحابة إلا خليفة بن …"
