text: "- الأصولُ العَشَرة: للشَّيخ نجم الدِّين الكُبْرَى. رسالة. -شَرَحها بعضُ مشايخ الرُّوم وسمّاه: عرائس الوُصول، أوَّلُه: الحمدُ الله الذي ستر وجوه عرائِس القِدَم... إلخ. - أصولُ القراءات: مُختصر، لشمسِ الدِّين محمد بنِ محمد ابن الجَزَرِيّ، المتوفَّى سنةً ثلاث وثلاثين وثمان …"
