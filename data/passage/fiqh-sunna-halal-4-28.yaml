text: "… الصحابة لما فتحوا بلاد العراق أكلوا من جبن المجوس، الار مل بالأفي أن من فياهم تعتير الابة اوقد وبت عن طعال الحلال ما أحله اللّه في كتابه، والحرام ما حرّم اللّه في كتابه، وما سكت عنه فهو مما عفا عنه. …"
