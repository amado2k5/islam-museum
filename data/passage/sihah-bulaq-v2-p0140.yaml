text: |-
  •⁦(باب الواء والباء)⁩.
  *⁦(بغى)⁩..
  ٤٤٧
  لذويراية وهوالشحم واللحم قال الشاعر
  على حتالبراية زمخرى السواء سد ظل فى شرى طوال
  والمبراة الحديدة التى يبرى بها السهام قال الشاعر* وأنت فى كفك المبراة والسفن * وبريت
  القلم بريا وبريت البعيرأيضا اذا حسرته وأذهبت لحمه والبرة حلقة من صف وتجعل فى لحم أنف
  البعبر وقال الاصمفى تجعل فى أحدباني المنخرين قال واذا كانت البرة من شعرفهى
  الخزامة قال أبو علىّ وأصل البرة بروة لانها جعت على برى مثل قرية وقرى وتجمع على برات
  وبرين وقد خششت الناقة وعرنتها وخزمتها وزممتها وخطمتها وأبريتها هذه وحدها بالالف
  اذا جعلت فى انقها البرة فهى ناقة مبراة قال الشاءر
  فقربت مبراة تخال ضلوعها *من الماسيخيات القدىّ الموترا
  وكل حلقة من سواروة رط وخلخال وما أشبههابرة وقال * وقعقعن الخلاخل والبرينا
  ( بزا بزاعليه يبزوأى تطاول والبازى واحد البزاة التى تصيد والبزوان بالتحريك الوئب
  وبزوان بالتسكيزاسم دجل وأخذت منسه بزوكذا أى عدله ونحوه والبزاخروج الصدر
  ودخول الظهر يقال رجل أبزى وامر أة بزواه وأبزى الرج-ل يبزى ابزاءاذارفع عجزه
  وتبازى مثله وأبزى فلان بفلان اذا غليه وقهره وهومبزبهذا الامى أى قوى عليه ضابطله
  طا ) الباطية اناه وأظنه معربا وهو الناجود قال الشاءر
  قربواعودا وباطية * فبذا أدركت ساجتيه
  ظا): بظالحه يبظوأى اكتنزويقال لمهخظابظا وأصله فعل عا البعو الجناية
  والجرم قال عوف بن الاحوص
  وابسالى بى بغيرجوم * بعوناه ولابدم مراق
  ⁦( بغى)⁩ البفى التعدى وبقى الرجل على الرجل استطال وبغت السماء اشتدّ مطرها حكاها
  ابو عبيد وبغى الجرح ورم وترامى الى فسادو بغى الوادى ظلم وكل مجاوزة فى الهدّوافراط على
  المقدار الذى هو حد الشئذهوبعى وبرى جرحه على بغى وهوأن يبرأ وفيه شئ من نغل
  والبغية الحاجة يقال لى فى بنى فلان بغية وبقية أى حاجة والبغية مثل الجلسة الحال التى
  نيغيها والبغية الحاجة نفسها عن الاصمعى وبغى ضالته وكذلاك كل طلبة بغاء بالضم والمدّ
  وبغاية أيضايق ال فرقو الهذه الابل بغيانا يضبون لها أى يتفرّقون فى طلبها وبغت المرأة بغاء
  بالمكسر والمذأى زنت فهى بفىّ والجمع بغايا وقوله تعالى وما كانت أمك بغيا مثل قواهم
  ملحفة جديد عن الاخفش وخرجت المرأة تسانى أى تزانى والامة يقسال لها بفىّ وججعها
  البغايا ولايراديد الشتم. وان سمين بذلك فى الاصل لفجورهنّ يقال قامت على رؤسهم
  البغايا قال طفيل
  فألوت يغاياهم بشارتباشرت • الى عرض جيش غير أن لم يكتب
  قوله ألوت أى أشارت بة ول ظنوا أنا عير فتياشروا بنا فلم يشعروا الابالغارة وقال الاعشى
  يهب الجلة الجراجر كالبتان تحنولد ردق أطفال
  والبغاياير كضن اكسية الاضريج والشرعى ذا الاذيال
