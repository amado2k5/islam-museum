text: |-
  ٨٠
  * ⁦(باب القاف)⁩
  سريعة جدّا وكذلك ظليم خيقق والحنفقيق الداهية يقال داهية خففقيق وهو أيضا الحفيفة
  من النساء الجريئة قال سيبويه والنون زائدة جعلها من خفق الريح قال الشاعر
  وقد طلقت ليلة كلها * فجاءت به مود ناخنفقيقا
  ويروى مؤتنا خقق انخة وق الاتان التى يصوّت حصاؤها وذلك عند الهزال وقدخق
  الفرج يخق خقيقا وكذلك قنب الفرس اذاصوّت وانحقخقة دوت القنب والفرج اذا
  ضوعف ويقال أخقت البكرة اذا اتسع خرقها ويقال الاخة وق لغة فى اللفقوق وفى الجديث
  فوقصت به ناقتسه فى أخاقيق جرذان وهى شة وق فى الارض ولا يعسرفه الاصعى الا باللام
  ويقال للغدير اذا حف وتقلع خق قال الراجز * كأنما يمشين فى خق يبس * (خلق
  انخلق التقدير يقال خلقت الاديم اذا قدرته قبل القطع ومنه قول زهير
  ولانت تخرى ما خلقت وبعثض القوم يخلق ثم لا يفرى
  وقال الجاج ماخلقت الافريت ولا وعدت الاوفيت والخليقة الطبيعة والجمع الخلائق
  قال لبيد
  فاقنع بماقسم المليك فاغما • قسم الخلاثق بيتناعلامها
  والخليقة الخلائق يقال هم خليقة اللّٰه وهم خلق اللّٰه أيضاوهو فى الاصل مصدر والخلقة
  بالكسر الفعارة ورجل خليق ومختلق أى تام الخلق معت-دل وأماقول ذى الرمة
  ومختلق للملك أبيض فدغم * أشمّ أيج العين كالمر البدر
  فائماعنى به أنه خلق خلقة تصلح للملك وفلان خليق بكذا أى جدير به وقد خلق لذلك بالضم كأنه
  عمن يقدرفيه ذلك وترى فيه مخايله وهذا مخلقة إذلك أى مجدرة له ونشأت لهم -محابة خلقة
  وخليقة أى فيها أثر المطر قال الشاعر
  لارعدت رعدة ولا برقت * لكنها أنشئْت لها خلقه
  ومضغة مخلقة أى تاقة انحلق والمخلق القدح اذالين وقال بصفه
  غلقته حتى اذاتمّ واستوى * كمغة ساق أوكمتن امام
  قرنت بحقويه ثلاثاذ- لم يزغ • عن القصد حتى بصرت بدمام
  وخلق الافك واختلقه ومخلقه أى اقتراه ومنه قوله تعالى وتخلقون افكاديقال هذه قصدة
  مخاوقة أى منحولة الى غير قائفها واخلق وانخلق السجمة يقال خالص المؤمن وخااق الفاجر
  وفلان يتخلق بغير خلقه أى يتمكافه قال الشاعر * انّ التخلق ياتى دونه الخلق* والخلاق
  النصيب يقال لاخلاقله فى الاخرة والاخلق الاملمس المصمت وصخرة خلقاء بنة الخلق أى
  ليس فيها وصم ولا كسر قال الاعشى
  قد يترك الدهر فى خلقاءراسية * وهيا وينزل منها الاعصم الصدعا
  ومنه قيل للمرأة الرتقاء خلقاء ومطحفة خلق وثوب خلق أى بال بستوى فيه المذكر والمؤنث
  لانه فى الاصل مصدر الاخلق وهو الاملس والجمع خلقان وملحفة خليق صغروه بلاها. لانه
  صفة والهاء لا تلحق تصغير الصفات كما قالوانصف فى تصغيرامر أة نصف وقد خلق الثوب بالضم
  خلوقة أى بلى وأخلق الثوب مثله واخلقته أنا يتعدّى ولا يتعدى وأخلقته ثو بااذا كسوته
  توبا
