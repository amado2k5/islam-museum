text: "هذا كتاب من محمد النبي لم بين المومنين والمسلمين من قريش ويثرب ومن تبعهم فلحق بهم وجاهد معهم، انهم امة واحدة من دون الناس، المهاجرون من قريش علي ربعتهم يتعاقلون بينهم، وهم يفدون عانيهم بالمعروف والقسط بين المومنين، وبنو عوف علي ربعتهم"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، في مراسلات أهل العراق، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hisham's Sirah, in the correspondence with the people of Iraq, from the extracted copy; quoted within forty words per the sources policy."
