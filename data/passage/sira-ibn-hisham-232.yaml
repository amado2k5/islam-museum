  fr: "Un extrait de la Sirah d'Ibn Hisham, dans la correspondance avec le peuple d'Irak, tiré de la copie extraite; cité en quarante mots conformément à la politique des sources."
  ur: "ابن ہشام کی سیرت سے ایک اقتباس، اہل عراق کے ساتھ خط و کتابت میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
