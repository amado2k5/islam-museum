text: "هذا كتاب من محمد النبي لم بين المومنين والمسلمين من قريش ويثرب ومن تبعهم فلحق بهم وجاهد معهم، انهم امة واحدة من دون الناس، المهاجرون من قريش علي ربعتهم يتعاقلون بينهم، وهم يفدون عانيهم بالمعروف والقسط بين المومنين، وبنو عوف علي ربعتهم"
