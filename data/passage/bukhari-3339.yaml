label:
  ar: "البخاري 3339 — هل بلغت؟ نوح وأمته يوم القيامة"
  en: "Bukhari 3339 — Did you convey? Nuh and his people on the Day of Resurrection"
  ur: "بخاری 3339 — کیا تم نے پہنچا دیا؟ قیامت کے دن نوح اور ان کی امت"
text: "يجيء نوح وأمته فيقول الله تعالى هل بلغت فيقول نعم، أى رب. فيقول لأمته هل بلغكم فيقولون لا، ما جاءنا من نبي. فيقول لنوح من يشهد لك فيقول محمد وأمته، فنشهد أنه قد بلغ، وهو قوله جل ذكره وكذلك جعلناكم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3339: هل بلغت؟ نوح وأمته يوم القيامة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3339: Did you convey? Nuh and his people on the Day of Resurrection. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3339: کیا تم نے پہنچا دیا؟ قیامت کے دن نوح اور ان کی امت۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
