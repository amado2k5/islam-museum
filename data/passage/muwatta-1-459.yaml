label: { ar: "الموطأ 459 — السنن الرواتب: ركعتان قبل الظهر وبعدها وبعد المغرب والعشاء", en: "Muwatta 459" }
text: "كان يصلي قبل الظهر ركعتين وبعدها ركعتين، وبعد المغرب ركعتين في بيته، وبعد صلاة العشاء ركعتين"
summary:
  ar: "أول حديث في باب العمل في جامع الصلاة. يرويه يحيى عن مالك عن نافع عن ابن عمر: كان النبي يصلي قبل الظهر ركعتين وبعدها ركعتين، وبعد المغرب ركعتين في بيته، وبعد العشاء ركعتين، وكان لا يصلي بعد الجمعة حتى ينصرف فيركع ركعتين. ويخرّجه المحقق عند البخاري (937) ومسلم (3/17) وأبي داود (1252) والنسائي وابن خزيمة والدارمي وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن يحيى لم يقل «في بيته» إلا في الركعتين بعد المغرب وتابعه القعنبي، وأن ابن بكير قالها في موضعين وابن وهب في ثلاثة مواضع (التمهيد 14/167). {cite:muwatta-maruf-1997 p.235} {cite:muwatta-maruf-1997 p.236}"
