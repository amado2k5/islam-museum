label: { ar: "الموطأ 459 — السنن الرواتب: ركعتان قبل الظهر وبعدها وبعد المغرب والعشاء", en: "Muwatta 459", es: "Muwatta 459", fr: "Muwatta 459", ur: "موطا 459", tr: "El-Muvatta 459 — Düzenli sünnet namazları: Öğle namazından önce ve sonra iki rekat, akşam ve yatsı namazlarından sonra iki rekat.", id: "Al-Muwatta 459 — Shalat Sunnah rutin: dua rakaat sebelum dan sesudah Dzuhur, dan sesudah Maghrib dan Isya." }
text: "كان يصلي قبل الظهر ركعتين وبعدها ركعتين، وبعد المغرب ركعتين في بيته، وبعد صلاة العشاء ركعتين"
summary:
  ar: "أول حديث في باب العمل في جامع الصلاة. يرويه يحيى عن مالك عن نافع عن ابن عمر: كان النبي يصلي قبل الظهر ركعتين وبعدها ركعتين، وبعد المغرب ركعتين في بيته، وبعد العشاء ركعتين، وكان لا يصلي بعد الجمعة حتى ينصرف فيركع ركعتين. ويخرّجه المحقق عند البخاري (937) ومسلم (3/17) وأبي داود (1252) والنسائي وابن خزيمة والدارمي وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن يحيى لم يقل «في بيته» إلا في الركعتين بعد المغرب وتابعه القعنبي، وأن ابن بكير قالها في موضعين وابن وهب في ثلاثة مواضع ⁦(التمهيد 14/167)⁩. {cite:muwatta-maruf-1997 p.235} {cite:muwatta-maruf-1997 p.236}"
  id: "Hadits pertama dalam bab ini tentang praktik shalat berjamaah. Diriwayatkan oleh Yahya dari Malik, dari Nafi’, dari Ibnu Umar: Nabi (shalawat dan salam kepadanya) biasa shalat dua rakaat sebelum Dzuhur dan dua rakaat sesudahnya, dua rakaat sesudah Maghrib di rumahnya, dan dua rakaat sesudah Isya. Beliau tidak shalat setelah Jumat sampai beliau selesai shalat Jumat dan kemudian shalat dua rakaat. Hadits ini terdapat dalam kumpulan hadits al-Bukhari (937), Muslim (3/17), Abu Dawud (1252), al-Nasa’i, Ibnu Khuzaymah, al-Darimi, dan Ahmad, melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa Yahya hanya menyebutkan “di rumahnya” dalam kaitannya dengan dua rakaat setelah Maghrib, dan al-Qa’nabi mengikutinya dalam hal ini. Ibnu Bukayr menyebutkannya dalam dua kesempatan, dan Ibnu Wahb dalam tiga kesempatan (al-Tamhid 14/167). {cite:muwatta-maruf-1997 p.235} {cite:muwatta-maruf-1997 p.236}"
