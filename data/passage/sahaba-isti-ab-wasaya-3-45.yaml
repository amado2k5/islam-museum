text: "… بَين العمودين من بني عبد الأَشْهلِ حتى وضعه بالبقيع، وصَلَّى عليه. وأوصى إِلى عمر بن الخطاب، فنظر عمر في وصيته، فوجَدَ عليه أربعة آلاف دينار ديناً، فباع نخله أربع سنين بأربعة آلاف، وقضى دَيْنه. وقيل : إِنَّه حمل نعشَه بنفسِه …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 45، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 45, that mentions a testament or parting counsel, what was left behind: estate and inheritance, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
