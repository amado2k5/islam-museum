text: "… بَين العمودين من بني عبد الأَشْهلِ حتى وضعه بالبقيع، وصَلَّى عليه. وأوصى إِلى عمر بن الخطاب، فنظر عمر في وصيته، فوجَدَ عليه أربعة آلاف دينار ديناً، فباع نخله أربع سنين بأربعة آلاف، وقضى دَيْنه. وقيل : إِنَّه حمل نعشَه بنفسِه …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 45، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 45, that mentions a testament or parting counsel, what was left behind: estate and inheritance, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 45 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 3, pág. 45, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab (tome 3, p. 45), mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés, et un lieu de sépulture. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Navigateur des Testaments."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 3. cildinin 45. sayfasından bir alıntı, vasiyetname veya son vasiyet, mal varlığı ve miras, defin, mezar ve türbeden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid bergambar 3, halaman 45, menyebutkan surat wasiat atau testamen terakhir, harta warisan dan harta pusaka, pemakaman, kuburan, dan makam; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Tombs Browser."
