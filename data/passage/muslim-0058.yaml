text: "قال عبد الله بن عمرو: قال رسول الله: أربع من كن فيه كان منافقاً خالصاً، ومن كانت فيه خلة منهن كانت فيه خلة من نفاق حتى يدعها: إذا حدث كذب، وإذا عاهد غدر، وإذا وعد أخلف، وإذا خاصم فجر"
