text: "… شُعبة، أو بضع وسبعون شعبة، أفضلها : قول: لا إله إلَّا الله، وأدناها : إماطة الأذى عن الطريق، والحياءُ شعبةٌ من الإيمان. - حدثنا أبو العباس عبد الله بن عبدالرحمن العسكري، قال: نا أبو إسماعيل الترمذي، قال: نا ابن أبي …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 4، ص 387، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 4, p. 387, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 4، ص 387 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra de Ibn Batta, el Libro de la Fe, volumen 4, pág. 387, que menciona las ramas de la fe, la fe como setenta y tantos ramas; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 4, page 387, mentionnant les branches de la foi, la foi étant définie comme une soixantaine de branches. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 4, s. 387) adlı eserinden, yetmişi aşkın iman dalını anlatan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle özetlenmiştir. İslam'ın temelleri, imanın esasları, iman dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 4 Bergambar, hlm. 387, yang menyebutkan cabang-cabang keimanan, yang jumlahnya lebih dari tujuh puluh. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun keimanan, cabang-cabang keimanan, dan karakteristik seorang mukmin."
