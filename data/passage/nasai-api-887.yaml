label: { ar: "سنن النسائي 887 — الأب والأبوة", en: "Sunan al-Nasa'i 887 — the father and fatherhood", ur: "سنن نسائی 887 — باپ اور والدیت", es: "Sunan al-Nasa'i 887 — El padre y la paternidad" }
text: "أَخْبَرَنَا سُوَيْدُ بْنُ نَصْرٍ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ، عَنْ مُوسَى بْنِ عُمَيْرٍ الْعَنْبَرِيِّ، وَقَيْسِ بْنِ سُلَيْمٍ الْعَنْبَرِيِّ، قَالاَ حَدَّثَنَا عَلْقَمَةُ بْنُ وَائِلٍ، عَنْ أَبِيهِ، قَالَ رَأَيْتُ رَسُولَ اللَّهِ إِذَا كَانَ قَائِمًا فِي الصَّلاَةِ قَبَضَ بِيَمِينِهِ عَلَى شِمَالِهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 887، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 887 (The Book of the Commencement of the Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 887، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.° 887 (El Libro del Inicio de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
