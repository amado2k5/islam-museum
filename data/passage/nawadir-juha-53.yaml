text: "… عندما كنت حياً خرج يَوْماً لِيحْتَطِبَ، فصعِدَ شجرة ليقطع غصناً منها فوقف على الجانب الذي يقطعه، فقال له أحدهم: يا رجلُ ماذا تصنع؟ الآن تقع. فلم يُعِزْهُ أُذُناً صاغيةً. ولما انتهى من قطع الغصن سقط به على الأرض وارتضَّ جسمُهُ، …"
summary:
  ar: "صعد جحا شجرة ليقطع غصنًا وكان رجل يحذره، فسقط وقال إن الرجل لا بد أن يكون عرّافًا، فقال له الرجل إن نهيق الحمار يعني أن نصف عمره قد ذهب. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  en: "Juha climbs a tree to cut a branch while a man warns him; Juha falls and says the man must be a seer; the man tells him that the donkey's braying means half his life is gone. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  ur: "جحا ایک شاخ کاٹنے کے لیے درخت پر چڑھا جبکہ ایک آدمی اسے خبردار کر رہا تھا؛ وہ گر پڑا اور کہنے لگا کہ یہ آدمی ضرور غیب جاننے والا ہے؛ آدمی نے اسے بتایا کہ گدھے کے ڈھینچوں کرنے کا مطلب ہے کہ اس کی آدھی عمر گزر گئی۔ {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  fr: "Juha grimpe dans un arbre pour couper une branche tandis qu'un homme l'avertit ; il tombe et dit que l'homme doit être un devin ; l'homme lui dit que le braiement de l'âne signifie que la moitié de sa vie est passée. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  es: "Juha trepa a un árbol para cortar una rama mientras un hombre le advierte; cae y dice que el hombre debe de ser un adivino; el hombre le dice que el rebuzno del burro significa que la mitad de su vida se ha ido. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
