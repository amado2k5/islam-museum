label: { ar: "الموطأ 1963 — يحيى عن مالك عن أبي الزناد عن بسر بن سعيد عن عبيد أبي صالح مولى السفاح: باع بزا لأهل دار نخلة إلى أجل، فعرضوا أن يضع عنهم بعض الثمن وينقدوه، فسأل زيد بن ثابت فقال: لا آمرك أن تأكل هذا ولا توكله", en: "Muwatta 1963", es: "Muwatta 1963", fr: "Muwatta 1963", ur: "موطا 1963", tr: "El-Muvatta 1963 — Yahya, Malik'ten, o da Ebu el-Zinad'dan, o da Busr ibn Sa'id'den, o da Saffa'nın azatlı kölesi Ubeyd Ebu Salih'ten rivayet eder: Dar Nakhlah halkına veresiye kumaş sattı ve onlar da fiyatı düşürüp nakit ödemeyi teklif ettiler. Bunun üzerine Zeyd ibn Sabit'e sordu, o da şöyle dedi: Bunu ne yemeni ne de başkasına vermeni emretmiyorum.", id: "Al-Muwatta 1963 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Abu al-Zinad, berdasarkan riwayat Busr ibn Sa’id, berdasarkan riwayat Ubayd Abi Salih, budak yang dibebaskan dari al-Saffah: Dia menjual kain kepada penduduk Dar Nakhlah secara kredit, dan mereka menawarkan untuk menurunkan harganya dan membayarnya secara tunai. Maka dia bertanya kepada Zayd ibn Thabit, yang berkata: Aku tidak memerintahkanmu untuk memakan ini atau memberikannya kepada orang lain." }
summary:
  ar: "يروي يحيى عن مالك عن أبي الزناد عن بسر بن سعيد عن عبيد أبي صالح مولى السفاح أنه قال: بعت بزا لي من أهل دار نخلة إلى أجل، ثم أردت الخروج إلى الكوفة، فعرضوا علي أن أضع عنهم بعض الثمن، وينقدوني. فسألت عن ذلك زيد بن ثابت، فقال: لا آمرك أن تأكل هذا ولا توكله. {cite:muwatta-maruf-1997 p.204}"
  tr: "Yahya, Malik'ten, o da Ebu el-Zinad'dan, o da Busr ibn Sa'id'den, o da Saffa'nın azatlı kölesi Ubeyd Ebu Salih'ten rivayet eder ki, şöyle dedi: \"Dar Nakhla halkına bazı mallarımı kredili olarak sattım, sonra Kufa'ya gitmek istedim ve onlar da fiyatı düşürürsem tamamını ödeyebileceğimi söylediler. Bunun üzerine Zeyd ibn Sabit'e sordum ve o da şöyle dedi: 'Bunu yemeni de, başkasına vermeni de söylemiyorum.'\" {cite:muwatta-maruf-1997 s.204}"
  id: "Yahya meriwayatkan dari Malik, dari Abu al-Zinad, dari Busr ibn Sa'id, dari Ubayd Abi Salih, budak yang dibebaskan dari al-Saffah, bahwa ia berkata: Saya menjual beberapa barang milik saya kepada penduduk Dar Nakhla secara kredit, kemudian saya ingin pergi ke Kufa, dan mereka menawarkan untuk membayar lunas jika saya menurunkan harganya. Maka saya bertanya kepada Zayd ibn Thabit tentang hal ini, dan dia berkata: Saya tidak menyuruhmu untuk memakannya, atau memberikannya kepada orang lain. {cite:muwatta-maruf-1997 p.204}"
