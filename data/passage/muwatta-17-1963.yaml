label: { ar: "الموطأ 1963 — يحيى عن مالك عن أبي الزناد عن بسر بن سعيد عن عبيد أبي صالح مولى السفاح: باع بزا لأهل دار نخلة إلى أجل، فعرضوا أن يضع عنهم بعض الثمن وينقدوه، فسأل زيد بن ثابت فقال: لا آمرك أن تأكل هذا ولا توكله", en: "Muwatta 1963" }
summary:
  ar: "يروي يحيى عن مالك عن أبي الزناد عن بسر بن سعيد عن عبيد أبي صالح مولى السفاح أنه قال: بعت بزا لي من أهل دار نخلة إلى أجل، ثم أردت الخروج إلى الكوفة، فعرضوا علي أن أضع عنهم بعض الثمن، وينقدوني. فسألت عن ذلك زيد بن ثابت، فقال: لا آمرك أن تأكل هذا ولا توكله. {cite:muwatta-maruf-1997 p.204}"
