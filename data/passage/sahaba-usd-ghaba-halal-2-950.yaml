  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 2, p. 950), mentionnant ce qui est licite, ce qui est devenu illicite et les bonnes choses; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié par le Halal and Haram Browser."
