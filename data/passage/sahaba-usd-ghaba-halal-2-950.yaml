text: "… آذن لك ولا كرامة ولا نَعَمة عين، كذبت يا عدوّ الله! ثم إِن فراساً هَمَّ بالخروج على عِلي بنِ أَبي طالب لقد رزقك اللّٰه حلالاً طيباً، فاخترت ما حرّم اللّٰه عليك، مع أهل حَرُوراء، فأَخذه أَبوه فأَوثقه وحبسه حتى أَحدث …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 950، يذكر الحلال، وما حُرّم، والطيبات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 950, that mentions the lawful, what was made unlawful, the good things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 950 کا اقتباس جس میں حلال، جو حرام کیا گیا، پاکیزہ چیزیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
