label: { ar: "الموطأ 1454 — مالك: ميراث الإخوة للأب كميراث الإخوة للأب والأم إذا لم يكن معهم أحد من بني الأب والأم، إلا في الفريضة المشتركة", en: "Muwatta 1454", es: "Muwatta 1454", fr: "Muwatta 1454", ur: "موطا 1454", tr: "El-Muvatta 1454 — Malik: Baba tarafından erkek kardeşlerin mirasları, aynı anne ve babadan başka çocukları yoksa, ortak miras halleri hariç, öz kardeşlerin mirasları gibidir.", id: "Al-Muwatta 1454 — Malik: Warisan saudara laki-laki dari pihak ayah sama seperti warisan saudara kandung jika tidak ada anak lain dari ayah dan ibu yang sama dengan mereka, kecuali dalam hal warisan bersama." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن ميراث الإخوة للأب، إذا لم يكن معهم أحد من بني الأب والأم، كمنزلة الإخوة للأب والأم سواء، ذكرهم كذكرهم وأنثاهم كأنثاهم، إلا أنهم لا يشركون مع بني الأم في الفريضة التي شركهم فيها بنو الأب والأم، لأنهم خرجوا من ولادة الأم التي جمعت أولئك. فإن اجتمع الإخوة للأب والأم والإخوة للأب، فكان في بني الأب والأم ذكر، فلا ميراث لأحد من بني الأب. وإن لم يكن بنو الأب والأم إلا امرأة واحدة أو أكثر من الإناث لا ذكر معهن، فيفرض للأخت الواحدة النصف، ويفرض للأخوات للأب السدس تتمة الثلثين. {cite:muwatta-maruf-1997 p.10}"
  tr: "Malik, aralarındaki yerleşik uygulamanın, eğer öz erkek kardeş yoksa, baba tarafından erkek kardeşlerin miras payının, erkek ve kız fark etmeksizin öz erkek kardeşlerin miras payına eşit olması olduğunu belirtir. Ancak, aynı anneden geldikleri için, anne tarafından erkek kardeşlerle belirlenen paylardan pay almazlar. Eğer öz erkek kardeşler ve baba tarafından erkek kardeşler varsa ve öz erkek kardeşler arasında bir erkek varsa, baba tarafından erkek kardeşlerden hiçbiri miras almaz. Eğer tek öz erkek kardeşler bir veya daha fazla kız ise ve hiç erkek yoksa, tek kız kardeş mirasın yarısını alır ve baba tarafından kız kardeşler de üçte iki payı tamamlamak için altıda birini alır. {cite:muwatta-maruf-1997 s.10}"
  id: "Malik menyatakan bahwa praktik yang berlaku di antara mereka adalah bahwa warisan saudara laki-laki dari pihak ayah, jika tidak ada saudara laki-laki kandung, sama dengan warisan saudara laki-laki kandung lainnya, baik laki-laki maupun perempuan. Namun, mereka tidak berbagi warisan dengan saudara laki-laki dari pihak ibu sesuai dengan bagian yang telah ditentukan, karena mereka berasal dari ibu yang sama. Jika ada saudara laki-laki kandung dan saudara laki-laki dari pihak ayah, dan ada laki-laki di antara saudara laki-laki kandung tersebut, maka tidak ada saudara laki-laki kandung yang berhak mewarisi. Jika satu-satunya saudara laki-laki kandung adalah satu atau lebih perempuan tanpa laki-laki, maka saudara perempuan tunggal tersebut menerima setengah bagian, dan saudara perempuan kandung lainnya menerima seperenam bagian untuk melengkapi bagian dua pertiga. {cite:muwatta-maruf-1997 p.10}"
