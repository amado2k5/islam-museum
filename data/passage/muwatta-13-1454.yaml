label: { ar: "الموطأ 1454 — مالك: ميراث الإخوة للأب كميراث الإخوة للأب والأم إذا لم يكن معهم أحد من بني الأب والأم، إلا في الفريضة المشتركة", en: "Muwatta 1454" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن ميراث الإخوة للأب، إذا لم يكن معهم أحد من بني الأب والأم، كمنزلة الإخوة للأب والأم سواء، ذكرهم كذكرهم وأنثاهم كأنثاهم، إلا أنهم لا يشركون مع بني الأم في الفريضة التي شركهم فيها بنو الأب والأم، لأنهم خرجوا من ولادة الأم التي جمعت أولئك. فإن اجتمع الإخوة للأب والأم والإخوة للأب، فكان في بني الأب والأم ذكر، فلا ميراث لأحد من بني الأب. وإن لم يكن بنو الأب والأم إلا امرأة واحدة أو أكثر من الإناث لا ذكر معهن، فيفرض للأخت الواحدة النصف، ويفرض للأخوات للأب السدس تتمة الثلثين. {cite:muwatta-maruf-1997 p.10}"
