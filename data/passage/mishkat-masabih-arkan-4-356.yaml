text: "… شعب الإيمان. - وعن بريدة، قال: قال رسول اللّٰه : المؤمن يموت بعرق الجبين. ضعيف: ضعيف الترغيب والترهيب. هاذم: أي قاطع. حسن صحيح: الترمذي والنسائي وابن ماجه. صحيح الترغيب. البلى: من بلي الشيء إذا صار خلقاً متفتتاً. حسن لغيره: الترمذي. …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 4، ص 356، يذكر شعب الإيمان، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 4, p. 356, that mentions the branches of faith, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 4، ص 356 کا اقتباس جس میں ایمان کی شاخیں، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 4, pág. 356, que menciona las ramas de la fe y describe al creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 4, page 356, mentionnant les piliers de la foi et une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 4, sayfa 356'dan, inancın dallarını ve müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Mishkat al-Masabih, Jilid Bergambar 4, halaman 356, yang menyebutkan cabang-cabang iman dan menggambarkan seorang mukmin; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus dalam rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
