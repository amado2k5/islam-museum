text: "… الآخر غانم أنه أعتقه في مرض موته... إن خلف المريض ابنين،...، فشهد أنه أعتق سالما فى مرض موته، وشهد أجنبيان أنه أعتق إن شهد عدلان أجنبيان، أنه وصى بعتق سالم، وشهد عدلان وارثان أنه رجع عن الوصية بعتق إن ادعى …"
