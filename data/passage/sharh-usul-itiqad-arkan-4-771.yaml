text: "… بن سعيد قال : نا أبو عامر العقدي قال: ناسليمان بن بلال، عن عبد اللَّه بن دينار، عن أبي صالح: عن أبي هريرة، عن النبي علَيّ : الإيمان بضع وسبعون شعبة، والحياء شعبة من الإيمان. أخرجه مسلم عن عبيد اللَّه. …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 771، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 4, p. 771, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
