label: { ar: "الموطأ 1339 — يحيى بن سعيد: رغب النبي في الجهاد وذكر الجنة، فرمى رجل من الأنصار تمرات كان يأكلها وقاتل حتى قتل", en: "Muwatta 1339" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رسول الله رغب في الجهاد وذكر الجنة، ورجل من الأنصار يأكل تمرات في يده، فقال إني لحريص على الدنيا إن جلست حتى أفرغ منهن. فرمى ما في يده، وحمل بسيفه فقاتل حتى قتل. ويذكر المحقق أن الحديث موصول معروف من حديث جابر بن عبد الله في الصحيحين. {cite:muwatta-maruf-1997 p.599}"
