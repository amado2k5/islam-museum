label:
  ar: "صحيح البخاري، كتاب المغازى"
  en: "Sahih al-Bukhari, Book 64: Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)"
  ur: "صحیح بخاری، کتاب المغازیٰ"
  es: "Sahih al-Bukhari, Libro 64: Expediciones militares dirigidas por el Profeta (Al-Maghaazi)"
  fr: "Sahih al-Bukhari, Livre 64: Expéditions militaires menées par le Prophète (Al-Maghaazi)"
summary:
  ar: "القسم 64 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المغازى»، ويضم فيها النصوص من 3949 إلى 4473 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 64 of Sahih al-Bukhari (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)) in the division of the open hadith dataset the museum took its reports from: reports 3949 to 4473 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 64، عنوان «کتاب المغازیٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3949 تا 4473۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 64 de Sahih al-Bukhari (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3949 al 4473, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 64 du Sahih al-Bukhari (Expéditions militaires menées par le Prophète (Al-Maghaazi)), soit les hadiths 3949 à 4473 de la numérotation de ce recueil. Le musée classe ses archives relatives à ces hadiths dans ce livre; les éditions imprimées classent et numérotent la collection différemment."
