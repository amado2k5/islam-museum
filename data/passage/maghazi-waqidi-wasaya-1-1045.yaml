text: "… فلمّا تُوفَّى رسول اللّٰه، كان عمر بن الخطَّاب فى خلافته إذا مات رجلٌ ممَّن يظنُّ أنَّه من أُولئك الرهط. أخذ بيد حُدَيفة فقاده إلى الصلاة عليه فإن مشى معه حُدَيفة صلَّى عليه عمر، وإن انتزع يده وأَبى أَن يمشى انصرف …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 1045، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 1045, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 1045 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
