  fr: "Extrait du Maghazi d'al-Waqidi, volume 1, page 1045, mentionnant un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "El-Vakidi'nin Maghazi adlı eserinin Resimli Cilt 1, s. 1045'teki bir alıntısında ölüm ve vefat zamanı, defin, mezar ve istirahat yeri konularına değinilmektedir; bu metin, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
