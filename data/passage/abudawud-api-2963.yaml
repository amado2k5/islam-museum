label: { ar: "سنن أبي داود 2963 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 2963 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 2963 — ترکہ اور میراث", es: "Sunan Abi Dawud 2963 — lo que dejó: patrimonio y herencia", fr: "Sunan Abi Dawud 2963 — Ce qui a été laissé derrière: biens et héritage" }
text: "… عَلَى أُولَئِكَ الرَّهْطِ فَقَالَ أَنْشُدُكُمْ بِاللَّهِ الَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ هَلْ تَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". قَالُوا نَعَمْ. ثُمَّ أَقْبَلَ عَلَى عَلِيٍّ وَالْعَبَّاسِما فَقَالَ أَنْشُدُكُمَا بِاللَّهِ الَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ هَلْ تَعْلَمَانِ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". فَقَالاَ نَعَمْ. قَالَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2963، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2963 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2963، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 2963 (Tributo, Botín y Gobierno (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona lo que quedó: propiedades y herencias. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2963 (Tribut, Butin et Souveraineté (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
