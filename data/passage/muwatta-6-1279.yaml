label: { ar: "الموطأ 1279 — مالك: لا يحتش الرجل لدابته من الحرم", en: "Muwatta 1279", es: "Muwatta 1279", fr: "Muwatta 1279", ur: "موطا 1279", tr: "Al-Muwatta 1279 — Malik: Bir kimse hayvanı için yemi koruma alanından toplamamalıdır.", id: "Al-Muwatta 1279 — Malik: Seorang pria tidak boleh mengambil pakan untuk hewannya dari tempat suci." }
summary:
  ar: "سئل مالك هل يحتش الرجل لدابته من الحرم، فقال لا. ويذكر المحقق أنه لعله قال ذلك لقول النبي إن شجر الحرم لا يعضد، ولا يختلى خلاه. {cite:muwatta-maruf-1997 p.568}"
  tr: "Malik'e, bir adamın kutsal alan içinde hayvanı için ağaç kesip kesemeyeceği sorulmuş ve o da hayır cevabını vermiştir. Araştırmacı, bunun Peygamber'in kutsal alanın ağaçlarının ve bitki örtüsünün kesilmemesi gerektiği yönündeki sözünden kaynaklanmış olabileceğini belirtmektedir. {cite:muwatta-maruf-1997 s.568}"
  id: "Malik ditanya apakah seorang pria boleh menebang pohon untuk hewannya di dalam tempat suci, dan dia menjawab tidak. Peneliti menyebutkan bahwa dia mungkin mengatakan demikian karena sabda Nabi bahwa pohon-pohon di tempat suci tidak boleh ditebang, dan vegetasinya pun tidak boleh dipotong. {cite:muwatta-maruf-1997 p.568}"
