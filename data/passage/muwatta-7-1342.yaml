label: { ar: "الموطأ 1342 — نافع عن ابن عمر: سابق رسول الله بين الخيل المضمرة من الحفياء، وغير المضمرة من التنية إلى مسجد بني زريق", en: "Muwatta 1342" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله سابق بين الخيل التي قد أضمرت من الحفياء، وكان أمدها ثنية الوداع، وسابق بين الخيل التي لم تضمر من التنية إلى مسجد بني زريق، وأن عبد الله بن عمر كان ممن سابق بها. ويذكر المحقق أن الحفياء وثنية الوداع موضعان قرب المدينة. {cite:muwatta-maruf-1997 p.600}"
