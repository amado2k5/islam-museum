label: { ar: "الموطأ 1342 — نافع عن ابن عمر: سابق رسول الله بين الخيل المضمرة من الحفياء، وغير المضمرة من التنية إلى مسجد بني زريق", en: "Muwatta 1342", es: "Muwatta 1342", fr: "Muwatta 1342", ur: "موطا 1342", tr: "El-Muvatta 1342 — İbn Ömer'den rivayetle Nafi': Allah'ın Resulü, El-Hafya'dan eğitilmiş atlarla El-Taniye'den eğitilmemiş atlar arasında Beni Zurayq mescidine kadar bir at yarışı düzenledi.", id: "Al-Muwatta 1342 — Nafi’ berdasarkan riwayat Ibn Umar: Rasulullah SAW mengadakan perlombaan kuda antara kuda terlatih dari Al-Hafya’ dan kuda tidak terlatih dari Al-Taniyah menuju masjid Bani Zurayq." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله سابق بين الخيل التي قد أضمرت من الحفياء، وكان أمدها ثنية الوداع، وسابق بين الخيل التي لم تضمر من التنية إلى مسجد بني زريق، وأن عبد الله بن عمر كان ممن سابق بها. ويذكر المحقق أن الحفياء وثنية الوداع موضعان قرب المدينة. {cite:muwatta-maruf-1997 p.600}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa Rasulullah shalla Allahu alaihi wa sallam mengadakan perlombaan kuda antara kuda-kuda yang telah dilatih dan dibimbing, dimulai dari al-Hafya’, dengan garis finis di Thaniyat al-Wada’, dan beliau juga mengadakan perlombaan antara kuda-kuda yang belum dilatih, dimulai dari Thaniyat al-Wada’ dan berakhir di masjid Banu Zurayq. Abdullah ibn Umar termasuk di antara mereka yang ikut serta dalam perlombaan tersebut. Peneliti mencatat bahwa al-Hafya’ dan Thaniyat al-Wada’ adalah dua tempat yang dekat dengan Madinah. {cite:muwatta-maruf-1997 p.600}"
