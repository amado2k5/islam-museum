text: "ث كنا نضعه . رواه أبو داود ، وابن ماجه . وعن طاوس قال : كان في كتاب معاذ : من خرج من مخلاف إلى إلى مخلاف ، فإن صدقته وعشره في مخلاف عشيرته . رواه الأثرم في سننه ."
