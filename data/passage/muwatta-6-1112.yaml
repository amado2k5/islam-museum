label: { ar: "الموطأ 1112 — ابن عمر: إذا أهدى هدياً من المدينة قلده وأشعره بذي الحليفة، يقلده قبل أن يشعره، فيقلده بنعلين ويشعره من الشق الأيسر، ثم يساق معه حتى يوقف به مع الناس بعرفة", en: "Muwatta 1112", es: "Muwatta 1112", fr: "Muwatta 1112", ur: "موطا 1112", tr: "El-Muvatta 1112 — İbn Ömer: Eğer Medine'den kurbanlık hayvan getirirse, onu Zül-Huleyfe'de işaretlemeli ve damgalamalıdır. Damgalamadan önce, iki sandaletle işaretleyip sol tarafına damgalamalıdır. Sonra onu Arafat'taki halkın arasına gelene kadar götürmelidir.", id: "Al-Muwatta 1112 — Ibn Umar: Jika ia mempersembahkan hewan kurban dari Madinah, ia harus menandainya dan memberi cap pada hewan tersebut di Dzul Hulayfah. Ia harus menandainya sebelum memberi cap, dengan menandainya menggunakan dua sandal dan memberi cap di sisi kiri. Kemudian ia harus menggiringnya hingga sampai di Arafat bersama orang-orang." }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر أنه كان إذا أهدى هدياً من المدينة قلده وأشعره بذي الحليفة، يقلده قبل أن يشعره، وذلك في مكان واحد وهو موجه للقبلة. يقلده بنعلين ويشعره من الشق الأيسر، ثم يساق معه حتى يوقف به مع الناس بعرفة، ثم يدفع به معهم إذا دفعوا، فإذا قدم منى غداة النحر نحره قبل أن يحلق أو يقصر، وكان هو ينحر هديه بيده، يصفهن قياماً ويوجههن إلى القبلة، ثم يأكل ويطعم. ويذكر المحقق أن البخاري علّقه عن ابن عمر. {cite:muwatta-maruf-1997 p.510}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Medine'den kurbanlık hayvan gönderdiğinde, Zül-Huleyfe'de onu işaretler ve çelenk takardı; çelenk takmadan önce, hayvan kıbleye dönükken tek bir yerde işaretlerdi. İki sandaletle işaretler ve sol tarafına çelenk takar, sonra Arafat'ta halkın arasına karışana kadar onu yanında götürürdü. Sonra halk hareket ettiğinde o da hayvanla birlikte ilerlerdi. Kurban Bayramı sabahı Mina'ya vardığında, saçını tıraş etmeden veya kısaltmadan önce kurbanı keserdi. Kurbanı kendi eliyle keser, kıbleye dönük olarak ayakta durup etleri düzenler, sonra yer ve başkalarına da yedirirdi. Araştırmacı, Buhari'nin bunu İbn Umar'dan rivayet ederek Kutsal Kitabına dahil ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.510}"
  id: "Malik meriwayatkannya dari Nafi’ yang juga dari Abdullah ibn Umar, bahwa ketika ia mengirim hewan kurban dari Madinah, ia akan menandai dan mengalungkannya di Dzul Hulayfah, menandainya sebelum mengalungkannya, semuanya di satu tempat sambil menghadap kiblat. Ia akan menandainya dengan dua sandal dan mengalungkannya di sisi kiri, kemudian membawanya bersamanya sampai ia berdiri bersama orang-orang di Arafat. Kemudian ia akan melanjutkan perjalanannya bersama mereka. Ketika ia tiba di Mina pada pagi hari Idul Adha, ia akan menyembelihnya sebelum mencukur atau memangkas rambutnya. Ia akan menyembelih hewan kurbannya dengan tangannya sendiri, menatanya sambil berdiri dan menghadap kiblat, kemudian ia akan memakannya dan memberi makan orang lain. Peneliti menyebutkan bahwa al-Bukhari memasukkannya dalam Kitab Suci-nya dari Ibn Umar. {cite:muwatta-maruf-1997 p.510}"
