label: { ar: "الموطأ 1112 — ابن عمر: إذا أهدى هدياً من المدينة قلده وأشعره بذي الحليفة، يقلده قبل أن يشعره، فيقلده بنعلين ويشعره من الشق الأيسر، ثم يساق معه حتى يوقف به مع الناس بعرفة", en: "Muwatta 1112" }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر أنه كان إذا أهدى هدياً من المدينة قلده وأشعره بذي الحليفة، يقلده قبل أن يشعره، وذلك في مكان واحد وهو موجه للقبلة. يقلده بنعلين ويشعره من الشق الأيسر، ثم يساق معه حتى يوقف به مع الناس بعرفة، ثم يدفع به معهم إذا دفعوا، فإذا قدم منى غداة النحر نحره قبل أن يحلق أو يقصر، وكان هو ينحر هديه بيده، يصفهن قياماً ويوجههن إلى القبلة، ثم يأكل ويطعم. ويذكر المحقق أن البخاري علّقه عن ابن عمر. {cite:muwatta-maruf-1997 p.510}"
