text: "… الله. والثاني: أن الذكرَ نفسَهُ من خصال الإيمان، فيزدادُ الإيمانُ بكثرة الذكرِ؛ فإن جمهورَ أهلِ السنةِ على أن الطاعاتِ كلَّهَا من الإيمانِ فرضَهَا ونفلَهَا ؛ وإنما أخرجَ النوافلَ من الإيمانِ قليلٌ منهم. قَالَ البُخَارِيُّ: وَقَالَ ابْنُ مَسْعُود: الْيَقِينُ: الإيمَانُ كُلُّهُ. …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 14، يذكر ما عُدّ من الإيمان، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 14, that mentions what is counted as part of faith, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 14 کا اقتباس جس میں جو ایمان میں سے گنا گیا، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
