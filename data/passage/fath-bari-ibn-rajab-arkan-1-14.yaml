text: "… الله. والثاني: أن الذكرَ نفسَهُ من خصال الإيمان، فيزدادُ الإيمانُ بكثرة الذكرِ؛ فإن جمهورَ أهلِ السنةِ على أن الطاعاتِ كلَّهَا من الإيمانِ فرضَهَا ونفلَهَا ؛ وإنما أخرجَ النوافلَ من الإيمانِ قليلٌ منهم. قَالَ البُخَارِيُّ: وَقَالَ ابْنُ مَسْعُود: الْيَقِينُ: الإيمَانُ كُلُّهُ. …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 14، يذكر ما عُدّ من الإيمان، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 14, that mentions what is counted as part of faith, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 14 کا اقتباس جس میں جو ایمان میں سے گنا گیا، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 14, que menciona lo que se considera parte de la fe, los rasgos del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 1, p. 14) mentionnant les éléments de la foi et les qualités du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. cildinin 14. sayfasından, imanın ne olduğunu ve müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 1, halaman 14, yang menyebutkan apa yang membentuk iman dan ciri-ciri seorang mukmin; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin."
