text: "… الحَافِظُ، حَدَّثَنَا أبُو الوَليد الفقِيهُ، حَدَّثَنَا الحَسَنُ بنُ سُفْيَانَ الشَّيْبانيُّ، قَالَ : حَدَّثَنَا عُقْبَةُ بنُ مُكْرَم الضَّبِيِّ، قَالَ : حَدَّثَنَا أَبُو قَطن: عَمْرُو بنُ الهَيْثَم بن قَطَن بْن كَعْبٍ، قَالَ : حَدَّثَنَا حَمزَةُ الزِّيَّات، عَنْ سُلَيْمَانَ الأَعْمَشِ، عَنْ عَلي بن …"
summary:
