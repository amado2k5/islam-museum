text: |-
  ٤١٢
  •⁦(فصل الميم)⁩•
  ويسمى الماء أيضاماءوناوينتد • عيجتصيرة الماعون صبا • وتسحى الطاعة ماعونا
  وحسكى الاخفش عن أعرابى قصيح لوقد نزلفالصفعت بناقتك •نيعا تعطيك الماءون أى
  تنقادلك وتطيعك وقوله تعالى ويمنعون الماءون قال أبو عبيدة الماعون فى الجاهلية كل
  منقعة وعطية قال الاعشى
  بأجود منه بمَاءونه • اذا ماسهاؤهم لم نغم
  قال والماءون فى الاسلام الطاعة والزكاة وأنتد للمراعى
  قوم على الاسلام لما ينعوا • ماعونهم ويضيعوا التهليلا
  ومن الناس من يقول الماعون أصله معونة والالف عوض من الهاه وأمعن الفرس تباعد
  فى عدوه وأمعن فلان بحق ذهب به وأمعنت الارض رويت وماءمعين أى جار ويقال هو
  مفعول من عنت الماءاذا استنبطته وكلاً عمعون جرى فيه الماه والمعنان مجارى الماء
  فى الوادى والمعان المبساءة والمنزل ومعان موضع بالشأم (Üكن()n œكنه اللّه من الشى
  وأمكنه منه بعنى واستمسكن الرجل من الشئ وتمكن منه بمعنى وفلان لا يمكنه النهوض أى
  لا يقدر عليه وقولهم ما أمكنه عندالاميرشاذ والمكن بيض الضبة قال
  ومكن الضباب طعام العريشب لاتشتهيه تنموس الحجم
  والمكنة بكسر الكاف واحدة المكن والمنكنات وفى الحديث أقروا الطير على مكناتما
  ومكناتبها بالضم قال أبوزياد الكلابى وغيره من الاعراب انا لانعرف للطسير مكنات وانماهى
  وكنات فأما المكنات فانماهى للضباب قال أبو عبيد ويجوز فى الكلام وان كان المكن
  للضباب أن يجعل للطير تشبيها بذلك كفولهم مشافر الحبسى واغا المشافر للابل وكقول
  زهيريصف الاسد له لبدأظفاره لم تقلم* وانماله مخالب قال ويجوز أن يرادبه على أمكنتها
  أى على مواضعها التى جعلها اللّٰه لهافلا تزجروها ولا تلتفنوا اليهالانها لاتضر ولا تنفع
  ولا تعدوذلك الى غيره ويقال الناس على مكناتم-م أى على استقامتهم الكسائى أمكنت
  الضبة جعت بيضها فى بطنها فهى مكون وقال أبو زيد أمكنت الضبة فهى ممكن وكذلت
  الجرادة والمكتنان بالفتح والتسكين نبت ومعنى قول النحويين فى الاسم انه متمكن أى انه معرب
  كعمر وابراهيم فاذا انصرف مع ذلك فهو المتمسكن الامكن كزيدوعمرو وغير المتمكن هو المبف
  كقولك كيف وأين ومعنى قولهم فى الظرف انه متمكن أى انه يستعمل مرّة ظرفا ومرّة اسمنا
  كة ولك جلمت خلفك فتنصب ومجلسى خافكْ فترفع فى موضع يصلح أن يكون ظرفا وغير
  المتمكن هو الذى لا يستعمل فى موضع يصلح أن يكون ظرقا الافار فاحكقولك لقيته صباحا:
  وموعدك صباحافتنصب فيهما ولا يجوز الرفع اذا أردت صباح يوم بعينه وليس ذلك لعلة
  توجب الفرق بينهما أكثر من استعمال العرب لها كذلك وانما يؤخذ سما عاعنهم وهى صباح:
  وذوصباح ومساء وعشية وعشاء وضحى وضحوة وصروبكر وبكرة وعتمة وذات مرّة،
  وذات يوم وليل ونها روبعيدات بين هذا اذا عنيت بهذه الاوقات يومابعينه فأمااذا كانت
  نكرة أوأدخلت عليها الالف واللام تكلمت بها رفعا ونصبا دجرًا قال سيبوبه أخبرنا بذلك .
  يونس النصوة (منن المنة بالضم القوّة بقال هوضعيف المنة ومنه السير أضعفه وأعيا.
