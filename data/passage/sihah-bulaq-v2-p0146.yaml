text: |-
  .•الا.
  ٤٤١
  تصب الماءحين يفرغ الماء قال الشاعر• بازاه الحوض أوعة-ره• تقول منه أزيت
  الحوض تأزية وتوزبئا وآزيته ايزاء أى جعلت لهازا:وأمّاقول القسائل فى صفة الحوض
  ازاؤه كالظربان الموفى* فانماعنى به القيم ويقال للناقة اذالم تشرب الامن الازاء أزية واذا
  لم تشرب الامن المقر عقوة ويقسال لأقيم بالامره وازاؤه وفلان ازاءمال قال الشاعر
  لقد علم الشعب أنالهم • ازاء وأنالهم معقل
  وتقول هو بازانه أى بحذاته وقد آريته اذا حاذيته ولا تقل وازيته وأزى الظلّ يأزى أزيا
  وأزيا اذا تقبض حكاه الاصمعى قال أبوزيد آزيت على صستيج فلان ايزاء أضعفت عليه
  سا أسيته تأسية أى عزيته وآسيته بمالى مؤاساة أى جعلته اسونى فيه وواسيته لغة
  ضشعيفة فيه والاسوة والاسوة بالكسر والضم لغتان وهى ما يأتسى به الحزين يتعزى به وججعها
  اسى وأسى تم سمى الصبرأسى وأنسى به أى اقتدى يقال لا تأتمر عمن ليس لل باسوة أى لا تقتد
  بمن ليس لت بقدوة وتأسى به أى تعزى وتا موا أى اسى بعضهم بعضا قال الشاءر
  وانّ الألى بالطف من آل هاشم تاسوافسنو اللكرام التاسيا
  ولى فى فلان اسوة وأسوة أى قدوة وأتمام والاسى مفتوح. قصور المداوة والعلاج وهو
  الحزن أيضا والاساءمكسور عدود الدواء بعينه والاساء الاطبة جمع الآسى مثل الرعاءجع
  الراعى قال الحطيشة• تواكلها الاطبة والاساءه والاسوّعلى فعول دواء تأسويه الجرح
  وقد أسوت الجرح آسوه أسوا أى داويته فهومأسوّد أسى أيضا على فعيل ومنسه قول
  الناءر• أسيّ على أمّ الدماغ حميج* ويقال هذا أمر لا يؤسى كلمه وأهل البادية يسمون
  الخاتنة آسبة كتاية والآسية أيضا السارية والجمع الاواسى قال التابغة
  قان تك قدودعت غير مذقم • أواسى ملك أثبتتها الاوائل
  والا مى الطبيب وابهع الاساة مثل رام ورماة وأسوت بينهم أسوا أى أصلحت وأسى على
  مصيبته بالمكسر يأسى أسى أى حزن وقد أسيت لفلان أى حزنت له، اشا) الاشاء بالفتح
  والمتصغار النخل الواحدة اشاءة واله-مزة فيه منقلبة من الياءلان تصغيرها أشىّ قال
  الشاعر
  بايتشرك عن جبمة • وادي تن من ابا الالم
  - الحناءة الاطم
  عن الاشاءة عل زالت مخارمها • وه-ل تغير من آرامها ارم
  وجنة مايذم الدهرحاضرها • جبارها بالندى والحمل محتزم
  ولو كانت الهمزة أصلية لقال أشيء وهو واد باليمامة فيه تخيل وقد اتشى العظم اذا برى من
  كسركان به هكذا أقرأنيه أبو سعيد فى المصنف وقال ابن الكيت هذا قول الاصمعى
  وروى أبوع رووالفراء انتشى العظم بالنون ⁦(اصا)⁩ الآصية طعام مثل الحسام يصنع بالتمر
  وقال • والاثر والصرب معا كالا صبة • ( ضا لاضاة الغدير والمع أضى مثل قشاة
  وقنى واضاء أيضا بالمد والكسركما قالوا أكة وأكم واكام ⁦(الا)⁩ ألا الرجل يألوأى قصر
  وفلان لا يألوك نعمافهوآل رالمرأة آلية ويمعها أوال وفى المثل الاحظية فلا ألية وقد
  فسرناه فى حفلية و-كى الكسائى عن العرب أقبل يضريه لا يأل يريدلا يألو فحذف كمافا. ا
  دال
  صصاج
