text: أولئك قومي خير قوم بأسرهم فما عُدَّ من خير فقومي له أهلُ
summary:
  ar: بيت من القصيدة اللامية لحسان في فخر الأنصار، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.394}}. ينسب ابن هشام إلى غير ابن إسحاق بيتاً من هذه القصيدة، وهو مذكور في موضعه من السيرة.
  en: Hassan says his people are the best of peoples, and any good that is counted belongs to them.
  es: "Hassan dice que su pueblo es el mejor de los pueblos, y que todo lo bueno que se contabiliza les pertenece."
  fr: "Hassan affirme que son peuple est le meilleur des peuples, et que tout bien qui est comptabilisé lui appartient."
  ur: "حسن کہتے ہیں کہ ان کی قوم بہترین امت ہے اور جو بھی بھلائی شمار کی جاتی ہے وہ ان کی ہے۔"
  tr: "Hasan'ın Ensar'ı öven Lamiyyah şiirinden bir dize, Wüstenfeld baskısında {{cite:ibn-hisham-wustenfeld-1858 s.394}} yer almaktadır. İbn Hişam bu şiirden bir dizeyi İbn İshak'tan başka birine atfetmekte ve bu dize biyografide de aynı şekilde yer almaktadır."
  id: "Sebuah bait dari puisi Lamiyyah karya Hassan yang memuji kaum Ansar, sebagaimana terdapat dalam edisi Wüstenfeld {{cite:ibn-hisham-wustenfeld-1858 p.394}}. Ibn Hisham mengaitkan sebuah bait dari puisi ini kepada seseorang selain Ibn Ishaq, dan bait tersebut disebutkan di tempatnya dalam biografi."
translations:
  en:
    text: They are my people, the best of all peoples; whatever good is counted, my people deserve it.
