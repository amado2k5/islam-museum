label: { ar: "صحيح البخاري 4140 — التطوع", en: "Sahih al-Bukhari 4140 — the voluntary act (tatawwu')", ur: "صحیح بخاری 4140 — تطوع ⁦(نفلی عمل)⁩", fr: "Sahih al-Bukhari 4140 — l'acte volontaire (tatawwu')", es: "Sahih al-Bujari 4140 — el acto voluntario (tatawwu')", tr: "Sahih el-Buhari 4140 — Gönüllülük", id: "Sahih al-Bukhari 4140 - Kerelawanan" }
text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا ابْنُ أَبِي ذِئْبٍ، حَدَّثَنَا عُثْمَانُ بْنُ عَبْدِ اللَّهِ بْنِ سُرَاقَةَ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ الأَنْصَارِيِّ، قَالَ رَأَيْتُ النَّبِيَّ فِي غَزْوَةِ أَنْمَارٍ يُصَلِّي عَلَى رَاحِلَتِهِ، مُتَوَجِّهًا قِبَلَ الْمَشْرِقِ مُتَطَوِّعًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 4140، يرد فيه ذكر التطوع. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 4140 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), whose wording mentions the voluntary act (tatawwu'). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 4140، جس کے الفاظ میں تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 4140, dont le texte mentionne l'acte volontaire (tatawwu'). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 4140, cuyo texto menciona el acto voluntario (tatawwu'). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 4140 numaralı hadis, gönüllü ibadetlerden bahsetmektedir. Bu hadis, farz ibadetler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh ibadetler, haram ibadetler ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4140, menyebutkan tentang amal ibadah sunnah. Hadits ini disusun oleh seorang peneliti yang ahli dalam amal wajib, amal ketaatan, amal yang dianjurkan, amal yang tidak disukai, amal yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
