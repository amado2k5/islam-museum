label: { ar: "الموطأ 2201 — مالك عن يحيى بن سعيد عن عبد الرحمن بن القاسم: سمع مكحولا الدمشقي يسأل القاسم بن محمد عن العمرى، فقال: ما أدركت الناس إلا وهم على شروطهم في أموالهم وفيما أعطوا", en: "Muwatta 2201" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عبد الرحمن بن القاسم أنه سمع مكحولا الدمشقي يسأل القاسم بن محمد عن العمرى وما يقول الناس فيها، فقال القاسم بن محمد: ما أدركت الناس إلا وهم على شروطهم في أموالهم وفيما أعطوا. {cite:muwatta-maruf-1997 p.302} {cite:muwatta-maruf-1997 p.303}"
