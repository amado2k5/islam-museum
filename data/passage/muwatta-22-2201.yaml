label: { ar: "الموطأ 2201 — مالك عن يحيى بن سعيد عن عبد الرحمن بن القاسم: سمع مكحولا الدمشقي يسأل القاسم بن محمد عن العمرى، فقال: ما أدركت الناس إلا وهم على شروطهم في أموالهم وفيما أعطوا", en: "Muwatta 2201", es: "Muwatta 2201", fr: "Muwatta 2201", ur: "موطا 2201", tr: "El-Muvatta 2201 — Malik, Yahya ibn Sa’id’den, o da Abd al-Rahman ibn al-Qasim’den rivayetle: Makhul al-Dimashqi’nin al-Qasim ibn Muhammad’a Umre hakkında sorduğunu işitti ve şöyle dedi: “Malları ve verdikleri şeyler konusunda şartlarına bağlı kalmayan kimseyi tanımadım.”", id: "Al-Muwatta 2201 — Malik, berdasarkan riwayat Yahya ibn Sa’id, berdasarkan riwayat Abd al-Rahman ibn al-Qasim: Dia mendengar Makhul al-Dimashqi bertanya kepada al-Qasim ibn Muhammad tentang umrah, dan dia berkata: Aku belum pernah mengenal orang-orang kecuali mereka berpegang teguh pada syarat-syarat mereka mengenai harta benda dan apa yang mereka berikan." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عبد الرحمن بن القاسم أنه سمع مكحولا الدمشقي يسأل القاسم بن محمد عن العمرى وما يقول الناس فيها، فقال القاسم بن محمد: ما أدركت الناس إلا وهم على شروطهم في أموالهم وفيما أعطوا. {cite:muwatta-maruf-1997 p.302} {cite:muwatta-maruf-1997 p.303}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Abdülrahman ibn el-Kasım'dan rivayet ettiğine göre, Makhul el-Dimashqi'nin el-Kasım ibn Muhammed'e 'Umre (ömür boyu bağış) ve insanların bu konuda ne söyledikleri hakkında soru sorduğunu işitmiştir. El-Kasım ibn Muhammed şöyle cevap vermiştir: \"İnsanların malları ve verdikleri şeyler konusunda kendi şartlarına bağlı kalmaktan başka bir şey bilmedim.\" {cite:muwatta-maruf-1997 s.302} {cite:muwatta-maruf-1997 s.303}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abd al-Rahman ibn al-Qasim, bahwa ia mendengar Makhul al-Dimashqi bertanya kepada al-Qasim ibn Muhammad tentang 'Umrah (anugerah kehidupan) dan apa yang dikatakan orang tentangnya. Al-Qasim ibn Muhammad menjawab: \"Aku belum pernah mengetahui orang-orang selain terikat oleh syarat-syarat mereka mengenai harta benda dan apa yang telah mereka berikan.\" {cite:muwatta-maruf-1997 p.302} {cite:muwatta-maruf-1997 p.303}"
