label: { ar: "سنن النسائي 1877 — الأب والأبوة", en: "Sunan al-Nasa'i 1877 — the father and fatherhood", ur: "سنن نسائی 1877 — باپ اور والدیت", es: "Sunan al-Nasa'i 1877 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1877 — le père et la paternité", tr: "Sunan al-Nasa'i 1877 — Baba ve Babalık", id: "Sunan al-Nasa'i 1877 — Sang Ayah dan Peran Ayah" }
text: "أَخْبَرَنَا إِسْحَاقُ، قَالَ أَنْبَأَنَا جَرِيرٌ، قَالَ حَدَّثَنِي طَلْقُ بْنُ مُعَاوِيَةَ، وَحَفْصُ بْنُ غِيَاثٍ، قَالَ حَدَّثَنِي جَدِّي، طَلْقُ بْنُ مُعَاوِيَةَ عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ جَاءَتِ امْرَأَةٌ إِلَى رَسُولِ اللَّهِ بِابْنٍ لَهَا يَشْتَكِي فَقَالَتْ يَا رَسُولَ اللَّهِ أَخَافُ عَلَيْهِ وَقَدْ قَدَّمْتُ ثَلاَثَةً. فَقَالَ رَسُولُ اللَّهِ \" لَقَدِ احْتَظَرْتِ بِحِظَارٍ شَدِيدٍ مِنَ النَّارِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1877، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1877 (The Book of Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1877، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1877 (El Libro de los Funerales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1877 (Le Livre des funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 1877 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, İslam'da babalık konusuna dair bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 1877, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
