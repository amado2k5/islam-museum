label: { ar: "سنن ابن ماجه 1193 — الأب والأبوة", en: "Sunan Ibn Majah 1193 — the father and fatherhood", ur: "سنن ابن ماجہ 1193 — باپ اور والدیت", es: "Sunan Ibn Majah 1193 — El padre y la paternidad", fr: "Sunan Ibn Majah 1193 — le père et la paternité", tr: "Sunan İbn Majah 1193 — Baba ve Babalık", id: "Sunan Ibn Majah 1193 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ سِنَانٍ، وَإِسْحَاقُ بْنُ مَنْصُورٍ، قَالاَ حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَنْبَأَنَا شُعْبَةُ، عَنْ جَابِرٍ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، قَالَ: كَانَ رَسُولُ اللَّهِ ـ يُصَلِّي فِي السَّفَرِ رَكْعَتَيْنِ. لاَ يَزِيدُ عَلَيْهِمَا. وَكَانَ يَتَهَجَّدُ مِنَ اللَّيْلِ. قُلْتُ وَكَانَ يُوتِرُ؟ قَالَ: نَعَمْ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1193، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1193 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1193، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1193 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1193 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 1193 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1193, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
