text: "… بإنما اختار الإمام أحمد هذا لعشرة أوجه قد يستدعي مجلّداً ضخماً. كانت سورة الإخلاص تَعدِلُ ثلث القرآن، لأنها أنها بعد الفاتحة. وقيل: إنها بعد القراءة وقبل أخلصت لوصف الرحمن تبارك وتعالى، والثناء الركوع. وقيل: هي سكتتان غير الأولى، فتكون وَأَصِيلاً …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 66، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 66, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 66 کا اقتباس جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
