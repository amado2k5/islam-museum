label: { ar: "صحيح البخاري 5588 — التحريم", en: "Sahih al-Bukhari 5588 — prohibition", ur: "صحیح بخاری 5588 — تحریم", es: "Sahih al-Bukhari 5588 - prohibición", fr: "Sahih al-Bukhari 5588 – interdiction", tr: "Sahih el-Buhari 5588 — Yasak", id: "Sahih al-Bukhari 5588 — Larangan" }
text: "… التَّيْمِيِّ، عَنِ الشَّعْبِيِّ، عَنِ ابْنِ عُمَرَما ـ قَالَ خَطَبَ عُمَرُ عَلَى مِنْبَرِ رَسُولِ اللَّهِ فَقَالَ إِنَّهُ قَدْ نَزَلَ تَحْرِيمُ الْخَمْرِ، وَهْىَ مِنْ خَمْسَةِ أَشْيَاءَ الْعِنَبِ وَالتَّمْرِ وَالْحِنْطَةِ وَالشَّعِيرِ وَالْعَسَلِ، وَالْخَمْرُ مَا خَامَرَ الْعَقْلَ، وَثَلاَثٌ وَدِدْتُ أَنَّ رَسُولَ اللَّهِ لَمْ يُفَارِقْنَا حَتَّى يَعْهَدَ إِلَيْنَا عَهْدًا الْجَدُّ وَالْكَلاَلَةُ وَأَبْوَابٌ مِنْ أَبْوَابِ الرِّبَا. قَالَ قُلْتُ يَا أَبَا عَمْرٍو …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5588، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5588 (Drinks), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5588، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5588 (Bebidas), menciona la prohibición. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5588 (Boissons), mentionne une interdiction. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 5588 numaralı hadis, bu yasağı zikretmektedir. Helal ve Haram tarayıcısı, bunu Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5588, menyebutkan larangan tersebut. Peramban Halal dan Haram menggabungkan ini dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
