text: "قوم من هؤلاء الرؤساء الذين قدمنا ذكرهم قالوا: يقدم هؤلاء العبيد والموالي والفقراء علينا، فأنزل الله: وَكَذلِكَ فَتَنَّا بَعْضَهُمْ بِبَعْضٍ لِيَقُولُوا أَهؤُلاءِ مَنَّ اللَّهُ عَلَيْهِمْ مِنْ بَيْنِنا أَلَيْسَ اللَّهُ بِأَعْلَمَ بِالشَّاكِرِينَ وَإِذا جاءَكَ الَّذِينَ يُؤْمِنُونَ بِآياتِنا فَقُلْ سَلامٌ …"
summary:
  ar: "مقطع من الباب ٢٦ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 26 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 26 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
