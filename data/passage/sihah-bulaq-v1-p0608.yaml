  ⁦(توب)⁩ التو بة الرجوع من الذنب وفى الحديث الندم ثوية ومكذلك التوب مثله
  وقال الأخفسْ التوب جمع نوبة مش-ل عومة وعوم وتاب الى اللّٰه نوبة ومتاباوقدتاب
  لله عليه وفقه لها وفى كتاب سيبويه التتوية على تفعلة التوبة واستتابة س.أله أن يتوب
  والتابوت أصله تابوة مثسل ترقوة وهو فعلوة فلماسكنت الواوانقلبت هاء التانيث تاءقال
  القاسم بن معن لم تختلف لغة قريش والانصار قى شئ من القرآن الافى التابوت فلغسة قريش
  بالتباء ولغة الانصار بالهاء
