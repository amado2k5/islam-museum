text: |-
  ⁦(فصل الثاء)⁩
  ٣٣
  وتربان والترباء الارض نفسها و ترب الشى بالكسر أصابه التراب ومنه ترب الرجل افتقركاً نه
  اصق بالتراب بقال تربت يدالأوهو على الدعاء أى لا أصبت خيرا وتربت الشى تتر يبافتترب
  أى تلطخ بالتراب وأتربت الشئ جعلت عليه التراب وفى الحديث أتربوا الكتاب فانه أنجح
  للحاجة وأترب الرجل استغنى كأنه صارله من المال بقدر التراب والمتربة المسكفة والفاقة
  ومسكين ذو مترية أى لاصق بالتراب والتربات الانامل الواحدة تربة وريح تربة أيضا
  اذاجاءت بالتراب والتربة أيضانيت وتربة مثال همزة اسم وادوبه-ل تربوت وناقسة تربوت
  أى ذلول وأصله من التراب الذكر والاننى فيهسواء وقواء بم هذه ترب هذه أى لدتها وهن
  أتراب والتريبة واحدة الترائب وهى عظام الصدرمابين الترقوة الى الثندؤة قال الشاعر
  أشرف ثدياها على التريب ويترب بفتح الراءموضع قريب من اليمامة قال الاشجعى
  وعدت وكان الخاف منك سححية • مواعيد عرقوب أخاه ببترب
  عب تعب تعبا أعبا وأتعبه غيره فهوتعب ومتعب ولا تقل متعوب ( غب غب
  بالمكسر تغباهلك ⁦(تلب)⁩ التواب الحجس قال سيويه هو مصروف لانه فوعسل ويقال
  للانان أمّ تولب وقول أوس وذات هرم عارنواشرها * تصمت بالماء نواباجدعا
