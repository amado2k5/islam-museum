text: "… الحميد به، وابن ماجه عن أَبي الأشعث، عن معتمر بن سليمان، عن أبيه به. وقال الإمام أَحمد: حدّثنا أسباط بن محمّد، ثنا التيمي عن قتادة، عن أنس بن مالك. قال: كانت عامة وصية رسول اللّٰه للظ حين حضره الموت: الصلاة …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 263، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
