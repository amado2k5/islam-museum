text: "… فضله وثوابه قيل فيه: إنه مكروه تركه. الرابع: ما وقعت الريبة والشبهة في تحريمه، كلحم السبع والخيل وقليل النبيذ. - وهذا فيه نظر، لأن من أدى اجتهاده إلى تحريمه فهو عليه حرام، ومن أدى اجتهاده إلى حله، فلا معنى للكراهة …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 303، يرد فيه ذكر المكروه، والكراهة، والحرام، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 303, whose wording mentions the disliked (makruh), dislike (karaha), the forbidden (haram), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
