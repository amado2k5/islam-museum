text: "… عليهم المسلمون فقتل اللّٰه مُسيلمة. حدّثنا خليفة، حدّثنا الأنصاري، عن أبيه، عن ثمامة، عن أنس، قال: رَمَى البراءُ بنفسه عليهم فقاتلهم حتى فتح الباب وبه بِضْعٌ وثمانون جراحة مِنْ بين رَمْيةٍ بِسَهْمٍ وضربه، فحُمل إلى رَحْله يُدَاوى، وأقام عليه خالد …"
