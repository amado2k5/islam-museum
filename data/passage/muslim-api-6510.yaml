label: { ar: "صحيح مسلم — رغم أنفه", en: "Sahih Muslim — May his nose be rubbed in dust", ur: "صحیح مسلم — اس کی ناک مٹی میں رگڑی جائے" }
text: "حَدَّثَنَا شَيْبَانُ بْنُ فَرُّوخَ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ سُهَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏\"‏ رَغِمَ أَنْفُ ثُمَّ رَغِمَ أَنْفُ ثُمَّ رَغِمَ أَنْفُ ‏\"‏ ‏.‏ قِيلَ مَنْ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ مَنْ أَدْرَكَ أَبَوَيْهِ عِنْدَ الْكِبَرِ أَحَدَهُمَا أَوْ كِلَيْهِمَا فَلَمْ يَدْخُلِ الْجَنَّةَ ‏\"‏ ‏.‏"
summary:
  ar: "قال: رغم أنفه، من أدرك أبويه عند الكبر أحدهما أو كليهما فلم يدخل الجنة."
  en: "«May his nose be rubbed in dust« — whoever catches his parents in old age, one or both, and does not enter Paradise."
  ur: "«اس کی ناک مٹی میں رگڑی جائے» — جو اپنے والدین کو بڑھاپے میں پائے، ایک یا دونوں، پھر جنت میں نہ داخل ہو۔"
