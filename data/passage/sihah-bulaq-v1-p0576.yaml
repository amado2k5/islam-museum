text: |-
  ٦٠
  عليه وان كان فى الاصل فعلا والتشبيب النسيب يقال هو يشبب بفلانة أى ينسب بها !
  والشباب بالكسرنشاط الفرس ورفع يديه جيعا تقول شب الفرس يشب ويشب شبابا وشبيبا
  اذا قص ولعب وأشببته أنا اذا هيجته وكذلك اذاحرن يقال برئت اليك من شبابه وشبيبه
  وعضاضه وعضيضه الاصمعى الشبب المسن من ثيران الوحش الذى انتهى أسفانه وكذلك
  الشبوب تقول منه أسب الثورفهو مشب وربعا قالوا انه لشب بكسر الميم وقال أبو عبيدة
  الشبب النور الذى انتهى شبابا أبوع رومررت برجال شببة أى شبان والشب شئ يشبه
  الزج وشبين التار والحرب أشيها شبا وشبوبا اذا أرقدتها والشبوب بالفتح ماتوق_ديه النار
  ويقال هذ شبوب لمكذا أى يزيد فيه ويقويه وتقول شعرها يشب لونها أى يظهره ويحسفه
  ويقال للحميل انه لمشبوب قال ذوالرمة
  اذا الاروع المشبوب أضحى كأنه * على الرحل ممامنه السير أحق
  ⁦( جب )⁩، شجب بالكسر يشجب شجبا أى حزن أوهلك فهو شجب رشجب بالفتح يشجب
  بالضم شحو بافهو شاجب أى هالك وشجبه اللّٰه يشحبه شحبا أى أهلكه يتعدى ولا يتعدى
  يقال ماله شحبه اللّٰه وشجبه أيضاحزنه وشجبه أيضاشغلة قاله ابن السكيت وغراب شاجب
  أى شديد المعيق وشجبه بشحاب أى سده بداد والمشجب الخشبة التى تلقى عليها المياب
  والشجوب أعمدة من أعمدة البيت قال الهذلىّ يصف الرماح وهنّ معا قيام كالشجوب
  ويشعبب ابن يعرب بر قحطان ⁦( حب)⁩ شحب جسمه يشحب بالضم شحوبا اذاتغير قال النمر
  ابن نواب وفى جسم راعيها شحوب كأنه * هزال ومامن قلة الطعم يهزل
  وشحب جسمه بالضم شحوبة لغة فيه حكاها الذرّاء (شخب الشخذب بالضم ما امتدّ من
  اللبن حين يحلب وفى المنل شخب فى الاناء وشخب فى الارض أى يصيب مرّة ويخطئ أخرى
  والشخب بالفتح المه درتقول شخب اللين يشخب ويشخب ومنه قول الكميت
  ووحوح فى حضن الفتاة ضجيعها * ولم يك فى النكد المقاليت مشخب
  والاشخوب صوت الدرّة يقال انها لاشخوب الاحاليل وقولهم عروقه تنشخب دما أى
  تنفجر والشنخوية والشتخوب واحد شناخيب الجبل وهى رؤسه ⁦( ذب)⁩ الشذية بالتحريت
  ما يقطع مم تفرّق من أغصان الشجر ولم يكر فى لبه والجمع الشذب قال الكميت
  بل أنت فى صفئ النضار من الشنبعة اذحظ غيرك الشذب
  وقد شذيت الشجرة تشذيبا وجذع مشذب أى مقشر والفرس المشذب الطويل والشوذب
  لطويل وشذب عنه شذيا أى ذب والشاذب المتنحى عن وطنه ويقال الشذب المسناة ورجل
  شذب العروق أى ظاهر العروق وأشذاب الكلا وغيره بقاياه الواحدشذب وهو المأكول
  قال ذوارمة فأصبح البكر فردامن ألايفه * يرتاد أحلئة أعجاز هاشذب
  ( (شرب شرب الماءوغيره شربا وشريا وشربا وقرئ فشاريون شرب الهيم بالوجوه
  الثلاثة قال أبو عبيدة الشرب بالفتح مصدر وبانلفض والرفع اسمان من شربت والتشراب
  الشرب والشرية من الماء ما يشرب مرّة والشربة أيضا المرّة الواحدة من الشرب والشرب
  بالكسر الحظ من الماء وفى المشل آخرها أقلها شريا وأصله فى سقى الابل لانّ آخرهايرد
