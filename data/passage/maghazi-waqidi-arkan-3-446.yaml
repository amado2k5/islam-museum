text: "… ما تدعويا محمّد؟ قال : أَدعوك إلى أَن تشهد أَن لا إله إلَّا اللّٰه وأَنى رسول الله، وأَن تُقيم الصلاة، وتُؤْتىَ الزكاة - وتفعل، وتفعل، حتى عدّ خِصال الإِسلام. فقال عِكْرِمَة : واللهِ ما دعوتَ إلَّا إلى الحقّ وأمرٍ حسنٍ …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 3، ص 446، يذكر الشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 3, p. 446, that mentions the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 3، ص 446 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Maghazi de al-Waqidi, volumen 3, pág. 446, que menciona el testimonio, la oración y el zakat; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Maghazi d'al-Waqidi, volume 3, page 446, mentionnant le témoignage, la prière et la zakat; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Vakidi'nin Maghazi adlı eserinin 3. cildinin 446. sayfasından bir alıntı, iman şahadeti, namaz ve zekâttan bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Maghazi karya al-Waqidi, Volume 3, halaman 446, menyebutkan kesaksian iman, salat, dan zakat; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
