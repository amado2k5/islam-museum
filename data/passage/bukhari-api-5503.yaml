label: { ar: "صحيح البخاري 5503 — الأب والأبوة", en: "Sahih al-Bukhari 5503 — the father and fatherhood", ur: "صحیح بخاری 5503 — باپ اور والدیت", es: "Sahih al-Bukhari 5503 — El padre y la paternidad" }
text: "… عَنْ سَعِيدِ بْنِ مَسْرُوقٍ، عَنْ عَبَايَةَ بْنِ رَافِعٍ، عَنْ جَدِّهِ، أَنَّهُ قَالَ يَا رَسُولَ اللَّهِ لَيْسَ لَنَا مُدًى. فَقَالَ \" مَا أَنْهَرَ الدَّمَ وَذُكِرَ اسْمُ اللَّهِ فَكُلْ، لَيْسَ الظُّفُرَ وَالسِّنَّ، أَمَّا الظُّفُرُ فَمُدَى الْحَبَشَةِ، وَأَمَّا السِّنُّ فَعَظْمٌ \". وَنَدَّ بَعِيرٌ فَحَبَسَهُ فَقَالَ \" إِنَّ لِهَذِهِ الإِبِلِ أَوَابِدَ كَأَوَابِدِ الْوَحْشِ فَمَا غَلَبَكُمْ مِنْهَا فَاصْنَعُوا هَكَذَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5503، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5503 (Hunting, Slaughtering), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5503، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5503 (Caza y matanza), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
