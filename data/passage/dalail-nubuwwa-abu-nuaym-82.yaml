text: "٨٢ الفصل الخامس ح / ٤٣ أرض الخمر والخمير إلى أرض الجوع والبؤس، قال قلنا: الله أعلم، قال فإني قدمت إلى هذا البلد لتوكف (١) خروج نبي قد أظل زمانه، هذه البلدة مهاجره، فكنت أرجو أن يبعث فأتبعه، وقد أظلكم زمانه، فلا"
