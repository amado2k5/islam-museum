label: { ar: "الموطأ 243 — تشهد عائشة من رواية يحيى بن سعيد عن القاسم", en: "Muwatta 243", es: "Muwatta 243", fr: "Muwatta 243", ur: "موطا 243", tr: "El-Muvatta 243 — Yahya bin Said'in El-Kasım'dan rivayetine göre Aişe şahitlik eder.", id: "Al-Muwatta 243 — Aisyah bersaksi, menurut riwayat Yahya bin Saeed dari Al-Qasim" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد الأنصاري عن القاسم بن محمد أن عائشة كانت تتشهد بالصيغة نفسها التي في الأثر السابق مع زيادة «وأشهد» قبل الشهادة لمحمد بالرسالة؛ وهو في باب التشهد في الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.145}"
  tr: "Malik'in Yahya ibn Sa'id el-Ensari'den, o da el-Kasım ibn Muhammed'den rivayet ettiği bir hadiste, Aişe'nin, Muhammed'in peygamberliğine şahitlik etmeden önce \"ve ben şahitlik ederim\" ifadesini ekleyerek, önceki rivayette olduğu gibi Şehadet'i okuduğu belirtilmektedir. Bu, namazdaki Teşehhüd bölümünde yer almaktadır. Editör, bunun Malik'ten Ebu Mus'ab ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.145}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id al-Ansari atas otoritas al-Qasim ibn Muhammad menyatakan bahwa Aisyah biasa mengucapkan Syahadat dengan bentuk yang sama seperti dalam riwayat sebelumnya, dengan tambahan \"dan aku bersaksi\" sebelum bersaksi tentang kenabian Muhammad. Hal ini terdapat dalam bab tentang Tasyahhud dalam salat. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.145}"
