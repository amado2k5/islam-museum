  ar: "أثر يرويه مالك عن يحيى بن سعيد الأنصاري عن القاسم بن محمد أن عائشة كانت تتشهد بالصيغة نفسها التي في الأثر السابق مع زيادة «وأشهد» قبل الشهادة لمحمد بالرسالة؛ وهو في باب التشهد في الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.145}"
