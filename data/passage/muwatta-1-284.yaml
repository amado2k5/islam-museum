summary:
  ar: "قول لمالك في باب ما جاء فيمن رعف يوم الجمعة: ليس على من رعف أو أصابه أمر لا بد له معه من الخروج أن يستأذن الإمام يوم الجمعة إذا أراد أن يخرج. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.162} {cite:muwatta-maruf-1997 p.163}"
