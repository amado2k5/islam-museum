text: "… : الشرط الأول : حُلّ المرأة للتزاوج بالرجل الذي يريد الاقتران بها. فيشترط ألا تكون محرمة عليه بأي سبب من أسباب التحريم المؤقت أو المؤبد. وسيأتي ذلك مفصلاً في بحث المحرمات من النساء. الشرط الثاني : الإشهاد على الزواج. وهو …"
