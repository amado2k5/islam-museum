text: "… النكاح، والضرب فيه بالدف إن شرطت عليه أن يطلق ضرتها، لم يصح الشرط الوطء على ثلاثة أضرب ؛... مباح، ووطء بشبهة، وحرام إن ضربها على نشوزها، ومنعها حقها، لم يحرم خلعها لذلك... إن علق الإيلاء على غير مستحيل، فذلك على …"
