text: "… ليست وحشيةً حلالًا. اه قال النووي: ويحرم أكل الجِدَأة والغراب الأبقع؛ لما روت عائشة ليها، أن النبي والف قال: خمس يقتلن في الحل والحرم: الحية والفأرة والغراب الأبقع والحِدَأة والكلب العقور، وما أمر بقتله لا يحل أكله. المجموع، نهاية المحتاج. …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 33، يذكر الحلال، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 1, p. 33, that mentions the lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 1، ص 33 کا اقتباس جس میں حلال، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
