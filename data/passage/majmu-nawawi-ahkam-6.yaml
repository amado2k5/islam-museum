text: "… النووى فحكى عن مالك انها سنة ويجب بتركها دم، ولا يعرف ذلك عندهم إلا أن ابن الجلاب قال : التلبية فى الحج مسنونة غير مفروضة، وقال ابن التين : يريد أنها ليست من أركان الحج، وإلا فهى واجبة ولذلك يجب …"
summary:
  ar: "مقطع من المجموع للنووي، ص 6، يرد فيه ذكر الفرض، والواجب، وما ليس بواجب، والسنن المؤكدة والرواتب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 6, whose wording mentions the obligatory (fard), the obligatory (wajib), what is said not to be obligatory, the emphasised and regular sunnas; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 6 کا اقتباس جس میں فرض، واجب، جو واجب نہیں، سننِ مؤکدہ اور رواتب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 6, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), ce qui est dit non obligatoire, les sunnas appuyées et régulières ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
