text: "… فيه انصداع العروق ونفت الدم والسعال، وخصوصاً في الشتوي منه الذي يشبه الشتاء؛ ويسوء أحوال من بهم هذه الأمراض، وخصوصاً السدّ، ولتحريكه في المبلغمين موادّ البلغم تحدث فيه السكتة والفالج وأوجاع المفاصل وما يوقع فيها حركة من الحركات البدنية والنفسانية …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 119، يذكر المرض والمريض، والوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والعروق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 119, that mentions illness and the sick, pain, named diseases, the hospital and the medical craft, the organs of the body, the vessels; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 119 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، رگیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
