label:
  ar: "أبيات إياس بن قبيصة «ما ولدتني حاصن» (1)"
  en: "Iyas ibn Qabisa's verses ('A chaste woman did not bear me') (1)"
  es: "Versículos de Iyas ibn Qabisa ('Una mujer casta no me dio a luz') (1)"
  fr: "Vers d'Iyas ibn Qabisa (« Une femme chaste ne m'a pas enfanté ») (1)"
