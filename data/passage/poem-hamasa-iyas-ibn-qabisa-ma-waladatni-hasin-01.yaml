text: "ما ولدتني حاصن ربعية لئن أنا مالأت الهوى لا تباعها"
summary:
  ar: "بيت من أبيات إياس بن قبيصة «ما ولدتني حاصن»، كما في طبعة 1916 لديوان الحماسة {{cite:hamasa-abu-tammam-ed-1916 p.59}}."
  en: "Verse 1 of Iyas ibn Qabisa's verses ('A chaste woman did not bear me'), as in the 1916 edition of the Hamasa."
  es: "Versículo 1 de los versos de Iyas ibn Qabisa ('Una mujer casta no me dio a luz'), como en la edición de 1916 de la Hamasa."
  fr: "Verset 1 des vers d'Iyas ibn Qabisa (« Une femme chaste ne m'a pas enfanté »), tel qu'il figure dans l'édition de 1916 du Hamasa."
  ur: "ایاس بن قبیصہ کی آیات ⁦('ایک پاک دامن عورت نے مجھے برداشت نہیں کیا')⁩ کی آیت 1، جیسا کہ حماسہ کے 1916 کے ایڈیشن میں ہے۔"
  tr: "İyas ibn Kubaysa'nın şiirlerinden bir dize: \"Ben iffetli bir kadından doğmadım,\" bu dize, Diwan al-Hamasa'nın 1916 baskısında yer almaktadır {{cite:hamasa-abu-tammam-ed-1916 s.59}}."
  id: "Sebuah bait dari puisi Iyas ibn Qubaysah: “Aku tidak dilahirkan dari seorang wanita yang suci,” sebagaimana terdapat dalam edisi 1916 dari Diwan al-Hamasa {{cite:hamasa-abu-tammam-ed-1916 p.59}}."
translations:
  en:
    text: "A chaste woman of Rabi'a did not bear me, if I side with desire in pursuing her."
