label: { ar: "صحيح البخاري 1337 — دفن وقبر ومرقد", en: "Sahih al-Bukhari 1337 — a burial, grave or resting place", ur: "صحیح بخاری 1337 — تدفین، قبر اور مرقد" }
text: "… ـ أَنَّ أَسْوَدَ ـ رَجُلاً أَوِ امْرَأَةً ـ كَانَ يَقُمُّ الْمَسْجِدَ فَمَاتَ، وَلَمْ يَعْلَمِ النَّبِيُّ بِمَوْتِهِ فَذَكَرَهُ ذَاتَ يَوْمٍ فَقَالَ \" مَا فَعَلَ ذَلِكَ الإِنْسَانُ \". قَالُوا مَاتَ يَا رَسُولَ اللَّهِ. قَالَ \" أَفَلاَ آذَنْتُمُونِي \". فَقَالُوا إِنَّهُ كَانَ كَذَا وَكَذَا قِصَّتَهُ. قَالَ فَحَقَرُوا شَأْنَهُ. قَالَ \" فَدُلُّونِي عَلَى قَبْرِهِ \". فَأَتَى قَبْرَهُ فَصَلَّى عَلَيْهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1337، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1337 (Funerals (Al-Janaa'iz)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 1337، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
