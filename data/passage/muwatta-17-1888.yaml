label: { ar: "الموطأ 1888 — مالك: لا يصلح مد زبد ومد لبن بمدي زبد، وهو مثل ما وصفنا من التمر الذي يباع صاعين من كبيس وصاعا من حشف بثلاثة آصع من عجوة", en: "Muwatta 1888", es: "Muwatta 1888", fr: "Muwatta 1888", ur: "موطا 1888", tr: "El-Muvatta 1888 — Malik: Bir ölçü tereyağı ve bir ölçü sütü iki ölçü tereyağı ile değiştirmek caiz değildir. Bu, hurma konusunda anlattığımız duruma benzer; orada iki ölçü kubi ve bir ölçü haşf, üç ölçü ajwah karşılığında satılır.", id: "Al-Muwatta 1888 — Malik: Tidak diperbolehkan menukar satu takaran mentega dan satu takaran susu dengan dua takaran mentega. Ini serupa dengan apa yang telah kami jelaskan mengenai kurma, di mana dua takaran kurma kubis dan satu takaran kurma hitam dijual dengan tiga takaran kurma ajwah." }
summary:
  ar: "قال مالك: لا يصلح مد زبد ومد لبن بمدي زبد، وهو مثل الذي وصفنا من التمر الذي يباع صاعين من كبيس وصاعا من حشف بثلاثة آصع من عجوة. إن صاعين من كبيس بثلاثة آصع من عجوة لا يصلح، ففعل ذلك ليجيز بيعه. وإنما جعل صاحب اللبن اللبن مع زبده، ليأخذ فضل زبده على زبد صاحبه، حين أدخل معه اللبن. {cite:muwatta-maruf-1997 p.175} {cite:muwatta-maruf-1997 p.176}"
  tr: "Malik şöyle dedi: Bir ölçü tereyağı ve bir ölçü sütü iki ölçü tereyağı ile değiştirmek caiz değildir. Bu, hurma konusunda anlattığımız duruma benzer; iki ölçü taze hurma ve bir ölçü olgunlaşmamış hurma, üç ölçü taze hurma karşılığında satılır. İki ölçü taze hurmayı üç ölçü taze hurma karşılığında satmak caiz değildir, bu yüzden satıcı bunu satışı caiz kılmak için yapmıştır. Süt satıcısı, sütü tereyağıyla birlikte satarak, arkadaşının sütüne kıyasla kendi sütündeki fazla tereyağını alabilmek için bunu yapmıştır. {cite:muwatta-maruf-1997 s.175} {cite:muwatta-maruf-1997 s.176}"
  id: "Malik berkata: Tidak diperbolehkan menukar satu takaran mentega dan satu takaran susu dengan dua takaran mentega. Ini mirip dengan apa yang telah kita jelaskan mengenai kurma, di mana dua takaran kurma segar dan satu takaran kurma mentah dijual dengan tiga takaran kurma segar. Dua takaran kurma segar untuk tiga takaran kurma segar tidak diperbolehkan, jadi dia melakukan ini agar penjualan tersebut diperbolehkan. Penjual susu hanya menyertakan susu dengan menteganya agar dia bisa mengambil kelebihan mentega dari susunya dibandingkan dengan mentega temannya, karena dia telah menyertakan susu tersebut. {cite:muwatta-maruf-1997 p.175} {cite:muwatta-maruf-1997 p.176}"
