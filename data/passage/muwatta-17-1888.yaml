summary:
  ar: "قال مالك: لا يصلح مد زبد ومد لبن بمدي زبد، وهو مثل الذي وصفنا من التمر الذي يباع صاعين من كبيس وصاعا من حشف بثلاثة آصع من عجوة. إن صاعين من كبيس بثلاثة آصع من عجوة لا يصلح، ففعل ذلك ليجيز بيعه. وإنما جعل صاحب اللبن اللبن مع زبده، ليأخذ فضل زبده على زبد صاحبه، حين أدخل معه اللبن. {cite:muwatta-maruf-1997 p.175} {cite:muwatta-maruf-1997 p.176}"
