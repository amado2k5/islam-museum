label:
  ar: "ابن ماجه 1366 — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Ibn Majah 1366 — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "ابن ماجہ 1366 — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
  es: "Ibn Majah 1366 — Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda?"
  fr: "Ibn Majah 1366 — Notre Seigneur descend dans le dernier tiers de la nuit: qui M’invoquera afin que Je réponde ?"
  tr: "İbn Majah 1366 — Rabbimiz gecenin son üçte birinde iner: “Kim bana dua edecek de ona icabet edeyim?”"
  id: "Ibn Majah 1366 — Tuhan kita turun pada sepertiga malam terakhir: “Siapa yang akan memohon kepada-Ku, sehingga Aku dapat mengabulkannya?”"
text: "ينزل ربنا تبارك وتعالى، حين يبقى ثلث الليل الآخر، كل ليلة، فيقول: من يسألني فأعطيه؟ من يدعوني فأستجيب له؟ من يستغفرني فأغفر له؟ حتى يطلع الفجر . فلذلك كانوا يستحبون صلاة آخر الليل على أوله ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1366: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1366: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1366: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 1366: Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 1366: Notre Seigneur descend au cours du dernier tiers de la nuit: qui M’invoquera afin que Je réponde ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "İbn Mâce Süneni'nde 1366 numaralı hadis-i kudsi şöyledir: Rabbimiz gecenin son üçte birinde iner ve şöyle buyurur: \"Kim bana dua edecek de icabet edeyim?\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 1366: Tuhan kita turun pada sepertiga malam terakhir, firman-Nya: “Siapa yang mau memohon kepada-Ku, maka Aku akan mengabulkannya?” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
