label:
  ar: "ابن ماجه 1366 — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Ibn Majah 1366 — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "ابن ماجہ 1366 — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
text: "ينزل ربنا تبارك وتعالى، حين يبقى ثلث الليل الآخر، كل ليلة، فيقول: من يسألني فأعطيه؟ من يدعوني فأستجيب له؟ من يستغفرني فأغفر له؟ حتى يطلع الفجر . فلذلك كانوا يستحبون صلاة آخر الليل على أوله ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1366: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1366: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1366: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
