label: { ar: "الموطأ 2539 — عروة بن الزبير: أحيحة بن الجلاح يقتل عمه الصغير فلا يرث القاتل", en: "Muwatta 2539", es: "Muwatta 2539", fr: "Muwatta 2539", ur: "موطا 2539", tr: "El-Muvatta 2539 — Urve ibn el-Zübeyr: Uhayha ibn el-Callah genç amcasını öldürür, bu yüzden öldüren kişi mirasçı olmaz.", id: "Al-Muwatta 2539 — Urwah ibn al-Zubayr: Uhayhah ibn al-Jallah membunuh pamannya yang masih muda, sehingga si pembunuh tidak mendapat warisan." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عروة بن الزبير أن رجلا من الأنصار يقال له أحيحة بن الجلاح كان له عم صغير هو أصغر من أحيحة، وكان عند أخواله، فأخذه أحيحة فقتله، فاحتج أخواله بأنهم كانوا يقومون عليه حتى كبر فغلبهم حق العم. قال عروة: فلذلك لا يرث قاتل من قتل. {cite:muwatta-maruf-1997 p.440}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Urve ibn el-Zübeyr'den rivayet eder ki, Ensar'dan Uhayha ibn el-Callah adında bir adamın, kendisinden daha küçük bir amcası vardı ve bu amca anne tarafından amcalarıyla birlikte yaşıyordu. Uhayha onu yakalayıp öldürdü. Anne tarafından amcaları, amcasının büyüyene kadar ona baktığını ve amcasının haklarının onlardan üstün olduğunu savundular. Urve şöyle dedi: Bu nedenle, katil öldürdüğü kişiden miras alamaz. {cite:muwatta-maruf-1997 s.440}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Urwah ibn al-Zubayr, bahwa seorang pria dari kaum Ansar bernama Uhayhah ibn al-Jallah memiliki seorang paman muda, lebih muda dari Uhayhah sendiri, yang tinggal bersama paman-paman dari pihak ibunya. Uhayhah menangkapnya dan membunuhnya. Paman-paman dari pihak ibunya berpendapat bahwa mereka telah merawatnya hingga dewasa, dan bahwa hak-hak paman lebih diutamakan daripada hak mereka. Urwah berkata: Oleh karena itu, seorang pembunuh tidak berhak mewarisi harta dari orang yang dibunuhnya. {cite:muwatta-maruf-1997 p.440}"
