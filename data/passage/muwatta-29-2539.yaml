label: { ar: "الموطأ 2539 — عروة بن الزبير: أحيحة بن الجلاح يقتل عمه الصغير فلا يرث القاتل", en: "Muwatta 2539" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عروة بن الزبير أن رجلا من الأنصار يقال له أحيحة بن الجلاح كان له عم صغير هو أصغر من أحيحة، وكان عند أخواله، فأخذه أحيحة فقتله، فاحتج أخواله بأنهم كانوا يقومون عليه حتى كبر فغلبهم حق العم. قال عروة: فلذلك لا يرث قاتل من قتل. {cite:muwatta-maruf-1997 p.440}"
