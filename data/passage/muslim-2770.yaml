label: { ar: "مسلم 2770 — حديث أم زرع وقصة الإفك", en: "Muslim 2770 — Umm Zar' and the ifk account" }
text: "قالت عائشة: لما تُهمت بما تهمت به لم أكن أشعر بشيء من ذلك... فتلا رسول الله علينا شيئا من القرآن: «إن الذين جاؤوا بالإفك عصبة منكم» — عشر آيات كلها أو أكثر، فبرأني الله بها"
summary:
  ar: "في كتاب التوبة؛ حديث أم زرع ترويه عائشة منقطعا إلى قصة الإفك كاملة بروايتها — غيبتها إثر تساقط قلادتها، ودفاع سعد بن معاذ وسعد بن عبادة، وتلا النبي آيات البراءة من سورة النور. أطول نص سيرة ذاتي ورد في الصحيحين عن حادثة واحدة."
