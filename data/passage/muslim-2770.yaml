label: { ar: "مسلم 2770 — حديث أم زرع وقصة الإفك", en: "Muslim 2770 — Umm Zar' and the ifk account", es: "Musulmán 2770 — Umm Zar' y la cuenta IFK", fr: "Muslim 2770 — Umm Zar' et le compte ifk", ur: "مسلم 2770 - ام زر اور افک اکاؤنٹ", tr: "Müslim 2770 — Ümmü Zer'in Hadisi ve İftira Hikayesi", id: "Muslim 2770 — Hadits Umm Zar’ dan Kisah Fitnah" }
text: "قالت عائشة: لما تُهمت بما تهمت به لم أكن أشعر بشيء من ذلك... فتلا رسول الله علينا شيئا من القرآن: «إن الذين جاؤوا بالإفك عصبة منكم» — عشر آيات كلها أو أكثر، فبرأني الله بها"
summary:
  ar: "في كتاب التوبة؛ حديث أم زرع ترويه عائشة منقطعا إلى قصة الإفك كاملة بروايتها — غيبتها إثر تساقط قلادتها، ودفاع سعد بن معاذ وسعد بن عبادة، وتلا النبي آيات البراءة من سورة النور. أطول نص سيرة ذاتي ورد في الصحيحين عن حادثة واحدة."
  tr: "Tövbe Kitabı'nda, Ümmü Zer'in hadisi, Aişe tarafından rivayet edilir; ancak bu hadis, iftira olayının tamamını, yani kolyesinin düşmesinden sonra ortadan kaybolmasını, Sa'd ibn Mu'adh ve Sa'd ibn Ubadah'ın savunmasını ve Peygamber'in Nur Suresi'nden masumiyet ayetlerini okumasını anlattığı kısım hariç, eksiktir. Bu, iki Sahih'te (Buhari ve Müslim) tek bir olayla ilgili olarak bulunan en uzun otobiyografik metindir."
  id: "Dalam Kitab Taubat, hadits Umm Zar’ diriwayatkan oleh Aisyah, yang tidak lengkap, hingga kisah lengkap insiden fitnah sebagaimana yang diceritakannya—hilangnya Umm Zar’ setelah kalungnya jatuh, pembelaan Sa’d ibn Mu’adh dan Sa’d ibn ‘Ubadah, dan pembacaan ayat-ayat kesucian dari Surah An-Nur oleh Nabi. Ini adalah teks otobiografi terpanjang yang ditemukan dalam dua kitab Sahih (Bukhari dan Muslim) mengenai satu kejadian."
