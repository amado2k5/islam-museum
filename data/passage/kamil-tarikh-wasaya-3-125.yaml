text: "… قال له يعقوب: كيف تركت يوسف؟ قال: تركته ملك مصر. قال: ما أصنع بالملك؟ على أي دين تركته؟ قال: تركته على الإسلام. قال: الآن تمت النعمة. فلما رأى من عنده من أولاده قميص يوسف وخبره قالوا له : يَا أَبَانَا …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 125، يذكر ما خلّفه من تركة وميراث، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 3, p. 125, that mentions what was left behind: estate and inheritance, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 3، ص 125 کا اقتباس جس میں ترکہ اور میراث، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Kamil fi al-Tarikh de Ibn al-Athir, volumen 3, pág. 125, que menciona lo que quedó: bienes y herencia, una reliquia conservada tras su propietario; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre d'Ibn al-Athir, al-Kamil fi al-Tarikh (tome 3, p. 125), mentionnant ce qui fut laissé: biens et héritage, relique conservée après le décès. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Testaments Browser."
  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 3. cildinin 125. sayfasından bir alıntı, mal varlığını, mirasını ve korunmuş eserlerini anlatmaktadır; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Athir *Al-Kamil fi al-Tarikh*, Volume 3, halaman 125, menyebutkan harta warisan, harta pusaka, dan artefak yang dilestarikan; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, harta pusaka, artefak, dan makam suci."
