text: |-
  ٣٧٠
  ⁦(باب الرا٠)⁩
  ⁦(عتبر)⁩
  من اللحم وعمر واسم رحل يكتب بالوا و للفرق يبنه وبين عمر وتسقطها فى النصب لان الالف
  تخلفها ويجمع على عمور قال الشاعر الفرزدق
  وشيدلى زرارة باذخات • وعمر والخيران ذكر العمور
  وعمرويه شيئان جعلاواحداوكذلا" سيبويه ونفطويه وبنى على الكسرلان آخره أعمعىّ
  مضارع للاصوات فشبه بغاق فان نكرته نونت فقلت مررت بعمرويه وعمرويه آخر وذكر
  المبرّد فى تثنيته وجمعه العمرويه ان والعمرويهون وذكرغيره أن من قال هذا عمرويه وسيبويه
  ورأيت عمرويه وسيبو يه فأعر به شناه وجعه ولم يشرطه المبرّد والعمرة فى الحج وأصلها من
  الزيارة والجمع العمر والعمرة أن يبنى الرجل بامرأته فى أهلها فان نقلها الى أهله فذلك
  العرس قاله ابن الاعرابى وحمرت الخراب أعمره عمارة فهو عامى أى معمور مثل ماء دافق أى
  مدفوق وعيشة راضية أى مرضية والعمارة ايضا القبيلة والعشيرة قال التغلبى (وهو
  الاخفس بن شهاب) لكل اناس من معدعمارة • *روض اليها يلمؤن وجانب
  وعمارة خفض على أنه بدل من اناس ومكان عمير أى عامر وتوب عمر أى صفمق ويقال تركت
  القوم فى عومرة أى فى صماح وحلبة وأعمرته دارا أو أرضاأوابلااذا أعطمته اياها وقات
  هى لك عمرى أو عمر لفاذامت رجعت الىّ قال لبيد
  وما البرّ الامضرات من التقى * وما المال الامعمرات ودائع
  والاسم العمرى وأعمرت الارض وجدتم اعامرة أبوز يديقسال عمر اللّٰه بك منزلك وأعمر اللٰه
  بك منزلك قال ولا يقال أعمر الرجل منزله بالالف واعتمره أى زاره واعتمر فى الحج واعتمر أى تعمم
  بالعمامة قال أبو عبيد العمارة بالفتح كل شئ جعلته على رأسك من عمامة أوقلنسوة أوتاج
  أوغير ذلك ومنهقول الاعشى
  فلما أتانا بعبيد السكرى • مجدناله ورفعنا العمارا
  أى وضعنا ها عن رؤسنا اعظاماله وقال غيره أى رفعناله أمواتنا بالدعاء وقلناء وك اللّه
  ويقال العمارههنا الريصان يزين به مجالس الشراب وتسميه الفرس مبوران فاذادخل
  عليهم داخل رفعواشيتا منه بأيديهم وحيوه به وأما قول أعشى باهلة
  وجاشت النفس لماجاء فلهم • وراكب جاء من تثليث معتمر
  فان الاصمعى يقول معتمرأى زاتروقال ابو عبيدة أى متعمم بالعمامة وأما قول ابن آحر
  يهل بالفرقد ركيانها • كمايمل الراكب المعتمر
  ف، ومن عمرة الحج وقوله تعالى واستعمركم فيها أى جعلكم غمارها وعمره اللّٰه تعميرا أى
  طوّل عمره وعمار البيوت سكانها من الجنّ وقول عنترة
  أحولى تنفض استك مذرويها • لتقتلى فها ناذا عمارا
  هو ترخيم عمارة لانه يهجوبه عمارة بن زياد العبسى وعمارة بن عقيل بن بلال بن جرير أديب
  جدا والمعمر المنزل الواسع من جهة الماء والسكلاً قال الراجز و هو طرفة بن العبد .
  بالك من قبرة بمعمر ومنه قول الساجع
  أرسل العراضات أثرا • يبغينك فى الارض معمرا
  اى
