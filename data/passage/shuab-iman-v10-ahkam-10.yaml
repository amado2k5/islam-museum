text: "… فأطعناه - يعني - بإذنك، واستخلفت علينا خلفاء فأطعناهم بإذنك، وأمرت علينا أمراء فأطعناهم بإذنك فيقول: صدقتم، فهو عليهم وأنتم منه براء. أخبرنا أبو عبدالله الحافظ، أخبرنا أبو الفضل بن إبراهيم، حدثنا أحمد بن إسناده: لا بأس به. • إسحاق …"
