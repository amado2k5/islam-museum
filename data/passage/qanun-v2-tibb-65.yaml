text: "… في بلاد الشام ملفوف يزرع منذ سنة قبل المسيح. يفيد المصابين بمرض السكري، ويقوي الجسم، ويكسبه الحيوية والنضارة، يستعمل في معالجة الربو. التداوي بالأعشاب والنباتات قديماً وحديثاً، أحمد شمس الدين، دار الكتب العلمية، بيروت، الطبعة الثانية،. القانون في الطب ج …"
