text: "… عليه. وغسله ابناه، وعبدالله بن جعفر، وصلى عليه الحسن ابنه، وكبر عليه أَربعاً. وكُفِّن في ثلاثة أَثواب ليس فيها قميص. ودفن في السَّحَر. قيل: إِن علياً كان عنده مِسْكَ فَضَل من حَنُوط رسول اللّٰه عله، أَوصى أَن يُحنّط به. واختلفوا …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 886، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 886, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 886 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 886, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Usd al-Ghaba d'Ibn al-Athir (tome 1, p. 886) mentionnant un testament ou des dernières volontés, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 1, sayfa 886'daki bir alıntısında, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsedilmektedir; bu alıntı, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
