text: "… أولاده الصغار، اعتمد هذا في بداية المبتدي الأولىٰ، وهذا القولُ هو رواية الحسن عن الإمام أبي حنيفة، في حين أنه في الهداية قرَّر أنه لا يجب عليه أن يضحِّيَ عن أولاده الصغار، بل يستحب ذلك، وهذا هو ظاهر الرواية. وهذا …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 56، يرد فيه ذكر ما يجب على المكلف، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Marghinani's al-Hidaya, p. 56, whose wording mentions what is binding on the person addressed, the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ہدایہ، مرغینانی، ص 56 کا اقتباس جس میں جو مکلف پر واجب ہے، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
