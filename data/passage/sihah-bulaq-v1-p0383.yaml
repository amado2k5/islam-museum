text: |-
  ١ ال فى المخمار ومسّه قوله
  تعالى كادوايكونون عليه لبدااه
  ٢٥٨
  ⁦(ااد)⁩
  صل اللام) د) اللبدواحد اللبود واللبدة أخص منه ومنه قيل ة الاسد
  لبدة وهى الشعر المتراكب بين كتفيه والاسدذ ولبدة وفى المثل هو أمنع من ابدة الاسد وابهع
  لبدمثل قربة وقرب ١ اللبادة ما يلبس منها للمطر وقواهم ماله سبد ولا لبد السبد الشعر
  واللبد الصوف أى ماله شئ وألبدت الفرس فهومليداذ اشددت عليه اللبد وألبدت
  السرج اذا عملت له لبدا وأليدت القرية جعلتها فى لييدوه والجوالق الصغيروألبد البعير
  اذا ضرب بذنبه على عجزه وقد ثلط عليه وبال فيصير على عجزه لبدة من ثلطه وبوله وألبد
  بالمكان أقام يد وألبدت الابل اذا أخرج الربيع آلوانها وأوبارهاوتهيأت للسمن ولبد
  الشئ يالارض بالفتح يلسد لبوداتلبد بها أى اصق وتلبد الطائر بالارض أى جثم عليها
  وتلبدت الارض بالمعار ولبدت الابل بالكسر تليدلبدا اذاد عصت من الصليان وهو التواء
  فى حيازيها وفى غلاصمها وذلك اذا أ كثرت منه فتغص به يقال هذه ابل لبادى وناقة لبدة
  والتبد الورق أى تلبد بعضه على بعض والتبدت الشجرة كثرت أوراقها قال الساجع
  وصليانا بردا * وعنكناملتبدا ولبدالندى الارض والتلبيدأ يضا أن يجعل المحمرم
  فى رأسمشيئًا من صمغ ليتلبد شعره بقيا عليه لثلا يشعث فى الاوام وقوله تعالى يقول
  أهلكت مالالبدا أى جا ويقال أيضا الناس لبدأى مجتمعون واللبدايضا الذى لا يسافر
  ولا يبرح قال الشاعر الراعى
  من امرئ ذى سماح لا تزال له * بزلاء يعيابها الحثامة اللبد ويروى اللبه
  قال أبو عبيدة وهو أشبه ولبدآخر نسورلمان وهو ينصرف لانه ليس بعدول وتزعم العرب
  انّ اقمان هو الذى بعشته عاد فى وفدها الى الحرم ليستسقى لها فلما أهلكواخيراة مان بين
  بقامسبع بعرات سمرمن أظب عفر فى جبل وعرلايسها القطر أ وبقاء سبعة أنسر كلما هلك
  نسر خلف بعده نسر فاختار النسورفكان اخر نسوره يسعى ليدا وقد ذصكرته الشعرا.
  قال النابغة أضحت خلا وأضحى أهلها احقلوا • أخف عليها الذى أخنى على لبد
  واللبيد الجوالق الصغير ولبيداسم شاعر من بى عامى ⁦(لد )⁩ ألحدفى دين اللّٰه أى حاد
  عنه وعدل وخدلغة فيه وقرئ لسان الذى يلحدون اليه والتحدمثله وألحد الرجل أى ظلم
  فى الحرم وأصله من قوله تعالى ومن يردفيه بالحاد بظلم أى الحاد ابظ-لم والباءفيه
  زائدة قال حددين تور
  قدنى من نصر الخبيبين قد • ليس الامام بالشحيح الملحد أى الجائربمكه
  واللهد بالتسكين الشق فى جانب القبر واللحد بااضم لغة فيه تقول لحدت للقبر لحدا وألحدت
  له أيضافهو مهد والملتحد الملجألان اللاجى يمسل اليه دد: الاصمعى اللديدان جانبا
  الوادى قال ومنيماً خذ اللدود وهو مايصب من الادوية فى أحسدشقى القم قال ابن السكيت
  يقال فى المثل جرى منه مجرى اللدود وبجعه ألدة وقدلد الرجل فهوملدود وألددته أنا
  والتدهو قال ابن أحر
  شربت الشكاعى والتددت ألدّة * وأقبلت أفواه العروق المكاويا
  واللديد مثل اللدود واللديدان صفحتا العنق وجعه ألدة ومنه اشتقاق قولهم فلان يتلدد
  اى
