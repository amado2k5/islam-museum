text: "… حديث عمرو بن الحارث الخزاعى ماترك النبى - أى عند موته - إلا سلاحه الحديث وقد تقدم فى الوصايا، وسيأتى شرحه فى المغازى. وزعم الكرمانى أن مناسبته للترجمة أنه مات وعليه دين ولم يبع فيه شيئاً من سلاحه ولو كان …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 114، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 114, that mentions a testament or parting counsel, a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 114 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 2, pág. 114, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, lo que quedó: patrimonio y herencia; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fath al-Bari d'Ibn Hajar, volume 2, page 114, mentionnant un testament ou des dernières volontés, le lit de mort et les dernières heures, ainsi que les biens et l'héritage laissés. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn Hajar'ın Fath al-Bari adlı eserinin resimli 2. cildinin 114. sayfasında, vasiyetname veya kesin miras, ölüm zamanı ve geride bırakılan mal varlığı ve miras hakkında bilgi verilmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Fath al-Bari karya Ibn Hajar, jilid 2 bergambar, halaman 114, menyebutkan surat wasiat atau testamen terakhir, waktu kematian, dan harta warisan yang ditinggalkan; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Shrines Browser."
