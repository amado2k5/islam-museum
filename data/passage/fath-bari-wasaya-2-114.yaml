text: "… حديث عمرو بن الحارث الخزاعى ماترك النبى - أى عند موته - إلا سلاحه الحديث وقد تقدم فى الوصايا، وسيأتى شرحه فى المغازى. وزعم الكرمانى أن مناسبته للترجمة أنه مات وعليه دين ولم يبع فيه شيئاً من سلاحه ولو كان …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 114، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 114, that mentions a testament or parting counsel, a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 114 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
