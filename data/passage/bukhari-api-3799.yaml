label: { ar: "صحيح البخاري 3799 — وصية أو عهد أخير", en: "Sahih al-Bukhari 3799 — a testament or parting counsel", ur: "صحیح بخاری 3799 — وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 3799 — un testamento o consejo de despedida" }
text: "… مَجْلِسَ النَّبِيِّ مِنَّا. فَدَخَلَ عَلَى النَّبِيِّ فَأَخْبَرَهُ بِذَلِكَ ـ قَالَ ـ فَخَرَجَ النَّبِيُّ وَقَدْ عَصَبَ عَلَى رَأْسِهِ حَاشِيَةَ بُرْدٍ ـ قَالَ ـ فَصَعِدَ الْمِنْبَرَ وَلَمْ يَصْعَدْهُ بَعْدَ ذَلِكَ الْيَوْمِ، فَحَمِدَ اللَّهَ وَأَثْنَى عَلَيْهِ، ثُمَّ قَالَ \" أُوصِيكُمْ بِالأَنْصَارِ، فَإِنَّهُمْ كَرِشِي وَعَيْبَتِي، وَقَدْ قَضَوُا الَّذِي عَلَيْهِمْ، وَبَقِيَ الَّذِي لَهُمْ، فَاقْبَلُوا مِنْ مُحْسِنِهِمْ، وَتَجَاوَزُوا عَنْ مُسِيئِهِمْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3799، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3799 (Merits of the Helpers in Madinah (Ansaar)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3799، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3799 (Méritos de los Ayudantes en Medina (Ansar)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
