ref: "p. 115"
label: { ar: "دلائل النبوة للبيهيقي — الماء من بين الأصابع يوم الحديبية", en: "Bayhaqi's Dala'il — water from between the fingers at al-Hudaybiyya", ur: "بیہقی کی دلائل — حدیبیہ کے دن انگلیوں کے درمیان سے پانی" }
text: "عطش الناس يوم الحديبية، فوضع رسول الله يده في الركوة فجعل الماء يثور بين أصابعه مثل العيون، فشربوا وتوضؤوا"
summary:
  ar: "يذكر البيهيقي في باب معجزات الحديبية أن الناس عطشوا يوم الحديبية وكان معهم ماء قليل في ركوة يتوضأ منه النبي، فلما جهش الناس نحوه وضع يده فيها فجعل الماء يثور من بين أصابعه كأنه العيون، فشربوا وتوضؤوا واكتفوا، وذكرت جابر بن عبد الله أن القوم كانوا ألفاً وخمسمائة وقال: لو كنا مائة ألف لكفانا. ويعقب أن البخاري أخرجه في كتاب المغازي ومسلم في باب غزوة الحديبية."
  en: "At al-Hudaybiyya the people were thirsty and had only a little water in a bowl from which the Prophet was performing ablution. When they pressed toward him he put his hand in the bowl and water gushed from between his fingers like springs; they drank, performed ablution and had enough. Jabir reported the company numbered fifteen hundred and said: had we been a hundred thousand it would have sufficed. Al-Bukhari and Muslim both transmit the report."
  ur: "حدیبیہ کے دن لوگ پیاسے تھے اور ان کے پاس ایک کٹورا پانی تھا جس سے نبی وضو کر رہے تھے۔ جب لوگ اس کی طرف بڑھے تو اس نے ہاتھ ڈبے میں رکھا تو پانی انگلیوں کے درمیان سے چشموں کی طرح ابل پڑا؛ انہوں نے پیا، وضو کیا اور ان کی پیاس بجھ گئی۔ جابر نے بتایا کہ وہ پنچارہ سو تھے اور کہا کہ ہم ایک لاکھ بھی ہوتے تو یہی پانی کافی ہوتا۔ بخاری نے اسے کتاب المغازي میں اور مسلم نے غزوہ حدیبیہ کے باب میں روایت کیا ہے۔"
