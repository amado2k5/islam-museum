text: "… فِي الرَّابِعَةِ فَاقْتُلُوهُ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي هُرَيْرَةَ وَالشَّرِيدِ وَشُرَحْبِيلَ بْنِ أَوْسٍ وَجَرِيرٍ وَأَبِي الرَّمَدِ الْبَلَوِيِّ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو. قَالَ أَبُو عِيسَى حَدِيثُ مُعَاوِيَةَ هَكَذَا رَوَى الثَّوْرِيُّ أَيْضًا عَنْ عَاصِمٍ عَنْ أَبِي صَالِحٍ عَنْ مُعَاوِيَةَ عَنِ النَّبِيِّ. وَرَوَى ابْنُ جُرَيْجٍ وَمَعْمَرٌ عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ عَنْ أَبِيهِ عَنْ أَبِي هُرَيْرَةَ عَنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1444، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 1444 (The Book on Legal Punishments (Al-Hudud)), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 1444، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
