label: { ar: "الأربعون 40 — كن في الدنيا كأنك غريب أو عابر سبيل", en: "Arba'un 40 — be in this world as a stranger or a wayfarer" }
text: "كن في الدنيا كأنك غريب أو عابر سبيل"
summary:
  ar: "حديث ابن عمر قال: أخذ رسول الله بمنكبي فقال: «كن في الدنيا كأنك غريب أو عابر سبيل» — وكان ابن عمر يقول: «إذا أمسيت فلا تنتظر الصباح وإذا أصبحت فلا تنتظر المساء وخذ من صحتك لمرضك ومن حياتك لموتك» — وهو الحديث الأربعون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه البخاري (6416) عن علي بن المديني عن محمد بن عبد الرحمن الطفاوي عن الأعمش عن مجاهد عن ابن عمر، وقد تكلم غير واحد من الحفاظ في لفظة «حدثنا مجاهد» وقالوا هي غير ثابتة وأنكروها على ابن المديني إذ لم يسمع الأعمش هذا الحديث من مجاهد إنما سمعه من ليث بن أبي سليم عنه، وذكر ذلك العقيلي وغيره؛ وخرجه الترمذي (2333) من حديث ليث عن مجاهد وزاد «وعد نفسك من أهل القبور» وزاد في كلام ابن عمر «فإنك لا تدري يا عبد الله ما اسمك غداً»؛ وخرجه ابن ماجه (4114) ولم يذكر قول ابن عمر؛ وخرجه أحمد والنسائي من حديث الأوزاعي عن عبدة بن أبي لبابة عن ابن عمر بلفظ «اعبد الله كأنك تراه وكن في الدنيا كأنك غريب أو عابر سبيل» — وعبدة أدرك ابن عمر واختلف في سماعه منه، قال أحمد لقيه بالشام وقال أبو حاتم رآه رؤية؛ قال ابن رجب: هذا الحديث أصل في قصر الأمل في الدنيا وأن المؤمن لا ينبغي له أن يتخذ الدنيا داراً ووطناً فيطمئن إليها (جامع العلوم والحكم ص 810–823)."
  en: "The hadith of Ibn Umar that the Messenger of God took hold of his shoulder and said 'be in this world as though a stranger or a wayfarer' — and Ibn Umar used to say 'when you reach evening do not await the morning, and when you reach morning do not await the evening, and take from your health for your sickness and from your life for your death' — the fortieth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by al-Bukhari (6416) through Ali ibn al-Madini from Muhammad ibn Abd al-Rahman al-Tufawi from al-A'mash from Mujahid from Ibn Umar; more than one memoriser objected to the wording 'Mujahid told me', holding it unproven against Ibn al-Madini since al-A'mash had not heard this hadith from Mujahid but from Layth ibn Abi Sulaym from him, as al-Uqayli and others recorded; al-Tirmidhi (2333) carries it through Layth from Mujahid with the addition 'count yourself among the people of the graves' and in Ibn Umar's saying 'for you do not know, son of Abdullah, what your name will be tomorrow'; Ibn Majah (4114) omits Ibn Umar's saying; and Ahmad and al-Nasa'i transmit through al-Awza'i from Abda ibn Abi Lubaba from Ibn Umar in the wording 'worship God as though you see Him, and be in this world as a stranger or a wayfarer' — Abda having met Ibn Umar while his hearing from him was disputed, Ahmad saying he met him in Syria and Abu Hatim that he only saw him once; Ibn Rajab called this hadith a foundation of curbing hopes in this world, such that the believer should not take it as his lasting home and settle into it (Jami' al-Ulum wal-Hikam pp. 810–823)."
