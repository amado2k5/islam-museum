summary:
  ar: "القسم 9 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحج عن رسول الله»، ويضم فيها النصوص من 809 إلى 964 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 9 of Jami' al-Tirmidhi (The Book on Hajj) in the division of the open hadith dataset the museum took its reports from: reports 809 to 964 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 9، عنوان «کتاب الحج عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 809 تا 964۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 9 de Jami' al-Tirmidhi (El Libro del Hajj) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 809 al 964, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 9 de Jami' al-Tirmidhi (Le Livre du Hajj), qui comprend les hadiths 809 à 964 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
