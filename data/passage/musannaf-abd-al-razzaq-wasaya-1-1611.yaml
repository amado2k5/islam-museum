text: "… شئت فلا تُوجّها، لكن اجعل القبر إلى القبلة، قبر رسول اللّٰه علي، وقبر عمر، وقبر أَبي بكر إلى القبلة. - عبد الرزاق عن ابن جريج عن إسماعيل بن أُمية أَن إنساناً حين حضر ابن المسيب الموتُ وهو مستلق قال : …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 1611، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 1611, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 1611 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento del Musannaf de Abd al-Razzaq, volumen 1, pág. 1611, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 1, page 1611, mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Abdülrazzak'ın Musannaf adlı eserinin Resimli Cilt 1, s. 1611'den bir alıntı; ölüm ve vefat zamanı, defin, mezar ve istirahat yeri konularını içermektedir; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, hlm. 1611, yang menyebutkan saat kematian dan wafat, penguburan, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
