text: "… مِنَ الإيمانِ. وفي الصحيحين صحيح البخاري، وصحيح مسلم و عن أبي هُريرة قال : الحياءُ شُعبةٌ من الإيمان. وفي الصحيحين صحيح البخاري، وصحيح مسلم عن عمران بن حصين، عن النَّبيِّ ليهِ قال : الحياءُ لا يأتي إلا بخيرٍ، وفي بعد …"
