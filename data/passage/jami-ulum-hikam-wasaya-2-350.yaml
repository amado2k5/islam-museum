  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 350 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
