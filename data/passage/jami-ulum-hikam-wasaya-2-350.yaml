text: "… مبدٌ الله إلا ملأ اللّٰه جوفَه إيماناً. وخرَّج أبو داود معناه من رواية بعضِ الصحابة، عن النَّبيِّ وَيِيِ وقال : ملأه اللّٰه أمناً وإيمانا. وقال ميمونُ بن مِهران : جاء رجلٌ إلى سلمان، فقال : يا أبا عبد اللّٰه أوصني، …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 350، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
