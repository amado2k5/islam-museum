label: { ar: "الموطأ 425 — ابن عمر لا يمر بين يدي أحد ولا يدع أحداً يمر بين يديه", en: "Muwatta 425", es: "Muwatta 425", fr: "Muwatta 425", ur: "موطا 425", tr: "El-Muvatta 425 — İbn Ömer kimsenin önünden geçmez, kimsenin de kendisinin önünden geçmesine izin vermez.", id: "Al-Muwatta 425 — Ibnu Umar tidak mendahului siapa pun, dan dia juga tidak mengizinkan siapa pun mendahuluinya." }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان لا يمر بين يدي أحد ولا يدع أحداً يمر بين يديه؛ وهو في باب التشديد في أن يمر أحد بين يدي المصلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.221}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Abdullah ibn Umar'ın ne kimsenin önünden geçtiği ne de kimsenin önünden geçmesine izin verdiği belirtilmektedir; bu, namaz kılan bir kişinin önünden geçmenin kesinlikle yasaklanmasıyla ilgilidir. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suwaid ve Abd al-Razzaq tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.221}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’ menyatakan bahwa Abdullah ibn Umar tidak akan melewati siapa pun dan tidak pula mengizinkan siapa pun melewatinya; ini berkaitan dengan larangan keras bagi siapa pun untuk melewati orang yang sedang shalat. Editor menyebutkan bahwa riwayat ini dinarasikan oleh Abu Mus’ab, Suwaid, dan Abd al-Razzaq dari Malik. {cite:muwatta-maruf-1997 p.221}"
