  ⁦(ياب الد_]_ل)⁩
  اذا امتهنوا الرجل فى -واتجهم قال الكميت يصف ناقته
  معكوسة كعود الشول أنطقها * عكس الرعاء بإيضاع وتكرار
  ويال للقعود أيضاقعدة بالضم يقال نعم القعدة هذا أى نم المقتعد والمقاعدمواضع قمود
  النام فى الاسواق وغيرها وقواهم *و.ف ممد القابلة أى فى القرب وذلا اذ الصق به من بين
  يديه والتعيدات السروج والرحال والقعمد المقاعد وقوله تعالى عن المين وعن الشمال قعا
  وهماقعيدان وفعيل وفعول ممايستوى فيه الواحسدوالاثنان والهم كقوله تعالى انارسول
  ربك وقوله تعالى والملائكة بعدذ لل ظهي والقعيد الجراد الذى لم بستوجناحه بعد
  والقعيدة الغرارة قال أبوذؤيب
  همن كسبهنّ معدلحات * قعائددملتن من الوشيق
  والقعيدة من الرمل التى ليست بستطيلة وقعيدة الحسل امر أنه وكذلك فعاده قال
  الشاعر عبد اللّٰه بن أو فى الحزاعى فى امرأته
  فبئست قعاد الفق وحدها • وبئست موفية الاربع
  والقعيد من الوحش ما يأتيك من ورائك وه وخلاف النطيح وأنشدا بوعبيدة
  ولقد برى اهم فلم يتعيفوا • ئيس قعيد كالوشيجة أعضب
  وقولهسم قعبدل"لاآتيك وقميدك اللّٰه لا آتيك وقعدك اللّٰه لا آتيك يمين للعرب وهى مصادر
  استعمات منصوبة بفعل مضر والمعني بساحبك الذى هو صاحب كل تجوى كايقال
  نشدتك اللّٰه والاقعاد والقعادداء يأخذ الابل فى أوراكها فيملها الى الارض والاقعاد
  - فى رحل الفرس أن تقوّس جدا فلا تنتصب والمقعد الاعرج تقول منه اقعد الرجل يقال
  مق أصابك هذا القعاد والمفسعد من الذدى الناهد الذى لم ينتن بعد قال المابغة
  والبطن ذوعكن لطيف طيه * والانب تنفجه بثدى مقعد
  ورجل قعدد وتعدداذا كان قريب الا با االى الحد الاكبر وكان يقال لعبد الصمد بن
  على بن عبد اللّٰه بن عباس قعددبى هائم ويمدح به من وجه لانّ الولا للكبر ويدم به من
  وجه لأنه من أولاد الهرمى وينسب الى الضعف قال الشاعردريد
  دعانى أخى والخيل بيف وبينه • فلمادعانى لم يجدنى بقعدد
  وقال الاعشى
  ظريفون ولادون كل مبارك • احرون لايرثون سمم القعدد
  ⁦(ققد)⁩ الاقفد من الناس الذى يمشى على صدوردميه من قبل الاصابع ولا تاخ
  عقباه الارض ومن الدواب المنتصب الرسغ فى اقبال على الخافر ويشال فرس أففد بين القفد
  وهو عيب قال أبو عبيدة والقفدلا يكون الافى الرحل وقال الاصمعى القفد أن يميل خف
  البعير من اليدأً والرجل الى الجانب الانسى وقد ققد فهوأقفدفان مال الى الوحشى تفهو
  أصدف وقال الشاعر الراعى
  من معشر كلت باللوم أعينهم • ققدالا كف لشام غير صياب
  أ والقفد جنس من العمة بقال اعتم القفداء اذا لم يسدل طرفها والقفدان بالتحريك فارسى
  معرب
