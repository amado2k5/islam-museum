text: "… لَيُؤْمِنَنَّ بِهِ قَبْلَ مَوْتِهِمْ أي أهل الكتاب، قال النووي هذا ليس من أهل الكتاب أحد يحضره الموت إلا آمن عند المعاينة قبل خروج روحه بعيسى وأنه عبد اللّٰه وابن أمته، ولكن لا ينفعه هذا الإيمان في تلك الحالة كما قال …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 90، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 1, p. 90, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 1، ص 90 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
