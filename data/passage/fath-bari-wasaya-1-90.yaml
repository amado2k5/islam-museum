  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, jilid 1 bergambar, halaman 90, yang menyebutkan saat kematian dan menjelang kematian; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
