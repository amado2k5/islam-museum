text: "… ذلك من السمَاع واللهو وغير ذلك فينبغى أَن يقال ما كان من ذلك مباحا بحيث يتعيَّن السرور بذلك اليوم لا بأس بإلحاقه به، ومهما كان حراما أَو مكروها فيُمْنع وكذا ما كان خلاف الأَوْلى. انتهى. وقال شيخ القراء الحافظ أَبو …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 656، يرد فيه ذكر المكروه، والكراهة، والمباح، وما لا بأس به، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 656, whose wording mentions the disliked (makruh), dislike (karaha), the permitted (mubah), what is said to be no harm, the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 656 کا اقتباس جس میں مکروہ، کراہت، مباح، جس میں کوئی مضائقہ نہیں، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subul al-Huda wa-l-Rashad de al-Salihi, volume numérisé 4, p. 656, dont le texte mentionne le réprouvé (makruh), la réprobation (karaha), le permis (mubah), ce qui est dit sans inconvénient, l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subul al-Huda wa-l-Rashad de al-Salihi, volumen digitalizado 4, p. 656, cuyo texto menciona lo reprobado (makruh), la reprobación (karaha), lo permitido (mubah), lo que se dice que no tiene inconveniente, lo prohibido (haram); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" (Hida ve Doğruluk Yolları) adlı eserinin 4. cildinin 656. sayfasından bir alıntı, mekruh, kınanacak, caiz, kabul edilebilir ve haram olan şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu alıntı, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar üzerine araştırmalar yapan bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Salihi \"Subul al-Huda wa al-Rashad\" (Jalan Petunjuk dan Kebajikan), Jilid 4, halaman 656, membahas tentang apa yang tidak disukai, tercela, diperbolehkan, dapat diterima, dan dilarang. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
