label: { ar: "صحيح مسلم 5322 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 5322 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 5322 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 5322 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 5322 — mentions de nations, religions et peuples non musulmans", tr: "Sahih Müslim 5322 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih Muslim 5322 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "وَحَدَّثَنَا الْحَسَنُ بْنُ عَلِيٍّ الْحُلْوَانِيُّ، حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، حَدَّثَنَا أَبِي قَالَ، سَمِعْتُ جَرِيرَ بْنَ زَيْدٍ، يُحَدِّثُ عَنْ عَمْرِو بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ رَأَى أَبُو طَلْحَةَ رَسُولَ اللَّهِ مُضْطَجِعًا فِي الْمَسْجِدِ يَتَقَلَّبُ ظَهْرًا لِبَطْنٍ فَأَتَى أُمَّ سُلَيْمٍ فَقَالَ إِنِّي رَأَيْتُ رَسُولَ اللَّهِ مُضْطَجِعًا فِي الْمَسْجِدِ يَتَقَلَّبُ ظَهْرًا لِبَطْنٍ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5322، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5322 (The Book of Drinks), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 5322، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 5322 (El Libro de las Bebidas), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih Muslim, n° 5322 (Le Livre des Boissons), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih Müslim'de 5322 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5322, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
