text: "… وقد أودى الميت بأن يؤدى جميع ذلك بأيهم يبدأ اذا لم يكن يحمل الثاث جميع ذلك قال يبدأ بالزكاة ثم بالعتق الواجب من الظهار أو قتل النفس ولا يبدأ أحدهما على صاحبه ويبديان على العتق التطوع والعتق التطوع بعينه يبدأ …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 99، يرد فيه ذكر الواجب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 99, whose wording mentions the obligatory (wajib), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 99 کا اقتباس جس میں واجب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 1, p. 99, dont le texte mentionne l'obligatoire (wajib), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
