  tr: "Büyük Blog, Resimli Cilt 1, sayfa 99'dan, zorunlu ve gönüllü eylemlerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu eylemler, görevler, itaat eylemleri, tavsiye edilen eylemler, hoş karşılanmayan eylemler, yasak eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Great Blog, Volume 1 Bergambar, halaman 99, yang menyebutkan tindakan wajib dan sukarela; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk tindakan wajib, kewajiban, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa kecil."
