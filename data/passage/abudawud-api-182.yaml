label: { ar: "سنن أبي داود 182 — أطوار خلق الجنين", en: "Sunan Abi Dawud 182 — the stages of the embryo", ur: "سنن ابی داؤد 182 — جنین کے مراحل", es: "Sunan Abi Dawud 182 — Las etapas del embrión", fr: "Sunan Abi Dawud 182 — les stades de l'embryon", tr: "Sunan Abi Davud 182 — Embriyonik Gelişimin Evreleri", id: "Sunan Abi Dawud 182 — Tahapan Perkembangan Embrio" }
text: "… اللَّهِ فَجَاءَ رَجُلٌ كَأَنَّهُ بَدَوِيٌّ فَقَالَ يَا نَبِيَّ اللَّهِ مَا تَرَى فِي مَسِّ الرَّجُلِ ذَكَرَهُ بَعْدَ مَا يَتَوَضَّأُ فَقَالَ \" هَلْ هُوَ إِلاَّ مُضْغَةٌ مِنْهُ \". أَوْ قَالَ - \" بَضْعَةٌ مِنْهُ \". قَالَ أَبُو دَاوُدَ رَوَاهُ هِشَامُ بْنُ حَسَّانَ وَسُفْيَانُ الثَّوْرِيُّ وَشُعْبَةُ وَابْنُ عُيَيْنَةَ وَجَرِيرٌ الرَّازِيُّ عَنْ مُحَمَّدِ بْنِ جَابِرٍ عَنْ قَيْسِ بْنِ طَلْقٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 182، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 182 (Purification (Kitab Al-Taharah)), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 182، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 182 (Purificación (Kitab Al-Taharah)), menciona las etapas del embrión. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 182 (Purification (Kitab Al-Taharah)), mentionne les stades de développement de l'embryon. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 182 numaralı hadis, fetüsün gelişim aşamalarını anlatmaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 182, menjelaskan tahapan perkembangan janin. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
