label: { ar: "سنن النسائي 936 — الأحرف السبعة، قراءات القرآن", en: "Sunan al-Nasa'i 936 — the seven ahruf; the readings of the Qur'an", ur: "سنن نسائی 936 — سبعہ احرف، قرآن کی قراءتیں", es: "Sunan al-Nasa'i 936 — los siete ahruf; las lecturas del Corán", fr: "Sunan al-Nasa'i 936 — les sept ahruf; les lectures du Coran" }
text: "… سُورَةَ الْفُرْقَانِ وَإِنِّي سَمِعْتُ هَذَا يَقْرَأُ فِيهَا حُرُوفًا لَمْ تَكُنْ أَقْرَأْتَنِيهَا. فَقَالَ رَسُولُ اللَّهِ \" اقْرَأْ يَا هِشَامُ \". فَقَرَأَ كَمَا كَانَ يَقْرَأُ فَقَالَ رَسُولُ اللَّهِ \" هَكَذَا أُنْزِلَتْ \". ثُمَّ قَالَ \" اقْرَأْ يَا عُمَرُ \". فَقَرَأْتُ فَقَالَ \" هَكَذَا أُنْزِلَتْ \". ثُمَّ قَالَ رَسُولُ اللَّهِ \" إِنَّ الْقُرْآنَ أُنْزِلَ عَلَى سَبْعَةِ أَحْرُفٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 936، يذكر الأحرف السبعة، وقراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan al-Nasa'i, no. 936 (The Book of the Commencement of the Prayer), that mentions the seven ahruf, the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن نسائی کی حدیث نمبر 936، جس میں سبعہ احرف، قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 936 (El Libro del Inicio de la Oración), menciona los siete ahruf, las lecturas del Corán. El explorador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan al-Nasa'i, n° 936 (Le Livre du Commencement de la Prière), mentionne les sept ahruf, les lectures du Coran. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la sira et les ouvrages traitant de ce sujet."
