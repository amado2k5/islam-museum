label: { ar: "الموطأ 2547 — مالك: عقل الموالي تلزمه العاقلة وتعاقل الناس في زمن النبي وأبي بكر", en: "Muwatta 2547" }
summary:
  ar: "قال مالك في عقل الموالي: تلزمه العاقلة إن شاؤوا، وإن أبوا كانوا أهل ديوان أو مُقطعين. وقد تعاقل الناس في زمن رسول الله بالعاقلة، وفي زمن أبي بكر الصديق قبل أن يكون ديوان؛ وإنما كان الديوان في زمان عمر بن الخطاب، فليس لأحد أن يعقل عنه غير قومه ومواليه؛ لأن الولاء لا ينتقل، ولأن النبي قال: الولاء لمن أعتق. قال مالك: والولاء نسب ثابت. {cite:muwatta-maruf-1997 p.442}"
