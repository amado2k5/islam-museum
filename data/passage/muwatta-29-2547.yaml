label: { ar: "الموطأ 2547 — مالك: عقل الموالي تلزمه العاقلة وتعاقل الناس في زمن النبي وأبي بكر", en: "Muwatta 2547", es: "Muwatta 2547", fr: "Muwatta 2547", ur: "موطا 2547", tr: "El-Muvatta 2547 — Malik: Azat edilen kölenin kan parası kabilenin sorumluluğundadır ve bu, Peygamber ve Ebu Bekir zamanındaki insanların uygulamasıydı.", id: "Al-Muwatta 2547 — Malik: Uang darah seorang budak yang dibebaskan adalah tanggung jawab klan, dan ini adalah praktik yang dilakukan orang-orang pada zaman Nabi dan Abu Bakar." }
summary:
  ar: "قال مالك في عقل الموالي: تلزمه العاقلة إن شاؤوا، وإن أبوا كانوا أهل ديوان أو مُقطعين. وقد تعاقل الناس في زمن رسول الله بالعاقلة، وفي زمن أبي بكر الصديق قبل أن يكون ديوان؛ وإنما كان الديوان في زمان عمر بن الخطاب، فليس لأحد أن يعقل عنه غير قومه ومواليه؛ لأن الولاء لا ينتقل، ولأن النبي قال: الولاء لمن أعتق. قال مالك: والولاء نسب ثابت. {cite:muwatta-maruf-1997 p.442}"
  id: "Malik berkata mengenai uang darah untuk budak yang dibebaskan: Klan wajib membayarnya jika mereka mau, dan jika mereka menolak, mereka akan didaftarkan dalam daftar atau telah diberikan bagian tetap. Orang-orang biasa membayar uang darah pada zaman Rasulullah melalui klan, dan pada zaman Abu Bakar al-Siddiq sebelum daftar didirikan. Daftar didirikan pada zaman Umar bin al-Khattab. Tidak seorang pun selain kaumnya sendiri dan budak yang dibebaskan dapat membayar uang darah atas namanya, karena hak waris tidak dapat dialihkan, dan karena Nabi bersabda: Warisan adalah milik orang yang membebaskan budak. Malik berkata: Warisan adalah garis keturunan tetap. {cite:muwatta-maruf-1997 p.442}"
