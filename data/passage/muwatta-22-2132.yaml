label: { ar: "الموطأ 2132 — يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب: قال رسول الله لا يغلق الرهن", en: "Muwatta 2132", es: "Muwatta 2132", fr: "Muwatta 2132", ur: "موطا 2132", tr: "El-Muvatta 2132 — Yahya, Malik'ten, o da İbn Şihab'tan, o da Said bin el-Musayyab'dan rivayetle: Allah'ın Resulü şöyle buyurdu: \"Bir söz, asla kapatılmaz.\"", id: "Al-Muwatta 2132 — Yahya dari Malik dari Ibn Shihab dari Saeed bin Al-Musayyab: Rasulullah SAW bersabda: “Suatu perjanjian tidak boleh dibatalkan.”" }
summary:
  ar: "قال يحيى: حدثنا مالك عن ابن شهاب عن سعيد بن المسيب أن رسول الله قال: لا يغلق الرهن. ويذكر المحقق أن ما رواه معن بن عيسى موصولا من حديث أبي هريرة وهم، وأن المرسل هو الأصح. {cite:muwatta-maruf-1997 p.271}"
  tr: "Yahya şöyle dedi: Malik bize İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet etti ki, Allah Resulü şöyle buyurmuştur: \"Rehin bozulamaz.\" Araştırmacı, Ma'n ibn İsa'nın Ebu Hurayra'dan nakledilen ve isnad zinciriyle bağlantılı olan rivayetin hatalı olduğunu ve mursal (ayrık) rivayetin daha doğru olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.271}"
  id: "Yahya berkata: Malik meriwayatkan kepada kami dari Ibn Shihab, dari Sa'id ibn al-Musayyab, bahwa Rasulullah SAW bersabda: \"Suatu janji tidak boleh disita.\" Peneliti menyebutkan bahwa apa yang diriwayatkan Ma'n ibn 'Isa dengan sanad yang terhubung dari Abu Hurayrah adalah keliru, dan bahwa riwayat mursal (terputus) lebih akurat. {cite:muwatta-maruf-1997 p.271}"
