text: "- باب استحباب جعل النوافل في البيت سواء الراتبة وغيرها والأمر بالتحول للنافلة من موضع الفريضة أو الفصل بينهما بكلام - عَنْ زيدِ بن ثابتِ، أَنَّ النَّبَّ اللَام قالَ : صلُّوا أيُّها النَّاسُ في بُيُوتِكُمْ، فَإِنَّ أفضلَ الصَّلَّاةِ لاةُ المَوْءِ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 242، يرد فيه ذكر الفريضة والفرائض، والمستحب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
