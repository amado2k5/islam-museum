text: "- باب استحباب جعل النوافل في البيت سواء الراتبة وغيرها والأمر بالتحول للنافلة من موضع الفريضة أو الفصل بينهما بكلام - عَنْ زيدِ بن ثابتِ، أَنَّ النَّبَّ اللَام قالَ : صلُّوا أيُّها النَّاسُ في بُيُوتِكُمْ، فَإِنَّ أفضلَ الصَّلَّاةِ لاةُ المَوْءِ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 242، يرد فيه ذكر الفريضة والفرائض، والمستحب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 242, whose wording mentions the obligation (farida), the recommended (mustahabb), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 242 کا اقتباس جس میں فریضہ اور فرائض، مستحب، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin de al-Nawawi, volume numérisé 3, p. 242, dont le texte mentionne l'obligation (farida), le recommandé (mustahabb), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen digitalizado 3, p. 242, cuyo texto menciona la obligación (farida), lo recomendado (mustahabb), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin 3. cildinin 242. sayfasından, farz olan, sünnet edilen ve nafile olan amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan, itaat gerektiren, sünnet edilen, mekruh edilen, haram olan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Jilid 3, halaman 242, yang menyebutkan amalan wajib, amalan anjuran, dan amalan sunnah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
