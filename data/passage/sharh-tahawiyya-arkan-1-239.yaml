text: "… الآخر. فسر الطحاوي الإيمان في هذا الموضع بما فسره به النبي وَلِ يميه في حديث جبريل، فهذه الأصول الستة هي: أركان الإيمان، أو أصوله، أو أصول الاعتقاد: الإيمان بالله، والإيمان بالملائكة، والإيمان بالكتب، والإيمان بالرسل، والإيمان باليوم الآخر، والإيمان بالقدر، …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 239، يذكر أركان الإيمان، والإيمان بالقدر، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 239, that mentions the pillars of faith, belief in the decree, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 239 کا اقتباس جس میں ارکانِ ایمان، تقدیر پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 1, pág. 239, que menciona los pilares de la fe, la creencia en el decreto, uno de los artículos de fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 1, p. 239), mentionnant les piliers de la foi, la croyance au décret (un des articles de foi). Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi üzerine tefsirinin 1. cildinin 239. sayfasından, imanın esasları, kader inancı ve imanın esaslarından birini ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-Izz tentang Akidah al-Tahawi, Jilid 1, halaman 239, yang menyebutkan rukun iman, kepercayaan pada takdir, dan salah satu rukun iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
