text: "… عن محمد بن ذكوان، عن شهر بن حوشب، عن عمرو بن عبسة قال: أتيتُ الّبي لخم فقلتُ: ما الإسلام؟ قال: طيب الكلام، وإطعام الطعام قال: قلتُ: ما الإيمان؟ قال: الصبر والسماحة قلتُ: أيّ الإسلام أفضل؟ قال: من سلم المسلمون من …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 375، يذكر تعريف الإسلام بأعماله، والسؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 375, that mentions Islam defined by its acts, the question about faith and its answer, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 375 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Shu'ab al-Iman de al-Bayhaqi, vol. 10, pág. 375, que menciona el Islam definido por sus actos, la cuestión de la fe y su respuesta, la dulzura y la plenitud de la fe; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, vol. 10, p. 375, évoquant l'islam défini par ses actes, la question de la foi et sa réponse, ainsi que la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İmanın Dalları\" adlı eserinin 10. cildinin 375. sayfasından bir alıntı, İslam'ın amelleri üzerinden tanımlanmasını, imanla ilgili soru ve cevabı, imanın tatlılığını ve mükemmelliğini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 375, membahas definisi Islam melalui tindakannya, pertanyaan dan jawaban mengenai iman, serta keindahan dan kesempurnaan iman. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
