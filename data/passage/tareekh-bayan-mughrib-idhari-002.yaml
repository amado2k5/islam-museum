text: "وأعلم الوزراء بخضوع حسن بن قنون المنتزي عليه بالغرب، وأنه ورد عليه كتاب غالب بذلك، وأنه يوجه إليه ابنه علي بن حسن المذكور، وأن الخطبة قامت بدعوته في قلعة حجر النسر؛ فاستبشر الوزراء وعنؤه، وغبطوه وأعلنوا بالسكر لله تعالى والدعاء"
