text: "… ذلك أكملُ الجهاد وأتمُّه. جهاد أعداء اللّه فرع على جهاد النفس ولما كان جهاد أعداءِ اللَّهِ في الخارج فرعاً على جهادٍ العبد نفسه في ذات اللَّهِ، كما قال النبيَّ : المجاهِدُ مَنْ جَاهَدَ نَفْسَهُ في طَاعَةِ اللَّه، والمُهاجِرُ مَنْ هَجَرَ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 331، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 331, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 331 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
