text: "… واذا ذكرت حصول رجليك على ظهرى اشتد غيظى منك. توف يوم الثلاثاء لسبع بقين من المحرم وكانت مدة امارته شهرين وثلاثة عشر يوما وحمل تابوته إلى بغداد فدفن فى تربة ابنته بالمخرم وخلف الف الف • دينار مطيعية وعشرة آلاف …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 4، ص 81، يذكر ما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 4, p. 81, that mentions what was left behind: estate and inheritance, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 4، ص 81 کا اقتباس جس میں ترکہ اور میراث، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen 4, pág. 81, que menciona lo que se dejó atrás: patrimonio y herencia, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Muntazam d'Ibn al-Jawzi (tome 4, p. 81) mentionnant les biens laissés: succession, sépulture ou lieu de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin resimli 4. cildinin 81. sayfasından, mal varlığı, miras, defin, mezar ve türbesine dair bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, jilid 4 bergambar, halaman 81, yang menyebutkan harta warisan, harta pusaka, pemakaman, makam, dan tempat sucinya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Shrines Browser."
