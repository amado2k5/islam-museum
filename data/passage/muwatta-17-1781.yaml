label: { ar: "الموطأ 1781 — مالك عن رجل ثقة عنده عن عمرو بن شعيب عن أبيه عن جده: نهى رسول الله عن بيع العربان", en: "Muwatta 1781", es: "Muwatta 1781", fr: "Muwatta 1781", ur: "موطا 1781", tr: "El-Muvatta 1781 — Malik, güvenilir bir adamın rivayetine dayanarak, o da Amr ibn Şuayb'ın rivayetine dayanarak, o da babasının rivayetine dayanarak, o da dedesinin rivayetine dayanarak: Allah'ın Resulü peşinat satışını yasaklamıştır.", id: "Al-Muwatta 1781 — Malik, berdasarkan riwayat dari seorang yang terpercaya, berdasarkan riwayat dari Amr bin Syu'aib, berdasarkan riwayat dari ayahnya, berdasarkan riwayat dari kakeknya: Rasulullah melarang penjualan uang muka" }
summary:
  ar: "يروي يحيى عن مالك عن رجل ثقة عنده عن عمرو بن شعيب عن أبيه عن جده أن رسول الله نهى عن بيع العربان. ويذكر المحقق أن ابن عبد البر رأى أن الثقة عند مالك ربما كان ابن لهيعة، وأن القعنبي والتنيسي رووه بلفظ بلغه، لا عن ثقة عنده. {cite:muwatta-maruf-1997 p.129}"
  tr: "Yahya, Malik'ten, güvenilir bir adamdan, Amr ibn Şuayb'dan, babasından ve dedesinden rivayetle, Allah Resulü'nün 'arban'ın (peşinatlı bir satış türü) satışını yasakladığını nakletmiştir. Araştırmacı, İbn Abd el-Barr'ın, Malik'ten rivayet eden güvenilir adamın İbn Lahi'ah olabileceğine inandığını ve el-Ka'nabi ile el-Tunisi'nin bunu, güvenilir bir kişiden değil, kendilerine ulaşan bir ifadeyle naklettiklerini belirtmektedir. {cite:muwatta-maruf-1997 s.129}"
  id: "Yahya meriwayatkan dari Malik, dari seorang yang terpercaya, dari Amr ibn Shu'ayb, dari ayahnya, dari kakeknya, bahwa Rasulullah melarang penjualan 'arban (sejenis penjualan yang melibatkan uang muka). Peneliti menyebutkan bahwa Ibnu Abd al-Barr meyakini bahwa orang terpercaya yang meriwayatkan dari Malik mungkin adalah Ibnu Lahi'ah, dan bahwa al-Qa'nabi dan al-Tunisi meriwayatkannya dengan redaksi yang sampai kepada mereka, bukan dari orang terpercaya yang meriwayatkan darinya. {cite:muwatta-maruf-1997 p.129}"
