summary:
  ar: "يروي يحيى عن مالك عن رجل ثقة عنده عن عمرو بن شعيب عن أبيه عن جده أن رسول الله نهى عن بيع العربان. ويذكر المحقق أن ابن عبد البر رأى أن الثقة عند مالك ربما كان ابن لهيعة، وأن القعنبي والتنيسي رووه بلفظ بلغه، لا عن ثقة عنده. {cite:muwatta-maruf-1997 p.129}"
