text: "… النَّخْلَةُ، فَكَرِهْتُ أَنْ أَتَكَلَّمَ وَثَمَّ أَبُو بَكْرٍ وَعُمَرُ، فَلَمَّا لَمْ يَتَكَلَّمَا قَالَ النَّبِيُّ \" هِيَ النَّخْلَةُ \". فَلَمَّا خَرَجْتُ مَعَ أَبِي قُلْتُ يَا أَبَتَاهْ وَقَعَ فِي نَفْسِي أَنَّهَا النَّخْلَةُ. قَالَ مَا مَنَعَكَ أَنْ تَقُولَهَا لَوْ كُنْتَ قُلْتَهَا كَانَ أَحَبَّ إِلَىَّ مِنْ كَذَا وَكَذَا. قَالَ مَا مَنَعَنِي إِلاَّ أَنِّي لَمْ أَرَكَ وَلاَ أَبَا بَكْرٍ تَكَلَّمْتُمَا، فَكَرِهْتُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6144، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6144 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6144، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
