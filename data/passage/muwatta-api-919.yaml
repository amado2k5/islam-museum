label: { ar: "موطأ مالك 919 — الوجوب", en: "Muwatta Malik 919 — obligation (wujub)", ur: "موطأ مالک 919 — وجوب", fr: "Muwatta de Malik 919 — l'obligation (wujub)", es: "Muwatta de Malik 919 — la obligatoriedad (wujub)", tr: "Muwatta Malik 919 - Zorunluluk", id: "Muwatta Malik 919 — Kewajiban" }
text: "… قَالَ يَحْيَى سُئِلَ مَالِكٌ هَلْ يُرْمَى عَنِ الصَّبِيِّ وَالْمَرِيضِ فَقَالَ نَعَمْ وَيَتَحَرَّى الْمَرِيضُ حِينَ يُرْمَى عَنْهُ فَيُكَبِّرُ وَهُوَ فِي مَنْزِلِهِ وَيُهَرِيقُ دَمًا فَإِنْ صَحَّ الْمَرِيضُ فِي أَيَّامِ التَّشْرِيقِ رَمَى الَّذِي رُمِيَ عَنْهُ وَأَهْدَى وُجُوبًا. قَالَ مَالِكٌ لاَ أَرَى عَلَى الَّذِي يَرْمِي الْجِمَارَ أَوْ يَسْعَى بَيْنَ الصَّفَا وَالْمَرْوَةِ وَهُوَ غَيْرُ مُتَوَضِّئٍ إِعَادَةً وَلَكِنْ لاَ يَتَعَمَّدُ ذَلِكَ."
summary:
  ar: "حديث في موطأ مالك، رقم 919، يرد فيه ذكر الوجوب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 919 (Hajj), whose wording mentions obligation (wujub). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 919، جس کے الفاظ میں وجوب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 919, dont le texte mentionne l'obligation (wujub). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 919, cuyo texto menciona la obligatoriedad (wujub). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında 919 numaralı hadis, farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahları derleyen, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte metnin içeriğini açıklayan ancak buna dayanarak bir fetva vermeyen bir hadistir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 919, menyebutkan tentang kewajiban. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
