label: { ar: "الموطأ 2531 — مالك: الدية في العمد المقبولة على القاتل لا على العاقلة", en: "Muwatta 2531", es: "Muwatta 2531", fr: "Muwatta 2531", ur: "موطا 2531", tr: "Al-Muwatta 2531 — Malik: Kasıtlı cinayetlerde kan parası, klanın değil, katilin sorumluluğundadır.", id: "Al-Muwatta 2531 — Malik: Uang darah dalam kasus pembunuhan yang disengaja adalah tanggung jawab si pembunuh, bukan klan." }
summary:
  ar: "قال مالك: الأمر الذي لا اختلاف فيه عندنا، فيمن قُبلت منه الدية في قتل العمد أو في شيء من الجراح التي فيها القصاص: أن عقل ذلك لا يكون على العاقلة إلا أن يشاؤوا، وإنما عقل ذلك في مال القاتل أو الجارح خاصة إن وُجد له مال، فإن لم يوجد له مال كان دينا عليه، وليس على العاقلة منه شيء إلا أن يشاؤوا. {cite:muwatta-maruf-1997 p.436}"
  tr: "Malik şöyle dedi: Kasıtlı öldürme veya intikam gerektiren herhangi bir yaralanma durumunda kan parası kabul edilecek kişiyle ilgili olarak aramızda ihtilaf bulunmayan konu şudur: Kan parası, kabile tarafından, kabile kendi isteği dışında, karşılanmamalıdır. Aksine, kan parası, katilin veya yaralayanın, eğer zenginse, servetinden karşılanmalıdır. Eğer zengin değilse, bu onun borcudur ve kabile, kendi isteği dışında, bundan sorumlu değildir. {cite:muwatta-maruf-1997 s.436}"
  id: "Malik berkata: Hal yang tidak menimbulkan perselisihan di antara kita, mengenai siapa yang darinya uang darah diterima dalam kasus pembunuhan yang disengaja atau dalam setiap luka yang menjadi dasar pembalasan, adalah bahwa uang darah tersebut tidak ditanggung oleh klan kecuali jika mereka memilih demikian. Sebaliknya, uang darah tersebut harus ditanggung dari kekayaan si pembunuh atau orang yang menyebabkan luka, jika ia memiliki kekayaan. Jika ia tidak memiliki kekayaan, maka itu adalah hutang baginya, dan klan tidak bertanggung jawab atas sebagian pun darinya kecuali jika mereka memilih demikian. {cite:muwatta-maruf-1997 p.436}"
