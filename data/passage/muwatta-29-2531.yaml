summary:
  ar: "قال مالك: الأمر الذي لا اختلاف فيه عندنا، فيمن قُبلت منه الدية في قتل العمد أو في شيء من الجراح التي فيها القصاص: أن عقل ذلك لا يكون على العاقلة إلا أن يشاؤوا، وإنما عقل ذلك في مال القاتل أو الجارح خاصة إن وُجد له مال، فإن لم يوجد له مال كان دينا عليه، وليس على العاقلة منه شيء إلا أن يشاؤوا. {cite:muwatta-maruf-1997 p.436}"
