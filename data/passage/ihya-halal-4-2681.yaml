text: "… الذي يأخذه بقوة هؤلاء السكان فكأنه رضي في الثواب بمقدار بعضه حلال وبعضه حرام والحرام لم يدخل في أيدي السكان فهذا كالخلل المتطرق إلى الثمن وقد ذكرنا حكمه من قبل وأنه متى يقتضي التحريم ومتى يقتضي الشبهة وهذا لا يقتضي …"
summary:
