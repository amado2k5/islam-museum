text: "… الذي يأخذه بقوة هؤلاء السكان فكأنه رضي في الثواب بمقدار بعضه حلال وبعضه حرام والحرام لم يدخل في أيدي السكان فهذا كالخلل المتطرق إلى الثمن وقد ذكرنا حكمه من قبل وأنه متى يقتضي التحريم ومتى يقتضي الشبهة وهذا لا يقتضي …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 2681، يذكر الحلال، والحرام، والتحريم، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 2681, that mentions the lawful, the unlawful, prohibition, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 2681 کا اقتباس جس میں حلال، حرام، تحریم، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 2681, que menciona lo lícito, lo ilícito, lo prohibido y los asuntos dudosos; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 4, page 2681), mentionnant le licite, l'illicite, l'interdit et les sujets douteux; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Halal and Haram Browser."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 2681. sayfasından alınan bu alıntı, helal, haram, yasaklar ve şüpheli konuları ele almaktadır; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 4, halaman 2681, membahas hal-hal yang diperbolehkan, yang dilarang, larangan-larangan, dan hal-hal yang meragukan; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
