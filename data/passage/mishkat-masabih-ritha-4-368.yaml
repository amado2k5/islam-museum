text: "… رجع قبل أن تدفن، فإنه يرجع بقيراط.. متفق عليه. - وعنه، أن الني وَلية نعى للناس النجاشي اليوم الذي مات فيه، وخرج بهم إلى المصلى، فصف بهم، وكبر أربع تكبيرات. متفق عليه. - وعن عبدالرحمن بن أبي ليلى، قال: كان …"
