label: { ar: "مسلم 2577 — يا عبادي إني حرمت الظلم على نفسي", en: "Muslim 2577 — My servants, I have forbidden injustice for Myself", es: "Musulmán 2577 — ¡Oh siervos míos!, Yo he prohibido la injusticia para Mí.", fr: "Muslim 2577 — Mes serviteurs, J’ai interdit l’injustice envers Moi-même", ur: "مسلم 2577 - میرے بندو، میں نے ظلم کو اپنے اوپر حرام کر لیا ہے۔", tr: "Müslim 2577 — Ey kullarım! Ben haksızlığı kendi hakkımda haram kıldım.", id: "Muslim 2577 — Wahai hamba-hamba-Ku, Aku telah melarang perbuatan zalim bagi diri-Ku" }
text: "عن أبي ذر عن النبي فيما روى عن الله أنه قال: «يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرماً فلا تظالموا. يا عبادي كلكم ضال إلا من هديته فاستهدوني أهدكم، يا عبادي كلكم جائع إلا من أطعمته فاستطعموني أطعمكم، يا عبادي كلكم عار إلا من كسوته فاستكسوني أكسكم، يا عبادي إنكم تخطئون بالليل والنهار وأنا أغفر الذنوب جميعاً فاستغفروني أغفر لكم»"
summary:
  ar: "الحديث القدسي الجامع، رواية أبي ذر عن النبي فيما يروى عن ربه في كتاب البر من صحيح مسلم؛ تحريم الظلم على نفسه وجعله محرماً بين العباد، ثم أبواب الهداية والرزق والغفران — من أعظم نصوص العدل والرحمة."
  tr: "Ebu Zer'in, Peygamber Efendimiz'den rivayet ettiği, O'nun da Rabbinden naklettiği, Sahih Müslim'deki Salihlik Kitabı'nda yer alan kapsamlı kutsal hadis; haksızlığın bizzat kendisi için yasaklanması ve kullar arasında da haram kılınması, ardından hidayet, rızık ve bağışlanma kapılarının açılması - adalet ve merhametin en büyük metinlerinden biridir."
  id: "Hadits suci yang komprehensif, diriwayatkan oleh Abu Dharr dari Nabi, sebagaimana diriwayatkan dari Tuhannya, dalam Kitab Kebenaran di Sahih Muslim; melarang kezaliman bagi dirinya sendiri dan mengharamkannya di antara hamba-hamba-Nya, kemudian pintu-pintu petunjuk, rezeki, dan pengampunan — salah satu teks keadilan dan rahmat terbesar."
