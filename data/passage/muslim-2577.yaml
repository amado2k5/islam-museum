label: { ar: "مسلم 2577 — يا عبادي إني حرمت الظلم على نفسي", en: "Muslim 2577 — My servants, I have forbidden injustice for Myself" }
text: "عن أبي ذر عن النبي فيما روى عن الله أنه قال: «يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرماً فلا تظالموا. يا عبادي كلكم ضال إلا من هديته فاستهدوني أهدكم، يا عبادي كلكم جائع إلا من أطعمته فاستطعموني أطعمكم، يا عبادي كلكم عار إلا من كسوته فاستكسوني أكسكم، يا عبادي إنكم تخطئون بالليل والنهار وأنا أغفر الذنوب جميعاً فاستغفروني أغفر لكم»"
summary:
  ar: "الحديث القدسي الجامع، رواية أبي ذر عن النبي فيما يروى عن ربه في كتاب البر من صحيح مسلم؛ تحريم الظلم على نفسه وجعله محرماً بين العباد، ثم أبواب الهداية والرزق والغفران — من أعظم نصوص العدل والرحمة."
