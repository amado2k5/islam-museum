text: |-
  -ق اذايئس الرماة وأرسلوا
  ٢ ي نض بالفاءكمافى القاموس
  عثل قال الاضمعى التعثلة مشية مثل القعولة والمقشعلّ من السهام الذى لم يبربر يا
  فرميت القوم رشقاصائبا • ليس بالعصل ولا بالمقفعل
  ١ قفل القفل معروف والقفل بالفتح ما ييس من الشجر والقفيل مشله والقضل أيضانيت
  والقفيل السوط قال الراجز
  لما أتاك يا بساقرشبا * قت اليه بالقفيل ضربا
  ودرهم قفلة وازن والقفول الرجوع من السفروقد قفل يقفل بالضم والقافلة الرفقة الراجعة
  من السفر والقفول اليبوس وقد قفل يقفل بالسكسبر قال لبيد⁦(١)⁩
  غضفادوا جن قافلا أعصامها وخسل قوافل ضواهر وأقفله أى أيبسه وأقفلت الجند من
  مبعثهم وأقفل الباب وففل الابواب مثل أغلق وغلق ويقال للبغيل هومقفل اليدين
  والقيفال عرق فى الديفص دوهو معرب ⁦(قفعل)⁩ اقفعلت يداه اقفعلا لا أى تقبضت
  وتشتيت فشل) القفشليل المغرفة فارسى معرب ⁦( قل)⁩ القواقل قوم من انخزرج
  وكان يقال فى الجاهلية للرجل اذا استهار بيثرب قوقل ثم قد أمنت ⁦(قلل)⁩ شى قليل ويجعه
  قلل مثل سرير وسرر وقوم قليلون وقليل أيضاقال تعالى واذكروا اذ كنيم قليلا فكثركم
  وقد قلّ الشبى يقلّ قلد وأقله غيره وقلله بوهنى وقهه فى عينه أى أراه اياه قلي لا وأقل#افتقر
  وأقلّ الجرّة أطاق حلها والقلّ القلة مشل الذلّ والذلة بقال الحدللّه على القلّ والكثبر
  وماله قلّ ولا كثر وفى الحديث الرباوان كثرفهو الى قلّ وأنشد الاصمعي
  قد يقصر القلّ الفنى دون همه * وقد كان لولا القل طلاع أنجد
  ويقال حوقل بن قلّ اذا كان لا يعرف هو ولا أبواه وقواهسم لم يترك قليلا ولا كثيرا قال
  أبو عبيدة فانهم يدوِّن بالادون كة ولهسم القمران والعمران وربيعة ومضر وسليم وعاهر
  والقلة أعلى الجبل وقلة كل شئ أعلاء ورأس الانسان قلة وأنشد سيبويه
  عجائب تبدى الشيب فى قلة الطفل * والهع قلل ومنهة ول ذى الرمّة يذكرفراخ النعامة
  ويشبه روسها بالبنادق
  أشداقها كصدوع النبع فى قلل * مثل الدحاريح لم ينبت لهازغب
  والقلة اناء للعرب كالجرة السكبيرة وقد تجمع على قال وقال
  وظللنا بنعمة واتكانا * وشربنا الحلال من قلله
  وقلال هجرشيهة بالحباب والقلّ بالكسمرشبه الرعدة يقال أخذه قلّ من الغضب واستقله
  عدّه قليلا واستقلت السماءارتفعت واستقل القوم مضواوار تحلوا والقلال بالضم القليل
  ورجل قلقل أى خفيف وفرس قلقل أى سريع والقلقلانى طائر كالفاختة والقلقلان نبت
  والقلقل بالكسرنبت له حب أسود قال أبو التجم
  وآضت اليهمى كنبل الصيقل * وحازت الريح يبيس القلفل
  وفى المثل دقك بالمصازحب القلقل والعامة تقول حب الفلفل ؟ ال الاصمعى هو تسحيف
  انماهو بالقاف وه وأصلب ما يكون من الحبوب حكاه أيو عبيد ولقسل أى صوّت وه وحكاية
  وقلة لد قلقلة وقلقا لا فتقلق ل أى -ركد قحترّك واضطرب فاذا كسرته ف، ومصدرواذافتحته
  فهواسم مشل الزلزال والززال ل لقمل معروف الواحدة قلة وقد قل رأسه بالكسر
  2لان
