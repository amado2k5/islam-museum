label: { ar: "سنن ابن ماجه 2954 — الأب والأبوة", en: "Sunan Ibn Majah 2954 — the father and fatherhood", ur: "سنن ابن ماجہ 2954 — باپ اور والدیت", es: "Sunan Ibn Majah 2954 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، حَدَّثَنَا مُحَمَّدُ بْنُ يُوسُفَ، وَقَبِيصَةُ، قَالاَ حَدَّثَنَا سُفْيَانُ، عَنِ ابْنِ جُرَيْجٍ، عَنْ عَبْدِ الْحَمِيدِ، عَنِ ابْنِ يَعْلَى بْنِ أُمَيَّةَ، عَنْ أَبِيهِ، يَعْلَى أَنَّ النَّبِيَّ ـ طَافَ مُضْطَبِعًا. قَالَ قَبِيصَةُ وَعَلَيْهِ بُرْدٌ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2954، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2954 (Chapters on Hajj Rituals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2954، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2954 (Capítulos sobre los rituales del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
