text: |-
  ٤.٨
  اذا جلدى منعت قطرها • زان جنابى عطن معصف
  وقال الحسن فى قوله تعإلى فجعلهم كعصف مأكول أى كز رع قد أ كل حبه وبق تبنه
  وعصفت الزرع أى جززته قبل أن يدرك وعصفت الريح أى اشتدت ذهى ريح عاصف
  وعصوف ويوم عاصف أى تمصف فيه الريح ووفاعل بعنى مفعول فيه مثل قولهم ليل نائم
  قد يكسب المال الهدان الحافى * بعير ماعصف ولا اصطراف
  وكدّ الك الاعتصاف وأعصف الفرس اذا مر مراسر بعالغسة فى أحصف ونعامة عصوف
  وناقة عصوف أى سريعة وهى التى تعصف براكبها غتمضى يه والحرب تعصف يالة وم أى
  تذهببهم وتم لسكهم قال الاعتى
  فى فيلق شهباء ماومة • تعصف بالدارع والحاسر
  وحكى أبو عبيدة أعصف الرجل أى حلاد والعصيفة الورق المجتمع الذى بكون فيه
  السنبل والعصلفة ماسقط من الستبل من التين وغيره ⁦(عطف )⁩ عطفت أى ملت
  وعطفت العود فاتسلف وعظفت الوسادة ثفيتها وعطفت عليه أى أشفقت يقال ما تتنيي
  عليك عاطفة من رحم ولا قراية وعطف عليه أى كرّ قال أيو وجزة السعدى
  المعاطفون تحين مامن عاطف • والمطعسمون زمان أبن المطعم
  وظية عاطف تعطف جيدها اذار بضت والعطفة خرزة تؤخذبما النساء الرجال والمعطف
  بالكسر الرداء وكذلك العظاف وقد تعطفت بالعطاف أى ارتديت يالرداء ومنه عى السيف
  عطافا وتعطف عليه أشخق وتعاطف واعطف بعضهم على بعض والناقة العطوف التى تعطف
  على البوفترأ مه واستعطفه عليه فعطف وعطقت العيدان شدد للكثرة وقسى معطفة ولقاح
  معطنة وربماءطة واعدّة ذود على فصيل واحدقا حتلبوا ألبانجنّ على ذلك ليدررن والقوس
  المعطوفة هى هذه العربية وعطفا الرجل جانباه من لدن رأسه الى وركيه وكذلك عطفنا
  كل شئ جانياه ويقال ثى فلان عنى عطفه اذا أعرض عنك ومنعطف الوادى منه رحه
  ومنحناه ⁦(عذف)⁩. عفّ عن الحرام بعف عضاوعفة وعضاقة أى كف فهوءنى وعفيف
  والمرأة عفة وعضفة وأعفه اللّه واستعف عن المسسئلة أى عف وتعفف أى تكاف العفة
  والعفة والحفافة بالضم فيهما يقية اللين فى الضرع قال الاعشى بصفطبية وغزالها
  وتعادى عنه النها رغاتعجوه الاعقافة أوفواق
  نصب التهارعلى الظرف وتعادى أى تساعد وتعفف الرجل أى شرب العفافة ويقال
  تعاف ياهذا ناقتك أى احليه ابعد الحلبة الاولى وقواهم جاءفلان على عفان ذلك يكسر
  العين لغة فى افات ذلك أى حينه وأوانه ⁦(عقف)⁩ عقفت الشى عقفا فانعقف أى عطفته
  فانعطف وأماقول حيدين تور الهلالى"
  كأنه عقق نولى يهرب * من أكلب تتبعهن أكاب
  فيقال هو التعلب والعقاف داء يأخذ الشاة فى قوائها حتى تعوج والتعتقيف التعويج
  واعراني
