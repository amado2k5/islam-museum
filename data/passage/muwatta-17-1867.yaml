label: { ar: "الموطأ 1867 — مالك: بلغه أن صكوكا خرجت للناس في زمن مروان بن الحكم من طعام الجار، فتبايع الناس الصكوك قبل أن يستوفوها، فأنكر زيد بن ثابت ومعه صاحب للنبي، فبعث مروان الحرس لينتزعوا الصكوك", en: "Muwatta 1867", es: "Muwatta 1867", fr: "Muwatta 1867", ur: "موطا 1867", tr: "El-Muvatta 1867 — Malik: Mervan ibn el-Hakam zamanında komşunun yemeği için insanlara kuponlar verildiği ve insanların bu kuponları daha ellerine geçmeden satın aldıkları kendisine bildirildi. Zeyd ibn Sabit ve Peygamberin bir arkadaşı buna itiraz edince, Mervan muhafızları kuponlara el koymaları için gönderdi.", id: "Al-Muwatta 1867 — Malik: Dia diberitahu bahwa kupon dikeluarkan kepada orang-orang pada masa Marwan ibn al-Hakam untuk makanan tetangga, dan orang-orang membeli kupon tersebut sebelum mereka menerimanya. Zayd ibn Thabit dan seorang sahabat Nabi keberatan, sehingga Marwan mengirim pengawal untuk menyita kupon-kupon tersebut." }
summary:
  ar: "قال مالك: بلغه أنه قد خرجت صكوك للناس في زمان مروان بن الحكم من طعام الجار، فتبايع الناس تلك الصكوك بينهم، قبل أن يستوفوها. فدخل زيد بن ثابت ورجل من أصحاب رسول الله على مروان بن الحكم، فقالا: أتحل بيع الربا يا مروان؟ فقال: أعوذ بالله، وما ذاك؟ فقالا: هذه الصكوك تبايعها الناس، ثم باعوها قبل أن يستوفوها. فبعث مروان الحرس يتبعونها، ينتزعونها من أيدي الناس، ويردونها إلى أهلها. {cite:muwatta-maruf-1997 p.168}"
  tr: "Malik şöyle dedi: Mervan ibn Hakam zamanında, komşularının yiyecekleri için insanlara senetler verildiği ve insanların bu senetleri tam tutarı almadan önce kendi aralarında sattıkları rivayet edildi. Zeyd ibn Sabit ve Allah Resulü'nün Sahabelerinden bir adam Mervan ibn Hakam'ın yanına gidip, \"Ey Mervan, faize izin mi veriyorsun?\" dediler. Mervan, \"Allah'a sığınırım! Bu nedir?\" dedi. Onlar da, \"Bu senetler insanlar arasında alınıp satıldı ve tam tutarı almadan önce satıldılar\" dediler. Bunun üzerine Mervan, onları takip etmeleri, senetleri ellerinden almaları ve asıl sahiplerine iade etmeleri için muhafızlar gönderdi. {cite:muwatta-maruf-1997 s.168}"
  id: "Malik berkata: Telah sampai kepadanya bahwa pada masa Marwan bin al-Hakam, surat-surat janji bayar dikeluarkan kepada orang-orang untuk memberi makan tetangga mereka, dan orang-orang memperdagangkan surat-surat janji bayar tersebut di antara mereka sendiri sebelum menerima jumlah penuh. Zayd bin Thabit dan seorang dari kalangan Sahabat Rasulullah SAW mendatangi Marwan bin al-Hakam dan berkata, “Apakah engkau memperbolehkan riba, wahai Marwan?” Beliau menjawab, “Aku berlindung kepada Allah! Apa itu?” Mereka berkata, “Surat-surat janji bayar ini diperdagangkan di antara orang-orang, dan kemudian mereka menjualnya sebelum menerima jumlah penuh.” Maka Marwan mengirimkan pengawal untuk mengejar mereka, menyita surat-surat janji bayar tersebut dari orang-orang, dan mengembalikannya kepada pemiliknya yang sah. {cite:muwatta-maruf-1997 p.168}"
