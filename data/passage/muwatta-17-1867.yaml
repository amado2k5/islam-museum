label: { ar: "الموطأ 1867 — مالك: بلغه أن صكوكا خرجت للناس في زمن مروان بن الحكم من طعام الجار، فتبايع الناس الصكوك قبل أن يستوفوها، فأنكر زيد بن ثابت ومعه صاحب للنبي، فبعث مروان الحرس لينتزعوا الصكوك", en: "Muwatta 1867" }
summary:
  ar: "قال مالك: بلغه أنه قد خرجت صكوك للناس في زمان مروان بن الحكم من طعام الجار، فتبايع الناس تلك الصكوك بينهم، قبل أن يستوفوها. فدخل زيد بن ثابت ورجل من أصحاب رسول الله على مروان بن الحكم، فقالا: أتحل بيع الربا يا مروان؟ فقال: أعوذ بالله، وما ذاك؟ فقالا: هذه الصكوك تبايعها الناس، ثم باعوها قبل أن يستوفوها. فبعث مروان الحرس يتبعونها، ينتزعونها من أيدي الناس، ويردونها إلى أهلها. {cite:muwatta-maruf-1997 p.168}"
