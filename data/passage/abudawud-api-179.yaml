label: { ar: "سنن أبي داود 179 — ضحك وتبسم", en: "Sunan Abi Dawud 179 — laughter and smiling", ur: "سنن ابی داؤد 179 — ہنسی اور تبسم", fr: "Sunan Abi Dawud 179 — rire et sourire", es: "Sunan Abi Dawud 179 — risa y sonrisa", tr: "Sünen Ebi Davud 179 — Kahkaha ve Gülümseme", id: "Sunan Abi Dawud 179 — Tertawa dan Tersenyum" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، حَدَّثَنَا الأَعْمَشُ، عَنْ حَبِيبٍ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، أَنَّ النَّبِيَّ قَبَّلَ امْرَأَةً مِنْ نِسَائِهِ ثُمَّ خَرَجَ إِلَى الصَّلاَةِ وَلَمْ يَتَوَضَّأْ. قَالَ عُرْوَةُ فَقُلْتُ لَهَا مَنْ هِيَ إِلاَّ أَنْتِ فَضَحِكَتْ. قَالَ أَبُو دَاوُدَ هَكَذَا رَوَاهُ زَائِدَةُ وَعَبْدُ الْحَمِيدِ الْحِمَّانِيُّ عَنْ سُلَيْمَانَ الأَعْمَشِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 179، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Abi Dawud, no. 179, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابی داؤد کی حدیث نمبر 179، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Abi Dawud, n° 179, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Abi Dawud, n.º 179, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sünen Ebu Davud'da yer alan 179 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 179, berisi tentang tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan Islamic Folklore Browser, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
