text: "ولحقت ثمود بالحجر وما يليه فهلكوا ولحقت طسم وجديس باليمامة فهلكوا ولحقت أميم بأرض أبار فهلكوا بها وهي بين اليمامة والشحر ولا يصل إليها اليوم أحد غلبت عليها الجن"
