text: "- باب أمور الايمان الحديث : وقد وردَ في بعضٍ رواياتِ صحيحِ مسلم عددُ بعضِ هذه الخصالِ، ولفظه: أعلاهَا: قولُ لا إله إلا الله، وأدناها: إماطةُ الأذى عن الطريقِ، والحياء شعبةٌ من الإيمانِ. فأشارَ إلى أن خصالَ الإيمانِ منها ما …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 33، يذكر شعب الإيمان، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 33, that mentions the branches of faith, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 33 کا اقتباس جس میں ایمان کی شاخیں، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
