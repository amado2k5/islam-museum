text: "الخطّابيّ، وأبي بكر القَطِيعيّ. وبَرع في العرِبيّة واللّغة. ودخل الأندلس في أيّام المؤيَّد بالله هشام بن الحَكَم. وكان حافظاً للآداب، سريع الجواب، طيِّب العِشْرة، حُلْو المفاكهة، فأكرمه الحاجب المنصور محمد بن أبي عامر وزاد في الإحسان إليه. جمَع الفصوص عِلى …"
