label: { ar: "سنن النسائي 2700 — الأب والأبوة", en: "Sunan al-Nasa'i 2700 — the father and fatherhood", ur: "سنن نسائی 2700 — باپ اور والدیت", es: "Sunan al-Nasa'i 2700 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2700 — le père et la paternité" }
text: "أَخْبَرَنَا قُتَيْبَةُ، وَهَنَّادُ بْنُ السَّرِيِّ، عَنْ أَبِي الأَحْوَصِ، عَنْ أَبِي إِسْحَاقَ، عَنِ الأَسْوَدِ، عَنْ عَائِشَةَ، قَالَتْ كَانَ النَّبِيُّ وَقَالَ هَنَّادٌ كَانَ رَسُولُ اللَّهِ إِذَا أَرَادَ أَنْ يُحْرِمَ ادَّهَنَ بِأَطْيَبِ مَا يَجِدُهُ حَتَّى أَرَى وَبِيصَهُ فِي رَأْسِهِ وَلِحْيَتِهِ. تَابَعَهُ إِسْرَائِيلُ عَلَى هَذَا الْكَلاَمِ وَقَالَ عَنْ عَبْدِ الرَّحْمَنِ بْنِ الأَسْوَدِ عَنْ أَبِيهِ عَنْ عَائِشَةَ."
summary:
  ar: "حديث في سنن النسائي، رقم 2700، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2700 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2700، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2700 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2700 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
