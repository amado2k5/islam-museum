label: { ar: "صحيح البخاري 6509 — ساعة الاحتضار والوفاة", en: "Sahih al-Bukhari 6509 — a deathbed and last hours", ur: "صحیح بخاری 6509 — وقتِ وفات اور آخری لمحات", es: "Sahih al-Bukhari 6509 — un lecho de muerte y últimas horas", fr: "Sahih al-Bukhari 6509 — Un lit de mort et les dernières heures" }
text: "… مَقْعَدَهُ مِنَ الْجَنَّةِ ثُمَّ يُخَيَّرُ \". فَلَمَّا نَزَلَ بِهِ، وَرَأْسُهُ عَلَى فَخِذِي، غُشِيَ عَلَيْهِ سَاعَةً، ثُمَّ أَفَاقَ، فَأَشْخَصَ بَصَرَهُ إِلَى السَّقْفِ ثُمَّ قَالَ \" اللَّهُمَّ الرَّفِيقَ الأَعْلَى \". قُلْتُ إِذًا لاَ يَخْتَارُنَا، وَعَرَفْتُ أَنَّهُ الْحَدِيثُ الَّذِي كَانَ يُحَدِّثُنَا بِهِ ـ قَالَتْ ـ فَكَانَتْ تِلْكَ آخِرَ كَلِمَةٍ تَكَلَّمَ بِهَا النَّبِيُّ قَوْلُهُ \" اللَّهُمَّ الرَّفِيقَ الأَعْلَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6509، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6509 (To make the Heart Tender (Ar-Riqaq)), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 6509، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6509 (Para ablandar el corazón (Ar-Riqaq)), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 6509 (Pour attendrir le cœur (Ar-Riqaq)), évoque un lit de mort et les dernières heures. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
