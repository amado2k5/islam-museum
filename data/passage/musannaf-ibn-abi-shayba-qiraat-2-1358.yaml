text: "باب: - كتاب الصلاة - من قال: يؤم القوم أقرؤهم لكتاب اللّٰه - حدثنا أبو بكر قال: نا أبو خالد عن الأعمش عن إسماعيل بن رجاء عن أوس بن ضَمْعج عن أبي مسعود الأنصاري قال: قال رسول اللّٰه اليفي يؤم …"
