text: "حَدَّثَنَا أَبُو زُرْعَةَ، قَالَ حَدَّثَنَا الْحَسَنُ بْنُ بِشْرٍ، قَالَ حَدَّثَنَا الْحَكَمُ بْنُ عَبْدِ الْمَلِكِ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ لَمَّا أُمِرَ رَسُولُ اللَّهِ بِبَيْعَةِ الرِّضْوَانِ كَانَ عُثْمَانُ بْنُ عَفَّانَ رَسُولَ رَسُولِ اللَّهِ إِلَى أَهْلِ مَكَّةَ قَالَ فَبَايَعَ النَّاسَ قَالَ فَقَالَ رَسُولُ اللَّهِ \" إِنَّ عُثْمَانَ فِي حَاجَةِ اللَّهِ وَحَاجَةِ رَسُولِهِ \". فَضَرَبَ بِإِحْدَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3702، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3702 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3702، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
