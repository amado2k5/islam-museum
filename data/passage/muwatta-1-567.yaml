label: { ar: "الموطأ 567 — بلاغ عن يحيى بن سعيد: اللهم فالق الإصباح… اقض عني الدين وأغنني من الفقر", en: "Muwatta 567" }
text: "اقض عني الدين، وأغنني من الفقر، وأمتعني بسمعي وبصري وقوتي في سبيلك"
summary:
  ar: "بلاغ يرويه مالك عن يحيى بن سعيد أنه بلغه أن النبي كان يدعو بدعاء يفتتحه بالثناء على الله بأوصاف قريبة مما في سورة الأنعام [[passage/quran-6-96|الأنعام 96]]، ثم يسأله أن يقضي عنه الدين ويغنيه من الفقر ويمتعه بسمعه وبصره وقوته في سبيله. ويذكر المحقق أن في نسخة «وقوني»، وأنه رواه عن مالك أبو مصعب وسويد، وأن ابن أبي شيبة (10/209) رواه عن أبي خالد الأحمر عن يحيى بن سعيد عن مسلم بن يسار قال: كان من دعاء النبي، وهو مرسل فمسلم بن يسار تابعي. {cite:muwatta-maruf-1997 p.292}"
