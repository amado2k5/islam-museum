label: { ar: "صحيح مسلم 7408 — الأب والأبوة", en: "Sahih Muslim 7408 — the father and fatherhood", ur: "صحیح مسلم 7408 — باپ اور والدیت", es: "Sahih Muslim 7408 — El padre y la paternidad" }
text: "وَحَدَّثَنَا أَبُو غَسَّانَ الْمِسْمَعِيُّ، حَدَّثَنَا مُعْتَمِرٌ، عَنْ أَبِيهِ، عَنْ مَعْبَدٍ، عَنْ أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" بُعِثْتُ أَنَا وَالسَّاعَةُ كَهَاتَيْنِ \". قَالَ وَضَمَّ السَّبَّابَةَ وَالْوُسْطَى."
summary:
  ar: "حديث في صحيح مسلم، رقم 7408، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7408 (The Book of Tribulations and Portents of the Last Hour), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7408، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 7408 (El Libro de las Tribulaciones y Presagios de la Última Hora), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
