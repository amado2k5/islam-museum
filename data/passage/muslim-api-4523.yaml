label: { ar: "صحيح مسلم 4523 — وصية أو عهد أخير", en: "Sahih Muslim 4523 — a testament or parting counsel", ur: "صحیح مسلم 4523 — وصیت یا آخری نصیحت", es: "Sahih Muslim 4523 — un testamento o consejo de despedida", fr: "Sahih Muslim 4523 — un testament ou un conseil d'adieu" }
text: "وَحَدَّثَنِي حَجَّاجُ بْنُ الشَّاعِرِ، حَدَّثَنِي عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنِي عَلْقَمَةُ بْنُ مَرْثَدٍ، أَنَّ سُلَيْمَانَ بْنَ بُرَيْدَةَ، حَدَّثَهُ عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ إِذَا بَعَثَ أَمِيرًا أَوْ سَرِيَّةً دَعَاهُ فَأَوْصَاهُ. وَسَاقَ الْحَدِيثَ بِمَعْنَى حَدِيثِ سُفْيَانَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4523، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4523 (The Book of Jihad and Expeditions), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 4523، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4523 (El Libro de la Yihad y las Expediciones), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 4523 (Livre du Jihad et des Expéditions), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
