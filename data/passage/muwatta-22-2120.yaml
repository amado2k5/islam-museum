label: { ar: "الموطأ 2120 — مالك: ومن ذلك أيضا الرجل يفتري على الرجل الحر فيقع عليه الحد، فيأتي رجل وامرأتان فيشهدون أن الذي افتري عليه عبد مملوك، فيضع ذلك الحد عن المفتري، وشهادة النساء لا تجوز في الفرية", en: "Muwatta 2120", es: "Muwatta 2120", fr: "Muwatta 2120", ur: "موطا 2120", tr: "El-Muvatta 2120 — Malik: Ayrıca, bir adam hür bir adamı iftira yoluyla suçlarsa, kendisine öngörülen ceza uygulanır. Sonra bir adam ve iki kadın gelir ve iftira yoluyla suçlananın köle olduğuna şahitlik ederlerse, iftira edenin cezası kaldırılır. Kadınların şahitliği, iftira durumunda caiz değildir.", id: "Al-Muwatta 2120 — Malik: Juga, seorang pria menuduh orang merdeka secara palsu dan hukuman yang telah ditentukan diterapkan kepadanya. Kemudian seorang pria dan dua wanita datang dan bersaksi bahwa orang yang dituduh secara palsu itu adalah seorang budak, sehingga hukuman bagi penuduh palsu itu ditiadakan. Kesaksian wanita tidak diperbolehkan dalam kasus tuduhan palsu." }
summary:
  ar: "قال مالك: ومن ذلك أيضا، الرجل يفتري على الرجل الحر فيقع عليه الحد، فيأتي رجل وامرأتان فيشهدون أن الذي افتري عليه عبد مملوك، فيضع ذلك الحد عن المفتري بعد أن وقع عليه. وشهادة النساء لا تجوز في الفرية. {cite:muwatta-maruf-1997 p.266}"
  tr: "Malik şöyle dedi: Başka bir örnek de, bir adamın özgür bir adamı yanlış yere suçlaması ve bunun sonucunda öngörülen cezanın verilmesidir. Daha sonra, bir adam ve iki kadın, suçlanan kişinin köle olduğunu ifade ederek, ceza infaz edildikten sonra yanlış suçlayanın cezasını kaldırırlar. Ancak, kadınların tanıklığı yanlış suçlama durumlarında kabul edilemez. {cite:muwatta-maruf-1997 s.266}"
  id: "Malik berkata: Contoh lain adalah ketika seorang pria secara salah menuduh orang merdeka, yang mengakibatkan hukuman yang telah ditentukan. Kemudian, seorang pria dan dua wanita bersaksi bahwa terdakwa adalah seorang budak, sehingga hukuman terhadap penuduh palsu tersebut dicabut setelah hukuman itu dilaksanakan. Namun, kesaksian wanita tidak dapat diterima dalam kasus tuduhan palsu. {cite:muwatta-maruf-1997 p.266}"
