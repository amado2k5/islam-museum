text: "… عليّ بن حجر، كلاهما عن عبد الرَّحمن بن أبي الزناد، عن أبيه، عن خارجة، عن أبيه به نحوه. وقال الترمذي حسن صحيح، وهذا ذكاء مفرط جداً. وقد كان ممن جمع القرآن على عهد رسول اللّٰه كَية من القراء، كما ثبت …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 373، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
