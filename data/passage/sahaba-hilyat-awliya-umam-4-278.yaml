text: "… ادع لنا ربك أن يكشف عنا ونحن نؤمن بك، فدما اللّه فكشفه عنهم فلم يؤمنوا، قال فكان فرعون أوقاهم قال لبنى اسرائيل اذهبوا ممه. حدثنا أبو محمد بن حيان ثنا الوليد ابن أبان ثنا يونس بن حبيب ثنا عامر ثنا …"
