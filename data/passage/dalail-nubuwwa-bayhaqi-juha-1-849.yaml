text: "… الخبيئة من دونهم فأسرع السير، وهو عقبة بن أبي معيط، كما جاء في رواية اخرىٰ. في ح : واستضحكوا. ومعناها : حملوا انفسهم على الضحك والسخرية، ثم اخذهم الضحك جداً فجعلوا يضحكون يميل بعضهم على بعض من كثرة الضحك. لو …"
