label: { ar: "صحيح مسلم 1394 — الأب والأبوة", en: "Sahih Muslim 1394 — the father and fatherhood", ur: "صحیح مسلم 1394 — باپ اور والدیت", es: "Sahih Muslim 1394 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ بَدْرِ بْنِ عُثْمَانَ، عَنْ أَبِي بَكْرِ بْنِ أَبِي مُوسَى، سَمِعَهُ مِنْهُ، عَنْ أَبِيهِ، أَنَّ سَائِلاً، أَتَى النَّبِيَّ فَسَأَلَهُ عَنْ مَوَاقِيتِ الصَّلاَةِ. بِمِثْلِ حَدِيثِ ابْنِ نُمَيْرٍ غَيْرَ أَنَّهُ قَالَ فَصَلَّى الْمَغْرِبَ قَبْلَ أَنْ يَغِيبَ الشَّفَقُ فِي الْيَوْمِ الثَّانِي."
summary:
  ar: "حديث في صحيح مسلم، رقم 1394، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1394 (The Book of Mosques and Places of Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1394، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 1394 (El Libro de las Mezquitas y Lugares de Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
