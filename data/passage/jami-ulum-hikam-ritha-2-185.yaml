text: "… : بعثت إليك بذلك اللبن مرثية لك من طول النهار وشدة الحرِّ، فرددت فيه إليَّ الرسول ! فقال النَّبيُّ وَيِخِ : بذلك أمِرت الرسل قبلي، أنْ لا تأكل إلا طيباً، ولا تعمل إلا صالحاً بلفظ ابن أبي الدنيا. ذكره الهيئمي …"
summary:
  ar: "مقطع من جامع العلوم والحكم، المجلد المصوَّر 2، ص 185، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Jami' al-Ulum wal-Hikam, scan volume 2, p. 185, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "جامع العلوم والحکم، اسکین جلد 2، ص 185 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Ulum wal-Hikam, volume numérisé 2, p. 185, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Jami' al-Ulum wal-Hikam, volumen escaneado 2, p. 185, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Cami' el-Ulum ve el-Hikam'ın 2. cildinin 185. sayfasından, merhum için yazılmış ağıt ve övgüleri içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Jami' al-'Ulum wa al-Hikam, Volume 2, halaman 185, berisi elegi dan pujian untuk almarhum; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
