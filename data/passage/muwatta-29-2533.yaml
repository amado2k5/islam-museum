label: { ar: "الموطأ 2533 — مالك: الصبي والمرأة اللذان لا مال لهما يضمنان في مالهما خاصة", en: "Muwatta 2533" }
summary:
  ar: "قال مالك في الصبي الذي لا مال له والمرأة التي لا مال لها، إذا جنى أحدهما جناية دون الثلث: إنه ضامن على الصبي أو المرأة في مالهما خاصة؛ فإن كان لهما مال أُخذ منه، وإلا فجناية كل واحد منهما دين عليه، ليس على العاقلة منه شيء. ولا يؤخذ أبو الصبي بعقل جناية الصبي. {cite:muwatta-maruf-1997 p.437}"
