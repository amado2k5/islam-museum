label: { ar: "الموطأ 1100 — القاسم بن محمد عن عائشة: كانت تصوم يوم عرفة، فيقول: رأيتها عشية عرفة يدفع الإمام ثم تقف حتى يبيض ما بينها وبين الناس من الأرض، ثم تدعو بشراب فتفطر", en: "Muwatta 1100", es: "1100 Muwatta", fr: "1100 Muwatta", ur: "1100 موطا", tr: "El-Muvatta 1100 — El-Kâsim ibn Muhammed, Aişe'den rivayetle: O, Arafat Günü oruç tutardı. Dedi ki: Onu Arafat arifesinde gördüm, imam ayrılırdı, sonra o, kendisiyle insanlar arasındaki mesafe açılana kadar ayakta durur, sonra su ister ve orucunu açardı.", id: "Al-Muwatta 1100 — Al-Qasim ibn Muhammad meriwayatkan dari Aisyah: Ia biasa berpuasa pada Hari Arafah. Ia berkata: Aku melihatnya pada malam Arafah, Imam akan pergi, kemudian ia akan berdiri hingga jarak antara dirinya dan orang-orang menjadi kosong, lalu ia meminta minum dan berbuka puasa." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد، أن عائشة أم المؤمنين كانت تصوم يوم عرفة. قال القاسم: ولقد رأيتها عشية عرفة يدفع الإمام، ثم تقف حتى يبيض ما بينها وبين الناس من الأرض، ثم تدعو بشراب فتفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ⁦(893 و1366)⁩ وسويد (562). {cite:muwatta-maruf-1997 p.504}"
  tr: "Malik, Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayet ettiğine göre, Müminlerin Annesi Ayşe, Arafat Günü oruç tutardı. El-Kasım şöyle dedi: \"Onu Arafat arifesinde, İmam ayrılırken gördüm; sonra, kendisiyle insanlar arasındaki yer bembeyaz oluncaya kadar ayakta durur, sonra su ister ve orucunu açardı.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (893 ve 1366) ve Suveyd (562) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.504}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, bahwa Aisyah, Ummul Mukminin, biasa berpuasa pada Hari Arafah. Al-Qasim berkata: \"Aku melihatnya pada malam Arafah ketika Imam berangkat, kemudian dia berdiri hingga tanah di antara dirinya dan orang-orang menjadi putih, lalu dia meminta minum dan berbuka puasa.\" Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (893 dan 1366) dan Suwaid (562). {cite:muwatta-maruf-1997 p.504}"
