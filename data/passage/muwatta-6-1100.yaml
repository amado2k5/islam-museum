label: { ar: "الموطأ 1100 — القاسم بن محمد عن عائشة: كانت تصوم يوم عرفة، فيقول: رأيتها عشية عرفة يدفع الإمام ثم تقف حتى يبيض ما بينها وبين الناس من الأرض، ثم تدعو بشراب فتفطر", en: "Muwatta 1100" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد، أن عائشة أم المؤمنين كانت تصوم يوم عرفة. قال القاسم: ولقد رأيتها عشية عرفة يدفع الإمام، ثم تقف حتى يبيض ما بينها وبين الناس من الأرض، ثم تدعو بشراب فتفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (893 و1366) وسويد (562). {cite:muwatta-maruf-1997 p.504}"
