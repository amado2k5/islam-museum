label: { ar: "دلائل النبوة لأبي نعيم — قريش کی طرف سے عتبہ بن ربيعة", en: "Abu Nu'aym's Dala'il — Quraysh sends Utba ibn Rabi'a", ur: "ابو نعیم کی دلائل — قریش کی طرف سے عتبہ بن ربیعہ" }
text: "ما رأينا سخلة قط أشأم على قومك منك، فرقت جماعتنا وشتت أمرنا وفضحتنا في العرب، حتى لقد طار فيهم أن في قريش ساحراً وأن في قريش كاهناً"
summary:
  ar: "في الفصل الخامس عشر يروي أبو نعيم عن جابر بن عبد الله أن قريشاً اجتمعت يوماً وقالت: انظروا أعلمكم بالسحر والكهانة والشعر فليأت هذا الرجل الذي فرّق جماعتنا، فاختاروا عتبة بن ربيعة فأتاه فقال له يا محمد أنت خير أم عبد الله؟ فسكت، ثم أنت خير أم عبد المطلب؟ فسكت، ثم أنت خير أم هاشم؟ فسكت، ثم قال: فإن كنت تزعم أنك خير منهم فتكلم حتى نسمع قولك، ما رأينا سخلة قط أشأم على قومك منك، فرقت جماعتنا وشتت أمرنا وفضحتنا في العرب حتى لقد طار فيهم أن في قريش ساحراً وأن في قريش كاهناً. ويقدم المؤلف هذا المشهد بوصفه من أعظم ما احتج به المشركون في الطعن في صدقه، ويقابله في الكتاب بما ظهر من آيات النبوة في جوابه."
  en: "In chapter fifteen Abu Nu'aym reports from Jabir ibn Abd Allah that the Quraysh agreed to send to the man who had split their community — their most learned in magic, soothsaying and poetry — and chose Utba ibn Rabi'a. Utba asked 'are you better than Abd Allah?', then Abd al-Muttalib, then Hashim, and the Prophet remained silent each time; then Utba said: if you claim to be better than them, speak so we hear you — we have never seen a fool more ominous for his people, who scattered our community and disgraced us among the Arabs until word spread that Quraysh has a sorcerer and a soothsayer. The author presents it as the chief polemical pressure the Prophet faced, answered in the book by the signs that appeared."
  ur: "پندرہویں باب میں ابو نعیم جابر بن عبد اللہ سے روایت کرتا ہے کہ قریش نے اس شخص کو جانے کا فیصلہ کیا جو ان کی جماعت بگاڑ چکا تھا، اور عتبہ بن ربیعہ کو بھیجا۔ عتبہ نے پوچھا: کیا تم عبد اللہ سے بہتر ہو؟ پھر عبد المطلب؟ پھر ہاشم؟ — ہر بار نبی خاموش رہے۔ پھر کہا: اگر تم دعویٰ کرتے ہو کہ تم ان سے بہتر ہو تو بول کر ہمیں سناؤ۔ ہم نے کبھی اتنا بدنصیب نہیں دیکھا جو اپنی قوم کے لیے اتنا برا ہو کہ جماعت بگاڑے اور عرب میں رسوائی پھیلائے یہاں تک کہ کہا جانے لگا کہ قریش میں جادوگر اور کہان ہے۔"
