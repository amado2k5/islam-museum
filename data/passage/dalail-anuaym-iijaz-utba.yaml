label: { ar: "دلائل النبوة لأبي نعيم — قريش کی طرف سے عتبہ بن ربيعة", en: "Abu Nu'aym's Dala'il — Quraysh sends Utba ibn Rabi'a", ur: "ابو نعیم کی دلائل — قریش کی طرف سے عتبہ بن ربیعہ", es: "Dala'il de Abu Nu'aym - Quraysh envía a Utba ibn Rabi'a", fr: "Dala'il d'Abu Nu'aym - Quraysh envoie Utba ibn Rabi'a", tr: "Ebu Naim'in Peygamberlik Delilleri", id: "Bukti Kenabian menurut Abu Naim" }
text: "ما رأينا سخلة قط أشأم على قومك منك، فرقت جماعتنا وشتت أمرنا وفضحتنا في العرب، حتى لقد طار فيهم أن في قريش ساحراً وأن في قريش كاهناً"
summary:
  ar: "في الفصل الخامس عشر يروي أبو نعيم عن جابر بن عبد الله أن قريشاً اجتمعت يوماً وقالت: انظروا أعلمكم بالسحر والكهانة والشعر فليأت هذا الرجل الذي فرّق جماعتنا، فاختاروا عتبة بن ربيعة فأتاه فقال له يا محمد أنت خير أم عبد الله؟ فسكت، ثم أنت خير أم عبد المطلب؟ فسكت، ثم أنت خير أم هاشم؟ فسكت، ثم قال: فإن كنت تزعم أنك خير منهم فتكلم حتى نسمع قولك، ما رأينا سخلة قط أشأم على قومك منك، فرقت جماعتنا وشتت أمرنا وفضحتنا في العرب حتى لقد طار فيهم أن في قريش ساحراً وأن في قريش كاهناً. ويقدم المؤلف هذا المشهد بوصفه من أعظم ما احتج به المشركون في الطعن في صدقه، ويقابله في الكتاب بما ظهر من آيات النبوة في جوابه."
  en: "In chapter fifteen Abu Nu'aym reports from Jabir ibn Abd Allah that the Quraysh agreed to send to the man who had split their community — their most learned in magic, soothsaying and poetry — and chose Utba ibn Rabi'a. Utba asked 'are you better than Abd Allah?', then Abd al-Muttalib, then Hashim, and the Prophet remained silent each time; then Utba said: if you claim to be better than them, speak so we hear you — we have never seen a fool more ominous for his people, who scattered our community and disgraced us among the Arabs until word spread that Quraysh has a sorcerer and a soothsayer. The author presents it as the chief polemical pressure the Prophet faced, answered in the book by the signs that appeared."
  ur: "پندرہویں باب میں ابو نعیم جابر بن عبد اللہ سے روایت کرتا ہے کہ قریش نے اس شخص کو جانے کا فیصلہ کیا جو ان کی جماعت بگاڑ چکا تھا، اور عتبہ بن ربیعہ کو بھیجا۔ عتبہ نے پوچھا: کیا تم عبد اللہ سے بہتر ہو؟ پھر عبد المطلب؟ پھر ہاشم؟ — ہر بار نبی خاموش رہے۔ پھر کہا: اگر تم دعویٰ کرتے ہو کہ تم ان سے بہتر ہو تو بول کر ہمیں سناؤ۔ ہم نے کبھی اتنا بدنصیب نہیں دیکھا جو اپنی قوم کے لیے اتنا برا ہو کہ جماعت بگاڑے اور عرب میں رسوائی پھیلائے یہاں تک کہ کہا جانے لگا کہ قریش میں جادوگر اور کہان ہے۔"
  es: "En el capítulo quince, Abu Nu'aym relata, según Jabir ibn Abd Allah, que los Quraysh acordaron enviar a quien había dividido su comunidad —su erudito en magia, adivinación y poesía— y eligieron a Utba ibn Rabi'a. Utba preguntó: \"¿Eres mejor que Abd Allah?\", luego Abd al-Muttalib, luego Hashim, y el Profeta guardó silencio en cada ocasión. Entonces Utba dijo: \"Si afirmas ser mejor que ellos, habla para que te escuchemos; jamás hemos visto un necio más nefasto para su pueblo, que dispersó nuestra comunidad y nos humilló entre los árabes hasta que se corrió la voz de que los Quraysh tenían un hechicero y un adivino\". El autor presenta esto como la principal presión polémica que enfrentó el Profeta, a la que respondió en el libro con las señales que aparecieron."
  fr: "Au chapitre quinze, Abou Nu'aym rapporte de Jabir ibn Abd Allah que les Qurayshites décidèrent d'envoyer consulter celui qui avait divisé leur communauté – leur plus savant en magie, divination et poésie – et choisirent Utba ibn Rabi'a. Utba demanda: « Es-tu meilleur qu'Abd Allah ? », puis Abd al-Muttalib, puis Hashim, et le Prophète garda le silence à chaque fois. Alors Utba dit: « Si tu prétends être meilleur qu'eux, parle pour que nous t'entendions. Nous n'avons jamais vu d'insensé plus menaçant pour son peuple, lui qui a dispersé notre communauté et nous a déshonorés parmi les Arabes, jusqu'à ce que la rumeur se répande que les Qurayshites possédaient un sorcier et un devin. » L'auteur présente cela comme la principale pression polémique à laquelle le Prophète dut faire face, pression à laquelle il répondit dans le livre par les signes qui apparurent."
  tr: "On beşinci bölümde Ebu Nuaym, Cabir ibn Abdullah'tan rivayetle, Kureyşlilerin bir gün toplanıp, \"Aranızda sihir, falcılık ve şiir konusunda en bilgili olanı bulun ve ümmetimizi bölen bu adamın yanına gelsin\" dediklerini anlatır. Bunun üzerine Utbe ibn Rabi'ah'ı seçtiler. Utbe ibn Rabi'ah yanına gelip, \"Ey Muhammed, Abdullah'tan daha mı üstünsün?\" dedi. Utbe ibn Rabi'ah sustu. Sonra, \"Abdul-Muttalib'den daha mı üstünsün?\" diye sordu. Yine sustu. Sonra, \"Haşim'den daha mı üstünsün?\" diye sordu. Yine sustu. Bunun üzerine, \"Eğer onlardan daha üstün olduğunu iddia ediyorsan, konuş da sözlerini duyalım. Senin gibi ümmetin için daha uğursuz birini hiç görmedik. Ümmetimizi böldün, işlerimizi dağıttın ve Araplar arasında bizi rezil ettin; öyle ki, Kureyşliler arasında bir sihirci ve falcı olduğu söylentisi yayıldı.\" dedi. Yazar bu sahneyi, çok tanrıcıların onun dürüstlüğünden şüphe duymak için kullandıkları en büyük argümanlardan biri olarak sunuyor ve kitapta bunu, buna karşılık ortaya çıkan peygamberlik işaretleriyle karşılaştırıyor."
  id: "Dalam bab kelima belas, Abu Nu'aym meriwayatkan dari Jabir ibn Abdullah bahwa kaum Quraisy berkumpul suatu hari dan berkata, \"Carilah orang di antara kalian yang paling berpengetahuan tentang sihir, ramalan, dan puisi, dan suruh dia datang kepada orang yang telah memecah belah umat kita ini.\" Maka mereka memilih Utbah ibn Rabi'ah, yang datang kepadanya dan berkata, \"Wahai Muhammad, apakah engkau lebih baik daripada Abdullah?\" Beliau terdiam. Kemudian beliau bertanya, \"Apakah engkau lebih baik daripada Abdul-Muttalib?\" Beliau terdiam. Kemudian beliau bertanya, \"Apakah engkau lebih baik daripada Hasyim?\" Beliau terdiam. Kemudian beliau berkata, \"Jika engkau mengaku lebih baik daripada mereka, maka bicaralah agar kami dapat mendengar kata-katamu. Kami belum pernah melihat orang yang lebih membawa malapetaka bagi kaummu daripada engkau. Engkau telah memecah belah umat kami, mengacaukan urusan kami, dan mempermalukan kami di antara orang-orang Arab, sampai-sampai tersebar luas di antara mereka bahwa ada seorang penyihir dan seorang peramal di antara kaum Quraisy.\" Penulis menyajikan adegan ini sebagai salah satu argumen terbesar yang digunakan kaum politeis untuk meragukan kebenarannya, dan ia membandingkannya dalam buku tersebut dengan tanda-tanda kenabian yang muncul sebagai tanggapan."
