summary:
  ar: "القسم 14 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصوم»، ويضم فيها النصوص من 2313 إلى 2476 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 14 of Sunan Abi Dawud (Fasting (Kitab Al-Siyam)) in the division of the open hadith dataset the museum took its reports from: reports 2313 to 2476 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 14، عنوان «کتاب الصوم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2313 تا 2476۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 14 de Sunan Abi Dawud (El ayuno (Kitab Al-Siyam)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2313 al 2476, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan Abi Dawud (Le jeûne, livre 14): il s’agit des hadiths 2313 à 2476, selon la numérotation de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
