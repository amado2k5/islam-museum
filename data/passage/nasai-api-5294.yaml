label: { ar: "سنن النسائي 5294 — الأب والأبوة", en: "Sunan al-Nasa'i 5294 — the father and fatherhood", ur: "سنن نسائی 5294 — باپ اور والدیت" }
text: "… إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ، قَالَ حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبِي خَالِدٍ، عَنْ أَبِي إِسْحَاقَ، عَنْ أَبِي الأَحْوَصِ، عَنْ أَبِيهِ، قَالَ دَخَلْتُ عَلَى رَسُولِ اللَّهِ فَرَآنِي سَيِّئَ الْهَيْئَةِ فَقَالَ النَّبِيُّ \" هَلْ لَكَ مِنْ شَىْءٍ \". قَالَ نَعَمْ مِنْ كُلِّ الْمَالِ قَدْ آتَانِي اللَّهُ. فَقَالَ \" إِذَا كَانَ لَكَ مَالٌ فَلْيُرَ عَلَيْكَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5294، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5294 (The Book of Adornment), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5294، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
