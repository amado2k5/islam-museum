label:
  ar: "الترمذي 2388 — أنا عند ظن عبدي بي وأنا معه إذا ذكرني"
  en: "Tirmidhi 2388 — I am as My servant thinks of Me, and I am with him when he remembers Me"
  ur: "ترمذی 2388 — میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں"
text: "إن الله يقول أنا عند ظن عبدي في وأنا معه إذا دعاني . قال أبو عيسى هذا حديث حسن صحيح ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2388: أنا عند ظن عبدي بي وأنا معه إذا ذكرني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2388: I am as My servant thinks of Me, and I am with him when he remembers Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2388: میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
