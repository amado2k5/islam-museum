label: { ar: "جامع الترمذي 2158 — ما لا يحل", en: "Jami' al-Tirmidhi 2158 — what is not lawful", ur: "جامع ترمذی 2158 — جو حلال نہیں", es: "Jami' al-Tirmidhi 2158 — lo que no es lícito" }
text: "… بْنِ حُنَيْفٍ، أَنَّ عُثْمَانَ بْنَ عَفَّانَ، أَشْرَفَ يَوْمَ الدَّارِ فَقَالَ أَنْشُدُكُمُ اللَّهَ أَتَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ إِلاَّ بِإِحْدَى ثَلاَثٍ زِنًا بَعْدَ إِحْصَانٍ أَوِ ارْتِدَادٍ بَعْدَ إِسْلاَمٍ أَوْ قَتْلِ نَفْسٍ بِغَيْرِ حَقٍّ فَقُتِلَ بِهِ \". فَوَاللَّهِ مَا زَنَيْتُ فِي جَاهِلِيَّةٍ وَلاَ فِي إِسْلاَمٍ وَلاَ ارْتَدَدْتُ مُنْذُ بَايَعْتُ رَسُولَ اللَّهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2158، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2158 (Chapters On Al-Fitan), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2158، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2158 (Capítulos sobre Al-Fitan), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
