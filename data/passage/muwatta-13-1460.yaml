label: { ar: "الموطأ 1460 — مالك: ميراث الإخوة للأب مع الجد كميراث الإخوة للأب والأم، إلا أن الأخت الواحدة للأب والأم تعادل الجد بإخوتها للأب", en: "Muwatta 1460", es: "Muwatta 1460", fr: "Muwatta 1460", ur: "موطا 1460", tr: "El-Muvatta 1460 — Malik: Baba tarafından erkek kardeşlerin dedeye olan miras payı, öz erkek kardeşlerin miras payı gibidir; ancak bir öz kız kardeş, dedeye baba tarafından erkek kardeşleriyle eşit miras payına sahiptir.", id: "Al-Muwatta 1460 — Malik: Warisan saudara laki-laki dari pihak ayah dengan kakek sama seperti warisan saudara laki-laki kandung, kecuali bahwa seorang saudara perempuan kandung sama kedudukannya dengan kakek dengan saudara laki-laki dari pihak ayahnya." }
summary:
  ar: "يقول مالك إن ميراث الإخوة للأب مع الجد، إذا لم يكن معهم إخوة للأب والأم، كميراث الإخوة للأب والأم سواء، ذكرهم كذكرهم وأنثاهم كأنثاهم. فإذا اجتمع الإخوة للأب والأم والإخوة للأب، فإن الإخوة للأب والأم يعادون الجد بإخوتهم لأبيهم فيمنعونه بهم كثرة الميراث بعددهم، ولا يعادونه بالإخوة للأم. ولا يكون للإخوة للأب معهم شيء إلا أن يكون الإخوة للأب والأم امرأة واحدة، فإنها تعادل الجد بإخوتها للأب، وفريضتها النصف. {cite:muwatta-maruf-1997 p.13}"
  tr: "Malik, eğer öz erkek kardeş yoksa (her iki ebeveynden de erkek kardeş), baba tarafından erkek kardeşlerin dedeye miras payının, erkek ve kadın fark etmeksizin öz erkek kardeşlerin miras payıyla aynı olduğunu belirtir. Ancak, öz erkek kardeşler ve baba tarafından erkek kardeşler varsa, baba tarafından erkek kardeşleri nedeniyle sayıca daha fazla oldukları için dedenin miras almasını engellerler. Anne tarafından erkek kardeşleri nedeniyle miras almazlar. Baba tarafından erkek kardeşlerin payı yoktur, ancak öz erkek kardeşler arasında sadece bir kadın varsa, o da dedeyle eşit miras payına sahiptir ve payı yarı yarıyadır. {cite:muwatta-maruf-1997 s.13}"
  id: "Malik menyatakan bahwa warisan saudara laki-laki dari pihak ayah kepada kakek, jika tidak ada saudara kandung (saudara laki-laki dari kedua orang tua), sama dengan warisan saudara kandung (saudara laki-laki dari kedua orang tua), baik laki-laki maupun perempuan. Namun, jika ada saudara kandung dan saudara laki-laki dari pihak ayah, saudara kandung tersebut, karena jumlah mereka yang lebih banyak, mencegah kakek untuk mewarisi. Mereka tidak mewarisi karena jumlah saudara laki-laki dari pihak ibu. Saudara laki-laki dari pihak ayah tidak mendapat bagian kecuali hanya ada satu perempuan di antara saudara kandung (saudara laki-laki dari kedua orang tua), dalam hal ini ia memiliki hak waris yang sama dengan kakek, dan bagiannya adalah setengah. {cite:muwatta-maruf-1997 p.13}"
