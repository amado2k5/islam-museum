label: { ar: "الموطأ 1460 — مالك: ميراث الإخوة للأب مع الجد كميراث الإخوة للأب والأم، إلا أن الأخت الواحدة للأب والأم تعادل الجد بإخوتها للأب", en: "Muwatta 1460" }
summary:
  ar: "يقول مالك إن ميراث الإخوة للأب مع الجد، إذا لم يكن معهم إخوة للأب والأم، كميراث الإخوة للأب والأم سواء، ذكرهم كذكرهم وأنثاهم كأنثاهم. فإذا اجتمع الإخوة للأب والأم والإخوة للأب، فإن الإخوة للأب والأم يعادون الجد بإخوتهم لأبيهم فيمنعونه بهم كثرة الميراث بعددهم، ولا يعادونه بالإخوة للأم. ولا يكون للإخوة للأب معهم شيء إلا أن يكون الإخوة للأب والأم امرأة واحدة، فإنها تعادل الجد بإخوتها للأب، وفريضتها النصف. {cite:muwatta-maruf-1997 p.13}"
