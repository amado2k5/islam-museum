label: { ar: "الموطأ 1737 — يحيى عن مالك: بلغه أن سعيد بن المسيب وسليمان بن يسار قالا عدة الأمة إذا هلك عنها زوجها شهران وخمس ليال", en: "Muwatta 1737", es: "Muwatta 1737", fr: "Muwatta 1737", ur: "موطا 1737", tr: "El-Muvatta 1737 — Yahya, Malik'ten rivayetle: Said bin el-Musayyab ve Süleyman bin Yasar'ın şöyle dediği kendisine ulaştı: Kocası ölen bir cariyenin bekleme süresi iki ay beş gecedir.", id: "Al-Muwatta 1737 — Yahya berdasarkan riwayat Malik: Diriwayatkan kepadanya bahwa Saeed bin Al-Musayyab dan Sulayman bin Yasar berkata: Masa iddah bagi seorang budak perempuan yang suaminya meninggal adalah dua bulan lima malam." }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن سعيد بن المسيب وسليمان بن يسار كانا يقولان: عدة الأمة، إذا هلك عنها زوجها، شهران وخمس ليال. {cite:muwatta-maruf-1997 p.109}"
  tr: "Yahya, Malik'ten rivayetle, Sa'id ibn al-Musayyab ve Sulayman ibn Yasar'ın şöyle dediklerini işittiğini aktarır: \"Kocası ölen bir cariyenin bekleme süresi iki ay beş gecedir.\" {cite:muwatta-maruf-1997 s.109}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Sa'id ibn al-Musayyab dan Sulayman ibn Yasar biasa berkata: Masa iddah bagi seorang budak perempuan, jika suaminya meninggal, adalah dua bulan dan lima malam. {cite:muwatta-maruf-1997 p.109}"
