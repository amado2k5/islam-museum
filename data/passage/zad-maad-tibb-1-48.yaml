text: "إِلَيْهِ يَوْمَ القِيَامَةِ البخاري:، ومسلم:. وفي وهي الودك، وهو الشحم المذاب، وأكل من الكَبِدِ وتجبُّراً، وكلا الطائفتين هديُه مخالِفٌ لهدي النبي وعلي في، ولهذا قال بعض السلف: كانوا يكرهون الشهرتين من الثياب: العالي، والمنخفض. وفي السنن عن ابن عمر يرفعه …"
