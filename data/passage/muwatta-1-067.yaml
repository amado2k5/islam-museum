label: { ar: "الموطأ 67 — أبو هريرة: تخرج الخطايا مع الماء حتى يخرج نقياً من الذنوب", en: "Muwatta 67", es: "Muwatta 67", fr: "Muwatta 67", ur: "موطا 67", tr: "El-Muvatta 67 — Ebu Hurayra: Günahlar suyla yıkanır ve su günahlardan arınmış olarak çıkar.", id: "Al-Muwatta 67 — Abu Hurairah: Dosa-dosa dibasuh dengan air hingga air itu keluar dalam keadaan bersih dari dosa." }
text: "إذا توضأ العبد المسلم أو المؤمن فغسل وجهه خرجت من وجهه كل خطيئة نظر إليها بعينيه مع الماء أو مع آخر قطر الماء"
summary:
  ar: "يرويه مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة، في باب جامع الوضوء: إذا توضأ المسلم فغسل وجهه خرجت منه كل خطيئة نظر إليها بعينيه مع الماء أو مع آخر قطره، وإذا غسل يديه خرجت منهما كل خطيئة بطشتها يداه، حتى يخرج نقياً من الذنوب. وينقل المحقق عن الباجي أن قوله «أو المؤمن» شك من الراوي، ويبين أن زيادة ذكر الرجلين الواردة في بعض النسخ وشرحي السيوطي والزرقاني ليست من رواية يحيى وإنما هي زيادة ابن وهب عن مالك كما ذكر ابن عبد البر ⁦(التمهيد 21/261)⁩، ويخرّج الحديث عند مسلم (1/148) والترمذي (2) والدارمي وابن خزيمة وابن حبان من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.70} {cite:muwatta-maruf-1997 p.71}"
  tr: "Malik, abdestin kapsamlı ritüelleri bölümünde, Suhayl ibn Abi Salih'ten, o da babasından, o da Ebu Hurayra'dan rivayetle şöyle nakletmiştir: “Bir Müslüman abdest alıp yüzünü yıkadığında, gözleriyle işlediği her günah suyla veya son damlasıyla yıkanır. Ellerini yıkadığında ise elleriyle işlediği her günah yıkanır ve böylece bütün günahlarından arınmış olur.” Editör, el-Baji'nin “veya mümin” ifadesinin ravî açısından bir şüphe olduğunu söylediğini aktarıyor. Bazı rivayetlerde ve el-Suyuti ile el-Zarqani'nin tefsirlerinde yer alan iki adamın zikredilmesinin Yahya'nın rivayetinden değil, İbn Abd el-Barr'ın (el-Tamhid 21/261) belirttiği gibi, İbn Vahb'ın Malik'ten yaptığı bir ekleme olduğunu açıklıyor. Bu hadis, Malik'in sahabelerinin rivayet zincirleri aracılığıyla Müslim (1/148), Tirmizi (2), Darimi, İbn Huzeyme ve İbn Hibban'da da bulunmaktadır. {cite:muwatta-maruf-1997 s.70} {cite:muwatta-maruf-1997 s.71}"
  id: "Malik meriwayatkannya dari Suhayl ibn Abi Salih, dari ayahnya, dari Abu Hurayrah, dalam bab tentang tata cara wudhu yang lengkap: “Ketika seorang Muslim berwudhu dan membasuh wajahnya, setiap dosa yang dilakukannya dengan matanya akan terhapus bersama air atau dengan tetes terakhirnya. Dan ketika dia membasuh tangannya, setiap dosa yang dilakukannya dengan tangannya akan terhapus, hingga dia keluar dalam keadaan bersih dari segala dosa.” Editor mengutip al-Baji yang mengatakan bahwa frasa “atau orang beriman” adalah keraguan dari perawi. Dia mengklarifikasi bahwa penambahan penyebutan dua orang tersebut, yang muncul dalam beberapa versi dan dalam tafsir al-Suyuti dan al-Zarqani, bukanlah dari riwayat Yahya, melainkan tambahan oleh Ibn Wahb dari Malik, sebagaimana disebutkan oleh Ibn Abd al-Barr (al-Tamhid 21/261). Hadits ini juga ditemukan dalam Muslim (1/148), al-Tirmidhi (2), al-Darimi, Ibn Khuzaymah, dan Ibn Hibban melalui sanad para sahabat Malik. {cite:muwatta-maruf-1997 p.70} {cite:muwatta-maruf-1997 p.71}"
