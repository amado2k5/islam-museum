ref: "1.67"
label: { ar: "الموطأ 67 — أبو هريرة: تخرج الخطايا مع الماء حتى يخرج نقياً من الذنوب", en: "Muwatta 67" }
text: "إذا توضأ العبد المسلم أو المؤمن فغسل وجهه خرجت من وجهه كل خطيئة نظر إليها بعينيه مع الماء أو مع آخر قطر الماء"
summary:
  ar: "يرويه مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة، في باب جامع الوضوء: إذا توضأ المسلم فغسل وجهه خرجت منه كل خطيئة نظر إليها بعينيه مع الماء أو مع آخر قطره، وإذا غسل يديه خرجت منهما كل خطيئة بطشتها يداه، حتى يخرج نقياً من الذنوب. وينقل المحقق عن الباجي أن قوله «أو المؤمن» شك من الراوي، ويبين أن زيادة ذكر الرجلين الواردة في بعض النسخ وشرحي السيوطي والزرقاني ليست من رواية يحيى وإنما هي زيادة ابن وهب عن مالك كما ذكر ابن عبد البر (التمهيد 21/261)، ويخرّج الحديث عند مسلم (1/148) والترمذي (2) والدارمي وابن خزيمة وابن حبان من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.70} {cite:muwatta-maruf-1997 p.71}"
