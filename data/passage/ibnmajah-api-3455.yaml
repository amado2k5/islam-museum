label: { ar: "سنن ابن ماجه 3455 — الكمأة، تمر العجوة", en: "Sunan Ibn Majah 3455 — truffles and their water for the eye; 'ajwa dates", ur: "سنن ابن ماجہ 3455 — کھمبی، عجوہ کھجور" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا أَبُو عَبْدِ الصَّمَدِ، حَدَّثَنَا مَطَرٌ الْوَرَّاقُ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ كُنَّا نَتَحَدَّثُ عِنْدَ رَسُولِ اللَّهِ ـ فَذَكَرْنَا الْكَمْأَةَ فَقَالُوا هِيَ جُدَرِيُّ الأَرْضِ. فَنُمِيَ الْحَدِيثُ إِلَى رَسُولِ اللَّهِ ـ فَقَالَ \" الْكَمْأَةُ مِنَ الْمَنِّ وَالْعَجْوَةُ مِنَ الْجَنَّةِ وَهِيَ شِفَاءٌ مِنَ السَّمِّ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3455، يذكر الكمأة، وتمر العجوة، وأسماء الأمراض، والسم والترياق، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3455 (Chapters on Medicine), that mentions truffles and their water for the eye, 'ajwa dates, named diseases, poison and antidote, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3455، جس میں کھمبی، عجوہ کھجور، بیماریوں کے نام، زہر اور تریاق، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
