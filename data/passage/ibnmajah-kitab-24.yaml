summary:
  ar: "القسم 24 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجهاد»، ويضم فيها النصوص من 2753 إلى 2881 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 24 of Sunan Ibn Majah (The Chapters on Jihad) in the division of the open hadith dataset the museum took its reports from: reports 2753 to 2881 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 24، عنوان «کتاب الجہاد»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2753 تا 2881۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 24 de Sunan Ibn Majah (Los capítulos sobre la yihad) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2753 al 2881, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 24 du Sunan Ibn Majah (Les chapitres sur le jihad), qui comprend les hadiths 2753 à 2881 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
