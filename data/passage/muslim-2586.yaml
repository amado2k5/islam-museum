label: { ar: "مسلم 2586 — مثل المؤمنين في توادهم كالجسد", en: "Muslim 2586 — The believers' likeness in compassion is one body" }
text: "قال رسول الله: «مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد: إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى»"
summary:
