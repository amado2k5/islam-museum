label: { ar: "سنن أبي داود 88 — الأب والأبوة", en: "Sunan Abi Dawud 88 — the father and fatherhood", ur: "سنن ابی داؤد 88 — باپ اور والدیت" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ الأَرْقَمِ، أَنَّهُ خَرَجَ حَاجًّا أَوْ مُعْتَمِرًا وَمَعَهُ النَّاسُ وَهُوَ يَؤُمُّهُمْ فَلَمَّا كَانَ ذَاتَ يَوْمٍ أَقَامَ الصَّلاَةَ صَلاَةَ الصُّبْحِ ثُمَّ قَالَ لِيَتَقَدَّمْ أَحَدُكُمْ. وَذَهَبَ إِلَى الْخَلاَءِ فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِذَا أَرَادَ أَحَدُكُمْ أَنْ يَذْهَبَ الْخَلاَءَ وَقَامَتِ الصَّلاَةُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 88، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 88 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 88، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
