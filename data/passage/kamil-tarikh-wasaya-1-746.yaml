text: "… وكان عُمره ثلاثاً وستّين سنة، وقيل: كان عمره تسعاً وخمسين، وقيل: خمساً وستّين، وقيل: ثمانياً وخمسين. والأوّل أصحّ. ولما قَتل دُفن عند مسجد الجماعة، وقيل: في القصر، وقيل غير ذلك. والأصح أنّ قبره هو الموضع الذي يُزار ويُتبرّك به. كان …"
