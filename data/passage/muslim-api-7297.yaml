label: { ar: "صحيح مسلم 7297 — الأب والأبوة", en: "Sahih Muslim 7297 — the father and fatherhood", ur: "صحیح مسلم 7297 — باپ اور والدیت", es: "Sahih Muslim 7297 — El padre y la paternidad", fr: "Sahih Muslim 7297 — Le père et la paternité" }
text: "… وَوَاصِلُ بْنُ عَبْدِ الأَعْلَى، وَأَحْمَدُ بْنُ عُمَرَ الْوَكِيعِيُّ، - وَاللَّفْظُ لاِبْنِ أَبَانَ - قَالُوا حَدَّثَنَا ابْنُ فُضَيْلٍ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ سَالِمَ بْنَ عَبْدِ اللَّهِ، بْنِ عُمَرَ يَقُولُ يَا أَهْلَ الْعِرَاقِ مَا أَسْأَلَكُمْ عَنِ الصَّغِيرَةِ وَأَرْكَبَكُمْ لِلْكَبِيرَةِ سَمِعْتُ أَبِي عَبْدَ اللَّهِ بْنَ عُمَرَ يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ الْفِتْنَةَ تَجِيءُ مِنْ هَا هُنَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 7297، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7297 (The Book of Tribulations and Portents of the Last Hour), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7297، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 7297 (El Libro de las Tribulaciones y Presagios de la Última Hora), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 7297 (Le Livre des tribulations et des présages de la fin des temps), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
