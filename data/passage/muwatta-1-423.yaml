text: "لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يخسف به خيراً له من أن يمر بين يديه"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن عطاء بن يسار أن كعب الأحبار قال، في باب التشديد في أن يمر أحد بين يدي المصلي: لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يُخسف به خيراً له من أن يمر بين يديه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.221}"
