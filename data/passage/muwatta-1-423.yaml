text: "لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يخسف به خيراً له من أن يمر بين يديه"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن عطاء بن يسار أن كعب الأحبار قال، في باب التشديد في أن يمر أحد بين يدي المصلي: لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يُخسف به خيراً له من أن يمر بين يديه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.221}"
  tr: "Malik'in Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiği bir hadiste, Ka'b el-Ahbar'ın namaz kılanın önünden geçmenin şiddeti bölümünde şöyle dediği belirtilir: \"Namaz kılanın önünden geçen kişi başına gelecek günahı bilseydi, önünden geçmektense yerin dibine gömülmesi daha iyi olurdu.\" Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Abd el-Razzaq ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.221}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Zayd ibn Aslam dari Ata ibn Yasar, bahwa Ka'b al-Ahbar berkata, dalam bab tentang beratnya dosa melewati orang yang sedang shalat: \"Jika orang yang melewati orang yang sedang shalat mengetahui apa yang akan ia tanggung, lebih baik baginya ditelan bumi daripada melewatinya.\" Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, Abd al-Razzaq, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.221}"
