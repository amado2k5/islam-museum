label: { ar: "الموطأ 824 — بلاغ: عمر أرسل إلى الحارث بن هشام أن غداً يوم عاشوراء فصم وأمر أهلك أن يصوموا", en: "Muwatta 824" }
text: "أن غداً يوم عاشوراء، فصم وأمر أهلك أن يصوموا"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عمر بن الخطاب أرسل إلى الحارث بن هشام: أن غداً يوم عاشوراء، فصم وأمر أهلك أن يصوموا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق (7838) وابن أبي شيبة رويا عن غير طريق مالك أن عمر أرسل إلى عبد الرحمن بن الحارث ليلة عاشوراء أن تسحر وأصبح صائماً فأصبح صائماً. {cite:muwatta-maruf-1997 p.403}"
