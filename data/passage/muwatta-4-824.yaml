label: { ar: "الموطأ 824 — بلاغ: عمر أرسل إلى الحارث بن هشام أن غداً يوم عاشوراء فصم وأمر أهلك أن يصوموا", en: "Muwatta 824", es: "Muwatta 824", fr: "Muwatta 824", ur: "موطا 824", tr: "El-Muvatta 824 — Rivayet: Ömer, El-Harith ibn Hişam'a yarın Aşura günü olduğunu, oruç tutmasını ve ailesine de oruç tutmalarını emretmesini bildirdi.", id: "Al-Muwatta 824 — Laporan: Umar mengirim pesan kepada Al-Harith ibn Hisham bahwa besok adalah hari Asyura, maka berpuasalah dan perintahkan keluargamu untuk berpuasa." }
text: "أن غداً يوم عاشوراء، فصم وأمر أهلك أن يصوموا"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عمر بن الخطاب أرسل إلى الحارث بن هشام: أن غداً يوم عاشوراء، فصم وأمر أهلك أن يصوموا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق (7838) وابن أبي شيبة رويا عن غير طريق مالك أن عمر أرسل إلى عبد الرحمن بن الحارث ليلة عاشوراء أن تسحر وأصبح صائماً فأصبح صائماً. {cite:muwatta-maruf-1997 p.403}"
  tr: "Malik, Ömer ibn el-Hattab'ın el-Harith ibn Hişam'a şöyle bir mesaj gönderdiğini duyduğunu bildirmiştir: \"Yarın Aşura günü, oruç tut ve ailene de oruç tutmalarını emret.\" Araştırmacı, Ebu Musab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve Abdül-Razzak (7838) ve İbn Abi Şeybe'nin, Malik'inkinden farklı bir rivayet zinciriyle, Ömer'in Aşura gecesi Abdül-Rahman ibn el-Harith'e sabah yemeğini yemesini ve ertesi gün oruç tutmasını söylediğini, bunun üzerine Abdül-Rahman ibn el-Harith'in ertesi gün oruç tuttuğunu belirtmektedir. {cite:muwatta-maruf-1997 s.403}"
  id: "Malik meriwayatkan bahwa ia mendengar Umar ibn al-Khattab mengirim pesan kepada al-Harith ibn Hisham: “Besok adalah hari Asyura, maka berpuasalah dan perintahkan keluargamu untuk berpuasa.” Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik, dan bahwa Abd al-Razzaq (7838) dan Ibn Abi Shaybah meriwayatkan, melalui sanad selain Malik, bahwa Umar mengirim pesan kepada Abd al-Rahman ibn al-Harith pada malam Asyura untuk makan sahur dan berpuasa keesokan harinya, lalu ia berpuasa keesokan harinya. {cite:muwatta-maruf-1997 p.403}"
