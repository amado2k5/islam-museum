text: "مر حكيم) قال: أمر السنة إلى السنة إلا الشقاء والسعادة، فإنه في كتاب الله لا يبدل، ولا يغير. وأخرج عبد بن حميد، وابن جرير، وابن أبي حاتم، والحاكم وصححه، والبيهقي في الشعب قال: إنك لترى الرجل يمشي في الأسواق وقد"
