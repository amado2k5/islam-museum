label: { ar: "الموطأ 1152 — هشام بن عروة عن ابن الزبير: عرفة كلها موقف إلا بطن عرنة، والمزدلفة إلا بطن محسر", en: "Muwatta 1152", es: "Muwatta 1152", fr: "Muwatta 1152", ur: "موطا 1152", tr: "El-Muvatta 1152 — Hişam ibn Urve, İbn el-Zübeyr'den rivayetle: Arafat'ın tamamı, Arnah vadisi hariç, ayakta durulacak bir yerdir; Muzdalifa'nın da Muhasser vadisi hariç, ayakta durulacak bir yerdir.", id: "Al-Muwatta 1152 — Hisham ibn Urwah, berdasarkan riwayat Ibn al-Zubayr: Seluruh Arafah adalah tempat berdiri kecuali lembah Arnah, dan Muzdalifah kecuali lembah Muhassar." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن عبد الله بن الزبير أنه كان يقول اعلموا أن عرفة كلها موقف إلا بطن عرنة، وأن المزدلفة كلها موقف إلا بطن محسر. {cite:muwatta-maruf-1997 p.522}"
  tr: "Malik, Hişam ibn Urve'den, o da Abdullah ibn el-Zübeyr'den rivayet ettiğine göre, şöyle derdi: Bilin ki, Arafat'ın tamamı, Arnah vadisi hariç, durulacak bir yerdir; Muzdalifa'nın tamamı da, Muhasser vadisi hariç, durulacak bir yerdir. {cite:muwatta-maruf-1997 s.522}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari Abdullah ibn al-Zubayr, bahwa beliau biasa berkata: Ketahuilah bahwa seluruh Arafah adalah tempat berdiri kecuali lembah Arnah, dan seluruh Muzdalifah adalah tempat berdiri kecuali lembah Muhassar. {cite:muwatta-maruf-1997 p.522}"
