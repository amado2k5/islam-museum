label: { ar: "نوادر جحا الكبرى، ص 51 — «عار عليك أن لا تكون كابنك»", en: "Nawadir Juha al-Kubra, p. 51 — 'It Is a Shame Not to Be Like Your Son'", ur: "نوادر جحا الکبریٰ، ص 51 — «تمہارے لیے شرم کی بات ہے کہ تم اپنے بیٹے جیسے نہ ہو»", fr: "Nawadir Juha al-Kubra, p. 51 — « C'est une honte de ne pas ressembler à ton fils »", es: "Nawadir Juha al-Kubra, p. 51 — «Es una vergüenza no ser como tu hijo»" }
text: "… عار عليك أنْ لا تكونَ كابنك جاء إلى مدينةِ بروسةَ في شغلٍ واجتهد كثيراً في الدوائر المتعلقة بها أشغالُهُ، فلم يتمَّ شغلُه، فقال له بعضهم : إذا صلَّيت الصبحَ أربعينَ صباحاً في الجامع الكبير حذاء المحرابِ ودعَوْتَ ففي اليوم الحادي …"
summary:
  ar: "في بورصة أخفق رجل في معاملة رسمية، فقيل له أن يصلي أربعين صباحًا في الجامع الكبير، فصلى في الجامع الصغير ونجح، فاندفع إلى الجامع الكبير صائحًا إن من العار ألا يكون مثل ابنه. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  en: "In Bursa, a man fails at official business; told to pray forty mornings at the Great Mosque, he prays at the Small Mosque and succeeds; he rushes to the Great Mosque shouting that it is a shame not to be like his son. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  ur: "بورصہ میں ایک آدمی کا سرکاری کام نہ بنا؛ اسے کہا گیا کہ چالیس صبحیں جامع مسجد کبیر میں نماز پڑھو، تو اس نے چھوٹی مسجد میں نماز پڑھی اور کامیاب ہو گیا؛ وہ دوڑتا ہوا بڑی مسجد پہنچا اور چلایا کہ اپنے بیٹے جیسا نہ ہونا شرم کی بات ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  fr: "À Bursa, un homme échoue dans une démarche officielle ; on lui dit de prier quarante matins à la Grande Mosquée, il prie à la Petite Mosquée et réussit ; il se précipite à la Grande Mosquée en criant que c'est une honte de ne pas ressembler à son fils. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  es: "En Bursa, un hombre fracasa en un trámite oficial; le dicen que rece cuarenta mañanas en la Gran Mezquita, reza en la Pequeña Mezquita y tiene éxito; corre a la Gran Mezquita gritando que es una vergüenza no ser como su hijo. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
