text: "… تويده التجربة أو الواقع أن شيئاً ما يطر الناس تناوله، فانه يكون محرما بنص آية أخرى حيث وصف الرسول فى سورة الإعراف بأن، يجل الطيبات ويحرم الخبانث، فكل طيب حلال، وكل خياث حرام بذا النض. هذا ولا يصح ترديد أن …"
