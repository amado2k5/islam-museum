text: "… في خرقة كان يمسح بها وجهه قدر دانقين. وعن حنبل قال: أعطى بعض ولد الفضل بن الربيع أبا عبد اللّٰه وهو في الحبس ثلاث شعرات فقال: هذا من شعر النبي. فأوصى أبو عبد اللّٰه عند موته أن يجعل على كل …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 503، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 503, that mentions a testament or parting counsel, a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 503 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 4, pág. 503, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, una reliquia conservada tras su dueño; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 4, p. 503) mentionnant un testament ou des dernières volontés, un lit de mort et les dernières heures, ainsi qu'une relique conservée après son propriétaire. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire des Testaments."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 4. cildinin 503. sayfasından bir alıntı, vasiyetname veya son miras, ölüm saati ve korunmuş kutsal emanetlerden birinden bahsetmektedir; bu alıntı, makineyle okunabilir fotokopi versiyonundan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 4, halaman 503, menyebutkan wasiat atau surat wasiat terakhir, saat kematian, dan sebuah relik dari relik yang terpelihara; diambil dari versi fotokopi yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, relik, dan makam suci."
