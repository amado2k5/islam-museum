text: "… كل قلوبكم ! ولا تملوا كلام للّه وذكره : لا تقسى عنه قلوبكم! فانه من يختار اللّه : يصطفى فقد اه خيرته من الأعمال وخيرته من العباد والصالح من الحديث ومن كل ما اوتى الناس من الحلال والحرام، فاعبدوا اللّٰه …"
