label: { ar: "جامع الترمذي 2294 — الأب والأبوة", en: "Jami' al-Tirmidhi 2294 — the father and fatherhood", ur: "جامع ترمذی 2294 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2294 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا وَهْبُ بْنُ جَرِيرِ بْنِ حَازِمٍ، عَنْ أَبِيهِ، عَنْ أَبِي رَجَاءٍ، عَنْ سَمُرَةَ بْنِ جُنْدَبٍ، قَالَ كَانَ النَّبِيُّ إِذَا صَلَّى بِنَا الصُّبْحَ أَقْبَلَ عَلَى النَّاسِ بِوَجْهِهِ وَقَالَ \" هَلْ رَأَى أَحَدٌ مِنْكُمُ اللَّيْلَةَ رُؤْيَا \". قَالَ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَيُرْوَى هَذَا الْحَدِيثُ عَنْ عَوْفٍ وَجَرِيرِ بْنِ حَازِمٍ عَنْ أَبِي رَجَاءٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2294، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2294 (Chapters On Dreams), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2294، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2294 (Capítulos sobre los sueños), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
