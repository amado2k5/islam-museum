text: "… وصوم رمضان، وأن تعطوا الخمس من المغنم. فجعل ذلك كله من الإيمان. وقال النبي : الحياء من الإيمان، و الحياء شُعبة من الإيمان. وقال: أكمل المؤمنين إيمانًا أحسنهم خلقًا. وقال: إن البذاذة من الإيمان."
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 552، يذكر شعب الإيمان، وما عُدّ من الإيمان، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 552, that mentions the branches of faith, what is counted as part of faith, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 552 کا اقتباس جس میں ایمان کی شاخیں، جو ایمان میں سے گنا گیا، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 552, que menciona las ramas de la fe, lo que se considera parte de ella, su dulzura y plenitud; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
