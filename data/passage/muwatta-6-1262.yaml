label: { ar: "الموطأ 1262 — مالك في القوم يصيبون الصيد جميعا وهم محرمون: على كل إنسان منهم جزاؤه، وكذلك في القتل الخطأ", en: "Muwatta 1262", es: "Muwatta 1262", fr: "Muwatta 1262", ur: "موطا 1262", tr: "El-Muvatta 1262 — Malik, ihramlı halde avlanan bir grup insan hakkında şöyle demiştir: Her biri cezayı çekmelidir ve bu, kasıtsız öldürme için de geçerlidir.", id: "Al-Muwatta 1262 — Malik berkata tentang sekelompok orang yang semuanya berburu dalam keadaan ihram: masing-masing dari mereka harus menanggung hukumannya, dan hal yang sama berlaku untuk pembunuhan yang tidak disengaja." }
summary:
  ar: "يقول مالك في القوم يصيبون الصيد جميعا وهم محرمون أو في الحرم، إن على كل إنسان منهم جزاءه، إن حكم عليهم بالهدي فعلى كل واحد هدي، وإن حكم بالصيام فعلى كل واحد صيام. ومثل ذلك القوم يقتلون الرجل خطأ، فكفارة ذلك عتق رقبة على كل إنسان منهم، أو صيام شهرين متتابعين على كل إنسان منهم. {cite:muwatta-maruf-1997 p.561}"
  tr: "Malik, bir grup insanın ihramlı halde veya kutsal mekânda birlikte avlanması durumunda, her birinin bir ceza ödemesi gerektiğini söyler. Ceza kurban kesmek ise, her biri kurban kesmelidir; ceza oruç tutmak ise, her biri oruç tutmalıdır. Benzer şekilde, bir grup insan kasıtsız olarak bir insanı öldürürse, bunun kefareti ya her birinin bir köle azat etmesi ya da her birinin iki ay boyunca oruç tutmasıdır. {cite:muwatta-maruf-1997 s.561}"
  id: "Malik mengatakan bahwa jika sekelompok orang berburu bersama dalam keadaan ihram atau di dalam tempat suci, masing-masing dari mereka harus membayar hukuman. Jika hukumannya adalah persembahan kurban, maka masing-masing harus mempersembahkan kurban; jika hukumannya adalah puasa, maka masing-masing harus berpuasa. Demikian pula, jika sekelompok orang membunuh seseorang tanpa sengaja, penebusannya adalah membebaskan seorang budak untuk masing-masing dari mereka atau berpuasa selama dua bulan berturut-turut untuk masing-masing dari mereka. {cite:muwatta-maruf-1997 p.561}"
