label: { ar: "الموطأ 1262 — مالك في القوم يصيبون الصيد جميعا وهم محرمون: على كل إنسان منهم جزاؤه، وكذلك في القتل الخطأ", en: "Muwatta 1262" }
summary:
  ar: "يقول مالك في القوم يصيبون الصيد جميعا وهم محرمون أو في الحرم، إن على كل إنسان منهم جزاءه، إن حكم عليهم بالهدي فعلى كل واحد هدي، وإن حكم بالصيام فعلى كل واحد صيام. ومثل ذلك القوم يقتلون الرجل خطأ، فكفارة ذلك عتق رقبة على كل إنسان منهم، أو صيام شهرين متتابعين على كل إنسان منهم. {cite:muwatta-maruf-1997 p.561}"
