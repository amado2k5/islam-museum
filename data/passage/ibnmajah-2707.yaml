label:
  ar: "ابن ماجه 2707 — أنى تعجزني ابن آدم وقد خلقتك من مثل هذه"
  en: "Ibn Majah 2707 — How can you elude Me, son of Adam, when I created you from the like of this"
  ur: "ابن ماجہ 2707 — اے ابن آدم تم مجھے کیسے عاجز کرو گے جبکہ میں نے تمہیں اس جیسی چیز سے پیدا کیا"
text: "يقول الله عز وجل أنى تعجزني ابن آدم وقد خلقتك من مثل هذه فإذا بلغت نفسك هذه - وأشار إلى حلقه - قلت أتصدق وأنى أوان الصدقة ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 2707: أنى تعجزني ابن آدم وقد خلقتك من مثل هذه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 2707: How can you elude Me, son of Adam, when I created you from the like of this. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 2707: اے ابن آدم تم مجھے کیسے عاجز کرو گے جبکہ میں نے تمہیں اس جیسی چیز سے پیدا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
