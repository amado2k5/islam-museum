summary:
  ar: "القسم 50 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التوبة»، ويضم فيها النصوص من 6952 إلى 7023 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 50 of Sahih Muslim (The Book of Repentance) in the division of the open hadith dataset the museum took its reports from: reports 6952 to 7023 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 50، عنوان «کتاب التوبۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6952 تا 7023۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 50 de Sahih Muslim (El Libro del Arrepentimiento) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6952 al 7023, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses données du Sahih Muslim (Livre du Repentir), volume 50, dans la base de données ouverte des hadiths: les hadiths 6952 à 7023 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 50. bölümü \"Tövbe Kitabı\" başlığını taşımakta olup, 6952'den 7023'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 50 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Taubat\" dan berisi teks 6952 hingga 7023, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
