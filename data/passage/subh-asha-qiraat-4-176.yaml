  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 4, p. 176, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
