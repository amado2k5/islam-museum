text: "… الأقاليم القبلية عوضا عن مدينة الأشمونيين. وقد ذكر الإدريسى أنها كات مدينة السعرة، ومنها جلب فرعون مصر سترة،وسى، وقال أبو عيد البكرى : إن أنصنا كورة عظيمة من كور مصر، وكانت مارية القبطية من قرية من قراها يقال ها حفى …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 54، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 54, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 54 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
