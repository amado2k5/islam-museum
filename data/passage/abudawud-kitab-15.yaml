summary:
  ar: "القسم 15 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجهاد»، ويضم فيها النصوص من 2477 إلى 2787 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 15 of Sunan Abi Dawud (Jihad (Kitab Al-Jihad)) in the division of the open hadith dataset the museum took its reports from: reports 2477 to 2787 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 15، عنوان «کتاب الجہاد»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2477 تا 2787۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 15 de Sunan Abi Dawud (Yihad (Kitab Al-Jihad)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2477 al 2787, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan Abi Dawud (Jihad), livre 15, qui comprend les hadiths 2477 à 2787 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 15. bölümü \"Cihad Kitabı\" başlığını taşımakta olup, 2477'den 2787'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 15 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Jihad\" dan berisi teks 2477 hingga 2787, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
