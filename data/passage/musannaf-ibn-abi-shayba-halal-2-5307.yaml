text: "… عن أبي جعفر قال: النبيذ حلال. - حدَّثنا أبو بكر قال: حدَّثنا محمد بن فُضَيل عن سفيان العَطَّار قال: سأل رجل ماهان الحنفيَّ فقال: يا أبا سالم، ما تقول في النبيذ؟ فقال: أقول في النبيذ: إن من حَرَّم ما أحلَّ …"
summary:
