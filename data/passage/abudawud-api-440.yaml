label: { ar: "سنن أبي داود 440 — الأب والأبوة", en: "Sunan Abi Dawud 440 — the father and fatherhood", ur: "سنن ابی داؤد 440 — باپ اور والدیت", es: "Sunan Abi Dawud 440 — El padre y la paternidad", fr: "Sunan Abi Dawud 440 — le père et la paternité" }
text: "حَدَّثَنَا هَنَّادٌ، حَدَّثَنَا عَبْثَرٌ، عَنْ حُصَيْنٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ بِمَعْنَاهُ قَالَ فَتَوَضَّأَ حِينَ ارْتَفَعَتِ الشَّمْسُ فَصَلَّى بِهِمْ."
summary:
  ar: "حديث في سنن أبي داود، رقم 440، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 440 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 440، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 440 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 440 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
