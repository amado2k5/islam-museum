label: { ar: "صحيح البخاري 6955 — الفريضة والفرائض، ما فرضه الله ورسوله", en: "Sahih al-Bukhari 6955 — the obligation (farida); what God and His Messenger made obligatory", ur: "صحیح بخاری 6955 — فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا", fr: "Sahih al-Bukhari 6955 — l'obligation (farida) ; ce que Dieu et Son Messager ont rendu obligatoire", es: "Sahih al-Bujari 6955 — la obligación (farida); lo que Dios y Su Mensajero hicieron obligatorio", tr: "Sahih el-Buhari 6955 — Allah ve Resulü'nün farz kıldığı farz ve yükümlülükler", id: "Sahih al-Bukhari 6955 — Kewajiban dan kewajiban-kewajiban yang telah ditetapkan oleh Allah dan Rasul-Nya" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ الأَنْصَارِيُّ، حَدَّثَنَا أَبِي، حَدَّثَنَا ثُمَامَةُ بْنُ عَبْدِ اللَّهِ بْنِ أَنَسٍ، أَنَّ أَنَسًا، حَدَّثَهُ أَنَّ أَبَا بَكْرٍ كَتَبَ لَهُ فَرِيضَةَ الصَّدَقَةِ الَّتِي فَرَضَ رَسُولُ اللَّهِ \" وَلاَ يُجْمَعُ بَيْنَ مُتَفَرِّقٍ وَلاَ يُفَرَّقُ بَيْنَ مُجْتَمِعٍ خَشْيَةَ الصَّدَقَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6955، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 6955 (Tricks), whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 6955، جس کے الفاظ میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6955, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 6955, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Buhari'de 6955 numaralı hadis, farz olan amelleri ve görevleri, Allah ve Resulü'nün emrettiklerini ve bireysel yükümlülükleri zikretmektedir. Bu hadis, farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh edilen amelleri, haram olan amelleri ve küçük günahları araştırma konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamber'in hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6955, menyebutkan tentang amalan dan kewajiban yang wajib, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, serta kewajiban individu. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
