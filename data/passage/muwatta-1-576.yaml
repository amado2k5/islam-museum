label: { ar: "الموطأ 576 — زيد بن أسلم: ما من داع يدعو إلا كان بين إحدى ثلاث", en: "Muwatta 576", es: "Muwatta 576", fr: "Muwatta 576", ur: "موطا 576", tr: "El-Muvatta 576 — Zeyd ibn Aslam: Davet eden hiçbir kimse üç kişiden biri olmadıkça davet etmez.", id: "Al-Muwatta 576 — Zayd ibn Aslam: Tidak ada seorang penyeru yang menyeru kecuali dia berada di antara tiga golongan" }
text: "ما من داع يدعو، إلا كان بين إحدى ثلاث: إما أن يستجاب له، وإما أن يدخر له، وإما أن يكفر عنه"
summary:
  ar: "آخر حديث في باب ما جاء في الدعاء. يرويه مالك عن زيد بن أسلم أنه كان يقول: ما من داع يدعو إلا كان بين إحدى ثلاث: إما أن يستجاب له، وإما أن يدخر له، وإما أن يكفر عنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر ⁦(التمهيد 5/343)⁩ أن مثله يستحيل أن يكون رأياً واجتهاداً وإنما هو توقيف. {cite:muwatta-maruf-1997 p.298}"
  tr: "Dua bölümündeki son hadis. Malik, Zeyd ibn Aslam'dan rivayet eder ki, Zeyd ibn Aslam şöyle derdi: \"Dua eden hiçbir kimse üç durumdan birinde değildir: ya duası kabul edilir, ya duası onun için saklanır, ya da günahı kefaret edilir.\" Editör, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtir ve İbn Abdül-Barr'ın (el-Tamhid 5/343) böyle bir şeyin görüş veya yorum meselesi olamayacağını, aksine ilahi olarak vahyedildiğini söylediğini aktarır. {cite:muwatta-maruf-1997 s.298}"
  id: "Hadits terakhir dalam bab tentang doa. Malik meriwayatkannya dari Zayd ibn Aslam, yang biasa berkata: “Tidak ada seorang pun yang berdoa kecuali ia berada dalam salah satu dari tiga keadaan: doanya dikabulkan, atau disimpan untuknya, atau diampuni untuknya.” Editor menyebutkan bahwa Abu Mus’ab dan Suwayd meriwayatkannya dari Malik, dan mengutip Ibnu Abd al-Barr (al-Tamhid 5/343) yang mengatakan bahwa hal seperti itu tidak mungkin merupakan masalah pendapat atau interpretasi, melainkan wahyu ilahi. {cite:muwatta-maruf-1997 p.298}"
