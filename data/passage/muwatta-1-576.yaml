label: { ar: "الموطأ 576 — زيد بن أسلم: ما من داع يدعو إلا كان بين إحدى ثلاث", en: "Muwatta 576" }
text: "ما من داع يدعو، إلا كان بين إحدى ثلاث: إما أن يستجاب له، وإما أن يدخر له، وإما أن يكفر عنه"
summary:
  ar: "آخر حديث في باب ما جاء في الدعاء. يرويه مالك عن زيد بن أسلم أنه كان يقول: ما من داع يدعو إلا كان بين إحدى ثلاث: إما أن يستجاب له، وإما أن يدخر له، وإما أن يكفر عنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 5/343) أن مثله يستحيل أن يكون رأياً واجتهاداً وإنما هو توقيف. {cite:muwatta-maruf-1997 p.298}"
