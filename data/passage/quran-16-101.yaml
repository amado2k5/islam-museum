text: "وَإِذَا بَدَّلْنَآ ءَايَةً مَّكَانَ ءَايَةٍ ۙ وَٱللَّهُ أَعْلَمُ بِمَا يُنَزِّلُ قَالُوٓا۟ إِنَّمَآ أَنتَ مُفْتَرٍۭ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ"
text_search: "وإذا بدلنا آية مكان آية ۙ والله أعلم بما ينزل قالوا إنما أنت مفتر ۚ بل أكثرهم لا يعلمون"
translations:
  en: { text: "And when We put a revelation in place of (another) revelation, - and Allah knoweth best what He revealeth - they say: Lo! thou art but inventing. Most of them know not.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور جب ہم کوئی آیت کسی آیت کی جگہ بدل دیتے ہیں۔ اور خدا جو کچھ نازل فرماتا ہے اسے خوب جانتا ہے تو (کافر) کہتے ہیں کہ تم یونہی اپنی طرف سے بنا لاتے ہو۔ حقیقت یہ ہے کہ ان میں اکثر نادان ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
