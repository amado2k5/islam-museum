text: "… واجب، وما طلبه على سبيل الترجيح فى غير إلزام فهو مندوب، وماطلب الشارع تركه على سبيل الإِلزام فهو حرام، وما طلب تركه على سبيل الترجيح من غير إلزام فهو مكروه، وما خير الشارع بين عمله وتركه فهو مباح. لسان العرب، …"
