text: "… واجب، وما طلبه على سبيل الترجيح فى غير إلزام فهو مندوب، وماطلب الشارع تركه على سبيل الإِلزام فهو حرام، وما طلب تركه على سبيل الترجيح من غير إلزام فهو مكروه، وما خير الشارع بين عمله وتركه فهو مباح. لسان العرب، …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 1، ص 334، يذكر الحرام، والمباح، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 1, p. 334, that mentions the unlawful, the permissible, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 1، ص 334 کا اقتباس جس میں حرام، مباح، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 1, pág. 334, que menciona lo ilícito, lo permisible y lo reprobable; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation, volume 1, p. 334) mentionnant ce qui est illicite, licite et déconseillé; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 1, sayfa 334'ten, haram, helal ve mekruh olan şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 1 Bergambar, halaman 334, yang menyebutkan hal-hal yang dilarang, yang diperbolehkan, dan yang tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
