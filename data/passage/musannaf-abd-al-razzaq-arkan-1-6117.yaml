text: "… عبدي الحكمة يمانية الحل ميتته الحمرة من زينة الشيطان الحنيفية السمحة أي الدين أفضل؟ الحياء شعبة من الإيمان خذ أجازتك، واذهب عنا خذ بيد من شئت خذ الشارف، والناب، والعوراء خذ منها لمن خلعته زوجته خذ هذه فتخصر بها خذوا …"
