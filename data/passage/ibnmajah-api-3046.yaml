label: { ar: "سنن ابن ماجه 3046 — ما لا يحل", en: "Sunan Ibn Majah 3046 — what is not lawful", ur: "سنن ابن ماجہ 3046 — جو حلال نہیں", es: "Sunan Ibn Majah 3046 — lo que no es lícito", fr: "Sunan Ibn Majah 3046 — ce qui n'est pas licite" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ عُبَيْدِ اللَّهِ بْنِ عُمَرَ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّ حَفْصَةَ، زَوْجَ النَّبِيِّ ـ قَالَتْ قُلْتُ يَا رَسُولَ اللَّهِ مَا شَأْنُ النَّاسِ حَلُّوا وَلَمْ تَحِلَّ أَنْتَ مِنْ عُمْرَتِكَ قَالَ \" إِنِّي لَبَّدْتُ رَأْسِي وَقَلَّدْتُ هَدْيِي فَلاَ أَحِلُّ حَتَّى أَنْحَرَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3046، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 3046 (Chapters on Hajj Rituals), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3046، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3046 (Capítulos sobre los rituales del Hajj), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 3046 (Chapitres sur les rites du Hajj), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
