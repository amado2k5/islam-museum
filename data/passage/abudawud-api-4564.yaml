label: { ar: "سنن أبي داود 4564 — الأب والأبوة", en: "Sunan Abi Dawud 4564 — the father and fatherhood", ur: "سنن ابی داؤد 4564 — باپ اور والدیت", es: "Sunan Abi Dawud 4564 — El padre y la paternidad" }
text: "… مُحَمَّدٌ، - يَعْنِي ابْنَ رَاشِدٍ - عَنْ سُلَيْمَانَ، - يَعْنِي ابْنَ مُوسَى - عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ كَانَ رَسُولُ اللَّهِ يُقَوِّمُ دِيَةَ الْخَطَإِ عَلَى أَهْلِ الْقُرَى أَرْبَعَمِائَةِ دِينَارٍ أَوْ عَدْلَهَا مِنَ الْوَرِقِ يُقَوِّمُهَا عَلَى أَثْمَانِ الإِبِلِ فَإِذَا غَلَتْ رَفَعَ فِي قِيمَتِهَا وَإِذَا هَاجَتْ رُخْصًا نَقَصَ مِنْ قِيمَتِهَا وَبَلَغَتْ عَلَى عَهْدِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4564، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4564 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4564، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4564 (Tipos de sangre y sabiduría (Kitab Al-Diyat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
