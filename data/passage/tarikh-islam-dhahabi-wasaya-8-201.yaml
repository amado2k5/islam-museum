text: "إنّي أوتر. ولما احتضر أوصى أن لا يؤذن بجنازته أحد، وكذلك أوصى علقمة. إسرائيل، عن أبي إسحاق قال: رأيت أبا جُحَيفة في جنازة أبي مَيْسرة آخذاً بقائمة السرير حتى أخرج، ثمّ جعل يقول: غفر اللّٰه لك أبا ميسرة. قال ابن …"
