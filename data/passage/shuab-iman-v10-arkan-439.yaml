text: "… حدثنا أبو داود سليمان بن محمد المباركي، حدثنا أبو شهاب، عن سفيان الثوري، عن الحجاج بن فرافصة، عن يحيى بن أبي كثير، عن أبي سلمة بن عبدالرحمن، عن أبي هريرة قال: قال رسول اللّٰه وَلِقِ المؤمن غرّ كريم، والفاجر خبّ …"
