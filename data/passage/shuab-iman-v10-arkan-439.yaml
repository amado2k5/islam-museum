text: "… حدثنا أبو داود سليمان بن محمد المباركي، حدثنا أبو شهاب، عن سفيان الثوري، عن الحجاج بن فرافصة، عن يحيى بن أبي كثير، عن أبي سلمة بن عبدالرحمن، عن أبي هريرة قال: قال رسول اللّٰه وَلِقِ المؤمن غرّ كريم، والفاجر خبّ …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 439، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 439, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 439 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Shu'ab al-Iman de al-Bayhaqi, vol. 10, pág. 439, que menciona una descripción del creyente; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 10, page 439, contenant une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 439. sayfasından, mümini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esasları, imanın esasları, iman dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 439, yang menjelaskan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
