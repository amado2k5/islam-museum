text: "… كان هناك من يتعلم منه - لم يجز ولهما منعه، وإن لم يكن نظر، فان أراد تعلم ما هو فرض عين لم بكن لهما منعه. وفى فرض الكفاية وجهان أصحهما لا يجوز لهما منعه لأنه فرض عليه ما لم يبلغ …"
summary:
  ar: "مقطع من المجموع للنووي، ص 319، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض العين، وفرض الكفاية؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 319, whose wording mentions what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 319 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ عین، فرضِ کفایہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 319, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 319, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
