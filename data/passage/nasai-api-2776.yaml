label: { ar: "سنن النسائي 2776 — الحلال", en: "Sunan al-Nasa'i 2776 — the lawful", ur: "سنن نسائی 2776 — حلال", es: "Sunan al-Nasa'i 2776 - lo lícito" }
text: "أَخْبَرَنَا الْحَسَنُ بْنُ مُحَمَّدٍ الزَّعْفَرَانِيُّ، قَالَ أَنْبَأَنَا يَزِيدُ، قَالَ أَنْبَأَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ كُنْتُ أَفْتِلُ قَلاَئِدَ هَدْىِ رَسُولِ اللَّهِ فَيَبْعَثُ بِهَا ثُمَّ يَأْتِي مَا يَأْتِي الْحَلاَلُ قَبْلَ أَنْ يَبْلُغَ الْهَدْىُ مَحِلَّهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 2776، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2776 (The Book of Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2776، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2776 (El Libro del Hajj), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
