text: |-
  ١٩٠
  ⁦( ياب الحاء)⁩
  ما كان الفرس أقرح ولقد قرح يقرح قرحا وأماقول الشاعر
  حيسن فى قرح وفى داراتها * سبع ليال غير.ملوفاتها
  فهو اسم وادى القرى والقرحان ضرب من السكمأة الواحدة فرحانة وبعير رحان اذالم يصبه
  الجرب قط وصبى قرحان أيضا اذالم يجدّر يستوى فيه الواحد والاثنان وابهع والاسم
  القرح ١ فى الحديث انّ أصحاب النبى صلى اللّٰه عليه وسلم قدموا المدينة وهم قرحان أى لم
  يكن أصابهم قبل ذلكْ داء وأما الذى فى حديت عمررضى اللّٰه عنه حين أراد أن يدخل الشام
  وهى تستعر طاعونا فقيل له ان من معك من أصحاب النبيّ صلى اللّٰه عليه وسلم قوحانون فلا
  تدخلها فهى لغة متروكة وأقرح القوم اذا أصاب ماشيتهم القرح وقرحه بالحق قرحااذا
  استقبله به ولقيته مقارحة أى مواجهة وقرح الحمافرة روحااذا انتهت أسنانه وانما تنتهى
  فى خمر سنين لانه فى السنة الاولى حولى نم جذع ثم ثنى ثم رباع ثم قارح يقال أجذع
  المهر وأثنى وأربع وقرح هذه وحدها بلا ألف والفرس قارح والبجمع قرّح وقد قال أبوذؤيب
  جاورته حين لا يمشى لعقوته * الاالمقانب والقب المقاريح
  والاناث قوادح وفى الاسنان بعد المنايادالرباعيات أربعة قوارح وكل ذى حافريقرح وكل
  ذى خف يبزل وكل ذى ظلف يصلغ قال الاصمعى قرحت الناقسة تقرح قروحا استبان حلها
  فهى قارح والقراح المزرعة التى ليس عليها بنا ولافيها شجر والجمع أقرحة والماء القراح
  الذى لا يشوبه شى والقريحة أول مايستنبط من البئر ومنه قواه-م لفلان قريحة جيدة يراد
  استنباط العلم بجودة الطبع واقترحت عليه شيئا اذا سألته إياهم ن غيرروية واقتراح
  الحكلام ارتجاله واقترحت الجمل اذاركبته قبل أن يركب والقرواح الارض البارزة
  للشحس لم يختلط بهاشئ قال أوس
  فن ينجوته كن بعدقوته • والمستكنّ كن يمشى :رواح
  وناقسة قرواح طويلة القوائم قال الاصمى قلت لاعرابى ما القرواح قال التى كأنما
  تمشى على أرماح ونخلة قرواح والجع القراوح وقال سويد بن الصامت
  أدين ومادين عليكم بمغرم • ولكن على الشم الجلاد القراوح
  رزح أبو عمر والقرزح بالضم شجر زح القزح بالكسر التابل والمقزحة
  نحو من المملهة والتقازيح الابازير وقزحت القدرة قزيحا اذاطرحت فيها الابزار وقزح
  السكلب بيوله فزحارمى به ورشه وقوس قزح التى فى السماء غيرمصروفة وقزح أيضا اسم جبل
  بالمزدلفة ⁦(قلح)⁩ القلح صغرة فى الاسنان قال الاعشى
  قد بنى اللوم ،لميهم بيته * وفشافيهم مع اللؤم القلح
  نقول منه قلح الرجل بالمكسر فهو أقلح وفى المثل عود يقلم أى تنق أسنانه وهوفى مذهبه
  مشل مرّضت الرجسلَ اذاقت عليه فى مرضه وقرّدت البعير نزعت عنهة راده وطنيته اذا
  عالجته من طناه والقلحم المن من كل شىْ وهوملحق بجرد حل بزيادة ميم قال الراجز
  د كنت قل الكبر القلم
  وقال آخر
  أنا ابن اوس حية أسما لاضرع السنّ ولا قعما
