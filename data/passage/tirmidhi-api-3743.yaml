label: { ar: "جامع الترمذي 3743 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 3743 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 3743 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 3743 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos." }
text: "حَدَّثَنَا هَنَّادٌ، قَالَ حَدَّثَنَا عَبْدَةُ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، عَنِ الزُّبَيْرِ، قَالَ جَمَعَ لِي رَسُولُ اللَّهِ أَبَوَيْهِ يَوْمَ قُرَيْظَةَ فَقَالَ \" بِأَبِي وَأُمِّي \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3743، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3743 (Chapters on Virtues), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3743، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3743 (Capítulos sobre las virtudes), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
