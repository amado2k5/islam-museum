label: { ar: "سنن ابن ماجه 2072 — الحلال، الحرام", en: "Sunan Ibn Majah 2072 — the lawful; the unlawful", ur: "سنن ابن ماجہ 2072 — حلال، حرام" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ قَزَعَةَ، حَدَّثَنَا مَسْلَمَةُ بْنُ عَلْقَمَةَ، حَدَّثَنَا دَاوُدُ بْنُ أَبِي هِنْدٍ، عَنْ عَامِرٍ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، قَالَتْ آلَى رَسُولُ اللَّهِ ـ مِنْ نِسَائِهِ وَحَرَّمَ فَجَعَلَ الْحَرَامَ حَلاَلاً. وَجَعَلَ فِي الْيَمِينِ كَفَّارَةً."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2072، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2072 (The Chapters on Divorce), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2072، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
