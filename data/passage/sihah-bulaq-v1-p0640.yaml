text: |-
  الجزء الاوّل من كنا سبدتاج اللغة وصحاح العربية
  صنيف الشج اليى صر اسماعيل بن تناد الجو هزى
  رواية الشيخ اب حمد اسماعيل بن ممد.
  ابن عبدوس النيسابود ى
  رحمة اللّه عليهما
  حمين
  • من قول سيدى عبد الغى النابلسى قدس سرة كمافى حاشة القاموس
  من قال قد بطلت صحاح الحوهرى * لما آنى القاموس فهو المفترى
  قلت اسيه القاموس وهو البحرإن * ينغر فعظم فره بالجوهرى
