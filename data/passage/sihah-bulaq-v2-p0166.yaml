text: |-
  • (باب الهاء
  ٤٢١٠
  تروّحنا من العباقصرا * وعملنا الالاهة أن تؤبا
  وقدجاء على هذا غيرشئ من دخول لام المعرفة الاسم مرّة وسقوطها أخرى قالو القبته
  الندرى وفى ندرى وفينة والفينة بعسد الفينة ونسر والنسراسم صتم ذكانهم سهوها الاهة
  لتعظيمهم لها وعبادتهم اياها والالهة الاصنام هموها بذلك لاعتقادهم أنّ العبادة تحق لها
  وأسماؤهم تتبع اعتقاداتهم لاماعليه الشيء فى نفسه والتأليه التعبيد والتأه التنسك
  والتعبد قال رؤية * سبحن واسترجعن من تألهى* وتقول أله يأه ألها أى تحير وأصله وله
  يوله واه اوقد ألهت على فلان أى اشتد جزعى عليه مثل ولهت امه الامه النسيان تقول
  منه امه بالكسر وقرأً ابن عباس رضى اللّٰه عنهما واذّكر بعداً مه قال الشاعر
  أمهت وكنت لا أنسى حديثا • كذاك الدهر يودى بالعقول
  وأماما فى حسديت الزهرى أمسه بمعنى أقرواعترف فهي لغة غير مشهورة وااميهة بثرتخرج
  بالغنتم كالمصسبة أو الجدرى بقال أمهت الغنم تومه أمهافهى مأموهة ويقال فى الدعاء
  على الانسان آهة وأميهة وأنشدابن الاعرابى
  طبيخ نحازأ وطبيخ أميهة * دقبق العظام سيّ القشم أملط
  والامهة أصل قولهم أم قال قصى * أمهتى خفدف والياس أبى * والجسع
  أمهات وأمات وقال الراعى
  كانت نجائب منذرو محرق * أماتهن وطرقهنّ فحيلا
  ⁦( انه )⁩. الاصمعىّ أنه يأنه أنها وأنوها مثسل أنح يأنح وذلك اذا تزحرمن ثقسل يجده وقوم
  أنه مثل أنح وأنشدارؤبة يصف فيلا
  رعابة يخشي نفوس الانه +برجس بهباه الهدير البهبه
  أى يرعب نفوس الذين يأنهون وه قولهم عنسد الشكاية أوه من كذاسا كنة الواو
  انماهو توجع قال الشاءر
  فأوه لذ كراها اذا ماذكرتها * ومن بعد أرض بينناوسماء
  وربعا قلبوا الواوألفافقالوا آم من كذاوربيات_تدوا الواووكسروها وسكنوا الهاء فقالوا
  أوه من 5-ذاوربماحذفوا مع التشديدا لهاء فقالوا أومن كذا بلامدّ وبعضهم يقول آوه
  بالمدوالتشديد وفتح الواوساكنة الهاء لتطويل الصوت بالشكاية وربما أدخلواف
  التاءفقالوا أوناه عدولاية وقدأوه الرجل تأديهاوتاوه تاوّهااذاقال أوه والاسم
  الاحة بالمذ قال المنقب العبدة
  اذا ماقت أرحلها بليل • تاقهآهة الرجل الحزيس
  ويروى أهة من قولهم أم أى توجع قال العجاج• بأهة كأهة الجروح• ومنه قواهم في الدعاء
  على الانسان آهلك وأوة لك بحذف الهاء أيضامشددة الواو (ا ه ايه اسم سنخى
  به الفعل لانّ معناه الامر تقول للرجل اذا استزدته من جديث أو عمل ايه بكسر الهاء قال
  ابن السكيت فان وصات توّنت فقلت ايه حدّثنا قال وقول ذى الرمّة
  وقضنا فقلنا ايه من أمّ سالم • ومابال تكايم الديار البلاقع
