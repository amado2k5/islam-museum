label:
  ar: "البخاري 4769 — إبراهيم وأبوه يوم القيامة: إني حرمت الجنة على الكافرين"
  en: "Bukhari 4769 — Ibrahim and his father on the Day of Resurrection"
  ur: "بخاری 4769 — قیامت کے دن ابراہیم اور ان کے والد"
text: "يلقى إبراهيم أباه فيقول يا رب إنك وعدتني أن لا تخزني يوم يبعثون فيقول الله إني حرمت الجنة على الكافرين ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4769: إبراهيم وأبوه يوم القيامة: إني حرمت الجنة على الكافرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4769: Ibrahim and his father on the Day of Resurrection. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4769: قیامت کے دن ابراہیم اور ان کے والد۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
