label: { ar: "صحيح مسلم 5032 — الحلال", en: "Sahih Muslim 5032 — the lawful", ur: "صحیح مسلم 5032 — حلال", es: "Sahih Muslim 5032 — el lícito" }
text: "وَحَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُعَاذٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا شُعْبَةُ، عَنْ تَوْبَةَ الْعَنْبَرِيِّ، سَمِعَ الشَّعْبِيَّ، سَمِعَ ابْنَ عُمَرَ، أَنَّ النَّبِيَّ كَانَ مَعَهُ نَاسٌ مِنْ أَصْحَابِهِ فِيهِمْ سَعْدٌ وَأُتُوا بِلَحْمِ ضَبٍّ فَنَادَتِ امْرَأَةٌ مِنْ نِسَاءِ النَّبِيِّ إِنَّهُ لَحْمُ ضَبٍّ فَقَالَ رَسُولُ اللَّهِ \" كُلُوا فَإِنَّهُ حَلاَلٌ وَلَكِنَّهُ لَيْسَ مِنْ طَعَامِي \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5032، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 5032 (The Book of Hunting, Slaughter, and what may be Eaten), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 5032، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 5032 (El Libro de la Caza, la Matanza y los Alimentos), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
