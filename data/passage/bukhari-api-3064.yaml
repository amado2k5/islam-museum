text: "… وَبَنُو لِحْيَانَ، فَزَعَمُوا أَنَّهُمْ قَدْ أَسْلَمُوا، وَاسْتَمَدُّوهُ عَلَى قَوْمِهِمْ، فَأَمَدَّهُمُ النَّبِيُّ بِسَبْعِينَ مِنَ الأَنْصَارِ قَالَ أَنَسٌ كُنَّا نُسَمِّيهِمُ الْقُرَّاءَ، يَحْطِبُونَ بِالنَّهَارِ وَيُصَلُّونَ بِاللَّيْلِ، فَانْطَلَقُوا بِهِمْ حَتَّى بَلَغُوا بِئْرَ مَعُونَةَ غَدَرُوا بِهِمْ وَقَتَلُوهُمْ، فَقَنَتَ شَهْرًا يَدْعُو عَلَى رِعْلٍ وَذَكْوَانَ وَبَنِي لِحْيَانَ. قَالَ قَتَادَةُ وَحَدَّثَنَا أَنَسٌ أَنَّهُمْ قَرَءُوا بِهِمْ قُرْآنًا أَلاَ بَلِّغُوا عَنَّا قَوْمَنَا بِأَنَّا قَدْ لَقِينَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3064، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 3064 (Fighting for the Cause of Allah (Jihaad)), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 3064، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
