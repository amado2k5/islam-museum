label: { ar: "صحيح البخاري 6134 — عدد الحسنات، مضاعفة الحسنة بعشر أمثالها", en: "Sahih al-Bukhari 6134 — a stated number of good deeds; the good deed multiplied tenfold and beyond", ur: "صحیح بخاری 6134 — نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "… عَسَى أَنْ يَطُولَ بِكَ عُمُرٌ، وَإِنَّ مِنْ حَسْبِكَ أَنْ تَصُومَ مِنْ كُلِّ شَهْرٍ ثَلاَثَةَ أَيَّامٍ، فَإِنَّ بِكُلِّ حَسَنَةٍ عَشْرَ أَمْثَالِهَا فَذَلِكَ الدَّهْرُ كُلُّهُ \". قَالَ فَشَدَّدْتُ فَشُدِّدَ عَلَىَّ فَقُلْتُ فَإِنِّي أُطِيقُ غَيْرَ ذَلِكَ. قَالَ \" فَصُمْ مِنْ كُلِّ جُمُعَةٍ ثَلاَثَةَ أَيَّامٍ \". قَالَ فَشَدَّدْتُ فَشُدِّدَ عَلَىَّ قُلْتُ أُطِيقُ غَيْرَ ذَلِكَ. قَالَ \" فَصُمْ صَوْمَ نَبِيِّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6134، يذكر عدد الحسنات، ومضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 6134 (Good Manners and Form (Al-Adab)), that speaks of a stated number of good deeds, the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 6134، جس میں نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
