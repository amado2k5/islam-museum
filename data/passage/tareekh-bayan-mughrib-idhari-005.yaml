text: "ه، وهو مولاه، وعلى توغله بالمسلمين، وتغريره بهم. واتصل بهذا في كتاب الرازي أن الوليد بعث إلى موسى رسولا، فأخذ بعنان دابته، وأخرجه من الأ،دلس، ومعه طارق ومغيث. وخلف ابنه على الأندلس، وأبقى معه وزيرا حبيب بن أبي عبدة بن"
