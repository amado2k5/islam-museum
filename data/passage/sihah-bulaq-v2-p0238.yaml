  لا يتماسك أن يسيل من اليدللينه ومنه قول لبيد
  يجتاب أصلا فالصا مننبذا .• بتجوب أنقا يميل هيامها
  والمع هيم مثل قذال وقذل والهياص بالكسر الابل العطاش الواحد هيمان وناقة هيمى مثل
  عطشان وعطشى قال الاصمعىّ الهيمان العطشان ومن الداءمهيوم وقوم هيم أى عطاش
