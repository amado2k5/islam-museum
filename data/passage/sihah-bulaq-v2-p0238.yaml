  ويمت المريض فتهم للصلاة الاصمعى اليمام الحام الوحشى الواحدة يمامة وقال الكسائى
  مى التى تأاف البيوت واليامسة اسم جارية زرقا. كانت تبصر الراكب من عسيزة ثلاثة أيام:
