  وتهمته تقصدته وتهمت الصعيد اللصلاة وأصله التعمد والتوخى من قولهم تممتك وتأعتك
  فاز أبن السيكيت قوله تعالى فتيهموا صعيد اطيبا أى اقصدوالصعيد طيب ثم كثر استعمالهم
  هذه الكامة حتى صار التيم مسح الوجه واليدين بالتراب ويممة-هبرمحى تيميما أى توخيته
