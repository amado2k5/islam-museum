label: { ar: "جامع الترمذي 3132 — الأب والأبوة", en: "Jami' al-Tirmidhi 3132 — the father and fatherhood", ur: "جامع ترمذی 3132 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3132 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3132 — le père et la paternité" }
text: "حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ الدَّوْرَقِيُّ، حَدَّثَنَا أَبُو تُمَيْلَةَ، عَنِ الزُّبَيْرِ بْنِ جُنَادَةَ، عَنِ ابْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" لَمَّا انْتَهَيْنَا إِلَى بَيْتِ الْمَقْدِسِ قَالَ جِبْرِيلُ بِإِصْبَعِهِ فَخَرَقَ بِهِ الْحَجَرَ وَشَدَّ بِهِ الْبُرَاقَ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3132، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3132 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3132، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3132 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3132 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
