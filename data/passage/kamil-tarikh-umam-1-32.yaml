text: "كان أبو سفيان قد نذر بعد بدر، أنْ لا يمس رأسَه ماءُ من جنابة حتى يغزو محِمّداً، فخرِج في مائتي راكب من قريش ليبرّ يمينه، حتى جاء المدينة ليلا، واجتمع بسلام بن مِشْكَم سيّد النّضير، فعلم منه خبر الناس، ثمّ …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 32، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 32, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 32 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
