label: { ar: "سنن ابن ماجه 130 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan Ibn Majah 130 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن ابن ماجہ 130 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Ibn Majah 130 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sunan Ibn Majah 130 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan İbn Majah 130 — Baba ve babalık, anne babaya saygı göstermek veya göstermemek", id: "Sunan Ibn Majah 130 — Ayah dan peran ayah, menghormati atau durhaka kepada orang tua" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ رُمْحٍ، أَنْبَأَنَا اللَّيْثُ بْنُ سَعْدٍ، ح وَحَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا حَاتِمُ بْنُ إِسْمَاعِيلَ، وَإِسْمَاعِيلُ بْنُ عَيَّاشٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، قَالَ سَمِعْتُ سَعْدَ بْنَ أَبِي وَقَّاصٍ، يَقُولُ لَقَدْ جَمَعَ لِي رَسُولُ اللَّهِ ـ يَوْمَ أُحُدٍ أَبَوَيْهِ فَقَالَ \" ارْمِ سَعْدُ فِدَاكَ أَبِي وَأُمِّي \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 130، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 130 (The Book of the Sunnah), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 130، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 130 (El Libro de la Sunnah), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 130 (Le Livre de la Sunna), évoque le père et la paternité, ainsi que le devoir envers les parents et la possibilité de leur désobéissance. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "İbn Majah'ın Sünen'inde yer alan 130 numaralı hadis, baba ve babalık kavramını, anne babaya saygı göstermeyi veya göstermemeyi ele almaktadır. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 130, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
