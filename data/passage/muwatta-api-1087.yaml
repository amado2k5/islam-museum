text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنِ الثِّقَةِ، عِنْدَهُ أَنَّهُ سَمِعَ سَعِيدَ بْنَ الْمُسَيَّبِ، يَقُولُ أَبَى عُمَرُ بْنُ الْخَطَّابِ أَنْ يُوَرِّثَ، أَحَدًا مِنَ الأَعَاجِمِ إِلاَّ أَحَدًا وُلِدَ فِي الْعَرَبِ. قَالَ مَالِكٌ وَإِنْ جَاءَتِ امْرَأَةٌ حَامِلٌ مِنْ أَرْضِ الْعَدُوِّ فَوَضَعَتْهُ فِي أَرْضِ الْعَرَبِ فَهُوَ وَلَدُهَا يَرِثُهَا إِنْ مَاتَتْ وَتَرِثُهُ إِنْ مَاتَ مِيرَاثَهَا فِي كِتَابِ اللَّهِ. قَالَ مَالِكٌ الأَمْرُ الْمُجْتَمَعُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1087، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1087 (Fara'id), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "موطأ مالک کی حدیث نمبر 1087، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1087 (Fara'id), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
