text: |-
  ٤٧٨
  ⁦(باب السين)⁩
  وتنفات فلا ترجمع الى وملت الكبس أطله ملا اذا سلات خصيبه بعروقهما وبقال
  صبمملوس والملس أيضا السوق الشديد قال الراجز عهدى باظعان الكتوم تملس
  والملاسة يتشديذ اللام التى تسوّى بهاالارض موس) رجل ماس مثال مال أى خفيف
  طياش ومونى اسم رجل قال السكسائهوفعلى وقال أبو ع روين العلاءهومفعل -سكاه
  اليزيدى ويذكر فى باب المعتسل ⁦(ميس)⁩ الميس التبجتر وقد ماس عميس ميساوميسانافهو
  مياس وتميس مثله قال الشاعر
  وانى لمن قنعانها حين أعتزى • وامشى به نحو الوغى أتميس
  أوالميس شجر يتخذ.نه الرحال قال الراجز وشعبتاميس براها اسكاف وميسان اسم كورة
  بسواد العراق
  بالكسر ينجس نجسافهو نجس ونجس أيضا وقال اللّٰه تعالى انما المشركون نجس قال الفرّاء
  اذا قالوه مع الرجس اتبعوه اياه قالوارجس فجس بالكسر وأنجه غيره ونجسه بعنى ويقال
  به داءناجس ونجيس اذا كان لا يبرأمنه والتنحيس شئ كانت العرب تفعله كالعوذة
  تدفع بها العين ومنه قول الشاهر وعلق انجاسا على المنجس ⁦(غس)⁩ النحس ضدّ
  السعدورى قوله تعالى في يوم نحس على الصفة والاضافة أكثروأ جود وقد نحس الشئ
  بالكسر فهو غحس أيضا قال الشاءر
  ابلغ جذاما ونلهاان اخوتهم ، طيا وبهراة وم نصرهم نحس
  ومنه قيل أيام نحسات والنحاس معروف والنجاس أيضادخان لالهب فيه قال نابغة بنى جعدة
  يضئ كفو سراج السلبط * لم يجعل اللّٰه فيه نحاسا
  والنحاس بالكسر الطبيعة والاصل يقالفلان كريم النحاس والتهاس أيضا بالضم أى
  كريم التجار قال أبوز يديقال تنحت الاخباروعن الاخباراذ اتخبرت عنها وتتبعتها
  بالاستخبارويكون ذلك سرّاوعلانية وكذك استنحت الاخباروعن الاخبار (هس ١
  نفه بعود ينخه وينخه نخا ومنه هى النخاس والناخس فى البعيرجرب يكون عند
  ذنيه والبعير منفوس ودائرة النافس هى التى تكون تحت جاءرتى الفرس الى الفسائلين وتكره
  والنخيس السكرة يتسع ثقبها الذى يجرى فيه الهورممايأ كله المحور فيعمدون الى خشيبة
  فيثقبون وسطها يثم يلقمونها ذلك الثقب المتسع ويقال اتلك الحشيبة النخاس بكسر الفون
  والبكرة نخيس قال الراجز درنا ودارت بكرة غفيس وسألت اعرابيا بنجد من بى تميم
  وهو يستقى وبكرته فخيس فوضعت اصبحى على النخاس فقلت ماهذا وأردت أن أتعرّف منه
  الحاء واظلها فقال نخاس بخاءمعمة فقلت أليس قد قال الشاعر وبكرة غحاسها نحاس
  فقال ما سمعنابج ذافى آبائنا الاولين تقول منه نخست البكرة أنخسها نخسا والنخيسة ابن
  العسنزو النهجة يخلط بيتهما عن أب زيدحكاه عنه يعوب دس . رجل ندس وندس أى
  فهم وقد ندس بالمكسر يندص ندسا والمنداس المرأة الخفيفة والندس الطحن قال الشاعر
  d صما
