label: { ar: "نوادر جحا الكبرى، ص 131 — «إذا لم يمش الجبل يمشي المجذوب»", en: "Nawadir Juha al-Kubra, p. 131 — 'If the Mountain Does Not Walk, the Holy Man Walks'", ur: "نوادر جحا الکبریٰ، ص 131 — «اگر پہاڑ نہ چلے تو مجذوب چلتا ہے»", fr: "Nawadir Juha al-Kubra, p. 131 — « Si la montagne ne marche pas, c'est le saint qui marche »", es: "Nawadir Juha al-Kubra, p. 131 — «Si la montaña no camina, camina el santo»", tr: "Juha'nın Büyük Fıkraları, s. 131 — “Dağ yürümezse, deli yürüyecektir.”", id: "Anekdot Hebat Juha, hlm. 131 — “Jika gunung tidak berjalan, orang gila akan berjalan.”" }
text: "… إذا لم يمش الجبل يمشي المجذوب سألوه يوماً في أثناء المحادثة تمضية للوقت: من أين نعرف أنك وليٌّ؟ فقال لهم: إني أدعو الحجر فيأتيني، وأدعو الشجرة فتمشي إليَّ. نقالوا : ما دام الأمر كذلك فادعُ لنا هذه الشجرة الصفصاف التي …"
summary:
  ar: "سُئل جحا كيف يعرفون أنه ولي، فقال إنه ينادي الأحجار فتأتيه وتمشي إليه الأشجار، فطلبوا منه أن ينادي صفصافة فلم تتحرك، فقال إنه لا كبرياء بين الأولياء، وإذا لم يمش الجبل يمشي المجذوب. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  en: "Asked how they can know he is a saint, Juha says he calls stones and they come, and trees walk to him. They ask him to call a willow, and the willow does not move. He says there is no pride among saints, and if the mountain does not come, the holy man walks to it. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  ur: "جحا سے پوچھا جاتا ہے کہ انہیں کیسے معلوم ہو کہ وہ ولی ہے تو وہ کہتا ہے کہ وہ پتھروں کو بلاتا ہے تو وہ آ جاتے ہیں اور درخت چل کر اس کے پاس آتے ہیں۔ وہ اس سے کہتے ہیں کہ بید کے درخت کو بلائے، مگر وہ نہیں ہلتا۔ جحا کہتا ہے کہ اولیاء میں تکبر نہیں ہوتا، اور اگر پہاڑ نہ آئے تو مجذوب خود اس کی طرف چل پڑتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  fr: "Interrogé sur la façon dont on peut savoir qu'il est un saint, Juha dit qu'il appelle les pierres et qu'elles viennent, et que les arbres marchent vers lui. On lui demande d'appeler un saule, et le saule ne bouge pas. Il dit qu'il n'y a pas d'orgueil chez les saints et que, si la montagne ne vient pas, le saint homme marche vers elle. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  es: "Al preguntarle cómo pueden saber que es un santo, Juha dice que llama a las piedras y vienen, y que los árboles caminan hacia él. Le piden que llame a un sauce, y el sauce no se mueve. Él dice que no hay orgullo entre los santos, y que si la montaña no viene, el santo camina hacia ella. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  tr: "Juha'ya, nasıl aziz olduğunu bildikleri sorulduğunda, taşlara seslendiğinde taşların kendisine geldiğini, ağaçların da kendisine doğru yürüdüğünü söyledi. Ondan bir söğüt ağacına seslenmesini istediler, ancak ağaç kıpırdamadı. Bunun üzerine Juha, azizler arasında kibir olmadığını, dağ yürümezse mistik kişinin yürüyeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 131}"
  id: "Juha ditanya bagaimana mereka tahu bahwa dia adalah seorang santo, dan dia berkata bahwa dia memanggil batu dan batu-batu itu datang kepadanya, dan pohon-pohon berjalan ke arahnya. Mereka memintanya untuk memanggil pohon willow, tetapi pohon itu tidak bergerak. Dia berkata bahwa tidak ada kesombongan di antara para santo, dan jika gunung tidak bergerak, sang mistikus akan bergerak. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
