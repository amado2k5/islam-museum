text: "، وشفقة على الخلق، وخوفا من إثم الكتمان . وأما الذين أوتو الكتاب من اليهود والنصارى ومن ٣ ١٧١- تفسير سورة آل عمران، الآيات: ١٨٧-١٨٩ محارم الله، وتهاونا بحقوق الله، وحقوق الخلق، واشتروا بذلك الكتمان ثمنا قليلا، وهو ما يحصل"
