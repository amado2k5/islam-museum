text: "… بَيَانِ عَدَدِ شُعَبِ الإِيَمَانِ وَأفْضَلِهَا وَأذْنَاهَا، وَفَضِيلَةِ الْحَيَاءِ، وَكَوْنِهِ مِنَ الإِيَمَانِ - حَدْثَنَا عُبَيْدُ اللّه ابْنُ سَعِيدٍ، وَعَبْدُ ابْنُ حُمَيْدٍ، عَبْدِ اللّه ابْنِ دِينَارٍ، عَنْ أَبِي صَالِحٍ. عَنْ أبِي هُرَيْرَةً، عَن النبي قال: الإِيَمَانُ بِضْع وَسَبْعُونَ شُعْبَةً، وَالْحَيَاءُ شُعْبَةٌ مِنَ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 116، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 116, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 116 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 116, que menciona las ramas de la fe, entendida como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 1, p. 116) mentionnant les piliers de la foi, la foi étant définie comme une soixantaine de branches. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Bu metin, El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 116. sayfasından, yetmişi aşkın mezhep dalını anlatan bir alıntıdır. Metin, makine tarafından okunabilir taranmış baskıdan alınmış olup, kaynak yönergelerine göre yaklaşık kırk kelimeyle özetlenmiştir. İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 116, yang menyebutkan cabang-cabang iman, yang jumlahnya lebih dari tujuh puluh. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
