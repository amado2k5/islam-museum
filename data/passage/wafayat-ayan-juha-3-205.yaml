text: "… فى دولة بق العياس ولم يكن تدله من يعرف بهذا النعت لا في دولة بن فى تقسه هذا ماذكره لى أمية ولا فى غيرها من الدول وكان السفاح يأنس بهلانه كان ذا مفاكهة حسنة ومتعافى حديثه الشيخ ولى نمس الدين …"
summary:
