  en: "An excerpt from Wafayat al-A'yan wa-Anba' Abna' al-Zaman, scan volume 3, p. 205, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "وفایت الاعیان و انبا ابنا الزمان، اسکین جلد 3، ص 205 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
