  tr: "\"Vafayat al-A'yan wa Anba' Abna' al-Zaman\" (Dönemin Önemli Şahsiyetlerinin Biyografileri ve İnsanlarının Haberleri) Resimli Cilt 3, sayfa 205'ten, esprili bir anekdot veya mizahi bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
