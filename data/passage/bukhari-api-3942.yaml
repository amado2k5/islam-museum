text: "حَدَّثَنِي أَحْمَدُ ـ أَوْ مُحَمَّدُ ـ بْنُ عُبَيْدِ اللَّهِ الْغُدَانِيُّ حَدَّثَنَا حَمَّادُ بْنُ أُسَامَةَ، أَخْبَرَنَا أَبُو عُمَيْسٍ، عَنْ قَيْسِ بْنِ مُسْلِمٍ، عَنْ طَارِقِ بْنِ شِهَابٍ، عَنْ أَبِي مُوسَى ـ قَالَ دَخَلَ النَّبِيُّ الْمَدِينَةَ وَإِذَا أُنَاسٌ مِنَ الْيَهُودِ يُعَظِّمُونَ عَاشُورَاءَ وَيَصُومُونَهُ فَقَالَ النَّبِيُّ \" نَحْنُ أَحَقُّ بِصَوْمِهِ \". فَأَمَرَ بِصَوْمِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3942، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3942 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3942، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 3942 (Méritos de los Ayudantes en Medina (Ansar)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
