label: { ar: "الموطأ 653 — أبو سعيد من طريق ابن أبي صعصعة: ليس فيما دون خمسة أوسق من التمر صدقة…", en: "Muwatta 653" }
text: "ليس فيما دون خمسة أوسق من التمر صدقة، وليس فيما دون خمس أواق من الورق صدقة، وليس فيما دون خمس ذود من الإبل صدقة"
summary:
  ar: "يرويه مالك عن محمد بن عبد الله بن عبد الرحمن بن أبي صعصعة الأنصاري المازني عن أبيه عن أبي سعيد الخدري، أن النبي قال: لا صدقة فيما دون خمسة أوسق من التمر، ولا فيما دون خمس أواق من الورق، ولا فيما دون خمس ذود من الإبل. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وسويد، والقعنبي، وابن وهب عند ابن خزيمة، والتنيسي عند البخاري (1459)، وابن القاسم ومن طريقه النسائي، وعبد الرزاق، والشافعي، والشيباني، ويحيى بن سعيد القطان عند البخاري (1484)، وأن ابن عبد البر زعم أن مالكاً أخطأ في هذا الإسناد وأن محمداً وأباه وأخاه ليسوا بالمشاهير وأن البخاري لم يخرجه للاختلاف فيه، فيرد عليه المحقق بأن رواية محمد عن أبيه وعن يحيى بن عمارة وعن عباد بن تميم ليست اضطراباً وأن الطرق محفوظة كما قرره الذهلي وابن حجر، وأنهم ثقات معروفون، وأن البخاري أخرجه في موضعين، وأن مسلماً (3/67) أخرجه من حديث جابر خلافاً لقول ابن عبد البر إن أبا سعيد انفرد به. {cite:muwatta-maruf-1997 p.333} {cite:muwatta-maruf-1997 p.334} {cite:muwatta-maruf-1997 p.335}"
