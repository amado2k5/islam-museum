label: { ar: "الموطأ 653 — أبو سعيد من طريق ابن أبي صعصعة: ليس فيما دون خمسة أوسق من التمر صدقة…", en: "Muwatta 653", es: "Muwatta 653", fr: "Muwatta 653", ur: "موطا 653", tr: "El-Muvatta 653 — Ebu Said, İbn Abi Sa'sa'ah'tan rivayetle: Beş vasktan az hurma için zekât gerekmez…", id: "Al-Muwatta 653 — Abu Saeed, berdasarkan riwayat Ibnu Abi Sa’sa’ah: Tidak ada zakat yang wajib dibayarkan untuk kurma yang kurang dari lima wasq…" }
text: "ليس فيما دون خمسة أوسق من التمر صدقة، وليس فيما دون خمس أواق من الورق صدقة، وليس فيما دون خمس ذود من الإبل صدقة"
summary:
  ar: "يرويه مالك عن محمد بن عبد الله بن عبد الرحمن بن أبي صعصعة الأنصاري المازني عن أبيه عن أبي سعيد الخدري، أن النبي قال: لا صدقة فيما دون خمسة أوسق من التمر، ولا فيما دون خمس أواق من الورق، ولا فيما دون خمس ذود من الإبل. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وسويد، والقعنبي، وابن وهب عند ابن خزيمة، والتنيسي عند البخاري (1459)، وابن القاسم ومن طريقه النسائي، وعبد الرزاق، والشافعي، والشيباني، ويحيى بن سعيد القطان عند البخاري (1484)، وأن ابن عبد البر زعم أن مالكاً أخطأ في هذا الإسناد وأن محمداً وأباه وأخاه ليسوا بالمشاهير وأن البخاري لم يخرجه للاختلاف فيه، فيرد عليه المحقق بأن رواية محمد عن أبيه وعن يحيى بن عمارة وعن عباد بن تميم ليست اضطراباً وأن الطرق محفوظة كما قرره الذهلي وابن حجر، وأنهم ثقات معروفون، وأن البخاري أخرجه في موضعين، وأن مسلماً (3/67) أخرجه من حديث جابر خلافاً لقول ابن عبد البر إن أبا سعيد انفرد به. {cite:muwatta-maruf-1997 p.333} {cite:muwatta-maruf-1997 p.334} {cite:muwatta-maruf-1997 p.335}"
  tr: "Malik, Muhammed bin Abdullah bin Abdul Rahman bin Abi Sa'sa'a el-Ensari el-Mazini'den, o da babasından, o da Ebu Said el-Hudri'den rivayet ettiğine göre, Peygamber şöyle buyurmuştur: \"Beş vaskadan azı, beş ukiyeden azı gümüşten azı ve beş deve sürüsünden azı sadaka olarak verilmez.\" Araştırmacı, bu hadisin Malik'ten Ebu Musab aracılığıyla, onun vasıtasıyla da İbn Huzeyme'ye göre Bağvavi, Süveyd, Kanabi ve İbn Vahb tarafından; Buhari'ye (1459) göre Tünisi tarafından; ve Buhari'ye (1484) göre İbn Kâsım'dan ve onun vasıtasıyla da Nesai, Abdülrazzak, Şafiî, Şeybani ve Yahya İbn Said el-Kattan tarafından rivayet edildiğini belirtiyor. İbn Abdülberr'in ise Malik'in bu rivayet zincirinde hata yaptığını, Muhammed'in, babasının ve kardeşinin meşhur olmadığını ve Buhari'nin bu hadis hakkında görüş ayrılığı olduğu için onu rivayet zincirine dahil etmediğini iddia ettiğini söylüyor. Soruşturmacı ona, Muhammed'in babasından, Yahya İbn Ammarah'tan ve Abbad İbn Tamim'den rivayetinin bir çelişki oluşturmadığını, isnad zincirlerinin El-Dhahabi ve İbn Hajar'ın tespit ettiği gibi korunduğunu, bunların tanınmış ve güvenilir kişiler olduğunu, El-Buhari'nin bunu iki yerde naklettiğini ve Müslim'in (3/67) bunu Cabir'in hadisinden naklettiğini, İbn Abdül-Barr'ın söylediğinin aksine, Ebu Sa'id'in bunu sadece kendisinin rivayet ettiğini söyleyerek cevap verir. {cite:muwatta-maruf-1997 s.333} {cite:muwatta-maruf-1997 s.334} {cite:muwatta-maruf-1997 s.335}"
  id: "Diriwayatkan oleh Malik dari Muhammad bin Abdullah bin Abdul Rahman bin Abi Sa’sa’a Al-Ansari Al-Mazini dari ayahnya dari Abu Saeed Al-Khudri, bahwa Nabi bersabda: Tidak ada zakat yang wajib diberikan kurang dari lima wasq kurma, tidak kurang dari lima uqiyah perak, dan tidak kurang dari lima kawanan unta. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, dan melalui dia oleh Al-Baghawi, Suwaid, Al-Qa’nabi, dan Ibn Wahb menurut Ibn Khuzaymah, dan Al-Tunisi menurut Al-Bukhari (1459), dan Ibn Al-Qasim dan melalui dia oleh Al-Nasa’i, Abd Al-Razzaq, Al-Shafi’i, Al-Shaybani, dan Yahya Ibn Sa’id Al-Qattan menurut Al-Bukhari (1484), dan bahwa Ibn Abd Al-Barr mengklaim bahwa Malik melakukan kesalahan dalam rantai periwayatan ini, dan bahwa Muhammad, ayahnya, dan saudaranya tidak terkenal, dan bahwa Al-Bukhari tidak memasukkannya karena adanya perbedaan pendapat tentang hal itu. Penyelidik menjawabnya dengan mengatakan bahwa riwayat Muhammad dari ayahnya, dan dari Yahya Ibn ‘Ammarah, dan dari ‘Abbad Ibn Tamim bukanlah suatu kontradiksi, dan sanadnya terpelihara sebagaimana yang telah ditetapkan oleh Al-Dhahabi dan Ibn Hajar, dan bahwa mereka adalah orang-orang yang terkenal dan terpercaya, dan bahwa Al-Bukhari memasukkannya di dua tempat, dan bahwa Muslim (3/67) memasukkannya dari hadits Jabir, bertentangan dengan apa yang dikatakan Ibn Abd Al-Barr, bahwa Abu Sa’id adalah satu-satunya yang meriwayatkannya. {cite:muwatta-maruf-1997 p.333} {cite:muwatta-maruf-1997 p.334} {cite:muwatta-maruf-1997 p.335}"
