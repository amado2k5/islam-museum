summary:
  ar: "القسم 22 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوصايا»، ويضم فيها النصوص من 2695 إلى 2718 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 22 of Sunan Ibn Majah (The Chapters on Wills) in the division of the open hadith dataset the museum took its reports from: reports 2695 to 2718 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 22، عنوان «کتاب الوصایا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2695 تا 2718۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 22 de Sunan Ibn Majah (Los capítulos sobre testamentos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2695 al 2718, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 22 du Sunan Ibn Majah (Les chapitres sur les testaments), qui correspond aux hadiths 2695 à 2718 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
