label: { ar: "صحيح البخاري 3774 — الأب والأبوة", en: "Sahih al-Bukhari 3774 — the father and fatherhood", ur: "صحیح بخاری 3774 — باپ اور والدیت" }
text: "حَدَّثَنِي عُبَيْدُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ لَمَّا كَانَ فِي مَرَضِهِ، جَعَلَ يَدُورُ فِي نِسَائِهِ وَيَقُولُ \" أَيْنَ أَنَا غَدًا أَيْنَ أَنَا غَدًا \". حِرْصًا عَلَى بَيْتِ عَائِشَةَ، قَالَتْ عَائِشَةُ فَلَمَّا كَانَ يَوْمِي سَكَنَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3774، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3774 (Companions of the Prophet), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3774، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
