label: { ar: "صحيح البخاري 3774 — الأب والأبوة", en: "Sahih al-Bukhari 3774 — the father and fatherhood", ur: "صحیح بخاری 3774 — باپ اور والدیت", es: "Sahih al-Bukhari 3774 — El padre y la paternidad", fr: "Sahih al-Bukhari 3774 — le père et la paternité", tr: "Sahih el-Buhari 3774 — Baba ve Babalık", id: "Sahih al-Bukhari 3774 — Ayah dan Peran Ayah" }
text: "حَدَّثَنِي عُبَيْدُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ لَمَّا كَانَ فِي مَرَضِهِ، جَعَلَ يَدُورُ فِي نِسَائِهِ وَيَقُولُ \" أَيْنَ أَنَا غَدًا أَيْنَ أَنَا غَدًا \". حِرْصًا عَلَى بَيْتِ عَائِشَةَ، قَالَتْ عَائِشَةُ فَلَمَّا كَانَ يَوْمِي سَكَنَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3774، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3774 (Companions of the Prophet), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3774، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3774 (Compañeros del Profeta), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3774 (Compagnons du Prophète), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3774 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3774, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
