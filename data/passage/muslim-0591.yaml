label: { ar: "مسلم 591 — الاستغفار ثلاثاً بعد الصلاة ثم اللهم أنت السلام", en: "Muslim 591 — Thrice-istighfar after prayer then 'You are Peace'", es: "Muslim 591 — Tres veces istighfar después de la oración y luego 'Tú eres la paz'", fr: "Muslim 591 — Trois fois istighfar après la prière puis « Tu es la paix »", ur: "مسلم 591 - نماز کے بعد تین استغفار پھر تم سلامتی ہو۔", tr: "Müslim 591 — Namazdan sonra üç defa bağışlanma dilemek, sonra da \"Ey Allah'ım, Sen barışsın\" demek.", id: "Muslim 591 — Memohon ampunan tiga kali setelah shalat, kemudian mengucapkan, \"Ya Allah, Engkau adalah Kedamaian.\"" }
text: "قال ثوبان: كان رسول الله إذا انصرف من صلاته استغفر ثلاثاً وقال: اللهم أنت السلام ومنك السلام تباركت ذا الجلال والإكرام"
summary:
  ar: "رواية ثوبان في باب ما يقال إذا انصرف من الصلاة من كتاب المساجد في صحيح مسلم؛ الاستغفار ثلاثاً بعد الصلاة ثم «اللهم أنت السلام» — أصل ذكرٍ يقال إلى اليوم بعد كل صلاة."
  tr: "Sahih Müslim'deki Mescitler Kitabı'nda namazdan sonra söylenecek sözler bölümünde Sevban'ın rivayetine göre: \"Namazdan sonra üç defa bağışlanma dilemek, sonra da 'Ey Allah'ım, Sen barışsın' demek; bu, günümüzde her namazdan sonra söylenen bir zikrin kökenidir.\""
  id: "Riwayat Thawban dalam bab tentang apa yang diucapkan setelah shalat dalam Kitab Masjid-Masjid di Sahih Muslim: “Memohon ampunan tiga kali setelah shalat, kemudian mengucapkan, ‘Ya Allah, Engkau Maha Penyelamat’ — inilah asal mula zikir yang diucapkan hingga hari ini setelah setiap shalat.”"
