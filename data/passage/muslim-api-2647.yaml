text: "وَحَدَّثَنَا أَحْمَدُ بْنُ عُثْمَانَ النَّوْفَلِيُّ، حَدَّثَنَا أَبُو عَاصِمٍ، حَدَّثَنَا عُمَرُ بْنُ مُحَمَّدِ بْنِ، زَيْدٍ الْعَسْقَلاَنِيُّ حَدَّثَنَا سَالِمُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ عُمَرَ، -ما - قَالَ ذُكِرَ عِنْدَ رَسُولِ اللَّهِ يَوْمُ عَاشُورَاءَ فَقَالَ \" ذَاكَ يَوْمٌ كَانَ يَصُومُهُ أَهْلُ الْجَاهِلِيَّةِ فَمَنْ شَاءَ صَامَهُ وَمَنْ شَاءَ تَرَكَهُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2647، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2647 (The Book of Fasting), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 2647، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
