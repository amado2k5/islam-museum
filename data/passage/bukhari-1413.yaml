ref: "1413"
label:
  ar: "البخاري 1413 — ليقفن أحدكم بين يدي الله ليس بينه وبينه ترجمان"
  en: "Bukhari 1413 — Each of you will stand before God with no interpreter between them"
  ur: "بخاری 1413 — تم میں سے ہر ایک اللہ کے سامنے کھڑا ہوگا، درمیان میں کوئی ترجمان نہ ہوگا"
  es: "Bujari 1413 — Cada uno de vosotros estará delante de Dios sin intérprete entre ellos."
  fr: "Bukhari 1413 — Chacun de vous se présentera devant Dieu sans interprète entre eux."
  tr: "Buhari 1413 — Sizden biriniz Allah'ın huzurunda, O'na hiçbir tercüman olmaksızın dursun."
  id: "Al-Bukhari 1413 — Janganlah salah seorang di antara kalian berdiri di hadapan Allah tanpa perantara antara dia dan Allah."
text: "أما قطع السبيل فإنه لا يأتي عليك إلا قليل حتى تخرج العير إلى مكة بغير خفير، وأما العيلة فإن الساعة لا تقوم حتى يطوف أحدكم بصدقته لا يجد من يقبلها منه، ثم ليقفن أحدكم بين يدى الله ليس بينه وبينه …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 1413: ليقفن أحدكم بين يدي الله ليس بينه وبينه ترجمان. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 1413: Each of you will stand before God with no interpreter between them. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 1413: تم میں سے ہر ایک اللہ کے سامنے کھڑا ہوگا، درمیان میں کوئی ترجمان نہ ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 1413: Cada uno de vosotros estará ante Dios sin intérprete entre ellos. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 1413: Chacun de vous se tiendra devant Dieu sans interprète. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 1413: “Hendaklah setiap orang di antara kalian berdiri di hadapan Allah, tanpa perantara antara Dia dan kalian.” Nabi (shalawat dan salam kepadanya) meriwayatkan hadits ini dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta."
