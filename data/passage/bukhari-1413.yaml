label:
  ar: "البخاري 1413 — ليقفن أحدكم بين يدي الله ليس بينه وبينه ترجمان"
  en: "Bukhari 1413 — Each of you will stand before God with no interpreter between them"
  ur: "بخاری 1413 — تم میں سے ہر ایک اللہ کے سامنے کھڑا ہوگا، درمیان میں کوئی ترجمان نہ ہوگا"
text: "أما قطع السبيل فإنه لا يأتي عليك إلا قليل حتى تخرج العير إلى مكة بغير خفير، وأما العيلة فإن الساعة لا تقوم حتى يطوف أحدكم بصدقته لا يجد من يقبلها منه، ثم ليقفن أحدكم بين يدى الله ليس بينه وبينه …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 1413: ليقفن أحدكم بين يدي الله ليس بينه وبينه ترجمان. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 1413: Each of you will stand before God with no interpreter between them. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 1413: تم میں سے ہر ایک اللہ کے سامنے کھڑا ہوگا، درمیان میں کوئی ترجمان نہ ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
