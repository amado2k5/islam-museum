text: "فكتب كتابا، وعهدا، وأمره فيه أمره: بسم الله الرحمن الرحيم. هذا كتاب من الله، ورسوله. يا أيها الذين آمنوا أوفوا بالعقود. عهدا من رسول الله لعمرو بن حزم حيث بعثه إلى اليمن. أمره بتقوى الله في أمره كله. فإن الله"
