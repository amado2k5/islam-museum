text: "… أَوِ الْحِنْطَةَ الْمَحْمُولَةَ خَمْسَةَ عَشَرَ صَاعًا أَوِ الشَّامِيَّةَ عَشَرَةَ أَصْوُعٍ بِدِينَارٍ قَدْ وَجَبَتْ لِي إِحْدَاهُمَا إِنَّ ذَلِكَ مَكْرُوهٌ لاَ يَحِلُّ وَذَلِكَ أَنَّهُ قَدْ أَوْجَبَ لَهُ عَشَرَةَ أَصْوُعٍ صَيْحَانِيًّا فَهُوَ يَدَعُهَا وَيَأْخُذُ خَمْسَةَ عَشَرَ صَاعًا مِنَ الْعَجْوَةِ أَوْ تَجِبُ عَلَيْهِ خَمْسَةَ عَشَرَ صَاعًا مِنَ الْحِنْطَةِ الْمَحْمُولَةِ فَيَدَعُهَا وَيَأْخُذُ عَشَرَةَ أَصْوُعٍ مِنَ الشَّامِيَّةِ فَهَذَا أَيْضًا مَكْرُوهٌ لاَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1361، يذكر ما لا يحل، والمكروه. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1361 (Business Transactions), that mentions what is not lawful, the disliked. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1361، جس میں جو حلال نہیں، مکروہ کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
