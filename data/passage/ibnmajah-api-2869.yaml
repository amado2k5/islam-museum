label: { ar: "سنن ابن ماجه 2869 — أثر من الآثار المحفوظة", en: "Sunan Ibn Majah 2869 — a relic kept after its owner", ur: "سنن ابن ماجہ 2869 — محفوظ آثار و تبرکات", es: "Sunan Ibn Majah 2869 — una reliquia conservada después de su dueño.", fr: "Sunan Ibn Majah 2869 — une relique conservée après son propriétaire", tr: "Sunan İbn Majah 2869 — Korunmuş bir gelenek", id: "Sunan Ibnu Majah 2869 — Tradisi yang dilestarikan" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ رُمْحٍ، أَنْبَأَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ أَبِي الزُّبَيْرِ، عَنْ جَابِرٍ، قَالَ جَاءَ عَبْدٌ فَبَايَعَ النَّبِيَّ عَلَى الْهِجْرَةِ وَلَمْ يَشْعُرِ النَّبِيُّ أَنَّهُ عَبْدٌ فَجَاءَ سَيِّدُهُ يُرِيدُهُ فَقَالَ النَّبِيُّ \" بِعْنِيهِ \". فَاشْتَرَاهُ بِعَبْدَيْنِ أَسْوَدَيْنِ ثُمَّ لَمْ يُبَايِعْ أَحَدًا بَعْدَ ذَلِكَ حَتَّى يَسْأَلَهُ أَعَبْدٌ هُوَ"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2869، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2869 (The Chapters on Jihad), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2869، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2869 (Los capítulos sobre la yihad), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 2869 (Les chapitres sur le Jihad), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "İbn Majah'ın Sünen'inde yer alan 2869 numaralı hadiste, günümüze kadar korunmuş bir rivayetten bahsedilmektedir. Bu hadis, vasiyetnameler, miras, gelenekler ve türbeler üzerine çalışan araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2869, menyebutkan sebuah tradisi yang lestari. Hadits ini dikumpulkan oleh para peneliti wasiat, warisan, tradisi, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
