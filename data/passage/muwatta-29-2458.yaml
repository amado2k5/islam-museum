label: { ar: "الموطأ 2458 — عمرو بن حزم: كتاب النبي في العقول وديات الأعضاء", en: "Muwatta 2458" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه أن في الكتاب الذي كتبه رسول الله لعمرو بن حزم في العقول: أن في النفس مائة من الإبل، وفي الأنف إذا أُوعي جدعا مائة من الإبل، وفي المأمومة ثلث الدية، وفي الجائفة مثلها، وفي العين خمسون، وفي اليد خمسون، وفي الرجل خمسون، وفي كل أصبع عشر من الإبل، وفي السن خمس، وفي الموضحة خمس. ويذكر المحقق قول ابن عبد البر أنه لا خلاف عن مالك في إرساله، وأنه كتاب مشهور عند أهل السير، وأنه روي مسندا من وجه صالح. {cite:muwatta-maruf-1997 p.417}"
