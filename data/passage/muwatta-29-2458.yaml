label: { ar: "الموطأ 2458 — عمرو بن حزم: كتاب النبي في العقول وديات الأعضاء", en: "Muwatta 2458", es: "Muwatta 2458", fr: "Muwatta 2458", ur: "موطا 2458", tr: "El-Muvatta 2458 — Amr ibn Hazm: Peygamberin Akıl ve Bedenler İçin Kan Parası Hakkındaki Kitabı", id: "Al-Muwatta 2458 — Amr ibn Hazm: Kitab Nabi tentang Akal dan Uang Darah untuk Mayat" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه أن في الكتاب الذي كتبه رسول الله لعمرو بن حزم في العقول: أن في النفس مائة من الإبل، وفي الأنف إذا أُوعي جدعا مائة من الإبل، وفي المأمومة ثلث الدية، وفي الجائفة مثلها، وفي العين خمسون، وفي اليد خمسون، وفي الرجل خمسون، وفي كل أصبع عشر من الإبل، وفي السن خمس، وفي الموضحة خمس. ويذكر المحقق قول ابن عبد البر أنه لا خلاف عن مالك في إرساله، وأنه كتاب مشهور عند أهل السير، وأنه روي مسندا من وجه صالح. {cite:muwatta-maruf-1997 p.417}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan, onun babasından rivayetle, Allah Resulü'nün Amr ibn Hazm'a kan parası hakkında yazdığı mektupta şöyle buyurulduğunu nakde çevirmiştir: Bir can için yüz deve; kopmuş bir burun için yüz deve; kafa yarası için kan parasının üçte biri; delici yara için aynı miktarda; göz için elli; el için elli; ayak için elli; her parmak için on deve; diş için beş deve; ve kemiği açığa çıkaran yara için beş deve. Araştırmacı, İbn Abd al-Barr'ın, rivayetin Malik'in nakilinde ihtilaf bulunmadığı, tarihçiler arasında bilinen bir kitap olduğu ve güvenilir bir kaynaktan isnad zinciriyle nakledildiği yönündeki ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.417}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, yang juga meriwayatkan dari ayahnya, bahwa dalam surat yang ditulis Rasulullah kepada Amr ibn Hazm mengenai uang darah, disebutkan: Untuk nyawa, seratus unta harus dibayarkan; untuk hidung yang terputus, seratus unta harus dibayarkan; untuk luka di kepala, sepertiga dari uang darah harus dibayarkan; untuk luka tembus, jumlah yang sama; untuk mata, lima puluh; untuk tangan, lima puluh; untuk kaki, lima puluh; untuk setiap jari, sepuluh unta; untuk gigi, lima; dan untuk luka yang memperlihatkan tulang, lima. Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa tidak ada perbedaan pendapat mengenai riwayat Malik, bahwa kitab ini terkenal di kalangan sejarawan, dan diriwayatkan dengan sanad yang terpercaya. {cite:muwatta-maruf-1997 p.417}"
