text: "… فعلك فى مثلك، فتوق ياملعون العيب فإن اللّه أعلم بالغيب، الميت، واليتيم جبره اللّه، والمال ثمره اللّه، والساعى لعنه اللّٰه. وقال لقمان لابنه : ياينى أوصيك بخلال إن تمسكت بهن لم تزل حديث • لا يدخل الجنة حديث لن من …"
summary:
