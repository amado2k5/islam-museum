label: { ar: "الموطأ 2301 — مالك: الكتابة الجماعية والحمالة بين المكاتبين", en: "Muwatta 2301", es: "Muwatta 2301", fr: "Muwatta 2301", ur: "موطا 2301", tr: "Al-Muwatta 2301 — Malik: Toplu yazım ve katipler arasındaki yük", id: "Al-Muwatta 2301 — Malik: Penulisan kolektif dan beban antara para juru tulis" }
summary:
  ar: "قال مالك: إذا كوتب القوم جميعا كتابة واحدة، ولا رحم بينهم يتوارثون بها، فإن بعضهم حملاء عن بعض، ولا يعتق بعضهم دون بعض حتى يؤدوا الكتابة كلها. فإن مات أحدهم وترك مالا أكثر من جميع ما عليهم، أدي عنهم جميعه، وكان فضل المال لسيده، ويتبعهم السيد بحصصهم الباقية من الكتابة التي قضيت من مال الهالك. وإن كان للمكاتب الهالك ولد حر لم يولد في الكتابة ولم يكاتب عليه، لم يرثه؛ لأن المكاتب لم يعتق حتى مات. {cite:muwatta-maruf-1997 p.348} {cite:muwatta-maruf-1997 p.349}"
  tr: "Malik şöyle dedi: Eğer bir grup insan tek bir kölelikten kurtulma sözleşmesiyle bağlıysa ve aralarında miras yoluyla geçebilecekleri bir akrabalık bağı yoksa, o zaman içlerinden bazıları diğerlerinden sorumludur ve bazıları, sözleşmenin tamamını ödeyene kadar diğerlerinden önce özgür bırakılmaz. Eğer içlerinden biri ölür ve geride borçlarından fazla bir servet bırakırsa, bunun tamamı onun adına ödenir ve fazlası efendisine aittir. Efendi daha sonra, ölenin mirasından ödenen sözleşmenin kalan payları için onlardan dava açar. Eğer ölen sözleşmeli kölenin sözleşme sırasında doğmamış ve sözleşmeyle bağlı olmayan özgür bir çocuğu varsa, çocuk ondan miras alamaz, çünkü sözleşmeli köle ölümünden sonra özgür bırakılmıştır. {cite:muwatta-maruf-1997 s.348} {cite:muwatta-maruf-1997 s.349}"
  id: "Malik berkata: Jika sekelompok orang terikat oleh satu kontrak pembebasan, dan tidak ada hubungan kekerabatan di antara mereka yang memungkinkan mereka untuk mewarisi, maka sebagian dari mereka bertanggung jawab atas yang lain, dan sebagian tidak dibebaskan sebelum yang lain sampai mereka semua telah membayar seluruh kontrak. Jika salah satu dari mereka meninggal dan meninggalkan kekayaan yang melebihi semua yang mereka hutangkan, maka semuanya dibayarkan atas nama mereka, dan kelebihannya menjadi milik tuannya. Tuan kemudian menuntut mereka untuk sisa bagian kontrak yang dibayarkan dari harta warisan almarhum. Jika budak yang terikat kontrak yang telah meninggal memiliki anak yang merdeka yang tidak lahir selama kontrak dan tidak terikat olehnya, maka anak tersebut tidak mewarisi darinya, karena budak yang terikat kontrak tidak dibebaskan sampai setelah kematiannya. {cite:muwatta-maruf-1997 p.348} {cite:muwatta-maruf-1997 p.349}"
