summary:
  ar: "قال مالك: إذا كوتب القوم جميعا كتابة واحدة، ولا رحم بينهم يتوارثون بها، فإن بعضهم حملاء عن بعض، ولا يعتق بعضهم دون بعض حتى يؤدوا الكتابة كلها. فإن مات أحدهم وترك مالا أكثر من جميع ما عليهم، أدي عنهم جميعه، وكان فضل المال لسيده، ويتبعهم السيد بحصصهم الباقية من الكتابة التي قضيت من مال الهالك. وإن كان للمكاتب الهالك ولد حر لم يولد في الكتابة ولم يكاتب عليه، لم يرثه؛ لأن المكاتب لم يعتق حتى مات. {cite:muwatta-maruf-1997 p.348} {cite:muwatta-maruf-1997 p.349}"
