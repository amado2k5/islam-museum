label: { ar: "الموطأ 188 — ابن عمر يسمع الإقامة بالبقيع فيسرع المشي", en: "Muwatta 188", es: "Muwatta 188", fr: "Muwatta 188", ur: "موطا 188", tr: "El-Muvatta 188 — İbn Ömer, El-Baki'de ezanı duyup adımlarını hızlandırır.", id: "Al-Muwatta 188 — Ibnu Umar mendengar seruan azan di Al-Baqi’ dan mempercepat langkahnya" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما جاء في النداء للصلاة: سمع عبد الله بن عمر الإقامة وهو بالبقيع فأسرع المشي إلى المسجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ووكيع عند ابن أبي شيبة. {cite:muwatta-maruf-1997 p.120}"
  tr: "Malik'in Nafi'den rivayet ettiği, ezan bölümündeki bir rivayete göre: Abdullah ibn Umar, el-Baki'de iken ezanı işitti ve camiye doğru aceleyle yürüdü. Editör, bu rivayetin İbn Abi Şeybe'nin derlemesinde Ebu Mus'ab, Suveyd, Abdül-Razzak ve Vaki' tarafından Malik'ten rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.120}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang seruan azan: Abdullah ibn Umar mendengar iqamah ketika dia berada di al-Baqi’ dan mempercepat langkahnya ke masjid. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, dan Waki’ dalam kumpulan Ibn Abi Shaybah. {cite:muwatta-maruf-1997 p.120}"
