label: { ar: "نوادر جحا الكبرى، ص 158 — «لم يصبه أذى خارجي وإنما أصابه أذى داخلي»", en: "Nawadir Juha al-Kubra, p. 158 — 'No External Harm Struck Him, Only Inner Harm'", ur: "نوادر جحا الکبریٰ، ص 158 — «اسے کوئی بیرونی نقصان نہیں پہنچا، بلکہ اندرونی نقصان پہنچا»", fr: "Nawadir Juha al-Kubra, p. 158 — « Aucun mal extérieur ne l'a touché, seulement un mal intérieur »", es: "Nawadir Juha al-Kubra, p. 158 — «No le alcanzó ningún daño externo, sino un daño interior»" }
text: "… لم يصبه أذَّى خارجيٌّ وإنَّما أصابه أذّى داخليٌّ طلب تيمور لنك أحد أبطال الأتراك العثمانيين، ليستخدِمه بمعيتِه في منصبٍ كبير، وكان من الصعب أن يرضى أحدّ بِالقربِ منه، لأنه يكون في كل وقت تحت القضاء، عُرضةً للسخطِ بعد الرضاء، لذلك …"
summary:
  ar: "طلب تيمور لنك بطلاً من العثمانيين ليدخل في بلاطه، وتبدأ القصة هنا وتستمر حتى الصفحة 159. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  en: "Timur asks for a champion from the Ottomans to join his household; the story begins here and continues to page 159. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  ur: "تیمور لنگ نے عثمانیوں سے ایک پہلوان مانگا تاکہ وہ اس کے دربار میں شامل ہو، اور کہانی یہاں سے شروع ہو کر صفحہ 159 تک چلتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  fr: "Timur demande aux Ottomans un champion pour entrer dans sa maison ; le récit commence ici et se poursuit jusqu'à la page 159. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  es: "Timur pide a los otomanos un campeón para que se una a su corte; el relato comienza aquí y continúa hasta la página 159. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
