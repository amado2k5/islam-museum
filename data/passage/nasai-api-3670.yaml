label: { ar: "سنن النسائي 3670 — ما أُحل", en: "Sunan al-Nasa'i 3670 — what was made lawful", ur: "سنن نسائی 3670 — جو حلال کیا گیا" }
text: "… بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، قَالَ حَدَّثَنَا عَطَاءُ بْنُ السَّائِبِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، فِي قَوْلِهِ {إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَى ظُلْمًا} قَالَ كَانَ يَكُونُ فِي حِجْرِ الرَّجُلِ الْيَتِيمَ فَيَعْزِلُ لَهُ طَعَامَهُ وَشَرَابَهُ وَآنِيَتَهُ فَشَقَّ ذَلِكَ عَلَى الْمُسْلِمِينَ فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ {وَإِنْ تُخَالِطُوهُمْ فَإِخْوَانُكُمْ} {فِي الدِّينِ} فَأَحَلَّ لَهُمْ خُلْطَتَهُمْ."
summary:
  ar: "حديث في سنن النسائي، رقم 3670، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3670 (The Book of Wills), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3670، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
