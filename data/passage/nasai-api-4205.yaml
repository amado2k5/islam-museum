text: "… رَجُلاً فَأَوْقَدَ نَارًا فَقَالَ ادْخُلُوهَا. فَأَرَادَ نَاسٌ أَنْ يَدْخُلُوهَا وَقَالَ الآخَرُونَ إِنَّمَا فَرَرْنَا مِنْهَا. فَذَكَرُوا ذَلِكَ لِرَسُولِ اللَّهِ فَقَالَ لِلَّذِينَ أَرَادُوا أَنْ يَدْخُلُوهَا \" لَوْ دَخَلْتُمُوهَا لَمْ تَزَالُوا فِيهَا إِلَى يَوْمِ الْقِيَامَةِ \". وَقَالَ لِلآخَرِينَ خَيْرًا. وَقَالَ أَبُو مُوسَى فِي حَدِيثِهِ قَوْلاً حَسَنًا. وَقَالَ \" لاَ طَاعَةَ فِي مَعْصِيَةِ اللَّهِ إِنَّمَا الطَّاعَةُ فِي الْمَعْرُوفِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4205، يرد فيه ذكر الطاعة والمعصية، والطاعة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 4205 (The Book of al-Bay'ah), whose wording mentions obedience and disobedience, obedience. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 4205، جس کے الفاظ میں اطاعت اور معصیت، اطاعت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 4205, dont le texte mentionne l'obéissance et la désobéissance, l'obéissance. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 4205, cuyo texto menciona la obediencia y la desobediencia, la obediencia. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de 4205 numaralı hadis, itaat ve itaatsizlikten bahsetmektedir. Yazar, bu hadisi, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte, farz, müstehap, mekruh, haram ve küçük günahlar olarak derlemiştir. Yazar, metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4205, menyebutkan tentang ketaatan dan kedurhakaan. Penulis menyusunnya menjadi kumpulan amalan wajib, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Penulis menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
