  عمر والعلاهشم التريذلقومه • ورجال مكة مستتون عجاف
  والهشيم من التبات اليابس المتكسر والشجرة البالية يأخذها الحاطب كيف يشاء ومنه
  قولهم ماذلان الاهشيمة كرم اذا كان سععا ورجل هشيم ضعيف البدن وتهشم عليه فلان
  اذا تعطف واهتشم ماف ضرع الناقة اذا احتلبه صم . الهصم المكسر والهيصم
  الاسدوالهيصم من الرجال القوة ضم هضمت الشئ كسرته يقال هضمهحقه
  واهتضمه اذا ظله وكسر عليه حقه وهضَت للاْ من - قطائفة أى ترسته وتهضمه ظله
  ورجل هضيم ومهتضم أى مظلوم والهضيمة أن يتهضمك القوم شيأ أى يظلوك وتهضعت
  للقوم تهضما اذا انقدت لهم وتقاصرت أبو زيد أحضمت الابل للاجذاع وللاسداس بجيعا
  اذا ذهبت رواضعها وطلع غيرها قال وكذلت الغنم والهاضوم الذى يقال له الإوارش
  لانه يهضم الطعام وهذا طعام سريع الانهضام وبطىء الانهضام ويقال للطلع هضسيم مالم
  يخرج من كفرّاه لدخول بعضه فى بعض والهضيم من النساء اللطيفة الكشحي وكشح مهضم
  وحن مار مهضم لانه فيمايق ال أكسار يضم بعضها الى بعض وقال عنترة
