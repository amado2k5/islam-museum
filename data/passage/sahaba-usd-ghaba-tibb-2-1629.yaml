text: "… أخرج في جيش كذا الحديث أم هانىء الأنصارية ذكر ذلك ابن أبي خيْثَمة وكذا. قال: لا. قالت: يا رسول اللّه، إني ليس وغيره، وسنذكرها إن شاء اللّٰه تعالى. أُريد أن أُقاتل إنما أُريد أن أَداوي الجرحى والمرضى أخرجها الثلاثة، إلا …"
