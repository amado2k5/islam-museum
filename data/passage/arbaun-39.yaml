label: { ar: "الأربعون 39 — تجاوز الله عن أمتي الخطأ والنسيان", en: "Arba'un 39 — God pardoned my community error and forgetfulness", es: "Arba'un 39 — Dios perdonó mi error comunitario y mi olvido.", fr: "Arba'un 39 — Dieu a pardonné à ma communauté son erreur et son oubli", ur: "اربعون 39 — خدا نے میری برادری کی غلطی اور بھولپن کو معاف کر دیا۔" }
text: "إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه"
summary:
  ar: "حديث ابن عباس أن رسول الله قال: «إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه» — وهو الحديث التاسع والثلاثون في الأربعين النووية وفي شرح ابن رجب، وقال النووي حديث حسن رواه ابن ماجه والبيهقي وغيرهما؛ خرجه ابن ماجه (2045) والعقيلي والطبراني والبيهقي من طريق الأوزاعي عن عطاء عن ابن عباس، وخرجه ابن حبان والدارقطني وغيرهما وعندهم عن الأوزاعي عن عطاء عن عبيد بن عمير عن ابن عباس — وهذا إسناد صحيح في ظاهر الأمر ورواته كلهم محتج بهم في الصحيحين وقال الحاكم صحيح على شرطهما؛ لكن له علة — فقد أنكره الإمام أحمد جداً وقال ليس يروى فيه إلا عن الحسن عن النبي مرسلاً، وقيل لأحمد إن الوليد بن مسلم روى عن مالك عن نافع عن ابن عمر مثله فأنكره أيضاً، وذكر لأبي حاتم الرازي حديث الأوزاعي وحديث مالك ورواية الوليد عن ابن لهيعة عن موسى بن وردان عن عقبة بن عامر ⁦(جامع العلوم والحكم ص 796–809)⁩."
  en: "The hadith of Ibn Abbas that the Messenger of God said: 'God has pardoned for my sake on behalf of my community error, forgetfulness, and what they were coerced into' — the thirty-ninth of al-Nawawi's Forty and of Ibn Rajab's commentary, graded hasan by al-Nawawi, narrated by Ibn Majah and al-Bayhaqi among others; Ibn Majah (2045), al-Uqayli, al-Tabarani and al-Bayhaqi transmit it through al-Awza'i from Ata' from Ibn Abbas, while Ibn Hibban, al-Daraqutni and others carry al-Awza'i from Ata' from Ubayd ibn Umayr from Ibn Abbas — an isnad sound in appearance whose narrators are all relied upon in the two Sahihs, and al-Hakim declared it sound on their condition; yet it has a hidden defect, for Imam Ahmad repudiated it vehemently, saying it is only transmitted from al-Hasan from the Prophet as a mursal, and when told that al-Walid ibn Muslim narrated its like from Malik from Nafi' from Ibn Umar he repudiated that too; and Abu Hatim al-Razi was presented with al-Awza'i's hadith, Malik's hadith, and al-Walid's route from Ibn Lahi'a from Musa ibn Wardan from Uqba ibn Amir (Jami' al-Ulum wal-Hikam pp. 796–809)."
  es: "El hadiz de Ibn Abbas que el Mensajero de Dios dijo: 'Dios ha perdonado por mi causa en nombre de mi comunidad el error, el olvido y aquello a lo que fueron obligados' —el trigésimo noveno de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, calificado como hasan por al-Nawawi, narrado por Ibn Majah y al-Bayhaqi entre otros; Ibn Majah (2045), al-Uqayli, al-Tabarani y al-Bayhaqi lo transmiten a través de al-Awza'i de Ata' de Ibn Abbas, mientras que Ibn Hibban, al-Daraqutni y otros llevan al-Awza'i de Ata' de Ubayd ibn Umayr de Ibn Abbas— un isnad sólido en apariencia cuyos narradores son todos confiables en los dos Sahihs, y al-Hakim lo declaró sólido en su condición; Sin embargo, tiene un defecto oculto, pues el Imam Ahmad lo repudió vehementemente, diciendo que solo se transmite de al-Hasan del Profeta como un mursal, y cuando se le dijo que al-Walid ibn Muslim narró algo similar de Malik de Nafi' de Ibn Umar, también lo repudió; y a Abu Hatim al-Razi se le presentó el hadiz de al-Awza'i, el hadiz de Malik y la ruta de al-Walid de Ibn Lahi'a de Musa ibn Wardan de Uqba ibn Amir (Jami' al-Ulum wal-Hikam pp. 796–809)."
  fr: "Le hadith d'Ibn Abbas selon lequel le Messager de Dieu a dit: « Dieu a pardonné pour moi, au nom de ma communauté, l'erreur, l'oubli et ce à quoi ils ont été contraints » — le trente-neuvième des quarante hadiths d'al-Nawawi et du commentaire d'Ibn Rajab, classé hasan par al-Nawawi, rapporté notamment par Ibn Majah et al-Bayhaqi; Ibn Majah (2045), al-Uqayli, al-Tabarani et al-Bayhaqi le transmettent par l'intermédiaire d'al-Awza'i d'Ata' d'Ibn Abbas, tandis qu'Ibn Hibban, al-Daraqutni et d'autres transmettent al-Awza'i d'Ata' d'Ubayd ibn Umayr d'Ibn Abbas — une chaîne de transmission (isnad) d'apparence authentique dont les narrateurs sont tous cités dans les deux Sahihs, et al-Hakim l'a déclaré authentique à leur condition; Pourtant, elle comporte un défaut caché, car l'imam Ahmad l'a répudiée avec véhémence, affirmant qu'elle n'était transmise que d'al-Hasan, d'après le Prophète, comme une transmission mursal. Lorsqu'on lui a rapporté qu'al-Walid ibn Muslim avait rapporté une version similaire de Malik, d'après Nafi', d'après Ibn Umar, il l'a également répudiée. Quant à Abu Hatim al-Razi, on lui a présenté le hadith d'al-Awza'i, le hadith de Malik et la transmission d'al-Walid d'après Ibn Lahi'a, d'après Musa ibn Wardan, d'après Uqba ibn Amir (Jami' al-Ulum wal-Hikam pp. 796–809)."
  ur: "ابن عباس کی حدیث ہے کہ رسول اللہ نے فرمایا: 'خدا نے میری امت کی غلطی، بھول جانے اور ان پر جبر کیے جانے کی وجہ سے مجھے معاف کر دیا ہے' - نووی کی چالیسویں اور ابن رجب کی تفسیر کی انتیسویں، حسن کو النبوی اور ابن محنین نے روایت کیا ہے۔ ابن ماجہ (2045)، العقیلی، الطبرانی اور بیہقی نے اسے الاوزاعی کے ذریعے عطاء سے ابن عباس سے نقل کیا ہے، جب کہ ابن حبان، الدارقطنی اور دیگر نے الاوزاعی کو عطاء سے عبید بن عمیر سے نقل کیا ہے- جن کے تمام ابن عمیر ابن ابن عمیر سے ظہور میں ہیں۔ دو صحیحوں میں اور حاکم نے اسے ان کے حال پر صحیح قرار دیا ہے۔ اس کے باوجود اس میں ایک مخفی عیب ہے، کیونکہ امام احمد نے اس کی سختی سے تردید کی ہے، اور کہا ہے کہ یہ صرف حسن سے مرسل کے طور پر مروی ہے، اور جب انہیں بتایا گیا کہ ولید بن مسلم نے اسے مالک سے نافع سے ابن عمر سے روایت کیا ہے تو انہوں نے اسے بھی رد کیا۔ اور ابو حاتم الرازی کو الاوزاعی کی حدیث، مالک کی حدیث، اور الولید کا راستہ ابن لہیعہ سے موسیٰ بن وردان سے عقبہ بن عامر سے پیش کیا گیا ⁦(جامع العلوم والحکم صفحہ 796-809)⁩۔"
