label:
  ar: "مسلم 1560d — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Muslim 1560d — Pass over My servant: the one who was lenient with debtors"
  ur: "مسلم 1560d — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
text: "أتي الله بعبد من عباده آتاه الله مالا فقال له ماذا عملت في الدنيا - قال ولا يكتمون الله حديثا - قال يا رب آتيتني مالك فكنت أبايع الناس وكان من خلقي الجواز فكنت أتيسر على الموسر وأنظر المعسر . …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1560d: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1560d: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1560d: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
