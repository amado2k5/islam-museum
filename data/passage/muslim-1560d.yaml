ref: "1560d"
label:
  ar: "مسلم 1560d — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Muslim 1560d — Pass over My servant: the one who was lenient with debtors"
  ur: "مسلم 1560d — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
  es: "Muslim 1560d — Pasa de largo a mi siervo: aquel que fue indulgente con los deudores"
  fr: "Muslim 1560d — Passe par-dessus Mon serviteur: celui qui était indulgent envers les débiteurs"
  tr: "Müslim 1560d — Kulumu bağışla: Muhtaçlara kolaylık sağlayan kulumu."
  id: "Muslim 1560d — Ampunilah hamba-Ku: Dia yang memudahkan urusan orang-orang yang membutuhkan"
text: "أتي الله بعبد من عباده آتاه الله مالا فقال له ماذا عملت في الدنيا - قال ولا يكتمون الله حديثا - قال يا رب آتيتني مالك فكنت أبايع الناس وكان من خلقي الجواز فكنت أتيسر على الموسر وأنظر المعسر . …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1560d: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1560d: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1560d: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 1560d: «Pasa de largo a mi siervo: aquel que fue indulgente con los deudores». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 1560d: « Passez par-dessus Mon serviteur celui qui était indulgent envers les débiteurs. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 1560d: \"Ampuni hamba-Ku: orang yang memudahkan urusan orang yang berhutang.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
