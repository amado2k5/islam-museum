label: { ar: "البخاري 4033 — لا نورث ما تركناه فهو صدقة", en: "Bukhari 4033 — We do not inherit; what we leave is charity", es: "Bujari 4033 — No heredamos; lo que dejamos es caridad.", fr: "Bukhari 4033 — Nous n'héritons pas; ce que nous laissons est une aumône.", ur: "بخاری 4033 - ہم وارث نہیں ہیں۔ جو ہم چھوڑتے ہیں وہ صدقہ ہے۔", tr: "Buhari 4033 — Geride bıraktıklarımızı vasiyet etmeyiz; onlar sadakadır.", id: "Al-Bukhari 4033 — Kita tidak mewariskan apa yang kita tinggalkan; itu adalah sedekah." }
text: "أن عمر قال للعباس وعلي وهما يتساءلان في أموال النبي: «كانت لرسول الله ثلاث صفايا: فكانت أرض بني النضير حبساً لنوائبه، وجزأ خيبر على ثلاثة أجزاء، وكانت فدك لأبناء السبيل»، وحكم بينهما بأن ما تركه النبي صدقة لا يورث"
summary:
  ar: "في كتاب فرض الخمس؛ قصة تسائل العباس وعلي عند عمر في ميراث النبي من أرض بني النضير وخيبر وفدك، وفيه قاعدة «لا نورث، ما تركناه صدقة» وتقرير عمر لصفايا النبي الثلاث ووجوه صرفها. من نصوص الخلاف الأشهر بين العباس وعلي وبين أبي بكر ثم عمر."
  tr: "\"Humus Yükümlülüğü\" adlı kitapta, Abbas ve Ali'nin Ömer'e Peygamber'in Beni Nadir, Hayber ve Fadak topraklarının miras olarak kendisine bırakılması konusunda sorular sordukları bir hikaye anlatılır. Bu hikaye, \"Biz miras bırakmayız; bıraktığımız şey sadakadır\" ilkesini ve Ömer'in Peygamber'in seçtiği üç mal varlığı kategorisi ve bunların nasıl harcanması gerektiği hakkındaki hükmünü içerir. Bu, Abbas ve Ali'nin bir tarafta, Ebu Bekir ve ardından Ömer'in ise diğer tarafta yer aldığı en ünlü ihtilaf metinlerinden biridir."
  id: "Dalam kitab \"Kewajiban Khums,\" terdapat kisah tentang al-Abbas dan Ali yang mempertanyakan Umar tentang warisan Nabi berupa tanah Banu Nadir, Khaybar, dan Fadak. Kisah ini mencakup prinsip \"Kita tidak mewariskan; apa yang kita tinggalkan adalah sedekah,\" dan fatwa Umar tentang tiga kategori harta pilihan Nabi dan bagaimana harta tersebut harus dibelanjakan. Ini adalah salah satu teks paling terkenal yang menunjukkan perselisihan antara al-Abbas dan Ali di satu sisi, dan Abu Bakar dan kemudian Umar di sisi lain."
