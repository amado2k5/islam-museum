label: { ar: "البخاري 4033 — لا نورث ما تركناه فهو صدقة", en: "Bukhari 4033 — We do not inherit; what we leave is charity" }
text: "أن عمر قال للعباس وعلي وهما يتساءلان في أموال النبي: «كانت لرسول الله ثلاث صفايا: فكانت أرض بني النضير حبساً لنوائبه، وجزأ خيبر على ثلاثة أجزاء، وكانت فدك لأبناء السبيل»، وحكم بينهما بأن ما تركه النبي صدقة لا يورث"
summary:
  ar: "في كتاب فرض الخمس؛ قصة تسائل العباس وعلي عند عمر في ميراث النبي من أرض بني النضير وخيبر وفدك، وفيه قاعدة «لا نورث، ما تركناه صدقة» وتقرير عمر لصفايا النبي الثلاث ووجوه صرفها. من نصوص الخلاف الأشهر بين العباس وعلي وبين أبي بكر ثم عمر."
