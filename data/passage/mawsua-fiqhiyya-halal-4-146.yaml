text: "… الحلّ. وعلى ذلك فلو شارك مجوسى مسلما، كأن رميا صيدا أو أرسلا عليه جارحا يحرم الصيد، لأنه اجتمع فى قتله مبيح ومحرّم، فغلّبنا التحريم، كالمتولد بين ما يؤكل ومالا يؤكل، لقوله والي : ما اجتمع الحلال والحرام إلا وقد غلب …"
