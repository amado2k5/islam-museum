label: { ar: "سنن ابن ماجه 1256 — النافلة والنوافل", en: "Sunan Ibn Majah 1256 — the supererogatory (nafila)", ur: "سنن ابن ماجہ 1256 — نفل اور نوافل", fr: "Sunan Ibn Majah 1256 — le surérogatoire (nafila)", es: "Sunan Ibn Mayah 1256 — lo supererogatorio (nafila)" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي عِمْرَانَ الْجَوْنِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ الصَّامِتِ، عَنْ أَبِي ذَرٍّ، عَنِ النَّبِيِّ ـ قَالَ \" صَلِّ الصَّلاَةَ لِوَقْتِهَا. فَإِنْ أَدْرَكْتَ الإِمَامَ يُصَلِّي بِهِمْ فَصَلِّ مَعَهُمْ، وَقَدْ أَحْرَزْتَ صَلاَتَكَ. وَإِلاَّ فَهِيَ نَافِلَةٌ لَكَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1256، يرد فيه ذكر النافلة والنوافل. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 1256 (Establishing the Prayer and the Sunnah Regarding Them), whose wording mentions the supererogatory (nafila). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1256، جس کے الفاظ میں نفل اور نوافل کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 1256, dont le texte mentionne le surérogatoire (nafila). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 1256, cuyo texto menciona lo supererogatorio (nafila). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
