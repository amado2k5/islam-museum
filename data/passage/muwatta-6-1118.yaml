label: { ar: "الموطأ 1118 — ابن عمر: لا يشق جلال بدنه، ولا يجللها حتى يغدو من منى إلى عرفة", en: "Muwatta 1118", es: "Muwatta 1118", fr: "Muwatta 1118", ur: "موطا 1118", tr: "El-Muvatta 1118 — İbn Ömer: Mina'dan Arafat'a gidene kadar ne bedeninin örtüsünü yırtmalı ne de örtmelidir.", id: "Al-Muwatta 1118 — Ibn Umar: Dia tidak boleh merobek kain penutup tubuhnya, dan tidak boleh menutupinya, sampai dia berangkat dari Mina ke Arafat." }
text: "لا يشق جلال بدنه، ولا يجللها حتى يغدو من منى إلى عرفة"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان لا يشق جلال بدنه، ولا يجللها حتى يغدو من منى إلى عرفة. ويذكر المحقق أن البخاري علّقه، وأن البيهقي زاد فيه «إلا موضع السنام» ثم ينزع جلالها ويتصدق بها. {cite:muwatta-maruf-1997 p.511}"
  tr: "Malik, Nafi'den rivayet ettiğine göre, Abdullah ibn Umar, Mina'dan Arafat'a gidene kadar kurbanlık hayvanının örtüsünü yırtmaz, örtmezdi. Araştırmacı, Buhari'nin bunu kutsal metnine dahil ettiğini ve Beyhaki'nin de buna \"hörgüç bölgesi hariç\" diye eklediğini, sonrasında örtüyü kaldırıp sadaka olarak dağıttığını belirtiyor. {cite:muwatta-maruf-1997 s.511}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar tidak akan merobek kain penutup hewan kurbannya, dan juga tidak akan menutupnya, sampai ia berangkat dari Mina ke Arafat. Peneliti menyebutkan bahwa al-Bukhari memasukkannya dalam Kitab Suci, dan bahwa al-Bayhaqi menambahkan, “kecuali bagian punuknya,” kemudian ia akan membuka kain penutupnya dan memberikannya sebagai sedekah. {cite:muwatta-maruf-1997 p.511}"
