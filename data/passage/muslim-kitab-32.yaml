summary:
  ar: "القسم 32 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجهاد والسير»، ويضم فيها النصوص من 4519 إلى 4700 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 32 of Sahih Muslim (The Book of Jihad and Expeditions) in the division of the open hadith dataset the museum took its reports from: reports 4519 to 4700 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 32، عنوان «کتاب الجہاد والسیر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4519 تا 4700۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 32 de Sahih Muslim (El Libro de la Yihad y las Expediciones) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4519 al 4700 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre du Jihad et des Expéditions), dans le recueil ouvert de hadiths, le livre 32 (rapports 4519 à 4700). Il conserve ces informations sous cette référence; les éditions imprimées classent et numérotent la collection différemment."
