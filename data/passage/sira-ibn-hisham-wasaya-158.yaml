text: "… خُبِرَ مِنْ صَلاَبَتِهِ فِي دينِهِ وَعَدْلِهِ في حُكْمِهِ. قال ابن إسحاق: وحدثني يزيد بن رومان، عن عروة بن الزبير، عن عائشة، قالت: لما مات النجاشيُّ كان يُتَحَدَّثُ أنه لا يَزَالُ يُرَى على قَبْرِهِ نورٌ. أهل الحبشة يحاولون خلع النجاشي فيكيد …"
summary:
