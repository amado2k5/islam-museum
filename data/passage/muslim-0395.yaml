label:
  ar: "مسلم 395 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Muslim 395 — I have divided the prayer between Myself and My servant in two halves"
  ur: "مسلم 395 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهى خداج - ثلاثا - غير تمام . فقيل لأبي هريرة إنا نكون وراء الإمام . فقال اقرأ بها في نفسك فإني سمعت رسول الله يقول قال الله تعالى قسمت الصلاة بيني …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 395: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 395: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 395: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
