ref: "395"
label:
  ar: "مسلم 395 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Muslim 395 — I have divided the prayer between Myself and My servant in two halves"
  ur: "مسلم 395 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
  es: "Musulmán 395 — He dividido la oración entre Mí y Mi siervo en dos mitades."
  fr: "Muslim 395 — J'ai divisé la prière entre Moi-même et Mon serviteur en deux parties."
  tr: "Müslim 395 — Namazı kendimle kulum arasında ikiye böldüm."
  id: "Muslim 395 — Aku telah membagi salat antara-Ku dan hamba-Ku menjadi dua bagian."
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهى خداج - ثلاثا - غير تمام . فقيل لأبي هريرة إنا نكون وراء الإمام . فقال اقرأ بها في نفسك فإني سمعت رسول الله يقول قال الله تعالى قسمت الصلاة بيني …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 395: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 395: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 395: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 395: He dividido la oración entre Mí y Mi siervo en dos mitades. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 395: « J’ai divisé la prière en deux parties entre Moi et Mon serviteur. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 395: “Aku telah membagi salat antara Diri-Ku dan hamba-Ku menjadi dua bagian.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
