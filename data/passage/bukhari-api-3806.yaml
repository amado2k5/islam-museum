label: { ar: "صحيح البخاري 3806 — القراء", en: "Sahih al-Bukhari 3806 — the readers", ur: "صحیح بخاری 3806 — قراء" }
text: "حَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، عَنْ عَمْرٍو، عَنْ إِبْرَاهِيمَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍوما ـ سَمِعْتُ النَّبِيَّ يَقُولُ \" اسْتَقْرِئُوا الْقُرْآنَ مِنْ أَرْبَعَةٍ مِنَ ابْنِ مَسْعُودٍ وَسَالِمٍ مَوْلَى أَبِي حُذَيْفَةَ، وَأُبَىٍّ، وَمُعَاذِ بْنِ جَبَلٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3806، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 3806 (Merits of the Helpers in Madinah (Ansaar)), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 3806، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
