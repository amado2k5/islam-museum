label: { ar: "موطأ مالك 860 — أطوار خلق الجنين", en: "Muwatta Malik 860 — the stages of the embryo", ur: "موطأ مالک 860 — جنین کے مراحل", es: "Muwatta Malik 860 — las etapas del embrión", fr: "Muwatta Malik 860 — les stades de l'embryon", tr: "Muwatta Malik 860 — Embriyonik Gelişimin Aşamaları", id: "Muwatta Malik 860 — Tahapan Perkembangan Embrio" }
text: "… الْعُمْرَةَ حَتَّى يَجِبَ عَلَيْهِ فِي ذَلِكَ الْهَدْىُ فِي الْحَجِّ أَوِ الْعُمْرَةِ الْتِقَاءُ الْخِتَانَيْنِ وَإِنْ لَمْ يَكُنْ مَاءٌ دَافِقٌ. قَالَ وَيُوجِبُ ذَلِكَ أَيْضًا الْمَاءُ الدَّافِقُ إِذَا كَانَ مِنْ مُبَاشَرَةٍ فَأَمَّا رَجُلٌ ذَكَرَ شَيْئًا حَتَّى خَرَجَ مِنْهُ مَاءٌ دَافِقٌ فَلاَ أَرَى عَلَيْهِ شَيْئًا وَلَوْ أَنَّ رَجُلاً قَبَّلَ امْرَأَتَهُ وَلَمْ يَكُنْ مِنْ ذَلِكَ مَاءٌ دَافِقٌ لَمْ يَكُنْ عَلَيْهِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 860، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 860 (Hajj), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 860، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 860 (Hajj), menciona las etapas del embrión. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik n° 860 (Hajj) mentionne les stades de développement de l'embryon. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta adlı eserinde yer alan 860 numaralı hadis, fetüsün gelişim aşamalarını anlatmaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 860, menjelaskan tahapan perkembangan janin. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
