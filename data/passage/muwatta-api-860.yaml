text: "… الْعُمْرَةَ حَتَّى يَجِبَ عَلَيْهِ فِي ذَلِكَ الْهَدْىُ فِي الْحَجِّ أَوِ الْعُمْرَةِ الْتِقَاءُ الْخِتَانَيْنِ وَإِنْ لَمْ يَكُنْ مَاءٌ دَافِقٌ. قَالَ وَيُوجِبُ ذَلِكَ أَيْضًا الْمَاءُ الدَّافِقُ إِذَا كَانَ مِنْ مُبَاشَرَةٍ فَأَمَّا رَجُلٌ ذَكَرَ شَيْئًا حَتَّى خَرَجَ مِنْهُ مَاءٌ دَافِقٌ فَلاَ أَرَى عَلَيْهِ شَيْئًا وَلَوْ أَنَّ رَجُلاً قَبَّلَ امْرَأَتَهُ وَلَمْ يَكُنْ مِنْ ذَلِكَ مَاءٌ دَافِقٌ لَمْ يَكُنْ عَلَيْهِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 860، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 860 (Hajj), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 860، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
