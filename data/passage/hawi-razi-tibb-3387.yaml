text: "… عضلية. - نيلوفر: أصله متى شرب نفع من الإسهال المزمن، ونفع من قرحة المعى، وحلل ورم الطحال. ويضمد به لوجع المثانة. وإذا خلط بالماء وصير على البهق أذهبه. وإن خلط بزفت وصير على داء الثعلب أبرأ. ويشرب للاحتلام فيسكنه. ومتى …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3387، يذكر الوجع، والجذام والبرص، وأسماء الأمراض، والبرء من العلة، وأعضاء البدن، والجراحة والختان والجبائر، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3387, that mentions pain, leprosy and vitiligo, named diseases, recovery from an ailment, the organs of the body, surgery, circumcision and splints, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
