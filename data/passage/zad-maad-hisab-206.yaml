text: "… مَعقِلٍ لِما فاتها الحجُ معه، أن تعتمِرَ في رمضان، وأخبرها أَنَّ عُمْرَةً في رَمَضَان تَعْدِلُ حَجَّة [حسن : أبو داود: ١٩٨٩ - ١٩٨٨، والترمذي: ٩٣٩، وابن ماجه: ٢٩٩٣]. وأيضاً : فقد اجتمع في عمرة رمضان أفضلُ الزمان، وأفضلُ البقاع، ولكنَّ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 206، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 206, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 206 کا اقتباس جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
