text: "بالفكر، وقيل: بالذكر، وهو المختار، وبهذا المعنى بيان عجيب في كتاب (سفر السعادة) وشرحه، وإبهام العدد قيل: لاختلاف فيها، قال الشيخ: لعله بالنسبة إلى المدة التي بتخللها مجيئه إلى أهله، وإلا فأصل الخلوة قد عرفت مدتها وهي شهر، وذلك الشهر"
summary:
