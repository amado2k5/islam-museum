summary:
  ar: "سئل مالك عمن بعث معه بهدي ينحره في الحج وهو مهل بعمرة: هل ينحره إذا حل، أم يؤخره حتى ينحره في الحج ويحل هو من عمرته؟ فقال بل يؤخره حتى ينحره في الحج، ويحل هو من عمرته. {cite:muwatta-maruf-1997 p.520}"
