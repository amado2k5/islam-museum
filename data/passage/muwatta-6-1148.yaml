label: { ar: "الموطأ 1148 — مالك: من بُعث معه بهدي ينحره في الحج وهو مهل بعمرة، يؤخره حتى ينحره في الحج", en: "Muwatta 1148", es: "Muwatta 1148", fr: "Muwatta 1148", ur: "موطا 1148", tr: "El-Muvatta 1148 — Malik: Umre için ihram halinde iken Hac sırasında kurban kesilecek bir hayvanla gönderilen kimse, kurbanı Hac sırasında kesmek üzere ertelemelidir.", id: "Al-Muwatta 1148 — Malik: Barang siapa yang diutus membawa hewan kurban untuk disembelih saat haji, sementara ia sedang dalam keadaan ihram untuk umrah, maka ia harus menundanya hingga ia menyembelihnya saat haji." }
summary:
  ar: "سئل مالك عمن بعث معه بهدي ينحره في الحج وهو مهل بعمرة: هل ينحره إذا حل، أم يؤخره حتى ينحره في الحج ويحل هو من عمرته؟ فقال بل يؤخره حتى ينحره في الحج، ويحل هو من عمرته. {cite:muwatta-maruf-1997 p.520}"
  tr: "Malik'e, Hac sırasında kurban kesmek üzere yanında kurbanlık hayvan gönderen, ancak Umre için ihram halinde olan bir kişi hakkında soru soruldu: İhramdan çıktığında mı kurbanı kesmeli, yoksa Hac sırasında kesip Umre için ihramdan çıktıktan sonra mı kesmeli? Malik şöyle dedi: Aksine, Hac sırasında kesip Umre için ihramdan çıktıktan sonra kesmeli. {cite:muwatta-maruf-1997 s.520}"
  id: "Malik ditanya tentang seseorang yang mengirimkan hewan kurban bersamanya untuk disembelih saat ibadah haji, sementara ia sedang dalam keadaan ihram untuk umrah: Haruskah ia menyembelihnya ketika ia keluar dari ihram, atau haruskah ia menundanya hingga ia menyembelihnya saat ibadah haji dan kemudian keluar dari ihram untuk umrahnya? Beliau menjawab: Sebaiknya ia menundanya hingga ia menyembelihnya saat ibadah haji dan kemudian keluar dari ihram untuk umrahnya. {cite:muwatta-maruf-1997 p.520}"
