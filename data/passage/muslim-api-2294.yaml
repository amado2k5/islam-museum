label: { ar: "صحيح مسلم 2294 — الأب والأبوة", en: "Sahih Muslim 2294 — the father and fatherhood", ur: "صحیح مسلم 2294 — باپ اور والدیت", es: "Sahih Muslim 2294 — El padre y la paternidad", fr: "Sahih Muslim 2294 — Le père et la paternité" }
text: "وَحَدَّثَنِي هَارُونُ بْنُ سَعِيدٍ الأَيْلِيُّ، حَدَّثَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي عَمْرُو بْنُ الْحَارِثِ، أَنَّ بُكَيْرًا، حَدَّثَهُ عَنْ ذَكْوَانَ، عَنْ أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ أَنَّهُ قَالَ \" إِذَا لَمْ يُؤَدِّ الْمَرْءُ حَقَّ اللَّهِ أَوِ الصَّدَقَةَ فِي إِبِلِهِ \". وَسَاقَ الْحَدِيثَ بِنَحْوِ حَدِيثِ سُهَيْلٍ عَنْ أَبِيهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2294، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2294 (The Book of Zakat), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2294، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2294 (El Libro del Zakat), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2294 (Le Livre de la Zakat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
