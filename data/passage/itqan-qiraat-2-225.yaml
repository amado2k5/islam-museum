text: "… المصاحف، استبدلوا من غير البحريق والمن قارئيْن كمل بهما العدد، فصادف ذلك موافقة العدد الذى ورد الخبرُ بِه، فوقع ذلك لمن لم يعرف أصل المسألة ؛ ولم تكن له فطنة، فظن أنّ المراد بالأحرف السبعة القراءات السبع. والأصل المعتمد عليه …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 2، ص 225، يذكر الأحرف السبعة، وقراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 2, p. 225, that mentions the seven ahruf, the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 2، ص 225 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 2, pág. 225, que menciona los siete ahruf, las lecturas del Corán, los lectores, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 2, page 225, mentionnant les sept ahruf, les lectures du Coran, les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 2. cildinin 225. sayfasından bir alıntı, Kur'an'ın yedi farklı okunuş şeklini, Kur'an tilaveti biçimlerini, okuyucularını ve Kur'an'ın derlenmesini ve el yazmalarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak koduna uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an tilaveti, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 2, halaman 225, membahas tujuh cara pembacaan, bacaan Al-Qur'an, para qari, dan penyusunan Al-Qur'an serta manuskripnya. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
