label: { ar: "الموطأ 2664 — إسحاق بن عبد الله عن أنس: عمر يرقع بين كتفيه بثلاث رقع", en: "Muwatta 2664", es: "Muwatta 2664", fr: "Muwatta 2664", ur: "موطا 2664", tr: "El-Muvatta 2664 — İshak bin Abdullah, Enes'ten rivayetle: Ömer, omuzlarının arasına üç yama dikmişti.", id: "Al-Muwatta 2664 — Ishaq bin Abdullah berdasarkan riwayat Anas: Umar menambal bagian antara kedua bahunya dengan tiga tambalan." }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أنه قال: قال أنس بن مالك: رأيت عمر بن الخطاب، وهو يومئذ أمير المؤمنين، وقد رقع بين كتفيه برقع ثلاث، لبّد بعضها فوق بعض. {cite:muwatta-maruf-1997 p.504} {cite:muwatta-maruf-1997 p.505}"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan rivayetle şöyle der: Enes ibn Malik dedi ki: O zamanlar Müminlerin Emiri olan Ömer ibn el-Hattab'ı gördüm ve omuzlarının arasında, üst üste üç yama vardı. {cite:muwatta-maruf-1997 s.504} {cite:muwatta-maruf-1997 s.505}"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha bahwa ia berkata: Anas ibn Malik berkata: Aku melihat Umar ibn al-Khattab, yang saat itu adalah Amirul Mukminin, dan ia memiliki tiga tambalan di antara kedua bahunya, satu lapis di atas yang lain. {cite:muwatta-maruf-1997 p.504} {cite:muwatta-maruf-1997 p.505}"
