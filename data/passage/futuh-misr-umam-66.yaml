text: "… بمصر، فأقام بها نحوا من ثلاثمائة سنة، ثم حل إلى بدت المقدس. ذكر خروج بنى إسرائيل من مصر قال : ثم رجع إلى حديث عمان وغيره قال. ثم غرّق اللّٰه فرعون وجنوده فى اليمّ حين اتبع بنى إسرائيل، وغرق معه …"
