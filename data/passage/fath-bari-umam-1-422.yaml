text: "… أحسن عمله، وكأنه ذكر له إنفاقه في جيش العسرة وتسبيله بثر رومة ونحو ذلك. قوله : ثم سأله عن علي فذكر محاسن أعماله كأنه ذكر له شهوده بدرًا وغيرها وفتح خيبر على يديه وقتله مرحب ونحو ذاك. قوله : هو …"
