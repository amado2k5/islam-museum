text: |-
  ٢٢٠
  ١ كرزم ) الفراء السكرزم والسكرزن الفاس قال جرير
  وأورت القين العلاة ومر جلا • واصلاح أخرات الفوس السكرازما
  والكرزوم والسكرز ين بالسكسر منله ( ردم الكودم الرجل القصير الضخم والكردمة
  عدو القصير الكسائى كردم الهار وكردح اذاعداعلى جنب واحد ركم لكركم
  ⁦( عفران المقطعة منهكركة بالضم وبه سمى دواء الكركم زم)⁩ كزم الشى بمقدم فيه
  أف كسره واستخرح ما فيه لأكاه يقال الميريكزم من الحدحة والكزم غلظ الخذله
  وقصر هايغال فرس اكزم بين الكزم والتزم أيضافصر فى الانف والاصابع يقال أنف
  أكزم ويدكزماء والكزوم الناقة التى لم يبق فى فيهامنّ من الهرم ( كسم لكسم تنقيتك
  الشيدك ولا يكون الامن ني يابس والسكيسوم الحشيش الكثير وخيل أكاسم أى كثيرة
  يكادير كب بعضهابعضا وأبو يكسوم الجبشى صاحب الفيل قال لبيد
  لو كان سى فى الحياة مخلدا • فى الدهرألفاه أبو يكسوم
  ( شم رجل أكنم أى ناقص الخلق بين الكشم وقديكون ذلك النقصان أيضا
  3 الحب وقال
  غلام أتاه اللؤم من نحو خاله • له جانب واف وآخرأ كشم
  أى أيومحر وأمه أمة والكشم قطع الانف باستئصال كصم كصمه كصما دفعه بشد
  وكصم الرجل نكص كظم ظم غيظه كظها اجترعه فهورجل كظيم والغيظ مكظوم
  والكفيم غلق البباب والكفوم السكوت وكظم البعير بكظم كظومااذا أمل عن الجرّ
  فهو كاظم وابل كظوم تقول أرى الابل كطومالاتجتر وقوم تظم أى ساكتون قال
  العجاج
  ورب أمراب ميج كطم • عن اللغاورفث التسكام
  ويقال أخذت يكظمه أى بخرج نفسه والمع كظام وكاظمة موضع والكظامة بترالى
  جنبها بئروبينهما مجرى فى بطن الوادى وفى الحديث اذارأيت مكة قد بعجت كظائم والكنظامة
  الحلقة التى تجسمع فيها خيوط الميزان فى طرف الحديدة والكفامة العقب الذى على رؤس
  القذذالعليا كعم الكعام شى يجعل فى قم البعير يقال كهمت البعيراذ اشددت به ف.
  فى هياجه فهو مكعوم وكعمت الوعاء اذا شددت راسه وكعمه الخوف فلا برجع والمكاعمة
  التقبيل يقال كعمها وكاعمها اذا التقم فاها فى التقبيل ( كام لكلام اسم جذمر يقع
  على القليل والسكثير والكام لا يكون أقلّ من ثلاث كلمات لانه بجع كلة مثسل تبقة ونبق ولهذا
  قال سيبويه هذاباب علم ما ال-كام من العرببة ولم يقل ما الكلام لانه أرادنفس ثلاثة أشيا
  الاسم والفعل والمرف فجاء بمالا يكون الاجعا وترك مايمكن أن يقع على الواحد والهاعة
  وتميم تقول هى كلة بكسر السكاف و-كى الفراء فيهاثلاث لغات كلة وكلمة وكلمة مثل كبدوكبد
  وكبد وورق وورق وورق والكامة أيضا القصيدة بطولها والكايم الذى بكلمك يقال كمته
  نكليما وكلا مامثل كذبته تكذيبا وكذابا وتكلمت كلمة وبكلمة وكالمته اذا جاو بته وت-كالمنا
  بعدا التهاجر ويقال كانا متصار ين فأصحاية- كالمان ولا تقل يتكلوان وما أجد متكاما بفتح
  اللام أى موضع كلام والسكلمانى المنطيق والسكلم الجراسة والجمع كلوم وكلام تقول كلته
  كلا وقرأبعضهم دابة من الارض تكامهم أى تجر حهم وتسمهم والتكليم التجريح قال عنترة
