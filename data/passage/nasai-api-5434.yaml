label: { ar: "سنن النسائي 5434 — الأب والأبوة", en: "Sunan al-Nasa'i 5434 — the father and fatherhood", ur: "سنن نسائی 5434 — باپ اور والدیت", es: "Sunan al-Nasa'i 5434 — El padre y la paternidad", fr: "Sunan al-Nasa'i 5434 — le père et la paternité" }
text: "أَخْبَرَنَا مُوسَى بْنُ حِزَامٍ التِّرْمِذِيُّ، قَالَ أَنْبَأَنَا أَبُو أُسَامَةَ، عَنْ سُفْيَانَ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، عَنْ عُقْبَةَ بْنِ عَامِرٍ، أَنَّهُ سَأَلَ رَسُولَ اللَّهِ عَنِ الْمُعَوِّذَتَيْنِ. قَالَ عُقْبَةُ فَأَمَّنَا رَسُولُ اللَّهِ بِهِمَا فِي صَلاَةِ الْغَدَاةِ."
summary:
  ar: "حديث في سنن النسائي، رقم 5434، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5434 (The Book of Seeking Refuge with Allah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5434، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5434 (El Libro de la Búsqueda de Refugio en Alá), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5434 (Le Livre de la recherche du refuge auprès d'Allah), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
