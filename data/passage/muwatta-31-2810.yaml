summary:
  ar: "بلغ مالكا أن أمة كانت لعبيد الله بن عمر بن الخطاب، رآها عمر وقد تهيأت بهيئة الحرائر، فدخل على ابنته حفصة فقال لها: ألم أر جارية أخيك تجوس الناس وقد تهيأت بهيئة الحرائر؟ وأنكر ذلك عمر. {cite:muwatta-maruf-1997 p.577} {cite:muwatta-maruf-1997 p.578}"
