ref: "2810"
label: { ar: "الموطأ 2810 — عمر ينكر على حفصة جارية ابنه عبيد الله التي تشبهت بالحرائر", en: "Muwatta 2810", es: "Muwatta 2810", fr: "Muwatta 2810", ur: "موطا 2810", tr: "Al-Muwatta 2810 — Ömer, oğlu Ubeydullah'ın cariyesi Hafsa'yı, hür kadınları taklit ettiği için azarlar.", id: "Al-Muwatta 2810 — Umar menegur Hafsa, budak perempuan milik putranya Ubayd Allah, yang meniru perempuan merdeka." }
summary:
  ar: "بلغ مالكا أن أمة كانت لعبيد الله بن عمر بن الخطاب، رآها عمر وقد تهيأت بهيئة الحرائر، فدخل على ابنته حفصة فقال لها: ألم أر جارية أخيك تجوس الناس وقد تهيأت بهيئة الحرائر؟ وأنكر ذلك عمر. {cite:muwatta-maruf-1997 p.577} {cite:muwatta-maruf-1997 p.578}"
  tr: "Malik'e, Ubeydullah ibn Ömer ibn el-Hattab'a ait bir cariyenin Ömer tarafından hür kadın kıyafetleri içinde görüldüğü bildirildi. Ömer kızı Hafsa'ya giderek, \"Kardeşinin cariyesinin hür kadın kıyafetleri içinde insanlar arasında dolaştığını görmedim mi?\" dedi. Ömer bunu onaylamadı. {cite:muwatta-maruf-1997 s.577} {cite:muwatta-maruf-1997 s.578}"
  id: "Malik diberitahu bahwa seorang budak perempuan milik Ubayd Allah ibn Umar ibn al-Khattab terlihat oleh Umar mengenakan pakaian wanita merdeka. Umar pergi kepada putrinya, Hafsa, dan berkata kepadanya, \"Tidakkah aku melihat budak perempuan saudaramu berjalan di antara orang-orang mengenakan pakaian wanita merdeka?\" Umar tidak menyetujui hal ini. {cite:muwatta-maruf-1997 p.577} {cite:muwatta-maruf-1997 p.578}"
