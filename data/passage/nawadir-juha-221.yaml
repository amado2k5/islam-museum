text: "… أوَ لم تلد أُمُّك؟ جاءته يوماً امرأةٌ، ومعها كنّتها، وشكَت إليه أنه لم يلد لها ولدّ، وأنها وزوجها حزينانٍ، وأن لا سرورَ، والبيت خالٍ من الأطفالِ، فهل عندك تميمة أو بخورٌ أو علاجٌ تفيدنا به أو طريقة لذلك؟ فتأثر الشيخ، …"
summary:
  ar: "قالت امرأة وكنتها إنه ليس لهما أولاد، فسأل جحا الكنة هل هذا أمر وراثي، وهل أمها لم تلد. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  en: "A woman and her daughter-in-law say they have no child, and Juha asks the daughter-in-law whether this runs in the family, and whether her own mother had no children. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  ur: "ایک عورت اور اس کی بہو کہتی ہیں کہ ان کے کوئی اولاد نہیں، تو جحا بہو سے پوچھتا ہے کہ کیا یہ خاندانی بات ہے، اور کیا اس کی اپنی ماں کے بھی اولاد نہیں ہوئی تھی۔ {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  fr: "Une femme et sa belle-fille disent qu'elles n'ont pas d'enfant, et Juha demande à la belle-fille si cela est héréditaire et si sa propre mère n'avait pas eu d'enfants. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  es: "Una mujer y su nuera dicen que no tienen hijos, y Juha pregunta a la nuera si es algo hereditario y si su propia madre no tuvo hijos. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
