text: |-
  *فصل الواو)•
  •⁦(وكف)⁩ *
  ٦٥
  ذلك ية ولون رأيت أخاك النظريف فالاخ هو الموصوف والظريف هو الصفة فاه-ذا قالوا
  لا يجوز أن يضاف الشىء الى صفته كمالا يجوز أن يضاف الى نفسه لانّ الصفة هى الموصوف
  عندهم ألاتزى أنّ الظريف و الاخ طف) رجل أوطف بين الوطف وهوكثرة
  شعر العين والحاجبين وسحابة وطفاء بينه الوطف اذا كانت مسترخية الجوانب اسكثرة مائها
  والعيش الاوطف الرخئ (وظف الوظيف مستدق الذراخ والساق من الخيل والابل
  ونحوهما والمع الاوظفة قال الاصمعى يستحب من الفرس أن تعرض أوظفة رجليه
  وتحدب أوظفة يديه ووظفت البعيراذ اقصرت قيسده قال ابن الاعرابى" يقال-ريظفهم
  أى يتبعهم والوظيفة ما يقسدر للانسان فى كل يوم من طعام أورزق وقد وظفته نوظيفا
  غف الايضاف بالغين المعمة سرعة العدو والوغف ضعف البصر والوغف شئ
  يشت على إطن التيس لشلاينزو ( قف الوقف سوار من عاج يقال وقفت المدرأة
  توقيفا اذا جعات فى يديها الوقف وفرس موقت اذا أصاب الاوظفة منه بياض فى موضع
  الوقف ولم يعدها الى أسفل ولاذوق فذلك التوقيف ويقال وقفت الدابة تقف وقوفا
  وقفتا أنا وققا يتعدى ولا يتعدى ووقفته على ذنبه أى أطلعته عليه ووقفت الدار
  مساكين وقفا وأوقفتها بالالفلغة رديشة وليس فى الكلام أوقفت الاحرف واحد
  أوقفت عن الامر الذى كنت فيسه أى أقلعت قال الطرمّاح
  جامحا فى غوايتى ثم أوقفشب رضى بالتق وذوالبة راضى
  وحكى أبوع روكلمتهم ثم أوقفت أى أسكت وكل شى تمسك عنه تقول أوقفت وحكى أبو عبيد
  فى المصنف عن الاصمعى واليزيدى أنهما ذكراءن أبى عمروبن العلاء أنه قال لومررت برجل
  واقف فقلت له ما أوقفك ههنال أيته حسنا وحكى ابن السكيت عن السكسائى ما أوقفك
  ههنا وأىْ شي أوقفك ههنا أى أىّ شيصير الى الوقوف والموقف الموضع الذى تقف
  فيه حيث كان وموقفا الفرص الهزمتان فى كشعيه ويقال للمرأة انها لحمسنة الموقفين وهما
  الوجه والقدم عن يعقوب ويقال موقف المرأة عيناها ويداها ومالا بدّلها من اظهاره
  ا ويوقيف الناس فى الحج وقوفهم بالمواقف والتوقيف كالنص وواقف الفر يقان فى
  القتال وواقفته على كذامواقفة ووقافا واستوقفته أى سألته الوقوف والتوقف فى الشى
  كالتلوم فيه والوقيفة الوعل تطبئه السكلاب الى صذرة فلا يمكنه أن ينزل -تى يصاد وقال
  فلا تحسبنى شحمة من وقيفة • معارّدة عما تصيدك سلفع
  وواقف بطن من الانصار من بنى سالم بن مالك بن أوس ( ⁦(كف )⁩ وكف البيت وكفا
  ووكيفا ونوكافا أى قطر وأوكف البيت لغة فيسه وناقسة وكوف أى غزيرة والوكف النطع أ
  قال أَبوذؤيب .
  تدلى عليها بين سبة وخيطة * بجرداممثل الوكف يكبو غرابها
  والتوكف التوقع يقال مازات أتوكفه حتى لقيته والوكف بالتحريك الائم وقد وكف يوكف
  أى أثم والوكف أيضا العيب يق مال ليس عليك فى هذا وكف أى منقصة وعيب قال
