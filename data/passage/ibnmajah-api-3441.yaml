label: { ar: "سنن ابن ماجه 3441 — المرض والمريض، عيادة المريض", en: "Sunan Ibn Majah 3441 — illness and the sick; visiting the sick", ur: "سنن ابن ماجہ 3441 — بیماری اور بیمار، بیمار کی عیادت", es: "Sunan Ibn Majah 3441 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sunan Ibn Majah 3441 — la maladie et les malades; la visite aux malades", tr: "Sunan İbn Majah 3441 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sunan Ibn Majah 3441 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، حَدَّثَنَا أَبُو يَحْيَى الْحِمَّانِيُّ، عَنِ الأَعْمَشِ، عَنْ يَزِيدَ الرَّقَاشِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ دَخَلَ النَّبِيُّ ـ عَلَى مَرِيضٍ يَعُودُهُ قَالَ \" أَتَشْتَهِي شَيْئًا أَتَشْتَهِي كَعْكًا \". قَالَ نَعَمْ. فَطَلَبُوا لَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3441، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3441 (Chapters on Medicine), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3441، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3441 (Capítulos sobre Medicina), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3441 (Chapitres sur la médecine), évoque la maladie, les malades et les visites aux malades. Le Répertoire des textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3441 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3441, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
