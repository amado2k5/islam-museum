summary:
  ar: "القسم 30 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الكهانة و التطير»، ويضم فيها النصوص من 3904 إلى 3925 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 30 of Sunan Abi Dawud (Divination and Omens (Kitab Al-Kahanah Wa Al-Tatayyur)) in the division of the open hadith dataset the museum took its reports from: reports 3904 to 3925 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 30، عنوان «کتاب الکہانۃ و التطیر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3904 تا 3925۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 30 de Sunan Abi Dawud (Adivinación y Presagios (Kitab Al-Kahanah Wa Al-Tatayyur)) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 3904 a 3925 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
