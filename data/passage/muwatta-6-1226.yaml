label: { ar: "الموطأ 1226 — عمر بن الخطاب: من رمى الجمرة ثم حلق أو قصر ونحر هديا إن كان معه، فقد حل له إلا النساء والطيب حتى يطوف", en: "Muwatta 1226", es: "Muwatta 1226", fr: "Muwatta 1226", ur: "موطا 1226", tr: "El-Muvatta 1226 — Ömer ibn el-Hattab: Cemarat'a taş atan, sonra tıraş olan veya saçını kısaltan ve yanında kurbanlık hayvan varsa kesen kimse, tavaf edene kadar kadınlar ve parfümler hariç her şeyi yapmasına izin verilir.", id: "Al-Muwatta 1226 — Umar ibn al-Khattab: Barang siapa yang melempar kerikil ke Jamarat, kemudian mencukur atau memangkas rambutnya dan menyembelih hewan kurban jika ia memilikinya, maka ia diperbolehkan melakukan semua hal kecuali wanita dan parfum hingga ia melaksanakan Tawaf." }
summary:
  ar: "يروي مالك عن نافع وعبد الله بن دينار عن عبد الله بن عمر أن عمر بن الخطاب قال من رمى الجمرة ثم حلق أو قصر، ونحر هديا إن كان معه، فقد حل له ما حرم عليه، إلا النساء والطيب، حتى يطوف بالبيت. {cite:muwatta-maruf-1997 p.547}"
  tr: "Malik, Nafi'den ve Abdullah ibn Dinar da Abdullah ibn Umar'dan rivayetle Ömer ibn el-Hattab'ın şöyle dediğini aktarır: \"Kim Cemarat'a taş atar, sonra tıraş olur veya saçını kısaltır ve yanında varsa bir hayvan kurban ederse, kadınlar ve güzel kokular hariç, kendisine haram olan her şey helal olur; ta ki Kâbe'nin etrafında tavaf edene kadar.\" {cite:muwatta-maruf-1997 s.547}"
  id: "Malik meriwayatkan dari Nafi' dan Abdullah ibn Dinar dari Abdullah ibn Umar bahwa Umar ibn al-Khattab berkata: Barang siapa melempar batu ke Jamarat, kemudian mencukur atau memangkas rambutnya, dan menyembelih hewan kurban jika ia memilikinya, maka apa yang diharamkan baginya menjadi halal baginya, kecuali wanita dan parfum, hingga ia melakukan Tawaf mengelilingi Ka'bah. {cite:muwatta-maruf-1997 p.547}"
