text: "… زنباع وقال من مثل به او احرق بالنار فهوحروهو مولى اللّٰه عزوجل ورسوله واعثق مند رفقال له سندر يارسول النه اوص بي فقال اوصي بك كل مسلم فلما توفي رسول اللّٰه اتى سندر الى ابي بكر فقال احفظ في وصية …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 284، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
