label: { ar: "الموطأ 1645 — مالك: السنة عندنا أن المتلاعنين لا يتناكحان أبدا، وإن أكذب نفسه جلد الحد، والولد يلحق به، ولا ترجع إليه أبدا", en: "Muwatta 1645", es: "Muwatta 1645", fr: "Muwatta 1645", ur: "موطا 1645", tr: "El-Muvatta 1645 — Malik: Bizde sünnet şudur ki, birbirlerine lanet okuyanlar asla evlenmezler ve eğer suçlamasından vazgeçerse, belirlenen cezaya göre kırbaçlanır ve çocuk ona şiredilir ve çocuk asla ona geri dönmez.", id: "Al-Muwatta 1645 — Malik: Sunnah di kalangan kami adalah bahwa orang-orang yang saling mengutuk tidak boleh menikah, dan jika dia mencabut kutukannya, dia harus dicambuk sesuai dengan hukuman yang telah ditentukan, dan anak itu akan dianggap sebagai anaknya, dan dia tidak boleh kembali kepadanya." }
summary:
  ar: "يقول مالك السنة عندنا أن المتلاعنين لا يتناكحان أبدا، وإن أكذب نفسه جلد الحد، وألحق به الولد، ولم ترجع إليه أبدا، وعلى هذا السنة عندنا التي لا شك فيها ولا اختلاف. {cite:muwatta-maruf-1997 p.79}"
  tr: "Sünnetimize göre Malik, birbirlerine lanet edenlerin asla evlenmemeleri gerektiğini söyler. Eğer suçlamalarından vazgeçerlerse, belirlenen cezaya göre kırbaçlanırlar ve çocuk onlara nispet edilir ve asla ona geri verilmez. Bu, şüphe veya ihtilaf bulunmayan sünnetimizdir. {cite:muwatta-maruf-1997 s.79}"
  id: "Menurut Sunnah kita, Malik mengatakan bahwa orang-orang yang saling mengutuk tidak akan pernah menikah. Jika mereka mencabut kutukan mereka, mereka akan dicambuk sesuai dengan hukuman yang telah ditetapkan, dan anak tersebut akan dinikahkan kepada mereka, dan tidak akan pernah dikembalikan kepada mereka. Ini adalah Sunnah kita, yang tidak ada keraguan atau perselisihan tentangnya. {cite:muwatta-maruf-1997 p.79}"
