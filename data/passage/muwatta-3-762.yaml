label: { ar: "الموطأ 762 — مالك: لا صدقة على أهل الذمة والمجوس في نخيلهم وزروعهم ومواشيهم؛ فإن اتجروا في بلاد المسلمين أخذ منهم العشر", en: "Muwatta 762" }
summary:
  ar: "قول طويل لمالك: ليس على أهل الذمة ولا على المجوس في نخيلهم ولا كرومهم ولا زروعهم ولا مواشيهم صدقة، لأن الصدقة إنما وُضعت على المسلمين تطهيراً لهم ورداً على فقرائهم، ووُضعت الجزية على أهل الكتاب صغاراً لهم؛ فهم ما كانوا ببلدهم الذي صالحوا عليه ليس عليهم شيء سوى الجزية في شيء من أموالهم، إلا أن يتجروا في بلاد المسلمين ويختلفوا فيها فيؤخذ منهم العشر فيما يديرون من التجارات، لأن الجزية وُضعت عليهم على أن يُقروا ببلادهم ويُقاتل عنهم عدوهم، فمن خرج منهم إلى غير بلاده يتجر، كمن تجر من أهل مصر إلى الشام ومن الشام إلى العراق ومن العراق إلى المدينة أو اليمن، فعليه العشر، ويُقرون على دينهم، وكلما اختلفوا في العام الواحد إلى بلاد المسلمين فعليهم العشر لأنه ليس مما صالحوا عليه. ويقول مالك: وهذا الذي أدركت عليه أهل العلم ببلدنا. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.376} {cite:muwatta-maruf-1997 p.377}"
