label: { ar: "الموطأ 762 — مالك: لا صدقة على أهل الذمة والمجوس في نخيلهم وزروعهم ومواشيهم؛ فإن اتجروا في بلاد المسلمين أخذ منهم العشر", en: "Muwatta 762", es: "Muwatta 762", fr: "Muwatta 762", ur: "موطا 762", tr: "El-Muvatta 762 — Malik: Kitap Ehli ve Mecusilerin hurma ağaçları, ekinleri ve hayvanlarından zekât alınmaz; fakat Müslüman topraklarında ticaret yaparlarsa, zekâtın onda biri alınır.", id: "Al-Muwatta 762 — Malik: Tidak ada zakat yang wajib dibayarkan atas pohon kurma, hasil pertanian, dan ternak milik Ahli Kitab dan Majusi; tetapi jika mereka berdagang di negeri-negeri Muslim, maka sepersepuluh zakat diambil dari mereka." }
summary:
  ar: "قول طويل لمالك: ليس على أهل الذمة ولا على المجوس في نخيلهم ولا كرومهم ولا زروعهم ولا مواشيهم صدقة، لأن الصدقة إنما وُضعت على المسلمين تطهيراً لهم ورداً على فقرائهم، ووُضعت الجزية على أهل الكتاب صغاراً لهم؛ فهم ما كانوا ببلدهم الذي صالحوا عليه ليس عليهم شيء سوى الجزية في شيء من أموالهم، إلا أن يتجروا في بلاد المسلمين ويختلفوا فيها فيؤخذ منهم العشر فيما يديرون من التجارات، لأن الجزية وُضعت عليهم على أن يُقروا ببلادهم ويُقاتل عنهم عدوهم، فمن خرج منهم إلى غير بلاده يتجر، كمن تجر من أهل مصر إلى الشام ومن الشام إلى العراق ومن العراق إلى المدينة أو اليمن، فعليه العشر، ويُقرون على دينهم، وكلما اختلفوا في العام الواحد إلى بلاد المسلمين فعليهم العشر لأنه ليس مما صالحوا عليه. ويقول مالك: وهذا الذي أدركت عليه أهل العلم ببلدنا. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.376} {cite:muwatta-maruf-1997 p.377}"
  tr: "Malik uzun uzadıya şöyle dedi: Ne Kitap Ehli ne de Mecusiler, hurma ağaçları, bağları, ekinleri veya hayvanları için zekât ödemekle yükümlü değildir. Çünkü zekât, Müslümanları arındırmak ve fakirlerine bakmak için emredilmişti; cizye ise Kitap Ehli için bir aşağılama biçimi olarak emredilmişti. Onlar, antlaşma yaptıkları topraklarda kaldıkları sürece, Müslüman topraklarında ticaret yapmadıkları sürece, mallarının hiçbirinden cizye dışında bir şey ödemekle yükümlü değillerdir. Bu durumda, ticaretlerinden zekat alınır, çünkü cizye, topraklarında kalmaları ve düşmanlarıyla savaşmaları şartıyla emredilmişti. Bu nedenle, içlerinden herhangi biri ticaret yapmak için topraklarının dışına seyahat ederse, örneğin Mısır'dan Suriye'ye, Suriye'den Irak'a veya Irak'tan Medine'ye veya Yemen'e giderse, zekat ödemekle yükümlüdür ve dinlerini özgürce yaşayabilirler. Bir yıl içinde Müslüman topraklara seyahat ettikleri her seferinde, antlaşmanın bir parçası olmadığı için zekât ödemekle yükümlüdürler. Malik şöyle dedi: \"Ülkemizdeki âlimlerin bu konuda hemfikir olduğunu gördüm.\" Editör, el yazmalarındaki farklılıkları not eder ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.376} {cite:muwatta-maruf-1997 s.377}"
  id: "Malik berkata panjang lebar: Baik Ahli Kitab maupun Majusi tidak diwajibkan membayar zakat atas pohon kurma, kebun anggur, hasil panen, atau ternak mereka. Ini karena zakat dikenakan kepada umat Islam untuk menyucikan mereka dan menyediakan kebutuhan bagi kaum fakir miskin, sedangkan jizya dikenakan kepada Ahli Kitab sebagai bentuk penghinaan. Selama mereka tetap berada di negeri yang telah mereka sepakati, mereka tidak diwajibkan membayar apa pun selain jizya atas kekayaan mereka, kecuali jika mereka melakukan perdagangan di negeri-negeri Muslim. Dalam hal itu, zakat diambil dari perdagangan mereka, karena jizya dikenakan kepada mereka dengan syarat mereka tetap berada di negeri mereka dan memerangi musuh-musuh mereka. Oleh karena itu, jika ada di antara mereka yang bepergian ke luar negeri untuk berdagang, seperti seseorang dari Mesir ke Suriah, dari Suriah ke Irak, atau dari Irak ke Madinah atau Yaman, mereka wajib membayar zakat dan diperbolehkan untuk menjalankan agama mereka. Setiap kali mereka melakukan perjalanan ke negeri Muslim dalam satu tahun, mereka wajib membayar persepuluhan karena hal itu bukan bagian dari perjanjian. Malik berkata: Inilah yang saya temukan sebagai konsensus para ulama di negeri kita. Editor mencatat perbedaan dalam manuskrip dan menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.376} {cite:muwatta-maruf-1997 p.377}"
