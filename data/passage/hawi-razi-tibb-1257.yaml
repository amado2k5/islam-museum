text: "… الفرق بين ورم الكبد وذات الجنب جوامع العلل والأعراض من أزمان الأمراض. الأعضاء الآلمة.. في علاج الورم الصلب في الأحشاء وغيرها.. في العلل والأعراض الأعضاء الآلمة صفة الدواء الذي يعرف بالقفي الأعضاء الآلمة علاج اليرقان من جوامع تدبير الأصحاء"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1257، يذكر المرض والمريض، وأسماء الأمراض، والبيمارستان وصناعة الطب، والعلاج، وأعضاء البدن، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1257, that mentions illness and the sick, named diseases, the hospital and the medical craft, treatment, the organs of the body, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1257 کا اقتباس جس میں بیماری اور بیمار، بیماریوں کے نام، بیمارستان، علاج، اعضائے بدن، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 1257, que menciona la enfermedad y los enfermos, las enfermedades específicas, el hospital y la práctica médica, el tratamiento, los órganos del cuerpo y los medicamentos; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 1257, qui mentionne la maladie et les malades, les maladies nommées, l'hôpital et l'art médical, le traitement, les organes du corps, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 1257. sayfasından bir bölüm; hastalık ve hasta, hastalıkların isimleri, hastane ve tıp mesleği, tedavi, vücut organları ve ilaçlardan bahsediliyor; makineyle okunabilir fotokopi versiyonundan alınmış olup, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 1257, yang menyebutkan penyakit dan pasien, nama-nama penyakit, rumah sakit dan profesi medis, pengobatan, organ tubuh, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
