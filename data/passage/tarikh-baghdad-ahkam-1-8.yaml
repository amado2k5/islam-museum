text: "… عبد الكيددة وتبد الله بن ادريس، وعيسى بن يونس، وعبد الرحمن المحاريى، وتمبدة بن سليمان، ويحيى بن سعيد العطان، وعمر وإعلى ومحمد، بنو حبيد العام أفسى، وأبو أسامة، وعبد اللّٰه بن غير، وثيرهم. وكان من أقرأ الناس للقرآن، وأعرفهم بالفرائض، …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 8، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 1, p. 8, whose wording mentions the obligation (farida); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 1، ص 8 کا اقتباس جس میں فریضہ اور فرائض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh Baghdad de al-Khatib al-Baghdadi, volume numérisé 1, p. 8, dont le texte mentionne l'obligation (farida) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
