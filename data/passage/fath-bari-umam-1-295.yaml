text: "… تقدم في:، طرفه في: الحديث الأربعون : حديث أبي هريرة إذا هلك كسرى. فلا كسرى بعده. قوله : كسرى بكسر الكاف ويجوز الفتح، وهو لقب لكل من ولي مملكة الفرس، وقيصر لقب لكل من ولي مملكة الروم، قال ابن الأعرابي …"
