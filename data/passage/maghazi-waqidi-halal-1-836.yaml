text: "… قد أَذهب نَخْوَة الجاهليّة وتكبُّرها بآبائها، كلُّكم مِن آدم وآدمُ ين تُراب، وأكرمكم عند اللّٰه أَتقاكم. أَلا إنَّ اللّٰه حرّم مكَّة يوم خَلَق السمواتِ والأَرض، فهى حرامٌ بِحرْمَة اللّه، لم تحِلّ لأَحدٍ قبلى، ولا تحِلُّ لأَحدٍ كائنٍ بعدى، ولم تَحِلّ …"
summary:
