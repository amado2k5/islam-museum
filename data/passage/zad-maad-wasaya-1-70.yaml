text: "… بل قد صح ذلك وهو في صحيح البخاري. ولم يصح عنه حديثُ البراء : ثم لا يعود أبو داود: -. بل هي من زيادة يزيد بن زياد. فليس تركُ ابنِ مسعود الرفعَ ممّا يُقدَّم على هديه المعلوم، فقد تُركّ من …"
