text: "… التعلق بضوء القمر أحسَّ يوماً بأقدام لصِّ على السطح، فقال لأمرأته : إنِّي في الليلة الماضية أتيت إلى البيت، وطرقتٍ الباب، فلم تسمعي، فقرأتُ هذا الدعاء وقرأ لها أحد الأدعية المختصرة ثم تعلَّقت بضوءِ القمر، ودخلتُ الدار. وكان اللصِ يسمع …"
summary:
  ar: "أحس جحا بلص على السطح فقال لزوجته إنه حاول دخول البيت بدعاء ونزل على ضوء القمر، فسمع اللص الدعاء وجربه فسقط وكسر أضلاعه، فأمسك به جحا وطلب من زوجته أن تشعل شمعة. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  en: "Juha, sensing a thief on the roof, tells his wife he had tried to enter the house by a prayer and climbed down by moonlight; the thief overhears the prayer, tries the same, falls, and breaks his ribs; Juha catches him and asks his wife to light a candle. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  ur: "جحا کو چھت پر چور کی آہٹ محسوس ہوئی تو اس نے اپنی بیوی سے کہا کہ اس نے ایک دعا کے ذریعے گھر میں داخل ہونے کی کوشش کی تھی اور چاندنی کی روشنی میں اتر آیا تھا، چور نے یہ دعا سن لی اور وہی آزمایا تو گر پڑا اور اس کی پسلیاں ٹوٹ گئیں، جحا نے اسے پکڑ لیا اور بیوی سے کہا کہ شمع جلا دے۔ {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  fr: "Sentant un voleur sur le toit, Juha dit à sa femme qu'il avait essayé d'entrer dans la maison par une prière et qu'il était descendu à la lumière de la lune ; le voleur entend la prière, essaie la même chose, tombe et se brise les côtes ; Juha l'attrape et demande à sa femme d'allumer une bougie. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  es: "Al sentir a un ladrón en el tejado, Juha dice a su esposa que había intentado entrar en la casa mediante una oración y había bajado a la luz de la luna; el ladrón oye la oración, prueba lo mismo, cae y se rompe las costillas; Juha lo atrapa y pide a su esposa que encienda una vela. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
