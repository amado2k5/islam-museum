text: "… بِرُمْحٍ أَوْ رَمْيَةً بِسَهْمٍ، وَوَجَدْنَاهُ قَدْ قُتِلَ وَقَدْ مَثَّلَ بِهِ الْمُشْرِكُونَ، فَمَا عَرَفَهُ أَحَدٌ إِلاَّ أُخْتُهُ بِبَنَانِهِ. قَالَ أَنَسٌ كُنَّا نَرَى أَوْ نَظُنُّ أَنَّ هَذِهِ الآيَةَ نَزَلَتْ فِيهِ وَفِي أَشْبَاهِهِ {مِنَ الْمُؤْمِنِينَ رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ} إِلَى آخِرِ الآيَةِ. وَقَالَ إِنَّ أُخْتَهُ وَهْىَ تُسَمَّى الرُّبَيِّعَ كَسَرَتْ ثَنِيَّةَ امْرَأَةٍ فَأَمَرَ رَسُولُ اللَّهِ بِالْقِصَاصِ، فَقَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2806، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 2806 (Fighting for the Cause of Allah (Jihaad)), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 2806، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
