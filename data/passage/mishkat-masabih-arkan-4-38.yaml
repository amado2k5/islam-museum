text: "… يقلبها الرياح ظهرًا لبطن. رواه أحمد. - وعن علي، قال: قال رسول اللّٰه : لا يؤمن عبد حتى يؤمن بأربع: يشهد أن لا إله إلا اللّٰه وأني رسول اللّٰه بعثني بالحق، ويؤمن بالموت، والبعث بعد الموت، ويؤمن بالقدر. رواه الترمذي، …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 4، ص 38، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 4, p. 38, that mentions belief in the decree, what faith is not complete without, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 4، ص 38 کا اقتباس جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
