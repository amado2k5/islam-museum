  لمارايت عدالقوم يسلبهم * طلح الشواجن والبارفاء والسلم
  وعدىّ من قريش رهط عمو بن الظطاب رضى اللّٰه عنه وهو عدى بن كعب بن لوى مبن غالب
  ابن فهر بن مالك بن النضر والنسبة اليه عدوى وعدى عين مناة من الرباب رهطا ذى الرقّة
  وعدى" فى بنى حنيفة وعدىّ فى فزارة وبنو العدوية قوم من حفظلة وتميم والعدوية من
  نبات الصيف بعد ذهاب الربيع يخضرّ صغار الشبجر فترعاه الابل يقال أصابت الابل عدوية
  وسموأل بن عاديا عمدود قال الخر بن قواب
  هلاسألت بعاديا موييته * واخلّ وانخرالتى لم تمنع
  وقد قصره المرادى فى الشعر فقال .
  بق لى عاديا حصنا حصينا • اذا ماسا منى ضيم أبيت
  ذ العذى بالتسكين الزرع الذى لا يسقيه الاماء المطر والعذى أيضا اسم موضع
  والعذاة الارض الطيبة التربة والجمع عذواتِ قال ذوالرقة
  بأرض هجان الترب وسمية الثرى * عداة نأت عنها الملوحة واليجر
  وكذلك أرض عذية مثل خرية را) العرامصور الفناء والساحة ونكذلك العراة
  والعراة أيضاشدة البرد والعراء بالمدّ الفضاء لاستربه قال اللّٰه تعالى لنبذ بالعراء وعروى
  هضية وعروة القميص والكوز معروفة والعروة أيضامن الشجر الشنيّ الذى لإيزال باقيا
  فى الإرض لا يذهب وجمعه عراويشبه به البنك من الناس قال مهلهل
  خلع الملوك وسارتحت لوائه * شجر المرا وعراعر الاقوام
  وقال آخر ولم أجد عروة اللخلاقق الا الدين لما اعتبرت والحسبا
  والعروة الاسدوبه سمى الرجل عروة وأناء رومنه بالسكسر أى خساد وءوانى ه ذا الإمر
  واعترانى اذا غشيك وعروت الرجل أءروه عروا اذا ألممت به وأتبته طالبافهو معرة وفلان
  تعروه الاضياف وتعتريه أى نغشاه ومنه قول النابغة
  أتيتك عاريا خلقائيابي * على خوف نظن بى الظنون
  والعرية النخلة يعربها صاحبها رجلا محتاجا فيجعل له مرها عاما فيعر وها أى يأتيها وهى:
  فعيلة بمعدنى مفعولة وانما أدخلت فيها الهاء لانها أفردت فصارت فى عداد الاسماء مثل
  النطيعة والاكيلة ولوجثت بها مع النخلة قلت نخلة عرى وفي الحديث انه رخص
  فى العرايا بعدنهيه عن المزابنة لانه ربما تأذى المعرى بدخوله عليه فيحتاج أن يشتريها
  منه يثمن فرخص له فى ذلك قال شاعر الانصار
  وليست بسنهاء ولارجبية * ولمكن عرايافى السنين الهوائح
  يقول انا نعريها الناس الحاويج واستعرى الناس فى كل وجه وهو من العرية أى أكلوا
  الرطب والعرية أيضا الريح الباردة الكلابى" بقال ات مشيتناهذه لعرية اى باردة ويقال
  أهلاْ فقدأعريت أى غابت الشمس وبردت والعرواء مثال الغاواء قزة المى ومسها فى أول
  ما تأخذ بالرعدة وقد عرى الرجل على مالم يسم تفاعله فهو معرق وقول ابيد .
  والفيب ان تعرمى رقة خلقا *بعدالمات فانى كنت أنثر
