text: |-
  ⁦(فصل اليم)⁩
  ⁦(مزغ)⁩
  ٦٢٣
  وقول النابغة وميزانه فى سورة الجدماتع أى راع زائد وحبل مائع أى جيد الفتل
  ونييذمائع أى شديد الحرة وكل شئ جيد فهومانع والمشاع السلعة والمناع أيضا المنفعة وما
  تمتعت به وقد متع به يمتع متعا يقال اتن اشتريت هذا الغلام لتمنهنّ منه بغلام صالح أى
  لتذهين به قال المشعث تمتع بامشعث ان شيئا • سيقت به الممات هو المتاع
  وبه-ذا البيت هى مشعثا وقال تعالى ابتغاءحلية أومتاع وتمتعت بكذا واستمتعت
  به بمعنى والاسم المتعة ومنه متعة الذكاح ومتعة الطلاق ومتعة الحبج لانه انتفاع وأمتعه اللّٰه
  بكذا ومتعه بمعنى أبوزيد أمتعت بالشى أى تنمت به وأنشد للراعى
  خليطين من شعبين شتى تجاورا • قديما وكانا بالتفرّق أمتعا
  وأبو عمر ومثله وأنشد للمراحى
  ولكنما اجدى وأمتع جده * بفرق يخشيه بهجهج ناعقه
  أى تمتع جده بفرق من الغنم وخالفهما الاصيعى وروى البيت الأوّل وكان اللتفرق باللام
  يقول ليس أحد يفارق صاحبه الا أمتعه بشئ يذكره به:- كان ما أمتع به كل واحد من هذين
  صاحبه أن فارقه وروى البيت الشانى وأمتع جده بالنصب أى أمتع اللّه جده ويقال
  أمتعت عن فلان أى استغنيت عنه حكاه أبوعمرو عن الميرى ⁦(مجع)⁩ الجمع بالكسعر
  الاحمق والمجعة بالضم مثله وكذلك المجعة مثال الهمزة ومجع الرجل بالكسر يمجع مجاعة
  اذا تماجن وامرأة مجعة قلياالحيا مثال جلعة فى الوزن والمعني عن يعقوب وغاجع الرجلان
  تماجنا وترافنا والمجيع ضرب من الطعام وهوتريعجن بابن وقال
  ان فى دارناثلاث حبالى • فوددنا ان لووضعن جيعا
  جارتى ثم هرتى ثم شاتى • فاذا ماوضعن كر ريعا
  جارتى للخبيص والهزللفا ر وشاتى اذا اشتهينامجيها
  ذع) المك- ائى مذع لى الخبراذاحدثك ببعضه وكتم البعض حكاه عنه أبو عبيد قال
  والمذاع الذى لا يكتم السرّويقال الكذاب ومذع ييوله اى رمى به رع لمربع الخصيب
  وابهع أمرع وامراع مثل يمين وأيمن وأيمان قال أبوذؤيب
  أكل الجيم وطاوعته سمحج • مثل القناه وأزاعته الإمرع
  وقد مرع الوادى بالضم وأمرع أى أكلا فهو مرع وأمرعته أى أصبته مربعافهو عرع
  وفى المثل أمرءت قانزل ويقال القوم ممرعون اذاكانت مواشيهم فى خصب وأرض
  أمروعة أى خصبة وأمرع رأسنه بدهن اى أكثرمنه وأوسعه قال رؤية
  كغصن بان عوده سرعوع * كانّ وردا من دهان؟رع
  يقول كات لونه يعلى بالدهن اصفانه والمرعة مثال الهمزة طائرشيه بالدرّاجة عن ابن
  لسكيت والجمع مرع زع . يقال مرّاظبى يمزع أى يسرع وكذلك القرس والتمزيع
  التفربق والمرأة تزع القطن بيديما اذا زيدته كا ماتقطعه ثم تؤلفه فتوده بذلك وفلان يتزع
  من الغيظ أى يتقطع وفى الحديث أنه غضب غضباشديد احتى تخيل الىّ أن أنفه يتمزع قال
  أبو عبيد ليس تمزع بشئ واكمنى أحسبه يترمع وهوأن تراء كانه يرعد من الغضب ولم ينك
