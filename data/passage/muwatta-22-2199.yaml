label: { ar: "الموطأ 2199 — مالك: أو يعطي الرجل ابنه أو ابنته المال، فتنكح المرأة الرجل إنما تنكحه لغناه وللمال الذي أعطاه أبوه، فيريد الأب أن يعتصر ذلك، فليس له أن يعتصر من ابنه ولا من ابنته شيئا من ذلك، إذا كان على ما وصفت لك", en: "Muwatta 2199" }
summary:
  ar: "قال مالك: أو يعطي الرجل ابنه أو ابنته المال، فتنكح المرأة الرجل، إنما تنكحه لغناه وللمال الذي أعطاه أبوه، فيريد أن يعتصر ذلك الأب، أو يتزوج الرجل المرأة، قد نحلها أبوها النحل، إنما يتزوجها ويرفع في صداقها لغناها ومالها، وما أعطاها أبوها، ثم يقول الأب: أنا أعتصر ذلك: فليس له أن يعتصر من ابنه ولا من ابنته شيئا من ذلك، إذا كان على ما وصفت لك. {cite:muwatta-maruf-1997 p.301} {cite:muwatta-maruf-1997 p.302}"
