label: { ar: "صحيح البخاري 4833 — أثر من الآثار المحفوظة", en: "Sahih al-Bukhari 4833 — a relic kept after its owner", ur: "صحیح بخاری 4833 — محفوظ آثار و تبرکات", es: "Sahih al-Bukhari 4833 — una reliquia conservada después de su dueño.", fr: "Sahih al-Bukhari 4833 — une relique conservée après son propriétaire", tr: "Sahih el-Buhari 4833 — Korunmuş bir gelenek", id: "Sahih al-Bukhari 4833 — Sebuah hadis yang terpelihara" }
text: "… كَانَ يَسِيرُ فِي بَعْضِ أَسْفَارِهِ وَعُمَرُ بْنُ الْخَطَّابِ يَسِيرُ مَعَهُ لَيْلاً، فَسَأَلَهُ عُمَرُ بْنُ الْخَطَّابِ عَنْ شَىْءٍ، فَلَمْ يُجِبْهُ رَسُولُ اللَّهِ ثُمَّ سَأَلَهُ فَلَمْ يُجِبْهُ، ثُمَّ سَأَلَهُ فُلَمْ يُجِبْهُ، فَقَالَ عُمَرُ بْنُ الْخَطَّابِ ثَكِلَتْ أُمُّ عُمَرَ، نَزَرْتَ رَسُولَ اللَّهِ ثَلاَثَ مَرَّاتٍ، كُلَّ ذَلِكَ لاَ يُجِيبُكَ. قَالَ عُمَرُ فَحَرَّكْتُ بَعِيرِي، ثُمَّ تَقَدَّمْتُ أَمَامَ النَّاسِ، وَخَشِيتُ أَنْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4833، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4833 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4833، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4833 (Comentario profético del Corán (Tafsir del Profeta, p.a.)), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 4833 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 4833 numaralı hadiste, korunmuş bir kutsal emanetten bahsedilir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4833, menyebutkan sebuah relik yang terpelihara. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
