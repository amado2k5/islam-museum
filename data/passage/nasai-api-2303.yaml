label: { ar: "سنن النسائي 2303 — الرخصة، ما لا حرج فيه", en: "Sunan al-Nasa'i 2303 — the concession (rukhsa); what carries no blame", ur: "سنن نسائی 2303 — رخصت، جس میں کوئی حرج نہیں", fr: "Sunan al-Nasa'i 2303 — la dispense (rukhsa) ; ce qui n'entraîne aucun blâme", es: "Sunan al-Nasa'i 2303 — la dispensa (rukhsa); lo que no acarrea reproche", tr: "Sunan an-Nasa'i 2303 — İzin, yasaklanmamış olan şey", id: "Sunan an-Nasa'i 2303 — Izin, yaitu sesuatu yang tidak dilarang" }
text: "… قَالَ أَنْبَأَنَا ابْنُ وَهْبٍ، قَالَ أَنْبَأَنَا عَمْرٌو، وَذَكَرَ، آخَرَ عَنْ أَبِي الأَسْوَدِ، عَنْ عُرْوَةَ، عَنْ أَبِي مُرَاوِحٍ، عَنْ حَمْزَةَ بْنِ عَمْرٍو، أَنَّهُ قَالَ لِرَسُولِ اللَّهِ أَجِدُ فِيَّ قُوَّةً عَلَى الصِّيَامِ فِي السَّفَرِ فَهَلْ عَلَىَّ جُنَاحٌ قَالَ \" هِيَ رُخْصَةٌ مِنَ اللَّهِ عَزَّ وَجَلَّ فَمَنْ أَخَذَ بِهَا فَحَسَنٌ وَمَنْ أَحَبَّ أَنْ يَصُومَ فَلاَ جُنَاحَ عَلَيْهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2303، يرد فيه ذكر الرخصة، وما لا حرج فيه. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 2303 (The Book of Fasting), whose wording mentions the concession (rukhsa), what carries no blame. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 2303، جس کے الفاظ میں رخصت، جس میں کوئی حرج نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 2303, dont le texte mentionne la dispense (rukhsa), ce qui n'entraîne aucun blâme. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 2303, cuyo texto menciona la dispensa (rukhsa), lo que no acarrea reproche. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de 2303 numaralı hadis, helal ve haram olmayan amelleri ele almaktadır. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2303, menyebutkan amalan yang diperbolehkan dan yang tidak dilarang. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
