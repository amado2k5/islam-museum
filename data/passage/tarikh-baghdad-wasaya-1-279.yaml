text: "- حدثنا الحسين بن فهم حدثنا محمد بن سعد. قال : كان شيبان بن عبد الرحمن. النحوى ثقة فى الحديث، مات ببغداد سنة أربع وستين ومائة فى خلافة المهدى، ودفن فى مقابر قريش باب التبن. أخبرنا محمد بن الحسين القطان …"
