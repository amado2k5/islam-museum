label: { ar: "الموطأ 2520 — مالك: القصاص بين المماليك كقصاص الأحرار", en: "Muwatta 2520" }
summary:
  ar: "قال مالك: الأمر عندنا في القصاص بين المماليك كهيئة قصاص الأحرار: نفس الأمة بنفس العبد، وجرحها بجرحه. فإذا قتل العبد عبدا عمدا خُير سيد العبد المقتول: فإن شاء قتل، وإن شاء أخذ العقل فأخذ قيمة عبده. وإن شاء رب العبد القاتل أن يعطي ثمن العبد المقتول فعل، وإن شاء أسلم عبده، فإذا أسلمه فليس عليه غير ذلك. وليس لرب العبد المقتول، إذا أخذ العبد القاتل ورضي به، أن يقتله. وذلك في القصاص كله بين العبيد، في قطع اليد والرجل وأشباه ذلك، بمنزلته في القتل. {cite:muwatta-maruf-1997 p.434}"
