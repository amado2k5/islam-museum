label: { ar: "الموطأ 2520 — مالك: القصاص بين المماليك كقصاص الأحرار", en: "Muwatta 2520", es: "Muwatta 2520", fr: "Muwatta 2520", ur: "موطا 2520", tr: "El-Muvatta 2520 — Malik: Köleler arasındaki misilleme, özgür insanlar arasındaki misilleme gibidir.", id: "Al-Muwatta 2520 — Malik: Pembalasan dendam antara budak sama seperti pembalasan dendam antara orang merdeka." }
summary:
  ar: "قال مالك: الأمر عندنا في القصاص بين المماليك كهيئة قصاص الأحرار: نفس الأمة بنفس العبد، وجرحها بجرحه. فإذا قتل العبد عبدا عمدا خُير سيد العبد المقتول: فإن شاء قتل، وإن شاء أخذ العقل فأخذ قيمة عبده. وإن شاء رب العبد القاتل أن يعطي ثمن العبد المقتول فعل، وإن شاء أسلم عبده، فإذا أسلمه فليس عليه غير ذلك. وليس لرب العبد المقتول، إذا أخذ العبد القاتل ورضي به، أن يقتله. وذلك في القصاص كله بين العبيد، في قطع اليد والرجل وأشباه ذلك، بمنزلته في القتل. {cite:muwatta-maruf-1997 p.434}"
  tr: "Malik şöyle dedi: Sistemimizdeki köleler arasındaki misilleme prosedürü, özgür insanlardakiyle aynıdır: bir erkek kölenin canına karşılık bir kadın kölenin canı, erkeğin yaralanmasına karşılık da onun yaralanması. Eğer bir köle kasten başka bir köleyi öldürürse, öldürülen kölenin efendisinin bir seçeneği vardır: onu öldürebilir veya kan parası alıp kölesinin bedelini alabilir. Katil kölenin efendisi öldürülen kölenin bedelini ödemek isterse, bunu yapabilir veya kölesini teslim edebilir. Teslim ederse, başka bir şey yapmak zorunda değildir. Öldürülen kölenin efendisi, katil köleyi alıp kabul ederse, onu öldürme hakkına sahip değildir. Bu, el veya ayak kesme ve benzeri suçlar da dahil olmak üzere, köleler arasındaki tüm misilleme durumları için geçerlidir, tıpkı cinayet için olduğu gibi. {cite:muwatta-maruf-1997 s.434}"
  id: "Malik berkata: Prosedur pembalasan antara budak dalam sistem kita sama dengan orang merdeka: nyawa budak perempuan dibalas nyawa budak laki-laki, dan luka yang dideritanya dibalas luka yang diderita budak laki-laki. Jika seorang budak dengan sengaja membunuh budak lain, tuan dari budak yang terbunuh memiliki pilihan: ia dapat membunuhnya, atau ia dapat menerima uang darah dan menerima nilai budaknya. Jika tuan dari budak pembunuh ingin membayar harga budak yang terbunuh, ia dapat melakukannya, atau ia dapat menyerahkan budaknya. Jika ia menyerahkannya, ia tidak berkewajiban untuk melakukan hal lain. Tuan dari budak yang terbunuh, jika ia mengambil budak pembunuh dan menerimanya, tidak memiliki hak untuk membunuhnya. Ini berlaku untuk semua kasus pembalasan antara budak, termasuk memotong tangan atau kaki dan pelanggaran serupa, sama seperti halnya dengan pembunuhan. {cite:muwatta-maruf-1997 p.434}"
