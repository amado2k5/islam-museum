text: "… من المسائل، إلَّا إذا قام الدليل الصحيح القاطع على خلافه، لكن ذلك لا يضره، لأنَّ ذلك من سنة اللّه في البشر أنه يخطئ ويصيب. المسألة الخامسة: عبارة الترمذي الفقهية: الألفاظ الاصطلاحية في الفقه كالمندوب، والسنة، والمكروه ونحوها، لم تكن تستعمل …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 174، يرد فيه ذكر المندوب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 174, whose wording mentions the recommended (mandub), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 174 کا اقتباس جس میں مندوب، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Tirmidhi, volume numérisé 2, p. 174, dont le texte mentionne le recommandé (mandub), le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-Tirmidhi, volumen digitalizado 2, p. 174, cuyo texto menciona lo recomendado (mandub), lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 174. sayfasından, müstehaplı ve mekruhlu fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz fiiller, itaat fiilleri, müstehaplı fiiller, mekruhlu fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 174, yang menyebutkan amalan yang dianjurkan dan yang tidak disukai; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
