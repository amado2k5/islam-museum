label: { ar: "جامع الترمذي 3423 — الأب والأبوة", en: "Jami' al-Tirmidhi 3423 — the father and fatherhood", ur: "جامع ترمذی 3423 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3423 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3423 — le père et la paternité", tr: "Cami' el-Tirmizi 3423 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3423 — Ayah dan Peran Ayah" }
text: "… الشَّافِعِيِّ وَبَعْضِ أَصْحَابِنَا. قَالَ أَبُو عِيسَى وَأَحْمَدُ لاَ يَرَاهُ وَقَالَ بَعْضُ أَهْلِ الْعِلْمِ مِنْ أَهْلِ الْكُوفَةِ وَغَيْرِهِمْ يَقُولُ هَذَا فِي صَلاَةِ التَّطَوُّعِ وَلاَ يَقُولُهُ فِي الْمَكْتُوبَةِ. سَمِعْتُ أَبَا إِسْمَاعِيلَ التِّرْمِذِيَّ مُحَمَّدَ بْنَ إِسْمَاعِيلَ بْنِ يُوسُفَ يَقُولُ سَمِعْتُ سُلَيْمَانَ بْنَ دَاوُدَ الْهَاشِمِيَّ يَقُولُ وَذَكَرَ هَذَا الْحَدِيثَ فَقَالَ هَذَا عِنْدَنَا مِثْلُ حَدِيثِ الزُّهْرِيِّ عَنْ سَالِمٍ عَنْ أَبِيهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3423، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3423 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3423، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3423 (Capítulos sobre la súplica), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3423 (Chapitres sur l'invocation), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de yer alan 3423 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3423, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
