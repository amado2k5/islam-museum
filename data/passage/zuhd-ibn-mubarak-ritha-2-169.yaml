text: "… والشهوة الخفية... إلخ. وإسناده ضعيف جداً من أجل عبد الواحد بن زيد. وانظر أيضاً مسند أحمد و سنن ابن ماجه. قوله: يا نعايا العرب، قال أبو عبيد في غريب الحديث : تأويله: انعَ العرب، يأمر بنعيهم، كأنه يقول: قد ذهبت …"
