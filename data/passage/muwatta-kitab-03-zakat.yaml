summary:
  ar: "كتاب الزكاة، الكتاب الثالث من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 129 نصاً (652–780) في ثلاثين باباً، من الصفحة 333 إلى الصفحة 384 من ملف PDF المجلد الأول. يبدأ بما تجب فيه الزكاة ونصاب الذهب والورق والمعادن والركاز، ثم ما لا زكاة فيه من الحلي وأموال اليتامى والميراث والدين والعروض والكنز، ثم صدقة الماشية والخلطاء والسخل، وأخذ الصدقة ومن يجوز له أخذها، وزكاة الثمار والحبوب والزيتون، والرقيق والخيل والعسل، وجزية أهل الكتاب والمجوس وعشور أهل الذمة، واشتراء الصدقة، ويختم بأبواب زكاة الفطر. أكثر نصوصه أقوال لمالك. {cite:muwatta-maruf-1997 p.333} {cite:muwatta-maruf-1997 p.384}"
  en: "The Book of Zakat, third book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 129 reports (652–780) in thirty babs, PDF pp. 333–384 of volume 1, mostly Malik's own rulings on thresholds, the zakat year, livestock, crops, jizya and zakat al-fitr."
