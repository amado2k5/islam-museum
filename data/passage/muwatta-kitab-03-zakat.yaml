label: { ar: "الموطأ، كتاب الزكاة", en: "Muwatta, Book of Zakat", es: "Muwatta, Libro del Zakat", fr: "Muwatta, Livre de la Zakat", ur: "موطا، کتاب زکوٰۃ", tr: "El-Muvatta, Zekat Kitabı", id: "Al-Muwatta, Kitab Zakat" }
summary:
  ar: "كتاب الزكاة، الكتاب الثالث من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 129 نصاً (652–780) في ثلاثين باباً، من الصفحة 333 إلى الصفحة 384 من ملف PDF المجلد الأول. يبدأ بما تجب فيه الزكاة ونصاب الذهب والورق والمعادن والركاز، ثم ما لا زكاة فيه من الحلي وأموال اليتامى والميراث والدين والعروض والكنز، ثم صدقة الماشية والخلطاء والسخل، وأخذ الصدقة ومن يجوز له أخذها، وزكاة الثمار والحبوب والزيتون، والرقيق والخيل والعسل، وجزية أهل الكتاب والمجوس وعشور أهل الذمة، واشتراء الصدقة، ويختم بأبواب زكاة الفطر. أكثر نصوصه أقوال لمالك. {cite:muwatta-maruf-1997 p.333} {cite:muwatta-maruf-1997 p.384}"
  en: "The Book of Zakat, third book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 129 reports (652–780) in thirty babs, PDF pp. 333–384 of volume 1, mostly Malik's own rulings on thresholds, the zakat year, livestock, crops, jizya and zakat al-fitr."
  es: "El Libro del Zakat, tercer libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 129 informes (652–780) en treinta babs, PDF pp. 333–384 del volumen 1, en su mayoría las propias decisiones de Malik sobre umbrales, el año del zakat, el ganado, los cultivos, la jizya y el zakat al-fitr."
  fr: "Le Livre de la Zakat, troisième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 129 rapports (652–780) dans trente babs, PDF pp. 333–384 du volume 1, principalement les propres décisions de Malik sur les seuils, l'année de la zakat, le bétail, les récoltes, la jizya et la zakat al-fitr."
  ur: "کتاب زکوٰۃ، یحییٰ ابن یحییٰ کی تجدید میں موطا کی تیسری کتاب ⁦(مطالعہ معارف 1997)⁩: تیس باب میں 129 رپورٹیں (652–780) جلد 1 کی پی ڈی ایف صفحہ 333–384، زیادہ تر مالک کے اپنے احکام، زکوٰۃ کی فصل، زکوٰۃ اور زکوٰۃ کی حد تک۔ فطرانہ"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği Al-Muwatta'nın üçüncü kitabı olan Zekat Kitabı, Beşar Awad Maruf'un (1997) baskısında, otuz bölümden oluşan 129 metin (652–780) içermektedir ve 1. cildin PDF dosyasının 333. sayfasından 384. sayfasına kadar uzanmaktadır. Kitap, zekâta tabi olan şeylerle ve altın, gümüş, madenler ve gömülü hazine için nisap (minimum eşik) ile başlar, ardından mücevher, yetimlerin malı, miras, borç, ticari mallar ve biriktirilmiş mallar gibi zekâttan muaf olan şeyleri ele alır. Ardından hayvancılık, karma sahiplik ve kuzu zekâtı, zekâtın toplanması ve kimlerin toplama yetkisine sahip olduğu, meyve, tahıl, zeytin, köle, at ve bal zekâtı, Kitap Ehli ve Mecusilerin cizyesi (baş vergisi), Ahd Ehli'nin zekatı ve zekât alımı konularına değinir. Ramazan sonunda verilen zekât-ı fitr ile ilgili bölümlerle sona erer. Metinlerinin çoğu Malik'in sözlerinden oluşmaktadır. {cite:muwatta-maruf-1997 s.333} {cite:muwatta-maruf-1997 s.384}"
  id: "Kitab Zakat, kitab ketiga Al-Muwatta' menurut riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997): 129 teks (652–780) dalam tiga puluh bab, dari halaman 333 hingga halaman 384 dari berkas PDF Volume 1. Kitab ini dimulai dengan apa yang dikenakan zakat dan nisab (ambang batas minimum) untuk emas, perak, mineral, dan harta karun, kemudian apa yang dikecualikan dari zakat, seperti perhiasan, harta anak yatim, warisan, hutang, barang dagangan, dan barang yang ditimbun. Kemudian dibahas zakat atas ternak, kepemilikan campuran, dan domba, pengumpulan zakat dan siapa yang diperbolehkan untuk mengumpulkannya, zakat atas buah-buahan, biji-bijian, zaitun, budak, kuda, dan madu, jizya (pajak kepala) Ahli Kitab dan Majusi, persepuluhan Ahli Perjanjian, dan pembelian zakat. Kitab ini diakhiri dengan bab-bab tentang zakat fitrah (sedekah yang diberikan di akhir Ramadan). Sebagian besar teksnya adalah hadits-hadits Malik. {cite:muwatta-maruf-1997 p.333} {cite:muwatta-maruf-1997 p.384}"
