label: { ar: "سنن ابن ماجه 4334 — دفن وقبر ومرقد", en: "Sunan Ibn Majah 4334 — a burial, grave or resting place", ur: "سنن ابن ماجہ 4334 — تدفین، قبر اور مرقد", es: "Sunan Ibn Majah 4334 — un lugar de entierro, tumba o descanso.", fr: "Sunan Ibn Majah 4334 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sunan ibn Majah 4334 — Defin, mezar ve dinlenme yeri", id: "Sunan Ibnu Majah 4334 — Pemakaman, kuburan, dan tempat peristirahatan" }
text: "… عَبْدِ الأَعْلَى، وَعَبْدُ اللَّهِ بْنُ سَعِيدٍ، وَعَلِيُّ بْنُ الْمُنْذِرِ، قَالُوا حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ مُحَارِبِ بْنِ دِثَارٍ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" الْكَوْثَرُ نَهَرٌ فِي الْجَنَّةِ حَافَتَاهُ مِنْ ذَهَبٍ مَجْرَاهُ عَلَى الْيَاقُوتِ وَالدُّرِّ تُرْبَتُهُ أَطْيَبُ مِنَ الْمِسْكِ وَمَاؤُهُ أَحْلَى مِنَ الْعَسَلِ وَأَشَدُّ بَيَاضًا مِنَ الثَّلْجِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4334، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4334 (Zuhd), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4334، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 4334 (Zuhd), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 4334 (Zuhd), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "İbn Majah'ın Sünen'inde yer alan 4334 numaralı hadiste, defin, mezar ve türbeden bahsedilmektedir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler üzerine araştırmalar yapan bir uzman tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 4334, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
