text: |-
  110
  وقال آخريصف قوسا
  انك لوشاعدتنا بالابرق * يوم نصافى كل عضب محقق
  وكل صفرامطروح ،وهق
  وزعم الخليل أن العوهق اسم جحل كان فى الزس الاول تنسب اليسه كرام التجائب
  وأنشد فى وصف ناقة
  قرواء فيها من بنات العوهق • ضرب وتصفيح كصفح الرونق
  وأماقول الراجزه يتبعن ورقا كاون العوهق * فيقال هو اظطاف الجبلىّ ويقال الغراب
  الاسودو يقال المور الذى لونه الى السوادمايكون ويقال اللازورد ويقال البعير الاسود
  الجسيم وقلت لاعراتي من بنى سليم ما العوهن فقال الطويل من الربد وأنسد
  كانى ضمنت قلاء وهقا • أقتادر -لى أوكدرًا محنقا
  يق لعيقة ساحل البحروناحيته ذكره أبو عبيد فى المصنف
  صل الغين يق الغبوق الشرب بالعشى تقول منه غبقت الرجل أغيقه
  بالضم فاغتيق هو ( دق الماء الفسدق الكثير وقد غدقت عين المابال-كسرأى
  غزرت وشاب غيدق وغيداق أى ناعم والغيداق الرجل الكريم ويقال لولد الضب
  غيداق قال أبوزيد أول حسل ثم غيداق ثم مطبج ثم يسكون ضبامدركاولم يذكرائخضرم
  بعد المطبخ وقد ذكره خلف الاسر والغياديق الحيات رق)، غرق ف الماءغرقافهو
  غرق وغارق أيضا ومنه قول أبى التجسم
  فأصبحوا فى الماء والحنادق * من بين مقتول وطاف غارق
  وأغرقه غيره وغرقه فهو مغرّق وغر يق ولجام مغرق بالفضة أى محلى والتغر يق القتل
  قال الاعشى • ألاليت قيساغزقته القوابل * وذلك أن القابلة كانت تغرق المولود
  فى ماء السلى عام القسط ذكرا كان أوأنف -تى يموت ثم جعل كل قتل تغريقا ومنه
  فول ذى الرقة
  اذا غرقت أرياضهاثى بكرة • بتيها لم تصبح رؤمأسلوبها
  والارباض الجبال والبكرة الناقة الفتسة وتفيها بطتها الثانى واغمالم تعطف على ولدها
  لمالحقها من التعب وأغرق النازع فى القوس أى استوفى مدّها والاستغراق الاستبعاب
  واغترق الفرس الخيل اذاخالطها ثم سسبها واغتراق النفس استبعابه فى الزفير واغرورقت
  عيناه دمعتا والغرقة بالضم مثل الشربة من اللبن وغيره والجمع غرق ذكره أبو عبيد فى
  المصنف وأنتد للشماخ يصف الابل
  تضحى وقد ضمنت ضرّاتهاغرقا • من ناصع اللون حلو الطعم مجهود
  والغرنيق بضم الغين وفتحالنون من طير الماءطويلى العفق قال الهذلى" بصف غواصا
  أزل كغرنيق الضجول عموج« واذا وصف بها الرجال فواحدهم غرنيق وغرنوق
  بكسر الغين وفتح الذون فيهما وغرنوق بالضم وغرائق وه والشابة الناعم والجمع الغرائق بالفتح
  والغرائيق والغرائقة ( سق الغسق أول فللمة الليل وقد غسق الليل يغسق أى أظلم
