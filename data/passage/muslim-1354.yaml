label: { ar: "مسلم 1354 — إن مكة حرمها الله", en: "Muslim 1354 — God sanctified Mecca", es: "Muslim 1354 — Dios santificó La Meca", fr: "1354 musulman — Dieu sanctifia La Mecque", ur: "مسلم 1354 - خدا نے مکہ کو مقدس کیا۔", tr: "Müslim 1354 — Allah Mekke'yi kutsal kılmıştır.", id: "Muslim 1354 — Tuhan telah menjadikan Mekah suci" }
text: "قال أبو شريح العدوي لعمرو بن سعيد: قام رسول الله الغد من يوم الفتح فحمد الله وأثنى عليه ثم قال: إن مكة حرمها الله ولم يحرمها الناس، فلا يحل لامرئ يؤمن بالله واليوم الآخر أن يسفك بها دماً ولا يعضد بها شجرة، وإنما أذن لي فيها ساعة من نهار وقد عادت حرمتها اليوم كحرمتها بالأمس"
summary:
  ar: "رواية أبي شريح العدوي في باب تحريم مكة من كتاب الحج في صحيح مسلم؛ خطبة فتح مكة في حرمتها ودمها وشجرها، وأن الإذن للنبي كان ساعة من نهار ثم عادت حرمتها."
  tr: "Sahih Müslim'deki Hac Kitabı'nın Mekke'nin kutsallığı bölümünde Ebu Şurayh el-Adavi'nin rivayeti; Mekke'nin fethi, kutsallığı, kanı ve ağaçları hakkındaki hutbe ve Peygamber'e verilen iznin günün bir saati için olduğu, daha sonra kutsallığının geri döndüğü."
  id: "Riwayat Abu Shurayh al-Adawi dalam bab tentang kesucian Mekah dari Kitab Haji dalam Sahih Muslim; khutbah tentang penaklukan Mekah, kesuciannya, darah yang berjatuhan di sana, dan pepohonannya, serta bahwa izin bagi Nabi hanya berlaku selama satu jam dalam sehari, kemudian kesuciannya kembali."
