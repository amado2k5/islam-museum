label: { ar: "مسلم 1354 — إن مكة حرمها الله", en: "Muslim 1354 — God sanctified Mecca" }
text: "قال أبو شريح العدوي لعمرو بن سعيد: قام رسول الله الغد من يوم الفتح فحمد الله وأثنى عليه ثم قال: إن مكة حرمها الله ولم يحرمها الناس، فلا يحل لامرئ يؤمن بالله واليوم الآخر أن يسفك بها دماً ولا يعضد بها شجرة، وإنما أذن لي فيها ساعة من نهار وقد عادت حرمتها اليوم كحرمتها بالأمس"
summary:
  ar: "رواية أبي شريح العدوي في باب تحريم مكة من كتاب الحج في صحيح مسلم؛ خطبة فتح مكة في حرمتها ودمها وشجرها، وأن الإذن للنبي كان ساعة من نهار ثم عادت حرمتها."
