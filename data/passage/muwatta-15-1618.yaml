label: { ar: "الموطأ 1618 — مالك في تفسير آية المجادلة في الظهار: أن يتظاهر الرجل من امرأته ثم يجمع على إمساكها وإصابتها، فإن أجمع عليه وجبت الكفارة", en: "Muwatta 1618" }
summary:
  ar: "يقول مالك في قول الله تعالى والذين يظهرون من نسائهم ثم يعودون لما قالوا، إنه سمع أن تفسير ذلك أن يتظاهر الرجل من امرأته، ثم يجمع على إمساكها وإصابتها، فإن أجمع على ذلك فقد وجبت عليه الكفارة. وإن طلقها ولم يجمع بعد تظاهره منها على إمساكها وإصابتها، فلا كفارة عليه. وإن تزوجها بعد ذلك لم يمسها حتى يكفر كفارة المتظاهر. {cite:muwatta-maruf-1997 p.70}"
