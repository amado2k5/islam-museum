label: { ar: "الموطأ 1618 — مالك في تفسير آية المجادلة في الظهار: أن يتظاهر الرجل من امرأته ثم يجمع على إمساكها وإصابتها، فإن أجمع عليه وجبت الكفارة", en: "Muwatta 1618", es: "Muwatta 1618", fr: "Muwatta 1618", ur: "موطا 1618", tr: "El-Muvatta 1618 — Malik, El-Müceddila suresindeki zihar ile ilgili ayetin tefsirinde şöyle der: Bir erkek karısına zihar ilan eder ve sonra onu yanında tutmaya ve onunla cinsel ilişkiye girmeye karar verirse, eğer böyle yapmaya karar verirse, kefaret farz olur.", id: "Al-Muwatta 1618 — Malik, dalam penafsirannya terhadap ayat Al-Mujadilah mengenai zihar: Jika seorang laki-laki menyatakan zihar terhadap istrinya dan kemudian memutuskan untuk mempertahankannya dan berhubungan badan dengannya, maka jika ia memutuskan untuk melakukannya, maka penebusan dosa menjadi wajib." }
summary:
  ar: "يقول مالك في قول الله تعالى والذين يظهرون من نسائهم ثم يعودون لما قالوا، إنه سمع أن تفسير ذلك أن يتظاهر الرجل من امرأته، ثم يجمع على إمساكها وإصابتها، فإن أجمع على ذلك فقد وجبت عليه الكفارة. وإن طلقها ولم يجمع بعد تظاهره منها على إمساكها وإصابتها، فلا كفارة عليه. وإن تزوجها بعد ذلك لم يمسها حتى يكفر كفارة المتظاهر. {cite:muwatta-maruf-1997 p.70}"
  tr: "Malik, Allah'ın \"Ve eşlerine zihar edenler ve sonra söylediklerinden vazgeçenler\" sözüyle ilgili olarak, bunun yorumunun şöyle olduğunu duyduğunu söylüyor: Bir adam karısına zihar eder, sonra onu tutmaya ve onunla cinsel ilişkiye girmeye karar verirse, eğer bunu yapmaya karar verirse, kefaret ona farzdır. Eğer onu boşayıp zihar ettikten sonra onu tutmaya ve onunla cinsel ilişkiye girmeye karar vermezse, ondan kefaret gerekmez. Eğer bundan sonra onunla evlenirse, zihar eden için gereken kefareti yerine getirmeden onunla cinsel ilişkiye giremez. {cite:muwatta-maruf-1997 s.70}"
  id: "Malik berkata mengenai firman Allah, \"Dan orang-orang yang berzikir kepada istri mereka lalu menarik kembali ucapan mereka,\" bahwa tafsiran yang ia dengar adalah bahwa seorang pria berzikir kepada istrinya, kemudian bertekad untuk mempertahankannya dan berhubungan badan dengannya. Jika ia bertekad untuk melakukannya, maka wajib baginya untuk melakukan penebusan. Jika ia menceraikannya dan tidak bertekad untuk mempertahankannya dan berhubungan badan dengannya setelah berzikir, maka tidak ada penebusan yang diwajibkan baginya. Jika ia menikahinya setelah itu, ia tidak boleh berhubungan badan dengannya sampai ia melakukan penebusan bagi orang yang berzikir. {cite:muwatta-maruf-1997 p.70}"
