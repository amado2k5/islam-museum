label: { ar: "الموطأ 1982 — مالك: من اشترى بقعة أرض فبنى فيها دارا أو نسج الغزل ثوبا ثم أفلس، فلرب البقعة أن يأخذها بما فيها من البنيان ليس له ذلك، بل تقوم البقعة وما أصلحه المشتري، ويكونان شريكين فيها", en: "Muwatta 1982" }
summary:
  ar: "قال مالك: ومن اشترى سلعة من السلع، غزلا أو متاعا أو بقعة من الأرض، ثم أحدث في ذلك المشتري عملا، بنى البقعة دارا، أو نسج الغزل ثوبا، ثم أفلس الذي ابتاع ذلك، فقال رب البقعة: أنا آخذ البقعة وما فيها من البنيان، إن ذلك ليس له، ولكن تقوم البقعة وما فيها مما أصلح المشتري، ثم ينظر كم ثمن البقعة؟ وكم ثمن البنيان من تلك القيمة؟ ثم يكونان شريكين في ذلك، لصاحب البقعة بقدر حصته، ويكون للغرماء بقدر حصة البنيان. {cite:muwatta-maruf-1997 p.211} {cite:muwatta-maruf-1997 p.212}"
