label: { ar: "الموطأ 1982 — مالك: من اشترى بقعة أرض فبنى فيها دارا أو نسج الغزل ثوبا ثم أفلس، فلرب البقعة أن يأخذها بما فيها من البنيان ليس له ذلك، بل تقوم البقعة وما أصلحه المشتري، ويكونان شريكين فيها", en: "Muwatta 1982", es: "Muwatta 1982", fr: "Muwatta 1982", ur: "موطا 1982", tr: "Al-Muwatta 1982 — Malik: Eğer birisi bir arsa satın alıp üzerine ev inşa eder veya iplikten giysi dokursa ve sonra iflas ederse, arsanın sahibi arsayı üzerindeki binayla birlikte geri alamaz. Aksine, arsa ve alıcının onardığı kısımlar değerlenir ve ortak olurlar.", id: "Al-Muwatta 1982 — Malik: Jika seseorang membeli sebidang tanah dan membangun rumah di atasnya atau menenun benang menjadi pakaian, kemudian bangkrut, pemilik tanah tidak dapat mengambilnya kembali beserta bangunan di atasnya. Sebaliknya, tanah dan apa yang diperbaiki oleh pembeli dinilai, dan mereka menjadi mitra dalam hal itu." }
summary:
  ar: "قال مالك: ومن اشترى سلعة من السلع، غزلا أو متاعا أو بقعة من الأرض، ثم أحدث في ذلك المشتري عملا، بنى البقعة دارا، أو نسج الغزل ثوبا، ثم أفلس الذي ابتاع ذلك، فقال رب البقعة: أنا آخذ البقعة وما فيها من البنيان، إن ذلك ليس له، ولكن تقوم البقعة وما فيها مما أصلح المشتري، ثم ينظر كم ثمن البقعة؟ وكم ثمن البنيان من تلك القيمة؟ ثم يكونان شريكين في ذلك، لصاحب البقعة بقدر حصته، ويكون للغرماء بقدر حصة البنيان. {cite:muwatta-maruf-1997 p.211} {cite:muwatta-maruf-1997 p.212}"
  tr: "Malik şöyle dedi: Eğer birisi iplik, mal veya arsa gibi bir mal satın alır ve sonra üzerinde çalışırsa—örneğin, arsaya bir ev inşa ederse veya iplikten bir giysi dokursa—ve daha sonra alıcı iflas ederse ve arsa sahibi, \"Arsayı ve üzerindeki binayı alacağım\" derse, bu onun hakkı değildir. Aksine, arsa ve alıcı tarafından yapılan iyileştirmeler değerlendirilmelidir. Daha sonra, arsanın ve binanın değeri belirlenmelidir. Ardından, bu değerde ortak olmalı, arsa sahibi payını almalı ve alacaklılar da binadaki paylarını almalıdır. {cite:muwatta-maruf-1997 s.211} {cite:muwatta-maruf-1997 s.212}"
  id: "Malik berkata: Jika seseorang membeli suatu komoditas, seperti benang, barang, atau sebidang tanah, dan kemudian mengolahnya—misalnya, membangun rumah di atas tanah tersebut atau menenun pakaian dari benang—dan kemudian pembeli tersebut bangkrut, dan pemilik tanah tersebut berkata, \"Saya akan mengambil tanah dan bangunan di atasnya,\" itu bukanlah haknya. Sebaliknya, tanah dan perbaikan yang dilakukan oleh pembeli harus dinilai. Kemudian, nilai tanah dan bangunan tersebut harus ditentukan. Mereka kemudian harus menjadi mitra dalam nilai tersebut, dengan pemilik tanah menerima bagiannya dan para kreditur menerima bagian mereka dari bangunan tersebut. {cite:muwatta-maruf-1997 p.211} {cite:muwatta-maruf-1997 p.212}"
