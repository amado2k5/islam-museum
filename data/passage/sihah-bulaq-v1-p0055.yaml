text: |-
  ( ١ ا بيت كما فى نشطة
  الا يهجننك ان ترى لمجاشع
  جاد الرجال وفى الفؤاد انلحولع
  ٥٨٦
  ⁦(باب المين)⁩
  الالبتين اذا كان منفكهما وغلام خليع بين الخلاعة بالفتح وهو الذى قد خلعه أهلد فان جف
  لم يطلبوا بجنايته وانخليع الصياد والقدح الذى لا يفوذا ولا والغول والذتب وقوله-م به
  خواع وخيلع أى فزع يعترى فؤاده كانه مس ومنه قول جرير وفى القؤادانلواح
  والتخليع فى باب العروص قطع مستفعان فى عروض المسيط وضريه جمعافينقل الى
  مفعوان ويسمى البيت مخلعا كقول الشاءر
  ماهيج الشوق من اطلال • أضحت قفارا كوحى الواحى
  ⁦( خمع)⁩ خع فى مشنيته أى ظلع ويد خاع أى ظاع وانظامعة الضبع لانها تخمع اذا مشت
  والجمع بالمكسر الذب واللص خنع لطنوع كالخضوع والذل وأخنعتنى اليك الحاجة
  أى أخضعتنى والخانع المريب الفاجر واللحنعة الربية ومنه قول الاعشى
  ولا يرون الى جاراتهم خنعا وخماعة بالضم أبو قبيلة وهو خناعة بن سعدين هذيل بن مدركة
  ابن الياس بن مضر خوع لفوع جبل أبيض قال رؤبة يصف تورا
  كما بلوح الخوع بين الاجبال
  والموع منعرح الوادى والتخوّع التنقص وخوّع
  نه أى نقص قال الشاءر ( رف ة
  وجامل خوع من نيبه • زجر المعلى أصلا والسفيح
  ويروى خوف والمعنى واحد ويروى من بيته قال ابن السكيت يقال جاء السيل فخوع
  لوادى اذا كسر جنبثيه قال حيدين ثور
  ألنت عليه ديمة بعدوابل * فللجزع من خوع السيول قسيب
  صل الدال رع ) درع الحديد مونقة وابجمع القليل أدرع وادراع فاذا كثرت
  فهى الدروع وتصغير هادريع على غيرقياس لان قياسه بالهاء وحكى أبو عبيدمعمرمن
  المثى ان الدرع يذكّرويؤنت قال أبو الاخزر مقلص ا بالدرع ذى التفضن ودرع المرأة
  قيصها وهو مذ كروالبهع ادراع تقول.نه ادرعت المرأة وه وافتعلت ودرعتها انا تدريعا
  اذا ألبستها اياه وقولهمم شمر ذيلا وادرع ليلاأى استعمل الحزم واتخذ الليل جملا والمدرع
  والمدرعة واحد والدرّاعة واحدة الدراريع وادّرع الرجل لبس الدرع قال الشاءر
  ان قلق عمرافقد لاقيت مقرعا * وليس من همم إبل ولاشاء
  وتدع اى لبس الدرع والمدرعة أيضا وربما قالو اتدرع اذ البس المدرعة وهى لغة ضعيقة
  والادرع من الخيل والشاءما اسودرأسه وابيض سائره والانثى درعاء ومنسه قبل املاث
  ليال من ليالى الشهر اللاتى يلين البيض درع مثال صرد لاسودادأ وائلها وابيضاض
  سائرها على غير قياس لان قياسه درع بالتسكين لان واحد تها درعاء ورجل دارع أى عليه.
  درع كانه ذودرع مثل لابن وتامر والاندراع التقدم فى السير رقع) أبوزيددرقع
  الرجل درقعة اذافر واسرع فهومدرقع ومدرنقع ⁦(دسع)⁩ الدسع الدفع يقال
  دسعه يدسعه دسعا ود سيعة ودسع البعير يجرته آى دفعها -تى أخرجها من جوفه الى فيه
  والدسيعة العطية يقال فلان ضخم الدسيعة وفى الحديث ألم أجعلك تربع وتدسع أى تأخذ
  المرباع وتعطى الجزيل والدسيعة الطبيعة واللخلق والدسيع مغرز العنق فى الكاه-ل قال
  سلامة
