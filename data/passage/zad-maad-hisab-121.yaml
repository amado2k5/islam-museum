text: "… ولو بِشِقٍّ مِنْ تَمْرَةٍ، فَلْيَفْعَل، ومن لَمْ يَجد، فَبِكَلِمَةٍ طَيِّبةٍ، فَإِنَّ بِهَا تُجْزِى الحَسنةُ بِعَشْر أَمْثَالِها إلى سبعمئة ضِعف، والسلام عليكم ورحمة اللَّه وبركاته [ابن هشام ٢٨١] . قال ابن إسحاق : ثم خطب رسولُ اللَّه لَا خِ مرة أخرى، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 121، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 121, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 121 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
