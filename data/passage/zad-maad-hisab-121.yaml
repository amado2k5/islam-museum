  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin 121. sayfasında, iyi amellerin çoğaltılmasından bahseden bir pasaj; alıntılanan versiyondan alınmıştır ve kaynakların politikasına göre metin yaklaşık kırk kelimeyle özetlenmiştir."
