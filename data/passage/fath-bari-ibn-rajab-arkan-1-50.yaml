text: "… وَأَنْ يَكْرَهَ أَنْ يَعُودَ فِي الْكُفْرِ كَمَا يَكْرَهُ أَنْ يُقْذَفَ فِي النَّارِ. وقد خَرَّجهُ مُسلمٌ وعنده في روايةِ: فقدْ وجدَ طعمَ الإيمانِ، وجاءَ في روايةٍ: وجدَ طعمَ الإيمانِ وحلاوتَهُ. فهذه الثلاثُ خصال من أعلَى خصال الإيمان، فمن كملها فقد وجدَ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 50، يذكر حلاوة الإيمان وكماله، وخصال المؤمن، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 50, that mentions the sweetness and completeness of faith, the traits of the believer, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 50 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، مومن کی خصلتیں، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 50, que menciona la dulzura y la plenitud de la fe, las características del creyente, rasgos que, presentes en una persona, caracterizan la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 1, p. 50) évoquant la douceur et la plénitude de la foi, ainsi que les qualités du croyant, qualités qui, chez une personne, témoignent de sa foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. resimli cildinin 50. sayfasından, imanın tatlılığı ve mükemmelliği, müminin özellikleri ve bu özelliklere sahip olanların özelliklerinden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, jilid 1 bergambar, halaman 50, yang menyebutkan manisnya dan kesempurnaan iman, ciri-ciri seorang mukmin, dan ciri-ciri orang yang memilikinya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin."
