text: "… الْمُنْكَدِرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ السَّلَمِيِّ، أَنَّ أَعْرَابِيًّا، بَايَعَ رَسُولَ اللَّهِ عَلَى الإِسْلاَمِ، فَأَصَابَ الأَعْرَابِيَّ وَعْكٌ بِالْمَدِينَةِ، فَجَاءَ الأَعْرَابِيُّ إِلَى رَسُولِ اللَّهِ فَقَالَ يَا رَسُولَ اللَّهِ أَقِلْنِي بَيْعَتِي. فَأَبَى رَسُولُ اللَّهِ ثُمَّ جَاءَهُ فَقَالَ أَقِلْنِي بَيْعَتِي. فَأَبَى ثُمَّ جَاءَهُ فَقَالَ أَقِلْنِي بَيْعَتِي. فَأَبَى فَخَرَجَ الأَعْرَابِيُّ فَقَالَ رَسُولُ اللَّهِ \" إِنَّمَا الْمَدِينَةُ كَالْكِيرِ، تَنْفِي خَبَثَهَا، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7322، يذكر الحمى والوعك. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7322 (Holding Fast to the Qur'an and Sunnah), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7322، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
