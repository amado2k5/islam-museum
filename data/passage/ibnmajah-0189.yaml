label:
  ar: "ابن ماجه 189 — إن رحمتي سبقت غضبي"
  en: "Ibn Majah 189 — My mercy outstrips My anger"
  ur: "ابن ماجہ 189 — میری رحمت میرے غضب پر سبقت لے گئی"
text: "كتب ربكم على نفسه بيده قبل أن يخلق الخلق رحمتي سبقت غضبي ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 189: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 189: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 189: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
