label: { ar: "صحيح البخاري 5704 — الحجامة، الكي", en: "Sahih al-Bukhari 5704 — cupping; cautery", ur: "صحیح بخاری 5704 — حجامہ، داغنا" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، هِشَامُ بْنُ عَبْدِ الْمَلِكِ حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ سُلَيْمَانَ بْنِ الْغَسِيلِ، حَدَّثَنَا عَاصِمُ بْنُ عُمَرَ بْنِ قَتَادَةَ، قَالَ سَمِعْتُ جَابِرًا، عَنِ النَّبِيِّ قَالَ \" إِنْ كَانَ فِي شَىْءٍ مِنْ أَدْوِيَتِكُمْ شِفَاءٌ فَفِي شَرْطَةِ مِحْجَمٍ أَوْ لَذْعَةٍ بِنَارٍ، وَمَا أُحِبُّ أَنْ أَكْتَوِيَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5704، يذكر الحجامة، والكي، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5704 (Medicine), that mentions cupping, cautery, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5704، جس میں حجامہ، داغنا، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
