text: "… منهاج الشعراء. وكان بينه وبين أبي العَتَاهية مُهَاجاة. وكان أبو نُواس يُثْني على شِعره. ولما مات والبة رثاه أبو نُواس. - وَرْش المقريء. عثمان بن سعيد بن عبد اللّٰه بن عَمْرو بن سليمان. وقيل: عثمان بن سعيد بن عديّ بن …"
