label: { ar: "سنن أبي داود 4202 — كتابة الحسنات، محو السيئات وحط الخطايا", en: "Sunan Abi Dawud 4202 — the writing of good deeds; bad deeds erased and sins shed", ur: "سنن ابی داؤد 4202 — نیکیوں کا لکھا جانا، برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… - عَنِ ابْنِ عَجْلاَنَ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ تَنْتِفُوا الشَّيْبَ مَا مِنْ مُسْلِمٍ يَشِيبُ شَيْبَةً فِي الإِسْلاَمِ \". قَالَ عَنْ سُفْيَانَ \" إِلاَّ كَانَتْ لَهُ نُورًا يَوْمَ الْقِيَامَةِ \". وَقَالَ فِي حَدِيثِ يَحْيَى \" إِلاَّ كَتَبَ اللَّهُ لَهُ بِهَا حَسَنَةً وَحَطَّ عَنْهُ بِهَا خَطِيئَةً \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4202، يذكر كتابة الحسنات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 4202 (Combing the Hair (Kitab Al-Tarajjul)), that speaks of the writing of good deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 4202، جس میں نیکیوں کا لکھا جانا، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
