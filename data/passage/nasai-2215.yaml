label:
  ar: "النسائي 2215 — الصوم لي وأنا أجزي به"
  en: "Nasa'i 2215 — Fasting is Mine, and I reward it"
  ur: "نسائی 2215 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "ما من حسنة عملها ابن آدم إلا كتب له عشر حسنات إلى سبعمائة ضعف قال الله عز وجل إلا الصيام فإنه لي وأنا أجزي به يدع شهوته وطعامه من أجلي الصيام جنة للصائم فرحتان فرحة عند فطره وفرحة عند لقاء …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 2215: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 2215: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 2215: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
