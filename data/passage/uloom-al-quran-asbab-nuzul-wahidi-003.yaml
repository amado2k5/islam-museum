text: "لخطاب رضي الله عنه فقال: يا أمير المؤمنين إنكم تقرءون آية. في كتابكم لو علينا معشر اليهود نزلت لا تخذنا ذلك اليوم عيدا، فقال: أي آية هي؟ قال: (اليوم أكملت لكم دينكم وأتممت عليكم نعمتي) فقال عمر: والله إني لأعلم"
