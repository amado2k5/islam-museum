label: { ar: "الموطأ 1113 — ابن عمر: كان إذا طعن في سنام هديه وهو يشعره قال: بسم الله، والله أكبر", en: "Muwatta 1113", es: "Muwatta 1113", fr: "Muwatta 1113", ur: "موطا 1113", tr: "El-Muvatta 1113 — İbn Ömer: Kurbanlık hayvanının hörgüç kısmını işaretlerken, “Allah’ın adıyla, Allah en büyüktür” derdi.", id: "Al-Muwatta 1113 — Ibn Umar: Ketika ia menusuk punuk hewan kurbannya saat menandainya, ia mengucapkan: “Dengan nama Allah, dan Allah Maha Besar.”" }
text: "بسم الله، والله أكبر"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان إذا طعن في سنام هديه وهو يشعره قال: بسم الله، والله أكبر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1207) وسويد (524). {cite:muwatta-maruf-1997 p.510}"
  tr: "Malik, Nafi'den rivayet ettiğine göre, Abdullah ibn Umar, kurbanlık hayvanının hörgücünü delerken ve işaretlerken, \"Allah'ın adıyla, Allah en büyüktür\" derdi. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1207) ve Suveyd (524) tarafından da nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.510}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar, ketika menusuk punuk hewan kurbannya untuk menandainya, mengucapkan: “Dengan nama Allah, dan Allah Maha Besar.” Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus’ab (1207) dan Suwaid (524). {cite:muwatta-maruf-1997 p.510}"
