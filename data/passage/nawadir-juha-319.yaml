label: { ar: "نوادر جحا الكبرى، ص 157 — «لا تؤاخذه فقد خاف من أصوات المدافع»", en: "Nawadir Juha al-Kubra, p. 157 — 'Do Not Blame Him, He Was Frightened by the Sound of Cannons'", ur: "نوادر جحا الکبریٰ، ص 157 — «اسے ملامت نہ کریں، وہ توپوں کی آوازوں سے ڈر گیا ہے»", fr: "Nawadir Juha al-Kubra, p. 157 — « Ne le blâmez pas, il a eu peur du bruit des canons »", es: "Nawadir Juha al-Kubra, p. 157 — «No lo culpen, se asustó con el sonido de los cañones»", tr: "Juha'nın Büyük Fıkraları, s. 157 — “Onu suçlamayın, çünkü top seslerinden korkuyordu.”", id: "Anekdot Hebat Juha, hlm. 157 — “Jangan salahkan dia, karena dia takut akan suara meriam.”" }
text: "… لا تؤاخذْهُ فقد خاف من أصوات المدافع كان تيمورلنك وأشراف بلدة آقَ شَهْرٌ وأمراؤُهُ وعساكره جالسين، ذات يوم، في مجلس يتحادثون، فقام أحد المُجاهدين العثمانيِّين، وأخذ يقول: لقد أطلقنا في حرب كذا، كذا وكذا مدفعاً، وحارَبْنا كذا وكذا وقعةً، ولحقنا …"
summary:
  ar: "في مجلس تفاخر محارب عثماني بانتصاراته ومنها على بلغاريا والصليبيين عند نيكوبوليس، وادعى ضابط تيمور لنكي أنهم أطلقوا المدافع في أنقرة، فأطلق طفل ريحاً بصوت عال، فقال جحا إن الطفل خائف من أصوات المدافع. {cite:juha-nawadir-kubra-djuwaydi p. 157}"
  en: "At a gathering, an Ottoman warrior boasts of victories including over Bulgaria and the Crusaders at Nicopolis; a Timurid officer claims they fired guns at Ankara; a child breaks wind loudly; Juha says the child is frightened by cannon sounds. {cite:juha-nawadir-kubra-djuwaydi p. 157}"
  ur: "ایک مجلس میں ایک عثمانی سپاہی نے اپنی فتوحات پر فخر کیا، جن میں بلغاریہ اور نیکوپولس کے صلیبیوں پر فتح شامل تھی، ایک تیمور لنگی افسر نے دعویٰ کیا کہ انہوں نے انقرہ میں توپیں چلائی تھیں، اتنے میں ایک بچے نے زور سے ہوا خارج کی، تو جحا نے کہا کہ بچہ توپوں کی آوازوں سے ڈرا ہوا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 157}"
  fr: "Lors d'une réunion, un guerrier ottoman se vante de ses victoires, notamment sur la Bulgarie et sur les croisés à Nicopolis ; un officier timouride prétend qu'on a tiré le canon à Ankara ; un enfant lâche un vent bruyant ; Juha dit que l'enfant est effrayé par le bruit des canons. {cite:juha-nawadir-kubra-djuwaydi p. 157}"
  es: "En una reunión, un guerrero otomano presume de sus victorias, entre ellas sobre Bulgaria y sobre los cruzados en Nicópolis; un oficial timúrida afirma que dispararon los cañones en Ankara; un niño suelta un ventoso sonoro; Juha dice que el niño está asustado por el sonido de los cañones. {cite:juha-nawadir-kubra-djuwaydi p. 157}"
  tr: "Bir toplantıda, bir Osmanlı savaşçısı, Bulgaristan ve Nikopolis'teki Haçlılara karşı kazandığı zaferler de dahil olmak üzere, zaferleriyle övündü. Bir Timurlu subay, Ankara'da top atışı yaptıklarını iddia etti; bunun üzerine bir çocuk yüksek sesle osurdu. Juha, çocuğun top seslerinden korktuğunu belirtti. {cite:juha-nawadir-kubra-djuwaydi s. 157}"
  id: "Dalam sebuah pertemuan, seorang prajurit Ottoman membual tentang kemenangannya, termasuk kemenangan atas Bulgaria dan Tentara Salib di Nicopolis. Seorang perwira Timurid mengklaim bahwa mereka telah menembakkan meriam di Ankara, kemudian seorang anak kentut dengan keras. Juha berkomentar bahwa anak itu ketakutan oleh suara meriam. {cite:juha-nawadir-kubra-djuwaydi p. 157}"
