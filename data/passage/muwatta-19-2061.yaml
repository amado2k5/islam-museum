label: { ar: "الموطأ 2061 — مالك: من ساقى ثمرا في أصل قبل أن يبدو صلاحه ويحل بيعه، فتلك المساقاة بعينها جائزة", en: "Muwatta 2061", es: "Muwatta 2061", fr: "Muwatta 2061", ur: "موطا 2061", tr: "El-Muvatta 2061 — Malik: Meyve henüz olgunlaşmadan ve satılması caiz hale gelmeden önce bir ağaçta meyve yetiştirme sözleşmesi yapan kimsenin bu sözleşmesi caizdir.", id: "Al-Muwatta 2061 — Malik: Barang siapa yang mengadakan perjanjian untuk menanam buah pada pohon sebelum buah tersebut matang dan halal untuk dijual, maka perjanjian tersebut halal." }
summary:
  ar: "قال مالك: ومن ساقى ثمرا في أصل قبل أن يبدو صلاحه ويحل بيعه، فتلك المساقاة بعينها جائزة. {cite:muwatta-maruf-1997 p.243}"
  tr: "Malik şöyle dedi: Eğer bir kimse, meyve henüz olgunlaşmadan ve satılabilir hale gelmeden önce ağaçta meyve yetiştirmek için sözleşme yaparsa, bu sözleşme caizdir. {cite:muwatta-maruf-1997 s.243}"
  id: "Malik berkata: Jika seseorang membuat perjanjian untuk membudidayakan buah pada pohon sebelum buah tersebut matang dan dapat dijual, maka perjanjian tersebut diperbolehkan. {cite:muwatta-maruf-1997 p.243}"
