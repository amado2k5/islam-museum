label: { ar: "سنن أبي داود 4971 — الأب والأبوة", en: "Sunan Abi Dawud 4971 — the father and fatherhood", ur: "سنن ابی داؤد 4971 — باپ اور والدیت", es: "Sunan Abi Dawud 4971 — El padre y la paternidad", fr: "Sunan Abi Dawud 4971 — le père et la paternité", tr: "Sunan Abi Dawud 4971 — Baba ve Babalık", id: "Sunan Abi Dawud 4971 — Sang Ayah dan Peran Ayah" }
text: "… حَيْوَةُ بْنُ شُرَيْحٍ الْحَضْرَمِيُّ، - إِمَامُ مَسْجِدِ حِمْصٍ - حَدَّثَنَا بَقِيَّةُ بْنُ الْوَلِيدِ، عَنْ ضُبَارَةَ بْنِ مَالِكٍ الْحَضْرَمِيِّ، عَنْ أَبِيهِ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، عَنْ سُفْيَانَ بْنِ أَسِيدٍ الْحَضْرَمِيِّ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" كَبُرَتْ خِيَانَةً أَنْ تُحَدِّثَ أَخَاكَ حَدِيثًا هُوَ لَكَ بِهِ مُصَدِّقٌ وَأَنْتَ لَهُ بِهِ كَاذِبٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4971، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4971 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4971، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4971 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4971 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4971 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4971, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
