text: "… أو منازل السائرين إلى اللّٰه أو مقامات العارفين أو غير ذلك كلها فيها مما فرضه اللّٰه ورسوله، فهو من الإيمان الواجب، وفيها ما أحبه ولم يفرضه، فهو من الإيمان المستحب. فالأول لا بد لكل مؤمن منه ومن اقتصر عليه فهو …"
