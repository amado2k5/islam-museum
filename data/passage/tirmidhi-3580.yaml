label:
  ar: "الترمذي 3580 — إن عبدي كل عبدي الذي يذكرني وهو ملاق قرنه"
  en: "Tirmidhi 3580 — My true servant is the one who remembers Me as he meets his foe"
  ur: "ترمذی 3580 — میرا پورا بندہ وہ ہے جو دشمن سے مقابلے کے وقت مجھے یاد کرے"
text: "إن الله عز وجل يقول إن عبدي كل عبدي الذي يذكرني وهو ملاق قرنه . يعني عند القتال . قال هذا حديث غريب لا نعرفه إلا من هذا الوجه ليس إسناده بالقوي . - ولا نعرف لعمارة بن زعكرة عن …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3580: إن عبدي كل عبدي الذي يذكرني وهو ملاق قرنه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3580: My true servant is the one who remembers Me as he meets his foe. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3580: میرا پورا بندہ وہ ہے جو دشمن سے مقابلے کے وقت مجھے یاد کرے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
