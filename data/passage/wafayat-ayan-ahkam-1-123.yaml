text: "… ذكره إن شاء اللّٰه تعالى. وأفضى الملك إلى ولده أبي الحسن علي بن يوسف، وكان رجلا حليماً وقوراً صالحاً عدلاً منقاداً للحقّ والعلماء، تجى إليه الأموال من البلاد، لم يزعزعه عن سريره قط حادث ولا طاف به مكروه - قلت …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 123، يرد فيه ذكر المكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 123, whose wording mentions the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 123 کا اقتباس جس میں مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
