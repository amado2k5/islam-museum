  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 1. cildinin 123. sayfasından bir alıntı, mekruh (hoş görülmeyen) şeylerden bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar üzerine araştırma yapan bir kişi tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Khallikan \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka), Jilid 1, halaman 123, menyebutkan apa yang makruh (tidak disukai); ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Kitab ini disusun oleh seorang peneliti tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
