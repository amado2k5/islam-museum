label: { ar: "الموطأ 2839 — عامر بن عبد الله بن الزبير: إذا سمع الرعد ترك الحديث وقال سبحان الذي يسبح الرعد بحمده", en: "Muwatta 2839", es: "Muwatta 2839", fr: "Muwatta 2839", ur: "موطا 2839", tr: "El-Muvatta 2839 — Emir ibn Abdullah ibn el-Zübeyr: Gök gürlemesini duyduğunda konuşmayı bırakır ve şöyle derdi: “Gök gürlemesinin övgüyle yücelttiği Allah’a hamd olsun.”", id: "Al-Muwatta 2839 — Amir ibn Abdullah ibn al-Zubayr: Ketika ia mendengar guntur, ia akan berhenti berbicara dan berkata, “Maha Suci Dia yang dimuliakan oleh guntur dengan pujian.”" }
summary:
  ar: "يروي مالك عن عامر بن عبد الله بن الزبير أنه كان إذا سمع الرعد ترك الحديث وقال: سبحان الذي يسبح الرعد بحمده والملائكة من خيفته. ثم يقول: إن هذا لوعيد شديد لأهل الأرض. {cite:muwatta-maruf-1997 p.591} {cite:muwatta-maruf-1997 p.592}"
  tr: "Malik, 'Amir ibn 'Abdullah ibn al-Zubayr'den rivayet eder ki, gök gürlemesini duyduğunda konuşmayı bırakır ve şöyle derdi: \"Gök gürlemesinin övgüyle yücelttiği ve meleklerin O'ndan korktuğu Allah'a hamd olsun.\" Sonra da şöyle derdi: \"Şüphesiz bu, yeryüzündeki insanlar için şiddetli bir uyarıdır.\" {cite:muwatta-maruf-1997 s.591} {cite:muwatta-maruf-1997 s.592}"
  id: "Malik meriwayatkan dari 'Amir ibn 'Abdullah ibn al-Zubayr bahwa ketika ia mendengar guntur, ia akan berhenti berbicara dan berkata: \"Maha Suci Dia yang dipuji oleh guntur, dan para malaikat karena takut kepada-Nya.\" Kemudian ia akan berkata: \"Sesungguhnya ini adalah peringatan yang keras bagi penduduk bumi.\" {cite:muwatta-maruf-1997 p.591} {cite:muwatta-maruf-1997 p.592}"
