text: |-
  ٦٠٤
  منههاصدعة ورجل صدع بالتسكين وقديحرك وه والضرب الخفيف اللحم الشاب فأما
  الوعل ذلايقا فيه الاصدع بالتحريك وه والوسط منها ليس بالعظيم ولا الصغير واكنه
  وعل بين و علين وكذلك هو من الطباء والمر قال الراجز
  يارب أبازمن العفر مدع * تقبض الذئب اليه واجتمع
  قال رأيت بين القوم صدعات أى تفترقافى الرأى والهوى ( رع صارعته ضر عته
  صرعاو صرعا الفتح لتميم والكسر لقيس عن يعقوب والمصرع مكان ومصدرقال الشاعر
  بعصرعنا النعمان يوم تأليت • علينا غيم من تظاوصيم
  والصرعة م:-ل الركبوالحلسة يقال سوء الاستم الخير من حسن الصرعة ورجل
  صرعة مثال همزة أى يصرع الناس كثير اور جل صريع منال فسيق كثير الصرع لا قرانه
  والصرع علة معروفة والصرع أيضاوا-دالصمروع وهى الضروب والفنون ومررن
  بقتلى مصرّعين شدد للكثرة والتصريع فى الشعر تقفية المصراع الاول وهو مأخوذ من
  مصراع الباب وهما مصراعان والصرعان الغداة والعشىّ من غا و: الى انتصاف النهار
  صرع بالفعح ومن انتصاف النهار الى-قوط القرص صرع يقال أتتمه صرعى النها
  أى غدوة وعشية قال ذوالرمة
  كاننى نازع يثنيه من وطن • صرءن راحع قل وتقييد
  والصرعان ابلان ترد إ-داهم احين تصدر الاخرى الكثرتها والصرهان بالكسر المثاان
  يقال هماصرعان وشرعان وحتنان وقتلان كله بعنى ١ يقال أيضاما لبت مرفلان
  حاجة فانصرفت وما أدرى على أى صرعى أمره هو أى لم يبين لى أمره قال يعقوب وأنشدتى
  الكلابى فرحت وماودءت ليلي ومادرت * على أى صرعى أمرها أترقح
  يعنى أواصلاترو-ت من عندها أم قاطعا والصريع السوط أوالقوس الذى لم ينحت منه
  شى و:قال الذى جف عوده=-لى الشجر صعع صعصعته محصعة وصعصاعا
  نتصعمع مشل زعزعته قتزعز ع أى فرقته فترق وذهبت الابل معاصع أى نادة متة رقه
  ومعصمة أيوقسيلة من هوازن وهو صعصعة بن معاوية بن بكرين دوازن فع لصفع
  كلمة مولدة والرجل صفعان ⁦( قع)⁩ المقع بالضم الناحية ويقال ما أدرى أين مقع أى
  ذهب وفلان من أهل هذا القع أى من هذه الناحية وقول أوس من لحىّ مفرد صمع
  قال ابن الاءرابن هوالمتنهى وتدصقع أى عدل عن الطريق وصقعت البترأيضاتصقع من تمعا
  أى انهارت عن أبى عبيدوااه قع أيضا كالغم ياخذ بالنفس من شدّة الحرّقال سويدبن أبى
  كاهل يأخذ السائرفيها الصقع والصقعا الشهس قالت ابنة أبى الاسود الدؤلى لابيها
  فى يوم شديد الحر يا أيت ما أشة الحر قال اذا كانت الصقعا من فوقك والرمضاء من تحتك
  فقالت أردت انّ الحرشديد قال فة ولى اذن ما أشد الحر فخيننذوفع باب انتحجب والصقاع
  خرقة تت جا المرأخار«ا من الدهن وربماقيل للبرقع صقاع والصماع أيضانى يشدبه
  أنف الذافة وقد فسرناه فى درج فى ياب الجيم قال اقطامى
  اذا رأس رأيت بطماحا * شددث له الغمائم والصقاعا
  والاصقع
