text: "… للامام البخارى، وهو يتناولُ ناحية الخُلُق الإنسانىّ فى نظام الإسلام، وهذه الناحية - بعد تصحيح التوحيد - أوثقُ نواحى هذا النظام، لأنها تعين على إخلاص النيّات والسرائر، والنياتُ مِعيارُ الأعمال التى تصدر عنها ويقف بها المسلم بين يدى اللّٰه سبحانه …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 3، يرد فيه ذكر فرض العين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
