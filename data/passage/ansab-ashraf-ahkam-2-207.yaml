text: "قومى، فأنا أسيح فى الأرض فأعبد ربى. فقال أبن الدغينة: مثلك، يا أبا بكر، لا يخرج ولا يخرُج، إنك تكسب المعدوم، وتصل الرحم، وتحمل الكلّ، وتقرى الضيف، وتعين على نوائب الحقوق. فأنا لك جار. فارجع. وأتى ابن الدغينة قريشاً، فقال …"
