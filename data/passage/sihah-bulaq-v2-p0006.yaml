text: |-
  •(باب الااف اللينة
  ٥٨١
  لتى قوافيها على الياءياوية وياحرف ينادى به القريب والبعيد تقول ياز يدأقبل وقول
  الراجز * بالك من قبرة بععمر فهى كلمة تتجب وأماقوله تعالى ألاياا-يجد والله بالتخفيف
  فالمعنى ألا يا هولا اسحدوا فحذف المنادى اكْتفا بجرف النسداء كماحذف سرف النعداء
  اكتفاء بالمنادى فى قوله تعالى يوسف أعرض عن هذا اذا كان المراد معلوما
  وقال بعضهم ان يا فى هذا الموضع انماه وللتغبيه كانه قال ألا اسجدوا
  فلادخل علبه باللتنبيه سقطت الالف التى فى اسجدوا
  لا نها ألف وصل وذهبت الالف التى فى يا
  لاحتماع الساكنين لانهاوالسين
  ما كنتان قال
  ذوالرقة
  ألايا اسلى يادارمى على البلى • ولا زال منهلا بجرعائك القطر
  * ال منهى تصميح دار الطباعه * جل القه بالكمال طباعه
  أحدك اللهتمّ اذجعلت صحاح جوهر الحد يتتفام به الكلام وتسموبه عقود الالفاظ الى سما
  التمام ويقذف به شبطان الخطامن كل جانب وتنال به أسى المطالب وأصلى وأسلم على
  النىّ الاقى المصطفى العربىّ الهاشمىّ أفصح من نطق بالضاد وأوتى جوامع الكام
  وأفحم كل من عاندوضاد وعلى آله أولى الفصاحة والبيان وصحابته ذوى البلاغة والعرقان
  هذاوان علم اللغة أجلّ علم وأعلاه اذلم تدرك بقية العلوم لولاه فتسابق العلماه الاعلام
  اليه وتحاكت ركيهم عليه وفيه تناضلوا وبه تفاضلوا فألفوافيه أسفارا أسفرت
  عن المحاسن اسفارا وكان أوحدها وأخصها وواسطتها وفسها سماح الجوهرى اذهو
  بكل جحيل حرى وهوفى هذه اللغة العلية كصحيح البخارى فى الاساديث النبوية شواهده
  شاهدة له بالمقسام الاعلى واذ كررت فالمكزرا-لى وأغلى نترت فيه من درراسان العرب
  فرائد ونظعت فيه من جواهر المعانى فوائد أعجب بها الناقد البصير وبها سقط على
  الخبير طالماتمناه المتمفون وتزجاه المترجون وطارت عليه قلوب الاكابر وتطلعت اليه
  النواظر فكان بالطبع أولى ومحن الوضع أعلى خصوصا بالمطبعة العاهرة التى
  ببولاق مصر القاهرة ذات الشهرة الباهرة والمحاسن الزاهرة الحائرة لكمال الشرف
  بنسبتهاللدائرة السفية لازالت عماسنهابهية فى ظلّ صاحب السعادة الاكرم اتتخديو
  الاعظم حامى جى الامصار مفيض العدل فى الاقطار محي رفات المكارم ناشراؤاء
