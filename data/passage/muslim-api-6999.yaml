label: { ar: "صحيح مسلم 6999 — وصف المؤمن", en: "Sahih Muslim 6999 — a description of the believer", ur: "صحیح مسلم 6999 — مومن کا وصف", es: "Sahih Muslim 6999 — una descripción del creyente", fr: "Sahih Muslim 6999 — une description du croyant" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ، - يَعْنِي ابْنَ مُحَمَّدٍ - عَنِ الْعَلاَءِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" الْمُؤْمِنُ يَغَارُ وَاللَّهُ أَشَدُّ غَيْرًا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6999، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih Muslim, no. 6999 (The Book of Repentance), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح مسلم کی حدیث نمبر 6999، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6999 (El Libro del Arrepentimiento), menciona una descripción del creyente. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih Muslim, n° 6999 (Le Livre du Repentir), mentionne une description du croyant. Le navigateur « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
