text: "… العراق أكلوا من جبن المجوس وهو يعمل بالإنفحة مع أن ذبائحهم تعتبر كالميتة. وقد ثبت عن سلمان الفارسي أنه سئل عن شيء من الجبن والسمن والفراء. فقال : الحلال ما أحله اللّٰه في كتابه، والحرام ما حرم اللّٰه في كتابه، …"
