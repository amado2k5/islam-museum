text: "… الخلقُ، فسلوا اللهَ أن يجددَ الإيمانَ في قلوبكم. خرَّجهُ الحاكم، وقالَ: صحيحُ الإسنادِ. ثُم قَالَ الْبُخَارِيَّ: وَالْحُبّ فِي اللّٰهِ وَالْبُغْضُ فِي اللهِ مِنَ الإِيَمَانِ. وهذا يدل عليه : قول النبى وَيِي: ثلاثٌ من كنّ فيه وجدَ بهنّ حلاوةَ الإيمانِ وذكر …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 11، يذكر ما عُدّ من الإيمان، وحلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 11, that mentions what is counted as part of faith, the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 11 کا اقتباس جس میں جو ایمان میں سے گنا گیا، ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
