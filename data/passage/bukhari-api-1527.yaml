label: { ar: "صحيح البخاري 1527 — الأب والأبوة", en: "Sahih al-Bukhari 1527 — the father and fatherhood", ur: "صحیح بخاری 1527 — باپ اور والدیت", es: "Sahih al-Bukhari 1527 — El padre y la paternidad" }
text: "حَدَّثَنَا عَلِيٌّ، حَدَّثَنَا سُفْيَانُ، حَفِظْنَاهُ مِنَ الزُّهْرِيِّ عَنْ سَالِمٍ، عَنْ أَبِيهِ، وَقَّتَ النَّبِيُّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1527، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1527 (Hajj (Pilgrimage)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1527، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1527 (Hajj (Peregrinación)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
