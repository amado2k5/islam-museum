label: { ar: "الموطأ 541 — إنما مثل صاحب القرآن كمثل صاحب الإبل المعقلة", en: "Muwatta 541" }
text: "إنما مثل صاحب القرآن كمثل صاحب الإبل المعقلة؛ إن عاهد عليها أمسكها، وإن أطلقها ذهبت"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي شبه صاحب القرآن بصاحب الإبل المعقلة: إن تعاهدها أمسكها، وإن أطلقها ذهبت. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والقعنبي، والتنيسي عند البخاري (5031)، وقتيبة عند النسائي، والشيباني، ويحيى بن يحيى النيسابوري عند مسلم (2/190). {cite:muwatta-maruf-1997 p.278}"
