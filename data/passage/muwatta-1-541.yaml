label: { ar: "الموطأ 541 — إنما مثل صاحب القرآن كمثل صاحب الإبل المعقلة", en: "Muwatta 541", es: "Muwatta 541", fr: "Muwatta 541", ur: "موطا 541", tr: "El-Muvatta 541 — Kur'an'ı ezberleyenin örneği, bağlı develere sahip olanın örneği gibidir.", id: "Al-Muwatta 541 — Perumpamaan orang yang menghafal Al-Quran adalah seperti perumpamaan orang yang memiliki unta-unta yang ditambatkan." }
text: "إنما مثل صاحب القرآن كمثل صاحب الإبل المعقلة؛ إن عاهد عليها أمسكها، وإن أطلقها ذهبت"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي شبه صاحب القرآن بصاحب الإبل المعقلة: إن تعاهدها أمسكها، وإن أطلقها ذهبت. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والقعنبي، والتنيسي عند البخاري (5031)، وقتيبة عند النسائي، والشيباني، ويحيى بن يحيى النيسابوري عند مسلم (2/190). {cite:muwatta-maruf-1997 p.278}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Peygamberimiz Kur'an'ı ezberleyeni bağlı bir deveye sahip olana benzetmiştir: Eğer ona bakarsa, onu elinde tutar; ama eğer onu serbest bırakırsa, deve kaçar. Araştırmacı, bunun Malik'ten Ebu Mus'ab tarafından, onun aracılığıyla da İbn Hibban, el-Baghawi, el-Ka'nabi ve el-Tunisi tarafından Buhari'de (5031), Kuteybe tarafından el-Nesai'de, el-Şeybani tarafından ve Yahya ibn Yahya el-Naysaburi tarafından Müslim'de (2/190) rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.278}"
  id: "Malik meriwayatkannya dari Nafi’ yang juga meriwayatkannya dari Abdullah ibn Umar, bahwa Nabi menyamakan orang yang menghafal Al-Quran dengan pemilik unta yang diikat: jika ia merawatnya, ia akan memeliharanya, tetapi jika ia melepaskannya, unta itu akan lari. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan melalui dia oleh Ibn Hibban, al-Baghawi, al-Qa’nabi, dan al-Tunisi dalam al-Bukhari (5031), Qutaybah dalam al-Nasa’i, al-Shaybani, dan Yahya ibn Yahya al-Naysaburi dalam Muslim (2/190). {cite:muwatta-maruf-1997 p.278}"
