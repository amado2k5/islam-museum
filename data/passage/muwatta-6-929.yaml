label: { ar: "الموطأ 929 — ابن عمر أهل من الفُرع", en: "Muwatta 929", es: "Muwatta 929", fr: "Muwatta 929", ur: "موطا 929", tr: "El-Muvatta 929 — İbn Ömer, mezhep mensubu", id: "Al-Muwatta 929 — Ibn Umar, seorang anggota cabang" }
text: "أهل من الفرع"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر أهل من الفرع. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (386)، وأن ابن عمر كان يُهل من الفرع في طريقه. {cite:muwatta-maruf-1997 p.445}"
  tr: "Malik, Nafi’den rivayetle Abdullah ibn Umar’ın Fara’dan ihram haline girdiğini nakletmiştir. Araştırmacı, Ebu Mus’ab ve Muhammed ibn el-Hasan el-Şeybani’nin (386) bunu Malik’ten rivayet ettiğini ve İbn Umar’ın Fara’dan ihram haline girerken yolda olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.445}"
  id: "Malik meriwayatkannya dari Nafi’ bahwa Abdullah ibn Umar memasuki keadaan ihram dari al-Fara’. Peneliti menyebutkan bahwa Abu Mus’ab dan Muhammad ibn al-Hasan al-Shaybani (386) meriwayatkannya dari Malik, dan bahwa Ibn Umar biasa memasuki keadaan ihram dari al-Fara’ dalam perjalanannya. {cite:muwatta-maruf-1997 p.445}"
