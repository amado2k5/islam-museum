label: { ar: "الموطأ 1336 — أنس بن مالك: كان النبي يدخل على أم حرام بنت ملحان بقباء فتطعمه، فنام ثم استيقظ يضحك", en: "Muwatta 1336", es: "Muwatta 1336", fr: "Muwatta 1336", ur: "موطا 1336", tr: "El-Muvatta 1336 — Enes bin Malik: Peygamberimiz Kuba'da Ümmü Haram bint Milhan'ı ziyaret ederdi ve Ümmü Haram ona yemek yedirirdi, sonra o uyurdu ve gülerek uyanırdı.", id: "Al-Muwatta 1336 — Anas bin Malik: Nabi biasa mengunjungi Umm Haram bint Milhan di Quba dan dia akan memberi makan beliau, kemudian beliau akan tidur dan bangun sambil tertawa." }
text: "نَاسٌ مِن أُمَّتي، عُرِضُوا عَليَّ غزاةً في سَبِيلِ اللهِ"
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك أن رسول الله كان إذا ذهب إلى قباء دخل على أم حرام بنت ملحان فتطعمه، وكانت أم حرام تحت عبادة بن الصامت، فدخل عليها يوما فأطعمته، وجلست تفلي في رأسه، فنام ثم استيقظ يضحك. فسألته فقال ناس من أمتي عرضوا علي غزاة في سبيل الله يركبون ثبج هذا البحر، ملوكا على الأسرة أو مثل الملوك على الأسرة. فدعت أن تكون منهم، فقال أنت من الأولين، فركبت البحر في زمن معاوية فصرعت عن دابتها حين خرجت من البحر فهلكت. {cite:muwatta-maruf-1997 p.597}"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha, dari Anas ibn Malik, bahwa ketika Rasulullah shalla Allahu alaihi wa sallam pergi ke Quba, beliau mengunjungi Umm Haram binti Milhan, yang memberinya makan. Umm Haram menikah dengan Ubadah ibn al-Samit. Suatu hari, beliau mengunjunginya, dan Ubadah memberinya makan dan duduk untuk menyisir rambutnya. Beliau tertidur dan kemudian terbangun sambil tertawa. Ubadah bertanya kepadanya apa yang telah terjadi, dan beliau menjawab, \"Sebagian dari kaumku diperlihatkan kepadaku sebagai pejuang di jalan Allah, menunggangi gelombang laut ini, seperti raja-raja di atas singgasana.\" Ubadah berdoa agar dirinya termasuk di antara mereka, dan Ubadah menjawab, \"Engkau termasuk yang pertama.\" Maka Ubadah menunggangi laut pada masa Muawiyah, tetapi ia jatuh dari tunggangannya ketika keluar dari laut dan meninggal dunia. {cite:muwatta-maruf-1997 p.597}"
