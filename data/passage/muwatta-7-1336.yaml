label: { ar: "الموطأ 1336 — أنس بن مالك: كان النبي يدخل على أم حرام بنت ملحان بقباء فتطعمه، فنام ثم استيقظ يضحك", en: "Muwatta 1336" }
text: "نَاسٌ مِن أُمَّتي، عُرِضُوا عَليَّ غزاةً في سَبِيلِ اللهِ"
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك أن رسول الله كان إذا ذهب إلى قباء دخل على أم حرام بنت ملحان فتطعمه، وكانت أم حرام تحت عبادة بن الصامت، فدخل عليها يوما فأطعمته، وجلست تفلي في رأسه، فنام ثم استيقظ يضحك. فسألته فقال ناس من أمتي عرضوا علي غزاة في سبيل الله يركبون ثبج هذا البحر، ملوكا على الأسرة أو مثل الملوك على الأسرة. فدعت أن تكون منهم، فقال أنت من الأولين، فركبت البحر في زمن معاوية فصرعت عن دابتها حين خرجت من البحر فهلكت. {cite:muwatta-maruf-1997 p.597}"
