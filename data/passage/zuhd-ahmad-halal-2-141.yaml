text: "كَارُ المُهْدِ - ثنا عبدُ الله، قال: ثنا أَبي، قال: ثنا زيدُ بنُ يحيى الدِّمشقيُّ، قال: ثنا خالدُ بنُ صُبَيَحٍ، قال: ثنا يُونُسُ بنُ حَلْبَسٍ، قال: قال أَبو مُسلمِ الحوْلَانيُّ: ليسَ الزَّهادةُ في الدُّنيا: بتَحريمِ الحلالِ، ولا إِضاعةِ المالِ؛ إِنَّما …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 141، يذكر الحلال، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
