  tr: "Malik şöyle dedi ve tanıdığım herkes aynı şeyi söyledi: Özgür bir adam köle bir kadınla evlenir ve ona dokunur. {cite:muwatta-maruf-1997 s.49}"
  id: "Malik berkata, dan semua orang yang saya kenal mengatakan hal yang sama: Seorang pria merdeka menikahi seorang wanita budak dan menyentuhnya. {cite:muwatta-maruf-1997 p.49}"
