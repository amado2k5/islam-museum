text: "كِتَابُ عَدَد التَّمَام. كِتَابُ المَصَاحِف. كِتَابُ اخْتِيَار نفسه. كِتَابُ السَّبْعَة بعِلَلِها الكَبير. كِتَابُ السَّبْعَة الأوْسَط. كِتَابُ الأوْسَط، آخَر. كِتَابُ الأصْغَرِ ويُعْرَف ب شِفَاء الصُّدُور. كِتَابُ انْفِرادَاته. كِتَابُ أبو بَكْر محمَّدُ بن الحَسَن الأَنْصَارِيّ، من أهْلِ المَوْصِل وبها مَوْلِدُه. وكان وله …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 356، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 1, p. 356, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 1، ص 356 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 1, pág. 356, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Fihrist d'Ibn al-Nadim (tome 1, p. 356) évoquant la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Nadim'in Fihrist adlı eserinin 1. resimli cildinin 356. sayfasından, Kur'an'ın derlenmesi ve el yazmalarının yanı sıra hat sanatı ve yazıya değinen bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, jilid 1 bergambar, halaman 356, yang menyebutkan penyusunan Al-Qur'an dan manuskripnya, serta kaligrafi dan tulisan; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
