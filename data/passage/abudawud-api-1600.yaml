text: "لَهُ سَلَبَةُ فَحَمَى لَهُ رَسُولُ اللَّهِ صلى الله عليه وسلم ذَلِكَ الْوَادِي فَلَمَّا وُلِّيَ عُمَرُ بْنُ الْخَطَّابِ - رضى الله عنه - كَتَبَ سُفْيَانُ بْنُ وَهْبٍ إِلَى عُمَرَ بْنِ الْخَطَّابِ يَسْأَلُهُ عَنْ ذَلِكَ فَكَتَبَ عُمَرُ رضى الله عنه إِنْ أَدَّى إِلَيْكَ مَا كَانَ يُؤَدِّي إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم مِنْ عُشُورِ نَحْلِهِ لَه …"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
