text: "… الشَّيْبَانِيِّ، عَنِ الْوَلِيدِ بْنِ الْعَيْزَارِ، عَنْ سَعْدِ بْنِ إِيَاسٍ أَبِي عَمْرٍو الشَّيْبَانِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، قَالَ سَأَلْتُ رَسُولَ اللَّهِ أَىُّ الْعَمَلِ أَفْضَلُ قَالَ \" الصَّلاَةُ لِوَقْتِهَا \". قَالَ قُلْتُ ثُمَّ أَىٌّ قَالَ \" بِرُّ الْوَالِدَيْنِ \". قَالَ قُلْتُ ثُمَّ أَىٌّ قَالَ \" الْجِهَادُ فِي سَبِيلِ اللَّهِ \". فَمَا تَرَكْتُ أَسْتَزِيدُهُ إِلاَّ إِرْعَاءً عَلَيْهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 252، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 252 (The Book of Faith), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 252، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
