text: "… ما رأيتى وقد نهى رسول اللّٰه صلى اللّٰه اى تستعمل الرقية وهى العوذة التى يرقى بها صاحب الآفة كالحمى والصرع وغير ذلك من الآمات ج مرض وبائى يسبب حمى و بقعا حمراء فى الجلد جمع رقية، والتمام جمع تميمة وهى …"
