text: "ثم وافوه، فقالوا : - ((يا أمير المؤمنين، إنه قطع صاحبنا، وهذا كتابه بإقراره على غير ذنب.)) فقرا الكتاب، وقال: - «أما القود من عمالى، فلا سبيل إليه، ولكن، إن شئتم، ودينا صاحبكم.» قالوا : سارق ١. رامين: كذا فى"
