label: { ar: "الموطأ 363 — حفصة: ما رأيته صلى في سبحته قاعداً حتى كان قبل وفاته بعام", en: "Muwatta 363", es: "Muwatta 363", fr: "Muwatta 363", ur: "موطا 363", tr: "El-Muvatta 363 — Hafsa: Ölümünden bir yıl öncesine kadar onu namazlarını oturarak kılarken hiç görmedim.", id: "Al-Muwatta 363 — Hafsa: Aku tidak pernah melihatnya mengerjakan salat sunnahnya sambil duduk sampai setahun sebelum kematiannya." }
text: "ما رأيت رسول الله صلى في سبحته قاعداً قط، حتى كان قبل وفاته بعام، فكان يصلي في سبحته قاعداً"
summary:
  ar: "أول حديث في باب ما جاء في صلاة القاعد في النافلة. يرويه يحيى عن مالك عن ابن شهاب عن السائب بن يزيد عن المطلب بن أبي وداعة السهمي عن حفصة زوج النبي: ما رأت النبي صلى في نافلته قاعداً قط حتى كان قبل وفاته بعام، فكان يصلي في نافلته قاعداً ويقرأ بالسورة فيرتلها حتى تكون أطول من أطول منها. ويخرّجه المحقق عند مسلم (2/164) والترمذي (373) وفي الشمائل والنسائي (3/223) وابن حبان وابن خزيمة وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جماعة رواة الموطأ رووه بهذا الإسناد وأن أبا حمة محمد بن يوسف أخطأ فيه عن موسى بن طارق عن مالك ⁦(التمهيد 6/220–221)⁩. {cite:muwatta-maruf-1997 p.199}"
  tr: "Bu hadis, nafile namazlarda oturarak kılınmasıyla ilgili rivayetler bölümünde yer alan ilk hadistir. Yahya, Malik'ten, o da İbn Şihab'dan, o da el-Sa'ib ibn Yazid'den, o da el-Muttalib ibn Abi Wada'ah el-Sahmi'den, o da Peygamberimizin eşi Hafsa'dan rivayet etmiştir: Hafsa, Peygamberimizin vefatından bir yıl öncesine kadar nafile namazlarını oturarak kıldığını hiç görmemiştir. Daha sonra ise nafile namazlarını oturarak kılar ve sureleri yavaş ve dikkatlice, en uzun surelerden daha uzun bir şekilde okurdu. Araştırmacı, bu hadisi Müslim (2/164), Tirmizi (373), Şamail, Nesai (3/223), İbn Hibban, İbn Huzeyme ve Ahmed'de, Malik'in sahabelerinin rivayet zincirleri aracılığıyla nakletmiştir. İbn Abdülbarr'ın, Muvatta'nın bir grup ravisinin bu rivayet zinciriyle bunu naklettiğini ve Ebu Hamme Muhammed ibn Yusuf'un ise bunu Musa ibn Tarık'a, Malik'ten isnat ederek yanıldığını söylediğini aktarıyor (el-Tamhid 6/220–221). {cite:muwatta-maruf-1997 s.199}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai shalat duduk dalam shalat sunnah. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari al-Sa'ib ibn Yazid, dari al-Muttalib ibn Abi Wada'ah al-Sahmi, dari Hafsa, istri Nabi: Ia tidak pernah melihat Nabi shalat sunnah dalam posisi duduk hingga setahun sebelum wafatnya. Kemudian beliau shalat sunnah dalam posisi duduk dan membaca surah, membacanya perlahan dan dengan sungguh-sungguh, sehingga lebih panjang dari surah terpanjang. Peneliti memasukkannya dalam Muslim (2/164), al-Tirmidhi (373), al-Shama'il, al-Nasa'i (3/223), Ibn Hibban, Ibn Khuzaymah, dan Ahmad melalui sanad para sahabat Malik. Ia mengutip Ibnu 'Abd al-Barr yang mengatakan bahwa sekelompok perawi al-Muwatta' meriwayatkan kitab tersebut dengan sanad ini, dan bahwa Abu Hammah Muhammad ibn Yusuf keliru dalam hal ini, dengan menisbatkannya kepada Musa ibn Tariq, dari Malik (al-Tamhid 6/220–221). {cite:muwatta-maruf-1997 p.199}"
