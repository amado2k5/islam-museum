label: { ar: "الموطأ 363 — حفصة: ما رأيته صلى في سبحته قاعداً حتى كان قبل وفاته بعام", en: "Muwatta 363" }
text: "ما رأيت رسول الله صلى في سبحته قاعداً قط، حتى كان قبل وفاته بعام، فكان يصلي في سبحته قاعداً"
summary:
  ar: "أول حديث في باب ما جاء في صلاة القاعد في النافلة. يرويه يحيى عن مالك عن ابن شهاب عن السائب بن يزيد عن المطلب بن أبي وداعة السهمي عن حفصة زوج النبي: ما رأت النبي صلى في نافلته قاعداً قط حتى كان قبل وفاته بعام، فكان يصلي في نافلته قاعداً ويقرأ بالسورة فيرتلها حتى تكون أطول من أطول منها. ويخرّجه المحقق عند مسلم (2/164) والترمذي (373) وفي الشمائل والنسائي (3/223) وابن حبان وابن خزيمة وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جماعة رواة الموطأ رووه بهذا الإسناد وأن أبا حمة محمد بن يوسف أخطأ فيه عن موسى بن طارق عن مالك (التمهيد 6/220–221). {cite:muwatta-maruf-1997 p.199}"
