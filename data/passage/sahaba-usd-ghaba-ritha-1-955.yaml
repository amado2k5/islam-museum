text: "… بلاءً حسن، وقتل يوم القادسية، وقيل: بل مات عطشاً يومئذ، وقيل: بل مات سنة إحدى وعشرين بعد أن شهد وقعة نهاوند مع النعمان بن مُقَرِّن، فمات بقرية من قرى نهاوند يقال لها رُوذَة فقال بعض شعرائهم يرثيه : لَقَد غَادَرَ …"
