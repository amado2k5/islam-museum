text: "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ، حَدَّثَنَا بِشْرُ بْنُ الْمُفَضَّلِ، حَدَّثَنَا الْجُرَيْرِيُّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَلاَ أُحَدِّثُكُمْ بِأَكْبَرِ الْكَبَائِرِ \". قَالُوا بَلَى يَا رَسُولَ اللَّهِ. قَالَ \" الإِشْرَاكُ بِاللَّهِ وَعُقُوقُ الْوَالِدَيْنِ \". قَالَ وَجَلَسَ وَكَانَ مُتَّكِئًا فَقَالَ \" وَشَهَادَةُ الزُّورِ أَوْ قَوْلُ الزُّورِ \". فَمَا زَالَ رَسُولُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1901، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1901 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1901، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
