label: { ar: "جامع الترمذي 1901 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 1901 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 1901 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 1901 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Jami' al-Tirmidhi 1901 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux" }
text: "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ، حَدَّثَنَا بِشْرُ بْنُ الْمُفَضَّلِ، حَدَّثَنَا الْجُرَيْرِيُّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَلاَ أُحَدِّثُكُمْ بِأَكْبَرِ الْكَبَائِرِ \". قَالُوا بَلَى يَا رَسُولَ اللَّهِ. قَالَ \" الإِشْرَاكُ بِاللَّهِ وَعُقُوقُ الْوَالِدَيْنِ \". قَالَ وَجَلَسَ وَكَانَ مُتَّكِئًا فَقَالَ \" وَشَهَادَةُ الزُّورِ أَوْ قَوْلُ الزُّورِ \". فَمَا زَالَ رَسُولُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1901، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1901 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1901، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1901 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los parientes), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1901 (chapitres sur la piété et les bonnes relations familiales), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce sujet parmi les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
