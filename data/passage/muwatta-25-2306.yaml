summary:
  ar: "قال مالك في المكاتب يقاطعه سيده فيعتق، ويكتب عليه ما بقي من القطاعة دينا عليه، ثم يموت المكاتب وعليه دين للناس: إن سيده لا يحاص غرماءه بما بقي عليه من القطاعة، وللغرماء أن يبدؤوا عليه. {cite:muwatta-maruf-1997 p.351}"
