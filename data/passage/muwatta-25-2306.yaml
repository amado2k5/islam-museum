label: { ar: "الموطأ 2306 — مالك: السيد المقاطِع لا يحاص غرماء المكاتب المعتَق", en: "Muwatta 2306", es: "Muwatta 2306", fr: "Muwatta 2306", ur: "موطا 2306", tr: "El-Muvatta 2306 — Malik: Köleyi azad eden efendinin, azat edilen kölenin alacaklılarına karşı bir hakkı yoktur.", id: "Al-Muwatta 2306 — Malik: Tuan yang memutus hubungan dengan budak tidak memiliki hak tuntutan terhadap para kreditur budak yang telah dibebaskan." }
summary:
  ar: "قال مالك في المكاتب يقاطعه سيده فيعتق، ويكتب عليه ما بقي من القطاعة دينا عليه، ثم يموت المكاتب وعليه دين للناس: إن سيده لا يحاص غرماءه بما بقي عليه من القطاعة، وللغرماء أن يبدؤوا عليه. {cite:muwatta-maruf-1997 p.351}"
  tr: "Malik, efendisi tarafından azat edilen ve azat süresinin kalan kısmı kendisine borç olarak kaydedilen bir köle hakkında şöyle demiştir: Köle hâlâ borçlu iken ölürse, efendisi azat süresinin kalan kısmını alacaklılarıyla paylaşamaz ve alacaklılar ondan önce ödeme hakkına sahiptir. {cite:muwatta-maruf-1997 s.351}"
  id: "Malik berkata mengenai seorang budak yang dibebaskan oleh tuannya, dan sisa masa pembebasan tersebut dicatat sebagai hutang yang harus ditanggungnya, lalu budak tersebut meninggal dunia sementara masih berhutang kepada orang lain: tuannya tidak dapat membagi sisa masa pembebasan tersebut dengan para krediturnya, dan para kreditur berhak untuk mendahulukan hak tersebut daripada tuannya. {cite:muwatta-maruf-1997 p.351}"
