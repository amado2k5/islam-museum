label: { ar: "سنن النسائي 4855 — الحساب", en: "Sunan al-Nasa'i 4855 — the reckoning", ur: "سنن نسائی 4855 — حساب" }
text: "… حِينَ بَعَثَهُ عَلَى نَجْرَانَ - وَكَانَ الْكِتَابُ عِنْدَ أَبِي بَكْرِ بْنِ حَزْمٍ - فَكَتَبَ رَسُولُ اللَّهِ \" هَذَا بَيَانٌ مِنَ اللَّهِ وَرَسُولِهِ { يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ } \". وَكَتَبَ الآيَاتِ مِنْهَا حَتَّى بَلَغَ { إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ } ثُمَّ كَتَبَ \" هَذَا كِتَابُ الْجِرَاحِ فِي النَّفْسِ مِائَةٌ مِنَ الإِبِلِ \". نَحْوَهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 4855، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 4855 (The Book of Oaths (qasamah), Retaliation and Blood Money), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 4855، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
