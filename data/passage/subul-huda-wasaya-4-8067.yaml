text: "… عنْهُمْ، وكُفِّنَ فى ثَلَاثَةِ أَثْوابٍ لَيْسَ فِيهَا قَمِيصٌ وَلَا عِمَامَةٌ، وَكَانَ عِنْدَهُ شَيْءُ مِنْ حنُوطِ رَسُول اللّٰه اللفِ، أَوْصَىَ أَنْ يُحَنَّطَ بِهِ فَحَنَّطُوهُ بِهِ وَصَلَّى عَلَيْهِ الحسَنُ، وَدُفِنَ بِالكُوفَةِ عِنْدَ قَصْرِ الإِمَارَةِ، وَغُمِّىَ قَبْرُهُ، وقِيلَ : إنْ عَلِيًّا صبر فى …"
