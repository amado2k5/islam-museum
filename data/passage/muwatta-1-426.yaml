label: { ar: "الموطأ 426 — ابن عباس يمر على أتان بين يدي بعض الصف بمنى فلا يُنكر عليه", en: "Muwatta 426", es: "Muwatta 426", fr: "Muwatta 426", ur: "موطا 426", tr: "El-Muvatta 426 — İbn Abbas, Mina'da bazı safların önünden bir eşeğin yanından geçti ve kimse buna itiraz etmedi.", id: "Al-Muwatta 426 — Ibnu Abbas melewati seekor keledai di depan beberapa barisan di Mina dan tidak ada yang keberatan." }
text: "فمررت بين يدي بعض الصف فنزلت فأرسلت الأتان ترتع ودخلت في الصف، فلم ينكر ذلك علي أحد"
summary:
  ar: "أول حديث في باب الرخصة في المرور بين يدي المصلي. يرويه يحيى عن مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن عبد الله بن عباس: أقبل راكباً على أتان وقد ناهز الاحتلام، والنبي يصلي بالناس بمنى، فمر بين يدي بعض الصف ثم نزل وأرسل الأتان ترتع ودخل في الصف، فلم ينكر ذلك عليه أحد. ويخرّجه المحقق عند البخاري ⁦(76، 493، 861، 4412)⁩ ومسلم (2/57) وأبي داود (715) والنسائي وابن خزيمة وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (9/19). {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.222}"
  tr: "Namaz kılanın önünden geçmenin caizliği bölümündeki ilk hadis. Yahya, Malik'ten, o da İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe'den, o da Abdullah ibn Abbas'tan rivayet etmiştir: Ergenlik çağına ulaşmış bir genç, eşeğe binmiş halde, Peygamberimiz Mina'da cemaate namaz kıldırırken geldi. Bazı safların önünden geçti, sonra indi, eşeğin otlamasına izin verdi ve tekrar safa katıldı. Kimse buna itiraz etmedi. Araştırmacı, bu hadisi Buhari (76, 493, 861, 4412), Müslim (2/57), Ebu Davud (715), Nesai, İbn Huzeyme, Ahmed ve Şafiî'nin hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiş ve Temhid'e (9/19) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.221} {cite:muwatta-maruf-1997 s.222}"
  id: "Hadits pertama dalam bab ini membahas tentang kebolehan melewati orang yang sedang shalat. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Ubaydullah ibn Abdullah ibn Utbah, dari Abdullah ibn Abbas: Ia datang menunggang keledai, setelah mencapai usia baligh, ketika Nabi sedang memimpin shalat berjamaah di Mina. Ia melewati beberapa barisan, kemudian turun, membiarkan keledainya merumput, dan kembali bergabung dengan barisan. Tidak ada yang keberatan dengan hal ini. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (76, 493, 861, 4412), Muslim (2/57), Abu Dawud (715), al-Nasa'i, Ibn Khuzaymah, Ahmad, dan al-Shafi'i, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (9/19). {kutip:muwatta-maruf-1997 hal.221} {kutip:muwatta-maruf-1997 hal.222}"
