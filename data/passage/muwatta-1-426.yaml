label: { ar: "الموطأ 426 — ابن عباس يمر على أتان بين يدي بعض الصف بمنى فلا يُنكر عليه", en: "Muwatta 426" }
text: "فمررت بين يدي بعض الصف فنزلت فأرسلت الأتان ترتع ودخلت في الصف، فلم ينكر ذلك علي أحد"
summary:
  ar: "أول حديث في باب الرخصة في المرور بين يدي المصلي. يرويه يحيى عن مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن عبد الله بن عباس: أقبل راكباً على أتان وقد ناهز الاحتلام، والنبي يصلي بالناس بمنى، فمر بين يدي بعض الصف ثم نزل وأرسل الأتان ترتع ودخل في الصف، فلم ينكر ذلك عليه أحد. ويخرّجه المحقق عند البخاري (76، 493، 861، 4412) ومسلم (2/57) وأبي داود (715) والنسائي وابن خزيمة وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (9/19). {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.222}"
