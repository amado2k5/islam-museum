text: "… في كتابنا هذا إلى ذكره. وإِنَّما أجرينا من ذكْره وَلِيِ ها هنا لُمَعاً يحسن الوقوف عليها والمذاكرة بها ؛ تبرُّكاً بذكره في أَوَّل لكتاب، والله الموفق للصّواب. وأصحُ ذلك أنَّه نزل في قبره العبّاس عمّه، وعليّما معه، وقُتَم بن العبّاس، …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 36، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 36, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 36 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 3, pág. 36, que menciona una reliquia conservada tras su propietario, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre d'Ibn 'Abd al-Barr, al-Isti'ab (tome 3, page 36), mentionnant une relique conservée après son propriétaire, une sépulture ou un lieu de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn Abdülbarr'ın resimli 3. cildi, 36. sayfasındaki el-İsti'ab adlı eserinden bir alıntı, korunmuş bir kutsal emanet, bir defin, bir mezar ve bir türbeden bahsetmektedir; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 3 bergambar, halaman 36, menyebutkan sebuah relik yang terpelihara, sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, relik, dan makam."
