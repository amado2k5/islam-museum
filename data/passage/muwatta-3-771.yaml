label: { ar: "الموطأ 771 — مالك في العبد الآبق: إن كانت غيبته قريبة ترجى رجعته زكى عنه سيده، وإن طال إباقه ويئس منه فلا", en: "Muwatta 771", es: "Muwatta 771", fr: "Muwatta 771", ur: "موطا 771", tr: "El-Muvatta 771 — Malik'in kaçak köle hakkındaki görüşü: Eğer yokluğu kısa süreliyse ve geri dönmesi umuluyorsa, efendisi onun adına zekât vermelidir. Fakat eğer kaçışı uzun sürerse ve geri dönmesi umulamıyorsa, o zaman efendisi zekât vermemelidir.", id: "Al-Muwatta 771 — Malik tentang budak yang kabur: Jika ketidakhadirannya singkat dan diharapkan ia kembali, tuannya wajib membayar zakat atas namanya. Tetapi jika pelariannya berkepanjangan dan tidak ada harapan untuk menemukannya, maka tidak" }
summary:
  ar: "قول لمالك في العبد الآبق: إن سيده إن علم مكانه أو لم يعلم وكانت غيبته قريبة وهو تُرجى حياته ورجعته فإنه يرى أن يزكي عنه، وإن كان إباقه قد طال ويئس منه فلا يرى أن يزكي عنه. ويذكر المحقق أن في نسخة م «يرجو»، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.380}"
  tr: "Malik, kaçak bir köle hakkında şöyle demiştir: Efendisi onun nerede olduğunu biliyor olsun ya da olmasın, yokluğu kısa süreliyse ve canına dair umut varsa, onun adına zekât vermelidir. Ancak, kaçışı uzun sürmüşse ve geri dönme umudu yoksa, onun adına zekât vermemelidir. Editör, M el yazmasında \"umutlar\" ifadesinin geçtiğini ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.380}"
  id: "Malik berkata mengenai seorang budak yang melarikan diri: Jika tuannya mengetahui keberadaannya atau tidak, dan ketidakhadirannya singkat serta ada harapan untuk keselamatannya dan kepulangannya, maka tuannya wajib membayar zakat atas namanya. Namun, jika pelariannya sudah lama dan tidak ada harapan untuk kepulangannya, maka tuannya tidak perlu membayar zakat atas namanya. Editor mencatat bahwa dalam manuskrip M, tertulis \"harapan,\" dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.380}"
