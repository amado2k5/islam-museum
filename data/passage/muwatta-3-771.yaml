label: { ar: "الموطأ 771 — مالك في العبد الآبق: إن كانت غيبته قريبة ترجى رجعته زكى عنه سيده، وإن طال إباقه ويئس منه فلا", en: "Muwatta 771" }
summary:
  ar: "قول لمالك في العبد الآبق: إن سيده إن علم مكانه أو لم يعلم وكانت غيبته قريبة وهو تُرجى حياته ورجعته فإنه يرى أن يزكي عنه، وإن كان إباقه قد طال ويئس منه فلا يرى أن يزكي عنه. ويذكر المحقق أن في نسخة م «يرجو»، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.380}"
