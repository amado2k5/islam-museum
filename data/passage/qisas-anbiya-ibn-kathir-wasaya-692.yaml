text: "… قالت : بالرفاء والبنين. وروى ابن عساكر من حديث محمد بن زكريا الغلابي، حدثنا العباس بن بكار، حدثنا أبو بكر الهذلي، عن عكرمة، عن ابن عباس، أن رسول الله علا دخل على خديجة وهى في مرض الموت فقال : يا …"
