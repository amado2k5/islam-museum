label: { ar: "الموطأ 2165 — يحيى عن مالك: الأمر عندنا في أم الولد إذا جنت جناية، ضمن سيدها ما بينها وبين قيمتها، وليس له أن يسلمها، وليس عليه أن يحمل من جنايتها أكثر من قيمتها", en: "Muwatta 2165", es: "Muwatta 2165", fr: "Muwatta 2165", ur: "موطا 2165", tr: "El-Muvatta 2165 — Yahya, Malik'ten rivayetle: Efendisine çocuk doğurmuş bir cariyenin suç işlemesi durumunda hükmümüz şudur: Efendisi, cariyenin değeri ile gerçek değeri arasındaki farkı ödemekle yükümlüdür. Onu teslim etmesi caiz değildir, ne de suçunun karşılığı olarak değerinden fazlasını ödemekle yükümlüdür.", id: "Al-Muwatta 2165 — Yahya berdasarkan riwayat Malik: Hukum kami mengenai seorang budak perempuan yang telah melahirkan anak bagi tuannya, jika ia melakukan kejahatan, adalah bahwa tuannya bertanggung jawab atas selisih antara nilai dan harga dirinya. Ia tidak diperbolehkan untuk menyerahkannya, dan ia juga tidak diwajibkan untuk menanggung lebih dari nilai dirinya sebagai kompensasi atas kejahatannya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في أم الولد إذا جنت جناية، ضمن سيدها ما بينها وبين قيمتها، وليس له أن يسلمها، وليس عليه أن يحمل من جنايتها أكثر من قيمتها. {cite:muwatta-maruf-1997 p.287}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Bizim görüşümüze göre, çocuk doğurmuş bir cariye suç işlerse, efendisi onun değeri ile kendi değeri arasındaki miktardan sorumludur. Onu teslim etmesine izin verilmez, işlediği suçtan dolayı değerinden fazlasını da karşılamakla yükümlü değildir. {cite:muwatta-maruf-1997 s.287}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Menurut pandangan kami, jika seorang budak perempuan yang telah melahirkan anak melakukan kejahatan, tuannya bertanggung jawab atas jumlah antara nilai budak tersebut dan nilai dirinya. Ia tidak diperbolehkan untuk menyerahkannya, dan ia juga tidak berkewajiban untuk menanggung lebih dari nilai budak tersebut atas kejahatan yang dilakukannya. {cite:muwatta-maruf-1997 p.287}"
