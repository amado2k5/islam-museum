label: { ar: "الموطأ 1139 — مالك: من نسي الإفاضة حتى رجع إلى بلاده، فيرجع ويفيض، ثم يعتمر ويهدي إن أصاب أهله", en: "Muwatta 1139" }
summary:
  ar: "سئل مالك عن رجل نسي الإفاضة حتى خرج من مكة ورجع إلى بلاده. قال إن لم يكن أصاب النساء فليرجع فليفض، وإن كان أصابهن فليرجع فليفض ثم يعتمر ويهدي. ولا يشتري هديه من مكة وينحره بها، بل يسوقه من حيث اعتمر، أو يشتريه بمكة ويخرجه إلى الحل ثم يسوقه إلى مكة فينحره بها. {cite:muwatta-maruf-1997 p.517}"
