label: { ar: "الموطأ 1139 — مالك: من نسي الإفاضة حتى رجع إلى بلاده، فيرجع ويفيض، ثم يعتمر ويهدي إن أصاب أهله", en: "Muwatta 1139", es: "Muwatta 1139", fr: "Muwatta 1139", ur: "موطا 1139", tr: "El-Muvatta 1139 — Malik: Kim ülkesine dönene kadar Tavafü'l-İfade'yi yapmayı unutursa, geri dönüp Tavafü'l-İfade'yi yapmalı, sonra Umre yapmalı ve ailesiyle iletişim halindeyse kurban kesmelidir." }
summary:
  ar: "سئل مالك عن رجل نسي الإفاضة حتى خرج من مكة ورجع إلى بلاده. قال إن لم يكن أصاب النساء فليرجع فليفض، وإن كان أصابهن فليرجع فليفض ثم يعتمر ويهدي. ولا يشتري هديه من مكة وينحره بها، بل يسوقه من حيث اعتمر، أو يشتريه بمكة ويخرجه إلى الحل ثم يسوقه إلى مكة فينحره بها. {cite:muwatta-maruf-1997 p.517}"
  tr: "Malik'e, Mekke'den ayrılıp ülkesine dönene kadar Tavafü'l-İfade'yi yapmayı unutan bir adam hakkında soru soruldu. O şöyle dedi: “Eğer eşleriyle cinsel ilişkiye girmemişse, geri dönüp Tavafü'l-İfade'yi yapmalıdır. Eğer eşleriyle cinsel ilişkiye girmişse, geri dönüp Tavafü'l-İfade'yi yaptıktan sonra Umre yapmalı ve kurban kesmelidir. Kurbanlık hayvanını Mekke'den alıp orada kesmemeli, Umre yaptığı yerden almalı veya Mekke'den alıp Haram sınırının dışına çıkarıp sonra Mekke'ye götürüp orada kesmelidir.” {cite:muwatta-maruf-1997 s.517}"
  id: "Malik ditanya tentang seorang pria yang lupa melaksanakan Tawaf al-Ifadah hingga ia meninggalkan Mekah dan kembali ke negaranya. Beliau berkata, “Jika ia belum bersetubuh dengan istri-istrinya, maka ia harus kembali dan melaksanakan Tawaf al-Ifadah. Jika ia telah bersetubuh dengan mereka, maka ia harus kembali dan melaksanakan Tawaf al-Ifadah, kemudian melaksanakan Umrah dan mempersembahkan kurban. Ia tidak boleh membeli hewan kurban di Mekah dan menyembelihnya di sana, melainkan sebaiknya ia mengambilnya dari tempat ia melaksanakan Umrah, atau ia dapat membelinya di Mekah, membawanya keluar dari wilayah Haram, kemudian membawanya ke Mekah dan menyembelihnya di sana.” {cite:muwatta-maruf-1997 p.517}"
