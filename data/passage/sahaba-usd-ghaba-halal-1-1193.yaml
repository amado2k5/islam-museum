text: "… وغير واحد بإسنادهم إلى محمد بن عيسى قال: حدثنا قُتَيبة بن سعيد، حدثنا حَمّاد بن زيد، عن مُجَالد، عن الشَّعبي، عن النعمان بن بَشِير قال: سمعت رسول اللّٰه عليله يقول : الحلالُ بيّن، والحرام بَيّن، وبين ذلك أَمور مُشتبهات، لاَ …"
