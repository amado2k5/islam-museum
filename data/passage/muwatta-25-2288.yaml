label: { ar: "الموطأ 2288 — مالك: لا يجب على السيد أن يكاتب عبده إذا سأله", en: "Muwatta 2288" }
summary:
  ar: "قال مالك: الأمر عندنا أنه ليس على سيد العبد أن يكاتبه إذا سأله ذلك، ولم يُعلم أن أحدا من الأئمة أكره رجلا على مكاتبة عبده. وسمع مالك بعض أهل العلم يستدل بآية في سورة النور على الاستحباب، ويذكر آيتين في سورتي المائدة والجمعة، ويقول: إن الأمر أذن الله فيه للناس وليس بواجب. {cite:muwatta-maruf-1997 p.344}"
