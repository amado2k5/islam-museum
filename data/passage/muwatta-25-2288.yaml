label: { ar: "الموطأ 2288 — مالك: لا يجب على السيد أن يكاتب عبده إذا سأله", en: "Muwatta 2288", es: "Muwatta 2288", fr: "Muwatta 2288", ur: "موطا 2288", tr: "El-Muvatta 2288 — Malik: Köle, kendisinden yazılı bir özgürlük belgesi talep ederse, efendi bunu vermekle yükümlü değildir.", id: "Al-Muwatta 2288 — Malik: Seorang majikan tidak berkewajiban untuk memberikan kontrak pembebasan tertulis kepada budaknya jika budak tersebut memintanya." }
summary:
  ar: "قال مالك: الأمر عندنا أنه ليس على سيد العبد أن يكاتبه إذا سأله ذلك، ولم يُعلم أن أحدا من الأئمة أكره رجلا على مكاتبة عبده. وسمع مالك بعض أهل العلم يستدل بآية في سورة النور على الاستحباب، ويذكر آيتين في سورتي المائدة والجمعة، ويقول: إن الأمر أذن الله فيه للناس وليس بواجب. {cite:muwatta-maruf-1997 p.344}"
  tr: "Malik şöyle dedi: Bizim görüşümüze göre, köle talep ederse, efendi kölesine yazılı bir azat sözleşmesi vermekle yükümlü değildir. Hiçbir imamın bir erkeği kölesine yazılı bir azat sözleşmesi vermeye zorladığı bilinmemektedir. Malik, bazı âlimlerin Nur Suresi'ndeki bir ayeti bunun caiz olduğuna dair delil olarak gösterdiklerini ve Maide Suresi ile Cuma Suresi'ndeki iki ayeti zikrederek, \"Allah bunu insanlar için helal kılmıştır, fakat bu farz değildir\" dediklerini işitti. {kaynak:muwatta-maruf-1997 s.344}"
  id: "Malik berkata: Menurut mazhab kami, seorang majikan tidak berkewajiban memberikan budaknya surat pembebasan tertulis jika budak tersebut memintanya. Tidak diketahui bahwa ada imam yang pernah memaksa seseorang untuk memberikan budaknya surat pembebasan tertulis. Malik mendengar beberapa ulama mengutip sebuah ayat dalam Surah An-Nur sebagai bukti kebolehannya, dan mereka menyebutkan dua ayat dalam Surah Al-Ma'idah dan Surah Al-Jumu'ah, dengan mengatakan: Allah telah mengizinkan hal ini bagi manusia, tetapi tidak wajib. {kutipan:muwatta-maruf-1997 hlm. 344}"
