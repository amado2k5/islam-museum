text: "… بن مسلمة، حدثنا الليث بن سعد أن عمر بن عبد العزيز قال : أيما قوم صالحوا على جزية يعطونها، فمن أسلم منهم كان أرضه وداره لبقيّهم. قال الليث، وكتب إلى يحي بن سعيد، أن ما باع القبط فى جزيتهم وما …"
