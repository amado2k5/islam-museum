text: |-
  قوله لا حق الصقلين فى بعض
  النسخ الاطلبن والصذل والاطل
  الخاصيرة
  ٢٤٨
  الواحد والمع والتأنيث فى لغة أهل الحجاز قال اللّٰه تعالى والقائلين لاخوانهم «لمّ الينا وأهل
  نجد يصرّ فونها فية ولون للاثنيزهلما وللجميع هلموا وللمرأة هلى وللنساءها من والأوّل أفصح
  وقد توصل باللام قيقال هلم لك وهلم لكم كما قالواهيت لك واذا أدخلات عليه النون الثقيلة
  قلت هلنّ يا رجل وللمرأة هانّ بكسر الميم وفى النثنية هلمان للمؤنث والمذكر جيعا وهان يارجال
  بضم الميم وهلمذان يانسوة واذاقيل لك هلم الى كذاوكذاقلت الام أهلمّ مفتوحة الالف والهاء
  كانك قلت الى ما ألمّ وتركت الهاءعلى ما كانت عليه واذا قال للك هلم كذا وكذا قلت لا أهله
  أى لا أعض كه ويقال جاءنابالهيل والهيلمان اذاجاء بالمال الكثير والهياان بفتح اللام وضمها
  لقم. الهلقام الضخم الطويل والهلقام الاسدرهلقام اسم رجل⁦( مم)⁩ الهمّ الحزن
  والمع الهعوم وأهمع الامر اذا أقلقك وحزقك ويقال همك ما أهمك والمهتمّ الامر الشديد
  وهمنى المرض أذابى قال الراجز* يهم فيسه القوم همّ الحمّ * وانهمّ الشهم والبردذابا
  والاهتمام الاغتمام واهتمّ له بأمره ويقال لما أذيب من السنام الهاموم قال العجاج
  يصف بعيره * وانهمّ هاموم السديف الوارى * وقال الآخر* يضحكن عى كالبرد المنهم
  والهمة واحدة الهمم يقال فلان بعيد الهمة والهمة أيضا بالفتح وهممت بالشئ أهمّ همااذا
  أردته ويقال لامهمة لى بالفتح ولاهمام أى لا أهتمّ بذلك ولا أفعله قال الكميت
  عادلا غبرهم من الناس طرًا*بهم لاهمام لى لاهمام
  وهو مبنى على الكسر مثل قظام والهميم الدبيب وقدهممت أهم بالسكسرهميما وقال
  الشاعر ساعدة بن جوية يصف سيفا
  ترى أثرة فى صفحته كأنه • مدارج شيثان لهن هميم
  والهم بالمكسر الشيخ الفانى والمرأهمة والهمام الملك العظيم الهمة والهموم البئر الكثيرة
  الماء وقال • ان لنا قليدماهموما * يزيدها مخج الدلاجوما
  اللّهيانىّ سمعت أعرابيامن بى عامر يقول اذا قيل انا أبقى عندكم شى نقول همهام
  أى لم ييقشئ وأنشد
  أوات ياخنوت شرّايسلام • فى يوم تحسر ذى عجاج مظلام
  ما كان الاكاصطفاف الاقدام • -تى أتيناهم فقالواهمهام
  والهامّة واحدة الهوام ولا يقع هذا الاسم الاعلى المخوف من الاحناس ويقال للدابة نعم
  الهامة هذه ابن السكيت الهميمة مطرلين دقاق القعار والهمهمة ترديد الصيوت فى الصدر
  وحارهمهيم يمهم فى صوته قال ذو الرمّة بصف الحار والاتن
  خلى لهاسرب أولاها وهيجها • من خلفها لاحق الصقلين همهيم
  وهمسمت المرأة فى رأس الصبي وذلك اذا تومته بصوت ترققه له ويقال ذهبت أتمممه أى
  أطليه (هم الهيفة الصوت الخفىّ والهمة مثال الهلعة خرزة كان النساء يؤخذن بها
  الرجال ( وم هوم الرجل اذاهزرأسه من النعاس وقال الشاعر
  ما تعاعم العين نوماغيرتهويم» وقدهومنا ⁦( يم)⁩ الهامة الرأس والجمع هام وهامة القوم
  رئيهم والهامة من طير الليل وهو السدى والجمع ام قال ذوالزمة
