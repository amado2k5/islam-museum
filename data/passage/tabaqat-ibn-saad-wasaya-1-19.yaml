text: "مرية مؤتسة وهى بادتى البلقاء نجعفر بن أبى طالب، فإن قتل فعبد اللّٰه بن رواحة، فإن قتل فليرتض لمسلمون بينهم رجلًا فيجعلوه عليهم. وعقد لهم رسول اللّٰه، صلّعم، لواء أبيض ودفعه إلى زيد بن حارثة، وأَوصاهم رسول اللّٰه صلعم أَن …"
