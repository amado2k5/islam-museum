label: { ar: "مسلم 1337 — ما نهيتكم عنه فاجتنبوه وما أمرتكم به فائتوا منه ما استطعتم", en: "Muslim 1337 — What I forbid, avoid; what I command, do of it what you can" }
text: "قال رسول الله: «ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فافعلوا منه ما استطعتم؛ فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم»"
summary:
  ar: "رواية أبي هريرة في باب تحريم كثرة السؤال من كتاب العلم/الفضائل في صحيح مسلم؛ قاعدة الامتثال الكلي للنهي والامتثال المقدور للأمر، ويذيل بعلة هلاك الأمم بكثرة السؤال."
