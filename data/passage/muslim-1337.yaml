label: { ar: "مسلم 1337 — ما نهيتكم عنه فاجتنبوه وما أمرتكم به فائتوا منه ما استطعتم", en: "Muslim 1337 — What I forbid, avoid; what I command, do of it what you can", es: "Musulmán 1337 — Lo que prohíbo, evitadlo; lo que mando, haced de ello lo que podáis.", fr: "Muslim 1337 — Ce que j'interdis, évitez-le; ce que je commande, faites-en ce que vous pouvez.", ur: "مسلم 1337 — جس چیز سے میں منع کرتا ہوں اس سے اجتناب میں جو حکم دیتا ہوں، اس پر عمل کرو جو تم کر سکتے ہو۔", tr: "Müslim 1337 — Size haram kıldığım şeylerden sakının, emrettiğim şeylerden ise gücünüz yettiğince yapın.", id: "Muslim 1337 — Jauhilah apa yang telah Aku larang darimu, dan lakukanlah sebanyak yang telah Aku perintahkan darimu sesuai kemampuanmu." }
text: "قال رسول الله: «ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فافعلوا منه ما استطعتم؛ فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم»"
summary:
  ar: "رواية أبي هريرة في باب تحريم كثرة السؤال من كتاب العلم/الفضائل في صحيح مسلم؛ قاعدة الامتثال الكلي للنهي والامتثال المقدور للأمر، ويذيل بعلة هلاك الأمم بكثرة السؤال."
  tr: "Sahih Müslim'in Bilgi/Fazilet Kitabı'ndaki aşırı soru sorma yasağı bölümünde Ebu Hurayra'nın rivayeti; yasağa tam uyum ilkesini ve emre mümkün olan uyumu ele alır ve aşırı soru sormanın milletlerin helak olmasına yol açmasının sebebini açıklayarak sona erer."
  id: "Riwayat Abu Hurairah dalam bab tentang larangan bertanya berlebihan dari Kitab Ilmu/Keutamaan dalam Sahih Muslim; prinsip kepatuhan total terhadap larangan dan kemungkinan kepatuhan terhadap perintah, dan diakhiri dengan alasan kehancuran suatu bangsa karena bertanya berlebihan."
