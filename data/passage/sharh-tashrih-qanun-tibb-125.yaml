text: "… فيأتي عرق واحد منها إلى الطحال والعرق الآخر إلى الكبد، ثم يمتد على البطن من خارج إلى أن ينتهي إلى الفرج ثم بنقضي فعلى هذا يكون منشأ العروق الغلاظ. وفي البدن عروق كثيرة مختلفة في الجنس منشؤها من البطن تؤدي …"
