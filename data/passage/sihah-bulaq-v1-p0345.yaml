text: |-
  ٢٩٦
  ⁦(يب الرام )⁩
  وجذوت الشى استأصله ومنه المجذر وه والقصير وأنشد أبوعرو البحتر المجذر الزوال
  يريد فى مشيته والجيذر مثله والجذمور والإذماً رقطعة من أصل السعفة تيقي فى الجذع اذا
  قطعت بزيادة الميم وأخذت التئ يجذاميره اذا أخذته كله حكاه الكسائى ⁦( جرر)⁩
  الجرّة من الخزف والهع جرّ وبرار والجرّأ يضا أصل الجبل قال الراجز
  وقدقطعت واديا وجرًا والجرة بالكسرما يخرجه البعير للاجترار ومنه قولهم لا أفعل ذلك
  ما اختلفت الجرّة والدرّة واختلافه-ما أنّ الدرّة تسفل والجرة تصاو والجرضرب من
  السمك والجرّية الموصلة والجرّة خشبة نحو الذراع فى رأسها كفة وفى وسطها حبل يصاد بها
  الظباء وفى المثل ناوص الجرّة ثم سالمها وذلكْ أنّ الظبي اذا نشب فيهانا وصها ساعة واضطرب
  فاذلغلبته استقرّفيها كأنه سالمها يضرب لمن خالف ثم اضطر الى الوفاق وقرس جرور يمنع
  القياد ويترجر وربعيدة القعريسنى عليها والجارود نهر السيل وكتيبة جرّارة أى تقيلة السير
  كثرتها وجيس جرّار والجرارة أيضاء يرب مجرذنبها والجر يرحبل يجعل للبعير بنزلة
  العذار للدابة غير الزمام ويه "عمى الرحل جريرا وجررت الحبل وغيره أجرّه جرا والجرّة التى
  فى السماءسميت بذلك لانها كأثر المجروج رعليهم جريرة أى جنى عليهم جناية ويقال جرْت
  الناقة اذا أتت على مضر بها ثم جاوزته بأيام ولم تنتج والجارة الابل التى تجربأزمتها قاعلة بمعنى
  مفعولة مثسل عيشة راضية بمعنى عرضية وماء دافق بمعف مدفوق وفى الحديث لاصدقة
  فى الابل الجارّة وهى ركائب القوم لان الصدقة فى السوائم دون العوامل وحار جارًا ساع
  له قال أبو عبيدوأكَثر كلامهم حارّيار يالياءوتقول كان ذلك عام كذا وهلم جرا الى
  |اليوم وفعلت كذا من جرّاك أى من أجلات وهوفعلى ولا تقل مجراك وقال
  أحبّ السبت من جرّاك الى * كأنى ياسلام من اليهود
  وربماً قالوامن جرااغير مشتدومن جرائك بالمدمن المعتل وأجررت لسان القصيل أى
  شفقته لتلايرتضع وقال امى والقيس
  فكرّ اليه ببراته • كاخل ظهر اللسان المجر
  وقال عمروبن معدى كرب
  فلو أن قومى أنطقتنى رماحهم * نطقت ولكنّ الرماح أجرّت
  يقول لوقاتلوا وأبلوا لذكرت دلك وفخرت به ولسكنهم قطعو السانى بغرارهم ويقال أيضا أجرّ.
  الرمج اذاط عنه وترك الرمح فيه يجره قال الشاعر
  ونق بصالح مالنا احسابنا * ونجر فى الهيجا الرماح وندعى
  وأجررته رسنه اذاتر كته يصنع ماشاء وأبررته الدين اذا أخرته له وأجرتنى فلان أنمانى اذا
  تابعها وفلان يجار فلانا أى يطاوله والتجرير الجرشدد للكثرة أوللم بالغة واجتره أى
  جره واجتر البعير من الجرة وكل ذى كرس يجتروا نجر الشّانجذب والجرجرة صوت يردّده
  البعير فى حنجرته قال الاغلب جرجر فى خنجرة كالحبة •فهوبعبر برجار كماتقول
  زر الجل فهوتر تار والمراجر العظام من الابل قال الاعنى
  هب الجلة الجراجر كالب تان تحنو لدردق أطفال
  وكذلا الجرجور قال التكميت
  ومقل
