label: { ar: "الموطأ 2182 — يحيى عن مالك: فيمن دفع إلى الغسال ثوبا ليصبغه فصبغه، فقال صاحب الثوب: لم آمرك بهذا الصبغ، وقال الغسال: بل أنت أمرتني، فالغسال مصدق في ذلك، والخياط والصائغ مثله، ويحلفون على ذلك، إلا أن يأتوا بأمر لا يستعملون في مثله، فلا يجوز قولهم", en: "Muwatta 2182", es: "Muwatta 2182", fr: "Muwatta 2182", ur: "موطا 2182", tr: "El-Muvatta 2182 — Yahya, Malik'ten rivayetle: Bir kimse bir elbiseyi boyatmak için bir çamaşırcıya verir ve çamaşırcı onu boyar. Elbisenin sahibi, \"Ben sana böyle boyamanı emretmedim\" der. Çamaşırcı da, \"Aksine, sen bana böyle yapmamı emrettin\" derse, çamaşırcıya inanılır. Terzi ve kuyumcu da aynı şekilde yemin ederler. Ancak, bu gibi durumlarda alışılmadık bir şey ortaya koyarlarsa, ifadeleri geçersizdir.", id: "Al-Muwatta 2182 — Yahya berdasarkan riwayat Malik: Mengenai seseorang yang memberikan pakaian kepada tukang cuci untuk dicelup, dan tukang cuci itu mencelupkannya, lalu pemilik pakaian itu berkata: Aku tidak memerintahkanmu untuk mencelupkannya seperti ini, dan tukang cuci itu berkata: Malah, engkau yang memerintahkanku untuk melakukannya, maka perkataan tukang cuci itu harus dipercaya, begitu pula dengan penjahit dan tukang emas, dan mereka bersumpah atas hal itu, kecuali jika mereka mengemukakan sesuatu yang tidak lazim dalam kasus seperti itu, maka pernyataan mereka tidak sah." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول فيمن دفع إلى الغسال ثوبا يصبغه فصبغه، فقال صاحب الثوب: لم آمرك بهذا الصبغ، وقال الغسال: بل أنت أمرتني بذلك. فإن الغسال مصدق في ذلك، والخياط مثل ذلك، والصائغ مثل ذلك، ويحلفون على ذلك، إلا أن يأتوا بأمر لا يستعملون في مثله، فلا يجوز قولهم في ذلك. وليحلف صاحب الثوب، فإن رده وأبى أن يحلف، حلف الصباغ. {cite:muwatta-maruf-1997 p.295} {cite:muwatta-maruf-1997 p.296}"
  tr: "Yahya şöyle dedi: Malik'in, bir çamaşırcıya boyatması için bir giysi veren ve çamaşırcının da boyadığı, giysinin sahibinin: \"Ben sana böyle boyamanı emretmedim\" dediği, çamaşırcının ise: \"Hayır, sen emrettin\" dediği bir olaydan bahsettiğini duydum. Bu konuda çamaşırcıya inanılmalıdır, terzi ve kuyumcu için de aynı şey geçerlidir. Bunlar, normalde yapmadıkları bir şeyi ortaya atmadıkları sürece yemin etmelidirler; aksi takdirde sözleri geçerli değildir. Giysinin sahibi yemin etmelidir ve eğer yemin etmeyi reddederse, boyacı yemin etmelidir. {cite:muwatta-maruf-1997 s.295} {cite:muwatta-maruf-1997 s.296}"
  id: "Yahya berkata: Saya mendengar Malik berkata tentang seseorang yang memberikan pakaian kepada tukang cuci untuk diwarnai, dan tukang cuci itu mewarnainya, dan pemilik pakaian itu berkata: Saya tidak memerintahkanmu untuk mewarnainya seperti ini, dan tukang cuci itu berkata: Tidak, Anda memang memerintahkan saya untuk melakukannya. Tukang cuci harus dipercaya dalam hal ini, dan hal yang sama berlaku untuk penjahit dan tukang emas. Mereka harus bersumpah atas hal ini, kecuali jika mereka menyebutkan sesuatu yang biasanya tidak mereka lakukan, dalam hal ini perkataan mereka tidak sah. Pemilik pakaian harus bersumpah, dan jika dia menolak untuk bersumpah, tukang pewarna harus bersumpah. {cite:muwatta-maruf-1997 p.295} {cite:muwatta-maruf-1997 p.296}"
