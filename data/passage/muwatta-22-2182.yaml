label: { ar: "الموطأ 2182 — يحيى عن مالك: فيمن دفع إلى الغسال ثوبا ليصبغه فصبغه، فقال صاحب الثوب: لم آمرك بهذا الصبغ، وقال الغسال: بل أنت أمرتني، فالغسال مصدق في ذلك، والخياط والصائغ مثله، ويحلفون على ذلك، إلا أن يأتوا بأمر لا يستعملون في مثله، فلا يجوز قولهم", en: "Muwatta 2182" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول فيمن دفع إلى الغسال ثوبا يصبغه فصبغه، فقال صاحب الثوب: لم آمرك بهذا الصبغ، وقال الغسال: بل أنت أمرتني بذلك. فإن الغسال مصدق في ذلك، والخياط مثل ذلك، والصائغ مثل ذلك، ويحلفون على ذلك، إلا أن يأتوا بأمر لا يستعملون في مثله، فلا يجوز قولهم في ذلك. وليحلف صاحب الثوب، فإن رده وأبى أن يحلف، حلف الصباغ. {cite:muwatta-maruf-1997 p.295} {cite:muwatta-maruf-1997 p.296}"
