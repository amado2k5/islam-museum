label: { ar: "صحيح البخاري 4664 — الأب والأبوة", en: "Sahih al-Bukhari 4664 — the father and fatherhood", ur: "صحیح بخاری 4664 — باپ اور والدیت", es: "Sahih al-Bukhari 4664 — El padre y la paternidad" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنِ ابْنِ جُرَيْجٍ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّهُ قَالَ حِينَ وَقَعَ بَيْنَهُ وَبَيْنَ ابْنِ الزُّبَيْرِ قُلْتُ أَبُوهُ الزُّبَيْرُ، وَأُمُّهُ أَسْمَاءُ، وَخَالَتُهُ عَائِشَةُ، وَجَدُّهُ أَبُو بَكْرٍ، وَجَدَّتُهُ صَفِيَّةُ. فَقُلْتُ لِسُفْيَانَ إِسْنَادُهُ. فَقَالَ حَدَّثَنَا، فَشَغَلَهُ إِنْسَانٌ وَلَمْ يَقُلِ ابْنُ جُرَيْجٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4664، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4664 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4664، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4664 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
