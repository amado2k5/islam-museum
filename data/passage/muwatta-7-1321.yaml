label: { ar: "الموطأ 1321 — عبد الله بن المغيرة بن أبي بردة: وجد في برذعة رجل من قبيلة عقد جزع غلولا، فكبر النبي عليهم كما يكبر على الميت", en: "Muwatta 1321" }
text: "كَبَّرَ عَلَيْهمْ، كَمَا يُكبِّرُ على الْمَيِّتِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عبد الله بن المغيرة بن أبي بردة الكناني أنه بلغه أن رسول الله أعطى الناس في قبائلهم يدعو لهم، وترك قبيلة من القبائل. فوجدوا في برذعة رجل منهم عقد جزع غلولا، فأتاهم رسول الله فكبر عليهم كما يكبر على الميت. {cite:muwatta-maruf-1997 p.590}"
