label: { ar: "الموطأ 1321 — عبد الله بن المغيرة بن أبي بردة: وجد في برذعة رجل من قبيلة عقد جزع غلولا، فكبر النبي عليهم كما يكبر على الميت", en: "Muwatta 1321", es: "Muwatta 1321", fr: "Muwatta 1321", ur: "موطا 1321", id: "Al-Muwatta 1321 — Abdullah ibn al-Mughirah ibn Abi Burdah: Seorang pria dari suku tersebut ditemukan membawa kalung akik berikat di pelana kudanya, lalu Nabi (shalawat dan salam kepadanya) membacakan takbir atas mereka sebagaimana beliau membacanya atas orang mati." }
text: "كَبَّرَ عَلَيْهمْ، كَمَا يُكبِّرُ على الْمَيِّتِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عبد الله بن المغيرة بن أبي بردة الكناني أنه بلغه أن رسول الله أعطى الناس في قبائلهم يدعو لهم، وترك قبيلة من القبائل. فوجدوا في برذعة رجل منهم عقد جزع غلولا، فأتاهم رسول الله فكبر عليهم كما يكبر على الميت. {cite:muwatta-maruf-1997 p.590}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Abdullah ibn al-Mughirah ibn Abi Burdah al-Kinani'den rivayet ettiğine göre, Allah Resulü'nün kabilelerine dua ederek insanlara yardım ettiğini, ancak bir kabileyi dışarıda bıraktığını işittiğini anlatır. O kabileden birinin adamın eyerinde bir akik kolye buldular ve bunu zimmete geçirme olarak değerlendirdiler. Bunun üzerine Allah Resulü onlara geldi ve ölü bir kişi için tekbir getirilir gibi onlar için de tekbir getirdi. {cite:muwatta-maruf-1997 s.590}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abdullah ibn al-Mughirah ibn Abi Burdah al-Kinani, bahwa ia mendengar bahwa Rasulullah SAW memberikan kepada orang-orang dalam suku-suku mereka, sambil mendoakan mereka, tetapi beliau meninggalkan satu suku. Mereka menemukan di dalam tas pelana salah seorang dari mereka sebuah kalung batu akik, yang mereka anggap sebagai bentuk penggelapan. Maka Rasulullah SAW datang kepada mereka dan membacakan takbir atas mereka seperti membacakan takbir atas orang yang telah meninggal. {cite:muwatta-maruf-1997 p.590}"
