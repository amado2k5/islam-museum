text: "… الْمُنْكَر مِنَ الإيَمَان ح - باب بَيَانِ كَوْنِ النَّهْيِ عَنِ الْمُنْكَرِ مِنَ الإِيَمانِ، وَأَنَّ الإِيَمَانَ يَزِيدُ وَيَنْقُصُ، وَأَنَّ الأَمْرَ بِالْمَعْرُوفِ، وَالنَّهْيَ عَنِ الْمُنْكَرِ وَاجِبَانٍ عَنْ صُفْيَانَ ح. وحَدّثَنَا مُحَمْدُ ابْنُ الْمُثَّى، حَدَّثَنَا مُحَمَّدُ ابْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةٌ. كِلاهُمَا عَنْ قَيْسٍ …"
summary:
