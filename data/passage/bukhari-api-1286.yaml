label: { ar: "صحيح البخاري 1286 — وزر من تبع", en: "Sahih al-Bukhari 1286 — bearing the burden of those who follow", ur: "صحیح بخاری 1286 — پیروی کرنے والوں کا بوجھ" }
text: "… وَاللَّهِ مَا حَدَّثَ رَسُولُ اللَّهِ إِنَّ اللَّهَ لَيُعَذِّبُ الْمُؤْمِنَ بِبُكَاءِ أَهْلِهِ عَلَيْهِ. وَلَكِنَّ رَسُولَ اللَّهِ قَالَ \" إِنَّ اللَّهَ لَيَزِيدُ الْكَافِرَ عَذَابًا بِبُكَاءِ أَهْلِهِ عَلَيْهِ \". وَقَالَتْ حَسْبُكُمُ الْقُرْآنُ {وَلاَ تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى}. قَالَ ابْنُ عَبَّاسٍما ـ عِنْدَ ذَلِكَ وَاللَّهُ هُوَ أَضْحَكَ وَأَبْكَى. قَالَ ابْنُ أَبِي مُلَيْكَةَ وَاللَّهِ مَا قَالَ ابْنُ عُمَرَما ـ شَيْئًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 1286، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1286, that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1286، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
