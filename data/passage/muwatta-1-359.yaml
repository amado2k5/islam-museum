label: { ar: "الموطأ 359 — عائشة: صلى جالساً وهو شاك وأشار إلى القوم أن اجلسوا", en: "Muwatta 359" }
text: "إنما جعل الإمام ليؤتم به، فإذا ركع فاركعوا، وإذا رفع فارفعوا، وإذا صلى جالساً فصلوا جلوساً"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب صلاة الإمام وهو جالس: صلى النبي وهو شاكٍ فصلى جالساً، وصلى وراءه قوم قياماً فأشار إليهم أن يجلسوا، فلما انصرف أخبرهم أن الإمام إنما جُعل ليؤتم به، فإذا ركع ركعوا وإذا رفع رفعوا وإذا صلى جالساً صلوا جلوساً. ويخرّجه المحقق عند البخاري (688، 1113، 1236) وأبي داود (605) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (22/121). {cite:muwatta-maruf-1997 p.196} {cite:muwatta-maruf-1997 p.197}"
