label: { ar: "الموطأ 359 — عائشة: صلى جالساً وهو شاك وأشار إلى القوم أن اجلسوا", en: "Muwatta 359", es: "Muwatta 359", fr: "Muwatta 359", ur: "موطا 359", tr: "Al-Muwatta 359 — Aişe: Şüphede olduğu halde oturarak namaz kıldı ve insanlara da oturmalarını işaret etti.", id: "Al-Muwatta 359 — Aisyah: Dia shalat sambil duduk ketika dia ragu-ragu dan memberi isyarat kepada orang-orang untuk duduk." }
text: "إنما جعل الإمام ليؤتم به، فإذا ركع فاركعوا، وإذا رفع فارفعوا، وإذا صلى جالساً فصلوا جلوساً"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب صلاة الإمام وهو جالس: صلى النبي وهو شاكٍ فصلى جالساً، وصلى وراءه قوم قياماً فأشار إليهم أن يجلسوا، فلما انصرف أخبرهم أن الإمام إنما جُعل ليؤتم به، فإذا ركع ركعوا وإذا رفع رفعوا وإذا صلى جالساً صلوا جلوساً. ويخرّجه المحقق عند البخاري ⁦(688، 1113، 1236)⁩ وأبي داود (605) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (22/121). {cite:muwatta-maruf-1997 p.196} {cite:muwatta-maruf-1997 p.197}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, dalam surah tentang Imam yang salat sambil duduk: Nabi (shalawat dan salam kepadanya) salat dalam keadaan sakit, sehingga beliau salat sambil duduk. Sekelompok orang salat berdiri di belakangnya, lalu beliau memberi isyarat kepada mereka untuk duduk. Setelah selesai salat, beliau memberitahu mereka bahwa Imam adalah orang yang harus diikuti, jadi ketika beliau rukuk, mereka rukuk; ketika beliau berdiri, mereka berdiri; dan ketika beliau salat sambil duduk, mereka salat sambil duduk. Editor juga memasukkannya dalam kumpulan hadits al-Bukhari (688, 1113, 1236), Abu Dawud (605), Ibn Hibban, Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik, dan beliau merujuk pada al-Tamhid (22/121)."
