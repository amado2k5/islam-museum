label: { ar: "صحيح البخاري 4459 — وصية أو عهد أخير", en: "Sahih al-Bukhari 4459 — a testament or parting counsel", ur: "صحیح بخاری 4459 — وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 4459 — un testamento o consejo de despedida", fr: "Sahih al-Bukhari 4459 — un testament ou un conseil d'adieu" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، أَخْبَرَنَا أَزْهَرُ، أَخْبَرَنَا ابْنُ عَوْنٍ، عَنْ إِبْرَاهِيمَ، عَنِ الأَسْوَدِ، قَالَ ذُكِرَ عِنْدَ عَائِشَةَ أَنَّ النَّبِيَّ أَوْصَى إِلَى عَلِيٍّ، فَقَالَتْ مَنْ قَالَهُ لَقَدْ رَأَيْتُ النَّبِيَّ وَإِنِّي لَمُسْنِدَتُهُ إِلَى صَدْرِي، فَدَعَا بِالطَّسْتِ فَانْخَنَثَ فَمَاتَ، فَمَا شَعَرْتُ، فَكَيْفَ أَوْصَى إِلَى عَلِيٍّ"
summary:
  ar: "حديث في صحيح البخاري، رقم 4459، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4459 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4459، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4459 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un récit du Sahih al-Bukhari, n° 4459 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
