label: { ar: "سنن النسائي 4038 — الأب والأبوة", en: "Sunan al-Nasa'i 4038 — the father and fatherhood", ur: "سنن نسائی 4038 — باپ اور والدیت", es: "Sunan al-Nasa'i 4038 — El padre y la paternidad" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، عَنْ إِبْرَاهِيمَ بْنِ أَبِي الْوَزِيرِ، قَالَ حَدَّثَنَا عَبْدُ الْعَزِيزِ، ح وَأَنْبَأَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ حَدَّثَنَا إِبْرَاهِيمُ بْنُ أَبِي الْوَزِيرِ، قَالَ حَدَّثَنَا الدَّرَاوَرْدِيُّ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ قَوْمًا، أَغَارُوا عَلَى لِقَاحِ رَسُولِ اللَّهِ فَأُتِيَ بِهِمُ النَّبِيُّ فَقَطَّعَ النَّبِيُّ أَيْدِيَهُمْ وَأَرْجُلَهُمْ وَسَمَلَ أَعْيُنَهُمْ. اللَّفْظُ لاِبْنِ الْمُثَنَّى."
summary:
  ar: "حديث في سنن النسائي، رقم 4038، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4038 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4038، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4038 (El Libro de la Lucha [La Prohibición del Derramamiento de Sangre]), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
