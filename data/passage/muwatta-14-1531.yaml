label: { ar: "الموطأ 1531 — أبو الزبير المكي: أتي عمر بن الخطاب بنكاح لم يشهد عليه إلا رجل وامرأة، فقال هذا نكاح السر ولا أجيزه، ولو تقدمت فيه لرجمت", en: "Muwatta 1531", es: "Muwatta 1531", fr: "Muwatta 1531", ur: "موطا 1531", tr: "El-Muvatta 1531 — Ebu el-Zübeyr el-Mekki: Ömer ibn el-Hattab'a, şahit olarak sadece bir erkek ve bir kadının bulunduğu bir nikah gösterildi. Ömer, \"Bu gizli bir nikah ve ben bunu onaylamıyorum. Eğer bunu önceden bilseydim, onları taşlayarak öldürürdüm\" dedi.", id: "Al-Muwatta 1531 — Abu al-Zubayr al-Makki: Umar ibn al-Khattab disuguhi pernikahan yang hanya disaksikan oleh seorang pria dan seorang wanita. Beliau berkata, “Ini adalah pernikahan rahasia, dan saya tidak menyetujuinya. Seandainya saya mengetahuinya sebelumnya, saya akan merajam mereka.”" }
summary:
  ar: "يروي مالك عن أبي الزبير المكي أن عمر بن الخطاب أتي بنكاح لم يشهد عليه إلا رجل وامرأة، فقال هذا نكاح السر، ولا أجيزه، ولو كنت تقدمت فيه لرجمت. {cite:muwatta-maruf-1997 p.42}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den rivayetle, Ömer ibn el-Hattab'a sadece bir erkek ve bir kadının şahitliğinde yapılan bir nikah gösterildiğini anlatır. Ömer, \"Bu gizli bir nikah ve ben bunu onaylamıyorum. Eğer bunu önceden bilseydim, çifti taşlayarak öldürürdüm.\" demiştir. {cite:muwatta-maruf-1997 s.42}"
  id: "Malik meriwayatkan dari Abu al-Zubayr al-Makki bahwa Umar ibn al-Khattab disuguhi pernikahan yang hanya disaksikan oleh seorang pria dan seorang wanita. Beliau berkata, \"Ini adalah pernikahan rahasia, dan saya tidak menyetujuinya. Seandainya saya mengetahuinya sebelumnya, saya akan merajam pasangan itu.\" {cite:muwatta-maruf-1997 p.42}"
