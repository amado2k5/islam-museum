label: { ar: "نوادر جحا الكبرى، ص 144 — «على هذا الحساب نكون في هذه السنة بعمر واحد»", en: "Nawadir Juha al-Kubra, p. 144 — 'By This Reckoning We Are the Same Age This Year'", ur: "نوادر جحا الکبریٰ، ص 144 — «اس حساب سے اس سال ہم ایک ہی عمر کے ہوں گے»", fr: "Nawadir Juha al-Kubra, p. 144 — « À ce compte, nous aurons cette année le même âge »", es: "Nawadir Juha al-Kubra, p. 144 — «Según esta cuenta, este año tendremos la misma edad»" }
text: "… على هذا الحساب نكون في هذه السنة بعمر واحد سألوا الشيخ في أيام صباهُ: أأنت أكبر سناً أم أخوك؟ فأجابهم : في العام الماضي قالت لي أَمِّي إنَّ أخاك أكبر منك بسنةٍ واحدة، وعلى هذا الحساب، فنكونُ كلانا في هذه …"
summary:
  ar: "سُئل جحا صبياً هل هو أكبر من أخيه، فقال إن أمه أخبرته أن أخاه أكبر بسنة، فهما هذه السنة في عمر واحد. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  en: "Asked as a boy whether he is older than his brother, Juha says his mother told him the brother is a year older, so this year they are the same age. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  ur: "بچپن میں جحا سے پوچھا جاتا ہے کہ کیا وہ اپنے بھائی سے بڑا ہے، تو وہ کہتا ہے کہ اس کی ماں نے بتایا ہے کہ بھائی ایک سال بڑا ہے، اس لیے اس سال دونوں ایک ہی عمر کے ہوں گے۔ {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  fr: "Interrogé enfant pour savoir s'il est plus âgé que son frère, Juha dit que sa mère lui a dit que son frère a un an de plus, de sorte que cette année ils ont le même âge. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  es: "Al preguntarle de niño si es mayor que su hermano, Juha dice que su madre le dijo que su hermano es un año mayor, así que este año tienen la misma edad. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
