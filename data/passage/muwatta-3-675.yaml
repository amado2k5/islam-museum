label: { ar: "الموطأ 675 — مالك: التبر والحلي الذي لا ينتفع به للبس فيه الزكاة كل عام، والمكسور الذي يراد إصلاحه بمنزلة المتاع", en: "Muwatta 675" }
summary:
  ar: "قول لمالك: من كان عنده تبر أو حلي من ذهب أو فضة لا يُنتفع به للبس فإن عليه فيه الزكاة في كل عام، يوزن فيؤخذ ربع عشره، إلا أن ينقص عن وزن عشرين ديناراً عيناً أو مئتي درهم فلا زكاة فيه؛ وإنما تكون فيه الزكاة إذا كان يمسكه لغير اللبس، فأما التبر والحلي المكسور الذي يريد أهله إصلاحه ولبسه فهو بمنزلة المتاع الذي يكون عند أهله فلا زكاة عليهم فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.341}"
