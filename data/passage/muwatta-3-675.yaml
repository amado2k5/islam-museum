label: { ar: "الموطأ 675 — مالك: التبر والحلي الذي لا ينتفع به للبس فيه الزكاة كل عام، والمكسور الذي يراد إصلاحه بمنزلة المتاع", en: "Muwatta 675", es: "Muwatta 675", fr: "Muwatta 675", ur: "موطا 675", tr: "Al-Muwatta 675 — Malik: Giymek için kullanılmayan altın ve mücevherler her yıl zekâta tabidir ve tamir edilmesi amaçlanan kırık eşyalar ticari mal olarak kabul edilir.", id: "Al-Muwatta 675 — Malik: Emas dan perhiasan yang tidak digunakan untuk dipakai dikenakan zakat setiap tahun, dan barang rusak yang akan diperbaiki dianggap sebagai barang dagangan." }
summary:
  ar: "قول لمالك: من كان عنده تبر أو حلي من ذهب أو فضة لا يُنتفع به للبس فإن عليه فيه الزكاة في كل عام، يوزن فيؤخذ ربع عشره، إلا أن ينقص عن وزن عشرين ديناراً عيناً أو مئتي درهم فلا زكاة فيه؛ وإنما تكون فيه الزكاة إذا كان يمسكه لغير اللبس، فأما التبر والحلي المكسور الذي يريد أهله إصلاحه ولبسه فهو بمنزلة المتاع الذي يكون عند أهله فلا زكاة عليهم فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.341}"
  tr: "Malik şöyle demiştir: \"Altın veya gümüş külçesi veya takı gibi, takmak için kullanılmayan mücevherlere sahip olan kimse, her yıl bunların zekâtını ödemek zorundadır. Tartılır ve onda birinin dörtte biri (%2,5) alınır; ancak ağırlığı yirmi dinardan veya iki yüz dirhemden az ise zekât verilmez. Zekât, ancak takmak dışında bir amaçla saklandığı takdirde verilir. Sahibi tarafından tamir edilip takılmak üzere saklanan kırık külçe veya mücevherlere gelince, bunlar kişinin sahip olduğu diğer mallar gibidir ve zekât verilmez.\" Araştırmacı, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.341}"
  id: "Malik berkata: Barang siapa memiliki emas batangan atau perak atau perhiasan yang tidak digunakan untuk dipakai, wajib membayar zakat setiap tahunnya. Zakat tersebut ditimbang, dan seperempat persepuluh (2,5%) diambil, kecuali jika beratnya kurang dari dua puluh dinar atau dua ratus dirham, dalam hal ini tidak ada zakat yang wajib dibayar. Zakat hanya wajib dibayar jika disimpan untuk tujuan selain dipakai. Adapun emas batangan atau perhiasan yang rusak yang pemiliknya berniat untuk memperbaikinya dan memakainya, maka sama seperti harta benda lainnya yang dimiliki seseorang, dan tidak ada zakat yang wajib dibayar atasnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.341}"
