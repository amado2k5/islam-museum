label: { ar: "الموطأ 864 — مالك: لم ير أحداً من أهل العلم والفقه يصوم ستة أيام بعد الفطر من رمضان، ولم يبلغه ذلك عن أحد من السلف، ويخافون بدعته", en: "Muwatta 864" }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول في صيام ستة أيام بعد الفطر من رمضان: إنه لم ير أحداً من أهل العلم والفقه يصومها، ولم يبلغه ذلك عن أحد من السلف، وإن أهل العلم يكرهون ذلك ويخافون بدعته، وأن يُلحق برمضان ما ليس منه أهل الجهالة والجفاء، لو رأوا في ذلك رخصة عند أهل العلم ورأوهم يعملون ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (857) وأن الكلام مروي عنه في هذا الباب. {cite:muwatta-maruf-1997 p.417}"
