label: { ar: "الموطأ 864 — مالك: لم ير أحداً من أهل العلم والفقه يصوم ستة أيام بعد الفطر من رمضان، ولم يبلغه ذلك عن أحد من السلف، ويخافون بدعته", en: "Muwatta 864", es: "Muwatta 864", fr: "Muwatta 864", ur: "موطا 864", tr: "El-Muvatta 864 — Malik: O, âlimlerden ve fıkıhçılardan hiçbirinin Ramazan orucunu bozduktan sonra altı gün oruç tuttuğunu görmedi; seleflerinden de böyle bir uygulamayı duymadı ve onlar bunu bir bidat olarak gördüler.", id: "Al-Muwatta 864 — Malik: Dia tidak pernah melihat ulama dan ahli fiqih berpuasa enam hari setelah berbuka puasa Ramadan, dan dia juga tidak pernah mendengar tentang praktik ini dari para pendahulunya, dan mereka khawatir hal itu adalah bid'ah." }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول في صيام ستة أيام بعد الفطر من رمضان: إنه لم ير أحداً من أهل العلم والفقه يصومها، ولم يبلغه ذلك عن أحد من السلف، وإن أهل العلم يكرهون ذلك ويخافون بدعته، وأن يُلحق برمضان ما ليس منه أهل الجهالة والجفاء، لو رأوا في ذلك رخصة عند أهل العلم ورأوهم يعملون ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (857) وأن الكلام مروي عنه في هذا الباب. {cite:muwatta-maruf-1997 p.417}"
  tr: "Yahya şöyle dedi: Malik'in Ramazan'ın bitiminden sonra altı gün oruç tutmakla ilgili olarak şöyle dediğini duydum: Hiçbir âlimin veya fıkıhçının bu şekilde oruç tuttuğunu görmediğini, ilk Müslümanlardan da böyle bir şey duyduğunu söyledi. Ayrıca âlimlerin bu uygulamayı sevmediğini ve bunun bir bidat olabileceğinden, cahil ve bilgisizler insanların, âlimlerden bir muafiyet görüp bunu uyguladıklarını gördüklerinde Ramazan'a ait olmayan şeyler ekleyebileceklerinden korktuklarını ekledi. Editör, bunun Ebu Musab'ın (857) Malik'ten rivayet ettiğini ve bu konudaki sözün ona atfedildiğini belirtiyor. {cite:muwatta-maruf-1997 s.417}"
  id: "Yahya berkata: Saya mendengar Malik berkata mengenai puasa enam hari setelah berakhirnya Ramadan: Beliau belum pernah melihat ulama atau ahli fiqih berpuasa selama enam hari tersebut, dan beliau juga belum pernah mendengar ada Muslim terdahulu yang melakukannya. Beliau menambahkan bahwa para ulama tidak menyukai praktik ini dan khawatir hal itu mungkin merupakan bid'ah, dan bahwa orang-orang yang bodoh dan tidak berpengetahuan mungkin menambahkan sesuatu yang bukan bagian dari Ramadan jika mereka melihat keringanan dari para ulama dan melihat mereka mempraktikkannya. Editor menyebutkan bahwa Abu Mus'ab (857) meriwayatkan hal ini dari Malik, dan bahwa pernyataan ini dinisbahkan kepadanya mengenai topik ini. {cite:muwatta-maruf-1997 p.417}"
