text: "… أَهْلِ الْعِلْمِ أَنَّ النَّصْرانِيَّ إِذَا أَسْلَمَ وُضِعَتْ عَنْهُ جِزْيَةُ رَقَّبَتِهِ. وقَوْلُ النَّبِيِّ لَ في لَيْسَ عَلَى المُسْلِمِينَ جِزْيَةُ عُشُورٍ إِنَّمَا يَعْني بِهِ جِزْيَةَ الرَّقَبَةِ. وفِي الْحَدِيثِ ما يُفَسِّرُ هُذَا حَيْثُ قَالَ: إِنَّمَا العُشُورُ عَلَى التحفة - الزكاة ب، الْيَهُودِ والنَّصَاري، …"
