label: { ar: "سنن أبي داود 1338 — الأب والأبوة", en: "Sunan Abi Dawud 1338 — the father and fatherhood", ur: "سنن ابی داؤد 1338 — باپ اور والدیت", es: "Sunan Abi Dawud 1338 — El padre y la paternidad", fr: "Sunan Abi Dawud 1338 — le père et la paternité" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا وُهَيْبٌ، حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ : كَانَ رَسُولُ اللَّهِ يُصَلِّي مِنَ اللَّيْلِ ثَلاَثَ عَشْرَةَ رَكْعَةً يُوتِرُ مِنْهَا بِخَمْسٍ، لاَ يَجْلِسُ فِي شَىْءٍ مِنَ الْخَمْسِ حَتَّى يَجْلِسَ فِي الآخِرَةِ فَيُسَلِّمَ. قَالَ أَبُو دَاوُدَ : رَوَاهُ ابْنُ نُمَيْرٍ عَنْ هِشَامٍ، نَحْوَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1338، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1338 (Prayer (Kitab Al-Salat): Voluntary Prayers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1338، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1338 (Oración (Kitab Al-Salat): Oraciones voluntarias), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1338 (La Prière (Kitab Al-Salat): Prières surérogatoires), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
