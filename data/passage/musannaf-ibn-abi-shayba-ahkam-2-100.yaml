text: "… من قال: العمرة تطوع... من كان يرى العمرة فريضة... من قال: يُجزئ المتعة من العمرة..... في الرجل إذا فاته الحج ما يكون عليه؟.. في سرعة السير في الحج.. في المتعة من كان يراها أو يرخص فيها.. من كره المُتعة.. فيما …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 100، يرد فيه ذكر الفريضة والفرائض، والتطوع، والرخصة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 100, whose wording mentions the obligation (farida), the voluntary act (tatawwu'), the concession (rukhsa), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
