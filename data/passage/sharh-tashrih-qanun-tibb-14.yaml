text: "… وقد علمت أنا متوقفون في ثبوت هذه العظام. والله ولي التوفيق. الفصل الثاني تشريح عظام القحف قال الشيخ الرئيس رحمة اللّٰه عليه الشرح عظام القحف تطلق تارةً، وبراد بها عظام الرأس كلها واختلف لأطباء فيها. فمنهم من يعد من جملتها …"
summary:
