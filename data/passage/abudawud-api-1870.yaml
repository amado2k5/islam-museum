label: { ar: "سنن أبي داود 1870 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 1870 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 1870 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 1870 — Menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 1870 — mentions de nations, religions et peuples non musulmans", tr: "Sunan Abi Davud 1870 — Gayrimüslim milletlerin, dinlerin ve halkların bahsi", id: "Sunan Abi Dawud 1870 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "حَدَّثَنَا يَحْيَى بْنُ مَعِينٍ، أَنَّ مُحَمَّدَ بْنَ جَعْفَرٍ، حَدَّثَهُمْ حَدَّثَنَا شُعْبَةُ، قَالَ سَمِعْتُ أَبَا قَزَعَةَ، يُحَدِّثُ عَنِ الْمُهَاجِرِ الْمَكِّيِّ، قَالَ سُئِلَ جَابِرُ بْنُ عَبْدِ اللَّهِ عَنِ الرَّجُلِ، يَرَى الْبَيْتَ يَرْفَعُ يَدَيْهِ فَقَالَ مَا كُنْتُ أَرَى أَحَدًا يَفْعَلُ هَذَا إِلاَّ الْيَهُودَ وَقَدْ حَجَجْنَا مَعَ رَسُولِ اللَّهِ فَلَمْ يَكُنْ يَفْعَلُهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1870، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1870 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1870، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1870 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport figurant dans le Sunan Abi Dawud, n° 1870 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sünen Ebu Davud'da yer alan 1870 numaralı hadiste, gayrimüslim milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1870, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
