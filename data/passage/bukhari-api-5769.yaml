label: { ar: "صحيح البخاري 5769 — تمر العجوة، السم", en: "Sahih al-Bukhari 5769 — 'ajwa dates; poison", ur: "صحیح بخاری 5769 — عجوہ کھجور، زہر" }
text: "حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، أَخْبَرَنَا أَبُو أُسَامَةَ، حَدَّثَنَا هَاشِمُ بْنُ هَاشِمٍ، قَالَ سَمِعْتُ عَامِرَ بْنَ سَعْدٍ، سَمِعْتُ سَعْدًا ـ يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ تَصَبَّحَ سَبْعَ تَمَرَاتٍ عَجْوَةً، لَمْ يَضُرُّهُ ذَلِكَ الْيَوْمَ سَمٌّ وَلاَ سِحْرٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5769، يذكر تمر العجوة، والسم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5769 (Medicine), that mentions 'ajwa dates, poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5769، جس میں عجوہ کھجور، زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
