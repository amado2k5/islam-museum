label: { ar: "صحيح مسلم 7097 — الأب والأبوة", en: "Sahih Muslim 7097 — the father and fatherhood", ur: "صحیح مسلم 7097 — باپ اور والدیت", es: "Sahih Muslim 7097 — El padre y la paternidad" }
text: "… بْنُ هَاشِمٍ، قَالاَ حَدَّثَنَا يَحْيَى، - وَهُوَ الْقَطَّانُ - عَنْ سُفْيَانَ، عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ، - قَالَ ابْنُ هَاشِمٍ عَنْ عَبْدِ اللَّهِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، وَقَالَ ابْنُ بَشَّارٍ، عَنِ ابْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، - عَنِ النَّبِيِّ بِنَحْوِ حَدِيثِهِمْ وَقَالاَ جَمِيعًا فِي حَدِيثِهِمَا عَنْ يَحْيَى، \" وَمَثَلُ الْكَافِرِ مَثَلُ الأَرْزَةِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7097، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7097 (Characteristics of the Day of Judgment, Paradise, and Hell), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7097، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 7097 (Características del Día del Juicio, el Paraíso y el Infierno), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
