text: "… بإسناده عن إسماعيل بن مسلم، عن الحسن، عن سليط، قال: انتهيت إلى رسول اللّٰه عليل وهو مُحْتَبٍ في أصحابه. كأني أنظر إلى بياض خاتمه في سواد الليل، فسمعتا يقول: المسلم أخو المسلم، لا يظلمه، ولا يَخْذُله، التقوى هاهنا، وأشار بيده …"
summary:
