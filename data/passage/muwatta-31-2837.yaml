summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة، عن أنس بن مالك، قال: سمعت عمر بن الخطاب، وخرجت معه حتى دخل حائطا، فسمعته وهو يقول، وبيني وبينه جدار، وهو في جوف الحائط: عمر بن الخطاب أمير المؤمنين، بخ بخ! والله يا ابن الخطاب لتتقين الله أو ليعذبنك. {cite:muwatta-maruf-1997 p.591}"
