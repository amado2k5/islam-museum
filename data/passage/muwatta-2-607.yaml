ref: "607"
label: { ar: "الموطأ 607 — المسكينة التي دُفنت ليلاً: ألم آمركم أن تؤذنوني بها؟ فصلى على قبرها أربع تكبيرات", en: "Muwatta 607", es: "Muwatta 607", fr: "Muwatta 607", ur: "موطا 607", tr: "El-Muvatta 607 — Geceleyin gömülen zavallı kadın: Onun ölümünü bana bildirmeni emretmemiş miydim? Bunun üzerine adam onun mezarı başında dört tekbir getirdi.", id: "Al-Muwatta 607 — Perempuan miskin yang dikuburkan pada malam hari: Bukankah Aku telah memerintahkanmu untuk memberitahukan kepadaku tentang kematiannya? Maka ia membacakan empat takbir di atas kuburnya." }
text: "ألم آمركم أن تؤذنوني بها؟"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي أمامة بن سهل بن حنيف، أن مسكينة مرضت فأُخبر النبي بمرضها، وكان يعود المساكين ويسأل عنهم، فأمر أن يُؤذن بها إذا ماتت. فخُرج بجنازتها ليلاً وكرهوا أن يوقظوه، فلما أصبح وأُخبر سألهم لم لم يؤذنوه، فقالوا: كرهنا أن نخرجك ليلاً ونوقظك. فخرج حتى صف بالناس على قبرها وكبر أربع تكبيرات. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي والشافعي والشيباني، وينقل عن ابن عبد البر ⁦(التمهيد 6/254)⁩ أنه لم يُختلف على مالك في إرساله، وأنه حديث مسند متصل صحيح من غير حديث مالك، ويضيف أنه في الصحيحين ⁦(البخاري 1/124 و2/112، ومسلم 3/56)⁩ من حديث أبي رافع عن أبي هريرة. {cite:muwatta-maruf-1997 p.312}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Umame ibn Sahl ibn Huneyf'ten rivayet ettiğine göre, fakir bir kadın hastalandı ve Peygamberimiz bu hastalıktan haberdar oldu. Peygamberimiz fakirleri ziyaret eder ve hal hatırlarını sorardı, bu yüzden kadının ölümünün ilan edilmesini emretti. Cenaze töreni gece yapıldı ve onu uyandırmaktan hoşlanmadılar. Sabah olunca ve ona haber verildiğinde, neden ilan etmediklerini sordu. Onlar da, \"Seni gece dışarı çıkarıp uyandırmaktan hoşlanmadık\" diye cevap verdiler. Bunun üzerine Peygamberimiz dışarı çıktı, insanları kadının kabrinin başına dizdi ve dört tekbir (Allahu Ekber) getirdi. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, el-Ka'nebi, el-Şafiî ve el-Şeybani tarafından da rivayet edildiğini belirtiyor. İbn Abdülberr'in (el-Tamhid 6/254) bu hadisin Malik'in rivayetinin mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğu konusunda bir ihtilaf bulunmadığını ve Malik'inkinden farklı bir rivayet zincirine sahip, sahih, bağlantılı ve güvenilir bir hadis olduğunu söylediğini aktarıyor. Ayrıca, bu hadisin iki Sahih'te (el-Buhari 1/124 ve 2/112 ve Müslim 3/56) Ebu Rafi'nin, Ebu Hurayra'nın rivayetiyle nakledildiğini ekliyor. {cite:muwatta-maruf-1997 s.312}"
  id: "Malik meriwayatkannya dari Ibnu Shihab, dari Abu Umamah ibn Sahl ibn Hunayf, bahwa seorang wanita miskin jatuh sakit, dan Nabi diberitahu tentang penyakitnya. Beliau biasa mengunjungi orang miskin dan menanyakan keadaan mereka, jadi beliau memerintahkan agar kematiannya diumumkan. Prosesi pemakamannya berlangsung pada malam hari, dan mereka tidak suka membangunkan beliau. Ketika pagi tiba dan beliau diberitahu, beliau bertanya kepada mereka mengapa mereka tidak mengumumkannya. Mereka menjawab, \"Kami tidak suka membuatmu keluar di malam hari dan membangunkanmu.\" Maka beliau keluar dan mengumpulkan orang-orang di kuburannya dan mengucapkan empat takbir (Allahu Akbar). Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwayd, al-Qa'nabi, al-Shafi'i, dan al-Shaybani. Ia mengutip Ibnu 'Abd al-Barr (al-Tamhid 6/254) yang mengatakan bahwa tidak ada perbedaan pendapat mengenai riwayat Malik mengenai hadits tersebut sebagai mursal (hadits dengan mata rantai yang hilang dalam sanad), dan bahwa hadits tersebut sahih, terhubung, dan autentik dengan sanad selain riwayat Malik. Ia menambahkan bahwa hadits tersebut ditemukan dalam dua kitab Sahih (al-Bukhari 1/124 dan 2/112, dan Muslim 3/56) berdasarkan riwayat Abu Rafi' yang juga berdasarkan riwayat Abu Hurayrah. {cite:muwatta-maruf-1997 p.312}"
