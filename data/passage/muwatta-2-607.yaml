label: { ar: "الموطأ 607 — المسكينة التي دُفنت ليلاً: ألم آمركم أن تؤذنوني بها؟ فصلى على قبرها أربع تكبيرات", en: "Muwatta 607" }
text: "ألم آمركم أن تؤذنوني بها؟"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي أمامة بن سهل بن حنيف، أن مسكينة مرضت فأُخبر النبي بمرضها، وكان يعود المساكين ويسأل عنهم، فأمر أن يُؤذن بها إذا ماتت. فخُرج بجنازتها ليلاً وكرهوا أن يوقظوه، فلما أصبح وأُخبر سألهم لم لم يؤذنوه، فقالوا: كرهنا أن نخرجك ليلاً ونوقظك. فخرج حتى صف بالناس على قبرها وكبر أربع تكبيرات. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي والشافعي والشيباني، وينقل عن ابن عبد البر (التمهيد 6/254) أنه لم يُختلف على مالك في إرساله، وأنه حديث مسند متصل صحيح من غير حديث مالك، ويضيف أنه في الصحيحين (البخاري 1/124 و2/112، ومسلم 3/56) من حديث أبي رافع عن أبي هريرة. {cite:muwatta-maruf-1997 p.312}"
