text: |-
  *⁦(ناب الميم)⁩
  ٢٨١
  ( خرشم الفراء المخرنشم المتعظلم المتسكبر فى نفسه والمخرنشم أيضا المتغير اللون الذاهب:
  الشحم واللحم عن أبى عمرو ⁦(خرطم)⁩ الخرطوم الانف وخراطيم القوم سادتهم
  والخرطوم الخر قال الشاعر * مهباء خرطوما عقارافرقفا * والخرنطم الغضبان
  المتكبر مع رفع رأسه وجشم بن الخزرج وعوف بن الخزرج يقال اهما الخرطومان
  ⁦(خزم)⁩ الخزم بالتحريل شجر يتخذ من لمائه الحبال الواحدة خزمة وبالمدينة
  سوق يقال لها سوق الخزامين والاخزم الحية الذكر وأخزم اسم دجل قال الراجز
  "نشنة أعرفها من أخزم" قال أبو عبيد أخبرنى ابن الكابى" أنه_ذا الشعر لابى أخزم
  الطانىّ وهو جحاتم طيَ أوجدجده وحكان له ابن يقاله أخزم فات ورك بنيز
  فوثيوايومافى مكان وا-دعلى جدهم فأدموه فقال
  ان بى رقلونى بالدم • شنشنة أعرفها من أخزم
  كأنه كان عاقا وخزمت البعير بالحزامة وهى حلقة من شعر تجعل فى وترة أنفه يشتفيها الزمام
  ويقال لكل مثقوب مخزوم والطيركا،إمخزومة لات وترات أنوفها منة وية ولذلك يقال نعام
  مخزوم وخزمت الجراد فى العود نظمته وخازمت الرجل وهو أن تأخذ فى طريق ويا خذهو
  فى طريق غيره -تى تلتقيا فى مكان واحد والحزومة البقرة بلغة هذيل قال الهذلى
  ان تنتسب تنسب الى عرق ورب * أهل خزومات وشحاج صخب
  والخزامى خيرى البر وقال* وريح الخزامى ونشر القطر • ومخزوم أبوحى من قريس وهو
  مخزوم بن يقظسة بن مرة بن كعب بن لؤى بن غالب و بشر بن أبي خازم شاعر من بنى أسد
  شم للفيشوم أقصى الانف وقد خشمته خشما أى كسرت خيشومه وخياشيم الجبال
  أنوفها ورجل خشام بالضم غليظ الانف وكذلك الجبل الذى له أنف غليظ ورجل أخشم بين
  الخشم وهودا يعترى الانف والخسم بفتح الشين منددة السكران الشديد السكر وخشم
  اللحم تغير ⁦( شرم)⁩ الخشرم الدبر والزنابير قال الاصمعى"لا واحدله من لفظه ور بماسمى
  بيت الزنابير خشرما وقال • كسوام دبر الخشرم المتنوره والخشرم الجارة التى يتخذمنها
  الجصّ وخشرم اسم رجل والخشارم بالضم الاصوات⁦(خصم)⁩ الخصم معروف يستوى
  فيه الجع والمؤنث لانه فى الاصل مصدرومن العرب من يتنيه ويجمعه فيقول خصمان
  وخصوم واللخصيم أيضا انخصم والجمع خصماء وخاصمته مخاصمة وخصاما والاسم الخصومة
  وخاصمت فلانا فخصمته أخصمه بالكسرولا يقال بالضم وهو شاذ ومنه قرأ -زة تاخذهم وهم
  بخصمون لانّ ما كان من أولك فاعلته ففعاته فان يفعل منه ردالى الضم اذ الم يكن فيه حرف
  من حروف الحلق من أى باب كان من الصحيح تقول عالمته فعاته أعله بالضم وفاخرته ففخرته
  أفهره بالفتح لاجل حرف الحلق وأماما كان من المعتل مثل وحدت وبعت ورميت وخشيت
  وسعيت فات جيع ذلك بردالى الكسر الاذوات الواوقانها تردّالى الضم تقول راضيته
  فرضوته أرضوه وخا وفنى نفخفسه أخوفه وليس فى كل شئء يكون هذا لايسال نازعته فنزعته
  لانهم استغنواعنه بغلبته وأما من قرأوهم يخصمون برزديختصمون فيقلب الناءصادا
  فيد غمه وينقل سركته الى اللحاه ومنهسم من لا ينقل ويكسر الخا لاجتماع الساكنين لان
  ٧١
