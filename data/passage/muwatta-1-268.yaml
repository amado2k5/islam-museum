label: { ar: "الموطأ 268 — عمر يخطب فيدخل رجل لم يغتسل: والوضوء أيضاً؟", en: "Muwatta 268", es: "Muwatta 268", fr: "Muwatta 268", ur: "موطا 268", tr: "El-Muvatta 268 — Ömer vaaz verirken, gusül abdesti almamış bir adam içeri girer: “Abdestini de mi aldın?”", id: "Al-Muwatta 268 — Umar sedang berkhutbah ketika seorang pria masuk yang belum melakukan ghusl (mandi wajib): “Dan wudu (bersuci) juga?”" }
text: "والوضوء أيضاً؟ وقد علمت أن رسول الله كان يأمر بالغسل"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سالم بن عبد الله، في باب العمل في غسل يوم الجمعة: دخل رجل من أصحاب النبي المسجد يوم الجمعة وعمر بن الخطاب يخطب، فسأله عمر أية ساعة هذه، فقال إنه انقلب من السوق فسمع النداء فما زاد على أن توضأ، فقال عمر منكراً: والوضوء أيضاً؟ وقد علمت أن النبي كان يأمر بالغسل. ويشرح المحقق إنكار عمر بأنه جمع إلى تأخره عن الجمعة ترك الغسل، ويذكر أنه رواه عن مالك أبو مصعب وسويد وابن وهب والشافعي، وينقل عن ابن عبد البر أن أكثر رواة الموطأ رووه مرسلاً عن سالم، ووصله عن مالك روح بن عبادة وجويرية بن أسماء عند البخاري (878) وابن مهدي عند أحمد وجماعة فقالوا عن سالم عن أبيه، وأن معمراً وأبا أويس وغيرهما رووه عن ابن شهاب موصولاً ⁦(التمهيد 10/68–70)⁩. {cite:muwatta-maruf-1997 p.157} {cite:muwatta-maruf-1997 p.158}"
  tr: "Malik, Cuma günü yapılan gusül abdesti bölümünde, İbn Şihab'dan, o da Salim ibn Abdullah'tan rivayetle şöyle nakletmiştir: Peygamberimizin Sahabelerinden bir adam, Cuma günü Ömer ibn el-Hattab hutbe okurken mescide girdi. Ömer ona saatin kaç olduğunu sordu ve adam, çarşıdan yeni döndüğünü ve ezanı duyduğunu, bu yüzden sadece abdest aldığını söyledi. Ömer, onaylamaz bir şekilde, \"Abdest de mi? Peygamberimizin gusül abdesti almayı emrettiğini biliyorsun.\" dedi. Araştırmacı, Ömer'in onaylamamasının nedenini, adamın gusül abdesti almamış olmasının yanı sıra Cuma namazına geç kalmış olmasıyla açıklıyor. Bu rivayetin Malik'ten Ebu Musab, Suveyd, İbn Vahb ve Şafiî tarafından da nakledildiğini belirtiyor. İbn Abdülberr'in, el-Muvatta'nın ravilerinin çoğunun bunu Salim'den mursal hadis olarak naklettiğini, Ruh ibn Ubadah ve Cüveyriye ibn Esma'nın ise bunu Buhari'de (878) Malik'ten müsned hadis olarak naklettiğini, İbn Mehdi'nin ise Ahmed'de ve Salim'den babasından rivayet edildiğini söyleyen bir grup başkasının da bunu naklettiğini söylediğini aktarıyor. Ma'mar, Ebu Uveys ve diğerleri ise bunu İbn Şihab'dan müsned hadis olarak nakletmişlerdir (el-Temhid 10/68-70). {cite:muwatta-maruf-1997 s.157} {cite:muwatta-maruf-1997 s.158}"
  id: "Malik meriwayatkannya dari Ibnu Shihab, yang juga meriwayatkannya dari Salim bin Abdullah, dalam surah tentang mandi wajib pada hari Jumat: Seorang pria dari kalangan Sahabat Nabi memasuki masjid pada hari Jumat ketika Umar bin al-Khattab sedang menyampaikan khutbah. Umar bertanya kepadanya jam berapa saat itu, dan dia menjawab bahwa dia baru saja kembali dari pasar dan mendengar azan, jadi dia tidak melakukan apa pun selain berwudhu. Umar, dengan nada tidak setuju, berkata: \"Wudhu juga? Kamu tahu bahwa Nabi biasa memerintahkan mandi wajib.\" Peneliti menjelaskan ketidaksetujuan Umar dengan mengatakan bahwa pria itu tidak berwudhu selain terlambat untuk salat Jumat. Dia menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwaid, Ibnu Wahb, dan al-Shafi'i. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa sebagian besar perawi al-Muwatta' meriwayatkan hadits ini sebagai hadits mursal dari Salim, sedangkan Ruh ibn Ubadah dan Juwayriyah ibn Asma' meriwayatkannya sebagai hadits musnad dari Malik dalam al-Bukhari (878), dan Ibnu Mahdi dalam Ahmad, dan sekelompok lainnya, yang mengatakan bahwa hadits ini berasal dari Salim dari ayahnya. Ma'mar, Abu Uways, dan lainnya meriwayatkannya sebagai hadits musnad dari Ibnu Shihab (al-Tamhid 10/68-70). {cite:muwatta-maruf-1997 p.157} {cite:muwatta-maruf-1997 p.158}"
