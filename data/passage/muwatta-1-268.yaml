label: { ar: "الموطأ 268 — عمر يخطب فيدخل رجل لم يغتسل: والوضوء أيضاً؟", en: "Muwatta 268" }
text: "والوضوء أيضاً؟ وقد علمت أن رسول الله كان يأمر بالغسل"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سالم بن عبد الله، في باب العمل في غسل يوم الجمعة: دخل رجل من أصحاب النبي المسجد يوم الجمعة وعمر بن الخطاب يخطب، فسأله عمر أية ساعة هذه، فقال إنه انقلب من السوق فسمع النداء فما زاد على أن توضأ، فقال عمر منكراً: والوضوء أيضاً؟ وقد علمت أن النبي كان يأمر بالغسل. ويشرح المحقق إنكار عمر بأنه جمع إلى تأخره عن الجمعة ترك الغسل، ويذكر أنه رواه عن مالك أبو مصعب وسويد وابن وهب والشافعي، وينقل عن ابن عبد البر أن أكثر رواة الموطأ رووه مرسلاً عن سالم، ووصله عن مالك روح بن عبادة وجويرية بن أسماء عند البخاري (878) وابن مهدي عند أحمد وجماعة فقالوا عن سالم عن أبيه، وأن معمراً وأبا أويس وغيرهما رووه عن ابن شهاب موصولاً (التمهيد 10/68–70). {cite:muwatta-maruf-1997 p.157} {cite:muwatta-maruf-1997 p.158}"
