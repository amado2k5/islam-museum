label: { ar: "موطأ مالك 619 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Muwatta Malik 619 — mentions of non-Muslim nations, religions and peoples", ur: "موطأ مالک 619 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Muwatta Malik 619 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Muwatta Malik 619 — mentions de nations, de religions et de peuples non musulmans" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ عُمَرَ بْنَ عَبْدِ الْعَزِيزِ، كَتَبَ إِلَى عُمَّالِهِ أَنْ يَضَعُوا الْجِزْيَةَ عَمَّنْ أَسْلَمَ مِنْ أَهْلِ الْجِزْيَةِ حِينَ يُسْلِمُونَ. قَالَ مَالِكٌ مَضَتِ السُّنَّةُ أَنْ لاَ جِزْيَةَ عَلَى نِسَاءِ أَهْلِ الْكِتَابِ وَلاَ عَلَى صِبْيَانِهِمْ وَأَنَّ الْجِزْيَةَ لاَ تُؤْخَذُ إِلاَّ مِنَ الرِّجَالِ الَّذِينَ قَدْ بَلَغُوا الْحُلُمَ وَلَيْسَ عَلَى أَهْلِ الذِّمَّةِ وَلاَ عَلَى الْمَجُوسِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 619، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 619 (Zakat), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "موطأ مالک کی حدیث نمبر 619، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 619 (Zakat), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Muwatta Malik, n° 619 (Zakat), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
