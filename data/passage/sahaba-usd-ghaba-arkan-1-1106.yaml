text: "… رسول اللّٰه عل فقال: ما تُذَاكران؟ فقالا : يا رسول اللّٰه، الوسواس، أن يقعَ أحدنا من السماءِ أحب إليه أن يتكلم بما يُوَسوسُ إليه. قال: وقد أصابكم؟ قالوا: نعم. قال: فإن ذلك محض الإيمان. قال ثابت: فقلت أنا: يا ليت …"
