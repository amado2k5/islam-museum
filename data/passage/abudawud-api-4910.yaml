label: { ar: "سنن أبي داود 4910 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 4910 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 4910 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 4910 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 4910 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan Abi Davud 4910 — Neler helaldir, neler haramdır", id: "Sunan Abi Dawud 4910 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ النَّبِيَّ قَالَ \" لاَ تَبَاغَضُوا وَلاَ تَحَاسَدُوا وَلاَ تَدَابَرُوا وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا وَلاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثِ لَيَالٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4910، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4910 (General Behavior (Kitab Al-Adab)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4910، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4910 (Conducta General (Kitab Al-Adab)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4910 (Guide de la conduite générale), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Sünen Ebu Davud'da 4910 numaralı hadis, helal ve haram olanı belirtir. Helal ve Haram rehberinin bu bölümü, helal ve haram konusunda Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntılarla bunu birleştirir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4910, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian dari panduan Halal dan Haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
