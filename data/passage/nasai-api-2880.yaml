label: { ar: "سنن النسائي 2880 — الأب والأبوة", en: "Sunan al-Nasa'i 2880 — the father and fatherhood", ur: "سنن نسائی 2880 — باپ اور والدیت", es: "Sunan al-Nasa'i 2880 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2880 — le père et la paternité" }
text: "… قَالَ \" لَيَؤُمَّنَّ هَذَا الْبَيْتَ جَيْشٌ يَغْزُونَهُ حَتَّى إِذَا كَانُوا بِبَيْدَاءَ مِنَ الأَرْضِ خُسِفَ بِأَوْسَطِهِمْ فَيُنَادِي أَوَّلُهُمْ وَآخِرُهُمْ فَيُخْسَفُ بِهِمْ جَمِيعًا وَلاَ يَنْجُو إِلاَّ الشَّرِيدُ الَّذِي يُخْبِرُ عَنْهُمْ \". فَقَالَ لَهُ رَجُلٌ أَشْهَدُ عَلَيْكَ أَنَّكَ مَا كَذَبْتَ عَلَى جَدِّكَ وَأَشْهَدُ عَلَى جَدِّكَ أَنَّهُ مَا كَذَبَ عَلَى حَفْصَةَ وَأَشْهَدُ عَلَى حَفْصَةَ أَنَّهَا لَمْ تَكْذِبْ عَلَى النَّبِيِّ."
summary:
  ar: "حديث في سنن النسائي، رقم 2880، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2880 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2880، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2880 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2880 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
