text: "… شعب الايمان مرسلاً. وهو معضل كما ترى، لكن له شاهد من حديث ابن عباس بسند حسن أخرجه الحاكم. وروي من حديث أبي هريرة، وقد تكلمت على اسناديها في بحث واسع حول كتاب التاج الجامع للاصول الخمسة لأحد علماء الأزهر وسيبدأ …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 66، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 2, p. 66, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 2، ص 66 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 2, pág. 66, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 2, page 66, mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 2, sayfa 66'dan, inancın dallarını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Mishkat al-Masabih, Jilid Bergambar 2, halaman 66, yang menyebutkan cabang-cabang iman; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
