label: { ar: "الموطأ 2799 — دعاء النبي عند وضع رجله في الغرز للسفر", en: "Muwatta 2799" }
summary:
  ar: "بلغ مالكا أن النبي كان إذا وضع رجله في الغرز وهو يريد السفر دعا بدعاء يسأل الله فيه أن يطوي له الأرض ويهون عليه السفر، ويستعيذ به من وعثاء السفر وكآبة المنقلب وسوء المنظر في المال والأهل، ويقول إن الله هو الصاحب في السفر والخليفة في الأهل. ويذكر المحقق قول ابن عبد البر أن الحديث يستند إلى وجوه صحاح، منها حديث عبد الله بن سرجس في صحيح مسلم، وحديث أبي هريرة وابن عمر. {cite:muwatta-maruf-1997 p.572} {cite:muwatta-maruf-1997 p.573}"
