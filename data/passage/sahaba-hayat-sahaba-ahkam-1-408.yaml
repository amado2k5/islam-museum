text: "… صيامه فريضة وقيام ليله تطوعا، من تقرب فيه بخصلة من الخير كان كمن ادى فريضة قيما سواه، ومن ادى فرينة فيه كان كمن ادى سبعين فريضة فيما سواه، وهو شهر الصير والصبر ثوابه الجنة، وشهر المواساة، وشهر يزاد فى رزق …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 408، يرد فيه ذكر الفريضة والفرائض، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 408, whose wording mentions the obligation (farida), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 408 کا اقتباس جس میں فریضہ اور فرائض، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hayat al-Sahaba de al-Kandahlawi, volume numérisé 1, p. 408, dont le texte mentionne l'obligation (farida), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen digitalizado 1, p. 408, cuyo texto menciona la obligación (farida), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kandhlawi'nin Sahabelerin Biyografileri adlı eserinin resimli 1. cildinin 408. sayfasından bir alıntı, farz olan amelleri, müstehap olan amelleri ve gönüllü amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan amelleri, görevleri, itaat amellerini, müstehap olan amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi para Sahabat karya al-Kandhlawi, jilid 1 bergambar, halaman 408, menyebutkan amalan wajib, amalan anjuran, dan amalan sukarela. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh peramban yang mencakup amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
