label: { ar: "صحيح البخاري 1483 — الأب والأبوة", en: "Sahih al-Bukhari 1483 — the father and fatherhood", ur: "صحیح بخاری 1483 — باپ اور والدیت", es: "Sahih al-Bukhari 1483 — El padre y la paternidad", fr: "Sahih al-Bukhari 1483 — le père et la paternité", tr: "Sahih el-Buhari 1483 — Baba ve Babalık", id: "Sahih al-Bukhari 1483 — Ayah dan Peran Ayah" }
text: "… حَدَّثَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، قَالَ أَخْبَرَنِي يُونُسُ بْنُ يَزِيدَ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ ـ عَنِ النَّبِيِّ قَالَ \" فِيمَا سَقَتِ السَّمَاءُ وَالْعُيُونُ أَوْ كَانَ عَثَرِيًّا الْعُشْرُ، وَمَا سُقِيَ بِالنَّضْحِ نِصْفُ الْعُشْرِ \". قَالَ أَبُو عَبْدِ اللَّهِ هَذَا تَفْسِيرُ الأَوَّلِ لأَنَّهُ لَمْ يُوَقِّتْ فِي الأَوَّلِ ـ يَعْنِي حَدِيثَ ابْنِ عُمَرَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1483، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1483 (Obligatory Charity Tax (Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1483، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1483 (Impuesto obligatorio sobre la caridad (Zakat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1483 (L'aumône obligatoire (Zakat)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 1483 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1483, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
