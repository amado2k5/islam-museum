summary:
  ar: "بلاغ في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب: يروي مالك أنه بلغه أن رجلاً عطس يوم الجمعة والإمام يخطب فشمّته إنسان إلى جنبه، فسأل عن ذلك سعيد بن المسيب فنهاه وقال: لا تعد. ويذكر المحقق أنه رواه عن مالك أبو مصعب بإسناد عن عبد الله بن سعيد بن أبي هند، وسويد. {cite:muwatta-maruf-1997 p.161}"
