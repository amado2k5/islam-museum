label: { ar: "الموطأ 277 — بلاغ: سعيد بن المسيب ينهى عن تشميت العاطس والإمام يخطب", en: "Muwatta 277", es: "Muwatta 277", fr: "Muwatta 277", ur: "موطا 277", tr: "Al-Muwatta 277 — Rivayet: Sa’id ibn al-Musayyab, imam vaaz verirken hapşıran birine “Allah sana rahmet etsin” demeyi yasaklamıştır.", id: "Al-Muwatta 277 — Riwayat: Sa’id ibn al-Musayyab melarang mengucapkan “Semoga Allah merahmatimu” kepada seseorang yang bersin ketika Imam sedang menyampaikan khutbah." }
summary:
  ar: "بلاغ في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب: يروي مالك أنه بلغه أن رجلاً عطس يوم الجمعة والإمام يخطب فشمّته إنسان إلى جنبه، فسأل عن ذلك سعيد بن المسيب فنهاه وقال: لا تعد. ويذكر المحقق أنه رواه عن مالك أبو مصعب بإسناد عن عبد الله بن سعيد بن أبي هند، وسويد. {cite:muwatta-maruf-1997 p.161}"
  tr: "İmamın Cuma günü hutbe okurken dikkatle dinlemekle ilgili rivayet edilen bir rapor: Malik, Cuma günü imam hutbe okurken bir adamın hapşırdığını ve yanındaki birinin \"Allah sana rahmet etsin\" dediğini duyduğunu bildirmiştir. Bunun hakkında Sa'id ibn al-Musayyib'e sormuş ve Sa'id ona bunu yapmamasını söyleyerek, \"Bir daha yapma\" demiştir. Editör, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini ve rivayet zincirinin Abdullah ibn Sa'id ibn Abi Hind ve Suwayd'e kadar uzandığını belirtmektedir. {cite:muwatta-maruf-1997 s.161}"
  id: "Sebuah riwayat mengenai apa yang telah dinarasikan tentang mendengarkan dengan saksama pada hari Jumat ketika Imam sedang menyampaikan khutbah: Malik meriwayatkan bahwa ia mendengar seorang pria bersin pada hari Jumat ketika Imam sedang menyampaikan khutbah, dan seseorang di sebelahnya berkata, \"Semoga Allah merahmatimu.\" Ia bertanya kepada Sa'id ibn al-Musayyib tentang hal ini, dan Sa'id melarangnya melakukan hal itu, dengan berkata, \"Jangan lakukan lagi.\" Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik dengan sanad yang kembali kepada Abdullah ibn Sa'id ibn Abi Hind dan Suwayd. {cite:muwatta-maruf-1997 p.161}"
