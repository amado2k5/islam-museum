text: "… موسى، وعزاه لأبي بكر بن أبي علي. وأخرج من طريق عبد الرحمن بن أبي زياد الإفريقي، - أبو بحر: عن أبيه، عن أبي أيوب: سمعت رسول اللّٰه وعافي يقول : ذكره الدولابي في الكنى. إِنَّ للمُسْلِم عَلَى المُسْلِمِ سِتّ خِصَالٍ …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1626، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
