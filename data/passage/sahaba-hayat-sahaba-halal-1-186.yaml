text: "… فذكر الحديث. كما فى الكنزج ص تعلم الإيمان والعلم والعمل معا اخرج الطبرانى فى الأوسط عن ابن عمرما قال : لقد عشت برهة من دهرى : إن احدنا يؤتى الإيمان قبل القرآن وتنزل السورة على محمد فيتعلم حلالها وحرامها وما …"
