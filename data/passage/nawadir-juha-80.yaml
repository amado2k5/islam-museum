text: "… إذا رأى الجوز يخرج كانت زوجته حاملاً، ولما جاء وقت الوضع عَسُرَ عليها الطلق فارتفعَ ضجيجُ النساء وجِئْنَ إليه يقلْنَ له: اُدعُ لها أَنْ يَسْهُلَ عليها الوضعُ وإلا ماتَتْ أو اختنقَ المولودُ، فهز رأسَه وخرج مسرعاً إلى السوق، فاشترى مِقداراً …"
summary:
  ar: "في ولادة عسيرة اشترى جحا جوزًا ووضعه تحت كرسي زوجته، وقال إن الطفل قد يخرج ليلعب به. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  en: "In a difficult childbirth, Juha buys walnuts and places them under his wife's chair, saying that the child may come out to play with them. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  ur: "مشکل زچگی کے وقت جحا نے اخروٹ خریدے اور انہیں بیوی کی کرسی کے نیچے رکھ دیا اور کہا کہ بچہ شاید ان سے کھیلنے کے لیے باہر آ جائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  fr: "Lors d'un accouchement difficile, Juha achète des noix et les place sous la chaise de sa femme, disant que l'enfant sortira peut-être pour jouer avec. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  es: "En un parto difícil, Juha compra nueces y las coloca bajo la silla de su mujer, diciendo que el niño quizá salga a jugar con ellas. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
