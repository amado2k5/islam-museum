text: "… أَعْجَمِيٌّ وَهَٰذَا لِسَانُ عَرَبٌّ مُبِينٌ. قال ابن هشام: يُلْجِدُونَ إليه: يميلون إليه، والإلحاد: المَيْلُ عَنِ الحَقِّ؛ قال رؤبة بن العجَّاج من الرجز : إِذا تَبِعَ الضَّحَاكَ كُلُّ مُلْجِدِ قال ابن هشام : يعني الضَّحَاك الخارجي، وهذا البيت في أُرجوزة له. …"
