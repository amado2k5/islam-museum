text: "… فسجا فيها سجدتين. - حدثنا وكيع عن شعبة عن يزيد بن خُمير عن عبد الرحمن ابن جُبير بن تُفير عن أبيه: أن أبا الدرداء سجد في الحج سجدتين. - حدثنا حفص عن عاصم عن أبي العالية عن ابن عباس قال: …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 1501، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
