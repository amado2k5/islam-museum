label: { ar: "سنن النسائي 4651 — ما خلّفه من تركة وميراث", en: "Sunan al-Nasa'i 4651 — what was left behind: estate and inheritance", ur: "سنن نسائی 4651 — ترکہ اور میراث", es: "Sunan al-Nasa'i 4651 — Lo que quedó: patrimonio y herencia", fr: "Sunan al-Nasa'i 4651 — Ce qui a été laissé derrière: biens et héritage", tr: "Sunan an-Nasa'i 4651 — Miras ve vesayet olarak geride bıraktığı şeyler", id: "Sunan an-Nasa'i 4651 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "أَخْبَرَنَا يُوسُفُ بْنُ حَمَّادٍ، قَالَ حَدَّثَنَا سُفْيَانُ بْنُ حَبِيبٍ، عَنْ هِشَامٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ تُوُفِّيَ رَسُولُ اللَّهِ وَدِرْعُهُ مَرْهُونَةٌ عِنْدَ يَهُودِيٍّ بِثَلاَثِينَ صَاعًا مِنْ شَعِيرٍ لأَهْلِهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 4651، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4651 (The Book of Financial Transactions), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 4651، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4651 (El Libro de las Transacciones Financieras), menciona lo que quedó tras de sí: bienes y herencias. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un rapport du Sunan al-Nasa'i, n° 4651 (Le Livre des transactions financières), mentionne ce qui a été laissé: biens et héritage. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des heures ultimes, des biens, des reliques et des tombes."
  tr: "Sunan-ı Nesai'de yer alan 4651 numaralı hadis, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi vermektedir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4651, menyebutkan apa yang ditinggalkannya berupa harta warisan. Hadits ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam suci, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
