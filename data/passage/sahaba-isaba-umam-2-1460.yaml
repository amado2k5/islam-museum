text: "… عمر الكندي بالسوء، قال: فوجم لها، ثم قال له: أعد فأعاد، ثم في أمراء مصر؛ فقال: المقوقس بن قرقوب أمير القبط قال له حاطب إنه كان قبلك رجل زعم أنه الرب بمصر من قبل ملك الروم. الأعلى، فانتقم اللّٰه منه …"
