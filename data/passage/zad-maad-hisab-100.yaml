text: "… عليع يُصلي سنة الفجر والوتر بسورتي الإخلاص، وهما الجامعتان لتوحيدِ العلم والعمل، وتوحيدٍ المعرفة والإرادة، وتوحيدِ الاعتقادِ والقصد، انتهى . توضيح لمعنى: سورة الإخلاص تعدل ثلث القرآن والزلزلة نصفه والكافرون ربعه فسورة قُلْ هُوَ اللَّهُ أَحَدُ : متضمنة لتوحيد ١٠٠"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 100، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 100, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
