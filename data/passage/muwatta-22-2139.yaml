label: { ar: "الموطأ 2139 — يحيى عن مالك: في العبد يرهنه سيده، وللعبد مال: إن مال العبد ليس برهن، إلا أن يشترطه المرتهن", en: "Muwatta 2139", es: "Muwatta 2139", fr: "Muwatta 2139", ur: "موطا 2139", tr: "El-Muvatta 2139 — Yahya, Malik'ten rivayetle: Efendisinin rehin olarak verdiği ve malı olan bir köle hakkında: Kölenin malı, rehin alan kişi aksini şart koşmadıkça rehin sayılmaz.", id: "Al-Muwatta 2139 — Yahya berdasarkan riwayat Malik: Mengenai seorang budak yang dijadikan jaminan oleh tuannya, dan budak tersebut memiliki harta benda: Harta benda budak tersebut tidak dianggap sebagai jaminan kecuali jika penerima jaminan menetapkannya." }
summary:
  ar: "قال: وسمعت مالكا يقول في العبد يرهنه سيده، وللعبد مال: إن مال العبد ليس برهن، إلا أن يشترطه المرتهن. {cite:muwatta-maruf-1997 p.274}"
  tr: "Şöyle dedi: Malik'in, efendisinin rehin olarak verdiği ve kölenin malı olan bir köle hakkında şöyle dediğini duydum: Kölenin malı, rehin alan kişi aksini şart koşmadıkça rehin olarak kabul edilmez. {cite:muwatta-maruf-1997 s.274}"
  id: "Dia berkata: Saya mendengar Malik berkata mengenai seorang budak yang dijadikan jaminan oleh tuannya, dan budak itu memiliki harta benda: Harta benda budak itu tidak dianggap sebagai jaminan kecuali jika penerima jaminan menetapkannya. {cite:muwatta-maruf-1997 p.274}"
