text: "… كان يسجد حتى تقع العصافير على ظهره قال فكأنه جذم حائط. حدثنا عبدالله حدئني عثمان بن أبي شيبة حدثنا معاوية بن هشام حدثنا سفيان عن رجل عن خيتم أنه أوصى أن يدفن في مقبرة فقراء قومه. جمع حرقفة وهو عظم …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 3، ص 433، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 3, p. 433, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 3، ص 433 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
