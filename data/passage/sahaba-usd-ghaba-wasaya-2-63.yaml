text: "… وينهى عن ملائمها إسماعيل، فنصب الأونان، وسيَّب السائبة، وبَحَر البحيرة، ووصل الوصيلة، وحمى الحامي. مسلم فكونوا في هذا الأمر رؤوساء ولا تكونوا أذناباً،. وكونوا فيه أولاً ولا تكونوا آخراً، فلم يلبث أن حضرته الوفاة، فأوصى أهله: أوصيكم بتقوى اللّٰه قال …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 63، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 63, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 63 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 2, pág. 63, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Usd al-Ghaba d'Ibn al-Athir, tome 2, page 63, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 2, sayfa 63'ten, son vasiyetname ve ölüm saatinden bahseden bir bölüm; makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
