label: { ar: "الموطأ 1952 — مالك: القصارة والخياطة والصباغ وما أشبهها بمنزلة البز، يحسب فيها الربح كما يحسب في البز، فإن باع البز ولم يبين شيئا منها فلا يحسب له فيه ربح، فإن فات البز حسب الكراء ولم يحسب عليه ربح، وإن لم يفت فالبيع مفسوخ", en: "Muwatta 1952", es: "Muwatta 1952", fr: "Muwatta 1952", ur: "موطا 1952", tr: "El-Muvatta 1952 — Malik: Çamaşır yıkama, terzilik, boyama ve benzeri işler kumaş satmak gibidir. Bunlarda da kumaş satarken olduğu gibi kar hesaplanır. Eğer kumaşı kullanım amacını belirtmeden satarsa, kendisine kar hesaplanmaz. Kumaş kaybolursa, kira hesaplanır ve yine kar hesaplanmaz. Kaybolmazsa, satış geçersizdir.", id: "Al-Muwatta 1952 — Malik: Mencuci, menjahit, mewarnai, dan sejenisnya dianggap seperti menjual kain. Keuntungan dihitung sebagaimana keuntungan dihitung dalam penjualan kain. Jika ia menjual kain tanpa menyebutkan kegunaannya, maka tidak ada keuntungan yang dihitung untuknya. Jika kain tersebut hilang, maka sewa dihitung dan tidak ada keuntungan yang dihitung atasnya. Jika tidak hilang, maka penjualan tersebut batal." }
summary:
  ar: "قال مالك: فأما القصارة والخياطة والصباغ وما أشبه ذلك، فهو بمنزلة البز، يحسب فيه الربح كما يحسب في البز. فإن باع البز ولم يبين شيئا مما سميت، فإنه لا يحسب له فيه ربح. فإن فات البز، فإن الكراء يحسب، ولا يحسب عليه ربح. فإن لم يفت البز، فالبيع مفسوخ بينهما، إلا أن يتراضيا على شيء مما يجوز بينهما. {cite:muwatta-maruf-1997 p.198}"
  tr: "Malik şöyle dedi: Terzilik, dikiş, boyama ve benzeri işler kumaş gibi değerlendirilir; kumaşta olduğu gibi kârı da hesaplanır. Eğer kumaşı belirtilen şartlardan herhangi birini belirtmeden satarsa, kendisine kâr hesaplanmaz. Kumaş kaybolursa, kira hesaplanır, ancak kâr hesaplanmaz. Kumaş kaybolmazsa, aralarında caiz olan bir şey üzerinde anlaşmadıkları sürece, satış geçersizdir. {cite:muwatta-maruf-1997 s.198}"
  id: "Malik berkata: Adapun menjahit, menyulam, mewarnai, dan sejenisnya, diperlakukan seperti kain; keuntungan dihitung sebagaimana halnya kain. Jika ia menjual kain tanpa menyebutkan salah satu syarat yang disebutkan, maka tidak ada keuntungan yang dihitung untuknya. Jika kain hilang, maka sewa dihitung, tetapi tidak ada keuntungan yang dihitung. Jika kain tidak hilang, maka penjualan tersebut batal di antara mereka, kecuali jika mereka menyepakati sesuatu yang diperbolehkan di antara mereka. {kutipan:muwatta-maruf-1997 hlm.198}"
