label: { ar: "الموطأ 1952 — مالك: القصارة والخياطة والصباغ وما أشبهها بمنزلة البز، يحسب فيها الربح كما يحسب في البز، فإن باع البز ولم يبين شيئا منها فلا يحسب له فيه ربح، فإن فات البز حسب الكراء ولم يحسب عليه ربح، وإن لم يفت فالبيع مفسوخ", en: "Muwatta 1952" }
summary:
  ar: "قال مالك: فأما القصارة والخياطة والصباغ وما أشبه ذلك، فهو بمنزلة البز، يحسب فيه الربح كما يحسب في البز. فإن باع البز ولم يبين شيئا مما سميت، فإنه لا يحسب له فيه ربح. فإن فات البز، فإن الكراء يحسب، ولا يحسب عليه ربح. فإن لم يفت البز، فالبيع مفسوخ بينهما، إلا أن يتراضيا على شيء مما يجوز بينهما. {cite:muwatta-maruf-1997 p.198}"
