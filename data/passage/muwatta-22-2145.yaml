label: { ar: "الموطأ 2145 — يحيى عن مالك: وكذلك الرجل يبضع معه الرجل بضاعة فيأمره صاحب المال أن يشتري له سلعة باسمها فيخالف، فصاحب البضاعة بالخيار: إن أحب أخذ ما اشتري بماله، وإن أحب أن يكون المبضع معه ضامنا لرأس ماله فذلك له", en: "Muwatta 2145" }
summary:
  ar: "قال: وكذلك أيضا، الرجل يبضع معه الرجل بضاعة، فيأمره صاحب المال أن يشتري له سلعة باسمها، فيخالف، فيشتري ببضاعته غير ما أمره به، ويتعدى ذلك، فإن صاحب البضاعة عليه بالخيار: إن أحب أن يأخذ ما اشتري بماله أخذه، وإن أحب أن يكون المبضع معه ضامنا لرأس ماله، فذلك له. {cite:muwatta-maruf-1997 p.277}"
