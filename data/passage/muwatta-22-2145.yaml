label: { ar: "الموطأ 2145 — يحيى عن مالك: وكذلك الرجل يبضع معه الرجل بضاعة فيأمره صاحب المال أن يشتري له سلعة باسمها فيخالف، فصاحب البضاعة بالخيار: إن أحب أخذ ما اشتري بماله، وإن أحب أن يكون المبضع معه ضامنا لرأس ماله فذلك له", en: "Muwatta 2145", es: "Muwatta 2145", fr: "Muwatta 2145", ur: "موطا 2145", tr: "El-Muvatta 2145 — Yahya, Malik'ten rivayetle: Aynı şekilde, bir kimse başka bir kimseye mal emanet ederse ve mal sahibi ona kendi adına mal satın almasını emrederse, fakat o emre itaat etmezse, mal sahibinin seçeneği vardır: İsterse, kendi parasıyla satın alınan malları alabilir; isterse de mal emanet eden kişi sermayesinden sorumlu kalabilir ve bu onun hakkıdır.", id: "Al-Muwatta 2145 — Yahya berdasarkan riwayat Malik: Demikian juga, jika seseorang mempercayakan barang dagangan kepada orang lain, dan pemilik barang dagangan tersebut memerintahkannya untuk membeli barang atas namanya, tetapi ia tidak taat, maka pemilik barang dagangan tersebut memiliki pilihan: jika ia mau, ia dapat mengambil apa yang telah dibeli dengan uangnya, dan jika ia mau, orang yang mempercayakan barang dagangan tersebut dapat tetap bertanggung jawab atas modalnya, dan itu adalah haknya." }
summary:
  ar: "قال: وكذلك أيضا، الرجل يبضع معه الرجل بضاعة، فيأمره صاحب المال أن يشتري له سلعة باسمها، فيخالف، فيشتري ببضاعته غير ما أمره به، ويتعدى ذلك، فإن صاحب البضاعة عليه بالخيار: إن أحب أن يأخذ ما اشتري بماله أخذه، وإن أحب أن يكون المبضع معه ضامنا لرأس ماله، فذلك له. {cite:muwatta-maruf-1997 p.277}"
  tr: "Şöyle dedi: Benzer şekilde, bir adam başka bir adama mal emanet ederse ve paranın sahibi ona belirli bir malı satın almasını söylerse, ancak o emre uymayıp, kendisine emredilenden farklı bir şey satın alır ve bu miktarı aşarsa, malın sahibinin iki seçeneği vardır: Eğer parasıyla satın alınanları geri almak isterse, bunu yapabilir; eğer emanet edilen adamın sermayesini güvence altına alarak yanında kalmasını isterse, bu onun hakkıdır. {cite:muwatta-maruf-1997 s.277}"
  id: "Dia berkata: Demikian pula, jika seseorang mempercayakan barang dagangan kepada orang lain, dan pemilik uang tersebut menginstruksikan orang tersebut untuk membeli barang tertentu, tetapi orang tersebut tidak patuh dan membeli sesuatu selain yang diperintahkan untuk dibeli dengan barang dagangannya, dan melebihi jumlah yang seharusnya, maka pemilik barang dagangan tersebut memiliki pilihan: jika ia ingin mengambil kembali apa yang telah dibeli dengan uangnya, ia dapat melakukannya, dan jika ia ingin orang yang dipercayakan tersebut tetap bersamanya, menjamin modalnya, maka itu adalah haknya. {cite:muwatta-maruf-1997 p.277}"
