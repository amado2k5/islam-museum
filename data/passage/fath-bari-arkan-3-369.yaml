text: "… للدرسل اليهم أى يئس الرسل من إيمان من أرسلوا إليه، وظن المرسل اليهم أن الرسل كذبوهم فى جميع ما أدعوه من النبوة والوعد بالنصر لن اطاعهم والوعيد بالمذاب لمن لم يجبهم، واذا كان ذلك محتملا وجب تنزيه أبن عبأس عن …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 369، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 3, p. 369, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 3، ص 369 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
