label: { ar: "صحيح مسلم 1906 — الأحرف السبعة", en: "Sahih Muslim 1906 — the seven ahruf", ur: "صحیح مسلم 1906 — سبعہ احرف", es: "Sahih Muslim 1906 — los siete ahruf", fr: "Sahih Muslim 1906 — les sept ahruf" }
text: "… وَمَغْفِرَتَهُ وَإِنَّ أُمَّتِي لاَ تُطِيقُ ذَلِكَ \". ثُمَّ أَتَاهُ الثَّانِيَةَ فَقَالَ إِنَّ اللَّهَ يَأْمُرُكَ أَنْ تَقْرَأَ أُمَّتُكَ الْقُرْآنَ عَلَى حَرْفَيْنِ فَقَالَ \" أَسْأَلُ اللَّهَ مُعَافَاتَهُ وَمَغْفِرَتَهُ وَإِنَّ أُمَّتِي لاَ تُطِيقُ ذَلِكَ \". ثُمَّ جَاءَهُ الثَّالِثَةَ فَقَالَ إِنَّ اللَّهَ يَأْمُرُكَ أَنْ تَقْرَأَ أُمَّتُكَ الْقُرْآنَ عَلَى ثَلاَثَةِ أَحْرُفٍ. فَقَالَ \" أَسْأَلُ اللَّهَ مُعَافَاتَهُ وَمَغْفِرَتَهُ وَإِنَّ أُمَّتِي لاَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1906، يذكر الأحرف السبعة. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih Muslim, no. 1906 (The Book of Prayer - Travellers), that mentions the seven ahruf. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح مسلم کی حدیث نمبر 1906، جس میں سبعہ احرف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 1906 (El Libro de la Oración - Viajeros), menciona los siete ahruf. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un récit du Sahih Muslim, n° 1906 (Le Livre de la prière – Guide du voyageur), mentionne les sept ahruf. Le catalogue du musée consacré à la lecture et à l'écriture du Coran les répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
