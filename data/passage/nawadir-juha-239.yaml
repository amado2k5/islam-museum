label: { ar: "نوادر جحا الكبرى، ص 115 — «أرى رؤيا جميلة فهاتي النظارات لأدقق خفاياها»", en: "Nawadir Juha al-Kubra, p. 115 — 'I See a Lovely Dream, So Bring the Spectacles'", ur: "نوادر جحا الکبریٰ، ص 115 — «میں حسین خواب دیکھ رہا ہوں، عینک لاؤ»", fr: "Nawadir Juha al-Kubra, p. 115 — « Je vois un beau rêve, apporte les lunettes »", es: "Nawadir Juha al-Kubra, p. 115 — «Veo un sueño hermoso, trae los anteojos»", tr: "Juha'nın Büyük Fıkraları, s. 115 — “Çok güzel bir vizyonum var, sırlarını inceleyebilmem için bana gözlükleri getirin.”", id: "Anekdot Hebat Juha, hlm. 115 — “Aku memiliki penglihatan yang indah, jadi bawakan aku kacamata agar aku dapat memeriksa rahasianya.”" }
text: "… أرى رؤيا جميلةً فهاتي النظارات لأُدُقِّق خفاياها هبَّ من نومِهِ ذات يوم، وقال لامرأته : هلمّي أسرعي بالنظارات قبل أن يذهب نومي. فناولته إيَّاها وقالت له: ما سبب هذا الاهتمام؟ فقال: إني أرى رؤيا لطيفةً جداً، وأريد أن أَدقّق في …"
summary:
  ar: "استيقظ جحا وطلب من زوجته أن تحضر النظارات بسرعة ليدقق في تفاصيل حلم جميل قبل أن يفارقه. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  en: "Juha wakes and tells his wife to bring his spectacles quickly so that he can study the details of a lovely dream before it leaves him. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  ur: "جحا جاگ کر بیوی سے کہتا ہے کہ جلدی عینک لاؤ تاکہ وہ ایک حسین خواب کی تفصیلات کو اس کے رخصت ہونے سے پہلے غور سے دیکھ لے۔ {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  fr: "Juha se réveille et dit à sa femme d'apporter vite ses lunettes afin d'étudier les détails d'un beau rêve avant qu'il ne le quitte. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  es: "Juha despierta y dice a su esposa que traiga rápido sus anteojos para estudiar los detalles de un sueño hermoso antes de que se le vaya. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  tr: "Juha uyandı ve karısından gözlüklerini hemen getirmesini istedi, böylece güzel rüyasının ayrıntılarını rüyası bitmeden inceleyebilsin. {cite:juha-nawadir-kubra-djuwaydi s. 115}"
  id: "Juha terbangun dan meminta istrinya untuk segera membawakan kacamatanya agar ia dapat memeriksa detail mimpinya yang indah sebelum mimpi itu hilang. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
