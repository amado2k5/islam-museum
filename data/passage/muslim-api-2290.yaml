label: { ar: "صحيح مسلم 2290 — كتابة الحسنات", en: "Sahih Muslim 2290 — the writing of good deeds", ur: "صحیح مسلم 2290 — نیکیوں کا لکھا جانا" }
text: "… اللَّهِ لأَهْلِ الإِسْلاَمِ فِي مَرْجٍ وَرَوْضَةٍ فَمَا أَكَلَتْ مِنْ ذَلِكَ الْمَرْجِ أَوِ الرَّوْضَةِ مِنْ شَىْءٍ إِلاَّ كُتِبَ لَهُ عَدَدَ مَا أَكَلَتْ حَسَنَاتٌ وَكُتِبَ لَهُ عَدَدَ أَرْوَاثِهَا وَأَبْوَالِهَا حَسَنَاتٌ وَلاَ تَقْطَعُ طِوَلَهَا فَاسْتَنَّتْ شَرَفًا أَوْ شَرَفَيْنِ إِلاَّ كَتَبَ اللَّهُ لَهُ عَدَدَ آثَارِهَا وَأَرْوَاثِهَا حَسَنَاتٍ وَلاَ مَرَّ بِهَا صَاحِبُهَا عَلَى نَهْرٍ فَشَرِبَتْ مِنْهُ وَلاَ يُرِيدُ أَنْ يَسْقِيَهَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2290، يذكر كتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 2290 (The Book of Zakat), that speaks of the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 2290، جس میں نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
