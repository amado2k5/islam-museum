label: { ar: "صحيح مسلم 2290 — كتابة الحسنات", en: "Sahih Muslim 2290 — the writing of good deeds", ur: "صحیح مسلم 2290 — نیکیوں کا لکھا جانا", es: "Sahih Muslim 2290 — El registro de las buenas obras", fr: "Sahih Muslim 2290 — le récit des bonnes actions", tr: "Sahih Muslim 2290 — İyi amelleri yazmak", id: "Sahih Muslim 2290 — Mencatat amal kebaikan" }
text: "… اللَّهِ لأَهْلِ الإِسْلاَمِ فِي مَرْجٍ وَرَوْضَةٍ فَمَا أَكَلَتْ مِنْ ذَلِكَ الْمَرْجِ أَوِ الرَّوْضَةِ مِنْ شَىْءٍ إِلاَّ كُتِبَ لَهُ عَدَدَ مَا أَكَلَتْ حَسَنَاتٌ وَكُتِبَ لَهُ عَدَدَ أَرْوَاثِهَا وَأَبْوَالِهَا حَسَنَاتٌ وَلاَ تَقْطَعُ طِوَلَهَا فَاسْتَنَّتْ شَرَفًا أَوْ شَرَفَيْنِ إِلاَّ كَتَبَ اللَّهُ لَهُ عَدَدَ آثَارِهَا وَأَرْوَاثِهَا حَسَنَاتٍ وَلاَ مَرَّ بِهَا صَاحِبُهَا عَلَى نَهْرٍ فَشَرِبَتْ مِنْهُ وَلاَ يُرِيدُ أَنْ يَسْقِيَهَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2290، يذكر كتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 2290 (The Book of Zakat), that speaks of the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 2290، جس میں نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato del Sahih Muslim, n.º 2290 (El Libro del Zakat), que habla de la escritura de las buenas obras. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o ponderan una obra."
  fr: "Un hadith du Sahih Muslim, n° 2290 (Le Livre de la Zakat), mentionne la consignation des bonnes actions. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui recensent, inscrivent, effacent ou pèsent une action."
  tr: "Sahih Müslim'de 2290 numaralı hadis, iyi amellerin kaydedilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesini ve amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2290, menyebutkan pencatatan amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
