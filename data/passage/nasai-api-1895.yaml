label: { ar: "سنن النسائي 1895 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 1895 — a burial, grave or resting place", ur: "سنن نسائی 1895 — تدفین، قبر اور مرقد", es: "Sunan al-Nasa'i 1895 — un lugar de entierro, tumba o descanso.", fr: "Sunan al-Nasa'i 1895 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… وَاللَّفْظُ لَهُ - قَالَ أَنْبَأَنَا حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ أَخْبَرَنِي أَبُو الزُّبَيْرِ، أَنَّهُ سَمِعَ جَابِرًا، يَقُولُ خَطَبَ رَسُولُ اللَّهِ فَذَكَرَ رَجُلاً مِنْ أَصْحَابِهِ مَاتَ فَقُبِرَ لَيْلاً وَكُفِّنَ فِي كَفَنٍ غَيْرِ طَائِلٍ فَزَجَرَ رَسُولُ اللَّهِ أَنْ يُقْبَرَ إِنْسَانٌ لَيْلاً إِلاَّ أَنْ يُضْطَرَّ إِلَى ذَلِكَ وَقَالَ رَسُولُ اللَّهِ \" إِذَا وَلِيَ أَحَدُكُمْ أَخَاهُ فَلْيُحَسِّنْ كَفَنَهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1895، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1895 (The Book of Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 1895، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1895 (El Libro de los Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Sunan al-Nasa'i, n° 1895 (Le Livre des Funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
