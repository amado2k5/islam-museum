text: "لُعِنَ ٱلَّذِينَ كَفَرُوا۟ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى ٱبْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ"
text_search: "لعن الذين كفروا من بني إسرائيل على لسان داوود وعيسى ابن مريم ۚ ذلك بما عصوا وكانوا يعتدون"
translations:
  en: { text: "Those of the Children of Israel who went astray were cursed by the tongue of David, and of Jesus, son of Mary. That was because they rebelled and used to transgress.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "جو لوگ بنی اسرائیل میں کافر ہوئے ان پر داؤد اور عیسیٰ بن مریم کی زبان سے لعنت کی گئی یہ اس لیے کہ نافرمانی کرتے تھے اور حد سے تجاوز کرتے تھے", translator: "Fateh Muhammad Jalandhari", license: PD }
