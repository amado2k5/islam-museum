text: "… حين سَمِعَ تَكْبِيرَ عمر في الصلاةِ: أَيْنَ أبُو بَكْرٍ؟ يَأْبَى اللّٰه ذَلِكَ وَالْمُسْلِمُونَ فلولا مَقَالةٌ قالها عُمَرُ عند وفاتِهِ ؛ لم يَشُكّ المسلمون أنّ رَسُول الله للفي قدِ اسْتَخْلَفَ أبا بكر، ولكنه قال عند وفاته : إنْ أَسْتَخْلِف، فقد اسْتَخْلَفَ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 667، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 667, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 667 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
