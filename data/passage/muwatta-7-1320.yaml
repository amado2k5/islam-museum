label: { ar: "الموطأ 1320 — زيد بن خالد الجهني: توفي رجل يوم حنين فقال النبي صلوا على صاحبكم، فقد غل في سبيل الله", en: "Muwatta 1320", es: "Muwatta 1320", fr: "Muwatta 1320", ur: "موطا 1320", tr: "El-Muvatta 1320 — Zeyd ibn Halid el-Cuhani: Huneyn günü bir adam öldü. Peygamberimiz şöyle buyurdu: \"Arkadaşın için dua et, çünkü o Allah yolunda zimmetine para geçirdi.\"", id: "Al-Muwatta 1320 — Zayd ibn Khalid al-Juhani: Seorang pria meninggal pada hari Hunayn, lalu Nabi bersabda, “Berdoalah untuk temanmu, karena dia telah menggelapkan harta di jalan Allah.”" }
text: "إنَّ صَاحِبكُمْ قَدْ غَلَّ في سَبِيلِ اللهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان أن زيد بن خالد الجهني قال توفي رجل يوم حنين، فذكروه لرسول الله، فقال صلوا على صاحبكم، فتغيرت وجوه الناس لذلك، فقال إن صاحبكم قد غل في سبيل الله. ففتحنا متاعه فوجدنا خرزات من خرز يهود لا تساوي درهمين. ويذكر المحقق أن ابن عبد البر رأى في اسم الراوي عن زيد خلافا، والصحيح عن أبي عمرة. {cite:muwatta-maruf-1997 p.589}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn Yahya ibn Hibban'dan rivayet ettiğine göre, Zeyd ibn Halid el-Cuhani şöyle demiştir: Huneyn günü bir adam öldü ve onu Allah'ın Resulü'ne bildirdiler. Resulullah, \"Arkadaşın için dua et\" dedi. Bunun üzerine insanların yüzleri değişti, bunun üzerine Resulullah, \"Arkadaşın savaş ganimetlerinden zimmetine para geçirdi\" dedi. Eşyalarını açtık ve Yahudi kökenli, iki dirhemden fazla olmayan tesbihler bulduk. Araştırmacı, İbn Abd el-Barr'ın Zeyd'den rivayet edilen ravinin ismi konusunda görüş ayrılığı gördüğünü ve doğru ismin Ebu Amre olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.589}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, yang juga dari Muhammad ibn Yahya ibn Hibban, bahwa Zayd ibn Khalid al-Juhani berkata: Seorang laki-laki meninggal pada hari Hunayn, dan mereka menyebutkannya kepada Rasulullah, yang kemudian berkata, \"Doakan temanmu.\" Wajah orang-orang berubah mendengar ini, lalu beliau berkata, \"Temanmu telah menggelapkan harta rampasan perang.\" Kami membuka barang-barangnya dan menemukan manik-manik asal Yahudi yang nilainya tidak lebih dari dua dirham. Peneliti menyebutkan bahwa Ibnu Abd al-Barr melihat perbedaan pendapat mengenai nama perawi dari Zayd, dan nama yang benar adalah Abu 'Amrah. {cite:muwatta-maruf-1997 p.589}"
