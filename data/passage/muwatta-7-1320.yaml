label: { ar: "الموطأ 1320 — زيد بن خالد الجهني: توفي رجل يوم حنين فقال النبي صلوا على صاحبكم، فقد غل في سبيل الله", en: "Muwatta 1320" }
text: "إنَّ صَاحِبكُمْ قَدْ غَلَّ في سَبِيلِ اللهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان أن زيد بن خالد الجهني قال توفي رجل يوم حنين، فذكروه لرسول الله، فقال صلوا على صاحبكم، فتغيرت وجوه الناس لذلك، فقال إن صاحبكم قد غل في سبيل الله. ففتحنا متاعه فوجدنا خرزات من خرز يهود لا تساوي درهمين. ويذكر المحقق أن ابن عبد البر رأى في اسم الراوي عن زيد خلافا، والصحيح عن أبي عمرة. {cite:muwatta-maruf-1997 p.589}"
