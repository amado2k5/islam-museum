label: { ar: "صحيح مسلم 2279 — ما فرضه الله ورسوله، الفرض", en: "Sahih Muslim 2279 — what God and His Messenger made obligatory; the obligatory (fard)", ur: "صحیح مسلم 2279 — جو اللہ اور اس کے رسول نے فرض کیا، فرض", fr: "Sahih Muslim 2279 — ce que Dieu et Son Messager ont rendu obligatoire ; l'obligatoire (fard)", es: "Sahih Muslim 2279 — lo que Dios y Su Mensajero hicieron obligatorio; lo obligatorio (fard)", tr: "Sahih Muslim 2279 — Allah ve Resulü'nün emrettiği şey, yükümlülük", id: "Sahih Muslim 2279 — Apa yang telah Allah dan Rasul-Nya tetapkan, kewajiban" }
text: "حَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا أَبِي ح، وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، - وَاللَّفْظُ لَهُ - قَالَ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نُمَيْرٍ، وَأَبُو أُسَامَةَ عَنْ عُبَيْدِ اللَّهِ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ فَرَضَ رَسُولُ اللَّهِ زَكَاةَ الْفِطْرِ صَاعًا مِنْ تَمْرٍ أَوْ صَاعًا مِنْ شَعِيرٍ عَلَى كُلِّ"
summary:
  ar: "حديث في صحيح مسلم، رقم 2279، يرد فيه ذكر ما فرضه الله ورسوله، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 2279 (The Book of Zakat), whose wording mentions what God and His Messenger made obligatory, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 2279، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 2279, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 2279, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 2279 numaralı hadis, Allah ve Resulü'nün emrettiği şeyleri ve yükümlülük kavramını anlatmaktadır. Bu hadis, farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamber'in biyografisi ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2279, menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, serta konsep kewajiban. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
