label: { ar: "جامع الترمذي 1120 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1120 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1120 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… وَبِهِ يَقُولُ سُفْيَانُ الثَّوْرِيُّ وَابْنُ الْمُبَارَكِ وَالشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ. قَالَ وَسَمِعْتُ الْجَارُودَ بْنَ مُعَاذٍ يَذْكُرُ عَنْ وَكِيعٍ أَنَّهُ قَالَ بِهَذَا وَقَالَ يَنْبَغِي أَنْ يُرْمَى بِهَذَا الْبَابِ مِنْ قَوْلِ أَصْحَابِ الرَّأْىِ. قَالَ جَارُودٌ قَالَ وَكِيعٌ وَقَالَ سُفْيَانُ إِذَا تَزَوَّجَ الرَّجُلُ الْمَرْأَةَ لِيُحَلِّلَهَا ثُمَّ بَدَا لَهُ أَنْ يُمْسِكَهَا فَلاَ يَحِلُّ لَهُ أَنْ يُمْسِكَهَا حَتَّى يَتَزَوَّجَهَا بِنِكَاحٍ جَدِيدٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1120، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1120 (The Book on Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1120، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
