label: { ar: "سنن النسائي 2793 — ما أُحل", en: "Sunan al-Nasa'i 2793 — what was made lawful", ur: "سنن نسائی 2793 — جو حلال کیا گیا", es: "Sunan al-Nasa'i 2793 — lo que se hizo lícito" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، قَالَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ مَالِكٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي بَكْرٍ، عَنْ عَمْرَةَ، عَنْ عَائِشَةَ، قَالَتْ كُنْتُ أَفْتِلُ قَلاَئِدَ هَدْىِ رَسُولِ اللَّهِ بِيَدَىَّ ثُمَّ يُقَلِّدُهَا رَسُولُ اللَّهِ بِيَدِهِ ثُمَّ يَبْعَثُ بِهَا مَعَ أَبِي فَلاَ يَدَعُ رَسُولُ اللَّهِ شَيْئًا أَحَلَّهُ اللَّهُ عَزَّ وَجَلَّ لَهُ حَتَّى يَنْحَرَ الْهَدْىَ."
summary:
  ar: "حديث في سنن النسائي، رقم 2793، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2793 (The Book of Hajj), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2793، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2793 (El Libro del Hajj), menciona lo que se considera lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
