summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: لا يبع بعضكم على بيع بعض. ويذكر المحقق أن ابن عبد البر قال إن زيادة «ولا تلقوا السلع حتى يهبط بها الأسواق» محفوظة من حديث أبي الزناد، لا من رواية يحيى. {cite:muwatta-maruf-1997 p.216}"
