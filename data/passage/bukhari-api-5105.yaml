label: { ar: "صحيح البخاري 5105 — ما حُرّم", en: "Sahih al-Bukhari 5105 — what was made unlawful", ur: "صحیح بخاری 5105 — جو حرام کیا گیا", es: "Sahih al-Bukhari 5105 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 5105 — ce qui a été déclaré illicite" }
text: "… عَنْ سُفْيَانَ، حَدَّثَنِي حَبِيبٌ، عَنْ سَعِيدٍ، عَنِ ابْنِ عَبَّاسٍ، حَرُمَ مِنَ النَّسَبِ سَبْعٌ، وَمِنَ الصِّهْرِ سَبْعٌ. ثُمَّ قَرَأَ {حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ} الآيَةَ. وَجَمَعَ عَبْدُ اللَّهِ بْنُ جَعْفَرٍ بَيْنَ ابْنَةِ عَلِيٍّ وَامْرَأَةِ عَلِيٍّ. وَقَالَ ابْنُ سِيرِينَ لاَ بَأْسَ بِهِ. وَكَرِهَهُ الْحَسَنُ مَرَّةً ثُمَّ قَالَ لاَ بَأْسَ بِهِ. وَجَمَعَ الْحَسَنُ بْنُ الْحَسَنِ بْنِ عَلِيٍّ بَيْنَ ابْنَتَىْ عَمٍّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5105، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5105 (Wedlock, Marriage (Nikaah)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5105، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5105 (Matrimonio (Nikaah)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5105 (Mariage, Nikah), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
