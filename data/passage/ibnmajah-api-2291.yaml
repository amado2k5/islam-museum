label: { ar: "سنن ابن ماجه 2291 — أنت ومالك لأبيك", en: "Sunan Ibn Majah 2291 — You and your wealth belong to your father", ur: "سنن ابن ماجہ 2291 — تم اور تمہارا مال تمہارے باپ کا ہے" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا عِيسَى بْنُ يُونُسَ، حَدَّثَنَا يُوسُفُ بْنُ إِسْحَاقَ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ رَجُلاً، قَالَ يَا رَسُولَ اللَّهِ إِنَّ لِي مَالاً وَوَلَدًا وَإِنَّ أَبِي يُرِيدُ أَنْ يَجْتَاحَ مَالِي فَقَالَ ‏ \"‏ أَنْتَ وَمَالُكَ لأَبِيكَ ‏\"‏ ‏.‏"
summary:
  ar: "جاء رجل يقول إن لي مالا وولدا وإن أبي يريد أن يجتاح مالي فقال أنت ومالك لأبيك."
  en: "A man came saying «I have wealth and a son, and my father means to take my wealth« — the answer: «you and your wealth belong to your father.»"
  ur: "ایک شخص آیا «میرا مال اور بیٹا ہے اور میرا باپ میرا مال لینا چاہتا ہے» — جواب: «تم اور تمہارا مال تمہارے باپ کا ہے۔»"
