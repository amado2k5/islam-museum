label: { ar: "جامع الترمذي 3085 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 3085 — what was made lawful; what is not lawful", ur: "جامع ترمذی 3085 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… أَخْبَرَنِي مُعَاوِيَةُ بْنُ عَمْرٍو، عَنْ زَائِدَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" لَمْ تَحِلَّ الْغَنَائِمُ لأَحَدٍ سُودِ الرُّءُوسِ مِنْ قَبْلِكُمْ كَانَتْ تَنْزِلُ نَارٌ مِنَ السَّمَاءِ فَتَأْكُلُهَا \". قَالَ سُلَيْمَانُ الأَعْمَشُ فَمَنْ يَقُولُ هَذَا إِلاَّ أَبُو هُرَيْرَةَ الآنَ فَلَمَّا كَانَ يَوْمُ بَدْرٍ وَقَعُوا فِي الْغَنَائِمِ قَبْلَ أَنْ تَحِلَّ لَهُمْ فَأَنْزَلَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3085، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3085 (Chapters on Tafsir), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3085، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
