label: { ar: "صحيح البخاري 1757 — الأب والأبوة", en: "Sahih al-Bukhari 1757 — the father and fatherhood", ur: "صحیح بخاری 1757 — باپ اور والدیت" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ أَنَّ صَفِيَّةَ بِنْتَ حُيَىٍّ، زَوْجَ النَّبِيِّ حَاضَتْ، فَذَكَرْتُ ذَلِكَ لِرَسُولِ اللَّهِ فَقَالَ \" أَحَابِسَتُنَا هِيَ \". قَالُوا إِنَّهَا قَدْ أَفَاضَتْ. قَالَ \" فَلاَ إِذًا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1757، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1757 (Hajj (Pilgrimage)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1757، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
