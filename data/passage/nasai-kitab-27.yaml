summary:
  ar: "القسم 27 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطلاق»، ويضم فيها النصوص من 3389 إلى 3560 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 27 of Sunan al-Nasa'i (The Book of Divorce) in the division of the open hadith dataset the museum took its reports from: reports 3389 to 3560 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 27، عنوان «کتاب الطلاق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3389 تا 3560۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 27 de Sunan al-Nasa'i (El Libro del Divorcio) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3389 al 3560, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
