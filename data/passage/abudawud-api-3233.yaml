label: { ar: "سنن أبي داود 3233 — رثاء وثناء على ميت", en: "Sunan Abi Dawud 3233 — an elegy or praise of the dead", ur: "سنن ابی داؤد 3233 — مرثیہ یا میت کی تعریف", fr: "Sunan Abi Dawud 3233 — une élégie ou un éloge du défunt", es: "Sunan Abi Dawud 3233 — una elegía o elogio del difunto" }
text: "حَدَّثَنَا حَفْصُ بْنُ عُمَرَ، حَدَّثَنَا شُعْبَةُ، عَنْ إِبْرَاهِيمَ بْنِ عَامِرٍ، عَنْ عَامِرِ بْنِ سَعْدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ مَرُّوا عَلَى رَسُولِ اللَّهِ بِجَنَازَةٍ فَأَثْنَوْا عَلَيْهَا خَيْرًا فَقَالَ \" وَجَبَتْ \". ثُمَّ مَرُّوا بِأُخْرَى فَأَثْنَوْا عَلَيْهَا شَرًّا فَقَالَ \" وَجَبَتْ \". ثُمَّ قَالَ \" إِنَّ بَعْضَكُمْ عَلَى بَعْضٍ شُهَدَاءُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3233، فيه رثاء وثناء على ميت. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3233 (Funerals (Kitab Al-Jana'iz)), that carries an elegy or praise of the dead. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 3233، جس میں مرثیہ یا میت کی تعریف ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Abi Dawud, n° 3233, qui contient une élégie ou un éloge du défunt. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Abi Dawud, n.º 3233, que contiene una elegía o elogio del difunto. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
