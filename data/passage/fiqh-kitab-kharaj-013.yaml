text: "تمس الزيادة فيها بالشكر عليها، فإن الله تبارك وتعالى . يقول في كتابه العزيز ( لئن شكرتم لأزيدنكم ولئن كفرتم إن عذابي لشديد ). وليس شيء أحب إلى الله من الإصلاح، ولا أبغض إليه من الفساد، والعمل بالمعاصي كفر النعم،"
