text: "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، قَالَ حَدَّثَنَا أَبِي، عَنْ شَرِيكٍ، عَنْ مَنْصُورٍ، عَنْ رِبْعِيِّ بْنِ حِرَاشٍ، قَالَ حَدَّثَنَا عَلِيُّ بْنُ أَبِي طَالِبٍ، بِالرَّحَبَةِ قَالَ لَمَّا كَانَ يَوْمُ الْحُدَيْبِيَةِ خَرَجَ إِلَيْنَا نَاسٌ مِنَ الْمُشْرِكِينَ فِيهِمْ سُهَيْلُ بْنُ عَمْرٍو وَأُنَاسٌ مِنْ رُؤَسَاءِ الْمُشْرِكِينَ فَقَالُوا يَا رَسُولَ اللَّهِ خَرَجَ إِلَيْكَ نَاسٌ مِنْ أَبْنَائِنَا وَإِخْوَانِنَا وَأَرِقَّائِنَا وَلَيْسَ لَهُمْ فِقْهٌ فِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3715، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3715 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3715، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3715 (Capítulos sobre las virtudes), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3715 (Chapitres sur les vertus), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
