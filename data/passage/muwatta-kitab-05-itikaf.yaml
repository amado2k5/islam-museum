summary:
  ar: "كتاب الاعتكاف، الكتاب الخامس من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 32 نصاً (866–897) في عشرة أبواب، من الصفحة 419 إلى الصفحة 431 من ملف PDF المجلد الأول. يبدأ بذكر الاعتكاف وما يُجتنب فيه، ثم اشتراط الصيام، والخروج للعيد وقضاء الاعتكاف، وما يحل للمعتكف ويحرم عليه، ويختم بليلة القدر. {cite:muwatta-maruf-1997 p.419} {cite:muwatta-maruf-1997 p.431}"
  en: "The Book of I'tikaf, fifth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 32 reports (866–897) in ten babs, PDF pp. 419–431 of volume 1, from the rules of retreat and what is forbidden to the retreatant to Laylat al-Qadr."
  es: "El Libro del I'tikaf, quinto libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 32 informes (866–897) en diez babs, PDF pp. 419–431 del volumen 1, de las reglas del retiro y lo que está prohibido para el que se retira a Laylat al-Qadr."
  fr: "Le Livre d'I'tikaf, cinquième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 32 rapports (866–897) dans dix babs, PDF pp. 419–431 du volume 1, des règles de retraite et de ce qui est interdit au retraitant à Laylat al-Qadr."
