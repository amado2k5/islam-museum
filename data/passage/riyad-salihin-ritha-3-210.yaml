text: "… : إِنَّا للَّهِ وَإِنَّا إِليهِ رَاجِعُونَ : اللَّهمَّ أجرنيَ في مُصِيبَتَي، واخْلُفَ لي خِيْراً مِنْهَا، إِلاَّ أَجَرَهُ اللَّهُ تعَالَى في مُصَبتِهِ وَأخْلَف له خَيْراً مِنْهَا. قالت : فَلَمَّا تُوُفِّيَ أَبُو سَلَمَة، قلتُ كمَا أَمَرتي رسولُ الَّهِ لم فَأَخْلَفَ اللَّهُ لي …"
summary:
  ar: "مقطع من رياض الصالحين، المجلد المصوَّر 3، ص 210، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Riyad al-Salihin, scan volume 3, p. 210, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ریاض الصالحین، اسکین جلد 3، ص 210 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin, volume numérisé 3, p. 210, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Riyad al-Salihin, volumen escaneado 3, p. 210, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Riyad as-Salihin, Resimli Cilt 3, sayfa 210'dan bir alıntı; felaket karşısında taziye, teselli ve sabır sunuyor; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. En ünlü ağıt ve övgülerden oluşan bir derlemeden derlenmiştir."
  id: "Cuplikan dari Riyad as-Salihin, Jilid Bergambar 3, halaman 210, yang menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
