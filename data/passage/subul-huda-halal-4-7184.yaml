text: "… سِوَاهُ، وَلِأُنَّه لا يجُوز أَن يَكُونَ الْقُرآنُ على أُنَّهُ حلَالٌ كُلُّهُ، وحرامٌ كلُّهُ، وأمثالٌ كلُّهُ. قالَ ابْنُ عَطِيَّةَ : هَذَا القولُ ضَعِيفٌ، لأَنّ الإِجْمَاعَ عَلَى أَنَّ التَّوْسِعَةَ لم تقعْ فى تَحليلِ حلَال، وَلَا فِي تَحْرِيم حَرَاع، ولا فِى تغييرٍ شْءٍ …"
