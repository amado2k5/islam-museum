text: "… المتضمِّن لتغيير شرع اللَّه وَدِينه، وإباحة الفَرْجِ لمن هو عليه حرام، وتحريمُه على من هو عليه حلالٌ، على عهدٍ رسول اللَّه وَل وأصحابه خيرِ الخلق، وهم يفعلونه، ولا يعلمونه، ولا يعلمه هو، والوحِي يَنْزِلُ عليه، وهو يُقِرُّهم عليه، فَهَبْ أن …"
