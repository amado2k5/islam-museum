  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 594, qui mentionne la douleur, la lèpre et le vitiligo, les maladies nommées, les organes du corps, le traitement des plaies; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 594'ten bir bölüm; ağrı, cüzzam, vitiligo, hastalıkların isimleri, vücut organları ve yaraların tedavisi konularını ele alıyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 594, yang menyebutkan rasa sakit, kusta, vitiligo, nama-nama penyakit, organ tubuh, dan pengobatan luka; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
