text: "… فيه جلاء وتحليل، وهو عدوّ للمعدة والكبد خاصة. الزينة: ينقّي البهق والبرص والكلف. الجراح والقروح : إذا طبخ بالعسل والزيت وضمّدت به الجراحات حلّلها. البثور : يطلى بالخلّ على الجرب المتقرّح. آلات المفاصل : بالخلّ والسوسن على أوجاع المفاصل والورك …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 594، يذكر الوجع، والجذام والبرص، وأسماء الأمراض، وأعضاء البدن، ومداواة الجراح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 594, that mentions pain, leprosy and vitiligo, named diseases, the organs of the body, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 594 کا اقتباس جس میں درد، جذام اور برص، بیماریوں کے نام، اعضائے بدن، زخموں کا علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
