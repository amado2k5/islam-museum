text: "… عمران بن حُدير قال: سمعت عكرمة ؟ فقال: دجاجة سمينة. وسُئل عن لحم الغراب - حدَّثنا عبدالوهاب الثقفيُّ عن أيوب عن ابن عباس: أنه سُئل عن لحم الغراب والحُديّا؟ فقال: أحلّ اللّٰه حلالاً، وحَرَّم حراماً، وسكت عن أشياء فما سكت …"
