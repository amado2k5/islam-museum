label: { ar: "سنن أبي داود 3292 — الأب والأبوة", en: "Sunan Abi Dawud 3292 — the father and fatherhood", ur: "سنن ابی داؤد 3292 — باپ اور والدیت", es: "Sunan Abi Dawud 3292 — El padre y la paternidad", fr: "Sunan Abi Dawud 3292 — Le père et la paternité", tr: "Sunan Abi Davud 3292 — Baba ve Babalık", id: "Sunan Abi Dawud 3292 — Sang Ayah dan Peran Ayah" }
text: "… الْمَرْوَزِيُّ : إِنَّمَا الْحَدِيثُ حَدِيثُ عَلِيِّ بْنِ الْمُبَارَكِ عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ عَنْ مُحَمَّدِ بْنِ الزُّبَيْرِ عَنْ أَبِيهِ عَنْ عِمْرَانَ بْنِ حُصَيْنٍ عَنِ النَّبِيِّ. أَرَادَ أَنَّ سُلَيْمَانَ بْنَ أَرْقَمَ وَهِمَ فِيهِ وَحَمَلَهُ عَنْهُ الزُّهْرِيُّ وَأَرْسَلَهُ عَنْ أَبِي سَلَمَةَ عَنْ عَائِشَةَ رَحِمَهَا اللَّهُ. قَالَ أَبُو دَاوُدَ : رَوَى بَقِيَّةُ عَنِ الأَوْزَاعِيِّ عَنْ يَحْيَى عَنْ مُحَمَّدِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3292، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3292 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3292، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3292 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3292 (Serments et Vœux), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 3292 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3292, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
