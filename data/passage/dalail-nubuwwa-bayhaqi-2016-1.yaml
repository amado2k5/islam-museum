  ur: "بیہقی کی دلائل النبوۃ سے ایک اقتباس، ہرقل کے ساتھ خط و کتابت میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
