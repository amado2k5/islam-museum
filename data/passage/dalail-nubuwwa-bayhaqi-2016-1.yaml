text: "محمد رسول الله ظ إلى هرقل عظيم الروم سلام على من أتبع الهدى أما بعد فاسلم تسلم وأسلم يؤتك الله أجرك مرتين فإن أبيت فإن إثم الأكارين عليك فلما انتهى اليه كتابه وقرأه أخذه فجعله بين فخذه وخاصرته ثم كتب إلى رجل"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، في مراسلات هرقل، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
