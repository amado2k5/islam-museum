label: { ar: "الموطأ 2041 — مالك: فيمن أخذ مالا قراضا فاشترى به سلعة وعليه دين، فطلبه غرماؤه فأدركوه ببلد غائب عن صاحب المال، وفي يديه عرض مربح بين فضله، فأرادوا أن يباع لهم العرض فيأخذوا حصته من الربح: لا يؤخذ من ربح القراض شيء حتى يحضر صاحب المال فيأخذ ماله، ثم يقتسمان الربح على شرطهما", en: "Muwatta 2041" }
summary:
  ar: "قال مالك في رجل أخذ مالا قراضا، فاشترى به سلعة، وقد كان عليه دين، فطلبه غرماؤه، فأدركوه ببلد غائب عن صاحب المال، وفي يديه عرض مربح بين فضله، فأرادوا أن يباع لهم العرض فيأخذوا حصته من الربح. قال: لا يؤخذ من ربح القراض شيء، حتى يحضر صاحب المال، فيأخذ ماله، ثم يقتسمان الربح على شرطهما. {cite:muwatta-maruf-1997 p.234}"
