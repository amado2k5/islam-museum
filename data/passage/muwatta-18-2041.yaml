label: { ar: "الموطأ 2041 — مالك: فيمن أخذ مالا قراضا فاشترى به سلعة وعليه دين، فطلبه غرماؤه فأدركوه ببلد غائب عن صاحب المال، وفي يديه عرض مربح بين فضله، فأرادوا أن يباع لهم العرض فيأخذوا حصته من الربح: لا يؤخذ من ربح القراض شيء حتى يحضر صاحب المال فيأخذ ماله، ثم يقتسمان الربح على شرطهما", en: "Muwatta 2041", es: "Muwatta 2041", fr: "Muwatta 2041", ur: "موطا 2041", tr: "El-Muvatta 2041 — Malik: Kâr paylaşımı için para alan ve bu parayla mal satın alan, ancak borcu olan ve alacaklıları tarafından para sahibinin yanında olmadığı bir yerde bulunan, elinde kârlı ve fazlalık bir mal bulunan ve alacaklıları bu malı onlara satıp kâr payını almak isteyen kimse hakkında: Para sahibi gelip parasını alana kadar kâr paylaşımından hiçbir şey alınmamalıdır; daha sonra anlaşmalarına göre kârı paylaşırlar.", id: "Al-Muwatta 2041 — Malik: Mengenai seseorang yang mengambil uang untuk persekutuan bagi hasil (qirad) dan menggunakannya untuk membeli barang, tetapi ia memiliki hutang, dan para krediturnya mencarinya dan menemukannya di suatu tempat di mana ia tidak ada di tempat pemilik uang tersebut, dan ia memiliki barang dagangan yang menguntungkan dengan surplus di tangannya, dan mereka ingin menjual barang dagangan tersebut kepadanya agar mereka dapat mengambil bagian keuntungannya: tidak ada yang boleh diambil dari persekutuan bagi hasil sampai pemilik uang tersebut datang dan mengambil uangnya, kemudian mereka membagi keuntungan sesuai dengan kesepakatan mereka." }
summary:
  ar: "قال مالك في رجل أخذ مالا قراضا، فاشترى به سلعة، وقد كان عليه دين، فطلبه غرماؤه، فأدركوه ببلد غائب عن صاحب المال، وفي يديه عرض مربح بين فضله، فأرادوا أن يباع لهم العرض فيأخذوا حصته من الربح. قال: لا يؤخذ من ربح القراض شيء، حتى يحضر صاحب المال، فيأخذ ماله، ثم يقتسمان الربح على شرطهما. {cite:muwatta-maruf-1997 p.234}"
  tr: "Malik, kâr paylaşımı esasına dayalı bir yatırım (kırad) olarak para alan, bu parayla mal satın alan ve borcu olan bir adam hakkında şöyle buyurmuştur: Alacaklıları onu takip etmiş ve paranın sahibinden uzakta bir yerde bulmuşlardır. Adamın elinde kârlı ve fazlalık bir mal vardı ve alacaklıları bu malı ona satıp kâr payını almasını istiyorlardı. Malik şöyle buyurmuştur: Paranın sahibi gelip parasını alana kadar kıradın kârından hiçbir şey alınmamalıdır. Ondan sonra, aralarındaki anlaşmaya göre kârı paylaşmalıdırlar. {cite:muwatta-maruf-1997 s.234}"
  id: "Malik berkata tentang seorang pria yang mengambil uang sebagai investasi bagi hasil (qirad), menggunakannya untuk membeli barang, dan memiliki hutang. Para krediturnya mengejarnya dan menemukannya di tempat yang jauh dari pemilik uang tersebut. Ia memiliki barang dagangan yang menguntungkan dengan surplus, dan mereka ingin menjual barang dagangan itu kepadanya agar ia dapat mengambil bagian keuntungannya. Malik berkata: Tidak ada yang boleh diambil dari keuntungan qirad sampai pemilik uang tersebut hadir dan mengambil uangnya. Kemudian mereka harus membagi keuntungan sesuai dengan kesepakatan mereka. {cite:muwatta-maruf-1997 p.234}"
