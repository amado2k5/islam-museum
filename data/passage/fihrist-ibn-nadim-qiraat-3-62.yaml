text: "… كتاب القراءات الصغير لابن مجاهد. كتاب القراءات هشام بن بشير. كناب القراءات لابى الطيب ابن أشناس. كتاب القراءات لعلى بن عمر الدار قطى. كتاب القراءات ليحي ابن آدم. كتاب القراءات للواقدى. كتاب القراءات لنصر بن على. كتاب القراءات لابن كامل …"
