text: "… ذمَّةٍ مشرك لا أورثها فى امرأة طلقها عبد الرحمن بن عوف وهو فى عبد الله بن عوف مرض موته عائشة لا تبرحى حتى يجيء رسول الله وَلِ خِ... المهاجر غير منسوب لا تتركه فإن نعل النبى وعَلِيفه كان لها قبالان …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 4، ص 337، يذكر ساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 4, p. 337, that mentions a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 4، ص 337 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 4, pág. 337, que menciona un lecho de muerte y las últimas horas, una reliquia conservada tras su dueño; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 4, p. 337), mentionnant un lit de mort, les dernières heures et une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 4. cildinin 337. sayfasından alınan bir alıntı, ölüm ve vefat anından bahsetmekte olup, günümüze kadar korunmuş kutsal emanetlerden biridir; makineyle okunabilir fotokopi versiyonundan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 4, halaman 337, menyebutkan saat kematian dan wafatnya, dan merupakan salah satu peninggalan yang terpelihara; dari versi fotokopi yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, peninggalan, dan makam suci."
