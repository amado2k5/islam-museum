text: "… والنمش الزينة: حبّه ينفع من البرش والكلف والبهق وآثار القروح، وكذلك دهنه. الأورام والبثور : ينفع الأورام الصلبة كلها إذا وقع في المراهم والثآليل. ينفع بالخل من الجرب المتقشّر : الجراح والقروح. وينفع من السعفة آلات المفاصل : يُسخّن العصب …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 381، يذكر الجذام والبرص، وأسماء الأمراض، وأعضاء البدن، ومداواة الجراح، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 381, that mentions leprosy and vitiligo, named diseases, the organs of the body, the treatment of wounds, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 381 کا اقتباس جس میں جذام اور برص، بیماریوں کے نام، اعضائے بدن، زخموں کا علاج، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
