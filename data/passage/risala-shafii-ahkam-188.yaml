text: "… المَقْنم، مع ما سواه من الغنيمة. بيانُ فرضِ اللّه فى كتابه اتّباعَ سُنةِ نبيّه - قال الشافعى : وَضَع اللهُ رَسولَه مِنْ دينِه وفَرْضِه وكتابه المَوْضِعَ الذى أبان جلَّ ثناؤه أنه جَمَلَهُ عَلَما لدينِه، بما افترض مِن طاعته، وحَرَّمَ من …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 188، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 188, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 188 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 188, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 188, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şafiî'nin risalesi 188. sayfadan, Allah ve Resulü'nün emrettiği, yükümlülükler ve itaat konularından bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari risalah Al-Shafi'i, halaman 188, yang menyebutkan apa yang telah diperintahkan Allah dan Rasul-Nya, kewajiban, dan ketaatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
