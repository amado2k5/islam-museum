label: { ar: "الموطأ 1550 — مالك: لا يحل نكاح أمة يهودية ولا نصرانية، لأن الله ذكر المحصنات من المؤمنات والمحصنات من أهل الكتاب، وذكر الإماء المؤمنات في النساء", en: "Muwatta 1550", es: "Muwatta 1550", fr: "Muwatta 1550", ur: "موطا 1550", tr: "El-Muvatta 1550 — Malik: Yahudi veya Hristiyan bir cariye ile evlenmek caiz değildir, çünkü Allah iffetli mümin kadınlardan ve Kitap Ehli'nden iffetli kadınlardan bahsetmiş, kadınlar arasında da mümin cariyelerden bahsetmiştir.", id: "Al-Muwatta 1550 — Malik: Tidak diperbolehkan menikahi seorang budak perempuan Yahudi atau Kristen, karena Allah menyebutkan perempuan-perempuan mukmin yang suci dan perempuan-perempuan suci dari Ahli Kitab, dan Dia juga menyebutkan perempuan-perempuan mukmin yang budak di antara perempuan-perempuan." }
summary:
  ar: "يقول مالك لا يحل نكاح أمة يهودية ولا نصرانية، لأن الله تعالى قال في كتابه والمحصنات من المؤمنات والمحصنات من الذين أوتوا الكتاب، فهن الحرائر من اليهوديات والنصرانيات، وقال تعالى في نكاح الإماء ممن لم يستطع طولا، فهن الإماء المؤمنات. {cite:muwatta-maruf-1997 p.48}"
  tr: "Malik, Yahudi veya Hristiyan bir cariye ile evlenmenin caiz olmadığını söyler; çünkü Yüce Allah Kitabında şöyle buyurmuştur: “[Size helal olanlar] müminlerden iffetli kadınlar ve kendilerine Kitap verilenlerden iffetli kadınlardır”, yani Yahudilerden ve Hristiyanlardan hür kadınlar. Ve Yüce Allah, [evlenmeye] gücü yetmeyenler için cariyelerle evlenmeyi, yani mümin cariyelerle evlenmeyi buyurmuştur. {cite:muwatta-maruf-1997 s.48}"
  id: "Malik mengatakan bahwa tidak diperbolehkan menikahi seorang budak perempuan Yahudi atau Kristen, karena Allah Yang Maha Kuasa berfirman dalam Kitab-Nya, “Dan [halal bagi kalian untuk menikahi] perempuan-perempuan suci dari kalangan orang-orang beriman dan perempuan-perempuan suci dari kalangan orang-orang yang diberi Kitab Suci,” yang berarti perempuan merdeka dari kalangan Yahudi dan Kristen. Dan Allah Yang Maha Kuasa berfirman mengenai pernikahan dengan budak perempuan bagi mereka yang tidak mampu [menikah], yang berarti budak perempuan yang beriman. {cite:muwatta-maruf-1997 p.48}"
