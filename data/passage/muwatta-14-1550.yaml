summary:
  ar: "يقول مالك لا يحل نكاح أمة يهودية ولا نصرانية، لأن الله تعالى قال في كتابه والمحصنات من المؤمنات والمحصنات من الذين أوتوا الكتاب، فهن الحرائر من اليهوديات والنصرانيات، وقال تعالى في نكاح الإماء ممن لم يستطع طولا، فهن الإماء المؤمنات. {cite:muwatta-maruf-1997 p.48}"
