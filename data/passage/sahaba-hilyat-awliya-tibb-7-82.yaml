text: "… لا يرفع وفيه عجب، ولا تأخذن دينك إلا ممن هو مشفق على دينه، فان مثل الذى هو غير مشفق على دينه، كمثل طبيب به داء لا يستطيع أن يمالج داء نفسه، وينصح لنفسه، كيف يعالج داء الناس وينصح لهم أ …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 7، ص 82، يذكر الطب والطبيب، والعلاج، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 7, p. 82, that mentions medicine and the physician, treatment, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 7، ص 82 کا اقتباس جس میں طب اور طبیب، علاج، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 7, pág. 82, que menciona la medicina y el médico, el tratamiento, la enfermedad y su remedio; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 7 scanné, p. 82, qui mentionne la médecine et le médecin, le traitement, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nu'aym'ın Hilyat al-Awliya' adlı eserinin resimli 7. cildinin 82. sayfasından, tıp, hekim, tedavi ve hastalıktan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 7, hlm. 82, yang menyebutkan tentang kedokteran, dokter, pengobatan, dan penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
