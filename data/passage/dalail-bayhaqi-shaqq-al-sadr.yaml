label: { ar: "دلائل النبوة للبيهيقي — شق الصدر عند الحليمة", en: "Bayhaqi's Dala'il — the opening of the chest in infancy", ur: "بیہقی کی دلائل — بچپن میں سینے کا شق ہونا" }
text: "كان ذلك له فضيلة فضل بها على غيره، وإنه من معجزات النبوة، إذ البشر إذا شق عن موضع القلب منهم ثم استخرجت قلوبهم ماتوا"
summary:
  ar: "تناقش مقدمة هذه الطبعة قصة شق الصدر في عدّها من معجزات النبوة، فتنقل قول ابن حبان المتوفى سنة 354هـ أنه كان ذلك للنبي فضيلة فُضِّل بها على غيره وإنه من معجزات النبوة، إذ البشر إذا شُق عن موضع القلب ثم استُخرجت قلوبهم ماتوا — فيحتج المؤلف بأن قدرة الله «كن فيكون» لا يعجزها ما عجز عنه أطباء عصره، ويقرر أن القصة المتواترة في كتب المغازي هي الأصل، وأن ما أضيف إليها من زيادات في رواية محمد بن زكريا الغلابي المتهم بالوضع لا يُعتمد عليه، ويختم بالاستخارة على إلحاقها بما تقدم من نقل أهل المغازي لشهرته عند المحدثين."
  en: "This edition's introduction weighs whether the infant chest-opening counts among the proofs of prophethood, quoting Ibn Hibban (d. 354 AH): it was a distinction granted to him above others and is of the miracles of prophethood, for when people's chests are opened at the heart's place and their hearts removed they die — while God who says 'Be, and it is' is not barred by what physicians of any age cannot do. The editor holds the maghazi tradition the reliable core, sets aside the embellishments in the report of Muhammad ibn Zakariya al-Ghallabi who was suspected of fabrication, and keeps the account on the strength of its fame among the traditionists."
  ur: "اس ایڈیشن کا تمہید بحث کرتی ہے کہ ننھے پن میں سینے کا شق ہونا نبوت کی معجزات میں شمار ہوتا ہے یا نہیں، اور ابن حبان ⁦(354ھ)⁩ کا قول نقل کرتی ہے کہ یہ نبی کے لیے ایک امتیاز تھا جس سے وہ دوسروں پر فضل تھا اور نبوت کی معجزات میں سے ہے، کیونکہ جب انسانوں کا سینہ دل کی جگہ سے شق ہو کر دل نکالا جائے تو وہ مر جاتے ہیں۔ مؤلف اس پر زور دیتی ہے کہ اللہ کی قدرت «کن فیكون» کسی دور کے معالج کی نااہلی سے محدود نہیں۔ وہ مغازی کی مشہور روایت کو اصل مانتی ہے، محمد بن زکریا الغلابی کی منسوبہ روایات کو نہیں مانتی، اور مصنف کی شیخ کے ہاں مشہوررت کی بنا پر اسے مقبول رکھتی ہے۔"
