label: { ar: "الموطأ 1787 — مالك: لا يصلح أن يبيع الرجل الجارية بمائة دينار إلى أجل، ثم يبتاعها بأكثر من ثمنها إلى أبعد من ذلك الأجل، كأن يبيعها بثلاثين إلى شهر ثم يبتاعها بستين إلى سنة", en: "Muwatta 1787" }
summary:
  ar: "قال مالك في الرجل يبيع من الرجل الجارية بمائة دينار إلى أجل، ثم يشتريها بأكثر من ذلك الثمن إلى أبعد من ذلك الأجل: إن ذلك لا يصلح. وتفسير ما كره من ذلك أن يبيع الرجل الجارية إلى أجل، ثم يبتاعها إلى أجل أبعد منه، يبيعها بثلاثين دينارا إلى شهر، ثم يبتاعها بستين دينارا إلى سنة أو إلى نصف سنة. فهذا لا ينبغي. {cite:muwatta-maruf-1997 p.131}"
