label: { ar: "الموطأ 1787 — مالك: لا يصلح أن يبيع الرجل الجارية بمائة دينار إلى أجل، ثم يبتاعها بأكثر من ثمنها إلى أبعد من ذلك الأجل، كأن يبيعها بثلاثين إلى شهر ثم يبتاعها بستين إلى سنة", en: "Muwatta 1787", es: "Muwatta 1787", fr: "Muwatta 1787", ur: "موطا 1787", tr: "El-Muvatta 1787 — Malik: Bir erkeğin bir cariyeyi yüz dinara borç vererek satması, sonra da daha uzun vadeli olarak daha yüksek bir fiyata geri alması caiz değildir; örneğin, bir cariyeyi otuz dinara bir aylığına borç vererek satıp, sonra da altmış dinara bir yıllığına borç vererek geri alması caiz değildir.", id: "Al-Muwatta 1787 — Malik: Tidak diperbolehkan bagi seorang laki-laki untuk menjual seorang budak perempuan seharga seratus dinar secara kredit, kemudian membelinya kembali dengan harga lebih tinggi dari itu dalam jangka waktu yang lebih lama, misalnya menjualnya seharga tiga puluh dinar secara kredit selama sebulan, kemudian membelinya kembali seharga enam puluh dinar secara kredit selama setahun." }
summary:
  ar: "قال مالك في الرجل يبيع من الرجل الجارية بمائة دينار إلى أجل، ثم يشتريها بأكثر من ذلك الثمن إلى أبعد من ذلك الأجل: إن ذلك لا يصلح. وتفسير ما كره من ذلك أن يبيع الرجل الجارية إلى أجل، ثم يبتاعها إلى أجل أبعد منه، يبيعها بثلاثين دينارا إلى شهر، ثم يبتاعها بستين دينارا إلى سنة أو إلى نصف سنة. فهذا لا ينبغي. {cite:muwatta-maruf-1997 p.131}"
  tr: "Malik, bir erkeğin bir cariyeyi başka bir erkeğe yüz dinara borç vererek satıp, daha sonra daha yüksek bir fiyata ve daha uzun vadeli olarak geri alması hakkında şöyle demiştir: Bu caiz değildir. Onaylamamasının nedeni şudur: Bir erkek cariyeyi borç vererek satar, sonra daha uzun vadeli olarak geri alır; örneğin, onu bir aylığına otuz dinara satar, sonra bir yıl veya yarım yıllığına altmış dinara geri alır. Bu kabul edilemez. {cite:muwatta-maruf-1997 s.131}"
  id: "Malik berkata mengenai seorang pria yang menjual seorang budak perempuan kepada pria lain seharga seratus dinar secara kredit, kemudian membelinya kembali dengan harga lebih tinggi dalam jangka waktu yang lebih lama: ini tidak diperbolehkan. Penjelasan atas ketidaksetujuannya adalah bahwa seorang pria menjual seorang budak perempuan secara kredit, kemudian membelinya kembali dalam jangka waktu yang lebih lama; misalnya, ia menjualnya seharga tiga puluh dinar selama sebulan, kemudian membelinya kembali seharga enam puluh dinar selama setahun atau setengah tahun. Ini tidak dapat diterima. {cite:muwatta-maruf-1997 p.131}"
