text: "… المصيبتين شماتتهم، ولعلَّكم تُدركون شأركم ؛ والدُّهن والنساء على حرامٌ حتى أَغزوَ محمّدًا. فمكشت فُرَيش شهرًا لا يَبكيهم شاعرٌ ولا تنوح عليهم نائحةٌ. فلمًا قدم بالأسرى أَذلّ اللّٰه بذلك رِقاب المشركين والمنافقين واليهود، الم يبقَ بالمدينة يَهودىٌّ ولا منافقٌ إلَّ …"
summary:
