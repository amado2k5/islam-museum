text: "… مناة بن تميم - فإني لا أخشَىٰ أن يَشْجُرَ أمْرَ الناسِ غَيْرُهُ، يعني أَبا جهلِ ابْنَ هشام. عتبة بن ربيعة يحرض قريشاً على الرجوع: ثِم قام عتبة بن ربيعة خطيباً، فقال: يا معشر قريش، إِنكم والله ما تصنعون بِأَنْ تَلْقَوْا …"
