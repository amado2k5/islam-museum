text: |-
  ٣٢٢
  •⁦(فصل القاف)⁩.
  اسكونها فعوّض منها الميم فاذاصغرت أو يجعت رددته الى أصل وقلت فويه وأنواء ولا يقال
  أفاهفا ذانسيت اليسه قلت فى" وان نقت فوى تجمع بين العوض وبين الحرف الذى عوض
  منه كما قالوا فى التثنية فوان وانما أجازوا ذلك لان هنال وفا آخر محذوفا وه والهاء كانهم
  جعلوا الميم فى هذه الحال عوضاعنهالاءن الواو وأنشد الاخفس
  هما نفثا فى فى من فويهما • عملى النامح العاوى أشدرجام
  قال وحق هذا أن يكون يجاعة لانّ كل شيثين من شيقين بماعة فى كلام العرب كقوله تعالى
  فقد صغت قاوبكما الا أنه يجىء فى الشعر ما لا يجىء فى السكلام وفيه لغات بقال هذافم ورأيت
  فاومررت بضم يفتح الفاء على كل حال ومنهم من يضم الفاءعلى كل حان ومنه-م من يكسم
  الفاه على كل حال ومنه-م من يعربه من مكانين يقول رأيت فاوهذافم ومروت بفم وأما
  تشديد الميم فائ ايجوزف الشعر كماقال
  باليتهاقد خريت من فه • حتى يعوداللكّٰ فى أسطعه
  قال ابن السكيت ولوقيل من فه يفتح الفاء لجاز ( وم الفوم الثوم وفى قراءة عبد اللّه
  وثومها ويقال ه والحفطة وأنشد الاخفسْ
  قد كنت أحسبى كاغنى واجد • نزل المدينة عن زراعة فوم
  وقال ابن دريد الفوصة السقبلة وأنشد
  وقال ربيثهم لما أنانا • بكفه فومة أوفومتان -
  والهاء في بكفه غير مشعة وقال بعضهم الفوم الحص لغة شاميسة ويائعه قامىّ مغيرعن
  فومى لانم-م قديغ-يزون فى النسب كما قالواسهصلى" ودهرى" والفوم الخسبز أيضا ويقال
  فومو الذا أى اختسبزوا وقال الفراء هى لغة قديمة والفيوم من أرض مصر قتل بهامر وان
  ابن محمد آخر ملول بني أميسة ( هم فهمت الشى فهما وقهامية علمته وفلان فهم
  وقد استفهمنى الذى فأفهمته رفه-مته تفهما وتفهم الصكلام اذا فهمه شيأبعدشى
  وفهسيم قبي-لة
  سل القاف ( م الفتام الغبار والقتملون فيه غبرة وحرة والاقتم الذى
  تعلوه القتمة وقداقتم اقتماما وباز أقتم الريس وأسود قاتم وقاتن أيضا بالنون حكاه ابن السكيت
  فى كتاب القلب والابدال ومكان قاتم الاعماق أى مغير النواسى قثم الاسعى
  قتم له من المال اذا أعطاه دفعة من المال جيدة مثل قدم وغدم وغثم وقثم اسم رجل معدول
  عن قائم وهو المعطى ويقال للرجل اذا كان كثير العطاء مائح قتم وقال
  ماح البلادلنا فى أوليتنا * على حسود الاعادى مائح قثم
  الاصمعىّ رجل قثم وقدم اذا كان معطاء أبوحمر والقنم والقنوم الهوع للخيرويقان فى
  السْر أيضاقتم واقتيمْ وأنشد
  فللسكبراء أكل حيث شاؤًا * وللصغراءأكل وإقتنام
  وقثم أيضالسم للضبعان والانى قنام مثل حدام سميت بذلك لتلطنه الجعرها ويقال للامة
  قنام كما يقال ذفار ( مم شيخ قحهم أى هتم مثل قل وقم فى الامر قومارمى بنفسه فيه
