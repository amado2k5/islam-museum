text: "… جميع الطاعات، لأن ترك الطاعات معصية، ولأنه لا يترك المعاصي كلها إن لم يتلبس بضدها فيكون محباً لضدها وهو الطاعة، إذ القلب لا بد له من إرادة فإذا كان يكره الشر كله فلا بد أن يريد الخير. والمباح بالنية الحسنة …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 42، يرد فيه ذكر الطاعات، وما كان يُكره، والمباح، والطاعة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 42, whose wording mentions the acts of obedience, what used to be disliked, the permitted (mubah), obedience, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 42 کا اقتباس جس میں طاعات، جو ناپسند کیا جاتا تھا، مباح، اطاعت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Iman de Ibn Taymiyya, volume numérisé 1, p. 42, dont le texte mentionne les actes d'obéissance, ce qui était réprouvé, le permis (mubah), l'obéissance, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Iman de Ibn Taymiyya, volumen digitalizado 1, p. 42, cuyo texto menciona los actos de obediencia, lo que se reprobaba, lo permitido (mubah), la obediencia, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 42. sayfasından, itaat amelleri, mekruh olan, helal olan ve mekruh olan amelleri ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 42, yang membahas tentang ketaatan, apa yang tidak disukai, apa yang diperbolehkan, dan apa yang tidak disukai. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam perbuatan wajib, kewajiban, ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
