label: { ar: "الموطأ 1350 — ربيعة بن أبي عبد الرحمن: قدم على أبي بكر مال من البحرين، فجاءه جابر بن عبد الله فحفن له ثلاث حفنات", en: "Muwatta 1350" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أنه قال قدم على أبي بكر الصديق مال من البحرين، فقال من كان له عند رسول الله أي أو عدة فليأتني، فجاءه جابر بن عبد الله فحفن له ثلاث حفنات. ويذكر المحقق أن ابن عبد البر قال إن هذا الحديث مقطوع في الموطأ، وإنه يتصل من وجوه ثابتة عن جابر. {cite:muwatta-maruf-1997 p.604}"
