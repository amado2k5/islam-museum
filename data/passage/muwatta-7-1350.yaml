label: { ar: "الموطأ 1350 — ربيعة بن أبي عبد الرحمن: قدم على أبي بكر مال من البحرين، فجاءه جابر بن عبد الله فحفن له ثلاث حفنات", en: "Muwatta 1350", es: "Muwatta 1350", fr: "Muwatta 1350", ur: "موطا 1350", tr: "El-Muvatta 1350 — Rabi’ah ibn Abi Abd al-Rahman: Bahreyn'den Ebu Bekir'e para geldi, bunun üzerine Cabir ibn Abdullah ona gelip üç avuç dolusu verdi.", id: "Al-Muwatta 1350 — Rabi’ah ibn Abi Abd al-Rahman: Uang tiba untuk Abu Bakr dari Bahrain, lalu Jabir ibn Abdullah datang kepadanya dan memberinya tiga genggam." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أنه قال قدم على أبي بكر الصديق مال من البحرين، فقال من كان له عند رسول الله أي أو عدة فليأتني، فجاءه جابر بن عبد الله فحفن له ثلاث حفنات. ويذكر المحقق أن ابن عبد البر قال إن هذا الحديث مقطوع في الموطأ، وإنه يتصل من وجوه ثابتة عن جابر. {cite:muwatta-maruf-1997 p.604}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman'dan rivayetle şöyle der: Ebu Bekir es-Siddik'e Bahreyn'den para geldi ve o şöyle dedi: \"Allah'ın Resulü'nden bir alacağı veya sözü olan herkes bana gelsin.\" Bunun üzerine Cabir ibn 'Abd Allah ona geldi ve ona üç avuç dolusu verdi. Araştırmacı, İbn 'Abd al-Barr'ın bu hadisin el-Muvatta'da bağlantısız olduğunu, ancak Cabir'den gelen sahih rivayet zincirleriyle bağlantılı olduğunu söylediğini belirtir. {cite:muwatta-maruf-1997 s.604}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi 'Abd al-Rahman bahwa ia berkata: Uang datang untuk Abu Bakr al-Siddiq dari Bahrain, dan ia berkata: Barangsiapa mempunyai klaim atau janji kepada Rasulullah, datanglah kepadaku. Jabir ibn 'Abd Allah datang kepadanya, dan ia memberinya tiga genggam uang. Peneliti menyebutkan bahwa Ibn 'Abd al-Barr mengatakan bahwa hadits ini terputus dalam al-Muwatta', tetapi terhubung melalui sanad yang sahih dari Jabir. {cite:muwatta-maruf-1997 p.604}"
