label:
  ar: "صحيح البخاري، كتاب بدء الوحى"
  en: "Sahih al-Bukhari, Book 1: Revelation"
  ur: "صحیح بخاری، کتاب بدء الوحیٰ"
  es: "Sahih al-Bukhari, Libro 1: Revelación"
  fr: "Sahih al-Bukhari, Livre 1: Révélation"
summary:
  ar: "القسم 1 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب بدء الوحى»، ويضم فيها النصوص من 1 إلى 7 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 1 of Sahih al-Bukhari (Revelation) in the division of the open hadith dataset the museum took its reports from: reports 1 to 7 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 1، عنوان «کتاب بدء الوحیٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1 تا 7۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 1 de Sahih al-Bukhari (Revelación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1 al 7, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du Sahih al-Bukhari (Révélation), livre 1, dans la base de données ouverte des hadiths: les hadiths 1 à 7, selon la numérotation de cette base de données. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
