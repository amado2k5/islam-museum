text: "… علّقنا عنه شيئاً يسيراً من الحديث والأناشيد، وهو فاضل كبير المحفوظ، دمث الأخلاق، مليح المحاورة، لطيف الطبع، ظريف. ذيل تاريخ بغداد. قال ابن النجار: سألت ابن الجصّاص عن مولده فقال: في أول سنة ست وستين وخمسمائة، وتوفي ليلة الثلاثاء السابع …"
summary:
