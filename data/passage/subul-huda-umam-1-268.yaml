text: "… أَول من سَنَّ الرحلتين، رحلة الشتاء إِلى الحبشة ورحلة الصيف إِلى الشام. قال الرشاطي: كانت قريش تجارتهم لا تَعْدو مكة، وكانت الأَعاجم تَقْدَم عليهم بالسلع فيشترون منهم، حتى ركب هاشم إِلى الشام فنزل بقيصر وكان كل يوم يذبح شاة فيصنع …"
