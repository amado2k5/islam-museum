label: { ar: "الموطأ 2313 — مالك: بيع المكاتب بعرض من العروض", en: "Muwatta 2313", es: "Muwatta 2313", fr: "Muwatta 2313", ur: "موطا 2313", tr: "Al-Muwatta 2313 — Malik: Teklifler arasından seçim yaparak ofis satışı", id: "Al-Muwatta 2313 — Malik: Penjualan kantor dengan penawaran dari antara para penawar" }
summary:
  ar: "قال: إن كاتب سيد المكاتب مكاتبه بعرض من إبل أو بقر أو غنم أو رقيق، فيصلح للمشتري أن يشتريه بذهب أو فضة أو بعرض يخالف ما كوتب عليه، ويعجل ذلك ولا يؤخره. {cite:muwatta-maruf-1997 p.354}"
  tr: "Şöyle dedi: \"Eğer kâtiplerin başının kâtibi sözleşmesinde kendisine deve, sığır, koyun veya köle verilmesini şart koşarsa, alıcının onu altın, gümüş veya sözleşmede belirtilenden başka bir şeyle satın alması caizdir ve bunu hızlandırmalı, geciktirmemelidir.\" {cite:muwatta-maruf-1997 s.354}"
  id: "Dia berkata: Jika juru tulis dari kepala juru tulis menetapkan dalam kontraknya bahwa ia akan diberikan unta, sapi, domba, atau budak, maka diperbolehkan bagi pembeli untuk membelinya dengan emas, perak, atau sesuatu selain yang telah ditetapkan dalam kontrak, dan ia harus mempercepat proses ini dan tidak menundanya. {cite:muwatta-maruf-1997 p.354}"
