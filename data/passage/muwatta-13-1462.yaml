label: { ar: "الموطأ 1462 — يحيى بن سعيد عن القاسم بن محمد: أتت الجدتان أبا بكر فأراد أن يجعل السدس للتي من قبل الأم، فقال له رجل من الأنصار إنك تترك التي لو ماتت وهو حي كان يرث منها", en: "Muwatta 1462" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد أنه قال أتت الجدتان إلى أبي بكر الصديق، فأراد أن يجعل السدس للتي من قبل الأم، فقال له رجل من الأنصار أما إنك تترك التي لو ماتت وهو حي كان إياها يرث، فجعل أبو بكر السدس بينهما. {cite:muwatta-maruf-1997 p.15}"
