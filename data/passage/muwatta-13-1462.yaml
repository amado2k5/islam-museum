label: { ar: "الموطأ 1462 — يحيى بن سعيد عن القاسم بن محمد: أتت الجدتان أبا بكر فأراد أن يجعل السدس للتي من قبل الأم، فقال له رجل من الأنصار إنك تترك التي لو ماتت وهو حي كان يرث منها", en: "Muwatta 1462", es: "Muwatta 1462", fr: "Muwatta 1462", ur: "موطا 1462", tr: "El-Muvatta 1462 — Yahya ibn Said, el-Kâsım ibn Muhammed'den rivayetle: İki nine Ebu Bekir'e geldiler ve o, anne tarafından olana mirasın altıda birini vermek istedi. Ensar'dan bir adam ona, \"Eğer o hayattayken ölmüş olsaydı, Ebu Bekir'in miras alacağı kişiyi dışarıda bırakıyorsun\" dedi.", id: "Al-Muwatta 1462 — Yahya ibn Saeed berdasarkan riwayat al-Qasim ibn Muhammad: Kedua nenek datang kepada Abu Bakr, dan dia ingin memberikan seperenam kepada nenek dari pihak ibu. Seorang pria dari kaum Ansar berkata kepadanya, \"Anda mengabaikan nenek yang, seandainya dia meninggal dunia saat dia masih hidup, dia akan mewarisi hartanya.\"" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد أنه قال أتت الجدتان إلى أبي بكر الصديق، فأراد أن يجعل السدس للتي من قبل الأم، فقال له رجل من الأنصار أما إنك تترك التي لو ماتت وهو حي كان إياها يرث، فجعل أبو بكر السدس بينهما. {cite:muwatta-maruf-1997 p.15}"
  tr: "Malik, Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayet ettiğine göre şöyle buyurmuştur: İki nine, Ebu Bekir el-Siddik'e geldiler ve o, anne tarafından olan kadına mirasın altıda birini vermek istedi. Ensar'dan bir adam ona, \"Ama sen, eğer o hayattayken ölmüş olsaydı, ondan miras alacak olan kadını dışarıda bırakıyorsun\" dedi. Bunun üzerine Ebu Bekir, mirasın altıda birini ikisi arasında paylaştırdı. {cite:muwatta-maruf-1997 s.15}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, bahwa ia berkata: Kedua nenek datang kepada Abu Bakr al-Siddiq, dan ia ingin memberikan seperenam kepada nenek dari pihak ibu. Seorang pria dari kaum Ansar berkata kepadanya, \"Tetapi engkau mengabaikan nenek yang, seandainya ia meninggal dunia saat ia masih hidup, akan mewarisi hartanya.\" Maka Abu Bakr membagi seperenam itu di antara mereka. {cite:muwatta-maruf-1997 p.15}"
