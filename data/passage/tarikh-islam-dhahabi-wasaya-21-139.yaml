text: "… قد ارتجَت، وآمتلأت السِّكَك والشّوارع. وقال أبو بكر الخلال: أخبرني عصمة بن عصام : ثنا حنبل قال: أعطى ولد الفضل بن إبراهيم أبا عبد اللّه وهو في الحبْس ثلاث شعَرات وقال: هذه من شعر النبي يفس فأوصى عند موته أن …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 21، ص 139، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
