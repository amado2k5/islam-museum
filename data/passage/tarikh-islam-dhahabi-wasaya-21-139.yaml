text: "… قد ارتجَت، وآمتلأت السِّكَك والشّوارع. وقال أبو بكر الخلال: أخبرني عصمة بن عصام : ثنا حنبل قال: أعطى ولد الفضل بن إبراهيم أبا عبد اللّه وهو في الحبْس ثلاث شعَرات وقال: هذه من شعر النبي يفس فأوصى عند موته أن …"
