text: "… في طريق من طرق المدينة، وهو جُنب، فانسلّ، فذهب، فاغتسل، ففقده النبي فلما جاءه قال: أين كنت يا أبا هريرة؟ قال: يا رسول اللّٰه لقيتني وأنا جنب، فكرهت أن أجالسك حتى أغتسل، فقال: سبحان الله!، إن المؤمن لا ينجس. - …"
