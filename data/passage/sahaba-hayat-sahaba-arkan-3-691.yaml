text: "… : بخير بأبى انت وأى يا رسول اللّٰه! فلما خرجت قلت: يا رسول اللّٰه! تقبل على هذه العجوز هذا الإقبال! فمال: يا عائشة ! انها كانت تأتينا زمان خديجة وإن حسن العهد من الإيمان. وعند اليهق ايضا عنها قالت : …"
