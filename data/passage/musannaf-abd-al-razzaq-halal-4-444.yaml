text: "… - بَابٌ هَلْ يَدْخُلُ مَكَّةَ بِغَيْرِ إِحْرَامٍ؟ أَخبرنا عَبْدُ الرَّزَّاقِ، قَالَ : أَخْبَرَنَا مَعْمَرٌ، عَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ قَالَ : لَا يَحِلُّ لأَحَدٍ مِنْ خَلْقِ اللَّهِ أَنْ يَدْخُلَ مَكَّةَ لِحَاجَةٍ وَلَا لِغَيْرِهَا إِلَّا حَرَامًا، فَإِنَّ النَّبِيّ وَلِلُ لَمْ يَدْخُلْهَا …"
