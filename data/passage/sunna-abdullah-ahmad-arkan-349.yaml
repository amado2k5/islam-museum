text: "… زال عنه الإيمان. وروي عن الحسن قال: إن راجع راجعه الإيمان. وقد قيل: يخرج من الإيمان إلى الإسلام، ولا يخرج من الإسلام. - قال ابن تيمية زخم لله في شرح حديث لا يزني الزاني حين يزني وهو مؤمن ص : …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 349، يذكر ما يرتفع معه الإيمان حين الفعل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 349, that mentions what faith is lifted by at the moment of the act; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 349 کا اقتباس جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
