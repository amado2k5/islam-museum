text: "… استغرق جميع الحاصل من الصدقات، وهكذا إذا اقتضت المصلحة إيثار غير المجاهدين من يحرم عليهم الصدقة ذكرنا فيما سبق مصارف الزكاة، وأصناف المستحقين ؛ وبقي أن نذكر أصنافاً لا تحلُّ لهم الزكاة، ولا يستحقونها وهم : - الكفرة والملاحدة. وهذا …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 402، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 402, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 402 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 4, pág. 402, que menciona lo que se ha declarado lícito, lo que no lo es y lo que se ha declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 4, page 402, mentionnant ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Seyyid Sabiq'in *Fıkıh el-Sünnet* adlı eserinin 4. cildinin 402. sayfasından, helal, haram ve haram olan hususları belirten bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
