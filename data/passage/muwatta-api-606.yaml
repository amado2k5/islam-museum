label: { ar: "موطأ مالك 606 — ورع عمر بن الخطاب عن لبن من نعم الصدقة", en: "Muwatta Malik 606 — 'Umar ibn al-Khattab's scruple over milk from the charity camels", ur: "موطأ مالک 606 — صدقے کے اونٹوں کے دودھ سے عمر بن خطاب کا ورع", es: "Muwatta Malik 606 — El escrúpulo de 'Umar ibn al-Khattab respecto a la leche de los camellos de caridad", fr: "Muwatta Malik 606 — Le scrupule d’Umar ibn al-Khattab concernant le lait des chamelles de charité", tr: "Muwatta Malik 606 — Ömer ibn el-Hattab'ın sadaka hayvanlarından elde edilen süte olan bağlılığı", id: "Muwatta Malik 606 — Ketakwaan Umar ibn al-Khattab mengenai susu dari hewan amal" }
text: "… أَسْلَمَ، أَنَّهُ قَالَ شَرِبَ عُمَرُ بْنُ الْخَطَّابِ لَبَنًا فَأَعْجَبَهُ فَسَأَلَ الَّذِي سَقَاهُ مِنْ أَيْنَ هَذَا اللَّبَنُ فَأَخْبَرَهُ أَنَّهُ وَرَدَ عَلَى مَاءٍ - قَدْ سَمَّاهُ - فَإِذَا نَعَمٌ مِنْ نَعَمِ الصَّدَقَةِ وَهُمْ يَسْقُونَ فَحَلَبُوا لِي مِنْ أَلْبَانِهَا فَجَعَلْتُهُ فِي سِقَائِي فَهُوَ هَذَا. فَأَدْخَلَ عُمَرُ بْنُ الْخَطَّابِ يَدَهُ فَاسْتَقَاءَهُ. قَالَ مَالِكٌ الأَمْرُ عِنْدَنَا أَنَّ كُلَّ مَنْ مَنَعَ …"
summary:
  ar: "خبر في موطأ مالك، رقم 606، في ورع عمر بن الخطاب عن لبن من نعم الصدقة. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Muwatta Malik, no. 606, on 'Umar ibn al-Khattab's scruple over milk from the charity camels. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "موطأ مالک کی روایت نمبر 606: صدقے کے اونٹوں کے دودھ سے عمر بن خطاب کا ورع۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 606, sobre el escrúpulo de Umar ibn al-Khattab respecto a la leche de los camellos de caridad. No utiliza las palabras halal ni haram; el buscador de Halal y Haram lo incluye entre los informes sobre escrúpulos y búsqueda de lo lícito."
  fr: "Un récit du Muwatta Malik, n° 606, relate les scrupules d'Umar ibn al-Khattab concernant le lait des chamelles données en aumône. Ce récit n'emploie pas les termes halal ou haram; le Halal and Haram Browser le classe parmi les récits relatifs aux scrupules et à la recherche du licite."
  tr: "Malik'in Muwatta'sında, Ömer ibn al-Khattab'ın sadaka hayvanlarından elde edilen süte ilişkin takvası hakkında 606 numaralı bir rivayet bulunmaktadır. Bu rivayette \"helal\" (izin verilen) veya \"haram\" (yasaklanan) terimleri kullanılmamakta olup, helal ve haram konularını inceleyenler tarafından takva ve helal olanın peşinde koşma ile ilgili rivayetlerle birlikte gruplandırılmaktadır."
  id: "Sebuah riwayat dalam Muwatta Malik, nomor 606, mengenai ketakwaan Umar ibn al-Khattab terkait susu dari hewan amal. Riwayat ini tidak menggunakan istilah \"halal\" (diperbolehkan) atau \"haram\" (dilarang), dan dikelompokkan bersama oleh mereka yang mempelajari halal dan haram dengan riwayat-riwayat ketakwaan dan pengejaran apa yang diperbolehkan."
