label: { ar: "الموطأ 291 — أبو هريرة وكعب الأحبار وعبد الله بن سلام في ساعة الجمعة", en: "Muwatta 291" }
text: "خير يوم طلعت عليه الشمس يوم الجمعة، فيه خلق آدم، وفيه أهبط من الجنة، وفيه تيب عليه، وفيه مات، وفيه تقوم الساعة"
summary:
  ar: "يرويه مالك عن يزيد بن عبد الله بن الهاد عن محمد بن إبراهيم التيمي عن أبي سلمة بن عبد الرحمن عن أبي هريرة، في باب ما جاء في الساعة التي في يوم الجمعة: خرج أبو هريرة إلى الطور فلقي كعب الأحبار فحدثه كعب عن التوراة وحدثه هو عن النبي، ومما حدثه أن خير يوم طلعت عليه الشمس يوم الجمعة، فيه خُلق آدم وأُهبط من الجنة وتيب عليه ومات، وفيه تقوم الساعة، وما من دابة إلا وهي مصيخة يوم الجمعة شفقاً من الساعة إلا الجن والإنس، وفيه ساعة لا يصادفها عبد مسلم وهو يصلي يسأل الله شيئاً إلا أعطاه. فقال كعب: ذلك في كل سنة يوم، فقال أبو هريرة: بل في كل جمعة، فقرأ كعب التوراة وصدّق. ثم لقي أبو هريرة بصرة بن أبي بصرة الغفاري فأخبره أنه سمع النبي ينهى أن تُشد الرحال إلا إلى المسجد الحرام ومسجده ومسجد إيلياء أو بيت المقدس. ثم لقي عبد الله بن سلام فحدثه، فقال ابن سلام إن كعباً أخطأ أولاً ثم أصاب، وأخبره أن تلك الساعة آخر ساعة في يوم الجمعة، فلما استشكل أبو هريرة أنها ليست ساعة صلاة ذكّره ابن سلام بحديث أن من جلس ينتظر الصلاة فهو في صلاة. ويخرّجه المحقق عند أبي داود (1046) والترمذي (491) والحاكم وأحمد والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه لا يعلم أحداً ساقه أحسن من مالك عن ابن الهاد، إلا قوله «بصرة بن أبي بصرة» الذي لم يتابعه عليه أحد والمعروف «أبو بصرة الغفاري»، ويظن الوهم من مالك أو من ابن الهاد (التمهيد 23/37–38)؛ ويفسر «كذب كعب» بلغة أهل الحجاز بمعنى أخطأ. {cite:muwatta-maruf-1997 p.165} {cite:muwatta-maruf-1997 p.166}"
