label: { ar: "الموطأ 291 — أبو هريرة وكعب الأحبار وعبد الله بن سلام في ساعة الجمعة", en: "Muwatta 291", es: "Muwatta 291", fr: "Muwatta 291", ur: "موطا 291", tr: "Al-Muwatta 291 - Cuma saatinde Ebu Hureyre, Ka'b el-Ahbar ve Abdullah ibn Salam", id: "Al-Muwatta 291 — Abu Hurairah, Ka'b al-Ahbar, dan Abdullah bin Salam pada jam Jumat" }
text: "خير يوم طلعت عليه الشمس يوم الجمعة، فيه خلق آدم، وفيه أهبط من الجنة، وفيه تيب عليه، وفيه مات، وفيه تقوم الساعة"
summary:
  ar: "يرويه مالك عن يزيد بن عبد الله بن الهاد عن محمد بن إبراهيم التيمي عن أبي سلمة بن عبد الرحمن عن أبي هريرة، في باب ما جاء في الساعة التي في يوم الجمعة: خرج أبو هريرة إلى الطور فلقي كعب الأحبار فحدثه كعب عن التوراة وحدثه هو عن النبي، ومما حدثه أن خير يوم طلعت عليه الشمس يوم الجمعة، فيه خُلق آدم وأُهبط من الجنة وتيب عليه ومات، وفيه تقوم الساعة، وما من دابة إلا وهي مصيخة يوم الجمعة شفقاً من الساعة إلا الجن والإنس، وفيه ساعة لا يصادفها عبد مسلم وهو يصلي يسأل الله شيئاً إلا أعطاه. فقال كعب: ذلك في كل سنة يوم، فقال أبو هريرة: بل في كل جمعة، فقرأ كعب التوراة وصدّق. ثم لقي أبو هريرة بصرة بن أبي بصرة الغفاري فأخبره أنه سمع النبي ينهى أن تُشد الرحال إلا إلى المسجد الحرام ومسجده ومسجد إيلياء أو بيت المقدس. ثم لقي عبد الله بن سلام فحدثه، فقال ابن سلام إن كعباً أخطأ أولاً ثم أصاب، وأخبره أن تلك الساعة آخر ساعة في يوم الجمعة، فلما استشكل أبو هريرة أنها ليست ساعة صلاة ذكّره ابن سلام بحديث أن من جلس ينتظر الصلاة فهو في صلاة. ويخرّجه المحقق عند أبي داود (1046) والترمذي (491) والحاكم وأحمد والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه لا يعلم أحداً ساقه أحسن من مالك عن ابن الهاد، إلا قوله «بصرة بن أبي بصرة» الذي لم يتابعه عليه أحد والمعروف «أبو بصرة الغفاري»، ويظن الوهم من مالك أو من ابن الهاد ⁦(التمهيد 23/37–38)⁩؛ ويفسر «كذب كعب» بلغة أهل الحجاز بمعنى أخطأ. {cite:muwatta-maruf-1997 p.165} {cite:muwatta-maruf-1997 p.166}"
  tr: "Malik, Cuma günü kıyamet hakkında rivayet edilenler bölümünde, Yezid ibn Abdullah ibn el-Had'dan, o da Muhammed ibn İbrahim el-Taymi'den, o da Ebu Selama ibn Abd el-Rahman'dan, o da Ebu Hurayra'dan nakletmiştir: Ebu Hurayra Sina Dağı'na gitti ve Ka'b el-Ahber ile görüştü. Ka'b ona Tevrat'tan bahsetti ve o da ona Peygamber'den bahsetti. Anlattıkları arasında şunlar da vardı: Güneşin doğduğu en hayırlı gün Cuma günüdür. Adem o gün yaratıldı, cennetten indirildi, tövbesi kabul edildi ve öldü. Kıyamet de o gün kopacaktır. Cinler ve insanlar dışında, Cuma günü kıyametten korkarak dikkatle dinlemeyen hiçbir yaratık yoktur. O gün, hiçbir Müslüman kulun namaz kılarken ve Allah'tan bir şey isterken rastladığı bir an vardır ki, Allah ona onu vermez. Ka'b dedi ki: Bu, her yıl bir gündür. Ebu Hurayra dedi ki: Aksine, her Cuma günüdür. Ka'b Tevrat'ı okuyup bunu doğruladı. Sonra Ebu Hurayra, Basra ibn Ebu Basra el-Gıfari ile görüştü ve o da kendisine Peygamber'in sadece Mescid-i Haram'a (Mekke), Peygamber Mescidi'ne (Medine) ve Kudüs Mescidi'ne (Kudüs) gidilmesini yasakladığını duyduğunu söyledi. Sonra Abdullah ibn Salam ile görüştü ve ona bu hikâyeyi anlattı. İbn Salam, Ka'b'ın başlangıçta yanıldığını, ancak sonra kendini düzelttiğini ve o saatin Cuma'nın son saati olduğunu söylediğini belirtti. Ebu Hurayra bunun namaz vakti olup olmadığını sorduğunda, İbn Salam ona namazı bekleyen kimsenin namazda sayıldığını belirten hadisi hatırlattı. Araştırmacı bu hadisi, Malik'in takipçilerinin rivayet zincirleri aracılığıyla Ebu Davud (1046), Tirmizi (491), Hakim, Ahmed, Şafiî ve Beyhaki'nin hadis külliyatlarına dahil etmektedir. İbn Abdülberr'in, İbn el-Had'dan rivayet edilen Malik'ten daha iyi bir rivayetçi bilmediğini, sadece \"Basra ibn Abi Basra\"ya atfedilen ve kimse tarafından doğrulanmayan bir rivayetin olduğunu, daha yaygın olanın ise \"Ebu Basra el-Gifari\" rivayeti olduğunu söylediğini aktarıyor. Hatanın Malik veya İbn el-Had'dan kaynaklandığına inanıyor (el-Tamhid 23/37-38). \"Ka'b lied\" ifadesi Hicaz halkının lehçesinde \"yanıldı\" olarak yorumlanmaktadır."
  id: "Malik meriwayatkannya dari Yazid ibn Abdullah ibn al-Had, dari Muhammad ibn Ibrahim al-Taymi, dari Abu Salama ibn Abd al-Rahman, dari Abu Hurayra, dalam surah tentang apa yang diriwayatkan tentang hari kiamat pada hari Jumat: Abu Hurayra pergi ke Gunung Sinai dan bertemu dengan Ka'b al-Ahbar. Ka'b menceritakan kepadanya tentang Taurat, dan ia menceritakan tentang Nabi. Di antara apa yang diceritakannya adalah bahwa hari terbaik di mana matahari terbit adalah hari Jumat. Pada hari itu, Adam diciptakan, diturunkan dari Surga, taubatnya diterima, dan ia meninggal. Pada hari itu, hari kiamat akan terjadi. Tidak ada makhluk yang tidak mendengarkan dengan saksama pada hari Jumat karena takut akan hari kiamat, kecuali jin dan manusia. Pada hari itu, ada suatu saat yang tidak dialami oleh seorang hamba Muslim ketika berdoa dan memohon sesuatu kepada Allah kecuali Dia akan memberikannya kepadanya. Ka'b berkata: Itu adalah satu hari setiap tahun. Abu Hurayra berkata: \"Sebaliknya, itu setiap hari Jumat.\" Maka Ka'b membaca Taurat dan membenarkannya. Kemudian Abu Hurayra bertemu dengan Basra ibn Abi Basra al-Ghifari, yang memberitahunya bahwa ia telah mendengar Nabi melarang perjalanan kecuali ke Masjidil Haram (di Mekah), Masjidil Haram (di Madinah), dan Masjidil Haram (di Yerusalem). Kemudian ia bertemu dengan Abdullah ibn Salam dan menceritakan kisahnya. Ibn Salam berkata bahwa Ka'b awalnya keliru tetapi kemudian mengoreksi dirinya sendiri, dan memberitahunya bahwa jam itu adalah jam terakhir hari Jumat. Ketika Abu Hurayrah bertanya apakah itu waktu untuk shalat, Ibn Salam mengingatkannya pada hadits yang menyatakan bahwa siapa pun yang duduk menunggu shalat dianggap sedang shalat. Peneliti memasukkan hadits ini dalam koleksi Abu Dawud (1046), al-Tirmidhi (491), al-Hakim, Ahmad, al-Shafi'i, dan al-Bayhaqi, melalui rantai periwayatan pengikut Malik. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa ia tidak mengetahui siapa pun yang meriwayatkan hadits ini lebih baik daripada Malik berdasarkan riwayat Ibnu al-Had, kecuali versi yang dinisbahkan kepada \"Basra ibn Abi Basra,\" yang tidak didukung oleh siapa pun, dan versi yang lebih umum adalah \"Abu Basra al-Ghifari.\" Ia meyakini bahwa kesalahan tersebut berasal dari Malik atau Ibnu al-Had (al-Tamhid 23/37-38). Frasa \"Ka'b lied\" diartikan dalam dialek penduduk Hijaz sebagai \"dia keliru.\""
