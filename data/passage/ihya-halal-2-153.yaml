text: "… أزهد منكم فيما حرم اللّه عليكم. وفى لفظ آخر.كانوا بالبلاء أشدفر حامنكم بالحصب والرخاء، لورأ يتموم قلتم مجانين. ولورأواخياركم قالواما لهؤلاء من خارق: ولوراً واشراركم قالوا ما يؤمن هؤلاء بيوم الحساب وكان أحدهم يعرض له المال الحلال فلا يأخذهو يقول …"
summary:
