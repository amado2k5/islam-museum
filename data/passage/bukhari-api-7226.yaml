label: { ar: "صحيح البخاري 7226 — ما كرهه الفقهاء، ما كُره", en: "Sahih al-Bukhari 7226 — what the jurists disliked; what was disliked", ur: "صحیح بخاری 7226 — جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا", fr: "Sahih al-Bukhari 7226 — ce que les juristes ont réprouvé ; ce qui fut réprouvé", es: "Sahih al-Bujari 7226 — lo que los juristas reprobaron; lo que se reprobó", tr: "Sahih el-Buhari 7226 — Fıkıhçıların hoşlanmadığı, hoş karşılanmayan şeyler", id: "Sahih al-Bukhari 7226 — Apa yang tidak disukai oleh para ahli hukum, apa yang tidak disukai" }
text: "… بْنُ خَالِدٍ، عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي سَلَمَةَ، وَسَعِيدِ بْنِ الْمُسَيَّبِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" وَالَّذِي نَفْسِي بِيَدِهِ لَوْلاَ أَنَّ رِجَالاً يَكْرَهُونَ أَنْ يَتَخَلَّفُوا بَعْدِي وَلاَ أَجِدُ مَا أَحْمِلُهُمْ مَا تَخَلَّفْتُ، لَوَدِدْتُ أَنِّي أُقْتَلُ فِي سَبِيلِ اللَّهِ، ثُمَّ أُحْيَا ثُمَّ أُقْتَلُ، ثُمَّ أُحْيَا ثُمَّ أُقْتَلُ، ثُمَّ أُحْيَا ثُمَّ أُقْتَلُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7226، يرد فيه ذكر ما كرهه الفقهاء، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 7226 (Wishes), whose wording mentions what the jurists disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 7226، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 7226, dont le texte mentionne ce que les juristes ont réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 7226, cuyo texto menciona lo que los juristas reprobaron, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 7226 numaralı hadis, âlimlerin hoş karşılamadığı ve hoş karşılanmayan şeyleri zikrediyor. Bu hadis, farz, ibadet, tavsiye edilen, hoş karşılanmayan, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklıyor ancak buna dayanarak bir fetva vermiyor."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7226, menyebutkan apa yang tidak disukai oleh para ulama dan apa yang dianggap tidak disukai. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
