text: "… ما حذرهم. ولما كانت ليلة السّبت من شَوَال سنة خمس، وكاز من صُنع اللّٰه إرسوله صلى ب الله عنيه وسلم أن أرسل أبو سفيان بن حَرْب ورموس غَطفان إلى بنى قُريظة مِكْرِمة بن أبى جهل، فى تقر من قريش وغطفان، …"
