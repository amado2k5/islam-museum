label: { ar: "الموطأ 2723 — جابر بن عبد الله: عائد المريض يخوض الرحمة حتى يقعد فتقر فيه", en: "Muwatta 2723" }
summary:
  ar: "بلغ مالكا عن جابر بن عبد الله أن رسول الله قال: إذا عاد الرجل المريض خاض الرحمة، حتى إذا قعد عنده قرت فيه، أو نحو هذا. ويذكر المحقق أن هذا الحديث في الموطأ مرسل، وأن معن بن عيسى رواه متصلا عن عائشة، وأن ابن وهب رواه متصلا في غير الموطأ. {cite:muwatta-maruf-1997 p.534}"
