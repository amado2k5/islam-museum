label: { ar: "الموطأ 2723 — جابر بن عبد الله: عائد المريض يخوض الرحمة حتى يقعد فتقر فيه", en: "Muwatta 2723", es: "Muwatta 2723", fr: "Muwatta 2723", ur: "موطا 2723", tr: "El-Muvatta 2723 — Cabir ibn Abdullah: Hastayı ziyaret eden kişi, yanına oturup huzur bulıncaya kadar rahmete boğulur.", id: "Al-Muwatta 2723 — Jabir ibn Abdullah: Orang yang mengunjungi orang sakit akan diliputi rahmat hingga ia duduk dan menemukan kedamaian di sisinya." }
summary:
  ar: "بلغ مالكا عن جابر بن عبد الله أن رسول الله قال: إذا عاد الرجل المريض خاض الرحمة، حتى إذا قعد عنده قرت فيه، أو نحو هذا. ويذكر المحقق أن هذا الحديث في الموطأ مرسل، وأن معن بن عيسى رواه متصلا عن عائشة، وأن ابن وهب رواه متصلا في غير الموطأ. {cite:muwatta-maruf-1997 p.534}"
  tr: "Malik, Cabir ibn Abdullah'tan rivayetle, Allah Resulü'nün şöyle buyurduğunu bildirmiştir: \"Bir kimse hasta birini ziyaret ettiğinde rahmete boğulur ve onunla oturduğunda bu rahmet onun içinde yerleşir\" veya buna benzer bir şey. Araştırmacı, Muvatta'daki bu hadisin mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu, Ma'n ibn İsa'nın bunu Aişe'den naklettiği bir isnadla rivayet ettiğini ve İbn Vahb'ın da Muvatta'dan başka bir eserde isnadla rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.534}"
  id: "Malik meriwayatkan dari Jabir ibn Abdullah bahwa Rasulullah SAW bersabda: “Ketika seseorang mengunjungi orang sakit, ia akan dipenuhi dengan rahmat, dan ketika ia duduk bersamanya, rahmat itu akan menetap di dalam dirinya,” atau sesuatu yang serupa. Peneliti menyebutkan bahwa hadits dalam Al-Muwatta ini mursal (hadits dengan rantai periwayatan yang hilang), dan bahwa Ma’n ibn Isa meriwayatkannya dengan rantai periwayatan yang terhubung dari Aisyah, dan bahwa Ibnu Wahb meriwayatkannya dengan rantai periwayatan yang terhubung dalam karya selain Al-Muwatta. {cite:muwatta-maruf-1997 p.534}"
