text: "… الأَنْصَارِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ أُنَيْسٍ الْجُهَنِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ مِنْ أَكْبَرِ الْكَبَائِرِ الشِّرْكُ بِاللَّهِ وَعُقُوقُ الْوَالِدَيْنِ وَالْيَمِينُ الْغَمُوسُ وَمَا حَلَفَ حَالِفٌ بِاللَّهِ يَمِينَ صَبْرٍ فَأَدْخَلَ فِيهَا مِثْلَ جَنَاحِ بَعُوضَةٍ إِلاَّ جُعِلَتْ نُكْتَةً فِي قَلْبِهِ إِلَى يَوْمِ الْقِيَامَةِ \". قَالَ أَبُو عِيسَى وَأَبُو أُمَامَةَ الأَنْصَارِيُّ هُوَ ابْنُ ثَعْلَبَةَ وَلاَ نَعْرِفُ اسْمَهُ وَقَدْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3020، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3020 (Chapters on Tafsir), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3020، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
