text: |-
  والتعلبىّ على الجواد عنية
  ٢١٤
  • ⁦(فصل المين)⁩.
  •عقم).
  يع زوجوده قال الاصعىّ الاعسم من الظباء والوعول الذى فى ذراعيسه ياض وقال أبو
  بيدة الذى باحذى يديه ساض والاسم العصمة والوعول عصم وعنز عصماء واذا كان
  ماحدى يدى الفرس ساض قل أوكثرفهو أعضم المنى أو اليسرى وان كان يديه جيع
  فهو أعصم البدين الا أن يكون يوجه-ه وضح فهو محيل ذهب عنه العصم وان كان بوجهه
  البداض بيه واحدة والعسام رباط القرية وسيرها الذى تحمل بد قال الشاعر أبوكبيم
  وقرية أقوام جعات عصامها • على كاهل منى ذلول مرحل
  قال إبن السكيت أعصمث القربة جعات لها عصاما وأعصمت فلانا اذا هيأت له فى الرحل
  أو السرج ما يعتصم بهللايسقط وأعصم اذا تشددواستمسك بتئ من أن يصرعه فرسه
  أورايجلته قال الشاعر ١ كفل الفروسة دائم الاعصام• وكذلت اعتصم يه واستعصم به
  وأعصم الرجل بصاحبه لزمه وقواهم ما وراءك ياعصام هو اسم حاجب النعمان بن المنذر
  وفى المثل كن عصاميا ولا تكن عظاميا يريدون به قوله .
  نفس عصام مودت عصاما • وعلمته الكر والاقداما • وصيرة مل كاهماما
  والعواصم: لادقصبتها انطاكية ⁦(عضم)⁩. العضم لوح الغدان الذى فى رأسه الحديدة
  والعضم الخشبة التى يذرّى بها الطعام والعضم مقبض القوس والعضم عسيب البعير
  والجمع أعضمة ظم عظم الشى عظما كبر فهو عظيم والعظام بالضم مثل وعظم الشئ
  أكثره ومعظمه وقواهم فى التعجب عظم البطن بطنك بمعنى عظم اغاهو مخفف منقول وانا
  يكون ذلك فيما كان مدحا أودُمًا وكل ماحسن أن يكون ع-لى مذهب نعم و بتمر صح تخفيفه
  ونقل حركة وسطه الى أوله ومالا يحسن لم ينقل وان جاز تخففه تقول حسن الوجه وجهك
  وحسن الوجه وجهاك وحسن الوجه وجهك ولا يجوز أن تقول قد حسسن وجهاك لانه
  لا يصلح فيه نعم ويجوز أن تخففه فتقول قدحسن وجهك فقس عليه وأعظم الامر وعظمه
  أى تجمه والتعظيم التجيل واستعظ مه عدّه عظيما واسة عظم وتعظم تكبر والاسم العظم
  وتعاظمه أمر كذا وتقول أصابنا مط لا يتعاظ مه شىَ أى لا يعظم عند مشئ والعظيمة
  والمعظمة النسازلة الشديدة والاعظامة والعظامة كالوسادة تعظم بها المرأة عجيزتهاو كذلك
  العظمة بالضم والعظامة بالتشديد والعظمة الكبرياء وعظمة الذراع أيضا مستغلظها والعظم
  واحد العظام وعظم الرحل أيضاخشبة بلا أنساع ولا أداة (عظلم العظلم نيت يصبغ
  به وهو بالفارسية نقل ويقال هوالوسمة والعظالم الليل المظلم وهوء-لى التشبيه تم
  العقم والعقمة بالفتح ضرب من الوسى وكذلك العقمة بالكسر والعقام بالفتح العقيم والحرب
  الشديدة والرجل السي القلق وأنتد أبوعمرو
  وأنت عقام لايصاب له هوى • وذوهمة فى المال وهو مضيع
  والعقام أيضا الداء الذى لا يبرأ منه وقياسه الضم الاأن المسموع هو الفتح والمعاقم من انخيل
  المفاصل واحدها معقم فالرسغ عند الحاذر معقم والركبة معقم والعرقوب معقم قال خفاف
  شهدت بمدلوك المعاقم محنق• أى ليس برهل والمعقم أيضاعقدة فى التين وأعقم اللّٰه رحها
