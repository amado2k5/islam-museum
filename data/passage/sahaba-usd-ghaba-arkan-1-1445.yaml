text: "… الوهاب بن هبة اللّٰه بإسناده، عن عبدالله : حدثني أبي، حدثنا أبو النَّضر، حدثنا المبارك، عن الحسن، عن رجل من بني سَليط قال: أتيت الَبِي لَِّها وهو في جماعة من الناس، فسمعته يقول: المسلم أخو المسلم، لا يظلمه ولا يخذله، …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1445، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
