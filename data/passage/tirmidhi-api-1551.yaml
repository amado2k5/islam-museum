label: { ar: "جامع الترمذي 1551 — الرخصة، ما لا بأس به", en: "Jami' al-Tirmidhi 1551 — the concession (rukhsa); what is said to be no harm", ur: "جامع ترمذی 1551 — رخصت، جس میں کوئی مضائقہ نہیں", fr: "Jami' al-Tirmidhi 1551 — la dispense (rukhsa) ; ce qui est dit sans inconvénient", es: "Yami' al-Tirmidhi 1551 — la dispensa (rukhsa); lo que se dice que no tiene inconveniente" }
text: "… طَلْحَةَ، أَنَّ النَّبِيَّ كَانَ إِذَا ظَهَرَ عَلَى قَوْمٍ أَقَامَ بِعَرْصَتِهِمْ ثَلاَثًا. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ وَحَدِيثُ حُمَيْدٍ عَنْ أَنَسٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ رَخَّصَ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ فِي الْغَارَةِ بِاللَّيْلِ وَأَنْ يَبِيتُوا وَكَرِهَهُ بَعْضُهُمْ. وَقَالَ أَحْمَدُ وَإِسْحَاقُ لاَ بَأْسَ أَنْ يُبَيَّتَ الْعَدُوُّ لَيْلاً. وَمَعْنَى قَوْلِهِ وَافَقَ مُحَمَّدٌ الْخَمِيسَ يَعْنِي بِهِ الْجَيْشَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1551، يرد فيه ذكر الرخصة، وما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 1551 (The Book on Military Expeditions), whose wording mentions the concession (rukhsa), what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 1551، جس کے الفاظ میں رخصت، جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1551, dont le texte mentionne la dispense (rukhsa), ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 1551, cuyo texto menciona la dispensa (rukhsa), lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
