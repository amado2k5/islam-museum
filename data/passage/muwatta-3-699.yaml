summary:
  ar: "يقول يحيى: قال مالك: أحسن ما سمعت فيمن كانت له غنم على راعيين مفترقين أو على رعاء مفترقين في بلدان شتى أن ذلك يُجمع كله على صاحبه فيؤدي صدقته، ومثل ذلك الرجل له الذهب أو الورق متفرقة في أيدي ناس شتى ينبغي له أن يجمعها فيخرج ما وجب عليه من زكاتها. ويذكر المحقق فروق النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.351}"
