label: { ar: "الموطأ 699 — مالك: الغنم على رعاء متفرقين في بلدان شتى تجمع كلها على صاحبها فيؤدي صدقتها", en: "Muwatta 699", es: "Muwatta 699", fr: "Muwatta 699", ur: "موطا 699", tr: "Al-Muwatta 699 — Malik: Çeşitli ülkelerde dağınık halde bulunan çobanlara ait koyunlar, sahiplerinin mülkiyetinde toplanır ve sahipleri de zekâtlarını öderler.", id: "Al-Muwatta 699 — Malik: Domba-domba milik para penggembala yang tersebar di berbagai negeri semuanya dikumpulkan di bawah kepemilikan pemiliknya, yang kemudian membayar zakatnya." }
summary:
  ar: "يقول يحيى: قال مالك: أحسن ما سمعت فيمن كانت له غنم على راعيين مفترقين أو على رعاء مفترقين في بلدان شتى أن ذلك يُجمع كله على صاحبه فيؤدي صدقته، ومثل ذلك الرجل له الذهب أو الورق متفرقة في أيدي ناس شتى ينبغي له أن يجمعها فيخرج ما وجب عليه من زكاتها. ويذكر المحقق فروق النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.351}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Koyunları iki ayrı çobanın veya farklı ülkelerde bulunan birkaç çobanın elinde olan bir kimse için duyduğum en iyi şey, bunların hepsinin toplanıp tek bir kişiye verilmesi ve o kişinin de zekâtını ödemesidir. Benzer şekilde, bir adamın altın veya gümüşü farklı kişilere dağılmışsa, bunları toplamalı ve zekâtını ödemelidir. Editör, el yazmalarındaki farklılıklardan ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğinden bahsetmektedir. {cite:muwatta-maruf-1997 s.351}"
  id: "Yahya berkata: Malik berkata: Hal terbaik yang pernah kudengar mengenai seseorang yang memiliki domba di bawah dua gembala yang berbeda atau beberapa gembala di negara yang berbeda adalah bahwa semuanya harus dikumpulkan dan diberikan kepada satu orang yang kemudian akan membayar zakat. Demikian pula, jika seseorang memiliki emas atau perak yang tersebar di antara orang-orang yang berbeda, ia harus mengumpulkannya dan membayar zakat yang wajib dibayarkan atasnya. Editor menyebutkan perbedaan dalam manuskrip dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.351}"
