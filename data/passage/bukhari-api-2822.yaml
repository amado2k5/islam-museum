label: { ar: "صحيح البخاري 2822 — تربية الأب ووصيته", en: "Sahih al-Bukhari 2822 — the father raising and counselling", ur: "صحیح بخاری 2822 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 2822 — El padre que cría y aconseja", fr: "Sahih al-Bukhari 2822 — l'éducation et les conseils du père", tr: "Sahih el-Buhari 2822 — Babanın Terbiyesi ve Vasiyeti", id: "Sahih al-Bukhari 2822 — Didikan dan Wasiat Ayah" }
text: "… سَمِعْتُ عَمْرَو بْنَ مَيْمُونٍ الأَوْدِيَّ، قَالَ كَانَ سَعْدٌ يُعَلِّمُ بَنِيهِ هَؤُلاَءِ الْكَلِمَاتِ كَمَا يُعَلِّمُ الْمُعَلِّمُ الْغِلْمَانَ الْكِتَابَةَ، وَيَقُولُ إِنَّ رَسُولَ اللَّهِ كَانَ يَتَعَوَّذُ مِنْهُنَّ دُبُرَ الصَّلاَةِ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ \". فَحَدَّثْتُ بِهِ مُصْعَبًا فَصَدَّقَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2822، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2822 (Fighting for the Cause of Allah (Jihaad)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2822، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2822 (La lucha por la causa de Alá (Yihad)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2822 (Le Jihad), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site « Paternité en Islam » le répertorie avec les versets du Coran, la Sunna, la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'de 2822 numaralı hadis, babanın yetiştirilmesi ve öğütlerinden bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2822, menyebutkan tentang didikan dan nasihat seorang ayah. Situs web \"Kebapakan dalam Islam\" mengumpulkan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
