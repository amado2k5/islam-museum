text: "… إنما هو فى الحلال. أما الحرام فالزهد فيه لازمٌ من أمر الإإسلام، عامٌ فى أهل الإيمان، ليس ثمّا يتجارى فيه خواص المؤمنين مقتصرين عليه فقط ؛ وإنما تجاروا فيما صاروا به من أعلواص، وهو الزهد فى المباح. فأمّا المكروه فذو …"
