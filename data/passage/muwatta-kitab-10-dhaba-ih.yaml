label: { ar: "الموطأ، كتاب الذبائح", en: "Muwatta, Book of Slaughter (dhaba'ih)", es: "Muwatta, Libro de la Matanza (dhaba'ih)", fr: "Muwatta, Livre du massacre (dhaba'ih)", ur: "موطا، ذبح کی کتاب ⁦(ذہبی)⁩", tr: "El-Muvatta, Katliam Kitabı", id: "Al-Muwatta, Kitab Pembantaian" }
summary:
  ar: "كتاب الذبائح، الكتاب العاشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 11 نصاً (1403–1413) في أربعة أبواب، من الصفحة 629 إلى الصفحة 633 من ملف PDF المجلد الأول. يبدأ بالتسمية على الذبيحة، ثم ما يجوز من الذكاة في حال الضرورة، ثم ما يكره من الذبيحة، ويختم بذكاة ما في بطن الذبيحة. {cite:muwatta-maruf-1997 p.629} {cite:muwatta-maruf-1997 p.633}"
  en: "The Book of Slaughter, tenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 11 reports (1403–1413) in four babs, PDF pp. 629–633 of volume 1, from naming God over the slaughter to the slaughter of what is in the belly of the slaughtered animal."
  es: "El Libro de la Matanza, décimo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 11 informes (1403–1413) en cuatro babs, PDF pp. 629–633 del volumen 1, desde nombrar a Dios sobre la matanza hasta la matanza de lo que hay en el vientre del animal sacrificado."
  fr: "Le Livre de l'Abattage, dixième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 11 rapports (1403–1413) dans quatre babs, PDF pp. 629–633 du volume 1, depuis la dénomination de Dieu sur l'abattage jusqu'à l'abattage de ce qui se trouve dans le ventre de l'animal abattu."
  ur: "ذبح کی کتاب، یحییٰ ابن یحییٰ کی تجدید میں موطا کی دسویں کتاب ⁦(ایڈیشن معارف 1997)⁩: 11 رپورٹیں (1403–1413) چار باب میں، پی ڈی ایف پی پی 629-633 جلد 1، ذبح پر خدا کا نام لینے سے لے کر ذبح کرنے تک۔ جانور"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği Al-Muwatta'nın onuncu kitabı olan Kesim Kitabı, Beşar Awad Maruf'un (1997) baskısında yer almaktadır: 11 metin (1403-1413 Hicri), dört bölüm halinde, 1. cildin PDF dosyasının 629. sayfasından 633. sayfasına kadar. Hayvan üzerine Allah'ın adının anılmasıyla başlar, ardından zorunluluk hallerinde kesimde caiz olanlar, kesimde mekruh olanlar ve hayvanın rahmindeki organın kesilmesiyle sona erer. {cite:muwatta-maruf-1997 s.629} {cite:muwatta-maruf-1997 s.633}"
  id: "Kitab Penyembelihan, kitab kesepuluh Al-Muwatta' dalam riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997): 11 teks (1403–1413 H) dalam empat bab, dari halaman 629 hingga halaman 633 dari file PDF Volume 1. Dimulai dengan penyembahan nama Allah atas hewan, kemudian apa yang diperbolehkan dalam penyembelihan dalam keadaan darurat, kemudian apa yang tidak disukai dalam penyembelihan, dan diakhiri dengan penyembelihan bagian dalam rahim hewan. {cite:muwatta-maruf-1997 p.629} {cite:muwatta-maruf-1997 p.633}"
