  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 5, p. 371, that mentions the lawful, the unlawful, the forbidden things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 5، ص 371 کا اقتباس جس میں حلال، حرام، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
