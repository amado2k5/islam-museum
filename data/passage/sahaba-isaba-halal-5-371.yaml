text: "… كانوا يقولون فى الجاهلية فاذا هتف يهتف لى يقول ويحك عذ بالله ذى الجلال منزل الحرام والحلال الابيات فقلت يا أيها الداعى ما تحيل أرشد عندك أم تضابل فقال هذا ر.ول اللّه ذو الخيرات جاء بياسين وحاميات محرمات ومحللات يأمرنا …"
summary:
