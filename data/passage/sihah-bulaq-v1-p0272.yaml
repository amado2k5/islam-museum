text: |-
  عر)
  ٣٦٩
  معيت بذلك لان عذرة الجارية تختبر بها ومنه قولهم سكانت بيضة العقر للعطمة
  اذا كانت مرّة واحدة وقال بعضهم بيضة العقراغاه و صكولهسم بيض الانوق وإلا باق
  العقوق فهو-:-ل لمالا يكون وعة رالنار أيضا وسطها ومعظمها قال الهذلهو أبو
  ذؤيب) يصف السيوف ويشبهها بالنار
  وبيض كالسلاجم مرهفات * كان ظباتهاعر بعيج
  وعة والحوض مؤخره حيث تقف الابل اذا وردت يقال عقروعة رمنسل عسر وعسر قال
  الشاعر امى القيس
  فرماها فى فرائصها • بازاء الحوض أوعقزه
  والجسع الاعقار والعقرة الناقة التى لا تشرب الامن العروالازية التى لا تشرب الامن
  الازاء والعقربالفتح القصر وكل بناءمى تفع قال لبيديصف ناقته
  كعقرالهاجرىّ اذابناء * باشباهحذين على مثال
  والعة رموضع ببابل قتل به يزيد بن المهلب يوم العقر وعقر كل شئ أصله قال الاصمعى عقر
  الدارأ صلها وهومحلذ القوم وأهل المدينة يقولون عقر الدار بالضم وعنقر القصب أصله بزيادة
  الذون وعنة رالرجل عنصره ⁦(عقفر)⁩. العنقفي الداهية يقال عقفرته الدواهى أى
  أهلمكته ⁦( عكر )⁩ عكر يعكر عكراعطف والعكرة المكترة وفى الحديث قلنا يارسول اللّٰه
  نحن الفرّارون فقال انتم العكارون أنافئة المسلمين وعكربه بعيره مثسل عجريداذاعطف د
  الى أهل وغلبه واعتكر الظلام اختاط كانه كربعضه على بعض من بطء انجلائه واعتمكر
  المطرأى كثر وتغاكر القوم اختاطوا والعكر دردة الزيت وغيره وقد عكوت المسرجة بالكسر
  تعكر عكرا اذا اجتمع فيها الدردىّ وعكر الشراب والماء والدهن آخره وخاثره وقد عكروشراب
  عكر وأعكرته أنا وعصكرته تمكير اجعات فيه العكر والعكر أيضاجع عكرة وهى القطيع
  الضخم من الابل قال أبو عبيدة العكرة ما بين الحسين الى المائة وقال الاصعى العكرة المسون
  الى الستين الى السبعين يقال أعكر الرجل فهو معكراذا كانت عنده عكرة والعكرة أيضا
  العكدة وهى أصل اللان والعكر بالكسر الاصل مثل العتر يقال رجع فلان الى عكره
  وباع فلان عكره أى أصل أرضه وفى الحديث لما نزل قوله تعالى اقترب للناس حسابهم تناهى
  أهل الضلالة قليلا ثم عادوا الى عكرهم أى الى أصل مذهبهم الردىء وأعماله-م السوما
  ( *ر. عوالرجل بالكسر يعمر عمرا وعمراءلى غير قياس لان قياس مصدره التحريك
  أى عاش زما نالطويلا ومنه قولهم أطال اللّٰه عم رك وعمركْ وه-ما وان كانا مصدرين بمعنى
  الاأنه استعمل فى القسم أحده ماوهو المفتوح فاذا أدخلت عليه اللام رفعته بالا بتداه!
  قلت لعمر الله واللام لتوكبد الابتداء واتظبر محذوف والتقدير لهه واللّه قسمى ولعمراقه
  ما أقسم يد قان لم تأت باللام تسبته نسب المصا دروقات عم رالّٰه مافعات كذا وعمركالله
  ما فعلت كذا ومعنى لعمر اللّه وعمر اللّه أحلف ببقاء اللّٰه ودوامه واذا قلت عمرك اللّه فكأنك
  قلف بتعميركك اللّه أى باقرارك له بالبقاء وقول عمر بن ألب ربيعة المخزومى
  أيها المنكح الترياسهيلا • عمرك اللّٰه كيف يلتقيان
  يريد سألت اللّٰه أن يطيل عمر ل لانه لم يرد القسم بذلك والعمر واحد ع ورالاسنان وه وما بيتها
