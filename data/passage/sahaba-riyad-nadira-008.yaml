text: "هم كلهم أروى المتقدم ذكرها في فصل نسبه ، وذكر ذلك الدارقطني في كتاب الأخوة ، وذكر أن أم كلثوم من المهاجرات الأول ، يقال : إنها أول قرشية بايعت النبي للفي وأنكحها زيد بن حارثة ، ثم خلف عليها"
