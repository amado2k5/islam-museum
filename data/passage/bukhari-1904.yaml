label:
  ar: "البخاري 1904 — الصوم لي وأنا أجزي به"
  en: "Bukhari 1904 — Fasting is Mine, and I reward it"
  ur: "بخاری 1904 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "قال الله كل عمل ابن آدم له إلا الصيام، فإنه لي، وأنا أجزي به. والصيام جنة، وإذا كان يوم صوم أحدكم، فلا يرفث ولا يصخب، فإن سابه أحد، أو قاتله فليقل إني امرؤ صائم. والذي نفس محمد بيده لخلوف فم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 1904: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 1904: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 1904: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
