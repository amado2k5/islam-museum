label:
  ar: "البخاري 1904 — الصوم لي وأنا أجزي به"
  en: "Bukhari 1904 — Fasting is Mine, and I reward it"
  ur: "بخاری 1904 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
  es: "Bukhari 1904 — El ayuno es mío, y yo lo recompenso."
  fr: "Bukhari 1904 — Le jeûne m'appartient et je le récompense."
  tr: "Buhari 1904 — Oruç Benim içindir ve Ben onun karşılığını vereceğim."
  id: "Al-Bukhari 1904 — Puasa adalah untuk-Ku dan Aku akan memberi pahala kepadanya"
text: "قال الله كل عمل ابن آدم له إلا الصيام، فإنه لي، وأنا أجزي به. والصيام جنة، وإذا كان يوم صوم أحدكم، فلا يرفث ولا يصخب، فإن سابه أحد، أو قاتله فليقل إني امرؤ صائم. والذي نفس محمد بيده لخلوف فم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 1904: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 1904: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 1904: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 1904: El ayuno es mío, y yo lo recompenso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari n° 1904: « Le jeûne M’appartient et Je le récompense. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 1904: “Puasa itu untuk-Ku, dan Aku akan memberi pahala kepadanya.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan para penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
