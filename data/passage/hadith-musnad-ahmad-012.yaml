text: "ن اليهود إلى عمر ، فقال: يا أمير المؤمنين، إنكم تقرءون آية في كتابكم لو علينا معشر اليهود نزلت، لا تخذنا ذلك اليوم عيدا، قال: وأي آية هي؟ قال : قوله عز وجل: {اليوم أكملت لكم دينكم وأتممت عليكم نعمتي)"
