text: "من الفجر روى البخاري عن سهل بن سعيد قال أنزلت كلوا واشربوا حتى يتبين لكنم الخيط الأبيض من الخيط الأسود [187] ولم ينزل من الفجر فكان رجال إذا أرادوا الصوم ربط أحدهم في رجليه الخيط الأبيض والخيط الاسود فلا يزال يأكل ويشرب حتى يتبين له"
