label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ١", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 1", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 1", es: "Tathbit Dala'il al-Nubuwwa - Segunda parte, capítulo 1", fr: "Tathbit Dala'il al-Nubuwwa — Deuxième partie, chapitre 1", tr: "Peygamberliğin İşaretlerinin Belirlenmesi — İkinci Kısım, Birinci Bölüm", id: "Menetapkan Tanda-Tanda Kenabian — Bagian Kedua, Bab 1" }
text: "وهو أنه كان يتوعد قريشا وهو بمكة بنصر الله له وظهوره عليهم، فيقولون: أيظن محمد أنه يغلبنا على مكه بأتباعه الفقراء والعبيد ونحن الأقوياء الأغنياء والناس كلهم معنا والرغبة عندنا لا عنده والبأس والنجدة لنا لا له، فتلا …"
summary:
  ar: "مقطع من الباب ١ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 1 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 1 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
  es: "Un fragmento del capítulo 1 de la segunda parte de Tathbit Dala'il al-Nubuwwa, de Qadi Abd al-Jabbar al-Hamdani. El autor mutazilí reúne pruebas de la misión y los milagros del Profeta a partir del Corán y de relatos transmitidos, respondiendo a quienes niegan la profecía o la despojan de sus milagros. El extracto citado proviene de la edición de Wikisource."
  fr: "Extrait du chapitre 1 de la deuxième partie du Tathbit Dala'il al-Nubuwwa du cadi Abd al-Jabbar al-Hamdani; l'auteur mu'tazilite rassemble des preuves de la mission et des miracles du Prophète tirées du Coran et des hadiths, répondant ainsi à ceux qui nient la prophétie ou la privent de ses miracles. Cet extrait est tiré de l'édition Wikisource."
  tr: "Mu'tezile mezhebinin önde gelen isimlerinden Hakim Abdülceber el-Hamdani'nin \"Peygamberliğin Delillerini Ortaya Koymak\" adlı eserinin ikinci cildinin 1. bölümünden bir alıntı; yazar, Kur'an ve rivayet edilen hadislerden yola çıkarak Peygamberin mesajının ve mucizelerinin doğruluğuna dair deliller topluyor ve peygamberliği inkar edenleri veya mucizelerini reddedenleri çürütüyor. Alıntı, Wikisource'da bulunan kitabın baskısından alınmıştır."
  id: "Cuplikan dari Bab 1 jilid kedua \"Membangun Bukti-Bukti Kenabian\" karya Hakim Abd al-Jabbar al-Hamdani; penulis—tokoh terkemuka mazhab Mu'tazila—mengumpulkan bukti-bukti kebenaran pesan Nabi dan mukjizatnya, dengan mengutip Al-Quran dan hadits-hadits yang diriwayatkan, serta membantah mereka yang mengingkari kenabian atau menolak mukjizatnya. Cuplikan ini diambil dari edisi buku yang tersedia di Wikisource."
