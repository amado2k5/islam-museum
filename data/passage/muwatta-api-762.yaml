label: { ar: "موطأ مالك 762 — الأب والأبوة", en: "Muwatta Malik 762 — the father and fatherhood", ur: "موطأ مالک 762 — باپ اور والدیت", es: "Muwatta Malik 762 — El padre y la paternidad" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يَقْطَعُ التَّلْبِيَةَ فِي الْعُمْرَةِ إِذَا دَخَلَ الْحَرَمَ. قَالَ مَالِكٌ فِيمَنْ أَحْرَمَ مِنَ التَّنْعِيمِ إِنَّهُ يَقْطَعُ التَّلْبِيَةَ حِينَ يَرَى الْبَيْتَ. قَالَ يَحْيَى سُئِلَ مَالِكٌ عَنِ الرَّجُلِ يَعْتَمِرُ مِنْ بَعْضِ الْمَوَاقِيتِ وَهُوَ مِنْ أَهْلِ الْمَدِينَةِ أَوْ غَيْرِهِمْ مَتَى يَقْطَعُ التَّلْبِيَةَ قَالَ أَمَّا الْمُهِلُّ مِنَ الْمَوَاقِيتِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 762، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 762 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 762، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 762 (Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
