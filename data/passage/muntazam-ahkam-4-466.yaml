text: "… يكون نكح وانكح من يعلم خبث باطنه ؟ قلنا فعله ذلك يقتضى انه مباح غير اننا نبعد ان ينكح احدنا غير ه مع قطعه على انه عدونى الدين وان جازان تبيح ذلك الشريعة والاشبه ان يكون اذا فرضنا انه عالم …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 4، ص 466، يرد فيه ذكر الفرض، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 4, p. 466, whose wording mentions the obligatory (fard), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 4، ص 466 کا اقتباس جس میں فرض، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam de Ibn al-Jawzi, volume numérisé 4, p. 466, dont le texte mentionne l'obligatoire (fard), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
