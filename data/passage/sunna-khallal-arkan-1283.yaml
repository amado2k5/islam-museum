text: "… المبايعة على السمع والطاعة على الاستطاعة مبايعة الأمير للنساء المبايعة على ترك الشرك ومباني الإسلام مبايعة النساء من وراء الثوب طاعة الإمام: طاعة للنبي تفسير أولي الأمر : بالأمراء النهي عن الخروج ورفع السلاح لا سمع ولا طاعة في المعصية …"
