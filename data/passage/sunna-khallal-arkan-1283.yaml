text: "… المبايعة على السمع والطاعة على الاستطاعة مبايعة الأمير للنساء المبايعة على ترك الشرك ومباني الإسلام مبايعة النساء من وراء الثوب طاعة الإمام: طاعة للنبي تفسير أولي الأمر : بالأمراء النهي عن الخروج ورفع السلاح لا سمع ولا طاعة في المعصية …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 1283، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 1283, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 1283 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 1283, que menciona los pilares del Islam; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 1283, mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın \"Sünnet\" adlı kitabının 1283. sayfasından, İslam'ın temellerini anlatan bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari buku Al-Khallal, \"Al-Sunnah,\" halaman 1283, yang menyebutkan rukun Islam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
