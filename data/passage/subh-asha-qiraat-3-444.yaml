text: "… ونَشِف ماؤه فى قشره، وقُطع بعد إلقاء بزره، وبعد أن آصفرَّ لِحَاؤه ورَقَّ شجره، وصلب شحمُه، وثقُل حجمه. الجملة الرابعة فى مساحة الأقلام فى طولها وغلَظها قال آبن مقلة : خير الأقلام ما كان طولُه من ستةً عشر إصبعا إلى …"
