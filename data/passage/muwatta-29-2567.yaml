summary:
  ar: "قال مالك: وإذا قتل الرجل عمدا وقامت على ذلك البينة، وللمقتول بنون وبنات، فعفا البنون وأبى البنات أن يعفون: فعفو البنين جائز على البنات، ولا أمر للبنات مع البنين في القيام بالدم والعفو عنه. {cite:muwatta-maruf-1997 p.448}"
