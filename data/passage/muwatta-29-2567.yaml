label: { ar: "الموطأ 2567 — مالك: عفو البنين جائز على البنات في قتل العمد", en: "Muwatta 2567", es: "Muwatta 2567", fr: "Muwatta 2567", ur: "موطا 2567", tr: "El-Muvatta 2567 — Malik: Oğullar, kasten öldürme vakalarında kızlarını affedebilirler", id: "Al-Muwatta 2567 — Malik: Anak laki-laki boleh memaafkan anak perempuan dalam kasus pembunuhan yang disengaja" }
summary:
  ar: "قال مالك: وإذا قتل الرجل عمدا وقامت على ذلك البينة، وللمقتول بنون وبنات، فعفا البنون وأبى البنات أن يعفون: فعفو البنين جائز على البنات، ولا أمر للبنات مع البنين في القيام بالدم والعفو عنه. {cite:muwatta-maruf-1997 p.448}"
  tr: "Malik şöyle dedi: Eğer bir adam kasten öldürülmüşse ve buna dair delil varsa, ölenin oğulları ve kızları varsa ve oğulları affederken kızları affetmeyi reddederse, oğulların affı kızlarına karşı geçerlidir. Oğullar mevcutken kızların intikam alma veya kan parasını affetme konusunda söz hakkı yoktur. {cite:muwatta-maruf-1997 s.448}"
  id: "Malik berkata: Jika seseorang dibunuh dengan sengaja dan ada bukti yang mendukung hal itu, dan almarhum mempunyai anak laki-laki dan perempuan, dan anak laki-lakinya memaafkan tetapi anak perempuannya menolak untuk memaafkan, maka pengampunan anak laki-laki itu sah terhadap anak perempuan. Anak perempuan tidak memiliki hak untuk ikut campur dalam hal mencari pembalasan atau memaafkan uang darah ketika anak laki-lakinya hadir. {cite:muwatta-maruf-1997 p.448}"
