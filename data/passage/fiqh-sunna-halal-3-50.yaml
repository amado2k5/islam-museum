text: "… ثوب للضرورة إلى إتخاذ الثياب وأباح ما يمتهن، لأنه يأمن على الجاهل تعظيم ما يمتهن. وبقى النهي فيما لايمتهن مأ.ه. وقال ابن حزم : وجائز للصبايا خاصة اللعب ولا يحل لغيرهن. والصور محرمة إلا هذا وإلا ما كان رقما في …"
