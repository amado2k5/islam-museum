text: "… ولكن الأفيون. فيما حدث من الأوجاع عن مادة أكّالة ليست ممددة. شفاء عاجل. وعلاج اللذع التغرية والتبريد والتلطيف، وعلاج التمديد إرخاء العين والتحليل بما نذكر كلا في مكانه، وتقلّ المادة. وإذا أزمنت العلة ففصد المأقين، وفصد الشريان الذي خلف الأذن. …"
