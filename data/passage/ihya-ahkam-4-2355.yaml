text: "اعلم أن تحصيل علم هذا الباب واجب على كل مسلم مكتسب لأن طلب العلم فريضة على كل مسلم وإنما هو طلب العلم المحتاج إليه والمكتسب يحتاج إلى علم الكسب ومهما حصل علم هذا الباب وقف على مفسدات المعاملة فيتقيها وما …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 2355، يرد فيه ذكر الفريضة والفرائض، وما وجب على كل مسلم، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 2355, whose wording mentions the obligation (farida), a duty laid on every Muslim, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 2355 کا اقتباس جس میں فریضہ اور فرائض، جو ہر مسلمان پر لازم ہے، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din de al-Ghazali, volume numérisé 4, p. 2355, dont le texte mentionne l'obligation (farida), un devoir imposé à chaque musulman, l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen digitalizado 4, p. 2355, cuyo texto menciona la obligación (farida), un deber impuesto a cada musulmán, lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
