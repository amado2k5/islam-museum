label: { ar: "سنن أبي داود 1620 — الأب والأبوة", en: "Sunan Abi Dawud 1620 — the father and fatherhood", ur: "سنن ابی داؤد 1620 — باپ اور والدیت", es: "Sunan Abi Dawud 1620 — El padre y la paternidad", fr: "Sunan Abi Dawud 1620 — le père et la paternité" }
text: "… يَحْيَى هُوَ بَكْرُ بْنُ وَائِلِ بْنِ دَاوُدَ أَنَّ الزُّهْرِيَّ، حَدَّثَهُمْ عَنْ عَبْدِ اللَّهِ بْنِ ثَعْلَبَةَ بْنِ صُعَيْرٍ، عَنْ أَبِيهِ، قَالَ قَامَ رَسُولُ اللَّهِ خَطِيبًا فَأَمَرَ بِصَدَقَةِ الْفِطْرِ صَاعِ تَمْرٍ أَوْ صَاعِ شَعِيرٍ عَنْ كُلِّ رَأْسٍ زَادَ عَلِيٌّ فِي حَدِيثِهِ أَوْ صَاعِ بُرٍّ أَوْ قَمْحٍ بَيْنَ اثْنَيْنِ - ثُمَّ اتَّفَقَا - عَنِ الصَّغِيرِ وَالْكَبِيرِ وَالْحُرِّ وَالْعَبْدِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1620، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1620 (Zakat (Kitab Al-Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1620، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1620 (Zakat (Kitab Al-Zakat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1620 (Zakat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
