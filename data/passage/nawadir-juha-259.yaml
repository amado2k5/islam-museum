label: { ar: "نوادر جحا الكبرى، ص 126 — «من أضاع حمار غيره يفتش عليه وهو يغني»", en: "Nawadir Juha al-Kubra, p. 126 — 'Whoever Loses Another's Donkey Searches for It Singing'", ur: "نوادر جحا الکبریٰ، ص 126 — «جو دوسرے کا گدھا کھوئے وہ گاتے ہوئے ڈھونڈتا ہے»", fr: "Nawadir Juha al-Kubra, p. 126 — « Qui perd l'âne d'un autre le cherche en chantant »", es: "Nawadir Juha al-Kubra, p. 126 — «Quien pierde el burro ajeno lo busca cantando»", tr: "Juha'nın Büyük Fıkraları, s. 126 — “Başkasının eşeğini kaybeden kişi, onu şarkı söyleyerek arar.”", id: "Anekdot Hebat Juha, hlm. 126 — “Orang yang kehilangan keledai orang lain akan mencarinya sambil bernyanyi.”" }
text: "… مَن أضاع حمار غيره يفتش عليه وهو يغني ضاع حمار الحاكم، فرآه جماعة الحاكم ذاهباً إلى بستانه، فقالوا له: بما أننا ذاهبون إلى جهة واحدة، فاشترك معنا في التفتيش على الحمار. فلم يرَ الشيخ مانعا من إجابة طلبهم، ومشى جائلا …"
summary:
  ar: "فُقد حمار الوالي فطلب رجاله من جحا أن يساعدهم في البحث، فمشى بين البساتين يغني، وحين سُئل أي بحث هذا قال إن من أضاع حمار غيره يفتش عليه وهو يغني. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  en: "The governor's donkey goes missing, and his men ask Juha to help search. He walks among the orchards singing, and asked what sort of search this is, he says that whoever loses another man's donkey searches for it singing. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  ur: "والی کا گدھا کھو جاتا ہے اور اس کے آدمی جحا سے تلاش میں مدد مانگتے ہیں۔ وہ باغوں میں گاتا ہوا چلتا ہے، اور جب اس سے پوچھا جاتا ہے کہ یہ کیسی تلاش ہے تو وہ کہتا ہے کہ جو دوسرے کا گدھا کھو دے وہ گاتے ہوئے اسے ڈھونڈتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  fr: "L'âne du gouverneur disparaît, et ses hommes demandent à Juha de les aider à le chercher. Il marche parmi les vergers en chantant, et quand on lui demande quelle sorte de recherche c'est, il dit que celui qui perd l'âne d'un autre le cherche en chantant. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  es: "Desaparece el burro del gobernador, y sus hombres piden a Juha que ayude a buscarlo. Camina entre los huertos cantando, y al preguntarle qué clase de búsqueda es esa, dice que quien pierde el burro ajeno lo busca cantando. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  tr: "Valinin eşeği kaybolmuştu, bu yüzden adamları Juha'dan eşeği aramalarına yardım etmesini istediler. Juha meyve bahçeleri arasında şarkı söyleyerek dolaştı ve ne tür bir arama yaptığını sorduklarında, \"Başkasının eşeğini kaybeden herkes onu şarkı söyleyerek arar\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 126}"
  id: "Keledai gubernur hilang, jadi anak buahnya meminta Juha untuk membantu mencarinya. Juha berjalan di antara kebun-kebun sambil bernyanyi, dan ketika ditanya pencarian seperti apa yang sedang dilakukannya, dia berkata, \"Siapa pun yang kehilangan keledai orang lain akan mencarinya sambil bernyanyi.\" {cite:juha-nawadir-kubra-djuwaydi p. 126}"
