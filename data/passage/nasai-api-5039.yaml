text: "… أَنْبَأَنَا عَبْدُ اللَّهِ عَنْ شُعْبَةَ عَنْ قَتَادَةَ عَنْ أَنَسِ بْنِ مَالِكٍ أَنَّ النَّبِيَّ قَالَ لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ قَالَ الْقَاضِي يَعْنِي ابْنَ الْكَسَّارِ سَمِعْتُ عَبْدَ الصَّمَدِ الْبُخَارِيَّ يَقُولُ حَفْصُ بْنُ عُمَرَ الَّذِي يَرْوِي عَنْ عَبْدِ الرَّحْمَنِ بْنِ مَهْدِيٍّ لَا أَعْرِفُهُ إِلَّا أَنْ يَكُونَ سَقَطَ الْوَاوُ مِنْ حَفْصِ بْنِ عَمْرٍو الرَّبَالِيِّ …"
summary:
  ar: "حديث في سنن النسائي، رقم 5039، يذكر ما لا يتم الإيمان إلا به. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5039 (The Book Of Faith and its Signs), that mentions what faith is not complete without. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5039، جس میں جس کے بغیر ایمان مکمل نہیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
