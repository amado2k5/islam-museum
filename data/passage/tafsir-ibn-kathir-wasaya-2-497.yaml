text: "… عفا عما صنعوا وأنه قد اعتقد مواثيقهم من بعدك على النبوة. هذا الأثر موقوف عن أنس. ويزيد الرقاشى وصالح المرى ضعيفان جداً، وذكر السدى أن يعقوب لما حضره الموت أوصى إلى يوسف بأن يدفن عند إبراهيم وإسحق، فلما مات صبره …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 2، ص 497، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
