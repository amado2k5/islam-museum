text: "… القطان وابن عقيل والوليّ العراقي عليه، وناب في القضاء، وأكثر من الحج والمجاورة، وصنف، وأجيز بالإفتاء والتدريس والقراءات السبع وتطارح مع ابن نباتة المصري والقيراطي، وتبادل معهما المدائح. كان مولده في حدود سنة ه ووفاته في رجب سنة ه. الإصابة …"
