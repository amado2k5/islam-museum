text: |-
  •(يا ب الميم "
  فهل نبقْت عن أخوين داما * على الاحداث الاابنى شمام
  والشمم ارتفاع فى قصمة الانف مع استواء أعلاه فان كان فيها احديداب فهوالقنا ورجل
  أشمّ الانف وجبل أشمّ أى طويل الرأس بين الشمم فيهما أبوعر وأشم الرجل يسم اشماما
  وهوأن يمسر رافعا رأسه ويقال بيناهم فى وجه اذ أشموا أى عدلوا قال وسعت الكلابي
  يقول أشمّ القوم اذاجاروا عن وجوههم يمينا وشمالا قال الخليل بن أحد تقول للوالى أشممنى
  يدكوهوأحسن من ناواى يدلكْ وعرضت عليه كذا فاذاهو مشم لايريده واشمام الحرف
  أن تشمه الضمة أو الصكسرة وهو أقل من روم الحمركة لانه لا يسمع واغما يقبين بحركه
  الشقة ولا يعتدبهاحركة لضعفها والحرف الذى فيه الاشمام ساكن أوعكالساكر
  مثل قول الشاعر متى أنام لا يؤرقنى الكرى * ليلا ولا أسمع أجراس المطى
  ريد الكرى" والمطى" قال سيبويه العرب تشم "القافشيأ من الضمة ولواعتدت بعركة
  الاشمام لا تسكسر البيت ولصارتقطيع رقى السكرى متفاعلن ولا يكون ذلك الامى السكامل
  وهذا البيت من الرجز وقتب شميم أى مرتفع وقال بصف فرسا
  ملاعبة العنان كفصن بان * الى كتفين كالقتب الشميم
  والمشموم المسك قال علمقمة
  يحملن أترجة نضخ العبير بها • كأن تطيابها فى الاتف مشهوم .
  ( شهم شهمه أى أفزعه قال ذوالرمة
  طاوى الحشاصرت عنه محترّجة • مستوفض من بنات القرمشهوم
  أى.ذعور وشهم الرجل بالضم شهامة فهوشهم أى جلدذ كى" الفؤاد ⁦(شيهم)⁩ الشبهم
  الدكر من انقنافذ قال الاعنى
  الن جد أسباب العداوة بيننا • لترتحان من على ظهرشيهم
  قال الاصمعى الشهام السعلاة يم الشام جمع شامة وهى إلخال وهى من اليساه تقول
  منه رجل مسيم وسشيوم.ثل مكيل ومكيول وماله شامة ولازهراء أى ناقة سوداء ولا يضاء
  والاشيم الرجل الذى به شامة والجمع شيم والشيم أيضاضرب من السمك وقال
  قل الطغام الازدلا تبطروا • بالشيم والجريت والمكنعد
  والشوم السود قال أبوذو يب يصف خرا
  ذلا تشترى الابريح سداؤها • بنات المخاض شومها وحضارها
  أى سودها وبيضها قال الاصمعى هكذا سمعتهاء أظنها بهعا واحدها أشيم ورواه أبو عمروشيمها
  والمشيمة الغرس وأصل مفعلة فسكنت الياء والهع مشايم مثل معايسْ وشمت السيف أعمدته
  وشمته سللته وهومن الاضداد وشمت مخايل الشئ اذا تعالمعت نحو هابيصر كمنتظر اله وشمت
  البرق اذانظرت الى سحابته أين غطر وتشمه الضرام أى دخله وقال ١
  غاب تشيمه ضرام منقب ويروى تسخه وانشام الزجل اذا صار منظورا اليه والانشيام
  فى الش الدخول فيه وفول الشاعر• وهل ييدون لى شامة وطفيل*فهماجبلان والشيمة
  انخلق وقال الاصمعى الشيمة والشيام التراب يحفر من الارض وهو فى شعر الطرماح والاشيمان
  ١ ف نسخة زيادة ساحدة جين
  جوية اه
