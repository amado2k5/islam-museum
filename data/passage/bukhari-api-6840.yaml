text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا الشَّيْبَانِيُّ، سَأَلْتُ عَبْدَ اللَّهِ بْنَ أَبِي أَوْفَى عَنِ الرَّجْمِ، فَقَالَ رَجَمَ النَّبِيُّ. فَقُلْتُ أَقَبْلَ النُّورِ أَمْ بَعْدَهُ قَالَ لاَ أَدْرِي. تَابَعَهُ عَلِيُّ بْنُ مُسْهِرٍ وَخَالِدُ بْنُ عَبْدِ اللَّهِ وَالْمُحَارِبِيُّ وَعَبِيدَةُ بْنُ حُمَيْدٍ عَنِ الشَّيْبَانِيِّ. وَقَالَ بَعْضُهُمُ الْمَائِدَةُ. وَالأَوَّلُ أَصَحُّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6840، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6840 (Limits and Punishments set by Allah (Hudood)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 6840، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
