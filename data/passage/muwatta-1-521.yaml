label: { ar: "الموطأ 521 — ابن عمر: رأيت النبي على لبنتين مستقبلاً بيت المقدس لحاجته", en: "Muwatta 521" }
summary:
  ar: "أول حديث في باب الرخصة في استقبال القبلة لبول أو غائط. يرويه يحيى عن مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان عن عمه واسع بن حبان عن عبد الله بن عمر: كان يقول إن ناساً يقولون إذا قعدت على حاجتك فلا تستقبل القبلة ولا بيت المقدس، وإنه ارتقى على ظهر بيت لهم فرأى النبي على لبنتين مستقبلاً بيت المقدس لحاجته. ثم قال ابن عمر لواسع: لعلك من الذين يصلون على أوراكهم، فقال لا أدري والله؛ قال مالك: يعني الذي يسجد ولا يرتفع عن الأرض، يسجد وهو لاصق بالأرض. ويخرّجه المحقق عند البخاري (145) وأبي داود (12) والنسائي (1/23) والشافعي في المسند والرسالة والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (23/302). {cite:muwatta-maruf-1997 p.269} {cite:muwatta-maruf-1997 p.270}"
