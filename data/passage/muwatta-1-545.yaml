label: { ar: "الموطأ 545 — أبو سعيد: يخرج فيكم قوم يقرؤون القرآن لا يجاوز حناجرهم، يمرقون من الدين مروق السهم من الرمية", en: "Muwatta 545" }
text: "يقرؤون القرآن ولا يجاوز حناجرهم، يمرقون من الدين مروق السهم من الرمية"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي عن أبي سلمة بن عبد الرحمن عن أبي سعيد الخدري، أنه سمع النبي يخبر عن قوم يخرجون تُحتقر الصلاة والصيام والأعمال إلى جانب أعمالهم، يقرؤون القرآن ولا يجاوز حناجرهم، ويمرقون من الدين كما يمرق السهم من الرمية، فيُنظر في نصله وقدحه وريشه فلا يُرى شيء، ويُتمارى في فُوقه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان، والقعنبي والتنيسي عند البخاري (5058)، وابن القاسم عند النسائي في فضائل القرآن، ويبين أن الفُوق موضع الوتر من السهم، وأن نسخة م تقول «عن أبي سعيد قال». {cite:muwatta-maruf-1997 p.281} {cite:muwatta-maruf-1997 p.282}"
