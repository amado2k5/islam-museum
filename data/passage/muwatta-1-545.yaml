label: { ar: "الموطأ 545 — أبو سعيد: يخرج فيكم قوم يقرؤون القرآن لا يجاوز حناجرهم، يمرقون من الدين مروق السهم من الرمية", en: "Muwatta 545", es: "Muwatta 545", fr: "Muwatta 545", ur: "موطا 545", tr: "El-Muvatta 545 — Ebu Said: Aranızda Kur'an okuyanlar çıkacak, fakat Kur'an onların boğazlarından öteye geçmeyecek; onlar, okun hedefinden sapması gibi dinden uzaklaşacaklar.", id: "Al-Muwatta 545 — Abu Saeed: Akan muncul di antara kalian orang-orang yang membaca Al-Qur'an, tetapi bacaan itu tidak sampai ke tenggorokan mereka; mereka akan menjauh dari agama seperti anak panah yang meleset dari sasarannya." }
text: "يقرؤون القرآن ولا يجاوز حناجرهم، يمرقون من الدين مروق السهم من الرمية"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي عن أبي سلمة بن عبد الرحمن عن أبي سعيد الخدري، أنه سمع النبي يخبر عن قوم يخرجون تُحتقر الصلاة والصيام والأعمال إلى جانب أعمالهم، يقرؤون القرآن ولا يجاوز حناجرهم، ويمرقون من الدين كما يمرق السهم من الرمية، فيُنظر في نصله وقدحه وريشه فلا يُرى شيء، ويُتمارى في فُوقه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان، والقعنبي والتنيسي عند البخاري (5058)، وابن القاسم عند النسائي في فضائل القرآن، ويبين أن الفُوق موضع الوتر من السهم، وأن نسخة م تقول «عن أبي سعيد قال». {cite:muwatta-maruf-1997 p.281} {cite:muwatta-maruf-1997 p.282}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim ibn el-Harith el-Taymi'den, o da Ebu Salama ibn Abd el-Rahman'dan, o da Ebu Sa'id el-Hudri'den rivayet ederek, Peygamberimizin, namazları, oruçları ve iyi amelleri kendilerininkine kıyasla önemsiz sayılacak bir topluluğun ortaya çıkacağını bildirdiğini işittiğini söylemiştir. Onlar Kur'an okuyacaklar, ancak Kur'an boğazlarından öteye geçmeyecek ve bir okun hedefinden sapması gibi dinden uzaklaşacaklardır. Okun başı, gövdesi ve tüyleri incelendiğinde hiçbir şey bulunmayacak, hatta ok ucu bile tartışmalı olacaktır. Editör, Ebu Mus'ab'ın bunu Malik'ten, onun aracılığıyla da İbn Hibban, el-Ka'nabi ve el-Tunisi'nin bunu Buhari'de (5058) ve İbn el-Kâsım'ın da el-Nasa'i'nin *Fada'il el-Kur'an*ında rivayet ettiğini belirtmektedir. Okun yayının kirişinin okun ucuna takıldığı yerin çentik olduğunu ve M el yazmasının \"Ebu Sa'id'in rivayetine göre şöyle dedi\" dediğini açıklıyor. {cite:muwatta-maruf-1997 s.281} {cite:muwatta-maruf-1997 s.282}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, dari Abu Salama ibn Abd al-Rahman, dari Abu Sa'id al-Khudri, bahwa ia mendengar Nabi memberitahukan tentang suatu kaum yang akan muncul, yang salat, puasa, dan amal baiknya akan dianggap tidak berarti dibandingkan dengan mereka. Mereka akan membaca Al-Quran, tetapi bacaan itu tidak akan sampai ke tenggorokan mereka, dan mereka akan meninggalkan agama seperti anak panah yang meleset dari sasarannya. Ketika kepala, batang, dan bulunya diperiksa, tidak ditemukan apa pun, dan bahkan ujung anak panahnya pun diperdebatkan. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan melalui dia, Ibn Hibban, al-Qa'nabi, dan al-Tunisi meriwayatkannya dalam al-Bukhari (5058), dan Ibn al-Qasim meriwayatkannya dalam *Fada'il al-Qur'an* karya al-Nasa'i. Ia menjelaskan bahwa nock adalah tempat tali busur pada anak panah, dan bahwa manuskrip M mengatakan, \"Atas otoritas Abu Sa'id, dia berkata.\" {cite:muwatta-maruf-1997 p.281} {cite:muwatta-maruf-1997 p.282}"
