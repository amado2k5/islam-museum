label: { ar: "الموطأ 2393 — مالك: المرأة الحامل التي لا زوج لها وتدعي الاستكراه أو النكاح", en: "Muwatta 2393", es: "Muwatta 2393", fr: "Muwatta 2393", ur: "موطا 2393", tr: "Al-Muwatta 2393 — Malik: Kocası olmayan ve zorla evlendirildiğini iddia eden hamile kadın.", id: "Al-Muwatta 2393 — Malik: Seorang wanita hamil yang tidak memiliki suami dan mengaku dipaksa atau dinikahi" }
summary:
  ar: "قال مالك: الأمر عندنا في المرأة توجد حاملا ولا زوج لها، فتقول: قد استكرهت، أو تقول: تزوجت؛ إن ذلك لا يقبل منها ويقام عليها الحد، إلا أن يكون لها بينة على النكاح، أو على الاستكراه، أو جاءت تدمى إن كانت بكرا، أو استغاثت حتى أُتي بها على تلك الحال، أو ما أشبه ذلك مما تبلغ به فضيحة نفسها. فإن لم تأت بشيء من ذلك أُقيم عليها الحد ولم يُقبل منها ما ادعت. {cite:muwatta-maruf-1997 p.390}"
  tr: "Malik şöyle dedi: Bizim görüşümüze göre, eğer bir kadın hamile bulunursa ve kocası yoksa ve \"Zorlandım\" veya \"Evlendirildim\" derse, bu iddiası kabul edilmez ve kendisine öngörülen ceza uygulanır; ancak evliliğin veya zorla evliliğin kanıtı varsa, bakire ise kanaması varsa veya bu halde getirilene kadar yardım için ağlarsa veya onu utandıracak benzer bir durum gösterirse ceza uygulanır. Bunlardan herhangi birini sağlamazsa, öngörülen ceza uygulanır ve iddiası kabul edilmez. {cite:muwatta-maruf-1997 s.390}"
  id: "Malik berkata: Menurut pandangan kami, jika seorang wanita ditemukan hamil dan tidak memiliki suami, dan dia berkata, \"Saya dipaksa,\" atau \"Saya dinikahi,\" ini tidak diterima darinya, dan hukuman yang telah ditetapkan akan dilaksanakan padanya, kecuali jika dia memiliki bukti pernikahan atau pernikahan paksa tersebut, atau jika dia datang dalam keadaan berdarah jika dia masih perawan, atau jika dia menangis meminta pertolongan sampai dia dibawa masuk dalam keadaan tersebut, atau sesuatu yang serupa yang akan mempermalukannya. Jika dia tidak memberikan salah satu dari hal-hal tersebut, hukuman yang telah ditetapkan akan dilaksanakan padanya, dan klaimnya tidak diterima. {cite:muwatta-maruf-1997 p.390}"
