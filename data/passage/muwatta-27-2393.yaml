label: { ar: "الموطأ 2393 — مالك: المرأة الحامل التي لا زوج لها وتدعي الاستكراه أو النكاح", en: "Muwatta 2393" }
summary:
  ar: "قال مالك: الأمر عندنا في المرأة توجد حاملا ولا زوج لها، فتقول: قد استكرهت، أو تقول: تزوجت؛ إن ذلك لا يقبل منها ويقام عليها الحد، إلا أن يكون لها بينة على النكاح، أو على الاستكراه، أو جاءت تدمى إن كانت بكرا، أو استغاثت حتى أُتي بها على تلك الحال، أو ما أشبه ذلك مما تبلغ به فضيحة نفسها. فإن لم تأت بشيء من ذلك أُقيم عليها الحد ولم يُقبل منها ما ادعت. {cite:muwatta-maruf-1997 p.390}"
