text: "… يكتبُ الوَحىَ - قال : أرسلَ إلىَّ أبو بكر مَقْكَلَ أهل اليامةِ وهندَةٌ مرُ فقال أبو بكرٍ : إن حمرَ أنانى فقال إنَّ القتلَ قدِ استحرَّ يوم اليامةِ بالغاس، وإنى أخشى أن يَستحرَّ القعلُ بالقُراء فى الموامِنّ فيذهبَ كثيرٌ منَ …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 344، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 3, p. 344, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 3، ص 344 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 3, pág. 344, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
