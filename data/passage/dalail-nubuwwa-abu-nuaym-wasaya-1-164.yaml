  tr: "Ebu Nuaym'ın \"Peygamberliğin Delilleri\" adlı eserinin 1. cildinin 164. sayfasından, mal varlığı ve mirasından bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
