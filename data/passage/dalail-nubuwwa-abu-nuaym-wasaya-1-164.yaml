text: "… من كلامهما. رجوعه لَ لِ قي إلى مكة : قالوا: فرجعت به أمه إلى مكة فلما كان بالأبواء توفيت آمنة بالأبْواء فرجعت به أمّ أيمن على البعيرين اللذين قدما عليهما مكة، وكانت تحضنه. قالوا: وورِث رسولُ اللّٰه وَتَلِفِ من أبيه …"
