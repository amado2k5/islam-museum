text: "… : قال رسول الله وَعِلفي : إِنَّ أرْأَفَ أُمَّتِي بأُمَّتي أَبو بكرٍ، وأَقْوَاها في أمْرِ دين اللّٰه عمرُ، وأصدقَها حيَاءً عثمانُ، وأَقْضَاها عليٌّ، وأَقْرَأَها أُبِيّ، وأَفْرضَها زيدٌ، وأَعْلمهم بالحلالِ والحرام معاذُ بنُ جَبل، ولكُلِّ أُمَّة أَمينٌ، وأَمينُ هذه الأُمَّةِ أَبو …"
