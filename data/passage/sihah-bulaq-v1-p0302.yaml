text: |-
  ⁦(شعار )⁩
  ٢٣٩
  خازال شربى الراح -تى أشرنى * صديقى وحتى ساءنى بعض ذلك ١
  وأشررت الشئ أظهرته وقال فى يوم صفين وكعب بن جعيل
  ذ-ابرحواحتى رأى اللّٰه صبرهم * و-تى أشرت بالا كف المصاحف
  والاصمعى يروى قول امرئ القيس ومعشرا * علىّ حراسالويشرتون مققلى ٢ لى هذا
  رهوبال ين أجود وشرشرة الذى تشقيقه وتقطيعه قال أبوزبيدبصف الاسد
  يظلّ مغبا عند من فرائس * رفات عظام أوغريض مشرشر
  وشواء شرشريقاطردمه مثل شلشل والشراشر الاثقال الواحسدة شرشرة يقال ألق عليه
  شراشره أى نفسه حرم ا ومحية قال السكميت
  وتاقى عليه عند كل عظيمة • شراشر من حي نزار وألبب
  وقال آخر وكائن ترى من رشده فى كريهة • ومن غيه تلقى عليه الشراشر
  وشراشر الذئب ذباذيه والشر شرنبت ويقمال الشرشر بالكسر وقيل للاسدية ماشجرة أبيك
  قالت الشمرشرووطب جشر وغلام أشر شزر نظر البه شزرا وهونظر الغضبان
  يمؤخر العين وفى لحظه شزربالتحريك وتشازر القوم أى نظر بعضهم الى بعض شزراولشزر. ن
  الفتل ما كان الى فوق خلاف دور المغزل يقال حبل مشزوروغداترمستشزرات والشزر
  ما معنت عن يمينك وشمالك وطحات بالرحى شزرا اذا أدرت يدك عن يمينك وهيزر بلد
  (⁦(شصر)⁩. الشهر الخياطة المتباعدة والتزيدنول شهرت عين البازى أشدر شصرا
  ذاخطاتها والشصار أخلة التزنيد ح كاها بن دريد والشهمر بالتحربك ولد الظبة وكذلك
  الشاصر قال آبو عسد وقال غيروا حدمن الاعراب هو طلاثم خشف فاذاطلع قرناه فهو
  شادن فاذا قوى وتحرك فهو شصر والاننى شصرة ثم جذع ثم زى ولا يزال تنيا-تيوت لايزيد
  عليه ⁦(شطر)⁩ شعار الشئء أصفه وفى المشل احلب حابالل شطره وجعه أشطروة واهم
  فلان حلب الدهر أشطره أى ضروبهم ر به خيررشر وأصلهمن اخلاف النساقة ولها خلفان
  قادمان وآخران وكل خلفين شطروتول شطرت ناقتى وشاتى أشطر هاشطرا اذا -لبت
  شطراوتركت شطراوشاكرت طلي أى احتلبت شعارا وصررته وتركت له الشطر الآخر
  وشاطرت فلانا مالى اذا ناصفته وشطرت ناقتى تشطير! اذا صررت خلفين من أخلافها وشاة
  شاور أحدط بيها أطول من الآخر وكذلك اذا يبس أحد خلفيها فهى شطور وهى من الابل
  التى يبس خلفان من أخلانها لاتّلها أربعة أخلاف ويقال ولدفلان شطرة بالكسرأى نصف
  ذكورونصف أناث رقم_دت شاره أى نحوه قال الشاعو
  أقول لام زنباع أقمى • صدور العيس شطربى تميم
  ومنه قوله تعالى فول وجهك شطر المسجد الحرام وشعار بصره يشطر شط ورا وه والذى كانه
  بظر اليك والى آخر والشاطر الذى أعبا أهله خبنا وقد شعر وشطر أيضا بالضم شطارة فيهما
  وقدح شطاران أى نصفان قال الادمعى الشطير البعيسدية ال بلد شطير وشطرعى فلان أى
  نأى عنى ونوى شطار بالضم أى بعيدة وقال امر و القيس
  أشاقك بين الخليط الشعار
  ⁦(١)⁩ بكسر الكاف اه
  تجاوزت اجراسا اليها ومعشرا
