label: { ar: "مسلم 202 — اللهم أمتي أمتي", en: "Muslim 202 — O God, my ummah, my ummah" }
text: "قال عبد الله بن عمرو بن العاص: تلا النبي قول إبراهيم: رب إنهن أضللن كثيراً من الناس، وقال عيسى الكلمة: إن تعذبهم فإنهم عبادك، فرفع يديه وقال: اللهم أمتي أمتي وبكى، فقال الله: يا جبريل اذهب إلى محمد فسله ما يبكيك... فقال: يا محمد إنا سنرضيك في أمتك ولا نسوءك"
summary:
  ar: "رواية عبد الله بن عمرو بن العاص في باب دعاء النبي لأمته من كتاب الإيمان في صحيح مسلم؛ دعاء الشفاعة بعد تلاوة قول إبراهيم وقول عيسى، ووعد الإرضاء في الأمة."
