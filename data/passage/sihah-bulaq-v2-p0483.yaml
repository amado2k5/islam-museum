text: |-
  قولة التمر والماء الخ كذافى جيع
  التسخ التى بأيدينا والظاهر
  أن يول والتمر بالعطف كمافى
  القاموس وعبادته والعسيق فحل
  من النخل لا تنفض نخلته والماء
  والطلاء والدر والتمر علم له واللبن
  والخيار من كل شياء مصجحه
  •⁦(فصل العين)⁩-
  * ⁦(عرق)⁩*
  قدمت ووجبت كأنه حفظها ذلم يحنث قال أوس بن حجر
  على ألية عتقت قديما ل، فليس لهاوان طلبت مرام.
  -أى أيس لها حيلة وان طلبت والعسيق القديم من كل شئ-تى قالوارجل عميق أى قديم عن
  أبى عبيدد والعتيق العبد المعتق والسيق السكريم من كل شئ والخيار من كل شي التمر والماه
  والباذى والشهم قال الشاعر
  كذب العتيق وماءشن بارد • ان كنت ساتلتى غبو فافاذهي
  فيقال دوالماعنفه وفرس عميق أى رائع والجمع العتاق وعتاق اطير الجوارح عنها
  والارحبيات العتاف النجائب منها والديت العتيق السكعبة وكان يقال لابى بكر الصديق
  رضى اللّٰه عنه عتيق لاله ويقال لان الذبى ص-لى اللّٰه عليه وسلم قال له أنت عتيق من النار
  واسمه عبد اللّه بن عنمان واعماقي-ل قنطرة عميقة بالها وقنطرة جديد بلاهاء لان العتيقة
  بمعنى الفاءلة والحديد بعنفى المفه ولة ليفرق بين ماله الفسعل وبين ما الفعل واقع عليه
  ⁦( نق)⁩ -صاب منعنق مختلط بعضه ببعض عن أبى عمرووأعثقت الارض أخصبت بلغة
  هذيل (عدق العودقة خطاف الدلو وهى حديدة لهاثلاث شعب يستخرج بماالدلو
