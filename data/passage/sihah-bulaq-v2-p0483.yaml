  قال طفيل بصف فرسا
  كأنه بعد ماصدرن من عرق • سد غطر جنح الليل مبلول
  والعرق السفيفة ال)نسوجة عن الخوص وغيره قبل أن يجعل منه الربيل ومنه قيسل للزبيل
  عرق وعرق اللخلال ما يرشح لك الرجل به أى يعطيك للمودّة قال الشاعر يصف سيفا
  سأجعه مكان النون من * وما أعطيته عرق الخلال
  يقول أخذت هذا السنيف عنرة ولم أعطه للمودة قال الاصعىّ يقال لقيت من فلان عرق
  القرية ومعناه الشدّة ولا أدرى ما أصله وقال غيره العرق انماهو للرجل لا للقرية قال وأصله
  أنّ القرب انما تحملها الاماء الزوافرومن لامعين ف وربعا افتقر الرجل المكريم واحتاج الى
