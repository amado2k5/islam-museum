  ويقال جرى الفرس عرما أو عرقين أى طلقا أوطلقين ولبنءوق بكسر الراء وهو الذى
  يجعل فى سقاء ويند على البعيرايس بينه وبين جنب البعير وقاية فاذا أصابه، رق البعير أفسد
  لمعمه وتفيرت راتحته والعرقة الطرة تنسبج جوانب الفسطاط وكذلك الخشسبة التى
