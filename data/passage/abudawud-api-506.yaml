label: { ar: "سنن أبي داود 506 — ما أُحل", en: "Sunan Abi Dawud 506 — what was made lawful", ur: "سنن ابی داؤد 506 — جو حلال کیا گیا", es: "Sunan Abi Dawud 506: lo que se hizo legal", fr: "Sunan Abi Dawud 506 — ce qui a été rendu licite", tr: "Sunan Abi Davud 506 — Neler caizdir?", id: "Sunan Abi Dawud 506 — Apa yang diperbolehkan" }
text: "… قَالَ وَكَانَ الرَّجُلُ إِذَا أَفْطَرَ فَنَامَ قَبْلَ أَنْ يَأْكُلَ لَمْ يَأْكُلْ حَتَّى يُصْبِحَ. قَالَ فَجَاءَ عُمَرُ بْنُ الْخَطَّابِ فَأَرَادَ امْرَأَتَهُ فَقَالَتْ إِنِّي قَدْ نِمْتُ فَظَنَّ أَنَّهَا تَعْتَلُّ فَأَتَاهَا فَجَاءَ رَجُلٌ مِنَ الأَنْصَارِ فَأَرَادَ الطَّعَامَ فَقَالُوا حَتَّى نُسَخِّنَ لَكَ شَيْئًا فَنَامَ فَلَمَّا أَصْبَحُوا أُنْزِلَتْ عَلَيْهِ هَذِهِ الآيَةُ { أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَى نِسَائِكُمْ }."
summary:
  ar: "حديث في سنن أبي داود، رقم 506، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 506 (Prayer (Kitab Al-Salat)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 506، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 506 (Oración (Kitab Al-Salat)), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 506 (La Prière), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 506 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 506, menyebutkan apa yang diperbolehkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
