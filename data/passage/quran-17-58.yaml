text: "وَإِن مِّن قَرْيَةٍ إِلَّا نَحْنُ مُهْلِكُوهَا قَبْلَ يَوْمِ ٱلْقِيَـٰمَةِ أَوْ مُعَذِّبُوهَا عَذَابًا شَدِيدًا ۚ كَانَ ذَٰلِكَ فِى ٱلْكِتَـٰبِ مَسْطُورًا"
text_search: "وإن من قرية إلا نحن مهلكوها قبل يوم القيامة أو معذبوها عذابا شديدا ۚ كان ذلك في الكتاب مسطورا"
translations:
  en: { text: "There is not a township but We shall destroy it ere the Day of Resurrection, or punish it with dire punishment. That is set forth in the Book (of Our decrees).", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور (کفر کرنے والوں کی) کوئی بستی نہیں مگر قیامت کے دن سے پہلے ہم اسے ہلاک کردیں گے یا سخت عذاب سے معذب کریں گے۔ یہ کتاب (یعنی تقدیر) میں لکھا جاچکا ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
