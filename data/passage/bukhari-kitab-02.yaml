  en: "Sahih al-Bukhari, Book 2: Belief"
  ur: "صحیح بخاری، کتاب الایمان"
  es: "Sahih al-Bukhari, Libro 2: Creencia"
summary:
  ar: "القسم 2 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإيمان»، ويضم فيها النصوص من 8 إلى 58 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 2 of Sahih al-Bukhari (Belief) in the division of the open hadith dataset the museum took its reports from: reports 8 to 58 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 2، عنوان «کتاب الایمان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 8 تا 58۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 2 de Sahih al-Bukhari (Creencia) se basa en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 8 al 58, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
