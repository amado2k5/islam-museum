text: "صفة الصفوة ذِكرُ المصطَفَين من أهل بغداد - أبو الحسن علي بن عمر بن محمد ابن الحسن الحربي المعروف بالقزويني، وكان من كبار الصالحين، ومولده في محرم سنة ستين وثلاث مائة ببغداد، وأصل أبيه من قزوين، وقرأ القرآن بالقراءات على …"
summary:
