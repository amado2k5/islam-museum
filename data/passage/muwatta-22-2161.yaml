label: { ar: "الموطأ 2161 — يحيى عن مالك: الأمر المجتمع عليه أن الرجل إذا هلك وله بنون فقال أحدهم: أقر أبي أن فلانا ابنه، فإن ذلك النسب لا يثبت بشهادة إنسان واحد، ولا يجوز إقرار الذي أقر إلا على نفسه في حصته من مال أبيه، ويعطى الذي شهد له قدر ما يصيبه من المال", en: "Muwatta 2161" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر المجتمع عليه عندنا في الرجل يهلك وله بنون، فيقول أحدهم: قد أقر أبي أن فلانا ابنه. إن ذلك النسب لا يثبت بشهادة إنسان واحد، ولا يجوز إقرار الذي أقر إلا على نفسه في حصته من مال أبيه، يعطى الذي شهد له قدر ما يصيبه من المال الذي بيده. قال مالك: وتفسير ذلك أن يهلك الرجل ويترك ابنين له، ويترك ست مائة دينار، فيأخذ كل واحد منهما ثلاث مائة دينار. ثم يشهد أحدهما أن أباه الهالك أقر أن فلانا ابنه، فيكون على الذي شهد للذي استلحق مائة دينار، وذلك نصف ميراث المستلحق، لو لحق. ولو أقر له الآخر أخذ المائة الأخرى، فاستكمل حقه وثبت نسبه. {cite:muwatta-maruf-1997 p.285}"
