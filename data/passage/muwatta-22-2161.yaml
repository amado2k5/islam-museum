label: { ar: "الموطأ 2161 — يحيى عن مالك: الأمر المجتمع عليه أن الرجل إذا هلك وله بنون فقال أحدهم: أقر أبي أن فلانا ابنه، فإن ذلك النسب لا يثبت بشهادة إنسان واحد، ولا يجوز إقرار الذي أقر إلا على نفسه في حصته من مال أبيه، ويعطى الذي شهد له قدر ما يصيبه من المال", en: "Muwatta 2161", es: "Muwatta 2161", fr: "Muwatta 2161", ur: "موطا 2161", tr: "El-Muvatta 2161 — Yahya, Malik'ten rivayetle: Yerleşik uygulama şudur ki, bir adam ölür ve oğulları varsa, oğullarından biri şöyle derse: \"Babam, filancanın oğlu olduğunu kabul etti.\" Bu durumda, soy bağı tek bir kişinin şahitliğiyle kurulmuş sayılmaz ve bunu kabul eden kişinin şahitliği yalnızca kendisi ve babasının mirasındaki payı için geçerlidir; onun adına şahitlik eden kişiye ise mirastaki payına eşit bir miktar verilir.", id: "Al-Muwatta 2161 — Yahya berdasarkan riwayat Malik: Kebiasaan yang telah ditetapkan adalah jika seorang pria meninggal dan mempunyai anak laki-laki, dan salah seorang dari mereka berkata: Ayahku mengakui bahwa si fulan adalah anaknya, maka garis keturunan itu tidak sah hanya dengan kesaksian satu orang, dan pengakuan orang yang mengakui itu hanya sah untuk dirinya sendiri dan bagiannya dari harta warisan ayahnya, dan orang yang bersaksi untuknya diberi sejumlah uang yang sama dengan bagiannya dari harta warisan tersebut." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر المجتمع عليه عندنا في الرجل يهلك وله بنون، فيقول أحدهم: قد أقر أبي أن فلانا ابنه. إن ذلك النسب لا يثبت بشهادة إنسان واحد، ولا يجوز إقرار الذي أقر إلا على نفسه في حصته من مال أبيه، يعطى الذي شهد له قدر ما يصيبه من المال الذي بيده. قال مالك: وتفسير ذلك أن يهلك الرجل ويترك ابنين له، ويترك ست مائة دينار، فيأخذ كل واحد منهما ثلاث مائة دينار. ثم يشهد أحدهما أن أباه الهالك أقر أن فلانا ابنه، فيكون على الذي شهد للذي استلحق مائة دينار، وذلك نصف ميراث المستلحق، لو لحق. ولو أقر له الآخر أخذ المائة الأخرى، فاستكمل حقه وثبت نسبه. {cite:muwatta-maruf-1997 p.285}"
  tr: "Yahya dedi ki: Malik'in şöyle dediğini duydum: Bizde yerleşik uygulama şudur ki, bir adam ölür ve geride oğullar bırakırsa ve oğullarından biri, \"Babam filancanın oğlu olduğunu kabul etti\" derse, bu soy bağı tek bir kişinin tanıklığıyla kurulmaz. Oğlunu kabul eden kişinin yaptığı kabul, yalnızca kendisi ve babasının mirasındaki payı için geçerlidir. Tanıklık ettiği kişiye, elinde bulunan miras payına eşit bir miktar verilir. Malik dedi ki: Bunun açıklaması şudur: Bir adam ölür ve geride iki oğul ve altı yüz dinar bırakırsa, her biri üç yüz dinar alır ve sonra oğullarından biri ölen babasının filancayı oğlu olarak kabul ettiğine tanıklık ederse, tanıklık eden kişi, oğlunu talep edene yüz dinar borçludur; bu, kabul edilen kişinin mirasının yarısıdır, eğer kabul edilmiş olsaydı. Eğer diğer oğul, diğer oğlunu tanırsa, diğer yüz dinarı da alır, böylece hakkını tamamlar ve soyunu kurar. {cite:muwatta-maruf-1997 s.285}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Kebiasaan yang berlaku di antara kita adalah jika seorang pria meninggal dan meninggalkan anak-anak, dan salah satu dari mereka berkata, \"Ayahku mengakui bahwa si fulan adalah anaknya,\" maka garis keturunan itu tidak ditetapkan oleh kesaksian satu orang saja. Pengakuan yang dibuat oleh orang yang mengakui anak tersebut hanya berlaku untuk dirinya sendiri dan bagiannya dari harta warisan ayahnya. Orang yang diakuinya diberi jumlah yang sama dengan bagiannya dari harta warisan yang dimilikinya. Malik berkata: Penjelasannya adalah jika seorang pria meninggal dan meninggalkan dua anak dan enam ratus dinar, masing-masing menerima tiga ratus dinar, dan kemudian salah satu dari mereka bersaksi bahwa ayahnya yang telah meninggal mengakui si fulan sebagai anaknya, maka orang yang bersaksi berutang kepada orang yang mengklaim anak tersebut seratus dinar, yang merupakan setengah dari warisan orang yang diakui, jika ia diakui. Jika anak yang lain mengakui anak tersebut, ia mengambil seratus dinar lainnya, sehingga melengkapi haknya dan menetapkan garis keturunannya. {mengutip:muwatta-maruf-1997 hal.285}"
