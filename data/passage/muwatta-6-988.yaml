label: { ar: "الموطأ 988 — امرأة قالت للنبي: كنت تجهزت للحج فاعترض لي، فقال: اعتمري في رمضان فإن عمرة فيه كحجة", en: "Muwatta 988" }
text: "اعتمري في رمضان فإن عمرة فيه كحجة"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن، أنه سمع أبا بكر بن عبد الرحمن يقول: جاءت امرأة إلى رسول الله فقالت: إني قد كنت تجهزت للحج فاعترض لي. فقال لها رسول الله: اعتمري في رمضان، فإن عمرة فيه كحجة. ويذكر المحقق أن الحديث مرسل في ظاهره، وأن أبا بكر سمعه من تلك المرأة، فصار مسنداً بذلك، وأنه روي موصولاً عند الطبراني باسم أم معقل، وأن الترمذي حسّنه، وأن العمرة في رمضان تعدل الحج في الثواب لا في إسقاط الفرض. {cite:muwatta-maruf-1997 p.465}"
