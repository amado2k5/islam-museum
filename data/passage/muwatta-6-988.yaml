label: { ar: "الموطأ 988 — امرأة قالت للنبي: كنت تجهزت للحج فاعترض لي، فقال: اعتمري في رمضان فإن عمرة فيه كحجة", en: "Muwatta 988", es: "Muwatta 988", fr: "Muwatta 988", ur: "موطا 988", tr: "Muvatta 988 — Bir kadın Peygamberimize şöyle dedi: Hac için hazırlanmıştım, fakat o beni durdurdu. Peygamberimiz şöyle buyurdu: Umreyi Ramazan ayında yap, çünkü Ramazan ayında yapılan umre hac gibidir.", id: "Al-Muwatta 988 — Seorang wanita berkata kepada Nabi: Aku telah mempersiapkan diri untuk haji, tetapi beliau menghentikanku. Beliau berkata: Laksanakan umrah di bulan Ramadan, karena umrah di bulan ini sama seperti haji." }
text: "اعتمري في رمضان فإن عمرة فيه كحجة"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن، أنه سمع أبا بكر بن عبد الرحمن يقول: جاءت امرأة إلى رسول الله فقالت: إني قد كنت تجهزت للحج فاعترض لي. فقال لها رسول الله: اعتمري في رمضان، فإن عمرة فيه كحجة. ويذكر المحقق أن الحديث مرسل في ظاهره، وأن أبا بكر سمعه من تلك المرأة، فصار مسنداً بذلك، وأنه روي موصولاً عند الطبراني باسم أم معقل، وأن الترمذي حسّنه، وأن العمرة في رمضان تعدل الحج في الثواب لا في إسقاط الفرض. {cite:muwatta-maruf-1997 p.465}"
  tr: "Malik, Ebu Bekir ibn Abdülrahman'ın azatlı kölesi Sümey'den rivayet ettiğine göre, Sümey, Ebu Bekir ibn Abdülrahman'ın şöyle dediğini işitmiştir: Bir kadın Resulullah'ın yanına gelip, \"Hac için hazırlanmıştım, fakat bir şey beni engelledi\" dedi. Resulullah ona, \"Ramazan ayında Umre yap, çünkü Ramazan ayındaki Umre Hac gibidir\" dedi. Araştırmacı, hadisin mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu ve Ebu Bekir'in bunu o kadından işittiğini, dolayısıyla müsned (tam bir rivayet zincirine sahip hadis) olduğunu belirtmektedir. Ayrıca, Taberani tarafından Ümmü Ma'kal adıyla müsned olarak rivayet edilmiş ve Tirmizi tarafından hasen (iyi) olarak derecelendirilmiştir. Dahası, Ramazan ayındaki Umre'nin sevap bakımından Hac'a denk olduğunu, ancak farzın yerine getirilmesi bakımından denk olmadığını belirtmektedir. {cite:muwatta-maruf-1997 s.465}"
  id: "Malik meriwayatkan hadits ini dari Sumayy, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, yang mendengar Abu Bakr ibn Abd al-Rahman berkata: Seorang wanita datang kepada Rasulullah dan berkata, “Aku telah mempersiapkan diri untuk haji, tetapi ada sesuatu yang menghalangiku.” Rasulullah bersabda kepadanya, “Laksanakan umrah di bulan Ramadan, karena umrah di bulan ini sama seperti haji.” Peneliti menyebutkan bahwa hadits ini tampaknya mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa Abu Bakr mendengarnya dari wanita itu, sehingga menjadikannya musnad (hadits dengan rantai periwayatan yang lengkap). Hadits ini juga diriwayatkan dengan musnad oleh al-Tabarani dengan nama Umm Ma'qal, dan al-Tirmidhi menilainya hasan (baik). Lebih lanjut, hadits ini menyatakan bahwa umrah di bulan Ramadan sama pahalanya dengan haji, tetapi tidak dalam memenuhi kewajibannya. {mengutip:muwatta-maruf-1997 hal.465}"
