label: { ar: "الموطأ 2790 — عمر بن الخطاب والرجل الذي اسمه جمرة وابنه شهاب", en: "Muwatta 2790" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب قال لرجل: ما اسمك؟ قال: جمرة. قال: ابن من؟ قال: ابن شهاب. قال: ممن؟ قال: من الحرقة. قال: أين مسكنك؟ قال: بحرة النار. قال: بأيها؟ قال: بذات لظى. فقال عمر: أدرك أهلك فقد احترقوا، فكان كما قال عمر. ويذكر المحقق قول الزرقاني إن الأثر منقطع، وإن أبا القاسم بن بشران وصله من طريق موسى بن عقبة عن نافع عن ابن عمر. {cite:muwatta-maruf-1997 p.568}"
