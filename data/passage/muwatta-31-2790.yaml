label: { ar: "الموطأ 2790 — عمر بن الخطاب والرجل الذي اسمه جمرة وابنه شهاب", en: "Muwatta 2790", es: "Muwatta 2790", fr: "Muwatta 2790", ur: "موطا 2790", tr: "Al-Muwatta 2790 - Ömer ibn el-Hattab ve Jamrah adlı adam ve oğlu Şihab", id: "Al-Muwatta 2790 — Umar ibn al-Khattab dan pria bernama Jamrah dan putranya Shihab" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب قال لرجل: ما اسمك؟ قال: جمرة. قال: ابن من؟ قال: ابن شهاب. قال: ممن؟ قال: من الحرقة. قال: أين مسكنك؟ قال: بحرة النار. قال: بأيها؟ قال: بذات لظى. فقال عمر: أدرك أهلك فقد احترقوا، فكان كما قال عمر. ويذكر المحقق قول الزرقاني إن الأثر منقطع، وإن أبا القاسم بن بشران وصله من طريق موسى بن عقبة عن نافع عن ابن عمر. {cite:muwatta-maruf-1997 p.568}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ömer ibn el-Hattab'ın bir adama \"Adın nedir?\" diye sorduğunu aktarır. Adam \"Cemre\" (kor) diye cevap verdi. Ömer \"Kimin oğlu?\" diye sordu. Adam \"Şihab'ın (meteor) oğlu\" diye cevap verdi. Ömer \"Hangi kabileden?\" diye sordu. Adam \"Harkah kabilesinden\" diye cevap verdi. Ömer \"Nerede yaşıyorsun?\" diye sordu. Adam \"Harrah el-Nar'da\" (lav tarlasında) diye cevap verdi. Ömer \"Hangi bölgede?\" diye sordu. Adam \"Dhat Lazha'da\" (alevli ateş yeri) diye cevap verdi. Bunun üzerine Ömer \"Ailenin yanına dön, çünkü onlar yandılar\" dedi ve Ömer'in dediği gibi oldu. Araştırmacı, el-Zarqani'nin rivayet zincirinin kopuk olduğuna ve Ebu el-Kâsım ibn Bişran'ın bunu Musa ibn Ukbe vasıtasıyla, Nafi'den, o da İbn Ömer'den rivayetle bağladığına dair ifadesinden bahsetmektedir. {cite:muwatta-maruf-1997 s.568}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Umar ibn al-Khattab berkata kepada seorang pria: \"Siapa namamu?\" Dia menjawab: \"Jamrah\" (bara). Umar bertanya: \"Anak siapa?\" Dia menjawab: \"Anak Shihab\" (meteor). Umar bertanya: \"Dari suku mana?\" Dia menjawab: \"Dari suku al-Harqah\" (yang terbakar). Umar bertanya: \"Di mana kamu tinggal?\" Dia menjawab: \"Di Harrah al-Nar\" (ladang lava). Umar bertanya: \"Bagian mana?\" Dia menjawab: \"Di Dhat Lazha\" (tempat api yang menyala-nyala). Kemudian Umar berkata: \"Kembalilah kepada keluargamu, karena mereka telah terbakar,\" dan terjadilah seperti yang dikatakan Umar. Peneliti menyebutkan pernyataan al-Zarqani bahwa sanadnya terputus, dan bahwa Abu al-Qasim ibn Bishran menghubungkannya melalui Musa ibn Uqbah, dari Nafi', dari Ibn Umar. {mengutip:muwatta-maruf-1997 hal.568}"
