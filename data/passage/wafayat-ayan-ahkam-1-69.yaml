text: "… نولت حتى تضرعتُ عندها وأعلمتها ما أرخصّ اللّٰه في اللّمم ومنه أيضاً : قيل لأسلم بن زرعة: إن انهزمت من أصحاب مرداسا غضب عليك الأمير عبيد اللّه بن زياد، فقال : لأن يغضب علي وأنا حي خير من أن يرضى …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 69، يرد فيه ذكر اللمم، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 69, whose wording mentions the lamam (small faults), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 69 کا اقتباس جس میں لمم ⁦(چھوٹی لغزشیں)⁩، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Wafayat al-A'yan de Ibn Khallikan, volume numérisé 1, p. 69, dont le texte mentionne le lamam (fautes légères), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
