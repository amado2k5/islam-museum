text: "… نولت حتى تضرعتُ عندها وأعلمتها ما أرخصّ اللّٰه في اللّمم ومنه أيضاً : قيل لأسلم بن زرعة: إن انهزمت من أصحاب مرداسا غضب عليك الأمير عبيد اللّه بن زياد، فقال : لأن يغضب علي وأنا حي خير من أن يرضى …"
