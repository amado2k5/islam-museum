label: { ar: "سنن النسائي 2714 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 2714 — a burial, grave or resting place", ur: "سنن نسائی 2714 — تدفین، قبر اور مرقد", es: "Sunan al-Nasa'i 2714 — un lugar de entierro, tumba o descanso.", fr: "Sunan al-Nasa'i 2714 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "أَخْبَرَنَا عَبْدَةُ بْنُ عَبْدِ اللَّهِ الصَّفَّارُ، قَالَ حَدَّثَنَا أَبُو دَاوُدَ، - يَعْنِي الْحَفَرِيَّ - عَنْ سُفْيَانَ، عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ مَاتَ رَجُلٌ فَقَالَ النَّبِيُّ \" اغْسِلُوهُ بِمَاءٍ وَسِدْرٍ وَكَفِّنُوهُ فِي ثِيَابِهِ وَلاَ تُخَمِّرُوا وَجْهَهُ وَرَأْسَهُ فَإِنَّهُ يُبْعَثُ يَوْمَ الْقِيَامَةِ مُلَبِّيًا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2714، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2714 (The Book of Hajj), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2714، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2714 (El Libro del Hajj), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2714 (Le Livre du Hajj), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
