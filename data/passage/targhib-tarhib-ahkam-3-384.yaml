text: "… المحظور. فحقيقة التوبة الرجوع الى اللّٰه بالتزام فعل ما يجب وترك ما يكره فهى وجوع من مكروه الى محبوب قال الامام النووى وحه اللّه تعالى في الرياض قال العلماء التوبة واجبة من كل ذنب فان كانت الممصية بين العبدوبنين الله …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 3، ص 384، يرد فيه ذكر الواجب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 3, p. 384, whose wording mentions the obligatory (wajib), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
