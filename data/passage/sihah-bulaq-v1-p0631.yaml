text: |-
  والدادئ ثلاث ايال من آخر الشهر قبل ليالى المحماق وقال أبو عمرو الديداء والدأداء من
  الشهر آخره قال الاعشى.
  تداركه فى منصل الال بعدما • مضى غيرد أداء وقد كاد يعطب
  بأ دبأته بالعصاديا ضرته ⁦( رأ)⁩ الدر الدفع وفى الحديث ادروا الح-دود
  ما استطعتم ودرأ علينا فلان يدر أدرواواندرا أى طلع مفاجأة ومنه كوكب درّى على
  فعيل مثل سكير وخير لشدة توقده وتلألؤه وقد درأ الكوكب دروء اقال أبوع روبن العلاء
  سالت رجلا من سعدين يكر من أهل ذات عبرق فقلت هذا الكوكب الضخم ما تسمونه
  قال الدرّىء وكان من أفصح الناس قال أبو عبيد ان ضممت الدال قلت درّىّ بكون
  منسوبا الى الدرّفعيل على فعلى ولا تهمزه لانه ليس فى كلام العرب فعلىّ ومن همزه من القتراء
  فانما أراد فعول مثل سبوح فاستئقل فِردّبعضه الى الكسر وحكى الاخفسْ عن بعضهم
  درّىء من درأته وهمزها وجعلها ءسلى فعيل مفتوحسة الاوز قال وذلك من تلألؤه قال
  الفراء والعرب تسمى الكوا كب العظام للتى لا تعرف أسماءها الدرارى" وتقول تدر" أعلينا
  خلان أى تطاول قال الشاعر
  لقييم من تدرئكم علينا * وقتل سراتناذات العراقى
  يعى الداهية وقواهم السلطان ذوتدرأبضم التاء اى ذوعدّة وقوة على دفع أعدائه عن
  فسموه واسم موضوع للدفع والتاء زائدة كمازيدت في ترتب وتنضب وتنفل وتقول تدار أتم
  أى اختلفتم وتدافعتم وكذلك ادّارأتم وأصله تدارأتم فادغمت التاءفى الدال واجتلبت
  الالفليصح الابتداءجها والمدارأة المخالفة والمدافعة بقالذلان لا يدارئ ولا يمارئ فاما
  المدارأة فى حسن الخلق والمعاشرة فات الاحر يقول فيه انه بهمزولا يهمزيقال دارأته
  وداريته اذا التقيته ولاينته وتقول جاء السيل دره ابالضم أى من بلدبعيد والدر بالفتح
  العوج يقال أقت درءفلان أى اعو جاجه وشغبه قال الشاءر المتلمس
  وكنااذا الجبار صعر خدّه * أقناله من درئه فتقوما
  ومنه قواهم بئرذات درء وهوالحيد وطريق ذودرو على فعول أى ذوكسور وجرفة والدريئة
  البعير أ وغيره يستتريه الصائد فاذا أمكنه ارمحرمى قال أبو زيدهو مهم وزلانها تدر أنو
  الصيد أى تدفع أبو عبيدة أدارأت للصيد على افتعات اذا اتخذت له دريئة والدريثة أيضا
  جلقة يتعلم عليها الطعين قال عمرو بن معدى كرب
  ظلات كأنى للرماح دريثة • أقاتل عن أيناء جرم وقبرت
  قال الاصمعى همه موزة ودرأ البعيرد روءا أى أغذوكان مع الغدّة ورم فى ظهره فهودارئ
  قال ابن السكيت وناقة دارئ أيضا اذا أخذتها الغدّة فى مراقها واستبان حجمها قال ويسمى
