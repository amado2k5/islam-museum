label: { ar: "الموطأ 2532 — مالك: لا تعقل العاقلة من أصاب نفسه، واستدلال بآية البقرة في العفو", en: "Muwatta 2532", es: "Muwatta 2532", fr: "Muwatta 2532", ur: "موطا 2532", tr: "El-Muvatta 2532 — Malik: Kabile, kendine zarar verenin kan parasından sorumlu değildir ve delil olarak Bakara Suresi'ndeki bağışlama ile ilgili ayeti zikretti.", id: "Al-Muwatta 2532 — Malik: Klan tidak bertanggung jawab atas uang darah orang yang mencelakai dirinya sendiri, dan dia mengutip ayat dalam Surah Al-Baqarah tentang pengampunan sebagai bukti." }
summary:
  ar: "قال مالك: ولا تعقل العاقلة أحدا أصاب نفسه عمدا أو خطأ بشيء، وعلى ذلك رأي أهل الفقه والعلم عندنا، ولم أسمع أن أحدا ضمن العاقلة من دية العمد شيئا. واستدل مالك بآية في سورة البقرة في اتباع من عُفي له من أخيه شيء بالمعروف والأداء بإحسان، وفسرها بأن من أُعطي من أخيه شيئا من العقل فليتبعه بالمعروف، وليؤد إليه بإحسان. {cite:muwatta-maruf-1997 p.436} {cite:muwatta-maruf-1997 p.437}"
  tr: "Malik şöyle dedi: Kabile, kasten veya kasıtsız olarak kendine zarar veren kimsenin kan parasından sorumlu değildir. Bu, aramızdaki fıkıh ve ilim âlimlerinin görüşüdür ve ben, kasten zarar verme durumunda kabilenin kan parasının herhangi bir kısmından sorumlu tutulduğunu duymadım. Malik, Bakara Suresi'nde, kardeşi tarafından affedilen kimsenin iyilikle karşılık vermesi ve güzel bir şekilde ödemesi gerektiğiyle ilgili bir ayeti zikretti. Bunu, kardeşi tarafından tazminat olarak bir şey verilen kimsenin iyilikle karşılık vermesi ve güzel bir şekilde geri ödemesi gerektiği şeklinde yorumladı. {cite:muwatta-maruf-1997 s.436} {cite:muwatta-maruf-1997 s.437}"
  id: "Malik berkata: Klan tidak bertanggung jawab atas uang darah siapa pun yang secara sengaja atau tidak sengaja mencelakai dirinya sendiri. Ini adalah pendapat para ulama fiqih dan ilmu pengetahuan di antara kita, dan saya belum pernah mendengar ada yang menuntut klan untuk bertanggung jawab atas sebagian uang darah atas kerugian yang disengaja. Malik mengutip sebuah ayat dalam Surah Al-Baqarah mengenai kewajiban seseorang yang telah diampuni oleh saudaranya untuk membalas kebaikan dan membayar dengan cara yang baik. Beliau menafsirkan ayat tersebut sebagai kewajiban siapa pun yang diberi sesuatu oleh saudaranya sebagai ganti rugi, untuk membalas kebaikan dan membayarnya kembali dengan cara yang baik. {cite:muwatta-maruf-1997 p.436} {cite:muwatta-maruf-1997 p.437}"
