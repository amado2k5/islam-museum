text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا ابْنُ لَهِيعَةَ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" لَيْسَ مِنَّا مَنْ تَشَبَّهَ بِغَيْرِنَا لاَ تَشَبَّهُوا بِالْيَهُودِ وَلاَ بِالنَّصَارَى فَإِنَّ تَسْلِيمَ الْيَهُودِ الإِشَارَةُ بِالأَصَابِعِ وَتَسْلِيمَ النَّصَارَى الإِشَارَةُ بِالأَكُفِّ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ إِسْنَادُهُ ضَعِيفٌ. وَرَوَى ابْنُ الْمُبَارَكِ هَذَا الْحَدِيثَ عَنِ ابْنِ لَهِيعَةَ فَلَمْ يَرْفَعْهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2695، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2695 (Chapters on Seeking Permission), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2695، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
