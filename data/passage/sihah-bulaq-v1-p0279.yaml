text: |-
  ١ . وفى صفحة ٨٤ روايته
  حتي كأنه بعرة الخ اه
  ٢ ا ذه الابيات نادرة اطيفة
  ذكرها فى تربحة الظايم ن حياة
  ⅙⅓لحيان ا
  ٢٦٢
  باب الرام)
  قال ابن دريد من رواه بالنتح فقد غلط لان الجرب لايكوى منه ويقال به عرة وهو
  ما اعتراه من الجنون قال امر والقيس
  ويخضد فى الآرىّ حتى كأنما * به عرة أوطائف غير معقب ١
  والعرة أيضا البعر والسرجين وسلح الطيرة ول منسه أعرت الدار وعر الطير يعزعرة سلح
  وفلان عرة وعارور وعارورة أى قدر وهو يع رقومه أى يدخسل عليهم مكروها يلطخهم
  به والمعرة الاثم ويقال استعرهم الجرب أى فشافيهم والعراد بهار البروهونيت طيب
  الريح الواحدة عرارة وقال الشاعر ⁦(الموار)⁩
  تمتع من شميم عرارنجد • فابعد العشية من عراد
  وعرار مشل قطام اسم بقرة وفى الممل باءتء رار بكسل وهمابقرتان انتطمتافاتتاجميعا
  بات هذهبهذه يضرب هذا الكل مستو بين قال ابن عنقا الفزارى
  مات عرار بكحل والرفاق معا * فلاتمنوا آمانى الاباضيل
  والعرارة بالفتح سوهالخلق واسم فرس وقال الكليبة
  نسائلى بنوجشم بن بكر • أغراء العرارة أم بم-يم
  كيت غير محلفة ولكن * كاون الصرف على به الاديم
  ويقال هوفى عرارة خيرأى فى أصل خير وقال الاصمعى العرارة الشدة وأنشد للاخطل
  ان العرارة والبوح لدارم • والمزعند تكامل الاحساب
  وعارً الظلسيم بعارعرارا وهوصوته وبعضهم يقول عر الظليم يعرعرارا كما فالوازمر
  النعام يزمر زمارا وعرارأيضا اسم رجل وهوء راربن عمروبن شاس الاسدى قال فيه أبوه
  ٢ أرادت عرارابالهوان ومن يرد * عرار العمرى بالهوان فقدظ لم
  فان ءرارا ان يكن غير واضح • فانى أحب الجون ذا المنكب العمم
  وتعار الرجل من الليل اذاهب من نومه مع صوت والعرعو شجر السروواسم موضع قال
  امر والقيس وحلت سليمى بطن ظبى فعرءرا ويروى بطن قو والعرعرة لعبة للصبيان
  وعرعار أيضابى على الكسر وهو معدول من عرعرة مثل قرقار من قرقرة قال النابغة
  متكنفى جنبى عكاظ كليهما * يدعو وليدهم بهاعرعار
  لان الصى اذا لم يجد أحد ارفع صوته فقال عرعار فاذاسمعوه خرجوا اليه فلعب واتلك اللعبة
  وعرءرت رأس القارورة اذا استخرجت صمامها وعرءرة الجبل بالضم أعلاه وكذلك
  عرعرة السنام وعرعرة الانف ويقال ركب عرءره اذاساه خلقه كمايقال ركب رأسه
  وعرأرضه يعرها أى سمدها والتعر يرمثل ونخلة معرار أى محشاف الفراء عردت بك حاجتى
  أى أنزلتها وعره بشرأى لطخه به فهومع روروءره أى ساءه قال العجاج
  ما آيب سرك الاسرنى * نصحاولاءرك الاعرنى
  والعرير فى الحديث الغريب وبعير أعوبين العرر الذى لاسنام له تقول منه أعر الله البعير
  والمعستر الذي يتعرضر للمسئلة ولا يسأل وجزور عراعر بالضم أى سمينة واسم موضع
  أيضا قال النابغة
  زيد بن بدرحاضر بعراعر * وعلى كتيب مالك بن حار
  وحمه
