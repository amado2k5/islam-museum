label: { ar: "صحيح البخاري 6920 — بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 6920 — dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 6920 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 6920 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos" }
text: "… الشَّعْبِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍوما ـ قَالَ جَاءَ أَعْرَابِيٌّ إِلَى النَّبِيِّ فَقَالَ يَا رَسُولَ اللَّهِ مَا الْكَبَائِرُ قَالَ \" الإِشْرَاكُ بِاللَّهِ \". قَالَ ثُمَّ مَاذَا قَالَ \" ثُمَّ عُقُوقُ الْوَالِدَيْنِ \". قَالَ ثُمَّ مَاذَا قَالَ \" الْيَمِينُ الْغَمُوسُ \". قُلْتُ وَمَا الْيَمِينُ الْغَمُوسُ قَالَ \" الَّذِي يَقْتَطِعُ مَالَ امْرِئٍ مُسْلِمٍ هُوَ فِيهَا كَاذِبٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6920، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6920 (Apostates), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6920، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6920 (Apóstatas), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
