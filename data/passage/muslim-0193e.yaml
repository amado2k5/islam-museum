label:
  ar: "مسلم 193e — حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع"
  en: "Muslim 193e — The great intercession: raise your head, intercede and it will be granted"
  ur: "مسلم 193e — بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی"
text: "إذا كان يوم القيامة ماج الناس بعضهم إلى بعض فيأتون آدم فيقولون له اشفع لذريتك . فيقول لست لها ولكن عليكم بإبراهيم - - فإنه خليل الله . فيأتون إبراهيم فيقول لست لها ولكن عليكم بموسى - - فإنه كليم …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 193e: حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 193e: The great intercession: raise your head, intercede and it will be granted. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 193e: بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
