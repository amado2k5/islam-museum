label: { ar: "جامع الترمذي 930 — الأب والأبوة", en: "Jami' al-Tirmidhi 930 — the father and fatherhood", ur: "جامع ترمذی 930 — باپ اور والدیت" }
text: "… أَبِي رَزِينٍ الْعُقَيْلِيِّ، أَنَّهُ أَتَى النَّبِيَّ فَقَالَ يَا رَسُولَ اللَّهِ إِنَّ أَبِي شَيْخٌ كَبِيرٌ لاَ يَسْتَطِيعُ الْحَجَّ وَلاَ الْعُمْرَةَ وَلاَ الظَّعْنَ. قَالَ \" حُجَّ عَنْ أَبِيكَ وَاعْتَمِرْ \" قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَإِنَّمَا ذُكِرَتِ الْعُمْرَةُ عَنِ النَّبِيِّ فِي هَذَا الْحَدِيثِ أَنْ يَعْتَمِرَ الرَّجُلُ عَنْ غَيْرِهِ. وَأَبُو رَزِينٍ الْعُقَيْلِيُّ اسْمُهُ لَقِيطُ بْنُ عَامِرٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 930، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 930 (The Book on Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 930، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
