text: "… الخشخاش من المضرّة، فأما إن كان المالنخوليا من سوء مزاج مفرط برد ويبس، فينبغي أن يشتغل بتسخين القلب، وبالمفرّحات، وأدوية المسك والترياق والمثروديطوس وما أشبه ذلك، ويعالج الرأس بما مرّ، وذكر في باب الرعونة. والقويّ منه يعرض عقيب مرض آخر …"
