label: { ar: "جامع الترمذي 318 — الأب والأبوة", en: "Jami' al-Tirmidhi 318 — the father and fatherhood", ur: "جامع ترمذی 318 — باپ اور والدیت", es: "Jami' al-Tirmidhi 318 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 318 — le père et la paternité" }
text: "حَدَّثَنَا بُنْدَارٌ، حَدَّثَنَا أَبُو بَكْرٍ الْحَنَفِيُّ، حَدَّثَنَا عَبْدُ الْحَمِيدِ بْنُ جَعْفَرٍ، عَنْ أَبِيهِ، عَنْ مَحْمُودِ بْنِ لَبِيدٍ، عَنْ عُثْمَانَ بْنِ عَفَّانَ، قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ \" مَنْ بَنَى لِلَّهِ مَسْجِدًا بَنَى اللَّهُ لَهُ مِثْلَهُ فِي الْجَنَّةِ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي بَكْرٍ وَعُمَرَ وَعَلِيٍّ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو وَأَنَسٍ وَابْنِ عَبَّاسٍ وَعَائِشَةَ وَأُمِّ حَبِيبَةَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 318، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 318 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 318، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 318 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 318 (Le Livre de la Salat (Prière)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
