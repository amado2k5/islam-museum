text: "وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا حَجَّاجُ بْنُ أَبِي، زَيْنَبَ حَدَّثَنِي أَبُو سُفْيَانَ، طَلْحَةُ بْنُ نَافِعٍ قَالَ سَمِعْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ، قَالَ كُنْتُ جَالِسًا فِي دَارِي فَمَرَّ بِي رَسُولُ اللَّهِ فَأَشَارَ إِلَىَّ فَقُمْتُ إِلَيْهِ فَأَخَذَ بِيَدِي فَانْطَلَقْنَا حَتَّى أَتَى بَعْضَ حُجَرِ نِسَائِهِ فَدَخَلَ ثُمَّ أَذِنَ لِي فَدَخَلْتُ الْحِجَابَ عَلَيْهَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5355، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5355 (The Book of Drinks), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 5355، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
