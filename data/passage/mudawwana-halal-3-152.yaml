text: "… الولىّ لو فسخ ذلك النكاح كان طلاقا فكذلك الزوج اذا طاق وقع طلاقه ولا يحلها وطؤه اياها لزوج كان طلقها قبله ثلاثا وكذلك العبد وقال غيره ولا يحلها الا النكاح التام الذى لا وصم فيه ولا قول مع الوطء الحلال …"
