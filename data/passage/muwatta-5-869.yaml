label: { ar: "الموطأ 869 — مالك: لا يكون المعتكف معتكفاً حتى يجتنب ما يجتنبه المعتكف، من عيادة المريض والصلاة على الجنائز، ودخول البيت إلا لحاجة الإنسان", en: "Muwatta 869", es: "Muwatta 869", fr: "Muwatta 869", ur: "موطا 869", tr: "El-Muvatta 869 — Malik: İtikaf halindeki bir kişi, hasta ziyareti, ölü başında namaz kılma ve insani ihtiyaç dışında eve girme gibi itikaf halindekilerin sakındığı şeylerden sakınmadıkça itikaf halinde sayılmaz.", id: "Al-Muwatta 869 — Malik: Seseorang yang sedang beritikaf tidak dianggap beritikaf sampai ia menghindari hal-hal yang dihindari oleh orang yang beritikaf, seperti mengunjungi orang sakit, mendoakan orang mati, dan memasuki rumah kecuali untuk keperluan buang air besar." }
summary:
  ar: "قول لمالك: لا يكون المعتكف معتكفاً حتى يجتنب ما يجتنبه المعتكف من عيادة المريض والصلاة على الجنائز ودخول البيت إلا لحاجة الإنسان. ويذكر المحقق أنه رواه عن مالك أبو مصعب (864). {cite:muwatta-maruf-1997 p.420}"
  tr: "Malik şöyle demiştir: İtikaf halindeki bir kişi, hasta ziyareti, ölüler için namaz kılma ve zorunlu insani ihtiyaçlar dışında eve girme gibi itikaf halinden kaçınmadıkça itikaf halinde sayılmaz. Araştırmacı, bunun Malik'ten Ebu Mus'ab (864) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.420}"
  id: "Malik berkata: Seseorang yang sedang i'tikaf tidak dianggap dalam i'tikaf sampai ia menghindari hal-hal yang diwajibkan bagi orang yang sedang i'tikaf, seperti mengunjungi orang sakit, mendoakan orang yang meninggal, dan memasuki rumah kecuali untuk kebutuhan pokok. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (864). {cite:muwatta-maruf-1997 p.420}"
