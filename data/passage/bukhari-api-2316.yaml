label: { ar: "صحيح البخاري 2316 — خبر من أخبار الظرفاء والمغفلين", en: "Sahih al-Bukhari 2316 — a report of the wits and the fools", ur: "صحیح بخاری 2316 — ظریفوں اور مغفلوں کی ایک خبر", fr: "Sahih al-Bukhari 2316 — un récit des beaux esprits et des sots", es: "Sahih al-Bujari 2316 — un relato de ingeniosos y necios", tr: "Sahih el-Buhari 2316 — Zeki ve aptal insanlar hakkında bir hikaye", id: "Sahih al-Bukhari 2316 — Kisah tentang orang-orang yang cerdas dan bodoh" }
text: "حَدَّثَنَا ابْنُ سَلاَمٍ، أَخْبَرَنَا عَبْدُ الْوَهَّابِ الثَّقَفِيُّ، عَنْ أَيُّوبَ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عُقْبَةَ بْنِ الْحَارِثِ، قَالَ جِيءَ بِالنُّعَيْمَانِ أَوِ ابْنِ النُّعَيْمَانِ شَارِبًا، فَأَمَرَ رَسُولُ اللَّهِ مَنْ كَانَ فِي الْبَيْتِ أَنْ يَضْرِبُوا قَالَ فَكُنْتُ أَنَا فِيمَنْ ضَرَبَهُ، فَضَرَبْنَاهُ بِالنِّعَالِ وَالْجَرِيدِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2316، فيه خبر من أخبار الظرفاء والمغفلين. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 2316, with a report of the wits and the fools. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 2316، جس میں ظریفوں اور مغفلوں کی ایک خبر ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2316, avec un récit des beaux esprits et des sots. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 2316, con un relato de ingeniosos y necios. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 2316 numaralı hadis, zeki ve aptal insanlar hakkında bir hikaye içerir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve mizah, fıkra ve anekdotlar üzerine kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2316, berisi kisah tentang orang-orang yang cerdas dan bodoh. Hadits ini dikumpulkan oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang humor, lelucon, dan anekdot."
