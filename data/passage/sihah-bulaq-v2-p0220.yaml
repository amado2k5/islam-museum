text: |-
  ٣٦٧
  وكل امر أمتزوجة محصنة بالفتح لاغير وقال
  أحصنوا أتهم من عبدهم • تلل أفعال القزام الوكمه
  أى زوجوا وقرئ فاذا أحصن على مالم يسم فاعله أى زوجن وحسنت المرأة بالضم خصنا أى
  فت فهى حاصن وحمان بالفتح و-صناء أيضايذة الحصانة وقرس حصان بالكسربين
  العصين والتحصن ويقال انه سمى حص انالانه ضنّ بماته فلم ينز الاعلى كريمة ثم كثر ذلك حتى
  "واكل ذكر من الخيل جصانا وحصنان بلد قال اليزيدى سألى والكسائى المهدى عن
  النسبة الى البحرين والى حصفين لم قالواحصفّ ويجرانىّ فقال الكسائى كرهوا أن يولوا
  حصنانى لاجتماع النوفيز وقلت أناكرهوا أن ية ولوا بحرى فيشبه النسبة الى البحر
  وأبو الحصين كنية النعلب وحصين أبوالراعى عبيد بن حصين الميرى الشاعر وقد سمت
  العرب حعنا وجسينا ذن لمضن مادون الابط الى الكشخ وحضنا الشئ جانبا.
  ونواحى كل شئ أحضانه والمحتض أيضا الحضن قال الاعشى
  عريضة بوص اذا أدبرت • هضيم الحشاشختة المختضن
  وحضن الضبع وجاره قال الكميت
  كما خامرت فى حضنها أمّ عامر * لذى الحبل -تى عال أوس عبالها
  وحضن الطائربيضه يحضته اذافجه الى نفسمتحت جناحه وكذلك المرأة اذاحفات
  رلدها وحاضسنة الصبيّ التى تقوم عليه فى تريته وحضته عن كذاحضنا وحضانة اذا فية
  عنه واستبددت به دونه وحضفته عن حاجته أحضفه بالضم أى حبسته عنها واحتضنته على
  كذا مثله واحتضنت الذى جعلته فى حضى والحضون من الشاء الشطوروهى التى أحد طبيها
  أطول من الاخرية ال شاحضون بينه الحضان بالكسر وحضن بالتحريك جبل بأعلى نجد
  والعرب تقول أنج_د من رأى حضنا أى من عاين هذا الجمبل فقدد خل فى ناحية نجدابن
  السكيت الحض فى بعض اللغات العاج وينشد فى ذلك* وأبرزت عن هجان اللون كالخضن
  أبوزيد أحضنت بالرجل أزريت به ⁦(حفن)⁩ الحفنمل•الكفين من طعام ومنه انمائحن
  حقفة من حقنات اللّٰه تعالى أى يسير بالاضافة الى ملكه ورحته وحفقت الشئ اذاجرفه
  بكاتا يديك ولا يكون الامن الشئ اليابس كالدقيق ونحوه وحفذت لدلان حفنة أعطيته قليلا
  واحتفنت الشى لنفسى أخسذته أبوز يداحتفنت الرجل احتفانا قلعته من الاصل-كاه
  عنسه أبو عبيد والحفنة بالضم الحفرة والمع الحفن والحفان فراخ النعام وهومن المضاعف
  وربماسمواصفار الابل حفانا الواحدة حفانة للذكر والانثى جميعا ⁦(-قن)⁩ حقنت اللبن
  أحقنه بالضم اذا بهمته فى السقاء وصبيت حليه على رائبه واسم هذا اللبن الحقين والسقا.
  المحقن وفى المثل أبى الحقيز العذرة أى العذر وحقنت دمه منعته أن يسفك قال الكسائى
  حقنت البول وأنكر أحقنت والحاقن الذى بدبول شديد يقال لارأى لحاقن أبو عرو
  الحناقنة النقرة بين النرقوة وحبل العائق وهماحاقنتات. وفى المثل لالحقن -واقنك بذواقتك
  اذا قنة طرف الملقوم ومنه قول عائشة رضى اللّٰه عنهانو فى رسول اللّٰه صلى اللّٰه عليه وسلم بين
  -حرى ونحرى وبين حاقنتى وذاقنتى ويروى شجرى وهومابين اللهيسين ويقال الحاقنة ماسفل
