text: "قال هو اسحاق، حدثنا ابو كريب قل دما أبن يمان عن سفيان عن الى سِنان الشَّيْبانى عن أبن الى الهُذيْل قل الذبيج هو اسحلىء، حَدثنا أبو كريب قال ما سفيان بن عُقْبة عن حمزة الزَيّات عن الى أسحاق عن الى …"
