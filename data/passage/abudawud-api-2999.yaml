text: "أَجَلْ ‏.‏ قُلْنَا نَاوِلْنَا هَذِهِ الْقِطْعَةَ الأَدِيمَ الَّتِي فِي يَدِكَ فَنَاوَلَنَاهَا فَقَرَأْنَاهَا فَإِذَا فِيهَا ‏ \"‏ مِنْ مُحَمَّدٍ رَسُولِ اللَّهِ إِلَى بَنِي زُهَيْرِ بْنِ أُقَيْشٍ إِنَّكُمْ إِنْ شَهِدْتُمْ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَأَقَمْتُمُ الصَّلاَةَ وَآتَيْتُمُ الزَّكَاةَ وَأَدَّيْتُمُ الْخُمُسَ مِنَ الْمَغْنَمِ وَسَهْمَ النَّبِيِّ صلى الله عليه وسلم وَسَهْمَ الصَّفِيِّ أَنْتُمْ آمِنُون …"
summary:
  ar: "في سنن أبي داود؛ نص كتاب أو جوابه منسوب إلى مرسل."
  en: "In Sunan Abi Dawud; a letter text or reply attributed to a sender."
  ur: "سنن ابی داؤد میں؛ بھیجنے والے سے منسوب خط کا متن یا جواب."
