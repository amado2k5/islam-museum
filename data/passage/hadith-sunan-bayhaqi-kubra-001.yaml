text: "ناولنا هذه القطعة الأديم فناولناها فقرأنا ما فيها فإذا فيها من محمد رسول الله يه إلى بني زهير بن أقيش أنكم إن شهدتم أن لا إله إلا الله، وأن محمدا رسول الله وأقمتم الصلاة وآتيتم الزكاة وأديتم الخمس من المغنم"
