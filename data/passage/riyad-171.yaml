label:
  ar: "رياض الصالحين 171 — من سن في الإسلام سنة سيئة"
  en: "Riyad al-Salihin 171 — Whoever originates an evil practice in Islam bears its burden"
  es: "Riyad al-Salihin 171 — Quien origina una mala práctica en el Islam carga con su peso."
  fr: "Riyad al-Salihin 171 — Quiconque instaure une pratique néfaste en Islam en porte la responsabilité."
  ur: "ریاض الصالحین 171 - جو شخص اسلام میں برائی کی ابتدا کرتا ہے اس کا بوجھ اٹھاتا ہے۔"
text: "مَنْ سَنَّ فِي الإِسْلاَمِ سُنَّةً سَيِّئَةً كَانَ عَلَيْهِ وِزْرُهَا وَوِزْرَ مَنْ عَمِلَ بِهَا إِلَى يَوْمِ الْقِيَامَةِ، وَمَنْ سَنَّ سُنَّةً حَسَنَةً كَانَ عَلَيْهِ أَجْرُهَا وَأَجْرُ مَنْ عَمِلَ بِهَا إِلَى يَوْمِ الْقِيَامَةِ"
summary:
