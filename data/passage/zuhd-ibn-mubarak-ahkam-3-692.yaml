text: "… لا بأس بأن يؤم النفر فى النافلة، فأما أن يكون مشهرا ويجمع له الناس فلا، وهذا بناءً على قاعدته فى سد الذرائع لما يخشى من أن يظن من لا علم له أن ذلك فريضة واستثنى ابن حبيب من أصحابه قيام …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 692، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل، وما لا بأس به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 692, whose wording mentions the obligation (farida), the supererogatory (nafila), what is said to be no harm; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 692 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل، جس میں کوئی مضائقہ نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ibn al-Mubarak, volume numérisé 3, p. 692, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila), ce qui est dit sans inconvénient ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Zuhd de Ibn al-Mubarak, volumen digitalizado 3, p. 692, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila), lo que se dice que no tiene inconveniente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Mubarak'ın *El-Zuhd* adlı eserinin 3. cildinin 692. sayfasından bir alıntı, farz olan ve nafile olan amellerin yanı sıra caiz olan amellerden de bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar üzerine araştırmalar yapan bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Zuhd* karya Ibn al-Mubarak, Jilid 3, halaman 692, menyebutkan amalan wajib dan amalan sunnah, serta amalan yang diperbolehkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
