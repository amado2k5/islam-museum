label: { ar: "الموطأ 1782 — مالك: بيع العربان أن يشتري الرجل العبد أو الوليدة أو يتكارى الدابة، ويعطي البائع عربونا على أنه إن أخذ السلعة احتسب من الثمن، وإن تركها بطل ما دفع", en: "Muwatta 1782", es: "Muwatta 1782", fr: "Muwatta 1782", ur: "موطا 1782", tr: "Al-Muwatta 1782 — Malik: Peşinatlı satış, bir adamın bir köle veya genç bir kız satın alması veya bir hayvan kiralaması ve satıcıya, malı alması halinde peşinat olarak ödeme yapmasıdır; eğer malı alırsa, bu peşinat fiyattan düşülecek, almazsa ödediği para geçersiz sayılacaktır.", id: "Al-Muwatta 1782 — Malik: Penjualan dengan uang muka adalah ketika seseorang membeli budak atau gadis muda atau menyewa hewan, dan memberikan uang muka kepada penjual dengan syarat bahwa jika ia mengambil barang tersebut, uang muka akan dikurangi dari harga, dan jika ia meninggalkannya, apa yang telah dibayarkannya menjadi batal." }
summary:
  ar: "قال مالك: وذلك فيما نرى، والله أعلم، أن يشتري الرجل العبد أو الوليدة، أو يتكارى الدابة، ثم يقول للذي اشترى منه أو تكارى منه: أعطيك دينارا أو درهما أو أكثر أو أقل، على أني إن أخذت السلعة، أو ركبت ما تكاريت منك، فالذي أعطيتك هو من ثمن السلعة أو من كراء الدابة، وإن تركت ابتياع السلعة أو كراء الدابة، فما أعطيتك لك باطل بغير شيء. {cite:muwatta-maruf-1997 p.129} {cite:muwatta-maruf-1997 p.130}"
  tr: "Malik şöyle dedi: Bizim görüşümüze göre ve Allah en iyisini bilir, bu, bir adamın bir köle veya kadın köle satın alması veya bir hayvan kiralaması ve sonra onu satın aldığı veya kiraladığı kişiye şöyle demesidir: \"Sana bir dinar veya bir dirhem, ya da daha fazla ya da daha az vereceğim, ancak eğer o eşyayı alırsam veya kiraladığım hayvana binersem, verdiğim şey eşyanın veya hayvanın bedelinin bir parçası olur. Ama eğer o eşyayı almazsam veya hayvanı kiralamazsam, verdiğim şey geçersiz ve karşılıksız olur.\" {cite:muwatta-maruf-1997 s.129} {cite:muwatta-maruf-1997 s.130}"
  id: "Malik berkata: Menurut pandangan kami, dan Allah Maha Mengetahui, ini adalah ketika seseorang membeli seorang budak laki-laki atau perempuan, atau menyewa seekor hewan, lalu berkata kepada orang yang menjualnya: Saya akan memberi Anda satu dinar atau satu dirham, atau lebih atau kurang, dengan syarat jika saya mengambil barang tersebut, atau menunggangi hewan yang saya sewa dari Anda, maka apa yang saya berikan kepada Anda adalah bagian dari harga barang tersebut atau biaya sewa hewan tersebut. Tetapi jika saya tidak membeli barang tersebut atau menyewa hewan tersebut, maka apa yang saya berikan kepada Anda adalah batal dan tanpa imbalan apa pun. {cite:muwatta-maruf-1997 p.129} {cite:muwatta-maruf-1997 p.130}"
