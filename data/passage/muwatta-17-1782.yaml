label: { ar: "الموطأ 1782 — مالك: بيع العربان أن يشتري الرجل العبد أو الوليدة أو يتكارى الدابة، ويعطي البائع عربونا على أنه إن أخذ السلعة احتسب من الثمن، وإن تركها بطل ما دفع", en: "Muwatta 1782" }
summary:
  ar: "قال مالك: وذلك فيما نرى، والله أعلم، أن يشتري الرجل العبد أو الوليدة، أو يتكارى الدابة، ثم يقول للذي اشترى منه أو تكارى منه: أعطيك دينارا أو درهما أو أكثر أو أقل، على أني إن أخذت السلعة، أو ركبت ما تكاريت منك، فالذي أعطيتك هو من ثمن السلعة أو من كراء الدابة، وإن تركت ابتياع السلعة أو كراء الدابة، فما أعطيتك لك باطل بغير شيء. {cite:muwatta-maruf-1997 p.129} {cite:muwatta-maruf-1997 p.130}"
