text: "… فاصبح ميّتا قد التوت عنقه ونتفت لحيته وقيل مات بغير ضب، وذكر عن مبارك المغربى انه قل ما اظنّه اكل فى طول حبسه الا رغيفا واحدا وكان يأكل العنبة والعنبتين قل وكنت اسمعم قبل موته بيومين او ثلثة يقول لنفسه …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 1، ص 103، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 1, p. 103, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 1، ص 103 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
