label: { ar: "مسلم 93 — الموجبتان", en: "Muslim 93 — The two guarantees" }
text: "قال جابر: أتى النبي رجل فقال: يا رسول الله ما الموجبتان؟ قال: من مات لا يشرك بالله شيئاً دخل الجنة، ومن مات يشرك بالله شيئاً دخل النار"
summary:
  ar: "رواية جابر بن عبد الله في باب حرمة دم المؤمن من كتاب الإيمان في صحيح مسلم؛ جواب النبي عن سؤال «ما الموجبتان» بالتوحيد موجباً للجنة والشرك موجباً للنار."
