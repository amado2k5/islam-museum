label:
  ar: "مسلم 1887 — أرواح الشهداء في جوف طير خضر: أنا أبلغهم عنكم"
  en: "Muslim 1887 — The souls of the martyrs in green birds: I shall tell them about you"
  ur: "مسلم 1887 — شہیدوں کی روحیں سبز پرندوں میں: میں تمہاری طرف سے انہیں خبر دوں گا"
text: "أرواحهم في جوف طير خضر لها قناديل معلقة بالعرش تسرح من الجنة حيث شاءت ثم تأوي إلى تلك القناديل فاطلع إليهم ربهم اطلاعة فقال هل تشتهون شيئا قالوا أى شىء نشتهي ونحن نسرح من الجنة حيث شئنا ففعل ذلك بهم …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1887: أرواح الشهداء في جوف طير خضر: أنا أبلغهم عنكم. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1887: The souls of the martyrs in green birds: I shall tell them about you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1887: شہیدوں کی روحیں سبز پرندوں میں: میں تمہاری طرف سے انہیں خبر دوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
