label: { ar: "الأربعون 50 — لا يزال لسانك رطباً من ذكر الله", en: "Arba'un 50 — keep your tongue moist with remembrance of God", es: "Arba'un 50 — mantén tu lengua húmeda con el recuerdo de Dios.", fr: "Arba'un 50 — gardez votre langue humide du souvenir de Dieu", ur: "اربعون 50 - خدا کے ذکر سے اپنی زبان کو تر رکھیں", tr: "Kırkıncı (50) — Diliniz hâlâ Tanrı'yı anmakla nemli olsun.", id: "Yang keempat puluh (50) — Semoga lidahmu masih basah dengan mengingat Tuhan" }
text: "لا يزال لسانك رطباً من ذكر الله عز وجل"
summary:
  ar: "حديث عبد الله بن بسر قال: أتى النبي رجل فقال يا رسول الله إن شرائع الإسلام قد كثرت علينا فباب نتمسك به جامع قال: «لا يزال لسانك رطباً من ذكر الله عز وجل» — ثامن الأحاديث التي زادها ابن رجب وخاتمة الخمسين؛ أخرجه أحمد 4/188 و190 بهذا اللفظ وخرجه الترمذي (3375) وابن ماجه (3793) وابن حبان (814) بمعناه وقال الترمذي حسن غريب وكلهم من رواية عمرو بن قيس الكندي عن عبد الله بن بسر؛ وخرج ابن حبان (818) والبخاري في خلق أفعال العباد والطبراني والبيهقي في شعب الإيمان من حديث معاذ بن جبل قال: آخر ما فارقت عليه رسول الله أن قلت له أي الأعمال خير وأقرب إلى الله قال «أن تموت ولسانك رطب من ذكر الله عز وجل»؛ قال ابن رجب قد سبق في هذا الكتاب مفرقاً ذكر كثير من فضائل الذكر ونذكر ههنا فضل إدامته والإكثار منه — مستدلاً بالأمر بذكر الله ذكراً كثيراً ومدح فاعله في آيات منها «يا أيها الذين آمنوا اذكروا الله ذكراً كثيراً وسبحوه بكرة وأصيلاً» و«والذاكرين الله كثيراً والذاكرات أعد الله لهم مغفرة وأجراً عظيماً» ⁦(جامع العلوم والحكم ص 927–956)⁩."
  en: "The hadith of Abdullah ibn Busr that a man came to the Prophet saying 'Messenger of God, the laws of Islam have grown many upon us — is there a comprehensive gate we may hold to?' and he said 'keep your tongue moist with the remembrance of God' — the eighth of Ibn Rajab's added hadiths and the seal of the fifty; Ahmad (4/188, 190) carries it in this wording while al-Tirmidhi (3375), Ibn Majah (3793) and Ibn Hibban (814) carry its meaning, al-Tirmidhi grading it hasan gharib, all through Amr ibn Qays al-Kindi from Abdullah ibn Busr; Ibn Hibban (818), al-Bukhari in Khalq af'al al-ibad, al-Tabarani and al-Bayhaqi in Shu'ab al-iman carry Mu'adh ibn Jabal's parallel: 'the last thing on which I parted from the Messenger of God was my asking which deed is best and nearest to God — he said: that you die with your tongue moist with the remembrance of God'; Ibn Rajab notes that many excellences of remembrance were scattered through the book and treats here the merit of its constancy and abundance, citing the command to remember God much and His praise of those who do — 'you who believe, remember God with much remembrance and glorify Him morning and evening' and 'the men and women who remember God much, God has prepared for them forgiveness and a great reward' (Jami' al-Ulum wal-Hikam pp. 927–956)."
  es: "El hadiz de Abdullah ibn Busr que un hombre se acercó al Profeta diciendo 'Mensajero de Dios, las leyes del Islam nos han abrumado, ¿hay una puerta integral a la que podamos aferrarnos?' y él dijo 'mantén tu lengua húmeda con el recuerdo de Dios', el octavo de los hadices añadidos por Ibn Rajab y el sello de los cincuenta; Ahmad (4/188, 190) lo transmite con esta redacción, mientras que al-Tirmidhi (3375), Ibn Majah (3793) e Ibn Hibban (814) transmiten su significado, al-Tirmidhi lo clasifica como hasan gharib, todos a través de Amr ibn Qays al-Kindi de Abdullah ibn Busr; Ibn Hibban (818), al-Bukhari en Khalq af'al al-ibad, al-Tabarani y al-Bayhaqi en Shu'ab al-iman recogen el paralelo de Mu'adh ibn Jabal: «Lo último en lo que me separé del Mensajero de Dios fue en preguntarle qué obra es la mejor y más cercana a Dios; él dijo: que mueras con la lengua húmeda por el recuerdo de Dios»; Ibn Rajab señala que muchas excelencias del recuerdo estaban dispersas a lo largo del libro y trata aquí el mérito de su constancia y abundancia, citando el mandato de recordar mucho a Dios y Su alabanza a quienes lo hacen: «Vosotros que creéis, recordad a Dios con mucho recuerdo y glorificadlo mañana y tarde» y «a los hombres y mujeres que recuerdan mucho a Dios, Dios les ha preparado el perdón y una gran recompensa» (Jami' al-Ulum wal-Hikam pp. 927–956)."
  fr: "Le hadith d'Abdullah ibn Busr selon lequel un homme vint trouver le Prophète en disant: « Messager de Dieu, les lois de l'Islam sont devenues nombreuses pour nous — existe-t-il une porte universelle à laquelle nous puissions nous accrocher ? » et il répondit: « Gardez votre langue humide du souvenir de Dieu » — le huitième des hadiths ajoutés par Ibn Rajab et le sceau des cinquante; Ahmad (4/188, 190) le rapporte dans cette formulation tandis qu'al-Tirmidhi (3375), Ibn Majah (3793) et Ibn Hibban (814) en rapportent le sens, al-Tirmidhi le qualifiant de hasan gharib, le tout transmis par Amr ibn Qays al-Kindi d'après Abdullah ibn Busr; Ibn Hibban (818), al-Bukhari dans Khalq af'al al-ibad, al-Tabarani et al-Bayhaqi dans Shu'ab al-iman reprennent le parallèle de Mu'adh ibn Jabal: « La dernière chose sur laquelle je me suis séparé du Messager de Dieu fut ma question sur l'acte le meilleur et le plus proche de Dieu — il a dit: que tu meures la langue encore humide du souvenir de Dieu »; Ibn Rajab note que de nombreuses vertus du souvenir étaient disséminées dans le livre et traite ici du mérite de sa constance et de son abondance, citant le commandement de se souvenir souvent de Dieu et Son éloge de ceux qui le font — « Ô vous qui croyez, invoquez souvent Dieu et glorifiez-Le matin et soir » et « Les hommes et les femmes qui invoquent souvent Dieu, Dieu leur a préparé le pardon et une grande récompense » (Jami' al-Ulum wal-Hikam pp. 927–956)."
  ur: "عبداللہ بن بسر کی حدیث ہے کہ ایک آدمی نبی کے پاس آیا کہ یا رسول اللہ، اسلام کے قوانین نے ہم پر بہت زیادہ اضافہ کر دیا ہے، کیا کوئی ایسا جامع دروازہ ہے جسے ہم پکڑ سکتے ہیں؟ اور فرمایا کہ اپنی زبان کو ذکر الٰہی سے تر رکھو - ابن رجب کی شامل کردہ احادیث کی آٹھویں اور پچاس کی مہر احمد ⁦(4/188، 190)⁩ نے اسے اس لفظ میں لیا ہے جب کہ الترمذی (3375)، ابن ماجہ (3793) اور ابن حبان (814) اس کے معنی لیتے ہیں، الترمذی نے اسے حسن غریب کی درجہ بندی کی ہے، یہ سب عمرو بن قیس الکندی کے ذریعے عبداللہ ابن بس سے؛ ابن حبان (818)، البخاری، خلق افل العباد، الطبرانی اور البیہقی نے شعب الایمان میں معاذ بن جبل کا متوازی بیان کیا ہے: آخری چیز جس پر میں رسول اللہ سے جدا ہوا، وہ یہ تھا کہ میں نے یہ پوچھا کہ کون سا عمل بہتر ہے اور اللہ کے نزدیک کون سا ہے، آپ نے فرمایا: ”تمہارے نزدیک کون سا عمل بہتر ہے۔ خدا'؛ ابن رجب نے نوٹ کیا کہ ذکر کی بہت سی خوبیاں کتاب میں بکھری ہوئی ہیں اور یہاں اس کی مستقل مزاجی اور کثرت کی خوبی بیان کی گئی ہے، اللہ تعالیٰ کو کثرت سے یاد کرنے اور اس کی تعریف کرنے والوں کے لیے اس کی تعریف کا حوالہ دیتے ہوئے - 'اے ایمان والو، اللہ کو بہت زیادہ یاد کرو اور صبح و شام اس کی تسبیح کرو' اور 'وہ مرد اور عورت جنہوں نے اللہ کو بہت زیادہ یاد کرنے کے لیے تیار کیا ہے' العلم والحکم صفحہ 927-956)۔"
  tr: "Abdullah bin Busr'ın rivayet ettiği hadis şöyledir: Bir adam Peygamberimize gelip, \"Ey Allah'ın Resulü, İslam'ın kanunları bizim için çok fazla oldu, öyleyse uyabileceğimiz kapsamlı bir kapı nedir?\" dedi. Peygamberimiz şöyle buyurdu: \"Diliniz her zaman Yüce Allah'ı anmakla ıslak olsun.\" — İbn Receb'in eklediği sekizinci hadis ve elli hadisin sonuncusudur; Ahmed 4/188 ve 190'da bu şekilde rivayet edilmiş, Tirmizi (3375), İbn Majah (3793) ve İbn Hibban (814) ise anlamıyla rivayet etmiştir. Tirmizi, hadisin hem güzel hem de garip olduğunu ve hepsinin Amr bin Kays el-Kindi'nin Abdullah bin Busr'dan rivayet ettiği hadisler olduğunu söylemiştir. İbn Hibban (818), Buhari (Halk Af'al el-İbad), Taberani ve Beyhaki (Şu'ab el-İman) de Mu'az bin Cebel'den rivayetle şöyle buyurmuşlardır: \"Allah'ın Resulü'ne son olarak, 'Hangi ameller Allah'a en yakın ve en hayırlıdır?' diye sordum. O da, 'Diliniz Allah'ı anmakla ıslak kalarak ölmenizdir' dedi.\" İbn Receb şöyle demiştir: Bu kitapta zikrin birçok fazileti ayrı ayrı ele alınmıştır ve burada zikri sürdürmenin ve artırmanın faziletinden bahsederiz; Allah'ı çokça zikretme emrini ve bunu yapanın övgüsünü şu ayetlerde zikrederek: “Ey iman edenler! Allah'ı çokça zikredin ve O'nu sabah ve akşam yüceltin” ve “Allah'ı çokça zikreden erkekler ve bunu yapan kadınlar için Allah bağışlanma ve büyük bir mükafat hazırlamıştır” (Cami’ el-Ulum ve el-Hikam, s. 927–956)."
  id: "Hadits Abdullah bin Busr, yang berkata: Seorang pria datang kepada Nabi dan berkata, “Wahai Rasulullah, hukum-hukum Islam telah menjadi terlalu banyak bagi kami, lalu apa pintu yang komprehensif yang dapat kami patuhi?” Beliau bersabda, “Hendaklah lidahmu selalu basah dengan mengingat Allah Yang Maha Agung.” — Hadits kedelapan yang ditambahkan oleh Ibnu Rajab dan yang terakhir dari lima puluh hadits; diriwayatkan oleh Ahmad 4/188 dan 190 dengan redaksi ini, dan diriwayatkan oleh al-Tirmidhi (3375), Ibnu Majah (3793), dan Ibnu Hibban (814) dengan maknanya. Al-Tirmidhi mengatakan hadits ini baik dan aneh, dan semuanya berasal dari riwayat Amr bin Qais al-Kindi atas otoritas Abdullah bin Busr; Ibn Hibban (818), al-Bukhari dalam Khalq Af’al al-‘Ibad, al-Tabarani, dan al-Bayhaqi dalam Shu’ab al-Iman meriwayatkannya dari Mu’adh bin Jabal, yang berkata: Hal terakhir yang kukatakan kepada Rasulullah adalah, “Amalan apa yang terbaik dan paling dekat dengan Allah?” Beliau menjawab, “Bahwa kamu meninggal dengan lidahmu basah oleh zikir kepada Allah Yang Maha Agung.” Ibn Rajab berkata: Banyak keutamaan zikir telah disebutkan secara terpisah dalam buku ini, dan di sini kami menyebutkan keutamaan melanjutkan dan meningkatkannya — mengutip perintah untuk banyak berzikir kepada Allah dan pujian bagi orang yang melakukannya dalam ayat-ayat antara lain: “Wahai orang-orang yang beriman, banyaklah berzikir kepada Allah dan agungkanlah Dia di pagi dan sore hari” dan “Dan bagi laki-laki yang banyak berzikir kepada Allah dan perempuan yang banyak berzikir kepada Allah, maka Allah telah menyiapkan ampunan dan pahala yang besar” (Jami’ al-‘Ulum wa al-Hikam, hlm. 927–956)."
