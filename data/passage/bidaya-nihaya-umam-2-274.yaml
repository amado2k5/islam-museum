text: "… مخاطبا لموسى حين دعا على فرعون وملائه وأمن أخوه هارون على دعائه فنزل ذلك منزلة الداعى أيضا قال قد أجيت دعوتكما فاستقيما ولا تتبمان سبيل الذين لا يملمون قال المفسرون وغيرهم من آهل الكتاب استأذن بنو اسرائيل فرعون فى الحروج …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 2، ص 274، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 2, p. 274, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 2، ص 274 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
