label:
  ar: "الترمذي 3010 — كلم الله أبا جابر كفاحا: تمن علي أعطك"
  en: "Tirmidhi 3010 — God spoke to Jabir's father face to face: wish, and I shall give"
  ur: "ترمذی 3010 — اللہ نے جابر کے والد سے روبرو کلام کیا: تمنا کرو، میں دوں گا"
text: "يا جابر ما لي أراك منكسرا . قلت يا رسول الله استشهد أبي قتل يوم أحد وترك عيالا ودينا . قال أفلا أبشرك بما لقي الله به أباك . قال قلت بلى يا رسول الله . قال ما كلم الله …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3010: كلم الله أبا جابر كفاحا: تمن علي أعطك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3010: God spoke to Jabir's father face to face: wish, and I shall give. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3010: اللہ نے جابر کے والد سے روبرو کلام کیا: تمنا کرو، میں دوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
