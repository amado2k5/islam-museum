label: { ar: "الموطأ 2782 — ابن عمر: لا يحتلب أحد ماشية أحد بغير إذنه", en: "Muwatta 2782", es: "Muwatta 2782", fr: "Muwatta 2782", ur: "موطا 2782", tr: "El-Muvatta 2782 — İbn Ömer: Hiç kimse, başkasının hayvanını onun izni olmadan sağamaz.", id: "Al-Muwatta 2782 — Ibn Umar: Tidak seorang pun boleh memerah susu ternak orang lain tanpa izinnya." }
summary:
  ar: "يروي مالك عن نافع، عن عبد الله بن عمر أن النبي قال: لا يحتلبن أحد ماشية أحد بغير إذنه. ويضرب مثلا بمن يحب أن تؤتى مشربته فتكسر خزانته فينتقل طعامه، ويبين أن ضروع المواشي تخزن لأصحابها أقواتهم. {cite:muwatta-maruf-1997 p.564}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Peygamberimizin şöyle buyurduğunu nakleder: \"Kimse başkasının hayvanını izni olmadan sağmasın.\" Bunun için, içme yerinin ve ambarının soyulmasından hoşlanan birini örnek gösterir ve hayvanların memelerinin sahipleri için erzak depoladığını açıklar. {cite:muwatta-maruf-1997 s.564}"
  id: "Malik meriwayatkan dari Nafi’, dari Abdullah ibn Umar, bahwa Nabi bersabda: “Tidak seorang pun boleh memerah susu ternak orang lain tanpa izinnya.” Beliau memberikan contoh seseorang yang senang tempat minumnya dimasuki dan gudangnya dibobol, sehingga makanannya diambil, dan menjelaskan bahwa ambing ternak menyimpan persediaan makanan bagi pemiliknya. {cite:muwatta-maruf-1997 p.564}"
