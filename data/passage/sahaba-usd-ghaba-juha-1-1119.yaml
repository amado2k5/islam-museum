text: "… ع : مَرْوَانُ بن قَيْس الأسَدِي. وقيل: السلمي. ذكره البخاري في الصحابة. روى عنه ابنه خثيم بن مروان: أن النبي عليل مرَّ برجل سكران، يقال له: نعيمان فأمر به فضرب، ثمّ أُتى به مرّة أُخرى سكران فأمر به فضرب، ثمّ …"
