label:
  ar: "النسائي 4359 — نبي قرصته نملة: فهلا نملة واحدة"
  en: "Nasa'i 4359 — A prophet stung by an ant: why not just the one ant"
  ur: "نسائی 4359 — ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں"
text: "أخبرنا إسحاق بن إبراهيم، قال أنبأنا النضر، - وهو ابن شميل - قال أنبأنا أشعث، عن الحسن، نزل نبي من الأنبياء تحت شجرة فلدغته نملة فأمر ببيتهن فحرق على ما فيها فأوحى الله إليه فهلا نملة واحدة . وقال الأشعث …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 4359: نبي قرصته نملة: فهلا نملة واحدة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 4359: A prophet stung by an ant: why not just the one ant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 4359: ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
