label:
  ar: "النسائي 4359 — نبي قرصته نملة: فهلا نملة واحدة"
  en: "Nasa'i 4359 — A prophet stung by an ant: why not just the one ant"
  ur: "نسائی 4359 — ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں"
  es: "Nasa'i 4359 — Un profeta picado por una hormiga: ¿por qué no solo una hormiga?"
  fr: "Nasa'i 4359 — Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ?"
  tr: "Kadınların Hadisi 4359 — Bir peygamberi bir karınca ısırdı: Neden sadece bir karınca değil?"
  id: "Hadits Wanita 4359 — Seorang Nabi digigit semut: Mengapa bukan hanya satu semut?"
text: "أخبرنا إسحاق بن إبراهيم، قال أنبأنا النضر، - وهو ابن شميل - قال أنبأنا أشعث، عن الحسن، نزل نبي من الأنبياء تحت شجرة فلدغته نملة فأمر ببيتهن فحرق على ما فيها فأوحى الله إليه فهلا نملة واحدة . وقال الأشعث …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 4359: نبي قرصته نملة: فهلا نملة واحدة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 4359: A prophet stung by an ant: why not just the one ant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 4359: ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 4359: Un profeta picado por una hormiga: ¿por qué no solo una hormiga? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan an-Nasa'i, n° 4359: Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sunan an-Nasa'i'de 4359 numaralı hadis-i kudsi şöyledir: Bir peygamberi bir karınca ısırdı: \"Neden sadece bir karınca değil?\" Peygamber bunu Rabbinden rivayet etti ve hadis-i kudsi, bu rivayetleri altı şeriat hadis külliyatında ve el-Muvatta'da derledi."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 4359: Seorang Nabi digigit semut: \"Mengapa bukan hanya satu semut?\" Nabi meriwayatkan hal ini dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
