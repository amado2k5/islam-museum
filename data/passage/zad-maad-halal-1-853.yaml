text: "… والخلع والإبراء، وسائر الحقوق من المطالبة بها وإثباتها واستيفائها، والمخاصمة فيها، فما الذي حرَّم التوكيلَ في الطلاق؟ نعم الوكيلُ يقوم مقام الموكِّل فيما يملكه من الطلاق، ومالا يملِكُه، وما يَحلُّ له منه، وما يحرم عليه، ففي الحقيقة لم يُطلِّق إلَّا …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 853، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 853, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 853 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
