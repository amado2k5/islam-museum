text: "- كتاب الطهارة باب: أيوب: قال رسول اللّٰه أربع من سنن المرسلين: التعطر، والنكاح، والسواك، والحياء. - حدثنا وكيع قال: حدثنا عبد الرحمن بن عمرو الأوزاعي عن حسان بن عطية قال: يقال : الوضوء شطر الإيمان، والسواك شطر الوضوء، ولولا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 1052، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
