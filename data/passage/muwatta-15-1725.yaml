label: { ar: "الموطأ 1725 — أبو سلمة بن عبد الرحمن: سئل ابن عباس وأبو هريرة عن الحامل يتوفى عنها زوجها، فقال ابن عباس آخر الأجلين وقال أبو هريرة إذا ولدت فقد حلت، فسألت أم سلمة عن سبيعة الأسلمية", en: "Muwatta 1725", es: "Muwatta 1725", fr: "Muwatta 1725", ur: "موطا 1725", tr: "El-Muvatta 1725 — Ebu Selama bin Abdülrahman: İbn Abbas ve Ebu Hurayra'ya kocası ölen hamile bir kadın hakkında soru soruldu. İbn Abbas, \"İki dönemden sonraki dönem\" dedi ve Ebu Hurayra, \"Eğer doğum yaparsa, o zaman özgürdür\" dedi. Ümmü Selama, Subey'a el-Aslamiyye hakkında sordu.", id: "Al-Muwatta 1725 — Abu Salama bin Abd al-Rahman: Ibnu Abbas dan Abu Hurayra ditanya tentang seorang wanita hamil yang suaminya meninggal. Ibnu Abbas berkata, “Yang lebih akhir dari dua masa kehamilan,” dan Abu Hurayra berkata, “Jika dia melahirkan, maka dia bebas.” Umm Salama bertanya tentang Subay’a al-Aslamiyya." }
text: "قَدْ حَللْتِ فَانُكِحي مَن شِئْتِ"
summary:
  ar: "يروي يحيى عن مالك عن عبد ربه بن سعيد بن قيس عن أبي سلمة بن عبد الرحمن أنه قال سئل عبد الله بن عباس وأبو هريرة عن المرأة الحامل يتوفى عنها زوجها، فقال ابن عباس آخر الأجلين، وقال أبو هريرة إذا وضعت فقد حلت، فدخل أبو سلمة على أم سلمة زوج النبي فسألها، فقالت وضعت سبيعة الأسلمية بعد وفاة زوجها بنصف شهر، فخطبها رجلان، أحدهما شاب والآخر كهل، فمالت إلى الشاب، فقال الشيخ لم تحل بعد، وكان أهلها غيبا، فجاءت رسول الله فقال قد حللت فانكحي من شئت. {cite:muwatta-maruf-1997 p.104}"
  tr: "Yahya, Malik'ten, o da Abd Rabbih ibn Sa'id ibn Qays'tan, o da Ebu Seleme ibn Abd el-Rahman'dan rivayetle şöyle buyurmuştur: Abdullah ibn Abbas ve Ebu Hurayra'ya kocası ölen hamile bir kadın hakkında soru soruldu. İbn Abbas, \"İki bekleme süresinden daha geç olanı\" dedi. Ebu Hurayra ise, \"Doğum yaptığında yeniden evlenmekte özgürdür\" dedi. Ebu Seleme, Peygamberin eşi Ümmü Seleme'ye gitti ve ona sordu. Ümmü Seleme şöyle dedi: \"Subey'ah el-Aslamiyye, kocasının ölümünden yarım ay sonra doğum yaptı. İki adam ona evlenme teklif etti, biri genç, diğeri yaşlı. Genç olanı tercih etti, ancak yaşlı adam, 'Henüz yeniden evlenmekte özgür değil' dedi. Ailesi uzaktaydı. Allah'ın Resulü'ne gitti ve o da, 'Yeniden evlenmekte özgürsün, dilediğinle evlen' dedi.\" {cite:muwatta-maruf-1997 s.104}"
  id: "Yahya meriwayatkan dari Malik, dari Abd Rabbih ibn Sa'id ibn Qays, dari Abu Salamah ibn Abd al-Rahman, bahwa ia berkata: Abdullah ibn Abbas dan Abu Hurayrah ditanya tentang seorang wanita hamil yang suaminya meninggal. Ibn Abbas berkata, \"Masa iddah yang lebih akhir dari dua masa iddah,\" dan Abu Hurayrah berkata, \"Setelah ia melahirkan, ia bebas untuk menikah lagi.\" Abu Salamah pergi kepada Umm Salamah, istri Nabi, dan bertanya kepadanya. Ia berkata, \"Subay'ah al-Aslamiyyah melahirkan setengah bulan setelah kematian suaminya. Dua pria melamarnya, satu muda dan yang lain lebih tua. Ia lebih menyukai yang lebih muda, tetapi pria yang lebih tua berkata, 'Ia belum bebas untuk menikah lagi.'\" Keluarganya sedang pergi. Dia pergi menemui Rasulullah, dan beliau berkata, 'Kamu bebas menikah lagi, jadi menikahlah dengan siapa pun yang kamu inginkan.'\" {cite:muwatta-maruf-1997 p.104}"
