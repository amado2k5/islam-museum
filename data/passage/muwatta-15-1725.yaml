ref: "1725"
label: { ar: "الموطأ 1725 — أبو سلمة بن عبد الرحمن: سئل ابن عباس وأبو هريرة عن الحامل يتوفى عنها زوجها، فقال ابن عباس آخر الأجلين وقال أبو هريرة إذا ولدت فقد حلت، فسألت أم سلمة عن سبيعة الأسلمية", en: "Muwatta 1725" }
text: "قَدْ حَللْتِ فَانُكِحي مَن شِئْتِ"
summary:
  ar: "يروي يحيى عن مالك عن عبد ربه بن سعيد بن قيس عن أبي سلمة بن عبد الرحمن أنه قال سئل عبد الله بن عباس وأبو هريرة عن المرأة الحامل يتوفى عنها زوجها، فقال ابن عباس آخر الأجلين، وقال أبو هريرة إذا وضعت فقد حلت، فدخل أبو سلمة على أم سلمة زوج النبي فسألها، فقالت وضعت سبيعة الأسلمية بعد وفاة زوجها بنصف شهر، فخطبها رجلان، أحدهما شاب والآخر كهل، فمالت إلى الشاب، فقال الشيخ لم تحل بعد، وكان أهلها غيبا، فجاءت رسول الله فقال قد حللت فانكحي من شئت. {cite:muwatta-maruf-1997 p.104}"
