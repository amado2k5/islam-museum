text: "… متى مَكَثَ عندكُمْ مدةً يصير بالحالة المطلوبة تماماً كان أحد الحكام البخلاءِ قَدْ قالٍ للشيخِ: أنت لك معرفةٌ بالصيدِ والقنص وتعرف الصيادين، فأحضر لي كَلْباً سَلُوقياً بأذنينِ كأَذني الأرنب ورجلين كرجلَ الإبل ولونٍ كلون النملة. فبعد مدَّةٍ جاء الشيخ بكلب …"
summary:
  ar: "طلب والٍ بخيل من جحا أن يجد كلب صيد بأذنين كأذني الأرنب وساقين كساقي الجمل ولون النمل، فجاء جحا بكلب راعٍ كبير، وحين سُئل قال إنه سيصير على ما يُراد إن مكث مدة في بيت الوالي. {cite:juha-nawadir-kubra-djuwaydi p. 139}"
  en: "A stingy governor asks Juha to find a greyhound with ears like a hare, legs like a camel and the colour of an ant. Juha brings a large sheepdog, and when asked, he says it will become what is wanted if it stays some time at the governor's house. {cite:juha-nawadir-kubra-djuwaydi p. 139}"
  ur: "ایک کنجوس والی جحا سے کہتا ہے کہ ایسا شکاری کتا ڈھونڈ لائے جس کے کان خرگوش جیسے، ٹانگیں اونٹ جیسی اور رنگ چیونٹی جیسا ہو۔ جحا ایک بڑا گڈریے کا کتا لے آتا ہے، اور پوچھے جانے پر کہتا ہے کہ اگر وہ کچھ مدت والی کے گھر رہا تو مطلوبہ حالت میں ہو جائے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 139}"
  fr: "Un gouverneur avare demande à Juha de trouver un lévrier aux oreilles de lièvre, aux jambes de chameau et de la couleur d'une fourmi. Juha amène un grand chien de berger, et, interrogé, il dit qu'il deviendra ce qui est voulu s'il reste quelque temps chez le gouverneur. {cite:juha-nawadir-kubra-djuwaydi p. 139}"
  es: "Un gobernador tacaño pide a Juha que encuentre un galgo con orejas de liebre, patas de camello y color de hormiga. Juha trae un gran perro pastor, y al preguntarle, dice que se volverá lo que se desea si permanece un tiempo en la casa del gobernador. {cite:juha-nawadir-kubra-djuwaydi p. 139}"
  tr: "Cimri bir vali, Juha'dan tavşan kulaklı, deve bacaklı ve karınca renginde bir av köpeği bulmasını istedi. Juha büyük bir çoban köpeği getirdi ve sorulduğunda, köpeğin bir süre valinin evinde kalırsa istenildiği gibi olacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 139}"
  id: "Seorang gubernur yang kikir meminta Juha untuk mencari anjing pemburu dengan telinga seperti kelinci, kaki seperti unta, dan warna seperti semut. Juha membawa seekor anjing gembala besar, dan ketika ditanya, ia berkata bahwa anjing itu akan menjadi seperti yang diinginkan jika tinggal beberapa waktu di rumah gubernur. {cite:juha-nawadir-kubra-djuwaydi p. 139}"
