label: { ar: "صحيح البخاري 7210 — الأب والأبوة", en: "Sahih al-Bukhari 7210 — the father and fatherhood", ur: "صحیح بخاری 7210 — باپ اور والدیت", es: "Sahih al-Bukhari 7210 — El padre y la paternidad", fr: "Sahih al-Bukhari 7210 — Le père et la paternité", tr: "Sahih el-Buhari 7210 — Baba ve Babalık", id: "Sahih al-Bukhari 7210 — Ayah dan Peran Ayah" }
text: "… سَعِيدٌ ـ هُوَ ابْنُ أَبِي أَيُّوبَ ـ قَالَ حَدَّثَنِي أَبُو عَقِيلٍ، زُهْرَةُ بْنُ مَعْبَدٍ عَنْ جَدِّهِ عَبْدِ اللَّهِ بْنِ هِشَامٍ، وَكَانَ، قَدْ أَدْرَكَ النَّبِيَّ وَذَهَبَتْ بِهِ أُمُّهُ زَيْنَبُ ابْنَةُ حُمَيْدٍ إِلَى رَسُولِ اللَّهِ فَقَالَتْ يَا رَسُولَ اللَّهِ بَايِعْهُ. فَقَالَ النَّبِيُّ \" هُوَ صَغِيرٌ \" فَمَسَحَ رَأْسَهُ وَدَعَا لَهُ، وَكَانَ يُضَحِّي بِالشَّاةِ الْوَاحِدَةِ عَنْ جَمِيعِ أَهْلِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7210، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7210 (Judgments (Ahkaam)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7210، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7210 (Juicios (Ahkaam)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7210 (Jugements), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 7210 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7210, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
