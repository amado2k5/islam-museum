label: { ar: "سنن أبي داود 769 — الفريضة والفرائض، ما لا بأس به", en: "Sunan Abi Dawud 769 — the obligation (farida); what is said to be no harm", ur: "سنن ابی داؤد 769 — فریضہ اور فرائض، جس میں کوئی مضائقہ نہیں", fr: "Sunan Abi Dawud 769 — l'obligation (farida) ; ce qui est dit sans inconvénient", es: "Sunan Abi Dawud 769 — la obligación (farida); lo que se dice que no tiene inconveniente", tr: "Sunan Abi Davud 769 — Farz olan ameller ve müstesnalar, helal olan ameller", id: "Sunan Abi Dawud 769 — Amalan-amalan yang wajib dan amalan-amalan yang diperbolehkan" }
text: "حَدَّثَنَا الْقَعْنَبِيُّ، عَنْ مَالِكٍ، قَالَ لاَ بَأْسَ بِالدُّعَاءِ فِي الصَّلاَةِ فِي أَوَّلِهِ وَأَوْسَطِهِ وَفِي آخِرِهِ فِي الْفَرِيضَةِ وَغَيْرِهَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 769، يرد فيه ذكر الفريضة والفرائض، وما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 769 (Prayer (Kitab Al-Salat)), whose wording mentions the obligation (farida), what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 769، جس کے الفاظ میں فریضہ اور فرائض، جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 769, dont le texte mentionne l'obligation (farida), ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 769, cuyo texto menciona la obligación (farida), lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 769 numaralı hadis, farz olan ve caiz olan amellerden bahsetmektedir. Farz amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh amelleri, haram amelleri ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle bir araya getirmiştir. Derleyen kişi metnin içeriğini açıklamış ancak buna dayanarak fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 769, menyebutkan tentang amalan wajib dan amalan yang diperbolehkan. Penyusun amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
