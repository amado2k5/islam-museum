text: "… فانصرف موسى بن بغاة من واسط الى باب السلطان مع عمّاله عن اعمال المشرق : وفيها وُلى أبو الساج الاهواز وحرب فائد الزنج خصار اليها ابو الساج بعد شخوص عبد الرحمان بن مغلح الى ناحية فارس وفيها كانت بين عبد …"
