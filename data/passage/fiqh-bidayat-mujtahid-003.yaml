text: "بداية المجتهد ٤٣٤ الكتاب) (١). واختلفوا فيما سوى أهل الكتاب من المشركين هل تقبل منهم الجزية أم لا؟ فقال قوم: تؤخذ الجزية من كل مشرك، وبه قال مالك. وقوم استثنوا من ذلك مشركي العرب. وقال الشافعي وأبو ثور وجماعة: لا"
