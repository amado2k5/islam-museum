text: "… أَوْ طَلَبِ مَا لا يَسْتَحِقُّهُ عَنْ سُهَيْلٍ، عَنْ أَبِيهِ. لَكُمْ ثَلاثاً وَيَكْرَهُ لَكُمْ ثَلاثاً، فَيَرْضَى لَكُمْ أنْ تَعْبُدُوهُ وَلا الْمَال. وأما قوله : ولا تفرقوا فهو أمر بلزوم جماعة المسلمين وتألف بعضهم ببعض وهذه إحدى قواعد الإسلام. واعلم أن الثلاثة …"
summary:
