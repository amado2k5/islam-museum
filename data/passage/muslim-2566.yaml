ref: "2566"
label:
  ar: "مسلم 2566 — أين المتحابون بجلالي اليوم أظلهم في ظلي"
  en: "Muslim 2566 — Where are those who loved one another for My majesty? Today I shade them in My shade"
  ur: "مسلم 2566 — کہاں ہیں میری جلالت کی خاطر محبت کرنے والے؟ آج میں انہیں اپنے سائے میں رکھوں گا"
  es: "Musulmán 2566 — ¿Dónde están aquellos que se amaron unos a otros por Mi majestad? Hoy los protejo con Mi sombra."
  fr: "Muslim 2566 — Où sont ceux qui s'aimaient les uns les autres par respect pour Ma majesté ? Aujourd'hui, Je les abrite sous Mon ombre."
  tr: "Müslim 2566 — Benim için birbirlerini sevenler nerede? Bugün onları gölgemle gölgeleyeceğim."
  id: "Muslim 2566 — Di manakah orang-orang yang saling mencintai karena-Ku? Hari ini Aku akan menaungi mereka di bawah naungan-Ku."
text: "إن الله يقول يوم القيامة أين المتحابون بجلالي اليوم أظلهم في ظلي يوم لا ظل إلا ظلي ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2566: أين المتحابون بجلالي اليوم أظلهم في ظلي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2566: Where are those who loved one another for My majesty? Today I shade them in My shade. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2566: کہاں ہیں میری جلالت کی خاطر محبت کرنے والے؟ آج میں انہیں اپنے سائے میں رکھوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2566: ¿Dónde están aquellos que se amaron unos a otros por Mi majestad? Hoy los protejo con Mi sombra. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2566: Où sont ceux qui s’aimaient les uns les autres par crainte de Ma majesté ? Aujourd’hui, Je les abrite sous Mon ombre. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, nomor 2566: “Di manakah orang-orang yang saling mencintai karena-Ku? Hari ini Aku akan menaungi mereka di bawah naungan-Ku.” Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
