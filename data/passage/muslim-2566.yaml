label:
  ar: "مسلم 2566 — أين المتحابون بجلالي اليوم أظلهم في ظلي"
  en: "Muslim 2566 — Where are those who loved one another for My majesty? Today I shade them in My shade"
  ur: "مسلم 2566 — کہاں ہیں میری جلالت کی خاطر محبت کرنے والے؟ آج میں انہیں اپنے سائے میں رکھوں گا"
text: "إن الله يقول يوم القيامة أين المتحابون بجلالي اليوم أظلهم في ظلي يوم لا ظل إلا ظلي ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2566: أين المتحابون بجلالي اليوم أظلهم في ظلي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2566: Where are those who loved one another for My majesty? Today I shade them in My shade. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2566: کہاں ہیں میری جلالت کی خاطر محبت کرنے والے؟ آج میں انہیں اپنے سائے میں رکھوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
