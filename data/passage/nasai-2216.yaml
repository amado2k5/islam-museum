label:
  ar: "النسائي 2216 — الصوم لي وأنا أجزي به"
  en: "Nasa'i 2216 — Fasting is Mine, and I reward it"
  ur: "نسائی 2216 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "كل عمل ابن آدم له إلا الصيام هو لي وأنا أجزي به والصيام جنة إذا كان يوم صيام أحدكم فلا يرفث ولا يصخب فإن شاتمه أحد أو قاتله فليقل إني صائم والذي نفس محمد بيده لخلوف فم الصائم أطيب عند …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 2216: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 2216: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 2216: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
