label: { ar: "سنن النسائي 2526 — ما حُرّم", en: "Sunan al-Nasa'i 2526 — what was made unlawful", ur: "سنن نسائی 2526 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 2526 — lo que se declaró ilícito", fr: "Sunan al-Nasa'i 2526 — ce qui a été déclaré illicite" }
text: "… فَأَىُّ الصَّلاَةِ أَفْضَلُ قَالَ \" طُولُ الْقُنُوتِ \". قِيلَ فَأَىُّ الصَّدَقَةِ أَفْضَلُ قَالَ \" جَهْدُ الْمُقِلِّ \". قِيلَ فَأَىُّ الْهِجْرَةِ أَفْضَلُ قَالَ \" مَنْ هَجَرَ مَا حَرَّمَ اللَّهُ عَزَّ وَجَلَّ \". قِيلَ فَأَىُّ الْجِهَادِ أَفْضَلُ قَالَ \" مَنْ جَاهَدَ الْمُشْرِكِينَ بِمَالِهِ وَنَفْسِهِ \". قِيلَ فَأَىُّ الْقَتْلِ أَشْرَفُ قَالَ \" مَنْ أُهْرِيقَ دَمُهُ وَعُقِرَ جَوَادُهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2526، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2526 (The Book of Zakah), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2526، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2526 (El Libro del Zakat), menciona lo que se ha prohibido. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2526 (Le Livre de la Zakat), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
