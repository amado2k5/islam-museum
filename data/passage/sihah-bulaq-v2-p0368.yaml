text: |-
  ٢١٩
  وء اله بالشىّ أى اهاهبه كما يعال الصبى بشئءن الطعام يتجز أبه عن اللبن يقال فلان يعلل
  فسه بتعلة وتعلل به أى تلهى به وتجزأ وعلّ الشئ فهوم علول والمعلل يوم. ن أيام العجوزلانه
  يعلل الناس بشئ من تخفيف البرد والعلالة بالضم ما تعالات به والعلالة بقية اللبن والحلبة بين
  الحلبتين وبقية جرى الفرس وبقية كل شي يقال تمالات الناقة اذا استخرجت ما عندها من
  السيروقال * وقد تعاللت ذميل العدس * والعلية بالسكسر الغرفة والجمع العلالى وقد ذكرناه
  فى المعتل وعلّ واولّ لغتان بمعنى بقال علك تفعل وعلى أفعل واعلى أفعل وربما فالواعلنى
  ولعلنى وأنشدأبوزيد لحاتم
  أرين جوادامات هزلالعاى • أرى ماترين أوبخيلا مخادا
  ويقال أصله عل وانمازيدت اللام نوكيداومعناه التوقع لمرجوّأو مخوف وفيسه طمع
  واشفاق وهو حرف حثل انْ وليت وكأنَ ولمكن الا أنها تعمل عمل الفعل لشبههنّ به فتنصب
  الاسم وترفع الخبركما تعمل كان وأخواتها من الافعال وبعضهم يخفض مابعدها فيقول
  لعل زيد قائم وعل زيد قائم سمعه أبوزيد من بن عقيل والعلعل بالضم الرهابة التى تشرف على
  البطن من العظم كأنه لسان والعلعل الذكر من التنابر والعامل عضوالرجل اذا أنعظ
  واليعاليل سحائب بعضها فوق بعض الواحد يعلول قال السكميت
  كان جمانا واهى السلاث فوقه • كماانهل من بيض بعاليل تسكب
  ويقسال البعاليل نفاحات تكون فوق الماء ⁦(عمل)⁩ عمل عملا وأعمله غيره واستعمله بمعنى
  واستعمله أيضا أى طلب اليه العمل واعتمل اضعرب فى العمل وقال
  انّ الكريم وأيسك يعتمل • ان لم يحديوما على من يتكل
  وحمل اسم رجل وقالت امى أة تزقص ولدها
  أشبه أبا أقتك أو أشبه عمل• ولا نسكونن كهلوف وكل* وارق الى الخيرات زنأ فى الجبل
  ورجل عمل بكسر الميم أى مطبوع على العمل ورجل عمول واليعملة الناقة النجيبة المطبوعة
  على العمل وطريق معمل أى لحب مس_لوك وعامل الرمح مايلى السنان وهودون النعلب
  وعاملة حم اليمن وهو عاملة بن سباويزعم نساب مضر أنهم من ولد قاسط قال الاعشى
  أعامل حتى متى تذهبين * الى غسسير والدلك الاكرم
  ووالدكم فاسط فارجعوا * الى النسب الاتلد الاقدم
  وتعمل ذلان لكذا والتعميل تولية العمل يقال عملت فلاناء لى البصرة والعمالة بالضم رزق
  العامل ( مثل قال الاسمعى العميثل الذيال بذتبه وقال الخليل العميثل البطى"
  الذى يسبل ثيابه كالوادع الذى يكفى العمل ولا يحتاج الى التشمير وأنشدلابى النجم
  ليس بملتاث ولا عمينل ‹ وقال أبوزيد فى كتاب الابل العميثلة الناقة الجسيمة والعميث-ل
  الاسد ( ندل بوع رالعندل الطويل وقال أبوزيده والعظيم الرأس مثل القندل وأمّا
  العنادل جمع العندليب فيح_ذوف منه لان كل اسم جاوز أربعة أحرف ولم يكن الرابع من
  حروف المدّ واللين قانه برذالى الرباعى ثم يبنى منه الجمع والتصغيرفان كان الحرف الرابع من
  حوف المدواللين فانه الاتردّ الى الرباعى وتدنى منه ول . العول والعولة رفع الصوت
