label: { ar: "الموطأ 224 — صلاة بغير أم القرآن خداج، وحديث قسمت الصلاة بيني وبين عبدي", en: "Muwatta 224", es: "Muwatta 224", fr: "Muwatta 224", ur: "موطا 224", tr: "El-Muvatta 224 — Fatiha okunmadan yapılan namaz eksiktir ve hadis şöyledir: “Namazı kendimle kulum arasında paylaştırdım.”", id: "Al-Muwatta 224 — Shalat tanpa Al-Fatiha adalah tidak lengkap, dan hadits “Aku telah membagi shalat antara-Ku dan hamba-Ku”" }
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج، هي خداج، هي خداج، غير تمام"
summary:
  ar: "أول حديث في باب القراءة خلف الإمام فيما لا يجهر فيه بالقراءة. يرويه يحيى عن مالك عن العلاء بن عبد الرحمن أنه سمع أبا السائب مولى هشام بن زهرة يقول إنه سمع أبا هريرة يروي عن النبي أن من صلى صلاة لم يقرأ فيها بفاتحة الكتاب فصلاته ناقصة غير تامة. فسأله أبو السائب عن حاله إذا كان وراء الإمام، فغمز ذراعه وقال له: اقرأ بها في نفسك يا فارسي، ثم روى عن النبي الحديث القدسي أن الله قسم الصلاة، أي الفاتحة، بينه وبين عبده نصفين، فإذا قرأ العبد كل آية منها أجابه الله: حمدني عبدي، أثنى علي عبدي، مجدني عبدي، وهذه الآية بيني وبين عبدي، وهؤلاء لعبدي ولعبدي ما سأل. ويخرّجه المحقق عند مسلم (2/9–10) وأبي داود (821) والنسائي (2/135) وابن حبان وابن خزيمة وأحمد والبخاري في القراءة خلف الإمام وفي خلق أفعال العباد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الحديث ليس في الموطأ إلا عن العلاء عند جميع الرواة، وأن رواية مطرف له عن مالك عن ابن شهاب غريبة انفرد بها، وأن شعبة والثوري وابن عيينة رووه عن العلاء عن أبيه عن أبي هريرة، وليس ذلك باختلاف، فالحديث صحيح للعلاء عن أبيه وعن أبي السائب جميعاً ⁦(التمهيد 20/187–189)⁩. {cite:muwatta-maruf-1997 p.136} {cite:muwatta-maruf-1997 p.137} {cite:muwatta-maruf-1997 p.138}"
  tr: "Namazda imamın arkasında sessizce okuma ile ilgili ilk hadis, Yahya'nın Malik'ten, o da Al-Ala' ibn Abd al-Rahman'dan rivayet ettiği, Hişam ibn Zuhra'nın azatlı kölesi Ebu el-Sa'ib'in şöyle dediğini işittiği rivayettir: Ebu Hurayra'nın Peygamberimizden rivayet ettiğine göre, kim namazda Fatiha suresini okumazsa, namazı eksik ve tamamlanmamış olur. Ebu el-Sa'ib daha sonra imamın arkasında namaz kılarkenki durumunu sordu ve Ebu Hurayra koluyla dürterek ona şöyle dedi: \"Ey Farslı, onu sessizce kendi kendine oku!\" Sonra Peygamberimizden Allah'ın namazı, yani Fatiha suresini, kendisi ile kulu arasında ikiye böldüğüne dair kutsanmış hadisi rivayet etti. Kul her ayeti okuduğunda Allah ona şöyle cevap verir: “Kulum beni övdü, kulum beni yüceltti, kulum beni övdü ve bu ayet benimle kulum arasındadır. Bunlar kulum içindir ve kulum istediğini alacaktır.” Araştırmacı bunu Müslim (2/9-10), Ebu Davud (821), Nesai (2/135), İbn Hibban, İbn Huzeyme, Ahmed ve Buhari'de, İmamın arkasından okuma ve kulların amellerinin yaratılması bölümlerinde, Malik'in sahabelerinin rivayet zincirleriyle aktarmıştır. İbn Abdülberr'in, hadisin tüm ravilere göre sadece Al-Ala' aracılığıyla Al-Muvatta'da bulunduğunu, Mutarrif'in bunu Malik'ten, oradan da İbn Şihab'dan rivayet etmesinin garip ve ona özgü olduğunu, Şube, Eth-Seviri ve İbn Uyayne'nin ise bunu Al-Ala'dan, babasından, Ebu Hurayra'dan rivayet ettiğini söylediğini aktarır. Bu bir çelişki değildir, dolayısıyla hadis Al-Ala'nın babasından ve Ebu As-Sa'ib'den birlikte rivayet ettiği için sahihtir (At-Tamhid 20/187–189)."
  id: "Hadits pertama tentang membaca Al-Qur'an di belakang imam dalam salat yang bacaannya dilakukan secara diam-diam diriwayatkan oleh Yahya dari Malik, dari Al-Ala’ ibn Abd al-Rahman, yang mendengar Abu al-Sa’ib, budak yang dibebaskan oleh Hisham ibn Zuhrah, berkata bahwa ia mendengar Abu Hurayrah meriwayatkan dari Nabi bahwa siapa pun yang mengerjakan salat tanpa membaca Surah Al-Fatihah (Surah Pembuka Kitab), salatnya kurang dan tidak lengkap. Abu al-Sa’ib kemudian bertanya kepadanya tentang keadaannya ketika salat di belakang imam, dan ia menyenggolnya dengan lengannya dan berkata kepadanya: “Bacalah dalam hatimu, wahai orang Persia!” Kemudian ia meriwayatkan dari Nabi hadits qudsi bahwa Allah membagi salat, yang berarti Al-Fatihah, menjadi dua bagian antara Diri-Nya dan hamba-Nya. Ketika seorang hamba membaca setiap ayat, Allah menjawabnya: “Hamba-Ku telah memuji-Ku, hamba-Ku telah mengagungkan-Ku, hamba-Ku telah memuliakan-Ku, dan ayat ini adalah antara-Ku dan hamba-Ku. Ini semua untuk hamba-Ku, dan hamba-Ku akan mendapatkan apa yang dia minta.” Peneliti menyertakannya dalam Muslim (2/9–10), Abu Dawud (821), An-Nasa'i (2/135), Ibn Hibban, Ibn Khuzaymah, Ahmad, dan Al-Bukhari dalam bab-bab tentang membaca di belakang Imam dan tentang penciptaan amal perbuatan hamba, melalui sanad para sahabat Malik. Ia mengutip Ibnu Abd Al-Barr yang mengatakan bahwa hadits tersebut tidak ditemukan dalam Al-Muwatta' kecuali melalui Al-Ala' menurut semua perawi, dan bahwa riwayat Mutarrif dari Malik dari Ibnu Shihab adalah aneh dan unik baginya, dan bahwa Shu'bah, Ath-Thawri, dan Ibnu Uyaynah meriwayatkannya dari Al-Ala' dari ayahnya dari Abu Hurayrah. Ini bukanlah kontradiksi, sehingga hadits tersebut sahih bagi Al-Ala' dari ayahnya dan dari Abu As-Sa'ib bersama-sama (At-Tamhid 20/187–189)."
