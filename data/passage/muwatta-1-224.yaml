label: { ar: "الموطأ 224 — صلاة بغير أم القرآن خداج، وحديث قسمت الصلاة بيني وبين عبدي", en: "Muwatta 224" }
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج، هي خداج، هي خداج، غير تمام"
summary:
  ar: "أول حديث في باب القراءة خلف الإمام فيما لا يجهر فيه بالقراءة. يرويه يحيى عن مالك عن العلاء بن عبد الرحمن أنه سمع أبا السائب مولى هشام بن زهرة يقول إنه سمع أبا هريرة يروي عن النبي أن من صلى صلاة لم يقرأ فيها بفاتحة الكتاب فصلاته ناقصة غير تامة. فسأله أبو السائب عن حاله إذا كان وراء الإمام، فغمز ذراعه وقال له: اقرأ بها في نفسك يا فارسي، ثم روى عن النبي الحديث القدسي أن الله قسم الصلاة، أي الفاتحة، بينه وبين عبده نصفين، فإذا قرأ العبد كل آية منها أجابه الله: حمدني عبدي، أثنى علي عبدي، مجدني عبدي، وهذه الآية بيني وبين عبدي، وهؤلاء لعبدي ولعبدي ما سأل. ويخرّجه المحقق عند مسلم (2/9–10) وأبي داود (821) والنسائي (2/135) وابن حبان وابن خزيمة وأحمد والبخاري في القراءة خلف الإمام وفي خلق أفعال العباد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الحديث ليس في الموطأ إلا عن العلاء عند جميع الرواة، وأن رواية مطرف له عن مالك عن ابن شهاب غريبة انفرد بها، وأن شعبة والثوري وابن عيينة رووه عن العلاء عن أبيه عن أبي هريرة، وليس ذلك باختلاف، فالحديث صحيح للعلاء عن أبيه وعن أبي السائب جميعاً (التمهيد 20/187–189). {cite:muwatta-maruf-1997 p.136} {cite:muwatta-maruf-1997 p.137} {cite:muwatta-maruf-1997 p.138}"
