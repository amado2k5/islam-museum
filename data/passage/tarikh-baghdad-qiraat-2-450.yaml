text: "… قالت لنا طاهرة : ولدت مستهل شعبان من سنة تسع وخمسين وثلاثمائة، ومممت من أبى محمد بن مامى، ومخلد بن جعفر الباقرحى، وأبى الحسن بن لؤلؤ، وأبى بكر بن اسماعيل الوراق، وأبى الحسين ابن البواب وغيرهم إلا أن كنبى ذهبت. …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 2، ص 450، يذكر الخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 2, p. 450, that mentions the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 2، ص 450 کا اقتباس جس میں خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh Baghdad de al-Khatib al-Baghdadi, volumen 2, pág. 450, que menciona los alfabetos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Tarikh Baghdad d'al-Khatib al-Baghdadi (tome 2, p. 450) mentionne les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Khatib Al-Baghdadi'nin Bağdat Tarihi, Resimli Cilt 2, sayfa 450'den bir alıntı, yazı ve alfabelerden bahsetmektedir; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Baghdad karya Al-Khatib Al-Baghdadi, Jilid 2 Bergambar, halaman 450, menyebutkan tentang aksara dan tulisan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
