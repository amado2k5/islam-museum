text: "أرأيت إذا صليت المكتوبات وصمت رمضان وأحللت الحلال وحرمت الحرام ولم أزد على ذلك شيئاً أأدخل الجنة؟ قال: نعم"
summary:
  ar: "حديث جابر بن عبد الله أن رجلاً سأل رسول الله فقال: «أرأيت إذا صليت المكتوبات وصمت رمضان وأحللت الحلال وحرمت الحرام ولم أزد على ذلك شيئاً أأدخل الجنة؟ قال: نعم» وهو الحديث الثاني والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم في صحيحه من رواية أبي الزبير عن جابر وفيه «والله لا أزيد على ذلك شيئاً» ومن رواية الأعمش عن أبي صالح وأبي سفيان عن جابر، وفيها السائل هو النعمان بن قوقل؛ ويبين ابن رجب أن في تفسير تحليل الحلال وتحريم الحرام قولين: اعتقاد حل الحلال وحرمة الحرام مع اجتنابه، ونُقل عن طائفة منهم الشيخ أبو عمرو بن الصلاح، ويحتمل أن يكون التحليل إتيان الحلال — بمعنى ما ليس بحرام فيدخل فيه الواجب والمستحب والمباح — فلا يتعدى ما أبيح له ويجتنب المحرمات، وإليه ذهب ابن رجب بقوله إن المراد بالتحليل والتحريم فعل الحلال واجتناب الحرام كما ذكر في الحديث؛ وأخرج عن ابن مسعود وابن عباس في قوله تعالى «يتلونه حق تلاوته» [البقرة 121]: يحلون حلاله ويحرمون حرامه، وفي آية النسيء [التوبة 37] أن الكفار كانوا يقاتلون في الشهر الحرام عاماً فيحلونه بذلك، وفي آية المائدة [87–88] نزولها في قوم حرموا طيبات على أنفسهم زهداً بيمين أو تحريم أو مجرد امتناع فسمي الجميع تحريماً، وفي الأمثال «فلان لا يحلل ولا يحرم» لمن لا يمتنع عن حرام ولا يقف عند ما أبيح له؛ والحديث يدل على أن من قام بالواجبات وانتهى عن المحرمات دخل الجنة، وقد تواترت الأحاديث بهذا المعنى كحديث أبي هريرة وأبي سعيد عند النسائي وابن حبان والحاكم «ما من عبد يصلي الصلوات الخمس ويصوم رمضان ويخرج الزكاة ويجتنب الكبائر السبع إلا فتحت له أبواب الجنة يدخل من أيها شاء» ثم تلا «إن تجتنبوا كبائر ما تنهون عنه نكفر عنكم سيئاتكم» [النساء 31] ⁦(جامع العلوم والحكم ص 477–488)⁩."
  en: "The hadith of Jabir ibn Abdullah that a man asked the Messenger of God 'if I pray the prescribed prayers, fast Ramadan, treat the lawful as lawful and the unlawful as unlawful, and add nothing to that, shall I enter Paradise?' and he answered 'yes' — the twenty-second of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim alone through Abu al-Zubayr from Jabir with the addition 'by God I shall add nothing to that', and through al-A'mash from Abu Salih and Abu Sufyan from Jabir in which the questioner is named as al-Nu'man ibn Qawqal; Ibn Rajab records two readings of 'treating lawful and unlawful as such': holding the belief that the lawful is lawful and the unlawful forbidden while avoiding it — transmitted from a group including Shaykh Abu Amr ibn al-Salah — and, plausibly, practising the lawful in the broad sense of whatever is not forbidden, covering obligation, recommendation and permission while not transgressing what is allowed and shunning the forbidden, which is the reading Ibn Rajab adopts, 'acting upon the lawful and avoiding the unlawful as stated in this hadith'; he reports from Ibn Masud and Ibn Abbas on 'they recite it as it should be recited' (al-Baqara 121) that 'they treat its lawful as lawful and its unlawful as unlawful', on the verse of the nasi' (al-Tawba 37) that the unbelievers fought in the sacred month one year and so rendered it lawful by practice, on al-Ma'ida 87–88 that it descended about people who forbade wholesome things to themselves in asceticism — by oath, self-prohibition or mere abstention — all termed 'forbidding', and on the proverb 'so-and-so neither permits nor forbids' for one who does not refrain from the forbidden nor stop at what is allowed; the hadith shows that whoever performs the obligations and refrains from the forbidden enters Paradise, a meaning mass-transmitted in such reports as the Abu Hurayra–Abu Sa'id hadith in al-Nasa'i, Ibn Hibban and al-Hakim — 'no servant prays the five prayers, fasts Ramadan, pays the zakat and avoids the seven enormities without the gates of Paradise being opened for him' — followed by 'if you avoid the enormities of what you are forbidden We shall acquit you of your evil deeds' (al-Nisa 31) (Jami' al-Ulum wal-Hikam pp. 477–488)."
  es: "El hadiz de Jabir ibn Abdullah que un hombre preguntó al Mensajero de Dios 'si rezo las oraciones prescritas, ayuno Ramadán, trato lo lícito como lícito y lo ilícito como ilícito, y no agrego nada a eso, ¿entraré en el Paraíso?' y él respondió 'sí' - el vigésimo segundo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Muslim solamente a través de Abu al-Zubayr de Jabir con la adición 'por Dios no agregaré nada a eso', y a través de al-A'mash de Abu Salih y Abu Sufyan de Jabir en el que el que pregunta es nombrado como al-Nu'man ibn Qawqal; Ibn Rajab registra dos lecturas de \"tratar lo lícito y lo ilícito como tales\": sostener la creencia de que lo lícito es lícito y lo ilícito prohibido, evitándolo —transmitido por un grupo que incluye al Shaykh Abu Amr ibn al-Salah— y, plausiblemente, practicar lo lícito en el sentido amplio de todo lo que no está prohibido, abarcando la obligación, la recomendación y el permiso, sin transgredir lo permitido y evitando lo prohibido, que es la lectura que adopta Ibn Rajab, \"actuar conforme a lo lícito y evitar lo ilícito como se afirma en este hadiz\"; informa de Ibn Masud e Ibn Abbas sobre 'lo recitan como debe ser recitado' (al-Baqara 121) que 'tratan lo lícito como lícito y lo ilícito como ilícito', sobre el versículo del nasi' (al-Tawba 37) que los incrédulos lucharon en el mes sagrado un año y así lo hicieron lícito por la práctica, sobre al-Ma'ida 87-88 que descendió acerca de las personas que se prohibieron cosas saludables a sí mismas en el ascetismo —por juramento, autoprohibición o mera abstención— todo lo cual se denomina 'prohibición', y sobre el proverbio 'tal persona ni permite ni prohíbe' para aquel que no se abstiene de lo prohibido ni se detiene en lo permitido; El hadiz muestra que quien cumple con las obligaciones y se abstiene de lo prohibido entra en el Paraíso, un significado transmitido masivamente en informes como el hadiz de Abu Hurayra-Abu Sa'id en al-Nasa'i, Ibn Hibban y al-Hakim: \"ningún siervo reza las cinco oraciones, ayuna en Ramadán, paga el zakat y evita las siete enormidades sin que se le abran las puertas del Paraíso\", seguido de \"si evitas las enormidades de lo que te está prohibido, te absolveremos de tus malas acciones\" (al-Nisa 31) (Jami' al-Ulum wal-Hikam pp. 477-488)."
  fr: "Le hadith de Jabir ibn Abdullah selon lequel un homme demanda au Messager de Dieu: « Si je prie les prières prescrites, que je jeûne le Ramadan, que je considère le licite comme licite et l'illicite comme illicite, et que je n'y ajoute rien, entrerai-je au Paradis ? » et il répondit « oui » — le vingt-deuxième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Muslim seul par Abu al-Zubayr de Jabir avec l'ajout « par Dieu, je n'y ajouterai rien », et par al-A'mash d'Abu Salih et Abu Sufyan de Jabir dans lequel le questionneur est nommé al-Nu'man ibn Qawqal; Ibn Rajab rapporte deux lectures de « traiter le licite et l’illicite comme tels »: la croyance que le licite est licite et l’illicite interdit tout en l’évitant — transmise par un groupe comprenant le cheikh Abu Amr ibn al-Salah — et, vraisemblablement, la pratique du licite au sens large de tout ce qui n’est pas interdit, couvrant l’obligation, la recommandation et la permission tout en ne transgressant pas ce qui est permis et en évitant l’interdit, qui est la lecture adoptée par Ibn Rajab, « agir selon le licite et éviter l’illicite comme indiqué dans ce hadith »; Il rapporte d'Ibn Masud et d'Ibn Abbas sur « ils le récitent comme il se doit » (al-Baqara 121) qu'« ils traitent ce qui est licite comme licite et ce qui est illicite comme illicite », sur le verset du nasi' (al-Tawba 37) que les mécréants se sont battus pendant le mois sacré une année et l'ont ainsi rendu licite par la pratique, sur al-Ma'ida 87-88 qu'il est descendu sur les gens qui s'interdisaient des choses saines dans l'ascétisme — par serment, auto-interdiction ou simple abstention — tout cela étant qualifié d'« interdit », et sur le proverbe « untel ne permet ni n'interdit » pour celui qui ne s'abstient pas de l'interdit et ne s'arrête pas à ce qui est permis; Le hadith montre que quiconque accomplit ses obligations et s'abstient de ce qui est interdit entre au Paradis, une signification largement transmise dans des rapports tels que le hadith d'Abu Hurayra-Abu Sa'id dans al-Nasa'i, Ibn Hibban et al-Hakim — « aucun serviteur ne prie les cinq prières, ne jeûne le Ramadan, ne paie la zakat et n'évite les sept anormités sans que les portes du Paradis ne lui soient ouvertes » — suivi de « si vous évitez les anormités de ce qui vous est interdit, Nous vous absoudrons de vos mauvaises actions » (an-Nisa 31) (Jami' al-Ulum wal-Hikam pp. 477-488)."
  ur: "جابر بن عبداللہ سے روایت ہے کہ ایک شخص نے رسول اللہ سے پوچھا کہ اگر میں فرض نمازیں پڑھوں، رمضان کے روزے رکھوں، حلال کو حلال اور حرام کو حرام سمجھوں اور اس میں کچھ اضافہ نہ کروں تو کیا میں جنت میں داخل ہو جاؤں گا؟ اور اس نے جواب دیا 'ہاں' - النووی کی چالیس اور ابن رجب کی تفسیر کا بائیسواں؛ صرف مسلم کی طرف سے ابو الزبیر کے ذریعے جابر سے 'خدا کی قسم میں اس میں کچھ اضافہ نہیں کروں گا' کے ذریعے منتقل کیا گیا ہے، اور العمش کے ذریعے ابو صالح اور ابو سفیان جابر سے جس میں سائل کا نام النعمان بن قوقل ہے؛ ابن رجب نے 'حلال اور حرام کو اس طرح سمجھنا' کے دو اقوال درج کیے ہیں: حلال کو حلال اور حرام کو حرام ہونے کا عقیدہ رکھنا - جس میں شیخ ابو عمرو بن الصلاح بھی شامل ہیں - اور غالباً، حلال پر عمل کرتے ہوئے وسیع معنوں میں حلال پر عمل کرتے ہوئے، جس چیز کی سفارش نہیں کی گئی ہے، جائز نہیں ہے۔ حلال پر عمل کرنا اور حرام سے اجتناب کرنا جیسا کہ اس حدیث میں بیان کیا گیا ہے۔ وہ ابن مسعود اور ابن عباس سے روایت کرتے ہیں کہ 'وہ اس کو اسی طرح پڑھتے ہیں جیسا کہ اسے پڑھا جانا چاہیے' ⁦(البقرہ 121)⁩ کہ 'وہ اس کے حلال کو حلال اور اس کے حرام کو حرام سمجھتے ہیں'، آیت ناسی ⁦(التوبہ 37)⁩ پر کہ کافروں نے اس میں جہاد کیا اور ایک سال ماہ مقدس میں اس پر عمل کیا۔ 87-88 کہ یہ ان لوگوں کے بارے میں نازل ہوا جنہوں نے اپنے آپ پر تندرست چیزوں کو حرام کیا تھا - قسم، خود ممانعت یا محض پرہیز کے ذریعہ - سب کو 'حرام' کہا جاتا ہے، اور کہاوت پر 'فلاں نہ اجازت دیتا ہے نہ منع کرتا ہے' جو حرام سے باز نہیں آتا اس کے لیے جائز نہیں ہے۔ حدیث سے معلوم ہوتا ہے کہ جو فرض ادا کرتا ہے اور حرام سے اجتناب کرتا ہے وہ جنت میں داخل ہوتا ہے، جس کا مطلب یہ ہے کہ ابو ہریرہ، ابو سعید نے نسائی، ابن حبان اور الحکیم کی حدیثوں میں نقل کیا ہے کہ کوئی بندہ پانچوں نمازیں نہیں پڑھتا، رمضان کے روزے رکھتا ہے، اور ساتوں کی زکوٰۃ ادا کیے بغیر نہیں رکھتا۔ اس کے لیے کھول دیا گیا - اس کے بعد 'اگر تم ان چیزوں سے پرہیز کرو گے جن سے تمہیں منع کیا گیا ہے تو ہم تمہاری برائیوں سے بری ہو جائیں گے' ⁦(النساء 31)⁩ ⁦(جامع العلوم والحکم صفحہ 477-488)⁩۔"
  tr: "Cabir ibn Abdullah'ın hadisinde, bir adamın Allah'ın Resulü'ne şöyle sorduğu rivayet edilir: \"Eğer farz namazları kılarsam, Ramazan orucunu tutarsam, helal olanı helal, haram olanı haram kılarsam ve bunlara hiçbir şey eklemezsem, cennete girer miyim?\" Resulullah şöyle buyurmuştur: \"Evet.\" Bu, Nevevi'nin Kırk Hadisi'nde ve İbn Receb'in tefsirinde yirmi ikinci hadistir. Müslim, Sahih'inde Ebu el-Zübeyr'den, Cabir'den rivayet etmiş ve hadiste \"Allah'a yemin ederim ki, buna hiçbir şey eklemem.\" demiştir. Ayrıca el-A'maş, Ebu Salih'ten ve Ebu Sufyan da Cabir'den rivayet etmiş ve burada soruyu soran kişi el-Nu'man ibn Kavkal'dır. İbn Receb, helal olanı helal, haram olanı haram kılma konusunda iki görüş olduğunu açıklamıştır: helal olanın helal olduğuna ve haram olanın haram olduğuna inanmak ve ondan kaçınmak. Bu, Şeyh Ebu Amr ibn el-Salah da dahil olmak üzere bir grup tarafından rivayet edilmiştir. Helal saymak, helal olanı yapmak, yani haram olmayan, farz olan, tavsiye edilen ve izin verilen şeyleri yapmak anlamına gelebilir; dolayısıyla izin verilenin dışına çıkılmaz ve haram olandan kaçınılır. İbn Receb bu görüşü benimseyerek, hadiste belirtildiği gibi, helal saymak ve haram kılmakla kastedilenin helal olanı yapmak ve haram olandan kaçınmak olduğunu söylemiştir. İbn Mesud ve İbn Abbas'tan, Yüce Allah'ın \"Onu gerektiği gibi okurlar\" [Bakara 121] ayeti hakkında şöyle rivayet edilmiştir: \"Onun helal kıldığını helal, onun haram kıldığını haram kılarlar.\" Ve araya giren ayette [Tevbe 37], kâfirlerin mübarek ayda bir yıl boyunca savaştıkları, böylece onu helal kıldıkları söylenmektedir. Maide Suresi'nin [87-88] ayetinde, kendileri için iyi şeyleri haram kılan, yemin ederek, yasaklayarak veya sadece sakınarak bunu yapan bir topluluktan bahsedilmiştir; bu yüzden bunların hepsine yasak denmiştir. Atasözlerinde ise, \"Filanca ne helal kılar ne de haram kılar\" denmektedir; çünkü haram olandan da sakınmaz, helal olandan da uzak durmaz. Hadis, farzları yerine getiren ve haram olanlardan uzak duranın cennete gireceğini belirtir. Bu anlamda birçok hadis vardır; örneğin, Nesai, İbn Hibban ve Hakim tarafından rivayet edilen Ebu Hurayra ve Ebu Said hadisi: \"Beş vakit namazı kılan, Ramazan orucunu tutan, zekât veren ve yedi büyük günahtan sakınan hiçbir kul yoktur ki, cennetin kapıları ona açılmasın ve dilediği kapıdan girsin.\" Sonra şu ayeti okudu: “Eğer size haram kılınan büyük günahlardan sakınırsanız, biz de sizden küçük günahlarınızı gideririz.” [Nisa Suresi 31] (Cami’ el-Ulum ve el-Hikam, s. 477–488)."
  id: "Hadits Jabir bin Abdullah menyatakan bahwa seorang pria bertanya kepada Rasulullah, katanya: “Bagaimana jika aku mengerjakan salat wajib, berpuasa Ramadhan, memhalalkan apa yang halal dan mengharamkan apa yang haram, dan tidak menambahkan apa pun kepada itu, apakah aku akan masuk surga?” Beliau menjawab: “Ya.” Ini adalah hadits ke-22 dalam Empat Puluh Hadits Nawawi dan dalam tafsir Ibnu Rajab. Hadits ini diriwayatkan oleh Muslim dalam Shahihnya dari riwayat Abu al-Zubayr dari Jabir, dan di dalamnya, “Demi Allah, aku tidak akan menambahkan apa pun kepada itu.” Hadits ini juga diriwayatkan oleh al-A’mash dari Abu Salih dan Abu Sufyan dari Jabir, dan di dalamnya, penanya adalah al-Nu’man bin Qawqal. Ibn Rajab menjelaskan bahwa ada dua pendapat mengenai penafsiran tentang memhalalkan apa yang halal dan mengharamkan apa yang haram: meyakini kebolehan yang halal dan mengharamkan yang haram sambil menghindarinya. Hal ini diriwayatkan dari sekelompok ulama, termasuk Syekh Abu Amr ibn al-Salah. Ada kemungkinan bahwa memhalalkan berarti melakukan apa yang halal—yaitu apa yang tidak haram, yang meliputi yang wajib, yang dianjurkan, dan yang diperbolehkan—sehingga seseorang tidak melampaui apa yang diperbolehkan dan menghindari yang dilarang. Ibn Rajab menganut pandangan ini, dengan mengatakan bahwa yang dimaksud dengan memhalalkan dan mengharamkan adalah melakukan apa yang halal dan menghindari apa yang haram, sebagaimana disebutkan dalam hadits. Diriwayatkan dari Ibn Masoud dan Ibn Abbas mengenai firman Allah SWT, “Mereka membacanya sebagaimana mestinya” [Al-Baqarah 121]: Mereka memhalalkan apa yang dihalalkan oleh Allah dan mereka mengharamkan apa yang diharamkan oleh Allah. Dan dalam ayat penambahan bulan [At-Tawbah 37], disebutkan bahwa orang-orang kafir biasa berperang di bulan suci selama setahun, sehingga menjadikannya halal. Dan dalam ayat Al-Maidah [87-88], diturunkan tentang suatu kaum yang mengharamkan hal-hal baik bagi diri mereka sendiri karena asketisme, sumpah, larangan, atau sekadar menjauhi, sehingga semuanya disebut haram. Dan dalam peribahasa, “Si fulan tidak menghalalkan dan tidak mengharamkan,” bagi orang yang tidak menjauhi apa yang haram dan tidak berhenti pada apa yang diperbolehkan baginya. Hadits ini menunjukkan bahwa siapa pun yang melakukan amalan wajib dan menjauhi amalan haram akan masuk surga. Terdapat banyak hadits dengan makna ini, seperti hadits Abu Hurairah dan Abu Saeed, yang diriwayatkan oleh Al-Nasa’i, Ibn Hibban, dan Al-Hakim: “Tidak ada seorang hamba pun yang mengerjakan shalat lima waktu, berpuasa Ramadhan, membayar zakat, dan menghindari tujuh dosa besar melainkan pintu-pintu surga akan terbuka baginya, dan dia boleh masuk melalui pintu mana pun yang dia inginkan.” Kemudian beliau membaca: “Jika kamu menghindari dosa-dosa besar yang diharamkan kepadamu, Kami akan menghapus dosa-dosa kecilmu” [An-Nisa’ 31] (Jami’ al-‘Ulum wa al-Hikam, hlm. 477–488)."
