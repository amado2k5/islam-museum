label: { ar: "الموطأ 547 — أبو هريرة يسجد في سورة الانشقاق ويخبر أن النبي سجد فيها", en: "Muwatta 547" }
summary:
  ar: "أول حديث في باب ما جاء في سجود القرآن. يرويه مالك عن عبد الله بن يزيد مولى الأسود بن سفيان عن أبي سلمة بن عبد الرحمن، أن أبا هريرة قرأ لهم سورة الانشقاق [[passage/quran-84-21|الانشقاق 21]] فسجد فيها، فلما انصرف أخبرهم أن النبي سجد فيها. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي، وعثمان بن عمر عند أحمد والطحاوي، وقتيبة عند النسائي (2/161)، والشافعي عند البيهقي، ومحمد بن الحسن الشيباني (267)، ويحيى بن يحيى النيسابوري عند مسلم (2/88). {cite:muwatta-maruf-1997 p.282} {cite:muwatta-maruf-1997 p.283}"
