label: { ar: "الموطأ 547 — أبو هريرة يسجد في سورة الانشقاق ويخبر أن النبي سجد فيها", en: "Muwatta 547", es: "Muwatta 547", fr: "Muwatta 547", ur: "موطا 547", tr: "El-Muvatta 547 — Ebu Hurayra, El-İnşikak Suresi sırasında secde eder ve Peygamberin de bu sure sırasında secde ettiğini rivayet eder.", id: "Al-Muwatta 547 — Abu Hurairah bersujud saat membaca Surah Al-Inshiqaq dan melaporkan bahwa Nabi juga bersujud saat membacanya." }
summary:
  ar: "أول حديث في باب ما جاء في سجود القرآن. يرويه مالك عن عبد الله بن يزيد مولى الأسود بن سفيان عن أبي سلمة بن عبد الرحمن، أن أبا هريرة قرأ لهم سورة الانشقاق [[passage/quran-84-21|الانشقاق 21]] فسجد فيها، فلما انصرف أخبرهم أن النبي سجد فيها. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي، وعثمان بن عمر عند أحمد والطحاوي، وقتيبة عند النسائي (2/161)، والشافعي عند البيهقي، ومحمد بن الحسن الشيباني (267)، ويحيى بن يحيى النيسابوري عند مسلم (2/88). {cite:muwatta-maruf-1997 p.282} {cite:muwatta-maruf-1997 p.283}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai sujud saat membaca Al-Quran. Diriwayatkan oleh Malik dari Abdullah ibn Yazid, budak yang dibebaskan oleh al-Aswad ibn Sufyan, dari Abu Salamah ibn Abd al-Rahman, bahwa Abu Hurayrah membacakan Surah al-Inshiqaq [[passage/quran-84-21|al-Inshiqaq 21]] kepada mereka dan bersujud selama pembacaan tersebut. Setelah selesai, ia memberitahu mereka bahwa Nabi (shalawat dan salam kepadanya) telah bersujud selama pembacaan tersebut. Redaksi menyebutkan bahwa diriwayatkan dari Malik oleh Abu Mus’ab dan al-Qa’nabi, Utsman bin Umar menurut Ahmad dan al-Tahawi, Qutaybah menurut al-Nasa’i (2/161), al-Syafi’i menurut al-Bayhaqi, Muhammad ibn al-Hasan al-Shaybani (267), dan Yahya ibn Yahya al-Naysaburi menurut Muslim (2/88). {kutip:muwatta-maruf-1997 hal.282} {kutip:muwatta-maruf-1997 hal.283}"
