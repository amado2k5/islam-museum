text: "… ان الروم تد - وافوا فى مراكب كثيرة وجاء قوم منهم عسلى الظهر الى ناحية كيسوم فاستاتوا من المسلمين اكثر من خمسة عشر الف انسان مايين رجل وصى فضوا بهم وأخذوا فيهم قوما من اهل الذمة. وفى هذه السنة كسفت …"
