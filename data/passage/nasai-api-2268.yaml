label: { ar: "سنن النسائي 2268 — الأب والأبوة", en: "Sunan al-Nasa'i 2268 — the father and fatherhood", ur: "سنن نسائی 2268 — باپ اور والدیت" }
text: "… الأَوْزَاعِيِّ، قَالَ حَدَّثَنِي يَحْيَى بْنُ أَبِي كَثِيرٍ، قَالَ حَدَّثَنِي أَبُو قِلاَبَةَ، قَالَ حَدَّثَنِي جَعْفَرُ بْنُ عَمْرِو بْنِ أُمَيَّةَ الضَّمْرِيُّ، عَنْ أَبِيهِ، قَالَ قَدِمْتُ عَلَى رَسُولِ اللَّهِ فَقَالَ لِي رَسُولُ اللَّهِ \" أَلاَ تَنْتَظِرُ الْغَدَاءَ يَا أَبَا أُمَيَّةَ \". قُلْتُ إِنِّي صَائِمٌ. فَقَالَ \" تَعَالَ أُخْبِرْكَ عَنِ الْمُسَافِرِ إِنَّ اللَّهَ وَضَعَ عَنْهُ الصِّيَامَ وَنِصْفَ الصَّلاَةِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2268، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2268 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2268، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
