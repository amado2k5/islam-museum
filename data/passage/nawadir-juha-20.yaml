label: { ar: "نوادر جحا الكبرى، ص 15 — «الخازوق في أسفل الأنبوب»", en: "Nawadir Juha al-Kubra, p. 15 — 'The Stake at the Bottom of the Pipe'", ur: "نوادر جحا الکبریٰ، ص 15 — «نلکی کے نیچے لگی کھونٹی»", fr: "Nawadir Juha al-Kubra, p. 15 — « Le pieu au bas du tuyau »", es: "Nawadir Juha al-Kubra, p. 15 — «La estaca al pie del tubo»", tr: "Juha'nın Muhteşem Fıkraları, s. 15 — “Kazık borunun dibindedir”", id: "Anekdot Hebat Juha, hlm. 15 — “Pasaknya ada di dasar pipa”" }
text: "… الخازوق في أسفل الأنبوب اشتد في بعض أيام الصيف عطشه، وكان عائداً من بلد بعيد، فصادف على قارعة الطريق، أنبوباً مسدوداً بخشبة فاقتلع الخشبة، وسالَ الماء بشدة من الأنبوب، حتى تبلَّلَ من رأسه إلى قدمه، فنظر إلى الأنبوب، وقال: لو …"
summary:
  ar: "سحب مسافر عطشان سدادة خشبية من أنبوب فابتل بالماء، فقال جحا إن من وضع وتدًا أسفله لا بد أن يكون مجنونًا. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  en: "A thirsty traveller pulls a wooden plug from a pipe and gets soaked, and Juha remarks that whoever put a stake under it must be mad. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  ur: "ایک پیاسے مسافر نے نلکی سے لکڑی کی ڈاٹ کھینچی اور بھیگ گیا، تو جحا نے کہا کہ جس نے اس کے نیچے کھونٹی لگائی وہ ضرور پاگل ہوگا۔ {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  fr: "Un voyageur assoiffé arrache un bouchon de bois d'un tuyau et se retrouve trempé ; Juha remarque que celui qui a mis un pieu dessous doit être fou. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  es: "Un viajero sediento arranca un tapón de madera de un tubo y queda empapado; Juha comenta que quien puso una estaca debajo debe de estar loco. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  tr: "Susamış bir yolcu borudan tahta bir tıpa çekti ve ıslandı. Juha, bunun altına bir çivi koyanın deli olması gerektiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 15}"
  id: "Seorang musafir yang haus mencabut sumbat kayu dari pipa dan basah kuyup. Juha berkata bahwa siapa pun yang menaruh pasak di bawahnya pasti gila. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
