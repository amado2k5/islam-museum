label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 869 — القراء، جمع القرآن والمصاحف", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 869 — the readers; the collection of the Qur'an and the codices", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 869 — قراء، جمعِ قرآن اور مصاحف", es: "Al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, escaneo del volumen 1, pág. 869 — los lectores; la colección del Corán y los códices", fr: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 869 — les lecteurs; la collection du Coran et les codex" }
text: "… انهما قالا لاباس بنقط المصاحف واخرج عن ربيعة بن ابي عبد الرحمن انه قال لا باس بشكلها وقال الفوري نقط المصحف وشكله مستحب لانه صيانة له من اللحن والتحريف وقال ابن مجاهد ينبغي ان لا يشكل الا ما يشكل وقال …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 869، يذكر القراء، وجمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 869, that mentions the readers, the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 869 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 1, pág. 869, que menciona a los lectores, la colección del Corán y los códices, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 1, page 869, mentionnant les lecteurs, la compilation du Coran et les codex, ainsi que la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
