summary:
  ar: "القسم 44 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب البيوع»، ويضم فيها النصوص من 4449 إلى 4705 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 44 of Sunan al-Nasa'i (The Book of Financial Transactions) in the division of the open hadith dataset the museum took its reports from: reports 4449 to 4705 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 44، عنوان «کتاب البیوع»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4449 تا 4705۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 44 de Sunan al-Nasa'i (El Libro de las Transacciones Financieras) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4449 al 4705, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre des transactions financières), dans la partie ouverte de la base de données (numérotation des hadiths) correspondant aux hadiths 4449 à 4705. Il classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 44. bölümü \"Satış Kitabı\" başlığını taşımakta olup, 4449 ile 4705 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 44 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Penjualan\" dan berisi teks 4449 hingga 4705, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
