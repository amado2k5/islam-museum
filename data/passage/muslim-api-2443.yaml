label: { ar: "صحيح مسلم 2443 — الأب والأبوة", en: "Sahih Muslim 2443 — the father and fatherhood", ur: "صحیح مسلم 2443 — باپ اور والدیت", es: "Sahih Muslim 2443 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ أَبِي عُمَرَ الْمَكِّيُّ، حَدَّثَنَا سُفْيَانُ، عَنْ عُمَرَ بْنِ سَعِيدِ بْنِ مَسْرُوقٍ، عَنْ أَبِيهِ، عَنْ عَبَايَةَ بْنِ رِفَاعَةَ، عَنْ رَافِعِ بْنِ خَدِيجٍ، قَالَ أَعْطَى رَسُولُ اللَّهِ أَبَا سُفْيَانَ بْنَ حَرْبٍ وَصَفْوَانَ بْنَ أُمَيَّةَ وَعُيَيْنَةَ بْنَ حِصْنٍ وَالأَقْرَعَ بْنَ حَابِسٍ كُلَّ إِنْسَانٍ مِنْهُمْ مِائَةً مِنَ الإِبِلِ وَأَعْطَى عَبَّاسَ بْنَ مِرْدَاسٍ دُونَ ذَلِكَ. فَقَالَ عَبَّاسُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2443، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2443 (The Book of Zakat), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2443، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2443 (El Libro del Zakat), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
