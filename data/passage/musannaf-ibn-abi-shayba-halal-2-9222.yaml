text: "… قال طعمه وريحه خذ العفو قال ما مر به من أخلاق الخاتم ما تظهر المحرمة من الحلي الخاتم والخضاب والكحل تفسير ولا يبدين... الخال وأرث من لا وارث له الخالف أشر الخبز من البر الخبيص حلال ولا يحل لك الأكل …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 9222، يذكر الحلال، وما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 9222, that mentions the lawful, what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
