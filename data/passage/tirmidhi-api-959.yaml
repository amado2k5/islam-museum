label: { ar: "جامع الترمذي 959 — كتابة الحسنات، عمل يعدل عملا أعظم منه", en: "Jami' al-Tirmidhi 959 — the writing of good deeds; a deed that equals a greater one", ur: "جامع ترمذی 959 — نیکیوں کا لکھا جانا، ایک عمل جو بڑے عمل کے برابر ہے", es: "Jami' al-Tirmidhi 959 — el escrito de buenas obras; una obra que equivale a una mayor.", fr: "Jami' al-Tirmidhi 959 — l'écriture des bonnes actions; une action qui en vaut une plus grande", tr: "Cami' el-Tirmizi 959 — İyilikleri yazmak, daha büyük bir amel sayılır.", id: "Jami' al-Tirmidhi 959 — Mencatat amal kebaikan adalah suatu perbuatan yang setara dengan perbuatan yang lebih besar." }
text: "… مِنْ أَصْحَابِ النَّبِيِّ يُزَاحِمُ عَلَيْهِ. فَقَالَ إِنْ أَفْعَلْ فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ مَسْحَهُمَا كَفَّارَةٌ لِلْخَطَايَا \". وَسَمِعْتُهُ يَقُولُ \" مَنْ طَافَ بِهَذَا الْبَيْتِ أُسْبُوعًا فَأَحْصَاهُ كَانَ كَعِتْقِ رَقَبَةٍ \". وَسَمِعْتُهُ يَقُولُ \" لاَ يَضَعُ قَدَمًا وَلاَ يَرْفَعُ أُخْرَى إِلاَّ حَطَّ اللَّهُ عَنْهُ بِهَا خَطِيئَةً وَكَتَبَ لَهُ بِهَا حَسَنَةً \". قَالَ أَبُو عِيسَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 959، يذكر كتابة الحسنات، وعمل يعدل عملا أعظم منه، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 959 (The Book on Hajj), that speaks of the writing of good deeds, a deed that equals a greater one, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 959، جس میں نیکیوں کا لکھا جانا، ایک عمل جو بڑے عمل کے برابر ہے، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 959 (El Libro del Hajj), habla de la inscripción de buenas obras, de una obra que equivale a otra mayor, de las malas obras borradas y de los pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, inscriben, borran o sopesan una obra."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 959 (Le Livre du Hajj), mentionne l'inscription des bonnes actions, l'équivalence d'une bonne action avec une autre plus grande, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pondération des actes."
  tr: "Cami' el-Tirmizi'de 959 numaralı hadis, iyi amellerin kaydedilmesinden, daha büyük bir ameli sayan amellerden, günahların silinmesinden ve zulümlerin ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesini ve amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 959, menyebutkan pencatatan amal kebaikan, suatu amal yang setara dengan amal yang lebih besar, dan penghapusan dosa serta penghapusan pelanggaran. Hadits ini mencakup daftar amal baik dan buruk beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amal kebaikan."
