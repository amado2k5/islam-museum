label: { ar: "جامع الترمذي 959 — كتابة الحسنات، عمل يعدل عملا أعظم منه", en: "Jami' al-Tirmidhi 959 — the writing of good deeds; a deed that equals a greater one", ur: "جامع ترمذی 959 — نیکیوں کا لکھا جانا، ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… مِنْ أَصْحَابِ النَّبِيِّ يُزَاحِمُ عَلَيْهِ. فَقَالَ إِنْ أَفْعَلْ فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ مَسْحَهُمَا كَفَّارَةٌ لِلْخَطَايَا \". وَسَمِعْتُهُ يَقُولُ \" مَنْ طَافَ بِهَذَا الْبَيْتِ أُسْبُوعًا فَأَحْصَاهُ كَانَ كَعِتْقِ رَقَبَةٍ \". وَسَمِعْتُهُ يَقُولُ \" لاَ يَضَعُ قَدَمًا وَلاَ يَرْفَعُ أُخْرَى إِلاَّ حَطَّ اللَّهُ عَنْهُ بِهَا خَطِيئَةً وَكَتَبَ لَهُ بِهَا حَسَنَةً \". قَالَ أَبُو عِيسَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 959، يذكر كتابة الحسنات، وعمل يعدل عملا أعظم منه، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 959 (The Book on Hajj), that speaks of the writing of good deeds, a deed that equals a greater one, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 959، جس میں نیکیوں کا لکھا جانا، ایک عمل جو بڑے عمل کے برابر ہے، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
