label: { ar: "جامع الترمذي 3517 — عمل يعدل عملا أعظم منه", en: "Jami' al-Tirmidhi 3517 — a deed that equals a greater one", ur: "جامع ترمذی 3517 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Jami' al-Tirmidhi 3517 — una acción que equivale a una mayor", fr: "Jami' al-Tirmidhi 3517 — un acte qui en vaut un plus grand", tr: "Cami' el-Tirmizi 3517 — Daha büyük bir amele denk bir amel", id: "Jami' al-Tirmidhi 3517 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… سَلاَّمٍ حَدَّثَهُ عَنْ أَبِي مَالِكٍ الأَشْعَرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ \" الْوُضُوءُ شَطْرُ الإِيمَانِ وَالْحَمْدُ لِلَّهِ تَمْلأُ الْمِيزَانَ وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلآنِ أَوْ تَمْلأُ مَا بَيْنَ السَّمَوَاتِ وَالأَرْضِ وَالصَّلاَةُ نُورٌ وَالصَّدَقَةُ بُرْهَانٌ وَالصَّبْرُ ضِيَاءٌ وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ كُلُّ النَّاسِ يَغْدُو فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3517، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3517 (Chapters on Supplication), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3517، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 3517 (Capítulos sobre la súplica), habla de una acción que equivale a otra mayor. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3517 (Chapitres sur l'invocation), évoque une action qui en vaut une autre, plus grande encore. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui dénombrent, inscrivent, effacent ou évaluent une action."
  tr: "Cami' el-Tirmizi'de 3517 numaralı hadis, daha büyük bir ameli sayan bir ameli zikrediyor. Bu amel, iyi ve kötü ameller listeleriyle birlikte, amelin değerini sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3517, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
