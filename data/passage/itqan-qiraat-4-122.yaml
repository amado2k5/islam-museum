text: "… مجاهد وغيره مراعاة عدد المصاحف استبدلوا من مصحف البحرين واليمن قارئين كمل لهما العدد، فصادف ذلك موافقة العدد الذي ورد الخبر به، فوقع ذلك لمن لم يعرف أصل المسئلة ولم تكن له فطنة، فظن أن المراد بالأحرف السبعة القراءات السبع، …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 4، ص 122، يذكر الأحرف السبعة، وقراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 4, p. 122, that mentions the seven ahruf, the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 4، ص 122 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
