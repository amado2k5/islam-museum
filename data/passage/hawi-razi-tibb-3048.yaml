text: "… جعل منه مع التين الضماد ووضع على الجلد إلى أن يحمر وافق عرق النسا ورم الطحال. وبالجملة فهو الموافق لكل وجع مزمن أن يجتذب شيئاً من عمق البدن إلى خارجه. ومتى تضمد به أبرأ داء الثعلب. وإذا خلط بالعسل أو …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3048، يذكر التداوي بالعسل، والوجع، وأسماء الأمراض، والبرء من العلة، وأعضاء البدن، والجراحة والختان والجبائر، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3048, that mentions honey as a remedy, pain, named diseases, recovery from an ailment, the organs of the body, surgery, circumcision and splints, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3048 کا اقتباس جس میں شہد سے علاج، درد، بیماریوں کے نام، بیماری سے شفایابی، اعضائے بدن، جراحت، ختنہ اور پٹیاں، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 3048, que menciona la miel como remedio, el dolor, enfermedades específicas, la recuperación de una dolencia, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, la enfermedad y su remedio; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 3048, qui mentionne le miel comme remède, la douleur, les maladies nommées, la guérison d'une affection, les organes du corps, la chirurgie, la circoncision et les attelles, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 3048. sayfasından bir bölüm; bal ile tedavi, ağrı, hastalıkların isimleri, hastalıktan iyileşme, vücut parçaları, ameliyat, sünnet, atel ve hastalık konularını ele almaktadır; metin, makineyle okunabilir fotokopi versiyonundan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 3048, yang menyebutkan pengobatan dengan madu, rasa sakit, nama-nama penyakit, pemulihan dari penyakit, bagian tubuh, pembedahan, sunat, bidai, dan penyakit; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
