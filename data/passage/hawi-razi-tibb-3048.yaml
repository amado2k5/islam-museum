  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3048, that mentions honey as a remedy, pain, named diseases, recovery from an ailment, the organs of the body, surgery, circumcision and splints, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3048 کا اقتباس جس میں شہد سے علاج، درد، بیماریوں کے نام، بیماری سے شفایابی، اعضائے بدن، جراحت، ختنہ اور پٹیاں، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
