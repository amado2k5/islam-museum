text: "… جعل منه مع التين الضماد ووضع على الجلد إلى أن يحمر وافق عرق النسا ورم الطحال. وبالجملة فهو الموافق لكل وجع مزمن أن يجتذب شيئاً من عمق البدن إلى خارجه. ومتى تضمد به أبرأ داء الثعلب. وإذا خلط بالعسل أو …"
summary:
