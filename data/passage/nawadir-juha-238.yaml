text: "… اشتريته بنواهُ فهل أرمي شيئاً منه؟ رأتهُ امرأتُهُ يأكلُ تمراً ولا يُخرِجُ نواهُ، فقالت له : ماذا تصنع كأنّ بك تأكل التمر بنواهُ؟ لقال لها: طبعاً آكلَهُ بنواهُ، لأنّ البائع وزنَهُ مع النوى، ولو أخرج نواهُ لم باعَهُ بسبع باراتٍ، …"
summary:
  ar: "رأت زوجة جحا زوجها يأكل التمر بنواه، فقال إنه اشتراه بنواه لأن البائع وزنه معها، فلن يرمي ما دفع ثمنه. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  en: "Juha's wife sees him eat dates with their pits, and he says he bought them with the pits, since the seller weighed them together, so he will not throw away what he paid for. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  ur: "جحا کی بیوی اسے گٹھلیوں سمیت کھجوریں کھاتے دیکھتی ہے تو وہ کہتا ہے کہ اس نے انہیں گٹھلیوں سمیت خریدا ہے کیونکہ بیچنے والے نے انہیں گٹھلیوں کے ساتھ تولا تھا، اس لیے وہ اس چیز کو نہیں پھینکے گا جس کی اس نے قیمت دی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  fr: "La femme de Juha le voit manger des dattes avec leurs noyaux, et il dit qu'il les a achetées avec les noyaux, puisque le vendeur les a pesées ensemble, et qu'il ne jettera donc pas ce qu'il a payé. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  es: "La esposa de Juha lo ve comer dátiles con sus huesos, y él dice que los compró con los huesos, porque el vendedor los pesó juntos, así que no tirará lo que pagó. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  tr: "Juha'nın karısı onu çekirdekleriyle birlikte hurma yerken gördü, bu yüzden Juha, satıcının hurmaları onunla birlikte tarttığını ve parasını ödediği şeyi atmak istemediğini, bu yüzden çekirdekleriyle birlikte aldığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 115}"
  id: "Istri Juha melihatnya makan kurma beserta bijinya, jadi dia berkata bahwa dia membelinya beserta bijinya karena penjual menimbangnya bersama istrinya, dan dia tidak akan membuang apa yang telah dia bayar. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
