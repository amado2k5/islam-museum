  تعسلم أنه لاطيرالا على متطير وهو النبور بلى شيّ يوافق بعض شئ أسايينا وباطه كثير
  قال ابن السكيت بقال طائر اللّٰه لاطاترك ولا تقل طير اللّٰه وأرض مطارة كثيرة الطير
  وذوالمطارة جبل وبتر مطارة واسعة الفم قال المشاعر
  كأن حفيفها اذير كوها * هوى الريح فى حفر مطار
  وقواه-م كان على رؤسهم الطيراذ اسكنوا من هيبة وأصله أنّ الغراب يقع على رأس البعير
  فيلتقط منه الحملة والجنانة فلا يحرّك البعيرر أسه لثلاينة رعنه الغراب وطار يطير طبرورة
  وطير انا وأطاره غيره وطيره وطايره بمعنى ومن أمثالهم فى انخصب وكثرة اخير قولهم هم فى شئ
  لا يطير غرابه ويقال أطير الغراب فه ومطار قال النسابغة
  وارهط حتزاب وقتسورة ,، فى المجدليس غواجم إعطار
  وفى فلان طيرة وطيرورة أى خفة وطيش قال الكميت
  وحلك عزاذا ماحلت • وطيرتك الصاب والحنظل
  ومتسه قواهم ازجراحناء طيرك أى جوانب خفتك وطيشك وتطاير الشئء تفرق وتعاير
  الشئ طال وفى الحديت خدّما تطاير من شعرك واستطار الفحر وغيره انتشر واستطبر
  الشئ أى طير وقال الراحز اذا الغبار المستطار اتعقا * وتطيرت من الشئ وبالشئ والاسم
  منه الطيرة مثال العتبة وهو ما يتشاءم به من الفسال الردىء وفى الحديث انه كان يحب
  الفأل وبكره الطيرة وقوله تعالى قالوا اطيرنابك أصلد تطير نافأدغمت التاء فى الطاء
  واجتليت الالف ليصح الابتداء بها والمطير من العود المطرى مقلوب منه قال
  اذا مامشت نادى بما فى بيابها • ذكى الشذى والمندلى المطير
  وظؤورة أبوذ يدطاءرت مظاءرة اذا اتخذت ظئرا وظأرت واظأرت لولدى ظراوهوافتعات
  والقول فيه كالقول فى اظلم قال وظأرت الناقة ظأرا وهى ناقة مطؤورة اذاعطفتها على
  ولد غيرها وفى المثل الطعن يظاره أى يعطفه على الصلح وظأرت الناقة أيضا اذاعطفت
  على البق يتعدى ولا يتعدى فهى ظؤور وقديوصف بالظؤار الاثافى لتعطقها على الرماد
  والظئار أن تعالج الناقة بالغمامة فى أنفها الكى تظأر وفى حديث ابن عمررضى اللّٰه عنه
  انه اشترى تاقة فرأى بهاتشريم الظئاررتها رر). الظرر عجرله حد كد السكين
  والجمع ظرار مشل رطب ورطاب وريع ورياع وظران أيضامثل صرد وصردان قال لبيد
  مجسرة تنجل الظران ناجية • اذا نوقد فى الديمومة الظرر
  وأرض مفارّة بفتح الميم والظاءذات ظرّان والظر يرتعت للمكان الحزن وبهعه أظرّة وظرّان
  مثل رغيف وأرغفة ورغفان ⁦(ظفر)⁩ الظفر بمعه أظفار وأظفور وأظافيرابن السكيت
  بقال رجل أظفر بين الظفراذا كان طويل الاظفار كماتقول رجسل أشعر الطويل الشهر
  والظفر فى السية ماوراءمعة دالوزر الى طرف القوس ويقال الممهيز هو كليل الظفر والإظفار
  كبار القردان وكواكب ص-قار والقرة بالتحريك جليدة تغشى العين فاتئة من الجانب
