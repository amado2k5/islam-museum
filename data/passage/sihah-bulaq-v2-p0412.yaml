text: |-
  ١٧٥
  اهم يوم القيامة حلا أى وزراوحلت المرأة والشجرة ح_لا ومنه قوله تعالى حلت سملا
  خفيفا قال ابن السكيت الحمل ما كان فى بطن أوء-لى رأس شجرة والحمل بالكسر
  ما كان عسلى ظهرأ ورأس يقال امرأة حامل وحاملة اذا كانت حب-لى فن قال حامل قال
  هذانعت لا يكون الاللاناث ومن قال حاملة بناه على حلت فهى حاملة وأنشد للشيبانى
  ع-رو بن حسان
  تخضت المنون له يوم * أنى ولسكل حاملة تمام
  فاذا حلت شيأعلى ظهرها أوعلى رأسها فهى حاملة لا غيرلان الهاء انم تلحق للفرق فأما
  مالا يكون للمذ كرفق داستغنى فيه عن علامة التأنيث فان أتى بمافانما هو على الاصل
  ه-ذاقول أهل الكوفة وأما أهل البصرة فانهم يقزلون هذاغير مستمزلات العرب تقول
  رجل أيم وامرأة أيم ورجل عانس وامر أة عانس مع الاشتراك وقالوا!مرأة مصبية وكابة
  مجرية مع غير الاشتراك قالوا والصواب أن يقال قولهم حامل وطالق وحائض وأشسياه ذلات
  من الصفات التى لاعلامة فيها للتأنيث فاغاهى أوصاف مذكرة وصف بح ، الانات كما أن
  الربعة والراوية والخجأة أوصاف. ونثة وصف بها الذكران وذكرابن دريدآن حل الشجر
  -ه لغتان الفتح والسكسر والحملة بالتحريك جمع الحامل يقال هم حلة العرش وحلة القرآن
  وحل عليه فى الحرب حملة قال أبو زيد يقال حلت على بنى فلان اذا أرّشت بينهم وجل على
  نفسه فى السيرأى جهدها فيه وحلت به حمالة بالفتح أى كفلت وجلت ادلاله واحتملت
  بعنى قال الشاعر
  أدلت فلم أحل وقالت فلم أجب * لعسمرأبيها انى لظ-سلوم
  والحمل البرق والجمع الحلان والحمل أول البروج قال الشاءر
  كااسحل البيض جلالونها • ممح نجاء الحمل الاسول
  والنجاء السحاب نشأ فى نوء الحمل وأحلته أى أعنته على الحل وأحات الناقة فهى محمل
  اذا نزل لبنها من غير حبل وكذلك المرأة واستحملته أى سألته أن يحملى وحلته الرسالة أى
  كافته حلها وتحمل الحالة أى جلها وتحملوا واحتملوابعنى أى ارتحلوا وتحامل عليه أى
  مال وتحامات على نفسى اذا تكافت الشي على مثقة والتحامل قديكون موضعا ومصدرا
  تقول ى المكان هذا متها ملنا وتقول فى المصدر ما فى فلان متحامل أى تحامل ويقال ما على
  فلان محمل مثال عجلس أى معتمد والححمل أيضا واحد محامل الحاج والمجمل مثال المرجل علاقة
  السيف وهو السير الذى يقلده المتقلد وقد سمى ذوالرقة عرق الشجر بذلك وهو على القشبيه
  فقمال * يثرن الكباب الجعد عن متن محمل • والمالة بالفتح ما تتحمله عن القوم من الدية
  أوالغرامة والجمالة بالكمراسم فرس اطليحة الاسدى وقال يذكرها
  عويت لهم صدر الحالة انها • معاودة قيل البكماة نزال
  والحمالة أيضا علاقة السيف مثل المحمل والمع الحمائل هذاقول الخليل وقال الاصعىّ حائل
  السيف لا واحدلها من لفظها واناواحدها محمل والحمولة بالفتح الابل التى تحمل وكذلك
  كل ما احتمل عايه الحىّ من حار أ وغيره سواء كانت عليه الاحمال أولم تكن وفعول تدخله
  الكاب بالضم ما تكيبَ من الرمل"
  أى تجعد قاله المؤلف اه
