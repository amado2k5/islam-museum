  واحدة الوضائع وهي أثقال القوم ويقال أين خلفوا وضائعهم والوضيعة أيضائحو
  وضائع كسرى كان ينقل قوما من أرض فيسكنهم أرضا أخرى وهمالشحن والمسالح
  والوضيع أن يؤخذالتم ر قبل أن ييبس فيوضع فى الجرار وتقول وضعت عندفلان وضيعا
  أى استودعته وديعة والوضيح أيضا الدنمن الناس ويقال فى حبه ضعة وضعة
  والهاءعوض من الواد والمواضعة المراهنة والمواضعة متاركة البيع وواضعته فى الاحر
  اذا وافقته فيه على:ى والضعة شجر من الحض هذا اذا جعلت الها عوضامن الواوالذاهبة
  من أوله فاما ان كأنت من آخره فهو من باب المعتمل يقال ناقة واضعة للتى ترعاها ونوق
  واضعات قال أبو زيدان رعت الحمض حول الماء ولم تبرح قيل وضعت تضع وضيعة فهى
  واضعة قال وكذلك وضعتها أنا وهى.وضوعة يتعدى ولا يتعدى وهؤلا. أصحاب الوضيعة
  أى أصحاب حض مقيمون فيه ووضعت المرأة خمارها وامرأة واضع أى لا خمار عليها ووضعت
  المرأة وضعا بالفتح أى ولدت ووضعت وضعا بالضم أى حلت فى آخرطهرها من مقبل الحيضة
  فهى واضع عن ابن السكيت يقال ماحلته أمه وضعا وتضعا أيضا وتضعا قال الرابز
  تقول والجرذان فيها مكتنع • أماتخاف حبلا على تضع
  ووضع البعير وغيره أى أسرع فى سيره وقال د ريد
  باليتنى فيهاجذع • أخب فيها وأضع
