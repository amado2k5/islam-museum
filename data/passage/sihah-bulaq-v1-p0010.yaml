  موضوعهازول ومرفوعها • كرّصوب بلب وسط ريح
  وأوضعه راكبه وأنشد أبو عمرو
  إن دليماقد ألاح من أبى * وقال أنزاف فلا ايضاع بى
  أى لا أقدر على أن أسير قال اليزيدى يقسال وضع الرجل فى تجارته وأوضع على مالم يسم فاءله
  وضافيه-ما أى خسر يقال وضعت فى تجارتك فأنت موضوع فيها ووضع الرجل بالضم
  يوضع ضعة وضعة أى صاروضيعا ووضع منه فلان أى حط من درجته والتواضع التذلل
  والاتضاع أن تخفض رأس البعير لتضع قدمك على عنم فتركب قال الكميت
  اذا اتضعونا كارهين لبيعة • أناخو الاخرى والازمة تجذب
  والتوضيع خياطة الجبة بعد وضع القطن ورجل موضع أى مطارّح لير؟ستحكم اللخاق
  ⁦( وعع)⁩ خطيب وعوع وهو نعت حسسن والوءوعة صوت الدئب ومهذاروعواع وهو
  نعت قبيح وسمعت وعواع الناس أى ضحتهم والوء واع أيذا جاعة الناس ومنه قول الشاءر
  وعاث فى كبة الوعواع والعير ⁦(وفع)⁩ ابن السكيت عن أبى عمروقال قال الطائى
  الوفيعة مثل السلة تتخذمن العراجين والدوص ولا تقله بالقاف ⁦(وقع)⁩ الوقعة صدمة
