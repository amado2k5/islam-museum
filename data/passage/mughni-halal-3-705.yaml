text: "… طَيْرِهِ، وَإِنَّمَا إقَامَتُهُ فِي الْبَحْرِ لِطَلْبِ الرَّزْقِ، وَالْمَعِيشَةِ مِنْهُ، كَالصّيَّادٍ. فَإِنْ كَانَ جِنْسٌ مِنْ الْحَيَوَانِ، نَرْعَ مِنْهُ فِي الْبَحْرِ وَنَوْعَ فِي الْبَرْ، كَالشَّلَحْفَاةٍ، فَلِكُلَ نَوْعِ حُكْمُ نَفْسيهٍ، مَسألَةً قَال: وَصَيْدُ الْحَرَمِ حَرَامٌ عَلَى الْحَلالِ وَالْمُحْرِمِ. الأَصْلُ فِي تَحْرِيمِ صَيْدِ الْحَرَمِ …"
summary:
