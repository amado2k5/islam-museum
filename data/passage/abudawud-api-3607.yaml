label: { ar: "سنن أبي داود 3607 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 3607 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 3607 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى بْنِ فَارِسٍ، أَنَّ الْحَكَمَ بْنَ نَافِعٍ، حَدَّثَهُمْ أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، عَنْ عُمَارَةَ بْنِ خُزَيْمَةَ، أَنَّ عَمَّهُ، حَدَّثَهُ وَهُوَ، مِنْ أَصْحَابِ النَّبِيِّ أَنَّ النَّبِيَّ ابْتَاعَ فَرَسًا مِنْ أَعْرَابِيٍّ فَاسْتَتْبَعَهُ النَّبِيُّ لِيَقْضِيَهُ ثَمَنَ فَرَسِهِ فَأَسْرَعَ رَسُولُ اللَّهِ الْمَشْىَ وَأَبْطَأَ الأَعْرَابِيُّ فَطَفِقَ رِجَالٌ يَعْتَرِضُونَ الأَعْرَابِيَّ فَيُسَاوِمُونَهُ بِالْفَرَسِ وَلاَ يَشْعُرُونَ أَنَّ النَّبِيَّ ابْتَاعَهُ فَنَادَى …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3607، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3607 (The Office of the Judge (Kitab Al-Aqdiyah)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 3607، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
