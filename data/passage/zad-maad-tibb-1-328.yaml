text: "وَذَاكَ دَوَاءُ الدَّاءِ مِنْ شَرّ مَحجُوبٍ الله خَيْراً، فَقَدْ أبلَغَ في الثَّناءِ صحيح: الترمدي:. وقال أ : لا يَزالُ النَّاسُ يَتَسَاءلونَ حَتَّى يقول قائِلُهم : هذا الله خَلَقَ الخَلْقَ، فَمَنْ خَلَقَ الله؟ فَمَنْ وَجَدَ مِنْ ذلِكَ شيئاً فَليَسْتَعِذْ باللهِ وَلْيَنْتَهِ …"
