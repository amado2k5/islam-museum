label: { ar: "الموطأ 2726 — معاوية على المنبر ينهى عن القُصة من الشعر: هلكت بنو إسرائيل حين اتخذتها نساؤهم", en: "Muwatta 2726" }
summary:
  ar: "يروي مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف أنه سمع معاوية بن أبي سفيان، عام حج، وهو على المنبر، وتناول قصة من شعر كانت في يد حرسي، يقول: يا أهل المدينة، أين علماؤكم؟ سمعت رسول الله ينهى عن مثل هذه، ويقول: إنما هلكت بنو إسرائيل حين اتخذ هذه نساؤهم. {cite:muwatta-maruf-1997 p.536}"
