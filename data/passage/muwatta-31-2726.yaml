label: { ar: "الموطأ 2726 — معاوية على المنبر ينهى عن القُصة من الشعر: هلكت بنو إسرائيل حين اتخذتها نساؤهم", en: "Muwatta 2726", es: "Muwatta 2726", fr: "Muwatta 2726", ur: "موطا 2726", tr: "El-Muvatta 2726 — Muaviye minberde saç kesmeyi yasaklıyor: “İsrailoğulları, kadınları bu uygulamayı benimseyince helak oldular.”", id: "Al-Muwatta 2726 — Muawiyah, di mimbar, melarang memotong rambut: “Binatang Israel binasa ketika perempuan-perempuan mereka melakukan praktik ini.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف أنه سمع معاوية بن أبي سفيان، عام حج، وهو على المنبر، وتناول قصة من شعر كانت في يد حرسي، يقول: يا أهل المدينة، أين علماؤكم؟ سمعت رسول الله ينهى عن مثل هذه، ويقول: إنما هلكت بنو إسرائيل حين اتخذ هذه نساؤهم. {cite:muwatta-maruf-1997 p.536}"
  tr: "Malik, İbn Şihab'dan, o da Humaid ibn Abdülrahman ibn Avf'tan rivayet ettiğine göre, Hac ibadetini yerine getirdiği yıl Muaviye ibn Ebu Sufyan'ın minberde iken, bir muhafızın elindeki bir tutam saçı alarak şöyle dediğini işitmiştir: \"Ey Medine halkı, alimleriniz nerede? Ben Allah Resulü'nün böyle şeyleri yasakladığını ve şöyle buyurduğunu işittim: 'İsrailoğulları ancak kadınları bu uygulamayı benimsediklerinde helak oldular.'\" {cite:muwatta-maruf-1997 s.536}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Humaid ibn Abd al-Rahman ibn Awf, bahwa ia mendengar Muawiyah ibn Abi Sufyan, pada tahun ia menunaikan ibadah haji, ketika sedang berkhutbah, mengambil sehelai rambut yang ada di tangan seorang penjaga, lalu berkata: “Wahai penduduk Madinah, di manakah para ulama kalian? Aku mendengar Rasulullah melarang hal-hal seperti itu, dan beliau bersabda: ‘Bani Israel hanya binasa ketika perempuan-perempuan mereka melakukan praktik ini.’” {cite:muwatta-maruf-1997 p.536}"
