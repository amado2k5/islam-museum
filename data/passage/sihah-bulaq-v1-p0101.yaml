text: |-
  انظد اه مد
  ٥٤٠١
  ⁦(نضض)⁩
  ⁦( مرض)⁩ المرض السقم وقد مرض فلان وأمرضه اللّٰه قال يعوب يقال أمرض الرجل
  ذا رقع فى ماله العاهة والممراض الرحل السقام ومرّضته تريضا اذاقت عليه فى مرضه
  والتمريض فى الامر التضجيع فيه والتمارض أن يرى من نفسه المرض وليس به وشمس مريضة
  اذا لم تمكن صافية وعين مريضة فيها قتوروأمرض الرجل أى قارب الاصابة فى الرأى قال
  الشاعر ولكن تحت ذاك الشيب حزم * اذا ماظنّ أمرض أوأصابا
  (.ضض أمضى الجرح امضاضا اذا أوجعن وفيه افسة أخرى مضنى الجرح ولم يعرفها
  الأصمعى وقال ثعلب بقال قد أمضى الجرح قال وكان من مضى يقول مضى بغير ألف
  والكمل يعمض العين أى يحرقها وكل بلمول مض أى حار والمضض وجع المصيبة وقد مضضت
  يارجل بالكسرغض مفضاوم ضيضا ومضاضة والمضحصة تحريك الماه فى الفسم ويقال
  ما مضضت عينى بنوم أى مانمت وتضض فى وضوته وتضض الفعاس فى عينه قال الراجز
  وصاحب نبهته لينهضا • اذا الكرى فى عينه تفمضا
  وحض بكسر الميم والضاد كلمة تستعمل بمعنى لا قال الراجز
  سألت هل وصل فقالت مض • ونركت لى رأسم ا بالنغض
  وهى مع ذلات مطعمة فى الاجابة بقال ان فى مض لمطمعا وهو حكاية صوت ⁦( معض )⁩
  معضت من ذلك الامر أمعض معضا ومعضا وامتعضت منه اذاغضبت وشق عليك قال
  الراجز رؤية اذا معض لولايرد المعضا
  ف ل النون بض تبض العرق ينبض ييضا ونبيضا وتيضانا أى تحركك ومنه
  قولهم مابه حبض ولا نيض أى حراك وأنبضت القوس وأنيضت بالوتراذا جذبته ثم أرسلته
  لترث وفى المثل إنساض بغير بوتير والميبض المندف مثل المحبض قال الخليل قدجاء فى بعض
  الشعر المنابض المنادف ⁦(غحهض )⁩ النحض والنحضة اللحم المكتنز كلحم النخذ قال عبيد
  ثم أبرء نحاضها فتراها • ضامر ابعديدنها كالهلال
  وقد نغحض بالضم فهو نحبض أى اكة نزلمه والمرأة تحيضة ونحض على مالم يسم فاعله ذهو
  منوض أى ذهب جه وا نعض مثله وغحضت ما على العظم من اللحم وانصضته أى اعترقته
  وسنان نحبض وقد تحضته أى رققته وهوالمسنّ قال اهر وْالقير بصف الجنب ١
  يبارى شباة الرمح خدّ مزاق * كصفح السنان الصابى النهيض
  ⁦( نضض)⁩ (ض الماء ينض نضيضاسال قليلا قليلا ونضاضة الماء وغيره بقيته ونضاضة ولد
  الرجل أيضا آخرهم يستوى فيه المذكر والمؤنث والتثنية والجمع مثل العجزة والسكبرة وأهل
  الحجازيسمون الدنانير والدراهم النض والناض قال أبو عبيد وانما يسمونه ناضا اذاتحوّل
  عينا بع_دان كان متا عالانه بقال مانض بيدى منه شئ وخدّمانض لك من دين أى تيسر
  وهو يتنض حقه من فلان أى يستنجزه ويأخذمنه الشئ بعد الشئ والنضيض الماء القليل
  والجمع نضاض قال أبوعر والنضيضة المطر القليل والجمع نضائض قال الاسدى
  فى كل عام قطره نضائض ويجمع أيضا على انضة وأنشد الفراء
  وأخوت نجوم الاخذ الاأنضة • انصّة ممل ليس قاطرها يثرى
  اى
