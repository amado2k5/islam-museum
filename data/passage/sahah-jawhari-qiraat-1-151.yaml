text: "… حتَّى انقطع ماؤه. والثامِدُ من البَهْمِ، والإثْمِدُ : حجرٌ يكتحل به. ثِمارٌ مثل جبل وجبال. قال الفراء : وجمع الثّمار ثُمُرٌ، مثل كتاب وكتب. وجمع الثُّمُرِ أَثْمارٌ، مثل عَنق وأعناق. والثُمُرُ أيضًا : المال المُثَمَّرُ، يخفّف ويثقَّل. وقرأ أبو عمرو: …"
summary:
