label: { ar: "جامع الترمذي 1069 — الأب والأبوة", en: "Jami' al-Tirmidhi 1069 — the father and fatherhood", ur: "جامع ترمذی 1069 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1069 — El padre y la paternidad" }
text: "… أَخْبَرَنَا شُعْبَةُ، عَنْ عُثْمَانَ بْنِ عَبْدِ اللَّهِ بْنِ مَوْهَبٍ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ أَبِي قَتَادَةَ، يُحَدِّثُ عَنْ أَبِيهِ، أَنَّ النَّبِيَّ أُتِيَ بِرَجُلٍ لِيُصَلِّيَ عَلَيْهِ فَقَالَ النَّبِيُّ \" صَلُّوا عَلَى صَاحِبِكُمْ فَإِنَّ عَلَيْهِ دَيْنًا \". قَالَ أَبُو قَتَادَةَ هُوَ عَلَىَّ. فَقَالَ رَسُولُ اللَّهِ \" بِالْوَفَاءِ \". قَالَ بِالْوَفَاءِ. فَصَلَّى عَلَيْهِ. قَالَ وَفِي الْبَابِ عَنْ جَابِرٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1069، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1069 (The Book on Jana''iz (Funerals)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1069، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1069 (El Libro de los Funerales), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
