text: "… العلم وحفظ الحاوي الصغير، والجمل للزجاجي، ثم جاور بمكة وتزوج بها، وقرأ الحاوي على قاضيها القاضي نجم الدين الطبري، وسمع الحديث. توفى بمكة في جمادي الآخرة سنة ثمان وستين وسبعمائة، ودفن بمقبرة باب المعلى جوار الفضيل بن عياض. واليافعي نسبة …"
summary:
