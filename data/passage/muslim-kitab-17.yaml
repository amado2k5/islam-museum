  ar: "صحيح مسلم، كتاب الرضاع"
  en: "Sahih Muslim, Book 17: The Book of Suckling"
  ur: "صحیح مسلم، کتاب الرضاع"
  es: "Sahih Muslim, Libro 17: El Libro de la Lactancia"
  fr: "Sahih Muslim, Livre 17: Le Livre de l'allaitement"
summary:
  ar: "القسم 17 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرضاع»، ويضم فيها النصوص من 3568 إلى 3651 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 17 of Sahih Muslim (The Book of Suckling) in the division of the open hadith dataset the museum took its reports from: reports 3568 to 3651 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 17، عنوان «کتاب الرضاع»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3568 تا 3651۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 17 de Sahih Muslim (El Libro de la Lactancia) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 3568 a 3651 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre 17), c'est-à-dire des hadiths 3568 à 3651, dans la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
