text: "… ْأ ُخ لهلق َوو وللأخرى نحملك على ولد البع ير وما أشبهه وأما الكذب الصريح كما فعله نعمان الأنصاري مع عثمان في قصة الضرير إذ قال له إنه نعيمان وكما يعتاده الناس من ملاعبة الحمقى بتغريرهم بأن امرأة قد رغبت …"
summary:
