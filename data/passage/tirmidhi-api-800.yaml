label: { ar: "جامع الترمذي 800 — الأب والأبوة", en: "Jami' al-Tirmidhi 800 — the father and fatherhood", ur: "جامع ترمذی 800 — باپ اور والدیت", es: "Jami' al-Tirmidhi 800 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 800 — le père et la paternité" }
text: "… بْنِ جَعْفَرٍ. وَعَبْدُ اللَّهِ بْنُ جَعْفَرٍ هُوَ ابْنُ نَجِيحٍ وَالِدُ عَلِيِّ بْنِ عَبْدِ اللَّهِ الْمَدِينِيِّ وَكَانَ يَحْيَى بْنُ مَعِينٍ يُضَعِّفُهُ. وَقَدْ ذَهَبَ بَعْضُ أَهْلِ الْعِلْمِ إِلَى هَذَا الْحَدِيثِ وَقَالُوا لِلْمُسَافِرِ أَنْ يُفْطِرَ فِي بَيْتِهِ قَبْلَ أَنْ يَخْرُجَ وَلَيْسَ لَهُ أَنْ يَقْصُرَ الصَّلاَةَ حَتَّى يَخْرُجَ مِنْ جِدَارِ الْمَدِينَةِ أَوِ الْقَرْيَةِ. وَهُوَ قَوْلُ إِسْحَاقَ بْنِ إِبْرَاهِيمَ الْحَنْظَلِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 800، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 800 (The Book on Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 800، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 800 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 800 (Le Livre du jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
