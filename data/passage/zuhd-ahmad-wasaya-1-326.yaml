text: "البحر الرائق إما أبشر يا عدو اللّه بالنار، أو أبشر يا ولي اللّه بالجنة، ومن ثم كان خوف أرباب الألباب. روي أن حذيفة بن اليمان عل عند احتضاره قال لابن مسعود : قم فانظر أي ساعة هي؟ فقام ابن مسعود …"
