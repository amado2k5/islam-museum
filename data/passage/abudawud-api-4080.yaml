label: { ar: "سنن أبي داود 4080 — تربية الأب ووصيته", en: "Sunan Abi Dawud 4080 — the father raising and counselling", ur: "سنن ابی داؤد 4080 — باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 4080 — El padre que cría y aconseja", fr: "Sunan Abi Dawud 4080 — l'éducation et les conseils du père", tr: "Sunan Abi Dawud 4080 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan Abi Dawud 4080 — Didikan dan Wasiat Sang Ayah" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَرِيرٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ نَهَى رَسُولُ اللَّهِ عَنْ لِبْسَتَيْنِ أَنْ يَحْتَبِيَ الرَّجُلُ مُفْضِيًا بِفَرْجِهِ إِلَى السَّمَاءِ وَيَلْبَسَ ثَوْبَهُ وَأَحَدُ جَانِبَيْهِ خَارِجٌ وَيُلْقِي ثَوْبَهُ عَلَى عَاتِقِهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4080، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4080 (Clothing (Kitab Al-Libas)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4080، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4080 (El Libro de la Vestimenta (Kitab Al-Libas)), menciona la crianza y el consejo paternos. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4080 (L'habillement), mentionne le rôle du père dans l'éducation et les conseils. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sünen Ebu Davud'da yer alan 4080 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, \"İslam'da Babalık\" bölümü tarafından Kur'an, Sünnet, Peygamberimizin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4080, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini dikompilasi oleh bagian \"Peran Ayah dalam Islam\", bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
