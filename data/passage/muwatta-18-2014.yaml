label: { ar: "الموطأ 2014 — مالك: فيمن دفع إلى رجل مالا قراضا فهلك بعضه قبل أن يعمل فيه، ثم عمل فيه فربح، فأراد أن يجعل رأس المال بقية المال بعد الذي هلك، لا يقبل قوله، ويجبر رأس المال من ربحه، ثم يقتسمان ما بقي على شرطهما", en: "Muwatta 2014", es: "Muwatta 2014", fr: "Muwatta 2014", ur: "موطا 2014", tr: "El-Muvatta 2014 — Malik: Bir kimse, bir adama kâr paylaşımı ortaklığı (kırad) için para vermiş ve bu paranın bir kısmı yatırım yapılmadan önce kaybedilmiş, daha sonra yatırım yapılmış ve kâr elde edilmişse ve o kişi, kaybedilen kısımdan sonra kalan parayı sermaye yapmak istemişse, bu beyanı kabul edilmez ve sermaye, elde ettiği kârdan karşılanır, daha sonra kalan kısım aralarındaki anlaşmaya göre paylaşılır.", id: "Al-Muwatta 2014 — Malik: Mengenai seseorang yang memberikan uang kepada seorang pria untuk kemitraan bagi hasil (qirad), dan sebagian dari uang itu hilang sebelum diinvestasikan, kemudian diinvestasikan dan diperoleh keuntungan, dan dia ingin menjadikan sisa uang setelah kerugian sebagai modal, maka pernyataannya tidak diterima, dan modal tersebut diganti dari keuntungannya, kemudian mereka membagi sisanya sesuai dengan kesepakatan mereka." }
summary:
  ar: "قال مالك فيمن دفع إلى رجل مالا قراضا، فهلك بعضه قبل أن يعمل فيه، ثم عمل فيه فربح، فأراد أن يجعل رأس المال بقية المال بعد الذي هلك قبل أن يعمل فيه، قال مالك: لا يقبل قوله، ويجبر رأس المال من ربحه. ثم يقتسمان ما بقي بعد رأس المال على شرطهما من القراض. {cite:muwatta-maruf-1997 p.223}"
  tr: "Malik, bir başkasına kâr paylaşımı ortaklığı (kırad) için para veren ve bu paranın bir kısmı yatırım yapılmadan önce kaybedilen, daha sonra yatırım yapılıp kâr elde edilen ve zarardan sonra kalan sermayeyi geri almak isteyen bir kişi hakkında şöyle demiştir: Malik şöyle buyurmuştur: Talebi kabul edilmez ve sermaye, kârdan karşılanır. Daha sonra, sermayeden sonra kalan kısım, kâr paylaşımı anlaşmalarına göre paylaşılır. {cite:muwatta-maruf-1997 s.223}"
  id: "Malik berkata mengenai seseorang yang memberikan uang kepada orang lain untuk persekutuan bagi hasil (qirad), dan sebagian dari uang itu hilang sebelum diinvestasikan, kemudian diinvestasikan dan menghasilkan keuntungan, dan dia ingin mendapatkan kembali sisa modal setelah kerugian tersebut, Malik berkata: Klaimnya tidak diterima, dan modal tersebut diganti dari keuntungan. Kemudian mereka membagi sisa setelah modal sesuai dengan kesepakatan mereka untuk persekutuan bagi hasil. {cite:muwatta-maruf-1997 p.223}"
