summary:
  ar: "قال مالك فيمن دفع إلى رجل مالا قراضا، فهلك بعضه قبل أن يعمل فيه، ثم عمل فيه فربح، فأراد أن يجعل رأس المال بقية المال بعد الذي هلك قبل أن يعمل فيه، قال مالك: لا يقبل قوله، ويجبر رأس المال من ربحه. ثم يقتسمان ما بقي بعد رأس المال على شرطهما من القراض. {cite:muwatta-maruf-1997 p.223}"
