text: "… ابحثي لها عن شاب جاءتهُ إحدى جاراته، وقالت له: يا شيخي أنت تعلم أنَّ أبنتي معتوهةٌ، فأرجو أن تقرأ لها سورةً أو تكتب لها حجاباً لأنَّها أحياناً تضربني. فقال لها الشيخ: أيَّتُها السيدة، إنَّ قراءة رجل مُسِنّ مثلي لا تُفيدُها، …"
summary:
  ar: "طلبت جارة من جحا أن يدعو لابنتها المختلة عقلياً، فقال لها أن تبحث لها عن شاب في الخامسة والعشرين أو الثلاثين، فالأولاد يجعلونها عاقلة. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  en: "A neighbour asks Juha to pray for her mentally impaired daughter; he says to find her a young man of about twenty-five or thirty, since children will make her sensible. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  ur: "ایک پڑوسن نے جحا سے کہا کہ اس کی ذہنی طور پر معذور بیٹی کے لیے دعا کرے، تو اس نے کہا کہ اس کے لیے پچیس یا تیس سال کا کوئی جوان ڈھونڈو، کیونکہ بچے اسے سمجھ دار بنا دیں گے۔ {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  fr: "Une voisine demande à Juha de prier pour sa fille déficiente mentale ; il lui dit de lui trouver un jeune homme d'environ vingt-cinq ou trente ans, car les enfants la rendront raisonnable. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  es: "Una vecina pide a Juha que rece por su hija con discapacidad mental; él le dice que le busque un joven de unos veinticinco o treinta años, pues los hijos la volverán sensata. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  tr: "Bir komşusu Juha'dan zihinsel engelli kızı için dua etmesini istedi, bunun üzerine Juha ona kızına yirmi beş ya da otuz yaşında genç bir erkek bulmasını söyledi, çünkü erkekler onu aklı başında yaparmış. {cite:juha-nawadir-kubra-djuwaydi s. 151}"
  id: "Seorang tetangga meminta Juha untuk mendoakan putrinya yang mengalami gangguan mental, jadi dia menyuruhnya mencarikan putrinya seorang pria muda berusia dua puluh lima atau tiga puluh tahun, karena anak laki-laki akan membuatnya waras. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
