label:
  ar: "البخاري 7505 — أنا عند ظن عبدي بي وأنا معه إذا ذكرني"
  en: "Bukhari 7505 — I am as My servant thinks of Me, and I am with him when he remembers Me"
  ur: "بخاری 7505 — میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں"
  es: "Bujari 7505 — Yo soy como mi siervo piensa de mí, y estoy con él cuando se acuerda de mí."
  fr: "Bukhari 7505 — Je suis tel que Mon serviteur Me perçoit, et Je suis avec lui lorsqu'il se souvient de Moi"
  tr: "Buhari 7505 — Kulumun beni düşündüğü gibiyim ve beni hatırladığı zaman onunla birlikteyim."
  id: "Bukhari 7505 — Aku adalah sebagaimana hamba-Ku memikirkan-Ku, dan Aku menyertai dia ketika dia mengingat-Ku."
text: "قال الله أنا عند ظن عبدي بي ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7505: أنا عند ظن عبدي بي وأنا معه إذا ذكرني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7505: I am as My servant thinks of Me, and I am with him when he remembers Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7505: میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7505: Yo soy como Mi siervo piensa de Mí, y estoy con él cuando Me recuerda. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih al-Bukhari, n° 7505: « Je suis tel que Mon serviteur Me perçoit, et Je suis avec lui lorsqu’il se souvient de Moi. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 7505: “Aku adalah sebagaimana hamba-Ku memikirkan-Ku, dan Aku menyertai dia ketika dia mengingat-Ku.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan para penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
