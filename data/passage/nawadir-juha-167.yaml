text: "… لم أكمّل بَوْلي بعد دخل يوماً عند العشاء إلى مرحاض أحد الجوامع ليبوّل، وإذا بحنفية المرحاض مفتوحةٌ. فانتظرَ ظنّاً أنَّ بوله لم ينته. فجاء رجل آخر، وانتظر طويلاً، ثم صرخ قائلاً : كأنك نِمْتَ يا هذا؟ فأجابه : لم ينته …"
summary:
  ar: "في ليلة، في مرحاض مسجد، ترك أحدهم الصنبور مفتوحًا، فانتظر رجل ثم صاح أنام فيه، فقال جحا إن بوله لم ينتهِ بعد. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  en: "At night in a mosque lavatory a tap is left running; a man waits, then shouts whether Juha fell asleep; Juha says his urine has not finished. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  ur: "رات کو ایک مسجد کے بیت الخلا میں نل کھلا رہ گیا؛ ایک آدمی انتظار کرتا رہا پھر چلایا کہ کیا سو گئے؟ جحا نے کہا کہ میرا پیشاب ابھی ختم نہیں ہوا۔ {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  fr: "La nuit, dans les latrines d'une mosquée, un robinet reste ouvert; un homme attend, puis crie à Juha s'il s'est endormi; Juha dit que son urine n'est pas encore terminée. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  es: "De noche, en los servicios de una mezquita, queda un grifo abierto; un hombre espera y luego grita si Juha se ha dormido; Juha dice que aún no ha terminado de orinar. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  tr: "Bir gece, bir caminin tuvaletinde biri musluğu açık bırakmıştı. Bir adam bekledi, sonra \"İçinde uyuyorum!\" diye bağırdı. Juha, \"Henüz idrarını bitirmedi.\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 76}"
  id: "Suatu malam, di toilet sebuah masjid, seseorang membiarkan keran air tetap menyala. Seorang pria menunggu, lalu berteriak, \"Aku tidur di situ!\" Juha menjawab, \"Dia belum selesai buang air kecil.\" {cite:juha-nawadir-kubra-djuwaydi p. 76}"
