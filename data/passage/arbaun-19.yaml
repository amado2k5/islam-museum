label: { ar: "الأربعون 19 — يا غلام إني أعلمك كلمات", en: "Arba'un 19 — O boy, I shall teach you words", es: "Arba'un 19 — Oh muchacho, te enseñaré palabras", fr: "Arba'un 19 — Ô garçon, je vais t'apprendre des mots", ur: "اربعون 19 - اے لڑکے، میں تمہیں الفاظ سکھاؤں گا۔", tr: "Kırk 19 — Ah oğlum, sana kelimeleri öğreteceğim", id: "Empat Puluh 19 — Oh, Nak, aku akan mengajarimu kata-kata" }
summary:
  ar: "حديث عبد الله بن عباس، وهو الحديث التاسع عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه الترمذي (2516) وقال حسن صحيح من رواية حنش الصنعاني عن ابن عباس — وهي أصح الطرق عند ابن منده — وخرجه أحمد بلفظ أتم «يا غلام أو يا غليم ألا أعلمك كلمات ينفعك الله بهن» وفيه زيادة «تعرف إلى الله في الرخاء يعرفك في الشدة» و«واعلم أن في الصبر على ما تكره خيراً كثيراً وأن النصر مع الصبر وأن الفرج مع الكرب وأن مع العسر يسراً»، وروي من طرق كثيرة عن ابن عباس من رواية ابنه علي ومولاه عكرمة وعطاء وعمرو بن دينار وعمر مولى غفرة وابن أبي مليكة، ومن حديث علي بن أبي طالب وأبي سعيد الخدري وسهل بن سعد وعبد الله بن جعفر وفيها ضعف، وذكر العقيلي أن أسانيدها كلها لينة بعضها أصلح من بعض؛ وقال ابن رجب إن الحديث يتضمن وصايا عظيمة وقواعد كلية من أهم أمور الدين وإنه أفرد لشرحه جزءاً هو كتاب «نور الاقتباس في مشكاة وصية النبي لابن عباس»، ونقل عن بعض العلماء — وهو في أصل أبي الفرج — أنه تدبر الحديث فأدهشه وكاد يطيش؛ وفسر «احفظ الله» بحفظ حدوده وحقوقه وأوامره ونواهيه بالوقوف عند أوامره بالامتثال وعند نواهيه بالاجتناب، وأن من أعظم ما يحفظ الصلاة والطهارة والأيمان وحفظ الرأس والبطن، وفي قوله «إذا سألت فاسأل الله وإذا استعنت فاستعن بالله» توحيد الطلب والاستعانة لأن الأمة لو اجتمعت على نفع أو ضر لم يكونا إلا بما كتب الله — رفعت الأقلام وجفت الصحف — وبيّن أن الرضا فضل مندوب والصبر واجب حتم وفيه خير كثير وأن النصر مع الصبر يشمل الجهادين الظاهر والباطن ⁦(جامع العلوم والحكم ص 432–463)⁩."
  en: "Abdullah ibn Abbas's hadith, the nineteenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Tirmidhi (2516, hasan sahih) through Hanash al-San'ani — the soundest route in Ibn Mandah's view — and by Ahmad in a fuller wording beginning 'O boy, shall I not teach you words by which God will benefit you', adding 'be known to God in ease and He will know you in hardship' and 'know that in patience over what you dislike lies much good, that victory is with patience, relief with affliction and with hardship ease'; it is narrated from Ibn Abbas through many routes — his son Ali, his freedman Ikrimah, Ata, Amr ibn Dinar, Amr mawla Ghafra and Ibn Abi Mulayka — and from Ali ibn Abi Talib, Abu Sa'id al-Khudri, Sahl ibn Sa'd and Abdullah ibn Ja'far with weakness, al-Uqayli noting all its chains are soft, some better than others; Ibn Rajab says it comprises great counsels and universal maxims among the religion's most important matters, that he devoted a separate treatise to it — Nur al-Iqtibas fi Mishkat Wasiyyat al-Nabi li-Ibn Abbas — and cites the scholar named in one manuscript as Abu al-Faraj who was stunned upon contemplating it; he glosses 'guard God' as guarding His limits, rights, commands and prohibitions by standing at His commands in obedience and His prohibitions in avoidance — the greatest of what is guarded being prayer, ablution, oaths and the head and belly — and the clauses 'if you ask, ask God; if you seek help, seek God's help' as unifying petition and reliance since the whole community's benefit or harm can only be what God has written — 'the pens are lifted and the scrolls dried' — and explains that contentment is a commended excellence while patience is binding on the believer with much good in it, and that 'victory is with patience' covers both jihads, the outer and the inner (Jami' al-Ulum wal-Hikam pp. 432–463)."
  es: "Hadiz de Abdullah ibn Abbas, el decimonoveno de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Tirmidhi (2516, hasan sahih) a través de Hanash al-San'ani —la ruta más sólida en opinión de Ibn Mandah— y por Ahmad en una redacción más completa que comienza 'Oh muchacho, ¿no te enseñaré palabras con las que Dios te beneficiará?', añadiendo 'conócete a Dios en la facilidad y Él te conocerá en la dificultad' y 'sabe que en la paciencia sobre lo que te disgusta reside mucho bien, que la victoria está con la paciencia, el alivio con la aflicción y con la dificultad la facilidad'; Se narra desde Ibn Abbas a través de muchas rutas: su hijo Ali, su liberto Ikrimah, Ata, Amr ibn Dinar, Amr mawla Ghafra e Ibn Abi Mulayka, y desde Ali ibn Abi Talib, Abu Sa'id al-Khudri, Sahl ibn Sa'd y Abdullah ibn Ja'far con debilidad, al-Uqayli señala que todas sus cadenas son débiles, algunas mejores que otras; Ibn Rajab dice que comprende grandes consejos y máximas universales entre los asuntos más importantes de la religión, que le dedicó un tratado aparte: Nur al-Iqtibas fi Mishkat Wasiyyat al-Nabi li-Ibn Abbas, y cita al erudito nombrado en un manuscrito como Abu al-Faraj, quien quedó atónito al contemplarlo; Él interpreta \"guardar a Dios\" como guardar Sus límites, derechos, mandamientos y prohibiciones, obedeciendo Sus mandamientos y evitando Sus prohibiciones; lo más importante que se guarda es la oración, la ablución, los juramentos y la cabeza y el vientre. Las cláusulas \"si pides, pide a Dios; si buscas ayuda, busca la ayuda de Dios\" unifican la petición y la confianza, ya que el beneficio o el daño de toda la comunidad solo puede ser lo que Dios ha escrito: \"las plumas se levantan y los rollos se secan\". Explica que la satisfacción es una excelencia elogiada, mientras que la paciencia es vinculante para el creyente y trae muchos beneficios, y que \"la victoria está en la paciencia\" abarca ambas yihads, la externa y la interna (Jami' al-Ulum wal-Hikam, págs. 432-463)."
  fr: "Le hadith d'Abdullah ibn Abbas, le dix-neuvième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Tirmidhi (2516, hasan sahih) à travers Hanash al-San'ani — la voie la plus sûre selon Ibn Mandah — et par Ahmad dans une formulation plus complète commençant par « Ô garçon, ne vais-je pas t'enseigner des paroles par lesquelles Dieu te sera bénéfique ? », ajoutant « sois connu de Dieu dans l'aisance et Il te connaîtra dans l'épreuve » et « sache que dans la patience face à ce que tu n'aimes pas réside un grand bien, que la victoire vient avec la patience, le soulagement avec l'affliction et l'aisance avec l'épreuve »; Elle est rapportée d'Ibn Abbas par de nombreuses voies — son fils Ali, son affranchi Ikrimah, Ata, Amr ibn Dinar, Amr mawla Ghafra et Ibn Abi Mulayka — et d'Ali ibn Abi Talib, Abu Sa'id al-Khudri, Sahl ibn Sa'd et Abdullah ibn Ja'far avec faiblesse, al-Uqayli notant que toutes ses chaînes sont faibles, certaines meilleures que d'autres; Ibn Rajab dit qu'elle comprend de grands conseils et des maximes universelles parmi les questions les plus importantes de la religion, qu'il lui a consacré un traité séparé — Nur al-Iqtibas fi Mishkat Wasiyyat al-Nabi li-Ibn Abbas — et cite le savant nommé dans un manuscrit comme Abu al-Faraj qui fut stupéfait en la contemplant; Il interprète l'expression « garder Dieu » comme le fait de garder Ses limites, Ses droits, Ses commandements et Ses interdictions en obéissant à Ses commandements et en évitant Ses interdictions — les plus importantes choses gardées étant la prière, les ablutions, les serments, la tête et le ventre — et les clauses « si vous demandez, demandez à Dieu; si vous cherchez de l'aide, cherchez l'aide de Dieu » comme une supplication et une confiance unificatrices, puisque le bien ou le mal de toute la communauté ne peut être que ce que Dieu a écrit — « les plumes sont levées et les rouleaux séchés » — et explique que le contentement est une excellence louable tandis que la patience est obligatoire pour le croyant et comporte de nombreux bienfaits, et que « la victoire est avec la patience » couvre les deux jihads, l'extérieur et l'intérieur (Jami' al-Ulum wal-Hikam pp. 432–463)."
  ur: "عبداللہ ابن عباس کی حدیث، النووی کی چالیسویں اور ابن رجب کی تفسیر کی انیسویں؛ الترمذی ⁦(2516، حسن صحیح)⁩ نے حناش الصانانی کے ذریعے نقل کیا ہے - ابن مندہ کی نظر میں سب سے بہترین راستہ - اور احمد نے ایک مکمل الفاظ میں شروع کیا 'اے لڑکے، کیا میں تجھے ایسے الفاظ نہ سکھاؤں جن سے خدا تجھے فائدہ دے'، مزید کہا کہ 'خدا کو آسانی میں پہچانا جائے اور وہ تجھے مشکل میں جان لے' اور اس سے زیادہ ناپسندیدگی میں فتح حاصل کرنے کے ساتھ ساتھ یہ بھی شامل ہے۔ صبر، مصیبت کے ساتھ راحت اور سختی کے ساتھ آسانی'؛ ابن عباس سے کئی راستوں سے روایت ہے - ان کے بیٹے علی، ان کے آزاد کرنے والے عکرمہ، عطاء، عمرو ابن دینار، عمرو مولا غفرہ اور ابن ابی ملیکہ - اور علی ابن ابی طالب، ابو سعید الخدری، سہل ابن سعد اور عبداللہ ابن جعفر سے مروی ہے، یہ سب کچھ کمزوری کے ساتھ نرمی کے ساتھ نہیں ہیں، اس سے بہتر نہیں ہیں۔ دیگر؛ ابن رجب کہتے ہیں کہ یہ دین کے اہم ترین امور میں سے عظیم نصیحتیں اور عالمگیر ماخذ پر مشتمل ہے، کہ اس نے اس کے لیے ایک الگ رسالہ مختص کیا ہے - نور الاقتباس فی مشکوٰۃ وصیّت النبی لی ابن عباس - اور ایک مخطوطہ میں ابو الفراج کے نام سے موسوم اس عالم کا حوالہ دیا ہے جو کہ حیران کن تھا۔ وہ 'خدا کی حفاظت' کو اس کی حدود، حقوق، احکام اور ممانعتوں کی حفاظت کے طور پر اس کے حکموں پر اطاعت اور اس کی ممانعتوں پر قائم رہنے کے طور پر بیان کرتا ہے - نماز، وضو، قسموں اور سر اور پیٹ کی حفاظت کی سب سے بڑی چیز - اور شقیں 'اگر آپ پوچھیں تو خدا سے پوچھیں؛ اگر آپ مدد مانگتے ہیں تو خدا سے مدد مانگو‘ ایک درخواست اور بھروسہ کے طور پر متحد ہے کیونکہ پوری برادری کا فائدہ یا نقصان صرف وہی ہوسکتا ہے جو خدا نے لکھا ہے - 'قلم اٹھائے جاتے ہیں اور طومار خشک ہوجاتے ہیں' - اور وضاحت کرتا ہے کہ قناعت ایک قابل ستائش فضیلت ہے جب کہ صبر مومن پر بہت زیادہ اچھائی کے ساتھ پابند ہے، اور یہ کہ 'جیت اور صبر دونوں میں شامل ہے'۔ ⁦(جامع العلوم والحکم صفحہ 432-463)⁩۔"
  tr: "Abdullah bin Abbas hadisi, İbn Receb'in açıklamasında ve El-Arba'in El-Neveviyye'de on dokuzuncu hadis olarak geçmektedir; Tirmizi (2516) tarafından rivayet edilmiş olup, Haneş el-San'ani'nin İbn Abbas'tan naklettiği ve sahih olduğu söylenmiştir - İbn Mande'ye göre ise en sahih isnadtır - ve Ahmed daha eksiksiz bir şekilde rivayet etmiştir: \"Ey evlat, ey genç adam, sana Allah'ın sana fayda sağlayacağı sözler öğretmeyeyim mi?\" Ve buna ek olarak: \"Rahatlık zamanlarında Allah'ı tanı, O da seni zorluk zamanlarında tanıyacaktır\" ve \"Bil ki, hoşlanmadığın şeylere sabretmekte çok hayır vardır, sabır zafer getirir, sıkıntıdan kurtuluş gelir ve zorluktan sonra kolaylık gelir.\" İbn Abbas'tan, oğlu Ali'den, azatlı kölesi İkrime'den, Ata'dan, Amr bin Dinar'dan, Gafra'nın azatlı kölesi Amr'dan ve İbn Abi Malikah'tan, ayrıca Ali bin Ebu Talib'den, Ebu Said el-Hudri'den, Sahl bin Saad'dan ve Abdullah bin Cafer'den rivayet edilen birçok isnad zincirinden nakledilmiştir ve bu hadiste bazı zayıflıklar bulunmaktadır. El-Ukayili, tüm isnad zincirlerinin zayıf olduğunu, bazılarının diğerlerinden daha sağlam olduğunu belirtmiştir. İbn Receb, hadisin dinin en önemli konularına dair büyük öğütler ve genel prensipler içerdiğini ve bu hadisi açıklamak için \"Nur el-İktibas fi Mişkat Vasiyyat el-Nabi li İbn Abbas\" adlı kitabında bir bölüm ayırdığını söylemiştir. Bazı âlimlerden -ve bu Ebu el-Feraj'ın orijinalinde de geçmektedir- hadisi düşündüğünü, hayrete düştüğünü ve neredeyse aklını kaybettiğini aktarmıştır. “Allah’ı korumak” sözünü, O’nun sınırlarını, haklarını, emirlerini ve yasaklarını, emirlerine itaat ederek ve yasaklarından kaçınarak korumak olarak yorumladı. Korunması gereken en büyük şeylerden bazılarının namaz, temizlik, iman ve akıl ile mideyi korumak olduğunu söyledi. “Bir şey istiyorsanız Allah’tan isteyin, yardım istiyorsanız Allah’tan yardım isteyin” sözünde, istemek ve yardım istemenin birleşmesi vardır; çünkü eğer bir millet fayda veya zarar için birleşecekse, bu ancak Allah’ın takdiriyle olur – kalemler kaldırılmış ve sayfalar kurumuştur. Sabrın tavsiye edilen bir erdem, sabrın ise farz bir görev olduğunu ve bunda çok fazla hayır bulunduğunu, sabırla kazanılan zaferin ise iki cihatı, yani dışsal ve içsel cihadı kapsadığını açıkladı (Cami’ el-Ulum ve el-Hikam, s. 432–463)."
  id: "Hadits Abdullah bin Abbas, yang merupakan hadits kesembilan belas dalam Al-Arba’in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Al-Tirmidhi (2516) dan beliau mengatakan hadits ini baik dan sahih menurut riwayat Hanash Al-San’ani dari Ibn Abbas — dan menurut Ibn Mandah hadits ini adalah sanad yang paling sahih — dan Ahmad meriwayatkannya dengan redaksi yang lebih lengkap: “Wahai anak laki-laki atau pemuda, tidakkah aku akan mengajarkan kepadamu kata-kata yang dengannya Allah akan memberi manfaat kepadamu?” Dan di dalamnya terdapat tambahan: “Kenalilah Allah di saat kemudahan, dan Dia akan mengenalmu di saat kesulitan,” dan “Ketahuilah bahwa dalam kesabaran atas apa yang kamu benci terdapat banyak kebaikan, dan bahwa kemenangan datang dengan kesabaran, dan bahwa kelegaan datang dengan kesusahan, dan bahwa dengan kesulitan datang kemudahan.” Hadits ini diriwayatkan dari banyak sanad atas otoritas Ibnu Abbas, dari riwayat putranya Ali, budak yang dibebaskannya Ikrimah, Ata, Amr bin Dinar, Amr budak yang dibebaskan dari Ghafra, dan Ibnu Abi Malikah, serta dari hadits Ali bin Abi Talib, Abu Saeed Al-Khudri, Sahl bin Saad, dan Abdullah bin Jaafar, dan terdapat kelemahan di dalamnya. Al-Uqaili menyebutkan bahwa semua sanadnya lemah, beberapa di antaranya lebih sahih daripada yang lain. Ibnu Rajab mengatakan bahwa hadits ini mengandung nasihat yang agung dan prinsip-prinsip umum tentang hal-hal terpenting dalam agama, dan bahwa ia mendedikasikan sebagian untuk menjelaskannya, yaitu buku “Nur al-Iqtibas fi Mishkat Wasiyyat al-Nabi li Ibn Abbas”. Ia mengutip beberapa ulama – dan ini dalam naskah asli Abu al-Faraj – bahwa ia merenungkan hadits tersebut dan merasa takjub serta hampir gila. Ia menafsirkan “memelihara Allah” sebagai memelihara batasan, hak, perintah, dan larangan-Nya dengan menaati perintah-Nya dan larangan-Nya dengan menghindarinya. Ia mengatakan bahwa di antara hal-hal terbesar yang harus dipelihara adalah salat, kesucian, iman, dan menjaga kepala dan perut. Dalam ucapannya, “Jika kamu meminta, maka mintalah kepada Allah, dan jika kamu mencari pertolongan, maka carilah pertolongan dari Allah,” terdapat penyatuan antara meminta dan mencari pertolongan karena jika suatu bangsa bersatu untuk kebaikan atau keburukan, itu tidak akan terjadi kecuali dengan apa yang telah ditetapkan Allah – pena telah diangkat dan lembaran-lembaran telah kering. Ia menjelaskan bahwa kepuasan adalah kebajikan yang dianjurkan dan kesabaran adalah kewajiban yang wajib dan terdapat banyak kebaikan di dalamnya, dan bahwa kemenangan dengan kesabaran mencakup dua jihad, lahiriah dan batiniah (Jami’ al-‘Ulum wa al-Hikam, hlm. 432–463)."
