label: { ar: "سنن أبي داود 602 — عيادة المريض", en: "Sunan Abi Dawud 602 — visiting the sick", ur: "سنن ابی داؤد 602 — بیمار کی عیادت", es: "Sunan Abi Dawud 602 — visitando a los enfermos", fr: "Sunan Abi Dawud 602 — Visiter les malades", tr: "Sunan Abi Davud 602 — Hasta Ziyareti", id: "Sunan Abi Dawud 602 — Menjenguk Orang Sakit" }
text: "… سُفْيَانَ، عَنْ جَابِرٍ، قَالَ رَكِبَ رَسُولُ اللَّهِ فَرَسًا بِالْمَدِينَةِ فَصَرَعَهُ عَلَى جِذْمِ نَخْلَةٍ فَانْفَكَّتْ قَدَمُهُ فَأَتَيْنَاهُ نَعُودُهُ فَوَجَدْنَاهُ فِي مَشْرَبَةٍ لِعَائِشَةَ يُسَبِّحُ جَالِسًا قَالَ فَقُمْنَا خَلْفَهُ فَسَكَتَ عَنَّا ثُمَّ أَتَيْنَاهُ مَرَّةً أُخْرَى نَعُودُهُ فَصَلَّى الْمَكْتُوبَةَ جَالِسًا فَقُمْنَا خَلْفَهُ فَأَشَارَ إِلَيْنَا فَقَعَدْنَا. قَالَ فَلَمَّا قَضَى الصَّلاَةَ قَالَ \" إِذَا صَلَّى الإِمَامُ جَالِسًا فَصَلُّوا جُلُوسًا وَإِذَا صَلَّى …"
summary:
  ar: "حديث في سنن أبي داود، رقم 602، يذكر عيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 602 (Prayer (Kitab Al-Salat)), that mentions visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 602، جس میں بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 602 (Oración (Kitab Al-Salat)), menciona la visita a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 602 (La Prière), mentionne la visite aux malades. Le Répertoire des ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 602 numaralı hadiste, hasta ziyaretinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 602, menyebutkan tentang mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
