text: "خص بتحريم الزكاة عليه، ويشاركه فى حرمتها ذوى القربى، الثامنة والأربعون وكذا الكفارات التاسعة والأربعون وبأن الصلاة على الجنازة فى حقه عل فرض عين فمسون وبوجوب حفظ أموال المسلمين النوع الثانى من الواجبات فيما يتعلق بالنكاح، وفيه مسألة واحدة خص …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 145، يرد فيه ذكر الفرض، وفرض العين، والواجب، والوجوب، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 145, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the obligatory (wajib), obligation (wujub), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 145 کا اقتباس جس میں فرض، فرضِ عین، واجب، وجوب، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subul al-Huda wa-l-Rashad de al-Salihi, volume numérisé 4, p. 145, dont le texte mentionne l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligatoire (wajib), l'obligation (wujub), l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subul al-Huda wa-l-Rashad de al-Salihi, volumen digitalizado 4, p. 145, cuyo texto menciona lo obligatorio (fard), la obligación individual (fard 'ayn), lo obligatorio (wajib), la obligatoriedad (wujub), la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 4. cildinin 145. sayfasından bir alıntı, farz olan fiilleri, bireysel yükümlülükleri, görevleri ve yasakları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh edilen fiiller, yasak olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Salihi, \"Subul al-Huda wa al-Rashad,\" Jilid 4, halaman 145, membahas tentang amalan wajib, kewajiban individu, tugas, dan larangan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, tugas, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
