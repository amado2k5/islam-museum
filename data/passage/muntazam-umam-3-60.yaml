text: "… من سرايا الروم ديار ربيعة فقتلت وفيها مات ابو الساج فولى ابنه الحرمين وطريق مكة. وفيها وئب. الاعراب على كسوة الكعبة فاتهيوها وصار بعضهم إلى صاحب الزمج واصاب الاج شدة شديدة ودخل الزنج راسهر من فأحرقوا مسجدها وقتلوا وسبوا تم …"
summary:
