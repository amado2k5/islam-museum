text: "… حمد ثنا على بن سميد الرازى ثنا إبراهيم بن المستمر المروق ثنا عثمان بن ممر ثنا مالك عن نافع عن ابن ممر أن النبى مر برجل يمغ أخاه فى الحياء، فقال : دعه فان الحياء من الايمان ؟ غريب من …"
summary:
