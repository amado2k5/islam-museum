text: "… الثانية فى المعاد، ونحن نذكرهافما بعد ازشاء اللّٰه تعالى الشريمة التى جاء بها مانى والفرائض التى فرضها فرض مانى على أصحابه عشر فرائض على السماعين، ويتبعها ثلاث خواتيم، وصيام سبعة أيام أبداً فى كل شهر. فالفرائض هى الايمان بالمظائم الاربع …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 2، ص 461، يرد فيه ذكر الفريضة والفرائض، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
