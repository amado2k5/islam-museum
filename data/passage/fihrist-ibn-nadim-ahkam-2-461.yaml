  tr: "İbn el-Nadim'in Fihrist adlı eserinin 2. cildinin 461. sayfasından, farz fiiller (faridah), farz fiiller (fara'id) ve münasebet yükümlülüklerden (fard) bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Jilid 2, halaman 461, yang menyebutkan amalan wajib (faridah), amalan wajib (fara'id), dan kewajiban individu (fard); dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
