label: { ar: "الموطأ 2233 — مالك: من استعان عبدا بغير إذن سيده في شيء له بال، ولمثله إجارة، فهو ضامن لما أصاب العبد إن أصيب، وإن سلم فطلب سيده إجارته فذلك لسيده", en: "Muwatta 2233", es: "Muwatta 2233", fr: "Muwatta 2233", ur: "موطا 2233", tr: "El-Muvatta 2233 — Malik: Efendisinin izni olmadan önemli bir iş için köle çalıştıran ve karşılığında ücret talep eden kimse, köleye gelebilecek her türlü zarardan sorumludur. Eğer köle hayatta kalır ve efendisi ücretini talep ederse, bu hak efendisine aittir.", id: "Al-Muwatta 2233 — Malik: Barang siapa mempekerjakan seorang budak tanpa izin tuannya untuk suatu pekerjaan penting, dan untuk pekerjaan tersebut terdapat hak upah, maka ia bertanggung jawab atas segala kerugian yang menimpa budak tersebut, jika ada. Jika budak tersebut selamat dan tuannya menuntut upahnya, maka hak tersebut menjadi milik tuannya." }
summary:
  ar: "قال: وسمعت مالكا يقول: من استعان عبدا بغير إذن سيده في شيء له بال، ولمثله إجارة، فهو ضامن لما أصاب العبد، إن أصيب العبد بشيء. وإن سلم العبد فطلب سيده إجارته لما عمل، فذلك لسيده، وهو الأمر عندنا. {cite:muwatta-maruf-1997 p.319}"
  tr: "O şöyle dedi: Malik'in şöyle dediğini işittim: \"Kim efendisinin izni olmadan önemli bir iş için ve karşılığında ücret alarak bir köle çalıştırırsa, köleye bir şey olursa, başına gelenlerden sorumludur. Eğer köle güvende ise ve efendisi yaptığı iş için ücret talep ederse, bu efendisine aittir ve bu bizim görüşümüze göre hükümdür.\" {cite:muwatta-maruf-1997 s.319}"
  id: "Dia berkata: Saya mendengar Malik berkata: Barang siapa mempekerjakan seorang budak tanpa izin tuannya untuk sesuatu yang penting, dan untuk pekerjaan tersebut ada upah, maka ia bertanggung jawab atas apa pun yang terjadi pada budak tersebut, jika terjadi sesuatu pada budak tersebut. Dan jika budak itu selamat dan tuannya menuntut pembayaran atas apa yang telah dilakukannya, maka itu menjadi hak tuannya, dan inilah hukum menurut kami. {cite:muwatta-maruf-1997 p.319}"
