label: { ar: "الموطأ 2233 — مالك: من استعان عبدا بغير إذن سيده في شيء له بال، ولمثله إجارة، فهو ضامن لما أصاب العبد إن أصيب، وإن سلم فطلب سيده إجارته فذلك لسيده", en: "Muwatta 2233" }
summary:
  ar: "قال: وسمعت مالكا يقول: من استعان عبدا بغير إذن سيده في شيء له بال، ولمثله إجارة، فهو ضامن لما أصاب العبد، إن أصيب العبد بشيء. وإن سلم العبد فطلب سيده إجارته لما عمل، فذلك لسيده، وهو الأمر عندنا. {cite:muwatta-maruf-1997 p.319}"
