label: { ar: "سنن أبي داود 2131 — استحلال الشيء", en: "Sunan Abi Dawud 2131 — treating a thing as lawful", ur: "سنن ابی داؤد 2131 — کسی چیز کو حلال ٹھہرانا", es: "Sunan Abi Dawud 2131 — tratar algo como lícito" }
text: "… بَصْرَةُ قَالَ تَزَوَّجْتُ امْرَأَةً بِكْرًا فِي سِتْرِهَا فَدَخَلْتُ عَلَيْهَا فَإِذَا هِيَ حُبْلَى فَقَالَ النَّبِيُّ \" لَهَا الصَّدَاقُ بِمَا اسْتَحْلَلْتَ مِنْ فَرْجِهَا وَالْوَلَدُ عَبْدٌ لَكَ فَإِذَا وَلَدَتْ \". قَالَ الْحَسَنُ \" فَاجْلِدْهَا \". وَقَالَ ابْنُ أَبِي السَّرِيِّ \" فَاجْلِدُوهَا \". أَوْ قَالَ \" فَحُدُّوهَا \". قَالَ أَبُو دَاوُدَ رَوَى هَذَا الْحَدِيثَ قَتَادَةُ عَنْ سَعِيدِ بْنِ يَزِيدَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2131، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2131 (Marriage (Kitab Al-Nikah)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2131، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2131 (Matrimonio (Kitab Al-Nikah)), menciona la consideración de algo como lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
