text: "… : مَنْ أحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدُّ. أخرجه البخاري:. قال أهل العربية: الرد هنا بمعنى المردود ومعناه فهو باطل غير بعتد به، وهذا الحديث قاعدة عظيمة من قواعد الإسلام، وهو من جوامع بالرواية الأولى يقول: أنا …"
