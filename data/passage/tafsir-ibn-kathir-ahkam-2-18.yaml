text: "… لأحمد من لم يقبل رخصة اللّٰه كان عليه من الاثم مثل جبال عرفة ولهذا قال الفقهاء : قد يكون تناول الميتة واجباً فى بعض الأحيان وهو ما إذا خاف على نفسه ولم يجد غيرها، وقد يكون مندوبا، وقد يكون مباحا …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 2، ص 18، يرد فيه ذكر الواجب، والمندوب، والمباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 2, p. 18, whose wording mentions the obligatory (wajib), the recommended (mandub), the permitted (mubah), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
