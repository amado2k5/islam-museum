label: { ar: "سنن النسائي 2110 — عمل يعدل عملا أعظم منه", en: "Sunan al-Nasa'i 2110 — a deed that equals a greater one", ur: "سنن نسائی 2110 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "أَخْبَرَنَا عِمْرَانُ بْنُ يَزِيدَ بْنِ خَالِدٍ، قَالَ حَدَّثَنَا شُعَيْبٌ، قَالَ أَخْبَرَنِي ابْنُ جُرَيْجٍ، قَالَ أَخْبَرَنِي عَطَاءٌ، قَالَ سَمِعْتُ ابْنَ عَبَّاسٍ، يُخْبِرُنَا قَالَ قَالَ رَسُولُ اللَّهِ لاِمْرَأَةٍ مِنَ الأَنْصَارِ \" إِذَا كَانَ رَمَضَانُ فَاعْتَمِرِي فِيهِ فَإِنَّ عُمْرَةً فِيهِ تَعْدِلُ حَجَّةً \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2110، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2110 (The Book of Fasting), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2110، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
