text: "… بن ثابت الأنصاري كان ممن يكتب الوحي. قال: أرسل إلي أبو بكر مقتل أهل اليمامة وعنده عمر، فقال أبو بكر: إن عمر أتاني فقال: إن القتل قد استحر يوم اليمامة بالناس وإني أخشى أن يستحر القتل بالقراء في المواطن فيذهب …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 279، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 279, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 279 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 4, pág. 279, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 4, p. 279) mentionne les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 4. cildinin 279. sayfasından, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 4, halaman 279, yang menyebutkan para qari, penyusunan Al-Qur'an, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
