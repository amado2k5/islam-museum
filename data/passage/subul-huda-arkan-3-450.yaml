text: "… لَا إِلَهَ إِلَّا اللَّهُ، وَأَنِّى رَسُولُ اللهِ وَلِلِ إِقَامِ الصَّلَاةِ، و وَإِيتَاءِ الزَّكَاةِ، وَحَجَّ الْبَيْتِ وَصَوْمِ رَمَضَانَ فَقُلْنا إِذَا جِئْنَاكَ إِلَى هُنَا، فَنَحْنُ آمِنُونَ عَلَى أَهْلِنَا وَدِمَائِنَا وَأَمْوَالِنَا. قَالَ : نَعَمْ. فَأَسْلَمْتُ ثُمَّ رَجَعْتُ إِلَى أَهْلِي، فَأَعْلَمْتُهُمْ بِإِسْلَامِى، فَأَسْلَمَ عَلَى …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 3، ص 450، يذكر الصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
