label: { ar: "الموطأ 2237 — يحيى عن مالك: السنة عندنا في جناية العبيد أن كل ما أصاب العبد من جرح جرح به إنسانا، أو شيء اختلسه، أو حريسة احترسها، أو ثمر معلق جذه أو أفسده، فإن ذلك في رقبة العبد، فإن شاء سيده أن يعطي قيمة ما أخذ أو أفسد أو عقل ما جرح أعطاه وأمسك غلامه، وإن شاء أسلمه", en: "Muwatta 2237", es: "Muwatta 2237", fr: "Muwatta 2237", ur: "موطا 2237", tr: "El-Muvatta 2237 — Yahya, Malik'ten rivayetle: Kölelerin işlediği suçlar konusunda yerleşik uygulamamız şudur: Bir kölenin verdiği her türlü zarar, ister bir kişiye verdiği yara, ister çaldığı bir şey, ister koruduğu bir şey, ister topladığı veya zarar verdiği bir meyve olsun, kölenin sorumluluğundadır. Efendisi dilerse, aldığı veya zarar verdiği şeyin değerini verebilir veya verdiği yaranın tazminatını ödeyebilir ve kölesini yanında tutabilir. Ya da dilerse onu teslim edebilir.", id: "Al-Muwatta 2237 — Yahya berdasarkan riwayat Malik: Kebiasaan kita yang telah mapan mengenai kejahatan yang dilakukan oleh budak adalah bahwa kerugian apa pun yang ditimbulkan oleh seorang budak, baik itu luka yang ditimbulkannya pada seseorang, sesuatu yang dicurinya, sesuatu yang dijaganya, atau buah yang dipetiknya atau dirusaknya, maka itu adalah tanggung jawab budak tersebut. Jika tuannya menghendaki, ia dapat memberikan nilai dari apa yang diambil atau dirusaknya, atau ia dapat membayar ganti rugi atas luka yang ditimbulkannya, dan ia dapat tetap memelihara budaknya. Atau, jika ia menghendaki, ia dapat menyerahkannya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: السنة عندنا في جناية العبيد أن كل ما أصاب العبد من جرح جرح به إنسانا، أو شيء اختلسه، أو حريسة احترسها، أو ثمر معلق جذه أو أفسده، أو سرقة سرقها لا قطع عليه فيها: إن ذلك في رقبة العبد، لا يعدو ذلك الرقبة، قل ذلك أو كثر. فإن شاء سيده أن يعطي قيمة ما أخذ غلامه، أو أفسد، أو عقل ما جرح، أعطاه وأمسك غلامه، وإن شاء أن يسلمه أسلمه، وليس عليه شيء غير ذلك، فسيده في ذلك بالخيار. {cite:muwatta-maruf-1997 p.320}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Kölelerin işlediği suçlarla ilgili yerleşik uygulamamız şudur: Bir kölenin verdiği zarar ne olursa olsun – ister bir kişiye verdiği yara, ister çaldığı bir şey, ister koruduğu bir şey, ister topladığı veya zarar verdiği bir meyve, isterse işlediği bir hırsızlık olsun – ve bu zarardan dolayı uzuv kaybından sorumlu değilse, sorumluluk kölenin kendisine aittir, ne eksik ne fazla, miktar az veya çok olsun. Efendisi, kölesinin aldığı veya zarar verdiği şeyin değerini vermek veya verdiği yara için kan parası ödemek isterse, bunu yapabilir ve kölesini elinde tutabilir. Ya da onu teslim etmek isterse, bunu yapabilir ve başka hiçbir şeyden sorumlu olmaz. Bu konuda efendinin seçme hakkı vardır. {cite:muwatta-maruf-1997 s.320}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Praktik yang telah mapan di antara kita mengenai kejahatan yang dilakukan oleh budak adalah bahwa apa pun yang dilakukan seorang budak—baik itu luka yang ditimbulkannya pada seseorang, sesuatu yang dicurinya, sesuatu yang dijaganya, buah yang dipetik atau dirusaknya, atau pencurian yang dilakukannya—yang mana ia tidak bertanggung jawab atas hukuman amputasi, maka tanggung jawabnya jatuh pada budak itu sendiri, tidak lebih dan tidak kurang, baik jumlahnya kecil atau besar. Jika tuannya ingin memberinya nilai dari apa yang diambil atau dirusak oleh budaknya, atau membayar uang darah untuk luka yang ditimbulkannya, ia dapat melakukannya dan tetap mempertahankan budaknya. Atau jika ia ingin menyerahkannya, ia dapat melakukannya, dan ia tidak bertanggung jawab atas hal lain. Tuan memiliki pilihan dalam hal ini. {cite:muwatta-maruf-1997 p.320}"
