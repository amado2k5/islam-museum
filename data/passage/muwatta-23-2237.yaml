label: { ar: "الموطأ 2237 — يحيى عن مالك: السنة عندنا في جناية العبيد أن كل ما أصاب العبد من جرح جرح به إنسانا، أو شيء اختلسه، أو حريسة احترسها، أو ثمر معلق جذه أو أفسده، فإن ذلك في رقبة العبد، فإن شاء سيده أن يعطي قيمة ما أخذ أو أفسد أو عقل ما جرح أعطاه وأمسك غلامه، وإن شاء أسلمه", en: "Muwatta 2237" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: السنة عندنا في جناية العبيد أن كل ما أصاب العبد من جرح جرح به إنسانا، أو شيء اختلسه، أو حريسة احترسها، أو ثمر معلق جذه أو أفسده، أو سرقة سرقها لا قطع عليه فيها: إن ذلك في رقبة العبد، لا يعدو ذلك الرقبة، قل ذلك أو كثر. فإن شاء سيده أن يعطي قيمة ما أخذ غلامه، أو أفسد، أو عقل ما جرح، أعطاه وأمسك غلامه، وإن شاء أن يسلمه أسلمه، وليس عليه شيء غير ذلك، فسيده في ذلك بالخيار. {cite:muwatta-maruf-1997 p.320}"
