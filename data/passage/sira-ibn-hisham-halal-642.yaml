text: "… وَكُلُّ مِنّى مَنْحَرٌ فقضى رسولُ اللهِ وَلي الحجّ وقد أَراهم مَنَاسِكَهُمْ، وأعلمهم ما فَرَضَ اللّٰه عليهم من حَجِّهم، من الموقفِ وَرَمْي الجمارِ وطوافِ البيتِ، وَمَا أُحِلَّ لهم من حَجِّهم وما حُرِّمَ عليهم؛ فكَانَتْ حجةَ البلاغِ، وحجةَ الوداعِ، وذلك أَنَّ رسولَ …"
