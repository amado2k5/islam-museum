label: { ar: "الموطأ 249 — بلاغ أبي بكر بن سليمان: ذو الشمالين وسلام النبي من اثنتين", en: "Muwatta 249" }
text: "ما قصرت الصلاة وما نسيت. فقال له ذو الشمالين: قد كان بعض ذلك يا رسول الله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي بكر بن سليمان بن أبي حثمة بلاغاً، في باب ما يفعل من سلم من ركعتين ساهياً: ركع النبي ركعتين من إحدى صلاتي النهار الظهر أو العصر فسلم من اثنتين، فسأله ذو الشمالين، رجل من بني زهرة بن كلاب، أقصرت الصلاة أم نسي، فقال: ما قصرت الصلاة وما نسيت، فقال ذو الشمالين: قد كان بعض ذلك، فأقبل النبي على الناس وسألهم أصدق ذو اليدين، فقالوا نعم، فأتم ما بقي من الصلاة ثم سلم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وأن الحديث منقطع عند جميع رواة الموطأ. {cite:muwatta-maruf-1997 p.148}"
