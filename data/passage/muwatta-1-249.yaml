label: { ar: "الموطأ 249 — بلاغ أبي بكر بن سليمان: ذو الشمالين وسلام النبي من اثنتين", en: "Muwatta 249", es: "Muwatta 249", fr: "Muwatta 249", ur: "موطا 249", tr: "El-Muvatta 249 — Ebu Bekir bin Süleyman'ın rivayeti: İki sol tarafı olan ve Peygamber'in iki taraftan selam verdiği kişi.", id: "Al-Muwatta 249 — Riwayat Abu Bakar bin Sulaiman: Yang memiliki dua sisi kiri dan salam Nabi dari dua sisi" }
text: "ما قصرت الصلاة وما نسيت. فقال له ذو الشمالين: قد كان بعض ذلك يا رسول الله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي بكر بن سليمان بن أبي حثمة بلاغاً، في باب ما يفعل من سلم من ركعتين ساهياً: ركع النبي ركعتين من إحدى صلاتي النهار الظهر أو العصر فسلم من اثنتين، فسأله ذو الشمالين، رجل من بني زهرة بن كلاب، أقصرت الصلاة أم نسي، فقال: ما قصرت الصلاة وما نسيت، فقال ذو الشمالين: قد كان بعض ذلك، فأقبل النبي على الناس وسألهم أصدق ذو اليدين، فقالوا نعم، فأتم ما بقي من الصلاة ثم سلم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وأن الحديث منقطع عند جميع رواة الموطأ. {cite:muwatta-maruf-1997 p.148}"
  id: "Malik meriwayatkannya dari Ibnu Shihab, dari Abu Bakar ibn Sulaiman ibn Abi Hathmah, sebagai riwayat tanpa sanad, dalam surah tentang apa yang harus dilakukan jika seseorang lupa mengucapkan taslim setelah dua rakaat: Nabi (shalawat dan salam kepadanya) mengerjakan dua rakaat salah satu shalat siang, baik Dzuhur atau Asar, dan mengucapkan taslim setelah dua rakaat. Dhu al-Shimalayn, seorang laki-laki dari Bani Zuhrah ibn Kilab, bertanya kepadanya, \"Apakah shalatnya dipersingkat, atau apakah dia lupa?\" Beliau menjawab, \"Shalatnya tidak dipersingkat, dan saya tidak lupa.\" Dhu al-Shimalayn berkata, \"Sebagian dari itu terjadi.\" Nabi (shalawat dan salam kepadanya) kemudian berpaling kepada orang-orang dan bertanya kepada mereka, \"Apakah Dhu al-Shimalayn mengatakan yang sebenarnya?\" Mereka menjawab, \"Ya.\" Maka beliau menyelesaikan rakaat-rakaat shalat yang tersisa dan kemudian mengucapkan taslim. Penyunting menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya berdasarkan otoritas Malik, dan bahwa hadits tersebut tidak berkesinambungan menurut semua perawi al-Muwatta'. {cite:muwatta-maruf-1997 p.148}"
