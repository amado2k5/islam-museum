text: |-
  قوله مجز أفلان ومجزأة ذسلان
  وقع فى بعض نسمح تكرار الانظتين
  اشارة الى فتح ميمهما وهو الاكتر
  وضحهما
  قوله باآنى الخ قال القاموس
  صوابه بايأنى الخ قال شارحه
  وماذكره المصنف هو القياس وما
  قاله الجوهرى هو المسموع ء-ن
  العرب كذا أشاراليه ابن سيده اه
  وجزأت الشئى جزه اقسمته وجعلته أجزاء وكذلك التجزئة وجزأت بالشئ جز١ أى اكتفيت
  به وجزأت الابل بالرطب عن الماء بزءابالضم وأجزأتها أنا وجز أتها أيضا تجزئة وظيبية جازئة
  وقال الشماخ
  اذا الارطى توسد أبرديه • خدود جوازئ بالرمل عين
  وأجز أنى الشئ كفانى وأجزأت عنك شاة لغة فى جزت أى قضت واجتزأت بالشئ وتجزأتب
  عع-ى اذاا كتفيت به وأجزأت عنك مجز أفلان ومجزأة فلان أى أغنيت عنك مغناه والجزأة
  بالضم نصاب الإشى والخصف وقد أجز آته جعلت له نصاباوجزء بالفتح اسم رجل وقال
  ان كنت أزننتى بها كذبا * جزء فلاقيت مثلها عجلا
  جسأ جسأت يدهمن العمل تجسأ جستاصلبت والاسم الجسأة مثال الجرعة
  والجسأة فى الدواب يبس المعطف ( جنأ ، تجشأت تجسؤا والتجئة مشله قال الراجز
  ولم تبت حى به وصعه • ولم يجشى عن طعام يبشمه
  والاسم الجشأة مثال الهسمزة قال الاصمعى ويقال الحشاء على فعال كأنه من باب العطاس
  والبوال والدوار وجشأت نفسى جشوءا اذانهضت البلموجاشت من حزن أوفزع
  واجتشأتنى البلاد واجتشأتها اذالم توافقك وجشأ القوم من بد-د الى بلدأى خرجوا
  والجسء القوس الخفيفة قال أبوذؤيب
  وتميمة من قائص مقلبب * فى كفه جشء أجس وأقطع
  قال الاصمعى هوالقضيب من النبع الطفيف فا ) الجفاء ماتفاه السيل قال اللّٰه تعالى
  فأمأ الز بدفيذهب جفاء أى باطلا وجفأ الوادى جفأ اذارمى بالقذى والز بد وكذلك القدر
  ذارت مافيها لاتة اليفاتها قال الراجرة فيه وجفات القدرأيناذا كفاتها أوأسلتيا
  جفوك ذاقدرل للضيفان * جفأ على ارغفان فى الجفان خيرمن العكيس بالالبان
  وأما الذى فى الحديث فأجفوا قدورهم بمافيها فهى لغة مجهولة وجفأت الرجل أيضاصرعته
  واحتفأت الشىء اقتلعته ورميت به نأ جنأ الرجل على الشىء وجاناً عليه وتجانأعليه
  اذا أكب عليه قال الشاعر كثر
  أغاضر لوشهدت غداة بنتم * جنو العائدات على وسادى
  ورجل أجنأ بين الجنأ أى أحدب الظهر والجنأً بالضم الترس قال أبو قيس بن الاسلت
  صدق حسام وادق حدّه • ومجنأ ا-مرقراع
  ( بأ المجى الاثيان يقال جاءيجى جيأة وهو من بناء المرة الواحدة الاانه وضع موضع
  المصدر مثسل الرجفة والرجة والاسم الجيئة على فعلة بكسر الجيم وتقول جئت مجينا حسنا
  وهوشاذلان المصدر من فعل يفعل مفعل :فتح العين وقد شذت منه حروف فجاءت على مفعل
  كالجى والمحيض والمكيل والمصبروأ بأنه أى جفت به وجاآنى على فاعلى فجنته أجيثه أى
  غالبنى بكثرة المجىء فغلبته وتقول الحسد للّه الذى جاءبك أى الحسد لله اذجئت ولا تقل
  الحمدلله الذى حئت وأجأنه الى كذابعنى ألجاته واضطورته المهقال زهيربن أبى سلى
  وجارسار معتمدا السكم * أجانه المخافة والرجاء
  قال
