text: "ائله رضي الله تعالى عنه قال أهل العلم بالسير : كان عمر بن الخطاب من المهاجرين الأولين ممن صلى إلى القبلتين وشهد بدرا والحديبية وبيعة الرضوان وسائر المشاهد مع رسول الله ولي ، ولما أسلم أعز الله به الإسلام وهاجر"
