text: "… الكفَّار بأيدي المؤمنين لأجلها، وقد كان تعالىٰ إنَّما يعاقب الأمم السَّالفة المكذبة للأنبياء بالقوارع التي تعم تلك الأمَّة المكذِّبة، كما أهلك قوم نوح بالطُّوفان، وعادّا الأولىٰ بالدَّبُور، وثمود بالصَّيحة، وقوم لوط بالخَسْف والقلب وحجارة السَّجيل وقوم شعيب بيوم الظَّلَّةِ، فلمَّا …"
