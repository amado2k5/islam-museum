  تريد أن تعجنه وبكات البكيلة أبكلها بكلااً عاقفسذتها وقديكات السويتق بالدقيق أى
  خلطته ويكل فلان علينا حديثه أى خلطه وتسكل الرجل فى الكلام أى خلط وتسكل القوم
  فلانا اذاءلوه بالشتم والضرب قال أبو عبيد التبكل الغنيمة وأنشدلاوس بن حجر
  على خيرما أبصرتها من بضاعة • لملتمس بيعابها أوتب-كلل
  أى تغنما وية ال ظلت الفنم بكيلة واحدة وعبينة واحدة اذا اختلط بعضها يعض وبكيل
  حت من همدان ومنهة ول الكميت • لقد شركت فيه بكيل وأرحب • ونوف البكالىّ
  كان حاجب على" رضوان اللّٰه عليه قال ثعلب هو مندوب الى بكالة قبيلة [Ÿ]لل)
