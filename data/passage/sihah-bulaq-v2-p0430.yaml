  وبقل وجه الفلام يبقل بق ولا خرحت لحيته ولا نقل بقل بالتشد قال ابن السكيت بقل ناب
  م البعسير أى طلع وأيقل الرمت وذلك اذا أدبى وظهرت خضرة ورقه فهوباقل ولم يقولوا ميقل،
  كما قالوا أورس فهووارس ولم ية ولوامورس وهو من النوادر وأبقلت الارض خرج بقلها
  قال عامر بن جوين الطانة
  فلا حزنة ودقت ودقها • ولا أرض أبقل ابقالها
  ولم يقل أبقلت لان تأنيت الارض ايمر بتأنيت سقيق وابتقل الهارأى رى البقل قال
  لهذلى تاللّه يبق على الايام مبتقل • جون المراة رباع سنه غرد
  أى لا ييق وتبقل منه قال أبو النجم *تبقات فى أول التبقل • والباقلااذاشددت اللام
  قصرت واذا خففت مددت الواحدة باقلاة على ذلك رقولهم فى المثل أعبي من باقل ه واسم
  رجل من العرب وكان اشترى ظييا باحد عشردرهما فقيل له بكم اشتريته ففتح كفيسه وفرق
  أصابعه وأخرج لسانه يشيريذلك الى أحسد عشر فاتفلت الظبى فضريوايه المثل فى العى
  قال حد ⁦(؟)⁩ يسجو ضيفاله
  أتانا وماداناه مصبان وائل • بنانا وعلما بالذى هوقاتل
  فازال عند اللقم -تى كانه • من العى لما أن تكام باقل
  وقول الراجز
  يرية لم تصرف المرققا • ولم تذق من البقول فستقا
