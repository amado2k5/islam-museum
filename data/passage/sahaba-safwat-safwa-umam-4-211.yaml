text: "… الصحيح. وفي الصحيح عن سلمان أنه قال تداولني بضعة عشر من رب إلى رب. ذكر نبذة من فضائله: عن أنس قال: قال رسول اللّٰه : السباق أربعة، أنما سابق العرب، وصهيب سابق الروم، وسلمان سابق فارس، وبلال سابق الحبشة. وعن …"
