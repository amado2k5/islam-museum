text: "… بن مطعم وامها عتبة بنت آلى اهاب التى تزوجها عقبة ابن الحرث ثم فارقها من أجل قول المرآة السوداء انى ارضعتكما ففارقها عقبة فتزوجها نافع هذا وقال هشام بن الكلبى كان يكتب المصاحف لعمر بن الخطاب وقال البلادرى كتب المصاحف …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 5، ص 564، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 5, p. 564, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
