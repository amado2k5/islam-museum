label: { ar: "الموطأ 481 — عائشة: أحب العمل إلى النبي ما داوم عليه صاحبه", en: "Muwatta 481", es: "Muwatta 481", fr: "Muwatta 481", ur: "موطا 481", tr: "Al-Muwatta 481 — Aişe: Peygamberin en sevdiği amel, sürekli yapılan ameldir.", id: "Al-Muwatta 481 — Aisyah: Amalan yang paling dicintai Nabi adalah amalan yang dilakukan secara konsisten." }
text: "كان أحب العمل إلى رسول الله الذي يدوم عليه صاحبه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب جامع الصلاة: كان أحب العمل إلى النبي الذي يدوم عليه صاحبه. ويخرّجه المحقق عند البخاري (6462) وأحمد (6/176) من طرق أصحاب مالك، ويذكر أنه في الصحيحين من طريق أبي سلمة عن عائشة وعند مسلم (2/189) من طريق القاسم عنها، ويحيل على التمهيد (22/120). {cite:muwatta-maruf-1997 p.247}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Ayşe'den rivayet ederek, tam namaz bölümünde şöyle buyurmuştur: \"Peygamberin en sevdiği amel, sürekli kılınan ameldir.\" Editör ayrıca bunu Buhari (6462) ve Ahmed'de (6/176) Malik'in sahabelerinin rivayet zincirleriyle de aktarmış ve iki Sahih'te (Buhari ve Müslim) Ebu Seleme'den, o da Ayşe'den, ve Müslim'de (2/189) el-Kâsım'dan, o da Ayşe'den rivayet edildiğini belirtmiştir. Ayrıca el-Temhid'e (22/120) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.247}"
  id: "Malik meriwayatkan hadits ini dari Hisham bin Urwah, dari ayahnya, dari Aisyah, dalam surah tentang shalat lengkap: “Amal yang paling dicintai Nabi adalah amal yang dilakukan secara konsisten.” Editor juga memasukkannya dalam Bukhari (6462) dan Ahmad (6/176) melalui sanad para sahabat Malik, dan menyebutkan bahwa hadits ini terdapat dalam dua kitab Sahih (Bukhari dan Muslim) dari Abu Salamah, dari Aisyah, dan dalam Muslim (2/189) dari al-Qasim, darinya. Ia merujuk pada al-Tamhid (22/120). {cite:muwatta-maruf-1997 p.247}"
