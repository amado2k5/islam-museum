text: "كان أحب العمل إلى رسول الله الذي يدوم عليه صاحبه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب جامع الصلاة: كان أحب العمل إلى النبي الذي يدوم عليه صاحبه. ويخرّجه المحقق عند البخاري (6462) وأحمد (6/176) من طرق أصحاب مالك، ويذكر أنه في الصحيحين من طريق أبي سلمة عن عائشة وعند مسلم (2/189) من طريق القاسم عنها، ويحيل على التمهيد (22/120). {cite:muwatta-maruf-1997 p.247}"
