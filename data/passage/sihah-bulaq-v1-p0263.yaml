text: |-
  ٣٧٨
  غمرالرداء اذا تسم ضاحكا غلقت لضحكته رقاب المال
  وبحر غمر وبحار غمار وغمورأ يضايقال ما أشد غمورة هذا النهر والغمرة الشدّة والجمع غمر
  مثل نوية ونوب قال القطامى بصف سفينة نوح عليه السلام وحان لتالك الغمر انحسار
  وغمرات الموت ش_دائده والغمر أيضا القدح الصغير قال اعشى باه-ليرئى أخاه الممنتشر بن
  تكفيه حزة فلذان ألمّ بها * من الشواء ويكفى شربه الغمر
  ومنه التغمر وهو الشرب دون الروالغمرة الزحسة من الناس والماء والجمع غمارودخلت
  فى غمار الناس وغمار الناس يضم ويفتح أى فى زحتهم وكثرتهم ورجسل غمرلم يجرب الامور
  بين الغمارة من قوم أغمار والانى غمرة وقد غمر بالضم يغمر غمارة وكذلك المغهرمن الرجال
  وغامره أى باطشه وقاتله ولم يبال الموت قال أبو عمرورجسل مغامر اذا كان يقتحم المهالك
  والغمرة طلاء يتخذ من الورس وقد غمرت المرأة وجهها تغميرا أى طلت به وجهه اليصفولونها
  وتغعرت مثله والغمر بالكسر العطش قال العجاج شتى اذا مابات الاغمارا
  والغمر بالكسرأيضا الحقد والغلّ وقد غمر صدره على بالكسر يغمر غمراوغمراءن يعقوب
  والغمر أيضا بالتحريك ريح اللحم والسهك وة_دغمرت يدى من اللحم فهى غمرة أى زهمة كما
  تقول من السمك سهكة ومنه منديل الغمر والغامر من الارض خلاف العامر وقال يعضهم
  الغاهر من الارض مالم يزرع مما يحتمل الزراعة وانماقيل له غامر لان الماء يبلغه فيغمره
  وهو فاعل بمعنى مفعول كة ولهم سر كاتم وماء دافق وانمابى على فاعل ليقابل به العامر
  ومالا يلغه الماء من موات الارض لا يقال له غامر والغميرنسات أخضرة-دغمره اليبيس
  قال زهيريصف وحشا ثلاث كاقواء السراء وناشط * قد اخضرّ من لس الغمير جافله
  والانغمار الانغماس فى الماء ،غور ) غور كل شى قه ره يقال فلان بعيد الغور والغور
  المطمتن من الارض والغور تهامة ومايلى اليمن وماء غور أى غائر وصف بالمصدر كقولهم
  درهم ضرب ومامسكب وأذن حشر والغار كالكهف فى الجبل والجمع الغيران والمغارمثل
  الغاروكذلك المغارة وربمات وا-كانس الظباءمغارا قال يشر
  كأن ظباء أسنمة عليها * كوانس قالصاعنها المغار
  وتصغير الغارغو بر وفى المثل عسى الغوير أبؤسا قال الاصعى أصل أنه كان غارفيه ناس
  قانهار عليهم أو أتاهم فيه عد وفقتلوهم فصار مئلا لكل شي يخاف أن يأتى منه شرّوقال ابن
  الكاي الغور ماء لكاب و«ومعروف وهذا المثل تكامت به الزباءلما تشكب قصير اللغعى
  بالاجمال الطاريق المنهيج وأخذ على الغوير والغاران البطن والفرج قال الشاعر
  ألم ترأن الدهريوم وليلة • وأن الفتى بسعى لغاريه دائبا
  والغار الجيش يقال التقى الغاران أى الجيشان والغارضرب من الشجر ومنه دهن الغار
  قال عدى بن زيد
  رب ناربت أرمقها * تقضم الهندى والغارا
  والغار الغيرة وقال أبو ذؤيب يشبه غليان القدر بصخب الضرائر
  ضرائرر مى تفاحس غارها • والغارة الخيل المغيرة قال الشاعو
  ونحن صبحنا آل نجران غارة • تيم بن مروالرماح النوادسا
  بقول
