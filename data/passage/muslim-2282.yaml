label: { ar: "مسلم 2282 — مثل الهدى والعلم كمثل الغيث", en: "Muslim 2282 — The rain parable of guidance and knowledge" }
text: "قال النبي: إن مثل ما بعثني الله به من الهدى والعلم كمثل غيث أصاب أرضاً، فكان منها طائفة طيبة قبلت الماء فأنبتت الكلأ والعشب الكثير، وكان منها أجادب أمسكت الماء فنفع الله بها الناس، وأصاب طائفة منها أخرى إنما هي قيعان لا تمسك ماء ولا تنبت كلأ"
summary:
  ar: "رواية أبي موسى الأشعري في باب مثل ما بعث به النبي من الهدى والعلم من كتاب الفضائل في صحيح مسلم؛ الأرض الطيبة والأجادب والقيعان صور لثلاثة أصناف من الناس مع الوحي."
