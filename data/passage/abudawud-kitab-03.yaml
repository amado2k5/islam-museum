  ar: "سنن أبي داود، كتاب الاستسقاء"
  en: "Sunan Abi Dawud, Book 3: The Book Of The Prayer For Rain (Kitab al-Istisqa')"
  ur: "سنن ابی داؤد، کتاب الاستسقاء"
  es: "Sunan Abi Dawud, Libro 3: El Libro de la Oración para la Lluvia (Kitab al-Istisqa')"
summary:
  ar: "القسم 3 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاستسقاء»، ويضم فيها النصوص من 1161 إلى 1197 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 3 of Sunan Abi Dawud (The Book Of The Prayer For Rain (Kitab al-Istisqa')) in the division of the open hadith dataset the museum took its reports from: reports 1161 to 1197 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 3، عنوان «کتاب الاستسقاء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1161 تا 1197۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 3 de Sunan Abi Dawud (El Libro de la Oración para la Lluvia (Kitab al-Istisqa')) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1161 al 1197 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
