text: "… جحا وأمير الأكراد ذهب في رمضان إحدى السنين واعظاً لبعض عشاري الأكراد، وبالطبع كان بصلّي إماماً بالجماعة، ففي ذات يوم حضر أبناءُ أمير العشيرةِ، وقالوا له : نحن ما كُنَّا نحبُّ كسر خاطرك في كل حين، نظراً لكونك صائماً، ولكنَّا …"
summary:
  ar: "في رمضان وعظ جحا جماعة من أفراد القبائل الكردية وأمّهم في الصلاة، فحذره أبناء الأمير من التقدم على أبيهم الذي يقود خمسة آلاف فارس مسلح، فطلب جحا من الأمير أن يسمعه، وقال إن الأبناء جاهلون بالشرع، فقال الأمير إن لجحا أن يستمر في الإمامة ما لم يسئ الأدب. {cite:juha-nawadir-kubra-djuwaydi p. 135}"
  en: "In a Ramadan, Juha preaches to a group of Kurdish tribesmen and leads prayer. The emir's sons warn him not to lead prayer ahead of their father, who commands five thousand armed horsemen. Juha asks the emir for a hearing and says the sons are ignorant of the law, and the emir says Juha may keep leading as long as he is not disrespectful. {cite:juha-nawadir-kubra-djuwaydi p. 135}"
  ur: "ایک رمضان میں جحا کرد قبائلیوں کی ایک جماعت کو وعظ کرتا ہے اور نماز پڑھاتا ہے۔ امیر کے بیٹے اسے خبردار کرتے ہیں کہ وہ ان کے باپ سے آگے نماز نہ پڑھائے، جو پانچ ہزار مسلح سواروں کا سردار ہے۔ جحا امیر سے سننے کی درخواست کرتا ہے اور کہتا ہے کہ بیٹے شریعت سے ناواقف ہیں، تو امیر کہتا ہے کہ جحا جب تک بے ادبی نہ کرے امامت جاری رکھ سکتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 135}"
  fr: "Pendant un Ramadan, Juha prêche devant un groupe de tribus kurdes et dirige la prière. Les fils de l'émir l'avertissent de ne pas conduire la prière devant leur père, qui commande cinq mille cavaliers armés. Juha demande audience à l'émir et dit que les fils ignorent la loi, et l'émir dit que Juha peut continuer à diriger tant qu'il ne manque pas de respect. {cite:juha-nawadir-kubra-djuwaydi p. 135}"
  es: "Durante un Ramadán, Juha predica a un grupo de miembros de tribus kurdas y dirige la oración. Los hijos del emir le advierten que no dirija la oración por delante de su padre, que manda a cinco mil jinetes armados. Juha pide audiencia al emir y dice que los hijos ignoran la ley, y el emir dice que Juha puede seguir dirigiendo mientras no falte al respeto. {cite:juha-nawadir-kubra-djuwaydi p. 135}"
