label: { ar: "صحيح البخاري 7220 — الأب والأبوة", en: "Sahih al-Bukhari 7220 — the father and fatherhood", ur: "صحیح بخاری 7220 — باپ اور والدیت" }
text: "حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ مُحَمَّدِ بْنِ جُبَيْرِ بْنِ مُطْعِمٍ، عَنْ أَبِيهِ، قَالَ أَتَتِ النَّبِيَّ امْرَأَةٌ فَكَلَّمَتْهُ فِي شَىْءٍ فَأَمَرَهَا أَنْ تَرْجِعَ إِلَيْهِ، قَالَتْ يَا رَسُولَ اللَّهِ أَرَأَيْتَ إِنْ جِئْتُ وَلَمْ أَجِدْكَ، كَأَنَّهَا تُرِيدُ الْمَوْتَ، قَالَ \" إِنْ لَمْ تَجِدِينِي فَأْتِي أَبَا بَكْرٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7220، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7220 (Judgments (Ahkaam)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7220، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
