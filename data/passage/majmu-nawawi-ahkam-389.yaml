text: "… اللّٰه واسم محمد، وأراد أذبح باسم اللّٰه وأتبرك باسم محمد، فينبغى أن لا يحرم، وقول من قال : لا يجوز ذلك يمكن حمله على أن اللفظة مكروهة لأن المكروه يصح تفى الجواز والإباحة المطلقة عنه. قال : ووقعت منازعة بين …"
