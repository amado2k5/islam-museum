text: "… النَّاسِ كَافَّةً. وَقَالَ إِنَّ رَسُولَ اللَّهِ قَالَ \" إِنَّ فِي أُمَّتِي \". قَالَ شُعْبَةُ وَأَحْسِبُهُ قَالَ حَدَّثَنِي حُذَيْفَةُ. وَقَالَ غُنْدَرٌ أُرَاهُ قَالَ \" فِي أُمَّتِي اثْنَا عَشَرَ مُنَافِقًا لاَ يَدْخُلُونَ الْجَنَّةَ وَلاَ يَجِدُونَ رِيحَهَا حَتَّى يَلِجَ الْجَمَلُ فِي سَمِّ الْخِيَاطِ ثَمَانِيَةٌ مِنْهُمْ تَكْفِيكَهُمُ الدُّبَيْلَةُ سِرَاجٌ مِنَ النَّارِ يَظْهَرُ فِي أَكْتَافِهِمْ حَتَّى يَنْجُمَ مِنْ صُدُورِهِمْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7036، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 7036 (Characteristics of The Hypocrites And Rulings Concerning Them), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 7036، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
