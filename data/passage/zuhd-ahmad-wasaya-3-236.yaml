text: "… اللّٰه والحمد لله ولا إله إلا اللّه واللّه أكبر. حدثنا عبداللّه حدثنا أبي حدثنا حجاج حدثنا ليث حدثي عقيل عن ابن شهاب أن سعد بن أبي وقاص لما حضره الموت دعا بخاق جبة له صوف فقال كفنوني فيها زإني كنت …"
