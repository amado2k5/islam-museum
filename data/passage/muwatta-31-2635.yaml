label: { ar: "الموطأ 2635 — ابن عمر: النبي يقول لمن يعظ أخاه في الحياء دعه فإن الحياء من الإيمان", en: "Muwatta 2635", es: "Muwatta 2635", fr: "Muwatta 2635", ur: "موطا 2635", tr: "El-Muvatta 2635 — İbn Ömer: Peygamber, kardeşine iffet konusunda öğüt verene şöyle buyurdu: Onu rahat bırak, çünkü iffet imanın bir parçasıdır.", id: "Al-Muwatta 2635 — Ibn Umar: Nabi bersabda kepada orang yang menasihati saudaranya tentang kesopanan: Biarkan saja dia, karena kesopanan adalah bagian dari iman." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر أن رسول الله مر على رجل وهو يعظ أخاه في الحياء، فقال: دعه، فإن الحياء من الإيمان. ويذكر المحقق اختلاف الرواة عن مالك في إسناده، وأن ابن عبد البر نقل رواية وكيع عنه بذكر الأب، ورأى ابن معين أنه مرسل. {cite:muwatta-maruf-1997 p.491}"
  tr: "Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan, o da Abdullah ibn Ömer'den rivayet ederek, Allah Resulü'nün, kardeşine iffet konusunda öğüt veren bir adamın yanından geçerken şöyle buyurduğunu naklettiğini belirtir: \"Onu bırakın, çünkü iffet imanın bir parçasıdır.\" Araştırmacı, Malik'in rivayetlerinde isnad zinciriyle ilgili farklılıklar olduğunu ve İbn Abdül-Barr'ın, babayı da anarak Vaki'nin rivayetini kendi isnadıyla naklettiğini, İbn Ma'in'in ise bunu mursal (isnad zincirinde eksik bir halka bulunan) olarak değerlendirdiğini belirtir. {cite:muwatta-maruf-1997 s.491}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Salim ibn Abdullah, dari Abdullah ibn Umar, bahwa Rasulullah SAW melewati seorang laki-laki yang sedang menasihati saudaranya tentang kesopanan, dan berkata: \"Biarkan saja dia, karena kesopanan adalah bagian dari iman.\" Peneliti menyebutkan perbedaan dalam riwayat Malik mengenai sanadnya, dan bahwa Ibn Abd al-Barr meriwayatkan riwayat Waki atas otoritasnya, dengan menyebutkan sang ayah, sedangkan Ibn Ma'in menganggapnya sebagai mursal (riwayat dengan mata rantai yang hilang dalam sanadnya). {cite:muwatta-maruf-1997 p.491}"
