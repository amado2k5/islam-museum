label: { ar: "الموطأ 2635 — ابن عمر: النبي يقول لمن يعظ أخاه في الحياء دعه فإن الحياء من الإيمان", en: "Muwatta 2635" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر أن رسول الله مر على رجل وهو يعظ أخاه في الحياء، فقال: دعه، فإن الحياء من الإيمان. ويذكر المحقق اختلاف الرواة عن مالك في إسناده، وأن ابن عبد البر نقل رواية وكيع عنه بذكر الأب، ورأى ابن معين أنه مرسل. {cite:muwatta-maruf-1997 p.491}"
