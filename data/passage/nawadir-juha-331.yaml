text: "… ضيف اللَّه يذهب لبيت اللَّه كان أحد القرويين قد قلّ حياؤُهُ، وتجرد من فضائل الأخلاق، فلا يتعاطى شغلاً، إنما جعل التسول دأبَه، فلا يذهب من دارٍ أتى إليها، ما لم يأخذ شيئاً، وكان يطلب من بعضهم ثياباً، ومن البعض طعاماً، …"
summary:
  ar: "ألح متسول في قرية على جحا طالباً ملابس وطعاماً، فقال له جحا «تعال معي» وأخذه إلى المسجد، وقال له إنه أخطأ البيت، فهذا بيت الله وهو ضيف الله. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  en: "A village beggar pesters Juha for clothes and food; Juha says 'come with me', takes him to the mosque, and says he came to the wrong house, since this is God's house and he is the guest of God. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  ur: "گاؤں کا ایک فقیر جحا سے کپڑے اور کھانا مانگ کر اسے تنگ کرتا رہا، تو جحا نے کہا «میرے ساتھ آؤ» اور اسے مسجد لے گیا، اور کہا کہ تم غلط گھر آ گئے ہو، یہ اللہ کا گھر ہے اور تم اللہ کے مہمان ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  fr: "Un mendiant du village importune Juha pour obtenir des vêtements et de la nourriture ; Juha dit « viens avec moi », l'emmène à la mosquée et lui dit qu'il s'est trompé de maison, car c'est la maison de Dieu et lui est l'hôte de Dieu. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  es: "Un mendigo de la aldea importuna a Juha pidiéndole ropa y comida; Juha le dice «ven conmigo», lo lleva a la mezquita y le dice que se equivocó de casa, pues esta es la casa de Dios y él es el huésped de Dios. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
