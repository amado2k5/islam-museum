label: { ar: "الموطأ 948 — سليمان بن يسار: أن رسول الله عام حجة الوداع خرج إلى الحج، فمن أصحابه من أهل بحج، ومنهم من جمع الحج والعمرة، ومنهم من أهل بعمرة؛ فمن أهل بحج أو جمع فلم يحل", en: "Muwatta 948" }
summary:
  ar: "يرويه مالك عن محمد بن عبد الرحمن عن سليمان بن يسار، أن رسول الله عام حجة الوداع خرج إلى الحج، فمن أصحابه من أهل بحج، ومنهم من جمع الحج والعمرة، ومنهم من أهل بعمرة. فأما من أهل بحج أو جمع الحج والعمرة فلم يحل، وأما من أهل بعمرة فحل. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1078) وسويد (506)، ويحيل على أحاديث عائشة. {cite:muwatta-maruf-1997 p.452} {cite:muwatta-maruf-1997 p.453}"
