label: { ar: "الموطأ 948 — سليمان بن يسار: أن رسول الله عام حجة الوداع خرج إلى الحج، فمن أصحابه من أهل بحج، ومنهم من جمع الحج والعمرة، ومنهم من أهل بعمرة؛ فمن أهل بحج أو جمع فلم يحل", en: "Muwatta 948", es: "Muwatta 948", fr: "Muwatta 948", ur: "موطا 948", tr: "El-Muvatta 948 — Süleyman ibn Yasar: Allah Resulü, Veda Hac yılında Hacca çıktı. Sahabelerinden bazıları Hac için ihrama girdi, bazıları Hac ve Umreyi birleştirdi, bazıları da Umre için ihrama girdi. Hac veya Hac ve Umreyi birleştirmek için ihrama girenler ihrama çıkmadılar.", id: "Al-Muwatta 948 — Sulayman ibn Yasar: Rasulullah SAW, pada tahun Haji Perpisahan, berangkat menunaikan ibadah haji. Sebagian sahabatnya memasuki keadaan ihram untuk haji, sebagian lagi menggabungkan haji dan umrah, dan sebagian lagi memasuki keadaan ihram untuk umrah. Mereka yang memasuki keadaan ihram untuk haji atau menggabungkan haji dan umrah tidak keluar dari keadaan ihram." }
summary:
  ar: "يرويه مالك عن محمد بن عبد الرحمن عن سليمان بن يسار، أن رسول الله عام حجة الوداع خرج إلى الحج، فمن أصحابه من أهل بحج، ومنهم من جمع الحج والعمرة، ومنهم من أهل بعمرة. فأما من أهل بحج أو جمع الحج والعمرة فلم يحل، وأما من أهل بعمرة فحل. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1078) وسويد (506)، ويحيل على أحاديث عائشة. {cite:muwatta-maruf-1997 p.452} {cite:muwatta-maruf-1997 p.453}"
  id: "Malik meriwayatkannya dari Muhammad ibn Abd al-Rahman, dari Sulayman ibn Yasar, bahwa Rasulullah shalla Allahu alaihi wa sallam melaksanakan ibadah haji pada saat Haji Perpisahan. Sebagian sahabatnya memasuki keadaan ihram untuk haji, sebagian menggabungkan haji dan umrah, dan sebagian lagi memasuki keadaan ihram untuk umrah. Mereka yang memasuki keadaan ihram untuk haji atau menggabungkan haji dan umrah tidak keluar dari keadaan ihram, sedangkan mereka yang memasuki keadaan ihram untuk umrah keluar dari keadaan ihram. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1078) dan Suwayd (506), dan beliau merujuk pada hadits Aisyah. {cite:muwatta-maruf-1997 p.452} {cite:muwatta-maruf-1997 p.453}"
