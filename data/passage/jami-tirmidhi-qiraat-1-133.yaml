text: "… الْبَابِ عَنْ أَنَسِ وجابِرٍ وسَهْلِ ابْنِ سَعْدٍ وأُبَيِّ بْنِ كَعْبٍ وابْنِ عَبَّاسٍ وأُمِّ سَلَمَةَ قَالَ أَبُو عِيسَى: حَدِيثُ ابْنِ عُمَرَ حَدِيثٌ حَسَنٌ غَرِيبٌ صَحِيحٌ. ومُعاذُ بْنُ الْعَلَاءِ هُوَ بَصْرِيٌّ وهُوَ أَخُو أَبِي عَمْرِو بْنِ الْعَلَاءِ. المعجم - باب ما جاء …"
