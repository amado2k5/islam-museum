summary:
  ar: "القسم 93 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأحكام»، ويضم فيها النصوص من 7137 إلى 7225 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 93 of Sahih al-Bukhari (Judgments (Ahkaam)) in the division of the open hadith dataset the museum took its reports from: reports 7137 to 7225 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 93، عنوان «کتاب الاحکام»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7137 تا 7225۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 93 de Sahih al-Bukhari (Juicios (Ahkaam)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 7137 a 7225 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 93 du Sahih al-Bukhari (Jugements (Ahkaam)), soit les hadiths 7137 à 7225 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 93. bölümü \"Hükümler Kitabı\" başlığını taşımakta olup, 7137'den 7225'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 93 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Hukum\" dan berisi teks 7137 hingga 7225, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
