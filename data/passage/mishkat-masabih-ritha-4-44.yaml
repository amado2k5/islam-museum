text: "… له: من ربك؟ الدُّجَارَفِ الْآَخِرَةِ فيقول: ربي اله، ونمي محمد. متفق عليه. - وعن أنس ب، قال: قال رسول اللّٰه : إن العبد إذا وضع في قيره، وقولى عنه أصحابه وإنه ليسمع قرع نعاهم أتاه ملكان فيقعداته، فيقولان: ما كنت …"
