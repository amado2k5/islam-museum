label: { ar: "صحيح البخاري 2544 — الأجران", en: "Sahih al-Bukhari 2544 — the double reward", ur: "صحیح بخاری 2544 — دوہرا اجر", es: "Sahih al-Bukhari 2544 — la doble recompensa", fr: "Sahih al-Bukhari 2544 — la double récompense", tr: "Sahih el-Buhari 2544 — İki Ödül", id: "Sahih al-Bukhari 2544 — Dua Pahala" }
text: "حَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، سَمِعَ مُحَمَّدَ بْنَ فُضَيْلٍ، عَنْ مُطَرِّفٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى ـ قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ كَانَتْ لَهُ جَارِيَةٌ فَعَالَهَا، فَأَحْسَنَ إِلَيْهَا ثُمَّ أَعْتَقَهَا وَتَزَوَّجَهَا، كَانَ لَهُ أَجْرَانِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2544، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 2544 (Manumission of Slaves), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 2544، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2544 (Manumisión de esclavos), habla de la doble recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 2544 (Affranchissement des esclaves), évoque la double récompense. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, écrivent, effacent ou pèsent un acte."
  tr: "Sahih el-Buhari'de 2544 numaralı hadis, iki tür mükafattan bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2544, menyebutkan dua pahala. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
