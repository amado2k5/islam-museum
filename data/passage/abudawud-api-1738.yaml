label: { ar: "سنن أبي داود 1738 — الأب والأبوة", en: "Sunan Abi Dawud 1738 — the father and fatherhood", ur: "سنن ابی داؤد 1738 — باپ اور والدیت", es: "Sunan Abi Dawud 1738 — El padre y la paternidad" }
text: "… سُلَيْمَانُ بْنُ حَرْبٍ، حَدَّثَنَا حَمَّادٌ، عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ طَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ، وَعَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، قَالاَ وَقَّتَ رَسُولُ اللَّهِ بِمَعْنَاهُ قَالَ أَحَدُهُمَا وَلأَهْلِ الْيَمَنِ يَلَمْلَمَ. وَقَالَ أَحَدُهُمَا أَلَمْلَمَ قَالَ \" فَهُنَّ لَهُمْ وَلِمَنْ أَتَى عَلَيْهِنَّ مِنْ غَيْرِ أَهْلِهِنَّ مِمَّنْ كَانَ يُرِيدُ الْحَجَّ وَالْعُمْرَةَ وَمَنْ كَانَ دُونَ ذَلِكَ. - قَالَ ابْنُ طَاوُسٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1738، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1738 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1738، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1738 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
