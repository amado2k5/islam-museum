label: { ar: "الموطأ 2652 — أبو هريرة: نساء كاسيات عاريات لا يدخلن الجنة ولا يجدن ريحها", en: "Muwatta 2652", es: "Muwatta 2652", fr: "Muwatta 2652", ur: "موطا 2652", tr: "El-Muvatta 2652 — Ebu Hurayra: Giysili oldukları halde çıplak olan kadınlar cennete giremeyecekler, hatta cennetin kokusunu bile alamayacaklar.", id: "Al-Muwatta 2652 — Abu Hurairah: Wanita yang berpakaian tetapi telanjang tidak akan masuk surga, dan mereka pun tidak akan mencium aromanya." }
summary:
  ar: "يروي مالك عن مسلم بن أبي مريم عن أبي صالح عن أبي هريرة أنه قال: نساء كاسيات عاريات مائلات مميلات، لا يدخلن الجنة، ولا يجدن ريحها، وريحها يوجد من مسيرة خمسمائة سنة. {cite:muwatta-maruf-1997 p.499} {cite:muwatta-maruf-1997 p.500}"
  tr: "Malik, Müslim ibn Ebu Meryem'den, o da Ebu Salih'ten, o da Ebu Hurayra'dan rivayet ederek şöyle buyurmuştur: \"Giysili oldukları halde çıplak olan, kötülüğe meyilli olan ve başkalarını da kötülüğe meyilli kılan kadınlar cennete giremezler, hatta cennetin kokusunu bile alamazlar; oysa cennetin kokusu beş yüz yıllık yolculuk mesafesinden bile duyulabilir.\" {cite:muwatta-maruf-1997 s.499} {cite:muwatta-maruf-1997 s.500}"
  id: "Malik meriwayatkan dari Muslim ibn Abi Maryam, dari Abu Salih, dari Abu Hurayrah, yang berkata: “Wanita yang berpakaian namun telanjang, cenderung kepada kejahatan dan menyebabkan orang lain cenderung kepada kejahatan, tidak akan masuk Surga, bahkan tidak akan mencium aromanya, padahal aromanya dapat tercium dari jarak lima ratus tahun perjalanan.” {cite:muwatta-maruf-1997 p.499} {cite:muwatta-maruf-1997 p.500}"
