label: { ar: "سنن أبي داود 2730 — ما حُرّم", en: "Sunan Abi Dawud 2730 — what was made unlawful", ur: "سنن ابی داؤد 2730 — جو حرام کیا گیا" }
text: "… بْنِ زَيْدٍ، قَالَ حَدَّثَنِي عُمَيْرٌ، مَوْلَى آبِي اللَّحْمِ قَالَ شَهِدْتُ خَيْبَرَ مَعَ سَادَتِي فَكَلَّمُوا فِيَّ رَسُولَ اللَّهِ فَأَمَرَ بِي فَقُلِّدْتُ سَيْفًا فَإِذَا أَنَا أَجُرُّهُ فَأُخْبِرَ أَنِّي مَمْلُوكٌ فَأَمَرَ لِي بِشَىْءٍ مِنْ خُرْثِيِّ الْمَتَاعِ. قَالَ أَبُو دَاوُدَ مَعْنَاهُ أَنَّهُ لَمْ يُسْهِمْ لَهُ. قَالَ أَبُو دَاوُدَ وَقَالَ أَبُو عُبَيْدٍ كَانَ حَرَّمَ اللَّحْمَ عَلَى نَفْسِهِ فَسُمِّيَ آبِي اللَّحْمِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2730، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2730 (Jihad (Kitab Al-Jihad)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2730، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
