ref: "2730"
label: { ar: "سنن أبي داود 2730 — ما حُرّم", en: "Sunan Abi Dawud 2730 — what was made unlawful", ur: "سنن ابی داؤد 2730 — جو حرام کیا گیا", es: "Sunan Abi Dawud 2730: lo que se declaró ilegal", fr: "Sunan Abi Dawud 2730 — ce qui a été rendu illégal", tr: "Sunan Abi Davud 2730 — Yasak olan nedir?", id: "Sunan Abi Dawud 2730 — Apa yang dilarang" }
text: "… بْنِ زَيْدٍ، قَالَ حَدَّثَنِي عُمَيْرٌ، مَوْلَى آبِي اللَّحْمِ قَالَ شَهِدْتُ خَيْبَرَ مَعَ سَادَتِي فَكَلَّمُوا فِيَّ رَسُولَ اللَّهِ فَأَمَرَ بِي فَقُلِّدْتُ سَيْفًا فَإِذَا أَنَا أَجُرُّهُ فَأُخْبِرَ أَنِّي مَمْلُوكٌ فَأَمَرَ لِي بِشَىْءٍ مِنْ خُرْثِيِّ الْمَتَاعِ. قَالَ أَبُو دَاوُدَ مَعْنَاهُ أَنَّهُ لَمْ يُسْهِمْ لَهُ. قَالَ أَبُو دَاوُدَ وَقَالَ أَبُو عُبَيْدٍ كَانَ حَرَّمَ اللَّحْمَ عَلَى نَفْسِهِ فَسُمِّيَ آبِي اللَّحْمِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2730، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2730 (Jihad (Kitab Al-Jihad)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2730، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2730 (Yihad (Kitab Al-Jihad)), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2730 (Jihad), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da 2730 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri içermektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2730, menyebutkan apa yang dilarang. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
