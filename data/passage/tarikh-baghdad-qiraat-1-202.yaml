text: "… المدائنى -. حلام بن سليما وهو ابن أخى شبابة بن سوار، سكن دمشق بأخرة، وحدث عن مغيرة بن مسلم ابو المنذر الضر السراج، ومسلمة بن الصلت، وعبد الرحمن المسعودى، وشعبة بن الحجاج، وأبى عمرو بن العلاء، وورقاء بن عمر، وبكر …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 202، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 1, p. 202, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 1، ص 202 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh Baghdad de al-Khatib al-Baghdadi, volumen 1, pág. 202, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Tarikh Bagdad d'al-Khatib al-Baghdadi, volume 1, page 202, mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Hatib el-Bağdadi'nin \"Bağdat Tarihi\" adlı eserinin 1. cildinin 202. sayfasında şu ayetler geçmektedir; makine tarafından okunabilir taranmış versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Sejarah Baghdad\" karya Al-Khatib Al-Baghdadi, Jilid 1, halaman 202, menyebutkan bacaan-bacaan berikut; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
