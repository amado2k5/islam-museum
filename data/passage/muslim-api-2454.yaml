label: { ar: "صحيح مسلم 2454 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 2454 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 2454 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 2454 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 2454 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا ابْنُ فُضَيْلٍ، عَنْ عُمَارَةَ بْنِ الْقَعْقَاعِ، بِهَذَا الإِسْنَادِ وَقَالَ بَيْنَ أَرْبَعَةِ نَفَرٍ زَيْدُ الْخَيْرِ وَالأَقْرَعُ بْنُ حَابِسٍ وَعُيَيْنَةُ بْنُ حِصْنٍ وَعَلْقَمَةُ بْنُ عُلاَثَةَ أَوْ عَامِرُ بْنُ الطُّفَيْلِ. وَقَالَ نَاشِزُ الْجَبْهَةِ. كَرِوَايَةِ عَبْدِ الْوَاحِدِ. وَقَالَ إِنَّهُ سَيَخْرُجُ مِنْ ضِئْضِئِ هَذَا قَوْمٌ وَلَمْ يَذْكُرْ \" لَئِنْ أَدْرَكْتُهُمْ لأَقْتُلَنَّهُمْ قَتْلَ ثَمُودَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2454، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2454 (The Book of Zakat), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 2454، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 2454 (El Libro del Zakat), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih Muslim, n° 2454 (Le Livre de la Zakat), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
