label: { ar: "سنن ابن ماجه 1616 — الجراحة والختان والجبائر", en: "Sunan Ibn Majah 1616 — surgery, circumcision and splints", ur: "سنن ابن ماجہ 1616 — جراحت، ختنہ اور پٹیاں", es: "Sunan Ibn Majah 1616 — Cirugía, circuncisión y férulas", fr: "Sunan Ibn Majah 1616 — chirurgie, circoncision et attelles", tr: "Sunan İbn Majah 1616 — Cerrahi, Sünnet ve Ateller", id: "Sunan Ibn Majah 1616 — Pembedahan, Sunat dan Bidai" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، قَالَ حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ الدَّرَاوَرْدِيُّ، قَالَ حَدَّثَنَا سَعْدُ بْنُ سَعِيدٍ، عَنْ عَمْرَةَ، عَنْ عَائِشَةَ، قَالَتْ: قَالَ رَسُولُ اللَّهِ ـ \" كَسْرُ عَظْمِ الْمَيِّتِ كَكَسْرِهِ حَيًّا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1616، يذكر الجراحة والختان والجبائر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1616 (Chapters Regarding Funerals), that mentions surgery, circumcision and splints. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1616، جس میں جراحت، ختنہ اور پٹیاں کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1616 (Capítulos sobre los funerales), menciona la cirugía, la circuncisión y las férulas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 1616 (Chapitres relatifs aux funérailles), mentionne la chirurgie, la circoncision et les attelles. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 1616 numaralı hadiste cerrahi, sünnet ve atelden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1616, menyebutkan tentang pembedahan, sunat, dan bidai. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
