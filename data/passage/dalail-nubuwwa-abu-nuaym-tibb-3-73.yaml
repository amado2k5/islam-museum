text: "… بن حمد ان قال ثنا الحسن بن سفيان قال ثناهدبة وشيبان قالا ثناحاد بن ميلة قال ثنائابت عن انس ان جبر ثيل التى النبي وهو يلعب مع الغلمان فاخذه فصرعه فشق بطنه فاستخرجه ثم استخرج من قلبه علقة سودا، فقال …"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، المجلد المصوَّر 3، ص 73، يذكر أطوار خلق الجنين، وشق الصدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, scan volume 3, p. 73, that mentions the stages of the embryo, the opening of the chest; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، ابو نعیم، اسکین جلد 3، ص 73 کا اقتباس جس میں جنین کے مراحل، شقِّ صدر کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de Abu Nu'aym, volumen escaneado 3, pág. 73, que menciona las etapas del embrión, la apertura del tórax; de la lectura automática del escaneo, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Dala'il al-Nubuwwa d'Abu Nu'aym, volume 3 scanné, p. 73, qui mentionne les stades de l'embryon, l'ouverture de la poitrine; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nu'aym'ın Peygamberliğin Alametleri adlı eserinin resimli 3. cildinin 73. sayfasından bir bölüm; embriyonik yaratılışın aşamalarından ve göğsün yarılmasından bahsediliyor; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Tanda-Tanda Kenabian karya Abu Nu’aym, jilid bergambar 3, hlm. 73, yang menyebutkan tahapan penciptaan embrio dan pembelahan dada; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
