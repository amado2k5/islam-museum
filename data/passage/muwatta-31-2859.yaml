label: { ar: "الموطأ 2859 — لقمان يوصي ابنه: جالس العلماء وزاحمهم بركبتيك", en: "Muwatta 2859", es: "Muwatta 2859", fr: "Muwatta 2859", ur: "موطا 2859", tr: "Al-Muwatta 2859 — Lokman oğluna şöyle öğüt verir: Âlimlerle birlikte otur ve dizlerini onların üzerine yasla.", id: "Al-Muwatta 2859 — Luqman menasihati putranya: Duduklah bersama para ulama dan tempelkan lututmu pada mereka." }
summary:
  ar: "بلغ مالكا أن لقمان الحكيم أوصى ابنه فقال: يا بني، جالس العلماء وزاحمهم بركبتيك، فإن الله تعالى يحيي القلوب بنور الحكمة، كما يحيي الأرض الميتة بوابل السماء. {cite:muwatta-maruf-1997 p.602}"
  tr: "Malik, Lokman'ın oğluna şöyle naklettiğini rivayet etmiştir: \"Oğlum, âlimlerle birlikte otur ve onlara yakın dur; çünkü Yüce Allah, tıpkı gökten yağan yağmurla ölü toprağı canlandırdığı gibi, kalpleri de hikmet nuruyla canlandırır.\" {cite:muwatta-maruf-1997 s.602}"
  id: "Malik meriwayatkan bahwa Luqman yang Bijaksana menasihati putranya, katanya: \"Wahai putraku, duduklah bersama para ulama dan dekatlah dengan mereka, karena Allah Yang Maha Kuasa menghidupkan kembali hati dengan cahaya kebijaksanaan, sebagaimana Dia menghidupkan kembali bumi yang mati dengan hujan dari langit.\" {cite:muwatta-maruf-1997 p.602}"
