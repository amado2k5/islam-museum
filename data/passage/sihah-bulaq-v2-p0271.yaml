text: |-
  ٢١٦
  •⁦(فصل العين)⁩.
  •⁦(غم)⁩.
  قان قدعات واذا قال تعلم أت زيد اخارج لم تقل قد تعات وتعالمه الجهيع أى علموه والايام
  المعلومات عشر من ذى الجة وقولهم علمبنوفلان يريدون على الماء فيحذفون اللام تخفيذا
  والمعلم الاثر يستدل به على الطريق والعلام بالضم والتشسديد الحناه والعيلم الركية المكثيرة
  الماء وقال * من العياليم الخسف* والعيلم التارّ الناعم والعيلام الذكر من الضباع والعام
  الخلق والجمع العوالم والعالمون أصناف انخلق ⁦(عليم)⁩ العلجوم الذ كرمن الضفادع
  والعلجوم الماءالغمر انكثير والعلجوم ظلمة الليل والعلجوم من الابل الشديدة وقال الكلابى
  العلاجيم:داد الاإل وخبارها ⁦(علقم)⁩ العلقم شنجرمر ويقال للحنظل وا-كل شئ
  مزعلقم وعلقمة بن عبدة الشاعر وهو الفدل وعلقمة انلصىّ وهما بميعا من ربعة الجموع
  وأما علقمة بن علاثة فهو من بى جعقر ⁦(علمكم)⁩ المعلكوم الشديدة من الابل مغسل
  العلجوم الذكر والاتى فيه -واء قال ابيده نسقى المعاجر بازل علكوم• والعلاكم العظام
  من الابل مم العم أخو الاب والجمع أعمام وعمومة مثل البعولة يتمال ماكنت عما
  واقد عمت عمومة وبيي وبين فلان عمومة كما يقال أبوّة وخولة ويقال يا ابن عى ويا ابن
  عتمّ ويا ا بن عمّ ثلاث لغات وقول أبى النجم •يا ابنة عمالا تلومى واهجمى * أراد عمامبها الندبة
  وعتمّ يتسالون أصله عما فذفت منه الالف فى الاستفهام والعم بجاعة من الناس قال
  المرقس
  والعدوبين المجلسيناذا • آدالغشىّ وتنادى العم
  والمعمّ المخول الكثير الاعمام والاخوال والمكريهم وقد يكسران وتقول هما ابفاعمّ ولا تقل
  ه-ما ابنا خال وتقول هما ابناخاة ولا تقل هما ابناعمة واستعممته عماأى اتخذته عما
  وتعممته اذادعوته عماعن أبى زيد والعمامة واحدة العمائم وعمته أليسسته العمامة
  وعم الرجل سوّدلان العمائم نيجان العرب كماقيل فى العجم توج واعتم بالعمامة وتعمم بها
  بيعنى وفلان حسن العمة أى حس-ن الاعتمام واءتم النبت اكثهل ويقال المشاب اذ اطال
  قداعتم" وشيء عميم أى تاتم وابهع عم منسل سرير وسر رور غيف ورغف ويقال استوى فلان
  على عممه ير يدون به تمام جسهمه وشبابه وماله وفى حديث عروة بن الزبيرحين ذكرأحيحة بن
  الجلاح وقول اخواله فيه كنا أهل ثمه ورته حتى استوى على عممه وقد يشدد للازدواج
  ونخلة عميمة ونخيل عمّ اذاكانت طوالاوامرأة عميمة تامة القوام والخلق والعسميم
  يبيس البهمى وهو من عميمهم أى صميمهم وجسم عمم أى تام وقال
  وانّ عرارا ان يكن غير واضح • فانى أحبالجون ذا المضكب العمم
  والعامّسة خلاف الخاصة وعمّ الذى يتم عموماشمل الجماعة بقال عمهم بالعطية والعمية
  مثل العسة السكبر والعماعم الجماعات المتفرّقون قال لسد
  ا-كى لا يكون السندرى ديدتى • وأجعل أقواما عموماعماعما
  أى أجعل أقوا ما مجتمعين فرقا وهذا كما قال أبو قيس بن الاسات
  تم تحلت ولناغاية • من بينجع غير بماع
  وعمم اللبن أرنى كأن رغونه شبهت بالعمامة ومعتمّ اسم رجل قال عروة
  أيه لْ معتم وزيد ولم أقم * على ندب يوماولى ننس مخطر
  والع.م
