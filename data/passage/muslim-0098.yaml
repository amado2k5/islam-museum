text: "قال رسول الله: «من حمل علينا السلاح فليس منا»"
summary:
  ar: "رواية عبد الله بن عمر في باب تحريم حمل السلاح على المسلمين من كتاب الإيمان في صحيح مسلم؛ يجعل توجيه السلاح إلى مسلم خروجاً من جمعتهم."
  tr: "Sahih Müslim'deki İman Kitabı'nda Müslümanların silah taşımasının yasaklanması bölümünde Abdullah bin Ömer'in rivayetine göre, bir Müslümana silah doğrultmak, o Müslümanın topluluğundan ayrılma eylemi olarak nitelendirilir."
  id: "Riwayat Abdullah bin Omar dalam bab tentang larangan umat Islam membawa senjata dari Kitab Iman dalam Sahih Muslim menyatakan bahwa mengarahkan senjata kepada seorang Muslim merupakan tindakan meninggalkan komunitas mereka."
