label: { ar: "الموطأ 2730 — صفوان بن سليم: أنا وكافل اليتيم في الجنة كهاتين", en: "Muwatta 2730", es: "Muwatta 2730", fr: "Muwatta 2730", ur: "موطا 2730", tr: "El-Muvatta 2730 — Safvan bin Salim: Ben ve bir yetime himaye eden kişi, cennette şu iki (parmak) gibi olacağız.", id: "Al-Muwatta 2730 — Safwan bin Salim: Aku dan orang yang menafkahi anak yatim akan berada di Surga seperti kedua jari ini." }
summary:
  ar: "يروي مالك عن صفوان بن سليم أنه بلغه أن النبي قال: أنا وكافل اليتيم له أو لغيره في الجنة كهاتين، إذا اتقى، وأشار بإصبعيه الوسطى والتي تلي الإبهام. {cite:muwatta-maruf-1997 p.537}"
  tr: "Malik, Safvan ibn Salim'den rivayetle, Peygamberimizin şöyle buyurduğunu işittiğini aktarır: “Ben ve yetime himaye eden kimse, akrabası olsun olmasın, Allah'tan korkarsa, şu ikisi gibi cennette olacağız.” ve orta ve işaret parmaklarıyla işaret etti. {cite:muwatta-maruf-1997 s.537}"
  id: "Malik meriwayatkan dari Safwan bin Salim bahwa ia mendengar Nabi bersabda: “Aku dan orang yang menafkahi anak yatim, baik kerabatnya atau bukan, akan berada di Surga seperti kedua orang ini, jika ia takut kepada Allah,” lalu beliau menunjuk dengan jari tengah dan jari telunjuknya. {cite:muwatta-maruf-1997 p.537}"
