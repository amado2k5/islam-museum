text: |-
  ٥٣٨
  وقد أقوى الناءراقواء والقى القفر قال العجاج قى تن-صيها بلادقى • وكذلك القوا
  والقواء بالمدوالقصر ومنزل قواء أى لا أنيس به قال حرير:
  ألا حييا الربع القبواء وسلما • وربعا كجتمان المهامة أدهما
  يقال أقوت الداروقوين أيضا أى خلت وأقوى القوم صادوا بالقواء وبات ذسلان القواء
  وبات القفراذابات جائ.ا على غير طعم وقال
  واتى لا ختار الواطاوى الحشا • محافظة من أن يقال ائيم
  وقواسم موضع بيزفيد والتباج وقال • وحات سليمى بطن قوفعرعرا • والقواء بالفتح
  الأرض التى لم تطربين أرضير ممط ورتين وقوى الضعيف قوة فه وقوىّ وتقوى مثله وقويته
  أناتوية وقاويته فقويته أى غلبته وقوى المطرأيضا اذا احتبس واغالم تدغم قوى وأدغمت
  حى تلاختلاف الحرفين وهما ستحرّ كان وأدغمت فى قولاك لويت ليا وأصله لو يا مع اختلافه ها
  لان الأولى منه-ماساكنة قلبتها يا وأدغمت وتقول اشترى الشركاء شيائم اقتووه أى
  تزايدومحتى بلغ غاية تنه وقوقيت مثل ضوضيت والدجاجة تقوقى أى تصيح قوفاة وقيقاه
  على فعلل فعالة وفعلالا والياءمبدلة من واولانها بمنزله ضعضعت كزرفيها الداء والمين
  والقيقاءة الاوض الغليظة وقدذ كرناه فى باب القاف فى ترجة قوق (قها أقهى الرجل
  من الطعام اذا اجتواه وقل طعمه مثل أقهم والقهوة الجريقال سميت بذلفت لانهاتهى
  أى تذهب بشهوة الطعام والقاهى الحديد الفؤاد المستطار قال الراجز
  راحت كاراح أبورثال • قاهى الفؤاددتب الاجفال
  حنذت الفرس فلم تعرف قيل بكا الفرس قال أبو الغوث وكذلك اذا كتم الربووكيا
  الزنداذا لم تخرج ناره وأكباه صاحبه اذادخن ولم يوروكبوت الشى اذا كسهته وكبوت
  الكوزوغيره : ذاصبيت مافيه والكيامقصورالمكناسة والجمع الا كباء مثل معى وأمعاء
  والسكبمثله والجمع كبون قال السكميت
  وبالعذوات منبتنانضار * ونبع لافصافصر في كبينا
  والكاء عدود ضرب من العود وقال » ورندا ولبنى والكباء المقترا * يقال من- كبي توبه بالتشديد
  أى بخره وتكى واكتى أى تخر والكبومثل الوقفة تكون منك اجل عند الشى تكرهه ان
  السكت خيت النارأى مكن لمبها وكيت اذاغطاها الرماد والهر تحته وهمدت اذاطت
  ولم يبق منهاشئ البقة وفلان كابى الرماد أى عظيم الرمادينهال ⁦( كتى)⁩ قال انطليل
  اكتوتى الرج-ل اذا بالغ فى صفة نفسه من غير عمل وا كتوتى اذا تتعتع كما كنوة
  بالفتح اسم شاعر كدى الكدية الارض الصلبة يقال ضب كدية وجعها كدى
  وأكدى الحافراذا بلغ الكدية فلا يمكنه أن يعفر وحفرفأ كدى اذا بلغ الى الصلب أبوزيد
  كدت الارض تكدوكد وافهى كادية اذا أيه أنباتها قال وكدى الجروبالكسريكدى كدى
  وهوداء بأخذ الجراءخاصة يصيبها منه فىء وسعال حتى يكوى بين عينيه وكديت أصابع
  أيضا أى كات من الحفر وكدى الفصيل كدى اذاشرب اللبن ففسدجوفه وأكديت الرجل
