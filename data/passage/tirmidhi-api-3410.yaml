text: "… \". قَالَ فَأَنَا رَأَيْتُ رَسُولَ اللَّهِ يَعْقِدُهَا بِيَدِهِ قَالَ \" فَتِلْكَ خَمْسُونَ وَمِائَةٌ بِاللِّسَانِ وَأَلْفٌ وَخَمْسُمِائَةٍ فِي الْمِيزَانِ وَإِذَا أَخَذْتَ مَضْجَعَكَ تُسَبِّحُهُ وَتُكَبِّرُهُ وَتَحْمَدُهُ مِائَةً فَتِلْكَ مِائَةٌ بِاللِّسَانِ وَأَلْفٌ فِي الْمِيزَانِ فَأَيُّكُمْ يَعْمَلُ فِي الْيَوْمِ وَاللَّيْلَةِ أَلْفَيْنِ وَخَمْسَمِائَةِ سَيِّئَةٍ \". قَالُوا وَكَيْفَ لاَ يُحْصِيهَا قَالَ \" يَأْتِي أَحَدَكُمُ الشَّيْطَانُ وَهُوَ فِي صَلاَتِهِ فَيَقُولُ اذْكُرْ كَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3410، يذكر الميزان. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3410 (Chapters on Supplication), that speaks of the Scale. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3410، جس میں میزان کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
