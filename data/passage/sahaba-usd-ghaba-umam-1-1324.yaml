text: "… الحبشة مع جعفر بن أبي طالب، حين افتتح رسول اللّٰه علة خيبر، فأسهم لهم منها. وقد ذكرنا خَبَرهم في أبي موسى، وأبي بُرْدة، وقال لهم رسول اللّٰه عله : لكم هجرتان، هاجرتم إليّ، وهاجرتم إلى النجاشي. البخاري، و، ومسلم، وأحمد …"
