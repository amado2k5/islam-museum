label: { ar: "صحيح البخاري 3662 — الأب والأبوة", en: "Sahih al-Bukhari 3662 — the father and fatherhood", ur: "صحیح بخاری 3662 — باپ اور والدیت", es: "Sahih al-Bukhari 3662 — El padre y la paternidad" }
text: "… أَسَدٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ الْمُخْتَارِ، قَالَ خَالِدٌ الْحَذَّاءُ حَدَّثَنَا عَنْ أَبِي عُثْمَانَ، قَالَ حَدَّثَنِي عَمْرُو بْنُ الْعَاصِ ـ أَنَّ النَّبِيَّ بَعَثَهُ عَلَى جَيْشِ ذَاتِ السَّلاَسِلِ، فَأَتَيْتُهُ فَقُلْتُ أَىُّ النَّاسِ أَحَبُّ إِلَيْكَ قَالَ \" عَائِشَةُ \". فَقُلْتُ مِنَ الرِّجَالِ فَقَالَ \" أَبُوهَا \". قُلْتُ ثُمَّ مَنْ قَالَ \" ثُمَّ عُمَرُ بْنُ الْخَطَّابِ \". فَعَدَّ رِجَالاً."
summary:
  ar: "حديث في صحيح البخاري، رقم 3662، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3662 (Companions of the Prophet), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3662، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3662 (Compañeros del Profeta), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
