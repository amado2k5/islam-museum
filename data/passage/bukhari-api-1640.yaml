label: { ar: "صحيح البخاري 1640 — ما لا يحل", en: "Sahih al-Bukhari 1640 — what is not lawful", ur: "صحیح بخاری 1640 — جو حلال نہیں" }
text: "… شَأْنُ الْحَجِّ وَالْعُمْرَةِ إِلاَّ وَاحِدٌ، أُشْهِدُكُمْ أَنِّي قَدْ أَوْجَبْتُ حَجًّا مَعَ عُمْرَتِي. وَأَهْدَى هَدْيًا اشْتَرَاهُ بِقُدَيْدٍ وَلَمْ يَزِدْ عَلَى ذَلِكَ، فَلَمْ يَنْحَرْ، وَلَمْ يَحِلَّ مِنْ شَىْءٍ حَرُمَ مِنْهُ، وَلَمْ يَحْلِقْ وَلَمْ يُقَصِّرْ حَتَّى كَانَ يَوْمُ النَّحْرِ، فَنَحَرَ وَحَلَقَ، وَرَأَى أَنْ قَدْ قَضَى طَوَافَ الْحَجِّ، وَالْعُمْرَةِ بِطَوَافِهِ الأَوَّلِ. وَقَالَ ابْنُ عُمَرَما ـ كَذَلِكَ فَعَلَ رَسُولُ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1640، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1640 (Hajj (Pilgrimage)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1640، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
