label: { ar: "صحيح البخاري 1640 — ما لا يحل", en: "Sahih al-Bukhari 1640 — what is not lawful", ur: "صحیح بخاری 1640 — جو حلال نہیں", es: "Sahih al-Bukhari 1640 — lo que no es lícito", fr: "Sahih al-Bukhari 1640 — ce qui n'est pas licite", tr: "Sahih el-Buhari 1640 — İzin verilmeyen şeyler", id: "Sahih al-Bukhari 1640 — Apa yang tidak diperbolehkan" }
text: "… شَأْنُ الْحَجِّ وَالْعُمْرَةِ إِلاَّ وَاحِدٌ، أُشْهِدُكُمْ أَنِّي قَدْ أَوْجَبْتُ حَجًّا مَعَ عُمْرَتِي. وَأَهْدَى هَدْيًا اشْتَرَاهُ بِقُدَيْدٍ وَلَمْ يَزِدْ عَلَى ذَلِكَ، فَلَمْ يَنْحَرْ، وَلَمْ يَحِلَّ مِنْ شَىْءٍ حَرُمَ مِنْهُ، وَلَمْ يَحْلِقْ وَلَمْ يُقَصِّرْ حَتَّى كَانَ يَوْمُ النَّحْرِ، فَنَحَرَ وَحَلَقَ، وَرَأَى أَنْ قَدْ قَضَى طَوَافَ الْحَجِّ، وَالْعُمْرَةِ بِطَوَافِهِ الأَوَّلِ. وَقَالَ ابْنُ عُمَرَما ـ كَذَلِكَ فَعَلَ رَسُولُ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1640، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1640 (Hajj (Pilgrimage)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1640، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1640 (Hajj (Peregrinación)), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1640 (Hajj (Pèlerinage)), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 1640 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1640, menyebutkan apa yang diharamkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
