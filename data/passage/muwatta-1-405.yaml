summary:
  ar: "يروي مالك عن زيد بن أسلم عن أبيه أسلم عن عمر بن الخطاب مثل الأثر السابق في أمره أهل مكة أن يتموا صلاتهم لأنه وأصحابه قوم سفر؛ وهو في باب صلاة المسافر إذا كان إماماً أو كان وراء إمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي. {cite:muwatta-maruf-1997 p.213}"
