label: { ar: "الموطأ 405 — مثله عن زيد بن أسلم عن أبيه عن عمر", en: "Muwatta 405", es: "Muwatta 405", fr: "Muwatta 405", ur: "موطا 405", tr: "El-Muvatta 405 — Aynı rivayet Zeyd ibn Aslam'dan, o da babasından, o da Ömer'den nakledilmiştir.", id: "Al-Muwatta 405 — Sama menurut riwayat Zaid bin Aslam, menurut riwayat ayahnya, menurut riwayat Umar." }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن أبيه أسلم عن عمر بن الخطاب مثل الأثر السابق في أمره أهل مكة أن يتموا صلاتهم لأنه وأصحابه قوم سفر؛ وهو في باب صلاة المسافر إذا كان إماماً أو كان وراء إمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي. {cite:muwatta-maruf-1997 p.213}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da babası Aslam'dan, o da Ömer ibn el-Hattab'dan, bir öncekine benzer bir rivayette bulunur; bu rivayette kendisi ve arkadaşları yolculuk halinde oldukları için Mekke halkına namazlarını tamamlamalarını emretmiştir; bu, namazı kıldıran veya imamın arkasında namaz kılan bir yolcunun namazı bölümüne girer. Editör, bu rivayetin Ebu Mus'ab, Suveyd ve İbn Vahb tarafından Malik'ten, el-Tahavi'nin derlemesinde nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.213}"
  id: "Malik meriwayatkan dari Zaid bin Aslam, dari ayahnya Aslam, dari Umar bin al-Khattab, sebuah riwayat yang serupa dengan riwayat sebelumnya, di mana ia memerintahkan penduduk Mekah untuk menyelesaikan salat mereka karena ia dan para sahabatnya adalah musafir; ini termasuk dalam bab tentang salat musafir ketika ia memimpin salat atau salat di belakang imam. Editor menyebutkan bahwa Abu Mus'ab, Suwayd, dan Ibn Wahb meriwayatkannya dari Malik dalam koleksi al-Tahawi. {cite:muwatta-maruf-1997 p.213}"
