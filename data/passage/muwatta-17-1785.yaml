label: { ar: "الموطأ 1785 — مالك: لا ينبغي أن يستثنى الجنين في بطن أمه إذا بيعت، لأن ذلك غرر، لا يدرى أذكر هو أم أنثى، أحسن أم قبيح، تام أم ناقص، حي أم ميت", en: "Muwatta 1785", es: "Muwatta 1785", fr: "Muwatta 1785", ur: "موطا 1785", tr: "El-Muvatta 1785 — Malik: Eğer anne satılırsa, anne karnındaki cenin de dışlanmamalıdır; çünkü bu bir belirsizliktir; erkek mi kız mı, güzel mi çirkin mi, tamamlanmış mı tamamlanmamış mı, canlı mı ölü mü olduğu bilinmemektedir.", id: "Al-Muwatta 1785 — Malik: Janin dalam kandungan ibunya tidak boleh dikecualikan jika ibunya dijual, karena itu adalah ketidakpastian; tidak diketahui apakah ia laki-laki atau perempuan, cantik atau jelek, lengkap atau tidak lengkap, hidup atau mati." }
summary:
  ar: "قال مالك: لا ينبغي أن يستثنى جنين في بطن أمه إذا بيعت، لأن ذلك غرر، لا يدرى أذكر هو أم أنثى، أحسن أم قبيح، أو ناقص أو تام، أو حي أو ميت، وذلك يضع من ثمنها. {cite:muwatta-maruf-1997 p.130}"
  tr: "Malik şöyle dedi: \"Anne karnındaki bir cenin satıştan dışlanmamalıdır, çünkü bu bir belirsizliktir; erkek mi kız mı, güzel mi çirkin mi, eksik mi tamamlanmış mı, canlı mı ölü mü olduğu bilinmemektedir ve bu da fiyatını düşürür.\" {cite:muwatta-maruf-1997 s.130}"
  id: "Malik berkata: Janin dalam rahim ibunya tidak boleh dikecualikan dari penjualan, karena itu adalah ketidakpastian; tidak diketahui apakah ia laki-laki atau perempuan, cantik atau jelek, tidak lengkap atau lengkap, hidup atau mati, dan itu mengurangi harganya. {cite:muwatta-maruf-1997 p.130}"
