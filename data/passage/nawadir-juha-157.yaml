text: "… إذا طلب أجرة عشرة أيام ماذا أصنع؟ استأجَرَ في أحد الأيام حمَّالاً لينقل له حِمْلاً، وبينما هما في الطريق، فرَّ الحمّال بما معه، ففتَّش عليه جحا، فلم يجده. وبعد عشرة أيام صادفه، وكان مع الشيخ بعض أصدقائه، فقالوا له: هذا …"
summary:
  ar: "هرب حمّال بحمل جحا، وبعد عشرة أيام لقيه جحا مع أصدقائه فلم يقبض عليه، خشية أن يطالبه الحمّال بأجرة عشرة أيام عن حمل الحمل. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  en: "A porter runs off with Juha's load; after ten days Juha meets him with friends, and does not seize him, fearing the porter will demand ten days' wages for carrying the load. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  ur: "ایک مزدور جحا کا سامان لے کر بھاگ گیا؛ دس دن بعد جحا اسے اس کے دوستوں کے ساتھ ملا مگر اسے پکڑا نہیں، اس ڈر سے کہ وہ سامان اٹھانے کی دس دن کی اجرت مانگے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  fr: "Un porteur s'enfuit avec la charge de Juha; dix jours plus tard, Juha le rencontre avec des amis et ne l'attrape pas, craignant qu'il ne réclame dix jours de salaire pour avoir porté la charge. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  es: "Un porteador huye con la carga de Juha; diez días después, Juha se topa con él y sus amigos y no lo agarra, temiendo que le reclame el jornal de diez días por haber llevado la carga. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  tr: "Hamal, Juha'nın yüküyle birlikte kaçtı ve on gün sonra Juha ve arkadaşları onu buldular, ancak hamalın on günlük yük taşıma ücreti talep edeceğinden korktukları için onu tutuklamadılar. {cite:juha-nawadir-kubra-djuwaydi s. 73}"
  id: "Seorang kuli angkut melarikan diri dengan barang bawaan Juha, dan setelah sepuluh hari Juha dan teman-temannya menemukannya tetapi tidak menangkapnya, karena takut kuli angkut itu akan menuntut pembayaran untuk sepuluh hari membawa barang tersebut. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
