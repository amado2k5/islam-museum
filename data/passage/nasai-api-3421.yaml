label: { ar: "سنن النسائي 3421 — ما أُحل", en: "Sunan al-Nasa'i 3421 — what was made lawful", ur: "سنن نسائی 3421 — جو حلال کیا گیا" }
text: "… ذَلِكَ لَهُ فَقَالَ \" بَلْ شَرِبْتُ عَسَلاً عِنْدَ زَيْنَبَ - وَقَالَ - لَنْ أَعُودَ لَهُ \". فَنَزَلَ { يَا أَيُّهَا النَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ } { إِنْ تَتُوبَا إِلَى اللَّهِ } لِعَائِشَةَ وَحَفْصَةَ { وَإِذْ أَسَرَّ النَّبِيُّ إِلَى بَعْضِ أَزْوَاجِهِ حَدِيثًا } لِقَوْلِهِ \" بَلْ شَرِبْتُ عَسَلاَ \". كُلُّهُ فِي حَدِيثِ عَطَاءٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 3421، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3421 (The Book of Divorce), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3421، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
