label: { ar: "الموطأ 551 — عمر على المنبر يوم الجمعة: على رسلكم، إن الله لم يكتبها علينا إلا أن نشاء", en: "Muwatta 551" }
text: "على رسلكم، إن الله لم يكتبها علينا، إلا أن نشاء"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن عمر بن الخطاب قرأ سجدة وهو على المنبر يوم الجمعة، فنزل فسجد وسجد الناس معه، ثم قرأها في الجمعة الأخرى فتهيأ الناس للسجود، فقال لهم: على رسلكم، إن الله لم يكتبها علينا إلا أن نشاء، فلم يسجد ومنعهم أن يسجدوا. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي (2/321)، وأن في نسخة «وسجدنا». {cite:muwatta-maruf-1997 p.283} {cite:muwatta-maruf-1997 p.284}"
