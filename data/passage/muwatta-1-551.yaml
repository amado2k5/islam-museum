label: { ar: "الموطأ 551 — عمر على المنبر يوم الجمعة: على رسلكم، إن الله لم يكتبها علينا إلا أن نشاء", en: "Muwatta 551", es: "Muwatta 551", fr: "Muwatta 551", ur: "موطا 551", tr: "Al-Muwatta 551 — Ömer Cuma günü minberde: Rahat olun, Allah bunu bize ancak biz istersek emretti.", id: "Al-Muwatta 551 — Umar di mimbar pada hari Jumat: Tenanglah, Allah tidak menetapkannya bagi kita kecuali jika kita menghendakinya" }
text: "على رسلكم، إن الله لم يكتبها علينا، إلا أن نشاء"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن عمر بن الخطاب قرأ سجدة وهو على المنبر يوم الجمعة، فنزل فسجد وسجد الناس معه، ثم قرأها في الجمعة الأخرى فتهيأ الناس للسجود، فقال لهم: على رسلكم، إن الله لم يكتبها علينا إلا أن نشاء، فلم يسجد ومنعهم أن يسجدوا. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي (2/321)، وأن في نسخة «وسجدنا». {cite:muwatta-maruf-1997 p.283} {cite:muwatta-maruf-1997 p.284}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından rivayet ederek, Ömer ibn el-Hattab'ın cuma günü minberde secdeyi emreden bir ayet okuduğunu, sonra inip secde ettiğini ve cemaatin de onunla birlikte secde ettiğini nakletmiştir. Ertesi cuma günü aynı ayeti tekrar okumuş ve cemaat secde etmeye hazırlanmıştır. Ömer onlara, \"Bir dakika bekleyin. Allah bunu bize ancak biz istersek farz kılmıştır.\" demiştir. Böylece secde etmemiş ve cemaatin de secde etmesini engellemiştir. Editör, Ebu Musab ve Yahya ibn Bukayr'ın bunu Malik'ten rivayet ettiğini, el-Beyhaki'nin (2/321) de bunu kaydettiğini ve bir rivayetin \"Ve biz secde ettik\" şeklinde olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.283} {cite:muwatta-maruf-1997 s.284}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa Umar ibn al-Khattab membaca sebuah ayat yang mewajibkan sujud ketika berada di mimbar pada hari Jumat. Kemudian beliau turun dan sujud, dan orang-orang pun sujud bersamanya. Jumat berikutnya, beliau membaca ayat itu lagi, dan orang-orang bersiap untuk sujud. Beliau berkata kepada mereka, \"Tunggu sebentar. Allah tidak mewajibkannya kepada kita kecuali jika kita memilih untuk melakukannya.\" Maka beliau tidak sujud dan mencegah mereka untuk sujud. Editor menyebutkan bahwa Abu Mus'ab dan Yahya ibn Bukayr meriwayatkannya dari Malik, sebagaimana dicatat oleh al-Bayhaqi (2/321), dan bahwa salah satu versinya berbunyi, \"Dan kami pun sujud.\" {cite:muwatta-maruf-1997 p.283} {cite:muwatta-maruf-1997 p.284}"
