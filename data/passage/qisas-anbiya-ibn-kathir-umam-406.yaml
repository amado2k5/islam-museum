text: "… هارون اللاوى - يعنى الذى من نسل لاوى بن يعقوب — سيخرج ويتلقاك، وأمره أن يأخذ معه مشايخ بنى إسرائيل إلى فرعون، وأمره أن يظهر ما آتاه من الآيات وقال له : إنى سأقسى قلبه فلا يرسل الشعب، وأكثر آياتى …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 406، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
