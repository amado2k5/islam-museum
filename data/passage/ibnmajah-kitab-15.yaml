summary:
  ar: "القسم 15 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصدقات»، ويضم فيها النصوص من 2390 إلى 2528 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 15 of Sunan Ibn Majah (The Chapters on Charity) in the division of the open hadith dataset the museum took its reports from: reports 2390 to 2528 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 15، عنوان «کتاب الصدقات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2390 تا 2528۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 15 de Sunan Ibn Majah (Los capítulos sobre la caridad) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2390 al 2528, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
