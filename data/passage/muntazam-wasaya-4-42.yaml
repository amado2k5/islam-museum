text: "… اخبرنا عيد الرحمن بن معمد اخبرنا احمد بن على بن ثابت قل حدثنى الازهرى ان ابن الجعابى لمامات صلى عليه فى جامع المنصور وحمل الى مقابر قريش فدفن بها وكانت سكينة نائحة الرافضة تنوح مع جنازته وكان اوصى ان تحرق …"
