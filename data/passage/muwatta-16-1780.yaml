label: { ar: "الموطأ 1780 — يحيى عن مالك عن عبد الله بن أبي بكر عن عمرة عن عائشة: كان في القرآن حكم عشر رضعات ثم نسخ بخمس، وقال مالك إن هذا ليس على العمل، وينبه المحقق إلى أن الجملة الأخيرة تفرد بها مالك", en: "Muwatta 1780", es: "Muwatta 1780", fr: "Muwatta 1780", ur: "موطا 1780", tr: "El-Muvatta 1780 — Yahya, Malik'ten, o da Abdullah ibn Abi Bekr'den, o da Amra'dan, o da Aişe'den rivayetle: Kur'an'da on emzirme hükmü vardı, sonra bu beş emzirme ile yürürlükten kaldırıldı. Malik bunun takip edilmemesi gerektiğini söyledi. Araştırmacı, son cümlenin sadece Malik'e özgü olduğunu belirtiyor.", id: "Al-Muwatta 1780 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Abdullah ibn Abi Bakr, berdasarkan riwayat Amrah, berdasarkan riwayat Aisyah: Ada hukum dalam Al-Qur'an tentang sepuluh kali menyusui, kemudian hukum itu dibatalkan dengan lima kali. Malik mengatakan bahwa ini tidak boleh diikuti. Peneliti menunjukkan bahwa kalimat terakhir itu hanya berasal dari Malik." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن عمرة بنت عبد الرحمن عن عائشة زوج النبي أنها قالت: كان فيما نزل من القرآن حكم عشر رضعات معلومات يحرمن، ثم نسخن بخمس، فتوفي رسول الله والحكم مما يقرأ في القرآن. قال يحيى: قال مالك: وليس على هذا العمل. وينقل المحقق عن ابن عبد البر أنه قال إن مالكا تفرد بالجملة الأخيرة عن عبد الله بن أبي بكر، وأن يحيى بن سعيد الأنصاري والقاسم بن محمد رويا الحديث عن عمرة دون تلك الجملة، ويرى المحقق أن روايتهما أصح. {cite:muwatta-maruf-1997 p.127}"
  tr: "Malik, Abdullah ibn Abi Bekr'den, o da Amra bint Abdülrahman'dan, o da Peygamberin eşi Ayşe'den rivayetle şöyle buyurduğunu aktarır: \"Kur'an'da vahyedilenler arasında, haram bir ilişkiyi kuran on bilinen emzirme şeklinin hükmü vardı, sonra bu beş tanesiyle bu hüküm kaldırıldı. Allah Resulü, bu hüküm Kur'an'da hâlâ okunmakta iken vefat etti.\" Yahya şöyle dedi: Malik dedi ki: \"Bu uygulama değildir.\" Araştırmacı, İbn Abdülberr'in, hadisin son kısmını Abdullah ibn Abi Bekr'den rivayet eden tek kişinin Malik olduğunu, Yahya ibn Said el-Ensari ve el-Kâsım ibn Muhammed'in ise bu kısmı hariç tutarak Amra'dan rivayet ettiklerini söylediğini aktarır. Araştırmacı, onların rivayetlerinin daha sahih olduğuna inanmaktadır. {cite:muwatta-maruf-1997 s.127}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr, dari Amrah binti Abd al-Rahman, dari Aisyah, istri Nabi, bahwa ia berkata: “Di antara apa yang diturunkan dalam Al-Quran adalah hukum sepuluh kali menyusui yang dianggap sebagai hubungan haram, kemudian hukum ini dibatalkan dengan lima kali menyusui. Rasulullah wafat ketika hukum tersebut masih disebutkan dalam Al-Quran.” Yahya berkata: Malik berkata: “Ini bukan praktik yang umum.” Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa Malik adalah satu-satunya yang meriwayatkan bagian terakhir hadits tersebut dari Abdullah ibn Abi Bakr, dan bahwa Yahya ibn Saeed al-Ansari dan al-Qasim ibn Muhammad meriwayatkan hadits tersebut dari Amrah tanpa bagian tersebut. Peneliti meyakini bahwa riwayat mereka lebih otentik. {cite:muwatta-maruf-1997 p.127}"
