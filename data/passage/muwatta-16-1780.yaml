label: { ar: "الموطأ 1780 — يحيى عن مالك عن عبد الله بن أبي بكر عن عمرة عن عائشة: كان في القرآن حكم عشر رضعات ثم نسخ بخمس، وقال مالك إن هذا ليس على العمل، وينبه المحقق إلى أن الجملة الأخيرة تفرد بها مالك", en: "Muwatta 1780" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن عمرة بنت عبد الرحمن عن عائشة زوج النبي أنها قالت: كان فيما نزل من القرآن حكم عشر رضعات معلومات يحرمن، ثم نسخن بخمس، فتوفي رسول الله والحكم مما يقرأ في القرآن. قال يحيى: قال مالك: وليس على هذا العمل. وينقل المحقق عن ابن عبد البر أنه قال إن مالكا تفرد بالجملة الأخيرة عن عبد الله بن أبي بكر، وأن يحيى بن سعيد الأنصاري والقاسم بن محمد رويا الحديث عن عمرة دون تلك الجملة، ويرى المحقق أن روايتهما أصح. {cite:muwatta-maruf-1997 p.127}"
