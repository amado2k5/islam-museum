text: "… لم يبق له شيء، ولم يكن معه من الأولاد سوى القاضي الفاضل، فحمل على قلبه وتوفي بالقاهرة ليلة الأحد حادي عشر شهر ربيع الأول من سنة ست وأربعين وخمسمائة، ودفن بسفح المقطم. ثم توجه القاضي الفاضل إلى ثغر الإسكندرية، وحضر …"
