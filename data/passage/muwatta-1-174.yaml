label: { ar: "الموطأ 174 — لو يعلم الناس ما في النداء والصف الأول لاستهموا عليه", en: "Muwatta 174" }
text: "لو يعلم الناس ما في النداء والصف الأول ثم لم يجدوا إلا أن يستهموا عليه لاستهموا، ولو يعلمون ما في التهجير لاستبقوا إليه، ولو يعلمون ما في العتمة والصبح لأتوهما ولو حبواً"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي صالح السمان عن أبي هريرة، في باب ما جاء في النداء للصلاة: أخبر النبي أن الناس لو علموا ما في الأذان والصف الأول من الفضل لاقترعوا عليهما، ولو علموا ما في التبكير إلى الصلاة لاستبقوا إليه، ولو علموا ما في صلاتي العشاء والصبح لأتوهما ولو حبواً. ويفسر المحقق التهجير بالتبكير إلى الصلوات والعتمة بالعشاء، ويخرّج الحديث عند البخاري (615، 652، 2689) ومسلم (2/31) والترمذي (225، 226) والنسائي وابن خزيمة وابن حبان من طرق أصحاب مالك، وينقل عن ابن عبد البر أن هذه ثلاثة أحاديث في حديث واحد عند جماعة من أصحاب مالك: حديث غصن الشوك، وحديث الشهداء، وهذا القسم الذي وضعه يحيى في هذا الباب دون بابه (التمهيد 22/11). {cite:muwatta-maruf-1997 p.114} {cite:muwatta-maruf-1997 p.115}"
