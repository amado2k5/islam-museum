label: { ar: "الموطأ 715 — عمر يرى في غنم الصدقة شاة حافلاً: لا تفتنوا الناس، لا تأخذوا حزرات المسلمين، نكبوا عن الطعام", en: "Muwatta 715", es: "Muwatta 715", fr: "Muwatta 715", ur: "موطا 715", tr: "Al-Muwatta 715 — Ömer, sadaka koyunları arasında gebe bir koyun gördü: İnsanları sınamayın, Müslümanların hayvanlarına dokunmayın, yemekten sakının.", id: "Al-Muwatta 715 — Umar melihat seekor domba bunting di antara domba-domba sedekah: Janganlah kamu menggoda manusia, janganlah kamu mengambil ternak kaum Muslimin, dan janganlah kamu memakannya." }
text: "ما أعطى هذه أهلها وهم طائعون، لا تفتنوا الناس، لا تأخذوا حزرات المسلمين، نكبوا عن الطعام"
summary:
  ar: "أول حديث في باب النهي عن التضييق على الناس في الصدقة. يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان عن القاسم بن محمد عن عائشة، قالت: مُر على عمر بن الخطاب بغنم من الصدقة فرأى فيها شاة حافلاً ذات ضرع عظيم، فسأل عنها فقالوا: شاة من الصدقة. فقال عمر: ما أعطى هذه أهلها وهم طائعون، لا تفتنوا الناس، لا تأخذوا حزرات المسلمين، نكبوا عن الطعام. ويذكر المحقق أن في هامش نسخة ص «عن أبيه» ولا يصح، وأن الحزرات خيار الأموال والطعام ذوات الدر، وأنه رواه عن مالك أبو مصعب والشافعي ومن طريقه البيهقي ويحيى بن بكير عند أبي عبيد في الأموال (1088). {cite:muwatta-maruf-1997 p.359}"
  tr: "Sadaka konusunda cimrilik etme yasağı bölümündeki ilk hadis, Malik tarafından Yahya ibn Sa'id, o da Muhammed ibn Yahya ibn Hibban, o da el-Kasım ibn Muhammed, o da Aişe'den rivayet edilmiştir. Aişe şöyle demiştir: Ömer ibn el-Hattab sadakadan gelen bazı koyunların yanından geçerken, aralarında iri, memeli bir dişi koyun gördü. Bunun hakkında bilgi aldı ve onlar da: \"Bu sadakadan gelen bir koyundur\" dediler. Ömer dedi ki: \"Sahiplerine gönüllü olarak verilmiştir. İnsanları zor durumda bırakmayın. Müslümanların en iyi hayvanlarını almayın. Onlar yiyecekten yüz çevirdiler.\" Editör, S el yazmasının kenarında \"babasının rivayetine göre\" ifadesinin bulunduğunu, bunun yanlış olduğunu belirtmektedir. Ayrıca \"el-hazrat\" kelimesinin, süt veren hayvanların ve yiyeceklerin en iyilerini ifade ettiğini de belirtmektedir. Ayrıca, bu rivayetin Malik'ten Ebu Mus'ab ve Şafiî tarafından, onun aracılığıyla da Beyhaki ve Yahya ibn Bukayr tarafından, Ebu Ubeyd'in el-Amwal'da (1088) kaydettiği şekilde nakledildiğini ekliyor. {cite:muwatta-maruf-1997 s.359}"
  id: "Hadits pertama dalam bab tentang larangan berkikir terhadap orang lain dalam hal sedekah. Diriwayatkan oleh Malik dari Yahya ibn Sa'id, dari Muhammad ibn Yahya ibn Hibban, dari al-Qasim ibn Muhammad, dari Aisyah, yang berkata: Umar ibn al-Khattab sedang melewati beberapa domba sedekah dan melihat di antara mereka seekor domba betina besar yang memiliki ambing besar. Dia bertanya tentang domba itu, dan mereka berkata: \"Itu adalah domba sedekah.\" Umar berkata: \"Domba itu diberikan kepada pemiliknya dengan sukarela. Janganlah menyulitkan orang lain. Janganlah mengambil ternak terbaik milik kaum Muslimin. Mereka telah berpaling dari makanan.\" Editor menyebutkan bahwa di margin manuskrip S, terdapat \"dari ayahnya,\" yang tidak benar. Dia juga menyatakan bahwa \"al-hazrat\" merujuk pada ternak dan makanan terbaik, yaitu yang memiliki susu. Ia menambahkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan al-Shafi'i, dan melalui beliau oleh al-Bayhaqi dan Yahya ibn Bukayr, sebagaimana dicatat oleh Abu Ubayd dalam al-Amwal (1088). {cite:muwatta-maruf-1997 p.359}"
