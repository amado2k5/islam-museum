label: { ar: "الموطأ 715 — عمر يرى في غنم الصدقة شاة حافلاً: لا تفتنوا الناس، لا تأخذوا حزرات المسلمين، نكبوا عن الطعام", en: "Muwatta 715" }
text: "ما أعطى هذه أهلها وهم طائعون، لا تفتنوا الناس، لا تأخذوا حزرات المسلمين، نكبوا عن الطعام"
summary:
  ar: "أول حديث في باب النهي عن التضييق على الناس في الصدقة. يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان عن القاسم بن محمد عن عائشة، قالت: مُر على عمر بن الخطاب بغنم من الصدقة فرأى فيها شاة حافلاً ذات ضرع عظيم، فسأل عنها فقالوا: شاة من الصدقة. فقال عمر: ما أعطى هذه أهلها وهم طائعون، لا تفتنوا الناس، لا تأخذوا حزرات المسلمين، نكبوا عن الطعام. ويذكر المحقق أن في هامش نسخة ص «عن أبيه» ولا يصح، وأن الحزرات خيار الأموال والطعام ذوات الدر، وأنه رواه عن مالك أبو مصعب والشافعي ومن طريقه البيهقي ويحيى بن بكير عند أبي عبيد في الأموال (1088). {cite:muwatta-maruf-1997 p.359}"
