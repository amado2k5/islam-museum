text: |-
  ٢٣٢٦
  • ⁦(ف صل القاف )⁩
  : •⁦(قلم )⁩ من
  ابن الاعرابي
  طبيخ نحازأ وطبيخ أميهة • دقيق العظام سي القشم أملط
  يقول كانت أنمه به حاملا وبه انحاز أى سعال وجدرىّ فجاءت به ضاريا والقشم بالتحريك
  البسر الا بيض الذى يؤ كل قبل أن يدرك وه وحلو ويقال أصاب النخسل القشام بالضم اذا
  انتقض قبل أن يصير ماعليه بسرا والقشامة والقشام مابق على المائدة وفح وهاعما لاخير
  فيه وقشام فى قول الراجزه باليت أنى وقشامانلتق • اسم رجل راع ⁦(قشعم)⁩ القشم
  من النسور والرجال المسنّ وأمّ قشعم المنية والداهية والقشعمان مقال التعلبان والعربان
  العظيم الذكر من النسور ⁦(قصم)⁩ قصمت الشئ قصما اذا كسرته حتى يبين تقول
  قصمه فائقصم وتقصم ورجل أقصم الثنية اذا كان منكسرها من النصف بين القصم يقال
  ياءتكم القصماء يذهب به الى تأنيت الثنية قال ابن دريد القصماء من المعز المكسورة القرن
  للمارح والعضباء المكسورة القرن الدهاخل وهو المشاش والقصمة بكسر القاف الكسر
  وفى الحديث استغنوا ولوعن قصمة السواك والقصمة بالفتح مرقاة الدرجة.شل القصفة
  ورحل قصم سريع الانكساروصم مثال قثم يحطم مالقى والقصيمة رملة تنبت الغضى
  والجمع قصيم وقال •حيت اسستغاض وكادك وقصيم • والقبصوم نبت وقال
  بلادبها القيصوم والشيح والغضى• ضم لقضم الاكل باطراف الاسنان يقال قضت
  الداية شعيرها بالكسر تقضمه قضما ومأذقت قضاما أى شيأ الاصمعى أخبرنا ابن أبى طرفة
  فال قدم أعرابى على ابن عمّله بمكة فقال له انّ هذه بلاد مقضم وليست ب.لاد مخضم والخضم
  أكل بجميع الفسم والقضم دون ذلك وقوله-م يبلغ الخضم بالقضم أى أن الشبعة قد تبلغ
  بالاكل بأطراف الفم ومعناه أن الغاية البعيدة قد تدرك بالرفق قال الشاعر
  تبلع بأخلاق الثياب جديدها • وبالقضم حتى تدرك الخضم بالقضم
  والقضم بالتحر يك جمع قضيم وهو الجلد الابيض يكتب فيه قال الاصمعىّ ومنسه قول النابغة
  كان مجرّ الرامسات ذيولها * عليه قضم غقته الصوائع
  والقضيم شعير الداية وقد أقضمتها أى علفتها القضيم والقضم بكسر الضاد السيف الذى
  طال عليه الدهر فتكسر حده وفى مضاريه قضم بالتحر بك أى تكسر ( طم طم الشئ
  عضِه وذوقه وقال واذا قطمتهم قطمت علاقا * وقواضى الذيفان فيما تقطم
  والقطم بالتحريك شهوة الضراب وشهوة اللحم يقال رجل قطم شهوان للح-م وقطم الفعل
  بالمكسرأى اهتاج وأواد الضراب وقطم الصقر الى اللهم اشتهاه والقطامى بالضم لقب شاءر
  من تغلب واسمه عميرن شيم والقطامى الصقريضم ويفتح والمقطم بالتشديد جبل بمصر
  وقطام اسم امرأة وأحل الحجازيبنونه عسلى الكسه فى كل حال وأهل نج-ديجرونه مجرى
  مالا يبصرف وقد ذ كرناه فى رقاش من باب الشين مم أقعم الرجسل اذا أصابه داء
  فقتله وأقعمته الحيسة والتعم بالتحر يلكميسل فى الانف ⁦( -لم)⁩ قلت ظفرى وقلت
  أظفارى : تد الكثرة والقلامة ماسقط منه ويقال للضعيف مقلوم الفف-ر وكايل الظفر
  والقلم الذى يكتب به واللم الزلم والة لم الجلم والاقليم واحد اقاليم الارض السبعة والقلام
  بالتشديد القاقلى وهو من الحض والمقلم وعاءقضيب البعير والمقلمة وعاء الاقلام ومقالم الرمح
  كموبه
