text: "… وَيُخَوِّنُ الْأَمِينَ كَمِثْلِ الْقِطْعَةِ الذَّهَب الْجَيِّدَة أَوْقَدَ عَلَيْهَا فَخَلْصَتْ وَوُزِنَتْ فَلَمْ تَنْقُضْ، وَمَثَل المؤمن كَمَثِلِ النَّحْلَةِ أَكَلَتْ طَيِّبَا، وَوَضَعَتْ طَيِّبًا، أَلَا إِنَّ أَفْضَلَ الشُّهَدَاءِ المُقْسِطُونَ، أَلَا إِنَّ أَفْضَلَ الْمُهَاجِرِينَ مَنْ هَجَرَ مَا حَرَّمَ اللهُ عَلَيْهِ، أَلَا إِنَّ أَفْضَلَ الْمُسْلِمِينَ مَنْ …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 3، ص 599، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 3, p. 599, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 3، ص 599 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 3, pág. 599, que menciona la semejanza del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Subul al-Huda wa-l-Rashad d'al-Salihi (tome 3, p. 599) évoquant la ressemblance du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" (Hida ve Doğruluk Yolları) adlı eserinin 3. cildinin 599. sayfasında, müminin kıssasından bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Salihi \"Subul al-Huda wa al-Rashad\" (Jalan Petunjuk dan Kebenaran), Jilid 3, halaman 599, menyebutkan perumpamaan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
