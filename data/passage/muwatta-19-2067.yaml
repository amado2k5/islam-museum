label: { ar: "الموطأ 2067 — مالك: المساقي لا يأخذ من صاحبه الذي ساقاه شيئا من ذهب ولا ورق يزداده، ولا طعام ولا شيئا من الأشياء، لأن الزيادة فيما بينهما لا تصلح", en: "Muwatta 2067", es: "Muwatta 2067", fr: "Muwatta 2067", ur: "موطا 2067", tr: "El-Muvatta 2067 — Malik: Ortakçı, kendisine toprak verenden altın veya gümüş, yiyecek veya başka hiçbir şey almaz; çünkü aralarındaki kazanç helal değildir.", id: "Al-Muwatta 2067 — Malik: Seorang petani penggarap tidak mengambil dari pemberi tanah itu sesuatu pun berupa emas atau perak, juga tidak boleh mengambil makanan atau apa pun, karena penambahan di antara mereka tidak diperbolehkan." }
summary:
  ar: "قال مالك في المساقي: إنه لا يأخذ من صاحبه الذي ساقاه شيئا من ذهب ولا ورق يزداده، ولا طعام ولا شيئا من الأشياء. لا يصلح ذلك، ولا ينبغي أن يأخذ المساقي من رب الحائط شيئا يزيده إياه، من ذهب ولا ورق ولا طعام ولا شيء من الأشياء. والزيادة فيما بينهما لا تصلح. {cite:muwatta-maruf-1997 p.245}"
  tr: "Malik sulama konusunda şunları söyledi: Sulama yapan kişi, meyve bahçesi sahibinden altın, gümüş, yiyecek veya başka herhangi bir şey olsun, ek bir katkı olarak hiçbir şey almamalıdır. Bu caiz değildir. Sulama yapan kişi, meyve bahçesi sahibinden altın, gümüş, yiyecek veya başka herhangi bir şey olsun, ek bir katkı olarak hiçbir şey almamalıdır. Aralarındaki herhangi bir artış caiz değildir. {cite:muwatta-maruf-1997 s.245}"
  id: "Malik berkata mengenai irigasi: Pengairi tidak boleh mengambil apa pun dari pemilik kebun sebagai kontribusi tambahan, baik emas, perak, makanan, atau apa pun. Ini tidak diperbolehkan. Pengairi tidak boleh mengambil apa pun dari pemilik kebun sebagai kontribusi tambahan, baik emas, perak, makanan, atau apa pun. Setiap peningkatan di antara mereka tidak diperbolehkan. {cite:muwatta-maruf-1997 p.245}"
