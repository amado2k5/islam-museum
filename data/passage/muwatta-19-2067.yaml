summary:
  ar: "قال مالك في المساقي: إنه لا يأخذ من صاحبه الذي ساقاه شيئا من ذهب ولا ورق يزداده، ولا طعام ولا شيئا من الأشياء. لا يصلح ذلك، ولا ينبغي أن يأخذ المساقي من رب الحائط شيئا يزيده إياه، من ذهب ولا ورق ولا طعام ولا شيء من الأشياء. والزيادة فيما بينهما لا تصلح. {cite:muwatta-maruf-1997 p.245}"
