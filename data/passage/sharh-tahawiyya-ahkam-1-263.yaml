  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi üzerine tefsirinin 1. cildinin 263. sayfasından, farz olan ameller, toplumsal yükümlülükler ve müstehap olan amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, müstehap olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-`Izz tentang Akidah al-Tahawi, Jilid 1, halaman 263, yang menyebutkan amalan wajib, kewajiban masyarakat, dan amalan anjuran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
