label: { ar: "الموطأ 605 — أبو هريرة ينهى أن يُتبع بعد موته بنار؛ ويحيى: سمعت مالكاً يكره ذلك", en: "Muwatta 605", es: "Muwatta 605", fr: "Muwatta 605", ur: "موطا 605", tr: "El-Muvatta 605 — Ebu Hurayra, bir kişinin ölümünden sonra ateşle takip edilmesini yasaklamıştır; Yahya ise şöyle demiştir: Malik'in bundan hoşlanmadığını duydum.", id: "Al-Muwatta 605 — Abu Hurayrah melarang seseorang diikuti oleh api setelah kematiannya; dan Yahya berkata: Aku mendengar Malik tidak menyukai hal itu." }
summary:
  ar: "يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبي هريرة، أنه نهى أن يُتبع بعد موته بنار. ويقول يحيى: سمعت مالكاً يكره ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق (6155) ومحمد بن الحسن الشيباني (309)، وأن إسناده صحيح، وأنه روي عن أبي هريرة مرفوعاً عند أحمد وأبي داود (3171) من طريق فيها راو مبهم، وقد اختلف فيه على يحيى بن أبي كثير فجُعل مرة عن أبي سعيد الخدري، وهو اضطراب أعله به الدارقطني في العلل، فالموقوف عند المحقق أصح. {cite:muwatta-maruf-1997 p.310} {cite:muwatta-maruf-1997 p.311}"
  tr: "Malik, Sa'id ibn Abi Sa'id al-Maqburi'den, o da Ebu Hurayra'dan rivayet ederek, ölen bir kişinin ardından ateş yakılmasını yasakladığını nakletmiştir. Yahya şöyle demiştir: Malik'in bundan hoşlanmadığını duydum. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Abd al-Razzaq (6155) ve Muhammed ibn al-Hasan al-Şeybani (309) tarafından nakledildiğini ve isnad zincirinin sağlam olduğunu belirtmektedir. Ayrıca, Ahmed ve Ebu Davud (3171) tarafından, bilinmeyen bir raviyi içeren bir isnad zinciriyle, Ebu Hurayra'dan Peygamber'e (merfu') kadar uzanan bir hadis olarak nakledilmiştir. Yahya ibn Abi Kathir'den rivayeti konusunda ihtilaf vardır, çünkü bazen Ebu Sa'id al-Khudri'ye de atfedilmiştir. Bu tutarsızlık, el-Daraqutni tarafından 'Al-'Ilal' adlı kitabında belirtilmiştir; bu nedenle araştırmacıya göre, bir Sahabe'ye (mawquf) atfedilen rivayet daha sahihtir. {cite:muwatta-maruf-1997 s.310} {cite:muwatta-maruf-1997 s.311}"
  id: "Malik meriwayatkannya dari Sa'id ibn Abi Sa'id al-Maqburi, dari Abu Hurayrah, bahwa ia melarang mengikuti orang yang telah meninggal dengan api. Yahya berkata: Saya mendengar Malik tidak menyukai hal itu. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, 'Abd al-Razzaq (6155), dan Muhammad ibn al-Hasan al-Shaybani (309), dan sanadnya sahih. Hadits ini juga diriwayatkan dari Abu Hurayrah sebagai hadits yang ditelusuri kembali kepada Nabi (marfu') oleh Ahmad dan Abu Dawud (3171) melalui sanad yang mengandung perawi yang tidak dikenal. Terdapat perbedaan pendapat mengenai periwayatannya dari Yahya ibn Abi Kathir, karena kadang-kadang dikaitkan dengan Abu Sa'id al-Khudri. Perbedaan ini dicatat oleh al-Daraqutni dalam bukunya 'Al-'Ilal', sehingga versi yang dinisbahkan kepada seorang Sahabat (mawquf) lebih otentik menurut peneliti. {cite:muwatta-maruf-1997 p.310} {cite:muwatta-maruf-1997 p.311}"
