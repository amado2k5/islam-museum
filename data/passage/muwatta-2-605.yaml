label: { ar: "الموطأ 605 — أبو هريرة ينهى أن يُتبع بعد موته بنار؛ ويحيى: سمعت مالكاً يكره ذلك", en: "Muwatta 605" }
summary:
  ar: "يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبي هريرة، أنه نهى أن يُتبع بعد موته بنار. ويقول يحيى: سمعت مالكاً يكره ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق (6155) ومحمد بن الحسن الشيباني (309)، وأن إسناده صحيح، وأنه روي عن أبي هريرة مرفوعاً عند أحمد وأبي داود (3171) من طريق فيها راو مبهم، وقد اختلف فيه على يحيى بن أبي كثير فجُعل مرة عن أبي سعيد الخدري، وهو اضطراب أعله به الدارقطني في العلل، فالموقوف عند المحقق أصح. {cite:muwatta-maruf-1997 p.310} {cite:muwatta-maruf-1997 p.311}"
