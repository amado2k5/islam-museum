label: { ar: "الموطأ 682 — مالك: من هلك ولم يؤد زكاة ماله تؤخذ من ثلث ماله وتبدى على الوصايا", en: "Muwatta 682" }
summary:
  ar: "أول نص في باب زكاة الميراث. يقول مالك: إن الرجل إذا هلك ولم يؤد زكاة ماله فإنه يرى أن تؤخذ من ثلث ماله ولا يُجاوز بها الثلث، وتُقدم على الوصايا لأنها بمنزلة الدين عليه؛ وذلك إذا أوصى بها الميت، فإن لم يوص ففعل ذلك أهله فحسن، وإن لم يفعلوا لم يلزمهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.343}"
