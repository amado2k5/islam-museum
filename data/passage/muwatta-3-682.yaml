label: { ar: "الموطأ 682 — مالك: من هلك ولم يؤد زكاة ماله تؤخذ من ثلث ماله وتبدى على الوصايا", en: "Muwatta 682", es: "Muwatta 682", fr: "Muwatta 682", ur: "موطا 682", tr: "El-Muvatta 682 — Malik: Bir kimse malının zekâtını ödemeden ölürse, zekât malının üçte birinden alınır ve vasiyetlerden önceliklidir.", id: "Al-Muwatta 682 — Malik: Jika seseorang meninggal dunia tanpa pernah membayar zakat atas hartanya, maka zakat tersebut diambil dari sepertiga hartanya dan didahulukan daripada wasiat." }
summary:
  ar: "أول نص في باب زكاة الميراث. يقول مالك: إن الرجل إذا هلك ولم يؤد زكاة ماله فإنه يرى أن تؤخذ من ثلث ماله ولا يُجاوز بها الثلث، وتُقدم على الوصايا لأنها بمنزلة الدين عليه؛ وذلك إذا أوصى بها الميت، فإن لم يوص ففعل ذلك أهله فحسن، وإن لم يفعلوا لم يلزمهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.343}"
  tr: "Miras zekâtı bölümündeki ilk metinde Malik şöyle diyor: Bir kimse malının zekâtını ödemeden ölürse, zekâtın mal varlığının üçte birinden alınması gerektiğine inanır; ancak bu oran üçte birden fazla olamaz ve vasiyetlerden daha önceliklidir, çünkü bu onun borcu sayılır. Bu, ölen kişinin mal varlığını vasiyet etmesi durumunda geçerlidir. Eğer ölen kişi vasiyet etmemişse ve ailesi vasiyet ederse, bu iyidir; etmezlerse, yükümlülükleri yoktur. Editör, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.343}"
  id: "Teks pertama dalam bab tentang zakat warisan. Malik berkata: Jika seseorang meninggal dunia tanpa membayar zakat atas hartanya, ia percaya bahwa zakat harus diambil dari sepertiga hartanya, tidak melebihi sepertiga, dan lebih diutamakan daripada wasiat karena dianggap sebagai hutang yang harus dipenuhinya. Ini berlaku jika almarhum mewariskan harta tersebut. Jika ia tidak mewariskan harta tersebut, dan keluarganya mewariskannya, itu baik; jika mereka tidak mewariskannya, mereka tidak berkewajiban. Editor menyebutkan bahwa Abu Mus'ab meriwayatkan ini dari Malik. {cite:muwatta-maruf-1997 p.343}"
