text: "بَاب تَرِكَةِ رَسُولِلَهِ ل قال أبو إسحاق، عن عَمْرو بن الحارث الخُزَاعِيّ أخي جُوَيْرِية قال : والله ما ترك رسول اللّٰه طيفي عند موته ديناراً ولا دِرْهماً ولا عبداً ولا أَمَةً ولا شيئاً إلا بغلته الحبيضاء وسلاحَه وأرضاً تَرَكَها صدقة. …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 589، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 5, p. 589, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 5، ص 589 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 5, pág. 589, que menciona el lecho de muerte y las últimas horas, y lo que dejó: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 5, page 589, évoquant un lit de mort et les dernières heures du défunt, ainsi que son héritage. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
