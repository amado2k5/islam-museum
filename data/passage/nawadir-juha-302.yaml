label: { ar: "نوادر جحا الكبرى، ص 149 — «لا معنى للعقاب بعد كسر الجرة»", en: "Nawadir Juha al-Kubra, p. 149 — 'Punishment Is Meaningless After the Jar Is Broken'", ur: "نوادر جحا الکبریٰ، ص 149 — «جگ ٹوٹنے کے بعد سزا کا کوئی مطلب نہیں»", fr: "Nawadir Juha al-Kubra, p. 149 — « La punition n'a pas de sens après la jarre brisée »", es: "Nawadir Juha al-Kubra, p. 149 — «El castigo no tiene sentido tras romper la jarra»", tr: "Juha'nın Büyük Fıkraları, s. 149 — “Kavutan kırıldıktan sonra cezalandırmanın bir anlamı yoktur.”", id: "Anekdot Hebat Juha, hlm. 149 — “Tidak ada gunanya menghukum setelah guci pecah.”" }
text: "… لا معنى للعقاب بعد كسر الجرة أعطى ابنتَهُ جرة ماءِ لِتملأها، ثمَّ صفعها بكفِّهِ قائلاً : إيَّاكِ أنْ تكسري الجرَّة، فقال الذين رَأوْها تبكي وهي طفلة: يا شيخُ أيجدرُ بك أن تضرب هذه البُنيّة بغير حقٍّ وهي لم تُذنب؟ فأجابهم: …"
summary:
  ar: "صفع جحا ابنته الصغيرة لأنها كسرت جرة، فسأله الحاضرون لماذا يضرب طفلة لم تفعل شيئاً، فقال إنه يريدها أن تتعلم عاقبة كسر الجرة، فالعقاب بعد الكسر لا معنى له. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  en: "Juha slaps his small daughter for breaking a jar; onlookers ask why he hits a child who did nothing; he says he wants her to learn the consequence of breaking a jar, since punishment after the breaking is meaningless. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  ur: "جحا نے اپنی چھوٹی بیٹی کو جگ توڑنے پر تھپڑ مارا، پاس کھڑے لوگوں نے پوچھا کہ وہ ایک ایسی بچی کو کیوں مارتا ہے جس نے کچھ نہیں کیا، تو اس نے کہا کہ وہ چاہتا ہے کہ وہ جگ ٹوٹنے کا نتیجہ سیکھ لے، کیونکہ ٹوٹنے کے بعد سزا کا کوئی مطلب نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  fr: "Juha gifle sa petite fille pour avoir cassé une jarre ; les badauds demandent pourquoi il frappe une enfant qui n'a rien fait ; il répond qu'il veut qu'elle apprenne la conséquence de casser une jarre, car punir après coup n'a aucun sens. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  es: "Juha da una bofetada a su hija pequeña por romper una jarra; los presentes preguntan por qué pega a una niña que no ha hecho nada; él dice que quiere que aprenda la consecuencia de romper una jarra, pues el castigo después de romperla carece de sentido. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  tr: "Juha, küçük kızının bir kavanozu kırması nedeniyle ona tokat attı. Orada bulunanlar, hiçbir suç işlememiş bir çocuğu neden dövdüğünü sordular. Juha, hasar verildikten sonra ceza vermenin anlamsız olduğunu, bu yüzden kızının kavanoz kırmanın sonuçlarını öğrenmesini istediğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 149}"
  id: "Juha menampar putrinya yang masih kecil karena ia memecahkan guci. Orang-orang yang hadir bertanya kepadanya mengapa ia memukul anak yang tidak melakukan kesalahan apa pun. Ia menjawab bahwa ia ingin putrinya belajar konsekuensi dari memecahkan guci, karena hukuman setelah kerusakan terjadi tidak ada gunanya. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
