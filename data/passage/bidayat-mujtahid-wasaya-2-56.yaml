text: "… ومن العسل خمراً رواه الخمسة إلا النسائي، زاد أحمد، وأبو داود وأنا أنهى عن كل مسكر منتقى الأخبار وليس عن ابن عمر. أما لفظ ما رواه ابن عمر أن عمر بن الخطاب قال على منبر النبي علله : أما بعد …"
