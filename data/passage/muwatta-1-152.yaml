label: { ar: "الموطأ 152 — مالك: الحائض تطهر ولا تجد ماء تتيمم", en: "Muwatta 152", es: "Muwatta 152", fr: "Muwatta 152", ur: "موطا 152", tr: "Al-Muwatta 152 — Malik: Adet gören kadın temizlenir, fakat su bulamazsa teyemmüm (kuru abdest) alır." }
summary:
  ar: "فتوى لمالك في باب طهر الحائض: سُئل عن الحائض تطهر فلا تجد ماءً هل تتيمم، فقال: نعم، لتتيمم، فإن مثلها مثل الجنب إذا لم يجد ماءً تيمم. ويذكر المحقق أن عبد الرزاق وابن أبي شيبة رويا مثل ذلك عن عطاء ونحوه عن الحسن، وأن في الباب أحاديث مرفوعة عند البيهقي. {cite:muwatta-maruf-1997 p.104} {cite:muwatta-maruf-1997 p.105}"
  tr: "Malik'in adet gören bir kadının temizliği hakkındaki fetvası: Ona, adet gören ve temizlenen ancak su bulamayan bir kadın hakkında soru soruldu; teyemmüm (kuru abdest) almalı mıdır? Cevap verdi: Evet, teyemmüm almalıdır, çünkü durumu, su bulamayan ve teyemmüm alan büyük bir ritüel kirlilik halindeki bir kişinin durumuna benzer. Araştırmacı, Abdül-Razzak ve İbn Abi Şeybe'nin Ata'dan benzer bir şey, el-Hasan'dan da benzer bir şey rivayet ettiğini ve bu konuda Peygamberimize kadar uzanan isnad zincirleriyle el-Beyhaki'de bu konuda hadisler bulunduğunu belirtiyor. {cite:muwatta-maruf-1997 s.104} {cite:muwatta-maruf-1997 s.105}"
  id: "Fatwa Malik tentang penyucian wanita yang sedang haid: Beliau ditanya tentang seorang wanita yang sedang haid yang sudah suci tetapi tidak dapat menemukan air; haruskah dia melakukan tayammum (wudhu kering)? Beliau menjawab: Ya, dia harus melakukan tayammum, karena situasinya seperti orang yang dalam keadaan najis besar yang, jika tidak dapat menemukan air, melakukan tayammum. Peneliti menyebutkan bahwa Abd al-Razzaq dan Ibn Abi Shaybah meriwayatkan sesuatu yang serupa dari Ata, dan sesuatu yang serupa dari al-Hasan, dan bahwa ada hadits tentang topik ini dengan sanad yang dapat ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) dalam al-Bayhaqi. {cite:muwatta-maruf-1997 p.104} {cite:muwatta-maruf-1997 p.105}"
