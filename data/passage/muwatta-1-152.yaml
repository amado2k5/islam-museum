label: { ar: "الموطأ 152 — مالك: الحائض تطهر ولا تجد ماء تتيمم", en: "Muwatta 152" }
summary:
  ar: "فتوى لمالك في باب طهر الحائض: سُئل عن الحائض تطهر فلا تجد ماءً هل تتيمم، فقال: نعم، لتتيمم، فإن مثلها مثل الجنب إذا لم يجد ماءً تيمم. ويذكر المحقق أن عبد الرزاق وابن أبي شيبة رويا مثل ذلك عن عطاء ونحوه عن الحسن، وأن في الباب أحاديث مرفوعة عند البيهقي. {cite:muwatta-maruf-1997 p.104} {cite:muwatta-maruf-1997 p.105}"
