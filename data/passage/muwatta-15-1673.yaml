label: { ar: "الموطأ 1673 — ابن شهاب عن سعيد بن المسيب: نفيع طلق امرأة حرة تطليقتين، فاستفتى عثمان فقال حرمت عليك", en: "Muwatta 1673", es: "Muwatta 1673", fr: "Muwatta 1673", ur: "موطا 1673", tr: "El-Muvatta 1673 — İbn Şihab, Said bin el-Musayyab'dan rivayetle: Nafi', iki kez hür bir kadından boşandı, bu yüzden Osman'dan fetva istedi ve Osman şöyle dedi: \"O sana haramdır.\"", id: "Al-Muwatta 1673 — Ibn Shihab berdasarkan riwayat Saeed bin Al-Musayyab: Nafi’ menceraikan seorang wanita merdeka dua kali, lalu ia meminta fatwa kepada Uthman dan Uthman berkata: Dia haram bagimu" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أن نفيعا، مكاتبا كان لأم سلمة زوج النبي، طلق امرأة حرة تطليقتين، فاستفتى عثمان بن عفان، فقال حرمت عليك. {cite:muwatta-maruf-1997 p.86}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet eder ki, Peygamberin eşi Ümmü Seleme ile azat sözleşmesi yapmış olan Nafi' adlı bir köle, iki kez hür bir kadından boşandı. Bunun üzerine Osman ibn Affan'dan hukuki görüş istedi ve Osman ibn Affan, \"O sana haramdır\" dedi. {cite:muwatta-maruf-1997 s.86}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, bahwa Nafi', seorang budak yang memiliki perjanjian pembebasan dengan Umm Salamah, istri Nabi, menceraikan seorang wanita merdeka dua kali. Kemudian ia meminta pendapat hukum dari Utsman ibn Affan, yang berkata, \"Dia haram bagimu.\" {cite:muwatta-maruf-1997 p.86}"
