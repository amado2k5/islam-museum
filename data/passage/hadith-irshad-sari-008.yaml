text: "ابتدائه الى انتهائه فى كل عصر وهذا كاف فى افادة العلم وهذا (باب كتابة العلم) العمد على تقصر فى هذا الجال وبالسندالى المؤلف قال (حدثنا ابن سلام) بالتخفيف قال فى الكمال وقد يشدده من لا يعرف وقال للاطلاع عليه وهذا"
