text: "… بشق تمرة ١ فليفعل ، ومن لم يجد فبكلمة طيبة فإن بها تُجْزى الحسنة عشر أمثالها إلى سبعمائة ضعف والسلام [ عليكم و ] ٢ على رسول اللّٰه ٣ ٣ ورحمة اللّه وبركاته . ثم خطب رسول اللّٰه و في …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 1093، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 1093, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 1093 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 1093, que habla de la buena acción multiplicada; de la copia extraída, citada dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, p. 1093, qui parle de la multiplication des bonnes actions; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 1093. sayfasından, iyi amellerin çoğaltılmasından bahseden bir pasaj; alıntılanan versiyondan ve kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian,” hlm. 1093, yang menyebutkan tentang penggandaan amal kebaikan; dari versi yang diekstrak, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
