label: { ar: "موطأ مالك 1 — الأب والأبوة", en: "Muwatta Malik 1 — the father and fatherhood", ur: "موطأ مالک 1 — باپ اور والدیت", es: "Muwatta Malik 1 — El padre y la paternidad" }
text: "… اللَّهِ ثُمَّ صَلَّى فَصَلَّى رَسُولُ اللَّهِ ثُمَّ صَلَّى فَصَلَّى رَسُولُ اللَّهِ ثُمَّ صَلَّى فَصَلَّى رَسُولُ اللَّهِ ثُمَّ قَالَ \" بِهَذَا أُمِرْتُ \". فَقَالَ عُمَرُ بْنُ عَبْدِ الْعَزِيزِ اعْلَمْ مَا تُحَدِّثُ بِهِ يَا عُرْوَةُ أَوَ إِنَّ جِبْرِيلَ هُوَ الَّذِي أَقَامَ لِرَسُولِ اللَّهِ وَقْتَ الصَّلاَةِ قَالَ عُرْوَةُ كَذَلِكَ كَانَ بَشِيرُ بْنُ أَبِي مَسْعُودٍ الأَنْصَارِيُّ يُحَدِّثُ عَنْ أَبِيهِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1 (The Times of Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1 (Los horarios de oración), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
