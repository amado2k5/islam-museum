label: { ar: "سنن ابن ماجه 4217 — أدب المزاح وحدوده", en: "Sunan Ibn Majah 4217 — the ethics and limits of jesting", ur: "سنن ابن ماجہ 4217 — مزاح کے آداب اور حدود", fr: "Sunan Ibn Majah 4217 — l'éthique et les limites de la plaisanterie", es: "Sunan Ibn Majah 4217 — la ética y los límites de la broma", tr: "Sunan İbn Majah 4217 — Şakalaşmanın adabı ve sınırları", id: "Sunan Ibn Majah 4217 — Etika bercanda dan batas-batasnya" }
text: "… عَنْ أَبِي رَجَاءٍ، عَنْ بُرْدِ بْنِ سِنَانٍ، عَنْ مَكْحُولٍ، عَنْ وَاثِلَةَ بْنِ الأَسْقَعِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ يَا أَبَا هُرَيْرَةَ كُنْ وَرِعًا تَكُنْ أَعْبَدَ النَّاسِ وَكُنْ قَنِعًا تَكُنْ أَشْكَرَ النَّاسِ وَأَحِبَّ لِلنَّاسِ مَا تُحِبُّ لِنَفْسِكَ تَكُنْ مُؤْمِنًا وَأَحَسِنْ جِوَارَ مَنْ جَاوَرَكَ تَكُنْ مُسْلِمًا وَأَقِلَّ الضَّحِكَ فَإِنَّ كَثْرَةَ الضَّحِكِ تُمِيتُ الْقَلْبَ ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4217، فيه أدب المزاح وحدوده. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Ibn Majah, no. 4217, with the ethics and limits of jesting. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4217، جس میں مزاح کے آداب اور حدود ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Ibn Majah, n° 4217, avec l'éthique et les limites de la plaisanterie. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Ibn Majah, n.º 4217, con la ética y los límites de la broma. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "İbn Majah'ın Sünen'inde yer alan 4217 numaralı hadis, şaka yapmanın adabı ve sınırlarını ele almaktadır. Bu hadis, Juha ve İslami folklor derleyicisi tarafından Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 4217, membahas adab dan batasan bercanda. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
