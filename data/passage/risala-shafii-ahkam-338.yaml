text: "… كتاب السنة مع القُرَان من أن اللّٰه فرضَ الصلاةَ والزكَاةَ والحجَّ، فبَيّن رسولُ الله كيفَ الصلاةُ، وعددَها، ومواقيتَها، وسُنَتَها، وفى كم الزكَةُ من المال، وما يَسْقُظُ عنه من المال ويَثْبُتُ عليه، ووقتَها، وكيف عَمَلُ الحجّ، وما يُحتذَبُ فيه ويُباحُ - …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 338، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس، والفرض، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 338, whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 338 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
