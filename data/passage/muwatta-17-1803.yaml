label: { ar: "الموطأ 1803 — مالك: فيمن اشترى جارية على شرط أنه لا يبيعها ولا يهبها، لا ينبغي للمشتري أن يطأها، لأنه لا يملك بيعها ولا هبتها، فلم يملكها ملكا تاما، وكان بيعا مكروها", en: "Muwatta 1803" }
summary:
  ar: "قال مالك فيمن اشترى جارية على شرط أنه لا يبيعها ولا يهبها أو ما أشبه ذلك من الشروط: فإنه لا ينبغي للمشتري أن يطأها. وذلك أنه لا يجوز له أن يبيعها ولا أن يهبها. فإذا كان لا يملك ذلك منها، فلم يملكها ملكا تاما، لأنه قد استثني عليه فيها ما ملكه بيد غيره. فإذا دخل هذا الشرط لم يصلح، وكان بيعا مكروها. {cite:muwatta-maruf-1997 p.138} {cite:muwatta-maruf-1997 p.139}"
