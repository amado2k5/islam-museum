label: { ar: "الموطأ 1803 — مالك: فيمن اشترى جارية على شرط أنه لا يبيعها ولا يهبها، لا ينبغي للمشتري أن يطأها، لأنه لا يملك بيعها ولا هبتها، فلم يملكها ملكا تاما، وكان بيعا مكروها", en: "Muwatta 1803", es: "Muwatta 1803", fr: "Muwatta 1803", ur: "موطا 1803", tr: "El-Muvatta 1803 — Malik: Bir köle kızı satmamak veya başkasına vermemek şartıyla satın alan kişi, onunla cinsel ilişkiye girmemelidir; çünkü onu satma veya başkasına verme hakkı yoktur, dolayısıyla ona tamamen sahip değildir ve bu kınanacak bir satıştır.", id: "Al-Muwatta 1803 — Malik: Mengenai orang yang membeli seorang budak perempuan dengan syarat ia tidak akan menjual atau memberikannya kepada orang lain, pembeli tidak boleh melakukan hubungan seksual dengannya, karena ia tidak memiliki hak untuk menjual atau memberikannya kepada orang lain, sehingga ia tidak sepenuhnya memilikinya, dan itu adalah penjualan yang tercela." }
summary:
  ar: "قال مالك فيمن اشترى جارية على شرط أنه لا يبيعها ولا يهبها أو ما أشبه ذلك من الشروط: فإنه لا ينبغي للمشتري أن يطأها. وذلك أنه لا يجوز له أن يبيعها ولا أن يهبها. فإذا كان لا يملك ذلك منها، فلم يملكها ملكا تاما، لأنه قد استثني عليه فيها ما ملكه بيد غيره. فإذا دخل هذا الشرط لم يصلح، وكان بيعا مكروها. {cite:muwatta-maruf-1997 p.138} {cite:muwatta-maruf-1997 p.139}"
  tr: "Malik, bir köle kızı satmamak, başkasına vermemek veya benzeri bir şartla satın alan biri hakkında şunları söyledi: Alıcı onunla cinsel ilişkiye girmemelidir. Çünkü onu satmasına veya başkasına vermesine izin verilmez. Eğer bunu yapma hakkı yoksa, o zaman ona tamamen sahip olamaz, çünkü başkasının mülkiyetinde olan onunla cinsel ilişkiye girmesi engellenmiştir. Bu nedenle, bu şart eklenmişse, geçersizdir ve kınanması gereken bir satış teşkil eder. {cite:muwatta-maruf-1997 s.138} {cite:muwatta-maruf-1997 s.139}"
  id: "Malik berkata mengenai seseorang yang membeli seorang budak perempuan dengan syarat ia tidak akan menjualnya, memberikannya kepada orang lain, atau syarat serupa lainnya: Pembeli tidak boleh melakukan hubungan seksual dengannya. Hal ini karena ia tidak diperbolehkan untuk menjualnya atau memberikannya kepada orang lain. Jika ia tidak memiliki hak untuk melakukannya, maka ia tidak sepenuhnya memiliki budak tersebut, karena ia telah dilarang melakukan hubungan seksual dengannya saat budak tersebut berada di bawah kepemilikan orang lain. Oleh karena itu, jika syarat ini disertakan, maka penjualan tersebut tidak sah dan merupakan penjualan yang tercela. {cite:muwatta-maruf-1997 p.138} {cite:muwatta-maruf-1997 p.139}"
