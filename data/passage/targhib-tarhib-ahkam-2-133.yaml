text: "… انتهى قال الحافظ قيس بن الربيع صدوق وفيه كلام لسوء حفظه لا يخرج الإسناد عن حد الحسن وقد كان سفيان يكره الوضوء قبل الطعام قال البيهقى وكذلك مالك بن أنس كرهه وكذلك صاحبنا الصافعي استحب تركه واحتج بالحديث يعنى حديث …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 2، ص 133، يرد فيه ذكر المستحب، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 2, p. 133, whose wording mentions the recommended (mustahabb), what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 2، ص 133 کا اقتباس جس میں مستحب، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Targhib wa-l-Tarhib de al-Mundhiri, volume numérisé 2, p. 133, dont le texte mentionne le recommandé (mustahabb), ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Targhib wa-l-Tarhib de al-Mundhiri, volumen digitalizado 2, p. 133, cuyo texto menciona lo recomendado (mustahabb), lo que los juristas reprobaron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
