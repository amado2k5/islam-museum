label: { ar: "سنن أبي داود 919 — الأب والأبوة، تربية الأب ووصيته", en: "Sunan Abi Dawud 919 — the father and fatherhood; the father raising and counselling", ur: "سنن ابی داؤد 919 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 919 — El padre y la paternidad; la crianza y el asesoramiento paternos", fr: "Sunan Abi Dawud 919 — Le père et la paternité; l'éducation et les conseils du père", tr: "Sunan Abi Dawud 919 — Baba ve Babalık, Babanın Yetiştirilmesi ve İradesi", id: "Sunan Abi Dawud 919 — Ayah dan Peran Ayah, Didikan Ayah dan Wasiat" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ سَلَمَةَ الْمُرَادِيُّ، حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ مَخْرَمَةَ، عَنْ أَبِيهِ، عَنْ عَمْرِو بْنِ سُلَيْمٍ الزُّرَقِيِّ، قَالَ سَمِعْتُ أَبَا قَتَادَةَ الأَنْصَارِيَّ، يَقُولُ رَأَيْتُ رَسُولَ اللَّهِ يُصَلِّي لِلنَّاسِ وَأُمَامَةُ بِنْتُ أَبِي الْعَاصِ عَلَى عُنُقِهِ فَإِذَا سَجَدَ وَضَعَهَا. قَالَ أَبُو دَاوُدَ وَلَمْ يَسْمَعْ مَخْرَمَةُ مِنْ أَبِيهِ إِلاَّ حَدِيثًا وَاحِدًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 919، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 919 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 919، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 919 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad, así como la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 919 (La Prière), évoque le père et la paternité, l'éducation des enfants et les conseils prodigués par le père. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
  tr: "Sünen Ebu Davud'da yer alan 919 numaralı hadis, baba ve babalık, babanın çocuk yetiştirmedeki rolü ve vasiyeti konularını ele almaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 919, menyebutkan tentang ayah dan peran ayah, peran ayah dalam membesarkan anak, dan wasiatnya. Hadits ini disusun oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
