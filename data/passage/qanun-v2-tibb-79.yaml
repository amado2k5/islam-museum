text: "… ويلزم. وعلامات السرسام الحقيقي تتقدّم، ثم يعرض المرض، وأما الغير الحقيقي، فتتقدّمه أمراض أعضاء أخرى، ثم تظهر علاماته. وأما الكائن من جهة الحجاب الحاجز، وعضلات الصدر، فتتقدّمه علامات السرسام، وذات الجنب من وجع ناخس في الجنب عند التنفّس، وضيق نفس …"
