text: "… لأن الحوف نمرة العلم. ولذلك جاء فى خبر موسى عليه أفضل الصلاة والسلام، وأما الجاثفون فإن لهم الرفيق الأعلى لا يشار كون فيه. فاتظار كريف أفردم؟ رافقة الرفيق الأعلى، وذلك لأنهم العلماء والعلماء لهم رتبة مرافقة الأنبياء، لأنهم ورثة الأنبياء …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 2، ص 16، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 16, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 2، ص 16 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 2, pág. 16, que menciona un lecho de muerte y las últimas horas, lo que quedó: patrimonio y herencia; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du livre d'al-Ghazali, Ihya' 'Ulum al-Din, volume 2, page 16, évoquant un lit de mort et les dernières heures du défunt, ainsi que son héritage. Ce passage, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 2. cildinin 16. sayfasından alınan bir alıntı, ölen kişinin ölüm saatini, vefatını, geride bıraktığı mal varlığını ve mirasını anlatmaktadır; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 2, halaman 16, menyebutkan saat kematian dan wafatnya almarhum, serta harta warisan yang ditinggalkannya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
