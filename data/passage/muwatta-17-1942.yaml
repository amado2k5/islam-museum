label: { ar: "الموطأ 1942 — مالك: من الغرر والمخاطرة أن يعمد الرجل قد ضلت دابته أو أبق غلامه، وثمن الشيء خمسون دينارا، فيقول رجل: أنا آخذه منك بعشرين دينارا، فإن وجده المبتاع ذهب من البائع ثلاثون دينارا، وإن لم يجده ذهب البائع من المبتاع بعشرين", en: "Muwatta 1942" }
summary:
  ar: "قال مالك: ومن بيع الغرر والمخاطرة، أن يعمد الرجل قد ضلت دابته، أو أبق غلامه، وثمن الشيء من ذلك خمسون دينارا، فيقول رجل: أنا آخذه منك بعشرين دينارا، فإن وجده المبتاع ذهب من البائع ثلاثون دينارا، وإن لم يجده ذهب البائع من المبتاع بعشرين. قال مالك: وفي ذلك أيضا عيب آخر: إن تلك الضالة إن وجدت لم يدر أزادت أم نقصت، أم ما حدث بها من العيوب، فهذا أعظم المخاطرة. {cite:muwatta-maruf-1997 p.194} {cite:muwatta-maruf-1997 p.195}"
