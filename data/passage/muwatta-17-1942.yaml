label: { ar: "الموطأ 1942 — مالك: من الغرر والمخاطرة أن يعمد الرجل قد ضلت دابته أو أبق غلامه، وثمن الشيء خمسون دينارا، فيقول رجل: أنا آخذه منك بعشرين دينارا، فإن وجده المبتاع ذهب من البائع ثلاثون دينارا، وإن لم يجده ذهب البائع من المبتاع بعشرين", en: "Muwatta 1942", es: "Muwatta 1942", fr: "Muwatta 1942", ur: "موطا 1942", tr: "El-Muvatta 1942 — Malik: Bir adamın hayvanı kaybolmuş veya kölesi kaçmışsa ve malın fiyatı elli dinar ise, başka bir adam: \"Ben bunu senden yirmi dinara alacağım\" derse, bu bir aldatma ve risk sayılır. Alıcı bulursa satıcı otuz dinar kaybeder, bulamazsa satıcı alıcıdan yirmi dinar kaybeder.", id: "Al-Muwatta 1942 — Malik: Dianggap sebagai penipuan dan risiko jika hewan ternak seseorang tersesat atau budaknya melarikan diri, dan harga barang tersebut adalah lima puluh dinar, lalu orang lain berkata: Saya akan membelinya dari Anda seharga dua puluh dinar. Jika pembeli menemukannya, penjual kehilangan tiga puluh dinar, dan jika tidak menemukannya, penjual kehilangan dua puluh dinar dari pembeli." }
summary:
  ar: "قال مالك: ومن بيع الغرر والمخاطرة، أن يعمد الرجل قد ضلت دابته، أو أبق غلامه، وثمن الشيء من ذلك خمسون دينارا، فيقول رجل: أنا آخذه منك بعشرين دينارا، فإن وجده المبتاع ذهب من البائع ثلاثون دينارا، وإن لم يجده ذهب البائع من المبتاع بعشرين. قال مالك: وفي ذلك أيضا عيب آخر: إن تلك الضالة إن وجدت لم يدر أزادت أم نقصت، أم ما حدث بها من العيوب، فهذا أعظم المخاطرة. {cite:muwatta-maruf-1997 p.194} {cite:muwatta-maruf-1997 p.195}"
  tr: "Malik şöyle dedi: Belirsizlik ve risk içeren satışlardan biri de, bir adamın hayvanının kaybolması veya kölesinin kaçmasıdır; eşyanın fiyatı elli dinardır ve başka bir adam, \"Bunu senden yirmi dinara alacağım\" der. Alıcı bulursa satıcı otuz dinar kaybeder; bulamazsa satıcı yirmi dinar kaybeder. Malik şöyle devam etti: Bunun bir başka kusuru da şudur: Kayıp eşya bulunursa, boyutunun artıp artmadığı veya ne gibi kusurlar geliştirdiği bilinmez. Bu en büyük risktir. {cite:muwatta-maruf-1997 s.194} {cite:muwatta-maruf-1997 s.195}"
  id: "Malik berkata: Di antara penjualan yang melibatkan ketidakpastian dan risiko adalah ketika hewan ternak seseorang tersesat atau budaknya melarikan diri, dan harga barang tersebut adalah lima puluh dinar, dan orang lain berkata, \"Saya akan membelinya dari Anda seharga dua puluh dinar.\" Jika pembeli menemukannya, penjual kehilangan tiga puluh dinar; jika tidak menemukannya, penjual kehilangan dua puluh dinar. Malik berkata: Ada juga kekurangan lain dalam hal ini: jika barang yang hilang ditemukan, tidak diketahui apakah ukurannya bertambah atau berkurang, atau cacat apa yang telah berkembang. Ini adalah risiko terbesar. {cite:muwatta-maruf-1997 p.194} {cite:muwatta-maruf-1997 p.195}"
