text: "… و سلم أو ممن سمعه منهم و من عليتهم. و كانوا يسمون لذلك القراء اي الذين يقر أون الكتاب لأن العرب كانوا أمة أمية. فاختص من كان منهم قارئاً للكتاب بهذا الاسم لغرابته يومئذ.و بقي الأمر كذلك صدر الملة. ثم …"
