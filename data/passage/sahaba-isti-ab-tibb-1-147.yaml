text: "… مخرمة وصفوان وآسبة ذكر ها ابو سعيد فيمن اسلم من النساء وبايع و رفيدة ع امرأة من اسلم كان رسول انه قد جعل سعد بن معاذ في خيمتها فى مسجده ليعود ه من قريب وكانت امرأة لداوى الجرحى وتحتسب بنفسها …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 147، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 1, p. 147, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 1، ص 147 کا اقتباس جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 1, pág. 147, que menciona el tratamiento de heridas, mujeres que atienden a los heridos, búsqueda de tratamiento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 1, p. 147, qui mentionne le traitement des blessures, les femmes soignant les blessés, la recherche de soins; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 1. cildinin 147. sayfasında, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedaviden bahsedilmektedir; bu metin, makineyle okunabilir resimli versiyondan alınmış olup, kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 1, hlm. 147, menyebutkan pengobatan luka, wanita yang merawat orang terluka, dan perawatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
