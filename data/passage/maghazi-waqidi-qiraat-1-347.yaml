text: "نَجْد. وكان من الأَنصار سبعون رجلاً شَبَبَةً: يُسَمَّون القُرَّاءَ، كانوا إذا أَمسموا أَتوا ناحيةً من المدينة فتدارسوا وصدُّوا، حتى إِذا كان وجاه الصُّبْح استعذبوا من الماء وحطبوا من الحَطَب فجاءُوا به إلى حُجَر رسول اللّٰه ؛ وكان أَهلوهم يظنُّون أَنهم …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 347، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 347, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 347 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Maghazi de al-Waqidi, volumen 1, pág. 347, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
