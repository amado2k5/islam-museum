label: { ar: "الموطأ 1820 — مالك عن عبد الله بن أبي بكر: أن جده محمد بن عمرو بن حزم باع ثمر حائط له يقال له الأفراق بأربعة آلاف درهم، واستثنى منه بثمانمائة درهم تمرا", en: "Muwatta 1820", es: "Muwatta 1820", fr: "Muwatta 1820", ur: "موطا 1820", tr: "El-Muvatta 1820 — Malik, Abdullah ibn Abi Bekr'den rivayetle: dedesi Muhammed ibn Amr ibn Hazm, El-Afraq adlı bahçesinin meyvelerini dört bin dirheme satmış ve bu satıştan sekiz yüz dirhem değerindeki hurmaları hariç tutmuştur.", id: "Al-Muwatta 1820 — Malik, berdasarkan riwayat Abdullah ibn Abi Bakr: bahwa kakeknya, Muhammad ibn Amr ibn Hazm, menjual buah dari kebunnya yang bernama Al-Afraq seharga empat ribu dirham, dan ia mengecualikan kurma senilai delapan ratus dirham dari penjualan tersebut." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر أن جده محمد بن عمرو بن حزم باع ثمر حائط له يقال له الأفراق، بأربعة آلاف درهم، واستثنى منه بثمانمائة درهم تمرا. ويذكر المحقق أن الأفراق موضع بالمدينة. {cite:muwatta-maruf-1997 p.144} {cite:muwatta-maruf-1997 p.145}"
  tr: "Malik, Abdullah ibn Abi Bakr'dan rivayetle, dedesi Muhammed ibn Amr ibn Hazm'ın el-Afraq adlı bahçesinin meyvelerini dört bin dirheme sattığını ve sekiz yüz dirhem değerinde hurma satma şartı koştuğunu aktarır. Araştırmacı, el-Afraq'ın Medine'de bir yer olduğunu belirtir. {cite:muwatta-maruf-1997 s.144} {cite:muwatta-maruf-1997 s.145}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr bahwa kakeknya, Muhammad ibn Amr ibn Hazm, menjual buah dari kebunnya yang bernama al-Afraq seharga empat ribu dirham, dan menetapkan bahwa ia akan menjual kurma senilai delapan ratus dirham. Peneliti menyebutkan bahwa al-Afraq adalah sebuah tempat di Madinah. {cite:muwatta-maruf-1997 p.144} {cite:muwatta-maruf-1997 p.145}"
