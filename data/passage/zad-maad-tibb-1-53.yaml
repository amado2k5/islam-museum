text: "… تارة، وأَضافَ وأَضيفَ، واحتجم في وَسَطِ رأسه، وعلى ظهر قدمه، واحتجم في الأخدعين والكاهل وهو ما بين الكتفين، وتداوى، وكوى ولم يَكْتَوِ، ورقى ولم يَسْتَرْقٍ، وحمى المريض ممَّا يؤذيه. جمع القرآن لأصول الطب وأصول الطب ثلاثة: الحِمية، وحِفظُ الصحة، واستفراغُ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 53، يذكر الحجامة، والرقية، والطب والطبيب، والمرض والمريض، والبيمارستان وصناعة الطب، والصحة، والحمية، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 53, that mentions cupping, ruqya recited over the sick, medicine and the physician, illness and the sick, the hospital and the medical craft, health, diet as treatment, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 53 کا اقتباس جس میں حجامہ، رقیہ، طب اور طبیب، بیماری اور بیمار، بیمارستان، صحت، پرہیز، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
