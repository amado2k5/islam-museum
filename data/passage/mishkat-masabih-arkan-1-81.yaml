text: "… شعب الإيمان برواية فَضالة: والجاهد من جاهد نفسَه في طاعة الله، والمهاجرُ من هجرَ الخطايا والذنوب. - وعن أنس طه، قال: قَلَّما خَطَبَنا رسول الله ولِلَه إِلَّا قال: لا إيمان لمن لا أمانةَ له، ولا دين لمن لا عهد له. …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 81، يذكر شعب الإيمان، ووصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 81, that mentions the branches of faith, a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 81 کا اقتباس جس میں ایمان کی شاخیں، مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
