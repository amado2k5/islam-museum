text: "… احتضر وَالِ باب وفاته وَالالهِ تاريخ وفاته وَلِ يم باب عمره وَل مْ باب غسله وكفنه ودفنه ذِكر الصلاة عليه صفة قبره. باب أنّ النبيّ لم يستخلف باب تركة رسول اللّٰه وَلِعِ عدد أزواجه وَلِ عمْ فهارس السيرة النبوية. ® …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 700، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
