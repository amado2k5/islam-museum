text: "… أقول لك سلفاً مع السلامة جاءه في أحد الأيام ضيف فاحتفى به. ولما صار وقت الغداء تهيَّا لإطعامه، فقدم الخبز أولاً، وذهب ليأتي بالطعام، ولما حضر لم يجد الخبز فعاد ليأتي بالخبز، وحضر فرأى أن الطعام لم يبق منه شيء، …"
summary:
  ar: "قال ضيف فقد شهيته إنه سيزور طبيباً في بورصة، فقال جحا إنه سيغادر إلى قرية، ولذلك يودعه سلفاً. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  en: "A guest who has lost his appetite says he will see a doctor in Bursa, and Juha says he will leave for a village, so he says goodbye in advance. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  ur: "ایک مہمان جس کی بھوک جا چکی ہے کہتا ہے کہ وہ بروسہ میں طبیب کو دکھائے گا، تو جحا کہتا ہے کہ وہ ایک گاؤں چلا جائے گا، اس لیے پہلے ہی خدا حافظ کہہ دیتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  fr: "Un invité qui a perdu l'appétit dit qu'il ira voir un médecin à Bursa, et Juha dit qu'il partira pour un village, et lui dit donc adieu d'avance. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
  es: "Un invitado que ha perdido el apetito dice que irá a ver a un médico en Bursa, y Juha dice que se marchará a una aldea, así que se despide por adelantado. {cite:juha-nawadir-kubra-djuwaydi p. 121}"
