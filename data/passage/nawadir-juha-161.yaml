label: { ar: "نوادر جحا الكبرى، ص 74 — «أسف على حماره ولم يحزن على امرأته»", en: "Nawadir Juha al-Kubra, p. 74 — 'He Grieved for His Donkey but Not for His Wife'", ur: "نوادر جحا الکبریٰ، ص 74 — «وہ اپنے گدھے پر غمگین ہوا مگر بیوی پر نہیں»", fr: "Nawadir Juha al-Kubra, p. 74 — « Il pleura son âne mais non sa femme »", es: "Nawadir Juha al-Kubra, p. 74 — «Se afligió por su burro, pero no por su mujer»", tr: "Juha'nın Büyük Fıkraları, s. 74 — “Eşeği için üzüldü ama karısı için üzülmedi.”", id: "Anekdot Hebat Juha, hlm. 74 — “Ia berduka atas keledainya tetapi tidak berduka atas istrinya.”" }
text: "… أسف على حماره ولم يحزن على امرأته ماتت امرأتُهُ فلم يَأْسَفْ عليها كثيراً، وبعد مدَّةٍ فطس حمارُهُ فظهرَت عليه علائمُ الغمِّ والحزن، فقال له بعض أصدقائه: عجباً منك، ماتت امرأتك من قبل، ولم تحزن عليها هذا الحزن الذي حزنته على …"
summary:
  ar: "لما ماتت زوجة جحا حزن قليلًا، ولما مات حماره حزن شديدًا؛ فسُئل لماذا، فقال إن الجيران وعدوه بزوجة أفضل، أما عن الحمار فلم يأتِ أحد ليعزّيه. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  en: "After his wife dies Juha grieves little, but grieves hard when his donkey dies; asked why, he says the neighbours promised him a better wife, but nobody came to console him about the donkey. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  ur: "بیوی مری تو جحا کو ذرا سا غم ہوا، اور گدھا مرا تو بہت غم ہوا؛ وجہ پوچھی گئی تو اس نے کہا کہ پڑوسیوں نے مجھے بہتر بیوی کا وعدہ کیا، مگر گدھے کے بارے میں مجھے تسلی دینے کوئی نہیں آیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  fr: "Après la mort de sa femme, Juha s'afflige peu, mais s'afflige fort à la mort de son âne; quand on lui demande pourquoi, il dit que les voisins lui ont promis une meilleure épouse, mais que personne n'est venu le consoler pour l'âne. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  es: "Tras la muerte de su mujer, Juha se aflige poco, pero se aflige mucho cuando muere su burro; preguntado por qué, dice que los vecinos le prometieron una esposa mejor, pero nadie vino a consolarlo por el burro. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  tr: "Juha'nın karısı öldüğünde hafifçe üzülmüştü, ama eşeği öldüğünde çok derinden üzülmüştü. Neden diye sorulduğunda, komşularının ona daha iyi bir eş sözü verdiklerini, ama eşeğine gelince, kimsenin taziye dilemeye gelmediğini söylemişti. {cite:juha-nawadir-kubra-djuwaydi s. 74}"
  id: "Ketika istri Juha meninggal, ia sedikit sedih, tetapi ketika keledainya mati, ia sangat sedih. Ketika ditanya mengapa, ia menjawab bahwa tetangganya telah menjanjikannya istri yang lebih baik, tetapi untuk keledainya, tidak ada seorang pun yang datang untuk menyampaikan belasungkawa. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
