summary:
  ar: "القسم 24 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزكاة»، ويضم فيها النصوص من 1395 إلى 1512 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 24 of Sahih al-Bukhari (Obligatory Charity Tax (Zakat)) in the division of the open hadith dataset the museum took its reports from: reports 1395 to 1512 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 24، عنوان «کتاب الزکاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1395 تا 1512۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 24 de Sahih al-Bukhari (Impuesto obligatorio sobre la caridad (Zakat)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1395 al 1512, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 24, relatif à l'aumône obligatoire (Zakat)), soit les hadiths 1395 à 1512 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 24. bölümü \"Zekat Kitabı\" başlığını taşımakta olup 1395 ile 1512 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 24 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Zakat\" dan berisi teks-teks bernomor 1395 hingga 1512. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
