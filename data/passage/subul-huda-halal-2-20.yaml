text: "أَى تحلنا فالباء هنا للتعدية، ولم تَقْتَضِ المشاركة لأَن الديار لم تكن حراماً فتصير حلالاً، ولكون الباء بمعنى الهمزة لا يُجْمَع بينهما، فلا يُقال أَذْهَبْتُ بزيد. وَجَزَمَ ابن دَحْيَة - بفتح الدال وكسرها - وابن المنير، بما قاله المُبَرّد فقالا …"
