label: { ar: "الموطأ 1456 — ابن شهاب عن قبيصة بن ذؤيب: فرض عمر بن الخطاب للجد الفريضة التي يفرضها الناس له اليوم", en: "Muwatta 1456", es: "Muwatta 1456", fr: "Muwatta 1456", ur: "موطا 1456", tr: "El-Muvatta 1456 — İbn Şihab, Kâbisah ibn Züeyb'den rivayetle: Ömer ibn el-Hattab, dedesi için bugün insanların ona biçtiği aynı mirası biçmiştir.", id: "Al-Muwatta 1456 — Ibn Shihab, berdasarkan riwayat Qabisah ibn Dhu’ayb: Umar ibn al-Khattab menetapkan bagi kakeknya warisan yang sama seperti yang ditetapkan orang-orang untuknya saat ini." }
summary:
  ar: "يروي مالك عن ابن شهاب عن قبيصة بن ذؤيب أن عمر بن الخطاب فرض للجد الذي يفرض له الناس اليوم. ويذكر المحقق أن الرواية في موطأ أبي مصعب. {cite:muwatta-maruf-1997 p.12}"
  tr: "Malik, İbn Şihab'dan, o da Kubeysah ibn Züeyb'den rivayetle, Ömer ibn el-Hattab'ın dedesine, günümüzde insanların tahsis ettiği paya benzer bir pay ayırdığını nakletmiştir. Araştırmacı, bu rivayetin Ebu Musab'ın Muvatta'sında bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.12}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Qubaysah ibn Dhu'ayb, bahwa Umar ibn al-Khattab memberikan bagian kepada kakeknya, bagian yang sama seperti yang diberikan orang-orang saat ini. Peneliti mencatat bahwa riwayat ini ditemukan dalam Muwatta' karya Abu Mus'ab. {cite:muwatta-maruf-1997 p.12}"
