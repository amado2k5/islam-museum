text: "… تخلص الشيخ من أسئلة مطوّلة بلطف ذهب الشيخ عندما كان طالب علم، إلى بعض القرى للوعظ، فكان أهلُها يرحّبون به، ويسألونه عن صحته حسب العادة، ولكن أهالي القرية بدأوه بالسؤال عن أقاربه، وأصدقائه، وأشغاله، وجيرانه، وغيرهم، ممَّا يطولُ شرحُه، فضاق …"
summary:
  ar: "كان جحا طالباً يعظ في القرى، وكان الناس يسألونه أسئلة طويلة عن أقاربه وأصدقائه وعمله وجيرانه، فكتب أجوبة بخط كبير تغطي كل الأسئلة المحتملة ووزعها لينهي السؤال. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  en: "As a student Juha preaches in villages where people ask long questions about his relatives, friends, work and neighbours; he writes answers in large script covering all likely questions and hands them out to end the questioning. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  ur: "جحا طالب علم تھا اور دیہات میں وعظ کرتا تھا جہاں لوگ اس کے رشتہ داروں، دوستوں، کام اور پڑوسیوں کے بارے میں لمبے سوال پوچھتے تھے، تو اس نے موٹے خط میں ہر ممکنہ سوال کے جواب لکھ کر تقسیم کر دیے تاکہ سوالات ختم ہو جائیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  fr: "Étudiant, Juha prêche dans des villages où l'on lui pose de longues questions sur ses parents, ses amis, son travail et ses voisins ; il écrit en gros caractères des réponses couvrant toutes les questions probables et les distribue pour mettre fin aux interrogatoires. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  es: "Siendo estudiante, Juha predica en aldeas donde le hacen largas preguntas sobre sus parientes, amigos, trabajo y vecinos; escribe con letra grande respuestas que cubren todas las preguntas probables y las reparte para poner fin al interrogatorio. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
