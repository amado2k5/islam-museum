text: "… فرجعت فخفف عني عشرًا، فلم أزل بين ربي وموسى حتى جعلها خمسًا، فقال: ارجع فاسأله التخفيف، فقلت: إني قد استحيت من ربي وما أنا براجع، فنوديت: إني قد فرضت عليك وعلى أمتك خمسين صلاة والخمس بخمسين، وقد أمضيت فريضتي وخففت …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 548، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
