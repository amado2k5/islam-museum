text: "… الْحَارِثِ بْنِ عَبْدِ اللَّهِ بْنِ أَوْسٍ، قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ \" مَنْ حَجَّ هَذَا الْبَيْتَ أَوِ اعْتَمَرَ فَلْيَكُنْ آخِرُ عَهْدِهِ بِالْبَيْتِ \". فَقَالَ لَهُ عُمَرُ خَرَرْتَ مِنْ يَدَيْكَ سَمِعْتَ هَذَا مِنْ رَسُولِ اللَّهِ وَلَمْ تُخْبِرْنَا بِهِ. قَالَ وَفِي الْبَابِ عَنِ ابْنِ عَبَّاسٍ. قَالَ أَبُو عِيسَى حَدِيثُ الْحَارِثِ بْنِ عَبْدِ اللَّهِ بْنِ أَوْسٍ حَدِيثٌ غَرِيبٌ. وَهَكَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 946، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 946 (The Book on Hajj), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 946، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 946 (El Libro del Hajj), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 946 (Le Livre du Hajj), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'de 946 numaralı hadis, vasiyet veya son bir ahitten bahsetmektedir. Bu hadis, vasiyet, miras, eski eserler ve türbeler üzerine çalışan araştırmacılar tarafından Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 946, menyebutkan wasiat atau perjanjian terakhir. Hadits ini dikumpulkan oleh para peneliti wasiat, warisan, barang antik, dan makam suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
