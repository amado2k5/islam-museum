text: "… الحاكم صاحب مصر هدم بيعة قامة وهذه البيعة تجاوربيت المقدس وهى عظيمة القدر عند النصارى وكانوا يخر جون فى كل سنة من المواضع فى العماريات الى بيت المقدس لحضور فصحهم وربما جاء ملك الروم وكبراء بطارقته متنكرا ويحملون اليها الاموال …"
summary:
