label: { ar: "الموطأ 1569 — مالك: إذا أسلم الرجل قبل امرأته، وقعت الفرقة بينهما إذا عرض عليها الإسلام فلم تسلم، لقول الله لا تمسكوا بعصم الكوافر", en: "Muwatta 1569", es: "Muwatta 1569", fr: "Muwatta 1569", ur: "موطا 1569", tr: "El-Muvatta 1569 — Malik: Bir erkek karısından önce İslam'ı kabul ederse, eğer karısına İslam tanıtılır da o kabul etmezse, Allah'ın şu sözü nedeniyle ayrılırlar: \"İnkarcı kadınlarla evlilik bağını sürdürmeyin.\"", id: "Al-Muwatta 1569 — Malik: Jika seorang pria memeluk Islam sebelum istrinya, mereka akan berpisah jika Islam diperkenalkan kepada istrinya dan dia tidak menerimanya, karena firman Allah: \"Janganlah kamu mengikatkan diri dalam ikatan perkawinan dengan wanita-wanita kafir.\"" }
summary:
  ar: "يقول مالك وإذا أسلم الرجل قبل امرأته وقعت الفرقة بينهما، إذا عرض عليها الإسلام فلم تسلم، لأن الله تعالى يقول في كتابه ولا تمسكوا بعصم الكوافر. {cite:muwatta-maruf-1997 p.53}"
  tr: "Malik şöyle diyor: Bir erkek karısından önce İslam'ı kabul ederse, karısına İslam tanıtılır ve kadın bunu reddederse, ayrılmış olurlar; çünkü Yüce Allah Kitabında şöyle buyurmaktadır: \"İnkarcı kadınlarla evlilik bağını koparmayın.\" {cite:muwatta-maruf-1997 s.53}"
  id: "Malik berkata: Jika seorang pria masuk Islam sebelum istrinya, mereka akan berpisah jika Islam diperkenalkan kepada istrinya dan dia menolak, karena Allah Yang Maha Kuasa berfirman dalam Kitab-Nya: \"Dan janganlah kamu bersekutu dengan perempuan-perempuan kafir.\" {cite:muwatta-maruf-1997 p.53}"
