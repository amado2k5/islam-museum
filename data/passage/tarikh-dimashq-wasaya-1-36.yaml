text: "… وشق الجيوب والنياحة ورفع الصوت بالبكاء ثم دعا بالمقرى ابى عبد اللّه خاصته حتى قرأ سورة ياسين وتغير حاله وطاب وقته وكان يعالج سكرات الموت الى ان قرأ اسناد ما روى ان رسول اللّه قال من كان آخر كلامه لا …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 36، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 1, p. 36, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 36 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 1, pág. 36, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh Dimashq d'Ibn 'Asakir (tome 1, p. 36) mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Asakir'in Resimli Şam Tarihi adlı eserinin 1. cildinin 36. sayfasından bir alıntı, vasiyetname veya son miras belgesinden ve ölüm saatinden bahsetmektedir; bu alıntı, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 1 Bergambar, halaman 36, menyebutkan surat wasiat atau testamen terakhir, dan saat kematian; dari edisi faksimili yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti surat wasiat, warisan, barang antik, dan tempat-tempat suci."
