text: "… هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِذَا تَوَضَّأَ الْعَبْدُ الْمُسْلِمُ - أَوِ الْمُؤْمِنُ - فَغَسَلَ وَجْهَهُ خَرَجَتْ مِنْ وَجْهِهِ كُلُّ خَطِيئَةٍ نَظَرَ إِلَيْهَا بِعَيْنَيْهِ مَعَ الْمَاءِ - أَوْ مَعَ آخِرِ قَطْرِ الْمَاءِ - فَإِذَا غَسَلَ يَدَيْهِ خَرَجَتْ مِنْ يَدَيْهِ كُلُّ خَطِيئَةٍ بَطَشَتْهَا يَدَاهُ مَعَ الْمَاءِ - أَوْ مَعَ آخِرِ قَطْرِ الْمَاءِ فَإِذَا غَسَلَ رِجْلَيْهِ خَرَجَتْ …"
summary:
  ar: "حديث في موطأ مالك، رقم 61، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 61 (Purity), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 61، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 61 (Pureza), que habla de malas acciones borradas y pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un rapport du Muwatta Malik, n° 61 (Pureté), évoque l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Malik'in Muvatta'sında yer alan 61 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 61, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
