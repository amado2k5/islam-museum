label: { ar: "سنن النسائي 147 — محو السيئات وحط الخطايا", en: "Sunan al-Nasa'i 147 — bad deeds erased and sins shed", ur: "سنن نسائی 147 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… قُلْتُ يَا رَسُولَ اللَّهِ كَيْفَ الْوُضُوءُ قَالَ \" أَمَّا الْوُضُوءُ فَإِنَّكَ إِذَا تَوَضَّأْتَ فَغَسَلْتَ كَفَّيْكَ فَأَنْقَيْتَهُمَا خَرَجَتْ خَطَايَاكَ مِنْ بَيْنِ أَظْفَارِكَ وَأَنَامِلِكَ فَإِذَا مَضْمَضْتَ وَاسْتَنْشَقْتَ مَنْخِرَيْكَ وَغَسَلْتَ وَجْهَكَ وَيَدَيْكَ إِلَى الْمِرْفَقَيْنِ وَمَسَحْتَ رَأْسَكَ وَغَسَلْتَ رِجْلَيْكَ إِلَى الْكَعْبَيْنِ اغْتَسَلْتَ مِنْ عَامَّةِ خَطَايَاكَ فَإِنْ أَنْتَ وَضَعْتَ وَجْهَكَ لِلَّهِ عَزَّ وَجَلَّ خَرَجْتَ مِنْ خَطَايَاكَ كَيَوْمَ وَلَدَتْكَ أُمُّكَ \". …"
summary:
  ar: "حديث في سنن النسائي، رقم 147، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 147 (The Book of Purification), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 147، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
