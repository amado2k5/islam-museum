text: "… يُحرِّمَ ما أحل اللَّه له، فكيف يجعلُ لِغيره التحريمَ؟ قالوا : وقد قال النبيَّ لِ لكُلُّ عَمَلٍ لَيْسَ عَلَيْهِ أَمْرُنَا فَهُو رَدَّ البخاري:، ومسلم: وهذا التحريمُ كذلك، فيكون رداً باطلاً. قالوا : ولأنه لا فرق بين تحريم الحلال، وتحليلِ الحرام، …"
summary:
