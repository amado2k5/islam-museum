text: |-
  •ضون)•
  : ٣٨٩
  وغزى والانى ضائنة والمع ضوائن وأضأن الرجل كثر ضأنه ⁦(ضين)⁩ الضين
  بالكسر ما بين الإبط والكشخ وأول الجنب الابع ثم الضين ثم الخضن وأضبئت الشئ واضطبنته
  جعلته فى ضبى وضينة الرجل أيضاعياله وكذلك الضينة بفتح الضاد وكسر الباء ومكان ضبن
  أى ضيق والمضبون الزمن ويشبه قلب الياه من الميم ⁦(فجن)⁩ الضجن بالجيم جبل
  معروف قال الاعشى • كخلقا"من هضبات الضجن• وكذلك قول ابن.قبل
  توم السير للضهن * والماء تصحيف وضجنان جبل بناحية مكة زن الضّيزن
  لذى يزاحم أباه فى امرأنه قال أوس
  والفارسية فيهم غير عنكرة * وكاهم لابيه ضيرن سلف
  ويقال الضيزن الذى يزاحك عند الاستقاء فى البئر وضيزن اسم صم ⁦(ضقن)⁩ الضغن
  والضغينة الحقد وقد ضغن عليه بالكمر ضغنا وتضاغن القوم واضطفنوا انطووا على
  الاحقاد واضطغفت الشئ اذا أخذته تحت حضنك وأنشد الاحر • كانه مضطغن صبيا
  أى حامله فى حجره وقال ابن مقبل
  اذا اضطخنت سلاحى عند مغرضها • ومرفوكتاس السيف اذشفا
  وفرس ضاغن لا يعطى ماعتدد من الجرى الا بالضرب قال الشماخ
  كماقومت ضغن الشموس المهاهن . واذاقسل فى الشاقة هى ذات ضغن فاتما يراد نزاعها الى
  وطنها قال الخليل ويقال للتحوص اذا وحت فاستصعبت على الجأنبه انهاذات شغب وضغن
  وقناة ضغنة أى عوباه وضغن فلان الى الدنيا يالكسرركن ومال وضغنى الى فلان أى ميلى
  ليه ⁦( ضفن)⁩ ضفن البعيد برجله خبط بها وضفن يفائطهرحى به وضقن على ناقته حل
  عليها أبوزيد ضفنت الى الوم أضف ن ضفنا اذا أتيتهم تجلس اليهم وضفنت الرجل اذا ضريت
  برجلك على عحره واضقن هواذانرب بقدهه مؤخر نفسموضغنت بالانسان الارض اذا
  ضر بتهابه والضفنّ على وزن الهيف الاحق من الرجال مع عظم خلق والضيفن ذكرناممع
  الضيف من) ضمنت الذى صحانا كفات يه فأناضا من وضعين وضحنته الشى تضمينا
  تتضمنه عن مثل غرمته وكل شى جعلته فى وعاء فقد ضفته اياه والمضحن من الشعر ما ضمنته
  بتا والمضمن من البيت مالا يتمّ معناه الا بالذى بلميه وفهمت ما تضمنه كايك أى ما اشتمل على
  وكان فى ضمنه وأنفذته ضهن كابى أى فى طيه والضمنة بالضم من قولك كانت ضمنة فلان
  أربعة أشه وأى حرضه ورجل ضمن وهو الذى به الزمانة فى جسدم من بلا ء أو كسرأ وغيره
  وأنشد الاحر
  ما خلتنى زات بعدكم ضمنا * أشكواليكم جوّة الالم
  والاسم الضمن والضمان قال أبن أح روكان قدسقى بطنه
  اليك اله الخلق أرفع رغبقى ، عياذا وخوفا أن تطيل ضمائيا
  والضمانة الزمانة وقد صمن الرجل بالكسر ضمنا فهوذ عن أى زمن مبعلى وفى الحديث من
  اكتتب ضهنا بعنه اللّه ضمنا أى من كتب نقسه فى ديوان النهنى أى الزمنى والضامنسة من
  النخيل ما تكون فى القرية وفى الحديث انه عليه الصلاة والسلام كتب لحارثة بن قطن ومن
  بدومة الجندل من كلب ان لنا الضاحية من البعل وابكم الضاحنة من الخل فااضاحية هى
