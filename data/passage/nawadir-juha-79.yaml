label: { ar: "نوادر جحا الكبرى، ص 42 — «لو خلعت ثيابك لما تبللت»", en: "Nawadir Juha al-Kubra, p. 42 — 'Had You Taken Off Your Clothes, You Would Not Have Gotten Wet'", ur: "نوادر جحا الکبریٰ، ص 42 — «اگر کپڑے اتار دیتے تو بھیگتے نہیں»", fr: "Nawadir Juha al-Kubra, p. 42 — « Si tu avais ôté tes vêtements, tu ne te serais pas mouillé »", es: "Nawadir Juha al-Kubra, p. 42 — «Si te hubieras quitado la ropa, no te habrías mojado»" }
text: "… لو خلعْتَ ثيابَك لَمَا تبلَّلْتَ ذهبَ يوماً معَ تيمور لنك للصيد، وقد أركبوه جواداً بطيءَ الحركة، فهَطَلَتْ أمطار غزيرة فأسرع السلطان وحاشيتُه بالرجوع وأنقطع جحا في البرية، فلما رأى نفسَه منفرداً خلعَ ثيابَهُ ووضعَها تحتهُ وسار على جواده إلى أنِ …"
summary:
  ar: "فاجأ المطر جحا في رحلة صيد فخلع ثيابه وواصل الركوب ووصل جافًا، فجعل تيمور لنك لحصانه مكانًا في إسطبله، وفي اليوم التالي ابتلّ تيمور ووبّخ جحا، فقال له جحا إن عليه أن يخلع ثيابه هو أيضًا. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  en: "Caught in the rain on a hunt, Juha strips and rides on, arriving dry; Timur Lenk gives the horse a place among his stable; the next day Timur is soaked and rebukes Juha, who says he should have taken off his clothes too. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  ur: "شکار کے دوران بارش نے جحا کو آ لیا تو اس نے کپڑے اتار دیے اور سواری جاری رکھی اور خشک پہنچا؛ تیمور لنگ نے اس کے گھوڑے کو اپنے اصطبل میں جگہ دی؛ اگلے دن تیمور بھیگ گیا اور جحا کو ڈانٹا، تو جحا نے کہا کہ آپ کو بھی کپڑے اتار دینے چاہیے تھے۔ {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  fr: "Surpris par la pluie lors d'une chasse, Juha se dévêt et continue à cheval, arrivant au sec ; Timur Lenk donne au cheval une place dans ses écuries ; le lendemain, Timur est trempé et réprimande Juha, qui répond qu'il aurait dû lui aussi ôter ses vêtements. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
  es: "Sorprendido por la lluvia en una cacería, Juha se desnuda y sigue cabalgando, y llega seco; Timur Lenk da al caballo un lugar entre sus cuadras; al día siguiente Timur queda empapado y reprende a Juha, que dice que también él debería haberse quitado la ropa. {cite:juha-nawadir-kubra-djuwaydi p. 42}"
