label: { ar: "الموطأ 1440 — مالك: إن ظن المضطر أن أهل الثمر أو الزرع أو الغنم يصدقونه بضرورته أكل مما يرد جوعه، وإلا فأكل الميتة خير له", en: "Muwatta 1440", es: "Muwatta 1440", fr: "Muwatta 1440", ur: "موطا 1440", tr: "El-Muvatta 1440 — Malik: Eğer çok muhtaç olan kişi, meyve, ürün veya koyun sahiplerinin onun ihtiyacına inanacaklarına inanırsa, açlığını giderecek şeylerden yiyebilir; aksi takdirde leş yemek onun için daha iyidir.", id: "Al-Muwatta 1440 — Malik: Jika seseorang yang sangat membutuhkan percaya bahwa pemilik buah-buahan, tanaman, atau domba akan mempercayainya mengenai kebutuhannya, maka ia boleh makan dari apa yang dapat memuaskan rasa laparnya; jika tidak, memakan bangkai lebih baik baginya." }
summary:
  ar: "سئل مالك عن الرجل يضطر إلى الميتة، أيأكل منها، وهو يجد ثمر القوم أو زرعا أو غنما بمكانه؟ فقال إن ظن أن أهل ذلك يصدقونه بضرورته حتى لا يعد سارقا فتقطع يده، رأى أن يأكل من أي ذلك وجد ما يرد جوعه، ولا يحمل منه شيئا، وذلك أحب إليه من أكل الميتة. وإن خشي أن لا يصدقوه ويعدوه سارقا، فأكل الميتة خير له عنده، وله في ذلك سعة، مع أنه يخاف أن يعدو عاد ممن لم يضطر إلى الميتة، يريد استجازة أخذ أموال الناس بذلك. قال مالك وهذا أحسن ما سمعت. {cite:muwatta-maruf-1997 p.644}"
  tr: "Malik'e, leş yemek zorunda kalan bir adam hakkında soru soruldu. Bulunduğu yerde meyve, ekin veya koyun bulabiliyorsa leş yemeli midir? Malik şöyle cevap verdi: “Eğer oradaki insanların onun çaresiz durumuna inanacağına, hırsız olarak görülmeyeceğine ve elinin kesilmeyeceğine inanıyorsa, açlığını gidermek için bulduğu her şeyi yemeli, yanına hiçbir şey almamalıdır. Bu, leş yemekten daha iyidir. Ancak, insanların ona inanmayacağından ve onu hırsız olarak göreceğinden korkuyorsa, leş yemek onun için daha iyidir ve bu konuda bir esneklik payı vardır. Dahası, leş yemek zorunda kalmayan birinin bunu bahane ederek insanların parasını çalabileceğinden korkuyor olabilir.” Malik, “Bu duyduğum en iyi görüş” dedi."
  id: "Malik ditanya tentang seorang pria yang terpaksa memakan bangkai. Haruskah dia memakannya jika dia dapat menemukan buah-buahan, hasil panen, atau domba di tempatnya? Dia menjawab, “Jika dia yakin bahwa orang-orang di sana akan mempercayainya mengenai kebutuhannya yang mendesak, sehingga dia tidak dianggap sebagai pencuri dan tangannya tidak dipotong, maka dia harus memakan apa pun yang dia temukan untuk memuaskan rasa laparnya, tanpa membawa apa pun. Ini lebih baik daripada memakan bangkai. Namun, jika dia takut mereka tidak akan mempercayainya dan akan menganggapnya sebagai pencuri, maka memakan bangkai lebih baik baginya, dan dia memiliki kelonggaran dalam hal ini. Selain itu, dia takut bahwa seseorang yang tidak terpaksa memakan bangkai mungkin menggunakan ini sebagai dalih untuk mengambil uang orang lain.” Malik berkata, “Ini adalah pendapat terbaik yang pernah kudengar.”"
