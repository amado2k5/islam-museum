label: { ar: "الموطأ 1440 — مالك: إن ظن المضطر أن أهل الثمر أو الزرع أو الغنم يصدقونه بضرورته أكل مما يرد جوعه، وإلا فأكل الميتة خير له", en: "Muwatta 1440" }
summary:
  ar: "سئل مالك عن الرجل يضطر إلى الميتة، أيأكل منها، وهو يجد ثمر القوم أو زرعا أو غنما بمكانه؟ فقال إن ظن أن أهل ذلك يصدقونه بضرورته حتى لا يعد سارقا فتقطع يده، رأى أن يأكل من أي ذلك وجد ما يرد جوعه، ولا يحمل منه شيئا، وذلك أحب إليه من أكل الميتة. وإن خشي أن لا يصدقوه ويعدوه سارقا، فأكل الميتة خير له عنده، وله في ذلك سعة، مع أنه يخاف أن يعدو عاد ممن لم يضطر إلى الميتة، يريد استجازة أخذ أموال الناس بذلك. قال مالك وهذا أحسن ما سمعت. {cite:muwatta-maruf-1997 p.644}"
