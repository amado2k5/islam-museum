label: { ar: "الموطأ 2152 — مالك عن عبد الرحمن بن محمد بن عبد الله بن عبد القاري عن أبيه: قدم على عمر بن الخطاب رجل من قبل أبي موسى الأشعري، فسأله عن الناس، ثم قال: هل كان فيكم من مغربة خبر؟ قال: نعم، رجل كفر بعد إسلامه، فقتلوه. فقال عمر: أفلا حبستموه ثلاثا وأطعمتموه كل يوم رغيفا واستتبتموه؟", en: "Muwatta 2152", es: "Muwatta 2152", fr: "Muwatta 2152", ur: "موطا 2152", tr: "El-Muvatta 2152 — Malik, Abdurrahman ibn Muhammed ibn Abdullah ibn Abdulkari'den, o da babasından rivayetle: Ebu Musa el-Eş'ari'nin rivayetiyle Ömer ibn el-Hattab'a bir adam geldi ve ona insanlar hakkında sordu, sonra da: \"Aranızda garip bir haber var mı?\" dedi. Adam: \"Evet, bir adam İslam'ı kabul ettikten sonra dinden döndü, bu yüzden onu öldürdüler.\" dedi. Ömer: \"Neden onu üç gün hapse atmadınız, her gün bir somun ekmek yedirip tövbe etmesi için fırsat vermediniz?\" dedi.", id: "Al-Muwatta 2152 — Malik, berdasarkan riwayat Abdur-Rahman ibn Muhammad ibn Abdullah ibn Abdul-Qari, berdasarkan riwayat ayahnya: Seorang pria datang kepada Umar ibn al-Khattab berdasarkan riwayat Abu Musa al-Ash'ari, dan Umar bertanya kepadanya tentang orang-orang, lalu Umar bertanya: Apakah ada berita aneh di antara kalian? Umar menjawab: Ya, ada seorang pria yang murtad setelah memeluk Islam, lalu mereka membunuhnya. Umar berkata: Mengapa kamu tidak memenjarakannya selama tiga hari, memberinya sepotong roti setiap hari, dan memberinya kesempatan untuk bertaubat?" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن محمد بن عبد الله بن عبد القاري عن أبيه أنه قال: قدم على عمر بن الخطاب رجل من قبل أبي موسى الأشعري، فسأله عن الناس، فأخبره، ثم قال له عمر: هل كان فيكم من مغربة خبر؟ فقال: نعم، رجل كفر بعد إسلامه. قال: فما فعلتم به؟ قال: قربناه فضربنا عنقه. فقال عمر: أفلا حبستموه ثلاثا، وأطعمتموه كل يوم رغيفا، واستتبتموه لعله يتوب ويراجع أمر الله؟ ثم قال عمر: اللهم إني لم أحضر، ولم آمر، ولم أرض، إذ بلغني. {cite:muwatta-maruf-1997 p.280} {cite:muwatta-maruf-1997 p.281}"
  tr: "Malik, Abdurrahman ibn Muhammed ibn Abdullah ibn Abdurkari'den, babasından rivayetle şöyle naklediyor: Ebu Musa el-Eş'ari'nin emriyle Ömer ibn el-Hattab'a bir adam geldi. Ömer ona insanlar hakkında sordu ve adam ona bilgi verdi. Sonra Ömer ona: \"Aranızda garip bir haber var mıydı?\" dedi. Adam: \"Evet, bir adam İslam'ı kabul ettikten sonra dinden döndü.\" dedi. Ömer: \"Ona ne yaptınız?\" diye sordu. Adam: \"Onu yanımıza getirdik ve başını kestik.\" dedi. Ömer: \"Neden onu üç gün hapse atmadınız, her gün bir somun ekmek yedirip tövbe etmesi ve Allah yoluna dönmesi için bir fırsat vermediniz?\" dedi. Bunun üzerine Ömer: \"Ey Allah'ım, ben orada değildim, ne emrettim ne de onayladım, bana ulaştığında.\" dedi. {cite:muwatta-maruf-1997 s.280} {cite:muwatta-maruf-1997 s.281}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn Muhammad ibn Abdullah ibn Abd al-Qari, dari ayahnya, bahwa ia berkata: Seorang pria datang kepada Umar ibn al-Khattab atas perintah Abu Musa al-Ash'ari. Umar bertanya kepadanya tentang orang-orang, dan dia memberitahukannya. Kemudian Umar berkata kepadanya: \"Apakah ada berita aneh di antara kalian?\" Dia berkata: \"Ya, seorang pria murtad setelah memeluk Islam.\" Umar berkata: \"Apa yang kalian lakukan padanya?\" Dia berkata: \"Kami membawanya mendekat dan memenggal kepalanya.\" Umar berkata: \"Mengapa kalian tidak memenjarakannya selama tiga hari, memberinya sepotong roti setiap hari, dan memberinya kesempatan untuk bertaubat agar dia kembali ke jalan Allah?\" Kemudian Umar berkata: \"Ya Allah, aku tidak hadir, tidak pula memerintahkannya, dan tidak pula menyetujuinya, ketika hal itu sampai kepadaku.\" {kutip:muwatta-maruf-1997 hal.280} {kutip:muwatta-maruf-1997 hal.281}"
