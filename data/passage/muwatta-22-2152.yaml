label: { ar: "الموطأ 2152 — مالك عن عبد الرحمن بن محمد بن عبد الله بن عبد القاري عن أبيه: قدم على عمر بن الخطاب رجل من قبل أبي موسى الأشعري، فسأله عن الناس، ثم قال: هل كان فيكم من مغربة خبر؟ قال: نعم، رجل كفر بعد إسلامه، فقتلوه. فقال عمر: أفلا حبستموه ثلاثا وأطعمتموه كل يوم رغيفا واستتبتموه؟", en: "Muwatta 2152" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن محمد بن عبد الله بن عبد القاري عن أبيه أنه قال: قدم على عمر بن الخطاب رجل من قبل أبي موسى الأشعري، فسأله عن الناس، فأخبره، ثم قال له عمر: هل كان فيكم من مغربة خبر؟ فقال: نعم، رجل كفر بعد إسلامه. قال: فما فعلتم به؟ قال: قربناه فضربنا عنقه. فقال عمر: أفلا حبستموه ثلاثا، وأطعمتموه كل يوم رغيفا، واستتبتموه لعله يتوب ويراجع أمر الله؟ ثم قال عمر: اللهم إني لم أحضر، ولم آمر، ولم أرض، إذ بلغني. {cite:muwatta-maruf-1997 p.280} {cite:muwatta-maruf-1997 p.281}"
