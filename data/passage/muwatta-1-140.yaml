label: { ar: "الموطأ 140 — ابن عمر يتيمم بالمربد ويمسح إلى المرفقين", en: "Muwatta 140" }
summary:
  ar: "أول أثر في باب العمل في التيمم. يرويه يحيى عن مالك عن نافع أنه أقبل هو وعبد الله بن عمر من الجرف، حتى إذا كانا بالمربد نزل عبد الله فتيمم صعيداً طيباً فمسح وجهه ويديه إلى المرفقين ثم صلى. ويعرّف المحقق المربد بأنه موضع قريب من المدينة، ويذكر أنه رواه عن مالك أبو مصعب وسويد وابن وهب وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير، وأن عبد الرزاق وابن أبي شيبة أخرجاه من طريق سالم ونافع عن ابن عمر بنحوه. {cite:muwatta-maruf-1997 p.100} {cite:muwatta-maruf-1997 p.101}"
