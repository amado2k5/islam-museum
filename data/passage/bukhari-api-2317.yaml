label: { ar: "صحيح البخاري 2317 — ما أُحل، ما حُرّم", en: "Sahih al-Bukhari 2317 — what was made lawful; what was made unlawful", ur: "صحیح بخاری 2317 — جو حلال کیا گیا، جو حرام کیا گیا", es: "Sahih al-Bukhari 2317 — lo que se hizo lícito; lo que se hizo ilícito", fr: "Sahih al-Bukhari 2317 — ce qui a été déclaré licite; ce qui a été déclaré illicite" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي مَالِكٌ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي بَكْرِ بْنِ حَزْمٍ، عَنْ عَمْرَةَ بِنْتِ عَبْدِ الرَّحْمَنِ، أَنَّهَا أَخْبَرَتْهُ قَالَتْ، عَائِشَةُا ـ أَنَا فَتَلْتُ، قَلاَئِدَ هَدْىِ رَسُولِ اللَّهِ بِيَدَىَّ، ثُمَّ قَلَّدَهَا رَسُولُ اللَّهِ بِيَدَيْهِ، ثُمَّ بَعَثَ بِهَا مَعَ أَبِي، فَلَمْ يَحْرُمْ عَلَى رَسُولِ اللَّهِ شَىْءٌ أَحَلَّهُ اللَّهُ لَهُ حَتَّى نُحِرَ الْهَدْىُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2317، يذكر ما أُحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 2317 (Representation, Authorization, Business by Proxy), that mentions what was made lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 2317، جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2317 (Representación, Autorización, Negocios por Poder), menciona lo que se ha declarado lícito y lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 2317 (Représentation, autorisation, commerce par procuration), mentionne ce qui a été déclaré licite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
