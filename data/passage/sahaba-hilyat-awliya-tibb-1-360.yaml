text: "… مما عذبه المشركون حدثنا عبد اللّٰه بن جعمر ثنا إسماعيل بن عبد اللّٰه ثنا آدم بن أبى إياس ثنا شعبة عن اسماعيل بن أبى خالد عن قيس بن أبى حازم. قال : دخلنا على خباب بن الأرت نعوده وقد اكتوى …"
