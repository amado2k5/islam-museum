text: "… فما رجع إليَّ قلبي إلى سنتين. قال عبد اللّٰه بن حبيق: قال يوسف بن أسباط: إني أخاف أن يعذب اللَّهُ الناسَ بذنوب العلماء. وقال: الأشياء ثلاثة: حلال بيِّن، وحرام بيِّن، وشبهات بين ذلك، فالمؤمن إذا لم يجد الحلال تناول من …"
