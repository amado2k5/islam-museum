text: "… اللّٰه وع ثلاث عُمَرٍ. وفي قول من جعله في حجّته قارناً : أربع عمر. وقد بيّنّا ذلك في كتاب التَّمهيد. وافتُرض عليه الحجُّ بالمدينة، وكذلك سائر الفرائض فيما أُمر به، أَو حُرِّمَ عليه إلاَّ الصلاة ؛ فإنَّها افترضت عليه حِين …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 34، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، وما فُرض على الناس، وما حُرّم على الناس؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 34, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, what was made obligatory on people, what was forbidden to people; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 34 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، جو لوگوں پر حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Isti'ab de Ibn 'Abd al-Barr, volume numérisé 3, p. 34, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, ce qui a été interdit aux gens ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen digitalizado 3, p. 34, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo que se prohibió a la gente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abdülberr'in el-İsti'ab adlı eserinin 3. cildinin 34. sayfasından bir alıntı, farz olan amelleri ve görevleri, Allah ve Resulü'nün emrettiklerini, insanlar için farz olanları ve haram olanları ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibnu Abd al-Barr, Jilid 3, halaman 34, membahas tentang amalan dan kewajiban yang wajib, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, apa yang wajib dilakukan manusia, dan apa yang dilarang bagi manusia. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
