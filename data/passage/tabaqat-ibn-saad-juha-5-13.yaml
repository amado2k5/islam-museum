text: "… الفضل بن دكين قال : حدِّثنا جعفر ابن بُرْقان عن ثابت بن الحجاح عن عبد اللّٰه بن سيدان السَّلَمىّ قال : تَناجى أَبو ذرّ وعمان حتى ارتفعت أَصواتهما، ثمّ انصرف أَبو دَرْ متبسّمًا فقال له الناس : مالك ولأمسير المؤمنين …"
