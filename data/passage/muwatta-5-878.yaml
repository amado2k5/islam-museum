ref: "878"
label: { ar: "الموطأ 878 — سُمي مولى أبي بكر بن عبد الرحمن: اعتكف أبو بكر، فكان يذهب لحاجته تحت سقيفة في حجرة مغلقة في دار خالد بن الوليد، ثم لا يرجع حتى يشهد العيد مع المسلمين", en: "Muwatta 878", es: "Muwatta 878", fr: "Muwatta 878", ur: "موطا 878", tr: "El-Muvatta 878 — Ebu Bekir ibn Abdülrahman'ın azatlı kölesi olarak anıldı: Ebu Bekir mescide inzivaya çekilir, Halid ibn el-Velid'in evindeki kapalı bir odadaki örtülü bir barınağa gider ve Müslümanlarla birlikte bayramı görmeden geri dönmezdi.", id: "Al-Muwatta 878 — Ia disebut sebagai budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman: Abu Bakr mengasingkan diri di masjid, dan ia akan pergi buang air di bawah naungan tertutup di sebuah ruangan tertutup di rumah Khalid ibn al-Walid, dan kemudian ia tidak akan kembali sampai ia menyaksikan Idul Fitri bersama kaum Muslimin." }
summary:
  ar: "يرويه يحيى عن زياد بن عبد الرحمن عن مالك عن سمي مولى أبي بكر بن عبد الرحمن، أن أبا بكر بن عبد الرحمن اعتكف، فكان يذهب لحاجته تحت سقيفة في حجرة مغلقة في دار خالد بن الوليد، ثم لا يرجع حتى يشهد العيد مع المسلمين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (874) وسويد (448). {cite:muwatta-maruf-1997 p.423}"
  tr: "Yahya, Ziyad ibn Abdülrahman'dan, o da Malik'ten, o da Ebu Bekir ibn Abdülrahman'ın azatlı kölesi Sümey'den rivayet ettiğine göre, Ebu Bekir ibn Abdülrahman kendini ibadete adamıştı. Halid ibn el-Velid'in evindeki kapalı bir odada, örtülü bir sığınak altında ihtiyaç gidermeye gider ve Müslümanlarla birlikte bayram namazını kılmadan geri dönmezdi. Editör, bunun Malik'ten Ebu Musab (874) ve Süveyd (448) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.423}"
  id: "Diriwayatkan oleh Yahya dari Ziyad ibn Abd al-Rahman, dari Malik, dari Sumayy, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, bahwa Abu Bakr ibn Abd al-Rahman mengasingkan diri untuk beribadah. Ia biasa pergi buang air di bawah naungan di ruangan tertutup di rumah Khalid ibn al-Walid, dan tidak akan kembali sampai ia menyaksikan shalat Id bersama kaum Muslimin. Editor menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (874) dan Suwayd (448). {cite:muwatta-maruf-1997 p.423}"
