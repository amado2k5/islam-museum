label: { ar: "الموطأ 878 — سُمي مولى أبي بكر بن عبد الرحمن: اعتكف أبو بكر، فكان يذهب لحاجته تحت سقيفة في حجرة مغلقة في دار خالد بن الوليد، ثم لا يرجع حتى يشهد العيد مع المسلمين", en: "Muwatta 878" }
summary:
  ar: "يرويه يحيى عن زياد بن عبد الرحمن عن مالك عن سمي مولى أبي بكر بن عبد الرحمن، أن أبا بكر بن عبد الرحمن اعتكف، فكان يذهب لحاجته تحت سقيفة في حجرة مغلقة في دار خالد بن الوليد، ثم لا يرجع حتى يشهد العيد مع المسلمين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (874) وسويد (448). {cite:muwatta-maruf-1997 p.423}"
