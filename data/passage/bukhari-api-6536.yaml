text: "… مُوسَى، عَنْ عُثْمَانَ بْنِ الأَسْوَدِ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ قَالَ \" مَنْ نُوقِشَ الْحِسَابَ عُذِّبَ \". قَالَتْ قُلْتُ أَلَيْسَ يَقُولُ اللَّهُ تَعَالَى {فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا}. قَالَ \" ذَلِكِ الْعَرْضُ \". حَدَّثَنِي عَمْرُو بْنُ عَلِيٍّ، حَدَّثَنَا يَحْيَى، عَنْ عُثْمَانَ بْنِ الأَسْوَدِ، سَمِعْتُ ابْنَ أَبِي مُلَيْكَةَ، قَالَ سَمِعْتُ عَائِشَةَا ـ قَالَتْ سَمِعْتُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6536، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 6536 (To make the Heart Tender (Ar-Riqaq)), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 6536، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
