summary:
  ar: "فتوى لمالك في باب جامع غسل الجنابة: سُئل عن جنب وُضع له ماء يغتسل به فسها فأدخل أصبعه فيه ليعرف حر الماء من برده، فقال: إن لم يكن أصاب أصبعه أذى فلا يرى ذلك ينجس عليه الماء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.98}"
