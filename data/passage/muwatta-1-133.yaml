label: { ar: "الموطأ 133 — مالك: الجنب يدخل أصبعه في الماء ليعرف حره من برده", en: "Muwatta 133", es: "Muwatta 133", fr: "Muwatta 133", ur: "موطا 133", tr: "Al-Muwatta 133 — Malik: Ritüel olarak kirlilik halinde olan bir kişi, suyun sıcak mı soğuk mu olduğunu anlamak için parmağını suya batırabilir.", id: "Al-Muwatta 133 — Malik: Seseorang yang dalam keadaan najis boleh mencelupkan jarinya ke dalam air untuk menentukan apakah air itu panas atau dingin." }
summary:
  ar: "فتوى لمالك في باب جامع غسل الجنابة: سُئل عن جنب وُضع له ماء يغتسل به فسها فأدخل أصبعه فيه ليعرف حر الماء من برده، فقال: إن لم يكن أصاب أصبعه أذى فلا يرى ذلك ينجس عليه الماء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.98}"
  tr: "Malik'in cinsel ilişkiden sonraki ritüel temizliğe ilişkin kapsamlı hükmüne dair bir fetva: Kendisine, ritüel temizlik için su verilen ve yanlışlıkla suyun sıcak mı soğuk mu olduğunu kontrol etmek için parmağını suya batıran, ritüel olarak kirli durumda olan bir kişi hakkında soru soruldu. Malik şöyle cevap verdi: Eğer parmağı zarar görmemişse, bu durum suyu kirli hale getirmez. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.98}"
  id: "Fatwa Malik mengenai hukum lengkap tentang penyucian ritual setelah hubungan seksual: Beliau ditanya tentang seseorang yang dalam keadaan najis secara ritual yang diberi air untuk bersuci, tetapi ia keliru mencelupkan jarinya ke dalam air tersebut untuk memeriksa apakah airnya panas atau dingin. Beliau menjawab: Jika jarinya tidak terluka, maka hal ini tidak menjadikan air tersebut najis. Peneliti menyebutkan bahwa fatwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.98}"
