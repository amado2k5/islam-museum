text: "أَشِحَّةً عَلَيْكُمْ ۖ فَإِذَا جَآءَ ٱلْخَوْفُ رَأَيْتَهُمْ يَنظُرُونَ إِلَيْكَ تَدُورُ أَعْيُنُهُمْ كَٱلَّذِى يُغْشَىٰ عَلَيْهِ مِنَ ٱلْمَوْتِ ۖ فَإِذَا ذَهَبَ ٱلْخَوْفُ سَلَقُوكُم بِأَلْسِنَةٍ حِدَادٍ أَشِحَّةً عَلَى ٱلْخَيْرِ ۚ أُو۟لَـٰٓئِكَ لَمْ يُؤْمِنُوا۟ فَأَحْبَطَ ٱللَّهُ أَعْمَـٰلَهُمْ ۚ وَكَانَ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرًا"
text_search: "أشحة عليكم ۖ فإذا جاء الخوف رأيتهم ينظرون إليك تدور أعينهم كالذي يغشى عليه من الموت ۖ فإذا ذهب الخوف سلقوكم بألسنة حداد أشحة على الخير ۚ أولئك لم يؤمنوا فأحبط الله أعمالهم ۚ وكان ذلك على الله يسيرا"
translations:
  en: { text: "Being sparing of their help to you (believers). But when the fear cometh, then thou (Muhammad) seest them regarding thee with rolling eyes like one who fainteth unto death. Then, when the fear departeth, they scald you with sharp tongues in their greed for wealth (from the spoil). Such have not believed. Therefor Allah maketh their deeds fruitless. And that is easy for Allah.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(یہ اس لئے کہ) تمہارے بارے میں بخل کرتے ہیں۔ پھر جب ڈر (کا وقت) آئے تو تم ان کو دیکھو کہ تمہاری طرف دیکھ رہے ہیں (اور) اُن کی آنکھیں (اسی طرح) پھر رہی ہیں جیسے کسی کو موت سے غشی آرہی ہو۔ پھر جب خوف جاتا رہے تو تیز زبانوں کے ساتھ تمہارے بارے میں زبان درازی کریں اور مال میں بخل کریں۔ یہ لوگ (حقیقت میں) ایمان لائے ہی نہ تھے تو خدا نے ان کے اعمال برباد کر دیئے۔ اور یہ خدا کو آسان تھا", translator: "Fateh Muhammad Jalandhari", license: PD }
