text: "… الى الشماسية لصيد السباع. وفيها خرج خلق كثير من تجار بغداد مع الحاج للانتقال الى الشام ومصر. لا تصال الفتن ببغداد وتواتر المحن عليهم من السلطان. وفيها ورد كتاب من ملك الروم يلتمس منديلا كان لعيسى مسح به وجهه فصارت …"
