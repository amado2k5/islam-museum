text: "أو لكلكم ثوبان؟"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة، في باب الرخصة في الصلاة في الثوب الواحد: سأل سائل النبي عن الصلاة في ثوب واحد، فأجابه مستفهماً: أو لكلكم ثوبان؟ ويخرّجه المحقق عند البخاري (358) ومسلم (2/61) وأبي داود (625) والنسائي (2/69) والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (6/363). {cite:muwatta-maruf-1997 p.202} {cite:muwatta-maruf-1997 p.203}"
