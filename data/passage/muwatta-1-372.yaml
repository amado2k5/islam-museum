label: { ar: "الموطأ 372 — أو لكلكم ثوبان؟", en: "Muwatta 372", es: "Muwatta 372", fr: "Muwatta 372", ur: "موطا 372", tr: "Al-Muwatta 372 — Yoksa her birinizin iki elbisesi mi var?", id: "Al-Muwatta 372 — Atau apakah kalian masing-masing mempunyai dua pakaian?" }
text: "أو لكلكم ثوبان؟"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة، في باب الرخصة في الصلاة في الثوب الواحد: سأل سائل النبي عن الصلاة في ثوب واحد، فأجابه مستفهماً: أو لكلكم ثوبان؟ ويخرّجه المحقق عند البخاري (358) ومسلم (2/61) وأبي داود (625) والنسائي (2/69) والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (6/363). {cite:muwatta-maruf-1997 p.202} {cite:muwatta-maruf-1997 p.203}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan, o da Ebu Hurayra'dan rivayetle, tek elbise ile namaz kılınmasının serbest olduğu bölümde şöyle nakletmiştir: Bir adam Peygamberimize tek elbise ile namaz kılmak hakkında sordu ve Peygamberimiz de sorgulayıcı bir şekilde şöyle cevap verdi: \"Hepinizin iki elbisesi mi var?\" Editör, bunu Buhari (358), Müslim (2/61), Ebu Davud (625), Nesai (2/69), Tahavi ve Beyhaki'de Malik'in sahabelerinin rivayet zincirleriyle yer aldığını ve Temhid'e (6/363) atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.202} {cite:muwatta-maruf-1997 s.203}"
  id: "Diriwayatkan oleh Malik dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, dari Abu Hurayrah, dalam surah tentang keringanan shalat dengan satu pakaian: Seorang pria bertanya kepada Nabi tentang shalat dengan satu pakaian, dan beliau menjawab dengan bertanya: \"Apakah kalian semua memiliki dua pakaian?\" Editor menyertakannya dalam al-Bukhari (358), Muslim (2/61), Abu Dawud (625), al-Nasa'i (2/69), al-Tahawi, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (6/363). {cite:muwatta-maruf-1997 p.202} {cite:muwatta-maruf-1997 p.203}"
