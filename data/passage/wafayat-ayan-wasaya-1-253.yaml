text: "بقيا من شهر ربيع الآخر سنة أربع وستين وماثنين، وهي السنة التي مات فيها المزني تعالى، وكانت وفاته بمصر، ودفن بمقابر الصدف، وقبره مشهور بالقرافة. وأما أبوه عبد الأعلى فانه يكنى أبا سلمة، وكان رجلا صالحاً، ومن كلامه : من …"
