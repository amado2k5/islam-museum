text: "… ثم حلب فيه ثانياً بعد بدء حتى ملا الإناء، ثم غادره عندها، ثم بايعها، وارتحل عنها. فقلٌ ما لَبِئَتْ حتى جاءَها زوجُها أبو مَعْبد يسوق أَعْنزاً عِجَافا يَتْساوَكَن هُزْلا ضُحاً، مُخّهُنْ قليل. في ص : بأبي أنت وأمي. في ص …"
