label: { ar: "سنن النسائي 4369 — ما حُرّم", en: "Sunan al-Nasa'i 4369 — what was made unlawful", ur: "سنن نسائی 4369 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 4369 — lo que se declaró ilícito", fr: "Sunan al-Nasa'i 4369 — ce qui a été déclaré illicite", tr: "Sunan an-Nasa'i 4369 — Yasak olan nedir?", id: "Sunan an-Nasa'i 4369 — Apa yang dilarang" }
text: "… عَمَّا، نَهَى عَنْهُ رَسُولُ اللَّهِ مِنَ الأَضَاحِي. قَالَ قَامَ رَسُولُ اللَّهِ وَيَدِي أَقْصَرُ مِنْ يَدِهِ فَقَالَ \" أَرْبَعٌ لاَ يَجُزْنَ الْعَوْرَاءُ الْبَيِّنُ عَوَرُهَا وَالْمَرِيضَةُ الْبَيِّنُ مَرَضُهَا وَالْعَرْجَاءُ الْبَيِّنُ ظَلْعُهَا وَالْكَسِيرَةُ الَّتِي لاَ تُنْقِي \". قُلْتُ إِنِّي أَكْرَهُ أَنْ يَكُونَ فِي الْقَرْنِ نَقْصٌ وَأَنْ يَكُونَ فِي السِّنِّ نَقْصٌ. قَالَ مَا كَرِهْتَهُ فَدَعْهُ وَلاَ تُحَرِّمْهُ عَلَى أَحَدٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 4369، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4369 (The Book of ad-Dahaya (Sacrifices)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4369، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4369 (El Libro de ad-Dahaya (Sacrificios)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4369 (Le Livre des sacrifices), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de yer alan 4369 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4369, menyebutkan apa yang dilarang. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
