label: { ar: "مسلم 2673 — إن الله لا يقبض العلم انتزاعاً", en: "Muslim 2673 — God does not snatch knowledge away" }
text: "سمع عبد الله بن عمرو بن العاص يقول: سمعت رسول الله يقول: «إن الله لا يقبض العلم انتزاعاً ينتزعه من الناس، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يترك عالماً اتخذ الناس رؤوساً جهالاً، فسُئلوا فأفتوا بغير علم، فضلوا وأضلوا»"
summary:
  ar: "رواية عبد الله بن عمرو بن العاص في كتاب الزهد من صحيح مسلم؛ قبض العلم بموت العلماء لا بانتزاعه، وفتوى الجهال آية من آيات ذهابه — من أشهر نصوص فضل العلماء."
