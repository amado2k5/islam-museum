label: { ar: "الموطأ 1424 — مالك: إذا تخلص الصيد من مخالب البازي أو فم الكلب ثم مات بعد التربص فلا يحل أكله، وكذا من ترك ذبحه وهو قادر", en: "Muwatta 1424" }
summary:
  ar: "يقول مالك أحسن ما سمعه في الذي يتخلص الصيد من مخالب البازي، أو من فم الكلب، ثم يتربص به فيموت، أنه لا يحل أكله. وكذلك كل ما قدر على ذبحه وهو في مخالب البازي، أو في فم الكلب، فيتركه صاحبه وهو قادر على ذبحه حتى يقتله البازي أو الكلب، فإنه لا يحل أكله. {cite:muwatta-maruf-1997 p.637}"
