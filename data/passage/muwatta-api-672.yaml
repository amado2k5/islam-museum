text: "… وَهُوَ يُبَدَّى عَلَى مَا سِوَاهُ مِنَ الْوَصَايَا إِلاَّ مَا كَانَ مِثْلَهُ وَذَلِكَ أَنَّهُ لَيْسَ الْوَاجِبُ عَلَيْهِ مِنَ النُّذُورِ وَغَيْرِهَا كَهَيْئَةِ مَا يَتَطَوَّعُ بِهِ مِمَّا لَيْسَ بِوَاجِبٍ وَإِنَّمَا يُجْعَلُ ذَلِكَ فِي ثُلُثِهِ خَاصَّةً دُونَ رَأْسِ مَالِهِ لأَنَّهُ لَوْ جَازَ لَهُ ذَلِكَ فِي رَأْسِ مَالِهِ لأَخَّرَ الْمُتَوَفَّى مِثْلَ ذَلِكَ مِنَ الأُمُورِ الْوَاجِبَةِ عَلَيْهِ حَتَّى إِذَا حَضَرَتْهُ الْوَفَاةُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 672، يرد فيه ذكر الواجب، والتطوع، وما ليس بواجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 672 (Fasting), whose wording mentions the obligatory (wajib), the voluntary act (tatawwu'), what is said not to be obligatory. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 672، جس کے الفاظ میں واجب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 672, dont le texte mentionne l'obligatoire (wajib), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 672, cuyo texto menciona lo obligatorio (wajib), el acto voluntario (tatawwu'), lo que se dice que no es obligatorio. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 672 numaralı hadis, farz, nafile ve farz olmayan amellerden bahsetmektedir. Bu hadis, farz, tavsiye edilen, mekruh edilen, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 672, menyebutkan amalan wajib, sunnah, dan najis. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, anjuran, najis, dan dosa kecil, beserta teks-teks terkait dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
