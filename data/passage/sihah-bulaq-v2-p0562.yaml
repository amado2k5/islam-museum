text: |-
  ٢٥
  وأركب فى اروع خفانة • كاوجهها سعف منتشر
  صل الدال ⁦( فف)⁩ الدف الجنب ودفا البعير جنباه والدف بالضم هذا
  الذّى تضرببه النساء وحكى أبو عبيد عن بعضهم أنّ الفتح فيه اغة وسنام مدذف اذاسط على
  دفى البعمر والدفيف الدعب وهو السير اللين يقال دفت علينا من بى فلان دافسة والدافة
  الجيسْ يدفون غحو العدوأى يدبون ودفيف الطائرمرّه فويق الارض يقالَ عقاب دفوف
  للذى يدنو من الارض فى طيرانه اذا انقض قال امر والقيس يصف فرسا ويشبهها بالعقاب
  كأتى بفتخاء الجناحين لقوة * دفوفمن العقبان طأطأت شملالى
  ودافقت الرجل مدافة ودفافا أجهزت عليه ومنه حديث خالدين الوليد رضى اللّٰه عنه من
  كان.مه أسيرفليدافه قال الاصعىّ يقال تداف القوم اذاركب بعضهم بعضا ويقال
  خذما استدف لك أى خذما أمكن ونسهل مثل استطغّ والدال مبدلة من الطاء
  واستدف أمرهم أى استتب واستقام ⁦(دلف)⁩ الدليف المشى الرويد يقال داف
  الشيخ اذامشى وقارب الخطو ودلفت الكتيبة فى الحرب أى تقدّمت يقال دلفناهم
  والدالف السهم الذى يصيب مادون الغرض ثم ينبو عن موضعه والدالف أيضامثل الدالح
  وهو الذى يمشى بالجل الثقيل ويقارب الخطو والجمع داف مثل راكع وركع قال
  وعلى القياسر فى الجدوركواعب * رج الروادف فالقيامردلف
  وتداف اليسه أى تمشى ودنا وأبو دلف بنتح اللام والدلفين دابة فى البحر تنجى الغريق
  ⁦( دنف)⁩، الدنف بالتحريك المرض الملازم ورجسل دنف أيضا وامرأة دنف وقوم
  دنف يستوى فيسه المذكر والمؤنث والتئنية والجمع فان قلت رجل دنف بكسر النون
  قلت امر أة دنفة أنبت وثنيت وجمعت وقددنف المريض بالكسر أى ثقل وأدنف بالالف
  شله وأدنفه المرض يتعدى ولا يتعدى فهومدنف ومدنف ويقال أيضادنفت الشمس
  وأدنفت اذادنت للمغيب واصفرّت ومنه قول العجاج
  والشمس قد كادت ت-كون دنفا * أدفعها بالراح كى تزحلفا
  ⁦( دوف)⁩ دفت الدواء وغيره أى بللته بماء أو بغسيره فهو مدوف ومدووف وكذلك مسك
  مدوف أى مباول ويقال مسحوق وايس يأتى مفعول من ذوات الثلاثة من بنات الواو
  بالتمام الاحرفان مسك مدووف وثوب مصوون فانّ ه_ذين جاآنادرين والكلام مدوف
  مصون وذلك لثقل الضمة على الواو والماء أقوى ءلى احتمالهامنها فلهذاجاء ما كان
  سن بنات الماء بالتمام والنقصان نحوتوب مخيط ومخوط على مافسرناه فى ماب الطاء
  ودياف موضع بالجزيرة وهم نبيط الشأم وهومن الواد قال الشاعر ٢
  قوله وهم نبيط الشأم الخ عبارة
  ولكن دياقى أبوه وأقه * بحوارن يعصرن السليط أقار به
  القاموس دياف ككتاب
  قوله يعصرن انماهو على لغة من يقول أكاونى البراغيث وحل ديافىّ وهو الضخم الجليل
  قرية بالشأم أوبالجز يرة أهلها
  سل الذال رو) ذرف الدمع يذرف ذرفا وذرفانا أى سال يقال ذرفت
  نبط الشأم ينسب البها الابل
  والسيوف أوياؤها منقلبة عن
  مينه اذاسال منها الدمع والمذارف المدامع والذرقان المشى الضعيف وذرّف على
  واو اه كتبه المصحح
  المائة تدريفا أى زاد ( رعف اذرعفت الابل بالذال والدال جيعا أى مضت على
  ٢ بعض النسح زيادة الفرزدق
  صداح
  يجو عمروبن عفراء
