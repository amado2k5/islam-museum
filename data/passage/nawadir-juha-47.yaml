label: { ar: "نوادر جحا الكبرى، ص 28 — «العالم في حمار جحا»", en: "Nawadir Juha al-Kubra, p. 28 — 'The World in Juha's Donkey'", ur: "نوادر جحا الکبریٰ، ص 28 — «جحا کے گدھے میں دنیا»", fr: "Nawadir Juha al-Kubra, p. 28 — « Le monde dans l'âne de Juha »", es: "Nawadir Juha al-Kubra, p. 28 — «El mundo en el burro de Juha»", tr: "Juha'nın Büyük Fıkraları, s. 28 — “Juha'nın Eşeğindeki Dünya”", id: "Anekdot Hebat Juha, hlm. 28 — “Dunia di Dalam Keledai Juha”" }
text: "… العالم في حمار جحا كان ثلاثة من الرهبان يسيحون في أطراف البلاد ويتباحثون مع عُلماءِ كلِّ بلدةٍ يمرُّون بها. ولمَّا وصلُوا إلى بلاد الروم، أرادوا الاجتماع بمشاهير علمائهم، فأشار عضهم على السلطان، أَنْ يستدعِيَ جحا لمناقشتِهم، لأنه كان من أهل …"
summary:
  ar: "سأل ثلاثة رهبان جحا في وليمة السلطان، فقال إن مركز العالم حيث وضع حماره قدمه اليمنى الأمامية، وإن النجوم بعدد شعر الحمار، وإن شعر لحيتهم يقابل شعر الذيل، ويُحسم الأمر بالنتف. {cite:juha-nawadir-kubra-djuwaydi p. 28}"
  en: "Three monks question Juha at the sultan's banquet: the centre of the world is where his donkey put its right forefoot; the stars number as many as the donkey's hairs; and for beard hairs against tail hairs, the matter is settled by plucking. {cite:juha-nawadir-kubra-djuwaydi p. 28}"
  ur: "سلطان کی دعوت میں تین راہبوں نے جحا سے سوال کیے: دنیا کا مرکز وہاں ہے جہاں اس کے گدھے نے اپنا دایاں اگلا پاؤں رکھا؛ ستارے اتنے ہیں جتنے گدھے کے بال؛ اور داڑھی کے بالوں کا دم کے بالوں سے مقابلہ نوچ کر طے ہوتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 28}"
  fr: "Trois moines interrogent Juha au banquet du sultan : le centre du monde est là où son âne a posé son antérieur droit ; les étoiles sont aussi nombreuses que les poils de l'âne ; quant aux poils de barbe comparés à ceux de la queue, on tranche en les arrachant. {cite:juha-nawadir-kubra-djuwaydi p. 28}"
  es: "Tres monjes interrogan a Juha en el banquete del sultán: el centro del mundo está donde su burro puso la pata delantera derecha; las estrellas son tantas como los pelos del burro; y la cuestión de los pelos de barba frente a los de la cola se resuelve arrancándolos. {cite:juha-nawadir-kubra-djuwaydi p. 28}"
  tr: "Sultanın ziyafetinde üç keşiş Juha'ya bir soru sordu. Juha, dünyanın merkezinin eşeğinin sağ ön ayağını bastığı yer olduğunu, yıldız sayısının eşeğin tüy sayısına eşit olduğunu, sakallarındaki tüylerin kuyruklarındaki tüylere karşılık geldiğini ve meselenin yolma ile çözüleceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 28}"
  id: "Tiga biksu mengajukan pertanyaan kepada Juha di jamuan makan Sultan. Ia menjawab bahwa pusat dunia adalah tempat keledainya meletakkan kaki depan kanannya, bahwa jumlah bintang sama dengan jumlah bulu pada keledai, dan bahwa bulu di janggut mereka sesuai dengan bulu di ekor mereka, dan bahwa masalah tersebut akan diselesaikan dengan mencabut bulu. {cite:juha-nawadir-kubra-djuwaydi p. 28}"
