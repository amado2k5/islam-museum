label: { ar: "الموطأ 1708 — مالك: إذا أسلمت المرأة وزوجها كافر ثم أسلم، فهو أحق بها ما دامت في عدتها، فإن انقضت عدتها فلا سبيل له عليها، وإنما فسخها الإسلام بغير طلاق", en: "Muwatta 1708" }
summary:
  ar: "يقول مالك والأمر عندنا أن المرأة إذا أسلمت وزوجها كافر، ثم أسلم، فهو أحق بها ما دامت في عدتها، فإن انقضت عدتها، فلا سبيل له عليها. وإن تزوجها بعد انقضاء عدتها، لم يعد ذلك طلاقا، وإنما فسخها منه الإسلام بغير طلاق. {cite:muwatta-maruf-1997 p.97}"
