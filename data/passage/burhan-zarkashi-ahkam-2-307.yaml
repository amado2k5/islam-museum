text: "… من جبريل خمسًا خمسًا، وفى رواية: من تعلمه خمسًا خمسًا لم ينسه. قال أصحابنا رجمهم الله : تعليم القرآن فرض كفاية، وكذلك حفظه واجب على الأمة صرح به الجرجانى في الشافى، والعبادى وغيرهما. والمعنى فيه كما قاله الجوينى : ألا …"
summary:
