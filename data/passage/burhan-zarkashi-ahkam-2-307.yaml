text: "… من جبريل خمسًا خمسًا، وفى رواية: من تعلمه خمسًا خمسًا لم ينسه. قال أصحابنا رجمهم الله : تعليم القرآن فرض كفاية، وكذلك حفظه واجب على الأمة صرح به الجرجانى في الشافى، والعبادى وغيرهما. والمعنى فيه كما قاله الجوينى : ألا …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 307، يرد فيه ذكر الفرض، وفرض الكفاية، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 307, whose wording mentions the obligatory (fard), the communal obligation (fard kifaya), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 307 کا اقتباس جس میں فرض، فرضِ کفایہ، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volume numérisé 2, p. 307, dont le texte mentionne l'obligatoire (fard), l'obligation collective (fard kifaya), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen digitalizado 2, p. 307, cuyo texto menciona lo obligatorio (fard), la obligación colectiva (fard kifaya), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Zarkashi'nin \"El-Burhan fi Ulum al-Qur'an\" adlı eserinin 2. cildinin 307. sayfasından bir alıntı, farz olan amelleri, toplumsal yükümlülükleri ve görevleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 2, halaman 307, menyebutkan amalan wajib, kewajiban masyarakat, dan tugas-tugas. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, tugas-tugas, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
