label: { ar: "جامع الترمذي 1117 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1117 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1117 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 1117 — lo que se ha hecho lícito; lo que no es lícito" }
text: "… عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ قَالَ \" أَيُّمَا رَجُلٍ نَكَحَ امْرَأَةً فَدَخَلَ بِهَا فَلاَ يَحِلُّ لَهُ نِكَاحُ ابْنَتِهَا فَإِنْ لَمْ يَكُنْ دَخَلَ بِهَا فَلْيَنْكِحِ ابْنَتَهَا وَأَيُّمَا رَجُلٍ نَكَحَ امْرَأَةً فَدَخَلَ بِهَا أَوْ لَمْ يَدْخُلْ بِهَا فَلاَ يَحِلُّ لَهُ نِكَاحُ أُمِّهَا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ لاَ يَصِحُّ مِنْ قِبَلِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1117، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1117 (The Book on Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1117، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Jami' al-Tirmidhi, n.º 1117 (El Libro del Matrimonio), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
