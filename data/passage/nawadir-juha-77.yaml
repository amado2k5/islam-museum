label: { ar: "نوادر جحا الكبرى، ص 41 — «صعود البقر لم يخطر ببالي»", en: "Nawadir Juha al-Kubra, p. 41 — 'It Never Occurred to Me That Cows Climb'", ur: "نوادر جحا الکبریٰ، ص 41 — «مجھے یہ خیال نہ آیا کہ گائے چڑھ سکتی ہے»", fr: "Nawadir Juha al-Kubra, p. 41 — « Je n'avais jamais pensé que les vaches grimpent »", es: "Nawadir Juha al-Kubra, p. 41 — «Nunca pensé que las vacas subieran»", tr: "Juha'nın Büyük Fıkraları, s. 41 — “İneğin yukarı çıkması aklıma hiç gelmemişti.”", id: "Anekdot Hebat Juha, hlm. 41 — “Kisah pendakian sapi itu tidak pernah terlintas dalam pikiran saya.”" }
text: "… صعود البقر لم يخطرْ ببالي أراد جحا تخبِئَةَ نقودِ كانَتْ معَه فحفر حفرةً في دائرِةٍ، ودفنها، ورجعَ قليلاً فتأمَّلَ بها فلم يُعْجِبْهُ مكانُها، فأخرجَها ووضعَها في مكانٍ آخرَ، ثمَّ خطرَ لَهُ أَنَّ هذه المواضِعَ كُلَّهَا خطرةٌ وأطلَّ من نافذةِ بيتِهِ …"
summary:
  ar: "أخفى جحا نقودًا في تل بتثبيتها بوتد، فسحب لص الوتد وأعاده ملطخًا بروث البقر، فقال جحا إنه كان يخشى الرجال والآن يخشى البقر، ولم يخطر بباله أن البقرة تستطيع التسلق. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  en: "Juha hides coins on a hill by fixing them to a pole; a thief pulls the pole and returns it smeared with cow dung; Juha says he feared men and now fears cows, and that he never thought a cow could climb. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  ur: "جحا نے ایک ٹیلے پر سکے ایک کھونٹے سے باندھ کر چھپا دیے؛ ایک چور نے کھونٹا کھینچ لیا اور اسے گائے کے گوبر سے لت پت کر کے واپس رکھ دیا؛ جحا نے کہا کہ میں انسانوں سے ڈرتا تھا اور اب گایوں سے ڈرتا ہوں، اور مجھے کبھی خیال نہ آیا کہ گائے چڑھ سکتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  fr: "Juha cache des pièces sur une colline en les fixant à un piquet ; un voleur tire le piquet et le remet maculé de bouse de vache ; Juha dit qu'il craignait les hommes et craint maintenant les vaches, et qu'il n'avait jamais pensé qu'une vache pût grimper. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  es: "Juha esconde monedas en una colina sujetándolas a un palo; un ladrón tira del palo y lo devuelve embadurnado de excremento de vaca; Juha dice que temía a los hombres y ahora teme a las vacas, y que nunca pensó que una vaca pudiera trepar. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  tr: "Juha, parayı bir kazığa bağlayarak bir tepeye sakladı. Bir hırsız kazığı söktü ve inek gübresiyle kaplı olarak geri getirdi. Juha, eskiden insanlardan korktuğunu, şimdi ise ineklerden korktuğunu, bir ineğin tırmanabileceğini asla hayal etmediğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 41}"
  id: "Juha menyembunyikan uang di sebuah bukit dengan mengikatnya pada sebuah tiang. Seorang pencuri mencabut tiang itu dan mengembalikannya dalam keadaan tertutup kotoran sapi. Juha berkata bahwa dulu ia takut pada manusia dan sekarang ia takut pada sapi, tidak pernah membayangkan bahwa sapi bisa memanjat. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
