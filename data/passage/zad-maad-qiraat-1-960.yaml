text: "… فيه الظُّنُّ، وقد احتجَّ كُلُّ واحد من الأئمةِ الأربعة به في موضع، فاحتج به الشافعي وأحمد في هذا الموضع، واحتج به أبو حنيفة في وجوب التتابع في صيام الكفارة بقراءة ابن مسعود فصيامُ ثلاثة أيام متتابعات. واحتج به مالك والصحابة …"
