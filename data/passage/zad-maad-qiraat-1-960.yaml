text: "… فيه الظُّنُّ، وقد احتجَّ كُلُّ واحد من الأئمةِ الأربعة به في موضع، فاحتج به الشافعي وأحمد في هذا الموضع، واحتج به أبو حنيفة في وجوب التتابع في صيام الكفارة بقراءة ابن مسعود فصيامُ ثلاثة أيام متتابعات. واحتج به مالك والصحابة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 960، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 960, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 960 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen 1, pág. 960, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim (tome 1, p. 960) mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 1. cildinin 960. sayfasından, Kur'an'ın farklı okunuşlarını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 1, halaman 960, yang menyebutkan berbagai macam bacaan Al-Quran; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
