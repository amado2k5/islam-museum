label: { ar: "الموطأ 953 — عائشة كانت تترك التلبية إذا رجعت إلى الموقف", en: "Muwatta 953", es: "Muwatta 953", fr: "Muwatta 953", ur: "موطا 953", tr: "Al-Muwatta 953 — Aişe ayağa kalktığında Talbiye okumayı bırakırdı.", id: "Al-Muwatta 953 — Aisyah akan berhenti membaca Talbiyah ketika dia kembali ke tempat berdiri." }
text: "كانت تترك التلبية إذا رجعت إلى الموقف"
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة زوج النبي، أنها كانت تترك التلبية إذا رجعت إلى الموقف. ويذكر المحقق أن في نسخة «راحت» بدل «رجعت»، وأنه رواه عن مالك أبو مصعب (1091) وسويد والشيباني (390). {cite:muwatta-maruf-1997 p.455}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, onun babasından, onun da Peygamberin eşi Ayşe'den rivayet ettiğine göre, Ayşe Arafat'taki bekleme yerine döndüğünde Telbiye okumayı bırakırdı. Editör, bir rivayette \"döndü\" yerine \"gitti\" yazdığını ve bunun Malik'ten Ebu Mus'ab (1091), Süveyd ve el-Şeybani (390) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.455}"
  id: "Malik meriwayatkannya dari Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Aisyah, istri Nabi, bahwa ia akan berhenti membaca Talbiyah ketika kembali ke tempat berdiri (di Arafat). Editor mencatat bahwa dalam satu versi, tertulis \"ia pergi\" dan bukan \"ia kembali,\" dan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1091), Suwaid, dan al-Shaybani (390). {cite:muwatta-maruf-1997 p.455}"
