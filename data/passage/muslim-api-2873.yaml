label: { ar: "صحيح مسلم 2873 — ما أُحل، الحرام", en: "Sahih Muslim 2873 — what was made lawful; the unlawful", ur: "صحیح مسلم 2873 — جو حلال کیا گیا، حرام" }
text: "وَحَدَّثَنَا هَارُونُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا مُحَمَّدُ بْنُ بَكْرٍ، حَدَّثَنَا ابْنُ جُرَيْجٍ، قَالَ قُلْتُ لِنَافِعٍ مَاذَا سَمِعْتَ ابْنَ عُمَرَ، يُحِلُّ لِلْحَرَامِ قَتْلَهُ مِنَ الدَّوَابِّ فَقَالَ لِي نَافِعٌ قَالَ عَبْدُ اللَّهِ سَمِعْتُ النَّبِيَّ يَقُولُ \" خَمْسٌ مِنَ الدَّوَابِّ لاَ جُنَاحَ عَلَى مَنْ قَتَلَهُنَّ فِي قَتْلِهِنَّ الْغُرَابُ وَالْحِدَأَةُ وَالْعَقْرَبُ وَالْفَارَةُ وَالْكَلْبُ الْعَقُورُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2873، يذكر ما أُحل، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 2873 (The Book of Pilgrimage), that mentions what was made lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 2873، جس میں جو حلال کیا گیا، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
