summary:
  ar: "قال مالك: أحسن ما سُمع في السائبة أنه لا يوالي أحدا، وأن ميراثه للمسلمين وعقله عليهم. {cite:muwatta-maruf-1997 p.340} {cite:muwatta-maruf-1997 p.341}"
  tr: "Malik şöyle dedi: Azat edilmiş bir köle hakkında en iyi görüş, kimseye biat etmemesi, mirasının Müslümanlara ait olması ve kan parasının da onların sorumluluğunda olmasıdır. {cite:muwatta-maruf-1997 s.340} {cite:muwatta-maruf-1997 s.341}"
  id: "Malik berkata: Pendapat terbaik mengenai seorang budak yang telah dibebaskan adalah bahwa ia tidak berjanji setia kepada siapa pun, dan bahwa warisannya menjadi milik kaum Muslimin dan uang darahnya menjadi tanggung jawab mereka. {cite:muwatta-maruf-1997 p.340} {cite:muwatta-maruf-1997 p.341}"
