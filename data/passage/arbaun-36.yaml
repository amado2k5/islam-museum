label: { ar: "الأربعون 36 — من نفس عن مؤمن كربة", en: "Arba'un 36 — whoever relieves a believer's distress" }
summary:
  ar: "حديث أبي هريرة عن رسول الله قال: «من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من كرب يوم القيامة، ومن يسر على معسر يسر الله عليه في الدنيا والآخرة، ومن ستر مسلماً ستره الله في الدنيا والآخرة، والله في عون العبد ما كان العبد في عون أخيه، ومن سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة، وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة وغشيتهم الرحمة وحفتهم الملائكة وذكرهم الله فيمن عنده، ومن بطأ به عمله لم يسرع به نسبه» — وهو الحديث السادس والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (2699) بهذا اللفظ من رواية الأعمش عن أبي صالح عن أبي هريرة، واعترض عليه غير واحد من الحفاظ — منهم أبو الفضل الهروي والدارقطني — فإن أسباط بن محمد رواه عن الأعمش فقال حدثت عن أبي صالح فتبين أن الأعمش لم يسمعه من أبي صالح ولم يذكر من حدثه به عنه، ورجح الترمذي هذه الرواية وقال حديث أسباط أصح، وزاد بعض أصحاب الأعمش في المتن «ومن أقال مسلماً أقال الله عثرته يوم القيامة»، وخرجا في الصحيحين بعض مقاطعه (جامع العلوم والحكم ص 731–753)."
  en: "The hadith of Abu Hurayra that the Messenger of God said 'whoever relieves a believer of one of the world's distresses, God will relieve him of one of the distresses of the Day of Resurrection; whoever eases things for one in straitened circumstances, God will ease things for him in this world and the next; whoever conceals a Muslim, God will conceal him in this world and the next; and God is at the servant's aid so long as the servant is at his brother's aid; whoever treads a path seeking knowledge, God will ease for him by it a path to Paradise; and no people gather in one of God's houses reciting the Book of God and studying it among themselves without serenity descending on them, mercy enveloping them, the angels surrounding them, and God mentioning them among those with Him; and whoever is slowed by his deeds, his lineage will not speed him along' — the thirty-sixth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Muslim (2699) in this wording through al-A'mash from Abu Salih from Abu Hurayra; more than one memoriser — Abu al-Fadl al-Harwi and al-Daraqutni among them — objected to the chain, for Asbat ibn Muhammad narrated it from al-A'mash with 'I was told it from Abu Salih', showing al-A'mash had not heard it from Abu Salih and never named his informant, and al-Tirmidhi preferred Asbat's version, saying 'Asbat's hadith is sounder'; some of al-A'mash's students added to the text 'and whoever lets a Muslim off, God will let off his stumble on the Day of Resurrection'; and segments of it occur in the two Sahihs (Jami' al-Ulum wal-Hikam pp. 731–753)."
