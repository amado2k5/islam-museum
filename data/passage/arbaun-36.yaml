id: passage/arbaun-36
class: passage
unit: hadith
work: work/arbaun-nawawi
ref: '36'
label:
  ar: الأربعون 36 — من نفس عن مؤمن كربة
  en: Arba'un 36 — whoever relieves a believer's distress
  es: "Arba'un 36 — quien alivie la angustia de un creyente"
  fr: "Arba'un 36 — quiconque soulage la détresse d'un croyant"
  ur: "اربعون 36 - جو کسی مومن کی تکلیف کو دور کرتا ہے۔"
  tr: "Kırkıncı 36 — Kim bir mümini sıkıntıdan kurtarırsa"
  id: "Yang keempat puluh 36 — Siapa pun yang meringankan kesusahan seorang mukmin"
summary:
  ar: 'حديث أبي هريرة عن رسول الله قال: «من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من كرب يوم القيامة، ومن يسر على معسر يسر الله عليه في الدنيا والآخرة، ومن ستر مسلماً ستره الله في الدنيا والآخرة، والله في عون العبد ما كان العبد في عون أخيه، ومن سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة، وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة وغشيتهم الرحمة وحفتهم الملائكة وذكرهم الله فيمن عنده، ومن بطأ به عمله لم يسرع به نسبه» — وهو الحديث السادس والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (2699) بهذا اللفظ من رواية الأعمش عن أبي صالح عن أبي هريرة، واعترض عليه غير واحد من الحفاظ — منهم أبو الفضل الهروي والدارقطني — فإن أسباط بن محمد رواه عن الأعمش فقال حدثت عن أبي صالح فتبين أن الأعمش لم يسمعه من أبي صالح ولم يذكر من حدثه به عنه، ورجح الترمذي هذه الرواية وقال حديث أسباط أصح، وزاد بعض أصحاب الأعمش في المتن «ومن أقال مسلماً أقال الله عثرته يوم القيامة»، وخرجا في الصحيحين بعض مقاطعه ⁦(جامع العلوم والحكم ص 731–753)⁩.'
  en: The hadith of Abu Hurayra that the Messenger of God said 'whoever relieves a believer of one of the world's distresses, God will relieve him of one of the distresses of the Day of Resurrection; whoever eases things for one in straitened circumstances, God will ease things for him in this world and the next; whoever conceals a Muslim, God will conceal him in this world and the next; and God is at the servant's aid so long as the servant is at his brother's aid; whoever treads a path seeking knowledge, God will ease for him by it a path to Paradise; and no people gather in one of God's houses reciting the Book of God and studying it among themselves without serenity descending on them, mercy enveloping them, the angels surrounding them, and God mentioning them among those with Him; and whoever is slowed by his deeds, his lineage will not speed him along' — the thirty-sixth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Muslim (2699) in this wording through al-A'mash
    from Abu Salih from Abu Hurayra; more than one memoriser — Abu al-Fadl al-Harwi and al-Daraqutni among them — objected to the chain, for Asbat ibn Muhammad narrated it from al-A'mash with 'I was told it from Abu Salih', showing al-A'mash had not heard it from Abu Salih and never named his informant, and al-Tirmidhi preferred Asbat's version, saying 'Asbat's hadith is sounder'; some of al-A'mash's students added to the text 'and whoever lets a Muslim off, God will let off his stumble on the Day of Resurrection'; and segments of it occur in the two Sahihs (Jami' al-Ulum wal-Hikam pp. 731–753).
  es: "El hadiz de Abu Hurayra dice que el Mensajero de Dios dijo: \"Quien alivie a un creyente de una de las aflicciones del mundo, Dios lo aliviará de una de las aflicciones del Día de la Resurrección; quien facilite las cosas a alguien en circunstancias difíciles, Dios le facilitará las cosas en este mundo y en el próximo; quien oculte a un musulmán, Dios lo ocultará en este mundo y en el próximo; y Dios está en ayuda del siervo mientras el siervo esté en ayuda de su hermano; quien recorra un camino buscando conocimiento, Dios le facilitará por él un camino al Paraíso; y ningún pueblo se reúne en una de las casas de Dios recitando el Libro de Dios y estudiándolo entre sí sin que la serenidad descienda sobre ellos, la misericordia los envuelva, los ángeles los rodeen y Dios los mencione entre aquellos que están con Él; y quien sea retrasado por sus obras, su linaje no lo acelerará' — el trigésimo sexto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, transmitido por Muslim (2699) en esta redacción a través de al-A'mash de Abu Salih de Abu Hurayra; más de un memorizador — Abu al-Fadl al-Harwi y al-Daraqutni entre ellos — objetaron la cadena, pues Asbat ibn Muhammad lo narró de al-A'mash con 'Me lo dijeron de Abu Salih', lo que demuestra que al-A'mash no lo había oído de Abu Salih y nunca nombró a su informante, y al-Tirmidhi prefirió la versión de Asbat, diciendo 'El hadiz de Asbat es más sólido'; algunos de los estudiantes de al-A'mash añadieron al texto 'y quien deje escapar a un musulmán, Dios le perdonará su tropiezo el Día de la Resurrección'; y fragmentos del mismo aparecen en los dos Sahihs (Jami' al-Ulum wal-Hikam, págs. 731–753)."
  fr: "Le hadith d'Abou Hourayra rapporte que le Messager de Dieu a dit: « Quiconque soulage un croyant d'une détresse de ce monde, Dieu le soulagera d'une détresse du Jour de la Résurrection; quiconque facilite les choses pour une personne dans le besoin, Dieu facilitera les choses pour elle dans ce monde et dans l'autre; quiconque cache un musulman, Dieu le cachera dans ce monde et dans l'autre; et Dieu est au secours du serviteur tant que celui-ci est au secours de son frère; quiconque emprunte un chemin en quête de connaissance, Dieu lui facilitera par là le chemin du Paradis; et aucun peuple ne se réunit dans une Maison de Dieu pour réciter le Livre de Dieu et l'étudier sans que la sérénité ne descende sur eux, la miséricorde les enveloppe, les anges les entourent et Dieu ne les mentionne parmi ceux qui sont auprès de Lui; « Et quiconque est ralenti par ses actes, sa lignée ne le précédera pas » — le trente-sixième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, transmis par Muslim (2699) dans cette formulation par al-A'mash d'après Abu Salih d'après Abu Hurayra; plus d'un mémorisateur — Abu al-Fadl al-Harwi et al-Daraqutni parmi eux — ont contesté la chaîne, car Asbat ibn Muhammad l'a rapporté d'al-A'mash avec « Je l'ai appris d'Abu Salih », montrant qu'al-A'mash ne l'avait pas entendu d'Abu Salih et n'a jamais nommé son informateur, et al-Tirmidhi a préféré la version d'Asbat, disant « Le hadith d'Asbat est plus authentique »; certains des élèves d'al-A'mash ont ajouté au texte: « et quiconque pardonne à un musulman, Dieu lui pardonnera sa chute le Jour de la Résurrection »; et des segments de celui-ci apparaissent dans les deux Sahihs (Jami' al-Ulum wal-Hikam pp. 731–753)."
  ur: "ابوہریرہ سے روایت ہے کہ رسول اللہ نے فرمایا: ”جو شخص کسی مومن کی دنیا کی مصیبتوں میں سے کسی مصیبت کو دور کرے گا، اللہ تعالیٰ اس کی قیامت کے دن کی مصیبتوں میں سے ایک مصیبت کو دور کرے گا۔ جو شخص تنگدستی میں کسی کے لیے آسانیاں پیدا کرتا ہے، اللہ اس کے لیے دنیا اور آخرت میں آسانیاں پیدا کرے گا۔ جو شخص کسی مسلمان کی پردہ پوشی کرے گا، اللہ اسے دنیا اور آخرت میں چھپائے گا۔ اور جب تک بندہ اپنے بھائی کی مدد کرتا ہے خدا اس کی مدد کرتا ہے۔ جو شخص حصول علم کے راستے پر گامزن ہو گا، اللہ اس کے لیے جنت کا راستہ آسان کر دے گا۔ اور کوئی بھی لوگ خدا کے گھروں میں سے کسی ایک گھر میں جمع نہیں ہوتے جو خدا کی کتاب کی تلاوت کرتے اور آپس میں اس کا مطالعہ کرتے ہیں بغیر ان پر سکون نازل ہوتا ہے، ان پر رحمت نازل ہوتی ہے، فرشتے ان کو گھیرے ہوئے ہوتے ہیں اور خدا ان کا ذکر اپنے ساتھیوں میں کرتا ہے۔ اور جو شخص اپنے عمل میں سستی کرے گا، اس کا نسب اس کو آگے نہیں بڑھائے گا'' - النووی کی چھتیسویں اور ابن رجب کی تفسیر کی، مسلم (2699) نے اس قول کو العماش کے ذریعے ابو صالح سے ابوہریرہ سے نقل کیا ہے۔ ایک سے زیادہ حافظوں - ابو الفضل الحروی اور ان میں سے الدارقطنی نے اس سلسلہ پر اعتراض کیا، کیونکہ اصبط بن محمد نے اسے العمش سے روایت کیا ہے، 'مجھے ابو صالح سے کہا گیا ہے'، یہ ظاہر کرتا ہے کہ العمش نے اسے ابو صالح سے نہیں سنا تھا اور کبھی اپنے مخبر کا نام نہیں لیا تھا، اور الطیر الطیر نے کہا تھا کہ 'اسباط کی حدیث صحیح ہے'؛ العمش کے بعض طلباء نے اس عبارت میں اضافہ کیا ہے 'اور جو شخص کسی مسلمان کو چھوڑے گا، اللہ قیامت کے دن اس کی ٹھوکر سے گریز کرے گا'۔ اور اس کے کچھ حصے دو صحیحوں میں موجود ہیں ⁦(جامع العلوم والحکم صفحہ 731-753)⁩۔"
  tr: "Ebu Hurayra, Allah Resulü'nden rivayet ettiğine göre şöyle buyurmuştur: “Kim bir mümini bu dünyadaki sıkıntılardan birinden kurtarırsa, Allah da onu kıyamet günündeki sıkıntılardan kurtarır. Kim zor durumda olan birine kolaylık sağlarsa, Allah da ona bu dünyada ve ahirette kolaylık sağlar. Kim bir Müslümanın kusurunu örterse, Allah da onun kusurunu bu dünyada ve ahirette örter. Kul, kardeşine yardım ettiği sürece Allah da kuluna yardım eder. Kim ilim yoluna girerse, Allah ona cennete giden yolu kolaylaştırır. Allah'ın evlerinden birinde toplanıp Allah'ın Kitabını okuyan ve kendi aralarında inceleyen hiçbir topluluk yoktur ki, onlara huzur inmesin, rahmet onları kuşatmasın, melekler onları çevrelemesin ve Allah onları kendi katındakilere anlatmasın. Kim amelleriyle yavaşlarsa, soyu da onu hızlandırmaz.” — Bu, İbn Receb'in tefsirinde ve El-Arba'in el-Neveviyye'de otuz altıncı hadistir. Müslim (2699) bunu, Ebu Salih'ten, o da Ebu Hurayra'dan rivayet edildiğine göre, A'meş'in rivayetinden bu şekilde aktarmıştır. Ebu el-Fadl el-Haravi ve Darakutni de dahil olmak üzere birçok rivayetçi buna itiraz etmiştir; çünkü Asbat bin Muhammed bunu A'meş'ten rivayet etmiş ve \"Bana Ebu Salih'ten rivayet edildi\" demiştir. A'meş'in bunu Ebu Salih'ten duymadığı ve kendisine kimin rivayet ettiğini belirtmediği anlaşılmıştır. Tirmizi bu rivayeti tercih etmiş ve Asbat'ın hadisinin daha sahih olduğunu söylemiştir. A'meş'in bazı sahabeleri metne şunu eklemişlerdir: \"Kim bir Müslümanı affederse, Allah kıyamet gününde onun hatasını affeder.\" Bu metnin bazı kısımlarını iki Sahih'e de dahil ettiler (Cami'ül-Ulum ve el-Hikam, s. 731-753)."
  id: "Abu Hurairah meriwayatkan dari Rasulullah SAW, yang bersabda: “Barangsiapa meringankan kesulitan seorang mukmin dari kesulitan dunia, maka Allah akan meringankannya dari kesulitan di hari kiamat. Barangsiapa memudahkan urusan orang yang sedang kesulitan, maka Allah akan memudahkan urusannya di dunia dan akhirat. Barangsiapa menutupi kesalahan seorang Muslim, maka Allah akan menutupi kesalahannya di dunia dan akhirat. Allah senantiasa menolong hamba-Nya selama hamba itu menolong saudaranya. Barangsiapa menempuh jalan untuk mencari ilmu, maka Allah akan memudahkan jalannya menuju surga. Tidaklah suatu kaum berkumpul di salah satu rumah Allah, membaca Kitab Allah dan mempelajarinya di antara mereka, melainkan ketenangan akan turun kepada mereka, rahmat akan meliputi mereka, malaikat akan mengelilingi mereka, dan Allah akan menyebutkan mereka kepada orang-orang yang bersama-Nya. Barangsiapa diperlambat oleh amal perbuatannya, maka keturunannya tidak akan mempercepatnya.” — Ini adalah hadits ke-36 dalam Al-Arba’in Al-Nawawiyyah dan dalam tafsir Ibnu Rajab. Hadits ini diriwayatkan oleh Muslim (2699) dengan redaksi ini dari riwayat Al-A’mash atas otoritas Abu Salih atas otoritas Abu Hurayrah. Lebih dari satu penghafal menolaknya - termasuk Abu Al-Fadl Al-Harawi dan Al-Daraqutni - karena Asbat bin Muhammad meriwayatkannya atas otoritas Al-A’mash, sehingga ia berkata, “Aku diberitahu atas otoritas Abu Salih.” Jelas bahwa Al-A’mash tidak mendengarnya dari Abu Salih dan tidak menyebutkan siapa yang memberitahukannya atas otoritasnya. Al-Tirmidhi lebih menyukai riwayat ini dan mengatakan bahwa hadits Asbat lebih sahih. Beberapa sahabat Al-A’mash menambahkan pada teks tersebut, “Dan barangsiapa memaafkan seorang Muslim, Allah akan mengampuni kesalahannya pada Hari Kiamat.” Mereka memasukkan beberapa bagiannya ke dalam dua kitab Sahih (Jami’ Al-‘Ulum wa Al-Hikam, hlm. 731–753)."
