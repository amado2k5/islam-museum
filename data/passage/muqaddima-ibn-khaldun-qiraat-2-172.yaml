text: "مقدمة ابن خلدون وجرى الأمر على ذلك زمن الصحابة والتابعين وكانوا يسموق المختصين بحمل ذلك. ونقله القراء أي الذين يقرءون الكتاب وليسوا أميين، لأن الأمية يومئذ صفة عامة في الصحابة بما كانوا عربًا، فقيل لحملة القرآن يومئذ قراء، إشارة إلى …"
