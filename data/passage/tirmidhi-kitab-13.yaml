summary:
  ar: "القسم 13 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطلاق واللعان عن رسول الله»، ويضم فيها النصوص من 1175 إلى 1204 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 13 of Jami' al-Tirmidhi (The Book on Divorce and Li'an) in the division of the open hadith dataset the museum took its reports from: reports 1175 to 1204 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 13، عنوان «کتاب الطلاق واللعان عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1175 تا 1204۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 13 de Jami' al-Tirmidhi (El libro sobre el divorcio y el li'an) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1175 al 1204 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du recueil ouvert Jami' al-Tirmidhi (Livre du divorce et du Li'an), dans sa partie 1175 à 1204. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées les classent et les numérotent différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanında yer alan Cami' el-Tirmizi'nin 13. bölümü, \"Allah Resulü'nün rivayetine göre Boşanma ve Li'an Kitabı\" başlığını taşımakta olup, 1175 ile 1204 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 13 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Perceraian dan Li'an berdasarkan riwayat Rasulullah,\" dan berisi teks 1175 hingga 1204, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
