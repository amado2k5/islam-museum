label: { ar: "الأربعون 6 — الحلال بين والحرام بين", en: "Arba'un 6 — the lawful is clear and the unlawful is clear" }
summary:
  ar: "حديث النعمان بن بشير، وهو الحديث السادس في الأربعين النووية وفي شرح ابن رجب، وفيه أن الحلال بين والحرام بين وبينهما أمور مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات استبرأ لدينه وعرضه، ومن وقع في الشبهات وقع في الحرام كالراعي يرعى حول الحمى يوشك أن يرتع فيه، وختم بأن في الجسد مضغة إذا صلحت صلح الجسد كله وإذا فسدت فسد الجسد كله ألا وهي القلب؛ رواه البخاري (52، 2051) ومسلم (1599) من طريق الشعبي عن النعمان بن بشير، وهو أصح أحاديث الباب عند ابن رجب، وأخرجه أيضاً أحمد وأبو داود (3329–3330) وابن ماجه (3984) والترمذي (1205) والنسائي وغيرهم؛ شرحه ابن رجب في أقسام الحلال والحرام والمشتبه والورع (جامع العلوم والحكم ص 172–192)."
  en: "Al-Nu'man ibn Bashir's hadith, the sixth of al-Nawawi's Forty and of Ibn Rajab's commentary: the lawful is clear and the unlawful is clear, and between them are doubtful matters unknown to many people; whoever avoids the doubtful clears his religion and honour, and whoever falls into the doubtful falls into the unlawful like a shepherd grazing around a sanctuary who is about to pasture in it; it ends with the morsel of flesh in the body which, if sound, the whole body is sound — the heart. Transmitted by al-Bukhari (52, 2051) and Muslim (1599) through al-Sha'bi from al-Nu'man ibn Bashir — the soundest hadith of the chapter according to Ibn Rajab — and also by Ahmad, Abu Dawud (3329–3330), Ibn Majah (3984), al-Tirmidhi (1205), al-Nasa'i and others; Ibn Rajab comments on the categories of the lawful, the unlawful and the doubtful, and on scrupulousness (Jami' al-Ulum wal-Hikam pp. 172–192)."
