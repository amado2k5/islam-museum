label: { ar: "الأربعون 6 — الحلال بين والحرام بين", en: "Arba'un 6 — the lawful is clear and the unlawful is clear", es: "Arba'un 6 — lo lícito es claro y lo ilícito es claro", fr: "Arba'un 6 — le licite est clair et l'illicite est clair", ur: "اربعون 6 - حلال واضح ہے اور حرام واضح ہے۔", tr: "Kırk altıncı - İzin verilen açık, yasaklanan da açık.", id: "Yang keempat puluh enam — Yang diperbolehkan sudah jelas dan yang dilarang sudah jelas." }
summary:
  ar: "حديث النعمان بن بشير، وهو الحديث السادس في الأربعين النووية وفي شرح ابن رجب، وفيه أن الحلال بين والحرام بين وبينهما أمور مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات استبرأ لدينه وعرضه، ومن وقع في الشبهات وقع في الحرام كالراعي يرعى حول الحمى يوشك أن يرتع فيه، وختم بأن في الجسد مضغة إذا صلحت صلح الجسد كله وإذا فسدت فسد الجسد كله ألا وهي القلب؛ رواه البخاري ⁦(52، 2051)⁩ ومسلم (1599) من طريق الشعبي عن النعمان بن بشير، وهو أصح أحاديث الباب عند ابن رجب، وأخرجه أيضاً أحمد وأبو داود (3329–3330) وابن ماجه (3984) والترمذي (1205) والنسائي وغيرهم؛ شرحه ابن رجب في أقسام الحلال والحرام والمشتبه والورع ⁦(جامع العلوم والحكم ص 172–192)⁩."
  en: "Al-Nu'man ibn Bashir's hadith, the sixth of al-Nawawi's Forty and of Ibn Rajab's commentary: the lawful is clear and the unlawful is clear, and between them are doubtful matters unknown to many people; whoever avoids the doubtful clears his religion and honour, and whoever falls into the doubtful falls into the unlawful like a shepherd grazing around a sanctuary who is about to pasture in it; it ends with the morsel of flesh in the body which, if sound, the whole body is sound — the heart. Transmitted by al-Bukhari (52, 2051) and Muslim (1599) through al-Sha'bi from al-Nu'man ibn Bashir — the soundest hadith of the chapter according to Ibn Rajab — and also by Ahmad, Abu Dawud (3329–3330), Ibn Majah (3984), al-Tirmidhi (1205), al-Nasa'i and others; Ibn Rajab comments on the categories of the lawful, the unlawful and the doubtful, and on scrupulousness (Jami' al-Ulum wal-Hikam pp. 172–192)."
  es: "Hadiz de Al-Nu'man ibn Bashir, sexto de los Cuarenta de Al-Nawawi y del comentario de Ibn Rajab: lo lícito es claro y lo ilícito es claro, y entre ellos hay asuntos dudosos desconocidos para muchas personas; quien evita lo dudoso limpia su religión y su honor, y quien cae en lo dudoso cae en lo ilícito como un pastor que apacienta alrededor de un santuario y está a punto de apacentar en él; termina con el trozo de carne en el cuerpo que, si está sano, todo el cuerpo está sano: el corazón. Transmitido por al-Bujari (52, 2051) y Muslim (1599) a través de al-Sha'bi de al-Nu'man ibn Bashir —el hadiz más sólido del capítulo según Ibn Rajab— y también por Ahmad, Abu Dawud (3329–3330), Ibn Majah (3984), al-Tirmidhi (1205), al-Nasa'i y otros; Ibn Rajab comenta sobre las categorías de lo lícito, lo ilícito y lo dudoso, y sobre la escrupulosidad (Jami' al-Ulum wal-Hikam pp. 172–192)."
  fr: "Le hadith d'Al-Nu'man ibn Bashir, le sixième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab: le licite et l'illicite sont clairement identifiés, et entre les deux se trouvent des matières douteuses, inconnues de beaucoup; celui qui évite le doute préserve sa religion et son honneur, et celui qui tombe dans le doute tombe dans l'illicite, tel un berger qui fait paître son troupeau autour d'un sanctuaire avant d'y entrer; cela s'achève avec le morceau de chair du corps dont la santé assure la santé du corps tout entier: le cœur. Transmis par al-Bukhari (52, 2051) et Muslim (1599) par l'intermédiaire d'al-Sha'bi d'al-Nu'man ibn Bashir — le hadith le plus authentique du chapitre selon Ibn Rajab — et également par Ahmad, Abu Dawud (3329–3330), Ibn Majah (3984), al-Tirmidhi (1205), al-Nasa'i et d'autres; Ibn Rajab commente les catégories du licite, de l'illicite et du douteux, ainsi que la scrupulosité (Jami' al-Ulum wal-Hikam pp. 172–192)."
  ur: "النعمان بن بشیر کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی: حلال واضح ہے اور حرام واضح ہے، اور ان کے درمیان مشتبہ امور ہیں جو بہت سے لوگوں کو معلوم نہیں ہیں۔ جو شخص مشتبہ سے بچتا ہے اس نے اپنے دین اور عزت کو صاف کیا اور جو شک میں پڑ جاتا ہے وہ حرام میں پڑ جاتا ہے جیسے چرواہا کسی حرم کے گرد چراتا ہے جو اس میں چرنے والا ہے۔ اس کا اختتام جسم میں گوشت کے لوتھڑے کے ساتھ ہوتا ہے جو کہ اگر صحیح ہے تو پورا جسم ٹھیک ہے یعنی دل۔ البخاری ⁦(52، 2051)⁩ اور مسلم (1599) نے الشعبی کے ذریعے النعمان بن بشیر سے نقل کیا ہے - ابن رجب کے مطابق باب کی سب سے صحیح حدیث - اور یہ بھی احمد، ابو داؤد (3329-3330)، ابن ماجہ (3984)، الصمد (3984)، النساء (3984) دیگر؛ ابن رجب نے حلال، حرام اور مشتبہ کے زمرے اور بے حیائی پر تبصرہ کیا ہے ⁦(جامع العلوم والحکم صفحہ 172-192)⁩۔"
  tr: "İbn Receb'in açıklamasında ve El-Arba'in El-Neveviyye'deki altıncı hadis olan Nu'man ibn Beşir hadisi, helal olanın açık, haram olanın da açık olduğunu, bunların arasında ise pek çok insanın bilmediği şüpheli durumlar olduğunu belirtir. Kim şüpheli durumlardan sakınırsa dinini ve şerefini korur, kim de şüpheli durumlara düşerse haram olana düşer; tıpkı korunaklı bir alanda otlayan ve oraya girme ihtimali olan bir çoban gibi. Hadis, vücutta öyle bir et parçası vardır ki, o parça sağlam olursa bütün vücut sağlam olur, o parça bozulursa bütün vücut bozulur; o da kalptir diyerek son bulur. Bu hadis, Buhari (52, 2051) ve Müslim (1599) tarafından Şabi'den, o da Nu'man ibn Beşir'den rivayet edilmiş olup, İbn Receb'e göre bu bölümün en sahih hadisidir. Bu hadis ayrıca Ahmed, Ebu Davud (3329–3330), İbn Majah (3984), Tirmizi (1205), Nesai ve diğerleri tarafından da rivayet edilmiştir. İbn Receb bunu helal, haram, şüpheli ve takva bölümlerinde açıklamıştır (Cami'ül-Ulum ve'Hikam, s. 172–192)."
  id: "Hadits Nu’man ibn Bashir, yang merupakan hadits keenam dalam Al-Arba’in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab, menyatakan bahwa yang diperbolehkan itu jelas dan yang diharamkan itu jelas, dan di antara keduanya terdapat perkara-perkara yang meragukan yang banyak orang tidak mengetahuinya. Maka barangsiapa menghindari perkara-perkara yang meragukan, ia melindungi agamanya dan kehormatannya, dan barangsiapa terjerumus ke dalam perkara-perkara yang meragukan, ia terjerumus ke dalam perkara-perkara yang diharamkan, seperti seorang gembala yang merumput di sekitar area yang dilindungi dan kemungkinan besar akan masuk ke dalamnya. Hadits ini diakhiri dengan mengatakan bahwa di dalam tubuh terdapat sepotong daging yang, jika sehat, seluruh tubuh sehat, dan jika rusak, seluruh tubuh rusak, dan itulah hati. Hadits ini diriwayatkan oleh Al-Bukhari (52, 2051) dan Muslim (1599) dari Ash-Sha’bi dari Nu’man ibn Bashir, dan menurut Ibn Rajab, hadits ini adalah hadits paling sahih dalam surah tersebut. Hadits ini juga diriwayatkan oleh Ahmad, Abu Dawud (3329–3330), Ibn Majah (3984), At-Tirmidhi (1205), An-Nasa’i dan lainnya. Ibn Rajab menjelaskannya dalam bagian tentang yang diperbolehkan, yang dilarang, yang diragukan, dan ketakwaan (Jami’ Al-‘Ulum wal-Hikam, hlm. 172–192)."
