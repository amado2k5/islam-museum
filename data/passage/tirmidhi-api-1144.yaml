label: { ar: "جامع الترمذي 1144 — الأب والأبوة", en: "Jami' al-Tirmidhi 1144 — the father and fatherhood", ur: "جامع ترمذی 1144 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1144 — El padre y la paternidad" }
text: "… حَدِيثٌ صَحِيحٌ. سَمِعْتُ عَبْدَ بْنَ حُمَيْدٍ، يَقُولُ سَمِعْتُ يَزِيدَ بْنَ هَارُونَ، يَذْكُرُ عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، هَذَا الْحَدِيثَ وَحَدِيثَ الْحَجَّاجِ عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ رَدَّ ابْنَتَهُ زَيْنَبَ عَلَى أَبِي الْعَاصِي بِمَهْرٍ جَدِيدٍ وَنِكَاحٍ جَدِيدٍ. قَالَ يَزِيدُ بْنُ هَارُونَ حَدِيثُ ابْنِ عَبَّاسٍ أَجْوَدُ إِسْنَادًا. وَالْعَمَلُ عَلَى حَدِيثِ عَمْرِو بْنِ شُعَيْبٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1144، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1144 (The Book on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1144، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1144 (El Libro del Matrimonio), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
