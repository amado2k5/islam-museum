text: "… بْنُ أَبِي عَائِشَةَ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَتْ عَائِشَةُ لَدَدْنَا رَسُولَ اللَّهِ فِي مَرَضِهِ، وَجَعَلَ يُشِيرُ إِلَيْنَا \" لاَ تَلُدُّونِي \". قَالَ فَقُلْنَا كَرَاهِيَةُ الْمَرِيضِ بِالدَّوَاءِ، فَلَمَّا أَفَاقَ قَالَ \" أَلَمْ أَنْهَكُمْ أَنْ تَلُدُّونِي \". قَالَ قُلْنَا كَرَاهِيَةٌ لِلدَّوَاءِ. فَقَالَ رَسُولُ اللَّهِ \" لاَ يَبْقَى مِنْكُمْ أَحَدٌ إِلاَّ لُدَّ ـ وَأَنَا أَنْظُرُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6897، يذكر اللدود والسعوط، والمرض والمريض، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6897 (Blood Money (Ad-Diyat)), that mentions medicine given by the mouth-side or the nose, illness and the sick, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6897، جس میں لدود اور سعوط، بیماری اور بیمار، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
