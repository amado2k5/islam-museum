text: "… وتحج البيت، قال فاذا فعلت ذلك فقد أسلمت قال نعم ! قال فما الايمان ? قال أن تؤمن بالله وملائكته وكتبه ورسله والبعث إمد الموت والجنة والنار وبالقدر كله خيره وشره، قال فاذا فملت ذلك فقد آمنت ؟ قال نمم …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 5، ص 208، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بالقدر، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 5, p. 208, that mentions belief in God, His angels, His books and His messengers, belief in the decree, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 5، ص 208 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، تقدیر پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
