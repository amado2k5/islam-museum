text: "… وتحج البيت، قال فاذا فعلت ذلك فقد أسلمت قال نعم ! قال فما الايمان ? قال أن تؤمن بالله وملائكته وكتبه ورسله والبعث إمد الموت والجنة والنار وبالقدر كله خيره وشره، قال فاذا فملت ذلك فقد آمنت ؟ قال نمم …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 5، ص 208، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بالقدر، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 5, p. 208, that mentions belief in God, His angels, His books and His messengers, belief in the decree, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 5، ص 208 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، تقدیر پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 5, pág. 208, que menciona la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, la creencia en el decreto, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Hilyat al-Awliya' d'Abu Nu'aym (tome 5, p. 208) évoquant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, la croyance au décret divin, la question de la foi et sa réponse. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 5. resimli cildinin 208. sayfasından bir alıntı, Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inancı, kader inancını ve imanla ilgili soruları ve cevaplarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid 5 bergambar, halaman 208, membahas tentang kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya, kepercayaan pada takdir, serta pertanyaan-pertanyaan tentang iman dan jawabannya. Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
