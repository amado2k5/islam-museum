text: "… قال كان رسول اللّٰه قد استعمل على قطع نخلهم أَبا لَيلى المازنيّ وعبد اللّٰه بن سَلام، فكان أَبو لَيلى يقطع العَجْوَة، وكان ابن سَلام يقطع اللَّوْن، فقال لهم بذو النَّضير : أَنتم مسلمون ما يحلّ لكم عقْر النخل. فاختلف أَصحاب …"
