text: "… أحمد بن محمد البغدادي: المعروف بالعراقي، نزيل دمشق، كان عالماً بالقراءات، وسمع الحديث على العديد من العلماء، توفي سنة ه. - أحمد بن الحسن بن أحمد ابن البنّاء البغدادب : أبو غالب، المعروف بمسند العراق، سمع منه الحديث، وقال عنه: …"
