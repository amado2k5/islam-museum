  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 28, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, bagian tubuh, dan pengobatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
