text: "… والطحال، وجميع أمراض الكبد والكلى والحصى، ويُذهب الوسواس، والصرع، وأوجاع الظهر، والمفاصل، وعرق النسا، والنقرس، والفالج، واللقوة، والخدر طلاء وسعوطاً. وأصل الشجرة قوي الفعل في تفتيت الحصي شرباً. حديثاً فقد الغار مكانته العلاجية وبقيت له بعض الخواص. التداوي بالأعشاب، والنباتات …"
summary:
