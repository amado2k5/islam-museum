  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 28, that mentions illness and the sick, pain, named diseases, the organs of the body, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 28 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 28, que menciona la enfermedad y los enfermos, el dolor, las enfermedades específicas, los órganos del cuerpo y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 28, qui mentionne la maladie et les malades, la douleur, les maladies nommées, les organes du corps, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
