text: "… اربعة من ابن ام عبد فبدأ به ومن ابي بن كعب ومن سالم مولى ابى حذيفة و من معاذ بن جبل وعند الاعمش في هذااسناد اخرعن ابراهيم عن علقمة عن عيد اللّٰه قال قال رسول الّه خذوا القرآن من اربعة …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 310، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 1, p. 310, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 1، ص 310 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 1, pág. 310, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab (tome 1, p. 310), mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 1. cildinin 310. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 1 bergambar, halaman 310, yang menyebutkan para qari; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
