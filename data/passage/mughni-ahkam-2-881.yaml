text: "… عمله وتنا بعد وقت، لا يؤثر فى إسقاط التكليف ما فيه السموم من الأدوية، هل يباح شربه ؟ إذا أكل أو شرب فى الفريضة عامدا، بطلت صلاته... إن كان شارب الميت طويلا، أخذ وجعل معه يستحب لمن حلق أو قصر، …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 2، ص 881، يرد فيه ذكر الفريضة والفرائض، والمستحب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
