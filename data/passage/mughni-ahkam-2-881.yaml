  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Jilid 2, halaman 881, yang menyebutkan amalan wajib, amalan anjuran, dan amalan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
