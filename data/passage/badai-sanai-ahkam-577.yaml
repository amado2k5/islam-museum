text: "… لأنها تعصر، أي: تؤخر، ولأن في التأخير تكثير النوافل لأن النافلة بعدها مكروهة فكان التأخير أفضل، ولهذا كان التعجيلُ في المغرب أفضلَ؛ لأن النافلة قبلها مكروهة، ولأنَّ المكث بعد العصر إلى غروب الشمس مندوب إليه، قال النبيّ للفيم مَنْ صَلِّى …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 577، يرد فيه ذكر المندوب، والنافلة والنوافل، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 577, whose wording mentions the recommended (mandub), the supererogatory (nafila), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 577 کا اقتباس جس میں مندوب، نفل اور نوافل، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 577, dont le texte mentionne le recommandé (mandub), le surérogatoire (nafila), le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 577, cuyo texto menciona lo recomendado (mandub), lo supererogatorio (nafila), lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' al-Sana'i' adlı eserinin 577. sayfasından, müstehaplı ameller, nafile ameller ve mekruhlu ameller hakkında bir alıntı; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Zorunlu ameller, görevler, itaat amelleri, müstehaplı ameller, mekruhlu ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Bada'i' al-Sana'i' karya al-Kasani, hlm. 577, yang menyebutkan amalan yang dianjurkan, amalan sunnah, dan amalan yang tidak disukai; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
