label: { ar: "صحيح مسلم 4986 — الأب والأبوة", en: "Sahih Muslim 4986 — the father and fatherhood", ur: "صحیح مسلم 4986 — باپ اور والدیت", es: "Sahih Muslim 4986 — El padre y la paternidad" }
text: "وَحَدَّثَنِي مُحَمَّدُ بْنُ أَحْمَدَ بْنِ أَبِي خَلَفٍ، حَدَّثَنَا مَعْنُ بْنُ عِيسَى، حَدَّثَنِي مُعَاوِيَةُ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، عَنْ أَبِي ثَعْلَبَةَ، عَنِ النَّبِيِّ فِي الَّذِي يُدْرِكُ صَيْدَهُ بَعْدَ ثَلاَثٍ \" فَكُلْهُ مَا لَمْ يُنْتِنْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4986، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4986 (The Book of Hunting, Slaughter, and what may be Eaten), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4986، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4986 (El Libro de la Caza, la Matanza y los Alimentos Comibles), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
