text: |-
  •⁦(فصل الطاء)⁩.
  ⁦(طعن)⁩.
  الظاهرة التى فى البرّ من الهذل والبعل الدى يشرب بعر وقممن غ-يرسق والضامنة ما تضهنها
  أمصارهم وقراهم من النخل والمضامين مافى أصلاب الفعول ونهى عن سع المضامين
  والملاقيح ى ضننت بالشئ أضن بد ضنا وضنانة اذا بخلت بد فاناضنين به قال القراه!
  وضننت بالفتح أضن لغة وقول قعنب ابن أمّ صاحب
  مهلا أعاذل قد جر بت من خلق * أنى أجودلا قوام وان ضننوا
  يريد ضنوا فأظهر التضعيف ضرورة وفلان ضنى من بين اخوانى وهوشبه الاختصاص
  وفى الحديث انّ للّه ضنامن خلقه يحييهم فى عافية ويميتهم فى عافية وهذا علق مضفة ومضنة
  بكسر الضاد وقهها أى نفيس ممايض ن به وضنة قبيلة والمضنون الغالية وأنشدئعلب
  قد أ كنيت يدالك بعد اللين * وبعدد هن البان والمضئون * وهمتا بالصبر والمرون
  ون ) الضيون السنور الذكر والمع الضياون محت الواومى بجعها لصحتها فى الواحد
  وأنمالم تدغم فى الواحدلانه اسم موضوع وليس على وجه الفعل وكذلك حيوة اسم رجل
  وفارقاهينا وميتا وسيداوجيدا وقال سيبويه فى تصغيره ضيين فاعله وجعله مثل أسيدوان
  كان جمعه أساودو من قال أسيود فى التصغير لم يمتنع أن يقول ضييون
  صل الطا بن الطين بالتحريك الفطنة يقال طيز له يطين طبنا وكذلك طين
  له بالفتح يطبن طبانة وطبانية وطبونة فهوطين وطابن أى فطن حاذق وطبفت الناردفنتها تملا
  تطافأوذلك الموضع الطابون ويقال طابن هذه الحفيرة وطأمنها والمطبتن مثل المطمتن يقال
  الطبأن مثل اطمأنّ وما أدرى أى" الطبن هو بالتسكين أى أىّ الناس هو والطبنة لعبة بقال
  لها بإلفارسية سدره والبمع طبن مثل صبرة وصبر وأنشد أبوعمرو
  تدكات بعدى وألهتها الطين • وتن تغدوفى الحبار والجرن
  {لطجن) الطيجن والطاجن الطابق يقلى عليه وكلاهما معرّب لان الطاء والجيم لا يجتمعان
  فى أصل كلام العرب ⁦(طحن)⁩ طحنت الرحى تطحن وطحنت أنا البة والطحن المصدر
  والعلهن بالمكسر الدقيق وطحنت الافعى ترحت واستدارت فهى مطهان قال الشاءر
  بحرشاء معليمان كأَن فخيها • اذا فزعت ماءه ريق على جر
  والطاحونة الرى والطواحن الاضراس والطحانة والطحون الابل الكثيرة والطمون
  الكتيبة تطحن مالقيت والطحن دويية وقال جندل
  اذارانى واحدا أوفى عين * يعرفى أطرق اطراق الطحن
  والطحأن ان جعليه من الطحن أجرته وان جعلّه من الطح أو الطها وهو المنبسط من
  الارض لم تجره ⁦(طعن)⁩ طعنه بالرح وطعن فى السن يطعن بالضم طعنا وطعن فيه بالقول
  يطعن أيضاطعنا وطعنانا وقال ايوزبيد وأبى ظاهر الشناءة الا • طعنانا وقول مالا يقال
  وطعن فى المغازة يطعن ويطعن أيضا أى ذهب قال
  وأطعن بالقوم شطر الملوك حتى اذاخفق المجدح
  (وقال حيد بن تور وطعنى اليك الليل حضيه اننى • لتلك اذاهاب الهدان فعول .
  قال أبو عبيدة أراد وطعى حضنى الليسل اليسك والفرس بطعن فى العنان اذامده وتنشط
