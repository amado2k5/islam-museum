text: "… بْنِ صُهَيْبٍ، قَالَ دَخَلْتُ أَنَا وَثَابِتٌ الْبُنَانِيُّ، عَلَى أَنَسِ بْنِ مَالِكٍ فَقَالَ ثَابِتٌ يَا أَبَا حَمْزَةَ اشْتَكَيْتُ. فَقَالَ أَنَسٌ أَفَلاَ أَرْقِيكَ بِرُقْيَةِ رَسُولِ اللَّهِ قَالَ بَلَى. قَالَ \" اللَّهُمَّ رَبَّ النَّاسِ مُذْهِبَ الْبَاسِ اشْفِ أَنْتَ الشَّافِي لاَ شَافِيَ إِلاَّ أَنْتَ شِفَاءً لاَ يُغَادِرُ سَقَمًا \". قَالَ وَفِي الْبَابِ عَنْ أَنَسٍ وَعَائِشَةَ. قَالَ أَبُو عِيسَى حَدِيثُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 973، يذكر الرقية، والسقم، والشكوى من العلة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 973 (The Book on Jana''iz (Funerals)), that mentions ruqya recited over the sick, sickness, a complaint of an ailment, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 973، جس میں رقیہ، سقم، بیماری کی شکایت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
