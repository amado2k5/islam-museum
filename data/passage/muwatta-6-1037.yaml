label: { ar: "الموطأ 1037 — مالك سئل عن الرجل يشتكي أذنه، أيقطر في أذنه من البان الذي لم يطيب وهو محرم؟ قال: لا أرى بذلك بأساً، ولو جعله في فيه لم أر بذلك بأساً", en: "Muwatta 1037", es: "Muwatta 1037", fr: "Muwatta 1037", ur: "موطا 1037", tr: "El-Muvatta 1037 — Malik'e, kulak ağrısından şikayet eden bir adam hakkında soru soruldu. İhram halindeyken kulağına kokusuz tütsü damlatması caiz midir? Malik şöyle dedi: Bunda bir sakınca görmüyorum, ağzına koymasında da bir sakınca görmezdim.", id: "Al-Muwatta 1037 — Malik ditanya tentang seorang pria yang mengeluh sakit telinga. Apakah diperbolehkan baginya meneteskan kemenyan tanpa pewangi ke telinganya saat dalam keadaan ihram? Dia berkata: Saya tidak melihat ada bahaya dalam hal itu, dan saya juga tidak melihat ada bahaya jika dia memasukkannya ke dalam mulutnya." }
summary:
  ar: "سئل مالك عن الرجل يشتكي أذنه، أيقطر في أذنه من الزيت الذي لم يطيب وهو محرم؟ فقال: لا أرى بذلك بأساً، ولو جعله في فيه لم أر بذلك بأساً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1197). {cite:muwatta-maruf-1997 p.482}"
  tr: "Malik'e, kulak ağrısından şikayet eden bir adam hakkında soru soruldu; ihramlı haldeyken kulağına kokusuz yağ damlatması caiz midir? Malik şöyle cevap verdi: Bunda bir sakınca görmüyorum, ağzına sürmesinde de bir sakınca görmezdim. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1197) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.482}"
  id: "Malik ditanya tentang seorang pria yang mengeluh sakit telinga; apakah diperbolehkan baginya meneteskan minyak wangi ke telinganya saat dalam keadaan ihram? Beliau menjawab: Saya tidak melihat ada bahaya dalam hal itu, dan saya juga tidak melihat ada bahaya jika ia meneteskannya ke mulutnya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1197). {cite:muwatta-maruf-1997 p.482}"
