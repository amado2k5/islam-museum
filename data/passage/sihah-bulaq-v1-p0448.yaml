text: |-
  ١٩٢
  لاقح واللقاح أيضاما تلقح به النخلة ويقال آيضاحىً لقاح للذين لايديبون لاملوك أولم يصبهم
  فى الجاهلية سباء واللقاح بالكسر الابل بأعيانها الواحدة لقوح وهى الخلوب مثل قلوص
  وقلاص قال أبو عم رواذا تتجت فهى لقوح شمهرين أوثلاثة ثم هى لبون بعد ذلكْ وق ولهم
  لقاحان اسودان كما قالواقطيعان لانهم يقولون لقاح واحدة كاية ولون قطيع واحد ولبل
  واحد واللقعة اللقوح والجمع لقح مثل قربة وقرب وتلقيح النخل معروف يقال لقهوانخلهم
  وألقحوا نخلهم وقد لقون النخيل ويقال فى النخلالواحسدة لقحت بالتخفيف القرّاه تلقمت
  الناقة اذا أرن أنها الاقح ولا تكون كذلك والملاقح الفحول الواحد ملقح والملاقح ايضا
  الاناث التى فى بطونها أولادها الواحدة ملقحة بفتح القساف والملاقيح مافى بطون الذوق من
  الاجنة الواحدة ملقوحة من قولهم لقعت كالمحموم من حم والجنونمن جنّ قال الراجز
  إنا وجد ناطرد الهوامل • خيرا من التأفان والمسائل
  وعدة العام وعام قابل * ملقوحة فى بطن ناب حائل
  ل ح لمحه وألحه اذا ابصره بنظر خفيف والاسم اللعهة ولح البرق والنيم لمها أى لمع
  تقول رأيت لمحة البرق وفى فلان لمحة من أبيه ثم قالوافيه ملامح من ابيه أى مشابه فجمعوه على
  غير لفظه وهومن التواد روقولهم لا رينك لحاباصرا أى أمر اواضحا، لوح لاح الشئ
  يلوح لوحا أى لمح ولاحه السفرغيره ولاح لوحاولواساعطس والناح مثله قال روبة
  يصعن بالاذناب من لوح وبق ولاح البرق وألاح اذا أومضّ ولاح النج-م وألاح اذا بداقال
  ابن السكيت لاح سهيل اذايدا وألاح اذا تلاً لأ قال وألاح بحقى اذا ذهب به أبو عرو ألاح
  الرج-ل من الشئاذا أشفق وحاذر وأنشد
  انّ دليما قد ألاح من أبى * فقال أنزاى فلا ايضاع بى
  أى لاسربى وألاح بسيفه لمع به وألاحه أهلمكه والملواح من الدواب السريع العطسْر وابل
  لو حى أى عطشى ولوّحته الشمس غسيرته وسفعت وجهسه واوح بثويه لمع به واوّحت الشئ
  بالنار أجيته وقال الشاعر
  عقار عضناة كأنّ وظفها* وخرطومها الاعلى بنار ملوّح
  واللوح الكتف وكل عظم ء ريض واللوح الذى يكتب فيه وألواح السلاح ما يلوح منه
  كالسيف والسذان قال الشاعر مروبن أحر الباهنى
  تسى كألواح السلاح وتضحى كالمهاة صيحة القط-ر
  واللوح بالضم الهواء بين السماء والارض يقال لا أفعل ذلك ولونزوت فى اللوح اى ولونزوت
  فى السكال وشئ لياح أى أبيض قال الفراء اغماصارت الواويا. لا نمكسار ما قبلها وأنشد
  أقب البطن خفاق الحشايا • يضئ الليل كااقمر اللياح
  منه قيل للثور الوحشى لياح لبياضه
  صل اليم) منح) الماتح المستقى وكذلك المتوح تقول معّ الماء يمتحه متحا اذانزءه
  وبثرموح للتى يمدمتها باليدين على البكرة وقولهم سر ناعقبة متوحا أى بعيدة ومتح النهار.
  اغة فى متع اذا ارتفع وليسل متاح أى طويل ومتح بها أى حبق ومتح إسلهه رمى به ⁦(مجح )⁩
