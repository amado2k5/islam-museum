label: { ar: "الموطأ 2074 — مالك عن ابن شهاب: سأل سعيد بن المسيب عن كراء الأرض بالذهب والورق، فقال: لا بأس به", en: "Muwatta 2074", es: "Muwatta 2074", fr: "Muwatta 2074", ur: "موطا 2074", tr: "El-Muvatta 2074 — Malik, İbn Şihab'dan rivayetle: Said bin el-Musayyab'a altın ve gümüş karşılığında arazi kiralamak hakkında sordu ve o şöyle dedi: Bunda bir sakınca yoktur.", id: "Al-Muwatta 2074 — Malik, berdasarkan riwayat Ibn Shihab: Dia bertanya kepada Saeed bin Al-Musayyab tentang menyewakan tanah dengan emas dan perak, dan dia berkata: Tidak ada yang salah dengan itu." }
summary:
  ar: "يروي مالك عن ابن شهاب أنه سأل سعيد بن المسيب عن كراء الأرض بالذهب والورق، فقال: لا بأس به. {cite:muwatta-maruf-1997 p.249} {cite:muwatta-maruf-1997 p.250}"
  tr: "Malik, İbn Şihab'dan rivayetle, Sa'id ibn al-Musayyab'a altın ve gümüş karşılığında arazi kiralamak hakkında sorduğunu ve onun da \"Bunda bir sakınca yoktur\" dediğini aktarır. {cite:muwatta-maruf-1997 s.249} {cite:muwatta-maruf-1997 s.250}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia bertanya kepada Sa'id ibn al-Musayyab tentang menyewakan tanah dengan emas dan perak, dan beliau menjawab: Tidak ada yang salah dengan hal itu. {cite:muwatta-maruf-1997 p.249} {cite:muwatta-maruf-1997 p.250}"
