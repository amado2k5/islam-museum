label: { ar: "موطأ مالك 1088 — الأب والأبوة", en: "Muwatta Malik 1088 — the father and fatherhood", ur: "موطأ مالک 1088 — باپ اور والدیت", es: "Muwatta Malik 1088 — El padre y la paternidad", fr: "Muwatta Malik 1088 — le père et la paternité" }
text: "… بِالشَّكِّ وَلاَ يَرِثُ أَحَدٌ أَحَدًا إِلاَّ بِالْيَقِينِ مِنَ الْعِلْمِ وَالشُّهَدَاءِ وَذَلِكَ أَنَّ الرَّجُلَ يَهْلِكُ هُوَ وَمَوْلاَهُ الَّذِي أَعْتَقَهُ أَبُوهُ فَيَقُولُ بَنُو الرَّجُلِ الْعَرَبِيِّ قَدْ وَرِثَهُ أَبُونَا فَلَيْسَ ذَلِكَ لَهُمْ أَنْ يَرِثُوهُ بِغَيْرِ عِلْمٍ وَلاَ شَهَادَةٍ إِنَّهُ مَاتَ قَبْلَهُ وَإِنَّمَا يَرِثُهُ أَوْلَى النَّاسِ بِهِ مِنَ الأَحْيَاءِ. قَالَ مَالِكٌ وَمِنْ ذَلِكَ أَيْضًا الأَخَوَانِ لِلأَبِ وَالأُمِّ يَمُوتَانِ وَلأَحَدِهِمَا …"
summary:
  ar: "حديث في موطأ مالك، رقم 1088، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1088 (Fara'id), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1088، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1088 (Fara'id), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 1088 (Fara'id), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
