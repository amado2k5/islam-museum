label: { ar: "الموطأ 1936 — مالك: بلغه أن رجلا قال لرجل: ابتع لي هذا البعير بنقد حتى أبتاعه منك إلى أجل، فكره عبد الله بن عمر ذلك ونهى عنه", en: "Muwatta 1936", es: "Muwatta 1936", fr: "Muwatta 1936", ur: "موطا 1936", tr: "El-Muvatta 1936 — Malik: Bir adamın başka bir adama şöyle dediği kendisine ulaştı: \"Bana bu deveyi nakit olarak al ki, ben de onu senden kredili olarak alayım.\" Abdullah bin Ömer bunu beğenmedi ve yasakladı.", id: "Al-Muwatta 1936 — Malik: Sampai kepadanya bahwa seorang laki-laki berkata kepada laki-laki lain: Belikan aku unta ini secara tunai agar aku dapat membelinya darimu secara kredit. Abdullah bin Umar tidak menyukai hal itu dan melarangnya." }
summary:
  ar: "قال مالك: بلغه أن رجلا قال لرجل: ابتع لي هذا البعير بنقد، حتى أبتاعه منك إلى أجل. فسئل عن ذلك عبد الله بن عمر، فكرهه، ونهى عنه. {cite:muwatta-maruf-1997 p.192}"
  tr: "Malik şöyle dedi: Bir adamın diğerine şöyle dediği rivayet edildi: \"Bana bu deveyi nakit olarak satın al, böylece onu senden kredili olarak satın alayım.\" Abdullah ibn Umar'a bunun sebebi soruldu ve o bunu hoş karşılamadı ve yasakladı. {cite:muwatta-maruf-1997 s.192}"
  id: "Malik berkata: Sampai kepadanya kabar bahwa seorang laki-laki berkata kepada laki-laki lain: Belikan aku unta ini secara tunai, agar aku dapat membelinya darimu secara kredit. Abdullah ibn Umar ditanyai tentang hal ini, dan beliau tidak menyukainya dan melarangnya. {cite:muwatta-maruf-1997 p.192}"
