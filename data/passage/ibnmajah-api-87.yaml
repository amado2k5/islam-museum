text: "… عَدِيُّ بْنُ حَاتِمٍ الْكُوفَةَ أَتَيْنَاهُ فِي نَفَرٍ مِنْ فُقَهَاءِ أَهْلِ الْكُوفَةِ. فَقُلْنَا لَهُ حَدِّثْنَا مَا سَمِعْتَ مِنْ رَسُولِ اللَّهِ ـ. فَقَالَ أَتَيْتُ النَّبِيَّ ـ فَقَالَ \" يَا عَدِيَّ بْنَ حَاتِمٍ أَسْلِمْ تَسْلَمْ \". قُلْتُ وَمَا الإِسْلاَمُ فَقَالَ \" تَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنِّي رَسُولُ اللَّهِ وَتُؤْمِنُ بِالأَقْدَارِ كُلِّهَا خَيْرِهَا وَشَرِّهَا حُلْوِهَا وَمُرِّهَا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 87، يذكر تعريف الإسلام بأعماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 87 (The Book of the Sunnah), that mentions Islam defined by its acts. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 87، جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 87 (El Libro de la Sunnah), menciona el Islam definido por sus actos. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 87 (Le Livre de la Sunna), mentionne que l'islam est défini par ses actes. Le moteur de recherche « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'islam, les branches de la foi et les qualités du croyant."
  tr: "İbn Mâce Sünen'inde yer alan 87 numaralı hadis, İslam'ı amelleriyle tanımlar. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an'dan, Sünnet'ten, Peygamberin hayatından ve Sahabeler ile haleflerinden rivayetlerle birlikte bu dört kategori içinde derler."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 87, mendefinisikan Islam melalui perbuatannya. Hadits ini merangkum rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
