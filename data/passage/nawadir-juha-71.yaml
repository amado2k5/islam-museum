text: "… مرق مرق الأرنب أهداهُ فلاحْ أرنباً فأكرمَهُ جحا كثيراً إلى أنِ أنصرفَ وعادَ في الأسبوعِ الثاني فلم يعرفهُ جحا فسألَهُ مَنْ حضرتُهُ. فقال: أنا يا سيدي الذي أحضرْتُ الأرنَبَ منذَ أسبوعِ فأحسنَ مقابلتَهُ."
summary:
  ar: "جاء فلاح إلى جحا بأرنب فأُكرم إكرامًا كبيرًا، ثم جاء جيران المُهدي فقُدّم لهم ماء ساخن، وسماه جحا مرق مرق الأرنب. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  en: "A farmer brings Juha a rabbit and is generously entertained; later neighbours of the giver arrive and are served hot water, and Juha calls it 'broth of the broth of the rabbit'. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  ur: "ایک کسان جحا کے پاس خرگوش لایا اور اس کی خوب خاطر کی گئی؛ بعد میں دینے والے کے پڑوسی آئے تو انہیں گرم پانی پیش کیا گیا، اور جحا نے اسے خرگوش کے شوربے کا شوربہ کہا۔ {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  fr: "Un paysan apporte un lapin à Juha et est reçu généreusement ; plus tard, des voisins de celui qui l'a offert arrivent et on leur sert de l'eau chaude, que Juha appelle «bouillon du bouillon du lapin». {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  es: "Un campesino le trae un conejo a Juha y es agasajado con generosidad; más tarde llegan unos vecinos del donante y se les sirve agua caliente, que Juha llama «caldo del caldo del conejo». {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  tr: "Bir çiftçi Juha'ya bir tavşan getirdi ve ona büyük bir misafirperverlikle davranıldı. Sonra tavşanı getiren adamın komşuları geldi ve onlara sıcak su ikram edildi. Juha buna tavşan suyu dedi. {cite:juha-nawadir-kubra-djuwaydi s. 38}"
  id: "Seorang petani membawa seekor kelinci ke Juha, dan ia disambut dengan sangat ramah. Kemudian tetangga-tetangga pria yang membawa kelinci itu datang, dan air panas disajikan kepada mereka. Juha menyebutnya kaldu kelinci. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
