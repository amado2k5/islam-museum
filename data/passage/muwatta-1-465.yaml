label: { ar: "الموطأ 465 — ابن عمر يبدأ بالمكتوبة إذا جاء وقد صلى الناس", en: "Muwatta 465", es: "Muwatta 465", fr: "Muwatta 465", ur: "موطا 465", tr: "El-Muvatta 465 — İbn Ömer, eğer insanlar namazı kıldıktan sonra gelirse, farz namazla başlar.", id: "Al-Muwatta 465 — Ibnu Umar memulai dengan salat wajib jika ia tiba setelah orang-orang selesai salat." }
summary:
  ar: "أثر يرويه مالك عن ربيعة بن أبي عبد الرحمن أن عبد الله بن عمر كان إذا جاء المسجد وقد صلى الناس بدأ بالصلاة المكتوبة ولم يصل قبلها شيئاً؛ وهو في باب العمل في جامع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.239}"
  tr: "Malik'in Rabi'ah ibn Abi 'Abd al-Rahman'dan rivayet ettiği bir hadiste, Abdullah ibn 'Umar'ın cemaat namazı bittikten sonra mescide geldiğinde önce farz namazı kıldığı ve ondan önce başka bir namaz kılmadığı belirtilmektedir; bu, cemaat namazının uygulamaları bölümünde yer almaktadır. Editör, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.239}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Rabi'ah ibn Abi 'Abd al-Rahman menyatakan bahwa ketika Abdullah ibn Umar tiba di masjid setelah orang-orang selesai shalat, beliau akan memulai dengan shalat wajib dan tidak melakukan shalat apa pun sebelumnya; hal ini terdapat dalam surah tentang tata cara shalat berjamaah. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab dan Suwayd. {cite:muwatta-maruf-1997 p.239}"
