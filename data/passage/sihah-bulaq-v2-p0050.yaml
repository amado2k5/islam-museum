text: |-
  ٥٢٧
  المستوفزويقال اقلول الرجل فى أمره اذا أنكمس واقلوات الحرفى-رعتها وأنشد الاحر
  يقول اذا اقلولى عليها وأقردت • ألاهل أخوعيس لذيذ بدائم
  وقلت الناقة براكبها قلوا اذا تقدمت به وقالى قلاه وضع وهما اسمسان جعلا واحدا قال ابن
  السراج بنى كل واحد منهما على الوقف لانهم كرهوا الفتحة فى الياء والالف نا ، قنوت
  الغتم وغيرها قفوة وقنوة وقفيت أيضاقفية وقنية اذا اقتنيتها لنفسك لاللتحجارة ومال قنيان
  وقفيان يتخذقنيسة وقنيت الحارية تقنى ققيسة عسلى مالم يسمتفاعله اذا منعت من اللعب مع
  لصبيان وسترت فى البيت أخبرتى به أبو سعيد عن أبى بحكرين الازهر عن بدار عن ابن
  السكيت وسألته عن قنيت الجارية تقنيسة فلم يعرفه واقتناءالمال وغيره اتخاذه وف المئل
  لا تقتن من كاب سوعجروا والمقناة المصحاة يهم زولايه مزوكذلك المقنوة أبو عبيسدة
  قى الرجمل يقى قنى مثسل غنى يغى غى وأقناه اللّٰه أى أعطاه ما يقتى من القنية والنشب
  وأقناه أيضا أى أرضاه والقنى الرضاعن أب زيد قال وتول العرب من أعطى مائة من المعز
  فقد أعطى القنى ومن أعطى مائة من الضأن فقد أعطى الغى ومن أعطى مائة من الابل فقد
  أعطى المى ويقال أغماه اللّٰه وأقناه أى أعطاه اللّه ما يسكن اله والتنو العذق والجمع
  القنوان والاقفاء وقال • طويلة الاقناء والاناكل • والقنامصورمثل القنووالجع أقناء
  والقنا أيضاجع قناة وهى الرمح وتجمع على قنوات وقنىّ عسلى فعول وقناءمثل جبل وجبال
  وكذلك القناة التى تحفر وقناة الظهر التى تنتظ-م الفقار ويقال لأقنونك قناوتك أى
  لاجز ينك جزاءل وما يقا في هذا الشئ أى ما يوافنى وقان الاصعى قايت الشى خلطته
  وكل شى خالط شأ فقد قاناه ومنه قول امرئ القيص
  كبكر المقاناة البياض بصفرة • غذاهاغير الماء غير مجلل
  وأحرفان أى شديد الحمرة والقنا احديداب فى الانف يقال رجحسل أقنى الانف واهرأة
  ننواء بينة الففاوهوعيب فى الخيل قال سلامة بن جندل • ليس بأسنى ولا أقنى ولا سغل
  وقنيت الحياء بالكسرقنيانا بالضم أى لزمته قال عنترة
  اقى حاءك لا أبالك واعلى • أنى امر وسأموت ان لم أقتل
  وقانة الشئ أى دام وقال يصْف قرسا
  قانى له فى الصيف ظل بارد • ونصى ناعمة ومحض منقع
  ( قوا القوّة خلاف الضعف والقوة الطاقة من الحبل وجمعها قوى ورجل شديد القوى
  أى ش-ديد أسر الخلق وأقوى الرجسل أى نزل القواء وأقوى أى فى زاده ومنه قولد تعالى
  ومتاعاللمقوين وأقوى اذاكانت داشه قوية بقال فلان قوى مقوذالقوى فى نفسه
  والمقوى فى دابتسه والاقواء فى الشعرقال أبوء روبن العلاهوأن تختلف حركات الروى
  فبعضه هرفوع وبعضه منصوبُ أو يجزور وكان أبو عبيدة يقول الاقواء نقصان رف من
  الفاصلة يعنى من عروض البيت وهو مشقق من قوّة الجبل كأنه نقص قوة من قواه وهو مثل
  القطع فى عروض الكامل كقول الشاعر - .
  أفبعد مقتل الين زهير • ترجو الفا لمواقب الاطهار
