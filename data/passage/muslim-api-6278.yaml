label: { ar: "صحيح مسلم 6278 — الأب والأبوة", en: "Sahih Muslim 6278 — the father and fatherhood", ur: "صحیح مسلم 6278 — باپ اور والدیت", es: "Sahih Muslim 6278 — El padre y la paternidad", fr: "Sahih Muslim 6278 — Le père et la paternité", tr: "Sahih Muslim 6278 — Baba ve Babalık", id: "Sahih Muslim 6278 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا سَهْلُ بْنُ عُثْمَانَ، حَدَّثَنَا حَفْصُ بْنُ غِيَاثٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ مَا غِرْتُ عَلَى نِسَاءِ النَّبِيِّ إِلاَّ عَلَى خَدِيجَةَ وَإِنِّي لَمْ أُدْرِكْهَا. قَالَتْ وَكَانَ رَسُولُ اللَّهِ إِذَا ذَبَحَ الشَّاةَ فَيَقُولُ \" أَرْسِلُوا بِهَا إِلَى أَصْدِقَاءِ خَدِيجَةَ \". قَالَتْ فَأَغْضَبْتُهُ يَوْمًا فَقُلْتُ خَدِيجَةَ فَقَالَ رَسُولُ اللَّهِ \" إِنِّي قَدْ رُزِقْتُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6278، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6278 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6278، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6278 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6278 (Livre des mérites des Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 6278 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6278, menyebutkan tentang ayah dan peran ayah. Peramban \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
