label: { ar: "الموطأ 1436 — ابن عباس: مر النبي بشاة ميتة أعطتها مولاة لميمونة، فقال أفلا انتفعتم بجلدها، إنما حرم أكلها", en: "Muwatta 1436" }
text: "إنَّما حُرِّمَ أكْلُها"
summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن عبد الله بن عباس أن رسول الله مر بشاة ميتة كان أعطاها مولاة لميمونة زوج النبي، فقال أفلا انتفعتم بجلدها؟ فقالوا يا رسول الله إنها ميتة، فقال إنما حرم أكلها. ويذكر المحقق أن ابن عبد البر قال إن الصحيح في إسناده الاتصال. {cite:muwatta-maruf-1997 p.642}"
