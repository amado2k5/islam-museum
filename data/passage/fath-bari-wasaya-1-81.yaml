  tr: "İbn Hajar'ın Fath al-Bari adlı eserinin resimli 1. cildinin 81. sayfasında, mezar, türbe ve kutsal mekandan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetler, Miras, Antik Eserler ve Kutsal Mekanlar Tarayıcısı tarafından derlenmiştir."
