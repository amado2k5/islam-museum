text: "… المقدس فحضرت الصلاة فأمهم نبينا واله ثم اجتمعوا في بيت المقدس. وفي حديث أبي ذر ومالك بن صعصعة في قصة الإسراء أنه لقيهم بالسموات، وطرق ذلك صحيحة، فيحمل على أنه رأى موسى قائمًا يصلي في قبره، ثم عرج به هو …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 81، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
