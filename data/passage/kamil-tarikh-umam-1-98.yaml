text: "… ألحقتني بهم، فوالله ما في العيش بعدهم خير. فقتله. ثم افتتح رسول الله، لم، حصن الصَّعب، وهو أكثرها طعاماً وودكاً، ثمّ قصد حصنهم الوطيح والسُّلالم، وكانا آخر ما افتتح، فخرج منه مَرْحب اليهوديّ وهو يقول: قد علِمتْ خيبرُ أَنِّي مَرْحَبُ …"
summary:
