text: "… بعدم ذكره بإيجابِ أو تحريمٍ على أنَّه معفوٌّ عنه، وهاهنا مسلكان : أحدهما : أنْ يُقال : لا إيجابَ ولا تحريمَ إلا بالشَّرع، ولم يوجب الشَّرعُ كذا، أو لم يحرِّمه، فيكونُ غيرَ واجبٍ، أو غير حرامٍ، كما يقال مثلُ هذا …"
