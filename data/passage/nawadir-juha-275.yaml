text: "… جحا والفلسفة عندما كان تيمور لنك في مدينة آقَ شَهْرُ جاءه دهريّ، وعرض عليه بواسطة الترجمان أنَّ لديه بعض الأسئلةِ، فإذا كان في المدينة علماء حاذِقون ماهرون، فإنّي أُريد اختبارهم. نجمع تيمورلنك أشراف البلدة وقال لهم: لقد جاءكم عالِمٌ غريبٌ …"
summary:
  ar: "حين كان تيمور لنك في آق شهر طلب فيلسوف أن يمتحن علماء البلد، فخشي تيمور أن يقول الروم إن علماءهم ذهبوا، فتشاور الأعيان في استدعاء علماء من قونية أو قيصرية ثم قرروا اللجوء إلى جحا، فوافق على امتحان الفيلسوف بشرط مكافأة إن نجح. وتستمر الحكاية في الصفحة التالية. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  en: "When Timur is in Akshehir a philosopher asks to test the local scholars, and Timur fears that the Romans would say their learned men are gone. The notables consider sending for scholars from Konya or Caesarea, but decide to ask Juha, and Juha agrees to test the philosopher on condition of a reward if he succeeds. The story continues in the next entry. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  ur: "جب تیمور لنگ آق شہر میں ہوتا ہے تو ایک فلسفی مقامی علماء کا امتحان لینا چاہتا ہے، اور تیمور کو اندیشہ ہوتا ہے کہ رومی کہیں گے ان کے اہل علم ختم ہو گئے۔ معززین قونیہ یا قیصریہ سے علماء بلانے پر غور کرتے ہیں مگر جحا سے کہنے کا فیصلہ کرتے ہیں، اور جحا اس شرط پر فلسفی کا امتحان لینے پر راضی ہوتا ہے کہ کامیاب ہونے پر انعام ملے۔ حکایت اگلے حصے میں جاری رہتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  fr: "Quand Timur est à Akshehir, un philosophe demande à mettre à l'épreuve les savants du lieu, et Timur craint que les Romains ne disent que leurs hommes de science ont disparu. Les notables envisagent de faire venir des savants de Konya ou de Césarée, mais décident de s'adresser à Juha, qui accepte d'éprouver le philosophe à condition d'obtenir une récompense en cas de succès. L'histoire se poursuit dans la partie suivante. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  es: "Cuando Timur está en Akshehir, un filósofo pide examinar a los sabios del lugar, y Timur teme que los romanos digan que sus eruditos se han ido. Los notables consideran traer sabios de Konya o de Cesarea, pero deciden recurrir a Juha, que acepta examinar al filósofo con la condición de una recompensa si lo logra. La historia continúa en la parte siguiente. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  tr: "Timur Lenk Akşehir'deyken, bir filozof bölgenin âlimlerini sınamak istedi. Timur, Bizanslıların âlimlerinin ayrıldığını söyleyeceğinden korktuğu için, ileri gelenler Konya veya Kayseri'den âlim çağırmayı düşündüler. Daha sonra, filozofun sınavı geçmesi halinde ödül verilmesi şartıyla sınamayı kabul eden Juha'ya başvurmaya karar verdiler. Hikaye bir sonraki sayfada devam ediyor. {cite:juha-nawadir-kubra-djuwaydi s. 132}"
  id: "Ketika Timur Lenk berada di Akşehir, seorang filsuf meminta untuk menguji para cendekiawan di daerah itu. Timur khawatir bahwa Bizantium akan mengatakan bahwa para cendekiawan mereka telah pergi, jadi para tokoh penting berkonsultasi tentang memanggil para cendekiawan dari Konya atau Kayseri. Mereka kemudian memutuskan untuk meminta bantuan Juha, yang setuju untuk menguji filsuf tersebut dengan syarat imbalan jika ia lulus. Kisah berlanjut di halaman berikutnya. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
