text: "ولما عزله الصالح من النيابة أقام خاملا وكان كثير البر بالفقراء والمساكين، وكانت وفاته بمصر وفيها توفي. شمس الدين محمد بن سعد المقدسي الكاتب الحسن الخط، كان كثير الأدب، وسمع الحديث كثيراً، وخدم السلطان الصالح إسماعيل والناصر داود، وكان دينا …"
