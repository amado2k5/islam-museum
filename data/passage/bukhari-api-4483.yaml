label: { ar: "صحيح البخاري 4483 — أثر من الآثار المحفوظة", en: "Sahih al-Bukhari 4483 — a relic kept after its owner", ur: "صحیح بخاری 4483 — محفوظ آثار و تبرکات", es: "Sahih al-Bukhari 4483 — una reliquia conservada después de su dueño.", fr: "Sahih al-Bukhari 4483 — une relique conservée après son propriétaire", tr: "Sahih el-Buhari 4483 — Korunmuş bir gelenek", id: "Sahih al-Bukhari 4483 — Sebuah hadis yang terpelihara" }
text: "… قَالَ قَالَ عُمَرُ وَافَقْتُ اللَّهَ فِي ثَلاَثٍ ـ أَوْ وَافَقَنِي رَبِّي فِي ثَلاَثٍ ـ قُلْتُ يَا رَسُولَ اللَّهِ، لَوِ اتَّخَذْتَ مَقَامَ إِبْرَاهِيمَ مُصَلًّى وَقُلْتُ يَا رَسُولَ اللَّهِ يَدْخُلُ عَلَيْكَ الْبَرُّ وَالْفَاجِرُ، فَلَوْ أَمَرْتَ أُمَّهَاتِ الْمُؤْمِنِينَ بِالْحِجَابِ فَأَنْزَلَ اللَّهُ آيَةَ الْحِجَابِ قَالَ وَبَلَغَنِي مُعَاتَبَةُ النَّبِيِّ بَعْضَ نِسَائِهِ، فَدَخَلْتُ عَلَيْهِنَّ قُلْتُ إِنِ انْتَهَيْتُنَّ أَوْ لَيُبَدِّلَنَّ اللَّهُ رَسُولَهُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4483، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4483 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4483، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4483 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 4483 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 4483 numaralı hadiste, korunmuş bir kutsal emanetten bahsedilir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4483, menyebutkan sebuah relik yang terpelihara. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
