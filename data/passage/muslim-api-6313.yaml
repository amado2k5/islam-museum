label: { ar: "صحيح مسلم 6313 — قراءات القرآن", en: "Sahih Muslim 6313 — the readings of the Qur'an", ur: "صحیح مسلم 6313 — قرآن کی قراءتیں", es: "Sahih Muslim 6313 — las lecturas del Corán" }
text: "… لَكِ رَسُولُ اللَّهِ فَقَالَتْ أَمَّا الآنَ فَنَعَمْ أَمَّا حِينَ سَارَّنِي فِي الْمَرَّةِ الأُولَى فَأَخْبَرَنِي \" أَنَّ جِبْرِيلَ كَانَ يُعَارِضُهُ الْقُرْآنَ فِي كُلِّ سَنَةٍ مَرَّةً أَوْ مَرَّتَيْنِ وَإِنَّهُ عَارَضَهُ الآنَ مَرَّتَيْنِ وَإِنِّي لاَ أُرَى الأَجَلَ إِلاَّ قَدِ اقْتَرَبَ فَاتَّقِي اللَّهَ وَاصْبِرِي فَإِنَّهُ نِعْمَ السَّلَفُ أَنَا لَكِ \". قَالَتْ فَبَكَيْتُ بُكَائِي الَّذِي رَأَيْتِ فَلَمَّا رَأَى جَزَعِي سَارَّنِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6313، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih Muslim, no. 6313 (The Book of the Merits of the Companions), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح مسلم کی حدیث نمبر 6313، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 6313 (El Libro de los Méritos de los Compañeros), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
