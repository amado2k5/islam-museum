text: "… عَلَى مَنْ دُعِيَ مِنْ تِلْكَ الأَبْوَاب مِنْ ضَرُورَةٍ، فَهَلْ يُدْعَى أَحَدٌ مِنْ مِنْهُم البخاري:، ومسلم:. وقال: مَنْ أَنْفَقَ نَفَقَةً فَاضِلَةً في سَبِيلِ اللَّهِ، لَبِسَبْعمئةٍ، وَمَنْ أَنْفَقَ عَلَى نَفْسِهِ وَأَهْلِهِ، وَعَادَ مَرِيضاً أَوْ أَمَاطَ الأَذَى عَنْ طَرِيقٍ، فالحَسَنَةُ بِعَشْرِ أَمْثَالهَا، وَالصَّوْمُ …"
