label: { ar: "سنن أبي داود 4024 — الأب والأبوة", en: "Sunan Abi Dawud 4024 — the father and fatherhood", ur: "سنن ابی داؤد 4024 — باپ اور والدیت", es: "Sunan Abi Dawud 4024 — El padre y la paternidad" }
text: "حَدَّثَنَا إِسْحَاقُ بْنُ الْجَرَّاحِ الأَذَنِيُّ، حَدَّثَنَا أَبُو النَّضْرِ، حَدَّثَنَا إِسْحَاقُ بْنُ سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أُمِّ خَالِدٍ بِنْتِ خَالِدِ بْنِ سَعِيدِ بْنِ الْعَاصِ، أَنَّ رَسُولَ اللَّهِ أُتِيَ بِكِسْوَةٍ فِيهَا خَمِيصَةٌ صَغِيرَةٌ فَقَالَ \" مَنْ تَرَوْنَ أَحَقَّ بِهَذِهِ \". فَسَكَتَ الْقَوْمُ فَقَالَ \" ائْتُونِي بِأُمِّ خَالِدٍ \". فَأُتِيَ بِهَا فَأَلْبَسَهَا إِيَّاهَا ثُمَّ قَالَ \" أَبْلِي وَأَخْلِقِي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4024، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4024 (Clothing (Kitab Al-Libas)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4024، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4024 (El Libro de la Vestimenta (Kitab Al-Libas)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
