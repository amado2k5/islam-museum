text: "… بسر اسمها أيها الناس، إن اللّٰه كتب عليكم السعي فاسعوا. بُهيمة، بزيادة ميم، روت عن النبي عيله أنه نهى عن رواء منصور، عن أُمّه صفية. وقد تقدّم ذكرها. صيام يوم السبت إلا في فريضة. روى عنها أخوها ورواه عطاء، عن …"
