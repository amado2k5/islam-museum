text: "… ما أصبتم مثلها: لا يرجونَ عبدٌ إلا ربه، ولا يخافنَّ إلا ذنبه، ولا يستحي إذا لم يعلم أن يتعلم، ولا يستحبي إذا سئل عما لا يعلم أن يقول: لا أَعلم، واعلموا أن الصبر من الإيمان بمنزلة الرأس من الجسد، ولا …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 121، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
