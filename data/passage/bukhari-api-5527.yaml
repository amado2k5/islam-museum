label: { ar: "صحيح البخاري 5527 — ما حُرّم", en: "Sahih al-Bukhari 5527 — what was made unlawful", ur: "صحیح بخاری 5527 — جو حرام کیا گیا", es: "Sahih al-Bukhari 5527 — lo que se declaró ilícito" }
text: "حَدَّثَنَا إِسْحَاقُ، أَخْبَرَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا أَبِي، عَنْ صَالِحٍ، عَنِ ابْنِ شِهَابٍ، أَنَّ أَبَا إِدْرِيسَ، أَخْبَرَهُ أَنَّ أَبَا ثَعْلَبَةَ قَالَ حَرَّمَ رَسُولُ اللَّهِ لُحُومَ الْحُمُرِ الأَهْلِيَّةِ. تَابَعَهُ الزُّبَيْدِيُّ وَعُقَيْلٌ عَنِ ابْنِ شِهَابٍ. وَقَالَ مَالِكٌ وَمَعْمَرٌ وَالْمَاجِشُونُ وَيُونُسُ وَابْنُ إِسْحَاقَ عَنِ الزُّهْرِيِّ نَهَى النَّبِيُّ عَنْ كُلِّ ذِي نَابٍ مِنَ السِّبَاعِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5527، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5527 (Hunting, Slaughtering), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5527، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5527 (Caza y matanza), menciona lo que se considera ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
