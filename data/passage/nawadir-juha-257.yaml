text: "… أأنت تبيع المخلل أم أنا؟ أخذ الشيخ يبيع مخللاً مكابيس، وقدِ أبتاع أدوات المخلَّل مع حمار المخلَّلاتي، فكان الحمار يعرف البيوت التي تبتاع منه. وكلَّما نادى الشيخ مخلل مخلل، كان الحمارُ ينهقُ في تلك الأزقةِ المزدحمة، ويغطّي بنهيقه صوت الشيخ، …"
summary:
  ar: "كان جحا يبيع المخلل ومعه حمار يعرف البيوت التي تشتري، وكان الحمار ينهق فوق نداءاته، وفي زقاق مزدحم قال جحا للحمار: أأنت تبيع المخلل أم أنا؟ {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  en: "Juha sells pickles with a donkey that knows the houses that buy, and the donkey brays over his calls. In a crowded lane Juha says to the donkey, 'Are you selling the pickles or am I?' {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  ur: "جحا اچار بیچتا ہے اور اس کا گدھا ان گھروں کو جانتا ہے جو خریدتے ہیں، اور گدھا جحا کی صداؤں پر ڈھینچوں ڈھینچوں کرتا ہے۔ ایک بھیڑ والی گلی میں جحا گدھے سے کہتا ہے: اچار تم بیچ رہے ہو یا میں؟ {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  fr: "Juha vend des cornichons avec un âne qui connaît les maisons qui achètent, et l'âne brait par-dessus ses cris. Dans une ruelle bondée, Juha dit à l'âne : « C'est toi qui vends les cornichons, ou moi ? » {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  es: "Juha vende encurtidos con un burro que conoce las casas que compran, y el burro rebuzna por encima de sus pregones. En un callejón concurrido Juha dice al burro: «¿Tú vendes los encurtidos o yo?». {cite:juha-nawadir-kubra-djuwaydi p. 125}"
