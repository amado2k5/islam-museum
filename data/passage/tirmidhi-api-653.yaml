label: { ar: "جامع الترمذي 653 — ما لا يحل", en: "Jami' al-Tirmidhi 653 — what is not lawful", ur: "جامع ترمذی 653 — جو حلال نہیں", es: "Jami' al-Tirmidhi 653 — lo que no es lícito", fr: "Jami' al-Tirmidhi 653 — ce qui n'est pas licite" }
text: "… أَعْرَابِيٌّ فَأَخَذَ بِطَرَفِ رِدَائِهِ فَسَأَلَهُ إِيَّاهُ فَأَعْطَاهُ وَذَهَبَ فَعِنْدَ ذَلِكَ حَرُمَتِ الْمَسْأَلَةُ فَقَالَ رَسُولُ اللَّهِ \" إِنَّ الْمَسْأَلَةَ لاَ تَحِلُّ لِغَنِيٍّ وَلاَ لِذِي مِرَّةٍ سَوِيٍّ إِلاَّ لِذِي فَقْرٍ مُدْقِعٍ أَوْ غُرْمٍ مُفْظِعٍ وَمَنْ سَأَلَ النَّاسَ لِيُثْرِيَ بِهِ مَالَهُ كَانَ خُمُوشًا فِي وَجْهِهِ يَوْمَ الْقِيَامَةِ وَرَضْفًا يَأْكُلُهُ مِنْ جَهَنَّمَ فَمَنْ شَاءَ فَلْيُقِلَّ وَمَنْ شَاءَ فَلْيُكْثِرْ \"."
summary:
  ar: "حديث في جامع الترمذي، رقم 653، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 653 (The Book on Zakat), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 653، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 653 (El Libro del Zakat), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 653 (Le Livre de la Zakat), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
