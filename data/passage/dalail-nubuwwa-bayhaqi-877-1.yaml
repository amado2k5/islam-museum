text: "محمد رسول الله إلى النجاشي الأصحم عظيم الحبشة سلام على من اتبع الهدى وآمن بالله ورسوله وشهد أن لا إله إلا الله وحده لا شريك له لم يتخذ صاحبة ولا ولدا وأن محمدا عبده ورسوله وأدعوك بدعاية الله ⁦(٥٩)⁩ فإني أنا رسوله"
