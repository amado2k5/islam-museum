label: { ar: "الموطأ 1842 — مالك: الأمر المجتمع عليه أن من ابتاع فاكهة رطبا أو يابسا لا يبيعها حتى يستوفيها، ولا يباع بعضها ببعض إلا يدا بيد، وإن اختلف صنفاها فلا بأس باثنين بواحد يدا بيد، ولا يصلح إلى أجل", en: "Muwatta 1842", es: "Muwatta 1842", fr: "Muwatta 1842", ur: "موطا 1842", tr: "El-Muvatta 1842 — Malik: İttihat şudur ki, taze veya kuru meyve alan kimse, onu teslim almadan satmamalıdır ve bir kısmını başka bir meyveyle takas etmemelidir, ancak elden ele takas edilebilir. İki tür farklıysa, elden ele takas edilmesinde bir sakınca yoktur ve verasetle satmak caiz değildir.", id: "Al-Muwatta 1842 — Malik: Konsensusnya adalah bahwa siapa pun yang membeli buah segar atau kering tidak boleh menjualnya sebelum ia menerimanya, dan sebagian darinya tidak boleh dijual untuk ditukar dengan buah lain kecuali secara langsung. Jika kedua jenis buah tersebut berbeda, maka tidak ada salahnya jika dua buah ditukar dengan satu buah secara langsung, dan tidak diperbolehkan menjual secara kredit." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن من ابتاع شيئا من الفاكهة، من رطبها أو يابسها، فإنه لا يبيعه حتى يستوفيه، ولا يباع شيء منها بعضه ببعض إلا يدا بيد. وما كان منها مما ييبس، فيصير فاكهة يابسة تدخر وتؤكل، فلا يباع بعضه ببعض إلا يدا بيد، ومثلا بمثل، إذا كان من صنف واحد. فإن كان من صنفين مختلفين فلا بأس بأن يبتاع اثنان بواحد يدا بيد، ولا يصلح إلى أجل. وما كان مما لا ييبس ولا يدخر وإنما يؤكل رطبا، كهيئة البطيخ والقثاء والخربز والجزر والأترج والموز والرمان. {cite:muwatta-maruf-1997 p.156}"
  tr: "Malik şöyle dedi: Bizde yerleşik uygulama şudur ki, taze veya kuru meyve alan kimse, onu teslim almadan satamaz. Ayrıca, elden ele satış dışında hiçbir meyve başkasıyla takas edilemez. Kuruyup saklanabilen ve yenebilen meyvelere gelince, bunlar elden ele satış dışında ve eşit miktarda takas edilemez, eğer aynı türden iseler. İki farklı türden iseler, elden ele iki meyveyi bir fiyatına almak caizdir, ancak bu krediyle caiz değildir. Kurumayan, saklanmayan, taze olarak tüketilen meyvelere gelince, örneğin kavun, salatalık, kavun, havuç, turunç, muz ve nar gibi..."
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah bahwa siapa pun yang membeli buah, baik segar maupun kering, tidak boleh menjualnya sebelum ia memilikinya. Lebih lanjut, buah tidak boleh dijual dengan harga satu kecuali secara langsung. Adapun buah-buahan yang mengering dan menjadi buah kering yang dapat disimpan dan dimakan, buah-buahan tersebut tidak boleh dijual dengan harga satu kecuali secara langsung, dan dalam jumlah yang sama, jika jenisnya sama. Jika jenisnya berbeda, diperbolehkan membeli dua dengan harga satu secara langsung, tetapi ini tidak diperbolehkan secara kredit. Adapun buah-buahan yang tidak mengering atau disimpan tetapi dimakan segar, seperti melon, mentimun, blewah, wortel, jeruk nipis, pisang, dan delima..."
