label: { ar: "الموطأ 1842 — مالك: الأمر المجتمع عليه أن من ابتاع فاكهة رطبا أو يابسا لا يبيعها حتى يستوفيها، ولا يباع بعضها ببعض إلا يدا بيد، وإن اختلف صنفاها فلا بأس باثنين بواحد يدا بيد، ولا يصلح إلى أجل", en: "Muwatta 1842" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن من ابتاع شيئا من الفاكهة، من رطبها أو يابسها، فإنه لا يبيعه حتى يستوفيه، ولا يباع شيء منها بعضه ببعض إلا يدا بيد. وما كان منها مما ييبس، فيصير فاكهة يابسة تدخر وتؤكل، فلا يباع بعضه ببعض إلا يدا بيد، ومثلا بمثل، إذا كان من صنف واحد. فإن كان من صنفين مختلفين فلا بأس بأن يبتاع اثنان بواحد يدا بيد، ولا يصلح إلى أجل. وما كان مما لا ييبس ولا يدخر وإنما يؤكل رطبا، كهيئة البطيخ والقثاء والخربز والجزر والأترج والموز والرمان. {cite:muwatta-maruf-1997 p.156}"
