text: "… ، فلمّا انتهى إليهما قام على العَريشَيْن فقال : سبحان الله! رسول اللّٰه قد غُفر له ما تقدَّم من ذنبه وما تأَخَّر فى الضِّحّ١ والريح والحرّ ، يحمل سلاحه على عُنُقه ، وأَبو خَيْشَمة فى ظالالٍ باردٍ وطعامٍ مُهيَّباً وامرأتَيْن …"
summary:
