summary:
  ar: "القسم 6 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «أبواب السفر»، ويضم فيها النصوص من 544 إلى 616 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 6 of Jami' al-Tirmidhi (The Book on Traveling) in the division of the open hadith dataset the museum took its reports from: reports 544 to 616 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 6، عنوان «ابواب السفر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 544 تا 616۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 6 de Jami' al-Tirmidhi (El Libro de los Viajes) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 544 al 616, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 6 de Jami' al-Tirmidhi (Le Livre du Voyage), dans la section du recueil ouvert de hadiths d'où proviennent les récits: les hadiths 544 à 616 de cette section. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 6. bölümü \"Seyahat Bölümleri\" başlığını taşımakta olup, 544 ila 616 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 6 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Bab tentang Perjalanan\" dan berisi teks 544 hingga 616, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
