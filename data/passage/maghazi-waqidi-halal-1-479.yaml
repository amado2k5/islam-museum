text: "… أَمرًا ظاهرًا. واللهِ، لقد كان أَحبار يهود خَيْبَر وإنهم يُحدّثون أَنهم يجدون فى كُتُبهم أَنه يُبعَث نبيٌّ من الحَرَم على صفته. قال عُيَينَة : إنا واللهِ ما جئنا ننصر قُريْشاً، ولو استنصرنا قُرَيشاً ما نصرتنا ولا خَرَجَتْ معنا مِن حَرَمها. …"
