text: "… وأسلم الهُرْمزان، وفرض له عمر، وأقام بالمدينة. وفيها هلك هِرَقْلُ عظيم الروم، وهو الذي كتب إليه النّبي ي دعوه إلى الإسلام، وقام بعده ابنُه يُسْطَنْطِين. وفيها قسَّم عمر خَيْبَرَ وأجلى عنها اليهود، وقسّم وادي القُرَى، وأجلى يهود نَجْران إلى الكوفة. …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 200، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 200, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 200 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Tarikh al-Islam de al-Dhahabi, volumen 6, pág. 200, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 6, page 200 (numérisé), mentionnant des nations, des religions et des peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est référencé sur Umam Browser."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 6. cildinin 200. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
