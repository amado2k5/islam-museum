text: "السيرة لابن هشام ذكْرُ الإسْرَاء وَالْمغْرَاج ويتركون السَّمين الطيّبَ، قال: قلتُ: مَن هؤلاءِ يا جبريلُ؟ قال: هؤلاءِ الذين يتركون ما أحلَّ اللّٰه لهم مِنَ النِّساء ويذهبون إلى ما حرَّم اللَّهُ عليهم منهن. صفة النساء اللاتي يُدخلن على الأزواج ما ليس …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 187، يذكر ما أُحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
