text: "… يبعث معاذ بن جبل إلى المن، ركب معاذ رض اللّٰه تعالى عنه ورسول اللّٰه يمشى إلى جانبه يوصيه. فقال : يامعاذ أوصيك وصية الأخ الشفيق، أوصيك بتقوى اللّٰه فذكر نحوه وزاد : وعد المريض وأسرع فى حوامج الأرامل والضعفاء، وجالس …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 241، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 241, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 241 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
