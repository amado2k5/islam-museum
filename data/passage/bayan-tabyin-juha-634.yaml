text: "… شعر كُثَيِّرٍ عندى كما بصفُ النّاس. فقال له أبوه : إنك لم تَضَع كُثيِّراً بهذا، إنّما تضَع بهذا نَفْسَك. قال : وأنشد رجل عمر بن الخطاب،، قولَ طرَفة : فلولا ثلاثٌ هُنَّ من عِيشة الفَتَى وجدِّك لم أُحفِل متى قام …"
