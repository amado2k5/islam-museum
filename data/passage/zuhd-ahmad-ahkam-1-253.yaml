text: "… صبر الإنسان على ما يقصد هلاكه من سبع أو حية أو حريق أو كافر يريد قتله، بخلاف استلامه، وصبره في الفتنة وقتال المسلمين فإنه مباح له بل يستحب كما دلت عليه النصوص الكثيرة. والمكروه : صبره على المكروه وصبره عن …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 253، يرد فيه ذكر المستحب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 253, whose wording mentions the recommended (mustahabb), the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 253 کا اقتباس جس میں مستحب، مکروہ، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ahmad ibn Hanbal, volume numérisé 1, p. 253, dont le texte mentionne le recommandé (mustahabb), le réprouvé (makruh), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Zuhd de Ahmad ibn Hanbal, volumen digitalizado 1, p. 253, cuyo texto menciona lo recomendado (mustahabb), lo reprobado (makruh), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zühd) adlı eserinin 1. cildinin 253. sayfasından, tavsiye edilen, mekruh edilen ve caiz olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. Zorunlu ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 1, halaman 253, yang menyebutkan amalan yang dianjurkan, yang tidak disukai, dan yang diperbolehkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
