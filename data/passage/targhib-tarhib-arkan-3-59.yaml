text: "… ما الاسلام قال لا تشرك بالله شيئا وتقيم الصلاة وتؤتى الزكاة وتصوم رمضان قال صدقت قال يارسول الله ما الا يمان قال ان تؤمن بالله وملائكته وكتابه ورسله وتؤمن بالبعث الآخر وتؤمن بالقدر كله قال صدقت قال يا رسول الله …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 3، ص 59، يذكر تعريف الإسلام بأعماله، والإيمان بالله وملائكته وكتبه ورسله، والإيمان بالقدر، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 3, p. 59, that mentions Islam defined by its acts, belief in God, His angels, His books and His messengers, belief in the decree, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 3، ص 59 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، تقدیر پر ایمان، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
