label: { ar: "الموطأ 72 — استقيموا ولن تحصوا، ولا يحافظ على الوضوء إلا مؤمن", en: "Muwatta 72" }
text: "استقيموا ولن تحصوا، واعملوا وخير أعمالكم الصلاة، ولا يحافظ على الوضوء إلا مؤمن"
summary:
  ar: "بلاغ في باب جامع الوضوء: يروي مالك أنه بلغه أن النبي أمر بالاستقامة مع التنبيه إلى أن الإحاطة بالأعمال لا تُطاق، وجعل الصلاة خير الأعمال، وأخبر أن المحافظة على الوضوء من علامة الإيمان. ويشرح المحقق «استقيموا ولن تحصوا» بأن لا يميلوا عما سُن لهم مع أنهم لن يطيقوا الإحاطة في الأعمال، ويذكر أن أبا مصعب رواه عن مالك كذلك، وأن البلاغ يتصل مسنداً من حديث ثوبان عند الطيالسي وأحمد (5/276) والدارمي وابن ماجه (277) وابن حبان (1037) والحاكم، ومن حديث عبد الله بن عمرو بن العاص عند ابن ماجه (278)، وأن متن الحديث صحيح. {cite:muwatta-maruf-1997 p.73}"
