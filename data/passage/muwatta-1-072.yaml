label: { ar: "الموطأ 72 — استقيموا ولن تحصوا، ولا يحافظ على الوضوء إلا مؤمن", en: "Muwatta 72", es: "Muwatta 72", fr: "Muwatta 72", ur: "موطا 72", tr: "El-Muvatta 72 — Sabredin, o zaman [nimetleri] sayamazsınız; abdesti ancak müminler korur.", id: "Al-Muwatta 72 — Berteguhlah dan kamu tidak akan dapat menghitung [keberkahan-keberkahan], dan tidak ada seorang pun yang berwudhu kecuali orang yang beriman." }
text: "استقيموا ولن تحصوا، واعملوا وخير أعمالكم الصلاة، ولا يحافظ على الوضوء إلا مؤمن"
summary:
  ar: "بلاغ في باب جامع الوضوء: يروي مالك أنه بلغه أن النبي أمر بالاستقامة مع التنبيه إلى أن الإحاطة بالأعمال لا تُطاق، وجعل الصلاة خير الأعمال، وأخبر أن المحافظة على الوضوء من علامة الإيمان. ويشرح المحقق «استقيموا ولن تحصوا» بأن لا يميلوا عما سُن لهم مع أنهم لن يطيقوا الإحاطة في الأعمال، ويذكر أن أبا مصعب رواه عن مالك كذلك، وأن البلاغ يتصل مسنداً من حديث ثوبان عند الطيالسي وأحمد (5/276) والدارمي وابن ماجه (277) وابن حبان (1037) والحاكم، ومن حديث عبد الله بن عمرو بن العاص عند ابن ماجه (278)، وأن متن الحديث صحيح. {cite:muwatta-maruf-1997 p.73}"
  tr: "Abdest bölümüyle ilgili bir rivayet: Malik, Peygamberimizin sebat etmeyi emrettiğini, ancak tüm amelleri kapsamanın imkansız olduğunu belirttiğini naklettiğini anlatır. Namazı en faziletli amel olarak ilan etmiş ve abdestin bir işaret olduğunu söylemiştir. Araştırmacı, \"Sebat et, tüm amelleri kapsayamazsın\" ifadesini, tüm amelleri kapsayamasalar bile, kendileri için farz kılınan şeyden sapmamaları gerektiği şeklinde açıklar. Ebu Mus'ab'ın da bunu Malik'ten naklettiğini ve rivayetin, el-Tayalisi, Ahmed (5/276), el-Darimi, İbn Majah (277), İbn Hibban (1037) ve el-Hakim'in derlemelerinde Sevban'dan ve İbn Majah'ın derlemesinde (278) Abdullah ibn Amr ibn el-As'tan rivayet zinciriyle bağlantılı olduğunu belirtir. Hadisin metni sahihtir. {cite:muwatta-maruf-1997 s.73}"
  id: "Sebuah laporan mengenai bab tentang wudhu: Malik meriwayatkan bahwa ia mendengar Nabi memerintahkan keteguhan hati, sambil menunjukkan bahwa mencakup semua amal perbuatan adalah tidak mungkin. Beliau menyatakan shalat sebagai amal perbuatan terbaik dan menyatakan bahwa menjaga wudhu adalah tanda keimanan. Peneliti menjelaskan ungkapan \"Teguhlah, dan kamu tidak akan mampu mencakup semua amal perbuatan\" sebagai berarti bahwa mereka tidak boleh menyimpang dari apa yang telah ditetapkan bagi mereka, meskipun mereka tidak dapat mencakup semua amal perbuatan. Ia menyebutkan bahwa Abu Mus'ab juga meriwayatkannya dari Malik, dan bahwa riwayat tersebut terhubung melalui rantai periwayatan dari Thawban dalam koleksi al-Tayalisi, Ahmad (5/276), al-Darimi, Ibn Majah (277), Ibn Hibban (1037), dan al-Hakim, dan dari Abdullah ibn Amr ibn al-As dalam koleksi Ibn Majah (278). Teks hadits tersebut sahih. {cite:muwatta-maruf-1997 p.73}"
