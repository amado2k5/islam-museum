summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يكره الأخصاء، ويقول: فيه تمام الخلق. {cite:muwatta-maruf-1997 p.537}"
  tr: "Malik, Abdullah ibn Umar'dan rivayetle Nafi'den naklederek hadım etmeyi sevmediğini ve \"Bu, yaratılışın mükemmelliğidir\" dediğini aktarır. {cite:muwatta-maruf-1997 s.537}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa beliau tidak menyukai pengebirian, dan beliau berkata: “Itu adalah kesempurnaan ciptaan.” {cite:muwatta-maruf-1997 p.537}"
