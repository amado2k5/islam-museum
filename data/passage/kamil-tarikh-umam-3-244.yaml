text: "… أهبطه اللّٰه فيها هي التي تدخن فيها النصارى. وتعدى اليهود على بقية الحواريين يعذبونهم ويشتمونهم، فسمع بذلك ملك الروم، واسمه هيردوس، وكانوا تحت يده، وكان صاحب وثن، فقيل له: إن رجلاً كان في بني إسرائيل وكان يفعل الآيات من إحياء …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 244، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 3, p. 244, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 3، ص 244 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
