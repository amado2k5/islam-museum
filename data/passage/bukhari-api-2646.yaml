label: { ar: "صحيح البخاري 2646 — ما حُرّم", en: "Sahih al-Bukhari 2646 — what was made unlawful", ur: "صحیح بخاری 2646 — جو حرام کیا گیا", es: "Sahih al-Bukhari 2646 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 2646 — ce qui a été déclaré illicite" }
text: "… اللَّهِ أُرَاهُ فُلاَنًا. لِعَمِّ حَفْصَةَ مِنَ الرَّضَاعَةِ. فَقَالَتْ عَائِشَةُ يَا رَسُولَ اللَّهِ، هَذَا رَجُلٌ يَسْتَأْذِنُ فِي بَيْتِكَ. قَالَتْ فَقَالَ رَسُولُ اللَّهِ \" أُرَاهُ فُلاَنًا \". لِعَمِّ حَفْصَةَ مِنَ الرَّضَاعَةِ. فَقَالَتْ عَائِشَةُ لَوْ كَانَ فُلاَنٌ حَيًّا ـ لِعَمِّهَا مِنَ الرَّضَاعَةِ ـ دَخَلَ عَلَىَّ فَقَالَ رَسُولُ اللَّهِ \" نَعَمْ، إِنَّ الرَّضَاعَةَ تُحَرِّمُ مَا يَحْرُمُ مِنَ الْوِلاَدَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2646، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 2646 (Witnesses), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 2646، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 2646 (Testigos), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 2646 (Témoins), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
