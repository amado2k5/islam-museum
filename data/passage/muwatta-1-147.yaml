label: { ar: "الموطأ 147 — عائشة تحيض وهي مضطجعة مع النبي: شدي عليك إزارك", en: "Muwatta 147" }
text: "مالك؟ لعلك نفست؟ فقالت: نعم. قال: شدي على نفسك إزارك ثم عودي إلى مضجعك"
summary:
  ar: "يرويه مالك عن ربيعة بن أبي عبد الرحمن مرسلاً، في باب ما يحل للرجل من امرأته وهي حائض: كانت عائشة مضطجعة مع النبي في ثوب واحد فوثبت وثبة شديدة، فسألها: مالك؟ لعلك نفست؟ يعني الحيضة، فقالت: نعم، فأمرها أن تشد على نفسها إزارها وتعود إلى مضجعها. وينقل المحقق عن ابن عبد البر أنه في الموطأ منقطع لم يختلف رواته في إرساله، وأن معناه يتصل من حديث أم سلمة في الصحيحين، وأنه لا يعلمه روي من حديث عائشة بهذا اللفظ (التمهيد 3/162). {cite:muwatta-maruf-1997 p.103}"
