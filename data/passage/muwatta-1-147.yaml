label: { ar: "الموطأ 147 — عائشة تحيض وهي مضطجعة مع النبي: شدي عليك إزارك", en: "Muwatta 147", es: "Muwatta 147", fr: "Muwatta 147", ur: "موطا 147", tr: "Al-Muwatta 147 — Aişe, Peygamberle yatarken adet gördü: Belindeki örtüyü sıkılaştır.", id: "Al-Muwatta 147 — Aisyah mengalami haid saat berbaring bersama Nabi: Kencangkan kain pinggangmu" }
text: "مالك؟ لعلك نفست؟ فقالت: نعم. قال: شدي على نفسك إزارك ثم عودي إلى مضجعك"
summary:
  ar: "يرويه مالك عن ربيعة بن أبي عبد الرحمن مرسلاً، في باب ما يحل للرجل من امرأته وهي حائض: كانت عائشة مضطجعة مع النبي في ثوب واحد فوثبت وثبة شديدة، فسألها: مالك؟ لعلك نفست؟ يعني الحيضة، فقالت: نعم، فأمرها أن تشد على نفسها إزارها وتعود إلى مضجعها. وينقل المحقق عن ابن عبد البر أنه في الموطأ منقطع لم يختلف رواته في إرساله، وأن معناه يتصل من حديث أم سلمة في الصحيحين، وأنه لا يعلمه روي من حديث عائشة بهذا اللفظ ⁦(التمهيد 3/162)⁩. {cite:muwatta-maruf-1997 p.103}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman'dan rivayetle, mursal bir hadiste, bir erkeğin eşiyle adetliyken yapması caiz olan şeyler bölümünde şöyle aktarır: Aişe, Peygamberimizle tek bir elbise içinde yatarken aniden ayağa kalktı. Peygamberimiz ona, \"Ne oldu? Belki adet görmeye başladın?\" diye sordu. Aişe, \"Evet\" diye cevap verdi. Bunun üzerine Peygamberimiz ona elbisesini sıkılaştırmasını ve yatağına dönmesini söyledi. Araştırmacı, İbn 'Abd al-Barr'ın, bu hadisin Muvatta'da kırık bir isnad zinciriyle bulunduğunu ve ravilerinin mursal olduğu konusunda hemfikir olduğunu söylediğini aktarıyor. Ayrıca, anlamının iki Sahih'te geçen Ümmü Seleme hadisiyle bağlantılı olduğunu ve bu şekilde Aişe'den rivayet edildiğini bilmediğini ekliyor (el-Tamhid 3/162). {cite:muwatta-maruf-1997 s.103}"
  id: "Malik meriwayatkannya dari Rabi'ah ibn Abi 'Abd al-Rahman, dalam hadits mursal, dalam surah tentang apa yang diperbolehkan bagi seorang pria dengan istrinya ketika istrinya sedang haid: Aisyah sedang berbaring bersama Nabi dengan satu pakaian ketika tiba-tiba ia terbangun. Nabi bertanya kepadanya, \"Ada apa? Mungkin kamu sedang haid?\" Ia menjawab, \"Ya.\" Maka Nabi menyuruhnya untuk mengencangkan pakaiannya dan kembali ke tempat tidurnya. Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa hadits ini terdapat dalam al-Muwatta' dengan sanad yang terputus, dan para perawinya tidak berbeda pendapat mengenai apakah hadits ini mursal atau tidak. Ia menambahkan bahwa maknanya terkait dengan hadits Umm Salamah dalam dua kitab Sahih, dan ia tidak mengetahui adanya riwayat hadits ini dari Aisyah dengan redaksi seperti ini (al-Tamhid 3/162). {cite:muwatta-maruf-1997 p.103}"
