label:
  ar: "الترمذي 1021 — إذا مات ولد العبد: ابنوا لعبدي بيتا في الجنة وسموه بيت الحمد"
  en: "Tirmidhi 1021 — When a servant's child dies: build My servant a house in Paradise, the House of Praise"
  ur: "ترمذی 1021 — جب بندے کا بچہ فوت ہو: میرے بندے کے لیے جنت میں گھر بناؤ اور اسے بیت الحمد کہو"
text: "إذا مات ولد العبد قال الله لملائكته قبضتم ولد عبدي . فيقولون نعم . فيقول قبضتم ثمرة فؤاده . فيقولون نعم . فيقول ماذا قال عبدي فيقولون حمدك واسترجع . فيقول الله ابنوا لعبدي بيتا في الجنة وسموه بيت الحمد …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 1021: إذا مات ولد العبد: ابنوا لعبدي بيتا في الجنة وسموه بيت الحمد. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 1021: When a servant's child dies: build My servant a house in Paradise, the House of Praise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 1021: جب بندے کا بچہ فوت ہو: میرے بندے کے لیے جنت میں گھر بناؤ اور اسے بیت الحمد کہو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
