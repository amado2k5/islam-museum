label:
  ar: "الترمذي 1021 — إذا مات ولد العبد: ابنوا لعبدي بيتا في الجنة وسموه بيت الحمد"
  en: "Tirmidhi 1021 — When a servant's child dies: build My servant a house in Paradise, the House of Praise"
  ur: "ترمذی 1021 — جب بندے کا بچہ فوت ہو: میرے بندے کے لیے جنت میں گھر بناؤ اور اسے بیت الحمد کہو"
  es: "Tirmidhi 1021 — Cuando muere el hijo de un siervo: construye a Mi siervo una casa en el Paraíso, la Casa de la Alabanza."
  fr: "Tirmidhi 1021 — Quand meurt l'enfant d'un serviteur: construisez à Mon serviteur une maison au Paradis, la Maison de la Louange."
  tr: "Tirmizi 1021 — Bir kulun çocuğu ölürse: Kulum için cennette bir ev inşa et ve ona Övgü Evi adını ver."
  id: "Tirmidzi 1021 — Jika anak seorang hamba meninggal: Bangunkanlah bagi hamba-Ku sebuah rumah di Surga dan namakanlah itu Rumah Pujian."
text: "إذا مات ولد العبد قال الله لملائكته قبضتم ولد عبدي . فيقولون نعم . فيقول قبضتم ثمرة فؤاده . فيقولون نعم . فيقول ماذا قال عبدي فيقولون حمدك واسترجع . فيقول الله ابنوا لعبدي بيتا في الجنة وسموه بيت الحمد …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 1021: إذا مات ولد العبد: ابنوا لعبدي بيتا في الجنة وسموه بيت الحمد. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 1021: When a servant's child dies: build My servant a house in Paradise, the House of Praise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 1021: جب بندے کا بچہ فوت ہو: میرے بندے کے لیے جنت میں گھر بناؤ اور اسے بیت الحمد کہو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 1021: Cuando muere el hijo de un siervo: construyed a Mi siervo una casa en el Paraíso, la Casa de la Alabanza. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 1021: « Quand l’enfant d’un serviteur meurt: construisez à Mon serviteur une demeure au Paradis, la Maison de la Louange. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 1021: \"Jika anak seorang hamba meninggal, bangunkanlah bagi hamba-Ku sebuah rumah di Surga dan namakanlah itu Rumah Pujian.\" Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta'."
