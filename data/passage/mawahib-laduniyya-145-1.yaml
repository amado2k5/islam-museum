  fr: "Un extrait de l'ouvrage d'al-Qastallani, al-Mawahib al-Laduniyya, dans la correspondance avec al-Mundhir ibn Sawa, tiré de la copie extraite; cité en quarante mots conformément à la politique des sources."
  ur: "قسطلانی کی المواحب الدونیہ سے ایک اقتباس، المنذر ابن ساوا کے ساتھ خط و کتابت میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "Al-Mundhir ibn Sawa'nın yazışmalarında kabul için sunulan \"İlahi Armağanlar\"dan bir alıntı; kaynakların politikasına göre metin yaklaşık kırk kelimeyle aktarılmıştır."
