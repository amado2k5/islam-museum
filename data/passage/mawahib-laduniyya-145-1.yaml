text: "حمد رسول الله إلى المنذر بن ساوى، سلام عليك فإني أحمد إليك الله الذي لا إله إلا هو، وأشهد أن لا إله إلا الله وأن محمدا رسول الله . أما بعد، فإني أذكرك الله عز وجل، فإنه من ينصح فإنما ينصح لنفسه"
summary:
  ar: "مقطع من المواهب اللدنية للقبول، في مراسلات المنذر بن ساوى، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Qastallani's al-Mawahib al-Laduniyya, in the correspondence with al-Mundhir ibn Sawa, from the extracted copy; quoted within forty words per the sources policy."
