label: { ar: "الموطأ 2733 — عبد الرحمن بن الأسود بن عبد يغوث: صبغ شعره بالحمرة بأمر من عائشة", en: "Muwatta 2733", es: "Muwatta 2733", fr: "Muwatta 2733", ur: "موطا 2733", tr: "El-Muvatta 2733 — Abdülrahman ibn el-Esved ibn Abd Yaghuth: Ayşe'nin emriyle saçlarını kırmızıya boyadı.", id: "Al-Muwatta 2733 — Abd al-Rahman ibn al-Aswad ibn Abd Yaghuth: Dia mewarnai rambutnya menjadi merah atas perintah Aisyah" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه أخبره محمد بن إبراهيم التيمي عن أبي سلمة بن عبد الرحمن أن عبد الرحمن بن الأسود بن عبد يغوث، وكان أبيض اللحية والرأس، غدا عليهم ذات يوم وقد حمّرهما. فقال له القوم: هذا أحسن. فقال: إن أمي عائشة زوج النبي أرسلت إليّ البارحة جاريتها نخيلة، فأقسمت علي لأصبغن، وأخبرتني أن أبا بكر الصديق كان يصبغ. {cite:muwatta-maruf-1997 p.539}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Muhammed ibn İbrahim el-Taymi'nin kendisine, Ebu Salama ibn Abd el-Rahman'dan naklederek, beyaz sakallı ve saçlı Abd el-Rahman ibn el-Aswad ibn Abd Yaghuth'un bir gün saçlarını kırmızıya boyayarak yanlarına geldiğini anlattığını aktarır. İnsanlar ona, \"Bu daha güzel görünüyor\" demişler. O da, \"Annem Ayşe, Peygamberimizin eşi, dün gece cariyesi Nakhila'yı bana gönderdi ve saçlarımı boyayacağıma yemin ettirdi. Bana Ebu Bekir el-Siddik'in de saçlarını boyadığını söyledi\" diye cevap verdi. {cite:muwatta-maruf-1997 s.539}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Muhammad ibn Ibrahim al-Taymi memberitahunya, dari Abu Salama ibn Abd al-Rahman, bahwa Abd al-Rahman ibn al-Aswad ibn Abd Yaghuth, yang berjanggut dan berkepala putih, datang kepada mereka suatu hari setelah mewarnai rambutnya menjadi merah. Orang-orang berkata kepadanya, \"Ini terlihat lebih baik.\" Dia menjawab, \"Ibuku, Aisyah, istri Nabi, mengirimkan pelayannya, Nakhila, kepadaku tadi malam, dan dia menyuruhku bersumpah untuk mewarnai rambutku, dan dia memberitahuku bahwa Abu Bakr al-Siddiq biasa mewarnai rambutnya.\" {cite:muwatta-maruf-1997 p.539}"
