label: { ar: "الموطأ 2733 — عبد الرحمن بن الأسود بن عبد يغوث: صبغ شعره بالحمرة بأمر من عائشة", en: "Muwatta 2733" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه أخبره محمد بن إبراهيم التيمي عن أبي سلمة بن عبد الرحمن أن عبد الرحمن بن الأسود بن عبد يغوث، وكان أبيض اللحية والرأس، غدا عليهم ذات يوم وقد حمّرهما. فقال له القوم: هذا أحسن. فقال: إن أمي عائشة زوج النبي أرسلت إليّ البارحة جاريتها نخيلة، فأقسمت علي لأصبغن، وأخبرتني أن أبا بكر الصديق كان يصبغ. {cite:muwatta-maruf-1997 p.539}"
