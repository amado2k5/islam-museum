label: { ar: "صحيح البخاري 5030 — النسب والانتساب", en: "Sahih al-Bukhari 5030 — paternity and lineage", ur: "صحیح بخاری 5030 — نسب اور انتساب", es: "Sahih al-Bukhari 5030 — paternidad y linaje", fr: "Sahih al-Bukhari 5030 — paternité et lignée" }
text: "… يَكُنْ عَلَيْكَ شَىْءٌ \". فَجَلَسَ الرَّجُلُ حَتَّى طَالَ مَجْلِسُهُ ثُمَّ قَامَ فَرَآهُ رَسُولُ اللَّهِ مُوَلِّيًا فَأَمَرَ بِهِ فَدُعِيَ فَلَمَّا جَاءَ قَالَ \" مَاذَا مَعَكَ مِنَ الْقُرْآنِ \". قَالَ مَعِي سُورَةُ كَذَا وَسُورَةُ كَذَا وَسُورَةُ كَذَا عَدَّهَا قَالَ \" أَتَقْرَؤُهُنَّ عَنْ ظَهْرِ قَلْبِكَ \". قَالَ نَعَمْ. قَالَ \" اذْهَبْ فَقَدْ مَلَّكْتُكَهَا بِمَا مَعَكَ مِنَ الْقُرْآنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5030، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5030 (Virtues of the Qur'an), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5030، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5030 (Virtudes del Corán), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5030 (Vertus du Coran), mentionne la paternité et la filiation. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
