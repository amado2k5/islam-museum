summary:
  ar: "القسم 28 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب جزاء الصيد»، ويضم فيها النصوص من 1821 إلى 1866 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 28 of Sahih al-Bukhari (Penalty of Hunting while on Pilgrimage) in the division of the open hadith dataset the museum took its reports from: reports 1821 to 1866 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 28، عنوان «کتاب جزاء الصید»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1821 تا 1866۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 28 de Sahih al-Bukhari (Castigo de la caza durante la peregrinación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1821 al 1866, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du recueil de hadiths Sahih al-Bukhari, dans son livre 28 (La peine pour avoir chassé en pèlerinage), qui comprend les hadiths 1821 à 1866. Il conserve ces hadiths sous ce livre; les éditions imprimées les classent et les numérotent différemment."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 28. bölümü \"Avlanmanın Cezaları Kitabı\" başlığını taşımakta olup, 1821'den 1866'ya kadar olan metinleri buna göre numaralandırarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 28 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Hukuman untuk Berburu\" dan berisi teks-teks dari tahun 1821 hingga 1866, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
