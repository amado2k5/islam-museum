label: { ar: "صحيح البخاري 1735 — ما لا حرج فيه", en: "Sahih al-Bukhari 1735 — what carries no blame", ur: "صحیح بخاری 1735 — جس میں کوئی حرج نہیں", fr: "Sahih al-Bukhari 1735 — ce qui n'entraîne aucun blâme", es: "Sahih al-Bujari 1735 — lo que no acarrea reproche", tr: "Sahih el-Buhari 1735 — Neler caizdir?", id: "Sahih al-Bukhari 1735 — Apa yang diperbolehkan" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا خَالِدٌ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ كَانَ النَّبِيُّ يُسْأَلُ يَوْمَ النَّحْرِ بِمِنًى، فَيَقُولُ \" لاَ حَرَجَ \". فَسَأَلَهُ رَجُلٌ، فَقَالَ حَلَقْتُ قَبْلَ أَنْ أَذْبَحَ. قَالَ \" اذْبَحْ، وَلاَ حَرَجَ \". وَقَالَ رَمَيْتُ بَعْدَ مَا أَمْسَيْتُ. فَقَالَ \" لاَ حَرَجَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1735، يرد فيه ذكر ما لا حرج فيه. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 1735 (Hajj (Pilgrimage)), whose wording mentions what carries no blame. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 1735، جس کے الفاظ میں جس میں کوئی حرج نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 1735, dont le texte mentionne ce qui n'entraîne aucun blâme. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 1735, cuyo texto menciona lo que no acarrea reproche. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Buhari'nin 1735 numaralı hadisinde, caiz olan hususlardan bahsedilir. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini tanımlar ancak buna dayanarak dini bir hüküm vermez."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1735, menyebutkan hal-hal yang diperbolehkan. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
