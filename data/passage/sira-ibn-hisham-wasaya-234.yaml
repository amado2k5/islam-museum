text: "… الذي ليس له خطير ولا نظير من العباد، وعليّ بن أبي طالب هه، أخَوَيْن. وكان حَمْزَةُ بْنُ عبد المطلب، أسَدُ اللّٰه وأسَدُ رَسُولِهِ وَل في وعَمُّ رَسُولِ اللّٰه وَفِيِ؛ وَزَيْدُ بن حارثة، مَوْلَى رَسُولِ اللّٰه وَلَلفم أخَوَيْنِ، وإِليه أوصى حمزةُ …"
