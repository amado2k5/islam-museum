text: "… باذان بن ساسان، من ولد بهرام جور، أمَّره رسول اللَّه عي على أهل اليمن كلُّها بعد موت كسرى، فهو أولُ أمير في الإسلام على اليمن، وأولُ مَنْ أسلم من ملوك العجم. ثم أمَّر رسولُ اللَّه وَف بعد موت باذان ابنه …"
