label: { ar: "سنن أبي داود 2110 — استحلال الشيء", en: "Sunan Abi Dawud 2110 — treating a thing as lawful", ur: "سنن ابی داؤد 2110 — کسی چیز کو حلال ٹھہرانا", es: "Sunan Abi Dawud 2110 — tratar algo como lícito", fr: "Sunan Abi Dawud 2110 — considérer une chose comme licite", tr: "Sünen Ebu Davud 2110 — Bir şeyi mubah kılmak", id: "Sunan Abi Dawud 2110 — Menghalalkan sesuatu" }
text: "… بْنِ عَبْدِ اللَّهِ، أَنَّ النَّبِيَّ قَالَ \" مَنْ أَعْطَى فِي صَدَاقِ امْرَأَةٍ مِلْءَ كَفَّيْهِ سَوِيقًا أَوْ تَمْرًا فَقَدِ اسْتَحَلَّ \". قَالَ أَبُو دَاوُدَ رَوَاهُ عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ عَنْ صَالِحِ بْنِ رُومَانَ عَنْ أَبِي الزُّبَيْرِ عَنْ جَابِرٍ مَوْقُوفًا وَرَوَاهُ أَبُو عَاصِمٍ عَنْ صَالِحِ بْنِ رُومَانَ عَنْ أَبِي الزُّبَيْرِ عَنْ جَابِرٍ قَالَ كُنَّا عَلَى عَهْدِ رَسُولِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2110، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2110 (Marriage (Kitab Al-Nikah)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2110، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 2110 (Matrimonio (Kitab Al-Nikah)), menciona la consideración de algo como lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2110 (Mariage (Kitab Al-Nikah)), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 2110 numaralı hadis, bir şeyin helal olup olmadığını anlatmaktadır. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile haleflerinin sözlerini içeren metinleri derleyen Helal ve Haram bölümü tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2110, menyebutkan tentang kebolehan sesuatu. Hadits ini dikompilasi oleh bagian Halal dan Haram, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
