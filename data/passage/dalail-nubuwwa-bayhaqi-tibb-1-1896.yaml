text: "… الكاهل يومئذٍ حجمه مولى بياضة بالقون والشفرة، وبقي رسول اللّٰه كلف بعده ثلاث سنين حتى كان وجعه الذي توفي فيه فقال : ما زلتُ أجدُ من الأكلة التي أكلتُ من الشاة يوم خيبر عدداً حتى كان هذا أوان. انقطع الأبهر …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1896، يذكر الحجامة، ومرض النبي، والوجع، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 1896, that mentions cupping, the Prophet's illness, pain, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 1896 کا اقتباس جس میں حجامہ، نبی کی بیماری، درد، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen escaneado 1, pág. 1896, que menciona la ventosaterapia, la enfermedad del Profeta, el dolor y los órganos del cuerpo; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, volume 1 scanné, p. 1896, qui mentionne la ventousothérapie, la maladie du Prophète, la douleur, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin Peygamberliğin Alametleri adlı eserinin resimli 1. cildinin 1896. sayfasından bir bölüm; hacamat, Peygamberin hastalığı, acısı ve vücut parçalarından bahsediliyor; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Tanda-Tanda Kenabian karya Al-Bayhaqi, jilid bergambar 1, hlm. 1896, yang menyebutkan tentang bekam, penyakit Nabi, rasa sakit, dan bagian-bagian tubuh; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber."
