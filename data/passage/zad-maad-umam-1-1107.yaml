text: "… الرجال والنساء نصل: في حكمه ظ في الجزية ومقدارها وممن تقبل الأمر بأخذ الجزية هل تقبل الجزية من غير اليهود والنصارى والمجوس وهل تقبل من العرب؟ مقدار الجزية نصل : في حكمه ل في الهدنة وما ينقضها مصالحته أهل مكة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 1107، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
