label: { ar: "الموطأ 808 — أنس بن مالك: سافرنا مع رسول الله في رمضان فلم يعب الصائم على المفطر ولا المفطر على الصائم", en: "Muwatta 808", es: "Muwatta 808", fr: "Muwatta 808", ur: "موطا 808", tr: "El-Muvatta 808 — Enes bin Malik: Ramazan ayında Allah'ın Resulü ile birlikte yolculuk ettik ve ne oruç tutan oruç tutmayanı eleştirdi, ne de oruç tutmayan oruç tutanı eleştirdi.", id: "Al-Muwatta 808 — Anas bin Malik: Kami melakukan perjalanan bersama Rasulullah SAW pada bulan Ramadan, dan tidak ada orang yang berpuasa mencela orang yang tidak berpuasa, dan tidak pula orang yang tidak berpuasa mencela orang yang berpuasa." }
text: "فلم يعب الصائم على المفطر، ولا المفطر على الصائم"
summary:
  ar: "يرويه مالك عن حميد الطويل عن أنس بن مالك، أنه قال: سافرنا مع رسول الله في رمضان فلم يعب الصائم على المفطر، ولا المفطر على الصائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وسويد، والقعنبي عند البخاري (1947) والجوهري، والشافعي، ويحيل على التمهيد (2/169). {cite:muwatta-maruf-1997 p.396}"
  tr: "Malik, Humaid el-Tawil'den, o da Enes ibn Malik'ten rivayet ettiğine göre şöyle demiştir: \"Ramazan ayında Allah'ın Resulü ile birlikte yolculuk ettik ve ne oruç tutan oruç tutmayanı eleştirdi, ne de oruç tutmayan oruç tutanı eleştirdi.\" Editör, bu hadisin Malik'ten Ebu Musab tarafından, onun zinciriyle de İbn Hibban, el-Baghawi, Suwaid ve el-Ka'nabi tarafından, Buhari (1947), el-Cevhari ve el-Şafiî tarafından da kaydedildiğini belirtmektedir. Ayrıca el-Tamhid'e (2/169) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.396}"
  id: "Diriwayatkan oleh Malik dari Humaid al-Tawil dari Anas ibn Malik, yang berkata: “Kami melakukan perjalanan bersama Rasulullah pada bulan Ramadan, dan tidak ada orang yang berpuasa mengkritik orang yang tidak berpuasa, dan tidak pula orang yang tidak berpuasa mengkritik orang yang berpuasa.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan melalui sanadnya oleh Ibn Hibban, al-Baghawi, Suwaid, dan al-Qa’nabi, sebagaimana dicatat oleh al-Bukhari (1947), al-Jawhari, dan al-Shafi’i. Beliau merujuk pada al-Tamhid (2/169). {cite:muwatta-maruf-1997 p.396}"
