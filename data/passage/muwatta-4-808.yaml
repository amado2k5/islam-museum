label: { ar: "الموطأ 808 — أنس بن مالك: سافرنا مع رسول الله في رمضان فلم يعب الصائم على المفطر ولا المفطر على الصائم", en: "Muwatta 808" }
text: "فلم يعب الصائم على المفطر، ولا المفطر على الصائم"
summary:
  ar: "يرويه مالك عن حميد الطويل عن أنس بن مالك، أنه قال: سافرنا مع رسول الله في رمضان فلم يعب الصائم على المفطر، ولا المفطر على الصائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وسويد، والقعنبي عند البخاري (1947) والجوهري، والشافعي، ويحيل على التمهيد (2/169). {cite:muwatta-maruf-1997 p.396}"
