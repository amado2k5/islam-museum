text: "… والشافعي، وأكثر الفقهاء. وقد ذكر مالك في موطئه أنه بلغه عن سالم بن عبد اللّٰه، وسليمان بن يسار، أنهما كانا يقولانِ في المرأة يُتوفى عنها زوجُها: إنها إذا خشيت على بصرها مِن رمدٍ بعينيها، أو شكوى أصابتها، أنها تكتحل وتتداوى …"
