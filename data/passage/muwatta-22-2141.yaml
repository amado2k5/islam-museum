label: { ar: "الموطأ 2141 — يحيى عن مالك في الرجلين يختلفان في الرهن، يرهنه أحدهما صاحبه، فيقول الراهن: رهنتكه بعشرة دنانير، ويقول المرتهن: ارتهنته منك بعشرين دينارا، والرهن ظاهر بيد المرتهن: يحلف المرتهن حتى يحيط بقيمة الرهن", en: "Muwatta 2141", es: "Muwatta 2141", fr: "Muwatta 2141", ur: "موطا 2141", tr: "El-Muvatta 2141 — Yahya, Malik'ten rivayetle, bir rehin konusunda anlaşmazlığa düşen iki adam hakkında şöyle der: Biri diğerine bir şey rehin verir; rehin veren, \"Sana on dinar olarak rehin verdim\" der; rehin alan ise, \"Sana yirmi dinar olarak rehin verdim\" der ve rehin, rehin alanın elinde görünür haldedir: Rehin alan, rehin edilenin değerini öğreninceye kadar yemin eder.", id: "Al-Muwatta 2141 — Yahya, dari Malik, mengenai dua orang yang berselisih soal sanggahan, salah seorang dari mereka bersanggahan kepada yang lain, si pemberi sanggahan berkata: Aku bersanggahan kepadamu sebesar sepuluh dinar, dan si penerima sanggahan berkata: Aku bersanggahan kepadamu sebesar dua puluh dinar, dan sanggahan itu terlihat jelas di tangan si penerima sanggahan: si penerima sanggahan bersumpah sampai ia mengetahui nilai sanggahan tersebut" }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: الأمر عندنا في الرجلين يختلفان في الرهن، يرهنه أحدهما صاحبه، فيقول الراهن: رهنتكه بعشرة دنانير، ويقول المرتهن: ارتهنته منك بعشرين دينارا، والرهن ظاهر بيد المرتهن: قال: يحلف المرتهن حتى يحيط بقيمة الرهن. فإن كان ذلك لا زيادة فيه ولا نقصان عما حلف أن له فيه، أخذه المرتهن حقه، وكان أولى بالتبدئة باليمين، لقبضه الرهن وحيازته إياه، إلا أن يشاء رب الرهن أن يعطيه حقه الذي حلف عليه ويأخذ رهنه. {cite:muwatta-maruf-1997 p.275}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Bizim durumumuzda, iki adam bir rehin konusunda anlaşmazlığa düşerse, biri diğerine rehin verirse ve rehin veren, \"Sana on dinar karşılığında rehin verdim\" derse, rehin alan da, \"Sana yirmi dinar karşılığında rehin verdim\" derse ve rehin açıkça rehin alanın elindeyse: dedi ki: Rehin alan, rehin edilenin değerini belirlemek için yemin eder. Eğer değer, yemin ettiği miktardan ne fazla ne de az ise, rehin alan hakkını alır. Rehin alan, rehin edileni zaten ele geçirdiği için, yemin etmeye daha çok hak sahibidir; ancak rehin alan, yemin ettiği hakkını vermek ve rehinini geri almak isterse durum değişir. {cite:muwatta-maruf-1997 s.275}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Dalam kasus kita, jika dua orang berselisih tentang suatu gadai, yang satu menggadaikannya kepada yang lain, dan pemberi gadai berkata, \"Saya menggadaikannya kepada Anda seharga sepuluh dinar,\" dan penerima gadai berkata, \"Saya menggadaikannya kepada Anda seharga dua puluh dinar,\" dan gadai tersebut jelas berada dalam kepemilikan penerima gadai: dia berkata: Penerima gadai bersumpah untuk menentukan nilai gadai. Jika nilainya tidak lebih dan tidak kurang dari apa yang telah ia sumpahkan sebagai haknya, maka penerima gadai menerima haknya. Ia lebih berhak untuk bersumpah terlebih dahulu, karena ia telah memiliki gadai tersebut, kecuali pemilik gadai ingin memberikan haknya, yang telah ia sumpahkan, dan mengambil kembali gadainya. {cite:muwatta-maruf-1997 p.275}"
