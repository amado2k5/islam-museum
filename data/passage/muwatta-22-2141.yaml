label: { ar: "الموطأ 2141 — يحيى عن مالك في الرجلين يختلفان في الرهن، يرهنه أحدهما صاحبه، فيقول الراهن: رهنتكه بعشرة دنانير، ويقول المرتهن: ارتهنته منك بعشرين دينارا، والرهن ظاهر بيد المرتهن: يحلف المرتهن حتى يحيط بقيمة الرهن", en: "Muwatta 2141" }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: الأمر عندنا في الرجلين يختلفان في الرهن، يرهنه أحدهما صاحبه، فيقول الراهن: رهنتكه بعشرة دنانير، ويقول المرتهن: ارتهنته منك بعشرين دينارا، والرهن ظاهر بيد المرتهن: قال: يحلف المرتهن حتى يحيط بقيمة الرهن. فإن كان ذلك لا زيادة فيه ولا نقصان عما حلف أن له فيه، أخذه المرتهن حقه، وكان أولى بالتبدئة باليمين، لقبضه الرهن وحيازته إياه، إلا أن يشاء رب الرهن أن يعطيه حقه الذي حلف عليه ويأخذ رهنه. {cite:muwatta-maruf-1997 p.275}"
