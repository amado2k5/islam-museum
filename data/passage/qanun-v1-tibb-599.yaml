  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 599, that mentions medicine given by the mouth-side or the nose, pain, named diseases, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
