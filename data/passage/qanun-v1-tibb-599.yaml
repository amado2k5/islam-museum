text: "… العتيقة، واذا جعل لصوقاً مع مرّ نفع من القروح. آلات المفاصل : ينفع من الفالج وعرق النسا وأوجاع المفاصل شرباً وضمّاداً بالعسل. أعضاء الرأس : يذهب رائحة الثوم والبصل، ويضمّد به مع السويق للصداع المزمن، وقد يسعط به مع الخلّ …"
summary:
