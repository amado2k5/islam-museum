label: { ar: "الموطأ 1233 — عمرة بنت عبد الرحمن: كانت عائشة إذا حجت ومعها نساء تخاف أن يحضن قدمتهن يوم النحر فأفضن", en: "Muwatta 1233" }
summary:
  ar: "يروي مالك عن أبي الرجال محمد بن عبد الرحمن عن عمرة بنت عبد الرحمن أن عائشة كانت إذا حجت ومعها نساء تخاف أن يحضن، قدمتهن يوم النحر فأفضن، فإن حضن بعد ذلك لم تنتظرهن، بل تنفر بهن وهن حيض إذا كن قد أفضن. {cite:muwatta-maruf-1997 p.551}"
