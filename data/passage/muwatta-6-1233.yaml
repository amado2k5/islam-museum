label: { ar: "الموطأ 1233 — عمرة بنت عبد الرحمن: كانت عائشة إذا حجت ومعها نساء تخاف أن يحضن قدمتهن يوم النحر فأفضن", en: "Muwatta 1233", es: "Muwatta 1233", fr: "Muwatta 1233", ur: "موطا 1233", tr: "Al-Muwatta 1233 — Umrah bint Abd al-Rahman: Aişe Hac ibadetini yerine getirirken yanında adet görme ihtimali olan kadınlar varsa, Kurban Bayramı günü onları önden gönderirdi ki, onlar da Tavaf-ı İfade'yi yapabilsinler.", id: "Al-Muwatta 1233 — Umrah binti Abd al-Rahman: Ketika Aisyah melaksanakan ibadah haji dan membawa serta para wanita yang dikhawatirkan akan mengalami haid, ia akan mengirim mereka lebih dulu pada Hari Raya Kurban agar mereka dapat melaksanakan Tawaf al-Ifadah." }
summary:
  ar: "يروي مالك عن أبي الرجال محمد بن عبد الرحمن عن عمرة بنت عبد الرحمن أن عائشة كانت إذا حجت ومعها نساء تخاف أن يحضن، قدمتهن يوم النحر فأفضن، فإن حضن بعد ذلك لم تنتظرهن، بل تنفر بهن وهن حيض إذا كن قد أفضن. {cite:muwatta-maruf-1997 p.551}"
  tr: "Malik, Ebu el-Rijal Muhammed ibn Abd el-Rahman'dan, o da Amrah bint Abd el-Rahman'dan rivayet ettiğine göre, Ayşe, Hac ibadetini yerine getirirken yanında adet gören kadınlar olduğunda endişelendiği için, Kurban Bayramı günü onları önden gönderirdi ki, Tavafü'l-İfade'yi yapabilsinler. Eğer daha sonra adet görürlerse, onları beklemez, Tavafü'l-İfade'yi yaptıktan sonra, adetli oldukları halde onları gönderirdi. {cite:muwatta-maruf-1997 s.551}"
  id: "Malik meriwayatkan dari Abu al-Rijal Muhammad ibn Abd al-Rahman, dari Amrah bint Abd al-Rahman, bahwa Aisyah, ketika ia menunaikan ibadah haji dan ditemani oleh wanita-wanita yang dikhawatirkan akan haid, akan menyuruh mereka mendahului pada Hari Raya Kurban agar mereka dapat melaksanakan Tawaf al-Ifadah. Jika mereka haid setelah itu, ia tidak akan menunggu mereka, tetapi akan menyuruh mereka pergi selagi mereka masih haid, setelah mereka melaksanakan Tawaf al-Ifadah. {cite:muwatta-maruf-1997 p.551}"
