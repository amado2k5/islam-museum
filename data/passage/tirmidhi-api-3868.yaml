text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، قَالَ حَدَّثَنَا الأَسْوَدُ بْنُ عَامِرٍ، عَنْ جَعْفَرٍ الأَحْمَرِ، عَنْ عَبْدِ اللَّهِ بْنِ عَطَاءٍ، عَنِ ابْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ كَانَ أَحَبَّ النِّسَاءِ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَاطِمَةُ وَمِنَ الرِّجَالِ عَلِيٌّ ‏.‏ قَالَ إِبْرَاهِيمُ بْنُ سَعِيدٍ يَعْنِي مِنْ أَهْلِ بَيْتِهِ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا …"
summary:
