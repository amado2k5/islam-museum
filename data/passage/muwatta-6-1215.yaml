label: { ar: "الموطأ 1215 — عبد الرحمن بن القاسم عن أبيه: كان الناس إذا رموا الجمار مشوا ذاهبين وراجعين، وأول من ركب معاوية بن أبي سفيان", en: "Muwatta 1215", es: "Muwatta 1215", fr: "Muwatta 1215", ur: "موطا 1215", tr: "El-Muvatta 1215 — Abdülrahman ibn el-Kâsım, babasının rivayetine göre: İnsanlar Cemarat'a taş attıklarında, ileri geri yürüyorlardı. İlk binen kişi Muaviye ibn Ebu Sufyan idi.", id: "Al-Muwatta 1215 — Abd al-Rahman ibn al-Qasim, berdasarkan riwayat ayahnya: Ketika orang-orang melempar kerikil ke Jamarat, mereka berjalan bolak-balik. Orang pertama yang menunggang kuda adalah Muawiyah ibn Abi Sufyan." }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه أن الناس كانوا إذا رموا الجمار مشوا ذاهبين وراجعين، وأول من ركب معاوية بن أبي سفيان. {cite:muwatta-maruf-1997 p.544}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, o da babasından rivayet ettiğine göre, Cemarat'a taş atanlar ileri geri yürürlerdi ve ilk binen Muaviye ibn Ebu Sufyan'dı. {cite:muwatta-maruf-1997 s.544}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, dari ayahnya, bahwa ketika orang-orang melempar kerikil ke Jamarat, mereka berjalan bolak-balik, dan orang pertama yang menunggang kuda adalah Muawiyah ibn Abi Sufyan. {cite:muwatta-maruf-1997 p.544}"
