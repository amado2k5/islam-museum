text: "… وهوت الناقة تَهوِي هُوِياً فهي هاوية إذا عَدَت عَدْواً شديداً كأنها في هواء بئر، وقوله: تَهْوِي إِلَيْهِمْ مأخوذ منه. قال ابن عباس ومجاهد: لو قال أفئدة الناس لازدحمت عليه فارس والروم والترك والهند واليهود والنصارى والمجوس، ولكن قال: مِنَ النَّاسِ …"
