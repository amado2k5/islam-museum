label: { ar: "جامع الترمذي 2222 — تربية الأب ووصيته", en: "Jami' al-Tirmidhi 2222 — the father raising and counselling", ur: "جامع ترمذی 2222 — باپ کی تربیت اور نصیحت", es: "Jami' al-Tirmidhi 2222 — El padre que cría y aconseja", fr: "Jami' al-Tirmidhi 2222 — l'éducation et les conseils du père", tr: "Cami' el-Tirmizi 2222 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Jami' al-Tirmidhi 2222 — Didikan dan Wasiat Sang Ayah" }
text: "… أَبُو عَوَانَةَ، عَنْ قَتَادَةَ، عَنْ زُرَارَةَ بْنِ أَوْفَى، عَنْ عِمْرَانَ بْنِ حُصَيْنٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" خَيْرُ أُمَّتِي الْقَرْنُ الَّذِي بُعِثْتُ فِيهِمْ ثُمَّ الَّذِينَ يَلُونَهُمْ \". قَالَ وَلاَ أَعْلَمُ ذَكَرَ الثَّالِثَ أَمْ لاَ \" ثُمَّ يَنْشَأُ أَقْوَامٌ يَشْهَدُونَ وَلاَ يُسْتَشْهَدُونَ وَيَخُونُونَ وَلاَ يُؤْتَمَنُونَ وَيَفْشُو فِيهِمُ السِّمَنُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2222، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2222 (Chapters On Al-Fitan), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2222، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2222 (Capítulos sobre Al-Fitan), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2222 (Chapitres sur la Fitan), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site The Fatherhood in Islam Browser le répertorie parmi les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Cami' el-Tirmizi'nin 2222 numaralı hadisinde babanın yetiştirilmesi ve öğütlerinden bahsedilir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2222, menyebutkan tentang didikan dan nasihat seorang ayah. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
