text: "… القبور، لو تعلمون ما سلم عليه رجل، فرد سمع رجل من المهاجرين رجلاً يقرؤها يعيدها سمع عمر بن الخطاب صوت رجل في المسجد مع البي لَ له فقول قبل موته بثلاث سمعت في المتصارمين أحاديث كثيرةً سوء المجالسة فحش وشح …"
