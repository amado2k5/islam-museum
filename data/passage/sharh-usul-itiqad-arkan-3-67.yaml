text: "في شَرْحِ اصُولِ اعْتِقَادِ أَهْلِ السُنَةِ الإيمان: قولٌ وعملٌ، يزيد وينقص، والقرآنُ: كلامُ الله، غير مخلوقٍ بجميع جهاته، والقَدَرُ خيرُه وشرُّه مِن الله، وخيرُ هذه الأُمةِ بَعْدَ نَبيها: أبو بكر، ثُم: عُمَرُ، ثُم: عثمانُ، ثُم: علي وهُمْ الخلفاءُ الراشدونِ المهْديون، …"
summary:
