text: "… بن عُهادةً فى بنى الحارثِ بن ألحزرج قبل وَقَمةِ بدر، قال : حتى مرَّ بمجلسٍ فيه عبدُ اللّٰه بن أبيَّ ابن سَاول، وذلك قبل أن يُسلمَ حدُ اللَّهِ بنُ أُبّ، فاذا فى الجلس أخلاطٌ من للمسدين والمشيركين عبَدة الأوثانِ واليهودِ …"
