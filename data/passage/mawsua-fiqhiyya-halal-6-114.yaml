text: "… أخذه على وجه حرم عليه أخذه، فلزمه رد ما أخذ، كما لو أخذه من مال مسلم. قال الإمام الشافعي في الأم : ومما يوافق التنزيل والسنة ويعقله المسلمون، ويجتمعون عليه، أن الحلال في دار الإسلام حلال في بلاد الكفر، والحرام …"
summary:
