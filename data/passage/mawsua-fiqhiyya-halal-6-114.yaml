text: "… أخذه على وجه حرم عليه أخذه، فلزمه رد ما أخذ، كما لو أخذه من مال مسلم. قال الإمام الشافعي في الأم : ومما يوافق التنزيل والسنة ويعقله المسلمون، ويجتمعون عليه، أن الحلال في دار الإسلام حلال في بلاد الكفر، والحرام …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 114، يذكر الحلال، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 6, p. 114, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 6، ص 114 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 6, pág. 114, que menciona lo lícito, lo ilícito y lo que se ha declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation du volume 6, p. 114) mentionnant le licite, l'illicite et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 6, sayfa 114'ten, helal, haram ve yasak olan şeyleri belirten bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 6 Bergambar, halaman 114, yang menyebutkan apa yang diperbolehkan (halal), haram (haram), dan dilarang; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
