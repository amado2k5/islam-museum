text: |-
  ١ بق فى مدح صفصة ١٩٤
  انه يصف فرسا ورواه هناة
  خواصرهاكا قاله بعد وقال فى
  تعدحت يروى بالدال والذال
  جيعاام
  ٢٢٢
  باب الرام)
  ⁦(ذك)⁩
  قال الاصمعى يعى نفرن ونشزن واجترأن يقال منه امر أة ذا رعلى فاعل مثل الرجسل
  قال عبيد
  ولقد أتاناءن تميم أنهم • ذئروا لقتلى عامر وتفضبوا
  يعدى نفروا من ذلك وأنكروه ويقال ان شؤونك لدئرة وقدذتره أى كرهه وانصرف
  عنه وناقة مذائر تنفر عن الولد ساعة نضعه ويقال هى التى ترأم بأنفها ولا يصدق حيها
  وذر بالثى أى ضرى به واعتاده ⁦(ذبر)⁩ الدير السكتاية مثل الزير وقد ذبرت الكتاب أذيره
  وأذبره ذبرا وأنتد الاصعى لالي ذؤيب
  عرفت الديار كرقم الدوا قيذبرها الكاتب الممبرى
  ⁦( ذخر)⁩ الذخيرة واحدة الذخاروقد ذخرت الشى أذخره ذخرا وكذلك اتخرته وهو
  افتعلت وقول الشاعر الراعى ⁦(يصف امرأة)⁩ (١
  فلماسقيناها العكيس تذحت • مذاخرها وازدادرشها وريدها
  يعنى أجوافها وأمعاءها ويروى خواصرها والاذخرنيت الواحدة اذخرة ⁦(ذور)⁩ الذرججع
  ذرّة وهى أصغر الخل ومنه سمى الرجل ذرّت اوكنى يأب ذرّ وذرية الرجل ولده والجمع الذرارى
  والذرّيات وذروت الحب والدواء والملح أذره ذرافرقته ومنه الذريرة والذرور بالفتح لغسة
  فى الذريرة ويجمع على أذرة وذرت الشمسس تذرّ ذرورا بالضم طلعت ويقال ذر لبقسل اذا
  طلع من الارض عن أب زيد وحكر الفراء ذارت الناقة تذار مذارة وذرارا أى سامخلقها
  وهي مذار وهى فى معف العلوق واءذائر قال ومنه قول الحطيئة
  وكنت كذات البوذارت بأنفها • فن ذال سغى غيره وتهاجره
  الأنه خففه للضرورة وقال أيوزيد فى فلان ذرارأى اعراض غضبا كذرار الناقة⁦(ذعر)⁩.
  ذهرته أذهره ذعرا أفزعته والاسم الذعر بالضم وقد ذعرفهو مذعوروامر أة ذعورتذعر
  من اربية وناقة ذعوراذامس ضرعهاغارت وذوالاذعاراقب ملامن ملوك حبرلانه
  زعواحل النسناس الى بلاد اليمن فذء والناس منه ⁦(ذفر)⁩ الذفر بالتهريك كل ريح
  ذكية من طيب أونتن يقال مسك أذفر بين الذفر وقدذفربالكسريذ فروروضة ذفرة
  والذخر الصنان وهذارجل ذفرأى له صنان وخبث ريح والذفرى من القفاهو الموضع الذى
  يعرق من البعير خلف الاذن يقسال هذه ذفرى أسيلة لا تنوّن لان ألفها للتأنيت وهى ما خوذة
  من ذفر العرق لانها أول ما يعرق من البعسير قال الاصمعى قلت لابى عمروين العلال،:الذفرى
  من الذفر فقال نعم والمعزى من المعزفقال نعم وبعضهم يتونه فى النسكرة ويجعل ألفه للالحاق
  درهم وهجرع والمع ذفريات وذفارى بفتح الراء وهذه الالف فى تقدير الانقلاب عن اليا
  رمن تم قال بعضهم ذفار مشل محار أبو زيد بعير ذفر بالسكسر مشد الراءأى عظيم الدخرى
  وناقة ذفرة والذفرّ الشاب الطويل التام الجاد والذقراءعشبة خبيئة الرائحة لايكاد المال
  يأكلها =ن بعقوب قال وكتيبة ذفرا. أى انهاسهكة من الحديد وصدثة قال ابيد
