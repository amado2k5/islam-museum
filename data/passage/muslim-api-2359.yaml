text: "… مَثَلُ الْمُنْفِقِ وَالْمُتَصَدِّقِ كَمَثَلِ رَجُلٍ عَلَيْهِ جُبَّتَانِ أَوْ جُنَّتَانِ مِنْ لَدُنْ ثُدِيِّهِمَا إِلَى تَرَاقِيهِمَا فَإِذَا أَرَادَ الْمُنْفِقُ - وَقَالَ الآخَرُ فَإِذَا أَرَادَ الْمُتَصَدِّقُ - أَنْ يَتَصَدَّقَ سَبَغَتْ عَلَيْهِ أَوْ مَرَّتْ وَإِذَا أَرَادَ الْبَخِيلُ أَنْ يُنْفِقَ قَلَصَتْ عَلَيْهِ وَأَخَذَتْ كُلُّ حَلْقَةٍ مَوْضِعَهَا حَتَّى تُجِنَّ بَنَانَهُ وَتَعْفُوَ أَثَرَهُ \". قَالَ فَقَالَ أَبُو هُرَيْرَةَ فَقَالَ يُوَسِّعُهَا فَلاَ تَتَّسِعُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2359، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2359 (The Book of Zakat), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2359، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
