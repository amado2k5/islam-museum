label: { ar: "الموطأ 264 — بلاغ: إني لأنسى أو أُنسّى لأسنّ", en: "Muwatta 264", es: "Muwatta 264", fr: "Muwatta 264", ur: "موطا 264", tr: "Al-Muwatta 264 — Rapor: Bir geleneği tesis etmek için unutturulurum veya unutturulurum.", id: "Al-Muwatta 264 — Laporan: Saya lupa atau dibuat lupa agar tercipta sebuah tradisi." }
text: "إني لأنسى أو أنسى لأسن"
summary:
  ar: "بلاغ في باب العمل في السهو: يروي مالك أنه بلغه أن النبي قال إنه ينسى أو يُنسّى ليسنّ للناس أحكام السهو. ويذكر المحقق أن أبا مصعب رواه عن مالك، وينقل عن ابن عبد البر أنه لا يعلم هذا اللفظ يروى عن النبي من غير هذا الوجه مسنداً ولا مقطوعاً، وأنه أحد البلاغات الأربعة في الموطأ التي لا توجد في غيره، ومعناه صحيح في الأصول، وأن ابن الصلاح في رسالته في وصل البلاغات الأربعة قال إن حديث النسيان روي من وجوه كثيرة صحيحة وساق منها حديث ابن مسعود. {cite:muwatta-maruf-1997 p.155} {cite:muwatta-maruf-1997 p.156}"
  tr: "Unutkanlık hakkındaki hükümlerle ilgili bir rivayet: Malik, Peygamberimizin, unutkanlık konusunda insanlar için hükümler koymak amacıyla unuttuğunu veya unutturulduğunu söylediğini işittiğini rivayet eder. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtir ve İbn Abdül-Barr'ın, bu ifadenin Peygamberimizden başka bir rivayet zinciriyle, ne tam ne de eksik bir şekilde nakledildiğini bilmediğini söylediğini aktarır. Ayrıca, bunun Muwatta'da başka yerde bulunmayan dört rivayetten biri olduğunu ve anlamının fıkıh ilkelerine göre sahih olduğunu belirtir. İbn el-Salah, dört rivayeti birleştirme üzerine yazdığı risalesinde, unutkanlık hakkındaki hadisin birçok sahih rivayet zinciriyle nakledildiğini ve bunlar arasında İbn Mes'ud hadisini de zikrettiğini söyler. {cite:muwatta-maruf-1997 s.155} {cite:muwatta-maruf-1997 s.156}"
  id: "Sebuah riwayat mengenai hukum-hukum tentang kelupaan: Malik meriwayatkan bahwa ia mendengar Nabi bersabda bahwa beliau lupa atau dibuat lupa agar beliau dapat menetapkan hukum-hukum bagi manusia mengenai kelupaan. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan mengutip Ibnu Abd al-Barr yang mengatakan bahwa ia tidak mengetahui adanya riwayat hadits ini dari Nabi melalui sanad lain, baik dengan sanad yang lengkap maupun tanpa sanad yang lengkap. Ia juga menyatakan bahwa hadits ini adalah salah satu dari empat riwayat dalam Muwatta yang tidak ditemukan di tempat lain, dan maknanya sahih menurut prinsip-prinsip fiqih. Ibnu al-Salah, dalam risalahnya tentang menghubungkan keempat riwayat tersebut, mengatakan bahwa hadits tentang kelupaan diriwayatkan melalui banyak sanad yang sahih, dan ia menyebutkan di antaranya hadits Ibnu Mas'ud. {cite:muwatta-maruf-1997 p.155} {cite:muwatta-maruf-1997 p.156}"
