text: "إني لأنسى أو أنسى لأسن"
summary:
  ar: "بلاغ في باب العمل في السهو: يروي مالك أنه بلغه أن النبي قال إنه ينسى أو يُنسّى ليسنّ للناس أحكام السهو. ويذكر المحقق أن أبا مصعب رواه عن مالك، وينقل عن ابن عبد البر أنه لا يعلم هذا اللفظ يروى عن النبي من غير هذا الوجه مسنداً ولا مقطوعاً، وأنه أحد البلاغات الأربعة في الموطأ التي لا توجد في غيره، ومعناه صحيح في الأصول، وأن ابن الصلاح في رسالته في وصل البلاغات الأربعة قال إن حديث النسيان روي من وجوه كثيرة صحيحة وساق منها حديث ابن مسعود. {cite:muwatta-maruf-1997 p.155} {cite:muwatta-maruf-1997 p.156}"
