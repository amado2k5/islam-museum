text: "الناصر ، كان من سادات الأمراء عقلا وعفة ونزاهة ، سقاه بعض الكتاب من النصارى سما فمات. وكان اسم الذي سقاه ابن ساوا ، فسلمه الخليفة إلى غلمان بنيامين فشفع فيه ابن مهدي الوزير وقال : إن النصارى قد بذلوا"
