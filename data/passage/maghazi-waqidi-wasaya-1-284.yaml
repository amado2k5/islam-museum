text: "… من جُرحه فخرجتْ حُشْوَتُه، ففزع صاحبى وجعل يلتفت وراءه يظن أنه العدوّ، فضحكت. ولقد شَرَع لى رجلٌ برمح يستقبل به ثُخْرَة نَحرى، فغلبنى النومُ وزال الرمح. ولقد رأَيتنى حين انتهيت إلى الحَفْر له، ومعى قوسى، وغَلُظ علينا الجَبَلُ فهَبَطْنا به …"
summary:
