text: "طرف الحديث لا نفقة لك، ولا سكنى لا نكاح إلا بولي لا نكاح له لا نورث، ما تركناه صدقة لا هجرة بعد الفتح لا هي أطعمتها لا وجد ضالته لا وجدت، انما بنيت المساجد لما بنيت له لا وصية لوارث …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 6206، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 6206, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 6206 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 1, pág. 6206, que menciona un testamento o consejo de despedida, lo que dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq (tome 1, p. 6206) mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il est répertorié dans le Navigateur de Testaments."
  tr: "Abdülrazzak'ın Musannaf adlı eserinin Resimli Cilt 1, s. 6206'dan bir alıntı; vasiyetname veya son miras ve vasiyetnameden ve geride bıraktığı miras ve vasiyetten bahsediyor; makine tarafından okunabilir taranmış kopyadan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, hlm. 6206, yang menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkan sebagai warisan dan harta pusaka; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
