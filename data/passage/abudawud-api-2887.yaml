label: { ar: "سنن أبي داود 2887 — وصية أو عهد أخير", en: "Sunan Abi Dawud 2887 — a testament or parting counsel", ur: "سنن ابی داؤد 2887 — وصیت یا آخری نصیحت", es: "Sunan Abi Dawud 2887 — un testamento o consejo de despedida", fr: "Sunan Abi Dawud 2887 — un testament ou un conseil d'adieu" }
text: "… قَالَ اشْتَكَيْتُ وَعِنْدِي سَبْعُ أَخَوَاتٍ فَدَخَلَ عَلَىَّ رَسُولُ اللَّهِ فَنَفَخَ فِي وَجْهِي فَأَفَقْتُ فَقُلْتُ يَا رَسُولَ اللَّهِ أَلاَ أُوصِي لأَخَوَاتِي بِالثُّلُثِ قَالَ \" أَحْسِنْ \". قُلْتُ الشَّطْرَ قَالَ \" أَحْسِنْ \". ثُمَّ خَرَجَ وَتَرَكَنِي فَقَالَ \" يَا جَابِرُ لاَ أُرَاكَ مَيِّتًا مِنْ وَجَعِكَ هَذَا وَإِنَّ اللَّهَ قَدْ أَنْزَلَ فَبَيَّنَ الَّذِي لأَخَوَاتِكَ فَجَعَلَ لَهُنَّ الثُّلُثَيْنِ \". …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2887، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2887 (Shares of Inheritance (Kitab Al-Fara'id)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2887، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2887 (Reparto de la herencia (Kitab Al-Fara'id)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2887 (Partage de l'héritage (Kitab Al-Fara'id)), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
