text: |-
  ١ ف نسخة بقية البيت
  بارلك فيك اللّٰه ن ذى ال-
  ٢ ف نسحخة بقية البيت
  وما الاصباح منك بامثل
  ٣ ف نسخة زيادة الشاعر تابط
  شرا وأول البيت
  والكننى أروى من الخرهامتى
  ٢٠٢
  اذا طردتها فانشات والاسم الشلل بالتحريك ومرّفلان يشلهم بالسيف أى يكسؤهم
  ويطردهم وجاؤاشلالا اذاجاؤا يطردون الابل والشلال القوم المتفرّقون قال
  أما والذى حجت قريس قطينة • شلالا ومولى كل باق وهالك
  والقطينة سكن الدار وشللت الثوب اذاخطته خياطة خفيفة والشال أثريصيب الثوب
  لا يذهب بالغسل يقال ماهذا الشلل فى توبك والشلل فساد فى اليبديقال شات يمينه تشل
  بالفتح وأشلها اللّٰه يقال فى الدعاء لا تشال يدك ولا تكلل وقد شللت يارجل بالكسرتشل تشللا أى
  صرت أشلّ والمرأة شلاء ويقال لمن أجاد الرمى أوالطعن لاشهلا ولاعى ولاشلّ عشره أى
  أصادعك قال الراجز ١ *مهر أبى الحماب لاتشلى،حركه للقافية والماءمن ملة الكسم
  وهوكاقال ٢ ألا أيها الليل الطويل ألا الهيلى • وشلشلت الماءأى قطرته فهو مشلشل
  قال ذوارقة * مشلشل ضيعته بينها الكتب *وماء ذوشلشل وشكال أى ذوقطران
  وأنشد الاصحعى
  فاهتمت النفسر اهتمام ذى السقم • ووافت الليل بشلشال شخم
  والصبى يشلكل يبوله والمتشلشل الذى قد تخدد لهه قال ٣
  وأنضوا الفلا بالشاحب المتشلشل • ورجل شلشل بالضم أى خفيف قال أبو عبيدة الشليل
  الغلالة التى تحت الدرع من توب أوغيره قال وربعا كانت درعاقصيرة تحت العليا والجمع
  الاشلة قال أوس
  وجتنابه اشهياء ذات أشلة * لهاعارض فيه المنية تلمع
  والشليل الحلس الذى يكون على عجز البعير وقال
  كسون القادسية كل قرن * وزين الاشلة بالسدول
  والشليل من الوادى وسطه حيث يسيل معظم الماء والشلة بالضم النية والاهر البعيد
  قال أبو ذؤيب وقلت تجبين سخط ابن عم * ومطلب شلة وهى الطروح
  ⁦(شمل )⁩ شملهم الامر يشملهم اذا عمهم وشملهم بالفتح يشملهم لغة ولم بعرفها الاصعى وأنشد
  لابن قيس الرقيات
  كيف نومى على الفراش ولما * تشمل الشأم غارة شعواه
  أى متفرّقة وأمرشاهل وجمع اللّٰه شملهم أى ما تشتت من أمرهم وفرّق اللّٰه شمله أى ما
  جتمع من أمره والشمل بالتحريك مصدر قولك شملت ناقتنا لقاحامن فل فلان تشمل شملا
  اذالقحت والشمل أيضالغة فى الشمل وأنشد أبوزيد فى نوادره للبعيث
  قد يتعش اللّٰه الفتى بعد عثرة • وقد يجمع اللّٰه الشقيت من الشمل
  قال أبو عمر الجرمى ما سمعته بالتحريك الافى هذا البيت والشملة كساء يشتمل به قال ابن
  السكيت يقال اشتريت شملة تشملنى ويقال أصايياشمسل من مطر بالتحريك وأخطأ ناصو به
  ووابه أى أصابنا منبه شي قليل ورأيت شملا من الناس والابل أى قليلا وما على النخلة
  الاشملة وشهل وماعليها الاشماليل وهو الشئء القليسل يبق عليها من حلها والشماليل أيضا
  ما تفرّق من شعب الاغصان فى رؤسها كنحو شماريخ العذق قال العجاج
  وقد
