text: "… أو يشرب له درهم سكبينج وبزر كرفس، أو يشرب حب الشيطرج، أو يشرب الخبث بمخيض البقر. ابن ماسويه: أجود دواء للنقرس معجون هرمس وكذلك الورك. قال: فمن أدمن عليه برأ برءاً تاماً كاملًا، وقال: تكون أوجاع المفاصل إما من دم …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1786، يذكر الوجع، وأسماء الأمراض، والبرء من العلة، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1786, that mentions pain, named diseases, recovery from an ailment, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1786 کا اقتباس جس میں درد، بیماریوں کے نام، بیماری سے شفایابی، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
