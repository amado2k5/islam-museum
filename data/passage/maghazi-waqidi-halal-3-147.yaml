text: "… على مَن سِواهم، يُجير عليهم أَدناهم، وقد أَجرنا مَن أَجارت. فلمّا انصرف النبىّ إلى منزله دخلت عليه زَينب فسأَلته أَن يردَّ إلى أَبى العاص ما أُخِذْ منه من المال، ففعل وأَمرها أَلَّا يقربها، فإنها لا تحلّ له ما دام مشركاً. …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 3، ص 147، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
