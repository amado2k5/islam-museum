label: { ar: "الموطأ 1702 — مالك في الرجل تكون تحته الأمة فيبتاعها فيعتقها: تعتد حيضتين ما لم يصبها، فإن أصابها بعد ملكه إياها قبل عتاقها فعليها الاستبراء بحيضة", en: "Muwatta 1702", es: "Muwatta 1702", fr: "Muwatta 1702", ur: "موطا 1702", tr: "El-Muvatta 1702 — Malik, himayesinde bir kadın köle bulunduran, sonra onu satın alıp azat eden bir erkek hakkında şöyle demiştir: Kadın, erkek onunla cinsel ilişkiye girmedikçe iki adet döngüsü bekleme süresine uymalıdır. Eğer erkek, kadını satın aldıktan sonra, azat etmeden önce onunla cinsel ilişkiye girerse, kadın bir adet döngüsü bekleme süresine uymalıdır." }
summary:
  ar: "يقول مالك في الرجل تكون تحته الأمة، ثم يبتاعها فيعتقها، إنها تعتد عدة الأمة حيضتين، ما لم يصبها. فإن أصابها بعد ملكه إياها قبل عتاقها، لم يكن عليها إلا الاستبراء بحيضة. {cite:muwatta-maruf-1997 p.95}"
  tr: "Malik, bir erkeğin bakımı altında bir kadın kölesi varsa, onu satın alıp azat etmesi durumunda, köle kadının, erkek onunla cinsel ilişkiye girmediği sürece, iki adet adet döngüsü kadar bekleme süresine uyması gerektiğini söyler. Eğer erkek, kadını satın aldıktan sonra ancak azat etmeden önce onunla cinsel ilişkiye girerse, kadının sadece bir adet döngüsü kadar bekleme süresine uyması gerekir. {cite:muwatta-maruf-1997 s.95}"
