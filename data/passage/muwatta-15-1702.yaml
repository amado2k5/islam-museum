summary:
  ar: "يقول مالك في الرجل تكون تحته الأمة، ثم يبتاعها فيعتقها، إنها تعتد عدة الأمة حيضتين، ما لم يصبها. فإن أصابها بعد ملكه إياها قبل عتاقها، لم يكن عليها إلا الاستبراء بحيضة. {cite:muwatta-maruf-1997 p.95}"
