label: { ar: "صحيح البخاري 5598 — الحلال، الحرام", en: "Sahih al-Bukhari 5598 — the lawful; the unlawful", ur: "صحیح بخاری 5598 — حلال، حرام", es: "Sahih al-Bukhari 5598 — lo lícito; lo ilícito", fr: "Sahih al-Bukhari 5598 — le licite; l'illicite", tr: "Sahih el-Buhari 5598 — Helal, Haram", id: "Sahih al-Bukhari 5598 — Halal, Haram" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ أَبِي الْجُوَيْرِيَةِ، قَالَ سَأَلْتُ ابْنَ عَبَّاسٍ عَنِ الْبَاذَقِ،. فَقَالَ سَبَقَ مُحَمَّدٌ الْبَاذَقَ، فَمَا أَسْكَرَ فَهْوَ حَرَامٌ. قَالَ الشَّرَابُ الْحَلاَلُ الطَّيِّبُ. قَالَ لَيْسَ بَعْدَ الْحَلاَلِ الطَّيِّبِ إِلاَّ الْحَرَامُ الْخَبِيثُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5598، يذكر الحلال، والحرام، والخبائث. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5598 (Drinks), that mentions the lawful, the unlawful, the foul things. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5598، جس میں حلال، حرام، خبیث چیزیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5598 (Bebidas), menciona lo lícito, lo ilícito y lo impuro. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5598 (Boissons), mentionne ce qui est licite, illicite et impur. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 5598 numaralı hadis, helal, haram ve necis olan şeyleri sıralamaktadır. Bu hadis, Helal ve Haram Tarayıcısı tarafından Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki sözleriyle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5598, menyebutkan apa yang diperbolehkan, diharamkan, dan najis. Hadits ini dikumpulkan oleh Halal and Haram Browser bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
