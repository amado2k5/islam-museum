text: |-
  ١ ولد تيه تنهور أى يتنو بن
  كل على الوصفية مبالغسة وليس
  بالاضافة قاله نصر
  ٢٩٢٠
  باب الراء)
  ⁦(تبر )⁩
  واشتدمثل اقهل واتمأل قال زهير من مسعود الضى
  ثى لها يهتك أسمارها * بتمثر فيه تحريب
  تتر) التنور الذى يخيز فيه وقوله تعالى وفار التنور قال على رضى اللّٰه عنه هووجه
  الارض⁦(تور)⁩ التوراناء يشرب فيه والتور السول بين القوم قال ابن دريد هوعربى
  صحيح وأنشد
  وانتور فيما بيننا معمل * يرضى بد المأتى والمرسل
  أبو عم روفلان يتارعلى أن يؤخذ أى يدار على أن يؤخذ وأنسد المعاربى
  لقد غضبواعلى وأشقذونى * فصرت كأنى فرأيتار
  ويروى متار مقلوب من -تأر بر التيار الموج قال عدى كالبحر يقذف بالتيارتيارا
  ويقال قطع رقاتيارا أى سريع الجرية وفعل ذلك تارة بعد تارة أى مرّة بعدمرّة والهع
  تارات وتيروهومة صور من تياركما هالوا قامات وقيم واغماغير لاجسل حرف العلة ولولاذلك
  لما غير ألاترى انهم قالوا فى جمع رحبة رحاب ولم يقولوارحب قال الشاعر
  يقوم تارات وتمشى تيرا وربعما قالوه بحذف الهاء قال الراجز بالويل تارا والثبورتارا
  وأتاره أى أعاده.رة بع-د أخرى (تيهر التيهور من الرمل ماله جرف عن الاصمعى
  وقال الشاعر فطلعت من شمراخة تيهورة • شماء مشرفة كراس الاصلع
  والجمع تياهيروتياهر قال الراجز
  كيف اهتدت ودونها الجزائر » وعقص من غالج تياهر
  ويقال للرجل اذا كان ذاهبا بنفسه بدتيه تبهورأى تائه
  صل الناء ث ر لتأر والثؤرة الذحل يقال ثأرت القسيل وبالقتيل ثأرا وثوْرة
  أى قتلت قاتله وقال الشاعر
  شفيت به نفسى وأدركت ثؤرتى • بن مالكهل كنت فى تورتى نسكسا
  والنابرالذى لا يبقى على شئ-تى يدرك تأره ويقسال أيضاهو تأره أى قاتل حيمه قال جرير
  قتلوا أبالك وثأره لم يقتل وقواهسم يا ثارات فلان أى ياقتلة فلان ويقال ثأرتك بصكذا
  أى أدركت بدثأرى مفان واثأرت من فلان أى أدركت ثأرى منه وأصله ا ثتأرتشغم
  قال ليدد
  والنيب ان تعرمنى رمة خلقا * بعد الممات فانى كنت أنثر
  والتأر المنيم الذى اذا أصابه الطالب رضى به فنام بعده واستنأرفلان استغاث لبثأر
  بقتوله قال الشاعر
  اذاجاءهم مستنتر كان نصره عاء لاير وابكل وأى ن
  (نبجر انتجرأى ارتدع عند الفزعة وقال العجاج يصف المار والاتان
  اذا انجرا من سواد حدجا ⁦( ثبر)⁩ المثابرة على الشئ المواظبة عليه وثبره عن كذايثير
  بالضم نبرا أى حبسه يقال ما نبرك عن حاجتك والثبرة الارض السهلة يقال باغت النخلة
  الى ثرة من الارض والنبرة أيضاحرة فى الارض وثبرة أيضااسمم وضع وثيير جبل بمكة يقال
  أشرق ثيير كيمانغير والثبور الهلاك والخسران أيضا قال الكميت
  ورأت قضاعة فى الايا من رأى منبو رونابر
