text: "… منها خُلقتما :: وفيها المعادُ والمصيرُ الى الحشر ولا تَعجبا أن تَرجِعًا قُتُسلّها فهما خَشِي الأقوامُ شرا من الكِبْر ولو شئتُ أدْلَى فيكما غيرُ واحد علانيةً أو قال عندى فى ستْرِ فإن أنا لم آمُر ولم أنْهَ عنكما ضحكتُ له …"
summary:
  ar: "مقطع من عيون الأخبار، ص 312، فيه ضحك وتبسم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from 'Uyun al-Akhbar, p. 312, with laughter and smiling; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "عیون الاخبار، ص 312 کا اقتباس جس میں ہنسی اور تبسم ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
