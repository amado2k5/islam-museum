  es: "Un extracto de 'Uyun al-Akhbar, p. 312, con risa y sonrisa; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"Uyun al-Akhbar\"ın 312. sayfasından, kahkaha ve gülümsemeler içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Uyun al-Akhbar,\" halaman 312, berisi tawa dan senyuman; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha and Islamic Folklore Browser."
