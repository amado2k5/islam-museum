text: "حرف الجيم • جُحَا، أبو الغُصْن، واسمه دُجَيْن بن ثابت اليربوعي البصري. وما أظنه صاحب المجون فإن ذاك متأخر عن هذا، ولحقه عثمان بن أبي شيبة. رأى أبو الغصن دُجَين أنس بن مالك وروى عن أسلم مولى عمر وهشام ابن …"
