label: { ar: "صحيح مسلم 3316 — ما حُرّم", en: "Sahih Muslim 3316 — what was made unlawful", ur: "صحیح مسلم 3316 — جو حرام کیا گیا" }
text: "… مَرْوَانَ بْنَ الْحَكَمِ، خَطَبَ النَّاسَ فَذَكَرَ مَكَّةَ وَأَهْلَهَا وَحُرْمَتَهَا وَلَمْ يَذْكُرِ الْمَدِينَةَ وَأَهْلَهَا وَحُرْمَتَهَا فَنَادَاهُ رَافِعُ بْنُ خَدِيجٍ فَقَالَ مَا لِي أَسْمَعُكَ ذَكَرْتَ مَكَّةَ وَأَهْلَهَا وَحُرْمَتَهَا وَلَمْ تَذْكُرِ الْمَدِينَةَ وَأَهْلَهَا وَحُرْمَتَهَا وَقَدْ حَرَّمَ رَسُولُ اللَّهِ مَا بَيْنَ لاَبَتَيْهَا وَذَلِكَ عِنْدَنَا فِي أَدِيمٍ خَوْلاَنِيٍّ إِنْ شِئْتَ أَقْرَأْتُكَهُ. قَالَ فَسَكَتَ مَرْوَانُ ثُمَّ قَالَ قَدْ سَمِعْتُ بَعْضَ ذَلِكَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3316، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3316 (The Book of Pilgrimage), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3316، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
