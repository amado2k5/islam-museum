label: { ar: "جامع الترمذي 379 — الرخصة، ما كُره", en: "Jami' al-Tirmidhi 379 — the concession (rukhsa); what was disliked", ur: "جامع ترمذی 379 — رخصت، جو ناپسند کیا گیا", fr: "Jami' al-Tirmidhi 379 — la dispense (rukhsa) ; ce qui fut réprouvé", es: "Yami' al-Tirmidhi 379 — la dispensa (rukhsa); lo que se reprobó" }
text: "… \". قَالَ وَفِي الْبَابِ عَنْ مُعَيْقِيبٍ وَعَلِيِّ بْنِ أَبِي طَالِبٍ وَحُذَيْفَةَ وَجَابِرِ بْنِ عَبْدِ اللَّهِ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي ذَرٍّ حَدِيثٌ حَسَنٌ. وَقَدْ رُوِيَ عَنِ النَّبِيِّ أَنَّهُ كَرِهَ الْمَسْحَ فِي الصَّلاَةِ وَقَالَ \" إِنْ كُنْتَ لاَ بُدَّ فَاعِلاً فَمَرَّةً وَاحِدَةً \". كَأَنَّهُ رُوِيَ عَنْهُ رُخْصَةٌ فِي الْمَرَّةِ الْوَاحِدَةِ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 379، يرد فيه ذكر الرخصة، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 379 (The Book on Salat (Prayer)), whose wording mentions the concession (rukhsa), what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 379، جس کے الفاظ میں رخصت، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 379, dont le texte mentionne la dispense (rukhsa), ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 379, cuyo texto menciona la dispensa (rukhsa), lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
