text: |-
  ⁦(ف صل الصاد)⁩
  ⁦(صر)⁩
  ٣٤٩
  قال الشاعر ذوالرمة اذا ذابت السمس اتقى صقراتها • بأفنان مربوع الصريمة معبل
  ( سمر الصحارى بالضم الدبر والصمر بالتح-ريك النتن يقال يدى من السمل صمرة
  والمهر بالضم الصبرويقال أدهقت الكاس الى أصبارها واصمارها بمعنعن ابن السكيت
  ورجل سمير يايس اللحم على العظام تفوح منه رائحة العرق ( ر الصنارة رأس
  المغزل وصنارة الحجفة مقبضها وأهل اليمن يسمون الاذن صنارة ور. الصور
  القرن قال الراجز لقد نطهناهم غداة الجهعين • نطحاشديد الاكنطح الصورين
  ومنّه قوله تعالى يوم ينفخ فى الصور قال الكلبى لا أدرى ما الصور ويقال هو جمع صورة
  مثل بسرة وبسر أى يتفح دصور الموتي الارواح وقرأ الحنسن يوم يتفخ فى العور والصور
  بكسر الصادلغة فى الصور جمع صورة وينشدهذا البيت على هذه اللغة يصف الجوارى
  أشيهن من بقر الخاصاً أعينها • وهن أحسن من صيرانها صورا
  والصيران جمع صوار وهو القطيع من البقر والصواراً يضاوعا المسك وقد بجعهما الشاعر
  اذالاح السوارذكرت ليلى • وأذكرها اذا تفخ الصوار
  والصيارلغة فيه والصور بالتسكين النخل المجتمع الصغار لاواحدة وقول الشاعر
  كأن عرفاماثلا من صوره * بين مقسذيه الى سنوره
  يريد شعر الناصية ويقال انى لأجدفى رأسى صورة وهى شبه الحكة حتى يشتهى أن يفلى
  رأسه وصارة اسم جبل ويقال أرض ذات شجروالصور بالتتحريك الميل ورجل آصوربين.
  الصور أى ماتل مشتاق وأصاره فانصار أى أماله قال وصوّره اللّٰه صورة حسفة قتصوّر
  ورجل صير شير أى حسن الصورة والشارة عن الفرّاء وتسورت الشى وهمت ضورته
  قتصورلى والتصاوير التماثيل وطعنه فتصوّر أى مال للسقوط وصاره يصوره ويصيره أى
  أماله وقرئ قوله تسالى فصرهن الميك يضم الصاد وكسرها قال الاخفسْ يعدى وجههن
  بقال صرالى" وصروجهك الىّ أى اقبل على وصرت الشى أيضاقطعته وفصلته قال العجاح
  صرنابه الحكم وأعيا الحكما فن قال هذا جعل فى الأَية تقدينا وتأخيرا كاند قال خد
  ليك أربعة من الطير فصرهن ويقال عصفور موار للذى يجيب اذادعى ⁦(صهر )⁩
  الاصهارأهل بيت المرأة عن اظليل قال ومن العرب من يجعل الصهر من الاجاء والاختان
  جيعا يقسال صاهرت اليهم اذا تز وحت فيهم وأصهرب بهسم اذا اتصلت بهم وتحرّمت بجوار
  أونسب أوتزوج عن ابن الاعرابى وأنشدازهير
  قود الجيادواصهار الملوك وصبثرفى مواطن لوكانوا بها سموا
  وصهرت الشئ قانصهر أى أذبته فذاب فهو صهي ١ قان ابن أجريصف فرخ القطاة
  تروى اق ألقى فى صفصف • تصهره الشمس فاينصصر.
  أى تذيبه الشمس فيصير على ذلك وقواهم لاصهرنك بمين مرة كانه يريد الاذابة وقداصهاد
  الحرباء تلأ لأظهره من شدة الحر ابن السكيت يقال ما بالبعيرمهارة بالضم أى طرق
  والصهرى لغة فى الصهريج وهو كالحوض ير * ار الشئ كذايصير صير أوصيرورة
  وصرت الى فلان مصير كقوله تعالى والى اللّه المصير وهو شاذ والقياسمصار مثل معاش
