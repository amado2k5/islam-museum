text: "… على المَنْطق، ثم هُما على أصول الفقه، ثم هو على الخلاف. والتحقيق أن يُقَدَّمَ العِلْمُ على العِلْم لثلاثة أمور : إما لكونِه أهم منه كتقديمِ فَرْض العَيْن على فرضِ الكفايةِ، وهو على المَنْدوب إليه، وهو على المُباح. وإمّا لكونِه وَسِيلةً …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 93، يرد فيه ذكر الفرض، وفرض العين، وفرض الكفاية، والمندوب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
