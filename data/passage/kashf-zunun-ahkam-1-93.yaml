text: "… على المَنْطق، ثم هُما على أصول الفقه، ثم هو على الخلاف. والتحقيق أن يُقَدَّمَ العِلْمُ على العِلْم لثلاثة أمور : إما لكونِه أهم منه كتقديمِ فَرْض العَيْن على فرضِ الكفايةِ، وهو على المَنْدوب إليه، وهو على المُباح. وإمّا لكونِه وَسِيلةً …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 93، يرد فيه ذكر الفرض، وفرض العين، وفرض الكفاية، والمندوب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 93, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya), the recommended (mandub), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 93 کا اقتباس جس میں فرض، فرضِ عین، فرضِ کفایہ، مندوب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kashf al-Zunun de Hajji Khalifa, volume numérisé 1, p. 93, dont le texte mentionne l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), le recommandé (mandub), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen digitalizado 1, p. 93, cuyo texto menciona lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), lo recomendado (mandub), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin resimli 1. cildinin 93. sayfasından, farz olan ameller, bireysel yükümlülükler, toplu yükümlülükler, tavsiye edilen ameller ve caiz olan ameller hakkında bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kashf al-Zunun karya Haji Khalifa, jilid 1 bergambar, halaman 93, yang menyebutkan amalan wajib, kewajiban individu, kewajiban kolektif, amalan yang dianjurkan, dan amalan yang diperbolehkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
