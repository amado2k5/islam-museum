  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 93 کا اقتباس جس میں فرض، فرضِ عین، فرضِ کفایہ، مندوب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
