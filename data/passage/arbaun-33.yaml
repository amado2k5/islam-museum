label: { ar: "الأربعون 33 — البينة على المدعي واليمين على من أنكر", en: "Arba'un 33 — proof on the claimant, oath on the denier" }
text: "لو يعطى الناس بدعواهم لادعى رجال أموال قوم ودماءهم، ولكن البينة على المدعي واليمين على من أنكر"
summary:
  ar: "حديث ابن عباس أن رسول الله قال: «لو يعطى الناس بدعواهم لادعى رجال أموال قوم ودماءهم ولكن البينة على المدعي واليمين على من أنكر» — وهو الحديث الثالث والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ قال النووي حديث حسن رواه البيهقي وغيره هكذا وبعضه في الصحيحين، واللفظ الذي ساقه به ساقه ابن الصلاح قبله في الأحاديث الكليات وقال رواه البيهقي بإسناد حسن؛ وأصل الحديث في الصحيحين من رواية ابن جريج عن ابن أبي مليكة عن ابن عباس مرفوعاً «لو يعطى الناس بدعواهم لادعى ناس دماء رجال وأموالهم ولكن اليمين على المدعى عليه» وخرجاه أيضاً من رواية نافع بن عمر الجمحي عن ابن أبي مليكة عن ابن عباس أن النبي قضى أن اليمين على المدعى عليه، وخرجه الإسماعيلي في صحيحه من رواية الوليد بن مسلم عن ابن جريج عن ابن أبي مليكة عن ابن عباس بلفظ «لادعى رجال دماء رجال وأموالهم ولكن البينة على الطالب واليمين على المطلوب»؛ وفيه قاعدة القضاء الكبرى: لو قُضي للناس بمجرد دعواهم لادعى بعضهم دماء وأموال بعض فتعين أن البينة على من ادعى واليمين على من أنكر (جامع العلوم والحكم ص 684–697)."
  en: "The hadith of Ibn Abbas that the Messenger of God said 'if people were given by their mere claims, men would claim the wealth and blood of others — but proof lies on the claimant and the oath on the one who denies' — the thirty-third of al-Nawawi's Forty and of Ibn Rajab's commentary; al-Nawawi calls it hasan as transmitted by al-Bayhaqi and others in this wording, part of it in the two Sahihs, the wording he gives being the one Ibn al-Salah had already given in his Ahadith Kulliyya citing al-Bayhaqi's hasan chain; its root is in the two Sahihs through Ibn Jurayj from Ibn Abi Mulayka from Ibn Abbas — 'if people were given by their claims some would claim the blood and wealth of others, but the oath is on the one against whom claim is made' — and they also carry through Nafi' ibn Umar al-Jumahi from Ibn Abi Mulayka from Ibn Abbas that the Prophet ruled the oath falls on the defendant, while al-Isma'ili in his Sahih through al-Walid ibn Muslim from Ibn Jurayj from Ibn Abi Mulayka from Ibn Abbas has 'proof on the one who seeks and the oath on the one from whom it is sought'; the hadith lays down the great rule of judgment — were claims alone decisive, some would claim others' blood and property, so evidence must rest on the claimant and the oath on the denier (Jami' al-Ulum wal-Hikam pp. 684–697)."
