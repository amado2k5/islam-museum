label: { ar: "الأربعون 33 — البينة على المدعي واليمين على من أنكر", en: "Arba'un 33 — proof on the claimant, oath on the denier", es: "Arba'un 33 — Prueba del reclamante, juramento del negador", fr: "Arba'un 33 — preuve à la charge du demandeur, serment à la charge du menteur", ur: "اربعون 33 - دعویٰ کرنے والے پر ثبوت، منکر پر قسم" }
text: "لو يعطى الناس بدعواهم لادعى رجال أموال قوم ودماءهم، ولكن البينة على المدعي واليمين على من أنكر"
summary:
  ar: "حديث ابن عباس أن رسول الله قال: «لو يعطى الناس بدعواهم لادعى رجال أموال قوم ودماءهم ولكن البينة على المدعي واليمين على من أنكر» — وهو الحديث الثالث والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ قال النووي حديث حسن رواه البيهقي وغيره هكذا وبعضه في الصحيحين، واللفظ الذي ساقه به ساقه ابن الصلاح قبله في الأحاديث الكليات وقال رواه البيهقي بإسناد حسن؛ وأصل الحديث في الصحيحين من رواية ابن جريج عن ابن أبي مليكة عن ابن عباس مرفوعاً «لو يعطى الناس بدعواهم لادعى ناس دماء رجال وأموالهم ولكن اليمين على المدعى عليه» وخرجاه أيضاً من رواية نافع بن عمر الجمحي عن ابن أبي مليكة عن ابن عباس أن النبي قضى أن اليمين على المدعى عليه، وخرجه الإسماعيلي في صحيحه من رواية الوليد بن مسلم عن ابن جريج عن ابن أبي مليكة عن ابن عباس بلفظ «لادعى رجال دماء رجال وأموالهم ولكن البينة على الطالب واليمين على المطلوب»؛ وفيه قاعدة القضاء الكبرى: لو قُضي للناس بمجرد دعواهم لادعى بعضهم دماء وأموال بعض فتعين أن البينة على من ادعى واليمين على من أنكر ⁦(جامع العلوم والحكم ص 684–697)⁩."
  en: "The hadith of Ibn Abbas that the Messenger of God said 'if people were given by their mere claims, men would claim the wealth and blood of others — but proof lies on the claimant and the oath on the one who denies' — the thirty-third of al-Nawawi's Forty and of Ibn Rajab's commentary; al-Nawawi calls it hasan as transmitted by al-Bayhaqi and others in this wording, part of it in the two Sahihs, the wording he gives being the one Ibn al-Salah had already given in his Ahadith Kulliyya citing al-Bayhaqi's hasan chain; its root is in the two Sahihs through Ibn Jurayj from Ibn Abi Mulayka from Ibn Abbas — 'if people were given by their claims some would claim the blood and wealth of others, but the oath is on the one against whom claim is made' — and they also carry through Nafi' ibn Umar al-Jumahi from Ibn Abi Mulayka from Ibn Abbas that the Prophet ruled the oath falls on the defendant, while al-Isma'ili in his Sahih through al-Walid ibn Muslim from Ibn Jurayj from Ibn Abi Mulayka from Ibn Abbas has 'proof on the one who seeks and the oath on the one from whom it is sought'; the hadith lays down the great rule of judgment — were claims alone decisive, some would claim others' blood and property, so evidence must rest on the claimant and the oath on the denier (Jami' al-Ulum wal-Hikam pp. 684–697)."
  es: "El hadiz de Ibn Abbas que el Mensajero de Dios dijo: \"Si a la gente se le diera por sus meras reclamaciones, los hombres reclamarían la riqueza y la sangre de otros; pero la prueba recae sobre el reclamante y el juramento sobre el que niega\"; el trigésimo tercero de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; al-Nawawi lo llama hasan como lo transmitieron al-Bayhaqi y otros en esta redacción, parte de ella en los dos Sahihs, la redacción que él da es la que Ibn al-Salah ya había dado en su Ahadith Kulliyya citando la cadena hasan de al-Bayhaqi; Su raíz está en los dos Sahihs a través de Ibn Jurayj de Ibn Abi Mulayka de Ibn Abbas: «si a la gente se le dieran sus reclamaciones, algunos reclamarían la sangre y la riqueza de otros, pero el juramento recae sobre aquel contra quien se hace la reclamación»; y también transmiten a través de Nafi' ibn Umar al-Jumahi de Ibn Abi Mulayka de Ibn Abbas que el Profeta dictaminó que el juramento recae sobre el acusado, mientras que al-Isma'ili en su Sahih a través de al-Walid ibn Muslim de Ibn Jurayj de Ibn Abi Mulayka de Ibn Abbas tiene «la prueba recae sobre quien la busca y el juramento sobre aquel de quien se la busca»; El hadiz establece la gran regla del juicio: si las reclamaciones por sí solas fueran decisivas, algunos reclamarían la sangre y la propiedad de otros, por lo que la evidencia debe basarse en el reclamante y el juramento en el negador (Jami' al-Ulum wal-Hikam pp. 684–697)."
  fr: "Le hadith d'Ibn Abbas selon lequel le Messager de Dieu a dit: « Si les gens étaient autorisés à s'approprier les biens et le sang d'autrui, la preuve incombe à celui qui prétend et le serment à celui qui nie » — le trente-troisième des quarante hadiths d'al-Nawawi et du commentaire d'Ibn Rajab; al-Nawawi le qualifie de hasan tel que transmis par al-Bayhaqi et d'autres dans cette formulation, une partie se trouvant dans les deux Sahihs, la formulation qu'il donne étant celle qu'Ibn al-Salah avait déjà donnée dans son Ahadith Kulliyya citant la chaîne hasan d'al-Bayhaqi; sa racine se trouve dans les deux Sahihs, transmis par Ibn Jurayj d'après Ibn Abi Mulayka d'après Ibn Abbas: « Si les gens étaient soumis à leurs prétentions, certains réclameraient le sang et les biens d'autrui, mais le serment incombe à celui contre qui la prétention est faite »; et ils transmettent également, par Nafi' ibn Umar al-Jumahi d'après Ibn Abi Mulayka d'après Ibn Abbas, que le Prophète a statué que le serment incombe au défendeur, tandis qu'al-Isma'ili, dans son Sahih, transmis par al-Walid ibn Muslim d'après Ibn Jurayj d'après Ibn Abi Mulayka d'après Ibn Abbas, a: « la preuve incombe à celui qui demande et le serment à celui à qui elle est demandée »; Le hadith énonce la grande règle du jugement: si les revendications étaient les seules décisives, certains réclameraient le sang et les biens d'autrui; la preuve doit donc reposer sur le demandeur et le serment sur le nier (Jami' al-Ulum wal-Hikam pp. 684–697)."
  ur: "ابن عباس کی حدیث ہے کہ رسول اللہ نے فرمایا کہ اگر لوگوں کو ان کے محض دعووں سے دیا جائے تو لوگ دوسروں کے مال اور خون کا دعویٰ کریں گے لیکن دلیل دعویٰ کرنے والے پر ہے اور قسم جھٹلانے والے پر ہے۔ النووی نے اسے حسن قرار دیا ہے جیسا کہ بیہقی اور دیگر نے اس لفظ میں نقل کیا ہے، اس کا کچھ حصہ دو صحیحوں میں ہے، جو الفاظ وہ ابن الصلاح نے پہلے ہی اپنی احادیث کلیہ میں بیہقی کی سند کا حوالہ دیتے ہوئے دیا ہے۔ اس کی جڑ ابن جریج کی معرفت دو صحیحوں میں ہے ابن ابی ملیکہ سے ابن عباس سے - 'اگر لوگوں کو ان کے دعوے سے دیا جائے تو کچھ دوسروں کے خون اور مال کا دعویٰ کریں گے لیکن قسم اس کی ہے جس کے خلاف دعویٰ کیا گیا ہے' - اور وہ نافع بن عمر الجمعی کے ذریعے بھی ابن ابی ملیکہ سے نبی اکرم سے روایت کرتے ہیں۔ مدعا علیہ، جبکہ اسماعیلی نے اپنی صحیح میں ولید بن مسلم سے ابن جریج سے ابن ابی ملیکہ سے ابن عباس سے، 'مطلب کرنے والے پر دلیل اور جس سے مانگی ہے اس پر قسم' ہے۔ حدیث میں فیصلے کا عظیم قاعدہ بیان کیا گیا ہے - صرف دعوے ہی فیصلہ کن تھے، کچھ دوسروں کے خون اور جائیداد کا دعویٰ کریں گے، اس لیے ثبوت دعویٰ کرنے والے پر اور قسم منکر پر لازم ہے ⁦(جامع العلوم والحکم صفحہ 684-697)⁩۔"
