label: { ar: "الموطأ 619 — مالك: لم أر أحداً من أهل العلم يكره أن يصلى على ولد الزنا وأمه", en: "Muwatta 619", es: "Muwatta 619", fr: "Muwatta 619", ur: "موطا 619", tr: "El-Muvatta 619 — Malik: Alimler arasında zina sonucu doğan çocuk ve annesi için namaz kılmayı hoş karşılamayan kimseyi görmedim.", id: "Al-Muwatta 619 — Malik: Aku belum pernah melihat seorang pun di antara para ulama yang tidak menyukai shalat untuk anak hasil zina dan ibunya." }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول: لم أر أحداً من أهل العلم يكره أن يُصلى على ولد الزنا وأمه. ويذكر المحقق أن تخريجه ضمن تخريج الذي قبله. {cite:muwatta-maruf-1997 p.316}"
  tr: "Yahya şöyle diyor: Malik'in şöyle dediğini duydum: \"Evlilik dışı doğan çocuk ve annesi için dua etmeyi hoş karşılamayan hiçbir âlim görmedim.\" Editör, bunun önceki hadiste yer aldığını belirtiyor. {cite:muwatta-maruf-1997 s.316}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Saya belum pernah melihat seorang ulama pun yang tidak menyukai berdoa untuk anak yang lahir di luar nikah dan ibunya. Editor menyebutkan bahwa ini termasuk dalam hadits sebelumnya. {cite:muwatta-maruf-1997 p.316}"
