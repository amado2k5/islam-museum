label: { ar: "الموطأ 298 — جعفر بن محمد عن أبيه: خطب خطبتين يوم الجمعة وجلس بينهما", en: "Muwatta 298", es: "Muwatta 298", fr: "Muwatta 298", ur: "موطا 298", tr: "El-Muvatta 298 — Cafer ibn Muhammed, babasının rivayetine göre: Cuma günü iki hutbe verdi ve ikisinin arasına oturdu.", id: "Al-Muwatta 298 — Ja'far bin Muhammad, berdasarkan riwayat ayahnya: Dia menyampaikan dua khutbah pada hari Jumat dan duduk di antara keduanya." }
text: "خطب خطبتين يوم الجمعة وجلس بينهما"
summary:
  ar: "يرويه مالك عن جعفر بن محمد الصادق عن أبيه محمد الباقر مرسلاً، في باب القراءة في صلاة الجمعة والاحتباء ومن تركها من غير عذر: خطب النبي خطبتين يوم الجمعة وجلس بينهما. وينقل المحقق عن ابن عبد البر أن جماعة رواة الموطأ رووه مرسلاً وأنه يتصل من وجوه ثابتة من غير حديث مالك ⁦(التمهيد 2/165)⁩، ويذكر أن الشافعي والبيهقي أخرجاه عن جعفر عن أبيه عن جابر، وأنه مخرّج من حديث ابن عمر عند البخاري ومسلم (3/9) والترمذي (506) وابن ماجه والنسائي وغيرهم. {cite:muwatta-maruf-1997 p.169}"
  tr: "Malik, Cuma namazında dizleri göğse çekerek oturarak yapılan Kur'an okuma ve mazeretsiz olarak bunu yapmama bölümünde, Cafer ibn Muhammed el-Sadık'tan, babası Muhammed el-Baqir'den rivayetle, mursal bir hadis olarak nakletmiştir: Peygamberimiz Cuma günü iki hutbe verdi ve aralarında oturdu. Araştırmacı, İbn Abd el-Barr'ın, el-Muvatta'nın bir grup ravisinin bunu mursal bir hadis olarak naklettiğini ve Malik'in hadisinden başka sahih rivayet zincirleriyle de bağlantılı olduğunu söylediğini aktarmaktadır (el-Tamhid 2/165). Şafiî ve Beyhaki'nin bunu Cafer'den, onun babasından, Cabir'den rivayetle kabul ettiklerini ve İbn Ömer'in hadisinde Buhari, Müslim (3/9), Tirmizi (506), İbn Mâce, Nesai ve diğerlerinde yer aldığını belirtiyor. {cite:muwatta-maruf-1997 s.169}"
  id: "Malik meriwayatkannya dari Ja'far ibn Muhammad al-Sadiq, dari ayahnya Muhammad al-Baqir, sebagai hadits mursal, dalam surah tentang bacaan shalat Jumat, duduk dengan lutut ditarik ke dada, dan orang yang meninggalkannya tanpa alasan: Nabi menyampaikan dua khutbah pada hari Jumat dan duduk di antara keduanya. Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa sekelompok perawi al-Muwatta' meriwayatkannya sebagai hadits mursal, dan bahwa hadits ini terhubung melalui sanad yang sahih selain hadits Malik (al-Tamhid 2/165). Ia menyebutkan bahwa al-Shafi'i dan al-Bayhaqi memasukkannya berdasarkan riwayat Ja'far, berdasarkan riwayat ayahnya, berdasarkan riwayat Jabir, dan bahwa hadits ini terdapat dalam hadits Ibnu Umar dalam al-Bukhari, Muslim (3/9), al-Tirmidhi (506), Ibnu Majah, al-Nasa'i, dan lainnya. {cite:muwatta-maruf-1997 p.169}"
