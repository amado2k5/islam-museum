text: "خطب خطبتين يوم الجمعة وجلس بينهما"
summary:
  ar: "يرويه مالك عن جعفر بن محمد الصادق عن أبيه محمد الباقر مرسلاً، في باب القراءة في صلاة الجمعة والاحتباء ومن تركها من غير عذر: خطب النبي خطبتين يوم الجمعة وجلس بينهما. وينقل المحقق عن ابن عبد البر أن جماعة رواة الموطأ رووه مرسلاً وأنه يتصل من وجوه ثابتة من غير حديث مالك (التمهيد 2/165)، ويذكر أن الشافعي والبيهقي أخرجاه عن جعفر عن أبيه عن جابر، وأنه مخرّج من حديث ابن عمر عند البخاري ومسلم (3/9) والترمذي (506) وابن ماجه والنسائي وغيرهم. {cite:muwatta-maruf-1997 p.169}"
