text: |-
  ٤٨٤
  رعى.
  فأرضانى وراضانى فلان فرضوته أرضوه بالضم اذا غلبته فيه لانه من الواو وانماقالوا
  رضيت عنه رضاوان كان من الواوكما قالواشبع شبعا وقالوارذي لسكان المكسروحه
  أن يقال رضو ورضوى جبل بالمدينة والنسبة البه رضوى ⁦(رطا)⁩ الارطى شجر
  من شجرالرمل وهو أفعل من وجه وفعلى من وجه لانهم يقولون أديم مأروط اذادبخ بورقه
  وية ولون أديم مرطى" وقد أرطت الارض اذا أخرجت الارطى والواحدة أرطاة ولحوق
  إتاه التأنيث له يدلّ عسلى أنّ الالف ليست لمتأنيث وانماهى للالحاق أوبن الاسم عليها قال
  الشاعر يسف ذتبا
  لمارأى أن لادعه ولاشبع • مال الى أرطاة حقف فأضطبع
  وراطية اسم موضع وكذك أراط وهو فى شعر عم روبن كلنوم
  وتحن الحابسون بذى أراط * تسف الجلة الخور الدرينا
  عى الرعى بالكسر الكللً وبالفتح المصدر والمرعى الرعى والموضع والمصدروف المثل
  مرعى ولا كالسعدان والراعى بجعه رعاة مثل قأض وقضاة ورعيان مثل شاب وشبان ورعاه
  مثل جائع وجياع وفلان يرعى على أبيه أى يرعى غنمه والراعى اقب هبيد بن الحصير النميرى
  الشاء رقال الفراء رجل ترعية وترعية بكسر التاء وضمها والياء مشددة فيهماللذى بجيا
  عية الابل ويقال أيضارجسل ترعاية فى معنى ترعية والرعادى والرعاوى بفتح الرام ونمه
  الابل التى ترمى حوالى القوم وديارهم لانها الابل التى يعتمل عليها قالت امر أة من العرب
  نعاتب زوجها
  تمششتى -ق اذا ماتركتنى * كنذ والرعاوى قلت انى ذاهب
  وراعيت الامر نظرت الى أين يصير وراعيته لا حفته وراعيته من هى اعاة الحقوق ويقال
  المماريراعى المهرأى يرعى معها قال أبو ذؤيب
  من وحش حوضى براعى الصيدمنة.ذا * كانه كوكب فى الجو محرد
  واسترعيته الشئ فرعاه وفى المثل من استرعى الذقب فقد ظلم والراعى الوالى والرعية العسامة
  يقال ليس المرعىّ كالراعى ورعاير عو أى كف عن الاموريقسال فلان حسن الرعوة والرعوة
  والرعوى والارعراء وقدارعوى عن القيح وتق-ديره افعول ووزته افعلل واغالم يدغم
  مليه اذا أبقيت علسه وترحنه وأرعيته سهى أى أصفيت اليه ومنه قوله نعالى راعنا
  قال الاخفس هوفا علنا من المراعاة على معنى أرعنا سمعك ولكن اليساءذهبت للامر ويقسال
  راعنا بالتنوين ع لى اعمال القول فيه كانه قال لا تقولواحقا ولاتولواهجرا وهو من الرعونة
  ورعى الاميررعيته رعاية ورعيت الابلى أرعاهار عيادرى البعير الكلاً وارتعى مثله ورعين
  النجيوم رقبتها قالت الخنساء
  أرعى النجوم وما كافت رعيتها • وتارة أتعشى فضل أطمارى
  ابن السكبت يقال رعيت عليه رمتسه رعاية وأرعى اللّٰه الماشية أى أنبت لهنا ما ترعاه
  قال الشاعر
  كأنها ظبية تعطو الى فنى • تأكل من طيب واللّٰه يرعيها
