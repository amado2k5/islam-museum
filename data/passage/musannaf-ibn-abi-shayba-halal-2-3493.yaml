text: "… بذَنوب من نبيذ السقاية، فشربه. - في المحرم يَدُلُّ الحلال على الصيد - حدثنا أبو بكر قال: حدثنا يحيى بن زكريا عن ابن أبي زائدة عن ابن جُرَيج عن عطاء قال: إن دَلَّ حرام حلالاً على صيد فلم يأخذه، فليستغفر …"
