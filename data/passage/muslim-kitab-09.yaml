summary:
  ar: "القسم 9 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة الاستسقاء‏»، ويضم فيها النصوص من 2070 إلى 2088 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 9 of Sahih Muslim (The Book of Prayer - Rain) in the division of the open hadith dataset the museum took its reports from: reports 2070 to 2088 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 9، عنوان «کتاب صلاۃ الاستسقاء‏»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2070 تا 2088۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 9 de Sahih Muslim (El Libro de la Oración - Lluvia) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2070 al 2088 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre de la prière – Pluie), dans la section 9 de la base de données ouverte: les hadiths 2070 à 2088 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 9. bölümü \"Yağmur Duası Kitabı\" başlığını taşımakta olup, 2070 ile 2088 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 9 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Doa Memohon Hujan\" dan berisi teks 2070 hingga 2088, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
