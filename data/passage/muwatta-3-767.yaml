ref: "767"
label: { ar: "الموطأ 767 — ابن عمر: حمل عمر على فرس في سبيل الله فأراد أن يبتاعه، فقال النبي: لا تبتعه ولا تعد في صدقتك", en: "Muwatta 767", es: "Muwatta 767", fr: "Muwatta 767", ur: "موطا 767", tr: "El-Muvatta 767 — İbn Ömer: Ömer, Allah rızası için bir atı sadaka olarak verdi ve onu geri almak istedi. Bunun üzerine Peygamber şöyle buyurdu: \"Onu geri alma ve sadakandan dönme.\"", id: "Al-Muwatta 767 — Ibn Umar: Umar memberikan seekor kuda sebagai sedekah karena Allah dan ingin membelinya kembali, lalu Nabi bersabda: Jangan membelinya kembali dan jangan mengingkari sedekahmu" }
text: "لا تبتعه ولا تعد في صدقتك"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن عمر بن الخطاب حمل على فرس في سبيل الله فأراد أن يبتاعه، فسأل عن ذلك النبي فنهاه أن يبتاعه أو يعود في صدقته. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (5124) والبغوي، وإسماعيل بن أبي أويس عند البخاري (2971)، والقعنبي عند أبي داود (1593)، والتنيسي عند البخاري (3002)، وابن القاسم، وقتيبة، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم (5/63)، وينقل عن ابن عبد البر ⁦(التمهيد 14/74–75)⁩ أن مالكاً جعله من مسند ابن عمر عند جمهور الرواة، وأن معن بن عيسى رواه عن مالك عن نافع عن ابن عمر عن عمر فجعله من مسند عمر، وأن الدارقطني في العلل صوب رواية الموطأ. {cite:muwatta-maruf-1997 p.379} {cite:muwatta-maruf-1997 p.380}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Ömer ibn el-Hattab Allah yolunda sadaka olarak bir at vermiş ve sonra onu geri almak istemiştir. Peygamberimize bu konuda danışmış, Peygamberimiz de ona atı geri almasını veya sadakasını geri çekmesini yasaklamıştır. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab aracılığıyla İbn Hibban (5124), el-Baghawi, İsmail ibn Abi Uways (Buhari, 2971), el-Ka'nebi (Ebu Davud, 1593), el-Tunisi (Buhari, 3002), İbn el-Kâsim, Kuteybe, Şafiî ve Yahya ibn Yahya el-Naysaburi (Müslim, 5/63) tarafından nakledildiğini belirtmektedir. İbn Abdül-Barr'dan (el-Tamhid 14/74-75) alıntı yaparak, Malik'in bunu çoğunluk rivayetine göre İbn Ömer'in Musned'ine dahil ettiğini ve Ma'n ibn İsa'nın da bunu Malik'ten, o da Nafi'den, o da İbn Ömer'den, o da Ömer'den rivayet ederek Ömer'in Musned'ine dahil ettiğini söyler. El-Daraqutni, el-İlal'de el-Muvatta'daki rivayetin doğru olduğunu kabul etmiştir. {cite:muwatta-maruf-1997 s.379} {cite:muwatta-maruf-1997 s.380}"
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar bahwa Umar ibn al-Khattab memberikan seekor kuda sebagai sedekah di jalan Allah dan kemudian ingin membelinya kembali. Dia bertanya kepada Nabi tentang hal itu, dan Nabi melarangnya untuk membelinya kembali atau mengambil kembali sedekahnya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan melalui dia oleh Ibn Hibban (5124), al-Baghawi, Ismail ibn Abi Uways dalam al-Bukhari (2971), al-Qa’nabi dalam Abu Dawud (1593), al-Tunisi dalam al-Bukhari (3002), Ibn al-Qasim, Qutaybah, al-Shafi’i, dan Yahya ibn Yahya al-Naysaburi dalam Muslim (5/63). Ia mengutip Ibnu Abd al-Barr (al-Tamhid 14/74–75) yang mengatakan bahwa Malik memasukkannya ke dalam Musnad Ibnu Umar menurut mayoritas perawi, dan bahwa Ma’n ibn Isa meriwayatkannya atas otoritas Malik atas otoritas Nafi’ atas otoritas Ibnu Umar atas otoritas Umar, sehingga memasukkannya ke dalam Musnad Umar. Al-Daraqutni, dalam al-‘Ilal, menganggap riwayat dalam al-Muwatta’ sebagai riwayat yang benar. {cite:muwatta-maruf-1997 p.379} {cite:muwatta-maruf-1997 p.380}"
