label: { ar: "الموطأ 767 — ابن عمر: حمل عمر على فرس في سبيل الله فأراد أن يبتاعه، فقال النبي: لا تبتعه ولا تعد في صدقتك", en: "Muwatta 767" }
text: "لا تبتعه ولا تعد في صدقتك"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن عمر بن الخطاب حمل على فرس في سبيل الله فأراد أن يبتاعه، فسأل عن ذلك النبي فنهاه أن يبتاعه أو يعود في صدقته. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (5124) والبغوي، وإسماعيل بن أبي أويس عند البخاري (2971)، والقعنبي عند أبي داود (1593)، والتنيسي عند البخاري (3002)، وابن القاسم، وقتيبة، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم (5/63)، وينقل عن ابن عبد البر (التمهيد 14/74–75) أن مالكاً جعله من مسند ابن عمر عند جمهور الرواة، وأن معن بن عيسى رواه عن مالك عن نافع عن ابن عمر عن عمر فجعله من مسند عمر، وأن الدارقطني في العلل صوب رواية الموطأ. {cite:muwatta-maruf-1997 p.379} {cite:muwatta-maruf-1997 p.380}"
