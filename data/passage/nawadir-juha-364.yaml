label: { ar: "نوادر جحا الكبرى، ص 180 — «اسألني فأسألها وأجيبك»", en: "Nawadir Juha al-Kubra, p. 180 — 'Ask Me, and I Will Ask Her and Answer You'", ur: "نوادر جحا الکبریٰ، ص 180 — «مجھ سے پوچھو، میں اس سے پوچھ کر تمہیں جواب دوں گا»", fr: "Nawadir Juha al-Kubra, p. 180 — « Demande-moi, je lui demanderai et je te répondrai »", es: "Nawadir Juha al-Kubra, p. 180 — «Pregúntame, yo le preguntaré a ella y te responderé»", tr: "Juha'nın Büyük Fıkraları, s. 180 — “Bana sor, ben de ona sorayım ve sana cevap vereyim.”", id: "Anekdot Hebat Juha, hlm. 180 — “Tanyakan padaku, dan aku akan bertanya padanya dan menjawabmu.”" }
text: "… اسألْني فأسألُها وأُجيبُك ذهبت أمرأتُهُ مع بعض النساء، لغسل الثياب، على شاطىء البحيرة، في آق شَهْرْ وإذا بأحد أعيان البلدة قد خرج للتنزه، وطفِقَ يُطِيل النظر إلى النسوة، فقالت له زوجة جحا: لماذا تنظر إلينا أيها السافل؟ فسأل الوجيه خادمه: …"
summary:
  ar: "كانت زوجة جحا تغسل الثياب عند بحيرة آق شهر فأهانها وجيه، وسأل خادمه من هي، وفي اليوم التالي استدعى جحا وطلب منه أن يرسل زوجته إليه، فقال جحا «اسألني فأسألها وأجيبك». {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  en: "Juha's wife washes clothes at the Akshehir lake; a notable insults her; the notable asks his servant who she is; the next day he calls Juha and asks him to send his wife to him; Juha says 'ask me, and I will ask her and answer you'. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  ur: "جحا کی بیوی آق شہر کی جھیل پر کپڑے دھو رہی تھی کہ ایک معزز آدمی نے اس کی توہین کی اور اپنے نوکر سے پوچھا کہ یہ کون ہے، اگلے دن اس نے جحا کو بلایا اور کہا کہ اپنی بیوی کو اس کے پاس بھیج دے، تو جحا نے کہا «مجھ سے پوچھو، میں اس سے پوچھ کر تمہیں جواب دوں گا»۔ {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  fr: "La femme de Juha lave du linge au lac d'Akshehir ; un notable l'insulte ; il demande à son serviteur qui elle est ; le lendemain, il convoque Juha et lui demande de lui envoyer sa femme ; Juha dit : « Demande-moi, je lui demanderai et je te répondrai ». {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  es: "La esposa de Juha lava ropa en el lago de Akshehir; un notable la insulta; pregunta a su criado quién es ella; al día siguiente llama a Juha y le pide que le envíe a su esposa; Juha dice: «Pregúntame, yo le preguntaré a ella y te responderé». {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  tr: "Cüha'nın karısı Akşir Gölü'nde çamaşır yıkarken, Vacih ona hakaret etti ve hizmetçisine kim olduğunu sordu. Ertesi gün Cüha'yı çağırdı ve karısını kendisine göndermesini istedi. Cüha, \"Bana sor, ben de ona sorayım ve sana cevap vereyim\" diye yanıtladı. {cite:juha-nawadir-kubra-djuwaydi s. 180}"
  id: "Istri Juha sedang mencuci pakaian di Danau Aqsheer ketika Wajih menghinanya dan bertanya kepada pelayannya siapa dia. Keesokan harinya, dia memanggil Juha dan menuntut agar dia mengirim istrinya kepadanya. Juha menjawab, \"Tanyakan padaku, dan aku akan bertanya padanya dan menjawabmu.\" {cite:juha-nawadir-kubra-djuwaydi p. 180}"
