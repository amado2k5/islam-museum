text: "… عَائِشَةَ زَوْجَ النَّبِيِّ فَقَالَ لَهَا لَقَدْ شَقَّ عَلَىَّ اخْتِلاَفُ أَصْحَابِ النَّبِيِّ فِي أَمْرٍ إِنِّي لأُعْظِمُ أَنْ أَسْتَقْبِلَكِ بِهِ. فَقَالَتْ مَا هُوَ مَا كُنْتَ سَائِلاً عَنْهُ أُمَّكَ فَسَلْنِي عَنْهُ. فَقَالَ الرَّجُلُ يُصِيبُ أَهْلَهُ ثُمَّ يُكْسِلُ وَلاَ يُنْزِلُ فَقَالَتْ إِذَا جَاوَزَ الْخِتَانُ الْخِتَانَ فَقَدْ وَجَبَ الْغُسْلُ. فَقَالَ أَبُو مُوسَى الأَشْعَرِيُّ لاَ أَسْأَلُ عَنْ هَذَا أَحَدًا بَعْدَكِ أَبَدًا."
summary:
  ar: "حديث في موطأ مالك، رقم 104، يذكر الجراحة والختان والجبائر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 104 (Purity), that mentions surgery, circumcision and splints. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 104، جس میں جراحت، ختنہ اور پٹیاں کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
