text: "ابن نمير عن مالك عن طلحة عن خيثمة قال: إن اللّٰه ليطرد بالرجل الشيطان من الأدور. - حدثنا معاوية بن هشام عن سفيان عن رجل عن خيثمة قال: إنه أوصى أن يدفن في مقبرة فقراء قومه. - حدثنا ابن نمير …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 167، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 167, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 167 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento del Musannaf de Ibn Abi Shayba, volumen 1, pág. 167, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 1, page 167, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 1. cildinin 167. sayfasından, vasiyetname, defin, mezar ve istirahat yerinden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, Miras, Antik Eserler ve İstirahat Yerleri Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Ibn Abi Shaybah, Volume 1, halaman 167, yang menyebutkan wasiat atau surat wasiat terakhir, pemakaman, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Peramban Wasiat, Warisan, Barang Antik, dan Tempat Peristirahatan."
