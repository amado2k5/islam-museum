label: { ar: "جامع الترمذي 3169 — ضحك وتبسم", en: "Jami' al-Tirmidhi 3169 — laughter and smiling", ur: "جامع ترمذی 3169 — ہنسی اور تبسم", fr: "Jami' al-Tirmidhi 3169 — rire et sourire", es: "Jami' al-Tirmidhi 3169 — risa y sonrisa", tr: "Cami' el-Tirmizi 3169 — Kahkaha ve Gülümseme", id: "Jami' al-Tirmidhi 3169 — Tawa dan Senyum" }
text: "… ابْعَثْ بَعْثَ النَّارِ. فَيَقُولُ يَا رَبِّ وَمَا بَعْثُ النَّارِ فَيَقُولُ مِنْ كُلِّ أَلْفٍ تِسْعُمِائَةٍ وَتِسْعَةٌ وَتِسْعُونَ إِلَى النَّارِ وَوَاحِدٌ فِي الْجَنَّةِ . فَيَئِسَ الْقَوْمُ حَتَّى مَا أَبْدَوْا بِضَاحِكَةٍ فَلَمَّا رَأَى رَسُولُ اللَّهِ الَّذِي بِأَصْحَابِهِ قَالَ اعْمَلُوا وَأَبْشِرُوا فَوَالَّذِي نَفْسُ مُحَمَّدٍ بِيَدِهِ إِنَّكُمْ لَمَعَ خَلِيقَتَيْنِ مَا كَانَتَا مَعَ شَيْءٍ إِلاَّ كَثَّرَتَاهُ يَأْجُوجُ وَمَأْجُوجُ وَمَنْ مَاتَ مِنْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3169، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 3169, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 3169، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 3169, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 3169, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Cami' el-Tirmizi'de yer alan 3169 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3169, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
