text: "جامع العلوم والحكم وروى مجاهد عن ابنِ عباس : أنَّ رجلاً قال له : إني طلقت امرأتي ثلاثاً وأنا غضبان، فقال : إنَّ ابنَ عباس لا يستطيع أنْ يُحِلَّ لك ما حرَّم اللّٰه عليك، عصيتَ ربَّك وحرمت عليك امرأتك. خرَّجه …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 358، يذكر ما أُحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 358, that mentions what was made lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 358 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
