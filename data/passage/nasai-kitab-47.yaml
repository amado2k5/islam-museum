summary:
  ar: "القسم 47 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإيمان وشرائعه»، ويضم فيها النصوص من 4985 إلى 5039 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 47 of Sunan al-Nasa'i (The Book Of Faith and its Signs) in the division of the open hadith dataset the museum took its reports from: reports 4985 to 5039 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 47، عنوان «کتاب الایمان وشرائعہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4985 تا 5039۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 47 de Sunan al-Nasa'i (El Libro de la Fe y sus Signos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4985 al 5039, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de la Foi et ses Signes), dans la partie ouverte de ce recueil (rapports 4985 à 5039). Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 47. bölümü \"İman Kitabı ve Kanunları\" başlığını taşımakta olup, 4985'ten 5039'a kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 47 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Iman dan Hukum-hukumnya\" dan berisi teks 4985 hingga 5039, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
