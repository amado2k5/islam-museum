label: { ar: "الموطأ 2031 — يحيى عن مالك: إذا كان المال كثيرا يحمل النفقة، فإذا شخص فيه العامل فله أن يأكل منه ويكتسي بالمعروف من قدر المال، ويستأجر من المال من يكفيه بعض مؤونته فيما لا يعمله هو، كتقاضي الدين ونقل المتاع وشده، وليس له أن ينفق من المال مقيما في أهله", en: "Muwatta 2031", es: "Muwatta 2031", fr: "Muwatta 2031", ur: "موطا 2031", tr: "El-Muvatta 2031 — Yahya, Malik'ten rivayet ettiğine göre: Eğer para, masrafları karşılamaya yetecek kadar bol ise ve işçi bu parayla çalışıyorsa, paranın miktarına göre makul ölçüde yemek yiyebilir ve giyinebilir. Ayrıca, kendisinin yapmadığı işlerde, örneğin alacak tahsilatı, mal taşıma ve paketleme gibi işlerde, masraflarının bir kısmını karşılamak için paradan birini tutabilir. Ancak ailesiyle birlikte yaşadığı süre boyunca paradan harcama yapmasına izin verilmez.", id: "Al-Muwatta 2031 — Yahya berdasarkan riwayat Malik: Jika uangnya cukup untuk menutupi pengeluaran, dan pekerja tersebut dipekerjakan dari uang itu, maka ia boleh makan dan berpakaian secukupnya sesuai dengan jumlah uang tersebut. Ia juga boleh mempekerjakan seseorang dari uang itu untuk menutupi sebagian pengeluarannya dalam hal-hal yang tidak ia lakukan sendiri, seperti menagih hutang, mengangkut barang, dan mengemasnya. Ia tidak diperbolehkan membelanjakan uang tersebut selama tinggal bersama keluarganya." }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا: إنه إذا كان المال كثيرا يحمل النفقة، فإذا شخص فيه العامل، فإن له أن يأكل منه، ويكتسي بالمعروف من قدر المال، ويستأجر من المال، إذا كان كثيرا لا يقوى عليه، بعض من يكفيه بعض مؤونته. ومن الأعمال أعمال لا يعملها الذي يأخذ المال، وليس مثله يعملها، من ذلك تقاضي الدين، ونقل المتاع، وشده وأشباه ذلك، فله أن يستأجر من المال من يكفيه ذلك. وليس للمقارض أن يستنفق من المال، ولا يكتسي منه، ما كان مقيما في أهله، إنما يجوز له النفقة إذا شخص في المال، وكان المال يحمل النفقة. فإن كان إنما يتجر في المال في البلد الذي هو به مقيم، فلا نفقة له من المال ولا كسوة. {cite:muwatta-maruf-1997 p.230} {cite:muwatta-maruf-1997 p.231}"
  tr: "Yahya şöyle dedi: Malik, kâr paylaşımı ortaklığı için başka bir adama para veren bir kişi hakkında şöyle dedi: Eğer para masrafları karşılamaya yeterliyse ve işçi onunla seyahat ediyorsa, ondan yemek yiyebilir, sermayenin sınırları dahilinde uygun şekilde giyinebilir ve eğer para onun yönetebileceğinden fazlaysa, masraflarının bir kısmını karşılamak için paradan birini işe alabilir. Parayı alan kişinin yapamayacağı ve normalde yapamayacağı işler vardır; örneğin alacak tahsilatı, mal taşıma ve paketleme gibi işler. Bu gibi durumlarda, bu işleri karşılamak için paradan birini işe alabilir. Ortaklıktaki ortak, ailesiyle birlikte yaşadığı süre boyunca paradan harcama yapamaz veya giysi satın alamaz. Sadece parayla seyahat ediyorsa ve sermaye masrafları karşılamaya yeterliyse harcama yapmasına izin verilir. Eğer sadece yaşadığı şehirde parayla ticaret yapıyorsa, paradan hiçbir masraf veya giysi hakkı yoktur. {cite:muwatta-maruf-1997 s.230} {cite:muwatta-maruf-1997 s.231}"
  id: "Yahya berkata: Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain untuk kemitraan bagi hasil: Jika uang tersebut cukup untuk menutupi pengeluaran, dan pekerja tersebut bepergian dengan uang itu, ia boleh makan dari uang itu, berpakaian dengan layak sesuai dengan batas modal, dan mempekerjakan seseorang dari uang itu, jika jumlahnya terlalu besar untuk ia kelola, untuk menutupi sebagian pengeluarannya. Ada tugas-tugas yang tidak dapat dilakukan oleh penerima uang, dan biasanya tidak mampu dilakukan, seperti menagih hutang, mengangkut dan mengemas barang, dan tugas-tugas serupa. Dalam kasus seperti itu, ia boleh mempekerjakan seseorang dari uang itu untuk menutupi tugas-tugas ini. Mitra dalam kemitraan tidak diperbolehkan untuk membelanjakan uang atau membeli pakaian dari uang itu selama tinggal bersama keluarganya. Ia hanya diperbolehkan membelanjakan uang itu jika ia bepergian dengan uang itu dan modalnya cukup untuk menutupi pengeluaran. Jika ia hanya berdagang dengan uang itu di kota tempat ia tinggal, ia tidak berhak atas pengeluaran atau pakaian apa pun dari uang itu. {kutip:muwatta-maruf-1997 hal.230} {kutip:muwatta-maruf-1997 hal.231}"
