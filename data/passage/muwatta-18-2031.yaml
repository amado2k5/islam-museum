label: { ar: "الموطأ 2031 — يحيى عن مالك: إذا كان المال كثيرا يحمل النفقة، فإذا شخص فيه العامل فله أن يأكل منه ويكتسي بالمعروف من قدر المال، ويستأجر من المال من يكفيه بعض مؤونته فيما لا يعمله هو، كتقاضي الدين ونقل المتاع وشده، وليس له أن ينفق من المال مقيما في أهله", en: "Muwatta 2031" }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا: إنه إذا كان المال كثيرا يحمل النفقة، فإذا شخص فيه العامل، فإن له أن يأكل منه، ويكتسي بالمعروف من قدر المال، ويستأجر من المال، إذا كان كثيرا لا يقوى عليه، بعض من يكفيه بعض مؤونته. ومن الأعمال أعمال لا يعملها الذي يأخذ المال، وليس مثله يعملها، من ذلك تقاضي الدين، ونقل المتاع، وشده وأشباه ذلك، فله أن يستأجر من المال من يكفيه ذلك. وليس للمقارض أن يستنفق من المال، ولا يكتسي منه، ما كان مقيما في أهله، إنما يجوز له النفقة إذا شخص في المال، وكان المال يحمل النفقة. فإن كان إنما يتجر في المال في البلد الذي هو به مقيم، فلا نفقة له من المال ولا كسوة. {cite:muwatta-maruf-1997 p.230} {cite:muwatta-maruf-1997 p.231}"
