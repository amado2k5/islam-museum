label: { ar: "صحيح مسلم 1838 — الأب والأبوة", en: "Sahih Muslim 1838 — the father and fatherhood", ur: "صحیح مسلم 1838 — باپ اور والدیت", es: "Sahih Muslim 1838 — El padre y la paternidad", fr: "Sahih Muslim 1838 — le père et la paternité", tr: "Sahih Muslim 1838 — Baba ve Babalık", id: "Sahih Muslim 1838 — Sang Ayah dan Peran Ayah" }
text: "وَحَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا عَبْدَةُ، وَأَبُو مُعَاوِيَةَ عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ كَانَ النَّبِيُّ يَسْتَمِعُ قِرَاءَةَ رَجُلٍ فِي الْمَسْجِدِ. فَقَالَ \" لَقَدْ أَذْكَرَنِي آيَةً كُنْتُ أُنْسِيتُهَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1838، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1838 (The Book of Prayer - Travellers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1838، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 1838 (El Libro de la Oración - Viajeros), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 1838 (Le Livre de la prière – Les voyageurs), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 1838 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 1838, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
