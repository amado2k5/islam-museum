text: "… امتلاء، فصد من عروق الرجل، وحجم الساقين، فإذا سكن القيء استفرغ السوداء بأدوية من الهليلج الأسود، والأفتيمون، والغاريقون، والملح الهندي، وإن اضطر الأمر إلى سقي دهن الخروع مع أيارج فيقرا، وأفتيمون فعلت. ولو كان بالطحال علّة وجع، عولج الطحال. والذي …"
