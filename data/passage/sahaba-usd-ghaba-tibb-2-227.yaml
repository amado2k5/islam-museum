text: "… هذا الصواب، يعني قيس بن الحارث، وقد ذكرناه في إني لأرجو شفاءه فيما ينفعه في رحله، هل معك من قيس. هذه التمرة العجوة شيء؟ قال: نعم، فصنع له أخرجه ابن منده وأبو نعيم. الفَرِيقَةَ، خلط له التمر بالحلبة، ثم أوسعها …"
