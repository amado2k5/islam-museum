text: "… ومَعَنا وائل بن حجر فأخَذَهُ عَدقٌ لهُ، فتحرَّج الناسُ أنْ يَخْلِفُوا، وحَلفْتُ أنَّه أخِى. فَخُلِّى عنه فأتَيْنا رسولَ اللّٰه وَيف، فذكرتُ ذَلكَ له. فقال : أنْتَ كنتَ أبَرَّهم وأصْدَقَهُم، صَدَقْتَ، المُسْلِمُ أخُو المُسْلم. وروى الإمام أحمد وأبو داود عن ابن …"
