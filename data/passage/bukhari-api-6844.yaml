label: { ar: "صحيح البخاري 6844 — الأب والأبوة", en: "Sahih al-Bukhari 6844 — the father and fatherhood", ur: "صحیح بخاری 6844 — باپ اور والدیت", es: "Sahih al-Bukhari 6844 — El padre y la paternidad", fr: "Sahih al-Bukhari 6844 — Le père et la paternité" }
text: "حَدَّثَنَا إِسْمَاعِيلُ، حَدَّثَنِي مَالِكٌ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ جَاءَ أَبُو بَكْرِ ـ وَرَسُولُ اللَّهِ وَاضِعٌ رَأْسَهُ عَلَى فَخِذِي فَقَالَ حَبَسْتِ رَسُولَ اللَّهِ وَالنَّاسَ، وَلَيْسُوا عَلَى مَاءٍ. فَعَاتَبَنِي، وَجَعَلَ يَطْعُنُ بِيَدِهِ فِي خَاصِرَتِي، وَلاَ يَمْنَعُنِي مِنَ التَّحَرُّكِ إِلاَّ مَكَانُ رَسُولِ اللَّهِ فَأَنْزَلَ اللَّهُ آيَةَ التَّيَمُّمِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6844، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6844 (Limits and Punishments set by Allah (Hudood)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6844، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6844 (Límites y castigos establecidos por Alá (Hudud)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 6844 (Limites et châtiments fixés par Allah (Hudood)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
