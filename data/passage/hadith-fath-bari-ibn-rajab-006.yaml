text: "كله مسجد. وروى الأزرقي بإسناده، عن أبي هريرة قال: إنا لنجد في كتاب الله أن حد المسجد الحرام من الحزورة (٥) إلى المسعى. وبإسناده، عن عبد الله بن عمرو قال: أساس المسجد الحرام الذي وضعه إبراهيم عليه السلام: من الحزورة"
