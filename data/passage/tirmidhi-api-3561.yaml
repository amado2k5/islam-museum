text: "… حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نَافِعٍ الصَّائِغُ، قِرَاءَةً عَلَيْهِ عَنْ حَمَّادِ بْنِ أَبِي حُمَيْدٍ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، عَنْ عُمَرَ بْنِ الْخَطَّابِ، أَنَّ النَّبِيَّ بَعَثَ بَعْثًا قِبَلَ نَجْدٍ فَغَنِمُوا غَنَائِمَ كَثِيرَةً وَأَسْرَعُوا الرَّجْعَةَ فَقَالَ رَجُلٌ مِمَّنْ لَمْ يَخْرُجْ مَا رَأَيْنَا بَعْثًا أَسْرَعَ رَجْعَةً وَلاَ أَفْضَلَ غَنِيمَةً مِنْ هَذَا الْبَعْثِ. فَقَالَ النَّبِيُّ \" أَلاَ أَدُلُّكُمْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3561، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3561 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3561، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3561 (Capítulos sobre la súplica), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3561 (Chapitres sur l'invocation), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
