label: { ar: "صحيح البخاري 1284 — تعزية ومواساة وصبر عند المصيبة", en: "Sahih al-Bukhari 1284 — condolence, consolation and patience at a loss", ur: "صحیح البخاری 1284 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Sahih al-Bukhari 1284 — des condoléances, une consolation et la patience devant la perte", es: "Sahih al-Bukhari 1284 — condolencias, consuelo y paciencia ante la pérdida" }
text: "… زَيْدٍما ـ قَالَ أَرْسَلَتِ ابْنَةُ النَّبِيِّ إِلَيْهِ إِنَّ ابْنًا لِي قُبِضَ فَائْتِنَا. فَأَرْسَلَ يُقْرِئُ السَّلاَمَ وَيَقُولُ \" إِنَّ لِلَّهِ مَا أَخَذَ وَلَهُ مَا أَعْطَى وَكُلٌّ عِنْدَهُ بِأَجَلٍ مُسَمًّى، فَلْتَصْبِرْ وَلْتَحْتَسِبْ \". فَأَرْسَلَتْ إِلَيْهِ تُقْسِمُ عَلَيْهِ لَيَأْتِيَنَّهَا، فَقَامَ وَمَعَهُ سَعْدُ بْنُ عُبَادَةَ وَمُعَاذُ بْنُ جَبَلٍ وَأُبَىُّ بْنُ كَعْبٍ وَزَيْدُ بْنُ ثَابِتٍ وَرِجَالٌ، فَرُفِعَ إِلَى رَسُولِ اللَّهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1284، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1284 (Funerals (Al-Janaa'iz)), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح البخاری کی حدیث نمبر 1284، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih al-Bukhari, n° 1284, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih al-Bukhari, n.º 1284, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
