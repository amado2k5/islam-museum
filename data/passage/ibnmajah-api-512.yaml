label: { ar: "سنن ابن ماجه 512 — عدد الحسنات", en: "Sunan Ibn Majah 512 — a stated number of good deeds", ur: "سنن ابن ماجہ 512 — نیکیوں کی مقررہ تعداد" }
text: "… عَادَ إِلَى مَجْلِسِهِ فَقُلْتُ أَصْلَحَكَ اللَّهُ أَفَرِيضَةٌ أَمْ سُنَّةٌ الْوُضُوءُ عِنْدَ كُلِّ صَلاَةٍ قَالَ أَوَ فَطِنْتَ إِلَىَّ وَإِلَى هَذَا مِنِّي فَقُلْتُ نَعَمْ. فَقَالَ لاَ لَوْ تَوَضَّأْتُ لِصَلاَةِ الصُّبْحِ لَصَلَّيْتُ بِهِ الصَّلَوَاتِ كُلَّهَا مَا لَمْ أُحْدِثْ وَلَكِنِّي سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" مَنْ تَوَضَّأَ عَلَى كُلِّ طُهْرٍ فَلَهُ عَشْرُ حَسَنَاتٍ \". وَإِنَّمَا رَغِبْتُ فِي الْحَسَنَاتِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 512، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 512 (The Book of Purification and its Sunnah), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 512، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
