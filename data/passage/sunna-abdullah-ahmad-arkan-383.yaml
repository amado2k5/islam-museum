text: "… عن عبد اللّٰه صل فينه قال: الرِّبا بضعٌ وسبعون بابًا، والشِّركُ نحو ذلك - حدثني أبي، ثنا عبد الرحمن بن مهدي، عن سُفيان، عن الأعمش، عن أبي ظَبيان، عن علقمة، عن عبد اللّٰه صينه قال: الصَّبرُ : نصفُ الإيمان، واليقينُ …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 383، يذكر الإيمان بضع وسبعون شعبة، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 383, that mentions faith as seventy-odd branches, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 383 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de Abd Allah ibn Ahmad, pág. 383, que menciona la fe como setenta y tantos brazos, la dulzura y la plenitud de la fe; tomado del escaneo automático, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Sunna d'Abd Allah ibn Ahmad, p. 383, évoquant la foi comme une soixantaine de branches, sa douceur et sa plénitude; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, 383. sayfada yer alan bir alıntıda, yetmişten fazla iman dalından ve imanın tatlılığı ve mükemmelliğinden bahsedilmektedir; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 383, menyebutkan tujuh puluh lebih cabang iman, serta manisnya dan kesempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
