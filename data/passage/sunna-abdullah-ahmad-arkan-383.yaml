  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 383 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
