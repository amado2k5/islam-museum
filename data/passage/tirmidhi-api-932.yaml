label: { ar: "جامع الترمذي 932 — الرخصة، ما لا بأس به", en: "Jami' al-Tirmidhi 932 — the concession (rukhsa); what is said to be no harm", ur: "جامع ترمذی 932 — رخصت، جس میں کوئی مضائقہ نہیں", fr: "Jami' al-Tirmidhi 932 — la dispense (rukhsa) ; ce qui est dit sans inconvénient", es: "Yami' al-Tirmidhi 932 — la dispensa (rukhsa); lo que se dice que no tiene inconveniente", tr: "Cami' el-Tirmizi 932 — İmtiyaz, izin verilen şey", id: "Jami' al-Tirmidhi 932 — Konsesi, apa yang diperbolehkan" }
text: "… عَبْدِ اللَّهِ. قَالَ أَبُو عِيسَى حَدِيثُ ابْنِ عَبَّاسٍ حَدِيثٌ حَسَنٌ. وَمَعْنَى هَذَا الْحَدِيثِ أَنْ لاَ بَأْسَ بِالْعُمْرَةِ فِي أَشْهُرِ الْحَجِّ. وَهَكَذَا قَالَ الشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ. وَمَعْنَى هَذَا الْحَدِيثِ أَنَّ أَهْلَ الْجَاهِلِيَّةِ كَانُوا لاَ يَعْتَمِرُونَ فِي أَشْهُرِ الْحَجِّ فَلَمَّا جَاءَ الإِسْلاَمُ رَخَّصَ النَّبِيُّ فِي ذَلِكَ فَقَالَ \" دَخَلَتِ الْعُمْرَةُ فِي الْحَجِّ إِلَى يَوْمِ الْقِيَامَةِ \". يَعْنِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 932، يرد فيه ذكر الرخصة، وما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 932 (The Book on Hajj), whose wording mentions the concession (rukhsa), what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 932، جس کے الفاظ میں رخصت، جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 932, dont le texte mentionne la dispense (rukhsa), ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 932, cuyo texto menciona la dispensa (rukhsa), lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 932 numaralı hadis, caiz olan ve kabul edilebilir amellerden bahsetmektedir. Bu hadis, farz ameller, ibadetler, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar üzerine araştırma yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 932, menyebutkan amalan yang diperbolehkan dan yang dapat diterima. Hadits ini disusun oleh seorang peneliti mengenai amalan wajib, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
