text: "… عفان وعباس وكتب. قال ابن إسحاق: وحدَّثني صالح بن كَيْسَانَ، عن ابن شهاب الزُّهْرِي، عن عُبَيْدِاللهِ بن عَبْدِاللهِ بن عتبة بن مَسْعُود، قال: لم يُوص رسول اللّٰه لللفي عند موته إلا بستّ: أوصى لِلرَّهَاوِيينَ بجادٌ مائَةِ وَسْقٍ من خيبر، وللدَّارِيّين …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 521، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 521, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 521 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
