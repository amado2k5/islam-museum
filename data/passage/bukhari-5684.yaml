ref: "5684"
label:
  ar: "البخاري 5684 — اسقه عسلاً: صدق الله وكذب بطن أخيك"
  en: "Bukhari 5684 — Give him honey: God spoke true, your brother's belly lied"
  ur: "بخاری 5684 — اسے شہد پلاؤ: اللہ سچ کہتا ہے، تمہارے بھائی کا پیٹ جھوٹ"
  es: "Bukhari 5684 — Dale miel: Dios dijo la verdad, el vientre de tu hermano mintió."
  fr: "Bukhari 5684 — Donne-lui du miel: Dieu a dit vrai, le ventre de ton frère a menti."
  tr: "Buhari 5684 — Ona bal verin: Allah doğruyu söyledi, kardeşinizin midesi ise yalan söyledi."
  id: "Bukhari 5684 — Berikanlah dia madu: Allah berfirman benar, dan perut saudaramu berbohong."
text: "أَنَّ رَجُلاً أَتَى النَّبِيَّ فَقَالَ: أَخِي يَشْتَكِي بَطْنَهُ، فَقَالَ: اسْقِهِ عَسَلاً، ثُمَّ أَتَى الثَّانِيَةَ فَقَالَ: اسْقِهِ عَسَلاً، ثُمَّ أَتَاهُ فَقَالَ: فَعَلْتُ، فَقَالَ: صَدَقَ اللَّهُ وَكَذَبَ بَطْنُ أَخِيكَ، اسْقِهِ عَسَلاً، فَسَقَاهُ فَبَرَأَ"
summary:
  ar: "في كتاب الطب؛ عن أبي سعيد الخدري: جاء رجل فقال أخي يشتكي بطنه فقال النبي اسقه عسلاً، ثم أتى الثانية والثالثة فقال صدق الله وكذب بطن أخيك اسقه عسلاً، فسقاه فبرأ — شاهد «فيه شفاء للناس»."
  en: "In the Book of Medicine, from Abu Sa'id al-Khudri: a man said 'my brother suffers in his belly'; the Prophet said 'give him honey' — again and again — then 'God spoke true and your brother's belly lied'; he drank and was cured. The witness to 'in it is healing for people'."
  ur: "کتاب طب میں ابو سعید خدری سے: ایک آدمی نے کہا میرے بھائی کے پیٹ میں تکلیف ہے، نبی نے فرمایا اسے شہد پلاؤ، بار بار آیا تو فرمایا اللہ سچ کہتا ہے تمہارے بھائی کا پیٹ جھوٹ کہتا ہے، شہد پلاؤ — اسے پلایا تو شفا پا گیا۔"
  es: "En el Libro de la Medicina, de Abu Sa'id al-Khudri: un hombre dijo: «Mi hermano sufre de dolor de estómago». El Profeta dijo: «Dale miel» —una y otra vez—, y entonces: «Dios dijo la verdad y el estómago de tu hermano mentía». Bebió y se curó. El testimonio de que «en ello reside la curación para la gente»."
  fr: "Dans le Livre de la Médecine, d'après Abou Saïd al-Khoudri: un homme dit: « Mon frère souffre de maux de ventre ». Le Prophète dit: « Donne-lui du miel », à plusieurs reprises. Puis: « Dieu a dit vrai, et le ventre de ton frère mentait ». Il but le miel et fut guéri. Ceci témoigne du fait que « le miel est une guérison pour les gens »."
  tr: "Tıp kitabında, Ebu Said el-Hudri'nin rivayetine göre: Bir adam geldi ve dedi ki: \"Kardeşimin midesi ağrıyor.\" Peygamberimiz buyurdu ki: \"Ona bal içirin.\" Sonra adam ikinci ve üçüncü kez geldi ve Peygamberimiz buyurdu ki: \"Allah doğru söylemiştir, kardeşinin midesi yalan söylemiştir. Ona bal içirin.\" Bunun üzerine adam ona bal içirdi ve adam iyileşti. Şahitlik şudur ki: \"Bunda insanlık için şifa vardır.\""
