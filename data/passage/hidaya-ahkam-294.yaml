text: "كتاب الطهارات ويُستحبُّ للمتوضء أن ينويَ الطهارةَ. والوعيدُ: لعدم رؤيتِه سُنَّةً، ومعناه: إن لم يرَ هذا سُنَّةً، فهو مستحِقُّ للوعيد. قال: ويُستحبُّ للمتوضئ أن ينويَ الطهارةَ. فالنيَّةُ في الوضوء سنةٌ عندنا. وعند الشافعي: فرضٌ؛ لأنه عبادةٌ، فلا يصحّ ه بدون …"
