text: |-
  ٥٩٦
  ⁦(باب العين)⁩
  ابن قيم بن كعب بن سعد ومالك بن كعب بن سعد ⁦(زقع)⁩ الزقع أشتضرط الحار وقد زقع
  زقعا ⁦( اع)⁩ الزاع بالتصريك شقاق يكون فى ظاهر القدم وباطنه يقال زلعت قدمه بالكسم
  ترلع زلعا وكذلك اذا كان فى ظاهر الركف فأما اذا كن فى باطنها فهو الكلع وزلعت براحته
  فسدت وتزلعت يده تشفقت قال أبوع ر والمزلع الذى قد انة شر جلدة دمه عن اللحم والزلوع
  وال-لوع صدوع فى عرض الجبل زمزع الزعزعة تحريك الشى يقال زعزء:ه
  فتزعزع وبرح زعزعان وزعزع وزعزاع أى تزعزع الاشيا لشدّبها والجمع زعازع وسيرزعزع
  شديد قال ابن أبى عائذ لهذلى
  وترمد هملجة زعزعاكما • انخرط الحبل فوق المحال
  ⁦(زمع)⁩ قال الخليل أز معت على أمر فأناهز مع عليه اذائت عليه عزمك وقال الكدان
  يقال أزمعت الامر ولا يقال أزمعت عليه قال الاعشى
  أأزمعت من آل ليلى ابتكارا • وشعلت على ذى هوى ان تزارا
  وقال القراء أزمعته وأزمعت عليه مثل أبمعته وأجعت عليه أبوزيد الامع ججمع زمعة وهى
  هنة زائدة من وراء الظلف والجمع زماع مثل مروثمار وقال أبو ذويب يصف ظبيانتبت
  فه كفة الصائد
  فراغ وقد نشبت فى الزماع * واستحكمت مثل عقد الوتر
  يقال أزمعت الارنب أءسدت وأزمع النبت أوّل ما يظه- رمتفرّقاقال الاه؟عى الزموع
  الارنب التى تقنارب عدوها وكانها تعدوعلى زمعاتها وقال ابن السكيت الزمعان السير
  اليطى تقول منه زمع بالفتح يزمع والزمع رذال الناس وسة لمتهم يقال هو من زمعهم أى من
  ما خبرهم والزمع أيضا الدهش وقدز.ع بالكسر أى خرق من خوف ورجل زميسع وزموع
  بين الزماع أى سريع ومنه قول الناعرf
  داع بعاج-لة الفراق زمع ويقال
  للشجاع المقدام زميع بين الزماع وقوم زمعا: ورجل زميع الرأى أى جيده ⁦(ز وع)⁩ زاع
  بعيره يزوعه زوعا أى سر-كه بزمام الى قدام ليزداد فى سيره قال ذوالرمة
  وخافق الرأس فوق الرحل قلت له * زع بالزعام وجوز اللبل مر كوم
  ومن رواء زع بالفع من وزعه فقد غلط لانه ليس يأمره بأن يكف يعيره (زهنع زهنعت
  الجارية أى زينتها.
  صل السين بع سبعة رجال وسبع ذ.وة والسبع بالضم جزء من سبعة والسبع
  با لكسر الظلم من اظماء الابل وسبعتهم أسبعهم بالفتح اذا كنت سابعهم أو أخذت سمع
  أم والهيم وسبعته أى شتمنه ووقعت فيه وسبع الذئب الغنم أى فرسها والسبع واحد
  السباع والسبعة اللبوة وأواهم أخذه اخذسبعة قال اين السكيت اتما أصلها سبعة خففت
  واللبوة أنرق من الاسد وقال إبن المسكابى هوسبعة بن عوف بن تعلبة بن سلامان ين تعل بن
  حروبن الغوث بن طيء بن أدد، وكان وجلاشديدافعلى هذالا يجرى للمعرفة والتأنيث
  وقول الراجز
  يالبت انى وسبيعاف غنم هو اسم رجل ممغر وارض مسبعة بالنتح
  ذات سيباع وأسبع الرجل أى وردت ابل سبعا وأسبعوا أى صار واسبعة وأسبع الرعيان
  اذا وقع السبع فى مأشيتهم عن يمقوب وأسبعته أى أطعمته السبع وأسبع ابنه أى دقعه
  الى
