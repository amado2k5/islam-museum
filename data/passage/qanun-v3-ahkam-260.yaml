text: "… ذلك فيبني أمره على ذلك، ويجب على المجبّر أن يمر يده على موضع الكسر في كل حال أمراراً إلى فوق وإلى أسفل بالرفق واللطف، حتى إن رأى زوالاً أو نتوءاً أو شظية عرفة لئلا يربط كرة أخرى على غير واجب، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 260، يرد فيه ذكر الواجب، وما يجب على المكلف، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 260, whose wording mentions the obligatory (wajib), what is binding on the person addressed, what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج3، ص 260 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Canon de Medicine, vol. 3 de Ibn Sina, p. 260, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Canon de Medicine, vol. 3 de Ibn Sina, p. 260, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
