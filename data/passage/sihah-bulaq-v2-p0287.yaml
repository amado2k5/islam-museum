text: |-
  أسيد بن عنقاه الفزارى اه
  اذا حكمته فى مالك عن أبى عبيدة والخيل المسوّمة المرعية والمسومة المعلمة وقوله تعالى
  مسومين قال الاخْفشْ يكون معلين ويكون مرسلين من قولكْ سوّم فيها الفيل أى أرسلها
  ومنه السائمسة وانماجاه بالياء والذون لان الخيل سوّمت وعليهمادكبانها وقوله تعالى حجارة
  من طين مسوّمة أى عليهما أمثال الخواتيم أبو زيد سومت الرجسل اذا خليته وسومه أى
  وماير يد وسوّمت على القوم اذا أغرت عليهم فعنت فيهم والسام عروق الذهب الواحدة
  سامة وبم اممى سامة بن لؤىّ بن غالب قال قير بن اخطيم
  لو آنك تلقى حنظلا فوق بيضنا • تدحرج عن ذى سامه المتقارب
  أى على ذى سامه وعن فيه بعنى على والهاء في سامه ترجمع الى البيض يعنى البيض المموّه به
  واغا يصف تراص القوم فى الحرب -ق لوألقى حنظل لم يصل الى الارض والسام الموت
  وسام أحدبنى نوح عليه السلام وهوابوالعرب والسوام والسائم بمعنى وه والمال الراعى
  يقال سامت الماشية نسوم سوما أى رعن فهى سائمة وبجع السائم والسائمة سوائم وأسمتها
  أنا اذا أخرجتها الى الرعى قال تعالى فيسه تسهون والسوم فى المبابعة تقول منه ساومته
  سواما واستام علىّ وتساومنا وسمتك بعيرك سيمة حسنة وانه لغالى السيمة وسمته خسفا
  أى أوليته اياه وأوردته عليه وسام أى مرّ وقال
  أتيح لها أقيد رذوجشيف * اذاسامت على الملقات ساما
  وسوم الرياح مرّها والسيما مقصور من الواوقال تعالى سماهم فى وجوههم وقدتجءالسم
  والسيمياممدودين وقال ١
  غلام رماء اللّه بالحدن يافعا • له سمياء لا تشق على البصر
  وأى يفرح به من ينظراليه ⁦(سهم)⁩ السهم وإحد السهام والسهم النصيب والجمع
  السهمان وسهم البيت جائزه والمسهم البرد المخطط والسهمة بالضم القرابة قال عبيد
  قديوص النازح النائوقد • يقطع ذوالهمة القريب
  والسهمة النصيب والسهام بالفتح -زالسموم وقدسهم الرجل على مالم يسم" فاعلداذا أصابه
  السموم والسهام بالضم الضمر والتغير وقدسهم وجهه بالفتح وسهم أيضابالضم يسهم سهوما
  فيهما والساهمة الناقة الضاهرة قال ذوالرمّة
  أخاتنائف أغفى عند ساهمة • بأخلق الدف من تصديرها جلب
  يقول زار الخيال أخاتنائف نام عند ناقسة ضامرة مهزولة بجنبها قروح من آثار الحبال
  والاخاق الاماس وابل سواه-م اذاغيرها السفر الاموى السهام داءبصيب الابل يقال
  بعيرمسهوم وبه سهام وابل مسهمة قال أبو نخيلة ولم يقظ فى النعم المسهم* وساهمته أى
  فارعته فسهمنه أسهمه بالفتح وأسهم بينهم أى أفرع واستهموا أى اقترعوا وتساهموا
  أى تقارعوا وسهم قبيلة فقريسْ وسهم أيضافى باحلة
  فعال وشامى أيضاحكاه سيبويه ولا تقل شأم وماجا فى ضرورة الشعر فهمول على أنه
  اقتصر من النسنبة على ذكر البلدواحر أشأمية وشامية مخففة الياء والمشأمة الميسرة
  وحددلت
