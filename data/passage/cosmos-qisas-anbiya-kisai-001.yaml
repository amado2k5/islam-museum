text: "وهي سبعة أرضين فالأولى اسمها الرمكة وتحتها الريح العقيم وقد زمت بسبعين ألف ملك وبها أهلك الله قوم عاد"
summary:
  ar: "يصف الكسائي في قصصه سبع أرضين لكل منها اسم وسكان، فالأولى مرتبطة بهلاك عاد؛ وهو سرد قصصي شعبي وليس حديثاً مسنداً."
  en: "In his tales al-Kisai describes seven earths, each with a name and inhabitants, the first tied to the destruction of Ad; this is popular storytelling, not a chained hadith."
  es: "En sus relatos, al-Kisai describe siete tierras, cada una con un nombre y habitantes, la primera vinculada a la destrucción de Ad; esto es narración popular, no un hadiz encadenado."
  fr: "Dans ses récits, al-Kisai décrit sept terres, chacune ayant un nom et des habitants, la première étant liée à la destruction d'Ad; il s'agit d'un récit populaire, et non d'un hadith transmis par chaîne."
  ur: "الکسائی نے اپنی کہانیوں میں سات زمینیں بیان کی ہیں جن میں سے ہر ایک کا نام اور باشندے ہیں، پہلی زمین عاد کی تباہی سے منسلک ہے۔ یہ مشہور قصہ ہے، زنجیروں والی حدیث نہیں۔"
