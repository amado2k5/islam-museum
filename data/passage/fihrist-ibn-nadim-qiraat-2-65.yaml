text: "… كتاب القراءات لابى عمرو بن العلاء. كتاب القراءات لهارون بن حاتم الكوفى. كتاب القراءات للعباس بن الفضل الانصارى. كتاب الاحتجاج للقراء لابن درستويه الكتب المؤلفة فى النقط والشكل للقرآن كتاب الخليل فى النقط كتاب محمد بن عيسى فى النقط. كتاب …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 2، ص 65، يذكر قراءات القرآن، والقراء، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 2, p. 65, that mentions the readings of the Qur'an, the readers, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 2، ص 65 کا اقتباس جس میں قرآن کی قراءتیں، قراء، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 2, pág. 65, que menciona las lecturas del Corán, los lectores, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Coran d'Ibn al-Nadim, al-Fihrist (tome 2, p. 65), mentionne les lectures du Coran, les lecteurs, ainsi que la ponctuation et les signes vocaliques du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans la limite de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
