text: "… قوله بكم عمي اي لما لم ينتفعوا بجوارحهم هذه فكأنهم عدموها، هذا هو : إلا أن تطوع استثناء منقطع ومعناه: لكن يستحب لك أن تطوع، - باب بَيَانِ الصَّلَوَاتِ الْتِي هِيَّ أَحَدُ أرْكَانِ الإِسْلامِ عليه، ومن أتى بما عليه فهو …"
