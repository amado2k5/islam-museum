label: { ar: "الموطأ 1013 — مالك فيمن أحرم وعنده صيد قد صاده أو ابتاعه: ليس عليه أن يرسله، ولا بأس أن يجعله عند أهله", en: "Muwatta 1013", es: "Muwatta 1013", fr: "Muwatta 1013", ur: "موطا 1013", tr: "El-Muvatta 1013 — Malik, avladığı veya satın aldığı av hayvanıyla ihrama giren kimse hakkında şöyle demiştir: Onu serbest bırakmak zorunda değildir ve ailesinin yanında tutmasında da bir sakınca yoktur.", id: "Al-Muwatta 1013 — Malik berkata tentang seseorang yang memasuki ihram sambil memiliki hewan buruan yang ia buru atau beli: Ia tidak wajib melepaskannya, dan tidak ada salahnya memeliharanya bersama keluarganya." }
text: "ليس عليه أن يرسله، ولا بأس أن يجعله عند أهله"
summary:
  ar: "قول لمالك فيمن أحرم وعنده صيد قد صاده أو ابتاعه: ليس عليه أن يرسله، ولا بأس أن يجعله عند أهله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1145). {cite:muwatta-maruf-1997 p.475}"
  tr: "Malik, avladığı veya satın aldığı av hayvanıyla ihrama giren kimse hakkında şöyle demiştir: Hayvanı serbest bırakmak zorunda değildir ve ailesine bırakmasında da bir sakınca yoktur. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1145) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.475}"
  id: "Malik berkata mengenai seseorang yang memasuki keadaan ihram sambil memiliki hewan buruan yang telah ia buru atau beli: ia tidak wajib melepaskannya, dan tidak ada salahnya meninggalkannya bersama keluarganya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1145). {cite:muwatta-maruf-1997 p.475}"
