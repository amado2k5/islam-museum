label:
  ar: "صحيح مسلم، كتاب الألفاظ من الأدب وغيرها"
  en: "Sahih Muslim, Book 40: The Book Concerning the Use of Correct Words"
  ur: "صحیح مسلم، کتاب الالفاظ من الادب وغیرہا"
  es: "Sahih Muslim, Libro 40: El libro sobre el uso correcto de las palabras"
summary:
  ar: "القسم 40 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الألفاظ من الأدب وغيرها»، ويضم فيها النصوص من 5862 إلى 5884 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 40 of Sahih Muslim (The Book Concerning the Use of Correct Words) in the division of the open hadith dataset the museum took its reports from: reports 5862 to 5884 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 40، عنوان «کتاب الالفاظ من الادب وغیرہا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5862 تا 5884۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 40 de Sahih Muslim (El libro sobre el uso correcto de las palabras) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5862 al 5884, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
