label: { ar: "الموطأ 1734 — يحيى بن سعيد: القاسم بن محمد أنكر على يزيد بن عبد الملك تفريقه أمهات الأولاد بعد الموت، وقرأ آية البقرة في المتوفى عنهن أزواجهن", en: "Muwatta 1734" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع القاسم بن محمد يقول إن يزيد بن عبد الملك فرق بين رجال وبين نسائهم، وكن أمهات أولاد لرجال هلكوا، فتزوجوهن بعد حيضة أو حيضتين، ففرق بينهم حتى يعتددن أربعة أشهر وعشرا. فأنكر القاسم ذلك، واستشهد بآية البقرة في المتوفى عنهن أزواجهن. {cite:muwatta-maruf-1997 p.108}"
