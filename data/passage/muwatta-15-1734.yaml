label: { ar: "الموطأ 1734 — يحيى بن سعيد: القاسم بن محمد أنكر على يزيد بن عبد الملك تفريقه أمهات الأولاد بعد الموت، وقرأ آية البقرة في المتوفى عنهن أزواجهن", en: "Muwatta 1734", es: "Muwatta 1734", fr: "Muwatta 1734", ur: "موطا 1734", tr: "El-Muvatta 1734 — Yahya ibn Said: El-Kasım ibn Muhammed, Yazid ibn Abdülmalik'i kocalarının ölümünden sonra çocukların annelerini ayırması nedeniyle eleştirdi ve kocaları ölenler hakkında Bakara Suresi'ndeki ayeti okudu.", id: "Al-Muwatta 1734 — Yahya ibn Saeed: Al-Qasim ibn Muhammad mengkritik Yazid ibn Abd al-Malik karena memisahkan ibu-ibu yang anaknya meninggal setelah suami mereka meninggal, dan dia membacakan ayat Al-Baqarah tentang mereka yang suaminya telah meninggal." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع القاسم بن محمد يقول إن يزيد بن عبد الملك فرق بين رجال وبين نسائهم، وكن أمهات أولاد لرجال هلكوا، فتزوجوهن بعد حيضة أو حيضتين، ففرق بينهم حتى يعتددن أربعة أشهر وعشرا. فأنكر القاسم ذلك، واستشهد بآية البقرة في المتوفى عنهن أزواجهن. {cite:muwatta-maruf-1997 p.108}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet ettiğine göre, el-Kâsım ibn Muhammed'in şöyle dediğini işitmiştir: Yezid ibn Abd el-Malik, ölen erkeklerin çocuklarının anneleri olan kadınları eşlerinden ayırmıştır. Bu erkekler, bir veya iki adet döngüsünden sonra onlarla tekrar evlenmişlerdir; bu yüzden Yezid, onları dört ay on gün bekleme süresine kadar ayırmıştır. El-Kâsım buna itiraz etmiş ve Bakara Suresi'ndeki dullarla ilgili ayeti zikretmiştir. {cite:muwatta-maruf-1997 s.108}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, bahwa ia mendengar al-Qasim ibn Muhammad berkata bahwa Yazid ibn Abd al-Malik memisahkan laki-laki dari istri mereka yang merupakan ibu dari anak-anak laki-laki yang telah meninggal. Laki-laki ini menikahi mereka setelah satu atau dua siklus menstruasi, sehingga ia memisahkan mereka sampai mereka menjalani masa iddah selama empat bulan sepuluh hari. Al-Qasim keberatan dengan hal ini dan mengutip ayat dalam Surah al-Baqarah tentang janda. {cite:muwatta-maruf-1997 p.108}"
