label: { ar: "الموطأ 761 — مالك: مضت السنة أن لا جزية على نساء أهل الكتاب ولا على صبيانهم، وإنما تؤخذ من الرجال البالغين", en: "Muwatta 761", es: "Muwatta 761", fr: "Muwatta 761", ur: "موطا 761", tr: "El-Muvatta 761 — Malik: Sünnet gereği, Kitap Ehli'nin kadınlarından ve çocuklarından cizye alınmaz, sadece yetişkin erkeklerden alınır.", id: "Al-Muwatta 761 — Malik: Sudah menjadi Sunnah bahwa tidak ada jizya yang dikenakan pada wanita Ahli Kitab, dan juga tidak pada anak-anak mereka, tetapi jizya hanya dikenakan pada laki-laki dewasa." }
summary:
  ar: "قول لمالك: مضت السنة أن لا جزية على نساء أهل الكتاب ولا على صبيانهم، وأن الجزية لا تؤخذ إلا من الرجال الذين قد بلغوا الحلم. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.376}"
  tr: "Malik şöyle demiştir: Yerleşik uygulama şudur ki, Kitap Ehli'nin kadınlarından ve çocuklarından cizye alınmaz ve cizye sadece ergenliğe ulaşmış erkeklerden alınır. Araştırmacı, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.376}"
  id: "Malik berkata: Praktik yang sudah mapan adalah tidak ada jizya (pajak kepala) yang dikenakan pada wanita atau anak-anak dari Ahli Kitab, dan jizya hanya dikenakan pada laki-laki yang telah mencapai usia baligh. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.376}"
