text: |-
  ⁦(فصل الغين)⁩
  ⁦(غر)⁩
  ٣٧٧
  تواعدن أن لاوعى عن فرج را كس * فرحن ولم يغضرن عن ذاك مغضرا
  ويقال غضره أى حبسه ومنعه والغاضر الجلد الذى أجيد دباغه وغاضرة قبيلة من بنى أسد
  وحّمن بي صعصعة وبطن من ثقيف والغضور يتسكين الضادنيات وغضور أيضاما«اطي
  ضفر) الغضنفر الاسدور جل غضنفر غليظ الجثة غفر الغفر التغطية والغفر
  الغفران وغفرت المتاع جعلته فى الوعاء ويقال اصبغ ثوبك فانه أغفر للوسخ أى أسح-ل له
  وغفر الجرح يغفرعة رانكس وكذلك المريض قال الشاءر
  لعمرك انّ الدار غفر لذى الهوى • كما يغفر الحموم أوصاحب الكام
  وغفر بالسكسر يغفر غفر الغة فيه والغفرثلاثة أنجم صغارينزلها القمروهى من الميزان والغفر
  أيضاش عر كارغب يكون على ساق المرأة والجبهة وتحوذلك وكذلك الغفر بالتحريك قال
  الراجز
  قد علت خود بساقيها الغفر * لتروين أوليبيدن الشجر
  والغفر أيضازتير الثوب وقد غة رثو يك بالكسريغة رغفرا واغفار الثوب اغفيرارا والغفر
  بالضم ولد الاروية والجمع الاغفار وأمّهمغفرة والجمع مغفرات قال بشر
  وصعب يزل الغفر عن قدفاته * بحافاته بان طوال وعرعر
  والغفرة ما يغطى به الشى يقال اغفر واهذا الامر يغفرته أى أصلهوه بما ينبغى أن يصلح به
  والغفار بالضم لغة فى الغفر وهو الرغب قال الراجز
  تبدى نقيازانها خمارها * وقسطة ماشانها غفارها
  والقسطة عظم الساق ولست أرويه عن أحد قال الاصعى المغفر زردينسج من الدروع على
  قدرارأس يلبس تحت القلذسوة ويقال استغفر اللّه لذنبه ومن ذنبه بمعنى فغفر له ذنبه مغفرة
  وغفرا وغف رانا واغتفرذنبه مثله فهو غفور والجمع غف روقولهم جاؤاجماء غفير اعمدود وإلجهاء
  الغفير وجمّ الغفير وجماء الغفير أى جاؤا بجماعتهم الشريف والوضيع ولم يتخلف أحدوكانت
  فيهم كثرة والجهاء الغفير اسم وليس بفعل الاأنه ينصب كما تنصب المصادر التى هى فى معفاه
  كقولان جاؤنى جميعا وقاطبة وطزا وكافة وأدخلوا فيه الااف واللام كما أدخلوهما فى قولهم
  أوردها العراك أى أوردهاعرا كاويقال مافيهم غفيرة أى لا يغفرون ذنيا لاحد قال الراجز
  ياقوم ليست فيكم غفيره * فامشوا كماتشى بحال الحيره
  والغفارة بالمكسر خرقة تكون دون المقنعة توقى بها المرأة خارها من الدهن والغفارة
  السحابة التى كأنها فوق سحابة والغفارة الرقعة التى تكون على الحز الذى يجرى عليه الوتر
  وبنو غضار من كتانة رهط أبى ذرّ الغفارى والمغفور مثسل المغثور وحكى الكسائى مغفر
  ومغثر بكسر الميم يقال قد أغفر الرمث اذاخرجت مغافيره وانما يخرج فى الصفرية اذا أورس
  يقال ما أحسن مغافيرهذا الرمث ومن قال مغفور قال خرجنا نتفرومن قال مغفر قال
  خرجنا تتغفراذاخرج وا يجتنونه من شجره وقديكون المغفورأيضاللعشر والنمام
  والسلم والطلح وغيرهما ⁦( مر)⁩ الغمر الماء المكثير وقد غمره الماء يغمره أى علاه ومنه
  قيسل للرجل غمره القوم اذاء لوه شرفا والغمر الفرس الجوادورجل غمر الخلق وغمر الرداءاذا
  كان سخيابين الغمورة من قوم غمار وغمور قال كثير
  ٩٥
  صحاح
