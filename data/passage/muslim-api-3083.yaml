text: "وَحَدَّثَنَا حَرْمَلَةُ بْنُ يَحْيَى، أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، أَنَّ عَائِشَةَ، أَخْبَرَتْهُ أَنَّ الأَنْصَارَ كَانُوا قَبْلَ أَنْ يُسْلِمُوا هُمْ وَغَسَّانُ يُهِلُّونَ لِمَنَاةَ فَتَحَرَّجُوا أَنْ يَطُوفُوا بَيْنَ الصَّفَا وَالْمَرْوَةِ وَكَانَ ذَلِكَ سُنَّةً فِي آبَائِهِمْ مَنْ أَحْرَمَ لِمَنَاةَ لَمْ يَطُفْ بَيْنَ الصَّفَا وَالْمَرْوَةِ وَإِنَّهُمْ سَأَلُوا رَسُولَ اللَّهِ عَنْ ذَلِكَ حِينَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3083، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3083 (The Book of Pilgrimage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 3083، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
