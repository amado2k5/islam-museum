label: { ar: "الموطأ 704 — مالك: من أفاد ماشية فلا صدقة فيها حتى يحول الحول إلا أن يكون له قبلها نصاب ماشية", en: "Muwatta 704" }
summary:
  ar: "قول لمالك: من أفاد ماشية من إبل أو بقر أو غنم فلا صدقة عليه فيها حتى يحول عليها الحول من يوم أفادها، إلا أن يكون له قبلها نصاب ماشية، وهو خمس ذود من الإبل أو ثلاثون بقرة أو أربعون شاة؛ فإذا كان له نصاب ثم أفاد إليه إبلاً أو بقراً أو غنماً باشتراء أو هبة أو ميراث صدّقها مع ماشيته حين يصدقها وإن لم يحل على الفائدة الحول، ولو كانت قد صُدّقت قبل أن يشتريها أو يرثها بيوم واحد. ويمثل مالك لذلك بالورق يزكيها الرجل ثم يشتري بها عرضاً من رجل آخر قد وجبت عليه فيه الصدقة إذا باعه، فيكون الأول قد صدّقها اليوم والآخر من الغد. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.352} {cite:muwatta-maruf-1997 p.353}"
