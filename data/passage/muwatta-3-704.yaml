label: { ar: "الموطأ 704 — مالك: من أفاد ماشية فلا صدقة فيها حتى يحول الحول إلا أن يكون له قبلها نصاب ماشية", en: "Muwatta 704", es: "Muwatta 704", fr: "Muwatta 704", ur: "موطا 704", tr: "Al-Muwatta 704 — Malik: Kim hayvan edinirse, zekât için gerekli olan asgari hayvan sayısına önceden sahip olmadıkça, bir yıl geçmeden zekât yükümlülüğü yoktur.", id: "Al-Muwatta 704 — Malik: Barangsiapa memperoleh ternak, maka tidak ada zakat yang wajib dibayarkan atasnya hingga setahun berlalu, kecuali jika sebelumnya ia telah memiliki jumlah ternak minimum yang diwajibkan untuk zakat." }
summary:
  ar: "قول لمالك: من أفاد ماشية من إبل أو بقر أو غنم فلا صدقة عليه فيها حتى يحول عليها الحول من يوم أفادها، إلا أن يكون له قبلها نصاب ماشية، وهو خمس ذود من الإبل أو ثلاثون بقرة أو أربعون شاة؛ فإذا كان له نصاب ثم أفاد إليه إبلاً أو بقراً أو غنماً باشتراء أو هبة أو ميراث صدّقها مع ماشيته حين يصدقها وإن لم يحل على الفائدة الحول، ولو كانت قد صُدّقت قبل أن يشتريها أو يرثها بيوم واحد. ويمثل مالك لذلك بالورق يزكيها الرجل ثم يشتري بها عرضاً من رجل آخر قد وجبت عليه فيه الصدقة إذا باعه، فيكون الأول قد صدّقها اليوم والآخر من الغد. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.352} {cite:muwatta-maruf-1997 p.353}"
  tr: "Malik şöyle demiştir: Deve, sığır veya koyun gibi hayvan edinen kimse, edindiği günden itibaren bir yıl geçmeden zekât vermekle yükümlü değildir; ancak zekât için gerekli olan asgari hayvan sayısına, yani beş deve, otuz sığır veya kırk koyuna zaten sahipse durum farklıdır. Eğer asgari hayvan sayısına zaten sahipse ve daha sonra satın alma, hediye veya miras yoluyla deve, sığır veya koyun edinirse, zekâtını mevcut hayvanlarıyla birlikte, edinme tarihinden itibaren bir yıl geçmemiş olsa bile ve hatta satın almadan veya miras almadan bir gün önce zekâtını vermiş olsa bile, vermek zorundadır. Malik bunu, kağıt para üzerinden zekât veren ve daha sonra bu parayla başka bir adamdan mal satın alan bir adamın örneğiyle açıklıyor. İkinci adam bu malları satarsa zekât vermekle yükümlüdür. Birinci adam zekâtını bugün verir, ikinci adam ise ertesi gün verir. Araştırmacı, bunu Ebu Musab'ın Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.352} {cite:muwatta-maruf-1997 s.353}"
  id: "Malik berkata: Barang siapa memperoleh ternak, baik unta, sapi, atau domba, tidak wajib membayar zakat atasnya sampai setahun berlalu sejak hari ia memperolehnya, kecuali jika ia sudah memiliki jumlah minimum ternak yang diwajibkan zakat, yaitu lima unta, tiga puluh sapi, atau empat puluh domba. Jika ia sudah memiliki jumlah minimum tersebut dan kemudian memperoleh unta, sapi, atau domba melalui pembelian, hadiah, atau warisan, ia wajib membayar zakat atasnya bersama dengan ternak yang sudah dimilikinya ketika ia membayar zakat atasnya, meskipun belum genap setahun sejak perolehan tersebut, dan meskipun zakat atasnya telah dibayarkan sehari sebelum ia membeli atau mewarisinya. Malik mengilustrasikan hal ini dengan contoh seorang pria yang membayar zakat atas uang kertas dan kemudian menggunakannya untuk membeli barang dari pria lain yang wajib membayar zakat atas barang tersebut jika ia menjualnya. Pria pertama membayar zakat atasnya hari ini, dan pria kedua membayarnya keesokan harinya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {kutip:muwatta-maruf-1997 hal.352} {kutip:muwatta-maruf-1997 hal.353}"
