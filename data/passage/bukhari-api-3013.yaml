label: { ar: "صحيح البخاري 3013 — الأب والأبوة", en: "Sahih al-Bukhari 3013 — the father and fatherhood", ur: "صحیح بخاری 3013 — باپ اور والدیت", es: "Sahih al-Bukhari 3013 — El padre y la paternidad" }
text: "وَعَنِ الزُّهْرِيِّ، أَنَّهُ سَمِعَ عُبَيْدَ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، حَدَّثَنَا الصَّعْبُ، فِي الذَّرَارِيِّ كَانَ عَمْرٌو يُحَدِّثُنَا عَنِ ابْنِ شِهَابٍ، عَنِ النَّبِيِّ فَسَمِعْنَاهُ مِنَ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي عُبَيْدُ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، عَنِ الصَّعْبِ، قَالَ \" هُمْ مِنْهُمْ \" وَلَمْ يَقُلْ كَمَا قَالَ عَمْرٌو \" هُمْ مِنْ آبَائِهِمْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3013، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3013 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3013، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3013 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
