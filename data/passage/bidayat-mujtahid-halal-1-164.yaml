text: "… امْرَأَةً فَدَخَلَ بِهَا أَوْ لَمْ يَدْخُلْ فَلَا تَحِلَّ لَهُ أُمُّهَا. وأَمَّا الْمَسْأَلَةُ الرَّابِعَةُ : فَاخْتَلَفُوا فِيِ الزِّنَى؛ هَلْ يُوجِبُ مِنَ التَّحْرِيمِ فِي هَؤُلَاءٍ مَا يُوجِبُ الْوَطْءُ فِي نِكَاحِ صَحِيحِ أَوْ بِشُبْهَةِ؛ أَغْنِي : الَّذِي يُدْرَأْ فِيهِ الْحَدُّ؟ فَقَالَ الشَّافِعِيُّ : …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 164، يذكر ما أُحل، وما لا يحل، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
