label: { ar: "صحيح البخاري 3095 — الصلاة والزكاة والصوم والحج مجتمعة، الشهادة والصلاة والزكاة", en: "Sahih al-Bukhari 3095 — the prayer, the zakat, the fast and the pilgrimage named together; the testimony, the prayer and the zakat", ur: "صحیح بخاری 3095 — نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ", es: "Sahih al-Bukhari 3095 — la oración, el zakat, el ayuno y la peregrinación nombrados juntos; el testimonio, la oración y el zakat", fr: "Sahih al-Bukhari 3095 — la prière, la zakat, le jeûne et le pèlerinage mentionnés ensemble; le témoignage, la prière et la zakat", tr: "Sahih el-Buhari 3095 — Namaz, Zekat, Oruç ve Hac birlikte; Şahitlik, Namaz ve Zekat", id: "Sahih al-Bukhari 3095 — Shalat, Zakat, Puasa, dan Haji bersama-sama; Kesaksian, Shalat, dan Zakat" }
text: "… كُفَّارُ مُضَرَ، فَلَسْنَا نَصِلُ إِلَيْكَ إِلاَّ فِي الشَّهْرِ الْحَرَامِ، فَمُرْنَا بِأَمْرٍ نَأْخُذُ مِنْهُ وَنَدْعُو إِلَيْهِ مَنْ وَرَاءَنَا. قَالَ \" آمُرُكُمْ بِأَرْبَعٍ، وَأَنْهَاكُمْ عَنْ أَرْبَعٍ، الإِيمَانِ بِاللَّهِ شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ ـ وَعَقَدَ بِيَدِهِ ـ وَإِقَامِ الصَّلاَةِ وَإِيتَاءِ الزَّكَاةِ وَصِيَامِ رَمَضَانَ، وَأَنْ تُؤَدُّوا لِلَّهِ خُمُسَ مَا غَنِمْتُمْ، وَأَنْهَاكُمْ عَنِ الدُّبَّاءِ وَالنَّقِيرِ وَالْحَنْتَمِ وَالْمُزَفَّتِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3095، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 3095 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 3095، جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3095 (Una quinta parte del botín para la causa de Alá (Khumus)), que menciona la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat, uno de los artículos de fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 3095 (Le cinquième du butin pour la cause d'Allah (Khumus)), mentionne la prière, la zakat, le jeûne et le pèlerinage, cités ensemble, ainsi que le témoignage, la prière et la zakat, comme l'un des piliers de la foi. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih Buhari'nin 3095 numaralı hadisinde namaz, zekât, oruç ve haccın yanı sıra şahitlik, namaz, zekât ve imanın rükünlerinden biri birlikte anılmaktadır. Bu hadis, İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte, bu dört kategori içinde derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3095, menyebutkan salat, zakat, puasa, dan haji secara bersamaan, serta syahadat, salat, zakat, dan salah satu rukun iman. Hadits ini disusun oleh seorang peneliti yang ahli dalam rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, semuanya dalam empat kategori ini."
