  tr: "İbn Hişam'ın Peygamber biyografisinden, 102. sayfada, son bir vasiyet veya ahit ve ölüm anından bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
