text: "… لَمْ أحبه شيئاً قبله مثله، قال : فأقمت معه زماناً، ثم حَضَرَتْهُ الوفاةُ، فقلت له : يا فلان، إنِّي قد كنت معك، وأحببتك حبّاً لم أحبّه شيئاً قبلك، وقد حضرك ما ترى من أَمْرِ اللهِ تَعَالَى، فَإِلَى مَنْ تُوصِي بِي؟ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 102، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 102, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
