label: { ar: "الموطأ 2523 — مالك: لا يُقتل مسلم بكافر إلا أن يقتله غيلة", en: "Muwatta 2523", es: "Muwatta 2523", fr: "Muwatta 2523", ur: "موطا 2523", tr: "El-Muvatta 2523 — Malik: Bir Müslüman, bir kâfiri öldürdüğü için, haince öldürmediği sürece öldürülmez.", id: "Al-Muwatta 2523 — Malik: Seorang Muslim tidak boleh dibunuh karena membunuh orang kafir kecuali jika ia membunuhnya dengan cara yang khianat." }
summary:
  ar: "قال مالك: الأمر عندنا أنه لا يُقتل مسلم بكافر، إلا أن يقتله مسلم قتل غيلة فيُقتل به. {cite:muwatta-maruf-1997 p.434} {cite:muwatta-maruf-1997 p.435}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur: Bir Müslüman, gayrimüslim birini öldürdüğü için öldürülmez; ancak bir Müslüman onu haince öldürürse, misilleme olarak öldürülür. {cite:muwatta-maruf-1997 s.434} {cite:muwatta-maruf-1997 s.435}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah bahwa seorang Muslim tidak boleh dibunuh karena membunuh seorang non-Muslim, kecuali jika seorang Muslim membunuhnya dengan cara yang khianat, dalam hal ini ia harus dibunuh sebagai pembalasan. {cite:muwatta-maruf-1997 p.434} {cite:muwatta-maruf-1997 p.435}"
