label: { ar: "الموطأ 1386 — مالك فيمن يقول مالي في سبيل الله ثم يحنث: يجعل ثلث ماله في سبيل الله، لما جاء عن النبي في أمر أبي لبابة", en: "Muwatta 1386", es: "Muwatta 1386", fr: "Muwatta 1386", ur: "موطا 1386", tr: "El-Muvatta 1386 — Malik, “Servetim Allah içindir” diyen ve sonra yeminini bozan kişi hakkında şöyle demiştir: Peygamberimizden Ebu Lubaba meselesi hakkında rivayet edilenlere dayanarak, o kişi servetinin üçte birini Allah için vermelidir.", id: "Al-Muwatta 1386 — Malik berkata mengenai orang yang berkata, “Hartaku adalah untuk Allah,” kemudian mengingkari sumpahnya: Ia harus memberikan sepertiga dari hartanya untuk Allah, berdasarkan apa yang diriwayatkan dari Nabi mengenai perkara Abu Lubaba." }
summary:
  ar: "يقول مالك في الذي يقول مالي في سبيل الله ثم يحنث، إنه يجعل ثلث ماله في سبيل الله، وذلك لما جاء عن رسول الله في أمر أبي لبابة. {cite:muwatta-maruf-1997 p.617}"
  tr: "Malik, \"Servetim Allah içindir\" deyip sonra yeminini bozan kimse hakkında, Ebu Lubaba meselesiyle ilgili olarak Allah Resulü'nden rivayet edilenlere dayanarak, servetinin üçte birini Allah yoluna vermesi gerektiğini söyler. {cite:muwatta-maruf-1997 s.617}"
  id: "Malik berkata mengenai seseorang yang berkata, \"Harta saya adalah untuk kepentingan Allah,\" kemudian mengingkari sumpahnya, bahwa ia harus memberikan sepertiga dari hartanya untuk kepentingan Allah, berdasarkan apa yang diriwayatkan dari Rasulullah SAW mengenai perkara Abu Lubaba. {cite:muwatta-maruf-1997 p.617}"
