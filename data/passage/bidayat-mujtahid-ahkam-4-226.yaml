text: "… رَأَيْتُمُونِي أُصَلِّي وأما الشافعي فحمل أفعاله في ذلك على الندب وأخرجها عن الأصل بالقياس، وذلك أنه لما كان السجود عند الجمهور ليس ينوب عن فرض وإنما ينوب عن ندب رأى أن البدل عما ليس بواجب ليس هو بواجب. وأما مالك …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 226، يرد فيه ذكر الفرض، والواجب، والمندوب، وما ليس بواجب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 226, whose wording mentions the obligatory (fard), the obligatory (wajib), the recommended (mandub), what is said not to be obligatory, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 226 کا اقتباس جس میں فرض، واجب، مندوب، جو واجب نہیں، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 226, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), le recommandé (mandub), ce qui est dit non obligatoire, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 226, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), lo recomendado (mandub), lo que se dice que no es obligatorio, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
