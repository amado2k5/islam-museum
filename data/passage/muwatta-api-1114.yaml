label: { ar: "موطأ مالك 1114 — ما أُحل، ما لا يحل", en: "Muwatta Malik 1114 — what was made lawful; what is not lawful", ur: "موطأ مالک 1114 — جو حلال کیا گیا، جو حلال نہیں", es: "Muwatta Malik 1114 — lo que se ha hecho lícito; lo que no es lícito", fr: "Muwatta Malik 1114 — ce qui a été rendu licite; ce qui ne l’est pas" }
text: "… أَفْتَاهُ بِذَلِكَ فَأَمَرَهُ أَنْ يُفَارِقَ امْرَأَتَهُ. قَالَ مَالِكٌ فِي الرَّجُلِ تَكُونُ تَحْتَهُ الْمَرْأَةُ ثُمَّ يَنْكِحُ أُمَّهَا فَيُصِيبُهَا إِنَّهَا تَحْرُمُ عَلَيْهِ امْرَأَتُهُ وَيُفَارِقُهُمَا جَمِيعًا وَيَحْرُمَانِ عَلَيْهِ أَبَدًا إِذَا كَانَ قَدْ أَصَابَ الأُمَّ فَإِنْ لَمْ يُصِبِ الأُمَّ لَمْ تَحْرُمْ عَلَيْهِ امْرَأَتُهُ وَفَارَقَ الأُمَّ. وَقَالَ مَالِكٌ فِي الرَّجُلِ يَتَزَوَّجُ الْمَرْأَةَ ثُمَّ يَنْكِحُ أُمَّهَا فَيُصِيبُهَا إِنَّهُ لاَ تَحِلُّ لَهُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1114، يذكر ما أُحل، وما لا يحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1114 (Marriage), that mentions what was made lawful, what is not lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1114، جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1114 (Matrimonio), menciona lo que es lícito, lo que no lo es y lo que es ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 1114 (Mariage), mentionne ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
