text: "… في عظمي الزوج لعضلات الصدغين. والله ولي التوفيق. الفصل السادس عشر تشريح الترقوة قال الشيخ الرئيس رحمة اللّٰه عليه الترقوة عظم موضوع... إلى آخر الفصل. الشرح قال جالينوس: إن اتصال هذا العظم بالقص هو بمفصل سلس. وهذا مشكل فإن المفصل …"
