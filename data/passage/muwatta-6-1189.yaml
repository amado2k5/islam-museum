label: { ar: "الموطأ 1189 — مالك: الإمام لا يجهر بالقراءة في ظهر يوم عرفة، ويخطب الناس، وصلاتها ظهر قصرت للسفر ولو وافقت الجمعة", en: "Muwatta 1189", es: "Muwatta 1189", fr: "Muwatta 1189", ur: "موطا 1189", tr: "El-Muvatta 1189 — Malik: İmam, Arafat Günü öğle namazında yüksek sesle okumaz, insanlara hutbe verir. Öğle namazı, Cuma namazına denk gelse bile, yolculuk nedeniyle kısaltılır.", id: "Al-Muwatta 1189 — Malik: Imam tidak membaca Al-Quran dengan suara keras selama shalat Zuhur pada Hari Arafah, dan beliau menyampaikan khutbah kepada orang-orang. Shalat Zuhur dipersingkat untuk keperluan perjalanan, meskipun bertepatan dengan shalat Jumat." }
summary:
  ar: "يقول مالك إن الأمر الذي لا اختلاف فيه عندهم أن الإمام لا يجهر بالقراءة في الظهر يوم عرفة، وأنه يخطب الناس يوم عرفة، وأن الصلاة يوم عرفة إنما هي ظهر، وإن وافقت الجمعة، لكنها قصرت من أجل السفر. {cite:muwatta-maruf-1997 p.535}"
  tr: "Malik, aralarında tartışmasız olan şeyin, imamın Arafat Günü öğle namazında yüksek sesle okumadığı, Arafat Günü insanlara hutbe verdiği ve Arafat Günü namazının, Cuma gününe denk gelse bile, yolculuk nedeniyle kısaltılmış olsa da, yine de öğle namazı olduğu olduğunu söylüyor. {cite:muwatta-maruf-1997 s.535}"
  id: "Malik mengatakan bahwa yang tidak diperdebatkan di antara mereka adalah bahwa imam tidak membaca Al-Quran dengan suara keras selama shalat Zuhur pada Hari Arafah, bahwa ia menyampaikan khutbah kepada orang-orang pada Hari Arafah, dan bahwa shalat pada Hari Arafah tetaplah shalat Zuhur, meskipun bertepatan dengan hari Jumat, tetapi dipersingkat karena perjalanan. {cite:muwatta-maruf-1997 p.535}"
