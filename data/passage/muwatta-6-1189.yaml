label: { ar: "الموطأ 1189 — مالك: الإمام لا يجهر بالقراءة في ظهر يوم عرفة، ويخطب الناس، وصلاتها ظهر قصرت للسفر ولو وافقت الجمعة", en: "Muwatta 1189" }
summary:
  ar: "يقول مالك إن الأمر الذي لا اختلاف فيه عندهم أن الإمام لا يجهر بالقراءة في الظهر يوم عرفة، وأنه يخطب الناس يوم عرفة، وأن الصلاة يوم عرفة إنما هي ظهر، وإن وافقت الجمعة، لكنها قصرت من أجل السفر. {cite:muwatta-maruf-1997 p.535}"
