label: { ar: "سنن أبي داود 4996 — الأب والأبوة", en: "Sunan Abi Dawud 4996 — the father and fatherhood", ur: "سنن ابی داؤد 4996 — باپ اور والدیت", es: "Sunan Abi Dawud 4996 — El padre y la paternidad", fr: "Sunan Abi Dawud 4996 — Le père et la paternité" }
text: "… مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ طَهْمَانَ، عَنْ بُدَيْلٍ، عَنْ عَبْدِ الْكَرِيمِ، عَنْ عَبْدِ اللَّهِ بْنِ شَقِيقٍ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي الْحَمْسَاءِ، قَالَ بَايَعْتُ النَّبِيَّ بِبَيْعٍ قَبْلَ أَنْ يُبْعَثَ وَبَقِيَتْ لَهُ بَقِيَّةٌ فَوَعَدْتُهُ أَنْ آتِيَهُ بِهَا فِي مَكَانِهِ فَنَسِيتُ ثُمَّ ذَكَرْتُ بَعْدَ ثَلاَثٍ فَجِئْتُ فَإِذَا هُوَ فِي مَكَانِهِ فَقَالَ \" يَا فَتَى …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4996، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4996 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4996، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4996 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4996 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
