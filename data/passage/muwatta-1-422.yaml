label: { ar: "الموطأ 422 — أبو جهيم: لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يقف أربعين خيراً له", en: "Muwatta 422" }
text: "لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يقف أربعين خيراً له من أن يمر بين يديه"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن بسر بن سعيد، في باب التشديد في أن يمر أحد بين يدي المصلي: أرسله زيد بن خالد الجهني إلى أبي جهيم يسأله ما سمع من النبي في المار بين يدي المصلي، فأخبره أن النبي قال إن المار لو علم ما عليه لكان أن يقف أربعين خيراً له من أن يمر بين يديه؛ وقال أبو النضر إنه لا يدري أقال أربعين يوماً أو شهراً أو سنة. ويخرّجه المحقص عند البخاري (510) ومسلم (2/58) وأبي داود (701) والترمذي (336) والنسائي (2/66) وابن حبان والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (21/146). {cite:muwatta-maruf-1997 p.220} {cite:muwatta-maruf-1997 p.221}"
