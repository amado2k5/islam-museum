label: { ar: "الموطأ 422 — أبو جهيم: لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يقف أربعين خيراً له", en: "Muwatta 422", es: "Muwatta 422", fr: "Muwatta 422", ur: "موطا 422", tr: "El-Muvatta 422 — Ebu Cahim: Namaz kılanın önünden geçen kimse ne yapacağını bilseydi, kırk gün/yıl ayakta durması daha iyi olurdu.", id: "Al-Muwatta 422 — Abu Jahim: Jika orang yang lewat di depan orang yang sedang shalat mengetahui apa yang akan dilakukannya, lebih baik baginya untuk berdiri selama empat puluh (hari/tahun/tahun)." }
text: "لو يعلم المار بين يدي المصلي ماذا عليه لكان أن يقف أربعين خيراً له من أن يمر بين يديه"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن بسر بن سعيد، في باب التشديد في أن يمر أحد بين يدي المصلي: أرسله زيد بن خالد الجهني إلى أبي جهيم يسأله ما سمع من النبي في المار بين يدي المصلي، فأخبره أن النبي قال إن المار لو علم ما عليه لكان أن يقف أربعين خيراً له من أن يمر بين يديه؛ وقال أبو النضر إنه لا يدري أقال أربعين يوماً أو شهراً أو سنة. ويخرّجه المحقص عند البخاري (510) ومسلم (2/58) وأبي داود (701) والترمذي (336) والنسائي (2/66) وابن حبان والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (21/146). {cite:muwatta-maruf-1997 p.220} {cite:muwatta-maruf-1997 p.221}"
  tr: "Malik, namaz kılan birinin önünden geçmenin yasaklanmasının şiddeti bölümünde, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, o da Busr ibn Sa'id'den rivayetle şöyle nakletmiştir: Zeyd ibn Halid el-Cuhani, namaz kılan birinin önünden geçme konusunda Peygamberimizden ne duyduğunu sormak için Ebu Cühaym'ı ona gönderdi. Ebu Cühaym, Peygamberimizin şöyle buyurduğunu bildirdi: \"Önden geçen kişi sonuçlarını bilseydi, önünden geçmektense kırk gün ayakta durması daha iyi olurdu.\" Ebu el-Nadr, kırk gün mü, bir ay mı yoksa bir yıl mı dediğini bilmediğini söyledi. El-Muhakkas, bunu Buhari (510), Müslim (2/58), Ebu Davud (701), Tirmizi (336), Nesai (2/66), İbn Hibban, Darimi ve Ahmed'in derlemelerine, Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil etmiş ve el-Temhid'e (21/146) atıfta bulunmuştur."
  id: "Malik meriwayatkannya dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Busr ibn Sa'id, dalam bab tentang beratnya larangan seseorang yang melewati di depan orang yang sedang shalat: Zayd ibn Khalid al-Juhani mengutusnya kepada Abu Juhaym untuk menanyakan apa yang telah didengarnya dari Nabi tentang seseorang yang melewati di depan orang yang sedang shalat. Abu Juhaym memberitahunya bahwa Nabi bersabda, \"Jika orang yang melewati di depan orang lain mengetahui akibatnya, lebih baik baginya untuk berdiri selama empat puluh hari daripada melewati di depannya.\" Abu al-Nadr berkata bahwa dia tidak tahu apakah yang dimaksud adalah empat puluh hari, satu bulan, atau satu tahun. Al-Muhaqqas memasukkannya dalam koleksi al-Bukhari (510), Muslim (2/58), Abu Dawud (701), al-Tirmidhi (336), al-Nasa'i (2/66), Ibn Hibban, al-Darimi, dan Ahmad melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (21/146)."
