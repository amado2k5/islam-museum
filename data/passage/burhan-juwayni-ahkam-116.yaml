text: "… معين مسألة لظية - ذهب القاضي أبو بكر رحمه االله في جماعة من الأصوليين إلى أن المندوب إليه مأمور به والندب أمر على الحقيقة وهب بعض الفقهاء إلى أن الأمر ما يقتضي الإيجاب قال ا لقاضي المندوب إليه طاعة ولم …"
summary:
  ar: "مقطع من البرهان للجويني، ص 116، يرد فيه ذكر الوجوب، والمندوب، والطاعة، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Juwayni's al-Burhan, p. 116, whose wording mentions obligation (wujub), the recommended (mandub), obedience, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البرہان، جوینی، ص 116 کا اقتباس جس میں وجوب، مندوب، اطاعت، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Burhan de al-Juwayni, p. 116, dont le texte mentionne l'obligation (wujub), le recommandé (mandub), l'obéissance, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
