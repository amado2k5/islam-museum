label: { ar: "الموطأ 718 — مرسل عطاء بن يسار: لا تحل الصدقة لغني إلا لخمسة", en: "Muwatta 718", es: "Muwatta 718", fr: "Muwatta 718", ur: "موطا 718", tr: "El-Muvatta 718 — Ata' ibn Yasar'dan rivayet edilen mursal bir hadis: Zengin bir kişi için sadaka, beş hal dışında caiz değildir.", id: "Al-Muwatta 718 — Hadits mursal dari Ata’ ibn Yasar: Sedekah tidak diperbolehkan bagi orang kaya kecuali dalam lima kasus." }
text: "لا تحل الصدقة لغني، إلا لخمسة: لغاز في سبيل الله، أو لعامل عليها، أو لغارم، أو لرجل اشتراها بماله، أو رجل له جار مسكين، فتصدق على المسكين، فأهدى المسكين للغني"
summary:
  ar: "أول حديث في باب أخذ الصدقة ومن يجوز له أخذها. يرويه مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً، أن النبي قال: لا تحل الصدقة لغني إلا لخمسة: لغاز في سبيل الله، أو لعامل عليها، أو لغارم، أو لرجل اشتراها بماله، أو رجل له جار مسكين فتُصدق على المسكين فأهدى المسكين للغني. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي عند أبي داود (1635) ومحمد بن الحسن الشيباني (343)، وينقل عن ابن عبد البر ⁦(التمهيد 5/95)⁩ أن مالكاً أرسله وتابعه ابن عيينة وإسماعيل بن أمية، وأن الثوري رواه عن زيد عن عطاء: حدثني الثبت، وأن معمراً وصله عن أبي سعيد الخدري ⁦(عبد الرزاق 7151، أبو داود 1636، ابن ماجة 1841، ابن خزيمة 2374، الحاكم 1/407)⁩، وأن أبا حاتم وأبا زرعة والدارقطني خطّؤوا رواية معمر الموصولة، ثم يناقش المحقق طويلاً رواية عبد الرزاق عن معمر والثوري جميعاً، ويذكر أن ابن خزيمة والحاكم والبيهقي والمنذري والألباني وهو نفسه في تعليقه على ابن ماجة صححوا الموصول بناء على قبول زيادة الثقة، ثم يرجح أن المرسل أصح لاتفاق مالك وابن عيينة وإسماعيل بن أمية عليه واضطراب أصحاب الثوري. {cite:muwatta-maruf-1997 p.360} {cite:muwatta-maruf-1997 p.361}"
  tr: "Sadaka alma ve sadaka almaya kimin izin verildiği konusundaki bölümün ilk hadisi, Malik'in Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiği mursal bir hadiste şöyle buyurmuştur: Peygamberimiz şöyle buyurmuştur: Zengin bir kimse için sadaka helal değildir, ancak beş hal müstesna: Allah yolunda savaşan bir savaşçıya, sadaka toplamak için çalışana, borçlu olana, kendi parasıyla satın alana veya fakir bir komşusu olan ve sadakayı fakire verene ve fakirin de sadakayı zengine hediye olarak vermesine. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab ve Kanabi tarafından Ebu Davud'da (1635) ve Muhammed ibn Hasan el-Şeybani'de (343) rivayet edildiğini belirtmektedir. İbn Abdülberr'den (el-Tamhid 5/95) alıntı yaparak, Malik'in bunu kırık bir isnad zinciriyle naklettiğini ve İbn Uyayne ile İsmail ibn Umayyah'ın da onu bu konuda takip ettiğini belirtir. Ayrıca, el-Sevri'nin bunu Zeyd'den, Ata'dan rivayetle \"Güvenilir olan bana söyledi\" şeklinde naklettiğini ve Ma'mar'ın da bunu Ebu Sa'id el-Hudri'den rivayetle bağladığını ifade eder (Abdül-Razzaq 7151, Ebu Davud 1636, İbn Majah 1841, İbn Huzeyme 2374, el-Hakim 1/407). Ayrıca, Ebu Hatim, Ebu Zur'a ve el-Daraqutni'nin Ma'mar'ın bağladığı rivayeti yanlış bulduklarını belirtir. Araştırmacı daha sonra Abdülrazzak'ın hem Ma'mar'dan hem de el-Seviri'den rivayetini uzun uzadıya ele alıyor ve İbn Huzeyme, el-Hakim, el-Beyhakî, el-Mündiri ve el-Albani'nin -ve kendisinin de İbn Majah üzerine yaptığı tefsirinde- güvenilir bir ravi eklenmesinin kabulüne dayanarak bağlantılı rivayeti doğruladığını belirtiyor. Daha sonra, Malik, İbn Uyayne ve İsmail ibn Umeyye'nin bu konuda hemfikir olması ve rivayet zincirlerinin tutarsızlığı nedeniyle kırık zincirin daha sahih olduğu sonucuna varıyor. Devrimci Sahabeler. {cite:muwatta-maruf-1997 s.360} {cite:muwatta-maruf-1997 s.361}"
  id: "Hadits pertama dalam bab ini adalah tentang menerima sedekah dan siapa yang diperbolehkan menerimanya. Diriwayatkan oleh Malik dari Zaid bin Aslam dari Ata bin Yasar dalam hadits mursal, bahwa Nabi bersabda: Sedekah tidak diperbolehkan bagi orang kaya kecuali untuk lima hal: bagi seorang pejuang di jalan Allah, atau bagi orang yang bekerja untuk mengumpulkannya, atau bagi orang yang berhutang, atau bagi orang yang membelinya dengan uangnya, atau bagi orang yang mempunyai tetangga miskin dan sedekah diberikan kepada orang miskin tersebut dan orang miskin itu memberikannya sebagai hadiah kepada orang kaya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan al-Qa'nabi dalam Abu Dawud (1635) dan Muhammad bin al-Hasan al-Shaybani (343). Ia mengutip Ibn 'Abd al-Barr (al-Tamhid 5/95) bahwa Malik meriwayatkan hadits ini dengan sanad yang terputus, dan bahwa Ibn 'Uyaynah dan Isma'il ibn Umayyah mengikutinya dalam hal ini. Ia juga menyatakan bahwa al-Thawri meriwayatkan hadits ini dari Zayd, berdasarkan riwayat 'Ata': \"Orang yang terpercaya memberitahuku,\" dan bahwa Ma'mar menghubungkannya berdasarkan riwayat Abu Sa'id al-Khudri ('Abd al-Razzaq 7151, Abu Dawud 1636, Ibn Majah 1841, Ibn Khuzaymah 2374, al-Hakim 1/407). Ia lebih lanjut menyatakan bahwa Abu Hatim, Abu Zur'ah, dan al-Daraqutni menganggap riwayat Ma'mar yang dihubungkan itu tidak benar. Peneliti kemudian membahas panjang lebar riwayat 'Abd al-Razzaq dari Ma'mar dan al-Thawri, menyebutkan bahwa Ibn Khuzaymah, al-Hakim, al-Bayhaqi, al-Mundhiri, dan al-Albani—dan beliau sendiri dalam komentarnya tentang Ibn Majah—mengautentikasi riwayat yang terhubung berdasarkan penerimaan tambahan dari perawi yang terpercaya. Kemudian beliau menyimpulkan bahwa sanad yang terputus lebih otentik karena kesepakatan Malik, Ibn 'Uyaynah, dan Isma'il ibn Umayyah tentangnya, dan ketidakkonsistenan sanad-sana riwayat. Para Sahabat Revolusioner. {cite:muwatta-maruf-1997 p.360} {cite:muwatta-maruf-1997 p.361}"
