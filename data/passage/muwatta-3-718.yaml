label: { ar: "الموطأ 718 — مرسل عطاء بن يسار: لا تحل الصدقة لغني إلا لخمسة", en: "Muwatta 718" }
text: "لا تحل الصدقة لغني، إلا لخمسة: لغاز في سبيل الله، أو لعامل عليها، أو لغارم، أو لرجل اشتراها بماله، أو رجل له جار مسكين، فتصدق على المسكين، فأهدى المسكين للغني"
summary:
  ar: "أول حديث في باب أخذ الصدقة ومن يجوز له أخذها. يرويه مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً، أن النبي قال: لا تحل الصدقة لغني إلا لخمسة: لغاز في سبيل الله، أو لعامل عليها، أو لغارم، أو لرجل اشتراها بماله، أو رجل له جار مسكين فتُصدق على المسكين فأهدى المسكين للغني. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي عند أبي داود (1635) ومحمد بن الحسن الشيباني (343)، وينقل عن ابن عبد البر (التمهيد 5/95) أن مالكاً أرسله وتابعه ابن عيينة وإسماعيل بن أمية، وأن الثوري رواه عن زيد عن عطاء: حدثني الثبت، وأن معمراً وصله عن أبي سعيد الخدري (عبد الرزاق 7151، أبو داود 1636، ابن ماجة 1841، ابن خزيمة 2374، الحاكم 1/407)، وأن أبا حاتم وأبا زرعة والدارقطني خطّؤوا رواية معمر الموصولة، ثم يناقش المحقق طويلاً رواية عبد الرزاق عن معمر والثوري جميعاً، ويذكر أن ابن خزيمة والحاكم والبيهقي والمنذري والألباني وهو نفسه في تعليقه على ابن ماجة صححوا الموصول بناء على قبول زيادة الثقة، ثم يرجح أن المرسل أصح لاتفاق مالك وابن عيينة وإسماعيل بن أمية عليه واضطراب أصحاب الثوري. {cite:muwatta-maruf-1997 p.360} {cite:muwatta-maruf-1997 p.361}"
