text: |-
  •ح).
  ٢٧٥
  قتلوا ابن عفان الخايعة محرما • ودعافلم أرمثله مخذولا
  وقال آخر
  قتسلوا كسرى بليل محرما • غادروه لم يمتسع بكفن
  يريد تتل شيرويه أباه ابرويز بنه رمن وأسوم بالحج والعمرة لانه يحرم عليه ما كان حلالامن
  قبل كالصيد والنساء والاحرام أيضا والتهريم بعنى وقال يصف بعبيرا .
  فرئة قد أومت حل تظهره • فافيه لأفقرى ولا الحج عزعم
  وقوله تعالى للسائل والهروم قال ابن عباس رضى اللّٰه عنه-ماهو المهارف والحيرمة البقرة
  والجمع حيرم وقال =شدل أدمامن ظباءوحيرما حرجم) احرنجم القوم ازدحوا
  قال الفراء الممرغهم العدد الكثر وأنشد
  الدار أقوت بعد محرنجم • من معرب فيها ومن معجم
  وحرجت الابل فاحر فجمت اذارددتهافارتدبعضها على بعض واجتمعت وقال
  عاين حيا كالحراج نعمه • يكون أفهى شل محرنجمه
  ⁦( حزم)⁩ حزمت الشىء ن ما أى شددته والحزم من الارض أرفع من الحزن قال لبيد
  فكأن ظعن الحى لما أشرفت * فى الال وارتفعت بهن حزومV
  والحزم ضبط الرجل أمره وأخذه بالثقسة وقدحزم الرجدل بالضم سزامة فهوحازم واحتزم
  وتحزم بعنى أى تلبب وذلك اذاشدوسطه بجبل والحزمة من الحطب وغيره وحزمة فى قول
  الشاءر• أعددت حزمة وهى مقربة •اسم فرس وحزام الدابة معروف ومنه قواهم جاوز
  لحزام الطبيين تقول منه حزمت الدابة قال لبيد ١ *وألق قتبها لهزوم• ومنه حزام
  الصي فى هده ومحزم الدابة ماجرى عليه حزامها والحزم بالتهريك كالغصصر فى الصدربقال
  منه حزم بالكسر يحزم حزما والحزم أيضاضة الهضم يقال فرس أحزم وهو خلاف الاهضم
  والحزيمتان والزبينتان من باهلة بن عمرو بن تعلبة وهماحزيمة وزبينة قال أبو معدان
  لباهلى
  جاء الحزائم اوالزبائن دلدلا • لاسابقين ولامع القطان
  نعجبت من عوف وماذا كلفت * وتجى=وف آخرار كان
  والحيزوم وسط السدروما يضم عليه الحزام والحزيم مثله يقال شددت لهذا الامر حزيى
  وحيزوم اسم فرس من خيل الملائكة حسم حسعته قطعته فانحسم ومنه حسم العرق
  وفى الحديث انه أتى بسارق نقال اقطعوه ثم أحسموه أى اكووه بالنار لينقطع الدم
  وفى حديث آخر عليكم بالصوم فانه محسمة للعرق ومذهبة للاشر ويقال للسب" السيء الغذاء
  محسوم وقيل فى قوله تعالى وثمانية أيام حسوما أى متتابعة ويقال الحسوم السؤم يقال
  الايالى الحسوم لانها تحسم الظير عن أهلها والحسام السيف القاطع وحسام السيف أيضا
  طرفه الذى يضرب به وقول الهذلى
  ولولا نحن أرهقه صهيب • حسام المتمذروباخشيبا
  يعنى سيفاحديد الحد ويروى حسام السيف أى طرفه وحسم بالضم موضع وقال ٢
  عفاحسم من فرتنا فالقوارع• وحسمى بالكسراسم أرض بالبادية غليظة لاخير فيها تنزلها
  جذام ويقال آخر ماء نضب من ماء الطوقان حسمى فبقيت منه هذه البقية الى اليوم وفيها
  -ق تحيرت الدياركاً نها
  زلف اه
  ٢ فى نسضة زيادة الشاعر
  النابغة وبقية البيت
  فجنبا أريك فألة -لاع الدوافع
