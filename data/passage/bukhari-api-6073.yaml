label: { ar: "صحيح البخاري 6073 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 6073 — what was made lawful; what is not lawful", ur: "صحیح بخاری 6073 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 6073 — Lo que se ha hecho lícito; lo que no es lícito" }
text: "… بْنَ الأَسْوَدِ بْنِ عَبْدِ يَغُوثَ، وَهُمَا مِنْ بَنِي زُهْرَةَ، وَقَالَ لَهُمَا أَنْشُدُكُمَا بِاللَّهِ لَمَّا أَدْخَلْتُمَانِي عَلَى عَائِشَةَ، فَإِنَّهَا لاَ يَحِلُّ لَهَا أَنْ تَنْذُرَ قَطِيعَتِي. فَأَقْبَلَ بِهِ الْمِسْوَرُ وَعَبْدُ الرَّحْمَنِ مُشْتَمِلَيْنِ بِأَرْدِيَتِهِمَا حَتَّى اسْتَأْذَنَا عَلَى عَائِشَةَ فَقَالاَ السَّلاَمُ عَلَيْكِ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، أَنَدْخُلُ قَالَتْ عَائِشَةُ ادْخُلُوا. قَالُوا كُلُّنَا قَالَتْ نَعَمِ ادْخُلُوا كُلُّكُمْ. وَلاَ تَعْلَمُ أَنَّ مَعَهُمَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6073، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6073, that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6073، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6073, menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
