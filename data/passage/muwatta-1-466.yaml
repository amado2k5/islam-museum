label: { ar: "الموطأ 466 — ابن عمر: إذا سُلم على أحدكم وهو يصلي فلا يتكلم وليشر بيده", en: "Muwatta 466", es: "Muwatta 466", fr: "Muwatta 466", ur: "موطا 466", tr: "El-Muvatta 466 — İbn Ömer: Eğer birisi namaz kılarken sizden birini selamlarsa, konuşmamalı, eliyle işaret etmelidir." }
text: "إذا سلم على أحدكم وهو يصلي فلا يتكلم، وليشر بيده"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في جامع الصلاة: مر عبد الله بن عمر على رجل يصلي فسلم عليه فرد الرجل كلاماً، فرجع إليه ابن عمر وقال له إن من سُلم عليه وهو يصلي فلا يتكلم وليشر بيده. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.239}"
  tr: "Malik'in Nafi'den rivayet ettiği, namaz sırasındaki davranışlar bölümünde yer alan bir rivayette şöyle denmektedir: Abdullah ibn Umar, namaz kılan bir adamın yanından geçerken ona selam vermiştir. Adam sözlü olarak karşılık verince İbn Umar yanına dönerek, \"Namaz kılarken selamlanan kişi konuşmamalı, eliyle işaret etmelidir\" demiştir. Editör, bu rivayetin Malik'ten Ebu Mus'ab ve Suwaid tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.239}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang amalan saat shalat: Abdullah ibn Umar melewati seorang laki-laki yang sedang shalat dan memberi salam kepadanya. Laki-laki itu menjawab dengan lisan, lalu Ibn Umar kembali kepadanya dan berkata, “Jika seseorang diberi salam saat shalat, ia tidak boleh berbicara tetapi hendaknya memberi isyarat dengan tangannya.” Editor menyebutkan bahwa Abu Mus’ab dan Suwaid meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.239}"
