text: "إذا سلم على أحدكم وهو يصلي فلا يتكلم، وليشر بيده"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في جامع الصلاة: مر عبد الله بن عمر على رجل يصلي فسلم عليه فرد الرجل كلاماً، فرجع إليه ابن عمر وقال له إن من سُلم عليه وهو يصلي فلا يتكلم وليشر بيده. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.239}"
