text: "… آخرين، عن معاوية. ذكره البَغَوِيّ، وابن شاهين ؛ وأخرجاه من طريق عثمان بن عمر، عن الزهري، عن أبي خزامة الحارث قلتُ: وحديث ابن مهدي في صحيح ابن حِبّان؛ وهو الصواب. ابن سعد أنه قال: يا رسول اللّٰه، أرأيت دواء نتداوى …"
