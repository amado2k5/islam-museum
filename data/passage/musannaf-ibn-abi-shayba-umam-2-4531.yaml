text: "… بن إدريس عن هشام عن الحسن: أنه لم يكن يرى بأساً بشركة اليهوديِّ والنصرانيّ إذا كان المسلم هو الذي يلي الشراء والبيع. - حدثنا هُشَيم عن سليمان أبي محمد الناجي عن ابن سيرين قال: لا تعطِ الذميَّ مالاً مضاربة، وخُذْ …"
