label: { ar: "الموطأ 1886 — مالك: من صبر صبرة طعام، وقد علم كيلها، ثم باعها جزافا وكتم المشتري كيلها، فلا يصلح، فإن أحب المشتري رد الطعام على البائع رده", en: "Muwatta 1886", es: "Muwatta 1886", fr: "Muwatta 1886", ur: "موطا 1886", tr: "El-Muvatta 1886 — Malik: Bir kimse, ölçüsünü bildiği halde bir yığın yiyeceği, alıcıdan gizleyerek ve ölçüsünü belirtmeden satarsa, bu caiz değildir. Alıcı yiyeceği satıcıya iade etmek isterse, bunu yapabilir.", id: "Al-Muwatta 1886 — Malik: Jika seseorang memiliki setumpuk makanan, mengetahui ukurannya, lalu menjualnya tanpa menyebutkan ukurannya dan menyembunyikannya dari pembeli, maka hal itu tidak diperbolehkan. Jika pembeli ingin mengembalikan makanan tersebut kepada penjual, ia boleh melakukannya." }
summary:
  ar: "قال مالك: ومن صبر صبرة طعام، وقد علم كيلها، ثم باعها جزافا، وكتم المشتري كيلها، فإن ذلك لا يصلح. فإن أحب المشتري أن يرد ذلك الطعام على البائع، رده بما كتمه كيله وغره. وكذلك كل ما علم البائع كيله وعدده من الطعام وغيره، ثم باعه جزافا، ولم يعلم المشتري ذلك، فإن المشتري إن أحب أن يرد ذلك على البائع رده. ولم يزل أهل العلم ينهون عن ذلك. {cite:muwatta-maruf-1997 p.175}"
  tr: "Malik şöyle demiştir: Bir kimse, tam ağırlığını bilerek bir yığın yiyecek biriktirir ve alıcıya ağırlığını bildirmeden toplu olarak satarsa, bu caiz değildir. Alıcı, yiyeceği satıcıya iade etmek isterse, bunu yapabilir çünkü satıcı ağırlığı gizlemiş ve onu aldatmıştır. Benzer şekilde, satıcı yiyeceğin veya diğer malların ağırlığını ve miktarını bilerek, alıcıya bildirmeden toplu olarak satarsa, alıcı isterse bunları satıcıya iade edebilir. Alimler bu uygulamayı sürekli olarak yasaklamışlardır. {cite:muwatta-maruf-1997 s.175}"
  id: "Malik berkata: Jika seseorang menimbun setumpuk makanan, mengetahui beratnya yang tepat, lalu menjualnya dalam jumlah besar tanpa memberitahukan beratnya kepada pembeli, ini tidak diperbolehkan. Jika pembeli ingin mengembalikan makanan tersebut kepada penjual, ia boleh melakukannya karena penjual menyembunyikan berat dan menipunya. Demikian pula, jika penjual mengetahui berat dan jumlah makanan atau barang lain dan kemudian menjualnya dalam jumlah besar tanpa memberitahukan kepada pembeli, pembeli boleh mengembalikannya kepada penjual jika ia mau. Para ulama secara konsisten melarang praktik ini. {cite:muwatta-maruf-1997 p.175}"
