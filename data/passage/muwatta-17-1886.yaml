summary:
  ar: "قال مالك: ومن صبر صبرة طعام، وقد علم كيلها، ثم باعها جزافا، وكتم المشتري كيلها، فإن ذلك لا يصلح. فإن أحب المشتري أن يرد ذلك الطعام على البائع، رده بما كتمه كيله وغره. وكذلك كل ما علم البائع كيله وعدده من الطعام وغيره، ثم باعه جزافا، ولم يعلم المشتري ذلك، فإن المشتري إن أحب أن يرد ذلك على البائع رده. ولم يزل أهل العلم ينهون عن ذلك. {cite:muwatta-maruf-1997 p.175}"
