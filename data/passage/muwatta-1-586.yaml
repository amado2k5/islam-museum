label: { ar: "الموطأ 586 — أنس بن مالك: تلك صلاة المنافقين، يجلس أحدهم حتى إذا اصفرت الشمس قام فنقر أربعاً", en: "Muwatta 586" }
text: "تلك صلاة المنافقين؛ يجلس أحدهم حتى إذا اصفرت الشمس، وكانت بين قرني الشيطان، قام فنقر أربعاً، لا يذكر الله فيها إلا قليلاً"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن، قال: دخلنا على أنس بن مالك بعد الظهر فقام يصلي العصر، فلما فرغ ذكرنا تعجيل الصلاة أو ذكرها هو، ثم قال: سمعت النبي يقول ثلاثاً: تلك صلاة المنافقين، يجلس أحدهم حتى إذا اصفرت الشمس وكانت بين قرني الشيطان أو على قرن الشيطان قام فنقر أربعاً لا يذكر الله فيها إلا قليلاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع وابن مهدي عند أحمد، وسويد، والقعنبي ومن طريقه أبو داود (413) والجوهري والبيهقي، وابن وهب عند ابن خزيمة (333) والطحاوي، وعبد الرزاق (2080). {cite:muwatta-maruf-1997 p.302}"
