label: { ar: "الموطأ 586 — أنس بن مالك: تلك صلاة المنافقين، يجلس أحدهم حتى إذا اصفرت الشمس قام فنقر أربعاً", en: "Muwatta 586", es: "Muwatta 586", fr: "Muwatta 586", ur: "موطا 586", tr: "El-Muvatta 586 — Enes bin Malik: Bu, münafıkların duasıdır; içlerinden biri güneş sararana kadar oturur, sonra kalkar ve dört kez gagalar.", id: "Al-Muwatta 586 — Anas bin Malik: Itulah shalat orang-orang munafik; salah seorang dari mereka duduk hingga matahari menjadi kuning, kemudian ia bangun dan mematuk empat kali." }
text: "تلك صلاة المنافقين؛ يجلس أحدهم حتى إذا اصفرت الشمس، وكانت بين قرني الشيطان، قام فنقر أربعاً، لا يذكر الله فيها إلا قليلاً"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن، قال: دخلنا على أنس بن مالك بعد الظهر فقام يصلي العصر، فلما فرغ ذكرنا تعجيل الصلاة أو ذكرها هو، ثم قال: سمعت النبي يقول ثلاثاً: تلك صلاة المنافقين، يجلس أحدهم حتى إذا اصفرت الشمس وكانت بين قرني الشيطان أو على قرن الشيطان قام فنقر أربعاً لا يذكر الله فيها إلا قليلاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع وابن مهدي عند أحمد، وسويد، والقعنبي ومن طريقه أبو داود (413) والجوهري والبيهقي، وابن وهب عند ابن خزيمة (333) والطحاوي، وعبد الرزاق (2080). {cite:muwatta-maruf-1997 p.302}"
  tr: "Malik, Al-Ala' ibn Abd al-Rahman'dan rivayetle şöyle dedi: Öğleden sonra Enes ibn Malik'in yanına girdik ve ikindi namazını kılmak için ayağa kalktı. Namazı bitirdiğinde, biz veya kendisi, namazı çabuk kılmanın önemini anlattı. Sonra şöyle dedi: Peygamberimizin üç defa şöyle buyurduğunu işittim: \"İşte bu, münafıkların namazıdır. Onlardan biri güneş sararana kadar oturur, şeytanın boynuzları arasında veya şeytanın boynuzunun üzerinde olur, sonra kalkar ve dört kez gagasını vurur, Allah'ı ise ancak azıcık hatırlar.\" Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab tarafından, onun isnadından da el-Baghawi, İshak el-Tabba', İbn Mehdi (Ahmed'e göre), Suwaid, el-Ka'nabi tarafından ve onun isnadından da Ebu Davud (413), el-Cevhari, el-Beyhaki, İbn Vahb (İbn Huzeyme'ye göre, 333), el-Tahavi ve Abd el-Razzaq (2080) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.302}"
  id: "Malik meriwayatkannya dari Al-Ala’ ibn Abd al-Rahman, yang berkata: Kami menemui Anas ibn Malik setelah tengah hari, dan beliau berdiri untuk melaksanakan salat Asar. Setelah selesai, kami mengingatkan pentingnya salat dengan cepat, atau beliau sendiri yang mengingatkannya. Kemudian beliau berkata: Aku mendengar Nabi bersabda tiga kali: “Itulah salat orang-orang munafik. Salah seorang dari mereka duduk hingga matahari menjadi kuning dan berada di antara tanduk setan, atau di atas tanduk setan, kemudian ia bangun dan mematuk empat kali, tanpa mengingat Allah kecuali sedikit.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan dari sanadnya oleh al-Baghawi, Ishaq al-Tabba’, Ibn Mahdi (menurut Ahmad), Suwaid, al-Qa’nabi, dan dari sanadnya oleh Abu Dawud (413), al-Jawhari, al-Bayhaqi, Ibn Wahb (menurut Ibn Khuzaymah, 333), al-Tahawi, dan Abd al-Razzaq (2080). {cite:muwatta-maruf-1997 p.302}"
