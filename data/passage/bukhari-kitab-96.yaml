summary:
  ar: "القسم 96 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاعتصام بالكتاب والسنة»، ويضم فيها النصوص من 7268 إلى 7370 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 96 of Sahih al-Bukhari (Holding Fast to the Qur'an and Sunnah) in the division of the open hadith dataset the museum took its reports from: reports 7268 to 7370 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 96، عنوان «کتاب الاعتصام بالکتاب والسنۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7268 تا 7370۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 96 de Sahih al-Bukhari (Aferrarse al Corán y la Sunnah) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 7268 al 7370, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
