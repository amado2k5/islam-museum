text: "… قال: حدثنا شَرِيك عن جابر عن أبي جعفر قال: إذا اضطر إلى ما حَرُم عليه، فما حُرِّم عليه فهو له حلال. - في الرجل يبيع الجارية أو يعتقها ويستثني ما في بطنها - حدثنا أبو بكر قال: حدثنا هُشَيم عن …"
