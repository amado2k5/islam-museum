label: { ar: "الموطأ 983 — سعيد بن المسيب: من اعتمر في شوال أو ذي القعدة أو ذي الحجة ثم أقام بمكة حتى يدركه الحج فهو متمتع، وعليه ما استيسر من الهدي", en: "Muwatta 983" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول: من اعتمر في شوال أو ذي القعدة أو ذي الحجة، ثم أقام بمكة حتى يدركه الحج، فهو متمتع إن حج، وعليه ما استيسر من الهدي، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1110). {cite:muwatta-maruf-1997 p.463}"
