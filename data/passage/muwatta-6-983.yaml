label: { ar: "الموطأ 983 — سعيد بن المسيب: من اعتمر في شوال أو ذي القعدة أو ذي الحجة ثم أقام بمكة حتى يدركه الحج فهو متمتع، وعليه ما استيسر من الهدي", en: "Muwatta 983", es: "Muwatta 983", fr: "Muwatta 983", ur: "موطا 983", tr: "Al-Muwatta 983 - Sa'id ibn al-Musayyab: Kim Şevval, Zilkade veya Zilhicce'de umre yapar ve sonra Hac gelinceye kadar Mekke'de kalırsa Mutamatti' (Temettü Hac yapan kişi) sayılır ve kurbanlık olarak hazır bulunan her şeyi sunmalıdır.", id: "Al-Muwatta 983 — Sa’id ibn al-Musayyab: Barangsiapa yang menunaikan umrah pada bulan Syawal, Dhu al-Qi’dah, atau Dhu al-Hijjah lalu tinggal di Mekkah hingga tibanya haji, maka ia termasuk orang yang Mutamatti’ (orang yang menunaikan Haji Tamattu’), dan ia harus menyembelih hewan kurban apa saja yang tersedia." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول: من اعتمر في شوال أو ذي القعدة أو ذي الحجة، ثم أقام بمكة حتى يدركه الحج، فهو متمتع إن حج، وعليه ما استيسر من الهدي، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1110). {cite:muwatta-maruf-1997 p.463}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ederek, Sa'id ibn al-Musayyab'ın şöyle dediğini işitmiştir: \"Şevval, Zilhicce veya Zilhicce aylarında Umre yapan ve Hac zamanı gelene kadar Mekke'de kalan kimse, Hac yaparsa Tamattu' hacı sayılır. Gücü yettiği kadar kurban kesmelidir. Eğer kurban kesemezse, Hac sırasında üç gün ve dönüşte yedi gün oruç tutmalıdır.\" Editör, Ebu Musab'ın (1110) bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.463}"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id, yang mendengar Sa'id bin al-Musayyab berkata: \"Barang siapa yang melaksanakan Umrah pada bulan Syawal, Dzul Qi'dah, atau Dzul Hijjah, dan kemudian tinggal di Mekah hingga tiba waktu Haji, maka ia dianggap sebagai jamaah haji Tamattu' jika ia melaksanakan Haji. Ia wajib mempersembahkan hewan kurban yang mampu ia beli. Jika ia tidak mampu, ia wajib berpuasa tiga hari selama Haji dan tujuh hari setelah kembali.\" Editor menyebutkan bahwa Abu Mus'ab (1110) meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.463}"
