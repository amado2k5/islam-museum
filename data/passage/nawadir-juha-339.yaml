text: "… واحدة بواحدة وضع كرم في ميدان البيع بمدينة آقَ شَهْرٌ، فظهر له بضعة طالبين، واقترب أحدهم من الشيخ راجياً منه أن يبتاع له ذلك الكرم بثمن مناسب، فذهب جحا إلى صاحب الكرم وساومه، فأتَّفق معه على الثمن، وجاء المُشتري، وسأل …"
summary:
  ar: "عُرض كرم للبيع في آق شهر، فطلب رجل من جحا أن يشتريه له بسعر عادل، ففاوض جحا وحصل على السعر ثم اشترى الكرم لنفسه وطلب من الرجل أن يوافق، خدمة بخدمة. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  en: "In Akshehir a vineyard is put up for sale; a man asks Juha to buy it for him at a fair price; Juha haggles, gets the price, then buys the vineyard for himself and asks the man to approve, as one favour for another. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  ur: "آق شہر میں ایک انگور کا باغ برائے فروخت رکھا گیا، ایک آدمی نے جحا سے کہا کہ اسے اس کے لیے مناسب قیمت پر خرید دے، جحا نے بھاؤ تاؤ کر کے قیمت طے کی، پھر باغ اپنے لیے خرید لیا اور آدمی سے کہا کہ اس کی منظوری دے دے، ایک احسان کے بدلے دوسرا احسان۔ {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  fr: "À Akshehir, une vigne est mise en vente ; un homme demande à Juha de l'acheter pour lui à un prix équitable ; Juha marchande, obtient le prix, puis achète la vigne pour lui-même et demande à l'homme de l'approuver, un service pour un service. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  es: "En Akshehir se pone a la venta un viñedo; un hombre pide a Juha que se lo compre a un precio justo; Juha regatea, consigue el precio, y luego compra el viñedo para sí mismo y pide al hombre que lo apruebe, un favor por otro. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  tr: "Akşehr'de bir bağ satılıktı. Bir adam Juha'dan onu uygun bir fiyata satın almasını istedi. Juha pazarlık yaptı ve fiyatı aldı, sonra bağı kendisi için satın aldı ve adamdan da aynı şeyi yapmasını istedi - iyiliğe iyilikle karşılık. {cite:juha-nawadir-kubra-djuwaydi s. 166}"
  id: "Sebuah kebun anggur ditawarkan untuk dijual di Aqshehr. Seorang pria meminta Juha untuk membelinya untuknya dengan harga yang wajar. Juha bernegosiasi dan mendapatkan harga tersebut, kemudian membeli kebun anggur itu untuk dirinya sendiri dan meminta pria itu untuk menyetujui—sebuah bantuan untuk bantuan. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
