text: "… والثالث الرغبة فى الطاعات من التطوع فى وجود العوافى، والرابع الصبر عن فقد الدنيا عن الجروج إلى المسالة والشكوى، والخامس التميز فى الأخذ عند وجود الشوء، والسادس الشغل باللّه عن وجل عن سائر الأشغال، والسابع الذكر الخفى عن جميع الأذكار، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 22، يرد فيه ذكر الطاعات، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 22, whose wording mentions the acts of obedience, the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 22 کا اقتباس جس میں طاعات، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
