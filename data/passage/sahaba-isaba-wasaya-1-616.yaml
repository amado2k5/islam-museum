text: "… له أبْنُ عبَّاسِ: ذاك عَمْرو بن حُمَمة الدَّوْسي، قضى بين العرب ثلاثمائة سنة، فكبر فألزموه السابعَ أو التاسع من ولده، فكان إذا غفل قَرع له العَصا. فلما حضره الموت اجتمع إليه قومه فأوصاهم بوصية حسنة فيها حكم. ز - جُنْدب …"
