text: "… قَالَتْ نَعَمْ وَاللَّهِ، فَرَجَعْتُ إِلَى بَيْتِي كَأَنَّ الَّذِي خَرَجْتُ لَهُ لاَ أَجِدُ مِنْهُ قَلِيلاً وَلاَ كَثِيرًا، وَوُعِكْتُ فَقُلْتُ لِرَسُولِ اللَّهِ أَرْسِلْنِي إِلَى بَيْتِ أَبِي. فَأَرْسَلَ مَعِي الْغُلاَمَ، فَدَخَلْتُ الدَّارَ فَوَجَدْتُ أُمَّ رُومَانَ فِي السُّفْلِ وَأَبَا بَكْرٍ فَوْقَ الْبَيْتِ يَقْرَأُ. فَقَالَتْ أُمِّي مَا جَاءَ بِكِ يَا بُنَيَّةُ فَأَخْبَرْتُهَا وَذَكَرْتُ لَهَا الْحَدِيثَ، وَإِذَا هُوَ لَمْ يَبْلُغْ مِنْهَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4757، يذكر الحمى والوعك. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4757 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4757، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
