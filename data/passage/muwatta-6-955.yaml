label: { ar: "الموطأ 955 — ابن شهاب: كان عبد الله بن عمر لا يلبي وهو يطوف بالبيت", en: "Muwatta 955", es: "Muwatta 955", fr: "Muwatta 955", ur: "موطا 955", tr: "Al-Muwatta 955 - İbn Şihab: Abdullah ibn Ömer, Kabe'yi tavaf ederken Telbiye okumadı.", id: "Al-Muwatta 955 — Ibnu Shihab: Abdullah bin Umar tidak membaca Talbiyah saat mengelilingi Ka'bah." }
text: "كان عبد الله بن عمر لا يلبي وهو يطوف بالبيت"
summary:
  ar: "يرويه مالك عن ابن شهاب أنه كان يقول: كان عبد الله بن عمر لا يلبي وهو يطوف بالبيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1093) وسويد (503) ويحيى بن بكير عند البيهقي (5/43). {cite:muwatta-maruf-1997 p.455}"
  tr: "Malik, İbn Şihab'dan rivayet ederek şöyle demiştir: Abdullah ibn Ömer, Kâbe'yi tavaf ederken Talbiye okumamıştır. Araştırmacı, bunun Malik'ten Ebu Musab (1093), Suveyd (503) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki'nin (5/43) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.455}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang berkata: Abdullah bin Umar tidak membaca Talbiyah ketika melakukan tawaf di Ka'bah. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1093), Suwaid (503), dan Yahya bin Bukayr, sebagaimana tercatat oleh al-Bayhaqi (5/43). {cite:muwatta-maruf-1997 p.455}"
