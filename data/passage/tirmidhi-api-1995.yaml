label: { ar: "جامع الترمذي 1995 — أدب المزاح وحدوده", en: "Jami' al-Tirmidhi 1995 — the ethics and limits of jesting", ur: "جامع ترمذی 1995 — مزاح کے آداب اور حدود", fr: "Jami' al-Tirmidhi 1995 — l'éthique et les limites de la plaisanterie", es: "Jami' al-Tirmidhi 1995 — la ética y los límites de la broma", tr: "Cami' el-Tirmizi 1995 — Şakalaşmanın adabı ve sınırları", id: "Jami' al-Tirmidhi 1995 — Etika bercanda dan batas-batasnya" }
text: "حَدَّثَنَا زِيَادُ بْنُ أَيُّوبَ الْبَغْدَادِيُّ، حَدَّثَنَا الْمُحَارِبِيُّ، عَنِ اللَّيْثِ، وَهُوَ ابْنُ أَبِي سُلَيْمٍ عَنْ عَبْدِ الْمَلِكِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، عَنِ النَّبِيِّ قَالَ لاَ تُمَارِ أَخَاكَ وَلاَ تُمَازِحْهُ وَلاَ تَعِدْهُ مَوْعِدَةً فَتُخْلِفَهُ . قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ. وَعَبْدُ الْمَلِكِ عِنْدِي هُوَ ابْنُ أَبِي بَشِيرٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1995، فيه أدب المزاح وحدوده. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 1995, with the ethics and limits of jesting. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 1995، جس میں مزاح کے آداب اور حدود ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1995, avec l'éthique et les limites de la plaisanterie. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 1995, con la ética y los límites de la broma. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Cami' el-Tirmizi'nin 1995 numaralı hadisinde, şaka yapmanın adabı ve sınırları ele alınmaktadır. Bu hadis, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine kitaplardan metinler içeren Cüha ve İslam folkloru bölümü tarafından derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1995, membahas adab dan batasan bercanda. Hadits ini disusun oleh bagian Juha dan cerita rakyat Islam, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
