label: { ar: "جامع الترمذي 171 — الأب والأبوة", en: "Jami' al-Tirmidhi 171 — the father and fatherhood", ur: "جامع ترمذی 171 — باپ اور والدیت", es: "Jami' al-Tirmidhi 171 — El padre y la paternidad" }
text: "… عَبْدُ اللَّهِ بْنُ وَهْبٍ، عَنْ سَعِيدِ بْنِ عَبْدِ اللَّهِ الْجُهَنِيِّ، عَنْ مُحَمَّدِ بْنِ عُمَرَ بْنِ عَلِيِّ بْنِ أَبِي طَالِبٍ، عَنْ أَبِيهِ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، أَنَّ النَّبِيَّ قَالَ لَهُ \" يَا عَلِيُّ ثَلاَثٌ لاَ تُؤَخِّرْهَا الصَّلاَةُ إِذَا آنَتْ وَالْجَنَازَةُ إِذَا حَضَرَتْ وَالأَيِّمُ إِذَا وَجَدْتَ لَهَا كُفْؤًا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ حَسَنٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 171، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 171 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 171، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 171 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
