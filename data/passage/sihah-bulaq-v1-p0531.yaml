text: |-
  واغماهوأرحنت أى أعدت
  وأديت هكذا وجدت فى الهامس
  اه مد
  ٢ بهبته بها مين وباءين كذا
  فى نسخة الفاسى دون النسخة التى
  وقعت للمجد فانهاهيته بهاء
  واحدة وباءين فاعترضها وخطآها
  فى القاموس فكذبه المجشى
  الفاسى بعمافى النسخ التى رآها
  بعادين وباءين فرتعليه الشارح
  فإن نسحة الصماح التى بخط ياقوت
  صاحب المعجم الموتوق بم الانها
  قوبلت على نخة أبى ذكريا
  التبريزى وأبى سهل الهروى
  هييته براءواحدة كمانقله فى
  القاموس لا كماادّعاه الفاسى
  متعنتاعلى المجد هذا ما تحصل لى
  من م ر وترجة وانقولى موافقة
  للفاسى فى كونه بهاءين و.ثلهما
  الوشاح حإقاله نصر
  ٨١١٠
  باب الباء)
  منه ماض ولا مسستقبل فى هذا المعني والموهبة بالفتح نقرة فى الجبل يستنقع فيها الماء والجع
  مواهب قال الشاعر
  ولفوك أشهى لويحل لنا • من ماءموهبة على شهد
  وموهب أيضااسم رجل وقال قد أخذتنى نعسة أردّت • وموهب مبز جا مصن
  وهوشاذمغسل موحد على مأبيناه فى موعد ورجل وهاب ووهاية أى كثير الهبة لامواله
  والهاء لتمبالغة أبو عبيد أوهب له الشئ أى دام له قال الشاعر
  عظسيم التفا رخوانلواصر أوهبت * له عجوة مسمومة وخير (١
  ويقال للثى اذا كانمعاعند الرجل مثل الطعام هو وهب بفح الهاء وأصبح فلان
  موهيا يكسر الهاء أى معدا قادوا ووهب بن منبه تسكين الهاء فيه أفصح ووهبيز
  اسم موضع قال الراعى
  رجاؤلك أنسانى تذكراخوتى • ومالك أنسانى بوهبين ماليا
  يب ويب كلة مثلى ويل تول ويبك وويب زيد كماتة ول ويلك معناه ألزمك اللّٰه
  وبلانصب نصب المصادرقان جمت باللام قات ويب لزيد فالرفع مع اللام على الابتدا أجود
  من النصب والنصب مع الاضافة أجود من الرفع
  صل الماء بب هب من تومه يهب اى استيقظ وأهيبته أنا وهبت الريح
  هبو با وهبيبا أى هاجت والهبوبة الريح التى تثير الغبرة وكذلك الهبوب والهبيب تقول من
  أين هبيت يافلان كانك قلت من أين جشت اى من أين اتبهت انا وهب فسلان يفعل كذا
  كماتقول طفق يفعل كذاوهب البعر فى السيرهبابا أى نشط قال لبدد
  فلها هباب فى الزمام كانها • صهباءراح مع الجنوب جهامها
  وهززت السيف والرح فهب هبة وهيته هزته ومضاؤه فى الضربية وهو سيف ذوهة
  ويقال أيضا عشنا بذلكهبة من الدهرأى حقبة كما يقالى سبة قال الاصححى الهبة أيضا
  الساعة تبق من السحر والهبة بالكسرحياج الفحل تقول هب التيس يهب بالكسرهبيبا
  وهبابا اذانب للسفادواهتب مثله وهو مهباب ومهتب وهيهيته ٢ عوته لينزوفتهبهب
  تزعزع والهبهىّ الزاعى قال الاصعى بقال نوب هبائب وخبائب اذاكات متة طعا
  وتهبب النوب بلى ويقال لقطع النوب هبب مثال عنب قال أبو ؤبيه على جناجنه
  -ن ثو يه هبب هدب ) الهدية اتلحملة وضم الدال لغة فيه وهدب الثوب وهداب الثوب
  ما على أطرافه ودمقس مهدب اى ذوهذاب وهدب العين ماتيت من الشسه وعلى أشفارها
  والاهدب الرجل الكثير أشفار العين والهدب بالتحريك كل ورقليس له عرض كورق
  الائل والسر ووالارطى والمارقاء وكذلك الهداب وقال الشاءر دى بن زيد .
  فى ححكناس ظاهر يتره * من عل الثفان هذاب الفنى
  وهذاب النخل سعه وهدب الناقة يهد بها هديا احتلبها وهدب الثمرة أى اجتناها
  والهيدب العيّ النقيل وهيدب السحاب ما تهذب منه اذا أراد الودق كأنه خوط
  قال أوس بن حجر وان مسف فويق الارض هيديه • يكاديد فعه من قام بالراح.
  وهندب بفتح الدال وهندبا وهندباة بقل وقال أبوزيد الهنديا بكسر الدال يمدويقصر
  ⁦(ع دب)⁩
