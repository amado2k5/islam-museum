label: { ar: "سنن أبي داود 3329 — الحلال، الحرام", en: "Sunan Abi Dawud 3329 — the lawful; the unlawful", ur: "سنن ابی داؤد 3329 — حلال، حرام", es: "Sunan Abi Dawud 3329 — lo lícito; lo ilícito", fr: "Sunan Abi Dawud 3329 — le licite; l'illicite" }
text: "… قَالَ سَمِعْتُ النُّعْمَانَ بْنَ بَشِيرٍ، - وَلاَ أَسْمَعُ أَحَدًا بَعْدَهُ يَقُولُ - سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ الْحَلاَلَ بَيِّنٌ وَإِنَّ الْحَرَامَ بَيِّنٌ وَبَيْنَهُمَا أُمُورٌ مُشْتَبِهَاتٌ \". وَأَحْيَانًا يَقُولُ \" مُشْتَبِهَةٌ \". \" وَسَأَضْرِبُ لَكُمْ فِي ذَلِكَ مَثَلاً إِنَّ اللَّهَ حَمَى حِمًى وَإِنَّ حِمَى اللَّهِ مَا حَرَّمَ وَإِنَّهُ مَنْ يَرْعَ حَوْلَ الْحِمَى يُوشِكْ أَنْ يُخَالِطَهُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3329، يذكر الحلال، والحرام، والشبهات. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3329 (Commercial Transactions (Kitab Al-Buyu)), that mentions the lawful, the unlawful, the doubtful matters. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3329، جس میں حلال، حرام، مشتبہ امور کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3329 (Transacciones comerciales (Kitab Al-Buyu)), menciona lo lícito, lo ilícito y lo dudoso. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3329 (Travaux commerciaux), mentionne ce qui est licite, illicite et douteux. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
