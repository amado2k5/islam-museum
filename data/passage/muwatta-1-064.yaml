label: { ar: "الموطأ 64 — زيارة المقبرة: إخواننا الذين لم يأتوا بعد، والغر المحجلون على الحوض", en: "Muwatta 64" }
text: "السلام عليكم دار قوم مؤمنين، وإنا إن شاء الله بكم لاحقون، وددت أني قد رأيت إخواننا"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن عن أبيه عن أبي هريرة، في باب جامع الوضوء: خرج النبي إلى المقبرة فسلّم على أهلها وأخبر أنه لاحق بهم، ثم تمنى أن يرى إخوانه، فسأله أصحابه: ألسنا بإخوانك؟ فقال: بل أنتم أصحابي، وإخواننا الذين لم يأتوا بعد، وأنا فرطهم على الحوض. فسألوه كيف يعرف من يأتي بعده من أمته، فضرب لهم مثل رجل له خيل غر محجلة بين خيل سود لا يخالطها لون، أفلا يعرف خيله؟ وأخبر أن أمته تأتي يوم القيامة غراً محجلين من أثر الوضوء، وأنه يتقدمهم على الحوض، وأن رجالاً يُطردون عن حوضه كما يُطرد البعير الضال فيناديهم، فيقال له إنهم بدلوا بعده، فيقول: فسحقاً فسحقاً. ويفسر المحقق الغرة والتحجيل بالنور في وجوه أمته وأطرافهم، والفَرَط بمن يتقدم القوم إلى الماء، ويبين أن رواية يحيى «فلا يذادن رجل» على النهي، ورواية أبي مصعب وأكثر الرواة «فليذادن» بلام التأكيد على الإخبار، وأن يحيى تفرد بلفظ «رجل» دون «رجال». ويخرّجه عند مسلم (1/151) وأبي داود (3237) والنسائي (1/93) وابن خزيمة (6) وابن حبان وأحمد (2/375) من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.65} {cite:muwatta-maruf-1997 p.66}"
