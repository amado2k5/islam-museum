label: { ar: "الموطأ 64 — زيارة المقبرة: إخواننا الذين لم يأتوا بعد، والغر المحجلون على الحوض", en: "Muwatta 64", es: "Muwatta 64", fr: "Muwatta 64", ur: "موطا 64", tr: "Al-Muwatta 64 — Mezarlığı ziyaret: Henüz gelmemiş olan kardeşlerimiz ve su kuyusundaki beyaz ayaklılar", id: "Al-Muwatta 64 — Mengunjungi pemakaman: Saudara-saudara kita yang belum datang, dan orang-orang berkaki putih di sumur" }
text: "السلام عليكم دار قوم مؤمنين، وإنا إن شاء الله بكم لاحقون، وددت أني قد رأيت إخواننا"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن عن أبيه عن أبي هريرة، في باب جامع الوضوء: خرج النبي إلى المقبرة فسلّم على أهلها وأخبر أنه لاحق بهم، ثم تمنى أن يرى إخوانه، فسأله أصحابه: ألسنا بإخوانك؟ فقال: بل أنتم أصحابي، وإخواننا الذين لم يأتوا بعد، وأنا فرطهم على الحوض. فسألوه كيف يعرف من يأتي بعده من أمته، فضرب لهم مثل رجل له خيل غر محجلة بين خيل سود لا يخالطها لون، أفلا يعرف خيله؟ وأخبر أن أمته تأتي يوم القيامة غراً محجلين من أثر الوضوء، وأنه يتقدمهم على الحوض، وأن رجالاً يُطردون عن حوضه كما يُطرد البعير الضال فيناديهم، فيقال له إنهم بدلوا بعده، فيقول: فسحقاً فسحقاً. ويفسر المحقق الغرة والتحجيل بالنور في وجوه أمته وأطرافهم، والفَرَط بمن يتقدم القوم إلى الماء، ويبين أن رواية يحيى «فلا يذادن رجل» على النهي، ورواية أبي مصعب وأكثر الرواة «فليذادن» بلام التأكيد على الإخبار، وأن يحيى تفرد بلفظ «رجل» دون «رجال». ويخرّجه عند مسلم (1/151) وأبي داود (3237) والنسائي (1/93) وابن خزيمة (6) وابن حبان وأحمد (2/375) من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.65} {cite:muwatta-maruf-1997 p.66}"
  tr: "Malik, tam abdest bölümünde, Al-Ala' ibn Abdülrahman'dan, o da babasından, o da Ebu Hurayra'dan rivayetle şöyle anlatmıştır: Peygamberimiz mezarlığa çıktı, oradakileri selamladı ve onlara katılacağını bildirdi. Sonra kardeşlerini görmek istedi. Sahabeleri ona, \"Biz senin kardeşlerin değil miyiz?\" diye sordular. Peygamberimiz şöyle buyurdu: \"Hayır, siz benim sahabelerimsiniz, kardeşlerimiz ise henüz gelmemiş olanlardır ve ben onları Su Kuyusu'nda bekleyeceğim.\" Bunun üzerine sahabeleri ona, kendisinden sonra gelecek olan ümmetini nasıl tanıyacağını sordular. Peygamberimiz onlara, alınlarında ve bacaklarında beyaz lekeler bulunan atları olan bir adamın örneğini verdi. Adam kendi atlarını tanıyamayacak mıydı? Ve onlara, ümmetinin Kıyamet Günü alınlarında ve ayaklarında abdest izlerinden dolayı beyaz lekelerle geleceğini, kendisinin de kuyuya onlardan önce gideceğini, bazı kişilerin kuyudan başıboş bir deve gibi uzaklaştırılacağını, onlara sesleneceğini ve kendisine onların kendisinden sonra taraf değiştirdikleri söyleneceğini, bunun üzerine de: \"Defolun onlardan! Defolun onlardan!\" diyeceğini bildirdi. Araştırmacı, ümmetinin yüzlerindeki ve uzuvlarındaki parlaklığı ve ışığı, yüzlerindeki ve uzuvlarındaki ışığa ve halkın önünde suya giden yenik kişiye işaret olarak yorumluyor. Yahya'nın rivayetinin, \"Hiç kimse uzaklaştırılmasın\", bir yasaklama olduğunu, Ebu Musab'ın ve çoğu ravi'nin rivayetinin ise, \"Onlar uzaklaştırılsın\", bir ifadeyi belirtmek için vurgulu \"lam\" kullandığını açıklıyor. Ayrıca Yahya'nın \"adam\" kelimesini \"adamlar\" olmadan kullanmasının eşsiz olduğunu da belirtiyor. Bunu, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla Müslim (1/151), Ebu Davud (3237), En-Nesai (1/93), İbn Huzeyme (6), İbn Hibban ve Ahmed'de (2/375) zikrediyor. {cite:muwatta-maruf-1997 s.65} {cite:muwatta-maruf-1997 s.66}"
  id: "Diriwayatkan oleh Malik dari Al-Ala' ibn Abd al-Rahman, dari ayahnya, dari Abu Hurayrah, dalam surah tentang wudhu lengkap: Nabi pergi ke pemakaman dan memberi salam kepada penghuninya serta memberitahu mereka bahwa beliau akan bergabung dengan mereka. Kemudian beliau ingin bertemu saudara-saudaranya, maka para sahabatnya bertanya kepadanya: Bukankah kami saudaramu? Beliau menjawab: Sesungguhnya, kalianlah para sahabatku, dan saudara-saudara kita adalah mereka yang belum datang, dan aku akan menunggu mereka di Telaga. Maka mereka bertanya kepadanya bagaimana beliau akan mengenali orang-orang yang akan datang setelahnya dari kaumnya, lalu beliau memberi mereka contoh seorang laki-laki yang memiliki kuda-kuda dengan tanda putih di dahi dan kakinya di antara kuda-kuda hitam tanpa campuran warna lain. Apakah beliau tidak akan mengenali kuda-kudanya? Dan dia memberi tahu mereka bahwa umatnya akan datang pada Hari Kiamat dengan tanda putih di dahi dan kaki mereka dari bekas wudhu, dan bahwa dia akan mendahului mereka di Telaga, dan bahwa beberapa orang akan diusir dari Telaganya seperti unta yang tersesat diusir, dan dia akan memanggil mereka, dan akan dikatakan kepadanya bahwa mereka telah berubah setelahnya, maka dia akan berkata: Singkirkan mereka! Singkirkan mereka! Peneliti menafsirkan pancaran dan cahaya di wajah dan anggota tubuh umatnya sebagai merujuk pada cahaya di wajah dan anggota tubuh mereka, dan orang yang kalah yang berjalan di depan orang-orang menuju air. Dia menjelaskan bahwa riwayat Yahya, \"Jangan sampai ada seorang pun yang diusir,\" adalah larangan, sedangkan riwayat Abu Mus'ab dan sebagian besar perawi, \"Biarkan mereka diusir,\" menggunakan kata \"lam\" yang menekankan untuk menunjukkan sebuah pernyataan. Dia juga mencatat bahwa Yahya unik dalam menggunakan kata \"manusia\" tanpa \"manusia-manusia.\" Ia mengutipnya dalam Muslim (1/151), Abu Dawud (3237), An-Nasa'i (1/93), Ibnu Khuzaymah (6), Ibnu Hibban, dan Ahmad (2/375) melalui silsilah para sahabat Malik. {kutip:muwatta-maruf-1997 hal.65} {kutip:muwatta-maruf-1997 hal.66}"
