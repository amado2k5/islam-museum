text: "… الوليد بن عبادة قال: دخلت على عبادة. هو مريض اتخايل فيه الموت فقلت : يا ابتاه! اوصى واجتهد لى! فقال: اجلسونى فلما اجلسوه قال: يا ننى! انك لم تطعم الإيمان ولم تبلغ حق حقيقة العلم باللّه حتى تؤمن بالقدر خيره …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 38، يذكر الإيمان بالقدر، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 38, that mentions belief in the decree, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 38 کا اقتباس جس میں تقدیر پر ایمان، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 1, pág. 38, que menciona la creencia en el decreto, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi (tome 1, p. 38) évoquant la croyance au décret divin, la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Kandhlawi'nin Sahabelerin Biyografileri adlı eserinin 1. resimli cildinin 38. sayfasında, kader inancından ve imanın tatlılığı ve mükemmelliğinden bahsedilmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Bu metin, İslam'ın Şartları, İmanın Şartları, İmanın Dalları ve Müminin Özellikleri için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi para Sahabat oleh Kandhlawi, jilid 1 bergambar, halaman 38, menyebutkan kepercayaan pada takdir, dan manisnya serta kesempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Ini disusun oleh peramban untuk Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Karakteristik Orang Beriman."
