label: { ar: "سنن ابن ماجه 46 — أطوار خلق الجنين", en: "Sunan Ibn Majah 46 — the stages of the embryo", ur: "سنن ابن ماجہ 46 — جنین کے مراحل" }
text: "… إِنَّ مَا هُوَ آتٍ قَرِيبٌ وَإِنَّمَا الْبَعِيدُ مَا لَيْسَ بِآتٍ أَلاَ إِنَّ الشَّقِيَّ مَنْ شَقِيَ فِي بَطْنِ أُمِّهِ وَالسَّعِيدَ مَنْ وُعِظَ بِغَيْرِهِ أَلاَ إِنَّ قِتَالَ الْمُؤْمِنِ كُفْرٌ وَسِبَابُهُ فُسُوقٌ وَلاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثٍ أَلاَ وَإِيَّاكُمْ وَالْكَذِبَ فَإِنَّ الْكَذِبَ لاَ يَصْلُحُ بِالْجِدِّ وَلاَ بِالْهَزْلِ وَلاَ يَعِدِ الرَّجُلُ صَبِيَّهُ ثُمَّ لاَ يَفِيَ لَهُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 46، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 46 (The Book of the Sunnah), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 46، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
