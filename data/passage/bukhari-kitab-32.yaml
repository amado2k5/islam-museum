summary:
  ar: "القسم 32 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضل ليلة القدر»، ويضم فيها النصوص من 2014 إلى 2024 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 32 of Sahih al-Bukhari (Virtues of the Night of Qadr) in the division of the open hadith dataset the museum took its reports from: reports 2014 to 2024 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 32، عنوان «کتاب فضل لیلۃ القدر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2014 تا 2024۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 32 de Sahih al-Bukhari (Virtudes de la Noche del Destino) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2014 al 2024, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih al-Bukhari (Livre 32, « Vertus de la Nuit du Destin »), dans la base de données ouverte: les hadiths y sont classés de 2014 à 2024. Les éditions imprimées classent ces hadiths dans ce livre; leur classement et leur numérotation diffèrent."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 32. bölümü \"Kadir Gecesi'nin Faziletleri Kitabı\" başlığını taşımakta olup, 2014'ten 2024'e kadar olan metinleri buna göre numaralandırarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 32 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Keutamaan Laylat al-Qadr\" dan berisi teks-teks dari tahun 2014 hingga 2024, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
