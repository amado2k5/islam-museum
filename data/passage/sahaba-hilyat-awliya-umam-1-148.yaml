text: "… بن عروة بن الزبير عن أبيه. قال كان ورقة بن توفل يمر بيلال وهو يعذب وهو يقول : أحسد أحد، فيقول : أحد، أحد، اللّه يا بلال. ثم يقبل ورقة بن نوفل على أمية بن خلف وهو يصنع ذلك بلال …"
summary:
