label: { ar: "الموطأ 1870 — مالك: الأمر المجتمع عليه أن من اشترى طعاما، من بر أو شعير أو سلت أو ذرة أو دخن، أو شيئا من الحبوب القطنية، أو من الأدم كله، لا يبيعه حتى يقبضه ويستوفيه", en: "Muwatta 1870" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، الذي لا اختلاف فيه، أنه من اشترى طعاما، برا أو شعيرا أو سلتا أو ذرة أو دخنا، أو شيئا من الحبوب القطنية، أو شيئا مما يشبه القطنية، مما تجب فيه الزكاة، أو شيئا من الأدم كلها: الزيت، والسمن، والعسل، والخل، والجبن، والشيرج واللبن، وما أشبه ذلك من الأدم. فإن المبتاع لا يبيع شيئا من ذلك حتى يقبضه ويستوفيه. {cite:muwatta-maruf-1997 p.169}"
