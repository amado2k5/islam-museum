label: { ar: "الموطأ 1870 — مالك: الأمر المجتمع عليه أن من اشترى طعاما، من بر أو شعير أو سلت أو ذرة أو دخن، أو شيئا من الحبوب القطنية، أو من الأدم كله، لا يبيعه حتى يقبضه ويستوفيه", en: "Muwatta 1870", es: "Muwatta 1870", fr: "Muwatta 1870", ur: "موطا 1870", tr: "El-Muvatta 1870 — Malik: İttihat şudur ki, kim buğday, arpa, kılçıklı buğday, mısır, darı veya herhangi bir pamuk tanesi veya başka bir gıda satın alırsa, onu teslim alıp tam ödemesini almadan satmamalıdır.", id: "Al-Muwatta 1870 — Malik: Konsensusnya adalah bahwa siapa pun yang membeli makanan, baik gandum, jelai, spelt, jagung, millet, atau biji kapas, atau makanan lainnya, tidak boleh menjualnya sampai ia telah menerima kepemilikan dan pembayaran penuh." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، الذي لا اختلاف فيه، أنه من اشترى طعاما، برا أو شعيرا أو سلتا أو ذرة أو دخنا، أو شيئا من الحبوب القطنية، أو شيئا مما يشبه القطنية، مما تجب فيه الزكاة، أو شيئا من الأدم كلها: الزيت، والسمن، والعسل، والخل، والجبن، والشيرج واللبن، وما أشبه ذلك من الأدم. فإن المبتاع لا يبيع شيئا من ذلك حتى يقبضه ويستوفيه. {cite:muwatta-maruf-1997 p.169}"
  tr: "Malik şöyle dedi: Aramızda ittifak bulunan ve ihtilaf konusu olmayan husus şudur: Kim zekâtın farz olduğu buğday, arpa, kılçıklı buğday, mısır, darı veya pamuk tanesi ya da pamuğa benzer herhangi bir ürünü veya yağ, tereyağı, bal, sirke, peynir, susam yağı, süt ve benzeri baharatları satın alırsa, bunları teslim alıp tam bedelini almadan satamaz. {cite:muwatta-maruf-1997 s.169}"
  id: "Malik berkata: Masalah yang disepakati di antara kita, dan yang tidak ada perselisihan mengenainya, adalah bahwa siapa pun yang membeli makanan, baik gandum, jelai, spelt, jagung, millet, atau biji kapas, atau apa pun yang serupa dengan kapas, yang wajib dikenakan zakat, atau bumbu apa pun seperti minyak, mentega, madu, cuka, keju, minyak wijen, susu, dan bumbu serupa lainnya, maka pembeli tidak dapat menjualnya sampai ia telah menerimanya dan menerima pembayaran penuh. {cite:muwatta-maruf-1997 p.169}"
