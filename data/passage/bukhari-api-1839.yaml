label: { ar: "صحيح البخاري 1839 — دفن وقبر ومرقد", en: "Sahih al-Bukhari 1839 — a burial, grave or resting place", ur: "صحیح بخاری 1839 — تدفین، قبر اور مرقد", es: "Sahih al-Bukhari 1839 — un lugar de entierro, tumba o descanso." }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ، عَنِ الْحَكَمِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ وَقَصَتْ بِرَجُلٍ مُحْرِمٍ نَاقَتُهُ، فَقَتَلَتْهُ، فَأُتِيَ بِهِ رَسُولُ اللَّهِ فَقَالَ \" اغْسِلُوهُ، وَكَفِّنُوهُ، وَلاَ تُغَطُّوا رَأْسَهُ، وَلاَ تُقَرِّبُوهُ طِيبًا، فَإِنَّهُ يُبْعَثُ يُهِلُّ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1839، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1839 (Penalty of Hunting while on Pilgrimage), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 1839، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1839 (Castigo de la caza durante la peregrinación), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
