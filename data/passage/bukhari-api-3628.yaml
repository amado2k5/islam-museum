label: { ar: "صحيح البخاري 3628 — مرض النبي، المرض والمريض", en: "Sahih al-Bukhari 3628 — the Prophet's illness; illness and the sick", ur: "صحیح بخاری 3628 — نبی کی بیماری، بیماری اور بیمار", es: "Sahih al-Bukhari 3628 — La enfermedad del Profeta; la enfermedad y los enfermos", fr: "Sahih al-Bukhari 3628 — La maladie du Prophète; la maladie et les malades", tr: "Sahih el-Buhari 3628 — Peygamberin Hastalığı, Hastalık ve Hasta", id: "Sahih al-Bukhari 3628 — Penyakit Nabi, Penyakit dan Pasien" }
text: "… سُلَيْمَانَ بْنِ حَنْظَلَةَ بْنِ الْغَسِيلِ، حَدَّثَنَا عِكْرِمَةُ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ خَرَجَ رَسُولُ اللَّهِ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ بِمِلْحَفَةٍ قَدْ عَصَّبَ بِعِصَابَةٍ دَسْمَاءَ، حَتَّى جَلَسَ عَلَى الْمِنْبَرِ فَحَمِدَ اللَّهَ وَأَثْنَى عَلَيْهِ ثُمَّ قَالَ \" أَمَّا بَعْدُ فَإِنَّ النَّاسَ يَكْثُرُونَ وَيَقِلُّ الأَنْصَارُ، حَتَّى يَكُونُوا فِي النَّاسِ بِمَنْزِلَةِ الْمِلْحِ فِي الطَّعَامِ، فَمَنْ وَلِيَ مِنْكُمْ شَيْئًا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3628، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3628 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3628، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 3628 (Virtudes y méritos del Profeta y sus compañeros), menciona la enfermedad del Profeta, así como a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 3628 (Vertus et Mérites du Prophète et de ses Compagnons), mentionne la maladie du Prophète, la maladie et les malades. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 3628 numaralı hadis, Peygamberimizin hastalığını, hastalığın kendisini ve hastayı anlatmaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3628, menyebutkan penyakit Nabi, penyakit itu sendiri, dan pasiennya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
