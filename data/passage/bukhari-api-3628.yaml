text: "… سُلَيْمَانَ بْنِ حَنْظَلَةَ بْنِ الْغَسِيلِ، حَدَّثَنَا عِكْرِمَةُ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ خَرَجَ رَسُولُ اللَّهِ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ بِمِلْحَفَةٍ قَدْ عَصَّبَ بِعِصَابَةٍ دَسْمَاءَ، حَتَّى جَلَسَ عَلَى الْمِنْبَرِ فَحَمِدَ اللَّهَ وَأَثْنَى عَلَيْهِ ثُمَّ قَالَ \" أَمَّا بَعْدُ فَإِنَّ النَّاسَ يَكْثُرُونَ وَيَقِلُّ الأَنْصَارُ، حَتَّى يَكُونُوا فِي النَّاسِ بِمَنْزِلَةِ الْمِلْحِ فِي الطَّعَامِ، فَمَنْ وَلِيَ مِنْكُمْ شَيْئًا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3628، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3628 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3628، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
