text: "… منك؟ قال: نعم فدنا دنوةً، فقلنا مثل مقالتنا، ثم قال له الثالثة: أدنو منك يا رسول الله؟ قال: نعم، حتى ألزقَ ركبتيه بركبة رسول اللّٰه، قال: يا رسول اللّٰه ما الإسلام؟ قال رسول اللّٰه: تقيمُ الصلاة، وتؤتي الزكاة، وتصوم رمضان، …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 4، ص 517، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
