label: { ar: "سنن ابن ماجه 1485 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Ibn Majah 1485 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابن ماجہ 1485 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Ibn Majah 1485 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Ibn Majah 1485 — mentions de nations, religions et peuples non musulmans", tr: "Sunan İbn Majah 1485 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sunan Ibn Majah 1485 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عَبْدَةَ، أَخْبَرَنِي عَمْرُو بْنُ النُّعْمَانِ، حَدَّثَنَا عَلِيُّ بْنُ الْحَزَوَّرِ، عَنْ نُفَيْعٍ، عَنْ عِمْرَانَ بْنِ الْحُصَيْنِ، وَأَبِي، بَرْزَةَ قَالاَ خَرَجْنَا مَعَ رَسُولِ اللَّهِ ـ فِي جِنَازَةٍ فَرَأَى قَوْمًا قَدْ طَرَحُوا أَرْدِيَتَهُمْ يَمْشُونَ فِي قُمُصٍ فَقَالَ رَسُولُ اللَّهِ ـ \" أَبِفِعْلِ الْجَاهِلِيَّةِ تَأْخُذُونَ - أَوْ بِصُنْعِ الْجَاهِلِيَّةِ تَشَبَّهُونَ - لَقَدْ هَمَمْتُ أَنْ أَدْعُوَ عَلَيْكُمْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1485، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1485 (Chapters Regarding Funerals), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1485، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1485 (Capítulos sobre los funerales), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Ibn Majah, n° 1485 (Chapitres relatifs aux funérailles), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, les religions, les sectes et les peuples non musulmans."
  tr: "İbn Majah'ın Sünen'inde yer alan 1485 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 1485, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
