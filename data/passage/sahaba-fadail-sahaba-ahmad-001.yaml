text: "معاني الآثار ( ١٥٣ :٣ ) وقول البيهقي لم أجده في سننه فلعله في كتاب آخر له . ( ١١٣٩) موضوع ومضى برقم ١٠٥٨ من طريق عباد . ( ١١٤٠) موضوع لأجل زكريا بن يحي الكسائي فإنه متروك . وفيه"
