label: { ar: "صحيح البخاري 7290 — ما كُتب على المؤمنين، ما تُرك خشية أن يُفرض", en: "Sahih al-Bukhari 7290 — what was prescribed for the believers; what was left for fear it would be made obligatory", ur: "صحیح بخاری 7290 — جو مومنوں پر لکھ دیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا", fr: "Sahih al-Bukhari 7290 — ce qui a été prescrit aux croyants ; ce qui fut délaissé de crainte qu'il ne devienne obligatoire", es: "Sahih al-Bujari 7290 — lo que se prescribió a los creyentes; lo que se dejó por temor a que se hiciera obligatorio", tr: "Sahih el-Buhari 7290 — Müminler için farz kılınan şeyler, farz kılınma korkusuyla dışarıda bırakılmaz.", id: "Sahih al-Bukhari 7290 — Apa yang diwajibkan bagi orang beriman tidak ditinggalkan karena khawatir akan dijadikan wajib." }
text: "… اللَّهِ فِيهَا لَيَالِيَ، حَتَّى اجْتَمَعَ إِلَيْهِ نَاسٌ، ثُمَّ فَقَدُوا صَوْتَهُ لَيْلَةً فَظَنُّوا أَنَّهُ قَدْ نَامَ، فَجَعَلَ بَعْضُهُمْ يَتَنَحْنَحُ لِيَخْرُجَ إِلَيْهِمْ فَقَالَ \" مَا زَالَ بِكُمُ الَّذِي رَأَيْتُ مِنْ صَنِيعِكُمْ، حَتَّى خَشِيتُ أَنْ يُكْتَبَ عَلَيْكُمْ، وَلَوْ كُتِبَ عَلَيْكُمْ مَا قُمْتُمْ بِهِ فَصَلُّوا أَيُّهَا النَّاسُ فِي بُيُوتِكُمْ، فَإِنَّ أَفْضَلَ صَلاَةِ الْمَرْءِ فِي بَيْتِهِ، إِلاَّ الصَّلاَةَ الْمَكْتُوبَةَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7290، يرد فيه ذكر ما كُتب على المؤمنين، وما تُرك خشية أن يُفرض، والصلاة المكتوبة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 7290 (Holding Fast to the Qur'an and Sunnah), whose wording mentions what was prescribed for the believers, what was left for fear it would be made obligatory, the prescribed prayer. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 7290، جس کے الفاظ میں جو مومنوں پر لکھ دیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا، فرض نماز کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 7290, dont le texte mentionne ce qui a été prescrit aux croyants, ce qui fut délaissé de crainte qu'il ne devienne obligatoire, la prière prescrite. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 7290, cuyo texto menciona lo que se prescribió a los creyentes, lo que se dejó por temor a que se hiciera obligatorio, la oración prescrita. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Buhari'de 7290 numaralı hadis, müminler için farz olan, farz olma korkusuyla yapılmayan ve farz namazları zikretmektedir. Bu hadis, farz, görevler, ibadetler, tavsiye edilenler, mekruh edilenler, haram kılınanlar ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7290, menyebutkan apa yang dianjurkan bagi orang beriman, apa yang tidak dilakukan karena dikhawatirkan akan menjadi wajib, dan shalat yang dianjurkan. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
