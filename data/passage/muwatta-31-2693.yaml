label: { ar: "الموطأ 2693 — بلغ مالكا: النبي يدخل المسجد فيجد أبا بكر وعمر جائعين فيطعمهم أبو الهيثم", en: "Muwatta 2693" }
summary:
  ar: "بلغ مالكا أن رسول الله دخل المسجد فوجد فيه أبا بكر الصديق وعمر بن الخطاب، فسألهما، فقالا: أخرجنا الجوع. فقال رسول الله: وأنا أخرجني الجوع. فذهبوا إلى أبي الهيثم بن التيهان الأنصاري، فأمر لهم بشعير عنده يُعمل، وقام يذبح لهم شاة، فقال رسول الله: نكّب عن ذات الدر، فذبح لهم شاة، واستعذب لهم ماء فعُلّق في نخلة، ثم أُتوا بذلك الطعام فأكلوا وشربوا، فقال رسول الله: لتُسألن عن نعيم هذا اليوم. {cite:muwatta-maruf-1997 p.521}"
