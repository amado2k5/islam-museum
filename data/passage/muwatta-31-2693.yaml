label: { ar: "الموطأ 2693 — بلغ مالكا: النبي يدخل المسجد فيجد أبا بكر وعمر جائعين فيطعمهم أبو الهيثم", en: "Muwatta 2693", es: "Muwatta 2693", fr: "Muwatta 2693", ur: "موطا 2693", tr: "El-Muvatta 2693 — Malik şöyle rivayet etmiştir: Peygamber mescide girdi ve Ebu Bekir ile Ömer'i aç buldu. Bunun üzerine Ebu el-Haytham onları doyurdu.", id: "Al-Muwatta 2693 — Malik meriwayatkan: Nabi memasuki masjid dan mendapati Abu Bakar dan Umar lapar, lalu Abu al-Haytham memberi mereka makan." }
summary:
  ar: "بلغ مالكا أن رسول الله دخل المسجد فوجد فيه أبا بكر الصديق وعمر بن الخطاب، فسألهما، فقالا: أخرجنا الجوع. فقال رسول الله: وأنا أخرجني الجوع. فذهبوا إلى أبي الهيثم بن التيهان الأنصاري، فأمر لهم بشعير عنده يُعمل، وقام يذبح لهم شاة، فقال رسول الله: نكّب عن ذات الدر، فذبح لهم شاة، واستعذب لهم ماء فعُلّق في نخلة، ثم أُتوا بذلك الطعام فأكلوا وشربوا، فقال رسول الله: لتُسألن عن نعيم هذا اليوم. {cite:muwatta-maruf-1997 p.521}"
  tr: "Malik rivayet etti ki, Allah Resulü mescide girdi ve orada Ebu Bekir es-Siddik ve Ömer ibn es-Hattab'ı buldu. Onlara sordu ve onlar, \"Açlık bizi dışarı çıkardı\" diye cevap verdiler. Allah Resulü, \"Beni de açlık dışarı çıkardı\" dedi. Bunun üzerine Ebu Haytham ibn es-Tayhan es-Ensari'ye gittiler. O da onlara arpa hazırlatılmasını emretti. Onlar için bir koyun kesmek üzere kalktı, ancak Allah Resulü, \"Sütlü olanı kesme\" dedi. Bunun üzerine onlar için bir koyun kesti ve onlara hurma ağacına astığı taze su getirdi. Sonra onlara yemek getirildi ve yediler, içtiler. Allah Resulü, \"Bu günün bereketleri hakkında mutlaka sorguya çekileceksiniz\" dedi."
  id: "Malik meriwayatkan bahwa Rasulullah SAW memasuki masjid dan mendapati Abu Bakar al-Siddiq dan Umar ibn al-Khattab di sana. Beliau bertanya kepada mereka, dan mereka menjawab, \"Kelaparan telah memaksa kami keluar.\" Rasulullah SAW bersabda, \"Dan kelaparan juga telah memaksa aku keluar.\" Maka mereka pergi kepada Abu al-Haytham ibn al-Tayhan al-Ansari, yang memerintahkan agar jelai yang dimilikinya disiapkan untuk mereka. Ia berdiri untuk menyembelih seekor domba untuk mereka, tetapi Rasulullah SAW bersabda, \"Hindari domba yang sedang menyusu.\" Maka ia menyembelih seekor domba untuk mereka, dan ia membawakan mereka air tawar, yang digantungnya di pohon kurma. Kemudian mereka diberi makan, dan mereka makan dan minum. Rasulullah SAW bersabda, \"Kalian pasti akan ditanya tentang nikmat hari ini.\""
