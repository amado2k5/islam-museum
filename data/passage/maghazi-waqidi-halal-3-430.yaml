text: "… أَذهب نَخْوَة الجاهليّة وتكبُّرها بآبائها، كلُّكم مِن آدم وآدمُ. ين تُراب، وأكرمكم عند اللّه أَتقاكم. أَلا إنَّ اللّٰه حرّم مكَّة يوم خَلَق السمواتِ والأَرض، فهى حرامٌ بِحرْمَة الله، لم تحِلّ لأحدٍ قبلى، ولا تحِلُّ لأَحدٍ كائنٍ بعدى، ولم تَحِلّ لى …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 3، ص 430، يذكر ما أُحل، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 3, p. 430, that mentions what was made lawful, what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 3، ص 430 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Maghazi de al-Waqidi, volumen 3, pág. 430, que menciona lo que se ha declarado lícito, lo que no lo es, lo ilícito y lo que se ha declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Maghazi d'al-Waqidi, volume 3, page 430, mentionnant ce qui a été rendu licite, ce qui ne l'est pas, ce qui est illicite et ce qui a été rendu illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "El-Vakidi'nin El-Magazi adlı eserinin 3. cildinin 430. sayfasından bir alıntı, izin verilen, izin verilmeyen, haram olan ve yasaklanan şeyleri belirtmektedir; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Al-Waqidi's Al-Maghazi, Volume 3, halaman 430, menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dilarang, dan diharamkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
