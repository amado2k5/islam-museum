label: { ar: "جامع الترمذي 1048 — دفن وقبر ومرقد", en: "Jami' al-Tirmidhi 1048 — a burial, grave or resting place", ur: "جامع ترمذی 1048 — تدفین، قبر اور مرقد", es: "Jami' al-Tirmidhi 1048 — un lugar de entierro, tumba o descanso." }
text: "… مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ شُعْبَةَ، عَنْ أَبِي حَمْزَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ جُعِلَ فِي قَبْرِ النَّبِيِّ قَطِيفَةٌ حَمْرَاءُ. قَالَ وَقَالَ مُحَمَّدُ بْنُ بَشَّارٍ فِي مَوْضِعٍ آخَرَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، وَيَحْيَى، عَنْ شُعْبَةَ، عَنْ أَبِي جَمْرَةَ، عَنِ ابْنِ عَبَّاسٍ،. وَهَذَا أَصَحُّ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَقَدْ رَوَى شُعْبَةُ، عَنْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1048، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1048 (The Book on Jana''iz (Funerals)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1048، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1048 (El Libro de los Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
