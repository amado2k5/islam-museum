text: |-
  ١ فى نسخة زيادة شطربين
  الشطرين
  تأبرى من حنذ نشولى
  •طافيل أبكارجديث نتاجها
  ٢٢٦
  *⁦(فصل الفاء)⁩.
  وخال التخل والهع الفهاحيل وهو ما كان من ذكوره فحلالانائه وقال
  يطفن بفحال كأن بعلونه • بطون الموالى يوم عيسد تغدت
  وقديق ال فيه في ل وفحول ولا يقال فحال الافى النخل قال الراجز ١
  تأبرى ياخسيرة الفسيل * اذضن أهل النخل بالفحول
  والفحل حصير يتضذ من غحال النخل وفى الحديث أنه عليه السلام دخل على رجل من
  الانصار وفى باحية البيت فحل من تلك القهول فأمريناحية منه فرشت ثم صلى عليه
  واستفحل الامر أى تفاقم وتفمل أى تشبه بالفحعل وامرأة فحملة سليطة عل
  الذرعل ولد الضبع وفى المثل أغزل من فرعل وهومن الغزل والمراودة ⁦(فسل)⁩ الفسل
  من الرجال الرذل والمفسول مثله وقد فسل بالضم فسالة وفسولة فهو فسل من قوم فسلا.
  وأفسال وفسال وفسول وقال
  اذا ماعد أربعة فسال * فزوجك خامس وأبوك سادى
  وفسالة الحديد حالته والمفسلة المرأة التى اذا نشط زوجها لغشيانها اعتلت عليه والغسيلة
  والفسيل الودىّ وهو صغار النخل والمع القسلان ⁦(فسكل)⁩ الفسكل بالمكسر الذى يجى
  فى الحلية آخر انحدل ومنه قيل رجل فسكل اذا كان ردّلا والعامّة تقول فسكل بالضم قال آبو
  الغوث آولها الجلى وهو السابق ثم المصلى ثم المسلى ثم التالى ثم العاطف ثم المرتاح ثم المؤمّل ثم
  الحظى ثم اللطيم ثم السكيت وه والفسكل والقاشور ( شل الفشل الرجل الضعيف
  الجبان والجمع أفشال وقد فشل بالكسر فشلا اذا جبن والفشل شئ من أداة الهودج
  وتفشل الماء أى سال والفيشلة رأس الذكر صل الفصل واحد الفصول وفصات
  الشئ فا نفصل أى قطعته فانقطع وفصل من الناحية أى خرج وفصلت الرضيع عن أقه فصالا
  وافتصلته اذ افطمته وفاصلت شريكى والفصل واحدمف اصل الاعضاء وأما الذى فى شعر أبى
  ذؤيب ٢ تشاب بماء مثل ما المفاصل • فهوجع المفصل قال الاصحمى هى منفصل
  الحبل من الرملة يكون بينه-مارضراض وحصى صغاريصة وماؤه ويبرق والمفصل
  بالكسر اللسان والفاصلة فى العروض الصغرى والمكبرى فالصغرى ثلاث متحركات
  بعدها ساكن تحوضر بت والكيرى أربع متحتر كات بعدهاسا كن فحوضربنا والفاصلة
  التى فى الحديث من أنق نفقة قاصلة فه من الاجركذافتفيره فى الحديث أنها التى
  فصات بين ايمانه وكفره والفصيل حائط قصيردون سور المدينة والحصن والفصيل ولد الناقة
  اذا فصل عن أمه والبمع فصلان وفصال وفصيلة الرجل رهطه الادنون يقال جاؤا بفصيلتهم !
  أى بأجعهم وعقدمص-ل أى جعل بين كل لولؤتين خرزة والتفصيل أيضا التييين وفصل
  القصاب الشاة أى عضاها والفيصل الحاكم ويقال القضاء بين الحق والباطل ( ضل
  الفضل والفضلة خلاف النقص والنقبصة والافضال الاحسان ورجل مفضال واعرأة
  فضالة على قومها اذا كانت ذات فضل سمحة وأفضل عله وتفضل بعنى والمتفضل أيضا
  الذى يدعى الفضل على أقرانه ومنه قوله تعالى يريد أن يتفضل عليكم وأفضلت منه شا
  واستفضات بعفى وفضلته على غيره تفضيلااذا حكمت له بذلك أوصيرته كذلك وفاضلته
  ومضلته
