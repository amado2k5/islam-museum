text: |-
  ١ ⁦(فصل الغام)⁩
  ٤٦٧
  اذا كان الرجل على حافربرذونا كان أوفرسا أويغلا أوحارا قلت من بنافارس على بغل.
  ومرينافارس على حار قال الشاعر
  وانى امر وللخيسل عندى مزية • على فارس البرذون أوفارس البغل
  وقال عمارة بن عقيل بن يلال بن حِر يرلا أقول اصاحب البغل قارس ولمكنى أقول بغال
  ولا أقول لصاحب المارفارس ولكنف أقول حار والفرسة رمح تأخذ فى العنق فته رسها
  والفريس حلقة من خشب يقال لها بالفارسية جنبر وفرس الاسدفريسته بفرسمافرسا
  واقترسها أى دق عنقها وأصل الفرس هذا ثم كثر واستعمل حتى صير كل قتل فرساوقد
  نهى عن الفرس فى الذبح وهو كسر عظم الرقبة قبل أن تبرد قال ابن السكيت فرس الذتب
  المشاة فرسا وأفرس الراعى أى فرس الذتب شاة من غفه قال وأفرس الرجل الاسدجاره
  اذا تر كهله ليفترسه وينجوهو وقال النضر بن شميسل يقال أكل الذئب الشاة ولا يقال
  مترسها وأبو فراس كنية الاسد وفارس الفرس بالضم وفى الحديث وخدمتهم فارس والروم
  وفارس يلاد الفرس أيضا والفرسات الفوارس وفرسان بالفتح قبيلة والفراسة بالكسر
  الاسم من قولكْ تفرّست فيه خيرا وهو يتفرس أى يتثبت ويتظرة ول منه رجل فارس النظر
  وفى الحديث اتقوافراسة المؤمن والفراسة بالفتح مصدر قولك رجل قارس على الخيسل بين
  الفراسة والفروسة والفروسية وقد فرس بالضم يفرص فروسة وفراسة أى حذق أمر الخيل
  والفرس بالكسر ضرب من النيت عن يعقوب والفرسن بالفون للبعير كالحافر للدابة وربما
  قيسل فرسن شاة على الاستعارة وهو فعلن قال أبو بكر بن السراج النون زائدة لانها من
  فرست والفرناس مثال الفرصاد الاسدوهو الغليظ الرقبة وكذلك الفرائس مثل الفرائق
  والتّون زائدة ⁦( فردس)⁩ الفردوس البستان قال القراءهوعربى والفردوس حديقة
  فى الجنة وفردوس اسم روضة دون اليمامة والفراديس موضع بالشام وكرم مفردس أى
  معرّش رطس) فرطوسة الخنزيرأنفسه طس) الفطس بالتحريك تطامن
  قصبة الانف واتشارها والرجل أفطس والاسم الفطسة بالتحريك لانه كالعاهة والفطسة
  بالتسكين خرزة يوخذبها يقولون أخذته بالفطسة بالنؤباء والعطسة وفطس بفطس فطوسا
  أى مات والفطيس مثال الفسيق المطرقة العظيمة وفطيسة الخنزير أيضا أنفه وكدلك
  الفنطيسة ( فقس: فقسر فقوسا أى مات وفقس الطائريضه نقا أى افسد.
  قعس فقعس أبو قبيلة من بنى أسد وهو فقعس بن طرينين عم-روين الحسرث
  ابن تغلبة بن ذودان بن أسد⁦( فلحس)⁩ أبو عبيد الفلس الحريص ويقال للكاب فلفس
  وفلحس أيضا اسم رجل من بنى شيبان وفيه المش-ل أسأل من فلس زعموا أنه كان يسال-هما
  فى الجيش وهو فى بيته فيعطى اعزه وسودده فاذا أعطيه سأل لامر أنه فاذا أعطيه سأل لبعيره
  (فلس الفلمر يجمع على أفلس فى القلة والكثير فلوس وقد أفلس الرجل صار. فل
  سكأنما صارت دراهمه فلوساوز يوفا كما يقال أخبث الرجل اذا صار أصحابه خبتا..
  وأقطف صارت دابته قطوفا ويجوز أن يرادبه أنه صار الى حال يقال فيهاليس معم فلس
  كما يقال أقهر الرجل اذاصار الى حال يهرعليها وأذل الرجل صار الى حال يذل فيها
