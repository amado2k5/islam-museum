label: { ar: "الموطأ 1612 — هشام بن عروة عن أبيه: في رجل تظاهر من أربع نسوة بكلمة واحدة، إنه ليس عليه إلا كفارة واحدة", en: "Muwatta 1612", es: "Muwatta 1612", fr: "Muwatta 1612", ur: "موطا 1612", tr: "El-Muvatta 1612 — Hişam ibn Urve, babasından rivayetle: Tek bir sözle dört kadını zina ile suçlayan bir adamın yalnızca bir kefaret ödemesi gerekir.", id: "Al-Muwatta 1612 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Mengenai seorang pria yang secara palsu menuduh empat wanita berzina dengan satu pernyataan, dia hanya diwajibkan untuk memberikan satu penebusan." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أنه قال في رجل تظاهر من أربع نسوة له بكلمة واحدة، إنه ليس عليه إلا كفارة واحدة. {cite:muwatta-maruf-1997 p.68}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından naklederek, tek bir sözle dört karısını zina ile suçlayan bir adam hakkında şöyle dediğini aktarır: \"Onun sadece bir kefaret ödemesi gerekir.\" {cite:muwatta-maruf-1997 s.68}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, bahwa beliau berkata mengenai seorang pria yang secara palsu menuduh empat istrinya berzina dengan satu pernyataan, bahwa ia hanya diwajibkan untuk memberikan satu penebusan. {cite:muwatta-maruf-1997 p.68}"
