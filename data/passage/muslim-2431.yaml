text: "قال أبو موسى: قال رسول الله: كمل من الرجال كثير ولم يكمل من النساء غير مريم بنت عمران وآسية امرأة فرعون، وإن فضل عائشة على النساء كفضل الثريد على سائر الطعام"
summary:
