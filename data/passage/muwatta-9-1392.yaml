label: { ar: "الموطأ 1392 — جابر بن عبد الله: نهى النبي عن أكل لحوم الضحايا بعد ثلاثة أيام، ثم قال كلوا وتصدقوا وتزودوا وادخروا", en: "Muwatta 1392", es: "Muwatta 1392", fr: "Muwatta 1392", ur: "موطا 1392", tr: "El-Muvatta 1392 — Cabir ibn Abdullah: Peygamberimiz kurban edilen hayvanların etini üç günden sonra yemeyi yasakladı, sonra da şöyle buyurdu: Yiyin, zekât verin, erzak alın ve bir kısmını da saklayın.", id: "Al-Muwatta 1392 — Jabir ibn Abdullah: Nabi melarang memakan daging hewan kurban setelah tiga hari, kemudian beliau bersabda: Makanlah, berikanlah sedekah, ambillah bekal, dan simpanlah sebagian." }
text: "كُلُوا، وَتَصدَّقُوا، وَتَزوَّدُوا، وَادَّخِرُوا"
summary:
  ar: "يروي مالك عن أبي الزبير المكي عن جابر بن عبد الله أن رسول الله نهى عن أكل لحوم الضحايا بعد ثلاثة أيام، ثم قال بعد كلوا وتصدقوا وتزودوا وادخروا. {cite:muwatta-maruf-1997 p.622}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den, o da Cabir ibn Abdullah'tan rivayet ettiğine göre, Allah Resulü kurbanlık hayvanların etini üç günden sonra yemeyi yasaklamış, sonra da: Yiyin, zekât verin, erzak alın ve bir kısmını saklayın diye buyurmuştur. {cite:muwatta-maruf-1997 s.622}"
  id: "Malik meriwayatkan dari Abu al-Zubayr al-Makki, dari Jabir ibn Abdullah, bahwa Rasulullah SAW melarang memakan daging hewan kurban setelah tiga hari, kemudian beliau bersabda: Makanlah, berikanlah sedekah, ambillah bekal, dan simpanlah sebagian. {cite:muwatta-maruf-1997 p.622}"
