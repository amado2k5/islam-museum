text: "… يتعلم، ولا يستحي - إذا سئل عما لا يعلم - أن يقول: لا أعلم. واعلموا أن الصير من الإيمان بمنزلة الرأس من الجسد، و لا خير في جسد لا رأس له. وعن أبي عبد الرحمن السلمي، عن علي بن أبي …"
summary:
