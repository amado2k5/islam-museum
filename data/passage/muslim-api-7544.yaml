label: { ar: "صحيح مسلم 7544 — ما حُرّم", en: "Sahih Muslim 7544 — what was made unlawful", ur: "صحیح مسلم 7544 — جو حرام کیا گیا", es: "Sahih Muslim 7544 — lo que se declaró ilícito", fr: "Sahih Muslim 7544 — ce qui a été déclaré illicite", tr: "Sahih Muslim 7544 — Haram Olan Şeyler", id: "Sahih Muslim 7544 — Apa yang dilarang" }
text: "… وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ} إِلَى قَوْلِهِ { مُهَانًا} فَقَالَ الْمُشْرِكُونَ وَمَا يُغْنِي عَنَّا الإِسْلاَمُ وَقَدْ عَدَلْنَا بِاللَّهِ وَقَدْ قَتَلْنَا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ وَأَتَيْنَا الْفَوَاحِشَ فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ { إِلاَّ مَنْ تَابَ وَآمَنَ وَعَمِلَ عَمَلاً صَالِحًا} إِلَى آخِرِ الآيَةِ. قَالَ فَأَمَّا مَنْ دَخَلَ فِي الإِسْلاَمِ وَعَقَلَهُ ثُمَّ قَتَلَ فَلاَ تَوْبَةَ لَهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 7544، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 7544 (The Book of Commentary on the Qur'an), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 7544، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 7544 (El Libro de Comentarios sobre el Corán), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 7544 (Commentaire du Coran), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 7544 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram sözlüğünün bu bölümü, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 7544, menyebutkan apa yang diharamkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
