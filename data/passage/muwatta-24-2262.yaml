label: { ar: "الموطأ 2262 — يحيى بن سعيد: عائشة تعتق عن أخيها بعد وفاته", en: "Muwatta 2262", es: "Muwatta 2262", fr: "Muwatta 2262", ur: "موطا 2262", tr: "El-Muvatta 2262 — Yahya bin Said: Ayşe, erkek kardeşinin ölümünden sonra onun adına bir köleyi azat etti.", id: "Al-Muwatta 2262 — Yahya bin Saeed: Aisyah membebaskan seorang budak atas nama saudara laki-lakinya setelah kematiannya" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عبد الرحمن بن أبي بكر توفي في نومه، فأعتقت عنه عائشة رقابا كثيرة. قال مالك: وهذا أحب ما سمعته إلي في ذلك. {cite:muwatta-maruf-1997 p.332} {cite:muwatta-maruf-1997 p.333}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Abdülrahman ibn Abi Bekr'in uykusunda vefat ettiğini ve Ayşe'nin onun adına birçok köleyi azat ettiğini söyler. Malik şöyle demiştir: Bu konuda duyduğum en hoş rivayet budur. {cite:muwatta-maruf-1997 s.332} {cite:muwatta-maruf-1997 s.333}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Abd al-Rahman ibn Abi Bakr meninggal dalam tidurnya, dan Aisyah membebaskan banyak budak atas namanya. Malik berkata: Ini adalah riwayat yang paling menyenangkan yang pernah saya dengar mengenai masalah ini. {cite:muwatta-maruf-1997 p.332} {cite:muwatta-maruf-1997 p.333}"
