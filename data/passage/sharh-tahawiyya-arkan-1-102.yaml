text: "… به، وبما جاء به، ومحبته فوق محبة الأهل والولد والمال والنفس، قال النبي اليه: ثلاث من كن فيه وجد حلاوة الإيمان: أن يكون اللّٰه ورسوله أحب إليه مما سواهما... الحديث. وقال وَلِيه: لا يؤمن أحدكم حتى أكون أحب إليه من …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 102، يذكر حلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 102, that mentions the sweetness and completeness of faith, what faith is not complete without, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 102 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، جس کے بغیر ایمان مکمل نہیں، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
