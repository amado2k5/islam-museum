text: "… قدمنا لأربع مضين من ذي الحِجَّة، مُهلِّين بالحج، فأمرنا رسول اللّٰه عَل فَنَقَضْنَا حجنا، وجعلناها صَخْر بن حَرْب عمرة، وطفنا بالبيت وسعينا بين الصفا والمروة، وأحللنا مما يحل منه الحَرَام، وأصبنا ما يصيب الحَلاَلُ من النساء والطيب، حتى إذا كان …"
