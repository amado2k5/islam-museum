text: "… مَعَدَّ أَنَّ قَوْمِي كِرَامُ النَّاسِ أَنَّ لَهُمْ كِرَامًا وَأَيِّ النَّاسِ لَمْ نُعْلِكْ لِجامًا؟ فَأَيْ النَّاسِ فَاتُونَا بِوِثْرٍ ؟ شُهُورَ الْجِلِّ نَجْعَلُهَا حَرَامَا؟ أَلَسْنَا النَّاسِئِينَ عَلَىٰ مَعَدٌ قال ابن هشام : أول الأشهر الحُرُمِ المحرّمُ. إحداث الكناني في القليس، وحملة أبرهة …"
