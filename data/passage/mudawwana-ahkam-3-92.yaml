text: "… منه لانه لم يكن دينا للسيد يجب على الزوج لو هلك أو طلق قبل البناء ولم يكن مالا للجارية على أحد لو طلقها أومات عنها وانما يجب بعد الفريضة أو الدخول وانما هو شئ تطوع به الزوج لم يكن يلزمه …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 3، ص 92، يرد فيه ذكر الفريضة والفرائض، وما يجب على المكلف، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 3, p. 92, whose wording mentions the obligation (farida), what is binding on the person addressed, the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 3، ص 92 کا اقتباس جس میں فریضہ اور فرائض، جو مکلف پر واجب ہے، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 3, p. 92, dont le texte mentionne l'obligation (farida), ce qui s'impose à la personne responsable, l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mudawwana al-Kubra, volumen digitalizado 3, p. 92, cuyo texto menciona la obligación (farida), lo que obliga a la persona responsable, el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Büyük Derleme, Resimli Cilt 3, sayfa 92'den bir alıntı; zorunlu eylemler ve görevler, sorumlu bireyden beklenenler ve gönüllü eylemlerden bahsediyor; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu eylemler, görevler, itaat eylemleri, tavsiye edilen eylemler, hoş karşılanmayan eylemler, yasak eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kompendium Agung, Jilid Bergambar 3, halaman 92, yang menyebutkan tindakan dan kewajiban wajib, apa yang dituntut dari individu yang bertanggung jawab, dan tindakan sukarela; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk tindakan wajib, kewajiban, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa kecil."
