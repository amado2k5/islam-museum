text: "… ذلك : لقولك ولا اعبد الرب الذي تدموت الييه فقال لها الملك حينئذا يا امّد ان قولك هذا قد قطع فيما يننى! وبيتك رحبى وامر بها الملك عند ذلك فأخرجوها وغربوها ثم أوصى الى صاحب شرطته، وبابه ان يقتلها إن …"
