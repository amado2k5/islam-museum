text: "… أنه غير جائز لانه ان كان الذى أعطاه الدراهم أخذ غير اسمه فلا يجوز شراؤه وان كان الذى يعطى الدراهم هو صاحب الاسم فقد باع أحدهما الآخر بما لا يحل له فان كان الآخر هو صاحب الاسم فلا يجوز له …"
