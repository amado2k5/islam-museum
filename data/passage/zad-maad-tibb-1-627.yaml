text: "… ويذكر عن النبي في أن المَعِدَة حوضُ البدن، والعُروق إليها واردة، فإذا صحَّت المَعِدَةُ صدرت العروقُ بالصحة، وإذا سَقِمَتِ المعدَةُ، صدرت العروقُ بالسقم. وقال الحارث: رأس الطَّبِّ الحمية، والحمية عندهم للصحيح في المضرة بمنزلة التخليط للمريض والنَّاقِه، وأنفعُ ما تكون …"
