text: "يهنئونهم بما تفضل اللّٰه به عليهم من التوبة، وجاء كعب إلى النبي وَلِلظِ ووجهه يبرق من السرور فقال له: ⁦(⁦(أبشر بخير يوم مرّ عليك منذ ولدتك أمك)⁩)⁩، وهذا يعني مقام التوبة وأنها أعظم من الدخول في الإسلام. إن…"
