label: { ar: "الموطأ 1921 — مالك: تفسير ذلك أن يقول الرجل للرجل: آخذ سلعتك بكذا وكذا على أن تسلفني كذا وكذا، فإن عقد البيع على هذا فهو غير جائز، فإن ترك الذي اشترط السلف ما اشترط منه كان البيع جائزا", en: "Muwatta 1921", es: "Muwatta 1921", fr: "Muwatta 1921", ur: "موطا 1921", tr: "El-Muvatta 1921 — Malik: Bunun açıklaması şudur: Bir adam başka bir adama, \"Mallarını şu şu fiyata alacağım, ancak bana şu şu miktarı borç vermen şartıyla\" derse, satış sözleşmesi geçerli olmaz. Ancak, borç vermeyi şart koşan kişi şart koştuğunu yerine getirmezse, satış geçerlidir.", id: "Al-Muwatta 1921 — Malik: Penjelasannya adalah jika seseorang berkata kepada orang lain: Saya akan mengambil barang Anda dengan harga sekian dengan syarat Anda meminjamkan saya sejumlah uang tertentu, maka perjanjian jual beli tersebut tidak sah. Namun, jika pihak yang memberikan pinjaman tidak memenuhi syarat tersebut, maka perjanjian jual beli tersebut sah." }
summary:
  ar: "قال مالك: وتفسير ذلك أن يقول الرجل للرجل: آخذ سلعتك بكذا وكذا، على أن تسلفني كذا وكذا. فإن عقد بيعهما على هذا فهو غير جائز. فإن ترك الذي اشترط السلف ما اشترط منه، كان ذلك البيع جائزا. {cite:muwatta-maruf-1997 p.187}"
  tr: "Malik şöyle demiştir: Bunun açıklaması şudur: Bir kişi diğerine şöyle der: \"Mallarını şu şu fiyata alacağım, ancak bana şu şu fiyatı borç vermen şartıyla.\" Eğer satış buna dayalıysa, caiz değildir. Ancak, borç veren kişi şartını yerine getirmezse, o zaman satış caizdir. {cite:muwatta-maruf-1997 s.187}"
  id: "Malik berkata: Penjelasannya adalah bahwa seseorang berkata kepada orang lain: Saya akan mengambil barang Anda dengan harga sekian, dengan syarat Anda meminjamkan saya sejumlah uang tertentu. Jika penjualan tersebut berdasarkan hal ini, maka tidak diperbolehkan. Namun, jika orang yang memberikan pinjaman tidak memenuhi syarat tersebut, maka penjualan itu diperbolehkan. {kutipan:muwatta-maruf-1997 hlm.187}"
