label: { ar: "موطأ مالك 972 — ما يجب على المكلف", en: "Muwatta Malik 972 — what is binding on the person addressed", ur: "موطأ مالک 972 — جو مکلف پر واجب ہے", fr: "Muwatta de Malik 972 — ce qui s'impose à la personne responsable", es: "Muwatta de Malik 972 — lo que obliga a la persona responsable" }
text: "… الرَّجُلُ الشَّىْءَ فِي الْغَزْوِ فَيَبْلُغُ بِهِ رَأْسَ مَغْزَاتِهِ فَهُوَ لَهُ. وَسُئِلَ مَالِكٌ عَنْ رَجُلٍ أَوْجَبَ عَلَى نَفْسِهِ الْغَزْوَ فَتَجَهَّزَ حَتَّى إِذَا أَرَادَ أَنْ يَخْرُجَ مَنَعَهُ أَبَوَاهُ أَوْ أَحَدُهُمَا فَقَالَ لاَ يُكَابِرْهُمَا وَلَكِنْ يُؤَخِّرُ ذَلِكَ إِلَى عَامٍ آخَرَ فَأَمَّا الْجِهَازُ فَإِنِّي أَرَى أَنْ يَرْفَعَهُ حَتَّى يَخْرُجَ بِهِ فَإِنْ خَشِيَ أَنْ يَفْسُدَ بَاعَهُ وَأَمْسَكَ ثَمَنَهُ حَتَّى يَشْتَرِيَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 972، يرد فيه ذكر ما يجب على المكلف. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 972 (Jihad), whose wording mentions what is binding on the person addressed. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 972، جس کے الفاظ میں جو مکلف پر واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 972, dont le texte mentionne ce qui s'impose à la personne responsable. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 972, cuyo texto menciona lo que obliga a la persona responsable. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
