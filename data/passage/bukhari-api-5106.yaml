label: { ar: "صحيح البخاري 5106 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 5106 — what was made lawful; what is not lawful", ur: "صحیح بخاری 5106 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 5106 — Lo que se ha hecho lícito; lo que no es lícito" }
text: "… قُلْتُ تَنْكِحُ. قَالَ \" أَتُحِبِّينَ \". قُلْتُ لَسْتُ لَكَ بِمُخْلِيَةٍ، وَأَحَبُّ مَنْ شَرِكَنِي فِيكَ أُخْتِي. قَالَ \" إِنَّهَا لاَ تَحِلُّ لِي \". قُلْتُ بَلَغَنِي أَنَّكَ تَخْطُبُ. قَالَ \" ابْنَةَ أُمِّ سَلَمَةَ \". قُلْتُ نَعَمْ. قَالَ \" لَوْ لَمْ تَكُنْ رَبِيبَتِي مَا حَلَّتْ لِي، أَرْضَعَتْنِي وَأَبَاهَا ثُوَيْبَةُ، فَلاَ تَعْرِضْنَ عَلَىَّ بَنَاتِكُنَّ وَلاَ أَخَوَاتِكُنَّ \". وَقَالَ اللَّيْثُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5106، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5106 (Wedlock, Marriage (Nikaah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5106، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5106 (Matrimonio (Nikaah)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
