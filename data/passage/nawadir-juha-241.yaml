label: { ar: "نوادر جحا الكبرى، ص 116 — «الفراش لا يسع أربعة»", en: "Nawadir Juha al-Kubra, p. 116 — 'The Bed Does Not Hold Four'", ur: "نوادر جحا الکبریٰ، ص 116 — «بستر چار کو نہیں سماتا»", fr: "Nawadir Juha al-Kubra, p. 116 — « Le lit ne peut contenir quatre personnes »", es: "Nawadir Juha al-Kubra, p. 116 — «La cama no cabe para cuatro»" }
text: "… الفراشُ لا يسع أربعة تزوِّج الشيخ بعد وفاةِ أمرأته بامرأةٍ ثيِّبٍ، فأخذ في كلِّ حين يذكرُ محاسن زوجته الأولى، ويطنِبُ بها، وأخذتِ المرأةُ تذكر فضائل زوجها السابق. وأخيراً في إحدى اللَّيالي كان الشيخ متمدِّداً على فراشه ليأخذ قِسْطاً من الراحة …"
summary:
  ar: "بعد أن تزوج جحا أرملة ظل يمتدح زوجته الأولى وهي تمتدح زوجها السابق، فرماها من السرير، وجاء أبوها، فقال جحا إنه واحد، وزوجته الراحلة اثنتان، والحالية ثلاثة، وزوجها السابق أربعة، والفراش لا يسع أربعة فسقطت. {cite:juha-nawadir-kubra-djuwaydi p. 116}"
  en: "After marrying a widow, Juha keeps praising his first wife while she praises her earlier husband, and he pushes her off the bed. Her father comes, and Juha says that he is one, his late wife two, the present wife three and her former husband four, and a bed cannot hold four, so she fell off. {cite:juha-nawadir-kubra-djuwaydi p. 116}"
  ur: "ایک بیوہ سے شادی کے بعد جحا اپنی پہلی بیوی کی تعریف کرتا رہتا ہے اور بیوی اپنے سابق شوہر کی، تو وہ اسے بستر سے گرا دیتا ہے۔ اس کا باپ آتا ہے تو جحا کہتا ہے کہ وہ ایک ہے، اس کی مرحومہ بیوی دو، موجودہ بیوی تین، اور اس کا سابق شوہر چار، اور بستر چار کو نہیں سما سکتا، اس لیے وہ گر پڑی۔ {cite:juha-nawadir-kubra-djuwaydi p. 116}"
  fr: "Après avoir épousé une veuve, Juha ne cesse de louer sa première femme tandis qu'elle loue son précédent mari, et il la pousse hors du lit. Son père vient, et Juha dit qu'il est un, sa défunte femme deux, l'épouse actuelle trois et son ancien mari quatre, et qu'un lit ne peut contenir quatre personnes, si bien qu'elle est tombée. {cite:juha-nawadir-kubra-djuwaydi p. 116}"
  es: "Tras casarse con una viuda, Juha sigue elogiando a su primera esposa mientras ella elogia a su anterior marido, y la empuja fuera de la cama. Llega su padre, y Juha dice que él es uno, su difunta esposa dos, la actual tres y su anterior marido cuatro, y que una cama no cabe para cuatro, así que ella se cayó. {cite:juha-nawadir-kubra-djuwaydi p. 116}"
