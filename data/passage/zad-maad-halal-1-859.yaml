text: "… فعله حلالاً، لأنه لا يجوز تقديمُ الكفارة، فيستفيدُ بها الحل، وإقدامه عليه وهو حرامٌ ممتنع، هذا ما قيل في المسألة من الجانبين. وبعدُ، فلها غور، وفيها دِقة وغموض، فإن من حرَّم شيئاً، فهو بمنزلة من حَلَفَ باللَّه على تركه، ولو …"
