text: "المسألة الحكم دعا وهارون أمن علىٰ قراءة الفاتحة كان يجب من الصلاة صلاتان ما كان يجب من الصلاة قبل فرض صلاة قبل طلوع الشمس : وصلاة قبل غروبها الصلوات الخمس الاستعاذة قبل التلاوة هو أمر ندب ليس بواجب وحكىٰ الإجماع …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 5584، يرد فيه ذكر ما فُرض على الناس، والفرض، والواجب، والمندوب، وما ليس بواجب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 5584, whose wording mentions what was made obligatory on people, the obligatory (fard), the obligatory (wajib), the recommended (mandub), what is said not to be obligatory, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 5584 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، واجب، مندوب، جو واجب نہیں، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tafsir de Ibn Kathir, volume numérisé 1, p. 5584, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligatoire (wajib), le recommandé (mandub), ce qui est dit non obligatoire, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tafsir de Ibn Kathir, volumen digitalizado 1, p. 5584, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo obligatorio (wajib), lo recomendado (mandub), lo que se dice que no es obligatorio, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
