unit: hadith
work: work/arbaun-nawawi
ref: "15"
label: { ar: "الأربعون 15 — فليقل خيراً أو ليصمت", en: "Arba'un 15 — speak good or keep silent" }
text: "من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه"
summary:
  ar: "حديث أبي هريرة، وهو الحديث الخامس عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري (6018 و6475 و6136) ومسلم (74–76) من طرق عن أبي هريرة، وفي بعض الألفاظ «فلا يؤذ جاره» وفي بعضها «فليحسن قرى ضيفه» وفي بعضها «فليصل رحمه» بدل ذكر الجار، وخرجاه بمعناه من حديث أبي شريح الخزاعي، وروي عن عائشة وابن مسعود وعبد الله بن عمرو وأبي أيوب الأنصاري وابن عباس؛ يبين ابن رجب أن صيغة «من كان يؤمن بالله واليوم الآخر» تدل على أن هذه الخصال من خصال الإيمان وأن الأعمال تدخل في الإيمان، وأن في الحديث ثلاثة أشياء يؤمر بها المؤمن: قول الخير والصمت عما سواه، وإكرام الجار والكف عن أذاه، وإكرام الضيف؛ فمنها ما يتعلق بحقوق الله كقول الخير والصمت عن غيره، ومنها ما يتعلق بحقوق عباده كإكرام الضيف والجار والكف عن الأذى، وروى الطبراني عن أسود بن أصرم وصية النبي «لا تقل بلسانك إلا معروفاً ولا تبسط يدك إلا إلى خير» وورود استقامة اللسان من خصال الإيمان في المسند (جامع العلوم والحكم ص 314–342)."
  en: "Abu Hurayra's hadith, the fifteenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (6018, 6475, 6136) and Muslim (74–76) through several routes from Abu Hurayra, some wordings running 'let him not harm his neighbour', others 'let him be generous in hosting his guest', others 'let him keep the ties of kin' in place of the neighbour, transmitted in meaning also from Abu Shurayh al-Khuza'i and reported from A'isha, Ibn Masud, Abdullah ibn Amr, Abu Ayyub al-Ansari and Ibn Abbas; Ibn Rajab explains that the formula 'whoever believes in God and the Last Day' shows these traits are of the traits of iman and that deeds enter into iman, that the hadith commands the believer three things — speaking good or keeping silent, honouring the neighbour and withholding harm from him, and honouring the guest — the first belonging to God's rights and the latter two to His servants' rights together with refraining from harm, citing al-Tabarani's report of Aswad ibn Asram's counsel 'do not say with your tongue except what is good and do not extend your hand except to good' and the Musnad's report that the tongue's uprightness is of the traits of iman (Jami' al-Ulum wal-Hikam pp. 314–342)."
