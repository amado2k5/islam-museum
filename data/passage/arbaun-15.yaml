label: { ar: "الأربعون 15 — فليقل خيراً أو ليصمت", en: "Arba'un 15 — speak good or keep silent", es: "Arba'un 15 — habla bien o guarda silencio", fr: "Arba'un 15 — Parlez bien ou taisez-vous", ur: "اربعون 15 - اچھا بولیں یا خاموش رہیں", tr: "Kırkıncı 15 — İyi konuşsun ya da sussun.", id: "Pasal 15 ayat 40 — Biarlah dia berbicara yang baik atau tetap diam" }
text: "من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه"
summary:
  ar: "حديث أبي هريرة، وهو الحديث الخامس عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري ⁦(6018 و6475 و6136)⁩ ومسلم (74–76) من طرق عن أبي هريرة، وفي بعض الألفاظ «فلا يؤذ جاره» وفي بعضها «فليحسن قرى ضيفه» وفي بعضها «فليصل رحمه» بدل ذكر الجار، وخرجاه بمعناه من حديث أبي شريح الخزاعي، وروي عن عائشة وابن مسعود وعبد الله بن عمرو وأبي أيوب الأنصاري وابن عباس؛ يبين ابن رجب أن صيغة «من كان يؤمن بالله واليوم الآخر» تدل على أن هذه الخصال من خصال الإيمان وأن الأعمال تدخل في الإيمان، وأن في الحديث ثلاثة أشياء يؤمر بها المؤمن: قول الخير والصمت عما سواه، وإكرام الجار والكف عن أذاه، وإكرام الضيف؛ فمنها ما يتعلق بحقوق الله كقول الخير والصمت عن غيره، ومنها ما يتعلق بحقوق عباده كإكرام الضيف والجار والكف عن الأذى، وروى الطبراني عن أسود بن أصرم وصية النبي «لا تقل بلسانك إلا معروفاً ولا تبسط يدك إلا إلى خير» وورود استقامة اللسان من خصال الإيمان في المسند ⁦(جامع العلوم والحكم ص 314–342)⁩."
  en: "Abu Hurayra's hadith, the fifteenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (6018, 6475, 6136) and Muslim (74–76) through several routes from Abu Hurayra, some wordings running 'let him not harm his neighbour', others 'let him be generous in hosting his guest', others 'let him keep the ties of kin' in place of the neighbour, transmitted in meaning also from Abu Shurayh al-Khuza'i and reported from A'isha, Ibn Masud, Abdullah ibn Amr, Abu Ayyub al-Ansari and Ibn Abbas; Ibn Rajab explains that the formula 'whoever believes in God and the Last Day' shows these traits are of the traits of iman and that deeds enter into iman, that the hadith commands the believer three things — speaking good or keeping silent, honouring the neighbour and withholding harm from him, and honouring the guest — the first belonging to God's rights and the latter two to His servants' rights together with refraining from harm, citing al-Tabarani's report of Aswad ibn Asram's counsel 'do not say with your tongue except what is good and do not extend your hand except to good' and the Musnad's report that the tongue's uprightness is of the traits of iman (Jami' al-Ulum wal-Hikam pp. 314–342)."
  es: "Hadiz de Abu Hurayra, el decimoquinto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Bujari (6018, 6475, 6136) y Muslim (74-76) a través de varias rutas desde Abu Hurayra, algunas formulaciones dicen 'que no dañe a su vecino', otras 'que sea generoso al hospedar a su huésped', otras 'que mantenga los lazos de parentesco' en lugar del vecino, transmitido en significado también por Abu Shurayh al-Khuza'i y reportado por Aisha, Ibn Masud, Abdullah ibn Amr, Abu Ayyub al-Ansari e Ibn Abbas; Ibn Rajab explica que la fórmula \"quien cree en Dios y en el Último Día\" muestra que estos rasgos son rasgos de iman y que las obras entran en iman, que el hadiz ordena al creyente tres cosas: hablar bien o guardar silencio, honrar al vecino y abstenerse de hacerle daño, y honrar al huésped; la primera pertenece a los derechos de Dios y las dos últimas a los derechos de Sus siervos junto con abstenerse de hacer daño, citando el informe de al-Tabarani del consejo de Aswad ibn Asram \"no digas con tu lengua excepto lo que es bueno y no extiendas tu mano excepto para el bien\" y el informe del Musnad de que la rectitud de la lengua es uno de los rasgos de iman (Jami' al-Ulum wal-Hikam pp. 314–342)."
  fr: "Le hadith d'Abu Hurayra, le quinzième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Bukhari (6018, 6475, 6136) et Muslim (74-76) par plusieurs voies à partir d'Abu Hurayra, certaines formulations allant de « qu'il ne nuise pas à son voisin », d'autres « qu'il soit généreux en accueillant son invité », d'autres encore « qu'il garde les liens de parenté » au lieu du voisin, transmis dans le sens également d'Abu Shurayh al-Khuza'i et rapporté d'A'isha, Ibn Masud, Abdullah ibn Amr, Abu Ayyub al-Ansari et Ibn Abbas; Ibn Rajab explique que la formule « quiconque croit en Dieu et au Jour dernier » montre que ces traits font partie de la foi et que les actes contribuent à la foi. Il ajoute que le hadith ordonne au croyant trois choses: dire du bien ou se taire, honorer son prochain et ne pas lui nuire, et honorer l'invité. La première relève des droits de Dieu, les deux dernières des droits de Ses serviteurs, ainsi que l'abstention de nuire. Il cite le récit d'al-Tabarani concernant le conseil d'Aswad ibn Asram: « Ne dis de ta langue que ce qui est bon et n'étends ta main que pour faire le bien », ainsi que le récit du Musnad selon lequel la droiture de la langue fait partie des traits de la foi (Jami' al-Ulum wal-Hikam, p. 314-342)."
  ur: "ابوہریرہ کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی پندرہویں؛ البخاری ⁦(6018، 6475، 6136)⁩ اور مسلم (74-76) نے ابو ہریرہ سے متعدد راستوں سے نقل کیا ہے، کچھ الفاظ یہ ہیں کہ 'وہ اپنے پڑوسی کو نقصان نہ پہنچائے'، دوسرے 'اسے اپنے مہمان کی میزبانی میں فراخدلی کا مظاہرہ کرنے دیں'، بعض میں ابوہریرہ کی جگہ 'قرابت داروں کے تعلقات قائم رکھنے' کے معنی بھی ابوہریرہ سے نقل کیے گئے ہیں۔ الخزاعی اور عائشہ، ابن مسعود، عبداللہ بن عمرو، ابو ایوب الانصاری اور ابن عباس سے روایت ہے۔ ابن رجب بیان کرتے ہیں کہ 'جو شخص خدا اور یوم آخرت پر ایمان رکھتا ہے' کے فارمولے سے معلوم ہوتا ہے کہ یہ خصلتیں ایمان کی خصلتوں میں سے ہیں اور یہ اعمال ایمان میں داخل ہیں، کہ حدیث مؤمن کو تین چیزوں کا حکم دیتی ہے، اچھی بات کہنے یا خاموش رہنے، پڑوسی کی عزت کرنا اور اس کی تکلیف کو روکنا، اور مہمان کی عزت کرنا، سب سے پہلے بندے کے حقوق میں سے دو حقوق اللہ کے ساتھ ہیں۔ ضرر، الطبرانی کی اسواد بن اسرام کی نصیحت کی روایت کا حوالہ دیتے ہوئے کہ 'اپنی زبان سے اچھی بات نہ کہو اور خیر کے سوا ہاتھ نہ بڑھاؤ' اور مسند کی روایت ہے کہ زبان کا سیدھا ہونا ایمان کی صفات میں سے ہے۔"
  tr: "İbn Receb'in tefsirinde ve Nevevi'nin Kırk Hadis'inde on beşinci hadis olan Ebu Hurayra hadisi; Buhari (6018, 6475 ve 6136) ve Müslim (74-76) tarafından çeşitli rivayet zincirleriyle Ebu Hurayra'dan nakledilmiştir. Bazı rivayetlerde \"komşusuna zarar vermemelidir\", bazılarında \"misafirine iyi davranmalıdır\", bazılarında ise komşudan bahsetmek yerine \"akrabalık bağlarını korumalıdır\" denmektedir. Ayrıca Ebu Şurayh el-Huzai hadisinden de anlamıyla birlikte alınmış olup, Aişe, İbn Mes'ud, Abdullah bin Amr, Ebu Eyyub el-Ensari ve İbn Abbas'tan nakledilmiştir. İbn Receb, “Allah’a ve Ahiret Günü’ne iman eden kimse” ifadesinin, bu özelliklerin imanın nitelikleri arasında olduğunu ve amellerin de imanın bir parçası olduğunu gösterdiğini, hadiste müminin yapması emredilen üç şeyin olduğunu açıklar: İyilik söylemek ve kötülükten sakınmak, komşuya saygı göstermek ve ona zarar vermekten kaçınmak ve misafire saygı göstermek; bunlardan bazıları, iyilik söylemek ve kötülükten sakınmak gibi Allah’ın haklarıyla ilgiliyken, bazıları da misafire ve komşuya saygı göstermek ve zarar vermekten kaçınmak gibi kullarının haklarıyla ilgilidir. Taberani, Esved bin Esram’dan rivayetle Peygamber’in şu tavsiyesini nakletmiştir: “Dilinizle ancak iyilikten söz edin ve elinizi ancak iyiliğe uzatın.” Dilin doğruluğu, Müsned’de (Cami’ el-Ulum ve el-Hikam, s. 314–342) imanın nitelikleri arasında zikredilmiştir."
  id: "Hadits Abu Hurairah, yang merupakan hadits kelima belas dalam Empat Puluh Hadits Nawawi dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Al-Bukhari (6018, 6475 dan 6136) dan Muslim (74-76) melalui berbagai sanad dari Abu Hurairah, dan dalam beberapa versi disebutkan “maka dia tidak boleh menyakiti tetangganya,” dan dalam beberapa versi disebutkan “maka dia harus memperlakukan tamunya dengan baik,” dan dalam beberapa versi disebutkan “maka dia harus menjaga hubungan kekerabatan” alih-alih menyebutkan tetangga, dan mereka memasukkannya dengan maknanya dari hadits Abu Shurayh Al-Khuza’i, dan diriwayatkan dari Aisyah, Ibn Mas’ud, Abdullah bin Amr, Abu Ayyub Al-Ansari dan Ibn Abbas; Ibn Rajab menjelaskan bahwa redaksi “barangsiapa yang beriman kepada Allah dan Hari Kiamat” menunjukkan bahwa sifat-sifat ini termasuk dalam sifat-sifat iman dan bahwa amal perbuatan termasuk dalam iman, dan bahwa dalam hadits terdapat tiga hal yang diperintahkan kepada orang beriman: berbicara yang baik dan diam tentang hal-hal yang buruk, menghormati tetangga dan menahan diri dari menyakitinya, dan menghormati tamu; Sebagian di antaranya berkaitan dengan hak-hak Allah, seperti berbicara yang baik dan diam tentang orang lain, dan sebagian lainnya berkaitan dengan hak-hak hamba-Nya, seperti menghormati tamu dan tetangga serta menahan diri dari menyebabkan kerugian. Al-Tabarani meriwayatkan dari Aswad bin Asram nasihat Nabi: “Janganlah kamu mengucapkan dengan lidahmu kecuali yang baik, dan janganlah kamu mengulurkan tanganmu kecuali kepada kebaikan.” Kesopanan lidah disebutkan di antara sifat-sifat iman dalam Musnad (Jami’ al-‘Ulum wa al-Hikam, hlm. 314–342)."
