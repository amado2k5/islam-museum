text: "… عنك كل مَكروه ومحذورٍ. الذي كنا نسمعُ، وأدركنا عليه مِن أدركنا من أهل العلم: أنهم كانوا يكرهون الكلام، والخوض مع أهل الزَّيغِ، وإنما الأمر في التسليم، والانتهاء إلى مَا في كتابِ اللّٰه ماد، أو سُنَّة رسول اللّٰه لا يَعدُ ذلك. …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 464، يرد فيه ذكر المكروه، وما كان يُكره، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 464, whose wording mentions the disliked (makruh), what used to be disliked, what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، خلال، ص 464 کا اقتباس جس میں مکروہ، جو ناپسند کیا جاتا تھا، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de al-Khallal, p. 464, dont le texte mentionne le réprouvé (makruh), ce qui était réprouvé, ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de al-Khallal, p. 464, cuyo texto menciona lo reprobado (makruh), lo que se reprobaba, lo que los juristas reprobaron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 464. sayfasından bir alıntı, mekruh olan, mekruh olmuş olan, fıkıhçıların mekruh ettiği ve mekruh olmuş olan şeylerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu alıntı, farz olan fiiller, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal, \"Al-Sunnah,\" halaman 464, menyebutkan apa yang tidak disukai, apa yang dulu tidak disukai, apa yang tidak disukai oleh para ahli hukum, dan apa yang dulu tidak disukai. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
