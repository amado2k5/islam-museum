  ar: "سنن النسائي، كتاب صلاة العيدين"
  en: "Sunan al-Nasa'i, Book 19: The Book of the Prayer for the Two 'Eids"
  ur: "سنن نسائی، کتاب صلاۃ العیدین"
  es: "Sunan al-Nasa'i, Libro 19: El Libro de la Oración para los Dos Eids"
  fr: "Sunan al-Nasa'i, Livre 19: Le Livre de la prière pour les deux fêtes de l'Aïd"
summary:
  ar: "القسم 19 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة العيدين»، ويضم فيها النصوص من 1556 إلى 1597 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 19 of Sunan al-Nasa'i (The Book of the Prayer for the Two 'Eids) in the division of the open hadith dataset the museum took its reports from: reports 1556 to 1597 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 19، عنوان «کتاب صلاۃ العیدین»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1556 تا 1597۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 19 de Sunan al-Nasa'i (El Libro de la Oración para los Dos Eids) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1556 al 1597, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de la prière pour les deux fêtes), dans la section 1556 à 1597 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
