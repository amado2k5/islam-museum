text: |-
  • ⁦(باب الواووالياء)⁩
  n⅜nجفاn)n •
  ٤٥٧
  مجراها وهر ساهاهما مصدران من أجريت السفينة وأرسيت ومج راها ومرساها بالفتح من
  جوت السفينة ورست وقول لبيد وغنيت سبتاقبل مجرى داحس• لوكان للنفس اللجوح خاود
  ومجرى داحس كذلك والجرايلجارى من الوظائف والجرووالجرو والجردولد الكاب
  والسباع والمع أجروأصله أجروعلى أفعل وجراء وجمع الجراء أجرية والجرو والجروة
  الصغير من القثاء وفى الحديث أتى النبى صلى اللّٰه عليه وسلم بأبرزغب وكذلن جرو.
  الحنظل والرمّان وينوجروة بطن من العرب وكان ربيعة بن عبد الهزى بن عبد شمس بن عبد
  مناف يقال له جر والبطماء وألتى فلان جروته اذا صبر على الامر وقواه-م ضرب عليه
  جروته أى وطن عليه نفسه وكلبة مجر ومجرية أى معها براؤهبا قال الهميح الاسدى
  أما اذا حردت حردى فجرية • ضبطاء تسكن غيلا غير مقروب
  وجارية ينة الجراية بالفتح والجراء والجراء قال الاعشى
  والبيض قد عنت وطال جراؤها • ونشأن فى قن وفى أذواد
  يروى بفتح الجيم وكسرها وقواهم كان ذلك فى أيام جرائها بالفتح أى صباها والجارية الشمس
  والجارية السفينة وجاراه مجاراة وجراه أى جرى معه وجاراه فى الحديث وتجاروافيه
  والجرى الوكسل والرسول يقال برى بين الجراية والجراية وابهع أجرياه وأما الجرى.
  المقدام فهومن باب الهسمز وقد جريت جريا واستجريت وفى الهديث قولواية ولكم
  ولا يستجر ينكم الشسيطان وسمى الوكيل جريالاند يجرى مجرى موكله وقواهسم فعلت ذاك
  من جراكومن جراتك أى من أحلك لغة فى حرّال بالتشديد ولا تقل مجراكْ والجريه ممل
  لقرّية هى الحوصلة والاجريا بالكسر الجرى والعادة عما تأخذفيه قال الكميت
  وولى باجر باود ف كأنه • على الشرف الاقصى بساط ويكلب
  وقال أيضا على تاذاجرباى وهى ضريبق • ولوأجلبوامترا على وأحلبوا
  ⁦( جزى)⁩ جزيته بماصنع بزاء وجازيته بمعن وبقسال جازيته فجزيته أى غلبته وجزى عن
  هذا الامر أى قضى ومنه قوله تعالى لا تجزى نفس عن نفس شيأ ويقال جزت عنك شاة وفى
  حديث أبى بردة بن نيسار تجزى عنك ولا تجزى عن أحد بعدل أى تقضى وبنوغيم ية ولون
  أبزأت عنك شاة بالهمز وتجازيت ديق على فلان اذا تقاضيته والتجازى المتقاضى وهذا
  رجل جازيك من رجل أى حسبك والجزية ما يؤخذه ن أهل الذمّة والمع الجزى مثل لحمية
  ولحى ( سا جاضداطف وجست البدوغيرها بسوا وجساييت وجسا النفخ
  جسوابلغ غاية الن والمايحد عا جعاجعواجع البعروغيره كثبة فا)
  لجفاء عدود خلاف البر وق-دجفوت الرجل أحفوه حفاءفهومحة وولا تقل حفيت وأما
  قول الراجزه فلست بالجافى ولا الجقى • فانمابناه على جفى فلما انقلبت الواوياء فيمالم يسم
  فاعله بنى المفعول عليه وفلان ظاهر الجفوة بالحكسر أى ظاهر الجفاء وجفا السرج
  عن ظهر القرس وأجفيته أنا اذا رفعته عنه قال الراجز
  تد بالاعناق أوتلويها • وتشتكى لوأنناتشكيها • مس حواياقلانجفيها
  أى قلما ترفع الجوية عن ظهرها وجاقاه عنه فتجافى جنبه عن الغراش أى نسا واستيفاه
  ١١٥
  بى
  مصاح
