label:
  ar: "الترمذي 446 — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Tirmidhi 446 — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "ترمذی 446 — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
text: "ينزل الله إلى السماء الدنيا كل ليلة حين يمضي ثلث الليل الأول فيقول أنا الملك من ذا الذي يدعوني فأستجيب له من ذا الذي يسألني فأعطيه من ذا الذي يستغفرني فأغفر له فلا يزال كذلك حتى يضيء الفجر . قال …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 446: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 446: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 446: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
