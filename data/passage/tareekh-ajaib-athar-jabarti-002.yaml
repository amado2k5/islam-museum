text: "ولو اتانى منه جواب لا طلعتك عليه ولا يصح انى اكتمه عنك او ارد له جوابا. فعند ذلك اخرج له الجواب من جيبه واحضر اليه ذلك الرسول، فسقط فى يده واخذ يتنصل ببارد العذر، فعند ذلك إصار يتعذر له أقال"
