text: "… شعب الإيمان. ومحمَّد بن الوزير: أخرجه الخطيب البغدادي في الفقيه والمتفقه ص. جميعهم -وعددهم عشرة- عن الوليد بن مسلم، قال: حدَّثنا مروان بن جَناح، عن يونسَ بنِ مَيْسرةً بنِ حَلْبَس؛ أَنَّهُ حِدَّثه.. وذكره. وإسناده ضعيف جدًّا؛ رَوْح بن جَناح: ضعيف، …"
