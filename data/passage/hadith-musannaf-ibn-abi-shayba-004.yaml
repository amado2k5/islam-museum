text: "لي : اتركوه ما ترككم، وأما قيصر فقرأ كتاب رسول الله ل فقال: هذا كتاب لم أسمع به بعد سليمان النبي (بسم الله الرحمن الرحيم)) ثم أرسل إلى أبي سفيان والمغيرة بن شعبة كانا تاجرين بأرضه، فسألهما عن بعض شأن"
