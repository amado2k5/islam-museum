text: |-
  ⁦(فصل الفين)⁩.
  ٢٧٩
  يقول سقيناهم خيلا مغيرة ونصب تميم بن مرّعلى أنه بدلى من غارة والغارة الاسم من الاغارة
  على العدوّ وحبل شديد الغارة أى سديد الفتل عن الاصمعىّ وغاريغورغورا أى أتى الغور
  نهوغائرقال ولا يقنال أغار وغار الماءغورا وغؤورا أى سفل فى الارض وغارت عمنه تغور
  غورا وغؤورادخلت فى الرأس وغارت تغارافة فيه وقال ابن أحر.
  أغارت عينه أم لم تغاروغارت الشمس تغور غيارا أى غربت قال أبوذؤيب
  هل الدهر الاليسلة ونهارها • والاطلوع الشمس ثم غيارها
  أبو عبيدعار النها رأى اشتدحرّه وغاره بخير يغوره ويغيره أى نفعه يقال اللهسمّ غرنا
  منك بغيت أى أغثنابه وأغار على العدوّ يغيراغارة ومغاراوكذلكْ غاورهم مغاورة ورجل
  مغوارومغاورأى مقاتل وقوم مغاوير وخيل- غيرة ومغيرة اسم رحل وقد تكسر الميم
  كما يقال منتن ومنتن والمغيرية صنف من السيائية نسبوا الى مغيرة بن سعده ولى بجيلة
  وأغرت الحبل أى فتلته فهو مغار وأغارفلان أهله أى تزوج عليها حكاه أبو عبيد عن الاصمعى
  وأغار أى شد العدو وأسرع وكانواية ولون أشرق ثبير كيما نغيرأى نسرع للنهرومنه قولهم
  أغاراغارة المعلب اذا أسرع ودفع فى عدوه وقال بشربن أبى خازم
  فعتطلابها وتعد عنها • بحرف قدتغير اذا تبوع
  واختلفوا فى قول الاعشى
  ني يرى مالايرون وذكره * أغاراهمرى فى البلاد وأنجدا
  قال الأصمعى أغار بمعى أسرع وأنجد أى ارتفع ولم يردأتى الغور ولا نجداوليس عنده فى
  تيان الغور إلاغار وزعم الفترّاء أنهالغة واحتج بهذا البيت وناس يولون أغاروأنجدفاذا
  آفردوا فالواغار كمافالوا هنانى الطعام ومرانى فاذا أفردوا قالوا أمرانى والتغوبراتيان
  الغور يقال غوّرنا وغرنابمعنى والتغوير القيلولة يقال غوّروا أى انزلو اللقائلة قال أبوعيدا
  يقال للقائلة الغائرة واستغار أى سمن ودخل فيه الشحم وربما قالوا استغارت القرحة اذا
  تورّمت وتغاور القوم أغار بعضه-م على بعض ( ير . الغيرة بالكسر الميرة وقد غارأ هله
  يغيرهم غيارا أى عيرهم ويتفعهم قال الباهلى
  ونهدية شمطاء أوحارثية * تؤمل نهبا من بنيها يغيرها
  أى يأتيها بالغنيمة فقدق تلوا قال أبو عبيدة يقال غارنى الرجل يغيرنى ويغورنى اذا ود اكمن
  الدية والاسم الغيرة أيضا بالكسر وجعه اغير قال الشاعر
  انجد عنّ بأيدينا أنوفكم * بى أمية ان لم تقبلوا الغيرا
  وقال بعضهم انه واحد وجعه أغيار والغير أيضا الاسم من قولك غيرت الشئء فتغير والغيرة
  بالفتح مصدرة ولك غار الرحسل على أهله بغار غيرا وغيرة وغاراورجل غيور وغيران وجمع
  غيور غير وجمع غيران غبارى وغيارى ورجل مغياروقوم-غايير وامرأة غيورونسوة غسير
  وامرأة غيرى ونسوة غيارى وغاره يغيره ويغوره أى نفعه قال عبد الرجن بن ربع الهذلى
  ماذا بغيرابنى ربع عوبلهما ) لا ترقدان ولا يؤسى لمن رقدا
  يقول لا يغنى بكاؤهما على أبيهما من طلب ثاره شيئا وغارهم اللّٰه بطر يغيرهم ويغورهم أى
