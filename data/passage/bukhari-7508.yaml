label:
  ar: "البخاري 7508 — الرجل الذي أوصى بنيه أن يحرقوه خشية من الله"
  en: "Bukhari 7508 — The man who told his sons to burn his body for fear of God"
  ur: "بخاری 7508 — وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی"
text: "أنه ذكر رجلا فيمن سلف أو فيمن كان قبلكم قال كلمة يعني أعطاه الله مالا وولدا فلما حضرت الوفاة قال لبنيه أى أب كنت لكم قالوا خير أب. قال فإنه لم يبتئر أو لم يبتئز عند الله خيرا، وإن يقدر …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7508: الرجل الذي أوصى بنيه أن يحرقوه خشية من الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7508: The man who told his sons to burn his body for fear of God. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7508: وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
