text: "وَحَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا عَبْدُ الأَعْلَى، حَدَّثَنَا هِشَامٌ، عَنْ مُحَمَّدٍ، عَنْ أَنَسِ، بْنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ رَمَى جَمْرَةَ الْعَقَبَةِ ثُمَّ انْصَرَفَ إِلَى الْبُدْنِ فَنَحَرَهَا وَالْحَجَّامُ جَالِسٌ وَقَالَ بِيَدِهِ عَنْ رَأْسِهِ فَحَلَقَ شِقَّهُ الأَيْمَنَ فَقَسَمَهُ فِيمَنْ يَلِيهِ ثُمَّ قَالَ \" احْلِقِ الشِّقَّ الآخَرَ \". فَقَالَ \" أَيْنَ أَبُو طَلْحَةَ \". فَأَعْطَاهُ إِيَّاهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3154، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 3154 (The Book of Pilgrimage), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 3154، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
