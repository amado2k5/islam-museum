label: { ar: "سنن ابن ماجه 1939 — ما أُحل، ما لا يحل", en: "Sunan Ibn Majah 1939 — what was made lawful; what is not lawful", ur: "سنن ابن ماجہ 1939 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Ibn Majah 1939 — lo que se ha hecho lícito; lo que no lo es", fr: "Sunan Ibn Majah 1939 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "… رَسُولَ اللَّهِ فَلَسْتُ لَكَ بِمُخْلِيَةٍ وَأَحَقُّ مَنْ شَرِكَنِي فِي خَيْرٍ أُخْتِي. قَالَ رَسُولُ اللَّهِ ـ \" فَإِنَّ ذَلِكَ لاَ يَحِلُّ لِي \". قَالَتْ فَإِنَّا نَتَحَدَّثُ أَنَّكَ تُرِيدُ أَنْ تَنْكِحَ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. فَقَالَ \" بِنْتَ أُمِّ سَلَمَةَ \". قَالَتْ نَعَمْ. قَالَ رَسُولُ اللَّهِ ـ \" فَإِنَّهَا لَوْ لَمْ تَكُنْ رَبِيبَتِي فِي حِجْرِي مَا حَلَّتْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1939، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 1939 (The Chapters on Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1939، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1939 (Los capítulos sobre el matrimonio), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 1939 (Les chapitres sur le mariage), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
