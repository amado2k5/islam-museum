text: "… عاد الأولى.. والله أعلم بالصواب. وهكذ رواه مسلم عن هارون بن معروف، وأخرجه البخارى وأبو داود من حديث ابن وهب. وقدمنا حج هود عند ذكر حج نوح. وروى عن أمير المؤمنين على بن أبى طالب أنه ذكر صفة قبر هود …"
summary:
