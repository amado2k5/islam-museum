label:
  ar: "البخاري 4684 — أنفق أنفق عليك"
  en: "Bukhari 4684 — Spend, and I shall spend on you"
  ur: "بخاری 4684 — خرچ کرو، میں تم پر خرچ کروں گا"
  es: "Bujari 4684 — Gasta, y yo gastaré en ti."
  fr: "Bukhari 4684 — Dépensez, et je dépenserai pour vous"
  tr: "Buhari 4684 — Harcayın, size rızık verilecektir."
  id: "Bukhari 4684 — Berinfaklah, maka kamu akan diberi rezeki."
text: "قال الله عز وجل أنفق أنفق عليك وقال يد الله ملأى لا تغيضها نفقة، سحاء الليل والنهار وقال أرأيتم ما أنفق منذ خلق السماء والأرض فإنه لم يغض ما في يده، وكان عرشه على الماء، وبيده الميزان يخفض ويرفع . …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4684: أنفق أنفق عليك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4684: Spend, and I shall spend on you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4684: خرچ کرو، میں تم پر خرچ کروں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 4684: Gasta, y yo gastaré en ti. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih al-Bukhari, n° 4684: « Dépensez, et je dépenserai pour vous. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 4684 numaralı hadis-i kudsi şöyledir: \"Harca, ben de sana harcayacağım.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi derleyicisi, bu hadisin rivayetlerini altı şeriat hadis külliyatında ve el-Muvatta'da toplamıştır."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 4684: \"Berinfakkanlah, maka Aku akan berinfakkan kepadamu.\" Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
