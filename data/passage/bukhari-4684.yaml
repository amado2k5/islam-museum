label:
  ar: "البخاري 4684 — أنفق أنفق عليك"
  en: "Bukhari 4684 — Spend, and I shall spend on you"
  ur: "بخاری 4684 — خرچ کرو، میں تم پر خرچ کروں گا"
text: "قال الله عز وجل أنفق أنفق عليك وقال يد الله ملأى لا تغيضها نفقة، سحاء الليل والنهار وقال أرأيتم ما أنفق منذ خلق السماء والأرض فإنه لم يغض ما في يده، وكان عرشه على الماء، وبيده الميزان يخفض ويرفع . …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4684: أنفق أنفق عليك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4684: Spend, and I shall spend on you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4684: خرچ کرو، میں تم پر خرچ کروں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
