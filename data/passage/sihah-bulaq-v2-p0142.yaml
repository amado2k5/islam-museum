text: |-
  *⁦(نا)⁩.
  ٤٤٥
  وجئتك بملاءة أى ملاءة وأية ملاءة كل جائز قال اللّٰه تعالى وما تدرى نفس بأى
  أرض تموت وأى قد يتهجب بها قال جيل
  بثين الزمى لا ان لا ان لزمته • على كثرة الواشين أى معون
  قال الفراء أى يعمل فيه مابعده ولا يعمل فيه ما قبله كقوله تعالى لنعلم أى الحز بين أحصى
  فرفع وقال وسيعلم الذين ظلوا أىّ منقلب ينقلبون فتصبه بما بعده وأما قول الشاءر
  صبح بناحنيفة اذراً
  أتنا • وأىّ الارض هب للصباح
  فاغانصبه لنزع الخافض يريدالى أى الارض قال الكسائى تقول لاضر إن أيهم فى الدارولا
  جوز أن تقول ضربت أيهم فى الدارة فرق بين الواقع والمتوقع المنتظر واذا ناديت اسمافه
  الالف واللام أدخلت بينه وبين حرف النسداء أيم اقتقول يا أيها الرجل ويا أيتها المرأة فاى
  اسم مبهم مفرد معرفة بالنداء مبنى على الضم وهاحرف تنبيه وهى عوض مماكانت أى
  نضاف اليه وترفع الرجل لانه صفة أىّ وقد تحكى بأىّ النكرات ما يعل ومالا بعة ل
  ويستفهم بها واذا استفهمت بها عن نكرة أعر بتها باعراب الاسم الذى هواستثبات عنه
  فاذا قيل لك مرّبى رجل قلت أى يا فتى ته ربها فى الوصل وتشير الى الاعراب فى الوقف ذان قال
  رأيت رجلاقات أياياقتى نعرب وتنوّن اذا وصات وتقف على الالف فتقول أيا واذا قال
  مررت برجل قلت أى يافتى تحسكى كلامه فى الرفع والنسب والجرّف حال الوصل والوقف
  وتقول فى التننية والجمع والتأنيث كما قلناه فى من اذا قال جانى رجال قلت أيون ساكنة النون
  وأيين فى النصب والجروأية للمؤنت فأن وصلت قلت أية باهذا وأيات ياهذا تونت فان كان
  الاستئبات عن معرفة رفعت أ بالاغير على كل حال ولا تحكى فى المعرفة فليس فى أىّ مع المعرفة
  الا الرفع وقد تدخل على أى الكاف فينقل الى تكثير العسدد بمعنى كم فى الخبر ويكتب تنوينه
  نونا وفيه لغتان كاثن منال كاعن وكاين مثال كعسين تقول كاين رجلالقيت تنصب ما بعد
  كاين على التمييز وتقول أيضا كاين من رجل لقيت وادخال من بعدكا ين أكثر من النصب
  بها وأجودوتة ول بكأين تبيع هذا الثوب أى بكم تبيع قال ذوالرمة
  وكائن ذعرنامن مهاة ورائح *بلاد العد اليست له ببلاد
  وأيا من حروف النداء بنادى بم االقريب والبعيد تقول أيازيد أقبل وأى مثال كى وف
  بنادى بد القريب دون البعيد تقول أى زيد أقبل وهى أيضا كلة تتقدّم التفسير تقول
  أى كذا بمعنى تريدكذا كما أن اى بالكسر كلة تتقدم القسم معناها بلى تقول اى وربى
  واى واللّه وأياة الشمس ضوؤها واياها بكسر الهمزة وقصر الالف وأياؤها بنتح الهمزة والمد
  صل البا ٦ الاصمعىّ البأ والكبر والفخر بقال بأوت على القوم أبأى
  بأوا قال حاتم
  ومازادنابأ واعلى ذى قرابة * غنانا ولا أزرى باحسابنا الفقر
  وكذلات البأواء (بتا تابالم-كان بتوا أقام به وبتأبتوأافصح (بنا البناء الارض
  السهلة ويقال بل هى ارض بعينها من بلادبنى سليم قال أبو ذؤيب يصف عيراتحملت
  رفعت لها طر فى وقد حال دونما • رجال وخيل بالبشاء تغير
