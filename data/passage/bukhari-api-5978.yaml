text: "حَدَّثَنَا الْحُمَيْدِيُّ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، أَخْبَرَنِي أَبِي، أَخْبَرَتْنِي أَسْمَاءُ ابْنَةُ أَبِي بَكْرٍ ـ رضى الله عنهما ـ قَالَتْ أَتَتْنِي أُمِّي رَاغِبَةً فِي عَهْدِ النَّبِيِّ صلى الله عليه وسلم فَسَأَلْتُ النَّبِيَّ صلى الله عليه وسلم آصِلُهَا قَالَ ‏\"‏ نَعَمْ ‏\"‏‏.‏ قَالَ ابْنُ عُيَيْنَةَ فَأَنْزَلَ اللَّهُ تَعَالَى فِيهَا ‏{‏لاَ يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ لَمْ يُقَاتِلُوكُمْ فِي الدِّينِ‏}‏"
summary:
  ar: "عن أسماء بنت أبي بكر: قدمت عليها أمها وهي مشركة فسألت النبي أأصلها، فقال نعم."
  en: "From Asma bint Abi Bakr: her mother came to her while still a polytheist, and the Prophet told her to keep the tie — yes."
  ur: "اسماء بنت ابی بکر سے: اس کی ماں مشرک حالت میں آئیں اور نبی نے کہا — ہاں، اس سے تعلق رکھو۔"
  es: "De Asma bint Abi Bakr: su madre vino a verla cuando aún era politeísta, y el Profeta le dijo que mantuviera el vínculo, sí."
  fr: "D'après Asma bint Abi Bakr: sa mère est venue la voir alors qu'elle était encore polythéiste, et le Prophète lui a dit de garder le lien – oui."
  tr: "Esma bint Ebu Bekr'in rivayetine göre: Annesi, o müşrik iken yanına geldi. Bunun üzerine Esma, Peygamberimize, \"Onunla bağımı sürdürmeli miyim?\" diye sordu. Peygamberimiz, \"Evet\" dedi."
  id: "Diriwayatkan dari Asma binti Abi Bakr: Ibunya datang kepadanya ketika ia masih seorang musyrik, lalu ia bertanya kepada Nabi, “Haruskah aku tetap berhubungan dengannya?” Beliau menjawab, “Ya.”"
