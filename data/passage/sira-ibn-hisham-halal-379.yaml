text: "… قَيْظِيٍّ، وكان رجلاً منافقاً ضَرِيرَ البصر، فلما سَمِعَ حِسَّ رسول اللّٰه ا فيم وَمَنْ معه من المسلمين قام يَحْثِي في وجوههم التراب، ويقول: إن كُنْتَ رسول الله، فإني لا أحلُ لك أن تَدْخُلَ حائِطِي، وقد ذُكِرَ لي أنه أخَذَ حَفْنَةً …"
