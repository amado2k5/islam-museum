text: "… المحدث ناب في الحسبة عن الصدر البكري، وقرأ الكثير بنفسه، وسمع وأسمع، وكتب بخطه كثيراً. أبو عبد اللّٰه الفاسي شارح الشاطبية اشتهر بالكنية، وقيل إن اسمه القاسم، مات بحلب، وكان عالماً فاضلاً في العربية والقراءات وغير ذلك، وقد أجاد في …"
summary:
