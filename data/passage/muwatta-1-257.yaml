label: { ar: "الموطأ 257 — ابن بحينة: قام في اثنتين من الظهر ولم يجلس فسجد سجدتين", en: "Muwatta 257", es: "Muwatta 257", fr: "Muwatta 257", ur: "موطا 257", tr: "Al-Muwatta 257 — İbn Buhayna: Öğle namazının ikinci rekatı sırasında ayağa kalktı ve oturmadı, böylece iki secde yaptı.", id: "Al-Muwatta 257 — Ibnu Buhayna: Dia berdiri pada rakaat kedua salat Zuhur dan tidak duduk, sehingga dia melakukan dua sujud." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عبد الرحمن بن هرمز الأعرج عن عبد الله بن بحينة، في باب من قام بعد الإتمام أو في الركعتين: صلى بهم النبي الظهر فقام في الركعتين ولم يجلس فيهما، فلما قضى صلاته سجد سجدتين ثم سلم بعد ذلك. ويخرّجه المحقق عند البخاري (1225) والطحاوي والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (23/226). {cite:muwatta-maruf-1997 p.152}"
  tr: "Malik, Yahya ibn Sa'id'den, o da 'Abd al-Rahman ibn Hurmuz al-A'raj'dan, o da 'Abdullah ibn Buhayna'dan rivayetle, namazı tamamladıktan sonra veya ilk iki rekat sırasında ayakta duran kişi bölümünde şöyle nakletmiştir: Peygamberimiz onlara öğle namazını kıldırdı ve ilk iki rekat boyunca oturmadan ayakta durdu. Namazını bitirdiğinde iki secde yaptı ve sonra selam verdi. Editör, bu rivayeti Buhari (1225), Tahavi, Şafiî ve Beyhaki üzerine yazdığı eserine, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiş ve Temhid'e (23/226) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.152}"
  id: "Diriwayatkan oleh Malik dari Yahya ibn Sa'id, dari 'Abd al-Rahman ibn Hurmuz al-A'raj, dari 'Abdullah ibn Buhayna, dalam surah tentang orang yang berdiri setelah menyelesaikan salat atau selama dua rakaat pertama: Nabi memimpin mereka dalam salat Zuhur dan berdiri selama dua rakaat pertama tanpa duduk. Setelah selesai salat, beliau melakukan dua sujud dan kemudian memberi salam. Editor memasukkannya dalam karyanya tentang al-Bukhari (1225), al-Tahawi, al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (23/226). {cite:muwatta-maruf-1997 p.152}"
