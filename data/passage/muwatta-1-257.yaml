label: { ar: "الموطأ 257 — ابن بحينة: قام في اثنتين من الظهر ولم يجلس فسجد سجدتين", en: "Muwatta 257" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عبد الرحمن بن هرمز الأعرج عن عبد الله بن بحينة، في باب من قام بعد الإتمام أو في الركعتين: صلى بهم النبي الظهر فقام في الركعتين ولم يجلس فيهما، فلما قضى صلاته سجد سجدتين ثم سلم بعد ذلك. ويخرّجه المحقق عند البخاري (1225) والطحاوي والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (23/226). {cite:muwatta-maruf-1997 p.152}"
