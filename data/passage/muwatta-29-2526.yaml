label: { ar: "الموطأ 2526 — هشام بن عروة عن أبيه: لا عقل على العاقلة في قتل العمد", en: "Muwatta 2526", es: "Muwatta 2526", fr: "Muwatta 2526", ur: "موطا 2526", tr: "El-Muvatta 2526 — Hişam ibn Urve, babasının rivayetine göre: Kasıtlı öldürme durumlarında kabileden kan parası alınması gerekmez.", id: "Al-Muwatta 2526 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Tidak ada uang darah yang harus dibayarkan oleh klan dalam kasus pembunuhan yang disengaja." }
summary:
  ar: "يروي يحيى عن مالك عن هشام بن عروة عن أبيه أنه كان يقول: ليس على العاقلة عقل في قتل العمد، إنما عليهم عقل قتل الخطأ. {cite:muwatta-maruf-1997 p.435}"
  tr: "Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayetle, şöyle buyurduğunu aktarır: Kabile, kasten öldürme durumlarında kan parası ödemekle yükümlü değildir; ancak kasıtsız öldürme durumlarında kan parası ödemekle yükümlüdürler. {cite:muwatta-maruf-1997 s.435}"
  id: "Yahya meriwayatkan dari Malik, dari Hisham ibn Urwah, dari ayahnya, bahwa ia biasa berkata: Klan tidak wajib membayar uang darah dalam kasus pembunuhan yang disengaja; mereka hanya wajib membayar uang darah dalam kasus pembunuhan yang tidak disengaja. {cite:muwatta-maruf-1997 p.435}"
