label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٤، المقطع ١ من ٧", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 4, section 1 of 7", ur: "تثبیت دلائل نبوت — حصہ اول، باب 4، حصہ 1", es: "Tathbit Dala'il al-Nubuwwa — Primera parte, capítulo 4, sección 1 de 7", fr: "Tathbit Dala'il al-Nubuwwa — Première partie, chapitre 4, section 1 sur 7", tr: "Peygamberliğin Alametlerinin Belirlenmesi — Birinci Kısım, 4. Bölüm, 1. Kısım (7 bölümden)", id: "Menetapkan Tanda-Tanda Kenabian — Bagian Pertama, Bab 4, Bagian 1 dari 7" }
text: "عاهدوا، وألزمهم الكلف والمؤن، فأجابوه بهذه الشرائط، فكان مجيئه على الوجوه التي قدمنا ذكرها من آياته ودلائل نبوته صلى الله عليه، ولم نجعل طاعة أصحابه له وتصديق القوم له ومصيره في عساكر وجماعات من دلائل نبوته إلا لأنه …"
summary:
  ar: "مقطع من الباب ٤ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 4 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 4 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
  es: "Un fragmento del capítulo 4 de la primera parte de Tathbit Dala'il al-Nubuwwa, de Qadi Abd al-Jabbar al-Hamdani, presenta pruebas de la misión y los milagros del Profeta extraídas del Corán y de relatos transmitidos, respondiendo a quienes niegan la profecía o la despojan de sus milagros. El extracto citado proviene de la edición de Wikisource."
  fr: "Extrait du chapitre 4 de la première partie du Tathbit Dala'il al-Nubuwwa du cadi Abd al-Jabbar al-Hamdani; l'auteur mu'tazilite rassemble des preuves de la mission et des miracles du Prophète tirées du Coran et des hadiths, répondant ainsi à ceux qui nient la prophétie ou la privent de ses miracles. Cet extrait est tiré de l'édition Wikisource."
  tr: "Mu'tezile mezhebinin önde gelen isimlerinden Hakim Abdülceber el-Hamdani'nin \"Peygamberliğin Delillerini Ortaya Koymak\" adlı eserinin ilk cildinin 4. bölümünden bir alıntı; yazar, Kur'an ve rivayet edilen hadislerden yola çıkarak Peygamberin mesajının ve mucizelerinin doğruluğuna dair deliller topluyor ve peygamberliği inkar edenleri veya mucizelerini reddedenleri çürütüyor. Alıntı, Wikisource'da bulunan kitabın baskısından alınmıştır."
  id: "Cuplikan dari Bab 4 jilid pertama \"Membangun Bukti-Bukti Kenabian\" karya Hakim Abd al-Jabbar al-Hamdani; penulis—tokoh terkemuka mazhab Mu'tazila—mengumpulkan bukti-bukti kebenaran pesan Nabi dan mukjizatnya, dengan mengutip Al-Quran dan hadits-hadits yang diriwayatkan, serta membantah mereka yang mengingkari kenabian atau menolak mukjizatnya. Cuplikan ini diambil dari edisi buku yang tersedia di Wikisource."
