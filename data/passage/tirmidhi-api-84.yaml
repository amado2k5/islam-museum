label: { ar: "جامع الترمذي 84 — الأب والأبوة", en: "Jami' al-Tirmidhi 84 — the father and fatherhood", ur: "جامع ترمذی 84 — باپ اور والدیت", es: "Jami' al-Tirmidhi 84 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 84 — le père et la paternité" }
text: "… عُرْوَةَ، عَنْ بُسْرَةَ، عَنِ النَّبِيِّ. حَدَّثَنَا بِذَلِكَ، عَلِيُّ بْنُ حُجْرٍ قَالَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ عُرْوَةَ، عَنْ بُسْرَةَ، عَنِ النَّبِيِّ نَحْوَهُ. وَهُوَ قَوْلُ غَيْرِ وَاحِدٍ مِنْ أَصْحَابِ النَّبِيِّ وَالتَّابِعِينَ وَبِهِ يَقُولُ الأَوْزَاعِيُّ وَالشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ. قَالَ مُحَمَّدٌ وَأَصَحُّ شَيْءٍ فِي هَذَا الْبَابِ حَدِيثُ بُسْرَةَ. وَقَالَ أَبُو زُرْعَةَ حَدِيثُ أُمِّ حَبِيبَةَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 84، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 84 (The Book on Purification), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 84، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 84 (El Libro de la Purificación), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 84 (Le Livre de la Purification), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
