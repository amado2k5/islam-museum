text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ أَيُّوبَ، عَنْ حَفْصَةَ، عَنْ أُمِّ عَطِيَّةَ، قَالَتْ إِنَّ رَسُولَ اللَّهِ نَهَانَا عَنِ النِّيَاحَةِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3127، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3127 (Funerals (Kitab Al-Jana'iz)), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 3127، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Abi Dawud, n° 3127, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Abi Dawud, n.º 3127, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sünen Ebu Davud'da yer alan 3127 numaralı hadis, ölüler için ağlamayı ve bunun sınırlarını ele almaktadır. Bu derleme, ağıt ve yasla ilgili en meşhur sözleri, Kur'an'dan, Sünnet'ten, Peygamberimizin hayatından, Sahabeler ve haleflerinden rivayetlerden ve diğer ilgili kitaplardan alıntılarla bir araya getirmektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3127, membahas tentang menangis atau meratap atas orang yang meninggal dan batasannya. Kitab ini mengumpulkan ucapan-ucapan paling terkenal tentang elegi dan ratapan, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, riwayat dari para Sahabat dan Penerus mereka, serta kitab-kitab lain yang relevan."
