text: "… عمرو على إحدى امرأتي أبي سفيان، فقامت دونه، وقبل أبو فكنت معهم، فإذا أبو سفيان في مشيخةٍ من قريش، سفيان الهدية، وأهدى إليه أدماً. فجعلوا إذا مال المسلمون يقولون: أيَّده ببني الأصفر، وإذا مالت الروم قالوا : يا ويح بني …"
