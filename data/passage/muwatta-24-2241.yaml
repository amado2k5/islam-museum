label: { ar: "الموطأ 2241 — مالك: الأمر المجتمع عليه عندنا في العبد يعتق سيده منه شقصا، ثلثه أو ربعه أو نصفه أو سهما من الأسهم بعد موته، أنه لا يعتق منه إلا ما أعتق سيده وسمى من ذلك الشقص، لأن عتاقة ذلك الشقص إنما وجبت بعد وفاة الميت", en: "Muwatta 2241", es: "Muwatta 2241", fr: "Muwatta 2241", ur: "موطا 2241", tr: "El-Muvatta 2241 — Malik: Bizim aramızdaki ittifak şudur ki, bir kölenin efendisi, ölümünden sonra kölesinin bir kısmını, ister üçte birini, ister dörtte birini, ister yarısını, isterse bir payını azat ederse, yalnızca efendisinin azat ettiği ve adını belirttiği kısım azat edilmiş sayılır; çünkü bu kısmın azat edilmesi ancak ölen kişinin ölümünden sonra farz olur.", id: "Al-Muwatta 2241 — Malik: Konsensus di antara kami adalah bahwa jika seorang tuan budak membebaskan sebagian dari budaknya, baik sepertiga, seperempat, setengah, atau sebagian lainnya, setelah kematiannya, maka hanya bagian yang dibebaskan dan disebutkan oleh tuannya itulah yang dibebaskan, karena pembebasan bagian itu baru menjadi wajib setelah kematian orang yang meninggal." }
summary:
  ar: "قال مالك: والأمر المجتمع عليه عندنا في العبد يعتق سيده منه شقصا، ثلثه أو ربعه أو نصفه أو سهما من الأسهم، بعد موته: أنه لا يعتق منه إلا ما أعتق سيده وسمى من ذلك الشقص. وذلك أن عتاقة ذلك الشقص إنما وجبت وكانت بعد وفاة الميت، وأن سيده كان مخيرا في ذلك ما عاش، فلما وقع العتق للعبد على سيده الموصي، لم يكن للموصي إلا ما أخذ من ماله، ولم يعتق ما بقي من العبد، لأن ماله قد صار لغيره. إلا أن يوصي بأن يعتق ما بقي منه في ماله، فإن ذلك لازم لشركائه وورثته. {cite:muwatta-maruf-1997 p.323} {cite:muwatta-maruf-1997 p.324}"
  tr: "Malik şöyle dedi: Efendisinin ölümünden sonra kölesinin bir kısmını -üçte birini, dörtte birini, yarısını veya bir payını- azat etmesi durumunda, aramızdaki yerleşik uygulama, yalnızca efendinin azat ettiği ve bu kısımdan belirlediği kısmın özgür bırakılmasıdır. Bunun nedeni, bu kısmın azat edilmesinin ölen kişinin ölümünden sonra zorunlu hale gelmesi ve efendinin hayattayken bunu yapma seçeneğine sahip olmasıdır. Kölenin azat edilmesi vasiyet eden efendi tarafından yapıldığında, vasiyet eden yalnızca mirasından aldığı kısma hak kazanır ve kölenin geri kalanı azat edilmez, çünkü mirası başkalarına geçmiştir. Ancak, kölenin geri kalan kısmının mirasından azat edilmesini vasiyet ederse, bu yükümlülük ortakları ve mirasçıları için de geçerli olur. {cite:muwatta-maruf-1997 s.323} {cite:muwatta-maruf-1997 s.324}"
  id: "Malik berkata: Praktik yang berlaku di antara kita mengenai seorang budak yang tuannya membebaskan sebagian darinya—sepertiga, seperempat, setengah, atau sebagian—setelah kematiannya, adalah bahwa hanya bagian yang dibebaskan dan ditentukan oleh tuan tersebut yang dibebaskan. Ini karena pembebasan bagian tersebut menjadi wajib setelah kematian almarhum, dan tuan memiliki pilihan untuk melakukannya selama hidupnya. Ketika pembebasan budak dilakukan oleh tuan yang membuat wasiat, pewaris hanya berhak atas apa yang diterimanya dari hartanya, dan sisa budak tidak dibebaskan, karena hartanya telah beralih ke orang lain. Namun, jika ia mewariskan agar sisa bagian budak dibebaskan dari hartanya, maka kewajiban ini akan berlaku untuk mitra dan ahli warisnya. {cite:muwatta-maruf-1997 p.323} {cite:muwatta-maruf-1997 p.324}"
