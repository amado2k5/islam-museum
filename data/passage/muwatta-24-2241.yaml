label: { ar: "الموطأ 2241 — مالك: الأمر المجتمع عليه عندنا في العبد يعتق سيده منه شقصا، ثلثه أو ربعه أو نصفه أو سهما من الأسهم بعد موته، أنه لا يعتق منه إلا ما أعتق سيده وسمى من ذلك الشقص، لأن عتاقة ذلك الشقص إنما وجبت بعد وفاة الميت", en: "Muwatta 2241" }
summary:
  ar: "قال مالك: والأمر المجتمع عليه عندنا في العبد يعتق سيده منه شقصا، ثلثه أو ربعه أو نصفه أو سهما من الأسهم، بعد موته: أنه لا يعتق منه إلا ما أعتق سيده وسمى من ذلك الشقص. وذلك أن عتاقة ذلك الشقص إنما وجبت وكانت بعد وفاة الميت، وأن سيده كان مخيرا في ذلك ما عاش، فلما وقع العتق للعبد على سيده الموصي، لم يكن للموصي إلا ما أخذ من ماله، ولم يعتق ما بقي من العبد، لأن ماله قد صار لغيره. إلا أن يوصي بأن يعتق ما بقي منه في ماله، فإن ذلك لازم لشركائه وورثته. {cite:muwatta-maruf-1997 p.323} {cite:muwatta-maruf-1997 p.324}"
