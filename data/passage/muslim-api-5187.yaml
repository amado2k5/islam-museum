label: { ar: "صحيح مسلم 5187 — ما حُرّم", en: "Sahih Muslim 5187 — what was made unlawful", ur: "صحیح مسلم 5187 — جو حرام کیا گیا" }
text: "… حَازِمٍ - حَدَّثَنَا يَعْلَى بْنُ حَكِيمٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ سَأَلْتُ ابْنَ عُمَرَ عَنْ نَبِيذِ الْجَرِّ، فَقَالَ حَرَّمَ رَسُولُ اللَّهِ نَبِيذَ الْجَرِّ. فَأَتَيْتُ ابْنَ عَبَّاسٍ فَقُلْتُ أَلاَ تَسْمَعُ مَا يَقُولُ ابْنُ عُمَرَ قَالَ وَمَا يَقُولُ قُلْتُ قَالَ حَرَّمَ رَسُولُ اللَّهِ نَبِيذَ الْجَرِّ. فَقَالَ صَدَقَ ابْنُ عُمَرَ حَرَّمَ رَسُولُ اللَّهِ نَبِيذَ الْجَرِّ. فَقُلْتُ وَأَىُّ شَىْءٍ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5187، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 5187 (The Book of Drinks), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 5187، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
