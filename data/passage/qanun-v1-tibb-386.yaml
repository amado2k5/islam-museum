text: "… معروف. كثيراً في المقابر وبالشام، ويدرك بنيسان. ينفع لضيق التنفس والربو والإعياء وأوجاع الصدر، ينفع الكبد والطحال والاستسقاء واليرقان، وعرق النسا، والبواسير، والقروح، ويخرج الديدان، ويسقط الأجنة، ويدر الحيض، ويبرئ أمراض الرحم. التداوي بالنباتات والأعشاب، قديماً وحديثاً، أحمد شمس الدين، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 386، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأطوار خلق الجنين، وأعضاء البدن، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 386, that mentions illness and the sick, pain, named diseases, the stages of the embryo, the organs of the body, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 386 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، جنین کے مراحل، اعضائے بدن، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 386, que menciona la enfermedad y los enfermos, el dolor, las enfermedades con nombre, las etapas del embrión, los órganos del cuerpo y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 386, qui mentionne la maladie et les malades, la douleur, les maladies nommées, les stades de l'embryon, les organes du corps, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 386'dan bir bölüm; hastalık, hasta, ağrı, hastalıkların isimleri, fetüs gelişiminin aşamaları, vücut organları ve tedaviden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 386, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, tahapan perkembangan janin, organ tubuh, dan pengobatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
