text: "… ابن الأعرابي، قال كعب الأحبار: أسماء محمد في في الكتب السالفة :... والمتوكل والمختار وحمياطى وفارقليطا وماذماذ والحاشر والماحي والمقفي والخاتم والحاتم، قال أبو العباس: يقال: وحمياطى: يحمى الحرم ويمنع الحرام ويوطئ الحلال، وماذماذ: طيب، والحاشر: يحشر الناس في أيامه …"
