text: "ذين لا يؤمنون بالله (٢) الآية ) . فإن مفهومها أن غير أهل الكتاب من المجوس وغيرهم لا يشاركونهم في حكم (٣) الآية . وذهب ابن وهب المالكي إلى أن الجزية لا تقبل من المجوس العرب، لأنه ليس في العرب"
