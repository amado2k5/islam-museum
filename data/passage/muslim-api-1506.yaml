label: { ar: "صحيح مسلم 1506 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Sahih Muslim 1506 — ranks raised; bad deeds erased and sins shed", ur: "صحیح مسلم 1506 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sahih Muslim 1506 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Sahih Muslim 1506 — Les rangs sont élevés; les mauvaises actions sont effacées et les péchés sont pardonnés.", tr: "Sahih Muslim 1506 — Dereceleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Sahih Muslim 1506 — Menaikkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "… الْوُضُوءَ ثُمَّ أَتَى الْمَسْجِدَ لاَ يَنْهَزُهُ إِلاَّ الصَّلاَةُ لاَ يُرِيدُ إِلاَّ الصَّلاَةَ فَلَمْ يَخْطُ خَطْوَةً إِلاَّ رُفِعَ لَهُ بِهَا دَرَجَةٌ وَحُطَّ عَنْهُ بِهَا خَطِيئَةٌ حَتَّى يَدْخُلَ الْمَسْجِدَ فَإِذَا دَخَلَ الْمَسْجِدَ كَانَ فِي الصَّلاَةِ مَا كَانَتِ الصَّلاَةُ هِيَ تَحْبِسُهُ وَالْمَلاَئِكَةُ يُصَلُّونَ عَلَى أَحَدِكُمْ مَا دَامَ فِي مَجْلِسِهِ الَّذِي صَلَّى فِيهِ يَقُولُونَ اللَّهُمَّ امَّ اغْفِرْ لَهُ اللَّهُمَّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1506، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 1506 (The Book of Mosques and Places of Prayer), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 1506، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 1506 (El Libro de las Mezquitas y Lugares de Oración), habla de ascensos de rango, borrados de malas acciones y perdón de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 1506 (Livre des Mosquées et des Lieux de Prière), évoque l'élévation au rang de saint, l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée des actes."
  tr: "Sahih Müslim'de 1506 numaralı hadis, derecelerin yükseltilmesinden, günahların silinmesinden ve zulümlerin giderilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 1506, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
