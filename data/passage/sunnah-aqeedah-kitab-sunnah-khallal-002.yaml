text: "فقد كفر) . وعن ابن مسعود هنه قال: إن الله تعالى قرن الزكاة في كتابه مع الصلاة، فمن لم يزك فلا صلاة له . اه. قلت: فأهل السنة يسمون مرتكب الكبيرة من أهل القبلة: مسلم فاسق، فينفون عنه اسم الإيمان،"
