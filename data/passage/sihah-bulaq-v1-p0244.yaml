  السباع فسماهه مجرتين كما يقال القمران والعمران وفى نسخة بنداومن جزتيها والمجو أيضا
  بالتحريك لغه فى النحروه والعطس قال إبن السكيت لانهم يبدلون الميم من النون مشل نخجت
  الدلوو محجتمخر مخرت السفينة تمخر وتمغر مخرار مخورا اذاجرت تشق المامع صوت
  ومنه قوله تعالى وترى الفلل مواخر فيه بعف جوارى ويقال مخرت الارض اى أرسلت فيها
  الماء وبنات مخر سحائب يجتن قبل الصيف مبيضات رقاقاواستمذرت الريح اذا استقبلتها
  بانفك قال الراجز يصف الذئب
  ستمغر الريح اذا لم يسمع *بثل مفراع الصفاء الموقع
  وفى الحديث اذا أراد أحدكم البول فليتمخر الريح أى فلينظر من أين مجراها فلايسستقبلها
  كيلاترد عليه البول وامتخرت القوم انتقيت خيارهم وتخبتهم قال الراجز
