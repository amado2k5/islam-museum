label: { ar: "نوادر جحا الكبرى، ص 86 — «هل تشاجرتا من أجل العمر؟\")»", en: "Nawadir Juha al-Kubra, p. 86 — 'Did They Quarrel over Age?'", ur: "نوادر جحا الکبریٰ، ص 86 — «کیا ان کا جھگڑا عمر پر ہوا؟»", fr: "Nawadir Juha al-Kubra, p. 86 — « Se sont-elles disputées à propos de l'âge ? »", es: "Nawadir Juha al-Kubra, p. 86 — «¿Riñeron por la edad?»", tr: "Juha'nın Büyük Fıkraları, s. 86 — “Yaş konusunda mı tartıştılar?”", id: "Anekdot-anekdot Hebat Juha, hlm. 86 — “Apakah mereka bertengkar soal usia?”" }
text: "… هل تشاجرتا من أجل العمر؟ جاءه رجلٌ في ارتباكِ عظيم وقال له: لقد تشاجَرَتْ إمرأتي وأختُها وكادتا أن تخنقا بعضهما، فأرجو أن تحضر لعلَّك تتَّخذ وسيلةً لإصلاح ذات بينهما. فأجابه الشيخ : هل تشاجرتا من أجل العمر؟ فقال الرجل : …"
summary:
  ar: "طلب رجل من جحا أن يتوسط في خصام بين زوجته وأختها، فسأل جحا هل تخاصمتا على العمر؛ فقال الرجل إنهما لم تتجادلا في الأعمار؛ فقال جحا أن يعود إلى البيت، فربما تصالحتا. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  en: "A man asks Juha to mediate a quarrel between his wife and her sister; Juha asks whether they fought over age; the man says they did not argue about ages; Juha says to go home, they may have made up. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  ur: "ایک آدمی نے جحا سے کہا کہ میری بیوی اور اس کی بہن کے جھگڑے میں صلح کرا دو؛ جحا نے پوچھا کہ کیا وہ عمر پر لڑی تھیں؛ آدمی نے کہا کہ عمروں پر بحث نہیں ہوئی؛ جحا نے کہا کہ گھر جاؤ، شاید وہ صلح کر چکی ہوں۔ {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  fr: "Un homme demande à Juha d'arbitrer une querelle entre sa femme et la sœur de celle-ci; Juha demande si elles se sont disputées à propos de l'âge; l'homme dit qu'elles n'ont pas discuté des âges; Juha dit de rentrer chez lui, elles se sont peut-être réconciliées. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  es: "Un hombre le pide a Juha que medie en una riña entre su mujer y la hermana de esta; Juha pregunta si pelearon por la edad; el hombre dice que no discutieron por las edades; Juha dice que vuelva a casa, quizá ya hicieron las paces. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  tr: "Bir adam Juha'dan karısı ve kız kardeşi arasındaki bir anlaşmazlığı çözmesini istedi. Juha, yaşları konusunda tartışıp tartışmadıklarını sordu ve adam tartışmadıklarını söyledi. Bunun üzerine Juha, adama eve gitmesini söyleyerek, belki de barışabileceklerini ima etti. {cite:juha-nawadir-kubra-djuwaydi s. 86}"
  id: "Seorang pria meminta Juha untuk menengahi perselisihan antara istrinya dan saudara perempuannya. Juha bertanya apakah mereka berdebat tentang usia mereka, dan pria itu menjawab bahwa mereka tidak berdebat. Juha kemudian menyuruhnya pulang, menyarankan agar mereka mungkin berdamai. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
