label: { ar: "الموطأ 2129 — مالك عن العلاء بن عبد الرحمن عن معبد بن كعب السلمي عن أخيه عبد الله بن كعب بن مالك عن أبي أمامة: من اقتطع حق امرئ مسلم بيمينه حرم الله عليه الجنة، وإن كان قضيبا من أراك", en: "Muwatta 2129", es: "Muwatta 2129", fr: "Muwatta 2129", ur: "موطا 2129", tr: "El-Muvatta 2129 — Malik, El-Ala' ibn Abd el-Rahman'dan, o da Ma'bad ibn Ka'b el-Sulami'den, o da kardeşi Abdullah ibn Ka'b ibn Malik'ten, o da Ebu Umame'den rivayetle: Kim bir Müslümanın hakkını haksız yere yemin ederek gasp ederse, Allah ona cenneti haram kılar; bu, bir dal arak ağacı bile olsa.", id: "Al-Muwatta 2129 — Malik, berdasarkan riwayat Al-Ala’ ibn Abd al-Rahman, berdasarkan riwayat Ma’bad ibn Ka’b al-Sulami, berdasarkan riwayat saudaranya Abdullah ibn Ka’b ibn Malik, berdasarkan riwayat Abu Umamah: Barang siapa yang mengambil hak seorang Muslim secara tidak adil dengan bersumpah, maka Allah akan mengharamkan surga baginya, meskipun hanya sebatang ranting kayu arak." }
text: "وَإِنْ كَانَ قَضِيبًا مِن أرَاكٍ"
summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن عن معبد بن كعب السلمي عن أخيه عبد الله بن كعب بن مالك الأنصاري عن أبي أمامة أن رسول الله قال: من اقتطع حق امرئ مسلم بيمينه، حرم الله عليه الجنة، وأوجب له النار. قالوا: وإن كان شيئا يسيرا يا رسول الله؟ قال: وإن كان قضيبا من أراك، ثلاث مرات. {cite:muwatta-maruf-1997 p.270}"
  tr: "Malik, Al-Ala' ibn Abd al-Rahman'dan, o da Ma'bad ibn Ka'b al-Sulami'den, o da kardeşi Abdullah ibn Ka'b ibn Malik al-Ansari'den, o da Ebu Umame'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Kim bir Müslümanın hakkını haksız yere yemin ederek gasp ederse, Allah ona cenneti haram kılar ve cehennem ateşini ona farz kılar.\" Sahabeler, \"Ey Allah Resulü, önemsiz bir şey olsa bile mi?\" diye sordular. Resulullah, \"Bir dal arak ağacı bile olsa,\" diye üç defa buyurdu. {cite:muwatta-maruf-1997 s.270}"
  id: "Malik meriwayatkan dari Al-Ala’ ibn Abd al-Rahman, dari Ma’bad ibn Ka’b al-Sulami, dari saudaranya Abdullah ibn Ka’b ibn Malik al-Ansari, dari Abu Umamah, bahwa Rasulullah SAW bersabda: “Barangsiapa yang mengambil hak seorang Muslim secara tidak adil dengan bersumpah, maka Allah akan mengharamkan surga baginya dan mewajibkan neraka baginya.” Mereka bertanya: “Bahkan jika itu sesuatu yang sepele, wahai Rasulullah?” Beliau menjawab: “Bahkan jika itu ranting kayu arak,” tiga kali. {cite:muwatta-maruf-1997 p.270}"
