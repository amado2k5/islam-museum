label: { ar: "الموطأ 2129 — مالك عن العلاء بن عبد الرحمن عن معبد بن كعب السلمي عن أخيه عبد الله بن كعب بن مالك عن أبي أمامة: من اقتطع حق امرئ مسلم بيمينه حرم الله عليه الجنة، وإن كان قضيبا من أراك", en: "Muwatta 2129" }
text: "وَإِنْ كَانَ قَضِيبًا مِن أرَاكٍ"
summary:
  ar: "يروي مالك عن العلاء بن عبد الرحمن عن معبد بن كعب السلمي عن أخيه عبد الله بن كعب بن مالك الأنصاري عن أبي أمامة أن رسول الله قال: من اقتطع حق امرئ مسلم بيمينه، حرم الله عليه الجنة، وأوجب له النار. قالوا: وإن كان شيئا يسيرا يا رسول الله؟ قال: وإن كان قضيبا من أراك، ثلاث مرات. {cite:muwatta-maruf-1997 p.270}"
