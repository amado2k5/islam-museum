text: "… عن إبراهيم قال: قال عبد اللّه: الحج فريضة، والعمرة تطوع. - حدثنا أبو خالد الأحمر، عن عبد الملك، عن الشعبي قال: هي تطوع. - حدثنا غندر، عن شعبة قال: سألت حماداً عن العمرة: واجبة هي؟ قال: قد اختُلف فيها. - …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 4، ص 263، يرد فيه ذكر الفريضة والفرائض، والواجب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 4, p. 263, whose wording mentions the obligation (farida), the obligatory (wajib), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 4، ص 263 کا اقتباس جس میں فریضہ اور فرائض، واجب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de Ibn Abi Shayba, volume numérisé 4, p. 263, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
