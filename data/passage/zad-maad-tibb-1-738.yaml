text: "… الحبل، وإذا دُقَّ ورقُه اليابس، وكُمِدَ به، أذهب آثار الدم العارض تحت العين، وإذا ضُمِّد به مع الخل، نفع لسعة العقرب. ودُهنه نافع لوجع الظهر والركبتين، ويذهب بالإعياء، ومن أدمن شمَّه لم ينزِل في عينيه الماء، وإذا استُعِط بمائه مع …"
