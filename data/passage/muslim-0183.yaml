label:
  ar: "مسلم 183 — حديث أبي سعيد في الرؤية والشفاعة: شفعت الملائكة"
  en: "Muslim 183 — Abu Sa'id's report of the vision and the intercession"
  ur: "مسلم 183 — دیدار اور شفاعت کے بارے میں ابو سعید کی روایت"
text: "نعم . قال هل تضارون في رؤية الشمس بالظهيرة صحوا ليس معها سحاب وهل تضارون في رؤية القمر ليلة البدر صحوا ليس فيها سحاب . قالوا لا يا رسول الله . قال ما تضارون في رؤية الله تبارك وتعالى يوم …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 183: حديث أبي سعيد في الرؤية والشفاعة: شفعت الملائكة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 183: Abu Sa'id's report of the vision and the intercession. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 183: دیدار اور شفاعت کے بارے میں ابو سعید کی روایت۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
