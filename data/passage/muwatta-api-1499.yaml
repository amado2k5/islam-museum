text: "… سَيِّدِهِ وَذَلِكَ أَنَّ الرَّجُلَ إِذَا هَلَكَ وَتَرَكَ عَبْدًا مُدَبَّرًا قِيمَتُهُ خَمْسُونَ وَمِائَةُ دِينَارٍ وَكَانَ الْعَبْدُ قَدْ شَجَّ رَجُلاً حُرًّا مُوضِحَةً عَقْلُهَا خَمْسُونَ دِينَارًا وَكَانَ عَلَى سَيِّدِ الْعَبْدِ مِنَ الدَّيْنِ خَمْسُونَ دِينَارًا. قَالَ مَالِكٌ فَإِنَّهُ يُبْدَأُ بِالْخَمْسِينَ دِينَارًا الَّتِي فِي عَقْلِ الشَّجَّةِ فَتُقْضَى مِنْ ثَمَنِ الْعَبْدِ ثُمَّ يُقْضَى دَيْنُ سَيِّدِهِ ثُمَّ يُنْظَرُ إِلَى مَا بَقِيَ مِنَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1499، يذكر مداواة الجراح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1499 (The Mudabbar), that mentions the treatment of wounds. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1499، جس میں زخموں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
