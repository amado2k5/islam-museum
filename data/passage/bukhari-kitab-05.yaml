summary:
  ar: "القسم 5 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الغسل»، ويضم فيها النصوص من 248 إلى 293 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 5 of Sahih al-Bukhari (Bathing (Ghusl)) in the division of the open hadith dataset the museum took its reports from: reports 248 to 293 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 5، عنوان «کتاب الغسل»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 248 تا 293۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 5 de Sahih al-Bukhari (El baño ritual (Ghusl)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 248 al 293, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses données du livre 5 du Sahih al-Bukhari (Le bain rituel du ghusl), dans la partie ouverte du recueil de hadiths d'où proviennent les récits 248 à 293. Le musée classe ses archives relatives à ces récits sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 5. bölümü \"Abdest Kitabı\" başlığını taşımakta olup, 248 ila 293 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 5 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Wudhu\" dan berisi teks 248 hingga 293, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
