text: "… رَسُولَ اللَّهِ أَيَرْجِعُ النَّاسُ بِأَجْرَيْنِ وَأَرْجِعُ بِأَجْرٍ فَأَمَرَ عَبْدَ الرَّحْمَنِ بْنَ أَبِي بَكْرٍ أَنْ يَنْطَلِقَ بِهَا إِلَى التَّنْعِيمِ. قَالَتْ فَأَرْدَفَنِي خَلْفَهُ عَلَى جَمَلٍ لَهُ - قَالَتْ - فَجَعَلْتُ أَرْفَعُ خِمَارِي أَحْسُرُهُ عَنْ عُنُقِي فَيَضْرِبُ رِجْلِي بِعِلَّةِ الرَّاحِلَةِ. قُلْتُ لَهُ وَهَلْ تَرَى مِنْ أَحَدٍ قَالَتْ فَأَهْلَلْتُ بِعُمْرَةٍ ثُمَّ أَقْبَلْنَا حَتَّى انْتَهَيْنَا إِلَى رَسُولِ اللَّهِ وَهُوَ بِالْحَصْبَةِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2935، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2935 (The Book of Pilgrimage), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2935، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
