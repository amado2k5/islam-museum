text: "… مِنْ عُرَيْنَةَ قَدِمُوا الْمَدِينَةَ فَاجْتَوَوْهَا فَبَعَثَهُمْ رَسُولُ اللَّهِ فِي إِبِلِ الصَّدَقَةِ وَقَالَ \" اشْرَبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا \". فَقَتَلُوا رَاعِيَ رَسُولِ اللَّهِ وَاسْتَاقُوا الإِبِلَ وَارْتَدُّوا عَنِ الإِسْلاَمِ فَأُتِيَ بِهِمُ النَّبِيُّ فَقَطَعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ مِنْ خِلاَفٍ وَسَمَرَ أَعْيُنَهُمْ وَأَلْقَاهُمْ بِالْحَرَّةِ. قَالَ أَنَسٌ فَكُنْتُ أَرَى أَحَدَهُمْ يَكُدُّ الأَرْضَ بِفِيهِ حَتَّى مَاتُوا. وَرُبَّمَا قَالَ حَمَّادٌ يَكْدُمُ الأَرْضَ بِفِيهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 72، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 72 (The Book on Purification), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 72، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
