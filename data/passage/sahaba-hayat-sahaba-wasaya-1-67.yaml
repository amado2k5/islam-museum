text: "… وأخرج البغوى عن كعب بن عدى قال : اقبلت فى وفد من اهل الحيرة الى النبى فرض علينا الإسلام فأسلمنا ثم انصرفنا الى الحيرة، فلم نلبث ان جامتنا وفاة رسول اللّٰه فارتاب اصحابى وقالوا: لو كان نيا لم يمت، فقلت: …"
