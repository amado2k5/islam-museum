text: "كان رسول الله يصلي على راحلته في السفر حيث توجهت به"
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، في باب صلاة النافلة في السفر: كان النبي يصلي على راحلته في السفر حيث توجهت به، وقال عبد الله بن دينار إن ابن عمر كان يفعل ذلك. ويخرّجه المحقق عند مسلم (2/149) والنسائي (1/244) وأبي عوانة وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الصواب رواية مالك عن عبد الله بن دينار لا عن نافع، وأنه حديث صحيح روي عن ابن عمر وجابر وأنس من وجوه وتلقاه العلماء بالقبول (التمهيد 17/171). {cite:muwatta-maruf-1997 p.215} {cite:muwatta-maruf-1997 p.216}"
