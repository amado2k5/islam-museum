text: "… ومغص العضل وقد يعرض نافض يدلّ عليه، ويعرض وجع إعيائي وقد يتغير النبض عن حاله فيدل عليه. والعلامات الليلية أشدّ من النهارية وقد تحتبس بسبب البحران أشياء كان من شأنها أن تستفرغ من دم طمث، أو بواسير أو اختلاف فيدل …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 109، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 109, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 109 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 109, que menciona el dolor, las enfermedades específicas, el hospital y la práctica médica, los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 109, qui mentionne la douleur, les maladies nommées, l'hôpital et l'art médical, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Bölümünün 109. sayfasından, ağrı, hastalıkların isimleri, hastane ve tıp sanatı ile vücut organlarından bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 3, hlm. 109, yang menyebutkan rasa sakit, nama-nama penyakit, rumah sakit dan seni kedokteran, serta organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
