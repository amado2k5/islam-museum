  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 3, page 696, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 3. cildinin 696. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Cuplikan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 3, halaman 696, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
