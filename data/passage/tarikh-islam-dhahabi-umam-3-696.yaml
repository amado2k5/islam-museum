text: "… الأسقف: عند النصارى رئيس لهم في الدين فوق القسّنيس ودون المطران. والحَبْر: بفتح الحاء المهملة: العالم، ذميّاً كان أو مسلماً بعد أن يكون من أهل الكتاب. والمدراس : بيعة اليهود. وفي طبقات ابن سعد مدارسهم. يسايره: يسير معه. وفي ع …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 3، ص 696، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 3, p. 696, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 3، ص 696 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
