text: "… خَليفَةَ رسولِ اللهِ عَلَى الجُملَةِ والإطلاقِ، والدّلائِلُ عَلَىٰ هذا كَثيرَةٌ. ويُستَحَبُّ الغَزو ونَستَحِبُّ الغَزوَ بالنِّساءِ، ولا بُدَّ مِن دَجّالِينَ كَذّابِينَ يَدَّعونَ النُّبُوةَ قَدْ مَضَىٰ مِنهُم كَثيرٌ جِدَّا، وقَدْ كان فِيهُم مَنْ يَدّعِي الرُّبوبِيَّةَ لَعَنَهُم اللهُ وَلَعَنَ أتْباعَهم. وفَرْضٌ عَلَى الإِمامِ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 321، يرد فيه ذكر ما فُرض على الناس، والفرض، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 321, whose wording mentions what was made obligatory on people, the obligatory (fard), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 321 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 321, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 321, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
