text: "، غير معتبرة شرعا على حال، إلا ما قام الدليل على اعتباره في باب خطاب الوضع خاصة. أما في غير ذلك فالقاعدة مستمرة. وإذا لم تكن معتبرة حتى تقترن بها المقاصد، كان مجردها في الشرع بمثابة حركات العجماوات والجمادات. والأحكام"
