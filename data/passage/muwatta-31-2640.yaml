label: { ar: "الموطأ 2640 — أبو هريرة: إياكم والظن فإنه أكذب الحديث ولا تجسسوا ولا تحسسوا", en: "Muwatta 2640", es: "Muwatta 2640", fr: "Muwatta 2640", ur: "موطا 2640", tr: "El-Muvatta 2640 — Ebu Hurayra: Şüpheden sakının, çünkü o en büyük yalan sözüdür. Casusluk yapmayın, kusur aramayın.", id: "Al-Muwatta 2640 — Abu Hurairah: Waspadalah terhadap prasangka, karena prasangka adalah ucapan yang paling dusta. Janganlah kamu memata-matai atau mencari-cari kesalahan." }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: إياكم والظن، فإن الظن أكذب الحديث، ولا تجسسوا ولا تحسسوا ولا تنافسوا ولا تحاسدوا ولا تباغضوا ولا تدابروا، وكونوا عباد الله إخوانا. {cite:muwatta-maruf-1997 p.494}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakleder: \"Şüpheden sakının, çünkü şüphe en yalan sözdür. Birbirinizi gözetlemeyin, birbirinizin kusurlarını aramayın, birbirinizle yarışmayın, birbirinizi kıskanmayın, birbirinizden nefret etmeyin ve birbirinize sırtınızı dönmeyin. Aksine, Allah'ın kulları olun, kardeşlerim.\" {cite:muwatta-maruf-1997 s.494}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Waspadalah terhadap prasangka, karena prasangka adalah ucapan yang paling dusta. Janganlah kalian saling memata-matai, janganlah kalian saling mencari-cari kesalahan, janganlah kalian saling berlomba-lomba, janganlah kalian saling iri hati, janganlah kalian saling membenci, dan janganlah kalian saling membelakangi. Sebaliknya, jadilah hamba-hamba Allah, bersaudaralah.\" {cite:muwatta-maruf-1997 p.494}"
