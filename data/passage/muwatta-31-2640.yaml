label: { ar: "الموطأ 2640 — أبو هريرة: إياكم والظن فإنه أكذب الحديث ولا تجسسوا ولا تحسسوا", en: "Muwatta 2640" }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: إياكم والظن، فإن الظن أكذب الحديث، ولا تجسسوا ولا تحسسوا ولا تنافسوا ولا تحاسدوا ولا تباغضوا ولا تدابروا، وكونوا عباد الله إخوانا. {cite:muwatta-maruf-1997 p.494}"
