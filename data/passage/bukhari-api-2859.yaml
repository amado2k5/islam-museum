label: { ar: "صحيح البخاري 2859 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 2859 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 2859 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ أَبِي حَازِمِ بْنِ دِينَارٍ، عَنْ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ـ أَنَّ رَسُولَ اللَّهِ قَالَ \" إِنْ كَانَ فِي شَىْءٍ فَفِي الْمَرْأَةِ وَالْفَرَسِ وَالْمَسْكَنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2859، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2859 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 2859، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
