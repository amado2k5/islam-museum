text: "… يكبّر تكبيرة الافتتاح مخالطاً لنيته إياها، أي : مقارناً. أشار إلى أن وقت النية وقت التكبير، هو عندنا محمول على الندب والاستحباب دون الحتم والإيجاب، فإن تقديم النية على التحريمة جائز عندنا إذا لم يوجد بينهما عمل يقطع أحدهما عن …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 590، يرد فيه ذكر الوجوب، والمندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 590, whose wording mentions obligation (wujub), the recommended (mandub), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 590 کا اقتباس جس میں وجوب، مندوب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 590, dont le texte mentionne l'obligation (wujub), le recommandé (mandub), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
