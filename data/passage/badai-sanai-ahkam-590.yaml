  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 590. sayfasından, farz, tavsiye edilen ve müstehap olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz, tavsiye edilen ve müstehap olan amellerin yanı sıra mekruh edilen, yasaklanan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 590, yang menyebutkan amalan wajib, anjuran, dan yang diinginkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, anjuran, dan yang diinginkan, serta dosa yang tidak disukai, dilarang, dan dosa kecil."
