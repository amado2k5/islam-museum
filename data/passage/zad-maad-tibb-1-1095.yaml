text: "… فصل مرض الأبدان الحمية طب القلوب نصل طب الأبدان أحوال البدن وظيفة الطبيب فصل التداوي فضل طبِّه على طب الأطباء فصل الحث على التداوي وربط الأسباب بالمسببات معنى لكل داء دواء الأمر بالتداوي وبأنه لا ينافي التوكل التداوي والشفاء مقدر …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 1095، يذكر الطب والطبيب، والمرض والمريض، والحمية، والدواء، والداء، والتداوي، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1095, that mentions medicine and the physician, illness and the sick, diet as treatment, the drug, the disease and its remedy, seeking treatment, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 1095 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، پرہیز، دوا، بیماری، علاج کرانا، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 1095, que menciona la medicina y el médico, la enfermedad y los enfermos, la dieta como tratamiento, el medicamento, la enfermedad y su remedio, la búsqueda de tratamiento, la curación; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 1095, qui mentionne la médecine et le médecin, la maladie et les malades, le régime alimentaire comme traitement, le médicament, la maladie et son remède, la recherche de traitement, la guérison; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 1095. sayfasından, tıp ve hekim, hastalık ve hasta, diyet, ilaç, rahatsızlık, tedavi ve iyileşmeden bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, halaman 1095, yang menyebutkan tentang kedokteran dan dokter, penyakit dan pasien, diet, obat-obatan, penyakit, pengobatan, dan penyembuhan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
