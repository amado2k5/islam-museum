label: { ar: "سنن ابن ماجه 3013 — الأب والأبوة", en: "Sunan Ibn Majah 3013 — the father and fatherhood", ur: "سنن ابن ماجہ 3013 — باپ اور والدیت", es: "Sunan Ibn Majah 3013 — El padre y la paternidad", fr: "Sunan Ibn Majah 3013 — le père et la paternité" }
text: "… الْقَاهِرِ بْنُ السَّرِيِّ السُّلَمِيُّ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ كِنَانَةَ بْنِ عَبَّاسِ بْنِ مِرْدَاسٍ السُّلَمِيُّ، أَنَّ أَبَاهُ، أَخْبَرَهُ عَنْ أَبِيهِ، أَنَّ النَّبِيَّ ـ دَعَا لأُمَّتِهِ عَشِيَّةَ عَرَفَةَ بِالْمَغْفِرَةِ فَأُجِيبَ إِنِّي قَدْ غَفَرْتُ لَهُمْ مَا خَلاَ الظَّالِمَ فَإِنِّي آخُذُ لِلْمَظْلُومِ مِنْهُ. قَالَ \" أَىْ رَبِّ إِنْ شِئْتَ أَعْطَيْتَ الْمَظْلُومَ مِنَ الْجَنَّةِ وَغَفَرْتَ لِلظَّالِمِ \". فَلَمْ يُجَبْ عَشِيَّتَهُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3013، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 3013 (Chapters on Hajj Rituals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3013، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3013 (Capítulos sobre los rituales del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 3013 (Chapitres sur les rites du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
