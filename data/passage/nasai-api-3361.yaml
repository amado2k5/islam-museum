text: "لأَقْضِيَنَّ فِيهَا بِقَضِيَّةِ رَسُولِ اللَّهِ صلى الله عليه وسلم إِنْ كَانَتْ أَحَلَّتْهَا لَكَ جَلَدْتُكَ وَإِنْ لَمْ تَكُنْ أَحَلَّتْهَا لَكَ رَجَمْتُكَ بِالْحِجَارَةِ فَكَانَتْ أَحَلَّتْهَا لَهُ فَجُلِدَ مِائَةً ‏.‏ قَالَ قَتَادَةُ فَكَتَبْتُ إِلَى حَبِيبِ بْنِ سَالِمٍ فَكَتَبَ إِلَىَّ بِهَذَا ‏.‏"
summary:
  ar: "في السنن النسائي؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan al-Nasa'i; sending a letter or message to a party."
  ur: "سنن النسائی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
