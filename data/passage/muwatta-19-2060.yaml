label: { ar: "الموطأ 2060 — مالك: لا تصلح المساقاة في شيء من الأصول مما تحل فيه المساقاة، إذا كان فيه ثمر قد طاب وبدا صلاحه وحل بيعه، وإنما ينبغي أن يساقى من العام المقبل، لأن مساقاة ما حل بيعه من الثمار إجارة", en: "Muwatta 2060" }
summary:
  ar: "قال مالك: لا تصلح المساقاة في شيء من الأصول مما تحل فيه المساقاة، إذا كان فيه ثمر قد طاب وبدا صلاحه وحل بيعه. وإنما ينبغي أن يساقى من العام المقبل. وإنما مساقاة ما حل بيعه من الثمار إجارة؛ لأنه إنما ساقى صاحب الأصل ثمرا قد بدا صلاحه، على أن يكفيه إياه ويجذه له، بمنزلة الدنانير والدراهم يعطيه إياها. وليس ذلك بالمساقاة. إنما المساقاة ما بين أن يجذ النخل إلى أن يطيب الثمر ويحل بيعه. {cite:muwatta-maruf-1997 p.243}"
