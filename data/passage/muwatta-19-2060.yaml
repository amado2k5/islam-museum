label: { ar: "الموطأ 2060 — مالك: لا تصلح المساقاة في شيء من الأصول مما تحل فيه المساقاة، إذا كان فيه ثمر قد طاب وبدا صلاحه وحل بيعه، وإنما ينبغي أن يساقى من العام المقبل، لأن مساقاة ما حل بيعه من الثمار إجارة", en: "Muwatta 2060", es: "Muwatta 2060", fr: "Muwatta 2060", ur: "موطا 2060", tr: "Al-Muwatta 2060 — Malik: Satışa hazır olgunlaşmış meyvesi olan herhangi bir arazi türünde, ortakçılık sözleşmesi geçerli değildir. Aksine, sözleşme bir sonraki yıl başlamalıdır, çünkü satışı caiz olan meyveler için yapılan ortakçılık bir kiralama olarak kabul edilir.", id: "Al-Muwatta 2060 — Malik: Perjanjian bagi hasil tidak sah untuk jenis lahan apa pun yang diperbolehkan bagi hasil, jika lahan tersebut memiliki buah yang sudah matang dan siap dijual. Sebaliknya, perjanjian tersebut harus dimulai pada tahun berikutnya, karena bagi hasil untuk buah yang boleh dijual dianggap sebagai sewa." }
summary:
  ar: "قال مالك: لا تصلح المساقاة في شيء من الأصول مما تحل فيه المساقاة، إذا كان فيه ثمر قد طاب وبدا صلاحه وحل بيعه. وإنما ينبغي أن يساقى من العام المقبل. وإنما مساقاة ما حل بيعه من الثمار إجارة؛ لأنه إنما ساقى صاحب الأصل ثمرا قد بدا صلاحه، على أن يكفيه إياه ويجذه له، بمنزلة الدنانير والدراهم يعطيه إياها. وليس ذلك بالمساقاة. إنما المساقاة ما بين أن يجذ النخل إلى أن يطيب الثمر ويحل بيعه. {cite:muwatta-maruf-1997 p.243}"
  tr: "Malik şöyle dedi: Meyve olgunlaşmış ve satışa hazır hale gelmişse, ortakçılık sözleşmesi, ortakçılığın caiz olduğu herhangi bir arazi türü için geçerli değildir. Aksine, sözleşme bir sonraki yıl başlamalıdır. Satışa hazır meyvenin ortakçılığı, bir kiralama olarak kabul edilir, çünkü arazi sahibi esasen olgunlaşmış meyveyi, toprak sahibinin ona dinar ve dirhem verdiği gibi, meyveyi hasat edip geçimini sağlaması şartıyla toprak sahibine vermektedir. Bu ortakçılık değildir. Ortakçılık sadece hurma ağaçlarının hasat edildiği zaman ile meyvenin olgunlaşıp satışa hazır hale geldiği zaman arasında geçerlidir. {cite:muwatta-maruf-1997 s.243}"
  id: "Malik berkata: Perjanjian bagi hasil tidak berlaku untuk jenis lahan apa pun di mana bagi hasil diperbolehkan, jika buahnya sudah matang dan siap dijual. Sebaliknya, perjanjian tersebut harus dimulai tahun berikutnya. Bagi hasil buah yang siap dijual dianggap sebagai sewa, karena pemilik lahan pada dasarnya memberikan buah yang sudah matang kepada pemilik lahan, dengan syarat pemilik lahan akan menyediakan dan memanennya, sama seperti ia memberikan dinar dan dirham kepadanya. Ini bukan bagi hasil. Bagi hasil hanya berlaku antara waktu pohon kurma dipanen dan buahnya matang serta siap dijual. {cite:muwatta-maruf-1997 p.243}"
