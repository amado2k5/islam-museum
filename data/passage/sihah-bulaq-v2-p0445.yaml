text: |-
  اه وعبارة القاموس الفرسك
  اتدع فى نحة أماس بانريك
  يتفلو فى هامسّ بعض
  كزبرج الخوخ أوضرب منه أبرد
  أحر أوما يتقلق عن تواه !ه
  غركت الثوب والسفيل بيدى أفركه فركا وقلة مفروكة وأفرك لسفيل أى صارة ريكا وهو
  حين يصلح أن يفرلى فيؤ كل تقول للتيت أول ما يطلع تجم ثم فرخ وقصب ثم أءصف ثم سبل
  ثم منبل تم احب وألب ثم أسق ثم أفرك ثم أحصد والغرك بالكسر البغض ومنه قول رؤية
  ولم يضعها بين فرك وعشق • تقول منه فركت المرأة زوجها بالكسرته وكدف ركاأى أبغضة
  فهى فروك وفارك وكذلك فركها زوجها ولم يسمع هذا الحرف فى غير الزوجين ويقال رجل
  مفرّل بالتشديد للذى تبغضه الذ-اء وكان امر والقيس مفرّكا والانفر الداسترحاء المنكب
  والفرك بالتصريك استرحام ف أصل الاذن يقال أذن فركاء وفركة أيضاعن يعقوب
  فلصسته وكل مشتبكين فصلتهما فقد فككته ما وكذلك التفكيك والفل الفحى بقال مقتل
  الرجل بين فكيه وفككت الصبىّ جعلت الدواء فى فيه ويقال للشسيخ المكبيرد فك وفرح
  يريد فرج لمسيه وذلك فى الكبراذا هرم قال أبو زيد الفاك من الرجال الهرم بقال قدفك يفك
  فسكاوفكوكا وفك الرهن وأفتكه بعنف أى خلصه وذكاك الرهن ما يفتك به وفكالْ الرهن
  أيضابالكسرافة حكاها الكائى وفك الرقبة أى أعتة ها وانفكت رقبته من الرق
  وما انفك فلان قاعما أى مازال قائما وقول ذى الرمّة
  حراجيج ماتنفك الاصاخة * على الخسف أونرمى بها بلداقفرا
  يريدما تنفلك مناخة فزادالا وسقط فلان فانفكت قدمه أواصبعه اذا انفرجت وزالت
  والفكان انفساخ القدم ومنه قول رؤية • هاجلك من أروى كنهاض الفكل
  قال الاصعى اشاهو الفك من قولت فكه يفكه فكافا ظهر التضعيف ضرورة والفكة الحق
  والاسترشاء قال أبو قيس بن الاسلت
  الخزم والقوة خير من الاشفاق والفكة والهاع
  نقال ما كنت فاكاو اقد فككت بالكسرتفك فكة فأنت فال تال أى أحق وفلان يتضكل اذا
  لم يكن به تماسك فحق والفسكة كواكب مستديرة خلف السمال الرامح قال الاصمحى يسميها
  الصبيان قصفة المساكيز قال والافل الذى انفرج منسكبه عن مفصله ضعفا واسترخاء تقول
  منه ما كنت أفك ولقد فككت تفلا فككا تت فاكة المغزل سعيت لاستدارتها
  والفلكة قطعة من الارض أوالرمل تستدير وترتفع على ماحولها والهع قلك قال الكميت
  فلاسك العراص ودمنتيها * يناظرة ولاغلك الاسيل
  ومنه قيل فلاث ثدى الجارية تفليكا وتفلك استدار تعال أبوعر والتفليك أن يجحمل الراعى
  من العلب مثل الفلكة ثم مجعله فى لسان الفصيل اثلايرضع والفلك بالضم السفينة واحد
  ويجع يذكرويونت وقال تعالى فى الفلاث المشحون فجاهيه مذكرامو حدا وقال تعالى والفلك
  التى تجرى فى الدرفانث ويحقل واحد اوبجما وقال تعالى حتى اذا كنتم فى الفلك وجرين بهم
  نجمع فكانه يذهب جها اذا كانت واحدة الى المركب فيذكر والى السفينة فتونث وكان
  سيبويه يقول الفلك التى هى يجع تكسير للفلك التى هى واحد وليست مثل الجنب الذى هو
  واحدويجع والطفل وما أشبههما من الإمهاء لانّ فعلا وفعلا يشتركان فى السئء الواحدمثل
  العرب
