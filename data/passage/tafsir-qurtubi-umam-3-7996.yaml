  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin resimli 3. cildinin 7996. sayfasından, gayrimüslim milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu bölüm, tarayıcı tarafından gayrimüslim milletler, dinler, mezhepler ve halklar için derlenmiştir."
