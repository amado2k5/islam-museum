text: "عَنْهُ أَنَّهُ كَانَ يَقْرَأُ فِي الرَّكْعَةِ الأُولَى مِنَ الظُّهْرِ قَدْرَ ثَلاَثِينَ آيَةً وَفِي الرَّكْعَةِ الثَّانِيَةِ قَدْرَ خَمْسَ عَشْرَةَ آيَةً ‏.‏ وَرُوِيَ عَنْ عُمَرَ أَنَّهُ كَتَبَ إِلَى أَبِي مُوسَى أَنِ اقْرَأْ فِي الظُّهْرِ بِأَوْسَاطِ الْمُفَصَّلِ ‏.‏ وَرَأَى بَعْضُ أَهْلِ الْعِلْمِ أَنَّ الْقِرَاءَةَ فِي صَلاَةِ الْعَصْرِ كَنَحْوِ الْقِرَاءَةِ فِي صَلاَةِ الْمَغْرِبِ يَقْرَأُ بِقِصَارِ الْمُفَصَّلِ ‏.‏ وَرُوِيَ عَن …"
summary:
