label: { ar: "الموطأ 815 — أبو هريرة: أفطر رجل في رمضان فأمره النبي أن يكفر بعتق رقبة أو صيام شهرين متتابعين أو إطعام ستين مسكيناً، فلم يجد؛ فأُتي بعرق تمر فقال: خذ هذا فتصدق به، فقال: ما أجد أحداً أحوج إليه مني، فضحك النبي حتى بدت أنيابه، ثم قال: كله", en: "Muwatta 815" }
text: "خذ هذا فتصدق به. فقال: ما أجد أحداً أحوج إليه مني. فضحك النبي حتى بدت أنيابه، ثم قال: كله"
summary:
  ar: "أول حديث في باب كفارة من أفطر في رمضان. يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف عن أبي هريرة، أن رجلاً أفطر في رمضان فأمره النبي أن يكفر بعتق رقبة أو صيام شهرين متتابعين أو إطعام ستين مسكيناً. فقال: لا أجد. فأُتي النبي بعرق تمر، فقال: خذ هذا فتصدق به. فقال: ما أجد أحداً أحوج إليه مني، فضحك النبي حتى بدت أنيابه وقال: كله. ويذكر المحقق أن هذا الحديث متصل المعنى في الصحيحين، وأن كلام ابن عبد البر (التمهيد 8/21) في الحديث الذي يليه. {cite:muwatta-maruf-1997 p.399}"
