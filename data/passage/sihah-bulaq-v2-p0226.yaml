text: |-
  ٣٦١
  ويقال خل له من ثكن الطريق أى عن مصه وشكن جبل يفتح الثاء والكاف
  ⁦( عن)⁩ ثمانية ريال وثمانى نسوة وهو فى الاصل منسوب الى الثمن لانه الجزء الذى صير
  السبعة نمانيسة فهو تمنهائم فتصوا أوّل لانهم يغيرون فى النسسب كما قالوادهرى" وسهلى"
  وحذفوا منه احدى ياءي النسب وء وضوامنها الالف كماذعلوا فى المنسوب الى اليمين قنيبّت
  ياؤه عند الاضافة كمائبتت ياء القاضى فتقول ثمانى نسوة وعمانى مائة كماتقول قاضى عبد الله
  ونسقط مع التنوين عند الرفع والجحزوتثبت عند النصب لانه ايس عجمع فيجرى مجرى جوار
  وسوارفى ترك ا اصرف وماجاءو الشعر غر مصروف فه وعلى بوهم آنه بجع وقواهم النوب
  سبع فى عمان كان حته أن يقال غائية لان الطول يذرع بالذراع وهى موننة والعرض يشبر
  بالشبروه ومذكروانما أنتوه لمالم يأتوا بذكر الاشيار وهذا كقولهم صحنا من الشهرخسا
  وانمايراد بالصوم الايام دون الليالى ولوذكر الايام لم يجد بدا من التذكير وان صغرت النمانية
  فاقت بانلخياران شئت حذفت الالف وهو أحسن فقات عيفية وان شئت =دفت الياءفقات
  عمينة قلبت الالفياء وأدغمت فيهاياه التصغير ولك أن تعوّض فيهما وأمًا قول الشاعر
  ولقد شر بت تمانا وغانيا • وتمان عشرة واثتين وأربعا
  نكان حقه أن يقول ثمانى عسرة وانما حذف الياء على لغة من يقول طوال الايد كماقال
  الناعر
  قطرت بمنصلى فى يعملات • دوامى الايد يخبطن السريحا
  وتعنت الوم أنمتهم بالضم اذا أخذت؟ن أموالهسم وأعمنهم بالكسر اذا كنت ثامنهسم وأثمن
  القوم صار واثمانية وشى مم جعل لٰه غمافية أركان وأنن الرجل اذا وردت ايله غنادهوظم،
  من أظمائها وة ولهم هو أحق من صناحب ضأن ثمانين وذلك أنّ أعرابيا بشر كسرى يبشرى
  سرّبها فقال سلنى ماشئت فقال أسألك ضأناعمانين والثمن عمن المبيع يقال أغنت الزجل
  متاعه وأغنت له وقول زهر
  من لايذاب له شحم السديف اذا • زار الشتاء وعزت أعن البدن
  فن دواه يقح الميم يريدأ كثرها ثمنسا ومن دواه بالضم فهوجع عن مثل زمن وأزمن والنمين
  التمن وهو جز من الثمانية وقال . •
  فألقيت سهمى بينهم حين أوخدوا • فاصارلى فى القسم الاغمينها
  وشئ ثمين أى مر تفع التمن وتمانية اسم موضع والمثمنة كاللاة (تنن، الثنة الشعرات التى
  فى وخررسغ الداية التى أسبلت على أم القردان حتى تكاد ييلغ الارض وابمع الننن وأنشد
  الاصمعى لابعة بن جشم رجل من النمر بن قاسط قال وهو الذى يخلط بشعرمشعر امرئ
  القيس
  لهانتى كفوا فى العقاب • سوديفين اذاتز بئر
  قوله يفسين غسير مهم وزأى يكثرن يقال وفى شعره اذا كثر يقول ليست بصردة لا شعر عليها
  والثنة أيضاما بين السرة والعانة والثن بالمكسر ييس الحشيش وقال المراجز.
  فكفى اللقوح أكلة من ثن
  صل الجيم بن) الجبن هذا الذى يؤكل والجبنة أخص منه والمين أيضاصفة
  لجدان والجبن بضم الجيم والباءلغة فيهما وبعضهم يقول جبنّ وجبنة بالضم والتشديد وقد
