text: "… أنزل الدواء الذي أنزل الداء، قد جاء مثله عنه في أحاديث كثيرة، فمنها ما رواه عمرو بن دينار، عن هلال بن يساف، قال: دخل رسول اللَّه لل على مريض يعوده، فقال: أرْسِلُوا إلى طبيب، فقال قائل: وأنتَ تقولُ ذلك يا …"
