summary:
  ar: "قول لمالك: ولا في القضب ولا في البقول كلها صدقة، ولا في أثمانها إذا بيعت صدقة حتى يحول على أثمانها الحول من يوم بيعها ويقبض صاحبها ثمنها. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.372}"
