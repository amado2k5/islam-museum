text: "… يَزِيدَ، - يَعْنِي ابْنَ أَبِي الزَّرْقَاءِ - قَالَ حَدَّثَنَا أَبِي قَالَ، حَدَّثَنَا سُفْيَانُ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ أَبِيهِ، عَنْ وَائِلِ بْنِ حُجْرٍ، أَنَّ النَّبِيَّ بَعَثَ سَاعِيًا فَأَتَى رَجُلاً فَأَتَاهُ فَصِيلاً مَخْلُولاً فَقَالَ النَّبِيُّ \" بَعَثْنَا مُصَدِّقَ اللَّهِ وَرَسُولِهِ وَإِنَّ فُلاَنًا أَعْطَاهُ فَصِيلاً مَخْلُولاً اللَّهُمَّ لاَ تُبَارِكْ فِيهِ وَلاَ فِي إِبِلِهِ \". فَبَلَغَ ذَلِكَ الرَّجُلَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2458، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2458 (The Book of Zakah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2458، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
