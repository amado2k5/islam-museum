label: { ar: "مسلم 2533 — خيركم قرني", en: "Muslim 2533 — The best of you is my generation" }
text: "سمع عمران بن حصين يحدث أن رسول الله قال: «إن خيركم قرني، ثم الذين يلونهم، ثم الذين يلونهم» — قال عمران: فلا أدري أقال بعد قرنه مرتين أو ثلاثة — «ثم يكون بعدهم قوم يشهدون ولا يستشهدون، ويخونون ولا يؤتمنون، وينذرون ولا يوفون»"
summary:
  ar: "رواية عمران بن حصين في فضائل الصحابة من صحيح مسلم؛ فضل القرن النبوي ومن يليه — نص ترتيب الأجيال الأشهر."
