label: { ar: "مسلم 2533 — خيركم قرني", en: "Muslim 2533 — The best of you is my generation", es: "Musulmán 2533 — Lo mejor de vosotros es mi generación", fr: "Muslim 2533 — Le meilleur d'entre vous est de ma génération", ur: "مسلم 2533 - تم میں سے بہترین میری نسل ہے۔", tr: "Müslim 2533 — Sizin en hayırlınız benim neslimdir.", id: "Muslim 2533 — Yang terbaik di antara kalian adalah generasi saya" }
text: "سمع عمران بن حصين يحدث أن رسول الله قال: «إن خيركم قرني، ثم الذين يلونهم، ثم الذين يلونهم» — قال عمران: فلا أدري أقال بعد قرنه مرتين أو ثلاثة — «ثم يكون بعدهم قوم يشهدون ولا يستشهدون، ويخونون ولا يؤتمنون، وينذرون ولا يوفون»"
summary:
  ar: "رواية عمران بن حصين في فضائل الصحابة من صحيح مسلم؛ فضل القرن النبوي ومن يليه — نص ترتيب الأجيال الأشهر."
  tr: "İmran bin Hüseyin'in Sahih Müslim'de yer alan, Sahabelerin faziletleri hakkındaki rivayeti; Peygamber neslinin ve onu izleyenlerin faziletleri - en meşhur nesillerin sıralaması metni."
  id: "Riwayat Imran bin Husayn tentang keutamaan para Sahabat dari Sahih Muslim; keutamaan generasi Nabi dan generasi setelahnya — teks susunan generasi-generasi yang paling terkenal."
