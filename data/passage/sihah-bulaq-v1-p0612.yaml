  على فعيلة أى يصيب المال والناس منه ضرّ وسقطة أوموت الاصمعىّ هرأ. البرديهرأ.
  هراأى اشتد عليه حتى كاديقت له وهرئ المال بالكسر وهرئ القوم فهم مهروؤن
