  وقد هدأت الرجل أى بعدماسكن الناس بالليل وأتانا وقد هدأت العيون وأتانافلان
  هدوها اذا جاء بعدنومة وبعد هده من الليل وبعد هدأة من الليسل أى بعد هزيع من الليل
