  وملجأمهروئين يلفى به الحيا * اذاجلفت كل هو الام والاب
  يعنى بالحيا الغيث والخصب وأهرأه البردلغة فى هرأه عن الفراء وأهرأما فى الرواح أى أبردنا
  وقال يصف حرا
