text: |-
  ⁦(ف صل العين)⁩
  ١٤٦١
  من عجس القوم يقال مضى عجس من الليل والعجاساء القطعة العظيمة من الابل قال الراعى
  اذابركت منها عجاساءجلة والعجاساء أيضا الظلمة والعجنس الجمل الضخم قال العجاج
  يتبعن ذاهداهدعجنسا والجمع عجانس بح-ذف الثقيلة لانها زائدة وعجسى عن حاجتى
  بعجسنى عجسا أى -بسنى والعجس التبض على الشى وتعجست أمر فلان اذا تعق بته وتتبعته
  يقال نعجست الارض غيون اذا أصابها غيث بعد غيث ومطر عجوس أى منهمر قال رؤية
  أوطف يهدى مسبلا عجوسا وفحل عجيس مثل عجيزوهوالذى لا يلقح وقوله-م لا آتيك
  مجيس عجيس أى أبداو عجيس مصغر قال الشاعر
  فاقسمت لا آتى ابن ضرة طائها ، يعيس عجيس ما أبان لسانى
  ويجيسى مثال خطيبي اسم منسية بطيئة وقال أبو بكر بن السراج عجيساء بالممثال قريثاء
  دس عدس فى الارض أى ذهب يقال عدست به المنية قال السكميت
  أكافها «ول الظلام ولم أزل * أخا الليل معد وساعلى وعادسا
  أى يسارالىّ بالليل وعدس لغة فى حدس والعدس شدة الوطل،والكدح أيضاوجاء
  فى وصف الضبيع عسدوس السرى أى قوية على السير والعدس بالتحريك حب معروف
  والعدسة بثرة تخرج بالانسان وربماقتلت وعدس زجر للبغل قال يزيد بن مفرّغ
  عدس مالعباد عليك إمارة * نجوت وهذا تحملين طليق
  وربماسموا البغل عدس بزجرة قال الشاءر
  اذا حلت برتى على عدس * على الذى بين الحار والفرس * فلا أبالى من غزاومن جلس
  وعدس مثل قثم اسم رجل وهوزرارة بن عدس ⁦(عدبس)⁩ العدبس من الابل وغيرها
  الشديد الموثق الخلق والجمع العدابس قال المكميت بصف صائدا
  حتى غداوغد اله ذوبردة • شن البنان عدبس الاوصال
  ومنه سمى العدبس الاعرابى الكانى رس لعروس نعت يستوى فيه الرجل والمرأة
  ماداما فى اعراسه-مايسال رجل عروس من رجال عرس وامر أة عروس من نساء عرائس
  وفى المثل كاد العروس يكون أميرا والعرس بالكسرامرأة الرجل ولبؤة الاسد
  والجمع اءراس قال الشاعر
  لين هزير مدل عند خيسته * بارقتين له أجرواءراس
  وربماسمى الذكر والانثى عرسين قال علقمة
  حتى تلاقى وقرن الشمس مرتفع * أدحّعِرسين فيه البيض مركوم
  وابن عرس دويبسة تسمى بالفارسية راسو ويجمع على بناتء رس وكذلك ابن آوى وابن
  مخاض وابن ايون وابن ماء يقال بنات آوى وبنات مخاض وبنات لبون وبنات ماءوحكى
  الاخفس بنات عرس وينوء رس وينات نعش وبذونعش والعرسىّ لون من الصمغ شبه
  لون ابن عرس والعرس بالفتح حائط يجمل بين حائطى البيت الشتوى لا يبلغ به اقضاه ثم
  -قف ليسكون البيت أدفأ واغما يفعل ذلك فى البلاد الباردة ويسمى بالفارسية بيجة يقال.
  يت مه رس وذكرأبوعبيد فى تفسيره شيئا آخر غير هذالم يرتضه أبو الغوث والعرس طعام
  الوليمة يذكرويونت قال الراجز
  ١١٦
  جاح
