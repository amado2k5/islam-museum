label: { ar: "جامع الترمذي 183 — ما كرهه الفقهاء، ما لا بأس به", en: "Jami' al-Tirmidhi 183 — what the jurists disliked; what is said to be no harm", ur: "جامع ترمذی 183 — جسے فقہاء نے مکروہ کہا، جس میں کوئی مضائقہ نہیں", fr: "Jami' al-Tirmidhi 183 — ce que les juristes ont réprouvé ; ce qui est dit sans inconvénient", es: "Yami' al-Tirmidhi 183 — lo que los juristas reprobaron; lo que se dice que no tiene inconveniente", tr: "Cami' el-Tirmizi 183 — Fıkıhçıların hoşlanmadığı şeyler, caiz olan şeyler", id: "Jami' al-Tirmidhi 183 — Apa yang tidak disukai oleh para ahli fiqih, apa yang diperbolehkan" }
text: "… عُمَرَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَهُوَ قَوْلُ أَكْثَرِ الْفُقَهَاءِ مِنْ أَصْحَابِ النَّبِيِّ وَمَنْ بَعْدَهُمْ أَنَّهُمْ كَرِهُوا الصَّلاَةَ بَعْدَ صَلاَةِ الصُّبْحِ حَتَّى تَطْلُعَ الشَّمْسُ وَبَعْدَ صَلاَةِ الْعَصْرِ حَتَّى تَغْرُبَ الشَّمْسُ وَأَمَّا الصَّلَوَاتُ الْفَوَائِتُ فَلاَ بَأْسَ أَنْ تُقْضَى بَعْدَ الْعَصْرِ وَبَعْدَ الصُّبْحِ. قَالَ عَلِيُّ بْنُ الْمَدِينِيِّ قَالَ يَحْيَى بْنُ سَعِيدٍ قَالَ شُعْبَةُ لَمْ يَسْمَعْ قَتَادَةُ مِنْ أَبِي الْعَالِيَةِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 183، يرد فيه ذكر ما كرهه الفقهاء، وما لا بأس به، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 183 (The Book on Salat (Prayer)), whose wording mentions what the jurists disliked, what is said to be no harm, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 183، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 183, dont le texte mentionne ce que les juristes ont réprouvé, ce qui est dit sans inconvénient, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 183, cuyo texto menciona lo que los juristas reprobaron, lo que se dice que no tiene inconveniente, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'nin 183 numaralı hadisinde, âlimlerin hoş karşılamadığı, helal olan ve hoş karşılanmayan şeyler sıralanmaktadır. Bu hadis, farz, ibadet, tavsiye edilen, hoş karşılanmayan, haram olan ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 183, menyebutkan apa yang tidak disukai para ulama, apa yang diperbolehkan, dan apa yang tidak disukai. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
