text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف السين الخواص: قوي التجفيف بلا حدّة، ولا حرافة، ولا لذع، ويضمّد به للنزف فيقطعه. الأورام والبثور : يضمّد به الدبيلات والخنازير والصلابات البلغمية والداحس والجرب. آلات المفاصل : ينفع من …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 583، يذكر أسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 583, that mentions named diseases, the organs of the body, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 583 کا اقتباس جس میں بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
