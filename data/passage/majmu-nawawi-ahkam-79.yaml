text: "… إلى وطنه صلاهما وأراق دما. قالا : قال أصحابنا : الدم مستحب لا واجب والله أعلم. وقال إمام الحرمين : صرح الأصحاب بأن هذه الصلاة لو فعلت بعد الرجوع إلى الوطن وتخلل مدة وقعت الموقع ولا تنتهى إلى القضاء والفوات …"
summary:
  ar: "مقطع من المجموع للنووي، ص 79، يرد فيه ذكر الواجب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 79, whose wording mentions the obligatory (wajib), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 79 کا اقتباس جس میں واجب، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 79, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 79, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Mecmu' adlı eserinin 79. sayfasından, farz ve müstehap olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, müstehap olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Majmu' karya al-Nawawi, halaman 79, yang menyebutkan amalan wajib dan anjuran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
