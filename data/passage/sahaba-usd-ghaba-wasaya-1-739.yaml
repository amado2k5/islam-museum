  fr: "Extrait du Usd al-Ghaba d'Ibn al-Athir (tome 1, p. 739) mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 1, sayfa 739'daki bir alıntısında vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsedilmektedir; bu metin, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
