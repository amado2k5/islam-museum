text: "… أول من فتحها. فردَّ الناس وخرَج إليه. وتوفي ابن مسعود بالمدينة سنة اثنتين وثلاثين. وأوصى إلى الزبيرما، ودُفِن بالبقيع، وصلى عليه عثمان، وقيل: صلى عليه عمَّارُ بن ياسر. وقيل: صلى عليه الزبيرُ. ودفنه ليلاً أوصى بذلك، وقيل: لم يعلم عثمان …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 739، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 739, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 739 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
