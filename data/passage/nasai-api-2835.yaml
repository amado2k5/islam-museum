label: { ar: "سنن النسائي 2835 — الأب والأبوة", en: "Sunan al-Nasa'i 2835 — the father and fatherhood", ur: "سنن نسائی 2835 — باپ اور والدیت", es: "Sunan al-Nasa'i 2835 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2835 — le père et la paternité" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ يَزِيدَ الْمُقْرِئُ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، قَالَ قَالَ النَّبِيُّ \" خَمْسٌ مِنَ الدَّوَابِّ لاَ جُنَاحَ فِي قَتْلِهِنَّ عَلَى مَنْ قَتَلَهُنَّ فِي الْحَرَمِ وَالإِحْرَامِ الْفَأْرَةُ وَالْحِدَأَةُ وَالْغُرَابُ وَالْعَقْرَبُ وَالْكَلْبُ الْعَقُورُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2835، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2835 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2835، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2835 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2835 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
