label: { ar: "موطأ مالك 1172 — الواجب", en: "Muwatta Malik 1172 — the obligatory (wajib)", ur: "موطأ مالک 1172 — واجب", fr: "Muwatta de Malik 1172 — l'obligatoire (wajib)", es: "Muwatta de Malik 1172 — lo obligatorio (wajib)" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، أَنَّهُ سَأَلَ ابْنَ شِهَابٍ عَنْ إِيلاَءِ الْعَبْدِ، فَقَالَ هُوَ نَحْوُ إِيلاَءِ الْحُرِّ وَهُوَ عَلَيْهِ وَاجِبٌ وَإِيلاَءُ الْعَبْدِ شَهْرَانِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1172، يرد فيه ذكر الواجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1172 (Divorce), whose wording mentions the obligatory (wajib). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1172، جس کے الفاظ میں واجب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1172, dont le texte mentionne l'obligatoire (wajib). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1172, cuyo texto menciona lo obligatorio (wajib). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
