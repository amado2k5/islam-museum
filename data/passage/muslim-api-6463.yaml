text: "حَدَّثَنِي أَبُو جَعْفَرٍ، مُحَمَّدُ بْنُ الصَّبَّاحِ حَدَّثَنَا حَفْصُ بْنُ غِيَاثٍ، حَدَّثَنَا عَاصِمٌ الأَحْوَلُ، قَالَ قِيلَ لأَنَسِ بْنِ مَالِكٍ بَلَغَكَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ حِلْفَ فِي الإِسْلاَمِ \". فَقَالَ أَنَسٌ قَدْ حَالَفَ رَسُولُ اللَّهِ بَيْنَ قُرَيْشٍ وَالأَنْصَارِ فِي دَارِهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6463، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6463 (The Book of the Merits of the Companions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 6463، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 6463 (El Libro de los Méritos de los Compañeros), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
