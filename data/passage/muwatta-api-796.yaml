label: { ar: "موطأ مالك 796 — الشكوى من العلة، حسم الجرح", en: "Muwatta Malik 796 — a complaint of an ailment; cauterising a wound", ur: "موطأ مالک 796 — بیماری کی شکایت، زخم داغنا" }
text: "… سَعِيدَ بْنَ الْمُسَيَّبِ عَنْ ظُفْرٍ، لَهُ انْكَسَرَ وَهُوَ مُحْرِمٌ فَقَالَ سَعِيدٌ اقْطَعْهُ. وَسُئِلَ مَالِكٌ عَنِ الرَّجُلِ يَشْتَكِي أُذُنَهُ أَيَقْطُرُ فِي أُذُنِهِ مِنَ الْبَانِ الَّذِي لَمْ يُطَيَّبْ وَهُوَ مُحْرِمٌ فَقَالَ لاَ أَرَى بِذَلِكَ بَأْسًا وَلَوْ جَعَلَهُ فِي فِيهِ لَمْ أَرَ بِذَلِكَ بَأْسًا. قَالَ مَالِكٌ وَلاَ بَأْسَ أَنْ يَبُطَّ الْمُحْرِمُ خُرَاجَهُ وَيَفْقَأَ دُمَّلَهُ وَيَقْطَعَ عِرْقَهُ إِذَا احْتَاجَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 796، يذكر الشكوى من العلة، وحسم الجرح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 796 (Hajj), that mentions a complaint of an ailment, cauterising a wound. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 796، جس میں بیماری کی شکایت، زخم داغنا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
