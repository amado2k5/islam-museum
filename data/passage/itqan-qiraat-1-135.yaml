label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 135 — القراء، جمع القرآن والمصاحف", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 135 — the readers; the collection of the Qur'an and the codices", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 135 — قراء، جمعِ قرآن اور مصاحف", es: "Al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, escaneo del volumen 1, pág. 135 — los lectores; la colección del Corán y los códices" }
text: "… مقتل اهل اليمامة فاذا عمر بن الخطاب عنده فقال ابوبكران عمر اتاني فقال ان القتل قد استحجر بقراء القرآن واذي اخشى ان يستجر القتل بالقراء فى المواطن فيذهب كثير من القرآن واني ارئ ان تامر بجمع القرآن فقلت لعمو كيف …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 135، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 135, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 135 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 1, pág. 135, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
