label:
  ar: "ابن ماجه 4107 — يا ابن آدم تفرغ لعبادتي أملأ صدرك غنى"
  en: "Ibn Majah 4107 — Son of Adam, devote yourself to My worship and I shall fill your heart with richness"
  ur: "ابن ماجہ 4107 — اے ابن آدم میری عبادت کے لیے فارغ ہو، میں تیرا سینہ غنا سے بھر دوں گا"
text: "يقول الله سبحانه يا ابن آدم تفرغ لعبادتي أملأ صدرك غنى وأسد فقرك وإن لم تفعل ملأت صدرك شغلا ولم أسد فقرك ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4107: يا ابن آدم تفرغ لعبادتي أملأ صدرك غنى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4107: Son of Adam, devote yourself to My worship and I shall fill your heart with richness. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4107: اے ابن آدم میری عبادت کے لیے فارغ ہو، میں تیرا سینہ غنا سے بھر دوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
