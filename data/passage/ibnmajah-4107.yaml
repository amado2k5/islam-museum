ref: "4107"
label:
  ar: "ابن ماجه 4107 — يا ابن آدم تفرغ لعبادتي أملأ صدرك غنى"
  en: "Ibn Majah 4107 — Son of Adam, devote yourself to My worship and I shall fill your heart with richness"
  ur: "ابن ماجہ 4107 — اے ابن آدم میری عبادت کے لیے فارغ ہو، میں تیرا سینہ غنا سے بھر دوں گا"
  es: "Ibn Majah 4107 — Hijo de Adán, conságrate a mi adoración y yo llenaré tu corazón de riqueza."
  fr: "Ibn Majah 4107 — Fils d'Adam, consacre-toi à Mon adoration et Je comblerai ton cœur de richesses."
  tr: "İbn Majah 4107 — Ey Âdem oğlu, kendini bana ibadete aday, ben de kalbini huzurla doldurayım."
  id: "Ibn Majah 4107 — Wahai anak Adam, curahkanlah dirimu kepada ibadah-Ku, dan Aku akan memenuhi hatimu dengan kepuasan."
text: "يقول الله سبحانه يا ابن آدم تفرغ لعبادتي أملأ صدرك غنى وأسد فقرك وإن لم تفعل ملأت صدرك شغلا ولم أسد فقرك ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4107: يا ابن آدم تفرغ لعبادتي أملأ صدرك غنى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4107: Son of Adam, devote yourself to My worship and I shall fill your heart with richness. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4107: اے ابن آدم میری عبادت کے لیے فارغ ہو، میں تیرا سینہ غنا سے بھر دوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 4107: «Hijo de Adán, dedícate a Mi adoración y Yo llenaré tu corazón de riqueza». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 4107: « Fils d’Adam, consacre-toi à Mon adoration et Je comblerai ton cœur de richesses. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "İbn Mâce Sünen'de 4107 numaralı hadis-i kudsi şöyledir: \"Ey Âdemoğlu, kendini Benim ibadetime ada, ben de kalbini huzurla doldurayım.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 4107: “Wahai anak Adam, curahkanlah dirimu kepada ibadah-Ku, dan Aku akan memenuhi hatimu dengan kepuasan.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
