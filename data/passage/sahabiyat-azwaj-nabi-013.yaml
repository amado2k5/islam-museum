text: "من محمد رسول الله إلى صاحب مصر . أما بعد: فإن الله أرسلني رسولا، وأنزل علي قرآنا، وأمرني بالإعذار والإنذار ومقاتلة الكفار حتى يدينوا بديني، ويدخل الناس في ملتي، وقد دعوتك إلى الإقرار بوحدانيته، فإن فعلت سعدت، وإن أبيت شقيت،"
