label: { ar: "الموطأ 1377 — مالك: نذر المرأة جائز بغير إذن زوجها إذا كان في جسدها ولا يضر زوجها، فإن أضر به فله منعها، ويبقى عليها حتى تقضيه", en: "Muwatta 1377", es: "Muwatta 1377", fr: "Muwatta 1377", ur: "موطا 1377", tr: "El-Muvatta 1377 — Malik: Bir kadının yemini, bedenine ilişkin ise ve kocasına zarar vermiyorsa, kocasının izni olmaksızın caizdir. Eğer kocasına zarar veriyorsa, kocanın onu yerine getirmekten alıkoyma hakkı vardır ve kadın yine de onu yerine getirmekle yükümlüdür.", id: "Al-Muwatta 1377 — Malik: Nazar seorang wanita diperbolehkan tanpa izin suaminya jika nazar tersebut menyangkut tubuhnya dan tidak membahayakan suaminya. Jika nazar tersebut membahayakan suaminya, maka suami berhak mencegahnya untuk melaksanakan nazar tersebut, dan wanita tersebut tetap berkewajiban untuk melaksanakannya." }
summary:
  ar: "يقول مالك إن الأمر عندهم في نذر المرأة أنه جائز عليها بغير إذن زوجها، ويجب عليها ذلك ويثبت إذا كان ذلك في جسدها ولا يضر بزوجها، وإن كان يضر بزوجها فله منعها منه، ويبقى ذلك عليها حتى تقضيه. {cite:muwatta-maruf-1997 p.615}"
  tr: "Malik, onlara göre bir kadının yemininin kocasının izni olmadan da caiz olduğunu ve kadının bu yemini yerine getirmekle yükümlü olduğunu söylüyor. Yemin, kadının bedenini ilgilendiriyorsa ve kocasına zarar vermiyorsa geçerlidir. Eğer kocasına zarar veriyorsa, kocanın onu yeminini yerine getirmekten alıkoyma hakkı vardır ve kadın yeminini yerine getirene kadar yükümlülük devam eder. {cite:muwatta-maruf-1997 s.615}"
  id: "Malik mengatakan bahwa, menurut mereka, nazar seorang wanita diperbolehkan tanpa izin suaminya, dan dia wajib menepatinya. Nazar tersebut sah jika melibatkan tubuhnya dan tidak membahayakan suaminya. Jika membahayakan suaminya, suami berhak mencegahnya menepati nazar tersebut, dan kewajiban tetap ada padanya sampai dia menepatinya. {cite:muwatta-maruf-1997 p.615}"
