label: { ar: "الموطأ 1377 — مالك: نذر المرأة جائز بغير إذن زوجها إذا كان في جسدها ولا يضر زوجها، فإن أضر به فله منعها، ويبقى عليها حتى تقضيه", en: "Muwatta 1377" }
summary:
  ar: "يقول مالك إن الأمر عندهم في نذر المرأة أنه جائز عليها بغير إذن زوجها، ويجب عليها ذلك ويثبت إذا كان ذلك في جسدها ولا يضر بزوجها، وإن كان يضر بزوجها فله منعها منه، ويبقى ذلك عليها حتى تقضيه. {cite:muwatta-maruf-1997 p.615}"
