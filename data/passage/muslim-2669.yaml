label: { ar: "مسلم 2669 — لتتبعن سنن الذين من قبلكم شبراً بشبر", en: "Muslim 2669 — You will follow the ways of those before you" }
text: "قال رسول الله: «لتتبعن سنن الذين من قبلكم شبراً بشبر وذراعاً بذراع، حتى لو دخلوا في جحر ضب لاتبعتموهم» قلنا: يا رسول الله، اليهود والنصارى؟ قال: «فمن؟»"
summary:
  ar: "رواية أبي سعيد الخدري في باب اتباع سنن اليهود والنصارى من كتاب العلم في صحيح مسلم؛ اتباع السنن شبراً بشبر حتى جحر الضب — نص الاتباع الأشهر."
