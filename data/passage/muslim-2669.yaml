label: { ar: "مسلم 2669 — لتتبعن سنن الذين من قبلكم شبراً بشبر", en: "Muslim 2669 — You will follow the ways of those before you", es: "Musulmán 2669 — Seguiréis los caminos de quienes os precedieron.", fr: "Muslim 2669 — Vous suivrez les voies de ceux qui vous ont précédés.", ur: "مسلم 2669 - تم اپنے سے پہلے والوں کے طریقے پر چلو گے۔", tr: "Müslim 2669 — Şüphesiz siz, sizden önce gelenlerin yolunu, adım adım takip edeceksiniz.", id: "Muslim 2669 — Sesungguhnya kamu akan mengikuti jalan orang-orang sebelummu, selangkah demi selangkah." }
text: "قال رسول الله: «لتتبعن سنن الذين من قبلكم شبراً بشبر وذراعاً بذراع، حتى لو دخلوا في جحر ضب لاتبعتموهم» قلنا: يا رسول الله، اليهود والنصارى؟ قال: «فمن؟»"
summary:
  ar: "رواية أبي سعيد الخدري في باب اتباع سنن اليهود والنصارى من كتاب العلم في صحيح مسلم؛ اتباع السنن شبراً بشبر حتى جحر الضب — نص الاتباع الأشهر."
  tr: "Sahih Müslim'in Bilgi Kitabı'ndaki Yahudilerin ve Hristiyanların hadislerine uymak bölümünde Ebu Said el-Hudri'nin rivayeti şöyledir: \"Hadislere adım adım, hatta kertenkelenin yuvasına kadar uyun\" - hadislere uymanın en meşhur örneğidir."
  id: "Riwayat Abu Saeed Al-Khudri dalam bab tentang mengikuti tradisi Yahudi dan Kristen dari Kitab Ilmu dalam Sahih Muslim: Mengikuti tradisi selangkah demi selangkah, bahkan sampai ke lubang kadal — teks yang paling terkenal tentang mengikuti tradisi."
