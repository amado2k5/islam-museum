  tr: "El-Dani'nin \"El-Taysir fi el-Kira'at el-Sab'a\" (Yedi Okumanın Kolaylaştırılması) adlı eserinin 1. cildinin 77. sayfasından, tavsiye edilen amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Bu bölüm, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Dani \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan), Jilid 1, halaman 77, yang menyebutkan amalan-amalan yang dianjurkan; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pembaca yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
