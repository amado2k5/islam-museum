text: "- - الوصل بالسكون لا غير لانه الاصل ووردت الرواية عن الكوفيين وابى عمرو بالوقف على ذلك بالاشارة الى الحركة وسواء كانت اعرابا او بناء والاشارة تكون روما واشماما والباقون لم يأت عنهم فى ذلك شىء واستحباب اكثر شيوخنا من …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 1، ص 77، يرد فيه ذكر المستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 1, p. 77, whose wording mentions the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 1، ص 77 کا اقتباس جس میں مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Taysir fi al-Qira'at al-Sab' de al-Dani, volume numérisé 1, p. 77, dont le texte mentionne le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
