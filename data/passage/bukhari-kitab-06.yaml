summary:
  ar: "القسم 6 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحيض»، ويضم فيها النصوص من 294 إلى 333 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 6 of Sahih al-Bukhari (Menstrual Periods) in the division of the open hadith dataset the museum took its reports from: reports 294 to 333 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 6، عنوان «کتاب الحیض»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 294 تا 333۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 6 de Sahih al-Bukhari (Menstruación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 294 al 333, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 6 du Sahih al-Bukhari (Les Règles menstruelles), soit les hadiths 294 à 333 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
