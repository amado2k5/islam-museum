text: "… عليك أبدا فى شيء، فمر.نا وابعثنا ؛ قبعث حاطب بن أبى بلتعة إلى المقوقس صاحب الإسكندرية، وشجاع بن وهب الأسدى إلى كسرى، وبعد دِحيَة بن خليفة إلى قيصر، وبعث عمرو بن العاص إلى ابنى الجَلَنْدِي أميرى عُمان، ثم ذكر الحديث. …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 96، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 96, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 96 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
