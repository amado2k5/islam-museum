label: { ar: "الموطأ 2140 — يحيى عن مالك: فيمن ارتهن متاعا فهلك عند المرتهن، وأقر من عليه الحق بتسمية الحق، واختلفا في قيمة الرهن: يقال للذي بيده الرهن صفه، فإذا وصفه أحلف عليه، ثم يقيم أهل المعرفة تلك الصفة، فإن كانت القيمة أكثر رد الفضل إلى الراهن، وإن كانت أقل أخذ المرتهن بقية حقه", en: "Muwatta 2140" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول فيمن ارتهن متاعا فهلك المتاع عند المرتهن، وأقر الذي عليه الحق بتسمية الحق، واجتمعا على التسمية، وتداعيا في الرهن، فقال الراهن: قيمته عشرون دينارا، وقال المرتهن: قيمته عشرة دنانير، والحق الذي للرجل فيه عشرون دينارا. قال مالك: يقال للذي بيده الرهن: صفه، فإذا وصفه أحلف عليه، ثم أقام تلك الصفة أهل المعرفة بها. فإن كانت القيمة أكثر مما رهن به، قيل للمرتهن: ارد إلى الراهن بقية حقه. وإن كانت القيمة أقل مما رهن به، أخذ المرتهن بقية حقه من الراهن. وإن كانت القيمة بقدر حقه، فالرهن بما فيه. {cite:muwatta-maruf-1997 p.274} {cite:muwatta-maruf-1997 p.275}"
