label: { ar: "الموطأ 2140 — يحيى عن مالك: فيمن ارتهن متاعا فهلك عند المرتهن، وأقر من عليه الحق بتسمية الحق، واختلفا في قيمة الرهن: يقال للذي بيده الرهن صفه، فإذا وصفه أحلف عليه، ثم يقيم أهل المعرفة تلك الصفة، فإن كانت القيمة أكثر رد الفضل إلى الراهن، وإن كانت أقل أخذ المرتهن بقية حقه", en: "Muwatta 2140", es: "Muwatta 2140", fr: "Muwatta 2140", ur: "موطا 2140", tr: "El-Muvatta 2140 — Yahya, Malik'ten rivayetle: Malları rehin veren ve rehin alanın elindeyken bu malların yok olması durumunda, alacaklı borcunu kabul ederek miktarını belirtmiş, ancak rehin edilen malın değeri konusunda anlaşmazlığa düşmüşlerdir: Rehin alan malın değerini tarif etmesi istenir. Tarif ederse, bu konuda yemin ettirilir. Sonra uzmanlar bu tarifi değerlendirir. Değer daha yüksekse, fazlası rehin verene iade edilir. Daha düşükse, rehin alan kalanını alır.", id: "Al-Muwatta 2140 — Yahya berdasarkan riwayat Malik: Mengenai seseorang yang menggadaikan barang sebagai jaminan dan barang tersebut hilang saat berada di tangan penerima gadai, dan pihak yang berhutang mengakui hutang tersebut dengan menyebutkan jumlah yang harus dibayar, tetapi mereka berselisih mengenai nilai jaminan tersebut: Pihak yang memegang jaminan diminta untuk mendeskripsikannya. Jika ia mendeskripsikannya, ia diminta untuk bersumpah atas hal tersebut. Kemudian, para ahli menilai deskripsi tersebut. Jika nilainya lebih tinggi, kelebihannya dikembalikan kepada pemberi gadai. Jika nilainya lebih rendah, penerima gadai mengambil sisa hutangnya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول فيمن ارتهن متاعا فهلك المتاع عند المرتهن، وأقر الذي عليه الحق بتسمية الحق، واجتمعا على التسمية، وتداعيا في الرهن، فقال الراهن: قيمته عشرون دينارا، وقال المرتهن: قيمته عشرة دنانير، والحق الذي للرجل فيه عشرون دينارا. قال مالك: يقال للذي بيده الرهن: صفه، فإذا وصفه أحلف عليه، ثم أقام تلك الصفة أهل المعرفة بها. فإن كانت القيمة أكثر مما رهن به، قيل للمرتهن: ارد إلى الراهن بقية حقه. وإن كانت القيمة أقل مما رهن به، أخذ المرتهن بقية حقه من الراهن. وإن كانت القيمة بقدر حقه، فالرهن بما فيه. {cite:muwatta-maruf-1997 p.274} {cite:muwatta-maruf-1997 p.275}"
  tr: "Yahya şöyle dedi: Malik'in, rehin olarak mal veren bir kişi hakkında şöyle dediğini işittim: Mallar rehin alanın elindeyken yok oldu. Borçlu olan kişi borcunu kabul etti ve ikisi de miktar konusunda anlaştı. Ancak rehin alanın değeri konusunda anlaşmazlık çıktı; rehin veren, değerinin yirmi dinar olduğunu söylerken, rehin alan ise değerinin on dinar olduğunu söyledi. Adamın alacağı ise yirmi dinardır. Malik dedi ki: Rehin alan kişiye, \"Onu tarif et\" denir. Tarif ederse, yemin ettirilir ve daha sonra bu tarifi bilenler ona bildirilir. Değeri rehin verilen miktardan fazla ise, rehin alana, \"Alacağının kalanını rehin verene iade et\" denir. Değeri rehin verilen miktardan az ise, rehin alan alacağının kalanını rehin verenden alır. Değeri alacağına eşit ise, rehin olduğu gibi kalır. {cite:muwatta-maruf-1997 s.274} {cite:muwatta-maruf-1997 s.275}"
  id: "Yahya berkata: Aku mendengar Malik berkata tentang seseorang yang menggadaikan barang sebagai jaminan, dan barang itu hancur saat berada di tangan penerima gadai, dan orang yang berhutang mengakui hutang tersebut dan mereka berdua sepakat tentang jumlahnya, dan mereka memperdebatkan nilai jaminan tersebut, dengan pemberi gadai berkata: nilainya dua puluh dinar, dan penerima gadai berkata: nilainya sepuluh dinar, dan hutang yang harus dibayar kepada orang itu adalah dua puluh dinar. Malik berkata: Orang yang memegang jaminan diberitahu: gambarkanlah. Jika ia menggambarkannya, ia disuruh bersumpah, dan kemudian orang-orang yang mengetahui deskripsi tersebut dihadirkan kepadanya. Jika nilainya lebih besar dari yang digadaikan, penerima gadai diberitahu: kembalikan kepada pemberi gadai sisa hutangnya. Jika nilainya kurang dari yang digadaikan, penerima gadai mengambil sisa hutangnya dari pemberi gadai. Jika nilainya sama dengan hutangnya, maka jaminan tersebut tetap seperti semula. {kutip:muwatta-maruf-1997 hal.274} {kutip:muwatta-maruf-1997 hal.275}"
