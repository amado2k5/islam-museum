text: "… مائة سنة وسنتين، وكان صحيح المقل، ثابت الفهم، يقضى ويفتى الى حين وفاته. ذكر من اسمه الطيب - - الطيب بن اسماعيل بن ابراهيم بن أبى التراب، أبو محمد الذهلى. ويعرف الصافين بابى حمدون الفصَّاص، واللال. والثقَّاب، وهو أحد القراء …"
summary:
