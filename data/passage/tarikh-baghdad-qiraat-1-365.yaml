  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 1, p. 365, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 1، ص 365 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
