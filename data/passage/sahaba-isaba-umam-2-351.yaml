text: "… وقعة أحد، ثم رجع مع قريش دُجى اللَّيْل حَتَّى نَظَّم الجِزْعِ ثَاقِبُه إلى مكة، ثم خرج إلى الروم فمات بها سنة تسع، ويقال وقال: هو أمدح بيت قيل في الجاهلية. سنة عشر؛ وأعطى هرقل ميراثه لكنانة بن عبد ياليل وقال …"
