label: { ar: "الموطأ 1232 — أبو بكر بن حزم عن عمرة عن عائشة: قالت صفية حاضت، فقال النبي ألم تكن طافت معكن بالبيت؟ فاخرجن", en: "Muwatta 1232" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه عن عمرة بنت عبد الرحمن عن عائشة أنها قالت لرسول الله إن صفية بنت حيي قد حاضت، فقال لعلها تحبسنا، ألم تكن طافت معكن بالبيت؟ قلن بلى، قال فاخرجن. {cite:muwatta-maruf-1997 p.551}"
