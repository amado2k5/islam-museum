label: { ar: "الموطأ 1232 — أبو بكر بن حزم عن عمرة عن عائشة: قالت صفية حاضت، فقال النبي ألم تكن طافت معكن بالبيت؟ فاخرجن", en: "Muwatta 1232", es: "Muwatta 1232", fr: "Muwatta 1232", ur: "موطا 1232", tr: "El-Muvatta 1232 — Ebu Bekr ibn Hazm, Amra'dan, o da Aişe'den rivayetle: Safiyye, \"Adet görmeye başladım\" dedi. Peygamberimiz, \"O seninle birlikte Kâbe'nin etrafında tavaf yapmadı mı?\" dedi. Bunun üzerine dışarı çıktılar.", id: "Al-Muwatta 1232 — Abu Bakr ibn Hazm, dari Amrah, dari Aisyah: Safiyyah berkata, “Aku sudah haid.” Nabi bersabda, “Bukankah dia telah melakukan Tawaf mengelilingi Ka'bah bersamamu?” Maka mereka pun pergi." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه عن عمرة بنت عبد الرحمن عن عائشة أنها قالت لرسول الله إن صفية بنت حيي قد حاضت، فقال لعلها تحبسنا، ألم تكن طافت معكن بالبيت؟ قلن بلى، قال فاخرجن. {cite:muwatta-maruf-1997 p.551}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Hazm'dan, o da babasından, o da Amrah bint Abd al-Rahman'dan, o da Aişe'den rivayet eder ki, Aişe Allah'ın Resulü'ne şöyle dedi: \"Safiyye bint Huyayy adet görmeye başladı.\" Resulullah şöyle buyurdu: \"Belki bizi geciktirir. Sizinle birlikte Kâbe'yi tavaf etmedi mi?\" Onlar, \"Evet,\" dediler. Resulullah şöyle buyurdu: \"Öyleyse gidin.\" {cite:muwatta-maruf-1997 s.551}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Hazm, dari ayahnya, dari Amrah binti Abd al-Rahman, dari Aisyah, bahwa ia berkata kepada Rasulullah, “Safiyyah binti Huyayy telah haid.” Beliau bersabda, “Mungkin ia akan menunda kita. Bukankah ia telah melakukan tawaf di Ka'bah bersama kalian?” Mereka menjawab, “Ya.” Beliau bersabda, “Kalau begitu, pergilah.” {cite:muwatta-maruf-1997 p.551}"
