text: "… أحمد قال ثنا محمد بن اعمد بن الجراح الجر حالى قال ثنا عبد السلام بن مطهر قال ثنا جعفر بن سليمان. قال سمعت مالك بن دينار يقول : إن الشيطان ليلعب بالقراء كما يلعب الصبيان بالجوز. حدثنا أبو بكر محمد …"
summary:
