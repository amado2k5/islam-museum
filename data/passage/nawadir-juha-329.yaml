text: "… أين الحق؟ قالوا لجحا: أين مكان الحقّ؟ فقال: هل من مكان يخلو من وجود الحقِّ؟ حتى يُعيَّن موقعُه."
summary:
  ar: "سُئل جحا أين الحق، فسأل هل يوجد مكان خالٍ من الحق ليحدد موضعه. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  en: "Asked where Truth is, Juha asks whether there is any place empty of Truth so that he might specify its location. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  ur: "جحا سے پوچھا گیا کہ حق کہاں ہے، تو اس نے پوچھا کہ کیا کوئی ایسی جگہ ہے جو حق سے خالی ہو تاکہ وہ اس کا مقام بتا سکے۔ {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  fr: "Interrogé sur le lieu où se trouve la Vérité, Juha demande s'il existe un endroit vide de Vérité afin d'en préciser l'emplacement. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  es: "Al preguntarle dónde está la Verdad, Juha pregunta si hay algún lugar vacío de Verdad para poder precisar su ubicación. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
