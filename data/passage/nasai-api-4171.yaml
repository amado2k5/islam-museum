label: { ar: "سنن النسائي 4171 — ساعة الاحتضار والوفاة", en: "Sunan al-Nasa'i 4171 — a deathbed and last hours", ur: "سنن نسائی 4171 — وقتِ وفات اور آخری لمحات", es: "Sunan al-Nasa'i 4171 — lecho de muerte y últimas horas", fr: "Sunan al-Nasa'i 4171 — Le lit de mort et les dernières heures" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، عَنْ عَبْدِ الرَّحْمَنِ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ يَحْيَى بْنِ هَانِئٍ، عَنْ نُعَيْمِ بْنِ دِجَاجَةَ، قَالَ سَمِعْتُ عُمَرَ بْنَ الْخَطَّابِ، يَقُولُ لاَ هِجْرَةَ بَعْدَ وَفَاةِ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 4171، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4171 (The Book of al-Bay'ah), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 4171، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4171 (El Libro de al-Bay'ah), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4171 (Le Livre d'al-Bay'ah), évoque un lit de mort et les dernières heures. Le navigateur de textes religieux le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
