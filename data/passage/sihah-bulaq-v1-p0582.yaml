text: |-
  ⁦(فصل الزاى)⁩
  ٠٩
  ذات أرائب والارنية طرف الانف وقول الشاعر
  لها أشارير من لحم تمره • من الثعالى ووخز من أرانيها
  يريد التعالب والارانب فلما اضطار واحتاج الى الوزن أبدل من الياءحرف اللين هب).
  رهب بالكسر برهب رهبة ورهبا بالضم ورهبا بالتحريك اى خاف ورجل وهبوت يقال رهبوت
  خير من رجوت أى لأن ترهب خير من أن رحم وتقول أرهبه واسترهبه اذا أحّافه
  والراهب واحدر هبان النصارى ومصدره الرهبة والرهبانية والترهب التعيد قال الاصعى
  الرهب الناقة المهزولة والرهب أيضا النصل الرقيق من نصال السهام والجمع رهاب قال
  الثاعر
  انى سينهى عى وعيدهم * بيض رهاب ومجنا أجد
  والرهاية على وزت السحابة عظم ١ ف الصدر مشرف على البطن مثل اللسان وب ١ و ى غيره من الامهات عنظانت
  روبة اللبن خيرة تلقى فيه من الحامض ليروب وفى المثل شب شوبالدروبته كا يقال احلب
  بالتصغير أى غضروف كانه
  حلبا لك شطره وروية الليل أيضاطائفة منه يقال هرق عنامن روية الليل وروبة الفرس
  طرف لسان المكاب ه مر تضى
  ماؤه فى جمامه تقول أعرنى دوية فرسك والروبة الحماجة تقول فلان لاية وم بروبة أهله أى
  بما أسندوا اليه من حوأ يجهم قال ابن الاعرابى روية الرجل عقله تقول هو يحدثني وأنا
  اذذ النغلام ليست لى روبة وراب اللبن يروب روبا اذاختر وأدرك فهورائب ورق بته وفى المثل
  أهون مظلوم سقاءمروب ٢ أصله السقاءبلف حتى يبلغ أوان المخض والمروب ٣ ا اناء
  الذى يروب فيه اللبن والرائب يكون ما مخض ومالم يمغض قال أبو عبيداذاخثر اللبن فهو
  ٢ ا مظ-لوم اللبن الذى يظلم
  فيشرب قبل أن تخرج زبدته
  وظلت السقاءاذاسقيته قبل
  الرائب فلا يزال ذلكْ اسمه حتى ينزع زبده واسمه على حاله بمنزلة العشراء من الابل هى الحسامل
  ثم تضع فهى اسمها وأنشد الاصمعى"
  سقاك أبوماء زرائبا * ومن لك بالرائب الخائر
  يقول انماسة اك الممخوس ومن لك بالذى لم يخض ولم ينزع زبده وراب الرجل روبا اذا اختلط
  عق-له ورأيه ورأيت فلانارائيا أى مختلطاخاثر! وقوم روبى أى ختراء الانفس مختلطون
  وهم الذين أنختهم السير فاستثقلوانوما ويقال شربوا من الراتب فسكروا قال بشر.
  فاماتيم تيم بن مر • فألفاهم القوم دوبى نياما
  وا<دهم دوبان وقال الاصعى واحدهم رائب مثل ماتق وموقى وهائت وهلكى ( يب
  الريب الشك والريب مارابك من أمى والاسم الريبة بالكسروهى التهمة والشك ورابنى
  فلان اذا رأيت منه مايريبك وتكرهه. وهذيل تقول أرابنى فلان بالالف قال الهذلىً
  يا قوم مالى وأباذؤيب • كنت اذا أتوته من غيب
  شم عطفى ويبزتوبى ، كانى أرته بريب
  وأراب الرجل صارذاريبة فهو مريب وارتاب فيه أى شك واسبتربت به اذارأيت من
  ما يريبك وريب المنون حوادث الدهر والريب الحاجة قال الشاعر
  قضيذا من تهامة كل ريب * وخيبر ثم أجهنا السيوفا
  صل الزا أب) زأب الرجل وازدأب اذاحل ما يطيق وأسرع المشى
  وقال الشاعر وازدأب القربة ثم شمرا وزأب الرجل اذاشرب شرباشديدا ⁦(ذبب)⁩
  الزب الذكر والزب اللعية بلغسة اليمن والزبب طول الشعر وكثرته وبعير أزب ولا يكاديكون
