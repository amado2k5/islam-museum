label: { ar: "سنن النسائي 3406 — الأب والأبوة", en: "Sunan al-Nasa'i 3406 — the father and fatherhood", ur: "سنن نسائی 3406 — باپ اور والدیت" }
text: "أَخْبَرَنَا أَبُو دَاوُدَ، سُلَيْمَانُ بْنُ سَيْفٍ قَالَ حَدَّثَنَا أَبُو عَاصِمٍ، عَنِ ابْنِ جُرَيْجٍ، عَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، أَنَّ أَبَا الصَّهْبَاءِ، جَاءَ إِلَى ابْنِ عَبَّاسٍ فَقَالَ يَا ابْنَ عَبَّاسٍ أَلَمْ تَعْلَمْ أَنَّ الثَّلاَثَ، كَانَتْ عَلَى عَهْدِ رَسُولِ اللَّهِ وَأَبِي بَكْرٍ وَصَدْرًا مِنْ خِلاَفَةِ عُمَرَمَا تُرَدُّ إِلَى الْوَاحِدَةِ قَالَ نَعَمْ."
summary:
  ar: "حديث في سنن النسائي، رقم 3406، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3406 (The Book of Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3406، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
