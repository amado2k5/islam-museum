label: { ar: "الموطأ 2804 — خالد بن معدان مرفوعا: إن الله رفيق يحب الرفق في السفر", en: "Muwatta 2804" }
summary:
  ar: "يروي مالك عن أبي عبيد مولى سليمان بن عبد الملك، عن خالد بن معدان مرفوعا، أن الله رفيق يحب الرفق، ويعين عليه ما لا يعين على العنف. وفيه الأمر بإنزال الدواب منازلها إذا ركبوا، والسير بالليل لأن الأرض تطوى فيه، والنهي عن التعريس على الطريق لأنه طرق الدواب ومأوى الحيات. ويذكر المحقق أن مالكا رواه على وجهين: أحدهما عن سعيد المقبري عن أبيه عن أبي هريرة، والآخر عن سعيد عن أبي هريرة مباشرة، وأن رواية أكثر الرواة ليس فيها «عن أبيه»، ويرى أن الروايتين صحيحتان. ويذكر أن ابن عبد البر ساق في الباب أحاديث عن عبد الله بن مغفل وابن عباس وأنس. {cite:muwatta-maruf-1997 p.575}"
