label: { ar: "الموطأ 2804 — خالد بن معدان مرفوعا: إن الله رفيق يحب الرفق في السفر", en: "Muwatta 2804", es: "Muwatta 2804", fr: "Muwatta 2804", ur: "موطا 2804", tr: "El-Muvatta 2804 — Halid bin Ma'dan, Peygamberimize dayandırılan bir hadiste şöyle buyurmuştur: \"Allah merhametlidir ve yolculukta merhameti sever.\"", id: "Al-Muwatta 2804 — Khalid bin Ma’dan, dalam sebuah hadits yang diriwayatkan dari Nabi: “Allah Maha Baik dan menyukai kebaikan dalam perjalanan.”" }
summary:
  ar: "يروي مالك عن أبي عبيد مولى سليمان بن عبد الملك، عن خالد بن معدان مرفوعا، أن الله رفيق يحب الرفق، ويعين عليه ما لا يعين على العنف. وفيه الأمر بإنزال الدواب منازلها إذا ركبوا، والسير بالليل لأن الأرض تطوى فيه، والنهي عن التعريس على الطريق لأنه طرق الدواب ومأوى الحيات. ويذكر المحقق أن مالكا رواه على وجهين: أحدهما عن سعيد المقبري عن أبيه عن أبي هريرة، والآخر عن سعيد عن أبي هريرة مباشرة، وأن رواية أكثر الرواة ليس فيها «عن أبيه»، ويرى أن الروايتين صحيحتان. ويذكر أن ابن عبد البر ساق في الباب أحاديث عن عبد الله بن مغفل وابن عباس وأنس. {cite:muwatta-maruf-1997 p.575}"
  id: "Malik meriwayatkan dari Abu Ubayd, budak yang dibebaskan oleh Sulayman ibn Abd al-Malik, dari Khalid ibn Ma'dan, dalam sebuah hadits yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya), bahwa Allah Maha Lembut dan mencintai kelembutan, dan Dia memudahkannya dengan cara yang tidak Dia memudahkan kekerasan. Hadits ini mencakup perintah untuk turun dari hewan ketika sedang menungganginya, untuk bepergian di malam hari karena bumi lebih mudah dilalui pada saat itu, dan larangan untuk berhenti bermalam di jalan karena jalan tersebut merupakan jalan bagi hewan dan tempat persembunyian ular. Peneliti mencatat bahwa Malik meriwayatkannya dalam dua cara: satu dari Sa'id al-Maqburi, dari ayahnya, dari Abu Hurayrah; dan yang lainnya dari Sa'id, dari Abu Hurayrah secara langsung. Ia menambahkan bahwa versi sebagian besar perawi tidak menyertakan \"dari ayahnya,\" dan ia menganggap kedua versi tersebut sahih. Ia juga menyebutkan bahwa Ibnu Abd al-Barr memasukkan hadits-hadits tentang topik ini berdasarkan riwayat dari Abdullah ibn Mughaffal, Ibnu Abbas, dan Anas. {cite:muwatta-maruf-1997 p.575}"
