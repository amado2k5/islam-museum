label: { ar: "نوادر جحا الكبرى، ص 113 — «لم أجد وسيلة إلا المشاجرة»", en: "Nawadir Juha al-Kubra, p. 113 — 'I Found No Way but a Quarrel'", ur: "نوادر جحا الکبریٰ، ص 113 — «مجھے جھگڑے کے سوا کوئی راستہ نہ ملا»", fr: "Nawadir Juha al-Kubra, p. 113 — « Je n'ai trouvé d'autre moyen que la dispute »", es: "Nawadir Juha al-Kubra, p. 113 — «No hallé otro medio que la riña»", tr: "Juha'nın Büyük Fıkraları, s. 113 — “Tartışmaktan başka çare bulamadım.”", id: "Anekdot Hebat Juha, hlm. 113 — “Aku tidak menemukan cara lain selain bertengkar.”" }
text: "… لم أجد وسيلة إلاَّ المشاجرة تجادل الشيخُ وامرأتُهُ، فأخذ عصاهُ لِيضرِبها، فهربَتْ إلى دار أحدِ الجيرانِ، وكان هناك عُرْسٌ فتبِعها، وبينما هو في الطريق، صادفه بعضُ أصحابه، وهدَّأَوا روعه، وقالوا له : أنت رجل فاضِلٌ، فلا تعبأ بالنساءِ، لأنَّهُنَّ ناقصاتُ …"
summary:
  ar: "تشاجر جحا مع زوجته وأخذ عصا ليضربها، فهربت إلى عرس عند جار، فهدّأه أصدقاؤه وقالوا إن النساء ناقصات العقل، ودُعي إلى العرس فأكل البقلاوة وقال إن زوجته كانت تعرف إلى أين فرّت، وأخبر الضيوف أنه تشاجر عمداً ليجد عذراً للانضمام إلى الوليمة. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  en: "Juha quarrels with his wife and takes a stick to hit her, and she flees to a neighbour's wedding. Friends calm him and say women lack reason, and he is invited to the wedding. He eats baklava and says his wife knew where she had fled, and he tells the guests that he quarrelled on purpose to have an excuse to join the feast. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  ur: "جحا اپنی بیوی سے جھگڑتا ہے اور اسے مارنے کے لیے لاٹھی اٹھاتا ہے تو وہ بھاگ کر ایک پڑوسی کی شادی میں چلی جاتی ہے۔ دوست اسے ٹھنڈا کرتے ہیں اور کہتے ہیں کہ عورتیں ناقص العقل ہوتی ہیں، اور اسے شادی میں بلایا جاتا ہے۔ وہ بقلاوہ کھاتا ہے اور کہتا ہے کہ بیوی کو معلوم تھا کہ وہ کہاں بھاگی ہے، اور مہمانوں کو بتاتا ہے کہ اس نے دعوت میں شامل ہونے کا بہانہ پانے کے لیے جان بوجھ کر جھگڑا کیا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  fr: "Juha se dispute avec sa femme et prend un bâton pour la frapper, et elle s'enfuit vers le mariage d'un voisin. Ses amis le calment en disant que les femmes manquent de raison, et il est invité à la noce. Il mange du baklava et dit que sa femme savait où elle s'était réfugiée, et il confie aux invités qu'il s'est disputé exprès pour avoir une excuse de se joindre au festin. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  es: "Juha riñe con su esposa y toma un palo para golpearla, y ella huye a la boda de un vecino. Sus amigos lo calman y dicen que las mujeres carecen de juicio, y lo invitan a la boda. Come baklava y dice que su esposa sabía adónde había huido, y cuenta a los invitados que riñó a propósito para tener una excusa para unirse al banquete. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  tr: "Juha karısıyla kavga etti ve onu dövmek için bir sopa aldı, ancak karısı komşunun düğününe kaçtı. Arkadaşları onu sakinleştirerek kadınların zekâdan yoksun olduğunu söylediler. Düğüne davet edildi, baklava yedi ve karısının nereye kaçtığını bildiğini söyledi. Konuklara, ziyafete katılmak için bir bahane bulmak amacıyla kasten kavgayı başlattığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 113}"
  id: "Juha bertengkar dengan istrinya dan mengambil tongkat untuk memukulnya, tetapi istrinya melarikan diri ke pesta pernikahan tetangga. Teman-temannya menenangkannya, mengatakan bahwa wanita kurang cerdas. Ia diundang ke pesta pernikahan, makan baklava, dan mengatakan bahwa istrinya tahu ke mana ia pergi. Ia memberi tahu para tamu bahwa ia sengaja memulai pertengkaran untuk mencari alasan agar bisa bergabung dalam pesta tersebut. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
