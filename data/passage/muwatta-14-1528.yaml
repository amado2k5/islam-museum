label: { ar: "الموطأ 1528 — مالك: لو نكح رجل امرأة في عدتها نكاحا حلالا فأصابها حرمت على ابنه، وألحق الولد بأبيه", en: "Muwatta 1528", es: "Muwatta 1528", fr: "Muwatta 1528", ur: "موطا 1528", tr: "El-Muvatta 1528 — Malik: Bir erkek, helal bir evlilikte bekleme döneminde olan bir kadınla evlenir ve onunla cinsel ilişkiye girerse, o kadın oğluna haram olur ve çocuk babasına nispet edilir.", id: "Al-Muwatta 1528 — Malik: Jika seorang pria menikahi seorang wanita pada masa iddahnya dalam pernikahan yang sah dan melakukan hubungan seksual dengannya, maka wanita tersebut menjadi haram bagi anaknya, dan anak tersebut diriwayatkan kepada ayahnya." }
summary:
  ar: "يقول مالك فلو أن رجلا نكح امرأة في عدتها نكاحا حلالا فأصابها، حرمت على ابنه أن يتزوجها، وذلك أن أباه نكحها على وجه الحلال، لا يقام عليه فيه الحد، ويلحق به الولد الذي يولد فيه بأبيه. وكما حرمت على ابنه أن يتزوجها حين تزوجها أبوه في عدتها وأصابها، فكذلك يحرم على الأب ابنتها إذا هو أصاب أمها. {cite:muwatta-maruf-1997 p.40}"
  tr: "Malik şöyle diyor: Bir erkek, iddet süresi içinde bir kadınla meşru bir evlilik yapmış ve evliliği tamamlamışsa, bu kadın onun oğluna haram olur. Çünkü babası onunla meşru bir evlilik yapmış ve bu yüzden ona herhangi bir ceza uygulanmaz. Bu birliktelikten doğan çocuk meşru sayılır. Babasının iddet süresi içinde onunla evlenip evliliği tamamlaması durumunda oğlunun bu kadınla evlenmesi nasıl haram olduysa, aynı şekilde babası annesiyle evliliğini tamamlamışsa, kızı da babasına haram olur. {cite:muwatta-maruf-1997 s.40}"
  id: "Malik berkata: Jika seorang pria menikahi seorang wanita secara sah selama masa iddahnya dan melakukan hubungan suami istri, maka wanita tersebut haram dinikahi oleh anaknya. Hal ini karena ayahnya menikahinya secara sah, dan tidak akan ada hukuman yang dikenakan kepadanya. Anak yang lahir dari pernikahan ini akan dianggap sah. Sebagaimana anaknya haram menikahi ibunya ketika ayahnya menikahinya selama masa iddahnya dan melakukan hubungan suami istri, demikian pula anak perempuannya haram dinikahi oleh ayahnya jika ia melakukan hubungan suami istri dengan ibunya. {cite:muwatta-maruf-1997 p.40}"
