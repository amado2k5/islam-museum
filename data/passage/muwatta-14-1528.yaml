label: { ar: "الموطأ 1528 — مالك: لو نكح رجل امرأة في عدتها نكاحا حلالا فأصابها حرمت على ابنه، وألحق الولد بأبيه", en: "Muwatta 1528" }
summary:
  ar: "يقول مالك فلو أن رجلا نكح امرأة في عدتها نكاحا حلالا فأصابها، حرمت على ابنه أن يتزوجها، وذلك أن أباه نكحها على وجه الحلال، لا يقام عليه فيه الحد، ويلحق به الولد الذي يولد فيه بأبيه. وكما حرمت على ابنه أن يتزوجها حين تزوجها أبوه في عدتها وأصابها، فكذلك يحرم على الأب ابنتها إذا هو أصاب أمها. {cite:muwatta-maruf-1997 p.40}"
