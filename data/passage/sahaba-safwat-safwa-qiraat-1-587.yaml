text: "… صاحب قرآن وسنة وفرائض. قال أبو المنذر يعلى بن عقيل: كان الأعمش إذا رأى حمزة قد أقبل قال : هذا حَبر القرآن. قال جرير بن عبد الحميد: مر بنا حمزة الزيات فاستسقى، فأتيته بماء. فقال : أنت ممن يحضرنا في …"
