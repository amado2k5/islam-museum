text: |-
  ٢٤٥
  ككسرى على عذانه أوكقبصرا رد شى عرد أى صاب وعسرد النبت بعرد
  عرودا أى طلع وارتفع وكذلك الناب وغيره ومنه قول الراجز
  زى شؤون رأسها العواردا • مضبورة الى شباحدائدا • ضبربراطيل الى جلامدا
  والعرادنيت من الحض قال الساجع الاعراداءردا والعرادة الجرادة الاتى وفلان
  فى عرادة خير أى فى سال خير والعرادة اسم فرس وقال كلهبة
  نسائلف بنوجنم بن بكر • أغزاه العرادة أم جيم
  والعرّادة بااتشديدشئ أصغر من المنجنيق وعردالرجل تعريدا اذا فر والعرندد الصلب وهو
  ملق بسفرجل وحكى سيبويه وترعرند أى غليظ ونظيره من الكلام تزرمج ⁦(عند )⁩ العربدة
  موءالخلق ورجل معر يديؤذى نديمه فى سكره والعر بدمثال سلغد مطق يجرد حل حية تنفخ
  ولا تؤذى زد) عزد المرأة نكمها د) عسد المرأة نكمها والحبل فتله
  عسجد العسجد الذهب وهوأسدما باء من الرباعى بغير حرف ذولق والعسجدية قوله عرزهذه المادسائطة حن يعض
  فى قول الاعشى فالعسجدية فالابواه فالرجسل اسم موضع والعسجدية ركاب الملول
  النسخ حتى من نسخة وانقولى
  ولهذاكتبها القاموس بالحرة
  لكنها نابسة فى مختصر العصاح
  والعاصدمن الابل الذى يلوى عنقه عند الموت نحو حاركه وقد عصدعمودا أى مات
  والعصيدة التى تعصدها بالمسواط فتمرها به قتنقلب ولا ييق فى الاناءمنهائى الا انقلب وقولهم
  للجوابب ومناها فى ذلك عشد اه
