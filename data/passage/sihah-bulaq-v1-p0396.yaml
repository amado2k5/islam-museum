  العضد الساعدوهوعن المرفق الى الكتف وفيه أربع لغات عضدوعضد (١ مثال حذر
  ١ ى بضم الوسط وكسرهمع
  وحذر وعضدوعضد مثال ضعف وضعف ٢ عضدته أعضده بالضم أعنته وكذلك اذا
  فتح الاوّل فيهما اه
  أصبت عضده وعضدت الشجر أعضده بالكسرأى قطعته بالمعضده ومعض ود وعضد
  ٢ :فتح الاول وضهه مع سكون
  بالتحريك ومنه قول الهذلى ضرب المعوّل تحت الديمة العضدا والمعاضدة المعاوثة
  الوسط فيهما اه
  واعتضدت بفسلان أى استعنت به واعتضدت الشئ جعلته فى عضدى والمعضد والمعضاد
  سيف يتهن فى قطع الشجر والمعضد الدهلج والعاضدان سطران من النخل على علج والعاضد
  المل يأخذء ضد الناقة فيتنوخها الاصمعى اذا صار للنخلة جذع بتناول منه المتناول قتلك
  ⁦(٣)⁩ بكسر العين اه وانى
  التخسلة العضيد وبمعهاء ضدان ٣ قال فاذا فاتت اليدفهى جبارة ورجل أعضددقيق
  العضد وعضادى عظيم العضد ويدعضدة اذاقصرت عضدها عن ابن السكيت وأعضاد
  كل شى ما يشد ح واليه من البناء وغيره كاعضاد الحوض وهى حجارة تتصب حول شفيره
  وك ذلك عضادتا الباب وهماخشبتاه من جانبيه والعضد بالضريك داء بأخذ الابل
  فى أعضادها فتبط تقول منعضد البعير بالنكسر قال النابقة
  شك الة ريصة بالمدرى وأنفذها • شك المبيطراذيشفى من العضد
  والمهفد الثوب الذى له علم فى موضع العضد من لابسه قال زهير يصف بقرة
  فجالت على وحشيها وكانها • مسر بلة من رازق معضد
  وابل معضدة. وسومة فى اعضادها والسعة عضاد والمعضدة بكسر الضاد البسرة التى يبسدو
  الترطيب فى أحديانيه او اليعضيد بقلة ٤ هى الطرخشة وق طرد لعطردبشديد
