label: { ar: "الموطأ 1661 — ابن شهاب عن طلحة بن عبد الله بن عوف وأبي سلمة بن عبد الرحمن: طلق عبد الرحمن بن عوف امرأته البتة وهو مريض، فورثها عثمان منه بعد انقضاء عدتها", en: "Muwatta 1661" }
summary:
  ar: "يروي مالك عن ابن شهاب عن طلحة بن عبد الله بن عوف، قال وكان أعلمهم بذلك، وعن أبي سلمة بن عبد الرحمن بن عوف، أن عبد الرحمن بن عوف طلق امرأته البتة وهو مريض، فورثها عثمان بن عفان منه بعد انقضاء عدتها. {cite:muwatta-maruf-1997 p.83}"
