label: { ar: "الموطأ 1661 — ابن شهاب عن طلحة بن عبد الله بن عوف وأبي سلمة بن عبد الرحمن: طلق عبد الرحمن بن عوف امرأته البتة وهو مريض، فورثها عثمان منه بعد انقضاء عدتها", en: "Muwatta 1661", es: "Muwatta 1661", fr: "Muwatta 1661", ur: "موطا 1661", tr: "El-Muvatta 1661 — İbn Şihab, Talha bin Abdullah bin Awf ve Ebu Salama bin Abdul Rahman'dan rivayetle: Abdul Rahman bin Awf, hasta olduğu sırada karısını geri dönülmez bir şekilde boşadı ve Osman, bekleme süresi sona erdikten sonra ondan miras aldı.", id: "Al-Muwatta 1661 — Ibn Shihab, berdasarkan riwayat Talha bin Abdullah bin Awf dan Abu Salama bin Abdul Rahman: Abdul Rahman bin Awf menceraikan istrinya secara mutlak ketika ia sakit, dan Uthman mewarisi hartanya setelah masa iddahnya berakhir." }
summary:
  ar: "يروي مالك عن ابن شهاب عن طلحة بن عبد الله بن عوف، قال وكان أعلمهم بذلك، وعن أبي سلمة بن عبد الرحمن بن عوف، أن عبد الرحمن بن عوف طلق امرأته البتة وهو مريض، فورثها عثمان بن عفان منه بعد انقضاء عدتها. {cite:muwatta-maruf-1997 p.83}"
  tr: "Malik, İbn Şihab'dan, o da Talha ibn Abdullah ibn Awf'tan rivayetle, \"Bu konuda aralarında en bilgili olan oydu\" dediğini ve Ebu Salama ibn Abd al-Rahman ibn Awf'tan rivayetle, Abd al-Rahman ibn Awf'ın hasta iken karısını geri dönülmez bir şekilde boşadığını ve Osman ibn Affan'ın, bekleme süresi sona erdikten sonra ondan miras aldığını nakletmiştir. {cite:muwatta-maruf-1997 s.83}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Talha ibn Abdullah ibn Awf, yang berkata, \"Dia adalah orang yang paling berpengetahuan di antara mereka dalam masalah ini,\" dan dari Abu Salama ibn Abd al-Rahman ibn Awf, bahwa Abd al-Rahman ibn Awf menceraikan istrinya secara mutlak ketika ia sakit, dan Uthman ibn Affan mewarisi hartanya setelah masa iddahnya berakhir. {cite:muwatta-maruf-1997 p.83}"
