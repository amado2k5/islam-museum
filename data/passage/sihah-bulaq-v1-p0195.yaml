text: |-
  ٤٤٧
  ⁦(جس)⁩ الجاموس واحد الجواميس فارسى معرب وجحوس الودئبموده والماءجامس
  أى جامدوالجمسة بالضم البدرة اذا أرطبت وهى بعدصلبة لم تنهضم جنس لإنس
  الضرب من الشى وهو أعمّ من النوع ومنه الجائة والتجنيس وزعم ابن دريد أن الاصعى
  كان يدفع قول العامة هذا مجاتس لهذارية ول انه مولد ⁦( جوس )⁩ الجوس مصدر قولات
  باسواخلال الدبارأى تخلو ها فطلبوا مافيها كمايجوس الرجل الاخيار أى يطلبها وكذلك
  الاجتياس والجوسان بالتدريك الطوقان بالليل
  أيضا ينفه يتعدّى ولا يتعدّى وتحبس على كذا أى حبس نفسه على ذلك والحبسة بالضم
  الاسم من الاحتباس يقال الصمت حبسة وأحبت فرسافى سبيل اللّٰه أى وقفت فهو
  محبس وحبيس والحبس بالضم ما وقف والحبس بالكسر خشب أو عجارة بي فى مجرى الماه
  لتهيس الماءفيشرب منه القوم ويسة وا أموالهم قال الراجز فشمت فيها كعمود الحبس
  والجع أحباس وتسمى مصنعة الماء مبسارحابسا-م أبى الاقرع التميمي ⁦(حدس)⁩
  الحدص الظن والتخمين يقال هو يحدس بالكسر أى يقول شيئا برأيه أبو زيد نحدست
  الاخباروعن الاخباراذاتخبرت عنها وأردت أن تعلها من حيث لا يعلم بك والحدس أيضا
  الذهاب فى الأرض على غير هداية قال الراجز كأنها ن بعد سير حدس وحدست
  فى لبة البعيرأى وجأتها وحدست بسهم رميت يد وحدست برجلى الشى أى وطشته وحدس
  أى صرعه وقال الشاعر ترى من القوم محدوسنا وآخر حاد سا بمعترل شط الجسد
  والحندص الليل الشديد الظلمة حندلس الجندليس من النوق الثقيلة المشى
  ⁦(حرص)⁩ حرسه يحرسه حراسة أى حفظء وتحترست من فلان واحترست منه بهنى أى
  تحففات منه وفى المثل عحترس من مشله وهو حارس، والحرس حوس السلطان وهم الجراس
  الواحدحرمى "لا نمقدمارا-م جنس قنسب اليه ولا نقسل حارس الا أن تذهب به الى معق
  الحراسة دون الجنس والحريسة الشاة تسرق ليلا واحترسها فلان أى مرقها لبلاوهى
  الجرانس وضه حريسة الجبل والحرس الدهر قال الراجز فى نعمة عننابذ الأحرسا(
  ويجمع على أحرس قال امر والفيس . من طلل دائزآيه • تقادم فى سالف الاحوس
  ويقال أحرس فسلان بالمكان أى أقام يه خرساء س لحس والحسيس الصوت انذنى
  وقال اللّٰه تعالى لايسمعون حسيسما والجر أيضا وج-ع بأخذ النسامبعد الولادة ويقال
  أيضا ألحق الجس بالاس معناه ألحق الشى بالشئ أى اذا جالشئ من ناحية فافعل مثله
  والحس أيضا مصدرقولك حس له أى رقه قال القطامى
  أخولة الذى لا غلك الحس نفه • وترفض عند الحفظات الكتائف
  والحس أيضابر ديحرق الكلا والحس بالفتح مصدرة ولان حس البرد الكلا يحسه بالضم
  وحسسناهم أى استأصلناهم قتلاوقال تعالى اذتحونه-م باذنه وحبر البرد الجرادقتاه
  والحسيس القتيل قال الافوه
