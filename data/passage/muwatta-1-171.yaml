label: { ar: "الموطأ 171 — أبو هريرة: لأمرهم بالسواك مع كل وضوء", en: "Muwatta 171", es: "Muwatta 171", fr: "Muwatta 171", ur: "موطا 171", tr: "El-Muvatta 171 — Ebu Hurayra: Çünkü onlara her abdestte misvak kullanmaları emredilmişti.", id: "Al-Muwatta 171 — Abu Hurairah: Karena mereka diperintahkan untuk menggunakan miswak setiap kali berwudhu" }
text: "لولا أن يشق على أمته لأمرهم بالسواك مع كل وضوء"
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف عن أبي هريرة قوله: لولا أن يشق على أمته لأمرهم بالسواك مع كل وضوء؛ وهو في باب ما جاء في السواك. وينقل المحقق عن ابن عبد البر أنه يدخل في المسند لاتصاله من غير وجه ولما يدل عليه لفظه ⁦(التمهيد 7/194)⁩، ويبين أن أكثر الرواة عن مالك رووه بهذا اللفظ الموقوف كرواية يحيى، منهم أبو مصعب وسويد والقعنبي وابن وهب وابن القاسم وقتيبة ويحيى بن بكير، وأن جماعة رووه مرفوعاً، منهم ابن أبي أويس وبشر بن عمر وروح بن عبادة وابن مهدي عند أحمد ⁦(2/460، 517)⁩ وابن خزيمة (140) والنسائي في الكبرى والبيهقي. {cite:muwatta-maruf-1997 p.112} {cite:muwatta-maruf-1997 p.113}"
  tr: "Malik, İbn Şihab'dan, o da Humaid ibn Abdülrahman ibn Avf'tan, o da Ebu Hurayra'dan rivayet etmiştir. Ebu Hurayra şöyle demiştir: \"Eğer ümmetine zorluk çıkarmasaydı, onlara her abdestte misvak kullanmalarını emrederdi.\" Bu, misvakla ilgili rivayetler bölümünde yer almaktadır. Editör, İbn Abdülberr'in, rivayetin çok sayıda isnad zincirine dayanması ve sözcüklerinin anlamı nedeniyle Musned'e dahil edildiğini söylediğini aktarmaktadır (el-Temhid 7/194). Malik'in rivayetine dayanan ravilerin çoğunun, Yahya'nın rivayetine benzer şekilde, bir Sahabenin sözü (mevkuf) olan bu sözcükle rivayet ettiğini açıklamaktadır. Bunlar arasında Ebu Musab, Süveyd, el-Ka'nebi, İbn Vahb, İbn el-Kâsim, Kuteybe ve Yahya ibn Bukayr bulunmaktadır. Ahmed'in (2/460, 517), İbn Huzeyme'nin (140), el-Nesa'i'nin el-Kübra'da ve el-Beyhaki'nin kaydettiği gibi, aralarında İbn Ebî Uveys, Bişr ibn Ömer, Rav ibn Ubâde ve İbn Mehdi'nin de bulunduğu bir grup râvi, bunu Peygamber'in (merfu') bir beyanı olarak nakletmiştir. {cite:muwatta-maruf-1997 s.112} {cite:muwatta-maruf-1997 s.113}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, dari Humaid ibn Abd al-Rahman ibn Awf, dari Abu Hurairah, yang berkata: “Seandainya bukan karena kesulitan yang akan ditimbulkannya pada kaumnya, ia pasti akan memerintahkan mereka untuk menggunakan miswak setiap kali berwudhu.” Hadits ini terdapat dalam bab tentang riwayat-riwayat mengenai miswak. Editor mengutip Ibnu Abd al-Barr yang mengatakan bahwa hadits ini dimasukkan dalam Musnad karena banyaknya sanad dan apa yang ditunjukkan oleh redaksinya (al-Tamhid 7/194). Ia menjelaskan bahwa sebagian besar perawi dari Malik meriwayatkan hadits ini dengan redaksi seperti ini, yang merupakan pernyataan seorang Sahabat (mawquf), mirip dengan riwayat Yahya. Di antara mereka adalah Abu Musab, Suwaid, al-Qa’nabi, Ibnu Wahb, Ibnu al-Qasim, Qutaybah, dan Yahya ibn Bukayr. Sekelompok perawi yang diriwayatkan sebagai pernyataan Nabi (marfu’), antara lain Ibnu Abi Uways, Bishr bin Umar, Rawh bin Ubadah, dan Ibnu Mahdi, sebagaimana dicatat oleh Ahmad (2/460, 517), Ibnu Khuzaymah (140), al-Nasa’i dalam al-Kubra, dan al-Bayhaqi. {kutip:muwatta-maruf-1997 hal.112} {kutip:muwatta-maruf-1997 hal.113}"
