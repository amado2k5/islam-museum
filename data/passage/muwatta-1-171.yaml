label: { ar: "الموطأ 171 — أبو هريرة: لأمرهم بالسواك مع كل وضوء", en: "Muwatta 171" }
text: "لولا أن يشق على أمته لأمرهم بالسواك مع كل وضوء"
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف عن أبي هريرة قوله: لولا أن يشق على أمته لأمرهم بالسواك مع كل وضوء؛ وهو في باب ما جاء في السواك. وينقل المحقق عن ابن عبد البر أنه يدخل في المسند لاتصاله من غير وجه ولما يدل عليه لفظه (التمهيد 7/194)، ويبين أن أكثر الرواة عن مالك رووه بهذا اللفظ الموقوف كرواية يحيى، منهم أبو مصعب وسويد والقعنبي وابن وهب وابن القاسم وقتيبة ويحيى بن بكير، وأن جماعة رووه مرفوعاً، منهم ابن أبي أويس وبشر بن عمر وروح بن عبادة وابن مهدي عند أحمد (2/460، 517) وابن خزيمة (140) والنسائي في الكبرى والبيهقي. {cite:muwatta-maruf-1997 p.112} {cite:muwatta-maruf-1997 p.113}"
