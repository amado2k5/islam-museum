label: { ar: "جامع الترمذي 3015 — المرض والمريض، عيادة المريض", en: "Jami' al-Tirmidhi 3015 — illness and the sick; visiting the sick", ur: "جامع ترمذی 3015 — بیماری اور بیمار، بیمار کی عیادت", es: "Jami' al-Tirmidhi 3015 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Jami' al-Tirmidhi 3015 — la maladie et les malades; rendre visite aux malades", tr: "Cami' el-Tirmizi 3015 — Hastalık ve Hasta, Hasta Ziyareti", id: "Jami' al-Tirmidhi 3015 — Penyakit dan Pasien, Menjenguk Orang Sakit" }
text: "… بْنُ آدَمَ، حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، قَالَ سَمِعْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ مَرِضْتُ فَأَتَانِي رَسُولُ اللَّهِ يَعُودُنِي وَقَدْ أُغْمِيَ عَلَىَّ فَلَمَّا أَفَقْتُ قُلْتُ كَيْفَ أَقْضِي فِي مَالِي فَسَكَتَ عَنِّي حَتَّى نَزَلَتْ : ⁦( يُوصِيكُمُ اللَّهُ فِي أَوْلاَدِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الأُنْثَيَيْنِ )⁩ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ رَوَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3015، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3015 (Chapters on Tafsir), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3015، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3015 (Capítulos sobre Tafsir), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3015 (Chapitres sur le Tafsir), mentionne la maladie et les malades, ainsi que les visites aux malades. Le Répertoire des médicaments le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de yer alan 3015 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3015, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
