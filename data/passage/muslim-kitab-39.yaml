  ar: "صحيح مسلم، كتاب السلام"
  en: "Sahih Muslim, Book 39: The Book of Greetings"
  ur: "صحیح مسلم، کتاب السلام"
  es: "Sahih Muslim, Libro 39: El Libro de los Saludos"
  fr: "Sahih Muslim, Livre 39: Le Livre des Salutations"
summary:
  ar: "القسم 39 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب السلام»، ويضم فيها النصوص من 5646 إلى 5861 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 39 of Sahih Muslim (The Book of Greetings) in the division of the open hadith dataset the museum took its reports from: reports 5646 to 5861 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 39، عنوان «کتاب السلام»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5646 تا 5861۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 39 de Sahih Muslim (El Libro de los Saludos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5646 al 5861, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des salutations), volume 39, correspondant aux hadiths 5646 à 5861 de la base de données ouverte. Il conserve ces hadiths dans ce volume; les éditions imprimées présentent une classification et une numérotation différentes."
