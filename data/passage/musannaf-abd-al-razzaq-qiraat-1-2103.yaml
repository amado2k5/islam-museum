text: "… يغسق على الضراب - عبد الرزاق عن الثوري عن إسماعيل بن عبد الملك قال : كان سعيد بن جبير يَوْمَّنا في شهر رمضان، فكان يقرأ بالقراءتين جميعاً، يقرأُ ليلة بقراءة ابن مسعود، فكان يصلي خمس ترويحات، فإذا كان العشر الأواخر …"
summary:
