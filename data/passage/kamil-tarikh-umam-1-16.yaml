text: "وأبو البَختريّ بن هشام، وحَكيم بن حزام، والحارث بن عامرٍ، وطُعَيمة بن عديّ، والنضر بن الحارث، وزَمَعَة بن الأسود، وأبو جهل، وأميَة بن خَلَف، ونْبَيه، ومُنبّه ابنا الحجّاج، وسُهَيل بن عمرو، وعمرو بن عبد وَدّ. فأقبل رسول الله، ولفي على …"
summary:
