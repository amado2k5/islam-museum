text: "… أعطيك ما شِئْتَ منَ الوعدة طلب إليه أحد أصدقائه نقوداً بالدَين لوعدة. فأجابه : لا أُعطي دراهمي قرضا، وإنَّما أُعطيك، يا صديقي، ما شئت منَ الوعدة. قطعت سعر الفوطة دخلٍ، يوماً، هو وتيمور لنك إلى الحمّام، فسأله تيمورلنك: لو كنْتُ …"
summary:
  ar: "طلب صديق من جحا قرضًا، فلم يعطه مالًا، وقال له إن له ما يشاء من الدعوة، يعني الحلوى. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  en: "A friend asks Juha for a loan; Juha gives him no money but says he may have whatever he wishes of the invitation, meaning sweets. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  ur: "ایک دوست نے جحا سے قرض مانگا؛ جحا نے اسے رقم نہیں دی بلکہ کہا کہ دعوت میں سے جو چاہو لے لو، یعنی مٹھائی۔ {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  fr: "Un ami demande un prêt à Juha; celui-ci ne lui donne pas d'argent mais lui dit qu'il peut prendre ce qu'il veut de l'invitation, c'est-à-dire des sucreries. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  es: "Un amigo le pide un préstamo a Juha; este no le da dinero, pero le dice que puede tomar lo que quiera de la invitación, es decir, dulces. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  tr: "Bir arkadaşı Juha'dan borç istedi, ancak Juha ona para vermeyi reddederek, davetiyede ne isterse alabileceğini, yani tatlıları kastettiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 58}"
  id: "Seorang teman meminta pinjaman kepada Juha, tetapi dia menolak memberikan uang, dan mengatakan bahwa temannya bisa mengambil apa pun yang diinginkannya dari undangan tersebut, yang berarti permen. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
