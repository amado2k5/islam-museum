label: { ar: "الموطأ 1285 — أبو هريرة: الخيل لرجل أجر، ولرجل ستر، وعلى رجل وزر، وبيان أجر من ربطها في سبيل الله", en: "Muwatta 1285" }
text: "الْخَيْلُ لِرَجُلٍ أجْرٌ، وَلِرَجُلٍ سِتْرٌ، وَعلى رَجُلٍ وِزْرٌ"
summary:
  ar: "يروي مالك عن زيد بن أسلم عن أبي صالح السمان عن أبي هريرة أن رسول الله قال الخيل لرجل أجر، ولرجل ستر، وعلى رجل وزر. فأما الذي هي له أجر فرجل ربطها في سبيل الله فأطال لها في مرج أو روضة، فما أصابت في طيلها ذلك من المرج أو الروضة كانت له حسنات، ومن ربطها تغنيا وتعففا ولم ينس حق الله في رقابها وظهورها فهي له ستر، ومن ربطها فخرا ورياء ونواء لأهل الإسلام فهي عليه وزر. {cite:muwatta-maruf-1997 p.571}"
