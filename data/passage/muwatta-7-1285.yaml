label: { ar: "الموطأ 1285 — أبو هريرة: الخيل لرجل أجر، ولرجل ستر، وعلى رجل وزر، وبيان أجر من ربطها في سبيل الله", en: "Muwatta 1285", es: "Muwatta 1285", fr: "Muwatta 1285", ur: "موطا 1285", tr: "El-Muvatta 1285 — Ebu Hurayra: Atlar kimisi için ödül, kimisi için kalkan, kimisi içinse yüktür. Allah yolunda onları bağlayan için ödülün açıklaması.", id: "Al-Muwatta 1285 — Abu Hurairah: Kuda adalah pahala bagi seseorang, perisai bagi orang lain, dan beban bagi orang lainnya lagi. Penjelasan tentang pahala bagi orang yang mengikatnya di jalan Allah." }
text: "الْخَيْلُ لِرَجُلٍ أجْرٌ، وَلِرَجُلٍ سِتْرٌ، وَعلى رَجُلٍ وِزْرٌ"
summary:
  ar: "يروي مالك عن زيد بن أسلم عن أبي صالح السمان عن أبي هريرة أن رسول الله قال الخيل لرجل أجر، ولرجل ستر، وعلى رجل وزر. فأما الذي هي له أجر فرجل ربطها في سبيل الله فأطال لها في مرج أو روضة، فما أصابت في طيلها ذلك من المرج أو الروضة كانت له حسنات، ومن ربطها تغنيا وتعففا ولم ينس حق الله في رقابها وظهورها فهي له ستر، ومن ربطها فخرا ورياء ونواء لأهل الإسلام فهي عليه وزر. {cite:muwatta-maruf-1997 p.571}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ebu Salih el-Samman'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakleder: “Atlar kimisi için mükafat, kimisi için kalkan, kimisi içinse yüktür. Mükafat olan kimse, onları Allah rızası için besleyen ve bir çayırda veya bahçede serbestçe otlatan kimsedir. O çayırda veya bahçede yedikleri her şey onun için sevap vesilesi olur. Onları kendi kendine yeterlilik ve tevazu için besleyen ve boyunları ve sırtları konusunda Allah'ın haklarını unutmayan kimse için ise kalkan olur. Onları kibir, gösteriş ve İslam ehliyle düşmanlık için besleyen kimse için ise yük olur.” {cite:muwatta-maruf-1997 s.571}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari Abu Salih al-Samman, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: “Kuda adalah pahala bagi seseorang, perisai bagi yang lain, dan beban bagi yang lainnya lagi. Adapun orang yang mendapat pahala, yaitu orang yang memeliharanya karena Allah dan membiarkannya merumput bebas di padang rumput atau kebun. Apa pun yang mereka makan di padang rumput atau kebun itu akan menjadi sumber amal kebaikan baginya. Dan orang yang memeliharanya karena rasa cukup dan rendah hati, dan tidak melupakan hak Allah terkait leher dan punggung mereka, maka kuda itu adalah perisai baginya. Dan orang yang memeliharanya karena kesombongan, pamer, dan permusuhan terhadap orang-orang Islam, maka kuda itu adalah beban baginya.” {cite:muwatta-maruf-1997 p.571}"
