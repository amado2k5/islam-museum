label: { ar: "الموطأ 2619 — طاوس اليماني: أدركت ناسا من أصحاب النبي يقولون كل شيء بقدر", en: "Muwatta 2619", es: "Muwatta 2619", fr: "Muwatta 2619", ur: "موطا 2619", tr: "Al-Muwatta 2619 — Tawus al-Yamani: Peygamberimizin bazı sahabelerini tanıyordum ve onlar, \"Her şey ilahi takdirle olmuştur\" diyorlardı.", id: "Al-Muwatta 2619 — Tawus al-Yamani: Aku mengenal beberapa sahabat Nabi yang berkata, \"Segala sesuatu adalah atas kehendak ilahi.\"" }
summary:
  ar: "يروي مالك عن زياد بن سعد عن عمرو بن مسلم عن طاوس اليماني أنه قال: أدركت ناسا من أصحاب رسول الله يقولون: كل شيء بقدر. وسمع طاوس عبد الله بن عمر يقول: قال رسول الله: كل شيء بقدر حتى العجز والكيس، أو الكيس والعجز. {cite:muwatta-maruf-1997 p.480}"
  tr: "Malik, Ziyad ibn Sa'd'dan, o da Amr ibn Muslim'den, o da Tavus el-Yamani'den rivayet eder ki, Tavus el-Yamani şöyle demiştir: \"Allah Resulü'nün bazı Sahabeleriyle görüştüm ve onlar şöyle dediler: Her şey takdire bağlıdır.\" Tavus, Abdullah ibn Ömer'den şöyle bir rivayet işitti: \"Allah Resulü şöyle buyurdu: Her şey takdire bağlıdır, hatta güç ve zayıflık bile.\" {cite:muwatta-maruf-1997 s.480}"
  id: "Malik meriwayatkan dari Ziyad ibn Sa'd, dari 'Amr ibn Muslim, dari Tawus al-Yamani, yang berkata: Aku bertemu dengan beberapa Sahabat Rasulullah yang berkata: Segala sesuatu adalah takdir. Dan Tawus mendengar Abdullah ibn Umar berkata: Rasulullah bersabda: Segala sesuatu adalah takdir, bahkan kelemahan dan kekuatan, atau kekuatan dan kelemahan. {cite:muwatta-maruf-1997 p.480}"
