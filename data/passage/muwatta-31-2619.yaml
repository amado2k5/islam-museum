summary:
  ar: "يروي مالك عن زياد بن سعد عن عمرو بن مسلم عن طاوس اليماني أنه قال: أدركت ناسا من أصحاب رسول الله يقولون: كل شيء بقدر. وسمع طاوس عبد الله بن عمر يقول: قال رسول الله: كل شيء بقدر حتى العجز والكيس، أو الكيس والعجز. {cite:muwatta-maruf-1997 p.480}"
