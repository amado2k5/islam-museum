text: "… : لا بأس بذكر اللّٰه فى ألحلاء فانه يصعد. حدثنا إبراهيم بن عبد اللّٰه ثنا محمد ثنا قتيبة ثنا هشيم عن مغيرة عن إبراهيم. قال : كانوا يكرهون أن يصغروا المصحف، قال وكان يقال : فظموا كتاب اللّٰه. حدثنا محمد …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 230، يرد فيه ذكر ما كان يُكره، وما كرهه الفقهاء، وما لا بأس به، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 230, whose wording mentions what used to be disliked, what the jurists disliked, what is said to be no harm, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 4، ص 230 کا اقتباس جس میں جو ناپسند کیا جاتا تھا، جسے فقہاء نے مکروہ کہا، جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' de Abu Nu'aym, volume numérisé 4, p. 230, dont le texte mentionne ce qui était réprouvé, ce que les juristes ont réprouvé, ce qui est dit sans inconvénient, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen digitalizado 4, p. 230, cuyo texto menciona lo que se reprobaba, lo que los juristas reprobaron, lo que se dice que no tiene inconveniente, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 4. cildinin 230. sayfasından, mekruh edilen, fıkıhçıların mekruh ettiği, helal olan ve mekruh edilen şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 4, halaman 230, yang menyebutkan apa yang tidak disukai, apa yang tidak disukai oleh para ahli hukum, apa yang diperbolehkan, dan apa yang tidak disukai; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
