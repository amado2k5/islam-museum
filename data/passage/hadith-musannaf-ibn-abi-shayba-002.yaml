text: "إلى جدي - وهذا كتابه عندنا -: ((بسم الله الرحمن الرحيم، من محمد رسول الله إلى عمير ذي مران وإلى من أسلم من همدان، سلام عليكم، فإني أحمد إليكم الله الذي لا إله إلا هو، أما بعد ذلك، فإنه بلغنا"
