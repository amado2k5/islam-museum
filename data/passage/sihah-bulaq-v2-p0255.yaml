text: |-
  ٣٣٢
  •⁦(فصل اللام)⁩
  *⁦(لحم)⁩.
  منه لأمت السهم لأما وسهم لام أيضاعليه ريش لؤام قال أبو عبيد ومنه قول أحرئ
  القيس
  نطعنهم سلكى ومخلوجة * لفتك لا مين علي نابل
  ويقال أيضالاً مت الجرح والصدع اذاشددته فالتام وشى لأم أى طتئم مجتمم ولا.ت
  ين القوم ملاءمة اذا أصلحت وجعت واذا اتفق الشيثان فقد التأما ومنه قواهم هذا
  لعام لا يلائمنى ولا تقل لا يلاومنى قانماهذا من اللوم وفى الحديث إيتزوج الرجل لمته من
  الفساء أى شكله ومثله والهاءعوض من الهمزة الذاهبة من وسطه والائم بالكسر الصلح
  والاتفاق بين الناس وأنشد ثعلب
  ادادعيت يوماغير بن غالب • رأيت وجوهاقديين ليمها
  واين الهمزة كمايلين فى الليام جمع اللتيم لتم) اللتم الطعن فى المدر مثل اللتب ⁦(لثم)⁩ لتم
  البعيرالجارة يخفه يلنمها اذا كسرها وخف ملثم يصان الحجارة ويقال أيضالثمت الجارة
  نف المعراذا أصاته وأدمته وخف ملمثوم مثل مريوم واللثم بالضم جع لاثم قال الفراء
  اللنام ما كان على الفم من النقاب واللفام ما كان على الارنية بقال لتمت المرأة تلتم لتما والتنمت
  وتلثمت اذاشدت اللثام وهى حسنة اللثمة واللثم أيضا القبلة وقد لثمت فاها بالكسراذاقبلتها
  وربماجا بالفتح قال ابن كيسان سمعت المبرد ينشد قول بجيل
  فلتمت فاها آخذا بتقرونها * شرب اليزيف يبرد ماء الحشرج
  بالفتح (لجم. اللجام فارسى معرّب واللجام أيضاماتشذه الحائض وفى الحديث تطمى
  أى شدى لحاما وهو شيه بقوله استثفرى وقوله-م جاءفلان وقد لفظ لجامه اذا انصرف من
  اجته مجهودامن الاعياء والعطس كمايقال جاء وقدقرض رباطه وملجم اسم رجل
  م) اللعم مغروف والنحمة أخص منه والجمع لحام ولمان ولحوم وقال :هي وقوما
  رأيتكم بنى الخذواء لما دنا الاضحى وصلات اللمام
  توليتم بودْجكم وقلتم • امكْ منك أقرب أوجذام
  يقول لما أنتنت اللحوممن كثرتها عندكم أعرضتم عنى واللحمة بالضم الة راية ولجهة الشوب قضم
  وتفتح ولحمة البازى ما يطعم عما يصده يضم ويفتح أيضا والملحمة الوقعة العظيمة فى الفتن.
  واستلهم الرجل اذا احتوشه العدوفى القتال والمتلاحة الشجة التى أخذت فى اللعم ولم تبلغ
  السعحاق والملحم جذر من الفياب ويقال أيضارجل ملحم أى مطعم للصيد حر زوق منه
  ولاحت الشئء بالشئ اذا ألصققه به وحبل ملاحم مشدود الفتل والملهم الملصق بالقوم عن
  الاصمعى أبو عبيدة اللعيم القتبل وقد لهم أى قتل وأنشد
  فقالواتركا القوم قد حصروابه • ولاريب أن قد كان ثمّ لحيم
  وقدلحم الرجل بالضم فهو لحيم اذا كان كثير اللحم فى بدنه ولحم بالكسر اشتهى اللحم فهو
  لحم ولات القوم ألحمهم بالنتح فيهما اذا أطعمتهم اللحم فأنالاحم ولا تقل ألت والاصمعى
  يقوله ويقال أيضارجل لاحم ذولحم مثل تاهر ولا بن واللحام الذى يبيع اللحم ولحت العظم
  ألمه بالضم اذاعرقته وقال
  وعامنا أعجبنا -قدمه • يدى أبا السمح وقرضاب سمه• مبتر كالسكل عظم يلحمه.
  ولحم
