label: { ar: "صحيح البخاري 5239 — ما حُرّم", en: "Sahih al-Bukhari 5239 — what was made unlawful", ur: "صحیح بخاری 5239 — جو حرام کیا گیا", es: "Sahih al-Bukhari 5239 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 5239 — ce qui a été déclaré illicite", tr: "Sahih el-Buhari 5239 — Haram Olan Şeyler", id: "Sahih al-Bukhari 5239 — Apa yang dilarang" }
text: "… حَتَّى أَسْأَلَ رَسُولَ اللَّهِ فَجَاءَ رَسُولُ اللَّهِ فَسَأَلْتُهُ عَنْ ذَلِكَ فَقَالَ \" إِنَّهُ عَمُّكِ فَأْذَنِي لَهُ \" قَالَتْ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّمَا أَرْضَعَتْنِي الْمَرْأَةُ وَلَمْ يُرْضِعْنِي الرَّجُلُ. قَالَتْ فَقَالَ رَسُولُ اللَّهِ \" إِنَّهُ عَمُّكِ فَلْيَلِجْ عَلَيْكِ \". قَالَتْ عَائِشَةُ وَذَلِكَ بَعْدَ أَنْ ضُرِبَ عَلَيْنَا الْحِجَابُ. قَالَتْ عَائِشَةُ يَحْرُمُ مِنَ الرَّضَاعَةِ مَا يَحْرُمُ مِنَ الْوِلاَدَةِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5239، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5239 (Wedlock, Marriage (Nikaah)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5239، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5239 (Matrimonio (Nikaah)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5239 (Mariage, Nikah), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 5239 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5239, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
