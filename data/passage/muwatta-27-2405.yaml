label: { ar: "الموطأ 2405 — ربيعة: عمر والرجل الذي وهبته امرأته جارية وأصابها", en: "Muwatta 2405", es: "Muwatta 2405", fr: "Muwatta 2405", ur: "موطا 2405", tr: "Al-Muwatta 2405 — Rabi’ah: Ömer ve karısının kendisine bir cariye verdiği ve onunla cinsel ilişkiye girdiği adam", id: "Al-Muwatta 2405 — Rabi’ah: Umar dan seorang pria yang istrinya memberinya seorang budak perempuan dan dia bersetubuh dengannya" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن عمر بن الخطاب قال لرجل خرج بجارية لامرأته معه في سفر فأصابها، فغارت امرأته فذكرت ذلك لعمر. فقال الرجل: وهبتها لي، فقال عمر: لتأتيني بالبينة أو لأرمينك بالحجارة. فاعترفت امرأته أنها وهبتها له. {cite:muwatta-maruf-1997 p.393}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle, Ömer ibn al-Hattab'ın, karısının cariyesini yanına alıp yolculuğa çıkan ve onunla cinsel ilişkiye giren bir adama şöyle dediğini aktarır: Adamın karısı kıskançlıktan bu durumu Ömer'e anlatmış. Adam, \"Onu bana hediye olarak verdi\" demiş. Ömer, \"Bana delil getir yoksa seni taşlarım\" demiş. Bunun üzerine adam, cariyeyi ona hediye olarak verdiğini itiraf etmiş. {cite:muwatta-maruf-1997 s.393}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa Umar ibn al-Khattab berkata kepada seorang pria yang membawa budak perempuan istrinya bersamanya dalam perjalanan dan bersetubuh dengannya, sehingga istrinya menjadi cemburu dan menceritakan hal ini kepada Umar. Pria itu berkata: \"Dia memberikannya kepadaku sebagai hadiah.\" Umar berkata: \"Bawalah bukti atau aku akan melemparimu dengan batu.\" Maka istrinya mengaku bahwa dia telah memberikannya kepadanya sebagai hadiah. {cite:muwatta-maruf-1997 p.393}"
