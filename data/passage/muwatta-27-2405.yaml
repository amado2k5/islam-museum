summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن عمر بن الخطاب قال لرجل خرج بجارية لامرأته معه في سفر فأصابها، فغارت امرأته فذكرت ذلك لعمر. فقال الرجل: وهبتها لي، فقال عمر: لتأتيني بالبينة أو لأرمينك بالحجارة. فاعترفت امرأته أنها وهبتها له. {cite:muwatta-maruf-1997 p.393}"
