label: { ar: "صحيح مسلم 1186 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 1186 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 1186 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 1186 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 1186 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنِي قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا الْفَزَارِيُّ، عَنْ عُبَيْدِ اللَّهِ بْنِ الأَصَمِّ، حَدَّثَنَا يَزِيدُ بْنُ الأَصَمِّ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" لَعَنَ اللَّهُ الْيَهُودَ وَالنَّصَارَى اتَّخَذُوا قُبُورَ أَنْبِيَائِهِمْ مَسَاجِدَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1186، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1186 (The Book of Mosques and Places of Prayer), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 1186، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 1186 (El Libro de las Mezquitas y Lugares de Oración), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih Muslim, n° 1186 (Le Livre des Mosquées et des Lieux de Prière), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
