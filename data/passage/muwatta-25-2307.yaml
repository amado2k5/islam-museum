label: { ar: "الموطأ 2307 — مالك: لا يجوز للمكاتب أن يقاطع سيده وعليه دين للناس", en: "Muwatta 2307", es: "Muwatta 2307", fr: "Muwatta 2307", ur: "موطا 2307", tr: "El-Muvatta 2307 — Malik: Azat edilmiş bir kölenin, borçlu olduğu kişiler varsa efendisiyle bağını koparması caiz değildir." }
summary:
  ar: "قال مالك: ليس للمكاتب أن يقاطع سيده إذا كان عليه دين للناس فيعتق ولا يبقى له شيء، لأن أهل الدين أحق بماله من سيده، فليس ذلك جائزا له. {cite:muwatta-maruf-1997 p.351}"
  tr: "Malik şöyle demiştir: Özgür bırakılma sözleşmesi olan bir köle, borçlu olduğu kişiler varsa efendisiyle bağlarını koparıp, sonra da hiçbir şey almadan özgür bırakılamaz; çünkü alacaklıların parası üzerinde efendisinden daha büyük hakkı vardır, bu yüzden bu ona caiz değildir. {cite:muwatta-maruf-1997 s.351}"
  id: "Malik berkata: Seorang budak yang memiliki perjanjian pembebasan tidak dapat memutuskan hubungan dengan tuannya jika ia berhutang kepada orang lain, lalu dibebaskan dan pergi tanpa membawa apa pun, karena para kreditur memiliki hak yang lebih besar atas uangnya daripada tuannya, sehingga hal itu tidak diperbolehkan baginya. {cite:muwatta-maruf-1997 p.351}"
