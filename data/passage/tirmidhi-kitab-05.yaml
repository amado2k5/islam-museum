label:
  ar: "جامع الترمذي، أبواب العيدين عن رسول الله"
  en: "Jami' al-Tirmidhi, Book 5: The Book on the Two Eids"
  ur: "جامع ترمذی، ابواب العیدین عن رسول اللہ"
  es: "Jami' al-Tirmidhi, Libro 5: El libro de los dos Eids"
  fr: "Jami' al-Tirmidhi, Livre 5: Le Livre des Deux Aïds"
  tr: "Cami' el-Tirmizi, İki Bayram Hakkındaki Bölümler, Allah Resulü'nün rivayetine göre"
  id: "Jami' al-Tirmidhi, Bab tentang Dua Hari Raya Idul Fitri dan Idul Adha, berdasarkan riwayat Rasulullah SAW."
summary:
  ar: "القسم 5 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «أبواب العيدين عن رسول الله»، ويضم فيها النصوص من 530 إلى 543 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 5 of Jami' al-Tirmidhi (The Book on the Two Eids) in the division of the open hadith dataset the museum took its reports from: reports 530 to 543 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 5، عنوان «ابواب العیدین عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 530 تا 543۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 5 de Jami' al-Tirmidhi (El libro de las dos festividades del Eid) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 530 al 543, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 5 de Jami' al-Tirmidhi (Le Livre des Deux Aïds), correspondant aux hadiths 530 à 543 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanında yer alan Cami' el-Tirmizi'nin 5. bölümü, \"Allah Resulü'nden İki Bayram Hakkındaki Bölümler\" başlığını taşımakta olup, 530 ila 543 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 5 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Bab-bab tentang Dua Hari Raya dari Rasulullah,\" dan berisi teks 530 hingga 543, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
