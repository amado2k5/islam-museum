text: "… دمشق، وحضر والصواب. موت معاوية، فصلّى عليه، وبايع الناس ليزيد، فلما قلتُ: وهي غفلة عجيبة؛ فإن الاختلاف إنما وقع في مات يزيد بن معاوية ثم معاوية بن يزيد دعا الضّحاك إلى اسم التابعي وهو طرفة لا في اسم جدّه، وقول …"
