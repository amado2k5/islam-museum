  tr: "İbn Hişam'ın Peygamber biyografisinden bir pasajda (s. 321), günahların silinmesinden ve suçların ortadan kaldırılmasından bahsedilir; alıntılanan versiyondan ve kaynakların politikasına göre yaklaşık kırk kelimeyle metin aktarılmıştır."
