text: "… وخيانة لأنفسكم، يَأَيُّهَا الَّذِينَ ءَامَنُوا إن أي : فَصْلاً تَتَّقُوا ٱللَّهَ يَجْعَل لَكُمْ فُرْقَانًا وَيُكَفِّرْ عَنكُمْ سَيِّئَاتِكُمْ وَيَغْفِرْ لَكُمّ وَٱللَّهُ ذُو الْفَضْلِ العَظِيمِ بين الحق والباطل؛ لِيُظْهِرَ اللّٰه به حَقَّكُمْ ويطفىء به باطلَ مَنْ خالفكم. ثم ذَكَّر رسُولَ اللّٰه وَلِفِ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 321، يذكر محو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hisham's Sirah, p. 321, that speaks of bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "سیرت ابن ہشام کے صفحہ 321 کا اقتباس جس میں برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
