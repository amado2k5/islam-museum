text: |-
  •اباب الميم).
  ٣٠٩
  طائرهما الاصيعان المتقدّممان المتقابلتان ( غم الطغام أوغاد الناس وأنشدأبو
  العباس * غافضل اللبيب على الطغام* الواحد وابمع فيه سواء والطغام ايضارذال
  الطير الواحدة طغامة للذكر والانى مثل نعامة ونعام عن يعقوب ولا ينطق منه بفعل
  ولا يعرف له اشتقاق (طلم الطلمة بالضم الخبزة وهى التى يسميها الناس الملة وانما الملة اسم
  الحذرة نفسها فأمًا التى تملت فيها فهى الطلة والخبزة والمليل وفى الحديث انه عليه الصلاة
  واللام مر برجل يعالج طلمة لاصابه فى سفر وقدء رق فقال لا يصيبه حرجهم أبدا
  لخم اطلخمّ مثل اطرحمّ واطلخمّ الليل أى اسصنكن وطلخام فى قول لبيد.
  منها وحاف القهراوطلخامها* اسم موضع وحكي عن ثعلب أنه كان يقول هو بالماءغير
  عجمة والطلذام الفيلة والطلخوم الماءالا جن مم ياء السيل فطم الركية أى
  دفنها وسوّاها وكل شي كنرحتى علاوغلب فقدطم دام يقال فوق كل طامة طامة ومن
  عيت القيامة طامّة وطمّ شعره أى جزه وطمّ شعره أيضاطمومااذاعقسه فهو شعر مطموم
  وأطمّ شعره أى حان له أن يطمّ أى يجز واستعمّ مثله قال أبو نصريقال للطاتراذا وقع على
  فصن قد طمم تطميما ومرّبطم بالكسر طميما أى يعد وعدواسهلا قال إلراجز
  حوّزها من برق الغميم • بالحوز والرفق وبالطميم
  ورجل طعطم بالكسرأى فى لسانه عجمة لا يفصح ومنه قول الشاعر
  حزق يمانية لاعجم طمطم* وطمطمانى بالضم من-له والطمّ البحر ويقال باه بالطمّ والرمّ أى
  بالمال السكثير ( هم، فرس مطهم ورجل مطهم قال الاصعى المطهم التاتم كل شئ منه على
  حدته فهو بارع الهال ووجه مطهم أى مجتمع مدورومنه الحديث فى وصف الذى صلى اللّٰه
  عليه وسلم لم يكن بالمعاهم ولا بالمكلثم أى لم يكن بالمدور الوجه ولا بالموجن ولت:ه مسنون
  لوجه ويقال تطهمت الطعام اذا كرهته وما أدرى أىّ الطهم هو وطه-مان اسم وجل
  يم) ابن السكيت طامه اللّٰه على الخير يطيمه أى جبله مثل طائه
  طلما ومظلة وأصله وضع الذي فى غير موضعه ويقال من أشبه أباهة ظلم وفى المثل من استرعى
  الذئب فقد ظلم والظلامة والظليمة والمظلمة ما تطلبه عند الظالم وهواسم ما أخذمنك وتظلمنى
  فلان أى ظلمنى مالى وتظلم منه أى اشتكى ظله ونظالم القوم وظملت فلا نانظايما اذانبته الى
  الظلم فا تطلم أى احتمل التظلم قال زهير
  هوالجواد الذى يعطيك نائله • عفوا ويظلم أحيانا فينظلم
  قوله يظلم أى يسأل فوق طاقته ويروى فيظلم أى يشكلفه وفى افتعل من ظلم ثلاث اذات من
  العرب من يغلب التاءطاءثم يظهر الظاء والطاءجمعافقول اظطلم ومنهسم من يدغم الظاء.
  فى الطافيقول اطلم وهوأ كثر اللغات ومنه-م من يكره أن يدغم الاصلى فى الزائدفة ول اظلم
  وامّا اضطجع ففيه لغتان على ماذ كرفاء والظليم بانتش-ديد الكثير الظلم والظلمسة خلاف النور
  والظلمة بضم اللام لغة فيه والجمع ظلم وظلمات وظلمات قال الراجز
  بجلو بعينيه دحى الظلمات) وقد أظلم الليل وقالوا ما أظلمه وما أضوأه وهوشاذ والظلام أول
