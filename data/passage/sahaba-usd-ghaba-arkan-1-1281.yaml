text: "… ماجه، وأحمد. والثاني: البذاذة من الإيمان أبو داود، وابن ماجه. والثالث: أن النبي صلى على أمه بعد ما دفنت، يعني أم أبي أمامة. أخبرنا يحيى بن محمود إجازة بإسناده إلى ابن أبي عاصم قال: حدثنا عمرو بن علي، أخبرنا عبد …"
summary:
