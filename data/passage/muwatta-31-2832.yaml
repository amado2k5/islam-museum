label: { ar: "الموطأ 2832 — صفوان بن سليم: يكون المؤمن جبانا وبخيلا ولا يكون كذابا", en: "Muwatta 2832", es: "Muwatta 2832", fr: "Muwatta 2832", ur: "موطا 2832", tr: "El-Muvatta 2832 — Safvan ibn Salim: Bir mümin korkak ve cimri olabilir, ama yalancı olmaz.", id: "Al-Muwatta 2832 — Safwan ibn Salim: Seorang mukmin boleh pengecut dan pelit, tetapi ia tidak akan menjadi pendusta." }
summary:
  ar: "يروي مالك عن صفوان بن سليم أنه قيل للنبي: أيكون المؤمن جبانا؟ فقال: نعم. فقيل: أيكون المؤمن بخيلا؟ فقال: نعم. فقيل: أيكون المؤمن كذابا؟ فقال: لا. ويذكر المحقق قول ابن عبد البر أنه لا يحفظه مسندا بهذا اللفظ من وجه ثابت، وأنه حديث حسن. {cite:muwatta-maruf-1997 p.589}"
  tr: "Malik, Safvan ibn Salim'den rivayetle, Peygamberimize şöyle sorulduğunu aktarır: \"Bir mümin korkak olabilir mi?\" Peygamberimiz şöyle cevap vermiştir: \"Evet.\" Sonra ona şöyle soruldu: \"Bir mümin cimri olabilir mi?\" Peygamberimiz şöyle cevap vermiştir: \"Evet.\" Sonra ona şöyle soruldu: \"Bir mümin yalancı olabilir mi?\" Peygamberimiz şöyle cevap vermiştir: \"Hayır.\" Araştırmacı, İbn Abdül-Barr'ın bu hadisin bu şekilde güvenilir bir kaynaktan rivayet edildiğini hatırlamadığını ve bunun sahih bir hadis olduğunu belirttiğini aktarmaktadır. {cite:muwatta-maruf-1997 s.589}"
  id: "Malik meriwayatkan dari Safwan ibn Salim bahwa Nabi ditanya: \"Bisakah seorang mukmin menjadi pengecut?\" Beliau menjawab: \"Ya.\" Kemudian beliau ditanya: \"Bisakah seorang mukmin menjadi pelit?\" Beliau menjawab: \"Ya.\" Kemudian beliau ditanya: \"Bisakah seorang mukmin menjadi pendusta?\" Beliau menjawab: \"Tidak.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa ia tidak ingat hadits ini diriwayatkan dengan redaksi persis seperti ini dari sumber yang terpercaya, dan bahwa hadits ini adalah hadits yang baik. {cite:muwatta-maruf-1997 p.589}"
