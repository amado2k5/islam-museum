summary:
  ar: "يروي مالك عن صفوان بن سليم أنه قيل للنبي: أيكون المؤمن جبانا؟ فقال: نعم. فقيل: أيكون المؤمن بخيلا؟ فقال: نعم. فقيل: أيكون المؤمن كذابا؟ فقال: لا. ويذكر المحقق قول ابن عبد البر أنه لا يحفظه مسندا بهذا اللفظ من وجه ثابت، وأنه حديث حسن. {cite:muwatta-maruf-1997 p.589}"
