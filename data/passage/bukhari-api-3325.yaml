label: { ar: "صحيح البخاري 3325 — نقص قيراط من الأجر كل يوم", en: "Sahih al-Bukhari 3325 — a qirat lost from the reward each day", ur: "صحیح بخاری 3325 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sahih al-Bukhari 3325 — una qirat perdida de la recompensa cada día", fr: "Sahih al-Bukhari 3325 — une qirat perdue pour la récompense chaque jour", tr: "Sahih el-Buhari 3325 — Her gün sevaptan bir kırat (bir ağırlık birimi) düşülür.", id: "Sahih al-Bukhari 3325 — Satu qirat (satuan berat) dikurangi dari pahala setiap hari" }
text: "… بْنُ مَسْلَمَةَ، حَدَّثَنَا سُلَيْمَانُ، قَالَ أَخْبَرَنِي يَزِيدُ بْنُ خُصَيْفَةَ، قَالَ أَخْبَرَنِي السَّائِبُ بْنُ يَزِيدَ، سَمِعَ سُفْيَانَ بْنَ أَبِي زُهَيْرٍ الشَّنَئِيَّ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" مَنِ اقْتَنَى كَلْبًا لاَ يُغْنِي عَنْهُ زَرْعًا وَلاَ ضَرْعًا، نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطٌ \". فَقَالَ السَّائِبُ أَنْتَ سَمِعْتَ هَذَا مِنْ رَسُولِ اللَّهِ قَالَ إِيْ وَرَبِّ هَذِهِ الْقِبْلَةِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3325، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 3325 (Beginning of Creation), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 3325، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3325 (El comienzo de la creación), habla de una qirat que se pierde de la recompensa cada día. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 3325 (Commencement de la Création), mentionne une qirat (unité de mesure) perdue chaque jour pour la récompense. Le Livre des Hasanat et Sayyi'at la recense avec les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "Sahih el-Buhari'de 3325 numaralı hadis, her gün sevabın bir kırat (bir ağırlık birimi) azaldığından bahseder. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesine dahildir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3325, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
