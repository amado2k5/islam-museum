label: { ar: "صحيح البخاري 3325 — نقص قيراط من الأجر كل يوم", en: "Sahih al-Bukhari 3325 — a qirat lost from the reward each day", ur: "صحیح بخاری 3325 — ہر روز اجر سے ایک قیراط کی کمی" }
text: "… بْنُ مَسْلَمَةَ، حَدَّثَنَا سُلَيْمَانُ، قَالَ أَخْبَرَنِي يَزِيدُ بْنُ خُصَيْفَةَ، قَالَ أَخْبَرَنِي السَّائِبُ بْنُ يَزِيدَ، سَمِعَ سُفْيَانَ بْنَ أَبِي زُهَيْرٍ الشَّنَئِيَّ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" مَنِ اقْتَنَى كَلْبًا لاَ يُغْنِي عَنْهُ زَرْعًا وَلاَ ضَرْعًا، نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطٌ \". فَقَالَ السَّائِبُ أَنْتَ سَمِعْتَ هَذَا مِنْ رَسُولِ اللَّهِ قَالَ إِيْ وَرَبِّ هَذِهِ الْقِبْلَةِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3325، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 3325 (Beginning of Creation), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 3325، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
