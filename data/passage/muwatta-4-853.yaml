summary:
  ar: "يرويه مالك أنه بلغه أن عبد الله بن عمر سُئل عن المرأة الحامل إذا خافت على ولدها واشتد عليها الصيام، فقال: تفطر وتطعم مكان كل يوم مسكيناً مداً من حنطة بمد النبي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (811). {cite:muwatta-maruf-1997 p.413}"
