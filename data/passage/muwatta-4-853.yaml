label: { ar: "الموطأ 853 — ابن عمر سُئل عن المرأة الحامل إذا خافت على ولدها واشتد عليها الصيام: تفطر وتطعم عن كل يوم مسكيناً مداً من حنطة بمد النبي", en: "Muwatta 853", es: "Muwatta 853", fr: "Muwatta 853", ur: "موطا 853", tr: "El-Muvatta 853 — İbn Ömer'e, çocuğu için endişelenen ve oruç tutmakta zorlanan hamile bir kadın hakkında soru soruldu: Peygamberin mudd'una göre, her gün orucunu bozup bir fakire bir mudd buğday yedirmelidir.", id: "Al-Muwatta 853 — Ibnu Umar ditanya tentang seorang wanita hamil yang khawatir akan anaknya dan merasa kesulitan berpuasa: dia harus berbuka puasa dan memberi makan orang miskin setiap hari dengan satu mudd gandum, sesuai dengan mudd Nabi." }
summary:
  ar: "يرويه مالك أنه بلغه أن عبد الله بن عمر سُئل عن المرأة الحامل إذا خافت على ولدها واشتد عليها الصيام، فقال: تفطر وتطعم مكان كل يوم مسكيناً مداً من حنطة بمد النبي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (811). {cite:muwatta-maruf-1997 p.413}"
  tr: "Malik, Abdullah ibn Umar'a, çocuğu için endişelenen ve oruç tutmayı çok zor bulan hamile bir kadın hakkında soru sorulduğunu duyduğunu rivayet etmiştir. Abdullah ibn Umar şöyle cevap vermiştir: \"Orucunu bozup, her kaçırdığı gün için fakir birine, Peygamberimizin mudd'u kadar bir mudd (bir ölçü birimi) buğday yedirmelidir.\" Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (811) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.413}"
  id: "Malik meriwayatkan bahwa ia mendengar Abdullah ibn Umar ditanya tentang seorang wanita hamil yang khawatir akan anaknya dan merasa puasa terlalu sulit. Beliau menjawab: \"Hendaknya ia berbuka puasa dan memberi makan orang miskin satu mudd (ukuran volume) gandum, sama seperti mudd Nabi, untuk setiap hari puasa yang terlewatkan.\" Peneliti menyebutkan bahwa Abu Mus'ab (811) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.413}"
