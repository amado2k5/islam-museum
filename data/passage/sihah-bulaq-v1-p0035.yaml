text: |-
  قوله والاى ضبعانة قال ابن
  برى •ذالايعرف نقله محشى
  القاموس ردّا عليه اذتبع
  الجورى
  قوله وهذا الجمع الح وكذا التننية
  ضسبعان بوفظ المذكر للمخفة كما
  جررته فى شرح الدره ١ه محشى
  ٠٦٠٦
  والتصنع تكلف حسن السمت وتصنعت المرأة اذا صنعت نفسها والمدائعة الرشوة وف المثل
  من صائع بالمال لم يحتشم من طلب الحاحة والمصنعة كالجوض يجمع فيه ماء المار و كذلك
  المصنعة بضم النون والمهانع الحصون وصنعاء مدود قصبة اليمن والقسبة اليهاصنعانى على
  غيرقياس كما فالوا فى النسبة الى حرّان حرنانى والى مانى وعانى منانى وعنانى ⁦(صوع)⁩
  صعت الذىّ قا نصاع أى فرّقته فتفرق ومنهة ولهم بصوع الكمىّ أقرانه اذا أناهم من
  نواحبهم والرجل بصوع الابل والنيس يصوع المعزومنه قول الشاعر
  يصوع عنوقها أحوى زنسيم وانصاع أى انفتل راجها ومرّه سرعا والتصوّع التفرق
  قال ذوالرمة نظل بها الاجال عنى تصوّع وتصوع النبات لغة فى تصوح اذاهاج وتصبيع
  م:له والصاع المعامتز من الارض قال المسبب بن علس
  مرحت يداها للياه كأنا • تكدو بكفى لاعب فى صاع
  والصاع الذى يكال به وه وأربعة أمداد والجع أصوع وان شئت أبدات من الواوالمضوعة
  همزة والصواع اغة فى الصاع ويقال حوانا يشرب فيه
  ف ل الضا بع) الضبع العضد والجمع أضباع مثل فرخ وأفراخ وضبعت
  الرجل مددت اليه ضبعى للضرب وقال ولا صلح حتى تضبعونا ونضبعا أى تدّون
  أضياعكم الينايالسيوف وغد أضباعنا اليكم وقال أبوعم روأى نضبعون للصلح والمصافة
  وأماقول روية
  ومانى أيدعلينا تضبع • بما أصبناها وأخرى تطمع
  فانه أراد قد أضباعها علمينا بالدعء قال ابن السكيت يقال قد ضبه والذا العريق أى جملوا
  لنا منه قسما يضبعون قال وضبعت الميل والابل تضبع ضبعا اذا مدّت أضباءها فى سيرها
  وهى اعضادها والناقة ضابع وضبعت تضبيعام:له وقال الاصمعى الضبع أن يهوى مهماذره
  الى عضده وكنا فى ضبع فلان بالضم أى فى كنفه وناحيه والضبع معروفة ولا تقل ضبعة
  لات الذكرضبعان والمع ضباعيز مثل سرحان وسراحين والاى ضبعانة والهع ضبعانات
  وضباع وهذا الجمع للذكر والاننى مثل سبع وسباع والاضطباع الذى يؤمربد الطائف
  بالبيت أن تدخل الرداء من تحت ابطك الا عن وترتطر فه على بسارك وتبدى منكبك الايمن
  وتغطى الايسر وسمى بذلك لا بداء الضبعين وهو التأبط أيضاعن الاصحى وضبعان أمدر
  أى منتفح الجنبين عظيم البطن ويقال هو الذى تترب جنباه كأنه من المدر والتراب
  والضبع أيضا السنة الجدية قال الشاعر
  أبا خراشة اما أنت ذانر • فإن قومى لم تأكاهم الضبع
  والضبع بالتحريك والضبعة شدّة شهرة لناقة للفحل وقد ضبعت بالصكسر تضبع ضبعا
  وأضبعت أيضا بالااف وضبيعة أبوحى من بكروهوضبيعة بزقيس بن تعلبة بن عكاية بن
  صعب بن بكر بن وائل وهم رهط الاعشى ميمون بن قيس وضباعة اسم امرأة ( جع
  ضجع الرحل أى وضع جنبه بالارض يضجع ضمعا وضجو عاذه وضاجع واضطجع مثله وأضجعته
  أنا وفلان حسن الضجعة مثال الركبة والجلسة وفى افتعل منهلغتان من العرب من يقلب
  الماء
