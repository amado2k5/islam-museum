text: "… بفتح الميم فيكون صفة اليوم أى تجمع الناس كما يقال ضحكة للذى يضحك. وقال ابن عباس نزل القرآن بالتثقيل والتفخيم فاقرموها جمعة يعنى بضم الميم. وقال الفراء وابو عبيد : والتخفيف أقيس وأحسن نحو غرفة وغرف وطرفة وطرف وحجرة وحجر. …"
