label: { ar: "صحيح مسلم 6355 — بكاء على ميت أو نياحة وحدودها", en: "Sahih Muslim 6355 — weeping over the dead, or wailing and its limits", ur: "صحیح مسلم 6355 — میت پر رونا، یا نوحہ اور اس کی حدود", fr: "Sahih Muslim 6355 — des pleurs sur un défunt, ou la lamentation et ses limites", es: "Sahih Muslim 6355 — llanto por un difunto, o el lamento y sus límites" }
text: "… وَهْبُ بْنُ جَرِيرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ أُصِيبَ أَبِي يَوْمَ أُحُدٍ فَجَعَلْتُ أَكْشِفُ الثَّوْبَ عَنْ وَجْهِهِ، وَأَبْكِي، وَجَعَلُوا يَنْهَوْنَنِي وَرَسُولُ اللَّهِ لاَ يَنْهَانِي - قَالَ - وَجَعَلَتْ فَاطِمَةُ بِنْتُ عَمْرٍو تَبْكِيهِ فَقَالَ رَسُولُ اللَّهِ \" تَبْكِيهِ أَوْ لاَ تَبْكِيهِ مَا زَالَتِ الْمَلاَئِكَةُ تُظِلُّهُ بِأَجْنِحَتِهَا حَتَّى رَفَعْتُمُوهُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6355، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih Muslim, no. 6355 (The Book of the Merits of the Companions), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح مسلم کی حدیث نمبر 6355، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih Muslim, n° 6355, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih Muslim, n.º 6355, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
