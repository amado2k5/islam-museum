text: "… إنها قِرابُ فأْس كان جحا في طفولتِه يلعب مَعَ الأولاد في مكان خربٍ من البلدة، فوجد رفاقُهُ فردة حذاء، فأخذوا يقلّبونها، ليعلموا ما هي فلم يقدّروا أن يشبهوها بشيء، فحملوها إلى جحا وأروه إيَّاها، فضحك، وقال: يا لكم من أغبياءٍ، …"
summary:
  ar: "وجد جحا الطفل وأصدقاؤه حذاءً غريباً في مكان خرب ولم يستطيعوا تسميته، فضحك جحا وقال إنه قراب فأس. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  en: "As a child Juha and friends find an odd shoe in a ruined place; they cannot name it; Juha laughs and says it is the sheath of an axe. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  ur: "جحا بچپن میں اپنے دوستوں کے ساتھ ایک ویران جگہ میں عجیب سا جوتا پا گیا جس کا نام وہ نہ بتا سکے، تو جحا ہنسا اور بولا کہ یہ کلہاڑی کا غلاف ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  fr: "Enfant, Juha et ses amis trouvent une chaussure étrange dans un lieu en ruine ; ils ne savent pas la nommer ; Juha rit et dit que c'est le fourreau d'une hache. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  es: "De niño, Juha y sus amigos encuentran un zapato extraño en un lugar en ruinas; no saben nombrarlo; Juha ríe y dice que es la funda de un hacha. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  tr: "Çocuk Juha ve arkadaşları yıkık bir yerde garip bir ayakkabı buldular ve adını koyamadılar. Bunun üzerine Juha gülerek bunun bir balta kılıfı olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 165}"
  id: "Juha kecil dan teman-temannya menemukan sepatu aneh di tempat yang hancur dan tidak bisa menyebutkan namanya, jadi Juha tertawa dan berkata itu adalah sarung kapak. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
