label: { ar: "جامع الترمذي 3256 — الأب والأبوة", en: "Jami' al-Tirmidhi 3256 — the father and fatherhood", ur: "جامع ترمذی 3256 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3256 — El padre y la paternidad" }
text: "… أَنْ تَقْتُلُوهُ فَوَاللَّهِ إِنْ قَتَلْتُمُوهُ لَتَطْرُدُنَّ جِيرَانَكُمُ الْمَلاَئِكَةَ وَلَتَسُلُّنَّ سَيْفَ اللَّهِ الْمَغْمُودَ عَنْكُمْ فَلاَ يُغْمَدُ إِلَى يَوْمِ الْقِيَامَةِ قَالَ فَقَالُوا اقْتُلُوا الْيَهُودِيَّ وَاقْتُلُوا عُثْمَانَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. وَقَدْ رَوَاهُ شُعَيْبُ بْنُ صَفْوَانَ عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ عَنِ ابْنِ مُحَمَّدِ بْنِ عَبْدِ اللَّهِ بْنِ سَلاَمٍ عَنْ جَدِّهِ عَبْدِ اللَّهِ بْنِ سَلاَمٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3256، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3256 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3256، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3256 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
