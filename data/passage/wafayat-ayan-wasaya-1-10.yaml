text: "… أعلم. وكان ملكاً جواداً عادلاً متمسكاً بالشرع المطهر، يأمر بالمعروف وينهى عن المنكر كما ينبغي من غير مُحَاباة ويصلي بالناس الصلوات الخمس، ويلبس الصوف، ويقف للمرأة وللضعيف ويأخذ لهم بالحق. وأوصى أن يدفن على قارعة الطريق ليترحّم عليه مَن يمر …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 10، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 10, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 10 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
