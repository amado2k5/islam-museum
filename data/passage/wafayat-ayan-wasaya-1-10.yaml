text: "… أعلم. وكان ملكاً جواداً عادلاً متمسكاً بالشرع المطهر، يأمر بالمعروف وينهى عن المنكر كما ينبغي من غير مُحَاباة ويصلي بالناس الصلوات الخمس، ويلبس الصوف، ويقف للمرأة وللضعيف ويأخذ لهم بالحق. وأوصى أن يدفن على قارعة الطريق ليترحّم عليه مَن يمر …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 10، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 10, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 10 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Wafayat al-A'yan de Ibn Khallikan, volumen 1, pág. 10, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Wafayat al-A'yan d'Ibn Khallikan (tome 1, p. 10) mentionnant un testament ou des adieux, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Hallikan'ın *Vafayat el-A'yan* adlı eserinin 1. cildinin 10. sayfasından bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsetmektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari *Wafayat al-A'yan* karya Ibn Khallikan, Volume 1, halaman 10, menyebutkan wasiat atau surat wasiat terakhir, pemakaman, kuburan, dan makam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
