text: "… الرَّحْمَنِ بْنُ مُحَمَّدٍ، قَالاَ حَدَّثَنَا إِسْحَاقُ، - وَهُوَ الأَزْرَقُ - عَنْ عَوْفٍ، عَنْ مُحَمَّدٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" مَا مِنْ مُسْلِمَيْنِ يَمُوتُ بَيْنَهُمَا ثَلاَثَةُ أَوْلاَدٍ لَمْ يَبْلُغُوا الْحِنْثَ إِلاَّ أَدْخَلَهُمَا اللَّهُ بِفَضْلِ رَحْمَتِهِ إِيَّاهُمُ الْجَنَّةَ \". قَالَ \" يُقَالُ لَهُمُ ادْخُلُوا الْجَنَّةَ فَيَقُولُونَ حَتَّى يَدْخُلَ آبَاؤُنَا فَيُقَالُ ادْخُلُوا الْجَنَّةَ أَنْتُمْ وَآبَاؤُكُمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1876، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1876 (The Book of Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1876، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
