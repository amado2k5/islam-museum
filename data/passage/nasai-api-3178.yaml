label: { ar: "سنن النسائي 3178 — الأب والأبوة", en: "Sunan al-Nasa'i 3178 — the father and fatherhood", ur: "سنن نسائی 3178 — باپ اور والدیت", es: "Sunan al-Nasa'i 3178 — El padre y la paternidad" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ إِدْرِيسَ، قَالَ حَدَّثَنَا عُمَرُ بْنُ حَفْصِ بْنِ غِيَاثٍ، عَنْ أَبِيهِ، عَنْ مِسْعَرٍ، عَنْ طَلْحَةَ بْنِ مُصَرِّفٍ، عَنْ مُصْعَبِ بْنِ سَعْدٍ، عَنْ أَبِيهِ، أَنَّهُ ظَنَّ أَنَّ لَهُ، فَضْلاً عَلَى مَنْ دُونَهُ مِنْ أَصْحَابِ النَّبِيِّ فَقَالَ نَبِيُّ اللَّهِ \" إِنَّمَا يَنْصُرُ اللَّهُ هَذِهِ الأُمَّةَ بِضَعِيفِهَا بِدَعْوَتِهِمْ وَصَلاَتِهِمْ وَإِخْلاَصِهِمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3178، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3178 (The Book of Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3178، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3178 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
