text: "… التاريخ. كل هذه الأنواع من العلوم كانت تتخللها الفكاهة التي بثها الجاحظ بين الفينة والأخرى، مما جعل كتابه بغية كل قارئ، فإن أراد الشعر وجده من أغنى الكتب الحافلة بالشعر، وإن أراد معرفة معلومات دقيقة عن البشر أو أحد الحيوانات …"
