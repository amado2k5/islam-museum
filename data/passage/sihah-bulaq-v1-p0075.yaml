text: |-
  ٥٦٦
  أى ارتفع ورجل ممغط أى طو يل كأنه متمدا من طوله والتمغط فى عد والفرس أن يمد
  ضبعيه قط) قال الفراء الماقط من البعير مثل الرازم وقد مقط يمقط مقوطاأى هزل
  هز الاشديدا والماقط الحازى الذى ينكهن ويطرق بالحصى وتقول العرب فلان ساقط
  ابن ماقط بن لاقط تتساب بذلك فالساقط عبد الماقط والماقط عبداللاقط واللاقطعيد معتق
  نقلته من كتاب من غير سماع والمقاط حبل منل القماط مقلوب منه ⁦(ملط)⁩ رج-ل
  أملط بين الملطوه ومثل الاحرط قال الشاءر
  طبيخ غحاز أوطبيخ أميهة * دقيق العظام سي القشم أملط
  وكان الاحنف بن قيس أملط قال أبو عبيدة سه-م أملط مش_ل أصرط وأملعات الناقة أى
  ألقت جنينها قبسل أن يشعر والجنين مليط والملط الذى لايه رف له نسب يقال غلام ملط خلط
  وهو المختلط النسب والملاط الجنب وابنساملاط عضدا البعبر والملاط الطين الذى يجعل بين
  سافى البنا يملطبه الحائط والملطى مشل المرطى من العدويقال مضى فلان الى موضع كذا
  فيقال جعله اللّٰه ملطى لاعهدة أى لارجعة له والملطى شجة بينها وبين العظم قشرة رقيقة
  وملطية بلد ⁦(مبط)⁩ ماطف حكمه بيط مبطا أى جاروماط أى بعد وذهب والمبط والمباط
  الدفع والزجريقال القوم فى هياط ومياط قال الفرّاء تمايط القوم أى تياءدواوفسند
  ما بينهسم وحكى أبو عبيد مطت عنه وأمطت اذا تحيت عنه قال وكذلك معات غسيرى
  وأمطته أى نحبته وقال الاصمعى معت أنا وأمطت غيرى أميطه ومنه اماطة الاذى عن
  الطريق
  صل النون بط) نبط الماء ينبط وينبط نبوط انبع وأنبط المذ اربلغ المساء والاستنباط
  الاستخراج والنبط والنبيط قوم ينزلون بالبطائح بيز العراقين والمع أنباط يقال رجل نبطى
  ونباطىّ ونباط مشل عن ويمانى ويمان وحكى بعة وب نباطى أيضابضم النون وقد استنبط
  الرجل وف كلام أيوب بن القترية أهل عمان عرب استنبطوا وأهل البحرين نبيط استعربوا
  والنبيط الماء الذى ينبط من قعو البتراداحفرت وقال الشاعر
  قريب تراهما شال سدوّه * له بطاعند الهوان قطوب
  ويقال للركية هى نبط اذا أميهت والنبطة بالضم بساض يكون تحت ابط الفرس وبطف
  بقال فرس أنبط بين النبط قال ذو الرومة
  كاون الحسان الانبط البطن قائما • تمايل عنه الحل واللون أشقر
  وشاة بطاءيضاء الشاكلة ط ط الشى تنوط اسكن وتتطته سكنته وشط الشئ يده
  غمزه ط لنحيط الزفير وقد غحط ينحط بالمكسر قال اسامة الهذلى
  من المربعين ومن آزل • اذاجته الليل كالناحط
  ⁦( نخط)⁩ غخطه من أنفه وانتخطه أى رمى به مثل مخطه ومنه قول الشاهر
  نخطن يذمان المصف الازارق وقولهم ما أدرى أى النخط هو بالضم أى أى الناس هو
  ⁦( نشط)⁩ نقط الرجل ينشط نشاط ا بالفتح فهونشيط وتنشط لامر كذا وتنشطت الناقة
  فى سيرها وذلك اذاشدت وأنشط القوم اذا كانت دوابهم نشيطة وأنشطه الكلاً أى ممن
  والنشيطة
