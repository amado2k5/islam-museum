text: |-
  ٢٢٧
  متقارب الثفنات ضيق زوره • رحب اللبان شديد طى ضريس
  وقد فرق بين الزور واللبان كماترى والزورأيضا الزائرون يقال رحسل زاروة وم زور وزوار
  مثل سافروسفروسفارونسوة زور أيضا وزور مثل نوم ونقح وزاترات والزور بالتحريك الميل
  وهومثل الصعر والزور فى صدر الفرس دخول احدى الفهدتين وخروج الاخرى والزورا.
  اسم مال كان لأحيدة بن الحلاح الانصارى وقال فيه
  انى أقيم على الزورا أعمسرها • إن الكريم على الاخوان ذوالمال
  والزوراء البئر البعيدة القعر قال الشاعر
  اذتجعل الجارفى زورا. مظلمة • زلخ المقسام وتطوى دونه المرسا
  وأرض زورا بعيدة قال الاعشى
  يسق ديار الهاقد أ صبحت غرضا • زورا. أجنف عنها القود والرسل
  والزوراء القدح قال النابفة
  وتق اذا ماشقت غير مصرد • بزوراء فى سافاتها المك كانع
  ويقال للقوص زوراء لياها والجيش أزور ودجلة يغداد تسمى الزوراء والازورار عن الشئ
  العدول عنه وقد ازور عنه ازوراراوازوار عنه ازوير اراوتزاورعنه تزاوراكله بمعنى عدل
  عنه واغرف وقركى تزاور عن كفهم وهومدغم تتزاوروزرنه أزوره زورا وزيارة وزوارة أيضا
  -كاه الكسائى والزورة المزة الواحدة والزورة البعد وهو من الازورارقال الشاعر
  وماءوردت على ذورة • كشى السبنتى يراح الشفيفا
  وأزاره حله على الزيارة واستزاره ستأله أن يزوره وتزاوروازار بعضهم بعضا وازدارافتعل
  من الزيارة وقال أبوكبير وازدرت من دار الكريم المفضل
  والتزوير تزيين الكذب
  رزقرت الشئ حسفته وقومته ومنه قول الجاج امر ؤزورنف ← أى قومها والتزوير كرامة
  الزار والمزار الزيارة والمزار موضع الزيارة والزير من الرجال الذى يحب محادثة النساء
  ومجمالستهن سمى بذلك لكثرة زيارتهلهن والمسع الزيرة والزير من الاوتار الدقيق ١
  والزيار ما يزير بدالبيطار الداية أى يلوى بهحفلته قال أبو عمسر والزوارحبل مجع-ل بين
  التصدير والحقب والمع أزورة والزور مثال الهجف السير الشديد قال القطامى
  ياناق خي خييازورًا • وقلبى منسمكك المغبرًا
  هر زهرة الدنيا بالتسكين غضارتها وحستها وزهرة النبات أيضانوره وكذلت ا رة :
  بالتحريك والزهسرة بالسم البياض عن يعسقوب بقال أزهر بين الزهرة وهو بساض عدق
  وزهرة أيضاح من قريش وهوامم احرأة كلاب بن عرة بن كعب بن لوى بن غالب بن فهر.
  نسب ولده اليهادهم أخوال النبيّ صلى اللّٰه عليه وسلم والزهرة بفتح الهاءنجم قال الرابز
  قد وكلتنى طلتى بالسمسره • وأيقطتن لطلوع الزهره
  وزهرت النارزهورا أضاءت وأزهرتم.ا أنا يقال زهرت بك نارى أى قويت بك وكثرت مثل
  وريت بك زنادى والازهر النيرويسمى القمر الازهر ابن السكيت الازهران الشهس والقمر
  ورجل أزهراى آسض مشرق الوجه والمرآة زهراء ويسى النور الوحشى أزهر والبقرةvVv
  ١ و لزير الكتان عن يحقوب
  اه من نسخة زيادة فى الاصل
