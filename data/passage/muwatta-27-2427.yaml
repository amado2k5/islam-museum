label: { ar: "الموطأ 2427 — مالك: أمة المرأة التي ليست من خدمها لا قطع عليها في متاع سيدتها", en: "Muwatta 2427", es: "Muwatta 2427", fr: "Muwatta 2427", ur: "موطا 2427", tr: "Al-Muwatta 2427 — Malik: Bir kadının hizmetçilerinden olmayan cariyesi, efendisinin mallarına el koymaktan sorumlu değildir.", id: "Al-Muwatta 2427 — Malik: Seorang budak perempuan yang bukan pelayan majikannya tidak bertanggung jawab untuk memotong barang-barang milik majikannya." }
summary:
  ar: "قال مالك: وكذلك أمة المرأة إذا كانت ليست بخادم لها ولا لزوجها ولا ممن تأمن على بيتها، ثم دخلت سرا فسرقت من متاع سيدتها ما يجب فيه القطع، فلا قطع عليها. {cite:muwatta-maruf-1997 p.402}"
  tr: "Malik şöyle demiştir: Benzer şekilde, bir kadının cariyesi ne ona ne de kocasına hizmet eden biri değilse, ne de ev işlerini emanet ettiği biriyse ve gizlice girip efendisinin eşyalarından uzuv kesmeyi gerektirecek bir şey çalarsa, o zaman uzuv kesme cezasına tabi değildir. {cite:muwatta-maruf-1997 s.402}"
  id: "Malik berkata: Demikian juga, jika seorang budak perempuan bukan pelayan baginya atau suaminya, atau bukan seseorang yang dipercayanya untuk mengurus rumah tangganya, lalu masuk secara diam-diam dan mencuri sesuatu dari barang-barang majikannya yang pantas dihukum amputasi, maka dia tidak dikenai hukuman amputasi. {cite:muwatta-maruf-1997 p.402}"
