  ar: "قال مالك: وكذلك أمة المرأة إذا كانت ليست بخادم لها ولا لزوجها ولا ممن تأمن على بيتها، ثم دخلت سرا فسرقت من متاع سيدتها ما يجب فيه القطع، فلا قطع عليها. {cite:muwatta-maruf-1997 p.402}"
