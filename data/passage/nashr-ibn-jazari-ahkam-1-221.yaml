text: "… حسن الاداء فرض في القراءة. ويجب على القاريء ان يتلو القران حق تلاوته صيانة للقرآن عن ان يجد اللحنُ والتغيير اليه سبيلا على ان العلماء قد اختلفوا في وجوب حسن الاداء في القرآن فبعضهم ذهب الى ان ذلك متصور على …"
