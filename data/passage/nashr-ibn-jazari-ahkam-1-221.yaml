text: "… حسن الاداء فرض في القراءة. ويجب على القاريء ان يتلو القران حق تلاوته صيانة للقرآن عن ان يجد اللحنُ والتغيير اليه سبيلا على ان العلماء قد اختلفوا في وجوب حسن الاداء في القرآن فبعضهم ذهب الى ان ذلك متصور على …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 221، يرد فيه ذكر الفرض، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 221, whose wording mentions the obligatory (fard), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 221 کا اقتباس جس میں فرض، وجوب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Nashr fi al-Qira'at al-'Ashr de Ibn al-Jazari, volume numérisé 1, p. 221, dont le texte mentionne l'obligatoire (fard), l'obligation (wujub), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
