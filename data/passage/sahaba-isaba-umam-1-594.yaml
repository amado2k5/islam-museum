text: "حرف الجيم. وهاجر إلى الحَبشة فأسلم النجاشي ومن تبعه على يديه، وأقام جعفر عنده، ثم هاجر منها إلى المدينة فقدم والنبيّ وَليم بِخَيْبَرَ؛ وكلّ ذلك مشهور في المغازي بروايات متعددة صحيحة وروى البَغَوِيُّ وأبْنُ السَّكَنِ من طريق محمد بن عبد …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 594، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
