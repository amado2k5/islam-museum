text: "… من أشراف قريش ؟ قالا : عتبة بن ربيعة، وشيبة بن ربيعة، وأبو البخترى بن هشام، وحكيم بن حزام، ونوفل بن خويلد، والحارث بن عامر بن نوفل، وطعيمة بن عدى بن نوفل، والنضر بن الحارث، وزمعة بن الأسود، وأبو جهل …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 6، ص 313، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 6, p. 313, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 6، ص 313 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
