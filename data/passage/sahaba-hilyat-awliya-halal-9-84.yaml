text: "… فى حلال الدنيا خونا من شدة الحساب إذ سئلوا عن الشكر فلم يؤدوا الشكر على قدر النهم، وفرقة من الخائفين زهدوا فى الحرام خونا من حلول النقمة،فزهد اخطائفين ترك الحرام البين. وزهدالورعين ترك كل شبهة، وزهد المتوكلين ترك الاضطراب فيما …"
summary:
