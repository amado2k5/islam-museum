text: "… الله، وأن ما أمرك اللّٰه به ونهاك عنه؛ فرضٌ عليك قبوله، فإن اللّٰه أمرك بطاعة رسوله، وقبول سُنَّته؛ لأن اللّٰه عَيَل إنما ذكر فرائضه وأوامره بخطاب أجمله، وكلام اختصره وأدرجه، دعا خلقه إلى فرائض ذكر أسماءها، وأمر نبيه بأن يُبيِّن …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 4، ص 69، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض، وطاعة الله ورسوله، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 4, p. 69, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard), obedience to God and His Messenger, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 4، ص 69 کا اقتباس جس میں فریضہ اور فرائض، جو لوگوں پر فرض کیا گیا، فرض، اللہ اور اس کے رسول کی اطاعت، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volume numérisé 4, p. 69, dont le texte mentionne l'obligation (farida), ce qui a été imposé aux gens, l'obligatoire (fard), l'obéissance à Dieu et à Son Messager, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volumen digitalizado 4, p. 69, cuyo texto menciona la obligación (farida), lo que se impuso a la gente, lo obligatorio (fard), la obediencia a Dios y a Su Mensajero, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı), Resimli Cilt 4, sayfa 69'dan bir alıntı; farz olan görevler, insanlar için farz kılınanlar, farzın kendisi, Allah'a ve Resulüne itaat ve itaat konularını ele almaktadır; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Iman, Jilid 4 Bergambar, hlm. 69, yang menyebutkan kewajiban-kewajiban wajib, apa yang dianjurkan bagi manusia, kewajiban itu sendiri, ketaatan kepada Allah dan Rasul-Nya, dan ketaatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk kewajiban-kewajiban wajib, perbuatan-perbuatan taat, perbuatan-perbuatan yang dianjurkan, perbuatan-perbuatan yang tidak disukai, perbuatan-perbuatan yang dilarang, dan dosa-dosa kecil."
