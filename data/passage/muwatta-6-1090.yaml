label: { ar: "الموطأ 1090 — جابر بن عبد الله عن النبي: كان إذا وقف على الصفا يكبر ثلاثاً ويقول: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، ويدعو، ويصنع مثل ذلك على المروة", en: "Muwatta 1090" }
summary:
  ar: "يرويه مالك عن جعفر بن محمد عن أبيه عن جابر بن عبد الله، أن رسول الله كان إذا وقف على الصفا يكبر ثلاثاً، ويقول: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، يصنع ذلك ثلاث مرات ويدعو، ويصنع على المروة مثل ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1312) وإسحاق الطباع وسويد وغيرهم. {cite:muwatta-maruf-1997 p.500}"
