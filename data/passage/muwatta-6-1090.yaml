label: { ar: "الموطأ 1090 — جابر بن عبد الله عن النبي: كان إذا وقف على الصفا يكبر ثلاثاً ويقول: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، ويدعو، ويصنع مثل ذلك على المروة", en: "Muwatta 1090", es: "Muwatta 1090", fr: "Muwatta 1090", ur: "موطا 1090", tr: "El-Muvatta 1090 — Cabir ibn Abdullah, Peygamber'den rivayetle: Safa'da durduğunda üç defa \"Allahu Ekber\" der ve şöyle derdi: \"Allah'tan başka ilah yoktur, O tektir, ortağı yoktur. Mülk ve övgü O'nundur ve O her şeye kadirdir.\" Sonra dua ederdi ve aynı şeyi Merve'de de yapardı.", id: "Al-Muwatta 1090 — Jabir bin Abdullah, berdasarkan riwayat Nabi: Ketika beliau berdiri di Safa, beliau mengucapkan \"Allahu Akbar\" tiga kali dan berkata: \"Tidak ada Tuhan selain Allah, Yang Maha Esa, tanpa sekutu. Milik-Nya kekuasaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu.\" Kemudian beliau berdoa, dan beliau melakukan hal yang sama di Marwa." }
summary:
  ar: "يرويه مالك عن جعفر بن محمد عن أبيه عن جابر بن عبد الله، أن رسول الله كان إذا وقف على الصفا يكبر ثلاثاً، ويقول: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، يصنع ذلك ثلاث مرات ويدعو، ويصنع على المروة مثل ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1312) وإسحاق الطباع وسويد وغيرهم. {cite:muwatta-maruf-1997 p.500}"
  tr: "Malik, Cafer ibn Muhammed'den, o da babasından, o da Cabir ibn Abdullah'tan rivayet ettiğine göre, Allah Resulü Safa'da durduğunda üç defa \"Allahu Ekber\" der, sonra da \"Allah'tan başka ilah yoktur, O tektir, ortağı yoktur. Mülk ve övgü O'nundur ve O her şeye kadirdir.\" derdi. Bunu üç defa yapıp dua ederdi ve aynı şeyi Merve'de de yapardı. Editör, bunun Malik'ten Ebu Mus'ab (1312), İshak el-Tabba', Suveyd ve diğerleri tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.500}"
  id: "Malik meriwayatkannya dari Ja'far bin Muhammad, dari ayahnya, dari Jabir bin Abdullah, bahwa ketika Rasulullah SAW berdiri di Safa, beliau mengucapkan \"Allahu Akbar\" tiga kali, kemudian mengucapkan: \"Tidak ada Tuhan selain Allah, Yang Maha Esa, tanpa sekutu. Milik-Nya kekuasaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu.\" Beliau melakukan ini tiga kali dan berdoa, dan beliau melakukan hal yang sama di Marwa. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1312), Ishaq al-Tabba', Suwaid, dan lainnya. {cite:muwatta-maruf-1997 p.500}"
