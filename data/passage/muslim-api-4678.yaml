label: { ar: "صحيح مسلم 4678 — مضاعفة الأجر", en: "Sahih Muslim 4678 — the reward doubled or multiplied", ur: "صحیح مسلم 4678 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… قَالَ ذَلِكَ \". قَالَ قُلْتُ نَاسٌ مِنْ أَصْحَابِكَ. قَالَ \" كَذَبَ مَنْ قَالَ ذَلِكَ بَلْ لَهُ أَجْرُهُ مَرَّتَيْنِ \". ثُمَّ أَرْسَلَنِي إِلَى عَلِيٍّ وَهُوَ أَرْمَدُ فَقَالَ \" لأُعْطِيَنَّ الرَّايَةَ رَجُلاً يُحِبُّ اللَّهَ وَرَسُولَهُ أَوْ يُحِبُّهُ اللَّهُ وَرَسُولُهُ \". قَالَ فَأَتَيْتُ عَلِيًّا فَجِئْتُ بِهِ أَقُودُهُ وَهُوَ أَرْمَدُ حَتَّى أَتَيْتُ بِهِ رَسُولَ اللَّهِ فَبَسَقَ فِي عَيْنَيْهِ فَبَرَأَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4678، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4678 (The Book of Jihad and Expeditions), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4678، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
