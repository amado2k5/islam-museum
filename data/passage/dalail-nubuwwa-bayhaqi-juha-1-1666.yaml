text: "إسحاق، قال : حدثنا عاصم بن عُمر بن قتادة، عن شيخ من بني قريظة، أنه قال : هل تدري عمَّا كان إسلامُ ثعلبة وأسيد ابنيْ سعيّة وأسد بن عبيد نفَرٍ من هَزَل، لم يكونوا من بني قريظة، ولا نضير كانوا …"
