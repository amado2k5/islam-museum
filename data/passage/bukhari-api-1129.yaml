label: { ar: "صحيح البخاري 1129 — ما فُرض على الناس، ما تُرك خشية أن يُفرض", en: "Sahih al-Bukhari 1129 — what was made obligatory on people; what was left for fear it would be made obligatory", ur: "صحیح بخاری 1129 — جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا", fr: "Sahih al-Bukhari 1129 — ce qui a été imposé aux gens ; ce qui fut délaissé de crainte qu'il ne devienne obligatoire", es: "Sahih al-Bujari 1129 — lo que se impuso a la gente; lo que se dejó por temor a que se hiciera obligatorio" }
text: "… عَائِشَةَ أُمِّ الْمُؤْمِنِينَا أَنَّ رَسُولَ اللَّهِ صَلَّى ذَاتَ لَيْلَةٍ فِي الْمَسْجِدِ فَصَلَّى بِصَلاَتِهِ نَاسٌ، ثُمَّ صَلَّى مِنَ الْقَابِلَةِ فَكَثُرَ النَّاسُ، ثُمَّ اجْتَمَعُوا مِنَ اللَّيْلَةِ الثَّالِثَةِ أَوِ الرَّابِعَةِ، فَلَمْ يَخْرُجْ إِلَيْهِمْ رَسُولُ اللَّهِ، فَلَمَّا أَصْبَحَ قَالَ \" قَدْ رَأَيْتُ الَّذِي صَنَعْتُمْ وَلَمْ يَمْنَعْنِي مِنَ الْخُرُوجِ إِلَيْكُمْ إِلاَّ أَنِّي خَشِيتُ أَنْ تُفْرَضَ عَلَيْكُمْ \"، وَذَلِكَ فِي رَمَضَانَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1129، يرد فيه ذكر ما فُرض على الناس، وما تُرك خشية أن يُفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 1129 (Prayer at Night (Tahajjud)), whose wording mentions what was made obligatory on people, what was left for fear it would be made obligatory. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 1129، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 1129, dont le texte mentionne ce qui a été imposé aux gens, ce qui fut délaissé de crainte qu'il ne devienne obligatoire. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 1129, cuyo texto menciona lo que se impuso a la gente, lo que se dejó por temor a que se hiciera obligatorio. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
