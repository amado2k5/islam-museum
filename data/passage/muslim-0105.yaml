text: "قال رسول الله: «لا يدخل الجنة قتات» — سمعه حذيفة فجهر به لرجل يوصف برفع الأشياء إلى السلطان"
summary:
  ar: "رواية حذيفة بن اليمان في كتاب الإيمان من صحيح مسلم؛ أمسكه حذيفة عن لسانه فلما رأى رجلاً يُرفع إلى السلطان أخبار الناس أسمعه إياه ليُصلح."
