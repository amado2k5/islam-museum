label: { ar: "الموطأ 445 — إسباغ الوضوء على المكاره وكثرة الخطا إلى المساجد وانتظار الصلاة: فذلكم الرباط", en: "Muwatta 445", es: "Muwatta 445", fr: "Muwatta 445", ur: "موطا 445", tr: "El-Muvatta 445 — Zorluklara rağmen abdesti eksiksiz almak, mescitlere çokça gidip gelmek ve namazı beklemek: İşte gerçek ibadet budur.", id: "Al-Muwatta 445 — Melakukan wudhu dengan sempurna meskipun menghadapi kesulitan, menempuh banyak langkah menuju masjid, dan menunggu waktu salat: itulah ibadah yang sejati." }
text: "إسباغ الوضوء عند المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة، فذلكم الرباط"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن بن يعقوب عن أبيه عن أبي هريرة، في باب انتظار الصلاة والمشي إليها: سأل النبي أصحابه ألا يخبرهم بما يمحو الله به الخطايا ويرفع به الدرجات، ثم ذكر إسباغ الوضوء عند المكاره وكثرة الخطا إلى المساجد وانتظار الصلاة بعد الصلاة، وقال ثلاثاً: فذلكم الرباط. ويخرّجه المحقق عند مسلم (1/151) والنسائي (1/89) وابن حبان (1038) وأحمد وأبي عوانة والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (20/222) وتعليقه على الترمذي (51). {cite:muwatta-maruf-1997 p.229}"
  tr: "Malik, Al-Ala' ibn Abd al-Rahman ibn Ya'qub'dan, o da babasından, o da Ebu Hurayra'dan rivayetle, namaza koşma ve namaza gitme bölümünde şöyle nakletmiştir: Peygamberimiz, sahabelerine Allah'ın günahları silmek ve dereceleri yükseltmek için ne kullandığını söylememelerini, sonra da zorlukta bile tam abdest almayı, mescitlere çok adım atmayı ve bir namazı kıldıktan sonra bir sonraki namazı beklemeyi zikretmiştir. Bunu üç defa tekrarlamıştır: \"İşte gerçek ibadet budur.\" Editör, bunu Müslim (1/151), el-Nesai (1/89), İbn Hibban (1038), Ahmed, Ebu Evane ve el-Beyhaki'de Malik'in sahabelerinin rivayet zincirleriyle yer vermekte ve el-Temhid (20/222) ve onun el-Tirmizi (51) üzerine tefsirine atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.229}"
  id: "Diriwayatkan oleh Malik dari Al-Ala’ ibn Abd al-Rahman ibn Ya’qub, dari ayahnya, dari Abu Hurayrah, dalam surah tentang menunggu salat dan berjalan menuju salat: Nabi meminta para sahabatnya untuk tidak memberitahukan apa yang Allah gunakan untuk menghapus dosa dan meninggikan derajat, kemudian beliau menyebutkan tentang berwudhu dengan sempurna meskipun dalam keadaan sulit, berjalan beberapa langkah menuju masjid, dan menunggu salat berikutnya setelah menyelesaikan satu salat. Beliau mengatakannya tiga kali: “Itulah ibadah yang sejati.” Editor menyertakannya dalam Muslim (1/151), al-Nasa’i (1/89), Ibn Hibban (1038), Ahmad, Abu ‘Awanah, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (20/222) dan komentarnya tentang al-Tirmidhi (51). {cite:muwatta-maruf-1997 p.229}"
