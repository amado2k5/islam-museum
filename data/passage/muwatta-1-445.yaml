label: { ar: "الموطأ 445 — إسباغ الوضوء على المكاره وكثرة الخطا إلى المساجد وانتظار الصلاة: فذلكم الرباط", en: "Muwatta 445" }
text: "إسباغ الوضوء عند المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة، فذلكم الرباط"
summary:
  ar: "يرويه مالك عن العلاء بن عبد الرحمن بن يعقوب عن أبيه عن أبي هريرة، في باب انتظار الصلاة والمشي إليها: سأل النبي أصحابه ألا يخبرهم بما يمحو الله به الخطايا ويرفع به الدرجات، ثم ذكر إسباغ الوضوء عند المكاره وكثرة الخطا إلى المساجد وانتظار الصلاة بعد الصلاة، وقال ثلاثاً: فذلكم الرباط. ويخرّجه المحقق عند مسلم (1/151) والنسائي (1/89) وابن حبان (1038) وأحمد وأبي عوانة والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (20/222) وتعليقه على الترمذي (51). {cite:muwatta-maruf-1997 p.229}"
