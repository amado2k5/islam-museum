label:
  ar: "البخاري 6557 — أهون أهل النار عذابا: أردت منك أهون من هذا"
  en: "Bukhari 6557 — The one in the Fire with the lightest punishment"
  ur: "بخاری 6557 — آگ والوں میں سب سے ہلکے عذاب والا"
  es: "Bukhari 6557 — El que está en el fuego con el castigo más leve"
  fr: "Bukhari 6557 — Celui qui, dans le Feu, a reçu le châtiment le plus léger"
  tr: "Buhari 6557 — Cehennemde en az azaba uğrayacak olan: Ben senden bundan daha kolay bir şey istemiştim."
  id: "Al-Bukhari 6557 — Orang yang akan menerima siksaan paling ringan di Neraka: Aku menginginkan sesuatu yang lebih mudah darimu daripada ini."
text: "يقول الله تعالى لأهون أهل النار عذابا يوم القيامة لو أن لك ما في الأرض من شىء أكنت تفتدي به فيقول نعم. فيقول أردت منك أهون من هذا وأنت في صلب آدم أن لا تشرك بي شيئا فأبيت إلا أن …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6557: أهون أهل النار عذابا: أردت منك أهون من هذا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6557: The one in the Fire with the lightest punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6557: آگ والوں میں سب سے ہلکے عذاب والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 6557: Aquel que en el Fuego recibe el castigo más leve. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 6557: Celui qui sera en Enfer avec le châtiment le plus léger. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations à travers les six livres et la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 6557: “Orang yang akan mendapat siksaan paling ringan di Neraka adalah orang yang meminta sesuatu yang lebih mudah daripada ini.” Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkan hadits ini dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta."
