label:
  ar: "البخاري 6557 — أهون أهل النار عذابا: أردت منك أهون من هذا"
  en: "Bukhari 6557 — The one in the Fire with the lightest punishment"
  ur: "بخاری 6557 — آگ والوں میں سب سے ہلکے عذاب والا"
text: "يقول الله تعالى لأهون أهل النار عذابا يوم القيامة لو أن لك ما في الأرض من شىء أكنت تفتدي به فيقول نعم. فيقول أردت منك أهون من هذا وأنت في صلب آدم أن لا تشرك بي شيئا فأبيت إلا أن …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6557: أهون أهل النار عذابا: أردت منك أهون من هذا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6557: The one in the Fire with the lightest punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6557: آگ والوں میں سب سے ہلکے عذاب والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
