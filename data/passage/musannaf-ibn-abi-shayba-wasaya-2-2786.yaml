text: "… حين حضرته الوفاة- أوصى أسماء بنت عُميس: أن تغسله، وكانت صائمة، فعزم عليها لتُفطِرنَّ. - حدثنا وكيع بن الجَرَّاح عن أبي هلال عن صالح الدهّان - أو حَيَّان الأعرج- عن جابر بن زيد: أنه أوصى أن تغسله امرأته. - حدثنا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 2786، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 2786, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 2786 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 2786, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 2786, mentionnant un testament ou des adieux, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 2786. sayfasından bir alıntı, vasiyetname veya son vasiyet, ölüm zamanı ve ölüm süreci, defin, mezar ve istirahat yerinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, miraslar, eski eserler ve istirahat yerleri araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf karya Ibn Abi Shaybah, Volume 2, halaman 2786, menyebutkan wasiat atau surat wasiat terakhir, waktu kematian dan sekarat, pemakaman, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat peristirahatan."
