text: "… اللّهِ! مَا الاسْتِعْجَالُ؟ قَالَ:. يَا رَسُولَ اللهِ! مَا الإِسْلامُ؟ قال:.... يَا رَسُولَ اللَّهِ! مَا اضْحَكَكَ؟ قال:... يَا رَسُولَ اللَّهِ! مَا أعْدَدْتُ لَهَا كَبِيرَ صَلاةٍ وَلا صِيّامٍ.. يَا رَسُولَ اللهِ! مَا أَهْجُرُ إلا اسْمَكَ...، يَا رَسُولَ اللّهِ! مَا الإيَمَانُ؟ قال:. يَا …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 2028، يذكر تعريف الإسلام بأعماله، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
