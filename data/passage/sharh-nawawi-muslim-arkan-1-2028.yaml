  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 2028 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 2028, que menciona el Islam definido por sus actos, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (volume 1, p. 2028) évoquant la définition de l'islam par ses actes, la question de la foi et sa réponse; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 2028. sayfasından bir alıntı, İslam'ın tanımını ve uygulamalarını ele almakta, iman sorusunu ve cevabını tartışmaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özelliklerine dair bilgiler içermektedir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 2028, membahas definisi Islam dan praktik-praktiknya, serta membahas pertanyaan tentang iman dan jawabannya. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini mencakup informasi tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
