text: "حديث ثلاث من كن فيه استكمل إيمانه لا يخاف في االله لومة لا ئم الحديث أخرجه أبو منصور الديلمي في مسند الفردوس من حديث أبى هريرة وقد تقدم حديث من حسن إسلام المرء تركه مالا يعنيه تقدم الس ما استقبل …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 8253، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 8253, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 8253 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
