label: { ar: "سنن ابن ماجه 4033 — حلاوة الإيمان وكماله، خصال من كنّ فيه", en: "Sunan Ibn Majah 4033 — the sweetness and completeness of faith; traits that, found in a person, mark faith", ur: "سنن ابن ماجہ 4033 — ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں", es: "Sunan Ibn Majah 4033 — La dulzura y la plenitud de la fe; rasgos que, encontrados en una persona, marcan la fe." }
text: "… قَالَ سَمِعْتُ قَتَادَةَ، يُحَدِّثُ عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" ثَلاَثٌ مَنْ كُنَّ فِيهِ وَجَدَ طَعْمَ الإِيمَانِ - وَقَالَ بُنْدَارٌ حَلاَوَةَ الإِيمَانِ - مَنْ كَانَ يُحِبُّ الْمَرْءَ لاَ يُحِبُّهُ إِلاَّ لِلَّهِ. وَمَنْ كَانَ اللَّهُ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا. وَمَنْ كَانَ أَنْ يُلْقَى فِي النَّارِ أَحَبَّ إِلَيْهِ مِنْ أَنْ يَرْجِعَ فِي …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4033، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 4033 (Tribulations), that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4033، جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 4033 (Las Tribulaciones), menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
