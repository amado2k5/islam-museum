text: "… عشر معرفة عدد لغات النزول ويناقشها السيوطى فى مسألة يقول : اختلاف الأقوال فى نزول القرآن على سبعة أحرف، وسأسوق من رواتهم ما يحتاج إليه فأقول : اختلف فى معنى هذا الحديث على نحو. أربعين قولاً. ويذكر خمسة وثلاثين قولاً. …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 143، يذكر الأحرف السبعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 143, that mentions the seven ahruf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 143 کا اقتباس جس میں سبعہ احرف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen 1, pág. 143, que menciona los siete ahruf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du *al-Burhan fi 'Ulum al-Qur'an* d'al-Zarkashi, volume 1, page 143, mentionne les sept ahruf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Zarkashi'nin Al-Burhan fi Ulum al-Qur'an adlı eserinin 1. cildinin 143. sayfasından, yedi harften bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 1, halaman 143, yang menyebutkan tujuh huruf; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
