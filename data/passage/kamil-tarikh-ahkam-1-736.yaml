text: "فكتب إليه عليّ: أمّا بعدِ، فمِثلك نصحَ الإمام والأمّة، ووالى على الحقّ، وقد كتبتُ إلى صاحبك فيما كتبتَ إليّ، ولم أعلمه بكتابك، فلا تدع إعلامي بما يكون بحضرتك ممّا النظر فيه صلاح للأمّة، فإنّك بذلك جدير، وهو حقّ واجب عليك، …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 736، يرد فيه ذكر الواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 736, whose wording mentions the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 736 کا اقتباس جس میں واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
