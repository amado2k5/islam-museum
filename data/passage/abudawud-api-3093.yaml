text: "… يُجْزَ بِهِ } قَالَ \" أَمَا عَلِمْتِ يَا عَائِشَةُ أَنَّ الْمُؤْمِنَ تُصِيبُهُ النَّكْبَةُ أَوِ الشَّوْكَةُ فَيُكَافَأُ بِأَسْوَإِ عَمَلِهِ وَمَنْ حُوسِبَ عُذِّبَ \". قَالَتْ أَلَيْسَ اللَّهُ يَقُولُ { فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا } قَالَ \" ذَاكُمُ الْعَرْضُ يَا عَائِشَةُ مَنْ نُوقِشَ الْحِسَابَ عُذِّبَ \". قَالَ أَبُو دَاوُدَ وَهَذَا لَفْظُ ابْنِ بَشَّارٍ قَالَ أَخْبَرَنَا ابْنُ أَبِي مُلَيْكَةَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3093، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 3093 (Funerals (Kitab Al-Jana'iz)), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 3093، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
