text: "فقرأت القراءة التي أَقرأَني النبي مطاع، ثم قال : هكذا أُنزلت، ثم قال رسول اللّٰه مالله : إنَّ هذا القرآن أُنزل على سبعة أَحرف، فاقرأُوا منه ما تيسر. - أخبرنا عبد الرزاق عن معمر عن الزهري عن عبيد اللّٰه ابن …"
summary:
