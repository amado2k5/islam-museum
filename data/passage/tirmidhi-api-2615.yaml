label: { ar: "جامع الترمذي 2615 — ما عُدّ من الإيمان", en: "Jami' al-Tirmidhi 2615 — what is counted as part of faith", ur: "جامع ترمذی 2615 — جو ایمان میں سے گنا گیا" }
text: "… سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ مَرَّ بِرَجُلٍ وَهُوَ يَعِظُ أَخَاهُ فِي الْحَيَاءِ فَقَالَ رَسُولُ اللَّهِ \" الْحَيَاءُ مِنَ الإِيمَانِ \". قَالَ أَحْمَدُ بْنُ مَنِيعٍ فِي حَدِيثِهِ إِنَّ النَّبِيَّ سَمِعَ رَجُلاً يَعِظُ أَخَاهُ فِي الْحَيَاءِ. قَالَ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَفِي الْبَابِ عَنْ أَبِي هُرَيْرَةَ وَأَبِي بَكْرَةَ وَأَبِي أُمَامَةَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2615، يذكر ما عُدّ من الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2615 (The Book on Faith), that mentions what is counted as part of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2615، جس میں جو ایمان میں سے گنا گیا کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
