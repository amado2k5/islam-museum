text: "… للحُوم النَّاس فقال: قال وقال نُفَيع بن صفَّار المحاربي من ولد مُحارِب بن خُصَفة في حرب قيسٍ وقال أبو يعقوب الخُرْيمي، وهو إِسحاق بن حسَّان بن قوهي في قتلَى حربٍ وقال أبو الشمقمق وهو مَرْوان بن محمد، مولى مرْوان بنِ …"
