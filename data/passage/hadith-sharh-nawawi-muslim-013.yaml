text: "من الثلاثة إلى العشرة هذا هو صحيح وفيه كلام طويل سبق بيانه في كتاب الإيمان، والمراد به هنا خمس وعشرون وسبع وعشرون درجة كما جاء مبينا في الروايات السابقات. (٢) قوله: «لا تنهزه إلا الصلاة) هو بفتح أوله وفتح الهاء"
