summary:
  ar: "قال مالك: وكل ما اختلف من الطعام والأدم، فبان اختلافه، فلا بأس أن يشترى بعضه ببعض جزافا، يدا بيد. فإن دخله الأجل فلا خير فيه. وإنما اشتراء ذلك جزافا كاشتراء بعض ذلك بالذهب والورق جزافا، وذلك أنك تشتري الحنطة بالورق جزافا، والتمر بالذهب جزافا. فهذا حلال لا بأس به. {cite:muwatta-maruf-1997 p.175}"
