label: { ar: "الموطأ 1885 — مالك: كل ما اختلف من الطعام والأدم فبان اختلافه، فلا بأس أن يشترى بعضه ببعض جزافا يدا بيد، فإن دخله الأجل فلا خير فيه", en: "Muwatta 1885", es: "Muwatta 1885", fr: "Muwatta 1885", ur: "موطا 1885", tr: "El-Muvatta 1885 — Malik: Herhangi bir yiyecek veya baharat farklıysa ve bu farklılık açıkça belliyse, bir kısmını başkaları için toplu olarak, elden ele almakta bir sakınca yoktur. Ancak eğer ileriki bir tarih söz konusuysa, o zaman bunun bir faydası yoktur.", id: "Al-Muwatta 1885 — Malik: Apa pun makanan atau bumbu yang berbeda dan perbedaannya menjadi jelas, tidak ada salahnya membeli sebagian darinya untuk orang lain dalam jumlah besar, dari tangan ke tangan. Tetapi jika tanggal yang berlaku adalah tanggal di masa mendatang, maka tidak ada gunanya." }
summary:
  ar: "قال مالك: وكل ما اختلف من الطعام والأدم، فبان اختلافه، فلا بأس أن يشترى بعضه ببعض جزافا، يدا بيد. فإن دخله الأجل فلا خير فيه. وإنما اشتراء ذلك جزافا كاشتراء بعض ذلك بالذهب والورق جزافا، وذلك أنك تشتري الحنطة بالورق جزافا، والتمر بالذهب جزافا. فهذا حلال لا بأس به. {cite:muwatta-maruf-1997 p.175}"
  tr: "Malik şöyle dedi: Kalite bakımından farklılık gösteren ve bu farklılıklar açıkça belli olan her türlü yiyecek ve baharat konusunda, bazılarını elden ele, toplu olarak satın almakta bir sakınca yoktur. Ancak, eğer ödeme ertelenirse, o zaman bunun bir faydası olmaz. Bu tür şeyleri toplu olarak satın almak, bazılarını altın ve gümüşle toplu olarak satın almak gibidir; tıpkı buğdayı gümüşle veya hurmayı altınla toplu olarak satın almak gibi. Bu caizdir ve bunda bir sakınca yoktur. {cite:muwatta-maruf-1997 s.175}"
  id: "Malik berkata: Mengenai semua jenis makanan dan bumbu yang berbeda kualitasnya, dan perbedaan tersebut terlihat jelas, tidak ada salahnya membeli sebagian darinya untuk orang lain dalam jumlah besar, secara langsung. Namun, jika pembayarannya ditangguhkan, maka hal itu tidak baik. Membeli barang-barang tersebut dalam jumlah besar sama seperti membeli sebagiannya dengan emas dan perak dalam jumlah besar, seperti ketika Anda membeli gandum dengan perak dalam jumlah besar, atau kurma dengan emas dalam jumlah besar. Hal ini diperbolehkan dan tidak ada salahnya. {kutipan:muwatta-maruf-1997 hlm.175}"
