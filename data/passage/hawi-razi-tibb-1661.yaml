text: "… في الخصي حلله. من مداواة الأسقام، قال: حل المقل بخل حتى يكون مثل المرهم وضعه على الأدرة أو دق ورق السرو وضمد به. العلل والأعراض : قال: قيل الثرب وقيل الأمعاء إنما يكونان في الأكثر عندما يتسع المجريان النافذان من …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1661، يذكر السقم، والبيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر، والعقاقير والصيدلة، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1661, that mentions sickness, the hospital and the medical craft, the organs of the body, surgery, circumcision and splints, drugs and pharmacy, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1661 کا اقتباس جس میں سقم، بیمارستان، اعضائے بدن، جراحت، ختنہ اور پٹیاں، ادویہ اور دواسازی، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
