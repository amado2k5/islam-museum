label: { ar: "سنن أبي داود 2034 — الحرام", en: "Sunan Abi Dawud 2034 — the unlawful", ur: "سنن ابی داؤد 2034 — حرام", es: "Sunan Abi Dawud 2034 – lo ilícito", fr: "Sunan Abi Dawud 2034 — l'illégal", tr: "Sünen Ebu Davud 2034 — Mescid-i Haram", id: "Sunan Abi Dawud 2034 — Al-Haram" }
text: "… قَالَ مَا كَتَبْنَا عَنْ رَسُولِ اللَّهِ إِلاَّ الْقُرْآنَ وَمَا فِي هَذِهِ الصَّحِيفَةِ. قَالَ قَالَ رَسُولُ اللَّهِ \" الْمَدِينَةُ حَرَامٌ مَا بَيْنَ عَائِرٍ إِلَى ثَوْرٍ فَمَنْ أَحْدَثَ حَدَثًا أَوْ آوَى مُحْدِثًا فَعَلَيْهِ لَعْنَةُ اللَّهِ وَالْمَلاَئِكَةِ وَالنَّاسِ أَجْمَعِينَ لاَ يُقْبَلُ مِنْهُ عَدْلٌ وَلاَ صَرْفٌ وَذِمَّةُ الْمُسْلِمِينَ وَاحِدَةٌ يَسْعَى بِهَا أَدْنَاهُمْ فَمَنْ أَخْفَرَ مُسْلِمًا فَعَلَيْهِ لَعْنَةُ اللَّهِ وَالْمَلاَئِكَةِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2034، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2034 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2034، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2034 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2034 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da 2034 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alınan metinleri bir araya getirmektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2034, menyebutkan apa yang dilarang. Bagian dari peramban Halal dan Haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
