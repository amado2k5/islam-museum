  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 409. sayfasından, farz ameller ve küçük günahları anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 409, yang menyebutkan amalan wajib dan dosa-dosa kecil; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
