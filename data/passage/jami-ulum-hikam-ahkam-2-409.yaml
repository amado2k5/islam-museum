text: "… على أنَّ من تابَ إلى اللّٰه، تاب اللّٰه عليه، وغفر له، فبقي مَنْ لم يتُبْ داخلاً تحت المشيئة. وأيضاً، فيدلُّ على أنَّ الكبائرَ لا تكفِّرُها الأعمالُ : إنَّ اللّٰه لم يجعلْ للكبائر في الدُّنيا كفَّارةً واجبةً، وإنَّما جعلَ الكفارةَ للصغائر …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 409، يرد فيه ذكر الواجب، وصغائر الذنوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 409, whose wording mentions the obligatory (wajib), the minor sins; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
