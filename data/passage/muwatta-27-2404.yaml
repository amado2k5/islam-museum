label: { ar: "الموطأ 2404 — مالك: الرجل يقع على جارية ابنه أو ابنته يدرأ عنه الحد", en: "Muwatta 2404", es: "Muwatta 2404", fr: "Muwatta 2404", ur: "موطا 2404", tr: "El-Muvatta 2404 — Malik: Bir erkek, oğlunun veya kızının cariyesiyle cinsel ilişkiye girerse, hadd cezası ondan kaldırılır.", id: "Al-Muwatta 2404 — Malik: Jika seorang pria bersetubuh dengan budak perempuan anaknya, maka hukuman hadd ditiadakan baginya." }
summary:
  ar: "قال مالك في الرجل يقع على جارية ابنه أو ابنته: إنه يُدرأ عنه الحد، وتُقوَّم عليه الجارية حملت أو لم تحمل. {cite:muwatta-maruf-1997 p.393}"
  tr: "Malik, oğlunun veya kızının cariyesiyle cinsel ilişkiye giren bir adam hakkında şöyle demiştir: Cezası kaldırılır ve cariye, hamile olup olmamasına bakılmaksızın, ona göre değerlendirilir. {cite:muwatta-maruf-1997 s.393}"
  id: "Malik berkata mengenai seorang pria yang bersetubuh dengan budak perempuan anaknya, baik laki-laki maupun perempuan: hukumannya ditiadakan, dan budak perempuan itu dihargai sesuai dengan statusnya, baik ia hamil atau tidak. {cite:muwatta-maruf-1997 p.393}"
