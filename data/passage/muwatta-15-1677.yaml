label: { ar: "الموطأ 1677 — مالك: لا نفقة على حر ولا عبد طلق مملوكة، ولا على عبد طلق حرة طلاقا بائنا وإن كانت حاملا إذا لم تكن له عليها رجعة", en: "Muwatta 1677", es: "Muwatta 1677", fr: "Muwatta 1677", ur: "موطا 1677", tr: "El-Muvatta 1677 — Malik: Bir köle kadından boşandığında, hür bir erkek veya köle için nafaka yükümlülüğü yoktur; aynı şekilde, bir köle de özgür bir kadından geri dönüşü olmayan bir boşanma ile boşandığında, kadın hamile olsa bile, ona geri dönme hakkı yoksa nafaka yükümlülüğü yoktur.", id: "Al-Muwatta 1677 — Malik: Tidak ada nafkah yang harus diberikan kepada laki-laki merdeka atau budak yang menceraikan budak perempuan, atau kepada budak yang menceraikan perempuan merdeka dengan perceraian yang tidak dapat dibatalkan, meskipun perempuan tersebut sedang hamil, jika ia tidak memiliki hak untuk kembali kepadanya." }
summary:
  ar: "يقول مالك ليس على حر ولا عبد طلق مملوكة، ولا على عبد طلق حرة طلاقا بائنا نفقة، وإن كانت حاملا، إذا لم يكن له عليها رجعة. {cite:muwatta-maruf-1997 p.87}"
  tr: "Malik, ne özgür bir erkeğin ne de bir kölenin kadın köleden boşanması durumunda, ne de bir kölenin özgür bir kadından geri alınamaz bir boşanma ile boşanması durumunda, kadının hamile olsa bile, onu geri alma hakkına sahip olmadığı sürece, ona bakmakla yükümlü olmadığını söyler. {cite:muwatta-maruf-1997 s.87}"
  id: "Malik mengatakan bahwa baik seorang pria merdeka maupun seorang budak yang menceraikan seorang budak perempuan, atau seorang budak yang menceraikan seorang perempuan merdeka dengan perceraian yang tidak dapat dibatalkan, tidak berkewajiban untuk menafkahinya, bahkan jika ia hamil, kecuali jika ia memiliki hak untuk mengambilnya kembali. {cite:muwatta-maruf-1997 p.87}"
