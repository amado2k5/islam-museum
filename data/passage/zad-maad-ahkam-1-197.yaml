text: "… بالنهى عنه وكراهة صومه، فعُلِمَ أن الذي تُرِكَ وجوبُه لا استحبابه. فإن قيل : حديث معاوية المتفق على صحته صريح في عدم فرضيته، وإنه لم يُفرض قط. فالجواب: أن حديث معاوية صريح في نفي استمرار وجوبه، وأنه الآن غيرُ واجب، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 197، يرد فيه ذكر الواجب، والوجوب، والمستحب، وما ليس بواجب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 197, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), what is said not to be obligatory, dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
