label: { ar: "سنن ابن ماجه 1860 — مزاح ودعابة", en: "Sunan Ibn Majah 1860 — jesting and playfulness", ur: "سنن ابن ماجہ 1860 — مزاح اور خوش طبعی", fr: "Sunan Ibn Majah 1860 — plaisanterie et badinage", es: "Sunan Ibn Majah 1860 — broma y jovialidad", tr: "Sunan İbn Majah 1860 - Şaka ve mizah", id: "Sunan Ibnu Majah 1860 - Lelucon dan humor" }
text: "… سُلَيْمَانَ، عَنْ عَبْدِ الْمَلِكِ، عَنْ عَطَاءٍ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ تَزَوَّجْتُ امْرَأَةً عَلَى عَهْدِ رَسُولِ اللَّهِ ـ فَلَقِيتُ رَسُولَ اللَّهِ ـ فَقَالَ أَتَزَوَّجْتَ يَا جَابِرُ . قُلْتُ نَعَمْ. قَالَ أَبِكْرًا أَوْ ثَيِّبًا . قُلْتُ ثَيِّبًا. قَالَ فَهَلاَّ بِكْرًا تُلاَعِبُهَا . قُلْتُ كُنَّ لِي أَخَوَاتٌ فَخَشِيتُ أَنْ تَدْخُلَ بَيْنِي وَبَيْنَهُنَّ. قَالَ فَذَاكَ إِذًا ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1860، فيه مزاح ودعابة. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Ibn Majah, no. 1860, with jesting and playfulness. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1860، جس میں مزاح اور خوش طبعی ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Ibn Majah, n° 1860, avec plaisanterie et badinage. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Ibn Majah, n.º 1860, con broma y jovialidad. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "İbn Majah'ın Sünen'inde yer alan, mizah ve fıkralar içeren 1860 numaralı hadis. Bu hadis, Juha ve İslam folkloru derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1860, yang berisi humor dan lelucon. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
