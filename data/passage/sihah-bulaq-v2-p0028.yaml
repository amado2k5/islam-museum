text: |-
  •(ot
  ٥٥٩
  أصتميت ودع ما أغيت والنامى الناجى قال التغلبى
  وقافية كان السم فيها • وليس سليمها أبدا بناهى
  صرفت بج السان القوم عنكم • تفخترت المسنابك والحوامى
  وقول الاعشى• لا يتنى لها فى القيظ يهبطهاه قال أيو سعيدلا يعتمد عليها ⁦(نوى)⁩(نويت
  نية ونواة أى عزمت وانتويت مثله وقال
  صرمت أميمة خلتى وصلاتى • ونوت ولماننتوى كنوات
  بقول لم تنوفى كمانويت فى مودتها ويروى ولماتنتوى بنواتى أى لم تقض حاجق يقال نواه!
  بنوانه أى ردّه صاجته وقضاهاله وتقول نوالالله أى صحبك فى سفرك وحفظك قال
  الناعر
  باعر وأحسن نوالأاللّٰه بالشد • واقرأسلا ماعلى الذلفاء بالنمه
  وتويته تنوية أى وكاته الى نبته ونويك صاحبك الذى ف يته نيتك ولى فى بى فلان نية أى حاجة
  والنسة أيضاو النوى الوجه الذى ينو به المسافر من قرب أو بعدوهى مؤنثة لاغر وأما النوى
  الذى هو جع نواة التمرفهويذكرويونت وانتوى القوم منزلا بم وضع كذا وكذا واستقرّت نواهم
  أى أقاموا والنواة خسة درأهم كا يقال للعشرين نش وناواء أى عاداه وأصله الهمزلانه من
  النوه وهو النهوض وأكات التمرفنويت النوى وأنويته اذارميت به وجمع نوى التمرأنوا عن
  ابن كيسان ونوت النعاقة أى ممنت تنوى نواية ونيا فهى ناوية ويجل ناوويهال نواء مثل جائع
  وجياع وابل نووية اذا كانت تأكل الذوى والنى الشهم وأصل نوى قال أبوذؤيب
  بالنى تهو تشوخ فيه الاصبع* ونيان-وضع قال الكميت
  من وحسرنان أومن وحس دى بر • أفى حلاتله الاسلاء والطرد
  (نهى التهخلاف الامر ونهيته عن كذافانتهى عنه وتناهى أى كف وتناهوا
  عن المنسكر أى نهى بعضهم بعضا وقول الفرزدق • فنهاك عنها منكرونكير• انماشدده
  للمبالغة ويقال انه لامور بالمعروف نهوّعن المنكر عسلى فعول وفلات ماله فاهية أى نهى
  والنهية بالضم واحدة النهى وهى العول لانها تنهى عن القبيح والنهى بالكسر الغدير فى لغة
  أهل نجدوغيرهم يقوله بالقتح وتناهى الماءاذا وقف فى الغدير وسكن قال العجاج
  حتى تناهى فى صهاريج الصفا * وتنهمة الوادى حيث ينتهى اليه الماء من حروفه والهمع
  التناهى ونهاء الماء بالضم ارتفاعه وقال ابن الاءرابى النهاء القوارير والزجاج وأنشد
  زدّ الحصى أخفافهن كانما • تكسرقيض بينهاونها
  ريقال هم ما مائة ونها مائة أيضا بالكسر أى قدرمائة مثل زهاءمائة والانهاه الابلاغ
  وأنهيت الله الخبرفانتهى وتناهى أى بلغ والنهاية الغاية يقال بلغى نهايته والنهية بالضم
  أيضا مثله قال أبوذؤيب • وعاد الرصبح نهية للحمائل • يقول انهزمواحتى انقلبت
  سيوفهم فعادار صسمع على المنسكب حيث كانت الهائل ويقال هذا رجل ناهيك من رجل
  ونهيك عن رحسل ونهاك من رحسل وتأويله أنه بجدّه وغنائه بنهاك عن تطاب غيره وقال
  *والشيخ الذى حدثت عنه * خمال الشيخ مكرمة وغرا
  وهذه امى أة ناهيتك من احر أء تذكروتونت وتننى وتجمع لانه اسم فاعل واذاقت نهيك من
