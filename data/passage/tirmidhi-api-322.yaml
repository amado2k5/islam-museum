text: "أَبُو عِيسَى وَمَنْ تَكَلَّمَ فِي حَدِيثِ عَمْرِو بْنِ شُعَيْبٍ إِنَّمَا ضَعَّفَهُ لأَنَّهُ يُحَدِّثُ عَنْ صَحِيفَةِ جَدِّهِ كَأَنَّهُمْ رَأَوْا أَنَّهُ لَمْ يَسْمَعْ هَذِهِ الأَحَادِيثَ مِنْ جَدِّهِ ‏.‏ قَالَ عَلِيُّ بْنُ عَبْدِ اللَّهِ وَذُكِرَ عَنْ يَحْيَى بْنِ سَعِيدٍ أَنَّهُ قَالَ حَدِيثُ عَمْرِو بْنِ شُعَيْبٍ عِنْدَنَا وَاهِي ‏.‏ وَقَدْ كَرِهَ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ الْبَيْعَ وَالشِّرَاءَ فِي الْمَسْجِد …"
