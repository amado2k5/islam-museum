text: "فدعه حتى يكون. قال: وكان زيد مع عمر لما قدم إلى الشام، وأنه كتب له كتاب الصلح مع الروم على بيت المقدس. وكان يكتب لأبي بكر قبل عمر، وكان على بيت المال في أيام عثمان، وكان مع عثمان وهو محصور"
