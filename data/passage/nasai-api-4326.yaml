label: { ar: "سنن النسائي 4326 — ما لا يحل", en: "Sunan al-Nasa'i 4326 — what is not lawful", ur: "سنن نسائی 4326 — جو حلال نہیں", es: "Sunan al-Nasa'i 4326 — lo que no es lícito" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عُثْمَانَ، قَالَ حَدَّثَنَا بَقِيَّةُ، عَنْ بَحِيرٍ، عَنْ خَالِدٍ، عَنْ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِي ثَعْلَبَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ تَحِلُّ النُّهْبَى وَلاَ يَحِلُّ مِنَ السِّبَاعِ كُلُّ ذِي نَابٍ وَلاَ تَحِلُّ الْمُجْثَّمَةُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4326، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4326 (The Book of Hunting and Slaughtering), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4326، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4326 (El Libro de la Caza y la Matanza), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
