label: { ar: "الموطأ 2833 — سهيل بن أبي صالح: إن الله يرضى لكم ثلاثا ويسخط لكم ثلاثا", en: "Muwatta 2833" }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح، عن أبيه، أن رسول الله قال: إن الله يرضى لكم ثلاثا ويسخط لكم ثلاثا: يرضى لكم أن تعبدوه ولا تشركوا به شيئا، وأن تعتصموا بحبل الله جميعا، وأن تناصحوا من ولاه الله أمركم. ويسخط لكم قيل وقال، وإضاعة المال، وكثرة السؤال. ويذكر المحقق أن هذه الرواية في الموطأ مرسلة لا يذكر فيها أبا هريرة، وأن أكثر الرواة عن مالك رووها مسندة عن أبي هريرة، وأن ابن عبد البر نص على ذلك. {cite:muwatta-maruf-1997 p.589} {cite:muwatta-maruf-1997 p.590}"
