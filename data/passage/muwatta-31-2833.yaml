label: { ar: "الموطأ 2833 — سهيل بن أبي صالح: إن الله يرضى لكم ثلاثا ويسخط لكم ثلاثا", en: "Muwatta 2833", es: "Muwatta 2833", fr: "Muwatta 2833", ur: "موطا 2833", tr: "El-Muvatta 2833 — Suhayl ibn Abi Salih: Allah sizin için üç şeyden razıdır, üç şeyden de razı değildir.", id: "Al-Muwatta 2833 — Suhayl ibn Abi Salih: Allah ridha dengan tiga hal untukmu dan murka dengan tiga hal untukmu" }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح، عن أبيه، أن رسول الله قال: إن الله يرضى لكم ثلاثا ويسخط لكم ثلاثا: يرضى لكم أن تعبدوه ولا تشركوا به شيئا، وأن تعتصموا بحبل الله جميعا، وأن تناصحوا من ولاه الله أمركم. ويسخط لكم قيل وقال، وإضاعة المال، وكثرة السؤال. ويذكر المحقق أن هذه الرواية في الموطأ مرسلة لا يذكر فيها أبا هريرة، وأن أكثر الرواة عن مالك رووها مسندة عن أبي هريرة، وأن ابن عبد البر نص على ذلك. {cite:muwatta-maruf-1997 p.589} {cite:muwatta-maruf-1997 p.590}"
  tr: "Malik, Suhayl ibn Abi Salih'ten, o da babasından rivayet ederek, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: “Allah sizin için üç şeyden razıdır ve üç şeyden de razı değildir: Ona ibadet etmenizden ve ona hiçbir şeyi ortak koşmamanızdan, hep birlikte Allah'ın ipine sımsıkı sarılmanızdan ve Allah'ın size yetki verdiği kişilere nasihatte bulunmanızdan razıdır. Dedikodu yapmanızdan, para israf etmenizden ve çok soru sormanızdan ise razı değildir.” Araştırmacı, Muwatta'daki bu rivayetin mursal (tam bir rivayet zincirine sahip olmayan) olduğunu ve Ebu Hurayra'dan bahsetmediğini, Malik'in rivayetine dayanan ravilerin çoğunun ise Ebu Hurayra'dan musned (bağlantılı bir rivayet zinciri) ile naklettiğini ve İbn Abdül-Barr'ın bunu açıkça belirttiğini kaydetmektedir. {cite:muwatta-maruf-1997 s.589} {cite:muwatta-maruf-1997 s.590}"
  id: "Malik meriwayatkan dari Suhayl ibn Abi Salih, dari ayahnya, bahwa Rasulullah SAW bersabda: “Allah senang dengan tiga hal bagi kalian dan tidak senang dengan tiga hal bagi kalian: Dia senang karena kalian menyembah-Nya dan tidak menyekutukan-Nya dengan sesuatu pun, karena kalian berpegang teguh pada tali Allah, dan karena kalian menasihati orang-orang yang telah Allah tempatkan sebagai penguasa atas kalian. Dia tidak senang dengan kalian karena bergosip, menghambur-hamburkan uang, dan terlalu banyak bertanya.” Peneliti mencatat bahwa riwayat dalam Muwatta ini mursal (tidak memiliki rantai perawi yang lengkap) dan tidak menyebutkan Abu Hurairah, dan bahwa sebagian besar perawi dari Malik meriwayatkannya dengan musnad (rantai perawi yang terhubung) dari Abu Hurairah, dan bahwa Ibnu Abd al-Barr secara eksplisit menyatakan hal ini. {cite:muwatta-maruf-1997 p.589} {cite:muwatta-maruf-1997 p.590}"
