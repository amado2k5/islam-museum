text: "هؤلاء الذين خرجوا، بيني وبينهم كتاب الله عزل وجل، يقول الله في كتابه في امرأة ورجل (وإن خفتم شقاق يينهم فابعتوا حكما من أهله وحكما من أهلها إن يريدا إصلاحا يوفق الله بينهما) فأمة محمد ٤ أعظم دما وحرمة من"
