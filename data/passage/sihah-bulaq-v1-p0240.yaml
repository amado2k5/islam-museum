text: |-
  ٠٠١
  قال الكميت يصف بقرة
  تعاطى فراخ المكر طوراوتارة * تتيررحاماها وتعلق ضالها
  وفراخ المكرعره والممكورة المطوية الخلق من النساء يقال امرأة ممكورة الساقين أى خدلاء
  ( •ور مارالشى يمور موراتزهيا أى تحرّك وجاء وذهب كمانكفأ النخلة العبدانة والتمور
  مثله وقُوله تعالى يوم تمور السماء مورا قال الضمالك تموجموجا وقال أبو عبيدة تكفأ
  والاخفسُر مثله وأنشد للاعشى
  كأن مشيتها من بيت جارتها • مورالسحابة لاريت ولا عمل
  ويقال مارالدم على وجه الارض وأماره غيره قال الشاءر وماردم من جار بببة ناقع
  والمابرات الدماء فى قول الشاعر
  حلفت بماثوان حول عوض • وأنصاب تركن لدى العيَر
  عوض والسعير ضمان والور الطريق ومنه قول طرفة فوق مور معبد والمور الموج
  وناقة موارة اليد أى سريعة والبعير يمور عضداه اذا ترددافى عرض جنبه قال الشاعر
  على ظهر موار الملاط حصان وقواهم لا أدرى أغار أم مارأى أتى غورا أم دارة رجع الى
  نجد والمودبالضم الغبار بالريح والموارة نسيل الهارود تمور عليه نسيله أى سقط وانمارت
  عقيقة الحمارأى سقطت عنه أيام الربيع والقطاة المارية بتشديد الياء المداء ومارسرجس
  من أسماء العجم وهما اسمان جعلا واحدا ١٠ ل الاخطل
  لمارأونا والصليب طالعا * ومارسرجيس وموناناقها
  خلوالتاراذان والمزارعا • وحنعاة طيسا وكرمايائعا.
  كأنما كانوا غرابا واقعا
  الاأنه أشبع الكسرة لاقامة الوزن قتولدت منه الياء ( هر المهر الصداق أبوزيد
  مهرت المرأة أمهر «امهرا وأمهرتها وأنشد لقهيف العقيلى
  أخذن اغتصا باخطبة عجرفية • وأمهرن أُرماحامن اشظط ذَبلا
  وف المثل كالممهورة احدى خد متيها والمهيرة الحرة والمهارة الحذق فى النى وقدمهرت
  الشى -هارة وقول الاعشى يقذف بالبوصى والماهر يريد الساجح ومهرة بن حيدان
  أبو قبيلة تنسب اليها الايل المهرية والهع المهارى وان شئت خففت الياءقال رؤية
  به عطت غول كل مهمه • بناحراجيج الهارى النفه
  والمهرولد الفرس والمع أمهارومهارومهارة والاننى مهرة وابهع مهرومهرات قال ربيع بن
  زياد العبسى يقدفن بالمهرات والامهار وفرس ممهرذات مهروقول الشاعر
  جافى اليدين عن مشاش المهر يقال هو عظم فى زور الفرس (مبر الميرة
  الطعام بمتاره الائسان وقدمارآهل عيرهم ميرا ومنه قولهم ماعنده خير ولامه
  والامسارمثله وجمع المأوميار مثل كفاروميارة مشل رجالة بقال نحن تتظر صارتن
  وميارنا
  صل النون بر) نبرت الشئء أنيرة تبرارقعته ومنه سحى المتبرونبرة المذنى رفع صوته
