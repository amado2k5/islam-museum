label: { ar: "الموطأ 63 — الاستطابة: أو لا يجد أحدكم ثلاثة أحجار؟", en: "Muwatta 63", es: "Muwatta 63", fr: "Muwatta 63", ur: "موطا 63", tr: "Al-Muwatta 63 — İstitâbe: Yoksa sizden biri üç taş bulamıyor mu?", id: "Al-Muwatta 63 — Istiṭābah: Atau tidakkah salah seorang di antara kalian menemukan tiga batu?" }
text: "أو لا يجد أحدكم ثلاثة أحجار؟"
summary:
  ar: "أول حديث في باب جامع الوضوء. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه مرسلاً: سُئل النبي عن الاستطابة، أي الاستنجاء، فأجاب مستنكراً: أو لا يجد أحدكم ثلاثة أحجار؟ ويفسر المحقق الاستطابة بالاستنجاء لأن المستنجي تطيب نفسه بإزالة الخبث، وينقل عن ابن عبد البر أن جماعة الرواة رووه عن مالك مرسلاً، وأن رواية من جعله عن عروة عن أبي هريرة «غلط فاحش»، وأن هشاماً اختُلف عليه فيه: طائفة ترويه عنه عن أبيه مرسلاً، وطائفة عن عمرو بن خزيمة عن عمارة بن خزيمة عن خزيمة بن ثابت، وأن ابن المبارك روى الحديثين جميعاً فدل على أنهما حديثان ⁦(التمهيد 22/310–312)⁩؛ ويذكر المحقق رواية مسلم بن قرط عن عروة عن عائشة عند أحمد وأبي داود (40) والنسائي. {cite:muwatta-maruf-1997 p.64} {cite:muwatta-maruf-1997 p.65}"
  tr: "Tam abdest bölümündeki ilk hadis. Yahya'nın Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayet ettiği mursal bir hadiste şöyle buyurulmuştur: Peygamberimize istitabah, yani istinja' hakkında soru soruldu ve o da inanmaz bir şekilde şöyle cevap verdi: \"Sizden biri üç taş bulamaz mı?\" Araştırmacı, istitabah'ı istinja' olarak açıklıyor çünkü istita' yapan kişi nefsi temizleyerek kendini arındırıyor ve İbn Abdülberr'in şöyle dediğini aktarıyor: Bir grup ravî, bunu Malik'ten mursal bir hadiste rivayet etmiş, Urve'den, Ebu Hurayra'dan rivayet edenlerin ise \"ağır bir hata\" olduğunu söylüyor. Hişam konusunda ise ihtilaf var: Bir grup, bunu onun babasından mursal bir hadiste rivayet ederken, diğer bir grup ise Amr ibn Huzeyme'den, Amarah ibn Huzeyme'den, Huzeyme ibn Sabit'ten rivayet eder. İbn el-Mübarek her iki hadisi de rivayet etmiştir ki bu da bunların iki ayrı hadis olduğunu gösterir (el-Temhid 22/310–312). Araştırmacı, Ahmed, Ebu Davud (40) ve el-Nesai'nin derlemelerinde Urve'den, o da Aişe'den rivayet edilen Müslim ibn Kurt'un rivayetinden bahsetmektedir. {cite:muwatta-maruf-1997 s.64} {cite:muwatta-maruf-1997 s.65}"
  id: "Hadits pertama dalam surah tentang wudhu lengkap. Diriwayatkan oleh Yahya dari Malik dari Hisham ibn Urwah dari ayahnya, dalam hadits mursal: Nabi ditanya tentang istitabah, yaitu istinja’, dan beliau menjawab dengan tidak percaya: “Tidakkah salah seorang dari kalian menemukan tiga batu?” Peneliti menjelaskan istitabah sebagai istinja’ karena orang yang melakukan istita’ membersihkan dirinya dengan menghilangkan najis, dan ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa sekelompok perawi meriwayatkannya atas otoritas Malik dalam hadits mursal, dan bahwa riwayat dari mereka yang meriwayatkannya atas otoritas Urwah atas otoritas Abu Hurayrah adalah “kesalahan besar,” dan bahwa ada perbedaan pendapat mengenai Hisham dalam hal ini: satu kelompok meriwayatkannya atas otoritasnya atas otoritas ayahnya dalam hadits mursal, dan kelompok lain atas otoritas Amr ibn Khuzaymah atas otoritas Amarah ibn Khuzaymah atas otoritas Khuzaymah ibn Thabit, dan bahwa Ibnu al-Mubarak meriwayatkan kedua hadits tersebut, yang menunjukkan bahwa keduanya adalah dua hadits (al-Tamhid 22/310–312); dan peneliti menyebutkan riwayat Muslim ibn Qurt dari Urwah dari Aisyah dalam koleksi Ahmad, Abu Dawud (40) dan al-Nasa’i. {cite:muwatta-maruf-1997 p.64} {cite:muwatta-maruf-1997 p.65}"
