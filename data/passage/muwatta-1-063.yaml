label: { ar: "الموطأ 63 — الاستطابة: أو لا يجد أحدكم ثلاثة أحجار؟", en: "Muwatta 63" }
text: "أو لا يجد أحدكم ثلاثة أحجار؟"
summary:
  ar: "أول حديث في باب جامع الوضوء. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه مرسلاً: سُئل النبي عن الاستطابة، أي الاستنجاء، فأجاب مستنكراً: أو لا يجد أحدكم ثلاثة أحجار؟ ويفسر المحقق الاستطابة بالاستنجاء لأن المستنجي تطيب نفسه بإزالة الخبث، وينقل عن ابن عبد البر أن جماعة الرواة رووه عن مالك مرسلاً، وأن رواية من جعله عن عروة عن أبي هريرة «غلط فاحش»، وأن هشاماً اختُلف عليه فيه: طائفة ترويه عنه عن أبيه مرسلاً، وطائفة عن عمرو بن خزيمة عن عمارة بن خزيمة عن خزيمة بن ثابت، وأن ابن المبارك روى الحديثين جميعاً فدل على أنهما حديثان (التمهيد 22/310–312)؛ ويذكر المحقق رواية مسلم بن قرط عن عروة عن عائشة عند أحمد وأبي داود (40) والنسائي. {cite:muwatta-maruf-1997 p.64} {cite:muwatta-maruf-1997 p.65}"
