label: { ar: "مسلم 1381 — المدينة خير لهم لو كانوا يعلمون", en: "Muslim 1381 — Medina is better for them if they only knew" }
text: "سمع سفيان بن أبي الزبير رسول الله يقول: «يفتح اليمن فيأتي قوم يبسون فيتحملون بأهليهم ومن أطاعهم، والمدينة خير لهم لو كانوا يعلمون؛ ثم يفتح الشام... ثم يفتح العراق... والمدينة خير لهم لو كانوا يعلمون»"
summary:
  ar: "رواية سفيان بن أبي الزبير الشنائي في كتاب الحج من صحيح مسلم؛ التحذير من ترك المدينة عند فتوح اليمن والشام والعراق — من نصوص فضل المدينة ومنزلة العمران النبوي."
