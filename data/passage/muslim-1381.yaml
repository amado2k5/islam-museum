label: { ar: "مسلم 1381 — المدينة خير لهم لو كانوا يعلمون", en: "Muslim 1381 — Medina is better for them if they only knew", es: "Musulmán 1381 — Medina es mejor para ellos si tan solo supieran", fr: "Muslim 1381 — Médine serait meilleure pour eux s'ils savaient seulement", ur: "مسلم 1381 - مدینہ ان کے لیے بہتر ہے اگر وہ جانتے", tr: "Müslim 1381 — Eğer bilselerdi Medine onlar için daha hayırlı olurdu.", id: "Muslim 1381 — Madinah akan lebih baik bagi mereka jika mereka mengetahuinya" }
text: "سمع سفيان بن أبي الزبير رسول الله يقول: «يفتح اليمن فيأتي قوم يبسون فيتحملون بأهليهم ومن أطاعهم، والمدينة خير لهم لو كانوا يعلمون؛ ثم يفتح الشام... ثم يفتح العراق... والمدينة خير لهم لو كانوا يعلمون»"
summary:
  ar: "رواية سفيان بن أبي الزبير الشنائي في كتاب الحج من صحيح مسلم؛ التحذير من ترك المدينة عند فتوح اليمن والشام والعراق — من نصوص فضل المدينة ومنزلة العمران النبوي."
  tr: "Sahih Müslim'deki Hac Kitabı'nda Sufyan ibn Abi al-Zubayr al-Shana'i'nin rivayeti; Yemen, Suriye ve Irak'ın fetihleri sırasında Medine'den ayrılmaya karşı uyarı - Medine'nin fazileti ve Peygamber medeniyetinin statüsü hakkındaki metinlerden."
  id: "Riwayat Sufyan ibn Abi al-Zubayr al-Shana’i dalam Kitab Haji dari Sahih Muslim; peringatan agar tidak meninggalkan Madinah selama penaklukan Yaman, Suriah, dan Irak — dari teks-teks tentang keutamaan Madinah dan kedudukan peradaban Nabi."
