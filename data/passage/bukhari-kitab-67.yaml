  en: "Sahih al-Bukhari, Book 67: Wedlock, Marriage (Nikaah)"
  ur: "صحیح بخاری، کتاب النکاح"
  es: "Sahih al-Bukhari, Libro 67: Matrimonio, Matrimonio (Nikaah)"
