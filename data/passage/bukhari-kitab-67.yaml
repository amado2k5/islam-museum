summary:
  ar: "القسم 67 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النكاح»، ويضم فيها النصوص من 5063 إلى 5250 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 67 of Sahih al-Bukhari (Wedlock, Marriage (Nikaah)) in the division of the open hadith dataset the museum took its reports from: reports 5063 to 5250 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 67، عنوان «کتاب النکاح»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5063 تا 5250۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 67 de Sahih al-Bukhari (Matrimonio (Nikaah)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5063 al 5250, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih al-Bukhari (Livre 67, « Mariage » ou « Nikaah »), dans la base de données ouverte: les hadiths 5063 à 5250 y sont répertoriés. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
