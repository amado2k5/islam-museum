text: "… خالة وكان عيسى يلبس الصوف، وكان يحيى يلبس الوبر ولم يكن لواحد منهما دينار ولا درهم ولا عبد ولا أمة ولا مأوى يأويان إليه، أين ما جنهما الليل أويا، فلما أرادا أن يتفرقا قال يحيى : أوصني. قال : لا …"
summary:
