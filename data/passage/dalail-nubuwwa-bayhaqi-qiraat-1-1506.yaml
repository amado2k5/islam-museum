text: "… حدثنا يزيد بن زُرَيع قال : أخبرنا سعيد عن قتادة عن أنس بن مالك : أنَّ رِعْلًا وَذَكوان وعُصَيّة وبني لحيانَ استمدُّوا رسولَ اللّٰه وَله لى عَدُرٍّ، فأمَّدهم رسولُ اللّه يَلفِ بسبعين من الأنْصار كنَّا نسمّيهمُ القراءَ في زمانهم، كانوا …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1506، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 1506, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 1506 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
