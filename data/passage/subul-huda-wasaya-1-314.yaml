text: "… وحام ويافث، فولد سام العرب وفارس والروم والخيرُ فيهم، وولد يافث يأجوج ومأجوج والترك والصقَالبة ولا خير فيهم، وولد حام القبط والبربر، والسودان. وسنده ضعيف. قال النووي: لما حضرت نوحاً الوفاة أَوصى إِلى ولده سام، وكان ولد قبل الطوفان بثمانية …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 314، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
