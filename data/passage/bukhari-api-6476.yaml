label: { ar: "صحيح البخاري 6476 — عمل معلَّق بالإيمان بالله واليوم الآخر", en: "Sahih al-Bukhari 6476 — an act tied to belief in God and the Last Day", ur: "صحیح بخاری 6476 — اللہ اور یومِ آخرت پر ایمان سے جڑا عمل", es: "Sahih al-Bukhari 6476 — un acto vinculado a la creencia en Dios y el Último Día", fr: "Sahih al-Bukhari 6476 — un acte lié à la croyance en Dieu et au Jour dernier" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا لَيْثٌ، حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ، عَنْ أَبِي شُرَيْحٍ الْخُزَاعِيِّ، قَالَ سَمِعَ أُذُنَاىَ، وَوَعَاهُ، قَلْبِي النَّبِيَّ يَقُولُ \" الضِّيَافَةُ ثَلاَثَةُ أَيَّامٍ جَائِزَتُهُ \". قِيلَ مَا جَائِزَتُهُ قَالَ \" يَوْمٌ وَلَيْلَةٌ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا، أَوْ لِيَسْكُتْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6476، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6476 (To make the Heart Tender (Ar-Riqaq)), that mentions an act tied to belief in God and the Last Day. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6476، جس میں اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6476 (Para ablandar el corazón (Ar-Riqaq)), menciona un acto vinculado a la fe en Dios y el Último Día. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 6476 (Pour attendrir le cœur (Ar-Riqaq)), mentionne un acte lié à la croyance en Dieu et au Jour dernier. Le Navigateur des Piliers et des Branches de la Foi le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'Islam, les piliers de la foi, les branches de la foi et les qualités du croyant."
