text: "… على الحروف المُعْجَمَة كالمُغْرِب و الأساس، حَذَرًا في م: أبد، خطأ، والمثبت من الأصل. تفاريق العصا عند العرب: أنَّ العصا إذا انكسرت جُعلت أشظةً، ثم تجعل الأشظةُ أوتاداً، ثم تجعل الأوتاد توادي للصرار، يقال: هو خيرٌ من تفاريق العصا. لسان …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 52، يذكر نقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 52, that mentions the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 52 کا اقتباس جس میں مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen 1, pág. 52, que menciona los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Kashf al-Zunun de Hajji Khalifa, volume 1, page 52, mentionne la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation automatique, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l’écriture du Coran."
  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin 1. resimli cildinin 52. sayfasında, Kur'an'ın diyakritik işaretleri ve biçiminden bahsedilmektedir; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Kashf al-Zunun karya Haji Khalifa, jilid 1 bergambar, halaman 52, menyebutkan tanda diakritik dan bentuk Al-Qur'an; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan diakritik."
