label: { ar: "سنن أبي داود 1069 — الأب والأبوة", en: "Sunan Abi Dawud 1069 — the father and fatherhood", ur: "سنن ابی داؤد 1069 — باپ اور والدیت" }
text: "… قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا ابْنُ إِدْرِيسَ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنْ مُحَمَّدِ بْنِ أَبِي أُمَامَةَ بْنِ سَهْلٍ، عَنْ أَبِيهِ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ كَعْبِ بْنِ مَالِكٍ، - وَكَانَ قَائِدَ أَبِيهِ بَعْدَ مَا ذَهَبَ بَصَرُهُ عَنْ أَبِيهِ، كَعْبِ بْنِ مَالِكٍ أَنَّهُ كَانَ إِذَا سَمِعَ النِّدَاءَ، يَوْمَ الْجُمُعَةِ تَرَحَّمَ لأَسْعَدَ بْنِ زُرَارَةَ. فَقُلْتُ لَهُ إِذَا سَمِعْتَ النِّدَاءَ، …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1069، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1069 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1069، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
