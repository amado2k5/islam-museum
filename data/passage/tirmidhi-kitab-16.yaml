summary:
  ar: "القسم 16 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الديات عن رسول الله»، ويضم فيها النصوص من 1386 إلى 1422 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 16 of Jami' al-Tirmidhi (The Book on Blood Money) in the division of the open hadith dataset the museum took its reports from: reports 1386 to 1422 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 16، عنوان «کتاب الدیات عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1386 تا 1422۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 16 de Jami' al-Tirmidhi (El libro sobre el dinero manchado de sangre) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1386 al 1422, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 16 de Jami' al-Tirmidhi (Le Livre du prix du sang), dans la section du recueil ouvert de hadiths: les hadiths 1386 à 1422 de cette numérotation. Le musée classe ses archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
