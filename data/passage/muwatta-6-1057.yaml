text: "رأيت رسول الله رمل من الحجر الأسود حتى انتهى إليه ثلاثة أطواف"
summary:
  ar: "أول حديث في باب الرمل في الطواف. يرويه مالك عن جعفر بن محمد عن أبيه عن جابر بن عبد الله، أنه قال: رأيت رسول الله رمل من الحجر الأسود حتى انتهى إليه ثلاثة أطواف. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1281)، وأنه في صحيح مسلم عن ابن عمر وجابر، وعند أحمد وابن خزيمة والشافعي وغيرهم. {cite:muwatta-maruf-1997 p.489}"
