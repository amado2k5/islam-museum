label: { ar: "الموطأ 1057 — جابر بن عبد الله: رأيت رسول الله رمل من الحجر الأسود حتى انتهى إليه ثلاثة أطواف", en: "Muwatta 1057", es: "Muwatta 1057", fr: "Muwatta 1057", ur: "موطا 1057", tr: "El-Muvatta 1057 — Cabir ibn Abdullah: Allah'ın Resulü'nün Kara Taş'tan oraya üç kez hızlı adımlarla yürüdüğünü gördüm.", id: "Al-Muwatta 1057 — Jabir ibn Abdullah: Aku melihat Rasulullah SAW berjalan cepat dari Batu Hitam hingga beliau sampai di sana tiga kali." }
text: "رأيت رسول الله رمل من الحجر الأسود حتى انتهى إليه ثلاثة أطواف"
summary:
  ar: "أول حديث في باب الرمل في الطواف. يرويه مالك عن جعفر بن محمد عن أبيه عن جابر بن عبد الله، أنه قال: رأيت رسول الله رمل من الحجر الأسود حتى انتهى إليه ثلاثة أطواف. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1281)، وأنه في صحيح مسلم عن ابن عمر وجابر، وعند أحمد وابن خزيمة والشافعي وغيرهم. {cite:muwatta-maruf-1997 p.489}"
  id: "Hadits pertama tentang raml (berjalan cepat) saat tawaf (mengelilingi Ka'bah). Diriwayatkan oleh Malik dari Ja'far bin Muhammad, dari ayahnya, dari Jabir bin Abdullah, yang berkata: \"Aku melihat Rasulullah shalla Allahu alaihi wa sallam melakukan raml dari Batu Hitam hingga sampai di sana, menyelesaikan tiga putaran.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1281), dan terdapat dalam Sahih Muslim dari Ibnu Umar dan Jabir, serta terdapat dalam kumpulan hadits Ahmad, Ibnu Khuzaymah, al-Shafi'i, dan lainnya. {cite:muwatta-maruf-1997 p.489}"
