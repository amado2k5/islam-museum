label: { ar: "سنن أبي داود 5066 — اليتيم وفقد الأب", en: "Sunan Abi Dawud 5066 — the orphan and the father lost", ur: "سنن ابی داؤد 5066 — یتیم اور باپ کی موت", es: "Sunan Abi Dawud 5066 — El huérfano y el padre perdido", fr: "Sunan Abi Dawud 5066 — L'orphelin et le père perdus" }
text: "… أُمِّ الْحَكَمِ، أَوْ ضُبَاعَةَ ابْنَتَىِ الزُّبَيْرِ حَدَّثَهُ عَنْ إِحْدَاهُمَا، أَنَّهَا قَالَتْ أَصَابَ رَسُولُ اللَّهِ سَبْيًا فَذَهَبْتُ أَنَا وَأُخْتِي وَفَاطِمَةُ بِنْتُ النَّبِيِّ إِلَى النَّبِيِّ فَشَكَوْنَا إِلَيْهِ مَا نَحْنُ فِيهِ وَسَأَلْنَاهُ أَنْ يَأْمُرَ لَنَا بِشَىْءٍ مِنَ السَّبْىِ. فَقَالَ رَسُولُ اللَّهِ \" سَبَقَكُنَّ يَتَامَى بَدْرٍ \". ثُمَّ ذَكَرَ قِصَّةَ التَّسْبِيحِ قَالَ عَلَى أَثَرِ كُلِّ صَلاَةٍ لَمْ يَذْكُرِ النَّوْمَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 5066، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5066 (General Behavior (Kitab Al-Adab)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5066، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5066 (Conducta General (Kitab Al-Adab)), menciona al huérfano y al padre ausente. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre la figura paterna."
  fr: "Un hadith du Sunan Abi Dawud, n° 5066 (Guide des mœurs), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
