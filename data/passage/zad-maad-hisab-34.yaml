text: "… أولاده توفي قبلَه إلا فاطمة، فإنها تأخرت بعده بستة أشهر [البخاري: ٣٦٢٥، ومسلم: ٤٥٨٢] فرفع اللَّه لها بصبرها واحتسابها من الدرجات ما فُضِّلَتْ به على نساء العالمين . وفاطمة أفضلُ بناته على الإطلاق، وقيل : إنها أفضل نساء العالمين، وقيل …"
