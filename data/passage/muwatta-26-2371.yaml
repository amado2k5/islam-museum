label: { ar: "الموطأ 2371 — مالك: المدبر المسلم للمجروح مع دين على السيد", en: "Muwatta 2371", es: "Muwatta 2371", fr: "Muwatta 2371", ur: "موطا 2371", tr: "El-Muvatta 2371 — Malik: Efendisine borçlu olan ve zarar gören kişinin işlerini yöneten Müslüman.", id: "Al-Muwatta 2371 — Malik: Seorang Muslim yang mengurus urusan orang yang dirugikan karena memiliki hutang kepada majikannya" }
summary:
  ar: "قال مالك في المدبر إذا جرح رجلا فأسلمه سيده إلى المجروح، ثم هلك سيده وعليه دين ولم يترك مالا غيره: قال الورثة نسلمه إلى صاحب الجرح، وقال صاحب الدين أنا أزيد على ذلك؛ فإن الغريم إذا زاد شيئا فهو أولى به، ويُحط عمن عليه الدين قدر ما زاد الغريم على دية الجرح. فإن لم يزد شيئا لم يأخذ العبد. {cite:muwatta-maruf-1997 p.377}"
  tr: "Malik, efendisinin ölümü üzerine azat edilecek bir köle hakkında şöyle demiştir: Eğer bir köle birini yaralarsa ve efendisi onu yaralıya teslim ederse, efendisi de borçlu olarak ve başka mal varlığı bırakmadan ölürse: Mirasçılar, \"Onu yaralayana teslim edeceğiz\" derler, alacaklı ise, \"Ben bundan daha fazlasını ödeyeceğim\" der. Çünkü alacaklı bir şey eklerse, o şeye öncelik hakkı olur ve borçlunun borcu, alacaklının yara için kan parasına eklediği miktar kadar azalır. Eğer hiçbir şey eklemezse, köleyi alamaz. {cite:muwatta-maruf-1997 s.377}"
  id: "Malik berkata mengenai seorang budak yang akan dibebaskan setelah kematian tuannya: Jika ia melukai seseorang dan tuannya menyerahkannya kepada orang yang terluka itu, dan kemudian tuannya meninggal dunia dengan hutang dan tidak meninggalkan harta benda lain: Para ahli waris berkata, \"Kami akan menyerahkannya kepada orang yang melukainya,\" dan pemberi hutang berkata, \"Saya akan membayar lebih dari itu.\" Karena jika pemberi hutang menambahkan sesuatu, ia memiliki prioritas atas hal itu, dan hutang orang yang berhutang dikurangi dengan jumlah yang ditambahkan pemberi hutang pada uang ganti rugi atas luka tersebut. Jika ia tidak menambahkan apa pun, ia tidak mengambil budak itu. {cite:muwatta-maruf-1997 p.377}"
