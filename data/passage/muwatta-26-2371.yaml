label: { ar: "الموطأ 2371 — مالك: المدبر المسلم للمجروح مع دين على السيد", en: "Muwatta 2371" }
summary:
  ar: "قال مالك في المدبر إذا جرح رجلا فأسلمه سيده إلى المجروح، ثم هلك سيده وعليه دين ولم يترك مالا غيره: قال الورثة نسلمه إلى صاحب الجرح، وقال صاحب الدين أنا أزيد على ذلك؛ فإن الغريم إذا زاد شيئا فهو أولى به، ويُحط عمن عليه الدين قدر ما زاد الغريم على دية الجرح. فإن لم يزد شيئا لم يأخذ العبد. {cite:muwatta-maruf-1997 p.377}"
