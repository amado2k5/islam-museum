label: { ar: "الموطأ 1556 — مالك: يحصن العبد الحرة إذا مسها بنكاح، ولا تحصن الحرة العبد إلا أن يعتق وهو زوجها فيمسها بعد عتقه", en: "Muwatta 1556", es: "Muwatta 1556", fr: "Muwatta 1556", ur: "موطا 1556", tr: "El-Muvatta 1556 — Malik: Bir köle, evlilik yoluyla cinsel ilişkiye girdiği bir aziz kadınla cinsel ilişkiye girebilir; ancak bir aziz kadın, köle azat edildikten sonra onunla cinsel ilişkiye girmedikçe, onunla cinsel ilişkiye giremez." }
summary:
  ar: "يقول مالك يحصن العبد الحرة إذا مسها بنكاح، ولا نحصن الحرة العبد، إلا أن يعتق وهو زوجها فيمسها بعد عتقه. فإن فارقها قبل أن يعتق فليس بمحصن حتى يتزوج بعد عتقه، ويمس امرأته. {cite:muwatta-maruf-1997 p.49}"
  tr: "Malik, bir kölenin özgür bir kadınla cinsel ilişkiye girmesi halinde evli sayıldığını, ancak bir kölenin, köle onunla evliyken azat edilip sonradan onunla cinsel ilişkiye girmediği sürece özgür bir kadınla evli sayılmadığını söylüyor. Eğer köle azat edilmeden önce ondan ayrılırsa, azat edildikten sonra evlenip karısıyla cinsel ilişkiye girene kadar evli sayılmaz. {cite:muwatta-maruf-1997 s.49}"
