label: { ar: "الموطأ 2688 — أبو هريرة: الرجل الذي سقى الكلب من البئر فغفر له", en: "Muwatta 2688" }
summary:
  ar: "يروي مالك عن سمي مولى أبي بكر عن أبي صالح السمان عن أبي هريرة أن رسول الله قال: بينما رجل يمشي بطريق إذ اشتد عليه العطش، فوجد بئرا فنزل فيها فشرب وخرج، فإذا كلب يلهث يأكل الثرى من العطش، فقال: لقد بلغ هذا الكلب من العطش مثل الذي بلغ مني، فنزل البئر فملأ خفه ثم أمسكه بفيه حتى رقي فسقى الكلب، فشكر الله له فغفر له. فقالوا: يا رسول الله، وإن لنا في البهائم لأجرا؟ قال: في كل كبد رطبة أجر. {cite:muwatta-maruf-1997 p.518} {cite:muwatta-maruf-1997 p.519}"
