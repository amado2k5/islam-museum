label: { ar: "الموطأ 2665 — ربيعة عن أنس: صفة النبي وعمره وشيبه", en: "Muwatta 2665", es: "Muwatta 2665", fr: "Muwatta 2665", ur: "موطا 2665", tr: "El-Muvatta 2665 — Rabi’ah, Enes’in rivayetine göre: Peygamber’in tanımı, yaşı ve beyaz saçları", id: "Al-Muwatta 2665 — Rabi’ah berdasarkan riwayat Anas: Gambaran Nabi, usia, dan uban" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن أنس بن مالك أنه سمعه يقول: كان رسول الله ليس بالطويل البائن ولا بالقصير، وليس بالأبيض الأمهق ولا بالآدم، وليس بالجعد القطط ولا بالسبط. بعثه الله على رأس أربعين سنة، فأقام بمكة عشر سنين، وبالمدينة عشر سنين، وتوفاه الله على رأس ستين سنة، وليس في رأسه ولحيته عشرون شعرة بيضاء. ويذكر المحقق أن قوله «على رأس ستين» رواية شاذة، والمحفوظ أنه توفي وهو ابن ثلاث وستين، وأن البخاري قال: هذا عندي أصح من حديث ربيعة. {cite:muwatta-maruf-1997 p.505}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da Enes ibn Malik'ten rivayet ederek, şöyle dediğini işittiğini aktarır: \"Allah'ın Resulü ne aşırı uzun ne de aşırı kısa, ne aşırı beyaz ne de aşırı koyu tenli, ne kıvırcık ne de düz saçlıydı. Allah onu kırk yaşında peygamber olarak gönderdi ve on yıl Mekke'de, on yıl da Medine'de kaldı. Allah onu altmış yaşında vefat ettirdi ve başında veya sakalında yirmi beyaz kıl bile yoktu.\" Araştırmacı, \"altmış yaşında\" ifadesinin anormal bir rivayet olduğunu ve yerleşik görüşün onun altmış üç yaşında vefat ettiği yönünde olduğunu ve Buhari'nin \"Bence bu, Rabi'ah hadisinden daha sahihtir\" dediğini belirtir. {cite:muwatta-maruf-1997 s.505}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi 'Abd al-Rahman, dari Anas ibn Malik, bahwa ia mendengar beliau berkata: \"Rasulullah tidak terlalu tinggi atau pendek, tidak terlalu putih atau gelap, tidak keriting atau lurus. Allah mengutusnya sebagai nabi pada usia empat puluh tahun, dan beliau tinggal di Mekah selama sepuluh tahun dan di Madinah selama sepuluh tahun. Allah menyebabkan beliau wafat pada usia enam puluh tahun, dan tidak ada dua puluh helai rambut putih di kepala atau janggutnya.\" Peneliti menyebutkan bahwa pernyataan \"pada usia enam puluh tahun\" adalah riwayat yang anomali, dan pandangan yang mapan adalah bahwa beliau wafat pada usia enam puluh tiga tahun, dan bahwa al-Bukhari berkata: \"Ini lebih sahih menurut pendapat saya daripada hadits Rabi'ah.\" {cite:muwatta-maruf-1997 p.505}"
