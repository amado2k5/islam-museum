label: { ar: "الموطأ 2665 — ربيعة عن أنس: صفة النبي وعمره وشيبه", en: "Muwatta 2665" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن أنس بن مالك أنه سمعه يقول: كان رسول الله ليس بالطويل البائن ولا بالقصير، وليس بالأبيض الأمهق ولا بالآدم، وليس بالجعد القطط ولا بالسبط. بعثه الله على رأس أربعين سنة، فأقام بمكة عشر سنين، وبالمدينة عشر سنين، وتوفاه الله على رأس ستين سنة، وليس في رأسه ولحيته عشرون شعرة بيضاء. ويذكر المحقق أن قوله «على رأس ستين» رواية شاذة، والمحفوظ أنه توفي وهو ابن ثلاث وستين، وأن البخاري قال: هذا عندي أصح من حديث ربيعة. {cite:muwatta-maruf-1997 p.505}"
