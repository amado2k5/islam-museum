text: "حدثنا عبدالله حدثنا أبي حدثنا عبدالله بن إدريس انبأنا حصين عن بكر ابن عبداللّه قال البذاء من الجفاء والجفاء في النار والحياء من الايمان والايمان في الجنة. حدثنا عبدالله حدثني أبي حدثنا عبداللّه بن ادريس انبأنا حصين عن بكر ابن …"
summary:
