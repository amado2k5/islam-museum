text: "… بالفتح يَسْعَدُ سُعودًا. والسُّعودَةُ: خلافُ النُّحوسَةِ. واسْتَسْعَدَ الرجل برؤية فلانٍ، أي: عدَّه سَعْدًا. والسَّعادَةُ: خلاف الشَّقاوَةِ، تقول منه : سَعِدَ الرجل بالكسر، فهو سَعِيدٌ، مثل: سَلِمَ فهو سَلِيمٌ، وسُعِدَ بالضم فهو مَسْعُودٌ. وقرأ الكسائي: وَأَمَّا الَّذِينَ سُعِدُوا هود : وأسْعَدَهُ …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 1، ص 538، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 1, p. 538, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الصحاح، جوہری، اسکین جلد 1، ص 538 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Sihah de al-Jawhari, volumen 1, pág. 538, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de l'ouvrage d'al-Jawhari, al-Sihah (tome 1, p. 538), mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Cevheri'nin Resimli Cilt 1, sayfa 538'deki El-Sahah adlı eserinden, Kur'an okunuşlarını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Sahah karya Al-Jawhari, Jilid Bergambar 1, hlm. 538, yang menyebutkan bacaan Al-Qur'an; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
