text: "نوا يصنعون يوم الحساب، وسيعاقبهم على صنيعهم. ⁦(١٥)⁩ يا أهل الكتاب من اليهود والنصارى، قد جاءكم رسولنا محمد صلى الله عليه وسلم يبين لكم كثيرا مما كنتم تخفونه عن الناس مما في التوراة والإنجيل، ويترك بيان ما لا تقتضيه الحكمة."
