text: ". - باب في شح المرء بدينه السادس عشر من شعب الإيمان وهو باب في شح المرء بدينه حتى يكون القذف في النار أحب إليه من الكفر وذلك لما جاء عن النبي وَل لي فيما - أخبرنا أبو عبد اللّٰه …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 235، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 235, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 235 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Shu'ab al-Iman de al-Bayhaqi, vol. 2, pág. 235, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 2, page 235, mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "El-Beyhakî'nin \"İmanın Dalları\" adlı eserinin 2. cildinin 235. sayfasından bir alıntı, imanın dallarından bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu alıntı, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 235, menyebutkan cabang-cabang iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
