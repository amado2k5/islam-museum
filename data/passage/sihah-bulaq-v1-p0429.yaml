text: |-
  ٢١٢
  ⁦(ياب الدال)⁩
  ⁦(برد)⁩
  التامة القصب قال الراجز
  قامت تريك خشية أن تصرما • ساقايخنداة وكعبا أدرما
  وكذلك اليخندى والخيندى والياء لللحاق بسفرجل قال الراجز
  تمشى كشى الوحل المبهور • الى خبندى قصب ممكوز
  ( بدد بده يبده بدافرقه والتبديد التفريق يقال شمل مبدد وتبدد الشى تفرق والبدة
  بالكسر القوة والبدة أيضا النصيب تقول منه أبدبينهم العطاء أى أعلى كل واحدة منهم بدنه
  وفى المديث أيذيم-م تمرة تمرة يقال فى السخلتين أيدهما نعجتين أى اجعل اكل واحد منهما
  نعجة ترضعه اذا لم تكفهما نيجة واحدة وأبديده الى الارض مدها واستبد فلان يكذا أى اتفرد
  به والبداد بالفتح البراز يقال لو كان البداد لما أطاقونا أى لوبارزناهم رجل ورجل وقولهم
  فى الحرب يا قوم بداد بداد أى ليأخذ كل رجل قبرنه واغمابنى هذا على الكسر لانه اسم لفعل
  الامروه ومبنىّ ويقال انما كسر لاجتماع الساكنين لانه واقع موقع الامر يقال منه تبادّ
  القوم يتبادّون اذا أخذوا أقراهم ويقال أيضالة وابدادهم أى أعدادهم لكل رجل رجل
  وقواه-م جاءت الخيل بداد أى متبددة وبنى أيضاعلى الكسر لانه معدول عن
  المصدر وه والبددقال الشاءر عوف بن الخرع والخيل تعدوفى الصغيد بداد وتفرق
  القوم بداد أى متبددة قال الشاعر حسان بن ثابت
  كتائمانية وكانواجحفلا • لحبافشلوا بارماح بداد
  واعمابنى للعدل والتأنيث والصفة فلما منع بعلتين من الصرف بنى بثلاث لانه ليس بعد المنع
  من الصرف الامنع الاعراب وتقول السبعان يبتدان الرجل ابتدادا اذا أتياهمن جانبيه
  وكذلك الرضحان يبتدان أمهما ولا يقال يبمدها ابنها ولكن يبتدها ابتاها وقدلق الرجلان
  زيدافا بتذاه بالضرب أى أخذاه من جانبيه وبايعته بدادا اذا بعته معارضة وكذلك
  باددته فى البيع مبادة وبدادا وقواهم مالك بهبددوبدة أى مالك به طاقة ابن السكيت البدد
  فى الناس ساعدما بين الفخدين من كثرة لجهما قال وفى ذوات الاربع تساعدمابين اليدين
  تقول منه بددت بإرجل بالكسر فأنت أبد وبقرة بداء والابد الرجل العظيم الخلق والمرأة.
  بداءقال أبو نخيلة ألتيمشى مشية الابد والبادان باطنا الفخذين وكل من فرج بين
  رجليه فقد بدهما ومنه استقاق بداد السرح والقتب بكسر الباء وهما بدادان وبديدان
  والجمع بدائدوأ بدة تقول بدقتبه يبده وهو أن يتخسذخر بعلتين فيحشوه_ما فيجعلهما تحت
  الاحناء اشلايدبر اللحشب البجير والبديدان الحرجان والبديد المفازة الواسعة وقولهم
  لا يدّ من كذا كأندقال لافراق منه ويقال البد العوض والبدالصم فارىّ معرب
  والجمع البددة القرّامطير أناديدويباديد أى مغترق وأنسد
  كأغما أهل حجر نظرون متى • يرونى خار جاطيريباديده
  رد البرد نقيض المتروالبرودة نقيض الحرارة وقدبروالشئء بالضم وبردته أنافه ومبرود
  وبردته تبريد اولا يقال أبردته الافى لغة رديئة قال الشاءر ملك بن الريب
  وعطل قلومى فى الركاب فانها * ستبردأ كبادا وتسكى بواكيا
  وسقيته شربة بردت فؤاده تبرده بردا وقوالهم لا تبرد عن فلان أى ان ظلّك قلا تشمه
  فينتقص
