text: "… من ماه يهبط. من الجبل - فقالت: بأبى أَنت أَتخاف على الصبيّة من ذى الشَّرى سيئا ؟ قلت: لا، أنا ضامن لمما أصابك. قال : فذهبَت فاغتسلت ثم جاءت نعرضتُ عليها الإسلام فأسلمت، ثمّ دعوتُ دَوْسًا إلى الإِسلام فأبطأوا على، …"
