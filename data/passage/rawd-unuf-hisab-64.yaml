text: "… أسواه المثلان ! فاعرفوا . هُمّ دَرَجاتٌ. عِنْدَ الهِ ، واللهُ بَصِيرٌ بِما يَعْمَلُونَ لكلّ درجات مما عملوا فى الجنة والنار : أى إن اللّٰه لا يخفى عليه أهل طاعته من أهل معصيته . فضل اللّٰه عَلَى الناس يبعث الرسل …"
