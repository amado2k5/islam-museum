text: "… وهذا لفظ البخَاري. الدَّفُّ بالفاءِ : صوْتُ النَّعْلِ وَحَرَكَتُهُ عَلى الأرْضِ، واللَّه أَعلم. - باب فضل يوم الجمعة ووجوبها والاغتسال لها والطيب والتبكير إليها والدعاء يوم الجمعة والصلاة على النبي وفيه بيانٍ ساعة الإجابة واستحباب إكثار ذكر اللَّه تعالى بَعد …"
