text: "… عبد اللّٰه بن عمرو بن حلحلة عن أبيه ورافع بن خديج أكشف الثوب عن وجهه، الحديث. وفيه: ما زالت أنهما قالا، قال رسول اللّٰه عليف: غسل يوم الجمعة الملائكة تظله بأجنحتها. واجب على كل محتلم والسواك. وروى الترمذي من حديث …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 921، يرد فيه ذكر ما وجب على كل مسلم، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 921, whose wording mentions a duty laid on every Muslim, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 921 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
