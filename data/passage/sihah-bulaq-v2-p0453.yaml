text: |-
  الذكة بالفتح والدكان بالضم قاله
  قوله ملفيا بالفاء والجيم يقال
  أننفج الرجل أى أفلس فهو ملفج
  بفتح الفاء مثل أحسن فهو
  محمن وأسهب فهومسهب
  فهذه الثلاثة جات بالفتح توادر
  ا. .ومه
  قوله والدموك اسم فرس الخ فى
  القاموص وكصبور فرس عقبة
  ابن شيبان وأمّافى قول الرايز
  أنا ابن عمرووهي الدمول
  فليس باسم :ل صفة أى السريعة
  كما تسرع الرحى ووهم الجوهرى
  TrE
  وأراكُ وقال لسد
  وغيت بدكداك يزين وهاده • نيات كوش العبقرى" المخلب
  والجمع الدكادك والدكاديك قال الراجز
  بإدار مى بالدكاديك البرق * سقيافقد هيجت شوق المشتأق
  وحول دكيك أى تام والدكة والدكان الذى يقعد عليه قال الشاهر
  فأبق باطلى والحدمنها • كد كان الدرابنة المطين
  وناس يجغاون النون أصلية لت) دلكت الشئ بيدى أدلكه دلكارداكت
  الشهس دلو كازالت وقال تعالى أقم الصلاة لدلول الشمس الى غسسق الصل ويقال
  دلوكهاغروبهاوينشد
  هذا مقام قد مى رباح • ذبب حتى دلكت براح
  قال قطرب براح مثل قطام اسم للشهس وقال الفراءهى براح جع راحة وهى الصكف
  يقول يضع كفه على عبنيه ينظرهل غريت الشمس بعد ودالك الرجل غريمه أى ماطله وسئل
  الحسن أيد الا الرجل امرأته فقال نعم اذا كان ملفجايعى بالمهر والدلوكك مايدلك به من طيب
  وغيره والدليك التراب الذى تسفيه الريخ والدليك طعام يتخذ من زيد وتمر كالثريد وأنا أظنه
  الذى يقالله بالفارسبة جنكال خست وتدلك الرجل أى دلك جسد مهند الاغتسال
  وفرس مدلوك الحجبة اذا لم يكن لجيته اشراف ⁦(دلعك)⁩ الدلعك مثل الداهس وهى
  الناقة الضخمة مع استرخا فيها ⁦(دمك )⁩ قال الاصمحى الدموك البكرة السريعة
  وكذلك كل شسريع المرّوالدمن أسرع عد والارقب ورحى دمول سريعة الطهن
  والدموك اسم فرس وقال
  أنا ابن عمرووهى الدموك * حراء فى حاركه اسموك * كأنّ فاهاقتب مفكول
  ودمك المشئ يدمك دموكاأى صار أملس ويقال أصابتهم دامكة من دوامك الدهرأى
  داهية والمدمك المطعلة وهومايوسع به الخبز والمدماك الساف من البناء وأنشدالاصمى"
  ألا يإناقض الميثاق مسدما كاندما كا
  والدمكمك الشديد وربعاقالوارحى دمكمك أى شديدة الطحن ملك نصل مدمالك
  أى أملس مدوّر تقول منه دملكت الشئ فتدملك وحافر مدلكم:-ل مدملق ومدملج
  والدملوك الجر المدور ⁦(دوك)⁩ داك الطيب يدوكه دوكاومدا كاأى سحقه والمداك
  أيضاجر يسحق عليه الطيب قال الشاعر • فى جؤجؤ كد النالطيب مخضوب .
  والمدوك على منعل حج ريسحق به الطيب وبات القوم يدوكون دوكااذاباتوا فى اختلاط
  ودوران ووقعوا فى دوكة ودوكة أى خصومسة وشرّ وتداوك القوم أى تضاية وافى حرب أو
  شرّ هك قال ابن الاعرابى دهك الشئ يدهكدد هكااذا طحنه وكسره وأنشد
  رؤية - ردت رجيعابين أرحاء دهك • وهوجع دهود يك الديك معروف
  والجمع الديكة والديوك
  صل الراء بك ببكت الشئ أربكه ربكاخلطته فارتيك أى اختلط وارتيك
  الرجل
