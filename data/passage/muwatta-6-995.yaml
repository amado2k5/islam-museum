summary:
  ar: "قول لمالك: أما العمرة من التنعيم، فمن شاء أن يخرج من الحرم ثم يحرم فذلك مجزئ عنه إن شاء الله، ولكن الفضل أن يهل من الميقات الذي وقته رسول الله، أو ما هو أبعد من التنعيم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1133). {cite:muwatta-maruf-1997 p.467}"
