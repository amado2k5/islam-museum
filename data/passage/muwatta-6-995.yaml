label: { ar: "الموطأ 995 — مالك: أما العمرة من التنعيم فمن شاء أن يخرج من الحرم ثم يحرم فذلك مجزئ عنه، ولكن الفضل أن يهل من الميقات الذي وقت رسول الله أو ما هو أبعد من التنعيم", en: "Muwatta 995", es: "Muwatta 995", fr: "Muwatta 995", ur: "موطا 995", tr: "El-Muvatta 995 — Malik: Tanım'dan Umre'ye gelince, Haram'dan çıkıp sonra ihrama girmek isteyen kimse için bu yeterlidir. Ancak, Allah Resulü'nün belirlediği Mikat'tan veya Tanım'dan daha uzak bir yerden ihrama girmek daha faziletlidir.", id: "Al-Muwatta 995 — Malik: Adapun Umrah dari Al-Tan’im, barang siapa yang ingin meninggalkan Haram dan kemudian memasuki Ihram, itu sudah cukup baginya. Namun, lebih baik memasuki Ihram dari Miqat yang telah ditentukan oleh Rasulullah atau dari tempat yang lebih jauh dari Al-Tan’im." }
summary:
  ar: "قول لمالك: أما العمرة من التنعيم، فمن شاء أن يخرج من الحرم ثم يحرم فذلك مجزئ عنه إن شاء الله، ولكن الفضل أن يهل من الميقات الذي وقته رسول الله، أو ما هو أبعد من التنعيم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1133). {cite:muwatta-maruf-1997 p.467}"
  tr: "Malik şöyle demiştir: “Tan'im'den Umre'ye gelince, kim Haram'dan ayrılıp sonra ihrama girmek isterse, Allah'ın izniyle bu ona yeterlidir. Ancak, Allah Resulü tarafından belirlenen Mikat'tan veya Tan'im'den daha uzak bir yerden ihrama girmek daha faziletlidir.” Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (1133) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.467}"
  id: "Malik berkata: “Adapun Umrah dari al-Tan’im, siapa pun yang ingin meninggalkan Haram dan kemudian memasuki Ihram, itu sudah cukup baginya, insya Allah. Namun, lebih baik memasuki Ihram dari Miqat yang telah ditetapkan oleh Rasulullah, atau dari tempat yang lebih jauh dari al-Tan’im.” Peneliti menyebutkan bahwa Abu Mus’ab (1133) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.467}"
