label: { ar: "صحيح البخاري 6016 — ما لا يتم الإيمان إلا به", en: "Sahih al-Bukhari 6016 — what faith is not complete without", ur: "صحیح بخاری 6016 — جس کے بغیر ایمان مکمل نہیں", es: "Sahih al-Bukhari 6016 — lo que la fe no está completa sin" }
text: "… عَلِيٍّ، حَدَّثَنَا ابْنُ أَبِي ذِئْبٍ، عَنْ سَعِيدٍ، عَنْ أَبِي شُرَيْحٍ، أَنَّ النَّبِيَّ قَالَ \" وَاللَّهِ لاَ يُؤْمِنُ، وَاللَّهِ لاَ يُؤْمِنُ، وَاللَّهِ لاَ يُؤْمِنُ \". قِيلَ وَمَنْ يَا رَسُولَ اللَّهِ قَالَ \" الَّذِي لاَ يَأْمَنُ جَارُهُ بَوَايِقَهُ \". تَابَعَهُ شَبَابَةُ وَأَسَدُ بْنُ مُوسَى. وَقَالَ حُمَيْدُ بْنُ الأَسْوَدِ وَعُثْمَانُ بْنُ عُمَرَ وَأَبُو بَكْرِ بْنُ عَيَّاشٍ وَشُعَيْبُ بْنُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6016، يذكر ما لا يتم الإيمان إلا به. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6016 (Good Manners and Form (Al-Adab)), that mentions what faith is not complete without. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6016، جس میں جس کے بغیر ایمان مکمل نہیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6016 (Buenas costumbres y forma (Al-Adab)), menciona aquello sin lo cual la fe no está completa. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
