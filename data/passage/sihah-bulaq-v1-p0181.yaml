text: |-
  ٤٦٠١
  تقول الطيلسان بكسر اللام فلورخت هذا فى النداءلم يجزلانه ليس فى كلامهم فيعل بكسر
  العين الامعتلاغوسيدوميت مرس) الطمرس والطمروس الكذاب ( مس
  الطموس الدروس والامحاء وقدطمس العطاريق بطمس وبطعس وطمسته طمسا بتعدى
  ولا يتعد وانطمس الشى وتطمس أى امحى ودرس وقوله تعالى ربنا اطمس على أموالهم
  أى غيرها كما قال عزوجل من قبل أن نطمس وجوها ( ملس غيف طماس يتشديد
  اللام أى جاف قال ابن الاعرابى قلت للعقيلى ه-ل أكلت شيئا فقال قرصتين طماستين
  ( يس لعايس الكثير من المال والرمل والماء وغيرها قال الاخطل :
  خلو الناراذان والمزارعا * وحنطة طيساوكرمايانعا
  وقال آخريصف حيرا
  فصحت من شبرمان منهلا • أخضر طيسازغر بياطيسلا
  والطيسل مثل الطيس واللام زائدة وقول الراجز
  عددت قومى كعديد الطيس
  يعى الكثير من الرمل والطاس الذى يشرب فيه والطاوس طائر وبصغر على طويس بعد
  حذف الزيادات وقولهم أشأم من طويس وهو مخنث كان بالمدينة وقال يا أهل المدينسة
  توقعواخروج الدجال مادمت حيابين ظهرانيكم فاذاءت فقد أمنتم لانى ولدت فى الل.لة التى
  مات فيها رسول اللّٰه صلى اللّه عليه وسلم وقطمت فى اليوم الذى مات فيه أبو بكررضى اللّٰه عنه
  وبلغت الحلم فى اليوم الذى قتسل فيه عمررضى اللّٰه عنه وتزوجت فى اليوم الذى قتل فيه عثمان
  رضى اللّٰه عنه ورلد لى ولد فى اليوم الذى قتل فيه على رضى اللّه عنه وكان اسمه طاوس فلما
  تخنت جعله طويس طويسا ويسمى بعبد النعيم وقال فى نفسه
  اننى عبد النعيم أناطاوس الجيم • وأنا أشأم من يشى على ظهر الحطيم
  والطوس القمر وطاس بطوس طوسا حسن وجهه والطاوس فى كلام أهسل الشام الجي-ل
  من الرجال
  سل العين ع س بس الرجل يعبس عبوسا كلح وعبس وجهمشدّد لله بالغة
  والتعبس التجهم والعبس ما يتعلق فى أذناب الابل من أبو الها وأبعارها فيجف عليها قال
  جرير يصف امرأة ترى العبس الحولىّ جونا بكوعها * لهامسكامن غيرعاج ولاذبل
  يقال أعبست الابل أى صارت ذات عبس وقد عبس الوسخ فى يدفلان بالكسرأى يبس
  ويوم عبوس أى شديدوعبس أبو قبيلة من قيس وهوعبس بن بغيض بن ريث بن غطفان بن
  سعدين قيس عيلان والعنبس الاسدومنه "هى الرجل و«وفتعل من العبوس والعنابس من
  قريس أولاد أمية بن عبد شمس الاكبروهم ستة حرب وأبو حرب وصفيان وأبوسفيان وعمرو
  وآبو عمرو وسموا بالاسد والباقون يقال لهم الاعياص (عترس العترسة الاخذ بالشقة
  والعنف والعتريس الجبار والغضبان والعنتريس الناقسة الصلبة الشديدة والذون زائدة
  لانه مشتق من العترسة .⁦(عجس)⁩ العجس والعجس والعجس مقبض القوس وكذلك المعجس
  مثال المجلس وأماقول الراجز وقتية نبهتهم بالعجس فهوطائفة من وسط الليل كأنه مأخوذ
