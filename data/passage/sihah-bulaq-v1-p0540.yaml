text: |-
  أربعة أشهر نفف لبنها وفيه ثلاث اغات لجبة ولجبة ولجبة والجمع النجاب قال الشاعر
  محبت أبناؤنا من فعلنا • اذنبيع اللخيل بالمعزى اللجاب
  ولجبات أيضا بالتحريك وهو شاذ لانّ حقه التسكين الا أنه كان الاصل عندهم أنه اسم
  وصف به كما قالوا امرأة كلبة فجمع على الاصل ويكون لحبة فى الواحدلغة وقال ابن السكيت
  اللعبة النهجة التى قلّ"لبنها قال ولا يقال للعنزلجبة تقول منه لجبت الشاة بالضم وكذلك لجبت
  الشاة تلميبا ⁦( لحب)⁩ اللحب الطريق الواذج والا-ب مثله وهو فاعل بمعض مفعول
  أى ملحوب تقول منه لحبه يلحبه لحبا اذا وطته ومرفيه ويقال أيضالحب اذامر مر امستقيما
  قال ذوالرمة فانصاع جانبه الوحشى وانكدرت • يلحبن لا يأقلى المطلوب والطلب
  ولحبت اللحم عن العظم ولحبت العود ونحوه اذاقشرته قال الشاعر
  والقصب مضطمر والمتن مطوب والملحب كل شى يقشربه ويقطع قال الاعشى
  وأدفع عن أعراضكم وأعيركم • لسانا كراض اتطفاجى ملهبا
  ورجل علحب أيضااذا كان سبابا بذىّ اللسان والملحب المقطع واللهيب من الموق القليلة
  لحم الظهر عن أبى عبيد وقد لحب الرجل بالمكسراذا أنحله المكبر قال الشاءر
  عجوز ترجى أن تكون قتية ، وقدلطب الجنبان واحدودب الظهر
  وملحوب موضع قال أقفرمن اهله ملحوب لزب) طين لازب أى لازق تقول منه
  لزب الشى يلزب بالضم لزو باواللازب الثابت تقول صار الشئ ضربة لازب وهو أفصح من
  لازم قال النابغة
  ولا يحسبون الفير لاشرّ بعده • ولا يحسبون الشرّضربة لازب
  وأصابتهم لزبة أى شدّة وقحط والجمع اللزبات بالتسكين لانه صفة والملزاب البخيل الشديد
  وأنشد أبوعمرو " لاية رحون اذا ما نضخة وقعت • وهم كرام اذا اشتد الملازيب
  ورلسب لسبت العسل بالكسر ألبه لبا اذ العفته ودب بالشى مثل لصب به أى زق
  ولسبته العقرب بالفتح تلسبه لبا أى ادغنه واسبه أسواطا اى ضربه ⁦(لصب)⁩ ابن
  المكيت لصب سيفه يلصب لصبا اذا تشب فى الغمد فلا يخج واصب جلدفلان أيضااذا
  اصق باللعم من الهزال واللصب بالكسر الشعب الصغير فى الجبل وكل مضيق فى الجبل
  فهواصب واصاب ولهوب وفلان لحزاصب لا يكادبعطى شيئا واصب اللخاتم فى الاصبع وهو
  ضدقلق واللواصب فى شعر كثير الابار الضيقة البعيدة القدر (لعب اللعب معروف
  واللعبم:- له وقد لعب يلعب وتلعب لعب مرّة بعد أخرى ورجل تلعابة كثير اللعب والتلعاب
  بالفتخ المصدروبارية لعوب والالعوبة اللعب والملعب موضع اللعب واللعبة بالضم اعبة
  الشطرفج والتردوكل ملعوب به فهولعبة لانه اسم ومنه قواه-م اقعد حتى أفرغ من هذه
  اللعبة قال ثعلب. ن هذه اللعبة بالفتح أجود لانه أراد المرة الواحدة من اللعب واللعية
  بالكسر نوع من اللعب مثل الركبة والجلسة ذقول فلان حسن اللعبة كماتقول حسن
  الجلسة ولاعبت الرحل ملاعبة وكان يقال لابى براء عامر بن مالك بن جعذربن كلاب
  ملاعب الاسنة فجعله اسيدملاعب الرماح لحاجته الى التافية فقال
  ٢٦
