label: { ar: "صحيح مسلم 2902 — الأب والأبوة", en: "Sahih Muslim 2902 — the father and fatherhood", ur: "صحیح مسلم 2902 — باپ اور والدیت" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، مُحَمَّدُ بْنُ الْعَلاَءِ الْهَمْدَانِيُّ حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - قَالَتْ دَخَلَ رَسُولُ اللَّهِ عَلَى ضُبَاعَةَ بِنْتِ الزُّبَيْرِ فَقَالَ لَهَا \" أَرَدْتِ الْحَجَّ \". قَالَتْ وَاللَّهِ مَا أَجِدُنِي إِلاَّ وَجِعَةً. فَقَالَ لَهَا \" حُجِّي وَاشْتَرِطِي وَقُولِي اللَّهُمَّ مَحِلِّي حَيْثُ حَبَسْتَنِي \". وَكَانَتْ تَحْتَ الْمِقْدَادِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2902، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2902 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2902، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
