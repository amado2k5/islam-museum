text: "إذا جاء أحدكم الجمعة فليغتسل"
summary:
  ar: "يرويه مالك عن نافع عن ابن عمر، في باب العمل في غسل يوم الجمعة: أمر النبي من جاء الجمعة أن يغتسل. ويخرّجه المحقق عند البخاري (877) والنسائي (3/93) وأحمد (2/64) والدارمي والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (14/144–145). {cite:muwatta-maruf-1997 p.158} {cite:muwatta-maruf-1997 p.159}"
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Ibn ‘Umar, dalam surah tentang praktik mandi wajib (ghusl) pada hari Jumat: Nabi (shalawat dan salam kepadanya) memerintahkan siapa pun yang datang untuk shalat Jumat untuk mandi wajib. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (877), al-Nasa’i (3/93), Ahmad (2/64), al-Darimi, al-Tahawi, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (14/144–145). {cite:muwatta-maruf-1997 p.158} {cite:muwatta-maruf-1997 p.159}"
