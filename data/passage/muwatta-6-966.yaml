label: { ar: "الموطأ 966 — ربيعة بن عبد الله بن الهدير رأى رجلاً متجرداً بالعراق، فقيل: إنه أمر بهديه أن يقلد، فلذلك تجرد؛ فقال ابن الزبير: بدعة ورب الكعبة", en: "Muwatta 966", es: "Muwatta 966", fr: "Muwatta 966", ur: "موطا 966", tr: "El-Muvatta 966 — Rabi’ah ibn Abdullah ibn al-Hudayr, Irak'ta çıplak bir adam gördü ve şöyle denildi: Ona çelenk takması emredilmişti ve bu yüzden çıplaktı. İbn al-Zubayr dedi ki: Kâbe'nin Rabbine yemin ederim ki, bu bir bidattir!", id: "Al-Muwatta 966 — Rabi’ah ibn Abdullah ibn al-Hudayr melihat seorang pria di Irak yang telanjang, dan dikatakan: Dia diperintahkan untuk mengenakan kalung bunga, dan itulah sebabnya dia telanjang. Ibn al-Zubayr berkata: Demi Tuhan Ka'bah, ini adalah bid'ah!" }
text: "بدعة، ورب الكعبة"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي عن ربيعة بن عبد الله بن الهدير، أنه رأى رجلاً متجرداً بالعراق، فسأل الناس عنه، فقالوا: إنه أمر بهديه أن يقلد، فلذلك تجرد. فلقي ربيعة عبد الله بن الزبير فذكر ذلك له، فقال: بدعة، ورب الكعبة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1098) وسويد. {cite:muwatta-maruf-1997 p.459}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim ibn el-Harith el-Taymi'den, o da Rabi'ah ibn 'Abd Allah ibn el-Hudayr'den rivayet ederek, Irak'ta çıplak bir adam gördüğünü, insanlara onun hakkında sorduğunu ve onların da \"Ona çelenk takması emredilmişti, o yüzden çıplak gitti\" dediklerini aktarmıştır. Rabi'ah, 'Abd Allah ibn el-Zubayr ile karşılaştığında ona bunu anlatmış ve o da \"Bu, Kâbe'nin Rabbi adına bir bid'attir\" demiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1098) ve Suveyd tarafından da rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.459}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, dari Rabi'ah ibn 'Abd Allah ibn al-Hudayr, bahwa ia melihat seorang pria di Irak yang telanjang. Ia bertanya kepada orang-orang tentang pria itu, dan mereka berkata: \"Ia diperintahkan untuk mengenakan kalung, jadi ia telanjang.\" Rabi'ah bertemu dengan 'Abd Allah ibn al-Zubayr dan menceritakan hal itu kepadanya, dan beliau berkata: \"Ini adalah bid'ah, demi Tuhan Ka'bah.\" Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1098) dan Suwayd. {cite:muwatta-maruf-1997 p.459}"
