label: { ar: "الموطأ 966 — ربيعة بن عبد الله بن الهدير رأى رجلاً متجرداً بالعراق، فقيل: إنه أمر بهديه أن يقلد، فلذلك تجرد؛ فقال ابن الزبير: بدعة ورب الكعبة", en: "Muwatta 966" }
text: "بدعة، ورب الكعبة"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي عن ربيعة بن عبد الله بن الهدير، أنه رأى رجلاً متجرداً بالعراق، فسأل الناس عنه، فقالوا: إنه أمر بهديه أن يقلد، فلذلك تجرد. فلقي ربيعة عبد الله بن الزبير فذكر ذلك له، فقال: بدعة، ورب الكعبة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1098) وسويد. {cite:muwatta-maruf-1997 p.459}"
