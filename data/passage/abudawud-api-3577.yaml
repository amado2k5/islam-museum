label: { ar: "سنن أبي داود 3577 — ما كان يُكره، ما كُره", en: "Sunan Abi Dawud 3577 — what used to be disliked; what was disliked", ur: "سنن ابی داؤد 3577 — جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا", fr: "Sunan Abi Dawud 3577 — ce qui était réprouvé ; ce qui fut réprouvé", es: "Sunan Abi Dawud 3577 — lo que se reprobaba; lo que se reprobó" }
text: "… الْمُثَنَّى، قَالاَ أَخْبَرَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ رَجَاءٍ الأَنْصَارِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ بِشْرٍ الأَنْصَارِيِّ الأَزْرَقِ، قَالَ دَخَلَ رَجُلاَنِ مِنْ أَبْوَابِ كِنْدَةَ وَأَبُو مَسْعُودٍ الأَنْصَارِيُّ جَالِسٌ فِي حَلْقَةٍ فَقَالاَ أَلاَ رَجُلٌ يُنَفِّذُ بَيْنَنَا فَقَالَ رَجُلٌ مِنَ الْحَلْقَةِ أَنَا. فَأَخَذَ أَبُو مَسْعُودٍ كَفًّا مِنْ حَصًى فَرَمَاهُ بِهِ وَقَالَ مَهْ إِنَّهُ كَانَ يُكْرَهُ التَّسَرُّعُ إِلَى الْحُكْمِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3577، يرد فيه ذكر ما كان يُكره، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 3577 (The Office of the Judge (Kitab Al-Aqdiyah)), whose wording mentions what used to be disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 3577، جس کے الفاظ میں جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 3577, dont le texte mentionne ce qui était réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 3577, cuyo texto menciona lo que se reprobaba, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
