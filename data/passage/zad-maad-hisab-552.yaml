text: "… لا يُكره أن يُقال: رمضان للشهر يحبهما، وضِدهما الطيشُ والعَجَلة، وهما خُلُقَانٍ واحْتِسَاباً ، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ [البخاري: ٣٨، من خصال الخير، كالذكاء، والشجاعة، والحِلم. رسولَ الله! إن أرضَنَا كثيرةُ الجِرذان لا تبقى فيها أسقية الادم، قال: …"
summary:
