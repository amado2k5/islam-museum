label:
  ar: "الترمذي 1307 — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Tirmidhi 1307 — Pass over My servant: the one who was lenient with debtors"
  ur: "ترمذی 1307 — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
  es: "Tirmidhi 1307 — Pasa de largo a mi siervo: aquel que fue indulgente con los deudores"
  fr: "Tirmidhi 1307 — Pardonne à Mon serviteur, celui qui était indulgent envers les débiteurs"
  tr: "Tirmizi 1307 — “Kulumu bağışla: O ki, borçlulara kolaylık sağladı.”"
  id: "Tirmidzi 1307 — “Ampuni hamba-Ku: Dia yang memudahkan urusan orang yang berhutang”"
text: "حوسب رجل ممن كان قبلكم فلم يوجد له من الخير شيء إلا أنه كان رجلا موسرا وكان يخالط الناس وكان يأمر غلمانه أن يتجاوزوا عن المعسر فقال الله عز وجل نحن أحق بذلك منه تجاوزوا عنه . قال أبو عيسى …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 1307: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 1307: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 1307: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 1307: «Pasa de largo a mi siervo: aquel que fue indulgente con los deudores». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 1307: « Pardonne à Mon serviteur celui qui était indulgent envers les débiteurs. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 1307: \"Ampuni hamba-Ku: orang yang memudahkan urusan orang yang berhutang.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
