label:
  ar: "الترمذي 1307 — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Tirmidhi 1307 — Pass over My servant: the one who was lenient with debtors"
  ur: "ترمذی 1307 — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
text: "حوسب رجل ممن كان قبلكم فلم يوجد له من الخير شيء إلا أنه كان رجلا موسرا وكان يخالط الناس وكان يأمر غلمانه أن يتجاوزوا عن المعسر فقال الله عز وجل نحن أحق بذلك منه تجاوزوا عنه . قال أبو عيسى …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 1307: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 1307: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 1307: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
