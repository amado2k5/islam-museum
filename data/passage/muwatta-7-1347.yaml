label: { ar: "الموطأ 1347 — مالك: أرض من أسلم من أهل الصلح له، وأرض من أسلم من أهل العنوة للمسلمين لأنهم غلبوا على بلادهم", en: "Muwatta 1347", es: "Muwatta 1347", fr: "Muwatta 1347", ur: "موطا 1347", tr: "El-Muvatta 1347 — Malik: Barış antlaşması ehli arasından İslam'ı geçenlerin toprakları onlara aittir; fetih ehli arasından İslam'ı geçenlerin toprakları ise Müslümanlara aittir, çünkü onlar bu toprakları fethetmişlerdir." }
summary:
  ar: "سئل مالك عن إمام قبل الجزية من قوم فكانوا يعطونها، أرأيت من أسلم منهم، أتكون له أرضه، أو تكون للمسلمين ويكون لهم ماله؟ فقال ذلك يختلف. أما أهل الصلح فإن من أسلم منهم فهو أحق بأرضه وماله، وأما أهل العنوة الذين أخذوا عنوة، فمن أسلم منهم فإن أرضه وماله للمسلمين، لأن أهل العنوة قد غلبوا على بلادهم وصارت فيئا للمسلمين. وأما أهل الصلح فإنهم منعوا أموالهم وأنفسهم حتى صالحوا عليها، فليس عليهم إلا ما صالحوا عليه. {cite:muwatta-maruf-1997 p.603}"
  tr: "Malik'e, cizye (baş vergisi) alan bir halktan sorumlu olan bir lider hakkında soru soruldu. Ona, \"Peki ya içlerinden biri İslam'a geçerse? Toprağı kendisine mi kalır, yoksa Müslümanlara mı ait olur ve malları Müslümanlar tarafından mı tutulur?\" diye soruldu. Malik şöyle cevap verdi: \"Bu duruma bağlıdır. Barış antlaşması yapanlar için, İslam'a geçen herkesin toprak ve mallarına hakkı vardır. Zorla ele geçirilenler için ise, İslam'a geçen herkesin toprak ve malları Müslümanlara aittir, çünkü fethedilen halk boyun eğdirilmiş ve toprakları Müslümanların ganimeti olmuştur. Barış antlaşması yapanlar ise, barış sağlanana kadar mallarını ve canlarını korudular, bu yüzden sadece üzerinde anlaştıkları şeylerle yükümlüdürler.\""
  id: "Malik ditanya tentang seorang pemimpin yang menerima jizya (pajak kepala) dari orang-orang yang membayarnya. Ia ditanya, \"Bagaimana jika salah seorang dari mereka masuk Islam? Apakah tanahnya tetap menjadi miliknya, atau menjadi milik kaum Muslim, dan apakah mereka tetap memiliki hartanya?\" Ia menjawab, \"Itu tergantung. Adapun mereka yang membuat perjanjian damai, siapa pun yang masuk Islam berhak atas tanah dan hartanya. Adapun mereka yang ditaklukkan dengan kekerasan, siapa pun yang masuk Islam, tanah dan hartanya menjadi milik kaum Muslim, karena orang-orang yang ditaklukkan telah ditundukkan dan tanah mereka telah menjadi rampasan perang bagi kaum Muslim. Adapun mereka yang membuat perjanjian damai, mereka melindungi harta dan nyawa mereka sampai mereka berdamai, jadi mereka hanya berkewajiban pada apa yang telah mereka sepakati.\""
