label: { ar: "الموطأ 1347 — مالك: أرض من أسلم من أهل الصلح له، وأرض من أسلم من أهل العنوة للمسلمين لأنهم غلبوا على بلادهم", en: "Muwatta 1347" }
summary:
  ar: "سئل مالك عن إمام قبل الجزية من قوم فكانوا يعطونها، أرأيت من أسلم منهم، أتكون له أرضه، أو تكون للمسلمين ويكون لهم ماله؟ فقال ذلك يختلف. أما أهل الصلح فإن من أسلم منهم فهو أحق بأرضه وماله، وأما أهل العنوة الذين أخذوا عنوة، فمن أسلم منهم فإن أرضه وماله للمسلمين، لأن أهل العنوة قد غلبوا على بلادهم وصارت فيئا للمسلمين. وأما أهل الصلح فإنهم منعوا أموالهم وأنفسهم حتى صالحوا عليها، فليس عليهم إلا ما صالحوا عليه. {cite:muwatta-maruf-1997 p.603}"
