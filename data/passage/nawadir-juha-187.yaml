label: { ar: "نوادر جحا الكبرى، ص 84 — «لا عادل ولا ظالم»", en: "Nawadir Juha al-Kubra, p. 84 — 'Neither Just nor Unjust'", ur: "نوادر جحا الکبریٰ، ص 84 — «نہ عادل نہ ظالم»", fr: "Nawadir Juha al-Kubra, p. 84 — « Ni juste ni injuste »", es: "Nawadir Juha al-Kubra, p. 84 — «Ni justo ni injusto»", tr: "Juha'nın Büyük Fıkraları, s. 84 — “Ne adil ne de adaletsiz”", id: "Anekdot-Anekdot Hebat Juha, hlm. 84 — “Tidak adil dan tidak pula tidak adil”" }
text: "… لا عادل ولا ظالم كان تيمورلنك السفاك عندما استولى على بلاد الأناضول، يُخضِرُ علماء البلدة وفضلاءها ويسألهم: أنا عادل أم ظالم؟ فإن أجابُوه، أنك عادل، ذبحهم، وإن قالوا: إنَّك ظالم قتلهم، فضاق ذرعُهُم، فجاؤوا يقصدون الشيخ لما اشتهر به من …"
summary:
  ar: "بعد أن فتح تيمور الأناضول استدعى العلماء وسألهم أهو عادل أم ظالم، فكان العلماء في خطر؛ فأرسلوا جحا، فأجاب أن تيمور ليس عادلًا ولا ظالمًا، بل سيف من عدل الله على الظالمين؛ فسُرّ تيمور وجعله من خاصته، وأنقذ جحا آق شهر وقرمان من جيشه. {cite:juha-nawadir-kubra-djuwaydi p. 84}"
  en: "After Timur takes Anatolia he summons the scholars and asks if he is just or unjust; the scholars are in danger; they send Juha, who answers that Timur is neither just nor unjust, but a sword of God's justice upon the unjust; Timur is pleased, makes him a close companion, and Juha spares Akshehir and Karaman from his army. {cite:juha-nawadir-kubra-djuwaydi p. 84}"
  ur: "تیمور نے اناطولیہ فتح کرنے کے بعد علماء کو بلا کر پوچھا کہ میں عادل ہوں یا ظالم؛ علماء خطرے میں پڑ گئے؛ انہوں نے جحا کو بھیجا، جس نے جواب دیا کہ تیمور نہ عادل ہے نہ ظالم، بلکہ ظالموں پر اللہ کے عدل کی تلوار ہے؛ تیمور خوش ہوا، اسے اپنا قریبی ساتھی بنا لیا، اور جحا نے آق شہر اور قرمان کو اس کے لشکر سے بچا لیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 84}"
  fr: "Après avoir pris l'Anatolie, Timur convoque les savants et leur demande s'il est juste ou injuste; les savants sont en danger; ils envoient Juha, qui répond que Timur n'est ni juste ni injuste, mais une épée de la justice de Dieu contre les injustes; Timur, satisfait, en fait un proche compagnon, et Juha épargne Akşehir et Karaman à son armée. {cite:juha-nawadir-kubra-djuwaydi p. 84}"
  es: "Tras tomar Anatolia, Timur convoca a los sabios y les pregunta si es justo o injusto; los sabios están en peligro; envían a Juha, que responde que Timur no es ni justo ni injusto, sino una espada de la justicia de Dios sobre los injustos; Timur, complacido, lo hace su compañero cercano, y Juha libra a Akşehir y a Karaman de su ejército. {cite:juha-nawadir-kubra-djuwaydi p. 84}"
  tr: "Timur Anadolu'yu fethettikten sonra âlimleri çağırdı ve onlara adil mi yoksa adaletsiz mi olduğunu sordu. Âlimler tehlikede oldukları için Cuha'yı gönderdiler. Cuha, Timur'un ne adil ne de adaletsiz olduğunu, aksine zalimlere karşı Allah'ın adaletinin kılıcı olduğunu söyledi. Timur bundan memnun oldu ve onu yakın arkadaşlarından biri yaptı. Cuha, Ak Şahr ve Karaman'ı Timur'un ordusundan kurtardı. {cite:juha-nawadir-kubra-djuwaydi s. 84}"
  id: "Setelah Timur menaklukkan Anatolia, ia memanggil para ulama dan bertanya kepada mereka apakah ia adil atau tidak adil. Para ulama berada dalam bahaya, sehingga mereka mengirim Juha, yang menjawab bahwa Timur tidak adil maupun tidak tidak adil, melainkan pedang keadilan Tuhan melawan para penindas. Timur senang dan menjadikannya salah satu sekutu dekatnya, dan Juha menyelamatkan Aq Shahr dan Karaman dari pasukannya. {cite:juha-nawadir-kubra-djuwaydi p. 84}"
