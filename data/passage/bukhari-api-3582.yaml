label: { ar: "صحيح البخاري 3582 — تربية الأب ووصيته", en: "Sahih al-Bukhari 3582 — the father raising and counselling", ur: "صحیح بخاری 3582 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 3582 — El padre que cría y aconseja", fr: "Sahih al-Bukhari 3582 — l'éducation et les conseils du père" }
text: "… فَهَاجَتْ رِيحٌ أَنْشَأَتْ سَحَابًا ثُمَّ اجْتَمَعَ، ثُمَّ أَرْسَلَتِ السَّمَاءُ عَزَالِيَهَا، فَخَرَجْنَا نَخُوضُ الْمَاءَ حَتَّى أَتَيْنَا مَنَازِلَنَا، فَلَمْ نَزَلْ نُمْطَرُ إِلَى الْجُمُعَةِ الأُخْرَى، فَقَامَ إِلَيْهِ ذَلِكَ الرَّجُلُ ـ أَوْ غَيْرُهُ ـ فَقَالَ يَا رَسُولَ اللَّهِ، تَهَدَّمَتِ الْبُيُوتُ، فَادْعُ اللَّهَ يَحْبِسْهُ. فَتَبَسَّمَ ثُمَّ قَالَ \" حَوَالَيْنَا وَلاَ عَلَيْنَا \". فَنَظَرْتُ إِلَى السَّحَابِ تَصَدَّعَ حَوْلَ الْمَدِينَةِ كَأَنَّهُ إِكْلِيلٌ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3582، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3582 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3582، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3582 (Virtudes y méritos del Profeta y sus Compañeros), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3582 (Vertus et mérites du Prophète et de ses Compagnons), mentionne le rôle du père dans l'éducation et les conseils prodigués à ses enfants. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la figure paternelle."
