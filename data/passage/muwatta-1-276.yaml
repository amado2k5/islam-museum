label: { ar: "الموطأ 276 — ابن عمر يحصب رجلين يتحدثان والإمام يخطب", en: "Muwatta 276", es: "Muwatta 276", fr: "Muwatta 276", ur: "موطا 276", tr: "El-Muvatta 276 — İbn Ömer, imam vaaz verirken konuşan iki adama taş atıyor.", id: "Al-Muwatta 276 — Ibnu Umar melempari batu ke arah dua orang yang sedang berbicara ketika Imam sedang berkhutbah." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب: رأى عبد الله بن عمر رجلين يتحدثان والإمام يخطب يوم الجمعة فرماهما بالحصباء أن اصمتا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.161}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Cuma günü imamın hutbe okurken dikkatle dinlemek hakkında söylenenler bölümünde şöyle denmektedir: Abdullah ibn Umar, imam Cuma hutbesi okurken iki adamın konuştuğunu görünce, onlara susmalarını söyleyerek taş atmıştır. Editör, bunun Malik'ten Ebu Mus'ab ve Suwaid tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.161}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik berdasarkan Nafi’, dalam bab tentang apa yang telah dikatakan tentang mendengarkan dengan saksama pada hari Jumat ketika Imam menyampaikan khutbah: Abdullah ibn Umar melihat dua orang berbicara ketika Imam menyampaikan khutbah Jumat, lalu ia melempari mereka dengan batu kerikil, menyuruh mereka diam. Editor menyebutkan bahwa riwayat ini dinarasikan berdasarkan Malik oleh Abu Mus’ab dan Suwaid. {cite:muwatta-maruf-1997 p.161}"
