label: { ar: "الموطأ 1014 — مالك في صيد الحيتان في البحر والأنهار والبرك: إنه حلال للمحرم أن يصطاده", en: "Muwatta 1014", es: "Muwatta 1014", fr: "Muwatta 1014", ur: "موطا 1014", tr: "El-Muvatta 1014 — Malik'in denizlerde, nehirlerde ve göletlerde balina avlama hakkındaki görüşü: İhramlı bir hacının balina avlaması caizdir.", id: "Al-Muwatta 1014 — Malik tentang perburuan paus di laut, sungai, dan kolam: Diperbolehkan bagi seorang jamaah haji yang sedang ihram untuk memburu paus." }
text: "إنه حلال للمحرم أن يصطاده"
summary:
  ar: "قول لمالك في صيد الحيتان في البحر والأنهار والبرك وما أشبه ذلك: إنه حلال للمحرم أن يصطاده. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1144). {cite:muwatta-maruf-1997 p.475}"
  tr: "Malik, denizlerde, nehirlerde, göletlerde ve benzeri yerlerde balina avlanması hakkında şöyle demiştir: İhramlı bir hacının balina avlaması caizdir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1144) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.475}"
  id: "Malik berkata mengenai perburuan paus di laut, sungai, kolam, dan sejenisnya: diperbolehkan bagi seorang jamaah haji yang sedang dalam keadaan ihram untuk memburunya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1144). {cite:muwatta-maruf-1997 p.475}"
