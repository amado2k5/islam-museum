label: { ar: "سنن أبي داود 5041 — الأب والأبوة", en: "Sunan Abi Dawud 5041 — the father and fatherhood", ur: "سنن ابی داؤد 5041 — باپ اور والدیت" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا سَالِمٌ، - يَعْنِي ابْنَ نُوحٍ - عَنْ عُمَرَ بْنِ جَابِرٍ الْحَنَفِيِّ، عَنْ وَعْلَةَ بْنِ عَبْدِ الرَّحْمَنِ بْنِ وَثَّابٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَلِيٍّ، - يَعْنِي ابْنَ شَيْبَانَ - عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ بَاتَ عَلَى ظَهْرِ بَيْتٍ لَيْسَ لَهُ حِجَارٌ فَقَدْ بَرِئَتْ مِنْهُ الذِّمَّةُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5041، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5041 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5041، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
