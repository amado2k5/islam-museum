text: "… لا بأس به. - قال عبد الرزاق : وقوله : يحرم من الرضاع ما يحرم من النسب، إذا شربتْ معك جارية لبن أمك لم تحل لك ولا لأحد من إخوانك، وأَما إذا رضعتَ لبنَ أُخرى مع جارية فهي حلال لأخيك، …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 3935، يذكر الحلال، وما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
