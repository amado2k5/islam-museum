text: "… لا بأس به. - قال عبد الرزاق : وقوله : يحرم من الرضاع ما يحرم من النسب، إذا شربتْ معك جارية لبن أمك لم تحل لك ولا لأحد من إخوانك، وأَما إذا رضعتَ لبنَ أُخرى مع جارية فهي حلال لأخيك، …"
