label: { ar: "جامع الترمذي 3714 — الأب والأبوة", en: "Jami' al-Tirmidhi 3714 — the father and fatherhood", ur: "جامع ترمذی 3714 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3714 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3714 — le père et la paternité" }
text: "… قَالَ حَدَّثَنَا أَبُو عَتَّابٍ، سَهْلُ بْنُ حَمَّادٍ قَالَ حَدَّثَنَا الْمُخْتَارُ بْنُ نَافِعٍ، قَالَ حَدَّثَنَا أَبُو حَيَّانَ التَّيْمِيُّ، عَنْ أَبِيهِ، عَنْ عَلِيٍّ، قَالَ قَالَ رَسُولُ اللَّهِ \" رَحِمَ اللَّهُ أَبَا بَكْرٍ زَوَّجَنِي ابْنَتَهُ وَحَمَلَنِي إِلَى دَارِ الْهِجْرَةِ وَأَعْتَقَ بِلاَلاً مِنْ مَالِهِ رَحِمَ اللَّهُ عُمَرَ يَقُولُ الْحَقَّ وَإِنْ كَانَ مُرًّا تَرَكَهُ الْحَقُّ وَمَالَهُ صَدِيقٌ رَحِمَ اللَّهُ عُثْمَانَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3714، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3714 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3714، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3714 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3714 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
