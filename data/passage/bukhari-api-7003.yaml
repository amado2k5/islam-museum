text: "… اللَّهِ ـ أَخْبَرَتْهُ أَنَّهُمُ اقْتَسَمُوا الْمُهَاجِرِينَ قُرْعَةً. قَالَتْ فَطَارَ لَنَا عُثْمَانُ بْنُ مَظْعُونٍ، وَأَنْزَلْنَاهُ فِي أَبْيَاتِنَا، فَوَجِعَ وَجَعَهُ الَّذِي تُوُفِّيَ فِيهِ، فَلَمَّا تُوُفِّيَ غُسِّلَ وَكُفِّنَ فِي أَثْوَابِهِ دَخَلَ رَسُولُ اللَّهِ فَقُلْتُ رَحْمَةُ اللَّهِ عَلَيْكَ أَبَا السَّائِبِ، فَشَهَادَتِي عَلَيْكَ لَقَدْ أَكْرَمَكَ اللَّهُ. فَقَالَ رَسُولُ اللَّهِ \" وَمَا يُدْرِيكِ أَنَّ اللَّهَ أَكْرَمَهُ \". فَقُلْتُ بِأَبِي أَنْتَ يَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7003، يذكر مرض النبي، والوجع. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7003 (Interpretation of Dreams), that mentions the Prophet's illness, pain. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7003، جس میں نبی کی بیماری، درد کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
