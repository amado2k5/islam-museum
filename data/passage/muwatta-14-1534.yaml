label: { ar: "الموطأ 1534 — عبد الله بن عباس وعبد الله بن عمر: سئلا عن رجل تحته امرأة حرة فأراد أن ينكح عليها أمة، فكرها أن يجمع بينهما", en: "Muwatta 1534", es: "Muwatta 1534", fr: "Muwatta 1534", ur: "موطا 1534", tr: "El-Muvatta 1534 — Abdullah bin Abbas ve Abdullah bin Ömer: Kendilerine, karısı özgür olan ve ayrıca bir de cariye ile evlenmek isteyen, ancak bu fikri beğenmeyen bir adam hakkında soru soruldu.", id: "Al-Muwatta 1534 — Abdullah bin Abbas dan Abdullah bin Umar: Mereka ditanyai tentang seorang pria yang memiliki istri merdeka dan ingin menikahi seorang budak wanita sebagai tambahan, tetapi dia tidak menyukai gagasan menggabungkan keduanya." }
summary:
  ar: "يروي مالك أنه بلغه أن عبد الله بن عباس وعبد الله بن عمر سئلا عن رجل كانت تحته امرأة حرة، فأراد أن ينكح عليها أمة، فكرها أن يجمع بينهما. {cite:muwatta-maruf-1997 p.43}"
  tr: "Malik, Abdullah ibn Abbas ve Abdullah ibn Umar'a, bir eşi olan ve ayrıca bir cariye ile de evlenmek isteyen bir adam hakkında soru sorulduğunu, ancak her ikisinin de adamın aynı anda iki eşe sahip olmasını hoş karşılamadığını anlattığını aktarır. {cite:muwatta-maruf-1997 s.43}"
  id: "Malik menceritakan bahwa ia mendengar Abdullah ibn Abbas dan Abdullah ibn Umar ditanyai tentang seorang pria yang memiliki istri merdeka dan ingin menikahi seorang budak wanita selain istrinya, tetapi mereka tidak menyukai pria itu memiliki kedua istri sekaligus. {cite:muwatta-maruf-1997 p.43}"
