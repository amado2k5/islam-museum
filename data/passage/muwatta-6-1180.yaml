label: { ar: "الموطأ 1180 — ربيعة بن أبي عبد الرحمن: رجل سأل القاسم بن محمد عن امرأته بعد الإفاضة وقبل التقصير", en: "Muwatta 1180", es: "Muwatta 1180", fr: "Muwatta 1180", ur: "موطا 1180", tr: "El-Muvatta 1180 — Rabi’ah ibn Abi Abd al-Rahman: Bir adam, Tavaf-ı İfade'den sonra ve saçların kısaltılmasından önce el-Kasım ibn Muhammed'e karısı hakkında soru sordu.", id: "Al-Muwatta 1180 — Rabi’ah ibn Abi Abd al-Rahman: Seorang pria bertanya kepada al-Qasim ibn Muhammad tentang istrinya setelah Tawaf al-Ifadah dan sebelum memendekkan rambut." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن رجلا أتى القاسم بن محمد فقال إنه أفاض وأفاضت معه أهله، ثم عدل إلى شعب، فذهب يدنو من أهله فقالت إنها لم تقصر من شعرها بعد، فأخذ من شعرها بأسنانه ثم وقع بها. فضحك القاسم وقال مره فلتأخذ من شعرها بالجلمين. {cite:muwatta-maruf-1997 p.532}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle, bir adamın el-Kâsım ibn Muhammed'e gelip şöyle dediğini aktarır: \"Kâbe'nin tavafını yaptım ve ailem de benimle birlikte tavaf etti. Sonra bir vadiye gittim ve karıma yaklaştım, fakat o henüz saçlarını kesmediğini söyledi. Ben de dişlerimle saçlarından bir tutam aldım ve onunla cinsel ilişkiye girdim.\" El-Kâsım güldü ve \"Ona saçlarını makasla kesmesini söyle\" dedi. {cite:muwatta-maruf-1997 s.532}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa seorang pria datang kepada al-Qasim ibn Muhammad dan berkata, \"Aku telah melakukan Tawaf al-Ifadah (mengelilingi Ka'bah) dan keluargaku juga melakukannya bersamaku. Kemudian aku pergi ke sebuah lembah dan mendekati istriku, tetapi dia berkata bahwa dia belum memotong rambutnya. Maka aku mengambil sebagian rambutnya dengan gigiku dan bersetubuh dengannya.\" Al-Qasim tertawa dan berkata, \"Katakan padanya untuk memotong rambutnya dengan gunting.\" {cite:muwatta-maruf-1997 p.532}"
