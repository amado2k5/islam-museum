label: { ar: "الموطأ 1180 — ربيعة بن أبي عبد الرحمن: رجل سأل القاسم بن محمد عن امرأته بعد الإفاضة وقبل التقصير", en: "Muwatta 1180" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن رجلا أتى القاسم بن محمد فقال إنه أفاض وأفاضت معه أهله، ثم عدل إلى شعب، فذهب يدنو من أهله فقالت إنها لم تقصر من شعرها بعد، فأخذ من شعرها بأسنانه ثم وقع بها. فضحك القاسم وقال مره فلتأخذ من شعرها بالجلمين. {cite:muwatta-maruf-1997 p.532}"
