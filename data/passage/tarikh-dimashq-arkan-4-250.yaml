text: "… نا أبُو جَعفر أحْمَد بن محمّد بن سَلامة، نا سُليمَان بن شعَيب الكَيْساني، نا سَعيْدِ الأدَم، ناشهاب بن خِرَاش الحَوْشَبي، عن يَزيد الرقاشي، عن أنس بن مَالك، قال: قالَ رَسُول اللّه الَلِلَهِ لا يُؤْمن عَبدٌ حتى يُؤمنَ بالقدرِ خَيرهِ وَشرهِ …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 250، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 4, p. 250, that mentions belief in the decree, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 4، ص 250 کا اقتباس جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Historia de Damasco de Ibn 'Asakir, volumen 4, pág. 250, que menciona la creencia en el decreto, sin el cual la fe no está completa; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de l'Histoire de Damas d'Ibn Asakir (tome 4, p. 250) mentionne la croyance au décret, élément essentiel de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 4, sayfa 250'den bir alıntı, kader inancını ve kader olmadan inancın eksik kalacağını tartışmaktadır. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 4 Bergambar, halaman 250, membahas tentang kepercayaan pada takdir dan hal-hal yang tanpanya kepercayaan menjadi tidak lengkap. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
