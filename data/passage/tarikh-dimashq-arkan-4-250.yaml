text: "… نا أبُو جَعفر أحْمَد بن محمّد بن سَلامة، نا سُليمَان بن شعَيب الكَيْساني، نا سَعيْدِ الأدَم، ناشهاب بن خِرَاش الحَوْشَبي، عن يَزيد الرقاشي، عن أنس بن مَالك، قال: قالَ رَسُول اللّه الَلِلَهِ لا يُؤْمن عَبدٌ حتى يُؤمنَ بالقدرِ خَيرهِ وَشرهِ …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 250، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 4, p. 250, that mentions belief in the decree, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 4، ص 250 کا اقتباس جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
