label: { ar: "صحيح البخاري 4296 — ما حُرّم", en: "Sahih al-Bukhari 4296 — what was made unlawful", ur: "صحیح بخاری 4296 — جو حرام کیا گیا", es: "Sahih al-Bukhari 4296 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 4296 — ce qui a été déclaré illicite" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا اللَّيْثُ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِما ـ أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ عَامَ الْفَتْحِ وَهْوَ بِمَكَّةَ \" إِنَّ اللَّهَ وَرَسُولَهُ حَرَّمَ بَيْعَ الْخَمْرِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4296، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4296 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4296، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4296 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4296 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
