label: { ar: "الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 639 — الشهادة والصلاة والزكاة، الإيمان بالله وملائكته وكتبه ورسله", en: "Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 639 — the testimony, the prayer and the zakat; belief in God, His angels, His books and His messengers", ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 639 — شہادت، نماز اور زکوٰۃ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان", es: "Al-Ibana al-Kubra de Ibn Batta, el Libro de la Fe, escaneo del volumen 1, pág. 639: el testimonio, la oración y el zakat; la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros.", fr: "L'ouvrage d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 1, page 639 — le témoignage, la prière et la zakat; la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers" }
text: "… منه شيئاً دون شيء شهادة أن لا إله إلا اللّه وأن محمداً رسول اللّٰه وإيمان باللّه وملائكته وكتبه ورسله والجنة والنار والحياة بعد الموت هذه واحدة وصلاة الخمس عمود الدين لا يقبل اللّٰه الإيمان إلا بالصلاة والزكاة مطهرة من الذنوب …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 639، يذكر الشهادة والصلاة والزكاة، والإيمان بالله وملائكته وكتبه ورسله، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 639, that mentions the testimony, the prayer and the zakat, belief in God, His angels, His books and His messengers, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 639 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra de Ibn Batta, el Libro de la Fe, volumen 1, pág. 639, que menciona el testimonio, la oración y el zakat, la creencia en Dios, sus ángeles, sus libros y sus mensajeros, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du livre « al-Ibana al-Kubra » d'Ibn Batta (tome 1, p. 639) mentionnant le témoignage, la prière et la zakat (l'aumône légale), la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers, l'un des piliers de la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
