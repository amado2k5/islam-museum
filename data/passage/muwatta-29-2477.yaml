label: { ar: "الموطأ 2477 — مالك: المرأة إذا كان زوجها وولدها من غير عصبتها لا يعقلون عنها", en: "Muwatta 2477" }
summary:
  ar: "قال مالك في المرأة يكون لها زوج وولد من غير عصبتها ولا قومها: فليس على زوجها إذا كان من قبيلة أخرى من عقل جنايتها شيء، ولا على ولدها إذا كانوا من غير قومها، ولا على إخوتها من أمها إذا كانوا من غير عصبتها ولا قومها. فهؤلاء أحق بميراثها، والعصبة عليهم العقل. وكذلك موالي المرأة ميراثهم لولد المرأة، وإن كانوا من غير قبيلتها، وعقل جناية الموالي على قبيلتها. {cite:muwatta-maruf-1997 p.423}"
