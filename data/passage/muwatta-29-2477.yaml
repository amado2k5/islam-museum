label: { ar: "الموطأ 2477 — مالك: المرأة إذا كان زوجها وولدها من غير عصبتها لا يعقلون عنها", en: "Muwatta 2477", es: "Muwatta 2477", fr: "Muwatta 2477", ur: "موطا 2477", tr: "Al-Muwatta 2477 — Malik: Bir kadının kocası ve oğlu erkek akrabalarından değilse, onun kan parasından sorumlu değillerdir.", id: "Al-Muwatta 2477 — Malik: Jika suami dan anak seorang wanita bukan dari kerabat laki-lakinya, mereka tidak bertanggung jawab atas uang darahnya." }
summary:
  ar: "قال مالك في المرأة يكون لها زوج وولد من غير عصبتها ولا قومها: فليس على زوجها إذا كان من قبيلة أخرى من عقل جنايتها شيء، ولا على ولدها إذا كانوا من غير قومها، ولا على إخوتها من أمها إذا كانوا من غير عصبتها ولا قومها. فهؤلاء أحق بميراثها، والعصبة عليهم العقل. وكذلك موالي المرأة ميراثهم لولد المرأة، وإن كانوا من غير قبيلتها، وعقل جناية الموالي على قبيلتها. {cite:muwatta-maruf-1997 p.423}"
  tr: "Malik, kocası ve çocukları baba tarafından veya aşiretinden olmayan bir kadın hakkında şunları söylemiştir: Kocası başka bir aşiretten ise, işlediği suçlardan dolayı kan parası ödemekle yükümlü değildir; çocukları da aynı şekilde, eğer aşiretinden değillerse, aynı şekilde anne tarafından kardeşleri de, eğer baba tarafından veya aşiretinden değillerse, kan parası ödemekle yükümlü değildir. Mirasa en çok hak sahibi olanlar bunlardır ve baba tarafından akrabalar kan parasından sorumludur. Benzer şekilde, kadının azat ettiği köleler, aşiretinden olmasalar bile, çocuklarından miras alırlar ve azat edilen bir kölenin işlediği bir suçtan dolayı kan parası ödemek aşiretinin sorumluluğundadır. {cite:muwatta-maruf-1997 s.423}"
  id: "Malik berkata mengenai seorang wanita yang memiliki suami dan anak-anak yang bukan berasal dari garis keturunan ayah atau sukunya: suaminya, jika berasal dari suku lain, tidak bertanggung jawab atas uang darah atas kejahatannya, demikian pula anak-anaknya jika mereka bukan dari sukunya, dan saudara laki-laki dari pihak ibunya jika mereka bukan dari garis keturunan ayah atau sukunya. Merekalah yang paling berhak atas warisannya, dan kerabat dari pihak ayah bertanggung jawab atas uang darah tersebut. Demikian pula, budak yang telah dibebaskan oleh wanita tersebut mewarisi harta dari anak-anaknya, meskipun mereka bukan dari sukunya, dan uang darah atas kejahatan yang dilakukan oleh budak yang telah dibebaskan adalah tanggung jawab sukunya. {cite:muwatta-maruf-1997 p.423}"
