label: { ar: "صحيح مسلم 5771 — التداوي بالعسل", en: "Sahih Muslim 5771 — honey as a remedy", ur: "صحیح مسلم 5771 — شہد سے علاج" }
text: "وَحَدَّثَنِيهِ عَمْرُو بْنُ زُرَارَةَ، أَخْبَرَنَا عَبْدُ الْوَهَّابِ، - يَعْنِي ابْنَ عَطَاءٍ - عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، عَنْ أَبِي الْمُتَوَكِّلِ النَّاجِيِّ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّ رَجُلاً، أَتَى النَّبِيَّ فَقَالَ إِنَّ أَخِي عَرِبَ بَطْنُهُ. فَقَالَ لَهُ \" اسْقِهِ عَسَلاً \". بِمَعْنَى حَدِيثِ شُعْبَةَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5771، يذكر التداوي بالعسل. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5771 (The Book of Greetings), that mentions honey as a remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5771، جس میں شہد سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
