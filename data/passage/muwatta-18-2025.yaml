label: { ar: "الموطأ 2025 — يحيى عن مالك: فيمن دفع مالا قراضا فاشترى به متاعا وحمله إلى بلد التجارة فبار عليه، فتكارى إلى بلد آخر فباع بنقصان، فاغترق الكراء أصل المال: إن كان فيما باع وفاء للكراء فسبيله ذلك، وما بقي من الكراء بعد أصل المال فعلى العامل لا على رب المال", en: "Muwatta 2025", es: "Muwatta 2025", fr: "Muwatta 2025", ur: "موطا 2025", tr: "El-Muvatta 2025 — Yahya, Malik'ten rivayetle: Borç verip mal alan, bu malları bir ticaret şehrine götüren ve mallar bozulunca da bunları başka bir şehre götürmesi için birini tutan ve zararına satan, kira bedeli anaparayı tüketen kimse hakkında: Eğer sattığı mallar kira bedelini karşılamaya yeterse, bu onun çözümüdür. Anaparadan sonra kalan kira bedeli ise, para sahibinin değil, işçinin sorumluluğundadır.", id: "Al-Muwatta 2025 — Yahya berdasarkan riwayat Malik: Mengenai orang yang memberi uang sebagai pinjaman dan membeli barang dengannya, mengangkut barang tersebut ke kota perdagangan, dan barang tersebut rusak, lalu ia menyewa seseorang untuk membawanya ke kota lain dan menjualnya dengan kerugian, dan uang sewa tersebut menghabiskan pokok pinjaman: Jika hasil penjualan cukup untuk menutupi uang sewa, maka itu adalah solusinya. Dan sisa uang sewa setelah pokok pinjaman adalah tanggung jawab pekerja, bukan pemilik uang." }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، فاشترى به متاعا، فحمله إلى بلد التجارة، فبار عليه، وخاف النقصان إن باعه، فتكارى عليه إلى بلد آخر، فباع بنقصان، فاغترق الكراء أصل المال كله. قال مالك: إن كان فيما باع وفاء للكراء، فسبيله ذلك. وإن بقي من الكراء شيء بعد أصل المال كان على العامل، ولم يكن على رب المال منه شيء يتبع به. وذلك أن رب المال إنما أمره بالتجارة في ماله، فليس للمقارض أن يتبعه بما سوى ذلك من المال. {cite:muwatta-maruf-1997 p.228}"
  tr: "Yahya şöyle dedi: Malik, bir adama borç para veren ve bu borçla mal satın alıp bir ticaret şehrine götüren, ancak malların bozulduğu bir adamdan bahsetti. Satarsa zarar edeceğinden korkan adam, malları başka bir şehre taşıtmak için birini tuttu ve zararına sattı; kira bedeli ise anaparanın tamamını tüketti. Malik şöyle dedi: Eğer satıştan elde edilen gelir kira bedelini karşılıyorsa, bu caizdir. Anapara ödendikten sonra kalan kira bedeli ise işçinin sorumluluğundadır ve sermaye sahibinin bundan dolayı işçiye karşı hiçbir hakkı yoktur. Çünkü sermaye sahibi ona sadece kendi parasıyla ticaret yapmasını söylemiştir, bu nedenle borç ortağının bunun ötesinde bir şey talep etme hakkı yoktur. {cite:muwatta-maruf-1997 s.228}"
  id: "Yahya berkata: Malik berkata tentang seorang pria yang memberi uang kepada pria lain sebagai pinjaman, dan pria yang terakhir membeli barang dengan uang itu, mengangkutnya ke kota perdagangan, tetapi barang-barang itu rusak. Karena takut rugi jika menjualnya, ia menyewa seseorang untuk mengangkutnya ke kota lain dan menjualnya dengan kerugian, dan uang sewa tersebut menghabiskan seluruh pokok pinjaman. Malik berkata: Jika hasil penjualan mencukupi uang sewa, maka itu diperbolehkan. Jika masih ada uang sewa yang tersisa setelah pokok pinjaman dibayar, maka itu menjadi tanggung jawab pekerja, dan pemilik modal tidak memiliki hak untuk menuntutnya. Ini karena pemilik modal hanya menginstruksikan dia untuk berdagang dengan uangnya, sehingga mitra pinjaman tidak berhak menuntut apa pun di luar itu. {cite:muwatta-maruf-1997 p.228}"
