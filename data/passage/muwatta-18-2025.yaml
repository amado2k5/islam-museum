label: { ar: "الموطأ 2025 — يحيى عن مالك: فيمن دفع مالا قراضا فاشترى به متاعا وحمله إلى بلد التجارة فبار عليه، فتكارى إلى بلد آخر فباع بنقصان، فاغترق الكراء أصل المال: إن كان فيما باع وفاء للكراء فسبيله ذلك، وما بقي من الكراء بعد أصل المال فعلى العامل لا على رب المال", en: "Muwatta 2025" }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، فاشترى به متاعا، فحمله إلى بلد التجارة، فبار عليه، وخاف النقصان إن باعه، فتكارى عليه إلى بلد آخر، فباع بنقصان، فاغترق الكراء أصل المال كله. قال مالك: إن كان فيما باع وفاء للكراء، فسبيله ذلك. وإن بقي من الكراء شيء بعد أصل المال كان على العامل، ولم يكن على رب المال منه شيء يتبع به. وذلك أن رب المال إنما أمره بالتجارة في ماله، فليس للمقارض أن يتبعه بما سوى ذلك من المال. {cite:muwatta-maruf-1997 p.228}"
