text: |-
  • ⁦(ق ضف )⁩
  ٥٣
  ( قرف كل قشر قرف بالسكسر ومنه قرف الرمّانة وقرف الخبز الذى يقشر منه ويبقى
  فى التنور والقرفة القشرة والة رفة من الادوية وفلان رقتى أى هو الذى أتهمه وبنوفلان
  قرفتى أى الذين عندهم أظنّ طلبتى ويقالسل بنى فلان عن ناقتك فانه-م قرفة أى تجد
  خبرها عندهم وقواهم فى المثل أمنع من أتم قرفة هى اسم امرأة والقرف بالفتح وعاءمن جلد
  يديغ بالقرفة وهى قشور الرمان ويجعل فيه انخلع وهولحم يطبخ بتوابل فيفرغ فيه قال معة ربن
  حار البارقى
  وذيينانية وصت بنيها • بأن كذب القراطف والقروفة
  أى عليكم بالقراطف والقروف فاغنموها قال الاصمعى" بقال ما أبصرت عين ولا أقرفت
  يدى أى مادنت منه وما أقرفت لذلكْ أى مادانيته ولا خالطت أهله أبوء روأقرف له أى داناه
  والمقرف الذى دانى الهجفة من الفرس وغيره الذى أمه عربية وأبوه ليس كذلك لانّ الاقراف
  نماهو من قبسل الفدل والهجنة من قبل الأمّ وقرفت القرحة أقرفها قرفا أى قشرتها
  وذلك اذا ييست وتقرّفت هى أى تقشرت ومنه قول عنترة
  علالتنا فى كل يوم كريهة • بأسيافنا والجرح لم يتقرف
  وقرفت الرجل أى عبته وبقال هوية رف بكذا أى يرمى به ويتهم فهو مقروف وقولهم تركته
  على مثل مقرف الصغة وهوموضع القرف أى القشروه وشبيه بة ولهم تركته على مثل ليلة
  الصدروفلان يرف لعياله أى يكسب والاقتراف الاكتساب وقرفته بالشى فاقترف به قال
  الاصمعى بعير مقترف أى اشترى حديثا والقرف بالتحريك مداناة المرمنى يقال أخشى عليك
  القرف وقدرف بالسكسر وفى الحديثانّ قوماشكوا اليه صلى اللّٰه عليه وسلم وباء أرضهم
  فقال تحوّلوا فان من القرف التلف ويقال أيضاهوة رف من نوبى للذى تتهمه وقارف فلان
  نظطمئة أى خالطها وقارف اهر أته أى جامعها ومنه حديث عائشة رضى اقه عنها انّ الذي
  صلى اللّٰه عليه وسلم كان يصبح جنبامن قراف غيراحتلام ثم إصوم ⁦(قرطف)⁩ القرطف
  القطيفة ( قرقف القرقف الخهر قال هواسم وأنكر أن تكون سميت بذلك لانها ترعد
  شاربها شف رجل قشف وقدقشف بالكسرقشفا اذالوحته الشمس أوالفقر
  فتغيرية.ال أصابهم من العيس قشف والمتقشف الذى يتبلغ بالقوت وبالمرقع قصف )
  القصف الكسر بقال قصفت الريح السفينة وريح قاصف شديدة ورعد قاصف شديد
  الصوت يقال قصف الرعد وغيره قصيفا والقصيف هشيم الشجر والتقصف التكسر
  والقصف الهو واللعب يقال انه ا موادة وقصف العودية صف قصفا بالتحريك فهو قصف
  أى خوار ورجل قصف سريع الانكسار عن النجدة والقصف أيضا والقصفة هدير البعير
  وهوشدّة رغائه والاقصف لغة فى الاقصم وهو الذى انكسرت ثنيءمن النصف والقصفة
  قطعة رمل تتقصفمن معظمه حكاه ابن دريدوابجمع قصف وقصفان مشل تمرة وتمروتران
  والقصفة أيضامر قاة الدرجة مثل القصمة وقصفة القوم أيضا تدافعهم وازدحامهم
  وفى الحديث أنا والنبيون قرّاط لقاصفين وذلك على باب الجنة والانقصاف الاندفاع يقال
  انقصفواعنه اذا تركوه ومزوا ⁦( ضف)⁩ القضف الدقة قال قيس بن انخطيم
  ماع
  قولة قال هواسم الخ قال الجد
  وقول الجوهرى قال* واسم
  وأنكر أن تكون سميت بذلك كلام
  ضاتع لانه لم يسنده الى أحدوانما
  المذكر أبو عبيد والمنكر عليه ابن .
  الاعراتى ا كتبه المصحم
