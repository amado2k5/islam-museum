text: "… في البر والبحر، عاصم بن عبيداللّه قال: سمعت معاوية بن عبداللّه بن وكان عبداً من عبيد الله، دعاه فأجابه، وقد قضى أبي أحمد يقول: رأيت حمنةا يوم أُحد نحبه، وهذه أكفانه فنحن مُدرجوه ومدخلوه قبرَه، تَسقي العَطْشَى، وتداوي الجرحى. ومخلوه …"
