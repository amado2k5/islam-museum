text: "… تؤدي بجماعة مستحبة، وأداء الظهر بجماعة يوم الجمعة مكروه في المصر؛ كذا روي عن علي - -. فصل في بيان وقت الأذان والإقامة وأما بيان وقت الأذان والإقامة، فوقتهما ما هو وقت الصلوات المكتوبات، حتى لو أذّن قبل دخول الوقت …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 658، يرد فيه ذكر المستحب، والمكروه، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 658, whose wording mentions the recommended (mustahabb), the disliked (makruh), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
