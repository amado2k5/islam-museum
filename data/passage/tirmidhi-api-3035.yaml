text: "… أَبُو هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ نَزَلَ بَيْنَ ضَجْنَانَ وَعُسْفَانَ فَقَالَ الْمُشْرِكُونَ إِنَّ لِهَؤُلاَءِ صَلاَةً هِيَ أَحَبُّ إِلَيْهِمْ مِنْ آبَائِهِمْ وَأَبْنَائِهِمْ وَهِيَ الْعَصْرُ فَأَجْمِعُوا أَمْرَكُمْ فَمِيلُوا عَلَيْهِمْ مَيْلَةً وَاحِدَةً وَإِنَّ جِبْرِيلَ أَتَى النَّبِيَّ فَأَمَرَهُ أَنْ يَقْسِمَ أَصْحَابَهُ شَطْرَيْنِ فَيُصَلِّيَ بِهِمْ وَتَقُومَ طَائِفَةٌ أُخْرَى وَرَاءَهُمْ وَلْيَأْخُذُوا حِذْرَهُمْ وَأَسْلِحَتَهُمْ ثُمَّ يَأْتِي الآخَرُونَ وَيُصَلُّونَ مَعَهُ رَكْعَةً وَاحِدَةً ثُمَّ يَأْخُذُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3035، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3035 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3035، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3035 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3035 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le navigateur « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Cami' el-Tirmizi'de 3035 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3035, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
