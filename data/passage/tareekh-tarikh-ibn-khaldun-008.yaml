text: "بن أبي جهل، وعمرو بن عبد ود من بني عمرو بن لؤي، وضرار بن الخطاب من بني محارب فلما رأوا الخندق قالوا: هذه مكيدة ما كانت العرب تعرفها. ثم اقتحموا من مكان ضيق حتى جالت خيلهم بين الخندق وسلع، ودعوا"
