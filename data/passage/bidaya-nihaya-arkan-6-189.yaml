text: "… اللّٰه وَلِمِ، فتوقف الواقفى فى ذلك مع علمه ومعرفته، وكان الذى ثبطه عن الإسلام أولا عبد اللّٰه ابن أبيّ ابن سلول بعد ما أخبره أبو قيس أنه الذى بشر يهود فمنعه عن الإسلام. قال ابن إسحاق : ولم يسلم إلى …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 6، ص 189، يذكر تعريف الإسلام بأعماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 6, p. 189, that mentions Islam defined by its acts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 6، ص 189 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 6, pág. 189, que menciona el Islam definido por sus actos; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 6, p. 189), qui évoque l'islam défini par ses actes; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 6. cildinin 189. sayfasından bir alıntı, İslam'ı uygulamaları üzerinden tanımlar; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Awal dan Akhir), Jilid 6, halaman 189, mendefinisikan Islam melalui praktik-praktiknya; ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
