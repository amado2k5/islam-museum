label: { ar: "صحيح البخاري 1836 — الحجامة", en: "Sahih al-Bukhari 1836 — cupping", ur: "صحیح بخاری 1836 — حجامہ", es: "Sahih al-Bukhari 1836 - catación", fr: "Sahih al-Bukhari 1836 — ventouses" }
text: "حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ، حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ عَلْقَمَةَ بْنِ أَبِي عَلْقَمَةَ، عَنْ عَبْدِ الرَّحْمَنِ الأَعْرَجِ، عَنِ ابْنِ بُحَيْنَةَ ـ قَالَ احْتَجَمَ النَّبِيُّ وَهْوَ مُحْرِمٌ بِلَحْىِ جَمَلٍ فِي وَسَطِ رَأْسِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1836، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 1836 (Penalty of Hunting while on Pilgrimage), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 1836، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 1836 (Castigo de la caza durante la peregrinación), menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 1836 (Peine de chasse en pèlerinage), mentionne la pratique des ventouses. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
