label: { ar: "سنن أبي داود 2310 — ما حُرّم", en: "Sunan Abi Dawud 2310 — what was made unlawful", ur: "سنن ابی داؤد 2310 — جو حرام کیا گیا" }
text: "… وَهُوَ خَلَقَكَ \". قَالَ فَقُلْتُ ثُمَّ أَىٌّ قَالَ \" أَنْ تَقْتُلَ وَلَدَكَ مَخَافَةَ أَنْ يَأْكُلَ مَعَكَ \". قَالَ قُلْتُ ثُمَّ أَىٌّ قَالَ \" أَنْ تُزَانِيَ حَلِيلَةَ جَارِكَ \". قَالَ وَأَنْزَلَ اللَّهُ تَعَالَى تَصْدِيقَ قَوْلِ النَّبِيِّ { وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ وَلاَ يَزْنُونَ } الآيَةَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2310، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2310 (Divorce (Kitab Al-Talaq)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2310، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
