text: "… بن يعقوب إلى جزيرة الأندلس، فكافت وقعة العقاب في سنة قسع وستمائة. وتوفى محمد سنة ست عشرة وستماثة لعشر خلون من شعبان ومولده في سنة ست وسبعين وخمسمائة. والمغاربة يقولون: إن محمد بن يعقوب المذكور أوصى عبيده المشتغلين بحراسة بستانه …"
