label: { ar: "مسلم 2563 — إياكم والظن فإن الظن أكذب الحديث", en: "Muslim 2563 — Beware suspicion, for suspicion is the falsest speech" }
text: "قال رسول الله: «إياكم والظن؛ فإن الظن أكذب الحديث، ولا تحسسوا ولا تجسسوا ولا تنافسوا ولا تحاسدوا ولا تباغضوا ولا تدابروا، وكونوا عباد الله إخواناً»"
summary:
  ar: "رواية أبي هريرة عن مالك عن الأعرج في باب تحريم الظن والتجسس من كتاب البر في صحيح مسلم؛ أصل من أصول آداب المجتمع في تحريم سوء الظن والتجسس."
