label: { ar: "الموطأ 776 — مالك: الكفارات كلها وزكاة الفطر وزكاة العشور بالمد الأصغر مد النبي، إلا الظهار فبمد هشام الأعظم", en: "Muwatta 776", es: "Muwatta 776", fr: "Muwatta 776", ur: "موطا 776", tr: "Al-Muwatta 776 — Malik: Bütün kefaret, Zekâtü'l-Fitr ve Zekâtü'l-Uşr, daha küçük Mudd (Peygamberin Mudd'u) ile hesaplanır; ancak Zihar (bir tür boşanma), daha büyük Hişam Mudd'u ile hesaplanır.", id: "Al-Muwatta 776 — Malik: Semua penebusan dosa, Zakat al-Fitr, dan Zakat al-Ushr dihitung menggunakan Mudd yang lebih kecil (Mudd Nabi), kecuali Zihar (suatu bentuk perceraian), yang dihitung menggunakan Mudd Hisham yang lebih besar." }
summary:
  ar: "قول لمالك: الكفارات كلها وزكاة الفطر وزكاة العشور، كل ذلك بالمد الأصغر مد النبي، إلا الظهار فإن الكفارة فيه بمد هشام وهو المد الأعظم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.383}"
  tr: "Malik şöyle demiştir: Zihar (bir tür boşanma) hariç, tüm kefaret, zekât-ı fitr ve zekât-ı öşr, daha küçük olan mudd (Peygamberin mudd'u) ile hesaplanır; zihar için ise kefaret, daha büyük olan Hişam mudd'u ile hesaplanır. Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.383}"
  id: "Malik berkata: Semua penebusan dosa, zakat fitrah, dan zakat ushr dihitung menggunakan mudd yang lebih kecil (mudd Nabi), kecuali zihar (suatu bentuk perceraian), yang penebusannya dihitung menggunakan mudd Hisham, yang merupakan mudd yang lebih besar. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.383}"
