text: "وجاء من غير وجه: أنّ عبد اللّٰه رأى رؤيا، فقصّها على النبيّ وَلِيِ، فقال له: تموت وأنت مستمسك بالعروة الوثقى. وثبت عن يزيد بِن عَمِيرَة قال: لما احتُضِر مُعاذ قيل: أوصنا، قال: أجلسوني، ثم قال: إنّ العلم والإيمان مكانهما، من …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 7، ص 76، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 7, p. 76, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 7، ص 76 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
