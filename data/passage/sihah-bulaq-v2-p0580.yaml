text: |-
  ص-ميته واقترغت أى صبيت الما على نفسى وتفريغ الظاروف اخلاؤها ويزيدين مفترّغ
  بكسر الرامشاعر من حسير والفرغ مخرج الماء من الدلو من يين العراقى ومنمسمى الفرغان
  فرغ الدلو المقدم وفرغ الدلو المؤخروه ما من منازل القمر وكل واحدمنه-ما كوكبان بين كل
  5وك ين قدرخس أذرع فى رأى العين والفراغة ماء الرجل وهوالنطفة وقرس فريغ واسه
  المشى وذرية فريغة واسعة والطعنة الفرغاء ذات الفرغ وهو السعة وذهب دمه فرعا
  وفرغا أى هدرالم يطلب به ⁦(فشغ)⁩ فشغه أى علامحتى غطاه قال الشاعر
  له قصة فشغت حاجبيته والعين تبصر ما فى الظلم
  والناصية الفشغاء المنتشرة وفشغه بالسوط فشغا أَى علاه به وكذلك أفشغه به اذا ضربه
  وتفشغ فيه الشيب أى كثروانتشر وتفشغ فيه الدم أى غليه وتمشى فى بدته و-كى ابن كيسات
  تفشغ الرجل البيوت دخل بينها وتفشغ المرأة دخل بين رحليها واقترعها والفشاغ نبات يتفشغ
  على الشجر ويلتوى
  صل اللام) نغ اللشغسة فى المسان هو أن يصير الراءغيذا أولاما والسين ثاء
  وقد لنغ بالسكسر يلنغ لثغافهو ألثغ وامرأة لنغاء(لدغ لدغته العقرب تلدغه لدعا
  وتلداغافهوملدوغ ولديغ ويقال لدغه بكامة أى نزغه بها
  سل الميم رغ رتغنه فى التراب تريفافتمر غ أى معكنه فتمعل والموضع
  متمرغ ومراغ ومراغة والمراغة أمجرير لقبها به الإخطل أى يتمرّغ عليها الرجال ومرغت
  السائمة العشب تمرغه مرغا والممرغة المعى الاعورلانه يرمى به وسمى أعورلانه كالكيس
  لامنفذله والمرغ اللعاب وأمرغ أى سال لعايه وترغ اذارشهمن فيه قال الكمن
  يعاذب قربشا
  فلم أرغ مما كان بين وبينها • ولم أتمزغ ان تجنى غضوبها
  قوله فلم أرغ من رغاء البعسير وأمرغ اذا أكنرالكلام فى غيرصواب وأمرغ الفجسين اخة
  فى أمرخه اذا أكثرماءهحتى رق مشغ) المشغ ضرب من الاكل كاكلك القشاءة
  وقول رؤية علووعرضى ليس بالممشغ ⁦( أى ليس بالمكدر الملطخ ضغ)⁩ مضغ الطعام
  يمضغه ويمضغه مضغا والمضاغ بالفتح مايضغ بقال ماعند نامضاغ وهذه كسرة لينة المضاغ
  والمضاغة بالضم مأمضغت والمضغة قطعة لحم وقلب الانسان مضغمن جسده والماضغان
  أصول اللهيين عند منبت الاضراس ويقال عرقان فى اللحمين فغ) المغوغة الاختلاط
  قال رؤبة • مامنك خلط الخلق الممغمخ * ⁦( لغ)⁩ الملغ بالكسر الاجق الذى يتكام
  بالفحس يقال بلخ ملغ وقد يفرد قال رؤبة * والملغ يلكى بالكلام الاملغ• فدل أنه ليس
  باتساع
  صل النون ن غ بغ الشئ ينبخ وينبغ نبغاونبوعًا أى ظهر ونبغ الرجل
  اذا لم يكن فى ارث الشعر ثم قال وأجاد ومنه سمى النوابغ من الشعراء فحو الذيانى
  والجعدى وغيرهما قالت ليلى الاخيلية
  أنايغ لم تنبغ ولم تلة أولاً • وكنت صفيا بين صدين مجهلا
  قولد لقيها به الاخطل فى القاموس
  لقبها الفرزدق لا الاخطل ووهم
  الجوهرى اه
