text: "… غيرهما : ذلك مستحب وليس بفرض يأثم تاركه. الموطن الرابع : عند دخول المسجد وعند الخروج منه، عَنْ عَبْدِ اللهَّ بْنِ الحَسَنِ، عَنْ أُمّهِ فَاطِمَةَ بِنْتِ الْحُسَيْنِ، عَنْ جَدَّتِهَا فَاطِمَةَ الْكُبْرَى، قَالَتْ: كَانَ رَسُولُ اللّهَ إِذَا دَخَلَ الْمَسْجِدَ، صَلَّى عَلَى …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 147، يرد فيه ذكر الفرض، والمستحب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 147, whose wording mentions the obligatory (fard), the recommended (mustahabb), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 147 کا اقتباس جس میں فرض، مستحب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
