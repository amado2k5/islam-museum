text: |-
  ٥٩٩
  أجاءل أنت ورامسلعة • ذريعة للك بين اللّٰه والمطر
  وقد سلعت قدمه بالمكسرتسلع ملعامثل زاعت وانسلع اى انشق قال الراجز
  من يارئ حيص ودام-نسلع ١ لفع السلفع من الرجال الجسورومن النساء
  لجريئة السليطة ومن النوق الشديدة واسم كلبة ( لقع لسلقع المكان الحزن ويقال
  هوا تباع لبلقع لا يفرديال بلقع سلقع وبلاقع سلاقع وهى الارض التى لاشئ بها والسلنقع
  البرق ويسال للعصى اذا حيت عليه الشمس اسلنقع بالبريق ⁦(سمع)⁩ السمع سمع الانسان
  يكون واحد اوجعا كقوله تعالى ختم اللّٰه على قلوبهم وعلى سمعهم لانه فى الاصل مصدرة ولك
  ممعت الشى سمعا وسماعا وقد يجمع على اسماع وجمع الاسماع أسامع وقولهم جمعك الىّ
  أى اسمع مي وكذلك قولهم سماع أى اسمع مثل دراك ومناع بمعنى أدرك وامنع وتقول فعله
  رياء وسمعة أى ليراه الناس وليسمه وابه واستمعت كذا أى أصغيت وتسمعت اليه فاذا أدغمت
  قلت اسمعت اليه وقرئ لا يسمعون الى الملأ الاءلى بقال تسععت اليه وسمعت اليه وسمعت لد
  كل بمعنى لانه تعالى قال لا تسمعو الهذا القرآن وقرئ لا يسمعون الى الملأ الاعلى مختفا
  وتسامع به الناس وأسمعه الحديث وسمعه أى شتمه وقوله تعالى واسمع غير مسمع قال
  الاخفسّ أى لاسمعت وقوله تعالى أبصربه وأسمع أى ما أبصره وأسمعه على التعجب والمسمعة
  المغنية والسمع بالكسر الصيت والذكر الجميل يقال ذهب ممعه فى الناس ويقال أيضا
  الاهسم سمالا بلغا وسمعالا بلغا ⁦(٢)⁩ أى نسمع به ولا يتمّ والسمع أيضاسبع مر كب وهو ولد
  الذتب من الضبع وفى المثسل اسمع من السمع الازل وربما قالوا اسمع من ممع قال الشاعر
  تراه حديد الطرق أبلج واضحا * أغرّطويل الباع اسمع من تمع
  وسمع يه أى شهره وفى الحديث من فعل كذاسمع اللّٰه به أسامع خلقه يوم القيامة والتسميغ
  التشنيع ويقال أيضاسمع به اذا رفعه من الحول ونشر ذكره وسبعه الصوت واسمعه
  والسامعة الاذن قال طرفة يصف أذنى ناقته
  مؤللتان تعرف العتق فيهما • كسامعتى شاة محومل مفرد
  وكذلك المسمع بالكسر يقال فلان عظيم المسمعين والمسّمع أيضاءروة تكون فى وسط الغرب
  يجعل فيها حبل إعدل الدلو قال الشاءر
  نعدّل ذا الميل اذا رامنا • كما عدل الغرب بالمسمح
  يقال منه أسمعت الدلواذا جعلت لها مسمعا والسميع السامع والسميع المسمع قال عمروبن
  معدى كرب أمن ريحانة الداعى السميع * يؤرّقنى وأصحابي هجوع
  قال أيوزيدامرأة -ععنة نظرنة بالضم وهى التى اذا تسمعت أوتبصرت فسلم ترشيئا تطنته نظنيا
  ٣ وكان الاحريكسر أقلهما ويفتح ثالثهما وينتد
  إن لنالكنه • معنة مغنه * معنة تظرنه • كالرجيح حول القنه • إلاتثره تظنه
  والسجعمع الصغير الرأس وهو فعلعل ٤ ( بدع السعيدع بالفتح السيد الموطأ
  الاكتاف ولا تقل ءبع بضم السين نع) رجل سنيع أى جميل وامر أسنيعة وقد سنع
  بااضم سناعة (سوع الساعة الوقت الجاضر والجمع الساع والساعات قال القطامى
  ١ الاسلع الابرص والمسلع
  الدلل الهادى اه كذافى
  نسخة بالاصل
  ٢ لاول بكسر السين والباء
  والثانى بنححها اه
  (٣ أ حمات بالظن اه
  ٤ و مر أة سمعمعة كأنه اغول
  والشيطان الجبيث يقال لهسجعمع
  كذا فى نسخخه بالاصل
