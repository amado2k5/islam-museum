label: { ar: "صحيح البخاري — حديث 3136", en: "Sahih al-Bukhari 3136 — One-fifth of Booty to the Cause of Allah (Khumus)", ur: "صحیح بخاری — حدیث 3136" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا بُرَيْدُ بْنُ عَبْدِ اللَّهِ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى ـ رضى الله عنه ـ قَالَ بَلَغَنَا مَخْرَجُ النَّبِيِّ صلى الله عليه وسلم وَنَحْنُ بِالْيَمَنِ فَخَرَجْنَا مُهَاجِرِينَ إِلَيْهِ، أَنَا وَأَخَوَانِ لِي، أَنَا أَصْغَرُهُمْ، أَحَدُهُمَا أَبُو بُرْدَةَ وَالآخَرُ أَبُو رُهْمٍ، إِمَّا قَالَ فِي بِضْعٍ، وَإِمَّا قَالَ فِي ثَلاَثَةٍ وَخَمْسِينَ أَوِ اثْنَيْنِ وَخَمْسِينَ رَجُلاً مِنْ قَوْمِي …"
summary:
  ar: "في صحيح البخاري؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sahih al-Bukhari; mention of the chancery or the barid post."
  ur: "صحیح بخاری میں؛ دیوآن یا بریڈ کا ذکر."
