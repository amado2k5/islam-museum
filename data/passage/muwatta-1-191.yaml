label: { ar: "الموطأ 191 — عروة لابنه: في السفر إن شئت أذنت وأقمت وإن شئت أقمت", en: "Muwatta 191", es: "Muwatta 191", fr: "Muwatta 191", ur: "موطا 191", tr: "Al-Muwatta 191 — Urve oğluna: Yolculukta, dilediğin takdirde izin verip kalabilirsin, dilediğin takdirde de kalabilirsin.", id: "Al-Muwatta 191 — Urwah kepada putranya: Ketika bepergian, jika kamu mau, kamu boleh memberi izin dan tinggal, dan jika kamu mau, kamu boleh tinggal" }
summary:
  ar: "أثر يرويه يحيى عن مالك عن هشام بن عروة أن أباه عروة قال له: إذا كنت في سفر فإن شئت أن تؤذن وتقيم فعلت، وإن شئت فأقم ولا تؤذن؛ وهو في باب النداء في السفر وعلى غير وضوء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن ابن أبي شيبة أخرجه عن حاتم بن إسماعيل عن هشام. {cite:muwatta-maruf-1997 p.121} {cite:muwatta-maruf-1997 p.122}"
  tr: "Yahya'nın Malik'ten, o da Hişam ibn Urve'den rivayet ettiği bir hadiste, babası Urve'nin kendisine şöyle dediği belirtilir: \"Yolculukta iken, dilerse ezan okuyabilir ve ikamet edebilirsin; dilerse de ikamet edebilir, ezan okumayabilirsin.\" Bu hadis, abdest almadan yolculukta ezan okuma bölümünde yer almaktadır. Editör, bu hadisin Ebu Musab ve Suveyd tarafından Malik'ten, İbn Abi Şeybe'nin ise Hatim ibn İsmail'den, o da Hişam'dan rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.121} {cite:muwatta-maruf-1997 s.122}"
  id: "Sebuah riwayat yang dinarasikan oleh Yahya dari Malik, dari Hisham ibn Urwah, bahwa ayahnya, Urwah, berkata kepadanya: “Jika kamu sedang bepergian, jika kamu ingin mengumandangkan azan dan iqamah, boleh kamu lakukan; dan jika kamu mau, maka kumandangkan iqamah dan jangan mengumandangkan azan.” Ini terdapat dalam surah tentang mengumandangkan azan saat bepergian dan tanpa wudhu. Editor menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik, dan bahwa Ibn Abi Shaybah meriwayatkannya dari Hatim ibn Ismail, dari Hisham. {cite:muwatta-maruf-1997 p.121} {cite:muwatta-maruf-1997 p.122}"
