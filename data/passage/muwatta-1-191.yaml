label: { ar: "الموطأ 191 — عروة لابنه: في السفر إن شئت أذنت وأقمت وإن شئت أقمت", en: "Muwatta 191" }
summary:
  ar: "أثر يرويه يحيى عن مالك عن هشام بن عروة أن أباه عروة قال له: إذا كنت في سفر فإن شئت أن تؤذن وتقيم فعلت، وإن شئت فأقم ولا تؤذن؛ وهو في باب النداء في السفر وعلى غير وضوء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن ابن أبي شيبة أخرجه عن حاتم بن إسماعيل عن هشام. {cite:muwatta-maruf-1997 p.121} {cite:muwatta-maruf-1997 p.122}"
