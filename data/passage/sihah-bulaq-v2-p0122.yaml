text: |-
  *⁦(حى)⁩*
  ٤٦٥
  ان سراجالكريم مغخره • قحعلى به العين اذا ماتجهره
  وهذا من المقلوب والمعن يحلى بالعين وكذلك حلافلان بعينى وفى عبني يحلوحلاوة قال
  الاصمعى حلى فى عبى بالكسرو-لا فى فى بالفتح ويقال أيضاحليت المرأة اى صارت ذات
  حلى ت نهى حلية وحالية ونسوة حوال وحلميتها تحلية ومنه سيف محلى وحلميت الرجل تحلية
  أيضا أى وصفت حايته وحليت الشئ في عين صاحبه وحليت الطعام جعلته حلوا وربعا قالوا
  حلات السويق همز واماليسر بهسموز واستحلاه من الحلاوة كمايقال استجاده من الجودة
  وتحلى بالحلى أى تزين به وقولهم لم يحل منه بطائل أى لم يسستفدمنه كبير فائدة ولا يت كام به
  الامع الحجد والخلوا التى تؤ كل تمدوتقصر قال الكميت
  من ريب دهرأرى حوادبه • تعتزحلواء ماشدائدها
  والجلاوى على فعالى بالضم نبت ووقع فلان على حسلاوة القفا بالضم أى على وسط القفا
  وكذلات على -لاوى القسفا وحلاوا. القفا اذافتحت مددث واذا ضممت تصرت ⁦(حى )⁩
  حيسه حباية اذا د فعت عنه وهذاشئ جى على فعل أى محظورلا يقرب وأحيت المكان
  جعلته حي وفى الخديث لاحى الاله ولرسوله وسمع الكسائى في تثنية الجى حوان قال
  والوجه حبان وقيل اعاصم بن ثابت الانصارى حى الدبر على فعيل بمعنى مفعول وساة
  المرأة أمّ زوجها لالغة فيها غير هذه وكل شئ من قبل الزوج مثل الاب والاخ فهم الاحاء
  واحدهم حا وفيه أربع اغات حامثل قفاوحومثل أبو وحم مثل أب وحم ساكنة الميم
  مهموزة عن الفراء وانتد
  قلت لبوّاب لديه دارها • ميذن فانى ل،وهاد جارها
  ويروى جها بترك الهمز وكل شيء من قبل المرأة فهم الاختان والصهر يجمع هذا كله وأصل
  حم حوبالتحريك لان جعه أجاء مثل آياء وقد ذكرنا فى الاخ أن جو من الاسماء التى لا تكون
  موحدة الامضافة وقد جاء فى الشعرمة رداقال رحل من ثقيف• هى ماكنتى وتزعم أنى لهاحو
  والهاة عضلة الساق قال الاصممي وفى ساق الفرس حاتان وهما اللهمتان اللتان فى عرض
  الساق تريان كالعصبتين من ظاهر وباطن والجمع حوات والجامى الفعل من الابل
  الذى طال مكنه عندهم ومنه قوله تعالى ولا وصيطة ولاحام قال الفرّاءاذ ا لقح وأدولده فقد
  حى ظهره فلايركب ولا يجزله وبرولا ينع من مرعى والماميتان ماعن يين السسنبك وشماله
  وفلان جامى الحقيقة مثل حامى الذماروابهع حاة وحامية وفلان حامى الهيا أى يحمى حوزة
  وماوليه قال الحجاج • حاى الحيامرس الضرير• وحة العشرب سمها وضر ها وأصل
  حوأوحى والهاءعوض وأماحة الحرّوهى معظمه فيالتشديد وحيا الكأس أول سورتها
  وسوة الالم سودته وينشد
  ما خلتنى ذات بعدكم ضمذا • أشب واليكم حوّة الالم
  وحيب المريض الطعام حية وجوة واحتميت من الطعام احتماء وأماقول الشاعر
  وقالوا يالأشجع يوم هيج • ووسط الدارضربا واحتمايا
  قانمها أخر جه على الإصل وهي لغة لبعض العرب وحيت عن كداحية بالتشديد وححية
