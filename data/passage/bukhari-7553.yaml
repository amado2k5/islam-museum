label:
  ar: "البخاري 7553 — إن رحمتي سبقت غضبي"
  en: "Bukhari 7553 — My mercy outstrips My anger"
  ur: "بخاری 7553 — میری رحمت میرے غضب پر سبقت لے گئی"
text: "لما قضى الله الخلق كتب كتابا عنده غلبت أو قال سبقت رحمتي غضبي. فهو عنده فوق العرش ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7553: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7553: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7553: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
