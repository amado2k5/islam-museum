text: "… وكذا،،،،،، وأخرجه عبد الرزاق والطيالسى برقم والبخارى في الأطعمة، والدارمى وابن ماجه والحميدى. ودلائل النبوة للبيهقى : والطحاوى في مشكل الأثار - والبغوى والترمذى في الأطعمة : باب ما جاء أن المؤمن يأكل في معى واحد وقال هذا حديث حسن …"
summary:
