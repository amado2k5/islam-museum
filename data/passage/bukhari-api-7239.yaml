label: { ar: "صحيح البخاري 7239 — «لولا أن أشق على أمتي»", en: "Sahih al-Bukhari 7239 — 'were it not that I would burden my community'", ur: "صحیح بخاری 7239 — «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا»", fr: "Sahih al-Bukhari 7239 — « si je ne craignais d'accabler ma communauté »", es: "Sahih al-Bujari 7239 — «si no temiera agobiar a mi comunidad»" }
text: "… عُمَرُ فَقَالَ الصَّلاَةَ يَا رَسُولَ اللَّهِ، رَقَدَ النِّسَاءُ وَالصِّبْيَانُ، فَخَرَجَ وَرَأْسُهُ يَقْطُرُ يَقُولُ \" لَوْلاَ أَنْ أَشُقَّ عَلَى أُمَّتِي ـ أَوْ عَلَى النَّاسِ، وَقَالَ سُفْيَانُ أَيْضًا، عَلَى أُمَّتِي ـ لأَمَرْتُهُمْ بِالصَّلاَةِ هَذِهِ السَّاعَةَ \". قَالَ ابْنُ جُرَيْجٍ عَنْ عَطَاءٍ عَنِ ابْنِ عَبَّاسٍ أَخَّرَ النَّبِيُّ هَذِهِ الصَّلاَةَ فَجَاءَ عُمَرُ فَقَالَ يَا رَسُولَ اللَّهِ رَقَدَ النِّسَاءُ وَالْوِلْدَانُ. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7239، يرد فيه ذكر «لولا أن أشق على أمتي». يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 7239 (Wishes), whose wording mentions 'were it not that I would burden my community'. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 7239، جس کے الفاظ میں «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا» کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 7239, dont le texte mentionne « si je ne craignais d'accabler ma communauté ». Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 7239, cuyo texto menciona «si no temiera agobiar a mi comunidad». El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
