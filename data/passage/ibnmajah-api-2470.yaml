label: { ar: "سنن ابن ماجه 2470 — الأب والأبوة", en: "Sunan Ibn Majah 2470 — the father and fatherhood", ur: "سنن ابن ماجہ 2470 — باپ اور والدیت", es: "Sunan Ibn Majah 2470 — El padre y la paternidad" }
text: "… عُبَيْدُ اللَّهِ بْنُ مُوسَى، عَنْ إِسْرَائِيلَ، عَنْ سِمَاكٍ، أَنَّهُ سَمِعَ مُوسَى بْنَ طَلْحَةَ بْنِ عُبَيْدِ اللَّهِ، يُحَدِّثُ عَنْ أَبِيهِ، قَالَ مَرَرْتُ مَعَ رَسُولِ اللَّهِ فِي نَخْلٍ فَرَأَى قَوْمًا يُلَقِّحُونَ النَّخْلَ فَقَالَ \" مَا يَصْنَعُ هَؤُلاَءِ \". قَالُوا يَأْخُذُونَ مِنَ الذَّكَرِ فَيَجْعَلُونَهُ فِي الأُنْثَى. قَالَ \" مَا أَظُنُّ ذَاكَ يُغْنِي شَيْئًا \". فَبَلَغَهُمْ فَتَرَكُوهُ وَنَزَلُوا عَنْهَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2470، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2470 (The Chapters on Pawning), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2470، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2470 (Los capítulos sobre el empeño), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
