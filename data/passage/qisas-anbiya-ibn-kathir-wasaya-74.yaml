text: "… وشعاب جبالها وأنه قتل خلقاً من مردة الجن والغيلان، وكان له تاج عظيم، وكان يخطب الناس ودامت دولته أربعين سنة. فلما مات قام بالأمر بعده ولده يرد فلما حضرته الوفاة أوصى إلى ولده خنوخ، وهو إدريس على المشهور. هو : …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 74، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 74, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 74 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Qisas al-Anbiya' de Ibn Kathir, pág. 74, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Qisas al-Anbiya' d'Ibn Kathir, p. 74, évoquant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 74. sayfasından bir alıntı, son vasiyet veya ahitten ve ölüm saatinden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 74, menyebutkan wasiat atau perjanjian terakhir, dan saat kematian; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Suci\"."
