label: { ar: "سنن النسائي 4869 — ما يرتفع معه الإيمان حين الفعل", en: "Sunan al-Nasa'i 4869 — what faith is lifted by at the moment of the act", ur: "سنن نسائی 4869 — وہ عمل جس کے وقت ایمان اٹھ جاتا ہے", es: "Sunan al-Nasa'i 4869 — lo que eleva la fe en el momento del acto", fr: "Sunan al-Nasa'i 4869 — quelle foi est élevée au moment de l'acte", tr: "Sunan an-Nasa'i 4869 — Ameli gerçekleştirirken imanı yükselten şey", id: "Sunan an-Nasa'i 4869 — Sesuatu yang meningkatkan iman ketika melakukan suatu perbuatan" }
text: "أَخْبَرَنَا عَبْدُ الرَّحْمَنِ بْنُ مُحَمَّدِ بْنِ سَلاَّمٍ، قَالَ حَدَّثَنَا إِسْحَاقُ الأَزْرَقُ، عَنِ الْفُضَيْلِ بْنِ غَزْوَانَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يَزْنِي الْعَبْدُ حِينَ يَزْنِي وَهُوَ مُؤْمِنٌ وَلاَ يَشْرَبُ الْخَمْرَ حِينَ يَشْرَبُهَا وَهُوَ مُؤْمِنٌ وَلاَ يَسْرِقُ وَهُوَ مُؤْمِنٌ وَلاَ يَقْتُلُ وَهُوَ مُؤْمِنٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4869، يذكر ما يرتفع معه الإيمان حين الفعل. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 4869 (The Book of Oaths (qasamah), Retaliation and Blood Money), that mentions what faith is lifted by at the moment of the act. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 4869، جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4869 (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Sangre), menciona qué fe se fortalece en el momento del acto. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4869 (Le Livre des Serments (qasamah), de la Rétribution et du Prix du Sang), mentionne la foi qui est mise à l'épreuve au moment de l'acte. Le Navigateur des Piliers et des Branches de la Foi répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sunan-ı Nesai'de yer alan 4869 numaralı hadis, kişinin imanını yükselten amellerden bahsetmektedir. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4869, menyebutkan amalan-amalan yang meninggikan iman seseorang. Hadits ini disusun oleh seorang peneliti yang mengkaji rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
