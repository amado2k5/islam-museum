text: "… حتى إذا كان عند باب الكوفة إذا نحن بقبور سبعة عن أيماننا، فقال: ما هذه القبور؟ فقالوا: يا أمير المؤمنين، إن خباب بن الأرت توفي بعد مخرجك إلى صفين، فأوصى أن يدفن في ظاهر الكوفة، وكان الناس إنما يدفنون موتاهم …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 336، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
