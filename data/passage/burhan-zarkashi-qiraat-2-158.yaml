label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 158 — قراءات القرآن، القراء", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 158 — the readings of the Qur'an; the readers", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 158 — قرآن کی قراءتیں، قراء" }
text: "… : أى على وجه واحد وهو أن يعبده فى السراء دون الضراء، وهذه الوجوه هى القراءات السبع التى قرأها القراء السبعة فإنها كلها صحت عن رسول اللٰه عليلي، وهو الذى جمع عليه عثمان المصحف وهذه القراءات السبع اختيارات أولئك القراء …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 158، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 158, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 158 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
