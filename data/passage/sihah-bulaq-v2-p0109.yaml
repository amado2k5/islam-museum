text: |-
  قوله تشذرأى توعد قال أبو
  صبيداست أشك فيها بالذال قال
  وبعضهم يقول تشزر بالزاى
  إه قالد المؤاف
  A٧٨
  •⁦(ذكا)⁩.
  السنام والذرا أيضااسم لماذرته الرمح واسم الدمع المص-بوب قال سليمان بن صردلعلى
  رضى اللٰه عنه بلفق عن أمير المؤمنين ذرومن قول تشدرلى فيه بالوعيد فسرت اليه جوادا
  قوه ذرومن قول أى طرفمن ولم يتكامل ويقال مرفلان يذروذروا أى ير زاسريعا
  قال العجاج• ذاراذ الاق العزازأ حصفا* وذرا الذي أى سقط وذروته أنا أى طيرته
  وأذهبته قال أرس
  اذا مقرم منا ذراحدنابه • تحمط مناناب آخر مقرم
  والذاريات ارياح وذرت الريح التراب وغيره تذروه وتذريه ذرواوذريا أسفته ومنه
  قولهم ذرّى الناس الحنطة وأذريت الذى اذا ألقيته كالقائك الحب للزرع وطعنه فأذراه
  عن ظهرداته أى ألقاه واستذرت المعزى أى اشتهت الغدل مثل استدرت واستذريت
  بالشهجرة أى استظلات بم اوصرت فى دفتها واستذريت بفلان أى التجأت اليه وصرت
  فى كنفه وتذرية الاكداس معروفة والمذرى خشبة ذات أطراف يذرى بهاالطعام
  وتنقجا الاكداس من التين ومنه ذرّيت قاب المعدن اذاطلبت منه الذهب والذرة حب
  معسروف وأصله ذروأو ذرى والهاء عوض قال أبوز يدذرّيت الشاة تذرية وهوأن
  تجزصوفها وتدع فوق ظهرهاشيأمنه لتعرف به وذلاً فى الضأن خاصسة وفى الابل قال
  وفلان يذرى حسبه أى يمدحه ويرفع من شأنه وأنشدرؤية
  عمدا أذرى حسبى أن يشتا • بم ذرهذارعجّ البلغما
  وتذريت السنام علوته وفرعته الاصمعى تذرّيت بن فلان وتنصيتهم اذاتروجت فى الذروة
  منهم وااناصية والمذروان أطراف الاليين ولا واحدلهما لانه لو كان واحدهمامذرى على
  ما يزعم أبو عبيسدة اقالوا فى التنفيسة مذريان لات المقصوراذا كان على أربعسة أحرف يثنى
  بإلياء على كل حال فحومقلى ومقليان والمذروان من القوس الموضعان اللذان يقع عليهما
  الوترمن أعلى ومن أسفل ولا واحدله ما وقواهم جاءفلان ينفض مذرويه اذاياء باغيايتهدد
  قال عنترة بهجو عمارة بن زياد العبسى
  أحولى تنفض استك مذرويما • لتقتلى فها أناذا عارا
  بريدياعمارة وأذرت الميزد.عهاصبته ⁦( كا)⁩ الذكاءعد ودحدة القلب وقدذكى
  الرجل بالكسريذ كذكاءفهوذ كت على فعيل والذكاه أيضا السن وقال الجاج فررت
  عن ذكاء وبلغت الدابة الذكاءأى السنْ وذكاء بالضم غير مصروف اسم للشمس معرفة
  لا تدخلها الالف واللام تقول هذه ذ كاطالعة ويقال للصبح ابن ذكاء لأانه من ضوتها
  فالحد الارقط :
  فوردت قبل انيلاج الفجر • وابن ذ كاء كامن فى كفر
  والتذكية الذيح وتذكية المنارا يقادها ورفعها ويقال أيضاذكى الرجل اذا أسنّ والمذاكى
  الخيل التى قد أتى عليها بعد قروحها سفة أوسنتان الواحدة مذك مثل الخلف من الابل
  وفى المثل جرى الذ كات غلاء وذكت النارتذ كوذ كامة- ورأى اشستعلت وأذكيتها
  أنا وأذ كيت عليه العيون اذا أرسلت عليه الطلائع قال الشاعر ف الذار
  وظل لنايوم كأنَ أواره ل، ذ كاالنار من فجم الفروع طويل
  رد حدوان
