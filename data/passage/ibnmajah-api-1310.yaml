label: { ar: "سنن ابن ماجه 1310 — الرخصة", en: "Sunan Ibn Majah 1310 — the concession (rukhsa)", ur: "سنن ابن ماجہ 1310 — رخصت", fr: "Sunan Ibn Majah 1310 — la dispense (rukhsa)", es: "Sunan Ibn Mayah 1310 — la dispensa (rukhsa)", tr: "Sünen İbn Mace 1310 — Lisans", id: "Sunan Ibnu Majah 1310 — Lisensi" }
text: "… عَلِيٍّ الْجَهْضَمِيُّ، حَدَّثَنَا أَبُو أَحْمَدَ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ عُثْمَانَ بْنِ الْمُغِيرَةِ، عَنْ إِيَاسِ بْنِ أَبِي رَمْلَةَ الشَّامِيِّ، قَالَ سَمِعْتُ رَجُلاً، سَأَلَ زَيْدَ بْنَ أَرْقَمَ هَلْ شَهِدْتَ مَعَ رَسُولِ اللَّهِ ـ عِيدَيْنِ فِي يَوْمٍ قَالَ نَعَمْ. قَالَ فَكَيْفَ كَانَ يَصْنَعُ قَالَ صَلَّى الْعِيدَ ثُمَّ رَخَّصَ فِي الْجُمُعَةِ ثُمَّ قَالَ \" مَنْ شَاءَ أَنْ يُصَلِّيَ فَلْيُصَلِّ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1310، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 1310 (Establishing the Prayer and the Sunnah Regarding Them), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1310، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 1310, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 1310, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Majah'ın Sünen'inde 1310 numaralı hadiste bir muafiyetten bahsedilir. Farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahları derleyen bu eser, Kur'an, Sünnet, biyografi ve Sahabe ve ümmetlerden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1310, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
