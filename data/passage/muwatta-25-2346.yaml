label: { ar: "الموطأ 2346 — مالك: المكاتب الذي أعتقه سيده عند الموت يعتق بقدر ما يحمله الثلث", en: "Muwatta 2346" }
summary:
  ar: "قال مالك في مكاتب أعتقه سيده عند الموت: إن لم يحمله ثلث الميت عتق منه قدر ما حمل الثلث، ويوضع عنه من الكتابة قدر ذلك. مثاله: إن كان على المكاتب خمسة آلاف درهم، وقيمته ألفا درهم نقدا، وثلث الميت ألف درهم، عتق نصفه ويوضع عنه شطر الكتابة. {cite:muwatta-maruf-1997 p.368}"
