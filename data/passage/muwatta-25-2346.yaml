label: { ar: "الموطأ 2346 — مالك: المكاتب الذي أعتقه سيده عند الموت يعتق بقدر ما يحمله الثلث", en: "Muwatta 2346", es: "Muwatta 2346", fr: "Muwatta 2346", ur: "موطا 2346", tr: "El-Muvatta 2346 — Malik: Efendisi tarafından ölüm üzerine azat edilen bir köle, efendisinin mal varlığının üçte biri kadar azat edilir.", id: "Al-Muwatta 2346 — Malik: Seorang budak yang dibebaskan oleh tuannya setelah kematiannya dibebaskan sejauh sepertiga dari harta miliknya mampu ditanggung." }
summary:
  ar: "قال مالك في مكاتب أعتقه سيده عند الموت: إن لم يحمله ثلث الميت عتق منه قدر ما حمل الثلث، ويوضع عنه من الكتابة قدر ذلك. مثاله: إن كان على المكاتب خمسة آلاف درهم، وقيمته ألفا درهم نقدا، وثلث الميت ألف درهم، عتق نصفه ويوضع عنه شطر الكتابة. {cite:muwatta-maruf-1997 p.368}"
  tr: "Malik, efendisi tarafından ölüm üzerine azat edilen bir köle hakkında şöyle demiştir: Eğer ölenin mal varlığı kölenin değerini karşılamıyorsa, köle mal varlığının karşıladığı kısım kadar azat edilir ve azat bedelinin geri kalanı buna göre azaltılır. Örneğin, kölenin beş bin dirhem borcu varsa, nakit değeri iki bin dirhem ise ve ölenin mal varlığı bin dirhem ise, kölenin yarısı azat edilir ve azat bedelinin yarısı buna göre azaltılır. {cite:muwatta-maruf-1997 s.368}"
  id: "Malik berkata mengenai seorang budak yang dibebaskan oleh tuannya setelah kematiannya: Jika harta warisan almarhum tidak mencukupi nilai budak tersebut, maka budak tersebut dibebaskan sesuai dengan jumlah yang ditanggung oleh harta warisan, dan jumlah pembebasan yang tersisa dikurangi sesuai dengan itu. Misalnya, jika budak tersebut berhutang lima ribu dirham, dan nilainya dua ribu dirham dalam bentuk tunai, dan harta warisan almarhum adalah seribu dirham, maka setengah dari dirinya dibebaskan, dan setengah dari jumlah pembebasan dikurangi sesuai dengan itu. {cite:muwatta-maruf-1997 p.368}"
