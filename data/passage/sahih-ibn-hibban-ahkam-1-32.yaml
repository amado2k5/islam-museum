text: "… أحدٌ من الصحابة بالرجوع والاغتسال للجمعة ثم العود إليها، ففي إجماعهم على ما وصفنا أبينُ البيانِ بأن الأمر كان من المصطفى،، بالاغتسال للجمعة أمرُ ندبٍ لا حتم. ذكرُ خبرٍ ثانٍ يُصرَّحُ بأن الاغتسالَ للجمعة غيرُ فرض على مَنْ شهدها أخبرنا …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 1، ص 32، يرد فيه ذكر ما فُرض على الناس، والفرض، والمندوب، والحتم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 1, p. 32, whose wording mentions what was made obligatory on people, the obligatory (fard), the recommended (mandub), the binding (hatm), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
