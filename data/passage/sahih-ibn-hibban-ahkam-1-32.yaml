text: "… أحدٌ من الصحابة بالرجوع والاغتسال للجمعة ثم العود إليها، ففي إجماعهم على ما وصفنا أبينُ البيانِ بأن الأمر كان من المصطفى،، بالاغتسال للجمعة أمرُ ندبٍ لا حتم. ذكرُ خبرٍ ثانٍ يُصرَّحُ بأن الاغتسالَ للجمعة غيرُ فرض على مَنْ شهدها أخبرنا …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 1، ص 32، يرد فيه ذكر ما فُرض على الناس، والفرض، والمندوب، والحتم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 1, p. 32, whose wording mentions what was made obligatory on people, the obligatory (fard), the recommended (mandub), the binding (hatm), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 1، ص 32 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، مندوب، حتمی حکم، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 1, p. 32, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), le recommandé (mandub), le contraignant (hatm), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 1, p. 32, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo recomendado (mandub), lo vinculante (hatm), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, 1. Cilt, 32. sayfadan, farz olan, tavsiye edilen ve sünnet olan amelleri içeren bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid 1, halaman 32, yang menyebutkan apa yang wajib bagi manusia, termasuk amalan wajib, amalan yang dianjurkan, dan amalan yang diwajibkan. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
