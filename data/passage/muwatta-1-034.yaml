label: { ar: "الموطأ 34 — من توضأ فليستنثر ومن استجمر فليوتر", en: "Muwatta 34" }
text: "من توضأ فليستنثر، ومن استجمر فليوتر"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي إدريس الخولاني عائذ الله بن عبد الله عن أبي هريرة، في باب العمل في الوضوء، بمعنى الحديث السابق: الاستنثار في الوضوء والإيتار في الاستجمار. ويخرّجه المحقق عند مسلم (1/146) وابن ماجه (409) والنسائي (1/66) وابن خزيمة (75) من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه لا يصح عن مالك ولا عن ابن شهاب في هذا الحديث غير هذا الإسناد. {cite:muwatta-maruf-1997 p.52}"
