label: { ar: "الموطأ 34 — من توضأ فليستنثر ومن استجمر فليوتر", en: "Muwatta 34", es: "Muwatta 34", fr: "Muwatta 34", ur: "موطا 34", tr: "Al-Muwatta 34 — Abdest alan kimse burnunu çalkalasın ve kendini temizleyen kimse tek sayıda taş kullansın." }
text: "من توضأ فليستنثر، ومن استجمر فليوتر"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي إدريس الخولاني عائذ الله بن عبد الله عن أبي هريرة، في باب العمل في الوضوء، بمعنى الحديث السابق: الاستنثار في الوضوء والإيتار في الاستجمار. ويخرّجه المحقق عند مسلم (1/146) وابن ماجه (409) والنسائي (1/66) وابن خزيمة (75) من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه لا يصح عن مالك ولا عن ابن شهاب في هذا الحديث غير هذا الإسناد. {cite:muwatta-maruf-1997 p.52}"
  tr: "Malik, bu hadisi İbn Şihab'dan, o da Ebu İdris el-Havlani'den, o da A'idh Allah ibn Abd Allah'tan, o da Ebu Hurayra'dan nakletmiştir; abdest amelleri bölümünde, önceki hadisle aynı anlamda: abdest sırasında burnu yıkamak ve tuvaletten sonra temizlik için tek sayıda taş kullanmak. Editör, bu hadisi Malik'in sahabelerinin rivayet zincirleriyle Müslim (1/146), İbn Majah (409), el-Nesai (1/66) ve İbn Huzeyme'de (75) de yer almaktadır. İbn Abd el-Barr'ın, bu hadisin Malik veya İbn Şihab'dan başka sahih bir rivayet zinciri bulunmadığını söylediğini aktarmaktadır. {cite:muwatta-maruf-1997 s.52}"
  id: "Malik meriwayatkannya dari Ibn Shihab, dari Abu Idris al-Khawlani, dari 'A'idh Allah ibn 'Abd Allah, dari Abu Hurayrah, dalam bab tentang tindakan wudhu, dengan makna yang sama seperti hadits sebelumnya: berkumur saat wudhu dan menggunakan sejumlah batu ganjil untuk bersuci setelah buang air besar. Editor memasukkannya dalam Muslim (1/146), Ibn Majah (409), al-Nasa'i (1/66), dan Ibn Khuzaymah (75) melalui sanad para sahabat Malik. Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa tidak ada sanad lain untuk hadits ini yang sahih dari Malik atau Ibn Shihab. {cite:muwatta-maruf-1997 p.52}"
