text: "… لو أفشيت إليك سراً لي ! ثم دخل يونس فأكرمه ورفعه، وأتاه موسى بن عبد الرحمن فاختص بهما وأخذ رأيهما. وقيل إن موسى المذكور اختص به القاضي بكار، وكان يتبرك به لزهده، فقال له يوماً : يا أبا هارون من …"
summary:
