label: { ar: "مسلم 2942 — قصة الجساسة", en: "Muslim 2942 — The Jassasah story", es: "Muslim 2942 — La historia de Jassasah", fr: "Muslim 2942 — L'histoire de Jassasah", ur: "مسلم 2942 - جسسہ کہانی", tr: "Müslim 2942 — El-Cessasah'ın Hikayesi", id: "Muslim 2942 — Kisah Al-Jassasah" }
text: "قالت فاطمة بنت قيس: حدثني تميم الداري أنه ركب البحر في سفينة فلعب بهم الموج شهراً ثم أرفؤوا إلى جزيرة فلقيتهم دابة أهلب قالت: أنا الجساسة، انطلقوا إلى هذا الرجل في الدير؛ فإذا فيه أعظم إنسان رأيناه قط خلقاً وأشده وثاقاً، مجموعة يداه إلى عنقه بالحديد... قال: «إني أنا المسيح، وإني أوشك أن يؤذن لي في الخروج»"
summary:
  ar: "رواية فاطمة بنت قيس عن تميم الداري في باب قصة الجساسة من كتاب الفتن في صحيح مسلم؛ جمع النبي الناس ليحدثهم بها — أطول نصوص فتنة الدجال في الدواوين، وفيه أسئلته عن نخل بيسان وبحيرة طبرية وعين زغر وخبر نبي الأميين."
  tr: "Sahih Müslim'deki Sıkıntılar Kitabı'nda, El-Cesse kıssası bölümünde, Tamim el-Dari'den rivayet edilen Fatıma bint Kays'ın anlatımı şöyledir: Peygamber, insanları bir araya toplayıp onlara bunu anlattı. Bu, Divanlarda Deccal'in sıkıntıları hakkında en uzun metindir ve Beysan'daki hurma ağaçları, Taberiye Gölü, Zuğrar pınarı ve ümmilerin Peygamberinin haberleri hakkındaki sorularını içerir."
  id: "Riwayat Fatimah binti Qais berdasarkan Tamim al-Dari dalam bab tentang kisah al-Jassasah dari Kitab Kesengsaraan dalam Sahih Muslim; Nabi mengumpulkan orang-orang untuk menceritakan hal itu kepada mereka — teks terpanjang tentang kesengsaraan Antikristus dalam Diwan, dan berisi pertanyaan-pertanyaan beliau tentang pohon kurma Baysan, Danau Tiberias, mata air Zughar, dan kabar tentang Nabi bagi orang-orang yang tidak bisa membaca dan menulis."
