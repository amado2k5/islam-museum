label: { ar: "مسلم 2942 — قصة الجساسة", en: "Muslim 2942 — The Jassasah story" }
text: "قالت فاطمة بنت قيس: حدثني تميم الداري أنه ركب البحر في سفينة فلعب بهم الموج شهراً ثم أرفؤوا إلى جزيرة فلقيتهم دابة أهلب قالت: أنا الجساسة، انطلقوا إلى هذا الرجل في الدير؛ فإذا فيه أعظم إنسان رأيناه قط خلقاً وأشده وثاقاً، مجموعة يداه إلى عنقه بالحديد... قال: «إني أنا المسيح، وإني أوشك أن يؤذن لي في الخروج»"
summary:
  ar: "رواية فاطمة بنت قيس عن تميم الداري في باب قصة الجساسة من كتاب الفتن في صحيح مسلم؛ جمع النبي الناس ليحدثهم بها — أطول نصوص فتنة الدجال في الدواوين، وفيه أسئلته عن نخل بيسان وبحيرة طبرية وعين زغر وخبر نبي الأميين."
