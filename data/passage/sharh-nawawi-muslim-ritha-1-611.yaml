text: "… اللّه.. - باب فِي التَّكْبِيرِ عَلَى الْجَنَازَةِ - حَدْثَنَا يَحْيِى ابن يَحْيى، قال: قَرَأْتُ عَلَى عَنِ ابْنِ شيهَابٍ، عَنْ سَعِيدٍ أبْنِ الْمُسَيْبِ عَنْ أبِي هُرَيْرَةً، أن رسول اللّه نَعَى لِلنَّاس النَّجَاشِيَّ فِي الْيَوْمِ الَّذِي مَاتَ فِيهِ، فَخَرَجَ بِهِمْ إِلَى الْمُصَلْى، …"
summary:
  ar: "مقطع من المنهاج شرح صحيح مسلم بن الحجاج، المجلد المصوَّر 1، ص 611، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, scan volume 1, p. 611, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنہاج شرح صحیح مسلم بن الحجاج، اسکین جلد 1، ص 611 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, volume numérisé 1, p. 611, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, volumen escaneado 1, p. 611, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Sahih Muslim ibn al-Hajjaj tefsirinin 1. cildinin 611. sayfasından, bir ağıt ve ölüm duyurusunu içeren bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgülerden derlenmiştir."
  id: "Cuplikan dari komentar Sahih Muslim Ibnu al-Hajjaj, Volume 1, halaman 611, yang berisi eulogi dan pengumuman kematian; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
