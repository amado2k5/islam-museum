text: "… العلامة، الحافظ، المفسِّر، الشيخ الإمام، مفخر العراق. ه. وقال : كان ذا حظّ عظيم وصيتٍ بعيد في الوعظ، يحضر مجالسَه الملوكُ والوزراءُ، وبعض الخلفاء، والأئمةُ والكبراء، لا يكاد المجلس يَنْقُصُ عن ألوف كثيرة، حتى قيل في مجالسه : إنه حُزِر …"
