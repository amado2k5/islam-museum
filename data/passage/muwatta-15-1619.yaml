label: { ar: "الموطأ 1619 — مالك: الرجل يتظاهر من أمته، إن أراد أن يصيبها فعليه كفارة الظهار قبل أن يطأها", en: "Muwatta 1619", es: "Muwatta 1619", fr: "Muwatta 1619", ur: "موطا 1619", tr: "El-Muvatta 1619 — Malik: Bir erkek, cariyesine zihar yemini ederse, onunla cinsel ilişkiye girmek istiyorsa, cinsel ilişkiye girmeden önce ziharın kefaretini ödemelidir.", id: "Al-Muwatta 1619 — Malik: Seorang laki-laki yang bernazar zihar terhadap budak perempuannya, jika ia ingin bersetubuh dengannya, harus melakukan penebusan zihar sebelum bersetubuh dengannya." }
summary:
  ar: "يقول مالك في الرجل يتظاهر من أمته، إنه إن أراد أن يصيبها، فعليه كفارة الظهار قبل أن يطأها. {cite:muwatta-maruf-1997 p.70}"
  tr: "Malik, bir erkeğin cariyesine karşı zihar yemini etmesi durumunda, onunla cinsel ilişkiye girmek istiyorsa, bunu yapmadan önce ziharın kefaretini ödemesi gerektiğini söyler. {cite:muwatta-maruf-1997 s.70}"
  id: "Malik mengatakan mengenai seorang pria yang bernazar dengan budak perempuannya, bahwa jika ia ingin berhubungan intim dengannya, ia harus melakukan penebusan dosa zihar terlebih dahulu. {cite:muwatta-maruf-1997 p.70}"
