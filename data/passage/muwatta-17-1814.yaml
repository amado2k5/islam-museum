label: { ar: "الموطأ 1814 — مالك عن داود بن الحصين عن أبي سفيان مولى ابن أبي أحمد عن أبي هريرة: رخص في بيع العرايا بخرصها فيما دون خمسة أوسق أو في خمسة أوسق، شك داود", en: "Muwatta 1814", es: "Muwatta 1814", fr: "Muwatta 1814", ur: "موطا 1814", tr: "El-Muvatta 1814 — Malik, Davud ibn el-Hüseynin'den, o da İbn Ebi Ahmed'in azatlı kölesi Ebu Sufyan'dan, o da Ebu Hurayra'dan rivayetle: Olgunlaşmamış hurmaların tahmini olarak, beş vasktan az veya beş vasklık miktarlarda satılmasına izin verdi. Davud bu konuda emin değildi.", id: "Al-Muwatta 1814 — Malik, berdasarkan riwayat Dawud ibn al-Husayn, berdasarkan riwayat Abu Sufyan, budak yang dibebaskan oleh Ibn Abi Ahmad, berdasarkan riwayat Abu Hurayrah: Beliau memperbolehkan penjualan kurma mentah dengan perkiraan dalam jumlah kurang dari lima wasq atau dalam jumlah lima wasq. Dawud tidak yakin." }
summary:
  ar: "يروي مالك عن داود بن الحصين عن أبي سفيان مولى ابن أبي أحمد عن أبي هريرة أن رسول الله رخص في بيع العرايا بخرصها، فيما دون خمسة أوسق، أو في خمسة أوسق، يشك داود قال: خمسة أو دون خمسة. {cite:muwatta-maruf-1997 p.142} {cite:muwatta-maruf-1997 p.143}"
  tr: "Malik, Davud ibn el-Hüseynin'den, o da İbn Ebi Ahmed'in azatlı kölesi Ebu Sufyan'dan, o da Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü'nün ağaçtaki olgunlaşmamış hurmaların tahmini olarak, beş vasktan az veya beş vask karşılığında satılmasına izin verdiğini nakde çevirmiştir. Davud emin değildi; beş veya beşten az dedi. {cite:muwatta-maruf-1997 s.142} {cite:muwatta-maruf-1997 s.143}"
  id: "Malik meriwayatkan dari Dawud ibn al-Husayn, dari Abu Sufyan, budak yang dibebaskan oleh Ibn Abi Ahmad, dari Abu Hurayrah, bahwa Rasulullah SAW memperbolehkan penjualan kurma mentah di pohon dengan cara memperkirakan harga, dengan jumlah kurang dari lima wasq, atau lima wasq. Dawud ragu-ragu; dia berkata: lima atau kurang dari lima. {cite:muwatta-maruf-1997 p.142} {cite:muwatta-maruf-1997 p.143}"
