label: { ar: "الموطأ 1482 — ربيعة بن أبي عبد الرحمن عن علماء: لم يتوارث من قتل يوم الجمل وصفين والحرة، ثم يوم قديد فلم يورث أحد من صاحبه إلا من علم أنه قتل قبله", en: "Muwatta 1482", es: "Muwatta 1482", fr: "Muwatta 1482", ur: "موطا 1482", tr: "El-Muvatta 1482 — Rabi’ah ibn Abi Abd al-Rahman, âlimlerin rivayetine göre: Deve, Siffin ve Harrah günlerinde öldürülenler birbirlerinden miras almadılar; Kudayd gününde öldürülenler de birbirlerinden miras almadılar, ancak ondan önce öldürüldüğü bilinenler hariç.", id: "Al-Muwatta 1482 — Rabi’ah ibn Abi Abd al-Rahman, berdasarkan riwayat ulama: Orang-orang yang gugur pada Hari Unta, Siffin, dan al-Harrah tidak saling mewarisi, demikian pula orang-orang yang gugur pada Hari Qudayd tidak saling mewarisi, kecuali mereka yang diketahui telah gugur sebelum dia." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن غير واحد من علمائهم أنه لم يتوارث من قتل يوم الجمل ويوم صفين ويوم الحرة، ثم كان يوم قديد فلم يورث أحد منهم من صاحبه شيئا، إلا من علم أنه قتل قبل صاحبه. {cite:muwatta-maruf-1997 p.24}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan, onların birden fazla âliminden rivayetle, Deve Günü, Siffin Günü ve Harrah Günü'nde öldürülenlerin birbirlerinden miras almadıklarını nakletmiştir. Sonra Kudeyd Günü geldi ve onlardan hiçbiri, kendisinden önce öldürüldüğü bilinenler hariç, arkadaşından miras almadı. {cite:muwatta-maruf-1997 s.24}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman, dan dari lebih dari satu ulama mereka, bahwa orang-orang yang gugur pada Hari Unta, Hari Siffin, dan Hari al-Harrah tidak saling mewarisi. Kemudian datang Hari Qudayd, dan tidak seorang pun dari mereka mewarisi apa pun dari sahabatnya, kecuali mereka yang diketahui telah gugur sebelum sahabatnya. {cite:muwatta-maruf-1997 p.24}"
