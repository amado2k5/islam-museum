ref: "187"
label:
  ar: "مسلم 187 — آخر أهل النار خروجا وآخر أهل الجنة دخولا"
  en: "Muslim 187 — The last to leave the Fire and the last to enter Paradise"
  ur: "مسلم 187 — آگ سے سب سے آخر میں نکلنے والا اور جنت میں سب سے آخر میں جانے والا"
  es: "Musulmán 187 — El último en abandonar el Fuego y el último en entrar al Paraíso"
  fr: "Muslim 187 — Les derniers à quitter le Feu et les derniers à entrer au Paradis"
  tr: "Müslim 187 — Cehennem ehlinin en son çıkanı ve cennet ehlinin en son girenidir."
text: "آخر من يدخل الجنة رجل فهو يمشي مرة ويكبو مرة وتسفعه النار مرة فإذا ما جاوزها التفت إليها فقال تبارك الذي نجاني منك لقد أعطاني الله شيئا ما أعطاه أحدا من الأولين والآخرين . فترفع له شجرة فيقول أى رب …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 187: آخر أهل النار خروجا وآخر أهل الجنة دخولا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 187: The last to leave the Fire and the last to enter Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 187: آگ سے سب سے آخر میں نکلنے والا اور جنت میں سب سے آخر میں جانے والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 187: El último en salir del Fuego y el último en entrar al Paraíso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim n° 187: Le dernier à quitter le Feu et le dernier à entrer au Paradis. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, nomor 187: “Orang terakhir dari penghuni neraka yang meninggalkannya dan orang terakhir dari penghuni surga yang memasukinya.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kumpulan hadits kanonik dan dalam Al-Muwatta."
