label: { ar: "الموطأ 392 — ابن عمر يقصر الصلاة بذي الحليفة إذا خرج حاجاً أو معتمراً", en: "Muwatta 392", es: "Muwatta 392", fr: "Muwatta 392", ur: "موطا 392", tr: "El-Muvatta 392 — İbn Ömer, Hac veya Umre için dışarı çıktığında Zül-Huleyfe'deki namazı kısaltır.", id: "Al-Muwatta 392 — Ibnu Umar mempersingkat salat di bulan Dzul Hulayfah jika ia pergi menunaikan ibadah haji atau umrah." }
summary:
  ar: "أول أثر في باب ما يجب فيه قصر الصلاة. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان إذا خرج حاجاً أو معتمراً قصر الصلاة بذي الحليفة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.210}"
  tr: "Namazın kısaltılmasının farz olduğu hallere ilişkin ilk hadis, Yahya'nın Malik'ten, o da Nafi'den rivayet ettiğine göre, Abdullah ibn Umar'ın Hac veya Umre'ye gittiğinde Zül-Hüleyfe'de namazı kısalttığıdır. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Abdül-Razzak ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.210}"
  id: "Hadits pertama mengenai keadaan di mana mempersingkat salat hukumnya wajib diriwayatkan oleh Yahya dari Malik, dari Nafi', bahwa Abdullah ibn Umar, ketika ia pergi haji atau umrah, mempersingkat salat pada Dzul Hulayfah. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, Abd al-Razzaq, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.210}"
