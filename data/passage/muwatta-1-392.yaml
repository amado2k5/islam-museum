summary:
  ar: "أول أثر في باب ما يجب فيه قصر الصلاة. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان إذا خرج حاجاً أو معتمراً قصر الصلاة بذي الحليفة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.210}"
