label: { ar: "صحيح مسلم 2040 — التطوع", en: "Sahih Muslim 2040 — the voluntary act (tatawwu')", ur: "صحیح مسلم 2040 — تطوع ⁦(نفلی عمل)⁩", fr: "Sahih Muslim 2040 — l'acte volontaire (tatawwu')", es: "Sahih Muslim 2040 — el acto voluntario (tatawwu')", tr: "Sahih Muslim 2040 — Gönüllülük", id: "Sahih Muslim 2040 — Sukarelawan" }
text: "وَحَدَّثَنَا يَحْيَى بْنُ يَحْيَى، قَالَ قَرَأْتُ عَلَى مَالِكٍ عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّهُ وَصَفَ تَطَوُّعَ صَلاَةِ رَسُولِ اللَّهِ قَالَ فَكَانَ لاَ يُصَلِّي بَعْدَ الْجُمُعَةِ حَتَّى يَنْصَرِفَ فَيُصَلِّي رَكْعَتَيْنِ فِي بَيْتِهِ. قَالَ يَحْيَى أَظُنُّنِي قَرَأْتُ فَيُصَلِّي أَوْ أَلْبَتَّةَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2040، يرد فيه ذكر التطوع. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 2040 (The Book of Prayer - Friday), whose wording mentions the voluntary act (tatawwu'). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 2040، جس کے الفاظ میں تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 2040, dont le texte mentionne l'acte volontaire (tatawwu'). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 2040, cuyo texto menciona el acto voluntario (tatawwu'). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 2040 numaralı hadis, gönüllü ibadetlerden bahsetmektedir. Bu hadis, farz ibadetler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh ibadetler, haram ibadetler ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2040, menyebutkan tentang ibadah sunnah. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
