summary:
  ar: "أبو الزناد عن الأعرج عن أبي هريرة: والذي نفسي بيده لقد هممت أن آمر بحطب فيحطب، ثم آمر بالصلاة فيؤذن لها، ثم آمر رجلا فيؤم الناس، ثم أخالف إلى رجال فأحرق عليهم بيوتهم؛ الحديث في التخلف عن الجماعة."
