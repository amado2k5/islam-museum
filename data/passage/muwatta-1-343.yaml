label: { ar: "الموطأ 343 — لقد هممت أن آمر بحطب فيحطب ثم أخالف إلى رجال فأحرق عليهم بيوتهم", en: "Muwatta 343", es: "Muwatta 343", fr: "Muwatta 343", ur: "موطا 343", tr: "El-Muvatta 343 — Odun toplattırmayı, sonra da bazı adamlara gidip evlerini yakmayı planlıyordum.", id: "Al-Muwatta 343 — Aku bermaksud memerintahkan pengumpulan kayu bakar, lalu pergi menemui beberapa orang dan membakar rumah-rumah mereka." }
text: "لقد هممت أن آمر بحطب فيحطب، ثم آمر بالصلاة فيؤذن لها، ثم آمر رجلاً فيؤم الناس، ثم أخالف إلى رجال فأحرق عليهم بيوتهم"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب فضل صلاة الجماعة على صلاة الفذ: أقسم النبي أنه همّ أن يأمر بحطب فيُحطب ثم يأمر بالصلاة فيؤذن لها ويأمر رجلاً فيؤم الناس، ثم يخالف إلى رجال يتخلفون عن الجماعة فيحرق عليهم بيوتهم، وأقسم أن أحدهم لو علم أنه يجد عظماً سميناً أو مرماتين حسنتين لشهد العشاء. ويفسر المحقق المرماة بما بين ظلفي الشاة من اللحم، ويخرّج الحديث عند البخاري ⁦(644، 7224)⁩ والنسائي (2/107) والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (18/331). {cite:muwatta-maruf-1997 p.189}"
  tr: "Malik, Ebu Zinad'dan, o da A'raj'dan, o da Ebu Hurayra'dan rivayetle, cemaat namazının bireysel namazdan üstünlüğü bölümünde şöyle anlatmaktadır: Peygamberimiz odun toplattırmayı, ezan okutmayı ve sonra da namazı kıldırmak üzere birini görevlendirmeyi niyet ettiğini yeminle ifade etmiştir. Ayrıca cemaat namazına katılmayanların evlerini yakmayı da niyet etmiştir. Onlardan herhangi birinin, orada yağlı bir kemik veya iki iyi et parçası bulacağını bilmesi halinde akşam namazına katılacağına yemin etmiştir. Araştırmacı, \"et eti\"nin koyunun toynakları arasındaki et anlamına geldiğini açıklamaktadır. Buhari (644, 7224), Nesai (2/107), Şafiî ve Beyhaki'nin hadislerini Malik'in sahabelerinin rivayet zincirleri üzerinden aktarıyor ve Temhid'e (18/331) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.189}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surah tentang keutamaan shalat berjamaah atas shalat perorangan: Nabi bersumpah bahwa beliau bermaksud untuk memerintahkan pengumpulan kayu bakar, kemudian memerintahkan azan dikumandangkan, dan kemudian menunjuk seorang laki-laki untuk memimpin shalat berjamaah. Beliau juga bermaksud untuk mendatangi orang-orang yang tidak hadir dalam shalat berjamaah dan membakar rumah mereka. Beliau bersumpah bahwa jika ada di antara mereka yang tahu akan menemukan tulang yang gemuk atau dua potong daging yang enak, maka ia akan menghadiri shalat Maghrib. Peneliti menjelaskan bahwa \"daging dari daging\" mengacu pada daging di antara kuku domba. Ia mengutip hadits dalam al-Bukhari (644, 7224), al-Nasa'i (2/107), al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (18/331). {mengutip:muwatta-maruf-1997 hal.189}"
