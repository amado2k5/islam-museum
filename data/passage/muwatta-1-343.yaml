label: { ar: "الموطأ 343 — لقد هممت أن آمر بحطب فيحطب ثم أخالف إلى رجال فأحرق عليهم بيوتهم", en: "Muwatta 343" }
text: "لقد هممت أن آمر بحطب فيحطب، ثم آمر بالصلاة فيؤذن لها، ثم آمر رجلاً فيؤم الناس، ثم أخالف إلى رجال فأحرق عليهم بيوتهم"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب فضل صلاة الجماعة على صلاة الفذ: أقسم النبي أنه همّ أن يأمر بحطب فيُحطب ثم يأمر بالصلاة فيؤذن لها ويأمر رجلاً فيؤم الناس، ثم يخالف إلى رجال يتخلفون عن الجماعة فيحرق عليهم بيوتهم، وأقسم أن أحدهم لو علم أنه يجد عظماً سميناً أو مرماتين حسنتين لشهد العشاء. ويفسر المحقق المرماة بما بين ظلفي الشاة من اللحم، ويخرّج الحديث عند البخاري (644، 7224) والنسائي (2/107) والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (18/331). {cite:muwatta-maruf-1997 p.189}"
