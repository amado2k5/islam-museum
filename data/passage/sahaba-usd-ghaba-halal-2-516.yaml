text: "سُلِيْمَان بن أَكَيْمةَ سُلَيمان بن مُسْهِر رسول اللّٰه عليل سُليمان، يكنّى أبا المُطَرِّف. حراماً أو تحرموا حلالاً، وأصبتم المَعْنَى، فلا بأس. أخرجه أبو نعيم، وأبو موسى. وكان خَيِّراً فاضلاً، له دين وعبادة، سكن الكوفة أوَّل ما نزلها المسلمون، وكان له …"
