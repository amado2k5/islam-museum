text: |-
  •(فصل الذين
  بالهدى أصلد اشتريوا فاستئلت اضمة على الساء خحذفت فالتق ساكان الياء والواو غذفت
  الاءوحرّكتّ الواد يجركتها لمااستقبلهاما كن ويمع الشراءلى أشرية وهو شاذلات فعلا
  لا يجمع على أفعلة والشرى بالتسكين الحظل ويقال اذلان طعمان أرى وشرى والشرى
  أيابجر الحنفل قال الهذلى
  على حتّ البراية زفخرى السواعد ظل فى شرى طاوال
  الواحدة شرية والشرية النخلة تنبت من النواة والشرى أيضار ذال المال مثل شواه وشرى
  البرق بالكسر يشرى شرى اذا كثراماته وقال
  أصاح زى البرق لم يغتمض • يموت فواقا ويشرى فوافا
  ومنه قولهم شرى زمام الناقة اذا كثر اضطرابه وشرى القرس أيضاف سيره واستشرى أى
  لج فى سنته فهوفرس شرى على فعيل وشرى الرجل وامتشرى ادالج فى الامر وشرى
  يلمد. أيضامن الشرى وهى خراج صغارلها لذع :ديد والرجل شر على نع-ل وشرى فلان
  غضبا اذا استطار غضيا والشرى طريق فى سلمى كثير الاسد وأشراء الجرم نواحيه
  الواحد شرى مقصور قال انشاعز
  لعن الكواعب بعديوم وصلنى • بشرى الفرات وبعديوم الجوسق
  أبوع-روأشريت الحوض وأشريت الجفسنة اذاملائتهما والشريان والشريان بالفتح
  والكسر شجر يتخذمنه القسى والشريان واحد الشرايين وهى العروق النابضة ومنبتها
  من القلب وشروى الشئءمثلد وشرورى اسم جبل وهوفعو عل والشراة انلحوارج الواحد شار
  عوا بذلل اقولهم انا شرينا أنفس_نا فى طاعة اللّٰه أى بعناها بالجنة حين فارقنا الائمة الجائرة
  بقال منه قد تشرّى الرجل والمذترى نجم ( ضا مابصره بشه وشصواشخص وأشصا
  صاحبه رفعه وفى المثل اذا ارجمن شاصيا فارفع يدا أى اذاسقط ورفع رجليه فاكفف
  عنه وشما السحاب أى ارتفع فى الهواء الكائىّ بقال للميت اذا انتفخ فارتفعت
  يداء ورجلاه قد شداينصى شصيافهو شاص ويقال للزقاق المعلوأة الشائلة القوائم والقرب
  اذا كانت علوأة أونفخ فيها فارتفعت قوائمهاشاصية والجمع شواص قال الاخطل يصف
  الزماق
  أنا -وانجروات 'صيات كانها * رجال من السودان لم تتسربل
  يعى زواق الحرو الشام لى مثال الباقلى نبت اذاشددت قصرت واداخففت مددت بقال له
  بالفارسية دكراونس شطا) شطااسم قرية بناحمة مصمرتنسب اليها الشياب النطوية وقول
  الشاءز تجلل بالشطى والحبرات،يريد الشطوى شظى النظية الفلقة من العص-
  ونحوها وابمع النظايا يقال تشظى الذى اذا تطاير شظايا وقال ( كالدرّت تين تشظى عنهما الصدف
  قال الاده هى النظى عظيم مستدق ملزق بالذراع فاذاتحرك ن موضعه قيل قد شظى الفرس
  بالكسرقال وبعض النباس يجعل الدفاى الشقاق العصب وأندلامرئ القبس
  سليم الشظى عبل لشوى شنج النسا ) ل جباتمشرقات على الفال
  وشغلى القوم خلاف صميعهم وهم الاتساع والدخلاء عليهم بالحلف وقال
  بصرعناالنحمان يوم تألبت • علينا تقيم من شظر ودهيم
