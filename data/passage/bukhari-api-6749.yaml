label: { ar: "صحيح البخاري 6749 — النسب والانتساب", en: "Sahih al-Bukhari 6749 — paternity and lineage", ur: "صحیح بخاری 6749 — نسب اور انتساب", es: "Sahih al-Bukhari 6749 — paternidad y linaje", fr: "Sahih al-Bukhari 6749 — paternité et lignée", tr: "Sahih el-Buhari 6749 — Soy ve Bağlantı", id: "Sahih al-Bukhari 6749 — Silsilah dan Afiliasi" }
text: "… سَعْدٌ يَا رَسُولَ اللَّهِ ابْنُ أَخِي قَدْ كَانَ عَهِدَ إِلَىَّ فِيهِ. فَقَالَ عَبْدُ بْنُ زَمْعَةَ أَخِي وَابْنُ وَلِيدَةِ أَبِي، وُلِدَ عَلَى فِرَاشِهِ. فَقَالَ النَّبِيُّ \" هُوَ لَكَ يَا عَبْدُ بْنَ زَمْعَةَ، الْوَلَدُ لِلْفِرَاشِ وَلِلْعَاهِرِ الْحَجَرُ \". ثُمَّ قَالَ لِسَوْدَةَ بِنْتِ زَمْعَةَ \" احْتَجِبِي مِنْهُ \". لِمَا رَأَى مِنْ شَبَهِهِ بِعُتْبَةَ، فَمَا رَآهَا حَتَّى لَقِيَ اللَّهَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6749، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6749 (Laws of Inheritance (Al-Faraa'id)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6749، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6749 (Leyes de la herencia (Al-Faraa'id)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 6749 (Lois de l'héritage (Al-Faraa'id)), mentionne la paternité et la filiation. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sahih el-Buhari'de 6749 numaralı hadis, soy ve atalardan bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6749, menyebutkan tentang garis keturunan dan leluhur. Peramban \"Kebapakan dalam Islam\" mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
