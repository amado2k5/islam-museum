label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ٢٢", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 22", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 22", es: "Tathbit Dala'il al-Nubuwwa - Segunda parte, capítulo 22", fr: "Tathbit Dala'il al-Nubuwwa — Deuxième partie, chapitre 22", tr: "Peygamberliğin İşaretlerinin Belirlenmesi — İkinci Kısım, 22. Bölüm", id: "Menetapkan Tanda-Tanda Kenabian — Bagian Kedua, Bab 22" }
text: "من آياته ، وهو أنه لما كانت وقعة بدر وصدقت أخباره وتحققت مواعيده، ماج أعداؤه من اليهود وغيرهم، وقال بعضهم لبعض: ما أخلف محمد في شيء أصحابه، وإنه لنبيّ، وستؤول الأمور إلى ما يقول، وسيظهر على الناس وتكون …"
summary:
  ar: "مقطع من الباب ٢٢ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 22 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 22 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
  es: "Un fragmento del capítulo 22 de la segunda parte de Tathbit Dala'il al-Nubuwwa, de Qadi Abd al-Jabbar al-Hamdani, presenta pruebas de la misión y los milagros del Profeta extraídas del Corán y de relatos transmitidos, respondiendo a quienes niegan la profecía o la despojan de sus milagros. El extracto citado proviene de la edición de Wikisource."
  fr: "Dans la deuxième partie du Tathbit Dala'il al-Nubuwwa de Qadi Abd al-Jabbar al-Hamdani, un passage du chapitre 22 présente des preuves de la mission et des miracles du Prophète, tirées du Coran et des hadiths, réfutant ainsi ceux qui nient la prophétie ou la privent de ses miracles. Cet extrait est tiré de l'édition Wikisource."
  tr: "Mu'tezile mezhebinin önde gelen isimlerinden Hakim Abdülceber el-Hamdani'nin \"Peygamberliğin Delillerini Ortaya Koymak\" adlı kitabının ikinci cildinin 22. bölümünden bir alıntı; yazar, Kur'an ve rivayet edilen hadislerden yola çıkarak Peygamberin mesajının ve mucizelerinin doğruluğuna dair deliller topluyor ve peygamberliği inkar edenleri veya mucizelerini reddedenleri çürütüyor. Alıntı, Wikisource'da bulunan kitabın baskısından alınmıştır."
  id: "Cuplikan dari Bab 22 buku \"Membangun Bukti-Bukti Kenabian\" karya Hakim Abd al-Jabbar al-Hamdani, Jilid Dua; penulis—tokoh terkemuka mazhab Mu'tazila—mengumpulkan bukti-bukti kebenaran pesan Nabi dan mukjizatnya, dengan mengutip Al-Quran dan hadits-hadits yang diriwayatkan, serta membantah mereka yang mengingkari kenabian atau menolak mukjizatnya. Cuplikan ini diambil dari edisi buku yang tersedia di Wikisource."
