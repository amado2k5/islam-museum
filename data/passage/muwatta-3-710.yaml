label: { ar: "الموطأ 710 — مالك: الخليطان في الإبل بمنزلة الخليطين في الغنم، يجمعان في الصدقة إذا كان لكل منهما نصاب", en: "Muwatta 710" }
summary:
  ar: "قول لمالك: الخليطان في الإبل بمنزلة الخليطين في الغنم، يُجمعان في الصدقة جميعاً إذا كان لكل واحد منهما ما تجب فيه الصدقة، ويحتج بقول النبي إنه لا صدقة فيما دون خمس ذود من الإبل، وبقول عمر بن الخطاب: وفي سائمة الغنم إذا بلغت أربعين شاة شاة. ويقول مالك: وهذا أحب ما سمعت إلي في هذا. ويذكر المحقق أن قول مالك هذا رواه عنه أبو مصعب. {cite:muwatta-maruf-1997 p.355} {cite:muwatta-maruf-1997 p.356}"
