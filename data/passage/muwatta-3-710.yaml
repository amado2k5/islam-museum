label: { ar: "الموطأ 710 — مالك: الخليطان في الإبل بمنزلة الخليطين في الغنم، يجمعان في الصدقة إذا كان لكل منهما نصاب", en: "Muwatta 710", es: "Muwatta 710", fr: "Muwatta 710", ur: "موطا 710", tr: "Al-Muwatta 710 — Malik: İki deve iki koyun gibi muamele görür; her biri asgari nisaba ulaştığında sadaka olarak bir araya getirilirler.", id: "Al-Muwatta 710 — Malik: Dua unta diperlakukan seperti dua domba; keduanya digabungkan dalam sedekah jika masing-masing mencapai ambang batas minimum (nisab)." }
summary:
  ar: "قول لمالك: الخليطان في الإبل بمنزلة الخليطين في الغنم، يُجمعان في الصدقة جميعاً إذا كان لكل واحد منهما ما تجب فيه الصدقة، ويحتج بقول النبي إنه لا صدقة فيما دون خمس ذود من الإبل، وبقول عمر بن الخطاب: وفي سائمة الغنم إذا بلغت أربعين شاة شاة. ويقول مالك: وهذا أحب ما سمعت إلي في هذا. ويذكر المحقق أن قول مالك هذا رواه عنه أبو مصعب. {cite:muwatta-maruf-1997 p.355} {cite:muwatta-maruf-1997 p.356}"
  tr: "Malik şöyle dedi: İki deve iki koyun gibi muamele görür; her birinin zekât edilecek kadar koyunu varsa, hepsi zekâta dahil edilir. Peygamberimizin beşten az deve için zekât gerekmediği sözünü ve Ömer ibn el-Hattab'ın \"Bir koyun sürüsü kırk koyuna ulaşırsa, bir koyun zekât olarak verilir\" sözünü zikretti. Malik şöyle dedi: \"Bu konuda duyduğum en tercih edilebilir görüş budur.\" Araştırmacı, Malik'in bu sözünün Ebu Mus'ab tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.355} {cite:muwatta-maruf-1997 s.356}"
  id: "Malik berkata: Dua unta diperlakukan seperti dua domba; semuanya termasuk dalam zakat jika masing-masing memiliki cukup untuk dikenakan zakat. Beliau mengutip sabda Nabi bahwa tidak ada zakat untuk kurang dari lima unta, dan sabda Umar bin al-Khattab: \"Jika kawanan domba mencapai empat puluh ekor, maka satu ekor domba wajib dikenakan zakat.\" Malik berkata: \"Ini adalah pendapat yang paling utama yang pernah saya dengar tentang masalah ini.\" Peneliti menyebutkan bahwa pernyataan Malik ini diriwayatkan darinya oleh Abu Mus'ab. {cite:muwatta-maruf-1997 p.355} {cite:muwatta-maruf-1997 p.356}"
