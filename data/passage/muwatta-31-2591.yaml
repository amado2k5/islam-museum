summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن الناس كانوا إذا رأوا أول الثمر جاءوا به إلى النبي، فإذا أخذه دعا بالبركة للثمر والمدينة والصاع والمد، ثم يدعو أصغر وليد يراه فيعطيه ذلك الثمر. ويتضمن الحديث دعاء النبي للمدينة بمثل ما دعا به إبراهيم لمكة. {cite:muwatta-maruf-1997 p.462}"
