label: { ar: "الموطأ 2591 — سهيل بن أبي صالح عن أبي هريرة: دعاء النبي بالبركة على أول الثمر", en: "Muwatta 2591", es: "Muwatta 2591", fr: "Muwatta 2591", ur: "موطا 2591", tr: "El-Muvatta 2591 — Suhayl ibn Abi Salih, Ebu Hurayra'dan rivayetle: Peygamberin ilk meyveler üzerine bereket duası", id: "Al-Muwatta 2591 — Suhayl ibn Abi Salih berdasarkan riwayat Abu Hurayrah: Doa Nabi untuk mendapatkan keberkahan atas buah pertama" }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن الناس كانوا إذا رأوا أول الثمر جاءوا به إلى النبي، فإذا أخذه دعا بالبركة للثمر والمدينة والصاع والمد، ثم يدعو أصغر وليد يراه فيعطيه ذلك الثمر. ويتضمن الحديث دعاء النبي للمدينة بمثل ما دعا به إبراهيم لمكة. {cite:muwatta-maruf-1997 p.462}"
  tr: "Malik, Suhayl ibn Abi Salih'ten, o da babasından, o da Ebu Hurayra'dan rivayet ettiğine göre, insanlar mevsimin ilk meyvelerini gördüklerinde onları Peygamberimize getirirlerdi. Peygamberimiz onları aldığında, meyveler, şehir, sa' (kuru ölçü birimi) ve mudd (başka bir kuru ölçü birimi) için bereket duası ederdi. Sonra gördüğü en küçük çocuğu çağırır ve ona o meyveden verirdi. Hadis, İbrahim'in Mekke için yaptığı duaya benzer şekilde, Peygamberimizin Medine için yaptığı duayı da içermektedir. {cite:muwatta-maruf-1997 s.462}"
  id: "Malik meriwayatkan dari Suhayl ibn Abi Salih, dari ayahnya, dari Abu Hurayrah, bahwa ketika orang-orang melihat buah pertama musim panen, mereka membawanya kepada Nabi. Ketika beliau menerimanya, beliau berdoa memohon keberkahan bagi buah-buahan, kota, sa' (satuan ukuran kering), dan mudd (satuan ukuran kering lainnya). Kemudian beliau memanggil anak bungsu yang dilihatnya dan memberikan buah itu kepadanya. Hadits ini mencakup doa Nabi untuk Madinah, serupa dengan doa Ibrahim untuk Mekah. {cite:muwatta-maruf-1997 p.462}"
