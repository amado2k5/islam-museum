label: { ar: "الأربعون 31 — ازهد في الدنيا يحبك الله", en: "Arba'un 31 — renounce the world and God will love you" }
text: "ازهد في الدنيا يحبك الله، وازهد فيما في أيدي الناس يحبك الناس"
summary:
  ar: "حديث سهل بن سعد الساعدي أن رجلاً جاء إلى النبي فقال: دلني على عمل إذا عملته أحبني الله وأحبني الناس، فقال: «ازهد في الدنيا يحبك الله وازهد فيما في أيدي الناس يحبك الناس» — وهو الحديث الحادي والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ رواه ابن ماجه (4102) من رواية خالد بن عمرو القرشي عن سفيان الثوري عن أبي حازم عنه، وقال النووي حديث حسن وإسناده حسن وفي ذلك نظر عند ابن رجب، فإن خالد بن عمرو القرشي الأموي قال فيه أحمد منكر الحديث ومرة ليس بثقة يروي أحاديث بواطيل ومرة كان كذاباً يكذب حدث عن شعبة أحاديث موضوعة، وقال ابن معين ليس حديثه بشيء، وقال البخاري وأبو زرعة منكر الحديث، وقال أبو حاتم متروك الحديث ضعيف، ونسبه صالح بن محمد وابن عدي إلى وضع الحديث، وتناقض ابن حبان فذكره في الثقات وذكره في الضعفاء وقال كان ينفرد عن الثقات بالموضوعات لا يحل الاحتجاج بخبره؛ وقال العقيلي ليس له أصل من حديث سفيان الثوري وتابعه عليه محمد بن كثير الصنعاني — وهو المصيصي ضعفه أحمد وهو ثقة عند كثير من الحفاظ — ولعله أخذه عنه ودلسه، وتابعه أبو قتادة الحراني ومهران بن أبي عمر الرازي وكلهم متكلم فيهم، وتعجب ابن عدي منه وقال ما أدري ما أقول فيه، وسأل ابن أبي حاتم أباه فقال حديث باطل بهذا الإسناد، وسأل ابن مشيش أحمد عنه فقال لا إله إلا الله من يروي هذا؟ فلما قيل خالد بن عمرو قال وقعنا في خالد بن عمرو ثم سكت إنكاراً، ورواه أبو عبيد القاسم بن سلام في المواعظ وكان منكراً له حتى أخبر أن وكيعاً سئل عنه؛ ومع ذلك فللحديث معنى صحيح تشهد له النصوص: حديث سهل عند الترمذي (2320) «لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافراً منها شربة» وصححه، ومعنى الزهد في الشيء الإعراض عنه لاستقلاله واحتقاره وارتفاع الهمة عنه، وفسره أبو مسلم الخولاني موقوفاً عند أحمد في الزهد بأنه ليس بتحريم الحلال ولا إضاعة المال إنما هو أن تكون بما في يد الله أوثق مما في يديك وإذا أصبت بمصيبة كنت أشد رجاء لأجرها وذخرها من إياها لو بقيت لك — والصحيح وقفه عند ابن رجب — وجمع أبو سليمان الداراني معانيه بأن الزهد في ترك ما يشغلك عن الله (جامع العلوم والحكم ص 639–666)."
  en: "The hadith of Sahl ibn Sa'd al-Sa'idi that a man came to the Prophet asking to be shown a deed by which God and the people would love him, and was answered 'renounce the world and God will love you; renounce what is in people's hands and people will love you' — the thirty-first of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Ibn Majah (4102) through Khalid ibn Amr al-Qurashi from Sufyan al-Thawri from Abu Hazim from him; al-Nawawi calls it hasan with a hasan chain, but for Ibn Rajab there is a difficulty: Ahmad called Khalid ibn Amr al-Qurashi al-Umawi 'rejected in hadith', once 'not trustworthy, narrating false hadiths', once 'a liar who fabricated reports on Shu'ba'; Ibn Ma'in said 'his hadith is nothing'; al-Bukhari and Abu Zur'a 'rejected in hadith'; Abu Hatim 'abandoned and weak'; Salih ibn Muhammad and Ibn Adi accused him of fabrication; and Ibn Hibban contradicted himself, listing him among the trustworthy and among the weak with 'he used to single out fabrications away from the trustworthy; his report may not be used in proof'; al-Uqayli found it baseless from al-Thawri while Muhammad ibn Kathir al-San'ani — the Masisi, weakened by Ahmad yet trustworthy for many memorisers — followed him, perhaps having taken and concealed it, as did the contested Abu Qatada al-Harrani and Mihran ibn Abi Umar al-Razi; Ibn Adi confessed 'I do not know what to say of it'; Ibn Abi Hatim's father called it false on this chain; and when Ibn Mushaysh asked Ahmad about it he exclaimed 'who narrates this?' and, told it was Khalid ibn Amr, said 'we have fallen upon Khalid ibn Amr' and fell silent in disapproval — Abu Ubayd al-Qasim ibn Sallam having narrated it in his Mawa'iz and nearly rejected it until told Waki' had been asked about it; yet the hadith's meaning is sound and witnessed elsewhere: Sahl's report in al-Tirmidhi (2320) 'were the world worth a mosquito's wing to God He would not give an unbeliever a drink of it', graded sahih; the linguistic sense of zuhd as turning away from a thing in contempt and rising above it; and Abu Muslim al-Khawlani's definition, halted in Ahmad's Kitab al-Zuhd and preferred so by Ibn Rajab — that renouncing the world is not forbidding the lawful nor wasting wealth but being more confident in what is in God's hand than what is in your own, and more hopeful, when struck by calamity, for its reward and store than for its survival — while Abu Sulayman al-Darani gathers all its meanings as 'renouncing whatever occupies you away from God' (Jami' al-Ulum wal-Hikam pp. 639–666)."
