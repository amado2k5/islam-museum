text: "… من يُمْسك المصحنَ، وأحضر صبْغا يخالف لون المِدَاد. وقال للذى يمسك المصحف عليه : إذا فتحتُ فاى فاجعل نقطةً فوق الحرف، وإذا كسرتُ فاىَ فاجعل نقطة تحتَ الحرف، وإذا ضممتُ فاىَ فاجعل نقطةً أمام الحرف، فإن أتبعت شيئا من هذه …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 4، ص 160، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 4, p. 160, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 4، ص 160 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen 4, pág. 160, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 4, p. 160) mentionne la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Kalkaşandi'nin Subh al-A'sha adlı eserinin resimli 4. cildinin 160. sayfasından bir alıntı, Kur'an'ın derlenmesi ve el yazmalarının yanı sıra Kur'an'ın diyakritik işaretleri ve biçimlendirmesini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Subh al-A'sha karya Al-Qalqashandi, jilid 4 bergambar, halaman 160, membahas penyusunan Al-Qur'an dan manuskripnya, serta tanda diakritik dan format Al-Qur'an. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
