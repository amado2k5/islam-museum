text: "… من يُمْسك المصحنَ، وأحضر صبْغا يخالف لون المِدَاد. وقال للذى يمسك المصحف عليه : إذا فتحتُ فاى فاجعل نقطةً فوق الحرف، وإذا كسرتُ فاىَ فاجعل نقطة تحتَ الحرف، وإذا ضممتُ فاىَ فاجعل نقطةً أمام الحرف، فإن أتبعت شيئا من هذه …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 4، ص 160، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 4, p. 160, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 4، ص 160 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
