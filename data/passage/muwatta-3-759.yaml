label: { ar: "الموطأ 759 — مالك: لا أرى أن تؤخذ النعم من أهل الجزية إلا في جزيتهم", en: "Muwatta 759", es: "Muwatta 759", fr: "Muwatta 759", ur: "موطا 759", tr: "El-Muvatta 759 — Malik: Ben, cizye verenlerden hayvanların, cizyeleri karşılığında alınmadıkça alınmasının doğru olduğunu düşünmüyorum.", id: "Al-Muwatta 759 — Malik: Saya tidak melihat bahwa ternak boleh diambil dari orang-orang yang membayar jizya kecuali sebagai imbalan atas jizya mereka." }
summary:
  ar: "قول لمالك: لا أرى أن تؤخذ النعم من أهل الجزية إلا في جزيتهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.376}"
  tr: "Malik şöyle demiştir: \"Cizye verenlerden, cizye ödemelerinin bir parçası olmadıkça hayvan alınmasının doğru olduğuna inanmıyorum.\" Araştırmacı, bu rivayetin Ebu Mus'ab tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.376}"
  id: "Malik berkata: Saya tidak percaya bahwa ternak boleh diambil dari orang-orang yang membayar jizya kecuali sebagai bagian dari pembayaran jizya mereka. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.376}"
