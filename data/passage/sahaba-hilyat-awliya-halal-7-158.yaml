text: "… بن جرير ثنا شعبة عن محمند بن المنكدر عن جابر. قال قال رسول اللّٰه : لا تستبطئوا الرزق فانه لم يكن لموت عبد حتى يبلغ آخر رزق له، فاتقوا اللّه وأجملوا فى الطلب، أخذ الحلال وترك الحرام غريب من حديث …"
