summary:
  ar: "قال مالك: ولم أسمع أحدا يخالف في أن الجنين لا تكون فيه الغرة حتى يزايل بطن أمه ويسقط من بطنها ميتا. {cite:muwatta-maruf-1997 p.425}"
  tr: "Malik şöyle dedi: \"Cenînin anne karnından çıkıp ölene kadar kan parasına (gurrah) tabi olmadığı konusunda kimsenin itiraz ettiğini duymadım.\" {cite:muwatta-maruf-1997 s.425}"
  id: "Malik berkata: Saya belum pernah mendengar ada yang membantah bahwa janin tidak dikenakan uang darah (ghurrah) sampai ia keluar dari rahim ibunya dan meninggal dunia. {cite:muwatta-maruf-1997 p.425}"
