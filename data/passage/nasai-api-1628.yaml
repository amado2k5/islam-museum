label: { ar: "سنن النسائي 1628 — الأب والأبوة", en: "Sunan al-Nasa'i 1628 — the father and fatherhood", ur: "سنن نسائی 1628 — باپ اور والدیت" }
text: "أَخْبَرَنَا هَارُونُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنَا حَجَّاجٌ، قَالَ قَالَ ابْنُ جُرَيْجٍ عَنْ أَبِيهِ، أَخْبَرَنِي ابْنُ أَبِي مُلَيْكَةَ، أَنَّ يَعْلَى بْنَ مَمْلَكٍ، أَخْبَرَهُ أَنَّهُ، سَأَلَ أُمَّ سَلَمَةَ عَنْ صَلاَةِ، رَسُولِ اللَّهِ فَقَالَتْ كَانَ يُصَلِّي الْعَتَمَةَ ثُمَّ يُسَبِّحُ ثُمَّ يُصَلِّي بَعْدَهَا مَا شَاءَ اللَّهُ مِنَ اللَّيْلِ ثُمَّ يَنْصَرِفُ فَيَرْقُدُ مِثْلَ مَا صَلَّى ثُمَّ يَسْتَيْقِظُ مِنْ نَوْمِهِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1628، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1628 (The Book of Qiyam Al-Lail (The Night Prayer) and Voluntary Prayers During the Day), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1628، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
