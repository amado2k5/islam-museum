text: "… إِذَا بَلَغَ مِنْهُ مَا شَاءَ اللَّهُ أَنْ يَبْلُغَ قَالَ إِنِّي سَتَرْتُهَا عَلَيْكَ فِي الدُّنْيَا وَأَنَا أَغْفِرُهَا لَكَ الْيَوْمَ ‏.‏ قَالَ ثُمَّ يُعْطَى صَحِيفَةَ حَسَنَاتِهِ أَوْ كِتَابَهُ بِيَمِينِهِ ‏.‏ قَالَ وَأَمَّا الْكَافِرُ أَوِ الْمُنَافِقُ فَيُنَادَى عَلَى رُءُوسِ الأَشْهَادِ ‏\"‏ ‏.‏ قَالَ خَالِدٌ فِي ‏\"‏ الأَشْهَادِ ‏\"‏ ‏.‏ شَىْءٌ مِنِ انْقِطَاعٍ ‏.‏ ‏{هَؤُلاَءِ الَّذِينَ كَذَبُوا عَلَى رَبِّهِم …"
summary:
