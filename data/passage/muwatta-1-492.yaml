summary:
  ar: "أول أثر في باب الأمر بالأكل قبل الغدو في العيد. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه أنه كان يأكل يوم الفطر قبل أن يغدو. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن في صحيح البخاري (953) من حديث أنس أن النبي كان لا يغدو يوم الفطر حتى يأكل تمرات. {cite:muwatta-maruf-1997 p.252}"
