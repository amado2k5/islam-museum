label: { ar: "الموطأ 492 — عروة يأكل يوم الفطر قبل أن يغدو", en: "Muwatta 492", es: "Muwatta 492", fr: "Muwatta 492", ur: "موطا 492", tr: "Al-Muwatta 492 — Urwah, Ramazan Bayramı günü dışarı çıkmadan önce yemek yiyor.", id: "Al-Muwatta 492 — Urwah makan pada hari raya Idul Fitri sebelum pergi keluar" }
summary:
  ar: "أول أثر في باب الأمر بالأكل قبل الغدو في العيد. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه أنه كان يأكل يوم الفطر قبل أن يغدو. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن في صحيح البخاري (953) من حديث أنس أن النبي كان لا يغدو يوم الفطر حتى يأكل تمرات. {cite:muwatta-maruf-1997 p.252}"
  tr: "Bayram günü dışarı çıkmadan önce yemek yeme emriyle ilgili ilk rivayet, Yahya'nın Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayet ettiğine göre, Ramazan Bayramı günü dışarı çıkmadan önce yemek yediği şeklindedir. Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve Sahih el-Buhari'de (953), Enes'ten rivayet edildiğine göre Peygamber'in Ramazan Bayramı günü dışarı çıkmadan önce hurma yemeden çıkmadığını belirtmektedir. {cite:muwatta-maruf-1997 s.252}"
  id: "Riwayat pertama mengenai perintah untuk makan sebelum keluar rumah pada hari raya Idul Fitri diriwayatkan oleh Yahya, dari Malik, dari Hisham ibn Urwah, dari ayahnya, bahwa beliau biasa makan pada hari raya Idul Fitri sebelum keluar rumah. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik, dan bahwa dalam Sahih al-Bukhari (953), dari Anas, diriwayatkan bahwa Nabi tidak akan keluar rumah pada hari raya Idul Fitri sampai beliau makan beberapa kurma. {cite:muwatta-maruf-1997 p.252}"
