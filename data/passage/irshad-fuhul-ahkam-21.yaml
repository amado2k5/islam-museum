text: "… المراد مشتركة فى معنى واحد وقد اختلف أهل العلم فى المشترك فقال قوم انه واجب الوقوع فى لغة العرب ونبه بتعبيره بهذا الشىء وزيادة لفظ الجزئيات على وقال آخرون انه ممتنع الوقوع وقالت طائفة انه جائز الوقوع. احتج القائلون بالوجوب …"
