text: "… وسلم في كراهة التحلى بالذهب للنساء روى عنها الحكم ابن حجل ليس اسناد حديثها بالقوى وقد ثبتت الرخصة في ذلك للنساء رباب اللام ام ليلى الانصارية والدة عبد الرحمن بن ابي ليلى كانت من المبائعات حديثها عند اهل بيتها من …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 106، يرد فيه ذكر الكراهة، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 1, p. 106, whose wording mentions dislike (karaha), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 1، ص 106 کا اقتباس جس میں کراہت، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Isti'ab de Ibn 'Abd al-Barr, volume numérisé 1, p. 106, dont le texte mentionne la réprobation (karaha), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen digitalizado 1, p. 106, cuyo texto menciona la reprobación (karaha), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Abdül-Barr'ın el-İsti'ab adlı eserinin 1. cildinin 106. sayfasından, mekruh ve helal fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, Jilid 1, halaman 106, yang menyebutkan amalan yang tidak disukai dan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
