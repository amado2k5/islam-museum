label: { ar: "جامع الترمذي 3671 — الأب والأبوة", en: "Jami' al-Tirmidhi 3671 — the father and fatherhood", ur: "جامع ترمذی 3671 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3671 — El padre y la paternidad" }
text: "حَدَّثَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا ابْنُ أَبِي فُدَيْكٍ، عَنْ عَبْدِ الْعَزِيزِ بْنِ الْمُطَّلِبِ، عَنْ أَبِيهِ، عَنْ جَدِّهِ عَبْدِ اللَّهِ بْنِ حَنْطَبٍ، أَنَّ رَسُولَ اللَّهِ رَأَى أَبَا بَكْرٍ وَعُمَرَ فَقَالَ \" هَذَانِ السَّمْعُ وَالْبَصَرُ \".وَفِي الْبَابِ عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو وَهَذَا حَدِيثٌ مُرْسَلٌ وَعَبْدُ اللَّهِ بْنُ حَنْطَبٍ لَمْ يُدْرِكِ النَّبِيَّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3671، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3671 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3671، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3671 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
