label: { ar: "سنن أبي داود 4117 — الأب والأبوة", en: "Sunan Abi Dawud 4117 — the father and fatherhood", ur: "سنن ابی داؤد 4117 — باپ اور والدیت" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ أَبِي بَكْرِ بْنِ نَافِعٍ، عَنْ أَبِيهِ، عَنْ صَفِيَّةَ بِنْتِ أَبِي عُبَيْدٍ، أَنَّهَا أَخْبَرَتْهُ أَنَّ أُمَّ سَلَمَةَ زَوْجَ النَّبِيِّ قَالَتْ لِرَسُولِ اللَّهِ حِينَ ذَكَرَ الإِزَارَ فَالْمَرْأَةُ يَا رَسُولَ اللَّهِ. قَالَ \" تُرْخِي شِبْرًا \". قَالَتْ أُمُّ سَلَمَةَ إِذًا يَنْكَشِفُ عَنْهَا. قَالَ \" فَذِرَاعًا لاَ تَزِيدُ عَلَيْهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4117، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4117 (Clothing (Kitab Al-Libas)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4117، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
