text: |-
  ٥٤٤
  مع الفاعل جيعارحلا فوجب أن تحكيه ولا تغيره وكذلك كل جلة يسمى بها مثل برق نحره
  وذرى حيافان أردت أن تثنى أوتجمع قلت جاءنى ذوا تابط شراودووتأبط شرّا ونقول
  كلا هما وكاهم ونحوذلك والنسبة اليه تأبطىّ تنسب الى الصدر ولا يجوزتصغيره ولا ترخيمه
  وقول الهدلى
  شربت بجمة وصدرت عنه • وأبيض صارم ذكر أباطى
  أى تحت ابطى رط الارطى شجر من شجر الرمل وهو فعلى لانك تقول أديم مأروط
  اذادبغ بذلك وألفه للالحاق لاللتأنيت لان واحدته ارطاة قال الراجز
  مال الى ارطاة حقف فاضطجع وفيه قول آخرانه أفعل لانه يقال أديم مرطىّ وهذا
  يذكرفى المعتل فان جعلت ألفه أصليا نونتسه فى المعرفة والذكرة جيعا وان جعلته للالحاق
  تونته فى النكرة دون المعرفة قال اعرابى وقدمرض بالشأم
  ألا أيها المكاممالك «هنا • ألاء ولا أرطى فأبن تبيض
  واصعد الى أرض المكاكىّ واجتذب * قرى الشام لا تصبح وأنت مريض
  وحسكى أبوزيد بعير. أروط وأرطوى إذا كان يأكل الارطى والاريعا من الرجال العاقر
  قال الراجز
  ماذاترجين من الاريط * ليس يدى حرم ولاسفيط
  وأرطات الارض أخرجت الارطى ⁦(اطط)⁩ الاطيط صوت لرحل والابل من ثقل اجالها
  يقال لا آتيك ما أطت الابل وك ذلك صوت الجوف من انلخوى وحفين الجذع قال
  الراجز قد عرفتى سدرتى وأطت أقط الاقط معروف وربماسكن فى الشعر
  وتنقل حركة القاف الى ما قبلها قال الشاءر
  رويدك حتى ينبت البقل والغضى * فيكثر إقط عندهم وحليب
  وانتقطت أى اتخذت الاقط وهوافتعلن وأقط طعامه يأقطه أقطاعله بالاقط فهوما قوط
  وأنشد الاصمعى
  ونخنق العجوز أوتموتا • أوتخرج المأفوط والملتوتا
  والمأقط مهموز موضع الحرب بكسر القاف قال الخليل المأقط المضيق فى الحرب
  صل البا ب قط البرقطة خطو متقارب ويقال برقط الرجل اداولى متلفتا
  ( بسط بسط الشى شره وبالصاداً يضاريسط العذ رقبوله والبسطة السعة وانيسط
  الشئ على الارض والانبساط ترك الاحتشام يقال بسطت من فلان فانبط وتبه
  فى الإبلاد أى سارفيهاطولاوع رضار الباط ما يدسط والبساط بانفح الارض الواسعة
  يقال مكان بسيط وبساط قال الشاعر
  ودون يد الجاج من أن تنالى • بساط لايدى الناعجاتء ريض
  وقلان بسيط الجسم والباع والبسيط جنس من العروض قار ابن السكيت يقال فرش لى
  فراشا لا يبسطى وذلك اذا كان ضقا وهدافراش يبسطك اذا كان وسعا وسر ناعقبة باسطه
  قال وهى البعدة والبسط بكسر الباء الناقة تخلى مع ولذهالايمنع منها والجع بساط
  وأبساط مثل ظئر وظؤار وأظا روقد أبسطت الناقة أى تركت مع ولدها ويدبنط أيضاأى
  مطلقة وفى قراءة عبد اللّه بل يداهبطان ⁦(بطط)⁩ بطت القرحة شققتها والطيط
  العجب والكذب ولا يقال منه فعل والبط من طير الماء الواحدة بطة ولينت الهاء للتأنيت
  وانما
