text: "حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، عَنْ مُجَالِدٍ، عَنِ الشَّعْبِيِّ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ نَاسٌ مِنَ الْيَهُودِ لأُنَاسٍ مِنْ أَصْحَابِ النَّبِيِّ هَلْ يَعْلَمُ نَبِيُّكُمْ كَمْ عَدَدُ خَزَنَةِ جَهَنَّمَ قَالُوا لاَ نَدْرِي حَتَّى نَسْأَلَ نَبِيَّنَا. فَجَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ يَا مُحَمَّدُ غُلِبَ أَصْحَابُكَ الْيَوْمَ. قَالَ \" وَبِمَ غُلِبُوا \". قَالَ سَأَلَهُمْ يَهُودُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3327، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3327 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3327، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3327 (Capítulos sobre Tafsir), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
