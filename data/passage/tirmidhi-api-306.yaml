text: "النَّبِيِّ صلى الله عليه وسلم أَنَّهُ قَرَأَ فِي الصُّبْحِ بِالْوَاقِعَةِ ‏.‏ وَرُوِيَ عَنْهُ أَنَّهُ كَانَ يَقْرَأُ فِي الْفَجْرِ مِنْ سِتِّينَ آيَةً إِلَى مِائَةٍ ‏.‏ وَرُوِيَ عَنْهُ أَنَّهُ قَرَأَ ‏:‏ ‏(‏إِذََا الشَّمْسُ كُوِّرَتْ ‏)‏ ‏.‏ وَرُوِيَ عَنْ عُمَرَ أَنَّهُ كَتَبَ إِلَى أَبِي مُوسَى أَنِ اقْرَأْ فِي الصُّبْحِ بِطِوَالِ الْمُفَصَّلِ ‏.‏ قَالَ أَبُو عِيسَى وَعَلَى هَذَا الْعَمَل …"
summary:
  ar: "في جامع الترمذي؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Jami' al-Tirmidhi; sending a letter or message to a party."
  ur: "جامع ترمذی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
