  ur: "بیہقی کی دلائل النبوۃ سے ایک اقتباس، نجاشی کے ساتھ خط و کتابت میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinden, El-Necaşi'nin yazışmalarında yer alan, kaynakların kullanım biçimine göre yaklaşık kırk kelimeden oluşan bir alıntı."
