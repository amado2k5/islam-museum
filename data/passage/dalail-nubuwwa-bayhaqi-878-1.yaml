text: "حمد رسول الله إلى النجاشي الأصحم ملك الحبشة سلام عليك فإني أحمد إليك الله الملك القدوس المؤمن المهيمن وأشهد أن عيسى ابن مريم روح الله وكلمته ألقاها إلى مريم البتول الطيبة الحصينة فحملت بعيسى فخلقه من روحه ونفخه كما خلق آدم بيده"
summary:
