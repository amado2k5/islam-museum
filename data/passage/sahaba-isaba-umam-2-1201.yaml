text: "… أبا الضحاك، ويقال أبا عبد الاَ إنَّ خَيْرَ النَّاسِ كُلَّهِمُ فَهْدُ الرحمن، يماني كناني. وعَبْدُ كَلاَلٍ خَيرُ سَائِرِهِمْ بَعْدُ قال: وهو الذي قال فيه عمرو بن معد يكرب: من أبناء الأساوِرَة. من فارس الذي كان كسرى بعثهم إلى قِتال الحبشة. …"
