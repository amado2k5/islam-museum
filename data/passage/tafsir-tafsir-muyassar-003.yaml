text: "ثته دينا سوى الإسلام الذي أرسل به. وما وقع الخلاف بين أهل الكتاب من اليهود والنصارى، فتفرقوا شيعا وأحزابا إلا من بعد ما قامت الحجة عليهم بإرسال الرسل وإنزال الكتب؛ بغيا وحسدا طلبا للدنيا. ومن يجحد آيات الله المنزلة وآياته"
