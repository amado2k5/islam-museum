  بالكسر وأرفهتها أنا والارفاه التدهن والترجيل كل يوم وقدنمى عنه ورجل رافه أى
  وادع وهوفى رفاهة من العش أى سعة ورفاهة على فمالة ورفهمة وهو ملحق بالحاسى
  بألف فى آخره وانماصارت با لمكسرة ماقبلها ويقال بيني وبينك ليلة رافهة وثلاث ليال
  روافه اذا كان يسار الى المءفيهنّ سير الينا ورفه عن غريمك ترفيها أى نفس عنه وفى المثل
  أغنى من التفهعى الرفه يقال الرفه التبن والتفد السبع وهو الذى يسمى عناق الارض لانه
  لايقتات التين ⁦(ريه)⁩ تريد السراب تربع والمريه المربع قال رؤية
  عليه رقراق السراب الامره * يستنّ من ويعانه المريه
  صل المين ) ( به السبه ذهاب العقل من هرم ورجل مسبوه ومسبه
  ( سنه الاست العجز وقديراد به حلقة الدبر وأصلها سته على فعل بالتحريك يدل على
  ذلكْ أنّ جمعه أستاه مثل جمل وأجمال ولا يجوز أن يكون مثل جدع وقفل اللذين يجمعان
  أيضاء لى أفعال لانك اذارددت الهاء التى هى لام الفعل وحذفت العين قلت سبه
  بالفتح قال الشاعر
  شأتك قعين غثها وسمينها • وأنت السه السفلى اذادعيت نصر
  يقول أنت فيهسم بمنزلة الاست من الناس وفى الحديث العين وكاءالسه بحذف عين الفعل
  ريروى وكاء الست يحذف لام الفعل ورجل أسته بين السسته اذا كان كبير العجز والستهم
  والسمتاهى" مثله والمرأستهاء ابن السكيت رجل أسته وسستاهى عظيم الاست واهرأة
  ستهاء وستهم والميم زائدة وستهت الرجل ستها ضربته على استه واذا نسبت اليهاقلت
  ستهى بالتحريك وان شيئت قلت استى تركنه على حاله وسته أيضا بكسر التاء كما فالواحرح
  وأماقول الشاءر وأنت مكانك من وائل * مكان القراد من است الهل
