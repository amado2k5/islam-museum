  شتم للعرب قال الحطيئة
  فباست بنى قيس وأستاه طي * وباست بى دودان حاشى بنى نضر
  أيوزيدما زال فلان على است الدهر مجنونا أى لم يزل يعرف بالجنون قال أبو نخيلة
  مازال مذ كان على است الدهر * ذاحق شى وعقل يحرى
  أى لم يزل مجنوناده رهوية ولون كأن ذاك على است الدهر وكذلك على أس الدهروإس الدهر
  أى على قدمه ⁦(سفه )⁩ السفمضد الحلم وأصله الخفة والحركة يقال نسفهت الريح الشجر
  أى مالت به قال ذوالزمّة
  يرين كما اهتزت رياح تسفهت • أعاليها مز الرياح النواسم
  وقال أيضا * على ظهر مقلاة سفيه جديلها * يعنى خفيف زمامها وتسفهت فلانا عن مالداذا
  خدعته عنه وتسفهت عليه اذا أسمعته وسفهه تسفيهائسبه الى السفه وسافهممافهة
