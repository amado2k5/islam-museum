label: { ar: "سنن أبي داود 3675 — اليتيم وفقد الأب", en: "Sunan Abi Dawud 3675 — the orphan and the father lost", ur: "سنن ابی داؤد 3675 — یتیم اور باپ کی موت", es: "Sunan Abi Dawud 3675 — El huérfano y el padre perdido", fr: "Sunan Abi Dawud 3675 — L'orphelin et le père perdus", tr: "Sunan Abi Davud 3675 — Yetim ve Babasının Kaybı", id: "Sunan Abi Dawud 3675 — Anak Yatim dan Kehilangan Ayah" }
text: "حَدَّثَنَا زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا وَكِيعٌ، عَنْ سُفْيَانَ، عَنِ السُّدِّيِّ، عَنْ أَبِي هُبَيْرَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ أَبَا طَلْحَةَ، سَأَلَ النَّبِيَّ عَنْ أَيْتَامٍ وَرِثُوا خَمْرًا قَالَ \" أَهْرِقْهَا \". قَالَ أَفَلاَ أَجْعَلُهَا خَلاًّ قَالَ \" لاَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3675، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3675 (Drinks (Kitab Al-Ashribah)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3675، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3675 (Kitab Al-Ashribah), menciona al huérfano y al padre desaparecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre la paternidad."
  fr: "Un hadith du Sunan Abi Dawud, n° 3675 (Les Boissons (Kitab Al-Ashribah)), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sünen Ebu Davud'da yer alan 3675 numaralı hadiste yetimler ve babasızlık konusu geçmektedir. Bu hadis, Kur'an, Sünnet, Peygamberimizin hayatı ve konuyla ilgili diğer kitaplardan ilgili metinleri içeren \"İslam'da Babalık\" bölümü tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3675, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Hadits ini dikompilasi oleh bagian \"Kebapakan dalam Islam\", yang mencakup teks-teks terkait dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
