label: { ar: "مسلم 2683 — من أحب لقاء الله أحب الله لقاءه", en: "Muslim 2683 — Whoever loves meeting God, God loves meeting him", es: "Musulmán 2683 — Quien ama encontrarse con Dios, Dios ama encontrarse con él.", fr: "Muslim 2683 — Celui qui aime rencontrer Dieu, Dieu aime le rencontrer.", ur: "مسلم 2683 - جو اللہ سے ملاقات کو پسند کرتا ہے، اللہ اس سے ملاقات کو پسند کرتا ہے۔", tr: "Müslim 2683 — Kim Allah'la buluşmayı severse, Allah da onunla buluşmayı sever.", id: "Muslim 2683 — Barangsiapa mencintai pertemuan dengan Allah, maka Allah pun mencintai pertemuan dengannya." }
text: "قال رسول الله: «من أحب لقاء الله أحب الله لقاءه، ومن كره لقاء الله كره الله لقاءه»"
summary:
  ar: "رواية عبادة بن الصامت وعائشة في كتاب الجنة وصفة نعيمها من صحيح مسلم؛ حب لقاء الله وكراهيته عند انقطاع الدنيا — من نصوص الزهد والأخرة."
  tr: "Sahih Müslim'deki Cennet Kitabı'nda Ubadah ibn al-Samit ve Aişe'nin rivayeti ve cennetin nimetlerinin tasviri; Allah'a kavuşma sevgisi ve dünyanın sonu geldiğinde ondan nefret etme duygusu - zühd ve ahiret metinlerinden."
  id: "Riwayat Ubadah ibn al-Samit dan Aisyah dalam kitab Surga dan uraian tentang kebahagiaannya dari Sahih Muslim; kecintaan bertemu Tuhan dan kebencian terhadapnya ketika dunia berakhir — dari teks-teks tentang asketisme dan kehidupan setelah kematian."
