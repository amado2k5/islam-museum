label: { ar: "الموطأ 109 — عائشة تصف غسل النبي من الجنابة", en: "Muwatta 109" }
text: "ثم يدخل أصابعه في الماء فيخلل بها أصول شعره، ثم يصب على رأسه ثلاث غرفات بيديه، ثم يفيض الماء على جلده كله"
summary:
  ar: "أول حديث في باب العمل في غسل الجنابة. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين: كان النبي إذا اغتسل من الجنابة بدأ فغسل يديه، ثم توضأ كما يتوضأ للصلاة، ثم أدخل أصابعه في الماء فخلل بها أصول شعره، ثم صب على رأسه ثلاث غرفات بيديه، ثم أفاض الماء على جلده كله. ويخرّجه المحقق عند البخاري (248) والنسائي (1/134) وابن حبان (1196) والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/92). {cite:muwatta-maruf-1997 p.88} {cite:muwatta-maruf-1997 p.89}"
