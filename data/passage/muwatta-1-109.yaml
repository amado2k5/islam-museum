label: { ar: "الموطأ 109 — عائشة تصف غسل النبي من الجنابة", en: "Muwatta 109", es: "Muwatta 109", fr: "Muwatta 109", ur: "موطا 109", tr: "Al-Muwatta 109 — Aişe, Peygamberin cinsel ilişkiden sonraki ritüel gusülünü anlatıyor.", id: "Al-Muwatta 109 — Aisyah menjelaskan tentang mandi ritual Nabi setelah hubungan seksual." }
text: "ثم يدخل أصابعه في الماء فيخلل بها أصول شعره، ثم يصب على رأسه ثلاث غرفات بيديه، ثم يفيض الماء على جلده كله"
summary:
  ar: "أول حديث في باب العمل في غسل الجنابة. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين: كان النبي إذا اغتسل من الجنابة بدأ فغسل يديه، ثم توضأ كما يتوضأ للصلاة، ثم أدخل أصابعه في الماء فخلل بها أصول شعره، ثم صب على رأسه ثلاث غرفات بيديه، ثم أفاض الماء على جلده كله. ويخرّجه المحقق عند البخاري (248) والنسائي (1/134) وابن حبان (1196) والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/92). {cite:muwatta-maruf-1997 p.88} {cite:muwatta-maruf-1997 p.89}"
  id: "Hadits pertama dalam bab ini adalah tentang tata cara penyucian setelah hubungan seksual. Hadits ini diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, Ibu Kaum Mukmin: Ketika Nabi (shalawat dan salam kepadanya) melakukan penyucian setelah hubungan seksual, beliau memulai dengan mencuci tangannya, kemudian berwudhu seperti hendak shalat, lalu mencelupkan jari-jarinya ke dalam air dan mengusapkannya ke pangkal rambutnya, kemudian menuangkan tiga genggam air ke atas kepalanya, lalu menuangkan air ke seluruh tubuhnya. Hadits ini terdapat dalam kumpulan hadits al-Bukhari (248), al-Nasa'i (1/134), Ibn Hibban (1196), al-Shafi'i, dan al-Bayhaqi, melalui sanad para sahabat Malik, dan beliau merujuk pada al-Tamhid (22/92). {kutip:muwatta-maruf-1997 hal.88} {kutip:muwatta-maruf-1997 hal.89}"
