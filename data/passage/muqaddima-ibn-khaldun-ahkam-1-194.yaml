text: "… قوله لَلِيهمه اسْمَعُوا وأطِيعُوا وإنْ وُلِّيَ عليكم عَبْدٌ حَبَثِيٌّ ذُو زَبِيبة. وهذا لا تقوم به حجة ذلك، فإنه خرج مخرج التمثيل والفرضٍ للمبالغة في إيجاب السمع والطاعة، ومثل قول عمر: لو كان سالمٌ مولى حذيفة حيًّا لوليته، أو لما دخلتني …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 194، يرد فيه ذكر الفرض، والوجوب، والسمع والطاعة، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 1, p. 194, whose wording mentions the obligatory (fard), obligation (wujub), hearing and obeying, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 1، ص 194 کا اقتباس جس میں فرض، وجوب، سننا اور ماننا، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Muqaddima de Ibn Khaldun, volume numérisé 1, p. 194, dont le texte mentionne l'obligatoire (fard), l'obligation (wujub), écouter et obéir, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Muqaddima de Ibn Khaldun, volumen digitalizado 1, p. 194, cuyo texto menciona lo obligatorio (fard), la obligatoriedad (wujub), oír y obedecer, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Haldun'un Mukaddime'sinin 1. cildinin 194. sayfasından, farz olan ameller, görevler, itaat ve uyumdan bahseden bir bölüm; makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Muqaddimah karya Ibnu Khaldun, Jilid 1, halaman 194, yang menyebutkan amalan wajib, kewajiban, ketaatan, dan kepatuhan; diambil dari edisi yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
