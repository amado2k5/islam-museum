text: |-
  * ⁦(فصل العين)⁩*
  •⁦(عثا)⁩ *
  المرتفع بقال ما على السماءطهاهة أى قزعة وطهية جىّ من تيم نسبوا الى أمهم وهم أبوسود
  وعوف وحبيش ينو مالك بن حنظلة قال جرير
  أنعلمية الفوارس أورياطا * عدات بنهم طهية والخشايا
  والنسبة اليهم طهوى ساكنة الهاء وبعضهم يقول طهوى على القياس
  صل اخاء بى الظبى معروف وثلاثة أظب وهو أفعل فأبدلوا من ضمة
  العين كسرة لتسلم الياء والكثيرظباء وظبى على فعول مثل ثدى وظبيات بالتحريك
  |والظبي أيضاواد قال امر والقيس *أسار يع ظبى أو مساويك اسحل * والظبية فرج
  المرأة وقال الاصمعى" هي لمكل ذات حافر وقال الفراءهى للكلبة ومن دعاثهم عند الشماتة
  به لا بظبى أى جعل اللّٰه ما أصابه لازماله ومنه قول الفرزدق
  أقول له لما أتانى نعبه * بهلا بغابي بالصريمة أعفرا
  وظبة السبف وظبة السهم طرفه قال بشاعة بن حرى التهشلىّ
  اذا السكماة تنحوا أن بنالهم • -تالظبات وصلناها بأيدينا
  وأصلها ظبو والهاءعوض من الواووالجمع أطب فى أقل العدد مثل أدل وظيات وظبون
  بالواء والنون قال كعب
  تعاور أيمانهم بينهم • كؤس المناياحدّ الظبينا
  وفلان بن ظبيان بالفتح ( مى شفة ظمياء بينة الفاهى اذا كان فيها سمرة وذبول واثة
  ظميا قليلة الدم وعين ظميا« رقيقة الجذن وساق ظميا قليلة اللحه-م وظل أظمى أسودورمح
  أظمى أسمر والمظعي من الزرع ماتسقيه السماء والمستوى مايسقى بالسيح والظميان شعر
  نبت بتجديشبه القرظ ظى تظى تفعل من الظنّ فأبدل من احدى المونات ياهوهو
  مثل تقضى من تقضض ⁦(ظي)⁩. الظيان ياسمين البروهو فعلان قال الهذلى"
  تاللّه يبقى على الايام ذوحيد • بعش مفربه الظيان والآس
  يعنى لا يبق لانه لو أراد الايجاب لادخسل عليه اللام لان اللام فى الايجاب بنزلة لا فى النفى
  ويقال الظيات العسل والآس بقية العسل فى انخلية
  صل العين) بى لعياءة والعباية ضرب من الاكسية وابهع العياء والعباآت
  رقال يونس عبيت الجيش تعبية وتعبئة وتعبيئا اذاهيأته فى مواضعه وقال أبو زيد عبأته
  بالهمز تا) يقال عتوت يافلان تعتوعتوا وعتيا وعتيا والاصل عتو ثم أبدلوا من احدى
  الضمتين كسرة فانقلبت الواوياه فقالواعتيا ثم أتهعوا السكسرة المكسرة فقالواء تي اليؤكدوا
  البدل ورجل عات وقوم عتى قلبوا الواوياه قال محمدين السرى وفعول اذا كانت جعا فحقها
  القلب واذا كانت مصدرافحقها التصحيح لانّ الجع أثقل عندهم من الواحد وتعتيت مثل
  عتوت ولا تقل عتيت وعتا الشيخ يعتوعتدا وعتيا كبروولى وهتى لغة هذيل وثقيف فى حتى
  وقرى عنى حين ⁦( ثا)⁩ عذافى الارض يعثوأفسد وكذلك عنى بالكسريمى وقال اللّٰه
  تعالى ولا تعثوا فى الارض أى لا تفسدوا ويقال للضبع عنواء لكثرة شعرهاوللضبعان أعنى
  ورعL
