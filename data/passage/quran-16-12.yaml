text_search: "وسخر لكم الليل والنهار والشمس والقمر ۖ والنجوم مسخرات بأمره ۗ إن في ذلك لآيات لقوم يعقلون"
translations:
  en: { text: "And He hath constrained the night and the day and the sun and the moon to be of service unto you, and the stars are made subservient by His command. Lo! herein indeed are portents for people who have sense.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور اسی نے تمہارے لیے رات اور دن اور سورج اور چاند کو کام میں لگایا۔ اور اسی کے حکم سے ستارے بھی کام میں لگے ہوئے ہیں۔ سمجھنے والوں کے لیے اس میں (قدرت خدا کی بہت سی) نشانیاں ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
