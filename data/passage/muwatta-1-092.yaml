summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن المجبر، في باب العمل في الرعاف: رأى سالم بن عبد الله بن عمر يخرج الدم من أنفه حتى تختضب أصابعه، فيفتله ثم يصلي ولا يتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.81}"
