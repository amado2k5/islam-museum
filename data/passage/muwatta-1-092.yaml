label: { ar: "الموطأ 92 — سالم بن عبد الله يفتل دم أنفه ثم يصلي ولا يتوضأ", en: "Muwatta 92", es: "Muwatta 92", fr: "Muwatta 92", ur: "موطا 92", tr: "Al-Muwatta 92 — Salim bin Abdullah burnundaki kanı siliyor, sonra abdest almadan namaz kılıyor.", id: "Al-Muwatta 92 — Salim bin Abdullah menyeka darah dari hidungnya, lalu shalat tanpa berwudhu." }
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن المجبر، في باب العمل في الرعاف: رأى سالم بن عبد الله بن عمر يخرج الدم من أنفه حتى تختضب أصابعه، فيفتله ثم يصلي ولا يتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.81}"
  tr: "Malik'in, Abdülrahman ibn Mücebbir'den rivayet ettiği, burun kanaması konusunda ne yapılması gerektiği bölümündeki bir rivayete göre: Salim ibn Abd Allah ibn Ömer, burnundan parmakları lekelenene kadar kan aktığını gördü, bunun üzerine kanı sildi ve abdest almadan namaz kıldı. Editör, bu rivayetin Malik'ten Ebu Musab ve Muhammed ibn Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.81}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Abd al-Rahman ibn al-Mujabbir, dalam bab tentang apa yang harus dilakukan mengenai mimisan: Salim ibn Abd Allah ibn Umar melihat darah mengalir dari hidungnya hingga jari-jarinya berlumuran, lalu ia menyekanya dan kemudian shalat tanpa berwudhu. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Musab dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.81}"
