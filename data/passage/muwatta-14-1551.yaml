label: { ar: "الموطأ 1551 — مالك: إنما أحل الله فيما نرى نكاح الإماء المؤمنات، ولم يحل نكاح إماء أهل الكتاب اليهودية والنصرانية", en: "Muwatta 1551", es: "Muwatta 1551", fr: "Muwatta 1551", ur: "موطا 1551", tr: "El-Muvatta 1551 — Malik: Bizim görüşümüze göre Allah, yalnızca mümin cariyelerin evlenmesine izin vermiştir; Kitap Ehli'ne mensup Yahudi ve Hristiyan cariyelerin evlenmesine ise izin vermemiştir.", id: "Al-Muwatta 1551 — Malik: Menurut pandangan kami, Allah hanya memperbolehkan pernikahan antara perempuan budak yang beriman, dan Dia tidak memperbolehkan pernikahan antara perempuan budak Yahudi dan Kristen yang termasuk dalam Ahlul Kitab." }
summary:
  ar: "يقول مالك فإنما أحل الله، فيما نرى، نكاح الإماء المؤمنات، ولم يحل نكاح إماء أهل الكتاب: اليهودية والنصرانية. {cite:muwatta-maruf-1997 p.48}"
  tr: "Malik şöyle diyor: “Bizim görüşümüze göre, Allah yalnızca mümin cariyelerin evlenmesine izin vermiştir ve Kitap Ehli'nden olan Yahudi ve Hristiyan cariyelerin evlenmesine izin vermemiştir.” {cite:muwatta-maruf-1997 s.48}"
  id: "Malik berkata: “Menurut pandangan kami, Tuhan hanya mengizinkan pernikahan dengan perempuan budak yang beriman, dan Dia tidak mengizinkan pernikahan dengan perempuan budak dari Kaum Kitab: Yahudi dan Kristen.” {cite:muwatta-maruf-1997 p.48}"
