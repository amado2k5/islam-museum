label: { ar: "جامع الترمذي 714 — الرخصة", en: "Jami' al-Tirmidhi 714 — the concession (rukhsa)", ur: "جامع ترمذی 714 — رخصت", fr: "Jami' al-Tirmidhi 714 — la dispense (rukhsa)", es: "Yami' al-Tirmidhi 714 — la dispensa (rukhsa)", tr: "Cami' el-Tirmizi 714 — Ruhsat", id: "Jami' al-Tirmidhi 714 — Lisensi" }
text: "… يَوْمَ بَدْرٍ وَالْفَتْحِ فَأَفْطَرْنَا فِيهِمَا. قَالَ وَفِي الْبَابِ عَنْ أَبِي سَعِيدٍ. قَالَ أَبُو عِيسَى حَدِيثُ عُمَرَ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ. وَقَدْ رُوِيَ عَنْ أَبِي سَعِيدٍ عَنِ النَّبِيِّ أَنَّهُ أَمَرَ بِالْفِطْرِ فِي غَزْوَةٍ غَزَاهَا. وَقَدْ رُوِيَ عَنْ عُمَرَ بْنِ الْخَطَّابِ نَحْوُ هَذَا أَنَّهُ رَخَّصَ فِي الإِفْطَارِ عِنْدَ لِقَاءِ الْعَدُوِّ وَبِهِ يَقُولُ بَعْضُ أَهْلِ الْعِلْمِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 714، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 714 (The Book on Fasting), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 714، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 714, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 714, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'nin 714 numaralı hadisinde bu uygulamadan bahsedilir. Farz, görev, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar hakkındaki kitapları, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derleyen yazar, metnin içeriğini anlatır ancak buna dayanarak bir fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 714, menyebutkan keringanan tersebut. Penyusun kitab-kitab tentang amalan wajib, kewajiban, ibadah, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
