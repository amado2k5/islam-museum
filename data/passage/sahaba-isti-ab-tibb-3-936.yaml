text: "… بشير. - ليلى عمَّة عبد الرَّحمنِ بن أَبي ليلى : بايعت النَّبيّ الِيه، وروتْ عنه. سنده ضعيف، وأخرجه أحمد، وأبو داود.، وسنده واه. الاستيعاب في معرفة الأصحاب في مغازيه تداوي الجرحى، وتقوم على المرضى، حديثها : أنّ النَّبيَّ وَلي يه …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 936، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 936, that mentions illness and the sick, the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 936 کا اقتباس جس میں بیماری اور بیمار، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 3, pág. 936, que menciona la enfermedad y los enfermos, el tratamiento de las heridas, las mujeres que atienden a los heridos y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isti'ab d'Ibn 'Abd al-Barr, volume 3, page 936, qui mentionne la maladie et les malades, le traitement des blessures, les femmes soignant les blessés, la recherche de soins; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 3. cildinin 936. sayfasından bir alıntı; hastalık ve hastalar, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedaviden bahsediyor; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 3, hlm. 936, yang menyebutkan penyakit dan orang sakit, pengobatan luka, wanita yang merawat orang terluka, dan pengobatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
