label: { ar: "سنن ابن ماجه 2708 — ما خلّفه من تركة وميراث، وصية أو عهد أخير", en: "Sunan Ibn Majah 2708 — what was left behind: estate and inheritance; a testament or parting counsel", ur: "سنن ابن ماجہ 2708 — ترکہ اور میراث، وصیت یا آخری نصیحت", es: "Sunan Ibn Majah 2708 — lo que quedó: patrimonio y herencia; un testamento o consejo de despedida" }
text: "… مَرِضْتُ عَامَ الْفَتْحِ حَتَّى أَشْفَيْتُ عَلَى الْمَوْتِ فَعَادَنِي رَسُولُ اللَّهِ فَقُلْتُ أَىْ رَسُولَ اللَّهِ إِنَّ لِي مَالاً كَثِيرًا وَلَيْسَ يَرِثُنِي إِلاَّ ابْنَتِي أَفَأَتَصَدَّقُ بِثُلُثَىْ مَالِي قَالَ \" لاَ \". قُلْتُ فَالشَّطْرُ قَالَ \" لاَ \". قُلْتُ فَالثُّلُثُ قَالَ \" الثُّلُثُ وَالثُّلُثُ كَثِيرٌ إِنَّكَ أَنْ تَتْرُكَ وَرَثَتَكَ أَغْنِيَاءَ خَيْرٌ مِنْ أَنْ تَتْرُكَهُمْ عَالَةً يَتَكَفَّفُونَ النَّاسَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2708، يذكر ما خلّفه من تركة وميراث، ووصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2708 (The Chapters on Wills), that mentions what was left behind: estate and inheritance, a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2708، جس میں ترکہ اور میراث، وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2708 (Los capítulos sobre testamentos), menciona lo que se dejaba como legado: bienes y herencia, un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
