text: "… فلما تُوفي رسول اللّٰه بَلفي قال أبو بكر: أَنَا وَلِيُّ رَسُولِ اللهِ، فجئت أنتَ وهذا إلىٰ أبي بكر، تطلب أنت ميراثك عن ابن أخيك، ويطلب هذا ميراث امرأته من أبيها، فقال أبو بكر مفه: قال رسول اللّٰه قميغ: لَا نُورَثُ، …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 4582، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 4582, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 4582 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
