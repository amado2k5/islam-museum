  fr: "Extrait du Tafsir d'Ibn Kathir (tome 1, p. 4582) évoquant un lit de mort et les dernières heures du défunt, ainsi que son héritage. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 4582. sayfasından bir alıntı, ölen kişinin ölüm saatini, vefatını, geride bıraktığı mal varlığını ve mirasını belirtmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Vasiyetler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Tafsir Ibn Kathir, Jilid 1, halaman 4582, menyebutkan saat kematian dan kepergian orang yang meninggal, serta harta dan warisan yang ditinggalkannya; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Shrines Browser."
