text: "… إذا أراد أن يتكلم فإن الآخِرِ فَلْيُقُلْ خَيْراً أَوْ لَيَسْكُتْ. أعرجه البخاري و كان ما يتكلم به خيراً محققاً يثاب عليه واجباً أو منذوباً فليتكلم، وإن لم و عن أبي حازم. أو مكروه أو مباح مستوى الطرفين، فعلى هذا يكون …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 123، يرد فيه ذكر الواجب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
