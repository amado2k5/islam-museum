  id: "Cuplikan dari komentar Al-Nawawi tentang Sahih Muslim, Volume 1, halaman 123, yang membahas amalan wajib, amalan yang tidak disukai, dan amalan yang diperbolehkan; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
