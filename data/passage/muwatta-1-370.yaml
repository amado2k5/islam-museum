label: { ar: "الموطأ 370 — بلاغ: علي وابن عباس: الصلاة الوسطى صلاة الصبح، ومالك يختاره", en: "Muwatta 370" }
summary:
  ar: "بلاغ في باب الصلاة الوسطى: يروي مالك أنه بلغه أن علي بن أبي طالب وعبد الله بن عباس كانا يقولان إن الصلاة الوسطى صلاة الصبح، ويقول مالك إن قول علي وابن عباس أحب ما سمع إليه في ذلك. فالموطأ يسوق في الباب ثلاثة أقوال: العصر عن عائشة وحفصة، والظهر عن زيد بن ثابت، والصبح عن علي وابن عباس، ويختار مالك الأخير. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.202}"
