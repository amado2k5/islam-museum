label: { ar: "الموطأ 370 — بلاغ: علي وابن عباس: الصلاة الوسطى صلاة الصبح، ومالك يختاره", en: "Muwatta 370", es: "Muwatta 370", fr: "Muwatta 370", ur: "موطا 370", tr: "El-Muvatta 370 — Rivayet: Ali ve İbn Abbas: Orta namaz, sabah namazıdır ve Malik onu tercih eder.", id: "Al-Muwatta 370 — Riwayat: Ali dan Ibnu Abbas: Shalat tengah adalah shalat Subuh, dan Malik lebih menyukainya." }
summary:
  ar: "بلاغ في باب الصلاة الوسطى: يروي مالك أنه بلغه أن علي بن أبي طالب وعبد الله بن عباس كانا يقولان إن الصلاة الوسطى صلاة الصبح، ويقول مالك إن قول علي وابن عباس أحب ما سمع إليه في ذلك. فالموطأ يسوق في الباب ثلاثة أقوال: العصر عن عائشة وحفصة، والظهر عن زيد بن ثابت، والصبح عن علي وابن عباس، ويختار مالك الأخير. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.202}"
  tr: "Orta namazla ilgili bir rivayet: Malik, Ali ibn Abi Talib ve Abdullah ibn Abbas'ın orta namazın sabah namazı (Fajr) olduğunu söylediklerini işittiğini aktarır. Malik, bu konuda işittiği en tercih edilebilir görüşün Ali ve İbn Abbas'ın görüşü olduğunu söyler. Muwatta'da bu konuda üç görüş sunulmaktadır: Ayşe ve Hafsa'dan ikindi namazı (Asr), Zeyd ibn Sabit'ten öğle namazı (Dhuhr) ve Ali ve İbn Abbas'tan sabah namazı (Fajr). Malik sonuncusunu tercih eder. Editör, bunu Malik'ten Ebu Mus'ab ve Suveyd'in rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.202}"
  id: "Sebuah riwayat mengenai salat tengah: Malik meriwayatkan bahwa ia mendengar bahwa Ali ibn Abi Talib dan Abdullah ibn Abbas mengatakan bahwa salat tengah adalah salat subuh (Fajr). Malik mengatakan bahwa pendapat Ali dan Ibn Abbas adalah yang paling utama yang pernah ia dengar mengenai masalah ini. Muwatta' menyajikan tiga pendapat tentang topik ini: salat Asar (Ashar) dari Aisyah dan Hafsa, salat Dzuhur (Dhuhr) dari Zayd ibn Thabit, dan salat subuh (Fajr) dari Ali dan Ibn Abbas. Malik lebih menyukai yang terakhir. Editor mencatat bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.202}"
