text: "… هكذا يرمي الحاكم عندنا، ثمَّ رمى الثالث فأصاب الهدف تماماً فقال مفتخراً : هكذا يرمي الشيخ نصر الدين! فنال من تيمور لنك الإنعام العظيم. لم يصبه أذَّى خارجيٌّ وإنَّما أصابه أذّى داخليٌّ طلب تيمور لنك أحد أبطال الأتراك العثمانيين، ليستخدِمه …"
summary:
  ar: "دُعي جحا ليُظهر مهارته في الرماية فأخطأ، وقال «هكذا يرمي كبير الرماة»، وأخطأ في الرمية الثانية وقال «هكذا يرمي الحاكم هنا»، وأصاب في الثالثة وقال «هكذا يرمي نصر الدين»، فكافأه تيمور لنك. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  en: "Juha, invited to show archery, misses and says 'that is how the chief archer shoots'; the second shot misses and he says 'that is how the governor shoots here'; the third hits and he says 'that is how Nasr al-Din shoots'; Timur rewards him. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  ur: "جحا کو تیر اندازی دکھانے کے لیے بلایا گیا تو اس کا نشانہ چوک گیا اور اس نے کہا «بڑا تیر انداز ایسے ہی تیر چلاتا ہے»، دوسرا تیر بھی خطا گیا تو کہا «یہاں کا حاکم ایسے ہی تیر چلاتا ہے»، تیسرا نشانے پر لگا تو کہا «نصر الدین ایسے تیر چلاتا ہے»، اور تیمور لنگ نے اسے انعام دیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  fr: "Invité à montrer son habileté au tir à l'arc, Juha manque sa cible et dit : « Ainsi tire le chef des archers » ; le deuxième tir échoue et il dit : « Ainsi tire le gouverneur d'ici » ; le troisième touche et il dit : « Ainsi tire Nasr al-Din » ; Timur le récompense. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
  es: "Invitado a mostrar su habilidad con el arco, Juha falla y dice: «Así dispara el jefe de los arqueros»; el segundo disparo falla y dice: «Así dispara el gobernador de aquí»; el tercero acierta y dice: «Así dispara Nasr al-Din»; Timur lo recompensa. {cite:juha-nawadir-kubra-djuwaydi p. 158}"
