label: { ar: "مسلم 2554 — قامت الرحم فقالت هذا مقام العائذ من القطيعة", en: "Muslim 2554 — The womb stood and said: this is the station of one who seeks refuge from severance" }
text: "قال رسول الله: «إن الله خلق الخلق، حتى إذا فرغ منهم قامت الرحم فقالت: هذا مقام العائذ من القطيعة. قال: نعم، أما ترضين أن أصل من وصلك وأقطع من قطعك؟ قالت: بلى، قال: فذاك لك»"
summary:
  ar: "رواية أبي هريرة في باب صلة الرحم وتحريم قطيعتها من صحيح مسلم؛ مشهد خلقي تتكلم فيه الرحم عند العرش فيجعل الله صلتها مردودة على واصلها وقاطعها، ثم يستشهد بآية سورة محمد."
