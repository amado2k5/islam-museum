label: { ar: "مسلم 2554 — قامت الرحم فقالت هذا مقام العائذ من القطيعة", en: "Muslim 2554 — The womb stood and said: this is the station of one who seeks refuge from severance", es: "Muslim 2554 — El útero se puso de pie y dijo: esta es la posición de quien busca refugio de la separación.", fr: "Muslim 2554 — La matrice se leva et dit: voici le lieu de celle qui cherche refuge contre la séparation.", ur: "مسلم 2554- رحم نے کھڑے ہو کر کہا: یہ اس شخص کا مقام ہے جو جدائی سے پناہ مانگتا ہے۔", tr: "Müslim 2554 — Rahim doğrulup şöyle dedi: “Bu, bağların kopmasından sığınanların yeridir.”", id: "Muslim 2554 — Rahim itu berdiri dan berkata, “Inilah tempat orang yang mencari perlindungan dari memutuskan tali silaturahmi.”" }
text: "قال رسول الله: «إن الله خلق الخلق، حتى إذا فرغ منهم قامت الرحم فقالت: هذا مقام العائذ من القطيعة. قال: نعم، أما ترضين أن أصل من وصلك وأقطع من قطعك؟ قالت: بلى، قال: فذاك لك»"
summary:
  ar: "رواية أبي هريرة في باب صلة الرحم وتحريم قطيعتها من صحيح مسلم؛ مشهد خلقي تتكلم فيه الرحم عند العرش فيجعل الله صلتها مردودة على واصلها وقاطعها، ثم يستشهد بآية سورة محمد."
  tr: "Sahih Müslim'de akrabalık bağlarının korunması ve koparılmasının yasaklanması bölümünde Ebu Hurayra'nın rivayetine göre; yaratılış sahnesinde rahim Arş'ta konuşur ve Allah, onu koruyanı da koparanı da birer müebbet kazanç olarak kılar, ardından Muhammed Suresi'nden bir ayet zikreder."
  id: "Riwayat Abu Hurairah dalam bab tentang menjaga hubungan kekerabatan dan larangan memutuskannya dari Sahih Muslim; sebuah adegan penciptaan di mana rahim berbicara di Singgasana, dan Allah menjadikan menjaga rahim sebagai balasan bagi orang yang menjaganya dan orang yang memutuskannya, kemudian beliau mengutip sebuah ayat dari Surah Muhammad."
