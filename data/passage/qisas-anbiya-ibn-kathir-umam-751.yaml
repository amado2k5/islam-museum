text: "… وذكر إسحاق بن بشر، عن مجاهد بن جبير أن اليهود لما صلبوا ذلك الرجل شبه لهم وهم يحسبونه المسيح وسلم لهم أكثر النصارى بجهلهم، ذلك، تسلطوا على أصحابه بالقتل والضرب والحبس فبلغ أمرهم إلى صاحب الروم وهو ملك"
