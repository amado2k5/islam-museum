text: |-
  ٣٨
  ⁦(ياب اليا٠)⁩
  ⁦(جنب)⁩
  وجلب الرحل أيضا وجليه عيدانه وقال
  عاليت انساعى وجلب الكور * على سراة رائح مطور
  :.ه بعبره بثوروحشى رائح وقد أصابه المعار وجلب على فرسه يجلب بالضم جلبا اذاصاح
  به من خلفه واستحثه للسبق وأجلب عليه مثله وأجلب قنبه غشاه بالجلبة وهو أن يجعل
  عليه جلدة رطبة فطيراثم يتركها عليه حتى تيبس قال النابغة الجودى يصف فرسا
  أمرونحى من صلبه * كتنحية القتب المجلب
  وأجلبه أى أعانه وأجلبوا عليه اذا نجمعوا وتألبوا مثل أحلبوا قال الكميت
  على تلل إجرياى وهى ضريبتى * ولوأجلبواطراعلى وأحلبوا .
  وأجلب الرجل اى تتجث ابله ذكورا لانه يجلب أولادها فتباع وأحلب بالحاء اذاتجت
  انائا والحلمباب الملحفة قاات امرأة من هذيل ترثى قتيلا
  تمشى النسوراليه وهى لاهية * منى العذارى عليهن الجلابيب
  والمصدر الحلببة ولم تدغم لانماملحقة بدحرجة والحلب والحلبة الاصوات تقول منه
  جلبوا بالتشديد والجلب الذى جاء النهى عنه هوأن لا يأتى المصدّق القوم فى مياههم
  لا خذ الصدقات والكن يأمرهم بجاب نعمهم اليه ويقال بل هوالجاب فى الرهان وهو
  ان يركب فرسه رحلا فاذ اقرب من الغاية تسع فرسه فجلب عليه وصاح به ليكون هو السابق
  وهوضرب من الخديعة والحلب والاجلاب الذين يجلبون الابل والغنم للبيع والجلبان
  الخاروهوشئ يشبه الماش ( احب شيخ جلهاب وجلحابة أى كبيرهم، جلعب
  الاصمعى اجلعب الرجل اجلعبابا اذا اضطجيع وامتدوا نبسط واجلعب فى السير اذامضى
  وجدّ وسير مجاعب أى كثير ورجل جلعي العين على وزن القربى أى شديد البصر والجلعياة.
  الناقة الشديدة وجلعب اسم موضع نب ) الجنب معروف تقول تعدت الى جنب
  فلان والى جانب فلان بمعنى وجنب حى من المن قال مهلهل
  زوجها فقدها الاراقم فى* جنب وكان الحباءمن أدم
  والجنب الناحية وأنشد الاخفسْ الناس جنب والاميرجنب وانصاحب بالجنب
  ساحبلك فى السفر وأما الجار الجنب فهوجارك من قوم آخرين والجانب الناحبة
  وكذلك الجنبة تقول فلان لا يطور بجنبتنا وجانيه وتجانبه وتجنبه واجتنبه كا، نمعستى
  ورجل أجنبى وأجنب وجنب وجانب كله ؟ع-نى وضربه فجنبه أى كسرجنبه وجنيت
  الدابة اذا قدتها الى جنبك وكذلك جنبت الاسير جنبا بالتحريك ومنه قواه-م خبل مجنبة
  شدد للكثرة وجنبته الشى وجنبته بمعنى اى تيته عنه قال اللّٰه تعالى واجنبنى ونى
  أن نعبد الاصنام والجناب بالفتح الفناء وما قرب من محلة القوم والجمع أجنبة يقال أخصب
  جناب القوم وفلان خصيب الجناب وجديب الجفاب وتقول مرّوايسيرون جنابيه أى
  ناحيته وفرس طوع الجناب بكسر الجيم اذا كان سلس القياد ويقال أيضالج فلان فى جناب
  قبيح اذا لج فى مجانبة أهله وجنب القوم اذاقلت ألبان ابلهم قال الجميح بن منقذيذكر
  امرأته
  لمارأت ايلى قلت حلوبتها . وكل عام عليها عام تجنيب
  والبجنيب
