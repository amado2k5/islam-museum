text: "ومنهم تلميذه الحافظ الهيثمي ؛ فإنه لم يورده في كتابه «موارد الظمآن» ؛ وهو على شرطه ، ولهذا استدركته عليه في كتابي ⁦(⁦(صحيح الموارد)⁩)⁩ ؛ يسر الله تمام طبعه ، بمنه وجوده وكرمه . ⁦(تنبيه)⁩ : أورد الديلمي في كتابه"
