text: "… بالذكر كأنهدال على الخير. والله أعلم. قوله فأمرنى هو أمر ايجاب اذ تبليغ الشرائع واجب وقوله ان أمر أصحابى امر ندب عند الجمهور وأمر وجوب عند الظاهرية وقوله أن يرفعوا اصواتهم اظهارا لشعار الاحرام وتعلما للجاهل ما يستحب لهفي ذلك …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 4، ص 410، يرد فيه ذكر الواجب، والوجوب، والمستحب، والمندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 4, p. 410, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), the recommended (mandub), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 4، ص 410 کا اقتباس جس میں واجب، وجوب، مستحب، مندوب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Targhib wa-l-Tarhib de al-Mundhiri, volume numérisé 4, p. 410, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb), le recommandé (mandub), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Targhib wa-l-Tarhib de al-Mundhiri, volumen digitalizado 4, p. 410, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mustahabb), lo recomendado (mandub), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 4. cildinin 410. sayfasından, farz, tavsiye edilen, müstehap olan ve sünnet olan amelleri sıralayan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Nasihat dan Peringatan), Jilid 4, halaman 410, yang menyebutkan amalan wajib, anjuran, yang diinginkan, dan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
