label: { ar: "الموطأ 2673 — زيد بن أسلم عن ابن بجيد عن جدته: ردوا المسكين ولو بظلف محرق", en: "Muwatta 2673", es: "Muwatta 2673", fr: "Muwatta 2673", ur: "موطا 2673", tr: "El-Muvatta 2673 — Zeyd ibn Aslam, İbn Bujayd'dan, o da anneannesinden rivayetle: Zali adamı, ayağı yanmış olsa bile geri verin.", id: "Al-Muwatta 2673 — Zayd ibn Aslam, berdasarkan riwayat Ibn Bujayd, berdasarkan riwayat neneknya: Kembalikan orang miskin itu, meskipun ia memiliki kuku yang terbakar" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن ابن بجيد الأنصاري ثم الحارثي عن جدته أن رسول الله قال: ردوا المسكين ولو بظلف محرق. {cite:muwatta-maruf-1997 p.511}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da İbn Bujayd el-Ensari'den, sonra da el-Harithi'den, o da büyükannesinden rivayet ederek, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Fakirlerin elini, yanmış toynak olsa bile, geri verin.\" {cite:muwatta-maruf-1997 s.511}"
  id: "Malik meriwayatkan dari Zaid bin Aslam, dari Ibnu Bujayd al-Ansari, kemudian al-Harithi, dari neneknya, bahwa Rasulullah SAW bersabda: \"Balaslah uluran tangan orang fakir miskin, meskipun dengan kuku yang terbakar.\" {cite:muwatta-maruf-1997 p.511}"
