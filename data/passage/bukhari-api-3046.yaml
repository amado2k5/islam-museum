label: { ar: "صحيح البخاري 3046 — المرض والمريض، عيادة المريض", en: "Sahih al-Bukhari 3046 — illness and the sick; visiting the sick", ur: "صحیح بخاری 3046 — بیماری اور بیمار، بیمار کی عیادت", es: "Sahih al-Bukhari 3046 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sahih al-Bukhari 3046 — la maladie et les malades; rendre visite aux malades", tr: "Sahih el-Buhari 3046 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sahih al-Bukhari 3046 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ، عَنْ أَبِي وَائِلٍ، عَنْ أَبِي مُوسَى ـ قَالَ قَالَ رَسُولُ اللَّهِ \" فُكُّوا الْعَانِيَ ـ يَعْنِي الأَسِيرَ ـ وَأَطْعِمُوا الْجَائِعَ وَعُودُوا الْمَرِيضَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3046، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3046 (Fighting for the Cause of Allah (Jihaad)), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3046، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3046 (La lucha por la causa de Alá (Yihad)), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 3046 (Le Jihad), mentionne la maladie, les malades et les visites aux malades. Le dictionnaire médical le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 3046 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3046, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
