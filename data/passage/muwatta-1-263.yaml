label: { ar: "الموطأ 263 — الشيطان يلبس على المصلي حتى لا يدري كم صلى فليسجد سجدتين", en: "Muwatta 263" }
text: "إن أحدكم إذا قام يصلي جاءه الشيطان فلبس عليه حتى لا يدري كم صلى، فإذا وجد ذلك أحدكم فليسجد سجدتين وهو جالس"
summary:
  ar: "أول حديث في باب العمل في السهو. يرويه يحيى عن مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن عن أبي هريرة: أخبر النبي أن الشيطان يأتي المصلي فيلبّس عليه حتى لا يدري كم صلى، فمن وجد ذلك فليسجد سجدتين وهو جالس. ويخرّجه المحقق عند البخاري (1232) ومسلم (2/82) وأبي داود (1030) والنسائي (3/30) وابن حبان من طرق أصحاب مالك، ويحيل على التمهيد (7/89). {cite:muwatta-maruf-1997 p.155}"
