label: { ar: "الموطأ 263 — الشيطان يلبس على المصلي حتى لا يدري كم صلى فليسجد سجدتين", en: "Muwatta 263", es: "Muwatta 263", fr: "Muwatta 263", ur: "موطا 263", tr: "El-Muvatta 263 — Şeytan, namaz kılanı şaşırtarak kaç rekat namaz kıldığını bilmemesini sağlar; böylece iki secde yapması gerekir.", id: "Al-Muwatta 263 — Setan membingungkan orang yang beribadah sehingga ia tidak mengetahui berapa rakaat yang telah ia kerjakan, sehingga ia harus melakukan dua sujud." }
text: "إن أحدكم إذا قام يصلي جاءه الشيطان فلبس عليه حتى لا يدري كم صلى، فإذا وجد ذلك أحدكم فليسجد سجدتين وهو جالس"
summary:
  ar: "أول حديث في باب العمل في السهو. يرويه يحيى عن مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن عن أبي هريرة: أخبر النبي أن الشيطان يأتي المصلي فيلبّس عليه حتى لا يدري كم صلى، فمن وجد ذلك فليسجد سجدتين وهو جالس. ويخرّجه المحقق عند البخاري (1232) ومسلم (2/82) وأبي داود (1030) والنسائي (3/30) وابن حبان من طرق أصحاب مالك، ويحيل على التمهيد (7/89). {cite:muwatta-maruf-1997 p.155}"
  id: "Hadits pertama dalam bab tentang amalan dalam kasus lupa. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Abu Salamah ibn Abd al-Rahman, dari Abu Hurayrah: Nabi (shalawat dan salam kepadanya) bersabda bahwa setan datang kepada orang yang sedang beribadah dan membingungkannya sehingga ia tidak tahu berapa rakaat yang telah dikerjakannya. Barangsiapa yang mengalami hal ini hendaknya melakukan dua sujud sambil duduk. Editor memasukkannya dalam kumpulan hadits al-Bukhari (1232), Muslim (2/82), Abu Dawud (1030), al-Nasa'i (3/30), dan Ibn Hibban melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (7/89). {cite:muwatta-maruf-1997 p.155}"
