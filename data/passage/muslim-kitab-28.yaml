summary:
  ar: "القسم 28 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب القسامة والمحاربين والقصاص والديات»، ويضم فيها النصوص من 4342 إلى 4397 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 28 of Sahih Muslim (The Book of Oaths, Muharibin, Qasas (Retaliation), and Diyat (Blood Money)) in the division of the open hadith dataset the museum took its reports from: reports 4342 to 4397 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 28، عنوان «کتاب القسامۃ والمحاربین والقصاص والدیات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4342 تا 4397۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 28 de Sahih Muslim (El Libro de los Juramentos, Muharibin, Qasas (Represalias) y Diyat (Indemnización por Daños Sangrientos)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4342 al 4397 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des serments, Muharibin, Qasas (Rétribution) et Diyat (Prix du sang)), dans la base de données ouverte, sous la numérotation des hadiths 4342 à 4397. Les éditions imprimées classent ces hadiths dans ce livre; leur numérotation diffère."
