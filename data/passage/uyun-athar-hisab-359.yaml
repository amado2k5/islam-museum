text: "… أن تمنعَ من الحج معه ، فأعلمَ رسول اللّٰه عليه أن عمرة في رمضان تعدل حجة . وخرج رسولُ اللّٰه علا إلى مكة عام حجة الوداع التي لم يحج من المدينة منذ هاجر عليه الصلاة والسلام إليها غيرها ، فأخذ …"
summary:
  ar: "مقطع من عيون الأثر لابن سيد الناس، ص 359، يذكر عمل يعدل عملا أعظم؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sayyid al-Nas's Uyun al-Athar, p. 359, that speaks of a deed that equals a greater one; from the extracted copy, quoted within forty words per the sources policy."
  ur: "عیون الاثر، ابن سید الناس کے صفحہ 359 کا اقتباس جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
