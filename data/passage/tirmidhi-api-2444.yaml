label: { ar: "جامع الترمذي 2444 — التداوي بالعسل", en: "Jami' al-Tirmidhi 2444 — honey as a remedy", ur: "جامع ترمذی 2444 — شہد سے علاج", es: "Jami' al-Tirmidhi 2444 — La miel como remedio", fr: "Jami' al-Tirmidhi 2444 — le miel comme remède", tr: "Cami' el-Tirmizi 2444 — Bal ile tedavi", id: "Jami' al-Tirmidhi 2444 — Pengobatan dengan madu" }
text: "… النَّبِيِّ قَالَ \" حَوْضِي مِنْ عَدَنَ إِلَى عَمَّانَ الْبَلْقَاءِ مَاؤُهُ أَشَدُّ بَيَاضًا مِنَ اللَّبَنِ وَأَحْلَى مِنَ الْعَسَلِ وَأَكَاوِيبُهُ عَدَدُ نُجُومِ السَّمَاءِ مَنْ شَرِبَ مِنْهُ شَرْبَةً لَمْ يَظْمَأْ بَعْدَهَا أَبَدًا أَوَّلُ النَّاسِ وُرُودًا عَلَيْهِ فُقَرَاءُ الْمُهَاجِرِينَ الشُّعْثُ رُءُوسًا الدُّنْسُ ثِيَابًا الَّذِينَ لاَ يَنْكِحُونَ الْمُتَنَعِّمَاتِ وَلاَ تُفْتَحُ لَهُمُ السُّدَدُ \". قَالَ عُمَرُ لَكِنِّي نَكَحْتُ الْمُتَنَعِّمَاتِ وَفُتِحَ لِيَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2444، يذكر التداوي بالعسل. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2444 (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara'), that mentions honey as a remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2444، جس میں شہد سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2444 (Capítulos sobre la descripción del Día del Juicio, Ar-Riqaq y Al-Wara'), menciona la miel como remedio. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2444 (chapitres sur la description du Jour du Jugement, Ar-Riqaq et Al-Wara'), mentionne le miel comme remède. Le Répertoire des médicaments le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de yer alan 2444 numaralı hadiste balın bir tedavi yöntemi olarak kullanımından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2444, menyebutkan penggunaan madu sebagai obat. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
