label: { ar: "مسلم 2946 — ما بين خلق آدم إلى قيام الساعة خلق أكبر من الدجال", en: "Muslim 2946 — No greater creation between Adam and the Hour than the Dajjal", es: "Muslim 2946 — No hay mayor creación entre Adán y la Hora que el Dajjal.", fr: "Muslim 2946 — Il n'y a pas de création plus grande entre Adam et l'Heure que le Dajjal.", ur: "مسلم 2946 - آدم اور قیامت کے درمیان دجال سے بڑی کوئی تخلیق نہیں۔", tr: "Müslim 2946 — Âdem'in yaratılışı ile Kıyamet Günü arasında, Deccal'den daha büyük bir yaratılmış yoktur.", id: "Muslim 2946 — Antara penciptaan Adam dan Hari Kiamat, tidak ada ciptaan yang lebih besar daripada Antikristus." }
text: "قال عمران بن حصين: سمعت رسول الله يقول: ما بين خلق آدم إلى قيام الساعة خلق أكبر من الدجال"
summary:
  ar: "رواية عمران بن حصين في باب في الدجال من كتاب الفتن وأشراط الساعة في صحيح مسلم؛ تعظيم شأن فتنة المسيح الدجال — وفي لفظ آخر «أمر أكبر من الدجال»."
  tr: "İmran bin Hüseyin'in Sahih Müslim'deki Sıkıntılar ve Kıyamet Alametleri Kitabı'nda Deccal ile ilgili bölümde anlattığına göre; Deccal'in zulmünün büyüklüğü - başka bir ifadeyle \"Deccal'den daha büyük bir mesele\"."
  id: "Riwayat Imran bin Husayn dalam bab tentang Antikristus dari Kitab Kesengsaraan dan Tanda-Tanda Hari Kiamat dalam Sahih Muslim; besarnya kesengsaraan Antikristus — dan dengan kata lain “suatu perkara yang lebih besar daripada Antikristus”."
