label: { ar: "الموطأ 1720 — عبد الله بن دينار: سمع ابن عمر يقرأ آية الطلاق بقراءة لقبل عدتهن، قال مالك يعني أن يطلق في كل طهر مرة", en: "Muwatta 1720", es: "Muwatta 1720", fr: "Muwatta 1720", ur: "موطا 1720", tr: "El-Muvatta 1720 — Abdullah bin Dinar: İbn Ömer'in \"bekleme sürelerinden önce\" okunuşuyla boşanma ayetini okuduğunu işitti. Malik, bunun her temizlik döneminde bir defa boşanmak anlamına geldiğini söyledi.", id: "Al-Muwatta 1720 — Abdullah bin Dinar: Dia mendengar Ibnu Umar membaca ayat cerai dengan bacaan \"sebelum masa iddah mereka.\" Malik berkata, maksudnya adalah dia harus bercerai sekali dalam setiap masa suci." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار أنه قال سمعت عبد الله بن عمر يقرأ آية الطلاق بقراءة لقبل عدتهن. قال مالك يعني بذلك أن يطلق في كل طهر مرة. {cite:muwatta-maruf-1997 p.102}"
  tr: "Malik, Abdullah ibn Dinar'dan rivayetle şöyle der: Abdullah ibn Umar'ın, bekleme süresi dolmadan önce boşanmak niyetiyle boşanma ayetini okuduğunu işittim. Malik dedi ki: Bununla, her adet döneminde bir kere boşanmayı kastediyordu. {cite:muwatta-maruf-1997 s.102}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar bahwa ia berkata: Aku mendengar Abdullah ibn Umar membaca ayat cerai dengan niat untuk bercerai sebelum masa iddah mereka. Malik berkata: Yang ia maksudkan adalah ia harus bercerai sekali selama setiap siklus haid. {cite:muwatta-maruf-1997 p.102}"
