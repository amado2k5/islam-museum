summary:
  ar: "يقول مالك في الرجل يقول لامرأته أنت خلية أو برية أو بائنة، إنها ثلاث تطليقات للمرأة التي قد دخل بها، ويدين في التي لم يدخل بها، أواحدة أراد أم ثلاثا. فإن قال واحدة أحلف على ذلك، وكان خاطبا من الخطاب، لأنه لا يخلي المرأة التي قد دخل بها زوجها ولا يبينها ولا يبريها إلا ثلاث تطليقات، والتي لم يدخل بها تخليها وتبريها وتبينها الواحدة. قال مالك وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.61}"
