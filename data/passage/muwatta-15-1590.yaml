label: { ar: "الموطأ 1590 — مالك: الرجل يقول لامرأته أنت خلية أو برية أو بائنة، إنها ثلاث تطليقات للتي دخل بها، ويدين في التي لم يدخل بها", en: "Muwatta 1590", es: "Muwatta 1590", fr: "Muwatta 1590", ur: "موطا 1590", tr: "El-Muvatta 1590 — Malik: Bir adam karısına, “Sen özgürsün,” veya “Sen boşandın,” veya “Sen ayrıldın,” derse, bu, evliliğini tamamladığı kadın için üç boşanma sebebidir ve evliliğini tamamlamadığı kadın için de boşanma sorumluluğu doğar.", id: "Al-Muwatta 1590 — Malik: Seorang pria berkata kepada istrinya, “Kamu bebas,” atau “Kamu diceraikan,” atau “Kamu berpisah,” dan ini merupakan tiga kali talak bagi wanita yang telah melakukan hubungan suami istri dengannya, dan dia wajib menceraikan wanita yang belum melakukan hubungan suami istri dengannya." }
summary:
  ar: "يقول مالك في الرجل يقول لامرأته أنت خلية أو برية أو بائنة، إنها ثلاث تطليقات للمرأة التي قد دخل بها، ويدين في التي لم يدخل بها، أواحدة أراد أم ثلاثا. فإن قال واحدة أحلف على ذلك، وكان خاطبا من الخطاب، لأنه لا يخلي المرأة التي قد دخل بها زوجها ولا يبينها ولا يبريها إلا ثلاث تطليقات، والتي لم يدخل بها تخليها وتبريها وتبينها الواحدة. قال مالك وهذا أحسن ما سمعت في ذلك. {cite:muwatta-maruf-1997 p.61}"
  tr: "Malik, bir erkeğin karısına “Sen özgürsün”, “Sen serbestsin” veya “Sen ayrıldın” demesinin, evliliğini tamamladığı kadın için üç boşanma anlamına geldiğini söylemiştir. Evliliğini tamamlamadığı kadın için de aynı hüküm geçerlidir; ister bir boşanma, ister üç boşanma niyetinde olsun. Eğer bir boşanma derse, buna yemin etmelidir ve talipler arasında talip sayılır; çünkü kocasının evliliğini tamamladığı bir kadın, ancak üç boşanma ile serbest bırakılabilir, ayrılabilir veya özgür bırakılabilir. Evliliğini tamamlamadığı bir kadın ise tek bir boşanma ile serbest bırakılabilir, ayrılabilir veya özgür bırakılabilir. Malik, “Bu konuda duyduğum en iyi hüküm budur” demiştir. {cite:muwatta-maruf-1997 s.61}"
  id: "Malik berkata mengenai seorang pria yang berkata kepada istrinya, “Kamu bebas,” atau “Kamu dibebaskan,” atau “Kamu berpisah,” bahwa ini merupakan tiga kali talak bagi wanita yang telah melakukan hubungan suami istri dengannya. Ia terikat oleh hukum yang sama untuk wanita yang belum melakukan hubungan suami istri dengannya, baik ia bermaksud satu kali talak atau tiga kali. Jika ia mengatakan satu kali talak, ia harus bersumpah atas hal itu, dan ia dianggap sebagai pelamar di antara para pelamar, karena seorang wanita yang telah melakukan hubungan suami istri dengannya tidak dapat dibebaskan, berpisah, atau dilepaskan kecuali dengan tiga kali talak. Seorang wanita yang belum melakukan hubungan suami istri dengannya dapat dibebaskan, berpisah, atau dilepaskan dengan satu kali talak. Malik berkata, “Ini adalah hukum terbaik yang pernah saya dengar mengenai masalah ini.” {cite:muwatta-maruf-1997 p.61}"
