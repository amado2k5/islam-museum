text: "المقالة الثانية عشرة في ذكر المعاجين والجوارشنات وغيرها من الأدوية المركبة التي الجملة الثانية من الأقراباذين في الأدوية المجرّبة في مرض مرض المقالة الثانية في العين وما يتعلق بذلك من الأمراض في الرمد المقالة السابعة في أوجاع المفاصل والنقرس و …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 589، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 589, that mentions illness and the sick, pain, named diseases, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 589 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 589, que menciona la enfermedad y los enfermos, el dolor, las enfermedades específicas, los órganos del cuerpo, el medicamento, los medicamentos y la farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 589, qui mentionne la maladie et les malades, la douleur, les maladies nommées, les organes du corps, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Bölümünün 589. sayfasından, hastalık, hasta, ağrı, hastalıkların isimleri, vücut parçaları, ilaç, uyuşturucu ve eczaneden bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 3, hlm. 589, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, bagian tubuh, obat-obatan, narkoba, dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
