text: |-
  إحقا)*
  ٤٦٣
  وحصاة المسك قطعة صلبة توجد فى فأرة المسك وفلان ذوحصاة أى ذوعقل ولب قال كعب
  ابن سعد الغتوى .
  وأعلم علما ليس بالظن أنة • اذاذل مولى المرفهوذليل
  وانَّ لسان المرممالم تكن ف • حصاة عسلى عوراته لدليل
  وأرض محصاة ذات حصى وأحصيت الشى عددته وقواهم فحن أكثرمبنهم حصى أى عسددا
  قال الاعشى يفضل عامر اعلى عاقمة
  ولست بالا كثهر منهم حصى * وإنما العزة للكاثر
  والحصو المنع قال الشاءر
  ألا تخاف اللّٰه اذ حصوتى * حقى بلاذنب واذعنيتى
  ⁦( حضا)⁩. حضوت النارأى سعرتها والمحضا على مفعال عود تحرّك به النارفاذاهمزت
  *و محض أ على مفعل ظا ) حفايت المرأة عند زوجها حظوة وحظوة بالكسر
  والضم رحظة أيضا وأنتدابن السكيت لابنة الحارس
  دل هى الاحظة أو تطليق * أوصاف أوبين ذاك تعليق •قدوجب المهراذاغاب الحوق
  وهى حظيتى واحدى حظاياى وفى المثل الاحظية فلااليسة يول ان أخطأتك الحظوة فيما
  نطلب فلا تأل أن تتودد الى الناس اعلك أن تدرل بعض ماتريد وأصله فى المرأة تصاف عسفد
  زوجها ور جل حظطىّ اذا كان ذاحظوة ومنزلة وقد حظى عند الامبرواحتظى به بمعنى
  وأحفليته على فلان أى فضلته عليه والحظاوة بالفتح سهم صغير قدرذراع واذالم يكن فيه نصل
  فهو حظية بالتصغير وفى المثل احدى حظيات اقمان وهواقمان بن عاد وحظياته سهامه
  ومراميه يضرب لن عرف بالشرارة ثم ياءت منه هنة وجمع الحفوة حظوات وخطاء بالمدقال
  ابن السكيت يقال حنظى به لغة فى قولك عنظى به اذا ندديه وأسمعه المكروه فا قال
  الكسائى رجل حاف بين الحفوة والخفية والحفاية والحفاء بالمد وقد حقى يحفى حفاء وهو أن
  يمنى بلا حف ولا نعسل فأمّا الذى حقى من كثرة المشى أى رقت قدمه أوحافره فانه حف بين
  لحنى مقصور وأحفاهغيره والحفاوة بالفتح المبالغة فى السؤال عن الرج-ل والعناية فى أمره
  وفى المثل مآربة لاحفاوة تقول منه حفت به بالمكسموحفاوة وتحفيت به أى بالغت فى اكرامه
  والطافه وحقى الفرس السهج حافره وأحفى الرجل أى حقيت دابته والحقىّ العالم الذى
  يتعلم الشى باستقصاء والحنى أيضا المستقصى فى السؤال قال الاعشى
  فان تسألى عنى فيارب سائل -فعن الاعشى به حيث أصعدا
  نال الاصحعى حفوت الرجسل من كل خير أحفوهحفوا اذا منعته من كل خير وحفيت اليه
  الوصية أى بالغت حكاه أبو عبيد والاجفاء الاستقصاء فى الكلام والمنازعة ومنسه قول
  الجرث بنحازة البشكرى
  انّ اخواننا الاراقم يغلون علينا في قيلهم احفاء
  وأحتى شاريه أى استقصى فى أخذه والزق جزه وفى الحديث انه عليه السلام أمر أن تحنى
  الشوارب وتعفى اللحى أبوز يدحافيت الرجل ماريته ونازعته فى الكلام ⁦(حقا)⁩.
