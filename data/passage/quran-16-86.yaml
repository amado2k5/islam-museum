text: "وَإِذَا رَءَا ٱلَّذِينَ أَشْرَكُوا۟ شُرَكَآءَهُمْ قَالُوا۟ رَبَّنَا هَـٰٓؤُلَآءِ شُرَكَآؤُنَا ٱلَّذِينَ كُنَّا نَدْعُوا۟ مِن دُونِكَ ۖ فَأَلْقَوْا۟ إِلَيْهِمُ ٱلْقَوْلَ إِنَّكُمْ لَكَـٰذِبُونَ"
text_search: "وإذا رأى الذين أشركوا شركاءهم قالوا ربنا هؤلاء شركاؤنا الذين كنا ندعو من دونك ۖ فألقوا إليهم القول إنكم لكاذبون"
translations:
  en: { text: "And when those who ascribed partners to Allah behold those partners of theirs, they will say: Our Lord! these are our partners unto whom we used to cry instead of Thee. But they will fling to them the saying: Lo! ye verily are liars!", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور جب مشرک (اپنے بنائے ہوئے) شریکوں کو دیکھیں گے تو کہیں گے کہ پروردگار یہ وہی ہمارے شریک ہیں جن کو ہم تیرے سوا پُکارا کرتے تھے۔ تو وہ (اُن کے کلام کو مسترد کردیں گے اور) اُن سے کہیں گے کہ تم تو جھوٹے ہو", translator: "Fateh Muhammad Jalandhari", license: PD }
