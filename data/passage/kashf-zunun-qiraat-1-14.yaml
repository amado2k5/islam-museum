text: "… الخامسة أو السادسة من عمره اتخذ له معلمًا يعلمه القرآن وتجويده، هو الإمام عيسى خليفة القريمي، فتعلم على يديه قراءة القرآن والمقدمة الجزرية في التجويد، كما تعلم مبادئ الصلاة. ثم أسمعه بعد ذلك ما قرأه عليه وحفظه في دار القراء …"
