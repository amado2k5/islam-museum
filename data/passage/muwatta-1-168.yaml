label: { ar: "الموطأ 168 — مالك: أحب أن أغسل الفرج من البول", en: "Muwatta 168" }
summary:
  ar: "قول لمالك يرويه يحيى في باب ما جاء في البول قائماً وغيره: سُئل عن غسل الفرج من البول والغائط هل جاء فيه أثر، فقال إنه بلغه أن بعض من مضى كانوا يستنجون من الغائط بالماء، وإنه يحب أن يغسل الفرج من البول. ويلاحظ المحقق أن الترمذي حين ذكر عقب حديث عائشة (19) من أخذ بالاستنجاء بالماء لم يعدّ مالكاً فيهم. {cite:muwatta-maruf-1997 p.110}"
