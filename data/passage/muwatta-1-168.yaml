label: { ar: "الموطأ 168 — مالك: أحب أن أغسل الفرج من البول", en: "Muwatta 168", es: "Muwatta 168", fr: "Muwatta 168", ur: "موطا 168", tr: "Al-Muwatta 168 — Malik: İdrarımı yaptıktan sonra cinsel organlarımı yıkamayı severim.", id: "Al-Muwatta 168 — Malik: Aku suka membersihkan kemaluanku setelah buang air kecil" }
summary:
  ar: "قول لمالك يرويه يحيى في باب ما جاء في البول قائماً وغيره: سُئل عن غسل الفرج من البول والغائط هل جاء فيه أثر، فقال إنه بلغه أن بعض من مضى كانوا يستنجون من الغائط بالماء، وإنه يحب أن يغسل الفرج من البول. ويلاحظ المحقق أن الترمذي حين ذكر عقب حديث عائشة (19) من أخذ بالاستنجاء بالماء لم يعدّ مالكاً فيهم. {cite:muwatta-maruf-1997 p.110}"
  tr: "Yahya'nın ayakta idrar yapma ve diğer konular bölümünde rivayet ettiği üzere Malik'e atfedilen bir ifade şöyledir: Ona idrar ve dışkılamadan sonra özel bölgelerin yıkanması ve bunun için bir emsal olup olmadığı soruldu. O da kendisinden önce gelenlerden bazılarının dışkılamadan sonra suyla temizlendiğini duyduğunu ve kendisinin idrar yaptıktan sonra özel bölgelerini yıkamayı tercih ettiğini söyledi. Araştırmacı, Tirmizi'nin Aişe'nin (19) hadisine dayanarak suyla temizlenenlerden bahsederken Malik'i bunların arasına dahil etmediğini belirtiyor. {cite:muwatta-maruf-1997 s.110}"
  id: "Pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dalam bab tentang buang air kecil sambil berdiri dan hal-hal lainnya: Beliau ditanya tentang membersihkan kemaluan setelah buang air kecil dan buang air besar, dan apakah ada preseden untuk itu. Beliau menjawab bahwa beliau telah mendengar bahwa sebagian dari orang-orang sebelum beliau biasa membersihkan diri setelah buang air besar dengan air, dan bahwa beliau lebih memilih membersihkan kemaluan setelah buang air kecil. Peneliti mencatat bahwa ketika al-Tirmidhi menyebutkan, mengikuti hadits Aisyah (19), orang-orang yang mempraktikkan membersihkan diri dengan air, beliau tidak memasukkan Malik di antara mereka. {cite:muwatta-maruf-1997 p.110}"
