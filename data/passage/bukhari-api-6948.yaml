label: { ar: "صحيح البخاري 6948 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 6948 — what was made lawful; what is not lawful", ur: "صحیح بخاری 6948 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 6948 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih al-Bukhari 6948 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih el-Buhari 6948 — Neler caizdir, neler caiz değildir", id: "Sahih al-Bukhari 6948 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… الشَّيْبَانِيُّ وَحَدَّثَنِي عَطَاءٌ أَبُو الْحَسَنِ السُّوَائِيُّ،، وَلاَ أَظُنُّهُ إِلاَّ ذَكَرَهُ عَنِ ابْنِ عَبَّاسٍما ـ {يَا أَيُّهَا الَّذِينَ آمَنُوا لاَ يَحِلُّ لَكُمْ أَنْ تَرِثُوا النِّسَاءَ كَرْهًا} الآيَةَ قَالَ كَانُوا إِذَا مَاتَ الرَّجُلُ كَانَ أَوْلِيَاؤُهُ أَحَقَّ بِامْرَأَتِهِ، إِنْ شَاءَ بَعْضُهُمْ تَزَوَّجَهَا، وَإِنْ شَاءُوا زَوَّجَهَا، وَإِنْ شَاءُوا لَمْ يُزَوِّجْهَا، فَهُمْ أَحَقُّ بِهَا مِنْ أَهْلِهَا، فَنَزَلَتْ هَذِهِ الآيَةُ فِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6948، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6948 ((Statements made under) Coercion), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6948، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6948 ((Declaraciones hechas bajo coacción)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 6948 (« Déclarations faites sous la contrainte »), mentionne ce qui a été rendu licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sahih el-Buhari'de 6948 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6948, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
