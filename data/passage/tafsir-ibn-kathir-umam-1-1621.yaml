text: "… لَمُسْرِفُونَ وهذا تقريعُ لهم، وتوبيخٌ على ارتكابهم المحارم بعد عِلْمِهِم بها، كما كانت بنو قُرَيْظَة والنَّضير وغيرهم من بني قَيْنُقاع ممَّن حول المدينة من اليهود، الَّذِين كانوا يُقَاتِلُون مع الأوس والخزرج إذا وقعت بينهم الحروب في الجاهلية، ثم إذا وضعت …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 1621، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
