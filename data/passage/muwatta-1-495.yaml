label: { ar: "الموطأ 495 — نافع: أبو هريرة يكبر في العيد سبعاً في الأولى وخمساً في الآخرة", en: "Muwatta 495", es: "Muwatta 495", fr: "Muwatta 495", ur: "موطا 495", tr: "El-Muvatta 495 — Nafi’: Ebu Hurayra, bayram namazının ilk rekatında yedi, ikinci rekatında ise beş defa tekbir getirir.", id: "Al-Muwatta 495 — Nafi’: Abu Hurairah mengucapkan takbir tujuh kali pada rakaat pertama dan lima kali pada rakaat kedua saat Idul Fitri" }
summary:
  ar: "أثر يرويه مالك عن نافع مولى عبد الله بن عمر، في باب ما جاء في التكبير والقراءة في صلاة العيدين: شهد الأضحى والفطر مع أبي هريرة فكبر في الركعة الأولى سبع تكبيرات قبل القراءة وفي الآخرة خمس تكبيرات قبل القراءة؛ قال مالك: وهو الأمر عندنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ومحمد بن الحسن، وينقل عن ابن عبد البر أن مثل هذا لا يكون رأياً وإنما توقيف، وأنه روي عن النبي من طرق كثيرة حسان ⁦(التمهيد 16/137)⁩؛ ثم ينقل عن ابن حجر في تلخيص الحبير قول أحمد بن حنبل إنه لا يُروى في التكبير في العيدين حديث صحيح مرفوع، ويرى أن قوله حق. {cite:muwatta-maruf-1997 p.254}"
  tr: "Malik'in, Abdullah ibn Umar'ın azatlı kölesi Nafi'den rivayet ettiği bir hadis, bayram namazlarındaki tekbir ve Kur'an okuma hakkındaki bölümde yer almaktadır: Nafi', Ebu Hurayra ile birlikte Kurban Bayramı ve Ramazan Bayramı namazlarını kıldı ve birinci rekatta Kur'an okumadan önce yedi tekbir, ikinci rekatta ise Kur'an okumadan önce beş tekbir getirdi. Malik, \"Bizde böyle bir uygulama vardır\" dedi. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Abdülrazzak, Şafiî ve Muhammed ibn Hasan tarafından rivayet edildiğini belirtmektedir. İbn Abdülberr'in de bu konunun görüş meselesi değil, ilahi bir emir olduğunu ve Peygamberimizden birçok sahih rivayet zinciriyle nakledildiğini söylediğini aktarmaktadır (el-Temhid 16/137). Ardından İbn Hacer'in Talkhis al-Habir adlı eserinde Ahmed ibn Hanbal'ın, bayram namazlarındaki tekbirle ilgili olarak Peygamber'e kadar uzanan sahih bir hadis rivayet edilmediğini söylediğini aktarıyor ve bu ifadenin doğru olduğunu düşünüyor. {cite:muwatta-maruf-1997 s.254}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi', budak yang dibebaskan oleh Abdullah ibn Umar, dalam bab tentang apa yang diriwayatkan mengenai takbir dan bacaan dalam salat Id: Ia menyaksikan salat Id al-Adha dan Id al-Fitr bersama Abu Hurayrah, dan ia membaca tujuh takbir di rakaat pertama sebelum bacaan, dan lima takbir di rakaat kedua sebelum bacaan. Malik berkata: Inilah kebiasaan kami. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwayd, Abd al-Razzaq, al-Shafi'i, dan Muhammad ibn al-Hasan. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa hal seperti itu bukanlah masalah pendapat tetapi merupakan masalah petunjuk ilahi, dan bahwa hal itu diriwayatkan dari Nabi melalui banyak sanad yang sahih (al-Tamhid 16/137). Kemudian ia mengutip Ibnu Hajar dalam Talkhis al-Habir yang mengatakan bahwa Ahmad ibn Hanbal berkata bahwa tidak ada hadits sahih dengan sanad yang sampai kepada Nabi yang diriwayatkan mengenai takbir dalam salat Id, dan ia menganggap pernyataan tersebut benar. {cite:muwatta-maruf-1997 p.254}"
