label: { ar: "الموطأ 495 — نافع: أبو هريرة يكبر في العيد سبعاً في الأولى وخمساً في الآخرة", en: "Muwatta 495" }
summary:
  ar: "أثر يرويه مالك عن نافع مولى عبد الله بن عمر، في باب ما جاء في التكبير والقراءة في صلاة العيدين: شهد الأضحى والفطر مع أبي هريرة فكبر في الركعة الأولى سبع تكبيرات قبل القراءة وفي الآخرة خمس تكبيرات قبل القراءة؛ قال مالك: وهو الأمر عندنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ومحمد بن الحسن، وينقل عن ابن عبد البر أن مثل هذا لا يكون رأياً وإنما توقيف، وأنه روي عن النبي من طرق كثيرة حسان (التمهيد 16/137)؛ ثم ينقل عن ابن حجر في تلخيص الحبير قول أحمد بن حنبل إنه لا يُروى في التكبير في العيدين حديث صحيح مرفوع، ويرى أن قوله حق. {cite:muwatta-maruf-1997 p.254}"
