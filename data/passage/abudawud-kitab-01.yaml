summary:
  ar: "القسم 1 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطهارة»، ويضم فيها النصوص من 1 إلى 390 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 1 of Sunan Abi Dawud (Purification (Kitab Al-Taharah)) in the division of the open hadith dataset the museum took its reports from: reports 1 to 390 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 1، عنوان «کتاب الطہارۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1 تا 390۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 1 de Sunan Abi Dawud (Purificación (Kitab Al-Taharah)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1 al 390, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait les hadiths du Sunan Abi Dawud (Purification, Kitab Al-Taharah), dans sa première partie, qui comprend les hadiths 1 à 390 selon la numérotation de ce recueil. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 1. bölümü, açık hadis veritabanının bölümlerine ayrılmıştır ve \"Temizlenme Kitabı\" başlığını taşımaktadır. Bu bölüm, 1'den 390'a kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 1 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi beberapa bagian dari basis data hadits terbuka dan diberi judul \"Kitab Penyucian\". Bagian ini berisi teks 1 hingga 390, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
