label: { ar: "نوادر جحا الكبرى، ص 51 — «لا تكن في التابوت وامش حيث شئت»", en: "Nawadir Juha al-Kubra, p. 51 — 'Don't Be in the Coffin, and Walk Wherever You Like'", ur: "نوادر جحا الکبریٰ، ص 51 — «تابوت میں نہ ہو تو جہاں چاہو چلو»", fr: "Nawadir Juha al-Kubra, p. 51 — « Ne sois pas dans le cercueil, et marche où tu veux »", es: "Nawadir Juha al-Kubra, p. 51 — «No estés en el ataúd y camina por donde quieras»", tr: "Juha'nın Muhteşem Fıkraları, s. 51 — “Tabutta kalma, istediğin yere yürü.”", id: "Anekdot Hebat Juha, hlm. 51 — “Jangan berada di dalam peti mati, berjalanlah ke mana pun kamu mau.”" }
text: "… لا تكنْ في التابوتِ وامشِ حيث شِئْتَ سأله أحدُهم يوماً: إذا كان الإنسان ماشياً مع جنازةٍ، هل يمشي وراءَها أم أمامَها؟ فأجابَه : لا تكُنْ في التابوتِ وأمشِ حيثُ شِئْتَ!. عار عليك أنْ لا تكونَ كابنك جاء إلى مدينةِ بروسةَ …"
summary:
  ar: "سُئل جحا هل يمشي أمام الجنازة أم خلفها، فقال ألا يكون المرء في النعش وأن يمشي حيث شاء. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  en: "Asked whether to walk in front of or behind a funeral, Juha says not to be in the coffin and to walk wherever you like. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  ur: "جحا سے پوچھا گیا کہ جنازے کے آگے چلے یا پیچھے، تو اس نے کہا کہ تابوت میں نہ ہو اور جہاں چاہے چلے۔ {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  fr: "Interrogé pour savoir s'il faut marcher devant ou derrière un cortège funèbre, Juha dit de ne pas être dans le cercueil et de marcher où l'on veut. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  es: "Al preguntarle si hay que caminar delante o detrás de un cortejo fúnebre, Juha dice que no hay que estar en el ataúd y que se camine por donde se quiera. {cite:juha-nawadir-kubra-djuwaydi p. 51}"
  tr: "Juha'ya cenaze alayının önünde mi yoksa arkasında mı yürünmesi gerektiği sorulduğunda, \"Tabutun içinde olmamak gerekir, dilediği yerde yürümek gerekir\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 51}"
  id: "Juha ditanya apakah seseorang harus berjalan di depan atau di belakang iring-iringan jenazah, dan dia menjawab, \"Seseorang sebaiknya tidak berada di dalam peti mati, melainkan berjalan ke mana pun ia suka.\" {cite:juha-nawadir-kubra-djuwaydi p. 51}"
