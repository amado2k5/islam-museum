text: "الكراهة، وفي ((المدونة) : يحج بالصبي وإن لم يبلغ أن يتكلم، وفي كتاب محمد: لا يحج بالرضيع، وأما ابن أربع فنعم. اللخمي: ولا أرى أن يحج إلا بمن يعقل القربة، وأما الرضيع فهو كالبهيمة، قال: وعلى هذا فلا يحج بالمجنون."
