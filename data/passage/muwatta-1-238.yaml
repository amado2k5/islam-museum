label: { ar: "الموطأ 238 — ابن عمر: سنة الصلاة أن تنصب اليمنى وتثني اليسرى", en: "Muwatta 238", es: "Muwatta 238", fr: "Muwatta 238", ur: "موطا 238", tr: "Al-Muwatta 238 — İbn Umar: Namazın sünneti, sağ elin dik, sol elin ise bükülü tutulmasıdır.", id: "Al-Muwatta 238 — Ibn Umar: Sunnah shalat adalah menjaga tangan kanan tetap tegak dan tangan kiri ditekuk." }
text: "إنما سنة الصلاة أن تنصب رجلك اليمنى وتثني رجلك اليسرى"
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن عبد الله بن عبد الله بن عمر، في باب العمل في الجلوس في الصلاة: كان يرى أباه عبد الله بن عمر يتربع في الصلاة إذا جلس، ففعله وهو حديث السن، فنهاه أبوه وأخبره أن سنة الصلاة أن ينصب رجله اليمنى ويثني اليسرى، فلما قال له إنه يفعل ذلك أجاب بأن رجليه لا تحملانه. ويخرّجه المحقق عند البخاري (827) وأبي داود ⁦(958، 961)⁩ والطحاوي وعبد الرزاق والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الحديث يدخل في المسند لقول ابن عمر «إنما سنة الصلاة» ⁦(التمهيد 19/245)⁩. {cite:muwatta-maruf-1997 p.143}"
  tr: "Malik, namazda oturmanın doğru şekli bölümünde, Abdülrahman ibn el-Kâsım'dan, o da Abdullah ibn Abdullah ibn Ömer'den rivayetle şöyle nakletmiştir: Babası Abdullah ibn Ömer'i namazda bağdaş kurarak otururken görmüş, gençliğinde de öyle yapmıştır. Babası ona bunu yasaklamış ve namazın sünnetinin sağ bacağı dik, sol bacağı bükülü tutmak olduğunu söylemiştir. O da öyle yaptığını söylediğinde, babası bacaklarının onu taşıyamayacağını söylemiştir. Araştırmacı, bu hadisi Buhari (827), Ebu Davud (958, 961), Tahavi, Abdülrazzak ve Beyhaki'nin hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil etmiştir. İbn Abdülberr'in, hadisin Müsned'e dahil edilmesinin sebebinin İbn Ömer'in \"Namazın sünneti şudur...\" sözü olduğunu söylediğini aktarmaktadır (el-Temhid 19/245)."
  id: "Malik meriwayatkan hadits ini dari Abd al-Rahman ibn al-Qasim, yang juga dari Abdullah ibn Abdullah ibn Umar, dalam surah tentang cara duduk yang benar dalam shalat: Ia melihat ayahnya, Abdullah ibn Umar, duduk bersila dalam shalat, sehingga ia pun melakukannya ketika masih muda. Ayahnya melarangnya dan mengatakan kepadanya bahwa sunnah shalat adalah dengan menegakkan kaki kanan dan menekuk kaki kiri. Ketika ia mengatakan bahwa ia melakukan hal itu, ayahnya menjawab bahwa kakinya tidak mampu menopangnya. Peneliti memasukkan hadits ini dalam kumpulan hadits al-Bukhari (827), Abu Dawud (958, 961), al-Tahawi, Abd al-Razzaq, dan al-Bayhaqi melalui sanad para sahabat Malik. Dia mengutip Ibnu Abd al-Barr yang mengatakan bahwa hadits tersebut dimasukkan dalam Musnad karena pernyataan Ibnu Umar, \"Sunnah shalat adalah...\" (al-Tamhid 19/245)."
