label: { ar: "الموطأ 238 — ابن عمر: سنة الصلاة أن تنصب اليمنى وتثني اليسرى", en: "Muwatta 238" }
text: "إنما سنة الصلاة أن تنصب رجلك اليمنى وتثني رجلك اليسرى"
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن عبد الله بن عبد الله بن عمر، في باب العمل في الجلوس في الصلاة: كان يرى أباه عبد الله بن عمر يتربع في الصلاة إذا جلس، ففعله وهو حديث السن، فنهاه أبوه وأخبره أن سنة الصلاة أن ينصب رجله اليمنى ويثني اليسرى، فلما قال له إنه يفعل ذلك أجاب بأن رجليه لا تحملانه. ويخرّجه المحقق عند البخاري (827) وأبي داود (958، 961) والطحاوي وعبد الرزاق والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الحديث يدخل في المسند لقول ابن عمر «إنما سنة الصلاة» (التمهيد 19/245). {cite:muwatta-maruf-1997 p.143}"
