  tr: "Abdülrazzak'ın Resimli Musannaf adlı eserinin 1. cildinin 264. sayfasında yer alan bir alıntıda, korunmuş bir eserden bahsedilmektedir; makine tarafından okunabilir taranmış kopyadan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, vasiyetnameler, miraslar, eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, hlm. 264, menyebutkan sebuah artefak yang terpelihara; dari salinan hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, artefak, dan tempat suci."
