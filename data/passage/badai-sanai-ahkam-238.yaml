text: "… - فلها أن تصلي ما شاءت من الفرائض والنوافل ما لم يخرج الوقت، وإن دام السيلان. وهذا عندنا. وقال الشافعي : إن كان العذر من أحد السبيلين؛ كالاستحاضة، وسلس البول، وخروج الريح - يتوضأ لكل فرض، ويصلي ما شاء من …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 238، يرد فيه ذكر الفريضة والفرائض، والفرض، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
