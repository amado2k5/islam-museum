label: { ar: "صحيح مسلم 6456 — الأب والأبوة، اليتيم وفقد الأب", en: "Sahih Muslim 6456 — the father and fatherhood; the orphan and the father lost", ur: "صحیح مسلم 6456 — باپ اور والدیت، یتیم اور باپ کی موت", es: "Sahih Muslim 6456 — El padre y la paternidad; el huérfano y el padre perdido" }
text: "… ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، وَعَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" خَيْرُ نِسَاءٍ رَكِبْنَ الإِبِلَ - قَالَ أَحَدُهُمَا صَالِحُ نِسَاءِ قُرَيْشٍ. وَقَالَ الآخَرُ نِسَاءُ قُرَيْشٍ - أَحْنَاهُ عَلَى يَتِيمٍ فِي صِغَرِهِ وَأَرْعَاهُ عَلَى زَوْجٍ فِي ذَاتِ يَدِهِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6456، يذكر الأب والأبوة، واليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6456 (The Book of the Merits of the Companions), that mentions the father and fatherhood, the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6456، جس میں باپ اور والدیت، یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6456 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad, al huérfano y al padre fallecido. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
