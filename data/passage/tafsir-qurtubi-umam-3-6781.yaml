text: "… ديناً ولا كتاباً. ومن جملة المنافقين عبد اللّٰه بن أُبَيّ بن سَلُول، وعبد اللّٰه بن نَبْتَل، ورفاعة بن زيد. وقيل: رافعة بن تابوت، وأوس بن قَيْظِيّ، كانوا من الأنصار ولكنهم نافقوا، وقالوا ليهود قُريظة والنَّضير: لَيْنْ أُخْرِجْتُمْ لَنَخْرُجَنَّ مَمَكُمْ. وقيل: …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 6781، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
