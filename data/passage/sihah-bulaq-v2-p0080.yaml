  بوزيد فها الطريق يضحو ضحوا اذا يد الك وظهر وضحت بالكسر ضحى عرقت وفحيت أيضا
  للشمس ضما مدوداذا برزت اها وضحيت بالفع.:له والمستقبل أضحى فى اللفتين جميعا وفى
