  والاضحى من الخيل الاشهب والانثى ضحياء والضمياء اسم فرس عرو بن عامر بن ربيعة بن
  عامر بن صعصعة وهوفارس الضحياء قال الشاءر
  أبى فارس الضحياء يوم هبالة • اذاتلحيل فى القنلى من القوم تعثر
  وعامر الضحيان رجل من النمر بن قاسط هى بذلت لانه كان يقعدلة و٠ه فى الضماء يقضى
  ينهم وضاحية كل شيء ناحيته البارزة ويقال هم ينزلون الضواحى و. كان ضاح أى بارز والقلة
  الضهيانة فى قول تأبط شراهى البارزة للشمس وفى الخديت اتلنا الضاحية من البعل
