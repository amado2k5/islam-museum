text: "… حَتَّى رَأَيْتُ النِّسَاءَ يَشْتَدِدْنَ فِي الْجَبَلِ، رَفَعْنَ عَنْ سُوقِهِنَّ قَدْ بَدَتْ خَلاَخِلُهُنَّ، فَأَخَذُوا يَقُولُونَ الْغَنِيمَةَ الْغَنِيمَةَ. فَقَالَ عَبْدُ اللَّهِ عَهِدَ إِلَىَّ النَّبِيُّ أَنْ لاَ تَبْرَحُوا. فَأَبَوْا، فَلَمَّا أَبَوْا صُرِفَ وُجُوهُهُمْ، فَأُصِيبَ سَبْعُونَ قَتِيلاً، وَأَشْرَفَ أَبُو سُفْيَانَ فَقَالَ أَفِي الْقَوْمِ مُحَمَّدٌ فَقَالَ \" لاَ تُجِيبُوهُ \". فَقَالَ أَفِي الْقَوْمِ ابْنُ أَبِي قُحَافَةَ قَالَ \" لاَ تُجِيبُوهُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4043، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4043, that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4043، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4043, menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 4043, mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 4043 numaralı hadis, vasiyet veya son miras hakkında bilgi vermektedir. Bu hadis, vasiyetler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4043, menyebutkan tentang wasiat atau surat wasiat terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam suci, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
