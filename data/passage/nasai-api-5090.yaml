label: { ar: "سنن النسائي 5090 — ما كان يُكره، ما لا بأس به", en: "Sunan al-Nasa'i 5090 — what used to be disliked; what is said to be no harm", ur: "سنن نسائی 5090 — جو ناپسند کیا جاتا تھا، جس میں کوئی مضائقہ نہیں", fr: "Sunan al-Nasa'i 5090 — ce qui était réprouvé ; ce qui est dit sans inconvénient", es: "Sunan al-Nasa'i 5090 — lo que se reprobaba; lo que se dice que no tiene inconveniente", tr: "Sunan an-Nasa'i 5090 — Hoş karşılanmayan ve izin verilen şeyler", id: "Sunan an-Nasa'i 5090 — Apa yang tidak disukai, apa yang diperbolehkan" }
text: "أَخْبَرَنِي إِبْرَاهِيمُ بْنُ يَعْقُوبَ، قَالَ حَدَّثَنَا أَبُو زَيْدٍ، سَعِيدُ بْنُ الرَّبِيعِ قَالَ حَدَّثَنَا عَلِيُّ بْنُ الْمُبَارَكِ، قَالَ سَمِعْتُ كَرِيمَةَ، قَالَتْ سَمِعْتُ عَائِشَةَ، سَأَلَتْهَا امْرَأَةٌ عَنِ الْخِضَابِ، بِالْحِنَّاءِ قَالَتْ لاَ بَأْسَ بِهِ وَلَكِنْ أَكْرَهُ هَذَا لأَنَّ حِبِّي كَانَ يَكْرَهُ رِيحَهُ. تَعْنِي النَّبِيَّ."
summary:
  ar: "حديث في سنن النسائي، رقم 5090، يرد فيه ذكر ما كان يُكره، وما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 5090 (The Book of Adornment), whose wording mentions what used to be disliked, what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 5090، جس کے الفاظ میں جو ناپسند کیا جاتا تھا، جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 5090, dont le texte mentionne ce qui était réprouvé, ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 5090, cuyo texto menciona lo que se reprobaba, lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de 5090 numaralı hadis, mekruh olan ve helal olan şeylerden bahsetmektedir. Farz, itaat, müstehap, mekruh, haram ve küçük günahları derleyen bu eser, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5090, menyebutkan apa yang tidak disukai dan apa yang diperbolehkan. Penyusun kitab tentang amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
