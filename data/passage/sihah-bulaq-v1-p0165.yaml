text: |-
  الياء فى الجوسية نسبة الى
  نعرّب بجوس كان قد وضع دينا
  ودعاله قديما قبل الخليل واما
  زرادثت الذى بعد الخليل فائما
  جدده وأظهره كما يستفادأ كثره
  من القاموس وحاشيته قاله
  ٤٧٦
  ⁦(باب السين)⁩
  الافعال نحو كان واخواتها التى ترفع الاسماء وتنصب الاخبارالا أن الباء تدخل فى خبرها
  نحو مادون اخواتها تقول ليس زيد بمنطلق قالبا لتعدية الفسعل وتأكيد النفى ولك
  أن لا تدخلها لان المؤكد يستغنى عنه ولان من الافعال ما يتهدى مرّة بحرف جرّ ومرة بغير
  حرف نحواشتقتك واشتقت اليك ولا يجوزتقديم خبرها عليها كما جاز فى اخواتها تقول
  محسنا كان زيد ولا يجوز أن تقول محسناليس زيد وقديستغنى جهاتقول جاءنى القوم ليس
  زيدا كما تقول الازيد اتضمراسمهافيها وتنصب خبرهايها كأنلا قلت ليس الجاتى زيداولك
  أن تقول جاءالة وم ليسك الا أنّ المضمر المنفصل ههنا أحسين كما قال الشاعر
  ليت هذا الليل شهر • لا نرى فيه غريبا
  ليس اياى وايا لا ولا نخشى رقيبا
  ولم يقل ليسنى وليسك وهوجائز الا أن المنفصل أجود ورجل أليس أى شجاع بين الليس من
  قوم ليس وقال الفتراء الأليس البعير يحمل كل ماحل
  صل المم) ( أس مأست بينهم مأسا أى أفسدت قال الكميت
  أسوت دماء حاول القوم سفكها * ولايعدم الآسون فى الفىّ مانسا
  ⁦( مجس)⁩ البوسية نحلة والجوسى منسوب البها والجم-ع الجوس قال أبو على النحوى
  | المجوس واليهوداغاعرف على حدّيهودى ويهودومجوسى ومجوس فجمع على قياس شعيرة
  وشعير ثم عرف الجمع بالالف واللام ولولاذلك لم يجزد خول الالف واللام عليه-مالانه-ما
  معرفتان قال وه مامؤنشان فجرتا فى كلامهم مجرى القبيلتين ولم يجعلا كالحيين فى باب
  الصرف وأنشد لامرئ القيس أحار أريك برقاهب وهنا • كتارمجوس تستعراستعارا
  وقد تجس الرجل صار منه-م ومجسه غيره وفى الجديث فأبواه يمحسانه . ⁦(مرس)⁩ المرسة
  الحبل والجمع مرس وجع المرس أمراس والمرس أيضامصدرة ولك مرست البكرة بالكسم
  تمرس مرساوهى بكرة مروس اذا كان ينشب حبلها بينها وبين القعو قال الشاعر
  درناودارت بكرة نخيس * لاضيقة الجرى ولامروس
  ويقال أيضامرس الحبل اذا وقع فى أحدجاني البكرة يمرس مرسا فاذا أعدته الى
  مجراه قلت أمرسته قال الراجز
  بئس مقام المشيخ أمرس أمرس * اماعلى قعووا ما اقعنسس
  وكذلك اذا أنشبته بين البكرة والقعوقلت أمرسته وهومن الاضداد عن يعقوب قال
  الكميت
  ستأتيكم بمترعة ذعافا * حبالكم التى لاتمرسونا
  أى لا تنشبوخ افى البكرة والقعوويقال للقوم هم على مرس واحد بكسر الراءوذلك
  اذا استوت اخلاقهم والمراس الممارسة والمعالجة ورجل مرس شديد العلاج بين المرس
  ومرست التمروغيره فى الماءاذا أنقعته ومر ثته بيدلا وحرس الصبى "إصبهه يمرسه لغة
  فى مرنه أولشغة ومرست يدى بالمنسديل أى مسحت عن ابن السكيت وتمرّس به وامترس به
  أى احتك به يقال امترست الالسن فى الخصومات أى لاجت قال أيوذؤيب يصف صائدا
  وأنّ حر الوحش قربت منه بنزلة من يحتك بالشئ فقال
  نكريه
