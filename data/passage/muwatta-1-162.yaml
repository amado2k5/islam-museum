summary:
  ar: "قول لمالك يرويه يحيى في باب المستحاضة: الأمر عند أهل المدينة أن المستحاضة إذا صلت فلزوجها أن يصيبها، وكذلك النفساء إذا بلغت أقصى ما يمسك النساء الدم ثم رأت الدم بعد ذلك، فإنها بمنزلة المستحاضة ويصيبها زوجها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.108}"
