label: { ar: "الموطأ 162 — مالك: المستحاضة والنفساء بعد أقصى الدم يصيبهما زوجاهما", en: "Muwatta 162", es: "Muwatta 162", fr: "Muwatta 162", ur: "موطا 162", tr: "Al-Muwatta 162 — Malik: Uzun süreli kanama veya lohusalık kanaması yaşayan bir kadın, en fazla kanama gerçekleştikten sonra kocasıyla cinsel ilişkiye girebilir." }
summary:
  ar: "قول لمالك يرويه يحيى في باب المستحاضة: الأمر عند أهل المدينة أن المستحاضة إذا صلت فلزوجها أن يصيبها، وكذلك النفساء إذا بلغت أقصى ما يمسك النساء الدم ثم رأت الدم بعد ذلك، فإنها بمنزلة المستحاضة ويصيبها زوجها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.108}"
  tr: "Yahya'nın düzensiz kanama yaşayan kadınlar hakkındaki bölümünde Malik'e atfedilen bir ifade şöyledir: Medine halkı arasında yaygın olan uygulama şudur: Düzensiz kanama yaşayan bir kadın namaz kılarsa, kocası onunla cinsel ilişkiye girebilir. Benzer şekilde, lohusalık kanaması yaşayan bir kadın, kanamanın durması için belirlenen azami süreye ulaştıktan sonra tekrar kanama görürse, düzensiz kanama yaşıyor sayılır ve kocası onunla cinsel ilişkiye girebilir. Editör, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.108}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dalam bab tentang wanita yang mengalami pendarahan tidak teratur: Kebiasaan di kalangan penduduk Madinah adalah jika seorang wanita yang mengalami pendarahan tidak teratur shalat, suaminya boleh berhubungan intim dengannya. Demikian pula, jika seorang wanita yang mengalami pendarahan pascapersalinan mencapai durasi maksimal bagi wanita untuk menghentikan pendarahan dan kemudian melihat darah lagi, ia dianggap mengalami pendarahan tidak teratur, dan suaminya boleh berhubungan intim dengannya. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.108}"
