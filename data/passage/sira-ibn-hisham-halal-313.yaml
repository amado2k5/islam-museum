text: "… فَزَوَّجُوهُ بِئْتَ سعيد بن العاص وفارقها، ولم يَكُنْ دخل بها، فأَخرجها اللّٰه من يده كرامةً لها وهواناً له، وخَلَفَ عليها عثمان بن عفان بَعْدهُ. وكان رسولُ اللّٰه ل لا يُجِلُّ بمكَّةَ ولا يُحَرِّمُ مغلوباً على أمره، وكان الإسلام قد فرَّقَ …"
