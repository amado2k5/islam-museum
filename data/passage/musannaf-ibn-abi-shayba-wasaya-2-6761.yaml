text: "… عثمان بن الأسود عن مجاهد قال: مَنْ صنع في ماله شيئاً لم ينفذه حتى يحضره الموت فهو في سبيله - الرجل يوصي بالوصية ويقول: اشهدوا على ما فيها - حدثنا ابن عُلَيَّة عن يونس قال: جاء رجل إلى الحسن بوصية …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 6761، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 6761, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 6761 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
