text: "… الأشجعي، أبو سلمة. أسلم في وقعة الخندق. وهو الذي أوقع الخلف بين قُرَيظة وغَطَفان وقُرَيش يوم الخندق، وخَذَّل بعضهم عن بعض، وأرسل اللّٰه عليهم الريح والبرد والجنود، وهم الملائكة، فصرف كيد الكفار عن النبي علة والمسلمين. ولما أسلم واستأذن النبي …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1201، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1201, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1201 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 1201, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 1201), mentionnant des nations, des religions et des peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est référencé sur Umam Browser."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 1, s. 1201'deki, Müslüman olmayan milletleri, dinleri ve halkları anlatan bölümünden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar Tarayıcısı tarafından derlenmiştir."
