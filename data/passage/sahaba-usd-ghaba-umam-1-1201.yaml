text: "… الأشجعي، أبو سلمة. أسلم في وقعة الخندق. وهو الذي أوقع الخلف بين قُرَيظة وغَطَفان وقُرَيش يوم الخندق، وخَذَّل بعضهم عن بعض، وأرسل اللّٰه عليهم الريح والبرد والجنود، وهم الملائكة، فصرف كيد الكفار عن النبي علة والمسلمين. ولما أسلم واستأذن النبي …"
