label: { ar: "نوادر جحا الكبرى، ص 144 — «لا تقس هذا على الناس فإنه إذا قال فعل»", en: "Nawadir Juha al-Kubra, p. 144 — 'Do Not Judge This by People, for When He Says, He Does'", ur: "نوادر جحا الکبریٰ، ص 144 — «اسے لوگوں پر قیاس نہ کرو، یہ جو کہتا ہے کر دیتا ہے»", fr: "Nawadir Juha al-Kubra, p. 144 — « Ne juge pas cela d'après les gens, car lui, quand il dit, il fait »", es: "Nawadir Juha al-Kubra, p. 144 — «No lo midas con los demás, pues cuando él dice, hace»" }
text: "… لا تقِسْ هذا على الناس فإنه إذا قال فعل سافر الشيخ إلى بلدة، فقال له أحدُ أهلها: لقد أحببْتُك كثيراً يا سيّدي، نتفضّل، نتناول خبزاً ومِلْحاً، ونتسامرُ مليّاً. فلبّى الشيخ الدعوة بكلِّ سرور، وذهب إلى داره، وبعد مدة قليلة وضعوا …"
summary:
  ar: "دعا مضيف جحا وقدم خبزاً وملحاً فقط، فتسول متسول عند الباب فهدده المضيف بكسر ظهره، فأخرج جحا رأسه وقال إن المضيف رجل يفعل ما يقول. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  en: "A host invites Juha and serves bread and salt only. A beggar at the door begs, and the host threatens to break his back, and Juha puts his head out and says the host is a man who does what he says. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  ur: "ایک میزبان جحا کو بلاتا ہے اور صرف روٹی اور نمک پیش کرتا ہے۔ دروازے پر ایک فقیر مانگتا ہے تو میزبان اس کی کمر توڑنے کی دھمکی دیتا ہے، اور جحا سر نکال کر کہتا ہے کہ یہ میزبان وہ آدمی ہے جو جو کہتا ہے کر دیتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  fr: "Un hôte invite Juha et ne sert que du pain et du sel. Un mendiant mendie à la porte, et l'hôte menace de lui briser le dos, et Juha passe la tête dehors et dit que l'hôte est un homme qui fait ce qu'il dit. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  es: "Un anfitrión invita a Juha y solo sirve pan y sal. Un mendigo pide a la puerta, y el anfitrión amenaza con romperle la espalda, y Juha asoma la cabeza y dice que el anfitrión es un hombre que hace lo que dice. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
