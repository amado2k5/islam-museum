  tr: "Ebu Nu'aym'ın Hilyat al-Awliya' adlı eserinin resimli 1. cildinin 205. sayfasından, tıp, hekim ve tedaviye dair bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
