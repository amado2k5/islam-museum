text: "… ثنا عبد اللّٰه بن أحمد بن حنبل حدثنى أبى ثا عبد الصمد بن حسان ثنا السرى بن بحي عن مالك بن دينار أن سلمان كتب إلى أبى الدرداء : إنه بلغفى أنك جلست طبيبا تداوى الناس، فانظر أن تقتل مسلما …"
summary:
