  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 205, that mentions medicine and the physician, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 205 کا اقتباس جس میں طب اور طبیب، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
