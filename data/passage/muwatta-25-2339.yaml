label: { ar: "الموطأ 2339 — مالك: عتق المكاتب عبده أو صدقته قبل علم السيد", en: "Muwatta 2339" }
summary:
  ar: "قال مالك في مكاتب يعتق عبدا له أو يتصدق ببعض ماله، ولم يعلم سيده حتى عتق المكاتب: ينفذ ذلك عليه، وليس له أن يرجع فيه. فإن علم السيد قبل أن يعتق المكاتب فرده ولم يجزه، فإنه إن عتق المكاتب والمال في يده لم يلزمه أن يعتق ذلك العبد ولا أن يخرج تلك الصدقة، إلا أن يفعل ذلك طائعا من عند نفسه. {cite:muwatta-maruf-1997 p.364}"
