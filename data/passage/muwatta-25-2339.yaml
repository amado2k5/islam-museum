label: { ar: "الموطأ 2339 — مالك: عتق المكاتب عبده أو صدقته قبل علم السيد", en: "Muwatta 2339", es: "Muwatta 2339", fr: "Muwatta 2339", ur: "موطا 2339", tr: "Al-Muwatta 2339 — Malik: Sözleşmeli kölenin azat edilmesi veya efendisinin bilgisi dışında sadaka olarak verilmesi.", id: "Al-Muwatta 2339 — Malik: Pembebasan seorang budak berdasarkan perjanjian atau pemberiannya sebagai sedekah tanpa sepengetahuan tuannya" }
summary:
  ar: "قال مالك في مكاتب يعتق عبدا له أو يتصدق ببعض ماله، ولم يعلم سيده حتى عتق المكاتب: ينفذ ذلك عليه، وليس له أن يرجع فيه. فإن علم السيد قبل أن يعتق المكاتب فرده ولم يجزه، فإنه إن عتق المكاتب والمال في يده لم يلزمه أن يعتق ذلك العبد ولا أن يخرج تلك الصدقة، إلا أن يفعل ذلك طائعا من عند نفسه. {cite:muwatta-maruf-1997 p.364}"
  tr: "Malik, efendisinin bilgisi dışında, kölesini azat eden veya parasının bir kısmını sadaka olarak veren bir köle hakkında şöyle demiştir: Bu, köle için bağlayıcıdır ve geri alma hakkı yoktur. Eğer efendi, kölenin azatından önce bunu biliyor ve reddediyorsa, para efendinin elindeyken köle azat edilirse, efendi kendi isteğiyle yapmadığı sürece o köleyi azat etmek veya sadaka vermek zorunda değildir. {cite:muwatta-maruf-1997 s.364}"
  id: "Malik berkata mengenai seorang budak yang membebaskan budaknya atau memberikan sebagian uangnya untuk sedekah, tanpa sepengetahuan tuannya sampai setelah budak itu dibebaskan: hal ini mengikat tuannya, dan ia tidak berhak untuk menariknya kembali. Jika tuannya mengetahui sebelum budak itu dibebaskan dan menolaknya, maka jika budak itu dibebaskan sementara uang itu masih ada di tangannya, ia tidak berkewajiban untuk membebaskan budak itu atau memberikan sedekah tersebut, kecuali jika ia melakukannya dengan sukarela atas kemauannya sendiri. {cite:muwatta-maruf-1997 p.364}"
