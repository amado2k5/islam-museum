text: "… المهاجرين، حتى كان بين اولئك الرجال من المهاجرين و الرجال من الأنصار شىء من القتال. ثم حجز بينهم، فانكفاً كل منافق أو رجل فى قلبه مرض الى عبد الله بن أُبى بن سلول. فقال: قد كنت ترجى وتدفع فأصبحت لا …"
summary:
