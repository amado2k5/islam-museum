label: { ar: "الموطأ 1292 — يحيى بن سعيد: أبو بكر الصديق يوصي يزيد بن أبي سفيان بعشر: لا تقتلن امرأة ولا صبيا ولا تقطع شجرا مثمرا", en: "Muwatta 1292", es: "Muwatta 1292", fr: "Muwatta 1292", ur: "موطا 1292", tr: "El-Muvatta 1292 — Yahya bin Said: Ebu Bekir Sıddık, Yezid bin Ebu Sufyan'a on şey öğütler: Kadın veya çocuk öldürme ve meyve veren ağaç kesme.", id: "Al-Muwatta 1292 — Yahya bin Saeed: Abu Bakr Al-Siddiq menasihati Yazid bin Abi Sufyan dengan sepuluh hal: Jangan membunuh wanita atau anak kecil, dan jangan menebang pohon yang berbuah." }
text: "لَا تَقْتُلنَّ امْرأةٌ، وَلاَ صَبِيًّا"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا بكر الصديق بعث جيوشا إلى الشام، فخرج يمشي مع يزيد بن أبي سفيان، وكان أميرا على ربع من تلك الأرباع. فزعموا أن يزيد قال له إما أن تركب وإما أن أنزل، فقال أبو بكر ما أنت بنازل وما أنا براكب، إني أحتسب خطاي هذه في سبيل الله. ثم أوصاه بعشر، منها لا تقتلن امرأة ولا صبيا ولا كبيرا هرما، ولا تقطعن شجرا مثمرا، ولا تخربن عامرا، ولا تعقرن شاة ولا بعيرا إلا لمأكلة، ولا تحرقن نحلا، ولا تغلل، ولا تجبن. {cite:muwatta-maruf-1997 p.577}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ebu Bekir es-Siddik'in Suriye'ye ordular gönderdiğini ve bu ordulardan birinin komutanı olan Yezid ibn Ebu Sufyan ile birlikte yürüdüğünü anlatır. Yezid'in ona, \"Ya sen ata binersin ya da ben inerim\" dediği rivayet edilir. Ebu Bekir, \"Sen inmeyeceksin, ben de binmeyeceğim. Ben bu adımlarımı Allah yolunda attığımı düşünüyorum\" diye cevap verdi. Sonra ona on talimat verdi; bunlar arasında şunlar vardı: Kadın, çocuk veya yaşlı öldürme; meyve veren ağaç kesme; yerleşim yerini tahrip etme; yiyecek için dışında koyun veya deve kesme; arı kovanlarını yakma; hırsızlık yapma ve korkak olma. {cite:muwatta-maruf-1997 s.577}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Abu Bakr al-Siddiq mengirim pasukan ke Suriah, dan ia berjalan-jalan dengan Yazid ibn Abi Sufyan, yang merupakan komandan salah satu wilayah tersebut. Dikatakan bahwa Yazid berkata kepadanya, \"Kau naik kuda atau aku akan turun.\" Abu Bakr menjawab, \"Kau tidak akan turun, dan aku tidak akan naik kuda. Aku menganggap langkah-langkahku ini berada di jalan Allah.\" Kemudian ia memberinya sepuluh instruksi, di antaranya: Jangan membunuh wanita, anak-anak, atau orang tua; jangan menebang pohon yang berbuah; jangan menghancurkan daerah yang berpenduduk; jangan menyembelih domba atau unta kecuali untuk makanan; jangan membakar sarang lebah; jangan mencuri; dan jangan menjadi pengecut. {cite:muwatta-maruf-1997 p.577}"
