label: { ar: "الموطأ 1292 — يحيى بن سعيد: أبو بكر الصديق يوصي يزيد بن أبي سفيان بعشر: لا تقتلن امرأة ولا صبيا ولا تقطع شجرا مثمرا", en: "Muwatta 1292" }
text: "لَا تَقْتُلنَّ امْرأةٌ، وَلاَ صَبِيًّا"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن أبا بكر الصديق بعث جيوشا إلى الشام، فخرج يمشي مع يزيد بن أبي سفيان، وكان أميرا على ربع من تلك الأرباع. فزعموا أن يزيد قال له إما أن تركب وإما أن أنزل، فقال أبو بكر ما أنت بنازل وما أنا براكب، إني أحتسب خطاي هذه في سبيل الله. ثم أوصاه بعشر، منها لا تقتلن امرأة ولا صبيا ولا كبيرا هرما، ولا تقطعن شجرا مثمرا، ولا تخربن عامرا، ولا تعقرن شاة ولا بعيرا إلا لمأكلة، ولا تحرقن نحلا، ولا تغلل، ولا تجبن. {cite:muwatta-maruf-1997 p.577}"
