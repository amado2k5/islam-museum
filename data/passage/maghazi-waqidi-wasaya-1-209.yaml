text: "… عايه وسلَّم على المنبر. فحمد اللّٰه وأَثنى عليه. ثم قال : أَيِّهَا النَّاس. إِنى رأَيت فى منامى رؤيا ؛ رأَيت كأُنّى فى دِرْعِ حصينة. ورأيت كأَنَّ سيفى ذا الفَقار انقهم من عند ظُبته. ورأَيت بقرًا تُذبَح. ورأَيت كأَنى مُردِفْ كبشاً. …"
