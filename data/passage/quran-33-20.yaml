text: "يَحْسَبُونَ ٱلْأَحْزَابَ لَمْ يَذْهَبُوا۟ ۖ وَإِن يَأْتِ ٱلْأَحْزَابُ يَوَدُّوا۟ لَوْ أَنَّهُم بَادُونَ فِى ٱلْأَعْرَابِ يَسْـَٔلُونَ عَنْ أَنۢبَآئِكُمْ ۖ وَلَوْ كَانُوا۟ فِيكُم مَّا قَـٰتَلُوٓا۟ إِلَّا قَلِيلًا"
text_search: "يحسبون الأحزاب لم يذهبوا ۖ وإن يأت الأحزاب يودوا لو أنهم بادون في الأعراب يسألون عن أنبائكم ۖ ولو كانوا فيكم ما قاتلوا إلا قليلا"
translations:
  en: { text: "They hold that the clans have not retired (for good); and if the clans should advance (again), they would fain be in the desert with the wandering Arabs, asking for the news of you; and if they were among you, they would not give battle, save a little.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(خوف کے سبب) خیال کرتے ہیں کہ فوجیں نہیں گئیں۔ اور اگر لشکر آجائیں تو تمنا کریں کہ (کاش) گنواروں میں جا رہیں (اور) تمہاری خبر پوچھا کریں۔ اور اگر تمہارے درمیان ہوں تو لڑائی نہ کریں مگر کم", translator: "Fateh Muhammad Jalandhari", license: PD }
