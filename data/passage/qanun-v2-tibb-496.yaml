text: "… في كلام كلّي في معالجات الكبد إن الكبد يجب فيها من حفظ الصحة بالشبيه، ودفع المرض بالضدّ، وفي تدبير مداواة الأورام والقروح، وآفات المقدار، وفي تفتيح السدد وغير ذلك ما يجب لأمراض وأجود الأوقات في سقي الأدوية. في سائر الأعضاء …"
summary:
