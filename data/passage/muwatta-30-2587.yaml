label: { ar: "الموطأ 2587 — مالك: كل وارث يحلف بقدر ميراثه من الخمسين يمينا لاستحقاق حقه من الدية", en: "Muwatta 2587" }
summary:
  ar: "قال مالك: إذا قام بعض ورثة المقتول خطأ يريد أن يأخذ من الدية بقدر حقه منها، وأصحابه غيب، لم يأخذ ذلك ولم يستحق من الدية شيئا، قل أو كثر، دون أن يستكمل القسامة، فيحلف خمسين يمينا. فإذا حلف خمسين يمينا استحق حصته من الدية؛ لأن الدم لا يثبت إلا بخمسين يمينا، ولا تثبت الدية حتى يثبت الدم. فإن جاء بعد ذلك أحد من الورثة حلف من الخمسين يمينا بقدر ميراثه، وأخذ حقه، حتى يستكمل الورثة حقوقهم. وإن كان بعض الورثة غائبا أو صبيا لم يبلغ الحلم، حلف الذين حضروا خمسين يمينا، فإن جاء الغائب بعد ذلك حلف، أو بلغ الصبي الحلم حلف، يحلفون على قدر حقوقهم من الدية. قال يحيى: قال مالك: وهذا أحسن ما سمعت. {cite:muwatta-maruf-1997 p.458}"
