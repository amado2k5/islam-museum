label: { ar: "الموطأ 2587 — مالك: كل وارث يحلف بقدر ميراثه من الخمسين يمينا لاستحقاق حقه من الدية", en: "Muwatta 2587", es: "Muwatta 2587", fr: "Muwatta 2587", ur: "موطا 2587", tr: "Al-Muwatta 2587 — Malik: Her mirasçı, kan parasından payına hak kazanmak için elli yeminden, mirastaki payına denk gelen bir yemin eder.", id: "Al-Muwatta 2587 — Malik: Setiap ahli waris bersumpah sebesar bagian warisannya dari lima puluh sumpah untuk berhak atas bagiannya dari uang darah." }
summary:
  ar: "قال مالك: إذا قام بعض ورثة المقتول خطأ يريد أن يأخذ من الدية بقدر حقه منها، وأصحابه غيب، لم يأخذ ذلك ولم يستحق من الدية شيئا، قل أو كثر، دون أن يستكمل القسامة، فيحلف خمسين يمينا. فإذا حلف خمسين يمينا استحق حصته من الدية؛ لأن الدم لا يثبت إلا بخمسين يمينا، ولا تثبت الدية حتى يثبت الدم. فإن جاء بعد ذلك أحد من الورثة حلف من الخمسين يمينا بقدر ميراثه، وأخذ حقه، حتى يستكمل الورثة حقوقهم. وإن كان بعض الورثة غائبا أو صبيا لم يبلغ الحلم، حلف الذين حضروا خمسين يمينا، فإن جاء الغائب بعد ذلك حلف، أو بلغ الصبي الحلم حلف، يحلفون على قدر حقوقهم من الدية. قال يحيى: قال مالك: وهذا أحسن ما سمعت. {cite:muwatta-maruf-1997 p.458}"
  tr: "Malik şöyle dedi: Kasıtsızca öldürülen birinin mirasçılarından bazıları, diğer mirasçılar yokken kan parasından paylarını talep etmek isterlerse, elli yemin ederek yemin işlemini tamamlayana kadar, ne büyük ne de küçük olsun, kan parasından paylarını talep edemezler ve hiçbir hakka sahip değillerdir. Elli yemin ettikten sonra, kan parasından paylarını almaya hak kazanırlar, çünkü kan parası ancak elli yeminle belirlenir ve kan parası belirlenene kadar geçerli sayılmaz. Mirasçılardan biri öne çıkarsa, elli yeminden miras payına orantılı bir miktar yemin eder ve payını alır, ta ki tüm mirasçılar paylarını alana kadar. Mirasçılardan bazıları yoksa veya henüz ergenliğe ulaşmamış küçüklerse, hazır bulunanlar elli yemin ederler. Yok olan mirasçı öne çıkarsa veya küçük olan ergenliğe ulaşırsa, her biri kan parasındaki payına göre yemin eder. Yahya dedi ki: Malik dedi ki: Bu şimdiye kadar duyduğum en iyi görüş. {cite:muwatta-maruf-1997 s.458}"
  id: "Malik berkata: Jika sebagian ahli waris seseorang yang terbunuh tanpa sengaja ingin mengklaim bagian mereka dari uang darah, sementara ahli waris lainnya tidak hadir, mereka tidak dapat mengklaimnya, dan mereka juga tidak berhak atas uang darah tersebut, baik besar maupun kecil, sampai mereka menyelesaikan prosedur pengambilan sumpah dengan mengucapkan lima puluh sumpah. Setelah mereka mengucapkan lima puluh sumpah, mereka berhak atas bagian mereka dari uang darah tersebut, karena uang darah tersebut tidak ditetapkan kecuali dengan lima puluh sumpah, dan uang darah tersebut tidak ditetapkan sampai uang darah tersebut ditetapkan. Jika salah satu ahli waris kemudian muncul, mereka mengucapkan sumpah dari lima puluh sumpah tersebut sejumlah yang proporsional dengan warisan mereka dan mengambil bagian mereka, sampai semua ahli waris telah menerima hak mereka. Jika sebagian ahli waris tidak hadir atau masih di bawah umur yang belum mencapai pubertas, mereka yang hadir mengucapkan lima puluh sumpah. Jika ahli waris yang tidak hadir kemudian muncul, mereka mengucapkan sumpah, atau jika anak di bawah umur tersebut mencapai pubertas, mereka mengucapkan sumpah, masing-masing mengucapkan sumpah sesuai dengan bagian mereka dari uang darah tersebut. Yahya berkata: Malik berkata: Ini adalah pendapat terbaik yang pernah saya dengar. {mengutip:muwatta-maruf-1997 hal.458}"
