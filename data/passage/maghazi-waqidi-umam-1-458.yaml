text: "… ؟ ما أَنت له بكفء ! أَما واللهِ يا ابن اليهود، لتُولِّينَّ قُرَيشٌ إن شاء اللّٰه مُنهزمةً وتتركك فى عُقر دارك، فنسير إليك فتنزل من جُحْرك هذا على حكمنا. وإنك لتعلم النَّضير ؛ كاذوا أَعزَّ منك وأعظم بهذه البلدة، دِيَتك …"
