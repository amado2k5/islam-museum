label: { ar: "الموطأ 774 — أبو سعيد: كنا نخرج زكاة الفطر صاعاً من طعام أو شعير أو تمر أو أقط أو زبيب بصاع النبي", en: "Muwatta 774" }
text: "كنا نخرج زكاة الفطر صاعاً من طعام، أو صاعاً من شعير، أو صاعاً من تمر، أو صاعاً من أقط، أو صاعاً من زبيب، وذلك بصاع النبي"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عياض بن عبد الله بن سعد بن أبي سرح العامري، أنه سمع أبا سعيد الخدري يقول: كنا نخرج زكاة الفطر صاعاً من طعام أو صاعاً من شعير أو صاعاً من تمر أو صاعاً من أقط أو صاعاً من زبيب، وذلك بصاع النبي. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وخالد بن مخلد عند الدارمي، والقعنبي، وابن وهب عند الطحاوي، والتنيسي عند البخاري (1506)، وابن القاسم، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم (3/69)، وينقل عن ابن عبد البر (التمهيد 4/127) أن رواة الموطأ لم يقولوا فيه «على عهد رسول الله» وأن ذلك صح عن أبي سعيد من وجوه، ويضيف أن سفيان رواه عن زيد بن أسلم بلفظ «إذ كان فينا رسول الله» وأن الترمذي (673) قال: حديث صحيح. {cite:muwatta-maruf-1997 p.382} {cite:muwatta-maruf-1997 p.383}"
