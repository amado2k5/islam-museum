label: { ar: "الموطأ 774 — أبو سعيد: كنا نخرج زكاة الفطر صاعاً من طعام أو شعير أو تمر أو أقط أو زبيب بصاع النبي", en: "Muwatta 774", es: "Muwatta 774", fr: "Muwatta 774", ur: "موطا 774", tr: "El-Muvatta 774 — Ebu Said: Biz, Peygamberimizin sa'sını kullanarak, bir sa'lık yiyecek, arpa, hurma, kuru yoğurt veya kuru üzüm şeklinde Fitre zekâtı verirdik.", id: "Al-Muwatta 774 — Abu Saeed: Kami biasa memberikan Zakat al-Fitr berupa satu sa’ makanan, jelai, kurma, yogurt kering, atau kismis, menggunakan sa’ Nabi." }
text: "كنا نخرج زكاة الفطر صاعاً من طعام، أو صاعاً من شعير، أو صاعاً من تمر، أو صاعاً من أقط، أو صاعاً من زبيب، وذلك بصاع النبي"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عياض بن عبد الله بن سعد بن أبي سرح العامري، أنه سمع أبا سعيد الخدري يقول: كنا نخرج زكاة الفطر صاعاً من طعام أو صاعاً من شعير أو صاعاً من تمر أو صاعاً من أقط أو صاعاً من زبيب، وذلك بصاع النبي. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وخالد بن مخلد عند الدارمي، والقعنبي، وابن وهب عند الطحاوي، والتنيسي عند البخاري (1506)، وابن القاسم، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم (3/69)، وينقل عن ابن عبد البر ⁦(التمهيد 4/127)⁩ أن رواة الموطأ لم يقولوا فيه «على عهد رسول الله» وأن ذلك صح عن أبي سعيد من وجوه، ويضيف أن سفيان رواه عن زيد بن أسلم بلفظ «إذ كان فينا رسول الله» وأن الترمذي (673) قال: حديث صحيح. {cite:muwatta-maruf-1997 p.382} {cite:muwatta-maruf-1997 p.383}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da İyad ibn Abdullah ibn Saad ibn Abi Sarh al-Amiri'den rivayetle, Ebu Said al-Khudri'nin şöyle dediğini işitmiştir: \"Biz, zekât-ı fitr olarak bir sa'lık yiyecek, bir sa'lık arpa, bir sa'lık hurma, bir sa'lık kuru yoğurt veya bir sa'lık kuru üzüm verirdik ve bu, Peygamberimizin sa'sıydı.\" Araştırmacı, bunun Malik'ten Ebu Musab tarafından, onun isnadından da el-Baghawi tarafından, el-Darimi'ye göre Halid ibn Makhlad tarafından, el-Ka'nabi tarafından, el-Tahavi'ye göre İbn Vahb tarafından, el-Buhari'ye (1506) göre el-Tunisi tarafından, Müslim'e (3/69) göre İbn al-Kasım tarafından, el-Şafiî tarafından ve Yahya ibn Yahya al-Naysaburi tarafından rivayet edildiğini belirtmektedir. İbn Abdül-Barr'ın (el-Tamhid 4/127) şöyle dediğini aktarıyor: el-Muvatta'nın ravileri \"Allah'ın Resulü zamanında\" ifadesini kullanmamışlardır ve bu, Ebu Said'den çeşitli rivayet zincirleriyle sahih olarak nakledilmiştir. Ayrıca Sufyan'ın bunu Zeyd ibn Aslam'dan \"Allah'ın Resulü aramızda iken\" ifadesiyle naklettiğini ve Tirmizi'nin (673) \"Bu sahih bir hadistir\" dediğini ekliyor. {cite:muwatta-maruf-1997 s.382} {cite:muwatta-maruf-1997 s.383}"
  id: "Malik meriwayatkan hadits ini dari Zayd ibn Aslam, yang juga meriwayatkan dari Iyad ibn Abdullah ibn Saad ibn Abi Sarh al-Amiri, yang mendengar Abu Saeed al-Khudri berkata: “Kami biasa memberikan satu sa’ makanan, atau satu sa’ jelai, atau satu sa’ kurma, atau satu sa’ yogurt kering, atau satu sa’ kismis sebagai Zakat al-Fitr, dan itulah satu sa’ yang diberikan Nabi.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, dan dari sanadnya oleh al-Baghawi, dan Khalid ibn Makhlad menurut al-Darimi, dan al-Qa’nabi, dan Ibn Wahb menurut al-Tahawi, dan al-Tunisi menurut al-Bukhari (1506), dan Ibn al-Qasim, dan al-Shafi’i, dan Yahya ibn Yahya al-Naysaburi menurut Muslim (3/69). Ia mengutip Ibn Abd al-Barr (al-Tamhid 4/127) yang mengatakan bahwa para perawi al-Muwatta’ tidak menyertakan frasa “pada masa Rasulullah,” dan bahwa hadits ini diriwayatkan secara sahih dari Abu Saeed melalui beberapa sanad. Ia menambahkan bahwa Sufyan meriwayatkan hadits ini atas otoritas Zayd ibn Aslam dengan redaksi “ketika Rasulullah berada di antara kita,” dan bahwa al-Tirmidhi (673) berkata: “Ini adalah hadits yang sahih.” {cite:muwatta-maruf-1997 p.382} {cite:muwatta-maruf-1997 p.383}"
