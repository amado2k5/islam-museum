text: "… عبد الرزاق عن ابن عيينة عن أَبي حمزة الثمالي عن استدر كناه من عند م. أخرجه مسلم من طريق مالك بن مغول وحمزة الزيات عن الحكم ! : أخرج النساني من طريق أبي الزبير عن أبي علقمة عن أبي هريرة …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 853، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 853, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 853 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Abd al-Razzaq, volumen 1, pág. 853, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq (tome 1, p. 853) mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Abdülrazzak'ın Resimli Musannaf adlı eserinin 1. cildinin 853. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, hlm. 853, yang menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
