text: "ه يقول: إنها قديمة مع أن المراد محدث. قالوا: فكذلك الخلق، وهذا جواب كثير من الحنفية والحنبلية والصوفية وأهل الحديث وغيرهم. وطائفة قالت: بل الخلق لا يفتقر إلى خلق آخر، كما أن المخلوق عنده كله لا يفتقر إلى خلق، فإذا"
