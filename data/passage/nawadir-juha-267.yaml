label: { ar: "نوادر جحا الكبرى، ص 129 — «أنت تشير بأصابعك فهل أنا ذو كرامة؟»", en: "Nawadir Juha al-Kubra, p. 129 — 'You Point with Your Fingers, Do I Have Saintly Power?'", ur: "نوادر جحا الکبریٰ، ص 129 — «تم انگلیوں سے اشارہ کرتے ہو، کیا میں کرامت والا ہوں؟»", fr: "Nawadir Juha al-Kubra, p. 129 — « Tu montres du doigt, ai-je donc des dons de saint ? »", es: "Nawadir Juha al-Kubra, p. 129 — «Tú señalas con los dedos, ¿acaso tengo dones de santo?»" }
text: "… أنت تشير بأصابعك فهل أنا ذو كرامة؟ كان سائراً مع رفيق له على شاطىء البحيرة، وكان السمك يثب فوق الماء، فقال رفيقه : أنظر هذا السمك! فأخذ الشيخ ينظر إلى الزقاق. فقال له رفيقه : أنا أريك السمك وأنت تنظر …"
summary:
  ar: "كان جحا يسير مع صديق على البحيرة فأشار الصديق إلى سمك يقفز، فنظر جحا إلى اليابسة، فقال الصديق إنه يريه السمك، فقال جحا إن الصديق يشير بأطراف أصابعه فهل له كرامة ليعرف قصده. {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  en: "Walking by the lake, a friend points to fish jumping, and Juha looks at the land. The friend says he is showing him the fish, and Juha says the friend points with his fingertips, so does he have the power to know what he means? {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  ur: "جھیل کے کنارے چلتے ہوئے ایک دوست کودتی مچھلیوں کی طرف اشارہ کرتا ہے اور جحا خشکی کی طرف دیکھتا ہے۔ دوست کہتا ہے کہ وہ اسے مچھلیاں دکھا رہا ہے، تو جحا کہتا ہے کہ دوست انگلیوں کے سروں سے اشارہ کرتا ہے، تو کیا اسے یہ کرامت حاصل ہے کہ وہ اس کا مطلب جان لے؟ {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  fr: "En se promenant au bord du lac, un ami montre du doigt des poissons qui sautent, et Juha regarde la terre. L'ami dit qu'il lui montre les poissons, et Juha dit que son ami montre du bout des doigts, alors a-t-il le pouvoir de savoir ce qu'il veut dire ? {cite:juha-nawadir-kubra-djuwaydi p. 129}"
  es: "Paseando junto al lago, un amigo señala unos peces que saltan, y Juha mira hacia la tierra. El amigo dice que le está mostrando los peces, y Juha dice que el amigo señala con la punta de los dedos, así que ¿tiene él el poder de saber lo que quiere decir? {cite:juha-nawadir-kubra-djuwaydi p. 129}"
