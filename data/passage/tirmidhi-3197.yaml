label:
  ar: "الترمذي 3197 — أعددت لعبادي الصالحين ما لا عين رأت"
  en: "Tirmidhi 3197 — I have prepared for My righteous servants what no eye has seen"
  ur: "ترمذی 3197 — میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا"
text: "قال الله تعالى أعددت لعبادي الصالحين ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر وتصديق ذلك في كتاب الله عز وجل : ( فلا تعلم نفس ما أخفي لهم من قرة أعين جزاء بما كانوا يعملون …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3197: أعددت لعبادي الصالحين ما لا عين رأت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3197: I have prepared for My righteous servants what no eye has seen. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3197: میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
