label: { ar: "الموطأ 1927 — مالك: من سلف ذهبا أو ورقا في حيوان أو عرض موصوف إلى أجل، فإذا حل الأجل جاز أن يبيع المشتري تلك السلعة من البائع بعرض يعجله، إلا الطعام فلا يبيعه حتى يقبضه", en: "Muwatta 1927", es: "Muwatta 1927", fr: "Muwatta 1927", ur: "موطا 1927", tr: "El-Muvatta 1927 — Malik: Bir kimse belirli bir süre için bir hayvan veya tanımlanmış bir mal karşılığında altın veya gümüş ödünç verirse ve süre dolarsa, alıcı o malı satıcıya önceden ödenecek bir şey karşılığında satabilir; ancak yiyecek, teslim alınana kadar satılamaz.", id: "Al-Muwatta 1927 — Malik: Jika seseorang meminjamkan emas atau perak dengan imbalan hewan atau barang tertentu untuk jangka waktu tertentu, dan jangka waktu tersebut berakhir, maka pembeli boleh menjual barang tersebut kepada penjual dengan imbalan sesuatu yang dibayar di muka, kecuali makanan, yang tidak boleh dijual sampai diterima." }
summary:
  ar: "قال مالك: من سلف ذهبا أو ورقا في حيوان أو عروض، إذا كان موصوفا إلى أجل مسمى، ثم حل الأجل، فإنه لا بأس أن يبيع المشتري تلك السلعة من البائع، قبل أن يحل الأجل وبعد ما يحل، بعرض من العروض يعجله ولا يؤخره، بالغا ما بلغ ذلك العرض، إلا الطعام، فإنه لا يحل أن يبيعه حتى يقبضه. وللمشتري أن يبيع تلك السلعة من غير صاحبه الذي ابتاعها منه، بذهب أو ورق أو عرض من العروض، يقبض ذلك ولا يؤخره، لأنه إذا أخر ذلك قبح، ودخله ما يكره من الكالئ بالكالئ، والكالئ بالكالئ أن يبيع الرجل دينا له على رجل، بدين على رجل آخر. {cite:muwatta-maruf-1997 p.189}"
  tr: "Malik şöyle demiştir: Bir kimse, tanımlanmış ve belirli bir zamanda ödenmesi gereken bir hayvan veya mal karşılığında altın veya gümüş ödünç verirse ve bu süre dolarsa, alıcının bu malı, vadesinden önce veya sonra, herhangi bir değerdeki bir mal karşılığında satıcıya geri satması caizdir; ancak ödemenin derhal yapılması şartıyla. İstisna olarak, gıda maddesi, teslim alınana kadar satılamaz. Alıcı ayrıca, bu malı, asıl satıcıdan başka birine altın, gümüş veya başka bir mal karşılığında satabilir; ancak bunun için derhal teslim alması gerekir. Ödemeyi geciktirmek kınanacak bir davranıştır ve bir tür ertelenmiş ödemeyi oluşturur; bu da bir kişinin kendisine olan borcunu, başka bir kişinin kendisine olan borcu karşılığında satmasıdır. {cite:muwatta-maruf-1997 s.189}"
  id: "Malik berkata: Jika seseorang meminjamkan emas atau perak dengan imbalan hewan atau barang, asalkan barang tersebut dijelaskan dan dibayarkan pada waktu yang ditentukan, dan kemudian waktu tersebut berakhir, maka pembeli diperbolehkan untuk menjual kembali barang tersebut kepada penjual, baik sebelum maupun sesudah tanggal jatuh tempo, dengan imbalan barang dengan nilai berapa pun, asalkan pembayaran dilakukan segera. Pengecualiannya adalah makanan, yang tidak dapat dijual sampai diterima. Pembeli juga dapat menjual barang tersebut kepada orang lain selain penjual aslinya dengan imbalan emas, perak, atau barang lain, asalkan ia segera menerimanya. Menunda pembayaran dianggap tercela dan merupakan bentuk pembayaran tertunda, yaitu ketika seseorang menjual utang yang dimiliki oleh satu orang dengan utang yang dimiliki oleh orang lain. {cite:muwatta-maruf-1997 p.189}"
