label: { ar: "الموطأ 1927 — مالك: من سلف ذهبا أو ورقا في حيوان أو عرض موصوف إلى أجل، فإذا حل الأجل جاز أن يبيع المشتري تلك السلعة من البائع بعرض يعجله، إلا الطعام فلا يبيعه حتى يقبضه", en: "Muwatta 1927" }
summary:
  ar: "قال مالك: من سلف ذهبا أو ورقا في حيوان أو عروض، إذا كان موصوفا إلى أجل مسمى، ثم حل الأجل، فإنه لا بأس أن يبيع المشتري تلك السلعة من البائع، قبل أن يحل الأجل وبعد ما يحل، بعرض من العروض يعجله ولا يؤخره، بالغا ما بلغ ذلك العرض، إلا الطعام، فإنه لا يحل أن يبيعه حتى يقبضه. وللمشتري أن يبيع تلك السلعة من غير صاحبه الذي ابتاعها منه، بذهب أو ورق أو عرض من العروض، يقبض ذلك ولا يؤخره، لأنه إذا أخر ذلك قبح، ودخله ما يكره من الكالئ بالكالئ، والكالئ بالكالئ أن يبيع الرجل دينا له على رجل، بدين على رجل آخر. {cite:muwatta-maruf-1997 p.189}"
