label: { ar: "الموطأ 1315 — مالك: النفل في أول المغنم يكون باجتهاد الإمام، ولم يبلغه أن النبي نفل في كل مغازيه، وقد نفل يوم حنين", en: "Muwatta 1315", es: "Muwatta 1315", fr: "Muwatta 1315", ur: "موطا 1315", tr: "El-Muvatta 1315 — Malik: Savaş ganimetlerinin dağıtımı, savaşın başlangıcında İmam'ın takdirindedir ve Peygamber'in tüm savaşlarında ganimet dağıttığına dair bir bilgi kendisine ulaşmamıştır, ancak Huneyn günü dağıtmıştır.", id: "Al-Muwatta 1315 — Malik: Pembagian rampasan perang pada awal pengumpulan harta rampasan berada di bawah wewenang Imam, dan tidak sampai kepadanya bahwa Nabi membagikan rampasan perang di semua pertempurannya, meskipun beliau membagikannya pada hari Hunayn." }
summary:
  ar: "سئل مالك عن النفل، هل يكون في أول مغنم؟ فقال ذلك على وجه الاجتهاد من الإمام، ليس عندهم في ذلك أمر معروف موقوف إلا اجتهاد السلطان. ولم يبلغه أن رسول الله نفل في مغازيه كلها، وقد بلغه أنه نفل في بعضها يوم حنين. {cite:muwatta-maruf-1997 p.587}"
  id: "Malik ditanya tentang pembagian rampasan perang (nafl): apakah harus diberikan pada rampasan pertama? Dia menjawab bahwa ini adalah masalah kebijaksanaan penguasa, karena tidak ada preseden yang mapan dalam hal ini kecuali penilaian penguasa. Dia tidak mengetahui bahwa Nabi telah membagikan rampasan perang dalam semua kampanyenya, meskipun dia pernah mendengar bahwa beliau melakukannya dalam beberapa kampanye, seperti pada hari Hunayn. {cite:muwatta-maruf-1997 p.587}"
