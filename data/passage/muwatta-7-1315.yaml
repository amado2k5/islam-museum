label: { ar: "الموطأ 1315 — مالك: النفل في أول المغنم يكون باجتهاد الإمام، ولم يبلغه أن النبي نفل في كل مغازيه، وقد نفل يوم حنين", en: "Muwatta 1315" }
summary:
  ar: "سئل مالك عن النفل، هل يكون في أول مغنم؟ فقال ذلك على وجه الاجتهاد من الإمام، ليس عندهم في ذلك أمر معروف موقوف إلا اجتهاد السلطان. ولم يبلغه أن رسول الله نفل في مغازيه كلها، وقد بلغه أنه نفل في بعضها يوم حنين. {cite:muwatta-maruf-1997 p.587}"
