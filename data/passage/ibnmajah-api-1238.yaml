label: { ar: "سنن ابن ماجه 1238 — عيادة المريض", en: "Sunan Ibn Majah 1238 — visiting the sick", ur: "سنن ابن ماجہ 1238 — بیمار کی عیادت", es: "Sunan Ibn Majah 1238 - visitando a los enfermos", fr: "Sunan Ibn Majah 1238 — visiter les malades", tr: "Sünen İbni Mace 1238 — Hastaları Ziyaret Etmek", id: "Sunan Ibnu Majah 1238 — Menjenguk Orang Sakit" }
text: "… عَنِ الزُّهْرِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ النَّبِيَّ ـ صُرِعَ عَنْ فَرَسٍ فَجُحِشَ شِقُّهُ الأَيْمَنُ فَدَخَلْنَا نَعُودُهُ وَحَضَرَتِ الصَّلاَةُ فَصَلَّى بِنَا قَاعِدًا وَصَلَّيْنَا وَرَاءَهُ قُعُودًا فَلَمَّا قَضَى الصَّلاَةَ قَالَ \" إِنَّمَا جُعِلَ الإِمَامُ لِيُؤْتَمَّ بِهِ فَإِذَا كَبَّرَ فَكَبِّرُوا وَإِذَا رَكَعَ فَارْكَعُوا وَإِذَا قَالَ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فَقُولُوا رَبَّنَا وَلَكَ الْحَمْدُ وَإِذَا سَجَدَ فَاسْجُدُوا وَإِذَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1238، يذكر عيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1238 (Establishing the Prayer and the Sunnah Regarding Them), that mentions visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1238، جس میں بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1238 (Establecimiento de la oración y la Sunnah al respecto), menciona la visita a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 1238 (Établissement de la prière et de la Sunna à ce sujet), mentionne la visite aux malades. Le dictionnaire médical le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 1238 numaralı hadiste, hasta ziyaretinden bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1238, menyebutkan tentang mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
