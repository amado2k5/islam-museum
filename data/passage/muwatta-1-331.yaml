label: { ar: "الموطأ 331 — بلاغ: ابن عباس وعبادة والقاسم وابن عامر أوتروا بعد الفجر", en: "Muwatta 331", es: "Muwatta 331", fr: "Muwatta 331", ur: "موطا 331", tr: "El-Muvatta 331 — Rivayet: İbn Abbas, Ubadah, El-Kasım ve İbn Amir, Fecir namazından sonra vitr namazını kılmışlardır.", id: "Al-Muwatta 331 — Riwayat: Ibnu Abbas, Ubadah, Al-Qasim, dan Ibnu Amir melaksanakan salat witr setelah salat Subuh." }
summary:
  ar: "بلاغ في باب الوتر بعد الفجر: يروي مالك أنه بلغه أن عبد الله بن عباس وعبادة بن الصامت والقاسم بن محمد وعبد الله بن عامر بن ربيعة قد أوتروا بعد الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.185}"
  tr: "Fecir namazından sonra kılınan Vitr namazı ile ilgili bir rivayet: Malik, Abdullah ibn Abbas, Ubadah ibn al-Samit, al-Qasim ibn Muhammad ve Abdullah ibn Amir ibn Rabi'ah'ın Fecir namazından sonra Vitr namazı kıldıklarını işittiğini bildirmiştir. Editör, bunu Malik'ten Ebu Mus'ab ve Suwaid'in rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.185}"
  id: "Sebuah riwayat mengenai salat Witir setelah Subuh: Malik meriwayatkan bahwa ia mendengar bahwa Abdullah ibn Abbas, Ubadah ibn al-Samit, al-Qasim ibn Muhammad, dan Abdullah ibn Amir ibn Rabi'ah melaksanakan salat Witir setelah Subuh. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.185}"
