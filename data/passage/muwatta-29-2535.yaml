label: { ar: "الموطأ 2535 — ابن شهاب: عمر يسأل عن الدية فيقضي بميراث امرأة أشيم الضبابي من دية زوجها", en: "Muwatta 2535" }
summary:
  ar: "حدثني يحيى عن مالك عن ابن شهاب أن عمر بن الخطاب نشد الناس بمنى: من كان عنده علم من الدية أن يخبرني؟ فقام الضحاك بن سفيان الكلابي فقال: كتب إليّ رسول الله أن أورّث امرأة أشيم الضبابي من دية زوجها. فقال له عمر: ادخل الخباء حتى آتيك. فلما نزل أخبره الضحاك، فقضى بذلك عمر. قال ابن شهاب: وكان قتل أشيم خطأ. {cite:muwatta-maruf-1997 p.437} {cite:muwatta-maruf-1997 p.438}"
