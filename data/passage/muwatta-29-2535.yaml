label: { ar: "الموطأ 2535 — ابن شهاب: عمر يسأل عن الدية فيقضي بميراث امرأة أشيم الضبابي من دية زوجها", en: "Muwatta 2535", es: "Muwatta 2535", fr: "Muwatta 2535", ur: "موطا 2535", tr: "El-Muvatta 2535 — İbn Şihab: Ömer kan parası hakkında soru sorar ve Aşyam el-Dahababi'nin karısının kocasının kan parasından miras alacağına hükmeder.", id: "Al-Muwatta 2535 — Ibn Shihab: Umar bertanya tentang uang darah dan memutuskan bahwa istri Ashyam al-Dhababi mewarisi uang darah suaminya." }
summary:
  ar: "حدثني يحيى عن مالك عن ابن شهاب أن عمر بن الخطاب نشد الناس بمنى: من كان عنده علم من الدية أن يخبرني؟ فقام الضحاك بن سفيان الكلابي فقال: كتب إليّ رسول الله أن أورّث امرأة أشيم الضبابي من دية زوجها. فقال له عمر: ادخل الخباء حتى آتيك. فلما نزل أخبره الضحاك، فقضى بذلك عمر. قال ابن شهاب: وكان قتل أشيم خطأ. {cite:muwatta-maruf-1997 p.437} {cite:muwatta-maruf-1997 p.438}"
  tr: "Yahya, Malik'ten, o da İbn Şihab'tan rivayet ederek bana, Ömer ibn el-Hattab'ın Mina'daki insanlara şöyle sorduğunu anlattı: \"Aranızda kan parası hakkında bilgisi olan var mı? Bana bildirsin.\" El-Dahhak ibn Sufyan el-Kilabi ayağa kalktı ve şöyle dedi: \"Allah'ın Resulü bana, Aşyam el-Dhababi'nin karısına kocasının kan parasından pay vermemi emrettiği bir mektup yazdı.\" Ömer ona, \"Ben gelene kadar çadıra gir\" dedi. Aşağı indiğinde, el-Dahhak ona durumu anlattı ve Ömer de buna göre hüküm verdi. İbn Şihab şöyle dedi: \"Aşyam'ın öldürülmesi kasıtsızdı.\""
  id: "Yahya meriwayatkan kepadaku, dari Malik, dari Ibn Shihab, bahwa Umar ibn al-Khattab bertanya kepada orang-orang di Mina: \"Siapa di antara kalian yang mengetahui tentang uang darah? Biarlah dia memberitahuku.\" Al-Dahhak ibn Sufyan al-Kilabi berdiri dan berkata: \"Rasulullah SAW menulis kepadaku memerintahkanku untuk memberikan bagian dari uang darah suaminya kepada istri Ashyam al-Dhababi.\" Umar berkata kepadanya: \"Masuklah ke dalam tenda sampai aku datang kepadamu.\" Ketika dia turun, al-Dahhak memberitahunya, dan Umar memutuskan sesuai dengan itu. Ibn Shihab berkata: \"Pembunuhan Ashyam tidak disengaja.\""
