text: |-
  ٥٨٢
  العلوم فوق المعالم عزيز مصر ووحيد العصر سعادة أفندينا المحروس بعذاية ربه العلى
  اسمعيل بن ابراهيم بن محد على حفظ القلّه سبحانه دولته كماحفظ رعيته وأدام مجده وخاد
  حده وحرس أشباه الكرام وجعلهم غرة فى جبين الايام ملهوظة دار الطباعة المذكورة
  ينظر ناظرها المشمر عن ساعد الحد والاجتماد فى تدبير نضارتها من لا تزال عليه أخلاقه
  باللطف تنى حضرة حسين بك ح-ف والملتزم اهذا الطبع الظريف والوضع اللطيف
  من بطبعه أحيا الدارسص كتب الاوائل وكساها حلاتقان مالها عمائل ففازت يهجة
  أ النكثير ووصات اليهابدالغنت والفقير ذو العلوم والمعارف سعادة محمدياشاعارف أفاض
  اللّه عليه مجال التهانى ومحه غيون الامانى ثم ان تصميح هذه المانى من هذا الجز
  الثانى بمعرفة الفقير الى اللّه سيحانه محمد الصباغ أسبغت عليه النعم أتمّ اسباغ وكان ذلك
  بكداليمين وعرق الجيين واعمال الذهن حتى صار عليلا والبصرحتى عادكايلا فجا.يحمد
  اللّٰه على أبهبج نظام يفوق بحسنه بدور التمام يجرّذيل الاقتخار ويزهو على غيره زهو
  الربيع بالازهار ولما آذن بدره بالكمال أنشأمور خاله لسان الحال
  غادة خامرت فؤا دك ظلما • أم ظى ساجى اللواحظ ألمى
  ام بدور زهت بروض نضير • طاب فيه الصبابصفق بالما
  أم عقود تزرى بنظم النريا • فى نحودزوق حسناورسما
  بالعمرى هذى عرائس فكر • لاتصافى الانبلا خضما
  صاغها الجوهرىّ واختارمن كلّ يتسيم غينه وأتما
  فهو احرى بأسم الصصاح وأحظى • بيليغ الثنا وأشرف الاسما
  بالهذاسفرا كأنّ خبايا • •كنوز الملوك تحرز الآسمى
  أومجار تحوى النفائس أور • وى فحدث بمانشاءفنعما
  كم أرانا فى كل بادية معشنى دقيقا وكم أبان معمى
  وكساه الطبع الجبل كمالا • ففداجامع المحاسن تما
  ونجيم أرّنسه فى هناء • رق طبع المصاح معنى وتما
