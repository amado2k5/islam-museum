label: { ar: "الموطأ 1899 — مالك عن يونس بن يوسف عن سعيد بن المسيب: مر عمر بحاطب بن أبي بلتعة وهو يبيع زبيبا له بالسوق، فقال له: إما أن تزيد في السعر، وإما أن ترفع من سوقنا", en: "Muwatta 1899", es: "Muwatta 1899", fr: "Muwatta 1899", ur: "موطا 1899", tr: "El-Muvatta 1899 — Malik, Yunus ibn Yusuf'tan, o da Said ibn el-Musayyab'dan rivayet eder: Ömer, Hatib ibn Abi Balta'ah'ın çarşıda kuru üzüm sattığı sırada yanından geçti ve ona şöyle dedi: Ya fiyatı yükselt, ya da çarşımızdan ayrıl.", id: "Al-Muwatta 1899 — Malik, berdasarkan riwayat Yunus ibn Yusuf, berdasarkan riwayat Saeed ibn al-Musayyab: Umar melewati Hatib ibn Abi Balta’ah ketika ia sedang menjual kismisnya di pasar, dan berkata kepadanya: Naikkan harga, atau tinggalkan pasar kami." }
summary:
  ar: "يروي مالك عن يونس بن يوسف عن سعيد بن المسيب أن عمر بن الخطاب مر بحاطب بن أبي بلتعة، وهو يبيع زبيبا له بالسوق، فقال له عمر: إما أن تزيد في السعر، وإما أن ترفع من سوقنا. {cite:muwatta-maruf-1997 p.180}"
  tr: "Malik, Yunus ibn Yusuf'tan, o da Sa'id ibn al-Musayyab'dan rivayet ettiğine göre, Ömer ibn al-Khattab, çarşıda kuru üzüm satan Hatib ibn Abi Balta'ah'ın yanından geçerken ona şöyle dedi: \"Ya fiyatı yükselt, ya da çarşımızdan ayrıl.\" {cite:muwatta-maruf-1997 s.180}"
  id: "Malik meriwayatkan dari Yunus ibn Yusuf, dari Sa'id ibn al-Musayyab, bahwa Umar ibn al-Khattab melewati Hatib ibn Abi Balta'ah, yang sedang menjual kismisnya di pasar, dan Umar berkata kepadanya: \"Naikkan harga, atau tinggalkan pasar kami.\" {cite:muwatta-maruf-1997 p.180}"
