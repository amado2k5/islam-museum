label: { ar: "صحيح مسلم 2966 — الأب والأبوة", en: "Sahih Muslim 2966 — the father and fatherhood", ur: "صحیح مسلم 2966 — باپ اور والدیت", es: "Sahih Muslim 2966 — El padre y la paternidad", fr: "Sahih Muslim 2966 — Le père et la paternité" }
text: "وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، عَنْ سُفْيَانَ، عَنْ عَيَّاشٍ الْعَامِرِيِّ، عَنْ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ أَبِيهِ، عَنْ أَبِي ذَرٍّ، - - قَالَ كَانَتْ لَنَا رُخْصَةً. يَعْنِي الْمُتْعَةَ فِي الْحَجِّ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2966، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2966 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2966، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2966 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2966 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
