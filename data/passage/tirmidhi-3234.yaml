label:
  ar: "الترمذي 3234 — يا محمد هل تدري فيم يختصم الملأ الأعلى"
  en: "Tirmidhi 3234 — O Muhammad, do you know what the Highest Assembly disputes about"
  ur: "ترمذی 3234 — یا محمدکا کیا تم جانتے ہو کہ ملائے اعلیٰ کن امور میں جھگڑتا ہے"
text: "أتاني ربي في أحسن صورة فقال يا محمد قلت لبيك ربي وسعديك قال فيم يختصم الملأ الأعلى قلت ربي لا أدري فوضع يده بين كتفي فوجدت بردها بين ثديي …"
summary:
  ar: "حديث قدسي في الترمذي، رقم 3234: يا محمد هل تدري فيم يختصم الملأ الأعلى. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Tirmidhi, no. 3234: O Muhammad, do you know what the Highest Assembly disputes about. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ترمذی میں حدیثِ قدسی، نمبر 3234: یا محمدکا کیا تم جانتے ہو کہ ملائے اعلیٰ کن امور میں جھگڑتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
