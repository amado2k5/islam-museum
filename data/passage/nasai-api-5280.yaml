label: { ar: "سنن النسائي 5280 — أثر من الآثار المحفوظة", en: "Sunan al-Nasa'i 5280 — a relic kept after its owner", ur: "سنن نسائی 5280 — محفوظ آثار و تبرکات", es: "Sunan al-Nasa'i 5280 — una reliquia conservada después de su propietario.", fr: "Sunan al-Nasa'i 5280 — une relique conservée après son propriétaire", tr: "Sunan an-Nasa'i 5280 - korunmuş bir hadis", id: "Sunan an-Nasa'i 5280 — sebuah hadits yang diawetkan" }
text: "أَخْبَرَنَا الْقَاسِمُ بْنُ زَكَرِيَّا، قَالَ حَدَّثَنَا عُبَيْدُ اللَّهِ، عَنِ الْحَسَنِ، - وَهُوَ ابْنُ صَالِحٍ - عَنْ عَاصِمٍ، عَنْ حُمَيْدٍ، عَنْ أَنَسٍ، قَالَ كَانَ خَاتَمُ النَّبِيِّ مِنْ فِضَّةٍ وَفَصُّهُ مِنْهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 5280، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5280 (The Book of Adornment), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 5280، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5280 (El Libro de los Adornos), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5280 (Le Livre de la parure), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sunan-ı Nesai'de 5280 numaralı hadis, günümüze kadar ulaşmış bir rivayeti zikretmektedir. Bu hadis, vasiyetnameler, miras, gelenekler ve türbeler üzerine çalışan araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5280, menyebutkan sebuah tradisi yang lestari. Hadits ini dikumpulkan oleh para peneliti wasiat, warisan, tradisi, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
