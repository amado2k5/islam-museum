label: { ar: "صحيح البخاري 4221 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4221 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4221 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا حَجَّاجُ بْنُ مِنْهَالٍ، حَدَّثَنَا شُعْبَةُ، قَالَ أَخْبَرَنِي عَدِيُّ بْنُ ثَابِتٍ، عَنِ الْبَرَاءِ، وَعَبْدِ اللَّهِ بْنِ أَبِي أَوْفَى،م أَنَّهُمْ كَانُوا مَعَ النَّبِيِّ فَأَصَابُوا حُمُرًا فَطَبَخُوهَا، فَنَادَى مُنَادِي النَّبِيِّ أَكْفِئُوا الْقُدُورَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4221، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4221, with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4221، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
