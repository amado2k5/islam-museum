text: "… ثَوْبَان، عن رجل له صحبة قال: قال رسول اللّٰه عله : حق على كل مسلم أن يغتسل يوم الجمعة وأن يَتَسؤَك، وأن يَمَسّ من الطيب إن وجد أحمد. أخرجه أبو نعيم. - : مُحَمَّدُ بن قَيْس، عن رجل من الصحابة: …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1466، يرد فيه ذكر ما وجب على كل مسلم، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1466, whose wording mentions a duty laid on every Muslim, a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1466 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Usd al-Ghaba de Ibn al-Athir, volume numérisé 1, p. 1466, dont le texte mentionne un devoir imposé à chaque musulman, un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Usd al-Ghaba de Ibn al-Athir, volumen digitalizado 1, p. 1466, cuyo texto menciona un deber impuesto a cada musulmán, un derecho debido por cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin resimli 1. cildinin 1466. sayfasından, her Müslümanın yükümlülüklerini ve haklarını anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Zorunlu fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram kılınan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 1 bergambar, halaman 1466, yang menyebutkan kewajiban dan hak setiap Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
