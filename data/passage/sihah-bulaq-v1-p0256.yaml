text: |-
  ⁦(فصل القاف )⁩
  ⁦(قدحر)⁩
  ٣٨٥
  الشيخ الكبير الهرم والبعير المسن ويقال للاتى ناب وشارف ولا يقال قحرة وبعضهم
  يقوله (قدر . قدر الشى مبلغه وقد راللّه وقدره بعنى وهوفى الاصل مصدر وقال اللّٰه
  تعالى ما قدروا اللّٰه حق قدره أى ماعظموا اللّٰه حق تعظيمه والقدر والقدر أ يضاما يقدره
  اللّٰه عزوجل من القضاء وأنشد الاخفس
  الايالقومى للنوائب والقدر • والامرياتى المرمن حيث لايدرى
  ويقال مالى علمه مقدرة ومقدرة أى قدرة ومنه قولهم المقدرة تذهب الحفظة ورجل
  ذو مقدوة أى ذو يسار وأما من القضاء والقدر فالمقدرة بالفتح لاغير قال الهذلى
  وما ييقى على الايام شئ • فياعجب لمقدرة الكتاب
  وقدرت على الشي أقد رقدرة وة_درانا وقدرت عليه بالكسرلغة فيه حكاها ابن السكيت
  ورجل ذوقدرة أى ذويساروقدرت الشئ أقدره وأقدره قدرا من التقدير وفى الحديت اذا؟
  غمّ عليكم الهلال فاقدر واله أى أنواثلاثين قال الشاءر ا اس بن ملك المعنى
  كلا تقلينا طامع فى غنيمة * وقددرار «ن ماهوقادر
  أى مقدروقدرت عليه الثوب قدرافا نقدر أى جاءعلى المقدار ويقال بين أرضك وأرض
  فلان ليلة قادرة اذا كانت لينة السير مثل قاصدة ورافهة عن يعقوب وقدر على عياله قدرا
  مثل قتر وقدر على الانسان وزفه قدرامثل قتر وقدرت الذى تقديرا ويقال استقد راللّه خيرا
  وتقدر له الشئ أى تهيأ والاقتدار على الشئ القدرة عليه واقتدر القوم طبخوا فى قدر يقعال
  أنقتدرون أم تشتوون والقدير المطبوخ فى القدرتقول منه قدر واقتدر مشل طبخ واطبخ
  والقدرتونث وتصغيرها قدير بلاها على غير قياس والقدار الجزارو يقال الطباخ وقدار
  بن سالف الذى يقال لهأحرعود عاقر ناقة صالح عليه السلام والاقدر القصير من الرجال
  قال الشاعر هو صغر الهذلى يصف صائدا
  أتيح لها أقيدرد وحشيف • اذاسامت على الملقات سأما
  والاقدر من الخيل الذى تجاوز حافرار جليه حاذرى يديه قال رجل من الانصار
  وأقدر مشرف الصهوات ساط * كيت لا أ-ق ولا شئيت
  ( قذر القذرضد النظافة ونى قذربين القذارة وقذرت الشى بالكسر وتقذرته
  واستقذرته اذا كرهته والقذور من النساء التى تتتزه عن الاقذار أبو عبيدة ناقة قذور تبرك
  ناحية من الابل وتستبعد قال والكنوف منلها الاانها لاتستبعد قال المكلابى رجل قذرة
  مثال همزة يتنزه عن الملايم ورجل قاذورة وذوقاذورة لا يخال الناس لسوء خلقه ولاينا زلهم
  قال متمم بن نويرة يرنى أخاه
  فان تلقه فى الشرب لاتلق فاحشا * على الكاس ذا قاذورة متزبعا
  ورجل مقذر بالفتح يجتنبه الناس وهو فى شعر الهذلى ١) ⁦( ذحر)⁩ المقذحرّ المتهي للسباب
  والشرّتراه الدهرمنتفخاشسبه الغضبان قال أبوعبيدهو بالدال والذال جميعا والمقذءز مثله
  قال الاصمعىّ سألت خلفا الاجرعنه فلم يتهبأله أن يخرج تفسيره بلفظ واحد فقال أمارأيت
  سنورامتوحشا فى أصل راقودوأنشد الاصمعى لعمروين جبل .
  ٩٧,
  مداح
  قوله قدر الشئ مبلغه
  قلت هو بسكون الدال وقصها
  ذكره فى التهذيب اه محتار
  ويصبت ماقد كان فاصيت
  نفسى الى اخوانها كالقذرا
