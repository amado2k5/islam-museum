summary:
  ar: "القسم 43 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب في الاستقراض»، ويضم فيها النصوص من 2385 إلى 2409 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 43 of Sahih al-Bukhari (Loans, Payment of Loans, Freezing of Property, Bankruptcy) in the division of the open hadith dataset the museum took its reports from: reports 2385 to 2409 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 43، عنوان «کتاب فی الاستقراض»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2385 تا 2409۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 43 de Sahih al-Bukhari (Préstamos, Pago de Préstamos, Congelación de Bienes, Quiebra) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2385 al 2409, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 43 du Sahih al-Bukhari (Prêts, Remboursement des prêts, Gel des biens, Faillite), dans la section du recueil ouvert de hadiths: les hadiths 2385 à 2409 de cette section. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
