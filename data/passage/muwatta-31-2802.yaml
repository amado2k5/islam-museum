label: { ar: "الموطأ 2802 — سعيد بن المسيب: الشيطان يهم بالواحد والاثنين لا بالثلاثة", en: "Muwatta 2802", es: "Muwatta 2802", fr: "Muwatta 2802", ur: "موطا 2802", tr: "Al-Muwatta 2802 — Sa'id ibn al-Musayyab: Şeytan bir veya iki kişiyi ayartıyor, üçünü değil.", id: "Al-Muwatta 2802 — Sa'id ibn al-Musayyab: Setan menggoda satu atau dua orang, tetapi tidak tiga." }
summary:
  ar: "يروي مالك عن عبد الرحمن بن حرملة، عن سعيد بن المسيب أنه كان يقول: قال رسول الله: الشيطان يهم بالواحد والاثنين، فإذا كانوا ثلاثة لم يهم بهم. ويذكر المحقق أن الحديث مرسل باتفاق رواة الموطأ. {cite:muwatta-maruf-1997 p.574}"
  tr: "Malik, Abdülrahman ibn Harmalah'tan, o da Sa'id ibn el-Musayyab'tan rivayetle, şöyle buyurduğunu aktarır: Allah Resulü şöyle buyurmuştur: Şeytan bir veya iki kişiyi ayartır, fakat üç kişi varsa onları ayartmaz. Araştırmacı, hadisin Muvatta ravilerinin ittifakına göre mursal (rivayet zincirinde eksik halka bulunan hadis) olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.574}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn Harmalah, dari Sa'id ibn al-Musayyab, bahwa beliau biasa berkata: Rasulullah SAW bersabda: Setan menggoda satu atau dua orang, tetapi jika ada tiga orang, ia tidak menggoda mereka. Peneliti menyebutkan bahwa hadits ini mursal (hadits dengan mata rantai perawi yang hilang) menurut konsensus para perawi al-Muwatta. {cite:muwatta-maruf-1997 p.574}"
