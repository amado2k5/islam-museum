label: { ar: "جامع الترمذي 1142 — الأب والأبوة", en: "Jami' al-Tirmidhi 1142 — the father and fatherhood", ur: "جامع ترمذی 1142 — باپ اور والدیت" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ مَنِيعٍ، وَهَنَّادٌ، قَالاَ حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الْحَجَّاجِ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ رَدَّ ابْنَتَهُ زَيْنَبَ عَلَى أَبِي الْعَاصِي بْنِ الرَّبِيعِ بِمَهْرٍ جَدِيدٍ وَنِكَاحٍ جَدِيدٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ فِي إِسْنَادِهِ مَقَالٌ. وَالْعَمَلُ عَلَى هَذَا الْحَدِيثِ عِنْدَ أَهْلِ الْعِلْمِ أَنَّ الْمَرْأَةَ إِذَا أَسْلَمَتْ قَبْلَ زَوْجِهَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1142، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1142 (The Book on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1142، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
