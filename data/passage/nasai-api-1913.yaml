label: { ar: "سنن النسائي 1913 — الأب والأبوة", en: "Sunan al-Nasa'i 1913 — the father and fatherhood", ur: "سنن نسائی 1913 — باپ اور والدیت", es: "Sunan al-Nasa'i 1913 — El padre y la paternidad" }
text: "أَخْبَرَنَا عَلِيُّ بْنُ حُجْرٍ، عَنْ إِسْمَاعِيلَ، وَهُشَيْمٍ، عَنْ عُيَيْنَةَ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِيهِ، عَنْ أَبِي بَكْرَةَ، قَالَ لَقَدْ رَأَيْتُنَا مَعَ رَسُولِ اللَّهِ وَإِنَّا لَنَكَادُ نَرْمُلُ بِهَا رَمَلاً. وَاللَّفْظُ حَدِيثُ هُشَيْمٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 1913، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1913 (The Book of Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1913، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1913 (El Libro de los Funerales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
