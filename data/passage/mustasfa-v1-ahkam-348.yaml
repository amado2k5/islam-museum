text: "مسألة كما يتضاد الحرام والواجب.. فيتضاد المكروه والواجب. فلا يدخل مكروه تحت الأمر، حتى يكون شيء واحد مأموراً به مكروهاً، إلا أن تنصرف الكراهة عن ذات المأمور إلى غيره، ككراهة الصلاة في الحمام وأعطان الإبل وبطن الوادي، وأمثاله. فإن المكروه …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 348، يرد فيه ذكر الواجب، والمكروه، والكراهة، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 348, whose wording mentions the obligatory (wajib), the disliked (makruh), dislike (karaha), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
