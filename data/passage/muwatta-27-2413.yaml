label: { ar: "الموطأ 2413 — رزيق بن حكيم: العبد الآبق السارق وكتاب عمر بن عبد العزيز", en: "Muwatta 2413" }
summary:
  ar: "يروي مالك عن رزيق بن حكيم أنه أخذ عبدا آبقا قد سرق، فأشكل أمره، فكتب إلى عمر بن عبد العزيز، لأنه كان يسمع أن العبد الآبق إذا سرق وهو آبق لا تُقطع يده. فكتب إليه عمر بخلاف ذلك: إن الله يذكر في كتابه حكم السارق والسارقة، فإن بلغت سرقته ربع دينار فصاعدا فاقطع يده. {cite:muwatta-maruf-1997 p.397}"
