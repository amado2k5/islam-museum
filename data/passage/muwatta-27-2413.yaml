label: { ar: "الموطأ 2413 — رزيق بن حكيم: العبد الآبق السارق وكتاب عمر بن عبد العزيز", en: "Muwatta 2413", es: "Muwatta 2413", fr: "Muwatta 2413", ur: "موطا 2413", tr: "El-Muvatta 2413 — Raziq ibn Hakim: Kaçak köle ve hırsız ve Ömer ibn Abdülaziz'in kitabı", id: "Al-Muwatta 2413 — Raziq ibn Hakim: Budak yang melarikan diri dan pencuri, dan kitab Umar ibn Abd al-Aziz" }
summary:
  ar: "يروي مالك عن رزيق بن حكيم أنه أخذ عبدا آبقا قد سرق، فأشكل أمره، فكتب إلى عمر بن عبد العزيز، لأنه كان يسمع أن العبد الآبق إذا سرق وهو آبق لا تُقطع يده. فكتب إليه عمر بخلاف ذلك: إن الله يذكر في كتابه حكم السارق والسارقة، فإن بلغت سرقته ربع دينار فصاعدا فاقطع يده. {cite:muwatta-maruf-1997 p.397}"
  tr: "Malik, Raziq ibn Hakim'den rivayetle, hırsızlık yapmış kaçak bir köleyi yakaladığını ve bu konuda şaşkına döndüğünü anlatır. Bunun üzerine Ömer ibn Abdülaziz'e yazmıştır, çünkü kaçak bir kölenin kaçarken hırsızlık yapması durumunda elinin kesilmemesi gerektiğini duymuştu. Ömer ise bunun aksini yazarak şöyle cevap vermiştir: \"Allah, Kitabında erkek ve kadın hırsız hakkında hüküm vermiştir ve eğer hırsızlığı çeyrek dinar veya daha fazla ise eli kesilir.\" {cite:muwatta-maruf-1997 s.397}"
  id: "Malik meriwayatkan dari Raziq ibn Hakim bahwa ia menangkap seorang budak pelarian yang telah mencuri, dan merasa bingung mengenai hal itu. Maka ia menulis surat kepada Umar ibn Abd al-Aziz, karena ia mendengar bahwa jika seorang budak pelarian mencuri saat dalam pelarian, tangannya tidak boleh dipotong. Umar membalas suratnya dengan pernyataan yang bertentangan: Allah menyebutkan dalam Kitab-Nya hukum tentang pencuri laki-laki dan perempuan, dan jika pencuriannya mencapai seperempat dinar atau lebih, maka potonglah tangannya. {cite:muwatta-maruf-1997 p.397}"
