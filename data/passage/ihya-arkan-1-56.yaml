text: "… منه ويداريه فلما فارقه بكى فقيل له فى ذلك فقال : بكيته رحمة له، فارقته وخلقه معالم يفارقه، وقال الجنيد : أربع ترفع العبد إلى أعلى الدرجات وإن قل عمله وعلمه، الحلم والتواضع والسخاء وحسن الخلق وهو كمال الإيمان. وقال …"
