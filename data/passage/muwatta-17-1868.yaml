label: { ar: "الموطأ 1868 — مالك: بلغه أن رجلا أراد أن يبتاع طعاما من رجل إلى أجل، فأراه البائع الصبر، فقال المبتاع: أتبيعني ما ليس عندك؟ فنهاهما ابن عمر عن ذلك", en: "Muwatta 1868", es: "Muwatta 1868", fr: "Muwatta 1868", ur: "موطا 1868", tr: "El-Muvatta 1868 — Malik: Bir adamın başka bir adamdan verasetle yiyecek almak istediği, satıcının da ona sabır gösterdiği, alıcının ise: \"Sahip olmadığın şeyi bana mı satıyorsun?\" dediği rivayet edildi. Bunun üzerine İbn Ömer, onlara bunu yapmalarını yasakladı.", id: "Al-Muwatta 1868 — Malik: Kisah itu sampai kepadanya, seorang pria ingin membeli makanan dari pria lain secara kredit, lalu penjual bersabar, dan pembeli berkata: Apakah Anda menjual kepada saya apa yang tidak Anda miliki? Maka Ibnu Umar melarang mereka melakukan hal itu." }
summary:
  ar: "قال مالك: بلغه أن رجلا أراد أن يبتاع طعاما من رجل إلى أجل، فذهب به الرجل الذي يريد أن يبيعه الطعام إلى السوق، فجعل يريه الصبر ويقول له: من أيها تحب أن أبتاع لك؟ فقال المبتاع: أتبيعني ما ليس عندك؟ فأتيا عبد الله بن عمر فذكرا ذلك له، فقال عبد الله بن عمر للمبتاع: لا تبتع منه ما ليس عنده. وقال للبائع: لا تبع ما ليس عندك. {cite:muwatta-maruf-1997 p.169}"
  tr: "Malik şöyle dedi: Bir adamın başka bir adamdan verasetle yiyecek almak istediği kendisine ulaştı. Yiyecek satmak isteyen adam onu pazara götürdü ve ona sabır göstererek sordu: \"Sana hangi tür sabır almamı istersin?\" Alıcı dedi ki: \"Sahip olmadığın şeyi bana mı satıyorsun?\" Bunun üzerine Abdullah ibn Umar'a gidip durumu anlattılar. Abdullah ibn Umar alıcıya dedi ki: \"Sahip olmadığı şeyi ondan alma.\" Ve satıcıya dedi ki: \"Sahip olmadığın şeyi satma.\" {cite:muwatta-maruf-1997 s.169}"
  id: "Malik berkata: Ia mendengar kabar bahwa seorang pria ingin membeli makanan dari pria lain secara kredit. Maka pria yang ingin menjual makanan itu membawanya ke pasar dan mulai menunjukkan kesabaran kepadanya serta bertanya: Kesabaran seperti apa yang kamu inginkan dariku? Pembeli itu berkata: Apakah kamu menjual kepadaku apa yang tidak kamu miliki? Maka mereka pergi kepada Abdullah ibn Umar dan menceritakan hal itu kepadanya. Abdullah ibn Umar berkata kepada pembeli: Jangan membeli darinya apa yang tidak dia miliki. Dan ia berkata kepada penjual: Jangan menjual apa yang tidak kamu miliki. {cite:muwatta-maruf-1997 p.169}"
