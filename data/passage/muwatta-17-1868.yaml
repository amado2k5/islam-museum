label: { ar: "الموطأ 1868 — مالك: بلغه أن رجلا أراد أن يبتاع طعاما من رجل إلى أجل، فأراه البائع الصبر، فقال المبتاع: أتبيعني ما ليس عندك؟ فنهاهما ابن عمر عن ذلك", en: "Muwatta 1868" }
summary:
  ar: "قال مالك: بلغه أن رجلا أراد أن يبتاع طعاما من رجل إلى أجل، فذهب به الرجل الذي يريد أن يبيعه الطعام إلى السوق، فجعل يريه الصبر ويقول له: من أيها تحب أن أبتاع لك؟ فقال المبتاع: أتبيعني ما ليس عندك؟ فأتيا عبد الله بن عمر فذكرا ذلك له، فقال عبد الله بن عمر للمبتاع: لا تبتع منه ما ليس عنده. وقال للبائع: لا تبع ما ليس عندك. {cite:muwatta-maruf-1997 p.169}"
