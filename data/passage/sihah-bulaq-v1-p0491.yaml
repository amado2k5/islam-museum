text: |-
  ادرمج تشديد الميم ووضع الشدة
  على الجسيم غلط من النساخ اه
  ١٥٠
  ⁦(ياب الجيم)⁩
  ⁦(دمج)⁩
  الدرج والدرجة واحدة الدرجات وهى الطبقات من المراتب والدرجة مثال الهمزقلغة
  فى الدرجة وهي المرقاة والدرجة أيضاطائرأسودباطن الجناحين وظاهرهما أغبر على خلقة
  القطا الاأنها ألطف والدرج الذى يكتب فيه وكذلك الدرج بالتحريك يقال أنفذته
  فى درج الكتاب أى فى طبه وذهب دمه أدراج الرياح أى هدرا والدرج بالضم حفش
  النساء والدرجة أيضاشى يدرج فيدخل فى حياء الناقة ثم تشءه فنظنه ولدها فترأمه قال
  أبوزياد الكلابى اذا أرادوا أن ترأم الناقة ولدغيرهاشدوا أنفها وعينيها ثم حشواحياءها
  مشافا وخر قافيتر كونها أيا مافأخذه الذلك غم مثل المخاض ثم يحلون عنها الرباط فيخر:
  ذلك وهى ترى أنه ولدفاذا ألقته حلواعينيها وقدهيؤالها حوارافيد نونه اليها فتحسب
  ولده فترأمه ويقال لذلك الشي الذى يشذبه عيناها الغمامة والذى يشديه أنفها الصقاع
  والذى يحشى به الدرجة والجمع الدرج قال الشاعر ولم تجعل اهادرج الظمار
  والدراج والدرّاجة ضرب من الطير للذكر والانى -تى ثقول الحيقطان فيختص بالذكر
  وأرض مدرجة أى ذات درّاج والدراجة بالفتح الحال وهى التى يدرّج عليها الصبىّ اذا
  مشى-كاء أبونصر والدراج اسم موضع ( دعج الدعج شدّة سواد العين مع سعتها يقال
  عيزدعجماء والادعيج من الرجال الاسود وأما قول ابن أحر
  ما أم غفر على دعجاءذى علق * يتفى القراميد عنها الاعهم الوقل
  فهى هضبة عن أبى عبيدة والعرب تسمى أوّل المحاق الدعجاء وهى ايلة ثمان وعشرين
  والشانيسة السرار والثالثة الذلنة وهى ليلة الثلاثين (دعلج الدعلجة التردّد فى الذهاب
  رالجءودعلج اسم فرس عامر بن الطفيل وقال
  أكرّ عليهم دعلجا ولبانه * اذا ما اشتكى وقع الرماح تحمسما
  ( ⁦(لج)⁩ أدلج القوم اذاساروا من أوّل الليسل والاسم الدلج بالتجريك والدلحة والدلحة
  أيضامثل برهة من الدهر وبرهة فان س.اروا من آخر الليل فقداتلجوا تشديد الدال والاسيم
  الدلجة والدلجة وآماقول الشهاخ
  وتشكوبعين ما أكل ركابها • وقيل المنادى أصبح القوم أدلجى
  فلم يجعل الادلاج مع الصبح وانما أراد أن المنادى كان ينادى مرّة أصبح القوم كمايقمال
  أصبحتم كم تنامون ومرة يشادى أدلجى أى سيرى ايلا والدالج الذى يأخد الدلو ويمشى بها
  من رأس البئرالى الموض حتى يفرّغها فيه وقد دلج يدلج بالضيم دلوجاوذلك الموضع مدلج
  ومدلجة قال الشاعر ⁦(عنترة)⁩
  كأن رماحهم أشطان بر • لها فى كل مدلجة خدود
  ومدلج بضم الميم قبيلة من كتانة ومنهم القافة والدولح كناس الوحس مثل التولح وقال
  واجتاب أدمان الفلاة الدولجا والدولج السرب (دمج ديح المشئ دمويا اذادخل
  فى الشى واستحكم فيه وكذلك اندعج واتيج بتشديد الدال وادريج قال أبو عبيد كل هذااذا
  خل ف الشى واستترفيه وأصل مديح أى مدوّر وتدامجواعليه أى تعادنوا وليل دامج أى
  مظلم والمدامجة مثل المداجاة ومنه الصلح الدماج بالضم وهوالذى كأنه فى خفاء ريق-ل هو
  التام
