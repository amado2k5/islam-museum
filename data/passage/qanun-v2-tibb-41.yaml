text: "… دهن حب القرع: بارد رطب، ينفع من حرارة الدماغ ويبسه، إذا استعط به، ولأصحاب البرسام، والماليخوليا إذا استنشق أو صب على رؤوسهم مع يسير خل، وينفع من كل حرارة تعرض في البدن. المعتمد في الأدوية المفردة، الملك المظفّر يوسف بن …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 41، يذكر اللدود والسعوط، وأسماء الأمراض، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 41, that mentions medicine given by the mouth-side or the nose, named diseases, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 41 کا اقتباس جس میں لدود اور سعوط، بیماریوں کے نام، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 41, que menciona la medicina administrada por vía oral o nasal, las enfermedades, el medicamento, los medicamentos y la farmacia; a partir del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 41, qui mentionne les médicaments administrés par voie orale ou nasale, les maladies nommées, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 41. sayfasından, infüzyonlar ve enfiye, hastalık isimleri, tıp, ilaçlar ve eczacılıktan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 41, yang menyebutkan infus dan tembakau hisap, nama-nama penyakit, obat-obatan, narkoba dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
