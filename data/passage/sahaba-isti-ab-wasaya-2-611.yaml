text: "… عن قتادة، فقيل : قيس بن مالك، وقيل : مالك بن قيس، وقد عن مُطرَّف بن الشِّخِّير، عن حكيم بن قيسٍ بن ذكرناه في الكنى بأكثر من ذلك، فأغنى عن الإعادة عاصم، عن أبيه : أنه أوصى عند موته، فقال …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 611، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 611, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 611 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 2, pág. 611, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab (tome 2, p. 611), mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 2. cildinin 611. sayfasında, vasiyetname veya son vasiyetten ve ölüm saatinden bahsedilmektedir; makine tarafından okunabilir taranmış kopyadan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 2 bergambar, halaman 611, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peramban wasiat, warisan, barang antik, dan tempat suci."
