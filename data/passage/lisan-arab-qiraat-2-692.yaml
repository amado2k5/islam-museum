text: "… مسهود برى عليها نصفَ حدّ الحرة اذا أسلت وإن لم تزوج وبقوله بقولُ فقهاء الامصار وهو العبواب وقراً ابن كثيرو نافع وأبو عمرو وعبد الله بن عامر و يعقوب فاذا أُحصنّ بضم الالف وقرأ حفص عن عاصم مثله وأما أبو …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 2، ص 692، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 2, p. 692, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 2، ص 692 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen 2, pág. 692, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Lisan al-'Arab d'Ibn Manzur, volume 2, page 692, mentionne les lectures du Coran et les lecteurs; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
