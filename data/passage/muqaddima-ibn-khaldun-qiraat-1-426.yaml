text: "وكثير من القراء بهذه المثابة، يقرأون القرآن فيجيدون في تلاحين أصواتهم كأنها المزاميرُ فيطربون بحسن مساقهم وتناسب نغماتهم، ومن هذا التناسب ما يحدث بالتركيب، وليس كل الناس يستوي في معرفته ولا كل الطباع توافق صاحبها في العمل به إذا علم. …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 426، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 1, p. 426, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 1، ص 426 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 1, pág. 426, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
