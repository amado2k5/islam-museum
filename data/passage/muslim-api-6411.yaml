text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بَرَّادٍ الأَشْعَرِيُّ، وَمُحَمَّدُ بْنُ الْعَلاَءِ الْهَمْدَانِيُّ، قَالاَ حَدَّثَنَا أَبُو أُسَامَةَ حَدَّثَنِي بُرَيْدٌ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ بَلَغَنَا مَخْرَجُ رَسُولِ اللَّهِ صلى الله عليه وسلم وَنَحْنُ بِالْيَمَنِ فَخَرَجْنَا مُهَاجِرِينَ إِلَيْهِ أَنَا وَأَخَوَانِ لِي أَنَا أَصْغَرُهُمَا أَحَدُهُمَا أَبُو بُرْدَةَ وَالآخَرُ أَبُو رُهْمٍ - إِمَّا قَالَ بِضْعًا وَإِمَّا قَالَ ثَلاَثَةً وَخَمْسِينَ أَوِ اثْنَيْنِ وَخَمْسِينَ رَجُلاً مِن …"
summary:
  ar: "في صحيح مسلم؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sahih Muslim; mention of the chancery or the barid post."
  ur: "صحیح مسلم میں؛ دیوآن یا بریڈ کا ذکر."
