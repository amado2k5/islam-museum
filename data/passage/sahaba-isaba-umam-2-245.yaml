text: "… أنه تعلم الخط في الجاهلية، فجاء الإسلام وهو يكتب، وقد كتب لرسول - جون بن قتادة بن الأعور بن ساعدة بن اللّٰه وَلِلقه. عوف بن كعب بن عبد شمس بن زيد مناة بن تميم وقال أبو عمر: أسلم عام خيبر …"
