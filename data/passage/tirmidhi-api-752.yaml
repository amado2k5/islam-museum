label: { ar: "جامع الترمذي 752 — مغفرة ما تقدم من الذنب", en: "Jami' al-Tirmidhi 752 — forgiveness of past sins", ur: "جامع ترمذی 752 — پچھلے گناہوں کی مغفرت", es: "Jami' al-Tirmidhi 752 — perdón de los pecados pasados", fr: "Jami' al-Tirmidhi 752 — pardon des péchés passés", tr: "Cami' el-Tirmizi 752 — Geçmiş günahların affı", id: "Jami' al-Tirmidhi 752 — Pengampunan dosa masa lalu" }
text: "… عَنْ أَبِي قَتَادَةَ، أَنَّ النَّبِيَّ قَالَ \" صِيَامُ يَوْمِ عَاشُورَاءَ إِنِّي أَحْتَسِبُ عَلَى اللَّهِ أَنْ يُكَفِّرَ السَّنَةَ الَّتِي قَبْلَهُ \". وَفِي الْبَابِ عَنْ عَلِيٍّ وَمُحَمَّدِ بْنِ صَيْفِيٍّ وَسَلَمَةَ بْنِ الأَكْوَعِ وَهِنْدِ بْنِ أَسْمَاءَ وَابْنِ عَبَّاسٍ وَالرُّبَيِّعِ بِنْتِ مُعَوِّذِ بْنِ عَفْرَاءَ وَعَبْدِ الرَّحْمَنِ بْنِ سَلَمَةَ الْخُزَاعِيِّ عَنْ عَمِّهِ وَعَبْدِ اللَّهِ بْنِ الزُّبَيْرِ ذَكَرُوا عَنْ رَسُولِ اللَّهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 752، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 752 (The Book on Fasting), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 752، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 752 (El Libro del Ayuno), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 752 (Le Livre du jeûne), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Cami' el-Tirmizi'de 752 numaralı hadis, geçmiş günahların affedilmesinden bahseder. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 752, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
