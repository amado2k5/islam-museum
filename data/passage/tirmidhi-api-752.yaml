label: { ar: "جامع الترمذي 752 — مغفرة ما تقدم من الذنب", en: "Jami' al-Tirmidhi 752 — forgiveness of past sins", ur: "جامع ترمذی 752 — پچھلے گناہوں کی مغفرت" }
text: "… عَنْ أَبِي قَتَادَةَ، أَنَّ النَّبِيَّ قَالَ \" صِيَامُ يَوْمِ عَاشُورَاءَ إِنِّي أَحْتَسِبُ عَلَى اللَّهِ أَنْ يُكَفِّرَ السَّنَةَ الَّتِي قَبْلَهُ \". وَفِي الْبَابِ عَنْ عَلِيٍّ وَمُحَمَّدِ بْنِ صَيْفِيٍّ وَسَلَمَةَ بْنِ الأَكْوَعِ وَهِنْدِ بْنِ أَسْمَاءَ وَابْنِ عَبَّاسٍ وَالرُّبَيِّعِ بِنْتِ مُعَوِّذِ بْنِ عَفْرَاءَ وَعَبْدِ الرَّحْمَنِ بْنِ سَلَمَةَ الْخُزَاعِيِّ عَنْ عَمِّهِ وَعَبْدِ اللَّهِ بْنِ الزُّبَيْرِ ذَكَرُوا عَنْ رَسُولِ اللَّهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 752، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 752 (The Book on Fasting), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 752، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
