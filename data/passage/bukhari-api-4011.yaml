label: { ar: "صحيح البخاري 4011 — الأب والأبوة", en: "Sahih al-Bukhari 4011 — the father and fatherhood", ur: "صحیح بخاری 4011 — باپ اور والدیت" }
text: "حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ عَامِرِ بْنِ رَبِيعَةَ، وَكَانَ، مِنْ أَكْبَرِ بَنِي عَدِيٍّ وَكَانَ أَبُوهُ شَهِدَ بَدْرًا مَعَ النَّبِيِّ أَنَّ عُمَرَ اسْتَعْمَلَ قُدَامَةَ بْنَ مَظْعُونٍ عَلَى الْبَحْرَيْنِ، وَكَانَ شَهِدَ بَدْرًا، وَهُوَ خَالُ عَبْدِ اللَّهِ بْنِ عُمَرَ وَحَفْصَةَم."
summary:
  ar: "حديث في صحيح البخاري، رقم 4011، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4011 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4011، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
