text: |-
  فصل القلف)
  ٢٥١
  ابن ميادةVv
  تفاقدقومى اذيبيعون مهجتى • بجارية بهرالهم بعدها بهرا
  ⁦(فقد)⁩ الفند بالتحريك الكذب وقد أفقد افنادا اذا كذب والفيّد ضعف الرأى من
  هرم وأفند الرجل أهترولا يقال عجوز مفندة لانهالم تكن فى شبيبتها ذات رأى والتفنيد اللوم
  وتضعيف الرأى والفشد بالكسر قطعة من الجبل طولا والفند الزمّانى شاعر وقدوم فند أوة
  أى حادة ود ود الراس جانساء يقال بدا الشيب بفوديه قال ابن السكيت اذا كان
  للرجل ضفيرتان بقال لفلان فودان وتعد بين الفودين أى بين العسدلين وفاد يفيد ويفود أى
  ما وقال البيد
  رمى خرزات المهد ستينجة • وعشرين-تى فادوالشيب شامل
  ⁦( د )⁩ الفهد واحد الفهودوفهد الرجل بالكسر أى أشبه القهد فى كثرة نومه وقدده
  وفى الحديث ان دخل فهدوان خرج أسدوالفهدتان لحتان فى زور الفرس نانتمان مشل
  الفهرين والفوهد الغلام السمين الذى راهق الحلم والجارية فوهدة قال الراجز
  تحب منا مطر هفافوهدا * عمزة شيخين غلاما أمردا
  ⁦(فيد)⁩ فاد يفيد فيدا أى تبحترور جل فيادوفيادة أيضا قال أبو النجم
  وليس بالفيادة المقصمل أى هذا الراعى ليس بالمتجبر الشديد العصا والتفيد التبختر والفياد
  ذكر البوم ويقال الصدى والفائدة ما استفدت من علم أومال تقول منه فادت ه فائدة
  أبوزيدأفدت المال أعطيته غيرى وأفدته استفدته وأنشد للقتال
  بكريتتعثر فى الفقال • مهلك مال ومفيدمال • أى مستفيدمال وفأد المال
  لفلان يفيد أى ثبت له وفاده يفيده أى دافه وقال كثير
  يباشرن فار المسك فى كل مهجع * ويشرق جادى بهنّ مفيد أى مدوف
  والفيد الزعفران المدوف والفيد الشعر الذى عسلى حفلة الفرس وفيدمنزل بطريق مكة
  صل القاف ند) القتد خشب الرحل وججعه اقتاد وقتود قال الرابز
  كاننى ضعنت هتلاءوهقا * اقتادر حلى أوكدرامحنقا
  والقتادشجرة شوك وهو الاعظم وفى المثل ومن دونه خرط القتاد وأما القتاد الاصغرفهى
  التى ترتها نفاخة كنفاخة العشر قال الكسائى ابل قتدة وقتادى اذا اشتكت يظونها
  من أكل القناد كما يقال رمئة ورمائى وقتائدة اسم عقبة وقال عبد مناف بن ربع
  -قاذا أسلكوهم فى قتائدة * شلاكما نطرد الجمالة الشردا
  أى أسلكوهم فى طريق فى قنائدة ⁦(قترد)⁩. رجسل قنرد وقتارد ومقترداذا كان كثير
  الغنم والسخال عن أبي عبيد ئد لقئدنيت يشبه القثاء محد القعدة أصل
  السنام والمع تحادم:-ل حرة وثمار وناقة مقجاد ضخمة السنام وقد أتحدت الناقة وبكرة
  محدة وأصله قحدة فسكنت مثل عشرة وعشرة والقمدوة بزيادة الميم ما خلف الرأس
  والجمع قاحد قد القد الشق طولا تقول قددت السير وغيره أقدّه قداوقد المسافر المفازة
  والانداد الانشقاق والقد أيضاجلد السخلة الماعزة وللجمع القليل أقد والكثير قداد عن
  ابن السكيت وفى المثل ما يجعل قذل الى أديمك معناه أى شى يحملك على أن تجعل أمرك
  قوله بالسكسر أى الموسط على
  الاصطلاح فى الافعال اهV
