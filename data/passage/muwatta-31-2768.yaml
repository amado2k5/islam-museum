label: { ar: "الموطأ 2768 — أبو موسى الأشعري يستأذن على عمر ثلاثا ثم يرجع فيشهد له أبو سعيد", en: "Muwatta 2768" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن وعن غير واحد من علمائهم أن أبا موسى الأشعري جاء يستأذن على عمر بن الخطاب، فاستأذن ثلاثا ثم رجع، فأرسل عمر في أثره، فقال: ما لك لم تدخل؟ فقال أبو موسى: سمعت رسول الله يقول: الاستئذان ثلاث، فإن أذن لك فادخل وإلا فارجع. فقال عمر: ومن يعلم هذا؟ لئن لم تأتني بمن يعلم ذلك لأفعلن بك كذا وكذا. فخرج أبو موسى إلى مجلس الأنصار فأخبرهم، فقالوا لأبي سعيد الخدري: قم معه، فقام معه، فأخبر بذلك عمر، فقال لأبي موسى: أما إني لم أتهمك، ولكن خشيت أن يتقول الناس على رسول الله. {cite:muwatta-maruf-1997 p.553} {cite:muwatta-maruf-1997 p.554}"
