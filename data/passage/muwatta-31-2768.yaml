label: { ar: "الموطأ 2768 — أبو موسى الأشعري يستأذن على عمر ثلاثا ثم يرجع فيشهد له أبو سعيد", en: "Muwatta 2768", es: "Muwatta 2768", fr: "Muwatta 2768", ur: "موطا 2768", tr: "El-Muvatta 2768 — Ebu Musa el-Eş'ari, Ömer'in yanına girmek için üç kez izin ister, sonra geri döner ve Ebu Sa'id onun lehine şahitlik eder.", id: "Al-Muwatta 2768 — Abu Musa al-Ash'ari meminta izin untuk masuk menemui Umar tiga kali, kemudian kembali, dan Abu Sa'id menjadi saksi untuknya." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن وعن غير واحد من علمائهم أن أبا موسى الأشعري جاء يستأذن على عمر بن الخطاب، فاستأذن ثلاثا ثم رجع، فأرسل عمر في أثره، فقال: ما لك لم تدخل؟ فقال أبو موسى: سمعت رسول الله يقول: الاستئذان ثلاث، فإن أذن لك فادخل وإلا فارجع. فقال عمر: ومن يعلم هذا؟ لئن لم تأتني بمن يعلم ذلك لأفعلن بك كذا وكذا. فخرج أبو موسى إلى مجلس الأنصار فأخبرهم، فقالوا لأبي سعيد الخدري: قم معه، فقام معه، فأخبر بذلك عمر، فقال لأبي موسى: أما إني لم أتهمك، ولكن خشيت أن يتقول الناس على رسول الله. {cite:muwatta-maruf-1997 p.553} {cite:muwatta-maruf-1997 p.554}"
  tr: "Malik, Rabi'ah ibn Abi Abdülrahman'dan ve onların birçok âliminden rivayet ettiğine göre, Ebu Musa el-Eş'ari, Ömer ibn el-Hattab'ın yanına girmek için izin istemeye geldi. Üç kez izin istedi ve sonra geri döndü. Ömer, arkasından birini göndererek, \"Neden girmedin?\" diye sordu. Ebu Musa, \"Resulullah'ın şöyle dediğini duydum: 'İzin istemek üç defadır. İzin verilirse gir, verilmezse geri dön.'\" dedi. Ömer, \"Bunu kim biliyor? Bana bunu bilen birini getirmezsen, sana şöyle şöyle yaparım.\" dedi. Bunun üzerine Ebu Musa, Ensar'ın yanına giderek durumu onlara anlattı. Ensar, Ebu Sa'id el-Hudri'ye, \"Onunla git.\" dedi. O da onunla birlikte giderek Ömer'e olanları anlattı. Ömer, Ebu Musa'ya, \"Seni suçlamadım, ancak insanların Resulullah'a iftira isnat etmesinden korktum.\" dedi."
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi 'Abd al-Rahman dan dari beberapa ulama mereka bahwa Abu Musa al-Ash'ari datang untuk meminta izin masuk menemui Umar ibn al-Khattab. Ia meminta izin tiga kali dan kemudian kembali. Umar mengutus seseorang untuk menemuinya dan berkata, \"Mengapa kamu tidak masuk?\" Abu Musa menjawab, \"Aku mendengar Rasulullah SAW bersabda, 'Meminta izin itu tiga kali. Jika izin diberikan, maka masuklah; jika tidak, kembalilah.'\" Umar berkata, \"Dan siapa yang tahu ini? Jika kamu tidak membawakan aku seseorang yang tahu ini, aku akan melakukan ini dan itu kepadamu.\" Maka Abu Musa pergi menemui perkumpulan kaum Ansar dan memberitahukan kepada mereka. Mereka berkata kepada Abu Sa'id al-Khudri, \"Pergilah bersamanya.\" Maka ia pergi bersamanya dan memberitahukan kepada Umar tentang apa yang telah terjadi. Umar berkata kepada Abu Musa, \"Aku tidak menuduhmu, tetapi aku khawatir orang-orang akan menisbatkan pernyataan palsu kepada Rasulullah SAW.\""
