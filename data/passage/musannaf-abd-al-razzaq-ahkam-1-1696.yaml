text: "… : اللحد لنا والشق لغيرنا - عبد الرزاق عن الثوري عن مغيرة عن إبراهيم قال : كانوا يستحبون اللحد ويكرهون الشقّ ويكرهون الأَجر في القبر ويستحبون اللَبِن والقصب، وكانوا يكرهون إذا سُوّي على الميت أَن يقوم الولي على قبره فيُعزّى …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 1696، يرد فيه ذكر المستحب، وما كان يُكره، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 1696, whose wording mentions the recommended (mustahabb), what used to be disliked, what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 1696 کا اقتباس جس میں مستحب، جو ناپسند کیا جاتا تھا، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de 'Abd al-Razzaq, volume numérisé 1, p. 1696, dont le texte mentionne le recommandé (mustahabb), ce qui était réprouvé, ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Musannaf de 'Abd al-Razzaq, volumen digitalizado 1, p. 1696, cuyo texto menciona lo recomendado (mustahabb), lo que se reprobaba, lo que los juristas reprobaron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Musannaf Abd al-Razzaq'ın Resimli Cilt 1, s. 1696'sından bir alıntı; tavsiye edilen ameller, mekruh edilen ameller, fıkıhçılar tarafından mekruh edilen ameller ve âlimler tarafından mekruh edilen ameller; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Zorunlu ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 1696, yang menyebutkan amalan yang dianjurkan, amalan yang tidak disukai, amalan yang tidak disukai oleh ahli hukum, dan amalan yang dianggap tidak disukai oleh ulama; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
