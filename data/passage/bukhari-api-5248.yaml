label: { ar: "صحيح البخاري 5248 — مداواة الجراح", en: "Sahih al-Bukhari 5248 — the treatment of wounds", ur: "صحیح بخاری 5248 — زخموں کا علاج" }
text: "… أَبِي حَازِمٍ، قَالَ اخْتَلَفَ النَّاسُ بِأَىِّ شَىْءٍ دُووِيَ جُرْحُ رَسُولِ اللَّهِ يَوْمَ أُحُدٍ، فَسَأَلُوا سَهْلَ بْنَ سَعْدٍ السَّاعِدِيَّ، وَكَانَ مِنْ آخِرِ مَنْ بَقِيَ مِنْ أَصْحَابِ النَّبِيِّ بِالْمَدِينَةِ، فَقَالَ وَمَا بَقِيَ مِنَ النَّاسِ أَحَدٌ أَعْلَمُ بِهِ مِنِّي، كَانَتْ فَاطِمَةُ عَلَيْهَا السَّلاَمُ تَغْسِلُ الدَّمَ عَنْ وَجْهِهِ، وَعَلِيٌّ يَأْتِي بِالْمَاءِ عَلَى تُرْسِهِ، فَأُخِذَ حَصِيرٌ، فَحُرِّقَ فَحُشِيَ بِهِ جُرْحُهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5248، يذكر مداواة الجراح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5248 (Wedlock, Marriage (Nikaah)), that mentions the treatment of wounds. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5248، جس میں زخموں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
