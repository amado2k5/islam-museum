label: { ar: "صحيح البخاري 5248 — مداواة الجراح", en: "Sahih al-Bukhari 5248 — the treatment of wounds", ur: "صحیح بخاری 5248 — زخموں کا علاج", es: "Sahih al-Bukhari 5248 — El tratamiento de las heridas", fr: "Sahih al-Bukhari 5248 — le traitement des plaies", tr: "Sahih el-Buhari 5248 — Yaraların Tedavisi", id: "Sahih al-Bukhari 5248 — Mengobati Luka" }
text: "… أَبِي حَازِمٍ، قَالَ اخْتَلَفَ النَّاسُ بِأَىِّ شَىْءٍ دُووِيَ جُرْحُ رَسُولِ اللَّهِ يَوْمَ أُحُدٍ، فَسَأَلُوا سَهْلَ بْنَ سَعْدٍ السَّاعِدِيَّ، وَكَانَ مِنْ آخِرِ مَنْ بَقِيَ مِنْ أَصْحَابِ النَّبِيِّ بِالْمَدِينَةِ، فَقَالَ وَمَا بَقِيَ مِنَ النَّاسِ أَحَدٌ أَعْلَمُ بِهِ مِنِّي، كَانَتْ فَاطِمَةُ عَلَيْهَا السَّلاَمُ تَغْسِلُ الدَّمَ عَنْ وَجْهِهِ، وَعَلِيٌّ يَأْتِي بِالْمَاءِ عَلَى تُرْسِهِ، فَأُخِذَ حَصِيرٌ، فَحُرِّقَ فَحُشِيَ بِهِ جُرْحُهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5248، يذكر مداواة الجراح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5248 (Wedlock, Marriage (Nikaah)), that mentions the treatment of wounds. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5248، جس میں زخموں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5248 (Matrimonio (Nikaah)), menciona el tratamiento de heridas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5248 (Mariage), mentionne le traitement des plaies. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5248 numaralı hadis, yaraların tedavisine değinmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5248, menyebutkan tentang pengobatan luka. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
