label: { ar: "الموطأ 1543 — قبيصة بن ذؤيب: سأل رجل عثمان بن عفان عن الأختين من ملك اليمين، فقال أحلتهما آية وحرمتهما آية، فأما أنا فلا أحب أن أصنع ذلك", en: "Muwatta 1543", es: "Muwatta 1543", fr: "Muwatta 1543", ur: "موطا 1543", tr: "El-Muvatta 1543 — Kubeysah ibn Züeyb: Bir adam Osman ibn Affan'a köle olan iki kız kardeş hakkında sordu ve o şöyle dedi: Bir ayet buna izin veriyor, başka bir ayet ise bunu yasaklıyor, fakat ben bunu yapmayı sevmiyorum.", id: "Al-Muwatta 1543 — Qubaysah ibn Dhu’ayb: Seorang pria bertanya kepada Uthman ibn Affan tentang dua saudari yang menjadi budak, dan dia berkata: Satu ayat memperbolehkannya dan ayat lain melarangnya, tetapi bagiku, aku tidak suka melakukan itu." }
summary:
  ar: "يروي مالك عن ابن شهاب عن قبيصة بن ذؤيب أن رجلا سأل عثمان بن عفان عن الأختين من ملك اليمين، هل يجمع بينهما؟ فقال عثمان أحلتهما آية، وحرمتهما آية، فأما أنا فلا أحب أن أصنع ذلك. فخرج الرجل فلقي رجلا من أصحاب رسول الله فسأله، فقال لو كان لي من الأمر شيء، ثم وجدت أحدا فعله، لجعلته نكالا. قال ابن شهاب أراه علي بن أبي طالب. {cite:muwatta-maruf-1997 p.45}"
  tr: "Malik, İbn Şihab'dan, o da Kubeysa ibn Züeyb'den rivayet ettiğine göre, bir adam Osman ibn Affan'a, köle olan iki kız kardeşin evlenmesinin caiz olup olmadığını sormuş. Osman, \"Bir ayet buna izin veriyor, bir diğeri ise yasaklıyor, ama ben bunu yapmak istemiyorum\" diye cevap vermiş. Adam dışarı çıkıp Allah Resulü'nün sahabelerinden biriyle görüşmüş ve ona sormuş. Sahabe, \"Eğer bu konuda bir yetkim olsaydı ve birinin bunu yaptığını görseydim, onu ibretlik yapardım\" demiş. İbn Şihab, \"Sanırım bu Ali ibn Ebu Talib'di\" demiş. {cite:muwatta-maruf-1997 s.45}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Qubaysah bin Dhu'ayb, bahwa seorang pria bertanya kepada Utsman bin Affan tentang menikahi dua saudari yang berstatus budak, apakah diperbolehkan menikahi keduanya. Utsman menjawab, \"Satu ayat memperbolehkannya, dan ayat lain melarangnya, tetapi aku tidak ingin melakukannya.\" Pria itu kemudian pergi menemui salah seorang Sahabat Rasulullah dan bertanya kepadanya, dan beliau berkata, \"Jika aku mempunyai wewenang dalam masalah ini, dan kemudian mendapati seseorang melakukannya, aku akan menjadikannya contoh.\" Ibnu Shihab berkata, \"Kurasa orang itu adalah Ali bin Abi Talib.\" {cite:muwatta-maruf-1997 p.45}"
