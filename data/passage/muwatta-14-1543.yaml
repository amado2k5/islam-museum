label: { ar: "الموطأ 1543 — قبيصة بن ذؤيب: سأل رجل عثمان بن عفان عن الأختين من ملك اليمين، فقال أحلتهما آية وحرمتهما آية، فأما أنا فلا أحب أن أصنع ذلك", en: "Muwatta 1543" }
summary:
  ar: "يروي مالك عن ابن شهاب عن قبيصة بن ذؤيب أن رجلا سأل عثمان بن عفان عن الأختين من ملك اليمين، هل يجمع بينهما؟ فقال عثمان أحلتهما آية، وحرمتهما آية، فأما أنا فلا أحب أن أصنع ذلك. فخرج الرجل فلقي رجلا من أصحاب رسول الله فسأله، فقال لو كان لي من الأمر شيء، ثم وجدت أحدا فعله، لجعلته نكالا. قال ابن شهاب أراه علي بن أبي طالب. {cite:muwatta-maruf-1997 p.45}"
