text: "… عَنْ عَوْفٍ، عَنْ سَيَّارِ بْنِ سَلاَمَةَ، هُوَ أَبُو الْمِنْهَالِ الرِّيَاحِيُّ عَنْ أَبِي بَرْزَةَ، قَالَ كَانَ النَّبِيُّ يَكْرَهُ النَّوْمَ قَبْلَ الْعِشَاءِ وَالْحَدِيثَ بَعْدَهَا. قَالَ وَفِي الْبَابِ عَنْ عَائِشَةَ وَعَبْدِ اللَّهِ بْنِ مَسْعُودٍ وَأَنَسٍ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي بَرْزَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ كَرِهَ أَكْثَرُ أَهْلِ الْعِلْمِ النَّوْمَ قَبْلَ صَلاَةِ الْعِشَاءِ وَالْحَدِيثَ بَعْدَهَا وَرَخَّصَ فِي ذَلِكَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 168، يرد فيه ذكر ما كان يُكره، وما كرهه الفقهاء، والرخصة، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 168 (The Book on Salat (Prayer)), whose wording mentions what used to be disliked, what the jurists disliked, the concession (rukhsa), what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 168، جس کے الفاظ میں جو ناپسند کیا جاتا تھا، جسے فقہاء نے مکروہ کہا، رخصت، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 168, dont le texte mentionne ce qui était réprouvé, ce que les juristes ont réprouvé, la dispense (rukhsa), ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 168, cuyo texto menciona lo que se reprobaba, lo que los juristas reprobaron, la dispensa (rukhsa), lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami'ül-Tirmizi'nin 168 numaralı hadisinde, mekruh olan, fıkıhçıların mekruh olarak gördüğü, helal olan ve mekruh olan şeyler sıralanmaktadır. Bu hadis, farz, ibadet, tavsiye edilen, mekruh olan, haram olan ve küçük günahlar üzerine araştırma yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 168, menyebutkan apa yang dibenci, apa yang dibenci oleh para ahli fiqih, apa yang diperbolehkan, dan apa yang dibenci. Hadits ini disusun oleh seorang peneliti mengenai amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang dibenci, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
