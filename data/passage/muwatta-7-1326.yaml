label: { ar: "الموطأ 1326 — أبو هريرة عن النبي: لا يكلم أحد في سبيل الله إلا جاء يوم القيامة وجرحه يثعب دما، اللون لون دم والريح ريح مسك", en: "Muwatta 1326", es: "Muwatta 1326", fr: "Muwatta 1326", ur: "موطا 1326", tr: "El-Muvatta 1326 — Ebu Hurayra, Peygamber'den rivayetle: Allah yolunda yaralanan hiç kimse, kıyamet günü kan fışkıran, rengi kan rengi ve kokusu misk gibi olan bir yara ile gelmeyecektir.", id: "Al-Muwatta 1326 — Abu Hurairah dari Nabi: Tidak seorang pun yang terluka di jalan Allah kecuali ia akan datang pada Hari Kiamat dengan lukanya yang mengeluarkan darah yang sangat banyak, warnanya seperti darah dan baunya seperti kesturi." }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال والذي نفسي بيده، لا يكلم أحد في سبيل الله، والله أعلم بمن يكلم في سبيله، إلا جاء يوم القيامة وجرحه يثعب دما، اللون لون دم، والريح ريح مسك. {cite:muwatta-maruf-1997 p.593}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Canım elinde olan Allah'a yemin ederim ki, Allah yolunda yaralanan hiç kimse -ki Allah en iyi bilir- kıyamet günü kan fışkıran, kan renginde ve misk kokulu bir yara ile gelmeyecektir.\" {cite:muwatta-maruf-1997 s.593}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: “Demi Dia yang jiwaku berada di tangan-Nya, tidak ada seorang pun yang terluka di jalan Allah—dan Allah Maha Mengetahui siapa yang terluka di jalan-Nya—melainkan ia akan datang pada Hari Kiamat dengan lukanya yang mengeluarkan darah, berwarna seperti darah, dan berbau kesturi.” {cite:muwatta-maruf-1997 p.593}"
