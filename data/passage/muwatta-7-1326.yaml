label: { ar: "الموطأ 1326 — أبو هريرة عن النبي: لا يكلم أحد في سبيل الله إلا جاء يوم القيامة وجرحه يثعب دما، اللون لون دم والريح ريح مسك", en: "Muwatta 1326" }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال والذي نفسي بيده، لا يكلم أحد في سبيل الله، والله أعلم بمن يكلم في سبيله، إلا جاء يوم القيامة وجرحه يثعب دما، اللون لون دم، والريح ريح مسك. {cite:muwatta-maruf-1997 p.593}"
