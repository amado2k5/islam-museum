label: { ar: "الموطأ 1805 — مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف: أن عبد الرحمن بن عوف ابتاع وليدة فوجدها ذات زوج، فردها", en: "Muwatta 1805", es: "Muwatta 1805", fr: "Muwatta 1805", ur: "موطا 1805", tr: "El-Muvatta 1805 — Malik, İbn Şihab'dan, o da Ebu Salama ibn Abdülrahman ibn Avf'tan rivayetle: Abdülrahman ibn Avf bir cariye satın aldı ve onun bir kocası olduğunu görünce onu geri verdi.", id: "Al-Muwatta 1805 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Abu Salama ibn Abd al-Rahman ibn Awf: bahwa Abd al-Rahman ibn Awf membeli seorang budak perempuan dan mendapati bahwa ia telah memiliki suami, lalu ia mengembalikannya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف أن عبد الرحمن بن عوف ابتاع وليدة، فوجدها ذات زوج، فردها. {cite:muwatta-maruf-1997 p.139}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Salama ibn Abdülrahman ibn Avf'tan rivayet ettiğine göre, Abdülrahman ibn Avf bir cariye satın almış, ancak cariyenin evli olduğunu görünce onu geri vermiştir. {cite:muwatta-maruf-1997 s.139}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Abu Salama ibn Abd al-Rahman ibn Awf, bahwa Abd al-Rahman ibn Awf membeli seorang budak perempuan, tetapi mendapati bahwa budak tersebut sudah menikah, sehingga ia mengembalikannya. {cite:muwatta-maruf-1997 p.139}"
