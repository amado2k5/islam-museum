text: "… القوم جاما مسلمين. وقد كنتُ استأنيتُ بهم فخَيَّرتُهم بين النساءِ والأَبداء والأموال. فلم يَمدِوا بالنساء والأبناء. فمُن كان عنده منهنَّ شيءٌ فطابت نفسه أن يردّه فليريل. ومَن أَبي منكم وتمسّك بِحَقِّه فَلْيَرُدَّ عليهم. وَلْيَكُن فَرْضاً عليذا ستَ فرائض من أوّل …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 952، يرد فيه ذكر الفريضة والفرائض، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 952, whose wording mentions the obligation (farida), the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 952 کا اقتباس جس میں فریضہ اور فرائض، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Maghazi de al-Waqidi, volume numérisé 1, p. 952, dont le texte mentionne l'obligation (farida), l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
