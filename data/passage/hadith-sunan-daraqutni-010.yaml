text: "ما ذكرته شاهدا. قال الذهبي في مختصره: أما استحى الحاكم يورد في كتابه مثل هذا الحديث الموضوع، فأنا أشهد بالله والله إنه لكذب، وقال ابن عبدالهادي: سقط منه لا، ومحمد بن أبي السري قال ابن أبي حاتم: سئل أبي عنه،"
summary:
