text: |-
  ١ تتخة زيادة زيادين منقذاه
  قوله والام مشددة بعى
  ومكورة كمافى القاموس اه
  ١٤٨
  •ابل).
  ومهمه هالك من تعرّجا * يريد مه لك كما يقال ليل غاض أى مغض وبقال أرادها لك
  المتعترّجين أى من تعرج فيه هلك وقد يجمع هالك على هلكى وهلاك قال السّاعر ١
  ترى الارامل والهلاك تتبعه * يستنّ منه عليهم وابل رذم
  يعنى به الفقراء وقدجاء فى المثل فلان هالك فى الهوالكْ وأنشد أبو عمروبن العلاهلابن
  جذل الطعان فأيقنت انى ثائرابن مكدم • غداتئذ أوهال فى الهوالك
  وهذ اشاذ على مافسرناه فى فوارس وقواهم افعل ذاك اماهلكت هلمك بضم لها واللام
  غير مصروف أى على كل حال وتهالك الرجل على الفراش أى**قط واهتدكت القطاة خوف
  المازى أى رمت بنفسها فى المهائك والهاوك من النساء الفاجرة المتساقطة على الرجال
  ولا يقال وجل هاوك والهلك بالتحريك الشئ الذى يهوى ويسقط وقال
  رأت هلكابنجاف الغبيط • فكادت تجدلذان الهجارا
  والهلكة أيضا الهلاك ومنه قواهم هى الهلكة الهلمكاء وهوتوكيداها كما يقال همبج هامج
  والهالكالحداد نسب الى الهاللك بر عمروبن أسدين خزيمة وكان حداداولذلك قي-ر لبنى
  أسد القيون قال الكسائى يقال وقع فى وادى تهلك بضم التاءوالهاء واللام منتدة وهو
  غير مصروف مثل تخيب ومعناهما الباطل همك انهمك الرج-ل فى الامرأى
  جدّولج وكذلات تهمك فى الامر ⁦(هوذ)⁩ التهول التصير وفى الحديث أمتهوكون أنتم
  كما تهوّكت اليهود والنصارى قال ابن عون فقلت للحسن مامتهوّ كون قال متحيرون والتهوّك
  أيضا مثل التهوّر وهو الوقوع فى الشى بقلة مبالاة
  باب السمام
  صل الالف ⁦( بل)⁩ الابل لا واحدلهامن لفظها وهى موتمة لان أسما
  بجوع التى لاواحسدلها من لفظها اذا كانت لغير الا دميين فالتأنيث لمالازم واذاصغرتها
  أدخلتها الهاء فقلت أبيلة وغنيمة ونحوذلك وربماً قالو اللابل ابل يسكنون الباء للتخفف
  والم-ع آبال واذا قالوا ابلان وغنمان فأنمايريدون قطيعين من الابل والغنم وأرض مأ بلة
  دات ابل والنسبة الى الابل ابلىّ يفتحون الباء استيحاسالتوالى المكسرات وابل أبل مثال
  قبر أى مهملة فان كانت للقنية عهى ابل مؤبلة فان كانت كثيرة قيسل ابل أوابل قال الاخفش
  يقسال جامت ابلك أبابيل أى فرقا وطير أبابيل قال وهذا يجى فى معنى التسكثيروهوم ن انهمع
  الذى لاواحد له وقد قان بعضهم واحده ابول مثل عجول وقال بعضهم ابسل قال ولم أجد
  العرب تعرف له واحدا وأبلت الابل والوحس تأين وتأبل أيولا أى اجتزآت بالرطب عن
  الماء ومنه قول لبيد
  واذاحز كت رج-لي أرقات • نى تعدوءدوجون قدأبل
  الواحد آبل والجع أبال مثل كافرو كفار وأبل الرجل عن امرأته اذا امتنع من غشيانها
  وتأ-بل وفى الحديت لدتأبل آدم عليه السلام على ابنه المقتول كذا وكذاعاما لايصيب
  -واء وأبل الرجل بالكسريأ بل أبالة مثل شكس شكاسة وتمه تماهة فهوابل وآبل أى حاذق
  عصلحة
