label: { ar: "سنن ابن ماجه 1466 — الأب والأبوة", en: "Sunan Ibn Majah 1466 — the father and fatherhood", ur: "سنن ابن ماجہ 1466 — باپ اور والدیت", es: "Sunan Ibn Majah 1466 — El padre y la paternidad", fr: "Sunan Ibn Majah 1466 — Le père et la paternité" }
text: "حَدَّثَنَا سَعِيدُ بْنُ يَحْيَى بْنِ الأَزْهَرِ الْوَاسِطِيُّ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، حَدَّثَنَا أَبُو بُرْدَةَ، عَنْ عَلْقَمَةَ بْنِ مَرْثَدٍ، عَنِ ابْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ لَمَّا أَخَذُوا فِي غُسْلِ النَّبِيِّ ـ نَادَاهُمْ مُنَادٍ مِنَ الدَّاخِلِ لاَ تَنْزِعُوا عَنْ رَسُولِ اللَّهِ ـ قَمِيصَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1466، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1466 (Chapters Regarding Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1466، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1466 (Capítulos sobre los funerales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1466 (Chapitres relatifs aux funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
