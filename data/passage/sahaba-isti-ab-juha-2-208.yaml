  tr: "\"Al-Isti'ab fi Ma'rifat al-Ashab\" (Sahabelerin Bilgisi Üzerine Kapsamlı Kitap), Resimli Cilt 2, s. 208'den, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Al-Isti'ab fi Ma'rifat al-Ashab\" (Kitab Lengkap tentang Pengetahuan Para Sahabat), Jilid 2 Bergambar, hlm. 208, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Islamic Folklore Browser."
