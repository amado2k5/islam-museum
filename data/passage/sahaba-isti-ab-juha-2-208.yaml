text: "… ذلك أنه إذا مضَى عالَمٌ بدَا طَبقُ حتَّى أحتَوى بيتُك المهيمنُ من خُزَاعي. باب خَوْلِيّ خَنْدفَ عليَاءَ تَحتَها النُّطُقُ وأَنتَ لَا وُلِدتَ أشْرقتِ ال - خَوْليّ بن أَبي خَولِي العِجْلي : هكذا قال ابنُ هشام، ونسبه إِلى عِجْل بن لُجيم، …"
summary:
