label:
  ar: "البخاري 7504 — إذا أحب عبدي لقائي أحببت لقاءه"
  en: "Bukhari 7504 — When My servant loves to meet Me, I love to meet him"
  ur: "بخاری 7504 — جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں"
text: "قال الله إذا أحب عبدي لقائي أحببت لقاءه، وإذا كره لقائي كرهت لقاءه ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7504: إذا أحب عبدي لقائي أحببت لقاءه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7504: When My servant loves to meet Me, I love to meet him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7504: جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
